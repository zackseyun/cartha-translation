base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/029.yaml
  text: Remember them[a], my God, because they have defiled the priesthood and the covenant of the priesthood and the Levites.
translation:
  language: ru
  text: Помяни их[a], Боже мой, за то, что они осквернили священство и завет священства и левитов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Помяни их, Боже мой, по поводу осквернителей священства и завета священства и левитов».'
    reason: Сноска передаёт субстантивированное причастие «осквернители» и сохраняет более формальную, несколько сжатую связь предлога «по поводу» с последующим выражением, не превращая его в ошибочное «о тех, кто».
lexical_decisions:
- source_word: זָכְרָה לָהֶם
  choice: Помяни их
  rationale: Просьба, обращённая к Богу, передана традиционным и понятным русским глаголом «помяни». Сам глагол не уточняет, благоприятно или во осуждение совершается это памятование; отрицательный смысл определяется последующим обвинением.
- source_word: אֱלֹהָי
  choice: Боже мой
  rationale: Форма с суффиксом первого лица единственного числа и прямое молитвенное обращение естественно передаются звательным по функции оборотом «Боже мой».
- source_word: עַל
  choice: за то, что
  rationale: Предлог указывает на основание неблагоприятного памятования. Оборот «за то, что» ясно передаёт причинно-судебный смысл в современном русском языке.
- source_word: גָּאֳלֵי
  choice: они осквернили
  rationale: Причастие от גאל в значении «осквернять» употреблено субстантивно. Личная глагольная конструкция по-русски звучит естественнее, сохраняя смысл совершённого ими осквернения.
- source_word: הַכְּהֻנָּה
  choice: священство
  rationale: Существительное обозначает священническое достоинство или установление, а не просто совокупность священников.
- source_word: וּבְרִית הַכְּהֻנָּה וְהַלְוִיִּם
  choice: и завет священства и левитов
  rationale: Формулировка сохраняет сжатую связь элементов в еврейском тексте и не уточняет сверх необходимого, идёт ли речь о завете со священниками и левитами или о завете, относящемся к их служению.
theological_decisions:
- issue: Благоприятное или неблагоприятное памятование
  choice: Неблагоприятное памятование ввиду осквернения
  alternative: Нейтральное или благоприятное «помяни их»
  rationale: Само выражение «помяни их» остаётся формально нейтральным, но оборот «за то, что они осквернили» ясно задаёт судебный контекст, не добавляя к глаголу отсутствующего в нём значения.
- issue: Объём выражения о завете священства и левитов
  choice: Сохранена общая, синтаксически сжатая связь священства и левитов с заветом
  alternative: «Завет со священниками и левитами» либо отдельное понимание левитов как ещё одного объекта осквернения
  rationale: Еврейская конструкция допускает некоторую неоднозначность. Буквенно близкая русская формулировка не навязывает одно из более конкретных толкований.
translation_notes:
  register: Современный литературный русский язык с молитвенно-библейским достоинством. «Помяни» уместно для прямого обращения к Богу и остаётся понятным современному читателю; порядок слов не архаизирован сверх необходимости.
