revisions:
- from: Не из-за них ли согрешил Соломон, царь Израиля? Среди множества народов не было царя, подобного ему. Он был любим своим Богом, и Бог поставил его царём над всем Израилем. Но даже его иноземные женщины[a] ввели в грех.
  to: Разве не из-за этого согрешил Соломон, царь Израиля? И среди столь многих народов не было царя, подобного ему; он был любим своим Богом, и Бог поставил его царём над всем Израилем. Но даже его иноземные женщины[a] ввели в грех.
  rationale: Редакция устраняет необоснованное сужение «этих обстоятельств» до одних женщин, сохраняет синтаксическую связь исходного текста и делает каузативную последнюю фразу полностью ясной. Смысл, акцент на Соломоне и лексическая сноска сохранены.
