source:
  edition: WLC
  text: הֲ/ל֣וֹא עַל אֵ֣לֶּה חָטָֽא שְׁלֹמֹ֣ה מֶ֣לֶךְ יִשְׂרָאֵ֡ל וּ/בַ/גּוֹיִ֣ם הָ/רַבִּים֩ לֹֽא הָיָ֨ה מֶ֜לֶךְ כָּמֹ֗/הוּ וְ/אָה֤וּב לֵֽ/אלֹהָי/ו֙ הָיָ֔ה וַ/יִּתְּנֵ֣/הוּ אֱלֹהִ֔ים מֶ֖לֶךְ עַל כָּל יִשְׂרָאֵ֑ל גַּם אוֹת֣/וֹ הֶחֱטִ֔יאוּ הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/026.yaml
  text: Was it not because of these things that Solomon king of Israel sinned? Yet among the many nations there was no king like him[a], and he was loved by his God, and God made him king over all Israel. Even him foreign women caused to sin.
translation:
  language: ru
  text: Разве не из-за этого согрешил Соломон, царь Израиля? И среди столь многих народов не было царя, подобного ему; он был любим своим Богом, и Бог поставил его царём над всем Израилем. Но даже его иноземные женщины[a] ввели в грех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иноземные жёны». В еврейском тексте буквально сказано «иноземные женщины»; вариант «жёны» следует из истории Соломона, но в этом стихе прямо не выражен.'
    reason: 'Лексическая альтернатива: контекст допускает более узкое значение, чем явно выражено существительным נָשִׁים.'
lexical_decisions:
- source_word: הֲלוֹא עַל אֵלֶּה
  choice: Не из-за них ли
  rationale: Риторический вопрос ожидает утвердительного ответа. Местоимение «них» сохраняет множественное указание אֵלֶּה и естественно отсылает к женщинам, о которых говорится в контексте, не добавляя отсутствующего в еврейском тексте существительного.
- source_word: חָטָא
  choice: согрешил
  rationale: Обычное и точное обозначение нравственно-религиозного проступка.
- source_word: וּבַגּוֹיִם הָרַבִּים לֹא הָיָה מֶלֶךְ כָּמֹהוּ
  choice: Среди множества народов не было царя, подобного ему
  rationale: Передаёт сравнительную конструкцию и масштаб утверждения естественным литературным русским языком.
- source_word: וְאָהוּב לֵאלֹהָיו הָיָה
  choice: Он был любим своим Богом
  rationale: Сохраняет страдательно-признаковое значение אָהוּב и местоименный суффикс «его Бог», по-русски естественно выраженный возвратным «своим».
- source_word: וַיִּתְּנֵהוּ אֱלֹהִים מֶלֶךְ
  choice: Бог поставил его царём
  rationale: В данной конструкции נתן означает назначение или возведение на царство; «поставил царём» точно и идиоматично.
- source_word: גַּם אוֹתוֹ
  choice: Но даже его
  rationale: Фронтированное дополнение подчёркивает, что даже столь исключительный и любимый Богом царь оказался введён в грех. «Но» естественно выявляет заложенный контекстом контраст.
- source_word: הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: иноземные женщины
  rationale: «Женщины» прямо передаёт נָשִׁים, а «иноземные» — их принадлежность к другим народам; значение «жёны» возможно по контексту истории Соломона, но в самом стихе явно не выражено.
- source_word: הֶחֱטִיאוּ
  choice: ввели в грех
  rationale: Передаёт каузативную форму глагола חטא естественнее по-русски, чем буквальное «заставили согрешить», не уточняя механизм их влияния.
theological_decisions:
- issue: Причина греха Соломона
  choice: Иноземные женщины ввели Соломона в грех
  alternative: Женщины соблазнили его; браки с иноземками привели его к идолопоклонству
  rationale: Каузативный глагол прямо приписывает женщинам роль в его согрешении, но перевод не добавляет конкретного механизма или вида греха из параллельного повествования.
- issue: Передача אֱלֹהִים и לֵאלֹהָיו
  choice: своим Богом; Бог
  alternative: Господом; его Бог поставил его царём
  rationale: В первой фразе сохранён местоименный суффикс, а во второй — самостоятельное אֱלֹהִים. Заветное имя YHWH в тексте отсутствует, поэтому «Господь» было бы неоправданным уточнением.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Краткие предложения сохраняют ход аргумента и риторический контраст; архаизмы и конфессионально окрашенные добавления исключены.
