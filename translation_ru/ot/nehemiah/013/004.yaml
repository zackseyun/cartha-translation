    issue: Передача имени «Елиашив»
    rationale: В еврейском имени присутствует йод после ламеда (אֶלְיָשִׁיב); русская форма «Елияшив» точнее передаёт исходную форму.
  - severity: low
    issue: «Был близок к Товии»
    rationale: В современном русском это преимущественно обозначает личную близость или симпатию. Еврейское выражение может указывать на родство либо тесную социальную связь; более нейтральный оборот лучше сохраняет эту широту.
