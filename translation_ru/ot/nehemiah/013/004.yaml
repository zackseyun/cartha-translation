  yaml_path: translation/ot/nehemiah/013/004.yaml
  text: Before this[a], Eliashib the priest, who had been appointed over the chamber of the house of our God, was related to Tobiah—
translation:
  language: ru
  text: А прежде этого священник Елияшив, поставленный над кладовой в доме Бога нашего, находился в близкой связи с Товией[a]…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть состоял с Товией в родстве или в близких отношениях. Еврейское выражение допускает оба значения.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְנֵי מִזֶּה
  choice: А прежде этого
  rationale: Передаёт соединительный וְ и временное выражение «прежде этого», связывая стих с предшествующим повествованием.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן
  choice: священник Елиашив
  rationale: Естественный русский порядок слов при точной передаче имени и определённого титула.
- source_word: נָתוּן בְּלִשְׁכַּת בֵּית אֱלֹהֵינוּ
  choice: поставленный над кладовой дома Бога нашего
  rationale: נָתוּן в данном сочетании указывает на назначение или ответственность; לִשְׁכָּה в храмовом контексте может обозначать помещение-кладовую. «Над» естественно выражает порученное управление.
- source_word: קָרוֹב לְטוֹבִיָּה
  choice: был близок к Товии
  rationale: 'Сохраняет смысловую широту еврейского оборота: он может обозначать как родство, так и близкую социальную связь, не выбирая без достаточных оснований только один вариант.'
