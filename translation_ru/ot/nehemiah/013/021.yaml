base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/021.yaml
  text: So I warned them and said to them[a], “Why are you spending the night in front of the wall? If you do it again, I will lay hands on you.” From that time on they did not come on the Sabbath.
translation:
  language: ru
  text: 'Тогда я предостерёг их и сказал им: «Почему вы ночуете перед стеной? Если повторите это, я применю против вас силу[a]». С того времени они больше не приходили в субботу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пошлю руку против вас».'
    reason: Сноска сохраняет образность еврейского оборота, тогда как основной текст передаёт его угрожающий смысл естественным современным русским выражением.
lexical_decisions:
- source_word: וָאָעִידָה
  choice: я предостерёг
  rationale: Порода hифиль глагола עוד здесь выражает торжественное предостережение; «предостерёг» передаёт серьёзность угрозы и естественно звучит по-русски.
- source_word: לֵנִים
  choice: ночуете
  rationale: Глагол לין означает оставаться или проводить ночь; краткое «ночуете» точно и естественно в прямой речи.
- source_word: נֶגֶד הַחוֹמָה
  choice: перед стеной
  rationale: נֶגֶד указывает на положение напротив или перед объектом. «Перед стеной» сохраняет пространственную формулировку текста, не добавляя прямо не названного «за стеной».
- source_word: אִם תִּשְׁנוּ
  choice: если повторите это
  rationale: שנה здесь значит «повторить, сделать снова»; местоимение «это» естественно восполняет подразумеваемое действие.
- source_word: יָד אֶשְׁלַח בָּכֶם
  choice: я применю к вам силу
  rationale: Буквально «пошлю/простру руку против вас» — угрожающий оборот, обозначающий принудительные меры. Русское «применю к вам силу» ясно передаёт смысл, не уточняя вид наказания.
- source_word: מִן הָעֵת הַהִיא
  choice: с того времени
  rationale: Точное и естественное обозначение начального момента последующего положения дел.
- source_word: לֹא בָאוּ בַּשַּׁבָּת
  choice: они больше не приходили в субботу
  rationale: Русское «больше не приходили» естественно выражает прекращение повторявшегося действия после предостережения; «в субботу» является обычной передачей בַּשַּׁבָּת.
