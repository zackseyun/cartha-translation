source:
  edition: WLC
  text: כִּ֣י לֹ֧א קִדְּמ֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בַּ/לֶּ֣חֶם וּ/בַ/מָּ֑יִם וַ/יִּשְׂכֹּ֨ר עָלָ֤י/ו אֶת בִּלְעָם֙ לְ/קַֽלְל֔/וֹ וַ/יַּהֲפֹ֧ךְ אֱלֹהֵ֛י/נוּ הַ/קְּלָלָ֖ה לִ/בְרָכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/002.yaml
  text: because they did not meet the sons of Israel with bread and water[a], and hired Balaam against them to curse them, but our God turned the curse into a blessing.
translation:
  language: ru
  text: потому что они не вышли навстречу сынам Израиля с хлебом и водой и он нанял против него Валаама, чтобы проклясть его[a], но наш Бог обратил проклятие в благословение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «против него, чтобы проклясть его»; Израиль представлен как единое целое. Глагол «нанял» стоит в единственном числе; вероятно, подразумевается Валак.'
    reason: Сноска сохраняет и объясняет коллективное единственное число по отношению к Израилю, а также отмечает единственное число глагола без ложного утверждения о варианте множественного числа.
lexical_decisions:
- source_word: קִדְּמוּ
  choice: не встретили
  rationale: Передаёт конкретное действие — выйти навстречу или принять пришедших; сочетание «с хлебом и водой» остаётся естественным.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Сохраняет явное родственное обозначение оригинала и звучит в русском библейском повествовании естественно и достойно.
- source_word: בַּלֶּחֶם וּבַמָּיִם
  choice: с хлебом и водой
  rationale: Точно сохраняет названные в еврейском тексте основные припасы и связь с Второзаконием 23:4.
- source_word: וַיִּשְׂכֹּר עָלָיו אֶת בִּלְעָם
  choice: и наняли против него Валаама
  rationale: «Наняли» согласовано с ближайшим множественным субъектом в русском изложении, тогда как местоимение «против него» сохраняет масоретский коллективный singular, относящийся к Израилю.
- source_word: לְקַלְלוֹ
  choice: чтобы проклясть его
  rationale: Сохраняет единственное число еврейского суффикса и представляет Израиль как единое целое.
- source_word: וַיַּהֲפֹךְ
  choice: обратил
  rationale: «Обратил … в …» — точная и естественная русская конструкция для преобразования одного в другое.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Сохраняет явно выраженное притяжательное значение.
- source_word: הַקְּלָלָה לִבְרָכָה
  choice: проклятие в благословение
  rationale: Естественно передаёт контраст и конструкцию превращения.
theological_decisions:
- issue: Родовое обозначение Израиля
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Формулировка сохраняет явный образ потомства/сыновства в исходном выражении, не добавляя конфессионального толкования.
- issue: Коллективное единственное число в отношении Израиля
  choice: против него, чтобы проклясть его
  alternative: против них, чтобы проклясть их
  rationale: Масоретский текст дважды использует местоименный суффикс единственного числа, представляя Израиль как коллективное целое. Эта особенность сохранена в основном тексте, а значение пояснено сноской.
- issue: Число субъекта при найме Валаама
  choice: наняли
  alternative: нанял
  rationale: Еврейская глагольная форма записана без согласных различий между соответствующими чтениями, хотя масоретская огласовка указывает единственное число. Контекст стиха говорит об аммонитянах и моавитянах во множественном числе, поэтому русское «наняли» сохраняет связность, а вариант огласовки отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис остаётся ясным; «сыны Израиля» сознательно сохраняет формальный образ оригинала. Маркер сноски поставлен непосредственно после последнего элемента, который она поясняет.
