  text: בַּ/יָּמִ֣ים הָ/הֵ֡מָּה רָאִ֣יתִי בִֽ/יהוּדָ֣ה דֹּֽרְכִֽים גִּתּ֣וֹת בַּ/שַּׁבָּ֡ת וּ/מְבִיאִ֣ים הָ/עֲרֵמ֣וֹת וְֽ/עֹמְסִ֪ים עַל הַ/חֲמֹרִ֟ים וְ/אַף יַ֜יִן עֲנָבִ֤ים וּ/תְאֵנִים֙ וְ/כָל מַשָּׂ֔א וּ/מְבִיאִ֥ים יְרוּשָׁלִַ֖ם בְּ/י֣וֹם הַ/שַּׁבָּ֑ת וָ/אָעִ֕יד בְּ/י֖וֹם מִכְרָ֥/ם צָֽיִד׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/015.yaml
  text: In those days I saw in Judah people treading winepresses on the Sabbath, and bringing in heaps of grain and loading them on donkeys—and also wine, grapes, figs, and every kind of load—and bringing them into Jerusalem on the Sabbath day. So I testified against them on the day they sold food.
translation:
  language: ru
  text: В те дни я увидел, как в Иудее в субботу топчут виноград в давильнях, приносят снопы[a] и грузят их на ослов, а также вино, виноград, смоквы и всевозможные грузы, доставляя всё это в Иерусалим в субботний день. Я предостерёг их[b] в тот день, когда они продавали пищу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кучи зерна»; буквально: «кучи».'
    reason: Еврейское הָעֲרֵמוֹת не уточняет, были ли это снопы или сложенное в кучи зерно.
  - marker: b
    text: 'Или: «засвидетельствовал против них».'
    reason: Еврейский глагол может означать как торжественно предостеречь, так и свидетельствовать против кого-либо.
lexical_decisions:
- source_word: דֹּרְכִים גִּתּוֹת
  choice: топчут виноград в давильнях
  rationale: Глагол означает «топтать», а сочетание с «давильнями» описывает выжимание винограда ногами; дополнение «виноград» естественно и ясно передаёт подразумеваемое действие.
- source_word: הָעֲרֵמוֹת
  choice: снопы
  rationale: Буквально слово обозначает «кучи»; в сельскохозяйственном контексте речь, вероятнее всего, о собранном и сложенном зерне или снопах. Неопределённость отражена в сноске.
- source_word: וְעֹמְסִים עַל הַחֲמֹרִים
  choice: навьючивают их на ослов
  rationale: Передаёт погрузку сельскохозяйственного товара на вьючных животных естественным русским выражением.
- source_word: כָל מַשָּׂא
  choice: всевозможные грузы
  rationale: Сохраняет широкий смысл «всякий груз, ноша» и не ограничивает перечень только продуктами.
- source_word: צָיִד
  choice: пищу
  rationale: В данном торговом контексте слово обозначает съестные припасы или продовольствие; «пищу» — ясный и не избыточно конкретный эквивалент.
theological_decisions:
- issue: Сила выражения וָאָעִיד
  choice: Я предостерёг их
  alternative: Я засвидетельствовал против них
  rationale: В контексте обличения нарушения субботы глагол выражает торжественное предупреждение. Основной текст передаёт коммуникативную функцию, а более формальная судебно-свидетельская возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «По субботам» естественно передаёт повторяющуюся практику в первой части стиха, тогда как «в субботний день» сохраняет формулировку второй части. Перечень оформлен плавно, без устранения исходного нарастания деталей.
