base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/027.yaml
  text: Should we then listen to you and do all this great evil[b][a], acting unfaithfully against our God by marrying foreign women?
translation:
  language: ru
  text: Неужели и о вас услышим, что вы совершаете всё это великое зло, изменяя нашему Богу и беря в жёны чужеземок?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поселяя чужеземных женщин»; по контексту имеется в виду брать их в жёны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנִשְׁמַע וְלָכֶם
  choice: Неужели и о вас придётся услышать
  rationale: 'Нифаль глагола שׁמע допускает безлично-пассивное понимание «быть услышанным; стать известным», а וְלָכֶם — отнесение сообщения к адресатам: «и о вас». В данном контексте это естественно продолжает пример Соломона в предыдущем стихе и сохраняет риторический вопрос.'
- source_word: לַעֲשֹׂת אֵת כָּל הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: что вы совершаете всё это великое зло
  rationale: Инфинитив передан придаточным, раскрывающим содержание того, что может стать известно. כָּל сохранено словом «всё», а сочетание «совершать зло» естественно для современного литературного русского языка.
- source_word: לִמְעֹל בֵּאלֹהֵינוּ
  choice: поступая неверно против нашего Бога
  rationale: מעל обозначает нарушение верности, особенно в отношениях с Богом. «Поступая неверно» передаёт идею измены верности без сведения смысла лишь к обрядовому проступку; «против» отражает направленность нарушения.
- source_word: לְהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: беря в жёны чужеземок
  rationale: Буквально Hiphil ישׁב означает «поселять; давать жить». В контексте Неем 13 речь идёт о введении чужеземных женщин в дом в качестве жён, поэтому идиоматическое «брать в жёны» ясно передаёт смысл; буквальная образность отмечена в сноске.
theological_decisions:
- issue: Характер проступка в לִמְעֹל בֵּאלֹהֵינוּ
  choice: нарушение верности Богу
  alternative: общее злодеяние против Бога или культовое преступление
  rationale: Глагол מעל несёт оттенок вероломства и нарушения обязательств перед Богом. Формулировка «поступая неверно» сохраняет этот богословский вес, не ограничивая проступок исключительно ритуальной сферой.
- issue: Синтаксис הֲנִשְׁמַע וְלָכֶם
  choice: «Неужели и о вас придётся услышать»
  alternative: «Неужели нам слушаться вас»
  rationale: 'Обе конструкции грамматически обсуждаемы. В контексте предшествующего упоминания греха Соломона пассивно-безличное понимание создаёт связный вопрос: неужели подобное будет сообщаться и об адресатах. Альтернативное понимание не следует догматизировать, но оно менее естественно в непосредственном контексте.'
translation_notes:
  register: Современный литературный русский язык с достоинством риторического обличения. «Чужеземки» точнее и естественнее здесь, чем двусмысленное «чужие женщины». Основной текст следует наиболее вероятному контекстуальному разбору пассивной формы, сохраняя брачный смысл последней фразы и отмечая её буквальное выражение в сноске.
