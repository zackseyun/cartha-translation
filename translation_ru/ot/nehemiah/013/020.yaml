source:
  edition: WLC
  text: וַ/יָּלִ֨ינוּ הָ/רֹכְלִ֜ים וּ/מֹכְרֵ֧י כָל מִמְכָּ֛ר מִ/ח֥וּץ לִ/ירוּשָׁלִָ֖ם פַּ֥עַם וּ/שְׁתָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/020.yaml
  text: Then the merchants and sellers of every kind of goods spent the night outside Jerusalem once or twice[a][b].
translation:
  language: ru
  text: Тогда торговцы и продавцы всякого товара ночевали за пределами Иерусалима раз или два[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «раз и два»; то есть один или два раза.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּלִינוּ
  choice: ночевали
  rationale: Глагол לון означает проводить ночь, ночевать. «Ночевали» естественно и точно передаёт временное пребывание, не подразумевая постоянного поселения.
- source_word: הָרֹכְלִים
  choice: торговцы
  rationale: רֹכֵל обозначает торговца, в том числе разносчика. Нейтральное «торговцы» соответствует контексту и не сужает способ торговли.
- source_word: וּמֹכְרֵי כָל מִמְכָּר
  choice: и продавцы всякого товара
  rationale: Формулировка сохраняет широкий охват исходного выражения — людей, продававших любой товар, — и звучит естественно по-русски.
- source_word: מִחוּץ לִירוּשָׁלָם
  choice: за пределами Иерусалима
  rationale: Выражение ясно обозначает местонахождение вне города; «за пределами» естественно для современного литературного русского языка.
- source_word: פַּעַם וּשְׁתָּיִם
  choice: раз или два
  rationale: Буквально «раз и два»; это идиоматическое указание на один или два случая. «Раз или два» передаёт смысл, не преувеличивая частоту.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанное. Союзно-временное «тогда» естественно связывает действие с предыдущим контекстом, а коммерческая лексика остаётся широкой и нейтральной.
