  text: וּ/לְ/קֻרְבַּ֧ן הָ/עֵצִ֛ים בְּ/עִתִּ֥ים מְזֻמָּנ֖וֹת וְ/לַ/בִּכּוּרִ֑ים זָכְרָ/ה לִּ֥/י אֱלֹהַ֖/י לְ/טוֹבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/031.yaml
  text: And for the offering of wood at appointed times[a], and for the firstfruits—remember me, my God, for good.
translation:
  language: ru
  text: И о приношении дров в назначенные сроки[a], и о начатках. Вспомни меня, Боже мой, во благо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о дровяном приношении». Речь идёт об установленной доставке дров для храмового служения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קֻרְבַּן הָעֵצִים
  choice: приношение дров
  rationale: Передаёт культовое приношение или установленную доставку древесины для храмового служения, сохраняя при этом сжатость еврейского выражения.
- source_word: בְּעִתִּים מְזֻמָּנוֹת
  choice: в назначенные сроки
  rationale: Естественно выражает мысль о заранее установленных, регулярно наступающих сроках.
- source_word: בִּכּוּרִים
  choice: начатки
  rationale: Устоявшееся и понятное в библейском контексте обозначение первых плодов, посвящаемых Богу.
- source_word: זָכְרָה לִּי
  choice: Вспомни меня
  rationale: Прямо передаёт повторяющуюся молитвенную формулу Неемии, обращённую к Богу.
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Естественная русская форма прямого обращения с сохранением личного притяжательного значения.
- source_word: לְטוֹבָה
  choice: во благо
  rationale: Сохраняет краткость и смысловую открытость еврейской формулы, не уточняя, идёт ли речь о благосклонности, благословении или благом исходе.
theological_decisions:
- issue: Культовое выражение קֻרְבַּן הָעֵצִים
  choice: приношение дров
  alternative: дровяное приношение; доставка дров
  rationale: Выбранный вариант сохраняет культовую рамку слова קֻרְבַּן и не сводит выражение лишь к хозяйственной доставке, тогда как примечание поясняет храмовый контекст.
- issue: Заключительная просьба לְטוֹבָה
  choice: во благо
  alternative: благосклонно; мне во благо
  rationale: Так сохраняется богословская сдержанность оригинала без уточнения характера ожидаемого блага.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Союзная конструкция сохранена как продолжение перечня предыдущего контекста; перед заключительной молитвой поставлена точка для естественности русского синтаксиса.
