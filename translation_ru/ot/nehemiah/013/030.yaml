  text: וְ/טִֽהַרְתִּ֖י/ם מִ/כָּל נֵכָ֑ר וָ/אַעֲמִ֧ידָ/ה מִשְׁמָר֛וֹת לַ/כֹּהֲנִ֥ים וְ/לַ/לְוִיִּ֖ם אִ֥ישׁ בִּ/מְלַאכְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/030.yaml
  text: So I cleansed them from everything foreign[a], and I assigned duties for the priests and for the Levites, each in his work,
translation:
  language: ru
  text: И очистил я их от всего чужеземного[a] и установил служебные обязанности[b] для священников и левитов — каждому в его деле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от всего чужого»; букв. «от всякого чужеземного».'
    reason: Лексическая многозначность נֵכָר; выражение не следует сужать до чужеземцев как людей.
  - marker: b
    text: 'Или: «служебные смены», «служебные назначения» или «обязанности».'
    reason: Мִשְׁמָרוֹת может обозначать смены, порученные обязанности или установленные служебные назначения.
lexical_decisions:
- source_word: וְטִהַרְתִּים
  choice: И очистил я их
  rationale: Пиэль טהר означает «очищать». Сохранены прямое дополнение «их» и обычная повествовательная связь וְ как «и»; инверсия естественно подчёркивает итог действий Неемии.
- source_word: מִכָּל נֵכָר
  choice: от всего чужеземного
  rationale: נֵכָר обозначает чужое, иноземное или чужеземное. Субстантивированное «всё чужеземное» сохраняет широту выражения и не сужает его до одних лишь чужеземцев.
- source_word: וָאַעֲמִידָה
  choice: и установил
  rationale: 'Хифиль עמד здесь имеет административный смысл: установить, назначить, упорядочить.'
- source_word: מִשְׁמָרוֹת
  choice: порядок служения
  rationale: Множественное מִשְׁמָרוֹת может обозначать смены, обязанности или установленные участки службы. Контекстуальное выражение «порядок служения» естественно передаёт организацию священнического и левитского служения, а варианты отмечены в сноске.
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: для священников и левитов
  rationale: Обе служебные группы названы прямо; русский язык не требует повторения предлога перед вторым однородным членом.
- source_word: אִישׁ בִּמְלַאכְתּוֹ
  choice: каждому своё дело
  rationale: אִישׁ употреблено дистрибутивно, а מְלָאכָה означает работу, дело или порученную службу. Русская конструкция ясно передаёт распределение дела каждому участнику.
theological_decisions:
- issue: Объём выражений «их» и «всё чужеземное»
  choice: Оставить объект «их» без уточнения и передать נֵכָר широко как «всё чужеземное».
  alternative: «Очистил их от всех чужеземцев» или «очистил священников и левитов от чужеземных жён».
  rationale: Хотя контекст связан со смешанными браками и нарушениями среди священников, еврейская формулировка сама по себе шире и не позволяет безоговорочно свести очищение только к этнической группе или бракам.
- issue: Характер מִשְׁמָרוֹת
  choice: Передать как установленный порядок служения.
  alternative: «смены», «стражи» или «служебные обязанности».
  rationale: Термин допускает несколько связанных значений. Основной текст должен быть понятен современному читателю, не исключая более конкретного смысла распределённых смен или обязанностей.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный. Сохранена повествовательная форма от первого лица; двусмысленность относительно точного содержания очищения и характера служебного распределения не устранена.
