- from: Я назначил заведовать кладовыми священника Шелемию, писца Садока и Федаию из левитов, а при них[a] — Ханана, сына Заккура, сына Маттании, потому что они считались надёжными[b]. Им было поручено распределять между своими братьями[c].
  to: Я назначил заведовать кладовыми священника Шелемию, писца Садока и Федаию из левитов, а при них[a] — Ханана, сына Заккура, сына Маттании, потому что они считались надёжными[b]. Им было поручено распределять своим братьям[c].
  rationale: Заменено «между своими братьями» на «своим братьям», чтобы передать направленность לַאֲחֵיהֶם и не превратить поручение раздавать припасы в распределение внутри группы. Соответственно уточнена сноска c. Другие формулировки и сноски сохранены, поскольку они адекватно передают текст и его неоднозначность.
