  text: וָ/אוֹצְרָ֣/ה עַל א֠וֹצָרוֹת שֶׁלֶמְיָ֨ה הַ/כֹּהֵ֜ן וְ/צָד֣וֹק הַ/סּוֹפֵ֗ר וּ/פְדָיָה֙ מִן הַ/לְוִיִּ֔ם וְ/עַל יָדָ֔/ם חָנָ֥ן בֶּן זַכּ֖וּר בֶּן מַתַּנְיָ֑ה כִּ֤י נֶאֱמָנִים֙ נֶחְשָׁ֔בוּ וַ/עֲלֵי/הֶ֖ם לַ/חֲלֹ֥ק לַ/אֲחֵי/הֶֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/013.yaml
  text: And I appointed over the storerooms Shelemiah the priest[a], Zadok the scribe, and Pedaiah from the Levites, and Hanan son of Zaccur, son of Mattaniah, at their side, because they were considered faithful[c][b]; and it was upon them to distribute to their brothers.
translation:
  language: ru
  text: Я назначил заведовать кладовыми священника Шелемию, писца Садока и Федаию из левитов, а при них[a] — Ханана, сына Заккура, сына Маттании, потому что они считались надёжными[b]. Им было поручено распределять своим братьям[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под их началом». Еврейское выражение может обозначать как тесное сотрудничество, так и подчинённое служение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «считались верными».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «их братьям»; здесь имеются в виду их собратья по общине или служению.'
    reason: referent_clarification
lexical_decisions:
- source_word: וָאוֹצְרָה עַל אוֹצָרוֹת
  choice: Я назначил заведовать кладовыми
  rationale: Глагольная форма в данном административном контексте означает назначение ответственных, а אוֹצָרוֹת — помещения для хранения десятин и припасов. Формулировка естественна по-русски и передаёт управление кладовыми.
- source_word: שֶׁלֶמְיָה הַכֹּהֵן
  choice: священника Шелемию
  rationale: Имя передано транслитерацией с еврейского, звание переведено; винительный падеж обусловлен русским синтаксисом после «назначил».
- source_word: צָדוֹק הַסּוֹפֵר
  choice: писца Садока
  rationale: סֹפֵר может обозначать писца или административного секретаря; «писец» сохраняет традиционный широкий титул, не сужая должностную функцию.
- source_word: וּפְדָיָה מִן הַלְוִיִּם
  choice: и Федаию из левитов
  rationale: Сохраняется буквальное указание на принадлежность Федаии к группе левитов.
- source_word: וְעַל יָדָם
  choice: а при них
  rationale: Еврейская идиома может обозначать нахождение рядом, совместное служение либо подчинённое положение. «При них» сохраняет эту смысловую широту.
- source_word: חָנָן בֶּן זַכּוּר בֶּן מַתַּנְיָה
  choice: Ханана, сына Заккура, сына Маттании
  rationale: Имена транслитерированы непосредственно с еврейского; родословная связь передана без уточнений.
- source_word: כִּי נֶאֱמָנִים נֶחְשָׁבוּ
  choice: потому что они считались надёжными
  rationale: נֶאֱמָנִים выражает верность и надёжность, а נֶחְשָׁבוּ — оценку или признание таковыми. Перевод сохраняет оба компонента.
- source_word: וַעֲלֵיהֶם
  choice: Им было поручено
  rationale: Предложная конструкция обозначает возложенную ответственность. Русская формулировка естественно передаёт административную обязанность.
- source_word: לַחֲלֹק
  choice: распределять
  rationale: В контексте храмовых запасов глагол означает выдавать или распределять положенные доли. Дополнение не добавлено, поскольку в еврейском тексте оно подразумевается из контекста.
- source_word: לַאֲחֵיהֶם
  choice: между своими братьями
  rationale: Сохранён мужской термин родства «братья»; по контексту речь идёт о собратьях по общине или служению, но сам стих не уточняет группу.
theological_decisions:
- issue: Референт мужского термина אֲחֵיהֶם
  choice: своими братьями
  alternative: своими собратьями / другими левитами
  rationale: Исходный текст употребляет мужское множественное существительное «братья». Перевод не заменяет его более широким или конкретизированным обозначением, а контекстуальный смысл поясняется в сноске.
- issue: Характер качества נֶאֱמָנִים
  choice: надёжными
  alternative: верными
  rationale: В контексте распоряжения храмовыми запасами на первом плане доверие к назначенным людям. «Надёжными» передаёт административно-нравственный смысл, не исключая оттенка верности.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Административные формулировки сделаны ясными, а неоднозначность выражения וְעַל יָדָם и слова נֶאֱמָנִים сохранена и отражена в сносках.
