  naturalness: Текст в целом естественен для современного литературного русского. Исправление управления на «распределять своим братьям» устраняет смысловую двусмысленность и делает фразу идиоматичной.
  terminology: «Кладовые», «священник», «писец», «левиты», «надёжные» и «братья» уместны. «Братья» сохраняет мужской термин исходного текста, не сужая референт без достаточных оснований.
