  text: וָ/אָרִ֨יבָ/ה֙ אֶת הַ/סְּגָנִ֔ים וָ/אֹ֣מְרָ֔/ה מַדּ֖וּעַ נֶעֱזַ֣ב בֵּית הָ/אֱלֹהִ֑ים וָֽ/אֶ֨קְבְּצֵ֔/ם וָֽ/אַעֲמִדֵ֖/ם עַל עָמְדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/011.yaml
  text: So I contended with the officials and said[b][a], “Why has the house of God been neglected?” Then I gathered them and stationed them at their posts.
translation:
  language: ru
  text: 'И я вступил в спор с начальниками и сказал: «Почему дом Божий оставлен без попечения?[a]» Затем я собрал их и поставил их на свои места.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему дом Божий покинут?» Еврейский глагол может означать, что нечто оставили или покинули; здесь контекст указывает на отсутствие должной заботы о храмовом служении и его обеспечении.'
    reason: lexical_alternative
  - marker: b
    text: То есть вернул их к исполнению назначенных им обязанностей.
    reason: clarification
lexical_decisions:
- source_word: וָאָרִיבָה
  choice: я вступил в спор
  rationale: Глагол ריב передаёт открытое противостояние или спор. Такой перевод сохраняет его силу, не сводя действие лишь к упрёку.
- source_word: הַסְּגָנִים
  choice: с начальниками
  rationale: Слово обозначает должностных лиц, участвовавших в управлении. «Начальники» ясно и естественно передаёт их руководящее положение без излишне узкого административного титула.
- source_word: נֶעֱזַב
  choice: оставлен без попечения
  rationale: Пассивная форма глагола עזב может означать «оставлен» или «покинут». В данном контексте речь идёт о прекращении должной поддержки и служения при храме, поэтому формулировка «оставлен без попечения» передаёт как исходный образ оставления, так и практический смысл небрежения.
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Божий
  rationale: Сохраняется буквальный и традиционно понятный образ еврейского выражения без замены его более толковательным словом «храм».
- source_word: וָאֶקְבְּצֵם
  choice: я собрал их
  rationale: Прямо передаёт значение קבץ — собрать вместе; местоимение сохраняет связь с названными ранее служителями.
- source_word: וָאַעֲמִדֵם עַל עָמְדָם
  choice: поставил каждого на его место
  rationale: Выражение означает восстановление людей на положенных им местах служения. Русская формулировка сохраняет пространственный образ оригинала и естественно допускает функциональный смысл.
