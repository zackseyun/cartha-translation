  source_fidelity: 'Основной смысл передан верно: речь о тирянах, живших в Иерусалиме, которые в субботу привозили рыбу и другие товары и продавали их сынам Иуды. Однако «даже в самом Иерусалиме» выбирает предполагаемое эмфатическое прочтение последнего וּבִירוּשָׁלָ͏ִם как основное, тогда как еврейская координация сама по себе допускает более нейтральное «и в Иерусалиме».'
