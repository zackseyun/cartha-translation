base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/013/016.yaml
  text: Also Tyrians lived in it[a], bringing in fish and every kind of merchandise[b], and selling them on the Sabbath to the sons of Judah, and in Jerusalem.
translation:
  language: ru
  text: В Иерусалиме жили также тиряне. Они привозили рыбу и всевозможные товары и в субботу продавали всё это иудеям[a] — и в Иерусалиме.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам Иуды»; то есть жителям Иудеи, иудеям.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, с возможным усилением: «даже в самом Иерусалиме».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצֹּרִים
  choice: и тиряне
  rationale: Этноним обозначает выходцев из Тира; союз וְ продолжает перечисление нарушений субботы.
- source_word: יָשְׁבוּ בָהּ
  choice: В Иерусалиме жили
  rationale: Глагол означает «жить, обитать». Название города повторено вместо местоимения, поскольку так референт ясен и фраза естественно звучит по-русски.
- source_word: מְבִיאִים
  choice: Они привозили
  rationale: Причастная форма описывает продолжавшееся действие — доставку товаров в город.
- source_word: דָּאג
  choice: рыбу
  rationale: Существительное обозначает рыбу как предмет торговли.
- source_word: וְכָל מֶכֶר
  choice: и всевозможные товары
  rationale: מֶכֶר здесь означает товары, предназначенные для продажи; русское выражение передаёт обобщающее כָל естественно и без излишней буквальности.
- source_word: וּמֹכְרִים
  choice: и … продавали всё это
  rationale: Причастие продолжает описание регулярной деятельности; «всё это» ясно отсылает к рыбе и товарам и добавлено ради естественного русского синтаксиса.
- source_word: בַּשַּׁבָּת
  choice: по субботам
  rationale: Форма передаёт торговлю, происходившую в субботний день; множественное русское выражение естественно обозначает повторявшуюся практику.
- source_word: לִבְנֵי יְהוּדָה
  choice: иудеям
  rationale: Буквально «сынам Иуды»; в данном контексте это устойчивое обозначение жителей Иудеи, естественно передаваемое русским этнонимом.
- source_word: וּבִירוּשָׁלִָם
  choice: — даже в самом Иерусалиме
  rationale: Финальная фраза, вероятно, эмфатически подчёркивает, что торговля шла в самом святом городе; неоднозначность отражена в сноске.
theological_decisions:
- issue: Соблюдение субботы
  choice: Сохранено прямое указание, что торговля происходила по субботам, без добавочной нравственной оценки в самом стихе.
  alternative: Явно назвать торговлю нарушением субботы.
  rationale: Отрицательная оценка ясна из контекста главы, но в данном стихе еврейский текст лишь описывает действие.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Длинная еврейская причастная конструкция разделена на два предложения. Формулировка «даже в самом Иерусалиме» передаёт вероятное эмфатическое значение, а более буквальный вариант сохранён в сноске.
