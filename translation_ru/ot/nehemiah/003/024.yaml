base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/024.yaml
  text: After him[a], Binnui son of Henadad repaired another section[b], from the house of Azariah as far as the angle and as far as the corner.
translation:
  language: ru
  text: После него Биннуй, сын Хенадада, отремонтировал второй участок[a] — от дома Азарии до поворота стены[b] и до угла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ещё один участок». Еврейское выражение может обозначать как дополнительный участок, отремонтированный Биннуем, так и второй отмеренный отрезок.'
    reason: lexical_alternative
  - marker: b
    text: Еврейские слова, переведённые как «поворот стены» и «угол», близки по значению, но не тождественны; вероятно, речь идёт о двух расположенных рядом архитектурных элементах.
    reason: cultural_note
lexical_decisions:
- source_word: אַחֲרָיו
  choice: После него
  rationale: В перечне работ выражение обозначает последовательность участников; такой перевод естественен и не навязывает более строгой пространственной смежности.
- source_word: הֶחֱזִיק
  choice: восстановил
  rationale: Буквально глагол связан с укреплением, но в контексте Неемии 3 обозначает восстановительные работы на стене.
- source_word: בִּנּוּי בֶּן־חֵנָדָד
  choice: Биннуй, сын Хенадада
  rationale: Имена переданы транслитерацией, а патронимическая конструкция — обычным русским оборотом.
- source_word: מִדָּה שֵׁנִית
  choice: второй участок
  rationale: Сочетание буквально указывает на вторую меру или протяжённость; в контексте строительных работ «участок» ясно передаёт смысл, а «второй» сохраняет форму оригинала.
- source_word: מִבֵּית עֲזַרְיָה
  choice: от дома Азарии
  rationale: Сохраняет исходную конструкцию и естественно звучит по-русски.
- source_word: עַד הַמִּקְצוֹעַ
  choice: до поворота стены
  rationale: Слово обозначает угол, изгиб или место поворота. Перевод отличает этот архитектурный элемент от следующего פִּנָּה и поясняет топографический смысл без излишней конкретизации.
- source_word: וְעַד הַפִּנָּה
  choice: и до угла
  rationale: פִּנָּה обычно обозначает угол или угловую часть сооружения; повтор предлога «до» сохраняет последовательность ориентиров.
