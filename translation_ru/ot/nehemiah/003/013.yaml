base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/013.yaml
  text: Hanun and the inhabitants of Zanoah repaired the Valley Gate[a]. They built it and set up its doors, its bolts, and its bars, and repaired a thousand cubits of the wall[c][b], as far as the Dung Gate.
translation:
  language: ru
  text: Долинные ворота[a] чинили Ханун и жители Заноаха. Они отстроили ворота, установили их створки, запоры и засовы, а также починили тысячу локтей стены[b] — до Навозных ворот[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укрепляли Долинные ворота»; употреблённый здесь еврейский глагол может означать «делать прочным, укреплять», а в контексте этой главы — «чинить, восстанавливать».'
    reason: lexical_alternative
  - marker: b
    text: Тысяча локтей — приблизительно 450 метров.
    reason: cultural_note
  - marker: c
    text: 'Или: «Мусорных ворот».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: чинили
  rationale: В контексте восстановления стены глагол обозначает укрепление или ремонт порученного участка; «чинили» естественно передаёт строительный контекст, не исключая оттенка укрепления.
- source_word: שַׁעַר הַגַּיְא
  choice: Долинные ворота
  rationale: Естественное русское название городских ворот, сохраняющее значение еврейской определительной конструкции.
- source_word: יֹשְׁבֵי זָנוֹחַ
  choice: жители Заноаха
  rationale: Причастная форма обозначает людей, живущих в данном поселении; «жители» кратко и естественно по-русски.
- source_word: הֵמָּה בָנוּהוּ
  choice: Они отстроили их
  rationale: Глагол буквально значит «построили», но в контексте восстановления разрушенных ворот «отстроили» ясно передаёт повторное сооружение без лишней экспликации.
- source_word: וַיַּעֲמִידוּ
  choice: установили
  rationale: Каузативная форма означает «поставили, привели в стоячее положение»; применительно к створкам и креплениям естественно «установили».
- source_word: דַּלְתֹתָיו
  choice: их створки
  rationale: Множественное число обозначает дверные полотна ворот; «створки» точнее русского общего слова «двери» в данном архитектурном контексте.
- source_word: מַנְעֻלָיו
  choice: засовы
  rationale: Термин обозначает запирающие приспособления ворот; «засовы» соответствует древней конструкции и избегает современного представления о замках с ключами.
- source_word: בְרִיחָיו
  choice: запоры
  rationale: Слово обозначает брусья или иные элементы, которыми запирали ворота; «запоры» сохраняет отличие от предыдущего термина, не навязывая чрезмерно точной реконструкции.
- source_word: אֶלֶף אַמָּה
  choice: тысячу локтей
  rationale: Сохранена древняя мера длины и конкретность исходного текста; приблизительный современный эквивалент вынесен в примечание.
- source_word: בַּחוֹמָה
  choice: стены
  rationale: В сочетании с указанием протяжённости речь идёт об участке стены; русский родительный падеж передаёт это естественно.
- source_word: שַׁעַר הָשֲׁפוֹת
  choice: Навозные ворота
  rationale: Традиционное и прямое название ворот, вероятно связанных с вывозом навоза и прочих отходов; возможное более широкое значение отмечено в сноске.
