    rationale: В еврейском тексте объект не назван; в контексте подразумевается стена. «Её» передаёт этот контекст без расширения объёма действия.
  - severity: low
    issue: «да ещё и обожжённые» разговорно и вносит усилительное значение.
    rationale: וְהֵמָּה שְׂרוּפוֹת сообщает состояние камней; для литературного перевода достаточно «хотя они обожжены».
  - severity: low
    issue: Формулировка сноски «оставят это себе» неестественна по-русски.
    rationale: Более прозрачное «предоставят это самим себе» сохраняет буквальную направленность альтернативы, не выдавая её за несомненное значение.
