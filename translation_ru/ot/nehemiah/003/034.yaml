translation_notes:
  register: Современный литературный русский язык с достоинством историко-библейского повествования. Серия вопросов оформлена повтором «Неужели», чтобы передать стремительную насмешливую риторику оригинала. Подлинная неясность הֲיַעַזְבוּ לָהֶם отмечена сноской.
