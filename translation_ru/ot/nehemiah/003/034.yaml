  source_fidelity: В целом переданы говорящий, аудитория, насмешливая серия вопросов, жертвоприношения, завершение работы, образ «оживления» камней и их повреждение огнём. Однако «всё» необоснованно расширяет подразумеваемый объект трудного выражения הֲיַעַזְבוּ לָהֶם; лучше ограничиться подразумеваемой стеной («её»). Заключительное «да ещё и» — разговорное усиление, которого союз וְ сам по себе не требует.
  naturalness: Текст в основном естественен, но «из груд праха — да ещё и обожжённые» синтаксически тяжеловесно и стилистически разговорно для современного литературного библейского повествования. Перестройка с относительным придаточным ясно связывает признак «обожжённые» с камнями.
  terminology: «Войско Самарии», «приносить жертвы» и «оживят камни» точны и регистрово уместны. «Жалкие иудеи» адекватно передаёт оскорбительный оттенок הָאֲמֵלָלִים. Сноска сохраняет спорность трудного еврейского оборота, но её более буквальный вариант следует сформулировать по-русски естественнее.
