  to: 'И сказал он в присутствии своих братьев и войска Самарии: «Что делают эти жалкие иудеи? Неужели они сами восстановят её?[a] Неужели будут приносить жертвы? Неужели закончат за один день? Неужели оживят камни из груд праха, хотя они обожжены?»'
  rationale: Исправление устраняет добавочное «всё», делает финальный образ синтаксически ясным и литературно нейтральным, а также уточняет сноску. Неоднозначность הֲיַעַזְבוּ לָהֶם по-прежнему отмечена и не разрешается догматически.
