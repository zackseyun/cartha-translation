  text: וַ/יֹּ֣אמֶר לִ/פְנֵ֣י אֶחָ֗י/ו וְ/חֵיל֙ שֹֽׁמְר֔וֹן וַ/יֹּ֕אמֶר מָ֛ה הַ/יְּהוּדִ֥ים הָ/אֲמֵלָלִ֖ים עֹשִׂ֑ים הֲ/יַעַזְב֨וּ לָ/הֶ֤ם הֲ/יִזְבָּ֨חוּ֙ הַ/יְכַלּ֣וּ בַ/יּ֔וֹם הַ/יְחַיּ֧וּ אֶת הָ/אֲבָנִ֛ים מֵ/עֲרֵמ֥וֹת הֶ/עָפָ֖ר וְ/הֵ֥מָּה שְׂרוּפֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/034.yaml
  text: And he said before his brothers and the army of Samaria[a], and said, “What are these feeble Jews doing? Will they restore it for themselves? Will they sacrifice? Will they finish in a day? Will they revive the stones from the heaps of dust, though they are burned?”
translation:
  language: ru
  text: 'И сказал он в присутствии своих братьев и войска Самарии: «Что делают эти жалкие иудеи? Неужели они сами восстановят её?[a] Неужели будут приносить жертвы? Неужели закончат за один день? Неужели оживят камни из груд праха, хотя они обожжены?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно для истолкования. Возможны также переводы: «Неужели они отстроят её сами?» или, более буквально, «Неужели они предоставят это самим себе?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי אֶחָיו
  choice: перед своими братьями
  rationale: לִפְנֵי обозначает речь в чьём-либо присутствии, а אֶחָיו буквально означает «его братья». Контекст допускает значение «соратники», но буквальное выражение понятно по-русски и сохраняет открытость смысла.
- source_word: וְחֵיל שֹׁמְרוֹן
  choice: и войском Самарии
  rationale: חֵיל здесь обозначает военную силу; «войско» естественно для исторического повествования и соответствует военному контексту.
- source_word: הָאֲמֵלָלִים
  choice: жалкие
  rationale: Слово выражает презрительную оценку слабости и ничтожности; «жалкие» естественно передаёт насмешливое оскорбление.
- source_word: הֲיַעַזְבוּ לָהֶם
  choice: Неужели они сами всё восстановят?
  rationale: 'Оборот труден: עזב обычно значит «оставлять», однако в данном контексте вопрос, вероятно, насмешливо касается самостоятельного восстановления стены. «Сами всё восстановят» передаёт контекстуальный смысл, а сноска сохраняет лексическую неопределённость.'
- source_word: הֲיִזְבָּחוּ
  choice: Неужели будут приносить жертвы?
  rationale: זבח означает совершать жертвоприношение. Полная русская формулировка яснее, чем двусмысленное «жертвовать», и сохраняет религиозный смысл.
- source_word: הַיְכַלּוּ בַיּוֹם
  choice: Неужели закончат за один день?
  rationale: כלה в данной форме означает «закончить, завершить»; «за один день» идиоматично передаёт בַיּוֹם в насмешливом риторическом вопросе.
- source_word: הַיְחַיּוּ אֶת הָאֲבָנִים
  choice: Неужели оживят камни
  rationale: Сохранена яркая персонифицирующая метафора каузативной формы חיה — «оживить», без смыслового сглаживания до «восстановить».
- source_word: מֵעֲרֵמוֹת הֶעָפָר
  choice: из груд праха
  rationale: עֲרֵמוֹת — «груды», עָפָר — «прах, пыль, рыхлая земля». «Груды праха» сохраняет образ исходного текста и звучит достойно в русском библейском повествовании.
- source_word: וְהֵמָּה שְׂרוּפוֹת
  choice: да ещё и обожжённые
  rationale: Фраза указывает на повреждённое огнём состояние камней. «Да ещё и» естественно выявляет насмешливое усиление, подразумеваемое контекстом, не превращая его в строго логическую уступку.
