    rationale: В еврейском הַמֵּרֹנֹתִי основа топонима оканчивается на ת (Meronoth/Меронот), а не на согласный, соответствующий русскому «ф».
  - severity: medium
    issue: «Для наместнической резиденции»
    rationale: Такая конструкция задаёт целевое значение («для нужд резиденции»), которого исходная формула в перечне работ не требует, и безоговорочно решает спорный смысл כִּסֵּא как резиденции.
  - severity: low
    issue: «Жители Гаваона и Мицпы»
    rationale: אַנְשֵׁי буквально обозначает людей/мужчин этих городов. «Люди из...» ближе к исходнику, оставаясь современным и естественным.
