base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/007.yaml
  text: And next to them Melatiah the Gibeonite and Jadon the Meronothite made repairs[a], along with the men of Gibeon and Mizpah, for the seat of the governor of the province Beyond the River.
translation:
  language: ru
  text: А рядом с ними восстанавливали Мелатия из Гаваона и Иадон из Меронота, а также люди из Гаваона и Мицпы — у места пребывания наместника области Заречье.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к престолу наместника Заречья». Слово, переведённое как «место пребывания», может обозначать официальную резиденцию наместника или, возможно, центр либо сферу его административной власти.'
    reason: Сохраняется неоднозначность כִּסֵּא и не навязывается ни исключительно пространственное, ни исключительно целевое понимание предлога לְ.
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: А рядом с ними
  rationale: Устойчивое выражение в перечне строительных работ Неемии обозначает соседний участок; современная русская формулировка сохраняет пространственный смысл.
- source_word: הֶחֱזִיק
  choice: восстанавливали
  rationale: В контексте Неемии 3 глагол означает участие в восстановлении или укреплении стены; «восстанавливали» естественно передаёт строительный контекст без излишнего уточнения объекта.
- source_word: מְלַטְיָה הַגִּבְעֹנִי
  choice: Мелатия из Гаваона
  rationale: Географическое определение передано естественной для современного русского языка конструкцией; топоним согласован с традиционной русской библейской формой.
- source_word: וְיָדוֹן הַמֵּרֹנֹתִי
  choice: и Иадон из Меронофа
  rationale: Имя и географическое определение переданы традиционной русской транслитерацией и ясной конструкцией происхождения.
- source_word: אַנְשֵׁי גִבְעוֹן וְהַמִּצְפָּה
  choice: а также жители Гаваона и Мицпы
  rationale: אַנְשֵׁי при названиях городов обозначает их людей; «жители» здесь естественнее и шире по смыслу, чем гендерно маркированное «мужчины».
- source_word: לְכִסֵּא פַּחַת
  choice: для наместнической резиденции
  rationale: כִּסֵּא буквально означает «сиденье, престол», но в административном контексте может обозначать официальное место пребывания наместника. Предлог לְ передан как «для», без внесения неявно выраженного значения предела «до».
- source_word: עֵבֶר הַנָּהָר
  choice: области Заречье
  rationale: Персидское административное наименование территории к западу от Евфрата передано кратким русским собственным названием «Заречье», а слово «область» поясняет административный статус.
