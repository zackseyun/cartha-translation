  yaml_path: translation/ot/nehemiah/003/038.yaml
  text: So we rebuilt the wall[a], and the whole wall was joined together up to half its height, for the people had a heart to work.
translation:
  language: ru
  text: Так мы отстроили стену, и вся стена сомкнулась, достигнув половины своей высоты, потому что народ был полон решимости работать[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у народа было сердце делать». Это выражение означает, что люди внутренне были готовы и твёрдо настроены работать.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּבְנֶה
  choice: Так мы отстроили
  rationale: Форма Qal wayyiqtol 1-го лица множественного числа продолжает повествование. «Отстроили» естественно передаёт восстановление уже существовавшей и разрушенной стены; «так» связывает результат с предшествующим рассказом.
- source_word: הַחוֹמָה
  choice: стену
  rationale: חוֹמָה обозначает городскую крепостную стену; определённость ясна из контекста.
- source_word: וַתִּקָּשֵׁר כָּל הַחוֹמָה
  choice: и вся стена сомкнулась
  rationale: Niphal глагола קשר описывает соединение отдельных участков стены в непрерывное целое. «Сомкнулась» кратко и естественно передаёт достигнутую непрерывность.
- source_word: עַד חֶצְיָהּ
  choice: достигнув половины своей высоты
  rationale: 'Буквально: «до её половины». В контексте строительства речь наиболее вероятно идёт о половине высоты стены; деепричастная конструкция ясно выражает степень завершённости.'
- source_word: וַיְהִי לֵב לָעָם לַעֲשׂוֹת
  choice: потому что народ был полон решимости работать
  rationale: Еврейская идиома буквально говорит о наличии у народа «сердца, чтобы делать» и выражает внутреннюю готовность и твёрдое намерение. Причинное «потому что» показывает, почему работа быстро продвигалась, а «работать» соответствует строительному контексту.
