  yaml_path: translation/ot/nehemiah/003/022.yaml
  text: After him the priests[a], the men of the plain, made repairs.
translation:
  language: ru
  text: После него ремонтировали священники, жители равнины[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жители округи». Еврейское слово כִּכָּר может обозначать равнину или округу; какая именно местность имеется здесь в виду, неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: После него
  rationale: Передаёт последовательность работ; начальное «и» естественно опускается в русском перечне без утраты связи с предыдущим стихом.
- source_word: הֶחֱזִיקוּ
  choice: ремонтировали
  rationale: В Неемии 3 глагол употреблён как контекстуальное обозначение участия в ремонте стены; этот вариант естественнее буквального «укрепляли».
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Прямой перевод определённого существительного во множественном числе.
- source_word: אַנְשֵׁי
  choice: жители
  rationale: Буквально «люди» или «мужи» данной местности; в географическом сочетании современное русское «жители» ясно выражает принадлежность к месту без ненужной тяжеловесности.
- source_word: הַכִּכָּר
  choice: равнины
  rationale: Слово может обозначать равнину либо округу/область; основной текст сохраняет конкретный географический образ, а неопределённость местной привязки отмечена в сноске.
