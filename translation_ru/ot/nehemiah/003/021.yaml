base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/021.yaml
  text: After him[a], Meremoth son of Uriah, son of Hakkoz, repaired another section, from the entrance of the house of Eliashib to the end of the house of Eliashib.
translation:
  language: ru
  text: После него Меремоф, сын Урии, сына Гаккоца, восстанавливал ещё один участок[a] — от входа в дом Елиашива до конца дома Елиашива.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «второй участок». Буквально: «вторая мера (протяжённость)». Вероятно, речь идёт о дополнительном участке, порученном Меремофу; ср. ст. 4.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: После него
  rationale: В перечне строительных работ эта формула обозначает последовательность участков и исполнителей; перевод сохраняет ход повествования, не сводя выражение лишь к пространственному соседству.
- source_word: הֶחֱזִיק
  choice: ремонтировал
  rationale: Хотя глагол буквально связан с укреплением, в контексте Неемии 3 он обозначает восстановительные работы. «Ремонтировал» ясно и естественно передаёт это значение.
- source_word: מְרֵמוֹת בֶּן אוּרִיָּה בֶּן הַקּוֹץ
  choice: Меремоф, сын Урии, сына Гаккоца
  rationale: Имена переданы в традиционной русской библейской форме, а родословная цепочка сохранена.
- source_word: מִדָּה שֵׁנִית
  choice: второй участок
  rationale: Буквальное значение сочетания — «вторая мера/протяжённость»; в строительном перечне речь идёт об участке работ. Формулировка сохраняет указание на второй или дополнительный отрезок, а возможный смысл «ещё один участок» отмечен в сноске.
- source_word: מִפֶּתַח בֵּית אֶלְיָשִׁיב
  choice: от входа в дом Елиашива
  rationale: פֶּתַח обозначает вход или дверной проём; «вход» естественно звучит в описании границ участка.
- source_word: וְעַד תַּכְלִית בֵּית אֶלְיָשִׁיב
  choice: до конца дома Елиашива
  rationale: תַּכְלִית здесь обозначает пространственный предел или край, а не отвлечённое завершение.
