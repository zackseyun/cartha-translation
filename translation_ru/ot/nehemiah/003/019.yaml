  yaml_path: translation/ot/nehemiah/003/019.yaml
  text: Next to him Ezer son of Jeshua[a], official of Mizpah[c][b], repaired another section opposite the ascent to the armory at the angle.
translation:
  language: ru
  text: Рядом с ним Езер, сын Иешуа, начальник Мицпы, восстановил ещё один участок[a] напротив подъёма к оружейной у угла[c].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «второй участок». Еврейское выражение может подчёркивать, что Езер восстановил дополнительный отрезок стены.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к арсеналу»; возможно также: «к оружию». Еврейское слово может обозначать оружие, но здесь, вероятно, подразумевается место, связанное с его хранением.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «у поворота».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: восстановил
  rationale: В Неемии 3 глагол употреблён в контексте восстановления стены; «восстановил» естественно передаёт смысл строительных работ, сохраняя идею приведения сооружения в прочное состояние.
- source_word: עַל יָדוֹ
  choice: Рядом с ним
  rationale: Устойчивая формула главы обозначает соседство участков и участников работ.
- source_word: עֵזֶר בֶּן יֵשׁוּעַ
  choice: Езер, сын Иисуса
  rationale: Имена переданы в привычной для русской библейской традиции форме; родственная связь выражена прямо.
- source_word: שַׂר הַמִּצְפָּה
  choice: начальник Мицпы
  rationale: שַׂר обозначает руководителя или должностное лицо; «начальник» понятно передаёт административную роль без монархического оттенка.
- source_word: מִדָּה שֵׁנִית
  choice: ещё один участок
  rationale: Буквально выражение допускает «второй участок», но в перечне работ, вероятно, указывает на дополнительный отрезок стены; неоднозначность отмечена в сноске.
- source_word: מִנֶּגֶד
  choice: напротив
  rationale: Передаёт пространственное положение перед ориентиром или лицом к нему.
- source_word: עֲלֹת
  choice: подъёма к
  rationale: Субстантивированная форма от עלה обозначает восходящий путь или подъём; русское выражение естественно в топографическом описании.
- source_word: הַנֶּשֶׁק
  choice: оружейной
  rationale: Существительное буквально связано с оружием, но в сочетании с топографическим ориентиром, вероятно, называет помещение или место хранения оружия.
- source_word: הַמִּקְצֹעַ
  choice: угла
  rationale: Слово обозначает угол или поворот стены; «угол» ясно и естественно передаёт архитектурный ориентир.
