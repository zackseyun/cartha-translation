lexical_decisions:
- source_word: אַחֲרָיו
  choice: После него
  rationale: Передаёт последовательность участков и работников в перечне ремонта, сохраняя прямое значение еврейского оборота.
- source_word: הֶחֱזִיקוּ
  choice: чинили
  rationale: В Неемии 3 глагол «укреплять» идиоматически обозначает восстановление стены; «чинили» естественно передаёт строительный контекст.
- source_word: אֲחֵיהֶם
  choice: их братья
  rationale: Сохраняет буквальное обозначение; в данном контексте оно может подразумевать соплеменников или товарищей по работе, а не только родных братьев.
- source_word: בַּוַּי
  choice: Баввай
  rationale: Следует огласованной форме WLC; вариант имени отмечен в сноске.
- source_word: בֶּן חֵנָדָד
  choice: сын Хенадада
  rationale: Естественная передача стандартной патронимической конструкции.
- source_word: שַׂר
  choice: начальник
  rationale: Современное и уместное обозначение должностного лица, управлявшего административной частью округа.
- source_word: חֲצִי פֶּלֶךְ
  choice: половины округа
  rationale: Передаёт административное подразделение без более масштабных ассоциаций слова «область» или «провинция».
- source_word: קְעִילָה
  choice: Кеилы
  rationale: Топоним транслитерирован и поставлен в естественную для русского синтаксиса форму родительного падежа.
