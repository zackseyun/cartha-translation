lexical_decisions:
- source_word: וְעַל־יָדָם
  choice: Рядом с ними
  rationale: Оборот буквально указывает на расположение «у их руки/стороны», а в перечне Неемии обозначает следующую соседнюю группу работников.
- source_word: הֶחֱזִיק
  choice: укреплял стену
  rationale: Hiphil от חזק буквально значит «делал крепким, укреплял»; в Неемии 3 глагол идиоматически описывает восстановительные работы. Добавление «стену» естественно передаёт подразумеваемый объект из контекста.
- source_word: רְפָיָה
  choice: Рефаия
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: בֶן־חוּר
  choice: сын Хура
  rationale: Стандартная патронимическая конструкция.
- source_word: שַׂר
  choice: начальник
  rationale: Слово обозначает руководителя или должностное лицо; «начальник» естественно сочетается с названием административной территории.
- source_word: חֲצִי פֶּלֶךְ
  choice: половины округа
  rationale: פֶּלֶךְ здесь обозначает административный округ, а конструкция указывает на одну из двух его частей.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалима
  rationale: Генитив естественно выражает принадлежность административного округа Иерусалиму.
