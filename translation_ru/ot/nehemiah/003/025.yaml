base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/025.yaml
  text: Palal son of Uzai repaired opposite the angle and the tower projecting from the upper house of the king[a], which is by the court of the guard[c][b]. After him Pedaiah son of Parosh repaired.
translation:
  language: ru
  text: Палал, сын Узая, восстанавливал участок напротив угла и башни, выступавшей из верхнего дома царя[a] и находившейся у двора стражи[b]. После него восстанавливал Педайя, сын Пароша.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из верхнего царского дворца». Буквально: «из верхнего дома царя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у двора тюрьмы». Вероятно, имеется в виду охраняемый двор, где содержали заключённых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: напротив
  rationale: 'Передаёт пространственное значение: участок находился перед указанным ориентиром или против него, без излишнего уточнения расстояния.'
- source_word: הַמִּקְצוֹעַ
  choice: угла
  rationale: Существительное обозначает угол или изгиб стены либо сооружения; «угол» естественно и точно в данном архитектурном контексте.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: выступающей башни
  rationale: Причастие от יצא описывает башню, выдающуюся наружу из стены или дворцового комплекса.
- source_word: מִבֵּית הַמֶּלֶךְ הָעֶלְיוֹן
  choice: верхнего царского дома
  rationale: Сохраняет буквальное «верхний дом царя» и не заменяет неоднозначное בית более толковательным словом «дворец».
- source_word: אֲשֶׁר לַחֲצַר הַמַּטָּרָה
  choice: что у двора стражи
  rationale: מטרה здесь указывает на охраняемый двор, вероятно связанный с содержанием заключённых; «двор стражи» не усиливает без необходимости тюремный оттенок.
- source_word: אַחֲרָיו
  choice: После него
  rationale: Формула вводит следующего работника или следующий участок в последовательности ремонтных работ.
- source_word: פָּלָל
  choice: Палал
  rationale: Транслитерация личного имени.
- source_word: אוּזַי
  choice: Узай
  rationale: Транслитерация личного имени с передачей конечного дифтонга, отражённого в масоретской огласовке.
- source_word: פְּדָיָה
  choice: Педая
  rationale: Транслитерация личного имени в форме, естественной для русской библейской ономастики.
- source_word: פַּרְעֹשׁ
  choice: Парош
  rationale: Транслитерация личного имени.
- source_word: '[эллипсис глагола при פְּדָיָה בֶן פַּרְעֹשׁ]'
  choice: восстанавливал
  rationale: В еврейском тексте глагол опущен и подразумевается из повторяющейся синтаксической модели Неемии 3; в русском его необходимо восполнить.
