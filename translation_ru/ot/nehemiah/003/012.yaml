    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: Рядом с ним
  rationale: В Неемии 3 это устойчивое указание на следующий, смежный участок работ; буквальное «у его руки» в современном русском было бы неясно.
- source_word: הֶחֱזִיק
  choice: восстанавливал стену
  rationale: В контексте главы форма глагола חזק обозначает участие в восстановлении укреплений. Добавление «стену» естественно уточняет подразумеваемый объект по контексту.
- source_word: שַׁלּוּם
  choice: Шаллум
  rationale: Еврейское личное имя передано транслитерацией, сохраняющей удвоенный согласный.
- source_word: בֶּן הַלּוֹחֵשׁ
  choice: сын Галлохеша
  rationale: Отчество передано транслитерацией имени הַלּוֹחֵשׁ; начальный согласный отражён традиционной для русского библейского регистра буквой «г».
- source_word: שַׂר חֲצִי פֶּלֶךְ יְרוּשָׁלִָם
  choice: начальник половины Иерусалимского округа
  rationale: שַׂר здесь означает административного руководителя, а פֶּלֶךְ — округ. Формулировка передаёт устройство округа, разделённого на две административные половины.
- source_word: הוּא וּבְנוֹתָיו
  choice: он и его дочери
  rationale: Сохранено эмфатическое местоимение и примечательное прямое указание на участие дочерей Шаллума.
