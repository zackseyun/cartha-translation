  text: וְ/אֵת֩ שַׁ֨עַר הָ/עַ֜יִן הֶ֠חֱזִיק שַׁלּ֣וּן בֶּן כָּל חֹזֶה֮ שַׂ֣ר פֶּ֣לֶךְ הַ/מִּצְפָּה֒ ה֤וּא יִבְנֶ֨/נּוּ֙ וִ/יטַֽלְלֶ֔/נּוּ ו/יעמידו דַּלְתֹתָ֔י/ו מַנְעֻלָ֖י/ו וּ/בְרִיחָ֑י/ו וְ֠/אֵת חוֹמַ֞ת בְּרֵכַ֤ת הַ/שֶּׁ֨לַח֙ לְ/גַן הַ/מֶּ֔לֶךְ וְ/עַד הַֽ/מַּעֲל֔וֹת הַ/יּוֹרְד֖וֹת מֵ/עִ֥יר דָּוִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/015.yaml
  text: And Shallun son of Col-hozeh[a], official of the district of Mizpah, repaired the Fountain Gate. He rebuilt it and roofed it, and set up its doors, its bolts, and its bars, and repaired the wall of the Pool of Shelah by the king’s garden, as far as the stairs that go down from the City of David.
translation:
  language: ru
  text: Ворота Источника восстанавливал Шаллун, сын Кол-Хозе, начальник округа Мицпы. Он отстроил их, покрыл крышей и установил их створки, замки и засовы. Он также восстановил стену пруда Шелах[a], рядом с царским садом, до ступеней, спускающихся из Города Давида.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционно этот водоём отождествляют с Силоамским прудом. В еврейском тексте здесь стоит название «Шелах».
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: Ворота Источника
  rationale: עַיִן обозначает природный источник воды; такое название естественно по-русски и соответствует топографии этого места.
- source_word: הֶחֱזִיק
  choice: ремонтировал / отремонтировал
  rationale: В Неемии 3 глагол употреблён как строительный термин для восстановления участка стены или ворот.
- source_word: שַׂר פֶּלֶךְ הַמִּצְפָּה
  choice: начальник округа Мицпы
  rationale: שַׂר обозначает руководителя или должностное лицо, а פֶּלֶךְ — административный округ; «начальник округа» ясно передаёт должность, не приравнивая её к наместнику.
- source_word: הוּא יִבְנֶנּוּ
  choice: Он отстроил их
  rationale: Местоимение הוּא выделяет самого Шаллума, а «отстроил» передаёт восстановительный характер работ. Русское множественное число согласовано с названием «ворота».
- source_word: וִיטַלְלֶנּוּ
  choice: покрыл крышей
  rationale: Глагол указывает на покрытие конструкции ворот, вероятно устройство кровли; выражение понятно современному читателю.
- source_word: ויעמידו דַּלְתֹתָיו מַנְעֻלָיו וּבְרִיחָיו
  choice: установил створки, запоры и засовы
  rationale: Передана последовательность оснащения ворот. «Створки» точнее обычного «двери» в отношении городских ворот; מַנְעֻלִים и בְּרִיחִים разграничены как запирающие устройства и поперечные засовы.
- source_word: חוֹמַת בְּרֵכַת הַשֶּׁלַח
  choice: стену у пруда Шелах
  rationale: Конструкция допускает связь стены с прудом; «у пруда» звучит естественно и не утверждает, что речь идёт о стенке самого водоёма. Имя Шелах непосредственно отражает еврейскую форму.
- source_word: לְגַן הַמֶּלֶךְ
  choice: рядом с царским садом
  rationale: Предлог לְ в топографическом описании выражает пространственное отношение или направление; «рядом с» естественно передаёт вероятную смежность.
- source_word: וְעַד הַמַּעֲלוֹת הַיּוֹרְדוֹת מֵעִיר דָּוִיד
  choice: до ступеней, спускающихся из Города Давида
  rationale: מַעֲלוֹת может обозначать ступени, а причастие הַיּוֹרְדוֹת прямо характеризует их как ведущие вниз; מִן обозначает исходную точку.
