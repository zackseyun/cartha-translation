  text: אַחֲרָ֧י/ו הֶחֱזִ֛יק צָד֥וֹק בֶּן אִמֵּ֖ר נֶ֣גֶד בֵּית֑/וֹ וְ/אַחֲרָ֤י/ו הֶחֱזִיק֙ שְׁמַֽעְיָ֣ה בֶן שְׁכַנְיָ֔ה שֹׁמֵ֖ר שַׁ֥עַר הַ/מִּזְרָֽח־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/029.yaml
  text: After him Zadok son of Immer made repairs opposite his house[a], and after him Shemaiah son of Shecaniah, keeper of the East Gate[c][b], made repairs.
translation:
  language: ru
  text: После него ремонтировал[a] Садок, сын Иммера, напротив своего дома[b]. После него ремонтировал Шемаия, сын Шехании, хранитель Восточных ворот[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «укреплял»; в этой главе еврейский глагол обозначает ремонт стены и ворот.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «перед своим домом»; еврейское выражение допускает оба пространственных оттенка.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «страж Восточных ворот».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: После него
  rationale: Эта повторяющаяся формула в Неемии 3 обозначает очередность участников и последовательность участков ремонта; русский вариант сохраняет обе возможные смысловые связи.
- source_word: הֶחֱזִיק
  choice: ремонтировал
  rationale: В породе hифиль глагол חזק буквально связан с укреплением, но в контексте Неемии 3 служит устойчивым обозначением ремонтных работ на стене и воротах.
- source_word: צָדוֹק בֶּן אִמֵּר
  choice: Садок, сын Иммера
  rationale: Имена переданы в принятой русской библейской форме, а родственная формула сохранена буквально.
- source_word: נֶגֶד בֵּיתוֹ
  choice: напротив своего дома
  rationale: נֶגֶד указывает на место перед домом или напротив него; возвратное местоимение естественно связывает дом с Садоком.
- source_word: שְׁמַעְיָה בֶן שְׁכַנְיָה
  choice: Шемаия, сын Шехании
  rationale: Имена переданы в традиционной русской библейской транслитерации с сохранением родственной формулы.
- source_word: שֹׁמֵר
  choice: хранитель
  rationale: Причастие обозначает постоянную обязанность или должность Шемаии при воротах; «хранитель» сохраняет более широкое значение, чем только несение караула.
- source_word: שַׁעַר הַמִּזְרָח
  choice: Восточные ворота
  rationale: Сочетание обозначает конкретные ворота; прописная буква передаёт функцию собственного топонимического названия.
