translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным повествовательным строем. Повтор «После него ремонтировал» сохранён как характерная формула перечня работ. Эллиптическая конструкция оригинала не дополнена словами «стену» или «участок», чтобы не вводить отсутствующий объект.
