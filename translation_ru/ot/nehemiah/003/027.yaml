base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/027.yaml
  text: After him the Tekoites repaired another section[a], opposite the great projecting tower, as far as the wall of Ophel.
translation:
  language: ru
  text: После него жители Фекои восстановили ещё один участок[a] — напротив большой выступающей башни и до стены Офела.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «второй участок». Еврейское выражение может подчёркивать, что жители Фекои восстановили ещё одну часть стены сверх упомянутой прежде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: После него
  rationale: В перечне строительных работ эта формула обозначает очередность участков; местоименный суффикс отсылает к предыдущему работнику.
- source_word: הֶחֱזִיקוּ
  choice: восстановили
  rationale: Буквально глагол означает «укрепили», но в Неемии 3 служит техническим обозначением восстановительных работ на стене.
- source_word: הַתְּקֹעִים
  choice: жители Фекои
  rationale: Этнохороним обозначает людей из города Фекоя; описательная форма естественна и понятна по-русски.
- source_word: מִדָּה שֵׁנִית
  choice: ещё один участок
  rationale: Фраза обозначает дополнительную, вторую часть работ, выполненную той же группой; неоднозначность отмечена в сноске.
- source_word: מִנֶּגֶד
  choice: напротив
  rationale: Предлог указывает на расположение перед ориентиром или напротив него.
- source_word: הַמִּגְדָּל הַגָּדוֹל הַיּוֹצֵא
  choice: большой выступающей башни
  rationale: Причастие буквально означает «выходящая» и в архитектурном контексте описывает башню, выступающую за линию стены.
- source_word: וְעַד
  choice: и до
  rationale: Выражение обозначает конечную границу восстанавливаемого участка.
- source_word: חוֹמַת הָעֹפֶל
  choice: стены Офела
  rationale: Конструкция «стена Офела» сохраняет грамматическую связь исходного текста и транслитерирует топоним.
