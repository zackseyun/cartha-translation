review_pass:
  verdict: revise
  source_fidelity: В целом перевод верно передаёт последовательность работ, жителей Фекои, отказ местной знати и множественное число «их господ». Однако «к труду для своих господ» менее точно передаёт конструкцию «в работе/на работе их господ» и может звучать так, будто труд предназначен господам, а не является их работой; лучше прямо выразить отказ участвовать в работе, которой руководят их господа.
  naturalness: «Рядом с ними ремонтировали стену жители Фекои» — естественно для современного литературного русского. Оборот «не склонили шеи, чтобы работать на своих господ» понятен, сохраняет образ шеи и звучит естественнее, чем «не склонили шеи к труду для своих господ».
  terminology: «Жители Фекои» удачно передаёт гентилик. «Знатные люди» приемлемо передаёт אַדִּירֵיהֶם; сноска с вариантом «влиятельные люди» полезна. «Господа» сохранено во множественном числе и не превращено в божественный титул.
  issues:
  - severity: medium
    issue: Связь с работой господ передана как «к труду для своих господ».
    rationale: Еврейское בַּעֲבֹדַת אֲדֹנֵיהֶם буквально относится к работе их господ/начальников. Предлог «для» несколько меняет отношение и в русском менее естественен в сочетании со «склонили шеи». Формулировка «чтобы работать на своих господ» яснее передаёт отказ участвовать в порученной работе.
  - severity: low
    issue: В сноске буквальный перевод употребляет единственное число «своей шеи».
    rationale: В еврейском стоит форма с притяжательным суффиксом множественного числа; по-русски следует написать «своих шей», хотя образ может пониматься собирательно.
