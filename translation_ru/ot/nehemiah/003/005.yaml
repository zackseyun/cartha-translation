revisions:
- from: Рядом с ними ремонтировали стену жители Фекои, но их знатные люди[a] не склонили шеи к труду для своих господ[b].
  to: Рядом с ними ремонтировали стену жители Фекои, но их знатные люди[a] не склонили шеи, чтобы работать на своих господ[b].
  rationale: Исправлена связь отказа с «работой их господ», чтобы точнее отразить еврейскую конструкцию и сохранить человеческий, множественный референт «господ». В буквальной сноске исправлено число притяжательного выражения. Остальной текст сохраняет исходный смысл и краткий стиль перечня строительных работ.
