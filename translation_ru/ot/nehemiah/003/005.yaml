  yaml_path: translation/ot/nehemiah/003/005.yaml
  text: And next to them the Tekoites made repairs[b][a], but their nobles would not put their necks to the work of their lords.
translation:
  language: ru
  text: Рядом с ними ремонтировали стену жители Фекои, но их знатные люди[a] не склонили шеи, чтобы работать на своих господ[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их влиятельные люди».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не принесли своих шей к работе своих господ» — образ отказа подчиниться и взяться за работу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Рядом с ними
  rationale: Оборот עַל־יָד в перечне ремонтных работ указывает на соседний участок стены; русский вариант естественно передаёт пространственную последовательность.
- source_word: הֶחֱזִיקוּ
  choice: ремонтировали стену
  rationale: В контексте Неемии 3 глагол означает восстановление или ремонт стены; добавление «стену» ясно передаёт подразумеваемый объект.
- source_word: הַתְּקוֹעִים
  choice: жители Фекои
  rationale: Гентилий обозначает выходцев или жителей города Фекои; описательный русский вариант понятнее формы «фекойцы».
- source_word: וְאַדִּירֵיהֶם
  choice: их знатные люди
  rationale: Слово обозначает влиятельных, высокопоставленных представителей местного общества; «знатные люди» сохраняет социальный оттенок без излишней конкретизации должности.
- source_word: לֹא הֵבִיאוּ צַוָּרָם
  choice: не склонили шеи
  rationale: Сохранён телесный образ еврейской идиомы, выражающий отказ подчиниться и взяться за назначенный труд.
- source_word: בַּעֲבֹדַת
  choice: к труду
  rationale: В данном строительном контексте עֲבֹדָה означает конкретную работу; сочетание естественно связано с образом склонённой шеи.
- source_word: אֲדֹנֵיהֶם
  choice: для своих господ
  rationale: Сохранены множественное число и человеческий социальный референт слова אֲדֹנִים; перевод не превращает его в указание на Господа.
theological_decisions:
- issue: К кому относится выражение אֲדֹנֵיהֶם («их господ»)
  choice: К человеческим начальникам или руководителям работ
  alternative: 'Истолковать как единственное число: «на дело Господа»'
  rationale: В еврейском тексте стоит форма множественного числа с притяжательным суффиксом «их»; её не следует богословски сглаживать до единственного божественного титула.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого летописного стиля перечня. Метафора шеи удержана, но оформлена привычным русским глаголом «склонить»; неоднозначное множественное «господа» сохранено и пояснено в сноске.
