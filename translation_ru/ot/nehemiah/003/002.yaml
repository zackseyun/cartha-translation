  text: וְ/עַל יָד֥/וֹ בָנ֖וּ אַנְשֵׁ֣י יְרֵח֑וֹ וְ/עַל יָד֣/וֹ בָנָ֔ה זַכּ֖וּר בֶּן אִמְרִֽי־ס־־׃ס
