  yaml_path: translation/ot/nehemiah/003/002.yaml
  text: And next to him the men of Jericho built[a], and next to them Zaccur the son of Imri built.
translation:
  language: ru
  text: Рядом с ним строили жители Иерихона[a], а рядом с ним строил Заккур, сын Имри.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужи Иерихона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדוֹ
  choice: рядом с ним
  rationale: Оборот עַל יָד с местоименным суффиксом обозначает соседний участок в последовательности работ; «рядом с ним» естественно передаёт пространственный смысл и сохраняет мужской род единственного числа исходного текста.
- source_word: בָּנוּ / בָּנָה
  choice: строили / строил
  rationale: Глагол בנה означает «строить». Хотя общий контекст говорит о восстановлении стены, в самом стихе употреблён простой глагол без явно выраженного значения повторного строительства.
- source_word: אַנְשֵׁי יְרֵחוֹ
  choice: жители Иерихона
  rationale: Сочетание буквально означает «мужи Иерихона», то есть группу людей, связанную с этим городом. «Жители Иерихона» звучит естественно в современном русском и не добавляет отсутствующего в еврейском предлога направления «из».
- source_word: זַכּוּר בֶּן אִמְרִי
  choice: Заккур, сын Имри
  rationale: Имена переданы транслитерацией; патронимическая конструкция בֶּן сохранена как «сын».
