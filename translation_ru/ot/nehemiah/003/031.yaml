base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/031.yaml
  text: After him Malkijah son of the goldsmith repaired as far as the house of the temple servants and the merchants, opposite the Inspection Gate, and as far as the upper room of the corner.
translation:
  language: ru
  text: После него чинил Малхия, сын золотых дел мастера, до дома храмовых служителей и торговцев, напротив Смотровых ворот, и до угловой горницы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְכִּיָּה
  choice: Малхия
  rationale: Передача еврейского личного имени в форме, естественной для русской библейской традиции.
- source_word: בֶּן הַצֹּרְפִי
  choice: сын золотых дел мастера
  rationale: צֹרְפִי обозначает мастера по обработке и очистке драгоценных металлов; по контексту вероятен золотых дел мастер. Единственное число сохранено.
- source_word: בֵּית הַנְּתִינִים וְהָרֹכְלִים
  choice: дом храмовых служителей и торговцев
  rationale: נְתִינִים — особая группа храмовых служителей; конструкция допускает один дом, связанный с обеими названными группами.
- source_word: שַׁעַר הַמִּפְקָד
  choice: Смотровые ворота
  rationale: מִפְקָד может обозначать осмотр, учёт или назначение; название передано без чрезмерно узкого истолкования как военный сбор либо перепись.
- source_word: עֲלִיַּת הַפִּנָּה
  choice: угловая горница
  rationale: עֲלִיָּה — верхнее помещение или горница; родительная конструкция естественно передана прилагательным без уточнения, кому она принадлежала.
