base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/014.yaml
  text: And Malchijah son of Rechab[a], ruler of the district of Beth-haccherem, repaired the Dung Gate. He built it and set up its doors, its bolts, and its bars.
translation:
  language: ru
  text: Навозные ворота[a] отремонтировал Малхия, сын Рехава, начальник округа Бет-Керем. Он построил их и установил их створки, засовы и поперечные брусья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мусорные ворота». Еврейское название связано с навозом или отбросами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחֱזִיק
  choice: восстанавливал
  rationale: В перечне работ в Неемии 3 глагол обозначает ответственность за ремонт и восстановление участка; «восстанавливал» естественно передаёт этот контекст и не сводит работу к простому укреплению.
- source_word: שַׁעַר הָאַשְׁפּוֹת
  choice: Навозные ворота
  rationale: Название связано с навозом или отбросами. Традиционное «Навозные ворота» сохраняет конкретный смысл еврейского названия; более общий вариант отмечен в сноске.
- source_word: שַׂר פֶּלֶךְ
  choice: начальник округа
  rationale: שַׂר обозначает руководителя или должностное лицо, а פֶּלֶךְ — административный округ. Формулировка понятна современному читателю и не приписывает должности более точного статуса, чем позволяет источник.
- source_word: בֵּית הַכָּרֶם
  choice: Бет-Керем
  rationale: Географическое название передано транслитерацией, а не буквальным переводом «дом виноградника».
- source_word: הוּא יִבְנֶנּוּ
  choice: Он построил их
  rationale: בנה буквально означает «строить». Хотя речь идёт о восстановительных работах, перевод не добавляет прямо не выраженного значения «заново»; отдельное «Он» передаёт выраженное в еврейском местоимение.
- source_word: וְיַעֲמִיד
  choice: установил
  rationale: Порода hифиль здесь означает поставить или установить на место элементы ворот.
- source_word: דַּלְתֹתָיו
  choice: их створки
  rationale: Множественное דְּלָתוֹת обозначает дверные полотна ворот; «створки» точнее и естественнее общего «двери».
- source_word: מַנְעֻלָיו
  choice: запоры
  rationale: Слово обозначает запирающие или крепёжные приспособления. «Запоры» сохраняет функциональный смысл без анахроничного уточнения устройства.
- source_word: וּבְרִיחָיו
  choice: засовы
  rationale: בְּרִיחַ обозначает брус или засов, которым закрепляли ворота; «засовы» является ясным и привычным русским соответствием.
