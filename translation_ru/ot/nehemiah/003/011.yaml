base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/011.yaml
  text: Malchijah son of Harim and Hasshub son of Pahath-moab repaired another section[b][a], and also the Tower of the Ovens.
translation:
  language: ru
  text: Малхия, сын Харима, и Хашшув, сын Пахат-Моава, восстановили ещё один участок[a], а также Башню печей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «второй участок». Буквально: «вторая часть»; в этом перечне речь идёт об отдельном отрезке стены.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Башню горнов». Еврейское слово может обозначать печи или горны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדָּה שֵׁנִית
  choice: другой участок
  rationale: В перечне ремонтных работ это выражение обозначает ещё один, дополнительный отрезок стены. Такой перевод естественен по-русски; более буквальная возможность отмечена в сноске.
- source_word: הֶחֱזִיק
  choice: укрепляли
  rationale: В контексте Неемии 3 глагол означает приводить участок укреплений в исправное состояние, ремонтировать или укреплять. «Укрепляли» сохраняет связь с укреплением городской стены и не сужает значение только до ремонта.
- source_word: מַלְכִּיָּה
  choice: Малхия
  rationale: Личное имя передано русской библейской транслитерацией, близкой к еврейской форме.
- source_word: בֶן חָרִם
  choice: сын Харима
  rationale: Стандартная конструкция родства передана прямо и ясно.
- source_word: וְחַשּׁוּב
  choice: и Хашшув
  rationale: Союз сохранён, личное имя транслитерировано с передачей удвоенного согласного еврейской формы в принятом русском написании.
- source_word: בֶן פַּחַת מוֹאָב
  choice: сын Пахат-Моава
  rationale: Составное родовое имя сохранено посредством транслитерации; склонение второй части делает форму естественной в русском контексте.
- source_word: וְאֵת
  choice: а также
  rationale: Союз с показателем прямого дополнения вводит дополнительный объект работ; «а также» ясно передаёт присоединительное значение.
- source_word: מִגְדַּל הַתַּנּוּרִים
  choice: Башню печей
  rationale: 'Название передано прозрачно: מִגְדָּל — «башня», а תַּנּוּרִים может обозначать печи либо горны. Основной вариант сохраняет конкретный образ без уточнения назначения печей.'
