base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/003.yaml
  text: The sons of Hassenaah built the Fish Gate[a]; they roofed it and set up its doors, its bolts[b], and its bars.
translation:
  language: ru
  text: Рыбные ворота построили сыновья Хассенаа[a]. Они покрыли их кровлей и установили их двери, замки и засовы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: потомки Хассенаа, принадлежавшие к его роду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הַדָּגִים
  choice: Рыбные ворота
  rationale: Устойчивое и естественное по-русски название конкретных городских ворот; форма множественного числа «ворота» требует соответствующего согласования.
- source_word: בָּנוּ
  choice: построили
  rationale: Глагол בנה прямо означает «строить»; хотя контекст главы говорит о восстановлении стены, здесь не следует без необходимости заменять его более узким «восстановили» или «починили».
- source_word: בְּנֵי הַסְּנָאָה
  choice: сыновья Сенаа
  rationale: «Сыновья» сохраняет форму еврейского выражения, которое может обозначать также потомков или родовую группу; это поясняется в сноске.
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение вновь называет деятелей, однако в русском добавление «сами» создало бы избыточный контраст, которого контекст не требует.
- source_word: קֵרוּהוּ
  choice: перекрыли их
  rationale: В строительном контексте קרה означает покрыть сооружение сверху или уложить перекрытие; «перекрыли» естественно применительно к воротам и не утверждает непременно наличие полноценной крыши.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: установили их двери
  rationale: Передаёт каузативное «поставили» идиоматично для монтажа дверей, не уточняя способ крепления.
- source_word: מַנְעוּלָיו
  choice: засовы
  rationale: В перечне деталей ворот слово обозначает запирающие приспособления; «засовы» хорошо отличимы от следующих запорных брусьев.
- source_word: וּבְרִיחָיו
  choice: и запоры
  rationale: בריח обозначает брус или поперечину, которой запирали ворота; «запоры» передаёт функцию без неестественной для русского повтора.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык, с ясным повествовательным синтаксисом. Порядок первой фразы отражает выдвижение объекта в еврейском тексте. Имя передано как «Сенаа»; начальное ה в форме הַסְּנָאָה понято как артикль, а не как часть имени. Местоимения при перечислении согласованы с русским словом «ворота».
