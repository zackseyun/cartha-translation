  text: The temple servants were living on the Ophel[a], as far as opposite the Water Gate toward the east and the projecting tower.
translation:
  language: ru
  text: Храмовые служители[a] жили на Офеле, до места напротив Водяных ворот на востоке и выступающей башни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. נְתִינִים (нефинимы) — особая группа храмовых служителей.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּתִינִים
  choice: храмовые служители
  rationale: Название особой группы людей, назначенных для вспомогательного служения при храме, передано по их функции; это яснее для современного читателя, чем транслитерация «нефинимы».
- source_word: הָיוּ יֹשְׁבִים
  choice: жили
  rationale: Сочетание היה с причастием обозначает продолжительное проживание; простое русское прошедшее время естественно передаёт это состояние.
- source_word: בָּעֹפֶל
  choice: на Офеле
  rationale: Офел — название возвышенной части Иерусалима; предлог «на» соответствует её топографическому характеру.
- source_word: עַד נֶגֶד
  choice: до места напротив
  rationale: Переданы и значение предела у עַד, и пространственное отношение «напротив» у נֶגֶד; добавление «места» делает сочетание естественным по-русски, не уточняя его сверх текста.
- source_word: שַׁעַר הַמַּיִם
  choice: Водяные ворота
  rationale: Естественное русское название городских ворот, буквально соответствующее еврейской сопряжённой конструкции.
- source_word: לַמִּזְרָח
  choice: к востоку
  rationale: Сохраняет пространственно-направительное значение выражения без излишнего уточнения.
- source_word: הַמִּגְדָּל הַיּוֹצֵא
  choice: выступающая башня
  rationale: В архитектурном контексте причастие יֹצֵא описывает башню, выдающуюся наружу; «выступающая» естественно передаёт этот образ.
