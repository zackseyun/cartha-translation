  text: Next to them Jedaiah son of Harumaph made repairs opposite his house[a], and next to him Hattush son of Hashabneiah made repairs.
translation:
  language: ru
  text: Рядом с ними восстанавливал участок стены Иедаия, сын Харумафа, напротив своего дома[a], а рядом с ним восстанавливал участок стены Хаттуш, сын Хашавнии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед своим домом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: Рядом с ними
  rationale: Устойчивое выражение עַל יָד в перечне Неемии указывает на соседство участков работ; русский оборот естественно передаёт последовательность и пространственную связь.
- source_word: הֶחֱזִיק
  choice: восстанавливал участок стены
  rationale: В Неемии 3 форма глагола חזק служит специальным обозначением участия в восстановлении стены. Добавление «участок стены» проясняет подразумеваемый объект и естественно звучит в русском перечне работ.
- source_word: יְדָיָה בֶן חֲרוּמַף
  choice: Иедая, сын Харумафа
  rationale: Имена переданы транслитерацией в соответствии с принятой русской библейской традицией; конструкция родства сохранена прямо.
- source_word: וְנֶגֶד בֵּיתוֹ
  choice: напротив своего дома
  rationale: נֶגֶד обозначает положение перед чем-либо или напротив него. Возвратное «своего» однозначно связывает дом с Иедаей, как требует суффикс третьего лица.
- source_word: וְעַל יָדוֹ
  choice: а рядом с ним
  rationale: Повтор того же выражения עַל יָד сохраняет структуру перечня; единственное число указывает на Иедаю.
- source_word: חַטּוּשׁ בֶּן חֲשַׁבְנְיָה
  choice: Хаттуш, сын Хашавнии
  rationale: Личные имена транслитерированы, а еврейская конструкция «сын такого-то» передана непосредственно.
