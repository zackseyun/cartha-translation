lexical_decisions:
- source_word: מֵעַל
  choice: Выше
  rationale: Предлог указывает на расположение участка относительно предыдущей части стены; в перечне строительных работ естественно передаётся словом «выше».
- source_word: שַׁעַר הַסּוּסִים
  choice: Конских ворот
  rationale: Сочетание представляет собой название ворот; «Конские ворота» — естественная русская форма, сохраняющая характер топонима.
- source_word: הֶחֱזִיקוּ
  choice: чинили стену
  rationale: В Неемии 3 глагол обозначает проведение ремонтно-восстановительных работ. Добавление объекта «стену» ясно из контекста главы и делает русскую фразу естественной.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Прямое соответствие существительному с определённым артиклем.
- source_word: אִישׁ
  choice: каждый
  rationale: 'Единственное число имеет распределительное значение: речь идёт о каждом священнике по отдельности.'
- source_word: לְנֶגֶד
  choice: напротив
  rationale: Предлог обозначает место непосредственно перед чем-либо или напротив него; здесь он соотносит участки стены с домами работников.
- source_word: בֵּיתוֹ
  choice: своего дома
  rationale: Местоименный суффикс 3-го лица мужского рода единственного числа согласуется с распределительным «каждый»; возвратное «своего» естественно выражает эту связь по-русски.
