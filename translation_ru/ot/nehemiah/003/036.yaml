review_pass:
  verdict: revise
  source_fidelity: «Нас презирают» передаёт итоговое состояние, но не выражает достаточно явно конструкцию הָיִינוּ בוּזָה — «мы стали предметом презрения/посмешищем». «Мы стали предметом презрения» сохраняет совершенный глагол и значение существительного בוּזָה. Остальные синтаксические связи и образы оригинала переданы верно.
  naturalness: Текст в целом звучит естественно в современном литературном русском и сохраняет молитвенный регистр. «Мы стали предметом презрения» несколько книжно, но вполне естественно и точнее для библейской молитвы. «В стране плена» яснее и современнее, чем «в земле плена», при сохранении образа «земли/страны плена».
  terminology: «Боже наш», «поношение», «на их же головы» и «отдай их на разграбление» удачно передают молитвенное обращение, חרפה, образ воздаяния и לְבִזָּה. Формулировка не смягчает суровую просьбу текста и не навязывает богословского истолкования.
