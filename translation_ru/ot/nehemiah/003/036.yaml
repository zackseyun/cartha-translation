base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/036.yaml
  text: Hear[a], our God, for we are despised. Turn their reproach back on their own heads[c][b], and give them over as plunder in a land of captivity.
translation:
  language: ru
  text: Услышь, Боже наш, ведь мы стали предметом презрения. Обрати их поношение на их же головы и отдай их на разграбление в стране плена.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в земле пленения»; возможный смысл: «в стране неволи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Услышь
  rationale: Повелительная форма в молитвенном обращении к Богу; «услышь» естественно передаёт просьбу о внимании и ответе, не добавляя отсутствующего в тексте дополнения.
- source_word: אֱלֹהֵינוּ
  choice: Боже наш
  rationale: Форма с суффиксом 1-го лица множественного числа употреблена как прямое обращение; русский звательный оборот «Боже наш» точен и естественен.
- source_word: כִּי הָיִינוּ בוּזָה
  choice: ведь нас презирают
  rationale: 'Буквально: «ибо мы стали презрением». Русская безлично-пассивная передача выражает наличное состояние унижения и звучит естественно, не превращая абстрактное существительное в неидиоматичное «стали презрением».'
- source_word: וְהָשֵׁב חֶרְפָּתָם אֶל רֹאשָׁם
  choice: Обрати их поношение на их же головы
  rationale: Каузативная форма שוב обозначает возвращение или обращение назад; «на их же головы» сохраняет образ воздаяния и возврат поношения к его виновникам.
- source_word: וּתְנֵם לְבִזָּה
  choice: и отдай их на разграбление
  rationale: נתן с местоименным суффиксом и לְבִזָּה выражает передачу людей в качестве добычи; «отдай ... на разграбление» ясно и естественно передаёт суровую просьбу текста.
- source_word: בְּאֶרֶץ שִׁבְיָה
  choice: в земле плена
  rationale: Сохраняет буквальный образ «земли плена/неволи» и не навязывает определённость, которой в еврейском сочетании нет.
theological_decisions:
- issue: Молитвенная просьба о воздаянии врагам
  choice: Сохранить прямую просьбу обратить поношение на врагов и отдать их на разграбление
  alternative: Смягчить до общей просьбы о справедливости или истолковать только метафорически
  rationale: Еврейский текст прямо содержит суровую молитву о воздаянии; перевод не должен устранять её богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. «Услышь, Боже наш» сохраняет библейский молитвенный регистр без излишней архаизации; резкость просительной части не смягчена.
