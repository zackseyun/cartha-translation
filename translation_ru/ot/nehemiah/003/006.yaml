base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/006.yaml
  text: And Joiada son of Paseah and Meshullam son of Besodeiah repaired the Old Gate. They laid its beams and set up its doors[a], its bolts, and its bars.
translation:
  language: ru
  text: Старые ворота[a] восстановили Иояда, сын Пасеаха, и Мешуллам, сын Бесодии. Они перекрыли их балками, установили двери, запоры и засовы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «ворота Иешаны», если второе слово является названием места, а не определением «старые».'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶחֱזִיקוּ
  choice: починили
  rationale: В перечне работ в Неемии 3 глагол обозначает восстановление или ремонт участка; «починили» естественно передаёт строительный контекст.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: Старые ворота
  rationale: Наиболее естественно понимать сочетание как название ворот со значением «Старые ворота»; возможное понимание второго слова как топонима сохранено в сноске.
- source_word: קֵרוּהוּ
  choice: перекрыли их балками
  rationale: Глагол обозначает устройство покрытия или перекрытия балками. Эта формулировка ясно передаёт строительное действие применительно к воротам.
- source_word: וַיַּעֲמִידוּ
  choice: установили
  rationale: Каузативная форма буквально означает «поставили»; «установили» естественно звучит при перечислении деталей ворот.
- source_word: דַּלְתֹתָיו
  choice: двери
  rationale: Множественное число указывает на створки ворот; русское «двери» сохраняет исходное различие между всей конструкцией ворот и её створками.
- source_word: מַנְעֻלָיו
  choice: запоры
  rationale: В контексте ворот слово обозначает запирающие приспособления; «запоры» не вносит излишне современного представления о замках.
- source_word: בְרִיחָיו
  choice: засовы
  rationale: Слово обозначает брусья или засовы, которыми запирали створки; «засовы» естественно и отличается от более общего «запоры».
- source_word: הֵמָּה
  choice: Они
  rationale: Отдельное местоимение подчёркивает, что последующие работы выполнили названные строители; в русском это естественно передаётся начальным «Они».
- source_word: יוֹיָדָע ... וּמְשֻׁלָּם / פָּסֵחַ / בְּסוֹדְיָה
  choice: Иоиада ... Мешуллам / Пасеах / Бесодия
  rationale: Личные имена переданы русской транслитерацией, ориентированной на еврейские формы и сложившуюся библейскую узнаваемость.
