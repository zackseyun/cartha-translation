  yaml_path: translation/ot/nehemiah/003/008.yaml
  text: Next to him Uzziel son of Harhaiah[a], one of the goldsmiths, made repairs; and next to him Hananiah, one of the perfumers, made repairs. And they restored Jerusalem as far as the Broad Wall.
translation:
  language: ru
  text: Рядом с ним ремонтировал Уззиил, сын Хархаии, один из золотых дел мастеров; рядом с ним — Ханания, сын изготовителей благовоний. Они восстановили Иерусалим вплоть до Широкой стены[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они оставили Иерусалим вплоть до Широкой стены». Еврейский глагол обычно означает «оставлять», но в контексте восстановительных работ его нередко понимают в значении «восстановили» или «отремонтировали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָדוֹ
  choice: Рядом с ним
  rationale: В перечне работ Неемии 3 этот оборот указывает на соседний участок; такой перевод естественно передаёт пространственную последовательность.
- source_word: הֶחֱזִיק
  choice: ремонтировал
  rationale: В контексте главы глагол обозначает участие в восстановительных работах; «ремонтировал» ясно передаёт строительный смысл.
- source_word: צֹרְפִים
  choice: один из золотых дел мастеров
  rationale: Форма во множественном числе указывает на ремесленную группу, к которой принадлежал Уззиил; контекст позволяет передать צֹרֵף как мастера по драгоценным металлам, традиционно золотых дел мастера.
- source_word: הָרַקָּחִים
  choice: один из изготовителей благовоний
  rationale: Слово обозначает ремесленников, составлявших ароматические смеси и мази; этот вариант точнее и современнее, чем архаичное «аптекари».
- source_word: וַיַּעַזְבוּ
  choice: они восстановили
  rationale: Обычное значение корня — «оставлять», однако в данном перечне строительных работ многие понимают форму как указание на восстановление или приведение участка в порядок. Необычность сохранена в сноске.
- source_word: יְרוּשָׁלַםִ
  choice: Иерусалим
  rationale: В еврейском тексте назван сам город, вероятно метонимически — его укрепления; слово «стена» в основной текст не добавлено.
- source_word: עַד הַחוֹמָה הָרְחָבָה
  choice: до Широкой стены
  rationale: Вероятно, это название известного участка укреплений; прописная буква передаёт функцию собственного наименования.
