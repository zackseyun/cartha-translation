base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/037.yaml
  text: And do not cover over their guilt[a], and do not let their sin be blotted out from before you[b], for they have provoked anger in the presence of the builders.
translation:
  language: ru
  text: И не покрывай их вину[a], и пусть их грех не будет изглажен пред Тобой[b], потому что они вызвали гнев перед строителями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не прости им их вины»; еврейский образ: «не покрывай их вину».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что они прогневили Тебя перед строителями». В еврейском тексте объект гнева прямо не назван; смысл, вероятно, в том, что они публично вызвали гнев своими действиями в присутствии строителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּכַס ... עַל עֲוֺנָם
  choice: не покрой их вины
  rationale: Сохраняет еврейский образ «покрытия» вины и вместе с тем допускает подразумеваемый смысл непрощения.
- source_word: עֲוֺנָם
  choice: их вины
  rationale: עָוֹן может обозначать беззаконие и связанную с ним вину; в параллели со словом «грех» здесь уместно «вина».
- source_word: חַטָּאתָם
  choice: их грех
  rationale: Прямое и естественное соответствие обычному значению חַטָּאת.
- source_word: מִלְּפָנֶיךָ אַל תִּמָּחֶה
  choice: пусть ... не будет изглажен пред Тобой
  rationale: Передаёт образ стирания или удаления греха из присутствия и внимания Бога, сохраняя возвышенный молитвенный строй.
- source_word: הִכְעִיסוּ
  choice: вызвали гнев
  rationale: В еврейском тексте объект прямо не назван; безобъектная формулировка сохраняет эту сжатость и неоднозначность.
- source_word: לְנֶגֶד הַבּוֹנִים
  choice: перед строителями
  rationale: Ближайшее пространственное значение — «перед, в присутствии»; выражение указывает на публичный характер оскорбления.
theological_decisions:
- issue: Просьба не прощать и не изглаживать грех врагов
  choice: Сохранена прямая и суровая формулировка молитвы без смягчения.
  alternative: 'Передать менее резко: «не оставь без внимания их злодеяние».'
  rationale: Еврейский текст содержит явную молитву о воздаянии; перевод не должен устранять присущее ей богословское напряжение.
- issue: Неявный объект вызванного гнева
  choice: «вызвали гнев»
  alternative: «прогневили Тебя»
  rationale: Хотя по контексту подразумевается Бог, грамматически объект не выражен, поэтому основной текст сохраняет неоднозначность, а пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Форма «пред Тобой» сохраняет библейскую пространственно-реляционную образность, не делая весь стих архаичным; местоимение в обращении к Богу написано с прописной буквы.
