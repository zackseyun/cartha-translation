  yaml_path: translation/ot/nehemiah/003/004.yaml
  text: And next to them Meremoth son of Uriah[a], son of Hakkoz, made repairs; and next to them Meshullam son of Berechiah, son of Meshezabel, made repairs[c][b]; and next to them Zadok son of Baana made repairs.
translation:
  language: ru
  text: Рядом с ними Меремот, сын Урии, сына Гаккоца, восстанавливал стену[a]; рядом с ними Мешуллам, сын Берехии, сына Мешезавела, восстанавливал стену; и рядом с ними Цадок, сын Бааны, восстанавливал стену.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол можно также перевести как «ремонтировал» или, более буквально, «укреплял». В этой главе он служит устойчивым обозначением работ по восстановлению стены.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל יָדָם
  choice: рядом с ними
  rationale: Буквально «у их руки»; в перечне строителей это устойчивое пространственное выражение, указывающее на соседний участок работ.
- source_word: הֶחֱזִיק
  choice: восстанавливал
  rationale: В этой конструкции глагол означает укреплять или ремонтировать; в контексте Неемии 3 речь идёт о восстановительных работах на стене. Добавление «стену» в первом случае естественно обозначает подразумеваемый объект.
- source_word: בֶּן
  choice: сын
  rationale: В данных родословных указаниях обычное значение «сын» наиболее естественно; контекст не требует более широкого «потомок».
- source_word: מְרֵמוֹת
  choice: Меремот
  rationale: Передача личного имени средствами современной русской библейской транслитерации.
- source_word: אוּרִיָּה
  choice: Урия
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: הַקּוֹץ
  choice: Гаккоц
  rationale: Транслитерация еврейской формы с учётом начального определённого артикля, вошедшего в состав имени.
- source_word: מְשֻׁלָּם
  choice: Мешуллам
  rationale: Близкая к еврейской форме русская транслитерация личного имени.
- source_word: בֶּרֶכְיָה
  choice: Берехия
  rationale: Близкая к еврейской форме русская транслитерация личного имени.
- source_word: מְשֵׁיזַבְאֵל
  choice: Мешезавел
  rationale: Русская транслитерация, сохраняющая основные согласные и слоговую структуру еврейского имени.
- source_word: צָדוֹק
  choice: Цадок
  rationale: Передача начального צ как «ц» сохраняет еврейское звучание и соответствует современной транслитерации.
- source_word: בַּעֲנָא
  choice: Баана
  rationale: Близкая к масоретской форме русская транслитерация личного имени.
