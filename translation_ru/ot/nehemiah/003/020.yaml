base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/020.yaml
  text: After him[a], Baruch son of Zabbai zealously repaired a second section[b], from the angle to the entrance of the house of Eliashib the high priest.
translation:
  language: ru
  text: После него Варух, сын Заббая[a], с особым рвением восстановил второй участок[b] — от угла до входа в дом первосвященника Елиашива.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых древних переводах имя отца Варуха передано как «Заккай».
    reason: alternative_reading
  - marker: b
    text: Еврейское выражение, переведённое словами «с особым рвением восстановил», необычно и, вероятно, подчёркивает горячее усердие Варуха или его исключительное старание в работе.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: После него
  rationale: В перечне строителей выражение указывает как на последовательность работ, так и на соседство участка с предыдущим.
- source_word: הֶחֱרָה הֶחֱזִיק
  choice: с особым рвением восстановил
  rationale: הֶחֱזִיק в контексте главы означает восстановление или укрепление стены, а необычное הֶחֱרָה усиливает действие и, вероятно, подчёркивает усердие Варуха.
- source_word: בָּרוּךְ בֶּן זבי
  choice: Варух, сын Забвая
  rationale: Имена переданы принятой русской библейской транслитерацией; основное чтение согласного текста זבי передано как «Забвай».
- source_word: מִדָּה שֵׁנִית
  choice: второй участок
  rationale: Здесь речь идёт не о буквальной мере, а ещё об одном порученном отрезке стены; «второй» сохраняет указание на дополнительный участок работ этого строителя.
- source_word: מִן הַמִּקְצוֹעַ
  choice: от угла
  rationale: Существительное обозначает угол или место поворота стены; «угол» естественно звучит в русском архитектурном описании.
- source_word: עַד פֶּתַח בֵּית
  choice: до входа в дом
  rationale: פֶּתַח обозначает вход или дверной проём, а בֵּית здесь, вероятнее всего, относится к дому или жилому комплексу Елиашива.
- source_word: אֶלְיָשִׁיב הַכֹּהֵן הַגָּדוֹל
  choice: первосвященника Елиашива
  rationale: הַכֹּהֵן הַגָּדוֹל — устойчивое обозначение должности первосвященника; перестановка соответствует естественному русскому порядку слов.
