  register: Современный литературный русский язык с сохранением повторной формулы перечня. Имена переданы в привычных русских библейских формах; синтаксис родословной оставлен прозрачным. Стилистически подразумеваемый объект ремонтных работ выражен словом «стену» для ясности.
