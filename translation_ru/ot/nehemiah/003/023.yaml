  text: אַחֲרָ֨י/ו הֶחֱזִ֧יק בִּנְיָמִ֛ן וְ/חַשּׁ֖וּב נֶ֣גֶד בֵּיתָ֑/ם אַחֲרָ֣י/ו הֶחֱזִ֗יק עֲזַרְיָ֧ה בֶן מַעֲשֵׂיָ֛ה בֶּן עֲנָֽנְיָ֖ה אֵ֥צֶל בֵּיתֽ/וֹס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/023.yaml
  text: After him Benjamin and Hasshub made repairs opposite their house. After him Azariah son of Maaseiah[a], son of Ananiah, made repairs beside his house.
translation:
  language: ru
  text: После него Вениамин и Хашшув восстанавливали стену напротив своего дома. После него Азария, сын Маасеи, сына Анании, восстанавливал стену рядом со своим домом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרָיו
  choice: После него
  rationale: Повторяющаяся формула обозначает последовательность участков и работников вдоль стены; буквальное и естественное русское соответствие сохраняет структуру перечня.
- source_word: הֶחֱזִיק
  choice: восстанавливал / восстанавливали стену
  rationale: В породе hифиль глагол חזק в Неемии 3 служит контекстуальным обозначением ремонтно-восстановительных работ. Указание на стену естественно восполняет подразумеваемый объект и яснее передаёт смысл, чем буквальное «укреплял».
- source_word: בִּנְיָמִן
  choice: Вениамин
  rationale: Устоявшаяся русская форма библейского личного имени.
- source_word: חַשּׁוּב
  choice: Хашшув
  rationale: Транслитерация еврейского личного имени с передачей удвоенного согласного; вариант не смешивается с формой другого имени Хашув.
- source_word: נֶגֶד
  choice: напротив
  rationale: Предлог выражает положение перед домом или прямо против него; «напротив» кратко и естественно передаёт топографическую связь.
- source_word: בֵּיתָם
  choice: своего дома
  rationale: Сохранено единственное число еврейского «дом» при отнесённости к двум работникам; возвратное местоимение по-русски естественно связывает дом с подлежащим.
- source_word: עֲזַרְיָה
  choice: Азария
  rationale: Устоявшаяся русская форма библейского личного имени.
- source_word: בֶן מַעֲשֵׂיָה בֶּן עֲנָנְיָה
  choice: сын Маасеи, сына Анании
  rationale: Сохранена последовательная патронимическая цепочка исходного текста без перестройки родословной связи.
- source_word: אֵצֶל
  choice: рядом со
  rationale: Передаёт пространственную близость и позволяет отличить эту связь от повторяющейся формулы «после него».
- source_word: בֵּיתוֹ
  choice: своим домом
  rationale: Возвратное местоимение естественно указывает на дом Азарии и сохраняет конкретную топографическую привязку.
theological_decisions: []
