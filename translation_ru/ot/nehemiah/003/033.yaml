  text: When Sanballat heard that we were rebuilding the wall[a], he became angry and very enraged, and he mocked the Jews.
translation:
  language: ru
  text: Когда Санаваллат услышал, что мы восстанавливаем стену, он разгневался, пришёл в сильную ярость и стал насмехаться над иудеями[a].
