lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: Повествовательная формула вводит новое развитие событий; простое «когда» естественно передаёт временную связь без тяжеловесного буквализма.
- source_word: שָׁמַע
  choice: услышал
  rationale: Основное значение глагола — «слышать»; здесь речь идёт о получении известия, и «услышал» точно и естественно.
- source_word: סַנְבַלַּט
  choice: Санаваллат
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, остающаяся понятной современному читателю.
- source_word: כִּי אֲנַחְנוּ בוֹנִים
  choice: что мы восстанавливаем
  rationale: Причастие обозначает продолжающееся действие, а контекст говорит о восстановлении разрушенной стены Иерусалима.
- source_word: הַחוֹמָה
  choice: стену
  rationale: Существительное означает укреплённую стену; из контекста ясно, что имеется в виду городская стена Иерусалима.
- source_word: וַיִּחַר לוֹ
  choice: он разгневался
  rationale: Еврейская идиома буквально описывает разгорающийся гнев; «разгневался» передаёт её смысл кратко и достойно.
- source_word: וַיִּכְעַס הַרְבֵּה
  choice: пришёл в сильную ярость
  rationale: Второе обозначение гнева усиливает первое; отдельная формулировка сохраняет нарастание эмоции, не сливая два выражения.
- source_word: וַיַּלְעֵג
  choice: стал насмехаться
  rationale: Глагол обозначает выражение презрения и осмеяние; форма «стал насмехаться» естественно передаёт последовавшее действие.
- source_word: עַל הַיְּהוּדִים
  choice: над иудеями
  rationale: В данном послепленном контексте «иудеи» естественно передаёт как принадлежность к народу, так и возможный региональный оттенок обозначения жителей Иудеи.
