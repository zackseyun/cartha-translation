base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/035.yaml
  text: And Tobiah the Ammonite was beside him[a], and he said, “Even what they are building—if a fox climbs up on it[b], he will break through their stone wall!”
translation:
  language: ru
  text: 'А Товия аммонитянин был рядом с ним и сказал: «Даже то, что они строят, — если на это взберётся лиса[a], она проломит[b] их каменную стену!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обычно означает «лиса», хотя в некоторых контекстах может обозначать и близкого к ней представителя семейства псовых, например шакала.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «разрушит». Еврейский глагол может означать как пробивание бреши, так и разрушение; здесь он подчёркивает насмешку Товии над непрочностью стены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶצְלוֹ
  choice: стоявший рядом с ним
  rationale: Предлог אֵצֶל с местоименным суффиксом выражает близость. Причастный оборот естественно передаёт подразумеваемое в еврейском тексте состояние и показывает, что Товия находился рядом с Санаваллатом.
- source_word: גַּם אֲשֶׁר הֵם בּוֹנִים
  choice: Даже то, что они строят
  rationale: Гַּם здесь усиливает насмешку Товии. Формулировка сохраняет эмфатический смысл и не добавляет отсутствующих в источнике подробностей.
- source_word: אִם יַעֲלֶה
  choice: если на это взберётся
  rationale: אִם вводит условие, а עלה обозначает движение вверх. Местоимение «это» естественно указывает на строящуюся стену, подразумеваемую в оригинале.
- source_word: שׁוּעָל
  choice: лиса
  rationale: Обычное значение слова — «лиса»; в некоторых контекстах оно может обозначать близкого лисе представителя псовых, но здесь традиционный и понятный перевод уместен.
- source_word: וּפָרַץ
  choice: она проломит
  rationale: Глагол פרץ означает «проламывать, пробивать брешь». Форма мужского рода единственного числа грамматически соотнесена с שׁוּעָל; в русском согласование с существительным «лиса» требует женского рода.
- source_word: חוֹמַת אַבְנֵיהֶם
  choice: их каменную стену
  rationale: Буквально — «стену их камней». Естественное русское сочетание «их каменная стена» сохраняет указание на материал стены.
