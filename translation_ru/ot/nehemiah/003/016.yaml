  variant: modern literary Russian
source:
  edition: WLC
  text: אַחֲרָ֤י/ו הֶחֱזִיק֙ נְחֶמְיָ֣ה בֶן עַזְבּ֔וּק שַׂ֕ר חֲצִ֖י פֶּ֣לֶךְ בֵּֽית צ֑וּר עַד נֶ֨גֶד֙ קִבְרֵ֣י דָוִ֔יד וְ/עַד הַ/בְּרֵכָה֙ הָ/עֲשׂוּיָ֔ה וְ/עַ֖ד בֵּ֥ית הַ/גִּבֹּרִֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/016.yaml
  text: After him Nehemiah son of Azbuk[a], ruler of half the district of Beth-zur, made repairs as far as opposite the tombs of David, and as far as the pool that was made[b], and as far as the house of the mighty men.
translation:
  language: ru
  text: После него[a] восстанавливал стену Неемия, сын Азбука, начальник половины округа Бет-Цура, — до места напротив гробниц Давида, до сооружённого водоёма и до дома воинов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Рядом с ним», если выражение обозначает не последовательность работ, а расположение участка.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дома сильных людей»; возможно также: «дома витязей». Вероятно, речь идёт о военном здании, но точно определить его назначение невозможно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: После него
  rationale: В перечне работ эта формула прежде всего обозначает переход к следующему работнику или участку; возможное пространственное понимание сохранено в сноске.
- source_word: הֶחֱזִיק
  choice: восстанавливал стену
  rationale: В Неемии 3 порода хифиль глагола חזק служит устойчивым обозначением ремонтно-восстановительных работ на стене. Слово «стену» восполняет очевидный из контекста объект ради естественности русского текста.
- source_word: שַׂר חֲצִי פֶּלֶךְ
  choice: начальник половины округа
  rationale: שַׂר обозначает руководителя или административного начальника, а פֶּלֶךְ в персидский период — административный округ; «область» могла бы создать представление о более крупной единице.
- source_word: בֵּית צוּר
  choice: Бет-Цур
  rationale: Географическое название передано транслитерацией, без перевода его составных частей.
- source_word: עַד נֶגֶד קִבְרֵי דָוִיד
  choice: до места напротив гробниц Давида
  rationale: נֶגֶד указывает на расположение напротив или перед объектом; добавление «места» естественно передаёт подразумеваемую точку стены, не утверждая, что работы доходили непосредственно до самих гробниц.
- source_word: הַבְּרֵכָה הָעֲשׂוּיָה
  choice: сооружённого водоёма
  rationale: Буквально это «сделанный водоём». «Сооружённый» сохраняет результативно-пассивный смысл и звучит естественнее, не уточняя неизвестный способ устройства.
- source_word: בֵּית הַגִּבֹּרִים
  choice: дом воинов
  rationale: גִּבֹּרִים может обозначать сильных людей, витязей или воинов. В данном топографическом контексте «воины» уместно, тогда как «казарма» слишком определённо истолковывала бы назначение неизвестного здания.
