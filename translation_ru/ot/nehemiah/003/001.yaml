  text: וַ/יָּ֡קָם אֶלְיָשִׁיב֩ הַ/כֹּהֵ֨ן הַ/גָּד֜וֹל וְ/אֶחָ֣י/ו הַ/כֹּהֲנִ֗ים וַ/יִּבְנוּ֙ אֶת שַׁ֣עַר הַ/צֹּ֔אן הֵ֣מָּה קִדְּשׁ֔וּ/הוּ וַֽ/יַּעֲמִ֖ידוּ דַּלְתֹתָ֑י/ו וְ/עַד מִגְדַּ֤ל הַ/מֵּאָה֙ קִדְּשׁ֔וּ/הוּ עַ֖ד מִגְדַּ֥ל חֲנַנְאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/001.yaml
  text: Then Eliashib the high priest rose up with his brothers the priests[a], and they built the Sheep Gate. They consecrated it and set up its doors; they consecrated it as far as the Tower of the Hundred, as far as the Tower of Hananel.
translation:
  language: ru
  text: Тогда первосвященник Елиашив вместе со своими братьями-священниками взялись за работу и построили Овечьи ворота. Они сами освятили их[a] и установили их створки; они освятили их до башни Сотни и далее до башни Хананэла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посвятили их». Еврейский глагол может означать как освящение, так и особое посвящение чего-либо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: приступил к делу
  rationale: В данном повествовательном контексте קום обозначает начало действия. Буквальное «встал» по-русски звучало бы неестественно и могло бы создать ненужный телесный образ.
- source_word: הַכֹּהֵן הַגָּדוֹל
  choice: первосвященник
  rationale: Устоявшееся и точное русское обозначение высшего священнического служения.
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: вместе со своими братьями-священниками
  rationale: Сохраняет родственное обозначение «братья» и приложение, указывающее, что они были священниками.
- source_word: שַׁעַר הַצֹּאן
  choice: Овечьи ворота
  rationale: Естественное русское название городских ворот, сохраняющее конкретный образ еврейского наименования.
- source_word: הֵמָּה
  choice: они сами
  rationale: Передаёт подчёркнутое самостоятельное местоимение, выделяющее личное участие священников.
- source_word: קִדְּשׁוּהוּ
  choice: освятили их
  rationale: Глагол קדשׁ означает отделение для священного назначения; «освятили» сохраняет культово-религиозный оттенок.
- source_word: וַיַּעֲמִידוּ דַּלְתֹתָיו
  choice: установили их створки
  rationale: Передаёт постановку дверей ворот на место; «створки» естественнее применительно к воротам и не уточняет способ крепления.
- source_word: מִגְדַּל הַמֵּאָה
  choice: башня Сотни
  rationale: Прозрачно передаёт конструкцию с числительным как собственное название, не пытаясь объяснить неясное происхождение наименования.
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: башня Хананэла
  rationale: Передаёт название башни с принятой русской транслитерацией личного имени.
- source_word: וְעַד ... עַד
  choice: до ... и далее до
  rationale: Передаёт повторное указание границ участка и естественно выражает протяжённость по-русски.
theological_decisions:
- issue: Культовый смысл קדשׁ применительно к воротам и участку стены
  choice: освятили
  alternative: посвятили
  rationale: «Освятили» сохраняет значение отделения для святого назначения и уместно при действии священников, не добавляя сведений о конкретном обряде.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Буквальный идиоматизм «встал» заменён контекстуальным «приступил к делу». Множественное согласование («их») обусловлено русским названием «Овечьи ворота». Слово «стену» во второй части добавлено для ясности подразумеваемого объекта освящения между башнями; оно не отмечено как текстуальный вариант, поскольку служит минимальным контекстуальным восполнением.
