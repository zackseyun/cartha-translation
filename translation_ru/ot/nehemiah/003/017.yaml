  text: אַחֲרָ֛י/ו הֶחֱזִ֥יקוּ הַ/לְוִיִּ֖ם רְח֣וּם בֶּן בָּנִ֑י עַל יָד֣/וֹ הֶחֱזִ֗יק חֲשַׁבְיָ֛ה שַׂר חֲצִי פֶ֥לֶךְ קְעִילָ֖ה לְ/פִלְכּֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/003/017.yaml
  text: 'After him the Levites carried out repairs: Rehum son of Bani[a]. Next to him Hashabiah, ruler of half the district of Keilah[c][b], carried out repairs for his district.'
translation:
  language: ru
  text: 'После него ремонтировали левиты: Рехум, сын Бани.[a] Рядом с ним ремонтировал Хашавия, начальник половины округа Кеилы, — за свой округ.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «После него ремонтировали левиты во главе с Рехумом, сыном Бани». Еврейский текст сначала употребляет множественное число («левиты»), а затем называет Рехума в единственном числе; его точная роль в группе не уточнена.'
    reason: 'Синтаксическая неоднозначность: имя может пояснять группу либо обозначать её представителя.'
  - marker: b
    text: 'Или: «для своего округа»; возможно также: «на своём участке». Еврейское выражение может указывать либо на округ, за который отвечал Хашавия, либо на порученную ему часть стены.'
    reason: Неоднозначность значения לְפִלְכּוֹ и административного либо строительного смысла פֶלֶךְ.
lexical_decisions:
- source_word: אַחֲרָיו
  choice: После него
  rationale: В перечне строителей выражение обозначает следующего работника и одновременно соседний участок стены.
- source_word: הֶחֱזִיקוּ / הֶחֱזִיק
  choice: ремонтировали / ремонтировал
  rationale: Форма глагола חזק в породе hифиль в Неемии 3 служит устойчивым обозначением ремонтных работ на стене; буквальное «укрепляли» здесь менее ясно.
- source_word: הַלְוִיִּם רְחוּם בֶּן־בָּנִי
  choice: левиты во главе с Рехумом, сыном Бани
  rationale: Еврейская конструкция называет группу, а затем одного человека в единственном числе. Добавление «во главе с» естественно передаёт его роль как названного представителя группы, не превращая Рехума в отдельный однородный субъект.
- source_word: עַל יָדוֹ
  choice: Рядом с ним
  rationale: Буквально «у его руки»; в контексте главы это пространственная формула, указывающая на соседний участок работ.
- source_word: חֲשַׁבְיָה
  choice: Хашавия
  rationale: Имя передано транслитерацией, ориентированной на еврейскую форму.
- source_word: שַׂר חֲצִי פֶלֶךְ קְעִילָה
  choice: начальник половины округа Кеилы
  rationale: שַׂר обозначает руководящее должностное лицо, а פֶלֶךְ здесь — административный округ.
- source_word: לְפִלְכּוֹ
  choice: от своего округа
  rationale: 'Предлог לְ допускает значение представительства или ответственности: Хашавия выполнял работу от имени подведомственного ему округа. Формулировка сохраняет административный смысл, не утверждая, что ремонт проходил внутри самого округа.'
