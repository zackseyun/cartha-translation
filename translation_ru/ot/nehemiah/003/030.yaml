  yaml_path: translation/ot/nehemiah/003/030.yaml
  text: After him Hananiah son of Shelemiah and Hanun the sixth son of Zalaph repaired another section[b][a]. After him Meshullam son of Berechiah repaired opposite his chamber.
translation:
  language: ru
  text: После него[a] другой участок[b] восстанавливали Ханания, сын Шелемии, и Ханун, шестой сын Цалафа. После него Мешуллам, сын Берехии, восстанавливал стену напротив своего помещения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте первое выражение можно буквально прочитать как «после меня»; в контексте повторяющейся формулы этой главы его традиционно понимают как «после него».
    reason: textual_variant
  - marker: b
    text: 'Буквально: «вторую меру»; здесь имеется в виду ещё один участок стены, порученный для восстановления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרַי / אַחֲרָיו
  choice: После него
  rationale: В перечне строителей эта повторяющаяся формула указывает на следующего работника или соседний участок. Первое написание допускает буквальное «после меня», однако контекст и традиционное чтение поддерживают «после него»; неоднозначность отмечена в сноске.
- source_word: הֶחֱזִיק
  choice: восстанавливали / восстанавливал
  rationale: В Неемии 3 глагол обозначает работу по приведению стены в исправное состояние. «Восстанавливать» естественно передаёт смысл ремонтно-строительных работ, не сужая его до простого укрепления.
- source_word: הַשִּׁשִּׁי
  choice: шестой сын
  rationale: Порядковое числительное эллиптически характеризует место Хануна среди сыновей Цалафа. Слово «сын» добавлено для ясности по-русски.
- source_word: מִדָּה שֵׁנִי
  choice: другой участок
  rationale: Буквально выражение означает «вторую меру», но в контексте распределения работ на стене указывает на дополнительный участок. Буквальная форма сохранена в сноске.
- source_word: נֶגֶד
  choice: напротив
  rationale: Предлог выражает пространственное положение перед чем-либо или прямо против него; «напротив» точно и естественно в топографическом описании.
- source_word: נִשְׁכָּתוֹ
  choice: своей комнаты
  rationale: Существительное обозначает отдельную комнату или помещение, не уточняя его назначение. Возвратное местоимение ясно соотносит комнату с Мешулламом.
- source_word: חֲנַנְיָה / שֶׁלֶמְיָה / חָנוּן / צָלָף / מְשֻׁלָּם / בֶּרֶכְיָה
  choice: Ханания / Шелемия / Ханун / Цалаф / Мешуллам / Берехия
  rationale: Имена переданы русской транслитерацией в формах, соответствующих исходному тексту.
