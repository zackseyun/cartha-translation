source:
  edition: WLC
  text: וַֽ/תִּתְּנֵ/ם֙ בְּ/יַ֣ד צָֽרֵי/הֶ֔ם וַ/יָּצֵ֖רוּ לָ/הֶ֑ם וּ/בְ/עֵ֤ת צָֽרָתָ/ם֙ יִצְעֲק֣וּ אֵלֶ֔י/ךָ וְ/אַתָּה֙ מִ/שָּׁמַ֣יִם תִּשְׁמָ֔ע וּֽ/כְ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֗ים תִּתֵּ֤ן לָ/הֶם֙ מֽוֹשִׁיעִ֔ים וְ/יוֹשִׁיע֖וּ/ם מִ/יַּ֥ד צָרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/027.yaml
  text: So you gave them into the hand of their adversaries[a], who oppressed them. But in the time of their distress they cried out to you, and you heard from heaven; and according to your abundant mercies you gave them deliverers, who saved them from the hand of their adversaries.
translation:
  language: ru
  text: И Ты отдал их во власть врагов, которые притесняли их. Но во время бедствия они взывали к Тебе, и Ты слышал с небес и, по великому милосердию Своему, давал им избавителей[a], которые спасали их от власти врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасителей». Еврейское слово образовано от глагола «спасать» и здесь обозначает людей, через которых Бог избавлял народ.'
    reason: Лексическая альтернатива и пояснение человеческой роли названных деятелей.
lexical_decisions:
- source_word: וַתִּתְּנֵם בְּיַד
  choice: И Ты отдал их во власть
  rationale: В данном контексте נתן с выражением «в руку» означает передачу под чужую власть. Русское «отдал во власть» естественно передаёт смысл еврейской идиомы.
- source_word: צָרֵיהֶם
  choice: врагов
  rationale: צַר обозначает враждебных противников; «враги» — точный и общепонятный современный эквивалент, повторённый в конце стиха.
- source_word: וַיָּצֵרוּ לָהֶם
  choice: которые притесняли их
  rationale: Глагол выражает причинение тесноты и бедствия, угнетение; «притесняли» сохраняет отличие от существительного «враги».
- source_word: וּבְעֵת צָרָתָם
  choice: Но во время бедствия
  rationale: «Но» естественно выражает контраст в повествовании, а «бедствие» передаёт צָרָה как тяжёлое стеснённое положение.
- source_word: יִצְעֲקוּ אֵלֶיךָ
  choice: они взывали к Тебе
  rationale: צעק означает настойчивый крик о помощи; «взывали» уместно в молитвенном контексте и сохраняет интенсивность.
- source_word: מִשָּׁמַיִם תִּשְׁמָע
  choice: Ты слышал с небес
  rationale: Сохраняется указание на исходящую «с небес» реакцию Бога. Прошедшее несовершенного вида отражает повторяемость событий в историческом обзоре.
- source_word: וּכְרַחֲמֶיךָ הָרַבִּים
  choice: по великому милосердию Своему
  rationale: רַחֲמִים — глубокое сострадание и милосердие; русское собирательное единственное число естественно передаёт еврейскую форму множественного числа с הָרַבִּים.
- source_word: תִּתֵּן לָהֶם מוֹשִׁיעִים
  choice: давал им избавителей
  rationale: Форма «давал» передаёт повторяемость Божьих действий. מוֹשִׁיעִים называет человеческих деятелей, через которых Бог приносил избавление.
- source_word: וְיוֹשִׁיעוּם
  choice: которые спасали их
  rationale: Относительное придаточное естественно связывает действие с «избавителями», а «спасали» прямо передаёт тот же корень ישׁע.
- source_word: מִיַּד צָרֵיהֶם
  choice: от власти врагов
  rationale: Еврейская идиома «из руки» означает освобождение из-под контроля; «от власти» ясно и естественно выражает её смысл по-русски.
theological_decisions:
- issue: Обозначение человеческих деятелей словом מוֹשִׁיעִים
  choice: избавителей
  alternative: спасителей
  rationale: В контексте циклов угнетения и избавления речь идёт о людях, которых давал Бог. «Избавители» сохраняет их спасительную функцию, не смешивая человеческие орудия избавления с Богом как окончательным Спасителем.
- issue: Временной вид глаголов יִצְעֲקוּ, תִּשְׁמָע, תִּתֵּן, וְיוֹשִׁיעוּם
  choice: взывали… слышал… давал… спасали
  alternative: воззвали… услышал… дал… спасли
  rationale: Йиктольные формы в историческом обзоре допускают итеративное понимание. Несовершенный вид по-русски сохраняет образ неоднократно повторявшегося цикла, не превращая стих в описание лишь одного эпизода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы. Несовершенный вид глаголов передаёт повторяемость цикла отступления, бедствия, молитвы и избавления.
