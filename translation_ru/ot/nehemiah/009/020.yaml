    issue: Неверное управление в выражении «не лишал их уста Своей манны».
    rationale: По-русски лишают людей чего-либо, а не «уста» манны. Еврейское מִפִּיהֶם означает «от их уст» и естественно передаётся глаголом «удержать» с этим дополнением.
  - severity: medium
    issue: «Давал им воду» не соответствует форме נָתַתָּה.
    rationale: В перечислении ретроспективных Божьих деяний еврейский перфект требует совершенного «дал им воду».
  - severity: medium
    issue: «Когда они жаждали» сужает значение לִצְמָאָם.
    rationale: Предлог לְ выражает обеспечение для/ради их жажды, а не обязательно временное обстоятельство.
