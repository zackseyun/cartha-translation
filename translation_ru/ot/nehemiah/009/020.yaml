base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/020.yaml
  text: You gave your good Spirit to instruct them[a], and you did not withhold your manna from their mouth, and you gave them water for their thirst.
translation:
  language: ru
  text: Ты дал им Свой благой Дух, чтобы вразумлять их[a]; Ты не удержал Своей манны от их уст и дал им воду для утоления их жажды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Свой добрый дух, чтобы дать им разумение». Еврейское רוּחַ может означать «дух», «ветер» или «дыхание»; в данном контексте, вероятно, имеется в виду Божий Дух, наставляющий Израиль.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחֲךָ הַטּוֹבָה
  choice: Свой благой Дух
  rationale: רוּחַ может означать «дух», «ветер» или «дыхание». Здесь сочетание с принадлежностью Богу и действием наставления, вероятнее всего, указывает на Божий Дух. Прилагательное הַטּוֹבָה передано словом «благой».
- source_word: לְהַשְׂכִּילָם
  choice: чтобы наставлять их
  rationale: Хифиль глагола שׂכל выражает наделение пониманием или вразумление. «Наставлять» естественно передаёт это каузативное значение в данном контексте.
- source_word: מַנְךָ
  choice: Своей манны
  rationale: Существительное обозначает манну, которой Бог питал народ в пустыне; традиционный русский термин точен и понятен.
- source_word: מָנַעְתָּ מִפִּיהֶם
  choice: не лишал их уста
  rationale: Сохранён конкретный образ еврейского выражения «не удерживал от их уст», но русская конструкция сделана литературно естественной.
- source_word: מַיִם נָתַתָּה לָהֶם לִצְמָאָם
  choice: давал им воду, когда они жаждали
  rationale: Фраза передаёт воду как Божье обеспечение в ответ на жажду; придаточная конструкция звучит по-русски естественнее буквального «для их жажды».
theological_decisions:
- issue: Следует ли понимать רוּחֲךָ הַטּוֹבָה как Божий Дух или как «добрый дух»
  choice: Свой благой Дух
  alternative: свой добрый дух
  rationale: Контекст Божьего дара, который наставляет Израиль, вероятнее указывает на Божий Дух. Поскольку в еврейском письме различие прописной и строчной буквы отсутствует, лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис ясен для широкого читателя; сохранены конкретный образ уст и неоднозначность слова רוּחַ.
