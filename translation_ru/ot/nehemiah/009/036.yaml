  text: הִנֵּ֛ה אֲנַ֥חְנוּ הַ/יּ֖וֹם עֲבָדִ֑ים וְ/הָ/אָ֜רֶץ אֲשֶׁר נָתַ֣תָּה לַ/אֲבֹתֵ֗י/נוּ לֶ/אֱכֹ֤ל אֶת פִּרְיָ/הּ֙ וְ/אֶת טוּבָ֔/הּ הִנֵּ֛ה אֲנַ֥חְנוּ עֲבָדִ֖ים עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/036.yaml
  text: Look[a], today we are servants; and in the land that you gave to our fathers to eat its fruit and its good things, look[c][b], we are servants on it.
translation:
  language: ru
  text: Вот, сегодня мы рабы[a]. А на земле, которую Ты дал нашим отцам, чтобы они ели её плоды и пользовались её благами[b], — вот, мы на ней рабы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуги». Еврейское слово обозначает людей, находящихся в подчинении; здесь, вероятно, подчёркнута зависимость Иудеи от чужеземной власти.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ели её плод и её добро»; последнее выражение может означать изобилие или богатство земли.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «мы рабы на ней», то есть на той самой земле, которую Бог дал нашим отцам.'
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: вот
  rationale: Частица привлекает внимание и усиливает скорбное признание; «вот» естественно передаёт её указательно-эмфатическую функцию в обоих случаях.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Передаёт противопоставление нынешнего порабощённого состояния прежнему дару земли.
- source_word: עֲבָדִים
  choice: рабы
  rationale: В данном контексте речь идёт не просто о служении, а о несвободном положении народа под чужой властью; «рабы» сохраняет остроту жалобы.
- source_word: וְהָאָרֶץ ... עָלֶיהָ
  choice: А на земле ... мы на ней рабы
  rationale: 'Русская конструкция воспроизводит вынесенное вперёд указание на землю и итоговое «на ней», подчёркивая горькую иронию: народ порабощён на земле, данной ему Богом.'
- source_word: אֲשֶׁר נָתַתָּה לַאֲבֹתֵינוּ
  choice: которую Ты дал нашим отцам
  rationale: Сохраняет прямое обращение к Богу и конкретное мужское родственное обозначение исходного текста.
- source_word: לֶאֱכֹל אֶת־פִּרְיָהּ וְאֶת־טוּבָהּ
  choice: чтобы они ели её плоды и пользовались её благами
  rationale: «Ели её плоды» сохраняет сельскохозяйственный образ, а «пользовались её благами» естественно передаёт более широкое טוּבָהּ, не сводя его только к урожаю.
theological_decisions:
- issue: Значение עֲבָדִים в молитве-плаче о положении Иудеи
  choice: рабы
  alternative: слуги
  rationale: Контекст говорит о политической зависимости и утрате свободы на обетованной земле. «Рабы» точнее выражает тяжесть подчинения, не вводя дополнительного догматического толкования.
- issue: Передача לַאֲבֹתֵינוּ
  choice: нашим отцам
  alternative: нашим предкам
  rationale: Исходный текст употребляет мужское семейно-родовое обозначение; буквальная передача сохраняет его форму и библейско-исторический оттенок.
- issue: Ироническое сопоставление дара земли и порабощения на ней
  choice: сохранить повтор «вот» и выражение «мы на ней рабы»
  alternative: сгладить как «но теперь мы порабощены в этой земле»
  rationale: Повтор הִנֵּה и итоговое עָלֶיהָ создают богословски значимое напряжение между Божьим даром и нынешним унижением народа; перевод не объясняет и не снимает это напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным молитвенным тоном. Повтор «вот» и конструкция «мы на ней рабы» намеренно сохранены ради риторического ударения; прописное «Ты» соответствует уважительному прямому обращению к Богу.
