source:
  edition: WLC
  text: אַתָּה ה֣וּא יְהוָה֮ לְ/בַדֶּ/ךָ֒ את עָשִׂ֡יתָ אֶֽת הַ/שָּׁמַיִם֩ שְׁמֵ֨י הַ/שָּׁמַ֜יִם וְ/כָל צְבָאָ֗/ם הָ/אָ֜רֶץ וְ/כָל אֲשֶׁ֤ר עָלֶ֨י/הָ֙ הַ/יַּמִּים֙ וְ/כָל אֲשֶׁ֣ר בָּ/הֶ֔ם וְ/אַתָּ֖ה מְחַיֶּ֣ה אֶת כֻּלָּ֑/ם וּ/צְבָ֥א הַ/שָּׁמַ֖יִם לְ/ךָ֥ מִשְׁתַּחֲוִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/006.yaml
  text: You alone are Yahweh[a]. You made the heavens, the highest heavens and all their host, the earth and all that is on it, the seas and all that is in them; and you preserve all of them alive[c][b], and the host of heaven bows down to you.
translation:
  language: ru
  text: Ты один — Яхве[a]. Ты создал небеса, небеса небес и всё их воинство, землю и всё, что на ней, моря и всё, что в них. Ты даёшь жизнь им всем[b], и небесное воинство поклоняется Тебе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога; в еврейском тексте стоит יהוה (ЙХВХ).
    reason: divine_name
  - marker: b
    text: 'Или: «Ты поддерживаешь жизнь во всём этом»; также возможно: «Ты сохраняешь их всех в живых».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «воинство небес поклоняется Тебе». Выражение может обозначать небесные светила и/или небесных существ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אַתָּה הוּא ... לְבַדֶּךָ
  choice: Ты один — Яхве
  rationale: Сохраняет усиление, создаваемое двумя местоимениями и словом «один», в естественной русской формулировке.
- source_word: עָשִׂיתָ
  choice: создал
  rationale: В контексте происхождения всего мироздания русское «создал» естественно передаёт עשה, не меняя основного смысла.
- source_word: הַשָּׁמַיִם שְׁמֵי הַשָּׁמַיִם
  choice: небеса, небеса небес
  rationale: Сохраняет конкретную древнееврейскую конструкцию и её возвышенное звучание, не сводя её безоговорочно к толкованию «высшие небеса».
- source_word: צְבָאָם
  choice: всё их воинство
  rationale: '«Воинство» сохраняет широту значения: небесные светила и/или небесные существа; «всё» передаёт כָּל.'
- source_word: הָאָרֶץ וְכָל אֲשֶׁר עָלֶיהָ
  choice: землю и всё, что на ней
  rationale: В перечне сотворённого אֶרֶץ обозначает землю в целом.
- source_word: הַיַּמִּים וְכָל אֲשֶׁר בָּהֶם
  choice: моря и всё, что в них
  rationale: Прямое и естественное соответствие древнееврейскому тексту.
- source_word: מְחַיֶּה אֶת כֻּלָּם
  choice: даёшь жизнь им всем
  rationale: Причастная форма выражает продолжающееся действие; перевод сохраняет возможность понимать его и как дарование, и как поддержание жизни.
- source_word: וּצְבָא הַשָּׁמַיִם
  choice: небесное воинство
  rationale: Не сужает собирательное выражение до одних звёзд или одних ангелов.
- source_word: מִשְׁתַּחֲוִים
  choice: поклоняется
  rationale: Собирательное подлежащее «воинство» естественно требует в русском единственного числа.
theological_decisions:
- issue: Исключительность Яхве
  choice: Ты один — Яхве
  alternative: Ты — Яхве, Ты один
  rationale: Выбранная формулировка ясно выражает исключительность и сохраняет прямую связь сказуемого с божественным именем.
- issue: Значение מְחַיֶּה применительно ко всему творению
  choice: Ты даёшь жизнь им всем
  alternative: Ты поддерживаешь жизнь во всём этом / Ты сохраняешь их всех в живых
  rationale: Древнееврейская форма допускает как наделение жизнью, так и её непрерывное поддержание; основной текст не ограничивает значение только одним аспектом.
- issue: Кого обозначает «небесное воинство»
  choice: небесное воинство
  alternative: воинство небес / небесные силы
  rationale: Сохранено широкое обозначение без догматического уточнения, идёт ли речь об ангелах, светилах или обо всей небесной совокупности.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Сохранён образ «небеса небес» как подлинная древнееврейская формула; синтаксис разделён на два предложения ради ясности. Местоимение «Тебе» написано с прописной буквы в соответствии с распространённой русской религиозной издательской практикой.
