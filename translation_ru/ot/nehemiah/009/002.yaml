base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/002.yaml
  text: Then the offspring of Israel separated themselves from all foreigners[b][a], and they stood and confessed their sins and the iniquities of their fathers.
translation:
  language: ru
  text: Потомки Израиля[a] отделились от всех иноплеменников, встали и исповедали свои грехи и беззакония своих отцов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семя Израиля»; то есть потомки Израиля.'
    reason: lexical_alternative
  - marker: b
    text: Выражение может указывать на беззакония предков, признаваемые народом в общем исповедании; стих сам по себе не уточняет, означает ли это личную виновность потомков.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּבָּדְלוּ
  choice: отделились
  rationale: Нифаль глагола בדל здесь естественно передаёт осознанное отделение самих действующих лиц; русское «отделились» сохраняет возвратный оттенок, не сводя форму к чистому пассиву.
- source_word: זֶרַע יִשְׂרָאֵל
  choice: потомки Израиля
  rationale: זֶרַע буквально означает «семя», но в данном коллективном генеалогическом значении современное русское «потомки» ясно и естественно передаёт смысл.
- source_word: מִכֹּל בְּנֵי נֵכָר
  choice: от всех иноплеменников
  rationale: Сочетание בְּנֵי נֵכָר обозначает людей чужеземного происхождения, а не только мужчин или буквальных «сыновей». «Иноплеменники» сохраняет связь с чужим происхождением и соответствует возвышенному историческому регистру.
- source_word: וַיַּעַמְדוּ
  choice: и встали
  rationale: עמד обычно означает «стоять» или «встать»; последовательное повествование допускает естественное русское «встали», обозначающее позу при исповедании.
- source_word: וַיִּתְוַדּוּ
  choice: и исповедали
  rationale: Хитпаэль от ידה в данном контексте означает признание грехов перед Богом. «Исповедали» точно и лаконично передаёт этот религиозный смысл.
- source_word: חַטֹּאתֵיהֶם
  choice: свои грехи
  rationale: Множественное число חַטָּאת здесь прямо обозначает грехи; возвратное «свои» естественно соотносит их с подлежащим.
- source_word: עֲוֺנוֹת אֲבֹתֵיהֶם
  choice: беззакония своих отцов
  rationale: עָוֹן может обозначать беззаконие, вину или её последствия. В параллели с «грехами» слово «беззакония» сохраняет отдельный лексический оттенок и не сужает смысл до наказания.
theological_decisions:
- issue: Совместное исповедание проступков предков
  choice: Народ исповедал как собственные грехи, так и беззакония своих отцов.
  alternative: Народ признавал лишь последствия вины отцов либо только исторический факт их проступков.
  rationale: Синтаксис связывает оба дополнения с глаголом «исповедали». Перевод сохраняет корпоративное признание неверности предков, но не утверждает сверх текста, что потомки несут их личную вину.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейско-историческим регистром. Союзная последовательность еврейского повествования сохранена без чрезмерной архаизации. Маркеры сносок поставлены непосредственно после выражений, к которым они относятся.
