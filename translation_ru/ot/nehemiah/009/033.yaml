  yaml_path: translation/ot/nehemiah/009/033.yaml
  text: Yet you are righteous in all that has come upon us[a], for you have acted faithfully, but we have acted wickedly.
translation:
  language: ru
  text: Но Ты праведен во всём, что постигло нас, потому что Ты поступал верно[a], а мы поступали нечестиво.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Ты совершал истину», то есть поступал истинно и верно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Но Ты
  rationale: Союз в контексте противопоставляет Божью праведность виновности народа; «Но Ты» естественно передаёт этот контраст и сохраняет прямое обращение.
- source_word: צַדִּיק
  choice: праведен
  rationale: Слово утверждает нравственную правоту Бога в отношении постигших народ бедствий; «праведен» сохраняет богословскую и заветную весомость исходного выражения.
- source_word: עַל כָּל הַבָּא עָלֵינוּ
  choice: во всём, что постигло нас
  rationale: Оборот обозначает, в каком отношении Бог признаётся праведным. Глагол «постигло» естественно описывает выпавшие народу бедствия, не уточняя сверх текста их механизм.
- source_word: כִּי
  choice: потому что
  rationale: 'Союз вводит основание предыдущего утверждения: Бог праведен, поскольку Он поступал верно, тогда как народ поступал нечестиво.'
- source_word: אֱמֶת עָשִׂיתָ
  choice: Ты поступал верно
  rationale: Буквально сочетание близко к «Ты делал истину», но в данном контексте означает надёжное, верное поведение. Русское «поступал верно» передаёт смысл естественно, сохраняя связь с истиной и верностью.
- source_word: וַאֲנַחְנוּ
  choice: а мы
  rationale: Союз выражает резкое сопоставление поведения народа с Божьей верностью; русское «а мы» передаёт его без излишнего усиления.
- source_word: הִרְשָׁעְנוּ
  choice: поступали нечестиво
  rationale: Форма глагола означает поступать нечестиво или виновно. Выбор сохраняет деятельный смысл и синтаксический параллелизм с «Ты поступал верно».
theological_decisions:
- issue: Божья праведность в связи с постигшим Израиль судом
  choice: Бог признаётся праведным во всём, что постигло народ.
  alternative: Ты справедливо наказал нас за всё.
  rationale: Исходный текст утверждает Божью праведность относительно пережитых бедствий, но не формулирует здесь напрямую ни способ, ни меру наказания. Перевод сохраняет это напряжение и не добавляет отсутствующей конкретизации.
- issue: Значение אֱמֶת в описании Божьих действий
  choice: Ты поступал верно.
  alternative: Ты творил истину.
  rationale: Буквальный образ отмечен в сноске, а основной текст передаёт контекстуальный смысл Божьей истинности и верности, не сводя выражение к абстрактной правдивости.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Местоимения прямого обращения к Богу написаны с прописной буквы согласно устойчивой русской издательской традиции. Параллелизм «Ты поступал верно — мы поступали нечестиво» сохраняет риторику исповедания.
