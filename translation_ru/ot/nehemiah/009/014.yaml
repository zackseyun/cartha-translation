base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/014.yaml
  text: You made your holy Sabbath known to them[b][a], and you commanded them commandments and statutes and a law by the hand of Moses your servant.
translation:
  language: ru
  text: Ты открыл им свою святую субботу и предписал им заповеди, установления и закон[a] через Моисея, своего раба.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление». Еврейское слово תּוֹרָה может обозначать как закон, так и наставление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «рукой Моисея, твоего раба» — еврейская идиома со значением «через Моисея, твоего раба».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת קָדְשְׁךָ
  choice: свою святую субботу
  rationale: Сохраняет конкретное заветно-богослужебное значение שַׁבָּת и естественно передаёт именную конструкцию קָדְשְׁךָ, которая здесь выполняет определительную функцию.
- source_word: הוֹדַעַתָ
  choice: открыл им
  rationale: Передаёт каузативное значение породы хифиль от ידע — «сделать известным, дать узнать» — естественным современным русским выражением.
- source_word: מִצְוֹת
  choice: заповеди
  rationale: Точный и привычный эквивалент для предписаний в заветно-правовом контексте.
- source_word: חֻקִּים
  choice: установления
  rationale: Передаёт смысл предписанных норм и сохраняет отличие от более общего מִצְוֹת.
- source_word: תוֹרָה
  choice: закон
  rationale: В ряду с заповедями и установлениями правовой смысл особенно заметен; возможный более широкий оттенок «наставление» сохранён в сноске.
- source_word: צִוִּיתָ לָהֶם
  choice: заповедал им
  rationale: Сохраняет прямую силу глагола צוה и не ослабляет его до нейтрального «дал».
- source_word: בְּיַד מֹשֶׁה עַבְדֶּךָ
  choice: через Моисея, своего раба
  rationale: Естественно передаёт еврейскую идиому посредничества בְּיַד; буквальная форма отмечена в сноске.
theological_decisions:
- issue: Передача правовой триады מִצְוֹת וְחֻקִּים וְתוֹרָה
  choice: заповеди, установления и закон
  alternative: повеления, постановления и наставление
  rationale: Выбранный вариант сохраняет три различимых понятия и заветно-правовой характер контекста, не сводя их к одному общему обозначению.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-исторического контекста. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная издательская норма. Сохранено намеренное однокоренное сочетание «заповедал… заповеди», отражающее צִוִּיתָ… מִצְוֹת и юридическую выразительность оригинала.
