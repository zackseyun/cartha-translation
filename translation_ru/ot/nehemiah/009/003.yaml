  text: And they stood in their place[a], and they read from the Book of the Law of Yahweh their God for a fourth of the day[b]; and for another fourth they were confessing and bowing down to Yahweh their God.
translation:
  language: ru
  text: Они встали на своих местах[a] и четверть дня читали из книги Закона Яхве, их Бога; другую четверть дня они исповедовались и поклонялись Яхве, их Богу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на месте, где им надлежало стоять»; возможно также: «на возвышении». Еврейское выражение сжато и допускает разные понимания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «четверть дня… и четверть». Одну четверть дня они читали, а другую — исповедовались и поклонялись.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֨וּמוּ עַל עָמְדָם
  choice: они стояли на своих местах
  rationale: Сочетание קום с сжатым выражением עַל עָמְדָם в данном контексте обозначает, что собравшиеся находились на отведённых им местах. Такой перевод естественен по-русски и не предполагает конкретного сооружения.
- source_word: וַיִּקְרְאוּ בְּסֵפֶר תּוֹרַת
  choice: читали из книги Закона
  rationale: При сочетании קרא с בְּסֵפֶר речь идёт о чтении письменного текста; предлог «из» естественно передаёт источник чтения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: רְבִעִית הַיּוֹם וּרְבִעִית
  choice: четверть дня; а другую четверть
  rationale: Сохранены обе четверти дня и эллиптический параллелизм оригинала; «другую» естественно уточняет вторую временную часть.
- source_word: מִתְוַדִּים
  choice: исповедовались
  rationale: Причастная форма описывает продолжительное действие в течение указанного промежутка времени; русский несовершенный вид сохраняет эту длительность.
- source_word: וּמִשְׁתַּחֲוִים
  choice: поклонялись
  rationale: Глагол обозначает поклон или простирание перед Богом как действие поклонения. «Поклонялись» естественно для современного русского и сохраняет направленность, выраженную לַיהוָה.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте употреблено собственное имя Бога. «Яхве» сохраняет его как имя и следует наиболее принятой научной реконструкции произношения.
- issue: Конкретное телесное действие или обобщённое поклонение в וּמִשְׁתַּחֲוִים
  choice: поклонялись
  alternative: склонялись; простирались ниц
  rationale: 'Контекст прямо направляет действие к Яхве, поэтому культовый смысл несомненен. При этом примечание не требуется: русский глагол «поклоняться» сохраняет связь как с почитанием, так и с поклоном, не утверждая точную степень простирания.'
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис близок к еврейскому, но естественен по-русски; несовершенный вид передаёт длительные действия. Формулировка не уточняет, была ли «книга» кодексом или свитком.
