source:
  edition: WLC
  text: וַ/יְמָאֲנ֣וּ לִ/שְׁמֹ֗עַ וְ/לֹא זָכְר֤וּ נִפְלְאֹתֶ֨י/ךָ֙ אֲשֶׁ֣ר עָשִׂ֣יתָ עִמָּ/הֶ֔ם וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וַ/יִּתְּנוּ רֹ֛אשׁ לָ/שׁ֥וּב לְ/עַבְדֻתָ֖/ם בְּ/מִרְיָ֑/ם וְ/אַתָּה֩ אֱל֨וֹהַּ סְלִיח֜וֹת חַנּ֧וּן וְ/רַח֛וּם אֶֽרֶךְ אַפַּ֥יִם וְ/רַב ו/חסד וְ/לֹ֥א עֲזַבְתָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/017.yaml
  text: But they refused to listen and did not remember your wonders that you had done among them. They stiffened their necks and, in their rebellion, appointed a leader to return to their slavery. But you are a forgiving God[a], gracious and compassionate, slow to anger and abundant in steadfast love, and you did not forsake them.
translation:
  language: ru
  text: Но они отказались слушать и не вспомнили Твоих чудес, которые Ты совершил среди них. Они заупрямились и в своём мятеже поставили себе вождя, чтобы вернуться в рабство. Но Ты — Бог, щедрый на прощение[a], милостивый и сострадательный, долготерпеливый и богатый неизменной любовью, и Ты не оставил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Бог прощений»; множественное число подчёркивает изобилие прощения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ לִשְׁמֹעַ
  choice: они отказались слушать
  rationale: Сохраняет прямое значение отказа слышать, не устраняя подразумеваемого неповиновения.
- source_word: נִפְלְאֹתֶיךָ
  choice: Твоих чудес
  rationale: Кратко и естественно передаёт необычайные Божьи деяния, вызывающие изумление.
- source_word: עָשִׂיתָ עִמָּהֶם
  choice: Ты совершил среди них
  rationale: עִם допускает значение «среди»; перевод подчёркивает, что община была свидетелем Божьих деяний, не сужая смысл до сделанного исключительно ради неё.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: они заупрямились
  rationale: Естественно передаёт смысл древнееврейского образа «сделали шею жёсткой», не вводя в современный русский неясную буквальную кальку.
- source_word: וַיִּתְּנוּ רֹאשׁ
  choice: поставили себе вождя
  rationale: Передаёт идиому «поставили главу» как назначение руководителя; местоимение «себе» естественно выражает направленность действия.
- source_word: לָשׁוּב לְעַבְדֻתָם
  choice: чтобы вернуться в рабство
  rationale: Ясно передаёт עַבְדוּת как состояние подневольного служения в контексте исхода.
- source_word: בְּמִרְיָם
  choice: в своём мятеже
  rationale: Обстоятельственный оборот связан с назначением вождя и сохраняет сильное значение сознательного бунта.
- source_word: אֱלוֹהַּ סְלִיחוֹת
  choice: Бог, щедрый на прощение
  rationale: Естественно выражает усилительное множественное число «прощений» как изобилие Божьего прощения; буквальная форма отмечена в сноске.
- source_word: חַנּוּן וְרַחוּם
  choice: милостивый и сострадательный
  rationale: Различает дарующую милость благосклонность и глубокое сострадание, сохраняя традиционный ряд Божьих качеств.
- source_word: אֶרֶךְ אַפַּיִם
  choice: долготерпеливый
  rationale: Устоявшийся и понятный русский эквивалент идиомы «медленный на гнев».
- source_word: רַב־חֶסֶד
  choice: богатый неизменной любовью
  rationale: «Неизменная любовь» передаёт как сердечную привязанность, так и верность, заложенные в חֶסֶד; «богатый» отражает רַב.
- source_word: וְלֹא עֲזַבְתָּם
  choice: и Ты не оставил их
  rationale: Прямой и естественный перевод, сохраняющий relational and covenantal force Божьей верности.
theological_decisions:
- issue: Передача формулы אֱלוֹהַּ סְלִיחוֹת
  choice: Бог, щедрый на прощение
  alternative: Бог прощений; прощающий Бог
  rationale: Выбранная формулировка сохраняет усилительную силу древнееврейского множественного числа и одновременно звучит естественно по-русски; буквальная конструкция вынесена в сноску.
- issue: Передача חֶסֶד в описании Божьего характера
  choice: неизменная любовь
  alternative: верная любовь; милость; заветная любовь
  rationale: Формулировка удерживает вместе любовь и постоянство, не ограничивая многозначный термин одной конфессионально нагруженной трактовкой.
- issue: Связь בְּמִרְיָם с окружающими словами
  choice: в своём мятеже поставили себе вождя
  alternative: поставили себе вождя, чтобы в своём мятеже вернуться в рабство
  rationale: Размещение оборота при назначении вождя естественно отражает его обстоятельственную функцию, не делая чрезмерно узкого синтаксического утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Архаичное «жестоковыйны» и неясная калька «сделали шею жёсткой» заменены естественным «заупрямились». Прописные формы «Твоих», «Ты» применены последовательно при обращении к Богу.
