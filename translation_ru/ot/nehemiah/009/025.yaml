source:
  edition: WLC
  text: וַֽ/יִּלְכְּד֞וּ עָרִ֣ים בְּצֻרוֹת֮ וַ/אֲדָמָ֣ה שְׁמֵנָה֒ וַ/יִּֽירְשׁ֡וּ בָּתִּ֣ים מְלֵֽאִים כָּל ט֠וּב בֹּר֨וֹת חֲצוּבִ֜ים כְּרָמִ֧ים וְ/זֵיתִ֛ים וְ/עֵ֥ץ מַאֲכָ֖ל לָ/רֹ֑ב וַ/יֹּאכְל֤וּ וַֽ/יִּשְׂבְּעוּ֙ וַ/יַּשְׁמִ֔ינוּ וַ/יִּֽתְעַדְּנ֖וּ בְּ/טוּבְ/ךָ֥ הַ/גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/025.yaml
  text: They captured fortified cities and fertile land[a], and took possession of houses full of every good thing, hewn cisterns, vineyards, olive trees, and fruit trees in abundance. So they ate and were filled and grew fat[c][b], and they delighted themselves in your great goodness.
translation:
  language: ru
  text: Они захватили укреплённые города и плодородную землю[a], завладели домами, полными всякого добра, высеченными цистернами, виноградниками, оливковыми деревьями и плодовыми деревьями в изобилии. Они ели, насыщались, тучнели и наслаждались Твоей великой благостью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тучную землю»; то есть богатую, плодородную землю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכְּדוּ
  choice: захватили
  rationale: Глагол לכד в контексте взятия городов обозначает военный захват.
- source_word: עָרִים בְּצֻרוֹת
  choice: укреплённые города
  rationale: Точно и естественно передаёт города, защищённые укреплениями.
- source_word: אֲדָמָה שְׁמֵנָה
  choice: плодородную землю
  rationale: Буквально «тучная земля»; это древнееврейская идиома, обозначающая богатую, плодородную почву.
- source_word: וַיִּירְשׁוּ
  choice: завладели
  rationale: В данном контексте ירשׁ означает вступить во владение после завоевания; перевод не сужает значение до наследования.
- source_word: בָּתִּים מְלֵאִים כָּל טוּב
  choice: домами, полными всякого добра
  rationale: Сохраняет всеохватность выражения כָּל טוּב и звучит естественно по-русски.
- source_word: בֹּרוֹת חֲצוּבִים
  choice: высеченными водоёмами
  rationale: בּוֹר здесь обозначает высеченное углубление для хранения воды; «водоёмы» понятно современному читателю и не добавляет отсутствующего в тексте «уже».
- source_word: כְּרָמִים וְזֵיתִים וְעֵץ מַאֲכָל לָרֹב
  choice: виноградниками, маслинами и множеством плодовых деревьев
  rationale: «Маслины» естественно обозначают оливковые деревья в перечне сельскохозяйственных владений; לָרֹב передано как «множеством» и отнесено непосредственно к ближайшему элементу перечня.
- source_word: וַיֹּאכְלוּ וַיִּשְׂבְּעוּ
  choice: ели, насыщались
  rationale: Сохраняет последовательность действий и конкретный смысл שׂבע — насытиться пищей.
- source_word: וַיַּשְׁמִינוּ
  choice: тучнели
  rationale: Сохраняет яркий буквальный образ достатка, не превращая его автоматически в нравственное осуждение.
- source_word: וַיִּתְעַדְּנוּ
  choice: наслаждались
  rationale: Глагол выражает жизнь в удовольствии и изобилии; «наслаждались» передаёт это без лишней отрицательной окраски.
theological_decisions:
- issue: Значение בְּטוּבְךָ הַגָּדוֹל
  choice: Твоей великой благостью
  alternative: Твоими великими благами / в Твоём великом изобилии
  rationale: «Благость» сохраняет более широкий смысл Божьей доброты и щедрости, тогда как контекст материальных даров остаётся очевидным. Творительный падеж естественно передаёт связь наслаждения с Божьей благостью, не сводя её только к причинности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение, обращённое к Богу, написано с прописной буквы. Образ «тучнели» сохранён как намеренно конкретная древнееврейская метафора изобилия.
