  to: Они захватили укреплённые города и плодородную землю[a], завладели домами, полными всякого добра, высеченными цистернами, виноградниками, оливковыми деревьями и плодовыми деревьями в изобилии. Они ели, насыщались, тучнели и наслаждались Твоей великой благостью.
