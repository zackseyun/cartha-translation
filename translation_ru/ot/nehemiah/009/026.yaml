base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/026.yaml
  text: But they acted presumptuously and rebelled against you[a], and they cast your law behind their backs. They killed your prophets, who had warned them in order to bring them back to you[d][c][b], and they committed great blasphemies.
translation:
  language: ru
  text: Но они дерзко противились[a] и восстали против Тебя, отбросили Твой закон[b] себе за спину и убили Твоих пророков, которые предостерегали их[c], чтобы возвратить их к Тебе. Они совершили великие кощунства[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ослушались», «упрямились» или «вызывающе противились»; еврейский глагол подразумевает дерзкое, сознательное сопротивление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Твоё наставление».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «свидетельствовали против них»; еврейское выражение может означать торжественное свидетельство, увещевание или предупреждение.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «великие оскорбления», «великие проявления презрения» или «великие хулы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּמְרוּ
  choice: дерзко противились
  rationale: Глагол מרה обозначает непокорное, вызывающее сопротивление. Такое выражение отличает его от следующего, более прямого глагола «восстали», и сохраняет нарастание мысли.
- source_word: וַיִּמְרְדוּ בָּךְ
  choice: восстали против Тебя
  rationale: מרד прямо обозначает мятеж или восстание; предлог בְּ при личном объекте передан как «против Тебя».
- source_word: וַיַּשְׁלִכוּ ... אַחֲרֵי גַוָּם
  choice: отбросили Твой закон себе за спину
  rationale: Сохранён конкретный еврейский образ намеренного и презрительного отвержения, а не заменён отвлечённым «пренебрегли».
- source_word: תּוֹרָתְךָ
  choice: Твой закон
  rationale: В контексте заветно-исторической исповеди «закон» является естественным и узнаваемым соответствием, хотя תּוֹרָה может шире означать наставление.
- source_word: נְבִיאֶיךָ
  choice: Твоих пророков
  rationale: Прямое и общепринятое соответствие исходному слову.
- source_word: הֵעִידוּ בָם
  choice: предостерегали их
  rationale: Порода hifil от עוּד может выражать торжественное свидетельство или предупреждение. Следующая фраза о возвращении к Богу указывает на предостерегающую и восстановительную цель.
- source_word: לַהֲשִׁיבָם אֵלֶיךָ
  choice: чтобы возвратить их к Тебе
  rationale: Сохранено каузативное значение שוב и направленность возвращения народа к Богу.
- source_word: נֶאָצוֹת גְּדוֹלֹת
  choice: великие кощунства
  rationale: Словосочетание обозначает тяжкие проявления презрения к Богу. «Кощунства» передаёт религиозную направленность и не ограничивает значение только произнесёнными словами.
theological_decisions:
- issue: Передача пары וַיַּמְרוּ / וַיִּמְרְדוּ
  choice: Различить как «дерзко противились и восстали»
  alternative: «ослушались и восстали» или «возмутились и восстали»
  rationale: Два близких, но разных глагола переданы разными выражениями, чтобы сохранить риторическое усиление и образ сознательного неповиновения.
- issue: Передача נֶאָצוֹת как религиозно направленного оскорбления
  choice: «великие кощунства»
  alternative: «великие оскорбления», «великое презрение» или «великие хулы»
  rationale: Контекст описывает заветное противление Богу. «Кощунства» ясно передаёт эту направленность, а примечание сохраняет более широкий лексический диапазон слова.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-исповедального контекста. Местоимения, обращённые к Богу, написаны с прописной буквы. Конкретный образ закона, отброшенного за спину, сохранён; архаические и узкоконфессиональные формулировки не использованы.
