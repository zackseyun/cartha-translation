source:
  edition: WLC
  text: וּֽ/בְ/רַחֲמֶ֧י/ךָ הָ/רַבִּ֛ים לֹֽא עֲשִׂיתָ֥/ם כָּלָ֖ה וְ/לֹ֣א עֲזַבְתָּ֑/ם כִּ֛י אֵֽל חַנּ֥וּן וְ/רַח֖וּם אָֽתָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/031.yaml
  text: But in your abundant mercies you did not make an end of them or abandon them[a], for you are a gracious and compassionate God.
translation:
  language: ru
  text: Но по Своему великому милосердию Ты не истребил их окончательно и не оставил их[a], потому что Ты — Бог милостивый и сострадательный.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не положил им конец и не покинул их».'
    reason: Лексические варианты для идиомы עשה כלה («положить конец», «истребить окончательно») и глагола עזב («оставить», «покинуть»).
lexical_decisions:
- source_word: וּבְרַחֲמֶיךָ הָרַבִּים
  choice: Но по великому милосердию Твоему
  rationale: Начальный ו передаёт контраст с предшествующим рассказом о непокорности народа. רַחֲמִים обозначает милосердие и сострадание, а הָרַבִּים усиливает его меру; естественное русское сочетание «по великому милосердию» передаёт основание Божьего действия.
- source_word: לֹא עֲשִׂיתָם כָּלָה
  choice: Ты не истребил их до конца
  rationale: Оборот עשה כלה означает довести до полного конца, окончательно уничтожить. Выражение «не истребил их до конца» ясно передаёт угрозу полного уничтожения, не уточняя его способ.
- source_word: וְלֹא עֲזַבְתָּם
  choice: и не оставил их
  rationale: עזב может означать оставить или покинуть. «Не оставил их» — естественная современная формулировка, сохраняющая возможный оттенок того, что Бог не отказался от народа.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину названного Божьего снисхождения; «потому что» выражает эту логическую связь недвусмысленно и естественно.
- source_word: אֵל
  choice: Бог
  rationale: Здесь אֵל служит обычным обозначением Бога; добавление значения «могучий» контекстом не требуется.
- source_word: חַנּוּן
  choice: благодатный
  rationale: Прилагательное обозначает Того, кто проявляет благоволение и дарует милость. «Благодатный» сохраняет отличие от следующего רַחוּם и соответствует возвышенному, но понятному библейскому регистру.
- source_word: וְרַחוּם
  choice: и сострадательный
  rationale: רַחוּם выражает глубокое сострадание. «Сострадательный» сохраняет смысловое отличие от חַנּוּן и от существительного «милосердие» в начале стиха.
- source_word: אָתָּה
  choice: Ты —
  rationale: Самостоятельное местоимение имеет эмфатический характер. В русском он естественно передаётся явным «Ты» и именной конструкцией с тире.
theological_decisions:
- issue: Передача формулы Божьего характера חַנּוּן וְרַחוּם
  choice: благодатный и сострадательный
  alternative: милостивый и милосердный
  rationale: Выбранная пара сохраняет различие между Божьим благоволением и состраданием, не сводя оба еврейских определения к почти одинаковым русским словам и не добавляя конфессионально обусловленного смысла.
- issue: Значение начального ו
  choice: противительное «Но»
  alternative: соединительное «И»
  rationale: В контексте молитвы Божье милосердие противопоставляется постоянной непокорности народа; «Но» естественно передаёт эту дискурсивную функцию.
- issue: Степень уничтожения в עשה כלה
  choice: не истребил их до конца
  alternative: не погубил их совершенно
  rationale: Формулировка сохраняет идею полного прекращения существования народа и не утверждает, будто наказания или частичного истребления вовсе не было.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенно-библейским звучанием. Сохранено обращение к Богу с прописной буквы. Формулировка избегает архаического «не предал их истреблению», но удерживает торжественность исходной молитвы.
