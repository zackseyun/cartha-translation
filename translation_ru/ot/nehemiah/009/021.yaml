  text: וְ/אַרְבָּעִ֥ים שָׁנָ֛ה כִּלְכַּלְתָּ֥/ם בַּ/מִּדְבָּ֖ר לֹ֣א חָסֵ֑רוּ שַׂלְמֹֽתֵי/הֶם֙ לֹ֣א בָל֔וּ וְ/רַגְלֵי/הֶ֖ם לֹ֥א בָצֵֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/021.yaml
  text: For forty years you sustained them in the wilderness[a]; they lacked nothing. Their clothes did not wear out[b], and their feet did not swell.
translation:
  language: ru
  text: Сорок лет Ты обеспечивал их всем необходимым в пустыне, и они ни в чём не нуждались. Одежда их не изнашивалась, и ноги их не опухали.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Втор. 8:4.
    reason: cross_reference
lexical_decisions:
- source_word: כִּלְכַּלְתָּם
  choice: Ты обеспечивал их всем необходимым
  rationale: Форма глагола כלכל выражает длительную заботу и обеспечение. Такой перевод передаёт весь спектр Божьего попечения, не сводя его только к пище.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; «в пустыне» — естественное и традиционное русское обозначение места странствий Израиля.
- source_word: לֹא חָסֵרוּ
  choice: они ни в чём не нуждались
  rationale: Абсолютное употребление חסר с отрицанием выражает отсутствие нужды; русская формулировка естественно передаёт полную достаточность.
- source_word: שַׂלְמֹתֵיהֶם
  choice: одежда их
  rationale: שַׂלְמָה означает одежду или одеяние, нередко верхнее; обобщённое «одежда» ясно и уместно в современном русском тексте.
- source_word: לֹא בָלוּ
  choice: не изнашивалась
  rationale: Глагол בלה описывает обветшание и износ; применительно к одежде «не изнашивалась» точно и естественно.
- source_word: וְרַגְלֵיהֶם לֹא בָצֵקוּ
  choice: и ноги их не опухали
  rationale: בצק в данном контексте означает опухать или отекать; «не опухали» сохраняет конкретный телесный образ исходного текста.
- source_word: וְאַרְבָּעִים שָׁנָה
  choice: Сорок лет
  rationale: Начальный союз продолжает предыдущее повествование, но в русском отдельном стихе его можно не выражать явно; временная длительность сохранена.
theological_decisions:
- issue: Характер Божьего обеспечения в пустыне
  choice: «обеспечивал их всем необходимым»
  alternative: «питал их»
  rationale: Исходный глагол имеет более широкий смысл, чем одно лишь питание; выбранный вариант не сужает Божье попечение до предоставления пищи.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified библейским звучанием. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Порядок «одежда их», «ноги их» сохраняет умеренно возвышенный ритм, оставаясь понятным современному читателю.
