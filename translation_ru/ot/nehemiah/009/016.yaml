source:
  edition: WLC
  text: וְ/הֵ֥ם וַ/אֲבֹתֵ֖י/נוּ הֵזִ֑ידוּ וַ/יַּקְשׁוּ֙ אֶת עָרְפָּ֔/ם וְ/לֹ֥א שָׁמְע֖וּ אֶל מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/016.yaml
  text: But they[a], our fathers, acted presumptuously and stiffened their neck[c][b], and did not listen to your commandments.
translation:
  language: ru
  text: Но они, наши отцы, поступили дерзко[a], стали упрямы[b] и не слушались Твоих заповедей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступили самонадеянно»; «вели себя высокомерно».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сделали свою шею жёсткой» — еврейский образ упрямства и непокорности.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: Но они
  rationale: Самостоятельное местоимение с союзом противопоставляет поведение отцов предшествующим милостивым деяниям Бога; «Но они» естественно передаёт этот контраст.
- source_word: וַאֲבֹתֵינוּ
  choice: наши отцы
  rationale: Буквально передаёт родственное обозначение и сохраняет выраженную в молитве общность нынешнего народа с прежними поколениями.
- source_word: הֵזִידוּ
  choice: поступили дерзко
  rationale: Глагол обозначает гордое, самонадеянное или дерзкое поведение; выбранная формулировка передаёт действие и его отрицательную нравственную оценку.
- source_word: וַיַּקְשׁוּ אֶת־עָרְפָּם
  choice: стали упрямы
  rationale: Еврейская идиома буквально говорит, что они «сделали свою шею жёсткой»; в современном русском естественнее прямо передать смысл — упорное нежелание повиноваться, сохранив буквальный образ в примечании.
- source_word: וְלֹא שָׁמְעוּ אֶל
  choice: не слушались
  rationale: Конструкция означает не только отсутствие слушания, но и отказ внимать и повиноваться. Русское «не слушались» сохраняет связь со слухом и естественно выражает непослушание заповедям.
- source_word: מִצְוֺתֶיךָ
  choice: Твоих заповедей
  rationale: «Заповеди» соответствует заветно-правовому контексту и принятому достоинственному библейскому регистру; прописная буква у местоимения выражает уважительное обращение к Богу.
theological_decisions:
- issue: Корпоративная связь с грешившими прежними поколениями
  choice: «наши отцы»
  alternative: «наши предки»
  rationale: Буквальная формулировка сохраняет то, что молящиеся прямо отождествляют себя со своей исторической общиной, не добавляя более узкого богословского толкования.
- issue: Соотношение слушания и повиновения
  choice: «не слушались Твоих заповедей»
  alternative: «не внимали Твоим заповедям» / «не повиновались Твоим заповедям»
  rationale: 'Выбор сохраняет смысловую напряжённость глагола שׁמע: речь одновременно о нежелании внимать Божьему слову и исполнять его.'
translation_notes:
  register: Современный литературный русский язык с достоинственным молитвенно-историческим регистром. Непрозрачная для многих читателей идиома передана по смыслу, а её буквальный образ сохранён в примечании. Обращение к Богу оформлено традиционным прописным местоимением.
