source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱ֠לֹהֵי/נוּ הָ/אֵ֨ל הַ/גָּד֜וֹל הַ/גִּבּ֣וֹר וְ/הַ/נּוֹרָא֮ שׁוֹמֵ֣ר הַ/בְּרִ֣ית וְ/הַ/חֶסֶד֒ אַל יִמְעַ֣ט לְ/פָנֶ֡י/ךָ אֵ֣ת כָּל הַ/תְּלָאָ֣ה אֲֽשֶׁר מְ֠צָאַתְ/נוּ לִ/מְלָכֵ֨י/נוּ לְ/שָׂרֵ֧י/נוּ וּ/לְ/כֹהֲנֵ֛י/נוּ וְ/לִ/נְבִיאֵ֥/נוּ וְ/לַ/אֲבֹתֵ֖י/נוּ וּ/לְ/כָל עַמֶּ֑/ךָ מִ/ימֵי֙ מַלְכֵ֣י אַשּׁ֔וּר עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/032.yaml
  text: 'And now[a], our God—the great, mighty, and fearsome God, who keeps the covenant and steadfast love—do not let all the hardship that has come upon us seem small before you: upon our kings, our officials, our priests, our prophets, our fathers[b], and all your people, from the days of the kings of Assyria until this day.'
translation:
  language: ru
  text: И ныне, Боже наш — Боже великий, могучий и грозный[a], хранящий завет и неизменную любовь! Пусть все бедствия, постигшие нас — наших царей, начальников, священников, пророков, отцов наших[b] и весь Твой народ, — не покажутся Тебе малыми, со времён царей Ассирии и до сегодняшнего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внушающий благоговейный трепет». Еврейское слово означает, что Бог вызывает страх, почтение и трепет.'
    reason: lexical_alternative
  - marker: b
    text: То есть предков или праотцов народа; еврейское слово имеет мужскую форму.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Боже
  rationale: Слово стоит в приложении к обращению «Боже наш». Повтор «Боже наш — Боже великий…» сохраняет торжественную форму прямого обращения и естественно звучит по-русски.
- source_word: הַגָּדוֹל הַגִּבּוֹר וְהַנּוֹרָא
  choice: великий, могучий и грозный
  rationale: Это устойчивые эпитеты Бога в контексте завета. «Грозный» передаёт способность внушать благоговейный страх и трепет, не сводя значение к жестокости или просто к величию.
- source_word: שׁוֹמֵר
  choice: хранящий
  rationale: Причастие характеризует Бога как постоянно верного завету и любви; русское причастие сохраняет структуру и длительный оттенок исходного текста.
- source_word: הַבְּרִית וְהַחֶסֶד
  choice: завет и неизменную любовь
  rationale: חסד в данном контексте обозначает стойкую, верную любовь в отношениях завета. «Неизменная любовь» передаёт этот смысл современно и без архаизма.
- source_word: אַל יִמְעַט לְפָנֶיךָ
  choice: пусть не покажутся Тебе малым
  rationale: Формулировка сохраняет образ исходной идиомы — бедствия не должны быть «малыми» перед Богом, — не заменяя его более истолковывающим «не считай незначительными».
- source_word: כָּל הַתְּלָאָה
  choice: все бедствия
  rationale: Еврейское собирательное единственное число охватывает весь пережитый народом тяжёлый опыт; русское множественное число естественно выражает совокупность исторических бедствий.
- source_word: אֲשֶׁר מְצָאַתְנוּ
  choice: постигшие нас
  rationale: Буквально бедствия «нашли нас»; «постигшие» точно и естественно передаёт эту еврейскую идиому.
- source_word: לִמְלָכֵינוּ לְשָׂרֵינוּ וּלְכֹהֲנֵינוּ וְלִנְבִיאֵינוּ וְלַאֲבֹתֵינוּ
  choice: наших царей, начальников, священников, пророков, отцов наших
  rationale: Предлог לְ отмечает всех, кого постигли бедствия. «Начальники» достаточно широко передаёт שׂרים как высших руководителей и сановников; «отцов наших» сохраняет мужскую форму и историческую связь с предшествующими поколениями.
- source_word: וּלְכָל עַמֶּךָ
  choice: и весь Твой народ
  rationale: Фраза расширяет перечень от правителей и духовных руководителей до всей общины народа завета.
- source_word: מִימֵי מַלְכֵי אַשּׁוּר עַד הַיּוֹם הַזֶּה
  choice: со времён царей Ассирии и до сего дня
  rationale: Передан непрерывный временной промежуток от эпохи ассирийских царей до настоящего для говорящих дня.
theological_decisions:
- issue: Передача эпитета נוֹרָא
  choice: грозный
  alternative: внушающий благоговейный трепет; страшный
  rationale: «Грозный» сохраняет смысл Божьего величия, вызывающего страх и трепет, но не утверждает, что Бог страшен в смысле зла или безобразия. Сноска удерживает благоговейную сторону значения.
- issue: Передача covenantal חסד
  choice: неизменная любовь
  alternative: милость; верная любовь
  rationale: В сочетании с «заветом» слово обозначает стойкую любовь и верность в отношениях завета. Выбранный вариант не сужает значение только до снисхождения или прощения.
- issue: Передача אֲבֹתֵינוּ
  choice: отцов наших
  alternative: предков наших; праотцов наших
  rationale: Основной текст сохраняет мужскую форму оригинала и риторическую связь поколений. Сноска поясняет, что речь идёт о предшествующих поколениях народа, а не лишь о непосредственных отцах.
- issue: Просьба не считать бедствия малыми перед Богом
  choice: Пусть не покажутся Тебе малым
  alternative: Не считай незначительными
  rationale: Сохранён образный язык молитвы без уточнения того, каким именно действием Бог должен ответить; так не снимается напряжение между признанием справедливого суда и просьбой о милосердном внимании.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным ритмом. Сохранены повторное обращение «Боже», образ «малым перед Тобой» и исторический перечень пострадавших. Формы «Тебе», «Твой» написаны с прописной буквы как знак почтительного прямого обращения к Богу; архаическая лексика сведена к уместному в библейском регистре выражению «до сего дня».
