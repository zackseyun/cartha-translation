  verdict: approve
  source_fidelity: 'Текст точно передаёт смысл еврейского оригинала: обильный урожай земли идёт царям; Бог поставил их над народом вследствие грехов народа; цари распоряжаются людьми и их скотом по собственной воле; народ пребывает в тяжёлом бедствии. Причинное «за наши грехи» уместно передаёт בְּחַטֹּאותֵינוּ и не приписывает Богу одобрения действий царей.'
  naturalness: Русский текст звучит естественно и литературно. «Достаётся царям», «как им угодно» и «мы в великой беде» ясны и соответствуют возвышенному регистру общинной молитвы-плача. Прописное «Ты» последовательно соответствует прямому обращению к Богу в контексте.
  terminology: «Урожай», «цари», «скот», «грехи» и «властвуют» удачно передают ключевые понятия. Перевод «над нами» для גְּוִיֹּתֵינוּ является естественной смысловой передачей, а буквальное значение «над нашими телами» надлежащим образом вынесено в сноску. Сноска [a] корректно поясняет референт суффикса и допустимый лексический оттенок; оба якоря стоят при соответствующих словах.
