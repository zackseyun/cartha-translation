  text: וּ/תְבוּאָתָ֣/הּ מַרְבָּ֗ה לַ/מְּלָכִ֛ים אֲשֶׁר נָתַ֥תָּה עָלֵ֖י/נוּ בְּ/חַטֹּאותֵ֑י/נוּ וְ/עַ֣ל גְּ֠וִיֹּתֵי/נוּ מֹשְׁלִ֤ים וּ/בִ/בְהֶמְתֵּ֨/נוּ֙ כִּ/רְצוֹנָ֔/ם וּ/בְ/צָרָ֥ה גְדוֹלָ֖ה אֲנָֽחְנוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/037.yaml
  text: Its abundant produce goes to the kings whom you have set over us because of our sins[a]. They rule over our bodies and over our livestock as they please[b], and we are in great distress.
translation:
  language: ru
  text: Её обильный урожай[a] достаётся царям, которых Ты поставил над нами за наши грехи. Они властвуют над нами[b] и над нашим скотом как им угодно, и мы в великой беде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть урожай земли, упомянутой в предыдущем стихе; возможно также: «её богатые плоды».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «над нашими телами»; то есть над нами самими.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְבוּאָתָהּ מַרְבָּה
  choice: Её обильный урожай
  rationale: תְּבוּאָה обозначает урожай, плоды земли, а суффикс женского рода отсылает к земле из предыдущего стиха. מַרְבָּה передаёт идею изобилия.
- source_word: לַמְּלָכִים
  choice: достаётся царям
  rationale: 'Предлог ל выражает направление или выгоду: урожай идёт в пользу царей. «Достаётся» естественно передаёт это по-русски.'
- source_word: אֲשֶׁר נָתַתָּה עָלֵינוּ
  choice: которых Ты поставил над нами
  rationale: Сочетание נתן с עַל здесь означает поставить кого-либо правителем над другими и сохраняет прямое указание на действие Бога.
- source_word: בְּחַטֹּאותֵינוּ
  choice: за наши грехи
  rationale: Предлог ב имеет причинное значение; краткая русская конструкция выражает подчинение как следствие грехов.
- source_word: גְּוִיֹּתֵינוּ
  choice: над нами
  rationale: Буквально слово означает «наши тела», но в данном контексте обозначает самих людей как подвластных царям. Основной текст передаёт естественное русское значение, а буквальный образ сохранён в примечании.
- source_word: מֹשְׁלִים
  choice: Они властвуют
  rationale: Причастие обозначает продолжающееся господство. «Властвуют» передаёт власть царей и соответствует скорбному контексту.
- source_word: וּבִבְהֶמְתֵּנוּ
  choice: и над нашим скотом
  rationale: בְּהֵמָה в собирательном значении обозначает домашних хозяйственных животных; «скот» здесь точно и естественно.
- source_word: כִּרְצוֹנָם
  choice: как им угодно
  rationale: Выражение означает действие по собственной воле и подчёркивает неограниченность власти.
- source_word: וּבְצָרָה גְדוֹלָה אֲנָחְנוּ
  choice: и мы в великой беде
  rationale: צָרָה означает беду, притеснение или тяжёлое положение; формулировка сохраняет силу общинного плача и звучит ясно.
theological_decisions:
- issue: Действие Бога в подчинении народа чужеземным царям
  choice: Бог прямо представлен как поставивший царей над народом за его грехи.
  alternative: Бог лишь допустил их власть либо одобряет всё, что делают эти цари.
  rationale: Еврейское נָתַתָּה עָלֵינוּ прямо связывает подчинение с Божьим судебным действием, однако текст не утверждает, что Бог нравственно одобряет произвол царей.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного плача. Обращение к Богу передано с прописной буквы. Формулировки ясны для широкого читателя и сохраняют причинную связь между грехом народа и поставлением царей.
