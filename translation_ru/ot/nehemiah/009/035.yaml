  source_fidelity: 'В целом смысл передан верно: речь о дарованных Богом благах и земле, отказе служить Ему и отказаться от злых дел. Однако «Даже когда они жили в своём царстве» неоправданно превращает исходный предложный оборот в развёрнутое временное придаточное, а «находясь ... в земле» неестественно по-русски и менее точно передаёт пребывание на земле. В исправленном тексте сохранены параллельные обстоятельства еврейского оригинала.'
  naturalness: 'Исправленная фраза более естественна для современного литературного русского: «на ... земле» вместо «в ... земле», без перегруженных деепричастных конструкций. «Они и в своём царстве» ясно передаёт усилительное включение без добавления отдельного временного значения.'
  terminology: «Служили Тебе» удачно сохраняет широкий заветный смысл עבד; «не отвернулись от своих злых дел» точно передаёт שוב מן без навязывания богословского термина «раскаялись». «Просторной и плодородной земле» верно передаёт эпитеты земли.
