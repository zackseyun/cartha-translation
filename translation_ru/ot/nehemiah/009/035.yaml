base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/035.yaml
  text: Even in their kingdom[a], and amid your great goodness that you gave them, and in the broad and fertile land that you set before them[d][c][b], they did not serve you and did not turn from their evil deeds.
translation:
  language: ru
  text: Они и в своём царстве, среди великих благ, которые Ты даровал им, и на просторной и плодородной земле, которую Ты предоставил им[a], не служили Тебе[b] и не отвернулись от своих злых дел[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в широкой и тучной земле»; слово «тучная» здесь означает богатую, плодородную землю.'
    reason: cultural_note
  - marker: b
    text: Еврейский глагол может включать как служение и послушание, так и поклонение.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не раскаялись в своих злых делах»; буквально: «не обратились от своих злых дел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמַלְכוּתָם
  choice: когда они жили в своём царстве
  rationale: Существительное מַלְכוּת обозначает царство, царствование или царскую власть. В контексте речь идёт о времени их устроенной жизни в собственном царстве; временная формулировка естественна по-русски и сохраняет смысл еврейского оборота.
- source_word: וּבְטוּבְךָ הָרָב
  choice: пользуясь великими благами
  rationale: טוּב может обозначать как благость, так и проистекающие из неё блага и изобилие. Здесь дальнейшее уточнение «которые Ты даровал им» указывает прежде всего на щедрые Божьи дары.
- source_word: אֲשֶׁר נָתַתָּ לָהֶם
  choice: которые Ты даровал им
  rationale: Глагол נתן означает «дать»; «даровал» соответствует возвышенному молитвенному контексту и ясно передаёт Божье благодеяние.
- source_word: אֶרֶץ הָרְחָבָה וְהַשְּׁמֵנָה
  choice: просторной и плодородной земле
  rationale: רְחָבָה буквально означает «широкая, просторная», а שְׁמֵנָה — «тучная», то есть, применительно к земле, плодородная. Перевод передаёт идиоматический смысл естественным современным русским языком.
- source_word: אֲשֶׁר נָתַתָּ לִפְנֵיהֶם
  choice: которую Ты отдал им
  rationale: Буквально оборот означает «которую Ты дал перед ними». В данном контексте речь о предоставленной им земле; «отдал им» естественно выражает это значение, не сохраняя неясную русскому читателю кальку.
- source_word: לֹא עֲבָדוּךָ
  choice: они не служили Тебе
  rationale: עבד по отношению к Богу включает служение, послушание и поклонение. «Служили» сохраняет эту смысловую широту.
- source_word: וְלֹא שָׁבוּ מִמַּעַלְלֵיהֶם הָרָעִים
  choice: и не отвернулись от своих злых дел
  rationale: שׁוב с предлогом מן буквально выражает поворот прочь от чего-либо. «Не отвернулись» сохраняет конкретный образ нравственного обращения, не заменяя его более истолковывающим «не раскаялись».
theological_decisions:
- issue: Значение עבד по отношению к Богу
  choice: не служили Тебе
  alternative: не поклонялись Тебе
  rationale: «Служить» охватывает и поклонение, и заветное послушание, не сужая значение до культового действия.
- issue: Нравственное значение שׁוב מן
  choice: не отвернулись от своих злых дел
  alternative: не раскаялись в своих злых делах
  rationale: Выбранный вариант сохраняет исходный образ поворота от зла и не подменяет его богословским термином, хотя раскаяние подразумевается.
- issue: טוּב как качество Бога или дарованные блага
  choice: великие блага, которые Ты даровал им
  alternative: Твоя великая благость, явленная им
  rationale: Сочетание с נתן допускает понимание טוּב как дарованного изобилия. Перевод сохраняет связь с Божьей щедростью, но не утверждает, что им была «дана» сама Божья нравственная благость.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного контекста. Заглавные местоимения «Ты», «Тебе» отражают устойчивую русскую традицию обращения к Богу. Синтаксис слегка разгружен деепричастными и причастными конструкциями, чтобы длинный еврейский период оставался понятным обычному читателю.
