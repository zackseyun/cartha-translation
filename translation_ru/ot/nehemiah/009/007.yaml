base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/007.yaml
  text: You are Yahweh God[a], who chose Abram, brought him out from Ur of the Chaldeans, and gave him the name Abraham.
translation:
  language: ru
  text: Ты — Яхве, Бог, который избрал Аврама, вывел его из Ура Халдейского и дал ему имя Авраам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: Ты —
  rationale: Сочетание личных местоимений имеет усилительно-идентифицирующую функцию; русская конструкция с тире естественно и ясно выражает отождествление.
- source_word: יְהוָה הָאֱלֹהִים
  choice: Яхве Бог
  rationale: Сохранены и личное имя YHWH, переданное как «Яхве», и обозначение «Бог»; сочетание звучит естественно и не заменяет имя титулом.
- source_word: בָּחַרְתָּ בְּאַבְרָם
  choice: избрал Аврама
  rationale: Предлог при глаголе בחר обозначает объект выбора; в русском нужен прямой объект. «Избрал» сохраняет возвышенный библейский регистр без добавления специального догматического смысла.
- source_word: וְהוֹצֵאתוֹ
  choice: вывел его
  rationale: Каузативная форма יצא означает «вывести»; это краткий и точный русский эквивалент, сохраняющий деятельную роль Бога.
- source_word: מֵאוּר כַּשְׂדִּים
  choice: из Ура Халдейского
  rationale: Это закрепившаяся и понятная русская форма географического названия; она передаёт связь города Ура с халдеями.
- source_word: וְשַׂמְתָּ שְׁמוֹ אַבְרָהָם
  choice: дал ему имя Авраам
  rationale: Буквально «положил/установил его имя», но по-русски переименование естественно выражается оборотом «дал ему имя»; различие Аврам/Авраам сохранено.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное божественное имя YHWH. «Яхве» передаёт его как имя, не подменяя титулом; примечание сообщает читателю о форме оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис простой и доступный; имена «Аврам» и «Авраам» намеренно различены.
