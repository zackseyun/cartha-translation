source:
  edition: WLC
  text: וַ/תִּמְשֹׁ֤ךְ עֲלֵי/הֶם֙ שָׁנִ֣ים רַבּ֔וֹת וַ/תָּ֨עַד בָּ֧/ם בְּ/רוּחֲ/ךָ֛ בְּ/יַד נְבִיאֶ֖י/ךָ וְ/לֹ֣א הֶאֱזִ֑ינוּ וַֽ/תִּתְּנֵ֔/ם בְּ/יַ֖ד עַמֵּ֥י הָ/אֲרָצֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/030.yaml
  text: For many years you were patient with them and testified against them by your Spirit through your prophets[a], but they would not listen. So you gave them into the hand of the peoples of the lands.
translation:
  language: ru
  text: Много лет Ты проявлял к ним терпение и предостерегал их Духом Твоим через Твоих пророков[a], но они не слушали. Тогда Ты отдал их в руки народов иных земель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельствовал против них Духом Твоим через Твоих пророков».'
    reason: 'Лексическая альтернатива: глагол עוד в данной форме может означать как предостережение, так и свидетельство против кого-либо.'
lexical_decisions:
- source_word: וַתִּמְשֹׁךְ עֲלֵיהֶם שָׁנִים רַבּוֹת
  choice: Много лет Ты проявлял к ним терпение
  rationale: Идиома передаёт длительное промедление с судом и терпеливое отношение. Русское выражение естественно передаёт продолжительность и снисхождение, не прибегая к буквальному и неясному «простирал над ними».
- source_word: וַתָּעַד בָּם
  choice: и предостерегал их
  rationale: Hifil глагола עוד здесь обозначает настойчивое свидетельство-предупреждение в рамках завета. «Предостерегал» ясно выражает функцию пророческого обращения; судебно-свидетельский оттенок сохранён в сноске.
- source_word: בְּרוּחֲךָ
  choice: Духом Твоим
  rationale: В сочетании с пророческим служением речь наиболее естественно идёт о Божьем Духе как источнике и действующей силе пророческого предостережения.
- source_word: בְּיַד נְבִיאֶיךָ
  choice: через Твоих пророков
  rationale: Еврейская идиома «рукой пророков» обозначает посредничество или орудие действия; «через» естественно передаёт её по-русски.
- source_word: וְלֹא הֶאֱזִינוּ
  choice: но они не слушали
  rationale: Форма означает, что они не внимали сказанному. Краткое русское выражение сохраняет как фактическое непослушание, так и подразумеваемое упорство, не усиливая текст словом «отказывались».
- source_word: וַתִּתְּנֵם בְּיַד
  choice: Тогда Ты отдал их в руки
  rationale: «Тогда» естественно обозначает последовавший результат, а «в руки» сохраняет понятную библейскую идиому передачи под чужую власть.
- source_word: עַמֵּי הָאֲרָצוֹת
  choice: народов иных земель
  rationale: 'Переданы оба множественных числа и регионально-политический смысл: речь идёт о народах различных чужих земель, а не обязательно обо всём человечестве.'
theological_decisions:
- issue: Кого обозначает выражение «Духом Твоим»
  choice: Божий Дух как источник пророческого предостережения
  alternative: Божий дух как Его расположение или дыхание
  rationale: Конструкция «Духом Твоим через Твоих пророков» указывает на божественное действие в пророческой речи. Прописная буква обозначает этот референт, не добавляя к стиху позднейших догматических уточнений.
- issue: Оттенок глагола וַתָּעַד
  choice: предостерегал их
  alternative: свидетельствовал против них
  rationale: Контекст подчёркивает многократные пророческие призывы, поэтому основной текст передаёт коммуникативную функцию как предостережение. Возможный судебный оттенок не устранён, а отмечен в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Местоимения, обращённые к Богу, написаны с прописной буквы по принятой русской библейской традиции. Сохранён умеренный библейский образ «в руки», тогда как непрозрачные еврейские идиомы переданы естественно.
