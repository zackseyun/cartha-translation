source:
  edition: WLC
  text: וּ/מָצָ֣אתָ אֶת לְבָב/וֹ֮ נֶאֱמָ֣ן לְ/פָנֶי/ךָ֒ וְ/כָר֨וֹת עִמּ֜/וֹ הַ/בְּרִ֗ית לָ/תֵ֡ת אֶת אֶרֶץ֩ הַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הָ/אֱמֹרִ֧י וְ/הַ/פְּרִזִּ֛י וְ/הַ/יְבוּסִ֥י וְ/הַ/גִּרְגָּשִׁ֖י לָ/תֵ֣ת לְ/זַרְע֑/וֹ וַ/תָּ֨קֶם֙ אֶת דְּבָרֶ֔י/ךָ כִּ֥י צַדִּ֖יק אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/008.yaml
  text: You found his heart faithful before you[a], and made a covenant with him to give the land of the Canaanite, the Hittite, the Amorite, the Perizzite, the Jebusite, and the Girgashite—to give it to his offspring. And you have fulfilled your words[c][b], for you are righteous.
translation:
  language: ru
  text: Ты нашёл его сердце верным в Твоих глазах и заключил с ним завет, чтобы отдать землю хананеев, хеттеев, амореев, ферезеев, иевусеев и гергесеев — отдать её его потомству[a]. И Ты исполнил Свои слова[b], потому что Ты праведен[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его потомкам». Еврейское слово «семя, потомство» имеет собирательное значение и стоит в единственном числе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «утвердил» или «подтвердил Свои слова».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «справедлив».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָצָאתָ אֶת־לְבָבוֹ נֶאֱמָן לְפָנֶיךָ
  choice: Ты нашёл его сердце верным пред тобой
  rationale: Сохраняет прямое значение מצא («найти») и библейский образ сердца как внутренней личности; «пред тобой» передаёт как присутствие Бога, так и его оценку.
- source_word: וְכָרוֹת עִמּוֹ הַבְּרִית
  choice: и заключил с ним завет
  rationale: Естественно передаёт устойчивый еврейский оборот «срезать завет», не воспроизводя его буквально и непонятно по-русски.
- source_word: לָתֵת ... לָתֵת
  choice: чтобы отдать ... — отдать её
  rationale: Сохранён заметный повтор инфинитива, выражающий содержание завета и подчёркивающий передачу земли потомству Авраама.
- source_word: אֶרֶץ הַכְּנַעֲנִי ... וְהַגִּרְגָּשִׁי
  choice: землю хананеев, хеттеев, амореев, ферезеев, иевусеев и гергесеев
  rationale: Еврейские названия народов имеют форму собирательного единственного числа; русский множественный этноним естественно выражает тот же смысл.
- source_word: לְזַרְעוֹ
  choice: его потомству
  rationale: «Потомство» сохраняет собирательное единственное число זֶרַע и остаётся ясным современному читателю.
- source_word: וַתָּקֶם אֶת־דְּבָרֶיךָ
  choice: И ты исполнил свои слова
  rationale: В данном контексте קום с дополнением «слова» означает осуществить сказанное. Сохранено множественное число דְּבָרֶיךָ.
- source_word: כִּי צַדִּיק אָתָּה
  choice: потому что ты праведен
  rationale: «Праведен» сохраняет широкий нравственный и заветный смысл צַדִּיק, а причинный союз прямо связывает исполнение слов с характером Бога.
theological_decisions:
- issue: Значение צַדִּיק применительно к Богу
  choice: праведен
  alternative: справедлив
  rationale: Оба значения возможны, но «праведен» не сужает смысл до судебной справедливости и лучше сохраняет связь праведности Бога с верностью завету.
- issue: Характер исполнения Божьих слов в וַתָּקֶם
  choice: исполнил свои слова
  alternative: утвердил свои слова
  rationale: Контекст хвалы за верность завету поддерживает смысл осуществления обещанного; примечание сохраняет формально возможное значение «утвердил».
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис остаётся ясным для обычного читателя; повтор «отдать» сохранён как значимая особенность еврейского текста. Местоимения, относящиеся к Богу, даны со строчной буквы по нормам современного издания.
