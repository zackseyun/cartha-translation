  text: וַ/יָּ֜קָם עַֽל מַֽעֲלֵ֣ה הַ/לְוִיִּ֗ם יֵשׁ֨וּעַ וּ/בָנִ֜י קַדְמִיאֵ֧ל שְׁבַנְיָ֛ה בֻּנִּ֥י שֵׁרֵבְיָ֖ה בָּנִ֣י כְנָ֑נִי וַֽ/יִּזְעֲקוּ֙ בְּ/ק֣וֹל גָּד֔וֹל אֶל יְהוָ֖ה אֱלֹהֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/004.yaml
  text: Then Jeshua[a], Bani, Kadmiel, Shebaniah, Bunni, Sherebiah, Bani, and Kenani stood on the platform of the Levites, and they cried out with a loud voice to Yahweh their God.
translation:
  language: ru
  text: Иешуа, Бани, Кадмиил, Шевания, Бунни, Шеревия, Бани и Кенани встали на возвышении левитов[a] и громко воззвали к Яхве, своему Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «на подъёме (или ступенях) левитов»; выражение может обозначать возвышенное место либо лестницу, связанную с левитами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: встали
  rationale: Глагол קום здесь обозначает принятие стоячего положения; множественное число требуется в русском по составному подлежащему, хотя в еврейском перед перечнем стоит форма единственного числа.
- source_word: מַעֲלֵה הַלְוִיִּם
  choice: на возвышении левитов
  rationale: מַעֲלֵה может означать подъём, ступени или возвышенное место. В контексте публичного обращения «возвышение» естественно передаёт вероятную функцию места, а неоднозначность отмечена в сноске.
- source_word: יֵשׁוּעַ וּבָנִי קַדְמִיאֵל שְׁבַנְיָה בֻּנִּי שֵׁרֵבְיָה בָּנִי כְנָנִי
  choice: Иешуа, Бани, Кадмиил, Шевания, Бунни, Шеревия, Бани и Кенани
  rationale: Имена переданы русской транслитерацией; повторное имя Бани сохранено в соответствии с еврейским текстом и не подвергнуто гармонизации.
- source_word: וַיִּזְעֲקוּ
  choice: воззвали
  rationale: זעק выражает сильный крик, нередко обращённый к Богу. «Воззвали» сохраняет и интенсивность, и направленность молитвенного обращения, оставаясь понятным в литературном русском.
- source_word: בְּקוֹל גָּדוֹל
  choice: громко
  rationale: Еврейская идиома буквально означает «великим/громким голосом». Наречие «громко» естественно передаёт её смысл по-русски без тяжеловесности.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», что сохраняет явное употребление Божьего имени в исходном тексте.
- source_word: אֱלֹהֵיהֶם
  choice: своему Богу
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит Бога с подлежащим и точно передаёт суффикс третьего лица множественного числа.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет различие между личным именем יְהוָה и титулом אֲדֹנָי.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Конструкция упрощена для ясного чтения вслух; подлинная неоднозначность מַעֲלֵה сохранена посредством сноски.
