  text: You gave them kingdoms and peoples, and allotted them to every corner. So they took possession of the land of Sihon, that is, the land of the king of Heshbon, and the land of Og king of Bashan.
translation:
  language: ru
  text: Ты дал им царства и народы и распределил их по областям.[a] Они овладели землёй Сихона и землёй царя Хешбона[b], и землёй Ога, царя Башана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разделил их к краю (или: по сторонам)»; смысл еврейского выражения не вполне ясен.'
    reason: Сохраняет лексическую и синтаксическую неоднозначность לְפֵאָה и не выдаёт контекстуальное толкование «по областям» за единственно возможное.
  - marker: b
    text: 'В еврейском тексте: «землёй Сихона и землёй царя Хешбона». Сихон был царём Хешбона, поэтому второе обозначение может пояснять первое.'
    reason: Сохраняет в основном тексте союз оригинала, одновременно отмечая исторически и контекстуально вероятное пояснительное понимание.
lexical_decisions:
- source_word: וַתַּחְלְקֵם לְפֵאָה
  choice: и распределил их по областям
  rationale: Глагол ח־ל־ק означает «делить, распределять, отводить», а פֵּאָה — «край, сторона, область». Формулировка передаёт распределение царств и народов по отдельным территориям, не уточняя механизм этого распределения.
- source_word: וַיִּירְשׁוּ
  choice: они овладели
  rationale: В данном контексте יָרַשׁ обозначает вступление во владение завоёванной землёй; «овладели» естественно передаёт и приобретение, и фактическое обладание.
- source_word: חֶשְׁבּוֹן
  choice: Хешбон
  rationale: Современная русская транслитерация, близкая к еврейской форме; традиционное «Есевон» не требуется самим исходным текстом.
- source_word: הַבָּשָׁן
  choice: Башан
  rationale: Транслитерация еврейского географического названия с определённым артиклем, который по-русски отдельно не передаётся.
theological_decisions:
- issue: Соотношение выражений «земля Сихона» и «земля царя Хешбона»
  choice: Передать второе выражение как поясняющее первое с помощью тире
  alternative: «землёй Сихона и землёй царя Хешбона»
  rationale: Сихон и есть царь Хешбона; поэтому два выражения естественно понимать как обозначения одной территории, хотя формальный союз ו допускает буквальное соединение. Сноска сохраняет видимость этой синтаксической особенности.
translation_notes:
  register: Современный литературный русский язык с молитвенно-историческим достоинством. Местоимение «Ты» сохраняет обращение к Богу и пишется с прописной буквы по принятой русской религиозной норме. Синтаксис краток и доступен; неясности исходного текста отмечены сносками, а не устранены без оговорки.
