revisions:
- from: В двадцать четвёртый день этого месяца израильтяне[a] собрались, постясь, в рубище[b] и посыпав себя землёй[c].
  to: В двадцать четвёртый день этого месяца израильтяне[a] собрались, соблюдая пост, в рубищах[b] и с землёй на себе[c].
  rationale: Замена деепричастного оборота на «с землёй на себе» сохраняет буквальное результативное описание оригинала и не предрешает способ нанесения земли. «В рубищах» естественно для группы и ближе к еврейскому множественному числу. Примечание c уточнено, чтобы культурная справка не подменяла текст утверждением о конкретном действии.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:05:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: дата, собрание израильтян, пост, рубище и земля. Однако «посыпав себя землёй» превращает результативное описание «земля на них» в явно выраженное действие самих людей; способ появления земли и действующее лицо в еврейском тексте не названы.'
  naturalness: Текст в целом естественный. Оборот «в рубищах и с землёй на себе» звучит ясно в современном литературном русском и точнее сохраняет синтаксическую сдержанность оригинала.
  terminology: «Израильтяне» — удачный современный эквивалент בְנֵי יִשְׂרָאֵל; буквальная формулировка корректно дана в примечании. «Рубище» уместно как традиционный культурный термин; множественное число лучше согласуется с описанием группы и еврейским множественным числом.
