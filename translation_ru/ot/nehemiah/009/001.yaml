base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/001.yaml
  text: On the twenty-fourth day of this month[a], the sons of Israel assembled with fasting, in sackcloth[b], and with dirt on them.
translation:
  language: ru
  text: В двадцать четвёртый день этого месяца израильтяне[a] собрались, соблюдая пост, в рубищах[b] и с землёй на себе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля»; то есть израильский народ.'
    reason: lexical_alternative
  - marker: b
    text: Рубище — грубая одежда, которую надевали в знак скорби и покаяния.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «и земля на них». Земля на человеке служила знаком скорби и покаяния; в еврейском тексте не уточняется, что её клали именно на голову или каким образом она оказалась на них.'
    reason: cultural_note
lexical_decisions:
- source_word: וּבְיוֹם עֶשְׂרִים וְאַרְבָּעָה
  choice: В двадцать четвёртый день
  rationale: Естественная русская форма датировки; начальное ו передаёт связь с контекстом и не требует отдельного «и» в русском повествовании.
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: этого месяца
  rationale: Идиоматически передаёт еврейскую формулу даты без уточнения месяца, которого нет в данном стихе.
- source_word: נֶאֶסְפוּ
  choice: собрались
  rationale: Нифаль здесь естественно выражает совместное собирание; русская возвратная форма сохраняет смысл, не вводя внешнего собирателя.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: В данном повествовательном контексте обозначает народ Израиля; современное русское название естественно и не сужает группу до одних мужчин.
- source_word: בְּצוֹם
  choice: постясь
  rationale: Передаёт сопутствующее обстоятельство и практику поста естественным современным русским оборотом.
- source_word: וּבְשַׂקִּים
  choice: в рубище
  rationale: «Рубище» — устоявшееся русское библейское обозначение грубой траурной одежды; форма собирательно описывает состояние собравшихся.
- source_word: וַאֲדָמָה עֲלֵיהֶם
  choice: и посыпав себя землёй
  rationale: Буквально речь идёт о земле на них. Русский оборот ясно передаёт жест скорби и покаяния, не добавляя отсутствующего в тексте указания на голову.
theological_decisions:
- issue: Значение покаянных внешних знаков
  choice: Сохранить пост, рубище и землю как конкретные действия без богословского пояснения в основном тексте
  alternative: Прямо назвать их знаками покаяния
  rationale: Контекст указывает на скорбь и покаяние, но сам стих перечисляет действия; толкование уместнее вынести в примечания.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Израильтяне» выбрано вместо буквального «сыны Израиля» ради естественности и ясности, при этом буквальная форма сохранена в примечании. «Рубище» оставлено как понятный традиционный культурный термин и пояснено.
