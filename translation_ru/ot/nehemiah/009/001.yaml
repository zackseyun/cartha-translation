    rationale: וַאֲדָמָה עֲלֵיהֶם буквально сообщает лишь, что земля была на них. Хотя ритуальный жест вероятен, глагол «посыпав» и возвратное «себя» уточняют способ и субъект действия сверх текста.
  - severity: low
    issue: Примечание c также формулирует непроизнесённое действие как данность
    rationale: Фраза «Посыпать себя землёй было знаком...» может быть полезным культурным пояснением, но в сочетании с основным текстом усиливает добавленную конкретизацию. Лучше описать землю на человеке как знак скорби и покаяния, не утверждая способ нанесения.
