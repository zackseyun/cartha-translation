lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Ты увидел
  rationale: Прямо передаёт глагол ראה и сохраняет личное обращение к Богу; в контексте подразумевается, что Бог заметил бедствие, но это значение не следует разворачивать в самом тексте.
- source_word: עֳנִי
  choice: бедствие
  rationale: Передаёт страдание и тяжёлое положение народа, не сужая значение до одного лишь угнетения.
- source_word: אֲבֹתֵינוּ
  choice: наших отцов
  rationale: Сохраняет явно выраженное в еврейском тексте мужское множественное число и молитвенно-исторический регистр.
- source_word: בְּמִצְרָיִם
  choice: в Египте
  rationale: Естественная и точная передача обстоятельства места.
- source_word: זַעֲקָתָם
  choice: их вопль
  rationale: Слово «вопль» естественно передаёт громкий призыв о помощи, вызванный бедствием.
- source_word: שָׁמַעְתָּ
  choice: услышал
  rationale: Сохраняет обычную библейскую формулировку; контекст допускает подразумеваемый отклик Бога без его явного добавления.
- source_word: עַל
  choice: у
  rationale: В сочетании с географическим объектом обозначает нахождение у моря; по-русски «у» звучит естественно и точно.
- source_word: יַם סוּף
  choice: Красного моря
  rationale: Традиционное и наиболее узнаваемое русское географическое наименование; буквальное лексическое значение приведено в сноске.
