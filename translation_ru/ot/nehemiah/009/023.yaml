base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/023.yaml
  text: You multiplied their children like the stars of the heavens[c][b][a], and you brought them into the land that you had told their fathers to enter and possess.
translation:
  language: ru
  text: И их детей Ты умножил, как звёзды небесные,[a] и привёл их в землю, в которую, как Ты сказал их отцам, те должны были войти и овладеть ею.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как звёзды небес». Эти слова перекликаются с Божьим обещанием патриархам о многочисленном потомстве.'
    reason: cross_reference
  - marker: b
    text: 'Или: «унаследовать её».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: А их детей
  rationale: בנים может обозначать сыновей, детей или потомков; в контексте умножения народа «детей» естественно передаёт широкий родовой смысл, не ограничивая его мужчинами.
- source_word: הִרְבִּיתָ
  choice: Ты умножил
  rationale: Порода Hiphil выражает причинение множества; «умножил» кратко сохраняет прямое действие Бога и библейскую образность.
- source_word: כְּכֹכְבֵי הַשָּׁמָיִם
  choice: как звёзды небесные
  rationale: Формулировка близка к еврейскому тексту и сохраняет узнаваемый отзвук обещания патриархам.
- source_word: וַתְּבִיאֵם
  choice: и привёл их
  rationale: Hiphil глагола בוא здесь означает «привести, ввести»; «привёл» естественно звучит с последующим указанием места.
- source_word: אֶל הָאָרֶץ
  choice: в землю
  rationale: При глаголе движения предлог אֶל обозначает направленность и в данном контексте вступление в землю.
- source_word: אֲשֶׁר אָמַרְתָּ לַאֲבֹתֵיהֶם
  choice: о которой сказал их отцам
  rationale: Относительное предложение связывает землю с прежним Божьим словом отцам; такая передача естественна по-русски и не добавляет содержания.
- source_word: לָבוֹא לָרָשֶׁת
  choice: что они войдут и овладеют ею
  rationale: Два инфинитива передают содержание Божьего слова о вхождении и завладении землёй; местоимение «ею» делает русскую фразу грамматически ясной.
theological_decisions:
- issue: Отзвук обещания патриархам
  choice: Сохранены выражения «как звёзды небесные» и «их отцам».
  alternative: «Как звёзды на небе» и «их предкам».
  rationale: Более близкая к исходной формулировка удерживает связь с обещанием о многочисленном потомстве, не превращая аллюзию в прямое толкование.
- issue: Значение לָרָשֶׁת
  choice: «овладеют ею»
  alternative: «унаследуют её» или «возьмут её во владение»
  rationale: В данном повествовательном контексте ירשׁ прежде всего указывает на вступление во владение землёй. Возможный наследственный оттенок отмечен в сноске, а не навязан основному тексту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавное «Ты» передаёт прямое молитвенное обращение к Богу. Порядок слов слегка приподнят, но остаётся понятным обычному читателю.
