revisions:
- from: А их детей Ты умножил, как звёзды небесные,[a] и привёл их в землю, о которой сказал их отцам, что они войдут и овладеют ею.[b]
  to: И их детей Ты умножил, как звёзды небесные,[a] и привёл их в землю, в которую, как Ты сказал их отцам, те должны были войти и овладеть ею.[b]
  rationale: 'Правка устраняет двусмысленность относительно того, кому было сказано войти в землю: «те» однозначно отсылает к отцам. Формулировка «должны были войти» естественно передаёт зависимые от «сказал» инфинитивы без усиления до категорического «повелел». Сноска о ירשׁ сокращена до действительно релевантной лексической альтернативы.'
