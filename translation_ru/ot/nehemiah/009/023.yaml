  terminology: «Детей», «умножил», «звёзды небесные», «привёл» и «овладеют» — удачные современные литературные соответствия. «Овладеют» корректно передаёт ירשׁ в данном контексте; вариант «унаследуют» допустимо отметить в сноске.
