  text: וַ/יָּבֹ֤אוּ הַ/בָּנִים֙ וַ/יִּֽירְשׁ֣וּ אֶת הָ/אָ֔רֶץ וַ/תַּכְנַ֨ע לִ/פְנֵי/הֶ֜ם אֶת יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ הַ/כְּנַ֣עֲנִ֔ים וַֽ/תִּתְּנֵ֖/ם בְּ/יָדָ֑/ם וְ/אֶת מַלְכֵי/הֶם֙ וְ/אֶת עַֽמְמֵ֣י הָ/אָ֔רֶץ לַ/עֲשׂ֥וֹת בָּ/הֶ֖ם כִּ/רְצוֹנָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/024.yaml
  text: So the sons came in and took possession of the land[a], and you subdued before them the inhabitants of the land, the Canaanites, and gave them into their hand, both their kings and the peoples of the land[c][b], to do with them according to their will.
translation:
  language: ru
  text: И пришли сыновья[a] и овладели землёй. Ты покорил им жителей земли — хананеев — и отдал им в руки их, их царей и народы земли, чтобы они поступали с ними по своей воле[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети»; по смыслу — потомки прежнего поколения, то есть израильтяне. Буквально: «сыновья».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «чтобы они делали с ними, что хотели».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּנִים
  choice: сыновья
  rationale: Буквально «сыновья». Это обозначение потомков поколения отцов, вошедших в Ханаан; родовая лексика оригинала сохраняется без поясняющей подмены словом «израильтяне».
- source_word: וַיִּירְשׁוּ אֶת הָאָרֶץ
  choice: овладели землёй
  rationale: В контексте земли ירשׁ означает вступить во владение, завладеть. «Овладели землёй» естественно по-русски и передаёт активный характер события.
- source_word: וַתַּכְנַע לִפְנֵיהֶם
  choice: Ты покорил перед ними
  rationale: Форма второго лица обращена к Богу и описывает подчинение хананеев Израилю. Оборот «перед ними» сохраняет пространственно-властный образ еврейского текста.
- source_word: יֹשְׁבֵי הָאָרֶץ הַכְּנַעֲנִים
  choice: жителей земли — хананеев
  rationale: Сохраняются и общее обозначение жителей, и уточняющее этническое название.
- source_word: וַתִּתְּנֵם בְּיָדָם
  choice: отдал их … в их руки
  rationale: Сохранена прозрачная еврейская идиома, выражающая передачу под власть победителей.
- source_word: מַלְכֵיהֶם
  choice: их царями
  rationale: Местоименный суффикс естественно отнесён к хананеям, названным непосредственно перед этим.
- source_word: עַמְמֵי הָאָרֶץ
  choice: народами земли
  rationale: Множественное число עַמְמֵי передано буквально, без сведения различных народов к одному населению.
- source_word: לַעֲשׂוֹת בָּהֶם כִּרְצוֹנָם
  choice: чтобы они поступали с ними по своей воле
  rationale: Передаёт возможность действовать с покорёнными согласно собственной воле, сохраняя сильную формулировку и не уточняя конкретные действия.
theological_decisions:
- issue: Кого обозначают «сыновья»
  choice: Сохранить родовое обозначение «сыновья» как указание на потомков прежнего поколения Израиля.
  alternative: 'Передать пояснительно: «израильтяне» или «их потомки».'
  rationale: Оригинал использует семейно-родовую лексику, связывающую вошедшее в землю поколение с ранее упомянутыми отцами. Замена этнонимом сняла бы этот оттенок.
- issue: Сила языка завоевания
  choice: Сохранить прямые глаголы «покорил» и «отдал … в их руки».
  alternative: 'Смягчить: «помог им одолеть» или «дал им победу».'
  rationale: Текст прямо приписывает Богу подчинение жителей земли и передачу их под власть Израиля; перевод не должен ослаблять это богословское напряжение.
- issue: Объём власти победителей
  choice: Передать «поступали с ними по своей воле», не конкретизируя характер действий.
  alternative: Пояснить как право распоряжаться ими либо как право делать с ними всё, что угодно.
  rationale: Еврейская формула подчёркивает свободу действий победителей, но не перечисляет эти действия; конкретизация была бы толкованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Повтор союза «и» отражает последовательность еврейского повествования; идиома «в их руки» сохранена как понятный образ власти. Пунктуация с тире ясно показывает, что «хананеи» поясняют выражение «жители земли».
