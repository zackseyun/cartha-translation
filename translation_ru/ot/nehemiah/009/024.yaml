revisions:
- from: И пришли сыновья[a], и овладели землёй. Ты покорил перед ними жителей земли — хананеев — и отдал их, вместе с их царями и народами земли, в их руки[b], чтобы они поступали с ними по своей воле[c].
  to: И пришли сыновья[a] и овладели землёй. Ты покорил им жителей земли — хананеев — и отдал им в руки их, их царей и народы земли, чтобы они поступали с ними по своей воле[c].
  rationale: Заменена неестественная калька «покорил перед ними» на нормативное «покорил им». Перестроено перечисление объектов при «отдал им в руки», чтобы сохранить охват всех трёх групп в еврейском тексте. Примечание b удалено, поскольку образ «отдал им в руки» в исправленном тексте не требует отдельного пояснения, а остальные примечания сохранены с корректными якорями.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:05:47Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: потомки вошли и овладели землёй; Бог подчинил хананеев и отдал под власть Израиля как их самих, так и их царей и народы земли. Однако «покорил перед ними» — неестественная русская калька и неудачно передаёт לִפְנֵיהֶם.'
  naturalness: Текст в целом литературный, но сочетание «покорил перед ними» не соответствует современному русскому употреблению. «Покорил им» естественно выражает, что Бог подчинил жителей земли Израилю. Перестройка перечисления после «отдал» также яснее показывает, что в сферу передачи входят хананеи, их цари и народы земли.
  terminology: «Сыновья», «овладели землёй», «хананеи», «отдал ... в руки» и «народы земли» уместны и сохраняют ключевые образы и термины оригинала. Примечания содержательно соответствуют тексту и их якоря корректны.
  issues:
  - severity: medium
    issue: Неестественное выражение «Ты покорил перед ними жителей земли».
    rationale: Еврейское לִפְנֵיהֶם означает подчинение жителей перед/пред Израилем, но русский оборот «покорил перед ними» звучит как буквальная калька. «Покорил им жителей земли» естественно передаёт отношение подчинения без смысловой потери.
  - severity: low
    issue: Перечень «отдал их, вместе с их царями и народами земли, в их руки» синтаксически менее прозрачен.
    rationale: «Вместе с» может восприниматься как добавочное обстоятельство, тогда как еврейский текст координирует хананеев, их царей и народы земли как объекты передачи. Явное перечисление после «отдал им в руки» точнее отражает структуру.
  revised_text: И пришли сыновья[a] и овладели землёй. Ты покорил им жителей земли — хананеев — и отдал им в руки их, их царей и народы земли, чтобы они поступали с ними по своей воле[c].
