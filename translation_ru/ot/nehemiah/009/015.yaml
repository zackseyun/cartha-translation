  terminology: «Овладеть землёй» точно передаёт ירשׁ в данном контексте. «Поклялся дать им» точно выражает идиому נָשָׂאתָ אֶת־יָדְךָ без доктринального уточнения; сноска сохраняет телесный образ исходного текста.
