base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/015.yaml
  text: You gave them bread from heaven for their hunger[a], and you brought out water from the rock for their thirst, and you told them to go in to possess the land that you had sworn to give them.
translation:
  language: ru
  text: Ты дал им хлеб с небес, когда они голодали, и вывел для них воду из скалы, когда они испытывали жажду. Ты сказал им, чтобы они вошли и овладели землёй, которую Ты поклялся дать им[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в еврейском тексте: «поднял Свою руку, чтобы дать им [эту землю]». «Поднять руку» — выражение, означающее принести клятву.'
    reason: Поясняет еврейскую идиому клятвы, сохраняя буквальный образ, не перегружая основной текст.
lexical_decisions:
- source_word: לֶחֶם מִשָּׁמַיִם
  choice: хлеб с небес
  rationale: Сохранён конкретный образ еврейского текста, а не подставлено поясняющее «пища» или «манна».
- source_word: לִרְעָבָם / לִצְמָאָם
  choice: чтобы утолить их голод / чтобы утолить их жажду
  rationale: Целевые обороты естественно передают функцию хлеба и воды и сохраняют параллелизм исходного текста.
- source_word: מַיִם מִסֶּלַע
  choice: воду из скалы
  rationale: Передан конкретный образ события в пустыне; определённость в русском языке естественно выражается без артикля.
- source_word: הוֹצֵאתָ
  choice: извёл для них
  rationale: Глагол каузативной породы передаёт действие Бога, вызвавшего появление воды из скалы; «извёл» уместно в современном возвышенном библейском повествовании.
- source_word: וַתֹּאמֶר לָהֶם
  choice: Ты сказал им
  rationale: Сохранено обычное значение глагола «сказать» без усиления до «повелел».
- source_word: לָבוֹא לָרֶשֶׁת
  choice: войти и овладеть
  rationale: 'Два инфинитива переданы как последовательные действия: войти в землю и вступить во владение ею.'
- source_word: נָשָׂאתָ אֶת יָדְךָ
  choice: поклялся… подняв руку
  rationale: Перевод одновременно раскрывает значение идиомы клятвы и сохраняет её конкретный телесный образ.
- source_word: לָתֵת לָהֶם
  choice: отдать им
  rationale: В контексте передачи земли «отдать им» звучит естественно и точно выражает предоставление земли народу.
theological_decisions:
- issue: Клятвенный жест Бога при обещании земли
  choice: которую поклялся отдать им, подняв руку
  alternative: которую Ты поднял руку дать им; которую Ты поклялся отдать им
  rationale: Идиоматическое значение выражено ясно, но антропоморфный образ поднятой руки не устранён. Это сохраняет заветный характер обещания и фактуру еврейского текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис упрощён для ясности, параллелизм голода и жажды сохранён; архаизмы и конфессионально окрашенные формулы не использованы.
