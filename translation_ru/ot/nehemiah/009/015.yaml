  source_fidelity: 'Основной смысл передан верно: хлеб с небес, вода из скалы, повеление войти и овладеть землёй и клятвенное обещание дать её. Однако конструкция «Ты сказал им войти» неестественна для современного русского. Идиома «поднять руку» означает клятву; её лучше передать в тексте как «поклялся», сохранив буквальный образ в сноске.'
