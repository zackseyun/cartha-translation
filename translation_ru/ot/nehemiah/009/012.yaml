  text: וּ/בְ/עַמּ֣וּד עָנָ֔ן הִנְחִיתָ֖/ם יוֹמָ֑ם וּ/בְ/עַמּ֥וּד אֵשׁ֙ לַ֔יְלָה לְ/הָאִ֣יר לָ/הֶ֔ם אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/012.yaml
  text: By a pillar of cloud you led them by day[a], and by a pillar of fire by night to give them light on the way in which they should go.
translation:
  language: ru
  text: Ты вёл их днём в столпе облачном, а ночью — в столпе огненном, чтобы освещать им путь, по которому им идти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְעַמּוּד עָנָן
  choice: в столпе облачном
  rationale: Предлог ב допускает пространственное и инструментальное понимание. Русское «в столпе облачном» естественно передаёт образ явленного в столпе Божьего водительства, не устраняя этой смысловой широты.
- source_word: הִנְחִיתָם
  choice: Ты вёл их
  rationale: Порода Hiphil глагола נחה здесь означает вести, направлять. «Вёл» кратко и естественно соответствует контексту пути через пустыню.
- source_word: יוֹמָם
  choice: днём
  rationale: Наречное обозначение времени; образует ясную параллель с «ночью».
- source_word: וּבְעַמּוּד אֵשׁ
  choice: а ночью — в столпе огненном
  rationale: Сохранена параллель со столпом облачным; союз передан как «а», чтобы естественно обозначить временное противопоставление дня и ночи.
- source_word: לְהָאִיר לָהֶם
  choice: чтобы освещать им
  rationale: 'Инфинитив Hiphil выражает цель: давать им свет, освещать для них. Такая конструкция позволяет напрямую связать освещение с последующим объектом «путь».'
- source_word: אֶת הַדֶּרֶךְ
  choice: путь
  rationale: Маркер прямого дополнения показывает, что путь является объектом освещения; русское «освещать им путь» точно и идиоматично.
- source_word: אֲשֶׁר יֵלְכוּ בָהּ
  choice: по которому им идти
  rationale: Относительная конструкция указывает предназначенный для движения маршрут. Инфинитивная русская конструкция сохраняет оттенок предписанного или намеченного пути, не усиливая его до отдельного повеления.
theological_decisions:
- issue: Образ Божьего водительства в пустыне
  choice: Передать стих как рассказ о конкретном историческом водительстве Богом народа посредством облачного и огненного столпов.
  alternative: Истолковать столпы прежде всего как отвлечённые символы Божьего присутствия или как прообраз.
  rationale: Еврейский текст непосредственно говорит о том, что Бог вёл народ и освещал предназначенный ему путь. Более широкие типологические выводы не следует вносить в перевод.
- issue: Связь огненного столпа с освещением пути
  choice: Синтаксически связать целевую фразу «чтобы освещать им путь» с ночным огненным столпом.
  alternative: Отнести освещение пути совместно к обоим столпам или перестроить фразу как общее утверждение о водительстве.
  rationale: Ближайшим основанием для цели освещения служит огненный столп ночью, хотя весь стих описывает единое Божье водительство; перевод сохраняет эту естественную синтаксическую связь без догматизации.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Инверсия «в столпе облачном / огненном» сохраняет узнаваемую образность и параллелизм, оставаясь понятной современному читателю. Тире во второй половине отмечает пропуск повторяющегося сказуемого «вёл».
