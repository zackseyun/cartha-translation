  source_fidelity: 'Перевод верно передаёт основные элементы еврейского текста: Божье великое/обильное милосердие, неоставление народа в пустыне, облачный столп днём как водитель и огненный столп ночью как источник света на пути. «Не отступал от них» несколько менее явно выражает пространственный оттенок מֵעֲלֵיהֶם («сверху/над ними»), но в русском контексте естественно передаёт непрерывное пребывание и водительство столпа, не меняя смысла. «Освещать им путь» удачно выражает освещение как народа, так и пути, не создавая неестественной русской конструкции.'
