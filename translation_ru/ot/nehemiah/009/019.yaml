source:
  edition: WLC
  text: וְ/אַתָּה֙ בְּ/רַחֲמֶ֣י/ךָ הָֽ/רַבִּ֔ים לֹ֥א עֲזַבְתָּ֖/ם בַּ/מִּדְבָּ֑ר אֶת עַמּ֣וּד הֶ֠/עָנָן לֹא סָ֨ר מֵ/עֲלֵי/הֶ֤ם בְּ/יוֹמָם֙ לְ/הַנְחֹתָ֣/ם בְּ/הַ/דֶּ֔רֶךְ וְ/אֶת עַמּ֨וּד הָ/אֵ֤שׁ בְּ/לַ֨יְלָה֙ לְ/הָאִ֣יר לָ/הֶ֔ם וְ/אֶת הַ/דֶּ֖רֶךְ אֲשֶׁ֥ר יֵֽלְכוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/019.yaml
  text: But you[a], in your abundant mercies, did not abandon them in the wilderness. The pillar of cloud did not depart from above them by day, to lead them on the way, nor the pillar of fire by night, to give them light and the way in which they should go.
translation:
  language: ru
  text: 'Но Ты, по великому милосердию Твоему[a], не оставил их в пустыне: облачный столп днём не отступал от них, чтобы вести их по пути, и огненный столп ночью — чтобы освещать им путь, по которому им следовало идти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по многим милостям Твоим»; возможно также: «по великому состраданию Твоему».'
    reason: Сохраняет множественное число еврейского רַחֲמִים и указывает естественную смысловую альтернативу.
lexical_decisions:
- source_word: בְּרַחֲמֶיךָ הָרַבִּים
  choice: по великому милосердию Твоему
  rationale: Еврейское רַחֲמִים имеет форму множественного числа, но в современном литературном русском естественно передаётся собирательным единственным «милосердие»; הָרַבִּים выражено прилагательным «великое». Альтернатива с множественным числом приведена в сноске.
- source_word: עֲזַבְתָּם
  choice: не оставил их
  rationale: «Оставить» естественно передаёт עזב и в данном контексте означает не бросить, не покинуть народ.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: «Пустыня» — обычное и понятное русское обозначение местности странствования Израиля.
- source_word: עַמּוּד הֶעָנָן
  choice: облачный столп
  rationale: Устоявшееся и прозрачное русское соответствие образу из повествования Исхода.
- source_word: לֹא סָר מֵעֲלֵיהֶם
  choice: не отступал от них
  rationale: סור означает удаляться или отступать. Русское «не отступал от них» сохраняет идею непрерывного присутствия; буквальное пространственное «сверху над ними» здесь звучало бы тяжеловесно.
- source_word: לְהַנְחֹתָם בְּהַדֶּרֶךְ
  choice: чтобы вести их по пути
  rationale: Каузативная форма נחה означает «вести, направлять», а בְּהַדֶּרֶךְ естественно передаётся по-русски как «по пути».
- source_word: עַמּוּד הָאֵשׁ בְּלַיְלָה
  choice: огненный столп ночью
  rationale: Сохраняет параллель с «облачным столпом днём» и соответствует традиционному русскому наименованию.
- source_word: לְהָאִיר לָהֶם וְאֶת הַדֶּרֶךְ אֲשֶׁר יֵלְכוּ בָהּ
  choice: чтобы освещать им путь, по которому им следовало идти
  rationale: Синтаксис допускает понимание «им и путь» как объектов освещения. В русском это естественно свёрнуто в «освещать им путь», без добавления отсутствующего в источнике смысла.
theological_decisions:
- issue: Язык Божьего сострадания
  choice: по великому милосердию Твоему
  alternative: по множеству милостей Твоих
  rationale: Единственное число звучит естественно в современном русском, а сноска сохраняет сведения о буквальной форме еврейского выражения; богословский смысл обилия Божьей милости не сужается.
- issue: Характер Божьего водительства
  choice: столпы продолжают вести и освещать народ
  alternative: явно назвать столпы самим Богом или отдельными сверхъестественными существами
  rationale: Перевод сохраняет образ и грамматику источника, не вводя дополнительного толкования о природе столпов.
translation_notes:
  register: Современный литературный русский с достоинством библейской молитвы. Местоимения, обращённые к Богу, написаны с прописной буквы. Двоеточие подчёркивает, как именно Бог не оставил народ; эллипсис во второй параллельной части избегает ненужного повторения сказуемого.
