  terminology: «Милосердие», «пустыня», «облачный столп», «огненный столп» и «вести по пути» уместны и последовательны. Передача רַחֲמִים собирательным единственным «милосердие» допустима в современном русском; сноска надлежащим образом отмечает еврейское множественное число и альтернативу «сострадание». Маркер сноски поставлен у соответствующего выражения.
