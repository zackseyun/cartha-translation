  text: וַ֠/תִּתֵּן אֹתֹ֨ת וּ/מֹֽפְתִ֜ים בְּ/פַרְעֹ֤ה וּ/בְ/כָל עֲבָדָי/ו֙ וּ/בְ/כָל עַ֣ם אַרְצ֔/וֹ כִּ֣י יָדַ֔עְתָּ כִּ֥י הֵזִ֖ידוּ עֲלֵי/הֶ֑ם וַ/תַּֽעַשׂ לְ/ךָ֥ שֵׁ֖ם כְּ/הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/010.yaml
  text: You performed signs and wonders against Pharaoh[a], against all his servants, and against all the people of his land, for you knew that they acted presumptuously against them. So you made a name for yourself, as it is to this day.
translation:
  language: ru
  text: Ты совершил знамения и чудеса против фараона, против всех его слуг и против всего народа его страны, ибо Ты знал, что они дерзко обращались с ними.[a] Так Ты сделал Себе имя, как и поныне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «самонадеянно обращались с ними». Еврейский глагол может обозначать дерзкое, надменное или самонадеянное поведение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: Ты совершил
  rationale: Буквально глагол означает «дал», но в сочетании со «знамениями и чудесами» по-русски естественно передать совершение этих деяний.
- source_word: אֹתֹת וּמֹפְתִים
  choice: знамения и чудеса
  rationale: 'Сохраняет устойчивую библейскую пару: действия служат знаками и одновременно вызывают изумление.'
- source_word: בְּפַרְעֹה ... וּבְכָל עֲבָדָיו ... וּבְכָל עַם אַרְצוֹ
  choice: над фараоном, над всеми его слугами и над всем народом его земли
  rationale: Предлог ב здесь обозначает тех, на ком были явлены судные знамения; «над» естественно сочетается по-русски с «совершил знамения и чудеса» и сохраняет повтор исходного текста.
- source_word: כִּי יָדַעְתָּ
  choice: потому что знал
  rationale: כִּי вводит основание Божьего действия; причинная связь выражена прямо.
- source_word: הֵזִידוּ
  choice: надменно поступали
  rationale: Передаёт высокомерное, дерзкое и самонадеянное поведение, не сводя значение лишь к внутренней гордости.
- source_word: עֲלֵיהֶם
  choice: с ними
  rationale: В данном сочетании русское «поступали с ними» естественно выражает враждебное обращение; местоимение сохранено, чтобы не конкретизировать референт внутри текста.
- source_word: וַתַּעַשׂ לְךָ שֵׁם
  choice: Так Ты прославил Своё имя
  rationale: Еврейская идиома буквально говорит о создании себе имени, то есть о приобретении славы и известности; русский вариант избегает бытового оттенка выражения «сделал себе имя».
- source_word: כְּהַיּוֹם הַזֶּה
  choice: и слава эта пребывает доныне
  rationale: Передаёт сохранение результата до настоящего времени и естественно связывает оборот с приобретённой славой имени.
theological_decisions:
- issue: К кому относится местоимение עֲלֵיהֶם («с ними»)
  choice: Местоимение оставлено без поясняющей замены; вероятнее всего, оно указывает на израильтян.
  alternative: Заменить на «с Твоим народом» или понять дерзость как направленную против Бога.
  rationale: Контекст исхода указывает на высокомерное угнетение Израиля фараоном и египтянами, однако сам стих называет объект только местоимением. Перевод сохраняет эту формальную неявность.
- issue: Смысл выражения וַתַּעַשׂ לְךָ שֵׁם
  choice: «Ты прославил Своё имя»
  alternative: «Ты приобрёл Себе имя» или «Ты сделал Себе имя».
  rationale: Речь идёт о явленной и утвердившейся славе Бога, а не о буквальном наречении имени. Формулировка не добавляет конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-исторической речи. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксический параллелизм исходного текста в основном сохранён; неестественные для русского буквальные идиомы переданы по смыслу.
