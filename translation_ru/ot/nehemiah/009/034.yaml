  text: וְ/אֶת מְלָכֵ֤י/נוּ שָׂרֵ֨י/נוּ֙ כֹּהֲנֵ֣י/נוּ וַ/אֲבֹתֵ֔י/נוּ לֹ֥א עָשׂ֖וּ תּוֹרָתֶ֑/ךָ וְ/לֹ֤א הִקְשִׁ֨יבוּ֙ אֶל מִצְוֺתֶ֔י/ךָ וּ/לְ/עֵ֣דְוֺתֶ֔י/ךָ אֲשֶׁ֥ר הַעִידֹ֖תָ בָּ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/034.yaml
  text: Even our kings[a], our officials, our priests, and our fathers did not keep your law[c][b], and they did not listen to your commandments and your testimonies with which you warned them.
translation:
  language: ru
  text: И наши цари, наши начальники, наши священники и наши отцы не исполняли Твоего закона и не внимали Твоим заповедям и Твоим свидетельствам[a], которыми Ты предостерегал их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельствам, которыми Ты свидетельствовал против них». Здесь имеются в виду Божьи торжественные свидетельства и предостережения в рамках завета.'
    reason: Сохраняется смысловая широта однокоренных עֵדוֹת и הַעִידֹתָ, включая как предостережение, так и свидетельство против нарушителей.
lexical_decisions:
- source_word: וְאֶת
  choice: И
  rationale: Союз с показателем прямого дополнения присоединяет ещё одну группу к перечислению в исповедании. Русское «И» естественно сохраняет связность; усилительное «даже» возможно, но не обязательно выражено.
- source_word: מְלָכֵינוּ
  choice: наши цари
  rationale: Прямое соответствие форме множественного числа с суффиксом первого лица множественного числа.
- source_word: שָׂרֵינוּ
  choice: наши начальники
  rationale: שׂרים обозначает правителей и должностных руководителей. «Начальники» сохраняет высокий библейский регистр, оставаясь понятным современному читателю.
- source_word: כֹּהֲנֵינוּ
  choice: наши священники
  rationale: Обычное русское соответствие כֹּהֵן в израильском культовом контексте.
- source_word: וַאֲבֹתֵינוּ
  choice: и наши отцы
  rationale: Сохраняет буквальный образ אָבוֹת и указывает на предшествующие поколения Израиля; «предки» было бы допустимым более пояснительным вариантом.
- source_word: לֹא עָשׂוּ תּוֹרָתֶךָ
  choice: не исполняли Твоего закона
  rationale: עשה с תּוֹרָה означает соблюдать или исполнять закон, а не буквально «делать». Родительный падеж после отрицания естественен для литературного русского языка.
- source_word: הִקְשִׁיבוּ
  choice: не внимали
  rationale: Передаёт внимательное слушание и практическое принятие сказанного, заложенные в каузативной форме קשׁב, без сведения смысла лишь к физическому слушанию.
- source_word: מִצְוֺתֶיךָ
  choice: Твоим заповедям
  rationale: Стандартное covenantal соответствие, сохраняющее отличие от более широкого понятия закона.
- source_word: וּלְעֵדְוֺתֶיךָ
  choice: и Твоим свидетельствам
  rationale: Прямо передаёт עֵדוֹת и сохраняет его лексическую связь с последующим הַעִידֹתָ; значение включает торжественные заветные свидетельства и предостережения.
- source_word: אֲשֶׁר הַעִידֹתָ בָהֶם
  choice: которыми Ты предостерегал их
  rationale: Глагол עוד в данной форме и контексте означает торжественно свидетельствовать, увещевать или предостерегать. Творительное «которыми» сохраняет инструментальную связь со «свидетельствами».
theological_decisions:
- issue: Значение תּוֹרָה
  choice: Твоего закона
  alternative: Твоего наставления
  rationale: В национальном исповедании речь идёт о данном Богом заветном законе, хотя слово само по себе может шире означать наставление.
- issue: Значение אָבוֹת
  choice: наши отцы
  alternative: наши предки
  rationale: Формулировка сохраняет мужской образ исходного текста и традиционное обозначение прежних поколений, не исключая контекстуального смысла «предки».
- issue: Соотношение עֵדוֹת и הַעִידֹתָ
  choice: свидетельствам, которыми Ты предостерегал их
  alternative: свидетельствам, которыми Ты свидетельствовал против них
  rationale: Основной текст естественно передаёт функцию Божьих свидетельств как торжественных предостережений, а примечание сохраняет судебно-заветный оттенок и неоднозначность направления свидетельства.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Параллельное перечисление и различие между законом, заповедями и свидетельствами сохранены.
