  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עַ֤ל הַר סִינַי֙ יָרַ֔דְתָּ וְ/דַבֵּ֥ר עִמָּ/הֶ֖ם מִ/שָּׁמָ֑יִם וַ/תִּתֵּ֨ן לָ/הֶ֜ם מִשְׁפָּטִ֤ים יְשָׁרִים֙ וְ/תוֹר֣וֹת אֱמֶ֔ת חֻקִּ֥ים וּ/מִצְוֺ֖ת טוֹבִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/013.yaml
  text: You came down on Mount Sinai and spoke with them from heaven[a], and you gave them upright judgments, true laws[c][b], good statutes and commandments.
translation:
  language: ru
  text: Ты сошёл на гору Синай и говорил с ними с небес; Ты дал им справедливые постановления, истинные законы[a], добрые уставы и заповеди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «законы истины»; возможный смысл: «истинные наставления».'
    reason: Еврейское תוֹרוֹת אֱמֶת допускает как более буквальное «законы истины», так и более широкое понимание תּוֹרָה как наставления.
lexical_decisions:
- source_word: וְעַל הַר סִינַי יָרַדְתָּ
  choice: Ты сошёл на гору Синай
  rationale: Русское «сошёл на гору» естественно передаёт ירד с עַל, сохраняя образ Божьего нисхождения на Синай.
- source_word: וְדַבֵּר עִמָּהֶם מִשָּׁמָיִם
  choice: и говорил с ними с небес
  rationale: «Говорил с ними» непосредственно передаёт דבר с предлогом עִם и естественно звучит по-русски; «с небес» сохраняет указание на источник речи.
- source_word: וַתִּתֵּן לָהֶם
  choice: Ты дал им
  rationale: Прямая и естественная передача נתן с ל; повтор местоимения подчёркивает обращение к Богу и ясно организует длинное предложение.
- source_word: מִשְׁפָּטִים יְשָׁרִים
  choice: справедливые постановления
  rationale: «Постановления» сохраняет юридический смысл מִשְׁפָּטִים, а «справедливые» естественно выражает нравственно-правовую прямоту יְשָׁרִים.
- source_word: וְתוֹרוֹת אֱמֶת
  choice: истинные законы
  rationale: В ряду правовых терминов תּוֹרוֹת уместно передано как «законы», а אֱמֶת — как характеристика их истинности и надёжности. Возможная более буквальная и более широкая передача отмечена в сноске.
- source_word: חֻקִּים וּמִצְוֺת טוֹבִים
  choice: добрые уставы и заповеди
  rationale: «Уставы» и «заповеди» различают два еврейских правовых термина; форма «добрые» естественно относится к обоим однородным существительным и передаёт טוֹבִים без смыслового расширения.
theological_decisions:
- issue: Передача ряда из четырёх обозначений Божьего закона
  choice: 'Сохранить четыре различимых термина: «постановления», «законы», «уставы» и «заповеди».'
  alternative: Свести ряд к общим словам «законы и заповеди» либо передать תּוֹרוֹת как «наставления».
  rationale: Накопление близких, но не тождественных правовых терминов подчёркивает полноту и качество откровения на Синае. Их разграничение сохраняет фактуру исходного текста, не превращая различия в жёсткую техническую классификацию.
- issue: Соотношение нисхождения на Синай и речи с небес
  choice: 'Сохранить оба пространственных указания без богословского согласования: «сошёл на гору Синай» и «говорил… с небес».'
  alternative: Переформулировать так, чтобы речь исходила непосредственно с горы, или объяснить сочетание доктринально.
  rationale: Сам текст удерживает вместе Божье нисхождение на Синай и речь с небес; перевод не должен устранять это напряжение или навязывать ему частное объяснение.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис прост и доступен; юридические термины различены без архаизации. Точка с запятой отделяет явление и речь Бога от перечисления данных Им установлений.
