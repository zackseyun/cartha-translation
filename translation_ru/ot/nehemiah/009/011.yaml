base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/011.yaml
  text: You split the sea before them[a], and they passed through the midst of the sea on dry ground[b]; and you threw their pursuers into the depths like a stone in mighty waters.
translation:
  language: ru
  text: Ты рассёк перед ними море[a], и они прошли посреди моря по суше; а преследователей их Ты бросил в глубины, словно камень в могучих водах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разделил море».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַעְתָּ
  choice: рассёк
  rationale: Глагол בקע обозначает рассечение, раскалывание. «Рассёк» сохраняет яркий образ физического разделения моря и естественно звучит в возвышенной современной русской речи.
- source_word: לִפְנֵיהֶם
  choice: перед ними
  rationale: Устойчивое сочетание с פָּנִים здесь пространственно означает «перед ними».
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: и они прошли посреди моря
  rationale: Глагол עבר передаёт прохождение, а תוֹךְ — внутреннее пространство, середину; формулировка сохраняет конкретный образ движения внутри разделённого моря.
- source_word: בַּיַּבָּשָׁה
  choice: по суше
  rationale: Субстантивированное יַבָּשָׁה означает сухую землю, сушу. «По суше» в данном контексте естественно описывает состояние морского дна и способ передвижения.
- source_word: רֹדְפֵיהֶם
  choice: преследователей их
  rationale: Причастная форма от רדף обозначает тех, кто гнался за ними. Порядок слов поддерживает возвышенный молитвенный регистр без архаизации.
- source_word: הִשְׁלַכְתָּ
  choice: бросил
  rationale: Порода hифиль глагола שלך означает «бросить, повергнуть». «Бросил» прямо передаёт действие без усиления, которое внесло бы «швырнул».
- source_word: בִמְצוֹלֹת
  choice: в глубины
  rationale: מְצוֹלוֹת обозначает морские глубины. Множественное число сохранено, а направительное значение естественно выражено винительным падежом после «бросил».
- source_word: כְּמוֹ אֶבֶן
  choice: словно камень
  rationale: Простое сравнение сохранено буквально; «словно» уместно в возвышенной поэтической прозе молитвы.
- source_word: בְּמַיִם עַזִּים
  choice: в могучие воды
  rationale: עַזִּים значит «сильные, могучие». В контексте направленного движения после «бросил» русский винительный падеж «в воды» естественно передаёт образ, не добавляя значения «бурные» или «яростные».
theological_decisions:
- issue: Прямое обращение к Богу в воспоминании об исходе
  choice: 'Сохранено второе лицо единственного числа с прописной буквой: «Ты рассёк… Ты бросил».'
  alternative: Безличная или повествовательная формулировка, ослабляющая прямое обращение.
  rationale: Еврейские глаголы стоят во втором лице единственного числа, поскольку стих входит в общинную молитву, прямо обращённую к Богу. Перевод сохраняет характер исповедания Божьего исторического спасительного действия, ничего к нему не добавляя.
translation_notes:
  register: Современный литературный русский язык с dignified молитвенно-повествовательным звучанием. Синтаксис близок к еврейскому, но естественен по-русски; архаизмы и конфессионально маркированная терминология не используются. Местоимение «Ты» написано с прописной буквы как норма почтительного прямого обращения к Богу.
