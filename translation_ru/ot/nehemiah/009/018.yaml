  text: אַ֗ף כִּֽי עָשׂ֤וּ לָ/הֶם֙ עֵ֣גֶל מַסֵּכָ֔ה וַ/יֹּ֣אמְר֔וּ זֶ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֥ר הֶעֶלְ/ךָ֖ מִ/מִּצְרָ֑יִם וַֽ/יַּעֲשׂ֔וּ נֶאָצ֖וֹת גְּדֹלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/018.yaml
  text: Even when they made for themselves a cast metal calf and said[a], ‘This is your god who brought you up out of Egypt,’ and committed great blasphemies[b],
translation:
  language: ru
  text: 'Даже когда они сделали себе литого тельца[a] и сказали: «Вот твой бог, который вывел тебя из Египта», — и совершили тяжкие кощунства[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тельца, отлитого из металла».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «великие оскорбления» или «дерзкие проявления презрения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף כִּי
  choice: Даже когда
  rationale: 'Оборот вводит уступительное обстоятельство: милость Бога не прекратилась даже во время тяжкого мятежа народа. «Даже когда» естественно передаёт эту связь с предшествующим контекстом.'
- source_word: עָשׂוּ לָהֶם
  choice: они сделали себе
  rationale: Дательный оборот לָהֶם имеет возвратное значение и показывает, что изображение было изготовлено ими для самих себя.
- source_word: עֵגֶל מַסֵּכָה
  choice: литого тельца
  rationale: מַסֵּכָה обозначает отлитое из металла изображение. «Литой телец» точно и естественно передаёт как способ изготовления, так и форму идола.
- source_word: זֶה אֱלֹהֶיךָ
  choice: Вот твой бог
  rationale: Единственное число указательного слова и местоименного суффикса поддерживает единственное число. Строчная буква указывает на идольского бога, не отрицая того, что сами говорящие приписывали ему исход из Египта.
- source_word: אֲשֶׁר הֶעֶלְךָ מִמִּצְרָיִם
  choice: который вывел тебя из Египта
  rationale: Так естественно передаётся устойчивое выражение об исходе; русское «вывел» не требует буквального сохранения пространственного оттенка «поднял».
- source_word: וַיַּעֲשׂוּ נֶאָצוֹת גְּדֹלוֹת
  choice: и совершили тяжкие кощунства
  rationale: Существительное נֶאָצוֹת обозначает дерзкие, презрительные оскорбления, направленные против Бога. «Тяжкие кощунства» передаёт религиозную направленность и силу выражения, а «совершили» естественно сочетается с этим существительным.
theological_decisions:
- issue: Число и оформление слова אֱלֹהֶיךָ в речи об идоле
  choice: твой бог
  alternative: твой Бог; твои боги
  rationale: Непосредственная еврейская форма здесь согласуется с единственным числом («вот», «твой»), а строчная буква сохраняет полемическое различие между тельцом и истинным Богом. Множественное число, известное по традиционным переводам параллельного рассказа, не вносится в данный стих.
- issue: Смысл נֶאָצוֹת по отношению к Богу
  choice: тяжкие кощунства
  alternative: великие оскорбления; дерзкие проявления презрения
  rationale: В контексте поклонения тельцу речь идёт о вызывающем презрении к Богу. Выбранный вариант передаёт эту богопротивную направленность, а примечание сохраняет более широкий лексический диапазон.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-историческим тоном. Синтаксис сохраняет незавершённую уступительную конструкцию стиха, продолжающуюся в следующем стихе. Тире после прямой речи помогает ясно вернуться к однородному сказуемому «совершили».
