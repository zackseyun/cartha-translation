source:
  edition: WLC
  text: וּ/כְ/נ֣וֹחַ לָ/הֶ֔ם יָשׁ֕וּבוּ לַ/עֲשׂ֥וֹת רַ֖ע לְ/פָנֶ֑י/ךָ וַ/תַּֽעַזְבֵ֞/ם בְּ/יַ֤ד אֹֽיְבֵי/הֶם֙ וַ/יִּרְדּ֣וּ בָ/הֶ֔ם וַ/יָּשׁ֨וּבוּ֙ וַ/יִּזְעָק֔וּ/ךָ וְ/אַתָּ֞ה מִ/שָּׁמַ֧יִם תִּשְׁמַ֛ע וְ/תַצִּילֵ֥/ם כְּֽ/רַחֲמֶ֖י/ךָ רַבּ֥וֹת עִתִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/028.yaml
  text: But when they had rest, they again did evil before you; so you left them in the power of their enemies[a], who ruled over them. Then they returned and cried out to you, and from heaven you heard and delivered them many times according to your mercies.
translation:
  language: ru
  text: Но когда для них наступал покой, они снова делали зло пред Тобой. Тогда Ты отдавал их во власть их врагов[a], и те господствовали над ними. Они вновь обращались и взывали к Тебе, а Ты слышал с небес и много раз избавлял их по Своему милосердию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руку их врагов» — еврейская идиома, означающая власть или контроль врагов.'
    reason: cultural_note
lexical_decisions:
- source_word: וּכְנוֹחַ לָהֶם
  choice: Но когда для них наступал покой
  rationale: Временная конструкция указывает на обстоятельство очередного отступления, не добавляя отсутствующего в еврейском тексте смысла «как только». Несовершенный вид естественно передаёт повторявшийся ход событий.
- source_word: יָשׁוּבוּ לַעֲשׂוֹת רַע
  choice: они снова делали зло
  rationale: 'Первое употребление שׁוב с инфинитивом имеет итеративное значение: народ повторял злые дела. Такая передача избегает неестественного буквального «возвращались делать».'
- source_word: לְפָנֶיךָ
  choice: пред Тобой
  rationale: Сохраняет пространственно-реляционный образ «перед Твоим лицом / в Твоём присутствии», не сужая его до одного лишь зрительного восприятия и не усиливая до «против Тебя».
- source_word: וַתַּעַזְבֵם בְּיַד אֹיְבֵיהֶם
  choice: Ты отдавал их во власть врагов
  rationale: Глагол передаёт оставление без защиты в рамках суда, а идиома «в руку» означает переход под власть или контроль врагов. Исходный образ сохранён в примечании.
- source_word: וַיִּרְדּוּ בָהֶם
  choice: и те господствовали над ними
  rationale: Передаёт основное значение осуществления власти над кем-либо, не добавляя более узкого оттенка угнетения, хотя контекст его допускает.
- source_word: וַיָּשׁוּבוּ
  choice: Они вновь обращались
  rationale: В отличие от первого итеративного употребления, здесь сохраняется самостоятельное значение поворота или возвращения; «обращались» естественно выражает поворот к Богу, непосредственно проявляющийся во взывании к Нему.
- source_word: וַיִּזְעָקוּךָ
  choice: и взывали к Тебе
  rationale: Глагол обозначает настойчивый, бедственный крик о помощи. «Взывали» сохраняет силу выражения и соответствует достоинству молитвенного контекста.
- source_word: מִשָּׁמַיִם תִּשְׁמַע
  choice: Ты слышал с небес
  rationale: Сохраняет вынесенное в еврейском тексте указание на небеса как место, откуда исходит Божий ответ, в естественном русском порядке слов.
- source_word: וְתַצִּילֵם
  choice: избавлял их
  rationale: В данном историческом контексте речь идёт об избавлении от власти врагов; слово не привносит более широкого богословского смысла спасения.
- source_word: כְּרַחֲמֶיךָ רַבּוֹת עִתִּים
  choice: по Своему милосердию много раз
  rationale: Форма רַבּוֹת согласуется с עִתִּים («много раз»), а не характеризует милосердие как «обильное». Русское единственное число «милосердие» естественно передаёт еврейское רַחֲמִים в этом контексте.
theological_decisions:
- issue: Божественное оставление народа
  choice: Ты отдавал их во власть врагов
  alternative: Ты покидал их, предавая в руку врагов
  rationale: Фраза ясно передаёт суровый заветный суд — лишение защиты и передачу под власть врагов, — но не создаёт впечатления окончательного и безусловного оставления, что опровергалось бы последующим избавлением.
- issue: Повторявшееся действие в повествовательном резюме
  choice: наступал… делали… отдавал… обращались… слышал… избавлял
  alternative: наступил… сделали… отдал… обратились… услышал… избавил
  rationale: Сочетание форм и заключительное «много раз» описывают повторявшийся исторический цикл. Русский несовершенный вид делает этот итеративный смысл ясным, не превращая утверждение в отвлечённую общую истину.
- issue: Два употребления שׁוב
  choice: снова делали зло / вновь обращались
  alternative: возвращались делать зло / возвращались
  rationale: Первое употребление входит в конструкцию повторения действия, тогда как второе обозначает поворот народа перед взыванием к Богу. Различение сохраняет смысловой контраст исходного текста.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным молитвенным звучанием. Формы «пред Тобой» и «взывали» поддерживают достоинство контекста, не делая текст архаичным; заглавные местоимения последовательно обозначают прямое обращение к Богу.
