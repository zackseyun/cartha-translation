base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/005.yaml
  text: Then the Levites—Jeshua[a], Kadmiel, Bani, Hashabneiah, Sherebiah, Hodiah, Shebaniah, and Pethahiah—said, “Stand up; bless Yahweh your God from everlasting to everlasting. Blessed be your glorious name[b], which is exalted above all blessing and praise.”
translation:
  language: ru
  text: 'Тогда левиты — Иешуа, Кадмиил, Бани, Хашавнея, Шеревия, Ходия, Шевания и Петахия — сказали: «Встаньте и благословите Яхве, вашего Бога, от века и до века! И пусть они благословят[a] славное имя Твоё[b], превознесённое выше всякого благословения и хвалы!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте — глагол третьего лица множественного числа с побудительно-желательным оттенком: «пусть они благословят». Кто именно подразумевается под «они», прямо не уточняется.'
    reason: Поясняет грамматическую форму וִיבָרְכוּ и сохраняет неопределённость её референта.
  - marker: b
    text: 'Буквально: «имя славы Твоей».'
    reason: Указывает на буквальную форму еврейской конструкции שֵׁם כְּבוֹדֶךָ.
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Тогда ... сказали
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Общепринятое русское обозначение левитов; определённость ясна из контекста и последующего перечня имён.
- source_word: יֵשׁוּעַ וְקַדְמִיאֵל בָּנִי חֲשַׁבְנְיָה שֵׁרֵבְיָה הוֹדִיָּה שְׁבַנְיָה פְתַחְיָה
  choice: Иешуа, Кадмиил, Бани, Хашавнея, Шеревия, Ходия, Шевания и Петахия
  rationale: Имена переданы транслитерацией, приближённой к еврейской форме и согласованной с нормами современного русского библейского письма.
- source_word: קוּמוּ
  choice: Встаньте
  rationale: Повелительное наклонение множественного числа, естественное для обращения к собранию.
- source_word: בָּרֲכוּ
  choice: благословите
  rationale: Сохраняет основное значение корня ברך и его повтор в последующей форме וִיבָרְכוּ и существительном בְּרָכָה.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, непосредственно представленное тетраграмматоном в еврейском тексте.
- source_word: אֱלֹהֵיכֶם
  choice: вашего Бога
  rationale: Точно передаёт суффикс второго лица множественного числа.
- source_word: מִן הָעוֹלָם עַד הָעוֹלָם
  choice: от века и до века
  rationale: Устойчивое, возвышенное и понятное русское выражение неограниченной длительности.
- source_word: וִיבָרְכוּ
  choice: И пусть благословляют
  rationale: Масоретская форма имеет третье лицо множественного числа и побудительно-желательное значение. Перевод сохраняет грамматическое число и не вводит отсутствующего в тексте определённого субъекта.
- source_word: שֵׁם כְּבוֹדֶךָ
  choice: славное имя Твоё
  rationale: Естественно передаёт еврейскую конструкцию «имя славы Твоей», сохраняя её смысл без тяжеловесности.
- source_word: וּמְרוֹמַם
  choice: превознесённое
  rationale: Страдательное причастие мужского рода относится к слову «имя» и выражает его возвышенность.
- source_word: עַל כָּל בְּרָכָה וּתְהִלָּה
  choice: выше всякого благословения и хвалы
  rationale: Сохраняет образ превосходства Божьего имени над всяким человеческим благословением и прославлением.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Субъект формы וִיבָרְכוּ
  choice: пусть благословляют
  alternative: да будет благословенно
  rationale: Выбрана грамматически засвидетельствованная форма третьего лица множественного числа. Альтернатива даёт более гладкую литургическую формулу, но требует переосмыслить число или конструкцию; неопределённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным богослужебным звучанием. Архаические формы сведены к минимуму; местоимение «Твоё» написано с прописной буквы как уважительное обращение к Богу. Перечень имён выделен тире для ясности.
