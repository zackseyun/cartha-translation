  verdict: revise
  source_fidelity: В целом переданы предостережение с целью вернуть к Торе, дерзкое неповиновение, согрешение против установлений и заключительный сознательный отказ слушать. Однако «подставили непокорное плечо» в современном русском устойчиво ассоциируется с помощью («подставить плечо») и потому может передавать противоположный смысл. Формулу о жизни следует выразить ближе к еврейской условно-результативной конструкции, без неудачного «благодаря им».
  naturalness: Текст в основном литературный и ясный. «Не внимали Твоим заповедям» естественнее, чем «не слушали Твоих заповедей», поскольку по-русски заповедям внимают или повинуются. «Выставили непокорное плечо» сохраняет метафору, не вызывая ложной ассоциации с оказанием помощи.
