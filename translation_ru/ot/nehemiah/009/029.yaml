  text: וַ/תָּ֨עַד בָּ/הֶ֜ם לַ/הֲשִׁיבָ֣/ם אֶל תּוֹרָתֶ֗/ךָ וְ/הֵ֨מָּה הֵזִ֜ידוּ וְ/לֹא שָׁמְע֤וּ לְ/מִצְוֺתֶ֨י/ךָ֙ וּ/בְ/מִשְׁפָּטֶ֣י/ךָ חָֽטְאוּ בָ֔/ם אֲשֶׁר יַעֲשֶׂ֥ה אָדָ֖ם וְ/חָיָ֣ה בָ/הֶ֑ם וַ/יִּתְּנ֤וּ כָתֵף֙ סוֹרֶ֔רֶת וְ/עָרְפָּ֥/ם הִקְשׁ֖וּ וְ/לֹ֥א שָׁמֵֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/009/029.yaml
  text: You warned them in order to bring them back to your law[a], but they acted presumptuously and did not listen to your commandments; they sinned against your judgments, by which a man shall live if he does them. They gave a stubborn shoulder, stiffened their neck[b], and would not listen.
translation:
  language: ru
  text: Ты предостерегал их, чтобы возвратить их к Твоему Закону, но они дерзко поступали и не внимали Твоим заповедям. Они грешили против Твоих установлений — тех, исполняя которые человек будет жить ими[a]. Они выставили непокорное плечо и сделали свою шею несгибаемой[b] — они не желали слушать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые человек исполнит — и будет жить ими». Ср. Левит 18:5.'
    reason: lexical_alternative_and_cross_reference
  - marker: b
    text: «Непокорное плечо» и «несгибаемая шея» — образы упрямого сопротивления и отказа повиноваться.
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתָּעַד בָּהֶם
  choice: Ты предостерегал их
  rationale: Порода hифиль глагола עוד здесь выражает настойчивое, торжественное предостережение; русский глагол передаёт смысл без излишне буквального «свидетельствовал против них».
- source_word: לַהֲשִׁיבָם אֶל תּוֹרָתֶךָ
  choice: чтобы возвратить их к Твоему Закону
  rationale: Каузативная форма שׁוב означает «возвратить», а תּוֹרָה в данном контексте обозначает данный Богом Закон, хотя само слово может шире означать наставление.
- source_word: הֵזִידוּ
  choice: они поступали дерзко
  rationale: Глагол זיד указывает не просто на внутреннюю гордость, а на самонадеянное, дерзкое поведение.
- source_word: לֹא שָׁמְעוּ לְמִצְוֺתֶיךָ
  choice: не слушали Твоих заповедей
  rationale: שׁמע с предлогом ל подразумевает послушание, но перевод «не слушали» сохраняет образ слышания исходного текста.
- source_word: וּבְמִשְׁפָּטֶיךָ חָטְאוּ בָם
  choice: грешили против Твоих установлений
  rationale: מִשְׁפָּטִים здесь — Божьи обязательные постановления или правовые установления; оборот с ב передан естественным русским «против».
- source_word: אֲשֶׁר יַעֲשֶׂה אָדָם וְחָיָה בָהֶם
  choice: исполняя которые человек будет жить благодаря им
  rationale: Сохранены условно-результативная связь между исполнением и жизнью, обобщённое значение אָדָם и отсылка к Левиту 18:5. «Благодаря им» естественно передаёт בָהֶם, не уточняя природу обещанной жизни.
- source_word: וַיִּתְּנוּ כָתֵף סוֹרֶרֶת
  choice: подставили непокорное плечо
  rationale: Сохранена выразительная еврейская метафора упорного сопротивления, не сведённая к общему «отвернулись».
- source_word: וְעָרְפָּם הִקְשׁוּ
  choice: сделали свою шею несгибаемой
  rationale: Передан буквальный образ ожесточённого упрямства без архаического русского слова «выя».
- source_word: וְלֹא שָׁמֵעוּ
  choice: они не желали слушать
  rationale: В заключительной фразе форма выражает устойчивый сознательный отказ; «не желали» передаёт волевой оттенок контекста.
theological_decisions:
- issue: Смысл жизни через исполнение Божьих установлений
  choice: человек будет жить благодаря им
  alternative: человек, исполнив их, будет жив ими
  rationale: Формулировка сохраняет утверждение исходного текста и его связь с Левитом 18:5, не определяя дополнительно, идёт ли речь только о земной жизни, о заветном благополучии или о более широком богословском смысле жизни.
- issue: Обобщённое אָדָם
  choice: человек
  alternative: мужчина
  rationale: Здесь אָדָם имеет родовое значение и относится к любому человеку; русское «человек» точно сохраняет это значение и грамматическое единственное число.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Метафоры исходного текста сохранены, местоимения обращения к Богу написаны с прописной буквы; синтаксис сделан понятным без устранения богословской напряжённости фразы о жизни через исполнение установлений.
