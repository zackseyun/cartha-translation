source:
  edition: WLC
  text: וְ/אֶת בְּכֹר֤וֹת בָּנֵ֨י/נוּ֙ וּ/בְהֶמְתֵּ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָ֑ה וְ/אֶת בְּכוֹרֵ֨י בְקָרֵ֜י/נוּ וְ/צֹאנֵ֗י/נוּ לְ/הָבִיא֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ לַ/כֹּ֣הֲנִ֔ים הַ/מְשָׁרְתִ֖ים בְּ/בֵ֥ית אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/037.yaml
  text: and the firstborn of our sons and of our livestock[a], as it is written in the Law, and the firstborn of our herds and of our flocks, to bring to the house of our God[b], to the priests who minister in the house of our God.
translation:
  language: ru
  text: и первенцев среди наших сыновей и нашего скота, как написано в Законе,[a] и первенцев нашего крупного и мелкого скота[b] приносить в дом нашего Бога священникам, служащим в доме нашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть согласно предписаниям Торы о первенцах людей и животных.
    reason: cross_reference
  - marker: b
    text: 'Или: «первенцев нашего крупного скота и наших овец и коз».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹרוֹת בָּנֵינוּ
  choice: первенцев среди наших сыновей
  rationale: Так передаётся значение первенцев из числа сыновей и устраняется возможное ошибочное понимание «первенцы наших сыновей» как их собственные дети.
- source_word: וּבְהֶמְתֵּינוּ
  choice: и нашего скота
  rationale: בְּהֵמָה здесь обозначает домашних сельскохозяйственных животных в широком смысле; «скот» естественно передаёт собирательное значение.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: как написано в Законе
  rationale: Формула ссылается на записанные предписания Торы; прописная буква показывает, что речь идёт именно о Законе Моисея, а не о законе вообще.
- source_word: בְּכוֹרֵי בְקָרֵינוּ וְצֹאנֵינוּ
  choice: первенцев нашего крупного и мелкого скота
  rationale: בָּקָר обозначает прежде всего крупный рогатый скот, а צֹאן — мелкий скот, то есть овец и коз; русская парная формула точна и естественна.
- source_word: לְהָבִיא
  choice: приносить
  rationale: Инфинитив продолжает перечень обязательств и выражает действие, которое община обязуется совершать; несовершенный вид уместен для регулярного установления.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: в дом нашего Бога
  rationale: Сохранён буквальный образ «дома Бога»; хотя имеется в виду храм, замена на «храм» была бы истолковывающим уточнением.
- source_word: לַכֹּהֲנִים הַמְשָׁרְתִים
  choice: священникам, служащим
  rationale: Причастие описывает продолжающееся храмовое служение священников; формулировка ясна в современном русском языке.
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: в доме нашего Бога
  rationale: Повтор исходного выражения сохранён ради его смыслового акцента и связи священнического служения с домом Бога.
theological_decisions:
- issue: Передавать ли בֵּית אֱלֹהֵינוּ как «дом нашего Бога» или как «храм нашего Бога»
  choice: дом нашего Бога
  alternative: храм нашего Бога
  rationale: Исходный текст буквально говорит «дом нашего Бога». Слово «храм» верно указывает на референт, но без необходимости снимает образность еврейского выражения.
- issue: Следует ли прямо указывать в основном тексте на выкуп первенцев людей и жертвенное принесение первенцев животных
  choice: сохранить общее обозначение «первенцы» без поясняющего добавления
  alternative: первенцы, которых надлежит выкупать или приносить в жертву
  rationale: Стих отсылает к предписаниям Закона, но сам не разграничивает выкуп и жертвоприношение. Перевод не должен вносить в основной текст подразумеваемые правовые подробности.
translation_notes:
  register: Современный литературный русский язык с достоинством covenantного перечня обязательств. Синтаксис сохраняет характер продолжения предыдущего контекста; повтор «дом нашего Бога» намеренно воспроизводит повтор исходного текста.
