base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/029.yaml
  text: and the rest of the people—the priests[a], the Levites, the gatekeepers, the singers, the temple servants, and all who had separated themselves from the peoples of the lands to the law of God—their wives, their sons, and their daughters[b], everyone who knew and understood—
translation:
  language: ru
  text: И остальной народ — священники, левиты, привратники, певцы, храмовые служители[a] и все отделившиеся от народов земель ради Закона Бога, — их жёны, сыновья и дочери, все, кто знал и понимал[b], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «нетинимы» — традиционное транслитерированное название группы храмовых служителей.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте выражения «все отделившиеся» и «все, кто знал и понимал» стоят в мужском роде единственного числа, но имеют собирательное значение.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר הָעָם
  choice: И остальной народ
  rationale: שְׁאָר обозначает оставшуюся часть, а עָם здесь — народ как общину завета; сочетание естественно звучит по-русски.
- source_word: הַכֹּהֲנִים הַלְוִיִּם הַשּׁוֹעֲרִים הַמְשֹׁרְרִים
  choice: священники, левиты, привратники, певцы
  rationale: Сохранены конкретные названия храмовых групп; «певцы» точнее передаёт причастие от שׁיר, чем более широкое «музыканты».
- source_word: הַנְּתִינִים
  choice: храмовые служители
  rationale: Функциональный перевод понятнее современной аудитории, чем традиционная транслитерация «нефинимы», и соответствует роли этой группы.
- source_word: וְכָל הַנִּבְדָּל מֵעַמֵּי הָאֲרָצוֹת אֶל תּוֹרַת הָאֱלֹהִים
  choice: и все отделившиеся от народов других земель, чтобы следовать Закону Бога
  rationale: «Отделившиеся» сохраняет смысл נבדל, а целевая конструкция естественно передаёт направленность אֶל к Божьему Закону, не создавая неестественного русского сочетания «отделившиеся к Закону».
- source_word: נְשֵׁיהֶם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: их жёны, сыновья и дочери
  rationale: Сохранено явное перечисление членов семей без обобщения словом «семьи» или «дети».
- source_word: כֹּל יוֹדֵעַ מֵבִין
  choice: все, кто знал и понимал
  rationale: Перевод сохраняет оба причастия и допускает как общее знание и понимание, так и способность осознанно участвовать в обязательстве.
theological_decisions:
- issue: Направленность отделения в выражении מֵעַמֵּי הָאֲרָצוֹת אֶל תּוֹרַת הָאֱלֹהִים
  choice: «отделившиеся от народов других земель, чтобы следовать Закону Бога»
  alternative: «отделившиеся от народов земель к Закону Бога» / «ради Закона Бога»
  rationale: Выбранная формулировка сохраняет двойное движение — от народов к Божьему Закону — и при этом остаётся естественной по-русски. Она не уточняет сверх текста конкретную форму исполнения Закона.
- issue: Мужской род единственного числа с собирательным значением в הַנִּבְדָּל и יוֹדֵעַ מֵבִין
  choice: Русское множественное «все отделившиеся» и «все, кто знал и понимал» с пояснением в сноске
  alternative: 'Буквальное единственное число: «каждый отделившийся… каждый знающий и понимающий»'
  rationale: Множественное число естественно согласуется с явно смешанной группой, включающей жён, сыновей и дочерей; сноска сохраняет сведения о грамматической форме оригинала без ложного ограничения только мужчинами.
- issue: Обозначение הַנְּתִינִים
  choice: «храмовые служители»
  alternative: «нефинимы»
  rationale: Смысловой перевод понятен читателю и не привносит конфессионального толкования; традиционное название приведено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Перечень сохранён как единая протяжённая конструкция; конечное тире показывает, что предложение продолжается в следующем стихе. Маркер сноски о нефинимах помещён непосредственно после соответствующего выражения, а не после слова «священники».
