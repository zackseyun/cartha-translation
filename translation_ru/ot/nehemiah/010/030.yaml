base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/030.yaml
  text: They join with their brothers[a], their nobles, and enter into a curse and an oath, to walk in the law of God, which was given by the hand of Moses the servant of God, and to keep and to do all the commandments of Yahweh our Lord[d][c][b], and his judgments and his statutes.
translation:
  language: ru
  text: Они примыкают к своим братьям — знатным среди них — и вступают под проклятие и клятву[a], обязуясь поступать по Закону Бога, данному через Моисея, слугу Бога[b], соблюдать и исполнять все заповеди Яхве, нашего Господа, а также Его постановления и установления[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Проклятие и клятва» — заветное обязательство: они клянутся повиноваться и принимают на себя проклятие в случае нарушения клятвы.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «данному рукой Моисея».'
    reason: lexical_alternative
  - marker: c
    text: Слова, переведённые как «постановления» и «установления», можно также передать как «суды (или правила)» и «уставы».
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחֲזִיקִים עַל
  choice: присоединяются к
  rationale: В контексте обновления завета оборот означает твёрдо примкнуть к другим членам общины; этот перевод естественно передаёт солидарность и обязательство.
- source_word: אֲחֵיהֶם
  choice: своим братьям
  rationale: Сохранён буквальный мужской термин родства, который здесь обозначает собратьев по общине.
- source_word: אַדִּירֵיהֶם
  choice: своим знатным
  rationale: Слово обозначает влиятельных людей высокого общественного положения; «знатные» сохраняет социальный оттенок.
- source_word: וּבָאִים בְּאָלָה וּבִשְׁבוּעָה
  choice: принимают на себя проклятие и клятву
  rationale: Глагольное сочетание выражает вступление в обязательство, подкреплённое клятвой и санкцией за нарушение.
- source_word: לָלֶכֶת בְּתוֹרַת הָאֱלֹהִים
  choice: поступать по Закону Бога
  rationale: Русское «поступать по» естественно передаёт еврейскую метафору хождения как образа жизни, а «Закон» соответствует заветно-правовому контексту.
- source_word: אֲשֶׁר נִתְּנָה בְּיַד מֹשֶׁה
  choice: данному через Моисея
  rationale: Идиома «рукой Моисея» означает посредничество Моисея; буквальная калька по-русски была бы менее естественна.
- source_word: עֶבֶד הָאֱלֹהִים
  choice: Божьего слугу
  rationale: Здесь עֶבֶד служит почётным наименованием Моисея; «слуга» уместнее, чем «раб».
- source_word: וְלִשְׁמוֹר וְלַעֲשׂוֹת
  choice: соблюдать и исполнять
  rationale: Два русских глагола сохраняют двойную формулу наблюдения за предписаниями и их практического исполнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: מִשְׁפָּטָיו וְחֻקָּיו
  choice: Его установления и постановления
  rationale: Пара юридических терминов сохранена как два близких, но не полностью тождественных вида предписаний.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон, поэтому личное имя сохранено; следующий титул אֲדֹנֵינוּ отдельно передан как «нашего Господа».
- issue: Значение covenant-формулы אָלָה וּשְׁבוּעָה
  choice: проклятие и клятва
  alternative: клятвенное обязательство под страхом проклятия
  rationale: Основной текст сохраняет оба исходных существительных, а примечание объясняет их взаимосвязь, не сглаживая напряжение формулы.
- issue: Статус Моисея в выражении עֶבֶד הָאֱלֹהִים
  choice: Божий слуга
  alternative: раб Бога
  rationale: В данном титульном употреблении слово подчёркивает почётное служение Моисея Богу, а не социально-правовой статус раба.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён без потери заветной и юридической терминологии; личное имя Яхве сохранено.
