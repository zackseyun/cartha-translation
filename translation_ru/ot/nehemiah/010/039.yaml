revisions:
- from: И священник, потомок Аарона, должен быть с левитами, когда левиты собирают десятину. Левиты же должны приносить десятину с десятины[a] в дом нашего Бога, в кладовые хранилища[b].
  to: И священник, потомок Аарона, должен быть с левитами, когда левиты собирают десятину. Левиты же должны приносить десятину от десятины[a] в дом нашего Бога, в кладовые при хранилище[b].
  rationale: Исправлены только стилистически и семантически небезупречные сочетания. Перевод сохраняет нормативную модальность, происхождение священника, технический характер «десятины от десятины» и различие между храмовыми кладовыми и хранилищем.
  reviewer_model: gpt-5.6-terra
