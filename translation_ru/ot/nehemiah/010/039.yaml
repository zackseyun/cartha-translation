  text: וְ/הָיָ֨ה הַ/כֹּהֵ֧ן בֶּֽן אַהֲרֹ֛ן עִם הַ/לְוִיִּ֖ם בַּ/עְשֵׂ֣ר הַ/לְוִיִּ֑ם וְ/הַ/לְוִיִּ֞ם יַעֲל֨וּ אֶת מַעֲשַׂ֤ר הַֽ/מַּעֲשֵׂר֙ לְ/בֵ֣ית אֱלֹהֵ֔י/נוּ אֶל הַ/לְּשָׁכ֖וֹת לְ/בֵ֥ית הָ/אוֹצָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/039.yaml
  text: And the priest[a], a son of Aaron, shall be with the Levites when the Levites collect the tithe, and the Levites shall bring up the tithe of the tithe to the house of our God[b], to the chambers of the storehouse.
translation:
  language: ru
  text: И священник, потомок Аарона, должен быть с левитами, когда левиты собирают десятину. Левиты же должны приносить десятину от десятины[a] в дом нашего Бога, в кладовые при хранилище[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «десятина десятины»; то есть десятая часть от десятины, полученной левитами.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сокровищнице». Здесь, вероятно, подразумевается место для хранения десятин и приношений, а не только денег.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: должен быть
  rationale: В данном контексте союз с перфектом выражает предписание о том, что должно происходить, а не повествование о прошлом.
- source_word: הַכֹּהֵן בֶּן־אַהֲרֹן
  choice: священник, потомок Аарона
  rationale: Передаёт принадлежность священника к роду Аарона естественным современным русским языком; буквальное «сын Аарона» могло бы ошибочно восприниматься как указание на непосредственного сына.
- source_word: עִם
  choice: с
  rationale: Передаёт простое совместное присутствие священника с левитами.
- source_word: בַּעְשֵׂר הַלְוִיִּם
  choice: когда левиты собирают десятину
  rationale: Инфинитив обозначает действие взимания или сбора десятины; временное придаточное ясно передаёт его связь с присутствием священника.
- source_word: יַעֲלוּ
  choice: должны приносить
  rationale: Каузативная форма означает «поднимать, приносить наверх». Русское «приносить» естественно передаёт доставку в храм, тогда как «поднимать» здесь звучало бы неясно.
- source_word: מַעֲשַׂר הַמַּעֲשֵׂר
  choice: десятину с десятины
  rationale: Сохраняет техническую формулу оригинала и показывает, что левиты отдают часть из полученной ими десятины.
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: в дом нашего Бога
  rationale: Сохраняет библейское обозначение храма и форму общего исповедания «нашего Бога».
- source_word: הַלְּשָׁכוֹת
  choice: кладовые
  rationale: В контексте храмового хранения речь идёт о помещениях для припасов и приношений; «кладовые» ясно передаёт их назначение.
- source_word: לְבֵית הָאוֹצָר
  choice: хранилища
  rationale: Здесь имеется в виду место хранения натуральных десятин и приношений, а не исключительно денежных средств.
theological_decisions:
- issue: Назначение храмовых помещений
  choice: хранилище
  alternative: сокровищница
  rationale: Контекст связан прежде всего с хранением натуральных десятин и приношений; «хранилище» не создаёт излишне узкой ассоциации с деньгами и драгоценностями.
- issue: Священническое происхождение
  choice: потомок Аарона
  alternative: сын Аарона
  rationale: Фраза указывает на принадлежность к священническому роду Аарона, а не обязательно на прямое сыновство; перевод не добавляет конфессиональной терминологии.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном. Синтаксис разделён на два предложения для ясности; юридически-обязательный характер заветного постановления передан сочетанием «должен/должны». Маркеры примечаний поставлены непосредственно после выражений, к которым относятся.
