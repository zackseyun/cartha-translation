review_pass:
  verdict: revise
  source_fidelity: 'Смысл предписания передан верно: присутствие священника из рода Аарона при взимании левитами десятины и обязанность левитов доставлять выделяемую ими часть в храмовые помещения сохранены. Однако сочетание «в кладовые хранилища» неудачно: оно тавтологично и не передаёт естественно связь «в помещения хранилища». Формулу מַעֲשַׂר הַמַּעֲשֵׂר лучше передать как «десятину от десятины», с пояснением её технического смысла в примечании.'
  naturalness: «Должен быть» и «должны приносить» уместно передают нормативный характер текста. «Потомок Аарона» понятно и не создаёт ложного впечатления о непосредственном сыновстве. Замена «кладовые хранилища» на «кладовые хранилища» не решала бы стилистической проблемы; естественное современное решение — «в кладовые при хранилище».
  terminology: «Левиты», «десятина» и «дом нашего Бога» сохранены последовательно. «Кладовые при хранилище» различает лְשָׁכוֹת, отдельные помещения, и בֵּית הָאוֹצָר, хранилище; примечание об альтернативной «сокровищнице» сохраняет допустимую лексическую возможность без неоправданного сужения значения.
  issues:
  - severity: medium
    issue: Тавтологичное и синтаксически неясное выражение «в кладовые хранилища».
    rationale: «Кладовые» и «хранилище» в таком сочетании дублируют друг друга, а отношение между еврейскими «помещениями» и «хранилищем» остаётся невыраженным. «В кладовые при хранилище» естественно передаёт назначение и связь этих помещений.
  - severity: low
    issue: Формула «десятину с десятины» звучит менее естественно по-русски.
    rationale: «Десятину от десятины» точнее и привычнее передаёт зависимое отношение в מַעֲשַׂר הַמַּעֲשֵׂר; примечание разъясняет, что это десятая часть полученной левитами десятины.
  revised_text: И священник, потомок Аарона, должен быть с левитами, когда левиты собирают десятину. Левиты же должны приносить десятину от десятины[a] в дом нашего Бога, в кладовые при хранилище[b].
