base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/033.yaml
  text: We also laid on ourselves the obligation to give yearly a third of a shekel for the service of the house of our God[a].
translation:
  language: ru
  text: Мы также обязались ежегодно давать треть шекеля на служение в доме нашего Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мы также возложили на себя обязательство ежегодно давать треть шекеля».'
    reason: Сноска сохраняет более формальную передачу еврейского оборота וְהֶעֱמַדְנוּ עָלֵינוּ מִצְוֺת, выражающего обязательное требование, принятое общиной на себя.
lexical_decisions:
- source_word: וְהֶעֱמַדְנוּ עָלֵינוּ מִצְוֺת
  choice: мы также обязались
  rationale: В данном контексте оборот означает, что община возложила на себя обязательное установление. «Обязались» естественно передаёт добровольно принятое, но обязательное для исполнения решение; альтернативная, более формальная передача приведена в сноске.
- source_word: לָתֵת
  choice: давать
  rationale: Сохраняет обычное значение глагола נתן и не сужает его до более интерпретирующего «вносить» или «платить».
- source_word: שְׁלִשִׁית הַשֶּׁקֶל
  choice: треть шекеля
  rationale: Точная и естественная передача дробной денежно-весовой меры.
- source_word: בַּשָּׁנָה
  choice: ежегодно
  rationale: Контекст указывает на регулярный взнос раз в год.
- source_word: לַעֲבֹדַת
  choice: на служение
  rationale: В храмовом контексте עֲבֹדָה охватывает богослужебную деятельность и связанные с ней нужды; «служение» сохраняет культовый оттенок без чрезмерного уточнения.
- source_word: בֵּית אֱלֹהֵינוּ
  choice: в доме нашего Бога
  rationale: Сохраняет буквальный библейский образ «дома Бога» и не заменяет его более узким словом «храм».
theological_decisions:
- issue: Характер обязательства в מִצְוֺת
  choice: принятое общиной обязательство
  alternative: мы установили для себя заповедь / возложили на себя установления
  rationale: Текст говорит о том, что община сама связывает себя конкретным ежегодным требованием. «Обязались» не превращает это решение ни в необязательный обычай, ни в прямо данную Богом новую заповедь.
translation_notes:
  register: Современный литературный русский язык; ясная и dignified формулировка без канцелярской тяжеловесности. «Дом нашего Бога» сохраняет библейский регистр, а сноска отражает лексическую неоднозначность исходного оборота.
