lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: и что
  rationale: Союз и относительная частица вводят очередное обязательство, зависящее от предшествующей формулы клятвы; «и что» естественно передаёт обе функции.
- source_word: לֹא נִתֵּן בְּנֹתֵינוּ
  choice: мы не будем отдавать своих дочерей
  rationale: Форма yiqtol в контексте клятвенного обязательства имеет значение будущего намерения. «Своих» естественнее в русском при соотнесённости с подлежащим, чем «наших».
- source_word: לְעַמֵּי הָאָרֶץ
  choice: народам этой земли
  rationale: Сохранено множественное число עַמֵּי. Указательное «этой» естественно передаёт определённость הָאָרֶץ и указывает на страну, о которой идёт речь, не добавляя характеристик «языческие» или «чужеземные».
- source_word: וְאֶת בְּנֹתֵיהֶם לֹא נִקַּח
  choice: и не будем брать их дочерей в жёны
  rationale: Глагол לקח буквально означает «брать», а в данном сочетании обозначает вступление в брак; добавление «в жёны» делает брачный смысл ясным в современном русском.
- source_word: לְבָנֵינוּ
  choice: для наших сыновей
  rationale: Предлог לְ передаёт назначение, а בָּנִים здесь прямо означает сыновей; гендерно-конкретное выражение сохранено.
theological_decisions:
- issue: Передача запрета на смешанные браки без привнесения этнической или расовой идеологии
  choice: Сохранить формулировку «народы этой земли» и взаимное описание брачных связей без дополнительных определений.
  alternative: «языческие народы», «чужеземцы» или «жители этой земли»
  rationale: Сам стих говорит о браках с окружающими народами в контексте верности завету. Определения «языческие» и «чужеземные» добавляли бы толкование, а «жители» устраняло бы явное множественное число еврейского עַמֵּי.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Синтаксический параллелизм двух обязательств сохранён; брачный смысл второй половины выражен явно, без конфессиональных добавлений.
