lexical_decisions:
- source_word: הוֹדִיָּה
  choice: Ходия
  rationale: Личное имя передано транслитерацией с древнееврейского в форме, естественной для русской библейской традиции. Конечный элемент יה допускает также более явную передачу через «-ия» с йотовым переходом, отражённую в сноске как «Ходийя».
- source_word: חָשֻׁם
  choice: Хашум
  rationale: Личное имя транслитерировано непосредственно с древнееврейского; буква ח передана через «х», а שׁ — через «ш».
- source_word: בֵּצָי
  choice: Бецай
  rationale: Личное имя транслитерировано с сохранением различимого конечного дифтонга; צ передано русской буквой «ц».
