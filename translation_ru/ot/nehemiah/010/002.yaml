lexical_decisions:
- source_word: וְעַל
  choice: На
  rationale: Предлог עַל в данном административном контексте указывает, что перечисляемые имена находились на скреплённом печатями документе; начальное וְ передаёт связь с предыдущим стихом, которая по-русски естественно выражается самим продолжением перечня.
- source_word: הַחֲתוּמִים
  choice: скреплённом печатями документе
  rationale: Форма представляет собой определённое причастие мужского рода множественного числа, буквально «скреплённых печатями». В контексте она, вероятно, метонимически обозначает документ с печатями либо помещённые на нём имена; добавление слова «документ» делает административный смысл понятным, а буквальная форма отмечена в сноске.
- source_word: נְחֶמְיָה
  choice: Неемии
  rationale: Традиционная русская библейская форма имени; родительный падеж обусловлен естественной русской конструкцией «стояли имена».
- source_word: הַתִּרְשָׁתָא
  choice: правителя
  rationale: Персидский административный титул передан функциональным русским соответствием, понятным современному читателю; традиционная транслитерация указана в сноске.
- source_word: בֶּן
  choice: сына
  rationale: Обычное обозначение происхождения «сын»; падеж согласован с именем Неемии.
- source_word: חֲכַלְיָה
  choice: Хакалии
  rationale: Имя транслитерировано с еврейского с учётом сложившейся русской библейской формы.
- source_word: וְצִדְקִיָּה
  choice: и Седекии
  rationale: Союз соединяет второе имя с первым; использована традиционная русская библейская форма имени.
