  text: וְֽ/הַ/לְוִיִּ֑ם וְ/יֵשׁ֨וּעַ֙ בֶּן אֲזַנְיָ֔ה בִּנּ֕וּי מִ/בְּנֵ֥י חֵנָדָ֖ד קַדְמִיאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/010.yaml
  text: 'and the Levites: Jeshua son of Azaniah[a], Binnui from the sons of Henadad[b], Kadmiel.'
translation:
  language: ru
  text: 'и левиты: Иешуа, сын Азании, Биннуй из потомков Хенадада, Кадмиил.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: и левиты
  rationale: Союз וְ связывает эту группу с предыдущим перечнем, а определённое множественное הַלְוִיִּם вводит имена левитов. Глагол в еврейском тексте отсутствует, поэтому в переводе он не добавлен.
- source_word: וְיֵשׁוּעַ בֶּן אֲזַנְיָה
  choice: Иешуа, сын Азании
  rationale: Имена переданы принятой русской библейской транслитерацией; генеалогическая конструкция בֶּן передана прямо как «сын».
- source_word: בִּנּוּי מִבְּנֵי חֵנָדָד
  choice: Биннуй из потомков Хенадада
  rationale: В родословном и клановом контексте בְּנֵי обозначает не только непосредственных сыновей, но и потомков или членов рода; «из потомков» естественно передаёт сочетание с предлогом מִן и не создаёт впечатления, будто перечислены непосредственные сыновья Хенадада.
- source_word: קַדְמִיאֵל
  choice: Кадмиил
  rationale: Личное имя передано в традиционной русской библейской форме, близкой к еврейскому звучанию.
theological_decisions: []
translation_notes:
  register: Краткая именная запись сохранена без добавления сказуемого. Двоеточие естественно вводит перечень левитов; стиль современный, литературный и соответствует контексту списка подписавших соглашение.
