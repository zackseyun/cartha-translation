lexical_decisions:
- source_word: זַכּוּר
  choice: Заккур
  rationale: Личное имя передано транслитерацией с удвоенным «к», отражающим дагеш в כּ; форма соответствует нормам русской библейской передачи имён.
- source_word: שֵׁרֵבְיָה
  choice: Шеревия
  rationale: Личное имя транслитерировано с передачей начального שׁ как «ш» и теофорного окончания יָה как «ия»; выбрана узнаваемая русская библейская форма.
- source_word: שְׁבַנְיָה
  choice: Шевания
  rationale: Личное имя транслитерировано; сочетание ב без дагеша передано как «в», а окончание יָה — как «ия», в соответствии с принятой русской библейской традицией.
