source:
  edition: WLC
  text: כִּ֣י אֶל הַ֠/לְּשָׁכוֹת יָבִ֨יאוּ בְנֵי יִשְׂרָאֵ֜ל וּ/בְנֵ֣י הַ/לֵּוִ֗י אֶת תְּרוּמַ֣ת הַ/דָּגָן֮ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָר֒ וְ/שָׁם֙ כְּלֵ֣י הַ/מִּקְדָּ֔שׁ וְ/הַ/כֹּהֲנִים֙ הַ/מְשָׁ֣רְתִ֔ים וְ/הַ/שּׁוֹעֲרִ֖ים וְ/הַ/מְשֹׁרְרִ֑ים וְ/לֹ֥א נַעֲזֹ֖ב אֶת בֵּ֥ית אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/040.yaml
  text: For the sons of Israel and the sons of Levi will bring the contribution of the grain[a], the new wine, and the oil to the chambers, where the vessels of the sanctuary are, and the priests who minister, and the gatekeepers, and the singers[b]. And we will not neglect the house of our God.
translation:
  language: ru
  text: Ибо сыны Израиля и сыны Левия будут приносить в помещения приношение зерна, молодого вина и масла. Там находятся утварь святилища, служащие священники, привратники и певцы. И мы не оставим без попечения дом нашего Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будем пренебрегать домом нашего Бога»; буквально: «не оставим дом нашего Бога».'
    reason: Сноска сохраняет диапазон значений עזב между буквальным «оставить» и контекстуальным «оставить без заботы, пренебречь».
lexical_decisions:
- source_word: לְּשָׁכוֹת
  choice: кладовые
  rationale: В храмовом контексте речь идёт о боковых помещениях, в которых хранились приношения и храмовые принадлежности; «кладовые» естественно передаёт их функцию.
- source_word: בְנֵי יִשְׂרָאֵל וּבְנֵי הַלֵּוִי
  choice: сыны Израиля и сыны Левия
  rationale: Формальная пара сохраняет повторяющуюся еврейскую конструкцию и её риторический параллелизм; в современном русском «сыны» уместно в торжественном библейском регистре.
- source_word: תְּרוּמַת
  choice: приношение
  rationale: Обозначает долю, отделённую для священного употребления; «приношение» ясно передаёт культовый контекст без узкотехнического термина.
- source_word: הַדָּגָן
  choice: зерна
  rationale: Общее обозначение зерновых продуктов.
- source_word: הַתִּירוֹשׁ
  choice: молодого вина
  rationale: Термин обозначает свежий продукт виноградарства; «молодое вино» сохраняет сельскохозяйственный оттенок, не сводя значение к неперебродившему соку.
- source_word: הַיִּצְהָר
  choice: масла
  rationale: В традиционной триаде сельскохозяйственных продуктов имеется в виду оливковое масло; краткое «масло» естественно в данном контексте.
- source_word: כְּלֵי הַמִּקְדָּשׁ
  choice: принадлежности святилища
  rationale: כְּלִי охватывает сосуды, утварь и прочие предметы; «принадлежности» не сужает значение только до сосудов.
- source_word: הַכֹּהֲנִים הַמְשָׁרְתִים
  choice: служащие священники
  rationale: Причастие указывает на священников, исполняющих храмовое служение.
- source_word: הַשּׁוֹעֲרִים
  choice: привратники
  rationale: Обычное русское обозначение храмовых служителей, отвечавших за ворота.
- source_word: לֹא נַעֲזֹב
  choice: не оставим без попечения
  rationale: В контексте обязательств по обеспечению храма глагол означает не допустить пренебрежения домом Бога; выражение сохраняет образ «оставления», уточняя практический смысл.
theological_decisions:
- issue: Обозначение заветных групп через «сынов»
  choice: сыны Израиля и сыны Левия
  alternative: израильтяне и левиты
  rationale: Сохранена явная параллель исходного текста без превращения её в более привычные этноним и служебное название.
- issue: Смысл обязательства по отношению к дому Бога
  choice: не оставим без попечения дом нашего Бога
  alternative: не оставим / не покинем дом нашего Бога
  rationale: Контекст касается материального обеспечения храмового служения. Выбранная формулировка передаёт этот смысл, но сохраняет семантику оставления и не сводит фразу к физическому уходу.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис разделён на три предложения ради ясности длинного еврейского ряда. Союз «ведь» передаёт объяснительное כִּי и связь с предшествующим обязательством.
