revisions:
- from: Ведь сыны Израиля и сыны Левия будут приносить в кладовые приношение зерна, молодого вина и масла. Там находятся принадлежности святилища, а также служащие священники, привратники и певцы. И мы не оставим без попечения дом нашего Бога.[a]
  to: Ибо сыны Израиля и сыны Левия будут приносить в помещения приношение зерна, молодого вина и масла. Там находятся утварь святилища, служащие священники, привратники и певцы. И мы не оставим без попечения дом нашего Бога.[a]
  rationale: 'Исправлены только безопасные лексико-стилистические моменты: нейтральное «помещения» сохраняет архитектурную и функциональную широту לְשָׁכוֹת, а «ибо» естественно передаёт объяснительное כִּי в библейском регистре. Смысл обязательства и сноска сохранены.'
