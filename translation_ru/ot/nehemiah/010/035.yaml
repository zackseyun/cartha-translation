  text: וְ/הַ/גּוֹרָל֨וֹת הִפַּ֜לְנוּ עַל קֻרְבַּ֣ן הָ/עֵצִ֗ים הַ/כֹּהֲנִ֣ים הַ/לְוִיִּם֮ וְ/הָ/עָם֒ לְ֠/הָבִיא לְ/בֵ֨ית אֱלֹהֵ֧י/נוּ לְ/בֵית אֲבֹתֵ֛י/נוּ לְ/עִתִּ֥ים מְזֻמָּנִ֖ים שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בַעֵ֗ר עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ כַּ/כָּת֖וּב בַּ/תּוֹרָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/035.yaml
  text: We cast lots concerning the wood offering—the priests[a], the Levites, and the people—to bring it to the house of our God, according to our fathers’ houses, at appointed times year by year, to burn on the altar of Yahweh our God, as it is written in the Law.
translation:
  language: ru
  text: Мы бросили жребий о приношении дров[a] — священники, левиты и народ, — чтобы по нашим родам в назначенные сроки из года в год доставлять дрова в дом нашего Бога для сожжения на жертвеннике Яхве, нашего Бога, как написано в Законе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для приношения дров». Древнееврейский предлог допускает оба понимания; жребием распределяли обязанность поставлять дрова для жертвенника.'
    reason: Сохранение смысловой неоднозначности предлога עַל.
lexical_decisions:
- source_word: וְהַגּוֹרָלוֹת הִפַּלְנוּ
  choice: Мы также бросили жребий
  rationale: Сочетание каузативной формы נפל с גּוֹרָלוֹת является обычным древнееврейским выражением со значением «бросать жребий». Союз וְ передан как «также», поскольку стих продолжает перечень обязательств общины.
- source_word: עַל קֻרְבַּן הָעֵצִים
  choice: о приношении дров
  rationale: Предлог עַל естественно обозначает предмет решения по жребию, а קֻרְבַּן הָעֵצִים — приношение, состоящее из дров для жертвенника. Возможное целевое понимание предлога сохранено в сноске.
- source_word: הַכֹּהֲנִים הַלְוִיִּם וְהָעָם
  choice: священники, левиты и народ
  rationale: Сохранены все три прямо названные группы, участвующие в распределении обязанности.
- source_word: לְהָבִיא לְבֵית אֱלֹהֵינוּ
  choice: доставлять дрова в дом нашего Бога
  rationale: Инфинитив выражает цель жеребьёвки. Повтор существительного «дрова» вместо местоимения делает русскую фразу ясной; «дом нашего Бога» сохраняет образное обозначение храма из исходного текста.
- source_word: לְבֵית אֲבֹתֵינוּ
  choice: по нашим родам
  rationale: Буквально «по домам наших отцов»; выражение обозначает родовые или семейно-клановые подразделения. «По нашим родам» понятно современному читателю и сохраняет распределительный смысл.
- source_word: לְעִתִּים מְזֻמָּנִים שָׁנָה בְשָׁנָה
  choice: в назначенные сроки из года в год
  rationale: Переданы как установленность сроков, так и регулярное ежегодное повторение.
- source_word: לְבַעֵר עַל מִזְבַּח
  choice: для сожжения на жертвеннике
  rationale: בער здесь обозначает сжигание принесённых дров на жертвеннике. Формулировка передаёт цель доставки, не добавляя более узкого толкования о постоянном поддержании огня.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, прямо стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: כַּכָּתוּב בַּתּוֹרָה
  choice: как написано в Законе
  rationale: Устойчивая формула ссылки на Тору; прописная буква показывает, что речь идёт о признанном своде Божьего наставления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Назначение принесённых дров
  choice: для сожжения на жертвеннике
  alternative: для поддержания огня на жертвеннике
  rationale: Глагол допускает понимание сжигания или разжигания; основной текст передаёт непосредственное значение и не уточняет, что речь непременно идёт о непрерывном поддержании огня.
translation_notes:
  register: Современный литературный русский язык с достоинством официального общинного обязательства. Административно-культовый смысл передан ясно; архаическое «отцовские дома» заменено понятным «роды», тогда как выражение «дом нашего Бога» сохранено как значимый библейский образ.
