base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/034.yaml
  text: for the bread of the arrangement[a], and for the regular grain offering, and for the regular burnt offering, for the Sabbaths, the new moons, the appointed times, and the holy things, and for the sin offerings to make atonement for Israel[e][d][c][b], and for all the work of the house of our God.
translation:
  language: ru
  text: для хлебов предложения[a], для постоянного хлебного приношения и постоянного всесожжения, для суббот, новомесячий и установленных сроков[c], для святынь[d] и жертв за грех[e], для искупления Израиля, а также для всех работ в доме нашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеб установленного ряда»; также можно перевести: «хлебы, разложенные перед Богом».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «назначенных времён»; в данном контексте речь может идти об установленных праздничных днях.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «священных приношений», «посвящённых предметов».'
    reason: lexical_alternative
  - marker: e
    text: 'Название этих жертв может также подчёркивать их очистительную функцию: «очистительные жертвы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: хлебы предложения
  rationale: Устойчивое русское обозначение хлебов, раскладываемых перед Богом; сохраняет культовый смысл еврейского выражения, буквально связанного с упорядоченным размещением.
- source_word: מִנְחַת הַתָּמִיד
  choice: постоянное хлебное приношение
  rationale: В культовом контексте מִנְחָה обозначает приношение из зерна или муки, а תָּמִיד — установленную регулярность; «хлебное приношение» — понятный традиционный русский термин.
- source_word: עֹלַת הַתָּמִיד
  choice: постоянное всесожжение
  rationale: עֹלָה — жертва, сжигаемая целиком, а תָּמִיד указывает на её непрерывно повторяющийся, установленный характер.
- source_word: הַשַּׁבָּתוֹת הֶחֳדָשִׁים לַמּוֹעֲדִים
  choice: для суббот, новомесячий и назначенных праздников
  rationale: Предлог перед последним членом естественно относится ко всему перечню. מוֹעֲדִים буквально означает назначенные времена и здесь подразумевает установленные праздничные дни.
- source_word: וְלַקֳּדָשִׁים
  choice: для святынь
  rationale: Широкое обозначение священных или посвящённых предметов и приношений; русский термин сохраняет неопределённость множества קֳדָשִׁים.
- source_word: וְלַחַטָּאוֹת
  choice: для жертв за грех
  rationale: В жертвенном контексте חַטָּאת обычно обозначает жертву за грех; формулировка узнаваема и не исключает связанной с ней очистительной функции.
- source_word: לְכַפֵּר עַל יִשְׂרָאֵל
  choice: чтобы совершать искупление за Израиль
  rationale: Сохраняет культовую и богословскую силу глагола כפר, не уточняя сверх текста механизм искупления.
- source_word: וְכֹל מְלֶאכֶת בֵּית אֱלֹהֵינוּ
  choice: для всех работ в доме нашего Бога
  rationale: מְלָאכָה имеет широкое значение работы или дела; перевод не сужает его до одного лишь богослужения.
theological_decisions:
- issue: Передача жертвенной терминологии
  choice: Сохранены установившиеся термины «хлебное приношение», «всесожжение», «жертвы за грех» и «совершать искупление».
  alternative: 'Более толковательные варианты: «дар из зерна», «целиком сжигаемая жертва», «очистительные жертвы».'
  rationale: Текст перечисляет храмовые нужды и жертвенные обязанности; традиционные, но понятные термины передают категории оригинала без навязывания более узкого богословского толкования.
- issue: Объём значения קֳדָשִׁים
  choice: «святыни»
  alternative: «священные приношения» или «посвящённые дары»
  rationale: Оригинал не уточняет, идёт ли речь исключительно о приношениях; широкая формулировка сохраняет эту неоднозначность.
- issue: Значение חַטָּאת в жертвенном контексте
  choice: «жертвы за грех» с примечанием об очистительном понимании
  alternative: «очистительные жертвы»
  rationale: Основной перевод сохраняет узнаваемую культовую категорию, а примечание отмечает реальную смысловую альтернативу без её догматического разрешения.
translation_notes:
  register: Современный литературный русский с достоинством храмового контекста. Синтаксис сохранён как продолжение перечня из предыдущего стиха. Термины понятны обычному читателю, а сноски фиксируют существенные лексические альтернативы.
