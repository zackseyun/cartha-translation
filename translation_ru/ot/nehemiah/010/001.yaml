source:
  edition: WLC
  text: וּ/בְ/כָל זֹ֕את אֲנַ֛חְנוּ כֹּרְתִ֥ים אֲמָנָ֖ה וְ/כֹתְבִ֑ים וְ/עַל֙ הֶֽ/חָת֔וּם שָׂרֵ֥י/נוּ לְוִיֵּ֖/נוּ כֹּהֲנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/001.yaml
  text: And because of all this[a], we are making a binding agreement in writing, and on the sealed document are our officials, our Levites[b], and our priests.
translation:
  language: ru
  text: И из-за всего этого[a] мы заключаем твёрдое соглашение и записываем его; а на запечатанном документе[b] — наши начальники, наши левиты и наши священники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И при всём этом». Еврейское выражение допускает причинное понимание («из-за всего этого») и более буквальное обстоятельственное («при всём этом»).'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на запечатанном». Вероятно, имеется в виду письменное соглашение, официально скреплённое печатями; далее перечислены его участники.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל זֹאת
  choice: И из-за всего этого
  rationale: Предлог בְּ здесь естественно понимать в причинном смысле, как отсылку ко всему предшествующему исповеданию и изложению истории; при этом возможен и более буквальный вариант «при всём этом».
- source_word: כֹּרְתִים
  choice: заключаем
  rationale: Глагол כרת буквально означает «резать», но в сочетании с обозначением соглашения или завета образует устойчивую формулу «заключать».
- source_word: אֲמָנָה
  choice: твёрдое соглашение
  rationale: Существительное обозначает надёжно установленное, обязательное обещание или соглашение. «Твёрдое соглашение» сохраняет оттенок прочности обязательства, не отождествляя слово без необходимости с обычным термином «завет».
- source_word: וְכֹתְבִים
  choice: и записываем его
  rationale: Форма указывает на письменное закрепление соглашения. Местоимение «его» естественно и недвусмысленно связывает действие с соглашением.
- source_word: וְעַל הֶחָתוּם
  choice: а на запечатанном документе
  rationale: Субстантивированная форма הֶחָתוּם буквально означает «запечатанное»; в контексте подразумевается письменный документ, скреплённый печатями.
- source_word: שָׂרֵינוּ
  choice: наши начальники
  rationale: שׂרים — руководители или должностные лица общины. «Начальники» передаёт их руководящее положение без монархического оттенка слова «князья».
- source_word: לְוִיֵּינוּ
  choice: наши левиты
  rationale: Прямое традиционное наименование левитов.
- source_word: כֹּהֲנֵינוּ
  choice: наши священники
  rationale: Прямой и общепринятый перевод названия священнической группы.
theological_decisions: []
