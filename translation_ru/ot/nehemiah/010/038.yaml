  text: וְ/אֶת רֵאשִׁ֣ית עֲרִיסֹתֵ֣י/נוּ וּ֠/תְרוּמֹתֵי/נוּ וּ/פְרִ֨י כָל עֵ֜ץ תִּיר֣וֹשׁ וְ/יִצְהָ֗ר נָבִ֤יא לַ/כֹּהֲנִים֙ אֶל לִשְׁכ֣וֹת בֵּית אֱלֹהֵ֔י/נוּ וּ/מַעְשַׂ֥ר אַדְמָתֵ֖/נוּ לַ/לְוִיִּ֑ם וְ/הֵם֙ הַ/לְוִיִּ֔ם הַֽ/מְעַשְּׂרִ֔ים בְּ/כֹ֖ל עָרֵ֥י עֲבֹדָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/038.yaml
  text: And we will bring the first of our dough[a], our contributions, the fruit of every tree, the new wine, and the oil to the priests, to the chambers of the house of our God, and the tithe of our land to the Levites; for they, the Levites[c][b], are the ones who collect the tithes in all the cities where we labor.
translation:
  language: ru
  text: Мы также будем приносить священникам — в кладовые дома нашего Бога — первую часть нашего теста[a], наши священные дары, плоды всякого дерева, молодое вино и масло; а десятину с нашей земли — левитам, потому что именно левиты собирают десятину во всех городах, где мы трудимся[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «начаток нашего теста», то есть первую часть замешанного теста, отделяемую как священный дар.'
    reason: lexical_clarification
  - marker: c
    text: 'Буквально: «во всех городах нашей работы (или: службы)». Сжатое еврейское выражение может указывать на города, связанные с трудом народа, вероятно земледельческим.'
    reason: alternative_reading
lexical_decisions:
- source_word: רֵאשִׁית עֲרִיסֹתֵינוּ
  choice: первую часть нашего теста
  rationale: רֵאשִׁית обозначает начальную, посвящаемую часть, а עֲרִיסָה — замешанное тесто. Такой перевод сохраняет конкретный образ и понятен современному читателю.
- source_word: תְרוּמֹתֵינוּ
  choice: наши священные дары
  rationale: תְּרוּמָה — отделённый для священного употребления дар или приношение. «Священные дары» передаёт назначение дара без архаичного технического термина.
- source_word: פְּרִי כָל עֵץ
  choice: плоды всякого дерева
  rationale: Формально передаёт распределительное значение כָּל и естественно звучит по-русски.
- source_word: תִּירוֹשׁ
  choice: молодое вино
  rationale: Термин обозначает вино как свежий продукт урожая; «молодое вино» сохраняет его сельскохозяйственную конкретность.
- source_word: יִצְהָר
  choice: масло
  rationale: В перечнях продуктов урожая слово обозначает масло, обычно оливковое; указание на оливы возможно, но отсутствует в самом выражении.
- source_word: נָבִיא
  choice: мы также будем приносить
  rationale: Форма породы hифиль первого лица множественного числа выражает обязательство общины; частица «также» передаёт начальное וְ и связь с продолжающимся перечнем обещаний.
- source_word: לִשְׁכוֹת
  choice: кладовые
  rationale: Слово обозначает помещения храмового комплекса, в данном контексте предназначенные для хранения приношений. Альтернатива «помещения» сохраняет более широкое архитектурное значение.
- source_word: מַעְשַׂר אַדְמָתֵנוּ
  choice: десятину с нашей земли
  rationale: Речь идёт о десятой части произведений земли. Русское «с нашей земли» естественно передаёт источник десятины, не превращая землю как участок в непосредственный предмет отдачи.
- source_word: הַמְעַשְּׂרִים
  choice: собирают десятину
  rationale: Причастие в данном административном контексте обозначает взимание или получение десятины левитами.
- source_word: בְּכֹל עָרֵי עֲבֹדָתֵנוּ
  choice: во всех городах, где мы трудимся
  rationale: עֲבֹדָה может означать труд, работу или служение. Перевод сохраняет трудовой оттенок и не сводит выражение исключительно к земледелию.
