  rationale: 'Указательное «эти» передано посредством русского именного предложения с тире: перечисленные лица непосредственно отождествляются со священниками. Отдельное «эти» по-русски здесь было бы тяжеловесным.'
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Определённость еврейской формы выражена контекстом и конструкцией отождествления; русский язык в таком именном сказуемом обычно не требует отдельного показателя определённости.
