base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/032.yaml
  text: As for the peoples of the land who bring goods and any grain on the Sabbath day to sell[a], we will not buy from them on the Sabbath or on a holy day; and we will forego the seventh year and every debt.
translation:
  language: ru
  text: Что же до народов этой земли, которые приносят товары и всякое зерно на продажу в субботний день, мы не будем покупать у них ни в субботу, ни в священный день; дадим седьмому году покой и оставим без взыскания всякий долг[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всякое требование» или «всякое взыскание». Буквально: «бремя (или взыскание) всякой руки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֵּי הָאָרֶץ
  choice: народы этой земли
  rationale: Сохранено множественное число עַמֵּי; выражение обозначает местные или окрестные народы, не принадлежащие к иудейской общине. Указательное «этой» естественно передаёт определённость הָאָרֶץ в данном контексте.
- source_word: הַמַּקָּחוֹת
  choice: товары
  rationale: Широкое и естественное обозначение предметов торговли в современном русском языке.
- source_word: שֶׁבֶר
  choice: зерно
  rationale: В торговом контексте существительное обычно обозначает зерно как основной продукт купли-продажи.
- source_word: לֹא נִקַּח מֵהֶם
  choice: мы не будем ничего покупать
  rationale: Буквально לקח означает «брать», но наличие товаров, принесённых на продажу, ясно задаёт значение покупки. «Ничего» естественно связывает запрет со всеми перечисленными товарами.
- source_word: בַּשַּׁבָּת וּבְיוֹם קֹדֶשׁ
  choice: ни в субботу, ни в священный день
  rationale: В сфере действия отрицания еврейское ו естественно передаётся русской конструкцией «ни… ни…». «Священный день» близко передаёт יום קדשׁ, не уточняя, какой именно праздник имеется в виду.
- source_word: וְנִטֹּשׁ אֶת הַשָּׁנָה הַשְּׁבִיעִית
  choice: будем оставлять землю в покое в седьмой год
  rationale: Глагол נטש означает «оставлять, отпускать». В контексте установлений о седьмом годе подразумевается отказ от обработки земли; это выражено естественно по-русски без замены буквального «седьмой год» термином «субботний год».
- source_word: מַשָּׁא כָל יָד
  choice: взыскание всякого долга
  rationale: Трудная сжатая идиома буквально связана с «бременем/взысканием каждой руки» и в контексте законодательства о седьмом годе, вероятнее всего, означает долговые требования. Неопределённость отражена в сноске.
theological_decisions:
- issue: Содержание обязательства седьмого года
  choice: Покой земли и отказ от взыскания долгов представлены как две связанные обязанности.
  alternative: «Оставим седьмой год и всякое требование руки» либо понимание последней фразы как любого имущественного взыскания.
  rationale: Контекст перекликается с предписаниями о покое земли и освобождении от долгов, однако краткая еврейская формула מַשָּׁא כָל יָד допускает более широкое понимание требования или взыскания; поэтому основной текст передаёт наиболее вероятный смысл, а сноска сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической структурой. Торговый запрет выражен прямо; архаизмы и конфессионально окрашенные термины не использованы.
