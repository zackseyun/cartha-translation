revisions:
- from: А у народов этой земли, которые приносят товары и всякое зерно на продажу в субботний день, мы не будем ничего покупать ни в субботу, ни в священный день; будем оставлять землю в покое в седьмой год и отказываться от взыскания всякого долга[a].
  to: Что же до народов этой земли, которые приносят товары и всякое зерно на продажу в субботний день, мы не будем покупать у них ни в субботу, ни в священный день; дадим седьмому году покой и оставим без взыскания всякий долг[a].
