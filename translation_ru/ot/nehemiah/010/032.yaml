  verdict: revise
  source_fidelity: 'Начальная часть передана в целом точно: «народы этой земли», товары, зерно, продажа в субботу и отказ от покупок верно отражают еврейский текст. Однако «не будем ничего покупать» добавляет абсолютное «ничего», которого в тексте нет; запрет относится к покупкам у этих продавцов. В заключительной части «землю» является оправданным контекстуальным уточнением, но лучше сохранить прямой объект «седьмой год» и не превращать перевод в более эксплицитное толкование. Формулировка о взыскании долга передаёт вероятный смысл מַשָּׂא כָל־יָד, при этом сноска должна оставлять альтернативы ясными и не создавать неестественного буквального оборота.'
