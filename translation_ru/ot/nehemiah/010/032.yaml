  terminology: «Суббота», «священный день», «седьмой год» и «зерно» удачны. «Народы этой земли» сохраняет множественное число и не навязывает этническую идентификацию. Для מַשָּׂא כָל־יָד основной перевод «всякий долг» допустим при сноске; «требование» и «взыскание» следует сохранить как возможные варианты.
