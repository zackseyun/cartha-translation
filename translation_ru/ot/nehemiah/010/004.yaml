  choice: Пашхур
  rationale: Еврейское личное имя передано транслитерацией; форма «Пашхур» отражает согласные שׁ и ח и соответствует распространённой русской библейской традиции.
- source_word: אֲמַרְיָה
  choice: Амария
  rationale: Еврейское личное имя передано в привычной русской библейской форме; окончание «-ия» естественно представляет теофорный элемент יָה.
- source_word: מַלְכִּיָּה
  choice: Малхия
  rationale: Еврейское личное имя передано в принятой и благозвучной русской форме; «х» соответствует спирантному произношению כ, а «-ия» — конечному теофорному элементу יָה.
