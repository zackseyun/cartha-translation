id: NEH.10.36
reference: Nehemiah 10:36
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וּ/לְ/הָבִ֞יא אֶת בִּכּוּרֵ֣י אַדְמָתֵ֗/נוּ וּ/בִכּוּרֵ֛י כָּל פְּרִ֥י כָל עֵ֖ץ שָׁנָ֣ה בְ/שָׁנָ֑ה לְ/בֵ֖ית יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/010/036.yaml
  text: and to bring the firstfruits of our land and the firstfruits of all the fruit of every tree[a], year by year, to the house of Yahweh[b],
translation:
  language: ru
  text: и из года в год приносить в дом Яхве начатки плодов нашей земли и начатки всяких плодов со всякого дерева[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «начатки всякого плода всякого дерева».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/הָבִיא
  choice: и приносить
  rationale: Союз с инфинитивом продолжает перечень обязательств завета; «приносить» естественно передаёт доставление посвящённых даров в храм.
- source_word: בִּכּוּרֵי
  choice: начатки плодов
  rationale: Слово обозначает первые плоды урожая, посвящаемые Богу; выражение сохраняет культовый смысл и понятно современному читателю.
- source_word: אַדְמָתֵנוּ
  choice: нашей земли
  rationale: В земледельческом контексте אֲדָמָה означает возделываемую землю; «нашей земли» звучит естественнее, чем буквальное «нашей почвы».
- source_word: וּ/בִכּוּרֵי כָּל פְּרִי כָל עֵץ
  choice: и начатки всяких плодов со всякого дерева
  rationale: Перевод сохраняет всеохватность повторённого כָל, но передаёт цепочку еврейских генитивов естественным русским синтаксисом.
- source_word: שָׁנָה בְ/שָׁנָה
  choice: из года в год
  rationale: Русское идиоматическое выражение точно передаёт регулярную ежегодную повторяемость.
- source_word: לְ/בֵית יְהוָה
  choice: в дом Яхве
  rationale: Сохраняется буквальный образ «дома» и личное имя יהוה; по-русски направление после «приносить» естественно выражается предлогом «в».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Передача בֵּית יְהוָה
  choice: дом Яхве
  alternative: храм Яхве
  rationale: «Дом» сохраняет формулировку источника, тогда как «храм» верно поясняет референт, но является более истолковывающим переводом.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным библейским регистром. Порядок компонентов слегка перестроен: обстоятельство ежегодности вынесено вперёд для плавности, при сохранении смысла и связи с перечнем обязательств.'
