  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: и их братья
  rationale: Сочетание союза וְ, существительного אָח во множественном числе в сопряжённой форме и местоименного суффикса 3-го лица множественного числа буквально означает «и их братья». В контексте перечня участников завета речь идёт о мужчинах той же группы, поэтому прямой перевод уместен.
- source_word: שְׁבַנְיָה
  choice: Шевания
  rationale: Личное имя передано принятой русской библейской формой, близкой к еврейскому звучанию.
- source_word: הוֹדִיָּה
  choice: Годия
  rationale: Личное имя передано традиционной русской библейской формой; начальный ה в устоявшейся передаче отражён буквой «Г».
- source_word: קְלִיטָא
  choice: Келита
  rationale: Личное имя транслитерировано в естественной для русского языка форме.
- source_word: פְּלָאיָה
  choice: Пелая
  rationale: Личное имя передано традиционной русской библейской формой, отражающей еврейское произношение.
- source_word: חָנָן
  choice: Ханан
  rationale: Личное имя транслитерировано непосредственно, с передачей начального ח через «Х».
