translation:
  language: ru
  text: 'главы народа: Парош[a], Пахат-Моав, Элам, Затту, Бани.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начальники народа»; «предводители народа». Буквально: «главы народа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי
  choice: главы
  rationale: Сопряжённая форма множественного числа от רֹאשׁ здесь метафорически обозначает людей, занимающих руководящее положение. «Главы» сохраняет еврейский образ и естественно звучит в контексте перечня представителей народа.
- source_word: הָעָם
  choice: народа
  rationale: עַם обозначает общину Иудеи и Иерусалима, представленную в перечне участников завета; «народ» — обычная и уместная передача в данном контексте.
- source_word: פַּרְעֹשׁ
  choice: Парош
  rationale: Личное или родовое имя передано транслитерацией с учётом принятой русской библейской формы.
- source_word: פַּחַת מוֹאָב
  choice: Пахат-Моав
  rationale: Составное личное или родовое имя передано через дефис, чтобы отразить его двухчастную структуру, не переводя компоненты имени.
- source_word: עֵילָם
  choice: Элам
  rationale: В данном перечне это личное или родовое имя, а не название области; оно передано принятой русской транслитерацией.
- source_word: זַתּוּא
  choice: Затту
  rationale: Личное или родовое имя передано транслитерацией, отражающей еврейскую форму.
- source_word: בָּנִי
  choice: Бани
  rationale: Масоретская форма данного стиха непосредственно соответствует имени «Бани»; она сохранена без согласования с похожими именами в соседних родословных перечнях.
