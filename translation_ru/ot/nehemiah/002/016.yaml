base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/016.yaml
  text: But the officials did not know where I had gone or what I was doing[a], and until then I had not told the Jews, the priests, the nobles, the officials, or the rest who were doing the work.
translation:
  language: ru
  text: А начальники не знали, куда я отправился и что я делал; до тех пор я не сообщил об этом ни иудеям[a], ни священникам, ни знатным, ни начальникам, ни остальным, выполнявшим работу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жителям Иудеи». Еврейское יְהוּדִים может обозначать жителей Иудеи либо иудейскую общину в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְּגָנִים
  choice: начальники
  rationale: Слово обозначает должностных лиц или подчинённых правителей. «Начальники» — ясное современное обозначение административных руководителей без навязывания точного персидского титула.
- source_word: יָדְעוּ
  choice: не знали
  rationale: Прямое и естественное соответствие обычному значению qal глагола ידע.
- source_word: אָנָה הָלַכְתִּי
  choice: куда я ходил
  rationale: אָנָה указывает направление, а форма совершенного вида описывает уже состоявшуюся ночную поездку; русское «куда я ходил» естественно передаёт возвращение после неё.
- source_word: וּמָה אֲנִי עֹשֶׂה
  choice: и что делал
  rationale: Причастие עֹשֶׂה передаёт происходящее или осуществляемое действие. Сочинительное «и» сохраняет еврейский waw и естественно звучит по-русски.
- source_word: לַיְּהוּדִים
  choice: иудеям
  rationale: יְהוּדִים может обозначать как жителей Иудеи, так и более широкую иудейскую общину. «Иудеи» уместно в историческом контексте книги, а неоднозначность отмечена в сноске.
- source_word: לַכֹּהֲנִים
  choice: священникам
  rationale: Прямое соответствие כֹּהֲנִים.
- source_word: לַחֹרִים
  choice: знатным
  rationale: В данном общественно-административном контексте חֹרִים обозначает представителей знати или влиятельных людей; субстантивированное «знатные» звучит естественно.
- source_word: וּלְיֶתֶר
  choice: ни остальным
  rationale: יֶתֶר означает оставшуюся часть группы; «остальным» естественно продолжает отрицательное перечисление.
- source_word: עֹשֵׂה הַמְּלָאכָה
  choice: кому предстояло выполнять эту работу
  rationale: Конструкция допускает коллективное значение — остальные участники дела. В контексте восстановление стены ещё не началось, поэтому перспективное «предстояло выполнять» яснее передаёт относящуюся к ним работу, не утверждая, будто она уже велась.
- source_word: עַד כֵּן
  choice: до того времени
  rationale: 'Передаёт временную границу: вплоть до указанного момента Неемия сохранял замысел в тайне.'
- source_word: לֹא הִגַּדְתִּי
  choice: я ничего не рассказывал
  rationale: Hiphil נגד значит «сообщать, рассказывать, давать знать». «Ничего не рассказывал» естественно выражает сокрытие замысла от перечисленных групп.
