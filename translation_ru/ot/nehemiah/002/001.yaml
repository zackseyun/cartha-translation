base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/001.yaml
  text: And it happened in the month of Nisan[a], in the twentieth year of King Artaxerxes, when wine was before him, that I took up the wine and gave it to the king. Now I had not been sad in his presence.
translation:
  language: ru
  text: В месяце нисане[a], в двадцатый год царя Артаксеркса, когда перед ним было вино, я взял вино и подал царю. До этого я не выглядел печальным в его присутствии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Нисан — весенний месяц древнего еврейского календаря, соответствующий примерно марту — апрелю.
    reason: historical_context
lexical_decisions:
- source_word: וַיְהִי
  choice: В
  rationale: Формула вводит очередное событие повествования; в русском датировочная конструкция естественно начинает предложение без буквального «и было».
- source_word: בְּחֹדֶשׁ נִיסָן
  choice: в месяце нисане
  rationale: Сохранена полная датировочная формула и традиционная русская передача названия месяца; название месяца оформлено со строчной буквы по современной норме.
- source_word: שְׁנַת עֶשְׂרִים לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: в двадцатый год царя Артаксеркса
  rationale: Естественная русская формула царской датировки, точно передающая порядковый год правления.
- source_word: יַיִן לְפָנָיו
  choice: когда перед ним стояло вино
  rationale: Безглагольная сцена передана естественно; добавлен подразумеваемый глагол «стояло», не уточняя сосуд, которого нет в еврейском тексте.
- source_word: וָאֶשָּׂא אֶת־הַיַּיִן
  choice: я взял вино
  rationale: נשא здесь означает взять или поднять вино для царского обслуживания; «взял» естественно и не добавляет отсутствующую в тексте чашу.
- source_word: וָאֶתְּנָה לַמֶּלֶךְ
  choice: и подал царю
  rationale: В придворном контексте «подал» естественно передаёт נתן и подразумевает ранее названное вино.
- source_word: וְלֹא הָיִיתִי רַע לְפָנָיו
  choice: Прежде я не выглядел печальным в его присутствии
  rationale: Буквальное «не был плох перед ним» является идиомой внешне заметной печали или угрюмости. «Прежде» передаёт контекстуальную предшествующую временную перспективу, не усиливая отрицание до «никогда».
