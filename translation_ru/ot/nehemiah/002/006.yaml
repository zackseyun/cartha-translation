base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/006.yaml
  text: Then the king said to me[a], while the queen was sitting beside him, “How long will your journey be, and when will you return?” So it pleased the king to send me, and I gave him a time.
translation:
  language: ru
  text: 'Царь сказал мне, когда царица[a] сидела рядом с ним: «Как долго продлится твоё путешествие и когда ты вернёшься?» Царю было угодно послать меня, и я назвал ему срок.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царская супруга». Еврейское слово обозначает царскую супругу, консорта.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Обычное обозначение монарха в повествовательном контексте; соответствует историческому и литературному регистру.
- source_word: הַשֵּׁגַל
  choice: царица
  rationale: Редкое слово обозначает царскую супругу или наложницу высокого статуса. «Царица» естественно передаёт её положение, а более узкое значение отмечено в сноске.
- source_word: יוֹשֶׁבֶת אֶצְלוֹ
  choice: сидела рядом с ним
  rationale: Причастная конструкция задаёт сопутствующее обстоятельство и указывает на непосредственную близость к царю.
- source_word: עַד מָתַי יִהְיֶה מַהֲלָכֲךָ
  choice: Сколько продлится твоя поездка
  rationale: Идиоматично передаёт вопрос о длительности предстоящего отсутствия; «поездка» в данном контексте естественнее буквального «путь».
- source_word: וּמָתַי תָּשׁוּב
  choice: и когда ты вернёшься
  rationale: Прямо и естественно передаёт обычное значение שׁוּב — «возвращаться».
- source_word: וַיִּיטַב לִפְנֵי הַמֶּלֶךְ וַיִּשְׁלָחֵנִי
  choice: Царь согласился отпустить меня
  rationale: Еврейская идиома означает царское одобрение просьбы. «Отпустить» в русском ясно выражает разрешение Неемии уехать, не добавляя идеи окончательного освобождения от службы.
- source_word: וָאֶתְּנָה לוֹ זְמָן
  choice: и я назвал ему срок
  rationale: זְמָן здесь означает определённый, назначенный срок. Русское «назвал срок» естественно передаёт сообщение царю конкретной продолжительности отсутствия.
