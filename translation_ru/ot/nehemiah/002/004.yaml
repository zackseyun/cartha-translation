  yaml_path: translation/ot/nehemiah/002/004.yaml
  text: Then the king said to me, “What is it that you are seeking?” So I prayed to the God of heaven.
translation:
  language: ru
  text: 'Царь спросил меня: «Чего же ты просишь?» Тогда я помолился Богу небес.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְבַקֵּשׁ
  choice: просишь
  rationale: В данном контексте глагол означает обращённую к царю просьбу, а не просто поиск; настоящее время передаёт незавершённый характер вопроса.
- source_word: וָאֶתְפַּלֵּל
  choice: Тогда я помолился
  rationale: Форма обозначает последующее действие Неемии; «тогда» естественно передаёт последовательность повествования, не уточняя вслух или про себя была произнесена молитва.
- source_word: אֱלֹהֵי הַשָּׁמָיִם
  choice: Богу небес
  rationale: Сохраняет традиционный и точный титул, где множественное «небеса» передано естественным русским родительным множественного числа.
theological_decisions:
- issue: Характер молитвы Неемии
  choice: Не уточнять, была ли молитва краткой, безмолвной или мысленной
  alternative: «Я мысленно помолился»
  rationale: Исходный текст сообщает лишь о молитве Богу небес и не описывает её способ.
translation_notes:
  register: Современный литературный русский язык; лаконичный повествовательный стиль. Частица «же» естественно передаёт усилительную конструкцию עַל מַה זֶּה в вопросе царя.
