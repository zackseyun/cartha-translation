lexical_decisions:
- source_word: וָאָבוֹא
  choice: Итак, я пришёл
  rationale: Форма с повествовательным вау обозначает следующее событие в последовательности. «Итак» естественно связывает прибытие с предшествующим рассказом, а «пришёл» точно передаёт בוא от первого лица.
- source_word: אֶל יְרוּשָׁלִָם
  choice: в Иерусалим
  rationale: Предлог אֶל при глаголе движения указывает направление к месту назначения; в современном русском сочетание «прийти в Иерусалим» естественно и точно.
- source_word: וָאֱהִי שָׁם
  choice: и пробыл там
  rationale: Хотя היה буквально имеет широкое значение «быть», в сочетании с указанием места и продолжительности по-русски естественнее «пробыл там»; это сохраняет смысл пребывания, не добавляя идеи деятельности.
- source_word: יָמִים שְׁלֹשָׁה
  choice: три дня
  rationale: Сочетание выражает продолжительность времени. После «пробыл» форма «три дня» передаёт её прямо и идиоматично.
