base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/014.yaml
  text: Then I went on to the Fountain Gate and to the King’s Pool[b][a], but there was no place for the animal under me to pass.
translation:
  language: ru
  text: Затем я направился дальше, к Воротам Источника[a] и к Царскому пруду, но животному подо мною[b] негде было пройти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Родниковым воротам». Еврейское слово может обозначать источник или родник.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «животному подо мною не было места пройти». Речь идёт о животном, на котором ехал Неемия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶעֱבֹר
  choice: Затем я прошёл
  rationale: Глагол עבר обозначает движение мимо или через что-либо; в рассказе о продолжающемся ночном осмотре «прошёл» естественно передаёт дальнейшее продвижение.
- source_word: שַׁעַר הָעַיִן
  choice: ворота Источника
  rationale: В данном топографическом контексте עַיִן означает источник или родник, а не глаз. Конструкция с родительным падежом естественна для названия ворот.
- source_word: בְּרֵכַת הַמֶּלֶךְ
  choice: Царский пруд
  rationale: בְּרֵכָה — пруд или водоём; перевод сохраняет форму собственного топографического названия и определение הַמֶּלֶךְ.
- source_word: וְאֵין מָקוֹם
  choice: но … негде было
  rationale: Такая формулировка естественно выражает отсутствие пространства для дальнейшего движения; «но» передаёт препятствующий, противительный смысл союза.
- source_word: לַבְּהֵמָה
  choice: животному
  rationale: בְּהֵמָה — общее обозначение животного; конкретный вид в стихе не назван, поэтому более узкое «ослу» или интерпретирующее «верховому животному» не вводится в основной текст.
- source_word: לַעֲבֹר
  choice: пройти
  rationale: Инфинитив עבר здесь описывает возможность преодолеть тесный или загромождённый участок.
- source_word: תַּחְתָּי
  choice: подо мною
  rationale: Буквально выражение означает «подо мной» и указывает на животное, на котором ехал Неемия; буквальный образ понятен по контексту и сохраняет формулировку еврейского текста.
