base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/019.yaml
  text: But when Sanballat the Horonite[a], Tobiah the Ammonite servant, and Geshem the Arab heard, they mocked us and despised us, and said, “What is this thing that you are doing? Are you rebelling against the king?”
translation:
  language: ru
  text: 'Когда об этом услышали Санаваллат Хоронитянин, Товия, аммонитский раб[a], и араб Гешем, они насмехались над нами, презирали нас и сказали: «Что это вы делаете? Вы восстаёте против царя?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Товия, аммонитский слуга»; возможно также, что это обозначение следует понимать шире — как должностной титул.'
    reason: Слово עֶבֶד обычно означает «раб» или «слуга», но в данном обозначении его иногда понимают как служебный титул.
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: когда об этом услышали
  rationale: Форма продолжает повествование и связывает услышанное с последующей враждебной реакцией; «об этом» естественно передаёт подразумеваемое содержание предыдущих событий.
- source_word: הַחֹרֹנִי
  choice: Хоронит
  rationale: Сохранено географическое или этническое обозначение при имени Санаваллата без попытки уточнить спорную локализацию Хорона.
- source_word: הָעֶבֶד הָעַמּוֹנִי
  choice: раб-аммонитянин
  rationale: עֶבֶד прямо передано словом «раб», а оба определения сохранены как единое обозначение Товии; возможное понимание как служебного титула отмечено в сноске.
- source_word: הָעַרְבִי
  choice: араб
  rationale: Прямое и естественное этническое обозначение в современном русском языке.
- source_word: וַיַּלְעִגוּ לָנוּ
  choice: стали насмехаться над нами
  rationale: Передаёт насмешливое издевательство; «стали» естественно выражает наступление реакции в повествовательной последовательности.
- source_word: וַיִּבְזוּ עָלֵינוּ
  choice: презирать нас
  rationale: Сохраняет сильный смысл отношения с презрением и параллель с предшествующим глаголом.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתֶּם עֹשִׂים
  choice: Что это вы делаете?
  rationale: Естественный русский вопрос, сохраняющий обвинительный акцент на действиях адресатов без тяжеловесного буквального «что это за дело».
- source_word: הַעַל הַמֶּלֶךְ אַתֶּם מֹרְדִים
  choice: Неужели вы восстаёте против царя?
  rationale: Передаёт обвинительный риторический вопрос и направленность мятежа против персидского царя, не превращая вопрос в прямое утверждение.
theological_decisions:
- issue: Значение עֶבֶד в обозначении Товии
  choice: раб
  alternative: слуга; чиновник
  rationale: Основное лексическое значение сохранено прямо. Поскольку в данном сочетании слово могло обозначать зависимого служителя либо должностное лицо, эта контекстуальная неоднозначность вынесена в сноску и не разрешена догматически.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Имена переданы в привычной русской библейской форме; синтаксис упрощён для ясности, а риторический и обвинительный характер заключительного вопроса сохранён.
