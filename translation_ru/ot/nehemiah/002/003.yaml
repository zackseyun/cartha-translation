  yaml_path: translation/ot/nehemiah/002/003.yaml
  text: I said to the king[a], “May the king live forever! Why should my face not be sad, when the city, the place of my fathers’ tombs, lies in ruins and its gates have been consumed by fire?”
translation:
  language: ru
  text: 'Я сказал царю: «Да живёт царь вовеки! Как же моему лицу не быть печальным, когда город — место гробниц моих предков[a] — лежит в развалинах, а его ворота сожжены огнём?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом гробниц моих предков»; это выражение указывает на место, связанное с погребением его предков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר לַמֶּלֶךְ
  choice: Я сказал царю
  rationale: Простая повествовательная форма естественно передаётся прошедшим временем; дательный падеж выражает адресата.
- source_word: הַמֶּלֶךְ לְעוֹלָם יִחְיֶה
  choice: Да живёт царь вовеки!
  rationale: Сохранена традиционная формула почтительного пожелания царю; русский оборот звучит торжественно и понятно.
- source_word: מַדּוּעַ לֹא יֵרְעוּ פָנַי
  choice: Как же моему лицу не быть печальным
  rationale: Сохранён древнееврейский образ печального лица, а риторический вопрос передан естественным русским оборотом.
- source_word: הָעִיר בֵּית קִבְרוֹת אֲבֹתַי
  choice: город — место гробниц моих предков
  rationale: Сочетание с буквальным значением «дом гробниц» понято как приложение к городу и передано ясным выражением без добавления названия Иерусалима.
- source_word: חֲרֵבָה
  choice: лежит в развалинах
  rationale: Выражает состояние разорённого, разрушенного города и естественно звучит по-русски.
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: а его ворота поглощены огнём
  rationale: Сохранена метафора глагола «есть, пожирать» применительно к разрушительному действию огня.
