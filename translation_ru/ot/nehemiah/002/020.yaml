base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/020.yaml
  text: Then I answered them and said[a], “The God of heaven, he will make us prosper, and we his servants will arise and build[b]. But you have no share or right or memorial in Jerusalem.”
translation:
  language: ru
  text: 'Тогда я ответил им: «Бог небес — Он дарует нам успех. Мы же, Его слуги, встанем и будем строить. А у вас нет ни доли, ни права, ни памяти в Иерусалиме».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ни доли, ни законного основания, ни памятного имени в Иерусалиме». Трёхчленная формула допускает оттенки участия, законного притязания и памятного, признаваемого статуса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָשִׁיב אוֹתָם דָּבָר וָאוֹמַר לָהֶם
  choice: Тогда я ответил им
  rationale: Еврейская идиома שׁוב + דבר означает дать ответ; последующее «и сказал им» в русском естественно объединяется с ней без утраты смысла.
- source_word: אֱלֹהֵי הַשָּׁמַיִם הוּא
  choice: Бог небес — Он
  rationale: «Бог небес» сохраняет характерный послепленный титул, а отдельное «Он» передаёт эмфатическое местоимение הוּא.
- source_word: יַצְלִיחַ לָנוּ
  choice: дарует нам успех
  rationale: Hiphil глагола צלח обозначает дарование успеха в предпринятом деле; формулировка естественна и сохраняет причинный смысл.
- source_word: עֲבָדָיו
  choice: Его слуги
  rationale: В контексте речь идёт о принадлежности Богу и служении Ему, а не о социальном статусе рабов.
- source_word: נָקוּם וּבָנִינוּ
  choice: встанем и будем строить
  rationale: Передаёт решимость приступить к действию и перспективное значение второго глагола; «строить» не добавляет контекстуально понятную приставку «вос-».
- source_word: אֵין חֵלֶק וּצְדָקָה וְזִכָּרוֹן
  choice: нет ни доли, ни права, ни памяти
  rationale: 'Сохраняется трёхчленная формула: участие, законное основание и памятное/признанное место в общине.'
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Обычная русская передача местного значения предлога ב.
theological_decisions:
- issue: Обозначение служащих Богу как עֲבָדָיו
  choice: Его слуги
  alternative: Его рабы
  rationale: Здесь подчёркнуты верность и уполномоченное служение Богу в противопоставлении людям, не имеющим положения в Иерусалиме; социально-правовой оттенок рабства не является главным.
- issue: Значение צְדָקָה в формуле исключения
  choice: право
  alternative: притязание; праведность
  rationale: В данном политико-правовом контексте слово обозначает законное право или основание, а не нравственную праведность. «Право» сохраняет смысл, не сужая его до самого акта притязания.
- issue: Значение זִכָּרוֹן
  choice: память
  alternative: памятник; упоминание
  rationale: 'Сохраняется неоднозначность еврейского слова: речь может идти о памятном, признанном месте или основании для поминовения, а не обязательно о материальном памятнике.'
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Эмфаза הוּא передана конструкцией с тире и местоимением «Он». Союзное противопоставление וַאֲנַחְנוּ отражено частицей «же», а заключительное וְלָכֶם — словом «А».
