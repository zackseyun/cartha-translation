  text: וָ/אַגִּ֨יד לָ/הֶ֜ם אֶת יַ֣ד אֱלֹהַ֗/י אֲשֶׁר הִיא֙ טוֹבָ֣ה עָלַ֔/י וְ/אַף דִּבְרֵ֥י הַ/מֶּ֖לֶךְ אֲשֶׁ֣ר אָֽמַר לִ֑/י וַ/יֹּֽאמְרוּ֙ נָק֣וּם וּ/בָנִ֔ינוּ וַ/יְחַזְּק֥וּ יְדֵי/הֶ֖ם לַ/טּוֹבָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/018.yaml
  text: So I told them that the hand of my God was good upon me[a], and also the words of the king that he had spoken to me. And they said[c][b], “Let us rise up and build.” So they strengthened their hands for the good work.
translation:
  language: ru
  text: 'И я рассказал им, как рука моего Бога была мне во благо[a], а также о словах царя, которые он сказал мне. Они ответили: «Встанем и будем строить!»[b] — и укрепили свои руки для доброго дела[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рука моего Бога была добра надо мной»; также возможно: «рука моего Бога благоволила ко мне».'
    reason: Сохраняет буквальную форму необычного еврейского оборота и указывает естественный смысловой вариант.
  - marker: b
    text: 'Или: «Поднимемся и построим!»'
    reason: Возможный вариант передачи совместного побуждения נָקוּם וּבָנִינוּ.
  - marker: c
    text: 'Буквально: «укрепили свои руки для добра».'
    reason: Отмечает буквальную форму идиомы и неопределённость существительного לַטּוֹבָה, которое в контексте относится к доброму начинанию.
lexical_decisions:
- source_word: וָאַגִּיד
  choice: И я рассказал
  rationale: Последовательный вав продолжает повествование; «рассказал» естественно передаёт сообщение Неемией о Божьем содействии и словах царя.
- source_word: יַד אֱלֹהַי
  choice: рука моего Бога
  rationale: Сохранён еврейский образ руки как выражение деятельного Божьего присутствия, силы и благоволения.
- source_word: אֲשֶׁר הִיא טוֹבָה עָלַי
  choice: как благотворна была для меня
  rationale: Передаёт буквальную идею «была добра надо мной/ко мне», но звучит естественно по-русски и не сводит образ исключительно к абстрактному благоволению.
- source_word: וְאַף דִּבְרֵי הַמֶּלֶךְ אֲשֶׁר אָמַר לִי
  choice: а также передал слова, которые сказал мне царь
  rationale: «Передал» подразумевается общим сказуемым וָאַגִּיד и по-русски ясно связывает второй предмет сообщения с первым; сохранено «слова», а не заменено на более свободное «что сказал».
- source_word: נָקוּם וּבָנִינוּ
  choice: Встанем и будем строить!
  rationale: Формы первого лица множественного числа в контексте выражают совместное побуждение и решимость. Русская конструкция сохраняет оба глагола и энергичный характер ответа.
- source_word: וַיְחַזְּקוּ יְדֵיהֶם
  choice: и укрепили свои руки
  rationale: Сохранён буквальный телесный образ, перекликающийся с «рукой моего Бога» и обозначающий решительную готовность действовать.
- source_word: לַטּוֹבָה
  choice: для доброго дела
  rationale: Контекстуально речь идёт о добром начинании — восстановлении стены. Добавление «дела» делает выражение понятным по-русски, а сноска отмечает буквальную форму.
theological_decisions:
- issue: Образ Божьей руки и характер Божьего содействия
  choice: Сохранить выражение «рука моего Бога», передав טוֹבָה как «благотворна была для меня»
  alternative: «Благоволение моего Бога было со мной» или «мой Бог был милостив ко мне»
  rationale: Исходный текст связывает успех Неемии с деятельной Божьей рукой, не уточняя способ действия. Сохранение метафоры удерживает богословскую насыщенность и не ограничивает смысл одним лишь расположением или милостью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конкретные образы «рука моего Бога» и «укрепили свои руки» сохранены; синтаксис сделан ясным для обычного читателя. Восклицательный знак передаёт решительный общий отклик, не добавляя доктринального толкования.
