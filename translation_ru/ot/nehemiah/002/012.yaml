  text: וָ/אָק֣וּם לַ֗יְלָה אֲנִי֮ וַ/אֲנָשִׁ֣ים מְעַט֮ עִמִּ/י֒ וְ/לֹא הִגַּ֣דְתִּי לְ/אָדָ֔ם מָ֗ה אֱלֹהַ/י֙ נֹתֵ֣ן אֶל לִבִּ֔/י לַ/עֲשׂ֖וֹת לִ/ירוּשָׁלִָ֑ם וּ/בְהֵמָה֙ אֵ֣ין עִמִּ֔/י כִּ֚י אִם הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אֲנִ֖י רֹכֵ֥ב בָּֽ/הּ׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/012.yaml
  text: So I arose in the night[a], I and a few men with me, and I had not told anyone what my God was putting into my heart to do for Jerusalem[c][b]. And there was no animal with me except the animal on which I was riding.
translation:
  language: ru
  text: Ночью я встал, и со мной было лишь несколько человек. Я никому не рассказывал, что мой Бог вложил мне в сердце сделать для Иерусалима.[a] Со мной не было никакого животного, кроме того животного, на котором я ехал.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что мой Бог влагал мне в сердце»; возможен и смысл: «к чему мой Бог побуждал меня».'
    reason: Еврейское נֹתֵן — причастие; оно может передавать продолжающееся действие или представлять Божье побуждение как живое и актуальное.
  - marker: b
    text: Еврейское слово обозначает животное вообще; вид верхового животного не уточняется.
    reason: Сохраняется лексическая неопределённость בְּהֵמָה без предположения, что это был конь, осёл или мул.
lexical_decisions:
- source_word: וָאָקוּם לַיְלָה
  choice: И встал я ночью
  rationale: Форма קום продолжает повествование, а לַיְלָה обозначает время действия. Инверсия сохраняет сдержанный, достойный повествовательный тон и остаётся естественной по-русски.
- source_word: אֲנִי וַאֲנָשִׁים מְעַט עִמִּי
  choice: и со мной было несколько человек
  rationale: Передаёт явно названную небольшую группу спутников без ненужного гендерного уточнения там, где русское «человек» естественно соответствует собирательному употреблению אֲנָשִׁים.
- source_word: וְלֹא הִגַּדְתִּי לְאָדָם
  choice: Я никому не рассказывал
  rationale: Отрицательное неопределённое выражение לְאָדָם естественно передаётся словом «никому»; глагол «рассказывал» выражает значение «сообщать, делать известным» и согласуется с продолжающимся состоянием сокрытия замысла.
- source_word: מָה אֱלֹהַי נֹתֵן אֶל לִבִּי
  choice: что мой Бог вкладывал мне в сердце
  rationale: Причастие נֹתֵן допускает длительный или живо представленный процесс. Формулировка сохраняет еврейский образ сердца как средоточия мысли и воли, не превращая его в прямое словесное откровение.
- source_word: לַעֲשׂוֹת לִירוּשָׁלִָם
  choice: сделать для Иерусалима
  rationale: Сохраняет широкое и намеренно неуточнённое значение оборота, не подставляя заранее «восстановить стены» или иную конкретную задачу.
- source_word: וּבְהֵמָה אֵין עִמִּי כִּי אִם הַבְּהֵמָה
  choice: Со мной не было никакого животного, кроме того
  rationale: בְּהֵמָה — общее обозначение животного; контекст показывает, что оно верховое, но не называет его вид. Русское «животное» сохраняет эту неопределённость.
- source_word: אֲשֶׁר אֲנִי רֹכֵב בָּהּ
  choice: на котором я ехал
  rationale: Естественно передаёт причастную конструкцию текущего действия и управление предлога בְּ.
theological_decisions:
- issue: Божье побуждение и внутренний замысел Неемии
  choice: «что мой Бог вкладывал мне в сердце»
  alternative: «что мой Бог вложил мне в сердце»; «к чему мой Бог побуждал меня»
  rationale: Выбранный вариант сохраняет участие Бога как источник намерения и длительный оттенок причастия, но не усиливает выражение до прямого откровения и не устраняет человеческую инициативу Неемии.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским повествовательным тоном. Синтаксис сделан ясным для обычного читателя; сохранены неопределённость вида животного и открытый характер того, что Неемия намеревался сделать для Иерусалима.
