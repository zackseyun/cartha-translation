base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/010.yaml
  text: When Sanballat the Horonite and Tobiah the Ammonite servant heard this[b][a], it was very displeasing to them that a man had come to seek the welfare of the children of Israel.
translation:
  language: ru
  text: Когда Санаваллат, хоронитянин, и Товия, аммонитянин-раб[a], услышали об этом, им было очень неприятно[b], что пришёл человек искать блага для сынов Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «аммонитянин-слуга». Еврейское עֶבֶד может означать как раба, так и слугу; конкретное положение Товии здесь не поясняется.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «это было для них великим злом»; в еврейском тексте слова одного корня со значением «плохое, зло» повторены для усиления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышали об этом
  rationale: Глагол означает «услышал/услышали»; «об этом» естественно восполняет подразумеваемый из предыдущего стиха предмет услышанного.
- source_word: הַחֹרֹנִי
  choice: хоронитянин
  rationale: Передаёт обозначение происхождения Санаваллата, не уточняя, какой именно Хорон имеется в виду.
- source_word: הָעֶבֶד הָעַמֹּנִי
  choice: раб-аммонитянин
  rationale: Сохраняет обычное значение עֶבֶד («раб; слуга») и аммонитское происхождение Товии; вариант «чиновник» был бы более истолковательным.
- source_word: וַיֵּרַע לָהֶם רָעָה גְדֹלָה
  choice: им стало крайне досадно
  rationale: Естественно передаёт сильную отрицательную реакцию, выраженную повтором слов одного корня רע; буквальная конструкция отмечена в сноске.
- source_word: אָדָם
  choice: человек
  rationale: Передаёт отдельного человека, которым в контексте является Неемия, без добавления отсутствующего в тексте имени.
- source_word: לְבַקֵּשׁ טוֹבָה
  choice: искать блага
  rationale: Сохраняет смысл целенаправленной заботы о пользе и благополучии народа, а также прямую связь с טוֹבָה («благо, добро»).
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: Сохраняет традиционное национально-родовое обозначение и направленность блага на Израильтян.
theological_decisions:
- issue: Социальное обозначение Товии словом עֶבֶד
  choice: раб-аммонитянин
  alternative: слуга-аммонитянин
  rationale: Основной текст не заменяет прямое социальное обозначение более почётным или административным титулом; при этом широкий диапазон слова прозрачно указан в сноске.
- issue: Характер отрицательной реакции Санаваллата и Товии
  choice: им стало крайне досадно
  alternative: это было для них великим злом
  rationale: Идиоматический перевод передаёт их сильное недовольство, а сноска сохраняет возможность услышать буквальную лексику «зла/плохого», не превращая её автоматически в богословскую оценку события.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан естественным для русского, но сохранены «сыны Израиля», социальное обозначение Товии и намеренный повтор отрицательной лексики через пояснительную сноску.
