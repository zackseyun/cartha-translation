base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/008.yaml
  text: and a letter to Asaph[a], the keeper of the king’s forest, that he should give me timber to make beams for the gates of the fortress by the temple, and for the wall of the city, and for the house that I will occupy. And the king gave them to me[d][c][b], according to the good hand of my God upon me.
translation:
  language: ru
  text: и письмо Асафу, смотрителю царского леса[a], чтобы он выдал мне древесину для устройства перекрытий над воротами цитадели, относящейся к храму[b], а также для городской стены и для дома, в котором я буду жить[c]. И царь дал мне — по доброй руке моего Бога надо мной[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царского парка» либо «царского заповедного угодья». Еврейское слово обозначает благоустроенное или охраняемое царское владение, в том числе лесной массив.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «крепости при храме». Буквально: «цитадели, которая у дома»; под «домом» здесь, вероятнее всего, подразумевается храм.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «для дома, в который я войду». Речь, по-видимому, о предназначенном Неемии жилище.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «по доброй руке моего Бога надо мной»; это образное выражение Божьего благоволения и деятельной помощи.'
    reason: cultural_note
lexical_decisions:
- source_word: אִגֶּרֶת
  choice: письмо
  rationale: Слово обозначает письмо или официальный письменный документ; в контексте просьбы к царю естественно передать его как «письмо».
- source_word: שֹׁמֵר הַפַּרְדֵּס
  choice: смотрителю царского леса
  rationale: פַּרְדֵּס может обозначать парк, сад, заповедное угодье или управляемый лесной массив. Поскольку оттуда должна поступить строительная древесина, «царский лес» ясно передаёт функцию этого владения.
- source_word: יִתֶּן לִי עֵצִים
  choice: чтобы он выдал мне древесину
  rationale: В строительном контексте עֵצִים означает не просто деревья, а древесину; «выдал» уместно для распоряжения управляющему царским имуществом.
- source_word: לְקָרוֹת
  choice: для балок
  rationale: Форма от קרה связана с укладкой балок или устройством перекрытия. Передача «для балок» естественна по-русски и не сужает значение исключительно до кровли.
- source_word: שַׁעֲרֵי הַבִּירָה אֲשֶׁר לַבַּיִת
  choice: ворот крепости при храме
  rationale: בִּירָה обозначает укрепление или цитадель, а הַבַּיִת в данном контексте, вероятнее всего, храм. Предлог «при» сохраняет связь крепости с храмом, не уточняя её сверх текста.
- source_word: הַבַּיִת אֲשֶׁר אָבוֹא אֵלָיו
  choice: дома, в котором я буду жить
  rationale: Буквально сказано о доме, в который Неемия войдёт; по контексту это предназначенное ему жилище. Русское «буду жить» естественно выражает эту функцию, а буквальный вариант отмечен в сноске.
- source_word: וַיִּתֶּן לִי הַמֶּלֶךְ
  choice: Царь дал мне просимое
  rationale: В еврейском тексте объект не выражен, но подразумевается из предшествующих просьб. «Просимое» восполняет эллипсис без уточнения конкретного состава царского пожалования.
- source_word: כְּיַד אֱלֹהַי הַטּוֹבָה עָלָי
  choice: потому что благая рука моего Бога была надо мной
  rationale: כְּיַד здесь указывает на соответствие или основание царского благоволения. Формулировка сохраняет значимый для Ездры—Неемии образ Божьей благой руки и при этом звучит естественно по-русски.
theological_decisions:
- issue: Божье провидение в выражении «благая рука моего Бога была надо мной»
  choice: Сохранить антропоморфный образ руки и передать связь с решением царя причинным оборотом.
  alternative: «по благой руке моего Бога надо мной» или «поскольку Бог благоволил ко мне»
  rationale: Образ руки подчёркивает деятельное Божье содействие и является повторяющимся мотивом книги. Его не следует сводить к отвлечённому понятию благоволения; вместе с тем причинный оборот делает еврейскую идиому понятной современному читателю.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для чтения вслух; сохранён ключевой образ Божьей «руки». Неопределённая связь крепости с «домом» передана нейтральным «при храме» и пояснена в сноске.
