  text: וָ/אוֹמַ֣ר אֲלֵ/הֶ֗ם אַתֶּ֤ם רֹאִים֙ הָ/רָעָה֙ אֲשֶׁ֣ר אֲנַ֣חְנוּ בָ֔/הּ אֲשֶׁ֤ר יְרוּשָׁלִַ֨ם֙ חֲרֵבָ֔ה וּ/שְׁעָרֶ֖י/הָ נִצְּת֣וּ בָ/אֵ֑שׁ לְכ֗וּ וְ/נִבְנֶה֙ אֶת חוֹמַ֣ת יְרוּשָׁלִַ֔ם וְ/לֹא נִהְיֶ֥ה ע֖וֹד חֶרְפָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/017.yaml
  text: 'Then I said to them[a], “You see the trouble we are in: Jerusalem lies in ruins, and its gates have been burned with fire. Come, let us rebuild the wall of Jerusalem[c][b], so that we may no longer be a reproach.”'
translation:
  language: ru
  text: 'Тогда я сказал им: «Вы видите, в каком бедственном положении мы находимся: Иерусалим лежит в развалинах, и его ворота сожжены огнём. Давайте восстановим стену Иерусалима, чтобы нам больше не быть посмешищем[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы нам больше не подвергаться поношению»; также возможно: «не быть в позоре».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָעָה אֲשֶׁר אֲנַחְנוּ בָהּ
  choice: в каком бедственном положении мы находимся
  rationale: В данном контексте רָעָה означает не нравственное зло, а тяжёлое, бедственное состояние общины; русская формулировка естественно передаёт также оборот «в котором мы находимся».
- source_word: יְרוּשָׁלִַם חֲרֵבָה
  choice: Иерусалим лежит в развалинах
  rationale: חֲרֵבָה описывает разорённый, опустошённый город; эта формулировка ясно передаёт его физическое разрушение.
- source_word: נִצְּתוּ בָאֵשׁ
  choice: сожжены огнём
  rationale: Сохранено явное упоминание огня, присутствующее в еврейском тексте, несмотря на допустимость более краткого русского «сожжены».
- source_word: לְכוּ וְנִבְנֶה
  choice: давайте восстановим
  rationale: לְכוּ здесь вводит призыв к совместному действию, а когортатив וְנִבְנֶה выражает общую решимость. «Восстановим» учитывает, что стена существовала прежде.
- source_word: חוֹמַת יְרוּשָׁלִַם
  choice: стену Иерусалима
  rationale: Прямо и естественно передана конструкция принадлежности, обозначающая городскую оборонительную стену.
- source_word: וְלֹא נִהְיֶה עוֹד חֶרְפָּה
  choice: чтобы нам больше не быть посмешищем
  rationale: חֶרְפָּה обозначает публичный позор, поношение и состояние, вызывающее насмешки. «Посмешище» естественно передаёт предметный оттенок выражения «быть поношением»; связь цели передана союзом «чтобы».
