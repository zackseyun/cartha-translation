base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/013.yaml
  text: So I went out by night through the Valley Gate[a], toward the Dragon Spring and toward the Dung Gate[b], and I inspected the walls of Jerusalem that had been broken down and its gates that had been consumed by fire.
translation:
  language: ru
  text: И вышел я ночью через Долинные ворота[a], направляясь к Драконову источнику и к Навозным воротам, и осматривал[b] стены Иерусалима, которые были разрушены, и его ворота, уничтоженные огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Овражные ворота»; еврейское название связано с долиной или ущельем.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение, переданное словами «осматривал», необычно и буквально связано с глаголом «ломать»; в данном контексте оно понимается как внимательный осмотр разрушенных стен.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵצְאָה
  choice: И вышел я
  rationale: Повествовательная форма от יצא передаёт последовательное действие; порядок слов естественен для современного литературного русского и сохраняет повествовательную торжественность.
- source_word: בְּשַׁעַר הַגַּיְא
  choice: через Долинные ворота
  rationale: При движении предлог ב естественно означает прохождение через ворота; название связано с долиной или ущельем.
- source_word: לַיְלָה
  choice: ночью
  rationale: Наречное обозначение времени передано кратко и естественно.
- source_word: וְאֶל־פְּנֵי עֵין הַתַּנִּין
  choice: направляясь к Драконову источнику
  rationale: עַיִן здесь означает источник, а תַּנִּין имеет диапазон значений «дракон, змей, подобное чудовище»; традиционно-топонимическое «Драконов» сохраняет необычный образ без его истолкования.
- source_word: שַׁעַר הָאַשְׁפֹּת
  choice: Навозные ворота
  rationale: אַשְׁפֹּת обозначает навоз или отбросы; «Навозные ворота» — прозрачное и устойчивое название.
- source_word: וָאֱהִי שֹׂבֵר
  choice: и осматривал
  rationale: Формально трудное сочетание היה с причастием שֹׂבֵר в данном контексте описывает продолжительный осмотр повреждённых стен; буквальное «ломал» противоречило бы изображаемому действию.
- source_word: בְּחוֹמֹת יְרוּשָׁלַםִ
  choice: стены Иерусалима
  rationale: Естественная русская конструкция для объекта осмотра.
- source_word: אֲשֶׁר הַמְּפֹרָצִים
  choice: которые были разрушены
  rationale: Форма от פרץ указывает на проломленные, разрушенные стены; вариант понятен широкому читателю.
- source_word: וּשְׁעָרֶיהָ אֻכְּלוּ בָאֵשׁ
  choice: и его ворота, уничтоженные огнём
  rationale: Пассив от אכל с огнём буквально выражает поглощение огнём; «уничтоженные огнём» естественно передаёт результат и сохраняет силу образа.
