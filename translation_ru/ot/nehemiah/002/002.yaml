base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/002.yaml
  text: And the king said to me[a], “Why is your face sad[b], though you are not sick? This is nothing but sadness of heart.” Then I was very much afraid.
translation:
  language: ru
  text: 'Царь сказал мне: «Почему у тебя печальный вид[a], хотя ты не болен? Это не что иное, как скорбь в сердце[b]». И я очень сильно испугался.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «почему твоё лицо плохо?» — еврейская идиома о печальном или встревоженном выражении лица.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тоска на сердце», «тревога в сердце»; буквально: «плохое состояние сердца» или «зло сердца». Здесь, по контексту, речь идёт о внутренней душевной тяготе, а не обязательно о нравственном зле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַדּוּעַ
  choice: почему
  rationale: Обычное вопросительное слово причины; простой русский эквивалент естественен и точен.
- source_word: פָּנֶיךָ רָעִים
  choice: у тебя печальный вид
  rationale: Буквально сказано «твоё лицо плохо»; это идиома, обозначающая печальное или встревоженное выражение лица. Русское «печальный вид» естественно передаёт её смысл.
- source_word: חוֹלֶה
  choice: болен
  rationale: Прямой и естественный русский эквивалент состояния физической болезни.
- source_word: אֵין זֶה כִּי אִם
  choice: это не что иное, как
  rationale: Конструкция исключает другие объяснения; выбранный оборот сохраняет её категоричность и уместен в литературной речи.
- source_word: רֹעַ לֵב
  choice: скорбь на сердце
  rationale: Буквально — «плохое/злое [состояние] сердца». В данном противопоставлении телесной болезни речь, вероятнее всего, идёт о внутренней душевной тяготе; «скорбь на сердце» сохраняет образ сердца и не вводит однозначно нравственного осуждения.
- source_word: וָאִירָא
  choice: и я … испугался
  rationale: Глагольная форма продолжает повествовательную последовательность; русский совершенный вид точно передаёт наступивший страх.
- source_word: הַרְבֵּה מְאֹד
  choice: очень сильно
  rationale: Сочетание двух усилителей подчёркивает степень страха; «очень сильно» сохраняет усиление и звучит естественно по-русски.
theological_decisions:
- issue: 'Значение רֹעַ לֵב: душевная скорбь или нравственное зло'
  choice: скорбь на сердце
  alternative: зло в сердце
  rationale: Контекст прямо противопоставляет физическую болезнь внутреннему состоянию, поэтому эмоциональная скорбь наиболее вероятна. Однако буквальная широта выражения отмечена в сноске, чтобы не скрывать возможный оттенок неблагополучия или зла.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным повествовательным тоном. Сохранены образ сердца, категоричность царского заключения и усиленная степень страха; буквальные семитские обороты разъяснены в сносках.
