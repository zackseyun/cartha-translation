  text: וָ/אֹמַ֣ר לַ/מֶּ֔לֶךְ אִם עַל הַ/מֶּ֣לֶךְ ט֔וֹב וְ/אִם יִיטַ֥ב עַבְדְּ/ךָ֖ לְ/פָנֶ֑י/ךָ אֲשֶׁ֧ר תִּשְׁלָחֵ֣/נִי אֶל יְהוּדָ֗ה אֶל עִ֛יר קִבְר֥וֹת אֲבֹתַ֖/י וְ/אֶבְנֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/005.yaml
  text: Then I said to the king[a], "If it pleases the king, and if your servant has found favor before you, that you would send me to Judah, to the city of my fathers' graves[c][b], so that I may rebuild it."
translation:
  language: ru
  text: 'Я сказал царю: «Если царю угодно и если твой слуга обрёл твоё благоволение, пошли меня в Иудею, в город, где находятся гробницы моих предков[a], чтобы я восстановил его[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в город гробниц моих отцов».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол буквально означает «построить»; перевод «восстановить» учитывает, что город лежал в развалинах.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Я сказал
  rationale: Вав с последовательной формой продвигает повествование; в русском контексте простое «Я сказал» естественно передаёт следующий шаг рассказа.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Если царю угодно
  rationale: Это почтительная придворная формула, выражающая одобрение или благоволение царя.
- source_word: וְאִם יִיטַב עַבְדְּךָ לְפָנֶיךָ
  choice: и если твой слуга обрёл твоё благоволение
  rationale: Оборот с ייטב и לפני указывает на благоприятное отношение адресата; выбранная формулировка сохраняет почтительный тон прошения.
- source_word: עַבְדְּךָ
  choice: твой слуга
  rationale: В обращении к царю это традиционное смиренное самообозначение, а не обязательное указание на рабский статус.
- source_word: תִּשְׁלָחֵנִי
  choice: пошли меня
  rationale: Глагол прямо означает «послать»; русский императив естественно выражает содержание вежливого условного прошения.
- source_word: יְהוּדָה
  choice: Иудея
  rationale: Устоявшееся русское название исторической области.
- source_word: אֶל־עִיר קִבְרוֹת אֲבֹתַי
  choice: в город, где находятся гробницы моих предков
  rationale: Еврейская конструкция буквально означает «в город гробниц моих отцов». «Предков» ясно передаёт широкий смысл אבות, а придаточная конструкция звучит естественно по-русски.
- source_word: וְאֶבְנֶנָּה
  choice: чтобы я восстановил его
  rationale: Когортатив выражает цель прошения. Основа глагола означает «строить», но контекст разрушенного города требует по-русски «восстановить»; местоимение относится к городу.
