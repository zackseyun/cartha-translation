base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/009.yaml
  text: So I came to the governors Beyond the River and gave them the king’s letters[b][a]. Now the king had sent with me army officers and horsemen.
translation:
  language: ru
  text: И я пришёл к наместникам Заречья[a] и передал им письма царя. Царь же послал со мной военачальников[b] и всадников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за Рекой». Так называлась персидская административная область к западу от Евфрата; также переводится «Заречная область».'
    reason: cultural_note
  - marker: b
    text: 'Или: «военных начальников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּחֲווֹת
  choice: наместникам
  rationale: Слово обозначает должностных лиц Персидской империи, управлявших областями; «наместники» точно и естественно передаёт их административную роль.
- source_word: עֵבֶר הַנָּהָר
  choice: Заречья
  rationale: Устойчивое административно-географическое наименование персидской области к западу от Евфрата; прописная буква передаёт его характер как названия.
- source_word: אִגְּרוֹת
  choice: письма
  rationale: В контексте это царские письменные послания, служившие официальными полномочиями; «письма» сохраняет прямое значение без излишнего уточнения.
- source_word: שָׂרֵי חַיִל
  choice: военачальников
  rationale: Сочетание обозначает начальников или командиров войска; «военачальники» кратко и ясно передаёт военное руководство.
- source_word: פָרָשִׁים
  choice: всадников
  rationale: Буквально речь идёт о конных людях; «всадники» ближе к еврейскому, чем собирательное «конница».
- source_word: וַיִּשְׁלַח עִמִּי הַמֶּלֶךְ
  choice: Царь же послал со мной
  rationale: Частица «же» естественно отмечает поясняющий, фоновый характер сообщения об эскорте, не вводя отсутствующего в русском языке плюсквамперфекта.
- source_word: וָאָבוֹא
  choice: И пришёл я
  rationale: Сохраняет последовательное повествовательное соединение и торжественно-нейтральный библейский ритм, оставаясь понятным современному читателю.
