base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/002/007.yaml
  text: Then I said to the king[a], “If it pleases the king, let letters be given to me for the governors Beyond the River[c][b], so that they may let me pass through until I come to Judah.”
translation:
  language: ru
  text: 'Тогда я сказал царю: «Если царю угодно, пусть мне дадут письма к наместникам Заречья[a], чтобы они пропустили меня, пока я не прибуду в Иудею».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Заречье» — персидское административное название области к западу от реки Евфрат.
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹמַר
  choice: Тогда я сказал
  rationale: Последовательная форма с וַ־ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: אִם עַל־הַמֶּלֶךְ טוֹב
  choice: Если царю угодно
  rationale: Естественная современная передача почтительной придворной формулы без изменения её условного характера.
- source_word: אִגְּרוֹת יִתְּנוּ לִי
  choice: пусть мне дадут письма
  rationale: Форма третьего лица выражает вежливую просьбу; «письма» прямо передаёт название письменных царских распоряжений, официальность которых ясна из контекста.
- source_word: פַּחֲווֹת
  choice: наместникам
  rationale: Слово обозначает персидских областных правителей; «наместники» уместно для имперской административной среды и понятно современному читателю.
- source_word: עֵבֶר הַנָּהָר
  choice: Заречья
  rationale: Это официальное персидское обозначение области к западу от Евфрата; написание с прописной буквы показывает, что перед нами название региона.
- source_word: אֲשֶׁר יַעֲבִירוּנִי
  choice: чтобы они пропускали меня
  rationale: В данном контексте каузатив глагола עבר означает предоставление беспрепятственного прохода через подвластные наместникам территории.
- source_word: עַד אֲשֶׁר אָבוֹא
  choice: пока я не прибуду
  rationale: Естественная русская временная конструкция, точно обозначающая конечный пункт действия.
- source_word: יְהוּדָה
  choice: Иудея
  rationale: Традиционное и понятное русское географическое название области Иуды в послепленном административном контексте.
