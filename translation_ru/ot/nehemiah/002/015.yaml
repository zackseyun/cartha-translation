lexical_decisions:
- source_word: עֹלֶה
  choice: поднялся
  rationale: Сочетание היה с причастием описывает продолжавшееся действие в повествовании; в современном русском простой глагол прошедшего времени передаёт его естественно.
- source_word: בַנַּחַל
  choice: по руслу потока
  rationale: נחל обозначает овраг или русло сезонного водотока. Выражение сохраняет топографический смысл и естественно описывает маршрут, не предполагая постоянного течения воды.
- source_word: לַיְלָה
  choice: ночью
  rationale: Естественное современное обозначение времени действия.
- source_word: שֹׂבֵר
  choice: осмотрел
  rationale: Обычное значение корня שבר — «ломать», однако здесь контекст ночного обследования разрушенной стены требует значения «осматривать, обследовать»; неоднозначность отмечена в сноске.
- source_word: בַּחוֹמָה
  choice: стену
  rationale: Сохранено единственное число с определённым референтом — городской стеной Иерусалима.
- source_word: וָאָשׁוּב
  choice: повернул назад
  rationale: Первое употребление שוב обозначает смену направления движения.
- source_word: וָאָבֹוא
  choice: вошёл
  rationale: В сочетании с названием ворот בוא естественно обозначает вход через них.
- source_word: בְּשַׁעַר הַגַּיְא
  choice: через Долинные ворота
  rationale: Это собственное название городских ворот; предлог «через» ясно передаёт маршрут входа.
- source_word: וָאָשׁוּב
  choice: вернулся
  rationale: Заключительное שוב подводит итог ночному обходу.
