source:
  edition: WLC
  text: כָּת֣וּב בָּ֗/הּ בַּ/גּוֹיִ֤ם נִשְׁמָע֙ וְ/גַשְׁמ֣וּ אֹמֵ֔ר אַתָּ֤ה וְ/הַ/יְּהוּדִים֙ חֹשְׁבִ֣ים לִ/מְר֔וֹד עַל כֵּ֛ן אַתָּ֥ה בוֹנֶ֖ה הַ/חוֹמָ֑ה וְ/אַתָּ֗ה הֹוֶ֤ה לָ/הֶם֙ לְ/מֶ֔לֶךְ כַּ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/006.yaml
  text: It was written in it[a], “It is being reported among the nations—and Geshem also says it—that you and the Jews are planning to rebel. Therefore you are rebuilding the wall, and according to these reports you are to become their king.”
translation:
  language: ru
  text: 'В нём было написано: «Среди народов ходят слухи — и Гашму[a] говорит то же самое, — будто ты и иудеи замышляете восстание и потому восстанавливаете стену. Согласно этим слухам, ты намерен стать их царём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте — «Гашму»; вероятно, это вариант имени «Гешем» (см. стих 1).
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּתוּב בָּהּ
  choice: В нём было написано
  rationale: Пассивная причастная конструкция вводит содержание письма; прошедшее время естественно в данном повествовательном контексте.
- source_word: בַּגּוֹיִם נִשְׁמָע
  choice: Среди народов ходят слухи
  rationale: Нифаль от שׁמע указывает на распространяемую молву; русское выражение естественно передаёт пассивно-циркулирующий характер сообщения. גוים здесь — народы, а не конфессионально окрашенные «язычники».
- source_word: וְגַשְׁמוּ אֹמֵר
  choice: и Гашму говорит то же самое
  rationale: Союз и глагол представляют Гашму как подтверждающего слух; «то же самое» ясно обозначает предмет его слов без добавления нового содержания.
- source_word: חֹשְׁבִים לִמְרוֹד
  choice: замышляете восстание
  rationale: חשב с инфинитивом выражает намерение или замысел; формулировка сохраняет обвинительный характер письма, не усиливая его до более узкого значения тайного заговора.
- source_word: עַל כֵּן
  choice: и потому
  rationale: Передаёт причинно-следственную связь, которую автор письма устанавливает между предполагаемым восстанием и восстановлением стены.
- source_word: בּוֹנֶה הַחוֹמָה
  choice: восстанавливаете стену
  rationale: Хотя בנה буквально означает «строить», контекст книги говорит о восстановлении разрушенной стены.
- source_word: וְאַתָּה הֹוֶה לָהֶם לְמֶלֶךְ
  choice: ты намерен стать их царём
  rationale: Конструкция הוה с ל может обозначать становление; в обвинительном сообщении речь идёт о приписываемом Неемии намерении, а не об уже совершившемся факте.
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: Согласно этим слухам
  rationale: דברים буквально может означать «слова» или «дела», но здесь указывает на только что приведённые сообщения; «слухам» естественно связывает заключительное уточнение с началом обвинения.
theological_decisions:
- issue: Характер обвинения в стремлении Неемии к царской власти
  choice: Передать как содержание распространяемого слуха и приписываемое намерение
  alternative: 'Сформулировать как достоверное предсказание: «ты станешь их царём»'
  rationale: Контекст открытого письма и выражение כַּדְּבָרִים הָאֵלֶּה показывают, что это враждебное донесение, а не утверждение повествователя.
translation_notes:
  register: Современный литературный русский язык с достоинством официально-повествовательной речи. Фраза выстроена как цитата из обвинительного письма; «ходят слухи» выбрано ради естественности, а тире выделяют вставное подтверждение Гашму.
