base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/018.yaml
  text: For many in Judah were bound by oath to him[a], because he was the son-in-law of Shecaniah son of Arah[b], and Jehohanan his son had taken the daughter of Meshullam son of Berechiah as his wife.
translation:
  language: ru
  text: Ибо многие в Иудее были обязаны ему клятвой[a], потому что он был зятем Шехании, сына Араха, а его сын Иоханан взял в жёны[b] дочь Мешуллама, сына Берехии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «были обладателями клятвы по отношению к нему», то есть были обязаны ему клятвой.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «взял дочь»; это обычное древнееврейское выражение со значением «женился на дочери».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבִּים בִּיהוּדָה
  choice: многие в Иудее
  rationale: 'Предлог בְּ здесь естественно понимать в локативном смысле: речь идёт о многих людях, находившихся в Иудее или принадлежавших к её общине.'
- source_word: בַּעֲלֵי שְׁבוּעָה לוֹ
  choice: были связаны с ним клятвой
  rationale: Буквально это «обладатели клятвы по отношению к нему»; выражение обозначает людей, обязанных ему клятвой. Выбранная формулировка сохраняет как личную направленность обязательства, так и его обязывающую силу.
- source_word: כִּי ... כִּי
  choice: ведь ... потому что
  rationale: Первое כִּי вводит объяснение сказанного ранее, а второе указывает причину описанной связи.
- source_word: חָתָן הוּא לִשְׁכַנְיָה
  choice: он был зятем Шехании
  rationale: В данном контексте חָתָן обозначает родство через брак, наиболее естественно — зятя.
- source_word: וִיהוֹחָנָן בְּנוֹ
  choice: а его сын Иоханан
  rationale: Формулировка сохраняет местоименную отсылку оригинала и не вводит в основной текст имени, которого в этой части еврейской фразы нет.
- source_word: לָקַח אֶת בַּת
  choice: взял в жёны дочь
  rationale: Это обычная древнееврейская брачная идиома. Русское «взял в жёны» ясно передаёт брачный смысл и остаётся близким к форме оригинала.
- source_word: בַּת מְשֻׁלָּם בֶּן בֶּרֶכְיָה
  choice: дочь Мешуллама, сына Берехии
  rationale: 'Так естественно и точно передаётся цепочка родства: женщина была дочерью Мешуллама, который был сыном Берехии.'
