lexical_decisions:
- source_word: גַּם
  choice: Также
  rationale: Передаёт добавочное значение и связывает это обстоятельство с предшествующим повествованием.
- source_word: בַּיָּמִים הָהֵם
  choice: в те дни
  rationale: Естественное для современного литературного русского языка обозначение периода повествования.
- source_word: מַרְבִּים
  choice: посылали множество
  rationale: В сочетании с «письмами» и причастной конструкцией выражает многочисленную, неоднократную переписку.
- source_word: חֹרֵי יְהוּדָה
  choice: знатные люди Иудеи
  rationale: Обозначает влиятельных представителей иудейской знати; формулировка понятна современному читателю и не сужает их роль до официальной должности.
- source_word: אִגְּרֹתֵיהֶם הוֹלְכוֹת עַל טוֹבִיָּה
  choice: посылали множество писем Товии
  rationale: Естественно передаёт буквальный образ «их письма шли к Товии», сохраняя направление и повторяемость действия.
- source_word: וַאֲשֶׁר לְטוֹבִיָּה בָּאוֹת אֲלֵיהֶם
  choice: а письма от Товии приходили к ним
  rationale: Восполняет подразумеваемое по параллелизму слово «письма» и передаёт встречное, неоднократное движение корреспонденции.
