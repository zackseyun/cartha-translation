  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר שָֽׁמְעוּ֙ כָּל א֣וֹיְבֵ֔י/נוּ וַ/יִּֽרְא֗וּ כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר סְבִֽיבֹתֵ֔י/נוּ וַ/יִּפְּל֥וּ מְאֹ֖ד בְּ/עֵינֵי/הֶ֑ם וַ/יֵּ֣דְע֔וּ כִּ֚י מֵ/אֵ֣ת אֱלֹהֵ֔י/נוּ נֶעֶשְׂתָ֖ה הַ/מְּלָאכָ֥ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/016.yaml
  text: And it happened that when all our enemies heard[a], and all the nations around us saw, they fell greatly in their own eyes, and they knew that this work had been done by our God.
translation:
  language: ru
  text: И когда все наши враги услышали об этом и все окрестные народы увидели это, они сильно упали в собственных глазах[a] и поняли, что это дело было совершено нашим Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они сильно пали духом»; «они сильно утратили уверенность в себе». Буквально еврейское выражение сохраняет образ того, как они «упали в собственных глазах».'
    reason: Лексически трудная идиома допускает как образную, так и смысловую передачу.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: И когда
  rationale: Естественно передаёт повествовательный переход и временную связь; отдельное «и было» в современном русском звучало бы излишне архаично.
- source_word: שָׁמְעוּ ... וַיִּרְאוּ
  choice: услышали об этом ... увидели это
  rationale: В еврейском тексте дополнения подразумеваются из контекста — речь идёт о завершении стены. В русском они выражены местоименно ради естественности, без добавления нового содержания.
- source_word: כָּל אֹיְבֵינוּ
  choice: все наши враги
  rationale: Прямое и естественное соответствие еврейскому словосочетанию.
- source_word: כָּל הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: все окрестные народы
  rationale: גּוֹיִם здесь обозначает окружающие народы, а не несёт более позднего специального смысла слова «язычники».
- source_word: וַיִּפְּלוּ מְאֹד בְּעֵינֵיהֶם
  choice: они очень упали в собственных глазах
  rationale: Сохранён выразительный еврейский образ падения в собственной оценке; его идиоматический смысл пояснён в сноске.
- source_word: וַיֵּדְעוּ
  choice: и поняли
  rationale: В данном контексте речь идёт об осознании и признании причины произошедшего; «поняли» естественнее русского «узнали» и не ослабляет смысл.
- source_word: מֵאֵת אֱלֹהֵינוּ
  choice: нашим Богом
  rationale: Передаёт Бога как источник и решающего деятеля, стоящего за завершением работы.
- source_word: נֶעֶשְׂתָה הַמְּלָאכָה הַזֹּאת
  choice: это дело было совершено
  rationale: Пассивная конструкция отражает форму еврейского глагола, а «дело» уместно обозначает весь труд по восстановлению стены.
theological_decisions:
- issue: Божественное действие в завершении работы
  choice: это дело было совершено нашим Богом
  alternative: это дело совершилось от нашего Бога / это дело было совершено благодаря нашему Богу
  rationale: Основной вариант ясно передаёт признание окружающими народами того, что завершение дела следует приписать Богу, не уточняя способ Его действия и не отрицая человеческого труда.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Архаическая формула «и было» опущена ради естественного повествования; необычный образ исходного текста сохранён и пояснён.
