base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/002.yaml
  text: So Sanballat and Geshem sent to me[a], saying, “Come[b], and let us meet together in the villages in the plain of Ono.” But they were planning to do me harm.
translation:
  language: ru
  text: 'И Санаваллат и Гешем послали мне сказать: «Приходи, давай встретимся в селениях[a] на равнине Оно[b]». Но они замышляли навредить мне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «в Кефириме», если понимать древнееврейское слово как название места, а не как «в селениях».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в долине Оно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послали ко мне сказать
  rationale: Единственное число глагола при составном подлежащем допустимо в древнееврейском повествовании; по-русски естественно согласование во множественном числе. Сочетание с «сказать» сохраняет ввод прямой речи без добавления подразумеваемого слова «весть».
- source_word: סַנְבַלַּט וְגֶשֶׁם
  choice: Санаваллат и Гешем
  rationale: Имена переданы в традиционной русской библейской форме.
- source_word: לְכָה
  choice: Приходи
  rationale: Хотя основное значение глагола связано с движением, в приглашении повелительная форма естественно передаётся русским «приходи».
- source_word: וְנִוָּעֲדָה יַחְדָּו
  choice: встретимся вместе
  rationale: Форма глагола выражает встречу по договорённости, а «вместе» передаёт יַחְדָּו; лёгкая избыточность соответствует настойчивой формулировке приглашения.
- source_word: בַּכְּפִירִים
  choice: в селениях
  rationale: Форма понята как нарицательное существительное во множественном числе — «селения, деревни». Возможное понимание как географического названия сохранено в сноске.
- source_word: בְּבִקְעַת אוֹנוֹ
  choice: на равнине Оно
  rationale: בִּקְעָה обозначает широкую долину или равнину; «равнина» естественно передаёт топографический смысл, а вариант «долина» отмечен в сноске.
- source_word: וְהֵמָּה חֹשְׁבִים
  choice: Но они замышляли
  rationale: Союз передан противительным «но», поскольку намерение противостоит внешне мирному приглашению. «Замышляли» выражает целенаправленный злой умысел, а не просто размышление.
- source_word: לַעֲשׂוֹת לִי רָעָה
  choice: причинить мне зло
  rationale: Формулировка сохраняет широкое значение רָעָה и не уточняет, какой именно вред они намеревались причинить.
