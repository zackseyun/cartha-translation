base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/005.yaml
  text: Then Sanballat sent his servant to me a fifth time in this manner[a], with an open letter in his hand.
translation:
  language: ru
  text: Тогда Санаваллат в пятый раз, как и прежде, послал ко мне своего слугу; в руке у него было открытое письмо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «незапечатанное письмо».'
    reason: 'Лексическая альтернатива: פְּתוּחָה буквально означает «открытое» и применительно к письму может подчёркивать, что оно не было запечатано.'
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Тогда ... послал
  rationale: Форма с повествовательным waw продвигает рассказ; «тогда» естественно передаёт последовательность событий.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом указывает направление и здесь обозначает адресата посланника.
- source_word: סַנְבַלַּט
  choice: Санаваллат
  rationale: Устоявшаяся русская библейская передача личного имени.
- source_word: כַּדָּבָר הַזֶּה
  choice: с теми же словами
  rationale: Оборот отсылает к повторявшемуся прежде сообщению; такое выражение естественно передаёт анафорический смысл в данном контексте.
- source_word: פַּעַם חֲמִישִׁית
  choice: в пятый раз
  rationale: Естественная русская передача счёта повторений.
- source_word: אֶת נַעֲרוֹ
  choice: своего слугу
  rationale: נַעַר может означать молодого человека, но в контексте исполнения поручения обозначает слугу или сопровождающего.
- source_word: וְאִגֶּרֶת פְּתוּחָה
  choice: открытое письмо
  rationale: Прилагательное указывает, что письмо было открытым, то есть не запечатанным; синтаксис описывает письмо, которое нёс слуга.
- source_word: בְּיָדוֹ
  choice: в руке у него
  rationale: Сохраняется конкретный образ физически несомого письма, а местоимение однозначно отнесено к слуге.
