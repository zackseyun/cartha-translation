  text: וָ/אֹמְרָ֗/ה הַ/אִ֤ישׁ כָּמ֨וֹ/נִי֙ יִבְרָ֔ח וּ/מִ֥י כָמ֛וֹ/נִי אֲשֶׁר יָב֥וֹא אֶל הַ/הֵיכָ֖ל וָ/חָ֑י לֹ֖א אָבֽוֹא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/011.yaml
  text: But I said[a], “Should a man like me flee? And who is like me, who could go into the temple and live? I will not go in.”
translation:
  language: ru
  text: 'Но я сказал: «Разве такой человек, как я, станет бежать? Кто, подобно мне, мог бы войти в храм[a] и остаться в живых? Не войду!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в святилище». Вероятно, речь не просто об укрытии в храмовом здании, а о входе в храмовую область, который для Неемии был бы неправомерным; этим объясняется сила слов «и остаться в живых».'
    reason: Лексический вариант и осторожное пояснение вероятного культового ограничения без излишней локализации храмовой зоны.
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: Но я сказал
  rationale: 'Последовательная форма продолжает повествование, а союз «но» естественно передаёт контекстуальное противопоставление: Неемия отвергает только что сделанное предложение.'
- source_word: הָאִישׁ כָּמוֹנִי
  choice: такой человек, как я
  rationale: Сочетание употреблено обобщённо и подчёркивает положение, ответственность и достоинство Неемии, не называя какого-либо конкретного человека.
- source_word: יִבְרָח
  choice: станет бежать
  rationale: Глагол означает бегство перед опасностью; выражение сохраняет риторическую и нравственную силу отказа Неемии.
- source_word: וּמִי כָמוֹנִי
  choice: И кто, подобный мне
  rationale: Сохраняет параллелизм и повторное акцентированное указание Неемии на своё положение.
- source_word: אֲשֶׁר יָבוֹא
  choice: войдёт
  rationale: Относительная конструкция в еврейском эллиптична; в русском риторический вопрос естественно передаётся личной формой будущего времени.
- source_word: הַהֵיכָל
  choice: святилище
  rationale: В данном контексте слово обозначает внутреннюю храмовую область, вход в которую для Неемии был бы неправомерным; «святилище» точнее, чем общее «храм», передаёт локальный смысл.
- source_word: וָחָי
  choice: и останется в живых
  rationale: Передаёт буквальную идею жизни или сохранения жизни, не устраняя возможной связи с наказанием за неправомерный вход.
- source_word: לֹא אָבוֹא
  choice: Не войду
  rationale: Кратко и выразительно повторяет идею входа из предыдущей части стиха и сохраняет решительность оригинала.
theological_decisions:
- issue: Смысл входа в הַהֵיכָל
  choice: Неемия отказывается войти во внутреннюю храмовую область, поскольку для него это было бы неправомерно, а не просто отвергает удобное укрытие.
  alternative: Неемия лишь отказывается прятаться в храмовом здании без подразумеваемого культового нарушения.
  rationale: Контекст Неемии 6:10–13 связывает предложение с попыткой ввести Неемию в грех и опорочить его. Основной текст сохраняет лаконичность и напряжение оригинала, а примечание поясняет вероятный культовый смысл, не превращая его в добавленное утверждение.
- issue: Значение וָחָי
  choice: Сохранена двусмысленность между спасением от непосредственной угрозы и выживанием после неправомерного входа.
  alternative: Понимать выражение исключительно как «чтобы спасти свою жизнь».
  rationale: Еврейское «и жил» допускает обе смысловые связи; перевод «останется в живых» не разрешает эту напряжённость однозначно.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной риторикой. «Такой человек, как я» естественно передаёт самоотнесение Неемии, а краткое «Не войду!» сохраняет решительность заключительной реплики.
