  source_fidelity: Основной смысл передан, однако «святилище» в русском обычно обозначает весь сакральный храмовый комплекс либо абстрактно священное место и не столь ясно передаёт הֵיכָל как храмовое здание/храмовый зал. Примечание чрезмерно конкретизирует «внутреннюю часть», тогда как הֵיכָל не требует такого уточнения; оно может создавать неверное представление о точной зоне входа.
