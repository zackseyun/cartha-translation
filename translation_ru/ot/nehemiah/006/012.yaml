  text: Then I recognized, and behold, God had not sent him; rather, he had spoken the prophecy against me because Tobiah and Sanballat had hired him.
translation:
  language: ru
  text: Я понял, что Бог не посылал его; напротив, он пророчествовал против меня, потому что Товия и Санаваллат наняли его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַכִּירָה
  choice: И я понял
  rationale: Форма выражает осознание или распознавание; «понял» естественно передаёт результат распознания в данном контексте.
- source_word: וְהִנֵּה
  choice: вот
  rationale: Сохранён дискурсивный указатель, подчёркивающий внезапно открывшийся Неемии факт.
- source_word: הַנְּבוּאָה דִּבֶּר עָלַי
  choice: он произнёс это пророчество против меня
  rationale: Сохраняются существительное «пророчество» и направленность עַל в враждебном контексте; указательное «это» естественно отсылает к предшествующим словам Шемаии.
- source_word: שְׂכָרוֹ
  choice: наняли его
  rationale: Точно передаёт значение найма за плату и множественное число подлежащих — Товии и Санаваллата.
theological_decisions:
- issue: Источник пророческой речи Шемаии
  choice: не Бог послал его
  alternative: Бог не посылал его
  rationale: Сохранено прямое отрицание божественного посланничества без дополнительного объяснения природы ложного пророчества.
- issue: Связь между ложной речью и наймом
  choice: но он произнёс это пророчество против меня, потому что Товия и Санаваллат наняли его
  alternative: а пророчествовал он против меня потому, что Товия и Санаваллат подкупили его
  rationale: Перевод сохраняет причинную связь и лексику пророчества, не усиливая «наняли» до более узкого «подкупили».
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис близок к еврейскому, но читается естественно; имена переданы в традиционной русской библейской форме.
