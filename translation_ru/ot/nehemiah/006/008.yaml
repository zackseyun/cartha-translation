  text: וָ/אֶשְׁלְחָ֤/ה אֵלָי/ו֙ לֵ/אמֹ֔ר לֹ֤א נִֽהְיָה֙ כַּ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֖ר אַתָּ֣ה אוֹמֵ֑ר כִּ֥י מִֽ/לִּבְּ/ךָ֖ אַתָּ֥ה בוֹדָֽא/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/008.yaml
  text: So I sent to him[a], saying, “These things that you are saying have not happened, for you are inventing them out of your own heart.”
translation:
  language: ru
  text: 'И я послал ему ответ: «Ничего подобного тому, о чём ты говоришь, не было; ведь ты сам всё это выдумываешь[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ты выдумываешь их из своего сердца».'
    reason: Сноска сохраняет древнееврейский образ сердца как средоточия мысли и намерения, который при буквальном воспроизведении в основном русском тексте звучал бы неестественно.
lexical_decisions:
- source_word: וָאֶשְׁלְחָה אֵלָיו לֵאמֹר
  choice: И я послал ему сказать
  rationale: Последовательная глагольная форма вводит следующее действие рассказа; русская конструкция естественно передаёт и последовательность, и формулу введения прямой речи.
- source_word: לֹא נִהְיָה כַּדְּבָרִים הָאֵלֶּה
  choice: Ничего из того … не было
  rationale: היה здесь отрицает действительность сообщаемого, а דבר обозначает дело или содержание утверждения. Такая формулировка ясно передаёт отрицание обвинений.
- source_word: אֲשֶׁר אַתָּה אוֹמֵר
  choice: о чём ты говоришь
  rationale: Причастие אוֹמֵר выражает продолжающееся утверждение; настоящее время сохраняет этот оттенок.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание для отрицания; «ведь» естественно звучит в прямом опровержении.
- source_word: מִלִּבְּךָ אַתָּה בּוֹדָאם
  choice: ты сам всё это выдумываешь
  rationale: בדא означает измышлять или фабриковать. «Сам» передаёт происхождение обвинений от говорящего, а местоименный суффикс множественного числа естественно выражен сочетанием «всё это»; буквальный образ сердца сохранён в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством прямого официального ответа; без архаизмов и разговорных оборотов. Образ «сердца» вынесен в сноску ради естественности основной фразы.
