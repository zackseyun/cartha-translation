  naturalness: Основной текст литературен, но «послал ему сказать» двусмысленно и стилистически менее естественно. «Ничего подобного тому, о чём ты говоришь, не было» ясно передаёт отрицательную еврейскую конструкцию и звучит по-русски плавно.
  terminology: «Выдумываешь» — удачный современный эквивалент בּוֹדָאם. Сноска обоснованно сохраняет образ «сердца» как источника замысла; она должна быть привязана к глаголу «выдумываешь».
