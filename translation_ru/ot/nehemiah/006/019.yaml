base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/019.yaml
  text: Also they kept speaking of his good deeds in my presence[a], and they kept reporting my words to him[b]. Tobiah sent letters to frighten me.
translation:
  language: ru
  text: И ещё они говорили при мне о его достоинствах[a] и передавали ему мои слова[b]. Товия посылал письма, чтобы запугать меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорили при мне о его добрых делах» или «о его положительных качествах». Еврейское выражение может обозначать как хорошие поступки, так и достоинства Товии.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «выносили мои слова к нему», то есть передавали Товии слова Неемии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: И ещё
  rationale: Передаёт добавочное значение частицы и естественно связывает стих с предыдущим повествованием.
- source_word: טוֹבֹתָיו
  choice: расхваливали его
  rationale: Субстантивированное множественное число от «добрый, хороший» обозначает хорошие дела, достоинства или положительные стороны Товии; глагольная передача естественно выражает в данном контексте его похвальную характеристику.
- source_word: הָיוּ אֹמְרִים
  choice: постоянно расхваливали
  rationale: Сочетание היה с причастием указывает на продолжавшееся или повторявшееся действие.
- source_word: לְפָנַי
  choice: передо мной
  rationale: Прямая и естественная передача пространственно-реляционного выражения «перед моим лицом», здесь — в присутствии Неемии.
- source_word: וּדְבָרַי
  choice: а мои слова
  rationale: Сохраняет прямое значение דָּבָר; контекст показывает, что речь идёт о сказанном Неемией.
- source_word: הָיוּ מוֹצִיאִים לוֹ
  choice: передавали ему
  rationale: Буквально «выносили ему»; в контексте это идиома передачи или сообщения чужих слов.
- source_word: אִגְּרוֹת שָׁלַח
  choice: посылал письма
  rationale: Естественная русская передача корреспонденции; несовершенный вид согласован с описанием повторяющихся действий в контексте.
- source_word: לְיָרְאֵנִי
  choice: чтобы запугать меня
  rationale: Передаёт целевое значение לְ и намерение вызвать страх; «запугать» уместно для целенаправленного устрашения письмами.
