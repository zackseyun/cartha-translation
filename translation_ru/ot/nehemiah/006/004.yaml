- source_word: וַיִּשְׁלְחוּ אֵלַי
  choice: они посылали ко мне
  rationale: Глагол שלח передан прямо, без добавления не выраженного в еврейском тексте объекта — «вестников» или «сообщение»; אֵלַי означает «ко мне».
- source_word: כַּדָּבָר הַזֶּה
  choice: с теми же словами
  rationale: 'Буквально: «согласно этому слову/делу». В первой части фраза указывает на повторение прежнего обращения; «с теми же словами» естественно передаёт коммуникативный контекст, не уточняя форму послания.'
- source_word: אַרְבַּע פְּעָמִים
  choice: четыре раза
  rationale: Прямой и естественный эквивалент выражения, обозначающего четыре повторных случая.
- source_word: וָאָשִׁיב אוֹתָם
  choice: и я отвечал им
  rationale: В контексте переписки каузативная форма שוב означает возвращение ответа; местоимение естественно передаётся русским дательным при глаголе «отвечать».
- source_word: כַּדָּבָר הַזֶּה
  choice: так же
  rationale: Повтор той же еврейской фразы указывает на неизменность ответа Неемии. Русское «так же» сохраняет смысл, избегая тяжеловесного буквального повтора.
