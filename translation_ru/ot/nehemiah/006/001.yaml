  text: וַ/יְהִ֣י כַ/אֲשֶׁ֣ר נִשְׁמַ֣ע לְ/סַנְבַלַּ֣ט וְ֠/טוֹבִיָּה וּ/לְ/גֶ֨שֶׁם הָֽ/עַרְבִ֜י וּ/לְ/יֶ֣תֶר אֹֽיְבֵ֗י/נוּ כִּ֤י בָנִ֨יתִי֙ אֶת הַ֣/חוֹמָ֔ה וְ/לֹא נ֥וֹתַר בָּ֖/הּ פָּ֑רֶץ גַּ֚ם עַד הָ/עֵ֣ת הַ/הִ֔יא דְּלָת֖וֹת לֹא הֶעֱמַ֥דְתִּי בַ/שְּׁעָרִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/001.yaml
  text: When Sanballat[a], Tobiah, Geshem the Arab[b], and the rest of our enemies heard that I had rebuilt the wall and that no breach was left in it—though up to that time I had not set up the doors in the gates—
translation:
  language: ru
  text: Когда Санаваллат, Товия, Гешем Аравитянин[b] и остальные наши враги услышали, что я восстановил стену[a] и в ней не осталось ни одного пролома, хотя до того времени я ещё не установил двери в воротах, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «построил стену». Здесь речь идёт о восстановлении ранее существовавшей стены.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «араб Гешем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Когда
  rationale: Оборот вводит новое событие повествования; простое «когда» естественно передаёт временную связь без добавления отсутствующего в еврейском тексте наречия «теперь».
- source_word: נִשְׁמַע לְסַנְבַלַּט ...
  choice: Санаваллат ... услышали
  rationale: Нифаль допускает безличное «стало известно», но по-русски здесь естественно назвать перечисленных лиц подлежащим глагола «услышали».
- source_word: סַנְבַלַּט ... טוֹבִיָּה ... גֶשֶׁם הָעַרְבִי
  choice: Санаваллат, Товия, араб Гешем
  rationale: Имена переданы принятой русской библейской транслитерацией; הָעַרְבִי непосредственно обозначает этническую принадлежность Гешема.
- source_word: יֶתֶר אֹיְבֵינוּ
  choice: остальные наши враги
  rationale: Передаёт значение «остаток, прочие» и естественно звучит в современном русском повествовании.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание услышанного, а не причину.
- source_word: בָנִיתִי אֶת־הַחוֹמָה
  choice: я восстановил стену
  rationale: Сам глагол означает «строить», однако контекст описывает восстановление существовавшей стены Иерусалима; буквальная возможность сохранена в сноске.
- source_word: לֹא נוֹתַר בָּהּ פָּרֶץ
  choice: в ней не осталось ни одного пролома
  rationale: Пֶּרֶץ в контексте стены означает пролом или брешь; конструкция с «ни одного» ясно передаёт полное отсутствие проломов.
- source_word: גַּם עַד הָעֵת הַהִיא
  choice: хотя до того времени ... ещё
  rationale: 'Контекстуально оборот вводит уступительное уточнение: стена была завершена, но двери пока не установлены.'
- source_word: דְּלָתוֹת לֹא הֶעֱמַדְתִּי בַשְּׁעָרִים
  choice: я ещё не установил двери в воротах
  rationale: Сохранено различие между дверями и воротами как сооружениями; каузатив глагола עמד здесь означает установку на место.
