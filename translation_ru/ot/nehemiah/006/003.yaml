  text: וָ/אֶשְׁלְחָ֨/ה עֲלֵי/הֶ֤ם מַלְאָכִים֙ לֵ/אמֹ֔ר מְלָאכָ֤ה גְדוֹלָה֙ אֲנִ֣י עֹשֶׂ֔ה וְ/לֹ֥א אוּכַ֖ל לָ/רֶ֑דֶת לָ֣/מָּה תִשְׁבַּ֤ת הַ/מְּלָאכָה֙ כַּ/אֲשֶׁ֣ר אַרְפֶּ֔/הָ וְ/יָרַדְתִּ֖י אֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/003.yaml
  text: So I sent messengers to them[a], saying, “I am doing a great work, and I cannot come down. Why should the work stop while I leave it and come down to you?”
translation:
  language: ru
  text: 'Тогда я послал к ним вестников сказать: «Я занят важным делом и не могу спуститься. Почему работа должна остановиться, если я оставлю её и спущусь к вам?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему работа должна прекратиться, когда я оставлю её и спущусь к вам?»'
    reason: Глагол שׁבת может передаваться как «остановиться» или «прекратиться», а כַּאֲשֶׁר допускает временное «когда» наряду с контекстуальным «если».
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: Тогда я послал
  rationale: Последовательная глагольная форма обозначает следующий шаг повествования; «тогда» естественно передаёт эту связь в современном русском.
- source_word: עֲלֵיהֶם
  choice: к ним
  rationale: При глаголе «посылать» и существительном «вестники» предлог указывает направление к адресатам, а не враждебное действие против них.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В политическом контексте речь идёт о людях, передающих сообщение; «вестники» точно и ясно передаёт этот смысл.
- source_word: מְלָאכָה גְדוֹלָה
  choice: великим делом
  rationale: Сохраняет значение работы или задачи и подчёркивает её масштаб и значимость, не сводя выражение только к строительному проекту.
- source_word: אֲנִי עֹשֶׂה
  choice: я занят
  rationale: Местоимение с причастием обозначает продолжающееся действие; русское «занят … делом» естественно выражает текущую деятельность.
- source_word: וְלֹא אוּכַל לָרֶדֶת
  choice: и не могу спуститься
  rationale: Сохраняет буквальный пространственный образ движения вниз из Иерусалима и значение невозможности оставить работу.
- source_word: לָמָּה תִשְׁבַּת הַמְּלָאכָה
  choice: Зачем останавливаться работе
  rationale: Глагол שׁבת здесь означает прекращение деятельности. Такая конструкция сохраняет риторический характер вопроса и звучит естественно по-русски.
- source_word: אַרְפֶּהָ
  choice: я оставлю её
  rationale: Форма от רפה означает ослабить усилие, выпустить из рук или оставить; местоименный суффикс женского рода отсылает к работе. В основном тексте выбран ясный контекстуальный эквивалент.
- source_word: וְיָרַדְתִּי אֲלֵיכֶם
  choice: и спущусь к вам
  rationale: Повторяется пространственное движение вниз; «к вам» сохраняет обращение к получателям сообщения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Синтаксис прямой речи остаётся ясным и разговорно естественным, без искусственной архаизации; пространственный образ «спуститься» сохранён.
