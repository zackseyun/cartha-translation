lexical_decisions:
- source_word: וַתִּשְׁלַם
  choice: была завершена
  rationale: Форма qal от שלם при подлежащем женского рода הַחוֹמָה обозначает достижение завершённого состояния. Русская пассивная конструкция естественно передаёт событийный смысл и сохраняет стену в роли подлежащего.
- source_word: הַחוֹמָה
  choice: стена
  rationale: Определённое существительное указывает на ранее упомянутую стену Иерусалима; в русском контексте определённость передаётся без артикля.
- source_word: בְּעֶשְׂרִים וַחֲמִשָּׁה לֶאֱלוּל
  choice: в двадцать пятый день месяца элула
  rationale: Предлог ב с числительным образует обозначение даты. Слова «день месяца» добавлены для естественности и ясности по-русски, а название месяца передано транслитерацией.
- source_word: לַחֲמִשִּׁים וּשְׁנַיִם יוֹם
  choice: за пятьдесят два дня
  rationale: Предлог ל здесь выражает длительность, за которую работа была доведена до конца. Русское «за» ясно передаёт срок выполнения, не превращая выражение в простое указание на последующее событие.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза с достоинством библейского регистра. «Итак» передаёт итоговый характер wayyiqtol в данном контексте. Тире подчёркивает итоговую продолжительность строительства без добавления нового смысла.
