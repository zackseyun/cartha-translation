base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/007.yaml
  text: And you have even appointed prophets to proclaim concerning you in Jerusalem[a], saying, ‘There is a king in Judah!’ And now these reports will be heard by the king. So now, come[b], and let us consult together.
translation:
  language: ru
  text: 'Ты даже назначил пророков, чтобы они провозглашали о тебе в Иерусалиме: «В Иудее — царь!»[b] А теперь царь услышит такие вести.[a] А теперь приходи, и давай посоветуемся вместе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «такие слова», «такие дела» либо «об этом». Древнееврейское слово может широко обозначать слова, обстоятельства, дела или сообщения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «царь в Иудее». Это краткое древнееврейское возглашение подразумевает притязание на царскую власть, но в самой цитате Неемия прямо не назван.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: Ты даже
  rationale: Сочетание союза с усилительной частицей передано словом «даже», соответствующим обвинительному тону письма; союз естественно опущен в начале русского предложения.
- source_word: נְבִיאִים
  choice: пророков
  rationale: У слова обычное значение «пророки»; контекст не даёт основания ослаблять его до «вестников» или «глашатаев».
- source_word: הֶעֱמַדְתָּ
  choice: назначил
  rationale: Каузативная форма обозначает поставление людей на определённое служение; «назначил» естественно выражает это по-русски.
- source_word: לִקְרֹא עָלֶיךָ
  choice: чтобы они провозглашали о тебе
  rationale: Сочетание קרא с על означает публично возвещать о ком-либо; перевод сохраняет объект обвинения, не уточняя содержание сверх текста.
- source_word: מֶלֶךְ בִּיהוּדָה
  choice: В Иудее — царь!
  rationale: Краткая безглагольная фраза сохранена как отрывистое публичное возглашение, без добавления имени Неемии или местоимения «ты».
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: такие вести
  rationale: דברים может обозначать слова, дела, сведения или сообщения; в политическом контексте «вести» естественно передаёт слух, который может дойти до царя, а сноска сохраняет широту выражения.
- source_word: וְנִוָּעֲצָה יַחְדָּו
  choice: и посоветуемся вместе
  rationale: Взаимно-волевая форма выражает предложение совместно обсудить дело; «посоветуемся вместе» понятно и сохраняет оттенок совместного совещания.
theological_decisions:
- issue: Характер обвинения в притязании на царскую власть
  choice: Сохранить безглагольное возглашение «В Иудее — царь!», не вставляя имя Неемии.
  alternative: «Ты — царь в Иудее!» или «Неемия — царь в Иудее!»
  rationale: Из контекста ясно, что обвинение направлено против Неемии, однако в самих цитируемых словах древнееврейского текста он прямо не назван. Перевод сохраняет силу обвинения и исходную недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством официального обвинения. Синтаксис сделан естественным для широкого читателя, при этом сохранены отрывистость возглашения о царе и неоднозначность слова דברים.
