  rationale: Исправление явно передаёт מִן־הַמְּלָאכָה как оставление работы, сохраняя естественную русскую идиому «опустятся руки». «Не будет выполнена» ближе к широкому значению וְלֹא תֵעָשֶׂה, чем «не будет завершена». Сноски сохранены с уточнением, согласованным с основным текстом.
