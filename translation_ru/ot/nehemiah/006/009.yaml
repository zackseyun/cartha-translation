  text: כִּ֣י כֻלָּ֗/ם מְיָֽרְאִ֤ים אוֹתָ֨/נוּ֙ לֵ/אמֹ֔ר יִרְפּ֧וּ יְדֵי/הֶ֛ם מִן הַ/מְּלָאכָ֖ה וְ/לֹ֣א תֵעָשֶׂ֑ה וְ/עַתָּ֖ה חַזֵּ֥ק אֶת יָדָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/009.yaml
  text: For all of them were trying to frighten us[a], saying, “Their hands will grow weak from the work, and it will not be done.” But now[b], strengthen my hands.
translation:
  language: ru
  text: 'Ведь все они пытались запугать нас, говоря: «У них опустятся руки, они оставят работу, и она не будет выполнена». Но теперь укрепи мои руки.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְיָרְאִים אֹתָנוּ
  choice: пытались запугать нас
  rationale: Причастие в породе хифиль выражает продолжающееся действие, направленное на то, чтобы вызвать страх; местоимение в еврейском тексте стоит во множественном числе — «нас».
- source_word: לֵאמֹר
  choice: говоря
  rationale: Обычная вводная формула, передающая содержание намерения или высказывания противников.
- source_word: יִרְפּוּ יְדֵיהֶם
  choice: у них опустятся руки
  rationale: Естественная русская идиома сохраняет образ ослабевших рук и передаёт утрату сил и решимости.
- source_word: מִן־הַמְּלָאכָה
  choice: 'в контексте: руки опустятся и работа не будет завершена'
  rationale: Предлог указывает на отстранение от работы вследствие упадка сил; по-русски эта связь естественно раскрывается соседней фразой без тяжеловесного «руки ослабеют от работы».
- source_word: וְלֹא תֵעָשֶׂה
  choice: и работа не будет завершена
  rationale: Страдательная форма относится к строительным работам; «завершена» ясно передаёт контекстуальный смысл результата, не достигнутого из-за прекращения труда.
- source_word: וְעַתָּה
  choice: Но теперь
  rationale: Выражение отмечает резкий переход от замысла противников к краткой молитве Неемии.
- source_word: חַזֵּק אֶת־יָדָי
  choice: укрепи мои руки
  rationale: Сохранён буквальный образ, перекликающийся с желанием врагов ослабить руки работников; повелительная форма передаёт прямую просьбу.
theological_decisions:
- issue: Переход от повествования к прямой молитве
  choice: «Но теперь укрепи мои руки» — краткое обращение Неемии к Богу.
  alternative: 'Самоободрение или повествовательная форма: «теперь я укрепил свои руки».'
  rationale: Масоретская огласовка указывает на повелительную форму второго лица мужского рода единственного числа, поэтому естественнее понимать заключение как непосредственную молитву к Богу. Имя Бога не добавлено, поскольку в еврейском тексте оно здесь не названо.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно возвышенный. Идиома «опустятся руки» естественна для обычного читателя и сохраняет сквозной образ рук; в молитве этот образ передан буквально.
