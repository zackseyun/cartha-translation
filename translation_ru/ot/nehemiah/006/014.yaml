base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/014.yaml
  text: Remember Tobiah and Sanballat[a], my God, according to these deeds of theirs, and also Noadiah the prophetess and the rest of the prophets who were trying to make me afraid.
translation:
  language: ru
  text: Боже мой, вспомни Товию и Санаваллата по этим его делам, а также пророчицу Ноадию и остальных пророков, которые пытались устрашить меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые старались запугать меня».'
    reason: Лексическая альтернатива для каузативного значения מְיָרְאִים; вариант «запугать» сильнее подчёркивает давление и устрашение.
lexical_decisions:
- source_word: זָכְרָה אֱלֹהַי
  choice: Боже мой, вспомни
  rationale: Молитвенное обращение с повелительно-желательной формой передано прямо и естественно; звательный оборот «Боже мой» соответствует личному обращению.
- source_word: לְטוֹבִיָּה וּלְסַנְבַלַּט
  choice: Товию и Санаваллата
  rationale: Имена переданы в традиционной русской библейской форме; предлог ל после «вспомни» обозначает объект действия.
- source_word: כְּמַעֲשָׂיו אֵלֶּה
  choice: по этим их делам
  rationale: Предлог כְּ выражает соответствие или меру. Формулировка сохраняет просьбу вспомнить противников сообразно их поступкам, не добавляя прямо не выраженного указания на суд.
- source_word: לְנוֹעַדְיָה הַנְּבִיאָה
  choice: пророчицу Ноадию
  rationale: Форма הַנְּבִיאָה явно обозначает женщину-пророка; «пророчица» — естественное и точное русское соответствие.
- source_word: וּלְיֶתֶר הַנְּבִיאִים
  choice: и остальных пророков
  rationale: יֶתֶר обозначает оставшуюся часть группы; «остальных» звучит естественно в современном русском.
- source_word: אֲשֶׁר הָיוּ מְיָרְאִים אוֹתִי
  choice: которые пытались устрашить меня
  rationale: Конструкция с הָיוּ и причастием выражает продолжавшееся в прошлом действие, а каузативное значение связано с наведением страха. «Пытались устрашить» передаёт целенаправленность и не утверждает, что замысел удался.
theological_decisions:
- issue: Тон молитвы о Божьем воспоминании противников
  choice: Сохранена просьба вспомнить их по их делам без прямого добавления слов о наказании или суде.
  alternative: «Покарай их за эти дела» или «привлеки их к ответу»
  rationale: Еврейский текст имеет серьёзный имприкативный оттенок, но прямо говорит лишь «вспомни… по этим делам»; перевод не должен разворачивать подразумеваемое в явную судебную формулу.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Синтаксис сохранён компактным, а традиционные формы библейских имён использованы ради узнаваемости. Маркер сноски поставлен непосредственно после относящейся к нему фразы.
