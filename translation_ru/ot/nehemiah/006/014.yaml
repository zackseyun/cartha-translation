  terminology: Традиционные русские формы имён — Товия, Санаваллат и Ноадия — уместны. «Пророчица» точно передаёт הַנְּבִיאָה. «Устрашить» хорошо отражает каузативное значение глагола; сноска с вариантом «запугать» обоснована.
