  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/אֲנִי בָ֗אתִי בֵּ֣ית שְֽׁמַֽעְיָ֧ה בֶן דְּלָיָ֛ה בֶּן מְהֵֽיטַבְאֵ֖ל וְ/ה֣וּא עָצ֑וּר וַ/יֹּ֡אמֶר נִוָּעֵד֩ אֶל בֵּ֨ית הָ/אֱלֹהִ֜ים אֶל תּ֣וֹךְ הַֽ/הֵיכָ֗ל וְ/נִסְגְּרָה֙ דַּלְת֣וֹת הַ/הֵיכָ֔ל כִּ֚י בָּאִ֣ים לְ/הָרְגֶ֔/ךָ וְ/לַ֖יְלָה בָּאִ֥ים לְ/הָרְגֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/010.yaml
  text: Then I went to the house of Shemaiah son of Delaiah[a], son of Mehetabel, who was confined, and he said, “Let us meet at the house of God, inside the temple, and let us shut the doors of the temple, for they are coming to kill you—yes, at night they are coming to kill you.”
translation:
  language: ru
  text: 'И я пошёл в дом Шемаии, сына Делаи, сына Мехетавела; он был взаперти. И он сказал: «Давайте встретимся в доме Божьем, внутри храма[a], и запрём двери храма, потому что идут, чтобы убить тебя; ночью идут, чтобы убить тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внутри святилища». Еврейское слово может обозначать именно храмовое здание или святилище, а не весь храмовый комплекс.'
    reason: Лексическая альтернатива, значимая для понимания ограниченного доступа в священное пространство.
lexical_decisions:
- source_word: וַאֲנִי בָאתִי
  choice: И пошёл я
  rationale: Союз продолжает повествование, а отдельное местоимение слегка подчёркивает действующее лицо. «Пошёл» естественно передаёт בוא при движении к дому другого человека.
- source_word: בֵּית שְׁמַעְיָה
  choice: в дом Шемаии
  rationale: Конструкция обозначает жилище Шемаии; по-русски естественнее «дом Шемаии», чем буквальное «дом сына…».
- source_word: וְהוּא עָצוּר
  choice: Он находился в затворе
  rationale: עָצוּר допускает значения закрытости, стеснённости или удержания. «Находился в затворе» сохраняет неясность причины и характера его уединения, не утверждая ни ареста, ни обрядовой изоляции.
- source_word: נִוָּעֵד
  choice: Давай встретимся
  rationale: Форма выражает предложение совместного действия; единственное число «давай» естественно, поскольку Шемая обращается к Неемии.
- source_word: בֵּית הָאֱלֹהִים
  choice: в доме Божьем
  rationale: Сохраняет традиционный и понятный образ храма как дома Бога, одновременно отличая весь храмовый комплекс от более конкретного הֵיכָל.
- source_word: אֶל תּוֹךְ הַהֵיכָל
  choice: внутри храма
  rationale: Передаёт движение внутрь храмового здания, не уточняя сверх текста конкретную священную зону.
- source_word: וְנִסְגְּרָה דַּלְתוֹת הַהֵיכָל
  choice: и запрём двери храма
  rationale: Продолжает побудительное предложение и естественно передаёт идею закрытия дверей ради защиты.
- source_word: כִּי בָּאִים לְהָרְגֶךָ
  choice: потому что идут убить тебя
  rationale: Причастие передаёт приближающуюся угрозу, а неопределённый субъект естественно остаётся невыраженным в русском.
- source_word: וְלַיְלָה בָּאִים לְהָרְגֶךָ
  choice: ночью идут убить тебя
  rationale: Сохранены повтор и указание на ночь, создающие настойчивость и ощущение непосредственной угрозы; не добавлено более узкое «сегодня ночью».
theological_decisions:
- issue: Значение הֵיכָל в контексте доступа в священное пространство
  choice: храм
  alternative: святилище
  rationale: Контекст следующего стиха указывает на запретное для Неемии священное пространство, однако само слово может обозначать храмовое здание или святилище. Основной текст сохраняет более широкое и понятное «храм», а сноска — существенную альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка возвышенный, но понятный; повтор угрозы сохранён. Имена переданы как Шемая, Делая и Мехетавел.
