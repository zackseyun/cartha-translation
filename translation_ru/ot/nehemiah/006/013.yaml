base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/006/013.yaml
  text: 'He was hired for this purpose: that I should become afraid and act that way and sin[a], so that they would have grounds for an evil report[b], in order that they might reproach me.'
translation:
  language: ru
  text: 'Для этого он был нанят: чтобы я испугался, поступил так и согрешил[a], чтобы это послужило им поводом для дурной молвы обо мне[b] и они могли поносить меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был подкуплен». Еврейское слово означает «нанят» или «оплачен»; значение подкупа подразумевается злым умыслом нанимателей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и это стало бы для них дурным именем». Вероятно, проступок Неемии дал бы его врагам повод для порочащей молвы о нём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שָׂכוּר הוּא
  choice: Для того он и был нанят
  rationale: Сохраняет целевое значение לְמַעַן, прямой смысл пассивного причастия שָׂכוּר («нанят») и эмфатическое הוּא; частица «и» естественно передаёт русское смысловое выделение.
- source_word: לְמַעַן אִירָא
  choice: чтобы я испугался
  rationale: Имперфект после לְמַעַן обозначает желаемый злоумышленниками результат — возникновение страха у Неемии.
- source_word: וְאֶעֱשֶׂה כֵן
  choice: поступил так
  rationale: Естественно и близко передаёт буквальное «сделал так», отсылая к предложенному в контексте действию.
- source_word: וְחָטָאתִי
  choice: и согрешил
  rationale: Передаёт грех как дальнейший задуманный результат поступка, не уточняя сверх текста природу греха.
- source_word: וְהָיָה לָהֶם לְשֵׁם רָע
  choice: а у них появился бы повод опорочить моё имя
  rationale: 'Еврейская конструкция буквально говорит, что это стало бы для них «дурным именем». Русская формулировка передаёт контекстуальный смысл: проступок дал бы врагам материал для очернения Неемии, при этом сохраняет образ имени.'
- source_word: יְחָרְפוּנִי
  choice: поносить меня
  rationale: «Поносить» точно выражает враждебное публичное злословие и бесчестье, обозначаемые חרף, и подходит достоинству библейского повествования.
theological_decisions:
- issue: Характер предполагаемого проступка Неемии
  choice: согрешил
  alternative: совершил святотатство / нарушил закон
  rationale: В стихе употреблено общее חטא; перевод не конкретизирует грех на основании контекста и тем самым не снимает имеющуюся в тексте неопределённость.
