source:
  edition: WLC
  text: וַ/יִּפָּקְד֣וּ בַ/יּוֹם֩ הַ/ה֨וּא אֲנָשִׁ֜ים עַל הַ/נְּשָׁכ֗וֹת לָ/א֨וֹצָר֥וֹת לַ/תְּרוּמוֹת֮ לָ/רֵאשִׁ֣ית וְ/לַ/מַּֽעַשְׂרוֹת֒ לִ/כְנ֨וֹס בָּ/הֶ֜ם לִ/שְׂדֵ֤י הֶ/עָרִים֙ מְנָא֣וֹת הַ/תּוֹרָ֔ה לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם כִּ֚י שִׂמְחַ֣ת יְהוּדָ֔ה עַל הַ/כֹּהֲנִ֥ים וְ/עַל הַ/לְוִיִּ֖ם הָ/עֹמְדִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/044.yaml
  text: On that day men were appointed over the storerooms for the contributions[a], for the firstfruits, and for the tithes, to gather into them from the fields of the cities the portions required by the law for the priests and for the Levites[c][b], for Judah rejoiced over the priests and over the Levites who were serving.
translation:
  language: ru
  text: В тот день поставили людей заведовать кладовыми для приношений[a], начатков и десятин, чтобы собирать в них с полей, принадлежавших городам, доли, предписанные Законом для священников и левитов[b], потому что Иудея радовалась священникам и левитам, несшим служение[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать также «отделённые дары» или «взносы».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «доли Закона», то есть доли, установленные Торой для священников и левитов.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «стоявшим»; в храмовом контексте — стоявшим при исполнении обязанностей, то есть служившим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפָּקְדוּ
  choice: поставили
  rationale: 'Передаёт пассивно-административный смысл: людей официально назначили ответственными за кладовые.'
- source_word: אֲנָשִׁים
  choice: людей
  rationale: В современном русском это естественное обозначение назначенных лиц; контекст не требует подчёркивать их пол словом «мужчин».
- source_word: הַנְּשָׁכוֹת לָאֹצָרוֹת
  choice: кладовыми
  rationale: Сочетание обозначает помещения, служившие хранилищами; единое слово естественно передаёт конструкцию и не создаёт ошибочного перечня отдельных сокровищниц.
- source_word: לַתְּרוּמוֹת
  choice: для приношений
  rationale: «Приношения» сохраняет сакральный характер отделяемых даров и остаётся понятным современному читателю.
- source_word: לָרֵאשִׁית
  choice: начатков
  rationale: Традиционный и точный библейский термин для первой части урожая, посвящаемой Богу.
- source_word: וְלַמַּעַשְׂרוֹת
  choice: и десятин
  rationale: Прямой и общепринятый эквивалент культового термина.
- source_word: לִכְנוֹס בָּהֶם
  choice: чтобы собирать в них
  rationale: Сохраняет целевое значение инфинитива и направленность сбора в кладовые.
- source_word: לִשְׂדֵי הֶעָרִים
  choice: с полей, принадлежавших городам
  rationale: 'Уточняет естественный смысл: речь идёт о сельскохозяйственных угодьях, относившихся к городам, а не о полях внутри городской застройки.'
- source_word: מְנָאוֹת הַתּוֹרָה
  choice: доли, предписанные Законом
  rationale: Передаёт буквальное «доли Закона» как установленные Торой доли, сохраняя нормативный смысл.
- source_word: כִּי שִׂמְחַת יְהוּדָה
  choice: потому что Иудея радовалась
  rationale: Естественно вербализует именную конструкцию «радость Иуды» и понимает Иудею как общину/народ страны.
- source_word: הָעֹמְדִים
  choice: несшим служение
  rationale: Буквально «стоящим»; в храмовом контексте стояние обозначает исполнение обязанностей, служение.
theological_decisions:
- issue: Значение הָעֹמְדִים в храмовом контексте
  choice: несшим служение
  alternative: стоявшим
  rationale: Функциональное значение соответствует храмовой службе, однако буквальный образ отмечен в сноске, чтобы не скрывать исходную формулировку.
- issue: Референт יְהוּדָה
  choice: Иудея
  alternative: Иуда
  rationale: Здесь имеется в виду иудейская община, а не патриарх; географически-общественное «Иудея» понятно по-русски и не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Термины «приношения», «начатки», «десятины», «священники» и «левиты» сохранены как точные и широко понятные; синтаксис упрощён без устранения причинной связи и храмово-административного контекста.
