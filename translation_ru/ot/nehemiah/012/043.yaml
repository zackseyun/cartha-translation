base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/043.yaml
  text: On that day they offered great sacrifices and rejoiced[a], because God had made them rejoice with great joy. Also the women and the children rejoiced[d][c][b], and the joy of Jerusalem was heard from far away.
translation:
  language: ru
  text: В тот день они принесли большие жертвы[a] и радовались, потому что Бог дал им великую радость[b]. Радовались и женщины[c], и дети, и ликование Иерусалима было слышно издалека[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «принесли в жертву большие жертвы»; возможный перевод: «совершили большие жертвоприношения».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «Бог сделал так, что они радовались великой радостью».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «жёны». Еврейское слово в зависимости от контекста может означать как женщин вообще, так и жён.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «с большого расстояния».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: принесли ... жертвы
  rationale: В культовом контексте זבח означает совершение или принесение жертв. Русское «принесли жертвы» естественно и точно передаёт действие без неуклюжего повтора «жертвовали жертвы».
- source_word: זְבָחִים גְּדוֹלִים
  choice: великие жертвы
  rationale: Формально сохраняет גְּדוֹלִים и не сужает его значение до количества или физического размера; выражение может указывать на размах и значительность жертвоприношения.
- source_word: וַיִּשְׂמָחוּ / שָׂמֵחוּ
  choice: радовались
  rationale: Повтор одного русского глагола сохраняет лексическую связность многократного употребления корня שׂמח.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину радости; это ясная причинная связь в современном русском языке.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: В повествовании речь идёт о Боге Израиля; определённый артикль отдельно по-русски не передаётся.
- source_word: שִׂמְּחָם שִׂמְחָה גְדוֹלָה
  choice: исполнил их великой радостью
  rationale: Передаёт прямое действие Бога и интенсивность родственной глагольно-именной конструкции естественным русским оборотом; буквальная структура разъяснена в сноске.
- source_word: וְגַם הַנָּשִׁים וְהַיְלָדִים
  choice: Радовались и женщины, и дети
  rationale: Конструкция «и ..., и ...» естественно передаёт добавочное и охватывающее значение וְגַם, явно включая обе группы.
- source_word: וַתִּשָּׁמַע
  choice: было слышно
  rationale: Безлично-пассивный русский оборот естественно передаёт нифаль «было услышано / слышалось», не добавляя модального значения возможности.
- source_word: שִׂמְחַת יְרוּשָׁלִַם
  choice: ликование Иерусалима
  rationale: «Ликование» в данном контексте естественнее воспринимается как слышимое выражение общей радости, при этом сохраняется связь с городом без уточнения, отсутствующего в еврейском тексте.
- source_word: מֵרָחוֹק
  choice: издалека
  rationale: Кратко и естественно передаёт пространственное значение сочетания מִן с רָחוֹק.
theological_decisions:
- issue: Источник и действенность радости
  choice: 'Бог представлен как непосредственный источник великой радости народа: «исполнил их великой радостью».'
  alternative: «Бог заставил их радоваться великой радостью» / «Бог дал им великую радость».
  rationale: Пиэль שִׂמְּחָם имеет каузативное значение. Выбранный оборот сохраняет божественную инициативу, но звучит естественнее буквальной кальки; буквальная форма отмечена в сноске.
- issue: Состав радующейся общины
  choice: Отдельно названы женщины и дети.
  alternative: «Жёны и дети».
  rationale: נָשִׁים может означать как женщин, так и жён. Без выраженного притяжательного отношения более широкое «женщины» не разрешает контекстуальную неоднозначность слишком узко; вариант указан в сноске.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного библейского стиля. Повтор корня радости частично сохранён через «радовались» и семантически поддержан словами «радостью» и «ликование»; буквальная каузативно-когнатная конструкция вынесена в сноску ради естественности основного текста.
