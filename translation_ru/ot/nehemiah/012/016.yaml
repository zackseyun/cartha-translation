  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перед названиями родов в еврейском тексте стоит предлог ל. В этом перечне он обозначает соотнесённость названного далее человека с соответствующим родом; поэтому переведено «из рода».
    reason: lexical_alternative
lexical_decisions:
- source_word: ל/עדיא
  choice: от Адаии
  rationale: Еврейский предлог ל в этом перечне обозначает принадлежность к священническому роду или его представительство. Русское «от Адаии» естественно передаёт краткую структуру списка. В WLC стоит имя עדיא, то есть Адаия, а не Иддо.
- source_word: זְכַרְיָה
  choice: Захария
  rationale: Общепринятая русская библейская форма личного имени; здесь Захария назван представителем рода Адаии.
- source_word: לְ/גִנְּתוֹן
  choice: от Гиннетона
  rationale: Как и в первой паре, ל связывает имя священнического рода с названным далее представителем; имя передано транслитерацией.
- source_word: מְשֻׁלָּם
  choice: Мешуллам
  rationale: Устоявшаяся русская передача личного имени; в краткой записи списка он соответствует роду Гиннетона.
