- source_word: לִֽ/ידַֽעְיָה
  choice: для Иедаии
  rationale: Предлог לְ обозначает соотнесённость с названным священническим домом; «для Иедаии» сохраняет краткую структуру перечня.
- source_word: עֻזִּי
  choice: Уззий
  rationale: Личное имя передано в традиционной русской библейской форме.
