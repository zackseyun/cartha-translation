  rationale: Как и в первой части стиха, לְ указывает на соответствующий священнический род; форма «от Амарии» сохраняет параллелизм и лаконичность перечня.
- source_word: יְהוֹחָנָן
  choice: Иехоханан
  rationale: Передана полная еврейская форма имени, включая начальный теофорный элемент יְהוֹ־; это отличает её от сокращённой формы Иоханан.
