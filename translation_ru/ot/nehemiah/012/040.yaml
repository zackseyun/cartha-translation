lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: заняли свои места
  rationale: Форма глагола עמד описывает остановку и расположение двух групп на отведённых местах; эта передача естественна для церемониального контекста и сохраняет смысл физического размещения.
- source_word: שְׁתֵּי הַתּוֹדֹת
  choice: оба хора благодарения
  rationale: Буквально выражение означает «два благодарения», но в данном контексте метонимически обозначает две организованные группы, участвующие в благодарственном шествии и пении. «Хоры благодарения» ясно передаёт их функцию; форма «оба» согласуется с мужским родом слова «хор».
- source_word: בְּבֵית הָאֱלֹהִים
  choice: в доме Бога
  rationale: Прямая передача устойчивого еврейского обозначения храма сохраняет исходный образ, а предлог «в» соответствует локативному בְּ.
- source_word: וַאֲנִי
  choice: я
  rationale: Местоимение вводит говорящего как участника второй из двух групп. В русском тире позволяет естественно обозначить состав хора без тяжеловесного буквального повторения союза.
- source_word: וַחֲצִי הַסְּגָנִים
  choice: и половина начальников
  rationale: סְגָנִים обозначает руководящих должностных лиц. «Начальники» — понятное современное слово, уместное в административном контексте книги Неемии.
- source_word: עִמִּי
  choice: со мной
  rationale: Естественная русская передача значения сопровождения или совместного пребывания.
