lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: и Азария
  rationale: Префиксальный союз וַ передан как «и», поскольку стих продолжает перечень участников шествия; личное имя עֲזַרְיָה передано в принятой русской библейской форме «Азария».
- source_word: עֶזְרָא
  choice: Ездра
  rationale: Личное имя передано в традиционной и узнаваемой русской библейской форме «Ездра». В еврейском тексте перед ним нет союза, что сохранено и в русском перечислении.
- source_word: וּ/מְשֻׁלָּם
  choice: и Мешуллам
  rationale: Префиксальный союз וּ передан как «и», отмечая последний элемент перечисления; имя מְשֻׁלָּם транслитерировано как «Мешуллам» в соответствии с еврейской формой.
