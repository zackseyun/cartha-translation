    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: шли
  rationale: Форма глагола הלך повествует о движении в прошлом. Русское «шли» естественно для описания шествия; множественное число согласовано с составным подлежащим, хотя в еврейском перед ним стоит обычная для такой конструкции форма единственного числа.
- source_word: אַחֲרֵיהֶם
  choice: за ними
  rationale: Предлог אַחֲרֵי с местоименным суффиксом обозначает следование позади других или вслед за ними. «За ними» ясно передаёт порядок участников шествия, не исключая значения последовательности.
- source_word: הוֹשַׁעְיָה
  choice: Ошая
  rationale: Личное имя передано русской транслитерацией, а не переведено по значению.
- source_word: וַחֲצִי
  choice: и половина
  rationale: Существительное חֲצִי означает «половина», а союз ו координирует Ошаю со второй группой.
- source_word: שָׂרֵי
  choice: начальников
  rationale: שַׂר может обозначать начальника, руководителя, сановника или князя. В административно-церемониальном контексте «начальники» передаёт руководящее положение, не создавая ложной ассоциации с сыновьями царя.
- source_word: יְהוּדָה
  choice: Иудеи
  rationale: Стандартная русская форма названия Иуда в значении области/народа здесь употреблена как «Иудея» в родительном падеже.
