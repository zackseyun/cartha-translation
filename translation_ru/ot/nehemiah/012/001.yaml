lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: Начальная конструкция вводит новый перечень; «вот» естественно передаёт указательное значение и связь с контекстом без добавления временного смысла.
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: священники и левиты
  rationale: Прямые и общепринятые соответствия для двух названных групп служителей.
- source_word: אֲשֶׁר עָלוּ
  choice: которые поднялись
  rationale: Сохраняется пространственный образ глагола עלה, обычный для возвращения в Иудею и Иерусалим, без пояснительного добавления отсутствующего в тексте места назначения.
- source_word: עִם
  choice: вместе с
  rationale: Естественно передаёт значение сопровождения.
- source_word: זְרֻבָּבֶל בֶּן שְׁאַלְתִּיאֵל
  choice: Зоровавелем, сыном Салафиила
  rationale: Использованы устоявшиеся русские формы библейских имён; падеж согласован с предлогом «с», родственная связь передана прямо.
- source_word: וְיֵשׁוּעַ
  choice: и Иешуа[a]
  rationale: Форма «Иешуа» непосредственно передаёт послепленную еврейскую форму имени יֵשׁוּעַ; сноска отмечает традиционный русский вариант.
- source_word: שְׂרָיָה יִרְמְיָה עֶזְרָא
  choice: Сераия, Иеремия, Ездра
  rationale: Устоявшиеся русские формы личных имён, оформленные как начало следующего за двоеточием перечня.
