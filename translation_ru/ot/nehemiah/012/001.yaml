translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис перечня сохранён; двоеточие ясно отделяет вводную формулу от имён. Форма «поднялись» сохраняет исходный образ восхождения, не заменяя его толкованием «возвратились».
