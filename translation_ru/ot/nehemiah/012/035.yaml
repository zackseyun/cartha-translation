base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/035.yaml
  text: 'and from the sons of the priests[a], with trumpets: Zechariah son of Jonathan, son of Shemaiah, son of Mattaniah, son of Micaiah, son of Zaccur, son of Asaph.'
translation:
  language: ru
  text: 'и из сыновей священников[a], с трубами: Захария, сын Ионафана, сына Шемаии, сына Маттании, сына Михаи, сына Заккура, сына Асафа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское «из сыновей священников» имеет партитивный смысл: речь идёт о представителях этой группы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: и некоторые из сыновей священников
  rationale: 'Предлог מִן при форме בְּנֵי имеет партитивный смысл: речь идёт о представителях более широкой группы. «Некоторые из» естественно передаёт этот смысл по-русски, а «сыновья священников» сохраняет выражение оригинала.'
- source_word: בַּחֲצֹצְרוֹת
  choice: с трубами
  rationale: Предлог בְּ употреблён инструментально; участники шествия несут или используют трубы. Краткое «с трубами» естественно в данном перечислении.
- source_word: זְכַרְיָה
  choice: Захария
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: בֶן
  choice: сын / сына
  rationale: Повторяющийся генеалогический термин сохранён на каждой ступени родословия; падежные формы согласованы с нормами русского языка.
- source_word: יֽוֹנָתָן
  choice: Ионафан
  rationale: Устоявшаяся русская форма имени.
- source_word: שְׁמַעְיָה
  choice: Шемаия
  rationale: Передача еврейского имени в современной русской библейской транслитерации.
- source_word: מַתַּנְיָה
  choice: Маттания
  rationale: Форма близко передаёт еврейское имя и отличает его от иных имён.
- source_word: מִיכָיָה
  choice: Михая
  rationale: Передача полной еврейской формы имени מִיכָיָה; в тексте стоит родительный падеж.
- source_word: זַכּוּר
  choice: Заккур
  rationale: Транслитерация сохраняет удвоенный согласный, отражённый дагешем.
- source_word: אָסָף
  choice: Асаф
  rationale: Устоявшаяся русская форма библейского имени.
theological_decisions:
- issue: Характер родства Захарии с Асафом
  choice: Последовательность «сын … сына …» сохранена без дополнительных пояснений в основном тексте.
  alternative: Истолковать «сын Асафа» в широком смысле как «потомок Асафа» или член рода Асафа.
  rationale: Оригинал последовательно употребляет בֶן. Перевод сохраняет форму родословия и не добавляет выводов о принадлежности к певческой гильдии или об авторстве.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис перечисления и повторение родословной формулы сохранены, при этом имена и падежи оформлены естественно для русского текста.
