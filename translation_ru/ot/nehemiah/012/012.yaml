  text: וּ/בִ/ימֵי֙ יֽוֹיָקִ֔ים הָי֥וּ כֹהֲנִ֖ים רָאשֵׁ֣י הָ/אָב֑וֹת לִ/שְׂרָיָ֣ה מְרָיָ֔ה לְ/יִרְמְיָ֖ה חֲנַנְיָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/012.yaml
  text: 'And in the days of Joiakim, there were priests, heads of the fathers’ houses: for Seraiah, Meraiah; for Jeremiah, Hananiah.'
translation:
  language: ru
  text: 'Во дни Иоакима были священники, главы родов: у Сераии — Мераия, у Иеремии — Ханания.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִימֵי יוֹיָקִים
  choice: Во дни Иоиакима
  rationale: Естественная для исторического повествования формула, точно передающая временное указание.
- source_word: כֹהֲנִים רָאשֵׁי הָאָבוֹת
  choice: священниками — главами родов
  rationale: 'Сохраняет приложение: перечисляемые лица были священниками, возглавлявшими соответствующие родовые группы. «Роды» яснее по-русски, чем буквальное «отцы».'
- source_word: לִשְׂרָיָה מְרָיָה
  choice: от рода Сераии — Мераия
  rationale: Префикс לְ здесь обозначает соотнесение главы с названным ранее священническим родом; добавление «рода» делает подразумеваемую связь понятной и согласуется с контекстом списка.
- source_word: לְיִרְמְיָה חֲנַנְיָה
  choice: от рода Иеремии — Ханания
  rationale: Передаёт ту же эллиптическую структуру, что и в предыдущей паре, без отождествления Иеремии с пророком.
theological_decisions:
- issue: Характер названий Сераия и Иеремия
  choice: Передать как названия священнических родов в данном перечне
  alternative: «для Сераии — Мераия; для Иеремии — Ханания»
  rationale: Контекст Неемии 12:1–21 сопоставляет прежних священников с главами их родов во дни Иоиакима. Уточнение «от рода» раскрывает эллипсис, не внося конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской формулой «во дни». Тире проясняют структуру именного перечня; имена переданы в устойчивой русской библейской форме.
