base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/039.yaml
  text: and above the Gate of Ephraim[a], and above the Old Gate, and above the Fish Gate, and the Tower of Hananel, and the Tower of the Hundred, and as far as the Sheep Gate[b]; and they stood at the Gate of the Guard.
translation:
  language: ru
  text: Они прошли над воротами Ефрема, над Старыми воротами и над Рыбными воротами, затем мимо башни Хананэла и башни Сотни — до Овечьих ворот; и остановились[a] у ворот Стражи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «встали» или «стояли». В описании движения глагол может означать, что процессия остановилась.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у Тюремных ворот»; возможный перевод: «у Караульных ворот». Точное значение названия неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעַל ... וְעַל ... וְעַל
  choice: прошли над ... над ... и над
  rationale: Предлоги מֵעַל и עַל передают движение процессии по стене выше ворот. Добавлен подразумеваемый глагол «прошли», чтобы цепочка ориентиров естественно звучала по-русски и сохраняла пространственный смысл.
- source_word: לְשַׁעַר אֶפְרַיִם
  choice: над воротами Ефрема
  rationale: Сохранено имя Ефрем и конструкция с названием городских ворот; строчная буква в слове «ворота» соответствует современному русскому оформлению названий такого типа.
- source_word: שַׁעַר הַיְשָׁנָה
  choice: Старые ворота
  rationale: הַיְשָׁנָה естественнее всего понимать как обозначение старых ворот; более развернутое «ворота Старого города» добавляло бы отсутствующее в тексте уточнение.
- source_word: שַׁעַר הַדָּגִים
  choice: Рыбные ворота
  rationale: 'Буквальное и идиоматичное название: «ворота рыб».'
- source_word: מִגְדַּל חֲנַנְאֵל
  choice: башня Хананэла
  rationale: Имя собственное חֲנַנְאֵל передано транслитерацией, без истолкования.
- source_word: מִגְדַּל הַמֵּאָה
  choice: башня Сотни
  rationale: Сохранено буквальное и неоднозначное «башня ста/сотни»; перевод не определяет, к чему именно относилось число.
- source_word: וְעַד שַׁעַר הַצֹּאן
  choice: до Овечьих ворот
  rationale: עַד обозначает предел маршрута, поэтому «до» точно и естественно передаёт значение.
- source_word: וְעָמְדוּ
  choice: остановились
  rationale: Основное значение глагола — «стоять, встать», но после описания движения он естественно обозначает остановку процессии. Буквальная возможность отмечена в сноске.
- source_word: בְּשַׁעַר הַמַּטָּרָה
  choice: у ворот Стражи
  rationale: מַטָּרָה связано со стражей, караулом или местом заключения. «Ворота Стражи» сохраняет общий охранный смысл, не сводя его без достаточных оснований к тюрьме.
