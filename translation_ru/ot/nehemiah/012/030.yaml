  yaml_path: translation/ot/nehemiah/012/030.yaml
  text: And the priests and the Levites purified themselves[a], and they purified the people, the gates, and the wall.
translation:
  language: ru
  text: И священники и левиты очистились, а затем очистили народ, ворота и стену.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּטַּהֲרוּ
  choice: очистились
  rationale: 'Форма хитпаэль имеет возвратное значение: священники и левиты сначала сами прошли обрядовое очищение. «Очистились» естественно по-русски и сохраняет связь с последующим переходным глаголом того же корня.'
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Обычное и точное обозначение священников в храмовом контексте.
- source_word: וְהַלְוִיִּם
  choice: и левиты
  rationale: Традиционное и общепонятное обозначение представителей колена Левия, исполнявших храмовое служение.
- source_word: וַיְטַהֲרוּ
  choice: очистили
  rationale: Форма пиэль здесь переходная и обозначает обрядовое очищение других людей и объектов; повтор «очистились — очистили» передаёт общий еврейский корень и различие залогов.
- source_word: הָעָם
  choice: народ
  rationale: Прямое значение слова в данном контексте; речь идёт о народе, участвующем в освящении стены.
- source_word: הַשְּׁעָרִים
  choice: ворота
  rationale: Прямой и естественный перевод в контексте городской стены.
- source_word: הַחוֹמָה
  choice: стену
  rationale: Единственное число указывает на стену Иерусалима, ясно определённую ближайшим контекстом.
theological_decisions:
- issue: Характер очищения
  choice: обрядовое очищение
  alternative: общее церемониальное очищение либо физическая очистка
  rationale: В контексте храмового служения и посвящения стены корень טהר обозначает ритуальную чистоту, а не просто физическое мытьё или нравственное исправление. Основной текст не уточняет способ совершения обряда.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Союз «а затем» естественно выражает последовательность действий, подразумеваемую повествованием, без уточнения обряда. Повтор однокоренных форм намеренно сохранён.
