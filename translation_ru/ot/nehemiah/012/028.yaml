  text: וַ/יֵּאָ֣סְפ֔וּ בְּנֵ֖י הַ/מְשֹׁרְרִ֑ים וּ/מִן הַ/כִּכָּר֙ סְבִיב֣וֹת יְרוּשָׁלִַ֔ם וּ/מִן חַצְרֵ֖י נְטֹפָתִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/028.yaml
  text: And the sons of the singers were gathered from the district around Jerusalem and from the settlements of the Netophathites[a][b].
translation:
  language: ru
  text: И собрались сыновья певцов из окрестностей Иерусалима[a] и из селений нетофатян[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с равнины вокруг Иерусалима». Еврейское כִּכָּר может означать равнину, округ или область.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из деревень нетофатян». Еврейское חַצְרֵי часто обозначает небольшие или неукреплённые поселения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: собрались
  rationale: Нифаль глагола אסף допускает пассивное или возвратное понимание. Русское «собрались» естественно передаёт событие, не уточняя, пришли ли певцы сами или были созваны.
- source_word: בְּנֵי הַמְשֹׁרְרִים
  choice: сыновья певцов
  rationale: Формально сочетание означает «сыновья певцов» и, вероятно, обозначает представителей наследственной группы храмовых певцов. Буквальная конструкция сохраняет историческую особенность текста.
- source_word: הַכִּכָּר סְבִיבוֹת יְרוּשָׁלִַם
  choice: окрестностей Иерусалима
  rationale: כִּכָּר может обозначать равнину, округ или область. В сочетании с סְבִיבוֹת естественное русское «окрестности Иерусалима» передаёт окружающую город местность без неоправданного уточнения рельефа.
- source_word: חַצְרֵי
  choice: селений
  rationale: В географическом контексте חָצֵר обозначает небольшое, нередко неукреплённое поселение; «селения» уместно для перечня мест проживания.
- source_word: נְטֹפָתִי
  choice: нетофатян
  rationale: Форма является обозначением жителей или выходцев из Нетофы. «Нетофатяне» сохраняет эту этногеографическую форму, а не подменяет её названием самой местности.
