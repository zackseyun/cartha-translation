  text: Judah[a], Benjamin, Shemaiah, and Jeremiah.
translation:
  language: ru
  text: Иуда[a], Вениамин, Шемаия и Иеремия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, если понимать יְהוּדָה как географическое название, «Иудея»; однако в этом перечне лучше подходит имя «Иуда» или обозначение рода Иуды.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוּדָה
  choice: Иуда
  rationale: В данном перечне это имя человека или обозначение рода/колена, а не географическое название. Выбрана традиционная русская библейская форма имени.
- source_word: בִנְיָמִן
  choice: Вениамин
  rationale: Собственное имя в ряду имён; использована устоявшаяся русская библейская форма.
- source_word: שְׁמַעְיָה
  choice: Шемаия
  rationale: Личное имя передано современной русской библейской транслитерацией, достаточно близкой к еврейской форме.
- source_word: יִרְמְיָה
  choice: Иеремия
  rationale: Использована общепринятая и узнаваемая русская библейская форма имени.
- source_word: וְ / וּ
  choice: запятые и союз «и» перед последним именем
  rationale: Повторяющийся еврейский союз связывает элементы перечня; по-русски естественно поставить запятые и сохранить «и» перед последним именем.
