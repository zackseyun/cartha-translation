  yaml_path: translation/ot/nehemiah/012/010.yaml
  text: Jeshua fathered Joiakim[a], and Joiakim fathered Eliashib[b], and Eliashib fathered Joiada.
translation:
  language: ru
  text: Йешуа стал отцом Йоякима[a], Йояким — отцом Эльяшива, а Эльяшив — отцом Йояды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская родословная формула буквально означает: «Йешуа произвёл на свет Йоякима»; по смыслу: «стал отцом Йоякима».'
    reason: lexical_alternative
  - marker: b
    text: В традиционных русских переводах Йояким может передаваться как «Иоаким», а Йояда — как «Иоиада».
    reason: alternative_reading
lexical_decisions:
- source_word: יֵשׁוּעַ
  choice: Иешуа
  rationale: Имя передано близко к еврейской форме; это также позволяет не смешивать данного послепленного первосвященника с Иисусом Навином.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Порода hифиль глагола ילד в родословной формуле буквально означает «произвёл на свет», а по-русски естественно передаётся как «стал отцом». Формулировка сохраняет мужскую линию родословия и избегает архаичного «родил» применительно к мужчине.
- source_word: אֶת
  choice: не передано отдельно
  rationale: Показатель прямого дополнения не имеет самостоятельного лексического соответствия в русском языке.
- source_word: יוֹיָקִים
  choice: Йояким
  rationale: Передача следует краткой форме имени, засвидетельствованной в данном еврейском тексте, и отличает её от полной формы Йехояким.
- source_word: אֶלְיָשִׁיב
  choice: Эльяшив
  rationale: Имя транслитерировано с еврейского в форме, близкой к исходному звучанию.
- source_word: יוֹיָדָע
  choice: Йояда
  rationale: Передача следует краткой форме имени в данном еврейском тексте; более полная форма — Йехояда.
