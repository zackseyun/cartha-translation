  text: הַ/לְוִיִּם֩ בִּ/ימֵ֨י אֶלְיָשִׁ֜יב יוֹיָדָ֤ע וְ/יוֹחָנָן֙ וְ/יַדּ֔וּעַ כְּתוּבִ֖ים רָאשֵׁ֣י אָב֑וֹת וְ/הַ/כֹּ֣הֲנִ֔ים עַל מַלְכ֖וּת דָּרְיָ֥וֶשׁ הַ/פָּֽרְסִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/022.yaml
  text: In the days of Eliashib[a], Joiada, Johanan, and Jaddua, the Levites were recorded as heads of fathers’ houses, and the priests also[c][b], during the reign of Darius the Persian.
translation:
  language: ru
  text: Во дни Елиашива, Иоиады, Иоханана[c] и Иаддуя левиты были записаны[b] как главы родов[a], и священники также были записаны — во время царствования Дария Персидского.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «главы отцовских домов»; техническое обозначение глав родов.'
    reason: cultural_note
  - marker: b
    text: 'Или: «были внесены в список (реестр)».'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте здесь Иоханан; в некоторых переводческих традициях — Ионафан.
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Общепринятое и естественное русское обозначение членов колена Левия.
- source_word: בִּימֵי
  choice: во дни
  rationale: Сохраняет обычную древнееврейскую временную формулу и остаётся понятным в современном литературном русском.
- source_word: אֶלְיָשִׁיב יוֹיָדָע וְיוֹחָנָן וְיַדּוּעַ
  choice: Елиашива, Иоиады, Иоханана и Иаддуя
  rationale: Имена переданы в формах, близких к русской библейской традиции, при этом יוֹחָנָן передано как «Иоханан», а не «Ионафан».
- source_word: כְּתוּבִים
  choice: были записаны
  rationale: Страдательное причастие от כתב в данном административно-родословном контексте означает внесение в письменный список или реестр.
- source_word: רָאשֵׁי אָבוֹת
  choice: главы родов
  rationale: Естественно передаёт техническое обозначение руководителей родовых объединений, не прибегая к неясной буквальной кальке «главы отцов».
- source_word: וְהַכֹּהֲנִים
  choice: а также священники
  rationale: Восполняет подразумеваемое сказуемое «были записаны» и сохраняет присоединительный характер еврейской конструкции.
- source_word: עַל מַלְכוּת
  choice: в царствование
  rationale: Передаёт хронологическое употребление сочетания с מַלְכוּת; формулировка не уточняет сверх текста точные границы периода.
- source_word: דָּרְיָוֶשׁ הַפָּרְסִי
  choice: Дария Персидского
  rationale: Сохраняет традиционную русскую форму имени и приложенное к нему этническое обозначение.
theological_decisions:
- issue: Область действия временного оборота «в царствование Дария Персидского»
  choice: Поставить оборот после упоминания священников, следуя порядку еврейского текста.
  alternative: Отнести этот оборот ко всей записи левитов и священников либо перевести עַל как «до царствования».
  rationale: Синтаксис стиха сжат и допускает некоторую неясность; перевод сохраняет исходное расположение и не вводит более определённую хронологическую схему, чем позволяет текст.
translation_notes:
  register: Современный литературный русский с умеренно библейской формулой «во дни». Эллипсис при слове «священники» передан тире; все поясняющие маркеры стоят непосредственно при соответствующих словам и выражениям.
