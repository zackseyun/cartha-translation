  yaml_path: translation/ot/nehemiah/012/036.yaml
  text: and his brothers—Shemaiah[a], Azarel, Milalai, Gilalai, Maai, Nethanel, Judah, and Hanani—with the musical instruments of David the man of God, and Ezra the scribe before them.
translation:
  language: ru
  text: 'и его братья: Шемаия, Азарел, Милалай, Гилалай, Маай, Нетанел, Иуда и Ханани — с музыкальными инструментами[a] Давида, человека Божьего; а книжник Ездра был впереди них.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «с орудиями песни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו
  choice: и его братья
  rationale: Сохранено прямое значение слова אָח — «брат». В данном перечне оно может обозначать также собратьев по левитскому служению, но контекст не требует заменять исходное родственное обозначение толкованием.
- source_word: שְׁמַעְיָה ... חֲנָנִי
  choice: Шемаия, Азарел, Милалай, Гилалай, Маай, Нефанел, Иуда и Ханани
  rationale: Личные имена переданы русской транслитерацией с учётом сложившихся библейских форм там, где они общеупотребительны.
- source_word: בִּכְלֵי שִׁיר
  choice: с музыкальными инструментами
  rationale: Буквально выражение означает «с орудиями/инструментами песни». Выбран естественный современный русский эквивалент; буквальный образ отмечен в сноске.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: Давида, человека Божьего
  rationale: Родительная связь относит инструменты к Давиду, а выражение «человек Божий» сохраняет традиционный библейский почётный титул без дополнительного истолкования.
- source_word: וְעֶזְרָא הַסּוֹפֵר
  choice: а книжник Ездра
  rationale: Союз передан как «а» для естественного присоединения последнего участника и обозначения его отдельного положения; הַסּוֹפֵר передано устойчивым библейским словом «книжник».
- source_word: לִפְנֵיהֶם
  choice: был впереди них
  rationale: Фраза обозначает положение Ездры во главе или перед группой. Связка «был» добавлена по нормам русского синтаксиса, не уточняя способ движения.
theological_decisions:
- issue: Передача титула אִישׁ הָאֱלֹהִים
  choice: человек Божий
  alternative: Божий человек
  rationale: Форма «человек Божий» сохраняет узнаваемый межтекстовый библейский титул и не вносит дополнительного конфессионального содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Перечень имён сохранён без стилистического упрощения; пунктуация помогает различить список участников, музыкальные инструменты и положение Ездры в шествии.
