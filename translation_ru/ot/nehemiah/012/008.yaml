source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֗ם יֵשׁ֧וּעַ בִּנּ֛וּי קַדְמִיאֵ֥ל שֵׁרֵבְיָ֖ה יְהוּדָ֣ה מַתַּנְיָ֑ה עַֽל הֻיְּד֖וֹת ה֥וּא וְ/אֶחָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/008.yaml
  text: And the Levites were Jeshua[a], Binnui, Kadmiel, Sherebiah, Judah, and Mattaniah, who, with his brothers[b], was over the thanksgiving songs.
translation:
  language: ru
  text: 'А левиты: Иешуа, Биннуй, Кадмиил, Шеревия, Иуда и Маттания; он вместе со своими братьями руководил благодарственными песнопениями.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «они вместе со своими братьями руководили благодарениями». Еврейскую конструкцию можно понять собирательно, хотя местоимение в единственном числе естественнее всего относится к Маттании.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «благодарениями». Вероятно, имеются в виду богослужебные песни или иные выражения хвалы и благодарности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: 'А левиты:'
  rationale: Союз продолжает перечень, а именная конструкция без глагола естественно передаётся по-русски двоеточием.
- source_word: יֵשׁוּעַ בִּנּוּי קַדְמִיאֵל שֵׁרֵבְיָה יְהוּדָה מַתַּנְיָה
  choice: Иешуа, Биннуй, Кадмиил, Шеревия, Иуда и Маттания
  rationale: Личные имена переданы принятой библейской транслитерацией, без перевода их значений.
- source_word: עַל
  choice: руководил
  rationale: Предлог в данном контексте обозначает ответственность или надзор; глагольная передача естественна для современного русского языка.
- source_word: הֻיְּדוֹת
  choice: благодарственными песнопениями
  rationale: Форма связана с благодарением и хвалой; в контексте обязанностей левитов вероятнее всего имеются в виду богослужебные выражения благодарности, вероятно песнопения.
- source_word: הוּא
  choice: он
  rationale: Местоимение стоит в единственном числе и наиболее естественно относится к последнему названному лицу — Маттании.
- source_word: וְאֶחָיו
  choice: вместе со своими братьями
  rationale: Сохраняет буквальный образ родства и ясно показывает, что другие левиты участвовали вместе с Маттанией.
theological_decisions:
- issue: К кому относится местоимение единственного числа הוּא после перечня левитов
  choice: К Маттании, последнему названному лицу
  alternative: 'К перечисленным левитам как к группе: «они вместе со своими братьями…»'
  rationale: Единственное число местоимения синтаксически естественнее связывать с Маттанией, однако краткость еврейской конструкции допускает более коллективное понимание; оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Двоеточие сохраняет лаконичность перечня; «песнопения» указывает на богослужебный контекст, а сноска сохраняет более широкое значение исходного существительного.
