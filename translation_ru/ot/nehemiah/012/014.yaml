lexical_decisions:
- source_word: ל/מלוכי
  choice: от Маллухия
  rationale: В перечне священнических глав предлог ל связывает названного представителя с родом или священническим домом Маллухия. По-русски формулу списка естественно передать через «от», сохраняя возможность как представительного, так и родового понимания.
- source_word: יֽוֹנָתָ֔ן
  choice: Ионафан
  rationale: Традиционная и узнаваемая русская библейская форма еврейского имени יוֹנָתָן.
- source_word: לִ/שְׁבַנְיָ֖ה
  choice: от Шевании
  rationale: Предлог ל употреблён параллельно первой части стиха и обозначает связь Иосифа с родом или священническим домом Шевании; «от Шевании» естественно для русского перечня представителей.
- source_word: יוֹסֵֽף
  choice: Иосиф
  rationale: Традиционная русская библейская форма имени יוֹסֵף.
