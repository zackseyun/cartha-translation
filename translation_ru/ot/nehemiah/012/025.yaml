base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/025.yaml
  text: Mattaniah, Bakbukiah, Obadiah, Meshullam, Talmon, and Akkub were guards, gatekeepers, keeping watch at the storehouses of the gates.
translation:
  language: ru
  text: Маттания, Бакбукия, Овадия, Мешуллам, Талмон и Аккув были стражами и привратниками, неся службу у хранилищ ворот.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁמְרִים שֹׁעֲרִים
  choice: стражи, привратники
  rationale: Сохраняет оба стоящих рядом причастия/обозначения служителей, не сводя их к одной должности; бессвязочное именное предложение естественно передано через тире.
- source_word: מִשְׁמָר
  choice: нёсшие караул
  rationale: Передаёт значение несения стражи и согласуется с причастной конструкцией, описывающей их обязанность.
- source_word: בַּאֲסֻפֵּי הַשְּׁעָרִים
  choice: у хранилищ при воротах
  rationale: אֲסֻפִּים, вероятно, обозначает помещения для собранных припасов, то есть хранилища; «при воротах» естественно передаёт их связь с воротами, не утверждая, что сами ворота служили складами.
