- from: Тогда я поднял начальников Иудеи на стену и поставил два больших хора благодарения[a] с шествиями. Один из них пошёл направо по стене, к Навозным воротам[b].
  to: Тогда я вывел руководителей Иудеи на стену и поставил две большие благодарственные процессии[a]. Одна из них пошла направо по стене, к Навозным воротам[b].
  rationale: Перевод уточнён для естественного современного русского и более ясного отражения контекстуально связанной пары «благодарения / процессии». Сноска сохраняет буквальное значение и не выдаёт контекстуальное понимание как бесспорное. Направительное значение перед Навозными воротами сохранено, как и альтернативное прочтение в сноске.
