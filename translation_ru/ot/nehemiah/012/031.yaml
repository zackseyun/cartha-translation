  yaml_path: translation/ot/nehemiah/012/031.yaml
  text: Then I brought the leaders of Judah up onto the wall[a], and I appointed two great thanksgiving choirs and processions[b], one going to the right on the wall toward the Dung Gate.
translation:
  language: ru
  text: Тогда я вывел руководителей Иудеи на стену и поставил две большие благодарственные процессии[a]. Одна из них пошла направо по стене, к Навозным воротам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «два больших благодарения». По контексту речь, вероятно, идёт об организованных группах, или хорах, возносивших благодарение и шедших процессиями.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «до Навозных ворот». Предлог здесь может обозначать как направление движения, так и его конечный пункт.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאַעֲלֶה
  choice: я поднял
  rationale: 'Форма породы hифиль от עלה имеет каузативное значение: Неемия велел начальникам подняться или привёл их наверх; «поднял» естественно передаёт движение на стену.'
- source_word: שָׂרֵי יְהוּדָה
  choice: начальников Иудеи
  rationale: שָׂרִים обозначает руководителей или должностных лиц; «начальники» не создаёт ошибочного впечатления, будто речь непременно идёт о царских сыновьях.
- source_word: מֵעַל לַחוֹמָה
  choice: на стену
  rationale: В контексте глагола движения выражение указывает на подъём на верхнюю поверхность стены.
- source_word: וָאַעֲמִידָה
  choice: поставил
  rationale: Hифиль от עמד означает «поставить, расположить»; перевод сохраняет конкретное действие Неемии и не вводит более абстрактного «назначил».
- source_word: שְׁתֵּי תוֹדֹת גְּדוֹלֹת
  choice: два больших хора благодарения
  rationale: Буквально сказано «два больших благодарения», но в повествовательном контексте תוֹדֹת метонимически обозначает организованные группы, возносящие благодарение; род числительного в русском согласован со словом «хора».
- source_word: וְתַהֲלֻכֹת
  choice: с шествиями
  rationale: Слово от корня הלך обозначает шествия или движение процессий. Русское «с» естественно связывает хоры с их церемониальным шествием, не представляя их непременно как ещё две отдельные группы.
- source_word: לַיָּמִין
  choice: направо
  rationale: Сохранено буквальное направление «вправо»; подразумеваемое некоторыми толкователями движение на юг не внесено в основной текст.
- source_word: לְשַׁעַר הָאַשְׁפֹּת
  choice: к Навозным воротам
  rationale: Название ворот прозрачно передаёт אַשְׁפֹּת; предлог ל допускает направительное «к», не утверждающее обязательно прибытие к воротам.
