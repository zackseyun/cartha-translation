base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/037.yaml
  text: And by the Fountain Gate[a], in front of them, they went up by the stairs of the city of David, at the ascent of the wall, above the house of David[b], and as far as the Water Gate on the east.
translation:
  language: ru
  text: У ворот Источника[a], перед ними, они поднялись по ступеням[b] Города Давида, по подъёму к стене, выше дома Давида и дошли до Водяных ворот на востоке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Родниковых ворот». Еврейское слово может обозначать источник, родник или место выхода воды.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по подъёмам». Еврейское слово может обозначать как устроенные ступени, так и подъёмы вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁעַר הָעַיִן
  choice: ворота Источника
  rationale: עַיִן может обозначать источник или родник. «Ворота Источника» естественно звучит как название городских ворот и сохраняет водную топографическую связь.
- source_word: וְנֶגְדָּם
  choice: находившимся прямо перед ними
  rationale: נֶגֶד означает «перед, напротив». Формулировка естественно связывает указание направления с маршрутом подъёма, не устраняя пространственного оттенка.
- source_word: עָלוּ
  choice: они поднялись
  rationale: Обычное значение qal глагола עלה — «подниматься, идти вверх»; русский вариант ясно передаёт движение.
- source_word: מַעֲלוֹת עִיר דָּוִיד
  choice: ступеням Города Давида
  rationale: Множественное מַעֲלוֹת может означать ступени или подъёмы; в городской топографии «ступени» наиболее конкретно и естественно.
- source_word: בַּמַּעֲלֶה לַחוֹמָה
  choice: по подъёму к стене
  rationale: Единственное מַעֲלֶה обозначает подъём; предлог ל перед חוֹמָה естественно передан направлением «к стене».
- source_word: מֵעַל לְבֵית דָּוִיד
  choice: выше дома Давида
  rationale: מֵעַל указывает на положение выше или над ориентиром; в описании пути «выше дома Давида» передаёт разницу высот без предположения о движении непосредственно над зданием.
- source_word: שַׁעַר הַמַּיִם מִזְרָח
  choice: Водяных ворот с восточной стороны
  rationale: מִזְרָח означает «восток, к востоку»; выражение передаёт восточное местоположение или направление ворот, сохраняя некоторую пространственную широту оригинала.
- source_word: וְעַל
  choice: у
  rationale: В топографическом описании עַל может иметь локативное значение «у, возле»; «у ворот» естественно по-русски.
