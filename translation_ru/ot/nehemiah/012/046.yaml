base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/046.yaml
  text: For in the days of David and Asaph[a], of old, there were heads of the singers[b], and songs of praise and thanksgiving to God.
translation:
  language: ru
  text: Ибо во дни Давида и Асафа,[a] в давние времена, были руководители певцов[b] и песни хвалы и благодарения Богу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «издавна»; еврейское выражение указывает на давнее, прежнее время.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «глава певцов»; возможно также: «начальники певцов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит пояснение или основание к предшествующему утверждению; «ведь» естественно передаёт эту функцию по-русски.
- source_word: בִימֵי דָוִיד וְאָסָף
  choice: во дни Давида и Асафа
  rationale: Сохранён традиционный, но понятный современному читателю временной оборот; имена переданы в принятой русской библейской форме.
- source_word: מִקֶּדֶם
  choice: ещё в древности
  rationale: Передаёт давность и естественно соотносится с упоминанием времён Давида и Асафа, не превращая выражение в отдельное утверждение.
- source_word: ראש הַמְשֹׁרְרִים
  choice: руководители певцов
  rationale: רֹאשׁ буквально означает «глава» и здесь обозначает руководящую должность; множественное число согласовано с контекстом служебных групп, а буквальная форма отмечена в сноске.
- source_word: וְשִׁיר תְּהִלָּה
  choice: и звучали песни хвалы
  rationale: Единственное שִׁיר может иметь собирательный смысл. Глагол «звучали» добавлен для естественного русского синтаксиса и не вводит нового содержательного действия.
- source_word: וְהֹדוֹת
  choice: и благодарения
  rationale: Слово обозначает выражения благодарности в богослужебном контексте; форма «благодарения» сохраняет связь с песнями.
- source_word: לֵאלֹהִים
  choice: Богу
  rationale: Дательный падеж естественно передаёт направленность хвалы и благодарения к Богу.
theological_decisions:
- issue: Синтаксис краткого еврейского именного высказывания
  choice: «были руководители певцов, и звучали песни»
  alternative: «был глава певцов и песнь хвалы и благодарения»
  rationale: В еврейском тексте связки опущены, а רֹאשׁ формально стоит в единственном числе и может пониматься собирательно. Основной перевод следует контексту и делает фразу естественной по-русски, не связывая должность исключительно с Асафом.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. Оборот «во дни» сохранён как ясный и уместный в историческом повествовании; остальной синтаксис сделан естественным для современного читателя.
