  timestamp: '2026-07-15T15:06:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основное чтение с личным именем Унно допустимо и хорошо соответствует перечню левитов. Однако «каждый в своей» добавляет отсутствующее в еврейском тексте распределительное значение и единственное число; לְמִשְׁמָרוֹת следует передать множественным числом: «по чередам служения».'
  naturalness: Исходная фраза понятна, но приложение «их братья» после двух имён несколько тяжеловесно и может быть неверно соотнесено. Оборот «вместе со своими братьями» естественнее для современного литературного русского и передаёт перечислительную конструкцию.
  terminology: «Череды служения» точно и естественно передаёт מִשְׁמָרוֹת в контексте храмовой организации. Имена «Бакбукия» и «Унно» сохранены. Сноска должна не приписывать глагольному прочтению единственное число «его», которого в форме אֲחֵיהֶם нет.
  issues:
  - severity: medium
    issue: Добавлено значение «каждый в своей»
    rationale: В еврейском тексте стоит множественное לְמִשְׁמָרוֹת («по/для черед, смен служения»), без слова «каждый» и без указания на индивидуальную «свою» череду.
  - severity: low
    issue: Неточная формулировка альтернативного чтения в сноске
    rationale: Фраза «его братья» не соответствует явно множественному суффиксу в אֲחֵיהֶם («их братья»). Альтернативу следует формулировать осторожно, не создавая ложной синтаксической определённости.
  revised_text: А Бакбукия и Унно[a] вместе со своими братьями стояли напротив них по чередам служения.
  revised_footnotes:
  - marker: a
