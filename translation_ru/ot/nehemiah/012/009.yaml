- from: А Бакбукия и Унно[a], их братья, стояли напротив них, каждый в своей череде служения.
  to: А Бакбукия и Унно[a] вместе со своими братьями стояли напротив них по чередам служения.
  rationale: Исправлено не имеющее опоры в оригинале «каждый в своей»; множественное число «чередам» сохраняет значение לְמִשְׁמָרוֹת. Синтаксис сделан более естественным по-русски. Сноска сохраняет отмеченную в английском аудите текстовую неоднозначность, но согласует русское «их братья» с формой еврейского текста.
