  text: And Bakbukiah and Unno[a], their brothers, stood opposite them in the divisions of service.
translation:
  language: ru
  text: А Бакбукия и Унно[a] вместе со своими братьями стояли напротив них по чередам служения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно и другое прочтение: «а Бакбукия и их братья отвечали им по чередам», если וענו понимать как глагол, а не как имя Унно.'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבַקְבֻּקְיָה
  choice: А Бакбукия
  rationale: Личное имя передано принятой русской транслитерацией; союз וּ передан как «А», естественно продолжающее перечень.
- source_word: ו/ענו
  choice: и Унно[a]
  rationale: Последовательность согласных понята как личное имя, что соответствует контексту перечня левитов. Возможное глагольное прочтение сохранено в сноске.
- source_word: אֲחֵיהֶם
  choice: их братья
  rationale: Сохранён прямой смысл еврейского термина родства; в данном контексте он может обозначать также собратьев по левитскому служению.
- source_word: לְנֶגְדָּם
  choice: стояли напротив них
  rationale: Предлог означает «напротив них / перед ними»; глагол «стояли» добавлен по контексту расположения служителей и для естественного русского синтаксиса.
- source_word: לְמִשְׁמָרוֹת
  choice: каждый в своей череде служения
  rationale: Множественное מִשְׁמָרוֹת обозначает установленные череды или смены храмового служения. Формулировка передаёт организованное распределение обязанностей.
