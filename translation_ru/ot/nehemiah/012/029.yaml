    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֵּית הַגִּלְגָּל
  choice: и из Бет-Гилгала
  rationale: Сочетание בֵּית с названием обычно образует топоним; транслитерация не создаёт ошибочного впечатления, будто речь идёт об отдельном доме.
- source_word: וּמִשְּׂדוֹת גֶּבַע וְעַזְמָוֶת
  choice: и с полей Гевы и Азмавета
  rationale: שְּׂדוֹת прямо означает «поля» и здесь обозначает угодья или сельскую местность при названных поселениях.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение того, почему певцы находились в этих местах.
- source_word: חֲצֵרִים
  choice: селения
  rationale: Хотя слово может обозначать огороженные дворы, в данном географическом контексте речь идёт о небольших населённых местах, где жили певцы.
- source_word: בָּנוּ לָהֶם
  choice: построили себе
  rationale: Сохраняется прямое значение глагола «строить» и возвратная выгода конструкции לָהֶם.
- source_word: הַמְשֹׁרֲרִים
  choice: певцы
  rationale: Причастная форма от שׁיר обозначает именно поющих, что соответствует храмовому контексту.
- source_word: סְבִיבוֹת יְרוּשָׁלִָם
  choice: вокруг Иерусалима
  rationale: Естественно и точно передаёт пространственное значение окрестностей города.
