  text: וְ/יוֹיָדָע֙ הוֹלִ֣יד אֶת יוֹנָתָ֔ן וְ/יוֹנָתָ֖ן הוֹלִ֥יד אֶת יַדּֽוּעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/011.yaml
  text: And Joiada fathered Jonathan[a], and Jonathan fathered Jaddua.
translation:
  language: ru
  text: И Иоиада стал отцом Ионафана[a], а Ионафан стал отцом Иаддуя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях и переводах здесь стоит имя «Иоханан» вместо «Ионафан». В принятом здесь еврейском тексте стоит «Ионафан».
    reason: alternative_reading
lexical_decisions:
- source_word: וְ
  choice: И
  rationale: Союз связывает эту генеалогическую запись с предыдущей; простое «И» сохраняет последовательность исходного текста.
- source_word: יוֹיָדָע
  choice: Иоиада
  rationale: Личное имя передано в принятой русской библейской форме, соответствующей еврейскому имени.
- source_word: הוֹלִיד
  choice: стал отцом
  rationale: Порода хифиль глагола ילד в родословиях обозначает рождение потомка мужчиной. «Стал отцом» естественно для современного русского языка и сохраняет генеалогический смысл без архаизма «родил» применительно к мужчине.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель прямого дополнения передаётся русским синтаксисом и отдельного соответствия не требует.
- source_word: יוֹנָתָן
  choice: Ионафан
  rationale: Основной текст WLC содержит יוֹנָתָן, то есть «Ионафан»; иной вариант отражён в сноске.
- source_word: וְ
  choice: а
  rationale: Во второй части «а» естественно связывает последовательные звенья родословия и избегает тяжеловесного повтора, не добавляя смыслового противопоставления.
- source_word: יַדּוּעַ
  choice: Иаддуй
  rationale: Личное имя передано в традиционной русской библейской форме.
