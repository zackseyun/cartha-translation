base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/024.yaml
  text: And the heads of the Levites were Hashabiah[a], Sherebiah, and Jeshua son of Kadmiel, with their brothers opposite them, to praise and to give thanks according to the command of David the man of God[b], watch corresponding to watch.
translation:
  language: ru
  text: Во главе левитов стояли Хашавия, Шеревия и Иешуа, сын Кадмиила; их братья стояли напротив них[a], чтобы возносить хвалу и благодарение по повелению Давида, человека Божьего, — смена напротив смены[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «соответственно им». Вероятно, имеются в виду расположенные друг напротив друга или соотнесённые между собой группы левитов.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «стража напротив стражи». Вероятно, речь идёт о соотнесённых или чередующихся подразделениях храмового служения.'
    reason: cultural_note
lexical_decisions:
- source_word: רָאשֵׁי הַלְוִיִּם
  choice: во главе левитов стояли
  rationale: Идиоматически передаёт конструкцию «главы левитов» как обозначение руководителей; добавленный глагол необходим для естественного русского предложения.
- source_word: חֲשַׁבְיָה שֵׁרֵבְיָה וְיֵשׁוּעַ בֶּן קַדְמִיאֵל
  choice: Хашавия, Шеревия и Иешуа, сын Кадмиэла
  rationale: Имена транслитерированы с еврейского; родственная формула בֶּן сохранена явно.
- source_word: וַאֲחֵיהֶם לְנֶגְדָּם
  choice: напротив них — их братья
  rationale: Сохраняет мужской термин родства и пространственно-соотносительное значение לְנֶגְדָּם, не уточняя сверх текста характер взаимодействия групп.
- source_word: לְהַלֵּל לְהוֹדוֹת
  choice: возносить хвалу и благодарение
  rationale: Различает два параллельных богослужебных действия и звучит естественно в современном литературном русском.
- source_word: בְּמִצְוַת
  choice: по повелению
  rationale: Передаёт соответствие авторитетному предписанию.
- source_word: דָּוִיד אִישׁ הָאֱלֹהִים
  choice: Давида, человека Божьего
  rationale: Традиционный библейский титул сохранён без истолковывающего расширения.
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: смена напротив смены
  rationale: Сохраняет повтор, соотнесённость и эллиптичность еврейской формулы; «смена» уместно обозначает очередь или подразделение храмового служения, не сводя выражение к охране.
theological_decisions:
- issue: Мужской термин אֲחֵיהֶם
  choice: их братья
  alternative: их собратья; другие левиты
  rationale: Еврейский текст употребляет грамматически мужское множественное число применительно к левитам; конкретный образ родства сохранён.
- issue: Эллиптическая культовая формула מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: смена напротив смены
  alternative: одна группа напротив другой; череда против череды
  rationale: Формула указывает на упорядоченное соотношение служебных подразделений, но прямо не называет пение попеременным или антифонным; перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной богослужебной лексикой. Синтаксис прояснён минимально; двоеточие и тире помогают сохранить перечислительную и эллиптическую структуру стиха. Все примечания поставлены при тех выражениях, которые они поясняют.
