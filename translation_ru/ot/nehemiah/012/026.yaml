  source_fidelity: Перевод верно передаёт указание на ранее перечисленных лиц и обе повторённые хронологические формулы. Родословная Иоакима сохранена; Неемия обозначен как פֶּחָה, а Ездра — двумя приложенными титулами. «Они жили» является допустимым естественным раскрытием безглагольного указательного предложения и не добавляет существенного содержания.
