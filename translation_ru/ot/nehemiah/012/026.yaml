  text: אֵ֕לֶּה בִּ/ימֵ֛י יוֹיָקִ֥ים בֶּן יֵשׁ֖וּעַ בֶּן יוֹצָדָ֑ק וּ/בִ/ימֵי֙ נְחֶמְיָ֣ה הַ/פֶּחָ֔ה וְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סּוֹפֵֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/026.yaml
  text: These were in the days of Joiakim son of Jeshua[a], son of Jozadak, and in the days of Nehemiah the governor and Ezra the priest, the scribe.
translation:
  language: ru
  text: Они жили во дни Иоакима, сына Иисуса, сына Иоседека, и во дни Неемии, правителя, и Ездры, священника и книжника.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Они жили
  rationale: Указательное местоимение во множественном числе отсылает к перечисленным выше людям. Глагол «жили» естественно передаёт подразумеваемое существование в указанное время, не меняя смысла безглагольного еврейского предложения.
- source_word: בִּימֵי
  choice: во дни
  rationale: Традиционное и понятное русское соответствие историко-хронологической формуле «в дни / во время»; сохраняет строй оригинала.
- source_word: יוֹיָקִים
  choice: Иоаким
  rationale: Принятая русская библейская передача имени этого послепленного первосвященника; контекст отличает его от одноимённого царя.
- source_word: בֶּן יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: сына Иисуса, сына Иоседека
  rationale: בֶּן в данной родословной формуле естественно означает прямое сыновство. Имена переданы в привычной русской библейской форме.
- source_word: וּבִימֵי
  choice: и во дни
  rationale: Повтор хронологической формулы сохранён в соответствии с еврейским синтаксисом.
- source_word: נְחֶמְיָה הַפֶּחָה
  choice: Неемии, правителя
  rationale: פֶּחָה обозначает областного правителя в имперской администрации; «правитель» ясно и естественно передаёт должность.
- source_word: וְעֶזְרָא הַכֹּהֵן הַסּוֹפֵר
  choice: и Ездры, священника и книжника
  rationale: Два определённых приложения относятся к Ездре и обозначают его как священника и книжника. Союз «и» между названиями двух ролей наиболее естественен в современном русском языке.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно сохранённой библейской исторической формулой «во дни». Имена даны в устоявшейся русской библейской традиции. Синтаксис сохраняет повтор хронологического оборота, но остаётся понятным обычному читателю.
