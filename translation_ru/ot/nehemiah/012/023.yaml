base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/023.yaml
  text: The sons of Levi[a], heads of fathers’ houses, were recorded in the book of the chronicles[b], up to the days of Yohanan son of Eliashib.
translation:
  language: ru
  text: Сыновья Левия, главы родов, были записаны в книге летописей[a] вплоть до времени Иоханана, сына Елиашива.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под «книгой летописей» здесь подразумевается письменная историческая хроника или официальный свод записей, а не обязательно библейские книги Паралипоменон.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי לֵוִי
  choice: сыновья Левия
  rationale: Сохранена конкретная родословная формулировка еврейского текста; она естественна по-русски и не сводит выражение к более общему «левиты».
- source_word: רָאשֵׁי הָאָבוֹת
  choice: главы родов
  rationale: Еврейская идиома обозначает руководителей родовых объединений. Буквальное «главы отцов» в современном русском не передаёт смысла достаточно ясно.
- source_word: כְּתוּבִים
  choice: были записаны
  rationale: Пассивная форма указывает на внесение имён в письменный перечень или официальный документ.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים
  choice: в книге летописей
  rationale: Предлог передан по нормам русского словоупотребления, а выражение דִּבְרֵי הַיָּמִים понято как летописные, анналистические записи.
- source_word: וְעַד יְמֵי
  choice: вплоть до времени
  rationale: Передан временной предел ведения записи; «времени» звучит естественнее современного русского «до дней», не изменяя смысла.
- source_word: יוֹחָנָן
  choice: Иоханан
  rationale: Имя передано транслитерацией, близкой к еврейской форме и принятой в русской библейской традиции.
- source_word: בֶּן אֶלְיָשִׁיב
  choice: сына Елиашива
  rationale: Прямо передана патронимическая конструкция; форма родительного падежа обусловлена русским синтаксисом.
