lexical_decisions:
- source_word: שְׁמַעְיָה
  choice: Шемаия
  rationale: Личное имя передано принятой в русской библейской традиции транслитерацией, близкой к еврейской форме.
- source_word: וְ
  choice: перечислительная запятая
  rationale: Еврейский союз связывает имена в перечне; в естественном русском перечислении здесь достаточно запятой.
- source_word: יוֹיָרִיב
  choice: Иоиарив
  rationale: Передана краткая форма имени, засвидетельствованная непосредственно в этом стихе, без замены на родственную полную форму Иегоиарив.
- source_word: יְדַעְיָה
  choice: Иедаия
  rationale: Личное имя передано в соответствии с устойчивой русской библейской традицией.
