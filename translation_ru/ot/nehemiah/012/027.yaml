base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/027.yaml
  text: At the dedication of the wall of Jerusalem[a], they sought the Levites from all their places, to bring them to Jerusalem to celebrate the dedication with gladness, with thanksgivings, and with song, with cymbals, harps[c][b], and lyres.
translation:
  language: ru
  text: При освящении стены Иерусалима левитов искали[a] по всем местам, где они жили, чтобы привести их в Иерусалим и совершить освящение[b] с радостью, с благодарениями, с пением, под звуки тарелок, арф[c] и лир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разыскивали»; по смыслу возможно также «созвали». Еврейский глагол прежде всего означает «искать».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сделать (совершить) освящение».'
    reason: lexical_alternative
  - marker: c
    text: Точно соотнести два названных здесь древнееврейских струнных инструмента с современными арфой и лирой невозможно.
    reason: cultural_note
lexical_decisions:
- source_word: וּבַחֲנֻכַּת חוֹמַת יְרוּשָׁלִַם
  choice: При освящении стены Иерусалима
  rationale: Предлог ב задаёт временную рамку, а חֲנֻכָּה обозначает посвящение или освящение; в данном контексте естественно русское «при освящении».
- source_word: בִּקְשׁוּ אֶת הַלְוִיִּם
  choice: левитов разыскали
  rationale: בקשׁ прежде всего значит «искать». Безличная русская конструкция сохраняет неопределённого субъекта еврейской формы множественного числа и естественно передаёт успешный поиск в контексте последующего приведения.
- source_word: מִכָּל מְקוֹמֹתָם
  choice: во всех местах, где они жили
  rationale: 'Буквально: «из всех их мест». Контекст показывает, что речь идёт о местах проживания левитов; развёрнутая формулировка яснее для современного читателя.'
- source_word: לַהֲבִיאָם לִירוּשָׁלִָם
  choice: чтобы привести их в Иерусалим
  rationale: Каузативная форма בוא прямо выражает приведение левитов в город.
- source_word: לַעֲשֹׂת חֲנֻכָּה וְשִׂמְחָה
  choice: и совершить освящение с радостью
  rationale: Оборот буквально означает «совершить освящение и радость»; русское «с радостью» естественно передаёт обстоятельственное значение второго существительного.
- source_word: וּבְתוֹדוֹת וּבְשִׁיר
  choice: благодарственными песнями и пением
  rationale: תּוֹדוֹת означает выражения благодарения; в музыкально-обрядовом контексте «благодарственные песни» естественно, тогда как שִׁיר отдельно передаётся как «пение».
- source_word: מְצִלְתַּיִם נְבָלִים וּבְכִנֹּרוֹת
  choice: под звуки тарелок, арф и лир
  rationale: Перечислены ударный и два различных струнных инструмента. «Под звуки» естественно связывает инструменты с пением, не меняя состава перечня.
