lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: от Билги
  rationale: В перечне глав священнических родов предлог לְ обозначает принадлежность представителя к соответствующему роду. По-русски это естественно передаётся родительным сочетанием с «от»; имя Билга склоняется.
- source_word: שַׁמּוּעַ
  choice: Шаммуа
  rationale: Собственное имя представителя рода передано транслитерацией, близкой к еврейской форме.
- source_word: לִֽ/שְׁמַעְיָה
  choice: от Шемаии
  rationale: Та же конструкция с לְ передаёт принадлежность названного далее представителя к роду Шемаии; форма родительного падежа естественна для русского перечня.
- source_word: יְהוֹנָתָן
  choice: Иехонатан
  rationale: Сохранена полная еврейская форма имени יְהוֹנָתָן, а не сокращённая форма Ионатан.
