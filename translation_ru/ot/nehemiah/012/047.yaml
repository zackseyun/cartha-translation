base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/047.yaml
  text: And all Israel[a], in the days of Zerubbabel and in the days of Nehemiah, gave the portions for the singers and the gatekeepers, as each day required; and they set apart the consecrated portions for the Levites[c][b], and the Levites set apart the consecrated portions for the sons of Aaron.
translation:
  language: ru
  text: И весь Израиль во дни Зоровавеля и во дни Неемии давал певцам и привратникам положенное на каждый день[a]. И весь Израиль отделял посвящённые доли для левитов, а левиты отделяли посвящённые доли для сыновей Аарона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дело дня в его день», то есть то, что требовалось на каждый день.'
    reason: Сохранение образа и буквальной формы еврейской идиомы.
  - marker: b
    text: То есть священникам из рода Аарона.
    reason: Пояснение традиционного родового обозначения священников.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: И весь Израиль
  rationale: Сохранено собирательное заветное наименование народа; в современном русском оно звучит естественно и торжественно.
- source_word: בִּימֵי זְרֻבָּבֶל וּבִימֵי נְחֶמְיָה
  choice: во дни Зоровавеля и во дни Неемии
  rationale: Повтор предлога сохранён как смысловой акцент исторического резюме; умеренно высокий оборот «во дни» уместен в библейском повествовании.
- source_word: נֹתְנִים
  choice: давал
  rationale: Причастная форма обозначает регулярное действие в прошлом; русское несовершенное прошедшее передаёт его обычный, продолжительный характер. Единственное число согласуется с собирательным «весь Израиль».
- source_word: מְנָיוֹת
  choice: доли
  rationale: Речь идёт об установленных долях содержания храмовых служителей; «доли» кратко передаёт распределительный смысл.
- source_word: הַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: певцам и привратникам
  rationale: Это устойчивые названия двух групп храмовых служителей.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: сколько полагалось на каждый день
  rationale: Еврейская идиома указывает на установленную ежедневную потребность; перевод передаёт смысл без неестественной кальки.
- source_word: וּמַקְדִּשִׁים לַלְוִיִּם
  choice: Народ отделял посвящённые доли левитам
  rationale: В храмовом контексте קדשׁ сохраняет значение отделения как святыни. «Народ» проясняет подразумеваемое подлежащее, а «посвящённые доли» — подразумеваемый объект, очевидный из контекста распределения.
- source_word: וְהַלְוִיִּם מַקְדִּשִׁים לִבְנֵי אַהֲרֹן
  choice: а левиты отделяли посвящённые доли сынам Аарона
  rationale: Сохранены параллелизм действий и буквальное родовое обозначение священников; подразумеваемый объект выражен ради ясности русского текста.
theological_decisions:
- issue: Значение מַקְדִּשִׁים в контексте храмового содержания
  choice: «отделяли посвящённые доли» — речь о долях, выделяемых как святыня левитам, а затем священникам
  alternative: «давали» или «вносили» левитам и священникам
  rationale: Корень קדשׁ несёт значение святости и отделения; административный контекст не требует сводить его к обычной передаче имущества. Добавленное существительное восстанавливает подразумеваемый объект, не устраняя сакрального оттенка.
- issue: Обозначение בְנֵי אַהֲרֹן
  choice: «сынам Аарона»
  alternative: «священникам из рода Аарона»
  rationale: Формальное родовое выражение сохранено в основном тексте, а его служебное значение пояснено в примечании без конфессионального расширения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Синтаксис упрощён разделением длинной еврейской цепочки на два предложения; связь действий сохранена. Формы «Зоровавель», «Неемия», «левиты» и «сыны Аарона» соответствуют устоявшейся русской библейской традиции.
