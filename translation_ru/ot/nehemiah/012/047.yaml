revisions:
- from: И весь Израиль во дни Зоровавеля и во дни Неемии давал доли певцам и привратникам — сколько полагалось на каждый день[a]. Народ отделял посвящённые доли левитам, а левиты отделяли посвящённые доли сынам Аарона[b].
  to: И весь Израиль во дни Зоровавеля и во дни Неемии давал певцам и привратникам положенное на каждый день[a]. И весь Израиль отделял посвящённые доли для левитов, а левиты отделяли посвящённые доли для сыновей Аарона[b].
  rationale: 'Повторено «весь Израиль» как подразумеваемое подлежащее второго действия, чтобы сохранить связь с исходным текстом и избежать ненужной подстановки «Народ». «Доли» при первом упоминании опущены: «давал певцам и привратникам положенное на каждый день» по-русски однозначно обозначает их назначенное содержание и точнее связывает его с ежедневной нормой. Контекстуально восполненный объект «посвящённые доли» во второй части сохранён, поскольку он делает русскую фразу грамматически ясной и передаёт оттенок קדשׁ.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T15:06:28Z'
review_pass:
