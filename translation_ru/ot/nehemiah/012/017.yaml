lexical_decisions:
- source_word: לַ/אֲבִיָּה
  choice: от Авии
  rationale: Предлог ל в кратком перечне указывает на принадлежность или соотнесённость с названным священническим родом. Русское «от Авии» естественно передаёт структуру списка, не добавляя отсутствующих в еврейском тексте слов.
- source_word: זִכְרִי
  choice: Зихрий
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: לְ/מִנְיָמִין
  choice: от Миниамина
  rationale: Предлог ל передан так же, как в первой части стиха, чтобы сохранить параллелизм и краткость перечня.
- source_word: לְ/מוֹעַדְיָה
  choice: от Моадии
  rationale: Передана огласованная форма масоретского текста מוֹעַדְיָה; предложный оборот сохраняет связь с перечислением священнических родов.
- source_word: פִּלְטָי
  choice: Пилтай
  rationale: Личное имя транслитерировано; в структуре перечня оно соотнесено с Моадией.
