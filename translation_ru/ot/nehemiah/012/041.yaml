- source_word: זְכַרְיָה
  choice: Захария
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: חֲנַנְיָה
  choice: Ханания
  rationale: Форма передаёт начальный еврейский гортанный согласный и соответствует современной русской библейской транслитерации.
