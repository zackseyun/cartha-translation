  text: and Maaseiah[a], Shemaiah, Eleazar, Uzzi, Jehohanan, Malkijah, Elam, and Ezer. And the singers made their voices heard[b], with Izrahiah the overseer.
translation:
  language: ru
  text: и Маасея, Шемаия, Елеазар, Уззий, Иоханан, Малхия, Елам и Езер. Певцы пели во весь голос[a], а их распорядителем был Израхия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дали себя услышать»; то есть пели громко.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «надзиратель», «руководитель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂיָה
  choice: Маасея
  rationale: Личное имя передано в форме, укоренившейся в русской библейской традиции.
- source_word: שְׁמַעְיָה
  choice: Шемаия
  rationale: Транслитерация еврейского личного имени в естественной для современного русского читателя форме.
- source_word: אֶלְעָזָר
  choice: Елеазар
  rationale: Традиционная русская форма библейского имени.
- source_word: עֻזִּי
  choice: Уззий
  rationale: Традиционная русская передача личного имени.
- source_word: יְהוֹחָנָן
  choice: Иоханан
  rationale: Передаёт полную форму еврейского имени и соответствует распространённому русскому библейскому употреблению.
- source_word: מַלְכִּיָּה
  choice: Малхия
  rationale: Читаемая русская транслитерация личного имени.
- source_word: עֵילָם
  choice: Елам
  rationale: В данном контексте это личное имя, а не название области.
- source_word: עָזֶר
  choice: Езер
  rationale: Традиционная русская передача личного имени.
- source_word: וַיַּשְׁמִיעוּ
  choice: пели во весь голос
  rationale: Каузатив глагола שמע буквально выражает действие «дать услышать»; в контексте певцов эта естественная русская формулировка передаёт громкое, отчётливо слышимое пение.
- source_word: הַמְשֹׁרְרִים
  choice: певцы
  rationale: Прямое и естественное обозначение служителей, исполнявших пение.
- source_word: יִזְרַחְיָה
  choice: Израхия
  rationale: Транслитерация личного имени в соответствии с русской библейской традицией.
- source_word: הַפָּקִיד
  choice: распорядитель
  rationale: Слово обозначает назначенного ответственного или надзирающего; «распорядитель» естественно звучит в контексте организации храмового пения и не преувеличивает должностной ранг.
