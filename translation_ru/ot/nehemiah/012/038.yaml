base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/038.yaml
  text: And the second thanksgiving choir was going to the left[a], and I followed behind it, with half of the people on the wall, from above the Tower of the Ovens as far as the Broad Wall.
translation:
  language: ru
  text: А вторая благодарственная процессия[a] шла налево; я шёл за ней, а половина народа — по стене, от места над Башней печей до Широкой стены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «второй хор благодарения» или «вторая процессия, возносившая благодарение». Еврейское слово здесь может обозначать участвующую в торжественном шествии группу, а не только пение как таковое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתּוֹדָה הַשֵּׁנִית
  choice: вторая благодарственная процессия
  rationale: В данном повествовании תּוֹדָה обозначает не только благодарение как действие, но и организованную группу, участвующую в торжественном шествии при освящении стены. «Благодарственная процессия» естественно передаёт церемониальный контекст, не сводя группу исключительно к хору.
- source_word: הַהוֹלֶכֶת
  choice: шла
  rationale: Причастная форма изображает продолжающееся движение процессии; русское прошедшее несовершенного вида сохраняет этот описательный оттенок.
- source_word: לְמוֹאל
  choice: налево
  rationale: 'Передано прямое пространственное значение: вторая группа двигалась в левую сторону, противоположно другой процессии.'
- source_word: אַחֲרֶיהָ
  choice: за ней
  rationale: Форма указывает на следование позади процессии; «за ней» естественно выражает это пространственное отношение по-русски.
- source_word: חֲצִי הָעָם
  choice: половиной народа
  rationale: Простое обозначение половины собравшегося народа, сопровождавшей эту процессию.
- source_word: מֵעַל לְהַחוֹמָה
  choice: по стене
  rationale: В контексте шествия имеется в виду движение по верхней части городской стены; «по стене» звучит естественно и не создаёт ошибочного представления о движении над нею.
- source_word: מֵעַל לְמִגְדַּל הַתַּנּוּרִים
  choice: от места над Башней печей
  rationale: Сохраняется пространственное указание на участок стены выше или над названной башней, а начальная точка маршрута ясно выражена по-русски.
- source_word: הַחוֹמָה הָרְחָבָה
  choice: Широкая стена
  rationale: Сочетание, вероятно, служит названием известного участка иерусалимской стены, поэтому оформлено как топоним.
