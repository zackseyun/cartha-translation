base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/007.yaml
  text: Sallu[a], Amok, Hilkiah[c][b], Jedaiah—these were the heads of the priests and their brothers in the days of Jeshua.
translation:
  language: ru
  text: Саллу, Амок, Хелкия, Иедаия — это были главы священников[a] и их братьев[b] во дни Иешуа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть руководителями священников; буквально: «главами священников».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их родичей» либо «их собратьев-священников»; в еврейском тексте буквально: «их братьев».'
    reason: lexical_alternative
  - marker: c
    text: Иешуа — сокращённая форма имени Иошуа (Иисус Навин), употреблявшаяся в послепленный период.
    reason: cultural_note
lexical_decisions:
- source_word: סַלּוּ
  choice: Саллу
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: עָמוֹק
  choice: Амок
  rationale: Личное имя транслитерировано; форма соответствует русской традиции передачи имени.
- source_word: חִלְקִיָּה
  choice: Хелкия
  rationale: Личное имя передано традиционной русской библейской формой.
- source_word: יְדַעְיָה
  choice: Иедаия
  rationale: Личное имя передано традиционной русской библейской формой.
- source_word: אֵלֶּה
  choice: они
  rationale: В именном предложении после перечня имён русское «они были» звучит естественно и передаёт указание на названных лиц.
- source_word: רָאשֵׁי
  choice: главами
  rationale: Сохраняет образное значение «главы» как обозначение руководителей и не вводит возможного позднейшего технического смысла выражения «первосвященники» или «первосвященнические начальники».
- source_word: הַכֹּהֲנִים
  choice: священников
  rationale: Прямое соответствие определённому существительному во множественном числе.
- source_word: וַאֲחֵיהֶם
  choice: и их братьев
  rationale: Сохраняет буквальное родственное обозначение и конструкцию, согласно которой названные лица были главами священников и их братьев; контекст допускает значение родичей или собратьев-священников.
- source_word: בִּימֵי
  choice: во дни
  rationale: Точная и всё ещё понятная русская передача устойчивого древнееврейского временного оборота; поддерживает достоинство библейского регистра.
- source_word: יֵשׁוּעַ
  choice: Иешуа
  rationale: Послепленная краткая форма имени передана как «Иешуа», что отличает её от более полной формы «Иисус Навин»/«Иошуа» и соответствует контексту Ездры—Неемии.
theological_decisions:
- issue: Объём зависимой конструкции при רָאשֵׁי
  choice: «главами священников и их братьев»
  alternative: «главами священников, а также их братьями»
  rationale: Еврейская конструкция естественно допускает понимание, что перечисленные были руководителями обеих названных групп. Выбранная формулировка сохраняет эту синтаксическую связь и не превращает «братьев» в дополнительную группу самих руководителей.
- issue: Значение אֲחֵיהֶם в священническом перечне
  choice: «их братьев»
  alternative: «их родичей» или «их собратьев-священников»
  rationale: Источник употребляет мужское множественное «братья». Контекст может указывать на родственных или сослужащих священников, но основной текст не устраняет эту смысловую широту.
- issue: Передача רָאשֵׁי как обозначения руководства
  choice: «главами»
  alternative: «руководителями» или «начальниками»
  rationale: Буквальная метафора понятна по-русски и не вносит представления о позднейшей должности «первосвященников».
translation_notes:
  register: Современный литературный русский с умеренно традиционным библейским оборотом «во дни». Перечень имён дан без лишних пояснений в основном тексте; лексическая и историко-культурная неоднозначность вынесена в краткие примечания.
