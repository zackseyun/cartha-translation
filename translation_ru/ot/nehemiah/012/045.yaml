source:
  edition: WLC
  text: וַֽ/יִּשְׁמְר֞וּ מִשְׁמֶ֤רֶת אֱלֹֽהֵי/הֶם֙ וּ/מִשְׁמֶ֣רֶת הַֽ/טָּהֳרָ֔ה וְ/הַ/מְשֹׁרְרִ֖ים וְ/הַ/שֹּׁעֲרִ֑ים כְּ/מִצְוַ֥ת דָּוִ֖יד שְׁלֹמֹ֥ה בְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/012/045.yaml
  text: And they kept the charge of their God and the charge of purification[a], and so did the singers and the gatekeepers[b], according to the command of David and Solomon his son.
translation:
  language: ru
  text: Они исполняли обязанности перед своим Богом и обязанности по очищению[a]; певцы и привратники также исполняли свои обязанности[b] — по повелению Давида и его сына Соломона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обязанности по поддержанию чистоты» либо «обязанности, связанные с очищением».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза о певцах и привратниках эллиптична: сказуемое при них не повторено. Вероятно, имеется в виду, что и они исполняли порученные им обязанности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְרוּ מִשְׁמֶרֶת
  choice: исполняли обязанности
  rationale: Сочетание שׁמר с מִשְׁמֶרֶת обозначает исполнение вверенных обязанностей. Русское «исполняли обязанности» естественно передаёт эту идиому, сохраняя смысл ответственного служения.
- source_word: אֱלֹהֵיהֶם
  choice: перед своим Богом
  rationale: Возвратное притяжательное местоимение «своим» передаёт еврейский местоименный суффикс «их», а предлог «перед» естественно выражает направленность обязанностей по отношению к Богу.
- source_word: וּמִשְׁמֶרֶת הַטָּהֳרָה
  choice: и обязанности по очищению
  rationale: הַטָּהֳרָה в храмовом контексте относится к обрядовому очищению или поддержанию чистоты. Формулировка «обязанности по очищению» сохраняет культовый смысл и не сводит его к нравственной чистоте.
- source_word: וְהַמְשֹׁרְרִים וְהַשֹּׁעֲרִים
  choice: певцы и привратники также исполняли свои обязанности
  rationale: Еврейская конструкция эллиптична и не повторяет сказуемое. Его восполнение делает русский текст понятным, а «также» показывает, что названные группы участвовали в исполнении порученного служения.
- source_word: שֹׁעֲרִים
  choice: привратники
  rationale: Это общепринятое и точное обозначение храмовых служителей, отвечавших за ворота.
- source_word: כְּמִצְוַת
  choice: по повелению
  rationale: מִצְוָה здесь означает авторитетное распоряжение об устройстве храмового служения. «По повелению» звучит естественно и достойно в современном литературном русском.
- source_word: דָּוִיד שְׁלֹמֹה בְנוֹ
  choice: Давида и его сына Соломона
  rationale: Такой порядок слов ясно показывает, что «его сын» относится к Соломону, и естественнее звучит по-русски, не меняя смысла оригинала.
theological_decisions:
- issue: Значение הַטָּהֳרָה в контексте храмового служения
  choice: очищение
  alternative: чистота; обряд очищения
  rationale: Контекст обязанностей левитов указывает прежде всего на обрядовую сферу. «Очищение» сохраняет этот оттенок, не привнося более поздних конфессиональных толкований.
- issue: Синтаксическая роль певцов и привратников
  choice: они также исполняли свои обязанности
  alternative: они включены в перечень лиц или служб без восполнения сказуемого
  rationale: В еврейском тексте фраза эллиптична. Контекст поддерживает понимание певцов и привратников как дополнительных субъектов исполнения установленных обязанностей, однако неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировки понятны широкому читателю; синтаксический эллипсис оригинала раскрыт в основном тексте и отмечен в сноске.
