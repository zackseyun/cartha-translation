lexical_decisions:
- source_word: לְ/סַלַּי
  choice: от Саллая
  rationale: Предлог לְ в перечне связывает названного представителя со священническим домом Саллая. В русском перечне естественно передать эту связь предлогом «от», не уточняя её сверх того, что выражено в еврейском тексте.
- source_word: קַלָּי
  choice: Каллай
  rationale: Имя передано транслитерацией с удвоенным «л» и окончанием «-ай», отражающими еврейскую форму.
- source_word: לְ/עָמוֹק
  choice: от Амока
  rationale: Как и в первой части стиха, לְ обозначает принадлежность или связь с названным священническим домом; «от Амока» сохраняет краткую форму списка.
- source_word: עֵבֶר
  choice: Эвер
  rationale: Транслитерация непосредственно отражает еврейское עֵבֶר; начальное «Э» передаёт гласное звучание имени без добавления согласного, отсутствующего в еврейском написании.
