lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: В переписном списке слово буквально означает «сыновья», но обозначает потомков или членов рода; форма «сыновей Адина» естественно продолжает подразумеваемую конструкцию списка и сохраняет его формальный характер.
- source_word: עָדִין
  choice: Адина
  rationale: Личное или родовое имя передано традиционной русской транслитерацией и поставлено в родительный падеж после слова «сыновей».
- source_word: שֵׁשׁ מֵאוֹת
  choice: шестьсот
  rationale: Стандартное еврейское обозначение количества передано обычной русской формой числительного.
- source_word: חֲמִשִּׁים וַחֲמִשָּׁה
  choice: пятьдесят пять
  rationale: Еврейское «пятьдесят и пять» передано нормативным современным русским числительным без изменения числа.
