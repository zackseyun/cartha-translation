base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/005.yaml
  text: 'Then my God put it into my heart to assemble the nobles[a], the officials, and the people to be enrolled by genealogy. And I found the book of the genealogy of those who came up first[b], and I found written in it:'
translation:
  language: ru
  text: 'И мой Бог вложил мне в сердце собрать знатных, начальников и народ для внесения в родословные списки.[a] Я нашёл книгу родословий тех, кто пришёл вначале,[b] и нашёл в ней следующую запись:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы зарегистрировать их по родословиям». Еврейское слово означает официальное внесение в списки на основании происхождения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тех, кто поднялся вначале».'
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּתֵּן אֱלֹהַי אֶל לִבִּי
  choice: И мой Бог вложил мне в сердце
  rationale: Сохраняет образ еврейского выражения о внутреннем побуждении, исходящем от Бога, и естественно звучит по-русски, не уточняя способ этого побуждения.
- source_word: וָאֶקְבְּצָה
  choice: собрать
  rationale: Инфинитив передаёт содержание вложенного Богом намерения и естественно связывается с предшествующим оборотом.
- source_word: הַחֹרִים
  choice: знатных
  rationale: В административном контексте Неемии слово обозначает представителей общественной знати; субстантивированное «знатных» понятно современному читателю.
- source_word: הַסְּגָנִים
  choice: начальников
  rationale: Слово обозначает должностных лиц или местных правителей. «Начальники» сохраняет различие между ними и знатью, не вводя чрезмерно специального титула.
- source_word: לְהִתְיַחֵשׂ
  choice: для внесения в родословные списки
  rationale: Передаёт официальную регистрацию по происхождению и сохраняет пассивно-возвратный смысл формы, не сводя действие к обычной переписи.
- source_word: סֵפֶר הַיַּחַשׂ
  choice: родословную книгу
  rationale: Естественное русское обозначение письменного реестра, в котором были зафиксированы родословные сведения.
- source_word: הָעוֹלִים בָּרִאשׁוֹנָה
  choice: тех, кто пришёл сюда прежде
  rationale: Передаёт первую группу прибывших в Иудею; «сюда» проясняет ориентированное на место повествования движение, а примечание сохраняет буквальный образ восхождения.
- source_word: וָאֶמְצָא כָתוּב בּוֹ
  choice: 'и нашёл в ней следующую запись:'
  rationale: Естественно вводит содержание найденного документа в последующих стихах, сохраняя повтор глагола «нашёл».
theological_decisions:
- issue: Характер Божьего побуждения Неемии
  choice: мой Бог вложил мне в сердце
  alternative: Бог вдохновил меня
  rationale: Еврейский текст утверждает Божью инициативу и внутреннее побуждение, но не определяет его как особый вид откровения или богодухновения; выбранная формулировка сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис упрощён лишь настолько, чтобы длинная еврейская фраза оставалась ясной; повтор «нашёл» сохранён как особенность исходного текста.
