lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: Форма сопряжённого множественного числа от בֵּן в родословном перечне обозначает членов рода или потомков; «сыновей» сохраняет краткость и формальную структуру еврейского текста.
- source_word: עֵילָם
  choice: Елама
  rationale: Собственное имя передано традиционной русской транслитерацией и поставлено в родительном падеже после слова «сыновей»; здесь это имя рода, а не обозначение страны Элам.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: 1 254
  rationale: Еврейская числовая последовательность означает 1 254. Цифровая запись с пробелом как разделителем тысяч соответствует современной русской типографике и удобна для перечня.
