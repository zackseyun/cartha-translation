id: NEH.7.7
reference: Nehemiah 7:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הַ/בָּאִ֣ים עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְחֶמְיָ֡ה עֲ֠זַרְיָה רַֽעַמְיָ֨ה נַחֲמָ֜נִי מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפֶּ֥רֶת בִּגְוַ֖י נְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/007.yaml
  text: 'those who came with Zerubbabel were Jeshua[a], Nehemiah, Azariah, Raamiah, Nahamani, Mordecai, Bilshan, Mispereth, Bigvai, Nehum, and Baanah[c][b]. The number of the men of the people of Israel:'
translation:
  language: ru
  text: 'пришедшие с Зоровавелем: Иешуа, Неемия, Азария, Раамия[a], Нахамани, Мардохей, Билшан, Мисперет, Бигвай, Нехум[b] и Баана. Число мужчин из народа Израиля[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В параллельном списке в Езд 2:2 это имя дано в форме «Реелаия».
    reason: alternative_reading
  - marker: b
    text: В параллельном списке в Езд 2:2 это имя дано в форме «Рехум».
    reason: alternative_reading
  - marker: c
    text: Эта фраза вводит данные переписи, перечисление которых продолжается в следующем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: הַבָּאִים עִם
  choice: пришедшие с
  rationale: Субстантивированное причастие с предлогом сопровождения естественно передаётся по-русски как «пришедшие с»; форма согласована с предшествующим контекстом списка.
- source_word: זְרֻבָּבֶל
  choice: Зоровавель
  rationale: Устоявшаяся русская библейская форма имени, понятная современному читателю.
- source_word: יֵשׁוּעַ
  choice: Иешуа
  rationale: Передаёт послепленную форму еврейского имени и отличает её от традиционной русской формы «Иисус».
- source_word: רַעַמְיָה
  choice: Раамия
  rationale: Основной текст следует масоретскому чтению именно в Неем 7:7; отличающаяся форма параллельного списка вынесена в сноску.
- source_word: נַחֲמָנִי
  choice: Нахамани
  rationale: Транслитерация имени согласно огласовке масоретского текста без искусственной русификации окончания.
- source_word: מָרְדֳּכַי
  choice: Мардохей
  rationale: Устоявшаяся русская библейская форма имени; текст не отождествляет этого человека с персонажем книги Есфирь.
- source_word: מִסְפֶּרֶת
  choice: Мисперет
  rationale: Транслитерация собственного имени по масоретской форме; конечная согласная передана как «т».
- source_word: נְחוּם
  choice: Нехум
  rationale: Основной текст сохраняет форму Неем 7:7, не гармонизируя её с параллельным списком в Езд 2:2.
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: Число мужчин из народа Израиля
  rationale: Сохраняется явное мужское обозначение אַנְשֵׁי, а конструкция с «из» звучит естественнее по-русски, чем буквальное «мужчин народа».
theological_decisions:
- issue: Гендерно маркированное выражение אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: мужчин из народа Израиля
  alternative: людей Израиля; народа Израиля
  rationale: Еврейский текст прямо употребляет существительное мужского рода «мужчины». Перевод сохраняет это значение, не делая дополнительных выводов о составе всех переселенцев.
- issue: Расхождения имён с параллельным списком в Езд 2:2
  choice: В основном тексте сохранены формы Раамия и Нехум по WLC Неем 7:7
  alternative: Реелаия и Рехум по Езд 2:2
  rationale: Перевод исходит из текста переводимого стиха и не сглаживает различия между параллельными списками; значимые варианты отмечены в сносках.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис списка сделан кратким и ясным; двоеточие в конце сохраняет связь с последующими стихами. Для широко известных имён использованы устоявшиеся русские библейские формы, а менее известные имена переданы близкой транслитерацией.
