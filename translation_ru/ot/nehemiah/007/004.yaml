lexical_decisions:
- source_word: וְהָעִיר
  choice: Город
  rationale: Определённая форма означает «город». Начальный союз וְ в данном описательном предложении не требует отдельной передачи в русском тексте.
- source_word: רַחֲבַת יָדַיִם
  choice: просторен
  rationale: Идиома, буквально «широк руками», обозначает большую ширину и простор; «просторен» естественно передаёт её пространственный смысл.
- source_word: וּגְדוֹלָה
  choice: и велик
  rationale: Прилагательное характеризует размеры города. «Велик» сохраняет отличие от предшествующего указания на простор и звучит достойно и понятно.
- source_word: וְהָעָם מְעַט בְּתוֹכָהּ
  choice: но народа в нём было мало
  rationale: מְעַט указывает на малое число людей, а בְּתוֹכָהּ — на их нахождение внутри города. Союз «но» естественно выражает подразумеваемый контраст между величиной города и малочисленностью населения.
- source_word: וְאֵין בָּתִּים בְּנוּיִם
  choice: и построенных домов не было
  rationale: Конструкция אֵין выражает отсутствие, а пассивное причастие בְּנוּיִם буквально означает «построенные». Перевод не добавляет значения «восстановлены», которого само слово явно не выражает.
