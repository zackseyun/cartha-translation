lexical_decisions:
- source_word: הַלְוִיִּם
  choice: Левиты
  rationale: Определённое существительное во множественном числе открывает очередную группу переписного списка; именная конструкция без добавленного глагола сохраняет форму перечня.
- source_word: בְּנֵי יֵשׁוּעַ
  choice: сыновья Иешуа
  rationale: בְּנֵי в родословном контексте обозначает принадлежность к семейной линии. Формальное «сыновья» сохраняет структуру еврейского текста, а имя יֵשׁוּעַ передано как «Иешуа», без смешения с более полной формой имени Иехошуа.
- source_word: לְקַדְמִיאֵל
  choice: из рода Кадмиэля
  rationale: Предлог לְ здесь выражает связь с родовой группой. Буквальное «Кадмиэля» в русском перечне было бы неясным, поэтому выбран естественный эквивалент, не превращающий Кадмиэля в отдельную группу.
- source_word: לִבְנֵי לְהוֹדְוָה
  choice: из сыновей Ходавы
  rationale: Сохранена вложенная родословная формула с повторным לְ и конструкцией בְּנֵי; «сыновья» может обозначать как непосредственных сыновей, так и более широкую линию потомков.
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: семьдесят четыре человека
  rationale: Число передано в обычной современной форме; слово «человека» добавлено для естественности русского переписного перечня и не меняет смысла.
