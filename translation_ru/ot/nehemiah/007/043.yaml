  text: 'Левиты: сыновья Иешуа, принадлежавшие Кадмиилу, из сыновей Ходавы[a] — семьдесят четыре человека.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из потомков Ходавы». Еврейское выражение буквально означает «из сыновей Ходавы», но в родословиях оно может обозначать более широкую семейную линию, а не только непосредственных сыновей.'
