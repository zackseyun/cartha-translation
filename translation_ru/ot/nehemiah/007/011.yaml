  rationale: Предлог ל здесь, вероятно, вводит подразделение рода Пахат-Моава; «из сыновей» естественно передаёт принадлежность к этой родовой группе, не устраняя возможной неоднозначности связи.
- source_word: יֵשׁוּעַ
