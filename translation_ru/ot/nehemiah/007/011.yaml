  rationale: Передана именно краткая послепленная форма имени יֵשׁוּעַ, а не полная форма «Иисус Навин» или «Иегошуа».
- source_word: וְיוֹאָב
  choice: и Иоава
  rationale: Союз передан прямо, а личное имя — принятой русской библейской формой.
- source_word: אַלְפַּיִם וּשְׁמֹנֶה מֵאוֹת שְׁמֹנָה עָשָׂר
