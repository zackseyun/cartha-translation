  text: 'the sons of Ater[a], of Hezekiah: ninety-eight.'
translation:
  language: ru
  text: сыновей Атера[a], из рода Езекии, — девяносто восемь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомков Атера, а именно из рода Езекии»; возможно, речь идёт об особой ветви рода Атера.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: В переписных и родословных списках конструктивная форма множественного числа от בֵּן может обозначать как непосредственных сыновей, так и потомков или членов рода. «Сыновей» сохраняет форму еврейского списка, а примечание уточняет возможный более широкий смысл.
- source_word: אָטֵר
  choice: Атера
  rationale: Собственное имя передано традиционной русской библейской транслитерацией.
- source_word: לְחִזְקִיָּה
  choice: из рода Езекии
  rationale: Предлог לְ здесь, вероятнее всего, указывает на принадлежность к ветви рода, связанной с Езекией. Такая передача естественна по-русски и не создаёт неясного сочетания двух имён.
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: девяносто восемь
  rationale: Количественное числительное передано в обычной современной русской форме.
