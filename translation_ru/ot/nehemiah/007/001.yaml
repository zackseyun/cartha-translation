base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/001.yaml
  text: When the wall had been built and I had set up the doors[a], the gatekeepers, the singers[b], and the Levites were appointed.
translation:
  language: ru
  text: Когда стена была построена и я установил двери, были назначены[a] привратники, певцы и левиты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были определены на службу» либо «были внесены в список»; еврейский глагол допускает более широкое административное значение, чем только формальное назначение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: Вводит временное обстоятельство; в современном русском естественно передаётся союзом «когда» без буквального «и было».
- source_word: נִבְנְתָה הַחוֹמָה
  choice: стена была построена
  rationale: Нифаль глагола בנה выражает страдательное значение. «Построена» сохраняет форму исходного текста и не добавляет контекстуально возможное, но прямо не выраженное значение «восстановлена».
- source_word: וָאַעֲמִיד הַדְּלָתוֹת
  choice: я установил двери
  rationale: Порода хифиль глагола עמד здесь означает поставить или установить; דְּלָתוֹת обозначает двери или дверные створки. Такой перевод точен и естественен, не добавляя отсутствующего в тексте слова «ворота».
- source_word: וַיִּפָּקְדוּ
  choice: были назначены
  rationale: Нифаль глагола פקד в административном контексте может означать назначение, определение на службу или внесение в список; «были назначены» наиболее естественно передаёт смысл в данном контексте.
- source_word: הַשּׁוֹעֲרִים
  choice: привратники
  rationale: Обычное обозначение служителей, отвечавших за входы или ворота; традиционное русское слово остаётся понятным современному читателю.
- source_word: הַמְשֹׁרְרִים
  choice: певцы
  rationale: Прямое обозначение певцов, в данном контексте — служивших при храме.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Устоявшееся русское наименование данной родоплеменной и религиозной группы.
