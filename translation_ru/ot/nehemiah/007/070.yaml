  text: וּ/מֵֽ/רָאשֵׁ֣י הָֽ/אָב֗וֹת נָֽתְנוּ֙ לְ/אוֹצַ֣ר הַ/מְּלָאכָ֔ה זָהָ֕ב דַּרְכְּמוֹנִ֖ים שְׁתֵּ֣י רִבּ֑וֹת וְ/כֶ֕סֶף מָנִ֖ים אַלְפַּ֥יִם וּ/מָאתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/070.yaml
  text: 'And some of the heads of the fathers’ houses gave to the treasury for the work: twenty thousand gold darics and two thousand two hundred minas of silver[a][b][c].'
translation:
  language: ru
  text: И некоторые из глав родовых домов[b] дали в сокровищницу на работы двадцать тысяч золотых дариков[a] и две тысячи двести мин серебра[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Дарик — персидская золотая монета.
    reason: cultural_note
  - marker: b
    text: 'Или: «из глав родовых домов».'
    reason: lexical_alternative
  - marker: c
    text: Мина — древняя единица веса, а также соответствующей денежной стоимости.
    reason: cultural_note
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: И некоторые из глав родовых домов
  rationale: Предлог מִן перед רָאשֵׁי имеет партитивный смысл — «из числа глав», поэтому по-русски естественно «некоторые из глав». Выражение «родовые дома» сохраняет историческую семейно-родовую структуру, обозначенную הָאָבוֹת.
- source_word: נָתְנוּ
  choice: дали
  rationale: Прямо передаёт простую форму qal и не добавляет оттенков, присущих словам «пожертвовали» или «внесли».
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: в сокровищницу на работы
  rationale: אוֹצָר здесь означает хранилище ценностей, а הַמְּלָאכָה — дело или проект, для которого предназначались средства. «На работы» естественно выражает целевое назначение.
- source_word: זָהָב דַּרְכְּמוֹנִים שְׁתֵּי רִבּוֹת
  choice: двадцать тысяч золотых дариков
  rationale: דַּרְכְּמוֹנִים обозначает персидские золотые монеты — дарики; שְׁתֵּי רִבּוֹת буквально «два десятка тысяч», то есть двадцать тысяч.
- source_word: וְכֶסֶף מָנִים אַלְפַּיִם וּמָאתָיִם
  choice: и две тысячи двести мин серебра
  rationale: מָנִים — множественное число древней весовой и денежной единицы «мина»; числительное передано в нормативной современной русской форме.
