source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר נָתְנוּ֮ שְׁאֵרִ֣ית הָ/עָם֒ זָהָ֗ב דַּרְכְּמוֹנִים֙ שְׁתֵּ֣י רִבּ֔וֹא וְ/כֶ֖סֶף מָנִ֣ים אַלְפָּ֑יִם וְ/כָתְנֹ֥ת כֹּֽהֲנִ֖ים שִׁשִּׁ֥ים וְ/שִׁבְעָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/071.yaml
  text: And what the rest of the people gave was twenty thousand gold darics[a], two thousand minas of silver[c][b], and sixty-seven priests’ tunics.
translation:
  language: ru
  text: А остальные из народа дали двадцать тысяч золотых дариков[a], две тысячи мин серебра[b] и шестьдесят семь священнических хитонов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Дарик — персидская золотая монета.
    reason: cultural_note
  - marker: b
    text: Мина — древняя мера веса, а также соответствующая ей денежная величина.
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲשֶׁר נָתְנוּ
  choice: А ... дали
  rationale: Возобновляющая относительная конструкция вводит следующий пункт перечня. В русском естественно передать её самостоятельным предложением с союзом «а»; глагол נתן сохраняет обычное значение «дать».
- source_word: שְׁאֵרִית הָעָם
  choice: остальные из народа
  rationale: В данном перечне выражение обозначает оставшуюся группу жертвователей, а не обязательно богословски значимый «остаток».
- source_word: זָהָב דַּרְכְּמוֹנִים
  choice: золотых дариков
  rationale: «Дарик» — исторически точное название персидской золотой монеты; родительный падеж требуется после числительного.
- source_word: שְׁתֵּי רִבּוֹא
  choice: двадцать тысяч
  rationale: Буквально «две десятитысячные группы»; нормативная современная передача числа — «двадцать тысяч».
- source_word: וְכֶסֶף מָנִים אַלְפָּיִם
  choice: две тысячи мин серебра
  rationale: מָנִים — множественное число древней единицы веса и стоимости «мина». Русский порядок слов ясно связывает единицу с серебром.
- source_word: וְכָתְנֹת כֹּהֲנִים
  choice: священнических хитонов
  rationale: כֻּתֹּנֶת обозначает длинную нижнюю одежду, рубаху или хитон. «Священнические хитоны» кратко и естественно передаёт принадлежность одежды священникам.
- source_word: שִׁשִּׁים וְשִׁבְעָה
  choice: шестьдесят семь
  rationale: Нормативная современная русская форма числительного.
theological_decisions:
- issue: Значение שְׁאֵרִית как «остаток» или «остальные»
  choice: остальные из народа
  alternative: остаток народа
  rationale: Контекст представляет административный перечень пожертвований разных групп. Поэтому здесь наиболее вероятно количественное значение — люди, не упомянутые ранее; перевод не навязывает богословскую тему верного остатка.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и повествовательно-инвентарный. Исторические названия денежных и весовых единиц сохранены ради точности и кратко пояснены в сносках.
