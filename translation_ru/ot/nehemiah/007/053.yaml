- source_word: בְּנֵי
  choice: сыновья
  rationale: Сохраняет повторяющуюся формулу еврейского списка; в данном контексте слово может обозначать не только непосредственных сыновей, но также потомков или родовую группу, что пояснено в сноске.
- source_word: בַקְבּוּק
  choice: Бакбук
  rationale: Имя собственное передано транслитерацией с еврейского.
- source_word: חֲקוּפָא
  choice: Хакуфа
  rationale: Имя собственное передано транслитерацией с еврейского; начальная буква ח закономерно передана русским «х».
- source_word: חַרְחוּר
  choice: Хархур
  rationale: Имя собственное передано транслитерацией; предполагаемое значение имени не привносится в текст.
