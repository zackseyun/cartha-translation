  text: 'The singers: the sons of Asaph[a], one hundred forty-eight.'
translation:
  language: ru
  text: 'Певцы: сыновья Асафа[a] — сто сорок восемь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомки Асафа». Еврейское выражение «сыновья» может обозначать родовую линию или принадлежность к храмовой группе, а не только непосредственных сыновей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: певцы
  rationale: Причастная форма от שׁיר обозначает тех, кто поёт. В контексте перечня «певцы» — точный, естественный и устоявшийся русский эквивалент.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Сохранено формальное родовое обозначение еврейского текста. В подобных перечнях слово может обозначать не только непосредственных сыновей, но также потомков или членов рода либо храмовой группы; эта широта отмечена в сноске.
- source_word: אָסָף
  choice: Асафа
  rationale: Личное имя передано в принятой русской библейской форме и поставлено в родительный падеж по нормам русского языка.
- source_word: מֵאָה אַרְבָּעִים וּשְׁמֹנָה
  choice: сто сорок восемь
  rationale: Прямая и естественная передача еврейского количественного числительного в современном русском языке.
