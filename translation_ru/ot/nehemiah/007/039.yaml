  text: 'The priests: the sons of Jedaiah[a], of the house of Jeshua[b], nine hundred seventy-three.'
translation:
  language: ru
  text: 'Священники: потомки Иедаии[a], из дома Иешуа[b] — девятьсот семьдесят три.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Иедаии»; здесь имеются в виду его потомки или представители его рода, а не только непосредственные сыновья.'
    reason: lexical_alternative
  - marker: b
    text: В других переводческих традициях это имя передают как «Иисус»; «Иешуа» точнее воспроизводит краткую еврейскую форму имени.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: Священники
  rationale: Определённое существительное во множественном числе вводит следующую группу в перечне; краткая именная конструкция сохраняет форму списка без добавления глагола.
- source_word: בְּנֵי
  choice: потомки
  rationale: В переписных и родословных перечнях слово обозначает не только непосредственных сыновей, но и представителей семейной линии; «потомки» ясно передаёт здесь этот смысл.
- source_word: יְדַעְיָה
  choice: Иедаии
  rationale: Имя יְדַעְיָה передано принятой русской библейской формой «Иедая», поставленной в родительном падеже.
- source_word: לְבֵית יֵשׁוּעַ
  choice: из дома Иешуа
  rationale: Слово «дом» с личным именем обозначает семейство или род, а предлог לְ выражает принадлежность; «из дома» естественно передаёт родовую связь по-русски.
- source_word: יֵשׁוּעַ
  choice: Иешуа
  rationale: Транслитерация отражает краткую древнееврейскую форму имени, характерную для послепленного периода, и не смешивает её с полной формой «Иисус Навин».
- source_word: תְּשַׁע מֵאוֹת שִׁבְעִים וּשְׁלֹשָׁה
  choice: девятьсот семьдесят три человека
  rationale: Числительное точно передаёт итог 973; слово «человека» добавлено по нормам русского языка для ясности подразумеваемого подсчёта.
