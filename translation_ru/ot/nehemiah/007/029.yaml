lexical_decisions:
- source_word: אַנְשֵׁי
  choice: жителей
  rationale: В перечне возвратившихся форма буквально означает «мужи», но обозначает людей, связанных с названными городами; «жителей» естественно передаёт формулу и не создаёт лишнего утверждения, будто учтены только мужчины.
- source_word: קִרְיַת יְעָרִים
  choice: Кириат-Иеарима
  rationale: Географическое название передано транслитерацией и поставлено в родительный падеж после слова «жителей».
- source_word: כְּפִירָה
  choice: Кефиры
  rationale: Географическое название транслитерировано в форме, естественной для современной русской библейской речи, и поставлено в родительный падеж.
- source_word: וּבְאֵרוֹת
  choice: и Беэрота
  rationale: Союз וּ передан как «и», а название — транслитерацией с сохранением раздельного звучания гласных; форма родительного падежа обусловлена синтаксисом.
- source_word: שְׁבַע מֵאוֹת אַרְבָּעִים וּשְׁלֹשָׁה
  choice: '743'
  rationale: Число передано цифрами для удобства чтения переписного списка при полном сохранении точного количества.
