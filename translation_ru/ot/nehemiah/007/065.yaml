base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/065.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b].
translation:
  language: ru
  text: И правитель[a] сказал им, чтобы они не ели от особо святых приношений[b], пока не явится священник с уримом и туммимом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тиршафа» — персидский административный титул.'
    reason: lexical_alternative
  - marker: b
    text: То есть от особо святых долей пищи, положенных священникам; речь не о внутреннем святилище — Святом святых.
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: правитель
  rationale: Персидский административный титул передан по функции ради ясности; транслитерация сохранена в сноске.
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: чтобы они не ели
  rationale: Естественно передаёт содержание распоряжения и запретительный смысл еврейского имперфекта в данном контексте.
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: от великой святыни
  rationale: Традиционное русское культовое выражение передаёт превосходную степень и здесь обозначает особо святые священнические доли пищи, а не внутреннее святилище; это уточнено в сноске.
- source_word: עַד עֲמֹד הַכֹּהֵן
  choice: пока не явится священник
  rationale: Передаёт будущую временную границу запрета; артикль при слове «священник» допускает родовое значение, поэтому определённость не усилена.
- source_word: לְאוּרִים וְתוּמִּים
  choice: с уримом и туммимом
  rationale: Устоявшиеся названия священнических средств вопрошания сохранены транслитерацией; предлог «с» естественно выражает наличие или использование.
theological_decisions:
- issue: Значение выражения קֹדֶשׁ הַקֳּדָשִׁים
  choice: особо святые священнические доли пищи
  alternative: Святое святых как внутреннее помещение святилища
  rationale: Контекст касается права лиц с неподтверждённым священническим происхождением есть положенные священникам святые части приношений, а не доступа во внутреннее святилище.
- issue: Передача персидского титула הַתִּרְשָׁתָא
  choice: правитель
  alternative: тиршафа
  rationale: Это административный титул, а не личное имя; функциональный перевод понятнее современному читателю, а исходная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к еврейскому, но естественен по-русски; культовые термины сохранены без конфессионального уточнения.
