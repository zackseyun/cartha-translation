  text: אֵ֗לֶּה בִּקְשׁ֧וּ כְתָבָ֛/ם הַ/מִּתְיַחְשִׂ֖ים וְ/לֹ֣א נִמְצָ֑א וַ/יְגֹֽאֲל֖וּ מִן הַ/כְּהֻנָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/064.yaml
  text: These sought their record among those enrolled by genealogy[a], but it was not found[b], so they were excluded from the priesthood.
translation:
  language: ru
  text: Они искали свою запись в родословных списках[a], но её не нашли, и потому их отстранили от священства[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою родословную запись»; еврейский текст говорит о письменном документе, подтверждавшем происхождение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их признали непригодными для священства». Еврейский глагол здесь указывает на исключение из священнического статуса из-за неподтверждённого происхождения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: Они
  rationale: Указательное местоимение относится к только что названным людям; в русском связном повествовании личное местоимение звучит естественнее, не добавляя отсутствующего в еврейском существительного.
- source_word: בִּקְשׁוּ
  choice: искали
  rationale: בקשׁ здесь обозначает целенаправленный поиск документа.
- source_word: כְתָבָם
  choice: свою запись
  rationale: כְּתָב означает письменный документ или запись; «запись» естественно передаёт административный контекст, не уточняя сверх текста вид документа.
- source_word: הַמִּתְיַחְשִׂים
  choice: в родословных списках
  rationale: Причастие от יחס указывает на регистрацию или установление происхождения. Формулировка передаёт смысл письменной генеалогической регистрации и остаётся понятной современному читателю.
- source_word: וְלֹא נִמְצָא
  choice: но её не нашли
  rationale: Глагол стоит в единственном числе, поэтому его естественным подразумеваемым субъектом является искомая запись, а не сами люди.
- source_word: וַיְגֹאֲלוּ
  choice: их отстранили
  rationale: Редкая форма от גאל в данном контексте означает признание непригодными или исключение из священнического статуса; «отстранили» ясно передаёт практический результат без чрезмерного акцента на буквальном «осквернении».
- source_word: מִן הַכְּהֻנָּה
  choice: от священства
  rationale: כְּהֻנָּה обозначает священство или священническое служение; выбран прямой институциональный эквивалент.
theological_decisions:
- issue: Характер исключения из священства
  choice: отстранили от священства
  alternative: признали нечистыми для священства
  rationale: Контекст связывает решение с невозможностью подтвердить происхождение. Перевод передаёт утрату допуска к священническому статусу, не утверждая сверх текста, что речь шла именно о ритуальной нечистоте.
translation_notes:
  register: Современный литературный русский язык с ясной административно-родословной лексикой. Сохранены причинная связь контекста и неопределённость редкого еврейского глагола; более буквальное, но потенциально вводящее в заблуждение «осквернились/были осквернены» вынесено из основного текста.
