  source_fidelity: 'Русский текст точно передаёт последовательность еврейского оригинала: эти люди искали свой письменный родословный документ/запись, не нашли его и вследствие этого были исключены из священства. Единственное число в «её не нашли» корректно соотнесено с «записью». Формулировка «в родословных списках» удачно передаёт административно-генеалогический смысл הַמִּתְיַחְשִׂים, не требуя искусственного буквального оборота.'
