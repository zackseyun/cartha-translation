source:
  edition: WLC
  text: וָ/אֲצַוֶּ֞ה אֶת חֲנָ֣נִי אָחִ֗/י וְ/אֶת חֲנַנְיָ֛ה שַׂ֥ר הַ/בִּירָ֖ה עַל יְרוּשָׁלִָ֑ם כִּי הוּא֙ כְּ/אִ֣ישׁ אֱמֶ֔ת וְ/יָרֵ֥א אֶת הָ/אֱלֹהִ֖ים מֵ/רַבִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/002.yaml
  text: Then I appointed my brother Hanani and Hananiah[a], the commander of the fortress, over Jerusalem[b], because he was a faithful man and feared God more than many.
translation:
  language: ru
  text: И я поставил над Иерусалимом моего брата Ханани и Хананию, начальника крепости. Ведь он[a] был человеком верным[b] и боялся Бога больше многих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «он», вероятнее всего, относится к Ханании, названному непосредственно перед ним; однако некоторые понимают эту характеристику как обоснование назначения обоих.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «человеком истины»; возможный перевод: «человеком надёжным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: я поставил
  rationale: В административном контексте צוה означает поручение или назначение на ответственную должность; «поставил над» естественно передаёт сочетание с עַל.
- source_word: חֲנָנִי אָחִי
  choice: моего брата Ханани
  rationale: Суффикс первого лица прямо обозначает Ханани как брата Неемии; порядок слов соответствует современному русскому употреблению.
- source_word: חֲנַנְיָה
  choice: Хананию
  rationale: Личное имя передано традиционной русской транслитерацией и поставлено в винительный падеж.
- source_word: שַׂר הַבִּירָה
  choice: начальника крепости
  rationale: שַׂר обозначает начальника или руководителя, а בִּירָה — укреплённый комплекс; формулировка сохраняет административно-военный оттенок и остаётся понятной.
- source_word: עַל יְרוּשָׁלָ͏ִם
  choice: над Иерусалимом
  rationale: После глагола назначения עַל выражает власть или ответственность за город.
- source_word: כִּי הוּא
  choice: ведь он
  rationale: כִּי вводит основание назначения, а единственное число местоимения сохранено без согласования по смыслу с двумя назначенными лицами.
- source_word: כְּאִישׁ אֱמֶת
  choice: человеком верным
  rationale: אֱמֶת применительно к человеку обозначает надёжность, верность и правдивость; «верный» кратко и естественно передаёт этот смысл.
- source_word: וְיָרֵא אֶת־הָאֱלֹהִים
  choice: и боялся Бога
  rationale: Сохранена прямая библейская формула благоговейного страха перед Богом.
- source_word: מֵרַבִּים
  choice: больше многих
  rationale: Сравнительное מן с רַבִּים буквально обозначает «больше многих»; перевод не усиливает выражение до «больше большинства».
theological_decisions:
- issue: К кому относится местоимение единственного числа в похвальной характеристике
  choice: В основном тексте сохранено «он»; по ближайшему синтаксическому антецеденту это, вероятнее всего, Ханания.
  alternative: Характеристика может обосновывать назначение обоих мужчин в целом, несмотря на единственное число.
  rationale: Еврейское местоимение и последующие сказуемые стоят в единственном числе. Перевод не заменяет их множественным числом и не устраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Начальное ו передано как «И», поскольку стих продолжает последовательное повествование. Предложение разделено после назначения, чтобы ясно отделить основание решения; подлинная неоднозначность единственного числа сохранена и пояснена сноской.
