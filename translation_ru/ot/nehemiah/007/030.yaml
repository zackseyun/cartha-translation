lexical_decisions:
- source_word: אַנְשֵׁי
  choice: жителей
  rationale: В перечне переселенцев конструктивная форма множественного числа от אִישׁ обозначает людей, связанных с названными местами. Русское «жителей» естественно передаёт формулу списка; мужской состав учитывается формой числительного «один».
- source_word: הָרָמָה
  choice: Рамы
  rationale: Географическое название רָמָה передано принятой русской библейской транслитерацией «Рама» и поставлено в родительный падеж после «жителей».
- source_word: וָגָבַע
  choice: и Гевы[a]
  rationale: Масоретский текст содержит גָבַע — Гева, а не גִּבְעָה — Гива. Выбрано прямое чтение засвидетельствованного текста; вариант параллельного перечня пояснён в сноске.
- source_word: שֵׁשׁ מֵאוֹת עֶשְׂרִים וְאֶחָד
  choice: шестьсот двадцать один
  rationale: Число 621 передано словами в естественной литературной форме. Мужской род «один» согласуется с подразумеваемым счётным словом «человек» и сохраняет форму еврейского числительного.
