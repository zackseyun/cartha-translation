  text: сыновья Бацлита, сыновья Мехиды, сыновья Харши —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: В перечне родов это слово обозначает потомков или членов рода; «сыновья» сохраняет формальную повторяемость и привычную библейскую форму списка.
- source_word: בַצְלִית
  choice: Бацлита
  rationale: Имя собственное передано транслитерацией с учётом русской библейской традиции; родительный падеж обусловлен словом «сыновья».
- source_word: מְחִידָא
  choice: Мехиды
  rationale: Имя собственное передано транслитерацией; начальное מְ соответствует «Ме», ח передано как «х», а форма родительного падежа согласована с «сыновья».
- source_word: חַרְשָׁא
  choice: Харши
  rationale: Имя собственное передано транслитерацией без попытки истолковать его как нарицательное; родительный падеж обусловлен синтаксисом.
