  text: וְ/אֵ֗לֶּה הָֽ/עוֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדּ֖וֹן וְ/אִמֵּ֑ר וְ/לֹ֣א יָכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/061.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addon, and Immer, but they were not able to declare their fathers’ houses or their offspring[c][b], whether they were from Israel.
translation:
  language: ru
  text: Вот те, кто пришли из Тел-Мелаха, Тел-Харши, Керува, Аддона[a] и Иммера, но не могли указать свой отцовский род и свою родословную, принадлежат ли они к Израилю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Езд. 2:59 соответствующее имя читается как «Аддан», тогда как здесь — «Аддон».
    reason: textual_variant
lexical_decisions:
- source_word: וְאֵלֶּה הָעוֹלִים
  choice: Вот те, кто пришёл
  rationale: Оборот вводит отдельную группу в перечне. «Пришёл» естественно передаёт контекст возвращения, не заменяя исходный образ более толковательным словом «вернулся».
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדּוֹן וְאִמֵּר
  choice: из Тел-Мелаха, Тел-Харши, Керува, Аддона и Иммера
  rationale: Названия и имена переданы транслитерацией с учётом русской морфологии после предлога «из».
- source_word: וְלֹא יָכְלוּ לְהַגִּיד
  choice: но не смог указать
  rationale: Глагол означает сообщить или объявить; в генеалогическом контексте «указать» звучит естественно и не усиливает смысл до юридического «доказать».
- source_word: בֵּית אֲבוֹתָם
  choice: свой отцовский род
  rationale: Выражение буквально обозначает «дом отцов», то есть родовую семью по отцовской линии. «Отцовский род» сохраняет этот смысл и понятно современному читателю.
- source_word: וְזַרְעָם
  choice: своё происхождение
  rationale: זֶרַע буквально означает «семя», а в генеалогическом контексте — род, потомство или происхождение. Здесь речь идёт не об их детях, а о невозможности установить собственную родословную, поэтому выбрано «происхождение».
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: принадлежат ли они к Израилю
  rationale: Формулировка сохраняет неуверенность относительно их принадлежности к народу Израиля и естественно звучит по-русски.
theological_decisions:
- issue: Характер принадлежности к Израилю
  choice: принадлежат ли они к Израилю
  alternative: израильтяне ли они
  rationale: Выбранная формулировка не уточняет сверх текста, идёт ли речь исключительно об этническом происхождении, родовой регистрации или более широкой принадлежности к общине Израиля.
translation_notes:
  register: Современный литературный русский язык с достоинством перечня. Идиоматическое «отцовский род» предпочтено буквальному, но неестественному «дом отцов»; тире перед заключительным косвенным вопросом помогает ясно передать синтаксическую связь.
