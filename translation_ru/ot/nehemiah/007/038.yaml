lexical_decisions:
- source_word: בְּנֵי
  choice: сыновей
  rationale: В перечне вернувшихся בְּנֵי обозначает членов рода или группу потомков; традиционная формула «сыновей» сохраняет структуру еврейского текста и естественна для библейской родословно-переписной речи.
- source_word: סְנָאָה
  choice: Сенаи
  rationale: Собственное имя передано транслитерацией как «Сеная»; после слова «сыновей» употреблена нормативная форма родительного падежа «Сенаи».
- source_word: שְׁלֹשֶׁת אֲלָפִים תְּשַׁע מֵאוֹת וּשְׁלֹשִׁים
  choice: три тысячи девятьсот тридцать
  rationale: Числительное передано словами в том же порядке, что и в еврейском тексте, в естественной современной русской форме.
