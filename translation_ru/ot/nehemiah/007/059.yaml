  text: בְּנֵ֧י שְׁפַטְיָ֣ה בְנֵֽי חַטִּ֗יל בְּנֵ֛י פֹּכֶ֥רֶת הַצְּבָיִ֖ים בְּנֵ֥י אָמֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/059.yaml
  text: the sons of Shephatiah[a], the sons of Hattil, the sons of Pochereth-hazzebaim[b], the sons of Amon.
translation:
  language: ru
  text: сыновья Шефатии[a], сыновья Хаттила, сыновья Похерет-ха-Цеваима[b], сыновья Амона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомки» — здесь и далее в этом стихе; еврейское «сыновья» в родословных перечнях нередко обозначает род или линию потомков.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «Похерет из Цеваима»; в основном тексте еврейское сочетание сохранено как составное имя.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Прямое соответствие форме сопряжённого множественного числа от בֵּן. В родословных и перечнях это слово может обозначать не только непосредственных сыновей, но и потомков либо членов рода; такая широта отмечена в сноске.
- source_word: שְׁפַטְיָה
  choice: Шефатии
  rationale: Личное или родовое имя передано транслитерацией и поставлено в родительный падеж после слова «сыновья».
- source_word: חַטִּיל
  choice: Хаттила
  rationale: Имя транслитерировано с сохранением удвоенного согласного и оформлено по нормам русского склонения.
- source_word: פֹּכֶרֶת הַצְּבָיִים
  choice: Похерет-ха-Цеваима
  rationale: Сочетание сохранено как составное собственное имя. Элемент הַ передан как «ха-», а צְּבָיִים — как «Цеваим»; всё имя оформлено в родительном падеже после «сыновья».
- source_word: אָמֽוֹן
  choice: Амона
  rationale: Собственное имя передано транслитерацией; контекст требует родительного падежа.
