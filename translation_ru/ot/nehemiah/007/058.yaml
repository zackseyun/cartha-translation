lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: В послепленной родословной записи слово вводит семейную или родовую группу. Формальное «сыновья» сохраняет буквальный образ еврейского текста, хотя по смыслу речь может идти о потомках.
- source_word: יַעְלָא
  choice: Яала
  rationale: Личное имя передано транслитерацией по форме масоретского текста; в косвенном падеже — «Яалы».
- source_word: דַרְקוֹן
  choice: Даркон
  rationale: Личное имя транслитерировано с еврейского без перевода; в родительном падеже — «Даркона».
- source_word: גִדֵּל
  choice: Гиддел
  rationale: Личное имя транслитерировано с передачей удвоенного согласного; в родительном падеже — «Гиддела».
