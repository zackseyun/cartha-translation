lexical_decisions:
- source_word: הַנְּתִינִים
  choice: храмовые служители
  rationale: Техническое обозначение особой группы людей, закреплённых за служением при храме в послепленный период. Функциональный перевод понятен современному читателю; традиционное «нефиним» сохранено в примечании.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Буквально передаёт повторяющуюся формулу родового списка; здесь слово может обозначать потомков или членов рода, но формальная структура исходного текста сохранена.
- source_word: צִחָא
  choice: Циха
  rationale: Русская транслитерация еврейского личного имени צִחָא; в конструкции принадлежности употреблён родительный падеж «Цихи».
- source_word: חֲשֻׂפָא
  choice: Хасуфа
  rationale: Транслитерация имени חֲשֻׂפָא с учётом согласной שׂ как «с»; в основном тексте стоит родительный падеж «Хасуфы».
- source_word: טַבָּעוֹת
  choice: Таббаоф
  rationale: Транслитерация имени с передачей удвоенного בּ как «бб» и конечной ת как «ф» по принятой русской библейской традиции; в тексте употреблён родительный падеж «Таббаофа».
