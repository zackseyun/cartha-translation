base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/003.yaml
  text: And I said to them[a], “The gates of Jerusalem must not be opened until the sun is hot. While they are still standing guard, let them shut the doors and fasten them. And appoint guards from the inhabitants of Jerusalem[c][b], each at his watch and each opposite his own house.”
translation:
  language: ru
  text: 'И я сказал им: «Ворота Иерусалима нельзя открывать, пока солнце не пригреет.[a] Пока они ещё стоят на страже, пусть закроют двери и закрепят их.[b] Назначьте стражей из жителей Иерусалима,[c] каждого — на свой пост и каждого — напротив своего дома».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока солнце не начнёт припекать», то есть не сразу после восхода, а позднее утром.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «держать» или «схватить их». В данном контексте речь идёт о том, чтобы после закрытия закрепить двери.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «назначьте караулы из жителей Иерусалима». Еврейское слово может обозначать как стражей, так и караулы или дежурства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִפָּתְחוּ שַׁעֲרֵי יְרוּשָׁלִַם
  choice: Ворота Иерусалима нельзя открывать
  rationale: Нифаль передаёт пассивное значение, а לֹא с имперфектом здесь выражает запретительное распоряжение. Безличная конструкция естественна по-русски и сохраняет силу запрета.
- source_word: עַד חֹם הַשֶּׁמֶשׁ
  choice: пока солнце не станет жарким
  rationale: 'Перевод сохраняет конкретный образ еврейского текста: ворота следует открывать не на рассвете, а когда солнце уже греет. Точное временное значение не подменено толкованием «среди бела дня».'
- source_word: וְעַד הֵם עֹמְדִים
  choice: Пока стражи ещё стоят на посту
  rationale: Глагол עמד буквально означает «стоять», но в контексте охраны указывает на несение службы. Существительное «стражи» уточняет подразумеваемый субъект по контексту.
- source_word: יָגִיפוּ הַדְּלָתוֹת
  choice: пусть они закроют двери
  rationale: Форма передаёт распоряжение, а הגיף обозначает закрывание створок ворот. Русское «двери» естественно после упоминания ворот.
- source_word: וֶאֱחֹזוּ
  choice: и запрут их
  rationale: אחז буквально значит «держать, схватывать», однако после закрывания дверей контекстуально означает закрепить их, чтобы они не открылись. «Запрут» естественно передаёт действие без указания конкретного запорного устройства.
- source_word: וְהַעֲמֵיד מִשְׁמְרוֹת יֹשְׁבֵי יְרוּשָׁלִַם
  choice: Поставьте стражу из жителей Иерусалима
  rationale: העמיד означает «поставить, расположить», а משמרות может обозначать как людей, несущих охрану, так и караулы/дежурства. В основном тексте выбран естественный личный смысл, а неоднозначность отмечена в сноске.
- source_word: אִישׁ בְּמִשְׁמָרוֹ וְאִישׁ נֶגֶד בֵּיתוֹ
  choice: каждого — на свой пост и каждого — напротив своего дома
  rationale: Повторение אִישׁ имеет распределительное значение. «Напротив» сохраняет пространственное значение נֶגֶד, не заменяя его более неопределённым «возле».
