lexical_decisions:
- source_word: הַשֹּׁעֲרִים
  choice: Привратники
  rationale: Существительное обозначает служителей, охранявших ворота, в данном контексте — храмовых привратников. Краткое традиционное русское слово естественно для перечня.
- source_word: בְּנֵי
  choice: потомки
  rationale: Хотя буквально слово означает «сыновья», в послепленных родословных и переписных списках оно часто обозначает более широкую семейную или родовую группу. «Потомки» естественно передаёт это значение и не создаёт впечатления, будто речь идёт только о непосредственных сыновьях.
- source_word: שַׁלּוּם
  choice: Шаллум
  rationale: Транслитерация личного имени с передачей удвоенного согласного.
- source_word: אָטֵר
  choice: Атер
  rationale: Транслитерация личного имени.
- source_word: טַלְמֹן
  choice: Талмон
  rationale: Транслитерация личного имени.
- source_word: עַקּוּב
  choice: Аккув
  rationale: Транслитерация личного имени с передачей удвоенного согласного; конечная буква ב без дагеша передана как «в» согласно принятой русской библейской традиции.
- source_word: חֲטִיטָא
  choice: Хатита
  rationale: Транслитерация личного имени; конечная алеф обозначает гласный звук и не требует отдельной согласной.
- source_word: שֹׁבָי
  choice: Шовай
  rationale: Транслитерация личного имени с сохранением конечного дифтонгического звучания, отражённого написанием י.
- source_word: מֵאָה שְׁלֹשִׁים וּשְׁמֹנָה
  choice: 138 человек
  rationale: Числовая запись удобна в переписном списке; слово «человек» делает подразумеваемый итог группы ясным и естественным по-русски.
