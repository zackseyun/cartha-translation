  text: besides their male and female servants[a], of whom there were 7,337; and they had 245 male and female singers.
translation:
  language: ru
  text: кроме их рабов и рабынь[a], которых было 7 337; и было у них 245 певцов и певиц.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуг и служанок». Древнееврейские слова могут иметь более общее значение, однако в контексте этой переписи, вероятно, обозначают рабов и рабынь, принадлежавших домохозяйствам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: кроме
  rationale: Естественно вводит группу, не включённую в предшествующий итог переписи.
- source_word: עַבְדֵיהֶם וְאַמְהֹתֵיהֶם
  choice: их рабов и рабынь
  rationale: Парные существительные мужского и женского рода обозначают зависимых людей, принадлежавших домохозяйствам; «рабы и рабыни» прямо передаёт социальную реальность контекста, тогда как более общее значение отмечено в сноске.
- source_word: אֵלֶּה
  choice: которых было
  rationale: Буквально «эти»; в русской переписной формулировке относительная конструкция естественно связывает названную группу с последующим числом.
- source_word: שִׁבְעַת אֲלָפִים שְׁלֹשׁ מֵאוֹת שְׁלֹשִׁים וְשִׁבְעָה
  choice: 7 337
  rationale: Цифровая запись уместна в перечне и точно сохраняет число; пробел соответствует современной русской типографике.
- source_word: וְלָהֶם
  choice: и было у них
  rationale: Естественная русская передача древнееврейской конструкции обладания; порядок слов сохраняет несколько официальный, перечневый характер стиха.
- source_word: מְשֹׁרֲרִים וּמְשֹׁרֲרוֹת
  choice: певцов и певиц
  rationale: Сохраняет явное различение мужской и женской форм в древнееврейском тексте.
- source_word: מָאתַיִם וְאַרְבָּעִים וַחֲמִשָּׁה
  choice: '245'
  rationale: Цифровая запись ясна и соответствует числовому характеру переписи.
