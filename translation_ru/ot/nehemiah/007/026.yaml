lexical_decisions:
- source_word: אַנְשֵׁי
  choice: жителей
  rationale: Буквально «мужи», однако в перечне вернувшихся это обычное обозначение людей, относящихся к данным населённым пунктам. «Жители» естественно передаёт функцию выражения в современном русском языке, не превращая его в указание на родословную.
- source_word: בֵית לֶחֶם
  choice: Вифлеема
  rationale: Устоявшаяся русская форма географического названия; родительный падеж обусловлен словом «жителей».
- source_word: וּנְטֹפָה
  choice: и Нетофы
  rationale: Союз соединяет два географических названия, для жителей которых приведено одно общее число. Использована традиционная русская форма «Нетофа» в родительном падеже.
- source_word: מֵאָה שְׁמֹנִים וּשְׁמֹנָה
  choice: сто восемьдесят восемь
  rationale: Точная передача еврейского количественного числительного 188 в нормативной современной русской форме.
