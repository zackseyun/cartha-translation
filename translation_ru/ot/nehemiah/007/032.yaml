lexical_decisions:
- source_word: אַנְשֵׁי
  choice: жителей
  rationale: Форма сопряжённого множественного числа от אִישׁ обозначает здесь группу, связанную с названными городами. В контексте списка вернувшихся «жителей» естественно передаёт смысл по-русски; буквальное «мужей» отмечено в сноске.
- source_word: בֵית אֵל
  choice: Вефиля
  rationale: Устоявшаяся русская библейская передача названия Бет-Эль; родительный падеж обусловлен словом «жителей».
- source_word: וְהָעָי
  choice: и Гая
  rationale: Передано традиционным русским библейским топонимом «Гай» без воспроизведения еврейского артикля; родительный падеж согласован со словом «жителей».
- source_word: מֵאָה עֶשְׂרִים וּשְׁלֹשָׁה
  choice: сто двадцать три
  rationale: Точная передача количества современными русскими числительными.
