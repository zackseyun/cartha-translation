lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Прямое соответствие форме сопряжённого множественного числа от בֵּן; в данном списке слово обозначает членов рода или потомков, но буквальная структура «сыновья» естественна для библейского родословного перечня.
- source_word: בַרְקוֹס
  choice: Варкос
  rationale: Собственное имя передано транслитерацией с учётом масоретского чтения начальной буквы ב без дагеша как «в».
- source_word: סִיסְרָא
  choice: Сисара
  rationale: Собственное имя передано в принятой русской библейской форме; здесь оно служит обозначением рода.
- source_word: תָמַח
  choice: Тамах
  rationale: Транслитерация следует огласовке WLC תָמַח (Tāmaḥ); конечная ח передана буквой «х».
