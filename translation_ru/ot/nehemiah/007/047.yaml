  text: בְּנֵי קֵירֹ֥ס בְּנֵי סִיעָ֖א בְּנֵ֥י פָדֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/047.yaml
  text: the sons of Keros[a], the sons of Sia, the sons of Padon.
translation:
  language: ru
  text: сыновья Кероса[a], сыновья Сии, сыновья Падона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потомки» — во всех трёх случаях; еврейская родословная формула может обозначать более широкую родовую линию, а не только непосредственных сыновей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Формула с сопряжённой формой множественного числа от בֵּן сохранена буквально и естественно для родословного перечня; в данном контексте она может обозначать не только непосредственных сыновей, но и потомков либо представителей рода.
- source_word: קֵירֹס
  choice: Кероса
  rationale: Имя передано транслитерацией с русского библейского регистра; родительный падеж обусловлен сочетанием «сыновья Кероса».
- source_word: סִיעָא
  choice: Сии
  rationale: Имя передано транслитерацией; форма родительного падежа «Сии» соответствует конструкции перечня.
- source_word: פָדוֹן
  choice: Падона
  rationale: Имя передано близкой к еврейскому звучанию транслитерацией; родительный падеж обусловлен синтаксисом.
theological_decisions: []
