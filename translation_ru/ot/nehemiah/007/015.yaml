- source_word: בְּנֵי
  choice: сыновей
  rationale: В перечне возвратившихся это обычная родовая формула. Русское «сыновей» сохраняет буквальную генеалогическую форму, хотя по контексту речь может идти шире — о потомках или членах рода.
- source_word: בִנּוּי
  choice: Биннуя
  rationale: Личное или родовое имя передано транслитерацией; форма родительного падежа естественно зависит от слова «сыновей».
- source_word: שֵׁשׁ מֵאוֹת אַרְבָּעִים וּשְׁמֹנָה
  choice: шестьсот сорок восемь
  rationale: Еврейское числительное однозначно обозначает 648; запись словами соответствует литературному стилю библейского перечня.
