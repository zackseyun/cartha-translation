lexical_decisions:
- source_word: כָּל הַקָּהָל
  choice: всего собравшихся
  rationale: Сочетание כָּל с определённым הַקָּהָל охватывает всё собрание целиком. В данном контексте «собравшиеся» естественно обозначает собранную общину и не придаёт выражению исключительно богослужебного оттенка.
- source_word: כְּאֶחָד
  choice: всего
  rationale: Буквально «как одно». В числовом итоге оборот указывает, что всё собрание взято как единое целое; по-русски это естественно передаётся конструкцией «всего ... было».
- source_word: אַרְבַּע רִבּוֹא אַלְפַּיִם שְׁלֹשׁ מֵאוֹת וְשִׁשִּׁים
  choice: сорок две тысячи триста шестьдесят
  rationale: Составное еврейское числительное буквально складывается из четырёх десятков тысяч, двух тысяч, трёх сотен и шестидесяти.
