  yaml_path: translation/ot/nehemiah/007/060.yaml
  text: All the temple servants and the sons of Solomon’s servants were three hundred ninety-two[a].
translation:
  language: ru
  text: Всего храмовых служителей[a] и сыновей слуг Соломона — триста девяносто два.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нефинеев» — традиционное название особой группы храмовых служителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: Всего
  rationale: В контексте списка כָּל вводит общую численность названных групп; «всего» естественно передаёт эту функцию по-русски.
- source_word: הַנְּתִינִים
  choice: храмовых служителей
  rationale: Термин обозначает особую группу, исполнявшую служение при храме. Функциональный перевод понятен современному читателю, а традиционная транслитерация сохранена в сноске.
- source_word: וּבְנֵי
  choice: и сыновей
  rationale: Формально בְּנֵי означает «сыновья»; здесь это, вероятно, устойчивое наименование группы, поэтому буквальная форма сохранена без замены на «потомков».
- source_word: עַבְדֵי
  choice: слуг
  rationale: עֶבֶד допускает значения «слуга» и «раб». В составе устойчивого обозначения социальной группы «слуги» звучит естественно и не усиливает без необходимости аспект несвободы.
- source_word: שְׁלֹמֹה
  choice: Соломона
  rationale: Имя передано в принятой русской библейской форме и поставлено в родительном падеже.
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: триста девяносто два
  rationale: Числительное передано словами в соответствии с формой связного библейского текста.
