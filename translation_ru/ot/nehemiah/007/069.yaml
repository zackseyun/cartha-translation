base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/069.yaml
  text: And some of the heads of the fathers’ houses gave to the work[a]. The governor gave to the treasury one thousand gold darics, fifty basins[c][b], and five hundred thirty-five priests’ tunics.
translation:
  language: ru
  text: Некоторые из глав родов пожертвовали на это дело. Правитель[a] передал в сокровищницу тысячу золотых дариков[b], пятьдесят чаш и пятьсот тридцать священнических хитонов[c].
  philosophy: optimal-equivalence
  footnotes:
