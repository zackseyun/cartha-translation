lexical_decisions:
- source_word: וּמִקְצָת רָאשֵׁי הָאָבוֹת
  choice: Некоторые главы родов
  rationale: Передаёт партитивное значение מִקְצָת и естественно выражает послепленный общественный термин רָאשֵׁי הָאָבוֹת без тяжеловесной буквальной кальки.
- source_word: נָתְנוּ לַמְּלָאכָה
  choice: пожертвовали на работы
  rationale: В контексте денежных и вещевых вкладов נָתְנוּ означает внесение пожертвований, а מְלָאכָה обозначает проводимые работы; множественное число по-русски звучит естественно.
- source_word: הַתִּרְשָׁתָא
  choice: Правитель
  rationale: Персидский административный титул передан функционально понятным русским словом; транслитерация сохранена в примечании как лексическая альтернатива.
- source_word: לָאוֹצָר
  choice: в сокровищницу
  rationale: В перечне ценностей אוֹצָר обозначает место хранения казны или пожертвований; «сокровищница» точно соответствует контексту.
- source_word: זָהָב דַּרְכְּמֹנִים אֶלֶף
  choice: тысячу золотых дариков
  rationale: דַּרְכְּמֹנִים — персидские золотые монеты; исторически точное название «дарики» предпочтительнее менее определённого «монеты».
- source_word: מִזְרָקוֹת
  choice: чаш
  rationale: Слово обозначает чаши или сосуды, в том числе употреблявшиеся при богослужении; контекст не требует добавлять более узкое назначение.
- source_word: כָּתְנוֹת כֹּהֲנִים
  choice: священнических хитонов
  rationale: כָּתְנוֹת — длинные нательные одежды типа хитонов; сочетание передано кратко и в привычной библейской терминологии.
- source_word: שְׁלֹשִׁים וַחֲמֵשׁ מֵאוֹת
  choice: пятьсот тридцать
  rationale: Еврейская конструкция означает «тридцать и пять сотен», то есть 530. Предложенное в консультационном английском слое число 535 не соответствует тексту WLC.
