    text: 'Или: «тиршафа» — персидский административный титул.'
    reason: lexical_alternative
  - marker: b
    text: Дарик — персидская золотая монета.
    reason: cultural_note
  - marker: c
    text: В еврейском тексте здесь указано пятьсот тридцать хитонов; в параллельном перечне в Езд. 2:69 — сто.
