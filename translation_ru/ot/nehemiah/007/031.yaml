lexical_decisions:
- source_word: אַנְשֵׁי
  choice: жителей
  rationale: В формуле списка переселенцев конструктивное множественное число от אִישׁ обозначает людей, связанных с названным местом. По-русски «жителей Михмаса» естественнее буквального «мужчин Михмаса» и не утверждает сверх текста, что речь исключительно о мужчинах.
- source_word: מִכְמָס
  choice: Михмас
  rationale: Название места передано принятой русской библейской транслитерацией, достаточно близко отражающей еврейскую форму.
- source_word: מֵאָה וְעֶשְׂרִים וּשְׁנָיִם
  choice: '122'
  rationale: Цифровая запись ясно и лаконично передаёт еврейское «сто двадцать два» и соответствует характеру переписного списка.
