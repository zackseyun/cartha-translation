  rationale: Форма сопряжённого множественного числа от בֵּן вводит родовую группу в переписном списке. Русское «сыновей» сохраняет форму еврейского выражения и в данном контексте может обозначать представителей рода.
- source_word: זַכָּי
  choice: Заккая
  rationale: Личное имя передано принятой русской библейской транслитерацией; родительный падеж обусловлен словом «сыновей».
- source_word: שְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: семьсот шестьдесят
  rationale: Количественное выражение буквально означает «семь сотен и шестьдесят»; запись словами соответствует стилю родовых итогов в перечне.
