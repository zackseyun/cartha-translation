  text: אֵ֣לֶּה בְּנֵ֣י הַ/מְּדִינָ֗ה הָ/עֹלִים֙ מִ/שְּׁבִ֣י הַ/גּוֹלָ֔ה אֲשֶׁ֣ר הֶגְלָ֔ה נְבוּכַדְנֶצַּ֖ר מֶ֣לֶךְ בָּבֶ֑ל וַ/יָּשׁ֧וּבוּ לִֽ/ירוּשָׁלִַ֛ם וְ/לִ/יהוּדָ֖ה אִ֥ישׁ לְ/עִירֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/006.yaml
  text: 'These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away, and who returned to Jerusalem and to Judah[c][b], each man to his city:'
translation:
  language: ru
  text: 'Вот жители области, которые пришли из плена изгнанников[a], которых Навуходоносор, царь Вавилона, увёл в изгнание, и возвратились в Иерусалим и Иудею — каждый в свой город[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из плена изгнанников»; более гладко: «из изгнания». Еврейский текст сохраняет оба близких по смыслу слова.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «человек в свой город» — распределительный оборот, относящийся к возвращавшимся, в том числе как представителям семейных групп.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי הַמְּדִינָה
  choice: жители области
  rationale: Буквально «сыновья области», но в данном перечне это еврейское обозначение людей, принадлежащих к области. По-русски «жители области» естественно передаёт смысл, не создавая ложного впечатления о буквальном родстве.
- source_word: הָעֹלִים
  choice: которые вышли
  rationale: Глагол עלה буквально передаёт движение вверх и традиционно употребляется о пути в землю Израиля или Иерусалим. Здесь «вышли из плена» сохраняет образ исхода без неестественного русского «взошли».
- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: из плена переселенцев
  rationale: 'Переданы оба связанных существительных: שְׁבִי — «плен», גּוֹלָה — сообщество изгнанников или переселенцев. Формулировка намеренно сохраняет плотность оригинала; более гладкое «из изгнания» было бы менее точным.'
- source_word: אֲשֶׁר הֶגְלָה
  choice: уведённых в изгнание
  rationale: Каузативная форма означает насильственное переселение. «Уведённых в изгнание» естественнее в данном историко-повествовательном регистре, чем канцелярское «депортированных».
- source_word: נְבוּכַדְנֶצַּר
  choice: Навуходоносор
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: וַיָּשׁוּבוּ
  choice: и возвратились
  rationale: Точно передаёт значение שׁוב и сохраняет параллельное описание тех же людей.
- source_word: לִירוּשָׁלַם וְלִיהוּדָה
  choice: в Иерусалим и Иудею
  rationale: Повтор направления в еврейском передан одним русским предлогом, что естественно для современного языка; Иудея обозначает более широкую территорию.
- source_word: אִישׁ לְעִירוֹ
  choice: каждый в свой город
  rationale: Дистрибутивное выражение буквально означает «мужчина/человек — в свой город». Русское «каждый» сохраняет распределительный смысл и в контексте охватывает возвращавшихся вместе с их семьями.
theological_decisions:
- issue: Репрезентативная мужская форма אִישׁ
  choice: каждый в свой город
  alternative: каждый мужчина в свой город
  rationale: В данном распределительном обороте אִישׁ указывает на каждого из возвращавшихся, вероятно как представителя семьи или дома. Буквальное «каждый мужчина» по-русски неоправданно сузило бы круг лиц и усилило бы гендерный акцент, которого контекст не требует.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического перечня. Синтаксис построен как единая фраза, вводящая последующий список; двоеточие сохранено. Архаическое буквальное «сыны области» заменено понятным «жители области», тогда как двойная лексика плена и изгнания частично сохранена в основном тексте и пояснена сноской.
