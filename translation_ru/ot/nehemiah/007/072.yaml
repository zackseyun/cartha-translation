  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֡ם וְ/הַ/שּׁוֹעֲרִים֩ וְ/הַ/מְשֹׁרְרִ֨ים וּ/מִן הָ/עָ֧ם וְ/הַ/נְּתִינִ֛ים וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶ֑ם וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/072.yaml
  text: So the priests[a], the Levites, the gatekeepers, the singers, some of the people, the temple servants, and all Israel lived in their cities. And when the seventh month arrived[b], the sons of Israel were in their cities.
translation:
  language: ru
  text: И священники, левиты, привратники, певцы, часть народа, храмовые служители[a] и весь Израиль поселились в своих городах. И когда наступил седьмой месяц, сыны Израиля[b] были в своих городах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нефинеи» — традиционное название этой группы храмовых служителей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «израильтяне» или «народ Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: поселились
  rationale: В контексте возвращения и расселения глагол ישׁב обозначает проживание или обустройство на месте; «поселились» естественно передаёт начало проживания.
- source_word: הַכֹּהֲנִים
  choice: священники
  rationale: Обычное и точное соответствие для כֹּהֲנִים.
- source_word: הַלְוִיִּם
  choice: левиты
  rationale: Устоявшееся русское обозначение этой храмовой группы.
- source_word: הַשּׁוֹעֲרִים
  choice: привратники
  rationale: Обозначает служителей, охранявших ворота; «привратники» — ясный и традиционный русский эквивалент.
- source_word: הַמְשֹׁרְרִים
  choice: певцы
  rationale: Причастная форма прямо обозначает поющих, в данном контексте — храмовых певцов.
- source_word: וּמִן הָעָם
  choice: часть народа
  rationale: 'Предлог מִן имеет партитивное значение: речь идёт о некоторой части народа наряду с перечисленными группами храмовых служителей.'
- source_word: הַנְּתִינִים
  choice: храмовые служители
  rationale: Функциональный перевод ясно передаёт роль особой группы, прикреплённой к храмовому служению; традиционное название дано в примечании.
- source_word: וְכָל יִשְׂרָאֵל
  choice: и весь Израиль
  rationale: Сохраняет собирательное обозначение народа в исходном тексте.
- source_word: בְּעָרֵיהֶם
  choice: в своих городах
  rationale: עִיר может обозначать город или поселение; «города» соответствует контексту списка расселения и обычному библейскому словоупотреблению.
- source_word: וַיִּגַּע
  choice: наступил
  rationale: При обозначении времени נגע идиоматически значит, что определённый срок или месяц наступил.
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: седьмой месяц
  rationale: Прямой перевод календарного выражения.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет явно выраженную в еврейском тексте мужскую форму и традиционное собирательное название народа; более идиоматические варианты приведены в примечании.
theological_decisions:
- issue: Гендерно маркированное собирательное выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Еврейское выражение буквально означает «сыны Израиля», хотя в контексте служит названием всего народа. Основной текст сохраняет форму источника, а примечание поясняет её собирательный смысл.
- issue: Передача названия נְתִינִים
  choice: храмовые служители
  alternative: нефинеи
  rationale: Функциональный перевод понятен современному читателю и не приписывает группе более узкой роли, чем позволяет контекст; традиционное наименование сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Перечень передан ясно и ритмично; союз в начале стиха сохранён. Во втором предложении еврейская сочинительная связь естественно передана временной конструкцией «Когда наступил…», без изменения смысла. Маркеры примечаний поставлены непосредственно при тех выражениях, к которым относятся.
