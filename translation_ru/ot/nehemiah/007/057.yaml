  text: בְּנֵ֖י עַבְדֵ֣י שְׁלֹמֹ֑ה בְּנֵי סוֹטַ֥י בְּנֵי סוֹפֶ֖רֶת בְּנֵ֥י פְרִידָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/057.yaml
  text: 'The sons of Solomon’s servants: the sons of Sotai[a], the sons of Sophereth[b], the sons of Perida.'
translation:
  language: ru
  text: 'Потомки[a] слуг Соломона: потомки Сотая, потомки Соферет и потомки Периды[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «сыновья». В родословных и перечнях родов это слово может обозначать потомков или членов рода, а не только непосредственных сыновей.
    reason: lexical_alternative
  - marker: b
    text: В параллельном перечне в Езд 2:55 это имя имеет форму «Перуда».
    reason: textual_parallel
lexical_decisions:
- source_word: בְּנֵי
  choice: потомки
  rationale: В перечнях родов בְּנֵי обозначает не только непосредственных сыновей, но и потомков или членов рода. «Потомки» ясно передаёт значение в данном послепленном списке, хотя в еврейском слово буквально означает «сыновья».
- source_word: עַבְדֵי
  choice: слуг
  rationale: В сочетании עַבְדֵי שְׁלֹמֹה это устойчивое обозначение наследственной группы «слуг Соломона». Вариант «рабов» возможен лексически, но здесь способен неоправданно сузить смысл до правового статуса рабов.
- source_word: שְׁלֹמֹה
  choice: Соломона
  rationale: Использована закрепившаяся в русском библейском употреблении форма имени.
- source_word: סוֹטַי
  choice: Сотая
  rationale: Имя передано транслитерацией с учётом масоретской огласовки; падежная форма обусловлена русским синтаксисом.
- source_word: סוֹפֶרֶת
  choice: Соферет
  rationale: Слово в данном перечне является именем рода, поэтому оно транслитерировано, а не переведено через связанное с корнем значение «писать» или «считать».
- source_word: פְרִידָא
  choice: Периды
  rationale: Имя транслитерировано по масоретской форме; падежное окончание соответствует конструкции «потомки кого».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранена лаконичная структура перечня и трёхкратный повтор בְּנֵי. Союз «и» перед последним элементом делает перечисление естественным по-русски. Имена переданы по масоретской огласовке, без искусственной архаизации.
