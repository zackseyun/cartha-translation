lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Форма сопряжённого множественного числа от בֵּן. В родословно-переписном списке обозначает членов рода; буквальное «сыновья» сохраняет форму и остаётся понятным по контексту.
- source_word: עֵילָם
  choice: Елам
  rationale: Собственное имя, переданное принятой русской библейской транслитерацией; здесь оно обозначает родовую группу.
- source_word: אַחֵר
  choice: другого
  rationale: Прилагательное означает «другой, иной» и отличает эту группу от потомков Елама, названных ранее; «другого Елама» естественно передаёт это различение, не превращая слово в порядковое числительное.
- source_word: אֶלֶף מָאתַיִם חֲמִשִּׁים וְאַרְבָּעָה
  choice: '1254'
  rationale: Точное количество — одна тысяча двести пятьдесят четыре; запись цифрами удобна и естественна в переписном списке.
