    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Прямое соответствие форме сопряжённого множественного числа от בֵּן. В родословном перечне это может обозначать не только непосредственных сыновей, но и потомков либо членов рода; эта широта отмечена в сноске.
- source_word: לְבָנָה
  choice: Леваны
  rationale: Имя передано русской библейской транслитерацией с учётом того, что ב обычно произносится как [в] без дагеша; родительный падеж обусловлен словом «сыновья».
- source_word: חֲגָבָה
  choice: Хагавы
  rationale: Собственное имя транслитерировано с передачей ח через «х» и ב без дагеша через «в»; употреблён родительный падеж.
- source_word: שַׁלְמָי
  choice: Шалмая
  rationale: 'Передаёт масоретскую форму данного стиха: начальное שׁ как «ш», окончание — как «ай»; после «сыновья» имя поставлено в родительный падеж.'
