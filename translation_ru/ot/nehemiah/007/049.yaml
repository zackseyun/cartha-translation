lexical_decisions:
- source_word: בְּנֵי
  choice: сыновья
  rationale: Формально передаёт повторяющуюся древнееврейскую генеалогическую формулу; в данном перечне слово может обозначать не только непосредственных сыновей, но и потомков либо родовую группу.
- source_word: חָנָן
  choice: Ханан
  rationale: Личное или родовое имя передано транслитерацией с древнееврейского.
- source_word: גִדֵּל
  choice: Гиддел
  rationale: Имя в списке храмовых служителей передано транслитерацией; удвоение согласного отражено в русской форме.
- source_word: גָחַר
  choice: Гахар
  rationale: Имя передано транслитерацией с учётом древнееврейских согласных и огласовки.
