  text: людей из другого Нево[a] — пятьдесят два.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или смысл: «из ещё одного Нево». Еврейское прилагательное может означать как «другой», так и «ещё один»; здесь оно, вероятно, отличает эту местность от Нево, упомянутого ранее в списке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי
  choice: людей из
  rationale: Сопряжённая форма множественного числа от אִישׁ в списке возвратившихся обозначает людей, связанных с указанным местом. По-русски «людей из» естественно передаёт эту связь и не утверждает сверх текста, что речь строго только о взрослых мужчинах.
- source_word: נְבוֹ
  choice: Нево
  rationale: Географическое название передано традиционной русской библейской транслитерацией.
- source_word: אַחֵר
  choice: другого
  rationale: Прилагательное может означать «другой» или «иной/ещё один». В данном перечне оно, вероятно, отличает это Нево от ранее названного места с тем же именем; неоднозначность отмечена в сноске.
- source_word: חֲמִשִּׁים וּ/שְׁנָיִם
  choice: пятьдесят два
  rationale: Числительное передано в обычном порядке современного русского языка.
