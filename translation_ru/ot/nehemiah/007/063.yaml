source:
  edition: WLC
  text: וּ/מִן הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/007/063.yaml
  text: 'And from the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: ru
  text: 'А из священников: сыновья Ховаии, сыновья Гаккоца, сыновья Барзиллая, который взял себе в жёны одну из дочерей Барзиллая галаадитянина и стал носить их имя.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и был назван по их имени».'
    reason: Сохраняется возможность увидеть более формальную пассивную конструкцию оригинала и множественное местоимение «их».
lexical_decisions:
- source_word: וּמִן הַכֹּהֲנִים
  choice: А из священников
  rationale: Передаёт присоединение ещё одной группы к перечню и сохраняет частичное значение предлога מִן.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Сохраняет повторяющуюся форму еврейского родословного списка; в данном контексте слово обозначает также потомков или представителей рода.
- source_word: חֳבַיָּה
  choice: Ховаия
  rationale: Современная русская передача еврейского личного или родового имени; в сочетании «сыновья Ховаии» имя закономерно склоняется.
- source_word: הַקּוֹץ
  choice: Гаккоц
  rationale: Транслитерация священнического родового имени с учётом вошедшего в его форму определённого артикля.
- source_word: בַרְזִלַּי
  choice: Барзиллай
  rationale: Последовательная современная транслитерация имени в обозначении рода и галаадитянина.
- source_word: אֲשֶׁר לָקַח מִבְּנוֹת ... אִשָּׁה
  choice: который взял себе в жёны одну из дочерей
  rationale: Естественно по-русски передаёт еврейскую конструкцию, означающую брак с одной из женщин названного рода.
- source_word: הַגִּלְעָדִי
  choice: галаадитянина
  rationale: Передаёт прилагательное происхождения и согласуется с родительным падежом имени Барзиллая.
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: и стал носить их имя
  rationale: 'Естественная русская передача пассивной конструкции: человек стал именоваться по имени семьи жены. Местоимение во множественном числе сохранено, чтобы не устранять референциальную особенность оригинала.'
theological_decisions: []
