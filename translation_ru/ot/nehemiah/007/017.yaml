- source_word: בְּנֵי
  choice: Сыновей
  rationale: В данном списке вернувшихся это форма сопряжённого множественного числа от «сын»; она обозначает потомков или род Азгада. Родительный оборот естественно продолжает подразумеваемое исчисление людей из предыдущего контекста и сохраняет лаконичную форму списка.
- source_word: עַזְגָּד
  choice: Азгада
  rationale: Личное или родовое имя передано традиционной русской транслитерацией; падежная форма обусловлена словом «сыновей».
- source_word: אַלְפַּיִם שְׁלֹשׁ מֵאוֹת עֶשְׂרִים וּשְׁנָיִם
  choice: 2 322
  rationale: Еврейская числовая последовательность означает «две тысячи триста двадцать два». Цифровая запись соответствует характеру переписного списка и современной русской типографике.
