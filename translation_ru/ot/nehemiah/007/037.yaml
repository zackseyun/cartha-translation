  rationale: Сохраняет формальную генеалогическую конструкцию еврейского текста; в данном перечне слово может обозначать также потомков или общину, связанную с названными местами, что отражено в сноске.
- source_word: לֹד
  choice: Лод
  rationale: Название места передано транслитерацией непосредственно с еврейской формы, без замены на более позднюю форму «Лидда».
