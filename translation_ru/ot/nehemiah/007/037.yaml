  choice: Хадид
  rationale: Собственное название места передано прямой транслитерацией с еврейского.
- source_word: וְאוֹנוֹ
  choice: и Оно
  rationale: Союз וְ передан словом «и», а название места אוֹנוֹ — транслитерацией «Оно».
- source_word: שְׁבַע מֵאוֹת וְעֶשְׂרִים וְאֶחָד
  choice: семьсот двадцать один
  rationale: Количественное числительное передано словами, что естественно для литературного русского текста и сохраняет стиль переписного списка.
