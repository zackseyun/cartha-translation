base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/013.yaml
  text: I also shook out the fold of my garment and said[a], “So may God shake out every man who does not fulfill this promise, from his house and from his labor; so may he be shaken out and emptied.” And all the assembly said, “Amen,” and praised Yahweh[c][b]. And the people did according to this promise.
translation:
  language: ru
  text: 'Я также вытряхнул полу своей одежды[a] и сказал: «Так пусть Бог вытряхнет всякого, кто не исполнит этого обещания, из его дома и лишит плодов его труда[b]. Пусть он будет так вытряхнут и оставлен ни с чем». Всё собрание сказало: «Аминь!» — и восхвалило Яхве. И народ поступил согласно этому обещанию.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «складку своей одежды» либо «переднюю часть своей одежды». Такая складка могла служить для переноски предметов; жест Неемии изображает полное лишение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально возможно: «из его дома и от его труда». Еврейское слово может обозначать как сам труд, так и его плоды или приобретённое трудом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָצְנִי
  choice: полу своей одежды
  rationale: Слово обозначает переднюю складку или полу одежды, в которой можно было держать предметы; «пола одежды» конкретно передаёт символический жест Неемии.
- source_word: נָעַרְתִּי / יְנַעֵר / נָעוּר
  choice: вытряхнул / вытряхнет / вытряхнут
  rationale: Повтор одного русского корня сохраняет словесную связь между жестом Неемии и проклятием; «вытряхнуть» также передаёт образ полного удаления содержимого.
- source_word: כָּכָה
  choice: Так пусть
  rationale: 'В контексте символического проклятия эта формула естественно передаёт пожелание: с нарушителем должно произойти то же, что показано жестом.'
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Определённая форма здесь является обычным обозначением Бога Израиля; по-русски естественно употребить «Бог» без артиклевого уточнения.
- source_word: כָּל הָאִישׁ
  choice: всякого
  rationale: Выражение имеет обобщающее значение «каждый человек»; местоименное «всякого» естественно по-русски и не устраняет индивидуальную направленность проклятия.
- source_word: יָקִים אֶת הַדָּבָר הַזֶּה
  choice: не исполнит этого обещания
  rationale: В данном контексте речь идёт об исполнении публично принятого обязательства; «обещание» ясно связывает выражение с предшествующей клятвой.
- source_word: מִבֵּיתוֹ וּמִיגִיעוֹ
  choice: из дома и лишит плодов труда
  rationale: Синтаксис выражает удаление человека из его дома и от יְגִיעַ; последнее может означать как труд, так и его результат. В основном тексте выбран контекстуально ясный смысл результата труда, а неоднозначность отмечена в сноске.
- source_word: וָרֵק
  choice: опустошён
  rationale: Передаёт состояние полной лишённости и поддерживает образ вытряхнутой, оставшейся пустой складки одежды.
- source_word: הַקָּהָל
  choice: всё собрание
  rationale: Нейтрально и точно обозначает собравшееся сообщество, не создавая ненужных конфессиональных ассоциаций.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: כַדָּבָר הַזֶּה
  choice: исполнил обещанное
  rationale: Фраза отсылает к принятому народом обязательству; такой перевод естественен и ясно показывает, что народ действительно сделал то, что обещал.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Обобщающее мужское выражение כָּל הָאִישׁ
  choice: всякого
  alternative: каждого мужчину; каждого человека
  rationale: Контекст говорит о любом отдельном нарушителе обещания. «Всякого» сохраняет обобщающий единственный смысл, не добавляя утверждения, что проклятие ограничено только мужчинами.
- issue: Содержание жеста-проклятия
  choice: сохранён буквальный образ вытряхивания и опустошения
  alternative: истолковать только как лишение имущества
  rationale: Буквальный образ является частью публичного символического действия и допускает более широкую идею лишения дома, результатов труда и положения; перевод не сужает его до одной богословской трактовки.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Повтор «вытряхнул / вытряхнет / вытряхнут» намеренно сохраняет риторическую связь жеста и проклятия. Формулировка избегает архаизмов, но сохраняет торжественность публичной клятвы.
