lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: И были такие, которые говорили
  rationale: Оборот вводит одну из групп среди жалующихся. Перевод сохраняет экзистенциальную конструкцию и связь с предыдущим повествованием.
- source_word: בָּנֵינוּ וּבְנֹתֵינוּ אֲנַחְנוּ רַבִּים
  choice: Нас, наших сыновей и дочерей, много
  rationale: Сохраняется сжатое, несколько необычное построение еврейской фразы, где прямо присутствует «мы» и перечислены сыновья и дочери. Такая передача не сводит смысл безоговорочно к более гладкому «у нас много детей».
- source_word: וְנִקְחָה
  choice: Давайте добудем
  rationale: Когортатив первого лица множественного числа выражает призыв или решимость приобрести необходимое зерно. «Добудем» естественно передаёт получение пищи в условиях нужды, не создавая обязательного оттенка насильственного захвата.
- source_word: דָגָן
  choice: зерна
  rationale: Слово обозначает зерновые продукты, а не пищу вообще. Родительный падеж естественен после «добудем» в значении некоторого необходимого количества.
- source_word: וְנֹאכְלָה וְנִחְיֶה
  choice: чтобы нам есть и жить
  rationale: 'Последовательность форм в данном контексте выражает цель: зерно нужно для пропитания и сохранения жизни. Перевод сохраняет оба глагола и их лаконичность.'
