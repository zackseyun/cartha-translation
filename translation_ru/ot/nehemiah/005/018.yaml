  text: וַ/אֲשֶׁר֩ הָיָ֨ה נַעֲשֶׂ֜ה לְ/י֣וֹם אֶחָ֗ד שׁ֣וֹר אֶחָ֞ד צֹ֠אן שֵׁשׁ בְּרֻר֤וֹת וְ/צִפֳּרִים֙ נַֽעֲשׂוּ לִ֔/י וּ/בֵ֨ין עֲשֶׂ֧רֶת יָמִ֛ים בְּ/כָל יַ֖יִן לְ/הַרְבֵּ֑ה וְ/עִם זֶ֗ה לֶ֤חֶם הַ/פֶּחָה֙ לֹ֣א בִקַּ֔שְׁתִּי כִּֽי כָֽבְדָ֥ה הָ/עֲבֹדָ֖ה עַל הָ/עָ֥ם הַ/זֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/018.yaml
  text: What was prepared for each day was one ox and six choice sheep[a]; also birds were prepared for me, and every ten days an abundance of all kinds of wine. Yet even with this, I did not demand the governor’s food allowance[b], because the service was heavy on this people.
translation:
  language: ru
  text: На каждый день готовили одного быка, шесть отборных овец и птиц для меня; а раз в десять дней в изобилии было вино всех сортов. Но при всём этом я не требовал продовольствия, положенного правителю[a], потому что работа тяжким бременем лежала на этом народе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хлеба правителя»; возможно также: «припасов правителя». Речь, по-видимому, идёт об официальном продовольственном обеспечении, полагавшемся правителю.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что труд был тяжёл для этого народа». Еврейское выражение подчёркивает тяжесть лежавшего на народе бремени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר הָיָה נַעֲשֶׂה לְיוֹם אֶחָד
  choice: На каждый день готовили
  rationale: Пассивная форма от עשה в контексте пищи означает приготовление, а לְיוֹם אֶחָד указывает на ежедневный объём припасов. Русская неопределённо-личная конструкция звучит естественно и сохраняет смысл.
- source_word: שׁוֹר אֶחָד
  choice: одного быка
  rationale: שׁוֹר обозначает крупное рогатое животное; в перечне животных, приготовленных в пищу, «бык» — ясный и обычный русский эквивалент без архаического «вол».
- source_word: צֹאן שֵׁשׁ בְּרֻרוֹת
  choice: шесть отборных овец
  rationale: צֹאן может обозначать мелкий скот собирательно, но сочетание с числительным и формой женского рода בְּרֻרוֹת естественно передаётся как «овцы»; определение выражает отборное качество.
- source_word: וְצִפֳּרִים נַעֲשׂוּ לִי
  choice: и птиц для меня
  rationale: צִפֳּרִים — широкое обозначение птиц. Глагол «готовили» из начала предложения распространяется на этот однородный элемент, что устраняет тяжеловесный повтор в русском.
- source_word: וּבֵין עֲשֶׂרֶת יָמִים
  choice: а раз в десять дней
  rationale: Оборот обозначает повторяющийся десятидневный промежуток; «раз в десять дней» идиоматично передаёт эту периодичность.
- source_word: בְּכָל יַיִן לְהַרְבֵּה
  choice: множество всякого вина
  rationale: Переданы и разнообразие, выраженное בְּכָל, и обилие, выраженное לְהַרְבֵּה, без уточнения конкретных сортов, которых источник не называет.
- source_word: וְעִם זֶה
  choice: Но при всём этом
  rationale: 'Оборот вводит уступительное противопоставление: несмотря на значительные расходы, Неемия не пользовался положенным правителю обеспечением.'
- source_word: לֶחֶם הַפֶּחָה
  choice: продовольствия, положенного правителю
  rationale: Буквально «хлеб правителя»; לֶחֶם метонимически обозначает пищу или продовольственное обеспечение, связанное с должностью областеначальника.
- source_word: לֹא בִקַּשְׁתִּי
  choice: я не требовал
  rationale: בקשׁ может означать просьбу или требование. В контексте должностного обеспечения «не требовал» ясно показывает добровольный отказ от законного притязания, не превращая его в запрет.
- source_word: כִּי כָבְדָה הָעֲבֹדָה עַל הָעָם הַזֶּה
  choice: потому что работа тяжким бременем лежала на этом народе
  rationale: Образ тяжести, заключённый в כבד и конструкции с עַל, сохранён, а עֲבֹדָה оставлено широким словом «работа», чтобы не сужать значение до налога либо конкретной повинности.
theological_decisions:
- issue: Социально-этический смысл отказа Неемии от должностного обеспечения
  choice: Неемия не стал требовать положенное правителю продовольствие, поскольку народ уже был обременён работой.
  alternative: Неемия лишь не попросил хлеба либо отказался от отдельного налога, взимавшегося правителем.
  rationale: Контекст должности и формула «хлеб правителя» указывают на официальное продовольственное обеспечение. Перевод показывает отказ Неемии от своего притязания ради народа, но не утверждает сверх текста, в какой именно форме это обеспечение собиралось.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан плавным и понятным; сохранены образ тяжёлого бремени и неопределённость слова עֲבֹדָה. Термин «правитель» выбран как доступное обозначение персидского областного должностного лица.
