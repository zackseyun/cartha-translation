base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/016.yaml
  text: And I also applied myself to the work on this wall[a], and we did not buy any field[b], and all my young men were gathered there for the work.
translation:
  language: ru
  text: Также я участвовал в работе над этой стеной[a]; мы не приобрели ни одного поля, и все мои люди[b] были собраны там для работы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взялся за работу над этой стеной» или «усердно трудился над этой стеной». Еврейский глагол буквально связан с идеей «крепко держаться»; здесь он выражает личное участие в работе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мои молодые люди», «мои слуги» или «мои помощники».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Также
  rationale: Передаёт добавочное значение וְגַם и естественно связывает стих с предшествующим контекстом.
- source_word: בִּמְלֶאכֶת הַחוֹמָה הַזֹּאת
  choice: за работу на этой стене
  rationale: Естественная русская передача מְלָאכָה с בְּ; указательное выражение «эта стена» сохранено без добавления отсутствующего в тексте слова «городская».
- source_word: הֶחֱזַקְתִּי
  choice: я сам взялся
  rationale: Hiphil глагола חזק в данном контексте означает деятельно взяться за дело, приложить к нему усилия. «Сам» проясняет личное участие Неемии, заложенное в форме первого лица, не превращая выражение в буквальное «укреплял».
- source_word: וְשָׂדֶה לֹא קָנִינוּ
  choice: Мы не приобрели ни одного поля
  rationale: Сохранено первое лицо множественного числа קָנִינוּ. «Приобрели» допускает как покупку, так и более широкое приобретение, а отрицательное «ни одного поля» естественно передаёт неопределённое собирательное значение שָׂדֶה.
- source_word: נְעָרַי
  choice: мои слуги
  rationale: נַעַר может означать юношу, слугу или сопровождающего. В контексте людей, состоявших при правителе и назначенных на работу, «слуги» звучит естественнее, при этом лексическая неоднозначность отмечена в сноске.
- source_word: קְבוּצִים שָׁם עַל הַמְּלָאכָה
  choice: были собраны там для работы
  rationale: Сохранены пассивное значение причастия קְבוּצִים, наречие שָׁם и целевая/служебная направленность עַל הַמְּלָאכָה.
