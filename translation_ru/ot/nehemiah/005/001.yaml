lexical_decisions:
- source_word: וַתְּהִי
  choice: И поднялся
  rationale: Форма повествования вводит новое развитие событий; «поднялся» естественно передаёт возникновение громкого общественного протеста, а союз «и» сохраняет связь с предшествующим рассказом.
- source_word: צַעֲקַת
  choice: вопль
  rationale: Слово обозначает крик бедствия или протеста. «Вопль» передаёт силу и эмоциональную напряжённость, не сводя происходящее к обычной жалобе.
- source_word: הָעָם
  choice: народа
  rationale: Прямое и достаточно широкое обозначение общины; уточнение социального слоя в исходном слове прямо не выражено.
- source_word: וּנְשֵׁיהֶם
  choice: и их жён
  rationale: В данной форме אשה естественнее всего означает жён; перевод сохраняет их явное участие в протесте.
- source_word: גְּדוֹלָה
  choice: великий
  rationale: Прилагательное указывает на значительность и силу вопля. «Великий вопль» — понятное и достойное сочетание, близкое к форме оригинала.
- source_word: אֶל
  choice: против
  rationale: В контексте жалобы предлог указывает на тех, против кого направлен протест.
- source_word: אֲחֵיהֶם
  choice: своих братьев
  rationale: Сохраняется буквальный образ братства и внутригрупповой солидарности; возвратное «своих» естественно по-русски соотносит братьев с народом и его жёнами.
- source_word: הַיְּהוּדִים
  choice: иудеев
  rationale: «Иудеи» в русском библейском и историческом контексте может обозначать народ Иуды и сохраняет возможное этнорегиональное значение термина.
theological_decisions:
- issue: Значение этнонима יְהוּדִים
  choice: иудеи
  alternative: евреи
  rationale: Еврейское слово допускает как этнорелигиозный, так и регионально-исторический оттенок. В книге Неемии «иудеи» естественно отражает связь с Иудой, тогда как возможный более широкий этнический смысл отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Дефисное сочетание «братьев-иудеев» ясно показывает, что второе существительное уточняет первое, и сохраняет напряжение исходного выражения о притеснении внутри одной общины.
