  text: וַ/יִּ֥חַר לִ֖/י מְאֹ֑ד כַּ/אֲשֶׁ֤ר שָׁמַ֨עְתִּי֙ אֶת זַֽעֲקָתָ֔/ם וְ/אֵ֖ת הַ/דְּבָרִ֥ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/006.yaml
  text: I became very angry when I heard their outcry and these words[a].
translation:
  language: ru
  text: Я очень разгневался, когда услышал их вопль и эти слова[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и обо всём этом». Еврейское слово может означать как произнесённые слова, так и то, о чём сообщалось.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לִי
  choice: я разгневался
  rationale: Еврейская идиома выражает вспыхнувший в человеке гнев. «Я разгневался» естественно и с надлежащей силой передаёт её по-русски, не прибегая к буквальному «во мне воспылало».
- source_word: מְאֹד
  choice: очень
  rationale: Наречие усиливает выражение гнева; «очень» ясно и естественно передаёт степень.
- source_word: כַּאֲשֶׁר
  choice: когда
  rationale: В данном контексте союз указывает на обстоятельство и время возникновения гнева после услышанного.
- source_word: שָׁמַעְתִּי
  choice: услышал
  rationale: Глагол обозначает восприятие жалобы; «услышал» является прямым и естественным соответствием.
- source_word: זַעֲקָתָם
  choice: их вопль
  rationale: Слово обозначает крик бедствия или протеста. «Вопль» сохраняет эмоциональную силу и контекст тяжёлой общественной жалобы.
- source_word: וְאֵת הַדְּבָרִים הָאֵלֶּה
  choice: и эти слова
  rationale: דברים может обозначать как произнесённые слова, так и дела или обстоятельства. В непосредственном контексте «эти слова» прямо связывается с тем, что Неемия услышал, а возможный смысл «эти обстоятельства» сохранён в примечании.
