reference: Nehemiah 5:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: גַּ֞ם מִ/יּ֣וֹם אֲשֶׁר צִוָּ֣ה אֹתִ֗/י לִ/הְי֣וֹת פֶּחָ/ם֮ בְּ/אֶ֣רֶץ יְהוּדָה֒ מִ/שְּׁנַ֣ת עֶשְׂרִ֗ים וְ֠/עַד שְׁנַ֨ת שְׁלֹשִׁ֤ים וּ/שְׁתַּ֨יִם֙ לְ/אַרְתַּחְשַׁ֣סְתְּא הַ/מֶּ֔לֶךְ שָׁנִ֖ים שְׁתֵּ֣ים עֶשְׂרֵ֑ה אֲנִ֣י וְ/אַחַ֔/י לֶ֥חֶם הַ/פֶּ֖חָה לֹ֥א אָכַֽלְתִּי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/014.yaml
  text: Also[a], from the day that he appointed me to be governor in the land of Judah, from the twentieth year until the thirty-second year of King Artaxerxes—twelve years—I and my brothers did not eat the governor’s food allowance.
translation:
  language: ru
  text: Кроме того, с того дня, когда он назначил меня их правителем[a] в земле Иуды, с двадцатого по тридцать второй год царствования царя Артаксеркса — двенадцать лет — ни я, ни мои братья не ели хлеба правителя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст: «их правителем»; референт местоимения отдельно не назван.'
    reason: Передаёт суффикс множественного числа в פֶּחָם, не уточняя его референт интерпретацией.
  - marker: b
    text: 'Буквально: «хлеба правителя»; вероятно, имеются в виду продовольствие или содержание, которое правитель по обычаю получал от населения.'
    reason: Лексическая неоднозначность слова לֶחֶם и административный смысл всего выражения.
lexical_decisions:
- source_word: גַּם
  choice: Кроме того
  rationale: Передаёт добавочное значение частицы и естественно вводит следующий довод Неемии.
- source_word: מִיּוֹם אֲשֶׁר צִוָּה אֹתִי
  choice: с того дня, когда он назначил меня
  rationale: В административном контексте צִוָּה с указанием на должность означает официальное назначение, а не просто отданное повеление.
- source_word: לִהְיוֹת פֶּחָם
  choice: правителем
  rationale: פֶּחָה — правитель персидской области. Русская конструкция не выражает явно спорную референцию суффикса и остаётся естественной.
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: в земле Иуды
  rationale: Сохраняет географическую формулировку исходного текста, не заменяя её более интерпретирующим словом «область».
- source_word: מִשְּׁנַת עֶשְׂרִים וְעַד שְׁנַת שְׁלֹשִׁים וּשְׁתַּיִם לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
  choice: с двадцатого года царя Артаксеркса до его тридцать второго года
  rationale: Естественно передаёт датировку по годам царствования и ясно относит оба года к Артаксерксу.
- source_word: שָׁנִים שְׁתֵּים עֶשְׂרֵה
  choice: двенадцать лет
  rationale: Сохранено поясняющее резюме указанного временного промежутка.
- source_word: אֲנִי וְאַחַי
  choice: ни я, ни мои братья
  rationale: Сохраняет буквальное «мои братья» и вместе с отрицанием образует естественную русскую конструкцию.
- source_word: לֶחֶם הַפֶּחָה
  choice: хлеба правителя
  rationale: Буквальный образ сохранён в основном тексте, поскольку слово может обозначать как хлеб, так и продовольствие или должностное содержание; административный смысл пояснён в сноске.
- source_word: לֹא אָכַלְתִּי
  choice: не ели
  rationale: Сохраняется конкретный глагол «есть». Множественное число требуется русским составным подлежащим, хотя в еврейском глагол стоит в первом лице единственного числа.
theological_decisions:
- issue: Объём значения אַחַי
  choice: мои братья
  alternative: мои соплеменники / мои приближённые
  rationale: Исходное слово буквально означает братьев, хотя в контексте круг лиц может быть шире. Основной текст не устраняет эту неоднозначность.
- issue: Буквальное или административное понимание לֶחֶם הַפֶּחָה
  choice: хлеба правителя
  alternative: продовольственного содержания правителя
  rationale: Буквальная формулировка сохраняет образ исходного текста, а сноска сообщает вероятный административный смысл, не превращая его в единственно возможное прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Хронологическая вставка выделена тире; архаизмы и конфессионально окрашенная терминология не используются.
