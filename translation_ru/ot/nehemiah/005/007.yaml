base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/007.yaml
  text: Then I took counsel with myself[a], and I brought charges against the nobles and the officials, and I said to them, “You are exacting interest[c][b], each from his brother.” And I assembled a great assembly against them.
translation:
  language: ru
  text: 'Тогда я всё обдумал[a], предъявил обвинения знатным и начальникам[d] и сказал им: «Каждый из вас берёт проценты со своего брата»[b]. И я созвал против них большое собрание[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «моё сердце посоветовалось во мне»; то есть Неемия внутренне всё обдумал.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Каждый из вас налагает долговое бремя на своего брата». Слово, переведённое как «проценты», может обозначать бремя, связанное с займом или долгом.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «я поставил против них большое собрание»; речь идёт о созыве публичного собрания для разбирательства.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «вступил в спор со знатными и начальниками». Еврейский глагол может обозначать как предъявление обвинения, так и пререкание или противостояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵךְ לִבִּי עָלַי
  choice: я всё обдумал
  rationale: Еврейская идиома описывает внутреннее размышление и обдумывание решения. Такой перевод естественен по-русски и не смешивает эту фразу с упоминанием гнева в предыдущем стихе.
- source_word: וָאָרִיבָה
  choice: предъявил обвинения
  rationale: Глагол ריב может обозначать спор, противостояние или ведение обвинительного дела; здесь контекст публичного обличения руководителей допускает юридико-обвинительный оттенок.
- source_word: הַחֹרִים
  choice: знатным
  rationale: Слово обозначает представителей общественной знати Иудеи; «знатные» — ясное и уместное обозначение этой группы.
- source_word: הַסְּגָנִים
  choice: начальникам
  rationale: Термин обозначает должностных лиц или управителей. «Начальники» сохраняет отличие от знати, не приписывая им чрезмерно точного административного ранга.
- source_word: מַשָּׁא ... נשאים
  choice: взыскивает проценты
  rationale: В данном долговом контексте сочетание указывает на взимание наложенного на заём долгового бремени, обычно понимаемого как проценты. «Взыскивает» передаёт обвинительный тон.
- source_word: אִישׁ בְּאָחִיו
  choice: каждый из вас ... со своего брата
  rationale: Передаёт распределительное אישׁ и сохраняет родственное слово «брат», подчёркивающее, что речь идёт о притеснении соплеменников.
- source_word: וָאֶתֵּן עֲלֵיהֶם קְהִלָּה גְדוֹלָה
  choice: я созвал против них большое собрание
  rationale: Буквально говорится о том, что Неемия «поставил/дал» против них собрание; по смыслу это идиома созыва большого публичного собрания для разбирательства.
