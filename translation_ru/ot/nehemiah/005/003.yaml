    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: А другие говорили
  rationale: Оборот вводит ещё одну группу жалующихся; союз «а» естественно продолжает перечисление, а «другие» передаёт разграничение групп.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ וּבָתֵּינוּ
  choice: наши поля, виноградники и дома
  rationale: Конкретные названия имущества переданы прямо и естественно для современного русского языка.
- source_word: אֲנַחְנוּ עֹרְבִים
  choice: мы закладываем
  rationale: В данном контексте причастие от ערב означает передачу имущества в залог как обеспечение долга. «Закладываем» ясно выражает экономический смысл, не уточняя не названные в тексте условия сделки.
- source_word: וְנִקְחָה
  choice: чтобы раздобыть
  rationale: 'Форма выражает цель: имущество закладывают ради получения зерна. «Раздобыть» передаёт значение «получить, достать» и не добавляет идеи покупки, которой нет в самом глаголе.'
- source_word: דָגָן
  choice: зерно
  rationale: Слово обозначает зерновые продукты; «зерно» является точным и общеупотребительным соответствием.
- source_word: בָּרָעָב
  choice: во время голода
  rationale: Предлог обозначает обстоятельства происходящего; перевод сохраняет временно-ситуативный смысл и не усиливает его до явно причинного.
