  text: הָשִׁיבוּ֩ נָ֨א לָ/הֶ֜ם כְּ/הַ/יּ֗וֹם שְׂדֹתֵי/הֶ֛ם כַּרְמֵי/הֶ֥ם זֵיתֵי/הֶ֖ם וּ/בָתֵּי/הֶ֑ם וּ/מְאַ֨ת הַ/כֶּ֤סֶף וְ/הַ/דָּגָן֙ הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֔ר אֲשֶׁ֥ר אַתֶּ֖ם נֹשִׁ֥ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/011.yaml
  text: Please restore to them this very day their fields[a], their vineyards, their olive orchards, and their houses, and the hundredth part of the money, the grain, the new wine[b], and the oil that you have been exacting from them.
translation:
  language: ru
  text: Прошу, верните им сегодня же их поля, виноградники, оливковые сады и дома, а также сотую долю[a] денег, зерна, молодого вина и масла, которую вы с них взыскиваете[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сотую [часть]», то есть один процент; вероятно, речь идёт о доле, которую с них взимали.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которую вы начисляете им»; возможно также: «которые вы ссужаете им под процент».'
    reason: alternative_reading
lexical_decisions:
- source_word: הָשִׁיבוּ
  choice: верните
  rationale: 'Форма повелительного наклонения множественного числа от שוב в каузативном значении: заставить вернуться, возвратить. «Верните» естественно относится как к отнятой собственности, так и к взысканным средствам.'
- source_word: נָא
  choice: пожалуйста
  rationale: Частица смягчает настойчивое повеление; современное «пожалуйста» передаёт эту функцию без архаического оттенка.
- source_word: כְּהַיּוֹם
  choice: сегодня же
  rationale: 'Оборот выражает срочность и усиление: возвратить следует в этот самый день.'
- source_word: שְׂדֹתֵיהֶם
  choice: их поля
  rationale: Прямое и обычное обозначение сельскохозяйственных земель.
- source_word: כַּרְמֵיהֶם
  choice: виноградники
  rationale: Стандартное соответствие для כרם в перечне земельной собственности.
- source_word: זֵיתֵיהֶם
  choice: оливковые сады
  rationale: В параллельном перечне владений речь идёт о насаждениях оливковых деревьев как земельной собственности, а не только об отдельных деревьях.
- source_word: וּבָתֵּיהֶם
  choice: и дома
  rationale: Прямое соответствие, завершающее перечень возвращаемой собственности.
- source_word: וּמְאַת
  choice: а также сотую долю
  rationale: Буквально «сотую [часть]». Такая передача сохраняет финансовую конкретность текста, не определяя сверх сказанного, был ли это месячный процент или иной сбор.
- source_word: הַכֶּסֶף
  choice: денег
  rationale: כסף может означать серебро или деньги; в контексте займов и взысканий функциональное значение «деньги» наиболее естественно.
- source_word: הַדָּגָן
  choice: зерна
  rationale: Общее обозначение зерновых продуктов.
- source_word: הַתִּירוֹשׁ
  choice: молодого вина
  rationale: תירוש обычно обозначает новое, свежее вино; «молодое вино» сохраняет отличие от общего термина «вино».
- source_word: הַיִּצְהָר
  choice: масла
  rationale: Обычно имеется в виду свежее растительное, прежде всего оливковое, масло; контекст позволяет не добавлять уточнение в основном тексте.
- source_word: נֹשִׁים בָּהֶם
  choice: которую вы с них взыскиваете
  rationale: В контексте притеснения должников оборот может обозначать действия кредиторов и взимание долга или процента. Выбранная формулировка сохраняет обличительный смысл, не сужая его до одного строго технического механизма.
theological_decisions:
- issue: Характер «сотой доли» в осуждаемой долговой практике
  choice: Сохранено буквальное «сотую долю», связанную с деньгами и продуктами.
  alternative: Передать как «один процент» или прямо назвать это процентами по займу.
  rationale: Текст указывает долю, но не объясняет периодичность или точный правовой механизм взыскания. Буквальная дробь сохраняет историческую и нравственную напряжённость, не внося лишней определённости.
- issue: Значение נֹשִׁים в контексте кредитования
  choice: «взыскиваете»
  alternative: «берёте с них как процент» или «даёте им в долг под процент»
  rationale: Форма допускает понимание действия кредитора шире узкого технического термина. Основной текст передаёт притеснительное взыскание, а сноска сохраняет возможное кредитно-процентное прочтение.
translation_notes:
  register: Современный литературный русский язык с уважительным, но настойчивым тоном. «Сегодня же» передаёт срочность, а перечисление сохраняет ритм еврейского текста. Финансовая терминология намеренно не модернизирована сверх того, что позволяет источник.
