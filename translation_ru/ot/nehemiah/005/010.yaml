base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/010.yaml
  text: And I also[a], my brothers and my young men, are lending them money and grain. Please[c][b], let us stop this burden.
translation:
  language: ru
  text: И я, мои братья и мои слуги[a] также даём им в долг[b] деньги и зерно. Прошу, давайте же прекратим это бремя[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мои молодые люди» или «мои помощники».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать не только предоставление займа, но и положение кредитора, предъявляющего долговые требования.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «этот долг» или «это взыскание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֲנִי אַחַי וּנְעָרַי
  choice: И я, и мои братья, и мои слуги тоже
  rationale: Повтор союза «и» естественно оформляет в русском составное подлежащее, а «тоже» передаёт добавочное значение וְגַם. נְעָרַי в данном окружении вероятнее обозначает состоящих при Неемии слуг или помощников; буквальная возможность «мои молодые люди» отмечена в сноске.
- source_word: נֹשִׁים בָּהֶם
  choice: даём им в долг
  rationale: Причастие от נשׁה описывает действие кредитора. Выражение «даём им в долг» понятно современному читателю, а возможный оттенок предъявления долговых требований сохранён в сноске.
- source_word: כֶּסֶף וְדָגָן
  choice: деньги и зерно
  rationale: В контексте займа כֶּסֶף обозначает деньги, хотя буквально может означать серебро; דָּגָן — зерно как предмет продовольственного займа.
- source_word: נַעַזְבָה נָּא
  choice: Прошу, откажемся же
  rationale: Когортатив передаёт обращённый также к самому говорящему призыв, а נָא смягчает его как настоятельную просьбу. «Откажемся» сохраняет основной смысл оставления или прекращения практики.
- source_word: הַמַּשָּׁא הַזֶּה
  choice: этого взыскания
  rationale: В финансовом контексте מַשָּׁא может обозначать долговое взыскание или долговое бремя. «Взыскание» ясно называет практику, от которой призывает отказаться Неемия, не исключая отмеченных в сноске вариантов.
