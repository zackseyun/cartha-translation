  yaml_path: translation/ot/nehemiah/005/012.yaml
  text: And they said[a], “We will restore it, and from them we will require nothing; we will do as you say.” Then I called the priests and made them swear to do according to this word.
translation:
  language: ru
  text: 'И они сказали: «Мы всё вернём и ничего не будем с них требовать. Мы поступим так, как ты говоришь». Тогда я призвал священников и велел им поклясться поступить согласно этому слову[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно этому делу» или «согласно этому обязательству». Еврейское דָּבָר может означать «слово», «дело» или, в данном контексте, принятое на себя обязательство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׁיב
  choice: мы всё вернём
  rationale: Каузативная форма שׁוב обозначает возвращение отнятого или взысканного. Дополнение подразумевается из предыдущего стиха; «всё» естественно отсылает к перечисленному там имуществу и сборам.
- source_word: וּמֵהֶם לֹא נְבַקֵּשׁ
  choice: ничего не будем с них требовать
  rationale: В данном экономико-правовом контексте בקש означает требовать или взыскивать; перевод передаёт отказ от дальнейших притязаний.
- source_word: כֵּן נַעֲשֶׂה כַּאֲשֶׁר אַתָּה אוֹמֵר
  choice: мы поступим так, как ты говоришь
  rationale: «Так» явно передаёт כֵּן, а «как ты говоришь» сохраняет сравнительную конструкцию и подтверждение согласия исполнить требование Неемии.
- source_word: וָאֶקְרָא אֶת־הַכֹּהֲנִים
  choice: тогда я призвал священников
  rationale: קרא с прямым дополнением означает позвать или призвать; «тогда» передаёт последовательность повествовательных форм.
- source_word: וָאַשְׁבִּיעֵם
  choice: велел им поклясться
  rationale: Каузативная форма שבע означает побудить или обязать кого-либо дать клятву. Местоимение «им» сохраняет форму исходного текста; по контексту речь, вероятнее всего, о только что давших обещание знатных и начальствующих, тогда как священники присутствуют при клятве.
- source_word: לַעֲשׂוֹת כַּדָּבָר הַזֶּה
  choice: поступить согласно этому слову
  rationale: Перевод сохраняет предлог כ («согласно») и основное значение דָּבָר — «слово», не устраняя его контекстуального смысла обязательства или обещания.
