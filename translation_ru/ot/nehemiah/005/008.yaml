  text: וָ/אֹמְרָ֣/ה לָ/הֶ֗ם אֲנַ֣חְנוּ קָ֠נִינוּ אֶת אַחֵ֨י/נוּ הַ/יְּהוּדִ֜ים הַ/נִּמְכָּרִ֤ים לַ/גּוֹיִם֙ כְּ/דֵ֣י בָ֔/נוּ וְ/גַם אַתֶּ֛ם תִּמְכְּר֥וּ אֶת אֲחֵי/כֶ֖ם וְ/נִמְכְּרוּ לָ֑/נוּ וַֽ/יַּחֲרִ֔ישׁוּ וְ/לֹ֥א מָצְא֖וּ דָּבָֽר־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/008.yaml
  text: And I said to them[a], “We have bought back our Jewish brothers who were sold to the nations, as much as we were able. But now you yourselves are even selling your brothers[b], and they must be sold to us!” Then they were silent and found nothing to say.
translation:
  language: ru
  text: 'И я сказал им: «Мы выкупили наших братьев-иудеев, проданных другим народам, по мере своих возможностей. А теперь вы сами продаёте своих братьев — и они будут проданы нам!» Тогда они умолкли и не нашли, что ответить.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִינוּ
  choice: выкупали
  rationale: В контексте возвращения иудеев из долгового рабства у других народов глагол означает приобретение с целью освобождения; «выкупали» естественно передаёт этот смысл без дополнительной богословской нагрузки слова «искупляли».
- source_word: אַחֵינוּ הַיְּהוּדִים
  choice: наших братьев-иудеев
  rationale: Сохраняет мужской термин родства и прямо передаёт הַיְּהוּדִים; дефис помогает естественно выразить приложение «братья-иудеи».
- source_word: הַנִּמְכָּרִים לַגּוֹיִם
  choice: проданных другим народам
  rationale: Причастная пассивная конструкция сохранена; «другим народам» ясно обозначает чужеземные народы в данном контексте.
- source_word: כְּדֵי בָנוּ
  choice: насколько хватало наших средств
  rationale: Идиома указывает на предел доступных возможностей или ресурсов; выбранная формулировка естественна по-русски и подходит контексту выкупа.
- source_word: וְגַם אַתֶּם
  choice: А теперь вы сами
  rationale: «Сами» передаёт подчёркнутый контраст с действиями Неемии и его единомышленников; «теперь» естественно выявляет резкое противопоставление в речи.
- source_word: תִּמְכְּרוּ
  choice: продаёте
  rationale: Настоящее время передаёт прямое обвинение в происходящей практике.
- source_word: וְנִמְכְּרוּ לָנוּ
  choice: и они опять будут проданы нам
  rationale: 'Сохранено утвердительное следствие трудной и краткой еврейской фразы: действия обвиняемых приводят к тому, что соплеменников приходится вновь выкупать своим же. «Опять» делает подразумеваемую повторность ясной, не превращая фразу в вопрос.'
- source_word: וַיַּחֲרִישׁוּ
  choice: они умолкли
  rationale: Кратко и достойно передаёт наступившее молчание после обличения.
- source_word: וְלֹא מָצְאוּ דָּבָר
  choice: не нашли, что ответить
  rationale: Естественный русский эквивалент идиомы «не нашли слова», то есть не имели ответа.
theological_decisions:
- issue: Мужской термин родства אַחֵינוּ / אֲחֵיכֶם
  choice: братья
  alternative: соплеменники; братья и сёстры
  rationale: Основной текст сохраняет мужскую форму исходника и язык общинной солидарности, не расширяя её явно до «братьев и сестёр».
- issue: Синтаксическая сила וְנִמְכְּרוּ לָנוּ
  choice: 'утвердительное риторическое следствие: «и они опять будут проданы нам!»'
  alternative: 'риторический вопрос: «и их будут продавать нам?»'
  rationale: Еврейская фраза эллиптична и допускает вопросительное понимание, однако в ней нет явного вопросительного показателя. Утвердительное прочтение сохраняет её форму и абсурдное следствие обличаемой практики.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис сделан ясным для широкого читателя; сохранены резкое противопоставление и обвинительный тон. Сноски не добавлены, поскольку необходимые смысловые решения можно отразить без перегрузки основного текста.
