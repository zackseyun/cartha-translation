  source_fidelity: 'Основной смысл передан верно: речь идёт о ещё одной группе жалующихся, взявшей деньги в долг для уплаты установленного царского сбора, связанного с их полями и виноградниками. Однако «нам пришлось» добавляет выраженную вынужденность, которой в форме לָוִינוּ («мы заняли / взяли взаймы») нет; контекст жалобы может её подразумевать, но перевод не должен делать её явной.'
