  yaml_path: translation/ot/nehemiah/005/004.yaml
  text: And there were those who said[b][a], “We have borrowed money for the king’s tax on our fields and our vineyards.”
translation:
  language: ru
  text: 'Были и такие, которые говорили: «Мы заняли денег, чтобы уплатить царский налог[a] с наших полей и виноградников».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царскую дань».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר אֹמְרִים
  choice: Были и такие, которые говорили
  rationale: Экзистенциальная конструкция вводит ещё одну группу жалующихся; настоящее причастие передано естественной для русского повествования формой прошедшего времени.
- source_word: לָוִינוּ
  choice: Нам пришлось занять
  rationale: Глагол обозначает получение денег взаймы. Конструкция «пришлось» естественно выражает вынужденность, подразумеваемую жалобой, не меняя основного смысла.
- source_word: כֶסֶף
  choice: денег
  rationale: Буквально «серебра», но в данном хозяйственном контексте слово означает деньги.
- source_word: לְמִדַּת הַמֶּלֶךְ
  choice: чтобы уплатить царский налог
  rationale: מִדָּה здесь обозначает установленный царём сбор; «налог» — наиболее ясный современный русский эквивалент.
- source_word: שְׂדֹתֵינוּ וּכְרָמֵינוּ
  choice: с наших полей и виноградников
  rationale: Именная группа, вероятно, указывает земельные владения, с которых взимался налог; предлог «с» естественно выражает это по-русски.
