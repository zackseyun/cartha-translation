  terminology: «Царский налог» — удачный современный эквивалент מִדַּת הַמֶּלֶךְ; вариант «царская дань» уместно сохранён в сноске. «С наших полей и виноградников» естественно передаёт связь сбора с земельными владениями и не утверждает более конкретного механизма обложения.
