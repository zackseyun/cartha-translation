base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/009.yaml
  text: So I said[a], “What you are doing is not good. Should you not walk in the fear of our God because of the reproach of the nations, our enemies?”
translation:
  language: ru
  text: 'И я сказал: «То, что вы делаете, нехорошо. Разве вам не следует ходить в страхе перед нашим Богом из-за поношения со стороны народов, наших врагов?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы избежать поношения со стороны народов, наших врагов». Еврейский предлог может указывать как на побуждающую причину, так и на намерение избежать поношения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И я сказал
  rationale: Последовательная форма с וַ־ продвигает повествование; в русском контексте естественно передать подразумеваемого говорящего местоимением первого лица.
- source_word: לֹא טוֹב
  choice: Нехорошо
  rationale: Сохраняет прямую нравственную оценку еврейского выражения, не усиливая её до более узкого «неправильно» или «несправедливо».
- source_word: הַדָּבָר אֲשֶׁר אַתֶּם עֹשִׂים
  choice: то, что вы делаете
  rationale: Естественно передаёт еврейскую именную конструкцию и прямо указывает на продолжающиеся действия адресатов.
- source_word: הֲלוֹא
  choice: Разве не следует
  rationale: Передаёт риторический вопрос с увещательным и нравственно обязывающим оттенком.
- source_word: בְּיִרְאַת אֱלֹהֵינוּ
  choice: в страхе перед нашим Богом
  rationale: Сохраняет значимое библейское понятие страха перед Богом и не сводит его лишь к почтению.
- source_word: תֵּלֵכוּ
  choice: ходить
  rationale: Сохраняет еврейскую метафору нравственного образа жизни; в сочетании «ходить в страхе перед Богом» она понятна русскому читателю.
- source_word: מֵחֶרְפַּת
  choice: из-за поношения со стороны
  rationale: Передаёт חֶרְפָּה как публичное бесчестие или злословие, а предлог מִן — в вероятном причинно-мотивирующем значении; возможное значение намеренного избегания вынесено в примечание.
- source_word: הַגּוֹיִם אֹיְבֵינוּ
  choice: народов, наших врагов
  rationale: «Народы» подходит для окружающих чужеземных народов, а приложение «наших врагов» сохраняет синтаксическую связь оригинала.
theological_decisions:
- issue: Нравственная метафора הלך в контексте верности Богу
  choice: Сохранить «ходить», а не заменять на «жить» или «поступать»
  alternative: жить; поступать
  rationale: Так сохраняется библейская метафора повседневного поведения перед Богом без внесения конфессионального истолкования.
- issue: Характер יִרְאָה по отношению к Богу
  choice: страх перед нашим Богом
  alternative: благоговение перед нашим Богом
  rationale: «Страх» сохраняет смысловую напряжённость и вес исходного слова; «благоговение» могло бы преждевременно сузить его до почтительности.
translation_notes:
  register: Современный литературный русский язык с сохранением понятных библейских оборотов. Риторический вопрос звучит естественно, а порядок слов и приложение не перегружены архаизмами.
