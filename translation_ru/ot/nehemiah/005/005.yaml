source:
  edition: WLC
  text: וְ/עַתָּ֗ה כִּ/בְשַׂ֤ר אַחֵ֨י/נוּ֙ בְּשָׂרֵ֔/נוּ כִּ/בְנֵי/הֶ֖ם בָּנֵ֑י/נוּ וְ/הִנֵּ֣ה אֲנַ֣חְנוּ כֹ֠בְשִׁים אֶת בָּנֵ֨י/נוּ וְ/אֶת בְּנֹתֵ֜י/נוּ לַ/עֲבָדִ֗ים וְ/יֵ֨שׁ מִ/בְּנֹתֵ֤י/נוּ נִכְבָּשׁוֹת֙ וְ/אֵ֣ין לְ/אֵ֣ל יָדֵ֔/נוּ וּ/שְׂדֹתֵ֥י/נוּ וּ/כְרָמֵ֖י/נוּ לַ/אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/005.yaml
  text: And now[a], our flesh is like the flesh of our brothers, our children like their children; yet here we are, forcing our sons and our daughters into slavery, and some of our daughters have already been enslaved. But it is not in our power to help[b], and our fields and our vineyards belong to others.
translation:
  language: ru
  text: И ныне плоть у нас та же, что у наших братьев, и наши дети — такие же, как их дети[a]. Но вот мы обращаем своих сыновей и дочерей в рабство, и некоторые из наших дочерей порабощены. Мы ничего не можем с этим поделать[b], а наши поля и виноградники принадлежат другим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наша плоть — как плоть наших братьев, наши сыновья — как их сыновья». Образ общей плоти подчёркивает родство и равное человеческое достоинство.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «у нашей руки нет силы». То есть у них нет ни возможности, ни средств изменить положение; их поля и виноградники принадлежат другим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּבְשַׂר אַחֵינוּ בְּשָׂרֵנוּ
  choice: плоть у нас та же, что у наших братьев
  rationale: Сохраняет конкретный образ общей плоти, выражающий равное человеческое достоинство и родство, но передаёт его естественным русским синтаксисом.
- source_word: כִּבְנֵיהֶם בָּנֵינוּ
  choice: наши дети — такие же, как их дети
  rationale: בנים здесь обозначает детей в целом; далее еврейский текст уже отдельно называет сыновей и дочерей.
- source_word: כֹבְשִׁים ... לַעֲבָדִים
  choice: обращаем ... в рабство
  rationale: Глагол כבשׁ в сочетании с לַעֲבָדִים обозначает подчинение людей с приведением их в рабское состояние; перевод не смягчает долговое рабство до простого служения.
- source_word: מִבְּנֹתֵינוּ נִכְבָּשׁוֹת
  choice: некоторые из наших дочерей уже порабощены
  rationale: Страдательное причастие описывает уже наступившее состояние дочерей; «уже» естественно выявляет контраст с продолжающейся угрозой детям.
- source_word: וְאֵין לְאֵל יָדֵנוּ
  choice: мы ничего не можем с этим поделать
  rationale: Естественно передаёт идиому отсутствия силы или средств; אֵל здесь понимается как «сила, возможность», а не как наименование Бога.
- source_word: וּשְׂדֹתֵינוּ וּכְרָמֵינוּ לַאֲחֵרִים
  choice: а наши поля и виноградники принадлежат другим
  rationale: В русском языке связка «принадлежат» ясно передаёт смысл еврейского именного предложения, не превращая формально сочинительную связь в явно причинную.
theological_decisions:
- issue: Родственная лексика в жалобе на социальную несправедливость
  choice: «братья» в первой части и «дети» в общем сравнении
  alternative: «родичи» и «сыновья»
  rationale: Так сохраняется мужской термин אַחֵינוּ, тогда как בנים по контексту охватывает детей обоих полов; далее сыновья и дочери названы раздельно.
- issue: Степень выраженности рабства
  choice: «обращаем в рабство» и «порабощены»
  alternative: «отдаём в услужение» и «находятся в услужении»
  rationale: Речь идёт о долговом порабощении детей, поэтому более мягкая лексика скрыла бы тяжесть описываемого положения.
- issue: Значение אֵל в выражении וְאֵין לְאֵל יָדֵנוּ
  choice: сила или возможность, а не имя Бога
  alternative: понимание אֵל как указания на Бога
  rationale: Устойчивая конструкция описывает отсутствие у человека силы или средств; контекст утраченной земли подтверждает это прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Конкретный образ «плоти» сохранён, а непрозрачная идиома о руке и силе передана естественным русским выражением. Сочинительная связь перед последней фразой сохранена, чтобы не делать причинное отношение более явным, чем в еврейском тексте.
