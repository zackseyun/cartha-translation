translation_notes:
  register: Современный литературный русский язык с сохранением достоинства повествования. Начальная конструкция без добавочного «теперь» или «итак» соответствует отсутствию явного временного наречия в еврейском тексте. Порядок слов делает общий образ стола ясным и сохраняет структуру перечня.
