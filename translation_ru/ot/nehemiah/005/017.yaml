base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/017.yaml
  text: The Jews and the officials[a], a hundred and fifty men, and those who came to us from the nations that were around us[b], were at my table.
translation:
  language: ru
  text: За моим столом были иудеи[a] и начальники — сто пятьдесят человек, — а также те, кто приходил к нам из окрестных народов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «евреи». Здесь слово может иметь как историко-географический, так и более широкий этнический смысл.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «за моим столом» означает, что Неемия обеспечивал этих людей пищей, исполняя обязанности правителя и оказывая гостеприимство.
    reason: cultural_note
lexical_decisions:
- source_word: וְהַיְּהוּדִים
  choice: иудеи
  rationale: В книге Неемии слово может обозначать как жителей Иудеи, так и принадлежащих к иудейскому народу. «Иудеи» сохраняет историко-географический оттенок и естественно звучит в данном контексте; возможное более широкое понимание отмечено в сноске.
- source_word: וְהַסְּגָנִים
  choice: начальники
  rationale: Речь идёт о гражданских руководителях или представителях администрации. «Начальники» понятно современному читателю и не приписывает им более конкретного персидского титула, которого текст не называет.
- source_word: מֵאָה וַחֲמִשִּׁים אִישׁ
  choice: сто пятьдесят человек
  rationale: Число относится к иудеям и начальникам; «человек» естественно передаёт счётное употребление אִישׁ в русском языке, не усиливая без необходимости указание на пол.
- source_word: וְהַבָּאִים אֵלֵינוּ
  choice: а также те, кто приходил к нам
  rationale: Причастие обозначает приходивших или приезжавших к Неемии людей. Несовершенный вид «приходил» сохраняет возможный повторяющийся или продолжающийся характер посещений.
- source_word: מִן הַגּוֹיִם אֲשֶׁר סְבִיבֹתֵינוּ
  choice: из окрестных народов
  rationale: גּוֹיִם здесь означает соседние народы, вероятно неиудейские. «Окрестные народы» кратко и естественно передаёт географический смысл, не вводя более богословски нагруженное «язычники».
- source_word: עַל שֻׁלְחָנִי
  choice: за моим столом
  rationale: Буквально образ связан со столом Неемии и подразумевает питание за его счёт. Русское выражение сохраняет образ, а административно-гостеприимный смысл поясняется в сноске.
