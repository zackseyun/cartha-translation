  text: וְ/הַ/פַּחוֹת֩ הָ/רִאשֹׁנִ֨ים אֲשֶׁר לְ/פָנַ֜/י הִכְבִּ֣ידוּ עַל הָ/עָ֗ם וַ/יִּקְח֨וּ מֵ/הֶ֜ם בְּ/לֶ֤חֶם וָ/יַ֨יִן֙ אַחַר֙ כֶּֽסֶף שְׁקָלִ֣ים אַרְבָּעִ֔ים גַּ֥ם נַעֲרֵי/הֶ֖ם שָׁלְט֣וּ עַל הָ/עָ֑ם וַ/אֲנִי֙ לֹא עָשִׂ֣יתִי כֵ֔ן מִ/פְּנֵ֖י יִרְאַ֥ת אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/015.yaml
  text: But the former governors who were before me laid heavy burdens on the people[a], and took from them bread and wine, besides forty shekels of silver. Even their servants ruled over the people. But I did not do so[c][b], because of the fear of God.
translation:
  language: ru
  text: А прежние наместники, бывшие до меня, обременяли народ и брали с него хлеб и вино сверх сорока шекелей серебра.[a] Даже их слуги властвовали над народом.[b] Но я так не поступал из страха перед Богом.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский оборот необычен; возможно также: «а также сорок шекелей серебра». По-видимому, речь идёт о денежном сборе в дополнение к хлебу и вину.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «служители», «молодые люди». Здесь, вероятно, имеются в виду подчинённые наместников.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «из благоговения перед Богом». Буквально: «из-за страха Божьего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפַּחוֹת הָרִאשֹׁנִים אֲשֶׁר לְפָנַי
  choice: прежние наместники, бывшие до меня
  rationale: «Наместники» естественно передаёт название провинциальных правителей персидского периода, а оборот «бывшие до меня» сохраняет образ и указывает на предшественников Неемии.
- source_word: הִכְבִּידוּ עַל הָעָם
  choice: обременяли народ
  rationale: Глагол породы хифиль от כבד буквально выражает возложение тяжести; «обременяли» сохраняет метафору и подходит к контексту поборов.
- source_word: וַיִּקְחוּ מֵהֶם בְּלֶחֶם וָיַיִן
  choice: брали с него хлеб и вино
  rationale: Сохранены простой глагол «брать» и конкретные виды натурального сбора — хлеб и вино.
- source_word: אַחַר כֶּסֶף שְׁקָלִים אַרְבָּעִים
  choice: сверх сорока шекелей серебра
  rationale: 'В данном контексте אַחַר вероятнее всего обозначает добавочный сбор: натуральные поборы взимались сверх денежной суммы. Необычность еврейского оборота отмечена в сноске.'
- source_word: נַעֲרֵיהֶם
  choice: их слуги
  rationale: Хотя נַעַר может означать молодого человека, в административном контексте слово обозначает состоящих при наместниках подчинённых или служителей.
- source_word: שָׁלְטוּ עַל הָעָם
  choice: властвовали над народом
  rationale: Передаёт осуществление господства и власти, не добавляя более конкретного характера злоупотреблений, чем выражено в источнике.
- source_word: וַאֲנִי לֹא עָשִׂיתִי כֵן
  choice: Но я так не поступал
  rationale: Прямо и естественно передаёт противопоставление поведения Неемии действиям прежних наместников.
- source_word: מִפְּנֵי יִרְאַת אֱלֹהִים
  choice: из страха перед Богом
  rationale: Сохраняет библейскую формулу «страх Божий» и причинное значение оборота, не сводя его лишь к уважению.
theological_decisions:
- issue: Передача יִרְאַת אֱלֹהִים
  choice: из страха перед Богом
  alternative: из благоговения перед Богом; потому что я боялся Бога
  rationale: Выбранная формулировка сохраняет богословски значимый библейский образ страха Божьего как благоговейной ответственности перед Ним, не устраняя присущую выражению смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. «Наместники», «шекели» и «страх перед Богом» сохраняют историко-библейскую конкретность; синтаксис упрощён до естественной русской фразы без устранения неоднозначности необычного оборота о сборах.
