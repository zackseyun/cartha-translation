base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/005/019.yaml
  text: Remember me[a], my God, for good, for all that I have done for this people.
translation:
  language: ru
  text: Боже мой, вспомни обо мне с благосклонностью за всё, что я сделал для этого народа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во благо»; возможен также смысл: «вспомни обо мне к моему благу».'
    reason: Лְטוֹבָה может обозначать благосклонное памятование либо благой результат такого памятования; русская основная формулировка передаёт первый смысл естественно, не исключая второго.
lexical_decisions:
- source_word: זָכְרָה לִּי
  choice: Вспомни обо мне
  rationale: Молитвенное обращение с глаголом זכר и местоименным дативом естественно передаётся по-русски как просьба «вспомни обо мне».
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Форма с суффиксом первого лица в прямом обращении передана русским звательным оборотом, сохраняющим личный молитвенный тон.
- source_word: לְטוֹבָה
  choice: во благо
  rationale: Сохраняет смысл благоприятного, благого результата Божьего памятования, не уточняя сверх текста, идёт ли речь только о личной пользе или о благосклонной оценке.
- source_word: כֹּל אֲשֶׁר עָשִׂיתִי
  choice: всё, что я сделал
  rationale: Прямая и естественная передача относительной конструкции и завершённого действия.
- source_word: עַל הָעָם הַזֶּה
  choice: для этого народа
  rationale: В данном контексте עַל при עשה обозначает действия ради народа или в его пользу; «для» звучит естественно и сохраняет этот смысл.
theological_decisions:
- issue: Характер просьбы Неемии о Божьем памятовании
  choice: Просьба к Богу благосклонно вспомнить Неемию в связи с тем, что он сделал для народа
  alternative: Требование награды за заслуги или просьба о публичном оправдании
  rationale: Текст связывает молитву с делами Неемии, но сам по себе не определяет это как притязание на заслуженную награду. Формулировка сохраняет данное богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified молитвенным звучанием. Тире помогает отделить уточняющее основание просьбы, не устраняя синтаксической неоднозначности еврейской фразы.
