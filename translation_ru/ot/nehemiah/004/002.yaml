base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/002.yaml
  text: And all of them conspired together to come and fight against Jerusalem and to cause confusion in it[a].
translation:
  language: ru
  text: И все они сообща сговорились пойти войной на Иерусалим и посеять в нём смятение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и устроить в нём беспорядок»; еврейское слово может означать смятение, беспорядок или беду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְשְׁרוּ
  choice: сговорились
  rationale: Глагол קשר в породе qal обозначает составление заговора или вступление в союз с враждебной целью; «сговорились» естественно передаёт тайный согласованный умысел.
- source_word: כֻלָּם יַחְדָּו
  choice: все они сообща
  rationale: Сочетание подчёркивает и полноту группы, и согласованность действий; «все они сообща» сохраняет оба оттенка без тяжеловесного повтора.
- source_word: לָבוֹא לְהִלָּחֵם
  choice: пойти войной
  rationale: Буквально сочетание выражает намерение «прийти, чтобы сражаться». Русское «пойти войной» естественно сохраняет значение направленного движения и вооружённого выступления.
- source_word: בִּירוּשָׁלָם
  choice: на Иерусалим
  rationale: При глаголе враждебного действия предлог בְּ указывает на объект нападения; по-русски это естественно передаётся сочетанием «пойти войной на Иерусалим».
- source_word: וְלַעֲשׂוֹת לוֹ
  choice: и посеять в нём
  rationale: עשה с последующим существительным означает вызвать или создать определённое состояние. «Посеять» идиоматично сочетается со «смятением», а «в нём» относит результат к Иерусалиму.
- source_word: תּוֹעָה
  choice: смятение
  rationale: Редкое существительное допускает значения смятения, беспорядка и беды. «Смятение» хорошо передаёт вызванную противником дезорганизацию, не уточняя её характер сверх текста.
