  yaml_path: translation/ot/nehemiah/004/014.yaml
  text: At the place where you hear the sound of the trumpet[a], gather there to us. Our God will fight for us.
translation:
  language: ru
  text: В том месте, где вы услышите звук рога[a], собирайтесь к нам. Наш Бог будет сражаться за нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звук шофара». Шофар — рог, обычно бараний, использовавшийся как сигнальный инструмент.'
    reason: Уточнение конкретного значения еврейского слова שׁוֹפָר и сохранение традиционного названия как лексической альтернативы.
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: В каком месте
  rationale: Сочетание сохраняет конкретный пространственный смысл מָקוֹם и естественно вводит относительное придаточное в современном русском языке.
- source_word: תִּשְׁמְעוּ
  choice: услышите
  rationale: Форма обозначает действие во множественном числе; совершенный вид в будущем времени естественно передаёт условно-временной смысл указания.
- source_word: קוֹל הַשּׁוֹפָר
  choice: звук рога
  rationale: קוֹל прямо означает «звук», а שׁוֹפָר — сигнальный рог; такой перевод точнее общего слова «труба» и остаётся понятным по контексту.
- source_word: שָׁמָּה תִּקָּבְצוּ
  choice: туда собирайтесь
  rationale: «Туда» передаёт направительное значение שָׁמָּה, а «собирайтесь» естественно выражает повелительную силу нифаля קבץ.
- source_word: אֵלֵינוּ
  choice: к нам
  rationale: Сохранено ясное первое лицо множественного числа, без исправления на встречающееся в некоторых переводах «ко мне».
- source_word: אֱלֹהֵינוּ
  choice: Наш Бог
  rationale: Притяжательный суффикс сохранён как значимый элемент обращения.
- source_word: יִלָּחֶם לָנוּ
  choice: будет сражаться за нас
  rationale: Глагол приписывает само сражение Богу, а לָנוּ указывает, что оно совершается за народ и в его пользу.
theological_decisions:
- issue: Образ Бога как сражающегося за народ
  choice: Наш Бог будет сражаться за нас
  alternative: Наш Бог поможет нам сражаться
  rationale: Еврейский текст прямо называет Бога субъектом глагола «сражаться», а не только помощником людей; эта смысловая напряжённость сохранена.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным синтаксисом военного распоряжения. Лексика ясная и достойная; местоименное «к нам» и сильное утверждение о Божьем действии сохранены без гармонизации и смягчения.
