base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/007.yaml
  text: Then I stationed men in the lowest parts of the place[a], behind the wall, in the exposed areas; and I stationed the people by families, with their swords, their spears, and their bows.
translation:
  language: ru
  text: Тогда я поставил людей в самых низких местах за стеной, на открытых участках[a], и расставил народ по семьям — с мечами, копьями и луками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «на оголённых местах» или «на открытом пространстве». Редкое еврейское слово, вероятно, обозначает открытые, ничем не прикрытые участки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַעֲמִיד
  choice: я поставил / расставил
  rationale: Каузативная форма глагола עמד означает размещение людей на оборонительных позициях. В первом случае выбрано «поставил», во втором — естественное по-русски «расставил»; повтор действия сохранён без тяжеловесного буквального повтора.
- source_word: מִתַּחְתִּיּוֹת לַמָּקוֹם
  choice: в самых низких местах
  rationale: Оборот указывает на нижние или самые низкие части местности. Перевод сохраняет пространственный смысл и не уточняет сверх текста, почему эти участки были уязвимы.
- source_word: מֵאַחֲרֵי לַחוֹמָה
  choice: за стеной
  rationale: Естественно передаёт расположение с тыльной стороны стены в контексте организации обороны.
- source_word: בצחחיים
  choice: на открытых участках
  rationale: Редкое слово, вероятно, обозначает оголённые, открытые или ничем не защищённые места. Выбран вариант, понятный современному читателю; неопределённость отражена в сноске.
- source_word: לְמִשְׁפָּחוֹת
  choice: по семьям
  rationale: מִשְׁפָּחוֹת может обозначать семьи или более широкие родовые группы. «По семьям» ясно передаёт принцип организации народа и не вводит более специальное понятие «кланы».
- source_word: עִם חַרְבֹתֵיהֶם רָמְחֵיהֶם וְקַשְּׁתֹתֵיהֶם
  choice: с мечами, копьями и луками
  rationale: Прямо и естественно передаёт перечисление трёх видов оружия; принадлежность оружия людям по-русски ясна из конструкции без троекратного местоимения «их».
