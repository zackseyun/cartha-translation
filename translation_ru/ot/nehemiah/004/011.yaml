base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/011.yaml
  text: The builders on the wall[a], and those who carried burdens, loaded themselves so that with one hand each did the work[b], and with the other held his weapon.
translation:
  language: ru
  text: Строители, работавшие на стене, и носильщики тяжестей, бравшие на себя груз[a], — каждый одной рукой выполнял работу, а другой держал оружие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово עֹמְשִׂים встречается редко, и его точная функция в этой фразе не вполне ясна. Возможны переводы: «грузившие (материалы)», «бравшие на себя груз» или, по другому пониманию, «нагруженные».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское הַשָּׁלַח может обозначать более конкретно копьё, дротик или другое оружие.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבּוֹנִים בַּחוֹמָה
  choice: строители стены
  rationale: Субстантивированное причастие обозначает строящих; сочетание с בַּחוֹמָה в данном контексте естественно передаётся как «строители стены».
- source_word: וְהַנֹּשְׂאִים בַּסֶּבֶל
  choice: носильщики грузов
  rationale: Сочетание נשׂא с סבל относится к переносу тяжестей или строительных материалов; «носильщики грузов» ясно и естественно обозначает эту группу работников.
- source_word: עֹמְשִׂים
  choice: несли на себе ношу
  rationale: Редкое причастие, вероятно, описывает работников как нагруженных материалами. Формулировка сохраняет образ физической нагрузки, не уточняя сверх текста точный способ погрузки.
- source_word: בְּאַחַת יָדוֹ עֹשֶׂה בַמְּלָאכָה
  choice: одной рукой каждый выполнял работу
  rationale: 'Единственное число имеет распределительное значение: речь идёт о каждом работнике. «Выполнял работу» сохраняет значение עשה + מלאכה и звучит естественно.'
- source_word: וְאַחַת מַחֲזֶקֶת הַשָּׁלַח
  choice: а другой держал оружие
  rationale: Женский род причастия подразумевает вторую руку. הַשָּׁלַח может обозначать конкретное метательное или древковое оружие, но общее «оружие» не вносит недоказанной конкретизации.
