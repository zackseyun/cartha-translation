  text: So we kept doing the work[a], while half of them held the spears from the rising of the dawn until the coming out of the stars.
translation:
  language: ru
  text: И мы продолжали работу, а половина из них держала копья от рассвета до появления звёзд.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: продолжали работу
  rationale: Причастие в повествовательном контексте передаёт длительное, продолжающееся действие; выражение естественно звучит по-русски и не уточняет характер работы сверх еврейского текста.
- source_word: וְחֶצְיָם
  choice: а половина людей
  rationale: Союз связывает одновременные действия двух частей группы. Слово «людей» добавлено лишь для ясности местоименной отсылки, не меняя смысла.
- source_word: מַחֲזִיקִים בָּרְמָחִים
  choice: держала копья
  rationale: Причастие обозначает продолжительное держание оружия; «копья» — обычный и точный русский эквивалент רְמָחִים.
- source_word: מֵעֲלוֹת הַשַּׁחַר
  choice: от рассвета
  rationale: Идиоматично передаёт буквальное «от восхождения зари», сохраняя начальную временную границу.
- source_word: עַד צֵאת הַכּוֹכָבִים
  choice: до появления звёзд
  rationale: Передаёт конкретный образ выхода или появления звёзд, не заменяя его более толковательным «до наступления ночи».
