base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/016.yaml
  text: Also at that time I said to the people[a], “Let each man and his servant spend the night within Jerusalem[b], and let them be a guard for us by night and workers by day.”
translation:
  language: ru
  text: 'Тогда же я сказал народу: «Пусть каждый и его слуга[a] ночуют в Иерусалиме, и пусть ночью они несут для нас стражу, а днём работают[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово נַעַר может означать юношу, слугу, помощника или подчинённого — в зависимости от контекста.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть они будут для нас ночью стражей, а днём — работой»; то есть несут стражу ночью и выполняют работу днём.'
    reason: formal_equivalence
lexical_decisions:
- source_word: גַּם בָּעֵת הַהִיא
  choice: Тогда же
  rationale: Передаёт как временное указание, так и добавочную связь с предыдущими распоряжениями; выражение естественно для современного русского языка.
- source_word: אָמַרְתִּי לָעָם
  choice: я сказал народу
  rationale: Прямое и идиоматичное соответствие еврейской конструкции.
- source_word: אִישׁ וְנַעֲרוֹ
  choice: каждый вместе со своим слугой
  rationale: אִישׁ имеет здесь распределительное значение «каждый», а נַעַר в контексте организации труда и охраны естественно обозначает подчинённого слугу или помощника; «вместе со» ясно объединяет обоих как субъект последующего глагола во множественном числе.
- source_word: יָלִינוּ
  choice: ночует
  rationale: Глагол означает оставаться или проводить ночь; «ночует» кратко и ясно передаёт это значение.
- source_word: בְּתוֹךְ יְרוּשָׁלִָם
  choice: в Иерусалиме
  rationale: В данном контексте русское «в Иерусалиме» естественно обозначает пребывание внутри города; более буквальное «внутри Иерусалима» звучало бы тяжеловесно.
- source_word: הַלַּיְלָה מִשְׁמָר וְהַיּוֹם מְלָאכָה
  choice: ночью они охраняют нас, а днём работают
  rationale: Именные понятия «стража» и «работа» переданы глаголами, соответствующими роли этих людей; сохранены параллелизм и противопоставление ночи и дня.
