base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/008.yaml
  text: Then I looked[a], rose up, and said to the nobles, to the officials, and to the rest of the people, “Do not be afraid of them. Remember the Lord, who is great and fearsome, and fight for your brothers, your sons, your daughters, your wives[b], and your houses.”
translation:
  language: ru
  text: 'Тогда я осмотрелся, встал и сказал знатным, начальникам и остальному народу: «Не бойтесь их! Помните Господа — великого и грозного — и сражайтесь за своих братьев[a], сыновей, дочерей, жён и свои дома[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово стоит в форме мужского рода и буквально означает «братьев»; далее отдельно названы сыновья, дочери и жёны.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «свои семьи (домочадства)». Еврейское слово может обозначать и жилища, и домохозяйства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא
  choice: Тогда я осмотрелся
  rationale: Форма от ראה входит в последовательность решительных действий Неемии. «Осмотрелся» естественно передаёт намеренное обозрение обстановки; возможно также более буквальное «увидел».
- source_word: וָאָקוּם
  choice: встал
  rationale: קום здесь обозначает переход к решительному действию; «встал» точно и естественно для современного русского языка.
- source_word: הַחֹרִים
  choice: знатным
  rationale: חֹרִים — люди высокого общественного положения; субстантивированное «знатные» ясно передаёт социальный ранг.
- source_word: הַסְּגָנִים
  choice: начальникам
  rationale: סְגָנִים обозначает должностных лиц или подчинённых правителей. «Начальники» сохраняет управленческий смысл и звучит естественно; возможен вариант «сановники».
- source_word: יֶתֶר הָעָם
  choice: остальному народу
  rationale: Фраза отличает широкую массу народа от уже названных руководителей.
- source_word: אַל תִּירְאוּ מִפְּנֵיהֶם
  choice: Не бойтесь их
  rationale: Прямой и идиоматичный перевод запрета бояться противников.
- source_word: אֶת אֲדֹנָי
  choice: Господа
  rationale: אֲדֹנָי является божественным титулом и традиционно, ясно и точно передаётся как «Господь»; здесь это не тетраграмматон יהוה.
- source_word: הַגָּדוֹל וְהַנּוֹרָא
  choice: великого и грозного
  rationale: נוֹרָא обозначает внушающего благоговейный страх. «Грозный» сохраняет сильный смысл и не сводит его ни к обычной суровости, ни к ослабленному восхищению.
- source_word: זְכֹרוּ
  choice: Помните
  rationale: Прямой императив сохраняет вес и побудительную силу исходного текста.
- source_word: וְהִלָּחֲמוּ עַל
  choice: и сражайтесь за
  rationale: В данном контексте сочетание означает борьбу в защиту названных людей и домов.
- source_word: אֲחֵיכֶם
  choice: своих братьев
  rationale: Мужская форма множественного числа сохранена без расширения до «братьев и сестёр», поскольку далее отдельно перечислены другие члены семьи.
- source_word: בְּנֵיכֶם וּבְנֹתֵיכֶם נְשֵׁיכֶם וּבָתֵּיכֶם
  choice: сыновей, дочерей, жён и свои дома
  rationale: Конкретный накопительный перечень сохранён. «Дома» оставляет открытым диапазон значения между жилищами и домохозяйствами.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: Владыка
  rationale: Исходный текст содержит אֲדֹנָי, а не יהוה. «Господь» — общеупотребительная передача божественного титула, не смешивающая его с особым написанием имени יהוה.
- issue: Передача הַנּוֹרָא
  choice: грозный
  alternative: внушающий благоговейный страх; страшный
  rationale: Определение выражает Божье величие, вызывающее страх и благоговение, и намеренно противопоставлено страху перед врагами. «Грозный» сохраняет эту напряжённость без чрезмерно отрицательного оттенка слова «страшный».
- issue: Объём значения בָּתֵּיכֶם
  choice: свои дома
  alternative: свои семьи; свои домочадства
  rationale: בַּיִת может обозначать как жилище, так и семью или домохозяйство. Основной текст сохраняет буквальную широту слова «дома», а примечание поясняет возможный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Краткие императивы сохраняют напряжённость сцены. «Осмотрелся» подчёркивает оценку обстановки, а тире вокруг «великого и грозного» делает определение Господа ясным без добавления отсутствующего в еврейском относительного предложения.
