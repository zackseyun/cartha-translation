source:
  edition: WLC
  text: וַ/יְהִ֣י מִן הַ/יּ֣וֹם הַ/ה֗וּא חֲצִ֣י נְעָרַ/י֮ עֹשִׂ֣ים בַּ/מְּלָאכָה֒ וְ/חֶצְיָ֗/ם מַחֲזִיקִים֙ וְ/הָ/רְמָחִ֣ים הַ/מָּגִנִּ֔ים וְ/הַ/קְּשָׁת֖וֹת וְ/הַ/שִּׁרְיֹנִ֑ים וְ/הַ֨/שָּׂרִ֔ים אַחֲרֵ֖י כָּל בֵּ֥ית יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/010.yaml
  text: And from that day on[a], half of my young men were doing the work, and half of them were holding the spears, the shields, the bows, and the armor[c][b]; and the officers were behind all the house of Judah.
translation:
  language: ru
  text: С того дня половина моих молодых людей[a] работала, а другая половина держала копья, щиты, луки и доспехи[b]. Начальники же находились позади всего дома Иуды[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моих слуг» или «моих помощников». Еврейское слово может обозначать как молодых людей, так и слуг или людей из свиты.'
    reason: lexical_alternative
  - marker: b
    text: То есть защитные доспехи для тела; возможно, кольчуги или панцири.
    reason: lexical_alternative
  - marker: c
    text: Положение начальников «позади» дома Иуды, вероятно, указывает на военную поддержку или надзор за работавшими иудеями.
    reason: cultural_note
lexical_decisions:
- source_word: נְעָרַי
  choice: моих молодых людей
  rationale: Слово נַעַר может обозначать юношу, слугу, помощника или человека из свиты. Перевод сохраняет основной возрастной оттенок, а контекст службы Неемии разъясняется в сноске.
- source_word: עֹשִׂים בַּמְּלָאכָה
  choice: работала
  rationale: В данном контексте речь идёт о непосредственном выполнении строительных работ; краткий русский глагол передаёт это естественно.
- source_word: מַחֲזִיקִים
  choice: держала
  rationale: Причастие породы хифиль от חזק здесь означает держать или иметь наготове перечисленное оружие и снаряжение; буквальное значение не заменено толкованием «была вооружена».
- source_word: הָרְמָחִים הַמָּגִנִּים וְהַקְּשָׁתוֹת
  choice: копья, щиты, луки
  rationale: Это общепринятые, точные и понятные современные названия перечисленных видов оружия.
- source_word: הַשִּׁרְיֹנִים
  choice: доспехи
  rationale: שִׁרְיוֹן обозначает защитный доспех для тела; общее слово «доспехи» не навязывает неоправданно узкого определения его конструкции.
- source_word: הַשָּׂרִים
  choice: начальники
  rationale: שַׂר может обозначать начальника, предводителя или должностное лицо. В военно-организационном контексте «начальники» звучит естественно и не приписывает им царского достоинства.
- source_word: אַחֲרֵי כָּל בֵּית יְהוּדָה
  choice: находились позади всего дома Иуды
  rationale: אַחֲרֵי передано пространственно как «позади», без добавленного в еврейском тексте глагола «стояли»; выражение «дом Иуды» сохранено как собирательное обозначение народа.
theological_decisions:
- issue: Характер положения начальников позади дома Иуды
  choice: Сохранено пространственное «находились позади»
  alternative: «поддерживали весь дом Иуды» или «стояли позади»
  rationale: Текст допускает военную поддержку или надзор, но прямо сообщает лишь положение «позади» и не содержит отдельного глагола «стоять»; толкование вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сделан ясным для обычного читателя; корпоративное выражение «дом Иуды» сохранено, а неоднозначные служебные и военные термины не конкретизированы сверх данных еврейского текста.
