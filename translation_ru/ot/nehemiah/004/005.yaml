  text: וַ/יֹּאמְר֣וּ צָרֵ֗י/נוּ לֹ֤א יֵדְעוּ֙ וְ/לֹ֣א יִרְא֔וּ עַ֛ד אֲשֶׁר נָב֥וֹא אֶל תּוֹכָ֖/ם וַ/הֲרַגְנ֑וּ/ם וְ/הִשְׁבַּ֖תְנוּ אֶת הַ/מְּלָאכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/005.yaml
  text: And our adversaries said[a], “They will not know, and they will not see, until we come into their midst and kill them and stop the work.”
translation:
  language: ru
  text: 'Наши враги сказали: «Они ничего не узнают и не увидят, пока мы не войдём в их среду[a], не перебьём их и не остановим работу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди них».'
    reason: 'Лексическая альтернатива для אֶל תּוֹכָם: основной текст передаёт направленность движения («в их среду»), тогда как альтернативный вариант выражает пребывание среди них.'
lexical_decisions:
- source_word: צָרֵינוּ
  choice: наши враги
  rationale: Слово צַר обозначает врага или враждебного противника; в контексте замышляемого нападения «враги» звучит естественно и точно.
- source_word: לֹא יֵדְעוּ וְלֹא יִרְאוּ
  choice: они ничего не узнают и не увидят
  rationale: Сохранена параллель глаголов «знать» и «видеть»; «ничего» естественно передаёт подразумеваемую полную неосведомлённость, не устраняя образность оригинала.
- source_word: עַד אֲשֶׁר
  choice: пока не
  rationale: 'Оборот обозначает временную границу: жертвы останутся в неведении вплоть до появления нападающих.'
- source_word: נָבוֹא אֶל תּוֹכָם
  choice: мы не войдём в самую их среду
  rationale: בוא с אֶל указывает на вхождение, а תּוֹךְ — на внутреннюю среду или середину группы; формулировка передаёт внезапное проникновение к ним.
- source_word: וַהֲרַגְנוּם
  choice: не перебьём их
  rationale: הרג прямо означает убить; «перебьём» естественно выражает намерение убить группу людей и сохраняет резкость угрозы.
- source_word: וְהִשְׁבַּתְנוּ אֶת הַמְּלָאכָה
  choice: не остановим работу
  rationale: Каузативная форма שׁבת означает заставить прекратиться; «остановим работу» ясно и современно передаёт смысл.
theological_decisions: []
