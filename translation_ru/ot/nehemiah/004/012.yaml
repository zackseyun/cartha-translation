lexical_decisions:
- source_word: וְהַבּוֹנִים ... וּבוֹנִים
  choice: Строители продолжали работать
  rationale: Первое причастие обозначает самих строителей, а второе — продолжающееся действие. По-русски повтор корня «строить» в этой конструкции звучал бы тяжеловесно, поэтому второе употребление передано глаголом «работать» без потери смысла.
- source_word: אִישׁ
  choice: у каждого
  rationale: Здесь слово употреблено дистрибутивно и относится к каждому из строителей.
- source_word: חַרְבּוֹ אֲסוּרִים עַל מָתְנָיו
  choice: у каждого к поясу был привязан меч
  rationale: Оборот описывает меч, закреплённый в области бёдер или талии. «К поясу» естественно передаёт способ ношения оружия и сохраняет образ постоянной готовности.
- source_word: וְהַתּוֹקֵעַ בַּשּׁוֹפָר
  choice: тот, кто трубил в рог[a]
  rationale: Причастная конструкция сохранена как обозначение человека, подававшего сигнал. שׁוֹפָר — сигнальный рог, обычно бараний; слово «рог» точнее передаёт вид инструмента, а примечание указывает традиционное название.
- source_word: אֶצְלִי
  choice: находился рядом со мной
  rationale: Предлог выражает непосредственную близость; такая формулировка естественна в современном русском повествовании.
