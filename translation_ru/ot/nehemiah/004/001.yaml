translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Редкие этнонимы заменены ясным описанием там, где это не меняет смысла; образность выражения об «исцелении» стен отмечена в сноске. Союзная структура слегка упрощена ради естественного русского синтаксиса.
