base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/001.yaml
  text: When Sanballat and Tobiah and the Arabs and the Ammonites and the Ashdodites heard that the repair of Jerusalem’s walls had gone up[a], that the breaches had begun to be closed[b], they became very angry.
translation:
  language: ru
  text: 'Когда Санаваллат, Товия, арабы, аммонитяне и жители Ашдода услышали, что восстановление стен Иерусалима продвинулось[a] и что проломы начали заделывать[b], они сильно разгневались.


    [a] Или: «восстановление стен Иерусалима продвинулось вперёд». Еврейское слово часто связано со значениями «исцеление» или «восстановление» и здесь образно обозначает ремонт стен.


    [b] Или: «проломы начали закрываться».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «восстановление стен Иерусалима продвинулось вперёд». Еврейское слово часто связано со значениями «исцеление» или «восстановление» и здесь образно обозначает ремонт стен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проломы начали закрываться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Когда
  rationale: Повествовательная формула вводит временное придаточное и новую сцену; современное русское «когда» передаёт её естественно, без тяжеловесного «и случилось, когда».
- source_word: שָׁמַע
  choice: услышали
  rationale: Прямое значение глагола уместно и для получения известия.
- source_word: סַנְבַלַּט וְטוֹבִיָּה
  choice: Санаваллат, Товия
  rationale: Использованы укоренившиеся русские формы библейских имён.
- source_word: הָעַרְבִים וְהָעַמֹּנִים וְהָאַשְׁדּוֹדִים
  choice: арабы, аммонитяне и жители Ашдода
  rationale: Первые два этнонима переданы привычными современными названиями; описательное «жители Ашдода» яснее современному читателю, чем редкое «ашдодяне» или традиционное «азотяне».
- source_word: עָלְתָה אֲרוּכָה
  choice: восстановление ... продвинулось
  rationale: אֲרוּכָה обозначает исцеление или восстановление и применено к ремонту стен образно; עָלְתָה указывает на продвижение работы. Формулировка сохраняет оба смысловых компонента без неестественного буквального выражения.
- source_word: לְחֹמוֹת יְרוּשָׁלִַם
  choice: стен Иерусалима
  rationale: Естественная русская конструкция, выражающая отношение восстановительных работ к городским стенам.
- source_word: הַפְּרֻצִים
  choice: проломы
  rationale: Точное и понятное обозначение разрушенных участков стены.
- source_word: לְהִסָּתֵם
  choice: начали заделывать
  rationale: Страдательная форма означает, что проломы стали закрываться или заделываться; неопределённо-личная русская конструкция естественна и не вводит названного в тексте деятеля.
- source_word: וַיִּחַר לָהֶם מְאֹד
  choice: они пришли в сильную ярость
  rationale: Идиома буквально говорит, что у них «сильно разгорелось»; выбранная формулировка передаёт интенсивный гнев и сохраняет выразительность.
