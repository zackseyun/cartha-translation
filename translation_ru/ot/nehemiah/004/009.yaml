source:
  edition: WLC
  text: וַ/יְהִ֞י כַּֽ/אֲשֶׁר שָׁמְע֤וּ אוֹיְבֵ֨י/נוּ֙ כִּי נ֣וֹדַֽע לָ֔/נוּ וַ/יָּ֥פֶר הָ/אֱלֹהִ֖ים אֶת עֲצָתָ֑/ם ו/נשוב כֻּלָּ֨/נוּ֙ אֶל הַ֣/חוֹמָ֔ה אִ֖ישׁ אֶל מְלַאכְתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/009.yaml
  text: And it happened that when our enemies heard that it had become known to us[a], and that God had frustrated their plan, we all returned to the wall[c][b], each man to his work.
translation:
  language: ru
  text: И когда наши враги услышали, что нам стало известно об их замысле[a] и что Бог расстроил их план[b], мы все вернулись к стене — каждый к своей работе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «что это стало известно нам»; также возможно: «что мы узнали об этом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сорвал их замысел»; еврейское слово может означать план, замысел или совет.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «каждый к своей работе» — распределительное выражение, относящееся к работникам по отдельности.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: И когда
  rationale: Оборот вводит следующее развитие повествования и временное обстоятельство. В современном русском «И когда» естественно передаёт связь событий без архаичного «и было».
- source_word: אוֹיְבֵינוּ
  choice: наши враги
  rationale: Прямое и контекстуально точное соответствие существительному с суффиксом первого лица множественного числа.
- source_word: כִּי נוֹדַע לָנוּ
  choice: что нам стало известно об их замысле
  rationale: Нифаль глагола ידע буквально выражает пассивное «стало известно нам». Дополнение «об их замысле» в русском восполняет подразумеваемый объект из контекста, не меняя смысла.
- source_word: וַיָּפֶר
  choice: расстроил
  rationale: Глагол הפר с объектом «план/совет» означает сорвать, расстроить или сделать недействительным. «Расстроил план» — естественное современное русское сочетание.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: В контексте определённая форма указывает на Бога Израиля; в русском употребляется имя «Бог» без артикля.
- source_word: עֲצָתָם
  choice: их план
  rationale: עֵצָה здесь обозначает замысел или план противников. «План» ясно передаёт значение, не усиливая отрицательной окраски.
- source_word: וְנָשׁוּב כֻּלָּנוּ
  choice: мы все вернулись
  rationale: שוב означает возвращение, а כֻּלָּנוּ подчёркивает участие всех.
- source_word: אֶל הַחוֹמָה
  choice: к стене
  rationale: Речь идёт о стене Иерусалима, которую восстанавливали; предлог «к» соответствует направлению возвращения к месту работы.
- source_word: אִישׁ אֶל מְלַאכְתּוֹ
  choice: каждый к своей работе
  rationale: אִישׁ употреблено распределительно. Русское «каждый» точно и естественно выражает индивидуальное возвращение работников к назначенному труду, не требуя тяжеловесного «каждый мужчина».
theological_decisions:
- issue: Прямое действие Бога
  choice: Бог расстроил их план
  alternative: Обстоятельства помешали осуществлению их плана
  rationale: Еврейский текст прямо приписывает срыв плана Богу; перевод сохраняет это богословское утверждение и не заменяет его безличным описанием.
- issue: Распределительное употребление אִישׁ
  choice: каждый к своей работе
  alternative: каждый мужчина к своей работе
  rationale: В данном обороте אִישׁ служит распределительным местоименным выражением. «Каждый» сохраняет смысл без неестественного для русского уточнения пола.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Синтаксис слегка упрощён по сравнению с буквальным «и было, когда», но последовательность событий сохранена. Местоименная отсылка в первом придаточном прояснена словами «об их замысле», а буквальная форма отражена в сноске.
