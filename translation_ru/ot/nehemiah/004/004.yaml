lexical_decisions:
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Сохранено собственное имя в единственном числе; в данном контексте оно, вероятно, обозначает всю общину Иудеи, что поясняется в сноске.
- source_word: כָּשַׁל כֹּחַ
  choice: силы иссякли
  rationale: Еврейский оборот буквально описывает силу как споткнувшуюся или ослабевшую; «силы иссякли» естественно передаёт полное изнеможение работников.
- source_word: הַסַּבָּל
  choice: носильщиков
  rationale: Существительное обозначает людей, переносящих тяжести. Русское множественное число ясно передаёт собирательное значение еврейской формы единственного числа.
- source_word: הֶעָפָר
  choice: обломков
  rationale: Основное значение слова — «пыль, земля», но среди развалин стены оно обозначает строительный мусор и обломки; контекстуальное значение отмечено в сноске.
- source_word: הַרְבֵּה
  choice: так много
  rationale: Передаёт изобилие и естественно связывает количество обломков с последующей невозможностью продолжать строительство.
- source_word: לֹא נוּכַל
  choice: мы не можем
  rationale: Форма выражает неспособность, а не нежелание.
- source_word: לִבְנוֹת בַּחוֹמָה
  choice: строить стену
  rationale: В данном контексте предлог ב входит в конструкцию со значением работы над стеной. «Строить стену» звучит по-русски естественно и не добавляет прямо не выраженного значения «восстанавливать».
