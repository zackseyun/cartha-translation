    text: 'Буквально: «муж от брата своего» — еврейский оборот со значением «друг от друга».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: знатным
  rationale: В книге Неемии слово обозначает представителей общественной знати и влиятельных людей; «знатные» естественно передаёт этот социальный статус.
- source_word: הַסְּגָנִים
  choice: начальникам
  rationale: Слово обозначает должностных лиц и подчинённых правителей; «начальники» ясно передаёт руководящую роль без чрезмерного уточнения ранга.
- source_word: יֶתֶר הָעָם
  choice: остальному народу
  rationale: Прямой и естественный перевод, охватывающий всех, кроме уже названных руководителей.
- source_word: הַמְּלָאכָה הַרְבֵּה וּרְחָבָה
  choice: работа велика и обширна
  rationale: «Работа» относится к восстановлению стены; парные определения сохраняют величину и пространственную протяжённость предприятия. «Обширна» передаёт буквальное значение «широка» естественным русским языком.
- source_word: נִפְרָדִים
  choice: рассеяны
  rationale: Причастие описывает людей, размещённых отдельно друг от друга; «рассеяны» естественно выражает пространственную разобщённость, не предполагая вражды.
- source_word: עַל הַחוֹמָה
  choice: по стене
  rationale: Предлог עַל буквально указывает на положение на стене, а русское «по стене» в данном контексте также выражает распределение вдоль её протяжённости.
- source_word: רְחוֹקִים אִישׁ מֵאָחִיו
  choice: далеко друг от друга
  rationale: Естественно передаёт взаимную удалённость; буквальное «каждый от своего брата» является еврейским взаимным оборотом.
