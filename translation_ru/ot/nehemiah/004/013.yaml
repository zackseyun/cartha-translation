revisions:
- from: 'И сказал я знатным, начальникам и остальному народу: «Работа велика и обширна, а мы рассеяны по стене далеко друг от друга[a]».'
  to: 'И сказал я знатным, начальникам и остальному народу: «Работа велика и обширна, а мы на стене находимся далеко друг от друга[a]».'
  rationale: Заменено «рассеяны по стене» на нейтральное описание пространственной разобщённости, чтобы не усиливать смысл исходного текста. Сохранены величина и протяжённость работы, адресаты и взаимный характер заключительного идиоматического выражения. Сноска уточнена в соответствии с еврейской лексической формой.
