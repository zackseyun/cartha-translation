base_translation:
  language: en
  yaml_path: translation/ot/nehemiah/004/017.yaml
  text: And neither I[a], nor my brothers, nor my young men, nor the men of the guard who were behind me, took off our clothes; each kept his weapon in his right hand, even for water.
translation:
  language: ru
  text: Ни я, ни мои братья, ни мои юноши, ни стражники, следовавшие за мной, не снимали одежду; каждый был с оружием — даже у воды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная еврейская фраза трудна для понимания; буквально: «каждый — его оружие — вода». Возможны смыслы: «каждый держал оружие под рукой, даже ради воды» или «каждый ходил за водой со своим оружием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין ... אֵין
  choice: ни ... не снимали
  rationale: Отрицательная частица с причастием выражает продолжавшееся отрицательное действие; русская конструкция «ни … не» естественно объединяет перечисленные подлежащие.
- source_word: אַחַי
  choice: мои братья
  rationale: Сохранено прямое значение родственного термина, хотя в контексте он может охватывать также близких соратников.
- source_word: נְעָרַי
  choice: мои юноши
  rationale: נַעַר может означать юношу, слугу или помощника. «Юноши» сохраняет основное лексическое значение, не уточняя без достаточных оснований их служебное положение.
- source_word: אַנְשֵׁי הַמִּשְׁמָר
  choice: стражники
  rationale: Краткое и естественное русское обозначение людей, несущих охрану или караул.
- source_word: אֲשֶׁר אַחֲרַי
  choice: следовавшие за мной
  rationale: Передаёт возможный смысл людей, находившихся позади Неемии или сопровождавших его, без неестественной буквальности.
- source_word: פֹשְׁטִים בְּגָדֵינוּ
  choice: не снимали одежды
  rationale: פשט в сочетании с обозначением одежды значит «снимать»; форма с причастием указывает на устойчивую практику в описываемый период.
- source_word: אִישׁ
  choice: каждый
  rationale: Здесь אִישׁ употреблено дистрибутивно и естественно передаётся словом «каждый».
- source_word: שִׁלְחוֹ
  choice: при оружии
  rationale: שֶׁלַח обозначает оружие, возможно метательное или копьё. Обобщённое «оружие» не навязывает конкретный вид, а «при оружии» передаёт его постоянную готовность.
- source_word: הַמָּיִם
  choice: даже когда шёл за водой
  rationale: Краткая и трудная фраза, вероятно, относится к походу за водой; перевод выражает наиболее вероятный практический смысл, а неоднозначность отмечена в сноске.
