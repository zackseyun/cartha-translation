  yaml_path: translation/ot/nehemiah/004/006.yaml
  text: And when the Jews who lived near them came and told us ten times[a], “From all the places where you turn[b], they will come up against us,”
translation:
  language: ru
  text: 'Когда иудеи, жившие рядом с ними, пришли и десять раз сказали нам: «В какую бы сторону вы ни повернули[a], они нападут на нас[b]»,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «куда бы вы ни возвращались». Еврейский глагол обычно означает «возвращаться» или «поворачивать назад»; точный смысл всей фразы в оригинале неясен.'
    reason: lexical_alternative
  - marker: b
    text: Буквально в еврейском тексте здесь только «на нас». Упоминание нападающих и глагол «нападут» восполнены по контексту; вероятный смысл предупреждения — враги могут подойти с любой стороны.
    reason: clarity
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: В повествовательном контексте сочетание вводит новое событие с временным значением; простое «когда» естественно передаёт его по-русски.
- source_word: בָּאוּ
  choice: пришли
  rationale: Обычное значение глагола движения, уместное для прибытия иудеев с сообщением.
- source_word: הַיְּהוּדִים
  choice: иудеи
  rationale: В книге Неемии слово обозначает представителей иудейского народа или общины; «иудеи» — принятое и ясное русское соответствие.
- source_word: הַיֹּשְׁבִים אֶצְלָם
  choice: жившие рядом с ними
  rationale: אֵצֶל указывает на близость места жительства; «рядом с ними» сохраняет отсылку к враждебным соседям и не создаёт впечатления совместного проживания.
- source_word: וַיֹּאמְרוּ לָנוּ
  choice: сказали нам
  rationale: Прямое и естественное соответствие; повторяемость сообщения уже выражена словами «раз десять».
- source_word: עֶשֶׂר פְּעָמִים
  choice: раз десять
  rationale: Сохранено явное числительное оригинала, которое подчёркивает многократность предупреждения.
- source_word: מִכָּל הַמְּקֹמוֹת
  choice: откуда бы ни
  rationale: Дистрибутивный смысл «из всех мест» передан естественной русской конструкцией, обозначающей любое направление.
- source_word: אֲשֶׁר תָּשׁוּבוּ
  choice: вы ни повернули
  rationale: שׁוב обычно значит «возвращаться, поворачивать назад», но здесь точный синтаксический смысл спорен; контекст допускает предупреждение об опасности с любого направления.
- source_word: עָלֵינוּ
  choice: на нас
  rationale: Предлог עַל в данном враждебном контексте указывает на действие, направленное против говорящих; по-русски это естественно выражается в сочетании «нападут на нас».
