translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Необычная и спорная еврейская конструкция передана связно, но её неоднозначность сохранена в примечаниях. Конечная запятая оставлена, поскольку стих синтаксически продолжается в предоставленном английском слое; при отдельной публикации стиха её следует заменить точкой.
