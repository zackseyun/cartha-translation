  text: So we prayed to our God and stationed a guard against them day and night because of them[a][b].
translation:
  language: ru
  text: И мы помолились нашему Богу и поставили против них стражу днём и ночью из-за них[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выставили против них караул».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от их лица»; здесь, вероятно, в значении «из-за них» или «по причине их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּתְפַּלֵּל
  choice: мы помолились
  rationale: Hitpael глагола פלל обычно означает «молиться». Совершенный вид естественно передаёт завершённое действие в повествовательной последовательности, не добавляя отсутствующей в тексте усилительности.
- source_word: אֶל אֱלֹהֵינוּ
  choice: нашему Богу
  rationale: Русское управление глагола «молиться» требует дательного падежа без отдельного соответствия предлогу אֶל; суффикс 1-го лица множественного числа сохранён словом «нашему».
- source_word: וַנַּעֲמִיד
  choice: поставили
  rationale: Hiphil глагола עמד здесь означает «поставить, расположить». В сочетании со словом «стража» это естественное русское обозначение назначения людей для охраны.
- source_word: מִשְׁמָר
  choice: стражу
  rationale: Существительное может обозначать охрану, караул или несение дозора. «Стража» кратко и естественно передаёт здесь коллективную охрану.
- source_word: עֲלֵיהֶם
  choice: против них
  rationale: В контексте враждебной угрозы עַל указывает на направленность охраны против противников; буквальное «над ними» по-русски исказило бы смысл.
- source_word: יוֹמָם וָלַיְלָה
  choice: днём и ночью
  rationale: Это обычное сочетание, обозначающее непрерывную бдительность; предложенный перевод естественен для современного русского языка.
- source_word: מִפְּנֵיהֶם
  choice: из-за них
  rationale: Буквально выражение связано с нахождением «перед ними» или «от их лица», но здесь имеет причинный оттенок. «Из-за них» сохраняет этот смысл, не уточняя мотив как страх.
theological_decisions:
- issue: Ответ на враждебное противодействие
  choice: Молитва Богу и практическая охрана представлены как два согласованных действия, без предпочтения одного другому.
  alternative: Подчеркнуть только молитву либо только оборонительные меры.
  rationale: 'Еврейский текст соединяет два действия одинаковой повествовательной конструкцией: народ молится и ставит стражу. Перевод сохраняет эту богословско-практическую напряжённость, не сводя ответ ни к одной стороне.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Стража» сохраняет достоинство стиля, оставаясь понятной; синтаксис близок к координации исходного текста. Все примечания отмечены в основном тексте.
