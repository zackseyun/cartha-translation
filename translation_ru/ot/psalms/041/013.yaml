base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/013.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Amen and Amen.
translation:
  language: ru
  text: Благословен Яхве, Бог Израиля, от века и до века[a]! Аминь и аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от вечности до вечности». Еврейское выражение обозначает безграничную длительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Пассивное причастие в формуле славословия естественно передаётся кратким прилагательным «благословен», сохраняя торжественный литургический характер.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача еврейского сопряжённого сочетания.
- source_word: מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: от века и до века
  rationale: Устойчивая возвышенная русская формула передаёт безграничную длительность и сохраняет повтор ключевого слова עוֹלָם.
- source_word: אָמֵן וְאָמֵן
  choice: Аминь и аминь
  rationale: Сохранены традиционная транслитерация и эмфатическое повторение заключительного литургического подтверждения.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Временной охват выражения מֵהָעוֹלָם וְעַד הָעוֹלָם
  choice: от века и до века
  alternative: от вечности до вечности; во веки веков
  rationale: Выбранная формула сохраняет образ исходного выражения и утверждает безграничную длительность, не уточняя философское понимание вечности сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным литургическим звучанием. Восклицательный знак отражает характер заключительного славословия; повтор «аминь» сохранён.
