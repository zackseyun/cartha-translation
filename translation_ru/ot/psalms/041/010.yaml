  text: וְ/אַתָּ֤ה יְהוָ֗ה חָנֵּ֥/נִי וַ/הֲקִימֵ֑/נִי וַֽ/אֲשַׁלְּמָ֥ה לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/010.yaml
  text: But you[a], O Yahweh, be gracious to me and raise me up, that I may repay them.
translation:
  language: ru
  text: Но Ты, Яхве, будь милостив ко мне и подними меня, чтобы я воздал им.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и я воздам им». Еврейскую форму можно понимать либо как указание на цель или результат («чтобы я воздал им»), либо как решение, следующее за просьбами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Но Ты
  rationale: Союз с самостоятельным местоимением подчёркивает противопоставление упомянутым ранее врагам и близкому человеку; в современном русском это естественно передаётся как «Но Ты».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: חָנֵּנִי
  choice: будь милостив ко мне
  rationale: Глагол חנן выражает просьбу о благосклонности и милости; выбранная формулировка сохраняет этот смысл, не сводя его лишь к состраданию.
- source_word: וַהֲקִימֵנִי
  choice: и подними меня
  rationale: Каузативная форма глагола קום буквально означает «дай мне подняться, поставь на ноги». «Подними меня» сохраняет конкретный образ и допускает смысл восстановления в контексте болезни.
- source_word: וַאֲשַׁלְּמָה
  choice: чтобы я воздал
  rationale: Пиэль глагола שלם здесь означает воздать или отплатить. Когортатив после просьб допускает целевое прочтение «чтобы я воздал», при этом возможное значение последующего решения отмечено в сноске.
- source_word: לָהֶם
  choice: им
  rationale: Предлог ל обозначает адресата воздаяния; русское «воздать им» точно и естественно передаёт конструкцию.
theological_decisions:
- issue: Следует ли смягчать просьбу псалмопевца о воздаянии противникам
  choice: сохранить «воздал им»
  alternative: «защити меня от них» или «поступи с ними по заслугам»
  rationale: Глагол שלם прямо выражает воздаяние или отплату. Смягчение устранило бы судебно-проклятийное напряжение текста и внесло бы дополнительное толкование; способ воздаяния стих не уточняет.
- issue: Как понимать когортатив וַאֲשַׁלְּמָה после двух просьб
  choice: 'как цель или результат: «чтобы я воздал»'
  alternative: 'как самостоятельное решение: «и я воздам»'
  rationale: Обе синтаксические трактовки возможны. Основной текст выбирает естественную целевую связь с предшествующими просьбами, а подлинная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизации. Заглавное «Ты» употреблено как уважительное обращение к Богу. Конкретный образ «подними меня» сохранён вместо более толковательного «восстанови меня».
