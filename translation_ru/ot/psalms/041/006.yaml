  yaml_path: translation/ot/psalms/041/006.yaml
  text: And if he comes to see me[a], he speaks falsehood; his heart gathers wickedness to itself; when he goes out to the street[c][b], he speaks it.
translation:
  language: ru
  text: И если он приходит повидать меня[a], то говорит ложь[b]; сердце его копит зло в себе; выйдет наружу — говорит[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приходит увидеть»; местоимение «меня» подразумевается по контексту.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «говорит пустое» либо «говорит обман». Еврейское слово может обозначать ложь, обманчивость и пустоту.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «выйдет наружу — говорит». Объект последнего глагола в еврейском тексте не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: И если
  rationale: Сохраняет и соединительный союз, и условное значение еврейского выражения.
- source_word: בָּא לִרְאוֹת
  choice: приходит повидать меня
  rationale: Глаголы буквально означают «приходит увидеть»; местоимение «меня» восполнено из контекста, а «повидать» естественно передаёт посещение больного без утверждения о доброжелательности посетителя.
- source_word: שָׁוְא יְדַבֵּר
  choice: говорит ложь
  rationale: שָׁוְא может обозначать ложь, пустоту или обман; в контексте притворной речи враждебного посетителя «ложь» передаёт основной смысл, не исключая оттенка пустых, неискренних слов.
- source_word: לִבּוֹ יִקְבָּץ אָוֶן לוֹ
  choice: сердце его копит в себе зло
  rationale: Сохраняется библейский образ сердца как внутреннего средоточия мыслей и намерений. אָוֶן здесь естественно понимать как злое, пагубное содержание, а לוֹ — как указание на накопление внутри себя.
- source_word: יֵצֵא לַחוּץ
  choice: выйдя наружу
  rationale: Передаёт буквальное «выйдет наружу», не конкретизируя место как улицу, поскольку такой конкретизации в еврейском тексте нет.
- source_word: יְדַבֵּר
  choice: разглашает его
  rationale: Заключительный глагол буквально повторяет «говорит». По-русски «разглашает» естественно выражает подразумеваемое распространение вовне того зла, которое было накоплено в сердце; местоимение «его» отсылает к «злу».
theological_decisions:
- issue: Характер накопленного в сердце אָוֶן
  choice: зло
  alternative: беда / пагуба / беззаконие
  rationale: Слово допускает значения бедствия, пагубы и нравственного зла. В данном контексте враждебных намерений выбрано широкое «зло», без уточнения конкретного греха или замысла.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатой поэтической структуры и образа сердца. «Повидать» звучит естественно для посещения больного, но не приписывает посетителю сочувствия. Концовка передана идиоматично, чтобы обозначить распространение вовне накопленного злого содержания.
