lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов форма с предлогом לְ, вероятно, указывает на лицо, руководящее музыкальным исполнением. Этот вариант ясен современному читателю и сохраняет функцию исполнительского указания.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Обычное жанровое обозначение поэтического произведения, предназначенного для музыкального исполнения; «псалом» — точный и традиционный русский эквивалент в данном контексте.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русская родительная конструкция естественна для надписания и, подобно еврейскому обороту, не требует однозначно понимать связь с Давидом только как авторство.
theological_decisions:
- issue: Значение указания לְדָוִד в надписании
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида; псалом, связанный с Давидом
  rationale: Еврейский предлог לְ допускает авторство, принадлежность, связь или посвящение. Основной текст сохраняет традиционную и достаточно широкую формулировку, а примечание явно обозначает неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткое надписание передано естественно и достойно, без архаизма «начальнику хора». Маркер примечания поставлен непосредственно после слов, к которым оно относится.
