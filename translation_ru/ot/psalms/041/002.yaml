  text: יְהוָ֤ה יִשְׁמְרֵ֣/הוּ וִֽ֭/יחַיֵּ/הוּ יאשר בָּ/אָ֑רֶץ וְ/אַֽל תִּ֝תְּנֵ֗/הוּ בְּ/נֶ֣פֶשׁ אֹיְבָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/002.yaml
  text: Yahweh will keep him and preserve his life[a]; he will be blessed in the land[d][c][b], and may you not give him over to the desire of his enemies.
translation:
  language: ru
  text: Яхве сохранит его и оставит в живых[a]; его будут называть блаженным[b] на земле[c]. Не предай же его на волю врагов[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сохранит ему жизнь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «он будет блажен» или «он будет счастлив».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в стране»; еврейское слово может означать землю, страну или край.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «желанию (или воле) его врагов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: יִשְׁמְרֵהוּ
  choice: сохранит его
  rationale: Глагол שׁמר означает хранить, оберегать, сохранять; «сохранит» естественно сочетается со следующим указанием на поддержание жизни.
- source_word: וִיחַיֵּהוּ
  choice: и поддержит в нём жизнь
  rationale: Порода piel глагола חיה здесь имеет каузативное значение «оставить в живых, поддержать жизнь»; формулировка избегает тяжёлого повтора и сохраняет смысл продолжения жизни.
- source_word: יאשר
  choice: его будут называть блаженным
  rationale: Форма допускает значение «быть признанным или названным блаженным»; безличная конструкция естественна по-русски и сохраняет оттенок публичного признания.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: אֶרֶץ может обозначать землю, страну или край. «На земле» сохраняет широту еврейского выражения, не сужая его до конкретной страны.
- source_word: וְאַל תִּתְּנֵהוּ
  choice: Не предай же его
  rationale: Отрицательная форма с глаголом во втором лице выражает молитвенную просьбу, обращённую непосредственно к Яхве. Русский молитвенный императив передаёт этот переход от повествования к обращению.
- source_word: בְּנֶפֶשׁ אֹיְבָיו
  choice: на волю врагов
  rationale: נֶפֶשׁ в данном обороте означает желание или волю. Русское выражение «предать на волю врагов» идиоматично и передаёт попадание человека во власть их враждебных намерений.
theological_decisions:
- issue: Переход от утверждения о Яхве в третьем лице к молитвенному обращению во втором лице
  choice: 'Первые две части переданы как уверенное утверждение, а последняя — как прямая просьба: «Не предай же его…»'
  alternative: 'Передать весь стих в третьем лице: «и Он не предаст его…»'
  rationale: תִּתְּנֵהוּ имеет форму второго лица мужского рода единственного числа. Смена лица присутствует в еврейском тексте и не должна сглаживаться.
- issue: Значение יאשר
  choice: «его будут называть блаженным»
  alternative: «он будет благословен» или «он будет счастлив»
  rationale: Выбранный вариант сохраняет возможный декларативный оттенок — другие признают и называют этого человека блаженным, — не сводя выражение только к внутреннему состоянию или к прямому акту благословения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Яхве» сохраняет личное Божье имя; «блаженным» поддерживает традиционную библейскую лексику, оставаясь понятным в контексте. Резкий переход к прямой молитве намеренно сохранён отдельным предложением.
