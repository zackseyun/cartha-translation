  text: וַ/אֲנִ֗י בְּ֭/תֻמִּ/י תָּמַ֣כְתָּ בִּ֑/י וַ/תַּצִּיבֵ֖/נִי לְ/פָנֶ֣י/ךָ לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/012.yaml
  text: But as for me[a], in my integrity you have upheld me[b], and you have set me before your face forever.
translation:
  language: ru
  text: А меня Ты поддержал в моей непорочности[a] и поставил перед Своим лицом[b] навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный смысл: «за мою непорочность»; слово также может обозначать честность или нравственную цельность.'
    reason: lexical_alternative
  - marker: b
    text: То есть «в Своём присутствии».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А меня
  rationale: Союз с самостоятельным местоимением обозначает контраст с предшествующим контекстом. Русская конструкция «А меня» естественно связывается с последующим глаголом «поддержал» и сохраняет этот контраст.
- source_word: בְּתֻמִּי
  choice: в моей непорочности
  rationale: Слово תֹּם/תֻּם указывает на цельность, честность и нравственную безупречность. «Непорочность» сохраняет нравственный смысл и предлог ב, не превращая выражение в прямое утверждение абсолютной безгрешности.
- source_word: תָּמַכְתָּ בִּי
  choice: Ты поддержал
  rationale: Глагол תמך с ב передаёт поддержку, удержание и укрепление человека. «Поддержал» точно и естественно выражает этот смысл по-русски.
- source_word: וַתַּצִּיבֵנִי
  choice: и поставил
  rationale: Каузативная форма глагола נצב означает «поставить», «поместить» или «утвердить». «Поставил» наиболее прямо передаёт образ исходного текста, не добавляя толкования.
- source_word: לְפָנֶיךָ
  choice: перед Своим лицом
  rationale: Буквальное выражение сохраняет конкретный древнееврейский образ; по смыслу оно означает пребывание в Божьем присутствии.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Здесь עוֹלָם обозначает неограниченную, непреходящую длительность. «Навеки» естественно для современного литературного русского языка и соответствует поэтическому регистру псалма.
theological_decisions:
- issue: Смысл заявления псалмопевца о תֻּם
  choice: Речь идёт о нравственной цельности и непорочности псалмопевца, без явного утверждения абсолютной безгрешности или заслуженности Божьей милости.
  alternative: Понимать слова как утверждение абсолютной невиновности либо как учение о том, что Божье благоволение приобретается нравственным совершенством.
  rationale: Исходное слово действительно содержит положительную нравственную оценку, и её нельзя устранять, однако оно само по себе не требует идеи безгрешного совершенства. Перевод сохраняет это богословское напряжение, не разрешая его посредством добавленного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Прописные буквы в местоимениях, относящихся к Богу, поддерживают традиционный русский библейский регистр; буквальный образ «перед Своим лицом» сохранён и пояснён в сноске.
