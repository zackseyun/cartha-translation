  source_fidelity: 'Текст точно передаёт основные элементы еврейского стиха: контрастное «А меня», בְּתֻמִּי как пребывание в личной нравственной цельности, תמך как поддержку, נצב в каузативе как «поставил» и לְפָנֶיךָ как буквальное «перед Своим лицом». «Навеки» адекватно передаёт לְעוֹלָם.'
