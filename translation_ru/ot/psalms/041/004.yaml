  text: אֲֽנִי אָ֭מַרְתִּי יְהוָ֣ה חָנֵּ֑/נִי רְפָאָ֥/ה נַ֝פְשִׁ֗/י כִּי חָטָ֥אתִי לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/004.yaml
  text: As for me[a], I said, “O Yahweh, be gracious to me; heal my soul, for I have sinned against you.”
translation:
  language: ru
  text: 'Я же сказал: «Яхве, будь милостив ко мне; исцели душу мою[a], потому что я согрешил против Тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исцели мою жизнь» или «исцели меня». Еврейское слово нэфеш, переведённое здесь как «душа», может также означать жизнь или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: Я же
  rationale: Самостоятельное местоимение имеет лёгкое смысловое ударение; частица «же» естественно передаёт это выделение в русском контексте.
- source_word: אָמַרְתִּי
  choice: сказал
  rationale: Форма qal perfect 1-го лица единственного числа здесь сообщает о произнесённой молитве и естественно передаётся прошедшим временем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: חָנֵּנִי
  choice: будь милостив ко мне
  rationale: Императив от חנן выражает просьбу о благосклонности и милости, не сводя её только к состраданию.
- source_word: רְפָאָה
  choice: исцели
  rationale: Сохраняется прямое значение глагола «исцелять» без уточнения, идёт ли речь о телесном, внутреннем или целостном восстановлении.
- source_word: נַפְשִׁי
  choice: душу мою
  rationale: Формально сохраняет образ исходного текста и его молитвенное звучание; примечание указывает на более широкий диапазон значения נֶפֶשׁ — жизнь, личность, сам человек.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание просьбы и ясно передаёт причинную связь современным русским языком.
- source_word: חָטָאתִי
  choice: я согрешил
  rationale: Перфект выражает совершённый грех, который исповедующий признаёт основанием своей нынешней просьбы.
- source_word: לָךְ
  choice: против Тебя
  rationale: При глаголе חטא предлог обозначает того, против кого совершён грех; русское «согрешить против» ясно передаёт личный и relational характер проступка.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В стихе стоит собственное имя יהוה; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Объём значения выражения רְפָאָה נַפְשִׁי
  choice: исцели душу мою
  alternative: исцели меня; исцели мою жизнь
  rationale: Еврейское נֶפֶשׁ может обозначать душу, жизнь, личность или самого человека. Основной текст сохраняет образ и неоднозначность оригинала, а примечание предотвращает исключительно узкое, бестелесное понимание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Инверсия «душу мою» сохраняет достоинство поэтической речи, оставаясь понятной; причинная связь передана ясным оборотом «потому что».
