  text: בְּ/זֹ֣את יָ֭דַעְתִּי כִּֽי חָפַ֣צְתָּ בִּ֑/י כִּ֤י לֹֽא יָרִ֖יעַ אֹיְבִ֣/י עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/011.yaml
  text: 'By this I know that you delight in me: because my enemy does not triumph over me[a][b].'
translation:
  language: ru
  text: Из этого я знаю, что Ты благоволишь ко мне[a], потому что враг мой не торжествует надо мной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты находишь во мне радость»; или: «я угоден Тебе». Еврейский глагол означает находить удовольствие или радость в ком-либо.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «не поднимает победного крика надо мной». Еврейский глагол обозначает громкий возглас, здесь, вероятно, крик победы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: Из этого
  rationale: Предлог בְּ с указательным местоимением вводит признак или основание знания; «из этого» естественно передаёт доказательный смысл.
- source_word: יָדַעְתִּי
  choice: я знаю
  rationale: Перфект в данном контексте обозначает имеющееся теперь знание, основанное на наблюдаемом свидетельстве.
- source_word: כִּי
  choice: что
  rationale: Первое כִּי вводит содержание знания.
- source_word: חָפַצְתָּ בִּי
  choice: Ты благоволишь ко мне
  rationale: Передаёт расположение и удовольствие, выраженные חפץ, не добавляя утверждения о причинах Божьего благоволения.
- source_word: כִּי
  choice: потому что
  rationale: Второе כִּי вводит основание, по которому псалмопевец судит о Божьем благоволении.
- source_word: לֹא יָרִיעַ
  choice: не торжествует
  rationale: В контексте речь идёт о победном возгласе врага; «не торжествует» звучит естественно и передаёт смысл, а буквальный звуковой образ отмечен в сноске.
- source_word: אֹיְבִי
  choice: враг мой
  rationale: Сохранены единственное число и притяжательный суффикс еврейского текста; постпозиция местоимения соответствует достоинству поэтической речи.
- source_word: עָלַי
  choice: надо мной
  rationale: В сочетании с торжеством врага עַל выражает злорадное превозношение по поводу поражения псалмопевца.
theological_decisions:
- issue: Означает ли стих Божье одобрение, явленное через избавление от врага
  choice: Неспособность врага торжествовать представлена как свидетельство Божьего благоволения к псалмопевцу.
  alternative: Можно было бы усилить формулировку до утверждения о полном оправдании или праведности псалмопевца перед Богом.
  rationale: Еврейский текст связывает Божье благоволение с тем, что враг не может издать победный крик, но не объясняет основания этого благоволения; перевод не развивает связь в отдельное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Обращение к Богу оформлено с прописной буквы. Синтаксическая связь двух כִּי сохранена как «что… потому что…», а более буквальный образ победного крика вынесен в сноску ради естественности основного текста.
