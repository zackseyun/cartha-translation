lexical_decisions:
- source_word: אוֹיְבַי
  choice: Враги мои
  rationale: Существительное во множественном числе с суффиксом первого лица единственного числа прямо означает «мои враги»; такой порядок слов естественен для возвышенной поэтической речи.
- source_word: יֹאמְרוּ
  choice: говорят
  rationale: Имперфект в данном поэтическом контексте выражает настоящее или повторяющееся действие; настоящее время по-русски передаёт это естественно.
- source_word: רַע לִי
  choice: обо мне злое
  rationale: Формулировка сохраняет существительное «злое» и направленность враждебной речи против псалмопевца, не сужая смысл до клеветы или пожелания вреда.
- source_word: מָתַי יָמוּת
  choice: Когда он умрёт
  rationale: Вопросительное наречие מָתַי и имперфект глагола מות естественно передаются вопросом о будущем; враждебное желание подразумевается контекстом, но не превращается в прямое пожелание.
- source_word: וְאָבַד שְׁמוֹ
  choice: и имя его исчезнет
  rationale: Сохранено буквальное «имя», которое может обозначать также память или известность человека; «исчезнет» естественно передаёт אבד в согласованном будущем времени.
theological_decisions:
- issue: Смысл исчезновения имени
  choice: Сохранить в основном тексте буквальное «имя его исчезнет».
  alternative: «и память о нём исчезнет»
  rationale: Еврейское שֵׁם буквально означает «имя», хотя здесь может включать репутацию и память; буквальная формулировка сохраняет смысловую ёмкость и не устраняет неоднозначность.
translation_notes:
