  text: אַ֭שְׁרֵי מַשְׂכִּ֣יל אֶל דָּ֑ל בְּ/י֥וֹם רָ֝עָ֗ה יְֽמַלְּטֵ֥/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/001.yaml
  text: Blessed is the one who considers the poor[c][b][a]; in the day of trouble Yahweh will deliver him.
translation:
  language: ru
  text: Блажен тот, кто с пониманием относится к бедному[a][b]; в день бедствия[c] Яхве избавит его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступает мудро по отношению к бедному». Еврейский глагол может означать вдумчивое, разумное внимание, проявляемое к нему.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «слабому» или «нуждающемуся».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в день зла»; здесь под «злом» подразумевается бедствие или несчастье, а не нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен тот
  rationale: Идиоматическая формула блаженства в еврейской поэзии; «блажен» сохраняет весомый мудростный и богословский тон, не сводя смысл к субъективному ощущению счастья.
- source_word: מַשְׂכִּיל אֶל
  choice: с пониманием относится к
  rationale: Форма глагола שׂכל указывает на разумное, вдумчивое отношение, направленное к уязвимому человеку. Такая передача естественна по-русски и не ограничивает смысл ни одним лишь размышлением, ни конкретным благотворительным действием.
- source_word: דָּל
  choice: бедному
  rationale: Слово может обозначать бедного, слабого или нуждающегося человека. «Бедному» — прямой и понятный эквивалент, а более широкий диапазон отмечен в сноске.
- source_word: בְּיוֹם רָעָה
  choice: в день бедствия
  rationale: רָעָה здесь обозначает несчастье или тяжёлые обстоятельства, а не нравственное зло. «В день бедствия» сохраняет образный строй исходного текста.
- source_word: יְמַלְּטֵהוּ
  choice: избавит его
  rationale: Глагол выражает спасение от опасности или беды. «Избавит» соответствует возвышенному, но современному регистру псалма.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
theological_decisions:
- issue: Единственное число и мужской род в обетовании
  choice: 'Сохранить представительное единственное число: «тот… его»'
  alternative: 'Передать во множественном числе: «те… их»'
  rationale: Еврейский текст описывает одного типичного человека и затем использует суффикс мужского рода единственного числа. Русская формулировка сохраняет эту структуру, не утверждая, что обетование относится исключительно к мужчинам.
- issue: Характер обещания избавления
  choice: Передать утверждение прямо, без поясняющего ограничения
  alternative: Добавить, что это лишь общее правило, либо истолковать как безусловную гарантию отсутствия бед
  rationale: Псалом формулирует обещание в жанре мудростного благословения. Перевод сохраняет его силу и вместе с тем не добавляет в текст определённой богословской системы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Синтаксический параллелизм и представительное единственное число сохранены; архаические и конфессионально маркированные обороты не использованы.
