lexical_decisions:
- source_word: יַחַד
  choice: сообща
  rationale: Передаёт согласованное, совместное действие врагов естественным современным русским наречием.
- source_word: עָלַי
  choice: против меня
  rationale: В контексте ненависти и злого умысла предлог имеет враждебную направленность, хотя возможен и тематический смысл «обо мне».
- source_word: יִתְלַחֲשׁוּ
  choice: шепчутся
  rationale: Возвратная форма естественно передаёт взаимное перешёптывание между собой, не усиливая значение до явного заговора.
- source_word: כָּל שֹׂנְאָי
  choice: все ненавидящие меня
  rationale: Сохраняет глагольный характер еврейского причастия и звучит достойно и понятно.
- source_word: יַחְשְׁבוּ
  choice: замышляя
  rationale: В сочетании со «злом» глагол означает обдумывание или составление злого замысла; деепричастие естественно связывает параллельные действия.
- source_word: רָעָה
  choice: зло
  rationale: Сохраняет широкое значение, включающее как нравственное зло, так и намеренный вред.
- source_word: לִי
  choice: мне
  rationale: Передаёт самостоятельное לִי и сохраняет отличие от предшествующего עָלַי «против меня».
