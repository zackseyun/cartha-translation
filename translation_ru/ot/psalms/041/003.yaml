  text: Yahweh will sustain him on his sickbed[a]; in his illness you restore his whole bed.
translation:
  language: ru
  text: Яхве поддержит его на постели болезни; всю его постель Ты меняешь, когда он болен.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю его постель Ты переворачиваешь, когда он болен». Еврейский глагол буквально означает «поворачивать, переворачивать». Вероятно, это образ заботы о больном и перемены его постели; точный оттенок выражения не вполне ясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: יִסְעָדֶנּוּ
  choice: поддержит его
  rationale: Глагол סעד означает поддерживать, укреплять или давать опору ослабевшему; этот вариант естественен в контексте болезни.
- source_word: עַל עֶרֶשׂ דְּוָי
  choice: на одре болезни
  rationale: Сохраняет образ постели, на которой человек лежит из-за болезни, и соответствует возвышенному поэтическому регистру псалма.
- source_word: כָּל מִשְׁכָּבוֹ
  choice: всё его ложе
  rationale: Сохраняет усилительное כָּל и параллелизм с образом одра в первой строке.
- source_word: הָפַכְתָּ
  choice: Ты переменишь
  rationale: הפך буквально означает «поворачивать, переворачивать, изменять». «Переменишь» сохраняет образ и благотворный смысл в данном контексте, не сводя неоднозначную идиому только к исцелению.
- source_word: בְחָלְיוֹ
  choice: во время его недуга
  rationale: Передаёт обстоятельственное значение предлога ב и избегает тяжёлого повторения слова «болезнь» при сохранении смысла.
theological_decisions:
- issue: Переход от третьего лица к прямому обращению к Богу
  choice: 'Сохранён переход: «Яхве поддержит… Ты переменишь».'
  alternative: 'Согласовать обе части в третьем лице: «Яхве поддержит… Он переменит».'
  rationale: Масоретский текст переходит от речи о Яхве к непосредственному обращению к Нему; этот поэтический переход не следует сглаживать.
- issue: Смысл перемены ложа
  choice: Сохранён образ перемены всего ложа с пояснением в сноске.
  alternative: 'Истолковать непосредственно как исцеление: «Ты восстановишь его здоровье».'
  rationale: Еврейский текст говорит о ложе и использует многозначный глагол הפך; прямое указание на исцеление устранило бы подлинную образность и неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой лексикой («одр», «ложе», «недуг»). Сохранены поэтический параллелизм, личное имя Яхве и резкий переход к обращению на «Ты».
