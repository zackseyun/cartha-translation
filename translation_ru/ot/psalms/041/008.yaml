base_translation:
  language: en
  yaml_path: translation/ot/psalms/041/008.yaml
  text: A wicked thing is poured out upon him; now that he lies down[a], he will rise no more.
translation:
  language: ru
  text: «На него излито нечто пагубное[a]; а он лёг — и больше не встанет».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «На него возложена мерзкая напасть» или «Ему предъявлено злое обвинение». Еврейское выражение трудно для понимания и может относиться как к губительной болезни или напасти, так и к злонамеренному обвинению.'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר בְּלִיַּעַל
  choice: нечто пагубное
  rationale: Сжатое еврейское выражение может обозначать как губительную напасть или болезнь, так и злое обвинение. Нейтральное «нечто» не сводит смысл только к одному из этих толкований, а «пагубное» передаёт разрушительную и нравственно отрицательную окраску בְּלִיַּעַל.
- source_word: יָצוּק בּוֹ
  choice: обрушилось на него
  rationale: Буквальный образ допускает «излито/вылито на него», но по-русски такое сочетание здесь неестественно и может затемнить смысл. «Обрушилось на него» сохраняет представление о постигшем человека зле, не решая, болезнь это или обвинение.
- source_word: וַאֲשֶׁר שָׁכַב
  choice: раз он слёг
  rationale: «Слёг» естественно передаёт буквальное «лёг» в контексте тяжёлого состояния и сохраняет возможность подразумеваемой болезни; «раз» выражает связь с последующим утверждением, не делая её строго временной.
- source_word: לֹא יוֹסִיף לָקוּם
  choice: больше не встанет
  rationale: Кратко и точно передаёт идиому о том, что человек уже не поднимется или не оправится, сохраняя тяжёлый тон стиха.
theological_decisions:
- issue: Неоднозначность образа в первой строке
  choice: Сохранена возможность понимать выражение и как губительную напасть, и как злое обвинение.
  alternative: 'Перевести однозначно: «смертельная болезнь поразила его» или «злое обвинение возложено на него».'
  rationale: Еврейское דְּבַר בְּלִיַּעַל יָצוּק בּוֹ трудно и допускает оба направления толкования; контекст не требует устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-сдержанным звучанием. Разговорное по происхождению «слёг» общеупотребительно и уместно в контексте тяжёлой болезни; архаизмы и конфессионально окрашенная терминология не используются.
