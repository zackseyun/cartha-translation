  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הַ/בֹּטְחִ֥ים בַּ/יהוָ֑ה כְּֽ/הַר צִיּ֥וֹן לֹא יִ֝מּ֗וֹט לְ/עוֹלָ֥ם יֵשֵֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/001.yaml
  text: A Song of Ascents. Those who trust in Yahweh are like Mount Zion[a], which cannot be shaken, but remains forever.
translation:
  language: ru
  text: 'Песнь восхождений. Уповающие на Яхве — как гора Сион: она не поколеблется[a], пребудет вовеки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «не сдвинется».'
    reason: 'Лексическая альтернатива для לֹא יִמּוֹט: глагол может обозначать сдвиг, шатание или потерю устойчивости.'
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождения
  rationale: Сохраняет традиционное название группы псалмов 120–134 и образ подъёма, не конкретизируя спорный исторический контекст выражения.
- source_word: הַבֹּטְחִים
  choice: Уповающие
  rationale: Причастие обозначает людей, которым свойственно постоянное доверие; «уповающие» кратко и достойно передаёт эту характеристику.
- source_word: בַּיהוָה
  choice: на Яхве
  rationale: Предлог ב обозначает объект доверия, что естественно передаётся по-русски конструкцией «уповать на»; тетраграмматон передан личным именем «Яхве».
- source_word: כְּהַר צִיּוֹן
  choice: как гора Сион
  rationale: Сохраняет прямое сравнение и общепринятую русскую форму географического имени.
- source_word: לֹא יִמּוֹט
  choice: она не поколеблется
  rationale: Форма Niphal глагола מוט выражает невозможность утратить устойчивость; местоимение явно связывает сказуемое с горой Сион.
- source_word: לְעוֹלָם יֵשֵׁב
  choice: пребудет вовеки
  rationale: Передаёт продолжительное, незыблемое существование; поэтическое «пребудет» естественно в контексте псалма и не сводит יָשַׁב к буквальному «сидеть».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; форма «Яхве» передаёт личное имя, не заменяя его титулом.
- issue: К кому относятся глаголы единственного числа
  choice: К горе Сион как образу устойчивости уповающих
  alternative: Непосредственно к совокупности уповающих
  rationale: Ближайшее грамматическое существительное — единственное число «гора Сион», и последующие глаголы также стоят в единственном числе; при этом сравнение распространяет её незыблемость на уповающих.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой лексикой. Двоеточие и бессоюзное следование сказуемых сохраняют компактный параллелизм еврейской строки; местоимение «она» устраняет возможную неясность грамматического числа.
