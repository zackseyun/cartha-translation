lexical_decisions:
- source_word: הֵיטִיבָה
  choice: Твори добро
  rationale: Побудительная форма глагола יטב обращена к Яхве и выражает просьбу благотворить или хорошо поступать с кем-либо. «Твори добро» естественно звучит по-русски и сохраняет лексическую связь со словом «добрым».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое обращение исходного текста и не заменяет имя титулом.
- source_word: לַטּוֹבִים
  choice: добрым
  rationale: 'Прилагательное טוֹב употреблено субстантивно и обозначает добрых людей. Такая передача кратка и сохраняет словесную перекличку: «твори добро… добрым».'
- source_word: וְלִישָׁרִים
  choice: и прямым
  rationale: יָשָׁר обозначает прямоту и нравственную цельность. «Прямым» сохраняет образ исходного слова и в сочетании «прямым сердцем» понятно как характеристика внутренней честности.
- source_word: בְּלִבּוֹתָם
  choice: сердцем
  rationale: Буквально стоит множественное «в их сердцах». Русское распределительное единственное число в выражении «прямым сердцем» естественно применяет характеристику к каждому человеку и сохраняет акцент на внутреннем состоянии.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте употреблено личное имя, поэтому оно передано транслитерацией, без замены титулом.
- issue: Нравственная характеристика получателей блага
  choice: добрым и прямым сердцем
  alternative: праведным и честным; добрым и тем, чьи сердца правы
  rationale: Сохранены две параллельные характеристики без превращения слова «добрые» в специальный богословский термин; упоминание сердца передаёт внутреннюю нравственную цельность, а не только внешнее поведение.
translation_notes:
  register: Современный литературный русский с кратким молитвенным обращением и сохранённым поэтическим повтором «добро — добрым». Выражение «прямым сердцем» имеет слегка возвышенную, уместную для псалма окраску.
