base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/002.yaml
  text: As the mountains surround Jerusalem[a], so Yahweh surrounds his people from now and forever.
translation:
  language: ru
  text: Как горы окружают Иерусалим[a], так Яхве окружает свой народ отныне и навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Иерусалим — горы вокруг него, и Яхве вокруг Своего народа отныне и навеки».'
    reason: Сохраняет более формальную синтаксическую структуру еврейского текста и простое соединительное значение ו как допустимую альтернативу.
lexical_decisions:
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Устоявшаяся русская форма названия города.
- source_word: הָרִים
  choice: горы
  rationale: Основное значение множественного числа הַר; оно соответствует местности вокруг Иерусалима и сохраняет образ надёжной защиты.
- source_word: סָבִיב לָהּ
  choice: окружают Иерусалим
  rationale: סָבִיב с ל обозначает нахождение вокруг; замена местоименного суффикса названием города естественна по-русски и ясно передаёт отнесённость суффикса женского рода к Иерусалиму как городу.
- source_word: וַיהוָה
  choice: так Яхве
  rationale: 'Вав в поэтическом параллелизме имеет сопоставительную силу: как горы окружают город, так Яхве окружает народ. Тетраграмматон передан личным именем «Яхве».'
- source_word: סָבִיב לְעַמּוֹ
  choice: окружает Свой народ
  rationale: Повтор глагола сохраняет параллелизм и защитный образ исходного текста.
- source_word: מֵעַתָּה וְעַד עוֹלָם
  choice: отныне и навеки
  rationale: Естественная для современной литературной русской речи формула, передающая непрерывность от настоящего времени в вечность.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст непосредственно употребляет тетраграмматон; форма «Яхве» передаёт личное заветное имя и согласуется с указанным принципом проекта.
- issue: Значение союза ו перед יְהוָה
  choice: сопоставительное «так Яхве»
  alternative: соединительное «и Яхве»
  rationale: Поэтический параллелизм подразумевает аналогию. «Как… так…» естественно выражает её по-русски, тогда как более формальное чтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Конструкция «как… так…» делает подразумеваемое сравнение ясным, а «отныне и навеки» звучит естественно и возвышенно без архаической тяжеловесности.
