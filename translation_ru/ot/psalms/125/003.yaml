  text: כִּ֤י לֹ֪א יָנ֡וּחַ שֵׁ֤בֶט הָ/רֶ֗שַׁע עַל֮ גּוֹרַ֪ל הַֽ/צַּדִּ֫יקִ֥ים לְמַ֡עַן לֹא יִשְׁלְח֖וּ הַ/צַּדִּיקִ֨ים בְּ/עַוְלָ֬תָ/ה יְדֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/003.yaml
  text: For the scepter of wickedness will not rest on the lot of the righteous[c][b][a], lest the righteous stretch out their hands to wrongdoing.
translation:
  language: ru
  text: Ибо жезл нечестия не останется над уделом праведных[a][b], чтобы праведные не простёрли рук своих к беззаконию[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жезл нечестивых». Еврейское выражение может обозначать как нечестие, характеризующее власть, так и нечестивых, которым принадлежит жезл.'
    reason: lexical_alternative
  - marker: b
    text: «Удел» — то есть доставшаяся доля или наследие праведных.
    reason: lexical_alternative
  - marker: c
    text: Еврейский текст говорит о том, чтобы праведные не «простирали рук» в неправде; этот образ означает, что они сами могут начать творить зло.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание высказанной в псалме уверенности; «ибо» естественно передаёт пояснительную связь и сохраняет возвышенный, но понятный регистр.
- source_word: יָנוּחַ
  choice: не останется
  rationale: Глагол обозначает покой, водворение или длительное пребывание. «Не останется» ясно выражает, что нечестивое господство не будет постоянным, не отрицая временного угнетения.
- source_word: שֵׁבֶט
  choice: жезл
  rationale: В контексте власти это образ правления и господства. «Жезл» сохраняет метафору и по-русски яснее указывает на власть, чем буквальная «палка».
- source_word: הָרֶשַׁע
  choice: нечестия
  rationale: Абстрактное существительное допускает значение качества — нечестия или злой власти; родительная конструкция «жезл нечестия» сохраняет эту форму. Возможное личное понимание отмечено в сноске.
- source_word: גּוֹרַל
  choice: удел
  rationale: Здесь слово обозначает доставшуюся долю, область или наследие. «Удел» естественнее современного буквального «жребий» применительно к тому, что отведено праведным.
- source_word: הַצַּדִּיקִים
  choice: праведных / праведные
  rationale: Обычное и точное обозначение людей, живущих праведно; оно сохраняет нравственный и заветный оттенок без дополнительного толкования.
- source_word: לְמַעַן לֹא
  choice: чтобы ... не
  rationale: Конструкция выражает предотвращаемый результат или цель; русское «чтобы не» передаёт это прямо и естественно.
- source_word: יִשְׁלְחוּ ... יְדֵיהֶם
  choice: простёрли рук своих
  rationale: Сохранён конкретный древнееврейский образ протягивания рук как вступления в действие; порядок слов выбран ради естественного сочетания с отрицанием.
- source_word: בְּעַוְלָתָה
  choice: к беззаконию
  rationale: Существительное обозначает неправду, несправедливость или неправедное дело. «Беззаконие» здесь достаточно широко передаёт участие во зле, а не только юридическую несправедливость.
theological_decisions:
- issue: Характер обещания о власти нечестия над праведными
  choice: Нечестивое господство не останется над уделом праведных постоянно.
  alternative: Нечестивые вообще никогда не будут властвовать над праведными.
  rationale: 'יָנוּחַ говорит о покое, водворении или пребывании; поэтому стих допускает временное угнетение, но отвергает его окончательность. Придаточное предложение сохраняет напряжение текста: продолжительное угнетение могло бы подтолкнуть даже праведных к неправде.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой образностью. Слова «жезл», «удел» и «простёрли» сохраняют поэтическую конкретность оригинала, оставаясь понятными обычному читателю. Все сноски привязаны к соответствующим словам и образам в основном тексте.
