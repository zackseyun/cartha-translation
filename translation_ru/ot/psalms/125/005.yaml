source:
  edition: WLC
  text: וְ/הַ/מַּטִּ֤ים עַֽקַלְקַלּוֹתָ֗/ם יוֹלִיכֵ֣/ם יְ֭הוָה אֶת פֹּעֲלֵ֣י הָ/אָ֑וֶן שָׁ֝ל֗וֹם עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/005.yaml
  text: But as for those who turn aside to their crooked ways[a], Yahweh will lead them away with the workers of iniquity[c][b]. Peace be upon Israel.
translation:
  language: ru
  text: А тех, кто сворачивает на свои кривые пути[a], Яхве уведёт вместе с творящими беззаконие. Мир Израилю![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на свои извилистые тропы»; возможен также нравственный смысл: «на свои порочные пути».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Мир — на Израиль». Это краткое благословение или молитва о мире и благополучии Израиля.'
    reason: cultural_note
lexical_decisions:
- source_word: וְהַמַּטִּים
  choice: А тех, кто сворачивает
  rationale: Причастие от נטה обозначает отклонение, сворачивание с прямого пути. Союз передан как «а», поскольку стих противопоставляет этих людей праведным, упомянутым ранее.
- source_word: עַקַלְקַלּוֹתָם
  choice: на свои кривые пути
  rationale: Слово обозначает кривые, извилистые или порочные пути; перевод сохраняет образ пути и его нравственный смысл. Местоимение относится к самим уклоняющимся.
- source_word: יוֹלִיכֵם
  choice: уведёт
  rationale: Каузативная форма от הלך означает «повести, заставить уйти». «Уведёт» естественно выражает удаление в контексте суда, не уточняя сверх текста конечное место.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: אֶת
  choice: вместе с
  rationale: 'Здесь אֶת имеет сопроводительное значение: уклоняющиеся будут уведены вместе с творящими беззаконие.'
- source_word: פֹּעֲלֵי הָאָוֶן
  choice: творящими беззаконие
  rationale: Передаёт буквальную конструкцию «делающие/творящие беззаконие» и сохраняет нравственную весомость выражения без архаического «делатели».
- source_word: שָׁלוֹם עַל יִשְׂרָאֵל
  choice: Мир Израилю!
  rationale: Краткая русская формула естественно передаёт еврейское благословение или молитвенное пожелание, не добавляя отсутствующего в оригинале глагола.
theological_decisions:
- issue: Сила заключительной формулы שָׁלוֹם עַל יִשְׂרָאֵל
  choice: 'Благословение или молитвенное пожелание: «Мир Израилю!»'
  alternative: 'Номинальное утверждение: «Мир на Израиле» или развёрнутое пожелание «Да будет мир Израилю»'
  rationale: В псалмовом контексте безглагольная формула естественно звучит как литургическое благословение. Краткий перевод сохраняет присущую еврейскому тексту неопределённость между пожеланием и провозглашением.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Сохранены метафора кривого пути, личное имя Яхве и лаконичность заключительного благословения.
