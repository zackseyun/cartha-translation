base_translation:
  language: en
  yaml_path: translation/ot/psalms/125/000.yaml
  text: 'A Song of Ascents[a]. Those who trust in Yahweh are like Mount Zion: it will not be shaken; it abides forever.'
translation:
  language: ru
  text: 'Песнь восхождений. Те, кто уповает на Яхве, — как гора Сион: она не поколеблется, пребудет вовеки.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Традиционно и достаточно буквально передаёт заголовок, сохраняя возможную связь с паломническими восхождениями без уточнения неоднозначного исторического контекста.
- source_word: הַבֹּטְחִים
  choice: Надеющиеся
  rationale: Передаёт устойчивое доверие и упование, а не только интеллектуальную уверенность.
- source_word: בַּיהוָה
  choice: на Яхве
  rationale: Передаёт личное имя Бога в соответствии с еврейским текстом; управление «надеяться на» естественно для современного русского языка.
- source_word: לֹא יִמּוֹט
  choice: не поколеблется
  rationale: Сохраняет образ незыблемости горы и естественно звучит по-русски; возможное буквальное «не сдвинется» здесь менее идиоматично.
- source_word: לְעוֹלָם יֵשֵׁב
  choice: пребудет вовеки
  rationale: Сохраняет длительность и возвышенный поэтический регистр; глагол יֵשֵׁב буквально связан с пребыванием/обитанием, а в контексте выражает неизменное существование.
theological_decisions:
- issue: Референт глаголов в единственном числе
  choice: «она» относится к горе Сион
  alternative: Отнести «не поколеблется, пребудет» собирательно к надеющимся на Яхве
  rationale: Грамматически формы единственного числа непосредственно согласуются с «горой Сион»; сравнение при этом подразумевает её устойчивость как характеристику надеющихся.
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Транслитерация сохраняет личное имя, явно присутствующее в исходном тексте, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Синтаксис краток и ритмичен; двоеточие ясно раскрывает сравнение, а «пребудет вовеки» сохраняет возвышенность без архаической перегруженности.
