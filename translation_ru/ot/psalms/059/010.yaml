lexical_decisions:
- source_word: אֱלֹהֵי
  choice: Бог
  rationale: Сопряжённая форма אֱלֹהִים связывает слово «Бог» со следующим חַסְדּוֹ; по-русски эта связь естественно передана выражением «Бог своей верной любви».
- source_word: חסדו
  choice: своей верной любви
  rationale: Масоретский текст содержит суффикс 3-го лица мужского рода «его». При соотнесении с Богом русское возвратное местоимение «своей» естественно выражает смысл «его собственной». חֶסֶד обозначает стойкую, верную любовь и милость; «верная любовь» сохраняет оба личностный и устойчивый оттенки, не сужая значение до одной богословской категории.
- source_word: יְקַדְּמֵנִי
  choice: пойдёт впереди меня
  rationale: Пиэль глагола קדם может означать «встретить», «предварить» или «идти впереди». В контексте ожидаемой Божьей помощи выбран вариант, сохраняющий образ предваряющего действия.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Повтор существительного сохранён, чтобы передать выразительность еврейского текста, а не заменять его местоимением.
- source_word: יַרְאֵנִי
  choice: даст мне увидеть поражение
  rationale: Хифиль от ראה буквально означает «даст/позволит мне увидеть». Дополнение «поражение» делает естественной русскую конструкцию с בְ и передаёт контекст вражеской участи, однако не усиливает её до мести или злорадства.
- source_word: בְשֹׁרְרָי
  choice: моих врагов
  rationale: Причастная форма от שׁורר обозначает враждебных противников. «Мои враги» — ясный и естественный русский эквивалент.
theological_decisions:
- issue: Суффикс в חסדו и необычная конструкция אֱלֹהֵי חסדו
  choice: Бог своей верной любви
  alternative: Бог мой в Своей верной любви / Бог мой, исполненный верной любви
  rationale: 'Основной текст следует консонантному тексту и масоретскому членению WLC, понимая суффикс как 3-е лицо: Божья собственная верная любовь. Иная вокализация или переводческая традиция допускает чтение «Бог мой»; значимая неопределённость сохранена в сноске.'
- issue: Смысл видения врагов
  choice: даст мне увидеть поражение моих врагов
  alternative: даст мне посмотреть на моих врагов
  rationale: В контексте псалма выражение подразумевает, что молящийся увидит неблагоприятный исход для врагов. «Поражение» проясняет русскую фразу, не вводя более сильного утверждения о мести или полном уничтожении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Порядок маркеров [a][b] соответствует их месту после спорной первой строки; повтор «Бог» сохранён. Формулировка избегает архаизмов и конфессионально специфической терминологии.
