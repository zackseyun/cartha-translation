  text: יָשׁ֣וּבוּ לָ֭/עֶרֶב יֶהֱמ֥וּ כַ/כָּ֗לֶב וִ/יס֥וֹבְבוּ עִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/006.yaml
  text: They return at evening[c][b][a]; they growl like dogs and go around the city.
translation:
  language: ru
  text: Вечером они возвращаются, рычат, словно псы[a], и бродят по городу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «словно пёс». Еврейское единственное число здесь может иметь обобщающее значение. Глагол также можно перевести: «воют» или «шумят».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обходят город»; также возможно: «ходят вокруг города».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: они возвращаются
  rationale: Форма Qal imperfect 3-го лица множественного числа от שׁוב передаёт возвращение; настоящее время по-русски естественно выражает повторяющееся действие в этой поэтической сцене.
- source_word: לָעֶרֶב
  choice: к вечеру
  rationale: Предлог לְ при עֶרֶב допускает временное значение «к вечеру»; эта формулировка сохраняет направленность к наступлению вечера и естественна в современном русском.
- source_word: יֶהֱמוּ
  choice: рычат
  rationale: Глагол המה обозначает громкий, гулкий или звероподобный звук. В сравнении с псами «рычат» передаёт угрожающий образ, не устраняя возможность иного вида громкого собачьего крика.
- source_word: כַכָּלֶב
  choice: словно псы
  rationale: Еврейское единственное число имеет обобщающее значение. Русское множественное число согласуется с подлежащим и естественно представляет врагов как свору, тогда как исходная грамматическая форма отмечена в сноске.
- source_word: וִיסוֹבְבוּ
  choice: и кружат
  rationale: סבב означает двигаться вокруг, обходить или ходить кругами. «Кружат по городу» сохраняет идею повторяющегося движения, не добавляя явно выраженного в еврейском тексте мотива охоты.
- source_word: עִיר
  choice: по городу
  rationale: Хотя существительное употреблено без артикля, контекст указывает на конкретный город; русская конструкция с определённостью, выводимой из контекста, звучит естественно.
