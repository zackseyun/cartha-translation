source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה תִּשְׂחַק לָ֑/מוֹ תִּ֝לְעַ֗ג לְ/כָל גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/008.yaml
  text: But you[a], O Yahweh, laugh at them; you mock all the nations.
translation:
  language: ru
  text: Но Ты[a], Яхве, смеёшься над ними; Ты насмехаешься над всеми народами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «А Ты» или более буквально: «И Ты».'
    reason: Союз וְ допускает соединительное и контрастное прочтение; контекст поддерживает противопоставление, но не устраняет исходную многозначность.
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Но Ты
  rationale: Сочетание союза וְ с самостоятельным местоимением אַתָּה создаёт риторическое противопоставление поведению врагов в предыдущем контексте. «Но Ты» естественно передаёт этот поворот по-русски, не отрицая более буквальной возможности «И Ты».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: תִּשְׂחַק לָמוֹ
  choice: смеёшься над ними
  rationale: Глагол שׂחק имеет конкретное значение «смеяться», а לָמוֹ указывает, на кого направлен смех. Русское «смеяться над ними» точно и естественно передаёт конструкцию.
- source_word: תִּלְעַג
  choice: насмехаешься
  rationale: Глагол выражает насмешку, осмеяние. «Насмехаешься» сохраняет параллелизм со «смеёшься над ними» и звучит современно.
- source_word: לְ/כָל גּוֹיִם
  choice: над всеми народами
  rationale: גּוֹיִם здесь обозначает народы вообще, а не «язычников» как позднейшую религиозную категорию. Предлог передан согласно управлению русского глагола «насмехаться над».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Форма «Яхве» сохраняет его как имя и отражает наиболее принятую научную реконструкцию произношения.
- issue: Божественный смех и насмешка
  choice: Сохранены прямые выражения «смеёшься над ними» и «насмехаешься»
  alternative: Истолковать метафору как «не боишься их» или «обращаешь их замыслы в ничто»
  rationale: Еврейский текст прямо приписывает Яхве смех и насмешку; перевод не смягчает этот образ и не подменяет его богословским объяснением.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Заглавное «Ты» применено при обращении к Богу как устойчивая русская почтительная норма; синтаксический параллелизм двух полустиший сохранён.
