lexical_decisions:
- source_word: וְיָשׁוּבוּ
  choice: они возвращаются
  rationale: Глагол שוב означает «возвращаться». Настоящее время естественно передаёт повторяющееся действие в поэтическом описании.
- source_word: לָעֶרֶב
  choice: к вечеру
  rationale: עֶרֶב означает «вечер»; сочетание с ל допускает временное значение «к вечеру / вечером». «К вечеру» сохраняет направленность формы и звучит естественно по-русски.
- source_word: יֶהֱמוּ
  choice: рычат
  rationale: המה обозначает громкий, гулкий или звероподобный шум. В сравнении с псами «рычат» конкретно и естественно передаёт образ, не устраняя возможного значения «воют».
- source_word: כַכָּלֶב
  choice: как псы
  rationale: В еврейском стоит собирательно-представительное единственное число «как пёс». При множественном подлежащем русское множественное «как псы» естественнее и сохраняет образ стаи.
- source_word: וִיסוֹבְבוּ
  choice: и бродят вокруг
  rationale: סבב означает двигаться кругом, обходить или кружить. «Бродят вокруг» передаёт повторное движение вокруг города, не добавляя слишком определённой цели охоты.
- source_word: עִיר
  choice: города
  rationale: Существительное означает «город». Русская конструкция «вокруг города» естественно указывает на известный из контекста город без необходимости отдельно выражать определённость.
