  text: They return at evening[c][b][a]; they growl like dogs and prowl around the city.
translation:
  language: ru
  text: Вечером они возвращаются, рычат, как псы,[a] и бродят вокруг города.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воют, как псы». Еврейский глагол может обозначать громкий звероподобный звук.'
