source:
  edition: WLC
  text: וַ/אֲנִ֤י אָשִׁ֣יר עֻזֶּ/ךָ֮ וַ/אֲרַנֵּ֥ן לַ/בֹּ֗קֶר חַ֫סְדֶּ֥/ךָ כִּֽי הָיִ֣יתָ מִשְׂגָּ֣ב לִ֑/י וּ֝/מָנ֗וֹס בְּ/י֣וֹם צַר לִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/016.yaml
  text: But I will sing of your strength[a]; I will sing aloud of your steadfast love in the morning, for you have been a stronghold for me[c][b], and a refuge in the day of my distress.
translation:
  language: ru
  text: А я буду воспевать твою силу; поутру буду радостно петь[a] о твоей верной любви[b], потому что ты был мне крепостью и убежищем в день моей беды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду поутру восклицать от радости». Еврейский глагол может обозначать и ликующее пение, и громкий радостный возглас.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово хесед означает деятельную, неизменную любовь, соединённую с верностью.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Самостоятельное местоимение с союзом подчёркивает противопоставление говорящего врагам из предыдущего контекста; «А я» естественно передаёт этот оттенок по-русски.
- source_word: אָשִׁיר עֻזֶּךָ
  choice: буду воспевать твою силу
  rationale: Имперфект выражает намерение псалмопевца, а «воспевать» естественно сочетается с предметом хвалы — Божьей силой.
- source_word: וַאֲרַנֵּן
  choice: буду радостно петь
  rationale: Глагол רנן обозначает громкое, ликующее выражение радости и может относиться как к пению, так и к радостному возгласу; основной текст сохраняет музыкальный смысл в контексте параллелизма.
- source_word: לַבֹּקֶר
  choice: поутру
  rationale: Передаёт временное значение и поэтическое противопоставление утренней хвалы ночному времени в ближайшем контексте псалма.
- source_word: חַסְדֶּךָ
  choice: твоей верной любви
  rationale: חסד здесь означает неизменную, деятельную и верную любовь Бога; выражение сохраняет как личный, так и обязывающий оттенок слова без архаизма.
- source_word: מִשְׂגָּב
  choice: крепостью
  rationale: Слово обозначает безопасное, защищённое, часто возвышенное место; «крепость» ясно передаёт образ надёжной защиты.
- source_word: וּמָנוֹס
  choice: и убежищем
  rationale: מנוס — место, куда бегут ради спасения; «убежище» естественно передаёт этот смысл и не сливается полностью с образом крепости.
- source_word: בְּיוֹם צַר לִי
  choice: в день моей беды
  rationale: Краткое русское выражение сохраняет образ особого дня личного бедствия и звучит естественно в поэтической речи.
theological_decisions:
- issue: Передача חֶסֶד в контексте Божьего избавления
  choice: верная любовь
  alternative: милость; неизменная любовь; заветная любовь
  rationale: «Верная любовь» передаёт постоянство, преданность и благость Бога, не сводя значение только к чувству, милосердию или явно сформулированной богословской категории завета.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтической интонацией. «Поутру» и «воспевать» поддерживают жанр псалма, оставаясь понятными современному читателю. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная издательская норма.
