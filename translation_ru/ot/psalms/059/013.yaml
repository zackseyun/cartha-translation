source:
  edition: WLC
  text: כַּלֵּ֥ה בְ/חֵמָה֮ כַּלֵּ֪ה וְֽ/אֵ֫ינֵ֥/מוֹ וְֽ/יֵדְע֗וּ כִּֽי אֱ֭לֹהִים מֹשֵׁ֣ל בְּ/יַעֲקֹ֑ב לְ/אַפְסֵ֖י הָ/אָ֣רֶץ סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/013.yaml
  text: Consume them in wrath[a]; consume them until they are no more, so that they may know that God rules in Jacob to the ends of the earth[b]. Selah
translation:
  language: ru
  text: Истреби их в ярости[a], истреби, пока их не станет, чтобы они узнали, что Бог властвует в Иакове до краёв земли[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Покончи с ними в ярости; покончи с ними — и их не станет». Еврейский текст допускает такой более резкий и буквальный перевод.'
    reason: lexical_alternative
  - marker: b
    text: «В Иакове» означает Божье владычество среди Иакова, то есть Израиля, или по отношению к нему; возможен перевод «над Иаковом».
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּלֵּה
  choice: истреби
  rationale: Повелительная форма породы пиэль от כלה означает довести до конца, уничтожить. «Истреби» естественно передаёт полноту уничтожения и сохраняет суровую силу повторённого призыва.
- source_word: בְחֵמָה
  choice: в ярости
  rationale: חֵמָה обозначает пылающий гнев, ярость; предлог ב передаёт состояние или способ действия.
- source_word: וְאֵינֵמוֹ
  choice: пока их не станет
  rationale: 'Буквально: «и их нет». Вслед за повторённым повелением оборот естественно выражает доведение действия до полного результата, не смягчая его.'
- source_word: וְיֵדְעוּ
  choice: чтобы они узнали
  rationale: Сочетание союза waw с имперфектом после повелений допускает целевое или результативное понимание. Русское «чтобы они узнали» сохраняет эту связь и напряжение между уничтожением врагов и их познанием Божьей власти.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В контексте псалма слово обозначает единого Бога Израиля.
- source_word: מֹשֵׁל
  choice: властвует
  rationale: Причастие указывает на продолжающееся господство. «Властвует» передаёт этот смысл ясно и в достойном поэтическом регистре.
- source_word: בְּיַעֲקֹב
  choice: в Иакове
  rationale: Сохранено буквальное значение предлога ב и имя Иаков как обозначение заветного народа; возможное понимание «над Иаковом» отмечено в сноске.
- source_word: לְאַפְסֵי הָאָרֶץ
  choice: до краёв земли
  rationale: Устойчивый древнееврейский оборот обозначает самые дальние пределы мира; русский эквивалент звучит естественно и сохраняет всемирный охват.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неизвестно, поэтому он передан традиционной транслитерацией без истолковывающего перевода.
theological_decisions:
- issue: Молитвенный призыв к полному уничтожению врагов
  choice: 'Сохранён прямой и повторённый призыв: «Истреби… истреби, пока их не станет».'
  alternative: Смягчить смысл до обуздания, рассеяния или частичного поражения врагов.
  rationale: Повтор повеления и выражение וְאֵינֵמוֹ требуют передать полное прекращение их существования в данном контексте, а не смягчать суровый язык псалма.
- issue: Соотношение уничтожения врагов и их познания Божьей власти
  choice: 'Сохранено: «пока их не станет, чтобы они узнали».'
  alternative: Явно заменить субъект на прочие народы либо устранить целевую связь.
  rationale: В еврейском тексте остаётся напряжение между полным уничтожением и последующим или целевым познанием; перевод не разрешает его добавлением отсутствующего субъекта.
- issue: Особое Божье владычество в Иакове и его всемирное признание
  choice: Сохранены и «в Иакове», и «до краёв земли».
  alternative: Ограничить высказывание одним Израилем или, напротив, устранить упоминание Иакова ради исключительно универсального смысла.
  rationale: Текст соединяет особое отношение Бога к Иакову с охватом до краёв земли; оба элемента сохранены без богословского упрощения.
translation_notes:
  register: Современный литературный русский язык с достойным псалмопевческим звучанием. Повтор повеления сохранён ради поэтического нажима; архаизмы, кроме принятой транслитерации «Села», не используются.
