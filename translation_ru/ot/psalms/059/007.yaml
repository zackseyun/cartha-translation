lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание; «вот» сохраняет её указательную силу и естественно звучит в современной литературной речи.
- source_word: יַבִּיעוּן בְּפִיהֶם
  choice: из уст их льются речи
  rationale: Глагол נבע рисует образ бурлящего или льющегося потока. Добавленное по смыслу «речи» позволяет естественно передать безобъектную еврейскую конструкцию и сохранить образ неудержимо изливающихся слов.
- source_word: חֲרָבוֹת בְּשִׂפְתוֹתֵיהֶם
  choice: на губах у них — мечи
  rationale: Сохранена исходная метафора пагубной речи как мечей, а также параллелизм с первой строкой.
- source_word: כִּי
  choice: ведь они говорят
  rationale: Союз вводит основание их дерзкого поведения; «они говорят» явно обозначает подразумеваемую прямую речь, не меняя содержания вопроса.
- source_word: מִי שֹׁמֵעַ
  choice: Кто слышит?
  rationale: Краткая форма отражает еврейское причастие настоящего времени и сохраняет намеренно неуказанный объект слуха.
theological_decisions:
- issue: Неуказанный объект глагола «слышать» в риторическом вопросе
  choice: «Кто слышит?» — без дополнения
  alternative: «Кто слышит нас?» или «Кто это слышит?»
  rationale: 'В еврейском тексте дополнение отсутствует. Такая открытая формулировка сохраняет дерзкую неопределённость: говорящие ведут себя так, словно никто, в том числе Бог, не слышит, однако перевод не делает это подразумеваемое содержание явным.'
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и метафоры мечей. Инверсия «из уст их» придаёт строке достоинство, не делая её архаичной.
