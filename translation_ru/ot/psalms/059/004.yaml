lexical_decisions:
- source_word: בְּלִי עָוֺן
  choice: хотя нет за мной вины
  rationale: Оборот выражает отсутствие вины; по контексту речь идёт о невиновности псалмопевца перед нападающими. Уступительное «хотя» естественно передаёт связь с их враждебными действиями, а «за мной» ясно выражает подразумеваемого носителя вины.
- source_word: יְרוּצוּן
  choice: они сбегаются
  rationale: Глагол רוץ означает «бежать, устремляться». «Сбегаются» сохраняет динамичный образ и в данном контексте естественно описывает совместное выступление врагов.
- source_word: וְיִכּוֹנָנוּ
  choice: и готовятся
  rationale: Форма от כון может обозначать приведение себя в готовность или занятие устойчивой позиции. «Готовятся» звучит естественно и не уточняет сверх текста, к чему именно они готовятся; более пространственное значение отмечено в сноске.
- source_word: עוּרָה
  choice: пробудись
  rationale: Императив сохраняет антропоморфный образ перехода Бога от кажущегося бездействия к действию и поэтическую напряжённость молитвы.
- source_word: לִקְרָאתִי
  choice: выйди мне навстречу
  rationale: Оборот буквально означает движение навстречу. Добавление «выйди» делает русский призыв идиоматичным, не устраняя возможный смысл прихода на помощь.
- source_word: וּרְאֵה
  choice: и посмотри
  rationale: Прямое и естественное соответствие императиву ראה, сохраняющее краткость заключительного призыва.
theological_decisions:
- issue: Антропоморфный призыв к Богу пробудиться
  choice: Сохранить образ «пробудись».
  alternative: «Восстань» или «приди в действие».
  rationale: Еврейская молитва намеренно говорит о Боге языком пробуждения, выражая просьбу вмешаться. Сохранение метафоры передаёт силу плача, не утверждая, что Бог буквально спит.
- issue: Кому приписывается отсутствие вины
  choice: 'Передать как невиновность псалмопевца: «нет за мной вины».'
  alternative: Оставить формально неопределённое «без вины».
  rationale: Ближайший контекст псалма содержит протест автора против обвинения в преступлении и грехе; голое русское «без вины они…» могло бы ошибочно приписать невиновность нападающим.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, параллелизма и настойчивых императивов еврейской поэзии. «Сбегаются» передаёт коллективное стремительное движение, а не спокойный бег.
