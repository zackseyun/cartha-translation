  yaml_path: translation/ot/psalms/059/017.yaml
  text: O my strength[a], to you I will sing praises, for God is my stronghold, the God of my steadfast love.
translation:
  language: ru
  text: Сила моя, Тебе я буду петь хвалу, ведь Бог — моя твердыня, Бог моей неизменной любви.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мой милостивый Бог»; или: «Бог, являющий мне неизменную любовь». Буквально: «Бог моей неизменной любви».'
    reason: alternative_reading
lexical_decisions:
- source_word: עֻזִּי
  choice: Сила моя
  rationale: Существительное עֹז означает «сила, мощь»; форма с суффиксом первого лица здесь служит поэтическим обращением к Богу. Русский порядок слов передаёт обращение без добавления междометия «о».
- source_word: אֵלֶיךָ
  choice: Тебе
  rationale: Предлог אֶל обозначает направленность «к, к тебе»; при глаголе пения естественный русский эквивалент — «Тебе ... петь хвалу».
- source_word: אֲזַמֵּרָה
  choice: я буду петь хвалу
  rationale: Пиэль глагола זמר в Псалмах обычно означает хвалебное пение, нередко с музыкальным оттенком. Выражение «петь хвалу» ясно передаёт богослужебный смысл.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для хвалы. «Ведь» естественно и ясно сохраняет причинную связь.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте אֱלֹהִים обозначает единого Бога Израиля и передаётся формой единственного числа.
- source_word: מִשְׂגַּבִּי
  choice: моя твердыня
  rationale: מִשְׂגָּב — высокое, защищённое и недоступное место. «Твердыня» сохраняет образ надёжного укрепления и защиты.
- source_word: אֱלֹהֵי חַסְדִּי
  choice: Бог моей неизменной любви
  rationale: Буквально конструкция означает «Бог моего хесед». Слово חֶסֶד включает оттенки верной, постоянной и милостивой любви. Сжатая конструкция основного текста сохраняет поэтическую многозначность исходной фразы.
theological_decisions:
- issue: Значение חַסְדִּי и его отношение к Богу
  choice: 'Сохранена генитивная конструкция: «Бог моей неизменной любви»'
  alternative: «мой милостивый Бог» или «Бог, являющий мне неизменную любовь»
  rationale: Еврейская фраза может характеризовать Бога как источник или воплощение верной любви либо указывать на Его любовь к псалмопевцу. Основной текст не устраняет эту богословски значимую неоднозначность, а сноска поясняет возможные прочтения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой лексикой. «Твердыня» сохраняет конкретный поэтический образ, а обращение «Сила моя» остаётся кратким и торжественным. Местоимение «Тебе» написано с прописной буквы как уважительное обращение к Богу.
