lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Избавь меня
  rationale: Побудительная форма породы хифиль от נצל с суффиксом первого лица означает избавление от непосредственной опасности. «Избавь меня» естественно передаёт мольбу о спасении и хорошо сочетается с מִן — «от».
- source_word: מֵאֹיְבַי
  choice: от моих врагов
  rationale: אֹיֵב — обычное обозначение врага; суффикс первого лица передан притяжательным местоимением, а מִן — предлогом «от».
- source_word: אֱלֹהָי
  choice: Боже мой
  rationale: Форма с суффиксом первого лица является прямым личным обращением. Русский звательный оборот «Боже мой» передаёт его естественно и торжественно.
- source_word: מִּמִתְקוֹמְמַי
  choice: от тех, кто восстаёт против меня
  rationale: Причастная форма от קום обозначает людей, которые поднимаются или выступают против говорящего. Развёрнутый оборот сохраняет образ действия и не сводит значение только к физическому нападению.
- source_word: תְּשַׂגְּבֵנִי
  choice: укрой меня в недоступном месте
  rationale: Пиэль от שׂגב выражает помещение на недосягаемую высоту и тем самым защиту. Русская формулировка передаёт защитный смысл и идею недоступности, не создавая возможной ассоциации с возвеличиванием человека.
theological_decisions:
- issue: Личное обращение אֱלֹהָי
  choice: Боже мой
  alternative: мой Бог
  rationale: В контексте мольбы это прямое обращение, поэтому форма «Боже мой» грамматически и стилистически точнее, без дополнительного богословского истолкования.
- issue: Образ возвышенного и недоступного убежища в תְּשַׂגְּבֵנִי
  choice: укрой меня в недоступном месте
  alternative: вознеси меня над восстающими против меня
  rationale: Здесь возвышение служит образом безопасности, а не прославления или превосходства. Выбранный вариант сохраняет основной смысл защиты; конкретный образ высоты отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим ритмом. Синтаксис прост и понятен; обращение «Боже мой» сохраняет достоинство псалма. Во второй строке защитный смысл редкого глагола выражен естественно, а его пространственный образ раскрыт в сноске.
