lexical_decisions:
- source_word: נַפְשִׁי
  choice: мою жизнь
  rationale: В контексте смертельной угрозы נֶפֶשׁ обозначает жизнь самого человека; буквальное «мою душу» в современном русском могло бы ошибочно сузить смысл до нематериальной души.
- source_word: יָג֣וּרוּ עָלַי
  choice: собираются против меня
  rationale: Передаёт враждебное собирание против говорящего, не уточняя сверх исходного текста способ нападения.
- source_word: עַזִּים
  choice: сильные люди
  rationale: Прилагательное во множественном числе субстантивировано и обозначает сильных или свирепых противников; «сильные люди» сохраняет основной смысл без излишнего усиления.
- source_word: לֹא פִשְׁעִי וְלֹא חַטָּאתִי
  choice: не из-за моего преступления и не из-за моего греха
  rationale: Естественно выражает утверждение псалмопевца, что преследование не вызвано его преступлением или грехом, сохраняя различие между פֶּשַׁע и חַטָּאת.
- source_word: יְהוָה
  choice: Господи
  rationale: В прямом обращении традиционная русская передача тетраграмматона словом «Господь» принимает звательную форму «Господи».
theological_decisions:
- issue: Утверждение псалмопевца о невиновности
  choice: не из-за моего преступления и не из-за моего греха
  alternative: хотя за мной нет ни преступления, ни греха
  rationale: Выбранный вариант не превращает контекстуальное отрицание вражеского преследования за конкретную вину в более широкое утверждение абсолютной безгрешности.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Частица «вот» сохраняет настойчивый призыв обратить внимание; порядок заключительного обращения «Господи» следует эмоциональному движению еврейской строки.
