    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «когда Саул послал, и они караулили дом, чтобы убить его». Слово «людей» прямо не выражено, но подразумевается глаголом во множественном числе.'
    reason: lexical_alternative
