- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая формула надписания сохраняет неоднозначность еврейского לְ: авторство, принадлежность, посвящение или связь с Давидом не уточняются искусственно.'
- source_word: מִכְתָּם
  choice: Миктам
  rationale: Точное значение термина неизвестно, поэтому прозрачнее передать его транслитерацией, а не выбирать предположительный перевод.
- source_word: בִּשְׁלֹחַ שָׁאוּל
  choice: Когда Саул послал людей
  rationale: 'Предлог בְּ с инфинитивом передаёт время: «когда послал». Слово «людей» восполнено из множественного числа следующего глагола для ясности по-русски.'
- source_word: וַיִּשְׁמְרוּ אֶת הַבַּיִת
  choice: и они стерегли дом
  rationale: Глагол שׁמר здесь означает враждебное наблюдение или караул, а не защиту, что ясно из цели — убить Давида. «Дом» передаёт определённый объект без добавления отсутствующего в тексте «его».
- source_word: לַהֲמִיתוֹ
  choice: чтобы убить его
  rationale: Инфинитив цели с суффиксом третьего лица мужского рода передан прямо и естественно.
