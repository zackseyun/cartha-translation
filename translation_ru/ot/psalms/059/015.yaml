lexical_decisions:
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение третьего лица множественного числа обозначает врагов; в русском отдельное «они» естественно сохраняет выраженный субъект.
- source_word: ינועון
  choice: бродят
  rationale: Глагол נוּעַ передаёт движение туда и сюда; в контексте поисков пищи «бродят» выражает беспокойное скитание без лишнего оттенка шатания.
- source_word: לֶאֱכֹל
  choice: в поисках пищи
  rationale: Инфинитив אָכַל с לְ указывает на цель — буквально «чтобы есть»; русское выражение естественно передаёт поиск еды.
- source_word: אִם לֹא יִשְׂבְּעוּ
  choice: если не насытятся
  rationale: Условная конструкция сохранена прямо, а שׂבע передано глаголом «насытиться», поддерживающим образ голода.
- source_word: וַיָּלִינוּ
  choice: то останутся на ночь
  rationale: Основное чтение от לוּן/לִין означает «ночевать, оставаться на ночь». Частица «то» делает условную связь ясной по-русски; контекстуально возможное понимание от другого омонимичного корня отмечено в сноске.
