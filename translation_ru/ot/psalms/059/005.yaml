  text: וְ/אַתָּ֤ה יְהוָֽה אֱלֹהִ֥ים צְבָא֡וֹת אֱלֹ֘הֵ֤י יִשְׂרָאֵ֗ל הָקִ֗יצָ/ה לִ/פְקֹ֥ד כָּֽל הַ/גּוֹיִ֑ם אַל תָּחֹ֨ן כָּל בֹּ֖גְדֵי אָ֣וֶן סֶֽלָה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/005.yaml
  text: But you[a], O Yahweh God of hosts, God of Israel, awake to punish all the nations; show no favor to any treacherous evildoers[c][b]. Selah
translation:
  language: ru
  text: Но Ты, Господь, Бог Воинств, Бог Израиля, пробудись, чтобы призвать к ответу все народы[a]. Не щади никого из тех, кто вероломно творит зло[b]. Села[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы взыскать со всех народов»; также возможно: «чтобы посетить все народы». Еврейский глагол פקד может означать «посетить», «обратить внимание», «призвать к ответу» или «наказать» — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не оказывай благоволения никому из вероломно творящих зло»; возможно также: «не милуй».'
    reason: lexical_alternative
  - marker: c
    text: «Села» — вероятно, музыкальное или богослужебное указание; его точное значение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, уместная в современном литературном библейском тексте; она сохраняет отличие личного имени Бога от אֱלֹהִים («Бог»).
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Бог Воинств
  rationale: Сохраняет образ צְבָאוֹת как воинств или сил, не сужая его исключительно до земных армий; прописная буква подчёркивает устойчивый божественный титул.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции и заветного титула.
- source_word: הָקִיצָה
  choice: пробудись
  rationale: Сохраняет поэтическую метафору обращения к Богу и звучит достоиннее и естественнее в молитвенном контексте, чем разговорное «проснись».
- source_word: לִפְקֹד
  choice: чтобы призвать к ответу
  rationale: 'פקד многозначно: «посетить», «обратить внимание», «взыскать», «наказать». В контексте суда выражение передаёт судебную направленность, не сводя действие непременно к самому наказанию.'
- source_word: כָּל הַגּוֹיִם
  choice: все народы
  rationale: Передаёт широкий политико-этнический смысл גּוֹיִם, не вводя более позднее противопоставление «иудеев» и «язычников».
- source_word: אַל תָּחֹן
  choice: не щади
  rationale: В данном призыве к суду это естественная русская передача запрета «не оказывай милости/благоволения»; лексическая буквальность отмечена в сноске.
- source_word: בֹּגְדֵי אָוֶן
  choice: тех, кто вероломно творит зло
  rationale: Развёрнутая конструкция естественно передаёт и причастное בֹּגְדֵי («поступающие вероломно»), и אָוֶן («зло, нечестие»), не превращая выражение в неясный составной эпитет.
- source_word: סֶלָה
  choice: Села
  rationale: Транслитерация сохраняет неясный древний музыкальный или литургический термин, не навязывая спорного толкования.
theological_decisions:
- issue: Характер действия, выраженного פקד
  choice: призвать к ответу
  alternative: наказать; посетить
  rationale: Контекст явно судебный, однако многозначный глагол не требует окончательно отождествлять Божье посещение с исполнением наказания; выбранная формулировка сохраняет судебную силу и часть исходной неоднозначности.
- issue: Объём כָּל הַגּוֹיִם в молитве о суде
  choice: все народы
  alternative: все язычники
  rationale: Еврейское выражение обозначает народы в широком смысле. Перевод не вводит конфессионального или позднейшего этнорелигиозного противопоставления.
- issue: Объект просьбы не проявлять милость
  choice: никого из тех, кто вероломно творит зло
  alternative: всех вероломных злодеев
  rationale: Отрицание с כָּל естественно передаётся как «никого из». Просьба направлена не без разбора на все народы как таковые, а грамматически — на вероломно творящих зло, что сохраняет напряжение между двумя частями стиха без их искусственного отождествления.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-поэтической речи. Местоимение «Ты» написано с прописной буквы как русская норма почтительного обращения к Богу. Синтаксис сделан ясным для обычного читателя, при этом сохранены метафора пробуждения, судебная неоднозначность פקד и неистолкованный термин «Села».
