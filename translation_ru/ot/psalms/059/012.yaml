source:
  edition: WLC
  text: חַטַּאת פִּ֗י/מוֹ דְּֽבַר שְׂפָ֫תֵ֥י/מוֹ וְ/יִלָּכְד֥וּ בִ/גְאוֹנָ֑/ם וּ/מֵ/אָלָ֖ה וּ/מִ/כַּ֣חַשׁ יְסַפֵּֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/059/012.yaml
  text: The sin of their mouth is the word of their lips[a]; let them be caught in their pride[b], because of the curse and the lie that they tell.
translation:
  language: ru
  text: Грех их уст — слово их губ[a]; пусть они будут уловлены в своей гордости[b] за проклятия и ложь, которые они изрекают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «За грех их уст, за слово их губ пусть они будут уловлены в своей гордости — за проклятия и ложь, которые они изрекают».'
    reason: Сжатый еврейский синтаксис позволяет присоединить начальные именные сочетания к пожеланию как указание на причину.
  - marker: b
    text: 'Или: «пусть их уловит собственная гордость»; или: «пусть они будут уловлены из-за своей гордости».'
    reason: Предлог ב может обозначать сферу, средство или причину.
lexical_decisions:
- source_word: חַטַּאת פִּימוֹ
  choice: грех их уст
  rationale: חַטָּאת здесь обозначает нравственный грех, проявляющийся в речи; единственное число פִּימוֹ имеет собирательный смысл. «Уста» естественно сохраняют поэтический образ и параллель с «губами».
- source_word: דְּבַר שְׂפָתֵימוֹ
  choice: слово их губ
  rationale: Сохранены единственное число דְּבַר и образ губ как источника речи. Формулировка намеренно поэтична и передаёт тесный параллелизм с «грехом их уст».
- source_word: וְיִלָּכְדוּ
  choice: пусть они будут уловлены
  rationale: Нифаль imperfect в контексте молитвы имеет желательное значение. Пассивная конструкция сохраняет образ попадания в западню, подразумеваемый корнем לכד.
- source_word: בִגְאוֹנָם
  choice: в своей гордости
  rationale: גָּאוֹן здесь означает надменную гордость. Предлог ב передан буквально как «в», без устранения возможного оттенка причины или средства.
- source_word: וּמֵאָלָה וּמִכַּחַשׁ
  choice: за проклятия и ложь
  rationale: 'Предлог מִן после пожелания понят причинно: наказание приходит за произносимое ими. אֵלָה передано естественным русским множественным «проклятия», а כַּחַשׁ — как «ложь».'
- source_word: יְסַפֵּרוּ
  choice: которые они изрекают
  rationale: В данном контексте ספר относится к произнесению или распространению проклятий и лжи. «Изрекают» сочетается с обоими дополнениями и поддерживает возвышенный поэтический регистр.
theological_decisions:
- issue: Синтаксическая связь начальных именных сочетаний с пожеланием
  choice: «Грех их уст — слово их губ; пусть они будут уловлены…»
  alternative: «За грех их уст, за слово их губ пусть они будут уловлены…»
  rationale: Масоретическая акцентуация допускает понимание начальных слов как отдельного именного высказывания, но еврейская сжатость позволяет связать их причинно с последующим пожеланием. Основной текст и сноска сохраняют обе возможности.
- issue: Значение ב в בִגְאוֹנָם
  choice: «в своей гордости»
  alternative: «собственной гордостью» или «из-за своей гордости»
  rationale: Буквальное пространственно-сферическое выражение не решает однозначно, является ли гордость состоянием, средством или причиной их падения.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Сохранён параллелизм «уста — губы», а также резкое пожелание суда; архаизмы сведены к умеренному поэтическому «изрекают».
