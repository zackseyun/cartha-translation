lexical_decisions:
- source_word: אַל תַּהַרְגֵם
  choice: Не убивай их
  rationale: Отрицательная частица אַל с формой глагола выражает запрет или просьбу не совершать действие; הרג означает «убивать».
- source_word: פֶּן יִשְׁכְּחוּ עַמִּי
  choice: чтобы мой народ не забыл
  rationale: פֶּן вводит нежелательное следствие, которого говорящий стремится избежать; эта конструкция естественно передаётся по-русски оборотом «чтобы… не».
- source_word: הֲנִיעֵמוֹ
  choice: заставь их скитаться
  rationale: Каузативная форма от נוע передаёт причинение движения или неустойчивости; «заставь их скитаться» хорошо выражает длительное беспокойное перемещение в противопоставлении немедленной смерти.
- source_word: בְחֵילְךָ
  choice: силой Твоей
  rationale: חַיִל может обозначать силу, мощь или войско; здесь инструментальное ב и обращение к Богу естественнее всего указывают на Его силу, при сохранении возможной лексической альтернативы в сноске.
- source_word: וְהוֹרִידֵמוֹ
  choice: и низложи их
  rationale: Каузатив от ירד буквально означает «заставить сойти вниз»; «низложи» сохраняет образ свержения и унижения, не уточняя способ суда.
- source_word: מָגִנֵּנוּ
  choice: щит наш
  rationale: Буквальный образ щита — устойчивое и значимое метафорическое обозначение Божьей защиты в Псалмах.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Это божественный титул אֲדֹנָי в прямом обращении, а не тетраграмматон; русская звательная интонация передаётся формой «Господь».
theological_decisions:
- issue: Характер испрашиваемого суда
  choice: Псалмопевец просит не убивать врагов немедленно, а подвергнуть их продолжительному, заметному унижению, чтобы народ не забыл.
  alternative: 'Просьбу можно понимать шире: заставить врагов шататься или лишить их устойчивости, не обязательно обрекать на буквальное скитание.'
  rationale: Последовательность «не убивай… заставь… скитаться… низложи» противопоставляет немедленную смерть более длительному суду; сноска сохраняет неоднозначность глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Сохранены прямое обращение к Богу и традиционный образ щита; прописная буква в «Твоей» соответствует благоговейному русскому библейскому регистру.
