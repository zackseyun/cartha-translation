  yaml_path: translation/ot/psalms/059/009.yaml
  text: O my strength[a], I will watch for you[c][b], for God is my stronghold.
translation:
  language: ru
  text: Его сила[a] — к Тебе я буду обращать взор[b], ведь Бог — моя твердыня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально: «его сила». Строка синтаксически трудна. Согласно распространённому традиционному пониманию и некоторым древним свидетельствам: «О сила моя»; всю первую часть стиха можно передать: «О сила моя, Тебя я буду ждать».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Тебя я буду ждать»; значение может сочетать внимательное наблюдение с ожиданием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֻזּוֹ
  choice: Его сила
  rationale: 'Масоретская огласовка указывает на суффикс 3-го лица мужского рода единственного числа: «его сила». Оборот в контексте труден и обрывист, поэтому более привычное обращение «Сила моя» не внесено в основной текст, а отмечено в сноске.'
- source_word: אֵלֶיךָ
  choice: к Тебе
  rationale: Сохранено обычное направительное значение предлога אֶל; прописная буква указывает на обращение к Богу.
- source_word: אֶשְׁמֹרָה
  choice: я буду устремлять взор
  rationale: Глагол שׁמר имеет значения «стеречь, наблюдать, бодрствовать». В сочетании с אֵלֶיךָ русское выражение «устремлять взор к Тебе» естественно передаёт внимательное, ожидающее обращение к Богу, не сводя смысл исключительно к ожиданию.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предыдущего утверждения; «ведь» естественно и кратко передаёт причинную связь в русской поэтической речи.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Стандартная передача наименования Бога Израиля, согласующегося здесь как единственное число.
- source_word: מִשְׂגַּבִּי
  choice: моя твердыня
  rationale: Слово обозначает высокое, укреплённое и безопасное место. «Твердыня» сохраняет образ надёжной оборонительной защиты и уместно в возвышенной поэтической речи.
theological_decisions:
- issue: Следует ли понимать עֻזּוֹ как форму 3-го лица «его сила» или как обращение «Сила моя»
  choice: В основном тексте сохранено масоретское «Его сила».
  alternative: «Сила моя, Тебя я буду ждать» или «О Сила моя, к Тебе я буду устремлять взор».
  rationale: Данный текст WLC однозначно огласован с суффиксом 3-го лица, хотя синтаксис строки остаётся трудным. Распространённое обращение лучше согласуется с рядом древних свидетельств и ближайшим контекстом, но требует иной огласовки или текстового решения; поэтому оно приведено в сноске.
- issue: Передаёт ли אֶשְׁמֹרָה наблюдение или ожидание
  choice: «буду устремлять взор» сохраняет образ внимательного наблюдения, направленного к Богу.
  alternative: «буду ждать Тебя»; «буду наблюдать за Тобой».
  rationale: Контекст допускает оттенок надежды и ожидания, однако основное значение корня שׁמר связано со стережением и внимательным наблюдением. Выбранный оборот сохраняет оба смысловых направления без излишнего уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Твердыня» сохраняет образ укреплённого убежища и остаётся понятной читателю. Необычная обрывистость начала намеренно сохранена как свойство масоретского текста, а не сглажена посредством неподтверждённой вставки.
