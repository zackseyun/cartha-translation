lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Избавь меня
  rationale: Повелительная форма глагола נצל выражает мольбу об избавлении от непосредственной опасности; «избавь меня» естественно и точно передаёт этот смысл.
- source_word: מִפֹּעֲלֵי אָוֶן
  choice: от творящих беззаконие
  rationale: Сочетание буквально обозначает «творящих/делающих беззаконие». Такая передача сохраняет еврейскую конструкцию и её нравственный смысл, оставаясь понятной по-русски.
- source_word: וּמֵאַנְשֵׁי דָמִים
  choice: и от людей крови
  rationale: Сохранён образный древнееврейский оборот, в котором множественное דָמִים указывает на пролитие крови, кровожадность или вину в кровопролитии.
- source_word: הוֹשִׁיעֵנִי
  choice: и спаси меня
  rationale: Повелительная форма ישׁע здесь означает спасение от врагов; «спаси меня» передаёт широкий смысл слова, не сужая его до военной победы.
theological_decisions:
- issue: Образность выражения אַנְשֵׁי דָמִים
  choice: людей крови
  alternative: кровожадных людей; виновных в кровопролитии
  rationale: Основной текст сохраняет намеренно резкий еврейский образ, а примечание поясняет возможные смысловые оттенки, не выбирая без необходимости только один из них.
- issue: Передача פֹּעֲלֵי אָוֶן
  choice: творящих беззаконие
  alternative: злодеев; делающих зло
  rationale: Выбранная формулировка сохраняет представление о людях как совершающих беззаконие, а не только даёт им обобщённое наименование.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной псалмовой речью. Параллелизм «избавь меня… спаси меня» сохранён; запятая перед одиночным «и» не ставится согласно современной русской пунктуации.
