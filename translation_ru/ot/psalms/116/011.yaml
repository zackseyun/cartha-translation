  choice: «Всякий человек — лжец»
  alternative: «Всё человечество лживо» / «всякий человек ненадёжен»
  rationale: Перевод сохраняет резкую формулировку и универсальный охват исходного текста, не сводя כֹּזֵב лишь к ненадёжности и не разрешая возможное напряжение между буквальной нравственной оценкой и более широким смыслом ложности.
