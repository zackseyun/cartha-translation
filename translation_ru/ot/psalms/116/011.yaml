  rationale: 'Личное местоимение сохранено, хотя русская глагольная форма уже указывает на первое лицо: в еврейском тексте оно выражено явно и придаёт высказыванию личный акцент.'
- source_word: אָמַרְתִּי
  choice: сказал
  rationale: Обычное и естественное соответствие глаголу речи, не придающее словам излишней торжественности.
- source_word: בְחָפְזִי
  choice: в смятении своём
  rationale: Форма передаёт состояние поспешного, тревожного возбуждения. «Смятение» естественно выражает эмоциональную силу контекста, а возможное значение поспешности отмечено в сноске.
- source_word: כָּל הָאָדָם
  choice: всякий человек
  rationale: Сочетание כָּל с собирательно-родовым אָדָם охватывает всех людей. «Всякий человек» сохраняет единственное число и обобщающий характер еврейского выражения.
- source_word: כֹּזֵב
  choice: лжец
  rationale: Причастная форма характеризует человека как ложного или обманчивого. Существительное «лжец» естественно передаёт сильное предикативное суждение, не ослабляя его до отдельного поступка.
theological_decisions:
