base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/009.yaml
  text: I will walk before Yahweh in the lands of the living[a].
translation:
  language: ru
  text: Буду ходить пред Яхве в землях живых[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Буду жить пред Яхве в земле живых». Еврейское выражение «ходить пред» может описывать образ жизни, а множественное «земли» здесь можно понимать шире — как «землю» или «мир» живых.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְהַלֵּךְ
  choice: Буду ходить
  rationale: Форма хитпаэль, имперфект 1-го лица ед. числа от הלך. Перевод сохраняет конкретный образ хождения и допускает более широкий смысл — продолжать жить и вести свою жизнь, — не сводя выражение только к одному из них.
- source_word: לִפְנֵי
  choice: пред
  rationale: Кратко передаёт пространственно-отношенческое значение «перед, в присутствии» и сохраняет возвышенный поэтический регистр псалма.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от заменяющего его титула.
- source_word: בְּאַרְצוֹת
  choice: в землях
  rationale: Сохраняет грамматическое множественное число еврейского существительного, не исключая идиоматического значения «в мире/области живых».
- source_word: הַחַיִּים
  choice: живых
  rationale: Субстантивированное множественное число обозначает живущих; сочетание «земли живых» сохраняет образность исходного выражения.
theological_decisions:
- issue: Означает ли стих физическое продолжение жизни после избавления или образ жизни в присутствии Бога
  choice: Сохранить образ «ходить пред Яхве», не ограничивая его только физической жизнью или только нравственным поведением
  alternative: «Буду жить пред Яхве в земле живых»
  rationale: Еврейское выражение допускает одновременно смысл продолжения жизни после избавления и жизни, проходящей в Божьем присутствии; основной текст сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической интонацией. Форма «пред» выбрана ради краткости и поэтического звучания; архаические глагольные формы и усложнённый синтаксис не используются.
