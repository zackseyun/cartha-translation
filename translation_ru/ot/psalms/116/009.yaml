  source_fidelity: 'Основной текст точно передаёт еврейскую последовательность и ключевые образы: אֶתְהַלֵּךְ — «Буду ходить», לִפְנֵי יְהוָה — «пред Яхве», בְּאַרְצוֹת הַחַיִּים — «в землях живых». Будущее значение имперфекта сохранено. Множественное число «землях» не сглажено, а возможное более обобщённое понимание выражения корректно вынесено в примечание.'
