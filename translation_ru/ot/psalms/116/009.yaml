  terminology: «Яхве» последовательно передаёт тетраграмматон как личное имя. «Ходить пред» сохраняет библейскую идиому, не навязывая исключительно нравственное или исключительно физическое значение. Формулировка примечания корректно представляет вариант «жить» и возможность понимать множественное «земли» как «землю» либо «мир» живых.
