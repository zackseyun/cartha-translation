lexical_decisions:
- source_word: שׁוּבִי
  choice: Возвратись
  rationale: Повелительная форма женского рода обращена к «душе». «Возвратись» передаёт возвращение к прежнему состоянию покоя и сохраняет поэтическую торжественность без архаичности.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: В контексте внутреннего самообращения традиционное и естественное русское выражение «душа моя» точнее передаёт נפשׁ, чем более отвлечённое «я сам» или контекстуально менее подходящее «жизнь моя».
- source_word: לִמְנוּחָיְכִי
  choice: к своему покою
  rationale: Сочетание предлога ל, существительного מנוחה и суффикса второго лица женского рода означает направленность к покою, принадлежащему адресату. Русское «к своему покою» естественно согласует перспективу с обращением «душа моя».
- source_word: כִּי
  choice: ведь
  rationale: Здесь союз вводит основание для повеления. «Ведь» естественно и поэтично связывает призыв вернуться к покою с последующим объяснением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: גָּמַל עָלָיְכִי
  choice: оказал тебе добро
  rationale: Глагол גמל с על обозначает то, как поступили с человеком, и может иметь как положительный, так и отрицательный смысл. Контекст благодарения однозначно указывает здесь на благодеяние; формулировка сохраняет идею благого отношения, не вводя обязательного оттенка награды или возмездия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Характер действия, выраженного גמל
  choice: оказал тебе добро
  alternative: воздал тебе добром
  rationale: Контекст требует положительного смысла, но сам глагол допускает значения «поступить с кем-либо», «воздать», «одарить». Основной вариант не усиливает возможный оттенок заслуженного воздаяния.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранено прямое обращение человека к собственной душе, причинная связь и образ возвращения к покою.
