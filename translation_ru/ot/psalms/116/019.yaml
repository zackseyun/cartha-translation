lexical_decisions:
- source_word: בְּחַצְרוֹת
  choice: во дворах
  rationale: Множественное число от חָצֵר обозначает ограждённые дворы, здесь — дворы храмового комплекса. «Во дворах» естественно и сохраняет образ исходного текста.
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Буквально «дома Яхве»; выражение сохраняет древнееврейскую метафору дома и в контексте обозначает храм, не подменяя её пояснительным словом «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом «Господь».
- source_word: בְּתוֹכֵכִי
  choice: посреди тебя
  rationale: Суффикс второго лица женского рода единственного числа передаёт прямое обращение к олицетворённому Иерусалиму; «посреди тебя» сохраняет и пространственный смысл, и обращение.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Использована общепринятая русская форма географического названия.
- source_word: הַלְלוּ יָהּ
  choice: Хвалите Яха!
  rationale: Глагол передан повелительным наклонением множественного числа, а краткая форма Божьего имени יָהּ — как «Ях». Это прозрачно передаёт состав выражения, лежащего в основе слова «аллилуйя».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон — личное Божье имя. Его транслитерация сохраняет различие между именем и титулом.
- issue: Передача краткой формы имени יָהּ
  choice: Ях
  alternative: Господь; аллилуйя
  rationale: Форма יָהּ отлична от полного тетраграмматона и входит в возглас הַלְלוּ־יָהּ. «Хвалите Яха» сохраняет оба элемента выражения, тогда как «аллилуйя» передаёт их слитной традиционной транслитерацией.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим строем. Сохранены храмовая образность, прямое обращение к Иерусалиму и различие между полным и кратким формами Божьего имени.
