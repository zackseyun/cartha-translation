  text: 'Then I called on the name of the LORD: “Please, LORD, rescue my life!”'
translation:
  language: ru
  text: 'Тогда я призвал имя ГОСПОДА: «Прошу, ГОСПОДИ, спаси мою жизнь!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  choice: Тогда я призвал имя ГОСПОДА
  rationale: Формула «призывать имя» сохранена как значимое библейское выражение обращения к Богу; контекстуальное «тогда» естественно передаёт повествовательную связь וּ.
- source_word: אָנָּה
  choice: Прошу
  rationale: Передаёт настойчивую просительную частицу естественным современным русским языком.
- source_word: מַלְּטָה נַפְשִׁי
  choice: спаси мою жизнь
  rationale: В данном контексте נֶפֶשׁ означает жизнь/самого человека, а не обособленную «душу»; «спаси» передаёт просьбу избавить от смертельной опасности.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: ГОСПОДЬ / ГОСПОДИ
  alternative: Яхве
  rationale: Традиционное обозначение тетраграмматона прописными буквами сохраняет узнаваемость и не вводит спорную реконструкцию произношения; звательная форма нужна по нормам русского языка.
- issue: Значение נַפְשִׁי
  choice: мою жизнь
  alternative: мою душу
  rationale: Просьба относится к спасению говорящего от смерти; перевод «жизнь» не вносит позднейшего противопоставления души и тела.
translation_notes:
  register: Современный литературный русский; молитвенная речь краткая, торжественная и понятная. Сохранён повтор имени ГОСПОДА и напряжённость прямой просьбы.
