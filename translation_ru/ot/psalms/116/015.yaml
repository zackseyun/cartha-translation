  text: יָ֭קָר בְּ/עֵינֵ֣י יְהוָ֑ה הַ֝/מָּ֗וְתָ/ה לַ/חֲסִידָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/015.yaml
  text: Precious in the eyes of Yahweh is the death of his faithful ones[a][b].
translation:
  language: ru
  text: Драгоценна в глазах Яхве смерть тех, кто верен Ему[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дорога в глазах Яхве смерть тех, кто верен Ему».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «те, кто верен Ему» можно также перевести как «Его святые» или «Его благочестивые»; еврейское слово обозначает людей, преданных Богу и хранящих верность завету с Ним.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקָר
  choice: драгоценна
  rationale: Передаёт значение высокой ценности и значимости, сохраняя при этом возможность понимать слово и в смысле высокой цены; не подразумевает, что Бог радуется смерти.
- source_word: בְּעֵינֵי
  choice: в глазах
  rationale: Сохраняет прозрачный еврейский образ оценки с чьей-либо точки зрения; выражение понятно в современном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הַמָּוְתָה
  choice: смерть
  rationale: Естественно передаёт определённую форму существительного в русском контексте; конечная ה здесь существенно не меняет смысла.
- source_word: לַחֲסִידָיו
  choice: тех, кто верен Ему
  rationale: Передаёт людей, отличающихся верностью, благочестием и преданностью Богу, без возможных позднейших церковных ассоциаций слова «святые».
theological_decisions:
- issue: Смысл утверждения о смерти верных Богу
  choice: Смерть верных Богу драгоценна и имеет большую значимость в Его глазах.
  alternative: Смерть верных Богу дорого обходится Яхве или имеет для Него особый вес.
  rationale: יָקָר допускает оттенки драгоценности, высокой цены и значимости. Основной текст не утверждает, будто Бог находит удовольствие в смерти, и сноска сохраняет присущую еврейскому слову смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия сохраняет акцент исходной строки на слове «драгоценна», а формулировка остаётся понятной обычному читателю.
