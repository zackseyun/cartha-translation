lexical_decisions:
- source_word: כּוֹס
  choice: чаша
  rationale: Слово обозначает сосуд для питья. «Чаша» естественно звучит в возвышенной поэтической речи и сохраняет образ без излишне специального литургического оттенка.
- source_word: יְשׁוּעוֹת
  choice: спасений
  rationale: Сохранено морфологическое множественное число еврейского слова. В данном благодарственном контексте речь идёт о спасительных деяниях Бога; необычная для русского языка форма поддерживает поэтическую выразительность оригинала, а её смысл поясняется в сноске.
- source_word: אֶשָּׂא
  choice: подниму
  rationale: Глагол נשׂא означает «поднимать, нести». При слове «чаша» форма «подниму» естественно передаёт образ вознесения чаши в благодарении.
- source_word: וּבְשֵׁם ... אֶקְרָא
  choice: и призову имя
  rationale: Сочетание קרא בשם обозначает обращение к кому-либо по имени, призывание имени. Русское «призову имя» сохраняет библейский образ и молитвенный смысл выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом; этим сохраняется различие между именем Бога и обозначением «Господь».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон. Передача «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Число существительного יְשׁוּעוֹת
  choice: спасений
  alternative: спасения; избавлений
  rationale: Множественное число оригинала может быть поэтическим или усилительным, но также способно указывать на неоднократные спасительные деяния. Оно сохранено в тексте, а возможность идиоматического понимания пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим порядком слов. Начальная позиция «Чашу спасений» сохраняет акцент еврейской строки; «призову имя Яхве» передаёт библейскую формулу без конфессионально окрашенных добавлений.
