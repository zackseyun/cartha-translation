  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/018.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: ru
  text: Я исполню свои обеты[a] Яхве перед всем его народом.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я воздам Яхве свои обеты».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «перед, на глазах у»; то есть публично, в присутствии всего народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: мои обеты
  rationale: נֶדֶר обозначает обет, данное Богу обещание; форма множественного числа с суффиксом первого лица естественно передаётся как «мои обеты», без излишнего уточнения о приношениях.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает, кому исполняются обеты, а имя יהוה передано как «Яхве», сохраняя личное заветное имя Бога.
- source_word: אֲשַׁלֵּם
  choice: исполню
  rationale: Пиэль глагола שׁלם применительно к обетам означает «исполнить, выполнить»; «исполню» естественно по-русски и не создаёт преимущественно денежного оттенка слова «уплачу».
- source_word: נֶגְדָה־נָּא
  choice: пред
  rationale: נֶגֶד означает «перед, в присутствии, на глазах у». Частица נָא здесь, вероятно, придаёт выразительность; отдельная передача словом «ныне» была бы спорной.
- source_word: לְכָל עַמּוֹ
  choice: всем Его народом
  rationale: В сочетании с «пред» выражение означает публичное исполнение обетов перед всем народом Яхве; местоименный суффикс относится к Яхве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет заветное имя и соответствует предоставленному принципу перевода.
- issue: Характер исполнения обетов
  choice: исполню
  alternative: уплачу
  rationale: Контекст допускает образ «уплаты» обетов, однако русский глагол «исполнить» точнее передаёт выполнение обещанного, не ограничивая смысл денежной платой или жертвенным приношением.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Форма «пред» выбрана как краткая и возвышенная, но понятная; прописная буква в «Его» обозначает отсылку к Яхве.
