base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/008.yaml
  text: For you have delivered my soul from death[a], my eyes from tears[b], my feet from stumbling.
translation:
  language: ru
  text: Ибо Ты избавил душу мою[a] от смерти, глаза мои — от слёз, ногу мою — от падения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жизнь мою». Еврейское не́феш может означать душу, жизнь или самого человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от преткновения». Еврейское слово может обозначать оступание или падение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующей хвалы; «ибо» естественно сохраняет пояснительно-причинную связь и возвышенный поэтический регистр.
- source_word: חִלַּצְתָּ
  choice: Ты избавил
  rationale: Пиэль глагола חלץ означает избавление или спасение от опасности. «Избавил» точно и ёмко выражает действие, подразумеваемое также во втором и третьем членах стиха.
- source_word: נַפְשִׁי
  choice: душу мою
  rationale: נֶפֶשׁ может обозначать душу, жизнь или самого человека. «Душу мою» сохраняет широту еврейского образа и традиционно-поэтическое звучание, не исключая смысла сохранённой жизни.
- source_word: מִמָּוֶת
  choice: от смерти
  rationale: Предлог מן с существительным прямо указывает, от чего произошло избавление; буквальная передача естественна по-русски.
- source_word: אֶת עֵינַי מִן דִּמְעָה
  choice: глаза мои — от слёз
  rationale: Сохраняется лаконичный параллелизм оригинала; тире естественно обозначает пропуск повторяющегося сказуемого «избавил».
- source_word: דִּמְעָה
  choice: слёз
  rationale: Единственное число в еврейском имеет собирательный смысл; русское множественное «слёз» здесь идиоматично.
- source_word: אֶת רַגְלִי מִדֶּחִי
  choice: ногу мою — от падения
  rationale: Сохраняется грамматическое единственное число רַגְלִי. דֶּחִי может обозначать оступание, низвержение или падение; «падение» передаёт итоговый образ утраты опоры, а альтернативный оттенок отмечен в сноске.
theological_decisions:
- issue: Антропологический смысл נַפְשִׁי
  choice: душу мою
  alternative: жизнь мою; меня
  rationale: Поэтический контекст не требует сводить נֶפֶשׁ только к физической жизни. Выбранный вариант сохраняет смысловую широту слова, а возможное значение «жизнь» вынесено в сноску.
- issue: Характер избавления ноги в מִדֶּחִי
  choice: от падения
  alternative: от преткновения; от спотыкания
  rationale: Существительное допускает как образ оступания, так и падения. Основной текст не уточняет механизм опасности сверх исходного образа, а сноска сохраняет его лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Инверсия «душу мою», «глаза мои», «ногу мою» поддерживает трёхчастный параллелизм; тире отмечает эллипсис сказуемого. Обращение к Богу передано с прописной буквы по принятой русской библейской традиции.
