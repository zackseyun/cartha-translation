  text: מָֽה אָשִׁ֥יב לַ/יהוָ֑ה כָּֽל תַּגְמוּל֥וֹ/הִי עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/012.yaml
  text: What shall I return to Yahweh for all his benefits to me?[a]
translation:
  language: ru
  text: Чем воздам Яхве за все Его благодеяния мне?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Чем отплачу Яхве за всё, что Он сделал для меня?» Еврейское слово может обозначать как воздаяния, так и благие деяния; в основном тексте выбрано «благодеяния» ввиду контекста благодарения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: чем
  rationale: В сочетании с глаголом «воздать» русское «чем» естественно передаёт вопрос о том, каким ответным действием псалмопевец может откликнуться на Божью благость.
- source_word: אָשִׁיב
  choice: воздам
  rationale: Хифиль от שוב буквально выражает возвращение или ответное действие. В данном контексте «воздам» сохраняет взаимный оттенок, не утверждая, что Божьи дары можно полностью оплатить.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата действия, а тетраграмматон передан как личное заветное имя «Яхве».
- source_word: כָּל
  choice: все
  rationale: Передаёт полноту совокупности благих действий Бога.
- source_word: תַּגְמוּלוֹהִי
  choice: Его благодеяния
  rationale: Слово может обозначать деяния, воздаяния или оказанные блага. Контекст благодарения поддерживает положительное значение «благодеяния», при этом более широкая возможность отмечена в сноске.
- source_word: עָלָי
  choice: мне
  rationale: В сочетании с «благодеяния» дательный падеж естественно передаёт направленность Божьих благих действий на псалмопевца.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст непосредственно употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Характер ответа человека на Божьи дары
  choice: воздам
  alternative: верну; отплачу
  rationale: «Воздам» выражает ответ на Божьи благодеяния, но не снимает напряжения вопроса и не предполагает, что человек способен равноценно расплатиться с Богом.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Инверсия не используется; краткая вопросительная форма сохраняет ритм и напряжение еврейской строки.
