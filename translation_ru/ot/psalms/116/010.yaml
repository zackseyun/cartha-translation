lexical_decisions:
- source_word: הֶאֱמַנְתִּי
  choice: Я верил
  rationale: Порода hифиль глагола אמן выражает веру или доверие. «Я верил» прямо передаёт форму и сохраняет связь с традиционным восприятием стиха.
- source_word: כִּי
  choice: потому и
  rationale: Частица כִּי многозначна. В данном поэтическом контексте «потому и» естественно связывает веру с речью как следствием, не скрывая иных возможных синтаксических прочтений, отмеченных в сносках.
- source_word: אֲדַבֵּר
  choice: говорил
  rationale: Имперфект допускает контекстуальное прошедшее или обобщённое значение. Прошедшее время согласуется с предшествующим перфектом и естественно звучит по-русски.
- source_word: אֲנִי
  choice: я
  rationale: Самостоятельное местоимение подчёркивает говорящего; в русском его выразительность сохраняется в прямой речи.
- source_word: עָנִיתִי
  choice: угнетён
  rationale: Форма от ענה обозначает состояние страдания, притеснения или унижения. «Угнетён» сохраняет значение тяжёлого бедственного состояния без добавления причины.
- source_word: מְאֹד
  choice: сильно
  rationale: Наречие интенсивности передано современным и естественным русским словом «сильно».
theological_decisions:
- issue: Синтаксическая связь веры и речи
  choice: 'Вера представлена как основание последующей речи, а заключительные слова — как содержание сказанного: «Я верил — потому и говорил: „Я сильно угнетён“».'
  alternative: 'Возможны чтения: «Я верил, ибо говорил: „Я был сильно угнетён“» и «Я верил, даже когда говорил: „Я сильно угнетён“».'
  rationale: Еврейский синтаксис сжат, а частица כִּי допускает несколько связей. Основной текст передаёт естественное следственно-пояснительное прочтение, тогда как подлинная неоднозначность сохранена в сносках без догматического разрешения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Тире передаёт тесную причинно-следственную связь; прямая речь ясно обозначает содержание высказывания. Все сноски имеют маркеры в основном тексте.
