  text: נְ֭דָרַ/י לַ/יהוָ֣ה אֲשַׁלֵּ֑ם נֶגְדָ/ה נָּ֝֗א לְ/כָל עַמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/014.yaml
  text: I will fulfill my vows to Yahweh in the presence of all his people[a][b].
translation:
  language: ru
  text: Я исполню свои обеты Яхве перед всем Его народом[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уплачу свои обеты Яхве». Еврейский глагол может означать «уплатить» в смысле полностью исполнить обещанное по обету.'
    reason: lexical_alternative
  - marker: b
    text: Еврейская частица נָא здесь, вероятно, придаёт словам усиление; её можно также передать словами «ныне» или «воистину».
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדָרַי
  choice: свои обеты
  rationale: Существительное נֶדֶר означает обет, то есть данное Богу обещание; форма множественного числа с суффиксом первого лица передана естественным по-русски сочетанием «свои обеты».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает того, кому даны и перед кем исполняются обеты; имя יהוה передано как «Яхве», сохраняя личное Божье имя исходного текста.
- source_word: אֲשַׁלֵּם
  choice: исполню
  rationale: Пиэль глагола שׁלם в сочетании с «обетами» означает довести обещанное до исполнения, выполнить обязательство. «Исполню» точно и естественно передаёт этот смысл; буквальное «уплачу» возможно, но в современном русском звучит менее ясно.
- source_word: נֶגְדָה
  choice: перед
  rationale: Форма от נֶגֶד указывает на нахождение в присутствии кого-либо и здесь подчёркивает публичность исполнения обетов. «Перед всем Его народом» кратко и естественно передаёт этот смысл.
- source_word: נָא
  choice: не выражено отдельным словом
  rationale: В данном поэтическом контексте частица усиливает решимость говорящего; отдельное «да» или «ныне» могло бы неоправданно сузить её значение. Эмфатический оттенок поддерживается прямым будущим утверждением, а варианты отмечены в сноске.
- source_word: לְכָל עַמּוֹ
  choice: перед всем Его народом
  rationale: Вместе с נֶגְדָה эта фраза обозначает публичных свидетелей исполнения обетов. Местоимение «Его» относится к Яхве.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное имя Бога, не подменяя его титулом.
- issue: Характер исполнения обетов
  choice: исполню свои обеты
  alternative: уплачу свои обеты; принесу обещанные по обету жертвы
  rationale: Текст говорит об исполнении обетов, но не уточняет, обязательно ли оно состоит в жертвоприношении. Перевод не вводит отсутствующую в стихе ритуальную конкретизацию.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и понятным синтаксисом. Сочетание «исполню свои обеты» естественно для религиозно-поэтической речи; «перед всем Его народом» сохраняет публичный характер действия. Неоднозначная частица נָא не получила искусственно однозначного выражения в основном тексте и разъяснена в сноске.
