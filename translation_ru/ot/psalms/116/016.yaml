  text: Прошу[a], Яхве, ведь я Твой раб[b]! Я Твой раб, сын Твоей рабыни. Ты развязал мои путы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «О, Яхве». Еврейская частица выражает настойчивое обращение или мольбу, хотя конкретная просьба в этой строке не названа.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «Твой слуга». Еврейское слово может обозначать как раба, так и слугу; здесь оно выражает полную принадлежность Богу и преданное служение Ему. Слово «ведь» может также передаваться как «ибо».'
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: 'Глагол в основном значении означает «открыть», но в сочетании с «путами» означает «развязать» или «освободить от пут». Возможный более свободный перевод: «Ты освободил меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנָּה
  choice: О
  rationale: Частица выражает сильное чувство и настойчивое обращение. В данном высказывании конкретная просьба не сформулирована, поэтому русское «О» сохраняет эмоциональность, не добавляя отсутствующего в тексте действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כִּי
  choice: воистину
  rationale: Здесь частица естественно понимается как усилительная и подчёркивает последующее признание; возможный причинный оттенок отмечен в сноске.
- source_word: עַבְדֶּךָ / עַבְדְּךָ
  choice: Твой раб
  rationale: «Раб» точно передаёт принадлежность и зависимый статус עבד; в обращении к Богу это также выражение полного посвящения. Повтор сохранён.
- source_word: בֶּן אֲמָתֶךָ
  choice: сын Твоей рабыни
  rationale: Буквально сохраняет родственную формулировку и женскую форму зависимого статуса, подчёркивая принадлежность от рождения.
- source_word: פִּתַּחְתָּ לְמוֹסֵרָי
  choice: Ты развязал мои путы
  rationale: Глагол буквально означает «открыл», но в сочетании с путами обозначает их ослабление или снятие. «Развязал мои путы» сохраняет образ освобождения от оков.
theological_decisions:
- issue: Статус псалмопевца перед Богом
  choice: раб
  alternative: слуга
  rationale: Контекст повторного признания принадлежности и выражение «сын Твоей рабыни» поддерживают более сильное значение зависимого статуса. При этом слово здесь также выражает преданное служение, а не только социальное рабство.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение כִּי
  choice: 'усилительное: «воистину»'
  alternative: 'причинное: «ведь / ибо»'
  rationale: Без явно выраженной просьбы после אנה усилительное прочтение образует цельное русское признание. Однако причинно-пояснительное значение частицы грамматически возможно и не исключается.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Синтаксис краткий и выразительный; повтор исходного текста сохранён. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают традиционный русский молитвенный регистр без архаизации.
