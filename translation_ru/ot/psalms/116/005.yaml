lexical_decisions:
- source_word: חַנּוּן
  choice: благодатен
  rationale: Предикативное прилагательное обозначает благосклонность и готовность являть милость; «благодатен» сохраняет богословскую глубину и возвышенный, но понятный регистр.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет явное употребление заветного имени в еврейском тексте.
- source_word: צַדִּיק
  choice: праведен
  rationale: Передаёт нравственную правоту и справедливость Бога; в контексте хвалы естественнее традиционного варианта «справедлив».
- source_word: אֱלֹהֵינוּ
  choice: Бог наш
  rationale: Сохраняет местоименный суффикс первого лица множественного числа и несколько поэтический порядок слов исходного текста.
- source_word: מְרַחֵם
  choice: милосерден
  rationale: Причастная форма от רחם выражает устойчивое проявление сострадания и милости; краткое прилагательное естественно передаёт здесь предикативный смысл.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Смысл צַדִּיק
  choice: праведен
  alternative: справедлив
  rationale: «Праведен» сохраняет более широкий диапазон нравственной правоты, не исключая смысл справедливости.
- issue: Предикативная форма מְרַחֵם
  choice: милосерден
  alternative: проявляет милость / сострадает
  rationale: Краткое прилагательное передаёт устойчивое качество, тогда как глагольные варианты сильнее подчёркивали бы действие; исходное причастие допускает оба оттенка.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Синтаксический параллелизм и исповедальное «Бог наш» сохранены; пунктуация ясно разделяет две части стиха.
