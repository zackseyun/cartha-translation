  yaml_path: translation/ot/psalms/116/017.yaml
  text: To you I will offer a sacrifice of thanksgiving[a], and I will call on the name of Yahweh.
translation:
  language: ru
  text: Тебе принесу благодарственную жертву и призову имя Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH); в традиционных русских переводах передаётся «Господь». Также встречается передача «Иегова».
    reason: Пояснение передачи тетраграмматона и традиционных вариантов.
lexical_decisions:
- source_word: לְךָ
  choice: Тебе
  rationale: Предлог לְ с местоименным суффиксом указывает на того, кому приносится жертва; дательный падеж естественно передаёт прямое обращение к Богу.
- source_word: אֶזְבַּח זֶבַח תּוֹדָה
  choice: принесу благодарственную жертву
  rationale: Сочетание глагола זבח с זֶבַח תּוֹדָה обозначает принесение благодарственной жертвы. Формулировка сохраняет жертвенный смысл и звучит естественно по-русски.
- source_word: וּבְשֵׁם יְהוָה אֶקְרָא
  choice: и призову имя Яхве
  rationale: Сочетание קרא בשם — устойчивое выражение со значением обращения к Богу, призывания его имени. Русский глагол «призову» передаёт молитвенное обращение без излишнего уточнения его формы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога, обозначенное тетраграмматоном יהוה, передано распространённой научной транслитерацией «Яхве», а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Его передача как «Яхве» сохраняет отличие имени от титула, а сноска сообщает читателю традиционный вариант.
- issue: Значение выражения קרא בשם יהוה
  choice: призову имя Яхве
  alternative: воззову к Яхве; провозглашу имя Яхве
  rationale: Контекст допускает общий смысл молитвенного призывания. Выбранная формулировка сохраняет упоминание «имени» и не сводит выражение ни только к просьбе, ни только к публичному провозглашению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов подчёркивает обращение «Тебе», а параллельные глагольные формы сохраняют поэтическую сжатость стиха.
