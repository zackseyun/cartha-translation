lexical_decisions:
- source_word: אָהַבְתִּי
  choice: Люблю
  rationale: Форма выражает любовь говорящего; самостоятельное «Люблю» сохраняет начальный акцент и допускаемую еврейским текстом синтаксическую напряжённость.
- source_word: כִּי
  choice: когда
  rationale: Здесь союз можно понимать как вводящий содержание или основание любви; «когда» естественно передаёт любовь к тому, что Господь слышит, не добавляя отсутствующего прямого дополнения.
- source_word: יִשְׁמַע
  choice: слышит
  rationale: Имперфект в данном контексте передаёт обычное или продолжающееся действие; настоящее время естественно по-русски.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, уместная для общедоступного библейского текста.
- source_word: קולִי תַּחֲנוּנָי
  choice: мой голос, мои мольбы о милости
  rationale: 'Сохраняется бессоюзное приложение исходного текста: мольбы уточняют содержание голоса; תַּחֲנוּנִים обозначает просьбы о благосклонности или милости.'
theological_decisions:
- issue: Объект любви и значение כִּי
  choice: «Люблю, когда Господь слышит…»
  alternative: «Я люблю Господа, потому что Он слышит…»
  rationale: В масоретском тексте после «люблю» нет выраженного объекта, а כִּי допускает содержательное прочтение. Выбранный вариант следует данной синтаксической форме и не вставляет «Господа» как прямое дополнение, сохраняя при этом возможную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский; краткая, молитвенная и достойная формулировка. Порядок «мой голос, мои мольбы» сохраняет поэтическое уточнение оригинала.
