lexical_decisions:
- source_word: שֹׁמֵר
  choice: хранит
  rationale: Причастие от שׁמר выражает постоянную охрану и заботу. «Хранит» естественно для русского библейского регистра и передаёт продолжающееся действие.
- source_word: פְּתָאיִם
  choice: простодушных
  rationale: Слово обозначает простых, неопытных и незащищённых людей, а не обязательно нравственно глупых. «Простодушных» кратко передаёт эту уязвимость, а примечание сохраняет диапазон значений.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передача личного Божьего имени транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: דַּלּוֹתִי
  choice: я изнемог
  rationale: Форма от דלל описывает состояние ослабления, упадка или унижения. «Я изнемог» естественно выражает достигнутое состояние слабости, не сужая смысл до материальной бедности.
- source_word: וְלִי
  choice: и Он … меня
  rationale: Предлог с местоименным суффиксом указывает на действие в пользу говорящего. В русском это значение естественно выражается личным дополнением «меня» при глаголе «спас».
- source_word: יְהוֹשִׁיעַ
  choice: Он спас меня
  rationale: Порода hифиль глагола ישׁע означает спасти или избавить. «Спас меня» прямо и естественно передаёт личное избавление псалмопевца.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, поэтому транслитерация сохраняет лексическое различие между именем и титулом.
- issue: Характер «простодушных»
  choice: Неопытные и уязвимые, не обязательно нравственно глупые
  alternative: Глупцы в нравственном смысле
  rationale: Значение פְּתָאיִם допускает наивность и недостаток опыта; контекст Божьей охраны не требует нравственно осуждающего прочтения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Краткий параллелизм исходного стиха сохранён; местоимение «Он» написано с прописной буквы как ясная отсылка к Яхве.
