  text: Яхве хранит простодушных[a]. Я был слаб[b], и Он спас меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неопытных», «наивных». Речь идёт о простых и незащищённых людях, не обязательно о нравственно глупых.'
