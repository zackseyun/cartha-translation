lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предыдущего утверждения; «ибо» сохраняет причинно-пояснительную связь и соответствует возвышенному, но понятному регистру псалма.
- source_word: הִטָּה אָזְנוֹ לִי
  choice: Он приклонил ко мне ухо Своё
  rationale: 'Сохраняется еврейский образ внимательного слушания: глагол נטה означает наклонять или обращать, а единственное число «ухо» буквально передаёт источник.'
- source_word: וּבְיָמַי
  choice: и во все дни мои
  rationale: Буквально выражение означает «и в мои дни». Добавление «все» естественно передаёт подразумеваемую продолжительность на протяжении жизни, не заменяя образ прямым толкованием.
- source_word: אֶקְרָא
  choice: я буду взывать к Нему
  rationale: В молитвенном контексте קרא означает призывать или взывать. Местоимение «к Нему» грамматически восполняет очевидный из контекста объект, не выраженный отдельно в еврейском тексте.
theological_decisions:
- issue: Неявный объект глагола אֶקְרָא
  choice: к Нему
  alternative: 'без дополнения: «буду взывать»'
  rationale: Контекст псалма указывает на Господа как на Того, к Кому обращается молящийся; дополнение делает русскую фразу естественной, не вводя конфессионального истолкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Сохранён образ приклонённого уха; инверсия «ухо Своё» придаёт достоинство и остаётся понятной. Маркер сноски поставлен после всего стиха, поскольку поясняет заключительную фразу.
