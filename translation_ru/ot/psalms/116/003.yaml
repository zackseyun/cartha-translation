source:
  edition: WLC
  text: אֲפָפ֤וּ/נִי חֶבְלֵי מָ֗וֶת וּ/מְצָרֵ֣י שְׁא֣וֹל מְצָא֑וּ/נִי צָרָ֖ה וְ/יָג֣וֹן אֶמְצָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/116/003.yaml
  text: The cords of death encircled me[a], and the distresses of Sheol found me; I found trouble and sorrow.
translation:
  language: ru
  text: 'Узы смерти обвили меня,

    теснины Шеола[a] нашли меня;

    беду и скорбь нашёл я.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могилы»; или: «мира мёртвых». Евр. «Шеол».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: обвили меня
  rationale: Глагол передаёт окружение со всех сторон. В сочетании с «узами» вариант «обвили меня» сохраняет конкретный поэтический образ и естественно звучит по-русски.
- source_word: חֶבְלֵי מָוֶת
  choice: узы смерти
  rationale: Слово חֶבֶל означает верёвку или шнур; «узы смерти» сохраняют образ связывающей силы смерти и соответствуют возвышенному, но современному поэтическому регистру.
- source_word: וּמְצָרֵי שְׁאוֹל
  choice: теснины Шеола
  rationale: מֵצַר обозначает тесное, стеснённое место и вызванное им бедствие. «Теснины» сохраняют пространственный образ сдавливающей опасности, не сводя выражение только к отвлечённым «мукам».
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Транслитерация сохраняет многозначное древнееврейское представление о мире мёртвых и не сужает его до отдельной могилы или позднейшего понятия ада.
- source_word: מְצָאוּנִי
  choice: нашли меня
  rationale: Буквальный перевод сохраняет повтор корня מצא с заключительным אֶמְצָא, важный для поэтического строения стиха.
- source_word: צָרָה
  choice: беду
  rationale: צָרָה обозначает беду, несчастье или тяжёлое положение. «Беда» здесь кратка, естественна и хорошо сочетается со «скорбью».
- source_word: וְיָגוֹן
  choice: и скорбь
  rationale: יָגוֹן означает скорбь или печаль. «Скорбь» поддерживает достоинство поэтической речи, не усиливая значение до «отчаяния».
- source_word: אֶמְצָא
  choice: нашёл я
  rationale: Сохранён тот же русский корень, что и в «нашли меня», чтобы передать намеренный повтор еврейского מצא; обратный порядок слов подчёркивает заключительную строку.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: Шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация не навязывает более узкое понимание и сохраняет космологическую и богословскую ёмкость древнееврейского термина; доступные пояснения даны в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Параллелизм и повтор «нашли — нашёл» сохранены; редкое слово «теснины» употреблено осознанно ради образа стеснения, присутствующего в оригинале.
