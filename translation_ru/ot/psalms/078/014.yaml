  text: He led them with a cloud by day[a], and all the night with the light of fire.
translation:
  language: ru
  text: Днём Он вёл их облаком, а всю ночь — светом огня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Он вёл их
  rationale: Глагол נחה в породе Hiphil с суффиксом 3-го лица множественного числа означает «вести, направлять». «Вёл их» естественно и конкретно передаёт Божье водительство.
- source_word: בֶּעָנָן
  choice: облаком
  rationale: 'Предлог ב здесь имеет инструментальное значение: Бог вёл народ посредством облака. Русский творительный падеж кратко и естественно передаёт этот смысл.'
- source_word: יוֹמָם
  choice: днём
  rationale: Наречное употребление со значением «в дневное время»; «днём» образует естественную параллель с выражением «всю ночь».
- source_word: וְכָל הַלַּיְלָה
  choice: а всю ночь
  rationale: Передаёт полноту временного указания «всю ночь». Союз «а» естественно выражает временное сопоставление дня и ночи, не меняя смысла еврейского וְ.
- source_word: בְּאוֹר אֵשׁ
  choice: светом огня
  rationale: Творительный падеж передаёт средство водительства, а сочетание сохраняет оба существительных еврейского выражения и образ огня, дающего свет.
theological_decisions:
- issue: Характер образов водительства в пустыне
  choice: Передать историческое водительство народа облаком и светом огня без дополнительного истолкования.
  alternative: Внести в основной текст типологическое или доктринальное объяснение облака и огня.
  rationale: Стих прямо описывает Божье водительство во время исхода; перевод не должен добавлять богословские выводы, которых нет в самом еврейском тексте.
translation_notes:
  register: Современный литературный русский язык; краткая поэтическая строка с ясным параллелизмом «днём — всю ночь». Заглавная буква в местоимении «Он» соответствует принятому благоговейному библейскому регистру, при этом субъект восстанавливается из контекста.
