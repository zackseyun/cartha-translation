  text: וַ/יְפַתּ֥וּ/הוּ בְּ/פִי/הֶ֑ם וּ֝/בִ/לְשׁוֹנָ֗/ם יְכַזְּבוּ לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/036.yaml
  text: But they flattered him with their mouth[a], and with their tongue they lied to him.
translation:
  language: ru
  text: Но устами своими они льстили Ему[a] и языком своим лгали Ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обманывали Его»; возможен также смысл: «пытались склонить Его». Еврейский глагол допускает эти значения, но здесь, вероятно, речь идёт о льстивой, неискренней речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְפַתּוּהוּ
  choice: льстили Ему
  rationale: Пиэль глагола פתה может обозначать обольщение, введение в заблуждение или попытку склонить кого-либо. В параллели с ложью языка здесь речь, вероятнее всего, о неискренних, угодливых словах, обращённых к Богу; «льстили Ему» естественно передаёт эту мысль, не утверждая, что им удалось обмануть Бога.
- source_word: בְּפִיהֶם
  choice: устами своими
  rationale: Предлог ב обозначает средство действия. «Устами своими» сохраняет конкретный поэтический образ и соответствует возвышенному, но понятному русскому библейскому стилю.
- source_word: וּבִלְשׁוֹנָם
  choice: и языком своим
  rationale: Буквальное «языком» сохраняет параллелизм с «устами» и поэтическую конкретность еврейского текста.
- source_word: יְכַזְּבוּ
  choice: лгали
  rationale: Пиэль כזב прямо обозначает ложь или лживую речь. «Лгали» кратко, ясно и естественно передаёт нравственную оценку текста.
- source_word: לוֹ
  choice: Ему
  rationale: 'Предлог ל с местоименным суффиксом естественнее всего указывает адресата лжи: они лгали Ему, то есть Богу.'
theological_decisions:
- issue: Следует ли понимать стих как утверждение, что люди действительно обманули Бога, или как описание обращённой к Нему неискренней речи.
  choice: Стих описывает льстивую и лживую речь, обращённую к Богу, не утверждая, что Бог был успешно введён в заблуждение.
  alternative: «Они обманывали Его» — более прямое воспроизведение одного из возможных значений פתה, которое может звучать как указание на состоявшийся обман.
  rationale: Контекст говорит о неискреннем обращении Израиля к Богу и его неверности. Выбор «льстили» передаёт манипулятивную направленность речи, сохраняя смысловую напряжённость, но не добавляя отсутствующего в тексте утверждения об успешности обмана.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической формой. Пары «устами своими» и «языком своим» сохраняют еврейский параллелизм; прописное «Ему» ясно указывает на Бога в соответствии с принятой русской библейской практикой.
