  text: They tested God in their heart by asking for food for themselves[a][b].
translation:
  language: ru
  text: Они испытывали Бога в своих сердцах, прося пищи для себя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для их нефеш». Еврейское слово нефеш может означать самого человека, его душу, желание или аппетит; в данном контексте возможен перевод: «прося пищи для утоления своего аппетита».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: испытывали
  rationale: Пиэль глагола נסה означает «испытывать, подвергать испытанию». Здесь речь о дерзкой проверке Бога, а не об искушении Его ко греху.
- source_word: אֵל
  choice: Бога
  rationale: Обычное и естественное русское соответствие божественному наименованию אֵל в данном контексте.
- source_word: בִּלְבָבָם
  choice: в своём сердце
  rationale: Сохраняет еврейское единственное число с собирательным субъектом и передаёт внутреннюю направленность их поступка.
- source_word: לִשְׁאָל
  choice: прося
  rationale: Инфинитив с לְ здесь выражает способ, которым они испытывали Бога; деепричастие естественно передаёт эту связь по-русски.
- source_word: אֹכֶל
  choice: пищи
  rationale: אֹכֶל обозначает пищу вообще; сужать значение до «хлеба» нет оснований.
- source_word: לְנַפְשָׁם
  choice: себе
  rationale: נֶפֶשׁ с местоименным суффиксом может обозначать самого человека, его желание или аппетит. «Себе» близко к форме оригинала и не вводит излишне узкого толкования.
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте требования пищи
  choice: себе
  alternative: для утоления своего аппетита; для своей души
  rationale: Контекст допускает оттенок телесного желания или аппетита, но основное чтение «себе» сохраняет смысловую широту נֶפֶשׁ и не навязывает представление о бесплотной душе. Оттенок аппетита отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Единственное число «в своём сердце» сохраняет собирательный образ еврейского текста; «прося пищи себе» лаконично и естественно передаёт синтаксис оригинала.
