lexical_decisions:
- source_word: וַיַּפֵּל
  choice: И низверг
  rationale: 'Порода hифиль глагола נפל выражает причинное действие: Бог заставил их упасть. В русском переходный глагол «низверг» естественно передаёт это значение и допускает объект, восстанавливаемый из контекста: птиц из предыдущего стиха.'
- source_word: בְּקֶרֶב
  choice: посреди
  rationale: Передаёт внутреннее расположение — в самой середине стана — и сохраняет поэтическую краткость.
- source_word: מַחֲנֵהוּ
  choice: их стана
  rationale: Морфологически суффикс единственного числа означает «его», но относится к Израилю как к собирательному целому; по-русски естественнее множественное «их».
- source_word: סָבִיב
  choice: вокруг
  rationale: Точно и естественно передаёт распределение со всех сторон; дополнительное «повсюду» не требуется.
- source_word: לְמִשְׁכְּנֹתָיו
  choice: их жилищ
  rationale: מִשְׁכָּן здесь обозначает места обитания; «жилища» точнее и шире, чем конкретизирующее «шатры». Предлог לְ в пространственном сочетании с סָבִיב естественно передан русским «вокруг» с родительным падежом.
