    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: маскил
  rationale: Сохранён технический термин надписаний псалмов, поскольку его точное значение не установлено; пояснение дано в сноске.
- source_word: תּוֹרָתִי
  choice: моему наставлению
  rationale: В данном контексте речь идёт о поучении псалмопевца; «наставление» передаёт широкий смысл תּוֹרָה, не сужая его до законодательного текста.
- source_word: הַאֲזִינָה / הַטּוּ אָזְנְכֶם
  choice: Внимай / склоните ухо
  rationale: Сохранены переход от единственного числа при обращении к народу как целому к множественному смыслу и образ наклонённого уха.
- source_word: אִמְרֵי פִי
  choice: словам моих уст
  rationale: Сохранён поэтический телесный образ оригинала в естественной для высокого русского регистра форме.
theological_decisions:
- issue: Значение לְאָסָף в надписании
  choice: Асафа
  alternative: написанный Асафом / для Асафа
  rationale: Родительный оборот сохраняет возможную связь псалма с Асафом, не уточняя без достаточных оснований авторство, посвящение или принадлежность к его традиции.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Формы «внимай» и «склоните ухо» сохраняют риторический параллелизм и заметную смену числа в еврейском тексте.
