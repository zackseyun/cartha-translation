base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/031.yaml
  text: Then the anger of God rose against them[a], and he killed the stoutest among them; he struck down the young men of Israel.
translation:
  language: ru
  text: 'И гнев Божий поднялся против них: он убил самых крепких среди них[a], поверг юношей Израиля.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их тучных»; вероятно, имеются в виду самые крепкие или сильные среди них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַף אֱלֹהִים
  choice: И поднялся… гнев Божий
  rationale: אַף в данном контексте означает «гнев», а начальное וְ передаёт продолжение повествования. Сочетание «гнев Божий» естественно для современного литературного русского языка.
- source_word: עָלָה בָהֶם
  choice: поднялся на них
  rationale: Сохранён образ поднимающегося и обращённого против людей гнева; предлог בְ здесь имеет враждебную направленность.
- source_word: וַיַּהֲרֹג
  choice: Он убил
  rationale: Прямая современная передача глагола הרג без архаизации или смягчения.
- source_word: בְּמִשְׁמַנֵּיהֶם
  choice: самых крепких среди них
  rationale: Буквально выражение обозначает «их тучных»; в контексте суда над народом оно, вероятно, указывает на наиболее крепких, сильных или отборных людей. Буквальный образ указан в сноске.
- source_word: וּבַחוּרֵי יִשְׂרָאֵל
  choice: юношей Израиля
  rationale: בָּחוּר обозначает молодого мужчину в расцвете сил; «юноши» кратко и естественно сохраняет этот смысл.
- source_word: הִכְרִיעַ
  choice: поверг
  rationale: Порода Hiphil глагола כרע означает заставить пасть или склониться. «Поверг» сохраняет образ падения и поэтический параллелизм.
theological_decisions:
- issue: Антропопатическое изображение Божьего гнева
  choice: поднялся на них гнев Божий
  alternative: Бог разгневался на них
  rationale: Выбранный вариант сохраняет еврейский образ поднимающегося гнева и не сводит его к поясняющему пересказу.
- issue: Значение בְּמִשְׁמַנֵּיהֶם
  choice: самых крепких среди них
  alternative: самых тучных среди них
  rationale: Контекст допускает переносное указание на наиболее крепких или отборных людей, однако буквальная телесная образность подлинника сохранена в сноске, поскольку точный оттенок не вполне однозначен.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Сохранены параллелизм и образ поднимающегося гнева; архаизмы не используются.
