lexical_decisions:
- source_word: נֶגֶד
  choice: перед глазами
  rationale: 'Передаёт значение присутствия и видимости: чудеса происходили на виду у отцов. Это естественнее в современном русском, чем буквальное «перед».'
- source_word: אֲבוֹתָם
  choice: их отцов
  rationale: Сохраняет буквальную семейную и заветную лексику еврейского текста; по контексту речь идёт о предках Израиля.
- source_word: עָשָׂה פֶלֶא
  choice: совершил чудеса
  rationale: Глагол עשה с существительным פלא образует выражение о совершении дивных деяний. Множественное число естественно передаёт собирательное значение единственного числа в контексте исхода.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: в земле Египетской
  rationale: Сохраняет явно выраженное слово «земля» и географическую конкретность оригинала, оставаясь понятным и достоинственным русским оборотом.
- source_word: שְׂדֵה צֹעַן
  choice: на полях Цоана
  rationale: Конструкция буквально означает «поле Цоана», но может обозначать поля или местность вокруг города; русский множественный оборот естественно выражает территориальный смысл.
