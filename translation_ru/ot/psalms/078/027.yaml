lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: дождём послал
  rationale: Глагол в породе хифиль означает «послал дождь, излил дождём». Формулировка сохраняет образ дождя и при этом естественно звучит по-русски применительно к ниспосланной пище.
- source_word: עֲלֵיהֶם
  choice: им
  rationale: Буквально предлог означает «на них», однако при русском обороте «послал им дождём» дательный падеж естественно передаёт направленность действия без изменения смысла.
- source_word: כֶּעָפָר
  choice: словно пыль
  rationale: Префикс сравнения כ передан словом «словно»; «пыль» сохраняет образ неисчислимого множества.
- source_word: שְׁאֵר
  choice: мясо
  rationale: Слово может обозначать плоть или мясо. В контексте пищи, данной в пустыне, современное русское «мясо» наиболее ясно и естественно.
- source_word: וּכְחוֹל יַמִּים
  choice: словно песок морей
  rationale: Сохранено множественное число יַמִּים («морей»), а также сравнение, выражающее огромное количество.
- source_word: עוֹף כָּנָף
  choice: крылатых птиц
  rationale: Буквально сочетание означает «птица крыла»; «крылатые птицы» сохраняет образ и звучит понятно в современном литературном русском.
