source:
  edition: WLC
  text: לְמַ֤עַן יֵדְע֨וּ דּ֣וֹר אַ֭חֲרוֹן בָּנִ֣ים יִוָּלֵ֑דוּ יָ֝קֻ֗מוּ וִֽ/יסַפְּר֥וּ לִ/בְנֵי/הֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/006.yaml
  text: so that a later generation might know[a], children yet to be born, and might arise and tell their children,
translation:
  language: ru
  text: чтобы знало грядущее поколение — дети, которым ещё предстояло родиться, — и чтобы они поднялись и рассказали своим детям,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Естественно вводит цель или предполагаемый результат в современном русском языке.
- source_word: יֵדְעוּ
  choice: знало
  rationale: Имперфект после לְמַעַן выражает намеченную цель; русская конструкция с «чтобы» и прошедшей формой передаёт её без добавочной модальности.
- source_word: דּוֹר אַחֲרוֹן
  choice: грядущее поколение
  rationale: Обозначает последующее, будущее поколение, а не обязательно эсхатологически «последнее».
- source_word: בָּנִים יִוָּלֵדוּ
  choice: дети, которым предстояло родиться
  rationale: בָּנִים здесь относится к потомкам в целом, а пассивный имперфект указывает на тех, кто должен был появиться на свет в будущем.
- source_word: יָקֻמוּ
  choice: повзрослев
  rationale: В последовательности поколений קום означает, что ещё не рождённые дети со временем встанут как новое действующее поколение; «повзрослев» естественно передаёт этот контекстуальный смысл, не описывая буквальное вставание.
- source_word: וִיסַפְּרוּ
  choice: рассказали
  rationale: В контексте означает устную передачу следующему поколению того, что было сообщено предками.
- source_word: לִבְנֵיהֶם
  choice: своим детям
  rationale: Мужская форма множественного числа в данном контексте представляет потомство вообще; возвратное «своим» ясно соотносит детей с новым поколением.
theological_decisions:
- issue: Родовое значение בָּנִים / לִבְנֵיהֶם
  choice: «дети» / «своим детям»
  alternative: «сыновья» / «своим сыновьям»
  rationale: Стих говорит о передаче знания между поколениями, а не исключительно по мужской линии; формы мужского рода обозначают потомков в общем смысле.
- issue: Значение דּוֹר אַחֲרוֹן
  choice: «грядущее поколение»
  alternative: «последнее поколение»
  rationale: Контекст поддерживает временное значение последующего поколения и не требует эсхатологического прочтения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Тире выделяют пояснительное приложение «дети, которым предстояло родиться». Строка сохраняет синтаксическую незавершённость стиха в составе более широкого предложения псалма.
