  language: ru
  text: потому что они не верили в Бога и не полагались на Его спасение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶאֱמִינוּ בֵּאלֹהִים
  choice: верили в Бога
  rationale: Предлог ב после הֶאֱמִין здесь естественно передаётся русским «верить в»; это также сохраняет различие со следующим глаголом «полагаться».
- source_word: בָטְחוּ בִּישׁוּעָתוֹ
  choice: полагались на Его спасение
  rationale: בָּטַח выражает доверие и упование; «полагались на» звучит современно и передаёт направленность доверия. יְשׁוּעָה означает спасение или избавление; выбрано более широкое «спасение».
theological_decisions:
- issue: Объект веры в выражении הֶאֱמִינוּ בֵּאלֹהִים
  choice: не верили в Бога
  alternative: не верили Богу
  rationale: Конструкция с ב допускает оттенки веры и доверия, но «верили в Бога» непосредственно отражает предлог и не сливает первую половину стиха с параллельным «не полагались».
translation_notes:
  register: Современный литературный русский язык; сохранён поэтический параллелизм двух близких, но не тождественных выражений. Местоимение «Его» написано с прописной буквы как принятая в русском библейском регистре форма.
