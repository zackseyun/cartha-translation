- source_word: עָוֺן
  choice: беззаконие
  rationale: Сохраняет нравственную сторону понятия עָוֹן, которое может обозначать беззаконие, вину и последствие греха, и естественно сочетается с «искупал».
- source_word: יַשְׁחִית
  choice: губил
  rationale: Передаёт причинение гибели в ходе суда; форма несовершенного вида естественно продолжает описание неоднократного поведения Бога.
- source_word: וְהִרְבָּה
  choice: много раз
  rationale: Конструкция הרבה с инфинитивом указывает на многократность или частоту действия; «много раз» ясно и естественно передаёт эту силу.
- source_word: לְהָשִׁיב אַפּוֹ
  choice: отвращал Свой гнев
  rationale: Сохраняет образ поворота гнева назад или прочь и звучит естественно в возвышенной современной русской речи.
- source_word: יָעִיר
  choice: пробуждал
  rationale: Близко передаёт значение «будить, возбуждать»; в сочетании с яростью сохраняет поэтическую метафору исходного текста.
- source_word: כָּל חֲמָתוֹ
  choice: всей Своей ярости
  rationale: «Всей» точно отражает כָּל, а «ярость» передаёт более сильный оттенок חֵמָה и отличает его от אַף, переведённого как «гнев».
theological_decisions:
- issue: Передача כפר вне явно культового контекста исторического псалма
  choice: искупал беззаконие
  alternative: прощал беззаконие
  rationale: Глагол כפר является обычным термином искупления. Основной текст сохраняет эту богословскую насыщенность, но не уточняет не названный здесь способ искупления; более контекстуально гладкое «прощал» приведено в сноске.
