  text: וַ֭/יִּמְאַס בְּ/אֹ֣הֶל יוֹסֵ֑ף וּֽ/בְ/שֵׁ֥בֶט אֶ֝פְרַ֗יִם לֹ֣א בָחָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/067.yaml
  text: Then he rejected the tent of Joseph[b][a], and he did not choose the tribe of Ephraim.
translation:
  language: ru
  text: И отверг Он шатёр Иосифа[a][b], и не избрал колено Ефрема.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пренебрёг шатром Иосифа».'
    reason: lexical_alternative
  - marker: b
    text: То есть Ефрема как ведущего среди колен, происходящих от Иосифа; далее говорится об избрании Иуды и Сиона.
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּמְאַס
  choice: И отверг Он
  rationale: מָאַס означает «отвергать, презирать, отвернуться». «Отверг» ясно передаёт смысл в историко-заветном контексте, не усиливая оттенок презрения; начальное «и» сохраняет повествовательную связь wayyiqtol.
- source_word: בְּאֹהֶל יוֹסֵף
  choice: шатёр Иосифа
  rationale: אֹהֶל буквально означает «шатёр». Сохранение образа не сводит метонимию заранее ни к дому Иосифа, ни к северному святилищу или племенной области.
- source_word: וּבְשֵׁבֶט אֶפְרַיִם
  choice: колено Ефрема
  rationale: שֵׁבֶט может означать «колено», «жезл» или «скипетр»; рядом с именем Ефрема и в параллели с шатром Иосифа естественно значение племени. «Колено» соответствует принятому литературному библейскому употреблению и понятно современному читателю.
- source_word: לֹא בָחָר
  choice: не избрал
  rationale: בָּחַר означает «выбирать, избирать». «Не избрал» прямо передаёт действие и сохраняет словесную связь с темой Божьего выбора в следующих стихах, не превращая её в специальный догматический термин.
theological_decisions:
- issue: Историко-богословский смысл отвержения Иосифа и неизбрания Ефрема
  choice: Сохранить конкретную речь об отвержении шатра Иосифа и неизбрании колена Ефрема как избранного средоточия святилища и племенной области.
  alternative: Понимать Иосифа и Ефрема как непосредственное символическое обозначение всего Северного царства.
  rationale: Псалом пересказывает историю Израиля, а следующие стихи противопоставляют Ефрему избрание Иуды и Сиона. Конкретные племенные образы еврейского текста следует сохранить, не подменяя их толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Инверсия «отверг Он» поддерживает поэтический ритм; «шатёр» сохраняет исходный образ, а «колено» — точную и привычную для библейского контекста племенную лексику.
