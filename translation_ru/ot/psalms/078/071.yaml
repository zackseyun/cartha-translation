lexical_decisions:
- source_word: מֵאַחַר עָלוֹת
  choice: от овец, кормящих ягнят
  rationale: Оборот означает, что Давид был взят от следования за овцами-матками, кормящими молодняк. Русская формулировка передаёт конкретный пастушеский образ естественнее буквального «из-за кормящих овец».
- source_word: הֱבִיאוֹ
  choice: Он привёл его
  rationale: Каузативная форма глагола בוא обычно означает «привести». Заглавное «Он» ясно указывает на Бога как подразумеваемое подлежащее из предыдущего контекста, а местоимение «его» — на Давида.
- source_word: לִרְעוֹת
  choice: чтобы пасти
  rationale: Глагол רעה сохраняет связь между буквальным пастушеским трудом Давида и его служением народу; «пасти» естественно передаёт царско-пастырскую метафору, не сводя её лишь к кормлению.
- source_word: בְּיַעֲקֹב עַמּוֹ
  choice: Иакова, Свой народ
  rationale: Предлог ב здесь вводит объект пастырского попечения, а «Свой народ» находится в приложении к «Иакову». Пунктуация делает это отношение понятным по-русски.
- source_word: וּבְיִשְׂרָאֵל נַחֲלָתוֹ
  choice: и Израиль, Своё наследие
  rationale: נחלה прямо передаётся словом «наследие», сохраняющим заветные ассоциации и поэтический параллелизм с «Свой народ».
theological_decisions:
- issue: Царско-пастырская метафора призвания Давида
  choice: 'Сохранить явный образ пастырства: «чтобы пасти»'
  alternative: «чтобы вести» или «чтобы заботиться о»
  rationale: Стих намеренно связывает прежний труд Давида среди овец с его последующим служением Израилю. Слово «пасти» сохраняет эту литературную и богословскую связь, не добавляя более поздних доктринальных толкований.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис слегка формальный, но понятный; приложения отмечены запятыми. Заглавные местоимения «Он», «Свой», «Своё» употреблены согласно принятой русской библейской издательской традиции.
