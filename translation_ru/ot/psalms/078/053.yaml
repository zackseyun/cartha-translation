  text: Он вёл их в безопасности, и они не боялись; и море[a] покрыло их врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст говорит просто «море». Стих отсылает к переходу Израиля через море при исходе; возможные уточнения — «Красное море» или «Тростниковое море», однако здесь конкретное название не употреблено.
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: Он вёл их
  rationale: Глагол נחה в породе hифиль означает «вести, направлять»; форма содержит местоименный суффикс 3-го лица множественного числа. «Вёл их» естественно передаёт конкретное движение народа под Божьим водительством.
- source_word: לָבֶטַח
  choice: безопасно
  rationale: בֶּטַח обозначает безопасность и защищённость; предлог ל здесь имеет наречное значение и характеризует то, как Бог вёл народ.
- source_word: וְלֹא פָחָדוּ
  choice: и они не боялись
  rationale: Сохранена простая сочинительная связь с וְ, без добавления причинно-следственного оттенка, которого грамматика прямо не выражает.
- source_word: אֹיְבֵיהֶם
  choice: их врагов
  rationale: Обычный и прозрачный русский эквивалент существительного אוֹיֵב с местоименным суффиксом.
- source_word: כִּסָּה
  choice: покрыло
  rationale: Сохранено конкретное значение глагола כסה — «покрывать», без усиления до «поглотило» или «затопило».
- source_word: הַיָּם
  choice: море
  rationale: В еврейском тексте стоит определённое нарицательное существительное «море», без собственного названия; контекстуально более конкретное наименование в основной текст не внесено.
theological_decisions:
- issue: Историческая отсылка к переходу через море при исходе
  choice: В основном тексте оставлено общее слово «море».
  alternative: «Красное море» или «Тростниковое море»
  rationale: Стих несомненно отсылает к исходу, однако еврейский текст здесь говорит лишь הַיָּם — «море». Перевод не уточняет название сверх того, что выражено в оригинале.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной близостью к синтаксису еврейской поэзии. Повтор союза «и» сохраняет последовательное соединение трёх еврейских предложений; точка с запятой облегчает чтение, не вводя противопоставления.
