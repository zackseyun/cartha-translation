lexical_decisions:
- source_word: בְּנֵי אֶפְרַיִם
  choice: Сыны Ефрема
  rationale: Сохраняет родоплеменной образ еврейского выражения буквально и при этом звучит уместно в поэтическом библейском регистре.
- source_word: נוֹשְׁקֵי
  choice: вооружённые
  rationale: Причастие от נשׁק обозначает вооружённых или снаряжённых для боя; русский эквивалент передаёт военную готовность без уточнения, которого нет в тексте.
- source_word: רוֹמֵי קָשֶׁת
  choice: стреляющие из лука
  rationale: Передаёт второе сжатое причастное выражение непосредственно, не сводя его к существительному «лучники» и сохраняя параллельность двух характеристик.
- source_word: הָפְכוּ
  choice: обратились вспять
  rationale: Сохраняет образ поворота назад и в контексте боя подразумевает отступление, не усиливая смысл до однозначного «бежали».
- source_word: בְּיוֹם קְרָב
  choice: в день битвы
  rationale: Прямое и естественное соответствие временной формуле, сохраняющее торжественный поэтический тон.
