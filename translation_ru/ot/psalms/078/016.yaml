base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/016.yaml
  text: He brought streams out of the rock and made water flow down like rivers[a].
translation:
  language: ru
  text: 'Он вывел из скалы потоки[a]

    и заставил воду течь, словно реки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он вывел из скалы струящиеся воды».'
    reason: Лексически נוֹזְלִים можно передать не существительным «потоки», а более буквально — «струящиеся воды».
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: вывел
  rationale: 'Форма породы hифиль от יצא выражает причинное значение: Бог сделал так, что потоки вышли из скалы. «Вывел» кратко и естественно передаёт это значение.'
- source_word: נוֹזְלִים
  choice: потоки
  rationale: Причастие от נזל обозначает текущее, струящееся. В контексте воды из скалы русское «потоки» ясно и поэтично передаёт образ.
- source_word: מִסָּלַע
  choice: из скалы
  rationale: סלע означает скалу или утёс; определённое «из скалы» естественно отсылает к известному событию в пустыне.
- source_word: וַיּוֹרֶד
  choice: заставил ... течь
  rationale: Форма hифиль от ירד буквально выражает причинённое движение вниз. Применительно к воде «заставил течь» естественно передаёт причинность и движение, не перегружая строку буквальным «низвёл».
- source_word: כַּנְּהָרוֹת
  choice: словно реки
  rationale: Предлог כְּ вводит сравнение, а נְהָרוֹת — множественное число от «река». «Словно реки» сохраняет поэтическое сравнение.
- source_word: מָיִם
  choice: воду
  rationale: Хотя еврейское слово имеет форму множественного числа, оно обычно обозначает воду как вещество; в современном русском здесь естественно единственное число.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением лаконичного поэтического параллелизма. Глагол «вывел» выбран вместо более архаичного «извёл» в основном тексте; причинное значение второй строки передано естественным оборотом «заставил воду течь».
