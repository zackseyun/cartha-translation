base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/061.yaml
  text: He gave his strength to captivity[c][b][a], and his splendor into the hand of the foe.
translation:
  language: ru
  text: 'И отдал Он силу Свою[a] в плен,

    и великолепие Своё — в руки врага[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сила» и «великолепие», вероятно, указывают на ковчег как видимый знак Божьей силы и славы среди Израиля, однако еврейский текст не называет ковчег прямо.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «в руку врага», то есть под его власть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: И отдал Он
  rationale: נתן в данном контексте означает передачу во власть захватчика; «отдал» естественно передаёт повествовательную форму и подразумеваемое предание врагу, не усиливая её до более узкого толкования.
- source_word: לַשְּׁבִי
  choice: в плен
  rationale: שְׁבִי здесь обозначает плен или состояние захваченности. Русское «в плен» идиоматично и сохраняет направительное значение конструкции с ל.
- source_word: עֻזּוֹ
  choice: силу Свою
  rationale: עֹז означает силу, мощь. Буквальный поэтический образ сохранён без прямого отождествления с ковчегом или святилищем.
- source_word: וְתִפְאַרְתּוֹ
  choice: и великолепие Своё
  rationale: תִּפְאֶרֶת может означать великолепие, славу или красоту. «Великолепие» сохраняет широкий смысл и образную параллель с «силой».
- source_word: בְיַד
  choice: в руки
  rationale: Буквальный образ «руки» в русском языке естественно выражает передачу под власть другого; множественное число соответствует устойчивому русскому обороту.
- source_word: צָר
  choice: врага
  rationale: צַר обозначает врага, неприятеля или притеснителя. «Враг» ясно и уместно в возвышенной поэтической речи.
theological_decisions:
- issue: Следует ли прямо отождествить «силу» и «великолепие» с ковчегом, святилищем или явленным присутствием Бога
  choice: Сохранить поэтические выражения без прямого отождествления в основном тексте
  alternative: Перевести или пояснить основной текст как прямую ссылку на ковчег либо святилище
  rationale: Контекст, вероятно, отсылает к захвату ковчега, однако еврейский текст не называет его прямо. Перевод сохраняет метонимию и богословскую напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «силу Свою» и прописное местоимение поддерживают традиционную псалмовую торжественность; смысл при этом остаётся понятным современному читателю.
