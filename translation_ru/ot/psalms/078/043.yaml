lexical_decisions:
- source_word: אֲשֶׁר
  choice: когда
  rationale: В контексте воспоминания о Божьих деяниях (ст. 42–43) относительная частица естественно передаёт временную связь; буквальное «который» по-русски было бы неясным и тяжеловесным.
- source_word: שָׂם
  choice: явил
  rationale: Буквальное значение — «поместил, установил». В сочетании со знамениями русское «явил» естественно выражает их совершение и публичное обнаружение, не сводя их лишь к абстрактному действию.
- source_word: בְּמִצְרַיִם
  choice: в Египте
  rationale: Предлог указывает здесь прежде всего на место. Перевод «против Египта» добавил бы не выраженное прямо направленное значение.
- source_word: אֹתוֹתָיו
  choice: Свои знамения
  rationale: «Знамения» сохраняет смысл знака, указывающего на Божью силу и действие, и не смешивается со следующим מוֹפְתָיו.
- source_word: וּמוֹפְתָיו
  choice: и Свои чудеса
  rationale: «Чудеса» естественно передаёт מוֹפֵת как поразительное сверхъестественное деяние и сохраняет традиционную смысловую пару со «знамениями».
- source_word: בִּשְׂדֵה
  choice: на полях
  rationale: Хотя еврейское существительное стоит в единственном числе, в сочетании с названием города оно обозначает прилегающую местность; русское множественное число звучит естественно.
- source_word: צֹעַן
  choice: Цоана
  rationale: Передано еврейское географическое название транслитерацией; отождествление с Танисом вынесено в примечание.
