    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְעֵם
  choice: он пас их
  rationale: Глагол רעה обозначает выпас и пастырское попечение. В контексте царствования Давида буквальный пастушеский образ важен, поэтому сохранён глагол «пас», а не более общее «руководил».
- source_word: כְּתֹם לְבָבוֹ
  choice: с непорочным сердцем
  rationale: תֹם передаёт цельность, безупречность и нравственную непорочность. Такой перевод естественно выражает характеристику внутреннего расположения Давида; предлог כְּ передан обстоятельственным оборотом «с».
- source_word: לְבָבוֹ
  choice: сердцем
  rationale: לֵבָב обозначает внутреннего человека, включая волю и разум. Слово «сердце» сохраняет исходный образ и понятно современному читателю.
- source_word: וּבִתְבוּנוֹת כַּפָּיו
  choice: умелыми руками
  rationale: תְּבוּנָה означает разумение, проницательность или практическое умение, а כַּפָּיו — его ладони или руки. В сочетании эти слова характеризуют искусное, рассудительное руководство; «умелыми руками» сохраняет телесный образ и звучит естественно по-русски.
- source_word: יַנְחֵם
  choice: направлял их
  rationale: Порода hифиль глагола נחה означает вести или направлять. «Направлял» передаёт осмысленное руководство и хорошо сочетается с образом умелых рук.
theological_decisions:
- issue: Пастырский образ царской власти Давида
  choice: 'Сохранить прямой пастушеский образ: «пас их».'
  alternative: 'Передать более общо: «заботился о них» или «руководил ими».'
  rationale: Стих завершает изображение Давида как избранного Богом пастыря народа. Прямой образ отражает текст и его богословское значение, не добавляя отсутствующих здесь мессианских уточнений.
- issue: Значение выражения כְּתֹם לְבָבוֹ
  choice: 'Передать как нравственную характеристику: «с непорочным сердцем».'
  alternative: «Сообразно непорочности своего сердца» или «с цельным сердцем».
  rationale: תֹם допускает оттенки цельности, безупречности и непорочности. Основной перевод выражает нравственную прямоту, а примечание сохраняет возможное значение предлога כְּ — «сообразно».
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис краток и параллелен еврейскому оригиналу; пастушеский образ и образ рук сохранены без архаизации.
