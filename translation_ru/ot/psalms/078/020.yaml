base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/020.yaml
  text: Look[a], he struck the rock, and waters gushed out, and streams overflowed. Can he also give bread, or provide meat for his people?
translation:
  language: ru
  text: Вот, Он ударил по скале — и полилась вода, хлынули потоки. Сможет ли Он также дать хлеб или приготовить мясо[a] для Своего народа?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плоть»; здесь, вероятно, имеется в виду мясо как пища.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт указательно-эмфатическую силу частицы естественным современным русским словом.
- source_word: הִכָּה צוּר
  choice: ударил по скале
  rationale: Сохраняет конкретное и энергичное описание известного события в пустыне; определённость передана контекстуально формой «скале».
- source_word: וַיָּז֣וּבוּ מַיִם
  choice: полилась вода
  rationale: Естественно передаёт истечение воды из скалы; русское единственное число здесь звучит идиоматичнее еврейского множественного.
- source_word: וּנְחָלִים יִשְׁטֹפוּ
  choice: хлынули потоки
  rationale: Сочетание сохраняет образ обильного, стремительного течения, не уточняя без необходимости географический тип русел.
- source_word: הֲגַם
  choice: Сможет ли Он также
  rationale: Передаёт вопросительную форму, добавочное значение גם и скептическую риторическую силу речи народа.
- source_word: לֶחֶם
  choice: хлеб
  rationale: Сохраняет конкретное значение еврейского слова и его противопоставление мясу.
- source_word: אִם
  choice: или
  rationale: Вводит второй член разделительного риторического вопроса; «или» естественно отражает синтаксическую связь.
- source_word: יָכִין
  choice: приготовить
  rationale: Передаёт значение «приготовить, устроить, обеспечить» и сохраняет образ приготовления пищи, не сводя его только к более общему «дать».
- source_word: שְׁאֵר
  choice: мясо
  rationale: Буквально слово означает плоть, но в данном контексте речь идёт о мясе как пище; этот вариант ясен современному читателю.
- source_word: לְעַמּוֹ
  choice: для Своего народа
  rationale: Передаёт принадлежность народа Богу и естественно звучит в русском историко-заветном контексте.
theological_decisions:
- issue: Риторическая сила сомнения Израиля
  choice: Заключительные слова оформлены как скептический вопрос о способности Бога дать пищу после воды.
  alternative: Передать их нейтральным утверждением или двумя независимыми вопросами.
  rationale: Вопросительная частица и контекст псалма ясно выражают испытующее сомнение; единый разделительный вопрос сохраняет синтаксическую связь хлеба и мяса, не снимая напряжения.
- issue: Значение יָכִין применительно к мясу
  choice: «приготовить мясо»
  alternative: «обеспечить мясом»
  rationale: «Приготовить» ближе к базовому каузативному значению глагола и оставляет открытым способ Божьего обеспечения, тогда как «обеспечить» сильнее истолковывает результат.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным звучанием. Тире подчёркивает очевидный для говорящих факт, а краткие глагольные формы сохраняют движение и напор еврейской поэтической строки.
