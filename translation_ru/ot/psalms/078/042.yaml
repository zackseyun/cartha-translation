    reason: lexical_alternative
lexical_decisions:
- source_word: זָכְרוּ
  choice: не помнили
  rationale: Qal זכר означает «помнить, вспоминать». С отрицанием буквальное «не помнили» точнее передаёт формулировку оригинала, чем более истолковывающее «забыли».
- source_word: יָדוֹ
  choice: Его руки
  rationale: Сохранён конкретный образ руки как обозначение Божьей силы и действия; в русском библейско-поэтическом контексте эта метафора понятна и не требует замены абстрактным словом.
- source_word: יוֹם אֲשֶׁר
  choice: того дня, когда
  rationale: Передаёт временное значение конструкции и естественно связывает упоминание дня с последующим описанием Божьего действия.
- source_word: פָּדָם
  choice: искупил их
  rationale: פדה обозначает выкуп, освобождение ценой выкупа или избавление. «Искупил» сохраняет характерную лексику оригинала и её богословскую насыщенность в контексте исхода, не сводя смысл к общему «спас».
- source_word: מִנִּי צָר
  choice: от врага
  rationale: צָר может означать врага, противника или притеснителя. «От врага» кратко, естественно и соответствует поэтическому контексту.
theological_decisions:
- issue: Метафорическое значение «Его руки»
  choice: Сохранить в основном тексте образ «Его руки».
  alternative: «Его силы» или «того, что Он совершил»
  rationale: 'Оригинал использует конкретную и богословски значимую метафору руки. Её сохранение не навязывает читателю одно истолкование: речь может идти и о силе Бога, и о совершённых Им делах.'
- issue: Значение פדה в контексте исхода
  choice: Перевести «искупил».
  alternative: «выкупил» или «избавил»
  rationale: «Искупил» сохраняет смысл освобождения и традиционную библейскую связь с Божьим действием при исходе, не уточняя способ искупления сверх сказанного в стихе.
- issue: Связь выражения «того дня» с предшествующим образом руки
  choice: Сохранить тесное, несколько напряжённое поэтическое присоединение через тире.
  alternative: Развернуть как «не помнили, что совершила Его рука в тот день»
  rationale: Еврейский текст краток и допускает понимание дня как временного уточнения либо как присоединённого объекта воспоминания. Развёрнутый вариант сделал бы синтаксическое толкование более определённым, чем оригинал.
translation_notes:
  register: Современный литературный русский с сохранением сжатого поэтического строя и библейского образа руки. Местоимение «Его» написано с прописной буквы в соответствии с принятым благоговейным издательским регистром; синтаксическое тире удерживает неоднозначность краткой еврейской конструкции.
