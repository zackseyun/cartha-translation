  text: They did not remember his hand[b][a], the day when he redeemed them from the foe.
translation:
  language: ru
  text: Они не помнили ни Его руки[a], ни дня, когда Он искупил их от врага[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
