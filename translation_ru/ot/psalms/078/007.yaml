lexical_decisions:
- source_word: וְיָשִׂימוּ
  choice: чтобы они возлагали
  rationale: Qal imperfect 3-го лица множественного числа от שׂים, «класть, помещать». Связь с предшествующим контекстом передана целевым союзом «чтобы», а сочетание «возлагать надежду» естественно для современного литературного русского языка.
- source_word: בֵאלֹהִים
  choice: на Бога
  rationale: Предлог ב обозначает того, на кого направлена уверенность; в русском языке нормативно сочетание «возлагать надежду на Бога».
- source_word: כִּסְלָם
  choice: свою надежду[a]
  rationale: כֶּסֶל здесь означает надежду, уверенность или упование. «Надежда» естественно звучит в контексте, а возвратное «свою» ясно соотносит её с подлежащим.
- source_word: וְלֹא יִשְׁכְּחוּ
  choice: не забывали
  rationale: 'Отрицательная форма Qal imperfect от שׁכח продолжает целевую конструкцию: «чтобы… не забывали».'
- source_word: מַעַלְלֵי אֵל
  choice: деяний Бога[b]
  rationale: מַעֲלָלִים обозначает деяния, дела или поступки. «Деяния» сохраняет возвышенный поэтический регистр без архаичности.
- source_word: וּמִצְוֺתָיו
  choice: Его заповеди
  rationale: מִצְוֹת — заповеди, предписания. «Заповеди» сохраняет библейский и заветный смысл; прописная буква в местоимении соответствует принятому уважительному русскому библейскому оформлению.
- source_word: יִנְצֹרוּ
  choice: соблюдали
  rationale: נצר буквально означает «хранить, оберегать»; при дополнении «заповеди» современное русское «соблюдать» точно передаёт практическое исполнение и внимательное хранение.
theological_decisions:
- issue: Передача параллельных божественных наименований אֱלֹהִים и אֵל
  choice: Оба переданы словом «Бог»
  alternative: Передать אֵל как «Сильный» или «Всесильный»
  rationale: В стихе употреблены два распространённых еврейских обозначения Бога, а не имя יהוה. Единая передача не создаёт искусственного богословского различия и сохраняет поэтический параллелизм.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Целевая связь с предыдущим стихом выражена словом «чтобы»; три однородных сказуемых образуют плавный параллелизм.
