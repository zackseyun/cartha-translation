lexical_decisions:
- source_word: יְשַׁלַּח בָּהֶם
  choice: Он наслал на них
  rationale: Пиэль שׁלח выражает намеренное направление бедствия; русское «наслал на них» естественно передаёт и движение, и враждебную направленность בָּהֶם.
- source_word: עָרֹב
  choice: тучи насекомых
  rationale: Точное обозначение этого коллективного существительного неясно; в контексте египетской казни речь идёт о роящихся вредителях. «Тучи насекомых» понятно современному читателю и не сводит значение без достаточных оснований только к мухам.
- source_word: וַיֹּאכְלֵם
  choice: пожиравших их
  rationale: Глагол אכל буквально и образно означает «есть, пожирать»; причастный оборот сохраняет яркость образа и естественно связывается с русским множественным «тучи насекомых».
- source_word: וּצְפַרְדֵּעַ
  choice: и лягушек
  rationale: Еврейское существительное стоит в единственном числе, но употреблено собирательно; по-русски название этой казни естественно передать множественным числом.
- source_word: וַתַּשְׁחִיתֵם
  choice: губивших их
  rationale: שׁחת в данной форме обозначает причинение гибели или разорения. «Губивших» передаёт разрушительное действие, не утверждая непременно полного истребления египтян.
