    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסִיפוּ עוֹד
  choice: Но они продолжали
  rationale: Сочетание каузативной формы יסף с עוֹד передаёт продолжение и повторение действия. «Но» естественно выражает контраст с предшествующими Божьими деяниями, а «продолжали» сохраняет итеративный смысл.
- source_word: לַחֲטֹא לוֹ
  choice: грешить против Него
  rationale: Глагол חטא с предлогом ל здесь означает согрешать против кого-либо; местоимение по контексту относится к Богу.
- source_word: לַמְרוֹת
  choice: восставая против
  rationale: Инфинитив от מרה обозначает неповиновение и мятеж; деепричастный оборот естественно уточняет, в чём проявлялся их грех.
- source_word: עֶלְיוֹן
  choice: Всевышнего
  rationale: Сохраняется традиционный и понятный русский эквивалент божественного титула «Всевышний».
- source_word: בַּצִּיָּה
  choice: в иссохшей земле
  rationale: צִיָּה конкретно обозначает сухую, безводную, иссохшую местность. Такой перевод сохраняет лексический образ, не подменяя его более общим словом «пустыня».
theological_decisions:
- issue: Передача божественного титула עֶלְיוֹן
  choice: Всевышнего
  alternative: Высочайшего
  rationale: «Всевышний» — устойчивый русский божественный титул, сохраняющий смысл превосходства и возвышенности без конфессионального уточнения.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Синтаксический параллелизм стиха сохранён; местоимение «Него» написано с прописной буквы как общепринятое почтительное указание на Бога.
