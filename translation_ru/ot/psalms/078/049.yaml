lexical_decisions:
- source_word: יְשַׁלַּח בָּם
  choice: Он обрушил на них
  rationale: Пиэль שלח с ב в контексте враждебного действия означает направить нечто против кого-либо. «Обрушил на них» естественно передаёт силу и направленность Божьего суда.
- source_word: חֲרוֹן אַפּוֹ
  choice: пыл Своего гнева
  rationale: Сохраняет образ жара, заложенный в еврейской идиоме, и звучит естественно в современной литературной русской речи.
- source_word: עֶבְרָה
  choice: ярость
  rationale: Передаёт сильный, разливающийся гнев и позволяет различить накопленные в строке близкие по смыслу обозначения.
- source_word: וָזַעַם
  choice: негодование
  rationale: Отражает оттенок осуждающего гнева и не сливает слово с предшествующими терминами.
- source_word: וְצָרָה
  choice: и бедствие
  rationale: В данном контексте слово обозначает обрушившееся на людей несчастье или беду, а не только внутреннюю скорбь.
- source_word: מִשְׁלַחַת
  choice: послав
  rationale: Передаёт основное значение «посылание, отправление» и естественно связывает заключительную фразу с перечисленными проявлениями суда.
- source_word: מַלְאֲכֵי רָעִים
  choice: губительных вестников
  rationale: מלאך допускает значение «вестник», а רעים — «несущие бедствие, губительные» наряду с моральным «злые». Такой перевод сохраняет смысл разрушительного суда, не решая однозначно вопрос о природе этих посланцев.
theological_decisions:
- issue: Означает ли מַלְאֲכֵי רָעִים нравственно злых ангелов или посланцев губительного суда
  choice: губительных вестников
  alternative: злых ангелов; ангелов бедствия
  rationale: 'Еврейские слова допускают несколько толкований: מלאך может обозначать вестника или ангела, а רע — нравственное зло либо бедственное, вредоносное действие. Основной текст не утверждает, что Бог послал нравственно злых существ, а примечание сохраняет традиционное и альтернативное прочтения.'
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической интонацией. Накопление близких обозначений гнева сохранено; тире помогают показать, что ярость, негодование и бедствие раскрывают содержание Божьего гнева. Местоимение «Своего» написано с прописной буквы в соответствии с распространённой русской библейской традицией.
