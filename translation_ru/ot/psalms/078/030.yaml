lexical_decisions:
- source_word: זָרוּ
  choice: отошли
  rationale: Глагол זור с предлогом מִן здесь передаёт удаление или отступление от чего-либо. «Не отошли от» естественно звучит по-русски и сохраняет образный характер еврейского выражения.
- source_word: מִתַּאֲוָתָם
  choice: от своей жажды
  rationale: תַּאֲוָה означает сильное желание, вожделение или страстное стремление. В контексте требуемой пищи «жажда» передаёт ненасытное желание, не сужая смысл до обычного физиологического аппетита.
- source_word: עוֹד
  choice: всё ещё
  rationale: 'Наречие указывает на продолжающееся состояние: пища в тот момент ещё оставалась у них во рту.'
- source_word: אָכְלָם
  choice: пища их
  rationale: Форма от אֹכֶל прямо означает «их пища»; порядок слов слегка возвышен и уместен для поэтического регистра.
- source_word: בְּפִיהֶם
  choice: у них во рту
  rationale: Еврейская форма буквально означает «в их рту/устах». Русское «у них во рту» естественно передаёт распределённое значение применительно ко всему народу.
