  text: He remembered that they were flesh[a], a wind that passes and does not return.
translation:
  language: ru
  text: Он вспомнил, что они — плоть, ветер, который уходит и не возвращается.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дыхание, которое уходит и не возвращается». Еврейское רוּחַ может означать «ветер», «дыхание» или «дух»; здесь, вероятнее всего, подчёркнуты быстротечность и хрупкость человеческой жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: Он помнил
  rationale: Форма Qal wayyiqtol от זכר с подразумеваемым из контекста Богом в качестве субъекта. В русском «помнил» естественно передаёт здесь проявленное в повествовании памятование; союз не воспроизводится механически.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, о чём Бог помнил; русское «что» естественно передаёт эту связь.
- source_word: בָשָׂר
  choice: плоть
  rationale: Сохраняет конкретный образ еврейского текста, подчёркивающий человеческую слабость и смертность, не добавляя толкования вроде «смертная» или «немощная».
- source_word: הֵמָּה
  choice: они —
  rationale: 'Самостоятельное местоимение передано русским именным сказуемым с тире: «они — плоть».'
- source_word: רוּחַ
  choice: ветер
  rationale: В данном поэтическом контексте слово обозначает нечто преходящее и неуловимое. «Ветер» хорошо сочетается с последующими глаголами движения, однако возможен и образ «дыхания», отмеченный в сноске.
- source_word: הוֹלֵךְ
  choice: который проходит
  rationale: Причастие выражает движение; «проходит» естественно по-русски передаёт также оттенок кратковременности.
- source_word: וְלֹא יָשׁוּב
  choice: и не возвращается
  rationale: Настоящее время сохраняет обобщённо-поэтический смысл и не усиливает выражение до категорического «никогда не вернётся».
theological_decisions:
- issue: Антропологический образ человеческой бренности
  choice: 'Стих изображает людей слабыми и преходящими: «плоть, ветер, который проходит и не возвращается».'
  alternative: Понять רוּחַ как «дух» и увидеть здесь прямое утверждение об уходе человеческого духа.
  rationale: Поэтический параллелизм сосредоточен на смертности и преходящести. Перевод «ветер» не вносит в строку развитое учение о нематериальном человеческом духе, которого сам контекст не требует; лексическая неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтической сдержанностью. Сохранены конкретные библейские образы «плоть» и «ветер»; синтаксис сделан ясным для обычного читателя без устранения смысловой неоднозначности רוּחַ.
