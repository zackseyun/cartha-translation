  text: וַ/יַּסְגֵּ֣ר לַ/חֶ֣רֶב עַמּ֑/וֹ וּ֝/בְ/נַחֲלָת֗/וֹ הִתְעַבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/062.yaml
  text: He gave his people over to the sword[b][a], and was enraged with his inheritance.
translation:
  language: ru
  text: Он предал Свой народ мечу[a] и прогневался на Своё наследие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдал Свой народ во власть меча».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пришёл в ярость против Своего наследия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: предал
  rationale: Порода хифиль глагола סגר здесь означает передачу кого-либо во власть другого. «Предал» естественно сочетается с «мечу» и сохраняет причинный смысл.
- source_word: לַחֶרֶב
  choice: мечу
  rationale: חֶרֶב буквально означает «меч» и здесь метонимически указывает на насильственную смерть. Сохранение образа меча передаёт поэтическую выразительность еврейского текста.
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: Существительное עַם с местоименным суффиксом третьего лица единственного числа означает «его народ»; возвратное «Свой» ясно соотносит народ с Богом и естественно звучит по-русски.
- source_word: וּבְנַחֲלָתוֹ
  choice: на Своё наследие
  rationale: נַחֲלָה означает «наследие» и служит заветным обозначением Израиля. Предлог ב при глаголе гнева естественно передаётся по-русски предлогом «на».
- source_word: הִתְעַבָּר
  choice: прогневался
  rationale: Форма хитпаэль глагола עבר в данном употреблении выражает сильный гнев. «Прогневался» передаёт интенсивность и соответствует возвышенному, но понятному библейскому регистру.
theological_decisions:
- issue: Передача заветных наименований Израиля
  choice: Свой народ … Своё наследие
  alternative: Свой народ … Своё достояние
  rationale: 'Сохранены оба разных заветных обозначения: народ принадлежит Богу и остаётся Его наследием даже в контексте суда. «Наследие» точнее сохраняет образ נַחֲלָה.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Параллелизм двух полустиший и образ меча сохранены; формулировки понятны без специальной богословской подготовки.
