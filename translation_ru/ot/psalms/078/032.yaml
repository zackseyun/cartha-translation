source:
  edition: WLC
  text: בְּ/כָל זֹ֭את חָֽטְאוּ ע֑וֹד וְ/לֹֽא הֶ֝אֱמִ֗ינוּ בְּ/נִפְלְאוֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/032.yaml
  text: In spite of all this[a], they still sinned and did not believe in his wondrous works.
translation:
  language: ru
  text: Несмотря на всё это, они продолжали грешить и не верили в его чудесные дела.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не доверяли его чудесным делам» или «не верили его чудесным делам». Еврейский глагол может означать и веру, и доверие, а конструкция с предлогом допускает разные оттенки связи с Божьими деяниями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל־זֹאת
  choice: Несмотря на всё это
  rationale: 'Сочетание ב с כָל־זֹאת имеет здесь уступительное значение: народ упорствовал, несмотря на описанные ранее суды и Божью помощь.'
- source_word: חָטְאוּ עוֹד
  choice: продолжали грешить
  rationale: חָטְאוּ означает «грешили», а עוֹד указывает на продолжение прежнего поведения. Русское сочетание естественно передаёт оба элемента.
- source_word: וְלֹא הֶאֱמִינוּ
  choice: и не верили
  rationale: Сохранены простое соединение וְ и отрицание. Порода hифиль глагола אמן допускает значения «верить» и «доверять»; основной вариант не сужает смысл до одного лишь доверия.
- source_word: בְּנִפְלְאוֹתָיו
  choice: в его чудесные дела
  rationale: נִפְלָאוֹת обозначает необычайные, дивные деяния Бога. «Чудесные дела» подчёркивает, что речь идёт не об отвлечённых чудесах, а о совершённых им поступках.
theological_decisions:
- issue: Характер неверия Израиля перед лицом Божьих деяний
  choice: не верили в его чудесные дела
  alternative: не доверяли его чудесным делам; не верили его чудесным делам
  rationale: Еврейский текст говорит о неспособности ответить верой или доверием на уже явленные необычайные деяния Бога. Перевод сохраняет эту смысловую напряжённость и не добавляет объяснений о природе веры, ожесточения или заветной неверности.
translation_notes:
  register: Современный литературный русский язык; ясный и сдержанно возвышенный библейский регистр. Местоимение «его» оставлено со строчной буквы, поскольку почтительное написание с прописной не выражено в еврейском тексте.
