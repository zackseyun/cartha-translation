base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/021.yaml
  text: Therefore Yahweh heard and was enraged[a]; and a fire was kindled against Jacob[c][b], and anger also rose against Israel.
translation:
  language: ru
  text: Поэтому Яхве услышал и разгневался[a]; и огонь возгорелся против Иакова, и против Израиля поднялся гнев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пришёл в ярость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт следствие из предшествующих слов Израиля и естественно звучит в современном русском языке.
- source_word: שָׁמַע
  choice: услышал
  rationale: Прямо передаёт значение глагола; контекст подразумевает, что Яхве обратил внимание на сказанное.
- source_word: יְהוָה
  choice: Яхве
  rationale: Сохраняет личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וַיִּתְעַבָּר
  choice: разгневался
  rationale: Передаёт сильный всплеск гнева, оставаясь естественным и достойным выражением в современном литературном русском.
- source_word: וְאֵשׁ נִשְּׂקָה
  choice: и огонь возгорелся
  rationale: Сохраняет соединительный союз, образ огня и значение возникновения или разгорания огня.
- source_word: בְיַעֲקֹב
  choice: против Иакова
  rationale: Предлог ב в контексте враждебного суда естественно передаётся русским «против»; Иаков обозначает народ завета.
- source_word: וְגַם
  choice: и
  rationale: Русская конструкция с повторным «и» естественно выражает добавочное значение; отдельное «также» сделало бы строку тяжелее.
- source_word: אַף
  choice: гнев
  rationale: Передаёт устойчивое переносное значение слова, буквально связанного с «носом», без ненужной буквальной неясности.
- source_word: עָלָה
  choice: поднялся
  rationale: Сохраняет вертикальный образ исходного глагола и параллелизм с разгоревшимся огнём.
- source_word: בְיִשְׂרָאֵל
  choice: на Израиля
  rationale: Русский оборот «на кого-либо поднялся гнев» естественно выражает направленность враждебного действия и сохраняет образ подъёма.
theological_decisions:
- issue: Сила выражений о Божьем гневе
  choice: Сохранить прямое и сильное «разгневался» и образ поднявшегося гнева.
  alternative: Смягчить до «был недоволен».
  rationale: Еврейский текст подчёркивает гнев Яхве в ответ на неверие и ропот народа; перевод не должен ослаблять эту напряжённость.
- issue: Характер образа огня
  choice: Оставить «огонь возгорелся», не определяя, буквальный он или образный.
  alternative: Явно истолковать огонь только как метафору суда либо только как буквальное пламя.
  rationale: Сам стих не разрешает эту неоднозначность, поэтому перевод сохраняет исходный образ без добавленного толкования.
- issue: Связь между гневом Яхве и огнём
  choice: Сохранить союз «и» и параллельное построение частей стиха.
  alternative: Передать союз причинным «ибо», истолковав огонь как пояснение предшествующего гнева.
  rationale: Простое соединение точнее отражает וְ и не исключает ни последовательного, ни пояснительного оттенка связи.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Повтор союза «и» сохраняет еврейский параллелизм; образы возгоревшегося огня и поднявшегося гнева оставлены без рационализирующего пояснения.
