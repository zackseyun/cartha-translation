lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Он отдал
  rationale: В контексте суда נתן означает не просто передачу, а отдачу урожая на уничтожение; «отдал» естественно передаёт это значение, не усиливая его до «предал».
- source_word: לֶחָסִיל
  choice: саранче-пожирательнице
  rationale: חָסִיל обозначает уничтожающее посевы насекомое, вероятно один из видов или стадий саранчи. Составное обозначение передаёт разрушительный оттенок слова и отличает его от אַרְבֶּה, не заявляя точной зоологической классификации.
- source_word: יְבוּלָם
  choice: их урожай
  rationale: יְבוּל — урожай, плод или произведение земли; в контексте нашествия саранчи естественнее всего современное русское «урожай».
- source_word: וִיגִיעָם
  choice: добытое их трудом
  rationale: יְגִיעַ может обозначать как сам тяжёлый труд, так и его результат. В параллели с «урожаем» здесь вероятен метонимический смысл результата труда; формулировка сохраняет связь и с самим трудом.
- source_word: לָאַרְבֶּה
  choice: саранче
  rationale: אַרְבֶּה — обычное древнееврейское наименование саранчи. Добавление характеристики вроде «роящейся» не требуется самим словом.
