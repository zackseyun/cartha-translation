  text: He gave their produce to the devouring locust[b][a], and their labor to the swarming locust.
translation:
  language: ru
  text: Он отдал их урожай насекомому, уничтожающему посевы[a], а плоды их труда[b] — саранче.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское חָסִיל обозначает насекомое, уничтожающее посевы; возможно, это один из видов или стадий саранчи. Иногда переводится как «гусеница».
    reason: lexical_alternative
  - marker: b
