  yaml_path: translation/ot/psalms/078/059.yaml
  text: God heard and was furious[b][a], and he utterly rejected Israel.
translation:
  language: ru
  text: Бог услышал, разгневался и совершенно отверг Израиль.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַע
  choice: услышал
  rationale: Обычное значение Qal — «слышать»; здесь слово вводит реакцию Бога на поступки Израиля.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: При единственном числе сказуемого форма обозначает Бога Израиля.
- source_word: וַיִּתְעַבָּר
  choice: разгневался
  rationale: Hitpael от עבר в этом контексте выражает сильный гнев. «Разгневался» естественно и достойно звучит по-русски, сохраняя силу исходного выражения без добавления явно не названной причины.
- source_word: וַיִּמְאַס
  choice: отверг
  rationale: מאס означает отвергать, отказываться или пренебрегать; «отверг» точно передаёт действие в контексте заветного суда.
- source_word: מְאֹד
  choice: решительно
  rationale: Наречие сильно усиливает глагол. «Решительно отверг» естественнее по-русски, чем буквальное «очень отверг», и передаёт полноту отвержения.
- source_word: בְּיִשְׂרָאֵל
  choice: Израиль
  rationale: Предлог ב при מאס отмечает объект отвержения; в русском он естественно передаётся прямым дополнением.
theological_decisions:
- issue: Антропопатический язык о Божьем гневе и отвержении
  choice: 'Сохранить сильную личностную формулировку: «разгневался» и «решительно отверг».'
  alternative: Смягчить до «остался недоволен» и «лишил благоволения».
  rationale: Еврейский текст использует сильный язык гнева и суда; его богословское напряжение не следует сглаживать.
translation_notes:
