lexical_decisions:
- source_word: וַיַּמְטֵר
  choice: дождём сыпал
  rationale: Каузативная форма глагола מטר означает «посылать дождём». Выражение «дождём сыпал» естественно по-русски передаёт образ обильного ниспослания сверху.
- source_word: עֲלֵיהֶם
  choice: на них
  rationale: Предлог עַל с местоименным суффиксом здесь имеет пространственно-направительное значение.
- source_word: מָן
  choice: манну
  rationale: «Манна» — общепринятое русское название пищи, данной Израилю в пустыне.
- source_word: לֶאֱכֹל
  choice: чтобы они ели
  rationale: Инфинитив с ל выражает цель; явное подлежащее делает русскую фразу ясной и естественной.
- source_word: דְגַן
  choice: зерно
  rationale: דגן обозначает зерно или хлебные злаки. Буквальное «зерно» сохраняет поэтическую метафору.
- source_word: שָׁמַיִם
  choice: небесное
  rationale: В сочетании דְגַן שָׁמַיִם прилагательное «небесное» естественно передаёт конструкцию принадлежности «зерно небес», не сводя образ к просто пище с неба.
- source_word: נָתַן
  choice: дал
  rationale: Простой и прямой эквивалент общеупотребительного глагола נתן.
- source_word: לָמוֹ
  choice: им
  rationale: Поэтическая местоименная форма означает «им»; русский косвенный объект естественно стоит после глагола.
theological_decisions:
- issue: Метафорическое обозначение манны как «зерна небес»
  choice: небесное зерно
  alternative: пища с неба; хлеб с неба; зерно небес
  rationale: Сохранена метафора דגן, а не подставлено толкование «пища» или образ «хлеба» из родственных контекстов. В основном тексте выбран естественный русский порядок слов, буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической образности. Синтаксис сделан понятным для широкого читателя; метафора исходного текста не истолкована вместо читателя.
