source:
  edition: WLC
  text: לֹ֣א שָׁ֭מְרוּ בְּרִ֣ית אֱלֹהִ֑ים וּ֝/בְ/תוֹרָת֗/וֹ מֵאֲנ֥וּ לָ/לֶֽכֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/010.yaml
  text: They did not keep the covenant of God[a], and they refused to walk in his law.
translation:
  language: ru
  text: 'Они не хранили завета Божьего

    и отказывались жить по Его закону[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставлению». Еврейское слово тора может означать Божий закон, учение или наставление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרוּ
  choice: хранили
  rationale: Глагол שׁמר означает «хранить, соблюдать, беречь». В сочетании с «заветом» русское «хранить завет» естественно для возвышенной поэтической речи и передаёт верность обязательствам завета.
- source_word: בְּרִית אֱלֹהִים
  choice: завета Божьего
  rationale: Сопряжённая конструкция обозначает завет, принадлежащий Богу или установленный Им. Постпозиция определения сохраняет торжественный поэтический строй и остаётся понятной современному читателю.
- source_word: וּבְתוֹרָתוֹ
  choice: по Его закону
  rationale: תּוֹרָה может означать как «закон», так и «наставление». В контексте заветных обязательств «закон» хорошо передаёт нормативную силу; предлог «по» естественно сочетается по-русски с выражением образа жизни.
- source_word: מֵאֲנוּ
  choice: отказывались
  rationale: מאן выражает осознанный отказ или нежелание. Несовершенный вид естественно согласуется с повествованием о повторявшемся поведении народа.
- source_word: לָלֶכֶת
  choice: жить
  rationale: הלך буквально означает «ходить», но здесь метафорически описывает образ поведения. «Жить по Его закону» естественно передаёт этот смысл в современном русском языке, не превращая выражение в пространственный образ.
- source_word: לֹא
  choice: не
  rationale: Прямое отрицание сохранено без смыслового усиления.
theological_decisions:
- issue: Передача תּוֹרָה в контексте завета
  choice: закон
  alternative: наставление
  rationale: Связь с хранением завета подчёркивает обязательную, нормативную сторону תּוֹרָה, поэтому в основном тексте выбрано «закон». Более широкое значение «наставление» сохранено в примечании, чтобы не сужать диапазон еврейского слова.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Перенос строки отражает параллелизм двух частей стиха. Метафора «ходить» передана естественным русским выражением «жить по», а лексическая многозначность תּוֹרָה отмечена в сноске.
