base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/070.yaml
  text: He chose David his servant and took him from the sheepfolds[a].
translation:
  language: ru
  text: 'Он избрал Давида, Своего слугу,

    и взял его из овечьих загонов.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из загонов для мелкого скота»; еврейское выражение может относиться к огороженным местам для овец и коз.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Он избрал
  rationale: Форма Qal wayyiqtol от בחר передаёт последовательное действие в прошлом. «Избрал» естественно для возвышенного поэтического контекста и сохраняет смысл выбора, не добавляя толкования.
- source_word: בְּדָוִד
  choice: Давида
  rationale: Общепринятая русская форма библейского имени; винительный падеж обусловлен управлением глагола «избрал».
- source_word: עַבְדּוֹ
  choice: Своего слугу
  rationale: עבד может означать слугу или раба. Здесь это почётное обозначение Давида как служащего Богу, поэтому «слуга» точнее передаёт функцию слова в контексте. Возвратное «Своего» естественно по-русски при подлежащем «Он».
- source_word: וַיִּקָּחֵהוּ
  choice: и взял его
  rationale: לקח обычно означает «брать». Прямой перевод сохраняет переход Давида от пастушеского занятия к назначенному ему служению, не уточняя направление или цель сверх сказанного.
- source_word: מִמִּכְלְאֹת צֹאן
  choice: из овечьих загонов
  rationale: מִכְלְאֹת обозначает огороженные места для скота, а צֹאן — мелкий скот, прежде всего овец и коз. «Овечьи загоны» — ясное и естественное русское соответствие данного сочетания; более широкое значение отражено в сноске.
theological_decisions:
- issue: Статус Давида как עבד Бога
  choice: Своего слугу
  alternative: Своего раба
  rationale: Слово указывает на принадлежность Давида Богу и служение Ему, но в данном контексте не выдвигает на первый план подневольный статус. «Слуга» сохраняет почётный характер обозначения, не устраняя отношения подчинения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Параллелизм двух еврейских глагольных предложений сохранён; местоимение «Своего» написано с прописной буквы по принятой русской библейской традиции.
