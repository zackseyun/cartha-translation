source:
  edition: WLC
  text: יְפַלֵּ֥ס נָתִ֗יב לְ/אַ֫פּ֥/וֹ לֹא חָשַׂ֣ךְ מִ/מָּ֣וֶת נַפְשָׁ֑/ם וְ֝/חַיָּתָ֗/ם לַ/דֶּ֥בֶר הִסְגִּֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/050.yaml
  text: He leveled a path for his anger[a]; he did not spare their soul from death[c][b], but gave over their life to the plague.
translation:
  language: ru
  text: Он проложил путь Своему гневу[a], не уберёг их жизнь от смерти и предал её мору[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уготовил дорогу Своему гневу».'
    reason: Лексическая альтернатива для פלס и נתיב, сохраняющая буквальный образ выравнивания или приготовления дороги.
  - marker: b
    text: 'Или: «поветрию», «губительной эпидемии».'
    reason: דֶּבֶר обозначает смертоносный мор или эпидемию и не обязательно заболевание, известное как чума.
lexical_decisions:
- source_word: יְפַלֵּס
  choice: проложил
  rationale: Пиэль от פלס означает выровнять или подготовить путь. «Проложил» естественно передаёт целенаправленное открытие пути и сохраняет конкретную поэтическую метафору.
- source_word: נָתִיב
  choice: путь
  rationale: נָתִיב обозначает тропу или путь; в сочетании с «проложил» русское «путь» звучит естественно и сохраняет образ.
- source_word: לְאַפּוֹ
  choice: Своему гневу
  rationale: אַף буквально связано с носом, но идиоматически означает гнев. Возвратное притяжательное «Своему» ясно относит гнев к субъекту действия.
- source_word: לֹא חָשַׂךְ
  choice: не уберёг
  rationale: В данной конструкции חשׂך означает не пощадить, не удержать от чего-либо. «Не уберёг … от смерти» естественно сочетается с отделительным מן.
- source_word: מִמָּוֶת
  choice: от смерти
  rationale: 'Предлог מן имеет прямое отделительное значение: жизнь не была сохранена от смерти.'
- source_word: נַפְשָׁם
  choice: их жизнь
  rationale: נֶפֶשׁ здесь означает смертную жизнь, а не обязательно нематериальную душу. Собирательное единственное число соответствует форме еврейского текста.
- source_word: וְחַיָּתָם
  choice: их
  rationale: חַיָּה здесь обозначает жизнь или живое существование и параллельно נֶפֶשׁ. В русском переводе общий объект «их жизнь» естественно относится к обоим скоординированным действиям без тяжеловесного повтора.
- source_word: לַדֶּבֶר
  choice: чуме
  rationale: דֶּבֶר обозначает губительное поветрие, мор или эпидемию. «Чума» — понятное и сильное русское соответствие, хотя слово не обязательно указывает именно на исторически конкретное заболевание.
- source_word: הִסְגִּיר
  choice: предал
  rationale: Хифиль от סגר может означать отдать или предать во власть. «Предал … чуме» кратко и выразительно передаёт активную передачу на погибель.
theological_decisions:
- issue: Антропоморфный образ Божьего суда
  choice: Сохранить метафору «проложил путь Своему гневу».
  alternative: «Дал волю Своему гневу» или «излил Свой гнев».
  rationale: Еврейский текст изображает гнев как движущийся по приготовленному пути. Сохранение образа передаёт поэтическую силу и не заменяет его богословским толкованием.
- issue: Значение נֶפֶשׁ
  choice: Передать как «жизнь».
  alternative: «душу».
  rationale: В контексте смерти и мора слово обозначает жизнь человека; «душа» могла бы ошибочно направить читателя к вопросу о нематериальной части человека, которого данный стих прямо не рассматривает.
- issue: Связь второй и третьей частей стиха
  choice: 'Передать как два согласованных действия над одной и той же «жизнью»: «не уберёг … и предал».'
  alternative: 'Повторить объект: «не пощадил их душ от смерти, но предал их жизнь чуме».'
  rationale: Еврейский параллелизм использует два близких обозначения жизни. Русская формулировка избегает искусственного различения «души» и «жизни», сохраняя нарастание мысли.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим тоном. Метафора пути сохранена; архаизмы сведены к минимуму. Заглавное «Своему» употреблено по принятой русской библейской традиции для ясной отсылки к Богу.
