  text: וַ/יַּהֲפֹ֣ךְ לְ֭/דָם יְאֹרֵי/הֶ֑ם וְ֝/נֹזְלֵי/הֶ֗ם בַּל יִשְׁתָּיֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/044.yaml
  text: He turned their rivers to blood[a], and their flowing streams[c][b], so that they could not drink.
translation:
  language: ru
  text: Он превратил их реки[a] в кровь, и они не могли пить из своих потоков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рукава Нила»; еврейское слово в повествованиях о Египте часто обозначает Нил, его рукава или каналы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: превратил
  rationale: Глагол הפך обозначает изменение предмета или вещества до иного состояния; «превратил» естественно передаёт результативное значение.
- source_word: לְדָם
  choice: в кровь
  rationale: Предлог לְ указывает на состояние, ставшее результатом изменения; по-русски после «превратил» нормативно и ясно звучит «в кровь».
- source_word: יְאֹרֵיהֶם
  choice: их реки
  rationale: יְאֹר в египетском контексте часто обозначает Нил или его рукава и каналы, но более широкое «реки» сохраняет поэтическое обобщение; египетская конкретизация дана в сноске.
- source_word: וְנֹזְלֵיהֶם
  choice: из своих потоков
  rationale: Слово, связанное с корнем נזל («течь»), обозначает текущие воды или потоки. Конструкция с «из» естественно выражает источник питья, а возвратное «своих» связывает потоки с подразумеваемыми жителями Египта.
- source_word: בַּל יִשְׁתָּיוּן
  choice: они не могли пить
  rationale: Поэтическое отрицание בַּל с имперфектом здесь передаёт практическую невозможность пить воду после её превращения в кровь.
theological_decisions:
- issue: Кто подразумевается под «они» в יִשְׁתָּיוּן
  choice: Сохранено местоименное «они» без прямого называния египтян
  alternative: «египтяне не могли пить»
  rationale: Контекст указывает на жителей Египта, однако сам стих их прямо не называет; перевод не вводит уточнение, отсутствующее в еврейском тексте.
- issue: Синтаксическая связь וְנֹזְלֵיהֶם с отрицательным глаголом
  choice: «они не могли пить из своих потоков»
  alternative: «и их текущие воды — так что они не могли пить»
  rationale: Масоретское членение после יְאֹרֵיהֶם допускает понимание второго полустишия как отдельной конструкции с вынесенным объектом или темой. Русский перевод естественно передаёт потоки как источник воды, не превращая их явно во второй объект глагола «превратил».
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Сохранены две части еврейской строки и явное местоимение «они»; конструкция «пить из своих потоков» выбрана ради естественности и ясности.
