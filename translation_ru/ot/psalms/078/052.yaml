  text: Then he led out his people like sheep, and guided them like a flock in the wilderness.
translation:
  language: ru
  text: И повёл Он Свой народ, как овец, и вёл их, как стадо, по пустыне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּסַּע
  choice: повёл
  rationale: Каузативная форма глагола נסע означает «заставил двинуться, повёл в путь». В контексте исхода «повёл» естественно передаёт начало и направление движения, не добавляя оттенка насильственного изгнания.
- source_word: כַּצֹּאן
  choice: как овец
  rationale: צאן обозначает мелкий скот, прежде всего овец и коз; в пастушеском сравнении естественное русское соответствие — «овец».
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: עַם означает народ как общность; местоименный суффикс указывает на принадлежность Богу. «Свой народ» ясно и естественно передаёт эту связь.
- source_word: וַיְנַהֲגֵם
  choice: вёл их
  rationale: נהג может означать «вести, направлять, гнать». Здесь образ пастуха допускает общее «вёл», которое сохраняет и руководство, и движение стада, не усиливая оттенок принуждения.
- source_word: כָּעֵדֶר
  choice: как стадо
  rationale: עֵדֶר означает стадо; вместе с צאן слово продолжает единый пастушеский образ.
- source_word: בַּמִּדְבָּר
  choice: по пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность. Русское «по пустыне» естественно выражает путь через неё и соответствует контексту исхода.
theological_decisions:
- issue: Образ Бога как пастыря Израиля при исходе
  choice: 'Пастушеские сравнения сохранены прямо: Бог ведёт Свой народ, как овец и как стадо.'
  alternative: Развернуть сравнение в явное утверждение «Он был их пастырем».
  rationale: В еврейском тексте присутствует сравнение, а не прямое именование Бога пастырем. Перевод сохраняет образ и отношения Бога с народом, не привнося дальнейшего богословского развития.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм двух частей стиха сохранён. Прописные буквы в «Он» и «Свой» служат ясности указания на Бога в изолированном стихе.
