  text: וַ/יֹּאכְל֣וּ וַ/יִּשְׂבְּע֣וּ מְאֹ֑ד וְ֝/תַֽאֲוָתָ֗/ם יָבִ֥א לָ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/029.yaml
  text: So they ate and were very full[a], and he brought them what they craved.
translation:
  language: ru
  text: И ели они, и насытились вдоволь, и Он дал им то, чего они жаждали.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их желание» / «то, чего они страстно желали». Еврейское слово может обозначать как само желание, так и то, чего желают.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: и ели они
  rationale: Обычное значение Qal глагола אכל — «есть». Инверсия сохраняет повествовательное движение еврейской цепочки форм и естественно звучит в поэтическом русском тексте.
- source_word: וַיִּשְׂבְּעוּ מְאֹד
  choice: и насытились вдоволь
  rationale: שׂבע обозначает насыщение, а מְאֹד усиливает его степень. «Насытились вдоволь» естественно передаёт полное насыщение без тяжеловесного буквализма.
- source_word: תַאֲוָתָם
  choice: то, чего они жаждали
  rationale: תַּאֲוָה может обозначать как само сильное желание, так и желаемое. В контексте дарованной пищи предметное выражение естественно, при этом «жаждали» сохраняет интенсивность и оценочное напряжение повествования.
- source_word: יָבִא לָהֶם
  choice: Он дал им
  rationale: Hiphil глагола בוא буквально выражает причинение прихода и в данном контексте означает, что Бог доставил или предоставил желаемое. «Дал им» ясно и естественно передаёт результат действия, не вводя нового содержания.
theological_decisions:
- issue: Неявное подлежащее יָבִא
  choice: «Он» с прописной буквы как указание на Бога
  alternative: «Им было дано» или понимание формы как «их желание пришло к ним»
  rationale: В ходе псалма действующим лицом остаётся Бог, дающий пищу; каузативная форма Hiphil поддерживает значение «принёс/дал». Местоимение не добавляет имени, отсутствующего в стихе, но делает неявного деятеля понятным по-русски.
- issue: Абстрактное желание или предмет желания в תַאֲוָתָם
  choice: Предметное выражение «то, чего они жаждали» в основном тексте
  alternative: Более формальное «их желание» или «их страсть»
  rationale: Еврейское существительное допускает обе стороны значения. Контекст получения пищи благоприятствует предметному смыслу, однако неоднозначность сохраняется в сноске и не превращается в однозначное нравственное осуждение.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Синтаксис прост и понятен; «насытились вдоволь» передаёт интенсивность, а «жаждали» сохраняет силу תַּאֲוָה. Маркер сноски поставлен непосредственно после выражения, к которому относится.
