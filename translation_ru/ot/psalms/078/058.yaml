base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/058.yaml
  text: They provoked him to anger with their high places[c][b][a], and with their carved images they made him jealous.
translation:
  language: ru
  text: Они гневили Его своими высотами[a] и своими резными изображениями вызывали в Нём ревность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Высоты» — местные культовые места, часто связанные с неправомерным поклонением и идолопоклонством.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכְעִיסוּהוּ
  choice: Они прогневляли Его
  rationale: Глагол כעס в породе hифиль выражает причинение гнева. «Прогневляли» естественно и кратко передаёт повторяющееся в повествовании действие и его каузативный смысл.
- source_word: בְּבָמוֹתָם
  choice: своими высотами
  rationale: במות — культовые «высоты», то есть местные святилища, здесь связанные с неправомерным поклонением. Предлог ב передан инструментальным «своими».
- source_word: וּבִפְסִילֵיהֶם
  choice: и своими изваяниями
  rationale: פסילים обозначает вырезанные или высеченные культовые изображения. «Изваяния» сохраняет конкретный образ изготовленных предметов поклонения и звучит естественно в современном литературном русском.
- source_word: יַקְנִיאוּהוּ
  choice: возбуждали в Нём ревность
  rationale: Каузатив глагола קנא означает «вызывать ревность, возбуждать ревность». Формулировка сохраняет прямое указание на Божью ревность и не сводит её к общему гневу.
theological_decisions:
- issue: Речь о Божьей ревности
  choice: возбуждали в Нём ревность
  alternative: вызывали Его негодование; возбуждали Его рвение
  rationale: Еврейское קנא применительно к Богу выражает ревность в рамках исключительных отношений завета, нарушаемых идолопоклонством. Прямой перевод сохраняет библейское богословское напряжение и не подменяет ревность менее точным понятием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Его» написано с прописной буквы по принятой русской религиозно-издательской традиции. Параллелизм двух полустиший сохранён; неоднозначность Божьей ревности не устранена.
