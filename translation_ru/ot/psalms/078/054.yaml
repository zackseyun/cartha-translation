  yaml_path: translation/ot/psalms/078/054.yaml
  text: So he brought them to his holy border[d][c][b][a], this mountain that his right hand acquired.
translation:
  language: ru
  text: И привёл Он их в Свои святые пределы[a] — на эту гору[b], которую приобрела[c] Его правая рука.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к границе Своей святыни», «на Свою святую территорию». Еврейское слово может означать границу, пределы или территорию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на этот холм». Возможно, имеется в виду горная область дарованной Израилю земли; в более широком контексте выражение может также напоминать о Сионе.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «обрела во владение», «завоевала», «стяжала». Здесь говорится о том, что Божья правая рука обрела это владение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִיאֵם
  choice: И привёл Он их
  rationale: Форма гифиль от בוא означает «привести». Союз ו передаёт последовательность повествования и естественно выражается русским «и».
- source_word: אֶל גְּבוּל קָדְשׁוֹ
  choice: в Свои святые пределы
  rationale: גְּבוּל может означать границу, пределы или территорию. Множественное «пределы» в современном литературном русском естественно обозначает владение или область, сохраняя связь с образом границы; קָדְשׁוֹ передано притяжательной конструкцией «Свои святые».
- source_word: הַר זֶה
  choice: на эту гору
  rationale: Сохранены указательность и конкретность еврейского выражения. Предлог «на» по-русски естественно продолжает глагол движения и представляет гору как поясняющее наименование святых пределов.
- source_word: קָנְתָה
  choice: стяжала
  rationale: קנה здесь означает приобрести, обрести во владение или завладеть. «Стяжала» — dignified literary wording that avoids implying a commercial purchase while conveying acquisition by power.
- source_word: יְמִינוֹ
  choice: Его правая рука
  rationale: Буквально сохранён антропоморфный образ Божьей правой руки как выражение силы и победы.
theological_decisions:
- issue: К чему относится «эта гора»
  choice: Сохранить буквальное «эту гору», не называя её прямо Сионом или Ханааном.
  alternative: Сион; горная страна Ханаана; земля, данная Израилю
  rationale: Сам стих не уточняет референт. Аппозиционная конструкция связывает гору со святыми пределами Бога, но не требует устранять возможное наложение образов земли и Сиона.
- issue: Смысл приобретения горы Богом
  choice: Передать קנה как «стяжала», то есть обрела во владение.
  alternative: купила; сотворила; завоевала
  rationale: Контекст правой руки указывает на обретение или закрепление владения силой, однако еврейский глагол сам по себе допускает несколько близких оттенков; перевод не вводит ни торгового, ни исключительно творческого смысла.
translation_notes:
  register: Современный литературный русский с поэтической торжественностью. Инверсия «привёл Он» поддерживает псалмовый ритм; «пределы» и «стяжала» возвышенны, но понятны из контекста. Тире подчёркивает пояснительное приложение второго полустишия и не превращает его в отдельное место назначения.
