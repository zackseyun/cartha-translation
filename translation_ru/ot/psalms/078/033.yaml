  text: וַ/יְכַל בַּ/הֶ֥בֶל יְמֵי/הֶ֑ם וּ֝/שְׁנוֹתָ֗/ם בַּ/בֶּהָלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/033.yaml
  text: So he consumed their days in futility[a], and their years in terror.
translation:
  language: ru
  text: И Он погубил их дни в тщете[a], а их годы — в ужасе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Он истратил их дни в пустоте, а их годы — во внезапном смятении».'
    reason: Лексические варианты для כלה («погубил», «истратил»), הֶבֶל («тщета», «пустота») и בֶּהָלָה («ужас», «внезапное смятение»).
lexical_decisions:
- source_word: וַיְכַל
  choice: истощил
  rationale: Форма от כלה допускает значения «закончить, исчерпать, истратить». «Истощил их дни» передаёт активное действие Бога и образ постепенного растрачивания отпущенного времени, не устраняя поэтической напряжённости.
- source_word: בַּהֶבֶל
  choice: в суете
  rationale: הֶבֶל буквально связано с дыханием, паром и обозначает мимолётность, пустоту, тщету. «В суете» естественно для русской библейской поэзии и сохраняет смысл напрасно прожитого времени.
- source_word: יְמֵיהֶם
  choice: их дни
  rationale: Буквальное соответствие сохраняет образ продолжительности жизни и параллелизм с «годами».
- source_word: וּשְׁנוֹתָם
  choice: а их годы
  rationale: «Годы» непосредственно передаёт еврейское слово; союз «а» естественно оформляет параллельную вторую строку в русском стихе.
- source_word: בַּבֶּהָלָה
  choice: в ужасе
  rationale: בֶּהָלָה может обозначать ужас, внезапную тревогу, смятение или поспешность. В контексте Божьего суда «в ужасе» передаёт основную эмоциональную силу слова, тогда как примечание сохраняет оттенок внезапности.
theological_decisions:
- issue: Подразумеваемое подлежащее глагола
  choice: Бог назван местоимением «Он» как совершающий действие
  alternative: 'Безличное: «их дни истощились» или «их дни окончились»'
  rationale: Контекст псалма указывает на Бога как субъекта суда, а форма глагола имеет мужской род единственного числа. Явное «Он» сохраняет божественную субъектность, не добавляя нового богословского содержания.
- issue: Характер завершения жизни
  choice: «истощил их дни»
  alternative: «положил конец их дням»
  rationale: Выбранная формулировка сохраняет возможный оттенок как исчерпания, так и прекращения, не сводя образ исключительно к одномоментному прекращению жизни.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Сохранены параллелизм «дни — годы» и активная роль Бога. «Суета» употреблена в привычном русском библейском смысле тщеты и пустоты; альтернативы раскрыты в примечании.
