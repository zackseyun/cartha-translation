  text: בַּחוּרָ֥י/ו אָֽכְלָה אֵ֑שׁ וּ֝/בְתוּלֹתָ֗י/ו לֹ֣א הוּלָּֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/063.yaml
  text: Fire consumed his young men[a], and his virgins were not praised in song.
translation:
  language: ru
  text: Юношей его пожрал огонь, и дев его не воспевали[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его дев не чествовали». Вероятно, речь об отсутствии свадебных песен из-за постигшего народ разорения.'
    reason: Лексическое выражение допускает общее значение «не прославляли, не чествовали», тогда как контекст, возможно, подразумевает свадебные песни.
lexical_decisions:
- source_word: בַּחוּרָיו
  choice: юношей его
  rationale: בָּחוּר обозначает молодых мужчин в расцвете сил; «юноши» естественно передаёт возраст и сохраняет параллель с «девами».
- source_word: אָכְלָה אֵשׁ
  choice: пожрал огонь
  rationale: При огне как подлежащем אָכַל образно означает «пожирать, уничтожать». «Пожрал» сохраняет олицетворённую и резкую образность еврейского выражения.
- source_word: וּבְתוּלֹתָיו
  choice: и дев его
  rationale: בְּתוּלָה обозначает деву, девушку брачного возраста с оттенком девственности. «Девы» кратко и достойно сохраняет этот смысл и поэтический параллелизм.
- source_word: לֹא הוּלָּלוּ
  choice: не воспевали
  rationale: Пуаль от הלל означает, что их не прославляли или не чествовали песнями. «Не воспевали» сохраняет песенный оттенок, не превращая вероятную связь со свадебными песнями в прямое утверждение.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической лексикой. Инверсия «Юношей его пожрал огонь» сохраняет ударение на погибших юношах; «девы» и «воспевали» уместны для поэзии, оставаясь понятными современному читателю.
