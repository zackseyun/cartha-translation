  text: לֹ֤א נְכַחֵ֨ד מִ/בְּנֵי/הֶ֗ם לְ/ד֥וֹר אַחֲר֗וֹן מְֽ֭סַפְּרִים תְּהִלּ֣וֹת יְהוָ֑ה וֶ/עֱזוּז֥/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר עָשָֽׂה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/004.yaml
  text: We will not hide them from their children[a], telling the coming generation the praiseworthy deeds of Yahweh, and his strength[c][b], and his wonders that he has done.
translation:
  language: ru
  text: Не скроем их от их детей, но расскажем грядущему поколению[b] о славных деяниях Яхве[a], о его могуществе и о чудесах, которые он совершил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о хвалах Яхве». Еврейское слово может обозначать как хвалу, воздаваемую Яхве, так и его достойные хвалы качества или деяния; контекст скорее указывает на последнее.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «последующему поколению»; возможно также: «будущему поколению» или «позднейшему поколению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְכַחֵד
  choice: не скроем
  rationale: Порода пиэль глагола כחד означает скрывать или утаивать; форма первого лица множественного числа передаёт решительное намерение говорящих.
- source_word: מִבְּנֵיהֶם
  choice: от их детей
  rationale: בנים может обозначать сыновей, детей или потомков; в контексте передачи предания между поколениями естественно более широкое «детей».
- source_word: לְדוֹר אַחֲרוֹן
  choice: грядущему поколению
  rationale: Буквально это «последующее/позднейшее поколение»; выбранная формулировка сохраняет направленность в будущее и звучит естественно по-русски.
- source_word: מְסַפְּרִים
  choice: но расскажем
  rationale: 'Причастие описывает, каким образом говорящие не станут скрывать сказанное: они будут рассказывать. Русский личный глагол яснее выражает это противопоставление; союз «но» делает подразумеваемую связь явной.'
- source_word: תְּהִלּוֹת יְהוָה
  choice: о славных деяниях Яхве
  rationale: תהלות может означать как хвалу, воздаваемую Богу, так и достойные хвалы качества или дела. Сочетание с могуществом и совершёнными чудесами склоняет к значению деяний, достойных прославления, но неоднозначность отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: עֱזוּזוֹ
  choice: его могущество
  rationale: Существительное עזוז обозначает силу или мощь; «могущество» естественно в данном возвышенном перечислении.
- source_word: נִפְלְאוֹתָיו
  choice: о чудесах
  rationale: Слово обозначает необычайные, вызывающие изумление деяния; «чудеса» передаёт смысл кратко и ясно.
- source_word: אֲשֶׁר עָשָׂה
  choice: которые он совершил
  rationale: Относительное придаточное относится непосредственно к чудесам; «совершил» соответствует завершённым деяниям и хорошо сочетается со словом «чудеса».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение תְּהִלּוֹת יְהוָה
  choice: славные деяния Яхве
  alternative: хвалы Яхве; достохвальные качества Яхве
  rationale: Параллельное упоминание могущества и совершённых чудес поддерживает объективное значение — то, за что Яхве достоин хвалы. Поскольку форма допускает и понимание «хвалы», оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Личное имя передано как «Яхве»; местоимения, относящиеся к Богу, даны со строчной буквы по обычной современной орфографической практике. Еврейское причастие преобразовано в однородное личное сказуемое ради естественного русского синтаксиса.
