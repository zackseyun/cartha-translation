lexical_decisions:
- source_word: וַיַּךְ
  choice: Он поразил
  rationale: Форма от נכה повествует о прошлом действии. В контексте казни первенцев «поразил» естественно передаёт смертельный удар, не добавляя отдельного глагола «убил».
- source_word: כָּל בְּכוֹר
  choice: всех первенцев
  rationale: כָּל охватывает всю названную группу; «всех первенцев» естественно по-русски и не добавляет отсутствующего в еврейском тексте уточнения «мужского пола».
- source_word: בְּמִצְרָיִם
  choice: в Египте
  rationale: Предлог בְּ обозначает место; перевод сохраняет прямое географическое указание и связь с повествованием об исходе.
- source_word: רֵאשִׁית אֹנִים
  choice: первый плод их мужской силы
  rationale: Поэтическое выражение обозначает первое порождение детородной силы. «Первый плод» передаёт רֵאשִׁית, а «мужская сила» — репродуктивный оттенок אֹנִים; местоимение «их» следует смысловой соотнесённости с жителями Египта.
- source_word: בְּאָהֳלֵי חָם
  choice: в шатрах Хама
  rationale: Сохранён поэтический и родословный образ, обозначающий Египет через Хама; «шатры» буквально и естественно передают אָהֳלֵי.
theological_decisions:
- issue: Поэтическое обозначение Египта именем Хама
  choice: Сохранить «в шатрах Хама» в основном тексте.
  alternative: «среди египтян» или «в жилищах Египта»
  rationale: Первая строка уже прямо называет Египет, а вторая вводит намеренный поэтический и родословный образ. Его сохранение не навязывает дополнительных богословских выводов.
- issue: Смысл выражения רֵאשִׁית אֹנִים
  choice: Передать как «первый плод их мужской силы» и пояснить идиому в сноске.
  alternative: «первенцев их силы» или «начаток их мощи»
  rationale: Контекст указывает на первенцев, но выражение образно связывает их с первым проявлением детородной силы. Перевод сохраняет эту образность и не сводит её к простой тавтологии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой образностью. Синтаксический параллелизм сохранён с помощью тире; архаизмы устранены, но образы «плод» и «шатры Хама» удержаны.
