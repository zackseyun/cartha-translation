  text: וַ֭/יִּבְחַר אֶת שֵׁ֣בֶט יְהוּדָ֑ה אֶֽת הַ֥ר צִ֝יּ֗וֹן אֲשֶׁ֣ר אָהֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/068.yaml
  text: But he chose the tribe of Judah[b][a], Mount Zion which he loved.
translation:
  language: ru
  text: Но[a] он избрал колено Иуды и гору Сион, которую возлюбил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И он избрал».'
    reason: Союз וַ־ продолжает повествование и сам по себе допускает нейтральное «и», хотя контекст поддерживает противопоставительное «но».
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: Но он избрал
  rationale: Глагол בחר означает «избирать, выбирать»; форма с וַ־ продолжает повествование, а в контексте противопоставления отвержению потомков Иосифа в предыдущем стихе естественно передаётся союзом «но».
- source_word: שֵׁבֶט יְהוּדָה
  choice: колено Иуды
  rationale: שֵׁבֶט в данном контексте обозначает одно из колен Израиля; «колено Иуды» — точное и укоренённое в русском библейском языке выражение.
- source_word: הַר צִיּוֹן
  choice: гору Сион
  rationale: Прямое и естественное русское обозначение географического места; винительный падеж обусловлен ролью прямого дополнения.
- source_word: אֲשֶׁר אָהֵב
  choice: которую возлюбил
  rationale: Относительное предложение непосредственно относится к ближайшему существительному «гору»; «возлюбил» сохраняет возвышенный поэтический регистр и значение אָהֵב.
- source_word: אֶת ... אֶת
  choice: колено Иуды и гору Сион
  rationale: Повтор частицы прямого дополнения показывает, что один глагол управляет двумя дополнениями. Союз «и» ясно и естественно передаёт это по-русски, не требуя повторять глагол.
theological_decisions:
- issue: Соотношение избрания Иуды и Сиона
  choice: Представить колено Иуды и гору Сион как два прямых дополнения при одном глаголе «избрал».
  alternative: Понять «гору Сион» как приложение, уточняющее «колено Иуды», либо повторить глагол и представить два отдельно сформулированных акта избрания.
  rationale: Повтор אֶת наиболее прямо указывает на два объекта одного действия. Перевод утверждает избрание Иуды и Сиона, не развивая сверх текста какое-либо учение об избрании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Местоимение «он» дано со строчной буквы в соответствии с исходным текстом и нейтральной современной нормой; «возлюбил» сохраняет достоинство псалмового стиля без архаизации.
