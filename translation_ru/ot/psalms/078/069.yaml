  text: וַ/יִּ֣בֶן כְּמוֹ רָ֭מִים מִקְדָּשׁ֑/וֹ כְּ֝/אֶ֗רֶץ יְסָדָ֥/הּ לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/069.yaml
  text: And he built his sanctuary like the heights[b][a], like the earth that he established forever.
translation:
  language: ru
  text: И построил Он Своё святилище, подобное высотам[a], подобное земле, которую утвердил навеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобное высоким небесам»; или: «подобное горным высотам». Древнееврейское выражение поэтично и может вызывать как небесный, так и горный образ.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которую основал навеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: И построил
  rationale: Форма wayyiqtol от בנה продолжает последовательность повествования; союз «и» и совершенный вид естественно передают следующий завершённый акт.
- source_word: כְּמוֹ רָמִים
  choice: подобное высотам
  rationale: רָמִים обозначает возвышенные высоты. Формулировка сохраняет сжатый поэтический образ, не сводя его однозначно ни к небесам, ни к горам.
- source_word: מִקְדָּשׁוֹ
  choice: Своё святилище
  rationale: מִקְדָּשׁ — святое место, святилище. Это слово не сужает смысл до одного лишь храмового здания; возвратное «Своё» ясно соотносит святилище с подлежащим.
- source_word: כְּאֶרֶץ
  choice: подобное земле
  rationale: В космическом параллелизме אֶרֶץ естественно означает землю, а не отдельную страну. Повтор «подобное» делает обе части сравнения ясными по-русски.
- source_word: יְסָדָהּ
  choice: которую утвердил
  rationale: יסד означает «основывать, закладывать основание, утверждать». «Утвердил» естественно передаёт образ прочности; местоименный суффикс женского рода относится к земле.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Передаёт неограниченную длительность и сохраняет краткость и поэтическую силу древнееврейского выражения.
theological_decisions:
- issue: Образ, с которым сопоставлено святилище
  choice: Святилище уподоблено неопределённым возвышенным «высотам», а затем прочно утверждённой земле.
  alternative: Понять רָמִים конкретно как высокие небеса либо как горные высоты.
  rationale: Древнееврейское выражение поэтически сжато и допускает небесный или горный оттенок. Основной текст сохраняет эту неоднозначность, не делая космологический образ более определённым, чем в источнике.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Инверсия «построил Он» слегка возвышает стиль, не делая его архаичным. Заглавные местоимения в отношении Бога соответствуют принятой русской библейской издательской традиции.
