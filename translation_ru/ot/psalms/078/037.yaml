lexical_decisions:
- source_word: לִבָּם
  choice: их сердце
  rationale: Единственное число с суффиксом 3-го лица множественного числа представляет внутреннюю волю народа собирательно; эта форма естественна и в русском библейском стиле.
- source_word: נָכוֹן
  choice: твёрдо
  rationale: В данном контексте слово обозначает устойчивость и постоянство внутреннего расположения, а не просто правильность.
- source_word: עִמּוֹ
  choice: с Ним
  rationale: Прямое значение предлога — «с»; здесь оно передаёт согласованность и верность в отношениях с Богом.
- source_word: נֶאֶמְנוּ
  choice: не были верны
  rationale: Нифаль от אמן в сочетании с заветом выражает надёжность и верность обязательствам.
- source_word: בִּבְרִיתוֹ
  choice: Его завету
  rationale: Хотя в еврейском употреблён предлог ב («в»), русское прилагательное «верен» нормативно управляет дательным падежом; перевод сохраняет смысл заветной верности.
theological_decisions:
- issue: Верность завету
  choice: Стих говорит о неверности Израиля Богу и Его завету — о непостоянстве воли и отношений.
  alternative: 'Более буквально последнюю часть можно передать: «они не были надёжны в Его завете».'
  rationale: Параллелизм связывает нетвёрдость сердца с отсутствием верности завету. Формулировка не сводит сказанное к интеллектуальному неверию и не привносит более поздних доктринальных категорий.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Собирательное «их сердце» и местоимение «Ним» сохраняют достоинство и структуру еврейского текста; синтаксис остаётся ясным для современного читателя.
