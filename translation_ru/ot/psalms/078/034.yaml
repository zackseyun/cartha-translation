  text: אִם הֲרָגָ֥/ם וּ/דְרָשׁ֑וּ/הוּ וְ֝/שָׁ֗בוּ וְ/שִֽׁחֲרוּ אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/034.yaml
  text: When he killed them[a], they sought him[b]; they returned and sought God earnestly.
translation:
  language: ru
  text: Когда Он убивал их, они искали Его; возвращались и усердно искали Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «искали Бога рано»; это выражение означает ревностный, усердный поиск.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Когда
  rationale: В этом поэтико-историческом контексте частица вводит повторявшееся обстоятельство, а не отвлечённое условие; «когда» естественно передаёт этот смысл.
- source_word: הֲרָגָם
  choice: Он убивал их
  rationale: Глагол прямо означает «убивать». Прописная буква у местоимения помогает распознать подразумеваемого субъекта — Бога — без добавления имени в текст.
- source_word: וּדְרָשׁוּהוּ
  choice: они искали Его
  rationale: דרש с личным дополнением означает искать кого-либо, в данном случае обращаться к Богу; перевод сохраняет местоименное дополнение.
- source_word: וְשָׁבוּ
  choice: возвращались
  rationale: שוב прежде всего значит «возвращаться, обращаться назад». Такой перевод не усиливает выражение до однозначного «каялись», хотя в контексте оттенок покаяния возможен.
- source_word: וְשִׁחֲרוּ
  choice: усердно искали
  rationale: Порода пиэль передаёт настойчивый, ревностный поиск; буквальный образ раннего поиска в современном русском без пояснения может быть неясен.
- source_word: אֵל
  choice: Бога
  rationale: Обычное и естественное соответствие божественному наименованию אֵל в данном контексте.
theological_decisions:
- issue: Следует ли передавать וְשָׁבוּ как явное покаяние
  choice: возвращались
  alternative: каялись; обращались
  rationale: Контекст допускает смысл покаянного обращения, но сам глагол сохраняет более широкий смысл возвращения. Основной текст не превращает возможный богословский оттенок в однозначное утверждение.
translation_notes:
  register: Современный литературный русский язык с поэтической сдержанностью. Несовершенный вид («убивал», «искали», «возвращались») передаёт повторявшуюся в истории народа ситуацию. Синтаксический параллелизм еврейской строки сохранён без архаизмов.
