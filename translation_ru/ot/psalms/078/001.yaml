  text: 'Маскиль Асафа.[a]


    Внимай, народ мой, моему наставлению; склоните ваши уши к словам моих уст.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «маскиль» — специальный термин в заголовках псалмов; оно может обозначать назидательное или созерцательное произведение.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Учение
  rationale: Точный смысл технического термина в заголовках псалмов неясен. «Учение» естественно передаёт вероятную назидательную направленность, а неопределённость отмечена в сноске.
- source_word: לְאָסָף
  choice: Асафа
  rationale: Предлог לְ в надписаниях может обозначать авторство, принадлежность, связь или посвящение. Родительный падеж по-русски идиоматичен и не уточняет эту связь сверх еврейского текста.
- source_word: הַאֲזִינָה
  choice: Внимай
  rationale: Императив призывает не просто услышать, а слушать сосредоточенно; «внимай» сохраняет возвышенный поэтический регистр.
- source_word: עַמִּי
  choice: народ мой
  rationale: Сохраняется явное притяжательное местоимение и прямое обращение без добавления звательной частицы.
- source_word: תּוֹרָתִי
  choice: моему наставлению
  rationale: תּוֹרָה здесь означает наставление или учение, а не только законодательный свод; контекст вводит назидательное повествование.
- source_word: הַטּוּ
  choice: приклоните
  rationale: Глагол буквально выражает наклонение уха ради внимательного слушания; традиционно-поэтическое «приклоните» сохраняет образ.
- source_word: אָזְנְכֶם
  choice: уши ваши
  rationale: Сохранено множественное число еврейского текста и согласование с обращением ко всему народу.
- source_word: לְאִמְרֵי
  choice: к словам
  rationale: «Слова» — ясный и естественный эквивалент, подходящий для параллелизма стиха.
- source_word: פִי
  choice: уст моих
  rationale: Конкретный образ речи из уст сохранён; «уста» поддерживают достойный поэтический регистр и параллель с ушами.
