  text: He split the sea and made them pass through[c][b][a]; he made the waters stand like a heap.
translation:
  language: ru
  text: Он рассёк море и провёл их через него; заставил воды стоять, словно груда.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно насыпь»; еврейское слово обозначает груду, нагромождённую массу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּקַע
  choice: рассёк
  rationale: Глагол означает раскалывать, рассекать или разверзать. «Рассёк» живо и естественно передаёт образ разделённого моря.
- source_word: יָם
  choice: море
  rationale: Существительное в поэтическом контексте указывает на море исхода, но сам стих не уточняет его название.
- source_word: וַיַּעֲבִירֵם
  choice: провёл их через него
  rationale: Каузативная форма выражает то, что Бог дал народу пройти или перевёл его через море; выбранная формулировка естественна по-русски и сохраняет эту направленность действия.
- source_word: וַיַּצֶּב
  choice: поставил
  rationale: Глагол передаёт действие установления или приведения в стоячее, устойчивое положение. «Поставил воды» сохраняет конкретность поэтического образа.
- source_word: מַיִם
  choice: воды
  rationale: Форма и поэтический образ естественно передаются русским множественным числом «воды».
- source_word: כְּמוֹ
  choice: словно
  rationale: Естественный литературный способ выразить прямое сравнение.
- source_word: נֵד
  choice: груду
  rationale: Слово обозначает груду или нагромождённую массу. Такой перевод сохраняет образ скопившихся, вздыбленных вод и не подменяет его более толковательным «стена».
theological_decisions:
- issue: Характер образа чуда у моря
  choice: 'Сохранён конкретный образ: Бог поставил воды словно груду, без объяснения механизма события.'
  alternative: 'Передать описательно: «удержал воды» или истолковать выражение как поэтическую гиперболу.'
  rationale: Еврейский текст изображает действие Бога конкретно и поэтически; перевод не должен ни ослаблять образ пересказом, ни разрешать вопрос о способе совершения чуда.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной поэтической формой. Синтаксический параллелизм двух полустиший сохранён; местоименное «через него» добавлено ради естественности и ясности русского выражения.
