  text: He drove out nations before them and allotted them an inheritance by measuring line[b][a]; he settled the tribes of Israel in their tents.
translation:
  language: ru
  text: Он изгнал перед ними народы, отмерил им наследственный удел мерной верёвкой[a] и поселил племена Израиля в их шатрах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распределил им наследственный удел мерной верёвкой». Еврейский оборот соединяет представления о наследственном земельном уделе и его отмеривании.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в их шатрах»; по смыслу также возможно: «в их жилищах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: изгнал
  rationale: Глагол גרש означает изгнать, прогнать; «изгнал» естественно и точно передаёт принудительное удаление народов.
- source_word: מִפְּנֵיהֶם
  choice: перед ними
  rationale: Буквально «от их лица»; в данном контексте выражение указывает, что народы были удалены перед Израилем.
- source_word: גּוֹיִם
  choice: народы
  rationale: В контексте речь идёт о населявших Ханаан не израильских народах; «народы» не привносит позднейших оттенков слова «язычники».
- source_word: וַיַּפִּילֵם בְּחֶבֶל נַחֲלָה
  choice: отмерил им землю в наследие мерной верёвкой
  rationale: Оборот описывает распределение наследственного земельного удела с помощью мерной верёвки. Добавление слова «землю» делает подразумеваемый объект понятным по-русски, не меняя смысла контекста.
- source_word: וַיַּשְׁכֵּן
  choice: поселил
  rationale: Каузативная форма глагола שכן означает «дал жить, поселил»; «поселил» естественно сохраняет эту каузативность.
- source_word: בְּאָהֳלֵיהֶם
  choice: в их шатрах
  rationale: אהל буквально означает «шатёр». Местоимение «их» сохраняет форму и некоторую референциальную напряжённость еврейского текста.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: племена Израиля
  rationale: Прямой и общепонятный перевод конструкции, обозначающей родоплеменные подразделения Израиля.
theological_decisions:
- issue: Действующее лицо при завоевании и заселении земли
  choice: 'Во всех трёх действиях подразумевается Бог: Он изгнал, отмерил и поселил.'
  alternative: Представить распределение земли как действие самого Израиля.
  rationale: Последовательность глаголов продолжает рассказ псалма о Божьих деяниях ради Израиля; перевод сохраняет это единое действующее лицо, не добавляя более широких богословских выводов.
- issue: Принадлежность шатров
  choice: Сохранить выражение «в их шатрах» без явного уточнения владельцев.
  alternative: Перевести «в шатрах тех народов» или обобщить как «в их жилищах».
  rationale: Еврейское местоимение допускает связь с ранее названными народами, но сам стих не поясняет её отдельно; буквальный образ и референциальная неоднозначность сохранены.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического повествования. Конкретные образы мерной верёвки и шатров сохранены; синтаксис упрощён лишь настолько, насколько требуется для естественного русского звучания.
