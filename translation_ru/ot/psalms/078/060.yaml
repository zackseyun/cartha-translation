source:
  edition: WLC
  text: וַ֭/יִּטֹּשׁ מִשְׁכַּ֣ן שִׁל֑וֹ אֹ֝֗הֶל שִׁכֵּ֥ן בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/060.yaml
  text: So he abandoned the tabernacle of Shiloh[b][a], the tent where he dwelt among mankind.
translation:
  language: ru
  text: И оставил Он скинию в Силоме — шатёр, который поставил среди людей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шатёр, в котором обитал среди людей».'
    reason: Еврейскую фразу можно понимать либо как указание на то, что Бог поставил шатёр среди людей, либо как указание на Его обитание в нём среди людей.
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: оставил
  rationale: Глагол נטשׁ передаёт оставление или покидание. «Оставил» естественно звучит по-русски и сохраняет силу образа Божьего ухода из святилища, не добавляя оттенков отвержения или разрушения.
- source_word: מִשְׁכַּן
  choice: скинию
  rationale: В данном историко-культовом контексте מִשְׁכָּן обозначает священное жилище Бога. «Скиния» сохраняет традиционный и конкретный смысл, а также позволяет отличить это слово от последующего אֹהֶל.
- source_word: שִׁלֹה
  choice: Силоме
  rationale: Название места передано в принятой русской библейской форме; предлог «в» естественно выражает местонахождение скинии.
- source_word: אֹהֶל
  choice: шатёр
  rationale: «Шатёр» сохраняет поэтический параллелизм со «скинией», не сводя два разных еврейских слова к одному русскому обозначению.
- source_word: שִׁכֵּן
  choice: поставил
  rationale: 'Пиэль שִׁכֵּן здесь может иметь каузативно-локативное значение: Бог установил или поместил шатёр среди людей. «Поставил» естественно передаёт эту конструкцию и её вероятную переходность.'
- source_word: בָּאָדָם
  choice: среди людей
  rationale: אָדָם употреблено собирательно и обозначает человечество, а не отдельного мужчину. «Среди людей» точно и естественно передаёт этот смысл в современном русском языке.
theological_decisions:
- issue: Смысл выражения אֹהֶל שִׁכֵּן בָּאָדָם
  choice: «шатёр, который поставил среди людей»
  alternative: «шатёр, в котором обитал среди людей»
  rationale: 'Форма שִׁכֵּן допускает понимание шатра как объекта действия: Бог поставил его среди людей. Вместе с тем контекст Божьего присутствия и древняя традиция перевода допускают понимание фразы как указания на Его обитание среди людей; эта содержательно важная неоднозначность сохранена в примечании.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «оставил Он» поддерживает ритм псалма, а тире ясно обозначает пояснительный параллелизм. Традиционное слово «скиния» сохранено как общеупотребительный библейский термин.
