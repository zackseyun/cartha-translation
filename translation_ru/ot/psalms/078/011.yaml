  text: וַ/יִּשְׁכְּח֥וּ עֲלִילוֹתָ֑י/ו וְ֝/נִפְלְאוֹתָ֗י/ו אֲשֶׁ֣ר הֶרְאָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/011.yaml
  text: They forgot his deeds[b][a], and his wonders that he had shown them.
translation:
  language: ru
  text: Они забыли Его деяния[a] и чудеса[b], которые Он им явил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дела».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дивные дела».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: Они забыли
  rationale: Форма Qal wayyiqtol, 3-е лицо множественного числа, обозначает последовательное действие в прошлом. «Забыли» прямо передаёт значение שׁכח без усиления до «пренебрегли».
- source_word: עֲלִילוֹתָיו
  choice: Его деяния
  rationale: עֲלִילוֹת обозначает совершённые дела или действия. «Деяния» естественно для возвышенного поэтического контекста и достаточно широко передаёт исторические действия Бога.
- source_word: וְנִפְלְאוֹתָיו
  choice: и чудеса
  rationale: Слово от корня פלא указывает на необычайные, дивные действия. «Чудеса» сохраняет краткость и поэтическую силу, хотя в контексте возможно более широкое «дивные дела».
- source_word: אֲשֶׁר
  choice: которые
  rationale: Относительное местоимение вводит придаточное, относящееся непосредственно к «чудесам»; форма множественного числа естественна по-русски.
- source_word: הֶרְאָם
  choice: Он им явил
  rationale: Hiphil perfect 3ms с суффиксом 3mp от ראה буквально означает «дал им увидеть». «Явил им» кратко и достойно передаёт совершённое Богом раскрытие чудес перед народом.
theological_decisions:
- issue: Референт местоименных суффиксов
  choice: 'Прописные «Его» и «Он» указывают на Бога: «Его деяния… Он им явил».'
  alternative: Строчные «его» и «он», формально не уточняющие референта.
  rationale: В контексте псалма суффиксы относятся к Богу, чьи дела Израиль не сохранил в памяти. Прописная буква соответствует принятому русскому библейскому регистру, не добавляя к смыслу текста особого вероучительного толкования.
- issue: Объём значения נִפְלָאוֹת
  choice: «чудеса»
  alternative: «дивные дела»
  rationale: «Чудеса» естественно и ёмко, но не должно пониматься как техническое ограничение лишь нарушениями природного порядка; еврейское слово шире и охватывает вызывающие изумление Божьи действия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим регистром. Порядок фразы сохраняет параллелизм еврейского стиха. Все сноски отмечены в основном тексте.
