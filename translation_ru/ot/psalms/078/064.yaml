base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/064.yaml
  text: His priests fell by the sword[a], and his widows could not weep.
translation:
  language: ru
  text: 'Священники его пали от меча,

    а вдовы его не плакали.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «не плакали». Возможно, бедствие не оставило возможности для обычного траурного плача.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנָיו
  choice: священники его
  rationale: כֹּהֵן обычно обозначает священника; такое соответствие сохраняет конкретное культовое служение и согласуется с контекстом суда над Израилем.
- source_word: בַּחֶרֶב
  choice: от меча
  rationale: Предлог ב здесь указывает на средство или причину гибели. Русское выражение «пали от меча» естественно передаёт боевую гибель и сохраняет образ оригинала.
- source_word: נָפָלוּ
  choice: пали
  rationale: Глагол נפל буквально означает «падать» и в военном контексте подразумевает гибель. «Пали» сохраняет поэтический образ без пояснительной подстановки «были убиты».
- source_word: וְאַלְמְנֹתָיו
  choice: а вдовы его
  rationale: Суффикс имеет форму 3-го лица мужского рода единственного числа. Сингулярное «его» сохраняет олицетворение народа или сообщества, присутствующее в еврейском тексте.
- source_word: לֹא תִבְכֶּינָה
  choice: не оплакали их
  rationale: Буквально форма означает «не плакали». В русском «не оплакали» естественно выражает отсутствие положенного плача по погибшим; добавленное «их» лишь обозначает подразумеваемый объект. Возможный модальный смысл невозможности совершить плач сохранён в сноске.
theological_decisions:
- issue: Смысл отсутствия плача вдов
  choice: Основной текст прямо сообщает, что вдовы не оплакали погибших.
  alternative: Бедствие лишило вдов возможности совершить обычный траурный плач.
  rationale: Еврейское לֹא תִבְכֶּינָה формально означает «не плакали» и само по себе не выражает явно невозможность. Поэтому основной перевод сохраняет прямое утверждение, а вероятный контекстуальный оттенок невозможности вынесен в сноску, не устраняя поэтической неоднозначности.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Инверсия «священники его», «вдовы его» сохраняет параллелизм и необычное единственное число притяжательного суффикса, не становясь архаичной. Союз «а» естественно передаёт переход ко второй строке.
