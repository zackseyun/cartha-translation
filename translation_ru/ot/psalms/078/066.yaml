  text: He struck his foes backward[a]; he put everlasting disgrace on them.
translation:
  language: ru
  text: Он поразил Своих врагов, обратив их вспять[a], и навлёк на них вечный позор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поразил Своих врагов в спину». Еврейское слово אָחוֹר может обозначать направление — «назад, вспять» — либо место нанесённого удара — «в спину».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: поразил
  rationale: Форма от נכה повествует о завершённом действии в прошлом. «Поразил» естественно для возвышенного поэтического регистра и не уточняет без основания, что враги были убиты.
- source_word: צָרָיו
  choice: Своих врагов
  rationale: צָרָיו обозначает его противников или врагов. «Врагов» ясно и естественно в современном русском; прописная буква у местоимения указывает на Бога в соответствии с русской библейской издательской традицией.
- source_word: אָחוֹר
  choice: обратив их вспять
  rationale: Наречное אָחוֹר передаёт движение назад. Русское «обратив их вспять» сохраняет образ поражения и отступления, хотя для естественности явно выражает подразумеваемый результат удара.
- source_word: חֶרְפַּת עוֹלָם
  choice: вечному позору
  rationale: Сочетание означает длительный, непреходящий позор или поношение. «Вечный позор» кратко и понятно передаёт публичное бесчестье, не требуя здесь философского уточнения характера вечности.
- source_word: נָתַן לָמוֹ
  choice: предал их
  rationale: נתן с адресатным ל выражает наложение или назначение участи. «Предал их вечному позору» естественно передаёт смысл, не сохраняя неидиоматичное буквальное «дал им позор».
theological_decisions:
- issue: Референт местоимения в צָרָיו
  choice: «Своих» с прописной буквы, относящееся к Богу
  alternative: «своих» со строчной буквы
  rationale: В ближайшем контексте действующим лицом является Господь; прописная буква — редакционная норма русского библейского текста, а не дополнительное богословское истолкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Сохранены параллелизм и краткость стиха; подлинная двусмысленность אָחוֹר вынесена в сноску.
