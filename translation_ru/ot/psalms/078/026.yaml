base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/026.yaml
  text: He stirred up the east wind in the heavens[b][a], and by his strength he guided the south wind.
translation:
  language: ru
  text: Он поднял восточный ветер в небесах[a] и Своей силой направил южный ветер[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставил восточный ветер двинуться по небесам».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «юг»; по параллели с «восточным ветром» подразумевается южный ветер.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַסַּע
  choice: поднял
  rationale: Хифиль глагола נסע буквально означает «заставить отправиться, двинуться»; применительно к ветру «поднял» естественно выражает приведение ветра в движение и сохраняет Божью действенность.
- source_word: קָדִים
  choice: восточный ветер
  rationale: קָדִים часто обозначает именно восточный ветер; такое значение поддерживается параллельным תֵימָן.
- source_word: בַּשָּׁמָיִם
  choice: в небесах
  rationale: Передаёт формальное множественное число שָׁמַיִם и сохраняет поэтический регистр, хотя по смыслу речь может идти о небе как воздушном пространстве.
- source_word: וַיְנַהֵג
  choice: повёл
  rationale: Глагол נהג может означать «вести, направлять, гнать». «Повёл» кратко и естественно передаёт целенаправленное управление ветром, не уточняя сверх текста способ действия.
- source_word: בְּעֻזּוֹ
  choice: силой Своей
  rationale: Прямо передаёт בְּ как средство действия, עֹז как «сила, мощь» и местоименный суффикс третьего лица.
- source_word: תֵימָן
  choice: южный ветер
  rationale: Буквально слово может означать «юг», но параллелизм с «восточным ветром» и контекст требуют подразумевать ветер; добавление слова «ветер» делает эллипсис ясным по-русски.
theological_decisions:
- issue: Божественное действие в управлении природными силами
  choice: 'Оба глагола переданы как активные действия Бога: Он поднимает и ведёт ветры.'
  alternative: Безличное описание возникновения и движения ветров.
  rationale: Грамматически Бог остаётся субъектом обоих глаголов; перевод сохраняет эту действенность, не добавляя к тексту дальнейших богословских выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Заглавная буква в «Своей» традиционно обозначает отнесённость местоимения к Богу, не меняя содержания оригинала.
