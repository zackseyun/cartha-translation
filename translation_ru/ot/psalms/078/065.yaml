  text: Then the Lord awoke as from sleep[a], like a warrior shouting because of wine.
translation:
  language: ru
  text: Тогда Господь пробудился, словно от сна, словно воин, громко кричащий от вина.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно воин, ликующий от вина» или «словно могучий муж, кричащий от вина». Значение редкой еврейской формы допускает оттенки громкого крика и ликования.'
    reason: Лексическая неоднозначность редкой формы מִתְרוֹנֵן; сноска сохраняет альтернативные значения и вариант передачи גִּבּוֹר.
lexical_decisions:
- source_word: וַיִּקַץ
  choice: пробудился
  rationale: Глагол יקץ означает пробуждение ото сна; «пробудился» естественно звучит по-русски и сохраняет яркий антропоморфный образ.
- source_word: כְּיָשֵׁן
  choice: словно спящий
  rationale: Предлог כְּ вводит сравнение. Буквальное и ясное «словно спящий» не превращает поэтическое уподобление в утверждение о буквальном сне Господа.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Это божественный титул אֲדֹנָי, который в современном литературном русском традиционно и точно передаётся как «Господь».
- source_word: כְּגִבּוֹר
  choice: словно воин
  rationale: Слово גִּבּוֹר обозначает сильного человека, богатыря или воина; в данном контексте «воин» лучше всего сохраняет боевую образность.
- source_word: מִתְרוֹנֵן
  choice: ликующий
  rationale: Редкая форма связана с громким криком или торжествующим возгласом. «Ликующий» естественно сочетается с образом воина и сохраняет возможность понимать действие как громкое радостное восклицание.
- source_word: מִיָּיִן
  choice: от вина
  rationale: Предлог מִן здесь указывает на источник или причину состояния; краткое «от вина» сохраняет образ и не уточняет сверх текста степень опьянения.
theological_decisions:
- issue: Антропоморфное изображение пробуждающегося Бога и сравнение с воином, возбуждённым вином
  choice: Сохранить оба смелых поэтических сравнения без смягчения и поясняющего пересказа.
  alternative: Устранить образ сна или истолковать вино метафорически вне самого сравнения.
  rationale: Стих изображает решительное вмешательство Господа после периода кажущегося бездействия. Перевод должен сохранять поэтическую и богословскую напряжённость исходного текста, а не разрешать её за читателя.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным поэтическим строем. Повтор «словно» воспроизводит параллельные сравнения еврейского текста; антропоморфизм намеренно сохранён.
