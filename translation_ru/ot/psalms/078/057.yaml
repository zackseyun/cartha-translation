  text: וַ/יִּסֹּ֣גוּ וַֽ֭/יִּבְגְּדוּ כַּ/אֲבוֹתָ֑/ם נֶ֝הְפְּכ֗וּ כְּ/קֶ֣שֶׁת רְמִיָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/057.yaml
  text: But they turned back and acted treacherously like their fathers[a]; they turned aside like a deceitful bow.
translation:
  language: ru
  text: Но они отступили и поступили вероломно, как их отцы; уклонились, словно ненадёжный лук.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно обманчивый лук», «словно ослабевший лук» или «словно неисправный лук» — то есть лук, который не посылает стрелу точно в цель.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּגוּ
  choice: отступили
  rationale: Глагол סוג выражает движение назад или отход от прежнего пути. «Отступили» естественно передаёт этот смысл без привнесения поздней богословской терминологии.
- source_word: וַיִּבְגְּדוּ
  choice: поступили вероломно
  rationale: Глагол בגד обозначает вероломство, предательство или нарушение верности. Эта формулировка сохраняет нравственную и relationalную силу глагола, не добавляя прямо не названного объекта действия.
- source_word: כַּאֲבוֹתָם
  choice: как их отцы
  rationale: Еврейский текст прямо говорит «их отцы»; буквальная родственная формулировка уместна и понятна в русском библейском контексте.
- source_word: נֶהְפְּכוּ
  choice: уклонились
  rationale: Форма от הפך здесь описывает поворот или отклонение, раскрываемое сравнением с луком. «Уклонились» естественно передаёт образ отхода от верного направления.
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: словно ненадёжный лук
  rationale: 'רְמִיָּה допускает оттенки обманчивости, слабости или неисправности. В сочетании с «луком» смысловой центр — его ненадёжность: он не посылает стрелу верно. Такой перевод сохраняет образ и звучит естественно по-русски; иные оттенки отмечены в сноске.'
theological_decisions:
- issue: Заветный оттенок неверности Израиля
  choice: Сохранить нравственно сильное «поступили вероломно», не добавляя прямого упоминания Бога или завета.
  alternative: «Оказались неверны» или расширенное «нарушили верность Богу».
  rationale: Контекст псалма связан с неверностью завету, однако в самом стихе объект глагола не назван. Перевод сохраняет подразумеваемую богословскую напряжённость, не превращая её в явное пояснение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм двух частей сохранён; образ лука передан ясно, без излишне буквального олицетворения.
