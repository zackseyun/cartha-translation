lexical_decisions:
- source_word: וַיַּסְגֵּר
  choice: Он предал
  rationale: Глагол סגר здесь означает «отдать, предать во власть» губительной стихии; «предал» естественно и кратко передаёт этот смысл.
- source_word: לַבָּרָד
  choice: граду
  rationale: בָּרָד прямо обозначает град, а предлог ל указывает, во власть чего был отдан скот.
- source_word: בְּעִירָם
  choice: их скот
  rationale: בְּעִיר — собирательное обозначение домашних или рабочих животных; «скот» уместно в сельскохозяйственном контексте.
- source_word: וּמִקְנֵיהֶם
  choice: а их стада
  rationale: מִקְנֶה обозначает домашний скот как имущество. «Стада» сохраняет отличие от первого параллельного обозначения, не преувеличивая его.
- source_word: לָרְשָׁפִים
  choice: огненным стрелам
  rationale: רְשָׁפִים может обозначать пылающие или сверкающие губительные силы, вероятно молнии в контексте бури с градом. «Огненные стрелы» сохраняет образность и лексическую неоднозначность еврейского слова.
