  - marker: b
    text: 'Или: «чей дух не был твёрд с Богом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יִהְיוּ
  choice: чтобы они не были
  rationale: Продолжает целевую конструкцию предыдущего стиха и естественно передаёт её отрицательную направленность.
- source_word: כַאֲבוֹתָם
  choice: подобны своим отцам
  rationale: Сохраняет прямое значение «отцы» и межпоколенческое противопоставление псалма.
- source_word: דּוֹר
  choice: поколение
  rationale: Обычное значение слова в данном контексте; повтор сохранён как элемент поэтической структуры.
- source_word: סוֹרֵר וּמֹרֶה
  choice: упрямому и мятежному
  rationale: Передаёт как внутреннее упорство и уклонение, так и деятельное сопротивление; сочетание звучит ясно и достойно в современном русском языке.
- source_word: הֵכִין לִבּוֹ
  choice: не утвердило своего сердца
  rationale: Сохраняет образ внутренней устойчивости и решимости, не сводя смысл только к размышлению или намерению.
- source_word: לִבּוֹ
  choice: своего сердца
  rationale: Сохраняет библейскую антропологическую лексику, где сердце обозначает внутреннюю волю и расположение человека.
- source_word: נֶאֶמְנָה אֶת אֵל רוּחוֹ
  choice: чей дух не был верен Богу
  rationale: Передаёт внутреннюю ненадёжность и отсутствие верности по отношению к Богу, сохраняя отдельное упоминание духа.
theological_decisions:
- issue: Соотношение «сердца» и «духа»
  choice: Сохранить оба понятия как различающиеся обозначения внутреннего человека.
  alternative: Объединить их в одно понятие, например «душа» или «внутренний мир».
  rationale: Еврейский текст намеренно употребляет два слова; их сохранение не сглаживает поэтическое и богословское напряжение.
- issue: Отношение верности, выраженное אֶת אֵל
  choice: «верен Богу»
  alternative: «твёрд с Богом» или «стоек перед Богом»
  rationale: Так естественно передаётся направленность верности к Богу без введения более узкого конфессионального толкования.
- issue: Согласование с собирательным существительным דּוֹר
  choice: 'Сохранить единственное число: «поколению, которое… своего сердца… чей дух».'
  alternative: 'Перейти к множественному числу: «их сердца… их дух».'
  rationale: Единственное число отражает грамматику еврейского текста и остаётся естественным в русском языке.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор слова «поколение» и параллелизм «сердце — дух» сохранены; тире ясно связывает «отцов» с последующим описанием поколения.
