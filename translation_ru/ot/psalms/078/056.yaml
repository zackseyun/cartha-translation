  text: וַ/יְנַסּ֣וּ וַ֭/יַּמְרוּ אֶת אֱלֹהִ֣ים עֶלְי֑וֹן וְ֝/עֵדוֹתָ֗י/ו לֹ֣א שָׁמָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/056.yaml
  text: Yet they tested God Most High and rebelled[c][b][a], and they did not keep his testimonies.
translation:
  language: ru
  text: Но они испытывали Бога Всевышнего и восставали против Него, а Его установлений не соблюдали.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Его свидетельств»; также возможно: «Его постановлений».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַסּוּ
  choice: испытывали
  rationale: Глагол נסה означает «испытывать, подвергать испытанию». Здесь он прямо управляет наименованием Бога и передаёт обвинительный смысл без менее точного оттенка «искушать».
- source_word: וַיַּמְרוּ
  choice: восставали против Него
  rationale: Глагол מרה обозначает неповиновение и мятеж. Такое выражение естественно по-русски передаёт активное противление Богу.
- source_word: אֱלֹהִים עֶלְיוֹן
  choice: Бога Всевышнего
  rationale: Сохраняется сочетание общего наименования Бога с титулом עֶלְיוֹן, подчёркивающим Его верховенство.
- source_word: וְעֵדוֹתָיו
  choice: а Его установлений
  rationale: עֵדוֹת обозначает данные Богом обязательные предписания, имеющие свидетельствующий и заветный характер. «Установления» понятно современному читателю и лучше передаёт юридико-заветный смысл, чем русское «свидетельства».
- source_word: לֹא שָׁמָרוּ
  choice: не соблюдали
  rationale: שׁמר при заповедях и установлениях означает исполнять или соблюдать их; «соблюдали» — естественное современное соответствие.
- source_word: וַ
  choice: Но
  rationale: В контексте союз выражает контраст между Божьими деяниями и ответным неповиновением народа.
theological_decisions:
- issue: Божественный титул אֱלֹהִים עֶלְיוֹן
  choice: Бога Всевышнего
  alternative: Всевышнего Бога; Бога, Всевышнего
  rationale: Формулировка сохраняет оба элемента титула и подчёркивает Божье верховенство, не добавляя отсутствующих в еврейском тексте смыслов.
- issue: Заветно-правовой оттенок עֵדוֹתָיו
  choice: Его установлений
  alternative: Его свидетельств; Его постановлений
  rationale: «Установления» ясно указывает на обязательные Божьи предписания. Возможное буквальное «свидетельства» отмечено в сноске, чтобы сохранить лексическую неоднозначность.
- issue: Отношение двух глаголов к Богу как объекту
  choice: испытывали Бога Всевышнего и восставали против Него
  alternative: испытывали Бога Всевышнего и противились Ему
  rationale: Еврейский אֶת прямо отмечает Бога как объект первого глагола, тогда как второй по-русски естественно требует конструкции «восставать против». Развёрнутая формулировка избегает ошибочного общего управления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Прошедшие глаголы несовершенного вида передают повторяющееся поведение народа в данном историческом обзоре. Заглавные буквы в местоимениях, относящихся к Богу, сохраняют традиционный русский библейский стиль.
