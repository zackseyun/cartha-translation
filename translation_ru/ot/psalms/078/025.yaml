  text: לֶ֣חֶם אַ֭בִּירִים אָ֣כַל אִ֑ישׁ צֵידָ֬ה שָׁלַ֖ח לָ/הֶ֣ם לָ/שֹֽׂבַע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/025.yaml
  text: Man ate the bread of the mighty[a]; he sent them provisions to the full.
translation:
  language: ru
  text: Хлеб могучих[a] ел человек; послал Он им пищи досыта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлеб ангелов». Еврейское выражение буквально означает: «хлеб могучих» или «сильных».'
    reason: alternative_reading
lexical_decisions:
- source_word: לֶחֶם
  choice: хлеб
  rationale: Сохраняет основное конкретное значение еврейского слова и поэтический образ.
- source_word: אַבִּירִים
  choice: сильных
  rationale: Передаёт прямое значение существительного — «сильные, могучие», не подменяя его традиционным, но не бесспорным толкованием «ангелы».
- source_word: אָכַל
  choice: ел
  rationale: Форма qatal в данном повествовательно-поэтическом контексте естественно передаётся русским прошедшим временем.
- source_word: אִישׁ
  choice: человек
  rationale: Сохраняет собирательно-представительное употребление единственного числа и естественно звучит по-русски.
- source_word: צֵידָה
  choice: пищу
  rationale: Здесь слово обозначает съестные припасы; «пищу» ясно передаёт смысл и не создаёт неуместной ассоциации исключительно с дорожными запасами.
- source_word: שָׁלַח
  choice: послал
  rationale: Прямо соответствует значению глагола и сохраняет образ ниспосланного пропитания.
- source_word: לָהֶם
  choice: им
  rationale: Естественная русская передача косвенного дополнения.
- source_word: לָשֹׂבַע
  choice: досыта
  rationale: Кратко и идиоматично выражает насыщение до полной сытости.
theological_decisions:
- issue: Толкование אַבִּירִים в выражении «хлеб сильных»
  choice: В основном тексте сохранить прямое лексическое значение «сильных»
  alternative: «ангелов» или «могучих»
  rationale: Контекст небесной манны допускает традиционное понимание как «хлеб ангелов», однако само еврейское слово не обозначает ангелов однозначно. Сноска сохраняет это толкование, не устраняя смысловую напряжённость оригинала.
translation_notes:
  register: Современный литературный русский с сохранением сжатого поэтического параллелизма. Заглавная буква в «Он» указывает на Бога как подразумеваемого деятеля из контекста, не добавляя имени в текст.
