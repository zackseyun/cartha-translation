lexical_decisions:
- source_word: אֶפְתְּחָה
  choice: Открою
  rationale: Форма 1-го лица единственного числа имеет здесь поэтический волитивно-будущий оттенок; «открою» естественно передаёт намерение говорящего.
- source_word: בְמָשָׁל
  choice: для притчи
  rationale: מָשָׁל может обозначать притчу, пословицу или образное изречение. В сочетании «открыть уста» русский оборот «для притчи» сохраняет образ и указывает на начало образно-наставительной речи.
- source_word: פִּי
  choice: уста мои
  rationale: Сохранён конкретный образ еврейского текста; «уста» уместны в возвышенной поэзии и понятны современному читателю.
- source_word: אַבִּיעָה
  choice: изреку
  rationale: Hiphil глагола נבע буквально связан с излиянием или истечением, а переносно — с произнесением речи; «изреку» кратко и поэтически передаёт этот смысл.
- source_word: חִידוֹת
  choice: загадки
  rationale: Прямое соответствие множественному числу חִידָה, обозначающему загадку или загадочное, требующее осмысления изречение.
- source_word: מִנִּי קֶדֶם
  choice: древних времён
  rationale: Выражение указывает на давнюю древность, не обязательно на абсолютное начало; родительная конструкция естественно связывает загадки с древними временами.
theological_decisions:
- issue: Связь стиха с Матфея 13:35 и смысл מָשָׁל / חִידוֹת
  choice: Перевести еврейский текст как «притча» и «загадки», не подгоняя его под формулировку новозаветной цитаты.
  alternative: «Буду говорить притчами, возвещу сокрытое от древних времён».
  rationale: Перевод исходит прежде всего из масоретского еврейского текста и сохраняет его образно-загадочный характер. Связь с Матфея 13:35 отмечена отдельно, без ретроспективной замены значения еврейских слов.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Инверсия «уста мои» и глагол «изреку» сохраняют достоинство псалма, оставаясь понятными обычному читателю. Маркеры сносок размещены непосредственно при соответствующих выражениях.
