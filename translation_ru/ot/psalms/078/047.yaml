  text: He destroyed their vines with hail[a], and their sycamore trees with frost.
translation:
  language: ru
  text: 'Он погубил градом их виноградные лозы,

    а их сикоморы — морозом.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «саранчой», «градинами» или «мокрым снегом»; значение редкого еврейского слова неясно.'
