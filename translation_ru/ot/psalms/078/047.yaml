  register: Современный литературный русский язык с сохранением краткости и поэтического параллелизма. Союз «а» ясно связывает две соотнесённые части стиха; инверсия «градом их виноградные лозы» сохраняет акцент на орудии уничтожения без неестественной архаизации.
