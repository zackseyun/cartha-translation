lexical_decisions:
- source_word: יַהֲרֹג
  choice: погубил
  rationale: Глагол буквально означает «убил, умертвил», но применительно к растениям «погубил» естественно передаёт уничтожение и сохраняет силу исходного образа.
- source_word: בַּבָּרָד
  choice: градом
  rationale: Предлог ב имеет здесь инструментальное значение; русский творительный падеж естественно выражает средство действия.
- source_word: גַּפְנָם
  choice: их виноградные лозы
  rationale: Собирательное единственное число обозначает лозы как растения; перевод не подменяет их виноградниками как участками земли.
- source_word: וְשִׁקְמוֹתָם
  choice: а их сикоморы
  rationale: שִׁקְמָה — сикомора, или смоковница сикомор; краткое ботаническое название уместно в поэтической строке и соответствует множественному числу.
- source_word: בַּחֲנָמַל
  choice: морозом
  rationale: Редкое слово חֲנָמַל имеет неясное значение. «Морозом» — традиционно возможное понимание, соответствующее параллелизму разрушительных погодных явлений; неопределённость отмечена в сноске.
theological_decisions: []
