  text: Again they turned back and tested God[a], and they limited the Holy One of Israel.
translation:
  language: ru
  text: 'И снова они отступали и испытывали Бога,

    и оскорбляли[a] Святого Израилева.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол редок, и его точное значение неясно. Возможны также переводы: «ограничивали» (традиционный вариант), «провоцировали» или «вызывали гнев».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשׁוּבוּ
  choice: И снова они отступали
  rationale: Глагол שׁוב здесь передаёт повторное возвращение к прежнему непослушанию. «Снова» выражает повторность, а «отступали» естественно передаёт в контексте возвращение к неверности.
- source_word: וַיְנַסּוּ
  choice: испытывали
  rationale: נסה обычно означает «испытывать, подвергать испытанию»; здесь речь о том, что народ своим неверием испытывал Бога.
- source_word: אֵל
  choice: Бога
  rationale: אֵל употреблено как обозначение Бога Израиля; нейтральное «Бога» не добавляет отсутствующего в тексте уточнения.
- source_word: וּקְדוֹשׁ יִשְׂרָאֵל
  choice: Святого Израилева
  rationale: Сохранён устойчивый библейский титул, выражающий святость Бога и Его особое отношение к Израилю.
- source_word: הִתְווּ
  choice: оскорбляя
  rationale: Редкий и трудный глагол допускает разные толкования. В параллели с «испытывали Бога» слово, вероятно, обозначает дерзкое действие против Бога, причиняющее Ему огорчение или провоцирующее Его; «оскорбляя» передаёт этот общий смысл без утверждения, будто люди буквально ограничили Божью силу.
theological_decisions:
- issue: Значение редкого глагола הִתְווּ
  choice: оскорбляя
  alternative: ограничивая; ставя знак на; причиняя боль
  rationale: Еврейский глагол редок, и его точное значение не установлено. Основной текст передаёт вероятный смысл в контексте мятежа и параллели с испытанием Бога, а существенные альтернативы сохраняются в сноске, чтобы не скрывать неоднозначность и не делать спорного утверждения о метафизическом ограничении Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Традиционный титул «Святой Израилев» сохранён ради узнаваемости и богословского веса; причастный оборот делает параллелизм естественным по-русски и не устраняет смысловую связь двух обвинений.
