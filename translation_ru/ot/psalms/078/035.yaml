  text: Тогда они вспомнили, что Бог был их скалой, а Бог Всевышний — их Искупителем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְכְּרוּ
  choice: Тогда они вспоминали
  rationale: Ваййиктоль продолжает повествовательную последовательность, а несовершенный вид соответствует контексту повторяющегося обращения народа к Богу (ср. ст. 34).
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, о чём они вспоминали, а не причину.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма имеет морфологическое множественное число, но здесь обозначает единого Бога Израиля.
- source_word: צוּרָם
  choice: их скала
  rationale: Прямо сохраняет метафору Бога как надёжной опоры и прибежища; строчная буква не добавляет отсутствующей в еврейском тексте интерпретации.
- source_word: וְאֵל עֶלְיוֹן
  choice: и Бог Всевышний
  rationale: אֵל переведено как божественный титул, а עֶלְיוֹן — общепринятым русским титулом «Всевышний»; порядок еврейских слов сохранён естественным для русского языка образом.
- source_word: גֹּאֲלָם
  choice: их Искупитель
  rationale: Существительное-причастие от גאל обозначает того, кто избавляет или выкупает; «Искупитель» сохраняет именную форму и смысл, не вводя более узкого юридического понятия родственника-выкупщика.
theological_decisions:
- issue: Соотношение обозначений אֱלֹהִים и אֵל עֶלְיוֹן
  choice: 'Повторить «Бог»: «Бог — их скала и Бог Всевышний — их Искупитель»'
  alternative: «Бог — их скала, а Всевышний Бог — их Искупитель»
  rationale: Оба параллельных обозначения относятся к одному Богу. Повтор сохраняет еврейский поэтический параллелизм и не создаёт впечатления, будто речь идёт о разных существах.
- issue: Вид глагола וַיִּזְכְּרוּ
  choice: «вспоминали»
  alternative: «вспомнили»
  rationale: Хотя форма продвигает повествование, ближайший контекст описывает повторявшуюся реакцию народа всякий раз, когда Бог поражал их; несовершенный вид сохраняет эту контекстуальную итеративность.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Тире обозначают именную связку в прошедшем времени без перегрузки повтором «был». «Искупитель» написано с прописной как личностный божественный титул; метафорическое «скала» — со строчной.
