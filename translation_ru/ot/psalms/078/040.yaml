  yaml_path: translation/ot/psalms/078/040.yaml
  text: How often they rebelled against him in the wilderness and grieved him in the wasteland![a][b]
translation:
  language: ru
  text: Как часто они восставали против него в пустыне и огорчали его в безлюдной земле![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сколько раз они восставали против него в пустыне». Начальное выражение может подчёркивать многократность восстаний.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и причиняли ему боль» или «и досаждали ему» в безлюдной земле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּמָּה
  choice: Как часто
  rationale: В этом восклицательно-вопросительном обороте выражена повторяемость действий, а не буквальный вопрос об их числе. «Как часто» естественно передаёт скорбное ретроспективное восклицание псалма.
- source_word: יַמְרוּהוּ
  choice: они восставали против него
  rationale: Глагол מרה с местоименным суффиксом обозначает неповиновение и мятеж против Бога. «Восставали против него» ясно передаёт направленность и силу еврейского выражения.
- source_word: בַמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, малонаселённую местность и здесь отсылает к странствиям Израиля. «В пустыне» — естественный и узнаваемый русский географический эквивалент.
- source_word: יַעֲצִיבוּהוּ
  choice: огорчали его
  rationale: Порода Hiphil глагола עצב означает причинять боль, печаль или огорчение. «Огорчали его» сохраняет личностно-эмоциональную силу выражения и звучит естественно по-русски.
- source_word: בִּישִׁימוֹן
  choice: в безлюдной земле
  rationale: יְשִׁימוֹן обозначает пустынную, опустошённую или безлюдную местность. «Безлюдная земля» отличает этот образ от מִדְבָּר и сохраняет поэтический параллелизм двух близких, но не тождественных обозначений пустыни.
theological_decisions:
- issue: Антропопатический язык о Боге в יַעֲצִיבוּהוּ
  choice: Сохранить в основном тексте личностно-эмоциональное выражение «огорчали его».
  alternative: «Причиняли ему боль» или «досаждали ему».
  rationale: Еврейский текст представляет действия Израиля как причиняющие Богу реальное личностное огорчение. Перевод сохраняет это богословское напряжение, не сводя выражение к безличному «вызывали его гнев» и не усиливая его сверх исходного смысла.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным псалмическим звучанием. Местоимения, относящиеся к Богу, даны со строчной буквы в соответствии с обычной современной издательской практикой и формой исходного текста. Параллелизм сохранён посредством различения «пустыни» и «безлюдной земли».
