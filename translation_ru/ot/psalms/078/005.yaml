base_translation:
  language: en
  yaml_path: translation/ot/psalms/078/005.yaml
  text: For he established a testimony in Jacob and set a law in Israel[c][b][a], which he commanded our fathers to make known to their children.
translation:
  language: ru
  text: Он установил свидетельство в Иакове и установил закон[a] в Израиле, заповедав нашим отцам[b] возвещать их своим детям[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление» — еврейское тора может означать как закон, так и наставление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «нашим отцам»; в еврейском тексте употреблено слово мужского рода.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «своим сыновьям»; здесь, вероятно, имеются в виду дети вообще как следующее поколение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: установил
  rationale: Каузативная форма от קום означает «поставить, утвердить, установить»; «установил» естественно передаёт учреждение Богом обязательного свидетельства.
- source_word: עֵדוּת
  choice: свидетельство
  rationale: Сохраняет основное значение слова и его возможный заветно-нормативный оттенок, не сужая его до одного лишь постановления.
- source_word: בְּיַעֲקֹב
  choice: в Иакове
  rationale: Буквально передаёт предлог ב и сохраняет поэтический параллелизм с «в Израиле»; Иаков обозначает народ как единое целое.
- source_word: וְתוֹרָה
  choice: и закон
  rationale: В сочетании со свидетельством и заповедью о передаче следующим поколениям תּוֹרָה имеет выраженную нормативную силу; «наставление» остаётся возможным вариантом.
- source_word: שָׂם
  choice: положил
  rationale: Прямо передаёт שׂים «класть, помещать, устанавливать» и звучит достойно в поэтическом контексте.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Сохраняет форму и параллелизм еврейского текста.
- source_word: אֲשֶׁר צִוָּה
  choice: заповедав
  rationale: Русский деепричастный оборот естественно связывает установленное Богом свидетельство и закон с повелением передавать их; субъектом остаётся Бог.
- source_word: אֶת אֲבוֹתֵינוּ
  choice: нашим отцам
  rationale: Сохраняет явно мужское אבותינו, не заменяя его более широким «предкам».
- source_word: לְהוֹדִיעָם
  choice: возвещать их
  rationale: Hiphil от ידע означает «дать знать, сделать известным»; «возвещать» передаёт активное сообщение содержания. Местоимение во множественном числе соотнесено с параллельной парой «свидетельство и закон».
- source_word: לִבְנֵיהֶם
  choice: своим детям
  rationale: בנים формально может означать «сыновья», но в контексте передачи из поколения в поколение обозначает детей вообще; возвратное «своим» ясно связывает их с отцами.
theological_decisions:
- issue: Значение תּוֹרָה в заветном контексте псалма
  choice: закон
  alternative: наставление
  rationale: «Закон» сохраняет нормативную силу Божьего установления, тогда как «наставление» точнее отражало бы более широкий семантический диапазон слова; вариант отмечен в сноске без устранения напряжения.
- issue: Референт суффикса в לְהוֹדִיעָם
  choice: «их» — свидетельство и закон вместе
  alternative: передать единственное собирательное содержание как «его» или перестроить фразу без местоимения
  rationale: Маскулинный множественный суффикс допускает отнесение к двум предшествующим существительным разного рода как к совокупности. Русское «их» формально сохраняет эту связь и не выбирает лишь один из двух объектов.
- issue: Гендерно маркированные родственные термины
  choice: «нашим отцам … своим детям»
  alternative: «нашим предкам … своим сыновьям»
  rationale: Первое слово в источнике прямо обозначает отцов и сохраняется как таковое; בנים в данном межпоколенческом контексте употреблено в общем смысле потомства, поэтому передано как «детям».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Параллелизм «в Иакове … в Израиле» сохранён. «Положил закон» намеренно сохраняет образность исходного שָׂם, хотя «установил закон» было бы более разговорно-обычным; повтор «установил» при этом устранён. Все маркеры сносок размещены непосредственно после соответствующих выражений.
