lexical_decisions:
- source_word: אֲשֶׁר
  choice: то, что
  rationale: Относительное местоимение связывает стих с перечислением предыдущего стиха; конструкция «то, что» естественна по-русски и сохраняет синтаксическую незавершённость отрывка.
- source_word: שָׁמַעְנוּ וַנֵּדָעֵם
  choice: мы слышали и знаем
  rationale: 'Сохранены два отдельных глагола и смена аспектуально-временной формы: полученное через слышание предание стало известным знанием.'
- source_word: אֲבוֹתֵינוּ
  choice: наши отцы
  rationale: Традиционное и контекстуально точное обозначение предков; оно не ограничивает смысл непосредственными родителями.
- source_word: סִפְּרוּ לָנוּ
  choice: рассказали нам
  rationale: Передаёт устное повествование и передачу предания от предыдущих поколений.
