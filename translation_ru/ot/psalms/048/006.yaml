lexical_decisions:
- source_word: רְעָדָה
  choice: дрожь
  rationale: Существительное обозначает дрожь или содрогание; конкретный телесный образ естественно передаёт внезапный страх.
- source_word: אֲחָזָתַם
  choice: их охватила
  rationale: Глагол אחז значит «схватить, овладеть»; русское «охватила» идиоматично сочетается с «дрожью» и сохраняет силу внезапного воздействия.
- source_word: שָׁם
  choice: там
  rationale: Прямой и естественный эквивалент наречия места, сохраняющий наглядность сцены.
- source_word: חִיל
  choice: мука
  rationale: Слово может обозначать мучительную боль, судороги или терзание; «мука» сохраняет как телесную, так и эмоциональную сторону образа и естественно вводит сравнение с родами.
- source_word: כַּיּוֹלֵדָה
  choice: как у роженицы
  rationale: Сравнительная конструкция с причастной формой от ילד указывает на женщину во время родов; «как у роженицы» кратко, современно и выразительно.
