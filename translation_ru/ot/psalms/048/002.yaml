base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/002.yaml
  text: Beautiful in elevation[a], the joy of all the earth, is Mount Zion, in the far north, the city of the great King.
translation:
  language: ru
  text: Прекрасна своей высотой, радость всей земли — гора Сион, на дальнем севере[a], город великого Царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «на северных склонах» или, более буквально, «в дальних пределах (по сторонам) севера». В этом выражении может также звучать отсылка к Цафону — образу божественной горы.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְפֵה נוֹף
  choice: Прекрасна своей высотой
  rationale: Сочетание описывает красоту возвышенного облика или положения Сиона. Формулировка естественна по-русски и сохраняет трудную пространственную семантику נוֹף, не сводя её к единственному узкому толкованию.
- source_word: מְשׂוֹשׂ כָּל־הָאָרֶץ
  choice: радость всей земли
  rationale: מְשׂוֹשׂ означает радость или отраду, а הָאָרֶץ здесь уместно понимать универсально как «земля», сохраняя вселенский размах хвалы.
- source_word: הַר צִיּוֹן
  choice: гора Сион
  rationale: Обычная и ясная русская передача географического названия с родовым словом.
- source_word: יַרְכְּתֵי צָפוֹן
  choice: на дальнем севере
  rationale: Передаёт буквальный образ отдалённых частей или сторон севера и оставляет возможный отзвук образа Цафона без внесения его непосредственно в основной текст.
- source_word: קִרְיַת מֶלֶךְ רָב
  choice: город великого Царя
  rationale: Конструкция естественно читается как приложение к Сиону. Прописная буква указывает на Бога как Царя в данном поэтическом контексте, не добавляя отдельного имени.
theological_decisions:
- issue: Смысл יַרְכְּתֵי צָפוֹן применительно к горе Сион
  choice: на дальнем севере
  alternative: «на северных склонах»; либо аллюзия на Цафон как божественную гору
  rationale: Еврейское выражение допускает географическое, топографическое и образно-космическое прочтения. Основной текст сохраняет его пространственный смысл, а примечание открыто сообщает об альтернативе, не разрешая спор богословски.
- issue: Определённость выражения מֶלֶךְ רָב
  choice: великого Царя
  alternative: «великого царя»
  rationale: В контексте песни о Сионе выражение указывает на Бога как верховного Царя; русская прописная буква делает эту референцию ясной, не расширяя содержание исходного текста.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим строем. Приложения разделены запятыми; сохранены образность, неоднозначность и богословское напряжение исходного текста.
