lexical_decisions:
- source_word: הֵמָּה
  choice: Они
  rationale: Самостоятельное местоимение третьего лица множественного числа имеет эмфатический оттенок; в естественном русском контексте достаточно формы «они», а выделение поддерживается начальной позицией.
- source_word: רָאוּ
  choice: увидели
  rationale: Обычное значение Qal от ראה — «видеть»; совершенный вид естественно передаёт завершённое восприятие.
- source_word: כֵּן
  choice: — и
  rationale: Частица здесь связывает увиденное с последующей реакцией. Тире и союз «и» естественно выражают немедленное следствие, не навязывая более узкого значения.
- source_word: תָּמָהוּ
  choice: изумились
  rationale: Глагол обозначает сильное удивление или потрясение; «изумились» сохраняет интенсивность и не уточняет без основания, было ли чувство восхищением или ужасом.
- source_word: נִבְהֲלוּ
  choice: пришли в ужас
  rationale: Nifal от בהל передаёт смятение, испуг или ужас. В нарастающем ряду реакций выражение «пришли в ужас» звучит естественно и передаёт высокую степень страха.
- source_word: נֶחְפָּזוּ
  choice: поспешно бежали
  rationale: Nifal от חפז обозначает торопливое движение под давлением. «Поспешно бежали» сохраняет как идею бегства из контекста, так и прямо выраженную стремительность.
