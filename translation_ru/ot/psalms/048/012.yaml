  text: סֹ֣בּוּ צִ֭יּוֹן וְ/הַקִּיפ֑וּ/הָ סִ֝פְר֗וּ מִגְדָּלֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/012.yaml
  text: Walk around Zion and go around her[a]; count her towers.
translation:
  language: ru
  text: Обойдите Сион, пройдите вокруг него[a]; пересчитайте его башни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обступите его кругом».'
    reason: 'Лексическая альтернатива: глагол может передавать как обход вокруг, так и полное окружение; контекст не требует враждебного оттенка.'
lexical_decisions:
- source_word: סֹבּוּ
  choice: Обойдите
  rationale: Повелительная форма множественного числа от סבב обозначает движение вокруг города; «обойдите» естественно и конкретно передаёт это действие.
- source_word: צִיּוֹן
  choice: Сион
  rationale: В еврейском тексте употреблено собственное имя «Сион» без слова «гора».
- source_word: וְהַקִּיפוּהָ
  choice: пройдите вокруг него
  rationale: Повелительная форма с местоименным суффиксом призывает совершить обход Сиона. Такой перевод сохраняет пространственный смысл и не привносит оттенка враждебного окружения; мужской род местоимения естественно согласуется с русским названием «Сион».
- source_word: סִפְרוּ
  choice: пересчитайте
  rationale: В сочетании с башнями глагол ספר означает определить их число; «пересчитайте» ясно выражает непосредственное перечисление объектов.
- source_word: מִגְדָּלֶיהָ
  choice: его башни
  rationale: Суффикс 3-го лица женского рода относится к Сиону как к городу, грамматически женскому в древнееврейском. В русском местоимение согласуется с названием «Сион» мужского рода.
