lexical_decisions:
- source_word: גָּדוֹל
  choice: Велик
  rationale: Предикативное прилагательное вынесено в начало, как в еврейском тексте; передаёт величие, не сужая смысл до одной лишь силы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: וּמְהֻלָּל מְאֹד
  choice: и достоин великой хвалы
  rationale: Страдательное причастие допускает значение «прославляем» или «достоин хвалы»; выбран естественный по-русски предикативный оборот, сохраняющий нормативный оттенок призыва к прославлению.
- source_word: בְּעִיר אֱלֹהֵינוּ
  choice: в городе нашего Бога
  rationale: Предлог ב передан как указание места, а конструктивная связь — естественным русским родительным оборотом.
- source_word: הַר קָדְשׁוֹ
  choice: на Его святой горе
  rationale: 'Фраза соотнесена с местом хвалы: город Бога расположен на Его святой горе. Русское «на горе» требуется нормой пространственного употребления.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом.
- issue: Значение מְהֻלָּל
  choice: достоин хвалы
  alternative: прославляем; весьма восхвалён
  rationale: Еврейское страдательное причастие допускает как фактическую, так и оценочно-нормативную трактовку. В основном тексте выбран естественный русский оборот, не вводящий специального конфессионального толкования.
- issue: Синтаксическая связь הַר קָדְשׁוֹ
  choice: в городе нашего Бога, на Его святой горе
  alternative: в городе нашего Бога — Его святой горе
  rationale: Еврейский текст допускает понимание «святой горы» как уточняющего обозначения места. Запятая сохраняет близкое соположение фраз, не превращая их в строгое отождествление.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной псалмовой интонацией. Сохранён начальный акцент «Велик Яхве» и параллельное указание места; местоимение «Его» написано с прописной буквы как принятая в русском библейском стиле форма почтительности.
