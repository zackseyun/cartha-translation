lexical_decisions:
- source_word: שִׁיר
  choice: песнь
  rationale: Обычное обозначение песни; в заголовке псалма «песнь» звучит естественно и сохраняет возвышенный, но понятный регистр.
- source_word: מִזְמוֹר
  choice: псалом
  rationale: Устоявшееся жанровое обозначение в заголовках Псалтири; отдельный перевод сохраняет двойную характеристику שִׁיר מִזְמוֹר.
- source_word: לִבְנֵי
  choice: сынов
  rationale: Русская родительная конструкция естественно передаёт принадлежность или связь, не определяя однозначно авторство; смысловая широта еврейского ל пояснена в сноске.
- source_word: קֹרַח
  choice: Корей
  rationale: Использована укоренившаяся в русской библейской традиции форма имени; в родительном падеже — «Корея».
theological_decisions:
- issue: Значение לִבְנֵי קֹרַח в надписании
  choice: сынов Корея
  alternative: для сынов Корея
  rationale: Предлог ל в надписаниях может указывать на авторство, принадлежность, посвящение или исполнительский контекст. Основной текст сохраняет широкую связь, а сноска отмечает альтернативу, не разрешая неоднозначность.
translation_notes:
  register: Современный литературный русский с традиционными жанровыми терминами. Краткие самостоятельные именные фразы передают форму еврейского надписания и сохраняют оба обозначения — «песнь» и «псалом».
