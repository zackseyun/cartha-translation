lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ибо вот
  rationale: Передаёт как связующее כִּי, так и привлекающее внимание הִנֵּה, сохраняя связь с предыдущим стихом.
- source_word: נוֹעֲדוּ
  choice: собрались
  rationale: Естественно передаёт значение совместного сбора или встречи; в контексте речь идёт о царях, собравшихся вместе.
- source_word: עָבְרוּ יַחְדָּו
  choice: вместе двинулись вперёд
  rationale: Глагол עבר может означать «проходить», «переходить», «двигаться дальше». Такой перевод естественен по-русски и сохраняет направленное совместное движение, не уточняя сверх текста его цель.
