source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר שָׁמַ֨עְנוּ כֵּ֤ן רָאִ֗ינוּ בְּ/עִיר יְהוָ֣ה צְ֭בָאוֹת בְּ/עִ֣יר אֱלֹהֵ֑י/נוּ אֱלֹ֘הִ֤ים יְכוֹנְנֶ֖/הָ עַד עוֹלָ֣ם סֶֽלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/008.yaml
  text: 'Just as we have heard[a], so we have seen in the city of Yahweh of hosts, in the city of our God: God will establish her forever. Selah'
translation:
  language: ru
  text: 'Как мы слышали, так и увидели

    в городе Яхве Воинств,

    в городе нашего Бога:

    Бог утвердит его навеки.

    Села.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: Как… так и…
  rationale: Сохраняет соотносительную сравнительную конструкцию еврейского текста и естественно звучит по-русски.
- source_word: שָׁמַעְנוּ ... רָאִינוּ
  choice: мы слышали… увидели
  rationale: Русское прошедшее время естественно передаёт две формы перфекта и противопоставляет полученное прежде известие личному свидетельству.
- source_word: בְּעִיר
  choice: в городе
  rationale: Прямо передаёт местное значение предлога בְּ и существительное עִיר.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Сохраняет личное имя Яхве и широкое значение צְבָאוֹת, не сужая его исключительно до земных армий.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Передаёт форму сопряжённого состояния с суффиксом первого лица множественного числа.
- source_word: יְכוֹנְנֶהָ
  choice: утвердит его
  rationale: Глагол כון означает сделать твёрдым, прочно установить. Местоимение «его» относится к ближайшему слову «город» и в русском согласуется с ним в мужском роде; женский еврейский суффикс обусловлен грамматическим родом עִיר и не требует неестественной для русского языка персонификации.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт идею непреходящей длительности.
- source_word: סֶלָה
  choice: Села
  rationale: Термин транслитерирован, поскольку его точное значение и функция остаются неясными.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное божественное имя; транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Референт суффикса в יְכוֹנְנֶהָ
  choice: «его» — город
  alternative: «её» — по грамматически женскому роду еврейского עִיר или при поэтическом олицетворении города
  rationale: Суффикс женского рода естественно отсылает к עִיר. Однако в русском «город» мужского рода, поэтому грамматически корректное «его» сохраняет тот же референт без добавления отсутствующей в русском явной персонификации.
- issue: Характер Божьего действия
  choice: утвердит
  alternative: сделает безопасным; укрепит
  rationale: «Утвердит» сохраняет широкую семантику כון — прочно установить и обеспечить устойчивость — без сведения обещания лишь к военной безопасности.
translation_notes:
  register: Современный литературный русский язык с поэтическим членением строк. Формулировки краткие и торжественные, но понятные; архаизмы сведены к традиционной транслитерации «Села».
