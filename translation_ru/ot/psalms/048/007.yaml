  text: בְּ/ר֥וּחַ קָדִ֑ים תְּ֝שַׁבֵּ֗ר אֳנִיּ֥וֹת תַּרְשִֽׁישׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/007.yaml
  text: With an east wind you shatter the ships of Tarshish[a].
translation:
  language: ru
  text: Восточным ветром Ты сокрушаешь фарсисские корабли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «корабли Фарсиса»; выражение может также обозначать корабли, направлявшиеся в Фарсис, либо большие морские торговые суда, связанные с Фарсисом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרוּחַ קָדִים
  choice: восточным ветром
  rationale: רוּחַ в сочетании с קָדִים означает ветер, а предлог בְּ имеет инструментальное значение. Творительный падеж естественно передаёт средство действия.
- source_word: תְּשַׁבֵּר
  choice: Ты сокрушаешь
  rationale: Порода пиэль выражает сильное, разрушительное действие. «Сокрушаешь» сохраняет интенсивность глагола и возвышенный поэтический регистр; форма второго лица передана как прямое обращение к Богу.
- source_word: אֳנִיּוֹת
  choice: корабли
  rationale: Обычное и точное современное соответствие множественному числу существительного «корабль».
- source_word: תַּרְשִׁישׁ
  choice: фарсисские
  rationale: Прилагательное сохраняет связь кораблей с Фарсисом, не уточняя однозначно, были ли они оттуда, направлялись туда или относились к известному типу крупных морских торговых судов.
theological_decisions:
- issue: Адресат глагола второго лица
  choice: 'Прямое обращение к Богу: «Ты сокрушаешь»'
  alternative: Безличное или обобщённое утверждение
  rationale: Мужской род единственного числа второго лица и контекст псалма естественно указывают на обращение к Богу. Заглавная буква соответствует русской библейской традиции, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия не используется; краткая образность еврейской строки сохранена.
