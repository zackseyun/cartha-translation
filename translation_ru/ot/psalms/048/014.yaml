  text: כִּ֤י זֶ֨ה אֱלֹהִ֣ים אֱ֭לֹהֵי/נוּ עוֹלָ֣ם וָ/עֶ֑ד ה֖וּא יְנַהֲגֵ֣/נוּ עַל מֽוּת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/014.yaml
  text: For this God is our God forever and ever; he will guide us beyond death.
translation:
  language: ru
  text: Ибо этот Бог — наш Бог во веки веков; Он будет вести нас за пределы смерти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение в конце стиха трудно для толкования. При данном делении текста его понимают как «за пределы смерти» или сходным образом; другие переводы передают «до смерти» либо «вовеки». При иной сегментации оно может быть связано со словом «аламот», вероятно музыкальным указанием.
    reason: Сохраняет спорность עַל־מוּת и основные переводческие возможности, не представляя одно толкование как несомненное.
lexical_decisions:
- source_word: כִּי זֶה אֱלֹהִים
  choice: Ибо этот Бог
  rationale: Сохраняет указательное «этот» и причинно-пояснительное כִּי; по-русски выражение звучит естественно и торжественно.
- source_word: אֱלֹהֵינוּ עוֹלָם וָעֶד
  choice: наш Бог во веки веков
  rationale: Устойчивое русское выражение точно передаёт усиленную формулу неограниченной длительности עוֹלָם וָעֶד.
- source_word: יְנַהֲגֵנוּ
  choice: будет вести нас
  rationale: Глагол נהג здесь обозначает руководство и водительство; нейтральное «вести» не добавляет отсутствующего в тексте образа пастыря.
- source_word: עַל־מוּת
  choice: и за порогом смерти
  rationale: Передаёт наиболее прямое понимание масоретского разделения слов как продолжение Божьего водительства по ту сторону смерти; частица «и» естественно связывает это с предшествующим «во веки веков».
theological_decisions:
- issue: Продолжается ли Божье водительство после смерти
  choice: «Он будет вести нас и за порогом смерти»
  alternative: «Он будет вести нас до смерти» / «Он будет вести нас вовеки»
  rationale: Масоретский текст читает עַל מוּת («над/за пределами смерти»), что допускает смысл водительства по ту сторону смерти. Перевод сохраняет это сильное утверждение, не уточняя устройство посмертной жизни; текстовая и смысловая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Формула «во веки веков» сохраняет библейскую торжественность, а «за порогом смерти» понятно выражает трудную еврейскую конструкцию без конфессиональной конкретизации.
