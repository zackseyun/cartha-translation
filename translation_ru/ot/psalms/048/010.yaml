source:
  edition: WLC
  text: כְּ/שִׁמְ/ךָ֤ אֱלֹהִ֗ים כֵּ֣ן תְּ֭הִלָּתְ/ךָ עַל קַצְוֵי אֶ֑רֶץ צֶ֝֗דֶק מָלְאָ֥ה יְמִינֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/048/010.yaml
  text: As your name[a], O God, so your praise reaches to the ends of the earth[b]; your right hand is full of righteousness.
translation:
  language: ru
  text: Как имя Твоё, Боже, так и хвала Тебе простирается до краёв земли[a]; праведностью[b] полна Твоя правая рука.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «над краями земли» или «по краям земли».'
    reason: Еврейский предлог עַל буквально означает «на, над, по»; перевод «простирается до» естественно передаёт здесь пространственный охват.
  - marker: b
    text: 'Или: «справедливостью»; возможен также оттенок «правосудием».'
    reason: Слово צֶדֶק может обозначать как праведность, так и справедливость или правосудие.
lexical_decisions:
- source_word: כְּשִׁמְךָ
  choice: Как имя Твоё
  rationale: Сравнительная конструкция «как… так и…» передаёт сочетание כְּ…כֵּן и сохраняет поэтический параллелизм; слово «имя» оставлено без истолковывающей замены на «славу» или «известность».
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения естественно передаёт обращение к Богу в современном литературном русском языке.
- source_word: תְּהִלָּתְךָ
  choice: хвала Тебе
  rationale: Так естественно по-русски выражается хвала, предметом которой является Бог; при этом сохраняется основное значение существительного — «хвала».
- source_word: עַל קַצְוֵי אֶרֶץ
  choice: простирается до краёв земли
  rationale: Глагол «простирается» делает эллиптическую еврейскую строку понятной по-русски, а «до краёв земли» передаёт всемирный пространственный охват. Более буквальное значение предлога עַל отмечено в сноске.
- source_word: צֶדֶק
  choice: праведностью
  rationale: Слово может обозначать как праведность, так и справедливость. В основном тексте сохранено широкое нравственное значение «праведность», а судебно-общественный оттенок указан в сноске.
- source_word: מָלְאָה יְמִינֶךָ
  choice: полна Твоя правая рука
  rationale: Сохранён конкретный библейский образ правой руки как орудия силы и действия; форма «полна» естественно выражает наличное состояние, обозначенное перфектом.
theological_decisions:
- issue: Значение צֶדֶק применительно к правой руке Бога
  choice: праведность
  alternative: справедливость; правосудие
  rationale: Еврейское слово охватывает нравственную правоту и справедливое судебное действие. Основной текст не сужает его до одной лишь судебной сферы, а сноска сохраняет допустимую альтернативу.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим строем. Инверсия «праведностью полна Твоя правая рука» сохраняет ритм и акцент исходной строки, не становясь архаичной.
