  text: Let Mount Zion rejoice[a]; let the daughters of Judah be glad because of your judgments.
translation:
  language: ru
  text: Пусть радуется гора Сион, пусть ликуют дочери Иуды[a] благодаря Твоим судам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «города (селения) Иудеи»; в поэтической речи «дочерями» могли называться зависимые города и поселения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂמַח
  choice: пусть радуется
  rationale: Форма Qal imperfect 3-го лица мужского рода единственного числа в поэтическом контексте допускает побудительно-желательное значение; «пусть радуется» естественно передаёт этот оттенок.
- source_word: הַר צִיּוֹן
  choice: гора Сион
  rationale: Передаёт сочетание с собственным именем и сохраняет топографический образ; это естественная форма в современном литературном русском языке.
- source_word: תָּגֵלְנָה
  choice: пусть ликуют
  rationale: Глагол גיל обозначает сильную радость, ликование. «Ликуют» сохраняет поэтический параллелизм, не повторяя предыдущий глагол буквально.
- source_word: בְּנוֹת יְהוּדָה
  choice: дочери Иуды
  rationale: Буквальное поэтическое выражение сохранено в основном тексте; возможный географический смысл — зависимые города или поселения Иудеи — указан в сноске.
- source_word: לְמַעַן
  choice: из-за
  rationale: В данном контексте предлог вводит причину радости. «Из-за» ясно передаёт причинное значение, хотя в современном русском иногда имеет отрицательную окраску; здесь она снимается контекстом ликования.
- source_word: מִשְׁפָּטֶיךָ
  choice: Твоих судов
  rationale: מִשְׁפָּט может обозначать суд, правосудие, судебное решение или установление. Во множественном числе и в контексте псалма «суды» сохраняет широту значения и указывает на Божьи судебные деяния.
theological_decisions:
- issue: Значение מִשְׁפָּטֶיךָ в контексте
  choice: Твоих судов
  alternative: Твоего правосудия; Твоих установлений
  rationale: Ближайший контекст прославляет решительные действия Бога как Царя и Судьи, а не прежде всего данные Им законы. «Суды» сохраняет эту направленность, не исключая оттенка справедливого правосудия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух побудительных форм сохранён; обращение к Богу оформлено традиционным прописным «Твоих».
