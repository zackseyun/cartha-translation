  text: We have reflected on your steadfast love[a], O God, in the midst of your temple.
translation:
  language: ru
  text: Боже, посреди Твоего храма мы размышляли[a] о Твоей неизменной любви.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы думали»; «мы обдумывали». Еврейский глагол может обозначать сосредоточенное обдумывание или размышление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּמִּינוּ
  choice: Мы размышляли
  rationale: Пиэль, перфект, 1-е лицо множественного числа от דמה здесь по контексту означает обдумывание, сосредоточенное размышление. «Размышляли» естественно звучит в современном русском и соответствует обстановке храмового поклонения; значение «сравнивали» в данном контексте менее вероятно.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Слово употреблено как прямое обращение. Русская звательная форма «Боже» ясно и естественно передаёт молитвенный характер речи.
- source_word: חַסְדֶּךָ
  choice: о Твоей неизменной любви
  rationale: חֶסֶד обозначает верную, постоянную и деятельную любовь Бога. «Неизменная любовь» сохраняет идеи любви и постоянства, не сужая смысл до одной лишь милости и не вводя в основной текст специальный богословский термин.
- source_word: בְּקֶרֶב
  choice: посреди
  rationale: Выражение указывает на пребывание внутри, в пределах некоторого места. «Посреди» сохраняет пространственный смысл и поэтическую торжественность.
- source_word: הֵיכָלֶךָ
  choice: Твоего храма
  rationale: הֵיכָל может означать дворец или храм, но контекст псалма, поклонения и обращения к Богу поддерживает значение «храм».
theological_decisions:
- issue: Смысл חֶסֶד как свойства и отношения Бога
  choice: «неизменная любовь»
  alternative: «милость», «верная любовь», «заветная любовь»
  rationale: Такой перевод передаёт постоянство и реляционную глубину חֶסֶד, не ограничивая его состраданием и не делая явно выраженным понятие завета, которое в самом слове здесь остаётся подразумеваемым.
- issue: Синтаксическая функция אֱלֹהִים
  choice: 'Прямое обращение: «Боже»'
  alternative: 'Упоминание Бога в третьем лице: «Бога»'
  rationale: Параллельные местоименные формы второго лица («Твоей», «Твоего») и молитвенная речь естественно указывают на обращение к Богу.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим строем. Формы «Твоей» и «Твоего» сохраняют традиционно почтительное оформление обращения к Богу. Необычный, но содержательно важный образ пребывания «посреди храма» сохранён без разъясняющего расширения.
