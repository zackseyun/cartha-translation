lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма множественного числа здесь служит именованием единого Бога Израиля и по контексту требует единственного числа.
- source_word: בְּאַרְמְנוֹתֶיהָ
  choice: в её твердынях
  rationale: אַרְמוֹן может обозначать дворец или укреплённое сооружение. В контексте безопасности Сиона слово «твердыни» передаёт и величие, и оборонительный характер; местоимение «её» относится к олицетворённому городу.
- source_word: נוֹדַע
  choice: явил Себя
  rationale: Нифаль от ידע допускает значение «стал известен, дал узнать себя». В сочетании с לְמִשְׂגָּב естественный русский оборот «явил Себя как…» передаёт то, что Бог узнаваем там в качестве защиты, не устраняя возможности более статичного понимания.
- source_word: לְמִשְׂגָּב
  choice: как надёжная защита
  rationale: מִשְׂגָּב обозначает высокое безопасное место, убежище или крепость. Выражение «надёжная защита» естественно по-русски и сохраняет основную идею безопасности.
theological_decisions:
- issue: К чему относится суффикс женского рода в слове בְּאַרְמְנוֹתֶיהָ
  choice: К Сиону, то есть к воспеваемому городу
  alternative: К земле или общине в более общем смысле
  rationale: Ближайший контекст псалма сосредоточен на горе Сион и городе Бога, поэтому женский суффикс естественнее всего понимать как указание на олицетворённый город.
- issue: 'Значение נוֹדַע: состояние известности или проявление Себя'
  choice: «явил Себя»
  alternative: «известен»
  rationale: Обе возможности грамматически допустимы. Основной текст выбран ради естественного русского сочетания с образом защиты, а буквальная статичная формулировка сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. «Твердыни» сохраняет возвышенный регистр, оставаясь понятным; «надёжная защита» звучит естественнее, чем буквальное «высокое укрепление».
