  text: Обратите сердце к её крепостному валу[a], обойдите её твердыни[b], чтобы рассказать грядущему поколению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к её внешней стене». Еврейское слово имеет широкое значение и обозначает городское оборонительное сооружение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «её дворцов». Еврейское слово может обозначать дворцы либо укреплённые здания; контекст обозрения оборонительных сооружений поддерживает перевод «твердыни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיתוּ לִבְּכֶם
  choice: Обратите ваши сердца
  rationale: Сочетание повелительного שִׁיתוּ с «сердцем» означает направить пристальное внимание. Перевод сохраняет образ сердца и при этом остаётся понятным современному читателю.
- source_word: לְחֵילָה
  choice: к её крепостному валу
  rationale: חֵיל в описании города обозначает оборонительное сооружение, вероятно вал или внешнюю стену. «Крепостной вал» конкретно передаёт фортификационный контекст.
- source_word: פַּסְּגוּ
  choice: пройдите среди
  rationale: Редкий глагол здесь, вероятнее всего, обозначает движение по городу с целью обозрения его сооружений. Выбор сохраняет физический смысл, не сводя действие исключительно к мысленному рассмотрению.
- source_word: אַרְמְנוֹתֶיהָ
  choice: её твердынь
  rationale: אַרְמוֹן может обозначать как дворец, так и укреплённое величественное здание. В контексте городских укреплений «твердыни» естественно поддерживает оборонительный образ, не исключая дворцового характера сооружений.
- source_word: לְמַעַן תְּסַפְּרוּ
  choice: чтобы рассказать
  rationale: לְמַעַן вводит цель, а piel глагола ספר означает рассказывать или повествовать; русское сочетание передаёт это прямо и естественно.
- source_word: לְדוֹר אַחֲרוֹן
  choice: грядущему поколению
  rationale: Буквально речь идёт о последующем или будущем поколении. «Грядущему поколению» сохраняет направленность свидетельства в будущее.
