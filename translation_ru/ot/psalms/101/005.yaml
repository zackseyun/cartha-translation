base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/005.yaml
  text: Whoever secretly slanders his neighbor[a], him I will destroy; one with haughty eyes and a proud heart[b], him I cannot endure.
translation:
  language: ru
  text: Кто тайно клевещет на ближнего своего, того я истреблю; того, у кого надменный взгляд и гордое сердце[a], я не потерплю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «высокого глазами и широкого сердцем» — еврейский образ надменного взгляда и внутренней гордости.'
    reason: cultural_note
lexical_decisions:
- source_word: מְלוֹשְׁנִי
  choice: Кто… клевещет
  rationale: Причастная форма от לשׁן обозначает человека, злонамеренно порочащего другого словами. Конструкция «Кто… клевещет» естественно передаёт обобщённое значение в современном русском языке.
- source_word: בַסֵּתֶר
  choice: тайно
  rationale: Наречное употребление выражения «в укрытии / втайне» указывает на скрытый характер злословия.
- source_word: רֵעֵהוּ
  choice: ближнего своего
  rationale: רֵעַ обозначает другого человека из близкого общественного круга, не обязательно личного друга. Традиционное и понятное «ближний» сохраняет эту широту.
- source_word: אַצְמִית
  choice: я истреблю
  rationale: Каузативная форма от צמת выражает решительное устранение или уничтожение. «Истреблю» сохраняет суровую силу царского заявления, не уточняя способ наказания.
- source_word: גְּבַהּ עֵינַיִם
  choice: надменных глаз
  rationale: Буквально «высокий глазами»; образ обозначает высокомерие, проявляющееся во взгляде и поведении. Русское «надменных глаз» сохраняет конкретную метафору.
- source_word: וּרְחַב לֵבָב
  choice: и гордого сердца
  rationale: Буквально «широкий сердцем» — здесь идиома самонадеянности и заносчивости. Дословное «широкое сердце» в русском ошибочно означало бы великодушие.
- source_word: לֹא אוּכָל
  choice: я не потерплю
  rationale: Буквально «я не смогу» с подразумеваемым значением терпеть или выносить такого человека. «Не потерплю» естественно передаёт и невозможность, и твёрдый нравственный отказ.
theological_decisions:
- issue: Характер суда в царском этическом заявлении
  choice: Говорящий обещает решительно устранить клеветника и не допускать присутствия высокомерного человека, не уточняя конкретный способ наказания.
  alternative: Понимать стих либо как обещание буквальной казни, либо лишь как гиперболический отказ от общения.
  rationale: Глагол אַצְמִית выражает суровый суд, тогда как לֹא אוּכָל указывает на отказ терпеть такого человека. Перевод сохраняет напряжение между уничтожением и недопущением, не вводя не обозначенной в тексте правовой процедуры.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического и царского заявления. Инверсия «того я истреблю» сохраняет эмфатический порядок исходного текста; идиоматическое «гордого сердца» предотвращает неверное положительное понимание буквального образа.
