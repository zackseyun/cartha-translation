  yaml_path: translation/ot/psalms/101/006.yaml
  text: My eyes are on the faithful of the land[a], that they may dwell with me; he who walks in a blameless way[b], he shall serve me.
translation:
  language: ru
  text: 'Мои глаза обращены к верным в стране,

    чтобы они пребывали со мной;

    кто идёт безупречным путём[a],

    тот будет служить мне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «путём цельности» или «путём честности»; речь идёт о цельности и честности образа жизни, а не об абсолютной безгрешности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַי
  choice: Глаза мои — на
  rationale: Сохраняет конкретный образ еврейского текста и передаёт направленное внимание и благосклонность; тире делает эту конструкцию естественной по-русски.
- source_word: בְּנֶאֶמְנֵי אֶרֶץ
  choice: на верных в стране
  rationale: נֶאֱמָן обозначает верного, надёжного человека; אֶרֶץ в данном царском контексте естественно понимать как страну или землю правителя.
- source_word: לָשֶׁבֶת עִמָּדִי
  choice: чтобы они жили со мной
  rationale: יָשַׁב может означать «сидеть» или «жить, пребывать». Здесь форма с ל выражает цель, а «жили со мной» естественно передаёт постоянную близость к царю, не исключая придворного контекста.
- source_word: הֹלֵךְ
  choice: кто ходит
  rationale: Причастие описывает устойчивый образ жизни; русское «кто ходит» сохраняет библейскую метафору пути и обобщённый характер высказывания.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: путём непорочности
  rationale: דֶּרֶךְ метафорически означает образ жизни, а תָּמִים — цельность, безупречность и нравственную чистоту, но не абсолютную безгрешность.
- source_word: הוּא
  choice: тот
  rationale: 'Указательное «тот» естественно передаёт эмфатическое הוּא: именно человек с названным качеством достоин служить царю.'
- source_word: יְשָׁרְתֵנִי
  choice: будет служить мне
  rationale: שׁרת означает личное, нередко официальное служение. «Служить мне» сохраняет широту выражения и не придаёт ему исключительно культового смысла.
theological_decisions:
- issue: Нравственное требование к приближённым царя
  choice: Стих говорит о благосклонности псалмопевца к верным людям страны и называет непорочный образ жизни условием служения ему.
  alternative: Можно понимать стих уже — как описание отбора царских придворных и должностных лиц.
  rationale: Еврейский текст допускает как близкое пребывание при царе, так и официальное служение. Перевод сохраняет обе стороны и не сводит смысл только к дружескому общению или только к государственным назначениям.
