  rationale: Традиционное краткое чтение естественно допускает авторство, но еврейская конструкция сама по себе может обозначать также посвящение или связь; неоднозначность сохранена в сноске.
- issue: Смысл пары חֶסֶד וּמִשְׁפָּט
  choice: верная любовь и справедливость
  alternative: милость и суд
  rationale: Основной вариант отражает широкий заветный и этический смысл слов, а более узкий традиционный вариант приведён без устранения смыслового напряжения.
