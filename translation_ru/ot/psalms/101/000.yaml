  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, Yahweh[b], I will sing praise.
translation:
  language: ru
  text: 'Псалом Давида.[a]


    Буду петь о верной любви и справедливости;[b]


    Тебе, Яхве,[c] буду петь под музыку.'
  philosophy: optimal-equivalence
