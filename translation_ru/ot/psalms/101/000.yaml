- source_word: מִזְמוֹר
  choice: псалом
  rationale: Обычное и естественное русское обозначение культовой песни; сохраняет жанровое указание надписания.
- source_word: חֶסֶד
  choice: верная любовь
  rationale: Передаёт устойчивую, преданную любовь, часто подразумеваемую еврейским словом, не сужая его только до милости.
- source_word: מִשְׁפָּט
  choice: справедливость
  rationale: В данном нравственно-царском контексте слово обозначает справедливый суд и правый порядок; вариант «суд» отмечен в сноске.
- source_word: אֲזַמֵּרָה
  choice: буду петь хвалу
  rationale: Передаёт пение или музыкальное прославление естественным современным русским выражением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога как имя, а не заменяет его титулом «Господь».
