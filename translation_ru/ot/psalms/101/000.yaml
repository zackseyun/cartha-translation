    text: Еврейское выражение, переведённое как «Давида», может указывать на авторство, посвящение или связь с Давидом.
    reason: alternative_reading
  - marker: b
    text: 'Возможный перевод: «о милости и правосудии». Еврейские слова имеют более широкий смысл и могут подразумевать преданную любовь и справедливость.'
    reason: lexical_alternative
  - marker: c
    text: Яхве — личное имя Бога; в русских переводах его часто передают словом «Господь».
