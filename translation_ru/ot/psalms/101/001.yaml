  terminology: «Яхве» последовательно передаёт יהוה как имя. «Верная любовь» хорошо передаёт смысл חֶסֶד в данном контексте; «справедливость» естественна для מִשְׁפָּט. Сноски a и b привязаны к соответствующим выражениям и корректно обозначают альтернативы без догматического уточнения.
