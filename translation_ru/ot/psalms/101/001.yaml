id: PSA.101.1
reference: Psalms 101:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לְ/דָוִ֗ד מִ֫זְמ֥וֹר חֶֽסֶד וּ/מִשְׁפָּ֥ט אָשִׁ֑ירָה לְ/ךָ֖ יְהוָ֣ה אֲזַמֵּֽרָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/001.yaml
  text: Of David[a]. A psalm. I will sing of steadfast love and justice; to you, O Yahweh[b], I will sing praise.
translation:
  language: ru
  text: 'Давида[a]. Псалом.

    О верной любви и справедливости[b] я буду петь;

    Тебе, Яхве, буду петь хвалу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Давиду» или «для Давида». Надписание может указывать на авторство, посвящение, принадлежность или связь с Давидом.'
    reason: alternative_reading
  - marker: b
    text: 'Также возможно: «о милости и суде». Еврейские слова охватывают значения верной, неизменной любви и справедливого суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая форма надписания естественна для русского библейского стиля и сохраняет многозначность לְ: авторство, принадлежность, посвящение или связь с Давидом.'
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшийся и точный русский эквивалент обозначения культовой песни с музыкальным сопровождением.
- source_word: חֶסֶד
  choice: верная любовь
  rationale: Передаёт не только милость, но также постоянство, преданность и заветный оттенок еврейского חֶסֶד, не сводя его к одному узкому значению.
- source_word: וּמִשְׁפָּט
  choice: и справедливость
  rationale: В паре с חֶסֶד слово מִשְׁפָּט обозначает правосудие и справедливый порядок; «справедливость» здесь естественнее, чем более узкое «суд».
- source_word: אָשִׁירָה
  choice: я буду петь
  rationale: Когортатив выражает намерение или решимость; русская форма будущего времени ясно передаёт этот волевой оттенок.
- source_word: לְךָ
  choice: Тебе
  rationale: Сохраняет адресатную конструкцию еврейского текста и прямое обращение к Богу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом; «Яхве» — распространённая современная русская передача.
- source_word: אֲזַמֵּרָה
  choice: буду петь хвалу
  rationale: Передаёт значение хвалебного пения у זמר и при этом сохраняет смысловое отличие от более общего אָשִׁירָה в первой строке.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя יהוה. Передача «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Смысл пары חֶסֶד וּמִשְׁפָּט
  choice: верная любовь и справедливость
  alternative: милость и суд
  rationale: Выбранная формулировка сохраняет широкий заветный и этический диапазон обоих слов. Более традиционная пара возможна, но способна сузить חֶסֶד до сострадания, а מִשְׁפָּט — до отдельного судебного акта.
translation_notes:
  register: Современный литературный русский с лаконичным, достойным поэтическим строем. Инверсия «Тебе, Яхве» сохраняет прямое обращение и параллелизм, не создавая архаичной тяжеловесности.
