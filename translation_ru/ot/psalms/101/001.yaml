  source_fidelity: Текст точно передаёт надписание «Давида. Псалом» и обе когортативные формы как намеренное будущее действие. «Верная любовь и справедливость» уместно отражает пару חֶסֶד וּמִשְׁפָּט, не сужая её до «милости и суда». «Тебе, Яхве» верно передаёт прямое обращение с לְךָ и тетраграмматон. «Буду петь хвалу» является допустимой передачей אֲזַמֵּרָה, обозначающего хвалебное пение/музицирование.
