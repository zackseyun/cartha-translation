source:
  edition: WLC
  text: לֹֽא אָשִׁ֨ית לְ/נֶ֥גֶד עֵינַ֗/י דְּֽבַר בְּלִ֫יָּ֥עַל עֲשֹֽׂה סֵטִ֥ים שָׂנֵ֑אתִי לֹ֖א יִדְבַּ֣ק בִּֽ/י־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/003.yaml
  text: I will not set any worthless thing before my eyes[a]; I hate the work of those who turn aside[b]; it will not cling to me.
translation:
  language: ru
  text: Не поставлю перед глазами своими ничего негодного[a]. Ненавижу дело тех, кто уклоняется[b]; это не пристанет ко мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ничего порочного»; также возможно: «никакой негодной вещи» или «никакого негодного дела». Здесь еврейское слово בְּלִיָּעַל, вероятнее всего, означает негодность или порочность, а не имя собственное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дело отступников» или «поступки тех, кто идёт кривым путём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁית
  choice: поставлю
  rationale: Форма qal, имперфект 1-го лица единственного числа от שׂים означает «ставить, помещать». Будущее совершенного вида естественно передаёт твёрдое намерение говорящего.
- source_word: לְנֶגֶד עֵינַי
  choice: перед глазами своими
  rationale: Сохранён конкретный образ того, что человек намеренно помещает перед своим взором; порядок слов поддерживает возвышенный поэтический регистр.
- source_word: דְּבַר בְּלִיָּעַל
  choice: ничего негодного
  rationale: דבר здесь обозначает «вещь, дело, нечто», а בליעל — негодность или порочность. Отрицательное местоимение с родительным прилагательным звучит по-русски естественно и не превращает בליעל в имя собственное.
- source_word: עֲשֹׂה סֵטִים
  choice: дела тех, кто уклоняется
  rationale: עֲשֹׂה передаёт действие или дела, а סֵטִים характеризует людей, сворачивающих с верного пути. Перевод сохраняет образ уклонения, не уточняя без достаточных оснований, идёт ли речь об отступниках или вообще о людях извращённого поведения.
- source_word: שָׂנֵאתִי
  choice: ненавижу
  rationale: Хотя в еврейском употреблён перфект, здесь он выражает устойчивую, решительную позицию псалмопевца; настоящее время естественно передаёт этот смысл.
- source_word: לֹא יִדְבַּק בִּי
  choice: это ко мне не пристанет
  rationale: דבק означает «прилипать, приставать, держаться». «Не пристанет» сохраняет метафору нравственного зла, которое могло бы прикрепиться к говорящему; «это» оставляет референцию достаточно широкой.
theological_decisions:
- issue: Значение בְּלִיָּעַל
  choice: 'нарицательная характеристика: «негодное»'
  alternative: «нечто Велиарово» или «нечто порочное»
  rationale: В данном контексте слово естественнее понимать как обозначение негодности или зла, а не как имя демонической личности. Так перевод не привносит в текст более позднюю персонификацию.
- issue: Кого обозначает סֵטִים
  choice: «те, кто уклоняется»
  alternative: «отступники» или «люди развращённые»
  rationale: Буквальный образ отклонения от пути допускает разные степени нравственного или религиозного отступления. Перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Конкретный образ «перед глазами» и метафора прилипания сохранены; архаизмы и конфессионально маркированные выражения не используются.
