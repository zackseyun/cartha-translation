  text: לַ/בְּקָרִ֗ים אַצְמִ֥ית כָּל רִשְׁעֵי אָ֑רֶץ לְ/הַכְרִ֥ית מֵֽ/עִיר יְ֝הוָ֗ה כָּל פֹּ֥עֲלֵי אָֽוֶן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/008.yaml
  text: Morning by morning I will destroy all the wicked of the land[b][a], cutting off from the city of Yahweh all workers of iniquity.
translation:
  language: ru
  text: Каждое утро я буду истреблять всех нечестивых в стране[a], чтобы искоренить из города Яхве[b] всех творящих беззаконие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех нечестивых на земле». Еврейское אֶרֶץ может означать как страну, так и землю в более широком смысле; здесь «страна» лучше соответствует царскому контексту псалма.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское имя יהוה передано как «Яхве»; традиционная передача — «Господь». Встречается также форма «Иегова».
    reason: alternative_reading
lexical_decisions:
- source_word: לַבְּקָרִים
  choice: Каждое утро
  rationale: Форма множественного числа с предлогом выражает повторяемость действия; современное русское «каждое утро» естественно передаёт этот распределительный смысл.
- source_word: אַצְמִית
  choice: я буду истреблять
  rationale: Порода hифиль глагола צמת означает погубить, уничтожить. Несовершенный вид по-русски согласуется с повторяемостью, обозначенной выражением «каждое утро».
- source_word: כָּל רִשְׁעֵי אָרֶץ
  choice: всех нечестивых в стране
  rationale: Субстантивированное множественное число רִשְׁעֵי передано как «нечестивых», а אָרֶץ — как «стране» ввиду царского и административного контекста псалма. Более буквальная родительная конструкция звучала бы по-русски менее естественно.
- source_word: לְהַכְרִית
  choice: чтобы искоренить
  rationale: Инфинитив hифиль выражает цель предшествующего действия. «Искоренить» сохраняет смысл полного удаления и судебную силу образа «отсечь».
- source_word: מֵעִיר יְהוָה
  choice: из города Яхве
  rationale: Передана принадлежность города Яхве с сохранением торжественной и компактной структуры исходного выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом; примечание сообщает традиционный вариант.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: всех творящих беззаконие
  rationale: Оборот сохраняет деятельный смысл причастия פֹּעֲלֵי («делающие, совершающие») и нравственно-судебный вес существительного אָוֶן.
theological_decisions:
- issue: Объём значения אָרֶץ
  choice: страна
  alternative: земля, весь мир
  rationale: Речь царя об очищении своей области и особенно «города Яхве» указывает на конкретную страну как сферу его правления, хотя лексически возможно и более широкое значение.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: Исходный текст непосредственно употребляет тетраграмматон. Транслитерация сохраняет личное имя, а традиционная замена титулом отмечена в сноске.
- issue: Характер царского суда
  choice: сохранены сильные глаголы «истреблять» и «искоренить»
  alternative: смягчённые формулировки «положить конец» или «удалить»
  rationale: Глаголы צמת и כרת выражают суровое уничтожение или отсечение. Перевод не смягчает напряжённость текста и не уточняет сверх сказанного способ исполнения суда.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис сделан естественным для русского: повторяемость выражена словами «каждое утро», а целевое значение инфинитива — союзом «чтобы». Архаизмы и конфессионально маркированные формулы не используются.'
