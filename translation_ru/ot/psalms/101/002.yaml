  text: אַשְׂכִּ֤ילָה בְּ/דֶ֬רֶךְ תָּמִ֗ים מָ֭תַי תָּב֣וֹא אֵלָ֑/י אֶתְהַלֵּ֥ךְ בְּ/תָם לְ֝בָבִ֗/י בְּ/קֶ֣רֶב בֵּיתִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/002.yaml
  text: I will give attention to the blameless way—when will you come to me? I will walk with integrity of heart within my house[a][b].
translation:
  language: ru
  text: Буду внимателен к непорочному пути — когда ты придёшь ко мне? Буду ходить с чистым сердцем в своём доме[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы первой части стиха: «Буду размышлять о непорочном пути» или «Буду поступать мудро на непорочном пути». В еврейском тексте сказано: «когда ты придёшь ко мне?»; кто именно имеется в виду, прямо не назван. Многие понимают это как обращение к Богу. Буквально далее: «в непорочности (или цельности) моего сердца, внутри моего дома».'
    reason: Передаёт лексические альтернативы для אַשְׂכִּילָה, сохраняет неоднозначность невыраженного субъекта и поясняет более буквальное значение заключительной части.
lexical_decisions:
- source_word: אַשְׂכִּילָה
  choice: Буду внимателен
  rationale: Форма hифиль от שׂכל может означать как благоразумное поведение, так и вдумчивое внимание. В сочетании с этическим образом пути перевод передаёт сознательную направленность на непорочную жизнь, не сводя смысл к одному лишь размышлению.
- source_word: בְּדֶרֶךְ תָּמִים
  choice: к непорочному пути
  rationale: דֶּרֶךְ сохраняет метафору образа жизни, а תָּמִים обозначает нравственную цельность и непорочность, а не абсолютное безгрешное совершенство.
- source_word: מָתַי תָּבוֹא אֵלָי
  choice: когда Ты придёшь ко мне?
  rationale: Глагол стоит во втором лице мужского рода единственного числа, поэтому прямое обращение сохранено. Прописная буква отражает наиболее вероятное обращение к Богу, однако имя субъекта в текст не добавлено.
- source_word: אֶתְהַלֵּךְ
  choice: Буду ходить
  rationale: Сохранена библейская этическая метафора хождения как образа поведения и жизни.
- source_word: בְּתָם לְבָבִי
  choice: в чистоте сердца
  rationale: תֹּם выражает цельность, непорочность и искренность. Русское «чистота сердца» естественно передаёт внутреннюю нравственную цельность, хотя «цельность сердца» возможно как более буквальная альтернатива.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: среди дома моего
  rationale: Перевод близко передаёт пространственное בְּקֶרֶב и одновременно охватывает домашнюю сферу жизни; инверсия придаёт строке достоинство без архаической неясности.
theological_decisions:
- issue: Не названный прямо субъект слов «когда придёшь ко мне?»
  choice: Сохранить обращение во втором лице и не добавлять в основной текст слово «Бог» или «Господь».
  alternative: Понимать эти слова как обращение к Богу; менее вероятно — связывать приход с непорочным путём.
  rationale: Еврейский глагол имеет форму второго лица мужского рода единственного числа, но субъект существительным не обозначен. Контекст допускает и, вероятно, поддерживает обращение к Богу, однако перевод не должен делать скрытый субъект явным.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Сохранены метафоры пути и хождения; избегнуты как разговорность, так и излишняя церковнославянская архаика. Маркер [a] помещён в основной текст.
