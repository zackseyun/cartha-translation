  text: לֵבָ֣ב עִ֭קֵּשׁ יָס֣וּר מִמֶּ֑/נִּי רָ֝֗ע לֹ֣א אֵדָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/004.yaml
  text: A crooked heart will depart from me[a]; I will not know evil.
translation:
  language: ru
  text: Порочное сердце отступит от меня; зла я не буду знать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или по смыслу: «не буду иметь ничего общего со злом». Буквально в еврейском тексте: «не буду знать зла».'
    reason: Лексическая альтернатива поясняет возможный идиоматический смысл глагола ידע как отказ от связи или участия во зле, сохраняя буквальную формулировку в основном тексте.
lexical_decisions:
- source_word: לֵבָב
  choice: сердце
  rationale: В библейском иврите слово обозначает внутреннего человека, включая волю и мысли. «Сердце» сохраняет образ и естественно передаёт нравственный смысл.
- source_word: עִקֵּשׁ
  choice: кривое
  rationale: Прилагательное описывает нравственную искривлённость, порочность. «Кривое» сохраняет исходную метафору отклонения от прямого пути и остаётся понятным по-русски.
- source_word: יָסוּר
  choice: удалится
  rationale: Глагол סור означает «отойти», «удалиться», «уклониться». Будущее время сохраняет форму программного заявления псалмопевца, не превращая её явно ни в приказ, ни в описание принудительного изгнания.
- source_word: מִמֶּנִּי
  choice: от меня
  rationale: Предлог מן с местоименным суффиксом выражает удаление или отделение от говорящего.
- source_word: רָע
  choice: зла
  rationale: Слово имеет общее нравственное значение и не уточняет конкретного вида зла; русское «зло» сохраняет эту широту.
- source_word: לֹא אֵדָע
  choice: знать не буду
  rationale: Основное значение ידע — «знать», но здесь выражение может подразумевать признание, близость или участие. Буквальная формулировка сохранена в тексте, а идиоматический смысл указан в сноске.
theological_decisions:
- issue: Смысл «знать» применительно ко злу
  choice: Сохранить в основном тексте выражение «зла я знать не буду», допускающее подразумеваемый отказ от причастности ко злу.
  alternative: «Не буду иметь ничего общего со злом».
  rationale: Контекст псалма поддерживает этический отказ от связи со злом, однако буквальное «знать» сохраняет многозначность еврейского выражения и его богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «зла я знать не буду» передаёт эмфазу вынесенного вперёд רָע и звучит естественно для псалма; метафора «кривого сердца» намеренно сохранена.
