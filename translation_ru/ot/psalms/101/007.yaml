source:
  edition: WLC
  text: לֹֽא יֵשֵׁ֨ב בְּ/קֶ֥רֶב בֵּיתִ/י֮ עֹשֵׂ֪ה רְמִ֫יָּ֥ה דֹּבֵ֥ר שְׁקָרִ֑ים לֹֽא יִ֝כּ֗וֹן לְ/נֶ֣גֶד עֵינָֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/101/007.yaml
  text: One who practices deceit will not dwell within my house[b][a]; one who speaks lies will not stand before my eyes.
translation:
  language: ru
  text: Кто поступает коварно, не будет жить в моём доме[a]; кто говорит ложь, не устоит перед моими глазами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кто делает коварство»; форма выражает постоянное, характерное поведение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будет утверждён перед моими глазами»; еврейский глагол может означать «быть утверждённым», «стоять прочно» или «устоять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: не будет жить
  rationale: Глагол обозначает «сидеть, жить, пребывать». При בֵּיתִי естественное русское «жить в моём доме» передаёт длительное пребывание и допуск в царский дом.
- source_word: בְּקֶרֶב בֵּיתִי
  choice: в моём доме
  rationale: Буквально «внутри / посреди моего дома». По-русски краткое «в моём доме» естественно выражает принадлежность к внутреннему кругу дома, не вводя дополнительного толкования.
- source_word: עֹשֵׂה רְמִיָּה
  choice: кто поступает коварно
  rationale: Причастная конструкция описывает характерное, повторяющееся поведение. «Поступает коварно» сохраняет деятельный смысл; возможная более буквальная передача вынесена в примечание.
- source_word: דֹּבֵר שְׁקָרִים
  choice: кто говорит ложь
  rationale: Причастие указывает на характерное поведение, а שְׁקָרִים — на ложные слова. Формулировка сохраняет глагольную параллель с первой половиной стиха.
- source_word: יִכּוֹן
  choice: не устоит
  rationale: Нифаль глагола כון может означать «быть утверждённым, прочно стоять, устоять». «Не устоит» сохраняет образ стойкого положения перед глазами говорящего, не сводя смысл однозначно к физическому стоянию.
- source_word: לְנֶגֶד עֵינַי
  choice: перед моими глазами
  rationale: Передана буквальная образность еврейского выражения, включающая нахождение в поле зрения и присутствии говорящего.
theological_decisions:
- issue: Кого и откуда исключает говорящий
  choice: Сохранено личное царское решение о том, кто может жить в его доме и находиться перед его глазами.
  alternative: Истолковать «мой дом» как дом Бога либо как метафору внутренней нравственной чистоты.
  rationale: Контекст Псалма 101 представляет решение царя о порядке в своём доме и правлении. Формы первого лица не следует без текстового основания переносить на Бога или спиритуализировать.
- issue: Значение יִכּוֹן перед лицом говорящего
  choice: «Не устоит» — формулировка, сохраняющая возможность значения «не будет утверждён / не останется».
  alternative: «Не предстанет» или «не останется».
  rationale: Еврейский глагол допускает оттенки утверждённости, прочности и продолжения присутствия. Перевод не должен чрезмерно сужать эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Синтаксический параллелизм двух причастных характеристик сохранён конструкцией «кто…; кто…». Все местоимения первого лица оставлены без богословской конкретизации.
