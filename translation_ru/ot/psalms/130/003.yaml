  yaml_path: translation/ot/psalms/130/003.yaml
  text: If you[a], Yah, should keep watch over iniquities, Lord, who could stand?
translation:
  language: ru
  text: Если Ты, Ях, будешь вести счёт беззакониям[a], Господи, кто устоит?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будешь отмечать беззакония»; «будешь хранить в памяти беззакония». Еврейский глагол буквально означает «хранить, стеречь, следить»; здесь он говорит об учёте проступков.'
    reason: Лексическая альтернатива и пояснение контекстуального смысла глагола שׁמר.
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Передаёт условный союз прямо и естественно; значение предположительности дополнительно выражено будущим временем.
- source_word: עֲוֺנוֹת
  choice: беззакониями
  rationale: Сохраняет нравственную тяжесть עָוֹן и его оттенок виновности, не сводя слово к общему обозначению греха.
- source_word: תִּשְׁמָר
  choice: будешь следить за
  rationale: Сохраняет основной образ глагола שׁמר — следить, хранить, стеречь; в контексте речь идёт об учёте проступков, что поясняется в сноске.
- source_word: יָהּ
  choice: Ях
  rationale: Передаёт краткую поэтическую форму Божьего имени транслитерацией и отличает её от титула אֲדֹנָי в той же строке.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Вокативная форма естественно передаёт божественный титул в прямом обращении.
- source_word: מִי
  choice: кто
  rationale: Прямое соответствие вопросительному местоимению.
- source_word: יַעֲמֹד
  choice: устоит
  rationale: Передаёт не только физическое стояние, но и способность выдержать Божий суд, сохраняя риторическую силу вопроса.
theological_decisions:
- issue: Различение יָהּ и אֲדֹנָי
  choice: «Ях» и «Господи»
  alternative: Передать оба именования словом «Господь» либо передать יָהּ как «Господь»
  rationale: В еврейском стихе стоят два разных божественных именования. Их различение сохраняет поэтическую форму имени и последующий титул, не сглаживая структуру обращения.
- issue: Смысл Божьего наблюдения в תִּשְׁמָר
  choice: «будешь следить за беззакониями» с пояснительной сноской
  alternative: «будешь учитывать беззакония»; «будешь вести счёт грехам»; «будешь ставить беззакония в вину»
  rationale: Основной текст сохраняет образ наблюдения/хранения, а сноска раскрывает контекстуальный смысл ведения счёта проступкам. Это не сужает фразу исключительно до судебной формулы.
translation_notes:
  register: Современный литературный русский язык с поэтически сжатой структурой. Формы «Ты» и «Господи» поддерживают достоинство прямого обращения; редкое имя «Ях» точно сохраняет краткую еврейскую форму и не смешивает её с титулом.
