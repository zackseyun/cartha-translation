source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֑וֹת מִ/מַּעֲמַקִּ֖ים קְרָאתִ֣י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/001.yaml
  text: A Song of Ascents[a]. Out of the depths I cry to you[b], O Yahweh.
translation:
  language: ru
  text: Песнь восхождений[a]. Из глубин взываю к Тебе[b], Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Песнь восхождений» — традиционное надписание этой группы псалмов.'
    reason: cultural_note
  - marker: b
    text: 'Или: «Из глубин я воззвал к Тебе, Яхве». Еврейскую глагольную форму можно понимать как прошедшее время; в основном тексте настоящее время сохраняет непосредственность молитвы псалмопевца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר
  choice: Песнь
  rationale: Существительное означает «песня, песнь». В надписании псалма «песнь» звучит естественно и возвышенно, не подменяя исходное жанровое обозначение словом «псалом».
- source_word: הַמַּעֲלוֹת
  choice: восхождений
  rationale: Множественное число от корня עלה («подниматься, восходить») передано традиционным названием этой группы псалмов без уточнения спорного исторического смысла выражения.
- source_word: מִמַּעֲמַקִּים
  choice: Из глубин
  rationale: Сохраняет образ множественных «глубин», метафорически обозначающих крайнее бедствие, и естественно звучит по-русски.
- source_word: קְרָאתִיךָ
  choice: взываю к Тебе
  rationale: Глагол קרא означает «звать, призывать, взывать». Настоящее время передаёт непосредственность совершаемой молитвы, тогда как форма qatal допускает также перевод прошедшим временем; «взываю» естественно выражает напряжённый молитвенный призыв.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; форма «Яхве» сохраняет личное имя и наиболее вероятную реконструкцию его произношения.
- issue: Временной оттенок קְרָאתִיךָ
  choice: 'настоящее время: «взываю»'
  alternative: 'прошедшее время: «воззвал» или «воззвал я»'
  rationale: Форма qatal допускает понимание как совершившегося призыва, однако в прямой поэтической молитве настоящее время естественно передаёт непосредственность обращения. Альтернатива сохранена в примечании, чтобы не устранять грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Синтаксис краткий и ясный; прописное «Тебе» следует принятой русской практике благоговейного обращения к Богу. Образ «глубин» и неоднозначность времени глагола сохранены.
