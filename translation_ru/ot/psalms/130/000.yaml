  text: שִׁ֥יר הַֽ/מַּעֲל֑וֹת מִ/מַּעֲמַקִּ֖ים קְרָאתִ֣י/ךָ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/000.yaml
  text: A Song of Ascents[a]. Out of the depths I have called to you[b], Yahweh.
translation:
  language: ru
  text: 'Песнь восхождений.[a]


    Из глубин я воззвал к Тебе, Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Песнь восхождений» — традиционное заглавие этой группы псалмов. Возможно, речь идёт о восхождении паломников в Иерусалим, но точное значение названия неясно.'
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Традиционное обозначение этой группы псалмов; множественное число «восхождений» формально передаёт еврейскую конструкцию и сохраняет открытым её историческое значение.
- source_word: מִמַּעֲמַקִּים
  choice: Из глубин
  rationale: Передаёт пространственный образ множественного числа, который в контексте выражает крайнюю беду и отчаяние, не заменяя образ истолкованием.
- source_word: קְרָאתִיךָ
  choice: я взываю к Тебе
  rationale: Глагол קרא здесь означает обращённый к Богу настойчивый призыв. Настоящее время естественно передаёт непосредственность молитвы, тогда как возможное прошедшее отражено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом «Господь».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господи
  rationale: Личное имя сохранено явно, поскольку исходный текст употребляет тетраграмматон; звательная функция выражена контекстом обращения.
- issue: Временная форма קְרָאתִיךָ
  choice: настоящее время «взываю»
  alternative: прошедшее время «воззвал» или «воззвал я»
  rationale: Еврейский перфект допускает понимание как совершившегося обращения, но в живой молитвенной речи настоящее время сохраняет непосредственность воззвания. Альтернатива указана, чтобы не устранять грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим строем. Сохранены образ «глубин», традиционный жанровый заголовок и личное имя Бога; прописная буква в «Тебе» соответствует принятому русскому благоговейному употреблению без добавления толкования.
