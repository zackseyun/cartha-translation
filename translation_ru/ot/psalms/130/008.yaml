  yaml_path: translation/ot/psalms/130/008.yaml
  text: And he will redeem Israel from all his iniquities[a].
translation:
  language: ru
  text: И Он избавит Израиль от всех его беззаконий[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, если иметь в виду множество людей, составляющих Израиль: «от всех их беззаконий». В еврейском тексте «Израиль» представлен как единое целое, поэтому употреблено местоимение единственного числа — «его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: И Он
  rationale: Союз וְ передаёт продолжение мысли словом «И», а самостоятельное местоимение הוּא сохраняется без усилительного «Сам», которое было бы избыточно.
- source_word: יִפְדֶּה
  choice: искупит
  rationale: Глагол פדה обозначает освобождение посредством выкупа или избавление от обязательства; «искупит» естественно передаёт этот смысл и соответствует контексту избавления от беззаконий.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Частица служит показателем определённого прямого дополнения и не имеет отдельного соответствия в русском тексте.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Собственное имя сохранено в общепринятой русской форме; здесь оно обозначает народ как единое целое.
- source_word: מִכֹּל
  choice: от всех
  rationale: Предлог מִן с כֹּל выражает полное освобождение от всей совокупности названного далее.
- source_word: עֲוֺנֹתָיו
  choice: его беззаконий
  rationale: עָוֹן передано как «беззаконие», поскольку слово может включать нравственную вину, а суффикс 3-го лица мужского рода единственного числа сохранён как «его» и относится к собирательному имени «Израиль».
theological_decisions:
- issue: Единственное число местоименного суффикса при собирательном имени «Израиль»
  choice: «его беззаконий»
  alternative: «их беззаконий»
  rationale: Масоретский текст представляет Израиль как единое собирательное целое и использует суффикс мужского рода единственного числа. Русское «его» естественно сохраняет и грамматику, и корпоративный образ, не устраняя содержащуюся в тексте связь единого народа с множеством его беззаконий.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Порядок слов сделан естественным для русского языка; конструкция «его беззаконий» сохраняет собирательное единственное число оригинала.
