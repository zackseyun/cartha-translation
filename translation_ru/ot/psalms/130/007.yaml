  yaml_path: translation/ot/psalms/130/007.yaml
  text: Israel[a], wait for Yahweh, for with Yahweh there is steadfast love, and with him is abundant redemption.
translation:
  language: ru
  text: Израиль, надейся на Яхве[a], ведь у Яхве — неизменная любовь, и у Него — избавление в изобилии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с надеждой ожидай Яхве». Еврейский глагол сочетает значения надежды и терпеливого ожидания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֵל ... אֶל יְהוָה
  choice: надейся на Яхве
  rationale: Глагол יחל выражает полное надежды ожидание. Русское «надейся на» естественно передаёт направленное к Богу упование; оттенок терпеливого ожидания сохранён в сноске.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Собственное имя народа передано в принятой русской форме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для призыва; «ведь» естественно связывает обе части русского поэтического высказывания.
- source_word: עִם יְהוָה
  choice: у Яхве
  rationale: Русская конструкция «у кого-либо есть» идиоматически передаёт еврейское עִם («с, при») в значении того, что находится у Бога, сохраняя параллель с עִמּוֹ.
- source_word: הַחֶסֶד
  choice: неизменная любовь
  rationale: חֶסֶד обозначает верную, постоянную любовь. Выбор передаёт и любовь, и её стойкость, не сводя смысл только к милости или к техническому понятию завета.
- source_word: וְהַרְבֵּה
  choice: в изобилии
  rationale: Форма указывает на обилие; предложная конструкция звучит естественно с «избавлением».
- source_word: עִמּוֹ
  choice: у Него
  rationale: 'Сохраняется повтор и параллелизм: «у Яхве… у Него…».'
- source_word: פְדוּת
  choice: избавление
  rationale: פדות означает выкуп, освобождение или избавление. В данном псалме «избавление» понятно современному читателю и согласуется с глаголом «избавит» в следующем стихе, сохраняя идею освобождения ценой выкупа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; «Яхве» непосредственно передаёт тетраграмматон, не подменяя его титулом.
- issue: Смысл יחל в призыве
  choice: надейся на Яхве
  alternative: жди Яхве
  rationale: Глагол объединяет надежду и терпеливое ожидание. Основной текст использует естественное русское выражение об уповании, а оттенок ожидания явно отмечен в сноске.
- issue: Смысл חֶסֶד
  choice: неизменная любовь
  alternative: милость; верность завету
  rationale: Перевод удерживает одновременно личностный аспект любви и её постоянство, не ограничивая многозначный термин одной богословской формулой.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Повтор «у Яхве… у Него…» сохраняет еврейский параллелизм; тире подчёркивают ритм и не добавляют нового смыслового отношения.
