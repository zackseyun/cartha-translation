lexical_decisions:
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Буквально «моя душа»; в поэтическом контексте обозначает самого говорящего в его глубоком уповании и сохраняет образность еврейского текста.
- source_word: לַאדֹנָי
  choice: Господа
  rationale: Предлог ל указывает на того, к кому обращено ожидание. При восстановленном из контекста глаголе «ждёт» форма «Господа» естественна по-русски.
- source_word: מִשֹּׁמְרִים
  choice: больше, чем стражи
  rationale: Предлог מִן выражает сравнение, а причастие שֹׁמְרִים обозначает тех, кто несёт стражу и ожидает окончания ночи.
- source_word: לַבֹּקֶר
  choice: утра
  rationale: בֹּקֶר означает «утро»; русское управление «ждать утра» естественно передаёт направленность ожидания.
- source_word: שֹׁמְרִים לַבֹּקֶר
  choice: стражи — утра
  rationale: Повтор сохранён ради поэтического усиления. Тире обозначает подразумеваемое «ждут» и позволяет не сглаживать лаконичную структуру еврейской строки.
theological_decisions:
- issue: Передача אֲדֹנָי как божественного титула
  choice: Господь
  alternative: мой Владыка
  rationale: В данном псалме титул относится к Богу. «Господь» — ясная, благоговейная и устоявшаяся русская передача, не привносящая конфессионально специфического толкования.
- issue: Восстановление отсутствующего глагола
  choice: ждёт
  alternative: 'оставить без явного глагола: «Душа моя — к Господу»'
  rationale: В еврейском стихе сказуемое не выражено, однако контекст Пс 130:5 прямо задаёт ожидание Господа. «Ждёт» делает фразу понятной по-русски, а подлинная синтаксическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтической краткости и усилительного повтора оригинала. Инверсия «душа моя» поддерживает достоинство псалмовой речи, оставаясь понятной современному читателю.
