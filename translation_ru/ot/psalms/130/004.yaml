  text: כִּֽי עִמְּ/ךָ֥ הַ/סְּלִיחָ֑ה לְ֝מַ֗עַן תִּוָּרֵֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/004.yaml
  text: But with you there is forgiveness[a], so that you may be feared.
translation:
  language: ru
  text: Но у Тебя — прощение, чтобы Тебя боялись.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы перед Тобой благоговели». В еврейском тексте буквально: «боялись»; здесь страх может включать благоговение и трепет перед Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: В контексте частица вводит противопоставление невозможности устоять перед строгим судом в предыдущем стихе; русское «но» естественно передаёт этот оттенок.
- source_word: עִמְּךָ
  choice: у Тебя
  rationale: Русская конструкция «у Тебя» идиоматично выражает мысль, что прощение находится у Бога и исходит от Него, сохраняя значение еврейского עִם с местоименным суффиксом.
- source_word: הַסְּלִיחָה
  choice: прощение
  rationale: Слово обозначает прощение или отпущение вины; «прощение» ясно, современно и сохраняет богословскую весомость.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Союз сохраняет возможный оттенок цели или результата, не уточняя сверх текста точное логическое соотношение.
- source_word: תִּוָּרֵא
  choice: Тебя боялись
  rationale: Нифаль от ירא буквально означает «быть предметом страха»; перевод сохраняет еврейскую лексику и библейское напряжение между страхом и благоговением.
theological_decisions:
- issue: Какой отклик вызывает Божье прощение
  choice: Прощение ведёт к тому, что Бога боятся; основной текст сохраняет буквальное «боялись».
  alternative: «Чтобы Тебя почитали» или «чтобы перед Тобой благоговели».
  rationale: Еврейский текст прямо употребляет ירא («бояться»). Более мягкий перевод устранил бы важное богословское напряжение; примечание поясняет возможный оттенок благоговейного страха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Тебя» написано с прописной буквы как принятое в русской религиозной письменности уважительное обращение к Богу. Тире после «Тебя» подчёркивает контраст и естественно передаёт именную конструкцию.
