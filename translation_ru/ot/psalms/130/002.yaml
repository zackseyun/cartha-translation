  source_fidelity: 'Перевод точно передаёт структуру и лексику масоретского текста: обращение אֲדֹנָי («Господи»), просьбу שִׁמְעָה («услышь»), повтор «голос», желательное значение תִּהְיֶינָה («да будут») и конкретный образ «уши Твои». «Молений о милости» адекватно передаёт תַּחֲנוּנַי как настойчивые просьбы о милости, не сужая смысл доктринально.'
