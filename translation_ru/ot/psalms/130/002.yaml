  text: אֲדֹנָ/י֮ שִׁמְעָ֪/ה בְ/ק֫וֹלִ֥/י תִּהְיֶ֣ינָה אָ֭זְנֶי/ךָ קַשֻּׁב֑וֹת לְ֝/ק֗וֹל תַּחֲנוּנָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/002.yaml
  text: Lord[a], hear my voice; let your ears be attentive to the voice of my pleas for mercy.
translation:
  language: ru
  text: Господи, услышь мой голос; да будут уши Твои внимательны к голосу моих молений о милости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Еврейское אֲדֹנָי здесь является обращением к Богу; русский звательный облик «Господи» естественно и точно передаёт молитвенное обращение, не смешивая этот титул с тетраграмматоном.
- source_word: שִׁמְעָה
  choice: услышь
  rationale: Форма выражает прямую молитвенную просьбу. «Услышь» сохраняет её силу и соответствует естественному русскому языку молитвы.
- source_word: בְּקוֹלִי
  choice: мой голос
  rationale: Сохраняется конкретный образ еврейского текста; сочетание «услышь мой голос» естественно по-русски.
- source_word: תִּהְיֶינָה
  choice: да будут
  rationale: Имперфект имеет здесь желательное, молитвенное значение; конструкция «да будут» передаёт его ясно и торжественно.
- source_word: אָזְנֶיךָ
  choice: уши Твои
  rationale: Сохранён конкретный антропоморфный образ исходного текста, а не заменён отвлечённым «вниманием» или пересказом «внимательно слушай».
- source_word: קַשֻּׁבוֹת
  choice: внимательны
  rationale: Прилагательное обозначает сосредоточенное слушание; «внимательны» ясно и естественно сочетается с сохранённым образом ушей.
- source_word: לְקוֹל
  choice: к голосу
  rationale: Передаёт повтор слова קוֹל и тем самым сохраняет лексический параллелизм стиха.
- source_word: תַּחֲנוּנָי
  choice: моих молений о милости
  rationale: Слово обозначает настойчивые просьбы о благосклонности или милости. «Моления о милости» сохраняет молитвенный регистр и смысл лучше, чем одно общее «просьбы».
theological_decisions:
- issue: Антропоморфный образ Божьего слуха
  choice: Сохранить выражение «уши Твои внимательны»
  alternative: 'Передать описательно: «внимательно выслушай меня»'
  rationale: Еврейский текст прямо использует образ ушей. Его сохранение передаёт поэтическую конкретность и близость молитвенного обращения, не превращая образ в утверждение о телесности Бога.
- issue: Смысл תַּחֲנוּנָי в покаянной молитве
  choice: «молений о милости»
  alternative: «моих молений» или «моих прошений»
  rationale: Перевод выражает просьбу о милостивом благоволении, заложенную в слове, но не добавляет более узкого догматического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Сохранены повтор «голос» и конкретный образ «уши Твои». Местоимение «Твои» написано с прописной буквы как принятая в русском религиозном тексте форма почтительного обращения; это типографическое решение не меняет смысла оригинала.
