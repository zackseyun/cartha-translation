  text: קִוִּ֣יתִי יְ֭הוָה קִוְּתָ֣ה נַפְשִׁ֑/י וְֽ/לִ/דְבָר֥/וֹ הוֹחָֽלְתִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/130/005.yaml
  text: I wait for Yahweh[a]; my soul waits[b], and in his word I hope.
translation:
  language: ru
  text: Я жду Яхве[a]; душа моя ждёт, и на его слово[b] я надеюсь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я ожидал Яхве; душа моя ожидала». Еврейские формы могут указывать как на уже проявившееся, твёрдо принятое ожидание, так и на сохраняющуюся в настоящем позицию.'
    reason: лексическая и грамматическая альтернатива
  - marker: b
    text: 'Или: «на его обещание». Еврейское слово может означать сказанное Богом вообще или, по смыслу, его обещание.'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: קִוִּיתִי
  choice: Я жду
  rationale: Глагол קוה выражает ожидание, соединённое с надеждой. Настоящее время естественно передаёт сохраняющуюся позицию псалмопевца, а возможность перфектного оттенка отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: קִוְּתָה
  choice: душа моя ждёт
  rationale: Повтор корня קוה сохранён, как и поэтический параллелизм. נַפְשִׁי передано традиционно и понятно — «душа моя», то есть внутреннее существо, сам человек.
- source_word: לִדְבָרוֹ
  choice: на его слово
  rationale: דבר здесь может обозначать сказанное Богом вообще либо, по смыслу, его обещание. Русское сочетание «надеяться на слово» естественно выражает основание надежды, не сужая значение до обещания.
- source_word: הוֹחָלְתִּי
  choice: я надеюсь
  rationale: Глагол יחל сочетает значения ожидания и надежды. «Надеюсь» сохраняет смысловое родство с קוה, но отражает употребление в исходнике другого глагола.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя, поэтому транслитерация «Яхве» точнее сохраняет исходную форму, не подменяя её титулом.
- issue: Значение דְבָרוֹ
  choice: его слово
  alternative: его обещание
  rationale: «Слово» сохраняет более широкое значение еврейского דבר; понимание как обещания возможно по контексту, но не должно без необходимости закрепляться в основном тексте.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Сохранены повтор глагола ожидания, выражение «душа моя» и смысловая напряжённость между ожиданием и надеждой.
