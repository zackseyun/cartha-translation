  text: מֵ֥/אִתְּ/ךָ֗ תְֽהִלָּ֫תִ֥/י בְּ/קָהָ֥ל רָ֑ב נְדָרַ֥/י אֲ֝שַׁלֵּ֗ם נֶ֣גֶד יְרֵאָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/025.yaml
  text: From you comes my praise in the great assembly[a]; I will pay my vows before those who fear him.
translation:
  language: ru
  text: От Тебя исходит моя хвала в великом собрании; обеты мои исполню перед теми, кто боится Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по еврейскому тексту: «боится Его»; в некоторых переводах местоимение согласовано с предшествующим прямым обращением: «боится Тебя».'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵאִתְּךָ
  choice: От Тебя исходит
  rationale: 'Предлог с суффиксом 2-го лица указывает на источник: хвала псалмопевца исходит от Бога. Глагол «исходит» добавлен для естественного русского синтаксиса.'
- source_word: תְהִלָּתִי
  choice: моя хвала
  rationale: Существительное прямо обозначает хвалу; перевод не добавляет отсутствующего в тексте указания на песнь или жертву.
- source_word: בְּקָהָל רָב
  choice: в великом собрании
  rationale: קָהָל — собравшаяся община, а רָב характеризует собрание как великое или многочисленное. «Великое собрание» сохраняет поэтический и торжественный регистр.
- source_word: נְדָרַי
  choice: обеты мои
  rationale: Форма множественного числа означает обеты, данные Богу. Инверсия сохраняет поэтическое звучание и акцент исходной строки.
- source_word: אֲשַׁלֵּם
  choice: исполню
  rationale: В сочетании с обетами piel глагола שׁלם означает выполнить обещанное. Современное русское «исполню обеты» естественнее архаичного «воздам/заплачу обеты».
- source_word: נֶגֶד
  choice: перед
  rationale: Предлог выражает совершение действия в присутствии и на виду у названных людей.
- source_word: יְרֵאָיו
  choice: теми, кто боится Его
  rationale: Причастная форма с суффиксом 3-го лица буквально указывает на тех, кто боится Его. Глагол «боится» сохраняет библейское понятие благоговейного страха, не сводя его лишь к почтению.
theological_decisions:
- issue: Переход от обращения во втором лице («Тебя») к местоимению третьего лица в יְרֵאָיו
  choice: 'Сохранить масоретский переход: «От Тебя… кто боится Его»'
  alternative: 'Согласовать местоимения: «кто боится Тебя»'
  rationale: Еврейский текст действительно переходит от прямого обращения к упоминанию Бога в третьем лице. Сохранение этого напряжения следует источнику и не устраняет стилистический переход; из контекста ясно, что речь по-прежнему о Боге.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным поэтическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией. Маркер сноски поставлен непосредственно после спорного местоимения, к которому относится примечание.
