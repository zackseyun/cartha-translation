  variant: modern literary Russian
source:
  edition: WLC
  text: יָ֘בֵ֤שׁ כַּ/חֶ֨רֶשׂ כֹּחִ֗/י וּ֭/לְשׁוֹנִ/י מֻדְבָּ֣ק מַלְקוֹחָ֑/י וְֽ/לַ/עֲפַר מָ֥וֶת תִּשְׁפְּתֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/015.yaml
  text: My strength is dried up like a potsherd[a], and my tongue sticks to my jaws; you lay me in the dust of death.
translation:
  language: ru
  text: 'Сила моя иссохла, как глиняный черепок,

    и язык мой прилип к челюстям[a];

    Ты кладёшь меня в прах смерти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к нёбу». Точное значение еврейского слова, обозначающего часть рта, неясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֵשׁ
  choice: иссохла
  rationale: Глагол обозначает высыхание, иссушение или увядание; форма «иссохла» естественно передаёт наступившее состояние и сохраняет поэтический образ крайнего изнеможения.
- source_word: כַּחֶרֶשׂ
  choice: как глиняный черепок
  rationale: חֶרֶשׂ может обозначать глиняную посуду или её обломок. «Глиняный черепок» ясно передаёт образ чего-то сухого, твёрдого и хрупкого.
- source_word: כֹּחִי
  choice: сила моя
  rationale: В контексте речь идёт о телесной силе и жизненной энергии; буквальное «сила моя» естественно и не сужает смысл.
- source_word: וּלְשׁוֹנִי
  choice: и язык мой
  rationale: Прямое анатомическое обозначение, не требующее поясняющего перифраза.
- source_word: מֻדְבָּק
  choice: прилип
  rationale: Страдательное причастие выражает состояние тесного прилегания; русский глагол «прилип» естественно передаёт физический образ мучительной сухости во рту.
- source_word: מַלְקוֹחָי
  choice: к челюстям
  rationale: Редкое слово, обозначающее часть рта, истолковывается неуверенно. «К челюстям» сохраняет вероятный анатомический смысл, а вариант «к нёбу» вынесен в сноску.
- source_word: וְלַעֲפַר
  choice: в прах
  rationale: Предлог ל здесь допускает значение направления или помещения. «Кладёшь меня в прах» звучит по-русски естественно и сохраняет пространственный образ.
- source_word: מָוֶת
  choice: смерти
  rationale: Сочетание «прах смерти» сохраняет еврейскую родительную конструкцию и её поэтическую напряжённость, не подменяя её толкованием «могила».
- source_word: תִּשְׁפְּתֵנִי
  choice: Ты кладёшь меня
  rationale: Форма второго лица мужского рода единственного числа с объектом первого лица означает «ты помещаешь/кладёшь меня». Настоящее время соответствует изображению переживаемого состояния; «кладёшь» не добавляет отсутствующего в глаголе оттенка насилия.
theological_decisions:
- issue: Кто действует в заключительной строке
  choice: 'Прямое обращение к Богу: «Ты кладёшь меня в прах смерти»'
  alternative: 'Безличное или результативное прочтение: «я повержен в прах смерти»'
  rationale: 'Еврейская глагольная форма прямо указывает на действующее лицо во втором лице и объект в первом лице. Перевод сохраняет напряжённость плача: страдалец связывает своё предельное бедствие с действием Бога, не объясняя соотношение Божьего действия и действий человеческих врагов.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Инверсия «сила моя», «язык мой» поддерживает поэтический ритм, оставаясь понятной современному читателю; образность и богословская напряжённость оригинала сохранены.
