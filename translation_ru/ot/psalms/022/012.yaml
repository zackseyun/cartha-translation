lexical_decisions:
- source_word: סְבָבוּנִי
  choice: окружило меня
  rationale: Глагол סבב означает «окружать, обходить кругом». Совершенный вид передаёт уже сложившуюся угрозу; форма единственного числа согласована с собирательно воспринимаемым сочетанием «много быков».
- source_word: פָּרִים רַבִּים
  choice: много быков
  rationale: פַּר обозначает быка или молодого быка, а רַבִּים указывает на многочисленность. Прямой образ сохранён без истолковывающей замены словом «враги».
- source_word: אַבִּירֵי בָשָׁן
  choice: могучие быки Васана
  rationale: אַבִּירֵי означает «могучие, сильные»; в параллелизме с פָּרִים подразумеваются быки. Название בָשָׁן передано традиционной русской формой «Васан».
- source_word: כִּתְּרוּנִי
  choice: обступили меня
  rationale: Глагол כתר означает «окружать». «Обступили» сохраняет смысл тесного кольца и позволяет избежать дословного повтора первого полустишия.
theological_decisions:
- issue: Метафорический образ враждебных противников как быков
  choice: Сохранить в основном тексте прямой образ быков.
  alternative: 'Передать смысл истолковывающе: «много врагов окружило меня».'
  rationale: Еврейский текст намеренно изображает противников через угрожающий животный образ; его замена словом «враги» ослабила бы поэзию и преждевременно сняла бы метафорическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической силы. Параллелизм двух строк передан близкими, но не одинаковыми глаголами «окружило» и «обступили».
