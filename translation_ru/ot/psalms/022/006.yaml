  text: וְ/אָנֹכִ֣י תוֹלַ֣עַת וְ/לֹא אִ֑ישׁ חֶרְפַּ֥ת אָ֝דָ֗ם וּ/בְז֥וּי עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/006.yaml
  text: But I am a worm and not a man[c][b][a], scorned by mankind and despised by the people.
translation:
  language: ru
  text: А я — червь, а не человек; люди поносят меня[a], и народ презирает меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поношение человека [или людей]» — то есть тот, кого люди поносят.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: А я
  rationale: Союз וְ в контексте выражает резкое противопоставление предыдущим словам псалма; «А я» естественно передаёт этот поворот и сохраняет выразительное אָנֹכִי.
- source_word: תוֹלַעַת
  choice: червь
  rationale: Слово обозначает червя или личинку и здесь служит образом крайнего унижения; нейтральное «червь» сохраняет образ без неоправданного уточнения вида.
- source_word: וְלֹא אִישׁ
  choice: а не человек
  rationale: Передаёт прямое противопоставление червя человеку и ощущение утраты человеческого достоинства; «человек» точно и естественно соответствует אִישׁ в данном контексте.
- source_word: חֶרְפַּת אָדָם
  choice: люди поносят меня
  rationale: Еврейская именная конструкция буквально говорит о «поношении человека/людей», то есть о том, что говорящий стал объектом поношения. Глагольная формулировка естественна по-русски и ясно передаёт смысл, а более формальная структура отмечена в сноске.
- source_word: וּבְזוּי
  choice: презирает
  rationale: Страдательное причастие означает «презираемый». Личная глагольная конструкция согласована с параллельной первой частью и сохраняет сильную эмоциональную окраску.
- source_word: עָם
  choice: народ
  rationale: Сохраняет собирательное значение עָם и поэтический параллелизм с более общим אָדָם — «люди».
theological_decisions:
- issue: Мессианское и прообразовательное прочтение псалма в христианской традиции
  choice: Передать непосредственный смысл еврейской поэзии как голос униженного страдальца, не добавляя в текст явных христологических указаний.
  alternative: Использовать формулировку, прямо указывающую на мессианское исполнение.
  rationale: Канонические и богословские связи следует распознавать из более широкого контекста Писания; сам стих описывает унижение говорящего и не содержит явного мессианского титула.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Тире подчёркивает образное отождествление, точка с запятой разделяет два параллельных описания унижения. Глагольный параллелизм выбран ради естественности, при этом формальная неоднозначность חֶרְפַּת אָדָם сохранена в сноске.
