lexical_decisions:
- source_word: כַּמַּיִם
  choice: как вода
  rationale: Префикс כְּ выражает сравнение; прямой и естественный русский оборот сохраняет образ воды.
- source_word: נִשְׁפַּכְתִּי
  choice: я излит
  rationale: Нифаль глагола שׁפך представляет говорящего как излитого или вылитого. Краткая страдательная форма сохраняет яркость и поэтическую сжатость исходного текста.
- source_word: וְהִתְפָּרְדוּ
  choice: разошлись
  rationale: Хитпаэль от פרד означает разделение или расхождение. «Разошлись» сохраняет образ костей, отделившихся друг от друга, не уточняя сверх текста, что речь именно о вывихе суставов.
- source_word: כָּל עַצְמוֹתַי
  choice: все кости мои
  rationale: Прямой перевод сохраняет всеохватность כָּל и конкретный телесный образ.
- source_word: הָיָה לִבִּי
  choice: сердце моё стало
  rationale: Глагол היה обозначает наступившее состояние; «стало» передаёт переход, а не только статическое состояние.
- source_word: כַּדּוֹנָג
  choice: как воск
  rationale: Прямо сохраняется сравнение сердца с воском.
- source_word: נָמֵס
  choice: растаяло
  rationale: Форма от מסס означает «таять, растворяться»; «растаяло» естественно продолжает образ воска и согласуется с «сердце».
- source_word: בְּתוֹךְ מֵעָי
  choice: внутри меня
  rationale: מֵעִים буквально обозначает внутренности и может выражать глубинную внутреннюю сферу человека. Основной текст передаёт смысл естественно по-русски, а буквальный телесный образ сохраняется в сноске.
theological_decisions:
- issue: Телесное выражение внутреннего страдания
  choice: внутри меня
  alternative: среди моих внутренностей
  rationale: Исходный текст использует телесное, висцеральное обозначение, а не отвлечённую духовную категорию. Естественная формулировка помещена в основной текст, буквальная — в сноску, чтобы не скрывать антропологический образ.
- issue: Характер расхождения костей
  choice: кости мои разошлись
  alternative: кости мои вышли из суставов
  rationale: Еврейский глагол говорит о разделении или расхождении, но прямо не называет суставы. Выбранный вариант сохраняет исходную смысловую широту и не превращает вероятный образ вывиха в однозначное утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством и поэтической сжатостью псалма. Сохранены телесные образы и параллельное построение; инверсия «кости мои», «сердце моё» поддерживает возвышенный библейский регистр, оставаясь понятной современному читателю.
