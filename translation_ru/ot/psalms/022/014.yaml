base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/014.yaml
  text: I am poured out like water[a], and all my bones are out of joint; my heart has become like wax, melted within me.
translation:
  language: ru
  text: Я пролился, как вода, и все кости мои разошлись; сердце моё стало как воск и растаяло внутри меня[a].
  philosophy: optimal-equivalence
  footnotes:
