  text: יֹאכְל֬וּ עֲנָוִ֨ים וְ/יִשְׂבָּ֗עוּ יְהַֽלְל֣וּ יְ֭הוָה דֹּ֣רְשָׁ֑י/ו יְחִ֖י לְבַבְ/כֶ֣ם לָ/עַֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/026.yaml
  text: The afflicted will eat and be satisfied[a]; those who seek him will praise Yahweh[c][b]. May your hearts live forever.
translation:
  language: ru
  text: Страждущие[a] будут есть и насытятся[b]; ищущие Его восхвалят Яхве. Да живёт ваше сердце вовеки[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смиренные», «бедные» или «кроткие».'
    reason: lexical_alternative
  - marker: b
    text: В контексте псалма речь может идти о жертвенной трапезе или пире после исполнения обета, хотя в самом стихе это прямо не сказано.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «да живёт ваше сердце»; слово «сердце» стоит в единственном числе и, вероятно, имеет собирательное значение, обозначая внутреннюю жизнь всей общины, к которой обращены эти слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: страждущие
  rationale: Слово может обозначать смиренных, бедных, кротких или тех, кто терпит бедствие. В контексте перехода псалма от страдания к избавлению «страждущие» передаёт положение людей, которых постигло несчастье, не сводя значение лишь к черте характера.
- source_word: יֹאכְלוּ וְיִשְׂבָּעוּ
  choice: будут есть и насытятся
  rationale: Будущее время естественно передаёт контекстуальное значение имперфектов; «насытятся» сохраняет буквальный образ достаточной пищи и полноты обеспечения.
- source_word: יְהַלְלוּ
  choice: восхвалят
  rationale: Глагол передаёт усиленное, открыто выраженное прославление и естественно звучит в современном литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: דֹּרְשָׁיו
  choice: ищущие Его
  rationale: Причастная форма обозначает людей, постоянно обращённых к Богу и стремящихся к Нему; местоимение сохраняет суффикс оригинала и имеет ясный референт.
- source_word: יְחִי
  choice: да живут
  rationale: Форма понята как пожелание или благословение, а не как простое сообщение о будущем.
- source_word: לְבַבְכֶם
  choice: ваши сердца
  rationale: В еврейском существительное «сердце» стоит в единственном числе, но суффикс обращения — множественного числа. Русское множественное естественно выражает обращение ко всей общине, тогда как примечание сохраняет сведения о форме оригинала.
- source_word: לָעַד
  choice: вовеки
  rationale: Достоинственно и кратко передаёт неограниченную продолжительность, соответствуя поэтическому регистру псалма.
theological_decisions:
- issue: Характер трапезы
  choice: Сохранено буквальное «будут есть и насытятся» без уточнения вида трапезы.
  alternative: Указать в основном тексте жертвенную трапезу или пир по обету.
  rationale: Контекст псалма допускает связь с жертвенной трапезой, однако сам стих прямо этого не говорит; уточнение оставлено в примечании.
- issue: Смена на прямое обращение в последней строке
  choice: 'Сохранено обращение во втором лице множественного числа: «ваши сердца».'
  alternative: Передать как повествование в третьем лице («их сердца будут жить») либо буквально сохранить собирательное единственное число («ваше сердце»).
  rationale: Суффикс второго лица множественного числа указывает на прямое благословение общины. Множественное число существительного в русском языке естественно передаёт распределённое значение, а еврейская собирательная форма отмечена в сноске.
- issue: Оттенок значения עֲנָוִים
  choice: «страждущие»
  alternative: «смиренные», «бедные» или «кроткие»
  rationale: Выбор сохраняет связь с пережитым бедствием в контексте псалма, но альтернативные социальные и нравственные оттенки не исключаются и приведены в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Формы «Яхве» и «вовеки» сохраняют достоинство псалмового регистра; синтаксис остаётся ясным для обычного современного читателя.
