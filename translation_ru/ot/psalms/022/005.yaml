  text: אֵלֶ֣י/ךָ זָעֲק֣וּ וְ/נִמְלָ֑טוּ בְּ/ךָ֖ בָטְח֣וּ וְ/לֹא בֽוֹשׁוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/005.yaml
  text: To you they cried out and were delivered[b][a]; in you they trusted and were not put to shame.
translation:
  language: ru
  text: К тебе они взывали — и были избавлены[a]; на тебя уповали — и не были посрамлены[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и спаслись»; «и были спасены». Еврейский глагол может обозначать как избавление, так и выход из опасности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и не постыдились»; «и не разочаровались». В контексте упования еврейское выражение может означать, что доверившиеся Богу не оказались опозорены и их надежда не была обманута.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: К тебе
  rationale: Предлог אֶל с суффиксом 2-го лица единственного числа обозначает направленность обращения к Богу; «к тебе» естественно передаёт это значение по-русски.
- source_word: זָעֲקוּ
  choice: они взывали
  rationale: זעק обозначает настойчивый крик о помощи. «Взывали» сохраняет силу обращения и соответствует возвышенному, но понятному языку молитвы.
- source_word: וְנִמְלָטוּ
  choice: и были избавлены
  rationale: Нифаль глагола מלט может означать спасение, избавление или выход из опасности. Пассивная форма «были избавлены» передаёт спасительный исход после обращения к Богу, не уточняя способ избавления.
- source_word: בְּךָ
  choice: на тебя
  rationale: С глаголом בטח предлог בְּ вводит того, на кого полагаются; русское сочетание «уповать на» здесь наиболее естественно.
- source_word: בָטְחוּ
  choice: уповали
  rationale: בטח означает доверять, полагаться. «Уповали» точно передаёт стойкое доверие в молитвенно-поэтическом контексте и остаётся понятным современному читателю.
- source_word: וְלֹא בֹשׁוּ
  choice: и не были посрамлены
  rationale: בוש в контексте доверия выражает не только внутренний стыд, но и позор либо крушение надежды. «Не были посрамлены» сохраняет этот итоговый смысл.
theological_decisions:
- issue: Характер избавления, выраженного נִמְלָטוּ
  choice: Избавление, последовавшее за обращением к Богу
  alternative: Самостоятельно избежали опасности
  rationale: Связь между взыванием к Богу и последующим избавлением предполагает спасительный ответ, однако перевод не добавляет отсутствующих в тексте подробностей о способе Божьего действия.
- issue: Смысл בֹשׁוּ в связи с упованием
  choice: Не были посрамлены
  alternative: Не испытывали стыда; не разочаровались
  rationale: Выбранная формулировка сохраняет одновременно общественный оттенок позора и мысль о том, что упование не оказалось тщетным, не сводя выражение лишь к внутреннему чувству.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой лексикой. «Взывали» и «уповали» сохраняют молитвенный регистр, оставаясь общеупотребительными. Строчные местоимения в обращении к Богу следуют нейтральной современной издательской норме. Тире подчёркивает связь между обращением, доверием и их исходом.
