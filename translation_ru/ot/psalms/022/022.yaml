  yaml_path: translation/ot/psalms/022/022.yaml
  text: I will declare your name to my brothers[a]; in the midst of the assembly I will praise you.
translation:
  language: ru
  text: Я возвещу твоё имя моим братьям[a]; посреди собрания я восхвалю тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моим братьям и сёстрам», если родственное обозначение понимается здесь как включающее всё сообщество; буквально по-древнееврейски: «моим братьям».'
    reason: 'Лексическая альтернатива: возможный широкий смысл грамматически мужской формы.'
lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: я возвещу
  rationale: Пиэль глагола ספר здесь означает рассказать, поведать или провозгласить. «Возвещу» передаёт публичный, свидетельский характер речи и соответствует параллельному обещанию хвалы.
- source_word: שִׁמְךָ
  choice: твоё имя
  rationale: 'Сохранён древнееврейский образ: «имя» указывает не только на наименование, но и на явленный характер и славу Бога. Этот образ естественен и понятен по-русски.'
- source_word: לְאֶחָי
  choice: моим братьям
  rationale: Форма буквально обозначает «моим братьям» — существительное мужского рода во множественном числе с суффиксом первого лица. Возможный широкий, включающий женщин смысл отмечен в сноске, но не внесён в основной текст.
- source_word: בְּתוֹךְ
  choice: посреди
  rationale: Слово передаёт нахождение внутри собравшегося сообщества. «Посреди» сохраняет пространственную выразительность и поэтическую приподнятость оригинала.
- source_word: קָהָל
  choice: собрания
  rationale: קָהָל обозначает созванное или собравшееся сообщество. «Собрание» ясно передаёт общий смысл, не сужая его до более позднего церковного употребления.
- source_word: אֲהַלְלֶךָּ
  choice: я восхвалю тебя
  rationale: Пиэль глагола הלל прямо выражает хвалу. «Восхвалю» сохраняет направленность действия на Бога и торжественный поэтический регистр, не добавляя отсутствующей в тексте мысли о пении.
theological_decisions:
- issue: Родовое обозначение близких в контексте общего богослужебного собрания
  choice: моим братьям
  alternative: моим братьям и сёстрам
  rationale: В древнееврейском тексте стоит существительное мужского рода множественного числа. Основной перевод сохраняет эту форму; возможное включение всего сообщества, в том числе женщин, указано в сноске, чтобы не устранять контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимения, относящиеся к Богу, даны со строчной буквы как элемент нейтральной современной орфографической подачи. Повтор «я» во второй строке подчёркивает параллелизм двух обещаний.
