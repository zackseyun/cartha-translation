lexical_decisions:
- source_word: יִרְאֵי יְהוָה
  choice: Боящиеся Яхве
  rationale: Причастная конструкция обозначает людей, для которых характерен страх перед Яхве; следующие повелительные формы показывают, что это прямое обращение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: הַלְלוּהוּ
  choice: хвалите его
  rationale: Форма представляет собой повеление во множественном числе с местоименным суффиксом 3-го лица мужского рода; «хвалите» прямо и естественно передаёт הלל.
- source_word: כָּל זֶרַע יַעֲקֹב
  choice: всё потомство Иакова
  rationale: זֶרַע употреблено собирательно; «потомство» сохраняет собирательный смысл и подходит для обращения ко всему народу.
- source_word: כַּבְּדוּהוּ
  choice: чтите его
  rationale: Порода пиэль глагола כבד здесь призывает воздавать должную честь. «Чтите» кратко, возвышенно и не добавляет толкования.
- source_word: וְגוּרוּ מִמֶּנּוּ
  choice: трепещите перед ним
  rationale: גור с предлогом מן выражает боязливое благоговение или трепет перед Богом. «Трепещите перед ним» сохраняет более сильный оттенок, не сводя выражение к простому повторению начального «боящиеся».
- source_word: כָּל זֶרַע יִשְׂרָאֵל
  choice: всё потомство Израиля
  rationale: Повтор «всё потомство» сохраняет параллелизм с предшествующей строкой и собирательное значение זֶרַע.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога.
- issue: Оттенок וְגוּרוּ מִמֶּנּוּ
  choice: трепещите перед ним
  alternative: бойтесь его; благоговейте перед ним
  rationale: Выбранная формулировка удерживает сочетание страха и благоговения и сохраняет различие между גור в этом повелении и ירא в начальном обращении.
translation_notes:
  register: Современный литературный русский язык с краткими повелительными формами и сохранением трёхчастного поэтического параллелизма. Местоимения, относящиеся к Богу, даны со строчной буквы по общей современной орфографической норме; смысловая почтительность выражена лексикой, а не графическим выделением.
