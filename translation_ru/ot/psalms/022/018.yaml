    reason: cross_reference
lexical_decisions:
- source_word: יְחַלְּקוּ
  choice: делят
  rationale: Пиэль, имперфект 3-го лица множественного числа от חלק. Настоящее время естественно передаёт живую поэтическую сцену и не требует уточнения времени, которого форма сама по себе однозначно не задаёт.
- source_word: בְגָדַי
  choice: мои одежды
  rationale: בגד обозначает одежду или предметы одежды. Множественное «одежды» сохраняет число исходного текста и возвышенный, но понятный регистр.
- source_word: לָהֶם
  choice: между собой
  rationale: Буквально «им/для себя»; при глаголе «делить» русское «между собой» естественно выражает распределение внутри группы.
- source_word: לְבוּשִׁי
  choice: моём одеянии
  rationale: לבוש означает одежду, одеяние. «Одеяние» сохраняет параллелизм, но позволяет передать отличие от בְגָדַי, не конкретизируя предмет как «ризу» или «хитон».
- source_word: יַפִּילוּ גוֹרָל
  choice: бросают жребий
  rationale: Хифиль от נפל в сочетании с גורל образует устойчивое выражение о решении или распределении посредством жребия; «бросают жребий» — естественный русский эквивалент.
theological_decisions:
- issue: Мессианское звучание и новозаветное воспроизведение строки
  choice: Перевести непосредственно образ еврейского псалма, не добавляя в основной текст указания на распятие.
  alternative: Сформулировать строку так, чтобы явно подчеркнуть её исполнение при распятии Иисуса.
  rationale: Каноническая связь со страстными повествованиями существенна, однако основной перевод должен передавать еврейский текст без внесения отсутствующей в нём христологической конкретизации; связь уместно обозначить перекрёстной ссылкой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмической лексикой. Сочетание «одежды / одеяние» передаёт два разных еврейских слова и сохраняет поэтический параллелизм.
