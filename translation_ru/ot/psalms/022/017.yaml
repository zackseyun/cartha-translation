lexical_decisions:
- source_word: אֲסַפֵּר
  choice: могу пересчитать
  rationale: Пиэль глагола ספר может означать «считать, пересчитывать» или «рассказывать, перечислять». Сочетание с «всеми костями» указывает на возможность пересчитать их одну за другой; модальная конструкция естественно передаёт этот смысл по-русски.
- source_word: כָּל
  choice: все
  rationale: Сохраняет выраженную в еврейском тексте полноту без ослабления.
- source_word: עַצְמוֹתָי
  choice: все свои кости
  rationale: Буквальный и образный перевод; возвратное местоимение «свои» естественно для русского языка при совпадении обладателя с подлежащим.
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение обозначает наблюдающих за страдальцем людей и сохраняется как явное подлежащее.
- source_word: יַבִּיטוּ
  choice: смотрят
  rationale: Глагол означает направленный, внимательный взгляд; «смотрят» является ясным современным соответствием.
- source_word: יִרְאוּ
  choice: пристально глядят
  rationale: Буквально глагол означает «видят», но в паре с предыдущим глаголом усиливает картину длительного разглядывания. «Пристально глядят» передаёт поэтическое усиление, не вводя нового действия.
- source_word: בִי
  choice: на меня
  rationale: Предлог при глаголах зрения естественно передаётся по-русски конструкцией «смотреть на».
theological_decisions:
- issue: Мессианское прочтение в христианской традиции
  choice: Передать непосредственный еврейский образ телесного страдания и враждебных наблюдателей без добавления деталей распятия.
  alternative: Усилить формулировку так, чтобы явно подчеркнуть христологическое исполнение.
  rationale: Стих имеет важное место в христианском прочтении псалма, однако его собственная формулировка говорит о видимых костях и наблюдающих людях. Канонические и христологические связи должны возникать из контекста, а не из добавленных переводчиком слов.
translation_notes:
