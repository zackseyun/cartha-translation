  text: בְּ֭/ךָ בָּטְח֣וּ אֲבֹתֵ֑י/נוּ בָּ֝טְח֗וּ וַֽ/תְּפַלְּטֵֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/004.yaml
  text: In you our fathers trusted; they trusted[a], and you delivered them.
translation:
  language: ru
  text: На Тебя уповали наши отцы; уповали — и Ты избавил их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּךָ
  choice: На Тебя
  rationale: Предлог ב с глаголом בטח обозначает того, на кого направлено упование. «На Тебя» — естественное русское управление, не добавляющее отсутствующей в еврейском тексте исключительности.
- source_word: בָּטְחוּ
  choice: уповали
  rationale: בטח выражает доверие и уверенную надежду. «Уповали» сохраняет личную направленность доверия и соответствует возвышенному, но понятному языку Псалтири.
- source_word: אֲבֹתֵינוּ
  choice: наши отцы
  rationale: Еврейское слово буквально означает «наши отцы» и в контексте указывает на предшествующие поколения народа. Прямое соответствие естественно по-русски и сохраняет форму исходного текста.
- source_word: בָּטְחוּ
  choice: уповали
  rationale: Повтор глагола сохранён как выразительный приём еврейского стиха, а не сглажен синонимом.
- source_word: וַתְּפַלְּטֵמוֹ
  choice: и Ты избавлял их
  rationale: פלט означает избавлять, спасать, давать избежать опасности. Русское несовершенное «избавлял» естественно передаёт неоднократный опыт отцов, о котором говорится собирательно, не меняя сущности действия.
theological_decisions:
- issue: Историко-родовое значение אֲבֹתֵינוּ
  choice: наши отцы
  alternative: наши предки
  rationale: Основной текст сохраняет явно мужское родственное обозначение оригинала. Более широкое значение «предки» возможно по контексту, но его не требуется подставлять вместо исходного образа.
- issue: Вид глагола в וַתְּפַלְּטֵמוֹ
  choice: избавлял их
  alternative: избавил их
  rationale: Еврейская форма повествовательно утверждает совершившееся избавление, но множественное «отцы» может обобщать ряд исторических случаев. Русский несовершенный вид естественно выражает эту повторяемость, не отрицая реальности завершённых избавлений.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической лексикой. Синтаксический параллелизм и повтор «уповали» сохранены; тире подчёркивает связь между упованием и Божьим избавлением.
