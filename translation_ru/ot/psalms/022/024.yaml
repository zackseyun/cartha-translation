id: PSA.22.24
reference: Psalms 22:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֤י לֹֽא בָזָ֨ה וְ/לֹ֪א שִׁקַּ֡ץ עֱנ֬וּת עָנִ֗י וְ/לֹא הִסְתִּ֣יר פָּנָ֣י/ו מִמֶּ֑/נּוּ וּֽ/בְ/שַׁוְּע֖/וֹ אֵלָ֣י/ו שָׁמֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/024.yaml
  text: For he has not despised or abhorred the affliction of the afflicted[a], and he has not hidden his face from him; but when he cried to him, he heard.
translation:
  language: ru
  text: Ибо Он не презрел и не возгнушался страданием угнетённого[a], не скрыл от него Своего лица, но услышал, когда тот взывал к Нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедствием бедного»; или: «унижением угнетённого».'
    reason: Лексическое сочетание עֱנוּת עָנִי допускает оттенки страдания, бедствия и унижения, а עָנִי — значения бедного, нуждающегося или угнетённого.
lexical_decisions:
- source_word: בָזָה
  choice: презрел
  rationale: Глагол означает отнестись с презрением; «презрел» точно передаёт смысл и естественно сочетается со следующим, более сильным глаголом.
- source_word: שִׁקַּץ
  choice: возгнушался
  rationale: Более сильный глагол, выражающий отвращение; «возгнушался» сохраняет нарастание по отношению к «презрел» и соответствует возвышенному поэтическому регистру.
- source_word: עֱנוּת
  choice: страданием
  rationale: Существительное обозначает тяжёлое состояние, вызванное бедствием, притеснением или унижением. «Страдание» понятно современному читателю и не сужает смысл до одной причины.
- source_word: עָנִי
  choice: угнетённого
  rationale: Слово может обозначать бедного, нуждающегося, смиренного или терпящего притеснение. В контексте псалма «угнетённого» передаёт более широкий смысл страдающего человека, не ограничивая его экономической бедностью.
- source_word: הִסְתִּיר פָּנָיו
  choice: скрыл ... Своего лица
  rationale: Сохранён еврейский образ сокрытия лица как лишения благосклонного внимания и присутствия; он понятен в русском библейско-поэтическом контексте.
- source_word: מִמֶּנּוּ
  choice: от него
  rationale: Местоимение отнесено к единственному числу עָנִי; повтор существительного не требуется.
- source_word: בְשַׁוְּעוֹ
  choice: когда тот взывал
  rationale: Форма передаёт настойчивый крик о помощи. «Взывал» сохраняет молитвенный контекст и поэтический регистр, а «тот» ясно различает страдальца и Бога.
- source_word: אֵלָיו
  choice: к Нему
  rationale: Сохранена местоименная форма оригинала без внесения отсутствующего в стихе Божьего имени или титула.
- source_word: שָׁמֵעַ
  choice: услышал
  rationale: Переведено в основном значении «слышать»; вариант «ответил» добавил бы смысловой шаг, прямо не выраженный еврейским глаголом.
theological_decisions:
- issue: К кому относится обозначение угнетённого
  choice: Единственное число сохранено так, что стих может говорить о страдальце в непосредственном контексте псалма и одновременно выражать более общий принцип Божьего отношения к угнетённому.
  alternative: Истолковать его исключительно как мессианского страдальца либо исключительно как любого бедного человека.
  rationale: Еврейский текст допускает связь как с конкретным голосом псалма, так и с обобщённым утверждением; перевод не устраняет это напряжение.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Слова «возгнушался» и «взывал» несколько возвышенны, но прозрачны по смыслу; синтаксис остаётся естественным. Маркер [a] помещён непосредственно после неоднозначного сочетания.
