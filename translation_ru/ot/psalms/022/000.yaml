  text: 'For the choirmaster: according to The Doe of the Dawn[a]. A psalm of David[b].'
translation:
  language: ru
  text: Руководителю хора. На мотив «Лань зари»[a]. Псалом Давида[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Лань рассвета». Вероятно, это название мелодии или музыкального сопровождения.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «Давида» может указывать на авторство, принадлежность к связанному с Давидом собранию, посвящение или иную связь; еврейский текст не уточняет.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов слово обозначает музыкального руководителя; дательный падеж естественно передаёт адресат или назначение указания.
- source_word: עַל
  choice: На мотив
  rationale: В музыкальном заголовке предлог, вероятно, вводит название мелодии или исполнительское указание. Перевод естественен по-русски, а вероятностный характер толкования отмечен в сноске.
- source_word: אַיֶּלֶת הַשַּׁחַר
  choice: «Лань зари»
  rationale: אַיֶּלֶת — существительное женского рода, а вся фраза, вероятнее всего, служит названием мелодии; кавычки обозначают её как заглавие.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Стандартное и понятное обозначение культовой песни, предположительно исполнявшейся с музыкальным сопровождением.
- source_word: לְדָוִד
  choice: Давида
  rationale: Родительный падеж сохраняет широкую связь с Давидом и не сужает значение до одного лишь авторства.
theological_decisions:
- issue: Толкование выражения אַיֶּלֶת הַשַּׁחַר
  choice: Передать как название мелодии или музыкальной настройки
  alternative: Понимать как символический тематический заголовок, связанный с содержанием псалма
  rationale: После עַל в заголовках псалмов выражение наиболее естественно понимать как исполнительское указание; сноска сохраняет присущую тексту неопределённость.
- issue: Значение לְדָוִד в заголовке
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида; псалом из собрания, связанного с Давидом
  rationale: Еврейский предлог לְ допускает авторство, принадлежность, посвящение или связь со сборником; традиционная русская конструкция не требует уточнять лишь одно из этих значений.
translation_notes:
  register: Современный литературный русский язык; краткая форма заголовка сохраняет его литургический и музыкальный характер. «Лань» звучит достойно и точно передаёт существительное женского рода; неоднозначность музыкального указания и связи с Давидом вынесена в сноски.
