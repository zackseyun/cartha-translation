  text: כִּֽי אַתָּ֣ה גֹחִ֣/י מִ/בָּ֑טֶן מַ֝בְטִיחִ֗/י עַל שְׁדֵ֥י אִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/009.yaml
  text: For you are the one who brought me out from the womb[a], making me secure at my mother’s breasts.
translation:
  language: ru
  text: Ведь Ты вывел меня из утробы, даруя мне безопасность у груди моей матери.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «побуждая меня доверять у груди моей матери».'
    reason: Лексически מַבְטִיחִי может означать как дарование безопасности или уверенности, так и побуждение к доверию.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит обоснование и связывает стих с предшествующим контекстом; «ведь» естественно передаёт эту аргументативную связь без чрезмерно узкого причинного оттенка.
- source_word: אַתָּה
  choice: Ты
  rationale: 'Самостоятельное местоимение сохранено ради эмфазы: действующим лицом является сам Бог.'
- source_word: גֹחִי
  choice: вывел меня
  rationale: В контексте рождения форма от גחה обозначает того, кто дал выйти из материнской утробы. «Вывел меня» сохраняет конкретный образ и звучит естественно по-русски.
- source_word: מִבָּטֶן
  choice: из утробы
  rationale: Прямо передаёт предлог и существительное в контексте рождения; слово «утроба» уместно в возвышенной, но понятной современной речи.
- source_word: מַבְטִיחִי
  choice: давал мне покой
  rationale: Каузативная форма от בטח может выражать дарование безопасности, уверенности или доверия. В образе грудного младенца «давал мне покой» естественно передаёт защищённость и безмятежность, не приписывая младенцу непременно осознанную веру.
- source_word: עַל
  choice: у
  rationale: В сочетании с материнской грудью русский предлог «у» естественно обозначает место кормления и близости.
- source_word: שְׁדֵי
  choice: груди
  rationale: Слово прямо обозначает женскую грудь; единственное число в русском здесь идиоматично передаёт собирательный образ кормления.
- source_word: אִמִּי
  choice: моей матери
  rationale: Сохранено значение суффикса первого лица в естественной русской конструкции.
theological_decisions:
- issue: Передавать ли מַבְטִיחִי как осознанное младенческое доверие или как дарованную безопасность
  choice: давал мне покой
  alternative: внушал мне доверие
  rationale: Контекст говорит о Божьей заботе с самого рождения. Основной перевод подчёркивает безопасность младенца и не делает однозначного утверждения о его осознанной вере; лексически возможное значение доверия сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Образы рождения и кормления сохранены конкретными и понятными; синтаксис остаётся плавным и не архаичным.
