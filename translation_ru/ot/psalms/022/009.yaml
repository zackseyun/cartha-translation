  source_fidelity: 'Первая строка точно передаёт כִּי, эмфатическое אַתָּה и образ рождения в גֹחִי מִבָּטֶן. Однако «давал мне покой» ослабляет значение הִבְטִיחַ/מַבְטִיחִי: речь скорее о наделении безопасностью, уверенностью или доверием, а не просто о покое. Несовершенный вид «давал» также менее удачно соответствует параллельному описанию Божьего действия.'
