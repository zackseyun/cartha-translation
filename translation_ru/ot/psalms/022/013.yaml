translation_notes:
  register: Современный литературный русский язык с сохранением напряжённой поэтической образности. «Пасть» выбрана вместо нейтрального «рот», поскольку контекст прямо уподобляет противников хищному льву; пунктуация и причастия ясно относят действия «терзающий и рычащий» ко льву.
