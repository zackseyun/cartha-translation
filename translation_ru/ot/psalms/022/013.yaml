    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצוּ
  choice: разинули
  rationale: Форма от פצה означает «широко открыть». Совершенный вид передаёт еврейский перфект, а «разинули» естественно и выразительно сочетается с образом пасти.
- source_word: עָלַי
  choice: на меня
  rationale: Предлог עַל здесь обозначает враждебную направленность действия; по-русски с глаголом «разинуть» естественно сказать «на меня».
- source_word: פִּיהֶם
  choice: пасть
  rationale: В еврейском существительное стоит в единственном числе с суффиксом множественного числа — буквально «их рот». Русское «пасть» поддерживает собирательное единственное число и заранее вводит звериный образ, не меняя смысла угрозы.
- source_word: אַרְיֵה
  choice: словно лев
  rationale: Сравнительная частица в еврейском не выражена, однако компактное приложение функционирует как образное сравнение. «Словно» делает эту связь ясной и естественной по-русски.
- source_word: טֹרֵף
  choice: терзающий
  rationale: Причастие Qal от טרף описывает льва, разрывающего добычу. «Терзающий» передаёт хищное насилие и хорошо сочетается с образом льва.
- source_word: וְשֹׁאֵג
  choice: и рычащий
  rationale: Причастие от שׁאג обозначает характерный рёв льва; «рычащий» — естественное русское описание угрожающего голоса зверя в этой конструкции.
