base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/002.yaml
  text: My God[a], I cry out by day, but you do not answer, and by night[b], but I have no rest.
translation:
  language: ru
  text: Боже мой, днём я взываю, но Ты не отвечаешь; ночью — и нет мне покоя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и ночью — нет мне тишины (молчания)». Возможен также смысл: «ночью я не умолкаю».'
    reason: Сохраняет образный, эллиптический смысл еврейского וְלֹא דֻמִיָּה לִי и отмечает возможное прочтение как непрестанного ночного взывания.
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Форма с суффиксом первого лица единственного числа означает «мой Бог»; в прямом обращении современная русская форма «Боже мой» естественно передаёт звательный смысл.
- source_word: אֶקְרָא
  choice: я взываю
  rationale: Глагол קרא в контексте плача обозначает настойчивое обращение к Богу. «Взываю» передаёт силу мольбы и сохраняет dignified поэтический регистр.
- source_word: יוֹמָם
  choice: днём
  rationale: Наречное употребление со значением «днём, в дневное время»; краткая форма естественно образует параллель с «ночью».
- source_word: וְלֹא תַעֲנֶה
  choice: но Ты не отвечаешь
  rationale: Союз ו допускает контекстуально-противительное прочтение; «но» ясно выражает напряжение между взыванием и отсутствием ответа, не усиливая смысл сверх оригинала.
- source_word: וְלַיְלָה
  choice: и ночью
  rationale: Сохраняет соединительный союз и параллелизм с «днём».
- source_word: וְלֹא דֽוּמִיָּה לִי
  choice: не умолкаю
  rationale: Буквальная конструкция означает «нет молчания мне». Русское «не умолкаю» естественно передаёт отсутствие молчания со стороны говорящего, сохраняя образ непрерывного ночного плача; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Смысл заключительных слов וְלֹא דֽוּמִיָּה לִי
  choice: Псалмопевец не умолкает ночью, продолжая взывать.
  alternative: Ночью он не находит покоя или тишины.
  rationale: דומיה обычно обозначает молчание, тишину или безмолвие. Конструкция кратка и допускает оттенок отсутствия покоя, однако не означает прямо «ответ». Основной текст сохраняет образ молчания, а сноска оставляет открытым возможное прочтение как отсутствия покоя.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Местоимение «Ты» написано с прописной буквы как принятая в русском религиозном тексте форма почтительного обращения к Богу. Синтаксис сохраняет дневной и ночной параллелизм оригинала.
