base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/027.yaml
  text: All the ends of the earth will remember and return to Yahweh[b][a], and all the families of the nations will bow down before you.
translation:
  language: ru
  text: Все края земли вспомнят и обратятся к Яхве[a], и все роды народов падут ниц перед Тобой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Яхве» передаёт личное имя Бога יהוה; традиционный перевод — «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «поклонятся перед Тобой». Еврейский глагол буквально обозначает преклонение или простирание ниц, часто как выражение поклонения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכְּרוּ
  choice: вспомнят
  rationale: Форма qal imperfect 3-го лица множественного числа от זכר имеет здесь предсказательное значение. «Вспомнят» прямо передаёт смысл глагола, не уточняя без основания, что именно будет приведено на память.
- source_word: וְיָשֻׁבוּ
  choice: и обратятся
  rationale: Глагол שוב с предлогом אֶל обозначает движение или поворот к кому-либо. «Обратятся к» естественно по-русски передаёт направленность к Яхве, не сводя значение исключительно к внутреннему покаянию.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל указывает направление, а личное имя יְהוָה передано принятой русской транслитерацией «Яхве».
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: все края земли
  rationale: Сочетание обозначает крайние, отдалённые области земли и тем самым весь мир. «Края земли» сохраняет пространственный образ и звучит естественно в современном русском языке.
- source_word: וְיִשְׁתַּחֲווּ
  choice: падут ниц
  rationale: Глагол שחה в данной породе обозначает телесное преклонение или простирание в знак почтения и поклонения. «Падут ниц» сохраняет конкретный образ, не устраняя культового смысла контекста.
- source_word: לְפָנֶיךָ
  choice: пред Тобой
  rationale: Буквально «перед Твоим лицом»; «пред Тобой» — точный и достойный русский эквивалент, сохраняющий прямое обращение к Богу во 2-м лице единственного числа.
- source_word: כָּל מִשְׁפְּחוֹת גּוֹיִם
  choice: все племена народов
  rationale: מִשְׁפָּחוֹת обозначает родовые или семейно-племенные группы, а גּוֹיִם — народы. Выбор сохраняет различие между двумя понятиями и всемирный охват высказывания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому транслитерация сохраняет его как имя, а сноска сообщает распространённую переводческую традицию.
- issue: Смысл וְיִשְׁתַּחֲווּ
  choice: падут ниц
  alternative: поклонятся
  rationale: Основной текст сохраняет физическое действие преклонения; сноска указывает, что в данном контексте оно выражает поклонение, не подменяя образ отвлечённым термином.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Порядок слов сделан естественным для русского языка; параллелизм двух частей, всеобщий охват и переход от упоминания Яхве к прямому обращению «Тобой» сохранены.
