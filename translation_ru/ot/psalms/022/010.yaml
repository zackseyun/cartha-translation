  yaml_path: translation/ot/psalms/022/010.yaml
  text: Upon you I was cast from the womb[b][a]; from my mother's belly you have been my God.
translation:
  language: ru
  text: На Тебя я был брошен от утробы; от чрева матери моей Ты — мой Бог.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от чрева матери моей Ты был моим Богом». В еврейском заключительная фраза буквально означает: «мой Бог — Ты»; её можно понимать как утверждение в настоящем времени или, по контексту, как указание на отношения, продолжающиеся с самого рождения.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָלֶיךָ
  choice: На Тебя
  rationale: Предлог עַל с суффиксом сохраняет образ возложения на Бога и зависимости от Него.
- source_word: הָשְׁלַכְתִּי
  choice: я был возложен
  rationale: Хофаль перфекта от שלך передаёт пассивное действие. «Возложен» сохраняет образ, но в современном русском звучит уместнее, чем резкое «брошен».
- source_word: מֵרָחֶם
  choice: от утробы
  rationale: רֶחֶם буквально обозначает утробу; конкретный образ сохранён без обобщения «от рождения».
- source_word: מִבֶּטֶן אִמִּי
  choice: от чрева матери моей
  rationale: בֶּטֶן может означать живот или чрево. «Чрево» сохраняет отличие от רֶחֶם и соответствует возвышенному поэтическому регистру псалма.
- source_word: אֵלִי אָתָּה
  choice: Ты — мой Бог
  rationale: Безглагольная еврейская фраза буквально утверждает «мой Бог — Ты». Русское настоящее время сохраняет формальную неопределённость времени и естественно допускает продолжающиеся отношения.
theological_decisions:
- issue: Временное значение безглагольной заключительной фразы אֵלִי אָתָּה
  choice: Ты — мой Бог
  alternative: Ты был моим Богом / Ты всегда был моим Богом
  rationale: В еврейском тексте глагола нет. Настоящее утверждение не исключает отношений, продолжающихся с рождения, но не делает эту временную протяжённость более явной, чем оригинал.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. «Утроба» и «чрево» намеренно различают два еврейских существительных; «чрево» несколько возвышенно, но понятно и уместно для Псалтири.
