  text: כִּ֣י לַ֭/יהוָה הַ/מְּלוּכָ֑ה וּ֝/מֹשֵׁ֗ל בַּ/גּוֹיִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/028.yaml
  text: For the kingdom belongs to Yahweh[b][a], and he rules over the nations.
translation:
  language: ru
  text: Ибо Яхве[a] принадлежит царская власть[b], и Он правит народами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. יהוה (YHWH); традиционно: «Господь».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «царство»; также возможно: «царствование». Еврейское слово может обозначать царскую власть, царствование или царство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего утверждения или призыва; «ибо» сохраняет причинное значение и соответствует возвышенному поэтическому регистру.
- source_word: לַיהוָה
  choice: Яхве принадлежит
  rationale: Предлог לְ выражает принадлежность; в русском языке это естественно передано конструкцией «Яхве принадлежит». Личное имя יהוה передано как «Яхве».
- source_word: הַמְּלוּכָה
  choice: царская власть
  rationale: Существительное מְלוּכָה может обозначать царскую власть, царствование или царство. «Царская власть» естественно выражает здесь принадлежность верховного правления, не сводя слово к территории.
- source_word: וּמֹשֵׁל
  choice: и Он правит
  rationale: Причастие Qal от משל выражает постоянное, общее действие; настоящее время «правит» передаёт этот смысл естественно.
- source_word: בַּגּוֹיִם
  choice: народами
  rationale: При глаголе משל предлог בְ обозначает тех, над кем осуществляется власть; русское управление «править народами» точно и идиоматично. גּוֹיִם здесь означает народы вообще.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит собственное имя יהוה. Транслитерация «Яхве» сохраняет различие между Божественным именем и титулом; традиционный вариант отмечен в сноске.
- issue: Значение מְלוּכָה
  choice: царская власть
  alternative: царство; царствование
  rationale: Еврейское слово допускает несколько близких значений. Основной вариант подчёркивает само царское владычество, а сноска сохраняет реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим оттенком. Краткий параллелизм исходного стиха сохранён; формулировка остаётся понятной без специальной богословской подготовки.
