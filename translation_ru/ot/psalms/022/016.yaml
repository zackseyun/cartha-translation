  text: כִּ֥י סְבָב֗וּ/נִי כְּלָ֫בִ֥ים עֲדַ֣ת מְ֭רֵעִים הִקִּיפ֑וּ/נִי כָּ֝/אֲרִ֗י יָדַ֥/י וְ/רַגְלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/016.yaml
  text: For dogs have surrounded me[a]; a company of evildoers has encircled me[b]; like a lion are my hands and my feet.
translation:
  language: ru
  text: Ибо псы окружили меня; сборище злодеев обступило меня; словно лев — мои руки и ноги.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Свитки Мёртвого моря, Септуагинта и многие переводы дают здесь чтение «пронзили мои руки и ноги» (или «прорыли мои руки и ноги») вместо трудного масоретского текста «словно лев — мои руки и ноги».
    reason: textual_variant
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт пояснительно-причинную связь с предшествующей жалобой и сохраняет возвышенный, но понятный поэтический регистр.
- source_word: סְבָבוּנִי
  choice: окружили меня
  rationale: Прямо передаёт значение глагола סבב и завершённое враждебное действие.
- source_word: כְּלָבִים
  choice: псы
  rationale: Сохраняет буквальный образ враждебных и презренных нападающих; «псы» уместно в поэтическом регистре.
- source_word: עֲדַת מְרֵעִים
  choice: сборище злодеев
  rationale: Передаёт собравшуюся группу совершающих зло и естественно звучит в современном русском библейском стихе.
- source_word: הִקִּיפוּנִי
  choice: обступило меня
  rationale: Передаёт окружение со всех сторон, сохраняя смысловой параллелизм и избегая механического повтора «окружили».
- source_word: כָּאֲרִי
  choice: словно лев
  rationale: Следует масоретскому чтению «как лев», не заменяя трудный текст более гладким вариантом из части древних свидетельств.
- source_word: יָדַי וְרַגְלָי
  choice: мои руки и ноги
  rationale: Буквально передаёт названия частей тела и сохраняет их связь с синтаксически трудной предшествующей фразой.
theological_decisions:
- issue: Спорное чтение כָּאֲרִי в Псалме 22:16
  choice: В основном тексте сохранено масоретское «словно лев — мои руки и ноги»
  alternative: «пронзили мои руки и ноги» или «прорыли мои руки и ноги»
  rationale: WLC содержит כָּאֲרִי, «как лев», хотя получившаяся бессказуемная конструкция крайне трудна. Древний вариант, стоящий за чтением «пронзили/прорыли», текстологически значим и потому отмечен в сноске, но не подменяет основной источник.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Эллиптичность последней фразы намеренно сохранена как отражение реальной трудности еврейского текста; тире обозначает бессказуемную конструкцию, не добавляя предполагаемого действия.
