  source_fidelity: 'Основной смысл передан верно: противопоставлены благоденствующие и сходящие в прах, а трудная заключительная строка осторожно понята как относящаяся к человеку, не сохранившему своей жизни. Однако «живущие на земле в достатке» добавляет к דשני ארץ не выраженный в тексте признак «живущие» и несколько размывает обозначение преуспевающих. Сноска a буквально переводит выражение так, словно речь идёт о тучности самой земли, тогда как в еврейском это субстантивированное обозначение людей — «тучные/сытые [люди] земли».'
