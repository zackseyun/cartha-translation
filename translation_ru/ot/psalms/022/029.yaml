base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/029.yaml
  text: All the prosperous of the earth will eat and bow down[c][b][a]; before him all who go down to the dust will kneel—even he who could not keep himself alive.
translation:
  language: ru
  text: Все благоденствующие на земле будут есть и поклонятся[a]; пред Ним преклонят колени все сходящие в прах[b] — даже тот, кто не смог сохранить свою жизнь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все тучные [люди] земли». Имеются в виду сытые, состоятельные или благоденствующие люди.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все нисходящие в прах». Прах здесь служит образом смертности и смерти.'
    reason: lexical_alternative
  - marker: c
    text: 'Заключительная еврейская фраза трудна; буквально: «и жизнь (или душу) свою он не сохранил живой». Возможен также перевод: «и жизнь его не была сохранена».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: будут есть
  rationale: Форма перфекта в поэтическом, устремлённом в будущее контексте передана будущим временем и согласована с последующими действиями поклонения.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: и поклонятся
  rationale: Глагол обозначает земной поклон или простирание ниц, нередко как выражение поклонения; русский глагол сохраняет культовый смысл и звучит естественно.
- source_word: כָּל דִּשְׁנֵי אֶרֶץ
  choice: все живущие на земле в достатке
  rationale: Буквально «все тучные земли»; это образ сытых, состоятельных и благополучных людей. Выбранная передача ясна современному читателю и сохраняет социальный контраст.
- source_word: לְפָנָיו
  choice: пред Ним
  rationale: Краткая и возвышенная, но понятная передача пространственного и почтительного значения выражения.
- source_word: יִכְרְעוּ
  choice: преклонят колени
  rationale: Глагол передаёт сгибание колен; такая формулировка сохраняет телесный образ и отличает его от предыдущего глагола поклонения.
- source_word: כָּל יוֹרְדֵי עָפָר
  choice: все сходящие в прах
  rationale: Сохранён еврейский образ праха как обозначения смертности и смерти, без преждевременной замены его словом «могила».
- source_word: וְנַפְשׁוֹ לֹא חִיָּה
  choice: даже тот, кто не смог сохранить себе жизнь
  rationale: Трудная сжатая конструкция понята как указание на человека, не способного сохранить собственную жизнь. «Жизнь» естественно передаёт נפשׁ в данном контексте, а сноска сохраняет буквальную форму и неоднозначность.
theological_decisions:
- issue: Смысл заключительной фразы וְנַפְשׁוֹ לֹא חִיָּה
  choice: Она относится к человеку, который не смог сохранить себе жизнь, и тем самым расширяет картину поклонения на смертных, сходящих в прах.
  alternative: '«И своей жизни он не сохранил» либо безличное понимание: «и жизнь его не была сохранена».'
  rationale: Еврейский синтаксис сжат и допускает разные толкования. Основной текст следует наиболее связному прочтению в параллели с «сходящими в прах», а сноска прямо отмечает трудность и не превращает это прочтение в бесспорное.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Пред Ним», «преклонят колени» и «прах» сохраняют достоинство и образность оригинала, оставаясь понятными широкому читателю.
