  yaml_path: translation/ot/psalms/022/030.yaml
  text: A seed will serve him; it will be proclaimed about the Lord to the generation.
translation:
  language: ru
  text: Потомство будет служить Ему; о Господе расскажут поколению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶרַע
  choice: потомство
  rationale: В данном контексте собирательное «потомство» естественно передаёт еврейское «семя» в значении будущих потомков, не создавая в русском языке неуместного предметного образа.
- source_word: יַעַבְדֶנּוּ
  choice: будет служить Ему
  rationale: Форма выражает продолженное или будущее служение; местоименный суффикс мужского рода передан как «Ему».
- source_word: יְסֻפַּר
  choice: возвестят
  rationale: Пассивная форма буквально означает «будет рассказано/поведано». Неопределённо-личная русская конструкция естественно сохраняет отсутствие названного деятеля и передаёт публичное возвещение.
- source_word: לַאדֹנָי
  choice: о Господе
  rationale: Предлог לְ при глаголе повествования допускает значение темы сообщения; «о Господе» соответствует контексту и масоретскому чтению אֲדֹנָי.
- source_word: לַדּוֹר
  choice: грядущему поколению
  rationale: Определённое единственное число «поколению» в контексте будущего потомства указывает на последующее поколение; «грядущему» делает временную связь ясной без излишней конкретизации.
theological_decisions:
- issue: 'Смысл זֶרַע: буквальное «семя» или собирательное потомство'
  choice: потомство
  alternative: семя
  rationale: Сохранён собирательный смысл, не навязывающий ни исключительно одного потомка, ни конкретной мессианской идентификации.
- issue: Связь לַאדֹנָי с пассивным יְסֻפַּר
  choice: о Господе возвестят
  alternative: Господу будет поведано
  rationale: 'Контекст последующего стиха о возвещении Божьей праведности поддерживает тематическое понимание: Господь — содержание вести. При этом неоднозначность предлога признана, но не превращена в догматическое утверждение.'
translation_notes:
  register: Современный литературный русский; торжественный, но понятный псалмический регистр. Необычное буквальное «семя» заменено естественным собирательным «потомство»; синтаксис сделан плавным без конфессионально окрашенных уточнений.
