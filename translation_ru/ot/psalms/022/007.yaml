  yaml_path: translation/ot/psalms/022/007.yaml
  text: All who see me mock me[a]; they open wide the lip[b]; they shake the head.
translation:
  language: ru
  text: Все, кто видит меня, насмехаются надо мной; презрительно кривят губы[a], качают головой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «размыкают (или: выпячивают) губу». Еврейское выражение, вероятно, описывает презрительный жест; точный характер движения не вполне ясен.'
    reason: lexical_alternative
  - marker: b
    text: Покачивание головой здесь выражает насмешку или презрение. Этот образ отзывается в повествованиях о страданиях Иисуса (Мф. 27:39; Мк. 15:29).
    reason: cross_reference
lexical_decisions:
- source_word: כָּל רֹאַי
  choice: Все, кто видит меня
  rationale: כָּל охватывает всех наблюдающих, а причастие רֹאַי с суффиксом первого лица естественно передаётся русским относительным оборотом.
- source_word: יַלְעִגוּ לִי
  choice: насмехаются надо мной
  rationale: Форма от לעג обозначает обращённую на говорящего насмешку или глумление; выбран ясный и естественный современный эквивалент.
- source_word: יַפְטִירוּ בְשָׂפָה
  choice: презрительно кривят губы
  rationale: Буквальный образ связан с движением или размыканием губ и, вероятно, обозначает жест презрения. Перевод сохраняет телесный образ и делает смысл жеста понятным современному читателю; неоднозначность отмечена в сноске.
- source_word: יָנִיעוּ רֹאשׁ
  choice: качают головой
  rationale: Буквально речь идёт о движении головой; в контексте это жест насмешки или презрения. Русское выражение естественно и сохраняет исходный образ.
theological_decisions:
- issue: Мессианское прочтение и позднейшее употребление в повествованиях о страданиях Христа
  choice: Перевести стих прежде всего как речь страдающего псалмопевца, не добавляя в основной текст явно христологической лексики.
  alternative: Сформулировать перевод так, чтобы непосредственно указать на Иисуса или на евангельское исполнение.
  rationale: Еврейский текст сам по себе говорит от лица страдающего молящегося. Евангельская перекличка важна для истории восприятия, но не должна заранее разрешать смысл исходного стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Параллельные жесты переданы кратко и ритмично; устаревшие «уста» и непрозрачная буквальность устранены, а смысловая неоднозначность выражения о губах сохранена в сноске.
