lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Но Ты
  rationale: Союз с самостоятельным местоимением выражает контраст с предшествующей жалобой; «Но Ты» естественно передаёт это противопоставление и сохраняет прямое обращение.
- source_word: קָדוֹשׁ
  choice: свят
  rationale: Обычное и ёмкое обозначение Божьей святости; более описательное «отделён» здесь неоправданно сужает смысл.
- source_word: יֹשֵׁב
  choice: восседающий
  rationale: Причастие буквально означает «сидящий» и может иметь смысл «пребывающий»; применительно к Богу в поэтическом контексте «восседающий» сохраняет царственный образ, не добавляя явно отсутствующего в еврейском слове «престола».
- source_word: תְּהִלּוֹת
  choice: славословий
  rationale: Множественное число передаёт многочисленные выражения хвалы; «славословия» звучит естественно и возвышенно в русской поэзии.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Стандартная русская форма имени в родительном падеже, соответствующем еврейской конструкции принадлежности.
theological_decisions:
- issue: Смысл выражения יֹשֵׁב תְּהִלּוֹת יִשְׂרָאֵל
  choice: Бог изображён царственно восседающим среди славословий Израиля.
  alternative: Бог пребывает в славословиях Израиля; Бог восседает на славословиях Израиля.
  rationale: Еврейское причастие допускает значения «сидящий/восседающий» и «пребывающий», а отношение к «славословиям» выражено без предлога. Основной текст сохраняет царственный поэтический образ, тогда как сноска отмечает подлинную лексико-синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Заглавное «Ты» принято как уважительная русская норма прямого обращения к Богу. Перенос строки подчёркивает параллелизм; формулировка избегает искусственного оборота «восседающий на хвалах».
