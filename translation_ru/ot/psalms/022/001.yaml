  yaml_path: translation/ot/psalms/022/001.yaml
  text: My God[a], my God[c][b], why have you forsaken me? Far from my salvation are the words of my roaring.
translation:
  language: ru
  text: Боже мой, Боже мой, почему ты оставил меня? Далеки от моего избавления[a] слова моего рёва[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасения»; еврейское слово может также означать помощь или избавление.'
