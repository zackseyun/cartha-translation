lexical_decisions:
- source_word: גֹּל אֶל
  choice: Положись на
  rationale: Глагол גֹּל буквально означает «перекати», но в сочетании с направлением к Богу выражает вверение себя или своего дела Ему. «Положись на» естественно передаёт этот образ как повеление, не добавляя в основной текст отсутствующего дополнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: יְפַלְּטֵהוּ
  choice: пусть Он спасёт его
  rationale: Пиэль פלט означает дать ускользнуть от опасности, спасти. «Спасёт» ясно передаёт избавление от угрожающей гибели.
- source_word: יַצִּילֵהוּ
  choice: пусть избавит его
  rationale: Гифиль נצל означает вырвать из опасности, избавить. Выбран отдельный русский глагол, чтобы сохранить параллелизм, не превращая обе строки в дословный повтор.
- source_word: כִּי חָפֵץ בּוֹ
  choice: раз Он благоволит к нему
  rationale: כִּי имеет причинное значение, а חפץ ב выражает расположение и удовольствие от кого-либо. Формулировка естественна в насмешливой реплике и сохраняет личностный оттенок.
theological_decisions:
- issue: Смена второго лица на третье в насмешке
  choice: 'Сохранено обращение «Положись», после которого следуют формы третьего лица: «пусть Он спасёт его».'
  alternative: 'Сделать начало третьеличным: «Он положился на Яхве» или «Пусть вверит его Яхве».'
  rationale: Масоретский текст открывается повелительной формой второго лица, тогда как следующие глаголы имеют местоименный суффикс третьего лица. Необычная смена лица сохранена как подлинная риторическая напряжённость насмешки, а не сглажена посредством добавления отсутствующих слов.
- issue: Смысл Божьего расположения
  choice: «Он благоволит к нему»
  alternative: «Он угоден Ему» или «Он желает его».
  rationale: Так передаётся обычное значение חפץ ב — находить удовольствие в ком-либо, благоволить к нему — без уточнения основания или характера Божьего расположения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским регистром. Тире поддерживает интонацию язвительного вызова; прописное «Он» помогает читателю различить Бога и страдающего, не меняя синтаксической структуры оригинала.
