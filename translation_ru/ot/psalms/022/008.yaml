  text: '«Положись на Яхве[a] — пусть Он спасёт его,

    пусть избавит его, раз Он благоволит к нему!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Перекати [это] к Яхве». Это образное выражение означает вверить Ему себя или своё дело.'
