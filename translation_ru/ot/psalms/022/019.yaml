  text: וְ/אַתָּ֣ה יְ֭הוָה אַל תִּרְחָ֑ק אֱ֝יָלוּתִ֗/י לְ/עֶזְרָ֥תִ/י חֽוּשָׁ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/019.yaml
  text: But you[a], O Yahweh, do not be far away; O my strength[b], hurry to help me.
translation:
  language: ru
  text: Но Ты, Яхве, не будь далеко; сила моя[a], поспеши мне на помощь!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помощь моя». Еврейское слово обычно понимают как «моя сила»; его также толкуют как «моя лань», хотя в этом контексте такое понимание менее вероятно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Но Ты
  rationale: Сочетание союза с самостоятельным местоимением подчёркивает контраст с предшествующим описанием бедствия; «Но Ты» естественно передаёт этот оттенок по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אַל תִּרְחָק
  choice: не будь далеко
  rationale: Прямая просьба сохраняет значение глагола «быть далёким, удаляться» и звучит естественно в молитвенной речи.
- source_word: אֱיָלוּתִי
  choice: сила моя
  rationale: В данном обращении слово наиболее вероятно означает «моя сила, мощь»; редкая форма допускает и другие толкования, отмеченные в сноске.
- source_word: לְעֶזְרָתִי
  choice: мне на помощь
  rationale: Естественно передаёт буквальное направление «к моей помощи / для моей помощи».
- source_word: חוּשָׁה
  choice: поспеши
  rationale: Императив выражает настоятельную просьбу о незамедлительном действии; «поспеши» современно, ясно и соответствует возвышенному регистру псалма.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст непосредственно употребляет тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Значение אֱיָלוּתִי
  choice: сила моя
  alternative: помощь моя; моя лань
  rationale: Контекст мольбы о помощи поддерживает переносное значение «сила», однако лексическая редкость формы требует сохранить альтернативы в сноске, не выдавая спорное толкование за несомненное.
translation_notes:
  register: Современный литературный русский язык с кратким, настойчивым молитвенным ритмом. Обращение «Ты» написано с прописной буквы как уместная русская форма почтительного обращения к Богу; пунктуация сохраняет два тесно связанных воззвания.
