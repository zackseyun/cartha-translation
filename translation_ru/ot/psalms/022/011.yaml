lexical_decisions:
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: Не удаляйся от меня
  rationale: Отрицательная частица с глаголом выражает мольбу. Русское «не удаляйся» сохраняет пространственный образ רחק и не усиливает его до «не оставляй».
- source_word: כִּי
  choice: потому что
  rationale: Первое כִּי вводит основание просьбы; «потому что» ясно передаёт причинную связь в современном русском языке.
- source_word: צָרָה קְרוֹבָה
  choice: беда близка
  rationale: צָרָה обозначает беду, несчастье или бедствие, а קְרוֹבָה — близость; краткая формулировка сохраняет поэтическую непосредственность угрозы.
- source_word: כִּי אֵין עוֹזֵר
  choice: а помочь некому
  rationale: Буквально речь идёт об отсутствии помогающего. Естественная русская конструкция сохраняет личный смысл причастия עוֹזֵר, в отличие от более отвлечённого «нет помощи»; союз «а» естественно выражает поясняющее присоединение второго основания.
theological_decisions:
- issue: Пространственный образ Божьей отдалённости в плаче
  choice: «Не удаляйся от меня»
  alternative: «Не оставляй меня»
  rationale: Еврейский текст употребляет пространственный глагол רחק с предлогом מן. Перевод сохраняет напряжение мольбы и не привносит более сильное утверждение об оставлении.
- issue: Отсутствие помогающего
  choice: «помочь некому»
  alternative: «нет помощника»
  rationale: Оба варианта передают личное значение עוֹזֵר. Выбранный вариант звучит естественнее по-русски и не уточняет, относится ли отсутствие помощника исключительно к людям или включает более широкую перспективу.
translation_notes:
  register: Современный литературный русский; краткая, молитвенно-поэтическая фраза. Синтаксис естественный, но пространственный образ оригинала и двойное причинное обоснование сохранены.
