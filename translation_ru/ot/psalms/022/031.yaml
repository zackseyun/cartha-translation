    text: 'Или: «ибо он совершил это». Краткая еврейская фраза может выражать либо содержание возвещения, либо его причину.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹאוּ
  choice: Придут
  rationale: Форма qal imperfect 3-го лица множественного числа от בוא выражает предстоящее действие. «Придут» естественно и точно передаёт эту направленность в будущее.
- source_word: וְיַגִּידוּ
  choice: и возвестят
  rationale: Форма hifil imperfect от נגד означает сделать известным, объявить. «Возвестят» сохраняет публичный и торжественный характер речи, не становясь архаичным.
- source_word: צִדְקָתוֹ
  choice: его праведность
  rationale: צדקה охватывает праведность, справедливость и в псалмах также праведное спасительное действие. Основной вариант сохраняет широту понятия; возможное «справедливость» дано в сноске.
- source_word: לְעַם
  choice: народу
  rationale: Предлог ל обозначает адресата возвещения. Отсутствие артикля не требует в русском неопределённой конструкции, а форма «народу» естественно передаёт значение адресата.
- source_word: נוֹלָד
  choice: который ещё родится
  rationale: Пассивное причастие от ילד характеризует будущий народ или поколение. Русская относительная конструкция ясно передаёт перспективное значение.
- source_word: כִּי
  choice: что
  rationale: כִּי понято как вводящее содержание возвещения. Поскольку возможно и причинное значение «ибо», оно сохранено в сноске.
- source_word: עָשָׂה
  choice: он совершил это
  rationale: Qal perfect 3-го лица единственного числа от עשה означает «сделал, совершил». В еврейском объект не назван; русское «это» делает фразу грамматически естественной, сохраняя её краткость и итоговую силу.
theological_decisions:
- issue: Смысл צִדְקָתוֹ применительно к Богу
  choice: «его праведность» в основном тексте
  alternative: «его справедливость»; «его спасительную праведность»
  rationale: Термин может обозначать как праведность и справедливость, так и проявление праведности в спасительном действии. «Праведность» не сужает эту смысловую широту, а сноска отмечает ближайшую альтернативу.
- issue: Связь заключительных слов כִּי עָשָׂה с предыдущей фразой
  choice: 'Содержание возвещения: «что он совершил это»'
  alternative: 'Причина возвещения: «ибо он совершил это»'
  rationale: Краткая заключительная фраза допускает оба синтаксических понимания. Основной текст следует вероятному содержательному прочтению, а причинное сохраняется в сноске без устранения подлинной неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, псалмическим звучанием. Местоимения, относящиеся к Богу, написаны со строчной буквы согласно обычной современной издательской норме и форме исходного текста. Тире перед заключительной частью подчёркивает её кульминационную краткость, не превращая её в прямую речь.
