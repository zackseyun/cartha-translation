lexical_decisions:
- source_word: הַצִּילָה
  choice: Избавь
  rationale: Усиленная форма повелительного значения от נצל выражает настоятельную мольбу о спасении; «избавь» естественно звучит в современной молитвенной речи.
- source_word: מֵחֶרֶב
  choice: от меча
  rationale: Предлог מן обозначает удаление от смертельной угрозы; определённый образ «меча» сохранён без уточнения конкретного оружия.
- source_word: נַפְשִׁי
  choice: мою жизнь
  rationale: В контексте смертельной опасности נפש обозначает жизнь или живого человека, а не обязательно нематериальную душу.
- source_word: מִיַּד
  choice: от власти
  rationale: Буквально «из руки»; в данном обороте יד означает власть, хватку или контроль. Смысловая передача ясна современному читателю.
- source_word: כֶּלֶב
  choice: пса
  rationale: Сохранены единственное число и резкий образ еврейского текста; метафора не истолкована как конкретный враг.
- source_word: יְחִידָתִי
  choice: мою единственную
  rationale: Субстантивированное прилагательное буквально означает «мою единственную»; эллипсис сохраняет поэтический параллелизм и подлинную неоднозначность — речь может идти о единственной, драгоценной жизни.
theological_decisions:
- issue: Антропологическое значение נַפְשִׁי
  choice: «мою жизнь»
  alternative: «мою душу»
  rationale: Мольба связана с непосредственной смертельной угрозой, поэтому здесь естественнее значение «жизнь». Это не навязывает тексту позднейшее противопоставление тела и души.
- issue: Референт יְחִידָתִי
  choice: «мою единственную» с подразумеваемым словом «жизнь»
  alternative: «мою драгоценную жизнь» или «мою единственную жизнь»
  rationale: Буквальная эллиптическая форма сохраняет напряжённую поэтическую неоднозначность и не добавляет прямо не выраженной оценки «драгоценная».
translation_notes:
  register: Современный литературный русский язык с лаконичным молитвенно-поэтическим строем. Образ меча и единственного пса сохранён; идиома «из руки» передана по смыслу, а необычная эллиптическая форма יְחִידָתִי сохранена в основном тексте и пояснена сноской.
