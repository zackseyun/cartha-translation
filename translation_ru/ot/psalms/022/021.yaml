base_translation:
  language: en
  yaml_path: translation/ot/psalms/022/021.yaml
  text: Save me from the mouth of the lion[b][a], and from the horns of the wild oxen—you have answered me.
translation:
  language: ru
  text: Спаси меня от пасти льва и от рогов диких быков[a] — Ты ответил мне.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «диких волов»; возможно, имеются в виду туры — могучие дикие представители бычьих.'
    reason: lexical_alternative
  - marker: b
    text: 'Последнюю фразу можно понимать как внезапное утверждение о полученном ответе: «Ты ответил мне». Она отмечает переход от мольбы к уверенности.'
    reason: alternative_reading
lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Спаси меня
  rationale: Побудительная форма породы хифиль от ישׁע с суффиксом 1-го лица выражает прямую и настойчивую просьбу об избавлении. «Спаси меня» естественно и ёмко передаёт её по-русски.
- source_word: מִפִּי
  choice: от пасти
  rationale: Буквально — «от рта». Применительно ко льву русское «пасть» точно сохраняет телесный образ и звучит естественнее, чем «рот».
- source_word: אַרְיֵה
  choice: льва
  rationale: Существительное стоит в единственном числе без артикля. В русском родительный «льва» естественно передаёт обобщённый поэтический образ без необходимости добавлять определённость.
- source_word: וּמִקַּרְנֵי
  choice: и от рогов
  rationale: Союз с предлогом продолжает просьбу, называя вторую угрозу. Конкретный образ рогов сохранён буквально.
- source_word: רֵמִים
  choice: диких быков
  rationale: Слово обозначает крупных и могучих диких представителей бычьих, вероятно туров. «Дикие быки» понятно современному читателю; более точное «туры» вынесено в примечание как возможный вариант.
- source_word: עֲנִיתָנִי
  choice: Ты ответил мне
  rationale: Перфект 2-го лица мужского рода единственного числа от ענה с суффиксом 1-го лица обычно означает «Ты ответил мне». Внезапный переход от мольбы к утверждению сохранён; прописная буква в местоимении соответствует принятому русскому библейскому регистру обращения к Богу.
theological_decisions:
- issue: Следует ли понимать עֲנִיתָנִי как продолжение просьбы или как заявление о полученном ответе
  choice: 'Самостоятельное заявление: «Ты ответил мне»'
  alternative: 'Понимать всю строку как продолжающуюся просьбу, например: «от рогов диких быков спаси (услышь) меня»'
  rationale: В еврейском тексте стоит перфект, а не императив. Резкий поворот от мольбы к уверенности согласуется с композиционным переходом псалма к возвещению и хвале. Тире подчёркивает смену тона, не устраняя присущую строке напряжённость.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим звучанием. Сохранены параллельные образы пасти и рогов; тире передаёт резкий синтаксический и смысловой поворот еврейской строки.
