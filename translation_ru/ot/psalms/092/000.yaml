lexical_decisions:
- source_word: מִזְמוֹר
  choice: псалом
  rationale: Обычное обозначение псалма, нередко подразумевающее музыкальное исполнение; в русском заголовке «псалом» — точный и естественный эквивалент.
- source_word: שִׁיר
  choice: песнь
  rationale: Сохраняет отдельное существительное рядом со словом «псалом», не сводя два еврейских термина к одному; «песнь» соответствует возвышенному, но понятному регистру Псалтири.
- source_word: לְיוֹם
  choice: на день
  rationale: Предлог לְ выражает предназначение или соотнесённость. Русское «на день» естественно передаёт назначение песни для данного дня и сохраняет структуру исходного выражения.
- source_word: הַשַּׁבָּת
  choice: субботний
  rationale: Прилагательное в сочетании «день субботний» естественно передаёт определённый «день субботы» и сохраняет именно значение субботы, а не общее понятие отдыха.
theological_decisions:
- issue: Надписание или первая поэтическая строка
  choice: 'Оформить как надписание: «Псалом. Песнь на день субботний.»'
  alternative: Передать как первую строку псалма без особого оформления надписания.
  rationale: В еврейском тексте дана именная конструкция без личной формы глагола; её литературная функция — надписание. Такое оформление не добавляет отсутствующего в оригинале утверждения.
translation_notes:
  register: Современный литературный русский с традиционной для Псалтири краткостью. «Песнь» и постпозитивное «субботний» придают заголовку достоинство, оставаясь понятными современному читателю.
