lexical_decisions:
- source_word: וַתַּבֵּט עֵינִי
  choice: Мой глаз увидел
  rationale: Сохраняет единственное число עֵינִי и прямое зрительное значение נבט. Объект увиденного естественно уточняется из контекста следующей строки, однако не превращается в отдельное слово «поражение» без оговорки.
- source_word: בְּשׁוּרָי
  choice: тех, кто подстерегал меня
  rationale: Редкое существительное связано с наблюдением; в данном контексте оно обозначает враждебных наблюдателей. «Подстерегал» естественно передаёт эту враждебность, не сводя значение просто к общему слову «враги».
- source_word: בַּקָּמִים עָלַי
  choice: восставших против меня
  rationale: Сохраняет образ קום с עַל — враждебно вставать или выступать против кого-либо.
- source_word: מְרֵעִים
  choice: злодеях
  rationale: Причастная форма Hiphil от רעע обозначает творящих зло или причиняющих вред; «злодеи» кратко и естественно передаёт нравственный и враждебный смысл.
- source_word: תִּשְׁמַעְנָה אָזְנָי
  choice: мои уши услышали
  rationale: Сохраняет поэтическое олицетворение ушей и согласование глагола с אָזְנָי. Прошедшее совершенного вида соответствует параллельному завершённому восприятию в первой половине стиха, хотя форма допускает и иное временно-аспектуальное понимание.
theological_decisions:
- issue: Неявный объект зрительного и слухового восприятия
  choice: передать как «увидел поражение» и «услышали о злодеях»
  alternative: «смотрит на подстерегающих меня; слышат о восставших против меня злодеях» без указания на их участь
  rationale: В еврейской поэзии глаголы «видеть на ком-либо» и «слышать о ком-либо» могут подразумевать, что говорящий стал свидетелем желанной участи противников. Слово «поражение» делает русский текст естественным, но как контекстуальное восполнение отмечено сноской, чтобы не скрывать эллипсис оригинала.
translation_notes:
  register: Современный литературный русский с сохранением поэтического единственного числа «мой глаз» и параллелизма зрения и слуха. Редкое בְּשׁוּרָי передано не общим словом «враги», а более конкретным «те, кто подстерегал», с буквальной альтернативой в сноске.
