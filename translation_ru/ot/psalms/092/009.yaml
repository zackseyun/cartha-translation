source:
  edition: WLC
  text: כִּ֤י הִנֵּ֪ה אֹיְבֶ֡י/ךָ יְֽהוָ֗ה כִּֽי הִנֵּ֣ה אֹיְבֶ֣י/ךָ יֹאבֵ֑דוּ יִ֝תְפָּרְד֗וּ כָּל פֹּ֥עֲלֵי אָֽוֶן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/009.yaml
  text: For behold[a], your enemies, O Yahweh— for behold, your enemies will perish; all workers of wickedness will be scattered.
translation:
  language: ru
  text: Ибо вот враги Твои, Яхве, — ибо вот враги Твои погибнут; рассеются все творящие беззаконие[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все злодеи»; буквально: «все творящие беззаконие».'
    reason: Лаконичный вариант передаёт смысл выражения, тогда как основной текст сохраняет его образную структуру.
lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: Сохраняет пояснительно-причинную связь с предыдущим стихом и соответствует возвышенному поэтическому регистру.
- source_word: הִנֵּה
  choice: вот
  rationale: Передаёт указательно-усилительную функцию частицы естественным и понятным современным русским словом.
- source_word: אֹיְבֶיךָ
  choice: враги Твои
  rationale: Прямо передаёт форму множественного числа с суффиксом второго лица единственного числа; прописная буква обозначает обращение к Богу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога, не заменяя его титулом.
- source_word: כִּי הִנֵּה ... כִּי הִנֵּה
  choice: ибо вот ... ибо вот
  rationale: Сохраняет намеренный поэтический повтор, усиливающий торжественность и непреложность утверждения.
- source_word: יֹאבֵדוּ
  choice: погибнут
  rationale: Естественно передаёт значение אבד, не уточняя сверх текста способ гибели.
- source_word: יִתְפָּרְדוּ
  choice: рассеются
  rationale: Передаёт возвратную форму со значением разделения и распада единой группы; хорошо соответствует поэтическому параллелизму.
- source_word: כָּל
  choice: все
  rationale: Сохраняет всеобщий охват еврейского выражения.
- source_word: פֹּעֲלֵי אָוֶן
  choice: творящие беззаконие
  rationale: Передаёт образное еврейское выражение буквально и при этом естественно для русского библейско-поэтического стиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе прямо стоит тетраграмматон; форма «Яхве» сохраняет личное имя, не подменяя его титулом и не вводя конфессионально окрашенную традиционную форму.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Сохранены повтор «ибо вот» и синтаксический параллелизм еврейского стиха; тире обозначает напряжённую паузу после обращения.
