lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Но Ты
  rationale: Союз וְ в сочетании с независимым местоимением создаёт контраст с участью нечестивых в предыдущем стихе; по-русски это естественно передаётся словом «Но».
- source_word: מָרוֹם
  choice: превознесён
  rationale: Слово обозначает высоту или возвышенное положение. В отношении Бога «превознесён» естественно передаёт пространственно-метафорический смысл, не превращая слово в титул «Всевышний».
- source_word: לְ/עֹלָם
  choice: вовеки
  rationale: Выражает непреходящую длительность. «Вовеки» сохраняет поэтическую торжественность псалма и понятно современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени «Яхве», а не заменён титулом «Господь»; в русском прямое обращение не требует отдельной частицы наподобие английского O.
theological_decisions:
- issue: Передача имени יְהוָה в прямом обращении
  choice: Яхве
  alternative: Господи
  rationale: В еврейском тексте стоит личное имя Бога. Его передача как «Яхве» сохраняет исходное именование, тогда как «Господи» заменяет имя титулом.
- issue: Значение מָרוֹם
  choice: превознесён
  alternative: Всевышний
  rationale: Контекст утверждает вечное возвышенное положение Яхве, но само слово здесь не обязательно является божественным титулом; перевод не должен устранять эту лексическую открытость.
translation_notes:
  register: Современный литературный русский с умеренно торжественным псалмическим звучанием. Инверсия «вовеки превознесён» подчёркивает вечность Божьего возвышения; прописное «Ты» соответствует традиции благоговейного прямого обращения.
