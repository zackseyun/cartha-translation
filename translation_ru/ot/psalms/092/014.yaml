lexical_decisions:
- source_word: עוֹד
  choice: всё ещё
  rationale: Передаёт продолжение плодоношения и жизненной силы, описанных в предшествующем образе деревьев.
- source_word: יְנוּבוּן
  choice: приносят плод
  rationale: Глагол נוב обозначает произведение плода и точно продолжает древесный образ контекста.
- source_word: בְּשֵׂיבָה
  choice: в старости
  rationale: Существительное связано с сединой, но идиоматически обозначает старость; русский оборот естественно передаёт временное значение.
- source_word: דְּשֵׁנִים
  choice: сочны
  rationale: Буквально слово значит «тучны, упитанны», но применительно к растениям выражает насыщенность соком и жизненную силу.
- source_word: רַעֲנַנִּים
  choice: зелены
  rationale: Слово описывает свежую зелёную растительность; этот выбор сохраняет образ цветущего дерева.
- source_word: יִהְיוּ
  choice: они … зелены
  rationale: Имперфект понят как общеописательный и передан настоящим временем, естественным для общего утверждения о праведниках.
theological_decisions:
- issue: Видо-временное значение еврейских имперфектов
  choice: 'Настоящее время как общее, продолжающееся описание: «приносят… сочны и зелены»'
  alternative: 'Будущее время: «будут приносить… будут сочны и зелены»'
  rationale: В контексте это общее описание праведников посредством образа посаженных деревьев, однако еврейские формы допускают и будущее прочтение, которое отмечено в сноске.
