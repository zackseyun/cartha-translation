lexical_decisions:
- source_word: מַה גָּדְלוּ
  choice: Как велики
  rationale: Восклицательное מַה выражает восхищение, а стативное употребление перфекта גָּדְלוּ естественно передаётся настоящим временем.
- source_word: מַעֲשֶׂיךָ
  choice: Твои дела
  rationale: «Дела» сохраняет широкий смысл Божьих деяний, не ограничивая его только творением или отдельными поступками.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: מְאֹד עָמְקוּ
  choice: Как глубоки
  rationale: Повторная восклицательная конструкция по-русски естественно передаёт усиленный смысл «весьма глубоки» и сохраняет поэтический параллелизм.
- source_word: מַחְשְׁבֹתֶיךָ
  choice: Твои мысли
  rationale: «Мысли» — наиболее прямое соответствие; оно сохраняет широту значения, которое может также включать замыслы и намерения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога. Транслитерация «Яхве» сохраняет это отличие от титула, не вводя дополнительного толкования.
- issue: Значение מַחְשְׁבֹתֶיךָ
  choice: мысли
  alternative: замыслы; намерения
  rationale: Контекст допускает как мысли Божьи, так и Его замыслы. Основной текст сохраняет более широкое и прямое значение, а альтернативы отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным поэтическим звучанием. Восклицательный параллелизм передаёт восхищение псалмопевца; местоимения, относящиеся к Богу, написаны с прописной буквы как стилистический выбор.
