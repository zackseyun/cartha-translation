  text: ט֗וֹב לְ/הֹד֥וֹת לַ/יהוָ֑ה וּ/לְ/זַמֵּ֖ר לְ/שִׁמְ/ךָ֣ עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/001.yaml
  text: It is good to give thanks to Yahweh[a], and to sing praise to your name, O Most High,
translation:
  language: ru
  text: Благо благодарить Яхве[a] и воспевать имя Твоё, Всевышний,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Яхве» — личное имя Бога, переданное четырьмя согласными יהוה (ЙХВХ).'
    reason: Пояснение передачи божественного имени.
lexical_decisions:
- source_word: טוֹב
  choice: Благо
  rationale: Кратко сохраняет исходное оценочное утверждение и возвышенный поэтический строй, не сужая смысл до приятности или одной лишь уместности.
- source_word: לְהֹדוֹת
  choice: благодарить
  rationale: В данном контексте породы hifil глагол ידה обозначает благодарение; этот выбор также сохраняет отличие от музыкального восхваления во второй строке.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом, в соответствии с непосредственной формой еврейского текста.
- source_word: וּלְזַמֵּר
  choice: и воспевать
  rationale: Глагол זמר в породе piel здесь указывает на музыкальное прославление; «воспевать» естественно и не уточняет наличие инструментов.
- source_word: לְשִׁמְךָ
  choice: имя Твоё
  rationale: Сохраняет библейский образ имени, включающий явленную личность и славу Бога, не упрощая выражение до «Тебя».
- source_word: עֶלְיוֹן
  choice: Всевышний
  rationale: Устоявшийся и понятный русский эквивалент божественного титула; синтаксически передан как обращение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: Еврейский текст прямо содержит тетраграмматон. «Яхве» сохраняет личное заветное имя и наиболее вероятную научную реконструкцию произношения; примечание поясняет форму оригинала.
- issue: Смысл выражения «имя Твоё»
  choice: сохранить буквальный образ
  alternative: Тебя; славу Твою
  rationale: «Имя» несёт богословское и поэтическое значение, связанное с Божьей личностью и славой; замена сняла бы смысловую многослойность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Инверсия «имя Твоё» и слово «благо» поддерживают ритм псалма, оставаясь понятными современному читателю.
