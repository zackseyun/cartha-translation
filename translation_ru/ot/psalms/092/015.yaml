  text: לְ֭/הַגִּיד כִּֽי יָשָׁ֣ר יְהוָ֑ה צ֝וּרִ֗/י וְֽ/לֹא עלת/ה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/015.yaml
  text: to declare that Yahweh is upright; he is my rock[a], and there is no unrighteousness in him.
translation:
  language: ru
  text: возвещать, что Яхве праведен; Он — моя скала, и нет в Нём несправедливости[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неправды».'
    reason: 'Лексическая альтернатива: עַוְלָתָה может обозначать как несправедливость, так и неправду или кривду в более широком нравственном смысле.'
lexical_decisions:
- source_word: לְהַגִּיד
  choice: возвещать
  rationale: Инфинитив выражает цель или результат по отношению к предыдущему контексту. «Возвещать» сохраняет публичный и торжественный оттенок глагола.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание возвещения, а не причину.
- source_word: יָשָׁר
  choice: праведен
  rationale: При описании Бога слово указывает на нравственную прямоту и безупречность. «Праведен» естественно звучит в современном русском библейском стиле и не сужает смысл исключительно до судебной справедливости.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
- source_word: צוּרִי
  choice: моя скала
  rationale: Сохранён конкретный и устойчивый для Псалтири образ скалы как надёжной опоры и защиты.
- source_word: וְלֹא עַוְלָתָה בּוֹ
  choice: и нет в Нём несправедливости
  rationale: Безглагольное отрицательное предложение естественно передано русской конструкцией «нет в Нём». «Несправедливость» отражает значение неправды и неправосудия.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Соотношение יָשָׁר и עַוְלָתָה
  choice: «праведен» и «несправедливости»
  alternative: «справедлив» и «неправды»
  rationale: Перевод сохраняет утверждение как о всецелой нравственной правоте Бога, так и об отсутствии в Нём несправедливости, не сводя первую характеристику только к судебной сфере.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Сохранены метафора скалы, личное имя Яхве и синтаксическая связь инфинитива с предыдущим стихом.
