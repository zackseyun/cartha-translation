  text: The righteous flourishes like the palm tree[b][a]; he grows like a cedar in Lebanon.
translation:
  language: ru
  text: Праведник расцветёт, как пальма; вырастет, как кедр на Ливане.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Праведник расцветёт, как пальма, как кедр на Ливане разрастётся». Последний глагол может означать «расти», «разрастаться», «становиться великим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода в единственном числе; «праведник» естественно передаёт форму оригинала и допускает обобщённое, представительное значение.
- source_word: כַּתָּמָר
  choice: как пальма
  rationale: Сравнительная частица כְּ и существительное תָּמָר образуют прямое сравнение; «пальма» сохраняет древесный образ без излишней ботанической конкретизации.
- source_word: יִפְרָח
  choice: расцветёт
  rationale: Глагол פרח обозначает распускание, цветение и, переносно, процветание; «расцветёт» сохраняет одновременно растительный образ и метафорический смысл.
- source_word: כְּאֶרֶז
  choice: как кедр
  rationale: Прямое и естественное по-русски сравнение с кедром.
- source_word: בַּלְּבָנוֹן
  choice: на Ливане
  rationale: Предлог בְּ имеет локативное значение; традиционное русское «на Ливане» естественно обозначает горную область и ближе к «в Ливане», чем родительное «ливанский».
- source_word: יִשְׂגֶּה
  choice: вырастет
  rationale: Глагол שׂגה передаёт рост, увеличение или достижение величия; в параллелизме с кедром «вырастет» естественно сохраняет образ энергичного роста, не уточняя без необходимости «ввысь».
theological_decisions:
- issue: Обобщённое значение единственного числа צַדִּיק
  choice: 'Сохранено единственное число: «праведник»'
  alternative: «Праведные»
  rationale: Еврейское единственное число может иметь представительное значение, однако перевод сохраняет грамматическую форму и не сужает её богословский смысл.
