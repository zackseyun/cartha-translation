  text: שְׁ֭תוּלִים בְּ/בֵ֣ית יְהוָ֑ה בְּ/חַצְר֖וֹת אֱלֹהֵ֣י/נוּ יַפְרִֽיחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/013.yaml
  text: Planted in the house of Yahweh[b][a], they will flourish in the courts of our God.
translation:
  language: ru
  text: Посаженные в доме Яхве[a], они расцветут во дворах[b] нашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. ЙХВХ (тетраграмматон), здесь передано как «Яхве».
    reason: alternative_reading
  - marker: b
    text: 'Или: «во внутренних дворах». Здесь имеются в виду дворы храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתוּלִים
  choice: Посаженные
  rationale: Страдательное причастие со значением «посаженные, высаженные». Выбор сохраняет растительную метафору без добавочного усиления.
- source_word: בְּבֵית
  choice: в доме
  rationale: בַּיִת буквально означает «дом»; здесь речь может идти о храме, однако «дом» сохраняет образ и по-русски понятно в сочетании «дом Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: בְּחַצְרוֹת
  choice: во дворах
  rationale: חָצֵר обозначает двор, здесь — дворы храмового комплекса. Множественное число исходного текста сохранено.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Точная и естественная передача формы с суффиксом первого лица множественного числа.
- source_word: יַפְרִיחוּ
  choice: расцветут
  rationale: Форма от פרח может означать «пустить ростки», «зацвести», «процветать». «Расцветут» естественно продолжает растительную метафору и передаёт состояние жизненной полноты.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с краткой, возвышенной поэтической формой. Синтаксис сохраняет начальное причастие еврейского текста и параллель «в доме Яхве — во дворах нашего Бога».
