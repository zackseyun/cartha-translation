lexical_decisions:
- source_word: לְהַגִּיד
  choice: возвещать
  rationale: Инфинитив с לְ продолжает мысль предыдущего стиха и выражает то, что благо делать. «Возвещать» сохраняет публичный и торжественный оттенок глагола, не звуча архаично.
- source_word: בַּבֹּקֶר
  choice: по утрам
  rationale: Предлог בְּ с определённым существительным обозначает время. В параллелизме с формой множественного числа «по ночам» русское «по утрам» естественно передаёт регулярность действия.
- source_word: חַסְדֶּךָ
  choice: Твою милость
  rationale: חֶסֶד объединяет значения благоволения, верной любви и неизменной доброты. «Милость» — ёмкий, понятный и укоренённый в русской библейской речи эквивалент; аспект постоянства поддерживается параллельным словом «верность».
- source_word: וֶאֱמוּנָתְךָ
  choice: и Твою верность
  rationale: אֱמוּנָה здесь означает надёжность и неизменность Бога. «Верность» естественно передаёт это значение и образует точный смысловой параллелизм с חֶסֶד.
- source_word: בַּלֵּילוֹת
  choice: по ночам
  rationale: Еврейский текст использует множественное число «ночи». Русское «по ночам» сохраняет множественность и естественно выражает повторяемое ночное прославление.
