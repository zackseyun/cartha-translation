lexical_decisions:
- source_word: בִּפְרֹחַ רְשָׁעִים
  choice: Когда нечестивые прорастают
  rationale: 'Предлог בְּ с инфинитивом вводит временное обстоятельство: «когда нечестивые прорастают». Глагол «прорастают» сохраняет растительный образ и естественно сочетается с последующим сравнением с травой.'
- source_word: כְּמוֹ עֵשֶׂב
  choice: как трава
  rationale: עֵשֶׂב обозначает траву или зелень; «трава» ясно передаёт образ быстрого, но недолговечного роста.
- source_word: וַיָּצִיצוּ
  choice: расцветают
  rationale: Глагол צוץ описывает появление ростков или цветов. «Расцветают» сохраняет растительную метафору и одновременно передаёт видимое преуспевание.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: все творящие беззаконие
  rationale: Перевод сохраняет конструкцию «делающие/творящие אָוֶן» и её нравственный смысл; «беззаконие» здесь означает злое, неправедное дело, а не только нарушение формального закона.
- source_word: לְהִשָּׁמְדָם
  choice: это к тому, чтобы они были истреблены
  rationale: Инфинитив нифаля с суффиксом 3-го лица множественного числа имеет пассивный смысл и допускает целевое либо результативное понимание. Формулировка передаёт эту связь, не вводя отсутствующего в еврейском тексте явного деятеля.
- source_word: עֲדֵי עַד
  choice: навеки
  rationale: Устойчивое выражение обозначает непреходящую длительность; «навеки» естественно и точно в данном возвышенном контексте.
theological_decisions:
- issue: Является ли процветание нечестивых лишь временным наблюдением или связано с их конечным судом
  choice: «это к тому, чтобы они были истреблены навеки»
  alternative: «к их вечному истреблению»; «лишь затем, чтобы быть истреблёнными навеки»
  rationale: Еврейское לְהִשָּׁמְדָם связывает расцвет нечестивых с конечным истреблением, но не называет прямо действующего субъекта и допускает оттенки цели и результата. Перевод сохраняет эту напряжённость, не уточняя причинность сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Параллелизм и растительная метафора сохранены; архаичная или узкоконфессиональная лексика не вводится.
