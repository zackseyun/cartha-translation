lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для хвалы в контексте псалма; «ибо» сохраняет причинный смысл и уместен в возвышенной поэтической речи.
- source_word: שִׂמַּחְתַּנִי
  choice: Ты обрадовал меня
  rationale: 'Пиэль перфекта שׂמח с суффиксом первого лица передаёт причинное действие: «Ты сделал меня радостным». Выбран естественный современный русский эквивалент.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является принятой русской транслитерацией.
- source_word: בְּפָעֳלֶךָ
  choice: Своим деянием
  rationale: פֹּעַל обозначает действие, труд или совершённое дело; предлог ב здесь естественно понимать как указание на причину или средство радости. Единственное число оригинала сохранено.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: дела рук Твоих побуждают меня
  rationale: Сохранён конкретный древнееврейский образ «дел рук». Причинно-обстоятельственное значение ב выражено по-русски конструкцией «побуждают меня», чтобы избежать неестественного сочетания с глаголом пения.
- source_word: אֲרַנֵּן
  choice: петь от радости
  rationale: Глагол רנן может обозначать как ликующее пение, так и громкий радостный возглас. В контексте псалма-песни основным выбран смысл пения, а неоднозначность отмечена в сноске. Имперфект передан настоящим временем как нынешняя реакция на Божье деяние.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Характер выражения радости в אֲרַנֵּן
  choice: петь от радости
  alternative: громко восклицать от радости
  rationale: Контекст песни поддерживает значение пения, однако лексическая широта глагола допускает и звонкий радостный возглас; эта напряжённость не устраняется, а отражается в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Заглавные местоимения при обращении к Богу соответствуют принятой русской библейской стилистике. Образ «дел рук» сохранён, а синтаксис слегка перестроен ради естественности.
