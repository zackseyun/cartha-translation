- source_word: עֲלֵי
  choice: на / под
  rationale: В первых двух употреблениях предлог передаёт игру на музыкальном инструменте; перед הִגָּיוֹן естественный русский оборот «под напев» выражает музыкальное сопровождение, не меняя смысла еврейской конструкции.
- source_word: עָשׂוֹר
  choice: десятиструнный инструмент
  rationale: В данном контексте слово обозначает инструмент с десятью струнами. Обобщённое название не приписывает ему более точный тип, чем позволяет еврейский текст.
- source_word: נָבֶל
  choice: арфа
  rationale: Это название древнего струнного инструмента, точное устройство которого неизвестно. Традиционный русский эквивалент «арфа» сохранён, а неопределённость отмечена в сноске.
- source_word: הִגָּיוֹן
  choice: напев
  rationale: Слово может обозначать размышление, негромкое бормотание или звучащую музыку. Среди перечисленных инструментов наиболее уместен музыкальный смысл; «напев» сохраняет оттенок протяжного, вдумчивого звучания.
- source_word: בְּכִנּוֹר
  choice: лиры
  rationale: כִּנּוֹר — древний струнный инструмент, обычно сопоставляемый с лирой. Родительный падеж в сочетании «напев лиры» естественно передаёт инструментальное בְּ и отличает этот инструмент от נָבֶל.
