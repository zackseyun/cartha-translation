  text: וַ/תָּ֣רֶם כִּ/רְאֵ֣ים קַרְנִ֑/י בַּ֝לֹּתִ֗י בְּ/שֶׁ֣מֶן רַעֲנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/092/010.yaml
  text: But you have exalted my horn like that of a wild ox[b][a]; I have been anointed with fresh oil.
translation:
  language: ru
  text: Но Ты вознёс мой рог, как рог дикого быка[a]; я умащён свежим маслом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово реэм обозначает могучее дикое полорогое животное, традиционно понимаемое как дикий бык. В старых переводах встречается «единорог».
    reason: cultural_note
  - marker: b
    text: 'Или, более буквально: «я увлажнён (или смешан) свежим маслом». Употреблённый здесь еврейский глагол необычен, и его точный оттенок остаётся спорным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרֶם
  choice: Ты вознёс
  rationale: Форма от רום передаёт возвышение; обращение к Богу во втором лице сохраняется. «Вознёс» соответствует возвышенному поэтическому регистру.
- source_word: כִּרְאֵים
  choice: как рог дикого быка
  rationale: רְאֵם обозначает крупное и сильное дикое полорогoe животное. Повтор слова «рог» естественно проясняет, что именно сопоставляется, не устраняя образ.
- source_word: קַרְנִי
  choice: мой рог
  rationale: Буквальный образ рога, символизирующего силу, достоинство и могущество, сохранён без истолковывающей замены на «силу» или «мощь».
- source_word: בַּלֹּתִי
  choice: я умащён
  rationale: Редкая форма от בלל допускает значения, связанные со смешиванием или увлажнением. В сочетании с маслом «умащён» естественно передаёт вероятный смысл, а неопределённость отмечена в сноске.
- source_word: בְּשֶׁמֶן
  choice: маслом
  rationale: Творительный падеж естественно передаёт употребление предлога בְּ при средстве или веществе.
- source_word: רַעֲנָן
  choice: свежим
  rationale: Прилагательное выражает свежесть, полноту жизненной силы или изобилие; в сочетании с маслом «свежим» звучит естественно и сохраняет образ.
theological_decisions:
- issue: Метафора рога
  choice: Сохранить «мой рог» как образ силы и возвышения
  alternative: 'Передать истолковывающе: «мою силу» или «моё могущество»'
  rationale: Прямое сохранение метафоры поддерживает поэтическую и богословскую выразительность еврейского текста.
- issue: Значение בַּלֹּתִי при упоминании масла
  choice: Перевести «я умащён»
  alternative: «я увлажнён», «я смешан» или «я обильно полит свежим маслом»
  rationale: Контекст масла допускает идиоматическое понимание как умащение, однако редкость глагольной формы не позволяет скрывать лексическую неопределённость, поэтому более буквальные варианты вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимение «Ты» написано с прописной буквы как традиционное уважительное обращение к Богу; синтаксис краток и сохраняет параллельность образов.
