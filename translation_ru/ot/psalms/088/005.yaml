  text: בַּ/מֵּתִ֗ים חָ֫פְשִׁ֥י כְּמ֤וֹ חֲלָלִ֨ים שֹׁ֥כְבֵי קֶ֗בֶר אֲשֶׁ֤ר לֹ֣א זְכַרְתָּ֣/ם ע֑וֹד וְ֝/הֵ֗מָּה מִ/יָּדְ/ךָ֥ נִגְזָֽרוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/005.yaml
  text: I am set free among the dead[a], like the slain who lie in the grave, whom you remember no more[c][b], and they are cut off from your hand.
translation:
  language: ru
  text: Среди мёртвых я свободен[a], словно убитые, лежащие в могиле, о которых Ты больше не вспоминаешь[b]; они отсечены от Твоей руки[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свободен среди мёртвых». Слово означает «свободный, освобождённый» и здесь, вероятно, звучит с горькой иронией: говорящий уже словно исключён из мира живых.'
    reason: lexical_alternative
  - marker: b
    text: «Вспоминать» здесь означает не только хранить в памяти, но и обращать внимание, действовать ради кого-либо.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «отделены от Твоей руки» или «отсечены от Твоей руки». «Рука» — образ силы, власти или попечения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמֵּתִים
  choice: среди мёртвых
  rationale: Предлог בְּ с формой множественного числа передаёт нахождение в среде или числе мёртвых, а не просто сопровождение.
- source_word: חָפְשִׁי
  choice: свободен
  rationale: Сохраняет парадоксальный и, вероятно, горько-иронический образ свободы как освобождения от удела и связей живых; добавление «оставлен» или «забыт» необоснованно снимало бы неоднозначность.
- source_word: חֲלָלִים
  choice: убитые
  rationale: В поэтическом контексте слово обычно обозначает павших насильственной смертью; «убитые» понятно современному читателю и не сужает образ до конкретного оружия.
- source_word: שֹׁכְבֵי קֶבֶר
  choice: лежащие в могиле
  rationale: Передаёт причастную конструкцию и длительное состояние умерших; «могила» естественно соответствует קֶבֶר.
- source_word: אֲשֶׁר לֹא זְכַרְתָּם עוֹד
  choice: о которых Ты больше не вспоминаешь
  rationale: Сохраняет глагол «помнить» и наречное значение עוֹד, не сводя выражение только к мысленному воспоминанию.
- source_word: מִיָּדְךָ
  choice: от Твоей руки
  rationale: Сохранён древнееврейский образ руки, способный одновременно указывать на силу, власть и попечение Бога.
- source_word: נִגְזָרוּ
  choice: отсечены
  rationale: Форма Niphal от גזר выражает состояние отделённости вследствие отсечения; выбор сохраняет резкость исходной метафоры.
theological_decisions:
- issue: Божественное «воспоминание» об умерших
  choice: Сохранено буквальное «Ты больше не вспоминаешь»
  alternative: «о которых Ты больше не заботишься»
  rationale: В плаче речь идёт не о недостатке Божьего знания, а о переживаемом отсутствии действенного внимания. Буквальный образ сохраняет богословское напряжение и не превращает подразумеваемый смысл в однозначное утверждение.
- issue: Парадокс свободы среди мёртвых
  choice: «Среди мёртвых я свободен»
  alternative: «Среди мёртвых я оставлен»
  rationale: Исходный текст прямо употребляет лексику свободы или освобождения. Её сохранение передаёт мрачную иронию, не внося в текст более определённую идею оставленности.
- issue: Отсечение от Божьей руки
  choice: Сохранён образ «отсечены от Твоей руки»
  alternative: «лишены Твоей помощи»
  rationale: «Рука» может обозначать силу, власть, действие и попечение; поясняющий перевод сузил бы многозначность образа.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства молитвенного плача. Инверсия «Среди мёртвых я свободен» подчёркивает исходный парадокс, но остаётся естественной для русской поэзии. Заглавные местоимения обращения к Богу применены последовательно.
