  - marker: b
    text: «Страна забвения» — поэтическое обозначение области умерших.
    reason: cultural_note
lexical_decisions:
- source_word: הֲיִוָּדַע
  choice: разве … узнают
  rationale: Нифаль имперфекта ידע в риторическом вопросе буквально выражает значение «будет ли познано / станет ли известно». Неопределённо-личное «узнают» естественно передаёт по-русски пассивный смысл, не называя действующего лица.
- source_word: בַּחֹשֶׁךְ
  choice: во тьме
  rationale: Предлог с артиклем передан определённым поэтическим выражением «во тьме»; в контексте оно вызывает образ области смерти, не сводясь только к отсутствию света.
- source_word: פִּלְאֶךָ
  choice: о Твоём чуде
  rationale: Сохранено единственное число еврейского существительного. «Чудо» здесь может обозначать дивное деяние или чудесную силу Бога в собирательном смысле.
- source_word: וְצִדְקָתְךָ
  choice: а … о Твоей праведности
  rationale: Союз ו связывает параллельные части вопроса. Русское «а» ясно оформляет поэтический параллелизм двух обстоятельств места, не превращая связь в взаимоисключающее «или». Основным соответствием צדקה выбрана «праведность».
- source_word: בְּאֶרֶץ נְשִׁיָּה
  choice: в земле забвения
  rationale: Сохранён поэтический образ «земли забвения», обозначающий область умерших и их удалённость от мира живых.
theological_decisions:
- issue: Значение צדקה применительно к Божьему характеру и деяниям
  choice: праведность
  alternative: справедливость
  rationale: צדקה может обозначать как праведность, так и справедливость. Основной текст сохраняет более широкое «праведность», а допустимый контекстуальный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Неопределённо-личная конструкция делает риторический вопрос естественным, а перестановка параллельных членов сохраняет связь «тьма — чудо» и «земля забвения — праведность». Местоимение обращения к Богу написано с прописной буквы согласно распространённой русской библейской традиции.
