  yaml_path: translation/ot/psalms/088/012.yaml
  text: Is your wonder made known in the darkness[b][a], or your righteousness in the land of forgetfulness?
translation:
  language: ru
  text: Разве во тьме станет известно Твоё чудо, а в стране забвения[b] — Твоя праведность[a]?
  philosophy: optimal-equivalence
  footnotes:
