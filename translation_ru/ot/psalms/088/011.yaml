  yaml_path: translation/ot/psalms/088/011.yaml
  text: Is your steadfast love declared in the grave[a], your faithfulness in Abaddon?
translation:
  language: ru
  text: Разве в могиле возвещают Твою неизменную любовь, а в Аваддоне[a] — Твою верность?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в погибели» или «в месте погибели». Еврейское слово «Аваддон» — поэтическое обозначение области гибели и смерти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְסֻפַּר
  choice: разве … возвещают
  rationale: 'Вопросительная частица и форма пуаля образуют риторический вопрос с пассивным смыслом: «разве возвещается / рассказывается». Неопределённо-личная конструкция естественна по-русски и не добавляет конкретного действующего лица.'
- source_word: בַּקֶּבֶר
  choice: в могиле
  rationale: קֶבֶר обозначает могилу или место погребения; «в могиле» — точный и естественный русский эквивалент, сохраняющий образ стиха.
- source_word: חַסְדֶּךָ
  choice: о Твоей неизменной любви
  rationale: חֶסֶד сочетает любовь, верность и постоянство отношения. «Неизменная любовь» передаёт устойчивость этой любви, не сводя слово только к милости или к явно конфессиональной формуле.
- source_word: אֱמוּנָתְךָ
  choice: о Твоей верности
  rationale: אֱמוּנָה здесь означает Божью надёжность и верность и образует смысловой параллелизм с חֶסֶד.
- source_word: בָּאֲבַדּוֹן
  choice: в Аваддоне
  rationale: אֲבַדּוֹן может означать погибель либо поэтически названную область гибели и смерти. Транслитерация сохраняет особый образ исходного текста; значение поясняется в сноске.
theological_decisions:
- issue: Передавать ли אֲבַדּוֹן как нарицательное «погибель» или сохранить как поэтическое обозначение области смерти
  choice: Аваддон
  alternative: погибель; место погибели
  rationale: В параллели с «могилой» слово, вероятно, обозначает область смерти, а не только отвлечённое уничтожение. «Аваддон» сохраняет образ и подлинную многозначность; нарицательные варианты приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Риторический вопрос и параллелизм двух полустиший сохранены; тире во второй части естественно восполняет глагол. Местоимения, обращённые к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
