  text: כִּֽי שָֽׂבְעָ֣ה בְ/רָע֣וֹת נַפְשִׁ֑/י וְ/חַיַּ֗/י לִ/שְׁא֥וֹל הִגִּֽיעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/003.yaml
  text: For my soul is full of troubles[a], and my life draws near to Sheol.
translation:
  language: ru
  text: Ибо душа моя полна бед, и жизнь моя приблизилась к шеолу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к могиле»; или: «к миру мёртвых». В еврейском тексте — «шеол».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит причину состояния псалмопевца; «ибо» естественно сохраняет причинную связь и соответствует возвышенному поэтическому регистру.
- source_word: שָׂבְעָה
  choice: полна
  rationale: Глагол буквально передаёт насыщение или наполнение; в сочетании с бедами русское «полна» ясно и естественно сохраняет образ переполненности.
- source_word: בְרָעוֹת
  choice: бед
  rationale: Во множественном числе רָעוֹת здесь обозначает несчастья и тяготы, постигшие говорящего, а не совершённое им нравственное зло.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נֶפֶשׁ допускает значения «душа», «жизнь», «я»; «душа моя» сохраняет отличие от חַיַּי во второй строке и поэтический параллелизм.
- source_word: וְחַיַּי
  choice: и жизнь моя
  rationale: Формально множественное חַיִּים обычно употребляется как отвлечённое существительное со значением «жизнь».
- source_word: לִשְׁאוֹל
  choice: к шеолу
  rationale: Транслитерация сохраняет древнееврейское представление о мире мёртвых, не сужая его до физической могилы и не отождествляя с более поздними богословскими категориями.
- source_word: הִגִּיעוּ
  choice: приблизилась
  rationale: В данном поэтическом контексте форма со значением достижения или прибытия описывает жизнь, подошедшую к шеолу; «приблизилась» передаёт близость смерти, не утверждая, что говорящий уже оказался среди мёртвых.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: «Шеол» сохраняет исходный образ и его смысловую широту, не вводя узкого понимания как отдельной могилы или поздней концепции ада.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «душа моя», «жизнь моя» поддерживает ритм и стиль псалма, оставаясь понятной современному читателю.
