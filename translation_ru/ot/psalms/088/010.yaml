lexical_decisions:
- source_word: הֲלַמֵּתִים
  choice: для мёртвых
  rationale: Предлог ל с вопросительной частицей естественно передаётся как «для мёртвых»; формулировка сохраняет направленность и риторическую силу вопроса.
- source_word: תַּעֲשֶׂה פֶּלֶא
  choice: Ты творишь чудеса
  rationale: Сочетание עשה с פלא означает совершение необычайных Божьих деяний; русское «творить чудеса» естественно и уместно в возвышенной поэзии.
- source_word: אִם
  choice: разве
  rationale: Здесь אִם вводит второй параллельный риторический вопрос, а не условие; «разве» ясно передаёт ожидаемый отрицательный ответ.
- source_word: רְפָאִים
  choice: тени
  rationale: В поэтическом контексте слово обозначает умерших, пребывающих в мире мёртвых. «Тени» кратко сохраняет образность и не смешивает их с этнонимом рефаимов; значение поясняется в сноске.
- source_word: יָקוּמוּ
  choice: встанут
  rationale: Форма קום буквально выражает вставание; перевод сохраняет яркий образ, не превращая его прямо в доктринальное утверждение о воскресении.
- source_word: יוֹדוּךָ
  choice: восхвалят Тебя
  rationale: ידה в данной форме означает благодарить или прославлять; в контексте псалма «восхвалят» естественно передаёт богослужебный смысл.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неизвестно, поэтому он транслитерируется без навязывания спорного толкования.
theological_decisions:
- issue: Значение רְפָאִים в поэтическом описании мира мёртвых
  choice: тени
  alternative: духи умерших; умершие; рефаимы
  rationale: «Тени» сохраняет древнееврейскую поэтическую образность и связь с миром мёртвых, не вводя более определённой антропологии загробного состояния. Сноска устраняет возможную неясность.
- issue: Смысл глагола יָקוּמוּ применительно к умершим
  choice: встанут
  alternative: воскреснут
  rationale: Более буквальное «встанут» сохраняет риторический образ и не уточняет его как техническое учение о воскресении, хотя такая ассоциация возможна.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Повтор «Разве» передаёт параллелизм двух риторических вопросов; местоимения, обращённые к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
