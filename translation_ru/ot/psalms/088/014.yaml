id: PSA.88.14
reference: Psalms 88:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לָ/מָ֣ה יְ֭הוָה תִּזְנַ֣ח נַפְשִׁ֑/י תַּסְתִּ֖יר פָּנֶ֣י/ךָ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/014.yaml
  text: Why[a], O Yahweh[b], do you reject my soul? Why do you hide your face from me?
translation:
  language: ru
  text: Почему, Яхве, ты отвергаешь мою душу[a]? Почему скрываешь от меня своё лицо[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отвергаешь меня?» Еврейское выражение «мою душу» может также означать «меня» или «мою жизнь».'
    reason: lexical_alternative
  - marker: b
    text: «Скрывать лицо» — еврейский образ, означающий лишать кого-либо своего благосклонного присутствия или внимания.
    reason: cultural_note
lexical_decisions:
- source_word: לָמָה
  choice: почему
  rationale: Прямой вопрос о причине; краткое «почему» естественно передаёт силу плача.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: תִּזְנַח
  choice: отвергаешь
  rationale: Глагол выражает отвержение или отбрасывание; «отвергаешь» ясно и точно передаёт основной смысл.
- source_word: נַפְשִׁי
  choice: мою душу
  rationale: Сохраняет конкретное еврейское выражение и его эмоциональную глубину, не исключая значения «меня» или «мою жизнь».
- source_word: תַּסְתִּיר
  choice: скрываешь
  rationale: Прямое и естественное соответствие глаголу со значением «скрывать, прятать».
- source_word: פָּנֶיךָ
  choice: своё лицо
  rationale: Сохраняет буквальный образ «лица», который в контексте обозначает благосклонное присутствие и внимание Бога.
- source_word: מִמֶּנִּי
  choice: от меня
  rationale: Естественно передаёт еврейскую предложную конструкцию.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблено личное имя יהוה. Форма «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Объём значения נַפְשִׁי
  choice: мою душу
  alternative: меня; мою жизнь
  rationale: Буквальный образ уместен в поэтическом плаче, но примечание сохраняет реальную возможность понимать слово как обозначение самого человека или его жизни.
- issue: Образ сокрытого лица Бога
  choice: сохранять образ буквально
  alternative: лишать меня своего благоволения; удаляться от меня
  rationale: Буквальная формулировка сохраняет богословское напряжение жалобы, тогда как примечание поясняет подразумеваемое отсутствие благосклонного присутствия и внимания.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и конкретных еврейских образов. Повтор «почему» делает подразумеваемый вопрос во второй строке естественным по-русски. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная орфографическая практика.
