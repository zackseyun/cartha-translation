lexical_decisions:
- source_word: סַבּוּנִי
  choice: окружали меня
  rationale: Форма от סבב обозначает охватывание со всех сторон; несовершенный вид по-русски естественно передаёт продолжительное действие в сочетании «весь день».
- source_word: כַמַּיִם
  choice: словно воды
  rationale: Предлог כ выражает сравнение. Множественное «воды» сохраняет поэтический образ нахлынувшей, обступившей стихии.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Естественное современное выражение, передающее действие на протяжении всего дня.
- source_word: הִקִּיפוּ
  choice: теснили меня со всех сторон
  rationale: Глагол передаёт окружение; выбранная формулировка сохраняет параллелизм, избегает тяжёлого дословного повтора и выражает враждебное стеснение.
- source_word: עָלַי
  choice: меня
  rationale: В сочетании с русским «теснили» направленность действия уже выражена винительным падежом; значение охвата, подразумеваемое על в данном контексте, уточняется словами «со всех сторон».
- source_word: יָחַד
  choice: все вместе
  rationale: Передаёт совместность и согласованность действия угрожающих сил.
