base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/015.yaml
  text: I am afflicted and near death from my youth[a]; I bear your terrors; I am overwhelmed.
translation:
  language: ru
  text: Я страдаю и с юности при смерти; несу Твои ужасы — я изнемогаю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я нёс (или: переносил) Твои ужасы». Последнее еврейское слово трудно для понимания; оно может выражать смятение, подавленность, состояние сломленности или гибели.'
    reason: Лексическая и грамматическая неоднозначность נָשָׂאתִי и אָפוּנָה.
lexical_decisions:
- source_word: עָנִי
  choice: страдаю
  rationale: В контексте плача слово обозначает бедственное, мучительное состояние, а не материальную бедность; глагольная передача естественна для современного русского языка.
- source_word: וְגֹוֵעַ
  choice: умираю
  rationale: Причастная форма передаёт продолжающееся состояние умирания или близости к смерти. «Умираю» прямо и сохраняет напряжённость еврейского выражения.
- source_word: מִנֹּעַר
  choice: с юности
  rationale: Предлог указывает на состояние, продолжающееся от раннего периода жизни; «с юности» — естественная русская формулировка.
- source_word: נָשָׂאתִי
  choice: несу на себе
  rationale: Перфект от נשׂא допускает оттенки «понёс», «носил», «переносил». В данном плаче речь идёт о бремени Божьих ужасов; настоящее время по-русски связывает этот опыт с продолжающимся страданием, не исключая его длительности.
- source_word: אֵמֶיךָ
  choice: Твои ужасы
  rationale: Слово означает ужасы, вызывающие сильный страх. Притяжательное местоимение сохраняет прямое обращение к Богу и не ослабляет приписываемую Ему связь с ними.
- source_word: אָפוּנָה
  choice: я изнемогаю
  rationale: Редкая и трудная форма допускает значения подавленности, растерянности или полного надлома. «Изнемогаю» передаёт состояние человека, доведённого ужасами до предела, не утверждая чрезмерно точного значения.
theological_decisions:
- issue: Связь выражения «Твои ужасы» с Богом
  choice: 'Сохранено прямое обращение: «Твои ужасы»'
  alternative: Передать как ужасы, лишь испытываемые в присутствии Бога, или смягчить указание на Божье действие
  rationale: Суффикс второго лица прямо связывает ужасы с Богом. Перевод сохраняет напряжённость плача и не ослабляет возможную мысль о том, что они исходят от Его действий.
- issue: Временной оттенок נָשָׂאתִי
  choice: «несу на себе» как продолжающееся бремя
  alternative: «я перенёс» или «я носил» как завершённое либо ретроспективное действие
  rationale: Еврейский перфект допускает взгляд на уже пережитое, однако контекст текущего плача и последующий трудный глагол позволяют естественно выразить продолжающееся состояние. Альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью плача. Прописные формы местоимений при обращении к Богу выбраны как уместная русская библейская норма. Тире подчёркивает итоговое состояние, вызванное несением ужасов.
