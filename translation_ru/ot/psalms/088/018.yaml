  text: הִרְחַ֣קְתָּ מִ֭מֶּ/נִּי אֹהֵ֣ב וָ/רֵ֑עַ מְֽיֻדָּעַ֥/י מַחְשָֽׁךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/018.yaml
  text: You have put far from me lover and friend[b][a]; my acquaintances are darkness.
translation:
  language: ru
  text: Ты удалил от меня любящего меня и друга; мои знакомые — тьма.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мои знакомые — во тьме»; или: «тьма — мой единственный спутник». Концовка еврейского текста предельно кратка и допускает разные толкования.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «тьма — мои знакомые».'
    reason: previous_rendering
lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: Ты удалил
  rationale: Каузативная форма породы hифиль от רחק означает, что Бог, к Которому обращён псалмопевец, сделал этих людей далёкими от него. «Удалил» естественно передаёт это действие по-русски.
- source_word: מִמֶּנִּי
  choice: от меня
  rationale: Предлог מן с суффиксом первого лица обозначает отделение от говорящего.
- source_word: אֹהֵב
  choice: любящего меня
  rationale: Субстантивированное причастие от אהב обозначает того, кто любит псалмопевца. Такое выражение сохраняет активную направленность любви и не превращает его в «любимого».
- source_word: וָרֵעַ
  choice: и друга
  rationale: רֵעַ в данном контексте означает друга или близкого товарища; «друг» естественно сочетается с плачем об утрате человеческой близости.
- source_word: מְיֻדָּעַי
  choice: мои знакомые
  rationale: Форма с суффиксом первого лица обозначает людей, которых говорящий знает, — его знакомых. Перевод не усиливает значение до «близких друзей», уже названных в первой части стиха.
- source_word: מַחְשָׁךְ
  choice: тьма
  rationale: Заключительное существительное образует предельно краткую безглагольную конструкцию. Буквальное «мои знакомые — тьма» сохраняет порядок слов и мрачную образность еврейского текста, не устраняя его неоднозначность.
