  text: עֵינִ֥/י דָאֲבָ֗ה מִנִּ֫י עֹ֥נִי קְרָאתִ֣י/ךָ יְהוָ֣ה בְּ/כָל י֑וֹם שִׁטַּ֖חְתִּי אֵלֶ֣י/ךָ כַפָּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/088/009.yaml
  text: My eye grows weak because of affliction; I call on you every day[a], O Yahweh; I spread out my hands to you.
translation:
  language: ru
  text: Мой глаз слабеет от страдания[a]. Каждый день я взываю к Тебе, Яхве, простираю к Тебе руки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мой глаз угасает от страдания»; возможно также: «Мой глаз болит от бедствия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינִי
  choice: Мой глаз
  rationale: Сохранено единственное число еврейского текста. В поэтическом контексте «глаз» может обозначать зрение, жизненные силы или состояние всего человека.
- source_word: דָאֲבָה
  choice: изнемог
  rationale: Глагол передаёт ослабление, томление или угасание под тяжестью страдания. «Изнемог» сохраняет поэтическую выразительность и не сводит смысл только к физической боли.
- source_word: מִנִּי עֹנִי
  choice: от страдания
  rationale: Предлог указывает на источник или причину, а עֹנִי здесь обозначает бедствие, угнетённость или страдание.
- source_word: קְרָאתִיךָ
  choice: я взываю к Тебе
  rationale: В сочетании с «каждый день» завершённая форма описывает регулярно совершаемое обращение в молитве. «Взываю» естественно передаёт молитвенный призыв.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: בְּכָל יוֹם
  choice: каждый день
  rationale: Фраза наиболее естественно выражает повторяемость изо дня в день, а не обязательно непрерывность на протяжении целого дня.
- source_word: שִׁטַּחְתִּי אֵלֶיךָ כַפָּי
  choice: простираю к Тебе руки
  rationale: Передан жест молитвы и мольбы. Русское «руки» естественнее буквального «ладони», а «простираю» сохраняет направленность жеста к Богу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохранено личное имя; форма «Яхве» ближе к принятой научной реконструкции произношения.
- issue: Временной вид молитвенных действий
  choice: 'настоящее время: «взываю… простираю»'
  alternative: 'прошедшее время: «воззвал… простёр»'
  rationale: Хотя в еврейском употреблены формы qatal, выражение «каждый день» допускает и поддерживает характеристику повторяющегося действия. Настоящее время естественно передаёт постоянную молитвенную практику, не отрицая её начала в прошлом.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Поэтическое единственное число «мой глаз» сохранено, а жест молитвы передан естественным русским выражением «простираю руки».
