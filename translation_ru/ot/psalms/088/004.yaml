  yaml_path: translation/ot/psalms/088/004.yaml
  text: I am counted among those going down to the pit[b][a]; I have become like a man without strength.
translation:
  language: ru
  text: Я причислен к тем, кто сходит в яму[a]; я стал как человек без силы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «в могилу». В еврейской поэзии яма часто служит образом смерти.
    reason: lexical_alternative
  - marker: b
    text: Или «как сильный человек без силы». Еврейское слово может обозначать мужчину с оттенком силы и крепости.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶחְשַׁבְתִּי
  choice: Я причислен
  rationale: Нифаль глагола חשב означает, что говорящего считают принадлежащим к определённой группе. Краткая страдательная конструкция сохраняет образный строй и передаёт наличное состояние, выраженное еврейским перфектом.
- source_word: עִם
  choice: к тем, кто
  rationale: Буквально «с», но после «причислен» современная русская конструкция «к тем, кто» естественно передаёт включение в группу.
- source_word: יוֹרְדֵי בוֹר
  choice: тем, кто сходит в яму
  rationale: Причастная конструкция изображает людей, нисходящих в яму — поэтический образ приближения к смерти. Настоящее время сохраняет живость плача.
- source_word: בּוֹר
  choice: яму
  rationale: «Яма» непосредственно сохраняет еврейский образ; в данном контексте она обозначает могилу или область смерти, что пояснено в сноске.
- source_word: הָיִיתִי
  choice: я стал
  rationale: Перфект היה здесь допускает понимание достигнутого состояния. «Стал» передаёт переход в состояние, подобное смерти, не превращая строку в простое сообщение о прошлом.
- source_word: כְּגֶבֶר
  choice: словно мужчина
  rationale: גבר означает взрослого мужчину и может подразумевать силу. «Мужчина» сохраняет основное значение, а возможный оттенок силы отмечен в сноске.
- source_word: אֵין אֱיָל
  choice: лишённый сил
  rationale: אֱיָל означает силу или мощь. Русское множественное «сил» естественно и кратко передаёт полное отсутствие жизненной крепости.
theological_decisions:
- issue: Образ ямы как обозначение смерти
  choice: Сохранён буквальный поэтический образ «яма».
  alternative: Передать толкованием «могила» или «царство мёртвых».
  rationale: Еврейский текст использует образное בור, не уточняя устройство посмертного мира. Основной перевод сохраняет эту открытость, а сноска сообщает контекстуальное значение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом плача. Сохранены параллелизм, образ нисхождения и напряжённое противопоставление мужчины и утраченной силы; архаичное «муж» не использовано.
