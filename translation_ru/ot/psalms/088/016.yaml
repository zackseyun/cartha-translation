lexical_decisions:
- source_word: עָלַי עָבְרוּ
  choice: пронёсся надо мной
  rationale: Глагол עבר буквально означает «прошёл, перешёл», а предлог עַל с суффиксом указывает на движение над псалмопевцем или на него. В контексте всепоглощающего Божьего гнева «пронёсся надо мной» естественно передаёт и образ движения, и сокрушительную силу.
- source_word: חֲרוֹנֶיךָ
  choice: твой пылающий гнев
  rationale: Существительное חָרוֹן связано с образом жара, пылания и обозначает сильный гнев. Единственное число в русском естественно передаёт абстрактно-интенсивное употребление еврейской формы.
- source_word: בִּעוּתֶיךָ
  choice: твои ужасы
  rationale: Слово обозначает ужасы, то, что вызывает сильный страх. «Ужасы» прямо и поэтически сохраняет множественное число исходного текста.
- source_word: צִמְּתוּתֻנִי
  choice: уничтожили меня
  rationale: Форма от צמת выражает уничтожение, истребление или отсечение. «Уничтожили меня» ясно передаёт предельную силу плача, не ослабляя гиперболический язык стиха.
theological_decisions:
- issue: Гнев и ужасы представлены как принадлежащие Богу и исходящие от Него
  choice: Сохранена прямая формулировка «твой… твои…»
  alternative: 'Смягчить причинность: «гнев против меня разгорелся», «меня охватили ужасы»'
  rationale: Еврейский текст непосредственно приписывает гнев и ужасы адресату молитвы. Смягчение устранило бы существенное богословское напряжение плача.
translation_notes:
  register: Современный литературный русский с достоинством поэтического плача. «Пылающий гнев» сохраняет образ жара, «пронёсся надо мной» — движение и подавляющую силу, а «уничтожили меня» — предельную интенсивность исходного выражения.
