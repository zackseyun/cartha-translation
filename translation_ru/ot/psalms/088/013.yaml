lexical_decisions:
- source_word: וַאֲנִי
  choice: Но я
  rationale: Союз с самостоятельным местоимением выражает контраст и подчёркивает говорящего; «Но я» естественно передаёт обе функции по-русски.
- source_word: אֵלֶיךָ
  choice: к Тебе
  rationale: Предлог выражает направленность зова к Яхве; русское «к Тебе» точно и естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Сохранено личное имя Бога, непосредственно представленное тетраграмматоном, без замены титулом.
- source_word: שִׁוַּעְתִּי
  choice: взываю о помощи
  rationale: Глагол обозначает настойчивый крик о помощи. Настоящее время естественно передаёт продолжающееся обращение псалмопевца в контексте молитвы.
- source_word: וּבַבֹּקֶר
  choice: поутру
  rationale: Передаёт временное значение «утром» в уместном для поэтической молитвы современном литературном регистре; связь между частями выражена точкой с запятой.
- source_word: תְּפִלָּתִי
  choice: моя молитва
  rationale: Сохранены существительное в единственном числе и притяжательное значение суффикса.
- source_word: תְקַדְּמֶךָּ
  choice: предстанет перед Тобой
  rationale: Форма от קדם допускает значения выхода навстречу, встречи и предшествования. «Предстанет перед Тобой» естественно передаёт образ молитвы, достигающей Божьего присутствия, не устраняя лексическую многозначность, отмеченную в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя, не заменяя его титулом и не навязывая конфессиональную традицию произношения «Иегова».
- issue: Временной оттенок שִׁוַּעְתִּי
  choice: взываю о помощи
  alternative: воззвал о помощи; взывал о помощи
  rationale: Хотя еврейская форма формально перфективна, в молитвенно-поэтическом контексте она может описывать уже начатое и продолжающееся обращение. Настоящее время согласуется с общей ситуацией псалма, не превращая зов в завершённое событие.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим звучанием. «Поутру» уместно для псалма и остаётся понятным; синтаксис краток и сохраняет контраст, обращение и образ молитвы, предстающей перед Богом.
