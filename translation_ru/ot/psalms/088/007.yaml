  text: Your wrath has rested on me[a], and with all your breakers you have afflicted me. Selah
translation:
  language: ru
  text: 'На меня легла Твоя ярость,

    и всеми Твоими бурунами Ты причинил мне страдания. Села.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Села — значение слова неясно; вероятно, музыкальное или богослужебное указание.
    reason: uncertain_term
lexical_decisions:
- source_word: סָמְכָה
  choice: покоится
  rationale: Глагол סמך выражает опору или налегание; при ярости как подлежащем и עָלַי («на мне») настоящее «покоится» сохраняет пространственный образ и допускаемую поэтическим контекстом тяжесть, не добавляя её прямо.
- source_word: חֲמָתֶךָ
  choice: ярость Твоя
  rationale: חֵמָה обозначает жар, ярость или гнев. «Ярость» естественно передаёт здесь силу Божьего гнева и соответствует высокому регистру плача.
- source_word: מִשְׁבָּרֶיךָ
  choice: волнами Твоими
  rationale: מִשְׁבָּר — морские волны, с шумом разбивающиеся о берег или преграду. Русское «волнами» звучит естественно и сохраняет водный образ; более конкретный оттенок указан в сноске.
- source_word: עִנִּיתָ
  choice: Ты истязаешь меня
  rationale: Пиэль ענה означает причинять страдание, мучить, угнетать. В контексте всеохватывающих морских ударов «истязаешь» передаёт интенсивность действия; подразумеваемое дополнение «меня» выражено по-русски явно.
- source_word: וְכָל
  choice: и всеми
  rationale: 'Сочетание וְכָל связывает строки и выражает полноту средств воздействия; творительный падеж естественно передаёт инструментальный смысл: «всеми волнами».'
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение литургического обозначения неизвестно, поэтому оно транслитерировано, а не истолковано.
theological_decisions:
- issue: Божий гнев и Божье действие в страдании молящегося
  choice: 'Сохранено прямое обращение к Богу: Его ярость пребывает на псалмопевце, и именно Он причиняет ему страдание всеми Своими волнами.'
  alternative: Сделать волны безличным источником бедствия или ослабить «ярость» до общего обозначения скорби.
  rationale: Еврейский текст прямо приписывает Богу как гнев, так и причинение страдания. Перевод сохраняет напряжённость плача и не смягчает утверждение о Божьем действии.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Инверсия «ярость Твоя» и «волнами Твоими» поддерживает псалмический ритм, оставаясь понятной. Маркер [a] поставлен в основном тексте при слове «Села».
