lexical_decisions:
- source_word: הִרְחַקְתָּ
  choice: Ты удалил
  rationale: Порода hифиль выражает причинение удаления; «удалил» естественно передаёт действие Бога, не добавляя образ насильственного изгнания.
- source_word: מְיֻדָּעַי
  choice: тех, кто меня знает
  rationale: Форма от ידע обозначает знакомых псалмопевца, но сама по себе не требует близости, подразумеваемой словом «друзья»; описательный перевод сохраняет эту широту.
- source_word: מִמֶּנִּי
  choice: от меня
  rationale: Обычное значение отделения у предлога מן с суффиксом первого лица.
- source_word: שַׁתַּנִי
  choice: сделал меня
  rationale: Глагол שׂים буквально значит «положить, поставить», но в конструкции с предикативным дополнением естественно передаётся как «сделать кем-либо/чем-либо».
- source_word: תוֹעֵבוֹת
  choice: мерзостью
  rationale: Сильное слово передаёт предмет отвращения. Единственное число в русском естественно выражает предикативный смысл формально множественного еврейского существительного.
- source_word: לָמוֹ
  choice: для них
  rationale: Местоименная форма отсылает к ранее упомянутым знакомым; «для них» естественно передаёт то, кем они считают говорящего.
- source_word: כָּלֻא
  choice: Я заточён
  rationale: Пассивно-стативная форма от כלא обозначает пребывание взаперти или в ограничении. «Заточён» сохраняет сильный образ, не уточняя вид заключения.
- source_word: וְלֹא אֵצֵא
  choice: и не могу выйти
  rationale: Формально сказано «и не выхожу», однако после כָּלֻא контекст ясно выражает невозможность выйти; модальная передача естественна по-русски.
