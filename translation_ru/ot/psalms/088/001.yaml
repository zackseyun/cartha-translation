  yaml_path: translation/ot/psalms/088/001.yaml
  text: O Yahweh[a], God of my salvation, by day I cry out; at night I am before you.
translation:
  language: ru
  text: 'Яхве, Бог моего спасения!


    Днём я взываю,


    ночью — пред Тобой[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ночью — пред Тобой». В еврейском тексте после «ночью» нет отдельного глагола. Возможна также связь этих слов с предыдущим глаголом: «Днём и ночью я взываю пред Тобой».'
    reason: Сохранение синтаксической неоднозначности безглагольной еврейской фразы.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного Божьего имени, стоящего в прямом обращении; форма «Яхве» широко употребительна в современной русской библеистике и не заменяет имя титулом.
- source_word: אֱלֹהֵי יְשׁוּעָתִי
  choice: Бог моего спасения
  rationale: Сохранена еврейская конструкция со значением принадлежности или источника спасения, без сужения смысла до одного конкретного избавления.
- source_word: צָעַקְתִּי
  choice: я взываю
  rationale: Глагол выражает настойчивый, громкий зов о помощи. Настоящее время естественно передаёт продолжающееся действие в контексте плача, хотя еврейская форма допускает оттенок совершённого действия.
- source_word: יוֹם ... בַלַּיְלָה
  choice: днём ... ночью
  rationale: Наречная передача естественно выражает временное противопоставление дня и ночи.
- source_word: נֶגְדֶּךָ
  choice: пред Тобой
  rationale: Буквально передаёт положение молящегося перед Богом и сохраняет краткость еврейской поэзии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога. Транслитерация сохраняет различие между именем и титулом, не вводя конфессионально обусловленной замены.
- issue: Синтаксическая связь слов «ночью — пред Тобой»
  choice: Сохранена безглагольная фраза с подразумеваемым продолжением молитвенного взывания
  alternative: «ночью я предстаю пред Тобой»; «днём и ночью я взываю пред Тобой»
  rationale: Еврейский текст краток и синтаксически допускает разные способы связи. Русское тире сохраняет поэтическую недосказанность и не добавляет отсутствующий глагол.
translation_notes:
  register: Современный литературный русский с молитвенно-поэтической краткостью. Восклицательный знак оформляет прямое обращение, а тире во второй строке позволяет не восполнять отсутствующий в еврейском тексте глагол.
