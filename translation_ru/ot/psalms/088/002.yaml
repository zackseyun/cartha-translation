lexical_decisions:
- source_word: תָּב֣וֹא
  choice: Пусть … дойдёт
  rationale: Имперфект qal, согласованный с существительным женского рода «молитва», в контексте прошения естественно передаётся пожеланием. «Дойдёт до» выражает движение обращения к Богу и звучит по-русски естественнее буквального «придёт перед».
- source_word: לְפָנֶיךָ
  choice: до Тебя
  rationale: Буквально «перед Твоим лицом»; это идиома пребывания в чьём-либо присутствии. В сочетании с глаголом движения русский оборот «дойдёт до Тебя» естественно передаёт смысл непосредственного обращения к Богу, а буквальный образ отмечен в сноске.
- source_word: תְּפִלָּתִי
  choice: моя молитва
  rationale: תפלה обычно означает «молитва»; это точное и нейтральное соответствие, не сужающее смысл до мольбы.
- source_word: הַטֵּה
  choice: приклони
  rationale: Императив hiphil от נטה означает «наклонить, склонить». В сочетании со словом «ухо» традиционный русский оборот «приклони ухо» сохраняет телесную метафору внимательного слушания и остаётся понятным.
- source_word: אָזְנְךָ
  choice: ухо
  rationale: Сохранено единственное число оригинала и его образ внимательного слушания.
- source_word: לְרִנָּתִי
  choice: к моему воплю
  rationale: רנה может обозначать звонкий крик, возглас радости или плач. В скорбном контексте Псалма 88 «вопль» передаёт сильный крик бедствия, не привнося оттенка ликования.
