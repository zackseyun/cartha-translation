translation:
  language: ru
  text: 'Песнь. Псалом сыновей Кораха. Для руководителя хора: на «Махалат леаннот»[a]. Маскил[b] Емана Езрахита.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «Махалат леаннот» имеет неясное значение. Возможно, это название напева или указание на способ исполнения; среди предлагаемых переводов — «на мотив “Махалат”, для попеременного пения» и «на мотив “Махалат”, о страдании».
    reason: lexical_alternative
  - marker: b
    text: «Маскил» — специальный термин в надписаниях псалмов; его часто понимают как назидательное произведение или произведение для размышления.
    reason: lexical_alternative
