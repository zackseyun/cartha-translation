- source_word: עַל מָחֲלַת לְעַנּוֹת
  choice: На «Махалат ле-аннот»
  rationale: Неясное музыкальное или исполнительское указание передано транслитерацией; предлог «на» допускает понимание как названия напева или способа исполнения.
- source_word: מַשְׂכִּיל
  choice: Маскил
  rationale: Технический термин надписаний псалмов с не вполне определённым значением сохранён в транслитерации.
- source_word: לְהֵימָן
  choice: Емана
  rationale: Родительный падеж естественно передаёт принадлежность или связь, не уточняя, идёт ли речь об авторстве, посвящении либо иной ассоциации.
- source_word: הָאֶזְרָחִי
  choice: эзрахитянина
  rationale: Передаёт этноним или родовое обозначение в соответствии с еврейской формой, не отождествляя его безоговорочно с зерахитянином.
