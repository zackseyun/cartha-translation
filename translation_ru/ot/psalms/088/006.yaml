  text: You have put me in the lowest pit[a], in dark places, in the depths.
translation:
  language: ru
  text: Ты поместил меня в глубочайшую яму[a], во мрак, в бездны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в яму, в самых нижних местах».'
    reason: Сохраняет возможность понимать תַּחְתִּיּוֹת как обозначение «самых нижних мест», поставленное рядом с образом ямы, а не только как её характеристику.
lexical_decisions:
- source_word: שַׁתַּנִי
  choice: Ты поместил меня
  rationale: Форма с субъектом во 2-м лице единственного числа и объектом в 1-м лице передаёт прямое обращение к Богу. «Поместил» естественно выражает значение «положить, поставить, поместить» и не ослабляет приписываемое Богу действие.
- source_word: בְּבוֹר תַּחְתִּיּוֹת
  choice: в глубочайшую яму
  rationale: בּוֹר обозначает яму, водосборник или подобное подземное углубление; «яма» сохраняет образ, не превращая его однозначно в «могилу». תַּחְתִּיּוֹת указывает на самые нижние места; сочетание естественно передано превосходной степенью «глубочайшую».
- source_word: בְּמַחֲשַׁכִּים
  choice: во мрак
  rationale: Еврейское множественное число буквально изображает тёмные места или области тьмы. Русское собирательное «мрак» звучит поэтично и естественно, не устраняя образ полного отсутствия света.
- source_word: בִּמְצֹלוֹת
  choice: в бездны
  rationale: Слово обозначает глубины, в том числе водные. Множественное «бездны» сохраняет поэтическую множественность и усиливает параллельный образ крайней глубины без излишнего уточнения.
theological_decisions:
- issue: Действие Бога в плаче псалмопевца
  choice: 'Сохранено прямое обращение: «Ты поместил меня».'
  alternative: Безличная формулировка, смягчающая или скрывающая действие Бога.
  rationale: В еврейском тексте именно Бог прямо назван тем, кто поместил говорящего в это состояние. Перевод сохраняет напряжение плача и не пытается богословски его сгладить.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим ритмом. «Глубочайшую яму», «мрак» и «бездны» понятны современному читателю и сохраняют нарастающую образность еврейского параллелизма.
