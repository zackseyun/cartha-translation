  text: יְֽהוָ֗ה מְנָת חֶלְקִ֥/י וְ/כוֹסִ֑/י אַ֝תָּ֗ה תּוֹמִ֥יךְ גּוֹרָלִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/005.yaml
  text: Yahweh is the portion of my inheritance and my cup[a]; you uphold my lot.
translation:
  language: ru
  text: Яхве — доля моего удела и моя чаша[a]; Ты хранишь мой жребий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве — мой удел и моя чаша». В еврейском тексте рядом стоят несколько образов назначенной доли: «доля», «удел» и «жребий».'
    reason: Лексическая альтернатива и пояснение намеренного сочетания близких образов.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: מְנָת חֶלְקִי
  choice: доля моего удела
  rationale: Сохраняет конструктивную связь слов и намеренное нагнетание образов распределённой доли; «удел» также передаёт оттенок наследственного надела.
- source_word: וְכוֹסִי
  choice: и моя чаша
  rationale: Сохраняет буквальный поэтический образ чаши как выпавшей человеку доли, не истолковывая метафору в основном тексте.
- source_word: אַתָּה
  choice: Ты
  rationale: Явно передаёт эмфатическое личное местоимение и прямое обращение к Яхве.
- source_word: תּוֹמִיךְ
  choice: хранишь
  rationale: В данном контексте выражает удержание, обеспечение и сохранение доставшегося удела; звучит естественно и поэтично по-русски.
- source_word: גּוֹרָלִי
  choice: мой жребий
  rationale: Сохраняет конкретный образ жребия, посредством которого определяли удел, и не сводит его к отвлечённой «судьбе».
theological_decisions:
- issue: Яхве как принадлежащий псалмопевцу удел
  choice: «Яхве — доля моего удела»
  alternative: «Яхве — моя доля» или «Яхве — мой избранный удел»
  rationale: Формулировка сохраняет необычное сочетание близких образов в еврейском тексте и мысль о том, что сам Яхве составляет назначенное псалмопевцу достояние, не устраняя поэтическое напряжение.
- issue: Значение действия תּוֹמִיךְ по отношению к жребию
  choice: «Ты хранишь мой жребий»
  alternative: «Ты поддерживаешь мой жребий» или «Ты держишь мой жребий»
  rationale: «Хранишь» естественно передаёт обеспечение и сохранность назначенного удела, не превращая образ в однозначное утверждение о предопределённой судьбе.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим строем. Сохранены параллельные образы удела, чаши и жребия; местоимение «Ты» выделяет переход к прямому обращению.
