source:
  edition: WLC
  text: יִרְבּ֥וּ עַצְּבוֹתָ/ם֮ אַחֵ֪ר מָ֫הָ֥רוּ בַּל אַסִּ֣יךְ נִסְכֵּי/הֶ֣ם מִ/דָּ֑ם וּֽ/בַל אֶשָּׂ֥א אֶת שְׁ֝מוֹתָ֗/ם עַל שְׂפָתָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/004.yaml
  text: The sorrows of those who hurry after another god will multiply[a]; I will not pour out their drink offerings of blood[b], nor will I lift up their names on my lips.
translation:
  language: ru
  text: Умножатся скорби тех, кто спешит за другим богом[a]. Я не стану возливать их кровавые возлияния[b] и не произнесу их имён своими устами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умножатся их идолы». Еврейское слово может быть связано с идолами, хотя в этой строке значение «скорби» лучше соответствует контексту.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «их возлияния с кровью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְבּוּ
  choice: умножатся
  rationale: Форма Qal imperfect глагола רבה выражает увеличение; «умножатся» сохраняет поэтическое утверждение о последствии.
- source_word: עַצְּבוֹתָם
  choice: скорби тех
  rationale: Слово здесь естественнее понимать как «скорби, страдания» тех, кто следует за иным богом; возможная связь с обозначением идолов отмечена в сноске.
- source_word: אַחֵר
  choice: другим богом
  rationale: Буквально «другим»; подразумеваемое «богом» уточнено по контексту возлияний и имён, связанных с чужим культом.
- source_word: מָהָרוּ
  choice: кто спешит за
  rationale: Глагол מהר обычно означает «спешить»; выражение передаёт ревностное устремление вслед за другим богом.
- source_word: בַּל אַסִּיךְ
  choice: Я не стану возливать
  rationale: Поэтическое отрицание בַּל и Hiphil глагола נסך обозначают отказ совершать возлияние.
- source_word: נִסְכֵּיהֶם מִדָּם
  choice: их кровавые возлияния
  rationale: נֶסֶךְ — культовое возлияние; מִן может указывать на материал или средство. «Кровавые возлияния» естественно передаёт основной образ, а вариант «возлияния с кровью» сохранён в сноске.
- source_word: וּבַל אֶשָּׂא אֶת שְׁמוֹתָם עַל שְׂפָתָי
  choice: и не произнесу их имён своими устами
  rationale: Буквальное «не подниму их имён на моих губах» является идиомой речи; русский вариант ясно передаёт отказ называть их, не уточняя неоднозначный референт местоимения.
theological_decisions:
- issue: Подразумеваемое существительное после אַחֵר («другим»)
  choice: другим богом
  alternative: другим / за другим
  rationale: Контекст чужого культа позволяет эксплицировать подразумеваемого бога; это проясняет смысл без внесения конфессионального толкования.
- issue: Значение עַצְּבוֹתָם
  choice: скорби
  alternative: идолы
  rationale: В данной синтаксической связи наиболее связный смысл — умножение скорбей у последователей другого бога. Возможное идольское значение сохраняется в сноске.
- issue: Референт выражения «их имён»
  choice: сохранено местоименное выражение без уточнения
  alternative: имена других богов / имена их почитателей
  rationale: Еврейский текст допускает связь имён с иными богами либо с упомянутыми людьми; перевод не снимает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Возлияния» сохраняет культовый термин, а «произнесу… своими устами» естественно передаёт еврейскую идиому. Все сноски отмечены в основном тексте.
