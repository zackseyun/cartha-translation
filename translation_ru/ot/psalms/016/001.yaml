lexical_decisions:
- source_word: מִכְתָּם
  choice: Миктам
  rationale: Значение термина в надписании псалма достоверно не установлено. Транслитерация сохраняет еврейскую форму и не приписывает слову спорного значения.
- source_word: לְדָוִד
  choice: Давида
  rationale: Предлог לְ в надписаниях может указывать на авторство, принадлежность, связь или посвящение. Русская конструкция «Давида» достаточно естественна и не устраняет эту неоднозначность.
- source_word: שָׁמְרֵנִי
  choice: Храни меня
  rationale: Императив от שׁמר выражает просьбу о Божьем сохранении и защите. «Храни» естественно для русской молитвенной речи и не сужает смысл до защиты лишь от физической опасности.
- source_word: אֵל
  choice: Боже
  rationale: אֵל — обычное обозначение Бога; форма «Боже» естественно передаёт прямое обращение.
- source_word: כִּי
  choice: ведь
  rationale: כִּי вводит основание просьбы. «Ведь» ясно и естественно передаёт причинную связь в современном русском языке.
- source_word: חָסִיתִי
  choice: я укрылся
  rationale: 'Глагол חסה передаёт образ поиска и обретения убежища. Прошедшая форма отражает перфект и его результирующий смысл: псалмопевец прибегнул к Богу и находится под Его защитой.'
- source_word: בָךְ
  choice: в Тебе
  rationale: Предлог בְּ при חסה обозначает того, в ком находят убежище. «В Тебе» сохраняет исходную метафору и устойчиво звучит по-русски.
theological_decisions:
- issue: Значение надписания מִכְתָּם
  choice: Передать транслитерацией «миктам», не закрепляя предположительное значение.
  alternative: Перевести как «псалом», «золотая песнь» или «надпись».
  rationale: Точное значение מִכְתָּם неизвестно; однозначный перевод придал бы спорному толкованию неоправданную уверенность.
- issue: Отношение, выраженное לְדָוִד
  choice: «Давида»
  alternative: «написанный Давидом», «для Давида» или «посвящённый Давиду»
  rationale: Исходная конструкция допускает авторство, принадлежность, связь или посвящение. Краткое русское надписание сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с кратким молитвенным ритмом. Обращение к Богу передано традиционным уважительным написанием «Тебе», без добавления отсутствующих в исходном тексте конфессиональных уточнений.
