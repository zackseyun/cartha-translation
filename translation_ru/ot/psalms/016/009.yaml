- source_word: כְּבוֹדִי
  choice: моя слава
  rationale: Буквально сохраняет многозначный образ еврейского текста, не сводя его без необходимости к чести, языку или всему существу человека.
- source_word: אַף
  choice: даже
  rationale: Выражает усиление и переход от внутренней радости к телесной безопасности.
- source_word: בְּשָׂרִי
  choice: плоть моя
  rationale: Сохраняет конкретный образ физического естества и межтекстовую связь с цитированием стиха в Деяниях 2.
- source_word: יִשְׁכֹּן
  choice: будет пребывать
  rationale: Передаёт значение проживания или пребывания; формулировка уместна в возвышенной, но понятной поэтической речи.
- source_word: לָבֶטַח
  choice: в безопасности
  rationale: Ясно передаёт состояние защищённости, выраженное наречным оборотом в еврейском тексте.
theological_decisions:
- issue: Значение כְּבוֹדִי в стихе, позднее цитируемом в христологическом контексте
  choice: моя слава
  alternative: моя честь; всё моё существо; мой язык
  rationale: Буквальный вариант сохраняет прозрачность по отношению к еврейскому тексту, его подлинную неоднозначность и связь с греческим «моя слава» в Деяниях 2, не навязывая одно толкование идиомы.
- issue: Передача בְּשָׂרִי
  choice: плоть моя
  alternative: моё тело
  rationale: «Плоть» сохраняет исходный образ физического естества и межтекстовую связь, не приписывая слову отсутствующего здесь смысла греховной природы.
