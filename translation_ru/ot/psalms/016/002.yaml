lexical_decisions:
- source_word: אָמַרְתְּ
  choice: Я сказал
  rationale: В контексте говорит сам псалмопевец, обращаясь к Богу. Масоретская форма внешне совпадает со 2-м лицом женского рода единственного числа («ты сказала»), поэтому формальная неоднозначность отмечена в сноске.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата речи, а יהוה передано как личное заветное имя «Яхве».
- source_word: אֲדֹנָי אָתָּה
  choice: Ты — мой Господь
  rationale: Независимое местоимение אָתָּה подчёркивает обращение; именная конструкция естественно передаётся по-русски с тире. אֲדֹנָי в данном контексте выражает признание Бога своим Господом.
- source_word: טוֹבָתִי
  choice: блага у меня
  rationale: Существительное может обозначать благо, добро, благополучие или пользу. «Благо» сохраняет широкое значение и не сводит выражение к нравственной добродетели говорящего.
- source_word: בַּל עָלֶיךָ
  choice: нет … вне Тебя
  rationale: Поэтическое отрицание בַּל и многозначный предлог עַל образуют сжатое выражение. «Вне Тебя» естественно передаёт мысль, что благо говорящего не простирается за пределы Бога, не устраняя буквальную неоднозначность, отмеченную в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В стихе непосредственно употреблено личное имя יהוה; транслитерация отличает его от титула אֲדֹנָי в следующей фразе.
- issue: Смысл заключительной фразы
  choice: нет у меня блага вне Тебя
  alternative: моё благо не выше (не за пределами) Тебя
  rationale: Еврейская фраза предельно сжата и допускает более буквальное пространственное прочтение. Основной текст ясно выражает зависимость псалмопевца от Бога, а сноска сохраняет формальную и смысловую напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической сдержанностью. Личное имя «Яхве» и титул «мой Господь» намеренно различены. Местоимение «Тебя» написано с прописной буквы как традиционная форма почтительного обращения к Богу.
