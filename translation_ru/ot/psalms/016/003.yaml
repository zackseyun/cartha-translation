base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/003.yaml
  text: As for the holy ones who are in the land[c][b][a], they are the noble ones in whom is all my delight.
translation:
  language: ru
  text: А святые, которые на земле[a], — они благородные[b]; в них — вся моя отрада.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые в стране».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «величественные», «превосходные».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִקְדוֹשִׁים
  choice: А святые
  rationale: Предлог ל здесь, вероятно, вводит тему высказывания; русское «А святые» естественно передаёт этот дискурсивный переход. «Святые» сохраняет субстантивированное значение прилагательного קְדוֹשִׁים.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: которые в земле
  rationale: אֶרֶץ допускает значения «земля» и «страна». Формулировка «в земле» сохраняет пространственную и смысловую неоднозначность, не сужая её до конкретной страны и не делая небесно-земной контраст чрезмерно явным.
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение сохранено ради присущего еврейскому тексту выделения подлежащего.
- source_word: וְאַדִּירֵי
  choice: благородные
  rationale: אַדִּיר обозначает величие, знатность или превосходство. В контексте речь, вероятнее, о почётном достоинстве, а не о военной силе.
- source_word: כָּל חֶפְצִי
  choice: всё моё восхищение
  rationale: חֵפֶץ может означать желание, удовольствие или отраду. «Всё моё восхищение» естественно выражает глубокую положительную оценку и сочетается с конструкцией בָם.
- source_word: בָם
  choice: в них
  rationale: Буквально сохранена предложная конструкция с ב; личный референт в русском языке ясно определяется словом «святые».
theological_decisions:
- issue: Кого обозначают «святые»
  choice: Вероятнее всего, посвящённые Богу люди, находящиеся на земле
  alternative: Небесные святые существа или посвящённые лица вообще
  rationale: Оборот אֲשֶׁר בָּאָרֶץ естественнее указывает на земных людей, однако перевод не добавляет определения «верующие» или «народ Божий» и тем самым не устраняет полностью возможную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с поэтической сдержанностью. Тире отражает выделение самостоятельного местоимения הֵמָּה. Все сноски отмечены в основном тексте.
