lexical_decisions:
- source_word: אֲבָרֵךְ
  choice: Благословлю
  rationale: Порода piel глагола ברך по отношению к Богу означает «благословлять», то есть с благодарностью прославлять Его. Форма имперфекта здесь естественно передаёт решимость говорящего.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
- source_word: יְעָצָנִי
  choice: даёт мне совет
  rationale: Глагол יעץ означает «советовать, давать совет». Настоящее время выражает постоянное или характерное действие.
- source_word: אַף לֵילוֹת
  choice: даже по ночам
  rationale: 'אַף имеет усилительно-присоединительное значение «даже», а множественное לֵילוֹת естественно передаётся по-русски как повторяющееся время: «по ночам».'
- source_word: יִסְּרוּנִי
  choice: наставляет меня
  rationale: Глагол יסר охватывает наставление, вразумление и исправление. «Наставляет» сохраняет формирующий оттенок, не усиливая его без необходимости до «наказывает».
- source_word: כִלְיוֹתָי
  choice: моё нутро
  rationale: Буквально «мои почки» — в древнееврейской антропологии образ глубочайшего внутреннего мира, совести и чувств. «Нутро» сохраняет телесную метафору и звучит естественнее, чем буквальные «почки».
theological_decisions:
- issue: Антропологическая метафора כִלְיוֹתָי
  choice: моё нутро
  alternative: мои почки; моё внутреннее существо; моё сердце
  rationale: «Нутро» сохраняет образ внутренней глубины человека и не подменяет его иной древнееврейской категорией — «сердцем» или «разумом». Сноска сообщает буквальную форму.
- issue: Источник ночного наставления
  choice: Сохранено грамматическое подлежащее «моё нутро»
  alternative: Яхве наставляет меня по ночам
  rationale: Вторая строка буквально называет внутренности говорящего подлежащим глагола. Перевод не сводит это напрямую к действию Яхве и тем самым сохраняет поэтическое напряжение между Божьим советом и внутренним вразумлением.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. «Благословлю» сохраняет библейскую возвышенность, а «моё нутро» — телесность исходной метафоры без вводящего в заблуждение буквального выражения «мои почки».
