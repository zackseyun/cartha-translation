source:
  edition: WLC
  text: תּֽוֹדִיעֵ/נִי֮ אֹ֤רַח חַ֫יִּ֥ים שֹׂ֣בַע שְׂ֭מָחוֹת אֶת פָּנֶ֑י/ךָ נְעִמ֖וֹת בִּ/ימִינְ/ךָ֣ נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/016/011.yaml
  text: You make known to me the path of life[a]; in your presence is fullness of joy[b]; at your right hand are pleasures forever.
translation:
  language: ru
  text: Ты открываешь мне путь жизни; пред Твоим лицом — полнота радости; в Твоей правой руке — наслаждения навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹדִיעֵנִי
  choice: Ты открываешь мне
  rationale: Hiphil от ידע с суффиксом 1-го лица означает «даёшь мне знать, открываешь мне». Настоящее время естественно передаёт поэтическую уверенность несовершенного вида; возможный будущий оттенок не исключается контекстом.
- source_word: אֹרַח חַיִּים
  choice: путь жизни
  rationale: אֹרַח обозначает путь или стезю, а חַיִּים — обычное абстрактное обозначение жизни, несмотря на форму множественного числа.
- source_word: שֹׂבַע שְׂמָחוֹת
  choice: полнота радости
  rationale: שֹׂבַע выражает полноту, изобилие или насыщение. Русское собирательное единственное «радости» естественно передаёт смысл еврейского множественного שְׂמָחוֹת, не устраняя оттенка изобилия.
- source_word: אֶת־פָּנֶיךָ
  choice: пред Твоим лицом
  rationale: Сохраняет образ еврейского выражения и одновременно остаётся понятным русским обозначением непосредственного Божьего присутствия.
- source_word: נְעִמוֹת
  choice: наслаждения
  rationale: Субстантивированное множественное от נעם обозначает приятное, услады или наслаждения; выбранное слово сохраняет множественное число и положительный смысл.
- source_word: בִּימִינְךָ
  choice: по правую руку от Тебя
  rationale: Естественное русское пространственное выражение для «у Твоей правой руки», сохраняющее образ близости и благоволения.
- source_word: נֶצַח
  choice: навеки
  rationale: В данном контексте обозначает непрекращающуюся длительность; «навеки» кратко и поэтично передаёт этот смысл.
theological_decisions:
- issue: Передача אֶת־פָּנֶיךָ в тексте, связанном с Божьим присутствием
  choice: пред Твоим лицом
  alternative: в Твоём присутствии
  rationale: Буквально-образная передача сохраняет исходную метафору лица, при этом в русском библейско-поэтическом контексте ясно означает непосредственное присутствие Бога и не добавляет конфессионального толкования.
- issue: Временной оттенок תּוֹדִיעֵנִי
  choice: Ты открываешь мне
  alternative: Ты откроешь мне
  rationale: Еврейский имперфект допускает будущий оттенок, но здесь может выражать уверенное, актуальное знание. Настоящее время хорошо соответствует поэтическому исповеданию, не превращая строку в однозначное предсказание.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой поэзии. Синтаксический параллелизм двух именных предложений сохранён; архаизирующая форма «пред» употреблена умеренно ради краткости и образа лица, тогда как остальная лексика остаётся современной и понятной.
