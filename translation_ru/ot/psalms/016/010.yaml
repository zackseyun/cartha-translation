  - marker: b
    text: 'Или: «тление». В Септуагинте и в новозаветном цитировании этого стиха данный образ передан словом, подчёркивающим тление или разложение.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание уверенности, выраженной в предыдущем стихе; «ибо» естественно для возвышенной поэтической речи и сохраняет логическую связь.
- source_word: לֹא תַעֲזֹב
  choice: не оставишь
  rationale: Глагол עזב означает «оставлять, покидать». Выбор передаёт уверенность псалмопевца в том, что Бог не оставит его во власти смерти.
- source_word: נַפְשִׁי
  choice: мою душу
  rationale: נפש может обозначать душу, жизнь или самого человека. «Мою душу» сохраняет образность и форму еврейского текста, не исключая смысла «меня, мою жизнь».
- source_word: לִשְׁאוֹל
  choice: в шеоле
  rationale: שׁאול обозначает мир мёртвых, а не только отдельную могилу. Транслитерация сохраняет особое понятие исходного текста; форма «в шеоле» естественно передаёт направленность как оставление во власти шеола.
- source_word: לֹא תִתֵּן
  choice: не дашь
  rationale: При инфинитиве נתן имеет значение «дать, позволить». Русское «не дашь … увидеть» одновременно естественно и близко к форме оригинала.
- source_word: חֲסִידְךָ
  choice: твоему верному
  rationale: חסיד описывает человека, отличающегося верностью, преданностью и благочестием. «Верный» сохраняет прежде всего relationalный смысл, не превращая слово в позднейший технический титул; традиционный вариант отмечен в сноске.
- source_word: לִרְאוֹת
  choice: увидеть
  rationale: Сохранена еврейская идиома с глаголом «видеть»; по смыслу она может подразумевать испытать на себе или подвергнуться чему-либо.
- source_word: שָׁחַת
  choice: яму
  rationale: В параллели с шеолом слово естественно обозначает могильную яму или место погибели. Вариант «тление», важный для древнегреческой и новозаветной традиции, вынесен в сноску.
theological_decisions:
- issue: Мессианское применение стиха в Новом Завете
  choice: 'Основной текст переведён прежде всего по непосредственному смыслу еврейского текста: «твоему верному» и «яму».'
  alternative: «Твоему святому» и «тление», что яснее перекликается с Септуагинтой и цитированием стиха в Новом Завете.
  rationale: Перевод не должен заранее сужать многозначность еврейских слов ради позднейшего применения стиха. Вместе с тем богословски значимые традиционные варианты сохранены в сносках.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены традиционные библейские слова «душа» и «шеол», но синтаксис остаётся ясным для современного читателя. Местоимения, относящиеся к Богу, написаны со строчной буквы согласно нейтральной современной издательской практике.
