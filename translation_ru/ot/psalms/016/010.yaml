  text: For you will not abandon my soul to Sheol[b][a], nor will you let your faithful one see the pit.
translation:
  language: ru
  text: Ибо ты не оставишь мою душу в шеоле и не дашь верному тебе[a] увидеть яму[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоему святому». Еврейское слово может обозначать верного, преданного, благочестивого или святого человека.'
