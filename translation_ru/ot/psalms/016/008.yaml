  yaml_path: translation/ot/psalms/016/008.yaml
  text: I have set Yahweh before me continually[a]; because he is at my right hand[b], I will not be shaken.
translation:
  language: ru
  text: Я всегда ставлю перед собой Яхве[a], ибо Он по правую руку от меня — я не поколеблюсь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH), тетраграмматон; имя также традиционно передают как «Иегова», а во многих переводах заменяют словом «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «я не пошатнусь»; еврейский глагол обозначает колебание или смещение с устойчивого положения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁוִּיתִי
  choice: вижу перед собой
  rationale: Пиэль от שׁוה здесь буквально выражает намеренное «помещение» Яхве перед собой, то есть сознательное удержание Его перед внутренним взором. В современном русском «всегда вижу перед собой» естественно передаёт устойчивую установку совершенного вида в сочетании с תָמִיד, не сводя образ лишь к физическому действию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: לְנֶגְדִּי תָמִיד
  choice: всегда ... перед собой
  rationale: לְנֶגְדִּי означает «передо мной, в моём поле зрения», а תָמִיד — постоянство. Такой порядок слов звучит естественно и сохраняет оба элемента.
- source_word: כִּי
  choice: —
  rationale: Причинно-пояснительная связь передана бессоюзным присоединением через тире; это естественно для русской поэтической речи и не устраняет смысл «ибо/потому что».
- source_word: מִימִינִי
  choice: по правую руку от меня
  rationale: Сохраняет пространственный образ близкого присутствия, защиты и поддержки.
- source_word: בַּל אֶמּוֹט
  choice: я не поколеблюсь
  rationale: מוט обозначает утрату устойчивости, колебание или смещение с прочного положения. «Не поколеблюсь» сохраняет метафору и естественно звучит в современном литературном русском.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет это различие, не подменяя имя титулом.
- issue: Характер присутствия Бога по правую руку
  choice: сохранён пространственный образ без поясняющей вставки
  alternative: Он защищает/поддерживает меня
  rationale: Образ допускает оттенки присутствия, защиты и поддержки; перевод не должен сводить его к единственному толкованию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Формулировка сохраняет параллелизм, образ правой руки и метафору устойчивости; местоимение «Он» написано с прописной буквы согласно распространённой русской библейской норме.
