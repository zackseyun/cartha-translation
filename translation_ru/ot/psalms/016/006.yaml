lexical_decisions:
- source_word: חֲבָלִים
  choice: межевые линии
  rationale: В контексте раздела земли слово обозначает мерные верёвки либо проведённые с их помощью границы удела. «Межевые линии» ясно сохраняет конкретный образ размеченного наследственного участка.
- source_word: נָפְלוּ
  choice: выпали
  rationale: Сохранено буквальное значение глагола и одновременно естественная для русского языка связь с уделом, выпавшим человеку по жребию.
- source_word: לִי
  choice: мне
  rationale: Передаёт дательный отношения и выгоды без добавочного истолкования.
- source_word: בַּנְּעִמִים
  choice: в прекрасных местах
  rationale: Прилагательное נעים выражает приятность, привлекательность и красоту; множественная форма с предлогом в земельном образе естественно понимается как указание на места.
- source_word: אַף
  choice: поистине
  rationale: Передаёт усилительное и подтверждающее значение частицы, а не только простое присоединение мысли.
- source_word: נַחֲלָת
  choice: наследие моё
  rationale: Сохраняет лексику наследственного удела и её богословскую связь с предыдущим стихом, не сводя образ к общему понятию благословений.
- source_word: שָׁפְרָה
  choice: прекрасно
  rationale: Глагольная форма выражает оценку наследия как красивого, хорошего или приятного; русское краткое прилагательное естественно передаёт здесь состояние.
- source_word: עָלַי
  choice: для меня
  rationale: Передаёт личное отношение говорящего к своему наследию, сохраняя возможный оттенок субъективной оценки.
theological_decisions:
- issue: Образ размеченного земельного удела как обозначение данной Богом доли псалмопевца
  choice: Сохранить конкретные образы межевых линий и наследия.
  alternative: Передать общий смысл как приятные благословения или хорошую долю.
  rationale: Лексика стиха отсылает к разделу земли и в контексте стиха 5 соотносится с Господом как долей псалмопевца. Конкретный образ сохраняет эту связь, не навязывая ему единственного отвлечённого толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис остаётся ясным, а конкретный образ земельного удела сохранён без конфессионального уточнения.
