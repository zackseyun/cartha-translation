  yaml_path: translation/ot/psalms/016/000.yaml
  text: A miktam of David. Preserve me[a], God, for I take refuge in you.
translation:
  language: ru
  text: Миктам Давида.[a] Храни меня, Боже, ведь у Тебя я ищу прибежища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «миктам» — термин в заголовке псалма с неизвестным точным значением; возможно, он обозначает особый вид произведения. Иногда переводится как «псалом» или «золотая песнь».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְתָּם
  choice: миктам
  rationale: Значение термина в заголовке псалма неизвестно; транслитерация сохраняет эту неопределённость и не навязывает гипотетического толкования.
- source_word: שָׁמְרֵנִי
  choice: Храни меня
  rationale: Императив корня שמר выражает просьбу о сохранении и защите; «храни» естественно и достаточно близко к форме оригинала.
- source_word: חָסִיתִי בָךְ
  choice: у Тебя я ищу прибежища
  rationale: Идиома с корнем חסה обозначает обращение к кому-либо за убежищем и защитой; настоящее время естественно передаёт состояние, выраженное еврейским перфектом.
theological_decisions:
- issue: Характер упования в выражении חָסִיתִי בָךְ
  choice: у Тебя я ищу прибежища
  alternative: на Тебя я уповаю
  rationale: Выбран образ прибежища, непосредственно заложенный в еврейском глаголе, без сведения его смысла только к внутреннему доверию.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической сдержанностью. Местоимение «Тебя» написано с прописной буквы как традиционное уважительное обращение к Богу; дополнительного богословского смысла это не вносит.
