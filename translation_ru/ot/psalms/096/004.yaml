  text: כִּ֥י גָ֘ד֤וֹל יְהוָ֣ה וּ/מְהֻלָּ֣ל מְאֹ֑ד נוֹרָ֥א ה֝֗וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/004.yaml
  text: For Yahweh is great and greatly to be praised[c][b][a]; he is to be feared above all gods.
translation:
  language: ru
  text: Ибо велик Яхве и достоин великой хвалы; Он внушает трепет более всех богов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Боги» могут означать божеств народов; в следующем стихе они названы ничтожными идолами.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для окружающего призыва к поклонению; «ибо» естественно передаёт пояснительно-причинную связь в возвышенной поэтической речи.
- source_word: גָדוֹל
  choice: велик
  rationale: Прилагательное выражает величие и высоту положения; «велик» точно и естественно для контекста хвалы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: וּמְהֻלָּל מְאֹד
  choice: и достоин великой хвалы
  rationale: Еврейское пассивное причастие буквально означает «весьма прославляемый»; выбранная идиоматическая формулировка передаёт сильную степень и смысл подобающей Ему хвалы.
- source_word: נוֹרָא
  choice: внушает трепет
  rationale: Форма обозначает того, кто вызывает благоговейный страх; «внушает трепет» сохраняет эту силу без оттенка простого ужаса.
- source_word: עַל כָּל אֱלֹהִים
  choice: более всех богов
  rationale: Предлог выражает превосходство. Слово «боги» сохранено без истолковывающей замены на «идолы» или «божественные существа».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон; транслитерация сохраняет личное имя, не заменяя его титулом.
- issue: Значение אֱלֹהִים в данном контексте
  choice: боги
  alternative: идолы; божественные существа
  rationale: Перевод сохраняет прямое лексическое значение и полемическую напряжённость стиха; следующий стих уточняет ничтожность богов народов.
- issue: Смысл נוֹרָא
  choice: внушает трепет
  alternative: страшен; Его следует бояться
  rationale: Формулировка передаёт вызываемый Им благоговейный страх и не сводит выражение ни к ужасу, ни к ослабленному современному значению «потрясающий».
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмическим звучанием. Синтаксис сохраняет параллелизм и краткость еврейского стиха.
