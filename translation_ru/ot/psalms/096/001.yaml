  text: שִׁ֣ירוּ לַ֭/יהוָה שִׁ֣יר חָדָ֑שׁ שִׁ֥ירוּ לַ֝/יהוָ֗ה כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/001.yaml
  text: Sing to Yahweh a new song; sing to Yahweh[a], all the earth.
translation:
  language: ru
  text: Пойте Яхве новую песню; пойте Яхве[a], вся земля!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה (YHWH) — божественное имя, традиционно передаваемое как «ГОСПОДЬ»; другой вариант передачи — «Иегова».
    reason: Пояснение передачи божественного имени и указание традиционных вариантов.
lexical_decisions:
- source_word: שִׁירוּ
  choice: Пойте
  rationale: Форма повелительного наклонения множественного числа от שׁיר — прямой призыв петь; дополнение «хвалу» в еврейском тексте отсутствует.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает, кому обращено пение; личное имя יהוה передано принятой русской транслитерацией «Яхве».
- source_word: שִׁיר חָדָשׁ
  choice: новую песню
  rationale: Естественная русская передача сочетания существительного שִׁיר «песня» и прилагательного חָדָשׁ «новый» с согласованием в винительном падеже.
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: В контексте всеобщего призыва הָאָרֶץ обозначает землю в широком смысле; обращение «вся земля» сохраняет поэтическую персонификацию оригинала.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ; Иегова
  rationale: Текст прямо употребляет тетраграмматон — личное имя Бога. «Яхве» сохраняет его как имя, а сноска сообщает традиционный вариант, не подменяя его в основном тексте титулом.
- issue: К кому обращено «вся земля»
  choice: Поэтическое обращение ко всей земле
  alternative: Призыв ко всем жителям земли
  rationale: Еврейский текст буквально обращается к «всей земле» и не называет жителей отдельно; перевод сохраняет эту образность и не конкретизирует подразумеваемый субъект.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Повтор повеления и обращение «вся земля» сохранены; точка с запятой передаёт параллелизм двух строк.
