  yaml_path: translation/ot/psalms/096/009.yaml
  text: Worship Yahweh in the splendor of holiness; tremble before him[a], all the earth.
translation:
  language: ru
  text: Поклонитесь Яхве в великолепии святости[a]; трепещите перед Ним, вся земля!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в священном убранстве» или «в святом великолепии». Еврейское выражение может обозначать как великолепие, присущее святости, так и священное убранство участников поклонения.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁתַּחֲווּ
  choice: Поклонитесь
  rationale: Глагол обозначает почтительное преклонение перед Богом и поклонение Ему. «Поклонитесь» естественно передаёт и повеление, и религиозный смысл, не исключая телесного жеста.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», чтобы сохранить данное в еврейском тексте имя Бога, а не заменять его титулом.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: в великолепии святости
  rationale: 'Так сохраняются поэтический образ и широкое значение сочетания: великолепие, свойственное святости. Возможное указание на священное убранство не исключается и отмечено в сноске.'
- source_word: חִילוּ
  choice: трепещи
  rationale: Глагол выражает дрожь и сильное волнение перед Божьим присутствием. «Трепещи» передаёт благоговейный страх без добавления образа телесных мук; единственное число согласовано в русском с обращением «вся земля».
- source_word: מִפָּנָיו
  choice: перед Ним
  rationale: Буквально выражение связано с лицом или присутствием Бога; «перед Ним» естественно передаёт пребывание перед Его лицом.
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: В контексте всеобщего призыва псалма речь идёт обо всей земле, а не об отдельной стране.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет Тетраграмматон. Транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: Значение בְּהַדְרַת קֹדֶשׁ
  choice: в великолепии святости
  alternative: в священном убранстве; в святом великолепии
  rationale: Еврейское сочетание допускает как абстрактный образ великолепия святости, так и понимание священного убранства участников поклонения. Основной текст сохраняет более широкое поэтическое прочтение, а иные варианты вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Сохранено обращение к земле как к единому целому; поэтому множественное еврейское повеление חִילוּ передано русским единственным числом «трепещи», согласованным с «вся земля».
