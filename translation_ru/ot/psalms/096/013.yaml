  text: לִ/פְנֵ֤י יְהוָ֨ה כִּ֬י בָ֗א כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בֶּ/אֱמוּנָתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/013.yaml
  text: before Yahweh[a], for he is coming, for he is coming to judge the earth. He will judge the world with righteousness[c][b], and the peoples with his faithfulness.
translation:
  language: ru
  text: перед Яхве, ибо Он идёт, ибо идёт судить землю. Он будет судить мир в праведности, а народы — по Своей верности.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по Своей истине».'
    reason: Слово אֱמוּנָה может в этом контексте обозначать как верность и надёжность, так и истину.
lexical_decisions:
- source_word: לִפְנֵי
  choice: перед
  rationale: Сочетание с פָּנִים идиоматически означает «перед, в присутствии». «Перед» естественно по-русски и сохраняет пространственно-личностный оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь»; форма «Яхве» общепринята в современной научной транслитерации.
- source_word: כִּי בָא ... כִּי בָא
  choice: ибо Он идёт, ибо идёт
  rationale: В данном поэтическом контексте форма בָא живо изображает близкое и несомненное пришествие. Повтор сохранён как средство усиления.
- source_word: לִשְׁפֹּט
  choice: судить
  rationale: Хотя שׁפט может включать правление, параллельные определения правды и верности подчёркивают здесь судебно-нравственный смысл.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В параллели с תֵּבֵל речь идёт обо всей земле, а не об отдельной стране.
- source_word: תֵּבֵל
  choice: мир
  rationale: Слово обозначает обитаемый, устроенный мир; краткое «мир» естественно в русском поэтическом параллелизме.
- source_word: בְּצֶדֶק
  choice: по правде
  rationale: Русское «по правде» передаёт праведную и справедливую норму суда, сохраняя связь с צֶדֶק без тяжеловесной абстракции.
- source_word: וְעַמִּים
  choice: а народы
  rationale: Множественное עַמִּים означает различные народы; союз «а» естественно выражает параллельное сопоставление двух строк.
- source_word: בֶּאֱמוּנָתוֹ
  choice: по Своей верности
  rationale: אֱמוּנָה обозначает надёжность, постоянство и верность. Такая передача показывает, что Божий суд согласуется с Его неизменным характером, не сводя слово только к отвлечённой «истине».
theological_decisions:
- issue: Характер Божьего суда
  choice: Сохранено прямое «судить» без смягчения до «править» и без поясняющего расширения о последнем суде.
  alternative: Передать שׁפט как «править» либо прямо истолковать стих как описание окончательного эсхатологического суда.
  rationale: Текст возвещает всеобщий Божий суд, но не развивает здесь его сроки и подробности; перевод сохраняет данную формулировку и её богословское напряжение.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя передано как имя, а не заменено титулом. Это непосредственно отражает еврейский текст и не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Повтор «ибо Он идёт, ибо идёт» намеренно сохранён; начальная строчная буква отражает синтаксическое продолжение предыдущего стиха.
