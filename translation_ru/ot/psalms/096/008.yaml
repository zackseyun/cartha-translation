  text: Воздайте Яхве славу, подобающую его имени; принесите приношение[a] и придите в его дворы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дар» или «дань». Еврейское слово в зависимости от контекста может обозначать дар, дань или приношение.'
