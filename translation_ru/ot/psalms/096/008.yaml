lexical_decisions:
- source_word: הָבוּ
  choice: воздайте
  rationale: В сочетании со «славой» повелительная форма означает признать и воздать честь, а не дать Богу то, чего у Него нет. «Воздайте» естественно передаёт этот поэтический призыв.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя יהוה, а не замещающий его титул.
- source_word: כְּבוֹד שְׁמוֹ
  choice: славу Его имени
  rationale: Формулировка близко сохраняет еврейскую конструкцию «слава Его имени», не добавляя отсутствующего в тексте слова «подобающую».
- source_word: שְׂאוּ
  choice: принесите
  rationale: Хотя глагол буквально может означать «поднимите» или «несите», с מִנְחָה он естественно означает принесение дара или приношения.
- source_word: מִנְחָה
  choice: приношение
  rationale: Слово может обозначать дар, дань или культовое приношение. В контексте поклонения «приношение» наиболее широко и точно, без неоправданного уточнения вида жертвы.
- source_word: וּבֹאוּ לְחַצְרוֹתָיו
  choice: и войдите в Его дворы
  rationale: Предлог указывает движение к храмовым дворам; по-русски «войдите в» естественно выражает подразумеваемое вступление в священное пространство.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; форма «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Смысл выражения כְּבוֹד שְׁמוֹ
  choice: славу Его имени
  alternative: славу, подобающую Его имени
  rationale: Исходная конструкция допускает понимание славы, связанной с именем Бога, но слово «подобающую» прямо не выражено. Более буквальная формулировка сохраняет смысловую напряжённость и не вносит толкование в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Параллельные повелительные формы сохранены; архаизмы и конфессионально маркированная терминология не использованы.
