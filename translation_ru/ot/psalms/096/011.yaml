source:
  edition: WLC
  text: יִשְׂמְח֣וּ הַ֭/שָּׁמַיִם וְ/תָגֵ֣ל הָ/אָ֑רֶץ יִֽרְעַ֥ם הַ֝/יָּ֗ם וּ/מְלֹאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/011.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; let the sea thunder, and all that fills it.
translation:
  language: ru
  text: Пусть радуются небеса, и пусть ликует земля; пусть гремит[a] море и всё, что его наполняет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть шумит море и всё, что в нём».'
    reason: 'Лексическая альтернатива: רעם может обозначать как громыхание, так и мощный шум или рёв; מְלֹאוֹ буквально означает «его полнота» и идиоматически — «всё, что в нём».'
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: пусть радуются
  rationale: Имперфект Qal 3-го лица множественного числа в поэтической последовательности имеет волитивный, призывный оттенок; конструкция с «пусть» естественно передаёт его по-русски.
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: Форма множественного числа обозначает небеса или небесный свод; «небеса» сохраняет возвышенный поэтический регистр и вселенский масштаб.
- source_word: וְתָגֵל
  choice: и пусть ликует
  rationale: Глагол גיל выражает радость и ликование. «Ликует» сохраняет смысловую параллель с שׂמח, не стирая различия между двумя поэтическими глаголами.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В ряду «небеса — земля — море» речь идёт о мироздании, поэтому «земля» предпочтительнее значения «страна» или «земля как территория».
- source_word: יִרְעַם
  choice: пусть гремит
  rationale: Глагол רעם означает громыхать, греметь, издавать мощный шум. «Гремит» передаёт и звучание моря, и возможный оттенок грома, оставаясь естественным в русском поэтическом контексте.
- source_word: הַיָּם
  choice: море
  rationale: Обычное и контекстуально точное соответствие ים в космической триаде псалма.
- source_word: וּמְלֹאוֹ
  choice: и всё, что его наполняет
  rationale: Буквально «и его полнота»; еврейская идиома обозначает всё находящееся в море. Выбранная формулировка сохраняет образ наполненности и понятна современному читателю.
theological_decisions:
- issue: Волитивное или предсказательное значение поэтических имперфектов
  choice: 'Передать последовательность как призыв: «Пусть радуются… пусть ликует… пусть гремит».'
  alternative: 'Предсказательное будущее: «Возрадуются небеса… возликует земля… загремит море».'
  rationale: Контекст псалма призывает всё творение к хвале, а параллельные имперфекты естественно допускают юссивно-волитивное прочтение. Перевод с «пусть» передаёт дискурсивную функцию, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Повтор «пусть» делает призывную структуру ясной; «радуются / ликует / гремит» сохраняет лексическое разнообразие и олицетворение творения. Маркер сноски поставлен у слова «гремит», к которому относится основная лексическая альтернатива.
