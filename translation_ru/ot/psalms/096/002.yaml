id: PSA.96.2
reference: Psalms 96:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁ֣ירוּ לַ֭/יהוָה בָּרֲכ֣וּ שְׁמ֑/וֹ בַּשְּׂר֥וּ מִ/יּֽוֹם לְ֝/י֗וֹם יְשׁוּעָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/002.yaml
  text: Sing to Yahweh[a]; bless his name; proclaim his salvation from day to day.
translation:
  language: ru
  text: Пойте Яхве, благословляйте его имя; изо дня в день возвещайте[a] его спасение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благовествуйте о его спасении».'
    reason: 'Лексическая альтернатива: בשר часто означает возвещение благой вести, а не просто нейтральное объявление.'
lexical_decisions:
- source_word: שִׁירוּ
  choice: Пойте
  rationale: Форма повелительного наклонения множественного числа прямо призывает петь; дополнение вроде «хвалу» в еврейском тексте отсутствует.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает того, кому поют, а тетраграмматон передан как личное имя Яхве.
- source_word: בָּרֲכוּ
  choice: благословляйте
  rationale: Передаёт особый библейский призыв благословлять Бога и сохраняет отличие от предшествующего «пойте».
- source_word: שְׁמוֹ
  choice: его имя
  rationale: Буквально передаёт существительное «имя» с местоименным суффиксом; здесь имя также связано с явленной личностью и славой Бога.
- source_word: בַּשְּׂרוּ
  choice: возвещайте
  rationale: Глагол означает провозглашать, нередко именно благую весть. Краткое «возвещайте» естественно сочетается с прямым дополнением, а оттенок благой вести отмечен в сноске.
- source_word: מִיּוֹם לְיוֹם
  choice: изо дня в день
  rationale: Сохраняет образную структуру еврейского выражения и естественно обозначает непрерывное ежедневное действие.
- source_word: יְשׁוּעָתוֹ
  choice: его спасение
  rationale: «Спасение» передаёт широкий смысл избавления, даруемого Богом, не сужая его до отдельной победы или конкретного избавления.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное заветное имя Бога; передача «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Значение יְשׁוּעָה
  choice: спасение
  alternative: избавление
  rationale: «Спасение» сохраняет широкий смысл слова и его богословскую ёмкость; «избавление» возможно, но может звучать уже.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом. Сохранены три параллельных повеления и библейское выражение «благословляйте его имя»; местоимения, относящиеся к Богу, даны со строчной буквы по общим нормам современного русского текста.
