  text: הָב֣וּ לַ֭/יהוָה מִשְׁפְּח֣וֹת עַמִּ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/007.yaml
  text: Ascribe to Yahweh[a], families of the peoples[c][b], ascribe to Yahweh glory and strength.
translation:
  language: ru
  text: Воздайте Яхве, племена народов, воздайте Яхве славу и силу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ
  choice: воздайте
  rationale: Императив буквально означает «дайте», но в призыве к поклонению выражает признание и воздание Богу того, что Ему принадлежит. «Воздайте» естественно передаёт этот смысл и сохраняет повтор исходного текста.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата, а личное имя יהוה передано как «Яхве», без замены титулом.
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: племена народов
  rationale: מִשְׁפָּחוֹת может обозначать семьи, роды или племенные группы, а עַמִּים — народы. Сочетание «племена народов» сохраняет коллективный этнический смысл и звучит естественнее буквального «семьи народов».
- source_word: כָּבוֹד
  choice: славу
  rationale: В контексте поклонения כָּבוֹד обозначает славу или честь, принадлежащую Богу; «слава» соответствует возвышенному поэтическому регистру.
- source_word: וָעֹז
  choice: и силу
  rationale: עֹז означает силу, мощь или могущество. «Силу» прямо и ясно передаёт значение и образует естественную пару со «славой».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя יהוה. Передача «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с возвышенным псалмическим звучанием. Сохранены параллелизм и повтор повеления; двусмысленность מִשְׁפָּחוֹת между семьями, родами и племенами отражена выбором широкого по смыслу слова «племена».
