  text: סַפְּר֣וּ בַ/גּוֹיִ֣ם כְּבוֹד֑/וֹ בְּ/כָל הָֽ֝/עַמִּ֗ים נִפְלְאוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/003.yaml
  text: Declare his glory among the nations[a], his wondrous deeds among all the peoples.
translation:
  language: ru
  text: 'Возвещайте среди народов его славу,

    среди всех народов — его чудесные дела[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его чудеса»; «его дивные дела».'
    reason: Лексема נִפְלְאוֹתָיו может обозначать как сами чудеса, так и чудесные, вызывающие изумление деяния.
lexical_decisions:
- source_word: סַפְּרוּ
  choice: Возвещайте
  rationale: Форма повелительного наклонения множественного числа в пиэле призывает публично рассказывать и провозглашать; «возвещайте» передаёт торжественный призыв и остаётся понятным в современном русском языке.
- source_word: בַגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם здесь обозначает народы в широком международном смысле; «среди» естественно передаёт провозглашение в их среде, не привнося более позднего религиозно-этнического оттенка слова «язычники».
- source_word: כְּבוֹדוֹ
  choice: его славу
  rationale: כָּבוֹד в контексте хвалы выражает славу, величие и честь; «слава» — естественный и содержательно ёмкий русский эквивалент.
- source_word: בְּכָל הָעַמִּים
  choice: среди всех племён
  rationale: «Племён» отличает עַמִּים от גּוֹיִם в первой строке и сохраняет поэтический параллелизм; выражение охватывает все человеческие сообщества, а не только родоплеменные группы.
- source_word: נִפְלְאוֹתָיו
  choice: его чудесные дела
  rationale: Существительное от корня פלא обозначает необычайные деяния, вызывающие изумление; «чудесные дела» передаёт как чудесный характер, так и деятельный смысл выражения.
theological_decisions:
- issue: Всеобщий охват провозглашения
  choice: Повеление относится ко всем народам и племенам без ограничения ближайшими соседями Израиля.
  alternative: Понимать слова преимущественно как обращённые к ближайшим окружающим народам.
  rationale: Параллельные выражения בַגּוֹיִם и בְּכָל הָעַמִּים, особенно определение «всех», подчёркивают универсальный охват, не требуя привнесения в стих более поздних миссиологических формулировок.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным поэтическим звучанием. Строчные местоимения по отношению к Богу соответствуют нейтральной современной издательской практике и не вводят конфессиональной особенности. Тире во второй строке естественно отмечает эллипсис повторяющегося сказуемого.
