  text: יַעֲלֹ֣ז שָׂ֭דַי וְ/כָל אֲשֶׁר בּ֑/וֹ אָ֥ז יְ֝רַנְּנ֗וּ כָּל עֲצֵי יָֽעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/012.yaml
  text: Let the field exult[a], and all that is in it; then all the trees of the forest will sing for joy.
translation:
  language: ru
  text: Да ликует поле и всё, что на нём! Тогда возликуют[a] все деревья в лесу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «издадут радостный крик»; еврейский глагол может обозначать громкий возглас радости или радостное пение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲלֹז
  choice: Да ликует
  rationale: Форма выражает поэтическое пожелание или призыв. Конструкция «да ликует» сохраняет волитивную силу и возвышенное звучание.
- source_word: שָׂדַי
  choice: поле
  rationale: Единственное число употреблено собирательно; «поле» естественно передаёт образ открытой земли и сохраняет олицетворение.
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: и всё, что на нём
  rationale: Передаёт всеохватность כָל אֲשֶׁר и естественное для русского языка пространственное отношение к полю.
- source_word: אָז
  choice: тогда
  rationale: Сохраняет переход к следующему движению поэтической картины.
- source_word: יְרַנְּנוּ
  choice: возликуют
  rationale: Глагол обозначает громкий радостный возглас или радостное пение. «Возликуют» естественно применимо к олицетворённым деревьям и сохраняет широту значения.
- source_word: כָּל עֲצֵי יָעַר
  choice: все деревья в лесу
  rationale: Естественная русская формулировка, сохраняющая всеохватность כָל и образ целого леса.
theological_decisions:
- issue: Олицетворение творения в хвале
  choice: Сохранить прямое поэтическое олицетворение поля и деревьев.
  alternative: Истолковать образ как описание красоты или изобилия природы.
  rationale: В стихе само нечеловеческое творение представлено ликующим; прямой перевод сохраняет богословский размах образа, не объясняя его сверх текста.
translation_notes:
  register: Современный литературный русский язык с поэтической торжественностью. Восклицательный знак после первой строки поддерживает призывное «да ликует», а будущее «возликуют» сохраняет переход, отмеченный словом «тогда».
