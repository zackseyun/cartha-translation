  text: כִּ֤י כָּל אֱלֹהֵ֣י הָ/עַמִּ֣ים אֱלִילִ֑ים וַֽ֝/יהוָ֗ה שָׁמַ֥יִם עָשָֽׂה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/005.yaml
  text: For all the gods of the peoples are idols[c][b][a], but Yahweh made the heavens.
translation:
  language: ru
  text: Ведь все боги народов[a] — идолы[b], а Яхве[c] создал небеса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «племён»; еврейское слово также может обозначать нации.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово может нести полемический оттенок пустоты или ничтожности; возможно: «ничтожные идолы».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское יהוה (ЙХВХ); традиционно переводится как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для предшествующего призыва; «ведь» естественно передаёт пояснительно-причинную связь в современном русском языке.
- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: все боги народов
  rationale: Сохраняется всеохватность כָּל, значение אֱלֹהֵי как божеств и множественное הָעַמִּים — «народы».
- source_word: אֱלִילִים
  choice: идолы
  rationale: Прямое и понятное соответствие; присущий слову полемический оттенок ничтожности отмечен в сноске, а не усилен в основном тексте.
- source_word: וַיהוָה
  choice: а Яхве
  rationale: Союз וְ здесь выражает резкое противопоставление между богами народов и Творцом; «а» передаёт его естественно. Тетраграмматон передан личным именем «Яхве».
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Обычное русское соответствие еврейской форме множественного числа в контексте творения.
- source_word: עָשָׂה
  choice: создал
  rationale: В данном контексте «создал» естественно передаёт общее значение «сделал» применительно к небесам, не используя более специально окрашенное «сотворил».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо содержит тетраграмматон. «Яхве» сохраняет личное заветное имя; традиционное замещение «Господь» указано в сноске.
- issue: Статус богов народов
  choice: идолы
  alternative: ничтожества; ничтожные идолы
  rationale: Текст полемически отрицает их сопоставимость с Яхве, но основная формулировка не разворачивает возможную коннотацию слова אֱלִילִים в более определённое метафизическое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим, но общепонятным строем. Тире подчёркивает тождественное утверждение первой половины, а союз «а» — контраст с Яхве как Создателем небес.
