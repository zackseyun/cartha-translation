id: PSA.96.10
reference: Psalms 96:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִמְר֤וּ בַ/גּוֹיִ֨ם יְה֘וָ֤ה מָלָ֗ךְ אַף תִּכּ֣וֹן תֵּ֭בֵל בַּל תִּמּ֑וֹט יָדִ֥ין עַ֝מִּ֗ים בְּ/מֵישָׁרִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/010.yaml
  text: Say among the nations[a], “Yahweh reigns! Indeed, the world is established; it shall not be moved[c][b]. He will judge the peoples with equity.”
translation:
  language: ru
  text: 'Скажите среди народов: «Яхве царствует![a] И вселенная[b] прочно утверждена, не поколеблется. Он будет судить народы по справедливости[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве — Царь»; или: «Яхве воцарился». Еврейский текст допускает как провозглашение Его нынешнего царствования, так и возвещение вступления на царство.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «обитаемый мир».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «по правоте»; или: «беспристрастно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: Скажите
  rationale: Форма повелительного наклонения во множественном числе прямо призывает слушателей возвестить последующее слово; публичный характер речи передаёт оборот «среди народов».
- source_word: בַגּוֹיִם
  choice: среди народов
  rationale: Предлог ב здесь естественно выражает среду, в которой должно прозвучать возвещение; «народы» сохраняет международный охват גּוֹיִם.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: מָלָךְ
  choice: царствует
  rationale: В контексте псалма о Божьем царствовании qatal естественно звучит как торжественное провозглашение нынешней царской власти; возможные значения «Он — Царь» и «воцарился» сохранены в примечании.
- source_word: אַף
  choice: И
  rationale: Частица присоединяет и подчёркивает следствие провозглашённого царствования. Русское «и» сохраняет связь без чрезмерного усиления.
- source_word: תִּכּוֹן
  choice: прочно утверждена
  rationale: Нифаль от כון обозначает установленность и устойчивость; сочетание передаёт как результативно-пассивный смысл, так и идею прочности.
- source_word: תֵּבֵל
  choice: вселенная
  rationale: Слово обозначает мир как устроенное, обитаемое целое. «Вселенная» уместна в поэтическом регистре и избегает многозначности русского слова «мир».
- source_word: בַּל תִּמּוֹט
  choice: не поколеблется
  rationale: Сочетание отрицательной частицы с глаголом מוט выражает невозможность утратить устойчивость; «не поколеблется» естественно и сохраняет поэтический образ.
- source_word: יָדִין
  choice: Он будет судить
  rationale: Глагол דין имеет судебный и правительственный оттенки; в данном контексте «судить» прямо передаёт осуществление царём справедливого суда.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число обозначает совокупность народов. В русском повтор слова «народы» звучит естественнее, чем искусственное разграничение синонимами.
- source_word: בְּמֵישָׁרִים
  choice: по справедливости
  rationale: מֵישָׁרִים выражает прямоту, правоту и беспристрастную справедливость; оборот естественен в контексте суда.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Аспект מָלָךְ в провозглашении царствования
  choice: царствует
  alternative: Он — Царь; воцарился
  rationale: Форма допускает провозглашение настоящего царствования и прочтение как вступления на царство. Основной текст естественно передаёт литургическое утверждение, а примечание сохраняет подлинную аспектуальную неоднозначность.
- issue: Характер Божьего суда
  choice: по справедливости
  alternative: по правоте; беспристрастно
  rationale: Формулировка сохраняет нравственно-судебный смысл מֵישָׁרִים, не сужая его до какой-либо конфессиональной модели суда.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Синтаксис остаётся ясным для обычного читателя; «вселенная» и «не поколеблется» поддерживают достоинство псалмового регистра без архаизации.
