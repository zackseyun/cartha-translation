  text: הוֹד וְ/הָדָ֥ר לְ/פָנָ֑י/ו עֹ֥ז וְ֝/תִפְאֶ֗רֶת בְּ/מִקְדָּשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/096/006.yaml
  text: Splendor and majesty are before him[a]; strength and beauty are in his sanctuary.
translation:
  language: ru
  text: Великолепие и величие — перед Ним; сила и красота[a] — в Его святилище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великолепие» или «слава».'
    reason: Еврейское תִפְאֶרֶת имеет широкий смысловой диапазон и может обозначать красоту, великолепие или славу.
lexical_decisions:
- source_word: הוֹד
  choice: сияние
  rationale: Передаёт блистательное, царственное великолепие и позволяет отличить это слово от близкого по смыслу הָדָר.
- source_word: הָדָר
  choice: величие
  rationale: Сохраняет оттенок величавости и высокого достоинства в поэтической паре с הוֹד.
- source_word: לְפָנָיו
  choice: пред Ним
  rationale: Прямо сохраняет пространственно-присутственный образ еврейского выражения; связка «есть» естественно опущена в русском поэтическом предложении.
- source_word: עֹז
  choice: сила
  rationale: Ясно и естественно передаёт основное значение слова — силу или могущество.
- source_word: תִפְאֶרֶת
  choice: красота
  rationale: Передаёт эстетическую сторону многозначного слова и образует естественную поэтическую пару со словом «сила», не повторяя лексику первой строки.
- source_word: בְּמִקְדָּשׁוֹ
  choice: в Его святилище
  rationale: «Святилище» сохраняет общее обозначение священного места, не конкретизируя его как храм сверх того, что выражено в еврейском тексте.
theological_decisions:
- issue: К кому относятся местоименные суффиксы «Ним» и «Его»
  choice: Сохранены местоимения, относящиеся в контексте псалма к Господу.
  alternative: Заменить местоимения именованием «Господь».
  rationale: Еврейский стих использует местоименные суффиксы, а его ближайший контекст ясно указывает на Господа; сохранение местоимений передаёт поэтическое течение оригинала без ненужного уточнения.
translation_notes:
  register: Современный литературный русский с кратким, возвышенным поэтическим строем. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому регистру; тире восполняют подразумеваемую именную связку.
