lexical_decisions:
- source_word: וַיִּרְכַּב
  choice: воссел
  rationale: Глагол רכב обозначает езду верхом или восхождение на того, кто служит средством передвижения. «Воссел» естественно передаёт завершённое действие и сохраняет возвышенный поэтический образ.
- source_word: עַל
  choice: на
  rationale: Предлог указывает, что херувим служит опорой или средством передвижения; русское «на» передаёт это прямо.
- source_word: כְּרוּב
  choice: херувима
  rationale: В еврейском тексте стоит единственное число. Устоявшееся русское слово «херувим» сохраняет конкретный образ небесного существа и не подменяет его толкованием.
- source_word: וַיָּעֹף
  choice: полетел
  rationale: Прямое значение глагола עוף — «лететь». Совершенный вид согласуется с последовательностью действий в повествовательной поэзии.
- source_word: וַיֵּדֶא
  choice: понёсся
  rationale: Редкий глагол в поэтическом параллелизме, вероятнее всего, описывает быстрое движение по воздуху. «Понёсся» передаёт стремительность, не уточняя без достаточных оснований, был ли это рывок, парение или пикирование.
- source_word: כַּנְפֵי
  choice: на крыльях
  rationale: Форма множественного числа в сопряжённом сочетании буквально означает «крылья». Русское выражение сохраняет исходную метафору.
- source_word: רוּחַ
  choice: ветра
  rationale: רוּחַ может означать ветер, дыхание или дух, однако в контексте грозового богоявления наиболее естественно значение «ветер».
theological_decisions:
- issue: Образ Бога, восседающего на херувиме
  choice: 'Сохранить конкретный поэтический образ: «воссел на херувима».'
  alternative: Истолковать херувима как метафору грозовой тучи или небесного воинства.
  rationale: Еврейский текст прямо изображает херувима как носителя, но не объясняет природу образа. Перевод не должен устранять его или навязывать определённую космологическую интерпретацию.
- issue: Значение רוּחַ
  choice: Передать в основном тексте словом «ветер».
  alternative: «дух» или «дыхание».
  rationale: Грозовая образность ближайшего контекста поддерживает значение «ветер», тогда как сноска сохраняет прозрачность более широкого смыслового диапазона слова.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Воссел» соответствует образу богоявления, а точка с запятой сохраняет тесный параллелизм двух глаголов движения без искусственного разрыва стиха.
