    reason: alternative_reading
lexical_decisions:
- source_word: מְשַׁוֶּה
  choice: делает
  rationale: Причастие породы пиэль от שׁוה здесь выражает уподобление; сочетание «делает мои ноги, как…» близко к форме еврейского текста и естественно для русской поэзии.
- source_word: רַגְלַי
  choice: мои ноги
  rationale: רֶגֶל в данном образе движения и устойчивости означает ноги; буквальный вариант уместен и понятен.
- source_word: כָּאַיָּלוֹת
  choice: как у ланей
  rationale: Форма женского рода множественного числа обозначает самок оленя. «Лани» сохраняет этот оттенок и привычный библейско-поэтический образ быстроты и уверенного шага, не делая подразумеваемый смысл частью перевода.
- source_word: וְעַל
  choice: и … на
  rationale: Прямо передаёт союз и предлог, связывающие вторую поэтическую строку с первой.
- source_word: בָּמוֹתַי
  choice: моих высотах
  rationale: Перевод сохраняет буквальное значение «высоты» и суффикс первого лица. В контексте речь об возвышенных местах, но сам текст не уточняет, являются ли они горными, военными или символическими.
- source_word: יַעֲמִידֵנִי
  choice: ставит меня
  rationale: Каузативная форма от עמד означает «ставит, даёт стоять». Добавление «твёрдо» или «уверенно» сделало бы явным лишь подразумеваемый результат.
theological_decisions:
- issue: Образ быстроты и устойчивости
  choice: Сохранить образы ног ланей и стояния на высотах без поясняющей интерпретации в основном тексте.
  alternative: 'Передать смысл разъяснительно: «дарует мне верный шаг и ставит в безопасности на высотах».'
  rationale: Контекст псалма допускает военное и спасительное прочтение, однако сам стих выражает его через поэтический образ. Буквально-образная передача сохраняет богословскую и метафорическую открытость.
- issue: Притяжательное «мои высоты»
  choice: 'Сохранить первое лицо: «на моих высотах».'
  alternative: «На высотах» или «на возвышенностях».
  rationale: Суффикс -ַי в בָּמוֹתַי явно выражает принадлежность или отношение к говорящему; его устранение неоправданно сужает текстовую форму, хотя точный смысл этой принадлежности остаётся открытым.
translation_notes:
  register: Современный литературный русский с сохранением лаконичного параллелизма и возвышенной поэтической образности. «Лани» — понятное литературное слово, здесь не архаизм ради архаизма. Маркеры сносок размещены непосредственно после соответствующих выражений.
