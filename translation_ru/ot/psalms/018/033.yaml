  text: Он делает мои ноги подобными ногам ланей[a] и ставит меня на моих высотах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как у самок оленей» или, в традиционном переводе, «как у ланей». Еврейское слово стоит во множественном числе женского рода и вызывает образ быстрого, уверенного движения.'
