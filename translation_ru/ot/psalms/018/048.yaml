translation:
  language: ru
  text: Избавляющий меня от моих врагов[a], Ты и возносишь меня над теми, кто восстаёт против меня[b]; от человека насилия Ты избавляешь меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Избавитель мой от моих врагов». В еврейском тексте здесь причастие, выступающее как наименование Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ты поднимаешь меня выше тех, кто восстаёт против меня».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «от человека насилия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְפַלְּטִי
  choice: Ты избавляешь меня
  rationale: Причастие с суффиксом первого лица описывает Бога как Избавителя. В русском личная глагольная форма естественно связывает начало строки с последующими обращёнными к Богу формами второго лица, хотя титульный оттенок отмечен в сноске.
- source_word: מֵאֹיְבַי
  choice: от моих врагов
  rationale: Прямо передаёт предлог מִן и существительное אֹיֵב с суффиксом первого лица единственного числа.
- source_word: אַף
  choice: да
  rationale: Краткая усилительная частица передаёт присоединение с подчёркиванием, не превращая его в тяжеловесное «воистину».
- source_word: מִן קָמַי
  choice: над восстающими против меня
  rationale: Причастная форма קום обозначает противников, восстающих на говорящего; при глаголе רום предлог מִן естественно имеет сравнительное значение «над».
- source_word: תְּרוֹמְמֵנִי
  choice: Ты возносишь меня
  rationale: Сохраняет образ возвышения и причинительное значение формы от רום; «возносишь» уместно в высокой, но понятной поэтической речи.
- source_word: מֵאִישׁ חָמָס
  choice: от человека жестокого
  rationale: Передаёт единственное число אִישׁ и характеризующее сочетание с חָמָס. Постпозиция прилагательного поддерживает поэтический регистр; буквальное «человека насилия» вынесено в сноску.
- source_word: תַּצִּילֵנִי
  choice: Ты спасаешь меня
  rationale: Передаёт значение נצל как избавления от опасности и сохраняет некоторую лексическую разницу с פלט, переведённым как «избавляешь».
theological_decisions:
- issue: Функция начального причастия и адресат стиха
  choice: 'Передать весь стих как прямое обращение к Богу: «Ты избавляешь… Ты возносишь… Ты спасаешь».'
  alternative: «Избавляющий меня от моих врагов…» — причастие как наименование Бога или синтаксическое продолжение предшествующей строки.
  rationale: Еврейское причастие может выступать субстантивированно как характеристика Бога, после чего следуют формы второго лица. Русская личная конструкция ясна и поэтически цельна, а формальная неоднозначность отмечена сноской.
- issue: Передача אִישׁ в מֵאִישׁ חָמָס
  choice: «от человека жестокого»
  alternative: «от жестокого мужчины» или буквальное «от человека насилия»
  rationale: В данном поэтическом контексте אִישׁ указывает на отдельного насильственного противника. «Человек» сохраняет единственное число и не привносит ненужного акцента на биологическом поле.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Заглавное «Ты» употреблено как уважительное обращение к Богу. Сохранены параллелизм, вертикальный образ возвышения и различие между двумя глаголами избавления.
