  yaml_path: translation/ot/psalms/018/012.yaml
  text: From the brightness before him his clouds passed on—hail and coals of fire[a].
translation:
  language: ru
  text: От сияния перед Ним прошли Его тучи, град и огненные угли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «От сияния перед Ним прошли Его густые тучи; град и пылающие угли». Еврейская строка предельно сжата и поэтична, поэтому связь образов бури можно передать несколько по-разному.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֹּגַהּ
  choice: От сияния
  rationale: נֹגַהּ означает сияние, блеск или яркий свет; предлог מִן передаёт исходную точку или источник. «От сияния» естественно звучит по-русски и сохраняет образ богоявления в буре.
- source_word: נֶגְדּוֹ
  choice: пред Ним
  rationale: נֶגֶד с местоименным суффиксом означает «перед ним», «пред ним». Поэтическое «пред Ним» сохраняет пространственный смысл и соответствует возвышенному регистру псалма.
- source_word: עָבָיו
  choice: Его тучи
  rationale: עָב обозначает плотную облачную массу, тучу. «Тучи» передаёт плотность и грозовой характер лучше нейтральных «облаков», не добавляя отсутствующего определения.
- source_word: עָבְרוּ
  choice: прошли
  rationale: Qal множественного числа от עבר означает «прошли», «пронеслись», «миновали». «Прошли» прямо согласуется с «тучи» и не уточняет траекторию, которую еврейский текст оставляет неопределённой.
- source_word: בָּרָד
  choice: град
  rationale: Обычное и точное обозначение природного явления.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: и огненные угли
  rationale: Буквально «и угли огня». Русское «огненные угли» сохраняет конкретный поэтический образ и звучит естественнее буквального «угли огня».
theological_decisions:
- issue: Поэтический образ богоявления в буре
  choice: Сохранить образ как описание явления Бога, не сводя его к одной лишь метафоре и не превращая в развёрнутое утверждение о буквальном метеорологическом чуде.
  alternative: Истолковать строку исключительно как образ военной победы либо однозначно как буквальное описание природного события.
  rationale: Еврейский текст поэтически соединяет сияние, тучи, град и огненные угли. Перевод сохраняет эту напряжённость и не решает за читателя, насколько буквально следует понимать каждую деталь.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Инверсия «пред Ним» и прописная буква в местоимении поддерживают достоинство речи; лексика остаётся понятной обычному современному читателю.
