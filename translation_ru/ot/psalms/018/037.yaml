base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/037.yaml
  text: I pursued my enemies and overtook them[a], and I did not turn back until they were consumed.
translation:
  language: ru
  text: Я преследовал своих врагов и настиг их; я не повернул назад, пока с ними не было покончено[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до их полного уничтожения»; возможно также: «пока я не истребил их полностью».'
    reason: Сноска передаёт буквальный оттенок доведения до конца и сохраняет неоднозначность относительно того, выражен ли исполнитель действия.
lexical_decisions:
- source_word: אֶרְדּוֹף
  choice: Я преследовал
  rationale: Имперфект qal 1-го лица ед. числа в поэтическом рассказе описывает совершённое действие; прошедшее время соответствует контексту победы. «Преследовал» естественно передаёт военную погоню.
- source_word: אֹיְבַי
  choice: своих врагов
  rationale: Обычное значение существительного с суффиксом 1-го лица — «мои враги». Русское возвратное местоимение «своих» естественно при подлежащем «я».
- source_word: וְאַשִּׂיגֵם
  choice: и настиг их
  rationale: Hiphil от נשׂג в контексте погони означает «настичь, догнать». «Настиг» сохраняет военный образ и хорошо сочетается с «преследовал».
- source_word: וְלֹא אָשׁוּב
  choice: я не повернул назад
  rationale: שׁוב здесь означает не просто возвращение, а прекращение погони и поворот назад. Формулировка передаёт решимость говорящего и звучит естественно по-русски.
- source_word: עַד
  choice: пока не
  rationale: Предлог обозначает временной предел действия; в отрицательной русской конструкции естественно передаётся сочетанием «пока не».
- source_word: כַּלּוֹתָם
  choice: они не были истреблены
  rationale: Форма от כלה обозначает доведение до конца, полное уничтожение или исчезновение. Пассивная конструкция передаёт полное поражение врагов, не делая выраженного действующего лица там, где еврейская форма допускает сжатость и некоторую неоднозначность.
theological_decisions:
- issue: Военное насилие и подразумеваемый исполнитель в заключительной фразе
  choice: пока они не были истреблены
  alternative: пока я не истребил их полностью
  rationale: Смысл полной гибели врагов не смягчается, однако перевод не вводит явно местоимение «я» как исполнителя заключительного действия. Это сохраняет сжатость исходного выражения и не устраняет его грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Точка с запятой сохраняет параллелизм двух частей стиха; архаизмы и конфессионально окрашенные выражения не используются.
