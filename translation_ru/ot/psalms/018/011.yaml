base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/011.yaml
  text: He made darkness his hiding place[a], around him his shelter—dark waters[c][b], thick clouds of the skies.
translation:
  language: ru
  text: 'Он сделал тьму Своим укрытием[a]; вокруг Него — Его шатёр: мрак вод[c], густые облака небес.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своим тайным местом».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «тёмные воды».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֶׁת
  choice: сделал
  rationale: В поэтическом повествовании глагол обозначает установление или устроение чего-либо; «сделал» естественно передаёт превращение тьмы в укрытие.
- source_word: חֹשֶׁךְ
  choice: тьму
  rationale: Прямое значение сохраняет конкретный образ грозовой теофании, не приписывая тьме нравственного смысла.
- source_word: סִתְרוֹ
  choice: Своим укрытием
  rationale: Слово обозначает место сокрытия; «укрытие» звучит естественно и сохраняет пространственный образ.
- source_word: סְבִיבוֹתָיו
  choice: вокруг Него
  rationale: Точно и ясно передаёт пространственное расположение.
- source_word: סֻכָּתוֹ
  choice: Его шатёр
  rationale: «Шатёр» сохраняет конкретный образ временного крытого убежища лучше, чем более обобщённое «покров», и не вносит культового значения слова «скиния».
- source_word: חֶשְׁכַת מַיִם
  choice: мрак вод
  rationale: Сохраняет еврейскую конструкцию и напряжённую поэтическую образность; более сглаженный вариант — «тёмные воды».
- source_word: עָבֵי שְׁחָקִים
  choice: густые облака небес
  rationale: Передаёт плотность облаков и поэтическое обозначение небесной выси.
theological_decisions:
- issue: Тьма служит сокрытием Бога в образе бури, но текст не определяет её как нравственное зло или символ суда.
  choice: Передать тьму и облака как прямые образы сокрытой грозовой теофании.
  alternative: Истолковать тьму как символ суда либо увидеть в шатре культовую скинию.
  rationale: Еврейский текст сохраняет поэтический образ и не поясняет его доктринально; перевод не должен устранять эту напряжённость добавочным толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Инверсия «мрак вод» намеренно сохраняет сжатость и образность еврейского стиха; добавленное «был» делает синтаксис ясным, не меняя отношений между образами.
