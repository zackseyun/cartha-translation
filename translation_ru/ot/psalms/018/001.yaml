lexical_decisions:
- source_word: וַיֹּאמַר
  choice: И сказал он
  rationale: Форма с последовательным ו вводит речь. Явное местоимение сохраняет присутствующий в еврейском тексте глагол в третьем лице и не смешивает рассказчика с последующим первым лицом.
- source_word: אֶרְחָמְךָ
  choice: Нежно люблю Тебя
  rationale: Глагол רחם выражает глубокую, нежную привязанность и обычно связан с состраданием. В обращении к Богу буквальное «сострадаю Тебе» звучало бы по-русски как жалость к Богу, поэтому смысл передан естественно, а исходный оттенок отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является общепринятой современной русской транслитерацией предполагаемого произношения тетраграмматона.
- source_word: חִזְקִי
  choice: сила моя
  rationale: Существительное с суффиксом первого лица естественно и точно передаётся как «сила моя»; порядок слов поддерживает возвышенный поэтический регистр без архаизации.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. «Яхве» сохраняет различие между именем и титулом, не вводя традиционную замену «Господь».
- issue: Смысл רחם в обращении к Богу
  choice: Нежно люблю Тебя
  alternative: Сострадаю Тебе; глубоко дорожу Тобой
  rationale: Сохранён оттенок нежной привязанности, но исключено возникающее в современном русском нежелательное значение жалости к Богу. Лексическая напряжённость не скрыта, а вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Заглавное «Тебя» употреблено как русская норма благоговейного обращения к Богу. Восклицательный знак передаёт эмоциональную силу признания, не меняя его содержания.
