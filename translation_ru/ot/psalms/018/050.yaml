  text: מגדל יְשׁוּע֪וֹת מַ֫לְכּ֥/וֹ וְ/עֹ֤שֶׂה חֶ֨סֶד לִ/מְשִׁיח֗/וֹ לְ/דָוִ֥ד וּ/לְ/זַרְע֗/וֹ עַד עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/050.yaml
  text: He gives great victories to his king and shows steadfast love to his anointed[c][b][a], to David and to his offspring forever.
translation:
  language: ru
  text: 'Он дарует великие победы царю своему[a]

    и являет неизменную любовь помазаннику своему[b] —

    Давиду и его потомству[c] навеки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он — башня спасений для царя своего». Начальная еврейская форма текстуально и синтаксически трудна; во 2 Царств 22:51 стоит близкое по смыслу: «Он умножает победы своего царя».'
    reason: textual_variant
  - marker: b
    text: «Помазаннику своему» можно также передать как «Мессии своему». Непосредственно здесь имеется в виду Давид, или царь из рода Давида, но слово сохраняет и более широкое мессианское звучание.
    reason: alternative_reading
  - marker: c
    text: '«Потомство» передаёт собирательное существительное в единственном числе: оно может обозначать весь род Давида и в более широком библейском контексте допускает также мессианское прочтение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מגדל
  choice: дарует великие
  rationale: Начальная еврейская форма текстуально и синтаксически трудна. С учётом параллели во 2 Царств 22:51 выражение передано как действие Бога, делающего спасительные победы царя великими; это естественнее по-русски, чем буквальное «башня спасений».
- source_word: יְשׁוּעוֹת
  choice: победы
  rationale: Множественное число обозначает неоднократные избавления или спасительные деяния; в царском и военном контексте «победы» звучит естественно и сохраняет смысл Божьего избавления.
- source_word: מַלְכּוֹ
  choice: царю своему
  rationale: Передаёт существительное с местоименным суффиксом и сохраняет отношение Бога к поставленному Им царю.
- source_word: וְעֹשֶׂה חֶסֶד
  choice: и являет неизменную любовь
  rationale: חֶסֶד обозначает верную, устойчивую любовь, особенно в отношениях завета. «Неизменная любовь» понятно современному читателю и содержательнее общего «милость».
- source_word: לִמְשִׁיחוֹ
  choice: помазаннику своему
  rationale: Непосредственно речь идёт о Давиде как помазанном царе. Перевод сохраняет исходное значение и не устраняет более широкого мессианского звучания.
- source_word: לְדָוִד
  choice: Давиду
  rationale: Имя передано в принятой русской форме; приложение поясняет, кто здесь является Божьим помазанником.
- source_word: וּלְזַרְעוֹ
  choice: и его потомству
  rationale: «Потомство» сохраняет собирательное единственное число זֶרַע и не сужает значение ни до множества отдельных потомков, ни до одного потомка.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Краткая и естественная русская передача неограниченно продолжающегося времени.
theological_decisions:
- issue: Мессианское звучание מְשִׁיחוֹ в царском псалме Давида
  choice: В основном тексте — «помазаннику своему», с указанием варианта «Мессии своему» в сноске.
  alternative: Мессии своему
  rationale: Ближайший исторический референт — Давид, названный далее по имени, однако слово сохраняет мессианский потенциал. Основной текст и сноска вместе удерживают оба уровня, не отождествляя их без пояснения.
- issue: Объём значения זַרְעוֹ
  choice: 'Сохранить собирательное единственное число: «его потомству».'
  alternative: его потомкам; его семени
  rationale: Еврейское слово может обозначать весь род Давида, сохраняя при этом возможность сосредоточения на одном мессианском Потомке. «Потомство» не разрешает эту смысловую напряжённость односторонне.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим ритмом. Инверсия «царю своему / помазаннику своему» поддерживает параллелизм и достоинство псалма, оставаясь понятной. Местоимения, относящиеся к Богу, набраны со строчной буквы согласно нейтральной современной издательской норме.
