  text: לַ/מְנַצֵּ֤חַ לְ/עֶ֥בֶד יְהוָ֗ה לְ/דָ֫וִ֥ד אֲשֶׁ֤ר דִּבֶּ֨ר לַ/יהוָ֗ה אֶת דִּ֭בְרֵי הַ/שִּׁירָ֣ה הַ/זֹּ֑את בְּ/י֤וֹם הִֽצִּיל יְהוָ֘ה אוֹת֥/וֹ מִ/כַּ֥ף כָּל אֹ֝יְבָ֗י/ו וּ/מִ/יַּ֥ד שָׁאֽוּל׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/000.yaml
  text: For the choirmaster[a]. Of David, the servant of Yahweh[b], who spoke to Yahweh the words of this song on the day when Yahweh rescued him from the hand of all his enemies and from the hand of Saul.
translation:
  language: ru
  text: Руководителю хора[a]. Давида, слуги[b] Яхве, который обратил к Яхве слова этой песни в тот день, когда Яхве избавил его из рук всех его врагов и из руки Саула[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово традиционно понимают как обозначение руководителя музыкального исполнения; также возможно: «дирижёру» или «руководителю певцов». Точная должность неизвестна.'
    reason: lexical_uncertainty
  - marker: b
    text: 'Также возможно: «раба». Еврейское слово может обозначать и слугу, и раба; здесь оно употреблено как почётное наименование Давида по отношению к Яхве.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «из ладони всех его врагов и из руки Саула». В еврейском языке «рука» здесь означает власть или контроль.'
    reason: cultural_note
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Традиционная формула надписаний псалмов, обращённая к лицу, руководившему музыкальным исполнением; слово «хор» передаёт вероятную литургическую функцию, хотя точная должность не вполне ясна.
- source_word: לְעֶבֶד יְהוָה
  choice: слуги Яхве
  rationale: עֶבֶד может означать как слугу, так и раба; здесь это почётное обозначение Давида как принадлежащего Богу и служащего Ему, поэтому в основном тексте выбрано естественное русское «слуга».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая форма надписания сохраняет многозначность еврейского לְ, которое может обозначать авторство, принадлежность или связь с Давидом, не добавляя отсутствующего в источнике слова «псалом».
- source_word: אֲשֶׁר דִּבֶּר לַיהוָה אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: который обратил к Яхве слова этой песни
  rationale: Передаёт речь, направленную к Яхве, естественным современным русским оборотом и сохраняет прямое упоминание «слов этой песни».
- source_word: בְּיוֹם
  choice: в тот день, когда
  rationale: Сохраняет временную конструкцию надписания и естественно связывает её с последующим событием.
- source_word: הִצִּיל
  choice: избавил
  rationale: Глагол обозначает избавление от опасности или власти врагов; «избавил» уместно в возвышенном, но понятном русском регистре.
- source_word: מִכַּף ... וּמִיַּד
  choice: из рук ... и из руки
  rationale: Сохранена еврейская метафора руки как власти или контроля, а также параллелизм единственного и множественного числа в исходном тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон, поэтому личное имя сохранено в принятой научной транслитерации без замены титулом.
- issue: Передача עֶבֶד применительно к Давиду
  choice: слуга
  alternative: раб
  rationale: Оба значения лексически возможны. В надписании слово служит почётным обозначением отношений Давида с Яхве; вариант «слуга» лучше соответствует функции выражения, а альтернатива отмечена в сноске.
- issue: Степень конкретизации לְדָוִד
  choice: Давида
  alternative: псалом Давида; для Давида; принадлежащее Давиду
  rationale: Лаконичная родительная конструкция сохраняет обычную для надписаний неопределённость относительно авторства, принадлежности или посвящения и не добавляет существительного, отсутствующего в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для библейского надписания. Синтаксическая краткость «Давида» намеренно сохраняет форму и неоднозначность оригинала; архаизмы и конфессионально маркированные замены Божьего имени не используются.
