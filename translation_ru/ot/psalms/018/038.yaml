lexical_decisions:
- source_word: אֶמְחָצֵם
  choice: Я сокрушаю их
  rationale: Глагол מחץ передаёт сильный, сокрушительный удар в контексте битвы. «Сокрушаю» сохраняет образную силу еврейского текста и естественно звучит в возвышенной поэтической речи.
- source_word: וְלֹא יֻכְלוּ
  choice: и они не могут
  rationale: Сочетание простого союза с отрицанием и глаголом יכל прямо выражает неспособность; краткая русская конструкция точно передаёт смысл.
- source_word: קוּם
  choice: подняться
  rationale: После יכל инфинитив קום означает встать или подняться. «Подняться» особенно ясно сохраняет образ поверженных врагов, неспособных снова встать.
- source_word: יִפְּלוּ
  choice: они падают
  rationale: Глагол נפל имеет прямое значение «падать». Настоящее время поддерживает живое поэтическое изображение действия.
- source_word: תַּחַת רַגְלָי
  choice: под ноги мои
  rationale: Оборот сохраняет пространственный образ полного поражения. Постпозиция местоимения «мои» придаёт строке умеренно возвышенное, псалмическое звучание без архаической неясности.
theological_decisions:
- issue: Жестокая военная образность в царском псалме
  choice: Сохранить воинственное высказывание от первого лица без смягчения
  alternative: 'Передать обобщённо: «побеждаю их» или «одолеваю их»'
  rationale: Еврейский текст прямо говорит о сокрушении, невозможности подняться и падении под ноги. Смягчённый перевод устранил бы существенную силу исходной военной образности.
translation_notes:
