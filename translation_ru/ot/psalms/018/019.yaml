  text: וַ/יּוֹצִיאֵ֥/נִי לַ/מֶּרְחָ֑ב יְ֝חַלְּצֵ֗/נִי כִּ֘י חָ֥פֵֽץ בִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/019.yaml
  text: He brought me out into a broad place[a]; he rescued me[c][b], because he delighted in me.
translation:
  language: ru
  text: Он вывел меня на простор[a], избавил меня, потому что благоволил ко мне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на открытое место»; «на широкое место». Этот образ противопоставляет стеснённость свободе и безопасности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что находил во мне радость»; «потому что был доволен мной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵנִי
  choice: Он вывел меня
  rationale: Каузативная форма глагола יצא означает «вывести, дать выйти». «Вывел меня» естественно звучит по-русски и сохраняет образ выхода из тесноты или опасности.
- source_word: לַמֶּרְחָב
  choice: на простор
  rationale: מֶרְחָב обозначает широкое, открытое пространство и образно противопоставляет стеснённость свободе и безопасности. Русское «на простор» кратко и естественно передаёт этот образ.
- source_word: יְחַלְּצֵנִי
  choice: избавил меня
  rationale: Форма Piel глагола חלץ означает «вырвать, избавить, спасти». «Избавил меня» сохраняет параллелизм с первой строкой и соответствует возвышенному, но современному регистру псалма.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание избавления; «потому что» ясно передаёт причинное значение.
- source_word: חָפֵץ בִּי
  choice: благоволил ко мне
  rationale: Сочетание חפץ с ב выражает удовольствие, расположение или благоволение к кому-либо. «Благоволил ко мне» естественно для поэтической библейской речи и не уточняет, чем вызвано Божье расположение.
theological_decisions:
- issue: Характер Божьего расположения в заключительной части стиха
  choice: потому что благоволил ко мне
  alternative: потому что находил во мне радость; потому что был доволен мной
  rationale: Еврейский текст называет Божье расположение причиной избавления, но не объясняет его через заслуги, избрание или какой-либо иной богословский механизм. Перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Синтаксический параллелизм и образ пространства сохранены; конфессионально окрашенные уточнения не добавлены.
