  text: Он с высоты послал, взял меня и извлёк меня из многих вод.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׁלַח
  choice: протянул руку
  rationale: Глагол может означать «посылать» или «простирать, протягивать». В еврейском объект не назван, однако в контексте спасения естественно подразумевается рука; такой перевод сохраняет образ действия свыше и не оставляет неестественного для русского языка «послал» без дополнения.
- source_word: מִמָּרוֹם
  choice: с высоты
  rationale: Передаёт значение высокого места, не уточняя его как «небо», поскольку этого уточнения нет в еврейском тексте.
- source_word: יִקָּחֵנִי
  choice: взял меня
  rationale: Прямое соответствие обычному значению глагола לקח; более сильные варианты «схватил» или «ухватил» излишне конкретизируют действие.
- source_word: יַמְשֵׁנִי
  choice: извлёк меня
  rationale: Форма глагола משה обозначает извлечение, особенно из воды. «Извлёк» ясно и уместно передаёт спасительное действие, сохраняя перекличку с Исх. 2:10.
- source_word: מִמַּיִם רַבִּים
  choice: из вод многих
  rationale: Близко передаёт буквальный образ «многих вод», обозначающий окружившую человека смертельную опасность, без замены образа толкованием.
theological_decisions:
- issue: Следует ли прямо назвать небеса источником спасительного действия
  choice: с высоты
  alternative: с неба
  rationale: Еврейский текст говорит о высоте, но прямо не называет небо. Выбранный вариант сохраняет образ божественной возвышенности, не внося отсутствующего уточнения.
- issue: Следует ли сделать подразумеваемый объект глагола יִשְׁלַח явным
  choice: протянул руку с примечанием о буквальной конструкции
  alternative: послал с высоты
  rationale: В русском языке «послал с высоты» требует названного объекта и звучит незавершённо. Добавление «руку» естественно выражает спасительный жест, а примечание открыто указывает, что слово отсутствует в еврейском тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «из вод многих» сохраняет ритм и образность псалма, оставаясь понятной современному читателю.
