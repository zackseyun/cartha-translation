lexical_decisions:
- source_word: יַצִּילֵנִי
  choice: Он избавил меня
  rationale: Порода hифиль глагола נצל означает «избавлять, спасать». Имперфект допускает поэтическое настоящее, но контекст повествует о совершённом избавлении, поэтому выбран прошедший вид.
- source_word: מֵאֹיְבִי עָז
  choice: от сильного врага моего
  rationale: Существительное «враг» стоит в единственном числе с суффиксом первого лица, а עָז прямо передаёт силу или могущество. Постпозиция «моего» сохраняет достоинство поэтической речи и подчёркивает отличие от следующего множественного выражения.
- source_word: וּמִשֹּׂנְאַי
  choice: и от ненавидевших меня
  rationale: Причастная форма от שׂנא имеет множественное число и обозначает тех, кто ненавидел говорящего; субстантивированное причастие естественно звучит по-русски.
- source_word: כִּי
  choice: потому что
  rationale: 'Союз вводит основание избавления: противники превосходили псалмопевца силой.'
- source_word: אָמְצוּ מִמֶּנִּי
  choice: они были сильнее меня
  rationale: Глагол אמץ выражает силу, а מן при нём задаёт сравнение. Русская сравнительная конструкция точно и естественно передаёт превосходство врагов в силе.
theological_decisions:
- issue: Временное значение начального имперфекта в поэтической речи
  choice: 'Прошедшее повествование: «Он избавил меня»'
  alternative: 'Настоящее поэтическое: «Он избавляет меня»'
  rationale: В этом разделе псалма вспоминается совершённое Богом избавление в ответ на бедствие. Прошедшее время поддерживает ход повествования, не устраняя допустимую грамматически альтернативу, указанную в сноске.
