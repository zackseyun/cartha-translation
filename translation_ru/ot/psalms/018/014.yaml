  yaml_path: translation/ot/psalms/018/014.yaml
  text: He sent out his arrows and scattered them[a]; he multiplied lightning bolts and threw them into confusion.
translation:
  language: ru
  text: Он послал Свои стрелы и рассеял врагов; умножил молнии и привёл их в смятение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он послал Свои стрелы и рассеял врагов; множеством молний привёл их в смятение». Еврейское слово, переведённое как «умножил», можно также понимать в значении «во множестве» или «много». Местоименные суффиксы могут пониматься по-разному; в данном переводе они относятся к врагам, подразумеваемым контекстом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Глагол שׁלח обозначает посылание или выпуск оружия; в сочетании со «стрелами» русское «послал» естественно передаёт образ небесного Воителя.
- source_word: חִצָּיו
  choice: Свои стрелы
  rationale: חֵץ означает «стрела», а суффикс 3-го лица единственного числа указывает на принадлежность стрел действующему лицу.
- source_word: וַיְפִיצֵם
  choice: и рассеял их
  rationale: Глагол означает «рассеять, разогнать»; местоименный суффикс естественнее всего относится к подразумеваемым в контексте врагам.
- source_word: וּבְרָקִים
  choice: молнии
  rationale: Множественное число בְּרָקִים обозначает вспышки или разряды молнии и параллельно стрелам служит образом божественного оружия.
- source_word: רָב
  choice: умножил
  rationale: Форма допускает понимание как глагольного обозначения умножения либо как указания на множество; «умножил» сохраняет возможную глагольную структуру и поэтический параллелизм.
- source_word: וַיְהֻמֵּם
  choice: и привёл их в смятение
  rationale: המם в военном контексте означает повергнуть в смятение, вызвать панику или замешательство, не обязательно прямо утверждая полное поражение.
theological_decisions:
- issue: К кому относятся местоименные суффиксы в «рассеял их» и «привёл их в смятение»
  choice: К врагам Давида, подразумеваемым более широким контекстом псалма.
  alternative: К стрелам и молниям, которые Бог рассеивает или направляет во многие стороны.
  rationale: Образ Господа как небесного Воителя и семантика המם лучше согласуются с тем, что стрелы и молнии являются средствами, которыми враги рассеиваются и приходят в смятение.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной псалмовой образностью. Прописное «Свои» используется как традиционное русское указание на Бога без добавления отсутствующего в еврейском тексте имени.
