lexical_decisions:
- source_word: יְשַׁוְּעוּ
  choice: взывали о помощи
  rationale: Глагол שׁוע выражает отчаянный призыв о помощи; перевод передаёт значение естественно и в возвышенном поэтическом регистре.
- source_word: מוֹשִׁיעַ
  choice: спасителя
  rationale: Причастие от ישׁע обозначает того, кто спасает или избавляет; существительное «спаситель» сохраняет прямую связь с исходной формой и не уточняет личность.
- source_word: יְהוָה
  choice: ГОСПОДУ
  rationale: Традиционная русская передача тетраграмматона словом «ГОСПОДЬ» в прописном начертании; падеж соответствует предлогу עַל.
- source_word: וְלֹא עָנָם
  choice: но Он не ответил им
  rationale: Передаёт отрицание и глагол ענה с местоименным суффиксом множественного числа; заглавная буква указывает на ближайший антецедент — ГОСПОДА.
theological_decisions:
- issue: Смысл слова מוֹשִׁיעַ
  choice: спасителя
  alternative: некого было спасти их / никто не спасал
  rationale: Более формальная передача сохраняет выражение исходного текста и его богословское напряжение, не подменяя его описательной конструкцией.
- issue: Отсутствие ответа от ГОСПОДА
  choice: но Он не ответил им
  alternative: но ответа им не было
  rationale: Личная глагольная конструкция точно отражает еврейский текст и не смягчает утверждение о Божьем молчании в отношении врагов псалмопевца.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Повтор «взывали» добавлен во второй части как естественное восстановление эллипсиса и делает синтаксическую связь ясной без изменения смысла.
