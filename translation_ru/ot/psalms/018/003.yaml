  text: I call on Yahweh[a], who is worthy to be praised[b], and I am saved from my enemies.
translation:
  language: ru
  text: Я взываю к Яхве[a], достойному хвалы, — и буду спасён[b] от врагов моих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה (ЙХВХ) — личное имя Бога; здесь оно передано как «Яхве».
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «спасён» или «спасаюсь». Еврейская форма глагола допускает будущее и обобщённо-настоящее значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהֻלָּל
  choice: достойного хвалы
  rationale: Страдательное причастие от הלל употреблено как характеристика Яхве. Формулировка передаёт не только факт восхваления, но и то, что Он заслуживает хвалы.
- source_word: אֶקְרָא
  choice: я призываю
  rationale: Глагол קרא при имени Бога означает обращение к Нему, призывание Его в молитве. Несовершенный вид русского глагола естественно передаёт общее, исповедальное высказывание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом, чтобы сохранить различие, присутствующее в еврейском тексте.
- source_word: וּמִן
  choice: и ... от
  rationale: Сочетание союза и предлога связывает призывание Яхве со спасением от врагов, не делая причинную связь более явной, чем в оригинале.
- source_word: אֹיְבַי
  choice: моих врагов
  rationale: Прямое и общепонятное соответствие существительному אויב с суффиксом первого лица единственного числа.
- source_word: אִוָּשֵׁעַ
  choice: спасаюсь
  rationale: Нифаль имперфекта от ישׁע допускает настоящее обобщённое или будущее понимание. «Спасаюсь» выражает уверенность псалмопевца и сохраняет лексическую связь со спасением.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит собственное имя Бога. Передача «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Временное значение אִוָּשֵׁעַ
  choice: 'настоящее обобщённое: «спасаюсь»'
  alternative: 'будущее: «буду спасён»'
  rationale: Еврейский имперфект в поэтическом исповедальном контексте может выражать как ожидаемое будущее, так и постоянно подтверждаемый результат. Основной текст сохраняет общий характер утверждения, а сноска отмечает будущее прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Порядок слов сделан естественным для русского, при этом характеристика «достойного хвалы» сохранена как приложение к имени Яхве. Неоднозначность времени последнего глагола вынесена в сноску.
