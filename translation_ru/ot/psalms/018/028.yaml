lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для окружающей хвалы и уверенности; «ибо» естественно для сжатой поэтической речи и сохраняет причинно-пояснительную связь.
- source_word: תָּאִיר
  choice: зажигаешь
  rationale: 'Порода хифиль глагола אור передаёт причинное значение: давать свет, заставлять светить. В сочетании со «светильником» русский глагол «зажигаешь» звучит естественно и сохраняет конкретный образ.'
- source_word: נֵרִי
  choice: мой светильник
  rationale: נֵר буквально обозначает светильник; конкретная метафора сохранена без замены абстрактным словом «свет».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано транслитерацией, а не заменено титулом.
- source_word: אֱלֹהַי
  choice: мой Бог
  rationale: Прямо передаёт существительное с суффиксом первого лица и сохраняет личное исповедание псалмопевца.
- source_word: יַגִּיהַּ
  choice: озаряет
  rationale: Глагол выражает действие, при котором нечто становится светлым. «Озаряет» естественно сочетается с «тьмой» и сохраняет поэтический параллелизм, не повторяя глагол первой строки.
- source_word: חָשְׁכִּי
  choice: мою тьму
  rationale: Буквально сохранены существительное «тьма» и суффикс первого лица; образ не сводится однозначно к душевному состоянию или внешней беде.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому сохранено личное имя Бога, а не подставлен титул.
- issue: Смена грамматического лица между полустишиями
  choice: «Ты зажигаешь» — «Яхве… озаряет»
  alternative: «Ты, Яхве, мой Бог, озаряешь»
  rationale: Еврейский текст переходит от второго лица תָּאִיר к третьему лицу יַגִּיהַּ. Перевод сохраняет этот поэтический переход, не сглаживая его обращением во втором лице.
- issue: Смысл образа «моя тьма»
  choice: сохранить метафору без уточнения
  alternative: моя беда; окружающий меня мрак; моё уныние
  rationale: Контекст допускает бедствие, опасность или душевную подавленность; буквальный образ сохраняет намеренную смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Конкретные образы «светильник» и «тьма» сохранены; синтаксический переход от обращения к Богу к высказыванию о Нём намеренно не сглажен.
