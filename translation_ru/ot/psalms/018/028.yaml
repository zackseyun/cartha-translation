  text: For you light my lamp[b][a]; Yahweh my God lights up my darkness.
translation:
  language: ru
  text: Ибо Ты освещаешь мой светильник[a]; Яхве, мой Бог, освещает мою тьму[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты заставляешь мой светильник сиять».'
    reason: lexical_alternative
