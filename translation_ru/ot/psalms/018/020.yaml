base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/020.yaml
  text: Yahweh has dealt with me according to my righteousness[b][a]; according to the cleanness of my hands he has repaid me.
translation:
  language: ru
  text: Яхве воздаст мне по моей праведности[a], по чистоте моих рук отплатит мне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наградит меня по моей праведности».'
    reason: lexical_alternative
  - marker: b
    text: «Чистота рук» — образ невиновности и праведного поведения.
    reason: cultural_note
lexical_decisions:
- source_word: יִגְמְלֵנִי
  choice: воздал мне
  rationale: Глагол גמל может обозначать соответствующее поступкам воздаяние; здесь параллелизм с יָשִׁיב לִי и положительный контекст поддерживают значение благоприятного вознаграждения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: כְּצִדְקִי
  choice: по праведности моей
  rationale: Сохраняет прямое утверждение псалмопевца о собственной правоте или нравственной цельности, не сводя его ни к безгрешности, ни только к правоте в судебном деле.
- source_word: כְּבֹר יָדַי
  choice: по чистоте рук моих
  rationale: Сохраняет конкретный поэтический образ чистых рук, обозначающий невиновность и праведное поведение.
- source_word: יָשִׁיב לִי
  choice: отплатил мне
  rationale: Hiphil глагола שוב в данном сочетании выражает ответное воздаяние; «отплатил» естественно передаёт соответствие поступкам и поддерживает параллелизм.
theological_decisions:
- issue: Возможное понимание слов «праведности моей» как заявления о безгрешности или самооправдании
  choice: Сохранить прямую форму «по праведности моей».
  alternative: «по моей невиновности» или «по правоте моего дела»
  rationale: Еврейский текст прямо говорит צִדְקִי — «моя праведность». Перевод не должен устранять напряжение; в контексте это может обозначать цельность и правоту псалмопевца в рассматриваемом деле, не обязательно абсолютную безгрешность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «праведности моей» и «рук моих» сохраняет ритмический параллелизм, оставаясь понятной современному читателю.
