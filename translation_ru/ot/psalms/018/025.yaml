lexical_decisions:
- source_word: חָסִיד
  choice: верный
  rationale: Слово обозначает человека, которому свойственны преданность, благочестие и верность отношениям завета. «Верный» естественно передаёт здесь этический и relational смысл и позволяет сохранить однокоренное соответствие со сказуемым.
- source_word: תִּתְחַסָּד
  choice: Ты являешь Себя верным
  rationale: Форма хитпаэль передаёт то, каким Бог являет Себя по отношению к верному. Такая формулировка сохраняет взаимность и корневую перекличку с חָסִיד, не сводя смысл лишь к милосердию.
- source_word: גְּבַר
  choice: человек
  rationale: В данном параллелизме слово указывает на мужчину или человека, однако оттенок силы не выдвинут на первый план. Русское «человек» здесь естественно и не добавляет отсутствующего в контексте акцента на воинской силе.
- source_word: תָּמִים
  choice: непорочный
  rationale: Слово выражает цельность, безупречность и нравственную непорочность. «Непорочный» уместно в поэтическом библейском контексте и сохраняет соответствие с однокоренным глаголом.
- source_word: תִּתַּמָּם
  choice: непорочным
  rationale: Эллиптическое «являешь Себя» восстанавливается из первой строки, а повтор «непорочным» сохраняет однокоренную связь с תָּמִים и поэтическую симметрию.
theological_decisions:
- issue: Взаимное соответствие между тем, каков человек, и тем, каким Бог являет Себя ему
  choice: Передать рефлексивную формулировку «являешь Себя», сохранив поэтическую взаимность.
  alternative: «С верным Ты поступаешь верно» или «к верному Ты милостив».
  rationale: Еврейские глагольные формы описывают Бога как являющего Себя соответствующим образом, не утверждая, что Его природа меняется под влиянием человека. Перевод сохраняет богословское напряжение и не объясняет его сверх текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Местоимение «Ты» написано с прописной буквы как традиционное обращение к Богу. Во второй половине опущен повтор сказуемого ради естественного русского параллелизма; его смысл остаётся прозрачным.
