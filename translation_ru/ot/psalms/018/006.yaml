  text: בַּ/צַּר לִ֤/י אֶֽקְרָ֣א יְהוָה֮ וְ/אֶל אֱלֹהַ֪/י אֲשַׁ֫וֵּ֥עַ יִשְׁמַ֣ע מֵ/הֵיכָל֣/וֹ קוֹלִ֑/י וְ֝/שַׁוְעָתִ֗/י לְ/פָנָ֤י/ו תָּב֬וֹא בְ/אָזְנָֽי/ו־׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/006.yaml
  text: In my distress I call on Yahweh[a], and to my God I cry for help. He hears my voice from his temple[b], and my cry before him comes into his ears.
translation:
  language: ru
  text: В беде моей я взываю к Яхве и к Богу моему кричу о помощи. Он слышит[a] мой голос из Своего храма[b], и мой вопль пред Ним достигает Его ушей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Он услышит мой голос из Своего храма… и мой вопль пред Ним достигнет Его ушей». Еврейские формы глаголов допускают будущее значение.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «дворца» либо «святилища». Еврейское слово может обозначать жилище царя или место Божьего пребывания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לִי
  choice: В беде моей
  rationale: צַר обозначает беду, тесноту или тяжёлое положение; сочетание с לִי придаёт выражению личный смысл. Формулировка естественна для русской поэзии и точно передаёт исходную идиому.
- source_word: אֶקְרָא יְהוָה
  choice: я взываю к Яхве
  rationale: קרא при обращении к Богу означает призывать, взывать. Предлог «к» естественно выражает направленность обращения, подразумеваемую еврейской конструкцией.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: וְאֶל אֱלֹהַי אֲשַׁוֵּעַ
  choice: и к Богу моему кричу о помощи
  rationale: שׁוע в интенсивной породе обозначает крик с просьбой о помощи. Порядок «к Богу моему» сохраняет поэтический оттенок и параллелизм первой строки.
- source_word: יִשְׁמַע
  choice: Он слышит
  rationale: Имперфект допускает настоящее, обычное или будущее значение. Настоящее время передаёт живую непосредственность молитвенного свидетельства; будущее прочтение отмечено в сноске.
- source_word: מֵהֵיכָלוֹ
  choice: из Своего храма
  rationale: הֵיכָל может означать храм, святилище или царский дворец. В отношении Божьего обиталища «храм» — ясный и традиционно понятный русский эквивалент, без уточнения, земной он или небесный.
- source_word: קוֹלִי
  choice: мой голос
  rationale: קוֹל в контексте молитвы естественно передаётся как «голос».
- source_word: וְשַׁוְעָתִי לְפָנָיו
  choice: и мой вопль пред Ним
  rationale: שַׁוְעָה — крик о помощи; «вопль» сохраняет напряжённость и поэтический параллелизм. לְפָנָיו буквально указывает на нахождение перед Его лицом, то есть в Его присутствии.
- source_word: תָּבוֹא בְאָזְנָיו
  choice: достигает Его ушей
  rationale: Буквальный образ — крик «входит в Его уши». Русское «достигает Его ушей» сохраняет антропоморфный образ и звучит естественно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом и не вводит конфессиональной замены.
- issue: Временное значение еврейских имперфектов יִשְׁמַע и תָּבוֹא
  choice: 'настоящее время: «слышит… достигает»'
  alternative: 'будущее время: «услышит… достигнет»'
  rationale: Поэтические имперфекты допускают оба прочтения. Настоящее время подчёркивает живую уверенность молящегося, однако грамматика не исключает будущего значения, поэтому оно сохранено в сноске.
- issue: Местонахождение Бога, обозначенное словом הֵיכָל
  choice: храм
  alternative: дворец; святилище
  rationale: Слово может обозначать как царский дворец, так и Божий храм или святилище. Перевод не уточняет, идёт ли речь о земном или небесном храме, сохраняя образную открытость текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Взываю», «вопль» и «пред Ним» сохраняют достоинство псалма, оставаясь понятными современному читателю. Заглавные буквы в местоимениях, относящихся к Богу, применены последовательно в рамках русского благоговейного издательского регистра.
