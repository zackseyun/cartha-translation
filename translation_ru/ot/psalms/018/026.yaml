  yaml_path: translation/ot/psalms/018/026.yaml
  text: With the pure you show yourself pure[a], and with the crooked you show yourself twisted.
translation:
  language: ru
  text: С чистым Ты являешь Себя чистым, а с лукавым Ты действуешь извилисто.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «с кривым Ты являешь Себя извилистым» или «лукавого Ты перехитряешь». В еврейском тексте здесь поэтическая игра слов и взаимное соответствие: с нравственно искривлённым Бог действует так, что его искривлённость обращается против него. Это не означает, что Бог Сам нравственно лукав.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבָר
  choice: чистый
  rationale: Прилагательное обозначает нравственную чистоту; «чистый» естественно по-русски и позволяет сохранить корневой повтор со сказуемым.
- source_word: תִּתְבָּרָר
  choice: являешь Себя чистым
  rationale: Форма хитпаэль передаёт проявление качества в отношении к чистому человеку; перевод сохраняет рефлексивно-реляционный оттенок и еврейскую игру слов.
- source_word: עִקֵּשׁ
  choice: лукавый
  rationale: Слово описывает нравственно искривлённого, превратного человека. «Лукавый» звучит естественно и достойно, сохраняя моральную характеристику.
- source_word: תִּתְפַּתָּל
  choice: поступаешь по его лукавству
  rationale: Глагол от корня со значением извивания и уклончивости выражает ответное действие Бога, соответствующее кривизне лукавого и обращающее её против него. Такой перевод сохраняет взаимность, не приписывая Богу нравственного порока.
theological_decisions:
- issue: Антропоморфное описание ответа Бога лукавому
  choice: «с лукавым поступаешь по его лукавству»
  alternative: «с кривым являешь Себя извилистым»; «лукавого перехитряешь»
  rationale: 'Еврейская поэзия намеренно строит взаимное соответствие: Бог отвечает человеку согласно его нравственному характеру. Основной текст сохраняет напряжённую образность, а примечание поясняет, что речь не о нравственной испорченности Бога.'
translation_notes:
  register: Современный литературный русский язык с поэтическим параллелизмом. Заглавные местоимения, относящиеся к Богу, поддерживают принятый в русском библейском стиле почтительный регистр. Формулировка понятна широкому читателю и сохраняет богословское напряжение исходного образа.
