base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/021.yaml
  text: For I have kept the ways of Yahweh[b][a], and have not wickedly departed from my God.
translation:
  language: ru
  text: Ведь я хранил пути Яхве и не отступал нечестиво от моего Бога.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и не поступал нечестиво, удаляясь от моего Бога». Еврейский глагол буквально означает «поступать нечестиво», а следующая предложная конструкция выражает удаление от Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего утверждения; «ведь» естественно передаёт пояснительно-аргументативную связь.
- source_word: שָׁמַרְתִּי
  choice: я хранил
  rationale: Глагол שׁמר означает «хранить, соблюдать»; «хранил» сохраняет образность и оттенок верности установленным путям.
- source_word: דַּרְכֵי
  choice: пути
  rationale: В нравственном и заветном контексте דֶּרֶךְ обозначает предписанный образ жизни; традиционное «пути» естественно сохраняет метафору.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом.
- source_word: וְלֹא רָשַׁעְתִּי מֵאֱלֹהָי
  choice: и не отступал нечестиво от моего Бога
  rationale: Форма רָשַׁעְתִּי выражает нечестивое действие, а מִן — удаление «от» Бога. Формулировка сохраняет обе составляющие и не сводит фразу ни только к общему нечестию, ни только к отступлению.
theological_decisions:
- issue: Сила заявления псалмопевца о собственной праведности
  choice: Сохранено прямое утверждение о верности путям Яхве и отсутствии нечестивого отступления от Бога.
  alternative: Ослабить высказывание до общей устремлённости или истолковать его как заявление об абсолютной безгрешности.
  rationale: Еврейский текст содержит сильное заявление о верности, но конкретизирует его отношением к путям Яхве и отступлению от Бога. Перевод сохраняет это напряжение без догматического расширения или смягчения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Хранил пути» сохраняет исходную метафору; «не отступал нечестиво» намеренно удерживает семантическую напряжённость еврейской конструкции.
