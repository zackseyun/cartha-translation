    text: 'Или: «будет служить мне»; древнееврейская форма допускает здесь будущее значение.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: תְּפַלְּטֵנִי
  choice: Ты избавляешь меня
  rationale: Пиэль глагола פלט выражает активное избавление. «Избавляешь» естественно для современной русской библейской поэзии и сохраняет личное спасительное действие Бога.
- source_word: מֵרִיבֵי עָם
  choice: от распрей народа
  rationale: רִיב обозначает спор, тяжбу, распрю или вражду; множественное «распри» передаёт широкий конфликтный смысл. עָם оставлено как собирательное единственное «народ».
- source_word: תְּשִׂימֵנִי לְרֹאשׁ גּוֹיִם
  choice: ставишь меня во главе народов
  rationale: שׂים означает «ставить, помещать», а רֹאשׁ — буквально «голова», метафорически верховный руководитель. Русское «во главе» сохраняет образ и естественно выражает власть над множеством народов.
- source_word: עַם לֹא יָדַעְתִּי
  choice: народ, которого я не знал
  rationale: Неопределённое עַם передано без указательного уточнения; перфект יָדַעְתִּי естественно передаётся прошедшим временем и обозначает отсутствие прежнего знакомства или отношений.
- source_word: יַעַבְדוּנִי
  choice: служит мне
  rationale: עבד означает «служить». Имперфект допускает настоящее, характерное или будущее действие; настоящее время хорошо соответствует поэтическому описанию достигнутого царского господства, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Значение גּוֹיִם и עַם в царском псалме
  choice: Политико-коллективные «народы» и «народ» без позднейших этно-религиозных уточнений
  alternative: «Язычники» для גּוֹיִם
  rationale: Контекст говорит о царской власти над внешними народами. «Народы» прямо передаёт древнееврейский текст и не привносит позднейшего противопоставления иудеев и язычников.
- issue: Временное значение имперфекта יַעַבְדוּנִי
  choice: Настоящее «служит мне»
  alternative: Будущее «будет служить мне»
  rationale: Имперфект может описывать продолжающееся, характерное или предстоящее подчинение. Основной текст использует естественное настоящее, не исключая будущего оттенка, который указан в сноске.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Синтаксис сделан плавным, но параллелизм трёх частей и политическая образность исходного текста сохранены.
