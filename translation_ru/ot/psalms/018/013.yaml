  terminology: '«Яхве», «Всевышний», «град» и «огненные угли» удачны. Сноску к голосу следует согласовать с исправленным текстом и не представлять «возвысил голос» как равнозначную лексическую альтернативу: это уже более интерпретирующая передача.'
