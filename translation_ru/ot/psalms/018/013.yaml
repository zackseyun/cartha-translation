base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/013.yaml
  text: Yahweh thundered in the heavens[b][a], and the Most High gave his voice—hailstones and coals of fire.
translation:
  language: ru
  text: 'Яхве возгремел на небесах,

    и Всевышний подал свой голос[a] —

    град[b] и огненные угли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дал свой голос»; или: «издал голос».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «градины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְעֵם
  choice: возгремел
  rationale: Глагол רעם в контексте явления Бога в буре означает громовой грохот. «Возгремел» естественно передаёт действие и сохраняет возвышенный поэтический строй.
- source_word: בַּשָּׁמַיִם
  choice: на небесах
  rationale: Форма שׁמים и поэтический контекст поддерживают традиционное и понятное «на небесах», а не более прозаическое «в небе».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, стоящее в еврейском тексте, без замены титулом «Господь».
- source_word: וְעֶלְיוֹן
  choice: и Всевышний
  rationale: «Всевышний» — устоявшаяся и точная передача божественного титула עֶלְיוֹן.
- source_word: יִתֵּן קֹלוֹ
  choice: дал услышать Свой голос
  rationale: Еврейское выражение буквально означает «дал Свой голос». Выбранная формулировка ясно передаёт, что голос прозвучал, и сохраняет параллель с громом; буквальный оборот отмечен в сноске.
- source_word: בָּרָד
  choice: град
  rationale: Единственное число употреблено собирательно; русское «град» непосредственно и естественно передаёт буревую образность.
- source_word: וְגַחֲלֵי אֵשׁ
  choice: и огненные угли
  rationale: Формулировка сохраняет конкретный поэтический образ, не отождествляя его без текстового основания исключительно с молниями или иной стихией.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Синтаксическая связь слов «град и огненные угли» с предыдущей строкой
  choice: Сохранено бессоюзное присоединение после тире без добавления глагола
  alternative: Добавить подразумеваемое «послал» или оформить отдельное безглагольное предложение
  rationale: В еврейском тексте при этих образах нет отдельного личного глагола. Тире сохраняет резкий поэтический переход и не устраняет возможную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух строк и резкое присоединение образов бури сохранены; архаизмы и добавленные поясняющие глаголы не использованы.
