lexical_decisions:
- source_word: הָאֵל
  choice: Бог
  rationale: Определённая форма и начальная позиция выделяют Бога как тему высказывания; в русском это естественно передаётся порядком слов и конструкцией с тире без тяжеловесного «что до Бога».
- source_word: תָּמִים דַּרְכּוֹ
  choice: непорочен путь Его
  rationale: תָּמִים обозначает цельность и отсутствие изъяна. «Непорочен» сохраняет нравственный оттенок и поэтическое достоинство, а «путь» передаёт образ Божьего образа действий.
- source_word: אִמְרַת יְהוָה
  choice: слово Яхве
  rationale: אִמְרָה — произнесённое слово или изречение; יְהוָה передано личным именем «Яхве», а не заменено титулом.
- source_word: צְרוּפָה
  choice: очищено огнём
  rationale: Форма от צרף вызывает образ металла, очищаемого плавкой. Такое выражение естественно по-русски и сохраняет метафору испытанной чистоты.
- source_word: מָגֵן הוּא
  choice: Он — щит
  rationale: Сохранена конкретная защитная метафора еврейского текста и именное предложение.
- source_word: הַחֹסִים בּוֹ
  choice: кто ищет в Нём прибежища
  rationale: חסה буквально описывает поиск убежища или защиты; перевод сохраняет пространственно-защитный образ, не сводя его только к абстрактному доверию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как личное имя и не подменяет титулом.
- issue: Значение תָּמִים применительно к Божьему пути
  choice: непорочен
  alternative: совершенен; без изъяна
  rationale: «Непорочен» выражает отсутствие недостатка и нравственную безупречность, не устраняя смысловую широту понятия цельности.
- issue: Образ חסה
  choice: ищет прибежища
  alternative: уповает; доверяет
  rationale: Доверие подразумевается, но исходный глагол прежде всего сохраняет образ человека, укрывающегося у Бога как у защитника.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Инверсия «непорочен путь Его» и конструкции с тире поддерживают поэтический параллелизм, оставаясь понятными современному читателю.
