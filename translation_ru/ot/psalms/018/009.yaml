  yaml_path: translation/ot/psalms/018/009.yaml
  text: He bent the heavens and came down[a]; thick darkness was under his feet.
translation:
  language: ru
  text: Он наклонил небеса и сошёл; густой мрак[a] был под Его ногами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тёмное облако»; или: «плотная тьма» — вместо «густой мрак».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: наклонил
  rationale: 'Глагол נטה означает «наклонять», «простирать». С небесами в роли дополнения «наклонил» сохраняет зримый образ: Бог склоняет небеса, сходя вниз.'
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Поэтическое «небеса» передаёт обычную древнееврейскую форму и сохраняет возвышенный, космический масштаб теофании.
- source_word: וַיֵּרַד
  choice: сошёл
  rationale: Естественная и ёмкая передача движения сверху вниз; в современном русском также уместна для описания явления Бога.
- source_word: וַעֲרָפֶל
  choice: густой мрак
  rationale: עֲרָפֶל обозначает плотную тьму, мглу или тёмное облако, нередко сопровождающее богоявление. «Густой мрак» сохраняет плотность образа, не уточняя без необходимости, что речь именно об облаке.
- source_word: תַּחַת
  choice: под
  rationale: Прямая пространственная передача предлога.
- source_word: רַגְלָיו
  choice: Его ногами
  rationale: Буквально «его ноги»; конкретный антропоморфный образ сохранён без истолковывающей замены.
theological_decisions:
- issue: Антропоморфный образ богоявления
  choice: Сохранить конкретные образы Бога, наклоняющего небеса, сходящего и имеющего мрак под ногами.
  alternative: Смягчить образность, пересказав стих как общее описание Божьего вмешательства.
  rationale: Поэтическая антропоморфность принадлежит самому тексту; перевод не должен устранять её или сводить к отвлечённому объяснению.
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим звучанием. «Наклонил небеса» сохраняет необычную конкретность древнееврейского образа; прописная буква в местоимении «Его» поддерживает принятый в русском библейском письме благоговейный регистр.
