source:
  edition: WLC
  text: יְקַדְּמ֥וּ/נִי בְ/יוֹם אֵידִ֑/י וַֽ/יְהִי יְהוָ֖ה לְ/מִשְׁעָ֣ן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/018.yaml
  text: They confronted me in the day of my calamity[a], but Yahweh was my support.
translation:
  language: ru
  text: Они встретили меня в день моего бедствия[a], но Яхве был мне опорой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они вышли мне навстречу»; возможно: «Они выступили против меня».'
    reason: Лексема קדם в Piel обозначает встречу или выход навстречу; в данном враждебном контексте возможен оттенок противостояния, но сам глагол не уточняет способ враждебного действия.
lexical_decisions:
- source_word: יְקַדְּמוּנִי
  choice: Они преградили мне путь
  rationale: Форма Piel от קדם с суффиксом 1-го лица буквально передаёт выход навстречу или появление перед кем-либо. В данном враждебном контексте выражение «преградили мне путь» естественно передаёт противостояние, не уточняя его как прямое нападение.
- source_word: בְיוֹם אֵידִי
  choice: в день моего бедствия
  rationale: Оборот сохраняет временную конструкцию оригинала; אֵיד обозначает бедствие, несчастье или гибельную пору. «Бедствие» соответствует поэтическому регистру и не сводит смысл лишь к душевной скорби.
- source_word: וַיְהִי
  choice: но ... стал
  rationale: Глагол היה может означать «был» или «стал». Здесь повествовательная связка вводит смысловой контраст с первым полустишием, поэтому естественно русское «но ... стал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: לְמִשְׁעָן לִי
  choice: мне опорой
  rationale: מִשְׁעָן — то, на что опираются; в метафорическом употреблении «опора» ясно выражает поддерживающую помощь. לִי естественно передано дательным «мне».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит личное имя יְהוָה. «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Состояние или наступление роли опоры в וַיְהִי
  choice: стал мне опорой
  alternative: был моей опорой
  rationale: «Стал» допустимо передаёт היה в развитии повествования, тогда как «был» подчёркивало бы состояние. Контекст допускает оба оттенка; основной текст сохраняет динамику избавления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм и контраст двух полустиший сохранены; архаизмы и чрезмерно конкретная военная образность не вводятся.
