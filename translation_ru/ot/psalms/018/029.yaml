  text: כִּֽי בְ֭/ךָ אָרֻ֣ץ גְּד֑וּד וּ֝/בֵֽ/אלֹהַ֗/י אֲדַלֶּג שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/029.yaml
  text: For by you I can run against a troop[b][a], and by my God I can leap over a wall.
translation:
  language: ru
  text: Ибо с Тобой я устремляюсь на отряд[a], и с моим Богом перепрыгиваю стену[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с Тобой я бегу против набегового отряда».'
    reason: Лексема גדוד может обозначать отряд, в том числе набеговый, а רוץ буквально означает «бежать».
  - marker: b
    text: 'Или: «с моим Богом перескакиваю через крепостную стену».'
    reason: В военном контексте שׁוּר может уточнённо пониматься как оборонительная или крепостная стена.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к окружающему свидетельству хвалы; «ибо» передаёт эту связь в достойном поэтическом регистре.
- source_word: בְךָ
  choice: с Тобой
  rationale: Предлог ב может обозначать средство, содействие или сопутствие. «С Тобой» естественно по-русски выражает действие благодаря Божьей силе, не устраняя возможный оттенок совместности.
- source_word: אָרֻץ
  choice: я устремляюсь на
  rationale: Форма от רוץ буквально связана с бегом; в военном контексте речь идёт о стремительном нападении. Настоящее время сохраняет непосредственность еврейской поэзии без добавления модального «могу», которого нет в форме глагола.
- source_word: גְּדוּד
  choice: отряд
  rationale: גדוד обозначает вооружённый отряд или набеговую группу. «Отряд» ясно передаёт военный образ, не преувеличивая численность до армии.
- source_word: וּבֵאלֹהַי
  choice: и с моим Богом
  rationale: Повтор предлога поддерживает параллелизм первой строки, а «мой Бог» сохраняет личный характер исповедания.
- source_word: אֲדַלֶּג
  choice: перепрыгиваю
  rationale: Глагол דלג означает прыгать или перескакивать. «Перепрыгиваю» естественно передаёт преодоление преграды; добавлять «могу» грамматически необязательно.
- source_word: שׁוּר
  choice: стену
  rationale: שׁוּר означает стену, в данном контексте, вероятно, оборонительную. Основной текст сохраняет широкое и понятное значение, а военный оттенок указан в сноске.
theological_decisions:
- issue: Характер военной образности
  choice: Сохранить конкретные образы нападения на вооружённый отряд и преодоления стены как свидетельство о дарованной Богом силе.
  alternative: Обобщить стих как преодоление жизненных препятствий.
  rationale: Еврейский текст употребляет явно военные слова גדוד и שׁוּר. Перевод не спиритуализирует историко-поэтическую картину и не ограничивает возможное последующее применение.
- issue: Способ Божьего содействия
  choice: Передать ב формой «с Тобой / с моим Богом», сохраняя оттенки содействия и совместности.
  alternative: «Благодаря Тебе / благодаря моему Богу» или «Тобою / моим Богом».
  rationale: Предлог допускает инструментальное значение, но русский оборот «с Тобой» лучше сохраняет подлинную смысловую ёмкость и параллелизм, не формулируя более узкого богословского тезиса.
translation_notes:
  register: Современный литературный русский с лаконичным, возвышенным поэтическим звучанием. Синтаксический параллелизм еврейской строки сохранён. Прописная буква в «Тобой» следует принятому русскому благоговейному употреблению при обращении к Богу; «Богом» пишется с прописной как обозначение Бога Израиля.
