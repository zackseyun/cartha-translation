lexical_decisions:
- source_word: חֶבְלֵי
  choice: узы
  rationale: Слово обозначает верёвки или путы. «Узы» сохраняет поэтический образ связывания и угрозы, не истолковывая его как родовые муки.
- source_word: שְׁאוֹל
  choice: шеола
  rationale: Транслитерация сохраняет широкий смысл древнееврейского понятия и не сужает его до могилы или определённого учения о посмертной участи.
- source_word: סְבָבוּנִי
  choice: окружили меня
  rationale: Прямая и естественная передача значения «окружать, обступать».
- source_word: קִדְּמוּנִי
  choice: встали у меня на пути
  rationale: В данном угрожающем контексте естественно передаёт образ ловушек, которые встретили человека впереди или преградили ему путь, не усиливая смысл до «настигли».
- source_word: מוֹקְשֵׁי
  choice: сети
  rationale: Слово обозначает ловушки или силки; «сети» звучит естественно в русской библейской поэзии и сохраняет образ западни.
- source_word: מָוֶת
  choice: смерти
  rationale: Обычный эквивалент, сохраняющий олицетворённую угрозу смерти.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация не сводит многозначное древнееврейское понятие к одному толкованию и сохраняет его отличие от «смерти» в поэтическом параллелизме.
- issue: Степень истолкования קִדְּמוּנִי
  choice: встали у меня на пути
  alternative: встретили меня; предстали передо мной
  rationale: Выбранная формулировка выражает враждебный контекст ловушек, но не вводит отсутствующей в исходном тексте идеи окончательного захвата.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. «Шеол» сохранён как библейский термин; синтаксис краткий и параллельный. Маркер сноски поставлен непосредственно после той части строки, к которой относится вариант перевода.
