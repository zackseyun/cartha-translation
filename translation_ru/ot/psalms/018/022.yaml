    text: 'Или: «и я не отступал от Его постановлений». Еврейский глагол допускает понимание как удаления постановлений от себя, так и отступления от них; основной текст передаёт более прямое переходное значение формы Hiphil с выражением «от себя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-обосновывающую функцию союза и естественно связывает стих с предыдущим утверждением.
- source_word: כָל מִשְׁפָּטָיו
  choice: все Его установления
  rationale: מִשְׁפָּט во множественном числе здесь обозначает Божьи нормативные решения и установления; «установления» звучит естественно в современном русском и сохраняет правовой оттенок.
- source_word: לְנֶגְדִּי
  choice: у меня перед глазами
  rationale: Сохраняет пространственную метафору того, что постоянно находится перед человеком и принимается им во внимание, не добавляя прямо отсутствующего в тексте наречия «всегда».
- source_word: וְחֻקֹּתָיו
  choice: и Его постановлений
  rationale: חֻקּוֹת — закреплённые предписания или постановления; выбор отличает термин от מִשְׁפָּטָיו, не преувеличивая различие между ними.
- source_word: לֹא אָסִיר מֶנִּי
  choice: я от себя не удалял
  rationale: Передаёт переходное значение породы Hiphil глагола סור и явно сохраняет מֶנִּי — «от меня/от себя».
theological_decisions:
- issue: Характер высказывания псалмопевца о своей верности
  choice: Сохранено прямое утверждение без поясняющего смягчения или усиления
  alternative: Истолковать слова как заявление о безгрешности либо добавить ограничение вроде «намеренно»
  rationale: Сам стих утверждает, что Божьи установления оставались перед говорящим и не были им отвергнуты; он не определяет здесь исчерпывающе меру человеческой безгрешности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Местоимение «Его» написано с прописной буквы по принятой русской библейской традиции; синтаксис остаётся ясным для обычного читателя.
