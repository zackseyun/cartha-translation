source:
  edition: WLC
  text: יְהוָ֤ה סַֽלְעִ֥/י וּ/מְצוּדָתִ֗/י וּ/מְפַ֫לְטִ֥/י אֵלִ֣/י צ֭וּרִ/י אֶֽחֱסֶה בּ֑/וֹ מָֽגִנִּ֥/י וְ/קֶֽרֶן יִ֝שְׁעִ֗/י מִשְׂגַּבִּֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/002.yaml
  text: Yahweh is my crag and my fortress and my deliverer[a], my God, my rock, in whom I take refuge, my shield and the horn of my salvation[c][b], my stronghold.
translation:
  language: ru
  text: Яхве — мой утёс[a], моя крепость и мой избавитель, мой Бог, моя скала, в Нём я укрываюсь; мой щит, рог моего спасения[b], моё неприступное убежище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте здесь и далее употреблены два близких, но разных слова: סֶלַע — «утёс» и צוּר — «скала».'
    reason: lexical_alternative
  - marker: b
    text: «Рог» — библейский образ силы и победоносной спасительной мощи.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое именование Бога в еврейском тексте, не заменяя его титулом.
- source_word: סַלְעִי
  choice: мой утёс
  rationale: Сֶלַע обозначает скалистый утёс или скалу; «утёс» сохраняет образ природной защиты и отличает слово от следующего צוּרִי.
- source_word: מְצוּדָתִי
  choice: моя крепость
  rationale: Слово обозначает укреплённое, защищённое место; «крепость» естественно передаёт военный образ.
- source_word: מְפַלְטִי
  choice: мой избавитель
  rationale: Причастная форма называет того, кто даёт спастись или вырваться из опасности; «избавитель» кратко и точно передаёт смысл.
- source_word: אֵלִי
  choice: мой Бог
  rationale: В данном контексте אֵל служит обычным обозначением Бога с суффиксом первого лица.
- source_word: צוּרִי
  choice: моя скала
  rationale: צוּר — образ прочной, надёжной скалы; отдельное соответствие сохраняет различие между двумя близкими еврейскими словами.
- source_word: אֶחֱסֶה בּוֹ
  choice: в Нём я укрываюсь
  rationale: Глагол חסה означает искать или находить убежище; буквальный пространственный образ сохранён без сведения смысла к общему «уповаю».
- source_word: מָגִנִּי
  choice: мой щит
  rationale: Прямая и понятная передача военного образа защиты.
- source_word: קֶרֶן יִשְׁעִי
  choice: рог моего спасения
  rationale: Сохранён библейский образ рога как силы и победоносной мощи, а יֵשַׁע передано словом «спасение».
- source_word: מִשְׂגַּבִּי
  choice: моё неприступное убежище
  rationale: Существительное обозначает возвышенное и недоступное безопасное место; перевод передаёт защищённость и не повторяет уже употреблённое слово «крепость».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация сохраняет это отличие от титула.
- issue: Различение образов סלע, צור, מצודה и משגב
  choice: утёс, скала, крепость, неприступное убежище
  alternative: свести несколько образов к повторяющимся словам «скала» и «крепость»
  rationale: Еврейская строка накапливает близкие, но не тождественные образы защиты; их различение сохраняет поэтическую насыщенность без добавления богословских выводов.
- issue: Сохранение метафоры קֶרֶן יִשְׁעִי
  choice: рог моего спасения
  alternative: моя спасительная сила
  rationale: Прямая метафора выражает силу и победоносное избавление; её можно сохранить в тексте и кратко пояснить в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Синтаксическое нагромождение защитных образов сохранено; архаизмы по возможности исключены. Местоимение «Нём» написано с прописной буквы по принятой русской благоговейной норме.
