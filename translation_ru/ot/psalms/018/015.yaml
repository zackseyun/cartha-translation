  text: Then the channels of the waters were seen[a], and the foundations of the world were laid bare, at your rebuke, O Yahweh[c][b], at the blast of the breath of your nostrils.
translation:
  language: ru
  text: 'Тогда стали видны русла вод[a],

    и обнажились основания мира[b]

    от Твоего окрика, Яхве,

    от порыва дыхания Твоих ноздрей[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «протоки вод»; возможно также: «водные русла».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «основания земли».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «от дыхания духа (или ветра) Твоих ноздрей» — яркий образ сокрушительной силы Божьего дыхания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָאוּ
  choice: стали видны
  rationale: Передаёт значение нифаля от ראה — не просто действие наблюдателя, а появление скрытого прежде перед глазами; по-русски естественнее буквального «были увидены».
- source_word: אֲפִיקֵי מַיִם
  choice: русла вод
  rationale: אֲפִיקִים обозначает русла, протоки или водотоки. «Русла вод» сохраняет обобщённый поэтический образ и не заменяет множественное מַיִם словом «море».
- source_word: וַיִּגָּלוּ
  choice: обнажились
  rationale: Нифаль от גלה здесь означает, что прежде скрытое оказалось открытым; «обнажились» хорошо передаёт силу космического образа.
- source_word: מוֹסְדוֹת תֵּבֵל
  choice: основания мира
  rationale: מוֹסְדוֹת — «основания, устои», а תֵּבֵל — устроенный или обитаемый мир. Выражение «основания мира» близко к еврейскому и естественно в русской поэзии.
- source_word: מִגַּעֲרָתְךָ
  choice: от Твоего грозного окрика
  rationale: גְּעָרָה может означать властный окрик, обличение или угрозу. В сцене богоявления «грозный окрик» передаёт как речевой образ, так и устрашающую силу, не сводя его к отвлечённому «порицанию».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя, а не заменено титулом; форма «Яхве» является современной русской передачей тетраграмматона.
- source_word: מִנִּשְׁמַת רוּחַ אַפֶּךָ
  choice: от порыва дыхания Твоих ноздрей
  rationale: Сочетание נְשָׁמָה и רוּחַ создаёт усиленный образ дыхания или дуновения, а אַף буквально указывает на нос или ноздри. Перевод сохраняет яркий антропоморфный образ без замены его одним лишь понятием гнева.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Антропоморфный образ Божьего дыхания
  choice: сохранить выражение «дыхания Твоих ноздрей»
  alternative: передать как «от Твоего гнева»
  rationale: Хотя אַף может метонимически обозначать гнев, полный оборот изображает мощное дыхание Бога. Сохранение образа не устраняет поэтическую и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного поэтического параллелизма. Местоимения, обращённые к Богу, написаны с прописной буквы как стилистический выбор. Лексика остаётся понятной без устранения космической образности и антропоморфизма оригинала.
