lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: воздал
  rationale: В породе хифиль глагол שוב с לִי здесь выражает ответное воздаяние сообразно поведению. «Воздал» естественно для литературного русского и сохраняет возможность как награды, так и более общего возмещения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: כְצִדְקִי
  choice: по праведности моей
  rationale: Предлог כְּ указывает на меру или соответствие, а צֶדֶק здесь обозначает праведность или нравственную прямоту говорящего. Формулировка сохраняет прямое утверждение еврейского текста.
- source_word: כְּבֹר יָדַי
  choice: по чистоте рук моих
  rationale: בֹּר означает чистоту; сочетание с «руками» является конкретным образом невиновного и праведного поведения. Образ сохранён, а не заменён толкованием.
- source_word: לְנֶגֶד עֵינָיו
  choice: пред очами Его
  rationale: Буквально выражение означает «перед его глазами». Выбранная литературная формулировка сохраняет антропоморфный образ и смысл Божьей оценки.
theological_decisions:
- issue: Следует ли смягчать утверждение псалмопевца о собственной праведности
  choice: Сохранено прямое утверждение о воздаянии по его праведности и чистоте рук
  alternative: Передать как верность завету, относительную невиновность или добропорядочность без слова «праведность»
  rationale: Еврейский текст прямо связывает воздаяние Яхве с «моей праведностью» и «чистотой моих рук». Перевод не должен устранять возникающее богословское напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмопевческим звучанием. Инверсия «по праведности моей» и форма «пред очами Его» сохраняют поэтический параллелизм, оставаясь понятными современному читателю.
