source:
  edition: WLC
  text: וַ/תִּתֶּן לִ/י֮ מָגֵ֪ן יִ֫שְׁעֶ֥/ךָ וִֽ/ימִינְ/ךָ֥ תִסְעָדֵ֑/נִי וְֽ/עַנְוַתְ/ךָ֥ תַרְבֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/035.yaml
  text: You gave me the shield of your salvation[a], and your right hand supported me, and your humility made me great.
translation:
  language: ru
  text: 'Ты дал мне щит Твоего спасения,

    Твоя правая рука поддержала меня,

    и Твоё смирение[a] сделало меня великим.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоя кротость сделала меня великим». Еврейское слово может означать смирение, кротость или мягкость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: Ты дал
  rationale: Форма Qal wayyiqtol от נתן передаёт завершённое действие в поэтическом повествовании благодарения; простой прошедший вид естественен по-русски.
- source_word: מָגֵן
  choice: щит
  rationale: Обычное обозначение защитного щита; сохраняет ясный библейский образ без архаизации.
- source_word: יִשְׁעֶךָ
  choice: Твоего спасения
  rationale: Передаёт конструкцию принадлежности в выражении «щит Твоего спасения» и сохраняет более широкий смысл, чем только избавление от непосредственной опасности.
- source_word: וִימִינְךָ
  choice: Твоя правая рука
  rationale: Буквально сохраняет образ силы и деятельной помощи Бога.
- source_word: תִסְעָדֵנִי
  choice: поддержала меня
  rationale: Глагол סעד означает поддерживать или укреплять; прошедшее время согласуется с благодарственным рассказом, а женский род — с «рука».
- source_word: וְעַנְוַתְךָ
  choice: Твоё смирение
  rationale: Сохраняет необычную и богословски напряжённую характеристику Бога, не подменяя её более сглаженным толкованием; возможный смысл «кротость» вынесен в сноску.
- source_word: תַרְבֵּנִי
  choice: сделало меня великим
  rationale: Hiphil от רבה буквально выражает причинное значение «сделать великим, умножить»; выбранная формулировка прозрачна и сохраняет прямоту исходного образа.
theological_decisions:
- issue: Отнесение וְעַנְוַתְךָ к Богу
  choice: Твоё смирение
  alternative: Твоя кротость
  rationale: Еврейское слово допускает значения смирения, кротости и мягкости. Основной текст сохраняет поразительную мысль о Божьем смирении и не снимает присущее оригиналу богословское напряжение; допустимое толкование указано в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранены параллелизм, обращение к Богу с прописной буквы и буквальный образ правой руки; избегнуты церковнославянизмы и конфессионально обусловленные уточнения.
