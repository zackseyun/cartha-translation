  text: Ибо Ты спасаешь страдающий народ[a], а надменные глаза[b] Ты смиряешь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедный народ» или «смиренный народ». Еврейское слово может обозначать бедность, страдание или униженное положение.'
