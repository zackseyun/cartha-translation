lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт объяснительную силу союза и естественно связывает стих с предшествующим контекстом.
- source_word: אַתָּה
  choice: Ты
  rationale: Личное местоимение относится к Богу; его явное употребление сохраняет выраженное в еврейском тексте подлежащее.
- source_word: עַם עָנִי
  choice: народ угнетённый
  rationale: עָנִי может обозначать бедного, страждущего, угнетённого или смиренного. «Угнетённый» сохраняет идею бедственного, униженного положения, не сводя смысл только к материальной бедности или внутреннему смирению.
- source_word: תוֹשִׁיעַ
  choice: спасаешь
  rationale: Форма от ישׁע означает спасать или избавлять; «спасаешь» кратко и естественно передаёт широкий смысл Божьего избавления.
- source_word: וְעֵינַיִם רָמוֹת
  choice: а надменные глаза
  rationale: Буквально «и высокие глаза». Союз передан противительным «а» по смыслу поэтического противопоставления; образ глаз сохранён, а רָמוֹת выражено словом «надменные».
- source_word: תַּשְׁפִּיל
  choice: унижаешь
  rationale: Каузативная форма от שׁפל означает «делать низким, низлагать, смирять». «Унижаешь» сохраняет пространственную антитезу между «высокими» глазами и их понижением.
theological_decisions:
- issue: Значение עָנִי
  choice: угнетённый
  alternative: бедный; страждущий; смиренный
  rationale: Выбор сохраняет тему избавления людей, находящихся в бедственном и униженном положении, но сноска оставляет открытым широкий смысл еврейского слова.
- issue: Образ עֵינַיִם רָמוֹת
  choice: надменные глаза
  alternative: гордых; высокомерные взгляды
  rationale: Сохранён телесный образ оригинала и его нравственный смысл, без замены метонимии прямым обозначением людей.
translation_notes:
  register: 'Современный литературный русский язык с поэтической краткостью. Заглавное «Ты» употреблено как традиционное уважительное обращение к Богу. Порядок слов слегка маркирован для сохранения псалмового параллелизма: спасение угнетённых противопоставлено унижению надменных.'
