  text: For who is God besides Yahweh? And who is a rock except our God?[a]
translation:
  language: ru
  text: Ибо кто Бог, кроме Яхве? И кто скала, кроме нашего Бога?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помимо Яхве» в первой строке и «помимо нашего Бога» во второй; оба еврейских выражения передают исключительность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Вводит основание предшествующей хвалы; «ибо» сохраняет связующую и пояснительную силу еврейской частицы и соответствует возвышенному поэтическому регистру.
- source_word: מִי
  choice: кто
  rationale: Передаёт вопросительное местоимение в риторическом вопросе прямо и естественно.
- source_word: אֱלוֹהַּ
  choice: Бог
  rationale: Единственное число здесь обозначает истинного Бога в исключительном противопоставлении; прописная буква отражает референт, не добавляя нового смысла.
- source_word: מִבַּלְעֲדֵי
  choice: кроме
  rationale: 'Выражает исключительность: нет Бога помимо Яхве. «Кроме» кратко и естественно звучит в русском риторическом вопросе.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וּמִי
  choice: И кто
  rationale: Союз сохраняет тесную связь и поэтический параллелизм второго риторического вопроса с первым.
- source_word: צוּר
  choice: скала
  rationale: Сохраняет конкретную библейскую метафору прочности, устойчивости и защиты; «скала» в современном русском яснее передаёт образ, чем возможное «твердыня».
- source_word: זוּלָתִי
  choice: кроме
  rationale: Второе выражение исключительности параллельно מִבַּלְעֲדֵי; повтор «кроме» подчёркивает строгий синтаксический и смысловой параллелизм.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Сохраняет местоименный суффикс и его общинно-заветный оттенок.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Передача метафоры צוּר применительно к Богу
  choice: скала
  alternative: твердыня; Скала
  rationale: Строчная буква соответствует функции именной части сказуемого, а не явно оформленного титула; буквальная метафора сохраняет образы устойчивости, силы и защиты.
- issue: Параллельные выражения исключительности
  choice: кроме … кроме
  alternative: помимо … кроме; кроме … помимо
  rationale: Оба еврейских оборота выражают исключительность. Одинаковая русская передача сохраняет параллелизм, а примечание отмечает возможные лексические варианты без искусственного смыслового различения.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой поэзии. Сохранены два параллельных риторических вопроса, личное имя Яхве и метафора скалы; синтаксис прост и понятен обычному читателю.
