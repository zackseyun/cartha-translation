  text: 'Я растёр их, как пыль на ветру;

    как грязь на улицах, я вылил их.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶשְׁחָקֵם
  choice: Я растёр их
  rationale: Глагол שׁחק в данной форме передаёт размалывание или растирание до мелких частиц; «растёр» естественно сочетается с образом праха.
- source_word: כְּעָפָר
  choice: в прах
  rationale: עָפָר означает пыль, прах или рыхлую землю. В сочетании с «растёр» русский оборот «в прах» ясно передаёт результат измельчения.
- source_word: עַל־פְּנֵי רוּחַ
  choice: пред ветром
  rationale: Буквально «на лице ветра»; «пред ветром» сохраняет образ праха, подхваченного и развеваемого ветром, не утяжеляя строку буквализмом.
- source_word: כְּטִיט חוּצוֹת
  choice: как уличную грязь
  rationale: טִיט — грязь, жижа; חוּצוֹת — улицы или открытые места. «Уличная грязь» кратко и естественно сохраняет уничижительный образ.
- source_word: אֲרִיקֵם
  choice: я высыпал их
  rationale: Каузативная форма ריק имеет значение «опорожнять, выливать, высыпать». «Высыпал» согласуется с множественным объектом и образом измельчённого праха, хотя соседнее сравнение с грязью оставляет образ намеренно напряжённым.
