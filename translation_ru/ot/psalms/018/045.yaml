lexical_decisions:
- source_word: בְּנֵי נֵכָר
  choice: сыны чужеземцев
  rationale: Сохраняет явную древнееврейскую конструкцию «сыны чужеземца/чужбины» и её поэтический образ; современное «сыновья» здесь звучало бы слишком буквально-бытово.
- source_word: יִבֹּלוּ
  choice: увядают
  rationale: Глагол נבל обычно означает «увядать, чахнуть»; этот образ передаёт утрату силы побеждёнными врагами, не перенося на данный глагол значение страха.
- source_word: וְיַחְרְגוּ
  choice: дрожа, выходят
  rationale: Редкий и не вполне ясный глагол חרג, вероятно, описывает испуганный или судорожный выход; неоднозначность отмечена в сноске.
- source_word: מִמִּסְגְּרוֹתֵיהֶם
  choice: из своих укреплений
  rationale: Существительное обозначает ограждённые или запертые места; в военном контексте наиболее естественно «укрепления», тогда как «темницы» предполагали бы иной образ.
