  text: אֲפָפ֥וּ/נִי חֶבְלֵי מָ֑וֶת וְֽ/נַחֲלֵ֖י בְלִיַּ֣עַל יְבַֽעֲתֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/004.yaml
  text: The cords of death surrounded me[a], and the torrents of destruction terrified me.
translation:
  language: ru
  text: 'Узы смерти окружили меня,

    и потоки погибели[a] привели меня в ужас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово, переведённое как «погибель», может означать также пагубу, нечестие или ничтожность; возможно и понимание «Велиал» как имени собственного.
    reason: Сохраняет лексическую и богословскую неоднозначность בְלִיַּעַל и не навязывает его позднейшую персонификацию.
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: окружили меня
  rationale: Глагол אפף означает «окружать, обступать». Выбран естественный современный оборот, сохраняющий образ опасности со всех сторон.
- source_word: חֶבְלֵי
  choice: узы
  rationale: חבל буквально обозначает верёвку или шнур, а в поэзии может передавать также образ пут либо мук. «Узы» сохраняют конкретный образ связывающей силы и хорошо сочетаются со смертью.
- source_word: מָוֶת
  choice: смерти
  rationale: Прямое и контекстуально точное соответствие.
- source_word: נַחֲלֵי
  choice: потоки
  rationale: נחל может означать русло, ручей или бурный поток. Здесь «потоки» передают напор угрожающей водной стихии и звучат естественно в русской поэзии.
- source_word: בְלִיַּעַל
  choice: погибели
  rationale: В данном сочетании слово выражает губительную, пагубную силу; «погибель» естественно передаёт смысл разрушения, не превращая בְלִיַּעַל без достаточного основания в имя собственное.
- source_word: יְבַעֲתוּנִי
  choice: привели меня в ужас
  rationale: Глагол בעת выражает сильный испуг или внезапный ужас. Этот оборот ясно и естественно передаёт интенсивность еврейского слова.
theological_decisions:
- issue: Следует ли понимать בְלִיַּעַל как имя собственное «Велиал» или как нарицательное обозначение пагубы и гибели
  choice: 'Нарицательное значение: «погибель»'
  alternative: «Велиал»; также возможны «разрушение», «нечестие» или более буквальное «ничтожность»
  rationale: В контексте псалма речь идёт о поэтическом образе губительных сил. Текст не требует поздней персонификации Велиала, поэтому имя собственное не вводится; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллельные образы уз и бурных потоков сохранены; архаизмы и конфессионально окрашенная терминология не использованы.
