  text: חַי יְ֭הוָה וּ/בָר֣וּךְ צוּרִ֑/י וְ֝/יָר֗וּם אֱלוֹהֵ֥י יִשְׁעִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/018/046.yaml
  text: Yahweh lives[a], and blessed be my rock, and exalted be the God of my salvation.
translation:
  language: ru
  text: Жив Яхве, и благословенна Скала моя, и да будет превознесён Бог спасения моего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и превознесён Бог спасения моего».'
    reason: Еврейскую форму можно понимать не только как пожелание-прославление, но и как утверждение.
lexical_decisions:
- source_word: חַי יְהוָה
  choice: Жив Яхве
  rationale: Предикативное חַי выражает торжественное утверждение о живом Боге; инверсия «Жив Яхве» естественна для возвышенной русской поэзии и не привносит формулу клятвы «жив Яхве, что…».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление имени Бога в еврейском тексте и не заменяет его титулом.
- source_word: וּבָרוּךְ
  choice: и благословенна
  rationale: Пассивное причастие в контексте хвалы передано как торжественная аккламация; форма женского рода согласована с русским словом «Скала».
- source_word: צוּרִי
  choice: Скала моя
  rationale: Сохраняется буквальная метафора צוּר — прочной скалы и защиты; «Скала» выделена прописной буквой как метафорическое именование Бога.
- source_word: וְיָרוּם
  choice: и да будет превознесён
  rationale: Имперфект допускает волитивно-доксологическое прочтение. Оборот «да будет превознесён» естественно передаёт пожелание-прославление и поддерживает параллелизм.
- source_word: אֱלוֹהֵי יִשְׁעִי
  choice: Бог спасения моего
  rationale: Сохранена структура сопряжённого сочетания и мысль о Боге как источнике спасения; порядок слов поддерживает поэтический регистр.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно транслитерируется, а не заменяется титулом.
- issue: Смысл וְיָרוּם в контексте хвалы
  choice: волитивно-доксологическое «да будет превознесён»
  alternative: утвердительное «превознесён Бог спасения моего»
  rationale: Форма имперфекта в поэтической аккламации может выражать как пожелание, так и утверждение. Основной текст передаёт вероятную волитивную силу, а примечание сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим строем. Инверсия и повтор союза «и» сохраняют ритм и параллелизм еврейской строки; архаичные формы избегаются.
