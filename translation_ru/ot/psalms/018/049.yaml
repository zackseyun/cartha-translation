lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод или следствие из предшествующего контекста естественным современным русским выражением.
- source_word: אוֹדְךָ
  choice: я буду благодарить Тебя
  rationale: Hифиль глагола ידה в псалмах часто выражает благодарение и хвалу; «благодарить Тебя» сохраняет личную направленность действия.
- source_word: בַגּוֹיִם
  choice: среди народов
  rationale: גוים обозначает народы или нации; этот вариант сохраняет широкий международный смысл и естественно звучит в контексте Псалма.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: וּלְשִׁמְךָ
  choice: и ... имя Твоё
  rationale: В сочетании с זמר русский глагол «воспевать» непосредственно управляет винительным падежом, естественно передавая еврейскую конструкцию с ל.
- source_word: אֲזַמֵּרָה
  choice: воспевать
  rationale: Пиэль זמר означает петь или исполнять хвалу; «воспевать» кратко и достойно передаёт богослужебный оттенок.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В тексте прямо стоит Тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным псалмовым звучанием. Заглавные буквы в местоимениях, относящихся к Богу, сохраняют традиционную русскую почтительность; порядок слов слегка приподнят, без архаизмов.
