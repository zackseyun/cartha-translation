  yaml_path: translation/ot/psalms/018/044.yaml
  text: At the hearing of the ear they obey me[c][b][a]; foreigners feign obedience to me.
translation:
  language: ru
  text: Стоит им услышать — они повинуются мне; чужеземцы притворно покоряются мне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземцы лгут мне»; возможно также: «чужеземцы раболепно покоряются мне». Еврейское выражение может обозначать обман либо вынужденную, неискреннюю покорность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֵׁמַע אֹזֶן
  choice: Лишь услышат обо мне
  rationale: Еврейское выражение буквально означает «при слышании уха» и указывает на немедленную реакцию на услышанное. Русское «лишь услышат» естественно передаёт этот смысл, не сохраняя неестественную для русского языка телесную идиому.
- source_word: יִשָּׁמְעוּ לִי
  choice: повинуются мне
  rationale: Глагол שׁמע с предлогом ל здесь означает не просто физически слышать, а слушаться, повиноваться; такой смысл соответствует контексту царской победы и параллели со следующим полустишием.
- source_word: בְּנֵי נֵכָר
  choice: чужеземцы
  rationale: Буквально «сыны чужбины/чужой земли» — еврейская идиома, обозначающая иноземцев. «Чужеземцы» ясно передаёт значение и сохраняет возвышенный поэтический регистр.
- source_word: יְכַחֲשׁוּ לִי
  choice: притворно покоряются мне
  rationale: Форма piel глагола כחש может выражать ложь, обман или вынужденную, неискреннюю покорность. В контексте покорения чужеземцев эта формулировка сохраняет связь с повиновением в первом полустишии и обозначает его неискренность.
theological_decisions:
- issue: Характер покорности чужеземцев
  choice: притворно покоряются мне
  alternative: лгут мне; раболепно покоряются мне
  rationale: Источник допускает оттенки обмана и вынужденного подчинения. Основной текст передаёт вероятную неискренность, а примечание сохраняет лексическую неоднозначность, не превращая её в богословское утверждение о внутреннем состоянии всех чужеземцев.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия и буквальная идиома «при слышании уха» устранены ради естественности; параллелизм повиновения и притворной покорности сохранён.
