lexical_decisions:
- source_word: וְאֹיְבַי
  choice: моих врагов
  rationale: Обычный современный эквивалент существительного אֹיֵב с суффиксом первого лица единственного числа; сохраняет прямой смысл противостояния.
- source_word: נָתַתָּה לִּי עֹרֶף
  choice: Ты заставил … повернуться ко мне спиной
  rationale: Буквально сочетание означает «ты дал мне затылок/шею» и служит образом врагов, обращённых в бегство. Русская формулировка естественно передаёт идиому и её зримый образ; буквальная сторона пояснена в сноске.
- source_word: וּמְשַׂנְאַי
  choice: ненавидевших меня
  rationale: Передаёт субстантивированное причастие от שׂנא с суффиксом первого лица, относящееся к противникам псалмопевца.
- source_word: אַצְמִיתֵם
  choice: я истребил
  rationale: Порода hифиль глагола צמת выражает причинение гибели, уничтожение. «Истребил» сохраняет силу исходного слова и подходит возвышенному, но современному регистру псалма.
theological_decisions:
- issue: Образ победы над врагами в выражении נָתַתָּה לִּי עֹרֶף
  choice: 'Передать как обращение врагов в бегство: «заставил … повернуться ко мне спиной».'
  alternative: 'Буквально: «дал мне затылок моих врагов»; также возможно: «отдал мне врагов, обратившихся в бегство».'
  rationale: Еврейский текст изображает врагов повернувшими к победителю шею или затылок, то есть бегущими либо отданными ему на поражение. Перевод не уточняет сверх текста механизм Божьего содействия и сохраняет связь между дарованной победой и последующим истреблением врагов.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Конструкция «повернуться ко мне спиной» понятна широкому читателю; сильный глагол «истребил» соответствует военному контексту и интенсивности еврейского צמת.
