lexical_decisions:
- source_word: וַתִּגְעַשׁ
  choice: содрогнулась
  rationale: Глагол געשׁ передаёт сильное, бурное движение. «Содрогнулась» сохраняет выразительность образа и не сливается по смыслу со следующим глаголом.
- source_word: וַתִּרְעַשׁ
  choice: затряслась
  rationale: רעשׁ обычно обозначает сотрясение или землетрясение; «затряслась» естественно сочетается со словом «земля».
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте космического богоявления речь идёт о земле как части сотворённого мира, а не только об отдельной стране.
- source_word: מוֹסְדֵי הָרִים
  choice: основания гор
  rationale: Буквальный и естественный поэтический образ глубинных опор гор.
- source_word: יִרְגָּזוּ
  choice: задрожали
  rationale: רגז выражает дрожь и тревожное движение; форма согласована с множественным подлежащим «основания».
- source_word: וַיִּתְגָּעֲשׁוּ
  choice: заколебались
  rationale: Возвратная форма вновь усиливает образ бурного движения. «Заколебались» передаёт его естественно по-русски и избегает неуклюжего повтора «содрогнулись».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину описанного потрясения.
- source_word: חָרָה לוֹ
  choice: Он разгневался
  rationale: Идиома буквально описывает разгорающийся гнев. «Он разгневался» ясно передаёт её смысл в современном русском; более буквальный образ сохранён в сноске.
theological_decisions:
- issue: Антропопатическое описание Божьего гнева
  choice: потому что Он разгневался
  alternative: потому что воспылал Его гнев
  rationale: Перевод прямо сохраняет утверждение о Божьем гневе, не ослабляя его, но передаёт древнееврейскую идиому естественным современным русским языком. Буквальный огненный образ указан в сноске.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной поэтической интонацией. Последовательность близких по смыслу глаголов сохранена ради нарастающего образа земного потрясения; местоимение, относящееся к Богу, написано с прописной буквы согласно распространённой русской библейской издательской традиции.
