  text: Then the earth reeled and quaked[a], and the foundations of the mountains trembled and reeled, because he was angry.
translation:
  language: ru
  text: Тогда земля содрогнулась и затряслась, основания гор задрожали и заколебались, потому что Он разгневался[a].
  philosophy: optimal-equivalence
