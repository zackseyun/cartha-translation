  text: I was blameless before him[c][b][a], and I kept myself from my iniquity.
translation:
  language: ru
  text: Я был непорочен[a] пред Ним[b] и оберегал себя от собственного беззакония[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «целостен», «безупречен». Здесь речь идёт о нравственной цельности, а не обязательно об абсолютной безгрешности.'
    reason: lexical_alternative
  - marker: b
    text: 'Местоимение «Ним» в окружающем контексте относится к Господу; буквально также возможно: «с Ним».'
    reason: cross_reference
  - marker: c
    text: 'Или: «от собственной вины» либо «от собственного греха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Я был
  rationale: Форма Qal wayyiqtol, 1-е лицо единственного числа от היה, в данном поэтическом контексте естественно передаёт состояние в прошлом. Начальный союз в русском можно не выражать отдельно, поскольку связь частей сохраняется союзом «и».
- source_word: תָמִים
  choice: непорочен
  rationale: В нравственном контексте слово обозначает цельность и безупречность поведения, не обязательно абсолютную безгрешность. «Непорочен» сохраняет силу утверждения и соответствует возвышенному, но понятному регистру псалма.
- source_word: עִמּוֹ
  choice: пред Ним
  rationale: Буквально местоименная конструкция может означать «с ним», однако здесь она описывает нравственное положение говорящего по отношению к Богу; по-русски «пред Ним» естественнее и не заменяет местоимение явным именем Бога.
- source_word: וָאֶשְׁתַּמֵּר
  choice: оберегал себя
  rationale: 'Hitpael от שמר передаёт рефлексивную самодисциплину: говорящий сторожил, удерживал самого себя. «Оберегал себя» естественно выражает этот возвратный смысл.'
- source_word: מֵעֲוֺנִי
  choice: от собственного беззакония
  rationale: עָוֹן охватывает значения беззакония, вины и греха; предлог מן выражает удаление или удержание от чего-либо, а суффикс 1-го лица сохранён словом «собственного».
theological_decisions:
- issue: Значение «непорочен» применительно к нравственному состоянию человека
  choice: Слово выражает нравственную цельность и верность, не снимая напряжения сильного заявления псалмопевца.
  alternative: Понимать его как утверждение абсолютной безгрешности.
  rationale: תָמִים в данном контексте относится к целостности поведения говорящего перед Богом; перевод не ослабляет это заявление, но примечание предохраняет от внесения в текст более широкого догматического вывода.
- issue: Референт местоимения «Ним»
  choice: Сохранить местоимение в основном тексте и пояснить, что в контексте оно относится к Господу.
  alternative: Заменить местоимение словом «Господом».
  rationale: Еврейский текст использует местоименный суффикс, поэтому его форма сохраняется, а референт уточняется примечанием на основании ближайшего контекста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Местоимение, относящееся к Богу, написано с прописной буквы согласно распространённой русской библейской традиции. Синтаксис краток и сохраняет параллельность двух еврейских глагольных форм.
