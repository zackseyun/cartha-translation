lexical_decisions:
- source_word: וַתְּאַזְּרֵנִי
  choice: Ты наделил меня
  rationale: Глагол אזר буквально связан с препоясыванием и в данном контексте означает подготовить, снабдить необходимой силой. «Наделил меня» естественно передаёт этот смысл в современном русском; буквальный образ сохранён в сноске.
- source_word: חַיִל
  choice: силой
  rationale: Здесь חַיִל обозначает боевую силу или способность сражаться, а не войско; «силой» точно сочетается с подготовкой к битве.
- source_word: לַמִּלְחָמָה
  choice: для битвы
  rationale: В непосредственном военном контексте «для битвы» естественнее и конкретнее более широкого «для войны».
- source_word: תַּכְרִיעַ
  choice: Ты поверг
  rationale: Каузативная форма כרע означает заставить согнуться, склониться или пасть. «Поверг» ясно и образно передаёт поражение противников.
- source_word: קָמַי
  choice: восставших против меня
  rationale: Сохранён причастный образ от קום — тех, кто поднимается с враждебным намерением, — вместо обобщённого «врагов».
- source_word: תַּחְתָּי
  choice: к моим ногам
  rationale: Русская пространственная метафора естественно выражает унижение и подчинение побеждённых, находящихся «подо мной»; более формальное соответствие дано в сноске.
