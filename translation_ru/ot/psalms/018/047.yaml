  text: Бог, совершающий возмездие за меня[a] и покоряющий мне народы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дающий мне отмщения». В еврейском тексте употреблено множественное число; оно может обозначать неоднократные акты возмездия или иметь отвлечённо-усилительное значение.'
