  yaml_path: translation/ot/psalms/018/034.yaml
  text: He trains my hands for battle[a], and my arms can bend a bow of bronze.
translation:
  language: ru
  text: Он готовит мои руки к битве, и мои руки могут согнуть бронзовый лук.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «бронзовый лук сгибается моими руками». Еврейская фраза трудна и допускает пассивное понимание.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְלַמֵּד
  choice: обучает
  rationale: Причастие от למד обозначает обучение или практическую подготовку; в военном контексте «обучает» естественно передаёт подготовку к сражению.
- source_word: יָדַי
  choice: мои руки
  rationale: Сохранён конкретный образ обеих рук, подготовленных к бою.
- source_word: לַמִּלְחָמָה
  choice: битве
  rationale: מִלְחָמָה может означать войну или битву; здесь «битве» естественно сочетается с личной боевой подготовкой псалмопевца.
- source_word: וְנִחֲתָה
  choice: способны согнуть
  rationale: Трудная пассивная форма в сжатой поэтической конструкции описывает приобретённую способность справиться с тугим луком; формальная пассивная передача приведена в примечании.
- source_word: קֶשֶׁת נְחוּשָׁה
  choice: бронзовый лук
  rationale: קֶשֶׁת — лук, а נְחוּשָׁה указывает на медь или бронзу; «бронзовый» — традиционное и контекстуально уместное обозначение особо прочного оружия.
- source_word: זְרוֹעֹתָי
  choice: мои руки
  rationale: זְרוֹעוֹת обозначает руки как средство физической силы. В русском «мои руки» звучит естественнее анатомически узкого «предплечья» и сохраняет телесный образ.
theological_decisions:
- issue: Толкование трудной фразы וְנִחֲתָה קֶשֶׁת נְחוּשָׁה זְרוֹעֹתָי
  choice: 'Фраза передана как дарованная способность: «мои руки способны согнуть бронзовый лук».'
  alternative: «бронзовый лук сгибается моими руками»
  rationale: 'Выбранная формулировка естественна по-русски и согласуется с параллелизмом: Бог готовит псалмопевца к бою и даёт ему силу. Примечание сохраняет возможный более буквальный пассивный смысл и не устраняет трудность еврейского синтаксиса.'
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным поэтическим звучанием. Военная образность и параллелизм сохранены; архаизмы и конфессионально окрашенные уточнения не вводились.
