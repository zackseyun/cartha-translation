lexical_decisions:
- source_word: תַּרְחִיב
  choice: Ты даёшь простор
  rationale: Каузативная форма глагола רחב означает «делать широким, расширять». По-русски выражение «даёшь простор» естественно передаёт мысль о свободе и надёжности движения, не создавая впечатления, будто Бог буквально увеличивает длину шага.
- source_word: צַעֲדִי
  choice: моим шагам
  rationale: 'Существительное צעד с суффиксом первого лица буквально стоит в единственном числе: «мой шаг». Русское множественное число естественнее обозначает поступательное движение и сохраняет исходный образ шагов.'
- source_word: תַחְתָּי
  choice: передано в образе простора для шагов
  rationale: Буквально «подо мной». В сочетании с «делать широким» выражение описывает достаточное пространство и надёжную опору при движении; буквальное «подо мной» в основном тексте по-русски звучало бы неестественно. Форма источника отмечена в сноске.
- source_word: מָעֲדוּ
  choice: не подгибаются
  rationale: Глагол מעד обозначает скольжение, шатание или потерю устойчивости. При подлежащем «лодыжки» глагол «подгибаются» естественно передаёт телесный образ утраты опоры.
- source_word: קַרְסֻלָּי
  choice: мои лодыжки
  rationale: Слово конкретно называет лодыжки или щиколотки; этот перевод сохраняет яркую анатомическую образность еврейского текста, не обобщая её до «ног».
