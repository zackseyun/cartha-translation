base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/002.yaml
  text: Lift up your hands to the holy place and bless Yahweh[a].
translation:
  language: ru
  text: Поднимите руки к святилищу[a] и благословите Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в святости»; возможно также: «в святилище». Еврейское слово קֹדֶשׁ может означать как святость, так и святое место.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׂאוּ
  choice: Поднимите
  rationale: Повелительная форма множественного числа от נשׂא. Перевод сохраняет конкретное телесное действие и звучит естественно в современном русском языке.
- source_word: יְדֵיכֶם
  choice: руки
  rationale: Буквальная передача прямого дополнения с естественным для русского языка притяжательным значением, уже выраженным формой обращения.
- source_word: קֹדֶשׁ
  choice: к святилищу
  rationale: В храмовом контексте существительное קֹדֶשׁ естественно понимать как обозначение святого места; направительное «к» делает предполагаемое отношение ясным по-русски. Поскольку в еврейском тексте предлога нет и возможно качественное или местное понимание, неоднозначность отмечена в сноске.
- source_word: וּבָרֲכוּ
  choice: и благословите
  rationale: Сохраняется обычное богословски значимое значение ברך, когда речь обращена к Богу; «прославьте» было бы более узким толкованием.
- source_word: אֶת
  choice: не передаётся отдельно
  rationale: Показатель определённого прямого дополнения не имеет самостоятельного соответствия в русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой научной транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Значение קֹדֶשׁ в сочетании שׂאו ידיכם קדשׁ
  choice: 'направительное: «к святилищу»'
  alternative: качественное «в святости» или местное «в святилище»
  rationale: Контекст храмового служения и древнее понимание выражения поддерживают направительное прочтение, однако отсутствие предлога в еврейском тексте допускает и другие синтаксические связи. Поэтому основной текст не объявляет альтернативы невозможными, а сохраняет их в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным, но не архаичным повелительным оборотом. «Поднимите» предпочтено более церковнославянскому «возденьте», а имя «Яхве» сохранено как личное имя.
