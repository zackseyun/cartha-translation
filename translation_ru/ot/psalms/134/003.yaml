  text: יְבָרֶכְ/ךָ֣ יְ֭הוָה מִ/צִּיּ֑וֹן עֹ֝שֵׂ֗ה שָׁמַ֥יִם וָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/003.yaml
  text: May Yahweh bless you from Zion[c][b][a], maker of heaven and earth.
translation:
  language: ru
  text: Да благословит тебя Яхве с Сиона[a] — Творец неба и земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Яхве благословит тебя с Сиона». Еврейская глагольная форма допускает значение будущего, но в контексте благословения вероятнее выражает пожелание.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «сотворивший небо и землю». Еврейское причастие характеризует Яхве как Создателя всего сущего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Да благословит тебя
  rationale: Порода пиэль, имперфект с суффиксом 2-го лица мужского рода единственного числа. В заключительном благословении псалма форма естественно выражает пожелание; русская конструкция с «да» передаёт это значение ясно и торжественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
- source_word: מִצִּיּוֹן
  choice: с Сиона
  rationale: 'Предлог מִן обозначает источник: благословение исходит с Сиона. В русском языке «с Сиона» — естественная форма при названии горы.'
- source_word: עֹשֵׂה
  choice: Творец
  rationale: Причастие от עשה употреблено как приложение к имени Яхве и характеризует его как Создателя. Существительное «Творец» естественно передаёт устойчивое титульное значение, не сводя форму к однократному действию в прошлом.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: неба и земли
  rationale: Сочетание обозначает всю сотворённую реальность. Русская устойчивая пара «небо и земля» сохраняет космический охват выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Модальное значение יְבָרֶכְךָ
  choice: 'пожелание: «Да благословит тебя»'
  alternative: 'утверждение о будущем: «благословит тебя»'
  rationale: Литургический контекст заключительного благословения поддерживает оптативное значение, однако грамматическая форма допускает и понимание как простого имперфекта, что отмечено в сноске.
- issue: Характеристика Яхве словом עֹשֵׂה
  choice: 'титульное приложение: «Творец неба и земли»'
  alternative: 'относительная конструкция: «сотворивший небо и землю»'
  rationale: Еврейское причастие может обозначать того, кто совершает или совершил действие, и здесь непосредственно определяет Яхве. Титульное приложение сохраняет эту функцию без ненужного уточнения времени.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой благословения. Тире ясно оформляет приложение «Творец неба и земли» и не устраняет присущую еврейскому причастию смысловую ёмкость.
