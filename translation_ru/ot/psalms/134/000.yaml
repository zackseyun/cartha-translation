  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/000.yaml
  text: A Song of Ascents. Behold, bless the LORD, all you servants of the LORD, who stand in the house of the LORD by night!
translation:
  language: ru
  text: Песнь восхождения. Вот, благословляйте ГОСПОДА, все слуги ГОСПОДА, стоящие в доме ГОСПОДА по ночам![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом ГОСПОДА» — храм, святилище в Иерусалиме.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождения
  rationale: Традиционно и достаточно буквально передаёт надписание, сохраняя возможную связь с паломническим восхождением к Иерусалиму, не сужая смысл до одной гипотезы.
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт вводную частицу, привлекающую внимание; в русском здесь естественнее и торжественнее, чем «смотрите».
- source_word: בָּרֲכוּ אֶת־יְהוָה
  choice: благословляйте ГОСПОДА
  rationale: Сохраняет императив множественного числа и характерную библейскую формулу, не заменяя её толкованием «прославляйте».
- source_word: עַבְדֵי יְהוָה
  choice: слуги ГОСПОДА
  rationale: «Слуги» естественно передаёт עֲבָדִים в культовом контексте; формула может обозначать храмовых служителей.
- source_word: הָעֹמְדִים
  choice: стоящие
  rationale: Буквально сохраняет причастие; оно может обозначать как физическое стояние, так и исполнение служения, поэтому смысл не конкретизируется.
- source_word: בְּבֵית יְהוָה
  choice: в доме ГОСПОДА
  rationale: Сохраняет устойчивое древнееврейское обозначение храма без внесения слова «храм» в основной текст.
- source_word: בַּלֵּילוֹת
  choice: по ночам
  rationale: Форма множественного числа естественно передаётся по-русски как повторяющееся или обычное ночное служение.
theological_decisions:
- issue: Кто назван «слугами ГОСПОДА»
  choice: Не уточнять в основном тексте как священников или левитов
  alternative: «все священники/левиты ГОСПОДА»
  rationale: Исходный текст использует более широкое עַבְדֵי; вероятный храмовый контекст не оправдывает конфессионально или исторически более узкую подстановку.
- issue: Значение «благословлять ГОСПОДА»
  choice: Сохранить выражение «благословляйте ГОСПОДА»
  alternative: «прославляйте/хвалите ГОСПОДА»
  rationale: Хотя применительно к Богу глагол подразумевает хвалу и поклонение, буквальная формула важна и понятна в библейском русском языке.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Тетраграмматон передан как «ГОСПОДЬ» прописными буквами. Весь текст после надписания включён; восклицательная интонация сохранена.
