  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת הִנֵּ֤ה בָּרֲכ֣וּ אֶת יְ֭הוָה כָּל עַבְדֵ֣י יְהוָ֑ה הָ/עֹמְדִ֥ים בְּ/בֵית יְ֝הוָ֗ה בַּ/לֵּילֽוֹת׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/134/001.yaml
  text: A Song of Ascents[a]. Behold, bless Yahweh, all you servants of Yahweh[b], who stand in the house of Yahweh by night.
translation:
  language: ru
  text: 'Песнь восхождений.[a]


    Вот, благословляйте Яхве, все служители Яхве, стоящие в доме Яхве[b] по ночам!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально это название можно также передать как «Песнь ступеней» или «Песнь подъёмов»; вероятно, оно связано с паломничеством в Иерусалим, но точный смысл названия неясен.
    reason: lexical_and_cultural_note
  - marker: b
    text: «Дом Яхве» — храм, святилище в Иерусалиме.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Сохраняет традиционное название этой группы псалмов и формально передаёт множественное число существительного מַעֲלוֹת, не сводя его смысл к одному предполагаемому историческому контексту.
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт функцию частицы, привлекающей внимание и усиливающей последующий призыв; это естественное и понятное слово в современном литературном русском языке.
- source_word: בָּרֲכוּ
  choice: благословляйте
  rationale: Сохраняет основное значение корня ברך и литургическую окраску. Несовершенный вид уместен как призыв к совершаемому и повторяемому богослужебному действию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, представленное в еврейском тексте тетраграмматоном, а не заменяет его титулом «Господь».
- source_word: כָּל עַבְדֵי יְהוָה
  choice: все служители Яхве
  rationale: В контексте служения в святилище עֲבָדִים естественно передать как «служители». Императив показывает, что это обращение к ним, поэтому отдельное местоимение «вы» в русском не требуется.
- source_word: הָעֹמְדִים
  choice: стоящие
  rationale: Сохраняет конкретный образ еврейского причастия и не подменяет его более толковательным «служащие».
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Буквально и узнаваемо передаёт еврейское выражение; контекстуальное значение храма разъяснено в сноске.
- source_word: בַּלֵּילוֹת
  choice: по ночам
  rationale: Естественно передаёт форму множественного числа и допускаемый ею повторяющийся характер ночного служения, не создавая неуклюжего буквализма «в ночи».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе трижды употреблено собственное имя Бога. Форма «Яхве» сохраняет эту особенность исходного текста и отличает имя от титула.
- issue: Значение обращения עַבְדֵי יְהוָה
  choice: служители Яхве
  alternative: рабы Яхве
  rationale: Слово עבד допускает значение «раб», однако упоминание стояния в доме Яхве указывает здесь на храмовое служение. «Служители» естественно передаёт контекст, не отрицая принадлежности и подчинения Богу.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной богослужебной интонацией. Частица «Вот» сохранена как поэтический сигнал внимания; конкретный образ «стоящие» не заменён толкованием. Восклицательный знак передаёт силу повелительного призыва.
