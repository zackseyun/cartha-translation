  text: Plowmen have plowed on my back[a]; they have made their furrows long.
translation:
  language: ru
  text: Пахари пахали на моей спине; они протянули свои длинные борозды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «они удлинили свои борозды». Образ пахоты передаёт жестокое угнетение или нанесение ран.'
    reason: Сохраняется более буквальный вариант еврейского выражения и кратко поясняется метафорический образ.
lexical_decisions:
- source_word: עַל גַּבִּי
  choice: на моей спине
  rationale: Предлог עַל обозначает поверхность, на которой совершается действие, а גַּבִּי буквально значит «моя спина». Такой перевод сохраняет яркий образ страдания.
- source_word: חָרְשׁוּ חֹרְשִׁים
  choice: пахари пахали
  rationale: Однокоренное сочетание глагола и субстантивированного причастия буквально передаёт земледельческий образ и намеренный поэтический повтор еврейского текста.
- source_word: הֶאֱרִיכוּ
  choice: проводя … длинные
  rationale: Каузативная форма означает «делать длинным, удлинять». В сочетании с «бороздами» естественное русское выражение «проводя длинные борозды» сохраняет смысл результата.
- source_word: לְמַעֲנוֹתָם
  choice: борозды
  rationale: В данном контексте слово обозначает борозды, оставляемые плугом. Выбор сохраняет цельную метафору пахоты и не подменяет её прямым истолкованием как ран или угнетения.
theological_decisions:
- issue: Метафорическое изображение страданий Израиля
  choice: Сохранить буквальный земледельческий образ пахоты по спине и длинных борозд.
  alternative: 'Передать смысл напрямую: «они исполосовали мою спину длинными ранами» или «жестоко угнетали меня».'
  rationale: Еврейский текст не объясняет метафору прямо. Сохранение образа позволяет передать одновременно телесное страдание, насилие и длительное угнетение, не сужая смысл до одного толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтической выразительности и намеренного повтора «пахари пахали». Деепричастная конструкция делает вторую строку естественной по-русски, не устраняя исходный образ.
