    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Сохраняет буквальный образ множественного числа מַעֲלוֹת и традиционную формулу надписания псалмов 120–134, не заменяя её более узким толкованием «паломническая песнь».
- source_word: רַבַּת
  choice: Сильно
  rationale: Передаёт наречное значение интенсивности или меры. Еврейское слово допускает также понимание повторности — «много раз», которое отмечено в сноске.
- source_word: צְרָרוּנִי
  choice: притесняли меня
  rationale: Передаёт враждебное стеснение и угнетение, не ограничивая смысл только политическим преследованием и сохраняя широкий диапазон глагола צרר.
- source_word: מִנְּעוּרַי
  choice: с юности моей
  rationale: Естественно передаёт исходную временную точку и сохраняет возвышенный, но понятный регистр псалма.
- source_word: יֹאמַר נָא
  choice: пусть скажет теперь
  rationale: Передаёт побуждение, выраженное формой глагола с частицей נָא; «теперь» здесь отражает дискурсивное усиление, а не просьбу о вежливости.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохраняет имя народа и корпоративного участника богослужебного призыва.
theological_decisions:
- issue: Корпоративный говорящий и литургическое обрамление
  choice: Сохранено первое лицо единственного числа «меня», после которого Израиль призывается произнести это исповедание.
  alternative: Истолковать говорящего только как отдельного человека либо сразу заменить «меня» на «нас».
  rationale: Фраза «пусть скажет теперь Израиль» побуждает весь народ принять слова от первого лица, однако текст не устраняет напряжения между индивидуальным и корпоративным голосом; перевод его сохраняет.
translation_notes:
  register: Современный литературный русский с традиционной псалмовой торжественностью. Инверсия «с юности моей» выбрана ради ритма и достоинства речи; лексика остаётся понятной современному читателю. Конечное тире сохраняет незавершённость призыва, продолжающегося в следующем стихе.
