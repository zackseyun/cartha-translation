id: PSA.129.4
reference: Psalms 129:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יְהוָ֥ה צַדִּ֑יק קִ֝צֵּ֗ץ עֲב֣וֹת רְשָׁעִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/004.yaml
  text: Yahweh is righteous[a]; he has cut the cords of the wicked.
translation:
  language: ru
  text: 'Яхве праведен: Он рассёк верёвки[a] нечестивых.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «канаты»; возможно: «толстые верёвки».'
    reason: Лексема עֲבוֹת может обозначать верёвки или особенно прочные, толстые канаты.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога общепринятой современной русской транслитерацией, не заменяя его титулом.
- source_word: צַדִּיק
  choice: праведен
  rationale: Точно передаёт предикативное утверждение о нравственной правоте и справедливости Яхве и естественно звучит в библейской поэзии.
- source_word: קִצֵּץ
  choice: рассёк
  rationale: Интенсивная форма глагола выражает решительное перерезание или разрубание; совершенный вид передаёт завершённость действия.
- source_word: עֲבוֹת
  choice: верёвки
  rationale: Слово обозначает прочные верёвки или канаты, служащие образом связывания и угнетения; вариант сохраняет конкретность метафоры и понятен современному читателю.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное во множественном числе обозначает нечестивых людей без добавления отсутствующего в еврейском тексте слова «люди».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Связь праведности Яхве с избавлением
  choice: Сохранено краткое соположение двух утверждений через двоеточие
  alternative: Яхве справедлив, поэтому Он рассёк…
  rationale: Двоеточие естественно показывает смысловую связь, но не добавляет отсутствующий в оригинале причинный союз и не устраняет поэтическую сжатость.
translation_notes:
  register: Современный литературный русский язык с достоинством и поэтической краткостью. Сохранены прямой образ перерезанных пут и лаконичный параллелизм; архаизмы не используются.
