  text: רַ֭בַּת צְרָר֣וּ/נִי מִ/נְּעוּרָ֑/י גַּ֝ם לֹא יָ֥כְלוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/002.yaml
  text: Greatly they have afflicted me from my youth[b][a], yet they have not prevailed against me.
translation:
  language: ru
  text: Сильно теснили меня с юности моей[a], но не одолели меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Много раз теснили меня с юности моей». Начальное еврейское слово может подчёркивать либо силу притеснений, либо их многократность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не взяли надо мной верх».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: Сильно
  rationale: Наречное употребление формы от רבה здесь естественно передаёт большую степень притеснения. Возможное значение многократности сохранено в сноске.
- source_word: צְרָרוּנִי
  choice: теснили меня
  rationale: Глагол צרר обозначает враждебное притеснение, преследование или стеснение; «теснили» сохраняет широкий смысл и поэтическую сжатость, не ограничивая речь военным нападением.
- source_word: מִנְּעוּרָי
  choice: с юности моей
  rationale: Выражение указывает на начальный момент длительного опыта; эта формулировка естественна для возвышенной русской поэзии и сохраняет образ оригинала.
- source_word: גַּם
  choice: но
  rationale: 'В сочетании с последующим отрицанием частица имеет здесь противительный оттенок: несмотря на притеснения, враги не добились успеха.'
- source_word: לֹא יָכְלוּ לִי
  choice: не одолели меня
  rationale: יכל с ל выражает неспособность взять верх над кем-либо. «Не одолели меня» ясно и естественно передаёт неудачу врагов.
