source:
  edition: WLC
  text: יִ֭הְיוּ כַּ/חֲצִ֣יר גַּגּ֑וֹת שֶׁ/קַּדְמַ֖ת שָׁלַ֣ף יָבֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/006.yaml
  text: May they be like grass on the rooftops[a], which withers before it grows up.
translation:
  language: ru
  text: Да станут они подобны траве на крышах, которая засыхает прежде, чем её выдернут[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которая засыхает, не успев вырасти». Значение еврейского выражения не вполне ясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Да станут они
  rationale: Форма в контексте передаёт пожелание-проклятие, а не простое сообщение о будущем; конструкция с «да» сохраняет возвышенный, но понятный русский регистр.
- source_word: כַּחֲצִיר
  choice: подобны траве
  rationale: חָצִיר здесь обозначает траву; это естественное русское соответствие в данном сравнении.
- source_word: גַּגּוֹת
  choice: на крышах
  rationale: Речь идёт о плоских крышах домов, где в тонком слое земли могла ненадолго прорастать трава. Предлог «на» естественно передаёт пространственный смысл еврейского сочетания.
- source_word: שֶׁקַּדְמַת
  choice: прежде, чем
  rationale: 'Передан временной смысл: высыхание предшествует действию, выраженному следующим глаголом.'
- source_word: שָׁלַף
  choice: её выдернут
  rationale: Основное значение корня — «вытянуть, вытащить». В образе травы уместно «выдернуть»; пассивная русская конструкция естественно выражает подразумеваемого деятеля, хотя форма еврейского слова допускает трудное и спорное понимание.
- source_word: יָבֵשׁ
  choice: засыхает
  rationale: Глагол означает высыхание; применительно к траве «засыхает» звучит естественно и сохраняет образ.
theological_decisions:
- issue: Характер высказывания о ненавидящих Сион
  choice: Пожелание передано формой «Да станут они»
  alternative: «Они будут»
  rationale: Контекст и глагольная форма допускают импрекативно-оптативное прочтение; перевод не превращает пожелание псалмопевца в однозначное предсказание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой формой «Да станут». Конкретный образ травы на плоских крышах сохранён; спорное значение שָׁלַף не сглажено и отмечено сноской.
