- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождения
  rationale: Традиционно и достаточно буквально передаёт заголовок; множественное число в еврейском обозначает восхождения как категорию песен.
- source_word: רַבַּת
  choice: жестоко
  rationale: В данном сочетании наречие может обозначать большую силу или меру притеснений; естественное русское выражение сохраняет этот основной смысл.
- source_word: צְרָרוּנִי
  choice: теснили меня
  rationale: Глагол выражает враждебное притеснение и причинение бед; «теснили» сохраняет образ давления и не сужает значение до одного вида гонений.
- source_word: מִנְּעוּרַי
  choice: с юности моей
  rationale: Прямо передаёт временную точку начала длительного притеснения и сохраняет возвышенный поэтический порядок слов.
- source_word: יֹאמַר נָא יִשְׂרָאֵל
  choice: пусть скажет теперь Израиль
  rationale: נָא здесь естественно понимается как призыв «пусть же/теперь»; формулировка вводит общинное повторение свидетельства.
