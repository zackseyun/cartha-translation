  text: May all who hate Zion be put to shame and turned backward[a].
translation:
  language: ru
  text: Да постыдятся и отступят назад все ненавидящие Сион[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Все ненавидящие Сион постыдятся и отступят назад». Еврейские формы можно понять не как молитвенное пожелание, а как утверждение о будущем.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: да постыдятся
  rationale: Глагол בוש обозначает переживание стыда, позора или краха ожиданий. Форма с «да» естественно передаёт вероятную здесь молитву-пожелание, не добавляя внешнего деятеля, которого еврейский текст прямо не называет.
- source_word: וְיִסֹּגוּ
  choice: и отступят
  rationale: Глагол סוג передаёт движение назад, отступление. Активная русская форма соответствует еврейской форме и не вводит неуказанного деятеля, как могло бы выражение «будут отброшены».
- source_word: אָחוֹר
  choice: назад
  rationale: Наречие прямо уточняет направление движения; сочетание «отступят назад» сохраняет явный элемент исходного текста и остаётся понятным по-русски.
- source_word: כֹּל
  choice: все
  rationale: Прямой и естественный русский эквивалент всеохватного квантора.
- source_word: שֹׂנְאֵי
  choice: ненавидящие
  rationale: Причастная форма сохраняет сжатую поэтическую структуру еврейского выражения и звучит естественно в данном контексте.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Устоявшаяся русская передача библейского топонима צִיּוֹן.
theological_decisions:
- issue: Молитвенно-пожелательное или предсказательное значение форм yiqtol
  choice: 'Передать как пожелание-молитву: «Да постыдятся и отступят назад…»'
  alternative: 'Утверждение о будущем: «Все ненавидящие Сион постыдятся и отступят назад»'
  rationale: В поэтическом контексте формы yiqtol могут иметь юссивное, молитвенно-пожелательное значение, но допускают и чтение как утверждение о будущем. Основной текст отражает вероятную импрекативную силу, а сноска сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Конструкция «да постыдятся» понятна современному читателю и уместно передаёт молитвенное пожелание; лексика не привносит конфессиональных толкований.
