  text: 'которой жнец не наполнит руки,

    и собирающий снопы — пазухи.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «складки одежды»; букв. «пазухи» — места в одежде у груди, куда складывали собранные стебли.'
