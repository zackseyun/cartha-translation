lexical_decisions:
- source_word: שֶׁלֹּא
  choice: которой … не
  rationale: Относительная частица с отрицанием связывает стих с травой на крышах из предыдущего стиха; форма женского рода естественно отсылает к русскому слову «трава».
- source_word: מִלֵּא
  choice: не наполнит
  rationale: 'Перфект описывает обычный итог: такой травой жнец не может наполнить руку. В русском контексте будущее совершенного вида естественно выражает этот характерный результат.'
- source_word: כַפּוֹ
  choice: руки
  rationale: כַּף буквально означает ладонь или руку. «Наполнит руки» сохраняет конкретный образ и звучит естественнее, чем «наполнит ладонь»; единственное число оригинала передано идиоматическим русским выражением.
- source_word: קוֹצֵר
  choice: жнец
  rationale: Субстантивированное причастие обозначает того, кто срезает урожай; «жнец» кратко и точно передаёт сельскохозяйственный образ.
- source_word: וְחִצְנוֹ
  choice: подола
  rationale: חֵצֶן обозначает пазуху, лоно либо складку одежды, в которой несут собранные стебли. «Подол» сохраняет предметный образ одежды, не заменяя его толкованием «руки».
- source_word: מְעַמֵּר
  choice: вязальщик снопов
  rationale: Причастие связано со сбором срезанных стеблей в снопы. «Вязальщик снопов» ясно обозначает работника и поддерживает параллелизм со словом «жнец».
