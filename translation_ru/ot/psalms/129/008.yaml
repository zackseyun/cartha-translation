  terminology: «Яхве» последовательно передаёт יהוה в обоих случаях и согласуется с указанной английской аудиторской траекторией. Примечание ясно объясняет передачу имени; маркер [a] корректно поставлен в конце содержащей оба употребления имени прямой речи.
