source:
  edition: WLC
  text: וְ/לֹ֤א אָֽמְר֨וּ הָ/עֹבְרִ֗ים בִּרְכַּֽת יְהוָ֥ה אֲלֵי/כֶ֑ם בֵּרַ֥כְנוּ אֶ֝תְ/כֶ֗ם בְּ/שֵׁ֣ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/129/008.yaml
  text: and those who pass by do not say[a], “The blessing of Yahweh be upon you; we bless you in the name of Yahweh.”
translation:
  language: ru
  text: 'И прохожие не говорят:

    «Благословение Яхве да будет на вас!

    Благословляем вас именем Яхве».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — передача еврейского имени Бога יהוה (YHWH), которое традиционно заменяют словом «Господь».
    reason: Пояснение передачи божественного имени.
lexical_decisions:
- source_word: וְלֹא אָמְרוּ
  choice: И прохожие не говорят
  rationale: Союз и отрицание продолжают описание предыдущего стиха, а перфект в данном обобщённо-поэтическом контексте естественно передаётся русским настоящим временем.
- source_word: הָעֹבְרִים
  choice: прохожие
  rationale: Субстантивированное причастие с артиклем обозначает людей, проходящих мимо; краткое русское существительное точно и естественно передаёт этот смысл.
- source_word: בִּרְכַּת יְהוָה אֲלֵיכֶם
  choice: Благословение Яхве да будет на вас
  rationale: Сохранена именная конструкция «благословение Яхве», а подразумеваемое пожелание выражено частицей «да» и связкой «будет».
- source_word: בֵּרַכְנוּ אֶתְכֶם
  choice: Благословляем вас
  rationale: Перфект входит в формулу благословения и имеет перформативную силу; русское настоящее время естественно передаёт совершаемое речью благословение.
- source_word: בְּשֵׁם יְהוָה
  choice: именем Яхве
  rationale: Творительный падеж естественно выражает призывание имени и власть, с которой произносится благословение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, без замены титулом «Господь».
theological_decisions:
- issue: Передача тетраграмматона יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет божественное имя; форма «Яхве» сохраняет его как личное имя и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Модальность формулы בִּרְכַּת יְהוָה אֲלֵיכֶם
  choice: да будет на вас
  alternative: на вас; пусть будет с вами
  rationale: В еврейском нет выраженного глагола, но контекст требует формулы пожелания. «Да будет» обозначает подразумеваемую оптативность, не превращая благословение в простое утверждение.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Сохранены параллелизм двух формул благословения и переход от повествования к прямой речи.
