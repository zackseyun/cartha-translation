  source_fidelity: Текст верно передаёт координацию и отрицание («И ... не говорят»), обобщённое значение הָעֹבְרִים («прохожие»), формулу благословения בִּרְכַּת יְהוָה אֲלֵיכֶם и ответную формулу בֵּרַכְנוּ אֶתְכֶם בְּשֵׁם יְהוָה. Настоящее «говорят» и перформативное «Благословляем» уместно передают поэтический и формульный характер еврейских перфектов. Оптативное «да будет» корректно восполняет отсутствующую в еврейском глагольную связку, не добавляя нового содержания.
