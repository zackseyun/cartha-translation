  text: יַדְבֵּ֣ר עַמִּ֣ים תַּחְתֵּ֑י/נוּ וּ֝/לְאֻמִּ֗ים תַּ֣חַת רַגְלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/003.yaml
  text: He subdues peoples under us[a], and nations under our feet.
translation:
  language: ru
  text: 'Он покоряет нам народы,

    и племена кладёт под наши ноги.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַדְבֵּר
  choice: покоряет
  rationale: В данном параллелизме форма глагола דבר имеет каузативное значение «подчинять, покорять», а не обычное значение «говорить». Настоящее время естественно передаёт незавершённый вид и обобщённое действие в поэтическом контексте.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число עַם обозначает народы или группы людей; «народы» точно и естественно в современном русском.
- source_word: תַּחְתֵּינוּ
  choice: нам
  rationale: Русское «покоряет нам» естественно выражает подчинение нашей власти; буквальное пространственное «под нас» здесь менее идиоматично. Образ положения внизу сохраняется во второй строке.
- source_word: וּלְאֻמִּים
  choice: и племена
  rationale: «Племена» сохраняет лексическое различие между לְאֻמִּים и עַמִּים, не сводя оба слова к одному русскому соответствию. В данном возвышенно-поэтическом контексте слово остаётся понятным.
- source_word: תַּחַת רַגְלֵינוּ
  choice: кладёт к нашим ногам
  rationale: Так естественно передаётся буквальный образ нахождения под ногами как знак покорения. Глагол «кладёт» подразумевается по поэтическому параллелизму и делает русскую строку грамматически ясной.
theological_decisions:
- issue: Корпоративный голос и Божья роль в покорении народов
  choice: Бог выступает действующим лицом и покоряет народы своему народу, обозначенному формами «нам» и «нашим».
  alternative: Обобщённое царское высказывание о военной победе Израиля.
  rationale: Ближайший контекст приписывает царствование и победу Богу. Перевод сохраняет первое лицо множественного числа и не смягчает образ покорения, но также не добавляет позднейшего богословского истолкования.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Сохранены параллелизм, корпоративное «мы» и образ покорённых у ног; синтаксис сделан естественным для русского языка.
