lexical_decisions:
- source_word: יִבְחַר
  choice: избирает
  rationale: Форма qal imperfect 3-го лица мужского рода единственного числа допускает настоящее, будущее или модальное понимание. Настоящее время естественно выражает продолжающееся действие Бога в контексте псалма, а возможное будущее значение отмечено в сноске.
- source_word: לָנוּ
  choice: для нас
  rationale: Предлог ל с суффиксом 1-го лица множественного числа выражает пользу или предназначение; «для нас» естественно передаёт этот смысл.
- source_word: נַחֲלָתֵנוּ
  choice: наше наследие
  rationale: נחלה обозначает наследие, удел или наследственное владение и здесь сохраняет связь с дарованной народу землёй.
- source_word: אֶת ... אֶת
  choice: тире перед приложением
  rationale: Оба אֶת служат показателями прямого дополнения; второй вводит поясняющее приложение. В русском это отношение естественно передаётся тире, без отдельного перевода частиц.
- source_word: גְּאוֹן
  choice: славу
  rationale: גאון может означать гордость, величие, превосходство или славу. В положительном контексте «слава Иакова» ясно передаёт ценность и великолепие наследия, не вызывая нежелательной ассоциации с порочной гордыней.
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Сохранено данное в еврейском тексте имя, имеющее здесь также собирательное значение народа Израиля.
- source_word: אֲשֶׁר אָהֵב
  choice: которого Он любит
  rationale: Относительное предложение может относиться к Иакову; перфект אָהֵב способен обозначать устойчивое состояние любви, которое по-русски естественно передать настоящим временем. Альтернативная связь с наследием сохранена в сноске.
- source_word: סֶלָה
  choice: Села
  rationale: Значение древнееврейского литургического или музыкального термина остаётся неясным, поэтому он передан традиционной транслитерацией.
theological_decisions:
- issue: К чему относится выражение «которого Он любит»
  choice: 'К Иакову: «Иакова, которого Он любит»'
  alternative: 'К наследию, то есть земле: «славу Иакова, которую Он любит»'
  rationale: Иаков является ближайшим личным референтом, а любовь Бога к Иакову/Израилю соответствует библейскому словоупотреблению. Вместе с тем грамматическая связь относительного предложения с наследием или славой возможна, поэтому неоднозначность указана в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общепонятным звучанием. Синтаксис сохраняет поэтическую краткость оригинала; тире ясно показывает, что «слава Иакова» поясняет «наше наследие».
