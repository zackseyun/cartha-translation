    reason: alternative_reading
lexical_decisions:
- source_word: מָלַךְ
  choice: царствует
  rationale: Перфект в поэтическом провозглашении может передавать наличное, утвердившееся царствование. «Царствует» естественно выражает действительную Божью власть, не устраняя возможного оттенка вступления на царство, отмеченного в сноске.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Хотя форма морфологически множественная, здесь она обозначает единого Бога Израиля. Повтор сохранён в обоих полустишиях ради поэтического акцента.
- source_word: עַל
  choice: над
  rationale: При обозначении царской власти предлог выражает господство над народами; русское «над» естественно передаёт это отношение.
- source_word: גּוֹיִם
  choice: народами
  rationale: Слово обозначает народы мира как совокупность. «Язычниками» внесло бы более узкий религиозный оттенок, не обязательный в данном контексте.
- source_word: יָשַׁב
  choice: восседает
  rationale: Буквально глагол означает «сидеть», но сочетание с престолом создаёт царский образ. «Восседает» естественно и достойно передаёт этот образ в современном литературном русском.
- source_word: כִּסֵּא
  choice: престоле
  rationale: В контексте Божьего царствования речь идёт именно о престоле, а не просто о сиденье.
- source_word: קָדְשׁוֹ
  choice: Своём святом
  rationale: Буквально — «престоле Своей святости». Русская атрибутивная конструкция «Своём святом престоле» естественна и сохраняет смысл принадлежности и святости.
theological_decisions:
- issue: Значение древнееврейских перфектов מָלַךְ и יָשַׁב в поэтическом провозглашении Божьего царствования
  choice: 'Настоящее время: «Бог царствует… Бог восседает…»'
  alternative: 'Ингрессивно-результативное прочтение: «Бог воцарился… Бог воссел на Своём святом престоле».'
  rationale: Контекст псалма позволяет понимать формы как торжественное утверждение нынешней всеобщей царской власти Бога. Вместе с тем возможный акцент на установлении царствования не отвергается, а сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим звучанием. «Восседает» уместно поддерживает царский образ, не становясь непонятным архаизмом. Местоимение «Своём» написано с прописной буквы как допустимая русская издательская форма почтительного обозначения Бога; дополнительных конфессиональных смыслов это не вносит.
