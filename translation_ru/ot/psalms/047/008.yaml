  naturalness: Фраза звучит естественно на современном литературном русском и сохраняет уместную торжественность псалма. «Восседает» — понятное современному читателю высокое слово, оправданное престольным образом. Повтор «Бог» сохраняет риторику оригинала.
  terminology: «Бог», «царствует», «народы» и «престол» точны и не вносят позднейших конфессиональных оттенков. Написание «Своём» с прописной буквы является допустимой редакционной формой почтительности и не меняет смысла.
