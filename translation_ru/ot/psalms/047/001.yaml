    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָעַמִּים
  choice: все народы
  rationale: Сочетание כָּל с формой множественного числа הָעַמִּים охватывает всю совокупность народов; русское «народы» сохраняет этнический и собирательный смысл без обязательного политического оттенка.
- source_word: תִּקְעוּ כָף
  choice: рукоплещите
  rationale: Еврейская идиома буквально описывает удар ладонями. «Рукоплещите» естественно и достойно передаёт повеление хлопать в ладоши в знак торжества.
- source_word: הָרִיעוּ
  choice: восклицайте
  rationale: Форма породы хифиль от רוע означает издавать громкий возглас, нередко радостный или победный. «Восклицайте» сохраняет возвышенный регистр и параллелизм с рукоплесканием.
- source_word: לֵאלֹהִים
  choice: Богу
  rationale: Предлог ל указывает, кому направлено торжественное восклицание; русский дательный падеж передаёт это естественно.
- source_word: בְּקוֹל רִנָּה
  choice: голосом ликования
  rationale: קוֹל означает «голос, звук», а רִנָּה — громкую радость, ликование или радостный крик. Формулировка сохраняет и звуковой образ, и торжественную окраску, не сводя выражение просто к внутренней радости.
theological_decisions:
- issue: Объём обращения к народам
  choice: Стих призывает к прославлению Бога все народы без исключения.
  alternative: Обращение риторически ограничено народами, окружавшими Израиль.
  rationale: В еврейском тексте прямо сказано «все народы», а контекст псалма о Божьем царствовании поддерживает универсальный призыв; более узкое ограничение самим стихом не выражено.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Рукоплещите» и «ликование» понятны широкому читателю и соответствуют торжественному жанру псалма; синтаксис сохраняет два параллельных повеления оригинала.
