  yaml_path: translation/ot/psalms/047/007.yaml
  text: For God is the King of all the earth[a]; sing a psalm with understanding.
translation:
  language: ru
  text: Ибо Бог — Царь всей земли; пойте разумно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пойте с пониманием», «пойте искусно»; возможно также: «пойте маскил» — так мог называться особый вид песни или поэтического произведения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего призыва к хвале; «ибо» естественно сохраняет причинно-пояснительное значение.
- source_word: מֶלֶךְ כָּל־הָאָרֶץ
  choice: Царь всей земли
  rationale: Передаёт конструкцию принадлежности и не сужает универсальный масштаб Божьего царствования.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма здесь имеет единственное значение и обозначает Бога Израиля.
- source_word: זַמְּרוּ
  choice: пойте
  rationale: Повелительная форма множественного числа призывает к песенному музыкальному прославлению.
- source_word: מַשְׂכִּיל
  choice: разумно
  rationale: Наречное прочтение естественно в данном призыве и сохраняет связь слова с пониманием и осмысленностью; неоднозначность музыкально-литературного термина отмечена в сноске.
theological_decisions:
- issue: Масштаб Божьего царствования
  choice: Бог представлен Царём всей земли во всеобщем смысле.
  alternative: «Царь всей страны/земли» с возможным более узким значением слова אֶרֶץ.
  rationale: Контекст псалма и выражение כָּל־הָאָרֶץ естественно указывают на всю землю; перевод не добавляет дальнейших конфессиональных выводов.
translation_notes:
  register: Современный литературный русский язык с традиционно-поэтическим, но понятным союзом «ибо». Тире подчёркивает именную часть сказуемого; формулировка краткая и пригодна для чтения вслух.
