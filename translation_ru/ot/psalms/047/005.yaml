lexical_decisions:
- source_word: עָלָה
  choice: взошёл
  rationale: Еврейский глагол означает «подняться, взойти». Совершенный вид естественно передаёт завершённое действие и сохраняет возвышенную поэтическую образность, не уточняя её богословски.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на форму множественного числа, здесь слово обозначает единого Бога Израиля и параллельно имени Яхве.
- source_word: בִּתְרוּעָה
  choice: при громких возгласах
  rationale: תְּרוּעָה обозначает громкий крик, возглас или ликование. Формулировка сохраняет широту значения и не сужает его до воинственного клича или исключительно радостного ликования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: בְּקוֹל
  choice: при звуке
  rationale: В сочетании с названием инструмента קוֹל естественно означает его слышимый звук.
- source_word: שׁוֹפָר
  choice: шофар
  rationale: Заимствованное название точно обозначает древний сигнальный и культовый рог и уже понятно многим русским читателям; пояснение дано в сноске.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Возможные христологические ассоциации восхождения
  choice: Бог взошёл
  alternative: Бог вознёсся; Бог поднялся
  rationale: «Взошёл» передаёт образ восхождения и воцарения, но не навязывает позднейшее христологическое прочтение; возможный вариант указан в сноске.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Параллелизм полустиший сохранён; «при» естественно передаёт сопровождающие звуки и избегает двусмысленного инструментального оттенка конструкции «с возгласами».
