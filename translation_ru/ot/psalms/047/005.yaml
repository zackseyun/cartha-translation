  yaml_path: translation/ot/psalms/047/005.yaml
  text: God has gone up with a shout[a]; Yahweh[b], with the sound of a trumpet.
translation:
  language: ru
  text: 'Бог взошёл под громкие возгласы[a],

    Яхве — под звук шофара[b].'
  philosophy: optimal-equivalence
  footnotes:
