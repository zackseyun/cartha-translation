lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов это слово обозначает музыкального руководителя или распорядителя исполнения. Дательный падеж естественно передаёт ל и сохраняет возможный смысл адресации; традиционное и понятное «руководителю хора» уместно в богослужебном контексте.
- source_word: לִבְנֵי
  choice: Сынов
  rationale: Родительный падеж передаёт связь псалма с сынами Корея, не утверждая однозначно ни авторство, ни посвящение; иные возможные отношения пояснены в сноске.
- source_word: קֹרַח
  choice: Корея
  rationale: Использована устоявшаяся русская библейская форма имени «Корей», здесь в родительном падеже.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Стандартное жанровое обозначение, точно и естественно соответствующее еврейскому מִזְמוֹר.
