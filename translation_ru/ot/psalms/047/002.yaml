lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для призыва к хвале в предыдущем стихе; «ибо» естественно сохраняет причинно-пояснительную связь и поэтическую торжественность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: עֶלְיוֹן
  choice: Всевышний
  rationale: Устоявшийся русский божественный титул, сохраняющий превосходную степень и торжественный регистр.
- source_word: נוֹרָא
  choice: грозен
  rationale: Передаёт способность внушать благоговейный страх и трепет, не сводя значение ни к одному ужасу, ни к ослабленному «восхитителен».
- source_word: מֶלֶךְ גָּדוֹל
  choice: великий Царь
  rationale: Прямо сохраняет царский образ и величие Божьего владычества.
- source_word: עַל כָּל הָאָרֶץ
  choice: над всей землёй
  rationale: В контексте псалма выражает всемирное, а не только местное царствование.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Смысл נוֹרָא применительно к Богу
  choice: грозен
  alternative: страшен; внушает благоговейный страх; достоин страха
  rationale: «Грозен» естественно и ёмко выражает величие, вызывающее страх и благоговение. Сноска сохраняет более явное указание на диапазон значения.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим звучанием. Обособление титула «Всевышний» сохраняет компактность еврейской именной фразы; прописная буква в «Царь» подчёркивает употребление слова как божественного титула.
