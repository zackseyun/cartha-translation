  text: זַמְּר֣וּ אֱלֹהִ֣ים זַמֵּ֑רוּ זַמְּר֖וּ לְ/מַלְכֵּ֣/נוּ זַמֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/006.yaml
  text: Sing praises to God[a], sing praises; sing praises to our King, sing praises.
translation:
  language: ru
  text: Пойте хвалу Богу[a], пойте хвалу; пойте хвалу нашему Царю, пойте хвалу!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Играйте Богу… играйте нашему Царю». Еврейский глагол может обозначать музыкальное прославление в более широком смысле, не только пение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ / זַמֵּרוּ
  choice: пойте хвалу
  rationale: Повторённый четыре раза глагол זמר в богослужебном контексте призывает к музыкальному прославлению. «Пойте хвалу» естественно передаёт и пение, и направленность хвалы, сохраняя настойчивый поэтический повтор еврейского текста.
- source_word: אֱלֹהִים
  choice: Богу
  rationale: В данном контексте אֱלֹהִים обозначает Бога Израиля; дательный падеж естественно выражает адресата хвалы.
- source_word: לְמַלְכֵּנוּ
  choice: нашему Царю
  rationale: Предлог לְ обозначает адресата прославления, а форма מַלְכֵּנוּ — «нашему Царю». Заглавная буква уместна, поскольку в непосредственном контексте Царём назван Бог.
theological_decisions:
- issue: Божественный титул царя
  choice: нашему Царю
  alternative: нашему царю
  rationale: Контекст псалма прославляет царствование Бога, поэтому «Царь» передаётся как относящийся к Богу титул, без добавления отсутствующих в тексте богословских уточнений.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общепонятным богослужебным звучанием. Четырёхкратный повтор сохранён как важный поэтический и риторический элемент.
