  text: נְדִ֘יבֵ֤י עַמִּ֨ים נֶאֱסָ֗פוּ עַם֮ אֱלֹהֵ֪י אַבְרָ֫הָ֥ם כִּ֣י לֵֽ֭/אלֹהִים מָֽגִנֵּי אֶ֗רֶץ מְאֹ֣ד נַעֲלָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/047/009.yaml
  text: The nobles of the peoples have gathered as the people of the God of Abraham[a], for the shields of the earth belong to God[b]; he is greatly exalted.
translation:
  language: ru
  text: Знатные из народов собрались как народ Бога Авраама[a], ибо щиты земли принадлежат Богу[b]; Он весьма возвышен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собрались вместе с народом Бога Авраама». Еврейская фраза может выражать как отождествление, так и тесное единение.'
    reason: alternative_reading
  - marker: b
    text: 'То есть правители или защитники земли; буквально: «щиты земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְדִיבֵי עַמִּים
  choice: знатные среди народов
  rationale: נְדִיבֵי обозначает людей высокого положения — знатных или князей; сочетание «знатные среди народов» естественно по-русски и сохраняет множественность עַמִּים.
- source_word: נֶאֱסָפוּ
  choice: собрались
  rationale: Форма нифаль от אסף здесь естественно передаёт совместное собирание без необходимости вводить внешнего деятеля.
- source_word: עַם אֱלֹהֵי אַבְרָהָם
  choice: как народ Бога Авраама
  rationale: Сжатая еврейская конструкция допускает отождествление собравшихся с народом Бога Авраама. Союз «как» выражает это прочтение, не устраняя допустимого понимания совместного собрания.
- source_word: כִּי לֵאלֹהִים
  choice: ведь … принадлежат Богу
  rationale: כִּי вводит основание предыдущего утверждения, а לְ при אֱלֹהִים выражает принадлежность; русский оборот делает эту связь ясной и естественной.
- source_word: מָגִנֵּי אֶרֶץ
  choice: щиты земли
  rationale: Сохранён буквальный и выразительный образ. В контексте «щиты» могут метафорически обозначать правителей или защитников земли, что пояснено в сноске.
- source_word: מְאֹד נַעֲלָה
  choice: Он высоко превознесён
  rationale: Мужской род глагола указывает на Бога как подразумеваемое подлежащее; перевод сохраняет хвалебный смысл возвышения и усиление מְאֹד.
theological_decisions:
- issue: Отношение знатных из народов к народу Бога Авраама
  choice: Они собрались как народ Бога Авраама, то есть представлены как отождествлённые с ним или вошедшие в него.
  alternative: Они собрались вместе с народом Бога Авраама.
  rationale: Еврейская фраза синтаксически сжата и допускает как отождествление, так и тесное соприсутствие. Основной текст передаёт контекстуально сильное прочтение включения, а сноска сохраняет альтернативу без навязывания более узкого богословского вывода.
- issue: Образ «щитов земли»
  choice: Сохранить метафору в основном тексте.
  alternative: Передать смысл непосредственно как «правители земли».
  rationale: Буквальный образ важен для поэтики псалма, но его вероятное обозначение земных властителей или защитников следует указать в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены образ «щитов земли», сжатость стиха и неоднозначность связи между знатными из народов и народом Бога Авраама.
