lexical_decisions:
- source_word: פְּנֵה
  choice: Обратись
  rationale: Повелительная форма глагола פנה в сочетании с אֵלַי выражает просьбу повернуться к молящемуся, то есть обратить на него благосклонное внимание. «Обратись ко мне» естественно и достойно звучит в современной русской молитвенной речи.
- source_word: אֵלַי
  choice: ко мне
  rationale: Предлог אֶל с суффиксом первого лица единственного числа указывает направление к говорящему; при глаголе «обратиться» нормативно сочетание «ко мне».
- source_word: וְחָנֵּנִי
  choice: и яви мне милость
  rationale: Императив חנן с объектным суффиксом означает просьбу оказать благоволение или милость. Формулировка сохраняет смысл Божьего благоволения и не сужает его до одного лишь чувства сострадания.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание просьбы. «Ведь» ясно передаёт причинную связь и естественно звучит по-русски.
- source_word: יָחִיד
  choice: одинок
  rationale: В контексте плача слово обозначает одиночество или изолированность. «Одинок» передаёт не только отсутствие других людей рядом, но и переживание оставленности, не устраняя возможного значения «один».
- source_word: וְעָנִי
  choice: и страдаю
  rationale: עָנִי может характеризовать бедного, угнетённого или вообще бедствующего человека. Глагольная передача «страдаю» естественна по-русски и сохраняет широкий смысл тяжёлого положения, а варианты отмечены в сноске.
- source_word: אָנִי
  choice: я
  rationale: Самостоятельное местоимение подчёркивает состояние самого молящегося. В русском предложении явное «я» сохраняет это смысловое ударение.
