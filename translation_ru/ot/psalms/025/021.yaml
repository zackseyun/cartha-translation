  text: תֹּם וָ/יֹ֥שֶׁר יִצְּר֑וּ/נִי כִּ֝֗י קִוִּיתִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/021.yaml
  text: Integrity and uprightness may preserve me[b][a], for I wait for you.
translation:
  language: ru
  text: Непорочность и прямота да хранят меня[a], ведь я надеюсь на Тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Непорочность и прямота будут хранить меня»; еврейская глагольная форма здесь может выражать как пожелание или молитву, так и уверенное ожидание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я с надеждой жду Тебя»; еврейский глагол соединяет ожидание с надеждой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּם
  choice: непорочность
  rationale: Передаёт цельность нравственного характера и безупречность, не утверждая абсолютной безгрешности; естественно сочетается с «прямотой».
- source_word: וָיֹשֶׁר
  choice: и прямота
  rationale: Сохраняет образ нравственной прямоты и поэтическую пару близких, но не тождественных качеств.
- source_word: יִצְּרוּנִי
  choice: да хранят меня
  rationale: Глагол נצר означает «хранить, оберегать». Форма yiqtol допускает и пожелание-молитву, и уверенное ожидание; в основном тексте выбран молитвенный оттенок.
- source_word: כִּי
  choice: ведь
  rationale: Естественно вводит основание предыдущей просьбы и сохраняет связь между частями стиха.
- source_word: קִוִּיתִיךָ
  choice: я надеюсь на Тебя
  rationale: קוה обозначает исполненное надежды ожидание. Такая формулировка естественна по-русски и передаёт упование, тогда как буквальное «жду Тебя» может звучать лишь как ожидание прибытия.
theological_decisions:
- issue: Представлены ли нравственные качества псалмопевца как самостоятельная заслуга, служащая основанием избавления
  choice: Сохранена молитва о том, чтобы непорочность и прямота хранили псалмопевца, без добавления идеи самоправедной заслуги.
  alternative: Истолковать стих как прямую ссылку на собственную праведность псалмопевца в качестве заслуживающего основания для избавления.
  rationale: Еврейский текст называет эти нравственные качества действующими хранителями и одновременно связывает просьбу с упованием на Бога. Перевод сохраняет данное напряжение, не ослабляя этических слов и не добавляя догматического толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Частица «да» уместно передаёт молитвенное пожелание, не создавая чрезмерно архаического звучания. Местоимение «Тебя» написано с прописной буквы согласно распространённой русской библейской традиции.
