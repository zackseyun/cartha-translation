lexical_decisions:
- source_word: יַדְרֵךְ
  choice: направляет
  rationale: Глагол в породе хифиль означает «вести, направлять, наставлять на путь»; «направляет» естественно передаёт каузативный оттенок и сочетается с образом пути во второй строке.
- source_word: עֲנָוִים
  choice: смиренных
  rationale: Слово может обозначать смиренных, кротких, униженных или бедствующих. В контексте готовности принять Божье наставление «смиренных» передаёт основное значение; повтор сохранён ради поэтического параллелизма.
- source_word: בַּמִּשְׁפָּט
  choice: к правде
  rationale: מִשְׁפָּט охватывает значения суда, справедливости и должного. Предлог ב здесь допускает понимание сферы, нормы или направления наставления; «к правде» звучит естественно по-русски и передаёт нравственно-судебный оттенок, не устраняя неоднозначности, отмеченной в сноске.
- source_word: וִילַמֵּד
  choice: и учит
  rationale: Пиэль от למד означает «учить, наставлять»; простой глагол «учит» ясен и сохраняет союз между параллельными частями стиха.
- source_word: דַּרְכּוֹ
  choice: Своему пути
  rationale: Форма стоит в единственном числе с местоименным суффиксом третьего лица мужского рода. Возвратное «Своему» недвусмысленно относит путь к Богу, а «путь» сохраняет библейский образ образа жизни и нравственного следования.
theological_decisions:
- issue: Значение עֲנָוִים в связи с Божьим водительством и наставлением
  choice: «смиренных» — людей, занимающих перед Богом смиренное и готовое учиться положение
  alternative: «кротких», «униженных» или «бедствующих»
  rationale: Контекст псалма говорит о принятии Господнего наставления, поэтому «смиренных» хорошо передаёт духовно-нравственную направленность слова, не отрицая возможного социального оттенка униженности или бедствия.
- issue: Смысл בַּמִּשְׁפָּט
  choice: «к правде» как направление Божьего водительства к справедливому и должному
  alternative: «в справедливости», «по правде», «в суде»
  rationale: Еврейская конструкция допускает понимание сферы, нормы или цели водительства. Основной текст выбран ради естественного русского выражения, а подлинная смысловая широта сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Сохранены параллелизм и повтор «смиренных». Заглавная буква в «Своему» употреблена как традиционное русское указание на Бога; она не добавляет нового референта. Порядок маркеров [b][a] соответствует тому, что [b] поясняет «к правде», а [a] — «смиренных».
