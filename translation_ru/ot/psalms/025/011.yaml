lexical_decisions:
- source_word: לְמַעַן
  choice: Ради
  rationale: 'Передаёт основание и мотив просьбы: псалмопевец взывает к Богу ради Его имени.'
- source_word: שִׁמְךָ
  choice: имени Твоего
  rationale: Сохраняет конкретный еврейский образ; здесь имя указывает также на Божий характер и честь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וְסָלַחְתָּ
  choice: прости
  rationale: В данном молитвенном контексте форма выражает просьбу; русский императив естественно передаёт её силу.
- source_word: לַעֲוֺנִי
  choice: моё беззаконие
  rationale: עָוֹן может обозначать проступок, вину или её бремя; «беззаконие» сохраняет нравственную тяжесть и некоторую широту значения.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание настойчивой просьбы и естественно звучит в современной русской молитвенной речи.
- source_word: רַב הוּא
  choice: оно велико
  rationale: Единственное число и местоименное возобновление указывают на величину или тяжесть беззакония, а не на множество отдельных грехов.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя; транслитерация сохраняет это различие без замены имени титулом.
- issue: Смысл עָוֹן
  choice: беззаконие
  alternative: вина; грех
  rationale: Выбор сохраняет нравственную тяжесть слова, а сноска отмечает его подлинную смысловую широту.
- issue: Логика фразы «ведь оно велико»
  choice: причинное основание просьбы
  alternative: 'уступительное понимание: «хотя оно велико»'
  rationale: 'כִּי обычно имеет здесь причинное значение: именно тяжесть беззакония усиливает нужду в прощении. Необычная богословская напряжённость исходной формулировки сохранена.'
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Инверсия «имени Твоего» умеренно возвышенна и сохраняет обращённость к Богу; «ведь» ясно передаёт причинную связь без архаизации.
