base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/010.yaml
  text: All the paths of Yahweh are steadfast love and faithfulness to those who keep his covenant and his testimonies[a][b].
translation:
  language: ru
  text: Все пути Яхве — неизменная любовь и верность для тех, кто хранит Его завет и Его свидетельства.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истина» вместо «верность»; в сочетании с «неизменной любовью» еврейское слово часто означает надёжность и верность, а не только истину в отвлечённом смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по отношению к тем, кто хранит»; еврейский предлог допускает оба оттенка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אָרְחוֹת
  choice: Все пути
  rationale: Сохраняет образ путей и всеохватность еврейского выражения, естественно звуча по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: חֶסֶד
  choice: неизменная любовь
  rationale: Передаёт милостивую, устойчивую и верную любовь в контексте завета; слово «неизменная» подчёркивает постоянство, не сводя понятие только к чувству.
- source_word: אֱמֶת
  choice: верность
  rationale: В сочетании с חֶסֶד обозначает прежде всего надёжность и постоянство; возможное значение «истина» отмечено в сноске.
- source_word: לְנֹצְרֵי
  choice: для тех, кто хранит
  rationale: Причастие от נצר выражает бережное соблюдение или хранение, а предлог לְ допускает передачу отношения как «для» либо «по отношению к».
- source_word: בְרִיתוֹ
  choice: Его завет
  rationale: Стандартно и точно передаёт понятие завета; местоимение написано с прописной буквы согласно обычной русской благоговейной норме.
- source_word: וְעֵדֹתָיו
  choice: и Его свидетельства
  rationale: Формально сохраняет юридико-заветный образ עֵדוֹת и традиционную библейскую лексику, не сужая значение до отдельных постановлений.
theological_decisions:
- issue: Соотношение путей Яхве с неизменной любовью и верностью
  choice: 'Сохранено прямое именное сказуемое: «Все пути Яхве — неизменная любовь и верность».'
  alternative: «На всех путях Яхве проявляются неизменная любовь и верность» или «пути Яхве ведут к неизменной любви и верности».
  rationale: Безглагольная еврейская конструкция естественнее всего характеризует сами пути Яхве как любовь и верность. Добавление «проявляются» было бы пояснением, а вариант «ведут к» менял бы синтаксическую связь.
- issue: Отношение Божьих путей к хранящим завет
  choice: «для тех, кто хранит Его завет и Его свидетельства»
  alternative: «по отношению к тем, кто хранит Его завет и Его свидетельства»
  rationale: Основной текст сохраняет краткость и естественность, а сноска отмечает возможное реляционное понимание предлога, не делая вывода, будто Божий характер обусловлен человеческим послушанием.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Метафора путей и лаконичное именное сказуемое сохранены; архаизмы по возможности исключены, при этом термины «завет» и «свидетельства» оставлены ради точности и канонической узнаваемости.
