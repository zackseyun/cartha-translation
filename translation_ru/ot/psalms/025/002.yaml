  text: אֱֽלֹהַ֗/י בְּ/ךָ֣ בָ֭טַחְתִּי אַל אֵב֑וֹשָׁה אַל יַֽעַלְצ֖וּ אֹיְבַ֣/י לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/002.yaml
  text: My God[a], in you I trust; do not let me be put to shame[b]; do not let my enemies exult over me.
translation:
  language: ru
  text: Бог мой, на Тебя я уповаю. Да не буду я посрамлён[a], да не ликуют надо мной мои враги[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «да не постыжусь я». Еврейский глагол может означать как внутреннее чувство стыда, так и публичное посрамление, бесчестье.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «да не торжествуют надо мной»; «да не радуются надо мной». Еврейский глагол обозначает восторженное ликование, здесь — злорадство врагов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Бог мой
  rationale: Форма с суффиксом 1-го лица единственного числа означает «мой Бог». Порядок слов сохраняет поэтическое прямое обращение без добавления отсутствующего в еврейском междометия «о».
- source_word: בְּךָ
  choice: на Тебя
  rationale: 'Предлог ב при בטח обозначает того, на кого возлагают доверие; по-русски естественно: «уповать на кого-либо».'
- source_word: בָטַחְתִּי
  choice: я уповаю
  rationale: Перфект 1-го лица может выражать установившееся состояние доверия. Настоящее время естественно передаёт продолжающееся и твёрдое упование в контексте молитвы.
- source_word: אַל אֵבוֹשָׁה
  choice: Да не буду я посрамлён
  rationale: אַל с волитивной формой выражает просьбу. בושׁ допускает как внутренний стыд, так и публичное посрамление; контекст противостояния врагам делает «посрамлён» наиболее уместным, не устраняя альтернативу в сноске.
- source_word: אַל יַעַלְצוּ
  choice: да не ликуют
  rationale: Повтор אַל передаётся параллельной отрицательной просьбой. עלץ означает восторженно радоваться, ликовать; «ликовать» сохраняет поэтический регистр и оттенок злорадного торжества.
- source_word: אֹיְבַי לִי
  choice: надо мной мои враги
  rationale: אֹיְבַי прямо означает «мои враги», а לִי при глаголе ликования указывает на человека, над которым злорадствуют; естественный русский оборот — «ликовать над кем-либо».
theological_decisions:
- issue: Смысл просьбы псалмопевца о стыде
  choice: Да не буду я посрамлён
  alternative: Да не постыжусь я
  rationale: Основной текст подчёркивает публичное поражение и утрату чести перед врагами, при этом сноска сохраняет возможный оттенок внутреннего стыда. Перевод не определяет заранее, каким именно образом Бог дарует оправдание.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. «Уповаю», «посрамлён» и конструкция «да не» слегка возвышенны, но понятны современному читателю; параллелизм еврейской строки сохранён. Заглавное «Тебя» следует принятой русской традиции благоговейного обращения к Богу.
