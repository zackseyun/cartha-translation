  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/001.yaml
  text: Of David. To you[a], O Yahweh, I lift up my soul.
translation:
  language: ru
  text: 'Давида.


    К Тебе, Яхве, я возношу свою душу[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою жизнь» или «самого себя». Еврейское слово נֶפֶשׁ («душа») может обозначать всего человека, а не только его нематериальную часть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: Предлог לְ в заголовках псалмов обозначает связь с Давидом, но сам по себе не уточняет, идёт ли речь об авторстве, посвящении или иной принадлежности. Краткое «Давида» сохраняет эту неоднозначность и не добавляет отсутствующего в еврейском тексте слова «псалом».
- source_word: אֵלֶיךָ
  choice: К Тебе
  rationale: Предлог אֶל с суффиксом второго лица мужского рода единственного числа прямо означает направленность «к Тебе». Вынесение в начало сохраняет смысловой акцент еврейской строки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул. Форма «Яхве» ясна современному русскому читателю и отражает принятую научную реконструкцию произношения.
- source_word: נַפְשִׁי
  choice: свою душу
  rationale: נֶפֶשׁ может означать душу, жизнь, самого человека или всю его личность. «Свою душу» сохраняет образ и традиционную выразительность исходного оборота, а более широкое значение отмечено в сноске.
- source_word: אֶשָּׂא
  choice: я возношу
  rationale: Форма глагола נָשָׂא означает «поднимать, возносить, нести». В сочетании с «душой» глагол «возношу» естественно передаёт метафору обращения к Богу и направленного на Него упования.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. «Яхве» сохраняет имя, не подменяя его титулом «Господь»; вариант «Иегова» основан на более позднем смешении согласных тетраграмматона с гласными заменяющего чтения.
- issue: Значение נֶפֶשׁ в выражении «возношу свою душу»
  choice: Сохранить «душу» и пояснить широту значения в сноске
  alternative: Перевести «свою жизнь» или «самого себя»
  rationale: Контекст допускает понимание всей личности или жизни молящегося, но не требует сводить выражение только к одному из этих значений. Буквальный образ сохраняет богословскую и поэтическую многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Начальный порядок слов сохраняет акцент исходного текста; обращение «Яхве» выделено запятыми. Местоимение «Тебе» написано с прописной буквы в соответствии с уважительным русским библейским употреблением.
