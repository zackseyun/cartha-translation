  text: לְ/דָוִ֡ד אֵלֶ֥י/ךָ יְ֝הוָ֗ה נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/000.yaml
  text: Of David. To you[a], Yahweh, I lift up my soul.
translation:
  language: ru
  text: 'Давида.


    К Тебе, Яхве, возношу я душу мою.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жизнь мою» либо «самого себя». Еврейское слово нэфеш («душа») может обозначать всего человека, а не только его нематериальную часть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая надпись сохраняет формальную неоднозначность еврейского выражения: оно может указывать на авторство, принадлежность, посвящение или связь с Давидом.'
- source_word: אֵלֶיךָ
  choice: К Тебе
  rationale: Предлог направления естественно передан русским «к»; вынесение дополнения вперёд сохраняет акцент оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменено титулом «Господь».
- source_word: נַפְשִׁי
  choice: душу мою
  rationale: Сохранён традиционный и формально близкий эквивалент; примечание поясняет, что נֶפֶשׁ может означать жизнь или всего человека.
- source_word: אֶשָּׂא
  choice: возношу я
  rationale: Передаёт образ поднятия или устремления себя к Богу и сохраняет поэтическую возвышенность.
theological_decisions:
- issue: Значение надписания לְדָוִד
  choice: Давида
  alternative: Псалом Давида / Давидов
  rationale: Не добавляется слово «псалом», отсутствующее в данном еврейском надписании, и не устраняется возможная широта отношения к Давиду.
- issue: Антропологический смысл נַפְשִׁי
  choice: душу мою с поясняющей сноской
  alternative: себя / жизнь мою
  rationale: Основной текст сохраняет образ и традиционную лексику, а сноска не позволяет необоснованно сузить смысл до одной лишь нематериальной части человека.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Инверсия «возношу я душу мою» сохраняет поэтический ритм и акцент, оставаясь понятной современному читателю.
