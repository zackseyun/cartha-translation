id: PSA.25.3
reference: Psalms 25:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: גַּ֣ם כָּל קֹ֭וֶי/ךָ לֹ֣א יֵבֹ֑שׁוּ יֵ֝בֹ֗שׁוּ הַ/בּוֹגְדִ֥ים רֵיקָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/003.yaml
  text: Indeed[a], none of those who wait for you will be put to shame[b]; those who deal treacherously without cause will be put to shame.
translation:
  language: ru
  text: Да, никто из ожидающих Тебя не будет посрамлён; посрамлены будут вероломные без причины.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вероломные напрасно»; возможно также: «предающие ни за что». Еврейское слово допускает здесь разные понимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Да
  rationale: В начале утверждения частица усиливает и подтверждает сказанное; «Да» естественно передаёт эту функцию в русской поэтической речи.
- source_word: כָּל קֹוֶיךָ לֹא יֵבֹשׁוּ
  choice: никто из ожидающих Тебя не будет посрамлён
  rationale: Еврейское сочетание «все ожидающие Тебя не...» идиоматически передано как универсальное отрицание; קוה означает ожидание, исполненное надежды.
- source_word: יֵבֹשׁוּ / לֹא יֵבֹשׁוּ
  choice: будут посрамлены / не будет посрамлён
  rationale: בוש здесь указывает на пережитый позор и крушение надежды. Повтор одного русского корня сохраняет контрастный параллелизм стиха.
- source_word: הַבּוֹגְדִים
  choice: вероломные
  rationale: Причастие от בגד обозначает тех, кто поступает неверно, предательски; субстантивированное прилагательное звучит по-русски естественно и ёмко.
- source_word: רֵיקָם
  choice: без причины
  rationale: Наречие может описывать вероломство как беспричинное и неоправданное; при этом допускает и иные синтаксико-смысловые прочтения, отмеченные в сноске.
theological_decisions:
- issue: К кому относится רֵיקָם и какой оттенок оно выражает
  choice: «вероломные без причины» — те, кто поступает вероломно без основания
  alternative: «вероломные напрасно» или «предающие ни за что»
  rationale: Синтаксис и семантический диапазон רֵיקָם допускают несколько пониманий. Основной текст следует контекстуально вероятному прочтению, не превращая его в богословское уточнение; неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Местоимение «Тебя» написано с прописной буквы как уважительное обращение к Богу. Инверсия во второй строке сохраняет контраст и поэтический параллелизм.
