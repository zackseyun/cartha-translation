base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/013.yaml
  text: His soul will dwell in goodness[b][a], and his offspring will inherit the land.
translation:
  language: ru
  text: Душа его будет пребывать в благополучии[b], и потомство его унаследует землю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всю землю», «мир». Еврейское אֶרֶץ может означать «землю, страну» или «всю землю, мир»; в сочетании с «унаследует» возможно также понимание как земли обетования.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «будет ночевать»; также возможно: «будет обитать». Еврейский глагол рисует образ ночлега или продолжительного пребывания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: душа его
  rationale: Сохраняет еврейский поэтический образ и грамматический субъект; здесь נֶפֶשׁ может обозначать душу, жизнь или самого человека.
- source_word: בְּטוֹב
  choice: во благе
  rationale: 'Передаёт широкий смысл טוֹב: благо, благополучие и добро, не сужая его до материального процветания.'
- source_word: תָלִין
  choice: будет пребывать
  rationale: Глагол לון буквально связан с ночлегом, но здесь образно означает оставаться или обитать; «пребывать» естественно передаёт устойчивость состояния.
- source_word: וְזַרְעוֹ
  choice: и потомство его
  rationale: В данном контексте זֶרַע означает потомство; перевод сохраняет собирательное единственное число еврейского текста.
- source_word: יִירַשׁ
  choice: унаследует
  rationale: Передаёт значение ירשׁ и сохраняет библейскую связь с получением земли по обетованию.
- source_word: אָרֶץ
  choice: землю
  rationale: В сочетании с ירשׁ вероятен заветный смысл обещанной земли, однако еврейское слово допускает и более широкое значение «земля» как весь мир.
theological_decisions:
- issue: Объём значения אָרֶץ в сочетании с יִירַשׁ
  choice: землю, вероятно в смысле земли обетования
  alternative: землю как весь мир
  rationale: Формула наследования земли перекликается с заветной и территориальной лексикой Еврейской Библии, но более широкое прочтение остаётся возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Инверсия «душа его», «потомство его» сохраняет параллелизм стиха, оставаясь понятной современному читателю.
