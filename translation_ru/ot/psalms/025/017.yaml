  yaml_path: translation/ot/psalms/025/017.yaml
  text: The troubles of my heart have multiplied[b][a]; bring me out of my distresses.
translation:
  language: ru
  text: Скорби моего сердца умножились[a]; выведи меня из моих бедствий[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «расширились» или «стали шире».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из моих теснин» — древнееврейское слово изображает бедствие как стеснённое пространство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹת
  choice: скорби
  rationale: Существительное обозначает беды, тяготы и обстоятельства, причиняющие страдание. «Скорби» естественно сочетаются с образом сердца и сохраняют широкий смысл исходного слова.
- source_word: לְבָבִי
  choice: моего сердца
  rationale: לֵבָב обозначает внутреннего человека, включая чувства и мысли. «Сердце» сохраняет древнееврейский антропологический образ и понятно современному читателю.
- source_word: הִרְחִיבוּ
  choice: умножились
  rationale: Буквально глагол связан с расширением или увеличением. В сочетании со скорбями «умножились» ясно передаёт их возрастание, а буквальный пространственный образ отмечен в сноске.
- source_word: מִמְּצוּקוֹתַי
  choice: из моих бедствий
  rationale: Слово выражает стеснённость, теснину и вызванное ею бедственное положение. «Из моих бедствий» естественно по-русски передаёт смысл, сохраняя множественное число; конкретный образ теснин дан в сноске.
- source_word: הוֹצִיאֵנִי
  choice: выведи меня
  rationale: Форма означает «выведи» или «заставь выйти». Такой перевод сохраняет конкретный образ избавления из стеснённого положения.
theological_decisions:
- issue: 'Характер скорбей: внутренние переживания или внешние беды, затрагивающие сердце'
  choice: Сохранено выражение «скорби моего сердца» без уточнения их происхождения.
  alternative: «Муки в моём сердце» или «беды, терзающие моё сердце».
  rationale: Древнееврейская конструкция допускает смысл скорбей, переживаемых внутренним человеком, но не требует сводить их исключительно к эмоциям или, наоборот, к внешним обстоятельствам.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Синтаксический параллелизм и конкретный образ «выведи» сохранены; буквальные пространственные образы пояснены в сносках.
