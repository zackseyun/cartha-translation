  text: Тайна Господа — для боящихся Его, и Свой завет Он открывает им.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Доверительный совет Господа — для боящихся Его». Еврейское слово, переведённое как «тайна», может также означать доверительный совет или близость в доверительном круге. Во второй строке глагольное действие подразумевается; возможно понимание: «и Его завет — чтобы дать им познать его».'
    reason: Сохраняет многозначность סוֹד и отмечает эллиптическую, синтаксически компактную конструкцию וּבְרִיתוֹ לְהוֹדִיעָם без навязывания одного толкования.
lexical_decisions:
- source_word: סוֹד
  choice: близкое общение
  rationale: Слово обозначает доверительный круг, близость и сообщаемое в нём сокровенное знание. «Близкое общение» естественно по-русски передаёт личностный смысл, не сужая его только до «совета» или «тайны».
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, уместная для литературного библейского текста.
- source_word: לִירֵאָיו
  choice: для боящихся Его
  rationale: Сохраняет традиционный и богословски ёмкий язык благоговейного страха перед Богом.
- source_word: וּבְרִיתוֹ
  choice: и Свой завет
  rationale: Передаёт существительное בְּרִית как «завет»; возвратное притяжательное местоимение естественно связывает завет с Господом.
- source_word: לְהוֹדִיעָם
  choice: Он открывает им
  rationale: 'Инфинитив с ל допускает смысл цели или результата; по контексту выражение естественно понимается как действие Господа: Он даёт боящимся Его познать завет.'
theological_decisions:
- issue: Синтаксическая связь לְהוֹדִיעָם во второй строке
  choice: Свой завет Он открывает им
  alternative: и Его завет — чтобы дать им познать его
  rationale: В еврейской строке сказуемое подразумевается, а инфинитив допускает несколько синтаксических прочтений. Основной текст передаёт наиболее естественный смысл, тогда как буквальная неоднозначность отмечена в сноске.
- issue: Смысл סוֹד применительно к отношениям Господа с боящимися Его
  choice: близкое общение
  alternative: тайна / совет Господа
  rationale: Выбор сохраняет идею доверительной близости и участия в Божьем сокровенном совете, не превращая стих в утверждение лишь о секретной информации.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмового стиля. Формула «боящихся Его» сохранена как понятное традиционное выражение благоговения; инверсия во второй строке поддерживает поэтический параллелизм.
