lexical_decisions:
- source_word: רְאֵה
  choice: Посмотри
  rationale: Повелительная форма мужского рода единственного числа обращена к Богу. «Посмотри» естественно передаёт молитвенную просьбу обратить внимание.
- source_word: אוֹיְבַי
  choice: на моих врагов
  rationale: Прямо передаёт существительное с суффиксом первого лица единственного числа; управление соответствует русскому глаголу «посмотреть».
- source_word: כִּי רָבּוּ
  choice: как их много
  rationale: כִּי здесь допускает оттенок «ибо/что», а в эмоциональной молитвенной речи конструкция «как их много» естественно выражает многочисленность врагов, не добавляя идеи их размножения.
- source_word: וְשִׂנְאַת חָמָס שְׂנֵאוּנִי
  choice: и какой жестокой ненавистью они меня ненавидят
  rationale: Сохраняется эмфатическая внутренняя конструкция с повтором корня שׂנא. חָמָס передано как «жестокой», что выражает насильственный, беспощадный характер ненависти.
