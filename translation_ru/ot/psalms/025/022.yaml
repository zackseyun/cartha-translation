lexical_decisions:
- source_word: פְּדֵה
  choice: Искупи
  rationale: Повелительная форма глагола פדה выражает избавление посредством выкупа или искупления. «Искупи» сохраняет богословскую и заветную насыщенность слова, не сводя его к общему «избавь».
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Слово является обращением к Богу; русский звательный по функции вариант «Боже» естественно передаёт это обращение.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: В данном контексте имя обозначает народ завета как единое целое.
- source_word: מִכֹּל
  choice: от всех
  rationale: Сочетание предлога מִן с כֹּל указывает на избавление от всей совокупности бед; «от всех» — краткая и естественная передача.
- source_word: צָרוֹתָיו
  choice: его бед
  rationale: צָרוֹת означает беды, тяготы или несчастья. «Бед» звучит естественно и ёмко; местоимение «его» сохраняет мужской род единственного числа еврейского суффикса и согласуется с собирательным «Израиль».
theological_decisions:
- issue: Единственное число при собирательном имени «Израиль»
  choice: Сохранить форму «его бед»
  alternative: «их бед», если понимать Израиль как множество людей и согласовывать по смыслу
  rationale: В еврейском тексте у слова «беды» стоит местоименный суффикс 3-го лица мужского рода единственного числа. Передача «его» сохраняет грамматическую форму оригинала и образ Израиля как единого народа, не устраняя возможное собирательное понимание.
translation_notes:
  register: Современный литературный русский язык с кратким, молитвенным и возвышенным звучанием. Порядок слов сохраняет прямоту еврейского прошения; «Боже» ясно оформляет обращение.
