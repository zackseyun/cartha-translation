  text: שָׁמְרָ֣/ה נַ֭פְשִׁ/י וְ/הַצִּילֵ֑/נִי אַל אֵ֝ב֗וֹשׁ כִּֽי חָסִ֥יתִי בָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/020.yaml
  text: Guard my life and rescue me; let me not be put to shame, for I take refuge in you.
translation:
  language: ru
  text: Сохрани мою жизнь и избавь меня; да не буду я посрамлён, ведь я укрываюсь у Тебя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמְרָה נַפְשִׁי
  choice: Сохрани мою жизнь
  rationale: נֶפֶשׁ здесь обозначает жизнь или самого человека, находящегося в опасности; «жизнь» естественно передаёт смысл просьбы и не сужает его до нематериальной «души».
- source_word: וְהַצִּילֵנִי
  choice: и избавь меня
  rationale: Глагол נצל в породе hифиль выражает спасение или избавление от опасности; «избавь» сохраняет краткость и молитвенный регистр.
- source_word: אַל אֵבוֹשׁ
  choice: да не буду я посрамлён
  rationale: Форма с אַל выражает просьбу о недопущении исхода; בוש включает переживание позора вследствие постигшей неудачи, поэтому сохранена пассивно-результативная формулировка.
- source_word: חָסִיתִי בָךְ
  choice: я укрываюсь у Тебя
  rationale: חסה описывает поиск убежища и доверительное пребывание под защитой; настоящее время по-русски естественно передаёт состояние, лежащее в основании просьбы.
theological_decisions:
- issue: Значение נֶפֶשׁ в просьбе о спасении
  choice: мою жизнь
  alternative: мою душу
  rationale: Контекст личной опасности поддерживает целостное значение «жизнь», не вводя позднейшего противопоставления души и тела.
- issue: Характер упования в חָסִיתִי בָךְ
  choice: я укрываюсь у Тебя
  alternative: я уповаю на Тебя
  rationale: Образ убежища непосредственно отражает глагол חסה, одновременно сохраняя подразумеваемое доверие без замены образа абстрактным понятием.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным молитвенным звучанием. Заглавная буква в «Тебя» употреблена как традиционный знак почтительного обращения к Богу, без добавления отсутствующего в исходном тексте имени.
