  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: повелительную просьбу «сохрани/защити мою жизнь», «избавь меня», просьбу не допустить посрамления и основание этой просьбы в поиске убежища у Бога. «Мою жизнь» корректно передаёт נַפְשִׁי в данном контексте, не навязывая позднейшего дуалистического смысла «душа».'
