lexical_decisions:
- source_word: הַדְרִיכֵנִי
  choice: Направляй меня
  rationale: Побудительная форма глагола דרך означает вести или направлять по пути. «Направляй меня» естественно звучит по-русски и сохраняет образ движения.
- source_word: בַאֲמִתֶּךָ
  choice: в Твоей истине
  rationale: אֱמֶת может означать истину, надёжность или верность. В сочетании с просьбой направлять и учить «в Твоей истине» передаёт сферу и основание Божьего водительства, не исключая оттенка верности.
- source_word: וְלַמְּדֵנִי
  choice: и учи меня
  rationale: Интенсивная побудительная форма למד прямо выражает просьбу учить; выбран наиболее ясный и естественный русский эквивалент.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание просьбы. «Потому что» ясно передаёт причинную связь в современном русском языке.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: Бог моего спасения
  rationale: Сохраняется именная конструкция оригинала, представляющая Бога источником спасения и избавления.
- source_word: קִוִּיתִי
  choice: я жду
  rationale: קוה обозначает ожидание, соединённое с надеждой. «Жду» сохраняет конкретный образ ожидания, а оттенок упования отмечен в сноске.
- source_word: אוֹתְךָ
  choice: Тебя
  rationale: При קוה местоименный объект указывает на того, кого ожидают; русское «Тебя я жду» естественно и подчёркивает объект ожидания.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Выражение обозначает продолжительность на протяжении всего дня; «весь день» — естественный современный русский оборот.
theological_decisions:
- issue: Значение אֱמֶת в связи с Божьим водительством
  choice: «истина» в основном тексте
  alternative: «верность»
  rationale: Сочетание просьб направлять и учить поддерживает понимание Божьей истины как содержания или нормы водительства. Лексически возможное значение «верность» сохранено в сноске.
- issue: Оттенок значения קוה
  choice: «жду» в основном тексте
  alternative: «надеюсь», «ожидаю с надеждой»
  rationale: Еврейский глагол объединяет ожидание и надежду. Основной текст сохраняет образ ожидания, не устраняя оттенок упования, который указан в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис остаётся ясным для широкого читателя и сохраняет параллелизм просьбы и исповедания.
