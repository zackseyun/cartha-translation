  text: טוֹב וְ/יָשָׁ֥ר יְהוָ֑ה עַל כֵּ֤ן יוֹרֶ֖ה חַטָּאִ֣ים בַּ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/008.yaml
  text: Good and upright is Yahweh[a]; therefore he instructs sinners in the way.
translation:
  language: ru
  text: Благ и праведен Яхве; поэтому Он наставляет грешников на путь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «учит грешников пути»; возможно также: «указывает грешникам путь». Глагол может означать «учить», «наставлять» или «направлять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: благ
  rationale: Передаёт нравственную благость и естественно сочетается с характеристикой Бога в возвышенном, но понятном современном русском языке.
- source_word: וְיָשָׁר
  choice: и праведен
  rationale: В данном контексте יָשָׁר обозначает нравственную прямоту и справедливость; «праведен» звучит естественнее буквального «прям».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: 'Ясно выражает следствие: именно потому, что Яхве благ и праведен, Он наставляет грешников.'
- source_word: יוֹרֶה
  choice: наставляет
  rationale: Форма породы хифиль от ירה допускает значения обучения, наставления и указания направления; «наставляет» сохраняет педагогический и путевой оттенки.
- source_word: חַטָּאִים
  choice: грешников
  rationale: Прямо передаёт субстантивированное множественное число и не смягчает нравственную характеристику.
- source_word: בַּדָּרֶךְ
  choice: на путь
  rationale: В сочетании с русским глаголом «наставлять» предлог «на» создаёт естественное выражение и сохраняет метафору жизненного пути, не добавляя отсутствующего в еврейском тексте определения «правильный».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Смысл выражения בַּדָּרֶךְ
  choice: наставляет грешников на путь
  alternative: учит грешников пути / указывает грешникам путь
  rationale: Еврейская конструкция допускает как обучение пути, так и направление на него. Основной текст сохраняет образ пути и естественен по-русски, а примечание отмечает подлинную лексико-синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Инверсия «Благ и праведен Яхве» сохраняет эмфатический порядок еврейской строки; местоимение «Он» помогает естественно обозначить смену от именной характеристики к действию.
