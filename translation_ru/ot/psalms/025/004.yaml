  text: Make your ways known to me[a], O Yahweh; teach me your paths.
translation:
  language: ru
  text: Яхве, дай мне познать Твои пути[a]; научи меня Твоим стезям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделай так, чтобы я познал»; традиционно: «покажи мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּרָכֶיךָ
  choice: Твои пути
  rationale: Сохраняет обычную для דֶּרֶךְ метафору пути как образа образа действий или установленного Богом жизненного направления, не сужая смысл только до нравственных предписаний.
- source_word: יְהוָה
  choice: Господи
  rationale: В русской библейской и богослужебной традиции тетраграмматон обычно передаётся как «Господь»; форма звательного обращения «Господи» естественна для молитвенной речи. Сноска сохраняет сведения о личном имени в еврейском тексте.
- source_word: הוֹדִיעֵנִי
  choice: Дай мне познать
  rationale: Каузативная форма глагола ידע буквально выражает просьбу «сделай так, чтобы я узнал». «Дай мне познать» передаёт эту каузативность естественно и достойно по-русски, не сводя просьбу лишь к зрительному «покажи».
- source_word: אֹרְחוֹתֶיךָ
  choice: Твоим стезям
  rationale: אֹרַח означает путь или тропу. «Стезям» сохраняет различие с דֶּרֶךְ и поэтический параллелизм; слово возвышенное, но понятное в контексте псалма.
- source_word: לַמְּדֵנִי
  choice: научи меня
  rationale: 'Прямо и естественно передаёт интенсивную форму повеления למד с суффиксом первого лица: просьбу к Богу наставить молящегося.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господи
  alternative: Яхве
  rationale: Основной текст использует укоренённую и естественную для русской молитвенной речи передачу «Господи», а сноска прямо указывает, что в еврейском стоит личное имя יהוה. Это не скрывает исходную форму и не навязывает спорное русское произношение тетраграмматона.
- issue: Смысл просьбы о Божьих путях
  choice: Сохранена метафора путей и стезей
  alternative: Научи меня Своей воле или Своим заповедям
  rationale: Еврейский текст не уточняет, идёт ли речь исключительно о нравственных заповедях, Божьем образе действий или руководстве жизнью; метафорический перевод сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский с молитвенно-поэтической возвышенностью. «Стези» употреблено для сохранения различия двух еврейских слов и параллелизма; синтаксис остаётся ясным для современного читателя.
