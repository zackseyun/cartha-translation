id: PSA.25.15
reference: Psalms 25:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עֵינַ֣/י תָּ֭מִיד אֶל יְהוָ֑ה כִּ֤י הֽוּא יוֹצִ֖יא מֵ/רֶ֣שֶׁת רַגְלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/015.yaml
  text: My eyes are continually toward Yahweh[a], for he will bring my feet out of the net.
translation:
  language: ru
  text: 'Мои глаза всегда обращены к Яхве,

    потому что Он вызволит мои ноги из сети.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵינַי
  choice: Мои глаза
  rationale: Сохраняет конкретный телесный образ еврейского оригинала; более отвлечённое «мой взор» менее буквально.
- source_word: תָּמִיד
  choice: всегда
  rationale: Естественно передаёт постоянную, неизменную направленность внимания в краткой поэтической строке.
- source_word: אֶל
  choice: обращены к
  rationale: В сочетании с «глаза» по-русски естественно выражает направленность взгляда, не устраняя образ оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: כִּי
  choice: потому что
  rationale: 'Передаёт причинную связь: псалмопевец обращает взгляд к Яхве, поскольку ожидает от Него избавления.'
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение сохранено; в русском его явное употребление передаёт лёгкое смысловое выделение субъекта.
- source_word: יוֹצִיא
  choice: вызволит
  rationale: Передаёт каузативное значение «выведет, извлечёт» и естественно сочетается с образом ног, попавших в сеть.
- source_word: מֵרֶשֶׁת
  choice: из сети
  rationale: Сохраняет прямой образ ловчей сети и значение исходной конструкции с מִן — извлечение из неё.
- source_word: רַגְלָי
  choice: мои ноги
  rationale: Буквально сохраняет телесный образ запутавшихся ног, не заменяя его более общим образом пути или шагов.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и представляет наиболее принятую научную реконструкцию произношения, тогда как «Господь» является заменой титулом, а «Иегова» — поздней гибридной формой.
- issue: Характер ожидаемого избавления
  choice: Сохранён конкретный образ извлечения ног из сети
  alternative: «Он избавит меня от ловушки»
  rationale: Оригинал говорит именно о ногах и сети. Конкретная метафора оставлена без сведения её к одному возможному виду духовной или жизненной опасности.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Синтаксис простой и ясный; конкретные образы оригинала сохранены. Заглавная буква в «Он» служит принятой русской формой почтительного обозначения Бога, не меняя смысла местоимения.
