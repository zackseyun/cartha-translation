  text: מִי זֶ֣ה הָ֭/אִישׁ יְרֵ֣א יְהוָ֑ה י֝וֹרֶ֗/נּוּ בְּ/דֶ֣רֶךְ יִבְחָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/012.yaml
  text: Who is the man who fears Yahweh? He will instruct him in the way he should choose[a].
translation:
  language: ru
  text: Кто этот человек, боящийся Яхве? Он наставит его, какой путь ему избрать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он наставит его на пути, который Он изберёт»; возможно также: «...на пути, который тот избирает» или «изберёт». Еврейский текст допускает разные понимания субъекта и временно-модального оттенка последнего глагола.'
    reason: 'Лексико-синтаксическая неоднозначность יִבְחָר: субъект не выражен и может пониматься как человек или Яхве; имперфект допускает настоящее, будущее либо модальный оттенок.'
lexical_decisions:
- source_word: מִי זֶה הָאִישׁ
  choice: Кто тот человек
  rationale: Сочетание вопросительного מִי, указательного זֶה и существительного הָאִישׁ образует риторический вопрос. «Кто тот человек» естественно по-русски и сохраняет указательный оттенок и грамматически мужской единственный образ оригинала.
- source_word: יְרֵא יְהוָה
  choice: который боится Яхве
  rationale: Причастие יְרֵא обозначает благоговейный страх перед Богом; «боится» сохраняет весомую библейскую формулировку, не сводя её лишь к почтению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: יוֹרֶנּוּ
  choice: Он наставит его
  rationale: Hифиль от ירה может означать «учить», «наставлять», «указывать». «Наставит» сочетает обучение и направление; по контексту подразумеваемый субъект — Яхве, а объектный суффикс относится к богобоязненному человеку.
- source_word: בְּדֶרֶךְ
  choice: на путь
  rationale: דֶּרֶךְ обозначает путь как направление и образ жизни. При русском глаголе «наставить» конструкция «на путь» звучит естественно и сохраняет метафору.
- source_word: יִבְחָר
  choice: который тот изберёт
  rationale: Имперфект допускает оттенки настоящего, будущего и модальности. Будущая форма «изберёт» сохраняет аспектуальную открытость лучше, чем однозначное «должен избрать»; местоимение «тот» проясняет, что субъектом может быть человек, не снимая отмеченной в сноске неоднозначности.
theological_decisions:
- issue: Субъект глагола יוֹרֶנּוּ («наставит его»)
  choice: Подразумеваемый субъект — Яхве, наставляющий боящегося Его человека.
  alternative: Неопределённый субъект («его наставят») либо иной невыраженный субъект.
  rationale: Хотя подлежащее при глаголе прямо не названо, ближайший контекст естественно указывает на Яхве. Заглавное «Он» делает эту контекстуальную связь ясной, не добавляя нового персонажа.
- issue: Субъект и модальный оттенок יִבְחָר
  choice: 'В основном тексте субъектом принят человек: «который тот изберёт».'
  alternative: «который Он избирает» (субъект — Яхве) или модальное «который тот должен избрать».
  rationale: В еврейском местоимение при глаголе не выражено, а имперфект допускает несколько временных и модальных оттенков. Поэтому альтернативы сохранены в сноске, а основной текст избегает добавленного «должен».
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Сохранены традиционные библейские слова «боится», «наставит», «путь», но синтаксис сделан понятным обычному читателю. Личное имя יהוה передано как «Яхве».
