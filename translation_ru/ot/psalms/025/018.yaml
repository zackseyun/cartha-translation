  text: Look on my affliction and my trouble[a], and forgive all my sins.
translation:
  language: ru
  text: Взгляни на моё страдание и горе и прости все мои грехи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «подними (или: понеси) все мои грехи». Еврейский глагол может означать «поднять», «понести» или «унести»; здесь это образное выражение, означающее прощение грехов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Взгляни
  rationale: Повелительная форма обращения к Богу выражает просьбу не просто увидеть, а обратить милостивое внимание.
- source_word: עָנְיִי
  choice: моё страдание
  rationale: Слово обозначает бедствие, угнетённость или тяжёлое состояние; «страдание» сохраняет широкий смысл и не сводит его к материальной бедности.
- source_word: וַעֲמָלִי
  choice: и горе
  rationale: עָמָל может обозначать тяготу, мучение и беду; в параллели со «страданием» слово «горе» естественно передаёт переживаемую боль.
- source_word: וְשָׂא
  choice: и прости
  rationale: Глагол נשׂא буквально значит «поднять, понести, унести», но с грехами в качестве объекта идиоматически выражает их снятие, то есть прощение.
- source_word: לְכָל
  choice: все
  rationale: Предлог входит в еврейскую конструкцию при נשׂא; по-русски объект естественно оформляется без отдельной передачи предлога.
- source_word: חַטֹּאותָי
  choice: мои грехи
  rationale: Форма множественного числа обозначает нравственные проступки; «грехи» — точное и общепонятное соответствие.
theological_decisions:
- issue: Передача נשׂא с грехами в качестве объекта
  choice: «прости все мои грехи»
  alternative: «сними с меня все мои грехи» / «унеси все мои грехи»
  rationale: «Прости» ясно передаёт смысл еврейской идиомы о снятии греха, не добавляя специального богословского толкования; буквальный образ отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим, но общепонятным звучанием. «Взгляни» сохраняет достоинство обращения, а сочетание «страдание и горе» естественно передаёт параллельные существительные оригинала.
