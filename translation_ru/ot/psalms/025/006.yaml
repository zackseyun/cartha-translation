  yaml_path: translation/ot/psalms/025/006.yaml
  text: Remember your mercies[a], O Yahweh, and your steadfast love[c][b], for they are from of old.
translation:
  language: ru
  text: Вспомни, Яхве, о Твоём милосердии[a] и неизменной любви[b], ибо они издревле[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «о Твоих милостях»; также возможно: «о Твоём сострадании».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: еврейское слово стоит во множественном числе: «о проявлениях Твоей неизменной любви».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «от вечности», «извечно». Еврейское выражение может указывать как на глубокую древность, так и на вечную длительность.'
    reason: alternative_reading
lexical_decisions:
- source_word: זְכֹר
  choice: Вспомни
  rationale: Императив Qal, 2-е лицо мужского рода единственного числа от זכר. В молитвенном обращении естественно передаёт просьбу к Богу вновь обратить внимание и действовать согласно Своему милосердию.
- source_word: רַחֲמֶיךָ
  choice: о Твоём милосердии
  rationale: Форма множественного числа с суффиксом 2-го лица может обозначать полноту или многократные проявления сострадания. Русское собирательное единственное число звучит естественно; формальный плюральный оттенок отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וַחֲסָדֶיךָ
  choice: и неизменной любви
  rationale: חסד обозначает верную, устойчивую и деятельную любовь. Единственное число естественно по-русски, тогда как еврейская форма множественного числа отражена в сноске.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание просьбы; «ведь» естественно связывает утверждение с предшествующим призывом.
- source_word: מֵעוֹלָם
  choice: издревле
  rationale: Передаёт удалённость во времени, не исключая возможного смысла вечности и не усиливая его без необходимости.
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение 3-го лица множественного числа отсылает к милосердию и любви как к двум названным реалиям.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Временной смысл מֵעוֹלָם
  choice: издревле
  alternative: от вечности / вовеки
  rationale: Выражение допускает как смысл глубокой древности, так и вечной длительности. Основной текст сохраняет контекстуально естественную неопределённость, а более сильный вариант отмечен в сноске.
- issue: Число רַחֲמִים и חֲסָדִים
  choice: естественные русские собирательные формы в единственном числе
  alternative: милости и проявления неизменной любви
  rationale: Еврейские формы стоят во множественном числе, однако буквальный русский плюрал звучал бы тяжеловесно и мог бы исказить смысл; число исходника явно отмечено в сносках.
translation_notes:
  register: Современный литературный русский с dignified молитвенной интонацией. Прописные местоимения при обращении к Богу употреблены как стилистический выбор. Формальные множественные числа переданы естественными русскими собирательными существительными, а исходная форма сохранена в сносках.
