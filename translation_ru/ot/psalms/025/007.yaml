source:
  edition: WLC
  text: חַטֹּ֤אות נְעוּרַ֨/י וּ/פְשָׁעַ֗/י אַל תִּ֫זְכֹּ֥ר כְּ/חַסְדְּ/ךָ֥ זְכָר לִ/י אַ֑תָּה לְמַ֖עַן טוּבְ/ךָ֣ יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/025/007.yaml
  text: Do not remember the sins of my youth or my transgressions[a]; according to your steadfast love, remember me—for the sake of your goodness[b], O Yahweh.
translation:
  language: ru
  text: Грехов моей юности и моих преступлений не вспоминай. По Твоей неизменной любви[a] вспомни меня — ради Твоей благости, Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское хесед может означать неизменную, верную любовь, а также милость; нередко это слово выражает верность в отношениях завета.
    reason: lexical_alternative
  - marker: b
    text: Яхве — передача еврейского имени יהוה; традиционно его также заменяют словом «Господь».
    reason: textual_tradition
lexical_decisions:
- source_word: חַטֹּאות נְעוּרַי
  choice: грехов моей юности
  rationale: Сочетание обозначает конкретные грехи, совершённые в юности; родительная конструкция передана прямо и естественно по-русски.
- source_word: וּפְשָׁעַי
  choice: и моих преступлений
  rationale: פשע указывает на сознательное нарушение или мятеж против установленной воли. «Преступления» сохраняет нравственно-правовую силу слова, а союз ו передан обычным значением «и».
- source_word: אַל תִּזְכֹּר
  choice: не вспоминай
  rationale: Отрицательная просьба означает не просто забывание, а просьбу не принимать грехи в расчёт и не вменять их.
- source_word: כְּחַסְדְּךָ
  choice: по Твоей неизменной любви
  rationale: Предлог כְ задаёт основание и меру действия, а חסד соединяет значения любви, верности и милости. «Неизменная любовь» естественно передаёт устойчивость этой благосклонности, не сводя её только к состраданию.
- source_word: זְכָר לִי אַתָּה
  choice: вспомни меня
  rationale: Повелительная форма создаёт намеренный контраст с просьбой не вспоминать грехи. Местоимение אַתָּה усиливает обращение к Богу, но отдельное «Ты» по-русски сделало бы фразу тяжеловесной.
- source_word: לְמַעַן טוּבְךָ
  choice: ради Твоей благости
  rationale: לְמַעַן указывает на основание или побуждение просьбы, сосредоточенное в собственной благости Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом «Господь».
theological_decisions:
- issue: Смысл חסד
  choice: неизменная любовь
  alternative: милость; верная любовь; заветная любовь
  rationale: Еврейское слово включает милость и стойкую верность в отношениях. Выбранный вариант сохраняет широту смысла и не вводит в основной текст отсутствующее здесь слово «завет».
- issue: Контраст двух употреблений זכר
  choice: «не вспоминай» грехов, но «вспомни меня»
  alternative: «не вменяй» грехов, но «помни обо мне благосклонно»
  rationale: Повтор одного русского корня сохраняет риторический контраст оригинала и его судебно-реляционное напряжение, не добавляя в текст пояснений.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью. Сохранены повтор «вспоминай / вспомни», параллелизм просьб и обращение по имени в конце стиха. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской религиозной стилистикой.
