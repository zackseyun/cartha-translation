id: PSA.148.13
reference: Psalms 148:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יְהַלְל֤וּ אֶת שֵׁ֬ם יְהוָ֗ה כִּֽי נִשְׂגָּ֣ב שְׁמ֣/וֹ לְ/בַדּ֑/וֹ ה֝וֹד֗/וֹ עַל אֶ֥רֶץ וְ/שָׁמָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/013.yaml
  text: Let them praise the name of Yahweh[a], for his name alone is exalted; his majesty is above earth and heaven.
translation:
  language: ru
  text: Пусть восхваляют имя Яхве, ведь лишь его имя превознесено; его величие[a] — над землёй и небом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его великолепие» или «его слава».'
    reason: Лексема הוֹד допускает значения величия, великолепия и славы; основной текст выбирает естественное для контекста «величие», а сноска сохраняет другие возможные оттенки.
lexical_decisions:
- source_word: יְהַלְלוּ
  choice: Пусть восхваляют
  rationale: Имперфект 3-го лица множественного числа в гимническом контексте продолжает призыв псалма и имеет побудительное значение.
- source_word: שֵׁם
  choice: имя
  rationale: Буквальная передача сохраняет значимое для еврейской поэзии выражение «имя Яхве», включающее представление о явленной личности и славе Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом; форма «Яхве» является принятой современной русской транслитерацией предполагаемого произношения тетраграмматона.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для призыва к хвале; «ведь» естественно передаёт эту причинно-пояснительную связь по-русски.
- source_word: נִשְׂגָּב
  choice: превознесено
  rationale: Передаёт стативно-пассивный смысл высоты, недосягаемости и величия, уместный в контексте хвалы.
- source_word: שְׁמוֹ לְבַדּוֹ
  choice: лишь его имя
  rationale: Частица לְבַדּוֹ подчёркивает исключительность именно имени; формулировка не смещает акцент на «лишь он».
- source_word: הוֹדוֹ
  choice: его величие
  rationale: Слово הוֹד обозначает величие, великолепие или славу; «величие» естественно выражает царственное достоинство, сохраняя возможность иных оттенков в сноске.
- source_word: עַל
  choice: над
  rationale: Предлог выражает возвышенность и превосходство по отношению к земле и небу; русское «над» сохраняет пространственно-поэтический образ.
- source_word: אֶרֶץ וְשָׁמַיִם
  choice: землёй и небом
  rationale: Сохранены порядок и всеохватная поэтическая пара исходного текста; единственное число «небом» естественно для русского языка.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя. Транслитерация «Яхве» сохраняет это имя, не подменяя его титулом и не утверждая менее вероятное произношение «Иегова».
- issue: Исключительность в выражении שְׁמוֹ לְבַדּוֹ
  choice: лишь его имя
  alternative: лишь он
  rationale: Еврейский текст грамматически связывает значение исключительности со словом «имя». Эта формулировка сохраняет исходный акцент и не разрешает богословское напряжение путём перефразирования.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным поэтическим звучанием. Местоимения, относящиеся к Богу, написаны со строчной буквы согласно нейтральной современной норме. Точка с запятой сохраняет двучленную структуру стиха, а тире естественно восполняет отсутствующую в еврейском именную связку.
