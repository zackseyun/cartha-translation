lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Хвалите Его
  rationale: Форма повелительного наклонения во множественном числе от הלל с местоименным суффиксом 3-го лица мужского рода единственного числа прямо призывает нескольких адресатов хвалить Бога.
- source_word: שְׁמֵי הַשָּׁמַיִם
  choice: высшие небеса
  rationale: Буквальная конструкция «небеса небес» служит усилительным выражением и обозначает самые высокие небеса; выбранный вариант естественен в современном русском языке и сохраняет этот смысл.
- source_word: וְהַמַּיִם
  choice: и воды
  rationale: Определённая форма «воды» является вторым однородным адресатом того же повеления. В русском языке обращение ясно из контекста, поэтому добавлять местоимение «вы» не требуется.
- source_word: אֲשֶׁר מֵעַל הַשָּׁמָיִם
  choice: что над небесами
  rationale: Относительное придаточное определяет «воды», а מֵעַל передаёт пространственное положение выше небес. Разговорно нейтральное «что» здесь естественно и понятно, не снижая достоинства поэтической речи.
theological_decisions:
- issue: Космологический образ вод над небесами
  choice: Сохранить древний космологический образ без переосмысления.
  alternative: Истолковать воды метафорически или заменить их атмосферной влагой.
  rationale: Псалом призывает к хвале все части творения и прямо упоминает воды над небесами. Перевод сохраняет образ исходного текста, не согласуя его искусственно с позднейшими научными представлениями.
translation_notes:
  register: Современный литературный русский язык с ясным, возвышенным поэтическим звучанием. Множественное обращение передано формой «хвалите»; оба последующих существительных естественно воспринимаются как однородные обращения. Космологическая образность оригинала сохранена.
