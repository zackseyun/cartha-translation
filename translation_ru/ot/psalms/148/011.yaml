    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכֵי אֶרֶץ
  choice: цари земли
  rationale: Конструктивное сочетание буквально обозначает «цари земли»; без артикля оно естественно звучит как часть поэтического перечня.
- source_word: וְכָל לְאֻמִּים
  choice: и все народы
  rationale: לְאֻמִּים обозначает народы или нации; «народы» сохраняет широкий смысл и не вызывает узкой ассоциации с современными государствами.
- source_word: שָׂרִים
  choice: князья
  rationale: Слово обозначает высокопоставленных правителей или вельмож; «князья» сохраняет возвышенный поэтический регистр, не требуя непременно родства с царём.
- source_word: וְכָל שֹׁפְטֵי אָרֶץ
  choice: и все судьи земли
  rationale: שֹׁפְטֵי прямо называет тех, кто судит, а в данном параллелизме — представителей власти; «судьи» сохраняет наиболее непосредственный смысл.
- source_word: אֶרֶץ / אָרֶץ
  choice: земли
  rationale: В контексте всеобщего призыва псалма имеется в виду вся земля, а не отдельная страна; повтор передан одинаково.
theological_decisions:
- issue: Масштаб значения אֶרֶץ в перечне призываемых к хвале
  choice: земля в универсальном смысле
  alternative: страна, земля в локальном смысле
  rationale: Псалом обращается ко всему творению, поэтому широкий смысл лучше соответствует контексту, хотя само слово допускает и локальное прочтение.
translation_notes:
