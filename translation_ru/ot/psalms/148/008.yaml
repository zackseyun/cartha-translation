lexical_decisions:
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое и естественное соответствие в перечне явлений творения.
- source_word: וּבָרָד
  choice: и град
  rationale: בָּרָד обозначает град; союз וּ передан союзом «и».
- source_word: שֶׁלֶג
  choice: снег
  rationale: Обычное значение существительного в метеорологическом контексте.
- source_word: וְקִיטוֹר
  choice: и туман[a]
  rationale: קִיטוֹר может обозначать туман, пар или дым. «Туман» естественно входит в ряд атмосферных явлений и не связывает образ исключительно с горением; неоднозначность отмечена в сноске.
- source_word: רוּחַ סְעָרָה
  choice: бурный ветер
  rationale: Сочетание обозначает ветер, характеризуемый бурей. «Бурный ветер» сохраняет оба компонента и естественно звучит по-русски.
- source_word: עֹשָׂה
  choice: исполняющий
  rationale: В сочетании с דְבָרוֹ глагол עשה означает осуществление сказанного. «Исполняющий» передаёт продолжающееся действие причастия и звучит естественнее буквального «делающий».
- source_word: דְבָרוֹ
  choice: Его слово[b]
  rationale: Основное значение דָּבָר — «слово»; в данном контексте оно также может иметь смысл повеления. Основной текст сохраняет лексическую форму, а функциональное значение указано в сноске.
theological_decisions:
- issue: К кому относится суффикс 3-го лица мужского рода в דְבָרוֹ
  choice: «Его слово», то есть слово Бога, к прославлению Которого призывается творение
  alternative: Грамматически сам суффикс не называет своего референта, однако контекст всего псалма ясно указывает на Господа.
  rationale: Перечисленные явления природы представлены как исполняющие слово Бога. Прописная буква в «Его» является принятой русской издательской формой почтительного указания на Бога и не добавляет отдельного смыслового утверждения.
- issue: Характер действия в עֹשָׂה דְבָרוֹ
  choice: «исполняющий Его слово»
  alternative: «исполняющий Его повеление»
  rationale: Перевод сохраняет существительное «слово», но передаёт идиоматический смысл сочетания с עשה. Вариант «повеление» делает подразумеваемую властную функцию слова явной и поэтому дан в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим ритмом. Перечисление и параллелизм еврейского текста сохранены; буквальный гебраизм «делающий Его слово» заменён естественным русским «исполняющий Его слово».
