  yaml_path: translation/ot/psalms/148/003.yaml
  text: Praise him[a], sun and moon; praise him, all shining stars.
translation:
  language: ru
  text: 'Хвалите его, солнце и луна;

    хвалите его, все звёзды света[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более привычно: «все сияющие звёзды».'
    reason: 'Лексико-стилистическая альтернатива для כּוֹכְבֵי אוֹר: основной текст сохраняет буквальный образ «звёзды света», а примечание предлагает естественную смысловую передачу.'
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: хвалите его
  rationale: Форма повелительного наклонения во множественном числе с местоименным суффиксом 3-го лица мужского рода единственного числа. Перевод сохраняет прямое обращение к небесным светилам и поэтический повтор.
- source_word: שֶׁמֶשׁ
  choice: солнце
  rationale: Обычное словарное значение, естественное в прямом поэтическом обращении.
- source_word: וְיָרֵחַ
  choice: и луна
  rationale: Сохраняются стандартное значение существительного и соединительный союз.
- source_word: כָּל
  choice: все
  rationale: Собирательный квантор охватывает всю совокупность звёзд; «все» естественно в русском поэтическом обращении.
- source_word: כּוֹכְבֵי אוֹר
  choice: звёзды света
  rationale: Сочетание сохраняет еврейскую сопряжённую конструкцию «звёзды света» и её поэтическую образность, не сводя אוֹר лишь к признаку «сияющие».
theological_decisions:
- issue: Олицетворение небесных светил, призываемых к хвале
  choice: Сохранено прямое повелительное обращение к солнцу, луне и звёздам.
  alternative: 'Передать описательно: небесные светила возвещают или выражают хвалу.'
  rationale: В еврейском тексте небесным телам непосредственно адресованы формы повелительного наклонения множественного числа. Такой перевод сохраняет поэтическое богословие псалма, в котором всё творение призывается хвалить Бога.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Строчные местоимения в отношении Бога выбраны как нейтральная современная орфографическая практика; синтаксический параллелизм и повтор повеления сохранены.
