lexical_decisions:
- source_word: הַחַיָּה
  choice: звери
  rationale: В данном перечислении слово обозначает диких животных и противопоставлено домашнему скоту. «Звери» естественно и кратко передаёт эту категорию по-русски.
- source_word: וְכָל בְּהֵמָה
  choice: и весь скот
  rationale: בְּהֵמָה здесь относится к домашним животным; «скот» сохраняет контраст со «зверями», а «весь» передаёт כָּל.
- source_word: רֶמֶשׂ
  choice: пресмыкающиеся
  rationale: Слово охватывает существ, которые ползают или передвигаются близко к земле. Традиционное русское «пресмыкающиеся» здесь обозначает широкую библейскую категорию, а не только современный зоологический класс.
- source_word: וְצִפּוֹר כָּנָף
  choice: и птицы крылатые
  rationale: Сочетание буквально содержит образы птицы и крыла. «Птицы крылатые» сохраняет эту выразительность и поэтический строй еврейского текста.
