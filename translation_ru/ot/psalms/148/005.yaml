lexical_decisions:
- source_word: יְהַלְלוּ
  choice: Пусть они восхваляют
  rationale: Пиэль, имперфект 3-го лица множественного числа с побудительным значением в гимническом контексте; конструкция «пусть… восхваляют» естественно передаёт призыв.
- source_word: אֶת שֵׁם
  choice: имя
  rationale: Сохраняет библейское выражение «восхвалять имя», относящееся к явленной личности и славе Бога, без излишнего перефразирования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное Божье имя; примечание указывает традиционный вариант перевода.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание для призыва к хвале и естественно звучит в современной русской поэтической речи.
- source_word: הוּא
  choice: Он
  rationale: Передаёт явно выраженное древнееврейское местоимение без усилительного добавления «Сам».
- source_word: צִוָּה
  choice: повелел
  rationale: Точно передаёт издание властного повеления и уместно для возвышенного, но современного регистра.
- source_word: וְנִבְרָאוּ
  choice: и они были сотворены
  rationale: Сохраняет страдательное значение нифаля и связь с темой творения; тире подчёркивает непосредственный результат повеления, не добавляя новой смысловой связи.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула, а примечание сообщает читателю традицию передачи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм и краткость еврейской строки сохранены; местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции.
