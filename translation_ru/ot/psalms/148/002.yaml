source:
  edition: WLC
  text: הַֽלְל֥וּ/הוּ כָל מַלְאָכָ֑י/ו הַֽ֝לְל֗וּ/הוּ כָּל צבא/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/002.yaml
  text: Praise him[a], all his angels; praise him, all his hosts.
translation:
  language: ru
  text: Хвалите Его, все ангелы Его; хвалите Его, всё воинство Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё небесное воинство Его»; или: «все войска Его».'
    reason: 'Лексическая многозначность слова צָבָא: оно может обозначать воинство, войско или небесный сонм.'
lexical_decisions:
- source_word: הַלְלוּהוּ
  choice: хвалите Его
  rationale: Форма повелительного наклонения во множественном числе с местоименным суффиксом 3-го лица мужского рода единственного числа. Перевод сохраняет прямой призыв к небесным существам и естественно звучит на современном русском языке.
- source_word: כָל
  choice: все / всё
  rationale: Еврейское слово обозначает всю совокупность названных существ; форма русского слова согласована соответственно с множественным «ангелы» и собирательным «воинство».
- source_word: מַלְאָכָיו
  choice: ангелы Его
  rationale: В контексте небесного славословия מַלְאָכִים означает небесных существ, а не человеческих посланников. Постпозиция местоимения поддерживает возвышенный поэтический регистр без архаизации.
- source_word: צְבָאוֹ
  choice: воинство Его
  rationale: צָבָא может означать войско или сонм. Здесь, в параллели с ангелами и в космическом контексте псалма, имеется в виду принадлежащее Богу небесное воинство; «воинство» сохраняет ёмкость и поэтический оттенок исходного слова.
theological_decisions:
- issue: К кому относятся местоименные суффиксы («Его»)
  choice: К Богу, Господу, Которого псалом призывает хвалить
  alternative: Не выражать референт явно сверх местоимений исходного текста
  rationale: Первый стих задаёт Господа как Того, Кого призывают хвалить, а второй продолжает этот призыв. В сам текст не добавлено отдельное имя или пояснение, отсутствующее в данном стихе.
- issue: Значение צְבָאוֹ
  choice: Небесное воинство Бога без более узкого определения его состава
  alternative: Его войска; весь Его небесный сонм
  rationale: Параллелизм с ангелами указывает на небесную сферу, однако исходное слово сохраняет военную и собирательную образность. Перевод «воинство» не отождествляет две строки полностью и не уточняет сверх текста, кто именно входит в это воинство.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Повтор «хвалите Его» и параллелизм исходного стиха сохранены; церковнославянизирующие формы вроде «хвалите Его, вси» не используются.
