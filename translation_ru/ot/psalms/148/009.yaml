lexical_decisions:
- source_word: הֶהָרִים
  choice: горы
  rationale: Существительное означает «горы». Определённый артикль не передан отдельно, поскольку в русском поэтическом перечислении родовое обозначение естественно употребляется без него.
- source_word: וְכָל גְּבָעוֹת
  choice: и все холмы
  rationale: 'כָּל перед существительным во множественном числе передаёт совокупность: «все»; גְּבָעוֹת обозначает холмы и сохраняет топографический параллелизм с горами.'
- source_word: עֵץ פְּרִי
  choice: плодовые деревья
  rationale: Буквально конструкция означает «дерево плода» и здесь имеет собирательное значение. «Плодовые деревья» — точное и естественное русское название этой категории.
- source_word: וְכָל אֲרָזִים
  choice: и все кедры
  rationale: אֲרָזִים — множественное число от «кедр»; краткая форма естественна в перечислении и не требует добавления слова «деревья».
