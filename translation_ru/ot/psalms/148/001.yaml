lexical_decisions:
- source_word: הַלְלוּ
  choice: Хвалите
  rationale: Форма повелительного наклонения, множественное число, порода пиэль от הלל; передаёт прямой призыв многих адресатов воздать хвалу.
- source_word: יָהּ
  choice: Яха
  rationale: Краткая поэтическая форма Божьего имени передана транслитерацией и оформлена по нормам русского склонения; так сохраняется её отличие от полного יְהוָה в следующей строке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Полное личное имя передано принятой русской транслитерацией, что сохраняет различие между יָהּ и יְהוָה.
- source_word: מִן הַשָּׁמַיִם
  choice: с небес
  rationale: Предлог מִן передаёт исходную точку призыва, а множественное שָׁמַיִם — образ небес; выражение естественно звучит по-русски.
- source_word: הַלְלוּהוּ
  choice: хвалите Его
  rationale: Местоименный суффикс третьего лица мужского рода относится к Яхве; местоимение сохраняет связность исходного текста без ненужного повтора имени.
- source_word: בַּמְּרוֹמִים
  choice: на высотах
  rationale: מְרוֹמִים обозначает возвышенные области или высоты; перевод сохраняет пространственный образ, не уточняя его как «высшие небеса».
theological_decisions:
- issue: Совместная передача יָהּ и יְהוָה в одном стихе
  choice: Различить формы как «Ях» и «Яхве»
  alternative: Передать обе формы словом «Господь» либо обе единообразно как «Яхве»
  rationale: Исходный текст намеренно употребляет сначала краткую поэтическую форму имени, а затем полную. Различение сохраняет эту особенность и связь первого возгласа с еврейским «Аллилуйя».
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным поэтическим звучанием. Повтор повелительного «хвалите» и параллелизм исходного стиха сохранены; архаизм «в вышних» не использован.
