lexical_decisions:
- source_word: בַּחוּרִים
  choice: юноши
  rationale: Слово обозначает молодых мужчин, нередко в расцвете сил; «юноши» естественно передаёт возрастную и половую отнесённость и отличается от следующего נְעָרִים.
- source_word: וְגַם
  choice: и
  rationale: В сжатом поэтическом перечислении обычный союз естественно передаёт соединительно-добавочное значение; отдельное «также» не требуется.
- source_word: בְּתוּלוֹת
  choice: девушки
  rationale: В перечне возрастно-половых групп речь, вероятнее всего, идёт о молодых женщинах; более узкое значение «девственницы» сохранено в примечании.
- source_word: זְקֵנִים
  choice: старики
  rationale: Контекст перечисляет возрастные группы, поэтому имеется в виду не должность старейшин, а пожилые мужчины.
- source_word: עִם
  choice: вместе с
  rationale: Передаёт совместность и сохраняет параллельное объединение двух возрастных групп.
- source_word: נְעָרִים
  choice: отроками
  rationale: Здесь слово обозначает молодых лиц мужского пола и противопоставлено взрослым юношам; «отроки» сохраняет мужской род и возрастное различие, не сужая значение столь резко, как «мальчики».
