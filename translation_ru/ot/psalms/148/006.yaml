base_translation:
  language: en
  yaml_path: translation/ot/psalms/148/006.yaml
  text: And he established them forever and ever; he gave a decree[a], and it will not pass away.
translation:
  language: ru
  text: Он утвердил их навеки, навсегда; дал установление, и оно не исчезнет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמִידֵם
  choice: Он утвердил их
  rationale: 'Порода hифиль глагола עמד с суффиксом 3-го лица множественного числа выражает причинное значение: «поставил, сделал стоящими, утвердил». «Утвердил» естественно передаёт устойчивость творения в контексте псалма.'
- source_word: לָעַד לְעוֹלָם
  choice: навеки, навсегда
  rationale: Сочетание двух обозначений неограниченной длительности усилительно. Пара «навеки, навсегда» сохраняет повтор и звучит естественно в современном литературном русском.
- source_word: חָק
  choice: установление
  rationale: חֹק может обозначать постановление, предписанный предел или установленный порядок. «Установление» сохраняет широту значения и в контексте творения не сводит выражение исключительно к юридическому указу.
- source_word: נָתַן
  choice: дал
  rationale: Буквальное и естественное соответствие обычному значению נתן; сочетание «дал установление» сохраняет образ исходного текста.
- source_word: וְלֹא יַעֲבוֹר
  choice: которое не прейдёт
  rationale: 'Форма единственного числа допускает отнесение к ближайшему существительному חֹק: установленный Богом порядок не исчезнет. «Не прейдёт» кратко передаёт значение «не минует, не прекратится», а подлинная синтаксическая неоднозначность отмечена в сноске.'
theological_decisions:
- issue: Субъект и смысл וְלֹא יַעֲבוֹר
  choice: 'Отнести единственное число глагола к установлению: «которое не прейдёт».'
  alternative: «и они его не преступят / не перейдут его пределов» либо «и никто его не преступит».
  rationale: В еврейском тексте субъект последнего глагола и подразумеваемое дополнение прямо не выражены. Основной вариант естественно связывает глагол единственного числа с חֹק и подчёркивает непреходящий характер Божьего порядка; другие грамматически возможные прочтения сохранены в сноске, чтобы не устранять богословски значимую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. «Прейдёт» выбрано как понятное традиционно-библейское слово; синтаксис остаётся ясным. Местоимения, относящиеся к Богу, даны со строчной буквы по обычной современной издательской норме.
