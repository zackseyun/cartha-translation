lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Хвалите
  rationale: Форма повелительного наклонения множественного числа от הלל; прямой и естественный призыв к хвале в псалме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: מִן הָאָרֶץ
  choice: с земли
  rationale: В космической композиции псалма земля противопоставлена небесам; русский предлог «с» естественно выражает исходящую от земного мира хвалу.
- source_word: תַּנִּינִים
  choice: морские чудовища
  rationale: Слово обозначает крупных, порой змееподобных существ, связанных с морем; выбранный вариант сохраняет необычный и поэтический образ еврейского текста, не сводя его к обычным морским животным.
- source_word: תְּהֹמוֹת
  choice: глубины
  rationale: Множественное число от תהום обозначает глубины, прежде всего глубинные воды; краткий поэтический вариант сохраняет широту образа, а водный оттенок поясняется в сноске.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Образ תַּנִּינִים
  choice: морские чудовища
  alternative: большие морские существа
  rationale: Выбранный вариант сохраняет возможную грозную и змееподобную окраску слова, не утверждая при этом отдельной мифологической доктрины.
translation_notes:
  register: Современный литературный русский с кратким, торжественным псалмическим призывом. Двоеточие ясно показывает, что следующие существительные — обращение к земным творениям, призываемым хвалить Яхве.
