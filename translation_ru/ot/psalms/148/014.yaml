  yaml_path: translation/ot/psalms/148/014.yaml
  text: And he has raised up a horn for his people[a], praise for all his faithful ones, for the sons of Israel, the people near to him[d][c][b]. Praise Yah!
translation:
  language: ru
  text: Он возвысил рог Своему народу[a][b] — на хвалу всем верным Ему, сынам Израиля[c], народу, близкому к Нему. Хвалите Ях![d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза после слов «возвысил рог Своему народу» синтаксически сжата. «На хвалу» передаёт одно из возможных, результативных прочтений; возможно также аппозиционное: «...рог Своему народу — хвала всем верным Ему».'
    reason: alternative_reading
  - marker: b
    text: «Рог» — древнееврейский образ силы, достоинства и возвышенного могущества.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «сынам Израиля»; это выражение обозначает народ Израиля в целом.'
    reason: lexical_note
  - marker: d
    text: «Хвалите Ях» — значение литургического возгласа «Аллилуйя». «Ях» — краткая форма Божьего имени.
    reason: lexical_note
lexical_decisions:
- source_word: וַיָּרֶם
  choice: возвысил
  rationale: Форма от רום означает «поднять, возвысить». Совершенный вид естественно передаёт совершённое Божье действие в итоговом призыве псалма.
- source_word: קֶרֶן
  choice: рог
  rationale: Сохранён буквальный поэтический образ, обозначающий силу, достоинство или возвышенное могущество; замена на одно толкование сузила бы смысл.
- source_word: לְעַמּוֹ
  choice: Своему народу
  rationale: 'Дательный падеж естественно передаёт значение еврейского לְ: Бог возвысил рог для блага Своего народа.'
- source_word: תְּהִלָּה
  choice: хвалу
  rationale: Это прямое соответствие существительному «хвала». Тире сохраняет сжатую аппозиционную или результативную связь с предшествующей фразой, не устраняя её неоднозначности.
- source_word: לְכָל חֲסִידָיו
  choice: всем верным Ему
  rationale: חֲסִידִים обозначает людей, отличающихся верностью и преданностью в отношениях с Богом. Формулировка понятна современному читателю и не вносит позднейших оттенков слова «святые».
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохранена мужская форма исходного выражения и его традиционно понятное корпоративное значение.
- source_word: עַם קְרֹבוֹ
  choice: народу, близкому к Нему
  rationale: Передан образ близости к Богу без уточнения, идёт ли речь об отношениях завета, богослужебной близости или обеих сторонах сразу.
- source_word: הַלְלוּ יָהּ
  choice: Хвалите Ях!
  rationale: Императив переведён прямо, а краткая форма Божьего имени יָהּ передана как «Ях», а не заменена словом «Господь».
theological_decisions:
- issue: Образ קֶרֶן
  choice: сохранить метафору «рог»
  alternative: передать как «сила», «могущество» или «достоинство»
  rationale: Исходный образ допускает несколько взаимосвязанных смыслов; буквальная метафора сохраняет поэтическое и богословское напряжение.
- issue: Синтаксическая связь תְּהִלָּה с первой строкой
  choice: сохранить сжатое приложение через тире
  alternative: 'явно истолковать как результат: «это стало хвалой», либо отнести «хвалу» к народу как отдельное определение'
  rationale: Еврейский синтаксис сжат и допускает аппозиционное либо результативное понимание; основной текст не должен без необходимости выбирать только одно.
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: «сынам Израиля»
  alternative: «детям Израиля» или «народу Израиля»
  rationale: Так сохраняется грамматическая форма и устойчивый библейский коллективный оборот без отрицания того, что речь идёт обо всём народе.
- issue: Передача краткой формы имени יָהּ
  choice: «Ях»
  alternative: «Господь» или непереведённое «Аллилуйя»
  rationale: Прямая передача сохраняет употреблённую в источнике краткую форму имени и одновременно раскрывает смысл литургического возгласа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Сохранены параллелизм, сжатость еврейской строки и образ «рога»; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
