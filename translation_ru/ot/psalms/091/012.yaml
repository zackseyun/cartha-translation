  text: עַל כַּפַּ֥יִם יִשָּׂא֑וּ/נְ/ךָ פֶּן תִּגֹּ֖ף בָּ/אֶ֣בֶן רַגְלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/012.yaml
  text: On their hands they will carry you[b][a], lest you strike your foot against a stone.
translation:
  language: ru
  text: На руках они понесут тебя[a], чтобы ты не ударился ногой о камень.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднимут тебя»; еврейский глагол может означать как поднятие, так и несение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כַּפַּיִם
  choice: на руках
  rationale: Буквально сочетание означает «на ладонях», но по-русски «на руках» естественно передаёт образ бережного несения и сохраняет значение предлога עַל.
- source_word: יִשָּׂאוּנְךָ
  choice: они понесут тебя
  rationale: Глагол נָשָׂא может означать «поднимать, нести». «Понесут тебя» ясно передаёт защитное действие, не добавляя обязательного движения вверх.
- source_word: פֶּן
  choice: чтобы … не
  rationale: Отрицательная целевая конструкция естественно передаёт предупредительно-предохранительный смысл פֶּן в современном русском языке.
- source_word: תִּגֹּף
  choice: ты не ударился
  rationale: Форма от נָגַף здесь обозначает удар ноги о препятствие; возвратное «ударился» является естественной русской конструкцией.
- source_word: בָּאֶבֶן
  choice: о камень
  rationale: Предлог ב при глаголе удара естественно переводится по-русски как «о»; существительное употреблено в неопределённом смысле.
- source_word: רַגְלֶךָ
  choice: ногой
  rationale: Сохраняется единственное число древнееврейского существительного; творительный падеж обусловлен естественным русским управлением глагола «удариться».
theological_decisions:
- issue: Традиционная формулировка или современная передача образа
  choice: На руках они понесут тебя
  alternative: На ладонях понесут тебя; они подхватят тебя на руки
  rationale: Выбранная формулировка сохраняет образ защиты и несения из древнееврейского текста, оставаясь современной и не внося дополнительной идеи внезапного подхватывания.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным, но не архаичным звучанием. Синтаксис сохраняет поэтический порядок исходного текста.
