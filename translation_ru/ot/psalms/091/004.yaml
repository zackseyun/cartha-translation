base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/004.yaml
  text: With his pinions he will cover you[a], and under his wings you will find refuge[b]; his faithfulness is a shield and a bulwark.
translation:
  language: ru
  text: Своими перьями Он укроет тебя[a], и под Его крыльями ты найдёшь убежище; Его верность[b] — щит и малый щит[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своим оперением Он укроет тебя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Его истина».'
    reason: lexical_alternative
  - marker: c
    text: Значение еврейского слова не вполне ясно; вероятно, «малый щит» (баклер).
    reason: textual_uncertainty
lexical_decisions:
- source_word: בְּאֶבְרָתוֹ
  choice: Своими перьями
  rationale: אֶבְרָה обозначает перья, оперение или пернатую часть крыла. «Перьями» ясно и естественно передаёт образ птицы; более собирательное «оперением» сохранено в примечании.
- source_word: יָסֶךְ
  choice: Он укроет
  rationale: Форма от סכך выражает действие покрытия, дающего защиту. «Укроет» передаёт и физический образ, и защитный смысл.
- source_word: לָךְ
  choice: тебя
  rationale: Единственное число сохраняет личное обращение псалма. Грамматический женский род еврейской формы в русском переводе не выражается, поскольку адресат понимается обобщённо.
- source_word: וְתַחַת כְּנָפָיו
  choice: и под Его крыльями
  rationale: Прямо продолжает пространственный и птичий образ оригинала.
- source_word: תֶּחְסֶה
  choice: ты найдёшь убежище
  rationale: חסה означает искать или находить защиту, прибегать под защиту. Эта формулировка естественна по-русски и не устраняет образ безопасного укрытия.
- source_word: צִנָּה
  choice: щит
  rationale: צִנָּה — щит, нередко большой щит, прикрывавший значительную часть тела. В основном тексте достаточно общего слова «щит».
- source_word: וְסֹחֵרָה
  choice: и ограда
  rationale: Редкое и трудное существительное, вероятно, обозначает окружающую защиту или один из видов защитного вооружения. «Ограда» передаёт смысл защищённости, а традиционная альтернатива «малый щит» отмечена в сноске.
- source_word: אֲמִתּוֹ
  choice: Его верность
  rationale: אֱמֶת может означать истину, верность и надёжность. В образе защиты «верность» естественно указывает на неизменную надёжность Бога, не исключая значения «истина», сохранённого в примечании.
theological_decisions:
- issue: Передача אֲמִתּוֹ как основания Божьей защиты
  choice: Его верность
  alternative: Его истина
  rationale: Оба значения лексически допустимы. «Верность» лучше согласуется с образом надёжной защиты, однако перевод не должен устранять традиционное и возможное значение «истина», поэтому оно дано в сноске.
- issue: Сохранение образного перехода от птицы к воинской защите
  choice: Сохранены оба образа без сглаживающего пояснения
  alternative: Обобщить их как «Он защитит тебя»
  rationale: Резкая смена образов присутствует в еврейском тексте и несёт поэтическое и богословское напряжение; её не следует устранять пересказом.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического достоинства. Личное обращение передано единственным числом; местоимение «Он» написано с прописной буквы согласно распространённой русской библейской традиции. Параллелизм и переход от птичьего образа к воинскому сохранены.
