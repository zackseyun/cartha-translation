lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующего обещания; «ведь» естественно передаёт пояснительно-причинную связь в русском поэтическом контексте.
- source_word: מַלְאָכָיו
  choice: Своим ангелам
  rationale: В контексте псалма речь идёт о небесных посланниках Бога; возвратное «Своим» ясно связывает их с подразумеваемым субъектом — Богом.
- source_word: יְצַוֶּה
  choice: повелит
  rationale: Форма пиэль выражает властное распоряжение. «Повелит» сохраняет силу глагола и соответствует возвышенному, но современному регистру.
- source_word: לָּךְ
  choice: ради тебя
  rationale: При צוה конструкция указывает на того, в чьих интересах или относительно кого даётся повеление, а не на адресата приказа. В основном тексте этот смысл естественно включён в конструкцию «повелит… оберегать тебя», а возможный оттенок отражён в сноске.
- source_word: לִשְׁמָרְךָ
  choice: оберегать тебя
  rationale: Передаёт продолжительную защиту и надзор, выражаемые שׁמר, естественнее современного «хранить тебя» и мягче узкого «охранять».
- source_word: בְּכָל דְּרָכֶיךָ
  choice: на всех твоих путях
  rationale: Сохраняет образ пути, способный обозначать как буквальное передвижение, так и жизненный путь; «на путях» идиоматично по-русски.
theological_decisions:
- issue: Подразумеваемый субъект глагола יְצַוֶּה
  choice: Бог, обозначенный местоимением «Он»
  alternative: Не называть субъект прямо, сохранив его только в глагольной форме
  rationale: Контекст псалма указывает на Господа как на Того, Кто отдаёт повеление ангелам. Русское местоимение необходимо для естественного предложения и не добавляет нового референта.
- issue: Объём обещанной защиты на «всех путях»
  choice: Сохранить формулировку без уточнения условий или границ
  alternative: Истолковать «пути» как исключительно праведные или предписанные Богом пути
  rationale: Сам стих не вводит такого ограничения; добавление разрешило бы богословское напряжение за пределами исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. «Ведь» сохраняет связь с предыдущим стихом; «повелит» поддерживает возвышенный тон без архаизации. Маркер сноски поставлен после смыслового комплекса «оберегать тебя», к которому относится пояснение о конструкции לָּךְ.
