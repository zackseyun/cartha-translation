  text: כִּ֤י ה֣וּא יַ֭צִּֽילְ/ךָ מִ/פַּ֥ח יָק֗וּשׁ מִ/דֶּ֥בֶר הַוּֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/003.yaml
  text: For he will deliver you from the snare of the fowler[b][a], from the deadly pestilence.
translation:
  language: ru
  text: Ибо Он избавит тебя от сети птицелова, от губительной язвы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от смертоносного мора»; возможно также: «от мора, несущего гибель».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: В данном контексте союз вводит основание предшествующего заверения; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение подчёркивает действующего; в русском это передано явным местоимением и прописной буквой по принятой традиции обозначения Бога.
- source_word: יַצִּילְךָ
  choice: избавит тебя
  rationale: Форма Hiphil от נצל означает избавление или спасение от опасности; «избавит» естественно и соответствует возвышенному регистру псалма.
- source_word: מִפַּח
  choice: от сети
  rationale: פַּח обозначает ловушку, западню или силок. В сочетании с птицеловом «сеть» создаёт ясный и привычный русский образ, не меняя характера угрозы.
- source_word: יָקוּשׁ
  choice: птицелова
  rationale: Слово обозначает ловца, ставящего ловушки, в особенности ловца птиц; «птицелов» — точный, краткий и традиционный русский эквивалент.
- source_word: מִדֶּבֶר
  choice: от язвы
  rationale: דֶּבֶר означает мор, эпидемию или губительную болезнь. «Язва» сохраняет библейскую весомость и остаётся понятной в данном сочетании.
- source_word: הַוּוֹת
  choice: губительной
  rationale: Форма выражает разрушение, бедствие или гибель. Определение «губительной» естественно согласуется с «язвой» и сохраняет разрушительную силу еврейского выражения.
theological_decisions:
- issue: Характер названных опасностей
  choice: Сохранены конкретные образы ловушки и эпидемической беды без ограничения их смысла только буквальным или только символическим толкованием.
  alternative: Истолковать угрозы исключительно как физические опасности либо исключительно как духовные образы.
  rationale: Еврейский текст называет реальные опасности, но поэтический контекст допускает более широкую образную силу. Перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Синтаксис краток и естественен; традиционные слова «птицелов» и «язва» сохранены как понятные в контексте.
