  text: I will satisfy him with length of days[a], and I will show him my salvation.
translation:
  language: ru
  text: Долгой жизнью насыщу его и явлю ему Моё спасение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё избавление». Еврейское слово может обозначать как спасение в широком смысле, так и избавление от опасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ יָמִים
  choice: долгой жизнью
  rationale: Еврейское выражение буквально означает «долгота дней». В современном русском «долгой жизнью» естественно передаёт смысл, не утрачивая идеи дарованного долголетия.
- source_word: אַשְׂבִּיעֵהוּ
  choice: насыщу его
  rationale: Каузативная форма глагола שׂבע означает «дать насытиться, удовлетворить». Поэтическое «насыщу его» сохраняет образ полноты и соответствует возвышенному регистру псалма.
- source_word: וְאַרְאֵהוּ
  choice: и явлю ему
  rationale: Каузативная форма ראה значит «дать увидеть, показать». «Явлю ему» ясно выражает действие Бога и естественно звучит в поэтическом контексте.
- source_word: בִּישׁוּעָתִי
  choice: Моё спасение
  rationale: יְשׁוּעָה охватывает как конкретное избавление от опасности, так и спасение в более широком смысле. «Моё спасение» сохраняет эту смысловую широту; предлог ב указывает на то, что именно Бог даст человеку увидеть.
theological_decisions:
- issue: Смысловой объём יְשׁוּעָה в заключительной строке псалма о Божьей защите
  choice: Моё спасение
  alternative: Моё избавление
  rationale: «Спасение» сохраняет широкий богословский смысл еврейского слова, не исключая конкретного избавления от беды. Альтернатива отмечена в сноске, чтобы не устранять присущую оригиналу многозначность.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной псалмовой образностью. Сочетание «насыщу его долгой жизнью» передаёт еврейский образ полноты прожитых дней, а «явлю» сохраняет торжественность заключительного Божьего обещания.
