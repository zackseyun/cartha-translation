id: PSA.91.5
reference: Psalms 91:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹא תִ֭ירָא מִ/פַּ֣חַד לָ֑יְלָה מֵ֝/חֵ֗ץ יָע֥וּף יוֹמָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/005.yaml
  text: You will not fear the terror of the night[b][a], nor the arrow that flies by day.
translation:
  language: ru
  text: Ты не убоишься ночного ужаса[a][b], ни стрелы, летящей днём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ночного страха».'
    reason: lexical_alternative
  - marker: b
    text: 'Или, с явным оттенком заверения: «Тебе не нужно бояться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִירָא
  choice: не убоишься
  rationale: Qal imperfect 2-го лица ед. числа с לֹא в контексте псалма естественно передаёт заверение о будущем, а не прямой запрет. «Не убоишься» сохраняет форму обещания и уместно для возвышенной поэзии.
- source_word: פַּחַד
  choice: ужас
  rationale: Существительное обозначает ужас или сильный страх как угрозу; «ужас» передаёт более интенсивный смысл, чем просто «страх».
- source_word: לָיְלָה
  choice: ночного
  rationale: Атрибутивное сочетание «ночной ужас» естественно выражает связь угрозы с ночью и сохраняет поэтический контраст с «днём».
- source_word: חֵץ
  choice: стрела
  rationale: Сохранён конкретный образ обычной стрелы без преждевременного истолкования его как метафоры иной опасности.
- source_word: יָעוּף
  choice: летящей
  rationale: Причастный оборот естественно передаёт Qal imperfect глагола עוּף «лететь» в определительном придаточном значении.
- source_word: יוֹמָם
  choice: днём
  rationale: Наречие יוֹמָם идиоматично передаётся как «днём» и образует ясную параллель с ночной угрозой.
- source_word: מִן ... מִן
  choice: ужаса ... ни стрелы
  rationale: После русского «бояться/убояться» исходное значение удаления или источника угрозы естественно передаётся родительным падежом; повтор второго מִן выражен отрицательной координацией «ни».
theological_decisions:
- issue: Передавать ли стих как повеление или как обещание
  choice: 'заверение: «Ты не убоишься»'
  alternative: 'повеление: «Не бойся»'
  rationale: Сочетание לֹא с имперфектом в данном поэтическом контексте естественнее понимать как заверение о человеке, находящемся под Божьей защитой. При этом перевод не превращает образ защиты в безусловное доктринальное утверждение за пределами контекста псалма.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. «Убоишься» менее разговорно, чем «испугаешься», но понятно современному читателю и позволяет избежать двусмысленности формы «не бойся», которая звучала бы как повеление. Маркеры сносок поставлены непосредственно после выражения, к которому относятся.
