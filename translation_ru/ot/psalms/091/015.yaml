  text: יִקְרָאֵ֨/נִי וְֽ/אֶעֱנֵ֗/הוּ עִמּֽ/וֹ אָנֹכִ֥י בְ/צָרָ֑ה אֲ֝חַלְּצֵ֗/הוּ וַֽ/אֲכַבְּדֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/015.yaml
  text: He will call on me[a], and I will answer him; I am with him in trouble[b]; I will rescue him and honor him.
translation:
  language: ru
  text: Он воззовёт ко Мне, и Я отвечу ему; Я с ним в беде; избавлю[a] его и почту[b] его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасу».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прославлю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרָאֵנִי
  choice: Он воззовёт ко Мне
  rationale: Глагол קרא с личным объектом в молитвенном контексте означает обращение к Богу с призывом. «Воззовёт ко Мне» естественно передаёт этот смысл и сохраняет возвышенный, но понятный регистр псалма.
- source_word: וְאֶעֱנֵהוּ
  choice: и Я отвечу ему
  rationale: ענה здесь имеет прямое значение «отвечать, откликаться»; выбранный вариант естественно соответствует предшествующему призыву.
- source_word: עִמּוֹ אָנֹכִי
  choice: Я с ним
  rationale: Краткая именная конструкция сохраняет непосредственность и подчёркнутое заверение в Божьем присутствии, не добавляя отсутствующего в еврейском тексте наречия.
- source_word: בְצָרָה
  choice: в беде
  rationale: צָרָה обозначает беду, тесноту, тяжёлое положение. «В беде» ясно, ёмко и естественно для современного русского языка.
- source_word: אֲחַלְּצֵהוּ
  choice: избавлю его
  rationale: В породе пиэль חלץ означает вызволить или избавить от опасности. «Избавлю» точно передаёт активное Божье вмешательство; возможное «спасу» отмечено в сноске.
- source_word: וַאֲכַבְּדֵהוּ
  choice: и почту его
  rationale: כבד в пиэле означает оказывать честь или прославлять. «Почту» сохраняет значение оказания чести человеку и избегает ненужного сужения смысла.
theological_decisions:
- issue: Передача последовательности Божьих обещаний без добавления условий
  choice: 'Сохранена прямая последовательность: Бог отвечает, пребывает с человеком в беде, избавляет и оказывает ему честь.'
  alternative: Сделать обещания явно обусловленными предшествующей верностью человека.
  rationale: В самом стихе дополнительные условия не сформулированы, поэтому перевод не вводит богословских оговорок, отсутствующих в исходном тексте.
- issue: Значение Божьего присутствия в беде
  choice: «Я с ним в беде»
  alternative: «Я буду с ним, когда он окажется в беде»
  rationale: Краткая форма ближе к подчёркнутой еврейской конструкции עִמּוֹ אָנֹכִי и не превращает утверждение присутствия в более развёрнутое временное условие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Форма «воззовёт» уместна для молитвенного обращения и остаётся понятной; синтаксис краток и сохраняет ритмическую последовательность еврейского текста.
