lexical_decisions:
- source_word: יִפֹּל
  choice: пусть… падёт
  rationale: Имперфект Qal от נפל в поэтическом контексте допускает будущий или модальный оттенок. «Пусть… падёт» сохраняет допущение грозного события, не превращая его в однозначное предсказание.
- source_word: מִצִּדְּךָ
  choice: рядом с тобой
  rationale: Предлог מִן буквально означает «от», но при глаголе падения сочетание указывает на место возле человека; современное русское выражение естественно передаёт пространственный образ.
- source_word: אֶלֶף
  choice: тысяча
  rationale: Кардинальное числительное передано буквально, с сохранением поэтического параллелизма.
- source_word: וּרְבָבָה
  choice: и десять тысяч
  rationale: רְבָבָה обычно обозначает десять тысяч или огромное множество; числовая передача сохраняет усиление относительно «тысячи».
- source_word: מִימִינֶךָ
  choice: по правую руку от тебя
  rationale: Сочетание передано пространственно и с сохранением традиционного телесного образа правой стороны.
- source_word: אֵלֶיךָ לֹא יִגָּשׁ
  choice: но к тебе не приблизится
  rationale: נגשׁ с אֶל обозначает приближение к человеку. Русский допускает нулевое подлежащее в этом контексте, что позволяет не уточнять отсутствующий в еврейском тексте субъект.
theological_decisions:
- issue: Неуказанный субъект заключительной части
  choice: 'Субъект оставлен невыраженным: «к тебе не приблизится».'
  alternative: 'Уточнить: «бедствие не приблизится к тебе» или «оно не приблизится к тебе».'
  rationale: В еврейском тексте субъект формы יִגָּשׁ прямо не назван. Контекст указывает на окружающую угрозу, однако её конкретизация как «бедствия» или «язвы» сузила бы подлинную неопределённость стиха.
- issue: Модальность первого глагола
  choice: «Пусть тысяча падёт»
  alternative: «Тысяча падёт» или «Тысяча может пасть».
  rationale: Имперфект допускает как будущее, так и модальное прочтение. Выбранная конструкция естественно звучит по-русски и сохраняет уступительный смысл перед противопоставлением, не настаивая на детерминированном будущем.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой поэзии. Синтаксический параллелизм и усиление «тысяча — десять тысяч» сохранены; архаизм «одесную» не использован.
