base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/008.yaml
  text: You will only look with your eyes and see the repayment of the wicked[a].
translation:
  language: ru
  text: Ты будешь лишь смотреть своими глазами и увидишь воздаяние нечестивым[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возмездие нечестивым»; или: «наказание нечестивых».'
    reason: 'Лексические варианты для שִׁלֻּמַת: слово обозначает отплату или воздаяние по заслугам; «наказание» передаёт возможное, но более узкое карательное значение.'
lexical_decisions:
- source_word: רַק
  choice: лишь
  rationale: 'Передаёт ограничение: обращённый к Богу человек только наблюдает происходящее, а не разделяет участь нечестивых.'
- source_word: בְּעֵינֶיךָ
  choice: своими глазами
  rationale: Сохраняет еврейский образ личного, непосредственного наблюдения и естественно звучит по-русски.
- source_word: תַבִּיט
  choice: посмотришь
  rationale: Форма глагола נבט означает «смотреть, глядеть»; нейтральное «посмотришь» ясно и не придаёт тексту искусственно архаичного оттенка.
- source_word: וְשִׁלֻּמַת
  choice: и увидишь воздаяние
  rationale: Существительное от корня שלם обозначает отплату или возмещение по заслугам. «Воздаяние» сохраняет нравственно-судебный смысл, не сводя его исключительно к наказанию.
- source_word: רְשָׁעִים
  choice: нечестивым
  rationale: Устойчиво передаёт нравственную характеристику רְשָׁעִים; дательный падеж естественно выражает тех, кому воздаётся.
- source_word: תִּרְאֶה
  choice: увидишь
  rationale: Прямо передаёт простое значение глагола ראה и сохраняет последовательность «посмотришь — увидишь».
theological_decisions:
- issue: Характер участи нечестивых
  choice: воздаяние нечестивым
  alternative: расплату нечестивых; наказание нечестивых
  rationale: 'Еврейское существительное шире, чем явно карательное «наказание»: оно указывает на заслуженную отплату, но не уточняет её механизм. Перевод сохраняет эту смысловую широту.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой лексикой. Формулировка ясная и естественная; синтаксический параллелизм двух глаголов сохранён.
