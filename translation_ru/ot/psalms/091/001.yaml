source:
  edition: WLC
  text: יֹ֭שֵׁב בְּ/סֵ֣תֶר עֶלְי֑וֹן בְּ/צֵ֥ל שַׁ֝דַּ֗י יִתְלוֹנָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/001.yaml
  text: He who dwells in the shelter of the Most High will lodge in the shadow of the Almighty[a][b][c].
translation:
  language: ru
  text: Живущий[a] в укрытии[b] Всевышнего в тени Всемогущего будет ночевать[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тот, кто живёт» или «Всякий, кто живёт». В еврейском тексте стоит форма мужского рода единственного числа, которая может употребляться в обобщённом смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в потаённом месте» или «в сокровенном месте».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «будет пребывать» или «останется на ночь». Еврейский глагол буквально связан с ночлегом, а в более широком смысле — с продолжительным пребыванием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֵׁב
  choice: Живущий
  rationale: Субстантивированное причастие мужского рода обозначает человека, для которого пребывание там характерно и постоянно. «Живущий» естественнее и точнее по смыслу, чем буквальное «сидящий».
- source_word: בְּסֵתֶר
  choice: в укрытии
  rationale: סֵתֶר обозначает скрытое, защищённое место. «В укрытии» передаёт и сокрытость, и защиту, не придавая образу эзотерического оттенка.
- source_word: עֶלְיוֹן
  choice: Всевышнего
  rationale: Устоявшийся русский эквивалент божественного титула עֶלְיוֹן, сохраняющий значение высшего положения и величия Бога.
- source_word: בְּצֵל
  choice: в тени
  rationale: Прямо передаёт предлог בְּ и существительное צֵל; образ выражает близость и защиту.
- source_word: שַׁדַּי
  choice: Всемогущего
  rationale: Смысловой перевод божественного титула שַׁדַּי, понятный современному читателю и не превращающий титул без необходимости в транслитерированное имя.
- source_word: יִתְלוֹנָן
  choice: будет ночевать
  rationale: Глагол לון прежде всего означает останавливаться или располагаться на ночь, а шире — оставаться, пребывать. «Будет ночевать» сохраняет конкретный образ и несовершенный, продолжительный характер действия.
theological_decisions:
- issue: Репрезентативное употребление формы мужского рода единственного числа
  choice: Живущий
  alternative: Тот, кто живёт; всякий, кто живёт
  rationale: Еврейский текст имеет причастие мужского рода единственного числа, которое может представлять любого человека. Русская форма «живущий» сохраняет грамматику источника, не ограничивая смысл исключительно мужчинами.
- issue: Передача божественного титула שַׁדַּי
  choice: Всемогущего
  alternative: Шаддая
  rationale: Перевод титула раскрывает его традиционно понимаемый смысл современному русскому читателю и не навязывает восприятие формы как отдельного личного имени.
- issue: Временной и образный смысл יִתְלוֹנָן
  choice: будет ночевать
  alternative: пребывает; останется
  rationale: Форма допускает оттенок длительного или повторяющегося пребывания, но корень сохраняет конкретный образ ночлега. Будущее время оставляет заметным отличие от причастия в первой строке.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Синтаксис следует параллелизму еврейской строки; общеупотребительные «укрытие» и «тень» выбраны вместо архаичных «кров» и «сень». Конкретное «будет ночевать» сохраняет образ исходного глагола и намеренное напряжение между постоянным жительством и ночлегом.
