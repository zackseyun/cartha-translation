  - marker: b
    text: 'Или: «поставлю его высоко, в безопасности» или «защищу его». Еврейский глагол рисует образ человека, помещённого на недоступную для опасности высоту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: за то, что / потому что
  rationale: Оба употребления вводят основание Божьего действия. В начале стиха оборот «за то, что» естественнее по-русски после смыслового вынесения причины вперёд; во второй части сохранено прямое «потому что».
- source_word: בִי חָשַׁק
  choice: крепко привязан ко Мне
  rationale: Глагол חָשַׁק выражает сильную привязанность, любовь и устремлённость к кому-либо. Такой перевод сохраняет образ тесной связи и не сужает значение до одного лишь чувства.
- source_word: וַאֲפַלְּטֵהוּ
  choice: Я избавлю его
  rationale: Форма выражает обещанное Богом освобождение от опасности. «Избавлю» — ясное и достойное соответствие, естественное для поэтической речи.
- source_word: אֲשַׂגְּבֵהוּ
  choice: подниму его на недосягаемую высоту
  rationale: 'Глагол שׂגב соединяет образ возвышения с безопасностью: человека помещают высоко, вне досягаемости опасности. Перевод сохраняет пространственную метафору, а не заменяет её отвлечённым «защищу».'
- source_word: יָדַע
  choice: знает
  rationale: Форма указывает на знание как основание обещанной защиты. Буквальное «знает» сохраняет возможную глубину личного и заветного отношения, не раскрывая её толковательным парафразом.
- source_word: שְׁמִי
  choice: Моё имя
  rationale: Сохранено прямое выражение оригинала. «Имя» может подразумевать явленную личность и характер Бога, однако это смысловое наполнение не следует подменять пояснением в основном тексте.
theological_decisions:
- issue: Характер привязанности к Богу в חָשַׁק
  choice: «крепко привязан ко Мне»
  alternative: «любит Меня»; «возлюбил Меня»; «всей душой стремится ко Мне»
  rationale: Выбранный вариант передаёт сильную и устойчивую направленность к Богу, сохраняя диапазон между любовью и верной привязанностью и не сводя выражение исключительно к эмоции.
- issue: Защитная метафора в אֲשַׂגְּבֵהוּ
  choice: Сохранён образ недосягаемой высоты
  alternative: «защищу его»; «возвышу его»; «поставлю его высоко»
  rationale: В еврейском глаголе безопасность представлена через высоту и недоступность. «Защищу» сгладило бы поэтический образ, а «возвышу» могло бы ошибочно восприниматься как обещание почёта или высокого положения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, поэтическим строем. Заглавные буквы в местоимениях, относящихся к Богу, использованы как принятая в русском библейском издании издательская норма. Параллелизм двух обещаний сохранён; метафора высоты передана явно и без архаизмов.
