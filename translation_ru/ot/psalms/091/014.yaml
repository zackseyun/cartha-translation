  text: Because he clings to me[a], I will rescue him; I will set him securely on high[b], because he knows my name.
translation:
  language: ru
  text: «Потому что он крепко привязан ко Мне[a], Я избавлю его; помещу его на недосягаемой высоте[b], потому что он знает Моё имя».
