  text: עַל שַׁ֣חַל וָ/פֶ֣תֶן תִּדְרֹ֑ךְ תִּרְמֹ֖ס כְּפִ֣יר וְ/תַנִּֽין־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/013.yaml
  text: You will tread on the lion and the cobra[b][a]; you will trample the young lion and the serpent.
translation:
  language: ru
  text: На льва и кобру[b] наступишь, молодого льва и змея[a] будешь попирать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дракона». Еврейское слово в других контекстах может обозначать огромное пресмыкающееся или морское чудовище, но здесь перечень наземных опасных животных поддерживает перевод «змей».'
    reason: alternative_reading
  - marker: b
    text: 'Традиционно: «аспида».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: на
  rationale: Пространственный предлог при глаголе попирания; естественное русское соответствие — «на».
- source_word: שַׁחַל
  choice: лев
  rationale: Поэтическое обозначение льва; нейтральное «лев» точно и понятно передаёт образ.
- source_word: פֶתֶן
  choice: кобра
  rationale: Ядовитая змея, традиционно передаваемая также как «аспид»; «кобра» понятнее современному читателю.
- source_word: תִּדְרֹךְ
  choice: наступишь
  rationale: Форма 2-го лица мужского рода единственного числа; в данном контексте означает ступить или наступить на кого-либо.
- source_word: תִּרְמֹס
  choice: будешь попирать
  rationale: Передаёт более сильное действие второго глагола и сохраняет нарастание поэтического параллелизма.
- source_word: כְּפִיר
  choice: молодой лев
  rationale: Обозначает молодого, уже сильного льва, а не маленького львёнка.
- source_word: תַנִּין
  choice: змей
  rationale: В ряду наземных опасных животных контекст поддерживает значение крупного змея; слово сохраняет более высокий поэтический регистр, чем «змея».
theological_decisions:
- issue: Следует ли передать תַנִּין мифологически как «дракон» или зоологически как «змей»
  choice: змей
  alternative: дракон
  rationale: Перечень льва, кобры и молодого льва указывает прежде всего на опасных животных. Однако еврейское слово в других контекстах может обозначать дракона или огромное водное существо, поэтому традиционная и символически значимая альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Перестановка маркеров относительно английского текста привязывает [b] к «кобре», а [a] — к «змею», то есть непосредственно к словам, которых касаются примечания.
