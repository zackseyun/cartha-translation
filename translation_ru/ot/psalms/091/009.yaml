  text: כִּֽי אַתָּ֣ה יְהוָ֣ה מַחְסִ֑/י עֶ֝לְי֗וֹן שַׂ֣מְתָּ מְעוֹנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/091/009.yaml
  text: Because you[a], O Yahweh, are my refuge, you have made the Most High your dwelling place.
translation:
  language: ru
  text: Потому что Ты, Яхве, — моё убежище, Ты сделал Всевышнего Своим жилищем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно распространённому пониманию трудного еврейского текста: «Потому что ты сказал: „Яхве — моё убежище“, и сделал Всевышнего своим жилищем».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Передаёт причинное значение союза и связывает стих с обещанием защиты в контексте.
- source_word: אַתָּה
  choice: Ты
  rationale: Сохраняет явно выраженное и эмфатическое местоимение второго лица единственного числа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מַחְסִי
  choice: моё убежище
  rationale: Точно и естественно передаёт образ безопасного места; притяжательный суффикс первого лица сохранён.
- source_word: עֶלְיוֹן
  choice: Всевышнего
  rationale: Устоявшееся русское обозначение божественного титула «Всевышний»; винительный падеж обусловлен синтаксисом русского предложения.
- source_word: שַׂמְתָּ
  choice: Ты сделал
  rationale: Передаёт Qal perfect 2 м. ед. от שׂים в значении «сделать, определить чем-либо» и сохраняет трудную смену лица в масоретском тексте.
- source_word: מְעוֹנֶךָ
  choice: Своим жилищем
  rationale: «Жилище» ясно передаёт מָעוֹן и не смешивает его с מַחְסֶה «убежище»; возвратное «Своим» естественно соотносится с подлежащим «Ты».
theological_decisions:
- issue: Синтаксис говорящего и адресата в Псалме 91:9
  choice: 'Основной текст следует огласованному масоретскому тексту без добавления отсутствующего глагола: «Ты, Яхве, — моё убежище, Ты сделал Всевышнего Своим жилищем».'
  alternative: '«Потому что ты сказал: „Яхве — моё убежище“, и сделал Всевышнего своим жилищем».'
  rationale: В еврейском тексте нет глагола «сказал», а сочетание первого лица «моё убежище» со вторым лицом «твоё жилище» создаёт реальную синтаксическую трудность. Основной перевод минимально дополняет текст и сохраняет напряжение; распространённое альтернативное понимание вынесено в сноску.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным псалмовым звучанием. Заглавные местоимения при обращении к Богу использованы последовательно в основном чтении; в альтернативном чтении строчные формы показывают обращение к верующему.
