  source_fidelity: 'Текст точно передаёт обе параллельные угрозы: דֶּבֶר как «язва», движущаяся «во мраке», и קֶטֶב как широкое по смыслу «погибель», которая «опустошает в полдень». Олицетворяющий глагол יַהֲלֹךְ («ходит») и контраст мрака с полднем сохранены. «Ни… ни…» корректно продолжает синтаксис предыдущего стиха, хотя מִן буквально означает «от».'
