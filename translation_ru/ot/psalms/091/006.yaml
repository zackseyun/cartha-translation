  text: nor the plague that walks in darkness[a], nor the destruction that devastates at noon.
translation:
  language: ru
  text: ни язвы, что ходит во мраке,[a] ни погибели, что опустошает в полдень.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моровой язвы»; слово «погибель» также может обозначать смертоносную эпидемию. В еврейском тексте употреблены параллельные поэтические названия губительной угрозы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּבֶר
  choice: язва
  rationale: В данном контексте слово обозначает губительную эпидемическую болезнь. «Язва» сохраняет возвышенный поэтический регистр псалма и привычное для библейской русской речи значение, хотя в современном языке может также пониматься как отдельная болезнь или рана.
- source_word: בָּאֹפֶל
  choice: во мраке
  rationale: אֹפֶל означает глубокую тьму или мрак. «Во мраке» естественно для поэтической речи и сохраняет контраст с полднем.
- source_word: יַהֲלֹךְ
  choice: ходит
  rationale: Буквальное значение глагола — «идёт, ходит». Такой перевод сохраняет олицетворение язвы как угрозы, движущейся во тьме.
- source_word: קֶּטֶב
  choice: погибель
  rationale: Слово обозначает губительную силу, истребление или смертоносное бедствие, возможно эпидемию. «Погибель» сохраняет образную широту и не сводит значение только к болезни.
- source_word: יָשׁוּד
  choice: опустошает
  rationale: Глагол выражает разорение и опустошение. Настоящее время естественно передаёт поэтическое описание постоянно грозящей опасности.
- source_word: צָהֳרָיִם
  choice: в полдень
  rationale: Точное и краткое соответствие еврейскому слову; сохраняет противопоставление мраку.
- source_word: מִן
  choice: ни
  rationale: Предлог буквально означает «от», но здесь продолжает начатый в предыдущем стихе перечень того, чего не следует бояться. Русская конструкция «ни… ни…» естественно передаёт синтаксическую связь.
