  yaml_path: translation/ot/psalms/091/002.yaml
  text: I say to Yahweh[a], “My refuge and my fortress, my God, in whom I trust.”
translation:
  language: ru
  text: 'Я говорю о Яхве[a]: «Он — моё прибежище и моя крепость, мой Бог; на Него я уповаю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: יהוה (YHWH); традиционно передаётся как «Господь».'
    reason: Указывает еврейскую форму личного Божьего имени и его традиционную русскую передачу.
lexical_decisions:
- source_word: אֹמַר
  choice: Я говорю
  rationale: Форма qal imperfect 1-го лица ед. числа допускает настоящее или будущее значение. В контексте исповедания доверия настоящее время естественно передаёт постоянное утверждение, не добавляя обязательной отнесённости к будущему.
- source_word: לַיהוָה
  choice: Яхве
  rationale: 'Предлог ל понят как указывающий на адресата речи: «говорю Яхве». Возможное понимание «о Яхве» отмечено в примечании из-за последующего местоимения третьего лица.'
- source_word: יהוה
  choice: Яхве
  rationale: Личное имя Бога, переданное тетраграмматоном YHWH, транслитерировано как «Яхве», а традиционная передача указана в примечании.
- source_word: מַחְסִי
  choice: моё прибежище
  rationale: מַחְסֶה обозначает безопасное укрытие, место защиты; «прибежище» сохраняет поэтический образ и понятно современному читателю.
- source_word: וּמְצוּדָתִי
  choice: и моя крепость
  rationale: מְצוּדָה означает укреплённое и защищённое место; «крепость» сохраняет оборонительный образ и естественно сочетается с «прибежищем».
- source_word: אֱלֹהַי
  choice: мой Бог
  rationale: 'Суффикс 1-го лица прямо выражает личное исповедание: «мой Бог».'
- source_word: אֶבְטַח
  choice: я уповаю
  rationale: Глагол בטח выражает уверенное доверие и надежду. «Уповаю» естественно для возвышенной русской поэзии и передаёт религиозное доверие без добавления будущего значения.
- source_word: בּוֹ
  choice: на Него
  rationale: Предлог ב с местоименным суффиксом 3-го лица ед. числа буквально указывает на «Него». Сохранение третьего лица не устраняет напряжение между обращением к Яхве и последующим высказыванием о Нём.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя YHWH. Форма «Яхве» сохраняет различие между именем и титулом; традиционная передача «Господь» приведена в примечании.
- issue: Связь речи с Яхве при לַיהוָה и местоимении בּוֹ
  choice: «говорю Яхве» с сохранением «на Него»
  alternative: «говорю о Яхве» или обращение «на Тебя я уповаю»
  rationale: ל после אמר обычно может обозначать адресата, тогда как בּוֹ грамматически стоит в третьем лице. Перевод сохраняет оба признака исходного текста и не сглаживает его подлинное синтаксическое напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой лексикой. «Уповаю» выбрано как общеупотребительное в религиозно-поэтическом контексте; синтаксис оставляет заметным переход от названия Яхве к местоимению третьего лица.
