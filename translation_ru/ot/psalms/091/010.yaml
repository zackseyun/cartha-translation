lexical_decisions:
- source_word: תְאֻנֶּה
  choice: постигнет
  rationale: Глагол от אנה означает «случиться, постигнуть». «Постигнет» естественно сочетается в русском языке с существительным «беда» и сохраняет направленность события на человека.
- source_word: רָעָה
  choice: беда
  rationale: В контексте обещанной защиты слово обозначает губительное зло или несчастье. «Беда» ясно передаёт неблагоприятное событие, не сводя смысл к нравственному злу; вариант «зло» сохранён в примечании.
- source_word: נֶגַע
  choice: бедствие
  rationale: Слово может обозначать удар, поражение, язву или губительное бедствие. «Бедствие» уместно в современном литературном русском и не сужает значение исключительно до болезни.
- source_word: יִקְרַב
  choice: не приблизится
  rationale: Прямо сохраняет пространственный образ еврейского קרב и естественно звучит по-русски.
- source_word: אָהֶל
  choice: шатёр
  rationale: Буквальное значение — «шатёр». Конкретный поэтический образ сохранён в основном тексте, а более широкое значение жилища пояснено в примечании.
- source_word: אֵלֶיךָ
  choice: тебя
  rationale: Направленность, выраженная предлогом אֶל, естественно передаётся русской конструкцией «постигнет тебя», без отдельного предлога.
theological_decisions:
- issue: Характер обещанной защиты
  choice: Сохранить прямую форму поэтического обещания Божьей защиты, не добавляя оговорок и не определяя его как безусловную гарантию отсутствия любых земных страданий.
  alternative: Истолковать стих как абсолютное обещание, что верующий ни при каких обстоятельствах не испытает физического страдания.
  rationale: Еврейский текст выражает обещание прямо, но сам стих не разъясняет всех вопросов о страдании и Божьем провидении. Перевод сохраняет эту богословскую напряжённость и не вводит дополнительного толкования.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. «Постигнет» и «шатёр» сохраняют библейскую образность, оставаясь понятными; устаревшее «язва» не вынесено в основной текст.
