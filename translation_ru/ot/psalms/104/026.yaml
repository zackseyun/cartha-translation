  text: Там ходят корабли; там и Левиафан, которого Ты создал, чтобы он резвился в море.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Левиафан, которого Ты создал, чтобы Ты играл с ним». Последнюю фразу можно понимать не как указание на то, что Левиафан резвится в море, а как указание на то, что Бог играет с Левиафаном.'
