lexical_decisions:
- source_word: שָׁם
  choice: Там
  rationale: Указывает на море из предыдущего стиха; это простой и естественный русский локатив.
- source_word: אֳנִיּוֹת
  choice: корабли
  rationale: Обычное обозначение морских судов; неопределённая форма естественно передаёт класс объектов.
- source_word: יְהַלֵּכוּן
  choice: ходят
  rationale: Русское «корабли ходят» идиоматично и сохраняет значение продолжительного или повторяющегося движения глагола הלך.
- source_word: לִוְיָתָן
  choice: Левиафан
  rationale: Транслитерация сохраняет поэтическое и межтекстовое значение названия великого морского существа.
- source_word: זֶה
  choice: которого
  rationale: Буквально «этот», но в русском синтаксисе естественно вводит относительное придаточное, относящееся к Левиафану.
- source_word: יָצַרְתָּ
  choice: Ты создал
  rationale: Передаёт Божье намеренное создание существа; более буквальное «образовал» в данном контексте звучит неестественно.
- source_word: לְשַׂחֶק
  choice: чтобы он резвился
  rationale: «Резвился» естественно передаёт живую картину свободной игры морского существа; местоимение «он» проясняет выбранный синтаксический субъект, не скрывая альтернативу в сноске.
- source_word: בּוֹ
  choice: в море
  rationale: Мужской суффикс естественно соотносится с морем из предыдущего стиха; явное повторение «в море» устраняет неясность русского местоимения.
theological_decisions:
- issue: К кому относится בּוֹ и кто является субъектом игры
  choice: Левиафан создан, чтобы резвиться в море
  alternative: Левиафан создан, чтобы Бог играл с ним
  rationale: 'Ближайший контекст говорит о море: там ходят корабли, и там же резвится Левиафан. Однако еврейская конструкция допускает традиционное понимание, при котором Бог играет с Левиафаном; эта подлинная неоднозначность сохранена в сноске.'
translation_notes:
  register: Современный литературный русский язык с поэтической выразительностью. «Корабли ходят» — общепринятое русское словоупотребление; «резвился» передаёт образ игры естественнее буквального «играл». Обращённое к Богу местоимение «Ты» написано с прописной буквы в соответствии с принятым благоговейным библейским регистром.
