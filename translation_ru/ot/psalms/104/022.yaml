lexical_decisions:
- source_word: תִּזְרַח
  choice: восходит
  rationale: Форма глагола זרח с подлежащим «солнце» обозначает восход или появление солнечного света; «восходит» естественно передаёт наступление утра.
- source_word: הַשֶּׁמֶשׁ
  choice: солнце
  rationale: Определённое существительное; в русском языке в данном контексте артиклевое значение отдельно не выражается.
- source_word: יֵאָסֵפוּן
  choice: уходят
  rationale: Нифаль от אסף допускает пассивное значение «собираются» и возвратно-непереходное «удаляются, уходят». В контексте ночных зверей, скрывающихся с восходом солнца, «уходят» звучит естественно и не вводит внешнего действующего лица.
- source_word: וְאֶל
  choice: и … в
  rationale: Предлог אֶל указывает направление к месту; по-русски при глаголе «залегают» местонахождение естественно выражается конструкцией «в своих логовах», тогда как направление уже подразумевается предшествующим «уходят».
- source_word: מְעוֹנֹתָם
  choice: своих логовах
  rationale: מָעוֹן означает место обитания или жилище. В отношении упомянутых в контексте львов «логова» — точное и естественное обозначение звериных убежищ.
- source_word: יִרְבָּצוּן
  choice: залегают
  rationale: Глагол רבץ часто описывает животное, которое ложится или располагается на отдых. «Залегают» сохраняет образ зверей, укрывающихся на дневной отдых.
