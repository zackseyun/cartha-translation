  text: תְּ֭הוֹם כַּ/לְּב֣וּשׁ כִּסִּית֑/וֹ עַל הָ֝רִ֗ים יַֽעַמְדוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/006.yaml
  text: You covered it with the deep as with a garment[a]; the waters stood above the mountains.
translation:
  language: ru
  text: Бездной, словно одеждой, Ты покрыл её[a]; над горами стояли воды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пучиной»; возможен также смысл: «первозданной бездной».'
    reason: Лексема תְּהוֹם может обозначать бездну, водную пучину или первозданные глубокие воды.
lexical_decisions:
- source_word: תְּהוֹם
  choice: бездной
  rationale: Слово обозначает глубокие, покрывающие землю воды; «бездна» естественно передаёт космический образ, не превращая его в специальный мифологический термин.
- source_word: כַּלְּבוּשׁ
  choice: словно одеждой
  rationale: Предлог כְּ выражает сравнение, а לְבוּשׁ означает одежду; творительный падеж естественно сочетается по-русски с глаголом «покрыл».
- source_word: כִּסִּיתוֹ
  choice: Ты покрыл её
  rationale: Форма глагола — 2-е лицо мужского рода единственного числа с местоименным суффиксом 3-го лица мужского рода. Прямое обращение к Богу сохранено; русское «её» соотносится с землёй, грамматически женского рода.
- source_word: עַל הָרִים
  choice: над горами
  rationale: В данном пространственном контексте עַל указывает на положение вод выше гор; «над горами» передаёт это без ослабления образа.
- source_word: יַעַמְדוּ מָיִם
  choice: стояли воды
  rationale: Буквальное значение עמד — «стоять». Такой порядок слов сохраняет поэтический акцент и выразительный образ неподвижно возвышающихся вод.
theological_decisions:
- issue: Лицо глагола и адресат
  choice: 'Прямое обращение к Богу: «Ты покрыл»'
  alternative: 'Повествование в третьем лице: «Он покрыл»'
  rationale: Еврейская форма однозначно стоит во втором лице мужского рода единственного числа, а контекст псалма содержит прямое обращение к Господу.
- issue: Референт местоименного суффикса в כִּסִּיתוֹ
  choice: «её», то есть землю из предыдущего стиха
  alternative: Неявный объект или мужской род по форме еврейского суффикса
  rationale: Еврейский суффикс согласуется с אֶרֶץ по грамматическому роду в библейском иврите; в русском соответствующее слово «земля» требует женского рода.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Инверсия «стояли воды» сохраняет ритм и образность, оставаясь понятной обычному читателю.
