  text: The high mountains are for the wild goats[b][a]; the rocks are a refuge for the rock badgers.
translation:
  language: ru
  text: Высокие горы — для горных козлов[a], скалы — убежище для даманов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для козерогов».'
