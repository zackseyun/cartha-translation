lexical_decisions:
- source_word: הָרִים הַגְּבֹהִים
  choice: высокие горы
  rationale: Прямо и естественно передаёт сочетание существительного «горы» с определением «высокие», сохраняя параллелизм стиха.
- source_word: לַיְּעֵלִים
  choice: для горных козлов
  rationale: יעל обозначает дикого горного козла, вероятнее всего козерога; «горные козлы» понятно современному читателю и соответствует изображённой среде обитания.
- source_word: סְלָעִים
  choice: скалы
  rationale: Передаёт скалистые образования и естественнее связано с местом обитания даманов, чем общее «камни».
- source_word: מַחְסֶה
  choice: убежище
  rationale: Сохраняет значение защищённого места и возвышенный, но понятный поэтический регистр.
- source_word: לַשְׁפַנִּים
  choice: для даманов
  rationale: שפן обозначает небольшое скалолазное животное, обычно отождествляемое с даманом; это точное современное русское зоологическое название.
