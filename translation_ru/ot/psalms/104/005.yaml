  text: יָֽסַד אֶ֭רֶץ עַל מְכוֹנֶ֑י/הָ בַּל תִּ֝מּ֗וֹט עוֹלָ֥ם וָ/עֶֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/005.yaml
  text: He founded the earth on its foundations[a]; it will not be shaken forever and ever.
translation:
  language: ru
  text: Он утвердил землю на её основаниях[a]; не поколеблется она во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на её опорах»; в еврейском тексте устойчивость земли изображена посредством строительного образа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַד
  choice: утвердил
  rationale: Глагол означает «основать, заложить основание, утвердить». «Утвердил» естественно звучит по-русски и вместе с упоминанием оснований сохраняет строительный образ.
- source_word: אֶרֶץ
  choice: землю
  rationale: В контексте гимна о творении имеется в виду земля как сотворённый мир, а не отдельная страна или территория.
- source_word: עַל
  choice: на
  rationale: Предлог непосредственно выражает образ опоры или расположения на основаниях.
- source_word: מְכוֹנֶיהָ
  choice: её основаниях
  rationale: Существительное обозначает устойчивую опору, основание или установленное место. Выбор сохраняет архитектурную метафору еврейского текста.
- source_word: בַּל תִּמּוֹט
  choice: не поколеблется она
  rationale: Форма глагола передаёт утрату устойчивости, движение или колебание. «Не поколеблется» соответствует возвышенной поэзии и сохраняет образ прочности.
- source_word: עוֹלָם וָעֶד
  choice: во веки веков
  rationale: Парное выражение усиливает идею неограниченной длительности; традиционная русская формула точна, понятна и уместна в поэтическом регистре.
theological_decisions:
- issue: Космологический язык поэтического рассказа о творении
  choice: Сохранён архитектурный образ земли, утверждённой на основаниях.
  alternative: «Он прочно установил землю, и она никогда не сдвинется».
  rationale: Стих говорит поэтическими и феноменологическими образами. Перевод не превращает их ни в современное научное описание, ни в утверждение какой-либо поздней космологической системы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Инверсия во второй строке подчёркивает устойчивость земли и соответствует стилю псалма, не создавая архаической непонятности.
