  text: Человек выходит к своему делу и труду до вечера.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵצֵא
  choice: выходит
  rationale: 'Форма qal imperfect описывает обычное, повторяющееся действие: с наступлением дня человек выходит из дома. «Выходит» сохраняет значение движения и естественно звучит по-русски.'
- source_word: אָדָם
  choice: человек
  rationale: В данном контексте слово обозначает человека как представителя всего человечества, в противопоставлении ночным животным из предыдущих стихов. Русское «человек» сохраняет форму единственного числа и допускает обобщённое значение.
- source_word: לְפָעֳלוֹ
  choice: на свою работу
  rationale: Существительное פֹּעַל означает дело, работу или деятельность, а предлог לְ после глагола движения выражает цель. «На свою работу» — естественная современная русская формулировка.
- source_word: וְלַעֲבֹדָתוֹ
  choice: и трудится
  rationale: עֲבֹדָה означает работу, труд или служение. В сочетании с близким по смыслу פֹּעַל буквальное удвоение по-русски звучит тяжеловесно; глагольная передача «трудится» ясно выражает продолжающуюся дневную работу, не добавляя нового смысла.
- source_word: עֲדֵי עָרֶב
  choice: до вечера
  rationale: Поэтическое עֲדֵי указывает на временной предел, а עָרֶב означает вечер. «До вечера» точно и естественно передаёт этот предел.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: человек
  alternative: люди / человечество
  rationale: Стих описывает установленный в творении обычный распорядок человеческой жизни. «Человек» сохраняет еврейское обобщающее единственное число и не ограничивает высказывание одним конкретным мужчиной.
translation_notes:
  register: Современный литературный русский язык; краткая поэтическая строка с естественным синтаксисом. Обобщающее «человек» сохраняет достоинство и представительный характер исходного אָדָם.
