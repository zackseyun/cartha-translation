  text: תִּתֵּ֣ן לָ֭/הֶם יִלְקֹט֑וּ/ן תִּפְתַּ֥ח יָֽ֝דְ/ךָ֗ יִשְׂבְּע֥וּ/ן טֽוֹב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/028.yaml
  text: You give to them[a], and they gather it; you open your hand, and they are filled with good.
translation:
  language: ru
  text: Ты даёшь им — они собирают; открываешь Свою руку — они насыщаются благом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּתֵּן לָהֶם
  choice: Ты даёшь им
  rationale: Прямо передаёт обращённую к Богу форму 2-го лица и дательный смысл לָהֶם; предмет даяния остаётся подразумеваемым, как в еврейском тексте.
- source_word: יִלְקֹטוּן
  choice: они собирают
  rationale: לקט означает «собирать». Русский переходный глагол здесь допускает контекстуально подразумеваемое дополнение, поэтому добавлять «это» не требуется.
- source_word: תִּפְתַּח יָדְךָ
  choice: открываешь Свою руку
  rationale: Сохранён конкретный антропоморфный образ Божьего обеспечения; слово «широко» в оригинале отсутствует.
- source_word: יִשְׂבְּעוּן
  choice: они насыщаются
  rationale: Глагол שבע выражает достижение сытости или удовлетворённости; «насыщаются» естественно продолжает образ пищи и Божьего попечения.
- source_word: טוֹב
  choice: благом
  rationale: Субстантивированное טוב передано компактным русским существительным в творительном падеже, сохраняющим как материальный, так и более широкий оттенок добра.
theological_decisions:
- issue: Антропоморфный образ Божьего попечения
  choice: «открываешь Свою руку»
  alternative: «щедро обеспечиваешь» / «свободно даёшь»
  rationale: Буквальный поэтический образ важен для богословия псалма и не должен заменяться абстрактным пояснением.
- issue: Объём значения טוֹב
  choice: «благом»
  alternative: «добром» / «добрыми дарами» / «вдоволь получают блага»
  rationale: «Благом» сохраняет лаконичность и смысловую широту оригинала, не ограничивая Божий дар только вещами и не устраняя связь с насыщением.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной псалмовой интонацией. Параллелизм двух полустиший отмечен тире; местоимение «Свою» написано с прописной буквы как допустимая традиционная форма благоговейного обращения к Богу.
