  source_fidelity: 'Текст точно передаёт обе пары еврейских глаголов в форме 2-го лица и 3-го лица множественного числа: «Ты даёшь им — они собирают; открываешь … руку — они насыщаются благом». Подразумеваемый объект при «собирают» не добавлен, что сохраняет лаконичность оригинала. Образ открытой руки сохранён буквально. «Благом» адекватно передаёт субстантивированное טוב и не сужает его до материальных вещей.'
