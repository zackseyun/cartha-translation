  text: מַצְמִ֤יחַ חָצִ֨יר לַ/בְּהֵמָ֗ה וְ֭/עֵשֶׂב לַ/עֲבֹדַ֣ת הָ/אָדָ֑ם לְ/ה֥וֹצִיא לֶ֝֗חֶם מִן הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/014.yaml
  text: He causes grass to grow for the cattle[a], and plants for the service of man, to bring forth bread from the earth,
translation:
  language: ru
  text: 'Он взращивает траву для скота

    и растения — для труда человека[a],

    чтобы он извлекал хлеб из земли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть человечества в целом.
    reason: Пояснение родового значения еврейского אָדָם.
lexical_decisions:
- source_word: מַצְמִיחַ
  choice: Он взращивает
  rationale: 'Причастие породы hифиль от צמח имеет каузативное значение: Бог даёт растительности расти. «Взращивает» естественно и поэтично передаёт эту причинность.'
- source_word: חָצִיר
  choice: траву
  rationale: В контексте речь идёт о растительности, служащей кормом животным; «трава» — точное и естественное соответствие.
- source_word: לַבְּהֵמָה
  choice: для скота
  rationale: בְּהֵמָה здесь обозначает домашних животных как собирательную категорию; «скот» сохраняет этот смысл без неоправданного сужения до крупного рогатого скота.
- source_word: וְעֵשֶׂב
  choice: и растения
  rationale: עֵשֶׂב шире, чем «зелень» или «травы», и обозначает растительность, полезную человеку. «Растения» передаёт широкий смысл слова.
- source_word: לַעֲבֹדַת הָאָדָם
  choice: для труда человека
  rationale: עֲבֹדָה может означать труд, работу или служение. Формулировка сохраняет сжатость и смысловую открытость еврейского выражения, не сводя его исключительно к земледелию или пользованию.
- source_word: הָאָדָם
  choice: человека
  rationale: Существительное אָדָם употреблено в родовом, собирательном смысле. В современном русском «человек» естественно включает человечество в целом; это пояснено в сноске.
- source_word: לְהוֹצִיא
  choice: чтобы произвести
  rationale: Инфинитив может выражать цель или результат. «Чтобы произвести» естественно передаёт эту связь, не уточняя сверх текста непосредственного деятеля производства.
- source_word: לֶחֶם
  choice: хлеб
  rationale: Хотя לֶחֶם может шире означать пищу, здесь основной смысл «хлеб» соответствует земледельческому образу и сохраняет конкретность оригинала.
- source_word: מִן הָאָרֶץ
  choice: из земли
  rationale: В данном контексте אֶרֶץ — земля как источник урожая. «Из земли» близко передаёт исходный образ.
theological_decisions:
- issue: Родовое значение הָאָדָם
  choice: человека
  alternative: людей / человечества
  rationale: Еврейское единственное число имеет здесь обобщённый смысл, а не указывает на конкретного мужчину. Русское «человек» сохраняет грамматическую форму и естественно выражает родовое значение.
- issue: Смысл לַעֲבֹדַת הָאָדָם
  choice: для труда человека
  alternative: для возделывания человеком / на пользу человеку
  rationale: Оригинал допускает связь растений как с человеческим трудом и обработкой земли, так и с их назначением для человека. Основной текст не закрепляет только одно из этих толкований.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим оттенком. Строки сохраняют параллелизм стиха; «взращивает» и «хлеб из земли» поддерживают его образность. Сжатое «для труда человека» намеренно сохраняет неоднозначность оригинала.
