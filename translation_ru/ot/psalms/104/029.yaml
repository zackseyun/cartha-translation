lexical_decisions:
- source_word: תַּסְתִּיר
  choice: скроешь
  rationale: Форма от סתר означает «скрывать». Будущее совершенного вида естественно передаёт действие Бога в поэтической последовательности условно-временного характера.
- source_word: פָּנֶיךָ
  choice: лицо Своё
  rationale: Сохранён конкретный древнееврейский образ «Твоё лицо», который может обозначать личное присутствие и благоволение Бога.
- source_word: יִבָּהֵלוּן
  choice: приходят в ужас
  rationale: Nifal от בהל выражает сильную тревогу, смятение или испуг. «Приходят в ужас» ясно передаёт интенсивность реакции.
- source_word: תֹּסֵף
  choice: отнимешь
  rationale: אסף может означать «собирать», «забирать», «устранять». При дополнении «их дыхание» контекст требует смысла прекращения данного Богом жизненного дыхания.
- source_word: רוּחָם
  choice: у них дыхание
  rationale: רוּחַ означает «дыхание», «ветер» или «дух». Смерть и возвращение в прах делают «дыхание» наиболее непосредственным значением, не устраняя альтернативу «дух».
- source_word: יִגְוָעוּן
  choice: умирают
  rationale: גוע означает «испускать дух», «умирать». Современное «умирают» точно и понятно без архаизации.
- source_word: עֲפָרָם
  choice: свой прах
  rationale: Суффикс буквально даёт «их прах». Русское «свой прах» сохраняет притяжательное значение и естественно звучит при подлежащем «они».
- source_word: יְשׁוּבוּן
  choice: возвращаются
  rationale: שוב означает «возвращаться»; выбор сохраняет связь с библейским образом возвращения смертных существ в прах.
theological_decisions:
- issue: Значение רוּחָם в контексте жизни и смерти творений
  choice: дыхание
  alternative: дух
  rationale: Контекст утраты жизни и возвращения в прах прежде всего указывает на жизненное дыхание. Альтернатива отмечена в сноске, чтобы не снимать присущую слову смысловую широту и не навязывать определённую антропологию.
- issue: Антропоморфный образ Божьего лица
  choice: лицо Своё
  alternative: Своё присутствие
  rationale: Буквальный поэтический образ ясен по-русски и сохраняет напряжение между лицом, присутствием и благоволением Бога, не заменяя образ абстрактным толкованием.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и библейской образности. Инверсия «Скроешь Ты» и «отнимешь» передаёт ритмичную последовательность еврейских глагольных форм; местоимение «Своё» нормативно соотносит принадлежность лица с подлежащим «Ты».
