  text: Молодые львы рычат, требуя добычи, и ищут у Бога себе пищи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַכְּפִירִים
  choice: молодые львы
  rationale: Еврейское כְּפִיר обозначает молодого льва; множественное число и определённость естественно переданы по-русски без артикля.
- source_word: שֹׁאֲגִים לַטָּרֶף
  choice: рычат о добыче
  rationale: שאג — характерный громкий рёв льва; русское «рычат» здесь естественно сочетается с целью «о добыче» и сохраняет образ исходного текста.
- source_word: וּלְבַקֵּשׁ מֵאֵל
  choice: и просят у Бога
  rationale: בקש с מֵאֵל допускает смысл поиска или испрашивания у Бога. «Просят у Бога» естественно выражает зависимость животных от Божьего обеспечения и не превращает оборот в буквальный поиск местонахождения пищи.
- source_word: אָכְלָם
  choice: себе пищу
  rationale: Буквально «их пищу»; возвратное «себе» ясно соотносит пищу с молодыми львами и звучит естественно по-русски.
theological_decisions:
- issue: Представление животных как обращающихся к Богу за пищей
  choice: «просят у Бога»
  alternative: «ищут у Бога»
  rationale: Формулировка сохраняет поэтическое богословское утверждение о зависимости творения от Бога, не предполагая осознанной молитвы животных как доктринального уточнения.
translation_notes:
  register: Современный литературный русский; лаконичный поэтический параллелизм, ясный для широкого круга читателей. Союз «и» сохраняет координацию двух еврейских форм, тогда как причастный оборот «ища» мог бы сильнее подчинить второе действие первому.
