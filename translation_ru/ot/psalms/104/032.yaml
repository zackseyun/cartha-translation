lexical_decisions:
- source_word: הַמַּבִּיט
  choice: Он взглянет
  rationale: Причастие породы хифиль от נבט описывает Бога как того, кто смотрит. В русском поэтическом контексте личная форма естественна; будущее совершенного вида передаёт типичное действие и согласуется с последующими формами.
- source_word: לָאָרֶץ
  choice: на землю
  rationale: В космическом контексте Псалма 104 אֶרֶץ означает землю в целом, а не отдельную страну.
- source_word: וַתִּרְעָד
  choice: и она содрогнётся
  rationale: Глагол רעד обозначает дрожь или сотрясение. «Содрогнётся» сохраняет образ земного потрясения и согласуется с совершенным видом параллельных форм.
- source_word: יִגַּע
  choice: коснётся
  rationale: נגע обычно означает «касаться». Этот выбор подчёркивает, что для проявления Божьей силы достаточно одного прикосновения.
- source_word: בֶּהָרִים
  choice: гор
  rationale: הָרִים означает «горы»; форма без повторного местоимения естественна в русском параллелизме.
- source_word: וְיֶעֱשָׁנוּ
  choice: и они задымятся
  rationale: Глагол עשׁן означает «дымиться». «Задымятся» естественно передаёт начало видимого действия как следствие прикосновения.
theological_decisions:
- issue: Божественный субъект причастного оборота
  choice: Передать субъект местоимением «Он», относящимся к Богу в контексте псалма.
  alternative: 'Более формально: «Тот, кто взглянет на землю…»'
  rationale: Контекст ясно указывает на Бога, а личное местоимение даёт естественную русскую строку, не добавляя нового богословского содержания.
- issue: Временной и видовой профиль глаголов
  choice: 'Использовать будущее совершенного вида: «взглянет… содрогнётся; коснётся… задымятся».'
  alternative: 'Настоящее время: «смотрит… содрогается; касается… дымятся».'
  rationale: Еврейские формы создают живую последовательность результата; русское будущее совершенного вида хорошо выражает закономерную, мгновенную реакцию творения, сохраняя поэтическое напряжение.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Тире передаёт быстрый причинно-следственный параллелизм еврейской строки; архаизмы устранены.
