  text: Он смотрит на землю[a] — и она дрожит; касается гор — и они дымятся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более формально: «Тот, кто смотрит на землю, — и она дрожит; касается гор — и они дымятся».'
