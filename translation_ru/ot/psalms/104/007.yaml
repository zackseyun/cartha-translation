  yaml_path: translation/ot/psalms/104/007.yaml
  text: At your rebuke they fled[a]; at the sound of your thunder they hurried away.
translation:
  language: ru
  text: От Твоего окрика они обратились в бегство, от звука Твоего грома поспешили прочь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּעֲרָתְךָ
  choice: Твоего грозного окрика
  rationale: גְּעָרָה обозначает властный окрик или обличение. В обращённой к водам речи «грозный окрик» естественно передаёт силу Божьего повеления, не сводя слово к нравственному порицанию.
- source_word: יְנוּסוּן
  choice: они бежали
  rationale: Форма от נוּס означает бегство или поспешное удаление. Прошедшее время соответствует повествовательному контексту псалма.
- source_word: קוֹל
  choice: звука
  rationale: В сочетании с громом קוֹל естественно означает слышимый звук; вариант «голос грома» был бы возможен, но менее обычен в современном русском.
- source_word: רַעַמְךָ
  choice: Твоего грома
  rationale: Прямо передаёт רַעַם и сохраняет образ Божьей власти, проявляющейся в громоподобном звучании.
- source_word: יֵחָפֵזוּן
  choice: поспешно отступили
  rationale: חפז выражает поспешность, иногда вызванную тревогой. «Поспешно отступили» сохраняет идею быстрого удаления и не усиливает её до явно названной паники.
- source_word: מִן ... מִן
  choice: От ... от
  rationale: 'Повтор предлога «от» сохраняет еврейский параллелизм и допускает одновременно исходную и причинную окраску: воды удаляются вследствие Божьего окрика и грома.'
theological_decisions:
- issue: Подразумеваемое подлежащее глаголов во множественном числе
  choice: Сохранено местоимение «они», относящееся к водам из предыдущего контекста.
  alternative: 'Явно назвать подлежащее: «воды бежали».'
  rationale: В еврейском стихе подлежащее не названо; его предоставляет предшествующий контекст. Местоимение сохраняет поэтическую связность и не добавляет существительного в сам стих.
translation_notes:
  register: Современный литературный русский с поэтическим параллелизмом. Прописные буквы в местоимениях «Твоего» следуют принятому в русском библейском стиле благоговейному обращению к Богу. Формулировка стремится сохранить властность Божьей речи и стремительное отступление вод без излишней архаизации.
