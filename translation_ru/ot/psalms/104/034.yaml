source:
  edition: WLC
  text: יֶעֱרַ֣ב עָלָ֣י/ו שִׂיחִ֑/י אָ֝נֹכִ֗י אֶשְׂמַ֥ח בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/034.yaml
  text: May my meditation be pleasing to him[a]; I will rejoice in Yahweh.
translation:
  language: ru
  text: Да будет приятно Ему моё размышление[a]; а я буду радоваться Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да будет сладостно Ему моё размышление»; возможно также: «Да будет угодно Ему моё размышление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעֱרַב
  choice: да будет приятно
  rationale: Форма выражает пожелание; глагол может означать «быть приятным», «быть сладостным» или «быть угодным». В данном молитвенном контексте «да будет приятно» естественно передаёт просьбу о благосклонном принятии.
- source_word: עָלָיו
  choice: Ему
  rationale: При глаголе ערב предлог עַל с местоименным суффиксом указывает на того, кому нечто приятно; местоимение относится к Богу.
- source_word: שִׂיחִי
  choice: моё размышление
  rationale: Существительное может обозначать размышление, внутреннюю беседу или речь. В созерцательно-хвалебном контексте псалма наиболее уместно «размышление».
- source_word: אָנֹכִי
  choice: а я
  rationale: Самостоятельное местоимение подчёркивает говорящего. Конструкция «а я» естественно сохраняет это выделение и переход ко второй строке.
- source_word: אֶשְׂמַח
  choice: буду радоваться
  rationale: Имперфект здесь передаёт намерение или устойчивую направленность псалмопевца; будущее время хорошо сохраняет этот оттенок.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: Предлог בְּ обозначает объект или основание радости, а тетраграмматон передан личным именем «Яхве».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Передача «Яхве» сохраняет личное заветное имя и соответствует предоставленному консультационному решению, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с поэтической торжественностью. Инверсия сведена к минимуму; формула пожелания «да будет» сохраняет молитвенный характер строки. Заглавное «Ему» употреблено как уважительное обозначение Бога.
