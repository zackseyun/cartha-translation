  yaml_path: translation/ot/psalms/104/015.yaml
  text: and wine gladdens the heart of man[a], making the face shine more than oil[b], and bread sustains the heart of man.
translation:
  language: ru
  text: и вино, веселящее сердце человека[a], заставляющее лицо сиять сильнее, чем масло[b], и хлеб, укрепляющий сердце человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сердце смертного»; имеется в виду человек вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «чтобы лицо сияло от масла». Еврейский предлог допускает как сравнительное значение («сильнее, чем масло»), так и значение источника или средства («от масла»).'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַיִן
  choice: и вино
  rationale: Существительное с союзом; в данном перечислении обозначает вино как дар земли в общем смысле.
- source_word: יְשַׂמַּח
  choice: радующее
  rationale: 'Пиэль передаёт причинное значение: вино доставляет радость. Причастная форма естественно продолжает синтаксис предыдущего стиха, где подразумевается действие Бога, производящего вино, масло и хлеб.'
- source_word: לְבַב אֱנוֹשׁ
  choice: сердце человека
  rationale: לְבַב обозначает внутренний мир и жизненные силы, а אֱנוֹשׁ — человека как смертное человеческое существо. Русское «человека» естественно сохраняет родовое значение единственного числа.
- source_word: לְהַצְהִיל פָּנִים
  choice: чтобы лицо сияло
  rationale: Инфинитив гифиля передаёт цель или результат — придание лицу блеска и свежести; целевая конструкция сохраняет синтаксическую открытость фразы.
- source_word: מִשָּׁמֶן
  choice: от масла
  rationale: 'מן естественно допускает значение источника или средства: лицо сияет благодаря маслу. Сравнительное понимание «ярче масла» возможно, но менее непосредственно и сохранено в примечании.'
- source_word: וְלֶחֶם
  choice: и хлеб
  rationale: Сохранено основное значение לֶחֶם — хлеб как главная пища.
- source_word: יִסְעָד
  choice: укрепляющий
  rationale: סעד значит поддерживать, подкреплять, укреплять. Здесь речь о питательной силе хлеба; причастие согласует русский синтаксис с двумя предыдущими дарами.
theological_decisions:
- issue: Родовое значение אֱנוֹשׁ
  choice: человека
  alternative: человеческое сердце / сердце смертного
  rationale: Слово относится к человеку вообще, а не исключительно к мужчине. «Сердце человека» в современном русском языке естественно передаёт собирательно-родовой смысл без богословского сужения.
- issue: Связь масла с сиянием лица
  choice: лицо сияет от масла
  alternative: лицо сияет ярче, чем от масла / вино придаёт лицу больше блеска, чем масло
  rationale: Предлог מן допускает как значение источника, так и сравнение. Основной текст оставляет масло непосредственной причиной сияния, что хорошо согласуется с древним употреблением масла; сравнительная трактовка отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Причастный ряд сохраняет связь с предшествующим контекстом псалма и избегает превращения поэтического перечисления в три отдельные декларации.
