base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/008.yaml
  text: The mountains rose[a], the valleys sank down, to the place that you established for them.
translation:
  language: ru
  text: Горы поднялись[a], долины опустились — к месту, которое Ты установил для них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при другом возможном понимании еврейской поэтической строки: «Они поднимались через горы, спускались в долины — к месту, которое Ты установил для них»; подразумеваемое подлежащее — воды.'
    reason: alternative_reading
lexical_decisions:
- source_word: יַעֲלוּ
  choice: поднялись
  rationale: Форма Qal, имперфект, 3-е лицо множественного числа от עלה, обозначает движение вверх. В основном прочтении естественно описывает поднятие гор.
- source_word: הָרִים
  choice: горы
  rationale: Определённое существительное во множественном числе; в русском языке определённость не требует отдельного артикля.
- source_word: יֵרְדוּ
  choice: опустились
  rationale: Форма Qal, имперфект, 3-е лицо множественного числа от ירד, обозначает движение вниз. «Опустились» сохраняет параллелизм с «поднялись», не усиливая образ до геологического «просели».
- source_word: בְקָעוֹת
  choice: долины
  rationale: Существительное во множественном числе обозначает долины или низины; «долины» естественно и ясно передаёт противопоставление горам.
- source_word: אֶל מְקוֹם
  choice: к месту
  rationale: Предлог אֶל выражает направленность к назначенному месту.
- source_word: זֶה
  choice: которое
  rationale: Указательное זֶה при существительном מְקוֹם в данном синтаксическом окружении естественно передаётся русским относительным оборотом, связывающим место с последующим действием Бога.
- source_word: יָסַדְתָּ
  choice: Ты определил
  rationale: Глагол יסד означает основывать, утверждать, устанавливать. В отношении предназначенного творению места «определил» естественно выражает Божье установление порядка, не придавая выражению излишне архитектурного оттенка.
- source_word: לָהֶם
  choice: для них
  rationale: Сохранено мужское множественное число местоименного суффикса без уточнения его референта, чтобы не устранять поэтическую неоднозначность.
theological_decisions:
- issue: Субъект глаголов в поэтической строке
  choice: 'Основной текст понимает горы и долины как подлежащие: «Горы поднялись, долины опустились».'
  alternative: 'Воды могут быть подразумеваемым подлежащим: «Они поднимались на горы, спускались в долины…»'
  rationale: Масоретская пунктуация допускает прочтение, при котором «горы» и «долины» выступают подлежащими и изображают устройство рельефа. Однако контекст отступающих вод делает второе синтаксическое понимание также правдоподобным; поэтому оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Прописное «Ты» употреблено как традиционная уважительная форма обращения к Богу. Тире подчёркивает переход от движения рельефа к назначенному Богом месту.
