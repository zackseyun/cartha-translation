  text: who lays the beams of his upper chambers on the waters[a], who makes the clouds his chariot, who walks on the wings of the wind.
translation:
  language: ru
  text: 'Он кладёт балки Своих верхних покоев на водах,

    делает облака Своей колесницей,

    шествует на крыльях ветра.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на крыльях духа»; еврейское רוּחַ может означать и «ветер», и «дух». Здесь значение «ветер» предпочтительно из-за окружающих образов облаков и небесных стихий.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמְקָרֶה
  choice: кладёт балки
  rationale: Форма от קרה описывает устройство кровли или укладку балок. Конкретный образ «кладёт балки» сохраняет небесную архитектурную метафору.
- source_word: בַמַּיִם
  choice: на водах
  rationale: Предлог ב допускает значения «в» и «на»; в образе возводимых покоев «на водах» естественно передаёт представление об их основании или опоре.
- source_word: עֲלִיּוֹתָיו
  choice: Своих верхних покоев
  rationale: Существительное обозначает верхние комнаты или покои. «Верхние покои» точно и понятно передаёт пространственный образ без излишней архаичности.
- source_word: הַשָּׂם
  choice: делает
  rationale: В конструкции «делает облака Своей колесницей» глагол שׂים естественно передаётся как назначение одного предмета другим.
- source_word: עָבִים
  choice: облака
  rationale: Слово может подразумевать густые облака, но нейтральное «облака» достаточно точно и лучше соответствует краткости еврейской поэзии.
- source_word: רְכוּבוֹ
  choice: Своей колесницей
  rationale: Здесь слово обозначает средство езды; «колесница» сохраняет яркий теофанический образ.
- source_word: הַמְהַלֵּךְ
  choice: шествует
  rationale: Причастие от הלך буквально означает идущего. «Шествует» сохраняет образ движения и придаёт строке уместную поэтическую торжественность.
- source_word: כַּנְפֵי
  choice: на крыльях
  rationale: Хотя כנף может означать также край, в сочетании с ветром значение «крылья» создаёт ясный образ стремительного движения.
- source_word: רוּחַ
  choice: ветра
  rationale: רוּחַ может значить «ветер», «дыхание» или «дух». В непосредственном контексте облаков и небесного движения предпочтительно метеорологическое значение «ветер».
theological_decisions:
- issue: Значение רוּחַ в заключительной строке
  choice: ветер
  alternative: дух / Дух
  rationale: Образы вод, облаков, колесницы и крыльев поддерживают значение «ветер». При этом лексическая возможность значения «дух» не устраняется и отмечена в сноске без навязывания конкретного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с поэтической торжественностью. Конкретная архитектурная метафора сохранена; местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции.
