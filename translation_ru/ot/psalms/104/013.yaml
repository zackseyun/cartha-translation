lexical_decisions:
- source_word: מַשְׁקֶה
  choice: Он орошает
  rationale: Причастие породы hифиль от שׁקה передаёт каузативное действие; в описательном контексте естественна личная форма настоящего времени с подразумеваемым Богом как субъектом.
- source_word: הָרִים
  choice: горы
  rationale: Обычное значение существительного; определённость в русском языке ясно задаётся контекстом.
- source_word: מֵעֲלִיּוֹתָיו
  choice: из Своих горних чертогов
  rationale: Сохраняется архитектурно-космический образ верхних помещений небесного жилища; «горних» передаёт высоту, а «чертогов» поддерживает возвышенный поэтический регистр.
- source_word: מִפְּרִי
  choice: плодами
  rationale: Творительный падеж естественно передаёт значение средства или источника наполнения, выраженное предлогом מִן, без излишне буквальной конструкции.
- source_word: מַעֲשֶׂיךָ
  choice: Твоих дел
  rationale: Близко передаёт широкое значение «дела, творения» и сохраняет переход от третьего лица к прямому обращению во втором лице.
- source_word: תִּשְׂבַּע
  choice: насыщается
  rationale: Передаёт полноту и удовлетворение, выраженные שׂבע, и согласуется с продолжающимся описанием Божьего промысла.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте псалма о творении имеется в виду земля в широком смысле, а не отдельная страна.
theological_decisions:
- issue: Подразумеваемый божественный субъект
  choice: Он орошает горы
  alternative: Орошая горы
  rationale: Хотя в еврейском употреблено причастие без явно названного субъекта, контекст однозначно продолжает речь о Боге; личная форма делает русский текст ясным, не добавляя нового утверждения.
- issue: Переход от третьего лица ко второму
  choice: из Своих… Твоих дел
  alternative: из Его… Его дел
  rationale: Сохранён заметный переход еврейского текста от суффикса третьего лица в מֵעֲלִיּוֹתָיו к суффиксу второго лица в מַעֲשֶׂיךָ, поскольку это подлинная поэтическая особенность стиха.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Слова «горних чертогов» слегка возвышенны, но понятны из контекста и сохраняют образ небесного жилища. Местоимения, относящиеся к Богу, написаны с прописной буквы как уместная русская издательская конвенция.
