translation:
  language: ru
  text: Он направляет родники по долинам[a]; между горами они текут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по руслам сезонных потоков» или «по ущельям». Еврейское слово может обозначать долины, русла сезонных потоков или связанные с ними ущелья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשַׁלֵּחַ
  choice: Он посылает
  rationale: Артиклированное причастие породы хифиль описывает постоянное промыслительное действие Бога. В современном русском естественна личная глагольная форма, сохраняющая описательно-длительный смысл.
- source_word: מַעְיָנִים
  choice: источники
  rationale: מַעְיָן обозначает природный источник, родник. «Источники» ясно и уместно для возвышенной поэтической речи.
- source_word: בַּנְּחָלִים
  choice: в долины
  rationale: נחל может обозначать долину, ущелье, русло сезонного потока или сам поток. С учётом глагола שׁלח предлог ב допускает направительное понимание; «в долины» естественно передаёт рельеф местности, не устраняя лексическую неоднозначность, отмеченную в сноске.
- source_word: בֵּין הָרִים
  choice: между горами
  rationale: Прямо передаёт пространственное положение вод между горными склонами.
- source_word: יְהַלֵּכוּן
  choice: текут они
  rationale: Буквально глагол הלך означает «идти», но применительно к воде русское «течь» естественно выражает движение. Постпозиция местоимения поддерживает поэтический ритм и ясно связывает глагол с источниками.
theological_decisions:
- issue: Неявно выраженный субъект причастия הַמְשַׁלֵּחַ
  choice: «Он» относится к Богу
  alternative: «Посылающий» без явно названного субъекта
  rationale: Контекст псалма изображает Божье устроение творения. Русская личная форма требует местоимения, и «Он» сохраняет контекстуальную отсылку, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «текут они» сохраняет параллелизм стиха без архаизации; тире ясно разделяет две поэтические строки.
