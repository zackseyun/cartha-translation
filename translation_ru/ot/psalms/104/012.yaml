translation:
  language: ru
  text: Над ними обитают птицы небесные; среди ветвей[a] они подают голос.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди листвы» либо «среди сучьев». Редкое еврейское слово может в широком смысле обозначать покрытые листвой ветви.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵיהֶם
  choice: Над ними
  rationale: Предлог עַל с местоименным суффиксом естественно указывает на пространство над упомянутыми ранее водными потоками; «над ними» сохраняет связь с предыдущим стихом и поэтический образ.
- source_word: עוֹף הַשָּׁמַיִם
  choice: птицы небесные
  rationale: Собирательное עוֹף передано обычным русским множественным числом «птицы», а הַשָּׁמַיִם — поэтически возвышенным, но понятным определением «небесные».
- source_word: יִשְׁכּוֹן
  choice: обитают
  rationale: Глагол שׁכן означает постоянное пребывание или обитание. «Обитают» не добавляет отсутствующего в еврейском тексте указания на гнездование.
- source_word: מִבֵּין
  choice: среди
  rationale: Оборот обозначает голос, исходящий из пространства между ветвями. Русское «среди» естественно выражает расположение птиц внутри растительности, хотя оттенок исходной точки передаётся контекстом менее буквально.
- source_word: עֳפָאיִם
  choice: ветвей
  rationale: Редкое существительное, вероятно, обозначает ветви либо лиственную растительность. «Ветви» ясно и естественно соответствует изображённой сцене; неопределённость отмечена в сноске.
- source_word: יִתְּנוּ קוֹל
  choice: они подают голос
  rationale: Буквально выражение означает «дают голос». Русский оборот «подают голос» сохраняет образ и не уточняет его до «поют», чего сам еврейский текст прямо не говорит.
