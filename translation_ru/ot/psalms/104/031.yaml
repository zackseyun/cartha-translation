  text: יְהִ֤י כְב֣וֹד יְהוָ֣ה לְ/עוֹלָ֑ם יִשְׂמַ֖ח יְהוָ֣ה בְּ/מַעֲשָֽׂי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/031.yaml
  text: May the glory of Yahweh be forever[b][a]; may Yahweh rejoice in his works.
translation:
  language: ru
  text: Да пребудет слава Яхве вовеки; да радуется Яхве Своим творениям.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: да пребудет
  rationale: Юссив выражает пожелание; вместе с לְעוֹלָם глагол «пребудет» естественно передаёт мысль о непрерывном существовании.
- source_word: כְבוֹד
  choice: слава
  rationale: Обычное и контекстуально уместное соответствие в славословии, передающее величие и сияние Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Краткое, поэтичное и понятное обозначение бесконечной длительности.
- source_word: יִשְׂמַח
  choice: да радуется
  rationale: Сохраняет параллельное пожелание второй части стиха и поэтический тон.
- source_word: בְּמַעֲשָׂיו
  choice: Своим творениям
  rationale: В контексте Псалма 104 речь идёт о сотворённом Богом мире; русский глагол «радоваться» естественно управляет дательным падежом, который здесь передаёт значение еврейского בְּ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте дважды употреблено личное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Отношение Яхве к Его делам в בְּמַעֲשָׂיו
  choice: радуется Своим творениям
  alternative: радуется о Своих творениях / над Своими творениями
  rationale: Дательный падеж после «радоваться» естественно выражает объект радости, не вводя более узкого толкования пространственного или властного отношения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Формула «да пребудет… да радуется» сохраняет параллелизм и характер пожелания; «вовеки» уместно в библейской поэзии и остаётся понятным современному читателю.
