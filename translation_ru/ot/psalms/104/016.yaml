  yaml_path: translation/ot/psalms/104/016.yaml
  text: The trees of Yahweh are satisfied[a], the cedars of Lebanon that he planted,
translation:
  language: ru
  text: Насыщаются[a] деревья Яхве — кедры Ливана, которые он насадил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наполняются», «получают вдоволь». Еврейский глагол означает полную обеспеченность или насыщение; в данном контексте речь идёт о воде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂבְּעוּ
  choice: насыщаются
  rationale: Форма Qal от שבע передаёт состояние полной обеспеченности, когда деревья получают влагу вдоволь. «Насыщаются» сохраняет образную силу еврейского глагола и естественно звучит в поэтическом контексте.
- source_word: עֲצֵי יְהוָה
  choice: деревья Яхве
  rationale: Сопряжённая конструкция передана буквально и ясно; личное имя יהוה транслитерировано как «Яхве», а не заменено титулом.
- source_word: אַרְזֵי לְבָנוֹן
  choice: кедры Ливана
  rationale: Вторая строка поясняет, какие именно «деревья Яхве» имеются в виду; тире естественно оформляет это приложение по-русски.
- source_word: אֲשֶׁר נָטָע
  choice: которые он насадил
  rationale: Относительное предложение относится к кедрам; подразумеваемый субъект глагола — Бог. «Насадил» соответствует возвышенному поэтическому регистру и образу Божьего устроения творения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно сохраняется в транслитерации, а не заменяется титулом.
- issue: Подразумеваемый субъект נָטָע
  choice: он
  alternative: Яхве
  rationale: Еврейский глагол содержит субъект третьего лица мужского рода, понятный из контекста. Местоимение сохраняет лаконичность оригинала, не повторяя имя.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма. Тире обозначает пояснительное приложение. Местоимение «он» оставлено со строчной буквы согласно нейтральной современной орфографической практике.
