  yaml_path: translation/ot/psalms/104/035.yaml
  text: May sinners be finished from the earth[a], and may the wicked be no more. Bless Yahweh, O my soul[b]. Hallelujah!
translation:
  language: ru
  text: Да исчезнут грешники с земли[a], и нечестивых больше не будет. Благослови Яхве, душа моя. Аллилуйя![b]
  philosophy: optimal-equivalence
  footnotes:
