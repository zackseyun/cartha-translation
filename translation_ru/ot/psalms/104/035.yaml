    text: 'По-еврейски: «Хвалите Ях!» Выражение традиционно передаётся как «Аллилуйя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתַּמּוּ
  choice: да исчезнут
  rationale: Форма Qal imperfect 3-го лица множественного числа от תמם выражает пожелание и может означать «прийти к концу, прекратиться». «Да исчезнут» естественно передаёт устранение с земли, не превращая пожелание в прямое повеление.
- source_word: חַטָּאִים
  choice: грешники
  rationale: Субстантивированное обозначение людей, характеризуемых грехом; краткий и точный русский эквивалент.
- source_word: מִן הָאָרֶץ
  choice: с земли
  rationale: В космическом контексте Псалма 104 אֶרֶץ обозначает землю в целом, а не отдельную страну.
- source_word: וּרְשָׁעִים
  choice: и нечестивых
  rationale: Передаёт личное обозначение нравственно виновных людей и естественно сочетается с русской конструкцией «не будет».
- source_word: עוֹד אֵינָם
  choice: больше не будет
  rationale: Естественно передаёт прекращение их существования или присутствия, сохраняя поэтическую краткость.
- source_word: בָּרֲכִי נַפְשִׁי
  choice: Благослови, душа моя
  rationale: Сохраняет обращённый к самому себе призыв псалмопевца и обычное значение ברך, когда объектом выступает Бог.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: הַלְלוּ יָהּ
  choice: Аллилуйя!
  rationale: Устоявшаяся русская форма литургического возгласа; буквальный смысл пояснён в сноске.
theological_decisions:
- issue: Идёт ли речь об исчезновении грехов или самих грешников
  choice: Текст говорит о грешниках и нечестивых, которых больше не будет на земле.
  alternative: Пусть с земли исчезнут грехи или греховность.
  rationale: חַטָּאִים и רְשָׁעִים обозначают людей, а не грех как отвлечённое понятие. Форма «да исчезнут» сохраняет характер молитвенного пожелания и не смягчает напряжённость исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Синтаксис прост и понятен; сохранены пожелательное «да», самообращение «душа моя», личное имя Яхве и традиционный возглас «Аллилуйя».
