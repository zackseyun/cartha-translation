  text: עֹשֶׂ֣ה מַלְאָכָ֣י/ו רוּח֑וֹת מְ֝שָׁרְתָ֗י/ו אֵ֣שׁ לֹהֵֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/004.yaml
  text: He makes his messengers winds[b][a], his ministers a flaming fire.
translation:
  language: ru
  text: Он делает Своих вестников ветрами[b][a], Своих служителей — пылающим огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он делает Своих ангелов духами, Своих служителей — пламенем огня». Этому традиционному прочтению следует Евр 1:7.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово רוּחוֹת может означать «ветры» или «духи».
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה
  choice: делает
  rationale: Причастие от עשה в данном контексте описывает характерное действие Бога. «Делает» естественно передаёт глагольную силу формы и сохраняет синтаксическую неоднозначность стиха.
- source_word: מַלְאָכָיו
  choice: Своих вестников
  rationale: מַלְאָךְ может означать как «вестник», так и «ангел». «Вестники» сохраняет основное лексическое значение, не предрешая, имеются ли в виду небесные существа или силы природы как Божьи посланцы.
- source_word: רוּחוֹת
  choice: ветрами
  rationale: רוּחַ означает «ветер», «дыхание» или «дух». В гимне о творении и в параллели с огнём значение «ветры» особенно уместно; вариант «духи» сохранён в сносках.
- source_word: מְשָׁרְתָיו
  choice: Своих служителей
  rationale: Слово обозначает тех, кто несёт службу. «Служители» передаёт оттенок исполнения поручений и звучит естественно в современном литературном русском.
- source_word: אֵשׁ
  choice: огнём
  rationale: Прямое значение — «огонь»; творительный падеж обусловлен русским управлением глагола «делает» в данной конструкции.
- source_word: לֹהֵט
  choice: пылающим
  rationale: Форма характеризует огонь как ярко горящий. «Пылающий» сохраняет динамичность и поэтическую выразительность образа.
theological_decisions:
- issue: Говорит ли стих об ангелах и духах или о вестниках и ветрах как Божьих орудиях
  choice: «Он делает Своих вестников ветрами, Своих служителей — пылающим огнём»
  alternative: '«Он делает Своих ангелов духами, Своих служителей — пламенем огня»; также возможно: «Он делает ветры Своими вестниками, языки пламени — Своими служителями».'
  rationale: Еврейская лексика и синтаксис допускают несколько прочтений. Контекст Псалма 104, прославляющего Бога-Творца и силы природы, поддерживает основное прочтение с «ветрами», однако традиционное ангелологическое прочтение, отражённое в Евр 1:7, сохранено в сноске, чтобы не устранять подлинную богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Заглавное «Своих» указывает на Бога согласно принятой русской издательской традиции. Параллелизм и образность оригинала сохранены без конфессионального уточнения природы вестников.
