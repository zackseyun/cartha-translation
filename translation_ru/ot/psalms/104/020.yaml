lexical_decisions:
- source_word: תָּשֶׁת
  choice: Ты наводишь
  rationale: Форма 2-го лица мужского рода единственного числа прямо обращена к Богу; глагол означает «помещать, устанавливать». Сочетание «наводишь тьму» естественно по-русски передаёт активное действие Бога.
- source_word: חֹשֶׁךְ
  choice: тьму
  rationale: Прямое соответствие еврейскому слову со значением «тьма, темнота».
- source_word: וִיהִי לָיְלָה
  choice: и наступает ночь
  rationale: Передаёт возникающее вследствие первого действия состояние и звучит естественно в современном русском языке.
- source_word: בּוֹ
  choice: в ней
  rationale: Местоимение отнесено к ближайшему существительному «ночь»; сохранён местно-временной образ еврейского выражения.
- source_word: תִרְמֹשׂ
  choice: бродят
  rationale: Глагол רמשׂ обозначает движение живых существ, в том числе ползание или передвижение ночью. «Бродят» естественно описывает лесных зверей и не вводит обязательного оттенка охоты.
- source_word: כָּל חַיְתוֹ יָעַר
  choice: все лесные звери
  rationale: Естественная русская передача собирательного сочетания «все звери леса» при сохранении поэтического регистра.
theological_decisions:
- issue: Действие Бога при установлении порядка творения
  choice: Бог активно наводит тьму, после чего наступает ночь.
  alternative: Бог лишь допускает наступление тьмы и ночи.
  rationale: Глагол во 2-м лице прямо приписывает действие Богу; перевод сохраняет эту активность, не добавляя философских утверждений о природе причинности.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим, достойным звучанием. «Лесные звери» естественнее буквального «звери леса», а «бродят» сохраняет широту исходного глагола без излишне хищного оттенка слова «рыщут».
