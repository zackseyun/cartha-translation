id: PSA.104.1
reference: Psalms 104:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בָּרֲכִ֥י נַפְשִׁ֗/י אֶת יְה֫וָ֥ה יְהוָ֣ה אֱ֭לֹהַ/י גָּדַ֣לְתָּ מְּאֹ֑ד ה֭וֹד וְ/הָדָ֣ר לָבָֽשְׁתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/001.yaml
  text: Bless Yahweh[a], O my soul! Yahweh my God, you are very great; you have clothed yourself with splendor and majesty.
translation:
  language: ru
  text: Благослови, душа моя, Яхве![a] Яхве, Боже мой, как Ты велик! Величием и великолепием Ты облачён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH (יהוה) — личное имя Бога; также передаётся как «Господь» или «Иегова».
    reason: Пояснение передачи тетраграмматона и традиционных вариантов.
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Благослови
  rationale: Повелительная форма женского рода обращена к душе псалмопевца. «Благослови» сохраняет характерное для славословия значение ברך и точнее исходного образа, чем более общее «прославь».
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Сохраняет прямое обращение псалмопевца к самому себе и естественно звучит в русской поэтической речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное Божье имя, а не заменяет его титулом; написание «Яхве» понятно современному русскому читателю.
- source_word: יְהוָה אֱלֹהַי
  choice: Яхве, Боже мой
  rationale: Пунктуация обозначает прямое обращение, а звательная форма «Боже» естественно передаёт его по-русски.
- source_word: גָּדַלְתָּ מְּאֹד
  choice: как Ты велик
  rationale: Перфект глагола здесь имеет стативно-хвалебный смысл. Восклицательное «как Ты велик» естественно передаёт усиление מְאֹד, не подразумевая, будто Бог стал великим.
- source_word: הוֹד וְהָדָר
  choice: величием и великолепием
  rationale: Парные существительные обозначают сияющее достоинство и царственную красоту; выбранная пара сохраняет смысловой параллелизм и образ одеяния.
- source_word: לָבָשְׁתָּ
  choice: Ты облачён
  rationale: Передаёт метафору величия и великолепия как Божьего одеяния. Русская краткая форма естественна и не вводит излишне буквальное рефлексивное действие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» сохраняет различие между именем и титулом; сноска поясняет традиционные варианты.
- issue: Стативное или результативное понимание גָּדַלְתָּ
  choice: как Ты велик
  alternative: Ты стал весьма велик
  rationale: В контексте славословия форма описывает присущее Богу величие, а не изменение Его состояния.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным поэтическим строем. Инверсия «душа моя» и форма «Боже» уместны для прямого обращения; архаизмы сведены к минимуму.
