  text: Из них пьют все полевые звери; дикие ослы утоляют жажду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַשְׁקוּ
  choice: из них пьют
  rationale: 'Форма глагола שׁקה буквально связана с поением или снабжением водой; поскольку подразумеваемым субъектом служат воды из предыдущего стиха, по-русски естественно передать смысл с точки зрения животных: «из них пьют».'
- source_word: כָּל
  choice: все
  rationale: Передаёт собирательно-распределительное значение применительно к множественному «звери».
- source_word: חַיְתוֹ שָׂדָי
  choice: полевые звери
  rationale: Сочетание обозначает диких животных открытой местности; «полевые звери» — ясная, краткая и уместная для поэтического регистра формулировка.
- source_word: יִשְׁבְּרוּ
  choice: утоляют
  rationale: В сочетании с «жаждой» глагол выражает идиоматическое значение удовлетворения, утоления жажды, а не буквального «ломают».
- source_word: פְרָאִים
  choice: дикие ослы
  rationale: Обозначает диких ослов, или онагров; общеупотребительное «дикие ослы» понятнее технического названия.
- source_word: צְמָאָם
  choice: жажду
  rationale: Суффикс третьего лица множественного числа в русском естественно передаётся без притяжательного местоимения, поскольку субъект уже назван.
