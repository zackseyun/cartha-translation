  text: עֹֽטֶה א֭וֹר כַּ/שַּׂלְמָ֑ה נוֹטֶ֥ה שָׁ֝מַ֗יִם כַּ/יְרִיעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/002.yaml
  text: covering yourself with light as with a garment[a], stretching out the heavens like a curtain.
translation:
  language: ru
  text: облекающийся светом, как одеждой, расстилающий небеса, как полотнище[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как завесу шатра». Еврейское слово может обозначать полотнище или завесу, использовавшуюся в шатре или скинии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹטֶה
  choice: облекающийся
  rationale: Причастие породы qal передаёт продолжающийся поэтический образ; возвратная форма естественно выражает, что Бог покрывает светом самого себя.
- source_word: אוֹר
  choice: светом
  rationale: Существительное прямо обозначает свет как то, во что метафорически облекается Бог; замена на «сияние» или «великолепие» не требуется.
- source_word: כַשַּׂלְמָה
  choice: как одеждой
  rationale: שַׂלְמָה имеет общее значение одежды или одеяния; творительный падеж естественно согласуется с глаголом «облекаться» и не сужает образ до определённого вида одежды.
- source_word: נוֹטֶה
  choice: расстилающий
  rationale: Причастие qal от נטה обозначает растягивание или простирание; «расстилающий» сохраняет наглядный образ развёртываемого полотнища.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Форма множественного числа в контексте гимна творению имеет возвышенный космический смысл, который естественно передаётся словом «небеса».
- source_word: כַיְרִיעָה
  choice: как полотнище
  rationale: יְרִיעָה — полотнище, завеса или часть покрытия шатра. «Полотнище» лучше, чем бытовое «занавес», передаёт предмет, который можно широко расстелить, не добавляя в основной текст явно не названный шатёр.
theological_decisions:
- issue: Антропоморфный образ Бога, облекающегося светом и расстилающего небеса
  choice: Сохранить прямой поэтический образ
  alternative: 'Истолковать описательно: «окружённый светом» или «являющий свет как Свою славу»'
  rationale: Еврейский текст рисует величие и творческую власть Бога через конкретные метафоры. Их прямое сохранение не подменяет поэзию богословским объяснением.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным поэтическим строем. Параллельные причастные обороты сохраняют синтаксис и движение еврейской строки; строчная буква уместна, поскольку стих продолжает предложение предыдущей строки.
