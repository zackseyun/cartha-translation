  text: מָֽה רַבּ֬וּ מַעֲשֶׂ֨י/ךָ יְֽהוָ֗ה כֻּ֭לָּ/ם בְּ/חָכְמָ֣ה עָשִׂ֑יתָ מָלְאָ֥ה הָ֝/אָ֗רֶץ קִנְיָנֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/024.yaml
  text: How many are your works[a], O Yahweh! In wisdom you have made them all; the earth is full of your creatures.
translation:
  language: ru
  text: Как многочисленны Твои дела, Яхве! Ты всё сотворил с мудростью; земля полна Твоих созданий.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того, что принадлежит Тебе». Еврейское слово может обозначать приобретённое или находящееся во владении; здесь оно, вероятно, широко относится ко всему сотворённому Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה רַבּוּ
  choice: Как многочисленны
  rationale: Передаёт восклицание о множестве и разнообразии Божьих дел, не смещая акцент исключительно на их величие.
- source_word: מַעֲשֶׂיךָ
  choice: Твои дела
  rationale: Прямое и естественное соответствие; в контексте псалма речь идёт о делах творения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: בְּחָכְמָה
  choice: с мудростью
  rationale: Сохраняет существительное «мудрость» и указывает на образ совершения творения; по-русски звучит естественнее, чем буквальное «в мудрости».
- source_word: עָשִׂיתָ
  choice: сотворил
  rationale: В контексте гимна творению точнее и естественнее общего «сделал».
- source_word: מָלְאָה הָאָרֶץ
  choice: земля полна
  rationale: Передаёт наличное состояние, выраженное результативным перфектом.
- source_word: קִנְיָנֶךָ
  choice: Твоих созданий
  rationale: Контекстуально указывает на то, что Бог произвёл и чем владеет; при этом более буквальное значение владения отмечено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение קִנְיָנֶךָ
  choice: Твоих созданий
  alternative: того, что принадлежит Тебе
  rationale: В гимне творению контекст поддерживает отнесение слова к созданному Богом, но еврейское слово само по себе подчёркивает приобретение или владение, поэтому неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но доступным поэтическим звучанием. Заглавные местоимения, относящиеся к Богу, использованы как принятый в русском библейском стиле знак почтительности.
