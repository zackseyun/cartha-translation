  text: כֻּ֭לָּ/ם אֵלֶ֣י/ךָ יְשַׂבֵּר֑וּ/ן לָ/תֵ֖ת אָכְלָ֣/ם בְּ/עִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/027.yaml
  text: All of them wait for you to give them their food in its time[a][b].
translation:
  language: ru
  text: Все они ожидают от Тебя, что Ты дашь им пищу вовремя[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с надеждой смотрят на Тебя»; или: «надеются на Тебя».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в надлежащее время»; или: «в свой срок».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Все они
  rationale: Передаёт совокупность всех ранее упомянутых живых существ и сохраняет отсылку к контексту.
- source_word: אֵלֶיךָ
  choice: от Тебя
  rationale: При глаголе ожидания выражает направленность надежды на Того, от кого зависит пропитание; по-русски естественно «ожидать от Тебя».
- source_word: יְשַׂבֵּרוּן
  choice: ожидают
  rationale: Порода пиэль здесь обозначает напряжённое, исполненное надежды ожидание. «Ожидают» естественно сочетается с последующим изъяснительным оборотом и не усиливает смысл до явно выраженного упования.
- source_word: לָתֵת
  choice: что Ты дашь
  rationale: Инфинитив раскрывает содержание ожидания; личная конструкция по-русски ясно сохраняет Бога как подразумеваемого подателя пищи.
- source_word: אָכְלָם
  choice: им пищу
  rationale: Общее обозначение пищи подходит ко всем существам в контексте и не сужает значение до добычи хищников.
- source_word: בְּעִתּוֹ
  choice: вовремя
  rationale: Кратко и естественно выражает предоставление пищи в надлежащий, соответствующий ей срок, не конкретизируя его сверх еврейского текста.
theological_decisions:
- issue: Божественное попечение о творении
  choice: Стих показывает зависимость всех живых существ от Бога, который даёт им пищу.
  alternative: Усилить формулировку до явно выраженного упования или поклонения.
  rationale: Еврейский текст передаёт ожидающую зависимость творений от Бога, но не требует добавлять более сильную вероучительную формулировку.
translation_notes:
  register: Современный литературный русский язык; обращение к Богу оформлено с традиционной прописной буквы. Конструкция ясная и достойная, без архаизмов и конфессионально окрашенных добавлений.
