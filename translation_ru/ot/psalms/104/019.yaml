  language: ru
  text: Он сотворил луну для установленных времён[a]; солнце знает свой закат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «времён года»; или: «праздничных сроков». Еврейское слово может обозначать установленные или назначенные времена, в том числе времена праздников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: сотворил
  rationale: Глагол עשה в породе каль обычно означает «делать, создавать». «Сотворил» естественно в контексте Божьего творения и не приписывает глаголу значение «назначил».
- source_word: יָרֵחַ
  choice: луну
  rationale: Прямое обозначение небесного светила.
- source_word: לְמוֹעֲדִים
  choice: для установленных времён
  rationale: מוֹעֵד может обозначать назначенное или установленное время, сезон либо праздничный срок. Широкая формулировка сохраняет связь луны с упорядочением календаря, не сужая смысл только до времён года или праздников.
- source_word: שֶׁמֶשׁ
  choice: солнце
  rationale: Стандартное соответствие.
- source_word: יָדַע
  choice: знает
  rationale: Буквальное значение ידע сохраняет поэтическое олицетворение солнца; функциональная передача вроде «соблюдает» сделала бы образ менее выразительным.
- source_word: מְבוֹאוֹ
  choice: свой закат
  rationale: Существительное מבוא означает вхождение или приход, а применительно к солнцу — его заход, закат. «Свой закат» кратко и поэтично передаёт этот образ.
theological_decisions:
- issue: Значение מוֹעֲדִים в контексте устройства творения
  choice: Широкое «установленные времена»
  alternative: «времена года» или «праздники»
  rationale: Луна служит для обозначения определённых сроков, включая календарные периоды и праздничные даты. Широкая передача сохраняет смысловой диапазон и не навязывает исключительно природное либо культовое толкование.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Сохранены параллелизм строк и олицетворение солнца; лексика возвышенная, но понятная обычному читателю.
