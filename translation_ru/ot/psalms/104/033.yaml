  text: I will sing to Yahweh as long as I live[b][a]; I will make music to my God while I still live.
translation:
  language: ru
  text: Буду петь Яхве, пока живу; буду воспевать Бога моего, пока ещё живу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока ещё существую». Еврейское выражение может обозначать продолжающееся существование в более широком смысле, чем только срок жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָשִׁירָה
  choice: буду петь
  rationale: Когортатив Qal, 1-е лицо единственного числа, выражает твёрдое намерение продолжать хвалу; будущее время естественно передаёт этот оттенок по-русски.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает на адресата пения, а тетраграмматон передан как личное имя «Яхве».
- source_word: בְּחַיָּי
  choice: всю мою жизнь
  rationale: Буквально «в моей жизни»; в контексте выражение обозначает продолжительность всей жизни и естественно передаётся по-русски как «всю мою жизнь».
- source_word: אֲזַמְּרָה
  choice: буду воспевать
  rationale: Когортатив Piel от זמר обозначает музыкальное прославление. «Воспевать» сохраняет возвышенный поэтический регистр и отличает этот глагол от более общего «петь» в первой строке.
- source_word: לֵאלֹהַי
  choice: моего Бога
  rationale: Суффикс 1-го лица передаёт личное отношение «мой Бог», а предлог ל обозначает адресата хвалы.
- source_word: בְּעוֹדִי
  choice: пока я есть
  rationale: Выражение указывает на продолжающееся существование. «Пока я есть» естественно по-русски и сохраняет небольшое смысловое отличие от בְּחַיָּי в первой строке.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет его функцию и не заменяет титулом.
- issue: Смысл בְּעוֹדִי
  choice: пока я есть
  alternative: пока я жив
  rationale: Выбрана формулировка, сохраняющая более широкое значение продолжающегося существования и поэтическое напряжение с параллельным «всю мою жизнь»; возможен и более узкий смысл, указанный в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух строк сохранён без полного сведения двух временных выражений к одной формулировке.
