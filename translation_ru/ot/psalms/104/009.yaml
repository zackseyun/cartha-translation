  text: גְּֽבוּל שַׂ֭מְתָּ בַּל יַֽעֲבֹר֑וּ/ן בַּל יְ֝שׁוּב֗וּ/ן לְ/כַסּ֥וֹת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/009.yaml
  text: You set a boundary they may not cross[b][a]; they may not return to cover the earth.
translation:
  language: ru
  text: Ты установил границу, которую им не перейти[a]; не вернутся они, чтобы покрыть землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предел, который им не перейти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבוּל
  choice: граница
  rationale: Существительное обозначает установленный предел; «граница» естественно передаёт образ рубежа, положенного Богом водам.
- source_word: שַׂמְתָּ
  choice: Ты установил
  rationale: Глагол שׂוּם означает «класть, ставить, устанавливать»; с существительным «граница» по-русски естественно сочетание «установил границу».
- source_word: בַּל יַעֲבֹרוּן
  choice: которой им не перейти
  rationale: Отрицательная частица с имперфектом выражает непреодолимое ограничение; эта русская конструкция ясно передаёт, что воды не могут перейти установленную границу.
- source_word: בַּל יְשׁוּבוּן
  choice: не вернутся они
  rationale: Сохраняется значение שוב «возвращаться» и поэтическое параллельное отрицание, без добавления отсутствующего в еврейском тексте слова «снова».
- source_word: לְכַסּוֹת
  choice: чтобы покрыть
  rationale: Инфинитив כסה буквально означает «покрывать»; перевод сохраняет образ воды, покрывающей землю, не заменяя его толкованием «затопить».
- source_word: הָאָרֶץ
  choice: землю
  rationale: В космическом контексте псалма הָאָרֶץ обозначает землю, а не локальную территорию.
theological_decisions:
- issue: К чему относятся глаголы во множественном числе
  choice: Местоимение «им» и форма «они» оставлены без явного существительного; из контекста ясно, что речь о водах.
  alternative: Прямо добавить «водам» или «воды».
  rationale: Еврейский стих сохраняет местоименную отсылку к водам предыдущего контекста; русский перевод не должен излишне конкретизировать её.
- issue: Связь с повествованием о потопе
  choice: Не добавлять в основной текст слово «снова» и не утверждать явно, что это обещание после потопа.
  alternative: «Они уже не вернутся, чтобы покрыть землю».
  rationale: Образ допускает связь с потопом, однако לְכַסּוֹת выражает цель возвращения, а значение повторности не обозначено отдельным словом; напряжение между творением и потопом следует сохранить.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим порядком слов во второй половине стиха. Строчная «землю» соответствует обозначению мира суши, а не имени собственному.
