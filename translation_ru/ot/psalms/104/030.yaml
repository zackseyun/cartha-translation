  text: תְּשַׁלַּ֣ח ר֭וּחֲ/ךָ יִבָּרֵא֑וּ/ן וּ֝/תְחַדֵּ֗שׁ פְּנֵ֣י אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/104/030.yaml
  text: When you send out your Spirit[a], they are created[b], and you renew the face of the ground.
translation:
  language: ru
  text: Ты посылаешь Твой дух[a] — они сотворяются[b], Ты обновляешь лицо земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоё дыхание» или «Твой ветер»; еврейское слово רוּחַ может иметь все три значения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ты посылаешь Твой дух — они сотворяются».'
    reason: syntactic_alternative
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: посылаешь
  rationale: Порода пиэль глагола שׁלח означает «посылать, высылать». Настоящее время естественно передаёт повторяющееся животворящее действие в контексте псалма; конструкция с «когда» ясно выражает связь со следующим глаголом, не превращая её в жёсткое причинное утверждение.
- source_word: רוּחֲךָ
  choice: Свой Дух
  rationale: רוּחַ может означать «дух», «дыхание» или «ветер». В контексте творения «Дух» естественно передаёт животворящее действие Бога, а местоимение «Свой» устраняет неестественную для русского языка двусмысленность. Другие значения сохранены в сноске.
- source_word: יִבָּרֵאוּן
  choice: они сотворяются
  rationale: Нифаль глагола ברא означает «быть сотворённым». Возвратная форма «сотворяются» кратко и прямо сохраняет пассивный смысл; добавление «заново» не требуется, поскольку обновление выражено следующим глаголом.
- source_word: וּתְחַדֵּשׁ
  choice: и Ты обновляешь
  rationale: Пиэль חדשׁ означает «обновлять, делать новым». «Обновляешь» сохраняет смысл восстановления и оживления, не подразумевая полной замены.
- source_word: פְּנֵי
  choice: лицо
  rationale: Буквально «лицо». Выражение «лицо земли» понятно по-русски и сохраняет поэтический образ еврейского текста; «поверхность» было бы более прозаическим.
- source_word: אֲדָמָה
  choice: земли
  rationale: אֲדָמָה обозначает землю, почву, грунт. В сочетании «лицо земли» слово «земли» звучит естественно и поэтично, при этом контекст указывает на земную поверхность, а не требует значения планеты как космического целого.
theological_decisions:
- issue: Передача רוּחַ в контексте творения
  choice: Свой Дух
  alternative: Своё дыхание; Свой ветер
  rationale: «Дух» лексически допустим и сохраняет богословскую значимость животворящего Божьего действия. Однако еврейское слово объединяет значения духа, дыхания и ветра, поэтому возможные смыслы не исключены, а приведены в сноске.
- issue: Связь между посыланием Духа и сотворением живых существ
  choice: Когда Ты посылаешь Свой Дух, они сотворяются
  alternative: Ты посылаешь Свой Дух — они сотворяются
  rationale: Еврейские глагольные формы допускают тесную временную или результативную связь, но не маркируют её отдельным союзом. «Когда» даёт естественную русскую фразу, а более формальная бессоюзная передача сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим библейским звучанием. Сохранён образ «лица земли». Местоимения, относящиеся к Богу, и «Дух» написаны с прописной буквы как знак уважительного религиозного регистра; архаические формы и инверсии не используются.
