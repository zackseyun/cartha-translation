  text: כֹּ֤ל אֲשֶׁר חָפֵ֥ץ יְהוָ֗ה עָ֫שָׂ֥ה בַּ/שָּׁמַ֥יִם וּ/בָ/אָ֑רֶץ בַּ֝/יַּמִּ֗ים וְ/כָל תְּהוֹמֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/006.yaml
  text: Yahweh does whatever he pleases[a], in heaven and on earth[c][b], in the seas and all the depths.
translation:
  language: ru
  text: Всё, чего желает Яхве, он делает[a] на небесах и на земле, в морях и во всех глубинах[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё, чего пожелал Яхве, он совершил».'
    reason: Возможна передача חָפֵץ как «пожелал», а формы עָשָׂה — как совершённого действия.
  - marker: b
    text: 'То есть в водных глубинах; возможный перевод: «во всех пучинах».'
    reason: תְּהוֹמוֹת обозначает глубокие воды, глубины или пучины.
lexical_decisions:
- source_word: כֹּל אֲשֶׁר
  choice: всё, что
  rationale: Передаёт всеохватность еврейского оборота естественным современным русским выражением.
- source_word: חָפֵץ
  choice: угодно
  rationale: В сочетании «что угодно» естественно охватывает значения желания, благоволения и намерения, не сводя глагол лишь к эмоциональному удовольствию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עָשָׂה
  choice: делает
  rationale: Настоящее время естественно выражает общее утверждение о действиях Яхве; возможное перфектное прочтение сохранено в сноске.
- source_word: בַּשָּׁמַיִם
  choice: на небесах
  rationale: Сохраняет формальное множественное число и образ всеобъемлющей пары «небеса и земля»; это естественная русская библейско-поэтическая формулировка.
- source_word: וּבָאָרֶץ
  choice: и на земле
  rationale: Естественно продолжает меризм «на небесах и на земле».
- source_word: בַּיַּמִּים
  choice: в морях
  rationale: Сохраняет множественное число и поэтическое обозначение мировых вод.
- source_word: וְכָל תְּהוֹמוֹת
  choice: и во всех безднах
  rationale: Сохраняет широкий образ глубин, прежде всего водных, не уточняя его до океанических впадин.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя; транслитерация сохраняет его и не подменяет титулом.
- issue: Видо-временное значение עָשָׂה
  choice: делает
  alternative: сделал; совершил
  rationale: Контекст допускает понимание формы как общего, постоянно верного утверждения о Божьей власти; грамматически возможное указание на совершённое действие отмечено в сноске.
- issue: Смысл חָפֵץ в утверждении о Божьем действии
  choice: что угодно
  alternative: чего желает; что пожелал
  rationale: Формулировка сохраняет связь желания и действия, не добавляя философского или конфессионального определения Божьей воли.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Синтаксис близок к еврейскому, но остаётся естественным; местоимение «он» написано со строчной буквы по общим нормам современного русского текста.
