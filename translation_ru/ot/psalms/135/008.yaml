lexical_decisions:
- source_word: שֶׁ/הִכָּה
  choice: Который поразил
  rationale: Относительная частица с формой глагола נכה продолжает описание Господа. В контексте казни первенцев «поразил» естественно передаёт смертельный исход, не добавляя отдельного слова «насмерть».
- source_word: בְּכוֹרֵי מִצְרָיִם
  choice: первенцев Египта
  rationale: Форма множественного числа в сопряжённом состоянии обозначает всех первенцев, принадлежащих Египту; это устойчивое и ясное русское выражение.
- source_word: מֵ/אָדָם עַד בְּהֵמָה
  choice: от человека до скота
  rationale: Конструкция מִן...עַד выражает полный диапазон. אָדָם здесь противопоставлен животным, а בְּהֵמָה уместно передать как «скот» с учётом контекста египетской казни.
