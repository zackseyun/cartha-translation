translation:
  language: ru
  text: Который поразил первенцев Египта — от человека до скота.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от человека до скота»; это выражение охватывает и людей, и животных.'
