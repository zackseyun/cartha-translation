lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит основание для окружающего призыва хвалить Бога; «потому что» ясно передаёт причинную связь.
- source_word: בָּחַר
  choice: избран
  rationale: Еврейский перфект обозначает совершённое избрание с сохраняющимся результатом; русская краткая страдательная форма естественно выражает этот смысл.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Традиционная русская форма имени; здесь обозначает народ в параллели с Израилем.
- source_word: לּוֹ
  choice: для Себя
  rationale: Передаёт значение принадлежности и особого предназначения при сохранении возвратного отношения к Господу.
- source_word: יָהּ
  choice: Господь
  rationale: Краткая форма божественного имени передана принятой в русском библейском стиле формой; её точная форма отмечена в сноске.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Традиционная русская форма имени, параллельная «Иакову» и обозначающая народ.
- source_word: לִסְגֻלָּתוֹ
  choice: как Его драгоценное достояние
  rationale: סְגֻלָּה означает особо ценимую собственность; «драгоценное достояние» сохраняет одновременно оттенки ценности и принадлежности, а предлог ל передан как «как».
theological_decisions:
- issue: Передача краткой формы божественного имени יָהּ
  choice: Господь
  alternative: Ях
  rationale: Основной текст использует традиционное и понятное русскому читателю именование «Господь», а сноска сохраняет филологически значимый факт, что в еврейском стоит краткая форма имени.
- issue: Отношение Иакова и Израиля
  choice: Поэтический параллелизм, обозначающий один народ
  alternative: Два различных объекта избрания
  rationale: В стихе «Иаков» и «Израиль» стоят параллельно как два наименования народа; перевод сохраняет параллелизм, не добавляя толкования в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмового стиля. Перестройка в страдательную конструкцию избегает двусмысленного «Господь избрал Иакова для Себя» и позволяет естественно сохранить причинное начало стиха. Маркер сноски помещён после всего стиха, поскольку поясняет употреблённое внутри него имя.
