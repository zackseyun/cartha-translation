  text: בָּ֘ר֤וּךְ יְהוָ֨ה מִ/צִּיּ֗וֹן שֹׁ֘כֵ֤ן יְֽרוּשָׁלִָ֗ם הַֽלְלוּ יָֽהּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/021.yaml
  text: Blessed be Yahweh from Zion[a], who dwells in Jerusalem. Hallelujah!
translation:
  language: ru
  text: Благословен Яхве с Сиона, обитающий в Иерусалиме! Аллилуйя![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Хвалите Ях!» Выражение традиционно передаётся по-русски словом «Аллилуйя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Страдательное причастие употреблено в литургической формуле благословения; краткая форма «благословен» естественно и торжественно передаёт её по-русски без добавления отсутствующего в тексте глагола.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: מִצִּיּוֹן
  choice: с Сиона
  rationale: Предлог מִן имеет исходное значение «из, от, с»; выражение указывает на Сион как место, откуда звучит благословение, при этом не устраняя возможной синтаксической связи с именем Яхве.
- source_word: שֹׁכֵן
  choice: обитающий
  rationale: Причастие Qal от שכן означает «обитать, пребывать» и приложением относится к Яхве; «обитающий» сохраняет причастную форму и возвышенный поэтический регистр.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалиме
  rationale: Употреблена общепринятая русская форма географического названия с требуемым предложным падежом.
- source_word: הַלְלוּ יָהּ
  choice: Аллилуйя!
  rationale: Устоявшееся русское литургическое заимствование передаёт еврейское повеление во множественном числе и краткую форму божественного имени; буквальный смысл пояснён в сноске.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией, а не заменено титулом.
- issue: Синтаксическая связь מִצִּיּוֹן («с Сиона»)
  choice: Сохранить компактное расположение после имени Яхве
  alternative: «Да благословляют Яхве с Сиона»; «Благословен Яхве, пребывающий на Сионе»
  rationale: Еврейский текст буквально говорит «Благословен Яхве с Сиона»; предложенная формулировка не превращает форму благословения в явно выраженное повеление и не отождествляет Сион с местом пребывания вопреки следующей фразе об Иерусалиме.
translation_notes:
  register: Современный литературный русский с торжественным псалмическим звучанием. Сохранены краткость, параллельная литургическая формула и традиционное «Аллилуйя»; архаические синтаксические обороты сведены к минимуму.
