  text: אָזְנַ֣יִם לָ֭/הֶם וְ/לֹ֣א יַאֲזִ֑ינוּ אַ֝֗ף אֵין יֶשׁ ר֥וּחַ בְּ/פִי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/017.yaml
  text: They have ears[a], but they do not hear; indeed, there is no breath in their mouths.
translation:
  language: ru
  text: У них есть уши, но они не слышат; более того, в их устах нет дыхания[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духа». Еврейское слово רוּחַ может означать «дыхание», «дух» или «ветер»; здесь упоминание безжизненных идолов и выражение «в их устах» указывают прежде всего на дыхание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָזְנַיִם לָהֶם
  choice: У них есть уши
  rationale: Еврейская безглагольная конструкция принадлежности естественно передаётся по-русски оборотом «у них есть»; конкретный образ ушей сохранён.
- source_word: וְלֹא יַאֲזִינוּ
  choice: но они не слышат
  rationale: Союз передаёт противопоставление между наличием ушей и неспособностью слышать. Глагол в породе хифиль может означать внимательное слушание, однако в контексте телесных образов естественное «не слышат» ясно выражает полную неспособность идолов воспринимать звук.
- source_word: אַף
  choice: более того
  rationale: 'Частица усиливает и развивает мысль: идолы не только не слышат, но совершенно безжизненны.'
- source_word: אֵין יֶשׁ רוּחַ
  choice: нет дыхания
  rationale: Сочетание отрицает наличие чего-либо, а רוּחַ здесь конкретно указывает на дыхание как признак жизни. Такой перевод согласуется с упоминанием уст и полемикой против безжизненных идолов.
- source_word: בְּפִיהֶם
  choice: в их устах
  rationale: Сохранён телесный образ оригинала. Слово «уста» придаёт строке уместное поэтическое достоинство и остаётся понятным современному читателю.
theological_decisions:
- issue: Значение רוּחַ в контексте полемики против идолов
  choice: дыхание
  alternative: дух
  rationale: Упоминание уст и последовательное описание неработающих частей тела указывают прежде всего на отсутствие дыхания, то есть жизни. Вариант «дух» остаётся лексически возможным и отмечен в сноске, чтобы не скрывать смысловой диапазон еврейского слова.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим оттенком. Синтаксис прост и понятен; «в их устах» сохраняет достоинство псалмовой речи и образность оригинала.
