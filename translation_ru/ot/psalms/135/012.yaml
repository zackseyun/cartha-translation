  yaml_path: translation/ot/psalms/135/012.yaml
  text: And he gave their land as an inheritance[a], an inheritance to Israel his people.
translation:
  language: ru
  text: 'И отдал их землю в наследие[a], в наследие Израилю, Своему народу.


    [a] Или: «в удел»; в еврейском тексте слово «наследие» повторено для усиления.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в удел»; в еврейском тексте слово «наследие» повторено для усиления.'
    reason: Лексическая альтернатива и пояснение поэтического повтора.
lexical_decisions:
- source_word: וְנָתַן
  choice: И отдал
  rationale: Форма глагола נתן продолжает повествовательную последовательность и в данном контексте имеет прошедшее значение; подлежащее восстанавливается из контекста.
- source_word: אַרְצָם
  choice: их землю
  rationale: אֶרֶץ здесь обозначает землю побеждённых народов и царей, упомянутых ранее; «землю» — прямой и естественный русский эквивалент.
- source_word: נַחֲלָה
  choice: в наследие
  rationale: Первое употребление передаёт землю как дарованный Израилю наследственный удел; «в наследие» сохраняет смысл распределённого владения.
- source_word: נַחֲלָה
  choice: в наследие
  rationale: Второе употребление намеренно повторено вслед за еврейским текстом, чтобы сохранить поэтическое усиление.
- source_word: לְיִשְׂרָאֵל
  choice: Израилю
  rationale: Предлог לְ указывает на получателя; русский дательный падеж передаёт это естественно и точно.
- source_word: עַמּוֹ
  choice: Своему народу
  rationale: עַם означает «народ»; возвратное притяжательное местоимение ясно соотносит народ с подразумеваемым субъектом действия и звучит естественно по-русски.
theological_decisions:
- issue: Поэтическое повторение נַחֲלָה
  choice: 'Сохранить в основном тексте повтор: «в наследие, в наследие»'
  alternative: Сгладить фразу, оставив слово только один раз
  rationale: Повтор присутствует в еврейском тексте и подчёркивает значение земли как данного Израилю наследия; его сохранение не привносит дополнительного толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общепонятным библейским звучанием. Порядок слов слегка адаптирован к русской норме; лексический и поэтический повтор оригинала сохранён.
