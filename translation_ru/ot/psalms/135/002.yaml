  text: שֶׁ֣֭/עֹֽמְדִים בְּ/בֵ֣ית יְהוָ֑ה בְּ֝/חַצְר֗וֹת בֵּ֣ית אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/002.yaml
  text: who stand in the house of Yahweh[b][a], in the courts of the house of our God.
translation:
  language: ru
  text: стоящие в доме Яхве[b], во дворах[a] дома нашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на храмовых дворах».'
    reason: lexical_alternative
  - marker: b
    text: «Дом Яхве» и «дом нашего Бога» здесь означают храм вместе с относящимися к нему дворами.
    reason: cultural_note
lexical_decisions:
- source_word: שֶׁעֹמְדִים
  choice: стоящие
  rationale: Относительная частица с причастием продолжает обращение предыдущего стиха. Русское причастие сохраняет длительный, характеризующий смысл и естественно связывает строки.
- source_word: בְּבֵית
  choice: в доме
  rationale: בַּיִת буквально означает «дом»; здесь речь о храме и его пределах. Сохранение образа «дома» передаёт еврейскую формулировку и поэтический параллелизм.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּחַצְרוֹת
  choice: во дворах
  rationale: Множественное число חָצֵר в храмовом контексте обозначает дворы храмового комплекса; «во дворах» звучит естественно и сохраняет конкретный пространственный образ.
- source_word: בֵּית
  choice: дома
  rationale: Повтор слова «дом» сохранён ради лексического соответствия и еврейского поэтического параллелизма.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Передаёт суффикс первого лица множественного числа и общинный характер исповедания без добавочного толкования.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Форма «Яхве» передаёт его как имя и не подменяет титулом.
- issue: Значение выражения «дом Яхве»
  choice: Сохранить «дом», пояснив храмовый смысл в сноске
  alternative: Перевести непосредственно как «храм»
  rationale: Контекст ясно указывает на храмовый комплекс, однако буквальный образ «дома» значим и повторяется во второй половине строки; пояснение избегает как неясности, так и утраты образа.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Форма «стоящие» сохраняет зависимость строки от обращения в предыдущем стихе; повтор «дом… дома» намеренно передаёт структуру оригинала.
