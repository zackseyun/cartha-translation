  text: בֵּ֣ית הַ֭/לֵּוִי בָּרֲכ֣וּ אֶת יְהוָ֑ה יִֽרְאֵ֥י יְ֝הוָ֗ה בָּרֲכ֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/020.yaml
  text: House of Levi[a], bless Yahweh; you who fear Yahweh[b], bless Yahweh.
translation:
  language: ru
  text: Дом Левия[a], благословляйте Яхве! Боящиеся Яхве[b], благословляйте Яхве!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом Левия» — собирательное обозначение левитского рода или общины.'
    reason: cultural_note
  - marker: b
    text: 'Или: «вы, боящиеся Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית הַלֵּוִי
  choice: Дом Левия
  rationale: Буквальное соответствие конструкции «дом Левия». В ряду литургических обращений к дому Израиля и дому Аарона это корпоративное обозначение левитского рода и общины; перевод сохраняет параллелизм и образ дома.
- source_word: בָּרֲכוּ
  choice: благословляйте
  rationale: Повелительная форма множественного числа от ברך. В контексте богослужения значение сближается с «восхваляйте», но «благословляйте» точнее передаёт основной глагол и повторяющийся литургический призыв.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом «Господь».
- source_word: יִרְאֵי יְהוָה
  choice: Боящиеся Яхве
  rationale: Причастная конструкция обозначает людей, для которых характерен благоговейный страх перед Яхве. Субстантивированное причастие естественно для торжественного русского обращения и сохраняет краткость оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Смысл выражения יִרְאֵי יְהוָה
  choice: Боящиеся Яхве
  alternative: Все, кто чтит Яхве
  rationale: Перевод сохраняет библейское понятие страха перед Богом, не сводя его только к почтению и не уточняя богословский оттенок сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным литургическим ритмом. Повтор и параллельная структура еврейского стиха сохранены; восклицательные знаки естественно передают настойчивость двух повелительных призывов.
