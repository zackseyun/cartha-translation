  source_fidelity: 'Текст точно передаёт еврейский параллелизм и две формы повелительного наклонения множественного числа: «Дом Левия … благословляйте Яхве» и «Боящиеся Яхве … благословляйте Яхве». «Дом Левия» обоснованно сохраняет буквальную конструкцию בֵּית הַלֵּוִי и её корпоративный характер в контексте соседних призывов к дому Израиля и дому Аарона. Выражение «боящиеся Яхве» корректно передаёт субстантивированный причастный оборот יִרְאֵי יְהוָה без излишнего толкования.'
