  text: הַ֥לְלוּ יָ֨הּ הַֽ֭לְלוּ אֶת שֵׁ֣ם יְהוָ֑ה הַֽ֝לְלוּ עַבְדֵ֥י יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/001.yaml
  text: Praise Yah! Praise the name of Yahweh[a]; praise, O servants of Yahweh[b],
translation:
  language: ru
  text: 'Аллилуия![a]

    Хвалите имя Яхве!

    Хвалите, слуги Яхве!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «халелу-Йах» буквально означает «хвалите Яха»; «Ях» — сокращённая форма имени Яхве.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Аллилуия
  rationale: Устоявшееся в русском языке богослужебное восклицание точно передаёт еврейское הַלְלוּ־יָהּ; буквальный смысл раскрыт в сноске, а краткая форма Божьего имени не смешивается с полным יְהוָה далее.
- source_word: הַלְלוּ
  choice: Хвалите
  rationale: Форма повелительного наклонения, множественного числа, породы пиэль от הלל; «хвалите» естественно и прямо передаёт призыв.
- source_word: אֶת שֵׁם יְהוָה
  choice: имя Яхве
  rationale: Сохраняется прямое дополнение и акцент исходного текста на Божьем имени как предмете хвалы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного Божьего имени транслитерацией сохраняет отличие полного тетраграмматона от сокращённой формы יָהּ в начале стиха.
- source_word: עַבְדֵי
  choice: слуги
  rationale: В литургическом обращении слово обозначает служителей Яхве; «слуги» здесь естественнее, чем социально окрашенное «рабы».
theological_decisions:
- issue: Передача форм Божьего имени יָהּ и יְהוָה в одном стихе
  choice: Сокращённая форма יָהּ сохранена внутри «Аллилуия», а полная форма יְהוָה передана как «Яхве»
  alternative: Передать обе формы как «Господь» либо развернуть начало как «Хвалите Яха»
  rationale: Так сохраняется различие двух еврейских форм, узнаваемость традиционного возгласа и личный характер полного Божьего имени без искусственного уравнивания форм.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмового призыва. Три короткие восклицательные строки воспроизводят повтор и энергичный параллелизм оригинала; отсутствующее в еврейском тексте дополнение после последнего «хвалите» не добавлено.
