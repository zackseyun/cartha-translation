  text: For Yahweh will vindicate his people[b][a], and he will have compassion on his servants.
translation:
  language: ru
  text: Ведь Яхве вступится за Свой народ[a] и сжалится над Своими слугами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет судить Свой народ». Еврейский глагол может означать «судить», но здесь, вероятно, речь идёт о суде в пользу народа — о его защите и оправдании.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изменит решение относительно Своих слуг». Еврейский глагол может также означать, что кто-либо отказывается от прежнего намерения или, движимый жалостью, смягчается.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для предшествующего утверждения; «ведь» естественно передаёт пояснительно-причинную связь в русском поэтическом контексте.
- source_word: יָדִין
  choice: вступится за
  rationale: Глагол דין буквально связан с судом, но здесь, как и в близкой параллели Втор 32:36, вероятнее всего означает судебное действие в пользу народа — защиту и оправдание. Вариант «вступится за» ясно выражает этот смысл, а буквальная возможность отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: Естественное русское обозначение народа, принадлежащего Яхве; возвратное притяжательное местоимение соответствует субъекту предложения.
- source_word: וְעַל
  choice: над
  rationale: Предлог עַל при נחם указывает на тех, к кому обращены жалость и милость; по-русски это естественно выражается сочетанием «сжалится над».
- source_word: עֲבָדָיו
  choice: Своими слугами
  rationale: В контексте отношений с Яхве עבד уместно передать как «слуга», не выдвигая на первый план значение рабского статуса.
- source_word: יִתְנֶחָם
  choice: сжалится
  rationale: Нифаль глагола נחם может обозначать как сожаление или изменение намерения, так и движение сострадания. В контексте милости к Божьим слугам «сжалится» передаёт основной смысл, тогда как «откажется от кары» сохраняется как возможный оттенок в сноске.
theological_decisions:
- issue: Антропопатический смысл יִתְנֶחָם применительно к Богу
  choice: сжалится
  alternative: откажется от кары по отношению к Своим слугам; переменит решение о Своих слугах
  rationale: «Сжалится» естественно передаёт милостивое обращение Бога к Своим слугам и не создаёт впечатления покаяния в нравственном проступке. При этом сноска сохраняет присущий еврейскому глаголу оттенок отказа от намеченного действия.
- issue: Суд Яхве над Его народом
  choice: вступится за Свой народ
  alternative: будет судить Свой народ
  rationale: Контекст и параллель со Втор 32:36 допускают благоприятное судебное решение и защиту народа. Буквально более широкое «будет судить» оставлено в сноске, чтобы не устранять лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным псалмическим звучанием. Заглавные буквы в «Свой/Своими» используются как уважительное оформление местоимений, относящихся к Богу. Синтаксический параллелизм двух полустиший сохранён.
