lexical_decisions:
- source_word: שֶׁהִכָּה
  choice: Который поразил
  rationale: Относительная частица שֶׁ связывает строку с предшествующим описанием Господа; глагол נכה в военном контексте передан современным и ёмким словом «поразил».
- source_word: גּוֹיִם רַבִּים
  choice: многие народы
  rationale: 'Прямое и естественное соответствие: גּוֹיִם здесь означает народы, а רַבִּים указывает на их многочисленность.'
- source_word: וְהָרַג
  choice: и убил
  rationale: Глагол הרג прямо означает лишение жизни; «убил» сохраняет силу высказывания и не архаизирует текст.
- source_word: מְלָכִים עֲצוּמִים
  choice: могучих царей
  rationale: עֲצוּמִים обозначает силу и могущество; «могучих» соответствует возвышенному поэтическому регистру псалма.
theological_decisions:
- issue: Синтаксическая связь с предыдущим стихом
  choice: Сохранить зависимое относительное предложение, начав стих словом «Который».
  alternative: 'Передать самостоятельным предложением: «Он поразил многие народы и убил могучих царей».'
  rationale: Префикс שֶׁ недвусмысленно вводит относительное предложение, продолжающее характеристику Господа из предыдущего стиха; сохранение этой связи отражает еврейский синтаксис и последовательное славословие псалма.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены параллелизм двух глагольных частей и зависимость от предыдущего стиха; архаизмы вроде «поразил мечом» или «умертвил» не вводятся.
