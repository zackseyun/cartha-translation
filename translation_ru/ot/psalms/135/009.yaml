  text: שָׁלַ֤ח אֹת֣וֹת וּ֭/מֹפְתִים בְּ/תוֹכֵ֣/כִי מִצְרָ֑יִם בְּ֝/פַרְעֹ֗ה וּ/בְ/כָל עֲבָדָֽי/ו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/009.yaml
  text: He sent signs and wonders into your midst[a], O Egypt[b], against Pharaoh and against all his servants.
translation:
  language: ru
  text: Он послал знамения и чудеса среди тебя, Египет[a], против фараона и всех его слуг[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно также: «внутри тебя, Египет». В еврейском тексте Египет олицетворён, и к нему обращаются во 2-м лице женского рода единственного числа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на фараона и на всех его слуг». Еврейский предлог допускает более буквальную передачу «на», но здесь выражает направленное против них действие знамений и чудес.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: послал
  rationale: Форма qal, перфект, 3-е лицо мужского рода единственного числа; подразумеваемый субъект — Бог. «Послал» прямо и естественно передаёт действие.
- source_word: אֹתוֹת וּמֹפְתִים
  choice: знамения и чудеса
  rationale: 'Сохраняется традиционная и смыслово точная парная формула: знаки Божьего действия и вызывающие изумление деяния.'
- source_word: בְּתוֹכֵכִי מִצְרָיִם
  choice: среди тебя, Египет
  rationale: Суффикс 2-го лица женского рода единственного числа показывает прямое обращение к олицетворённому Египту. «Среди тебя» сохраняет это обращение и естественно звучит по-русски.
- source_word: בְּפַרְעֹה
  choice: против фараона
  rationale: Предлог בְּ здесь обозначает объект, на который направлено губительное действие знамений; «против» ясно передаёт враждебную направленность, не превращая образ в буквальное пространственное указание.
- source_word: וּבְכָל עֲבָדָיו
  choice: и всех его слуг
  rationale: עֲבָדִים может обозначать слуг, рабов или царских служителей. «Слуги» сохраняет широкий смысл и подходит к окружению фараона без неоправданного сужения до чиновников.
