  text: כִּ֤י אֲנִ֣י יָ֭דַעְתִּי כִּי גָד֣וֹל יְהוָ֑ה וַ֝/אֲדֹנֵ֗י/נוּ מִ/כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/005.yaml
  text: For I know that Yahweh is great[b][a], and our Lord is above all gods.
translation:
  language: ru
  text: Ибо я знаю, что Яхве велик, и наш Владыка — превыше всех богов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно также передать: «больше всех богов». Буквально: «от всех богов»; предлог здесь выражает сравнение и превосходство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Первое כִּי вводит основание для хвалы в контексте псалма; «ибо» естественно передаёт объяснительную связь и сохраняет возвышенный регистр.
- source_word: יָדַעְתִּי
  choice: я знаю
  rationale: Перфект обозначает достигнутое, устойчивое знание говорящего; русское настоящее время естественно передаёт это состояние.
- source_word: כִּי
  choice: что
  rationale: Второе כִּי вводит содержание знания и потому прямо передаётся союзом «что».
- source_word: גָדוֹל
  choice: велик
  rationale: Предикативное прилагательное утверждает величие Яхве без явного сравнительного показателя; «велик» сохраняет абсолютную формулировку.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между יְהוָה и следующим титулом אֲדֹנֵינוּ.
- source_word: אֲדֹנֵינוּ
  choice: наш Владыка
  rationale: Существительное с суффиксом первого лица множественного числа означает «наш господин/владыка». «Владыка» звучит достойно и ясно отличает титул от личного имени Яхве.
- source_word: מִכָּל
  choice: превыше всех
  rationale: Предлог מִן выражает сравнение и превосходство. «Превыше всех» естественно передаёт смысл «выше/больше всех» в поэтическом русском регистре.
- source_word: אֱלֹהִים
  choice: богов
  rationale: Форма множественного числа в сравнительной фразе прямо обозначает богов или божеств; буквальная передача сохраняет полемическую и богословскую напряжённость текста.
theological_decisions:
- issue: Передача имени יְהוָה и отличие от אֲדֹנֵינוּ
  choice: «Яхве» и «наш Владыка»
  alternative: «Господь» и «наш Господь»
  rationale: Исходный текст употребляет сначала личное имя, затем иной еврейский термин — титул. Различная передача сохраняет это значимое лексическое различие.
- issue: Смысл אֱלֹהִים в заключительной фразе
  choice: «всех богов»
  alternative: «всех божественных существ»
  rationale: «Богов» является наиболее прямым соответствием и не решает за читателя, каков онтологический статус упомянутых богов.
- issue: Отношение двух утверждений о величии
  choice: «Яхве велик, и наш Владыка — превыше всех богов»
  alternative: «Яхве больше всех богов»
  rationale: Синтаксис сначала утверждает величие Яхве абсолютно, а затем выражает превосходство Владыки над всеми богами. Перевод сохраняет обе части, не сливая их в одно сравнительное утверждение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмодическим звучанием. «Ибо», «велик» и «превыше» понятны современному читателю и сохраняют достоинство поэтической речи; синтаксис остаётся ясным и близким к еврейскому оригиналу.
