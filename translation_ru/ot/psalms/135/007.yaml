  variant: modern literary Russian
source:
  edition: WLC
  text: מַֽעֲלֶ֣ה נְשִׂאִים֮ מִ/קְצֵ֪ה הָ֫/אָ֥רֶץ בְּרָקִ֣ים לַ/מָּטָ֣ר עָשָׂ֑ה מֽוֹצֵא ר֝וּחַ מֵ/אֽוֹצְרוֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/007.yaml
  text: He makes clouds rise from the ends of the earth[a]; he makes lightning for the rain[c][b]; he brings out the wind from his storehouses.
translation:
  language: ru
  text: Он поднимает облака[a] от краёв земли[b], творит молнии для дождя и выводит ветер из Своих хранилищ[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «испарения» или «туман». В контексте дождя, молний и ветра лучше подходит «облака».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от края земли»; выражение может собирательно обозначать её дальние пределы.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «из Своих сокровищниц». Образ представляет ветры как хранимые Богом и выпускаемые по Его воле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלֶה
  choice: поднимает
  rationale: Причастие породы hифиль от עלה выражает причинное действие; «поднимает» естественно передаёт образ восходящих облаков.
- source_word: נְשִׂאִים
  choice: облака
  rationale: Слово может обозначать испарения или туман, однако сочетание с дождём, молниями и ветром указывает здесь на грозовые облака.
- source_word: מִקְצֵה הָאָרֶץ
  choice: от краёв земли
  rationale: Формально слово «край» стоит в единственном числе, но выражение обозначает дальние пределы земли; множественное число естественно передаёт собирательный смысл.
- source_word: בְּרָקִים
  choice: молнии
  rationale: Русское множественное число соответствует еврейской форме и естественно звучит в описании грозы.
- source_word: לַמָּטָר
  choice: для дождя
  rationale: Предлог ל передаёт отношение или назначение; буквальное «для дождя» сохраняет краткость и неоднозначность поэтического выражения.
- source_word: עָשָׂה
  choice: творит
  rationale: Хотя глагол имеет форму перфекта, в гимническом контексте он описывает постоянное действие Бога; настоящее время согласуется с окружающими причастиями.
- source_word: מוֹצֵא
  choice: выводит
  rationale: Причастие породы hифиль от יצא имеет причинный смысл и изображает выпуск ветра из места хранения.
- source_word: רוּחַ
  choice: ветер
  rationale: Последовательность «облака — дождь — молнии — хранилища» однозначно поддерживает метеорологическое значение.
- source_word: מֵאֹצְרוֹתָיו
  choice: из Своих хранилищ
  rationale: «Хранилища» ясно и конкретно передаёт образ запасённых и выпускаемых Богом ветров; возвратное притяжательное местоимение естественно для русского языка.
theological_decisions:
- issue: Поэтическое настоящее или прошедшее время в описании Божьего действия
  choice: 'Настоящее время: «поднимает», «творит», «выводит».'
  alternative: 'Прошедшее время: «сотворил», «вывел», с более строгим следованием форме עָשָׂה.'
  rationale: Стих в составе гимна говорит о характерном и продолжающемся владычестве Господа над творением; настоящее время сохраняет обобщённый смысл и параллелизм форм.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной псалмовой интонацией. «Творит» сохраняет поэтическое достоинство; синтаксис остаётся кратким и параллельным еврейскому стиху.
