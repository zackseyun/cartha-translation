lexical_decisions:
- source_word: כְּמוֹ/הֶם
  choice: подобны им
  rationale: Сравнительный оборот прямо указывает на уподобление изготовителей и надеющихся идолам, описанным выше.
- source_word: יִהְיוּ
  choice: станут
  rationale: Глагол היה допускает значения «быть» и «становиться»; в данном контексте «станут» естественно передаёт возможный результативный оттенок, а альтернативу сохраняет сноска.
- source_word: עֹשֵׂי/הֶם
  choice: те, кто их делает
  rationale: Причастная форма обозначает изготовителей идолов; развёрнутая конструкция ясна современному русскому читателю.
- source_word: כֹּל אֲשֶׁר
  choice: всякий, кто
  rationale: Передаёт всеобщий охват исходной конструкции и сохраняет торжественный, но современный регистр.
- source_word: בֹּטֵחַ בָּ/הֶם
  choice: на них надеется
  rationale: Русское «надеяться на» естественно передаёт בטח с предлогом ב в смысле возлагать доверие или упование на идолов.
theological_decisions:
- issue: Смысл уподобления идолам
  choice: Стих утверждает, что изготовители идолов и надеющиеся на них станут подобны им, не уточняя характера этого подобия.
  alternative: Они становятся духовно бесчувственными либо бессильными и безжизненными, как идолы.
  rationale: Еврейский текст утверждает подобие, но не раскрывает его механизм или точный аспект; перевод не добавляет отсутствующего толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Инверсия «Подобны им станут» сохраняет акцент исходного текста на подобии; тире ясно присоединяет вторую, охватывающую группу.
