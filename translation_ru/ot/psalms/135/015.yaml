  text: Идолы народов — серебро и золото, дело рук человеческих.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצַבֵּי
  choice: идолы
  rationale: В полемическом контексте существительное обозначает предметы ложного поклонения; «идолы» точнее нейтрального «изваяния».
- source_word: הַגּוֹיִם
  choice: народов
  rationale: Форма обозначает народы вне Израиля; родительный оборот естественно передаёт принадлежность.
- source_word: כֶּסֶף וְזָהָב
  choice: серебро и золото
  rationale: Прямое обозначение материалов, из которых изготовлены идолы.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: дело рук человеческих
  rationale: Сохраняет образ и структуру еврейского выражения, подчёркивая человеческое происхождение идолов, и звучит естественно в русском библейском регистре.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: человеческих
  alternative: рук человека
  rationale: Здесь אָדָם обозначает человека вообще, а не конкретного мужчину; «рук человеческих» сохраняет общий антропологический смысл и противопоставление живому Богу.
