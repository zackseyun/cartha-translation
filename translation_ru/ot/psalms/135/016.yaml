    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה
  choice: уста
  rationale: 'Еврейское существительное стоит в единственном числе, но при местоимении множественного числа и глаголе во множественном числе имеет распределительное значение: у каждого из идолов есть уста. «Уста» сохраняет собирательно-распределительный оттенок и уместно в возвышенной поэтической речи.'
- source_word: לָהֶם
  choice: есть у них
  rationale: Буквально «им», однако сочетание с существительным выражает обладание. Русская конструкция «есть у них» естественна и одновременно сохраняет заметный параллелизм оригинала.
- source_word: יְדַבֵּרוּ
  choice: не говорят
  rationale: Глагол означает «говорить». Простое отрицание сохранено без усиления до «не могут говорить», поскольку невозможность подразумевается контекстом, но не выражена модально.
- source_word: עֵינַיִם
  choice: глаза
  rationale: Прямой современный русский эквивалент формы множественного числа.
- source_word: יִרְאוּ
  choice: не видят
  rationale: Глагол означает «видеть». Перевод сохраняет простое отрицание, не добавляя явно не выраженного «не могут».
theological_decisions:
- issue: Антропоморфное изображение идолов
  choice: Сохранить конкретное противопоставление наличия органов и отсутствия их действия без пояснительного добавления о бессилии идолов.
  alternative: «Есть у них уста, но они не могут говорить; есть глаза, но не могут видеть».
  rationale: Стих высмеивает идолов посредством образа недействующих органов. Простое отрицание точнее передаёт форму еврейского текста и оставляет его богословский вывод читателю.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим словом «уста». Повтор «есть у них» воспроизводит параллельное построение еврейской строки; формулировка остаётся ясной для современного читателя.
