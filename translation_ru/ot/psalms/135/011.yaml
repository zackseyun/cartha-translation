lexical_decisions:
- source_word: לְסִיחוֹן
  choice: Сигону
  rationale: Предлог לְ передан дательным падежом, естественным для русского языка; форма продолжает перечень объектов действия из предыдущего стиха. Имя передано в принятой русской библейской форме.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: царю аморреев
  rationale: Сопряжённая конструкция с этнонимом обозначает царя народа аморреев; множественное число естественно и ясно передаёт собирательное значение.
- source_word: וּלְעוֹג
  choice: и Огу
  rationale: Союз וּ передан как «и», а предлог לְ — дательным падежом, что сохраняет параллелизм перечня.
- source_word: מֶלֶךְ הַבָּשָׁן
  choice: царю Васана
  rationale: Сопряжённая конструкция буквально обозначает царя Васана; использована традиционная русская форма географического названия.
- source_word: וּלְכֹל
  choice: и всем
  rationale: Предлог לְ выражен дательным падежом, а כֹל передано словом «всем», сохраняя охват всей последующей группы.
- source_word: מַמְלְכוֹת
  choice: царствам
  rationale: Слово обозначает царства или владения; «царствам» точно соответствует историко-политическому контексту и согласуется с дательным управлением.
- source_word: כְּנָעַן
  choice: Ханаана
  rationale: Использована общепринятая в современном русском библейском языке форма топонима.
