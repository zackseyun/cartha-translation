  text: בֵּ֣ית יִ֭שְׂרָאֵל בָּרֲכ֣וּ אֶת יְהוָ֑ה בֵּ֥ית אַ֝הֲרֹ֗ן בָּרֲכ֥וּ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/135/019.yaml
  text: House of Israel[a], bless Yahweh; house of Aaron, bless Yahweh.
translation:
  language: ru
  text: Дом Израиля, благословляйте Яхве[a]! Дом Аарона, благословляйте Яхве!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH (יהוה); традиционно переводится «Господь», также передаётся как «Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּית יִשְׂרָאֵל
  choice: Дом Израиля
  rationale: Буквально передаёт конструкцию «дом Израиля», сохраняя собирательное обозначение народа завета и поэтический параллелизм с «домом Аарона».
- source_word: בָּרֲכוּ
  choice: благословляйте
  rationale: Форма повелительного наклонения множественного числа от ברך. «Благословляйте» точнее сохраняет лексику оригинала и более широкий смысл, чем динамическое «прославляйте».
- source_word: אֶת יְהוָה
  choice: Яхве
  rationale: Частица прямого дополнения с личным именем Бога, обозначенным тетраграмматоном יהוה. Транслитерация «Яхве» сохраняет употреблённое в еврейском тексте имя; примечание сообщает традиционную русскую передачу.
- source_word: בֵּית אַהֲרֹן
  choice: Дом Аарона
  rationale: Буквальная конструкция сохраняет параллель с «Домом Израиля» и обозначает священнический род Аарона, не добавляя отсутствующего в тексте уточнения «потомки».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале стоит личное имя יהוה, поэтому в основном тексте оно передано транслитерацией «Яхве». Традиционный вариант «Господь» указан в примечании без устранения различия между именем и титулом.
translation_notes:
  register: Современный литературный русский с достоинством богослужебного призыва. Повтор и синтаксический параллелизм еврейского стиха сохранены; повелительное множественное число передано формой «благословляйте».
