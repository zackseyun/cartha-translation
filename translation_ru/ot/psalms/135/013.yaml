lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога; повтор сохранён в соответствии с еврейским поэтическим параллелизмом.
- source_word: שִׁמְךָ
  choice: имя Твоё
  rationale: Прямой эквивалент сохраняет как буквальное значение имени, так и возможный оттенок известности и репутации.
- source_word: לְעוֹלָם
  choice: пребудет вовеки
  rationale: В еврейском тексте сказуемое отсутствует; глагол «пребудет» естественно выражает подразумеваемую непрерывность во времени.
- source_word: זִכְרְךָ
  choice: память о Тебе
  rationale: Передаёт основное значение существительного זֵכֶר и естественно звучит по-русски; возможные контекстуальные оттенки памятного имени и славы отмечены в сноске.
- source_word: לְדֹר וָדֹר
  choice: из рода в род
  rationale: Устойчивая русская формула точно передаёт последовательность поколений и сохраняет поэтическую краткость.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст дважды непосредственно употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Смысл זִכְרְךָ
  choice: память о Тебе
  alternative: Твоё памятное имя; Твоя слава
  rationale: Выбранное выражение не сводит многозначное слово только к репутации и сохраняет связь с тем, как Бога помнят и призывают из поколения в поколение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Инверсия «имя Твоё» и форма «вовеки» поддерживают возвышенный регистр, оставаясь понятными; прописные местоимения употреблены как принятая русская форма почтительного обращения к Богу.
