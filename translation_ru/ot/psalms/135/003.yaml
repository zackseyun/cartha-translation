  yaml_path: translation/ot/psalms/135/003.yaml
  text: Praise Yah[a], for Yahweh is good; sing praises to his name[b], for it is pleasant.
translation:
  language: ru
  text: Хвалите Ях[a], ибо благ Яхве; воспевайте имя Его, ибо оно прекрасно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Ях» — краткая форма божественного имени, отличная от следующего имени «Яхве» (יהוה).
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «ибо Он прекрасен (приятен)», если последнее слово относится к Яхве, а не к Его имени.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Хвалите
  rationale: Форма повелительного наклонения множественного числа от הלל выражает литургический призыв; «хвалите» естественно и точно передаёт его в современном русском языке.
- source_word: יָהּ
  choice: Яха
  rationale: Краткая форма божественного имени передана транслитерацией и поставлена в винительный падеж после переходного глагола; она сохраняет отличие от следующего יְהוָה.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание для призыва к хвале; «ибо» уместно в возвышенной поэтической речи и остаётся понятным современному читателю.
- source_word: טוֹב
  choice: благ
  rationale: Краткое прилагательное передаёт широкое значение Божьей доброты и благости и естественно звучит в русском библейско-поэтическом регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное божественное имя передано распространённой русской транслитерацией, а не заменено титулом; это также сохраняет различие между יָהּ и יְהוָה.
- source_word: זַמְּרוּ
  choice: воспевайте
  rationale: Глагол זמר обозначает музыкальную хвалу; «воспевайте» передаёт одновременно пение и прославление.
- source_word: לִשְׁמוֹ
  choice: имя Его
  rationale: При глаголе «воспевать» прямое дополнение естественнее буквальной конструкции «имени Его» и сохраняет направленность хвалы на Божье имя.
- source_word: נָעִים
  choice: приятно
  rationale: Прилагательное означает «приятный, отрадный, прекрасный». Средний род «приятно» соотносит его с подразумеваемым действием воспевания, не устраняя альтернативной синтаксической возможности, отмеченной в сноске.
theological_decisions:
- issue: Передача рядом стоящих יָהּ и יְהוָה
  choice: 'Различить как «Ях» (в тексте: «Яха») и «Яхве»'
  alternative: Передать обе формы как «Господь» либо обе унифицировать
  rationale: Еврейский текст намеренно использует краткую и полную формы божественного имени; различная передача сохраняет это лексическое отличие без замены имени титулом.
- issue: К чему относится כִּי נָעִים
  choice: 'В основном тексте понимать как характеристику воспевания: «ибо это приятно»'
  alternative: «Ибо Он прекрасен/приятен», относя נָעִים к Яхве; возможно также смысловое соотнесение с Божьим именем
  rationale: Эллиптическая еврейская конструкция допускает несколько связей. Основной вариант хорошо продолжает призыв «воспевайте», а сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Формы «ибо», «благ» и «воспевайте» сохраняют достоинство псалмового призыва, не прибегая к архаическим грамматическим конструкциям. Местоимение «Его» написано с прописной буквы как традиционная русская издательская норма для обозначения Бога.
