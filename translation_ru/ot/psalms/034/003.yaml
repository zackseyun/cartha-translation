  text: גַּדְּל֣וּ לַ/יהוָ֣ה אִתִּ֑/י וּ/נְרוֹמְמָ֖ה שְׁמ֣/וֹ יַחְדָּֽו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/003.yaml
  text: Magnify Yahweh with me[a], and let us exalt his name together.
translation:
  language: ru
  text: Возвеличьте Яхве вместе со мной[a], и превознесём вместе его имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Яхве» (יהוה, YHWH); в русских переводах традиционно передаётся как «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּדְּלוּ
  choice: Возвеличьте
  rationale: Повелительная форма множественного числа передаёт призыв провозгласить величие Бога и прославить его, не подразумевая буквального увеличения.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Тетраграмматон יהוה передан как личное имя «Яхве», что прямо отражает еврейский текст.
- source_word: אִתִּי
  choice: вместе со мной
  rationale: Передаёт совместное участие говорящего и призываемых в хвале.
- source_word: וּנְרוֹמְמָה
  choice: и превознесём
  rationale: Когортатив первого лица множественного числа выражает совместное побуждение; русская форма совершенного вида естественно передаёт призыв.
- source_word: שְׁמוֹ
  choice: его имя
  rationale: Сохранён буквальный и богословски значимый образ имени как выражения явленной личности и славы Бога.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Наречие обозначает совместное, объединённое действие.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохранено личное имя; сноска поясняет его традиционную передачу.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического призыва. Повтор «вместе» отражает два разных элемента еврейского текста — אִתִּי и יַחְדָּו — и подчёркивает общность хвалы.
