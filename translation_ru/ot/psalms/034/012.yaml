lexical_decisions:
- source_word: מִי הָאִישׁ
  choice: Кто тот человек
  rationale: Сохраняет вопросительное начало и конкретный образ еврейского текста; «человек» в данном мудростном вопросе имеет обобщающее значение.
- source_word: הֶחָפֵץ חַיִּים
  choice: который желает жить
  rationale: חפץ выражает желание и стремление, а идиоматичное русское «желает жить» естественно передаёт сочетание с חַיִּים, не превращая его в отвлечённое «наслаждается жизнью».
- source_word: אֹהֵב יָמִים
  choice: любит долгие дни
  rationale: Буквально сказано «любит дни», однако в параллелизме с желанием жить подразумеваются многочисленные или долгие дни; добавление «долгие» делает смысл понятным по-русски.
- source_word: לִרְאוֹת טוֹב
  choice: чтобы видеть добро
  rationale: Сохраняет образное употребление ראה и широкое, намеренно неуточнённое значение טוֹב.
theological_decisions:
- issue: Обобщающее мужское единственное число הָאִישׁ
  choice: тот человек
  alternative: тот, кто; кто из людей
  rationale: 'Форма оригинала сохранена без ограничения смысла только мужчинами: в контексте это обобщённый представитель любого человека.'
- issue: Смысл выражения לִרְאוֹת טוֹב
  choice: видеть добро
  alternative: испытывать добро; наслаждаться благополучием
  rationale: Буквальный образ оставлен открытым и не сужен до материального благополучия или субъективного удовольствия.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической и мудростной речи. Синтаксис вопросительный, ясный для обычного читателя; сохранены параллелизм и широкий образ «видеть добро».
