  yaml_path: translation/ot/psalms/034/012.yaml
  text: Who is the man who delights in life[b][a], loving days to see good?
translation:
  language: ru
  text: Кто тот человек, который желает жизни, любит дни, чтобы видеть добро?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы испытывать добро».'
