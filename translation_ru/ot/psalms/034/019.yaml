source:
  edition: WLC
  text: רַ֭בּוֹת רָע֣וֹת צַדִּ֑יק וּ֝/מִ/כֻּלָּ֗/ם יַצִּילֶ֥/נּוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/019.yaml
  text: Many are the afflictions of the righteous man[b][a], but Yahweh delivers him out of them all.
translation:
  language: ru
  text: Много бед[a] у праведника[b], но от всех них избавляет его Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несчастий», «тягот». Еврейское רָעוֹת может обозначать зло, беды или бедствия; здесь речь идёт о невзгодах, постигающих праведника.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово стоит в форме мужского рода единственного числа — «праведник»; здесь оно может обобщённо обозначать праведного человека.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת
  choice: Много
  rationale: Предикативное множественное прилагательное передано естественной русской конструкцией «много бед», сохраняющей начальный акцент на многочисленности.
- source_word: רָעוֹת
  choice: бед
  rationale: В данном контексте слово обозначает тяготы и несчастья, постигающие праведника, а не его нравственное зло. «Беды» точно и естественно передаёт широкий контекстуальный смысл.
- source_word: צַדִּיק
  choice: у праведника
  rationale: Субстантивированная форма мужского рода единственного числа сохранена; по смыслу она может представлять всякого праведного человека.
- source_word: וּמִכֻּלָּם
  choice: но от всех них
  rationale: 'Союз контекстуально выражает противопоставление, а сочетание с предлогом и местоимением сохраняет всеохватность: избавление приходит от каждой из названных бед.'
- source_word: יַצִּילֶנּוּ
  choice: избавляет его
  rationale: Hiphil от נצל означает «избавлять, спасать». Настоящее время по-русски естественно выражает обобщённое, регулярно действующее утверждение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
theological_decisions:
- issue: Репрезентативное мужское единственное число צַדִּיק
  choice: праведника
  alternative: праведного человека; праведных
  rationale: Форма мужского рода единственного числа сохранена без ограничения смысла только мужчинами; примечание указывает на её возможную обобщающую функцию.
- issue: Смысл רָעוֹת применительно к праведнику
  choice: беды
  alternative: зло; несчастья; тяготы
  rationale: Контекст говорит о бедствиях, от которых Яхве избавляет праведника. Выбор не приписывает праведнику нравственного зла, но и не ослабляет реальность его страданий.
- issue: Передача יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем псалма. Конструкция «много бед у…» естественна и сохраняет порядок смысловых акцентов оригинала; «избавляет» поддерживает возвышенный, но общепонятный библейский регистр.
