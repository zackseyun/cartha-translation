  - marker: b
    text: 'Или: «из страны», если здесь имеется в виду определённая земля, а не вся земля вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנֵי
  choice: Лицо
  rationale: Буквально «лицо». Сохранён конкретный древнееврейский образ личного присутствия и направленной враждебности; в русском контексте оборот понятен благодаря сказуемому «против».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: בְּעֹשֵׂי רָע
  choice: против тех, кто творит зло
  rationale: Предлог בְּ в данном контексте выражает враждебную направленность, а причастная конструкция буквально обозначает людей, делающих зло. Формулировка естественна для современного русского языка и не сводит их к отвлечённому ярлыку.
- source_word: לְהַכְרִית
  choice: чтобы истребить
  rationale: Инфинитив породы хифиль выражает цель или результат противодействия Яхве. «Истребить» передаёт решительное устранение и лучше сочетается по-русски с «памятью», чем буквальное «отсечь».
- source_word: מֵאֶרֶץ
  choice: с земли
  rationale: אֶרֶץ допускает значения «земля» и «страна». В обобщающем изречении псалма основным выбран более широкий смысл; локальная возможность отмечена в сноске.
- source_word: זִכְרָם
  choice: память о них
  rationale: Передаёт существительное «память, воспоминание» с местоименным суффиксом и звучит естественнее, чем двусмысленное русское «их память».
theological_decisions:
- issue: Образ «лица Яхве» как выражение Божьего противодействия
  choice: 'Сохранён конкретный антропоморфный образ: «Лицо Яхве — против…»'
  alternative: Абстрактное «Яхве против…» или «Присутствие Господа против…»
  rationale: Исходный текст говорит о направленном к людям лице Яхве и тем самым изображает Его активное личное противодействие. Сохранение образа не требует представления о телесности Бога и не сглаживает поэтическое и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической образности. Тире позволяет естественно передать безглагольную древнееврейскую конструкцию; «творит зло» сохраняет библейскую торжественность, оставаясь понятным современному читателю.
