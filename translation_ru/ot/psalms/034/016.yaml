  yaml_path: translation/ot/psalms/034/016.yaml
  text: The face of Yahweh is against those who do evil[b][a], to cut off the memory of them from the earth.
translation:
  language: ru
  text: Лицо Яхве[a] обращено против тех, кто творит зло, чтобы стереть с земли[b] память о них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Присутствие Яхве обращено против тех, кто творит зло».'
