  text: טַעֲמ֣וּ וּ֭/רְאוּ כִּי ט֣וֹב יְהוָ֑ה אַֽשְׁרֵ֥י הַ֝/גֶּ֗בֶר יֶחֱסֶה בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/008.yaml
  text: Taste and see that Yahweh is good[a]; blessed is the man who takes refuge in him.
translation:
  language: ru
  text: Вкусите и увидите, как благ Яхве! Блажен человек[a], который ищет у Него прибежища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужчина»; в еврейском тексте здесь употреблена форма мужского рода в представительном смысле — о всяком, кто ищет прибежища у Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טַעֲמוּ
  choice: Вкусите
  rationale: Повелительная форма множественного числа буквально означает «попробуйте на вкус». Конкретный чувственный образ сохранён, поскольку он образует выразительную пару с «увидите» и одновременно передаёт личный опыт.
- source_word: וּרְאוּ
  choice: и увидите
  rationale: Повелительная форма множественного числа от ראה. «Увидите» сохраняет чувственный параллелизм с «вкусите» и допускает переносный смысл опытного познания.
- source_word: כִּי טוֹב
  choice: как благ
  rationale: В данном русском обороте «как благ» естественно вводит то, что предлагается познать на опыте. «Благ» передаёт и нравственную доброту, и благотворность Яхве, сохраняя возвышенный поэтический регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул «Господь».
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Формула провозглашает достойное зависти благополучие человека перед Богом. «Блажен» сохраняет форму блаженства и поэтический библейский регистр.
- source_word: הַגֶּבֶר
  choice: человек
  rationale: Существительное мужского рода обозначает мужчину, но здесь употреблено представительно. Русское «человек» естественно сохраняет форму единственного числа и общий смысл; грамматическая особенность оригинала отмечена в сноске.
- source_word: יֶחֱסֶה
  choice: ищет прибежища
  rationale: Глагол חסה обозначает поиск защиты или укрытия. Этот перевод сохраняет образ убежища точнее, чем обобщённое «уповает».
- source_word: בּוֹ
  choice: у Него
  rationale: Местоимение относится к Яхве. Сочетание «искать прибежища у кого-либо» естественно для современного русского языка и сохраняет референцию оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя Бога и не подменяет его титулом.
- issue: Представительное мужское единственное число הַגֶּבֶר
  choice: человек с пояснительной сноской
  alternative: муж; мужчина; тот, кто
  rationale: Контекст распространяет изречение на всякого ищущего защиты у Яхве. «Человек» звучит естественно по-русски и не превращает представительную мужскую форму в ограничение только мужчинами; буквальная форма отмечена в сноске.
- issue: Смысл כִּי после чувственных повелений
  choice: как благ
  alternative: что благ; ибо благ
  rationale: Кִּי здесь наиболее естественно понимать как введение содержания опытного познания, а не как причинный союз. Перевод не устраняет образ познания доброты Яхве через опыт.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим регистром. Чувственная пара «вкусите и увидите» и образ прибежища сохранены; архаичное «муж» в основном тексте не использовано.
