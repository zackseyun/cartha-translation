lexical_decisions:
- source_word: קָרוֹב
  choice: близок
  rationale: Предикативное прилагательное передано естественным русским соответствием, сохраняющим как образ близости, так и оттенок личного присутствия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом.
- source_word: לְנִשְׁבְּרֵי לֵב
  choice: к тем, чьё сердце разбито
  rationale: Формулировка естественно передаёт буквальный образ «разбитых сердцем» и обозначает глубокое внутреннее страдание.
- source_word: דַּכְּאֵי רוּחַ
  choice: тех, чей дух сокрушён
  rationale: Сохраняет сильный образ внутренней подавленности или надломленности, не сводя его исключительно к покаянному смирению.
- source_word: יוֹשִׁיעַ
  choice: спасает
  rationale: Передаёт каузативное значение корня ישׁע и сохраняет связь с широкой библейской лексикой спасения и избавления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; его транслитерация сохраняет различие между именем и титулом.
- issue: Смысл דַּכְּאֵי רוּחַ
  choice: тех, чей дух сокрушён
  alternative: смирённых духом; подавленных духом
  rationale: Контекст допускает как внутреннюю сломленность, так и смирение, но не требует исключительно покаянного смысла; основной текст сохраняет более широкую образность, а альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; параллелизм еврейской поэзии сохранён через симметричные обороты «к тем, чьё…» и «тех, чей…». Формулировка ясна для широкого читателя и сохраняет метафоры сердца и духа.
