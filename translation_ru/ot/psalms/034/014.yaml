lexical_decisions:
- source_word: סוּר
  choice: уклоняйся
  rationale: Императив выражает сознательное отстранение и удаление от зла; «уклоняйся» естественно и ёмко передаёт это нравственное действие.
- source_word: מֵרָע
  choice: от зла
  rationale: В контексте наставления רַע обозначает прежде всего нравственное зло, а предлог מִן — удаление от него.
- source_word: וַעֲשֵׂה טוֹב
  choice: и делай добро
  rationale: 'Прямо сохраняет параллельный контраст двух повелений: удаляться от зла и деятельно совершать добро.'
- source_word: בַּקֵּשׁ
  choice: ищи
  rationale: Порода piel здесь выражает целенаправленный, усердный поиск; краткое «ищи» сохраняет силу повеления.
- source_word: שָׁלוֹם
  choice: мира
  rationale: «Мир» — основное и естественное соответствие, хотя еврейское слово включает также целостность, благополучие и добрые отношения; эта широта отмечена в сноске.
- source_word: וְרָדְפֵהוּ
  choice: и стремись к нему
  rationale: Глагол רדף буквально означает преследовать, гнаться; в данном нравственном призыве «стремись к нему» передаёт настойчивое активное усилие без неуместного отрицательного оттенка русского «преследуй».
