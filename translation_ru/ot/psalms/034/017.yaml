  text: צָעֲק֣וּ וַ/יהוָ֣ה שָׁמֵ֑עַ וּ/מִ/כָּל צָ֝רוֹתָ֗/ם הִצִּילָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/017.yaml
  text: They cried out[a], and Yahweh heard, and delivered them from all their troubles.
translation:
  language: ru
  text: Они воззвали, и Яхве[a] услышал их и избавил их от всех бед.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: YHWH; традиционно переводится как «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: צָעֲקוּ
  choice: Они воззвали
  rationale: Форма qal перфекта 3-го лица множественного числа от צעק обозначает настойчивый крик о помощи. «Воззвали» естественно для молитвенно-поэтического контекста и сохраняет возвышенный, но понятный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, представленное тетраграмматоном יהוה, без замены титулом.
- source_word: שָׁמֵעַ
  choice: услышал их
  rationale: Причастие в последовательности с перфектными формами имеет здесь естественное прошедшее значение. Местоимение «их» подразумевается смыслом глагола и делает русскую фразу ясной.
- source_word: מִכָּל צָרוֹתָם
  choice: от всех бед
  rationale: מן с כל выражает избавление от всей совокупности несчастий; «от всех бед» кратко, естественно и точно передаёт поэтический смысл.
- source_word: הִצִּילָם
  choice: избавил их
  rationale: Hifil от נצל означает избавить или вырвать из опасности. «Избавил» сохраняет широкий смысл и соответствует современному библейскому регистру.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон. «Яхве» передаёт личное имя, тогда как «Господь» заменяет его титулом, а «Иегова» отражает позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Союзная последовательность оригинала сохранена без тяжеловесности; подразумеваемое дополнение при «услышал» выражено по-русски явно.
