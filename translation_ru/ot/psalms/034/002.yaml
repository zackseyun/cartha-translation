  text: בַּ֭/יהוָה תִּתְהַלֵּ֣ל נַפְשִׁ֑/י יִשְׁמְע֖וּ עֲנָוִ֣ים וְ/יִשְׂמָֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/002.yaml
  text: In Yahweh my soul will boast[b][a]; the humble will hear and rejoice.
translation:
  language: ru
  text: Моя душа будет хвалиться Яхве; смиренные[a] услышат и возрадуются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кроткие»; возможно также: «угнетённые».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: Яхве
  rationale: 'Предлог ב указывает на основание или предмет хвалы: душа хвалится Яхве. В русском эта связь естественно передаётся беспредложной формой несклоняемого имени после глагола «хвалиться».'
- source_word: תִּתְהַלֵּל
  choice: будет хвалиться
  rationale: Форма хитпаэль глагола הלל здесь означает «хвалиться, прославляться чем-либо», а не просто «хвалить». Будущее время сохраняет модально-временную открытость имперфекта и согласуется с последующими глаголами.
- source_word: נַפְשִׁי
  choice: моя душа
  rationale: Сохранён поэтический образ еврейского נֶפֶשׁ как обозначения всего внутреннего «я», без сведения выражения к простому местоимению «я».
- source_word: יִשְׁמְעוּ
  choice: услышат
  rationale: Прямое соответствие форме qal imperfect; будущее время поддерживает последовательность поэтического высказывания.
- source_word: עֲנָוִים
  choice: смиренные
  rationale: Слово может обозначать смиренных, кротких или угнетённых. «Смиренные» естественно передаёт нравственно-духовный оттенок, не исключая значения униженного положения.
- source_word: וְיִשְׂמָחוּ
  choice: и возрадуются
  rationale: «Возрадуются» передаёт поэтическую приподнятость שמח и сохраняет связь между услышанным и последующей радостью.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблено личное имя יהוה. Транслитерация «Яхве» сохраняет его как заветное имя и не заменяет титулом.
- issue: Характер хвалы
  choice: душа хвалится Яхве
  alternative: душа хвалит Яхве
  rationale: Возвратная порода глагола указывает на хваление или славу, основанные на Яхве, а не просто на действие восхваления; поэтому сохранено напряжение выражения «хвалиться Яхве».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Порядок слов сделан естественным для русского языка, при этом сохранены «моя душа», личное имя Яхве и последовательность трёх форм будущего времени.
