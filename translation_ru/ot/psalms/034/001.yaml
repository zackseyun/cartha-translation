  yaml_path: translation/ot/psalms/034/001.yaml
  text: I will bless Yahweh at all times[a]; his praise will continually be in my mouth.
translation:
  language: ru
  text: Буду благословлять Яхве[a] во всякое время; хвала Ему всегда будет в моих устах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское имя: יהוה (ЙХВХ), обычно передаваемое как «Яхве».'
    reason: Пояснение передачи божественного имени.
lexical_decisions:
- source_word: אֲבָרֲכָה
  choice: Буду благословлять
  rationale: 'Префиксальная форма первого лица единственного числа с парагогическим ה в поэтическом контексте выражает решительное намерение: псалмопевец обязуется благословлять Бога.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּכָל עֵת
  choice: во всякое время
  rationale: Точно передаёт всеохватность еврейского оборота и сохраняет возвышенное, но понятное современному читателю звучание.
- source_word: תָּמִיד
  choice: всегда
  rationale: Естественно передаёт постоянство хвалы и не создаёт тяжеловесного повтора с выражением «во всякое время».
- source_word: תְּהִלָּתוֹ
  choice: хвала Ему
  rationale: Суффикс третьего лица допускает буквальное «Его хвала», однако по смыслу речь идёт о хвале, обращённой к Нему; выбранный оборот естественнее по-русски и сохраняет эту направленность.
- source_word: בְּפִי
  choice: в моих устах
  rationale: Сохраняет телесный образ произносимой хвалы; «уста» соответствует достоинству поэтического регистра и остаётся общеупотребительным библейским выражением.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Форма «Яхве» непосредственно передаёт тетраграмматон и не подменяет имя титулом.
- issue: Направленность выражения תְּהִלָּתוֹ
  choice: хвала Ему
  alternative: Его хвала
  rationale: Еврейская конструкция допускает формальное «Его хвала», но в данном контексте естественно обозначает хвалу Богу. Перевод не вводит дополнительного богословского толкования, а ясно выражает синтаксически возможное объектное значение суффикса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух строк сохранён; формулировка понятна обычному современному читателю без снижения достоинства псалма.
