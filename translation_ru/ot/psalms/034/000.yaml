    rationale: В конструкции «и тот прогнал его, и он ушёл» последний субъект по нормальному русскому чтению может быть понят как «тот», то есть Авимелех, тогда как контекст и синтаксис еврейского надписания подразумевают уход Давида.
  - severity: low
    issue: Пунктуационно расчленённое надписание
    rationale: «Давида. Когда…» менее естественно, чем единая традиционная и современно понятная формула «Давида, когда…».
  - severity: low
    issue: Форма имени в примечании
    rationale: Примечание отсылает к имени, стоящему в еврейском тексте 1 Царств 21; «Ахиш» точнее отражает это имя, чем «Анхус».
  revised_text: Давида, когда он изменил своё поведение перед Авимелехом[a], и тот прогнал его, а Давид ушёл.
