  text: לְ/דָוִ֗ד בְּ/שַׁנּוֹת֣/וֹ אֶת טַ֭עְמ/וֹ לִ/פְנֵ֣י אֲבִימֶ֑לֶךְ וַֽ֝/יְגָרֲשֵׁ֗/הוּ וַ/יֵּלַֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/000.yaml
  text: Of David[a], when he changed his behavior before Abimelech, and he drove him away, and he went away.
translation:
  language: ru
  text: Давида, когда он изменил своё поведение перед Авимелехом[a], и тот прогнал его, а Давид ушёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В 1 Царств 21:10–15 этот царь назван Ахишем; «Авимелех» здесь может быть другим именем или царским титулом.
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая именная формула сохраняет свойственную надписаниям псалмов широту значения לְ: авторство, принадлежность или связь с Давидом; уточнение «написанный Давидом» было бы уже исходного текста.'
- source_word: בְּשַׁנּוֹתוֹ
  choice: когда он изменил
  rationale: Инфинитивная конструкция с בְּ имеет здесь временное значение; такая передача естественна по-русски.
- source_word: טַעְמוֹ
  choice: своё поведение
  rationale: Хотя существительное может обозначать вкус, рассудительность или здравый смысл, в данном контексте речь идёт о намеренно изменённой внешней манере поведения; перевод не вводит клинического понятия «безумие».
- source_word: לִפְנֵי אֲבִימֶלֶךְ
  choice: перед Авимелехом
  rationale: Прямая и естественная передача пространственно-реляционной фразы «перед, в присутствии».
- source_word: וַיְגָרֲשֵׁהוּ
  choice: и тот прогнал его
  rationale: Глагол означает «прогнать, изгнать». Указательное местоимение «тот» естественно обозначает Авимелеха как действующее лицо, не добавляя причинно-целевой связи, отсутствующей в еврейском тексте.
- source_word: וַיֵּלַךְ
  choice: и он ушёл
  rationale: Передаёт простое значение глагола «идти, уйти» и последовательность событий; субъектом по контексту вновь является Давид.
- source_word: אֲבִימֶלֶךְ
  choice: Авимелех
  rationale: В основном тексте сохранено имя, прямо засвидетельствованное еврейским оригиналом; соотношение с Анхусом вынесено в примечание.
theological_decisions:
- issue: Историческое отождествление Авимелеха
  choice: Сохранить в основном тексте имя «Авимелех» согласно еврейскому оригиналу.
  alternative: Понять «Авимелех» как другое имя или царский титул Анхуса из Гефа и заменить им имя в тексте.
  rationale: Подмена имени гармонизировала бы надписание с повествованием 1 Царств 21, но устранила бы реальное различие между текстами. Возможное отождествление сообщается в примечании.
translation_notes:
  register: Современный литературный русский язык с лаконичной формой надписания. Синтаксический параллелизм исходной последовательности сохранён, при этом местоимение «тот» делает смену действующего лица понятной без добавления отсутствующей в оригинале причинной связи.
