  source_fidelity: 'Передача надписания в целом точно отражает еврейский текст: широкое «Давида», временное «когда», контекстуальное значение טַעְמוֹ как поведения и сохранение имени «Авимелех». Смена субъектов в конце передана по контексту верно: Авимелех прогоняет Давида, Давид уходит.'
  naturalness: Фраза «Давида. Когда…» с точкой звучит как неудачно расчленённое надписание. Кроме того, после «тот прогнал его» местоимение «он» в русском языке может быть ошибочно отнесено к Авимелеху. Единая формула надписания и повтор имени Давида устраняют это без смыслового добавления.
  terminology: «Авимелех» корректно передаёт имя еврейского текста. В примечании имя царя из 1 Царств 21 следует передать как «Ахиш», ближе к еврейскому אָכִישׁ, а не как традиционное, но менее исходно-языковое «Анхус».
