lexical_decisions:
- source_word: זֶה
  choice: Вот
  rationale: В сочетании זֶה עָנִי указательное слово вводит живое свидетельство о конкретном человеке; «вот» естественно передаёт эту предъявительную и выразительную функцию.
- source_word: עָנִי
  choice: бедняк
  rationale: Слово может обозначать бедного, угнетённого или смиренного человека. «Бедняк» сохраняет мужской род и конкретность исходного текста, а более широкий смысл отмечен в сноске.
- source_word: קָרָא
  choice: воззвал
  rationale: Глагол означает «позвал, воззвал». В контексте бедствия «воззвал» передаёт настойчивое обращение к Богу и соответствует возвышенному, но понятному регистру псалма.
- source_word: יהוה
  choice: Яхве
  rationale: Передано собственное covenantное имя Бога, непосредственно стоящее в еврейском тексте, без замены титулом «Господь».
- source_word: שָׁמֵעַ
  choice: услышал
  rationale: Форма описывает завершённое действие в свидетельстве псалмопевца; «услышал» естественно сочетается с последующим спасением.
- source_word: מִכָּל צָרוֹתָיו
  choice: от всех бед его
  rationale: Передаёт избавление от всей совокупности несчастий; порядок слов сохраняет поэтический ритм и выделяет источник избавления.
- source_word: הוֹשִׁיעוֹ
  choice: его спас
  rationale: Hiphil от ישׁע обозначает спасение или избавление от опасности. «Спас» сохраняет важную библейскую лексику спасения и уместно в контексте конкретных бед.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя יהוה. Транслитерация «Яхве» позволяет отличить его от титула אֲדֹנָי и не скрывает имя за традиционной заменой.
- issue: Значение עָנִי
  choice: бедняк с пояснением в сноске
  alternative: страдалец; угнетённый; смиренный
  rationale: Контекст допускает как материальную бедность, так и состояние угнетения или унижения. Основной текст сохраняет конкретный мужской образ, а сноска не позволяет сузить многозначность слова до одной идеи.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим библейским звучанием. Инверсия «от всех бед его спас» сохраняет выразительность и параллелизм, оставаясь понятной современному читателю.
