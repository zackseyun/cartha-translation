  yaml_path: translation/ot/psalms/034/013.yaml
  text: Guard your tongue from evil[a], and your lips from speaking deceit.
translation:
  language: ru
  text: Береги свой язык от зла и не давай своим устам говорить ложь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Храни свой язык от зла и не давай своим устам произносить ложь».'
    reason: 'Лексико-синтаксическая альтернатива: נצר можно передать как «храни», а מִדַּבֵּר מִרְמָה — как «произносить ложь».'
lexical_decisions:
- source_word: נְצֹר
  choice: Береги
  rationale: Повелительная форма глагола נצר означает хранить, оберегать, следить за чем-либо. «Береги» естественно звучит по-русски и передаёт призыв удерживать речь от зла.
- source_word: לְשׁוֹנְךָ
  choice: язык свой
  rationale: Сохранён буквальный поэтический образ языка как органа речи; в русском он понятен и естественен.
- source_word: מֵרָע
  choice: от зла
  rationale: 'רַע здесь имеет нравственный смысл: зло, дурное. Формулировка «от зла» сохраняет ёмкость и силу еврейского выражения.'
- source_word: וּשְׂפָתֶיךָ
  choice: и уста свои
  rationale: Сохранён параллельный телесный образ. «Уста» придают строке достоинство и поэтичность, оставаясь понятными современному читателю.
- source_word: מִדַּבֵּר
  choice: от … слов
  rationale: Буквально конструкция означает «от говорения». Русское «от лживых слов» естественно передаёт действие речи без тяжеловесного «от произнесения».
- source_word: מִרְמָה
  choice: лживых
  rationale: מִרְמָה обозначает обман, коварство или ложь. В сочетании «лживые слова» ясно выражена обманчивая речь, соответствующая контексту.
