  yaml_path: translation/ot/psalms/034/007.yaml
  text: The angel of Yahweh encamps around those who fear him[a], and rescues them.
translation:
  language: ru
  text: Ангел Яхве[a] разбивает лагерь вокруг боящихся Его и избавляет их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посланник Яхве». Еврейское מַלְאָךְ может означать как «посланник», так и «ангел»; здесь значение «ангел» вероятнее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹנֶה
  choice: стоит станом
  rationale: Причастие Qal от חנה обозначает расположение лагерем; выражение сохраняет образ защитного военного стана и естественно звучит в возвышенном русском контексте.
- source_word: מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  rationale: מַלְאָךְ допускает значения «посланник» и «ангел», но в данном сочетании наиболее естествен сверхъестественный смысл; личное имя יהוה передано как «Яхве».
- source_word: סָבִיב
  choice: вокруг
  rationale: Передаёт пространственный образ окружения и защиты без добавочного истолкования.
- source_word: לִירֵאָיו
  choice: боящихся Его
  rationale: Сохраняет обычный библейский оборот о благоговейном страхе перед Богом и не ослабляет его до одного лишь почтения.
- source_word: וַיְחַלְּצֵם
  choice: и избавляет их
  rationale: В данном контексте חלץ означает вызволять или спасать от опасности; «избавляет» сохраняет смысл и достойный современный регистр.
theological_decisions:
- issue: Следует ли понимать מַלְאַךְ יְהוָה как ангела, просто посланника или прямо отождествлять с богоявлением.
  choice: Передать как «Ангел Яхве», не уточняя его дальнейшую идентичность.
  alternative: «Посланник Яхве»; явная интерпретация как богоявления или христофании.
  rationale: Контекст благоприятствует значению «ангел», однако сам стих не определяет природу или личность этого существа, поэтому богословская напряжённость сохраняется.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Оборот «стоит станом» сохраняет конкретный образ лагеря, а заглавное «Его» соответствует русской религиозной издательской норме.
