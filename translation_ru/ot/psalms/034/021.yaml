translation:
  language: ru
  text: Зло погубит нечестивого[a], и ненавидящие праведника окажутся виновными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Беда погубит нечестивого». Еврейское слово רָעָה может означать зло, вред, беду или бедствие.'
