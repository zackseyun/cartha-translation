lexical_decisions:
- source_word: תְּמוֹתֵת
  choice: погубит
  rationale: Порода hифиль глагола מות выражает причинение смерти. «Погубит» естественно по-русски передаёт гибель как результат действия и сохраняет поэтическую краткость.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Субстантивированное прилагательное в единственном числе обозначает типичного человека, поступающего нечестиво; форма согласована с прямым дополнением.
- source_word: רָעָה
  choice: нечестие
  rationale: Еврейское слово может означать нравственное зло, беду или несчастье. «Нечестие» в основном тексте сохраняет нравственную связь с «нечестивым» и мысль о том, что собственное зло губит злодея; возможное значение «беда» отмечено в сноске.
- source_word: שֹׂנְאֵי
  choice: ненавидящие
  rationale: Причастие множественного числа передаёт устойчивую характеристику тех, кто ненавидит.
- source_word: צַדִּיק
  choice: праведника
  rationale: Субстантивированное прилагательное в единственном числе представляет праведного человека без ненужного уточнения пола в формулировке.
- source_word: יֶאְשָׁמוּ
  choice: понесут вину
  rationale: Глагол אשם может обозначать оказаться виновным, навлечь на себя вину или понести ответственность. «Понесут вину» сохраняет как состояние виновности, так и подразумеваемые последствия, не усиливая смысл до явно выраженного судебного осуждения.
theological_decisions:
- issue: Означает ли רָעָה нравственное зло или постигшую нечестивого беду
  choice: нечестие
  alternative: беда / несчастье
  rationale: 'Контекст допускает оба оттенка. Основной вариант передаёт нравственную иронию: нечестивого губит нечестие. Сноска сохраняет реальную лексическую возможность, что его погубит беда, не разрешая неоднозначность догматически.'
- issue: Следует ли передавать יֶאְשָׁמוּ как судебное осуждение
  choice: понесут вину
  alternative: будут признаны виновными / будут осуждены
  rationale: Еврейский глагол выражает виновность и ответственность, но сам по себе не требует развёрнутой картины судебного приговора. Выбранный вариант сохраняет эту напряжённость.
