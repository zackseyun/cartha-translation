  text: דָּרַ֣שְׁתִּי אֶת יְהוָ֣ה וְ/עָנָ֑/נִי וּ/מִ/כָּל מְ֝גוּרוֹתַ֗/י הִצִּילָֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/004.yaml
  text: I sought Yahweh[a], and he answered me; he delivered me from all my fears.
translation:
  language: ru
  text: Я искал Яхве, и Он ответил мне; от всех моих страхов[a] Он избавил меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от всего, чего я страшился»; или: «от всех моих ужасов».'
    reason: Лексема מְגוּרוֹתַי может обозначать как переживаемые страхи, так и то, что внушает страх или ужас.
lexical_decisions:
- source_word: דָּרַשְׁתִּי
  choice: Я искал
  rationale: Глагол דרשׁ здесь означает обращение к Яхве в молитве и уповании, а не простой запрос сведений. «Искал» кратко и естественно передаёт свидетельство псалмопевца.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом; форма «Яхве» общепринята в современной русской библеистике.
- source_word: וְעָנָנִי
  choice: и Он ответил мне
  rationale: Глагол ענה с суффиксом первого лица единственного числа прямо означает «ответил мне»; местоимение «Он» естественно указывает на Яхве.
- source_word: מִכָּל
  choice: от всех
  rationale: Сочетание מן с כל выражает полноту избавления применительно ко всему названному далее.
- source_word: מְגוּרוֹתַי
  choice: моих страхов
  rationale: В данном контексте слово обозначает то, что внушает страх или ужас. «Страхов» звучит естественно по-русски, а возможные оттенки сохранены в сноске.
- source_word: הִצִּילָנִי
  choice: Он избавил меня
  rationale: Каузативная форма נצל означает избавление или спасение от опасности. «Избавил» сохраняет широкий смысл и хорошо сочетается с оборотом «от страхов».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит собственное имя יְהוָה. Транслитерация «Яхве» сохраняет личное имя, не подменяя его титулом и не выбирая менее вероятную традиционную вокализацию «Иегова».
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным звучанием псалма. Повтор местоимения «Он» подчёркивает параллельные действия Яхве и делает синтаксис ясным. Маркер сноски поставлен после всего стиха, поскольку поясняет выражение в заключительной строке.
