lexical_decisions:
- source_word: שֹׁמֵר
  choice: хранит
  rationale: Причастие от שׁמר выражает охрану и сбережение; «хранит» естественно и ёмко передаёт защитное сохранение в данном контексте.
- source_word: כָּל
  choice: все
  rationale: Передаёт полноту совокупности костей.
- source_word: עַצְמוֹתָיו
  choice: его кости
  rationale: Существительное означает «кости», а суффикс 3-го лица мужского рода единственного числа — «его».
- source_word: אַחַת
  choice: ни одна
  rationale: Форма женского рода согласуется с подразумеваемым словом «кость»; вместе с отрицанием естественно переводится «ни одна».
- source_word: מֵהֵנָּה
  choice: из них
  rationale: 'Предлог מן с местоименным суффиксом имеет партитивное значение: одна из всей совокупности.'
- source_word: לֹא נִשְׁבָּרָה
  choice: не сломлена
  rationale: Нифаль перфекта от שׁבר означает «быть сломанным». Краткая результативная форма «не сломлена» сохраняет поэтическую сжатость и не навязывает строго прошедшего либо будущего времени.
theological_decisions:
- issue: К кому относятся местоименные суффиксы единственного числа
  choice: «его», с отнесением к праведнику в непосредственном контексте псалма
  alternative: 'Выразить обобщённо: «кости праведника», либо явно придать строке христологическое прочтение на основании Ин 19:36'
  rationale: В еврейском тексте употреблены суффиксы единственного числа, а ближайший контекст говорит о праведнике, которого избавляет Господь. Основной текст сохраняет прямой смысл псалма, тогда как новозаветное применение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным поэтическим строем. Порядок сносок приведён в последовательность [a], [b]; каждый маркер присутствует в основном тексте.
