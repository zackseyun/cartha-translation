  text: פּוֹדֶ֣ה יְ֭הוָה נֶ֣פֶשׁ עֲבָדָ֑י/ו וְ/לֹ֥א יֶ֝אְשְׁמ֗וּ כָּֽל הַ/חֹסִ֥ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/022.yaml
  text: Yahweh redeems the life of his servants[b][a], and none of those who take refuge in him will be held guilty.
translation:
  language: ru
  text: Яхве искупает жизнь[a] Своих слуг, и никто из тех, кто ищет у Него убежища, не будет признан виновным[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душу». Еврейское не́феш может обозначать жизнь, живую личность или самого человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не понесёт вины», «не окажется виновным»; возможно также: «не будет осуждён». Еврейский глагол относится к вине и ответственности.'
    reason: alternative_reading
lexical_decisions:
- source_word: פּוֹדֶה
  choice: искупает
  rationale: Причастная форма פדה выражает постоянное, характерное действие Яхве. «Искупает» сохраняет как смысл избавления, так и оттенок выкупа, не сводя слово к более общему «спасает».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: Здесь נֶפֶשׁ обозначает жизнь или живую личность в её целостности. «Жизнь» не навязывает узкого представления о нематериальной части человека.
- source_word: עֲבָדָיו
  choice: Своих слуг
  rationale: В контексте псалма עבד естественно обозначает тех, кто служит Яхве. «Слуг» передаёт отношение принадлежности и служения без неуместного акцента на социальном рабстве.
- source_word: יֶאְשְׁמוּ
  choice: не будет признан виновным
  rationale: Глагол אשם связан с виной и ответственностью. Такая передача сохраняет судебный оттенок, но не уточняет сверх текста, идёт ли речь именно об окончательном осуждении.
- source_word: הַחֹסִים בּוֹ
  choice: тех, кто ищет у Него убежища
  rationale: Глагол חסה рисует образ человека, который укрывается у кого-либо. Эта формулировка сохраняет образ убежища точнее, чем обобщённое «надеется на Него».
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте избавления
  choice: Передано как «жизнь».
  alternative: «Душу» или «самих Своих слуг».
  rationale: Слово может обозначать душу, жизнь или живого человека целиком. В данном контексте «жизнь» ясно передаёт спасение человека и не вводит не требуемое текстом разделение тела и души.
- issue: Судебная сила יֶאְשְׁמוּ
  choice: «Не будет признан виновным».
  alternative: «Не понесёт вины», «не окажется виновным» или более сильное «не будет осуждён».
  rationale: Еврейский глагол допускает значения виновности, навлечения на себя вины и осуждения. Выбранная формулировка сохраняет судебный смысл и одновременно не превращает стих в более узкое утверждение об окончательном суде.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным псалмическим звучанием. Заглавные местоимения при обращении к Богу использованы в соответствии с распространённой русской библейской традицией; синтаксис остаётся простым и естественным.
