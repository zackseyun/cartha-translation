  text: עֵינֵ֣י יְ֭הוָה אֶל צַדִּיקִ֑ים וְ֝/אָזְנָ֗י/ו אֶל שַׁוְעָתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/015.yaml
  text: The eyes of Yahweh are toward the righteous[a], and his ears toward their cry for help.
translation:
  language: ru
  text: Глаза Яхве обращены к праведным, и уши его — к их воплю о помощи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к их мольбе о помощи». Еврейское слово обозначает вопль, вызванный бедствием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי
  choice: Глаза
  rationale: Сохранён конкретный образ множественного числа в сопряжённой форме; он передаёт внимательный взгляд Бога, но не заменён пояснительным пересказом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан принятой русской транслитерацией личного имени, а не заменён титулом.
- source_word: אֶל
  choice: обращены к / к
  rationale: Предлог выражает направленность. В первом полустишии для естественности добавлено «обращены», а во втором оно подразумевается благодаря поэтическому параллелизму.
- source_word: צַדִּיקִים
  choice: праведным
  rationale: Субстантивированное прилагательное во множественном числе естественно передаётся устойчивым русским обозначением людей, живущих праведно.
- source_word: וְאָזְנָיו
  choice: и уши его
  rationale: Сохранены множественное число и антропоморфный образ, параллельный слову «глаза».
- source_word: שַׁוְעָתָם
  choice: их воплю о помощи
  rationale: Существительное обозначает вопль из бедствия, обращённый за помощью; перевод раскрывает этот компонент значения, не превращая образ в общий глагол «молиться».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Антропоморфные образы Божьего восприятия
  choice: Сохранить «глаза» и «уши»
  alternative: 'Передать толковательно: «Яхве смотрит за… и слышит…»'
  rationale: Конкретные телесные образы составляют поэтический параллелизм и выражают Божье внимание; их не следует устранять пересказом.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого поэтического параллелизма. Слово «глаза» выбрано вместо архаичного «очи»; местоимение о Боге написано со строчной буквы по общим современным нормам.
