lexical_decisions:
- source_word: יְר֣אוּ
  choice: Бойтесь
  rationale: Императив 2-го лица множественного числа от ירא. «Бойтесь» прямо передаёт как благоговейный страх, так и серьёзность призыва; более узкое «почитайте» ослабило бы этот смысл.
- source_word: אֶת יְהוָה
  choice: Яхве
  rationale: Прямое дополнение с личным именем Бога, тетраграмматоном יהוה. Транслитерация «Яхве» сохраняет имя, присутствующее в еврейском тексте.
- source_word: קְדֹשָׁיו
  choice: Его святые
  rationale: Субстантивированное прилагательное во множественном числе с суффиксом 3-го лица мужского рода единственного числа. «Его святые» естественно по-русски и сохраняет идею принадлежности и посвящённости Богу.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание призыва. «Ведь» естественно выражает пояснительно-причинную связь в современном русском языке.
- source_word: אֵין מַחְסוֹר
  choice: ни в чём не испытывают недостатка
  rationale: Еврейское сочетание означает отсутствие нужды или недостачи. Выбранная формулировка ясна современному читателю и не добавляет к тексту уточнения о характере нужды.
- source_word: לִירֵאָיו
  choice: боящиеся Его
  rationale: Предлог ל с причастием множественного числа и местоименным суффиксом. Повтор корня «бояться» сохраняет намеренную лексическую связь с начальным призывом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не заменяет имя титулом.
- issue: Смысл глагола ירא применительно к Богу
  choice: бояться
  alternative: благоговеть; почитать
  rationale: «Бояться» сохраняет широту исходного слова и связь между повелением יְרָאוּ и причастием יְרֵאָיו. Благоговейный оттенок следует из обращения к Богу, но не подменяет значение слова.
- issue: Абсолютный характер обещания об отсутствии недостатка
  choice: ни в чём не испытывают недостатка
  alternative: не имеют нужды
  rationale: Текст сформулирован без явного ограничения; перевод сохраняет эту богословскую напряжённость и не добавляет пояснений вроде «во всём необходимом».
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмическим звучанием. Сохранены повтор корня ירא и неограниченная формулировка обещания; синтаксис адаптирован к естественной русской речи.
