  text: לְֽכוּ בָ֭נִים שִׁמְעוּ לִ֑/י יִֽרְאַ֥ת יְ֝הוָ֗ה אֲלַמֶּדְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/034/011.yaml
  text: Come[a], children, listen to me[b]; I will teach you the fear of Yahweh.
translation:
  language: ru
  text: Придите, дети[a], послушайте меня; я научу вас страху перед Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья». В литературе мудрости это, вероятно, обращение к ученикам вообще.'
    reason: lexical_alternative
  - marker: b
    text: «Страх перед Яхве» — выражение из литературы мудрости, включающее благоговейный трепет, послушание и должный страх перед Богом.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Придите
  rationale: Хотя глагол הלך буквально означает «идти», в прямом обращении здесь он служит приглашением приблизиться и внимать наставлению; «придите» естественно передаёт эту функцию.
- source_word: בָנִים
  choice: дети
  rationale: Буквально «сыновья», но в языке мудрости это обращение к ученикам; «дети» сохраняет педагогический тон и не сужает круг адресатов только до мужчин.
- source_word: שִׁמְעוּ לִי
  choice: послушайте меня
  rationale: Сочетание выражает призыв не просто услышать звук, а внимательно выслушать и принять наставление.
- source_word: יִרְאַת יְהוָה
  choice: страху перед Яхве
  rationale: Сохранено слово «страх», поскольку еврейское выражение охватывает благоговение, послушание и должный трепет перед Богом; замена только на «почтение» сузила бы смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», что прямо отражает тетраграмматон и не заменяет его титулом.
- source_word: אֲלַמֶּדְכֶם
  choice: я научу вас
  rationale: Форма пиэль имперфекта в данном контексте естественно выражает намерение говорящего дать наставление.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Передача выражения יִרְאַת יְהוָה
  choice: страх перед Яхве
  alternative: благоговение перед Яхве
  rationale: 'Формулировка сохраняет присущую еврейскому понятию смысловую напряжённость: благоговейный трепет, послушание и реальный страх перед Богом.'
translation_notes:
  register: Современный литературный русский язык с ясным, достойным и наставительным звучанием. Синтаксис сохраняет последовательность еврейского обращения, призыва и обещания научить.
