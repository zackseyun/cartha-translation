  text: Они взглянули на Него[a] — и просияли[b]; лица их не покроются стыдом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейской традиции чтения здесь засвидетельствованы варианты «на Него» и «на меня». В основном тексте по контексту принято «на Него».
    reason: textual_variant
  - marker: b
    text: 'Или: «сияли». Еврейский глагол здесь передаёт образ света и сияния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבִּיטוּ
  choice: взирали
  rationale: Глагол в породе хифиль означает направлять взгляд, смотреть на кого-либо. «Взирали» сохраняет поэтическое достоинство и целенаправленность взгляда, оставаясь понятным в современном русском.
- source_word: אֵלָיו
  choice: на Него
  rationale: 'Чтение с местоимением третьего лица соответствует контексту: люди обращают взгляд к Господу. Вариант «на меня», отражённый в письменной традиции, сохранён в сноске.'
- source_word: וְנָהָרוּ
  choice: и сияли
  rationale: В данном сочетании корень передаёт сияние, светлый облик; краткое «сияли» естественно сохраняет поэтический образ и допускает оттенок «озарялись».
- source_word: וּפְנֵיהֶם
  choice: и лица их
  rationale: Конкретный образ лиц сохранён без сведения его к абстрактному «они»; порядок слов поддерживает возвышенный поэтический регистр.
- source_word: אַל יֶחְפָּרוּ
  choice: не постыдились
  rationale: Сочетание выражает отрицание постыдного исхода, а не запрет. «Не постыдились» формально передаёт образ стыда и согласуется с предшествующими формами, не добавляя явно будущего времени.
theological_decisions:
- issue: 'Разночтение אֵלָי/ו: перспектива говорящего'
  choice: на Него
  alternative: на меня
  rationale: Традиционное чтение третьего лица лучше связано с ближайшим контекстом обращения к Господу, однако форма первого лица засвидетельствована письменной традицией и меняет перспективу речи, поэтому указана в сноске.
- issue: Временная и модальная сила אַל יֶחְפָּרוּ
  choice: не постыдились
  alternative: да не постыдятся / не будут постыжены
  rationale: Главный текст сохраняет параллелизм с предшествующими формами и не превращает строку однозначно в обещание о будущем или пожелание; альтернативная модальная трактовка остаётся возможной по еврейской форме.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической интонацией. Конкретная образность оригинала сохранена; архаичный оттенок слова «взирали» оправдан поэтическим жанром и остаётся общеупотребительным.
