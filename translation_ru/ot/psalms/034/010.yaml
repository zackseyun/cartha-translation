lexical_decisions:
- source_word: כְּפִירִים
  choice: молодые львы
  rationale: Существительное обозначает молодых, уже сильных львов; образ подчёркивает, что даже могучие хищники могут терпеть недостаток.
- source_word: רָשׁוּ
  choice: терпят нужду
  rationale: Глагол выражает обнищание или состояние нужды. Этот вариант сохраняет отличие от следующего упоминания голода и соответствует поэтическому регистру.
- source_word: וְרָעֵבוּ
  choice: и голод
  rationale: Глагол означает «быть голодным». В сочетании «терпят нужду и голод» русский текст звучит естественно и сжато.
- source_word: וְדֹרְשֵׁי יְהוָה
  choice: а ищущие Яхве
  rationale: Причастная конструкция характеризует людей, постоянно обращающихся к Яхве и стремящихся к Нему; союз передаёт смысловое противопоставление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: לֹא יַחְסְרוּ
  choice: не лишатся
  rationale: Имперфект в контексте выражает общее заверение; будущее время естественно передаёт это обещательное звучание, не исключая характера общей истины.
- source_word: כָל טוֹב
  choice: никакого блага
  rationale: Сочетание с отрицанием означает отсутствие недостатка в каком-либо добре. «Благо» сохраняет обобщённый и возвышенный характер выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Объём заверения «не лишатся никакого блага»
  choice: Сохранена всеобщая формулировка без поясняющего ограничения
  alternative: не лишатся ничего действительно полезного им
  rationale: Текст не уточняет природу или сроки получения блага. Добавление толкования разрешило бы богословское напряжение, которого сам стих не снимает.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтической, достойной псалмовой интонацией. Сохранены параллелизм, контраст и лаконичность оригинала.
