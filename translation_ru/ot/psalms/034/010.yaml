  text: Young lions suffer want and hunger[a], but those who seek Yahweh lack no good thing.
translation:
  language: ru
  text: Молодые львы терпят нужду и голод[a], а ищущие Яхве не испытывают недостатка ни в каком благе.
  philosophy: optimal-equivalence
  footnotes:
