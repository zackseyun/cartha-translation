id: PSA.23.1
reference: Psalms 23:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/001.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will not lack.
translation:
  language: ru
  text: Псалом Давида[a]. Яхве[b] — мой Пастырь; я ни в чём не буду нуждаться.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «псалом, написанный Давидом», «псалом для Давида». Еврейское לְדָוִד может указывать на авторство, посвящение, принадлежность или связь с Давидом.'
    reason: alternative_reading
  - marker: b
    text: Еврейское יהוה (ЙХВХ) — личное имя Бога; в русских переводах его традиционно часто передают словом «Господь».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «я не испытаю недостатка»; возможен также обобщённый смысл: «я ни в чём не нуждаюсь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Стандартное и ясное русское обозначение жанра надписания; указывает на песнопение, исполняемое под музыкальное сопровождение.
- source_word: לְדָוִד
  choice: Давида
  rationale: Традиционная краткая русская формула сохраняет связь псалма с Давидом, не исключая значений авторства, посвящения или принадлежности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: רֹעִי
  choice: мой Пастырь
  rationale: Прямо сохраняет образ того, кто пасёт стадо и заботится о нём. Прописная буква уместна как почтительное обозначение Бога в метафорическом наименовании.
- source_word: לֹא אֶחְסָר
  choice: я ни в чём не буду нуждаться
  rationale: Естественно передаёт значение глагола חסר — испытывать недостаток, нуждаться — и сохраняет возможную будущую направленность формы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет это отличие от титула, а вариант «Иегова» отражает более позднюю смешанную форму.
- issue: Значение надписания לְדָוִד
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида
  rationale: Конструкция с לְ допускает авторство, посвящение, принадлежность или связь. Краткая традиционная формула не разрешает эту неоднозначность насильно.
- issue: Временной и модальный оттенок אֶחְסָר
  choice: не буду нуждаться
  alternative: не нуждаюсь; не испытаю недостатка
  rationale: Префиксальная форма допускает будущий или модальный оттенок. Выбранный вариант естественен по-русски, однако настоящее обобщённое понимание также возможно.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического и богослужебного текста. Синтаксис краткий и ритмичный; традиционный образ пастыря сохранён, а неоднозначность надписания и глагольной формы отмечена в сносках.
