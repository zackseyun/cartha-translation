  text: מִזְמ֥וֹר לְ/דָוִ֑ד יְהוָ֥ה רֹ֝עִ֗/י לֹ֣א אֶחְסָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/000.yaml
  text: A psalm of David[a]. Yahweh is my shepherd[c][b]; I will lack nothing.
translation:
  language: ru
  text: 'Псалом Давида[a].


    Яхве[b] — мой пастырь; я ни в чём не буду нуждаться[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «псалом, написанный Давидом», «псалом для Давида» либо «псалом, связанный с Давидом»; еврейское надписание לְדָוִד может указывать на авторство, посвящение или связь с Давидом.'
    reason: alternative_reading
  - marker: b
    text: В еврейском тексте стоит יהוה (ЙХВХ), личное имя Бога; традиционно его нередко передают словом «Господь».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «у меня не будет недостатка»; смысл в том, что необходимого не будет недоставать, а не в отсутствии желаний.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: псалом
  rationale: Устоявшееся и понятное русское обозначение поэтической песни, исполняемой под музыкальное сопровождение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: רֹעִי
  choice: мой пастырь
  rationale: Сохраняет прямую пастушескую метафору и притяжательный суффикс первого лица.
- source_word: לֹא אֶחְסָר
  choice: я ни в чём не буду нуждаться
  rationale: Естественно по-русски выражает отсутствие недостатка, не сводя смысл к отсутствию желаний.
theological_decisions:
- issue: Связь надписания לְדָוִד с Давидом
  choice: Псалом Давида
  alternative: Псалом, посвящённый Давиду / псалом для Давида
  rationale: Традиционная краткая формулировка естественна по-русски, а реальная смысловая широта еврейского предлога לְ отмечена в сноске без однозначного решения вопроса об авторстве.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя в исходном тексте передано как имя; традиционная замена титулом указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконичностью библейской поэзии. Тире подчёркивает именную конструкцию «Яхве — мой пастырь», а точка с запятой сохраняет тесную смысловую связь двух утверждений.
