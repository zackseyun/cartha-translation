  text: Surely goodness and steadfast love will pursue me all the days of my life[c][b][a], and I will dwell in the house of Yahweh for length of days.
translation:
  language: ru
  text: Несомненно, благо и неизменная любовь будут преследовать меня[a] во все дни моей жизни, и я буду пребывать[b] в доме Яхве на долгие дни.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут следовать за мной». Еврейский глагол буквально и ярче означает «преследовать», представляя благо и любовь Бога как силы, активно устремлённые за псалмопевцем.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и я вернусь в дом Яхве». Масоретская огласовка поддерживает перевод «я буду пребывать», но «я вернусь» — давний вариант прочтения.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «вечно». Буквально еврейская фраза говорит о «долготе дней» и обозначает длительное, продолжающееся время.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: 'В заключительной строке частица выражает уверенное ограничение: псалмопевца будут преследовать не враги, а только благо и любовь. Русское «только» естественно сохраняет это значение; оттенок уверенности передаётся всем утверждением.'
- source_word: טוֹב
  choice: благо
  rationale: Субстантивированное прилагательное рядом с חֶסֶד обозначает благотворное добро, исходящее от Бога. «Благо» сохраняет поэтическую отвлечённость и звучит естественно в современном литературном русском.
- source_word: חֶסֶד
  choice: верная любовь
  rationale: Сочетание передаёт устойчивую, деятельную и преданную любовь. «Милость» уже по значению, а «заветная верность» сильнее истолковывает контекст.
- source_word: יִרְדְּפוּנִי
  choice: будут преследовать меня
  rationale: 'Глагол רדף обычно означает активное преследование. Такой перевод сохраняет яркий поэтический переворот: псалмопевца настигают благо и любовь, а не враги.'
- source_word: כָּל יְמֵי חַיָּי
  choice: во все дни моей жизни
  rationale: Формально близкая и понятная русская передача, сохраняющая полноту временного охвата.
- source_word: וְשַׁבְתִּי
  choice: я буду жить
  rationale: Масоретская огласовка указывает на ישׁב, «жить, пребывать». «Буду жить» в современном русском естественнее, чем несколько книжное «буду обитать»; вариант «вернусь» отмечен в сноске.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняется конкретный образ Божьего дома и личное имя יהוה, переданное транслитерацией «Яхве».
- source_word: לְאֹרֶךְ יָמִים
  choice: долгие дни
  rationale: Передача сохраняет образ буквального «долготия дней» и не превращает неоднозначную, открытую по длительности формулу в однозначное «вечно».
theological_decisions:
- issue: Продолжительность, выраженная לְאֹרֶךְ יָמִים
  choice: долгие дни
  alternative: вечно; на долгие годы
  rationale: Еврейская формула обозначает длительное, продолжающееся время и допускает понимание «вечно», однако сама по себе не устраняет смысловую открытость. Основной текст сохраняет образ дней, а более сильное толкование вынесено в сноску.
- issue: Значение וְשַׁבְתִּי
  choice: я буду жить
  alternative: я вернусь
  rationale: Масоретская огласовка естественно связывает форму с ישׁב, «жить, пребывать». Давний вариант «вернусь» существенно меняет образ и потому сохранён в сноске, а не отвергнут молча.
translation_notes:
  register: 'Современный литературный русский с достоинством поэтической речи. Сохранены олицетворение блага и любви, интенсивный глагол «преследовать», личное имя Яхве и открытость заключительной формулы длительности. Маркеры сносок помещены после всей строки, но соответствуют выражениям в порядке их следования: [a] — «преследовать», [b] — «буду жить», [c] — «долгие дни».'
