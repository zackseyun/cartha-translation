source:
  edition: WLC
  text: נַפְשִׁ֥/י יְשׁוֹבֵ֑ב יַֽנְחֵ֥/נִי בְ/מַעְגְּלֵי צֶ֝֗דֶק לְמַ֣עַן שְׁמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/003.yaml
  text: He restores my soul[c][b][a]; he leads me in paths of righteousness for the sake of his name.
translation:
  language: ru
  text: Он возвращает мне силы[a], ведёт меня тропами праведности[b] ради Своего имени[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «восстанавливает (или возвращает) мою душу». Еврейское слово נֶפֶשׁ может означать жизнь или всего человека, а глагол допускает также переводы «оживляет меня» и «возвращает меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «правильными тропами» или «тропами справедливости».'
    reason: lexical_alternative
  - marker: c
    text: То есть ради чести и славы Своего имени — в соответствии со Своим характером.
    reason: cultural_note
lexical_decisions:
- source_word: נַפְשִׁי יְשׁוֹבֵב
  choice: возвращает мне силы
  rationale: В данном пастушеском образе сочетание נֶפֶשׁ и формы от שוב естественно передаёт восстановление жизни и сил всего человека. Русское выражение избегает сведения נֶפֶשׁ лишь к нематериальной душе, сохраняя при этом варианты «восстанавливает мою душу» и «возвращает меня» в примечании.
- source_word: יַנְחֵנִי
  choice: ведёт меня
  rationale: Форма породы hифиль от נחה означает «вести, направлять» и непосредственно продолжает образ пастуха.
- source_word: בְמַעְגְּלֵי
  choice: тропами
  rationale: מַעְגָּל обозначает колею, тропу или путь; «тропами» естественно для пастушеской поэзии и сохраняет конкретность образа.
- source_word: צֶדֶק
  choice: праведности
  rationale: צֶדֶק охватывает праведность, справедливость и правильность. «Праведности» сохраняет нравственно-богословскую ёмкость выражения, не исключая смысла правильных путей.
- source_word: לְמַעַן שְׁמוֹ
  choice: ради Своего имени
  rationale: לְמַעַן указывает на основание или цель действия, а שֵׁם буквально значит «имя» и также подразумевает характер, честь и славу носителя имени.
theological_decisions:
- issue: Значение выражения נַפְשִׁי יְשׁוֹבֵב
  choice: Целостное восстановление жизни и сил псалмопевца передано как «возвращает мне силы».
  alternative: «восстанавливает мою душу»; «оживляет меня»; «возвращает меня»
  rationale: Нֶפֶשׁ может обозначать жизнь или всего человека, а שוב допускает значения возвращения, восстановления и оживления. Основной перевод естественен по-русски, а примечание сохраняет подлинную многозначность.
- issue: Смысл выражения בְמַעְגְּלֵי־צֶדֶק
  choice: «тропами праведности» — путями, соответствующими праведности и правильному Божьему водительству.
  alternative: «правильными тропами»; «тропами справедливости»
  rationale: Конструкция допускает как нравственный смысл, так и представление о верных, надлежащих путях. Традиционно ёмкое «праведности» сохраняет эту богословскую напряжённость.
- issue: Смысл выражения «ради Своего имени»
  choice: Бог ведёт так в соответствии с честью, характером и славой Своего имени.
  alternative: «ради Своей славы»; «ради Своей репутации»
  rationale: Буквальное «имя» сохраняет важный библейский образ, тогда как примечание раскрывает подразумеваемый культурно-богословский смысл.
translation_notes:
  register: Современный литературный русский язык с поэтической сдержанностью. «Тропами» поддерживает пастушеский образ; прописная буква в местоимении «Своего» соответствует принятому благоговейному библейскому регистру, не добавляя деноминационной специфики.
