source:
  edition: WLC
  text: גַּ֤ם כִּֽי אֵלֵ֨ךְ בְּ/גֵ֪יא צַלְמָ֡וֶת לֹא אִ֘ירָ֤א רָ֗ע כִּי אַתָּ֥ה עִמָּדִ֑/י שִׁבְטְ/ךָ֥ וּ֝/מִשְׁעַנְתֶּ֗/ךָ הֵ֣מָּה יְנַֽחֲמֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/023/004.yaml
  text: Even though I walk through the valley of deep darkness[a], I will fear no evil, for you are with me; your rod and your staff—they comfort me.
translation:
  language: ru
  text: Даже если я пойду долиной глубокой тьмы[a], не устрашусь зла, потому что ты со мной; твой жезл и твой посох — они утешают меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долиной смертной тени». Еврейское слово может обозначать глубокую тьму, возможно с оттенком смерти.'
    reason: Лексическая альтернатива сохраняет традиционное прочтение и присущую слову смысловую многозначность.
lexical_decisions:
- source_word: גַּם כִּי
  choice: Даже если
  rationale: Сочетание вводит уступительное, потенциально-гипотетическое высказывание; такой перевод естественно сочетается с формой «пойду» и не устраняет оттенок «даже когда».
- source_word: אֵלֵךְ
  choice: я пойду
  rationale: Имперфект передаёт возможное или предстоящее движение; совершенный вид в русском языке естественен после «даже если».
- source_word: בְּגֵיא
  choice: долиной
  rationale: Творительный падеж естественно обозначает путь движения через долину и сохраняет лаконичность еврейской поэзии.
- source_word: צַלְמָוֶת
  choice: глубокой тьмы
  rationale: Слово обозначает густую, непроглядную тьму и может нести оттенок смертельной опасности; традиционный вариант сохранён в сноске.
- source_word: לֹא אִירָא רָע
  choice: не устрашусь зла
  rationale: «Зло» сохраняет широту רָע, охватывающего зло, беду, вред и опасность; «не устрашусь» передаёт решительное отсутствие страха в возвышенной, но понятной форме.
- source_word: כִּי אַתָּה עִמָּדִי
  choice: потому что ты со мной
  rationale: Ясно выражена причина бесстрашия без добавочного толкования.
- source_word: שִׁבְטְךָ
  choice: твой жезл
  rationale: В контексте пастырского образа это орудие пастуха для защиты и управления стадом; «жезл» сохраняет поэтический регистр.
- source_word: וּמִשְׁעַנְתֶּךָ
  choice: твой посох
  rationale: «Посох» естественно передаёт опору пастуха и хорошо соответствует параллели с жезлом.
- source_word: הֵמָּה
  choice: они
  rationale: 'Самостоятельное местоимение в еврейском тексте имеет эмфатическую силу; в русском она сохранена конструкцией с тире: «— они».'
- source_word: יְנַחֲמֻנִי
  choice: утешают меня
  rationale: Перевод сохраняет значение утешения, ободрения и чувства безопасности, не сужая его до одной эмоции.
theological_decisions:
- issue: Значение צַלְמָוֶת в традиционно известном выражении
  choice: глубокой тьмы
  alternative: смертной тени
  rationale: Основной текст передаёт вероятное широкое лексическое значение слова и не ограничивает образ непосредственной смертью; традиционное прочтение и его смертельный оттенок отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимения, обращённые к Богу, даны со строчной буквы, поскольку прописная буква не выражена в древнееврейском тексте и относится к русской конфессионально-издательской традиции.
