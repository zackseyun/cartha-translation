  yaml_path: translation/ot/psalms/023/002.yaml
  text: In grassy pastures he makes me lie down[a]; beside restful waters he leads me.
translation:
  language: ru
  text: На пастбищах с сочной травой Он укладывает меня; к водам покоя[a] ведёт меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к тихим водам»; «к спокойным водам». Еврейское выражение означает воды, связанные с покоем или отдыхом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְאוֹת דֶּשֶׁא
  choice: на пастбищах с сочной травой
  rationale: נְאוֹת обозначает места выпаса и отдыха стада, а דֶּשֶׁא — свежую траву или растительность. Такое сочетание естественно по-русски и сохраняет пастушеский образ и смысл свежей растительности, не сводя его лишь к зелёному цвету.
- source_word: יַרְבִּיצֵנִי
  choice: Он укладывает меня
  rationale: Порода hifil глагола רבץ выражает побуждение лечь. «Укладывает меня» сохраняет причинительный оттенок и конкретный образ отдыхающего животного, не заменяя его отвлечённым понятием отдыха.
- source_word: עַל
  choice: к
  rationale: При глаголе движения и упоминании вод предлог обозначает направление к месту у воды. Русское «к» естественно передаёт эту связь.
- source_word: מֵי מְנֻחוֹת
  choice: водам покоя
  rationale: Буквально это «воды покоя/отдыха». Выражение сохраняет смысловую связь מְנֻחוֹת с покоем и не утверждает однозначно, что речь идёт только о неподвижности воды.
- source_word: יְנַהֲלֵנִי
  choice: ведёт меня
  rationale: Глагол נהל в интенсивной породе описывает заботливое ведение или сопровождение; «ведёт меня» ясно и без добавочного толкования сохраняет пастушеский образ.
theological_decisions:
- issue: 'Передача מֵי מְנֻחוֹת: традиционные «тихие воды» или источник-ориентированные «воды покоя»'
  choice: воды покоя
  alternative: тихие воды; спокойные воды
  rationale: Еврейское существительное непосредственно связано с покоем и отдыхом, а не только с отсутствием движения. «Воды покоя» сохраняют эту смысловую широту и поэтическую напряжённость; привычные варианты приведены в сноске как допустимые.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим строем. Сохранён параллелизм двух полустиший; архаизмы вроде «злачных пажитей» не использованы.
