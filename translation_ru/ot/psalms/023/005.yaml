  yaml_path: translation/ot/psalms/023/005.yaml
  text: You set a table before me in the presence of my enemies[a]; you anoint my head with oil[b]; my cup overflows.
translation:
  language: ru
  text: Ты накрываешь передо мной стол на виду у моих врагов[a]; щедро умащаешь мою голову маслом[b]; моя чаша льётся через край[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «готовишь передо мной стол в присутствии моих врагов». Еврейский глагол может означать «располагать», «устраивать» или «готовить».'
    reason: lexical_alternative
  - marker: b
    text: Буквально еврейское выражение связано с тем, чтобы сделать голову «тучной, богатой» маслом, то есть обильно умастить её в знак щедрого приёма и чести.
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское слово обозначает насыщенность или изобилие; возможный перевод: «моя чаша переполнена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּעֲרֹךְ
  choice: накрываешь
  rationale: Глагол ערך означает «располагать, приводить в порядок, готовить». В сочетании со словом «стол» русское «накрываешь» естественно передаёт приготовление трапезы и сохраняет конкретный образ гостеприимства.
- source_word: לְפָנַי
  choice: передо мной
  rationale: Прямое и естественное соответствие значению «передо мной, в моём присутствии».
- source_word: שֻׁלְחָן
  choice: стол
  rationale: Сохраняется буквальный образ стола и трапезы.
- source_word: נֶגֶד
  choice: на виду у
  rationale: Предлог указывает на нахождение напротив или в присутствии кого-либо. «На виду у» ясно показывает, что враги присутствуют и наблюдают, не предполагая непременно участия в трапезе.
- source_word: צֹרְרָי
  choice: моих врагов
  rationale: Причастная форма от צרר обозначает враждебных псалмопевцу людей; «враги» — прямое и общепонятное русское соответствие.
- source_word: דִּשַּׁנְתָּ
  choice: щедро умащаешь
  rationale: Глагол связан с полнотой, тучностью и изобилием и здесь описывает обильное умащение головы маслом. Наречие «щедро» сохраняет оттенок богатого, почётного приёма, который исчез бы при одном лишь «умащаешь».
- source_word: בַשֶּׁמֶן
  choice: маслом
  rationale: Инструментальное выражение передано без добавления неуказанного вида масла.
- source_word: רֹאשִׁי
  choice: мою голову
  rationale: Буквальный телесный образ сохранён.
- source_word: כּוֹסִי
  choice: моя чаша
  rationale: Сохраняется конкретный образ питьевой чаши, продолжающий картину трапезы и гостеприимства.
- source_word: רְוָיָה
  choice: льётся через край
  rationale: Слово выражает насыщенность, обилие или переполненность. Русское глагольное выражение естественно передаёт образ чаши, наполненной с избытком.
theological_decisions:
- issue: Смысл умащения головы маслом
  choice: 'Образ щедрого гостеприимства и оказанной чести: «щедро умащаешь мою голову маслом».'
  alternative: Понимать выражение как особое царское или сакральное помазание.
  rationale: Контекст стола и чаши поддерживает картину хозяина, щедро принимающего гостя. Текст не требует исключать иные поэтические ассоциации, но перевод не вводит более узкого царского или обрядового смысла.
- issue: Видо-временные формы
  choice: 'Настоящее время: «накрываешь… умащаешь… льётся».'
  alternative: «Ты приготовил… умастил… чаша переполнена».
  rationale: Первая форма имеет незавершённый вид действия, а вторая формально перфектна; в поэтическом контексте они образуют единую живую картину заботы Господа. Русское настоящее время сохраняет непосредственность и не вынуждает читателя видеть строго разнесённые по времени действия.
translation_notes:
  register: Современный литературный русский язык с ясным поэтическим ритмом. «Накрываешь стол» и «льётся через край» — общеупотребительные выражения; «умащаешь» сохраняет достоинство библейской поэзии и конкретный образ масла без искусственной архаизации всего стиха.
