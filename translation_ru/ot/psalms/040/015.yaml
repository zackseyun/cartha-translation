lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: да оцепенеют
  rationale: Форма Qal imperfect 3-го лица множественного числа от שׁמם может обозначать опустошение или потрясённое оцепенение. В контексте злорадной насмешки «да оцепенеют» естественно передаёт внезапное потрясение, не устраняя оттенка постигшего их бедствия.
- source_word: עַל עֵקֶב
  choice: от
  rationale: Сочетание буквально связано с «пятой/следом», но здесь выражает причину или следствие. Русское «от собственного позора» кратко и естественно сохраняет эту связь, допуская понимание как причины их оцепенения, так и последующего унижения.
- source_word: בָּשְׁתָּם
  choice: собственного позора
  rationale: Существительное обозначает стыд, бесчестье или позор. «Позор» лучше подходит к публичному унижению злорадствующих противников; «собственного» ясно передаёт местоименный суффикс 3-го лица множественного числа.
- source_word: הָאֹמְרִים לִי
  choice: те, кто говорит мне
  rationale: Артикль с причастием употреблён субстантивно. Эта русская конструкция современна, ясна и близко передаёт продолжающееся действие.
- source_word: הֶאָח הֶאָח
  choice: «Ага! Ага!»
  rationale: Повторённое междометие выражает злорадство и насмешку. «Ага!» сохраняет торжествующий, издевательский оттенок и сам повтор оригинала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической формой пожелания «да оцепенеют». Синтаксис сохраняет порядок смысловых частей еврейской строки, но звучит естественно по-русски. Подлинная смысловая широта שׁמם и причинно-следственная неоднозначность עַל עֵקֶב отражены в выборе слов и не превращены в узкоконфессиональное толкование.
