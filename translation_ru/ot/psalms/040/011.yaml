  text: אַתָּ֤ה יְהוָ֗ה לֹא תִכְלָ֣א רַחֲמֶ֣י/ךָ מִמֶּ֑/נִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ תָּמִ֥יד יִצְּרֽוּ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/011.yaml
  text: You[a], O Yahweh, will not withhold your compassion from me[b]; your steadfast love and your faithfulness will continually preserve me.
translation:
  language: ru
  text: Ты, Яхве, не удержишь от меня Своего сострадания[b]; Твоя неизменная любовь и Твоя верность[a] всегда будут хранить меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истина».'
    reason: lexical_alternative
  - marker: b
    text: 'Или, как просьба: «Ты, Яхве, не удерживай от меня Своего сострадания».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, принятой современной русской транслитерацией.
- source_word: תִכְלָא
  choice: не удержишь
  rationale: Глагол כלא означает «удерживать, не давать, сдерживать». Форма yiqtol передана как уверенное утверждение о будущем; возможное просительное прочтение отмечено в сноске.
- source_word: רַחֲמֶיךָ
  choice: Своего сострадания
  rationale: Множественная форма רַחֲמִים обозначает глубокое милосердие и сострадание; русское собирательное единственное число звучит естественно.
- source_word: מִמֶּנִּי
  choice: от меня
  rationale: Прямо передаёт предлог מִן с суффиксом первого лица после глагола «удерживать».
- source_word: חַסְדְּךָ
  choice: Твоя неизменная любовь
  rationale: Сочетание передаёт доброту, постоянство и верность обязательствам, заключённые в חֶסֶד, не сводя слово только к чувству или милости.
- source_word: אֲמִתְּךָ
  choice: Твоя верность
  rationale: В параллели с חֶסֶד слово אֱמֶת подчёркивает надёжность и постоянство Бога; значение «истина» сохраняется в сноске.
- source_word: תָּמִיד
  choice: всегда
  rationale: Естественно передаёт непрерывный, постоянный характер охраняющего действия.
- source_word: יִצְּרוּנִי
  choice: будут хранить меня
  rationale: Глагол נצר выражает охрану и сохранение. Множественное число согласовано с составным подлежащим «любовь и верность».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Значение אֱמֶת в паре חֶסֶד וֶאֱמֶת
  choice: верность
  alternative: истина
  rationale: Здесь оба качества олицетворённо хранят псалмопевца, поэтому «верность» лучше выражает Божью надёжность; допустимое значение «истина» указано в сноске.
- issue: Модальность לֹא תִכְלָא
  choice: 'уверенное утверждение: «не удержишь»'
  alternative: 'просьба: «не удерживай»'
  rationale: Форма является yiqtol второго лица и может выражать уверенность в Божьем действии, однако в молитвенном контексте возможно и юссивно-просительное понимание; неоднозначность сохранена сноской.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Порядок второй части сохраняет поэтический параллелизм еврейского текста.
