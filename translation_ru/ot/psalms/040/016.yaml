  text: יָ֘שִׂ֤ישׂוּ וְ/יִשְׂמְח֨וּ בְּ/ךָ֗ כָּֽל מְבַ֫קְשֶׁ֥י/ךָ יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה אֹֽ֝הֲבֵ֗י תְּשׁוּעָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/016.yaml
  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May Yahweh be magnified!”
translation:
  language: ru
  text: 'Пусть радуются и веселятся о тебе все, кто ищет тебя; пусть те, кто любит твоё спасение[a], всегда говорят: «Да возвеличится Яхве!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «твоё избавление». Еврейское תְּשׁוּעָה может означать как спасение, так и избавление.
    reason: lexical_alternative
  - marker: b
    text: Возглас «Да возвеличится Яхве!» выражает желание, чтобы величие Яхве было открыто признано.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: Пусть радуются и веселятся
  rationale: Два близких по значению глагола переданы разными естественными русскими словами, чтобы сохранить поэтическое усиление. Формы имперфекта в молитвенном контексте выражают пожелание.
- source_word: בְּךָ
  choice: о тебе
  rationale: Предлог ב указывает на предмет или основание радости. Русское «радоваться о тебе» сохраняет направленность радости на Бога и соответствует возвышенному псалмопевческому регистру; более буквальное «в тебе» по-русски здесь звучит менее естественно.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: все, кто ищет тебя
  rationale: Субстантивированное причастие обозначает людей, для которых характерно стремление к Богу; придаточная конструкция естественна в современном русском языке.
- source_word: יֹאמְרוּ תָמִיד
  choice: всегда говорят
  rationale: תָמִיד передаёт постоянный или повторяющийся характер возгласа. «Всегда» естественно и сохраняет смысл непрестанного исповедания.
- source_word: יִגְדַּל יְהוָה
  choice: Да возвеличится Яхве!
  rationale: Форма понимается как пожелание или торжественный возглас, а не как простое утверждение. Конструкция с «да» сохраняет этот оттенок и литургическую торжественность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой русской транслитерацией, а не заменено титулом.
- source_word: אֹהֲבֵי תְּשׁוּעָתֶךָ
  choice: те, кто любит твоё спасение
  rationale: תְּשׁוּעָה допускает значения «спасение» и «избавление». «Спасение» сохраняет как смысл конкретной помощи, так и более широкое богословское звучание, не сужая контекст.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение תְּשׁוּעָה
  choice: спасение
  alternative: избавление
  rationale: Слово может обозначать как конкретное избавление, так и спасение в более широком смысле. Основной текст сохраняет более ёмкое «спасение», а конкретная альтернатива отмечена в сноске.
- issue: Модальность יִגְדַּל
  choice: 'пожелание-прославление: «Да возвеличится Яхве!»'
  alternative: 'утверждение: «Велик Яхве!»'
  rationale: Молитвенный контекст и параллельные волевые формы поддерживают юссивное понимание. При этом сноска поясняет, что речь идёт об открытом признании величия Бога, а не о буквальном увеличении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмопевческим звучанием. Поэтический параллелизм сохранён; архаизмы сведены к уместной формуле пожелания «да возвеличится». Местоимения, относящиеся к Богу, набраны со строчной буквы в соответствии с современной нейтральной издательской практикой.
