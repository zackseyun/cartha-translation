id: PSA.40.12
reference: Psalms 40:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֤י אָפְפ֥וּ עָלַ֨/י רָע֡וֹת עַד אֵ֬ין מִסְפָּ֗ר הִשִּׂיג֣וּ/נִי עֲ֭וֺנֹתַ/י וְ/לֹא יָכֹ֣לְתִּי לִ/רְא֑וֹת עָצְמ֥וּ מִ/שַּֽׂעֲר֥וֹת רֹ֝אשִׁ֗/י וְ/לִבִּ֥/י עֲזָבָֽ/נִי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/012.yaml
  text: For evils beyond number have surrounded me[a]; my iniquities have overtaken me, and I am not able to see. They are more than the hairs of my head[c][b], and my heart fails me.
translation:
  language: ru
  text: Ибо окружили меня беды, которым нет числа[a]; мои беззакония настигли меня[b], и я не могу видеть. Их больше, чем волос на моей голове, и сердце моё покинуло меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беды без числа»; «столько бед, что их не счесть».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «моя вина» и включать как сами грехи, так и лежащее на человеке бремя вины.
    reason: lexical_alternative
  - marker: c
    text: 'То есть меня оставили силы или мужество; буквально: «моё сердце оставило меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующей мольбы; «ибо» сохраняет пояснительную связь и соответствует возвышенному, но понятному регистру псалма.
- source_word: אָפְפוּ עָלַי
  choice: окружили меня
  rationale: Глагол передаёт образ бед, обступивших говорящего со всех сторон; выражение естественно по-русски и сохраняет исходный образ.
- source_word: רָעוֹת
  choice: беды
  rationale: Слово может обозначать зло, несчастья или бедствия. В данном контексте «беды» передаёт переживаемые несчастья, не смешивая их с названными далее беззакониями самого псалмопевца.
- source_word: עַד אֵין מִסְפָּר
  choice: которым нет числа
  rationale: Еврейский оборот выражает неисчислимое множество; выбранная русская формулировка точна, естественна и поэтична.
- source_word: הִשִּׂיגוּנִי
  choice: настигли меня
  rationale: 'Сохраняет образ преследования: беззакония достигли говорящего и захватили его.'
- source_word: עֲוֹנֹתַי
  choice: мои беззакония
  rationale: עָוֹן охватывает совершённое беззаконие, вину и её бремя. Основной вариант сохраняет нравственный смысл, не сводя слово лишь к последствиям греха.
- source_word: וְלֹא יָכֹלְתִּי לִרְאוֹת
  choice: и я не могу видеть
  rationale: Прямо передаёт заявленную неспособность видеть, не уточняя без достаточных оснований, вызвана ли она подавленностью, помрачением или невозможностью охватить происходящее.
- source_word: עָצְמוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: Их больше, чем волос на моей голове
  rationale: В сравнительной конструкции глагол выражает превосходство по числу; русский вариант сохраняет наглядное сравнение и ясную отсылку к беззакониям.
- source_word: לִבִּי עֲזָבָנִי
  choice: сердце моё покинуло меня
  rationale: Буквальный метафорический образ остаётся понятным в русском поэтическом контексте и не сужается до одного толкования — утраты мужества, сил или самообладания.
theological_decisions:
- issue: Обозначает ли עֲוֹנֹתַי собственные грехи псалмопевца, его вину или последствия грехов
  choice: мои беззакония
  alternative: моя вина; последствия моих грехов
  rationale: Форма с притяжательным суффиксом естественнее всего указывает на собственные беззакония говорящего, однако семантика עָוֹן может включать и вину с её бременем. Перевод сохраняет напряжение между внешними бедами и личной нравственной ответственностью.
- issue: Следует ли истолковать образ оставившего сердца как утрату мужества или сил
  choice: сердце моё покинуло меня
  alternative: сердце моё изнемогло; мужество оставило меня
  rationale: Исходный текст использует широкую метафору. Буквально-образная передача не навязывает единственного психологического или физического толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Синтаксис близок к еврейской поэтической последовательности, но остаётся ясным для обычного читателя; метафоры преследования и оставившего сердца сохранены без конфессионального истолкования.
