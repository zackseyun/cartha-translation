base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/008.yaml
  text: I delight to do your will[a], my God, and your law is within my inner being.
translation:
  language: ru
  text: Исполнять Твою волю, Боже мой, — мне отрадно, и Твой закон[a] — внутри меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление». Еврейское слово тора может обозначать Божье учение в широком смысле, а не только правовые установления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: исполнять
  rationale: Инфинитив עשה с ל обозначает содержание стремления или радости. В сочетании с «волей» современное русское «исполнять» естественнее буквального «делать».
- source_word: רְצוֹנְךָ
  choice: Твою волю
  rationale: רָצוֹן может означать волю, желание или благоволение; сочетание с עשה здесь естественно передаётся как «исполнять Твою волю».
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Форма с суффиксом первого лица выражает личное прямое обращение; звательный оборот «Боже мой» естественен для русского псалма.
- source_word: חָפָצְתִּי
  choice: моя радость
  rationale: חפץ выражает желание, удовольствие и расположенность. Именная конструкция по-русски естественно передаёт не просто намерение, а радость от исполнения Божьей воли, не делая акцента на прошедшем времени еврейской формы.
- source_word: וְתוֹרָתְךָ
  choice: Твой закон
  rationale: תּוֹרָה означает закон или наставление. «Закон» сохраняет устойчивое заветное и библейское звучание, а более широкое значение отмечено в сноске.
- source_word: בְּתוֹךְ
  choice: в глубине
  rationale: Оборот обозначает нахождение внутри. «В глубине» естественно сочетается с обозначением внутреннего существа человека и сохраняет образ глубокой внутренней укоренённости.
- source_word: מֵעָי
  choice: моего существа
  rationale: מֵעֶה буквально обозначает внутренности, а переносно — внутреннего человека, глубочайшую область чувств и воли. «Моего существа» сохраняет антропологическую широту без архаичного телесного образа; «сердца» было бы более узким толкованием.
theological_decisions:
- issue: Передача תּוֹרָה в контексте внутренней преданности Богу
  choice: закон
  alternative: наставление
  rationale: «Закон» сохраняет заветный и Писанийный смысл תּוֹרָה, тогда как сноска не даёт сузить слово до одних юридических предписаний и сохраняет его более широкое значение Божьего учения.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Инверсия первой части сохраняет поэтический акцент на исполнении Божьей воли; тире и точка с запятой делают параллелизм ясным без архаизации.
