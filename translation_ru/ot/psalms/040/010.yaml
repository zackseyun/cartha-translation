  text: צִדְקָתְ/ךָ֬ לֹא כִסִּ֨יתִי בְּ/ת֬וֹךְ לִבִּ֗/י אֱמוּנָתְ/ךָ֣ וּ/תְשׁוּעָתְ/ךָ֣ אָמָ֑רְתִּי לֹא כִחַ֥דְתִּי חַסְדְּ/ךָ֥ וַ֝/אֲמִתְּ/ךָ֗ לְ/קָהָ֥ל רָֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/010.yaml
  text: I have not hidden your righteousness within my heart[a]; I have spoken of your faithfulness and your salvation[d][c][b]. I have not concealed your steadfast love and your truth from the great assembly.
translation:
  language: ru
  text: Праведность Твою я не скрывал в своём сердце[a]; о Твоей верности и спасении я возвещал[b]. Я не утаил Твоей неизменной любви[c] и истины от великого собрания[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость Твою». Еврейское слово может обозначать как праведность, так и справедливое действие или оправдание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избавлении».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «верной любви» или «милости». Еврейское слово חֶסֶד обозначает любовь и милость, отличающиеся стойкостью и верностью.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «перед великим собранием». Еврейская конструкция может подчёркивать либо тех, от кого это не было скрыто, либо собравшихся, перед которыми об этом возвещалось.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: Праведность Твою
  rationale: צדקה обозначает праведность, а в некоторых контекстах также справедливость или праведное избавительное действие. «Праведность» естественно сочетается здесь с верностью, спасением, любовью и истиной.
- source_word: לֹא כִסִּיתִי
  choice: я не скрывал
  rationale: כסה буквально означает «покрывать», но в сочетании с сердцем передаёт намеренное удержание чего-либо внутри; «не скрывал» ясно и естественно выражает этот смысл.
- source_word: בְּתוֹךְ לִבִּי
  choice: в своём сердце
  rationale: Русское выражение сохраняет еврейский образ внутреннего сокрытия, не воспроизводя неестественно буквальное «посреди моего сердца».
- source_word: אֱמוּנָתְךָ
  choice: о Твоей верности
  rationale: אֱמוּנָה здесь указывает на надёжность и верность Бога, а не на человеческую веру.
- source_word: וּתְשׁוּעָתְךָ
  choice: и спасении
  rationale: תשועה может означать спасение, избавление или победу. «Спасение» сохраняет широту значения и уместно в контексте Божьей помощи.
- source_word: אָמָרְתִּי
  choice: я возвещал
  rationale: Хотя глагол буквально значит «я сказал», наличие двух прямых дополнений и публичный контекст великого собрания допускают естественное русское «возвещал».
- source_word: לֹא כִחַדְתִּי
  choice: Я не утаил
  rationale: כחד означает скрывать или удерживать. «Не утаил» сохраняет смысл и стилистически отличает вторую строку от более раннего «не скрывал».
- source_word: חַסְדְּךָ
  choice: Твоей неизменной любви
  rationale: חסד соединяет любовь, милость и верность обязательствам. «Неизменная любовь» понятно передаёт устойчивость этого отношения, не вводя узкоконфессиональной терминологии.
- source_word: וַאֲמִתְּךָ
  choice: и истины
  rationale: אמת может означать истину, надёжность или верность. «Истина» сохраняет отличие от אֱמוּנָה, уже переданного как «верность».
- source_word: לְקָהָל רָב
  choice: от великого собрания
  rationale: После глагола сокрытия предлог לְ естественно передаётся по-русски конструкцией «утаить от кого-либо»; «великое собрание» сохраняет публичный и общинный характер сцены.
theological_decisions:
- issue: Различение близких заветных понятий אֱמוּנָה и אֱמֶת
  choice: Передать их соответственно как «верность» и «истина».
  alternative: Передать оба слова через «верность» либо поменять соответствия местами.
  rationale: Так сохраняются одновременно смысловая близость и лексическое различие двух еврейских слов, без сведения обоих Божьих качеств к одному понятию.
- issue: Временной вид еврейских перфектов
  choice: Использовать русское прошедшее несовершенного вида для первых двух действий («не скрывал», «возвещал») и совершенного вида для итогового «не утаил».
  alternative: 'Последовательно употребить совершенный вид: «не скрыл», «возвестил», «не утаил».'
  rationale: Контекст свидетельства допускает описание устойчивого публичного поведения, а не только единичных завершённых действий. Видовое варьирование естественно для русского языка и не приписывает форме лишней временной точности.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Синтаксис остаётся ясным для широкого читателя; параллелизм двух отрицаний и перечень Божьих качеств сохранены. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
