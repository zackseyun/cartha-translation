base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/002.yaml
  text: He brought me up out of the pit of tumult[a], out of the miry clay; he set my feet on a rock, making my steps secure.
translation:
  language: ru
  text: Он поднял меня из шумной ямы[a], из топкой грязи; поставил мои ноги на скалу, утвердил мои шаги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из ямы грохота (рёва)»; еврейское слово может обозначать шум, грохот, рёв или смятение. Иногда это выражение передают более истолковательно: «из гибельной ямы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלֵנִי
  choice: Он поднял меня
  rationale: Порода hифиль глагола עלה означает «поднять, вывести наверх»; формулировка сохраняет конкретный образ избавления.
- source_word: מִבּוֹר
  choice: из ямы
  rationale: בּוֹר может обозначать яму, цистерну или подобное темнице углубление; «яма» естественно звучит в данном поэтическом контексте.
- source_word: שָׁאוֹן
  choice: шумящей
  rationale: Существительное обозначает шум, грохот, рёв или смятение. Определение «шумящей» передаёт слышимый образ и естественнее по-русски, чем буквальное «яма шума».
- source_word: מִטִּיט הַיָּוֵן
  choice: из топкой грязи
  rationale: טִיט — глина, грязь, тина; יָוֵן — вязкая жижа или трясина. Сочетание описывает вязкую, ненадёжную почву; «топкая грязь» передаёт усиленный образ без неестественного повтора.
- source_word: וַיָּקֶם עַל סֶלַע רַגְלַי
  choice: поставил мои ноги на скалу
  rationale: קום в hифиле означает «поставить, утвердить», а סֶלַע — скала или утёс. Перевод сохраняет конкретность и противопоставление топкой грязи твёрдой скале.
- source_word: כּוֹנֵן אֲשֻׁרָי
  choice: утвердил мои шаги
  rationale: כון в поле́ле означает сделать твёрдым, устойчивым; אֲשֻׁרָי — «мои шаги». Лаконичная формулировка передаёт достигнутую устойчивость.
theological_decisions:
- issue: Сохранять ли конкретные образы избавления или истолковать их как отвлечённое духовное спасение
  choice: Сохранены образы ямы, грязи, ног, скалы и шагов
  alternative: 'Передать смысл отвлечённо: «Он избавил меня от гибели и даровал безопасность»'
  rationale: Еврейский текст выражает избавление через физически ощутимые поэтические образы и сам не сводит их к одному конкретному богословскому толкованию.
translation_notes:
  register: Современный литературный русский язык с поэтической сдержанностью. Синтаксический параллелизм оригинала сохранён; архаизмы и конфессионально окрашенные толкования не вводятся.
