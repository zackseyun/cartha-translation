lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: да постыдятся
  rationale: Глагол בוש обозначает переживание стыда. Частица «да» естественно передаёт желательное, молитвенно-просительное значение формы в данном контексте.
- source_word: וְיַחְפְּרוּ
  choice: и будут унижены
  rationale: חפר здесь выражает унижение и бесчестье; этот перевод усиливает параллель с «постыдятся», не сливая два еврейских глагола в один.
- source_word: יַחַד
  choice: все вместе
  rationale: Наречие указывает на совместность или одновременность участи противников; «все вместе» ясно и естественно по-русски.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: те, кто стремится… мою жизнь
  rationale: נפשׁ в этом контексте означает жизнь самого псалмопевца, а не отвлечённую нематериальную «душу»; причастие בקשׁ передано через естественную русскую конструкцию «те, кто стремится».
- source_word: לִסְפּוֹתָהּ
  choice: погубить
  rationale: ספה может означать уничтожить, истребить или довести до конца. «Погубить» естественно сочетается с «жизнь» и ясно передаёт намерение врагов лишить псалмопевца жизни.
- source_word: יִסֹּגוּ אָחוֹר
  choice: да отступят назад
  rationale: Сочетание סוג с אחור означает отступление или обращение вспять. Сохранение «назад» передаёт образность еврейского выражения.
- source_word: וְיִכָּלְמוּ
  choice: и покроются позором
  rationale: כלם означает подвергнуться стыду или бесчестью. Идиома «покрыться позором» естественна в современном литературном русском и сохраняет поэтический параллелизм.
- source_word: חֲפֵצֵי רָעָתִי
  choice: те, кто радуется моей беде
  rationale: חפץ может обозначать желание или удовольствие, а רעה здесь — беду или несчастье, постигающее псалмопевца, а не его нравственное зло. Формулировка передаёт злорадство противников.
