base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/004.yaml
  text: Blessed is the man who has made Yahweh his trust[a], and has not turned to the proud[d][c][b], to those who turn aside to falsehood.
translation:
  language: ru
  text: Блажен[a] человек[b], который сделал Яхве своей надеждой и не обратился к гордецам[c] и к тем, кто уклоняется ко лжи[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Можно также перевести: «Счастлив». Еврейское אַשְׁרֵי выражает и счастье, и блаженное, достойное одобрения положение.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово стоит в форме мужского рода единственного числа, но здесь человек представлен как типичный пример для всех.
    reason: cultural_note
  - marker: c
    text: 'Или: «к надменным». В данном контексте רְהָבִים, вероятнее всего, обозначает гордых людей, а не Раав как имя или образ Египта.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «к тем, кто уклоняется к обману» или «к лжи». Еврейское כָזָב означает ложь, обман или ложное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Еврейская формула блаженства выражает не только чувство счастья, но и достойное, благословенное положение человека; краткая форма естественна перед подлежащим в единственном числе.
- source_word: הַגֶּבֶר
  choice: человек
  rationale: Существительное обозначает взрослого мужчину, но здесь в формуле мудрости имеет представительное значение. Русское «человек» естественно передаёт это значение без ненужного акцента на физической силе.
- source_word: שָׂם
  choice: сделал
  rationale: Глагол означает «поставил, поместил»; в сочетании с יְהוָה и מִבְטַחוֹ конструкция естественно передаётся как «сделал Яхве своей надеждой», сохраняя образ и завершённость действия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: מִבְטַחוֹ
  choice: своей надеждой
  rationale: Существительное обозначает того или то, на кого возлагают доверие. «Надежда» естественно сочетается по-русски с конструкцией «сделал … своей» и сохраняет предмет доверия.
- source_word: פָנָה אֶל
  choice: не обратился к
  rationale: Оборот выражает поворот к кому-либо за вниманием, поддержкой или руководством; «обратился к» сохраняет и образ направления, и смысл упования.
- source_word: רְהָבִים
  choice: гордецам
  rationale: Множественное число в данном контексте вероятнее обозначает надменных людей, а не собственное имя Раав.
- source_word: שָׂטֵי כָזָב
  choice: к тем, кто уклоняется в ложь
  rationale: Причастная конструкция сохраняет идею отклонения от верного пути, а כָזָב передано как собирательное «ложь». Формулировка не усиливается до специального богословского термина «отступники».
theological_decisions:
- issue: Представительное значение формы мужского рода הַגֶּבֶר
  choice: человек
  alternative: мужчина; муж
  rationale: В контексте мудростной формулы речь идёт о типичном представителе людей, хотя исходное слово грамматически и лексически мужского рода. Русское «человек» сохраняет единственное число и естественно передаёт обобщение.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет отличие имени от титула.
- issue: Значение רְהָבִים
  choice: гордецы
  alternative: надменные; Раавы
  rationale: Контекст противопоставляет надежду на Яхве обращению к людям, связанным с ложью. Нарицательное значение «гордецы» наиболее вероятно, но оттенок надменности отмечен в сноске.
- issue: Связь и смысл שָׂטֵי כָזָב
  choice: те, кто уклоняется в ложь
  alternative: те, кто обращается ко лжи; отступники лжи
  rationale: Еврейское выражение допускает разные способы описать уклонение к ложному. Основной текст сохраняет движение в сторону лжи и не уточняет, идёт ли речь именно об идолопоклонстве, обмане или вероотступничестве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Сохранены краткая формула блаженства, личное имя Яхве и образ уклонения с верного пути; избегнуты архаизмы «муж», «упование» и чрезмерно специальное «отступники».
