source:
  edition: WLC
  text: רְצֵ֣ה יְ֭הוָה לְ/הַצִּילֵ֑/נִי יְ֝הוָ֗ה לְ/עֶזְרָ֥תִ/י חֽוּשָׁ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/013.yaml
  text: Be pleased[a], O Yahweh, to deliver me; O Yahweh[b], hurry to help me.
translation:
  language: ru
  text: Благоволи[a], Яхве, избавить меня; Яхве, поспеши[b] мне на помощь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будь благосклонен» или «пожелай». Еврейское слово выражает просьбу о благосклонной воле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «скорее приди мне на помощь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצֵה
  choice: Благоволи
  rationale: Повелительная форма רצה в обращении к Богу выражает просьбу о благосклонной воле и согласии действовать. «Благоволи» сохраняет этот оттенок и соответствует возвышенному, но понятному языку молитвы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: לְהַצִּילֵנִי
  choice: избавить меня
  rationale: Каузативная форма נצל с местоименным суффиксом означает «вырвать из опасности, избавить, спасти». «Избавить меня» естественно для молитвенного контекста и не сужает смысл до одного вида спасения.
- source_word: לְעֶזְרָתִי
  choice: мне на помощь
  rationale: 'Буквально: «к моей помощи / для моей помощи». Русское выражение «поспеши мне на помощь» естественно передаёт просьбу о срочном содействии.'
- source_word: חוּשָׁה
  choice: поспеши
  rationale: Повелительная форма חושׁ передаёт настойчивую просьбу действовать без промедления. «Поспеши» сохраняет срочность и уместно звучит в современном литературном русском языке.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте дважды прямо употреблён тетраграмматон. Транслитерация «Яхве» сохраняет личное Божье имя и не подменяет его титулом.
- issue: Оттенок просьбы רְצֵה
  choice: Благоволи
  alternative: Будь готов; пожелай; соблаговоли
  rationale: Текст просит о благосклонном волеизъявлении Бога, не объясняя, чем оно обусловлено. Перевод сохраняет молитвенную напряжённость и не добавляет богословского толкования.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой молитвы. «Благоволи» и «поспеши» несколько возвышенны, но остаются понятными; синтаксический параллелизм и двукратное обращение «Яхве» сохранены.
