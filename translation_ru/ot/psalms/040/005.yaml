base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/005.yaml
  text: You have done many things[a], O Yahweh my God—your wonders and your plans for us; none can be compared to you. If I would declare and speak of them, they are too many to recount.
translation:
  language: ru
  text: Многое Ты совершил, Яхве, Боже мой. Многочисленны Твои чудеса и Твои замыслы о нас[a]. Нет равного Тебе. Если бы я стал возвещать и рассказывать о них, их слишком много, чтобы исчислить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твои мысли о нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבּוֹת עָשִׂיתָ
  choice: Многое Ты совершил
  rationale: Форма רַבּוֹת указывает на многочисленность совершённого; субстантивированное «многое» естественно передаёт подразумеваемый объект, а перфект עָשִׂיתָ — совершённые Богом деяния.
- source_word: יְהוָה אֱלֹהַי
  choice: Яхве, Боже мой
  rationale: Личное имя передано транслитерацией «Яхве», а форма с суффиксом — естественным русским обращением «Боже мой».
- source_word: נִפְלְאֹתֶיךָ
  choice: Твои чудеса
  rationale: Кратко сохраняет значение удивительных, чудесных деяний Бога, не превращая существительное в развёрнутый пересказ.
- source_word: וּמַחְשְׁבֹתֶיךָ אֵלֵינוּ
  choice: и Твои замыслы о нас
  rationale: מַחְשָׁבוֹת может обозначать мысли, намерения или замыслы. «Замыслы о нас» естественно выражает целенаправленность, а буквальная смысловая альтернатива отмечена в сноске.
- source_word: אֵין עֲרֹךְ אֵלֶיךָ
  choice: Нет равного Тебе
  rationale: Лаконичная русская идиома передаёт возможное утверждение о несравненности Бога; грамматически допустимое отнесение выражения к перечислению Божьих дел сохранено в сноске.
- source_word: אַגִּידָה וַאֲדַבֵּרָה
  choice: Если стану возвещать и рассказывать о них
  rationale: Когортативные формы в данном контексте естественно понимать как условное начало мысли, продолженной утверждением о невозможности полного перечисления. «О них» явно восстанавливает подразумеваемый объект.
- source_word: עָצְמוּ מִסַּפֵּר
  choice: их больше, чем можно исчислить
  rationale: В сочетании с מִסַּפֵּר глагол выражает чрезмерную многочисленность; русская формулировка передаёт смысл «слишком многочисленны для счёта».
theological_decisions:
- issue: Значение Божьих מַחְשְׁבוֹת по отношению к народу
  choice: замыслы о нас
  alternative: мысли о нас; намерения о нас
  rationale: Перевод выражает благую целенаправленность Божьего отношения, но не вводит определённой системы учения о предопределении или провидении.
- issue: Референт выражения אֵין עֲרֹךְ אֵלֶיךָ
  choice: Нет равного Тебе
  alternative: Их невозможно изложить перед Тобой
  rationale: Еврейская конструкция допускает как утверждение о несравненности Бога, так и мысль о невозможности упорядоченно перечислить Его чудеса и замыслы перед Ним. Основной текст следует традиционному контекстуальному пониманию, не скрывая другой возможности.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмическим звучанием. Заглавные местоимения в обращении к Богу сохраняют традиционную русскую почтительность; синтаксис остаётся ясным для обычного читателя.
