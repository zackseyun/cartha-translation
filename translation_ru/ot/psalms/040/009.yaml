    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשַּׂרְתִּי
  choice: я возвещал
  rationale: Пиэль глагола בּשׂר обозначает публичное принесение или провозглашение вести, нередко благой. «Возвещал» сохраняет вестнический и публичный характер действия, не добавляя более узкого новозаветного оттенка.
- source_word: צֶדֶק
  choice: праведность
  rationale: Слово охватывает нравственную правоту и справедливость. В контексте псалма «праведность» естественно передаёт основное значение, а судебный оттенок отмечен в сноске.
- source_word: בְּקָהָל רָב
  choice: в великом собрании
  rationale: קָהָל — собравшаяся община или собрание, а רָב указывает на его многочисленность или величие. Формулировка сохраняет торжественный поэтический регистр и публичную обстановку.
- source_word: הִנֵּה
  choice: вот
  rationale: «Вот» естественно передаёт указательно-эмфатическую функцию הִנֵּה в современном литературном русском языке.
- source_word: שְׂפָתַי לֹא אֶכְלָא
  choice: я не удерживал уст своих
  rationale: Перевод сохраняет конкретный образ уст как органа речи и значение глагола כלה — удерживать или сдерживать. Инверсия поддерживает достоинство поэтического регистра.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом; форма «Яхве» общепринята в современной русской научной и переводческой традиции.
- source_word: יָדָעְתָּ
  choice: Ты знаешь
  rationale: Перфект здесь выражает наличное и несомненное знание адресата; русское настоящее время звучит естественно в прямом обращении.
theological_decisions:
- issue: Передача צֶדֶק
  choice: праведность
  alternative: справедливость
  rationale: Еврейское слово допускает оба оттенка; основной текст сохраняет нравственно-религиозную широту «праведности», а возможный судебно-общественный смысл не устраняется и указан в сноске.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным псалмическим звучанием. Конкретный образ «уст» и эмфатическое «вот» сохранены; пунктуация подчёркивает прямое обращение в заключительной строке.
