  text: וַ/אֲנִ֤י עָנִ֣י וְ/אֶבְיוֹן֮ אֲדֹנָ֪/י יַחֲשָׁ֫ב לִ֥/י עֶזְרָתִ֣/י וּ/מְפַלְטִ֣/י אַ֑תָּה אֱ֝לֹהַ֗/י אַל תְּאַחַֽר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/017.yaml
  text: But I am poor and needy; the Lord thinks of me. You are my help and my deliverer; my God[a], do not delay.
translation:
  language: ru
  text: Но я беден и в нужде; Господь думает обо мне.[a] Ты — помощь моя и избавитель мой; Боже мой, не медли!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь принимает меня во внимание»; возможно также: «Господь подумает обо мне».'
    reason: Лексическая и видовременная неоднозначность оборота יַחֲשָׁב לִי.
lexical_decisions:
- source_word: וַאֲנִי
  choice: Но я
  rationale: Самостоятельное местоимение вместе с союзом подчёркивает контраст с предшествующим контекстом; «Но я» естественно передаёт это противопоставление.
- source_word: עָנִי וְאֶבְיוֹן
  choice: беден и нуждаюсь
  rationale: 'Сохраняется сочетание двух близких понятий: первое обозначает бедственное, униженное положение, второе — нужду. Глагольная передача второго слова звучит по-русски естественнее, чем «бедный и нуждающийся».'
- source_word: אֲדֹנָי
  choice: Господь
  rationale: В источнике стоит божественный титул Адонай, а не тетраграмматон; «Господь» точно и естественно передаёт титул.
- source_word: יַחֲשָׁב לִי
  choice: думает обо мне
  rationale: Оборот может означать «думать о ком-либо», «считаться с кем-либо», «принимать во внимание». Основной текст сохраняет личный смысл заботливого внимания, не усиливая его до явно выраженного замысла.
- source_word: עֶזְרָתִי
  choice: помощь моя
  rationale: Существительное обозначает помощь, а не обязательно помощника; выбранная форма сохраняет образ и поэтическую краткость.
- source_word: וּמְפַלְטִי
  choice: и избавитель мой
  rationale: Причастная форма обозначает того, кто избавляет или приводит в безопасность. «Избавитель» сохраняет деятельный смысл и возвышенный, но понятный регистр.
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Форма является прямым обращением с притяжательным суффиксом; русский звательный оборот «Боже мой» естественно передаёт обращение.
- source_word: אַל תְּאַחַר
  choice: не медли
  rationale: Запретительная форма выражает настойчивую просьбу действовать без промедления; «не медли» кратко и ясно сохраняет её срочность.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: Владыка; мой Господь
  rationale: Это титул Адонай, а не имя יהוה. «Господь» сохраняет традиционное различие и не добавляет отсутствующего в форме притяжательного значения.
- issue: Смысл יַחֲשָׁב לִי
  choice: Господь думает обо мне
  alternative: Господь принимает меня во внимание; Господь подумает обо мне
  rationale: Несовершенный вид глагола допускает настоящее или будущее прочтение, а конструкция может указывать на внимание и заботу. Основной вариант не превращает выражение в более сильное утверждение о предвечном или провиденциальном замысле; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Инверсия «помощь моя и избавитель мой» сохраняет поэтический параллелизм, оставаясь понятной современному читателю.
