base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/006.yaml
  text: Sacrifice and offering you did not desire[a]; ears you have opened for me[b]; burnt offering and sin offering you did not ask for.
translation:
  language: ru
  text: Жертвы и хлебного приношения[b] Ты не пожелал; уши Ты открыл мне[a]; всесожжения и жертвы за грех Ты не просил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уши Ты выкопал мне» — вероятно, образ того, что Бог дал мне способность слышать и повиноваться. В Септуагинте: «тело Ты приготовил мне»; этот вариант приведён в Евреям 10:5.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «приношения»; еврейское слово в данном контексте обычно обозначает приношение из зерна или муки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח
  choice: жертва
  rationale: Обычное и естественное обозначение закалываемой жертвы в контексте богослужения.
- source_word: מִנְחָה
  choice: хлебное приношение
  rationale: В культовом контексте слово обычно обозначает приношение из зерна или муки; традиционное русское выражение сохраняет эту конкретику.
- source_word: חָפַצְתָּ
  choice: Ты не пожелал
  rationale: Передаёт значение желания и благоволения, не усиливая его до категорического запрета.
- source_word: אָזְנַיִם כָּרִיתָ לִּי
  choice: уши Ты открыл мне
  rationale: Буквально сказано «уши Ты выкопал мне»; естественный русский перевод передаёт образ дарованной способности слышать и быть послушным, а буквальная метафора сохраняется в примечании.
- source_word: עוֹלָה
  choice: всесожжение
  rationale: Устоявшийся и точный русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: חֲטָאָה
  choice: жертва за грех
  rationale: Параллелизм с другими видами жертв требует культового значения, а не отвлечённого «грех».
- source_word: שָׁאָלְתָּ
  choice: Ты не просил
  rationale: Сохраняет прямое значение глагола שאל и не усиливает его до более толковательного «не требовал».
theological_decisions:
- issue: Соотношение еврейского выражения «уши Ты выкопал мне» с Септуагинтой и цитатой в Евреям 10:5 «тело Ты приготовил Мне»
  choice: В основном тексте передать еврейское выражение как «уши Ты открыл мне», указав буквальный образ в примечании.
  alternative: «уши Ты выкопал мне»; по Септуагинте и Евреям 10:5 — «тело Ты приготовил Мне»
  rationale: Основной текст следует масоретскому еврейскому тексту и естественно передаёт его вероятный идиоматический смысл, не подменяя его греческой формой. Примечание сохраняет буквальный образ и канонически значимый вариант Септуагинты, не устраняя напряжения между текстовыми традициями.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Местоимение «Ты» написано с прописной буквы как уважительное обращение к Богу. Точка с запятой сохраняет трёхчастный параллелизм стиха.
