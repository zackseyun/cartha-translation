  text: אָ֣ז אָ֭מַרְתִּי הִנֵּה בָ֑אתִי בִּ/מְגִלַּת סֵ֝֗פֶר כָּת֥וּב עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/007.yaml
  text: Then I said[a], “Behold, I have come[b]; in the scroll of the book it is written about me.”
translation:
  language: ru
  text: 'Тогда я сказал: «Вот, я пришёл; в книжном свитке написано обо мне[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для меня»; возможно также: «мне предписано». Еврейское выражение может относиться как к написанному о говорящем, так и к установленному для него. Этот стих цитируется в Евр. 10:7 применительно к Мессии.'
    reason: alternative_reading_and_cross_reference
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временную и последовательную связь с предшествующим контекстом.
- source_word: אָמַרְתִּי
  choice: я сказал
  rationale: Прямое и естественное соответствие форме первого лица единственного числа от אמר.
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательно-эмфатическую силу частицы и звучит естественно в современном литературном русском.
- source_word: בָאתִי
  choice: я пришёл
  rationale: Совершенный вид выражает состоявшееся прибытие и самопредставление говорящего перед Богом.
- source_word: בִּמְגִלַּת סֵפֶר
  choice: в книжном свитке
  rationale: Передаёт образ свитка как письменного документа без тяжеловесного буквального выражения «в свитке книги».
- source_word: כָּתוּב
  choice: написано
  rationale: Безличная русская конструкция естественно передаёт предикативное пассивное причастие.
- source_word: עָלָי
  choice: обо мне
  rationale: Наиболее прямо передаёт значение «относительно меня, обо мне»; возможный смысл предписания говорящему сохранён в примечании.
theological_decisions:
- issue: Значение עָלָי в стихе, позднее процитированном в Евр. 10:7
  choice: обо мне
  alternative: для меня; предписано мне
  rationale: Основной текст сохраняет наиболее прямой смысл еврейского выражения и не вносит в перевод позднейшее христологическое применение. Реальная смысловая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. «Вот» предпочтено архаизирующему «се», а «книжный свиток» сохраняет древний образ письменного документа.
