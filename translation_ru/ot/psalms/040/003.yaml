base_translation:
  language: en
  yaml_path: translation/ot/psalms/040/003.yaml
  text: He put a new song in my mouth[a], a song of praise to our God. Many will see and fear[c][b], and will trust in Yahweh.
translation:
  language: ru
  text: Он вложил мне в уста новую песнь — песнь хвалы нашему Богу. Многие увидят, убоятся[a] и станут уповать на Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проникнутся благоговейным трепетом». Еврейский глагол может обозначать страх, благоговение или трепет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּפִי
  choice: вложил мне в уста
  rationale: Сочетание сохраняет конкретный образ песни, помещённой Богом в уста псалмопевца, и естественно звучит по-русски.
- source_word: שִׁיר חָדָשׁ
  choice: новую песнь
  rationale: Прямой и традиционно понятный перевод, обозначающий новую хвалебную песнь, вызванную Божьим избавлением.
- source_word: תְּהִלָּה לֵאלֹהֵינוּ
  choice: песнь хвалы нашему Богу
  rationale: Фраза стоит в приложении к «новой песни» и поясняет её характер; повтор слова «песнь» делает эту связь ясной и естественной в русском тексте.
- source_word: יִרְאוּ רַבִּים
  choice: Многие увидят это
  rationale: Местоимение «это» естественно передаёт подразумеваемый объект — совершённое Богом и выраженное в песне, — не меняя смысла еврейской фразы.
- source_word: וְיִירָאוּ
  choice: убоятся
  rationale: Глагол сохраняет напряжение между страхом и благоговением и поддерживает краткую последовательность реакций; возможный оттенок благоговейного трепета вынесен в примечание.
- source_word: וְיִבְטְחוּ בַּיהוָה
  choice: станут уповать на Яхве
  rationale: «Уповать на» точно и естественно передаёт доверие и надежду, направленные на Бога; личное имя יהוה передано как «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога, поэтому оно передано непосредственно, а не заменено титулом.
- issue: Смысл וְיִירָאוּ как реакции на Божье деяние
  choice: убоятся
  alternative: проникнутся благоговейным трепетом
  rationale: Основной вариант не смягчает значение до одного лишь восхищения и сохраняет присущую еврейскому глаголу смысловую широту между страхом и благоговением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической лексикой. «Уста», «песнь», «убоятся» и «уповать» придают тексту достоинство, оставаясь понятными современному читателю; синтаксис прост и прозрачен.
