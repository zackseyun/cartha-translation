  text: Я терпеливо ждал Яхве[a], и Он склонился ко мне и услышал мой крик о помощи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ожидая, я ожидал Яхве» — усиленное выражение, означающее настойчивое, терпеливое ожидание; глагол может также включать оттенок надежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַוֺּה קִוִּיתִי
  choice: Я твёрдо надеялся
  rationale: Инфинитив абсолютный в сочетании с личной формой глагола קוה усиливает действие. Глагол выражает не только ожидание, но и надежду; «твёрдо надеялся» естественно передаёт настойчивое, исполненное упования ожидание, не сводя смысл лишь к терпению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: וַיֵּט אֵלַי
  choice: и Он склонился ко мне
  rationale: נטה означает «наклоняться, склоняться, обращаться в сторону». Выражение сохраняет образ Бога, который обращает внимание на молящегося; «склонился ко мне» звучит естественно и возвышенно.
- source_word: וַיִּשְׁמַע
  choice: и услышал
  rationale: В контексте мольбы שׁמע подразумевает внимательное слышание, однако «услышал» достаточно ясно передаёт это без добавления явного результата, которого глагол сам по себе не формулирует.
- source_word: שַׁוְעָתִי
  choice: мой крик о помощи
  rationale: שַׁוְעָה обозначает крик бедствующего, обращённый за помощью; перевод раскрывает целевую направленность крика.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон — личное имя Бога. «Яхве» сохраняет различие между именем и титулом и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Значение усиленной конструкции קַוֺּה קִוִּיתִי
  choice: твёрдо надеялся
  alternative: терпеливо ждал; с надеждой ждал
  rationale: Корень קוה допускает оттенки ожидания и надежды, а грамматическая конструкция усиливает действие. Основной перевод отражает упование, а сноска сохраняет возможный оттенок продолжительного терпеливого ожидания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавное «Он» употреблено как традиционная русская форма почтительного указания на Бога. Образ «склонился ко мне» сохранён, поскольку он понятен и передаёт движение исходного глагола.
