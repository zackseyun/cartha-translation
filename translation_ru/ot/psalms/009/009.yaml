source:
  edition: WLC
  text: וִ֘/יהִ֤י יְהוָ֣ה מִשְׂגָּ֣ב לַ/דָּ֑ךְ מִ֝שְׂגָּ֗ב לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/009.yaml
  text: And Yahweh will be a stronghold for the oppressed[b][a], a stronghold in times of trouble.
translation:
  language: ru
  text: И будет[a] Яхве неприступным убежищем[b] для угнетённого[c], неприступным убежищем во времена бедствия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Да будет». Еврейская форма допускает как утверждение, так и пожелание.'
    reason: textual_ambiguity
  - marker: b
    text: 'Или: «крепостью», «убежищем на высоте». Еврейское слово обозначает безопасное, неприступное место защиты.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «для сокрушённого», «для попранного».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי
  choice: И будет
  rationale: Форма допускает волитивное понимание, однако в данном хвалебном контексте естественно звучит как утверждение о том, кем Яхве является для угнетённого. Возможная передача как пожелания сохранена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: מִשְׂגָּב
  choice: неприступное убежище
  rationale: Слово обозначает безопасное, возвышенное и потому недоступное для врага место. Сочетание передаёт и защиту, и оттенок неприступности; повтор сохранён.
- source_word: לַדָּךְ
  choice: для угнетённого
  rationale: דָּךְ обозначает придавленного, сокрушённого или попранного человека. «Угнетённый» естественно передаёт состояние человека, терпящего притеснение, не сводя смысл только к бедности.
- source_word: לְעִתּוֹת
  choice: во времена
  rationale: Предлог לְ при форме множественного числа имеет здесь временное значение и указывает на повторяющиеся или наступающие периоды.
- source_word: בַּצָּרָה
  choice: бедствия
  rationale: צָרָה означает беду, тесноту, тяжёлое положение или скорбь; «бедствие» сохраняет серьёзность контекста и естественно сочетается с «во времена».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Модальность וִיהִי
  choice: декларативное «И будет»
  alternative: волитивное «Да будет»
  rationale: Форма может быть понята как юссив, но контекст стихов 8–10 поддерживает утверждение о неизменном правлении и защите Яхве. Неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Повтор ключевого образа сохранён. «Неприступное убежище» выбрано вместо более архаичной «твердыни» ради ясности без утраты образа защищённого высокого места.
