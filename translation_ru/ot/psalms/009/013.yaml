  text: חָֽנְנֵ֬/נִי יְהוָ֗ה רְאֵ֣ה עָ֭נְיִ/י מִ/שֹּׂנְאָ֑/י מְ֝רוֹמְמִ֗/י מִ/שַּׁ֥עֲרֵי מָֽוֶת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/013.yaml
  text: Be gracious to me[a], O Yahweh; see my affliction from those who hate me[b], you who lift me up from the gates of death.
translation:
  language: ru
  text: Будь милостив ко мне[a], Яхве! Взгляни на моё страдание от рук тех, кто ненавидит меня, — Ты, поднимающий меня от врат смерти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Помилуй меня».'
    reason: lexical_alternative
  - marker: b
    text: «Врата смерти» — еврейский образ близости смерти или пребывания под её властью.
    reason: cultural_note
lexical_decisions:
- source_word: חָנְנֵנִי
  choice: Будь милостив ко мне
  rationale: Императив חנן с суффиксом 1-го лица выражает просьбу о благосклонности и милости. Такой перевод близок к форме оригинала; «помилуй меня» дано как допустимая альтернатива.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: רְאֵה
  choice: Взгляни
  rationale: Императив ראה здесь является молитвенным призывом обратить внимание на бедствие; «взгляни» естественно звучит по-русски и сохраняет прямоту обращения.
- source_word: עָנְיִי
  choice: страдание моё
  rationale: Слово обозначает бедствие, угнетённое состояние или страдание. Выбранная формулировка не сужает смысл до одного лишь физического либо душевного переживания.
- source_word: מִשֹּׂנְאַי
  choice: от тех, кто ненавидит меня
  rationale: Предлог מִן естественно связывается со страданием как указание на его источник. Развёрнутая русская конструкция ясно передаёт причастное значение «ненавидящие меня».
- source_word: מְרוֹמְמִי
  choice: Ты, поднимающий меня
  rationale: Причастие породы polel от רום с суффиксом 1-го лица употреблено как обращённое к Яхве наименование. Формулировка сохраняет причастную форму и образ избавления.
- source_word: מִשַּׁעֲרֵי מָוֶת
  choice: от врат смерти
  rationale: Сохранён буквальный образ порога или власти смерти; понятие шеола в текст не добавляется.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Синтаксическая связь מִשֹּׂנְאַי
  choice: 'Связать со «страданием»: «страдание… от тех, кто ненавидит меня»'
  alternative: 'Понимать менее тесно: «взгляни на моё страдание; [взгляни на] ненавидящих меня»'
  rationale: Связь с существительным עָנְיִי наиболее естественна по последовательности слов и не требует подразумевать второй императив.
- issue: Функция מְרוֹמְמִי
  choice: 'Сохранить как обращение-приложение: «Ты, поднимающий меня»'
  alternative: 'Передать отдельным утверждением: «Ты поднимаешь меня»'
  rationale: Причастная форма непосредственно характеризует Яхве как избавителя и сохраняет напряжение между нынешним страданием молящегося и Божьим спасением.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Инверсия «страдание моё» и слово «врата» поддерживают возвышенный регистр, оставаясь понятными; тире делает причастное обращение к Яхве синтаксически яснее.
