id: PSA.9.1
reference: Psalms 9:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אוֹדֶ֣ה יְ֭הוָה בְּ/כָל לִבִּ֑/י אֲ֝סַפְּרָ֗ה כָּל נִפְלְאוֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/001.yaml
  text: I will give thanks to Yahweh with all my heart[a]; I will recount all your wondrous deeds.
translation:
  language: ru
  text: Буду благодарить Яхве всем сердцем; расскажу обо всех твоих чудесах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о всех твоих дивных делах».'
    reason: Еврейское נִפְלְאוֹתֶיךָ может обозначать как «чудеса», так и «дивные дела» Бога.
lexical_decisions:
- source_word: אוֹדֶה
  choice: буду благодарить
  rationale: Форма глагола ידה в данном контексте выражает благодарение или хвалу, обращённую к Богу. «Буду благодарить» естественно передаёт оттенок признательности, не исключая богослужебной хвалы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּכָל לִבִּי
  choice: всем сердцем
  rationale: Естественный русский эквивалент еврейской идиомы, обозначающей всецелую внутреннюю преданность.
- source_word: אֲסַפְּרָה
  choice: расскажу
  rationale: Глагол ספר здесь означает повествовать, перечислять или возвещать совершённые Богом дела. «Расскажу» ясно и естественно передаёт этот смысл.
- source_word: כָּל
  choice: всем / всех
  rationale: 'Значение полноты сохранено в обеих частях стиха: «всем сердцем» и «обо всех… чудесах».'
- source_word: נִפְלְאוֹתֶיךָ
  choice: твои чудеса
  rationale: Слово обозначает необычайные, вызывающие изумление деяния, особенно Божьи вмешательства. «Чудеса» сохраняет ёмкость исходного выражения; возможный деятельный оттенок отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение אוֹדֶה
  choice: буду благодарить
  alternative: буду славить
  rationale: Еврейский глагол допускает как благодарение, так и хвалу. В основном тексте выбран оттенок благодарения, но семантическая связь с хвалой не отрицается.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим строем. Личное имя передано как «Яхве»; местоимение «твоих» написано со строчной буквы по обычной современной орфографической практике. Маркер сноски поставлен при слове, к которому относится лексическая альтернатива.
