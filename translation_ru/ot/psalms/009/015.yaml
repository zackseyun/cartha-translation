lexical_decisions:
- source_word: טָבְעוּ
  choice: погрузились
  rationale: Глагол טבע в породе qal описывает погружение или утопание. «Погрузились» сохраняет образ и не добавляет отсутствующего в тексте указания на воду.
- source_word: גּוֹיִם
  choice: народы
  rationale: Обычное значение גוים; в данном контексте речь идёт о народах как о собирательной группе.
- source_word: בְּשַׁחַת
  choice: в яму
  rationale: שחת обозначает яму, в том числе приготовленную как ловушку. Предлог ב передан естественным русским сочетанием с глаголом движения.
- source_word: עָשׂוּ
  choice: сами сделали
  rationale: עָשָׂה — общий глагол «делать». Частица «сами» естественно подчёркивает заложенную в параллелизме иронию, не меняя участников действия.
- source_word: בְּרֶשֶׁת
  choice: в сети
  rationale: רשת означает сеть; предложное сочетание сохраняет конкретный образ ловушки и соответствует последующему пассивному результату.
- source_word: זוּ
  choice: которую
  rationale: זוּ здесь выступает относительной частицей; русское «которую» прямо передаёт её синтаксическую функцию.
- source_word: טָמָנוּ
  choice: они спрятали
  rationale: טמן означает прятать или скрывать, нередко тайно устанавливая ловушку. «Спрятали» сохраняет это значение без уточнения способа.
- source_word: נִלְכְּדָה
  choice: попалась
  rationale: Нифаль глагола לכד выражает попадание в ловушку или плен. «Попалась» естественно сочетается с сетью и сохраняет результативно-пассивный смысл.
- source_word: רַגְלָם
  choice: их нога
  rationale: В еврейском тексте стоит единственное число «их нога» при множественном субъекте; оно сохранено как собирательный образ.
