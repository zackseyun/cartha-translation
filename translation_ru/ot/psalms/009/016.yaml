base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/016.yaml
  text: Yahweh has made himself known[a]; he has executed judgment. The wicked is snared by the work of his own hands. Higgaion[b]. Selah
translation:
  language: ru
  text: Яхве явил Себя[a] — Он совершил суд. Нечестивый пойман делом собственных рук. Хиггайон[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве познан»; возможно также: «Яхве стал известен». Еврейскую форму נודע можно понимать как обозначение состояния («познан, известен») либо результата действия («явил Себя, стал известен»).'
    reason: alternative_reading
  - marker: b
    text: '«Хиггайон» — вероятно, музыкальный или литургический термин; точное значение неизвестно. Возможные значения: «размышление» или указание на звучание музыки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹדַע
  choice: явил Себя
  rationale: Нифаль от ידע допускает пассивно-стативное «стал известен / познан» и результативно-рефлексивное «явил Себя». В контексте Яхве становится познаваем через совершённый Им суд; выбранный вариант естественен по-русски, а подлинная неоднозначность отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста и не заменяет её титулом «Господь».
- source_word: מִשְׁפָּט עָשָׂה
  choice: совершил суд
  rationale: Сочетание обозначает осуществление судебного решения или правосудия. «Совершил суд» сохраняет судебный смысл и достоинство поэтической речи.
- source_word: בְּפֹעַל כַּפָּיו
  choice: созданную собственными руками
  rationale: Фраза указывает, что причиной и средством гибели нечестивого становится дело его же рук. Такая формулировка сохраняет образ рук и естественно связывает его с метафорой ловушки.
- source_word: נוֹקֵשׁ
  choice: попался в ловушку
  rationale: Глагол передаёт попадание в силки или западню. Русское выражение сохраняет метафору и понятно современному читателю.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное в единственном числе передано собирательно-представительным обозначением человека, поступающего нечестиво.
- source_word: הִגָּיוֹן
  choice: Хиггайон
  rationale: Точное значение термина не установлено; вероятнее всего, это музыкально-литургическое указание. Транслитерация не создаёт ложной определённости, а возможные значения приведены в сноске.
- source_word: סֶלָה
  choice: Села
  rationale: Неясный музыкальный или литургический термин традиционно оставлен без перевода.
theological_decisions:
- issue: Самооткровение Бога через суд
  choice: Яхве являет Себя в совершённом Им суде, без дальнейшего догматического развёртывания мысли.
  alternative: «Яхве познан» или «Яхве стал известен» как утверждение о результате суда.
  rationale: Синтаксическое соседство связывает познание Яхве с Его судебным действием, но еврейская форма נודע не требует выбирать исключительно между общим состоянием известности и проявлением Себя в данном событии; альтернативу сохраняет сноска.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Краткие параллельные высказывания сохранены; архаические обороты вроде «делами рук своих» не использованы. Имена и неясные литургические термины переданы транслитерацией.
