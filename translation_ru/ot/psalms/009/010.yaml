  text: וְ/יִבְטְח֣וּ בְ֭/ךָ יוֹדְעֵ֣י שְׁמֶ֑/ךָ כִּ֤י לֹֽא עָזַ֖בְתָּ דֹרְשֶׁ֣י/ךָ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/010.yaml
  text: And those who know your name will trust in you[a], for you, O Yahweh[c][b], have not forsaken those who seek you.
translation:
  language: ru
  text: И будут уповать на Тебя знающие имя Твоё[a], ибо Ты, Яхве[c], не оставил[b] ищущих Тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Имя» здесь означает не только само имя, но и открытые Богом характер и репутацию.
    reason: cultural_note
  - marker: b
    text: 'Или: «не покинул».'
    reason: lexical_alternative
  - marker: c
    text: 'Евр. YHWH — личное имя Бога; традиционно переводится: «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִבְטְחוּ בְךָ
  choice: И будут уповать на Тебя
  rationale: Qal imperfect выражает ожидаемое или характерное доверие; «уповать на» естественно для возвышенной русской поэзии и передаёт уверенное полагание на Бога.
- source_word: יֹדְעֵי שְׁמֶךָ
  choice: знающие имя Твоё
  rationale: Причастная конструкция обозначает людей, которых характеризует знание Божьего имени; буквальный образ сохранён вместе с его смысловой глубиной.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание упования и ясно передаёт причинную связь.
- source_word: לֹא עָזַבְתָּ
  choice: Ты не оставляешь
  rationale: Перфект утверждает подтверждённую опытом верность Бога; русское настоящее обобщённого значения естественно выражает устойчивую истину, не ограничивая её прошлым.
- source_word: דֹרְשֶׁיךָ
  choice: ищущих Тебя
  rationale: В отношении Бога דרש означает обращаться к Нему и стремиться к Нему; «искать» сохраняет ёмкость исходного выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, представленное тетраграмматоном, без замены его титулом.
theological_decisions:
- issue: Смысл выражения «знающие имя Твоё»
  choice: Сохранить буквальную формулировку с пояснением
  alternative: Развернуть как «знающие, каков Ты»
  rationale: «Имя» включает открытый Богом характер и репутацию, но буквальная формулировка сохраняет библейский образ и не сводит его к одному толкованию.
- issue: Передача יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное Божье имя; транслитерация сохраняет различие между именем и титулом.
- issue: Временное значение לֹא עָזַבְתָּ
  choice: не оставляешь
  alternative: не оставил
  rationale: Еврейский перфект допускает акцент на уже доказанной верности, имеющей силу сейчас; настоящее время по-русски естественно выражает постоянный характер этой верности.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. «Уповать» слегка возвышенно, но широко понятно и уместно в псалме; местоимения, обращённые к Богу, написаны с прописной буквы по устойчивой русской религиозной традиции.
