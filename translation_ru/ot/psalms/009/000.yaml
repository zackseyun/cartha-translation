  text: Руководителю хора. На мотив «Смерть сына».[a] Псалом Давида.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение עַלְמוּת לַבֵּן (в транслитерации «альмут лаббен») имеет неясный смысл. Вероятно, это музыкальное указание или название мелодии; традиционно его также оставляют без перевода как особое название.
