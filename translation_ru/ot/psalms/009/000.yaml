lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов форма с ל обычно служит указанием руководителю исполнения. Этот вариант естественен по-русски и сохраняет богослужебно-музыкальный смысл.
- source_word: עַלְמוּת לַבֵּן
  choice: На мотив «Смерть сына»
  rationale: Трудное выражение, вероятно, обозначает музыкальное указание или название мелодии. Слова «на мотив» ясно передают предполагаемую функцию, а кавычки отмечают название; неопределённость отражена в сноске.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Обычное жанровое обозначение в надписаниях, понятное современному русскому читателю.
- source_word: לְדָוִד
  choice: Давида
  rationale: Родительный оборот «Псалом Давида» сохраняет возможные значения авторства, принадлежности или связи с Давидом лучше, чем более однозначное «написанный Давидом».
