  text: זַמְּר֗וּ לַ֭/יהוָה יֹשֵׁ֣ב צִיּ֑וֹן הַגִּ֥ידוּ בָ֝/עַמִּ֗ים עֲלִֽילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/011.yaml
  text: Sing praises to Yahweh[a], who dwells in Zion; declare his deeds among the peoples.
translation:
  language: ru
  text: Пойте хвалу Яхве, живущему на Сионе[a]; возвещайте среди народов его деяния.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «восседающему на престоле на Сионе».'
    reason: Альтернативная передача יֹשֵׁב сохраняет возможный царский образ наряду со значением пребывания.
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Пойте хвалу
  rationale: Форма повелительного наклонения во множественном числе призывает к музыкальному прославлению; выражение естественно передаёт и пение, и хвалебную направленность.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно представленное тетраграмматоном יהוה.
- source_word: יֹשֵׁב צִיּוֹן
  choice: живущему на Сионе
  rationale: Причастие יֹשֵׁב допускает значение пребывания или восседания. Основной вариант ясно передаёт присутствие Бога на Сионе, не устраняя возможный царский оттенок, отмеченный в сноске.
- source_word: הַגִּידוּ
  choice: возвещайте
  rationale: Каузативная форма глагола נגד обозначает открытое сообщение или провозглашение; «возвещайте» соответствует поэтическому и публичному характеру призыва.
- source_word: בָעַמִּים
  choice: среди народов
  rationale: Предлог ב естественно передан как «среди», а множественное עַמִּים — как «народы», с сохранением собирательно-этнического смысла.
- source_word: עֲלִילוֹתָיו
  choice: его деяния
  rationale: Существительное обозначает совершённые действия или дела; «деяния» сохраняет краткость и возвышенный поэтический регистр без добавления отсутствующего в тексте определения «могучие».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя יהוה; форма «Яхве» передаёт его как имя, а не заменяет титулом.
- issue: Смысл יֹשֵׁב צִיּוֹן
  choice: живущему на Сионе
  alternative: восседающему на престоле на Сионе
  rationale: Еврейское причастие может указывать как на пребывание, так и на царское восседание. Основной текст не конкретизирует образ сверх необходимого, а возможный царский смысл сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Структура двух параллельных повелений сохранена; местоимение «его» дано со строчной буквы как грамматическое местоимение без введения конфессионально обусловленной орфографии.
