lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое значение кратко и естественно для современного русского языка.
- source_word: אֲסַפְּרָה
  choice: я возвещал
  rationale: Пиэль глагола ספר здесь означает рассказывать или провозглашать; «возвещал» уместно в контексте публичной хвалы.
- source_word: כָּל תְּהִלָּתֶיךָ
  choice: всю хвалу Тебе
  rationale: Русское собирательное единственное число естественно выражает совокупность хвалебных слов и славных деяний Бога, обозначенную еврейским множественным числом.
- source_word: בְּשַׁעֲרֵי בַת צִיּוֹן
  choice: у ворот дочери Сиона
  rationale: Предлог ב допускает значение места «у»; выражение «дочь Сиона» сохраняет поэтическое олицетворение Сиона и звучит привычно в русском библейском регистре.
- source_word: אָגִילָה
  choice: и радовался
  rationale: Глагол גיל обозначает ликование или радость; форма согласована с русским целевым придаточным, при этом действие остаётся волевым намерением псалмопевца.
- source_word: בִּישׁוּעָתֶךָ
  choice: дарованному Тобой спасению
  rationale: Суффикс второго лица указывает на спасение, исходящее от Бога. Такая формулировка естественнее буквального «Твоему спасению» и сохраняет широкий смысл ישועה.
theological_decisions:
- issue: Значение ישועה
  choice: спасение
  alternative: избавление
  rationale: Слово может обозначать конкретное избавление от опасности, но «спасение» сохраняет более широкий богословский смысл, не исключая непосредственного контекста избавления от врагов; альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранено традиционное олицетворение «дочь Сиона»; прописные местоимения по отношению к Богу поддерживают принятый русский библейский регистр.
