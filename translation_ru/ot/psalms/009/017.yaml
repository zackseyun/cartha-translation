  text: יָשׁ֣וּבוּ רְשָׁעִ֣ים לִ/שְׁא֑וֹלָ/ה כָּל גּ֝וֹיִ֗ם שְׁכֵחֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/017.yaml
  text: The wicked will return to Sheol—all the nations that forget God[a][b].
translation:
  language: ru
  text: Нечестивые возвратятся[a] в шеол[b] — все народы, забывающие Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратятся назад». Древнееврейский глагол может означать как «возвратиться», так и «обратиться назад».'
    reason: lexical_alternative
  - marker: b
    text: Шеол — древнееврейское обозначение мира мёртвых; по значению он не тождествен более позднему и более узкому понятию ада.
    reason: cultural_note
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: возвратятся
  rationale: Форма qal, имперфект 3-го лица множественного числа от שׁוב допускает значения «возвратиться» и «обратиться назад». Будущее время естественно передаёт форму в данном контексте, а «возвратятся» сохраняет образ движения к шеолу, не сводя его к отвлечённой гибели.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Субстантивированное прилагательное обозначает нравственно порочных людей. «Нечестивые» — краткий и устоявшийся русский эквивалент, подходящий для высокого, но понятного регистра псалма.
- source_word: לִשְׁאוֹלָה
  choice: в шеол
  rationale: Направительный суффикс и предлог выражают движение в шеол. Транслитерация сохраняет древнееврейское понятие мира мёртвых и не сужает его до могилы и не отождествляет с более поздним, специфическим понятием ада.
- source_word: כָּל גּוֹיִם
  choice: все народы
  rationale: גּוֹיִם означает «народы». Такое чтение передаёт обобщающее כָּל и не вносит отсутствующего в строке явного противопоставления Израиля и язычников.
- source_word: שְׁכֵחֵי אֱלֹהִים
  choice: забывающие Бога
  rationale: Причастие в сопряжённой конструкции характеризует названные народы. Русский причастный оборот сохраняет эту характеристическую, потенциально продолжающуюся направленность, не превращая её однозначно в единичное завершённое действие.
theological_decisions:
- issue: Значение שְׁאוֹל в контексте суда
  choice: Сохранить термин «шеол» и пояснить его в сноске.
  alternative: «могила», «мир мёртвых» или «ад»
  rationale: Хотя стих говорит об участи нечестивых, само древнееврейское слово не требует более позднего и узкого догматического значения «ад». Транслитерация сохраняет смысловую и богословскую напряжённость исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис сохраняет параллельное пояснение после тире; термин «шеол» оставлен без конфессионального переосмысления.
