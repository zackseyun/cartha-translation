base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/006.yaml
  text: The enemy has come to an end in everlasting ruins[a]; you have uprooted cities; the very memory of them has perished.
translation:
  language: ru
  text: Враг обращён в вечные руины; Ты искоренил города — исчезла сама память о них.[a]
  philosophy: optimal-equivalence
  footnotes:
