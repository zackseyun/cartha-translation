lexical_decisions:
- source_word: הָאוֹיֵב
  choice: враг
  rationale: Форма с артиклем естественно понимается как подлежащее «враг»; возможное обращение отражено в сноске.
- source_word: תַּמּוּ
  choice: погиб
  rationale: Глагол תמם выражает завершение и прекращение существования; в сочетании с «враг» русское «погиб» передаёт окончательность естественно и торжественно.
- source_word: חֳרָבוֹת לָנֶצַח
  choice: вечные руины остались от него
  rationale: Сочетание допускает синтаксическую неоднозначность. Этот перевод связывает вечные руины с окончательной гибелью врага и даёт ясную современную русскую фразу, не устраняя альтернативу, указанную в сноске.
- source_word: וְעָרִים
  choice: города
  rationale: Обычное значение עִיר; контекст не требует ослабленного «селения».
- source_word: נָתַשְׁתָּ
  choice: Ты искоренил
  rationale: נתשׁ обозначает вырывание, исторжение; «искоренил» сохраняет образ полного удаления и применимо к городам в возвышенной поэтической речи.
- source_word: אָבַד זִכְרָם הֵמָּה
  choice: исчезла сама память о них
  rationale: אָבַד передаёт исчезновение или гибель, а конечное הֵמָּה усиливает мысль; «сама память» естественно выражает это эмфатическое значение.
theological_decisions:
- issue: Синтаксическое понимание начальной части стиха
  choice: Высказывание об окончательной гибели врага
  alternative: 'Прямое обращение: «О враг! Разрушения окончились навеки»'
  rationale: Артикль при הָאוֹיֵב естественно позволяет понимать слово как подлежащее. Вместе с тем еврейская поэтическая конструкция допускает традиционное понимание как обращения, поэтому оно сохранено в сноске; решение является синтаксическим, а не вероучительным.
- issue: Референт местоименного суффикса в זִכְרָם
  choice: Память о разрушенных городах и связанных с ними врагах исчезла
  alternative: Память исключительно о городах либо исключительно о врагах
  rationale: Мужской множественный суффикс допускает соотнесение с городами, поскольку עָרִים грамматически мужского рода, однако поэтический контекст может охватывать и уничтоженных врагов. Русское «о них» сохраняет эту референциальную широту.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Синтаксис краткий и ритмичный; обращение к Богу отмечено прописной буквой по принятой русской библейской традиции. Неоднозначность начальной конструкции сохранена в сноске.
