  text: אֶשְׂמְחָ֣ה וְ/אֶעֶלְצָ֣ה בָ֑/ךְ אֲזַמְּרָ֖ה שִׁמְ/ךָ֣ עֶלְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/002.yaml
  text: I will rejoice and exult in you[a]; I will sing praise to your name[b], Most High.
translation:
  language: ru
  text: Буду радоваться и ликовать в Тебе; буду воспевать имя Твоё, Всевышний.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשְׂמְחָה
  choice: буду радоваться
  rationale: Глагол שׂמח выражает радость; форма первого лица передаёт намерение или устремлённость говорящего, естественно выражаемую по-русски будущим временем.
- source_word: וְאֶעֶלְצָה
  choice: и ликовать
  rationale: Глагол עלץ обозначает бурную, торжествующую радость. «Ликовать» сохраняет усиление по отношению к «радоваться» и соответствует возвышенному, но понятному регистру псалма.
- source_word: בָךְ
  choice: о Тебе
  rationale: Предлог ב здесь указывает на Того, в Ком сосредоточена радость. Русское «радоваться и ликовать о Тебе» сохраняет направленность чувств на Бога и звучит естественнее, чем буквальное «в Тебе» при обоих глаголах.
- source_word: אֲזַמְּרָה
  choice: буду воспевать
  rationale: Пиэль от זמר означает петь или возносить хвалу песней. «Воспевать» кратко передаёт и пение, и хвалебный характер действия.
- source_word: שִׁמְךָ
  choice: имя Твоё
  rationale: Сохранён исходный образ имени как обозначения явленной личности и славы Бога, без истолковывающего расширения.
- source_word: עֶלְיוֹן
  choice: Всевышний
  rationale: Обычный и естественный русский эквивалент божественного титула עֶלְיוֹן; в данном контексте это прямое обращение к Богу.
theological_decisions:
- issue: Передача божественного титула עֶלְיוֹן
  choice: Всевышний
  alternative: о Всевышний; Самый Высокий
  rationale: «Всевышний» сохраняет титул и его функцию прямого обращения, не добавляя толкования. Обращение ясно благодаря позиции в конце фразы и запятой.
- issue: Объект радости в выражении בָךְ
  choice: о Тебе
  alternative: в Тебе; из-за Тебя
  rationale: Выражение оставляет Бога центром и предметом радости. Причинное «из-за Тебя» было бы более узким истолкованием, а «в Тебе» в современной русской фразе с двумя глаголами звучит менее естественно.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической интонацией. Параллелизм и различие между «радоваться» и более сильным «ликовать» сохранены; архаические междометия и тяжеловесный синтаксис не использованы.
