  text: When my enemies turn back[a], they stumble and perish before you.
translation:
  language: ru
  text: Когда мои враги отступят, они споткнутся и погибнут перед Тобой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Твоего присутствия»; буквально: «от Твоего лица».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשׁוּב
  choice: когда ... отступают
  rationale: Сочетание ב с инфинитивом конструкта שׁוב вводит временное придаточное. «Когда… отступают» естественно передаёт и временное значение, и контекстуальный смысл движения назад.
- source_word: אוֹיְבַי
  choice: мои враги
  rationale: Существительное אויב с суффиксом первого лица единственного числа прямо означает «мои враги».
- source_word: אָחוֹר
  choice: отступают
  rationale: Наречное אָחוֹר уточняет שׁוב как движение назад; в русском языке это значение естественно выражается глаголом «отступают».
- source_word: יִכָּשְׁלוּ
  choice: они спотыкаются
  rationale: Форма нифаля от כשל обозначает, что враги спотыкаются или терпят крушение. «Спотыкаются» сохраняет образ и не предвосхищает усиление в следующем глаголе.
- source_word: וְיֹאבְדוּ
  choice: и гибнут
  rationale: Глагол אבד в породе каль означает «гибнуть, погибать». «Гибнут» соответствует поэтическому контексту и не уточняет сверх текста характер их уничтожения.
- source_word: מִפָּנֶיךָ
  choice: пред Тобой
  rationale: Буквально выражение означает «от Твоего лица / присутствия». «Пред Тобой» кратко и достойно передаёт пространственно-реляционное значение, сохраняя возможную причинную окраску в примечании.
theological_decisions:
- issue: Участие Бога в гибели врагов
  choice: Враги спотыкаются и гибнут пред Богом, без уточнения точного способа Его действия.
  alternative: Враги гибнут от Божьего присутствия или непосредственно уничтожаются Богом.
  rationale: Еврейский текст связывает их падение с Божьим лицом или присутствием, но не раскрывает механизм суда; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Форма «пред Тобой» выбрана как естественная для поэзии и обращения к Богу; прописная буква в местоимении поддерживает традиционный благоговейный регистр.
