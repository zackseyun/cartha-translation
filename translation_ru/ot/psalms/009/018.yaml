source:
  edition: WLC
  text: כִּ֤י לֹ֣א לָ֭/נֶצַח יִשָּׁכַ֣ח אֶבְי֑וֹן תִּקְוַ֥ת ענוים תֹּאבַ֥ד לָ/עַֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/018.yaml
  text: For the needy will not be forgotten forever[b][a]; the hope of the afflicted will not perish forever.
translation:
  language: ru
  text: Ибо не навек будет забыт нуждающийся; надежда угнетённых[a] не погибнет навсегда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смиренных»; также возможно: «кротких» (евр. ענוים).'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте употреблены два близких по смыслу выражения — «навек» и «навсегда», подчёркивающие, что нуждающиеся и угнетённые не будут оставлены окончательно.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет связующую и обосновывающую функцию частицы по отношению к предшествующей мольбе.
- source_word: לָנֶצַח
  choice: навек
  rationale: Передаёт длительное, окончательное забвение, которое здесь отрицается, и естественно звучит в поэтической речи.
- source_word: יִשָּׁכַח
  choice: будет забыт
  rationale: Пассивная форма сохраняет грамматику еврейского текста и не вводит явно названного субъекта действия.
- source_word: אֶבְיוֹן
  choice: нуждающийся
  rationale: Обозначает человека, испытывающего нужду; выбор не ограничивает смысл исключительно материальной бедностью.
- source_word: תִּקְוַת
  choice: надежда
  rationale: Естественно передаёт форму сопряжённого состояния в сочетании «надежда угнетённых».
- source_word: ענוים
  choice: угнетённых
  rationale: В параллели с «нуждающимся» на первый план выходит положение страдающих и униженных, при сохранении других возможных оттенков в сноске.
- source_word: תֹּאבַד
  choice: не погибнет
  rationale: Глагол означает «погибнуть, исчезнуть». Отрицание, выраженное в первом полустишии, по смыслу распространяется и на параллельное второе полустишие, поэтому по-русски оно восполнено явно.
- source_word: לָעַד
  choice: навсегда
  rationale: Передаёт близкое по смыслу к לָנֶצַח временное выражение, сохраняя при этом небольшое лексическое варьирование двух полустиший.
theological_decisions:
- issue: Кто подразумевается в пассивной конструкции «будет забыт»
  choice: Сохранена пассивная конструкция без прямого называния Бога.
  alternative: «Бог не забудет нуждающегося навек».
  rationale: Контекст подразумевает Божью память и заботу, однако еврейский текст не называет деятеля прямо; пассивная конструкция сохраняет эту особенность.
- issue: Смысл ענוים
  choice: «угнетённых»
  alternative: «смиренных» или «кротких».
  rationale: Слово допускает как социальный оттенок страдания и унижения, так и нравственный оттенок смирения. Параллелизм с אֶבְיוֹן поддерживает основной перевод «угнетённых», а неоднозначность отмечена в сноске.
- issue: Отрицание во втором полустишии
  choice: 'По-русски отрицание выражено явно: «не погибнет».'
  alternative: Формально оставить глагол без отрицательной частицы, полагаясь на эллиптический параллелизм.
  rationale: В еврейской поэзии отрицание первого полустишия по смыслу распространяется на второе. Явное «не» необходимо для ясного и верного русского выражения этой синтаксической связи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сингулярное «нуждающийся» сохраняет собирательную форму первого полустишия; «угнетённых» естественно отражает множественное число второго. Пара «навек / навсегда» воспроизводит смысловой параллелизм без тяжеловесного буквального повтора.
