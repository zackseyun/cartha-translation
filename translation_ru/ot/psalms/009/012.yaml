source:
  edition: WLC
  text: כִּֽי דֹרֵ֣שׁ דָּ֭מִים אוֹתָ֣/ם זָכָ֑ר לֹֽא שָׁ֝כַ֗ח צַעֲקַ֥ת עניים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/012.yaml
  text: For the one who avenges bloodshed remembers them[a]; he does not forget the cry of the afflicted.
translation:
  language: ru
  text: Ибо Тот, Кто взыскивает за пролитую кровь, помнит о них; Он не забывает вопля страдающих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедных». Еврейское слово может обозначать бедных, страдающих, смиренных или угнетённых; в данном контексте речь шире — о людях, терпящих бедствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предыдущего утверждения; «ибо» сохраняет пояснительную связь и соответствует возвышенному, но понятному регистру псалма.
- source_word: דֹרֵשׁ דָּמִים
  choice: Тот, Кто взыскивает за пролитую кровь
  rationale: Оборот означает, что Бог расследует кровопролитие и требует за него ответа. «Взыскивает за пролитую кровь» передаёт судебный смысл, не смешивая этот образ с особой правовой ролью кровного мстителя.
- source_word: אוֹתָם
  choice: о них
  rationale: Сохранено множественное число масоретской традиции; местоимение относится к страдающим как к группе.
- source_word: זָכָר
  choice: помнит
  rationale: Хотя в еврейском употреблена перфектная форма, в поэтическом параллелизме она выражает постоянное, характерное действие Бога.
- source_word: לֹא שָׁכַח
  choice: не забывает
  rationale: Настоящее время естественно передаёт продолжающуюся истину и поддерживает параллелизм с «помнит».
- source_word: צַעֲקַת
  choice: вопля
  rationale: «Вопль» непосредственно передаёт громкий призыв о помощи в бедствии и уместен в поэтическом регистре.
- source_word: עניים
  choice: страдающих
  rationale: Слово может обозначать бедных, угнетённых, смиренных или терпящих бедствие. Контекст кровопролития и суда делает «страдающих» наиболее широким и уместным вариантом.
theological_decisions:
- issue: Божественное правосудие в выражении דֹרֵשׁ דָּמִים
  choice: Бог требует ответа за неправедно пролитую кровь.
  alternative: Бог лишь замечает кровопролитие или буквально ищет крови.
  rationale: Еврейский оборот выражает судебное взыскание за кровопролитие. Перевод сохраняет образ Божьего воздаяния, не приписывая Ему жажду крови и не вводя прямо не названную техническую роль кровного мстителя.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Конструкция «Тот, Кто» сохраняет субстантивированный образ еврейского причастия; прописные буквы указывают на Бога как на подразумеваемого деятеля. Маркер сноски поставлен непосредственно после слова, к которому относится лексическая альтернатива.
