  text: כִּֽי עָ֭שִׂיתָ מִשְׁפָּטִ֣/י וְ/דִינִ֑/י יָשַׁ֥בְתָּ לְ֝/כִסֵּ֗א שׁוֹפֵ֥ט צֶֽדֶק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/004.yaml
  text: For you have upheld my justice and my cause[a]; you sat on the throne[b], judging righteously.
translation:
  language: ru
  text: Ибо Ты отстоял моё право и мою тяжбу[a]; Ты воссел на престоле, судя по правде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершил мой суд и мою тяжбу»; «отстоял моё право и моё дело». В еврейском тексте употреблены два близких юридических термина, обозначающих право и судебную тяжбу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «судя праведно» или «судя справедливо». Буквально: «судя в праведности»; существительное «праведность» характеризует судейское действие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующей хвалы; «ибо» ясно сохраняет причинную связь и соответствует возвышенному, но современному регистру псалма.
- source_word: עָשִׂיתָ
  choice: защитил
  rationale: Буквально глагол означает «сделал/совершил», но в сочетании с двумя юридическими существительными передаёт осуществление или отстаивание права; «защитил» естественно выражает оправдательный судебный смысл.
- source_word: מִשְׁפָּטִי
  choice: моё право
  rationale: В данном контексте מִשְׁפָּט обозначает законное право или справедливое притязание псалмопевца, подтверждённое Божьим судом.
- source_word: וְדִינִי
  choice: моё дело
  rationale: דִּין здесь относится к судебному делу или тяжбе; «дело» сохраняет юридическую образность и отличается от «права».
- source_word: יָשַׁבְתָּ
  choice: Ты воссел
  rationale: Совершенный вид изображает занятие царско-судейского места; «воссел» кратко и естественно передаёт торжественную сцену престола.
- source_word: לְכִסֵּא
  choice: на престоле
  rationale: Предлог с существительным обозначает пребывание или занятие места на престоле в контексте царского суда.
- source_word: שׁוֹפֵט
  choice: как Судья
  rationale: Причастие характеризует Бога в роли судьи. Русская конструкция «как Судья» естественно передаёт эту функцию при глаголе «воссел».
- source_word: צֶדֶק
  choice: праведный
  rationale: Существительное «праведность» употреблено обстоятельственно или характеризует судейство. При передаче שׁוֹפֵט как «Судья» прилагательное «праведный» сохраняет и нравственный, и судебный оттенки.
theological_decisions:
- issue: Образ Бога как небесного Судьи
  choice: Бог представлен восседающим на престоле праведным Судьёй, который защищает законное право и судебное дело псалмопевца.
  alternative: Обобщённое утверждение, что Бог просто вступился за псалмопевца.
  rationale: Парные юридические термины מִשְׁפָּט и דִּין, а также слова о престоле и судье требуют сохранить явную судебную образность, не добавляя позднейших доктринальных категорий.
- issue: Синтаксическая функция צֶדֶק
  choice: 'Передано как характеристика Судьи: «Судья праведный».'
  alternative: 'Передать наречием: «судящий праведно» или «судящий справедливо».'
  rationale: Еврейское существительное может функционировать обстоятельственно — буквально «судящий [в] праведности». Русская формулировка сохраняет смысл, а сноска отмечает подлинную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Судебная лексика сохранена явно; архаизмы сведены к понятному и уместному «воссел». Все сноски отмечены в основном тексте.
