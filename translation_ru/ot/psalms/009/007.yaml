  text: But Yahweh sits enthroned forever[b][a]; he has established his throne for judgment.
translation:
  language: ru
  text: Но Яхве восседает вовеки[a]; Он утвердил Свой престол для суда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сидит»; в контексте престола этот глагол передаёт образ царственного восседания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Он приготовил Свой престол для правосудия».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיהוָה
  choice: Но Яхве
  rationale: Союз ו передан противительным «но», поскольку вечное царствование Яхве противопоставлено гибели нечестивых в предыдущем стихе; личное имя יהוה транслитерировано как «Яхве».
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Передаёт неограниченную длительность и соответствует возвышенному, но понятному регистру псалма.
- source_word: יֵשֵׁב
  choice: царствует
  rationale: Буквально глагол означает «сидит», однако упоминание престола и суда придаёт образу царский смысл; «царствует» естественно выражает его по-русски, а буквальный вариант сохранён в примечании.
- source_word: כּוֹנֵן
  choice: утвердил
  rationale: Форма глагола передаёт приведение в прочное, установленное состояние; «утвердил» сохраняет совершенный вид и идею незыблемости.
- source_word: לַמִּשְׁפָּט
  choice: для суда
  rationale: מִשְׁפָּט здесь обозначает судебное действие Бога; возможное смысловое ударение на справедливости отмечено в примечании.
- source_word: כִּסְאוֹ
  choice: Свой престол
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит престол с подлежащим «Он»; прописная буква соответствует принятому благоговейному оформлению местоимений о Боге.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Царский оттенок יֵשֵׁב
  choice: царствует
  alternative: сидит; восседает
  rationale: Контекст престола и суда ясно создаёт царско-судебный образ. Основной текст передаёт его естественным русским глаголом, а буквальность исходного выражения открыто отмечена в сноске.
- issue: Значение מִשְׁפָּט
  choice: суд
  alternative: справедливость; правосудие
  rationale: «Суд» сохраняет конкретный юридический образ престола, не исключая присущей Божьему суду справедливости.
translation_notes:
  register: Современный литературный русский с возвышенной псалмовой интонацией. «Вовеки» сохраняет торжественность без архаической синтаксической тяжеловесности; параллельные части стиха разделены точкой с запятой.
