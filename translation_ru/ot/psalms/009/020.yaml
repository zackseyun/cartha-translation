  text: שִׁ֘יתָ֤/ה יְהוָ֨ה מוֹרָ֗ה לָ֫/הֶ֥ם יֵדְע֥וּ גוֹיִ֑ם אֱנ֖וֹשׁ הֵ֣מָּה סֶּֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/020.yaml
  text: Put fear in them, O LORD; let the nations know that they are only man. Selah
translation:
  language: ru
  text: Наведи на них страх, Господи; пусть народы узнают, что они — всего лишь люди. Села.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיתָה
  choice: Наведи
  rationale: Императив от שׁית означает «положи, установи, наведи»; в сочетании со «страхом» естественно по-русски «наведи».
- source_word: מוֹרָה
  choice: страх
  rationale: В данном контексте слово понимается как «страх, ужас»; сохраняется прямое прошение псалмопевца.
- source_word: יְהוָה
  choice: Господи
  rationale: Тетраграмматон передан традиционным русским литургико-литературным соответствием «Господь», в звательном употреблении — «Господи».
- source_word: אֱנוֹשׁ
  choice: всего лишь люди
  rationale: אֱנוֹשׁ подчеркивает человеческую слабость и смертность; частица «всего лишь» передает противопоставление человеческого статуса народов Богу.
- source_word: סֶּלָה
  choice: Села
  rationale: Неясный богослужебно-музыкальный термин сохранен транслитерацией, без догматического истолкования.
theological_decisions:
- issue: Смысл אֱנוֹשׁ в утверждении о народах
  choice: что они — всего лишь люди
  alternative: что они смертны
  rationale: Еврейское слово может подчеркивать бренность и слабость человека, но прямо называет человека; выбранный вариант сохраняет образ и смысловое противопоставление, не сужая его до одной смертности.
- issue: Объект страха
  choice: Наведи на них страх
  alternative: Поставь им наставника / законодателя
  rationale: Контекст суда над народами и наиболее вероятное чтение מוֹרָה поддерживают значение «страх»; менее вероятная традиционная вокализация/интерпретация как «учитель, законодатель» не внесена в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Синтаксис краткий и параллельный еврейскому оригиналу; тире усиливает ограничительное значение выражения «всего лишь люди».
