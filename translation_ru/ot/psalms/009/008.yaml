  - marker: b
    text: 'Или: «по правоте», «с полной честностью»; глагол может также подразумевать осуществление правления через суд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: И Он
  rationale: Союз продолжает предшествующую мысль, а самостоятельное местоимение слегка подчёркивает действующее лицо; русское «И Он» передаёт оба оттенка без излишнего усиления.
- source_word: יִשְׁפֹּט
  choice: будет судить
  rationale: Глагол שׁפט обозначает судебное разбирательство и осуществление справедливого правления. Будущее время естественно передаёт поэтическую форму yiqtol в данном контексте.
- source_word: תֵּבֵל
  choice: мир
  rationale: Слово обозначает мир как обитаемую землю и совокупность её жителей; «мир» кратко и естественно передаёт универсальный охват.
- source_word: בְּצֶדֶק
  choice: по правде
  rationale: Предлог с существительным указывает на норму и характер суда. Выражение «по правде» сохраняет предметность еврейского существительного, звучит достойно и ясно и не сводит смысл лишь к юридической корректности.
- source_word: יָדִין
  choice: будет судить
  rationale: דין здесь означает вершить суд или осуществлять судебное правление. Повтор «будет судить» сохраняет смысловой параллелизм еврейской поэзии и не подменяет судебный оттенок общим «править».
- source_word: לְאֻמִּים
  choice: народы
  rationale: לאמים обозначает народы или этнические общности во множественном числе; «народы» не предполагает современных национальных государств.
- source_word: בְּמֵישָׁרִים
  choice: по справедливости
  rationale: Множественная форма מישרים выражает прямоту, правоту и беспристрастную справедливость. Русское выражение ясно передаёт справедливый характер суда, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Божий суд над всем человечеством
  choice: Стих говорит о всеобщем Божьем суде как праведном и беспристрастном, не уточняя его место в эсхатологической последовательности.
  alternative: Понимать формы только как описание постоянного правления Бога либо исключительно как указание на последний суд.
  rationale: Поэтические формы yiqtol могут обозначать будущее или характерное действие. Русское будущее время соответствует контексту, но само по себе не навязывает подробной догматической схемы.
- issue: Соотношение суда и правления в יָדִין
  choice: 'Сохранить судебное значение: «будет судить».'
  alternative: «Будет править народами» или «будет управлять народами».
  rationale: В древнееврейском судебная и властная функции пересекаются, однако непосредственный параллелизм с יִשְׁפֹּט поддерживает явное судебное прочтение; возможный оттенок правления указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллельное повторение «будет судить» намеренно сохраняет структуру древнееврейского стиха; точка с запятой разделяет два поэтических полустишия.
