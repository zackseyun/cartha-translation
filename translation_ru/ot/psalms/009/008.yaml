  text: And he will judge the world in righteousness[b][a]; he will govern the peoples with fairness.
translation:
  language: ru
  text: И Он будет судить мир[a] по справедливости; будет судить народы беспристрастно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обитаемый мир».'
