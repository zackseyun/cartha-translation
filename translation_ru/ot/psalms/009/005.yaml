  text: Ты обличил народы, погубил нечестивых[a], стёр их имя[b] навеки и навсегда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечестивца»; еврейское слово стоит в единственном числе, но может иметь собирательное значение.'
