lexical_decisions:
- source_word: גָּעַרְתָּ
  choice: обличил
  rationale: Глагол обозначает властное, действенное порицание. «Обличил» сохраняет прямое действие и возвышенный, но понятный современному читателю регистр.
- source_word: גּוֹיִם
  choice: народы
  rationale: В контексте суда речь идёт о народах как коллективных общностях; перевод «язычники» внёс бы не выраженное здесь религиозное противопоставление.
- source_word: אִבַּדְתָּ
  choice: погубил
  rationale: Интенсивная порода глагола выражает причинение гибели. «Погубил» естественно передаёт силу действия и соответствует поэтическому регистру псалма.
- source_word: רָשָׁע
  choice: нечестивых
  rationale: Хотя в еврейском стоит единственное число, слово допускает собирательное или родовое значение; множественное число по-русски естественно согласуется с последующим «их имя».
- source_word: שְׁמָם
  choice: их имя
  rationale: Сохранён буквальный образ «имени», которое в контексте может означать также память о них или их славу.
- source_word: מָחִיתָ
  choice: стёр
  rationale: Глагол выражает стирание или полное удаление. «Стёр» сохраняет наглядную метафору применительно к имени.
- source_word: לְעוֹלָם וָעֶד
  choice: навеки и навсегда
  rationale: Парное выражение усиливает идею бесконечной длительности; русский оборот передаёт эту эмфазу естественно и ясно.
theological_decisions:
- issue: Собирательное или индивидуальное значение רָשָׁע
  choice: 'Собирательное: «нечестивых»'
  alternative: 'Индивидуальное или родовое единственное число: «нечестивца»'
  rationale: Единственное число в еврейском может обозначать отдельного нечестивца или весь класс нечестивых. Контекст суда над народами и множественное местоименное окончание в «их имя» поддерживают собирательное прочтение, однако подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксический параллелизм и образ стирания имени сохранены; неоднозначность единственного числа רָשָׁע не устранена молча, а вынесена в сноску.
