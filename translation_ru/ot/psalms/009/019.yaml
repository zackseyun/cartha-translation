  text: קוּמָ֣/ה יְ֭הוָה אַל יָעֹ֣ז אֱנ֑וֹשׁ יִשָּׁפְט֥וּ ג֝וֹיִ֗ם עַל פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/009/019.yaml
  text: Rise up[a], O Yahweh; do not let man prevail; let the nations be judged before you.
translation:
  language: ru
  text: Восстань, Яхве! Да не восторжествует человек[a]; пусть народы будут судимы пред Тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смертный человек»; еврейское אֱנוֹשׁ нередко подчёркивает человеческую слабость и смертность.'
    reason: Лексическая альтернатива сохраняет смысловой оттенок исходного слова.
lexical_decisions:
- source_word: קוּמָה
  choice: Восстань
  rationale: Повелительная форма глагола קום в обращении к Богу выражает призыв вмешаться; «восстань» естественно для возвышенной поэтической речи и не означает буквального пробуждения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: אַל יָעֹז
  choice: да не восторжествует
  rationale: Отрицательная частица с формой пожелания передаёт молитвенную просьбу не позволить человеку оказаться сильнее или одержать верх.
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Существительное в единственном числе представляет человека как такового; возможный оттенок слабости и смертности отмечен в сноске.
- source_word: יִשָּׁפְטוּ
  choice: пусть ... будут судимы
  rationale: 'Нифаль допускает пассивное судебное значение: народы должны предстать под Божий суд. Формулировка сохраняет и пассивность, и пожелательный оттенок.'
- source_word: גּוֹיִם
  choice: народы
  rationale: Обычное значение слова в Псалмах — народы или нации; «народы» звучит естественно в русском поэтическом контексте.
- source_word: עַל־פָּנֶיךָ
  choice: пред Тобой
  rationale: Идиоматически передаёт буквальное «перед Твоим лицом», то есть в Божьем присутствии и перед Его судом.
theological_decisions:
- issue: Антропологический оттенок אֱנוֹשׁ
  choice: человек
  alternative: смертный человек
  rationale: Основной текст сохраняет единственное число и собирательно-представительный смысл, не усиливая оттенок смертности сверх необходимого; этот подлинный лексический оттенок указан в сноске.
- issue: Характер суда над народами
  choice: будут судимы
  alternative: предстанут на суд
  rationale: Пассивная формулировка наиболее прямо отражает форму נִפְעַל и не уточняет сверх текста ни процедуру, ни исход суда.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным псалмопевческим звучанием. Частица «да не» сохраняет молитвенно-поэтический характер; местоимение в обращении к Богу написано с прописной буквы.
