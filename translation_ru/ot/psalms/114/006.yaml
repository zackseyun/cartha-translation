lexical_decisions:
- source_word: הֶהָרִים
  choice: Горы
  rationale: Существительное означает «горы»; форма с вопросительным ה продолжает вопрос и прямое обращение из предыдущего стиха. В русском обращение естественно передаётся без частицы «о».
- source_word: תִּרְקְדוּ
  choice: что вы скачете
  rationale: רקד может означать «скакать», «прыгать» или «плясать». «Скачете» сохраняет образ резвящихся животных и звучит естественно применительно к горам.
- source_word: כְאֵילִים
  choice: словно бараны
  rationale: אֵילִים здесь наиболее прямо означает «бараны» и образует параллель с молодыми овцами во второй строке.
- source_word: גְּבָעוֹת
  choice: холмы
  rationale: Точное и обычное соответствие существительному «холмы»; обращение передано синтаксисом вопроса.
- source_word: כִּבְנֵי צֹאן
  choice: словно ягнята в стаде
  rationale: Буквально «как сыны мелкого скота/стада» — идиоматическое обозначение молодых овец. «Ягнята в стаде» естественно передаёт смысл и сохраняет образ стада.
