  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превращающего скалу в водоём»; в еврейском тексте стоит причастие, но значение совершившегося действия соответствует воспоминанию псалма о Божьих деяниях в пустыне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹפְכִי
  choice: превратившего
  rationale: Причастная форма продолжает описание Бога Иакова из предыдущего стиха. Русское причастие сохраняет синтаксическую связь, а совершенный вид передаёт воспоминание псалма о Божьем деянии в пустыне.
- source_word: הַצּוּר
  choice: скалу
  rationale: צוּר обозначает скалу или массивную каменную породу; «скала» естественно передаёт образ и соответствует контексту воды, данной в пустыне.
- source_word: אֲגַם מָיִם
  choice: в водоём
  rationale: אֲגַם — вместилище стоячей воды, пруд или водоём. «Водоём» звучит естественно и не добавляет оттенка заболоченности.
- source_word: חַלָּמִישׁ
  choice: кремень
  rationale: חַלָּמִישׁ обозначает кремень или особо твёрдую каменную породу; «кремень» сохраняет образ крайней твёрдости.
- source_word: לְמַעְיְנוֹ מָיִם
  choice: в источник воды
  rationale: מַעְיָן означает природный источник; предлог לְ указывает здесь на результат превращения. Единственное число соответствует еврейской форме, а повтор слова «воды» сохраняет параллелизм.
theological_decisions:
- issue: Подразумеваемое упоминание Бога из предыдущего стиха
  choice: Сохранить зависимое причастие «превратившего», не повторяя слово «Бог»
  alternative: «Он превратил скалу в водоём…»
  rationale: Еврейский текст продолжает описание Господа, Бога Иакова, названного в стихе 7. Причастная конструкция сохраняет поэтическую и синтаксическую связь между стихами.
- issue: Временное значение еврейского причастия
  choice: 'Передать как совершившееся деяние: «превратившего»'
  alternative: «превращающего»
  rationale: Причастие само по себе допускает более общее или продолжающееся представление действия, однако контекст псалма вспоминает конкретные Божьи деяния при исходе и в пустыне. Альтернатива сохранена в примечании.
translation_notes:
  register: Современный литературный и торжественно-поэтический русский язык. Эллиптическое тире во второй строке параллелизма позволяет не повторять «превратившего», не нарушая ясности. Формулировка остаётся частью предложения, начатого в предыдущем стихе.
