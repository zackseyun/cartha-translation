source:
  edition: WLC
  text: הָיְתָ֣ה יְהוּדָ֣ה לְ/קָדְשׁ֑/וֹ יִ֝שְׂרָאֵ֗ל מַמְשְׁלוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/002.yaml
  text: Judah became his sanctuary[c][b][a], Israel his dominion.
translation:
  language: ru
  text: 'Иуда стал[a] его святилищем[b],

    Израиль — его владением[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был». Древнееврейский глагол допускает как значение состояния («был»), так и значение перехода в новое состояние («стал»).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «святыней». Древнееврейское слово может означать святость, святыню или святое место; здесь «святилище» соответствует параллельному «владению».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «областью его господства» или «его властью». В древнееврейском тексте существительное стоит во множественном числе, но здесь, вероятно, передаёт собирательное или абстрактное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיְתָה
  choice: стал
  rationale: 'В исторической последовательности псалма глагол היה естественно выражает наступившее состояние: после исхода Иуда стал Божьим святилищем. Мужской род согласован с русским именем «Иуда».'
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Сохранено традиционное русское библейское название колена или народа Иуды; «Иудея» могла бы неоправданно сузить значение до территории.
- source_word: לְקָדְשׁוֹ
  choice: его святилищем
  rationale: קֹדֶשׁ может обозначать святость либо святое место. Здесь конкретное «святилище» естественно соотносится с параллельным обозначением сферы Божьего господства.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено общепринятое русское название народа Израиля и поэтический параллелизм с Иудой.
- source_word: מַמְשְׁלוֹתָיו
  choice: его владением
  rationale: Существительное обозначает господство или область, на которую оно распространяется. Хотя древнееврейская форма множественного числа, здесь она, вероятно, имеет собирательно-абстрактный смысл; единственное число «владением» естественно по-русски и передаёт сферу Божьей власти.
theological_decisions:
- issue: К кому относятся местоименные суффиксы в выражениях «его святилищем» и «его владением»
  choice: Они относятся к Богу, при этом Бог не назван в самом стихе дополнительно.
  alternative: Прямо сказать «святилищем Господа» и «владением Господа».
  rationale: Контекст псалма ясно указывает на Бога Израиля, но краткое «его» сохраняет лаконичность древнееврейского текста и не добавляет отсутствующего здесь имени.
- issue: Соотношение названий «Иуда» и «Израиль»
  choice: Оба названия сохранены раздельно как две части поэтического параллелизма.
  alternative: Объединить их в одно обозначение Божьего народа или истолковать одно через другое.
  rationale: Древнееврейский текст намеренно ставит рядом Иуду и Израиль; перевод не должен сглаживать это различие или задавать ему более позднее богословское толкование.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим синтаксисом. Нулевая связка во второй строке передана тире. Местоимение «его» написано со строчной буквы в соответствии с нейтральной современной издательской практикой; это не меняет его отнесённости к Богу.
