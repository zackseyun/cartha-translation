  choice: дом Иакова
  rationale: Сохранён традиционный библейский образ, обозначающий потомков Иакова и поэтически соответствующий слову «Израиль».
- source_word: מֵ/עַם
  choice: от народа
  rationale: Предлог מן вновь обозначает отделение; «от народа» сохраняет параллелизм с «из Египта».
