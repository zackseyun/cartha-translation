  rationale: Слово характеризует народ как говорящий на непонятном или ином для Израиля языке. Эта формулировка ясна современному читателю и не придаёт выражению этнически уничижительного оттенка.
theological_decisions:
- issue: Соотношение двух параллельных строк
  choice: 'Вторая строка сохранена как параллельное повторение исхода: «дом Иакова» соответствует «Израилю», а «от народа, говорившего на чужом языке» — «из Египта»; сказуемое во второй строке подразумевается.'
  alternative: Передать вторую строку как развёрнутое предложение с повтором «вышел» либо только как приложение к первой.
  rationale: Еврейская поэзия использует синонимический параллелизм и эллипсис. Русский текст сохраняет напряжённую лаконичность оригинала, а тире помогает естественно прочитать пропущенное сказуемое без его добавления.
