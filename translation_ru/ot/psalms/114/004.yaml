lexical_decisions:
- source_word: הָרִים
  choice: горы
  rationale: Определённость еврейской формы естественно передаётся по-русски контекстом; артикля в русском языке нет.
- source_word: רָקְדוּ
  choice: скакали
  rationale: Глагол описывает живое прыгающее или пляшущее движение. «Скакали» естественно сочетается с образом баранов и ягнят и сохраняет поэтическое олицетворение.
- source_word: כְאֵילִים
  choice: как бараны
  rationale: אֵילִים в данном образе обозначает баранов; это значение поддерживается параллельным упоминанием молодых овец во второй строке.
- source_word: גְּבָעוֹת
  choice: холмы
  rationale: Обычное и точное соответствие; параллелизм с «горами» сохранён.
- source_word: כִּבְנֵי צֹאן
  choice: как ягнята в стаде
  rationale: Буквально выражение означает «как сыны стада» и указывает на молодых животных мелкого скота. «Ягнята в стаде» ясно передаёт смысл и сохраняет образ стада.
