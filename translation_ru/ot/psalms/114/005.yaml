lexical_decisions:
- source_word: מַה לְּךָ
  choice: Что с тобой
  rationale: Передаёт еврейский идиоматический вопрос «что тебе/с тобой?» как изумлённое риторическое обращение, не сводя его к простому «почему».
- source_word: הַיָּם
  choice: море
  rationale: Существительное употреблено как прямое поэтическое обращение; в современном русском звательная сила ясно выражается без частицы «о».
- source_word: כִּי
  choice: что
  rationale: 'Вводит содержание риторического вопроса: «что ты бежишь»; такая конструкция сохраняет форму и поэтический параллелизм оригинала.'
- source_word: תָנוּס
  choice: ты бежишь
  rationale: Прямо передаёт значение נוּס «бежать, спасаться бегством» и сохраняет олицетворение моря.
- source_word: הַיַּרְדֵּן
  choice: Иордан
  rationale: Название реки дано как прямое обращение, параллельное обращению к морю.
- source_word: תִּסֹּב לְאָחוֹר
  choice: ты обращаешься вспять
  rationale: Передаёт разворот и обратное движение реки; «вспять» естественно для поэтического описания течения воды и сохраняет возвышенный регистр.
