lexical_decisions:
- source_word: הַיָּם
  choice: море
  rationale: Определённое существительное означает «море». Строчная буква сохраняет неопределённость еврейского текста, который здесь прямо не называет Красное море.
- source_word: רָאָה
  choice: увидело
  rationale: Прямой и естественный эквивалент, сохраняющий поэтическое олицетворение моря и не добавляющий отсутствующий в еврейском тексте объект.
- source_word: וַיָּנֹס
  choice: и побежало
  rationale: Глагол נוס означает «бежать, спасаться бегством». Форма «побежало» звучит естественно применительно к олицетворённому морю и передаёт стремительность действия.
- source_word: הַיַּרְדֵּן
  choice: Иордан
  rationale: Общепринятое русское название реки; добавление слова «река» не требуется.
- source_word: יִסֹּב לְאָחוֹר
  choice: повернул вспять
  rationale: Сочетание передаёт буквальный образ поворота назад и естественно звучит в современной литературной русской поэзии.
theological_decisions:
- issue: Историко-поэтическая аллюзия
  choice: Сохранить олицетворённое описание моря и Иордана, не называя подразумеваемые события в основном тексте.
  alternative: 'Добавить объект: «Море увидело Его» или прямо назвать исход и переход через Иордан.'
  rationale: В еврейском стихе объект глагола «увидело» не выражен. Его добавление устранило бы намеренную поэтическую недосказанность; исторические события уместно пояснить в сноске.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной поэтической формой. Тире подчёркивает живую последовательность действий; олицетворение и отсутствие объекта при «увидело» сохранены.
