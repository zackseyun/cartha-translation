  source_fidelity: Текст точно передаёт еврейское повеление женского рода, обращённое к земле, и дважды воспроизводит мִלִּפְנֵי как «пред». «Владыка» адекватно передаёт אָדוֹן как титул и не подменяет его тетраграмматоном; «Бог Иакова» верно передаёт אֱלוֹהַּ יַעֲקֹב. «Трепещи» является оправданным переводом חול, а сноска добросовестно отмечает более интенсивный оттенок движения/сотрясения.
