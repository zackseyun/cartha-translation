  text: מִ/לִּ/פְנֵ֣י אָ֭דוֹן ח֣וּלִי אָ֑רֶץ מִ֝/לִּ/פְנֵ֗י אֱל֣וֹהַּ יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/114/007.yaml
  text: Tremble[a], O earth, before the Lord, before the God of Jacob,
translation:
  language: ru
  text: Трепещи[a], земля, пред Владыкой, пред Богом Иакова!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сотрясайся, земля» — еврейский глагол может передавать более сильный образ судорожного колебания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלִּפְנֵי
  choice: пред
  rationale: Передаёт пребывание перед лицом и в присутствии кого-либо; в русском поэтическом призыве звучит естественно и сохраняет повтор исходного текста.
- source_word: אָדוֹן
  choice: Владыкой
  rationale: Передаёт титул «владыка, господин» и не смешивает его с именем יהוה, которого в данном стихе нет.
- source_word: חוּלִי
  choice: Трепещи
  rationale: Повелительная форма обращена к земле. «Трепещи» естественно выражает дрожь и потрясение перед Божьим присутствием, а более сильный образ судорожного движения отмечен в сноске.
- source_word: אָרֶץ
  choice: земля
  rationale: Контекст псалма и прямое обращение допускают широкий, космический смысл «земля», а не только отдельная страна.
- source_word: אֱלוֹהַּ יַעֲקֹב
  choice: Богом Иакова
  rationale: Сохраняет определение Бога через Его связь с Иаковом и естественно сочетается с повторным предлогом «пред».
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Использована закрепившаяся в русской библейской традиции форма имени; родительный падеж передаёт еврейскую конструкцию принадлежности.
theological_decisions:
- issue: Различение אָדוֹן и божественного имени יהוה
  choice: Владыкой
  alternative: Господом
  rationale: «Владыкой» точно передаёт титул אָדוֹן и не создаёт впечатления, будто в исходном тексте здесь стоит имя יהוה.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Повтор «пред… пред…» сохраняет параллелизм еврейской строки; восклицательный знак передаёт силу повелительного обращения.
