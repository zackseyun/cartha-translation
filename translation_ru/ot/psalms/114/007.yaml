  terminology: «Владыка» последовательно отличает титул אָדוֹן от имени יהוה; написание «Бог» и традиционная форма имени «Иаков» естественны для русского библейского текста. Сноска привязана к слову «Трепещи» и описывает допустимую лексическую альтернативу без навязывания спорного значения.
