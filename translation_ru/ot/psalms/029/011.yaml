  text: יְֽהוָ֗ה עֹ֭ז לְ/עַמּ֣/וֹ יִתֵּ֑ן יְהוָ֓ה יְבָרֵ֖ךְ אֶת עַמּ֣/וֹ בַ/שָּׁלֽוֹם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/011.yaml
  text: Yahweh gives strength to his people[b][a]; Yahweh blesses his people with peace.
translation:
  language: ru
  text: Яхве даёт силу Своему народу[a]; Яхве благословляет Свой народ миром[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве даст силу Своему народу; Яхве благословит Свой народ миром». Еврейские глагольные формы могут иметь значение будущего времени.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово «шалом», переведённое как «мир», может также означать целостность, благополучие и процветание.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עֹז
  choice: силу
  rationale: Естественно передаёт значение силы или могущества и служит прямым дополнением к глаголу «даёт».
- source_word: לְעַמּוֹ
  choice: Своему народу
  rationale: Предлог לְ обозначает адресата дара; возвратное притяжательное местоимение естественно для русского языка и однозначно отсылает к подлежащему.
- source_word: יִתֵּן
  choice: даёт
  rationale: 'Имперфект допускает характеристическое, декларативное прочтение: Яхве даёт силу Своему народу. Возможное будущее значение сохранено в сноске.'
- source_word: יְבָרֵךְ
  choice: благословляет
  rationale: Параллельно первому глаголу передано настоящим временем как уверенное утверждение; будущее прочтение остаётся возможным.
- source_word: אֶת עַמּוֹ
  choice: Свой народ
  rationale: Повтор существительного сохраняет поэтический параллелизм еврейского текста.
- source_word: בַשָּׁלוֹם
  choice: миром
  rationale: Творительный падеж естественно выражает то, чем Яхве благословляет народ; «мир» передаёт основное значение שָׁלוֹם, а более широкий смысл отмечен в сноске.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное Божье имя и не подменяет его титулом.
- issue: Видо-временное значение יִתֵּן и יְבָרֵךְ
  choice: 'Настоящее декларативное: «даёт… благословляет»'
  alternative: 'Будущее: «даст… благословит»; пожелание: «да даст… да благословит»'
  rationale: В заключительном поэтическом двустишии формы могут выражать уверенное утверждение о характерном действии Яхве. Однако еврейский имперфект допускает и будущее значение, поэтому оно указано в сноске; пожелательное прочтение грамматически возможно, но менее вероятно в данном контексте.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим строем. Сохранены повтор имени «Яхве» и выражения «народ» ради еврейского параллелизма; прописная буква в «Своему/Свой» соответствует принятому благоговейному книжному оформлению.
