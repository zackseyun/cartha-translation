  text: Голос Яхве высекает языки пламени[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «огненные вспышки»; вероятно, имеются в виду молнии в образе бури, являющей присутствие Бога.'
