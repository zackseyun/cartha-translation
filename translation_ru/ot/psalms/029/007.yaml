lexical_decisions:
- source_word: קוֹל
  choice: голос
  rationale: В повторяющемся рефрене псалма слово обозначает могущественный голос Яхве; перевод «голос» сохраняет и прямое значение, и поэтическое олицетворение грома.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом «Господь».
- source_word: חֹצֵב
  choice: высекает
  rationale: Причастие от חצב выражает рубку или высекание. «Высекает» естественно сочетается в русском с огнём и сохраняет энергичный, конкретный образ еврейского текста.
- source_word: לַהֲבוֹת
  choice: языки пламени
  rationale: Существительное во множественном числе обозначает пламена, огненные языки или вспышки. «Языки пламени» передаёт зрительный образ и не сводит его прямо к молнии.
- source_word: אֵשׁ
  choice: пламени
  rationale: Буквально слово означает «огонь». В русском сочетание «языки огня» возможно, но «языки пламени» звучит естественнее и передаёт совокупное выражение לַהֲבוֹת אֵשׁ без тяжеловесной тавтологии.
theological_decisions:
- issue: Передача образа бури при сохранении непосредственного действия Яхве и поэтической неоднозначности
  choice: «Голос Яхве высекает языки пламени» — конкретный поэтический образ оставлен в основном тексте.
  alternative: «Голос Яхве высекает огненные вспышки» или прямо «молнии».
  rationale: Контекст, вероятно, указывает на молнии, однако еврейский текст говорит об огненном пламени. Основной перевод сохраняет метафору и божественную действующую силу, а вероятное природное соответствие отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической образностью. Глагол «высекает» сохраняет силу исходной метафоры; выражение «языки пламени» естественно для русского и передаёт множественное число.
