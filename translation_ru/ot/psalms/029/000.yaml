  text: A psalm of David. Ascribe to Yahweh[a], sons of the mighty, ascribe to Yahweh glory and strength.
translation:
  language: ru
  text: 'Псалом Давида.


    Воздайте Яхве, сыны богов[a],

    воздайте Яхве славу и силу.'
  philosophy: optimal-equivalence
  footnotes:
