    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Псалом Давида
  rationale: Традиционная и естественная передача надписания; еврейская конструкция допускает связь псалма с Давидом без уточнения характера этой связи.
- source_word: הָבוּ
  choice: Воздайте
  rationale: Императив буквально означает «дайте», но в сочетании со славой и силой естественно передаётся возвышенным русским «воздайте», то есть признайте и провозгласите принадлежащими Яхве.
- source_word: יהוה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, и соответствует явному именованию в консультационном английском тексте.
- source_word: בְּנֵי אֵלִים
  choice: сыны богов
  rationale: Формально сохраняет множественное число אֵלִים и небесно-советный образ, не сводя неоднозначное выражение ни к людям, ни к одной конфессиональной трактовке.
- source_word: כָּבוֹד וָעֹז
  choice: славу и силу
  rationale: Прямая и естественная передача двух существительных с сохранением их параллельного, торжественного звучания.
theological_decisions:
- issue: Кого обозначает выражение בְּנֵי אֵלִים
  choice: 'В основном тексте: «сыны богов»; неоднозначность пояснена в сноске.'
  alternative: «сыны Божьи», «небесные существа» или «сыны сильных»
  rationale: Контекст псалма, вероятно, обращён к членам небесного собрания, однако форма выражения допускает разные способы понимания. Буквальная передача сохраняет древний образ и богословское напряжение, а сноска предотвращает неоправданное сужение смысла.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим ритмом. Повтор императива сохранён как важный элемент еврейского параллелизма; архаические формы и избыточные пояснения в основном тексте избегаются.
