  text: קוֹל יְהוָ֥ה בַּ/כֹּ֑חַ ק֥וֹל יְ֝הוָ֗ה בֶּ/הָדָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/004.yaml
  text: The voice of Yahweh is powerful[b][a]; the voice of Yahweh is majestic.
translation:
  language: ru
  text: Голос Яхве[b] могуч[a]; голос Яхве величествен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Голос Яхве — в силе; голос Яхве — в величии».'
    reason: lexical_alternative
  - marker: b
    text: Евр. YHWH (יהוה); традиционно переводится как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: голос
  rationale: Существительное означает «голос» или «звук». В повторяющейся формуле псалма «голос» сохраняет личный и деятельный характер громового явления Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не заменяющий его традиционный титул.
- source_word: בַּכֹּחַ
  choice: могуч
  rationale: Предлог ב с существительным כֹּחַ допускает буквальное «в силе / с силой», но в данном именном поэтическом высказывании естественное русское «могуч» точно передаёт описательный смысл. Более формальная конструкция сохранена в примечании.
- source_word: הָדָר
  choice: величествен
  rationale: הָדָר обозначает величие, великолепие и царственную красоту. Прилагательное «величествен» естественно соответствует параллельному «могуч» и сохраняет возвышенный тон.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Описательная или обстоятельственная трактовка בַּכֹּחַ и בֶּהָדָר
  choice: могуч; величествен
  alternative: в силе; в величии
  rationale: Контекст допускает понимание предложных сочетаний как характеристик голоса. Основной текст передаёт это естественно по-русски, а буквальная синтаксическая возможность отмечена в сноске без устранения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с краткими прилагательными, сохраняющими лаконизм, параллелизм и возвышенное звучание еврейской поэзии.
