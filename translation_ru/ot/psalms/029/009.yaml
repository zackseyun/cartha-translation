base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/009.yaml
  text: The voice of Yahweh makes the deer give birth and strips the forests bare[a], and in his temple all say[b], “Glory!”
translation:
  language: ru
  text: 'Голос Господа заставляет ланей рожать[a] и обнажает леса, и в Его храме[b] все говорят: «Слава!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставляет ланей корчиться»; возможно также: «заставляет ланей корчиться в родовых муках».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать как «храм», так и «дворец».
    reason: alternative_reading
lexical_decisions:
- source_word: ק֤וֹל יְהוָ֨ה
  choice: Голос Господа
  rationale: Конструкция передана прямо; тетраграмматон по принятой русской библейской традиции передан словом «Господь».
- source_word: יְחוֹלֵ֣ל אַיָּלוֹת֮
  choice: заставляет ланей рожать
  rationale: Глагол חול может обозначать мучительные судороги, в особенности родовые; в сочетании с названием самок оленя естественно выражает вызванные бурей роды. Альтернативный образ корчащихся в муках ланей сохранён в сноске.
- source_word: וַֽיֶּחֱשֹׂ֪ף יְעָ֫ר֥וֹת
  choice: и обнажает леса
  rationale: חשׂף означает снимать покров, обнажать; формулировка передаёт картину лесов, лишённых листвы и ветвей бурей.
- source_word: וּבְהֵיכָלוֹ
  choice: а в Его храме
  rationale: הֵיכָל может означать храм или царский дворец. Контекст славословия позволяет выбрать «храм», не устраняя альтернативу, указанную в сноске.
- source_word: כֻּלּוֹ אֹמֵר
  choice: все говорят
  rationale: 'Формально единственное число допускает собирательно-дистрибутивное понимание: каждый из находящихся там говорит. Нейтральное «говорят» близко к еврейскому глаголу и не усиливает его до «восклицают».'
- source_word: כָּבֽוֹד
  choice: «Слава!»
  rationale: Однословное восклицание естественно передаёт культовую хвалу и основное значение כבוד.
theological_decisions:
- issue: Значение הֵיכָל применительно к Господу
  choice: храм
  alternative: дворец
  rationale: Славословие в псалме поддерживает храмовый образ, однако тема царствования Господа допускает также значение «дворец»; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной псалмовой интонацией. Сохранён параллелизм действий голоса Господа и краткое заключительное славословие.
