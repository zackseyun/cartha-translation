  text: הָב֣וּ לַֽ֭/יהוָה כְּב֣וֹד שְׁמ֑/וֹ הִשְׁתַּחֲו֥וּ לַ֝/יהוָ֗ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/002.yaml
  text: Ascribe to Yahweh the glory of his name[a]; worship Yahweh in holy splendor.
translation:
  language: ru
  text: 'Воздайте Яхве славу Его имени;

    поклонитесь Яхве в святом великолепии.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в великолепии святости»; возможно также: «в священных одеждах».'
    reason: Еврейское выражение בְּהַדְרַת קֹדֶשׁ неоднозначно и может обозначать святое великолепие, великолепие святости либо священное облачение.
lexical_decisions:
- source_word: הָבוּ
  choice: Воздайте
  rationale: Форма повелительного наклонения во множественном числе в этой псалмовой формуле означает признать и воздать подобающую честь, а не буквально что-либо передать.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата действия; тетраграмматон передан личным именем «Яхве».
- source_word: כְּבוֹד שְׁמוֹ
  choice: славу Его имени
  rationale: Передаёт конструкцию со значением славы, принадлежащей имени Яхве, не добавляя в основной текст прямо не выраженного слова «достойную».
- source_word: הִשְׁתַּחֲווּ
  choice: поклонитесь
  rationale: Глагол буквально обозначает склониться или простереться в почтении, а в обращении к Яхве выражает поклонение; русский глагол сохраняет и телесный образ, и богослужебный смысл.
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: в святом великолепии
  rationale: Краткое поэтическое выражение сохраняет неопределённость между великолепием святости, священным убранством и праздничными священными одеждами.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и соответствует предоставленному доктринальному решению.
- issue: Толкование בְּהַדְרַת קֹדֶשׁ
  choice: в святом великолепии
  alternative: в великолепии святости; в священных одеждах
  rationale: Еврейское выражение допускает как отвлечённое, так и конкретное культовое понимание. Основной текст не сужает его до одного из них, а примечание сообщает существенные варианты.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим ритмом. «Воздайте» и «поклонитесь» понятны современному читателю и сохраняют богослужебный характер стиха; архаические формы и конфессионально маркированная лексика не используются.
