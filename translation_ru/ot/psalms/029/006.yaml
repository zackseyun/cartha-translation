lexical_decisions:
- source_word: וַיַּרְקִידֵם
  choice: Он заставляет … скакать
  rationale: 'Глагол רקד в породе хифиль имеет каузативное значение: «заставляет скакать / побуждает прыгать». «Скакать» естественно передаёт резкое, живое движение телёнка и сохраняет поэтическую образность.'
- source_word: כְּמוֹ עֵגֶל
  choice: словно телёнок
  rationale: עֵגֶל обычно обозначает телёнка или молодое животное из крупного рогатого скота; «телёнок» точно и ясно передаёт образ.
- source_word: לְבָנוֹן
  choice: Ливан
  rationale: Сохранено традиционное русское написание географического названия; в контексте имеется в виду горный Ливан.
- source_word: וְשִׂרְיֹן
  choice: а Сирион
  rationale: Передано собственное имя, употреблённое в еврейском тексте. Союз «а» естественно выражает поэтический параллелизм двух сопоставлений, не превращая его в противопоставление.
- source_word: כְּמוֹ בֶן רְאֵמִים
  choice: словно молодой дикий бык
  rationale: Буквально выражение означает «словно сын диких быков», но בֶן здесь идиоматически указывает на молодую особь. רְאֵם по современным лексикографическим данным — дикий бык, а не мифический единорог.
