lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона; форма «Господь» сохраняет особое обозначение Бога Израиля без менее привычной русскому читателю транслитерации.
- source_word: לַמַּבּוּל
  choice: над потопом
  rationale: מַבּוּל означает потоп; предлог לְ при глаголе царственного восседания допускает пространственно-ситуативное понимание. «Над потопом» естественно выражает власть Господа над водами, не исключая намёка на всемирный потоп.
- source_word: יָשָׁב
  choice: восседал
  rationale: Основное значение — «сидел», но в данном царственном контексте русское «восседал» передаёт образ пребывания на престоле, не добавляя отдельного слова «престол».
- source_word: וַיֵּשֶׁב
  choice: восседает
  rationale: Форма продолжает параллельную мысль, а сочетание с לְעוֹלָם подчёркивает непрекращающееся царствование; настоящее время естественно передаёт эту устойчивую реальность.
- source_word: מֶלֶךְ
  choice: Царём
  rationale: 'Творительный предикативный падеж естественно передаёт царский статус: Господь восседает как Царь.'
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Достоинственная и общеупотребительная в библейском русском языке передача неограниченной длительности; остаётся понятной современному читателю.
theological_decisions:
- issue: Обозначает ли מַבּוּל конкретно потоп во времена Ноя или воды потопа/хаоса в более широком смысле
  choice: В основном тексте — «потопом», без прямого упоминания Ноя.
  alternative: «Потопом» как однозначная ссылка на всемирный потоп при Ное.
  rationale: Слово מַבּוּל действительно тесно связано с повествованием о потопе, но сам стих не называет Ноя, а непосредственный контекст псалма описывает бурю и водную стихию. Строчная форма и примечание сохраняют обе возможности.
- issue: Временное соотношение двух форм יָשָׁב и וַיֵּשֶׁב
  choice: «восседал» в первой строке и «восседает» во второй.
  alternative: 'Обе формы передать прошедшим временем: «восседал… и воссел…».'
  rationale: Так сохраняется переход от проявленной в потопе власти к вечному и продолжающемуся царствованию, хотя еврейская последовательность форм допускает более строго повествовательное прочтение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Восседал / восседает» и «вовеки» придают строке достоинство, оставаясь ясными; синтаксический параллелизм оригинала сохранён.
