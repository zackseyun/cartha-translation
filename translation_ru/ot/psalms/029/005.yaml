  text: ק֣וֹל יְ֭הוָה שֹׁבֵ֣ר אֲרָזִ֑ים וַ/יְשַׁבֵּ֥ר יְ֝הוָ֗ה אֶת אַרְזֵ֥י הַ/לְּבָנֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/005.yaml
  text: The voice of Yahweh breaks cedars[b][a]; Yahweh shatters the cedars of Lebanon.
translation:
  language: ru
  text: Голос Яхве[a] ломает кедры; Яхве сокрушает[b] кедры Ливана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Звук Яхве». Еврейское קוֹל может означать и «голос», и «звук»; здесь выбрано слово «голос», сохраняющее повторяющийся в псалме образ личного, подобного грому речения Яхве.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте в обеих частях стиха употреблён один корень со значением «ломать»; во второй части более сильное «сокрушает» передаёт усиление поэтического параллелизма.
    reason: lexical_alternative
lexical_decisions:
- source_word: קוֹל יְהוָה
  choice: Голос Яхве
  rationale: קוֹל может означать как «голос», так и «звук». В повторяющемся рефрене псалма «голос» лучше сохраняет личностный и теофанический образ грозного речения Яхве.
- source_word: שֹׁבֵר
  choice: ломает
  rationale: Причастие Qal передаёт яркое настоящее или характерное действие. «Ломает» звучит естественно и сохраняет силу образа.
- source_word: אֲרָזִים
  choice: кедры
  rationale: Форма множественного числа обозначает кедры в общем смысле; в русском языке дополнительное слово «деревья» не требуется.
- source_word: וַיְשַׁבֵּר
  choice: сокрушает
  rationale: Форма Piel того же корня שבר усиливает вторую половину параллелизма. Настоящее время соответствует поэтическому контексту и продолжает действие первой строки.
- source_word: אֶת אַרְזֵי הַלְּבָנוֹן
  choice: кедры Ливана
  rationale: Конструктивное сочетание указывает на знаменитые ливанские кедры; формулировка сохраняет возвышенную поэтическую краткость.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» непосредственно передаёт тетраграмматон и не подменяет его титулом.
- issue: Личностный или безличный смысл קוֹל
  choice: голос
  alternative: звук; грохот
  rationale: «Голос» сохраняет представление о личном речении Яхве, но допустимое значение «звук» отмечено в сноске, чтобы не устранять лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным и энергичным поэтическим строем. Повтор имени «Яхве» и параллельная структура исходного текста сохранены; глагольное варьирование передаёт усиление второй части.
