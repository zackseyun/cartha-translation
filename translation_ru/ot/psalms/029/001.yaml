  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד הָב֣וּ לַֽ֭/יהוָה בְּנֵ֣י אֵלִ֑ים הָב֥וּ לַ֝/יהוָ֗ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/001.yaml
  text: A psalm of David. Ascribe to Yahweh[a], O sons of God, ascribe to Yahweh glory and strength.
translation:
  language: ru
  text: Псалом Давида. Воздайте Яхве, сыны богов[a], воздайте Яхве славу и силу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сыны Божьи»; по всей вероятности, имеются в виду небесные существа — члены небесного совета.'
    reason: Сочетание בְּנֵי אֵלִים допускает разные способы передачи; сноска сохраняет основные варианты и поясняет вероятный смысл.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Традиционное и точное обозначение данного поэтического жанра и надписания.
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая естественная форма русского надписания; как и еврейская конструкция с לְ, она допускает связь с Давидом, не разворачивая её в явное утверждение об авторстве.
- source_word: הָבוּ
  choice: Воздайте
  rationale: В данном призыве речь идёт не о материальной передаче, а о признании принадлежащих Яхве славы и силы; «воздайте» естественно передаёт этот смысл и сохраняет возвышенный регистр.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, употреблённое в еврейском тексте, а не заменяет его титулом.
- source_word: בְּנֵי אֵלִים
  choice: сыны богов
  rationale: Формально передаёт конструкцию «сыны» и множественную форму אֵלִים, не устраняя трудность выражения; вероятный смысл пояснён в сноске.
- source_word: כָּבוֹד
  choice: славу
  rationale: Устоявшийся русский эквивалент, соответствующий контексту Божьего величия.
- source_word: וָעֹז
  choice: и силу
  rationale: Прямо передаёт עֹז и сохраняет парную поэтическую конструкцию «славу и силу».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В основном тексте сохраняется явное личное имя, стоящее в еврейском оригинале.
- issue: Толкование בְּנֵי אֵלִים
  choice: сыны богов
  alternative: сыны Божьи; небесные существа
  rationale: Основной текст сохраняет грамматическую форму и богословскую напряжённость выражения, тогда как сноска сообщает вероятную референцию к членам небесного совета.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмической интонацией. Повтор «воздайте Яхве» сохранён как важный элемент еврейского параллелизма.
