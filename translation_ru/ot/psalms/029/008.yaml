base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/008.yaml
  text: The voice of Yahweh shakes the wilderness[a]; Yahweh shakes the wilderness of Kadesh.
translation:
  language: ru
  text: Голос Яхве сотрясает пустыню[a]; Яхве сотрясает пустыню Кадеш.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставляет пустыню содрогаться»; возможно также: «заставляет пустыню корчиться».'
    reason: Лексема יָחִיל допускает оттенки дрожи, содрогания и мучительных судорог; образ намеренно силён и не должен быть сведён к одному оттенку.
lexical_decisions:
- source_word: ק֣וֹל
  choice: голос
  rationale: В Псалме 29 сочетание קוֹל יְהוָה служит поэтическим рефреном. «Голос» сохраняет личностную и литературную силу образа лучше, чем более безличный «звук».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое именование Бога в еврейском тексте, не заменяя его титулом.
- source_word: יָחִיל
  choice: сотрясает
  rationale: Форма хифиль глагола חול может означать «заставляет содрогаться, трепетать, корчиться». «Сотрясает» естественно по-русски передаёт мощное воздействие голоса Яхве на пустыню, а более буквальные оттенки отмечены в сноске.
- source_word: מִדְבָּר
  choice: пустыня
  rationale: В данном географическом и поэтическом контексте «пустыня» естественно обозначает необитаемую засушливую местность, не сужая образ до строго климатического термина.
- source_word: מִדְבַּר קָדֵשׁ
  choice: пустыня Кадес
  rationale: Сопряжённая конструкция обозначает пустынную область, связанную с местом Кадес. Такая форма естественна в современном русском библейском географическом употреблении.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблено личное имя Бога. «Яхве» передаёт тетраграмматон как имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Повтор «Яхве… пустыню» сохранён как часть параллелизма и риторического строя еврейского стиха.
