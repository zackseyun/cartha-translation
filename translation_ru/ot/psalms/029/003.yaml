  text: ק֥וֹל יְהוָ֗ה עַל הַ֫/מָּ֥יִם אֵֽל הַ/כָּב֥וֹד הִרְעִ֑ים יְ֝הוָ֗ה עַל מַ֥יִם רַבִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/029/003.yaml
  text: The voice of Yahweh is over the waters[a]; the God of glory thunders[b], Yahweh is over many waters.
translation:
  language: ru
  text: 'Голос Яхве — над водами;

    Бог славы гремит;

    Яхве — над многими водами.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹל
  choice: голос
  rationale: Сохраняет личностный и поэтический образ голоса Яхве, который в контексте псалма проявляется как гром; нейтральное «звук» ослабило бы этот образ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עַל הַמָּיִם
  choice: над водами
  rationale: Естественно передаёт пространственное значение עַל и сохраняет образ бури над водами.
- source_word: אֵל הַכָּבוֹד
  choice: Бог славы
  rationale: Прямо передаёт еврейское сочетание с родительным отношением, не сводя его к более толковательному «славный Бог».
- source_word: הִרְעִים
  choice: гремит
  rationale: Глагол רעם означает «греметь громом». Настоящее время создаёт требуемую для гимна живость и хорошо звучит по-русски.
- source_word: מַיִם רַבִּים
  choice: великие воды
  rationale: Поэтическое выражение обозначает обширные, могучие воды. «Великие воды» естественнее в русском библейско-поэтическом контексте, чем буквальное «многие воды».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; его передача сохраняет различие между именем и титулом.
- issue: Гром как голос Бога
  choice: Сохранены и «голос», и «гремит»
  alternative: 'Передать описательно: «гром Яхве раздаётся»'
  rationale: Исходный текст намеренно изображает гром как голос Яхве. Сохранение обоих выражений не сводит поэтическое богословие к простому описанию погоды.
- issue: Безглагольная заключительная строка
  choice: «Яхве — над великими водами»
  alternative: «Яхве пребывает над великими водами»
  rationale: Тире естественно передаёт в русском языке еврейское безглагольное предложение и не уточняет сверх текста характер присутствия или действия Яхве.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим ритмом. В первой строке добавлено «раздаётся», чтобы естественно передать русским безглагольное еврейское предложение; в последней строке его безглагольность сохранена с помощью тире.
