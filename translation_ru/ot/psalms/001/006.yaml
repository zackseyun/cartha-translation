  text: כִּֽי יוֹדֵ֣עַ יְ֭הוָה דֶּ֣רֶךְ צַדִּיקִ֑ים וְ/דֶ֖רֶךְ רְשָׁעִ֣ים תֹּאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/006.yaml
  text: For Yahweh knows the way of the righteous[a], but the way of the wicked will perish.
translation:
  language: ru
  text: Ведь Господь знает путь праведных[a], а путь нечестивых погибнет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хранит»; еврейское слово «знает» здесь может подразумевать личную заботу и одобрение, а не только осведомлённость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим противопоставлением и естественно звучит в современном русском.
- source_word: יֹדֵעַ
  choice: знает
  rationale: Сохраняет прямое значение ידע и не устраняет возможный более глубокий оттенок заботливого, одобрительного знания; он отмечен в сноске.
- source_word: יְהוָה
  choice: Господь
  rationale: Устоявшаяся русская библейская передача тетраграмматона, естественная и узнаваемая для широкого круга читателей.
- source_word: דֶּרֶךְ
  choice: путь
  rationale: Сохраняет повтор и образ жизненного пути, включая образ жизни и его исход.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Естественно передаёт субстантивированное множественное прилагательное и сохраняет категорию людей, живущих праведно.
- source_word: וְ
  choice: а
  rationale: В русском языке ясно выражает противопоставление двух путей, заложенное в поэтическом параллелизме.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Устоявшийся и точный эквивалент в контексте ветхозаветной литературы мудрости; обозначает людей, противящихся Божьему порядку.
- source_word: תֹּאבֵד
  choice: погибнет
  rationale: Передаёт непереходное значение глагола אבד и грамматически согласуется с подлежащим «путь».
theological_decisions:
- issue: Смысл того, что Господь «знает» путь праведных
  choice: В основном тексте сохранено «знает», допускающее смысл личного, одобрительного знания и заботы.
  alternative: «хранит» или «наблюдает за» путём праведных
  rationale: Более разъясняющий перевод мог бы сузить смысл до охраны или надзора. Буквальное «знает» сохраняет богословскую глубину и подлинную смысловую ёмкость еврейского глагола.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью. Сохранены лаконичность стиха, повтор слова «путь» и контраст между праведными и нечестивыми.
