id: PSA.1.1
reference: Psalms 1:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַ֥שְֽׁרֵי הָ/אִ֗ישׁ אֲשֶׁ֤ר לֹ֥א הָלַךְ֮ בַּ/עֲצַ֪ת רְשָׁ֫עִ֥ים וּ/בְ/דֶ֣רֶךְ חַ֭טָּאִים לֹ֥א עָמָ֑ד וּ/בְ/מוֹשַׁ֥ב לֵ֝צִ֗ים לֹ֣א יָשָֽׁב־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/001.yaml
  text: Blessed is the man who does not walk in the counsel of the wicked[a], nor stand in the way of sinners[c][b], nor sit in the seat of scoffers.
translation:
  language: ru
  text: Блажен[a] человек[b], который не идёт по совету нечестивых, не стоит на пути грешников и не сидит в кругу насмешников[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Счастлив». Еврейское выражение говорит о глубоко благополучной, завидной участи, а не только о чувстве радости.'
    reason: lexical_alternative
  - marker: b
    text: 'Здесь «человек» имеет обобщённый смысл: речь идёт не только о мужчинах, а о всяком, кто соответствует этому описанию.'
    reason: cultural_note
  - marker: c
    text: 'Или: «глумящихся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Еврейская формула блаженства обозначает глубокое благополучие и завидную участь описанного человека, а не просто субъективное чувство счастья. Единственное число согласовано с הָאִישׁ.
- source_word: הָאִישׁ
  choice: человек
  rationale: Существительное имеет мужской род и единственное число, но в поучительной литературе представляет всякого человека, соответствующего описанию. Русское «человек» сохраняет единственное число и естественно допускает обобщённое значение.
- source_word: הָלַךְ
  choice: идёт
  rationale: Сохраняет образ движения и поэтическую последовательность «идёт — стоит — сидит», не сводя метафору только к абстрактному поведению.
- source_word: בַּעֲצַת
  choice: по совету
  rationale: Передаёт как данный совет, так и руководящее влияние нечестивых; сочетание «идти по совету» понятно в поэтическом контексте.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Точно передаёт нравственно отрицательную характеристику людей, противопоставленных праведнику, без сужения значения до одной конкретной формы безбожия.
- source_word: דֶרֶךְ
  choice: пути
  rationale: Сохраняет конкретный образ дороги и его обычный для литературы мудрости переносный смысл — образ жизни.
- source_word: חַטָּאִים
  choice: грешников
  rationale: Прямой, общепонятный эквивалент субстантивированного множественного обозначения тех, кто грешит.
- source_word: עָמָד
  choice: стоит
  rationale: Сохраняет средний элемент поэтической последовательности «идёт — стоит — сидит» и не уточняет сверх текста степень сознательного присоединения.
- source_word: מוֹשַׁב
  choice: в кругу
  rationale: Существительное может обозначать место сидения, собрание или общество. «В кругу» естественно по-русски передаёт устойчивое пребывание среди определённого общества и сочетается с глаголом «сидит».
- source_word: לֵצִים
  choice: насмешников
  rationale: Обозначает людей, которые насмехаются и презрительно глумятся. «Насмешники» — современное и понятное слово без привнесения специально религиозного оттенка.
- source_word: יָשָׁב
  choice: сидит
  rationale: Сохраняет конкретный образ и завершает нарастающую последовательность от движения к устойчивому пребыванию.
theological_decisions:
- issue: Обобщённое существительное мужского рода в литературе мудрости
  choice: человек
  alternative: тот, кто
  rationale: Еврейский текст употребляет существительное мужского рода в единственном числе, однако описывает образцового праведного человека в общем смысле. Русское «человек» сохраняет грамматическую форму и репрезентативную функцию, не ограничивая высказывание только мужчинами.
- issue: Характер формулы אַשְׁרֵי
  choice: Блажен
  alternative: Счастлив
  rationale: «Блажен» сохраняет традиционную форму изречения о глубоко благополучной участи человека. Оно не утверждает напрямую, что Бог произносит формальное благословение, и не сводит смысл к мимолётной эмоции.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического изречения. Сохранена трёхчастная образная последовательность «идёт — стоит — сидит». Формулировка избегает как архаического «муж», которое в современном русском прежде всего значит «супруг», так и чрезмерно отвлечённого пересказа.
