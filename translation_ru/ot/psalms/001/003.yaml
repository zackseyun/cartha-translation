source:
  edition: WLC
  text: וְֽ/הָיָ֗ה כְּ/עֵץ֮ שָׁת֪וּל עַֽל פַּלְגֵ֫י מָ֥יִם אֲשֶׁ֤ר פִּרְי֨/וֹ יִתֵּ֬ן בְּ/עִתּ֗/וֹ וְ/עָלֵ֥/הוּ לֹֽא יִבּ֑וֹל וְ/כֹ֖ל אֲשֶׁר יַעֲשֶׂ֣ה יַצְלִֽיחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/003.yaml
  text: He will be like a tree planted by streams of water[a], which yields its fruit in its season, and its leaf does not wither; in all that he does, he prospers.
translation:
  language: ru
  text: Он будет как дерево, посаженное у потоков воды, которое приносит свой плод в своё время и чей лист не вянет; во всём, что он делает, он преуспевает.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и всё, что он делает, удаётся». Еврейский текст допускает понимание слов «всё, что он делает» как подлежащего заключительного глагола.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: Он будет
  rationale: Форма в данном поэтическом контексте передаёт результат образа жизни, описанного ранее; будущее время естественно связывает стих с предшествующим контекстом.
- source_word: כְּעֵץ
  choice: как дерево
  rationale: Предлог כְּ вводит прямое сравнение; это естественная и точная русская формулировка.
- source_word: שָׁתוּל
  choice: посаженное
  rationale: Страдательное причастие указывает на дерево, намеренно помещённое в благоприятное место; «посаженное» ясно передаёт основной смысл без излишнего уточнения «пересаженное».
- source_word: עַל פַלְגֵי מָיִם
  choice: у потоков воды
  rationale: פַלְגֵי может обозначать потоки, русла или водные каналы. «У потоков воды» сохраняет образ постоянного водоснабжения и звучит естественно по-русски.
- source_word: פִּרְיוֹ יִתֵּן
  choice: приносит свой плод
  rationale: Буквально дерево «даёт» плод; русский глагол «приносит» идиоматичен для плодоношения и сохраняет образ.
- source_word: בְּעִתּוֹ
  choice: в своё время
  rationale: Выражение обозначает надлежащее, назначенное время и не ограничивает смысл только сезонностью.
- source_word: וְעָלֵהוּ לֹא יִבּוֹל
  choice: и чей лист не вянет
  rationale: Сохранено единственное число собирательного образа «лист» и прямое значение глагола «вянуть».
- source_word: וְכֹל אֲשֶׁר יַעֲשֶׂה
  choice: во всём, что он делает
  rationale: Такая конструкция естественно подводит к личному пониманию заключительного глагола и сохраняет всеохватный смысл כֹל.
- source_word: יַצְלִיחַ
  choice: он преуспевает
  rationale: Hiphil глагола צלח выражает успех или благополучный исход. Личное прочтение сохраняет в центре внимания человека, описанного псалмом; допустимое альтернативное членение отражено в сноске.
theological_decisions:
- issue: Подлежащее заключительного глагола יַצְלִיחַ
  choice: 'Успех относится к человеку: «во всём, что он делает, он преуспевает».'
  alternative: 'Успех относится ко всему, что он делает: «всё, что он делает, удаётся».'
  rationale: Синтаксис еврейского текста допускает как возвращение к подразумеваемому человеку в качестве подлежащего, так и понимание выражения «всё, что он делает» как подлежащего заключительного глагола. Основной текст удерживает личную направленность псалма, а сноска сохраняет реальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис остаётся ясным для обычного читателя; образ дерева и неоднозначность заключительной строки сохранены.
