base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/002.yaml
  text: But his delight is in the law of Yahweh[b][a], and on his law he meditates day and night.
translation:
  language: ru
  text: Но он находит радость в законе Яхве[a] и размышляет над законом Яхве[b] день и ночь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в учении Яхве»; еврейское слово означает не только закон в узком смысле, но также наставление.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может также подразумевать, что человек негромко проговаривает или повторяет текст, вдумываясь в него.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: но
  rationale: После трёх отрицаний в Пс 1:1 оборот выражает противопоставление, а не причину; «но» естественно связывает стихи.
- source_word: בְּתוֹרַת
  choice: в законе
  rationale: תּוֹרָה охватывает наставление и открытое Богом учение, но здесь «закон» сохраняет заветный и Писанийный оттенок; более широкое значение отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: חֶפְצוֹ
  choice: радость его
  rationale: Слово обозначает то, в чём человек находит удовольствие и к чему расположен; «радость» естественно передаёт эту положительную устремлённость.
- source_word: וּבְתוֹרָתוֹ
  choice: и над Его законом
  rationale: Местоименный суффикс естественнее всего относится к Яхве. Предлог «над» соответствует русскому управлению глагола «размышлять», а повтор слова «закон» сохраняет параллелизм.
- source_word: יֶהְגֶּה
  choice: размышляет
  rationale: Глагол может обозначать как внутреннее обдумывание, так и тихое проговаривание. В основном тексте передан общий смысл продолжительного вдумчивого обращения к закону, а звуковой оттенок сохранён в сноске.
- source_word: יוֹמָם וָלָיְלָה
  choice: день и ночь
  rationale: Прямо сохраняет еврейскую меризму, выражающую постоянство, и её поэтический ритм.
theological_decisions:
- issue: Значение תּוֹרָה в псалме мудрости
  choice: закон
  alternative: учение; наставление
  rationale: «Закон» сохраняет связь с данным Яхве заветным откровением, тогда как сноска не позволяет сузить תּוֹרָה лишь до набора юридических предписаний.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет отличие имени от титула.
- issue: К кому относится суффикс в תוֹרָתוֹ
  choice: 'к Яхве: «Его законом»'
  alternative: формально возможное неоднозначное «его законом»
  rationale: Ближайший и смысловой антецедент — Яхве, чей закон уже назван в первой строке; прописная буква делает эту связь ясной, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «радость его» сохраняет лаконичность и ритм еврейской строки. Прописное «Его» однозначно относит закон к Яхве.
