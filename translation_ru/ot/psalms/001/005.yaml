id: PSA.1.5
reference: Psalms 1:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַל כֵּ֤ן לֹא יָקֻ֣מוּ רְ֭שָׁעִים בַּ/מִּשְׁפָּ֑ט וְ֝/חַטָּאִ֗ים בַּ/עֲדַ֥ת צַדִּיקִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/005.yaml
  text: Therefore the wicked will not stand in the judgment[b][a], nor sinners in the assembly of the righteous.
translation:
  language: ru
  text: Поэтому нечестивые не устоят на суде[a], и грешники — в собрании праведных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при суде». Еврейское выражение может обозначать судебное испытание или воздаяние вообще — как в нынешнем порядке вещей, так и на последнем суде.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в общине праведных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт логический вывод из предшествующего описания нечестивых кратко и естественно.
- source_word: יָקֻמוּ
  choice: не устоят
  rationale: 'Сохраняет образ стояния, выраженный глаголом קום, и его вероятный судебный оттенок: нечестивые не смогут выдержать суда.'
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Обычный и уместный для поэзии мудрости эквивалент, сохраняющий нравственную категорию, а не сводящий её только к юридической виновности.
- source_word: בַּמִּשְׁפָּט
  choice: на суде
  rationale: Естественная русская формулировка для судебного контекста; не уточняет, идёт ли речь о суде в настоящем, последнем суде или о более широком Божьем воздаянии.
- source_word: חַטָּאִים
  choice: грешники
  rationale: Прямой и естественный эквивалент, сохраняющий параллелизм с «нечестивыми».
- source_word: בַּעֲדַת
  choice: в собрании
  rationale: Передаёт значение организованного сообщества или собравшейся общины, оставаясь понятным современному читателю.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Традиционный и точный эквивалент, сохраняющий нравственное и заветное содержание данного обозначения.
theological_decisions:
- issue: Объём значения בַּמִּשְׁפָּט («на суде»)
  choice: Сохранено общее судебное значение без уточнения времени и характера суда.
  alternative: Понимать выражение исключительно как последний эсхатологический суд либо только как земное судебное разбирательство.
  rationale: Еврейский текст допускает более широкий смысл, охватывающий судебное испытание или воздаяние; перевод не разрешает эту богословскую напряжённость за автора.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. «Не устоят» сохраняет исходную метафору и звучит естественно; тире во второй строке восполняет пропущенный в еврейском параллельном члене глагол без его ненужного повторения.
