source:
  edition: WLC
  text: לֹא כֵ֥ן הָ/רְשָׁעִ֑ים כִּ֥י אִם כַּ֝/מֹּ֗ץ אֲֽשֶׁר תִּדְּפֶ֥/נּוּ רֽוּחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/001/004.yaml
  text: Not so the wicked; rather[a], they are like chaff that the wind drives away.
translation:
  language: ru
  text: Не таковы нечестивые; напротив, они — как мякина, которую гонит[a] ветер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «развевает».'
    reason: Лексически возможный вариант передачи תִּדְּפֶנּוּ, подчёркивающий действие ветра над мякиной.
lexical_decisions:
- source_word: לֹא כֵן
  choice: Не таковы
  rationale: Сохраняет резкое отрицательное противопоставление праведникам из предыдущего стиха, при этом естественно восполняя эллипсис по-русски.
- source_word: הָרְשָׁעִים
  choice: нечестивые
  rationale: Устоявшееся и уместное для литературы мудрости обозначение людей, живущих вопреки Божьей правде; оно не сводит смысл лишь к юридической виновности.
- source_word: כִּי אִם
  choice: напротив
  rationale: 'Передаёт сильное противительное уточнение: нечестивые не подобны плодоносящему дереву, а подобны мякине.'
- source_word: כַּמֹּץ
  choice: как мякина
  rationale: מֹץ — лёгкие отходы, отделяемые от зерна при веянии. «Мякина» точно сохраняет земледельческий образ и понятна в современном русском языке.
- source_word: אֲשֶׁר
  choice: которую
  rationale: Естественно вводит определительное придаточное и согласуется с существительным «мякина».
- source_word: תִּדְּפֶנּוּ
  choice: гонит
  rationale: Глагол נדף выражает движение под напором ветра. «Гонит» сохраняет активность образа и не добавляет отсутствующей в тексте идеи рассеивания.
- source_word: רוּחַ
  choice: ветер
  rationale: В контексте веяния зерна имеется в виду конкретное природное явление, а не «дух» или «дыхание».
theological_decisions: []
