lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: עֹז
  choice: сила
  rationale: Сохраняет основное значение существительного и не смешивает его со следующим образом оплота.
- source_word: לָמוֹ
  choice: для них
  rationale: Передаёт местоименный суффикс третьего лица множественного числа без контекстуального уточнения «для своего народа».
- source_word: מָעוֹז
  choice: оплот
  rationale: Естественно по-русски передаёт образ защищённого места и источника безопасности.
- source_word: יְשׁוּעוֹת
  choice: спасения
  rationale: В основном тексте употреблено естественное русское собирательное единственное число; грамматический множественный оригинала и его возможные оттенки отмечены в сноске.
- source_word: מְשִׁיחוֹ
  choice: своего помазанника
  rationale: Непосредственно передаёт обозначение помазанного Богом лица, не превращая его без необходимости в закрепившийся титул «Мессия».
- source_word: הוּא
  choice: он
  rationale: Самостоятельное местоимение передано явно, что сохраняет эмфатическое построение еврейской строки.
theological_decisions:
- issue: Передавать ли מְשִׁיחוֹ как титул «Мессия» или как описательное обозначение
  choice: своего помазанника
  alternative: своего Мессии
  rationale: В ближайшем контексте слово естественно обозначает помазанного царя, однако возможное мессианское звучание не исключается и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным параллелизмом псалма. Божественные местоимения оставлены со строчной буквы как обычная норма современного текста; «оплот» сохраняет крепостной образ и остаётся понятным широкому читателю.
