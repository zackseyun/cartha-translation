source:
  edition: WLC
  text: יְהוָ֤ה עֻזִּ֥/י וּ/מָגִנִּ/י֮ בּ֤/וֹ בָטַ֥ח לִבִּ֗/י וְֽ/נֶ֫עֱזָ֥רְתִּי וַ/יַּעֲלֹ֥ז לִבִּ֑/י וּֽ/מִ/שִּׁירִ֥/י אֲהוֹדֶֽ/נּוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/007.yaml
  text: Yahweh is my strength and my shield[a]; in him my heart trusts, and I am helped. Therefore my heart rejoices[c][b], and with my song I will praise him.
translation:
  language: ru
  text: 'Яхве — сила моя и щит мой;

    на Него уповало моё сердце, и я получил помощь.

    Возликовало моё сердце,

    и песней моей я прославлю Его.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я возблагодарю Его».'
    reason: Глагол ידה в данной форме может означать как прославление, так и благодарение.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом «Господь».
- source_word: עֻזִּי
  choice: сила моя
  rationale: Прямо передаёт значение существительного עֹז и естественно сочетается с параллельным образом щита.
- source_word: מָגִנִּי
  choice: щит мой
  rationale: Сохраняет ясную поэтическую метафору еврейского מָגֵן без обобщения до «защитника».
- source_word: בּוֹ בָטַח לִבִּי
  choice: на Него уповало моё сердце
  rationale: Управление «уповать на» естественно для современного литературного русского языка; прошедшее время отражает перфект בָטַח.
- source_word: וְנֶעֱזָרְתִּי
  choice: и я получил помощь
  rationale: Естественно передаёт пассивную форму «мне была оказана помощь / я был поддержан», не называя прямо невыраженного деятеля.
- source_word: וַיַּעֲלֹז לִבִּי
  choice: возликовало моё сердце
  rationale: Глагол עלז обозначает сильную, торжествующую радость; «возликовало» сохраняет поэтическую силу и последовательность прошедших действий.
- source_word: וּמִשִּׁירִי
  choice: и песней моей
  rationale: Передаёт песню как средство выражения хвалы и звучит естественно в русском поэтическом контексте.
- source_word: אֲהוֹדֶנּוּ
  choice: я прославлю Его
  rationale: Hiphil глагола ידה может выражать хвалу или благодарение; рядом с «песней» значение хвалы особенно уместно, а оттенок благодарения отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Исходный текст прямо употребляет личное имя Бога. «Яхве» сохраняет имя и не подменяет его титулом; «Иегова» основано на поздней традиции чтения.
- issue: Кто оказывает помощь
  choice: сохранена безлично-пассивная формулировка «я получил помощь»
  alternative: «Он помог мне»
  rationale: По контексту источником помощи является Яхве, однако еврейская форма пассивна и прямо не называет деятеля, поэтому перевод не делает это подразумеваемое отношение грамматически явным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической инверсией («сила моя», «сердце моё»). Сохранены образ щита, антропологическая метафора сердца и временная последовательность еврейских глагольных форм.
