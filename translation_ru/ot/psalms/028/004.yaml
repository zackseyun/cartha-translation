  terminology: «Воздать» и «по заслугам» адекватно передают судебно-воздаятельную лексику без конфессионального толкования. «Зло их поступков» сохраняет моральную окраску רֹעַ. В примечании следует уточнить, что «их» в формальной передаче означает воздаяние, причитающееся им, а не обязательно принадлежащую им награду.
