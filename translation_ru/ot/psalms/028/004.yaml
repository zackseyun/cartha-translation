base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/004.yaml
  text: Give to them according to their work[a], and according to the evil of their deeds; according to the work of their hands give to them; repay them their due.
translation:
  language: ru
  text: Воздай им по делам их и по злу их поступков; по делам рук их воздай им; воздай им по заслугам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более формально: «возврати им причитающееся им воздаяние».'
    reason: Передаёт буквальный образ הָשֵׁב גְּמוּלָם לָהֶם — возвращения людям соответствующего им воздаяния.
lexical_decisions:
- source_word: תֶּן
  choice: воздай
  rationale: Императив נתן обращён к Богу. В контексте соразмерного воздаяния русское «воздай» естественно передаёт не просто передачу чего-либо, а просьбу о справедливом ответе за содеянное.
- source_word: כְּפָעֳלָם
  choice: по делам их
  rationale: Передаёт значение поступка или содеянного и сохраняет соразмерную формулу с כְּ־, а также собирательный характер еврейского единственного числа.
- source_word: וּכְרֹעַ מַעַלְלֵיהֶם
  choice: по злу их поступков
  rationale: Сохраняет нравственную оценку רֹעַ и прямо связывает зло с их действиями, не усиливая значение до более узкого «нечестия».
- source_word: כְּמַעֲשֵׂה יְדֵיהֶם
  choice: по делам рук их
  rationale: Сохраняет еврейский образ рук как обозначение того, что люди сами сделали, и поддерживает поэтический параллелизм.
- source_word: הָשֵׁב
  choice: обрати на них
  rationale: Каузатив שוב буквально выражает возвращение воздаяния на виновных; «обрати на них» сохраняет этот образ и судебный смысл.
- source_word: גְּמוּלָם
  choice: то, чего они заслужили
  rationale: גְּמוּל обозначает заслуженное воздаяние или отплату. Эта формулировка ясна современному читателю и не предполагает положительной награды.
theological_decisions:
- issue: Просьба о Божьем воздаянии
  choice: Стих передан как прямая просьба к Богу воздать людям соразмерно их поступкам.
  alternative: Смягчить текст до отвлечённого утверждения о последствиях поступков.
  rationale: Повторяющиеся повелительные формы תֶּן и הָשֵׁב однозначно выражают прошение, а конструкции с כְּ־ подчёркивают соответствие воздаяния содеянному.
- issue: Значение גְּמוּלָם
  choice: «то, чего они заслужили»
  alternative: «воздаяние их» или «отплату им»
  rationale: Еврейское слово допускает формально-абстрактное «воздаяние», но в данном контексте речь идёт о заслуженном ответе за злые дела; основной текст передаёт это естественно, а формальная альтернатива вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмовым ритмом. Инверсия «делам их», «рук их» сохраняет достоинство и параллелизм, оставаясь понятной. Лексика не смягчает просительный характер и тему справедливого воздаяния.
