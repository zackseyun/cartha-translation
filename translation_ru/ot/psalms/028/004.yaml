  source_fidelity: 'Первые две двучленные просьбы переданы верно: כְּ־ выражено через «по», רֹעַ сохранено как «зло», а образ «дел рук» удержан. В последней строке «обрати на них то, чего они заслужили» передаёт общий судебный смысл, но существенно отдаляется от הָשֵׁב גְּמוּלָם לָהֶם, где речь о возвращении/воздаянии причитающегося им возмездия. Более прямое «воздай им по заслугам» естественно передаёт смысл глагола и существительного без неясного местоименного оборота.'
