  text: הוֹשִׁ֤יעָ/ה אֶת עַמֶּ֗/ךָ וּ/בָרֵ֥ךְ אֶת נַחֲלָתֶ֑/ךָ וּֽ/רְעֵ֥/ם וְ֝/נַשְּׂאֵ֗/ם עַד הָ/עוֹלָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/009.yaml
  text: Save your people and bless your inheritance[b][a]; shepherd them and carry them forever.
translation:
  language: ru
  text: Спаси народ Твой и благослови наследие Твоё; паси их[a] и неси их[b] вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будь их пастырем»; еврейский глагол может означать как кормление стада, так и всё пастушеское попечение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подними их» или «поддерживай их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Спаси
  rationale: Повелительная форма глагола ישׁע в обращённой к Богу молитве. «Спаси» естественно и прямо передаёт просьбу об избавлении.
- source_word: עַמֶּךָ
  choice: народ Твой
  rationale: Существительное עם с суффиксом 2-го лица мужского рода единственного числа обозначает принадлежащий Богу народ. Порядок слов поддерживает возвышенный молитвенный регистр.
- source_word: בָרֵךְ
  choice: благослови
  rationale: Повелительная форма ברך; традиционный и ясный русский эквивалент сохраняет литургическое звучание.
- source_word: נַחֲלָתֶךָ
  choice: наследие Твоё
  rationale: נחלה означает наследственный удел, достояние или владение. «Наследие Твоё» сохраняет образ народа как принадлежащего Богу удела и звучит естественно в поэтической молитве.
- source_word: רְעֵם
  choice: паси их
  rationale: רעה обозначает заботу пастуха о стаде, включая кормление и более широкое попечение. Русское «паси» сохраняет пастырский образ и не сводит смысл только к кормлению.
- source_word: נַשְּׂאֵם
  choice: неси их
  rationale: נשא может означать поднимать, нести или поддерживать. В сочетании с пастырским образом «неси их» естественно выражает защитную заботу, не устраняя лексическую многозначность, отмеченную в сноске.
- source_word: עַד הָעוֹלָם
  choice: вовеки
  rationale: Выражение указывает на непрекращающуюся длительность. «Вовеки» понятно современному читателю и соответствует возвышенному поэтическому регистру псалма.
theological_decisions:
- issue: Пастырский образ в רְעֵם
  choice: паси их
  alternative: корми их; будь их пастырем
  rationale: Глагол охватывает всё попечение пастуха, а не только кормление. «Паси их» сохраняет ёмкость исходного образа без внесения дополнительных доктринальных уточнений.
- issue: Заветная принадлежность в נַחֲלָתֶךָ
  choice: наследие Твоё
  alternative: достояние Твоё; удел Твой
  rationale: Фраза представляет народ как Божий удел или владение. «Наследие Твоё» сохраняет метафору и её богословское напряжение.
- issue: Многозначность נשא
  choice: неси их
  alternative: подними их; поддерживай их
  rationale: Контекст допускает как образ несения, так и поднятия или поддержания. Основной текст следует естественному пастырскому образу, а сноска сохраняет альтернативы.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным молитвенно-поэтическим звучанием. Инверсия «народ Твой», «наследие Твоё» сохраняет достоинство псалмового обращения, не переходя в архаизацию.
