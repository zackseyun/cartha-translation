  text: שְׁמַ֤ע ק֣וֹל תַּ֭חֲנוּנַ/י בְּ/שַׁוְּעִ֣/י אֵלֶ֑י/ךָ בְּ/נָשְׂאִ֥/י יָ֝דַ֗/י אֶל דְּבִ֥יר קָדְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/002.yaml
  text: Hear the voice of my pleas for mercy when I cry to you[c][b][a], when I lift up my hands toward your holy inner sanctuary.
translation:
  language: ru
  text: Услышь голос моих молений о милости, когда я взываю к Тебе, когда простираю руки к Твоему святому внутреннему святилищу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к внутренней части Твоего святилища». Еврейское слово обозначает внутреннее, наиболее священное помещение святилища.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Услышь
  rationale: Повелительная форма выражает прямую и настойчивую молитвенную просьбу к Богу; «услышь» естественно для современного русского библейского регистра.
- source_word: קוֹל תַּחֲנוּנַי
  choice: голос моих молений о милости
  rationale: קוֹל сохраняется как конкретное «голос», а תַּחֲנוּנִים передаёт настойчивые просьбы о благосклонности и милости. Формулировка сохраняет образность еврейского текста и остаётся понятной.
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: когда я взываю к Тебе
  rationale: Предлог ב с инфинитивом имеет временное значение; «взываю» передаёт напряжённость שׁוע точнее, чем нейтральное «обращаюсь».
- source_word: בְּנָשְׂאִי יָדַי
  choice: когда простираю руки
  rationale: Сочетание буквально описывает молитвенный жест. «Простираю руки» естественнее в русском возвышенном регистре, чем буквальное «поднимаю мои руки».
- source_word: אֶל דְּבִיר קָדְשֶׁךָ
  choice: к Твоему святому внутреннему святилищу
  rationale: דְּבִיר обозначает внутреннее, наиболее священное помещение святилища. Перевод сохраняет пространственную и культовую конкретность, не заменяя её более общим «храмом».
theological_decisions:
- issue: Культовое значение דְּבִיר קָדְשֶׁךָ
  choice: Твоему святому внутреннему святилищу
  alternative: Твоему святому святилищу; внутренней части Твоего святилища
  rationale: Текст указывает на внутреннее священное помещение, связанное с присутствием Бога. Конкретная передача сохраняет храмовый образ, не привнося более поздних доктринальных уточнений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому оформлению; синтаксический параллелизм оригинала сохранён.
