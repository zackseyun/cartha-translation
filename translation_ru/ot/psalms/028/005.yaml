  text: כִּ֤י לֹ֤א יָבִ֡ינוּ אֶל פְּעֻלֹּ֣ת יְ֭הוָה וְ/אֶל מַעֲשֵׂ֣ה יָדָ֑י/ו יֶ֝הֶרְסֵ֗/ם וְ/לֹ֣א יִבְנֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/005.yaml
  text: Because they do not understand the works of Yahweh or the work of his hands[a], he will tear them down and not build them up.
translation:
  language: ru
  text: Ибо они не постигают деяний Яхве и дела Его рук.[a] Он разрушит их и не воздвигнет их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо они не обращают внимания на деяния Яхве и на дело Его рук».'
    reason: Глагол בין с предлогом אֶל может выражать не только понимание, но и внимательное отношение, принятие во внимание.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт причинно-пояснительную связь с предшествующим прошением, естественно продолжая русскую поэтическую речь.
- source_word: לֹא יָבִינוּ אֶל
  choice: не постигают
  rationale: Глагол בין с אֶל обозначает направленное понимание и осмысление; «не постигают» сохраняет смысл глубже простого восприятия.
- source_word: פְּעֻלֹּת יְהוָה
  choice: деяний Яхве
  rationale: «Деяния» естественно обозначают совершаемые Богом действия; личное имя יהוה передано как «Яхве».
- source_word: מַעֲשֵׂה יָדָיו
  choice: того, что совершили Его руки
  rationale: Передаёт еврейский образ и единственное число собирательно, не ограничивая смысл только сотворёнными предметами.
- source_word: יֶהֶרְסֵם
  choice: Он разрушит их
  rationale: Сохраняет метафору сноса или разрушения, противопоставленную последующему глаголу «строить».
- source_word: וְלֹא יִבְנֵם
  choice: и уже не восстановит
  rationale: В контексте разрушения בנה может означать последующее созидание или восстановление; «уже» естественно выражает окончательность, подразумеваемую сочетанием двух действий.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, не заменяя титулом.
- issue: Характер непонимания нечестивых
  choice: не постигают
  alternative: не обращают внимания; не считаются
  rationale: Форма בין допускает оттенок разумения или внимательного осмысления. Основной текст сохраняет значение понимания, а альтернативный волевой оттенок отмечен в сноске.
- issue: Смысл заключительного וְלֹא יִבְנֵם
  choice: уже не восстановит
  alternative: не созиждет их; не отстроит их
  rationale: Сохраняется антитеза разрушения и строительства. «Восстановит» ясно передаёт образ повторного возведения после разрушения, не превращая его в утверждение о духовном назидании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Параллелизм двух обозначений Божьих дел сохранён без тяжеловесного буквального повтора; антитеза разрушения и восстановления выражена ясно.
