  - severity: low
    issue: «того, что совершили Его руки» ослабляет формальный параллелизм и заменяет единственное «дело» описательным оборотом.
    rationale: מַעֲשֵׂה стоит в единственном числе и прямо означает «дело/творение, сделанное руками». «Дело Его рук» естественно по-русски и ближе к исходному образу.
  revised_text: Ибо они не постигают деяний Яхве и дела Его рук.[a] Он разрушит их и не воздвигнет их.
