  text: בָּר֥וּךְ יְהוָ֑ה כִּי שָׁ֝מַע ק֣וֹל תַּחֲנוּנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/006.yaml
  text: Blessed be Yahweh[b][a], for he has heard the voice of my pleas for mercy.
translation:
  language: ru
  text: Благословен Яхве, ибо он услышал голос моих молений о милости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Страдательное причастие употреблено как торжественное славословие; краткая форма естественно передаёт еврейскую формулу без добавления повелительного оттенка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание для славословия; «ибо» ясно сохраняет причинную связь и соответствует возвышенному поэтическому регистру.
- source_word: שָׁמַע
  choice: услышал
  rationale: Перфект обозначает совершившееся действие, которое стало причиной нынешней хвалы.
- source_word: קוֹל
  choice: голос
  rationale: Слово может означать «голос» или «звук»; в контексте личной молитвы «голос» звучит естественнее и сохраняет еврейский образ.
- source_word: תַּחֲנוּנָי
  choice: моих молений о милости
  rationale: Форма множественного числа с суффиксом первого лица обозначает настойчивые просьбы о благосклонности или милости; перевод сохраняет и множественность, и смысл просьбы о милосердии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим звучанием. Местоимение «он» написано со строчной буквы по общим нормам современного русского языка; богословского умаления это не выражает.
