base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/003.yaml
  text: Do not drag me away with the wicked[a], with those who work evil[b], who speak peace with their neighbors while evil is in their hearts.
translation:
  language: ru
  text: Не увлеки меня вместе с нечестивыми, с теми, кто творит зло, кто мирно говорит со своими ближними[a], а в сердце у них — зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со своими друзьями»; также возможно: «со своими товарищами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְשְׁכֵנִי
  choice: не увлеки меня
  rationale: Глагол משׁך обозначает движение под действием внешней силы и здесь, вероятно, означает быть унесённым вместе с другими к общей участи. «Не увлеки меня» передаёт силу просьбы естественно по-русски, не уточняя, каким именно образом это произойдёт.
- source_word: רְשָׁעִים
  choice: нечестивыми
  rationale: Традиционное и понятное в поэтическом библейском контексте обозначение людей, нравственно противящихся Богу; оно точнее, чем чисто юридическое «виновными».
- source_word: פֹּעֲלֵי אָוֶן
  choice: теми, кто творит зло
  rationale: Передаёт деятельный смысл причастия פֹּעֲלֵי и нравственное значение אָוֶן современным, доступным языком.
- source_word: דֹּבְרֵי שָׁלוֹם
  choice: кто говорит о мире
  rationale: Сохраняет еврейский образ мирных речей и контраст между внешними словами и внутренним злом; не добавляет прямо не выраженных понятий искренности или обмана.
- source_word: רֵעֵיהֶם
  choice: со своими ближними
  rationale: רֵעַ допускает значения ближнего, товарища или друга. «Ближние» охватывает социальное окружение, не предполагая обязательно тесной дружбы.
- source_word: רָעָה
  choice: зло
  rationale: В контексте противопоставления мирной речи и состояния сердца слово указывает на злой умысел или внутреннее зло. Более широкое «зло» сохраняет неоднозначность оригинала.
- source_word: בִּלְבָבָם
  choice: в сердце у них
  rationale: Естественная русская конструкция, сохраняющая библейское представление о сердце как средоточии намерений и мыслей. Формально единственное число соответствует собирательному употреблению в русском.
theological_decisions:
- issue: Характер просьбы псалмопевца о его отношении к участи нечестивых
  choice: Просьба не увлечь его вместе с нечестивыми к общей участи
  alternative: Просьба лишь не допустить его нравственного уподобления нечестивым
  rationale: Сочетание תִּמְשְׁכֵנִי с עִם естественнее указывает на совместное увлечение или удаление, вероятно к суду, чем только на нравственное подражание. Перевод не называет суд прямо и тем самым сохраняет недосказанность еврейского текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой лексикой. Синтаксис сохраняет поэтический параллелизм, но остаётся понятным обычному читателю. «Нечестивые» уместно для жанра; более архаичные «делатели беззакония» и «глаголющие мир» отвергнуты.
