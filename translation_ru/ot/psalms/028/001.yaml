source:
  edition: WLC
  text: לְ/דָוִ֡ד אֵ֘לֶ֤י/ךָ יְהוָ֨ה אֶקְרָ֗א צוּרִ/י֮ אַֽל תֶּחֱרַ֪שׁ מִ֫מֶּ֥/נִּי פֶּן תֶּֽחֱשֶׁ֥ה מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם י֥וֹרְדֵי בֽוֹר׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/001.yaml
  text: Of David[a]. To you, O Yahweh, I call; my rock, do not be deaf to me[c][b], lest you be silent to me and I become like those who go down to the pit.
translation:
  language: ru
  text: Псалом Давида[a]. К Тебе, Яхве, взываю; скала моя, не будь глух ко мне[b], иначе, если Ты будешь молчать, я уподоблюсь сходящим в могилу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давиду»; надписание может указывать на авторство, принадлежность или посвящение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не молчи передо мной». Еврейский глагол может обозначать глухоту или молчание; перевод различает его и следующий глагол со значением «быть безмолвным».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в яму». Здесь это образ могилы или мира мёртвых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Псалом Давида
  rationale: Предлог לְ в надписаниях допускает связь с авторством, принадлежностью или посвящением. Традиционная и естественная русская формула «Псалом Давида» не сужает эту связь до однозначного «написан Давидом».
- source_word: אֵלֶיךָ
  choice: К Тебе
  rationale: Сохраняет направленность молитвенного обращения и естественно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֶקְרָא
  choice: взываю
  rationale: В данном молитвенном контексте קרא означает обращённый к Богу призыв. «Взываю» передаёт это точнее и поэтичнее, чем нейтральное «зову».
- source_word: צוּרִי
  choice: Скала моя
  rationale: Сохраняет конкретную метафору Бога как прочной защиты; «скала» для צוּר точнее, чем более общее «твердыня» или истолковывающее «убежище».
- source_word: אַל־תֶּחֱרַשׁ מִמֶּנִּי
  choice: не будь глух ко мне
  rationale: חרשׁ может означать как глухоту, так и молчание. Выбор «не будь глух» сохраняет вероятное различие и игру смыслов с последующим חשה, явно обозначающим молчание.
- source_word: פֶּן־תֶּחֱשֶׁה מִמֶּנִּי
  choice: Если Ты будешь безмолвен со мной
  rationale: פֶּן вводит опасаемый исход, который в современном русском естественно выражается условной конструкцией; «будешь безмолвен» передаёт отсутствие ответа и не смешивается с предшествующей глухотой.
- source_word: וְנִמְשַׁלְתִּי
  choice: я уподоблюсь
  rationale: Нифаль от משל здесь означает «стать подобным, быть приравненным». «Уподоблюсь» кратко и уместно для возвышенной поэзии.
- source_word: עִם־יֹרְדֵי בוֹר
  choice: сходящим в могилу
  rationale: Передаёт устойчивый образ нисхождения в место смерти. «Могила» понятна современному читателю, при этом примечание сохраняет более буквальный образ ямы и возможную связь с миром мёртвых.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер образа בוֹר
  choice: могила с примечанием о буквальном «яме»
  alternative: яма; преисподняя; мир мёртвых
  rationale: Контекст указывает на смерть, но слово сохраняет конкретный образ ямы и не требует однозначно отождествлять её с особым богословским представлением о загробном мире.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Сохранены прямое обращение, метафора скалы и смысловое напряжение между тем, что Бог не слышит, и тем, что Он не отвечает. Местоимения обращения к Богу написаны с прописной буквы согласно распространённой русской религиозной норме.
