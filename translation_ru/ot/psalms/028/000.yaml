base_translation:
  language: en
  yaml_path: translation/ot/psalms/028/000.yaml
  text: Of David[a]. To you, Yahweh, I call; my rock, do not be deaf to me, lest if you are silent to me[c][b], I become like those going down to the pit.
translation:
  language: ru
  text: 'Давида.[a]


    К Тебе, Яхве, я взываю! Скала моя, не оставайся глух ко мне; если Ты будешь молчать, я стану подобен сходящим в яму.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давиду». Надпись может указывать на авторство Давида, принадлежность ему либо посвящение или связь с ним.'
    reason: source_ambiguity
  - marker: b
    text: «Яма» может означать могилу или область умерших.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая надпись передана традиционной русской формой, допускающей авторство или связь псалма с Давидом; неоднозначность предлога לְ отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: צוּרִי
  choice: Скала моя
  rationale: Сохранён конкретный образ надёжной защиты и опоры.
- source_word: אַל־תֶּחֱרַשׁ ... תֶּחֱשֶׁה
  choice: не оставайся глух ко мне; если Ты будешь молчать, не отвечая мне
  rationale: 'Передано намеренное соседство близких образов: сначала просьба не быть глухим, затем опасение остаться без ответа. Добавление «не отвечая мне» естественно выражает направленность молчания в контексте молитвы.'
- source_word: בּוֹר
  choice: могилу
  rationale: В данном параллелизме слово обозначает могильную яму и, шире, участь умерших; основной текст использует понятное русское соответствие, а диапазон значения указан в сноске.
theological_decisions:
- issue: Связь Божьего молчания с уподоблением умершим
  choice: 'Сохранена условно-следственная связь: «если Ты будешь молчать… я стану подобен»'
  alternative: «не будь безмолвен… иначе я стану подобен»
  rationale: Так русский текст естественно передаёт опасение, вводимое פֶּן, не превращая вторую еврейскую глагольную форму в ещё одно повеление.
- issue: Значение «сходящих в яму»
  choice: «сходящим в могилу»
  alternative: «нисходящим в преисподнюю»
  rationale: Текст говорит об участи идущих к смерти, но сам по себе не требует более разработанного представления о загробном мире.
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью. Синтаксис сделан ясным для чтения вслух; метафоры «Скала моя» и «глух ко мне» сохранены. Местоимения, обращённые к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
