  text: בֵּ֣ית אַ֭הֲרֹן בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/010.yaml
  text: O house of Aaron[a], trust in Yahweh[b]; he is their help and their shield.
translation:
  language: ru
  text: 'Дом Аарона, уповайте на Яхве[a]: Он — их помощь и их щит[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה — личное имя Бога, здесь переданное как «Яхве».
    reason: divine_name
  - marker: b
    text: 'Еврейский текст переходит от прямого обращения «уповайте» к третьему лицу: буквально «их помощь и их щит».'
    reason: grammatical_shift
lexical_decisions:
- source_word: בֵּית אַהֲרֹן
  choice: Дом Аарона
  rationale: Буквально «дом Аарона»; в контексте это обращение к священническому роду. Сохранены еврейский образ и параллелизм с соседними обращениями.
- source_word: בִּטְחוּ
  choice: уповайте
  rationale: Форма повелительного наклонения во множественном числе от בטח. «Уповайте» естественно сочетается с обращением к Богу и сохраняет возвышенный, но понятный регистр псалма.
- source_word: בַיהוָה
  choice: на Яхве
  rationale: Предлог ב при глаголе בטח обозначает того, на кого полагаются; по-русски нормативно «уповать на». Имя יהוה передано как «Яхве».
- source_word: עֶזְרָם
  choice: их помощь
  rationale: Существительное עֵזֶר с суффиксом 3-го лица множественного числа буквально означает «их помощь». Сохранён переход оригинала от прямого обращения ко множественному числу третьего лица.
- source_word: וּמָגִנָּם
  choice: и их щит
  rationale: מָגֵן — конкретный образ щита. Он сохранён вместо пояснительного «защитник» и параллелен слову «помощь».
- source_word: הוּא
  choice: Он —
  rationale: Самостоятельное местоимение подчёркивает подлежащее в именном предложении; русское тире естественно передаёт связку без добавления отсутствующего в тексте значения «только».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное заветное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем Бога и титулом «Господь».
- issue: Смена лица между призывом и утверждением
  choice: «уповайте… их помощь и их щит»
  alternative: «уповайте… ваша помощь и ваш щит»
  rationale: Еврейский текст переходит от повелительного обращения во 2-м лице к местоименным суффиксам 3-го лица множественного числа. Этот грамматический сдвиг сохранён, чтобы не сглаживать структуру источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой лексикой. «Уповайте» сохраняет торжественность без архаической формы; порядок слов и тире обеспечивают ясное, ритмичное чтение.
