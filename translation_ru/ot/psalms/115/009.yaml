  text: יִ֭שְׂרָאֵל בְּטַ֣ח בַּ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/009.yaml
  text: Israel[a], trust in Yahweh; he is their help and their shield.
translation:
  language: ru
  text: Израиль, уповай на Яхве! Он — их помощь и их щит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Собственное имя, здесь обозначающее народ завета; передано в традиционной русской форме.
- source_word: בְּטַח
  choice: уповай
  rationale: Повелительная форма 2-го лица единственного числа обращена к Израилю как к единому народу. «Уповай» естественно сочетается с предлогом «на» и сохраняет возвышенный, но понятный регистр псалма.
- source_word: בַּיהוָה
  choice: на Яхве
  rationale: Предлог ב обозначает объект доверия, а יהוה — личное Божье имя. В русском сочетании с «уповать» естественно управление «на Яхве».
- source_word: עֶזְרָם
  choice: их помощь
  rationale: Существительное «помощь» с суффиксом 3-го лица множественного числа передано буквально, без истолковывающей замены на «помощник».
- source_word: וּמָגִנָּם
  choice: и их щит
  rationale: Сохранён конкретный образ щита и суффикс множественного числа.
- source_word: הוּא
  choice: Он —
  rationale: Самостоятельное местоимение имеет подчёркивающую функцию; тире естественно передаёт именное сказуемое в русском языке.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и соответствует предоставленному решению проекта.
- issue: Смена числа между обращением и местоименными суффиксами
  choice: «Израиль, уповай» и затем «их помощь, их щит»
  alternative: 'Согласовать всё в единственном числе: «твоя помощь и твой щит»'
  rationale: В еврейском обращение к коллективному Израилю и повеление стоят в единственном числе, тогда как суффиксы при «помощи» и «щите» — во множественном. Эта грамматическая напряжённость сохранена, а не сглажена.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. «Уповай» несколько возвышенно, но широко понятно и стилистически уместно для Псалтири; синтаксис остаётся кратким и энергичным.
