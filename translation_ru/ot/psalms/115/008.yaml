base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/008.yaml
  text: Those who make them become like them[b][a], as does everyone who trusts in them.
translation:
  language: ru
  text: Подобными им[b] станут[a] те, кто их делает, как и все, кто на них уповает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут подобны им». Еврейский глагол может означать как «быть», так и «становиться»; здесь «станут» подчёркивает итоговое уподобление.'
    reason: lexical_alternative
  - marker: b
    text: То есть подобными идолам — безмолвным, незрячим, неслышащим и бессильным, как сказано в предыдущих стихах.
    reason: cross_reference
lexical_decisions:
- source_word: כְּמוֹהֶם
  choice: подобными им
  rationale: Передаёт выраженное предлогом כְּ сравнение с идолами из предыдущих стихов; препозиция сохраняет эмфатический порядок еврейской строки.
- source_word: יִהְיוּ
  choice: станут
  rationale: Форма היה допускает значение «будут» или «станут»; при сравнительном сказуемом «станут» естественно передаёт возникающее уподобление.
- source_word: עֹשֵׂיהֶם
  choice: те, кто их делает
  rationale: Причастие с местоименным суффиксом обозначает изготовителей идолов; такая формулировка ясна современному читателю и сохраняет действие.
- source_word: כֹּל אֲשֶׁר
  choice: все, кто
  rationale: Сохраняет универсальный охват конструкции и естественно звучит по-русски.
- source_word: בֹּטֵחַ בָּהֶם
  choice: на них уповает
  rationale: בטח с ב выражает доверие и опору; «уповает на» уместно в религиозном контексте и сохраняет возвышенный, но понятный регистр.
theological_decisions:
- issue: Характер уподобления идолам
  choice: В основном тексте утверждается уподобление изготовителей и почитателей идолам без уточнения его механизма или всех проявлений.
  alternative: Прямо пояснить, что они становятся духовно бесчувственными и бессильными, как идолы.
  rationale: Сам стих не раскрывает всех сторон подобия; связь с немотой, слепотой, глухотой и бессилием следует из предыдущих стихов и потому вынесена в примечание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским словом «уповает». Инверсия «Подобными им станут» воспроизводит акцент исходной строки и остаётся естественной для поэтической речи. Маркеры примечаний расположены после всего утверждения в порядке [a][b].
