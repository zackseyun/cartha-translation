source:
  edition: WLC
  text: לֹ֤א לָ֥/נוּ יְהוָ֗ה לֹ֫א לָ֥/נוּ כִּֽי לְ֭/שִׁמְ/ךָ תֵּ֣ן כָּב֑וֹד עַל חַ֝סְדְּ/ךָ֗ עַל אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/001.yaml
  text: Not to us[a], O Yahweh, not to us, but to your name give glory, because of your steadfast love, because of your faithfulness.
translation:
  language: ru
  text: Не нам, Яхве, не нам — но имени твоему воздай славу ради твоей неизменной любви, ради твоей верности[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради твоей истины».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, стоящее в еврейском тексте, общепринятой русской транслитерацией.
- source_word: לֹא לָנוּ ... לֹא לָנוּ
  choice: Не нам… не нам
  rationale: Сохраняет эмфатическое отрицание и поэтический повтор исходного текста.
- source_word: תֵּן כָּבוֹד
  choice: воздай славу
  rationale: Естественное русское выражение для приписывания славы; оно не подразумевает, будто Бог прежде был её лишён.
- source_word: לְשִׁמְךָ
  choice: имени твоему
  rationale: Сохраняет конкретный образ «имени», включающий репутацию и явленный характер Бога.
- source_word: כִּי
  choice: но
  rationale: 'После двойного отрицания частица вводит контрастный положительный призыв: слава должна принадлежать не людям, а Божьему имени.'
- source_word: עַל
  choice: ради
  rationale: Передаёт основание и мотив просьбы и при этом естественно звучит в русской поэтической речи.
- source_word: חַסְדְּךָ
  choice: твоей неизменной любви
  rationale: Передаёт одновременно любовь, верность обязательствам и постоянство, заключённые в חֶסֶד, без архаичной лексики.
- source_word: אֲמִתֶּךָ
  choice: твоей верности
  rationale: В устойчивой смысловой паре с חֶסֶד слово обозначает надёжность и верность Бога; буквальное значение «истина» сохраняется в сноске.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя и соответствует наиболее принятой научной реконструкции произношения.
- issue: Значение אֲמִתֶּךָ в параллели с חַסְדְּךָ
  choice: верность
  alternative: истина
  rationale: В данном сочетании на первом плане, вероятнее всего, Божья надёжность и постоянство, однако лексически возможное и традиционное значение «истина» не исключается и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Сохранены повтор «не нам» и обращение по имени; местоимения, относящиеся к Богу, даны со строчной буквы по нормам современного общего издания.
