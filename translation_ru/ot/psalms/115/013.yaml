  text: יְ֭בָרֵךְ יִרְאֵ֣י יְהוָ֑ה הַ֝/קְּטַנִּ֗ים עִם הַ/גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/013.yaml
  text: He will bless those who fear Yahweh[a], the small together with the great.
translation:
  language: ru
  text: Он благословит боящихся Яхве — малых вместе с великими.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «самых незначительных вместе с великими». Еврейские слова широко противопоставляют «малых» и «великих» и, вероятно, говорят в том числе об общественном положении, а не только о размере или возрасте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֵךְ
  choice: Он благословит
  rationale: Пиэль, имперфект, 3-е лицо мужского рода единственного числа от ברך. Подразумеваемый субъект — Яхве из ближайшего контекста; форма передаёт уверенное обещание, а не пожелание.
- source_word: יִרְאֵי יְהוָה
  choice: боящихся Яхве
  rationale: Субстантивированное причастие в сопряжённой конструкции. Русское выражение сохраняет библейский смысл благоговейного страха и не сводит ירא к простому уважению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом «Господь».
- source_word: הַקְּטַנִּים
  choice: малых
  rationale: Субстантивированное прилагательное, противопоставленное «великим». Выбор сохраняет широту значения, не ограничивая его возрастом, физическим размером или общественным положением.
- source_word: עִם
  choice: вместе с
  rationale: Предлог соединяет обе группы и подчёркивает, что благословение охватывает их совместно.
- source_word: הַגְּדֹלִים
  choice: великими
  rationale: Субстантивированное прилагательное в паре с «малыми»; может указывать на более высокое положение, значимость или известность, но перевод не сужает смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя и не заменяет его титулом.
- issue: Модальность יְבָרֵךְ
  choice: утверждение «Он благословит»
  alternative: пожелание «Да благословит Он»; настоящее время «Он благословляет»
  rationale: Контекст псалма представляет благословение как уверенное заверение; при этом сама форма имперфекта допускает и иные оттенки, но декларативное будущее здесь наиболее вероятно.
translation_notes:
  register: 'Современный литературный русский язык с сохранением достоинства поэтической речи. Тире обозначает пояснение: кого именно благословит Яхве. Формула «малых вместе с великими» намеренно сохраняет широкое и несколько необычное противопоставление оригинала.'
