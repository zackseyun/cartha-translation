  text: וַ/אֲנַ֤חְנוּ נְבָ֘רֵ֤ךְ יָ֗הּ מֵֽ/עַתָּ֥ה וְ/עַד עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/018.yaml
  text: But we will bless Yah from now and forever[b][a]. Praise Yah!
translation:
  language: ru
  text: А мы будем благословлять Яха[a] отныне и вовеки. Хвалите Яха![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ях» — краткая поэтическая форма Божьего имени; в некоторых переводах её традиционно передают словом «Господь».
    reason: alternative_reading
  - marker: b
    text: Еврейское выражение «Хвалите Яха!» стало источником традиционного литургического возгласа «аллилуйя».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: А мы
  rationale: Самостоятельное местоимение вместе с союзом подчёркивает противопоставление умершим из предыдущего стиха; «А мы» естественно передаёт этот контраст по-русски.
- source_word: נְבָרֵךְ
  choice: будем благословлять
  rationale: Форма пиэль, имперфект, 1-е лицо множественного числа выражает продолжающееся и обращённое в будущее намерение общины.
- source_word: יָהּ
  choice: Ях
  rationale: Сохранена краткая поэтическая форма Божьего имени, отличная от полного тетраграмматона יהוה; русская передача «Ях» также делает прозрачным происхождение возгласа «аллилуйя».
- source_word: מֵעַתָּה
  choice: отныне
  rationale: Кратко и литературно передаёт начало действия с настоящего момента.
- source_word: וְעַד עוֹלָם
  choice: и вовеки
  rationale: Естественная для возвышенной русской речи формула, передающая неограниченную длительность без излишней архаизации.
- source_word: הַלְלוּ יָהּ
  choice: Хвалите Ях!
  rationale: Перевод повелительного множественного числа и краткой формы имени сохраняет буквальный смысл и силу заключительного литургического возгласа.
theological_decisions:
- issue: Передача краткой поэтической формы Божьего имени יָהּ
  choice: Ях
  alternative: Господа; Яхве
  rationale: В исходном тексте дважды употреблена именно краткая форма יָהּ, а не יהוה. Передача «Ях» сохраняет это различие и не подменяет форму имени титулом.
- issue: Передача הַלְלוּ יָהּ как перевода или традиционного возгласа
  choice: Хвалите Ях!
  alternative: Аллилуйя!
  rationale: Перевод раскрывает значение обеих частей еврейского выражения; традиционная транслитерация отмечена в сноске, поэтому литургическая связь не утрачивается.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмовым звучанием. «Отныне» и «вовеки» уместны в поэтическом и богослужебном контексте, но остаются понятными современному читателю. Контрастное «А мы» сохраняет связь с предыдущим стихом.
