  text: They have mouths, but they do not speak; eyes, but they do not see.
translation:
  language: ru
  text: Есть у них уста, но они не говорят; есть у них глаза, но они не видят.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּה
  choice: уста
  rationale: Еврейское существительное стоит в единственном числе, но употреблено распределительно по отношению к идолам. Русское «уста» естественно передаёт эту часть лица в возвышенном поэтическом регистре и согласуется с множественным референтом.
- source_word: לָהֶם
  choice: есть у них
  rationale: Предлог ל с местоименным суффиксом выражает обладание; русская конструкция «есть у них» сохраняет еврейский порядок и звучит естественно.
- source_word: וְלֹא
  choice: но … не
  rationale: Сочетание союза с отрицанием создаёт контраст между наличием органов и отсутствием их действия; противительный союз «но» ясно передаёт этот смысл.
- source_word: יְדַבֵּרוּ
  choice: говорят
  rationale: Форма глагола דבר обозначает речь; «говорят» — прямой и стилистически уместный русский эквивалент.
- source_word: עֵינַיִם
  choice: глаза
  rationale: Прямой русский эквивалент парной формы; множественное число естественно в данном распределительном описании.
- source_word: יִרְאוּ
  choice: видят
  rationale: Глагол ראה здесь означает зрительное восприятие; «видят» сохраняет параллелизм с неспособностью говорить.
theological_decisions:
- issue: Референт местоимений во множественном числе
  choice: Местоимение «они» относится к идолам из предшествующего контекста.
  alternative: 'Сохранить буквальную безличную конструкцию: «у них уста — и не говорят».'
  rationale: Личные формы ясно продолжают описание идолов и передают насмешливый контраст псалма, не добавляя к тексту конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим словом «уста». Повтор «есть у них» сохраняет параллелизм еврейской строки и делает противопоставление явным.
