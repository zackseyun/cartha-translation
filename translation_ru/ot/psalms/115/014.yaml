  text: May Yahweh give increase to you[b][a]—to you and to your children.
translation:
  language: ru
  text: Да умножит[a] вас Яхве — вас и ваших детей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да прибавит вам Яхве — вам и вашим детям». Еврейский глагол может означать «прибавить» или «умножить».'
