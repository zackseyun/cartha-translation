lexical_decisions:
- source_word: יֹסֵף
  choice: да умножит
  rationale: 'Форма глагола יסף в контексте благословения передаёт пожелание: «да умножит». Такой перевод естественен по-русски и сохраняет значение прибавления или увеличения.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет различие между именем יהוה и титулом «Господь».
- source_word: עֲלֵיכֶם ... עֲלֵיכֶם
  choice: вас — вас
  rationale: Русская конструкция с прямым дополнением естественно передаёт смысл еврейского оборота; повтор сохранён как выразительное уточнение.
- source_word: וְעַל בְּנֵיכֶם
  choice: и ваших детей
  rationale: בנים здесь обозначает детей в составе семей благословляемых; «детей» естественнее и шире, чем исключительно «сыновей», но не расширяет значение до всех потомков.
theological_decisions:
- issue: Пожелательное или изъявительное значение יֹסֵף
  choice: 'Пожелание-благословение: «Да умножит…»'
  alternative: 'Предсказание: «Яхве умножит…»'
  rationale: В контексте благословения форма естественно понимается как пожелательная, хотя сама по себе может допускать значение будущего времени.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя, присутствующее в исходном тексте, не заменяя его титулом.
translation_notes:
  register: 'Современный литературный русский язык с краткой, торжественной формой благословения. Тире показывает, что повтор «вас» вводит пояснение: речь идёт о самих адресатах и их детях.'
