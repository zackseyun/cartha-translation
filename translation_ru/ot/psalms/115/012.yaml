  text: יְהוָה֮ זְכָרָ֪/נוּ יְבָ֫רֵ֥ךְ יְ֭בָרֵךְ אֶת בֵּ֣ית יִשְׂרָאֵ֑ל יְ֝בָרֵ֗ךְ אֶת בֵּ֥ית אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/012.yaml
  text: Yahweh has remembered us[a]; he will bless; he will bless the house of Israel; he will bless the house of Aaron.
translation:
  language: ru
  text: Яхве вспомнил о нас[a] — Он благословит, благословит дом Израиля, благословит дом Аарона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помнит о нас».'
    reason: 'Лексико-аспектуальная альтернатива: еврейское выражение может подчёркивать не только совершившееся воспоминание, но и продолжающееся благосклонное внимание Бога.'
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, в принятой современной русской форме.
- source_word: זְכָרָנוּ
  choice: вспомнил о нас
  rationale: Форма qal perfect 3-го лица единственного числа с суффиксом 1-го лица множественного числа обозначает совершившееся действие; сочетание «вспомнил о нас» естественно по-русски и сохраняет смысл Божьего благосклонного внимания.
- source_word: יְבָרֵךְ
  choice: благословит
  rationale: Имперфект в данном контексте передан как уверенное предсказание будущего действия. Троекратный повтор сохранён как средство поэтического и литургического усиления.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет семейно-общинный смысл בֵּית и параллельное построение стиха.
- source_word: בֵּית אַהֲרֹן
  choice: дом Аарона
  rationale: Явно обозначает священнический род и сохраняет параллелизм с «домом Израиля».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет это различие, не заменяя имя титулом.
- issue: Модальность יְבָרֵךְ
  choice: 'уверенное будущее: «благословит»'
  alternative: 'пожелание: «да благословит»'
  rationale: Связь с предшествующим совершённым действием («вспомнил о нас») и последовательность утверждений лучше поддерживают предсказательное прочтение, хотя сама форма допускает в иных контекстах оттенок пожелания.
translation_notes:
  register: Современный литературный русский язык с достоинством богослужебной поэзии. Повтор глагола намеренно сохранён; тире естественно связывает основание уверенности с обещанием благословения.
