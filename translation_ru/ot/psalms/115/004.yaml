  text: עֲֽ֭צַבֵּי/הֶם כֶּ֣סֶף וְ/זָהָ֑ב מַ֝עֲשֵׂ֗ה יְדֵ֣י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/004.yaml
  text: Their idols are silver and gold[a], the work of human hands.
translation:
  language: ru
  text: Идолы их — серебро и золото, дело человеческих рук.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲצַבֵּיהֶם
  choice: идолы их
  rationale: Существительное עָצָב в этом полемическом контексте обозначает идолов; постпозитивное «их» сохраняет возвышенный поэтический строй и ясно передаёт суффикс 3-го лица множественного числа.
- source_word: כֶּסֶף וְזָהָב
  choice: серебро и золото
  rationale: Названия материалов переданы прямо; именная конструкция сохраняет резкое противопоставление живому Богу в контексте псалма.
- source_word: מַעֲשֵׂה
  choice: дело
  rationale: Именное «дело» передаёт значение произведения или изделия и сохраняет форму еврейского выражения, не сводя её к глагольному «сделаны».
- source_word: יְדֵי אָדָם
  choice: человеческих рук
  rationale: Естественное русское выражение сохраняет конкретный образ рук, а прилагательное «человеческих» передаёт родовое, собирательное значение אָדָם.
theological_decisions:
- issue: Родовое значение אָדָם в выражении יְדֵי אָדָם
  choice: человеческих рук
  alternative: рук человека
  rationale: В данном месте אָדָם обозначает человека вообще, а не конкретного мужчину. Выбранный вариант естественно выражает противопоставление божественного человеческому и сохраняет образ рук.
translation_notes:
  register: Современный литературный русский с лаконичным, поэтически возвышенным синтаксисом. Тире перед именной характеристикой естественно передаёт бессоюзную еврейскую конструкцию; богословская напряжённость между притязанием идолов и их человеческим происхождением сохранена.
