lexical_decisions:
- source_word: הַמֵּתִים
  choice: мёртвые
  rationale: Субстантивированная форма обозначает умерших людей вообще; «мёртвые» — естественное и точное русское соответствие.
- source_word: יְהַלְלוּ
  choice: не восхваляют
  rationale: Глагол הלל в породе пиэль обычно означает хвалить, восхвалять; выбранный вариант уместен в контексте поклонения и сохраняет связь с формулой «Аллилуйя».
- source_word: יָהּ
  choice: Ях
  rationale: Это краткая поэтическая форма Божьего имени, а не полная форма יהוה; транслитерация «Ях» сохраняет данное различие.
- source_word: כָּל
  choice: никто из
  rationale: Под отрицанием כָּל имеет распределительный смысл. По-русски «никто из» передаёт его естественнее, чем буквальное «не все», которое могло бы ошибочно подразумевать, что некоторые всё же восхваляют.
- source_word: יֹרְדֵי
  choice: сходящих
  rationale: Причастная форма от ירד характеризует тех, кто сходит вниз; «сходящих» сохраняет образ и обобщённый характер выражения.
- source_word: דוּמָה
  choice: безмолвие
  rationale: Слово обозначает тишину, безмолвие и здесь поэтически изображает состояние или область смерти. «Безмолвие» сохраняет метафору, не подменяя её толкованием «могила» или «шеол».
theological_decisions:
- issue: Следует ли понимать стих как исчерпывающее догматическое отрицание посмертной хвалы или как поэтическое описание безмолвия смерти?
  choice: 'Сохранить поэтическое утверждение без догматического расширения: «Мёртвые не восхваляют Ях, и никто из сходящих в безмолвие».'
  alternative: Передать «безмолвие» непосредственно как «могилу» или «шеол» и тем самым конкретизировать состояние умерших.
  rationale: Псалом противопоставляет живых поклоняющихся умершим посредством традиционного поэтического образа. Перевод сохраняет напряжение текста и не решает за него более широкий вопрос о состоянии после смерти.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной псалмовой интонацией. Краткая форма Божьего имени передана как «Ях»; образ нисхождения в безмолвие сохранён без конфессионально обусловленного истолкования.
