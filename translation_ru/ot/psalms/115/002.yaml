source:
  edition: WLC
  text: לָ֭/מָּה יֹאמְר֣וּ הַ/גּוֹיִ֑ם אַיֵּה נָ֝֗א אֱלֹהֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/002.yaml
  text: Why should the nations say[a], “Where now is their God?”
translation:
  language: ru
  text: 'Зачем народам говорить[a]: «Где же их Бог?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему народы говорят: „Где теперь их Бог?“»'
    reason: Лָמָּה с имперфектом может быть понято как вопрос о фактической или повторяющейся речи; נָא можно передать наречием «теперь», а не усилительной частицей «же».
lexical_decisions:
- source_word: לָמָּה
  choice: Зачем
  rationale: 'В сочетании с имперфектом вводит риторическое возражение: псалмопевец отвергает сам повод для насмешки народов. «Зачем» естественно передаёт этот оттенок по-русски.'
- source_word: יֹאמְרוּ
  choice: говорить
  rationale: Qal, имперфект, 3-е лицо множественного числа. Инфинитив после «зачем» естественно выражает возможную или повторяющуюся насмешку, не превращая форму в однозначное предсказание будущего.
- source_word: הַגּוֹיִם
  choice: народам
  rationale: Обычное значение — народы, здесь чужие народы в противопоставлении Израилю. «Народы» точнее и нейтральнее, чем конфессионально окрашенное «язычники».
- source_word: אַיֵּה
  choice: Где
  rationale: Прямое вопросительное наречие места; русская конструкция не требует выраженной связки.
- source_word: נָא
  choice: же
  rationale: Здесь частица усиливает вызывающий, насмешливый вопрос, а не выражает просьбу. Русское «же» естественно передаёт эмфатический оттенок; возможна также передача словом «теперь».
- source_word: אֱלֹהֵיהֶם
  choice: их Бог
  rationale: Хотя форма אֱלֹהִים морфологически множественная, в контексте имеется в виду Бог Израиля; единственное число и прописная буква отражают референцию текста.
theological_decisions:
- issue: Референция אֱלֹהֵיהֶם
  choice: их Бог
  alternative: их бог
  rationale: Народы насмехаются над Израилем, ставя под вопрос присутствие или действие именно Бога Израиля. Прописная буква передаёт эту контекстную референцию, не добавляя к тексту отдельного богословского утверждения.
- issue: Модальность риторического вопроса לָמָּה יֹאמְרוּ
  choice: Зачем народам говорить
  alternative: Почему народы говорят
  rationale: Имперфект допускает потенциальный оттенок («зачем им говорить / почему они должны говорить»), но также может описывать фактическую или повторяющуюся речь. Основной текст сохраняет риторическое возражение, а примечание отмечает альтернативу.
translation_notes:
  register: Современный литературный русский язык; краткая, возвышенная, но понятная формулировка. Сохранён насмешливый тон прямой речи и неоднозначность модальности посредством примечания.
