  text: אָזְנַ֣יִם לָ֭/הֶם וְ/לֹ֣א יִשְׁמָ֑עוּ אַ֥ף לָ֝/הֶ֗ם וְ/לֹ֣א יְרִיחֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/006.yaml
  text: They have ears, but do not hear; noses, but do not smell.
translation:
  language: ru
  text: Есть у них уши, но они не слышат; есть у них нос, но они не обоняют.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָזְנַיִם
  choice: уши
  rationale: Форма двойственного числа обозначает органы слуха; прямой перевод сохраняет параллелизм описания идолов.
- source_word: לָהֶם
  choice: есть у них
  rationale: Предлог ל с местоименным суффиксом в безглагольной конструкции выражает обладание; по-русски естественно передаётся оборотом «есть у них».
- source_word: יִשְׁמָעוּ
  choice: слышат
  rationale: Qal имперфект от שׁמע здесь означает способность слышать, а не сознательно слушать.
- source_word: אַף
  choice: нос
  rationale: В данном контексте слово буквально обозначает нос, а не гнев. Единственное число соответствует форме еврейского текста и допустимо как распределительное при множественном субъекте.
- source_word: יְרִיחוּן
  choice: обоняют
  rationale: Hiphil имперфект от ריח обозначает восприятие запаха. «Обоняют» ясно и лаконично передаёт функцию носа в приподнятом поэтическом регистре.
- source_word: וְלֹא
  choice: но … не
  rationale: Формально «и не», однако противопоставление наличия органов отсутствию способности естественно выражается по-русски союзом «но».
theological_decisions:
- issue: Антропоморфное описание идолов
  choice: Сохранить буквальный образ органов чувств, лишённых способности воспринимать
  alternative: Истолковать образ как прямое утверждение духовного бессилия идолов
  rationale: Еврейский текст использует конкретную телесную образность; буквальная передача сохраняет полемическую силу и не добавляет толкования в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Повтор «есть у них» воспроизводит синтаксический параллелизм еврейского стиха; «обоняют» точнее и благозвучнее здесь, чем разговорное «чуют запах».
