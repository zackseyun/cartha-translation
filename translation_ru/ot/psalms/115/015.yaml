lexical_decisions:
- source_word: בְּרוּכִים אַתֶּם לַיהוָה
  choice: Да благословит вас Яхве
  rationale: Буквально конструкция означает «благословенны вы от/для Яхве», но в данном контексте это формула благословения. Русская активная конструкция естественно передаёт пожелательный смысл, не превращая его в утверждение о уже состоявшемся благословении.
- source_word: אַתֶּם
  choice: вас
  rationale: Местоимение второго лица мужского рода множественного числа; русское «вас» сохраняет множественное число без стилистически лишнего уточнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное заветное имя Бога, а не заменено титулом «Господь».
- source_word: עֹשֵׂה
  choice: Творец
  rationale: Субстантивированное причастие от עשה выступает здесь как божественный титул. «Творец» кратко и естественно передаёт это значение.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: неба и земли
  rationale: Устойчивая русская библейская формула естественно передаёт меризм, обозначающий всё творение; морфологически множественное שָׁמַיִם по-русски идиоматично передаётся единственным числом «небо».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон; форма «Яхве» сохраняет личное имя и не смешивает его с титулом.
- issue: Утверждение или пожелание благословения
  choice: пожелательная формула «Да благословит вас»
  alternative: «Вы благословенны Яхве»; «Да будете вы благословенны Яхве»
  rationale: Еврейская безглагольная конструкция допускает более формальное декларативное прочтение, однако контекст псалма указывает на благословение, произносимое над адресатами. Выбранная русская форма естественно выражает эту функцию; буквальная структура отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Формула «Да благословит» естественна для благословения; «Творец» сохраняет достоинство божественного эпитета.
