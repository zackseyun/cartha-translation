  text: Небеса, небеса принадлежат Яхве[a], а землю Он отдал людям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте слово «небеса» повторено для усиления.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыновьям человека»; это еврейское выражение означает людей, человечество.'
