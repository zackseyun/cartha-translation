lexical_decisions:
- source_word: הַשָּׁמַיִם ... שָׁמַיִם
  choice: Небеса — небеса
  rationale: Сохранён выразительный повтор еврейского слова и конструкция «тема — сообщение»; тире делает её естественной для русской поэтической речи.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל здесь обозначает принадлежность, которая по-русски выражена именной конструкцией «небеса Яхве»; личное имя יהוה передано как «Яхве».
- source_word: וְהָאָרֶץ
  choice: а землю
  rationale: Союз ו в антитетическом параллелизме естественно передан русским «а», подчёркивающим сопоставление без усиления до резкого противопоставления.
- source_word: נָתַן
  choice: Он отдал
  rationale: Совершенный вид передаёт завершённое действие; подразумеваемый субъект — Яхве — обозначен местоимением. «Отдал» естественно выражает передачу земли людям во владение и распоряжение.
- source_word: לִבְנֵי אָדָם
  choice: людям
  rationale: Еврейское устойчивое выражение буквально означает «сынам человека», но обозначает людей вообще; «людям» ясно и естественно передаёт его общий смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно сохранено в основном тексте, а не заменено титулом.
- issue: Значение לִבְנֵי אָדָם
  choice: людям
  alternative: сынам человеческим
  rationale: Фраза относится ко всему человечеству, а не только к мужчинам; буквальная форма указана в примечании, чтобы сохранить связь с образом оригинала.
- issue: Отношение между небесами и землёй
  choice: принадлежность небес Яхве и дарование земли людям переданы без дальнейшего толкования
  alternative: истолковать стих как утверждение об исключительном отсутствии Божьей власти на земле
  rationale: Текст противопоставляет принадлежность небес и дарование земли, но не утверждает, что Бог перестал властвовать над землёй; перевод не должен вносить такой вывод.
translation_notes:
  register: Современный литературный русский с лаконичным поэтическим строем. Эмфатический повтор оригинала сохранён; архаичное «сынам человеческим» вынесено в примечание ради ясности основного текста.
