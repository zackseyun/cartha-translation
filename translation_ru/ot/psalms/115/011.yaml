  text: יִרְאֵ֣י יְ֭הוָה בִּטְח֣וּ בַ/יהוָ֑ה עֶזְרָ֖/ם וּ/מָגִנָּ֣/ם הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/011.yaml
  text: You who fear Yahweh[a], trust in Yahweh; he is their help and their shield.
translation:
  language: ru
  text: Вы, боящиеся Яхве[a], уповайте на Яхве! Он — их помощь и их щит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть боящиеся Яхве уповают на Яхве». Еврейское причастие может обозначать как тех, к кому обращаются напрямую («вы, боящиеся»), так и группу лиц в третьем лице («боящиеся»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאֵי
  choice: вы, боящиеся
  rationale: 'Причастие мужского рода множественного числа в сопряжённой форме употреблено субстантивно: «боящиеся». Обращение «вы, боящиеся» естественно согласуется с последующим повелительным наклонением множественного числа.'
- source_word: יְהוָה / בַיהוָה
  choice: Яхве / на Яхве
  rationale: Тетраграмматон передан личным именем «Яхве». При глаголе «уповать» предлог ב естественно передаётся русской конструкцией «уповать на»; повтор имени сохранён.
- source_word: בִּטְחוּ
  choice: уповайте
  rationale: Повелительная форма множественного числа от בטח выражает призыв довериться Богу. «Уповайте» сохраняет библейское достоинство и остаётся понятным в современном литературном русском.
- source_word: עֶזְרָם
  choice: их помощь
  rationale: Существительное עזר допускает значения «помощь» и «помощник»; абстрактное «помощь» точно сохраняет еврейскую именную форму и привычный поэтический параллелизм.
- source_word: וּמָגִנָּם
  choice: и их щит
  rationale: Конкретный образ щита сохранён без обобщающей замены на «защитника».
- source_word: הוּא
  choice: Он —
  rationale: Самостоятельное местоимение имеет подчёркивающую функцию; русское именное предложение с тире естественно передаёт утверждение «Он — их помощь и их щит».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Смена лица между призывом и утверждением
  choice: «Вы… уповайте» — «их помощь»
  alternative: «Вы… уповайте» — «ваша помощь»
  rationale: Еврейский текст переходит от прямого обращения во втором лице к местоименным суффиксам третьего лица. Эта заметная смена сохранена, а не сглажена богословски или стилистически.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической лексикой. «Уповайте» выбрано вместо разговорного «доверьтесь»; повтор имени и метафора щита сохранены.
