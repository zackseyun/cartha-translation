  - marker: b
    text: 'Или: «не бормочут»; еврейский глагол может обозначать тихое произнесение или бормотание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדֵיהֶם
  choice: Руки у них
  rationale: Передаёт буквальное «их руки» в естественной для русского именной конструкции и сохраняет поэтический параллелизм.
- source_word: יְמִישׁוּן
  choice: не осязают
  rationale: Глагол מושׁ в данной форме указывает на ощупывание или прикосновение руками. «Не осязают» сохраняет функциональный образ рук, не сводя его только к чувственному восприятию.
- source_word: רַגְלֵיהֶם
  choice: ноги у них
  rationale: Естественно передаёт «их ноги» и образует параллель с «руки у них».
- source_word: יְהַלֵּכוּ
  choice: не ходят
  rationale: Формально сохраняет отрицательную конструкцию еврейского текста; в контексте насмешки над идолами она ясно выражает их неспособность ходить.
- source_word: יֶהְגּוּ
  choice: не издают ни звука
  rationale: הגה может обозначать тихое произнесение, бормотание или иной звук. Обобщённая передача сохраняет широту значения и естественно сочетается с упоминанием гортани.
- source_word: בִּגְרוֹנָם
  choice: гортанью
  rationale: Предлог ב может здесь иметь инструментальный оттенок — «с помощью гортани». Такой перевод естественнее по-русски, чем буквальное «в своей гортани», и сохраняет телесный образ.
theological_decisions:
- issue: Характер бессилия идолов
  choice: Сохранены формальные отрицания «не осязают», «не ходят», «не издают», позволяющие контексту выразить неспособность.
  alternative: 'Явно передать неспособность: «не могут осязать», «не могут ходить».'
  rationale: Еврейский текст использует отрицание действия, тогда как общий контекст псалма недвусмысленно показывает бессилие идолов. Формальная отрицательная конструкция сохраняет и форму источника, и его богословскую насмешку.
- issue: Значение יֶהְגּוּ
  choice: «не издают ни звука» с примечанием об узком значении «не бормочут».
  alternative: «не бормочут» или «не произносят звука».
  rationale: Глагол допускает низкое звучание или бормотание; основной текст передаёт общий смысл, а примечание сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с компактным поэтическим параллелизмом. Инверсия в последней строке поддерживает возвышенный ритм, оставаясь понятной; тире визуально подчёркивает контраст между наличием частей тела и отсутствием действия.
