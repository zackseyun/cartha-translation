  yaml_path: translation/ot/psalms/115/007.yaml
  text: They have hands[a], but cannot feel; feet, but cannot walk[b]; they do not make a sound in their throat.
translation:
  language: ru
  text: Руки у них — но не осязают[a]; ноги у них — но не ходят; из горла у них не исходит ни звука[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не ощупывают»; еврейский глагол означает ощупывать или касаться руками.'
