  text: וֵֽ/אלֹהֵ֥י/נוּ בַ/שָּׁמָ֑יִם כֹּ֭ל אֲשֶׁר חָפֵ֣ץ עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/115/003.yaml
  text: But our God is in the heavens[b][a]; he does all that he pleases.
translation:
  language: ru
  text: Но наш Бог — на небесах; Он делает всё, что Ему угодно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он совершает всё, чего пожелает».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהֵינוּ
  choice: Но наш Бог
  rationale: 'Союз ו в контексте передаёт противопоставление: в отличие от бессильных идолов, наш Бог жив и действует. «Но» естественно выражает эту связь.'
- source_word: בַשָּׁמַיִם
  choice: на небесах
  rationale: Форма שָׁמַיִם морфологически множественная; русское «на небесах» точно и естественно передаёт образ без архаизации.
- source_word: כֹּל אֲשֶׁר
  choice: всё, что
  rationale: Оборот обозначает полноту охвата и прямо соответствует еврейской конструкции.
- source_word: חָפֵץ
  choice: Ему угодно
  rationale: חפץ может обозначать желание, благорасположение или то, что доставляет удовольствие. Русский оборот «что Ему угодно» сохраняет широту значения и не превращает слово в узкий богословский термин.
- source_word: עָשָׂה
  choice: делает
  rationale: Хотя употреблена форма qatal, здесь она выражает общее, непреходящее положение о действенной свободе Бога; настоящее время естественно передаёт этот гномический смысл.
theological_decisions:
- issue: Формулировка Божьего владычества
  choice: Он делает всё, что Ему угодно
  alternative: Он совершает всё, чего пожелает
  rationale: Основной вариант утверждает свободу и действенность Бога в противопоставлении бессильным идолам, но не уточняет сверх того, как именно соотносятся Божье желание, благоволение и воля.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным, но понятным синтаксисом. Местоимение «Он» написано с прописной буквы как уместная в библейском издании форма почтительного обозначения Бога.
