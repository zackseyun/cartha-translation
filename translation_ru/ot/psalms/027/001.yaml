source:
  edition: WLC
  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/001.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: ru
  text: 'Давида[a].


    Яхве[b] — мой свет и моё спасение: кого мне бояться? Яхве — твердыня моей жизни: кого мне страшиться?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давидов», «Давиду». Еврейское надписание может указывать на авторство, принадлежность, посвящение или иную связь с Давидом.'
    reason: alternative_reading
  - marker: b
    text: Еврейское יהוה (ЙХВХ) — личное имя Бога; традиционно переводится как «Господь».
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая форма надписания сохраняет неоднозначность еврейского לְ: оно может указывать на авторство, принадлежность или связь с Давидом, не сводя смысл исключительно к «написано Давидом».'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном יהוה, а не заменяющий его титул.
- source_word: אוֹרִי
  choice: мой свет
  rationale: Сохранена ясная и значимая метафора исходного текста без истолкования её как руководства, надежды или благополучия.
- source_word: וְיִשְׁעִי
  choice: и моё спасение
  rationale: Слово יֵשַׁע обозначает спасение или избавление; «спасение» естественно передаёт широкий смысл защиты и избавления.
- source_word: מִמִּי אִירָא
  choice: кого мне бояться?
  rationale: Русская безличная конструкция естественно передаёт уверенный риторический вопрос, выраженный еврейским имперфектом.
- source_word: מָעוֹז חַיַּי
  choice: твердыня моей жизни
  rationale: מָעוֹז обозначает укреплённое место или источник силы и защиты; «твердыня» сохраняет образ надёжной обороны, а родительная конструкция передаёт חַיַּי.
- source_word: מִמִּי אֶפְחָד
  choice: кого мне страшиться?
  rationale: Глагол פחד может выражать сильный страх или ужас. «Страшиться» сохраняет смысловое различие с ירא и поэтический параллелизм.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте дважды стоит личное имя יהוה. Транслитерация «Яхве» сохраняет имя, не подменяя его титулом, при этом примечание сообщает читателю традиционный вариант.
- issue: Связь надписания с Давидом
  choice: Давида
  alternative: Давидов псалом / Псалом Давида / Давиду
  rationale: Еврейское לְדָוִד допускает авторство, посвящение или более широкую связь с Давидом. Краткое «Давида» не разрешает эту неоднозначность без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Параллелизм двух риторических вопросов и метафоры света и твердыни сохранены; местоименные формы и порядок слов сделаны естественными для современного читателя.
