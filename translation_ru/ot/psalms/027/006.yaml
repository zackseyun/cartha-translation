  text: וְ/עַתָּ֨ה יָר֪וּם רֹאשִׁ֡/י עַ֤ל אֹֽיְבַ֬/י סְֽבִיבוֹתַ֗/י וְ/אֶזְבְּחָ֣ה בְ֭/אָהֳל/וֹ זִבְחֵ֣י תְרוּעָ֑ה אָשִׁ֥ירָה וַ֝/אֲזַמְּרָ֗ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/006.yaml
  text: And now my head will be lifted up above my enemies around me[a], and I will offer in his tent sacrifices of joyful shouting; I will sing, yes[b], I will make music to Yahweh.
translation:
  language: ru
  text: И теперь моя голова вознесётся над врагами, окружающими меня; я принесу в его шатре[b] жертвы ликования[a]. Буду петь и воспевать Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы с радостными возгласами». Древнееврейское выражение может указывать как на праздничный характер жертв, так и на сопровождающие их возгласы ликования.'
    reason: lexical_alternative
  - marker: b
    text: То есть в шатре Яхве; местоимение, вероятнее всего, относится к Яхве.
    reason: referent_clarification
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет и соединительное значение וְ, и указание на наступивший поворот в положении псалмопевца.
- source_word: יָרוּם רֹאשִׁי
  choice: моя голова вознесётся
  rationale: Сохраняет буквальный древнееврейский образ головы как знака чести, уверенности и оправдания; форма глагола выражает уверенное ожидание.
- source_word: עַל אֹיְבַי סְבִיבוֹתַי
  choice: над врагами, окружающими меня
  rationale: Передаёт одновременно превосходство над врагами и то, что они находятся вокруг псалмопевца.
- source_word: וְאֶזְבְּחָה
  choice: я принесу
  rationale: Когортатив выражает решительное намерение; с существительным «жертвы» глагол «принесу» звучит по-русски естественно и сохраняет жертвенный смысл.
- source_word: בְאָהֳלוֹ
  choice: в его шатре
  rationale: «Шатёр» сохраняет образ переносного святилища и не вводит более специальный традиционный термин; местоимение оставлено в тексте, а его наиболее вероятный референт пояснён в сноске.
- source_word: זִבְחֵי תְרוּעָה
  choice: жертвы ликования
  rationale: Конструкция сохраняет связь жертв с громким радостным возгласом, не сводя её без пояснения только к характеру жертв либо только к сопровождающим их восклицаниям.
- source_word: אָשִׁירָה וַאֲזַמְּרָה
  choice: Буду петь и воспевать
  rationale: 'Передаёт два параллельных волевых глагола: пение и музыкальное хваление, не добавляя прямо не названного инструмента.'
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт собственное заветное имя יהוה, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Референт местоименного суффикса в בְאָהֳלוֹ
  choice: его шатёр — шатёр Яхве
  alternative: шатёр псалмопевца
  rationale: Контекст жертвоприношения и хвалы Яхве делает святилище Яхве наиболее естественным пониманием, однако сам древнееврейский текст называет референта лишь местоимением.
- issue: Связь תְרוּעָה с жертвами
  choice: жертвы ликования
  alternative: жертвы, сопровождаемые радостными возгласами
  rationale: Сочетание допускает акцент как на праздничном характере жертв, так и на сопровождающей их громкой радостной аккламации; основной текст сохраняет эту сжатость, а сноска раскрывает варианты.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической образности псалма. Синтаксис сделан ясным для обычного читателя; буквальный образ вознесённой головы и храмовый образ шатра сохранены.
