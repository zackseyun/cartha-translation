lexical_decisions:
- source_word: בִּקְרֹב עָלַי
  choice: Когда ... подступали ко мне
  rationale: Инфинитивная конструкция с בְּ передаёт временное обстоятельство. «Подступали ко мне» естественно выражает враждебное приближение, не добавляя отдельного «против меня».
- source_word: מְרֵעִים
  choice: злодеи
  rationale: Причастная форма обозначает творящих зло; «злодеи» кратко и ясно сохраняет нравственную оценку.
- source_word: לֶאֱכֹל אֶת־בְּשָׂרִי
  choice: чтобы пожрать мою плоть
  rationale: «Пожрать» сохраняет буквальный образ поедания и передаёт жестокость нападения; «плоть» удерживает телесную образность еврейского текста.
- source_word: צָרַי וְאֹיְבַי לִי
  choice: мои противники и враги
  rationale: Два обозначения врагов сохранены ради параллелизма. Суффиксы первого лица уже выражают их отношение к говорящему, поэтому отдельное «против меня» по-русски было бы избыточно.
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение имеет подчёркивающую силу; она передана обособлением и явным «они».
- source_word: כָשְׁלוּ וְנָפָלוּ
  choice: споткнулись и пали
  rationale: Перевод сохраняет последовательность двух глаголов и не уточняет, было ли падение физическим, военным или образным.
