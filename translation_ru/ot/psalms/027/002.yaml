base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/002.yaml
  text: When evildoers came near me to devour my flesh[b][a], my adversaries and my enemies—they stumbled and fell.
translation:
  language: ru
  text: Когда злодеи — мои противники и враги — подступили ко мне, чтобы пожрать мою плоть[a], они споткнулись и пали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «съесть мою плоть». Это яркий образ жестокого нападения.'
