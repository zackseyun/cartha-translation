source:
  edition: WLC
  text: לְ/ךָ֤ אָמַ֣ר לִ֭בִּ/י בַּקְּשׁ֣וּ פָנָ֑/י אֶת פָּנֶ֖י/ךָ יְהוָ֣ה אֲבַקֵּֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/008.yaml
  text: On your behalf my heart says[a], “Seek my face.” Your face, Yahweh[c][b], I seek.
translation:
  language: ru
  text: 'От Твоего имени сердце моё говорит[a]: «Ищите Моего лица». Твоего лица[b], Яхве, я ищу[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское начало стиха трудно для однозначного понимания. Возможны также переводы: «Тебе говорит моё сердце» или, при ином синтаксическом разборе, «О Тебе говорит моё сердце: “Ищите Его лица”».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Твоего присутствия». В еврейском языке слово «лицо» нередко означает личное присутствие.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «буду искать». Еврейский глагол может выражать как нынешнюю решимость, так и намерение на будущее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ אָמַר לִבִּי
  choice: От Твоего имени сердце моё говорит
  rationale: Начальная конструкция синтаксически трудна. Этот перевод понимает לְךָ как указание на того, чьё обращение повторяет сердце псалмопевца, и сохраняет настоящее время внутреннего отклика; иные допустимые разборы приведены в примечании.
- source_word: בַּקְּשׁוּ
  choice: Ищите
  rationale: Форма представляет собой повелительное наклонение множественного числа; краткий глагол «ищите» сохраняет и число, и силу призыва.
- source_word: פָנַי / פָנֶיךָ
  choice: Моего лица / Твоего лица
  rationale: Буквальное «лицо» сохранено в обеих половинах стиха ради намеренного лексического повтора и образа личной встречи; возможное значение «присутствие» отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֲבַקֵּשׁ
  choice: я ищу
  rationale: Имперфект первого лица здесь естественно выражает нынешнюю решимость псалмопевца; возможное значение будущего намерения сохранено в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон — личное имя Бога; транслитерация не подменяет его титулом.
- issue: Понимание לְךָ אָמַר לִבִּי
  choice: 'Сердце повторяет обращённый от имени Бога призыв: «Ищите Моего лица»'
  alternative: '«Тебе говорит моё сердце» или «О Тебе говорит моё сердце: “Ищите Его лица”»'
  rationale: Еврейская фраза эллиптична и допускает несколько синтаксических разборов. Основной текст сохраняет масоретскую огласовку и понимает призыв как Божий зов, отозвавшийся в сердце, а альтернативы не скрываются.
- issue: Временной оттенок אֲבַקֵּשׁ
  choice: я ищу
  alternative: я буду искать
  rationale: Форма может обозначать как настоящую решимость, так и будущее намерение; контекст непосредственного ответа поддерживает настоящее время, но будущий оттенок остаётся возможным.
translation_notes:
  register: Современный литературный русский язык с поэтической краткостью и достоинством. Обращение к Богу и относящиеся к Нему местоимения написаны с прописной буквы. Инверсия «Твоего лица, Яхве, я ищу» сохраняет акцент исходного текста на объекте поиска и параллелизм двух полустиший.
