base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/004.yaml
  text: 'One thing I have asked from Yahweh[a]; this I will seek: that I may dwell in the house of Yahweh all the days of my life[c][b], to behold the beauty of Yahweh and to inquire in his temple.'
translation:
  language: ru
  text: 'Одного я просил у Яхве — этого буду искать: чтобы мне жить в доме Яхве все дни моей жизни, созерцать красоту Яхве[a] и вопрошать в Его храме[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благость Яхве», «привлекательность Яхве» или «благоволение Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «искать в Его храме» или «размышлять в Его храме». Значение еврейского глагола здесь не вполне ясно; речь может идти о внимательном искании, вопрошании или созерцательном размышлении в святилище.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַת
  choice: Одного
  rationale: Числительное женского рода употреблено субстантивно и подчёркивает единственность главного прошения; по-русски естественно продолжить его пояснением после двоеточия.
- source_word: שָׁאַלְתִּי
  choice: я просил
  rationale: Перфект обозначает уже высказанную просьбу, сохраняющую значение в настоящем; простой прошедший звучит естественно и связан с последующим намерением.
- source_word: מֵאֵת יְהוָה
  choice: у Яхве
  rationale: Предлог указывает, у кого просит псалмопевец; русская конструкция «просить у» точно и естественно передаёт это отношение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, стоящее в еврейском тексте, без замены титулом.
- source_word: אוֹתָהּ אֲבַקֵּשׁ
  choice: этого буду искать
  rationale: Местоимение возобновляет единственное прошение, а имперфект выражает продолжающееся устремление или решимость.
- source_word: שִׁבְתִּי
  choice: чтобы мне жить
  rationale: Форма с суффиксом первого лица раскрывает содержание прошения. «Жить» здесь естественнее буквального «сидеть» и передаёт длительное пребывание.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняет образ Божьего дома и связь с храмовым присутствием.
- source_word: כָּל יְמֵי חַיַּי
  choice: во все дни моей жизни
  rationale: Формально близкая и при этом ясная русская передача длительности.
- source_word: לַחֲזוֹת
  choice: созерцать
  rationale: Глагол подразумевает не мимолётное видение, а внимательное, благоговейное смотрение.
- source_word: בְּנֹעַם יְהוָה
  choice: красоту Яхве
  rationale: נֹעַם охватывает красоту, приятность и благость; «красота» хорошо подходит контексту созерцания, а прочие оттенки отмечены в сноске.
- source_word: וּלְבַקֵּר
  choice: и искать ответа
  rationale: Редкий и неоднозначный глагол в храмовом контексте может означать внимательное вопрошание или искание. Добавление «ответа» делает выбранный смысл естественным по-русски, не устраняя альтернативы из сноски.
- source_word: בְּהֵיכָלוֹ
  choice: в Его храме
  rationale: הֵיכָל здесь обозначает святилище, храм; местоимение с прописной буквы соответствует принятому русскому благоговейному регистру.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация сохраняет отличие имени от титула.
- issue: Смысл נֹעַם יְהוָה
  choice: красоту Яхве
  alternative: благость Яхве; благоволение Яхве; привлекательность Яхве
  rationale: Лексема допускает эстетический и благостный оттенки. Контекст глагола «созерцать» поддерживает «красоту», но неоднозначность сохранена в примечании.
- issue: Смысл וּלְבַקֵּר в храмовом контексте
  choice: искать ответа в Его храме
  alternative: вопрошать в Его храме; размышлять в Его храме; искать в Его храме
  rationale: Точное значение формы спорно. Основной текст выражает внимательное обращение за ответом в святилище, а сноска сохраняет более широкие возможности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Синтаксис сохраняет сосредоточенность стиха на одном прошении; лексическая неоднозначность נֹעַם и בקר вынесена в сноски.
