lexical_decisions:
- source_word: הוֹרֵנִי
  choice: Научи меня
  rationale: Хифиль глагола ירה имеет значение «учить, наставлять». «Научи меня» естественно звучит в молитве и сохраняет педагогический оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве», а не заменяющим его титулом, сохраняет форму исходного текста.
- source_word: דַּרְכֶּךָ
  choice: Твоему пути
  rationale: דֶּרֶךְ обозначает путь как направление движения и как образ жизни; русское «путь» сохраняет оба оттенка.
- source_word: וּנְחֵנִי
  choice: и веди меня
  rationale: נחה значит «вести, направлять». «Веди меня» сохраняет образ движения по пути и естественно сочетается с последующей фразой.
- source_word: בְּאֹרַח מִישׁוֹר
  choice: по ровной стезе
  rationale: אֹרַח — путь или тропа, а מִישׁוֹר прежде всего указывает на ровное место; «ровная стезя» сохраняет конкретный образ и возможный переносный смысл правильного, безопасного пути.
- source_word: לְמַעַן
  choice: из-за
  rationale: В данном контексте оборот выражает основание просьбы ввиду присутствия враждебных противников. «Из-за» передаёт эту причинную связь естественно и кратко.
- source_word: שׁוֹרְרָי
  choice: моих врагов
  rationale: Редкое слово обозначает враждебных противников и может подразумевать людей, которые наблюдают за псалмопевцем или подстерегают его. В основном тексте выбрано понятное общее обозначение, а более узкий оттенок отмечен в сноске.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» передаёт личное имя в исходном еврейском тексте, не заменяя его титулом и не принимая менее вероятную традиционную вокализацию.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической окраской. «Стезя» употреблена как понятное возвышенное слово, позволяющее различить два еврейских обозначения пути; прописная буква в «Твоему» поддерживает принятый в русском религиозном письме почтительный регистр.
