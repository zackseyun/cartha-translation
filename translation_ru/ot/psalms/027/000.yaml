  text: לְ/דָוִ֨ד יְהוָ֤ה אוֹרִ֣/י וְ֭/יִשְׁעִ/י מִ/מִּ֣י אִירָ֑א יְהוָ֥ה מָֽעוֹז חַ֝יַּ֗/י מִ/מִּ֥י אֶפְחָֽד׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/000.yaml
  text: Of David[a]. Yahweh is my light and my salvation; whom shall I fear? Yahweh is the stronghold of my life[b]; of whom shall I be afraid?
translation:
  language: ru
  text: 'Давида.[a]


    Яхве — свет мой и спасение моё: кого мне бояться?

    Яхве — твердыня жизни моей: кого мне страшиться?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давиду» или «о Давиде». Еврейское לְדָוִד в надписании может указывать на авторство, посвящение или связь с Давидом.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: אוֹרִי
  choice: свет мой
  rationale: Сохраняет краткую и выразительную метафору оригинала.
- source_word: יִשְׁעִי
  choice: спасение моё
  rationale: Прямо передаёт существительное со значением избавления или спасения.
- source_word: מָעוֹז חַיַּי
  choice: твердыня жизни моей
  rationale: מָעוֹז обозначает укреплённое, безопасное место и метафорически — защиту; «твердыня» сохраняет образ и возвышенный поэтический регистр.
- source_word: אִירָא / אֶפְחָד
  choice: бояться / страшиться
  rationale: Два близких русских глагола отражают параллельные, но лексически различные еврейские глаголы.
theological_decisions:
- issue: Значение надписания לְדָוִד
  choice: Давида
  alternative: Давидов; Давиду; о Давиде
  rationale: Краткая формула естественно допускает традиционное понимание как указание на авторство, а сноска сохраняет более широкую семантическую возможность предлога לְ.
- issue: Образ מָעוֹז
  choice: твердыня
  alternative: защита; крепость; убежище
  rationale: Выбор сохраняет пространственный образ надёжно укреплённого места, не сводя его к отвлечённой идее защиты.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Сохранены лаконичность, именные метафоры и параллелизм двух риторических вопросов; архаические формы избегаются.
