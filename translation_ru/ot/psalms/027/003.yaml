  text: אִם תַּחֲנֶ֬ה עָלַ֨/י מַחֲנֶה֮ לֹֽא יִירָ֪א לִ֫בִּ֥/י אִם תָּק֣וּם עָ֭לַ/י מִלְחָמָ֑ה בְּ֝/זֹ֗את אֲנִ֣י בוֹטֵֽחַ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/003.yaml
  text: Though an army encamps against me[a], my heart will not fear; though war rises against me[c][b], even then I will trust.
translation:
  language: ru
  text: Пусть даже войско расположится станом против меня[a] — сердце моё не устрашится; пусть даже война поднимется против меня — и всё же я уповаю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если войско расположится станом против меня… если война поднимется против меня». Еврейское אִם может иметь как условное значение «если», так и уступительное «пусть даже, хотя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в этом я уповаю (или: доверяю)». Краткое еврейское выражение может также передавать смысл: «несмотря на это я уверен»; возможна и отсылка к Господу из предыдущего контекста.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: пусть даже
  rationale: 'В обеих параллельных строках אִם имеет уступительный оттенок: угроза допускается как возможная, но не меняет решимости говорящего. «Пусть даже» естественно передаёт это в современном русском; условное «если» отмечено в сноске.'
- source_word: תַּחֲנֶה ... מַחֲנֶה
  choice: войско расположится станом
  rationale: Глагол חנה означает «становиться лагерем», а מַחֲנֶה — «лагерь, стан», по контексту также расположившееся войско. Формулировка сохраняет военный образ и внутренний повтор корня без неестественного «лагерь расположится лагерем».
- source_word: לֹא יִירָא לִבִּי
  choice: сердце моё не устрашится
  rationale: Сохранён явный субъект «сердце моё», важный для поэтической антропологии текста; «не устрашится» звучит достойно и понятно.
- source_word: תָּקוּם עָלַי מִלְחָמָה
  choice: война поднимется против меня
  rationale: Буквально сохранён яркий образ קום «встать, подняться» при подлежащем «война», не сведённый к более узкому «начнётся битва».
- source_word: בְּזֹאת אֲנִי בוֹטֵחַ
  choice: и тогда я буду уверен
  rationale: Эллиптическое בְּזֹאת может указывать на описанное обстоятельство («при этом, несмотря на это»), а בטח выражает доверие или уверенность. Основной текст выбран естественным по-русски, тогда как буквальные и семантические варианты сохранены в сноске.
theological_decisions:
- issue: Референт בְּזֹאת и смысл בטח
  choice: 'Устойчивость уверенности перед лицом только что описанной угрозы: «и тогда я буду уверен».'
  alternative: «В этом я уверен»; «несмотря на это я уповаю»; либо отсылка к Господу из предшествующего контекста.
  rationale: Непосредственный параллелизм связывает выражение с военной угрозой, однако еврейский текст не называет объект доверия и остаётся кратким. Перевод не добавляет явного объекта, а сноска сохраняет настоящую неоднозначность между уверенностью и упованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмовым звучанием. Инверсия «сердце моё» и глагол «не устрашится» сохраняют достоинство поэзии, оставаясь понятными; устаревшие «рать», «ополчится», «воздвигнется брань» исключены.
