  variant: modern literary Russian
source:
  edition: WLC
  text: אַל תַּסְתֵּ֬ר פָּנֶ֨י/ךָ מִמֶּ/נִּי֮ אַֽל תַּט בְּ/אַ֗ף עַ֫בְדֶּ֥/ךָ עֶזְרָתִ֥/י הָיִ֑יתָ אַֽל תִּטְּשֵׁ֥/נִי וְ/אַל תַּֽ֝עַזְבֵ֗/נִי אֱלֹהֵ֥י יִשְׁעִֽ/י־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/009.yaml
  text: Do not hide your face from me[a]; do not turn your servant away in anger. You have been my help. Do not cast me off, and do not forsake me[c][b], O God of my salvation.
translation:
  language: ru
  text: 'Не скрывай от меня лица твоего;

    не отсылай в гневе слугу твоего.


    Ты был моей помощью.


    Не отвергни меня[b] и не оставь меня,

    Бог моего спасения![c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «не брось меня».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Бог моего избавления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּסְתֵּר
  choice: скрывай
  rationale: Глагол סתר означает «скрывать, прятать». В сочетании с «лицом» прямой перевод сохраняет образ прекращённого благоволения или присутствия Бога.
- source_word: פָּנֶיךָ
  choice: лица твоего
  rationale: Сохранён конкретный древнееврейский образ «лица», понятный в русской библейской поэзии; абстрактное «присутствия» неоправданно снимало бы образность.
- source_word: תַּט בְּאַף
  choice: не прогоняй в гневе
  rationale: נטה имеет значения «наклонять, поворачивать, отводить». При прямом дополнении «слугу твоего» выражение передаёт просьбу не отослать и не удалить молящегося в гневе. «Прогоняй» естественно выражает это по-русски.
- source_word: עַבְדֶּךָ
  choice: слугу твоего
  rationale: В молитвенном обращении עבד обозначает смиренное положение и преданность Богу. «Слуга» здесь уместнее юридически окрашенного «раб» и естественнее в современной русской речи.
- source_word: עֶזְרָתִי הָיִיתָ
  choice: Ты был моей помощью
  rationale: Существительное עזרה означает «помощь», а форма היה указывает на уже испытанную помощь Бога. Перевод сохраняет как именную конструкцию, так и прошедшее время.
- source_word: תִּטְּשֵׁנִי
  choice: Не отвергни меня
  rationale: נטש может означать «покинуть, бросить, отвергнуть». «Отвергни» передаёт сильный личностный смысл и не сливается полностью со следующим עזב.
- source_word: תַּעַזְבֵנִי
  choice: не оставь меня
  rationale: עזב обычно означает «оставлять, покидать». Простой современный эквивалент сохраняет параллелизм с предыдущей просьбой.
- source_word: אֱלֹהֵי יִשְׁעִי
  choice: Бог моего спасения
  rationale: Формальная передача сочетания сохраняет ёмкость ישע, которое может обозначать спасение или избавление, и ясно звучит как обращение.
theological_decisions:
- issue: Антропоморфный образ Божьего лица
  choice: Сохранить «лица твоего» в основном тексте
  alternative: «присутствия твоего»
  rationale: В еврейском прямо сказано «лицо». Этот устойчивый поэтический образ может подразумевать присутствие и благоволение Бога, но перевод не должен заменять образ толкованием.
- issue: Значение עבד при обращении к Богу
  choice: «слугу твоего»
  alternative: «раба твоего»
  rationale: Контекст подчёркивает смиренную преданность молящегося, а не юридический статус несвободного человека. «Слуга» естественно и без лишней конфессиональной окраски передаёт эту функцию.
- issue: Объём значения ישע
  choice: «спасения» в основном тексте
  alternative: «избавления»
  rationale: «Спасение» сохраняет широкий смысл слова, не ограничивая его только выходом из конкретной беды; возможное значение «избавление» отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Сохранены параллелизм, обращение к Богу и образ «лица»; местоимения, относящиеся к Богу, написаны со строчной буквы по общим современным орфографическим нормам. Лексически близкие глаголы разграничены как «прогоняй», «отвергни» и «оставь».
