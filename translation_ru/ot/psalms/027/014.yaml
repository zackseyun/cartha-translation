base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/014.yaml
  text: Wait for Yahweh[a]; be strong, and let your heart take courage; yes[c][b], wait for Yahweh.
translation:
  language: ru
  text: Надейся на Яхве[a]; крепись, и пусть сердце твоё ободрится[b]. Да, надейся на Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ожидай Яхве». Еврейский глагол обозначает терпеливое ожидание, соединённое с надеждой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и Он укрепит твоё сердце», то есть Яхве укрепит его. Еврейскую глагольную форму можно понять не как продолжение призыва, а как обещание.'
    reason: alternative_reading
lexical_decisions:
- source_word: קַוֵּה ... אֶל
  choice: надейся на
  rationale: Императив קַוֵּה с אֶל выражает устремлённое к Богу ожидание и доверие. «Надейся на» естественно по-русски передаёт эту мысль; оттенок терпеливого ожидания отмечен в сноске. Повтор глагола сохранён.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: חֲזַק
  choice: крепись
  rationale: Краткое повеление сохраняет прямую побудительную силу и не уточняет сверх текста, о какой именно силе — нравственной, душевной или духовной — идёт речь.
- source_word: וְיַאֲמֵץ לִבֶּךָ
  choice: и пусть сердце твоё ободрится
  rationale: В цепи побуждений форма передана в пожелательно-побудительном смысле. Выражение естественно для современного русского языка, сохраняет образ сердца как внутреннего средоточия решимости и не устраняет возможное предикативное прочтение, вынесенное в сноску.
- source_word: וְקַוֵּה
  choice: Да, надейся
  rationale: Начальное וְ при повторном повелении понято как усиление заключительного призыва. «Да» сохраняет поэтическую кульминацию без тяжеловесного буквального «и».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Синтаксическая сила וְיַאֲמֵץ
  choice: 'побудительно-пожелательное продолжение: «пусть сердце твоё ободрится»'
  alternative: 'предсказание/обещание: «и Он укрепит твоё сердце»'
  rationale: Контекст образован прямыми повелениями, поэтому основной текст сохраняет последовательность призывов. Однако форма допускает понимание с подразумеваемым Яхве как субъектом; это богословски значимое напряжение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным псалмическим ритмом. Сохранены параллелизм, повтор имени Яхве и образ сердца; архаизмы вроде «мужайся» и «да укрепляется» избегаются.
