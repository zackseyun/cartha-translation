  yaml_path: translation/ot/psalms/027/010.yaml
  text: For my father and my mother have forsaken me[a], but Yahweh will take me in.
translation:
  language: ru
  text: Ибо мой отец и моя мать оставили меня, но Яхве примет меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Если отец и мать оставят меня, то Яхве примет меня». Еврейский глагол, переведённый «примет», буквально означает «соберёт»; здесь он выражает принятие под защиту и попечение.'
    reason: Сохраняет возможное условное понимание כִּי с перфектом, не делая его основным, и поясняет образность глагола אסף.
lexical_decisions:
- source_word: כִּי
  choice: если
  rationale: 'В данном контексте частица может вводить предполагаемое обстоятельство: даже в крайнем случае оставления родителями псалмопевец уверен в Божьем принятии. Русское «если» естественно передаёт эту контекстуальную связь, не утверждая однозначно, что родители уже оставили его.'
- source_word: אָבִי וְאִמִּי
  choice: отец и мать
  rationale: 'Притяжательное значение форм первого лица передано русской конструкцией без повторения «мой»: «отец и мать оставят меня» естественно и однозначно означает родителей говорящего.'
- source_word: עֲזָבוּנִי
  choice: оставят меня
  rationale: Перфект может описывать предполагаемую ситуацию как завершённую или уверенно представленную; в сочетании с условным пониманием כִּי русское будущее «оставят» звучит естественно. «Оставят» сохраняет широту עזב и не усиливает его до более резкого «отрекутся».
- source_word: וַיהוָה
  choice: то Яхве
  rationale: Союз обозначает противопоставленный результат в условной конструкции. Имя יהוה передано транслитерацией «Яхве».
- source_word: יַאַסְפֵנִי
  choice: примет меня
  rationale: Глагол אסף буквально означает «собирать», но здесь в применении к человеку выражает принятие под защиту и попечение. «Примет меня» естественно по-русски и не ограничивает смысл физическим приютом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное заветное имя в исходном тексте, не смешивая его с титулом «Господь».
- issue: Характер оставления родителями
  choice: 'условная возможность: «если… оставят»'
  alternative: 'совершившийся факт: «оставили меня»'
  rationale: Еврейская частица כִּי и перфект допускают несколько прочтений. Контекст уверенности и естественность русской речи поддерживают условное прочтение, однако утвердительное прочтение остаётся возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский; краткая поэтическая фраза с достоинством и ясным контрастом между возможным человеческим оставлением и Божьим принятием. Основной текст избегает архаизма «оставят меня отец мой и мать моя» и излишне бытового «возьмёт к себе».
