lexical_decisions:
- source_word: שְׁמַע
  choice: Услышь
  rationale: Повелительная форма выражает настойчивую просьбу не просто воспринимать звук, а внять молитве; «услышь» естественно сочетается с прямым дополнением «мой голос».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, непосредственно употреблённое в еврейском тексте, а не заменяющий его титул.
- source_word: קוֹלִי
  choice: мой голос
  rationale: Сохраняет конкретный образ еврейского выражения и не сводит его к более общему «меня».
- source_word: אֶקְרָא
  choice: когда я взываю
  rationale: Форма от קרא здесь обозначает обращённый к Богу громкий, настойчивый призыв; «взываю» соответствует молитвенному контексту и современному литературному регистру.
- source_word: וְחָנֵּנִי
  choice: будь милостив ко мне
  rationale: Глагол חנן означает оказать милость или благоволение. Выбранная формулировка точно передаёт просьбу о милостивом отношении, не сужая её до одного лишь сострадания.
- source_word: וַעֲנֵנִי
  choice: ответь мне
  rationale: Прямо передаёт повелительную форму глагола ענה в значении «ответить, откликнуться».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Значение просьбы וְחָנֵּנִי
  choice: будь милостив ко мне
  alternative: помилуй меня
  rationale: Формулировка сохраняет широкий смысл חנן — проявить милость или благоволение — и не отождествляет его без необходимости с другим еврейским глаголом, обозначающим сострадание.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Конкретное выражение «мой голос» сохранено, а «когда я взываю» естественно передаёт обстоятельственный смысл несоюзной еврейской конструкции.
