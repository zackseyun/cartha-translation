translation_notes:
  register: 'Современный литературный русский язык с достоинством псалмовой молитвы. «На произвол» выбрано как естественная русская идиома, а образ «дышать насилием» намеренно сохранён. Необычное согласование числа в заключительной части не устранено без пояснения: основной текст передаёт наиболее связное контекстуальное прочтение, а примечание сохраняет формальную неоднозначность.'
