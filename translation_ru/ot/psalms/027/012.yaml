  text: אַֽל תִּ֭תְּנֵ/נִי בְּ/נֶ֣פֶשׁ צָרָ֑/י כִּ֥י קָֽמוּ בִ֥/י עֵֽדֵי שֶׁ֝֗קֶר וִ/יפֵ֥חַ חָמָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/012.yaml
  text: Do not give me over to the desire of my adversaries[a], for false witnesses have risen against me[c][b], and they breathe out violence.
translation:
  language: ru
  text: Не отдавай меня на произвол моих врагов,[a] ведь против меня восстали лжесвидетели, дышащие насилием.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во власть желаний моих врагов» либо «на волю моим врагам». Еврейское слово נֶפֶשׁ здесь, вероятно, означает желание или волю, а не «душу» в узком смысле.'
    reason: lexical_alternative
  - marker: b
    text: Буквально заключительные слова можно понять как «и тот, кто дышит насилием». В еврейском тексте после множественного числа «лжесвидетели» стоит форма единственного числа; она может характеризовать каждого из них или обозначать ещё одного обвинителя.
    reason: source_ambiguity
lexical_decisions:
- source_word: תִּתְּנֵנִי
  choice: не отдавай меня
  rationale: Глагол נתן с отрицанием אַל и объектным суффиксом означает просьбу не отдавать говорящего во власть противников; русское «не отдавай меня» передаёт это прямо и естественно.
- source_word: בְּנֶפֶשׁ צָרָי
  choice: на произвол моих врагов
  rationale: נֶפֶשׁ здесь обозначает желание или волю, а не «душу» в узком смысле. Выражение «на произвол» естественно по-русски передаёт зависимость от враждебной воли противников.
- source_word: קָמוּ בִי
  choice: против меня восстали
  rationale: Сочетание קום с בְּ при обозначении лица означает выступить или восстать против кого-либо.
- source_word: עֵדֵי שֶׁקֶר
  choice: лжесвидетели
  rationale: Сложное слово «лжесвидетели» является точным и естественным русским соответствием юридически окрашенного еврейского выражения «свидетели лжи».
- source_word: וִיפֵחַ חָמָס
  choice: дышащие насилием
  rationale: Сохранён яркий образ дыхания, извергающего насилие. Русское причастие естественно связывает характеристику с лжесвидетелями, тогда как примечание отмечает грамматическое число еврейской формы.
- source_word: חָמָס
  choice: насилие
  rationale: חָמָס обозначает насилие, жестокую несправедливость или злодеяние; «насилие» сохраняет наиболее сильное и обычное значение слова.
