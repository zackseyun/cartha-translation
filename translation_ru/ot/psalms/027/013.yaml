  text: Если бы я не верил, что увижу благость Яхве в земле живых…[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза синтаксически не завершена: дословно — «Если бы не верил я увидеть благость Яхве в земле живых…» Следствие условия не названо.'
