lexical_decisions:
- source_word: לוּלֵא
  choice: если бы… не
  rationale: Передаёт условие, противоположное действительности; следствие этого условия в еврейском тексте не выражено.
- source_word: הֶאֱמַנְתִּי
  choice: я не верил
  rationale: Hифиль глагола אמן означает «верить, полагаться»; в составе конструкции לוּלֵא естественно передаётся русским сослагательным оборотом.
- source_word: לִרְאוֹת
  choice: что увижу
  rationale: Еврейский инфинитив указывает на содержание веры и по-русски естественно передаётся придаточным предложением.
- source_word: בְּטוּב
  choice: благость
  rationale: Сохраняет широкий смысл טוּב — доброту, благоволение и благие дары Бога — без сведения его только к материальному изобилию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом.
- source_word: בְּאֶרֶץ חַיִּים
  choice: в земле живых
  rationale: Устойчивый библейский образ мира живущих, противопоставленного смерти и шеолу.
- source_word: '[опущенное следствие после לוּלֵא]'
  choice: не восполняется в основном тексте
  rationale: Многоточие сохраняет подлинную синтаксическую незавершённость масоретского текста; вероятный смысл поясняется в сносках.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя.
- issue: Эллиптическая условная конструкция
  choice: Сохранить незавершённость посредством многоточия
  alternative: 'Восполнить: «я пал бы духом» или «я отчаялся бы»'
  rationale: В еврейском тексте следствие прямо отсутствует. Сохранение эллипсиса не выдаёт вероятное контекстуальное восполнение за слова оригинала, а сноски делают смысл понятным.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Слегка приподнятое «благость» сохраняет богословскую и поэтическую ёмкость טוּב; многоточие намеренно отражает эллипсис исходного текста.
