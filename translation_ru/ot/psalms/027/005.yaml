  text: כִּ֤י יִצְפְּנֵ֨/נִי בְּ/סֻכֹּ/ה֮ בְּ/י֪וֹם רָ֫עָ֥ה יַ֭סְתִּרֵ/נִי בְּ/סֵ֣תֶר אָהֳל֑/וֹ בְּ֝/צ֗וּר יְרוֹמְמֵֽ/נִי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/027/005.yaml
  text: For he will hide me in his shelter in the day of trouble[a]; he will conceal me in the secret place of his tent[c][b]; he will lift me high upon a rock.
translation:
  language: ru
  text: Ибо Он укроет меня в Своём укрытии[a] в день бедствия[b], спрячет меня в укромном месте Своего шатра и поднимет меня высоко на скалу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Своём шалаше», «в Своей куще» или «в Своей скинии». Еврейское слово обозначает укрывающую постройку и может иметь оттенок святилища.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в день беды» или «в день несчастья».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «поставит меня высоко на скале».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание уверенности псалмопевца, выраженной в предыдущем контексте.
- source_word: יִצְפְּנֵנִי
  choice: Он укроет меня
  rationale: Глагол צפן обозначает сокрытие ради сохранения и защиты; «укроет» естественно передаёт оба оттенка.
- source_word: בְּסֻכּוֹ
  choice: под Своим кровом
  rationale: סֻכָּה — укрывающая постройка, шалаш или навес. «Под Своим кровом» сохраняет образ защищённости, не сводя его непременно к культовому сооружению.
- source_word: בְּיוֹם רָעָה
  choice: в день бедствия
  rationale: В данном контексте רָעָה означает несчастье, беду или тяжёлые обстоятельства, а не нравственное зло.
- source_word: יַסְתִּרֵנִי
  choice: спрячет меня
  rationale: Глагол סתר продолжает параллельный образ сокрытия; иной русский глагол позволяет сохранить параллелизм без неестественного дословного повтора.
- source_word: בְּסֵתֶר אָהֳלוֹ
  choice: в укромном месте Своего шатра
  rationale: סֵתֶר обозначает скрытое, недоступное место, а אֹהֶל — шатёр. Формулировка сохраняет конкретный пространственный образ и возможный, но не обязательный, намёк на святилище.
- source_word: בְּצוּר
  choice: на скалу
  rationale: צוּר обозначает скалу или утёс как образ высоты и безопасности.
- source_word: יְרוֹמְמֵנִי
  choice: поднимет меня высоко
  rationale: Глагол רום передаёт движение вверх или помещение на высоте; перевод сохраняет образ физического избавления и защищённости.
theological_decisions:
- issue: Возможный храмовый оттенок слов סֻכּוֹ и אָהֳלוֹ
  choice: Передать их как «кров» и «шатёр», сохранив конкретные образы защиты без прямого отождествления со скинией-святилищем.
  alternative: Перевести оба слова выраженно культовыми терминами, например «скиния» или «святилище».
  rationale: Оба еврейских слова могут приобретать храмовые ассоциации в контексте псалма, однако сами по себе остаются обычными обозначениями укрытия и шатра. Перевод не устраняет возможный храмовый подтекст, но и не делает его единственным толкованием.
- issue: Значение רָעָה в выражении בְּיוֹם רָעָה
  choice: Понимать как бедствие или несчастье.
  alternative: Понимать как нравственное зло.
  rationale: Контекст говорит об угрожающей псалмопевцу беде, от которой Бог его защищает, поэтому ситуативное значение здесь вероятнее нравственного.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией. Три еврейские поэтические части соединены плавно; параллельные глаголы сокрытия переданы разными, но близкими русскими словами.
