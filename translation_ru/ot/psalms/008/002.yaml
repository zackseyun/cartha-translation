  text: מִ/פִּ֤י עֽוֹלְלִ֨ים וְֽ/יֹנְקִים֮ יִסַּ֪דְתָּ֫ עֹ֥ז לְמַ֥עַן צוֹרְרֶ֑י/ךָ לְ/הַשְׁבִּ֥ית א֝וֹיֵ֗ב וּ/מִתְנַקֵּֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/002.yaml
  text: From the mouths of infants and nursing babies you have established strength because of your foes[a], to silence the enemy and the avenger.
translation:
  language: ru
  text: Из уст младенцев и грудных детей Ты утвердил силу[a] из-за Твоих противников, чтобы заставить умолкнуть врага и мстителя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хвалу» — согласно традиции Септуагинты, отражённой в Матфея 21:16; в еврейском тексте стоит слово «сила».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִפִּי
  choice: Из уст
  rationale: Буквально передаёт сочетание предлога מִן со словом «уста» и естественно звучит по-русски; множественное число уместно при двух группах детей.
- source_word: עוֹלְלִים
  choice: младенцев
  rationale: Обозначает совсем маленьких детей; современное и понятное соответствие без архаического оттенка.
- source_word: וְיֹנְקִים
  choice: и грудных детей
  rationale: Причастная форма указывает на детей, питающихся грудью; перевод сохраняет конкретный образ и естественен для современного русского языка.
- source_word: יִסַּדְתָּ
  choice: Ты утвердил
  rationale: Глагол יסד означает «основать, утвердить». «Утвердил» хорошо сочетается с отвлечённым дополнением «сила» и сохраняет совершенный вид.
- source_word: עֹז
  choice: силу
  rationale: Обычное значение еврейского слова — «сила, мощь». Вариант «хвала» из греческой традиции вынесен в примечание.
- source_word: לְמַעַן
  choice: из-за
  rationale: В данном контексте выражает основание или повод, связанный с противниками. «Из-за» не создаёт ошибочного впечатления, будто действие совершается им на пользу, как могло бы подразумевать «ради».
- source_word: צוֹרְרֶיךָ
  choice: Твоих противников
  rationale: Причастное существительное обозначает враждебно настроенных оппонентов. «Противников» позволяет избежать немедленного повтора слова «враг».
- source_word: לְהַשְׁבִּית
  choice: чтобы заставить умолкнуть
  rationale: Каузативный инфинитив означает «прекратить, заставить перестать». В контексте силы, исходящей из уст, «заставить умолкнуть» естественно и образно передаёт смысл.
- source_word: אוֹיֵב
  choice: врага
  rationale: Единственное число употреблено как обобщённое обозначение враждебной стороны и сохранено в переводе.
- source_word: וּמִתְנַקֵּם
  choice: и мстителя
  rationale: Причастие обозначает того, кто мстит или стремится отомстить; «мститель» — краткое и точное русское соответствие.
theological_decisions:
- issue: Еврейское עֹז и связанный с Септуагинтой и Новым Заветом вариант «хвала»
  choice: В основном тексте переведено как «сила».
  alternative: «хвала»
  rationale: Масоретский еврейский текст ясно содержит слово со значением «сила, мощь». Приоритет отдан еврейскому источнику, но значимый вариант греческой традиции, отражённый в Матфея 21:16, сохранён в примечании.
- issue: Отношение установленной Богом силы к противникам
  choice: Оборот לְמַעַן передан как «из-за Твоих противников».
  alternative: «ради Твоих противников»; «ввиду Твоих противников»
  rationale: Формулировка сохраняет причинно-целевую связь, не внушая, что сила установлена ради блага противников; последующая цель выражена отдельным оборотом «чтобы заставить умолкнуть».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Ты» написано с прописной буквы как обращение к Богу; синтаксис остаётся ясным для обычного читателя. Смысловая неоднозначность לְמַעַן не развёрнута в толкование, а передана кратким причинным оборотом.
