  text: וַ/תְּחַסְּרֵ֣/הוּ מְּ֭עַט מֵ/אֱלֹהִ֑ים וְ/כָב֖וֹד וְ/הָדָ֣ר תְּעַטְּרֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/005.yaml
  text: Yet you made him a little lower than God[a], and crowned him with glory and honor.
translation:
  language: ru
  text: Ты сделал его лишь немного ниже Бога[a], славой и величием увенчал его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ниже небесных существ»; в Септуагинте: «ниже ангелов» — это чтение отражено в Евр 2:7.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּחַסְּרֵהוּ
  choice: Ты лишь немного умалил его
  rationale: Каузативная форма глагола חסר выражает приведение в более низкое положение; «умалил» естественно передаёт сравнительный смысл и сохраняет возвышенный поэтический строй.
- source_word: מְּעַט
  choice: лишь немного
  rationale: В еврейском контексте наиболее вероятна небольшая степень, а не краткая продолжительность.
- source_word: מֵאֱלֹהִים
  choice: перед Богом
  rationale: אֱלֹהִים здесь непосредственно допускает значение «Бог»; предлог «перед» по-русски естественно обозначает более низкое положение в сравнении. Иные возможные значения сохранены в сноске.
- source_word: וְכָבוֹד
  choice: славой
  rationale: כָּבוֹד обозначает славу и почёт; «слава» соответствует возвышенному параллелизму стиха.
- source_word: וְהָדָר
  choice: величием
  rationale: הָדָר означает величие, великолепие или достоинство; «величие» сохраняет образ дарованного высокого положения и не дублирует «славу».
- source_word: תְּעַטְּרֵהוּ
  choice: увенчал его
  rationale: Пиэль глагола עטר передаёт образ возложения венца; «увенчал» естественно сочетается со «славой и величием».
theological_decisions:
- issue: Референт и представительный смысл местоимения единственного числа
  choice: Сохранить «его»
  alternative: «их» или «человечество»
  rationale: Еврейский текст употребляет формы единственного числа, продолжая речь о человеке и сыне человеческом как представителе человечества; перевод не устраняет эту намеренную форму.
- issue: Передача אֱלֹהִים
  choice: Бог
  alternative: небесные существа; ангелы
  rationale: Приоритет еврейского источника поддерживает чтение «Бог». Значение «небесные существа» лексически возможно, а «ангелы» отражает Септуагинту и Евр 2:7; эти варианты отмечены, но не внесены в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия во второй строке сохраняет торжественный ритм, не делая текст архаичным.
