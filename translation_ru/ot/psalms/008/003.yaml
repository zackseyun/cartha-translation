base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/003.yaml
  text: When I look at your heavens[a], the work of your fingers, the moon and the stars, which you have set in place—
translation:
  language: ru
  text: Когда я смотрю на Твои небеса[a] — дела Твоих пальцев, на луну и звёзды, которые Ты утвердил, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь я вижу Твои небеса… которые Ты утвердил».'
    reason: Союз כִּי может иметь причинное значение («ведь», «ибо»), а אֶרְאֶה допускает простое «вижу».
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В этом поэтическом контексте союз вводит обстоятельство, из которого возникает вопрос следующего стиха. «Когда» естественно передаёт эту связь, не исключая возможного причинного оттенка.
- source_word: אֶרְאֶה
  choice: я смотрю
  rationale: Имперфект глагола ראה здесь описывает созерцание небес. «Смотрю» звучит естественно в современном русском языке и передаёт направленное наблюдение.
- source_word: שָׁמֶיךָ
  choice: Твои небеса
  rationale: Сохранено множественное число и поэтически возвышенный космический образ оригинала; «небо» было бы естественно, но формально уже.
- source_word: מַעֲשֵׂי אֶצְבְּעֹתֶיךָ
  choice: дело Твоих пальцев
  rationale: Сохраняется конструкция и антропоморфный образ. Единственное число «дело» естественно обозначает совокупный результат творения.
- source_word: יָרֵחַ וְכוֹכָבִים
  choice: луну и звёзды
  rationale: В русском винительный падеж обусловлен продолжением конструкции «смотрю на»; определённость этих небесных светил передаётся контекстом без артиклей.
- source_word: אֲשֶׁר
  choice: которые
  rationale: Относительное местоимение согласовано с ближайшим сочетанием «луну и звёзды» и естественно связывает его с завершающим глаголом.
- source_word: כּוֹנָנְתָּה
  choice: Ты утвердил
  rationale: Глагол כון в породе полель означает устанавливать, утверждать, приводить в прочное положение. «Утвердил» сохраняет идею прочного устроения и поэтический регистр.
theological_decisions:
- issue: Антропоморфный образ Божьего творческого действия
  choice: Сохранить буквально «Твоих пальцев»
  alternative: «творение Твоих рук» или «то, что Ты создал»
  rationale: Оригинал намеренно изображает творение как дело Божьих пальцев, подчёркивая близость и лёгкость созидательного действия. Буквальная передача сохраняет поэтическую силу, не утверждая телесность Бога.
- issue: Связь כִּי с последующим вопросом
  choice: Передать как временное «Когда»
  alternative: «Ибо» или «Ведь»
  rationale: Временное прочтение хорошо связывает созерцание небес с вопросом в следующем стихе, однако причинное понимание грамматически возможно и сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Метафора «пальцев» и множественное «небеса» сохранены. Тире в конце передаёт незавершённость мысли и переход к вопросу следующего стиха.
