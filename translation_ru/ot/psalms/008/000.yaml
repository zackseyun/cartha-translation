  text: For the choir director[a]; according to the Gittith[c][b]. A psalm of David.
translation:
  language: ru
  text: Руководителю хора; на гиттите[a]. Псалом Давида[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «гиттит» — вероятно, музыкальный или богослужебный термин; возможно, название напева или инструмента. Точное значение неизвестно.
    reason: cultural_note
  - marker: b
    text: 'Или: «псалом, написанный Давидом» либо «псалом для Давида». Еврейское выражение может обозначать авторство, принадлежность или иную связь с Давидом.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов это слово обычно обозначает человека, руководящего музыкальным исполнением. Такой перевод ясен современному читателю и сохраняет форму адресования.
- source_word: עַל
  choice: на
  rationale: В музыкальных указаниях над псалмами предлог может вводить название напева, инструмента или иной способ исполнения. Краткое «на» сохраняет техническую неопределённость оригинала.
- source_word: הַגִּתִּית
  choice: гиттите
  rationale: Точное значение термина неизвестно; вероятно, это музыкальное или богослужебное обозначение, возможно название напева либо инструмента. Транслитерация не навязывает недоказанное толкование.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшееся и точное русское обозначение данного жанра.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русская родительная конструкция естественно передаёт традиционное надписание и, подобно еврейской конструкции, не обязана однозначно указывать только на авторство.
theological_decisions:
- issue: Характер связи Давида с псалмом в לְדָוִד
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида
  rationale: Предлог לְ может указывать на авторство, принадлежность, посвящение или связь со сборником. Формулировка «Псалом Давида» сохраняет эту неоднозначность, не решая исторический вопрос за текст.
translation_notes:
  register: Современный литературный русский язык с краткой, достоинственной формой надписания. Семиколон связывает указание исполнителю с музыкальным указанием. Неясный технический термин сохранён в транслитерации и пояснён в сноске.
