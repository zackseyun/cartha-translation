lexical_decisions:
- source_word: צִפּוֹר שָׁמַיִם
  choice: птиц небесных
  rationale: Форма צִפּוֹר морфологически единственного числа, но здесь имеет собирательное значение; русское множественное число естественно передаёт категорию живых существ. «Небесных» сохраняет возвышенную поэтическую окраску שָׁמַיִם.
- source_word: וּדְגֵי הַיָּם
  choice: и рыб морских
  rationale: Сочетание в сопряжённом состоянии означает рыб моря; традиционный поэтический порядок слов по-русски краток, ясен и соответствует ряду существ.
- source_word: עֹבֵר
  choice: всё, что проходит
  rationale: Причастие стоит в единственном числе, однако, вероятно, употреблено собирательно и обобщает морских обитателей. Формулировка не ограничивает смысл одной особью и сохраняет широту выражения.
- source_word: אָרְחוֹת יַמִּים
  choice: путями морей
  rationale: «Пути» передают образ אָרְחוֹת, а множественное «морей» сохраняет число еврейского יַמִּים и поэтический размах строки.
theological_decisions:
- issue: К чему относится причастие עֹבֵר
  choice: 'Передать его как собирательное обобщение: «всё, что проходит».'
  alternative: 'Связать его только с «рыбами морскими»: «проходящих путями морей».'
  rationale: Единственное число допускает собирательное прочтение, а синтаксис не устраняет полностью возможность более узкой связи с рыбами. Основной текст передаёт вероятное обобщение, а примечание сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой образностью. Инверсия «птиц небесных», «рыб морских» звучит естественно в поэзии; множественное «морей» намеренно сохраняет форму и широту еврейского текста.
