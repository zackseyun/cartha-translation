  text: מָֽה אֱנ֥וֹשׁ כִּֽי תִזְכְּרֶ֑/נּוּ וּ/בֶן אָ֝דָ֗ם כִּ֣י תִפְקְדֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/004.yaml
  text: What is man that you remember him[c][b][a], and the son of man that you attend to him?
translation:
  language: ru
  text: Что такое человек[a], что Ты помнишь о нём, и сын человеческий[b], что Ты заботишься о нём[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смертный». Еврейское אֱנוֹשׁ нередко подчёркивает слабость и смертность человека.'
    reason: lexical_alternative
  - marker: b
    text: «Сын человеческий» здесь — еврейское поэтическое обозначение человека. В более поздних библейских текстах выражение может приобретать мессианское значение, но в этом псалме оно служит параллельным обозначением человека.
    reason: cross_reference
  - marker: c
    text: 'Или: «обращаешь на него внимание», «посещаешь его». Еврейский глагол может обозначать внимание, посещение, попечение или вмешательство в чью-либо жизнь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: Что такое
  rationale: Естественно передаёт именной риторический вопрос о малости и незначительности человека.
- source_word: אֱנוֹשׁ
  choice: смертный
  rationale: Сохраняет характерный для אֱנוֹשׁ оттенок человеческой слабости и смертности, а также единственное число с собирательно-представительным значением.
- source_word: כִּי
  choice: что
  rationale: В обеих параллельных частях вводит содержание риторического вопроса и естественно звучит по-русски.
- source_word: תִזְכְּרֶנּוּ
  choice: Ты помнишь о нём
  rationale: Прямо передаёт обычное значение זכר и подразумеваемое продолжающееся внимание Бога.
- source_word: וּבֶן אָדָם
  choice: и сын человеческий
  rationale: Сохраняет еврейский поэтический образ, единственное число и каноническое звучание; строчная буква показывает, что в непосредственном контексте это общее обозначение человека, а не явно выраженный титул.
- source_word: תִפְקְדֶנּוּ
  choice: Ты заботишься о нём
  rationale: В данном благожелательном контексте естественно передаёт деятельное Божье внимание, не используя малопонятное современному читателю буквальное «посещаешь»; широта значения отмечена в сноске.
theological_decisions:
- issue: Представительное мужское единственное число как обозначение человечества
  choice: Сохранить формы «смертный» и «сын человеческий» в единственном числе
  alternative: «люди», «человечество»
  rationale: Еврейский текст говорит о человеке в представительном единственном числе; это сохраняет поэтический параллелизм и межтекстовые связи.
- issue: Мессианское ли выражение «сын человеческий» в этом стихе
  choice: Писать со строчной буквы и понимать здесь как поэтическое обозначение человека
  alternative: «Сын Человеческий» как явный мессианский титул
  rationale: Непосредственный контекст псалма говорит о человечестве; последующее христологическое применение не требует превращать выражение в титул уже в основном тексте этого стиха.
- issue: Характер Божьего действия в תִפְקְדֶנּוּ
  choice: «заботишься о нём»
  alternative: «посещаешь его», «обращаешь на него внимание»
  rationale: Контекст указывает на благосклонное внимание Бога, однако многозначность глагола не должна исчезнуть и потому отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной псалмовой интонацией. Местоимение «Ты» написано с прописной буквы как уместная русская форма благоговейного обращения к Богу; синтаксический параллелизм оригинала сохранён.
