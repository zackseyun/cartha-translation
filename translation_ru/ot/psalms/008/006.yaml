  yaml_path: translation/ot/psalms/008/006.yaml
  text: You made him rule over the works of your hands[b][a]; you put everything under his feet.
translation:
  language: ru
  text: Ты дал ему владычествовать над делами рук Твоих[a]; всё положил под его ноги.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дал ему власть над делами рук Твоих».'
    reason: lexical_alternative
  - marker: b
    text: Слова «ему» и «его» относятся к человеку как представителю человечества в целом; в еврейском тексте употреблено единственное число мужского рода.
    reason: cultural_note
lexical_decisions:
- source_word: תַּמְשִׁילֵהוּ
  choice: Ты поставил его владычествовать
  rationale: Хифиль глагола משל выражает наделение властью, то есть назначение кого-либо правителем. «Поставил его владычествовать» сохраняет каузативный смысл и звучит достойно и естественно в поэтическом контексте.
- source_word: בְּמַעֲשֵׂי יָדֶיךָ
  choice: над делами рук Твоих
  rationale: Предлог ב при משל обозначает область или объект владычества. Формулировка сохраняет конкретный древнееврейский образ Божьих рук.
- source_word: כֹּל
  choice: всё
  rationale: Абсолютное כֹּל в контексте имеет всеохватный смысл и относится ко всему сотворённому, вверенному человеку.
- source_word: שַׁתָּה
  choice: положил
  rationale: Глагол שׁית означает «класть, помещать, ставить». «Положил» прямо передаёт действие и естественно сочетается с образом «под ноги».
- source_word: תַחַת רַגְלָיו
  choice: под ноги его
  rationale: Сохранён буквальный образ, который одновременно выражает подчинение и власть.
theological_decisions:
- issue: Единственное число мужского рода как собирательное обозначение человечества
  choice: Сохранить формы «его» и «его»
  alternative: 'Передать во множественном числе: «их», «под их ноги»'
  rationale: В еврейском тексте продолжаются формы единственного числа мужского рода из предыдущего стиха. Они представляют человека как человечество в целом; изменение числа устранило бы грамматическую и литературную связь.
- issue: Характер данной человеку власти над творением
  choice: «поставил его владычествовать»
  alternative: «дал ему власть» или «дал ему господство»
  rationale: 'Выбранная формулировка сохраняет каузативную глагольную конструкцию: Бог назначил человека осуществлять власть, не добавляя к тексту более отвлечённого существительного.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Сохранены параллелизм, образ «дел рук» и идиома «под ноги». Местоимение «Твоих» написано с прописной буквы в соответствии с принятой русской библейской традицией.
