  to: Яхве[a], Владыка наш! Как величественно имя Твоё по всей земле! Ты поместил великолепие Своё выше небес.[b]
  rationale: Исправление непосредственно передаёт личное имя יהוה как «Яхве», сохраняя различие между ним и титулом «Владыка». Глагол заменён на «поместил» ради более нейтрального соответствия נתן. Сноска b сохранена, поскольку форма תְּנָה допускает спорное повелительное прочтение; якоря сносок остаются корректными.
