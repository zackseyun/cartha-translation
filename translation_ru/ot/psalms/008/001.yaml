  terminology: «Яхве» прямо передаёт יהוה и согласуется с английским аудит-трейлом, где выбран Yahweh. «Владыка наш» удачно передаёт אֲדֹנֵינוּ без смешения с божественным именем. «Великолепие» является оправданной передачей הוֹד; сноска корректно отмечает возможное повелительное понимание трудной формы תְּנָה.
