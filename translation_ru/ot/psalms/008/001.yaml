base_translation:
  language: en
  yaml_path: translation/ot/psalms/008/001.yaml
  text: O Yahweh[a], our Lord[c][b], how majestic is your name in all the earth—you have set your splendor above the heavens.
translation:
  language: ru
  text: Яхве[a], Владыка наш! Как величественно имя Твоё по всей земле! Ты поместил великолепие Своё выше небес.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте стоит имя יהוה (YHWH), передаваемое как «Яхве»; традиционная русская передача — «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Еврейская форма трудна; возможно также: «вознеси великолепие Своё выше небес».'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: В русском обращении традиционная передача имени YHWH как «Господь» естественна и узнаваема; звательная форма «Господи» соответствует прямому обращению. Само имя поясняется в сноске.
- source_word: אֲדֹנֵינוּ
  choice: Владыка наш
  rationale: Позволяет отличить титул אֲדֹן от стоящего рядом имени YHWH и передаёт власть Бога естественным, торжественным русским выражением.
- source_word: מָה אַדִּיר
  choice: как величественно
  rationale: Сочетание מָה с אַדִּיר имеет восклицательный смысл и выражает восхищение величием, а не вопрос.
- source_word: שִׁמְךָ
  choice: имя Твоё
  rationale: Сохранён еврейский образ имени как явленного достоинства и известности Бога без поясняющего перифраза.
- source_word: בְּכָל הָאָרֶץ
  choice: по всей земле
  rationale: Передаёт всеобщий, космический охват и естественно сочетается с упоминанием небес.
- source_word: תְּנָה
  choice: Ты вознёс
  rationale: В контексте поэтического утверждения передаёт помещение Божьего великолепия превыше небес; трудность формы и возможное повелительное прочтение отмечены в сноске.
- source_word: הוֹדְךָ
  choice: великолепие Своё
  rationale: הוֹד обозначает сияющее величие, великолепие или славу. «Великолепие» сохраняет поэтический образ и не повторяет однокоренное «величественно».
- source_word: עַל הַשָּׁמָיִם
  choice: выше небес
  rationale: Здесь עַל выражает превосходящее, возвышенное положение Божьего великолепия относительно небес.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господи с пояснением «Яхве» в сноске
  alternative: О Яхве
  rationale: Русская звательная форма сохраняет естественность молитвенного обращения, а сноска делает явным, что в еврейском тексте стоит личное имя YHWH, не смешивая его со следующим титулом אֲדֹנֵינוּ.
- issue: Синтаксис תְּנָה הוֹדְךָ
  choice: 'утверждение: «Ты вознёс великолепие Своё»'
  alternative: 'повеление: «вознеси великолепие Своё»'
  rationale: Контекст гимнической хвалы поддерживает утверждение о Божьем величии, однако масоретская форма допускает трудное повелительное прочтение, которое сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Инверсия «имя Твоё» и прописные местоимения поддерживают привычный регистр русской библейской поэзии, не делая синтаксис архаичным.
