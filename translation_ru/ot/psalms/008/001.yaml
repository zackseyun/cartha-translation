  source_fidelity: 'Основной смысл передан точно: обращение к YHWH как к «нашему Владыке», восхищение величием имени по всей земле и утверждение о великолепии/славе над небесами. Однако «Господи» заменяет личное имя יהוה титулом, хотя в сноске имя отмечено; для различения יהוה и следующего אֲדֹנֵינוּ в самом тексте предпочтительно «Яхве». «Вознёс» допустимо, но несколько сильнее подразумевает поднятие; «поместил» точнее передаёт נתן («поставил, поместил»).'
