lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано транслитерацией личного имени Бога, чтобы сохранить отличие тетраграмматона от следующего за ним титула אֲדֹנֵינוּ.
- source_word: אֲדֹנֵינוּ
  choice: Господь наш
  rationale: В обращении к Богу этот титул естественно выражает Его власть и владычество; вариант «Владыка наш» возможен, но менее непосредственно соответствует привычному современному библейскому обращению.
- source_word: מָה
  choice: как
  rationale: Восклицательное מָה перед прилагательным передаёт степень и восхищение, чему в русском естественно соответствует «как».
- source_word: אַדִּיר
  choice: величественно
  rationale: Слово выражает величие, могущество и внушающую почтение славу; наречная форма естественно сочетается в русском с выражением «имя Твоё».
- source_word: שִׁמְךָ
  choice: имя Твоё
  rationale: Сохранён образ исходного текста, где имя обозначает явленную славу и известность Бога, без разворачивания этого смысла в переводе.
- source_word: בְּכָל הָאָרֶץ
  choice: по всей земле
  rationale: В контексте псалма הָאָרֶץ имеет всемирный охват; русское «по всей земле» естественно передаёт распространённость Божьего величия.
theological_decisions:
- issue: Последовательность личного имени и титула יְהוָה אֲדֹנֵינוּ
  choice: Яхве, Господь наш
  alternative: Господи, Владыка наш
  rationale: Основной текст сохраняет личное имя YHWH и отличает его от титула אֲדֹנֵינוּ. Традиционный перевод «Господь» для YHWH возможен, но в данной последовательности способен затушевать различие между именем и титулом.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной формой прямого обращения. Заглавные буквы в местоимении «Твоё» поддерживают принятый благоговейный регистр, не меняя смысла оригинала.
