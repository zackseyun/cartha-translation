translation:
  language: ru
  text: Свет посеян для праведника[a], и радость — для тех, чьё сердце право.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Свет рассеян для праведника». Еврейский текст сохраняет земледельческий образ: свет представлен как нечто посеянное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹר
  choice: Свет
  rationale: Сохраняет ёмкий поэтический образ, который может подразумевать благословение, избавление или благополучие, не сужая его до одного толкования.
- source_word: זָרֻעַ
  choice: посеян
  rationale: Буквально передаёт страдательное причастие от זרע и сохраняет земледельческую метафору оригинала.
- source_word: לַצַּדִּיק
  choice: для праведника
  rationale: Предлог ל выражает предназначение или благо; единственное число сохраняет обобщённый образ праведного человека.
- source_word: וּלְיִשְׁרֵי לֵב
  choice: и радость — для тех, чьё сердце право
  rationale: Естественно по-русски передаёт идиому «прямые сердцем», сохраняя нравственный смысл внутренней цельности и параллелизм стиха.
- source_word: שִׂמְחָה
  choice: радость
  rationale: Краткое и современное соответствие, хорошо согласующееся с параллельным образом света.
theological_decisions:
- issue: Метафорический смысл света
  choice: Сохранена метафора «Свет посеян», без явного сведения света к спасению, благополучию или оправданию.
  alternative: «Для праведника приготовлено избавление» или «Праведнику уготовано благополучие».
  rationale: Древнееврейский текст оставляет образ широким и поэтически напряжённым; перевод не должен устранять эту многозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконизма и параллелизма еврейской поэзии. Тире во второй строке обозначает подразумеваемое сказуемое «посеяна» и делает конструкцию естественной по-русски.
