  text: אֵ֭שׁ לְ/פָנָ֣י/ו תֵּלֵ֑ךְ וּ/תְלַהֵ֖ט סָבִ֣יב צָרָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/003.yaml
  text: Fire goes before him and burns his adversaries all around[a].
translation:
  language: ru
  text: Огонь идёт перед ним и со всех сторон сжигает его противников[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его врагов».'
    reason: Лексема צָר допускает передачу как «противник» и как «враг».
lexical_decisions:
- source_word: אֵשׁ
  choice: Огонь
  rationale: Существительное обозначает огонь; в русской поэтической речи естественно употребление без неопределённого артикля.
- source_word: לְפָנָיו
  choice: перед ним
  rationale: Буквально-пространственное выражение «перед его лицом» идиоматически означает «перед ним» и сохраняет образ огня, предваряющего явление Бога.
- source_word: תֵּלֵךְ
  choice: идёт
  rationale: Обычное значение הלך — «идти»; с огнём в роли подлежащего это естественно и сохраняет олицетворённый поэтический образ.
- source_word: וּתְלַהֵט
  choice: сжигает
  rationale: Форма от להב передаёт действие пылающего, обжигающего огня. «Сжигает» ясно выражает разрушительную силу, не добавляя явно не обозначенного результата вроде «испепеляет».
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Наречие указывает на окружающее пространство; этот русский оборот естественно передаёт полноту охвата.
- source_word: צָרָיו
  choice: его противников
  rationale: צָר обозначает того, кто враждебно противостоит другому. «Противники» сохраняет значение противостояния; допустимый вариант «враги» вынесен в сноску.
theological_decisions:
- issue: К кому относятся местоименные суффиксы третьего лица мужского рода в контексте богоявления в Псалме 97
  choice: Сохранить местоимения «ним/его», не вставляя в стих прямо имя Господа.
  alternative: Огонь идёт перед Господом и со всех сторон сжигает его противников.
  rationale: В еврейском тексте употреблены местоименные суффиксы, а их референт устанавливается из контекста. Местоименная передача сохраняет поэтическое течение и не добавляет отсутствующего в данном стихе существительного.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Местоимения оставлены со строчной буквы в соответствии с обычной современной орфографией и формой исходного текста; подлежащее «Огонь» вынесено вперёд для сохранения еврейского порядка образов.
