lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего утверждения; «ибо» естественно передаёт причинно-пояснительную связь в возвышенной поэтической речи.
- source_word: אַתָּה
  choice: Ты
  rationale: 'Отдельное местоимение сохранено ради эмфазы: именно Яхве обладает верховной высотой.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени транслитерацией сохраняет отличие имени от титула.
- source_word: עֶלְיוֹן
  choice: Всевышний
  rationale: Устоявшееся и понятное русское соответствие, передающее высшее положение; здесь употреблено как именная часть сказуемого.
- source_word: עַל כָּל הָאָרֶץ
  choice: над всей землёй
  rationale: Предлог выражает превосходство и верховенство, а כָּל охватывает землю целиком.
- source_word: מְאֹד נַעֲלֵיתָ
  choice: превознесён высоко
  rationale: Форма глагола передаёт достигнутое, сохраняющееся возвышенное положение, а наречие усиливает его степень.
- source_word: עַל כָּל אֱלֹהִים
  choice: над всеми богами
  rationale: Множественное «богами» наиболее прямо сохраняет лексическую форму, полемическую силу и неразрешённость вопроса о точном составе названных существ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» передаёт личное имя, не заменяя его титулом; эта форма соответствует принятой научной реконструкции произношения.
- issue: Значение אֱלֹהִים в заключительной строке
  choice: боги
  alternative: божественные существа; небесные существа
  rationale: '«Боги» прямо передаёт множественное значение и сохраняет богословское напряжение: сам стих не уточняет, имеются ли в виду божества народов, идолы или небесные существа.'
- issue: Соотношение עֶלְיוֹן и נַעֲלֵיתָ
  choice: Всевышний; превознесён
  alternative: высочайший; вознёсся
  rationale: Перевод сохраняет параллелизм верховного положения и превознесённости, не представляя вторую строку как обязательно описывающую отдельное событие возвышения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Заглавное «Ты» отмечает обращение к Богу по принятой русской традиции. Инверсия и тире помогают сохранить эмфазу еврейского אַתָּה, не делая фразу архаичной.
