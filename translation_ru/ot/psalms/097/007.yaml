source:
  edition: WLC
  text: יֵבֹ֤שׁוּ כָּל עֹ֬בְדֵי פֶ֗סֶל הַ/מִּֽתְהַלְלִ֥ים בָּ/אֱלִילִ֑ים הִשְׁתַּחֲווּ ל֝/וֹ כָּל אֱלֹהִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/007.yaml
  text: Let all who serve carved images be put to shame[a], those who boast in idols; bow down to him, all gods.
translation:
  language: ru
  text: Да постыдятся все, кто служит изваяниям, кто хвалится идолами. Поклонитесь Ему, все боги.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все небесные существа»; или: «все ангелы». Буквально в еврейском тексте: «все боги». Это может быть полемическим упоминанием богов народов или обозначением небесных существ, предстоящих перед Господом.'
    reason: alternative_reading
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: да постыдятся
  rationale: Форма выражает пожелание или провозглашение позора; «да постыдятся» сохраняет эту модальность и звучит естественно в возвышенной поэтической речи.
- source_word: עֹבְדֵי
  choice: кто служит
  rationale: Причастие от עבד обозначает служение, здесь явно культовое; «служит» сохраняет основной лексический смысл, не сводя его только к акту поклонения.
- source_word: פֶסֶל
  choice: изваяниям
  rationale: Слово обозначает сделанное, прежде всего высеченное или вырезанное изображение; «изваяния» передаёт конкретность в отличие от более общего «идолы».
- source_word: הַמִּתְהַלְלִים
  choice: кто хвалится
  rationale: Форма хитпаэль передаёт похвальбу или превозношение; «хвалится» естественно сочетается с предложным дополнением и сохраняет параллелизм.
- source_word: בָּאֱלִילִים
  choice: идолами
  rationale: אֱלִילִים обозначает идолов и часто несёт оттенок ничтожности; русский творительный после «хвалиться» идиоматически передаёт еврейскую конструкцию с ב.
- source_word: הִשְׁתַּחֲווּ
  choice: поклонитесь
  rationale: Императив обозначает простирание или склонение в знак почтения. «Поклонитесь» сохраняет телесный и культовый смысл и подходит современному литературному русскому.
- source_word: לוֹ
  choice: Ему
  rationale: Местоименное дополнение с ל прямо указывает на адресата поклонения; прописная буква ясно соотносит местоимение с Господом в контексте псалма, не добавляя нового имени.
- source_word: כָּל אֱלֹהִים
  choice: все боги
  rationale: 'Буквальный перевод сохраняет намеренную смысловую напряжённость: речь может идти полемически о богах народов либо о небесных существах.'
theological_decisions:
- issue: Кого обозначает כָּל אֱלֹהִים
  choice: все боги
  alternative: все небесные существа; все ангелы
  rationale: Еврейский текст буквально говорит «все боги». Основной текст сохраняет это выражение и его полемическую либо небесно-советную интерпретационную возможность, а альтернативы вынесены в примечание.
- issue: Сила формы יֵבֹשׁוּ
  choice: да постыдятся
  alternative: постыдятся; будут посрамлены
  rationale: Форма может восприниматься как пожелание, призыв к наступлению суда или поэтическое утверждение. «Да постыдятся» сохраняет волитивный оттенок без излишнего уточнения действующего лица.
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим оттенком. Сохранены параллелизм двух причастных оборотов, императив и буквальное «все боги»; архаизмы вроде «истуканы» и тяжеловесное «повергнитесь ниц» не использованы.
