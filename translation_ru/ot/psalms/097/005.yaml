  text: הָרִ֗ים כַּ/דּוֹנַ֗ג נָ֭מַסּוּ מִ/לִּ/פְנֵ֣י יְהוָ֑ה מִ֝/לִּ/פְנֵ֗י אֲד֣וֹן כָּל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/005.yaml
  text: The mountains melt like wax before Yahweh[b][a], before the Lord of all the earth.
translation:
  language: ru
  text: Горы тают, как воск, перед Яхве[a], перед Владыкой всей земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально означает «от лица (или присутствия) Яхве»; здесь передано как «перед Яхве».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: горы
  rationale: Определённое существительное во множественном числе; в русском языке образ естественно передаётся без артикля.
- source_word: כַּדּוֹנַג
  choice: как воск
  rationale: Префикс כּ выражает сравнение; формулировка сохраняет ясный поэтический образ.
- source_word: נָמַסּוּ
  choice: тают
  rationale: Глагол означает «таять, плавиться». Настоящее время передаёт живую картину теофании, хотя еврейская форма формально перфектная.
- source_word: מִלִּפְנֵי
  choice: пред
  rationale: Идиома буквально указывает на удаление или действие «от лица/присутствия»; поэтическое «пред» естественно сохраняет смысл присутствия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божественное имя, а не заменено титулом.
- source_word: אֲדוֹן
  choice: Владыкой
  rationale: Слово означает «господин, владыка». «Владыка» отличает титул от личного имени и соответствует возвышенному поэтическому регистру.
- source_word: כָּל הָאָרֶץ
  choice: всей земли
  rationale: 'Сохраняется конструкция принадлежности и всеобщий охват: Владыка всей земли.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное имя и не смешивает его со следующим титулом אֲדוֹן.
- issue: Временной и аспектуальный смысл נָמַסּוּ
  choice: настоящее время «тают»
  alternative: «растаяли»; «таяли»
  rationale: Еврейский поэтический перфект допускает яркое изображение события как непосредственно видимого. Настоящее время естественно по-русски и не навязывает строгой временной последовательности.
- issue: Передача אֲדוֹן рядом с именем Яхве
  choice: Владыка
  alternative: Господь
  rationale: Оба варианта возможны, но «Владыка» ясно передаёт титул господства над всей землёй и избегает неясности между личным именем и традиционной заменой тетраграмматона.
translation_notes:
  register: Современный литературный русский язык с кратким возвышенным ритмом. Форма «пред» выбрана как допустимая поэтическая форма, созвучная параллелизму стиха; архаизмы и конфессионально специфическая терминология не вводятся.
