    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחוּ
  choice: радуйтесь
  rationale: Повелительная форма множественного числа прямо призывает к радости; «радуйтесь» естественно и точно передаёт силу формы.
- source_word: צַדִּיקִים
  choice: праведники
  rationale: Слово употреблено как обращение к группе людей, отличающихся праведностью; русская форма без местоимения естественно передаёт обращение.
- source_word: בַּיהוָה
  choice: о Яхве
  rationale: Предлог ב обозначает Того, в Ком или о Ком радуются. Русское «радоваться о» сохраняет направленность радости на Яхве и остаётся узнаваемым возвышенным библейским оборотом.
- source_word: יהוה
  choice: Яхве
  rationale: Передано личное заветное имя, стоящее непосредственно в еврейском тексте, без замены титулом «Господь».
- source_word: וְהוֹדוּ
  choice: и благодарите
  rationale: Hiphil, повелительная форма множественного числа от ידה; в данном контексте обозначает благодарение, хотя слово может включать оттенок хвалы.
- source_word: לְזֵכֶר
  choice: вспоминая
  rationale: זֵכֶר может означать воспоминание, памятование или упоминание. Деепричастный оборот естественно выражает обстоятельственный смысл לְ и избегает тяжеловесного «при воспоминании».
- source_word: קָדְשׁוֹ
  choice: Его святость
  rationale: Буквально «Его святость». Слово «имя» в еврейском тексте отсутствует, поэтому оно не добавлено.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное заветное имя Бога. Транслитерация сохраняет различие между именем и титулом, а традиционный вариант отмечен в сноске.
- issue: Следует ли добавлять слово «имя» в выражении לְזֵכֶר קָדְשׁוֹ
  choice: Его святость
  alternative: Его святое имя
  rationale: Хотя «святое имя» знакомо по сходным псалмовым формулам, существительного שֵׁם («имя») здесь нет. Основной текст сохраняет буквальный объект «Его святость», а идиоматическая традиционная передача указана как возможная в сноске.
- issue: Значение זֵכֶר
  choice: воспоминание
  alternative: упоминание
  rationale: Существительное допускает оба значения, и контекст не требует окончательно устранять эту неоднозначность; основное значение передано в тексте, второе сохранено в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейским звучанием. Оборот «радоваться о» слегка торжественен, однако уместен в поэтическом обращении и точнее сохраняет связь радости с Яхве. Второе полустишие перестроено деепричастным оборотом ради естественности русского синтаксиса без устранения лексической неоднозначности.
