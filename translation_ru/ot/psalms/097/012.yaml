  text: Радуйтесь в Яхве[a], праведники, и благодарите при воспоминании о его святости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть личное имя Бога; традиционная передача: «Господь».'
