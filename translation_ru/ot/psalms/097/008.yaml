lexical_decisions:
- source_word: שָׁמְעָה
  choice: услышал
  rationale: Форма qal, перфект 3-го лица женского рода единственного числа; подлежащее — Сион. В русском название «Сион» мужского рода, поэтому требуется форма «услышал».
- source_word: וַתִּשְׂמַח
  choice: и возрадовался
  rationale: Глагол שׂמח означает радость; «возрадовался» сохраняет поэтический регистр и отличается от более сильного последующего «возликовали».
- source_word: צִיּוֹן
  choice: Сион
  rationale: Собственное имя передано в традиционной русской форме без замены на Иерусалим, хотя здесь возможна метонимия.
- source_word: וַתָּגֵלְנָה
  choice: и возликовали
  rationale: Глагол גיל выражает бурную, торжествующую радость; «возликовали» передаёт усиленный оттенок и сохраняет различие со שׂמח.
- source_word: בְּנוֹת יְהוּדָה
  choice: дочери Иуды
  rationale: Буквальный поэтический образ сохранён в основном тексте; возможное значение «города/селения Иудеи» вынесено в примечание, чтобы не устранять неоднозначность.
- source_word: לְמַעַן
  choice: из-за
  rationale: В данном контексте предлог указывает причину радости; «из-за» естественно передаёт причинное значение, не добавляя цели.
- source_word: מִשְׁפָּטֶיךָ
  choice: Твоих судов
  rationale: מִשְׁפָּט обозначает суды, судебные решения или проявления правосудия. «Суды» сохраняет широту и традиционную библейскую ёмкость выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом; звательная интонация в русском ясна без частицы «о».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не заменяет его титулом.
- issue: Буквальное или географическое понимание בְּנוֹת יְהוּדָה
  choice: дочери Иуды
  alternative: города Иудеи / селения Иудеи
  rationale: Основной текст сохраняет буквальный образ и его поэтическую силу, а примечание сообщает вероятное географическое употребление, не разрешая неоднозначность молча.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Формы «возрадовался» и «возликовали» уместны для псалма и передают различие двух еврейских глаголов радости. Местоимение «Твоих» написано с прописной буквы как стилистическая норма данного религиозного регистра.
