  text: אֹהֲבֵ֥י יְהוָ֗ה שִׂנְא֫וּ רָ֥ע שֹׁ֭מֵר נַפְשׁ֣וֹת חֲסִידָ֑י/ו מִ/יַּ֥ד רְ֝שָׁעִ֗ים יַצִּילֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/010.yaml
  text: You who love Yahweh[a], hate evil. He guards the lives of his faithful ones; from the hand of the wicked he delivers them.
translation:
  language: ru
  text: Вы, любящие Яхве, ненавидьте зло! Он хранит жизни верных Ему[a] и избавляет их из рук нечестивых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жизни (или души) Его святых». Еврейское слово נֶפֶשׁ может означать «жизнь», «человека» или «душу», а חָסִיד — «верный», «благочестивый» или «святой».'
    reason: Лексическая многозначность обоих слов допускает традиционный вариант, не требуя метафизического понимания слова «душа».
lexical_decisions:
- source_word: אֹהֲבֵי יְהוָה
  choice: Любящие Яхве
  rationale: Причастная конструкция обозначает тех, кто любит Яхве; в сочетании с повелением естественно воспринимается как обращение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: שִׂנְאוּ רָע
  choice: ненавидьте зло
  rationale: Форма глагола — прямое повеление во множественном числе; רָע обозначает зло в широком нравственном смысле.
- source_word: שֹׁמֵר
  choice: хранит
  rationale: Причастие выражает постоянное, характерное действие Яхве; русский глагол «хранит» естественно передаёт защиту и сохранение.
- source_word: נַפְשׁוֹת
  choice: жизнь
  rationale: В контексте защиты и избавления נֶפֶשׁ означает жизнь или самого человека, а не обязательно нематериальную душу. Собирательное единственное число по-русски звучит естественнее применительно ко множеству людей.
- source_word: חֲסִידָיו
  choice: верных Ему
  rationale: Слово обозначает принадлежащих Богу людей, отличающихся преданностью и благочестием; формулировка сохраняет отношение верности и избегает узкоцерковного оттенка слова «святые».
- source_word: מִיַּד רְשָׁעִים
  choice: из руки нечестивых
  rationale: Сохранён древнееврейский образ руки как власти или контроля; он понятен в русском библейском регистре.
- source_word: יַצִּילֵם
  choice: избавляет их
  rationale: Глагол выражает активное спасение из-под власти нечестивых; настоящее время согласуется с причастием שֹׁמֵר и представляет действие как характерное для Бога.
theological_decisions:
- issue: Значение נַפְשׁוֹת в данном контексте
  choice: жизнь
  alternative: души; самих людей
  rationale: Речь идёт о Божьей защите и избавлении от нечестивых, поэтому конкретное значение «жизнь» вероятнее узкого метафизического понимания «душа».
- issue: Передача חֲסִידָיו
  choice: верных Ему
  alternative: Его святых; Его благочестивых; преданных Ему
  rationale: Перевод передаёт верность и принадлежность Богу, не сводя слово ни к нравственной респектабельности, ни к позднейшему специальному употреблению термина «святые».
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейским звучанием. Повеление передано прямо, параллелизм двух Божьих действий сохранён; архаизмы сведены к понятному образу «из руки нечестивых».
