  text: יְהוָ֣ה מָ֭לָךְ תָּגֵ֣ל הָ/אָ֑רֶץ יִ֝שְׂמְח֗וּ אִיִּ֥ים רַבִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/001.yaml
  text: Yahweh reigns[a]; let the earth rejoice; let the many coastlands be glad.
translation:
  language: ru
  text: Яхве царствует! Да ликует земля, да радуются многочисленные побережья[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «острова». Еврейское слово может обозначать острова или отдалённые приморские земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: מָלָךְ
  choice: царствует
  rationale: Естественно выражает провозглашение действующей царской власти, не исключая возможного оттенка восшествия на престол, присущего форме qatal.
- source_word: תָּגֵל
  choice: да ликует
  rationale: Передаёт побудительно-желательное значение имперфекта в поэтическом контексте.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В параллели с многочисленными побережьями обозначает весь мир, а не только землю Израиля.
- source_word: יִשְׂמְחוּ
  choice: да радуются
  rationale: Сохраняет побудительно-желательное значение и поэтический параллелизм, избегая ненужного повтора глагола «ликовать».
- source_word: אִיִּים
  choice: побережья
  rationale: Слово может обозначать острова либо отдалённые приморские земли; «побережья» естественно передаёт широкий географический горизонт стиха.
- source_word: רַבִּים
  choice: многочисленные
  rationale: Точно передаёт количественное определение и соответствует возвышенному поэтическому регистру.
theological_decisions:
- issue: Масштаб провозглашённого царствования Яхве
  choice: Всеобщее и настоящее царствование Яхве над миром
  alternative: Локальное царствование над землёй Израиля либо строго ингрессивная формула «Яхве воцарился»
  rationale: Параллелизм между землёй и многочисленными побережьями указывает на всемирный масштаб. «Царствует» сохраняет утверждение о царской власти Бога, не сводя форму исключительно к моменту воцарения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным псалмическим звучанием. Восклицательный знак после первого утверждения подчёркивает характер провозглашения; параллельные конструкции «да ликует… да радуются…» сохраняют поэтическую симметрию оригинала.
