  text: עָנָ֣ן וַ/עֲרָפֶ֣ל סְבִיבָ֑י/ו צֶ֥דֶק וּ֝/מִשְׁפָּ֗ט מְכ֣וֹן כִּסְאֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/002.yaml
  text: Clouds and thick darkness are around him[a]; righteousness and justice are the foundation of his throne.
translation:
  language: ru
  text: Облако и густой мрак вокруг Него[a]; праведность и правосудие — основание Его престола.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Облако и мгла окружают Его».'
    reason: 'Лексико-синтаксический вариант: עֲרָפֶל может означать «мгла», а безглагольное סְבִיבָיו допустимо естественно передать глаголом «окружают».'
lexical_decisions:
- source_word: עָנָן
  choice: облако
  rationale: В масоретском тексте существительное стоит в единственном числе; русский поэтический singular естественно передаёт образ облака, окружающего Бога.
- source_word: וַעֲרָפֶל
  choice: и густой мрак
  rationale: עֲרָפֶל обозначает плотную тьму, мглу или густую облачность, особенно в контексте богоявления. «Густой мрак» сохраняет весомость образа и тему сокрытости.
- source_word: סְבִיבָיו
  choice: вокруг Него
  rationale: Предложная форма буквально означает «вокруг Него». Безглагольная русская конструкция сохраняет лаконичность еврейской поэтической строки.
- source_word: צֶדֶק
  choice: праведность
  rationale: В паре с מִשְׁפָּט слово передано как «праведность», чтобы сохранить различие между нравственной правотой и осуществлением справедливого суда.
- source_word: וּמִשְׁפָּט
  choice: и правосудие
  rationale: Здесь מִשְׁפָּט обозначает справедливый суд и правовой порядок; «правосудие» естественно сочетается с образом престола и не сливается по значению с «праведностью».
- source_word: מְכוֹן
  choice: основание
  rationale: Существительное обозначает твёрдо установленное место, опору или основание. В сочетании с престолом «основание» точно и естественно передаёт метафору.
- source_word: כִּסְאוֹ
  choice: Его престола
  rationale: Родительная конструкция передаёт еврейское сочетание מְכוֹן כִּסְאוֹ — «основание Его престола».
theological_decisions:
- issue: Образ сокрытости Бога в богоявлении
  choice: Сохранить буквальный образ облака и густого мрака вокруг Бога.
  alternative: Передать образ отвлечённо как окружающие Бога величие или тайну.
  rationale: Строка соединяет Божье царское владычество с образом богоявления, напоминающим Синай. Конкретные образы сохраняют напряжение между откровением и сокрытостью Бога, не разрешая его поясняющим пересказом.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим строем. Безглагольное первое полустишие следует ритму еврейского текста; тире во втором обозначает именную связку. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
