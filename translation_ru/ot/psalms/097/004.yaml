lexical_decisions:
- source_word: הֵאִירוּ
  choice: озаряют
  rationale: 'Порода hифиль передаёт причинное значение: молнии дают свет, освещают. «Озаряют» естественно и поэтично выражает это действие.'
- source_word: בְרָקָיו
  choice: Его молнии
  rationale: Форма множественного числа с суффиксом 3-го лица единственного числа указывает на принадлежащие Богу молнии; русское множественное число звучит естественно.
- source_word: תֵּבֵל
  choice: мир
  rationale: Слово обозначает мир, особенно обитаемый мир, и здесь позволяет сохранить отличие от הָאָרֶץ — «земля».
- source_word: רָאֲתָה
  choice: видит
  rationale: Хотя в еврейском употреблена форма qatal, настоящее время сохраняет живую поэтическую картину и согласуется с контекстом теофании.
- source_word: וַתָּחֵל
  choice: и содрогается
  rationale: Глагол חול/חיל может выражать дрожь, корчи или колебание. «Содрогается» сохраняет интенсивность и не сводит образ исключительно к землетрясению или мукам.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В параллели с תֵּבֵל слово имеет вселенский, а не локальный смысл.
theological_decisions:
- issue: Вселенский масштаб богоявления
  choice: «мир» и «земля» переданы как различные, но дополняющие друг друга обозначения всего сотворённого порядка.
  alternative: Понимать הָאָרֶץ локально как «страну».
  rationale: Параллелизм и контекст богоявления во всём псалме указывают на всемирный масштаб, не требуя доктринального уточнения.
translation_notes:
  register: Современный литературный русский язык с поэтической торжественностью. Сохранена персонификация земли и различие между «миром» и «землёй».
