source:
  edition: WLC
  text: הִגִּ֣ידוּ הַ/שָּׁמַ֣יִם צִדְק֑/וֹ וְ/רָא֖וּ כָל הָ/עַמִּ֣ים כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/097/006.yaml
  text: The heavens declare his righteousness[a], and all the peoples see his glory.
translation:
  language: ru
  text: Небеса возвещают Его праведность[a], и все народы видят Его славу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его справедливость». Еврейское слово может означать и праведность, и справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגִּידוּ
  choice: возвещают
  rationale: Каузативная форма глагола נגד означает «делать известным, возвещать». Настоящее время естественно передаёт живую поэтическую картину и согласуется с параллельным «видят».
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: В поэтическом и богословском контексте שָׁמַיִם обозначает небеса; это слово сохраняет возвышенный образ творения как свидетеля Божьих деяний.
- source_word: צִדְקוֹ
  choice: Его праведность
  rationale: צֶדֶק охватывает нравственную правоту и справедливость. «Праведность» выбрана для основного текста, а возможный судебно-правовой оттенок отмечен в сноске.
- source_word: וְרָאוּ
  choice: и … видят
  rationale: Хотя форма грамматически перфективная, в поэтическом параллелизме настоящее время передаёт яркое и обобщённое созерцание Божьей славы.
- source_word: כָל הָעַמִּים
  choice: все народы
  rationale: Множественное עַמִּים указывает на совокупность народов. Русское «все народы» естественно выражает универсальный охват и не требует политического смысла наций-государств.
- source_word: כְּבוֹדוֹ
  choice: Его славу
  rationale: По отношению к Богу כָּבוֹד обычно означает явленное величие и славу; «слава» — точный и устойчивый русский эквивалент.
theological_decisions:
- issue: Передача Божьего свойства צִדְקוֹ
  choice: Его праведность
  alternative: Его справедливость
  rationale: Еврейское слово объединяет нравственную правоту и справедливый суд. Основной текст сохраняет традиционное и широкое «праведность», а сноска не устраняет возможный оттенок справедливости.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Заглавное написание местоимения «Его» использовано как уважительное обозначение Бога.
