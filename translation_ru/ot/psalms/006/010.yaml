lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: да постыдятся
  rationale: Форма несовершенного вида в поэтическом контексте передаёт пожелание или моление. «Постыдятся» сохраняет значение стыда и посрамления, не уточняя, вызвано ли оно внутренним переживанием или внешним поражением.
- source_word: וְיִבָּהֲלוּ מְאֹד
  choice: и придут в великий ужас
  rationale: Глагол בהל обозначает сильный, нередко внезапный испуг или смятение; מְאֹד усиливает его. Выражение «придут в великий ужас» естественно и точно передаёт сочетание обоих слов.
- source_word: כָּל אֹיְבָי
  choice: все мои враги
  rationale: Прямой и естественный перевод сочетания существительного с местоименным суффиксом.
- source_word: יָשֻׁבוּ
  choice: да отступят они
  rationale: שׁוב означает «повернуть назад, возвратиться». В контексте противостояния «отступят» передаёт обращение врагов вспять, не вводя излишне конкретной военной картины.
- source_word: יֵבֹשׁוּ
  choice: и постыдятся
  rationale: Повтор корня בוש сохранён ради поэтического акцента исходного текста.
- source_word: רָגַע
  choice: внезапно
  rationale: Здесь слово употреблено наречно и указывает на резкость, внезапность происходящего; такой перевод сохраняет смысл, не навязывая точной меры времени.
