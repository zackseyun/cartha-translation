base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], and do not discipline me in your wrath.
translation:
  language: ru
  text: Яхве[a], не обличай меня в гневе Твоём и не наказывай меня в ярости Твоей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (Яхве) — личное имя Бога; здесь употреблено в прямом обращении.
    reason: alternative_reading
  - marker: b
    text: 'Или: «не вразумляй меня»; еврейский глагол может обозначать исправляющее наказание или дисциплину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: В прямом обращении употреблена традиционная русская передача тетраграмматона словом «Господь» в звательном значении; подлинное имя указано в сноске.
- source_word: אַל ... וְאַל
  choice: не ... и не
  rationale: Две отрицательные частицы при глагольных формах выражают параллельные мольбы-запреты; конструкция «не... и не...» естественна по-русски и сохраняет структуру стиха.
- source_word: בְּאַפְּךָ
  choice: в гневе Твоём
  rationale: Существительное אַף буквально связано с «носом», но идиоматически означает гнев; предлог בְּ передан естественным русским оборотом «в гневе».
- source_word: תוֹכִיחֵנִי
  choice: обличай меня
  rationale: Hiphil от יכח означает обличать, укорять или исправлять; «обличай» сохраняет серьёзный поэтический тон и не сводит действие к одному лишь наказанию.
- source_word: בַּחֲמָתְךָ
  choice: в ярости Твоей
  rationale: חֵמָה обозначает пылкий, жгучий гнев. «Ярость» отличает этот термин от אַף и сохраняет усиление во второй строке.
- source_word: תְיַסְּרֵנִי
  choice: наказывай меня
  rationale: Piel от יסר охватывает наказание, вразумление и исправительную дисциплину. В контексте Божьего гнева «наказывай» звучит естественно и весомо, хотя оттенок исправления остаётся возможным и отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господи
  alternative: Яхве
  rationale: Основной текст сохраняет естественное и укоренённое в русской библейской речи молитвенное обращение «Господи», не смешивая имя с обычным повествовательным титулом; сноска прямо сообщает еврейскую форму и возможную передачу «Яхве».
- issue: Различение двух обозначений Божьего негодования
  choice: гнев / ярость
  alternative: гнев / гнев; ярость / гнев
  rationale: Разные русские слова отражают два разных еврейских существительных, сохраняют поэтический параллелизм и передают более пламенный оттенок חֵמָה без устранения смысловой близости.
- issue: Характер действия יסר
  choice: наказывать
  alternative: вразумлять; исправлять
  rationale: Контекст гнева допускает наказание, но еврейский глагол может подразумевать исправительную дисциплину. Основной перевод не уточняет цель сверх контекста, а сноска сохраняет более мягкую возможность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Сохранены двучленный параллелизм, прямое обращение и различие между «гневом» и более сильной «яростью». Местоимения, относящиеся к Богу, написаны с прописной буквы как уместная норма русского религиозного регистра.
