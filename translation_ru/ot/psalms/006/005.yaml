id: PSA.6.5
reference: Psalms 6:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֤י אֵ֣ין בַּ/מָּ֣וֶת זִכְרֶ֑/ךָ בִּ֝/שְׁא֗וֹל מִ֣י יֽוֹדֶה לָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/005.yaml
  text: For in death there is no remembrance of you[a]; in Sheol who will give thanks to you?
translation:
  language: ru
  text: Ибо в смерти нет памяти о тебе; в шеоле[a] кто возблагодарит тебя?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могиле»; или: «в мире мёртвых».'
    reason: Лексические варианты передачи древнееврейского שְׁאוֹל.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующей мольбы; «ибо» естественно передаёт пояснительно-причинную связь и соответствует поэтическому регистру.
- source_word: אֵין
  choice: нет
  rationale: Экзистенциальное отрицание идиоматично и кратко передаётся русским «нет».
- source_word: בַּמָּוֶת
  choice: в смерти
  rationale: Буквально сохраняет пространственно-состоя́тельный образ и параллелизм с «в шеоле», не сужая смысл до момента смерти или сообщества умерших.
- source_word: זִכְרֶךָ
  choice: памяти о тебе
  rationale: Передаёт значение памяти или памятного упоминания, сохраняя смысловую связь со следующим полустишием о благодарении и не выбирая более узкое «упоминания».
- source_word: בִּשְׁאוֹל
  choice: в шеоле
  rationale: Транслитерация сохраняет особое древнееврейское понятие и не отождествляет его безоговорочно ни с отдельной могилой, ни с позднейшими представлениями о загробном мире.
- source_word: מִי
  choice: кто
  rationale: Прямо передаёт вопросительное местоимение в риторическом вопросе.
- source_word: יוֹדֶה לָּךְ
  choice: возблагодарит тебя
  rationale: Глагол ידה в данной форме означает благодарить или славить. «Возблагодарит» кратко передаёт обращённое к Богу благодарение и сохраняет возвышенный, но понятный поэтический тон.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация не навязывает более узкое толкование и сохраняет историко-культурную и богословскую неоднозначность древнееврейского термина; понятные смысловые варианты даны в сноске.
- issue: Смысл утверждения об отсутствии памяти в смерти
  choice: Сохранено как риторическое высказывание плача без догматического уточнения
  alternative: Разъяснить его как утверждение только о невозможности публичного богослужебного прославления после смерти
  rationale: Текст говорит поэтически и напряжённо; перевод не должен превращать его в систематическое утверждение о состоянии умерших или, напротив, заранее ограничивать сферой общественного поклонения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим оттенком. Структура двух параллельных полустиший и риторический вопрос сохранены. Местоимение «тебе» дано со строчной буквы как нейтральная современная издательская норма; это не выражает богословской позиции.
