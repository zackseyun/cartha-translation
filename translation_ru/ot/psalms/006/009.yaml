  text: שָׁמַ֣ע יְ֭הוָה תְּחִנָּתִ֑/י יְ֝הוָ֗ה תְּֽפִלָּתִ֥/י יִקָּֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/009.yaml
  text: Yahweh has heard my plea[a]; Yahweh will receive my prayer.
translation:
  language: ru
  text: 'Яхве услышал мою мольбу;

    Яхве примет[a] мою молитву.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возьмёт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: שָׁמַע
  choice: услышал
  rationale: Форма qatal обозначает завершённое действие; в данном контексте псалмопевец уверенно заявляет, что его мольба уже услышана.
- source_word: תְּחִנָּה
  choice: мольба
  rationale: Слово обозначает настойчивую просьбу о милости; «мольба» естественно передаёт её эмоциональную напряжённость и отличается от следующего слова «молитва».
- source_word: תְּפִלָּה
  choice: молитва
  rationale: Обычное обозначение молитвы; отдельный перевод сохраняет различие между параллельными существительными תְּחִנָּה и תְּפִלָּה.
- source_word: לָקַח
  choice: примет
  rationale: Буквальное значение — «возьмёт», но применительно к молитве глагол естественно выражает её принятие. Будущее время передаёт уверенность, выраженную формой yiqtol, не уточняя сверх текста, каким именно образом Бог ответит.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл принятия молитвы
  choice: примет мою молитву
  alternative: возьмёт мою молитву
  rationale: «Примет» передаёт контекстуальный смысл לָקַח, не добавляя утверждения о конкретной форме ответа на молитву.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Параллелизм двух строк и различие между «мольбой» и «молитвой» сохранены. Место сноски перенесено к слову «примет», поскольку именно к глаголу לָקַח относится лексическая оговорка.
