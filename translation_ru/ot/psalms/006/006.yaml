- source_word: מִטָּתִי
  choice: постель мою
  rationale: Обычное обозначение постели; такой выбор также позволяет сохранить лексическое варьирование параллельных строк.
- source_word: בְּדִמְעָתִי
  choice: слезами
  rationale: 'Предлог ב обозначает средство: слёзы представлены как то, чем псалмопевец пропитывает своё ложе.'
- source_word: עַרְשִׂי
