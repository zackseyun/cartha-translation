- source_word: אַשְׂחֶה
  choice: заливаю слезами
  rationale: Каузативная форма буквально рисует постель «плывущей»; русский глагол «заливаю» сохраняет поэтическую гиперболу без неестественного буквализма.
- source_word: בְכָל לַיְלָה
  choice: каждую ночь
