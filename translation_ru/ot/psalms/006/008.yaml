source:
  edition: WLC
  text: ס֣וּרוּ מִ֭מֶּ/נִּי כָּל פֹּ֣עֲלֵי אָ֑וֶן כִּֽי שָׁמַ֥ע יְ֝הוָ֗ה ק֣וֹל בִּכְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/008.yaml
  text: Depart from me[a], all you workers of wickedness[b], for Yahweh has heard the sound of my weeping.
translation:
  language: ru
  text: Отойдите от меня, все творящие зло[a], ибо Яхве услышал звук моего плача[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все делающие беззаконие»; короче: «все злодеи».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «голос моего плача».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סוּרוּ מִמֶּנִּי
  choice: Отойдите от меня
  rationale: Повелительная форма множественного числа требует решительного удаления; «отойдите от меня» естественно передаёт как глагол סור, так и личное отделение, выраженное מִמֶּנִּי.
- source_word: כָּל פֹּעֲלֵי אָוֶן
  choice: все творящие зло
  rationale: Сочетание буквально обозначает тех, кто делает или производит אָוֶן. «Творящие зло» сохраняет деятельный образ исходного выражения и звучит понятно и достойно в поэтической речи.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание предшествующего повеления; «ибо» ясно выражает причинную связь и соответствует возвышенному, но понятному регистру псалма.
- source_word: שָׁמַע
  choice: услышал
  rationale: Перфект обозначает свершившееся действие, на котором основана нынешняя уверенность псалмопевца. Русская форма прошедшего времени естественно передаёт эту завершённость.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом, поскольку в еврейском тексте прямо стоит тетраграмматон.
- source_word: קוֹל בִּכְיִי
  choice: звук моего плача
  rationale: קוֹל может означать «голос» или «звук»; в сочетании с плачем «звук» естественно передаёт слышимое рыдание, не предполагая членораздельной речи. בִּכְיִי обозначает именно «мой плач».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога. «Яхве» сохраняет его как имя и не подменяет титулом; форма «Иегова» основана на более позднем смешанном прочтении.
- issue: Характер ответа Бога на плач
  choice: услышал звук моего плача
  alternative: внял моей мольбе
  rationale: Исходный текст утверждает, что Яхве услышал плач, но в этой строке не говорит прямо ни о словесной мольбе, ни о её исполнении; буквальный образ сохраняет эту смысловую сдержанность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. «Ибо» и «творящие» поддерживают поэтическое достоинство, оставаясь понятными; синтаксис краток и энергичен.
