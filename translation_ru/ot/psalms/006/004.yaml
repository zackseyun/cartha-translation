source:
  edition: WLC
  text: שׁוּבָ֣/ה יְ֭הוָה חַלְּצָ֣/ה נַפְשִׁ֑/י ה֝וֹשִׁיעֵ֗/נִי לְמַ֣עַן חַסְדֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/004.yaml
  text: Return, O LORD; rescue my life; save me for the sake of your steadfast love.
translation:
  language: ru
  text: Вернись, Господи, избавь мою жизнь; спаси меня ради Твоей верной любви.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שׁוּבָה
  choice: Вернись
  rationale: Императив от שׁוב передан прямо и естественно; просьба подразумевает возвращение Господа к псалмопевцу с благосклонностью, но этот оттенок не внесён в основной текст явно.
- source_word: יְהוָה
  choice: Господи
  rationale: Тетраграмматон передан традиционным русским обращением «Господи», соответствующим форме звательного обращения в данном контексте.
- source_word: חַלְּצָה
  choice: избавь
  rationale: Глагол выражает вырывание или освобождение из опасности; «избавь» сохраняет образ спасения без излишней конкретизации.
- source_word: נַפְשִׁי
  choice: мою жизнь
  rationale: Здесь נֶפֶשׁ обозначает самого живого человека, его жизнь, находящуюся под угрозой; «жизнь» естественнее контекстуального «душу» и не создаёт ненужного противопоставления души и тела.
- source_word: הוֹשִׁיעֵנִי
  choice: спаси меня
  rationale: Прямой эквивалент формы повелительного наклонения с объектным суффиксом первого лица.
- source_word: לְמַעַן חַסְדֶּךָ
  choice: ради Твоей верной любви
  rationale: חֶסֶד включает устойчивую, верную и милостивую любовь; сочетание «верная любовь» передаёт её постоянство, не сводя значение только к милости или заветной терминологии.
theological_decisions:
- issue: Основание просьбы о спасении
  choice: «ради Твоей верной любви» сохраняет обращение к Божьему חֶסֶד как основанию спасения.
  alternative: «по милости Твоей»
  rationale: Выбранный вариант яснее сохраняет оттенок постоянной и верной любви, при этом не добавляет конфессионально обусловленного истолкования.
- issue: Значение נֶפֶשׁ
  choice: Передано как «моя жизнь».
  alternative: «моя душа»
  rationale: Контекст телесной опасности и просьбы об избавлении указывает на жизнь и самого человека; перевод «душа» мог бы неоправданно сузить смысл до нематериальной части человека.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью. Синтаксический параллелизм еврейского текста сохранён; местоимение «Твоей» написано с прописной буквы согласно распространённой русской религиозной издательской норме.
