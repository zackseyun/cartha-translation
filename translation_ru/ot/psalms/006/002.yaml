id: PSA.6.2
reference: Psalms 6:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: חָנֵּ֥/נִי יְהוָה֮ כִּ֤י אֻמְלַ֫ל אָ֥נִי רְפָאֵ֥/נִי יְהוָ֑ה כִּ֖י נִבְהֲל֣וּ עֲצָמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/002.yaml
  text: Be gracious to me[a], O Yahweh, for I am weak; heal me, O Yahweh[b], for my bones are trembling.
translation:
  language: ru
  text: Будь милостив ко мне, Яхве, ведь я изнемог[a]; исцели меня, Яхве, ведь кости мои содрогаются[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я ослабел», «я увядаю»; еврейское слово описывает изнеможение, истощение или упадок сил.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кости мои потрясены», «кости мои в смятении»; речь может идти как о телесном содрогании, так и о глубоком внутреннем потрясении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Будь милостив ко мне
  rationale: Императив от חנן выражает просьбу о благосклонности и милости. Такой перевод близок к еврейскому и естественно звучит в современной литературной русской речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для каждой просьбы; «ведь» ясно передаёт причинную связь и сохраняет поэтическую естественность.
- source_word: אֻמְלַל
  choice: я изнемог
  rationale: Форма описывает состояние истощения, слабости или увядания. «Я изнемог» передаёт не просто отсутствие силы, а тяжёлое, продолжающееся ослабление.
- source_word: רְפָאֵנִי
  choice: исцели меня
  rationale: Глагол רפא прямо означает исцеление; контекст допускает как телесное, так и целостное восстановление, не требуя уточнять одно из них.
- source_word: נִבְהֲלוּ
  choice: содрогаются
  rationale: Глагол בהל обозначает сильную потрясённость, смятение или ужас. При подлежащем «кости» слово «содрогаются» естественно передаёт телесную остроту образа, тогда как сноска сохраняет более широкий смысловой диапазон.
- source_word: עֲצָמָי
  choice: кости мои
  rationale: Сохранён буквальный образ, который может обозначать глубокое телесное и внутреннее страдание всего человека.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте дважды стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя, не подменяя его титулом.
- issue: Характер страдания в выражении «кости мои»
  choice: Сохранить телесный образ без сведения его только к болезни или только к душевному смятению
  alternative: Передать как «всё моё существо» или явно обозначить физическую дрожь
  rationale: Еврейское выражение допускает глубокое телесное и внутреннее страдание; буквальный образ сохраняет эту напряжённость и многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской молитвы. Повтор обращения «Яхве» и параллельное построение двух просьб сохранены; лексика понятна широкому читателю без разговорного упрощения.
