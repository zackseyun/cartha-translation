lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов это слово обычно обозначает того, кто руководит музыкальным исполнением. Такой перевод ясен современному читателю и сохраняет литургически-музыкальный контекст.
- source_word: בִּנְגִינוֹת
  choice: В сопровождении струнных инструментов
  rationale: Существительное связано со струнной музыкой или струнными инструментами. Формулировка естественна по-русски и не уточняет без достаточных оснований способ исполнения.
- source_word: עַל
  choice: согласно
  rationale: В музыкальных заголовках предлог может вводить указание на мелодию, строй, регистр или иной способ исполнения. «Согласно» сохраняет эту неопределённость.
- source_word: הַשְּׁמִינִית
  choice: Шеминит
  rationale: Точное значение древнего музыкального термина неизвестно; транслитерация не создаёт ложной определённости и сопровождается пояснением.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшийся и точный русский эквивалент названия музыкально-поэтического произведения.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русская конструкция «Псалом Давида» допускает как авторство, так и более широкую связь с Давидом и потому не конкретизирует многозначность еврейского предлога ל.
theological_decisions:
- issue: Авторство или иная связь, выраженная לְדָוִד
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида
  rationale: Еврейский заголовок может указывать на авторство, принадлежность, посвящение или связь со сборником. Выбранная традиционная русская формулировка сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем заголовка. Неясные древние музыкальные указания не конкретизируются сверх данных еврейского текста.
