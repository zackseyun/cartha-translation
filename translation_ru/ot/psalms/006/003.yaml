  text: וְ֭/נַפְשִׁ/י נִבְהֲלָ֣ה מְאֹ֑ד ו/את יְ֝הוָ֗ה עַד מָתָֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/006/003.yaml
  text: And my soul is greatly troubled—but you[a], O Yahweh[d][c][b], how long?
translation:
  language: ru
  text: И душа моя[a] в глубоком смятении[b]. Но Ты[c], Яхве[d], — доколе?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Душа моя» — также возможно: «жизнь моя» или «я сам».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово может также означать: «сильно потрясена», «охвачена ужасом».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и Ты»; «но Ты» передаёт резкий поворот в плаче.'
    reason: lexical_alternative
  - marker: d
    text: 'В еврейском тексте: YHWH; традиционно переводится «Господь». Другой вариант передачи имени: «Иегова».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: И душа моя
  rationale: נֶפֶשׁ может обозначать душу, жизнь или самого человека. «Душа моя» сохраняет поэтическое соответствие телесному страданию в предыдущем стихе и внутреннюю направленность жалобы; союз וְ передан как «и».
- source_word: נִבְהֲלָה מְאֹד
  choice: в глубоком смятении
  rationale: Глагол בהל выражает сильную тревогу, смятение, потрясение, а מְאֹד усиливает его. Русское выражение естественно передаёт интенсивность, не сужая смысл исключительно до ужаса.
- source_word: וְאַתָּה
  choice: Но Ты
  rationale: Формально союз וְ означает «и», однако здесь он вводит резкий поворот от описания бедствия к обращению к Богу; «но» естественно выражает этот контраст. Местоимение сохранено, поскольку оно подчёркнуто в еврейском тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: עַד מָתָי
  choice: доколе?
  rationale: Устойчивое и лаконичное русское выражение для формулы плача «до каких пор?», сохраняющее поэтическую напряжённость и незавершённость мысли.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя YHWH. Транслитерация «Яхве» сохраняет различие между именем и титулом; традиционная замена «Господь» отмечена как возможный вариант.
- issue: Незавершённость обращения וְאַתָּה יְהוָה עַד־מָתָי
  choice: Но Ты, Яхве, — доколе?
  alternative: Но Ты, Яхве, до каких пор будешь медлить?
  rationale: Еврейская фраза намеренно эллиптична и не называет ожидаемого действия Бога. Перевод сохраняет эту напряжённую недосказанность, не добавляя толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. «Доколе» сохраняет краткость и силу древнееврейской формулы плача, оставаясь понятным современному читателю. Тире передаёт эллипсис исходной фразы.
