  text: Иссох мой глаз от горя[a], состарился из-за всех моих врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Потускнел мой глаз от досады, износился из-за всех моих противников».'
    reason: Лексика עָשְׁשָׁה, כַּעַס и עָתְקָה допускает значения ослабления зрения, досады и изношенности; альтернативный перевод сохраняет эту неоднозначность.
lexical_decisions:
- source_word: עָשְׁשָׁה
  choice: иссох
  rationale: Глагол обозначает истощение, увядание или ослабление. «Иссох» естественно передаёт телесный образ в контексте плача, не сводя его только к ухудшению зрения.
- source_word: מִכַּעַס
  choice: от горя
  rationale: כַּעַס может означать горе, досаду, раздражение или негодование. В личном плаче «от горя» естественно выражает эмоциональную причину истощения, при сохранении альтернативы в сноске.
- source_word: עֵינִי
  choice: мой глаз
  rationale: В еврейском тексте стоит единственное число с суффиксом первого лица; оно сохранено как выразительный образ органа, измученного плачем и страданием.
- source_word: עָתְקָה
  choice: состарился
  rationale: Глагол передаёт представление о старении, изношенности или ослаблении. Буквально-образное «состарился» сохраняет метафору физического упадка.
- source_word: בְּכָל
  choice: из-за всех
  rationale: Предлог в данном контексте указывает на врагов как на причину или повод состояния; «из-за всех» ясно и естественно выражает причинную связь.
- source_word: צוֹרְרָי
  choice: моих врагов
  rationale: Причастная форма от צרר обозначает тех, кто враждует или теснит говорящего. «Враги» — естественное и достаточно сильное соответствие в контексте плача.
