  text: A Song of Ascents[b][a]. Of David.
translation:
  language: ru
  text: 'Песнь восхождений. Давида.[a]


    Господи, сердце моё не надменно,

    и глаза мои не смотрят свысока;

    я не берусь за великое

    и за то, что выше меня.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давидова», «Давиду»; еврейское надписание может указывать на авторство, связь с Давидом или посвящение ему.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «за великое и за чудесное, что выше меня». Речь идёт о том, что превосходит подобающую человеку меру, положение или возможности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Традиционно и достаточно буквально передаёт заглавие цикла; точное историческое значение «восхождений» остаётся открытым.
- source_word: לֹא גָבַהּ לִבִּי
  choice: сердце моё не надменно
  rationale: В контексте высота сердца обозначает гордость или высокомерие, а не физическое возвышение.
- source_word: וְלֹא רָמוּ עֵינַי
  choice: и глаза мои не смотрят свысока
  rationale: Естественная русская идиома сохраняет образ поднятых глаз и выражаемое им высокомерие.
- source_word: וְלֹא הִלַּכְתִּי בִּגְדֹלוֹת
  choice: я не берусь за великое
  rationale: Буквальное «не хожу в великом» означает, что говорящий не занимается великими делами и не притязает на них.
- source_word: וּבְנִפְלָאוֹת מִמֶּנִּי
  choice: и за то, что выше моих сил
  rationale: Передаёт дела или вопросы, превосходящие положение либо способность говорящего, не сводя значение только к интеллектуальной непостижимости.
theological_decisions:
- issue: Значение לְדָוִד в надписании
  choice: Давида
  alternative: Давидова; Давиду; о Давиде
  rationale: Краткая родительная конструкция естественна для русского библейского заглавия, а примечание сохраняет неоднозначность еврейского предлога в вопросе авторства, принадлежности или посвящения.
- issue: Характер «великого» и «непостижимого»
  choice: Не уточнять, идёт ли речь о делах, тайнах или притязаниях
  alternative: «великие дела» или «непостижимые тайны»
  rationale: Еврейский текст допускает более широкий смысл; конкретизация неоправданно снимала бы его смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с поэтической краткостью и параллелизмом. Обращение «Господи» передаёт יהוה по принятой русской библейской традиции; формулировки избегают архаизмов и конфессионально обусловленных толкований.
