  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לְ/דָ֫וִ֥ד יְהוָ֤ה לֹא גָבַ֣הּ לִ֭בִּ/י וְ/לֹא רָמ֣וּ עֵינַ֑/י וְ/לֹֽא הִלַּ֓כְתִּי בִּ/גְדֹל֖וֹת וּ/בְ/נִפְלָא֣וֹת מִמֶּֽ/נִּי׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/001.yaml
  text: 'A Song of Ascents[a]. Of David.

    Yahweh, my heart is not proud, and my eyes are not raised high[b]; I have not walked in things too great and too wondrous for me.'
translation:
  language: ru
  text: 'Песнь восхождений. Давида[a].


    Яхве, сердце моё не гордится,

    и глаза мои не подняты высоко;

    я не занимаюсь тем,

    что слишком велико и дивно для меня[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давидова», «для Давида» или «от Давида». Еврейское надписание может указывать на авторство, связь с Давидом или посвящение ему.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «что выше меня». Еврейское выражение обозначает то, что превосходит надлежащее место или возможности говорящего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Сохраняет буквальный образ «восхождений» и традиционное название этой группы псалмов, не сводя его к одному предполагаемому историческому употреблению.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русская родительная конструкция естественна в надписании и, подобно еврейскому לְ, допускает авторство, принадлежность или посвящение; неоднозначность пояснена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: גָבַהּ לִבִּי
  choice: не надменно моё сердце
  rationale: Передаёт идиоматический нравственный смысл образа «высокого сердца» и сохраняет поэтическую именную конструкцию.
- source_word: רָמוּ עֵינַי
  choice: не вознесены мои глаза
  rationale: Сохраняет телесный образ поднятых глаз как выражение высокомерия, не заменяя его прямым толкованием.
- source_word: הִלַּכְתִּי בִּגְדֹלוֹת
  choice: я не берусь за дела великие
  rationale: Еврейское «ходить в» здесь обозначает занятие или образ действий; «не берусь за дела» естественно передаёт этот смысл по-русски.
- source_word: וּבְנִפְלָאוֹת
  choice: и непостижимые
  rationale: Корень פלא обозначает необычайное, дивное и превосходящее человеческие возможности; в контексте «непостижимые» ясно выражает этот оттенок.
- source_word: מִמֶּנִּי
  choice: для меня
  rationale: В сочетании с определениями указывает на то, что превосходит меру или возможности говорящего; альтернативный способ выразить это отмечен в сноске.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Значение надписания לְדָוִד
  choice: Давида
  alternative: Давидова; Давиду; от Давида
  rationale: Предлог לְ в псалмовых надписаниях допускает авторство, связь или посвящение. Основной текст не разрешает эту неоднозначность, а сноска называет возможные понимания.
- issue: Пределы человеческих притязаний в בִּגְדֹלוֹת וּבְנִפְלָאוֹת מִמֶּנִּי
  choice: дела великие и непостижимые для меня
  alternative: то, что слишком велико и дивно для меня
  rationale: Формулировка сохраняет напряжение между объективным величием этих дел и их недоступностью именно говорящему, не утверждая, что всякое великое или чудесное дело запретно само по себе.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим строем. Сохранён параллелизм «сердце — глаза», образ вознесённых глаз и традиционное «Песнь восхождений»; менее естественная русская калька «не ходил в великом» заменена смысловым «не берусь за дела».
