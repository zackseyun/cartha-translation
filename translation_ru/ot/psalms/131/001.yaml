  - severity: medium
    issue: «не надменно моё сердце»
    rationale: 'Фраза грамматически возможна в поэтическом регистре, но для современного литературного русского звучит неестественно и неоднозначно; естественнее прямо назвать состояние сердца: «сердце моё не гордится».'
