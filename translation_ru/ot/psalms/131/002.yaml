  text: אִם לֹ֤א שִׁוִּ֨יתִי וְ/דוֹמַ֗מְתִּי נַ֫פְשִׁ֥/י כְּ֭/גָמֻל עֲלֵ֣י אִמּ֑/וֹ כַּ/גָּמֻ֖ל עָלַ֣/י נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/002.yaml
  text: Surely I have calmed and quieted my soul[a], like a weaned child with his mother[c][b]; like a weaned child is my soul within me.
translation:
  language: ru
  text: Поистине, я привёл свою душу к равновесию и успокоил её[a]. Как отнятый от груди ребёнок у своей матери[b], так и душа моя во мне — как отнятый от груди ребёнок[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если я не уравнял и не утихомирил свою душу». Начальные слова в еврейском тексте имеют форму условного оборота, но здесь служат усиленным заверением.'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о ребёнке, который уже не требует материнского молока и спокойно остаётся рядом с матерью.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «как отнятый от груди ребёнок на мне — душа моя». Еврейский оборот труден; «во мне» передаёт его вероятный смысл по-русски.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: Поистине
  rationale: В данном контексте сочетание служит не обычным условием «если не», а идиоматическим усиленным заверением. «Поистине» передаёт эту эмфазу естественно и достойно.
- source_word: שִׁוִּיתִי
  choice: я усмирил
  rationale: Здесь глагол обозначает приведение внутреннего состояния к ровности и покою, а не буквальное «выравнивание». «Усмирил» сохраняет оттенок сознательного внутреннего действия.
- source_word: וְדוֹמַמְתִּי
  choice: и успокоил
  rationale: Глагол означает сделать тихим, безмолвным, неподвижным. «Успокоил» естественно сочетается с «усмирил» и сохраняет параллелизм.
- source_word: נַפְשִׁי
  choice: свою душу / моя душа
  rationale: נפש здесь обозначает внутреннее «я», жизнь и желания псалмопевца. «Душа» сохраняет библейскую образность, не утверждая технического разделения человека на тело и душу.
- source_word: כְּגָמֻל
  choice: как ребёнок, отнятый от груди
  rationale: Страдательное причастие обозначает ребёнка, которого уже отняли от груди. Развёрнутая русская формулировка ясна современному читателю и точно передаёт образ.
- source_word: עֲלֵי אִמּוֹ
  choice: у матери
  rationale: Предлог על буквально может означать положение «на» ком-либо, но здесь передаёт тесную близость ребёнка, спокойно находящегося у матери.
- source_word: כַּגָּמֻל עָלַי נַפְשִׁי
  choice: как ребёнок, отнятый от груди, — моя душа во мне
  rationale: Повтор усиливает сравнение. Буквальное «на мне» по-русски неясно; «во мне» естественно выражает состояние внутреннего «я», а трудность еврейского оборота сохранена в примечании.
theological_decisions:
- issue: Антропологический смысл נַפְשִׁי
  choice: «душа» как внутреннее «я» псалмопевца
  alternative: «я сам», «моё внутреннее существо»
  rationale: Контекст говорит об усмирённых желаниях и внутреннем покое. Традиционное слово «душа» уместно в псалме, но перевод не навязывает позднейшую философскую модель тела и души.
- issue: Характер образа отнятого от груди ребёнка
  choice: Образ спокойного ребёнка, который остаётся у матери, уже не требуя кормления
  alternative: Образ ребёнка, переживающего болезненное отлучение
  rationale: Соседние глаголы покоя и тишины поддерживают первый смысл, однако сам текст прямо не развивает психологию ребёнка; пояснение поэтому дано как описание образа, а не как отдельное богословское учение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Параллелизм и повтор образа сохранены; архаизмы вроде «дитя» и неестественный буквализм «на мне» вынесены за основной текст.
