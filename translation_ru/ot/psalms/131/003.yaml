source:
  edition: WLC
  text: יַחֵ֣ל יִ֭שְׂרָאֵל אֶל יְהוָ֑ה מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/131/003.yaml
  text: Israel[a], hope in Yahweh from now and forever.
translation:
  language: ru
  text: Израиль[a], надейся на Яхве отныне и вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть Израиль надеется на Яхве».'
    reason: Альтернативная передача еврейской побудительной формы как юссива третьего лица.
lexical_decisions:
- source_word: יַחֵל
  choice: надейся
  rationale: Форма от יחל имеет побудительное значение. Русское «надейся» естественно передаёт обращённый к Израилю призыв, сохраняя оттенки ожидания и упования.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Собственное имя народа передано в принятой русской форме.
- source_word: אֶל
  choice: на
  rationale: В сочетании с глаголом יחל предлог указывает на того, на кого возлагают надежду; по-русски это естественно выражается конструкцией «надеяться на».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: מֵעַתָּה
  choice: отныне
  rationale: Кратко и естественно передаёт начальную временную точку — «с этого времени».
- source_word: וְעַד עוֹלָם
  choice: и вовеки
  rationale: Передаёт неограниченную длительность; выражение уместно в современном литературном русском и сохраняет возвышенный поэтический регистр псалма.
theological_decisions:
- issue: Передача побудительной формы יַחֵל
  choice: 'Прямое обращение: «Израиль, надейся на Яхве»'
  alternative: 'Форма с частицей «пусть»: «Пусть Израиль надеется на Яхве»'
  rationale: Еврейскую форму можно понять как юссив третьего лица либо передать как обращённый к общине призыв. Прямое обращение естественно завершает псалом и сохраняет побудительную силу, а подлинная грамматическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с кратким, возвышенным звучанием, подходящим для заключительного призыва псалма. «Вовеки» сохраняет поэтическую торжественность, оставаясь понятным современному читателю.
