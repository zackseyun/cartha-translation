base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/011.yaml
  text: But my people did not listen to my voice[a], and Israel was not willing to obey me.
translation:
  language: ru
  text: 'Но Мой народ не слушал Моего голоса,

    и Израиль не захотел Мне повиноваться[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пожелал согласиться со Мной»; возможно также: «отказался от Меня». Еврейский глагол выражает нежелание или отказ дать согласие; буквально: «не захотел Мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Но … не
  rationale: Союз с отрицанием противопоставляет непослушание народа предшествующему Божьему призыву и обещанию; «но» естественно передаёт это противопоставление.
- source_word: שָׁמַע
  choice: слушал
  rationale: Глагол может означать «слышать», «слушать» или «повиноваться». В сочетании с «голосом» выбран прямой смысл «слушать», а оттенок повиновения передан во второй строке.
- source_word: עַמִּי
  choice: народ Мой
  rationale: Сохранено прямое значение формы с притяжательным суффиксом и её заветный, личный оттенок.
- source_word: לְקוֹלִי
  choice: Моего голоса
  rationale: Существительное קוֹל буквально означает «голос»; такое соответствие сохраняет личный характер Божьего обращения.
- source_word: וְיִשְׂרָאֵל
  choice: и Израиль
  rationale: Сохранены союз и параллелизм между обозначениями «народ Мой» и «Израиль».
- source_word: לֹא אָבָה
  choice: не захотел
  rationale: אָבָה выражает желание, готовность или согласие; перевод прямо сохраняет смысл сознательного нежелания.
- source_word: לִי
  choice: повиноваться Мне
  rationale: После אָבָה местоимение с предлогом образует сжатую еврейскую конструкцию. В контексте отказа слушать Божий голос «повиноваться Мне» естественно передаёт подразумеваемое отношение, а альтернативы отмечены в сноске.
theological_decisions:
- issue: Заветное отождествление Израиля с Божьим народом
  choice: Сохранить «народ Мой» и «Израиль» как два параллельных обозначения.
  alternative: 'Объединить их: «народ Мой, Израиль».'
  rationale: Две поэтические строки оригинала дают параллельные обозначения; их раздельная передача сохраняет структуру и заветный акцент.
- issue: Характер отказа Израиля во второй строке
  choice: Передать контекстуальный смысл как нежелание повиноваться, сохранив лексическую неоднозначность в сноске.
  alternative: Перевести более буквально как нежелание согласиться с Богом либо сильнее — как отвержение Бога.
  rationale: Оригинал говорит о нежелании или несогласии по отношению к Богу, не уточняя действие. Контекст слушания Божьего голоса поддерживает повиновение, но не исключает более широкого смысла личного отказа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «народ Мой» сохраняет достоинство и библейскую окраску, оставаясь понятной современному читателю; параллелизм двух строк воспроизведён.
