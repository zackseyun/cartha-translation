  text: כִּ֤י חֹ֣ק לְ/יִשְׂרָאֵ֣ל ה֑וּא מִ֝שְׁפָּ֗ט לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/004.yaml
  text: For it is a statute for Israel[a], an ordinance of the God of Jacob.
translation:
  language: ru
  text: Ведь это установление для Израиля, постановление Бога Иакова[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «постановление для Бога Иакова». Еврейский предлог допускает и такое понимание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предшествующего призыва; «ведь» естественно передаёт пояснительно-причинный оттенок в русском языке.
- source_word: חֹק
  choice: установление
  rationale: Слово обозначает предписанное и закреплённое властью правило; «установление» сохраняет юридико-заветный смысл и подходит к литургическому контексту.
- source_word: לְיִשְׂרָאֵל
  choice: для Израиля
  rationale: Предлог לְ указывает здесь на отнесённость и обязательность предписания для народа Израиля.
- source_word: הוּא
  choice: это
  rationale: Местоимение отсылает к предписанному в контексте празднованию; в русском предложении естественно передаётся указательным «это».
- source_word: מִשְׁפָּט
  choice: постановление
  rationale: В параллели с חֹק слово обозначает властное предписание, а не судебный приговор; выбранный вариант сохраняет различие двух близких юридических терминов.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: Бога Иакова
  rationale: 'В контексте предлог לְ, вероятнее всего, выражает принадлежность, источник или авторитет: постановление исходит от Бога Иакова. Возможное более буквальное понимание отмечено в сноске.'
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Использована традиционная русская форма библейского имени в родительном падеже.
theological_decisions:
- issue: Соотношение юридических терминов חֹק и מִשְׁפָּט
  choice: 'Передать различными словами: «установление» и «постановление»'
  alternative: Свести оба термина к одному общему понятию, например «закон»
  rationale: Еврейская поэтическая параллель использует два близких, но разных слова. Их различение сохраняет юридический и заветный характер стиха без навязывания чрезмерно узкой технической разницы.
- issue: Значение предлога לְ в לֵאלֹהֵי יַעֲקֹב
  choice: 'Передать как отношение источника или принадлежности: «Бога Иакова»'
  alternative: «для Бога Иакова»
  rationale: Основной вариант естественно передаёт мысль о постановлении, исходящем от Бога Иакова или принадлежащем его власти. Формально возможное целевое значение предлога сохранено в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической и заветно-юридической речи. Синтаксический параллелизм двух полустиший сохранён; редкие или конфессионально окрашенные формулировки не использованы.
