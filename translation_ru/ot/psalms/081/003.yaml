  text: תִּקְע֣וּ בַ/חֹ֣דֶשׁ שׁוֹפָ֑ר בַּ֝/כֵּ֗סֶה לְ/י֣וֹם חַגֵּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/003.yaml
  text: Blow the trumpet at the new moon[a], at the full moon, on the day of our feast.
translation:
  language: ru
  text: Трубите в рог при новолунии, при полнолунии[a], в день нашего праздника.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда луна скрыта»; или: «в назначенное время». Значение еврейского слова כֵּסֶה спорно; вариант «при полнолунии» принят как наиболее подходящий к календарному параллелизму с новолунием и к контексту праздника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Трубите
  rationale: Форма повелительного наклонения множественного числа от תקע; в сочетании с שׁוֹפָר означает «трубить, издавать звук рогом».
- source_word: בַחֹדֶשׁ
  choice: при новолунии
  rationale: В календарно-праздничном контексте חֹדֶשׁ обозначает новолуние, а не просто месяц.
- source_word: שׁוֹפָר
  choice: в рог
  rationale: שׁוֹפָר — рог, использовавшийся для культовых и сигнальных звуков. «Трубите в рог» естественно по-русски и не требует необязательной транслитерации «шофар».
- source_word: בַכֵּסֶה
  choice: при полнолунии
  rationale: Значение כֵּסֶה спорно; «при полнолунии» лучше всего передаёт вероятное календарное противопоставление новолунию и соответствует праздничному контексту. Неопределённость сохранена в примечании.
- source_word: לְיוֹם
  choice: в день
  rationale: Предлог לְ в данном контексте выражает временную соотнесённость с днём праздника; русский оборот «в день» звучит естественно.
- source_word: חַגֵּנוּ
  choice: нашего праздника
  rationale: חַג обозначает религиозный праздник, нередко паломнический; общее слово «праздник» ясно и не добавляет отсутствующей в строке конкретизации.
theological_decisions:
- issue: Значение בַכֵּסֶה в календарном указании
  choice: при полнолунии
  alternative: когда луна скрыта; в назначенное время
  rationale: Это прежде всего лексико-контекстуальная, а не доктринальная проблема. Полнолуние создаёт осмысленный календарный параллелизм с новолунием, однако редкость и спорность еврейского слова не позволяют устранить другие толкования, поэтому они приведены в примечании.
translation_notes:
  register: Современный литературный русский язык; строка сохраняет повелительную форму, краткость и параллельное построение еврейской поэзии. Маркер примечания поставлен непосредственно после спорного соответствия בַכֵּסֶה.
