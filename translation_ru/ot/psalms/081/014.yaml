  text: כִּ֭/מְעַט אוֹיְבֵי/הֶ֣ם אַכְנִ֑יעַ וְ/עַ֥ל צָ֝רֵי/הֶ֗ם אָשִׁ֥יב יָדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/014.yaml
  text: In a little while I would subdue their enemies[b][a], and turn my hand against their adversaries.
translation:
  language: ru
  text: Вскоре[a] Я покорил бы их врагов и обратил бы Свою руку против их противников[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Очень скоро». Древнееврейское כִּמְעַט может указывать на краткий промежуток времени или близость события; значение «почти» здесь менее вероятно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «обратил бы Мою руку на их противников» — образ направленной против них силы и суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט
  choice: Вскоре
  rationale: В данном контексте выражение указывает прежде всего на близость действия во времени. «Вскоре» естественно передаёт этот смысл, не истолковывая слово как степень («почти»).
- source_word: אוֹיְבֵיהֶם
  choice: их врагов
  rationale: Обычное и ясное соответствие для обозначения тех, кто враждует с Израилем.
- source_word: אַכְנִיעַ
  choice: Я покорил бы
  rationale: Порода хифиль глагола כנע означает заставить покориться, подчинить или унизить. «Покорил бы» точно передаёт победу над врагами, не уточняя способ действия.
- source_word: צָרֵיהֶם
  choice: их противников
  rationale: «Противников» сохраняет смысл враждебно выступающих против Израиля и позволяет не повторять непосредственно предыдущее слово «врагов».
- source_word: אָשִׁיב יָדִי
  choice: обратил бы Свою руку против
  rationale: Сохранён древнееврейский образ руки как проявления действенной силы; предлог «против» ясно указывает, что речь идёт о суде над противниками.
theological_decisions:
- issue: Модальность Божьего действия в контексте
  choice: «покорил бы» / «обратил бы»
  alternative: «покорю» / «обращу»
  rationale: 'Хотя древнееврейские имперфекты допускают будущее время, предыдущий стих задаёт условие: это то, что Бог совершил бы, если бы Израиль слушался Его. Условное наклонение сохраняет обусловленность и напряжение контекста.'
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа руки как проявления Божьей силы. Условное наклонение обусловлено ближайшим контекстом псалма; прописные формы местоимений по отношению к Богу поддерживают принятый в русском библейском стиле уважительный регистр.
