lexical_decisions:
- source_word: יִהְיֶה
  choice: Пусть не будет
  rationale: С отрицанием в контексте заветного обращения форма выражает запрет, а не предсказание; русская конструкция естественно передаёт повелительный смысл.
- source_word: בְךָ
  choice: среди тебя
  rationale: Израиль представлен как единое целое и назван в единственном числе. «Среди тебя» естественно обозначает недопустимость чужого культа внутри общины.
- source_word: אֵל זָר
  choice: чужого бога
  rationale: אֵל здесь означает божество, а זָר — бога, чуждого установленному для Израиля поклонению. Строчная буква уместна для иного божества.
- source_word: תִשְׁתַּחֲוֶה
  choice: не поклоняйся
  rationale: Отрицательная форма имеет запретительный смысл; «поклоняться» ясно передаёт жест почитания в культовом контексте.
- source_word: לְאֵל נֵכָר
  choice: богу иноземному
  rationale: «Иноземному» сохраняет близкую, но не тождественную лексику второй поэтической строки и не создаёт отдельной богословской категории.
theological_decisions:
- issue: Грамматически единственное число обозначает Израиль как целое
  choice: 'Сохранить обращение в единственном числе: «среди тебя», «не поклоняйся»'
  alternative: 'Передать обращение множественным числом: «среди вас», «не поклоняйтесь»'
  rationale: Еврейский текст обращается к Израилю как к единому народу. Единственное число сохраняет эту особенность и не сужает смысл до отдельного человека.
- issue: Соотношение זָר и נֵכָר
  choice: Передать близкими словами «чужой» и «иноземный»
  alternative: 'Оба слова передать одинаково: «чужой» или «иноземный»'
  rationale: Разные русские слова отражают лексическую вариативность еврейского параллелизма, не утверждая различия между двумя видами божеств.
