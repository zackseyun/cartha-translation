  text: אָנֹכִ֨י יְה֘וָ֤ה אֱלֹהֶ֗י/ךָ הַֽ֭/מַּעַלְ/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם הַרְחֶב פִּ֝֗י/ךָ וַ/אֲמַלְאֵֽ/הוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/010.yaml
  text: I am Yahweh your God[a], who brought you up from the land of Egypt. Open your mouth wide[b], and I will fill it.
translation:
  language: ru
  text: Я — Яхве, твой Бог, который вывел тебя из Египетской земли. Широко открой уста — и Я наполню их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Широко открой уста, чтобы Я наполнил их».'
    reason: Глагольная связь допускает как обещание последующего результата, так и выражение цели.
lexical_decisions:
- source_word: אָנֹכִי
  choice: Я —
  rationale: Самостоятельное местоимение имеет эмфатический оттенок; тире естественно передаёт подчёркнутое самоотождествление в русском именном предложении.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является общепринятой русской транслитерацией.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма с суффиксом 2-го лица мужского рода единственного числа прямо обозначает Бога адресата — Израиля.
- source_word: הַמַּעַלְךָ
  choice: который вывел тебя
  rationale: Причастие породы hифиль от עלה описывает совершённое Богом избавление из Египта. Русское «вывел» естественно в контексте исхода и передаёт каузативное движение наружу без неуместного пространственного оттенка выражения «поднял».
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из Египетской земли
  rationale: Предлог מִן передан как «из», а сочетание сохраняет упоминание земли Египта в естественной русской форме.
- source_word: הַרְחֶב פִּיךָ
  choice: Широко открой уста
  rationale: Императив hифиля от רחב с существительным «уста» означает «открой широко». «Уста» сохраняет телесный образ и соответствует dignified поэтическому регистру псалма.
- source_word: וַאֲמַלְאֵהוּ
  choice: и Я наполню их
  rationale: Глагол 1-го лица с местоименным суффиксом относится к слову «уста»; русское множественное местоимение согласуется с грамматическим числом «уст». Союз допускает понимание обещанного результата.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Его транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Связь повеления с наполнением уст
  choice: «и Я наполню их» — обещанный результат
  alternative: «чтобы Я наполнил их» — цель повеления
  rationale: Форма с וַ допускает оттенки последовательности, результата или цели. Основной текст естественно звучит как обещание, а возможное целевое прочтение сохранено в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим оттенком. Синтаксис прост и понятен; слово «уста» выбрано ради образности и достоинства псалма, без архаизации остальной строки.
