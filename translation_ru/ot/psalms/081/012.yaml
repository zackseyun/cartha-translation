lexical_decisions:
- source_word: וָאֲשַׁלְּחֵהוּ
  choice: И Я предал его
  rationale: Форма породы hифиль от שׁלח с суффиксом 3-го лица мужского рода единственного числа буквально указывает на «его». В данном контексте глагол означает не просто «послать», а оставить Израиль во власти избранного им упорства; «предал» передаёт этот судебный оттенок.
- source_word: בִּשְׁרִירוּת
  choice: упорству
  rationale: Слово обозначает упрямство, строптивость, своеволие внутреннего человека. «Упорство» естественно звучит по-русски и сохраняет нравственно отрицательный смысл.
- source_word: לִבָּם
  choice: их сердца
  rationale: В еврейском стоит существительное «сердце» в единственном числе с суффиксом множественного числа. Русское «их сердца» сохраняет собирательное представление об общем внутреннем настрое народа.
- source_word: יֵלְכוּ
  choice: они ходили
  rationale: הלך буквально означает «идти, ходить» и нередко описывает образ поведения. «Ходили» сохраняет библейскую метафору, не превращая её в более узкое толкование.
- source_word: בְּמוֹעֲצוֹתֵיהֶם
  choice: по собственным замыслам
  rationale: מוֹעֵצָה может означать совет, намерение, замысел или план. Предлог ב здесь передаёт следование чему-либо; «по собственным замыслам» естественно выражает противопоставление Божьей воле, заключённое в контексте.
theological_decisions:
- issue: Переход от единственного числа в «предал его» к множественному в «их… они»
  choice: Сохранить переход числа, имеющийся в масоретском тексте
  alternative: 'Согласовать всё во множественном числе: «предал их… они»'
  rationale: Суффикс при первом глаголе имеет форму единственного числа и представляет Израиль как единый народ, тогда как последующие формы множественного числа говорят о его членах. Сглаживание устранило бы подлинную особенность исходного текста.
- issue: Характер Божьего действия
  choice: Передать как «предал»
  alternative: «отпустил» или «оставил»
  rationale: 'Контекст говорит о Божьем суде над непослушным народом: Бог оставляет его во власти собственного упорства. «Предал» передаёт эту силу, не добавляя к тексту более поздней богословской системы.'
- issue: Временное и смысловое значение יֵלְכוּ
  choice: «они ходили» как последующее поведение народа
  alternative: «пусть ходят» или «чтобы они ходили»
  rationale: Имперфект допускает оттенок продолженного либо следственного действия. В контексте естественно понимать его как описание того, что последовало после Божьего решения, однако возможный оттенок предоставления народа собственному пути отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Метафора «ходили» сохранена как понятное описание образа жизни; необычная смена числа оставлена ради точности и разъяснена в сноске.
