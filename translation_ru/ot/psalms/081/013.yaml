lexical_decisions:
- source_word: לוּ
  choice: О, если бы
  rationale: Передаёт эмоциональную силу желания и скорби; в данном контексте это не простое условие.
- source_word: עַמִּי
  choice: народ Мой
  rationale: Точно сохраняет притяжательное значение и подразумеваемые отношения Бога со Своим народом.
- source_word: שֹׁמֵעַ לִי
  choice: слушал Меня
  rationale: Конструкция с ל выражает не только слышание, но и внимательное послушание; русский глагол «слушать» естественно сохраняет оба оттенка.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятая русская передача имени.
- source_word: בִּדְרָכַי
  choice: Моими путями
  rationale: Сохраняет метафору путей как образа образа жизни и поведения; творительный падеж естественен с глаголом «ходить».
- source_word: יְהַלֵּכוּ
  choice: ходил
  rationale: Сохраняет метафору постоянного образа жизни и согласуется с оптативной конструкцией «если бы».
theological_decisions:
- issue: Желание или условие
  choice: 'Стих передан как исполненное скорби желание Бога: «О, если бы…»'
  alternative: «Если бы народ Мой слушал Меня, если бы Израиль ходил Моими путями…»
  rationale: לוּ допускает условный оттенок, однако здесь прежде всего выражает желание и скорбь о непослушании Израиля. Формулировка не превращает стих в однозначно условную сделку.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Заглавные буквы в местоимениях «Мой», «Меня», «Моими» обозначают обращение Бога о Себе и соответствуют распространённой русской издательской практике; синтаксис остаётся ясным для современного читателя.
