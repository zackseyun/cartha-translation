  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בַּ/צָּרָ֥ה קָרָ֗אתָ וָ/אֲחַ֫לְּצֶ֥/ךָּ אֶ֭עֶנְ/ךָ בְּ/סֵ֣תֶר רַ֑עַם אֶבְחָֽנְ/ךָ֨ עַל מֵ֖י מְרִיבָ֣ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/007.yaml
  text: In distress you called[a], and I rescued you; I answered you in the hiding place of thunder; I tested you at the waters of Meribah[b]. Selah
translation:
  language: ru
  text: В беде ты воззвал, и Я избавил тебя; Я ответил тебе в сокровенном месте грома[a]; Я испытал тебя у вод Меривы[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «из сокровенного места грома». Еврейский образ, вероятно, указывает на сокрытое присутствие Бога в грозе.'
    reason: lexical_alternative
  - marker: b
    text: Мерива напоминает о событиях в пустыне, когда народ спорил из-за воды и Бог испытывал Израиль (Исх. 17:1–7; Чис. 20:1–13).
    reason: cross_reference
lexical_decisions:
- source_word: בַּצָּרָה
  choice: В беде
  rationale: צָרָה обозначает беду, тесноту или тяжёлое положение. «В беде» кратко, естественно и не уточняет характер несчастья сверх еврейского текста.
- source_word: קָרָאתָ
  choice: ты воззвал
  rationale: В данном контексте קרא означает обращение за помощью. «Воззвал» сохраняет возвышенный поэтический регистр и подразумеваемую направленность призыва, не добавляя прямого дополнения.
- source_word: וָאֲחַלְּצֶךָּ
  choice: и Я избавил тебя
  rationale: Глагол חלץ в породе хифиль означает извлечь из опасности, избавить или спасти. «Избавил» естественно передаёт действие Бога в контексте исхода и странствования.
- source_word: אֶעֶנְךָ
  choice: Я ответил тебе
  rationale: Прямое соответствие обычному значению ענה — «отвечать».
- source_word: בְּסֵתֶר רַעַם
  choice: в сокровенном месте грома
  rationale: סֵתֶר может означать укрытие, тайное или сокровенное место. Формулировка сохраняет необычный образ скрытого Божьего присутствия в грозе и прямо передаёт предлог בְּ как «в».
- source_word: אֶבְחָנְךָ
  choice: Я испытал тебя
  rationale: בחן означает испытывать или проверять. «Испытал» сохраняет возможность как проверки, так и выявления внутреннего качества, не сводя действие исключительно к наказанию.
- source_word: עַל מֵי מְרִיבָה
  choice: у вод Меривы
  rationale: В данном локативном употреблении עַל естественно передаётся как «у». Топоним מְרִיבָה передан принятой русской транслитерацией «Мерива».
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение литургического обозначения неясно, поэтому оно транслитерировано, а не истолковано предположительно.
theological_decisions:
- issue: Смысл образа сокровенного места грома
  choice: Сохранён образ ответа Бога «в сокровенном месте грома» без отождествления с одним конкретным событием.
  alternative: «Из сокровенного места грома», с более явным представлением о том, что Божий ответ исходит из скрытого места; либо прямое истолкование как указания на Синай.
  rationale: Предлог בְּ допускает контекстуальные оттенки «в» и «из», а сам образ может напоминать Синай, грозовую теофанию или сокрытое Божье присутствие. Перевод не устраняет эту напряжённость.
- issue: Характер испытания у вод Меривы
  choice: «Я испытал тебя» оставляет открытым, было ли это проверкой, выявлением состояния народа или дисциплинарным действием.
  alternative: Истолковать испытание исключительно как наказание за ропот.
  rationale: בחן обозначает проверку или испытание, но сам стих не требует исключительно карательного понимания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимение «Я» написано с прописной буквы как начало прямой Божьей речи в данном стихе. Необычная метафора грома сохранена, а не заменена поясняющим пересказом.
