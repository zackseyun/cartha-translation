base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/005.yaml
  text: 'He made it a testimony in Joseph when he went out over the land of Egypt[c][b][a]. I heard a language I had not known:'
translation:
  language: ru
  text: 'Он установил это как свидетельство среди потомков Иосифа[a], когда вышел против земли Египта[b]. Я услышал язык, которого я не знал[c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «в Иосифе». Имя «Иосиф», вероятно, обозначает народ Израиля или, возможно, прежде всего северные колена; коллективный оборот в переводе поясняет это употребление имени.'
    reason: cross_reference
  - marker: b
    text: 'Или: «когда прошёл по земле Египта» либо «над землёй Египта». Еврейский предлог допускает как пространственный смысл, так и значение действия против Египта.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Я слышу язык, которого не знаю». Еврейская глагольная форма в поэтическом контексте может пониматься как настоящее или прошедшее время.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֵדוּת
  choice: свидетельство
  rationale: Сохраняет основное значение существительного — «свидетельство, свидетельствующее установление» — и не сужает его до «указа» или «постановления».
- source_word: בִּיהוֹסֵף
  choice: у Иосифа
  rationale: Предлог בְּ передан естественным по-русски оборотом, допускающим значение «среди народа Иосифа / у потомков Иосифа»; имя Иосиф не заменено толкованием «Израиль».
- source_word: שָׂמוֹ
  choice: Он установил это
  rationale: Глагол שׂים означает «положить, поставить, установить». «Установил» естественно сочетается со «свидетельством», а местоимение «это» передаёт суффикс без искусственного согласования с русским существительным.
- source_word: בְּצֵאתוֹ
  choice: когда выступил
  rationale: Временная конструкция передана придаточным предложением. «Выступил» подходит для движения или действия Бога по отношению к Египту, не добавляя явно отсутствующее подлежащее.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: против земли Египетской
  rationale: В контексте исхода עַל естественно допускает направленность враждебного действия против Египта; пространственное «над / по земле» сохранено как альтернатива в примечании.
- source_word: שְׂפַת
  choice: речь
  rationale: Буквально «губа», идиоматически — язык или речь. «Речь» сохраняет возможность понимать здесь не только отдельный язык, но и услышанные слова.
- source_word: לֹא יָדַעְתִּי
  choice: которой прежде не знал
  rationale: Передаёт предшествующую неизвестность естественным русским оборотом, не превращая её в утверждение о полном незнании языка как системы.
- source_word: אֶשְׁמָע
  choice: я услышал
  rationale: Имперфект в поэтическом повествовании может иметь прошедшее значение; прошедшее время связно вводит последующую речь, при этом настоящее отмечено в примечании.
theological_decisions:
- issue: Кого обозначает имя «Иосиф»
  choice: Имя «Иосиф» сохранено; в контексте оно, вероятно, представляет народ завета.
  alternative: 'Понимать Иосифа уже: как северные колена, особенно Ефрема; либо прямо перевести «Израиль».'
  rationale: Еврейский текст называет Иосифа. Замена имени словом «Израиль» устранила бы возможную более узкую отсылку и внесла бы толкование в основной текст.
- issue: Кто выходит против Египта
  choice: Русский текст, как и еврейский, не добавляет явного подлежащего; по контексту наиболее вероятен Бог.
  alternative: Отнести действие к Иосифу/Израилю, выходящему из Египта.
  rationale: Форма 3-го лица сама по себе не называет референта. Формулировка сохраняет грамматическую неоднозначность и не подменяет её пояснением.
- issue: Говорящий во второй половине стиха
  choice: Сохранено первое лицо без указания говорящего.
  alternative: Явно назвать Бога или псалмопевца.
  rationale: Поэтическая смена лица и её напряжение присутствуют в оригинале; добавление говорящего разрешило бы то, что текст оставляет невыраженным.
- issue: Время אֶשְׁמָע
  choice: 'Прошедшее: «я услышал».'
  alternative: 'Настоящее: «я слышу».'
  rationale: Прошедшее естественно в воспоминании об исходе и допустимо для поэтического имперфекта, однако морфологическая форма позволяет и настоящее, поэтому оно дано в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис сделан ясным для чтения вслух; архаизмы вроде «во Иосифе» и буквальное «губу» устранены. Двоеточие сохранено как переход к последующей прямой речи псалма.
