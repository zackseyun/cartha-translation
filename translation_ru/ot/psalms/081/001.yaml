source:
  edition: WLC
  text: הַ֭רְנִינוּ לֵ/אלֹהִ֣ים עוּזֵּ֑/נוּ הָ֝רִ֗יעוּ לֵ/אלֹהֵ֥י יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/001.yaml
  text: Sing for joy to God[a], our strength; shout aloud to the God of Jacob.
translation:
  language: ru
  text: Радостно пойте[a] Богу, нашей силе; громко восклицайте Богу Иакова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ликуйте перед Богом». Глагол обозначает радостную, звучную хвалу и не обязательно указывает только на пение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Радостно пойте
  rationale: Форма повелительного наклонения во множественном числе от רנן выражает громкую, ликующую хвалу; перевод передаёт и радость, и вероятный песенный характер призыва.
- source_word: לֵאלֹהִים
  choice: Богу
  rationale: Предлог ל обозначает адресата хвалы; в контексте אֱלֹהִים относится к единому Богу Израиля.
- source_word: עוּזֵּנוּ
  choice: нашей силе
  rationale: Прямо передаёт значение «наша сила, мощь» и сохраняет приложение к слову «Богу», не заменяя его более толковательным «защитнику» или «прибежищу».
- source_word: הָרִיעוּ
  choice: громко восклицайте
  rationale: Глагол в породе hифиль обозначает громкий возглас или торжественную аккламацию; этот перевод естественно выражает звучный призыв, не сводя его непременно к пению.
- source_word: לֵאלֹהֵי יַעֲקֹב
  choice: Богу Иакова
  rationale: Сохраняет конструкцию принадлежности «Бог Иакова» и передаёт ל как указание адресата возгласа.
theological_decisions:
- issue: Число и референт אֱלֹהִים в обеих параллельных строках
  choice: Бог / Бог Иакова
  alternative: боги
  rationale: Хотя форма אֱלֹהִים морфологически множественная, контекст и параллельное выражение «Бог Иакова» однозначно указывают на Бога Израиля в единственном числе.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным призывным звучанием. Параллелизм двух повелений сохранён; точка с запятой подчёркивает их тесную связь.
