lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов форма с ל обычно обозначает адресата, руководящего музыкальным исполнением. Такой перевод ясен современному читателю и сохраняет функциональный смысл.
- source_word: עַל
  choice: На
  rationale: В музыкальном заголовке עַל вводит указание на напев, инструмент или способ исполнения. Краткое «на» естественно для русской традиции заголовков и не устраняет неопределённость.
- source_word: הַגִּתִּית
  choice: гиттит
  rationale: 'Точное значение термина неизвестно: это может быть музыкальный инструмент, способ исполнения, название мелодии или обозначение, связанное с Гатом. Транслитерация не навязывает спорного толкования.'
- source_word: לְאָסָף
  choice: Асафа
  rationale: Конструкция с ל может указывать на авторство, принадлежность, связь со сборником или предназначение. Родительный заголовочный оборот сохраняет эту неоднозначность лучше, чем однозначное «написанный Асафом» или «для Асафа».
