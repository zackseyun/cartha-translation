  text: Слушай, народ Мой, и Я буду свидетельствовать против тебя[a]; Израиль! О, если бы ты послушал Меня![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и Я предостерегу тебя»; возможно также: «и Я буду свидетельствовать тебе».'
