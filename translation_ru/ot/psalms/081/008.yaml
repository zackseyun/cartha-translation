    text: 'Или, более буквально: «Израиль, если ты будешь слушать Меня…» Еврейская частица может выражать как условие, так и пожелание.'
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: Слушай
  rationale: Повелительная форма 2-го лица единственного числа прямо призывает народ внимать; «слушай» естественно по-русски и позволяет повторить тот же корень во второй половине стиха.
- source_word: עַמִּי
  choice: народ Мой
  rationale: Передаёт заветное и личное обращение без ненужного сужения значения до политического понятия «нация».
- source_word: וְאָעִידָה בָּךְ
  choice: и Я предостерегу тебя
  rationale: Hiphil глагола עוד может обозначать торжественное свидетельство или предупреждение. В контексте увещания «предостерегу» звучит естественно и сохраняет серьёзность речи, не делая судебное значение однозначным.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохраняется прямое обращение; частица «о» перенесена к следующему пожеланию, где она естественнее в современном русском.
- source_word: אִם תִּשְׁמַע לִי
  choice: о, если бы ты слушал Меня!
  rationale: אִם здесь допускает условное или желательное прочтение; русская конструкция «если бы» естественно выражает скорбное пожелание, а שׁמע с ל — не просто слышание, а внимательное послушание говорящему.
theological_decisions:
- issue: Характер выражения וְאָעִידָה בָּךְ
  choice: «Я предостерегу тебя»
  alternative: «Я буду свидетельствовать против тебя» / «Я засвидетельствую тебе»
  rationale: Еврейское сочетание допускает оттенки предупреждения и свидетельства, в том числе направленного против адресата. Основной текст выбирает естественное для данного увещания «предостерегу», а примечание сохраняет судебную возможность.
- issue: Сила אִם תִּשְׁמַע לִי
  choice: 'Пожелание: «о, если бы ты слушал Меня!»'
  alternative: 'Условие: «если ты будешь слушать Меня»'
  rationale: В поэтическом обращении אִם может вводить страстное пожелание. Такое прочтение подходит синтаксически незавершённой строке и не превращает её в обычное условное предложение; формальная условная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством поэтического божественного обращения. Прописные формы «Мой», «Меня», «Я» следуют принятой русской библейской орфографической традиции. Повтор «слушай — слушал» намеренно отражает повтор корня שׁמע.
