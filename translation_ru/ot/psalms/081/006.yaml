  text: I removed the burden from his shoulder[c][b][a]; his hands passed away from the basket.
translation:
  language: ru
  text: Я снял бремя с его плеча[a]; руки его освободились от корзины[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Я удалил от бремени его плечо».'
    reason: Сохранение необычного синтаксиса и более буквального прочтения.
  - marker: b
    text: 'Или: «от котла» либо «от горшка»; еврейское слово редкое в таком употреблении, и точное название предмета неясно. Глагол буквально означает, что руки «отошли» от него.'
    reason: Лексическая неопределённость существительного и более буквальное значение глагола.
lexical_decisions:
- source_word: הֲסִירוֹתִי
  choice: Я снял
  rationale: Порода hифиль, перфект 1-го лица ед. числа, выражает причинение удаления. «Снял» естественно сочетается по-русски с бременем на плече и сохраняет речь Бога от первого лица.
- source_word: מִסֵּבֶל
  choice: бремя
  rationale: סֵבֶל означает тяжёлую ношу или бремя. «Бремя» передаёт как физическую тяжесть подневольного труда, так и его гнетущий характер.
- source_word: שִׁכְמוֹ
  choice: с его плеча
  rationale: שׁכם буквально означает «плечо». Сохранено единственное число; порядок слов перестроен ради естественной русской речи.
- source_word: כַּפָּיו
  choice: руки его
  rationale: כף буквально может обозначать ладонь, но в описании труда естественным русским соответствием служит «руки».
- source_word: מִדּוּד
  choice: от корзины
  rationale: Редкое в данном контексте דּוּד обычно обозначает сосуд, котёл или горшок, однако параллелизм с тяжёлым трудом допускает традиционное понимание как корзины для переноски материала. Лексическая неопределённость отмечена в сноске.
- source_word: תַּעֲבֹרְנָה
  choice: освободились от
  rationale: Форма עבר, согласованная с «руками», буквально выражает их переход или удаление от предмета. В контексте прекращения принудительного труда «освободились от» ясно передаёт результат, не создавая неестественной русской фразы.
theological_decisions:
- issue: Характер избавления Израиля от принудительного труда
  choice: Сохранён образ физического освобождения от бремени и корзины
  alternative: Передать обе строки отвлечённо как освобождение от рабства
  rationale: Конкретные образы плеча, рук и рабочего сосуда принадлежат еврейскому тексту и не должны заменяться богословским обобщением.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Формы «бремя» и постпозиция местоимения в «руки его» поддерживают достоинство псалмового регистра, оставаясь понятными современному читателю.
