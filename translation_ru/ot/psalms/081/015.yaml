  text: Those who hate Yahweh would cringe before him[b][a], and their time would be forever.
translation:
  language: ru
  text: Ненавидящие Господа притворно покорились бы Ему[a], и срок их был бы вечным[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «склонились бы перед Ним, скрывая вражду», «притворились бы покорными Ему» или «содрогнулись бы перед Ним».'
