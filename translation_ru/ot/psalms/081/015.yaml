lexical_decisions:
- source_word: מְשַׂנְאֵי
  choice: ненавидящие
  rationale: Субстантивированное причастие обозначает тех, кто ненавидит; такая форма естественна для современной русской поэтической речи.
- source_word: יְהוָה
  choice: Господа
  rationale: Традиционная и понятная русская передача тетраграмматона в библейском тексте; она сохраняет достоинство регистра.
- source_word: יְכַחֲשׁוּ לוֹ
  choice: покорились бы Ему притворно
  rationale: Порода piel глагола כחשׁ с ל может означать вынужденное, неискреннее подчинение. Перевод передаёт притворство яснее, чем буквальное «съёжились бы», не сводя смысл лишь к страху.
- source_word: וִיהִי
  choice: и … длилось бы
  rationale: Имперфект в условно-модальной последовательности передан сослагательным наклонением; с временным существительным русский глагол «длилось» звучит естественно.
- source_word: עִתָּם
  choice: время их
  rationale: Сохранено основное значение עת — «время, срок», без преждевременного уточнения как «участь» или «наказание».
- source_word: לְעוֹלָם
  choice: вечно
  rationale: Краткая и естественная передача значения длительности לעולם в поэтическом контексте.
theological_decisions:
- issue: Смысл заключительной фразы ויהי עתם לעולם
  choice: и время их длилось бы вечно
  alternative: и наказание их длилось бы вечно; и благополучие их продолжалось бы всегда; и участь их была бы вечной
  rationale: 'Еврейская фраза предельно сжата: עת буквально означает «время» или «срок», а контекст допускает разные уточнения. Основной текст сохраняет эту неоднозначность и не вводит более конкретного учения о вечном наказании.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Местоимение, относящееся к Богу, написано с прописной буквы по принятой русской библейской традиции. Оба маркера сносок присутствуют в основном тексте.
