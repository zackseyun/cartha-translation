translation_notes:
  register: 'Современный литературный русский язык с торжественным, но доступным звучанием. Координация императивов слегка развёрнута добавлением «играйте», чтобы естественно связать названия струнных инструментов; смысловой материал не добавлен. Сноска о вариантах שְׂאוּ не включена: «запевайте» достаточно прямо и естественно выражает идиому, а варианты не создают существенной смысловой неоднозначности.'
