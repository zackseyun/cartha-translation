  text: שְֽׂאוּ זִ֭מְרָה וּ/תְנוּ תֹ֑ף כִּנּ֖וֹר נָעִ֣ים עִם נָֽבֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/081/002.yaml
  text: Raise a song and sound the tambourine[c][b][a], the pleasant lyre with the harp.
translation:
  language: ru
  text: Запевайте песню и бейте в бубен[b], играйте на благозвучной лире с арфой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Еврейское תֹף обозначает ударный инструмент — вероятно, рамочный барабан; традиционно переводится как «бубен».
    reason: cultural_note
  - marker: c
    text: Точное различие между древнееврейскими струнными инструментами כִּנּוֹר («лира») и נָבֶל («арфа») неизвестно; предлагаются также переводы «арфа» и «лютня».
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: запевайте
  rationale: Императив множественного числа буквально означает «поднимите/вознесите», но в сочетании с זִמְרָה призывает начать, подхватить песню; «запевайте» естественно передаёт идиому.
- source_word: זִמְרָה
  choice: песню
  rationale: Слово обозначает песню или музыку, особенно хвалебную; «песню» — ясный и не чрезмерно узкий эквивалент.
- source_word: וּתְנוּ
  choice: бейте
  rationale: Буквально «дайте», но при названии ударного инструмента речь идёт об извлечении звука; «бейте в бубен» — естественное русское сочетание.
- source_word: תֹף
  choice: бубен
  rationale: Древний рамочный ударный инструмент; «бубен» — понятный современному русскому читателю традиционный эквивалент.
- source_word: כִּנּוֹר
  choice: лире
  rationale: Вероятнее всего, небольшой струнный инструмент лирового типа; «лира» сохраняет отличие от נָבֶל.
- source_word: נָעִים
  choice: благозвучной
  rationale: При музыкальном инструменте прилагательное «приятный, отрадный» естественно передаётся как «благозвучный», то есть приятно звучащий.
- source_word: עִם
  choice: с
  rationale: Обычный предлог совместности или сопровождения.
- source_word: נָבֶל
  choice: арфой
  rationale: Струнный инструмент, отличающийся от כִּנּוֹר; точная древняя конструкция не установлена, но «арфа» сохраняет традиционное различение.
