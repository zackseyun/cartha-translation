  text: כִּ֤י לֹ֣א מִ֭/מּוֹצָא וּ/מִֽ/מַּעֲרָ֑ב וְ֝/לֹ֗א מִ/מִּדְבַּ֥ר הָרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/006.yaml
  text: For not from the east or from the west[c][b][a], and not from the wilderness comes lifting up.
translation:
  language: ru
  text: Ибо не с востока, не с запада и не из пустыни приходит возвышение.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвышение» в значении «продвижение», «возвеличивание». Еврейская фраза эллиптична и трудна; следующий стих поясняет смысл: Бог одного унижает, а другого возвышает.'
    reason: lexical_alternative
  - marker: b
    text: 'Последнее еврейское слово можно также понять как «горы»; тогда возможен перевод: «и не из пустыни гор». Однако контекст следующего стиха скорее указывает на возвышение.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит объяснение предыдущей мысли; «ибо» естественно передаёт причинно-пояснительную связь и сохраняет достоинство поэтической речи.
- source_word: מִמּוֹצָא
  choice: с востока
  rationale: Существительное буквально связано с восходом или выходом солнца и здесь обозначает восток.
- source_word: וּמִמַּעֲרָב
  choice: не с запада
  rationale: Слово обозначает запад как сторону заката; повтор отрицания в русском делает ряд ясным и ритмичным.
- source_word: מִמִּדְבַּר
  choice: не из пустыни
  rationale: מִדְבָּר означает пустыню или безлюдную местность; «пустыня» естественно в данном географическом ряду.
- source_word: הָרִים
  choice: приходит возвышение
  rationale: В контексте следующего стиха форму уместно связать с רום, «поднимать, возвышать». Глагол «приходит» восполняет эллипсис, а «возвышение» сохраняет связь с тем, что Бог одного унижает, а другого возвышает.
theological_decisions:
- issue: Толкование трудной заключительной формы הָרִים
  choice: Стих отрицает, что возвышение приходит с какой-либо земной стороны.
  alternative: 'Понимать הָרִים как существительное «горы»: «и не из пустыни гор».'
  rationale: Следующий стих прямо говорит, что Бог одного унижает, а другого возвышает; это поддерживает чтение, связанное с корнем רום. Однако альтернативное понимание формы отмечено в сноске, поскольку еврейская фраза трудна и допускает иную огласовку или интерпретацию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим регистром. Параллельное повторение «не» делает отрицательный ряд естественным по-русски; трудность и неоднозначность финала сохранены в сносках.
