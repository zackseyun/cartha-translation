  yaml_path: translation/ot/psalms/075/009.yaml
  text: But as for me[a], I will declare forever; I will sing praise to the God of Jacob.
translation:
  language: ru
  text: А я[a] буду возвещать вечно, буду петь хвалу Богу Иакова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И я буду возвещать вечно». Еврейский союз может означать «и», а в данном контексте — выражать противопоставление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Союз с самостоятельным местоимением выделяет говорящего и в данном контексте выражает противопоставление. «А я» естественно передаёт это по-русски, не усиливая противительный оттенок сверх необходимого.
- source_word: אַגִּיד
  choice: буду возвещать
  rationale: Каузативная порода глагола נגד означает объявлять, сообщать, делать известным. «Возвещать» сохраняет публичный и возвышенный оттенок, уместный в псалме.
- source_word: לְעוֹלָם
  choice: вечно
  rationale: Выражение обозначает неограниченную или непрестанную длительность; наречие «вечно» кратко и естественно сочетается с обетом хвалы.
- source_word: אֲזַמְּרָה
  choice: буду петь хвалу
  rationale: Глагол זמר в пиэле обозначает музыкальное прославление. «Петь хвалу» передаёт и музыкальный, и хвалебный смысл.
- source_word: לֵאלֹהֵי
  choice: Богу
  rationale: Предлог ל обозначает адресата хвалы; русский дательный падеж естественно передаёт «Богу Иакова» без отдельного предлога.
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Использована традиционная русская форма библейского имени; сочетание «Бог Иакова» сохраняет исходное обозначение Бога.
theological_decisions:
- issue: Смысловая связь говорящего с окружающим контекстом о нечестивых
  choice: 'Передать начало как подчёркнутое противопоставление: «А я»'
  alternative: «И я»
  rationale: Самостоятельное местоимение после союза выделяет говорящего, а контекст поддерживает контраст. Русское «А я» сохраняет этот оттенок, не превращая допустимую контекстную функцию союза в чрезмерно резкое «Но я».
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической лексикой. Параллельные формы «буду возвещать» и «буду петь хвалу» сохраняют ритм и смысл исходного стиха.
