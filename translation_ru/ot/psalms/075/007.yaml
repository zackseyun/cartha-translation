lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего утверждения; «ибо» естественно передаёт пояснительно-причинную связь и соответствует возвышенному поэтическому регистру.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Единственное число сказуемого и контекст указывают на единственного Бога.
- source_word: שֹׁפֵט
  choice: Судья
  rationale: Причастие допускает именное понимание и здесь подчёркивает роль Бога как Судьи; возможное глагольное прочтение сохранено в сноске.
- source_word: זֶה ... וְזֶה
  choice: одного ... а другого
  rationale: Повтор демонстратива образует распределительное противопоставление; русский оборот «одного… другого» передаёт его естественно.
- source_word: יַשְׁפִּיל
  choice: низводит
  rationale: Каузативная форма означает «делает низким, опускает»; «низводит» сохраняет вертикальный образ и образует точную антитезу с «возвышает».
- source_word: יָרִים
  choice: возвышает
  rationale: Каузативная форма передаёт поднятие или возвеличивание; «возвышает» сохраняет как пространственный образ, так и смысл изменения положения.
theological_decisions:
- issue: Характер выражения אֱלֹהִים שֹׁפֵט
  choice: Бог — Судья
  alternative: Бог судит
  rationale: Еврейское причастие может обозначать как действие, так и устойчивую роль. Основной текст сохраняет именной оттенок и акцент на Божьем праве судить, а сноска отмечает допустимое глагольное прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Антитеза «низводит — возвышает» сохраняет образную симметрию оригинала; местоимение «Он» написано с прописной буквы в соответствии с принятым библейским регистром.
