  text: Do not lift up your horn on high[b][a]; do not speak with an arrogant neck.
translation:
  language: ru
  text: Не поднимайте высоко свой рог[a]; не говорите с высокомерно вскинутой шеей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Рог» — образ силы, могущества или самовозвышения.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с дерзкой шеей», «с заносчиво поднятой шеей». В еврейском тексте сохраняется телесный образ надменности или дерзости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: не
  rationale: Отрицательная частица с формой глагола выражает прямой запрет; по-русски естественно передаётся конструкцией «не» с повелительным наклонением.
- source_word: תָּרִימוּ
  choice: поднимайте
  rationale: Глагол רום означает «поднимать, возносить». «Поднимайте» сохраняет конкретный образ и не сводит его сразу к абстрактному самовозвышению.
- source_word: לַמָּרוֹם
  choice: высоко
  rationale: מָרוֹם обозначает высоту; наречие «высоко» естественно передаёт направленность вверх и сохраняет пространственный образ.
- source_word: קַרְנְכֶם
  choice: свой рог
  rationale: קֶרֶן буквально означает «рог» и метафорически может обозначать силу, могущество или самовозвышение. Основной текст сохраняет исходный образ, а его смысл поясняется в сноске.
- source_word: תְּדַבְּרוּ
  choice: говорите
  rationale: Обычный глагол речи; «говорите» соответствует поэтическому, но понятному современному регистру.
- source_word: בְצַוָּאר
  choice: с ... шеей
  rationale: Предлог с существительным буквально создаёт телесный образ манеры речи. Русская конструкция сохраняет образ шеи, не заменяя его полностью толкованием.
- source_word: עָתָק
  choice: надменной
  rationale: Слово выражает надменность, дерзость или вызывающее высокомерие. «Надменной» ясно связывает положение шеи с гордым неповиновением, сохраняя образность.
theological_decisions:
- issue: Метафорическое значение «рога»
  choice: Сохранить буквальный образ «рог» в основном тексте и пояснить диапазон значений в сноске.
  alternative: 'Передать толковательно: «сила», «могущество» или «гордость».'
  rationale: Еврейская метафора намеренно ёмкая и может одновременно указывать на силу, власть и самовозвышение; замена одним абстрактным словом сузила бы смысл.
- issue: Телесный образ надменной шеи
  choice: Сохранить выражение «с надменной шеей».
  alternative: 'Передать только смысл: «не говорите надменно» или «не говорите дерзко».'
  rationale: Сохранение телесного образа передаёт гордое, вызывающее положение человека и не устраняет образную напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с сохранением двух ключевых древнееврейских телесных метафор. Формулировка нарочито образна, но синтаксически проста и понятна обычному читателю.
