source:
  edition: WLC
  text: וְ/כָל קַרְנֵ֣י רְשָׁעִ֣ים אֲגַדֵּ֑עַ תְּ֝רוֹמַ֗מְנָה קַֽרְנ֥וֹת צַדִּֽיק־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/010.yaml
  text: And I will cut off all the horns of the wicked[a], but the horns of the righteous will be lifted up.
translation:
  language: ru
  text: И все рога нечестивых я отсеку[a], а рога праведника вознесутся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Рога» — образ силы, власти или высокого положения.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: И все
  rationale: Простой союз וְ связывает заключительную строку с предшествующим контекстом, а כָּל означает «все».
- source_word: קַרְנֵי / קַרְנוֹת
  choice: рога
  rationale: Сохраняется конкретный поэтический образ рога как символа силы, власти и высокого положения, а не заменяется одним отвлечённым понятием.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное множественное число обозначает нечестивых людей как собирательную нравственную категорию.
- source_word: אֲגַדֵּעַ
  choice: я отсеку
  rationale: Глагол גדע означает «отсекать, срубать»; «отсеку» естественно сочетается с образом рогов и передаёт решительное лишение силы.
- source_word: תְּרוֹמַמְנָה
  choice: вознесутся
  rationale: Форма от רום выражает возвышение; «вознесутся» сохраняет поэтический регистр и согласуется с множественным подлежащим «рога».
- source_word: צַדִּיק
  choice: праведника
  rationale: Морфологически это единственное число. Русское «праведника» сохраняет его, позволяя понимать образ как обобщённое обозначение праведного человека.
theological_decisions:
- issue: Метафора рога как силы и возвышенного положения
  choice: Сохранить «рога» в основном тексте.
  alternative: Передать метафору словами «сила» или «могущество».
  rationale: Библейский образ рога намеренно объединяет представления о силе, власти и возвышении; замена одним отвлечённым словом сузила бы смысл.
- issue: Число в выражении צַדִּיק
  choice: 'Передать единственным числом: «праведника».'
  alternative: 'Обобщить множественным числом: «праведных».'
  rationale: Единственное число непосредственно соответствует еврейской форме и сохраняет поэтическую асимметрию между множеством нечестивых и обобщённым образом праведника.
- issue: Связь между полустишиями
  choice: Передать второй член противительным союзом «а».
  alternative: Использовать «но».
  rationale: В еврейском тексте перед תְּרוֹמַמְנָה нет отдельного союза; противопоставление создаётся параллелизмом. Русское «а» ясно и ненавязчиво выражает этот контраст.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного поэтического параллелизма и традиционного библейского образа. «Нечестивых» и «вознесутся» поддерживают достойный, но понятный регистр.
