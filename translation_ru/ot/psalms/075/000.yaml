lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Термин в надписаниях псалмов обозначает человека, руководящего музыкальным исполнением; этот вариант краток, естественен и передаёт литургико-музыкальную функцию.
- source_word: אַל תַּשְׁחֵת
  choice: «Не погуби»
  rationale: Выражение, вероятнее всего, служит названием напева или музыкальным указанием, а не частью основного содержания псалма. Кавычки обозначают эту функцию, а «погуби» естественно передаёт значение глагола שׁחת в данном контексте.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Стандартное жанровое обозначение; сохранено отдельно от следующего слова שִׁיר.
- source_word: לְאָסָף
  choice: Асафа
  rationale: Русская родительная конструкция сохраняет традиционную краткость и допускает авторство, связь с Асафом или принадлежность к асафову собранию, не решая неоднозначность предлога לְ.
- source_word: שִׁיר
  choice: Песнь
  rationale: 'Отдельное жанровое обозначение, сохраняющее двойную характеристику еврейского надписания: מִזְמוֹר ... שִׁיר.'
