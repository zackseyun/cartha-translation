  text: נְֽמֹגִ֗ים אֶ֥רֶץ וְ/כָל יֹשְׁבֶ֑י/הָ אָנֹכִ֨י תִכַּ֖נְתִּי עַמּוּדֶ֣י/הָ סֶּֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/003.yaml
  text: The earth and all who dwell in it melt away[a]; I myself have set its pillars firm[c][b]. Selah
translation:
  language: ru
  text: Земля и все живущие на ней тают[a]; я сам утвердил её столпы[b]. Села[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «колеблются», «распадаются» или «потрясены». Еврейский образ передаёт утрату устойчивости или разрушение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прочно установил её столпы».'
    reason: lexical_alternative
  - marker: c
    text: «Села» — традиционная транслитерация еврейского слова, точное значение которого неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: נְמֹגִים
  choice: тают
  rationale: Причастие от מוג передаёт образ таяния, распада или утраты устойчивости. «Тают» сохраняет яркую поэтическую метафору, не сводя её к отвлечённому «колеблются».
- source_word: אֶרֶץ
  choice: земля
  rationale: Сочетание со всеми живущими на ней и с её столпами указывает здесь на землю в космическом, а не только локальном смысле.
- source_word: יֹשְׁבֶיהָ
  choice: все живущие на ней
  rationale: Так передаётся значение причастия от ישב и сохраняется его глагольный оттенок.
- source_word: אָנֹכִי
  choice: я сам
  rationale: Самостоятельное местоимение имеет эмфатический характер; «я сам» передаёт акцент без добавления идеи исключительности.
- source_word: תִכַּנְתִּי
  choice: утвердил
  rationale: Форма породы пиэль от כון здесь означает сделать устойчивым, прочно установить; с образом столпов естественно русское «утвердил».
- source_word: עַמּוּדֶיהָ
  choice: её столпы
  rationale: Слово означает столпы или колонны; «столпы» сохраняет традиционный и выразительный космологический образ.
- source_word: סֶּלָה
  choice: Села
  rationale: Точное значение термина неизвестно, поэтому он передан транслитерацией, без предположительного толкования в основном тексте.
theological_decisions:
- issue: Космологический образ столпов земли
  choice: Сохранить буквальный поэтический образ «её столпы».
  alternative: её основания; её опоры
  rationale: Стих использует древний поэтический образ мира, чтобы выразить утверждающую и поддерживающую власть Бога. Его не следует переиначивать в соответствии с современными научными представлениями.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства поэтической речи. Порядок маркеров исправлен так, чтобы каждая сноска непосредственно следовала за соответствующим словом или выражением.
