base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/004.yaml
  text: I said to the boastful[a], “Do not boast,” and to the wicked, “Do not lift up your horn.”
translation:
  language: ru
  text: 'Я сказал хвастливым: «Не хвастайтесь», а нечестивым: «Не поднимайте рог[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не превозносите своей силы»; или: «Не возноситесь в гордости». Рог — еврейский образ силы, могущества или гордого самовозвышения.'
    reason: Лексическая альтернатива и пояснение метафоры.
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Я сказал
  rationale: Форма qal, перфект, 1-е лицо единственного числа; простое прошедшее время сохраняет завершённость еврейской формы и естественно звучит в поэтическом контексте.
- source_word: הוֹלְלִים
  choice: хвастливым
  rationale: В данном контексте слово обозначает склонных хвалиться или кичиться. Перевод сохраняет лексическую связь с последующим תָּהֹלּוּ и не сужает значение до одной лишь глупости.
- source_word: אַל תָּהֹלּוּ
  choice: Не хвастайтесь
  rationale: Отрицательная волевая форма во 2-м лице множественного числа. Такой перевод краток, естественен и сохраняет словесную перекличку с «хвастливым».
- source_word: רְשָׁעִים
  choice: нечестивым
  rationale: Устойчивое обозначение нравственно виновных и противящихся Богу людей в Псалтири; передаёт моральную категорию без излишнего юридического уточнения.
- source_word: אַל תָּרִימוּ
  choice: Не поднимайте
  rationale: Hiphil, отрицательная волевая форма во 2-м лице множественного числа от רום. «Поднимать» прямо передаёт действие и естественно сочетается с сохранённым образом рога.
- source_word: קָרֶן
  choice: рога
  rationale: Сохранена еврейская метафора силы, могущества и гордого возвышения. После отрицания родительный падеж «рога» естественен по-русски; притяжательное местоимение не добавлено, поскольку в еврейском тексте оно отсутствует.
theological_decisions:
- issue: Метафорическое значение «рога»
  choice: 'Сохранить образ в основном тексте: «Не поднимайте рога»'
  alternative: «Не превозносите своей силы» или «Не возноситесь в гордости»
  rationale: Образ рога допускает взаимосвязанные оттенки силы, положения и гордого самовозвышения. Его сохранение не устраняет подлинную смысловую широту поэтической метафоры; пояснение дано в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим синтаксисом. Пара «хвастливым — не хвастайтесь» передаёт корневой повтор оригинала; библейский образ рога сохранён без искусственного пояснения в основном тексте.
