  text: Благодарим Тебя, Боже, благодарим, и Твоё имя близко; рассказывают о Твоих чудесных делах[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «Твоё имя близко» может указывать на близость Бога, Его явленное присутствие, славу или известность; образ еврейского текста сохранён без уточняющего пересказа.
    reason: lexical_alternative
