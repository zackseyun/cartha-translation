    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדִינוּ
  choice: благодарим
  rationale: В данном псалмическом контексте порода hифиль глагола ידה выражает благодарение и хвалу, обращённые к Богу. Повтор сохранён.
- source_word: לְּךָ אֱלֹהִים
  choice: Тебя, Боже
  rationale: Местоименное дополнение передано явно, а אֱלֹהִים понято как прямое обращение; форма «Боже» естественна для современного русского молитвенно-поэтического регистра.
- source_word: וְקָרוֹב
  choice: и близко
  rationale: Союз ו передан нейтральным «и», без однозначного превращения связи в причинную; инверсия «близко имя Твоё» сохраняет поэтическое ударение оригинала.
- source_word: שְׁמֶךָ
  choice: имя Твоё
  rationale: Сохранён библейский образ «имени», который может включать явленную сущность, славу и присутствие Бога; перевод не сводит его к одному толкованию.
- source_word: סִפְּרוּ
  choice: рассказывают
  rationale: Неопределённо-личная русская конструкция точно сохраняет форму третьего лица множественного числа без названного подлежащего. Настоящее время естественно передаёт актуальное, продолжающееся возвещение в поэтическом контексте.
- source_word: נִפְלְאוֹתֶיךָ
  choice: о Твоих чудесных делах
  rationale: Выражение обозначает необычайные Божьи деяния, вызывающие изумление; «чудесные дела» делает предмет рассказа конкретным и остаётся естественным по-русски.
theological_decisions:
- issue: Смысл выражения «близко имя Твоё»
  choice: 'Сохранить образ буквально: «близко имя Твоё».'
  alternative: «Ты близок»; «близко Твоё присутствие»; «слава Твоя близка».
  rationale: В псалмах Божье имя может обозначать Его явленный характер, славу или присутствие. Еврейский текст не требует выбрать только один из этих смыслов, поэтому богословская многозначность сохранена.
- issue: Логическая связь слов о близости имени с благодарением
  choice: Передать ו нейтральным союзом «и».
  alternative: «ибо близко имя Твоё».
  rationale: Причинное понимание возможно, однако союз сам по себе допускает более широкую сочинительную связь. Нейтральная передача не устраняет синтаксической напряжённости оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-поэтическим звучанием. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают традиционный русский библейский регистр; архаизмы и конфессионально окрашенные разъяснения не вводятся.
