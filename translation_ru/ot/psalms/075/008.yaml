- from: Ибо чаша в руке Яхве[a], и вино пенится, полное пряной смеси[b]. Он наливает из неё, и все нечестивые земли непременно выпьют её до дна, вместе с осадком[c].
  to: Ибо чаша в руке Яхве[a], и вино пенится, полное смеси[b]. Он выливает из неё, и все нечестивцы земли непременно выжмут её осадок и выпьют его[c].
