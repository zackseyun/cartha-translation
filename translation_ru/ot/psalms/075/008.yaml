base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/008.yaml
  text: For a cup is in the hand of Yahweh[a], and the wine foams, full of mixed spices; he pours from it[c][b], and surely all the wicked of the earth will drain its dregs and drink.
translation:
  language: ru
  text: Ибо чаша в руке Яхве[a], и вино пенится, полное смеси[b]. Он выливает из неё, и все нечестивцы земли непременно выжмут её осадок и выпьют его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Яхве — личное имя Бога; традиционно также передаётся как «Господь».
    reason: divine_name
  - marker: b
    text: 'Или: «полное смешанного вина» или «хорошо смешанное». Еврейский текст говорит о приготовленном смешанном вине, возможно с пряностями.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «её осадок выжмут и выпьют». Имеется в виду, что нечестивцы должны испить чашу целиком, до самого осадка.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего утверждения и сохраняет связность поэтического рассуждения.
- source_word: כּוֹס
  choice: чаша
  rationale: Обычный русский эквивалент, сохраняющий библейский образ сосуда божественного суда.
- source_word: בְּיַד יְהוָה
  choice: в руке Яхве
  rationale: Сохраняется конкретный еврейский образ обладания и власти, а личное имя передаётся транслитерацией.
- source_word: יַיִן חָמַר
  choice: вино пенится
  rationale: חָמַר здесь живописно описывает пенящееся или бродящее вино; перевод не сводит значение к цвету.
- source_word: מָלֵא מֶסֶךְ
  choice: полное пряной смеси
  rationale: Речь идёт о приготовленном смешанном вине, возможно с пряностями; формулировка сохраняет эту вероятную предметную картину, не выдавая её за единственно возможную.
- source_word: וַיַּגֵּר מִזֶּה
  choice: Он наливает из неё
  rationale: Передаёт действие выливания из чаши естественным русским выражением и сохраняет подразумеваемого божественного деятеля.
- source_word: אַךְ
  choice: непременно
  rationale: В контексте подчёркивает неизбежность суда.
- source_word: שְׁמָרֶיהָ
  choice: её осадок
  rationale: Обозначает винный осадок на дне сосуда; современное и понятное соответствие.
- source_word: יִמְצוּ יִשְׁתּוּ
  choice: выпьют её до дна, вместе с осадком
  rationale: Еврейские глаголы и их порядок передают полное, неотвратимое испитие содержимого; по-русски образ естественно выражается как питьё до дна, включая осадок.
- source_word: כֹּל רִשְׁעֵי אָרֶץ
  choice: все нечестивые земли
  rationale: Точно сохраняет всеобщий охват и нравственную характеристику адресатов суда.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное имя Бога; транслитерация сохраняет заветное имя и не заменяет его титулом.
- issue: Образ чаши
  choice: Сохранить образ чаши с приготовленным вином без добавления слова «гнев»
  alternative: чаша гнева
  rationale: Контекст указывает на божественный суд, однако сам стих выражает это метафорой и не употребляет существительного «гнев».
- issue: Способ испития осадка
  choice: выпьют её до дна, вместе с осадком
  alternative: выжмут и выпьют её осадок
  rationale: Выбран естественный русский способ передать полное испитие чаши; примечание разъясняет буквальный образ, не ослабляя неизбежность суда.
