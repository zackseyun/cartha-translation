  source_fidelity: 'Текст точно передаёт синтаксис и основные смысловые компоненты еврейского стиха: כִּי как связку с предшествующим контекстом («Ибо когда»), אֶקַּח מוֹעֵד как выбор/установление назначенного времени, эмфатическое אֲנִי («Я Сам») и судебную прямоту מֵישָׁרִים («по справедливости»). Будущее «буду судить» уместно для еврейского имперфекта в данном контексте. Буквальное значение глагола «возьму» корректно отмечено в сноске.'
