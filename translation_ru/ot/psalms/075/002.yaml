  text: כִּ֭י אֶקַּ֣ח מוֹעֵ֑ד אֲ֝נִ֗י מֵישָׁרִ֥ים אֶשְׁפֹּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/075/002.yaml
  text: For when I choose the appointed time[b][a], I myself will judge with uprightness.
translation:
  language: ru
  text: Ибо когда Я изберу назначенное время[a], Я Сам буду судить по справедливости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возьму назначенное время». Возможно также: «назначу установленное время».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по правоте»; «беспристрастно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо когда
  rationale: כִּי здесь связывает высказывание с предыдущим контекстом как основание или пояснение, а временное отношение естественно выражается вместе со следующей фразой словом «когда».
- source_word: אֶקַּח מוֹעֵד
  choice: изберу назначенное время
  rationale: Глагол לקח буквально означает «взять», но в сочетании с מוֹעֵד передаёт выбор или определение установленного срока. Формулировка сохраняет оба компонента еврейского выражения и остаётся понятной по-русски.
- source_word: אֲנִי
  choice: Я Сам
  rationale: Отдельное местоимение усиливает уже выраженное глагольной формой первое лицо; «Я Сам» передаёт это смысловое ударение.
- source_word: מֵישָׁרִים
  choice: по справедливости
  rationale: Существительное во множественном числе обозначает прямоту, правоту и беспристрастность, особенно в судебном контексте. «По справедливости» естественно передаёт этот нравственно-судебный смысл.
- source_word: אֶשְׁפֹּט
  choice: буду судить
  rationale: Глагол שׁפט здесь обозначает совершение суда; форма имперфекта в данном высказывании естественно передаётся будущим временем.
theological_decisions:
- issue: Говорящий и притязание на суд
  choice: Сохранено прямое высказывание от первого лица без добавления имени говорящего; подчёркнуто «Я Сам».
  alternative: Явно назвать говорящего Богом в тексте стиха.
  rationale: Контекст псалма позволяет понимать говорящего как Бога, однако сам стих имени не называет. Перевод сохраняет форму оригинала и не делает неявное отождествление явным.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным звучанием. Заглавные формы «Я Сам» отражают традиционное оформление божественной речи и одновременно передают эмфазу самостоятельного местоимения.
