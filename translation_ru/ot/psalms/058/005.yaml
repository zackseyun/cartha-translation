lexical_decisions:
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение продолжает описание глухой кобры из предыдущего стиха и естественно согласуется с ней в русском языке.
- source_word: לֹא יִשְׁמַע
  choice: не слушает
  rationale: Имперфект описывает характерное отсутствие отклика. «Не слушает» передаёт не просто физическое неслышание, а неподчинение воздействию заклинателей.
- source_word: לְקוֹל
  choice: голоса
  rationale: קוֹל может означать как «голос», так и «звук». Здесь речь идёт о людях, произносящих заклинания, поэтому «голоса» естественно в основном тексте; вариант со звуком отмечен в сноске.
- source_word: מְלַחֲשִׁים
  choice: заклинателей
  rationale: Слово связано с шёпотом и произнесением магических формул; в контексте змеи обозначает тех, кто пытается воздействовать на неё заклинанием.
- source_word: חוֹבֵר חֲבָרִים
  choice: заклинатель … произносил свои заклятия
  rationale: Буквально трудная идиома означает «связывающий заклятия/чары». Русская формулировка передаёт деятельность опытного заклинателя без неясной буквальности.
- source_word: מְחֻכָּם
  choice: как бы искусно … ни
  rationale: Форма от корня со значением мудрости здесь указывает на умелость или опытность. Уступительная конструкция естественно выражает, что змея не откликается даже на искусного заклинателя.
