  text: יִשְׂמַ֣ח צַ֭דִּיק כִּי חָזָ֣ה נָקָ֑ם פְּעָמָ֥י/ו יִ֝רְחַ֗ץ בְּ/דַ֣ם הָ/רָשָֽׁע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/010.yaml
  text: The righteous will rejoice when he sees vengeance[b][a]; he will wash his feet in the blood of the wicked.
translation:
  language: ru
  text: Праведник возрадуется, когда увидит возмездие[a]; он омоет ноги в крови нечестивого[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что увидел возмездие». Еврейский союз может выражать как причину («потому что»), так и время («когда»).'
    reason: lexical_alternative
  - marker: b
    text: Образ омовения ног в крови нечестивого поэтически изображает полноту совершившегося суда; это не призыв к личному насилию.
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׂמַח
  choice: возрадуется
  rationale: Форма Qal imperfect 3-го лица мужского рода единственного числа в поэтическом контексте передаёт будущее действие; «возрадуется» сохраняет возвышенный, но понятный регистр.
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное в единственном числе естественно передаётся существительным «праведник», которое сохраняет грамматическое число и представительный характер образа.
- source_word: כִּי
  choice: когда
  rationale: Союз может иметь причинное или временное значение; здесь «когда» естественно вводит обстоятельство, при котором праведник радуется, а причинное прочтение отмечено в сноске.
- source_word: חָזָה
  choice: увидит
  rationale: Перфект в будущем по смыслу поэтическом высказывании естественно передаётся русским будущим видом после «когда»; глагол сохраняет прямое значение зрительного восприятия.
- source_word: נָקָם
  choice: возмездие
  rationale: «Возмездие» прямо передаёт идею карательного воздаяния, не сводя её ни к личной мести, ни только к оправданию праведника.
- source_word: פְּעָמָיו
  choice: ноги
  rationale: Хотя слово может обозначать шаги или стопы, в сочетании с омовением конкретное «ноги» наиболее ясно и естественно передаёт образ.
- source_word: יִרְחַץ
  choice: омоет
  rationale: Будущая форма «омоет» сохраняет значение Qal imperfect и соответствует поэтическому, торжественному регистру без архаической непонятности.
- source_word: בְּדַם
  choice: в крови
  rationale: Предлог передан локативно; это сохраняет резкий и наглядный образ еврейского текста без смягчающего пересказа.
- source_word: הָרָשָׁע
  choice: нечестивого
  rationale: Субстантивированное прилагательное в единственном числе передано формой, согласованной с «крови»; она может обозначать представительного нечестивца, не исключая собирательного оттенка.
theological_decisions:
- issue: Изображает ли стих личную мстительность или радость о совершившемся справедливом воздаянии
  choice: Текст прямо говорит о радости праведника при виде возмездия, не называя его личной местью и не добавляя в основной текст отсутствующее определение «Божье».
  alternative: Истолковать выражение либо как торжество личной мести, либо смягчить его до одного лишь оправдания праведника.
  rationale: Еврейский текст сохраняет суровый образ воздаяния и омовения ног в крови нечестивого. Перевод не устраняет напряжённость этого образа, а сноска поясняет его поэтическую функцию, не превращая пояснение в часть самого стиха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Возрадуется» и «омоет» соответствуют стилю псалма, оставаясь понятными современному читателю; резкость исходного образа сохранена.
