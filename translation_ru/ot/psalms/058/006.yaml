  text: אֱֽלֹהִ֗ים הֲרָס שִׁנֵּ֥י/מוֹ בְּ/פִ֑י/מוֹ מַלְתְּע֥וֹת כְּ֝פִירִ֗ים נְתֹ֣ץ יְהוָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/006.yaml
  text: God[a], break their teeth in their mouths; shatter the fangs of the young lions[b], O Yahweh.
translation:
  language: ru
  text: Боже, сокруши зубы у них во рту; разбей клыки молодых львов, Яхве!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма обращения естественно передаёт звательный смысл в повелительной молитве и соответствует параллельному обращению к Яхве.
- source_word: הֲרָס
  choice: сокруши
  rationale: Императив означает разрушить или сломать; с дополнением «зубы» слово «сокруши» сохраняет силу образа и возвышенный поэтический регистр.
- source_word: שִׁנֵּימוֹ
  choice: зубы у них
  rationale: Передаёт множественное число и суффикс третьего лица; вместе с последующим «во рту» звучит по-русски естественнее, чем повтор местоимения.
- source_word: בְּפִימוֹ
  choice: у них во рту
  rationale: Предлог ב локализует зубы во рту; перевод сохраняет конкретный образ еврейского текста.
- source_word: מַלְתְּעוֹת
  choice: клыки
  rationale: Слово обозначает дробящие зубы или челюстные зубы. В образе молодых львов «клыки» естественно выражают их хищную опасность, хотя анатомически более узкое значение отмечено как возможная альтернатива.
- source_word: כְּפִירִים
  choice: молодых львов
  rationale: Обозначает молодых, уже сильных львов, а не обязательно малых львят.
- source_word: נְתֹץ
  choice: разбей
  rationale: Императив נתץ выражает разрушение, разбивание или сокрушение. «Разбей» хорошо сочетается с зубами и сохраняет параллелизм без добавления идеи вырывания, которой глагол не требует.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передана форма личного имени, представленная тетраграмматоном, а не заменяющий её титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господи
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и отличает его от титула.
- issue: Жестокий образ в молитве-проклятии
  choice: Сохранить буквальную просьбу сокрушить зубы и разбить клыки
  alternative: Смягчить до отвлечённого выражения «лишить их силы»
  rationale: Еврейский текст намеренно использует конкретный телесный и хищнический образ; его смягчение устранило бы силу и напряжение псалма.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Императивы «сокруши» и «разбей» сохраняют резкость параллельных строк; синтаксис остаётся понятным обычному читателю.
