lexical_decisions:
- source_word: יִמָּאֲסוּ
  choice: пусть они растают
  rationale: В данном поэтическом контексте глагол выражает исчезновение или растворение; форма пожелания сохраняет характер проклятия.
- source_word: כְמוֹ מַיִם
  choice: как утекающая вода
  rationale: Сравнение передано прямо, а причастие «утекающая» естественно связывает образ воды со следующим глаголом движения.
- source_word: יִתְהַלְּכוּ לָמוֹ
  choice: утекающая
  rationale: Выражение рисует воду, которая движется прочь и исчезает; русское «утекающая» передаёт образ без неестественной буквальности местоименного элемента לָמוֹ.
- source_word: יִדְרֹךְ
  choice: когда он нацелит
  rationale: Глагол буквально связан с натягиванием или приведением оружия в готовность; при объекте «стрела» значение естественно передаётся как подготовка и наведение стрелы.
- source_word: חצו
  choice: свою стрелу
  rationale: Сохранено грамматическое единственное число масоретского текста; возвратное притяжательное местоимение ясно соотносит стрелу с действующим лицом.
- source_word: כְּמוֹ יִתְמֹלָלוּ
  choice: пусть она словно обломится
  rationale: Редкая и трудная форма допускает значения отсечения, увядания или утраты действенности. «Обломится» удерживает образ повреждённой стрелы, но неопределённость отмечена в сноске.
theological_decisions:
- issue: К кому относится единственное число «он» во второй половине стиха
  choice: Оставить местоимение без уточнения
  alternative: Назвать нечестивого или Бога
  rationale: Еврейский текст не называет деятеля прямо; добавление конкретного референта устранило бы подлинную синтаксическую неоднозначность.
- issue: К кому относится пожелание в последней строке
  choice: Соотнести его со стрелой в рамках оружейного образа
  alternative: 'Соотнести с нечестивыми: «пусть они увянут»'
  rationale: Непосредственная близость слова «стрела» поддерживает оружейное прочтение, однако иная связь возможна и отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтической сдержанностью. Синтаксис сохраняет параллелизм и форму пожелания-проклятия; архаизмы и конфессионально окрашенные уточнения не вводятся.
