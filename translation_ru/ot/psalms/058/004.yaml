  text: חֲמַת לָ֗/מוֹ כִּ/דְמ֥וּת חֲמַת נָחָ֑שׁ כְּמוֹ פֶ֥תֶן חֵ֝רֵ֗שׁ יַאְטֵ֥ם אָזְנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/004.yaml
  text: Their venom is like the venom of a serpent[a], like a deaf cobra that stops up its ear,
translation:
  language: ru
  text: Яд у них — как яд змеи, как у глухой кобры[a], что затыкает себе ухо,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «аспида»; еврейское פֶתֶן обозначает ядовитую змею и традиционно переводится как «аспид».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: яд
  rationale: В сочетании со змеёй слово обозначает змеиный яд, а не ярость; повтор сохраняет поэтический параллелизм.
- source_word: לָמוֹ
  choice: у них
  rationale: Местоименная форма выражает принадлежность; конструкция «яд у них» естественна по-русски и сохраняет лёгкий акцент на носителях яда.
- source_word: כִּדְמוּת
  choice: как
  rationale: Сравнительная конструкция передана кратко и естественно, без тяжеловесного «по подобию».
- source_word: נָחָשׁ
  choice: змея
  rationale: Общее обозначение змеи сохраняет контраст с более конкретным названием во второй строке.
- source_word: כְּמוֹ
  choice: как у
  rationale: Передаёт сравнение и позволяет естественно связать подразумеваемый яд с названием змеи.
- source_word: פֶתֶן
  choice: кобра
  rationale: Слово обозначает ядовитую змею; «кобра» — понятный современный эквивалент, тогда как традиционный «аспид» менее прозрачен.
- source_word: חֵרֵשׁ
  choice: глухая
  rationale: Речь о змее, которая не слышит; значение «немая» здесь не соответствует образу.
- source_word: יַאְטֵם
  choice: затыкает
  rationale: Передаёт конкретный образ закрывания или закупоривания уха сильнее, чем нейтральное «закрывает».
- source_word: אָזְנוֹ
  choice: себе ухо
  rationale: Возвратная конструкция естественна по-русски и ясно показывает, что кобра затыкает собственное ухо.
