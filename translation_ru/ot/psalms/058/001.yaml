  source_fidelity: Основной вариант верно сохраняет масоретское понимание אֵלֶם как «безмолвия» и не устраняет намеренную трудность образа. «Правду» приемлемо передаёт צֶדֶק в данном контексте, а «справедливо судить» точно отражает מֵישָׁרִים תִּשְׁפְּטוּ. Однако во втором вопросе порядок слов «Справедливо ли судите» в современном русском звучит неполно и стилистически шероховато; явное «вы» необходимо также для параллелизма с первой строкой.
