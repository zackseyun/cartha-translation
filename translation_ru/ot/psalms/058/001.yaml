lexical_decisions:
- source_word: הַאֻמְנָם
  choice: Неужели вы и вправду
  rationale: Сочетание передаёт эмфатический риторический вопрос и обличительную иронию еврейской частицы.
- source_word: אֵלֶם
  choice: в безмолвии
  rationale: Основной текст следует масоретской огласовке, связывающей слово с молчанием или немотой. Необычный, парадоксальный образ сохранён, а существенно иное толкование вынесено в сноску.
- source_word: צֶדֶק
  choice: правду
  rationale: В сочетании с глаголом «говорить» это естественно передаёт нравственно-судебный смысл слова; буквальное «праведность» по-русски здесь звучало бы неестественно.
- source_word: תְּדַבֵּרוּן
  choice: говорите
  rationale: Прямой и естественный эквивалент глагола речи, сохраняющий форму риторического обвинения.
- source_word: מֵישָׁרִים
  choice: справедливо
  rationale: Наречное употребление выражает прямоту и беспристрастность суда; «справедливо» ясно передаёт этот судебный смысл.
- source_word: תִּשְׁפְּטוּ
  choice: судите
  rationale: Контекст имеет судебный характер, поэтому сохранён основной смысл еврейского глагола.
- source_word: בְּנֵי אָדָם
  choice: сыны человеческие
  rationale: Сохранены мужская форма и образность буквального выражения «сыны человека»; традиционно-поэтическое русское сочетание подчёркивает человеческую смертность адресатов.
theological_decisions:
- issue: Толкование трудного слова אֵלֶם
  choice: 'В основном тексте следовать масоретской огласовке: «в безмолвии»'
  alternative: Понимать как обращение «сильные» или «боги»
  rationale: Масоретский текст указывает на значение молчания или немоты, однако иное прочтение имеет давнюю историю и существенно меняет адресата и смысл строки. Поэтому оно не исключено, а открыто приведено в сноске.
