  text: The wicked are estranged from the womb; they go astray from birth[a], speaking lies.
translation:
  language: ru
  text: Нечестивые с утробы стали чужими; от рождения сбиваются с пути[a], говоря ложь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от утробы… из чрева»; поэтический параллелизм изображает нечестивых как уклонившихся с самого начала жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹרוּ
  choice: чужды Богу
  rationale: Глагол זור обозначает отчуждение, удаление. В русском языке «чужды» естественно передаёт состояние отчуждённости; добавление «Богу» проясняет подразумеваемое отношение, не сводя смысл лишь к нравственной испорченности.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Устоявшееся и понятное обозначение людей, виновных и поступающих вопреки правде; подходит возвышенному регистру псалма.
- source_word: מֵרָחֶם
  choice: ещё от утробы
  rationale: Сохраняет буквальный образ и временную предельность еврейского выражения, а также его поэтическую силу.
- source_word: תָּעוּ
  choice: сбиваются с пути
  rationale: Передаёт образ блуждания и нравственного уклонения; настоящее время естественно выражает обобщающую характеристику.
- source_word: מִבֶּטֶן
  choice: от рождения
  rationale: Контекстуально естественно передаёт «из чрева / от утробы» и избегает тяжёлого дословного повтора, при этом повтор исходного образа отмечен в сноске.
- source_word: דֹּבְרֵי כָזָב
  choice: говоря ложь
  rationale: Кратко и естественно передаёт причастную характеристику нечестивых как постоянно говорящих неправду.
- source_word: כָזָב
  choice: ложь
  rationale: Прямой современный эквивалент в контексте речи; не усиливает значение до более узкого «обман».
theological_decisions:
- issue: Следует ли понимать слова об утробе как буквальное утверждение о дородовой нравственной вине или как техническое учение о наследственном грехе
  choice: Сохранить сильный поэтический образ уклонения нечестивых с самого раннего времени, не превращая его в техническую догматическую формулу.
  alternative: Передать стих либо как прямое доказательство вины от зачатия, либо как лишённую антропологического содержания риторическую брань.
  rationale: Параллелизм «от утробы» // «от рождения» действует внутри поэтического обличения. Перевод сохраняет напряжённость образа, не разрешая сверх текста вопрос о точном догматическом объёме высказывания.
- issue: Явно ли назван тот, кому нечестивые стали чужды
  choice: Передать «чужды Богу» для ясного и естественного русского смысла.
  alternative: 'Оставить объект невыраженным: «отчуждены» или «стали чужими».'
  rationale: В еврейском объект не назван, однако контекст псалма допускает понимание отчуждения от Бога. Добавление делает русский текст осмысленным, но несколько сужает формальную неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Сохранены параллелизм, гиперболическая сила и образ уклонения с пути; тяжёлый дословный повтор «утроба / чрево» сглажен и пояснён в сноске.
