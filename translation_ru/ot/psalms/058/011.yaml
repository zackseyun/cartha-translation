  text: וְ/יֹאמַ֣ר אָ֭דָם אַךְ פְּרִ֣י לַ/צַּדִּ֑יק אַ֥ךְ יֵשׁ אֱ֝לֹהִ֗ים שֹׁפְטִ֥ים בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/011.yaml
  text: And people will say[a], “Surely there is fruit for the righteous[b]; surely there is a God who judges on the earth.”
translation:
  language: ru
  text: 'И скажет человек: «Воистину, есть плод праведнику; воистину, есть Бог, судящий на земле».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте слово «судящие» стоит во множественном числе при אֱלֹהִים. Вероятнее всего, речь идёт об одном Боге: «Бог, судящий»; возможно также буквальное прочтение: «боги, судящие». «Плод праведнику» означает результат или воздаяние, которое получает праведный.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹאמַר אָדָם
  choice: И скажет человек
  rationale: Форма имперфекта в контексте предшествующего суда естественно передаёт последующую, итоговую реакцию. Единственное число אָדָם имеет обобщённое значение; русский оборот «скажет человек» сохраняет и форму, и универсальный смысл.
- source_word: אַךְ
  choice: воистину
  rationale: В обоих случаях частица выражает уверенное подтверждение, а не ограничение. «Воистину» сохраняет торжественную риторическую силу и уместно в поэтическом регистре.
- source_word: פְּרִי לַצַּדִּיק
  choice: есть плод праведнику
  rationale: Сохранён буквальный образ плода как результата, воздаяния или награды. Дательный «праведнику» кратко воспроизводит конструкцию с לְ и естественен для возвышенной русской поэзии.
- source_word: יֵשׁ אֱלֹהִים
  choice: есть Бог
  rationale: Экзистенциальная конструкция передаёт утверждение о реальности и действии Бога. В русском неопределённый артикль не требуется, а прописная буква указывает на единого Бога.
- source_word: שֹׁפְטִים בָּאָרֶץ
  choice: судящий на земле
  rationale: Причастие передаёт продолжающееся действие суда. Единственное число следует наиболее вероятному пониманию אֱלֹהִים как обозначения единого Бога; «на земле» сохраняет широкий, всемирный охват.
theological_decisions:
- issue: Число в сочетании אֱלֹהִים שֹׁפְטִים
  choice: «Бог, судящий» — единственное число
  alternative: «боги, судящие» — множественное число
  rationale: Контекст завершает псалом признанием действительного Божьего правосудия, поэтому אֱלֹהִים наиболее вероятно обозначает единого Бога. Однако еврейское причастие имеет форму множественного числа, и эта подлинная грамматическая неоднозначность отмечена в сноске, а не устранена без оговорки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Синтаксическая краткость и повтор «воистину» сохраняют параллелизм еврейского стиха; метафора «плод» оставлена без поясняющей замены в основном тексте.
