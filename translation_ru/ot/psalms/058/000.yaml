  yaml_path: translation/ot/psalms/058/000.yaml
  text: 'For the choirmaster: “Do Not Destroy.”[a] Of David. A miktam.[b]'
translation:
  language: ru
  text: Руководителю хора. «Не погуби».[a] Давидов. Миктам.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «на мотив „Не погуби“», если эти слова точнее обозначают мелодию или музыкальное сопровождение.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово «миктам» — обозначение псалма с неясным значением; возможно, оно указывает на вид произведения или его музыкальное оформление.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Формула надписаний обращена к руководителю музыкального исполнения; этот вариант краток, естественен и сохраняет богослужебную функцию.
- source_word: אַל תַּשְׁחֵת
  choice: «Не погуби»
  rationale: В надписаниях псалмов выражение, вероятно, служит названием мелодии или музыкальной установки. Кавычки указывают на название, не исключая буквального смысла слов.
- source_word: לְדָוִד
  choice: Давидов
  rationale: Краткая традиционная форма сохраняет некоторую широту еврейского לְ, которое может обозначать авторство, принадлежность, посвящение или связь, и не утверждает категорично «написан Давидом».
- source_word: מִכְתָּם
  choice: Миктам
  rationale: Точное значение термина неизвестно; транслитерация лучше, чем предположительные переводы вроде «надпись» или «золотой псалом».
theological_decisions:
- issue: Характер выражения אַל תַּשְׁחֵת
  choice: 'Передать как вероятное название: «Не погуби»'
  alternative: 'Передать как прямое повеление: «Не погуби» без кавычек либо как «на мотив „Не погуби“»'
  rationale: Контекст надписаний поддерживает музыкальное понимание, но в еврейском тексте нет явного предлога «на мотив»; поэтому кавычки обозначают вероятное название без добавления отсутствующих слов.
- issue: Связь псалма с Давидом в לְדָוִד
  choice: Давидов
  alternative: «Давида», «для Давида» или «написанный Давидом»
  rationale: Еврейское надписание не уточняет вид связи; выбранная форма не превращает возможное авторство в однозначное утверждение.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified формой надписания. Сохранены лаконичность оригинала, вероятная музыкальная функция «Не погуби» и неопределённость термина «миктам».
