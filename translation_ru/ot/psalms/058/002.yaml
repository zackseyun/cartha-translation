lexical_decisions:
- source_word: אַף
  choice: Даже
  rationale: Передаёт усилительную частицу и подчёркивает, что неправда коренится уже во внутреннем намерении.
- source_word: בְּלֵב
  choice: в сердце
  rationale: Сохраняет локальное значение предлога и собирательное единственное число еврейского текста при обращении к нескольким лицам.
- source_word: עוֹלֹת
  choice: несправедливость
  rationale: В судебном контексте точно передаёт нравственную неправду; русское единственное число естественно употребляется как собирательное.
- source_word: תִּפְעָלוּן
  choice: вы творите
  rationale: Передаёт деятельный, намеренный характер глагола פעל и естественно сочетается со словом «несправедливость».
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: Сохраняет широкое значение אֶרֶץ и контраст между внутренним замыслом и совершаемым в мире действием; значение «в стране» также возможно.
- source_word: חֲמַס
  choice: насилие
  rationale: Прямо передаёт обычное значение слова חמס как насилия и сопряжённого с ним злодеяния.
- source_word: יְדֵיכֶם
  choice: ваши руки
  rationale: Сохранён конкретный образ рук как орудия действий.
- source_word: תְּפַלֵּסוּן
  choice: отвешивают
  rationale: 'Сохраняет образ взвешивания или отмеривания и его судебную иронию: вместо справедливости руки распределяют насилие.'
theological_decisions:
- issue: Метафорическая сила תְּפַלֵּסוּן в судебном контексте
  choice: «отвешивают» — с сохранением образа взвешивания и распределения
  alternative: «отмеряют» или более свободное «творят насилие»
  rationale: Образ весов поддерживает обращённое к неправедным судьям обвинение и не сглаживает иронию исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественной поэтической сжатостью. Параллелизм внутреннего намерения и внешнего действия сохранён; метафора рук и взвешивания не сглажена.
