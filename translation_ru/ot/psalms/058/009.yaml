  text: בְּ/טֶ֤רֶם יָבִ֣ינוּ סִּֽירֹתֵי/כֶ֣ם אָטָ֑ד כְּמוֹ חַ֥י כְּמוֹ חָ֝ר֗וֹן יִשְׂעָרֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/058/009.yaml
  text: Before your pots can feel the thornbush[a], whether green or burning, he will sweep them away.
translation:
  language: ru
  text: Прежде чем ваши котлы ощутят жар терновника[a] — свежего или уже пылающего, — он вихрем унесёт его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст труден. Буквально приблизительно: «Прежде чем ваши котлы воспримут терновник — как живой, как пылание (или гнев), — он вихрем унесёт его». Вероятно, речь о том, что котлы не успеют нагреться от тернового топлива, как всё будет внезапно унесено. Последнее «его» в еврейском тексте стоит в единственном числе; его референт неясен: это может быть терновник или отдельный нечестивец. Последние слова также понимают как «он унесёт его в гневе».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: Прежде чем
  rationale: Естественно передаёт временное предшествование и внезапность действия.
- source_word: יָבִינוּ
  choice: ощутят жар
  rationale: Обычно глагол означает «понимать, воспринимать»; при неодушевлённом подлежащем «котлы» контекстуально выражает ощущение жара. Слово «жар» добавлено для ясности образа, а буквальная трудность отмечена в сноске.
- source_word: סִּירֹתֵיכֶם
  choice: ваши котлы
  rationale: Обозначает сосуды для приготовления пищи; «котлы» сохраняет конкретный образ и звучит естественно.
- source_word: אָטָד
  choice: терновника
  rationale: Название колючего кустарника, который мог служить быстро сгорающим топливом.
- source_word: כְּמוֹ חַי כְּמוֹ חָרוֹן
  choice: свежего или пылающего
  rationale: «Живой» в отношении топлива естественно понимается как свежий, ещё зелёный; חָרוֹן может указывать на пылание, хотя обычно связано с яростью. Неоднозначность сохранена в сноске.
- source_word: יִשְׂעָרֶנּוּ
  choice: Он сметёт их вихрем
  rationale: Глагол выражает бурное, вихревое унесение. Заглавное «Он» контекстуально указывает на Бога; местоимение «их» соотнесено с котлами/людьми образа, хотя еврейский суффикс стоит в единственном числе, что отмечено в сноске.
theological_decisions:
- issue: Смысл трудного образа внезапного суда
  choice: Бог сметает нечестивых прежде, чем огонь успевает нагреть котлы, независимо от состояния топлива.
  alternative: Финальная часть может означать, что Бог унесёт его «в ярости», а חָרוֹן — именно гнев, а не пылающий терновник.
  rationale: Основной текст сохраняет конкретный образ огня и внезапного удаления, не исключая традиционного значения «ярость», которое указано в сноске.
- issue: Референт местоименного суффикса в יִשְׂעָרֶנּוּ
  choice: Передать по смыслу множественным «их», соотнося с котлами и через образ — с нечестивыми.
  alternative: 'Буквально: «сметёт его»; возможные референты — терновник или нечестивый.'
  rationale: Синтаксис еврейского текста неясен. Русское «их» делает образ связным, но сноска сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с конкретным и выразительным поэтическим образом. «Ощутят жар» слегка проясняет эллиптичный оригинал; сноска открыто фиксирует буквальную форму, возможное значение «ярость» и неопределённость местоимения.
