  yaml_path: translation/ot/psalms/062/011.yaml
  text: 'One thing God has spoken[a]; two things I have heard: that strength belongs to God.'
translation:
  language: ru
  text: 'Однажды Бог сказал[a]; дважды я слышал это: сила принадлежит Богу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог сказал одно, а я услышал два». Еврейское выражение можно понимать либо наречно («однажды… дважды»), либо как числовую формулу («одно… два»); в последнем случае подразумеваемое существительное в тексте не названо.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַת
  choice: однажды
  rationale: Женская форма числительного «один» в паре со שְׁתַּיִם допускает наречное понимание «однажды… дважды»; оно естественно сочетается с указательным זוּ («это») и не требует добавлять отсутствующее в еврейском тексте слово «вещь».
- source_word: דִּבֶּר
  choice: сказал
  rationale: Перфект обозначает завершённое речевое действие; в русском поэтическом повествовании естественна форма прошедшего времени.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма имеет здесь единственное значение и обозначает Бога Израиля.
- source_word: שְׁתַּיִם
  choice: дважды
  rationale: В симметричной конструкции с אַחַת числительное можно понять наречно; «дважды» сохраняет краткость и риторический параллелизм оригинала.
- source_word: זוּ
  choice: это
  rationale: Указательная форма отсылает к последующему содержанию услышанного; прямое русское соответствие — «это».
- source_word: שָׁמָעְתִּי
  choice: я слышал
  rationale: Перфект передан естественным русским прошедшим временем; порядок слов сохраняет поэтический акцент.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание услышанного.
- source_word: עֹז
  choice: сила
  rationale: Существительное обозначает силу или могущество; «сила» — ясное и лексически точное соответствие.
- source_word: לֵאלֹהִים
  choice: принадлежит Богу
  rationale: Предлог לְ выражает принадлежность или отнесённость; развёрнутая формулировка естественна по-русски и сохраняет смысл.
theological_decisions:
- issue: Числовая формула «одно — два»
  choice: «Однажды сказал Бог, дважды я слышал это»
  alternative: «Одно сказал Бог, два услышал я» / «Одно изрёк Бог; две вещи я услышал»
  rationale: Еврейская конструкция допускает как наречное понимание («однажды/дважды»), так и формулу числового изречения («одно/два»). Основной текст выбирает грамматически естественное для русского наречное прочтение, а примечание сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с кратким, торжественным поэтическим строем. Инверсия «сказал Бог» и «сила принадлежит Богу» сохраняет достоинство и смысловую выделенность без архаизмов.
