  text: אַ֤ךְ מִ/שְּׂאֵת֨/וֹ יָעֲצ֣וּ לְ/הַדִּיחַ֮ יִרְצ֪וּ כָ֫זָ֥ב בְּ/פִ֥י/ו יְבָרֵ֑כוּ וּ֝/בְ/קִרְבָּ֗/ם יְקַלְלוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/004.yaml
  text: They only plan to cast him down from his high position[a]; they delight in falsehood. With their mouth they bless, but inwardly they curse[b]. Selah
translation:
  language: ru
  text: Только о том они и замышляют, как лишить его высокого положения[a]; ложь им по душе. Устами они благословляют, а внутри проклинают[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишить его достоинства», «низвергнуть его с возвышения» или «лишить его почётного положения».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально в еврейском тексте: «его устами они благословляют». Вероятно, речь идёт об их внешней речи: устами они благословляют, а внутри проклинают.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Только о том они и
  rationale: Частица ограничивает направленность замыслов врагов; оборот естественно передаёт значение их единственной цели.
- source_word: מִשְּׂאֵתוֹ
  choice: с высоты
  rationale: שְׂאֵת обозначает возвышение, высокое положение или достоинство. «С высоты» сохраняет образ возвышенности, не уточняя без достаточных оснований, идёт ли речь о положении или почёте.
- source_word: יָעֲצוּ לְהַדִּיחַ
  choice: замышляют, как низвергнуть
  rationale: יָעֲצוּ выражает обдумывание или враждебный замысел, а Hiphil נדח — принудительное низвержение либо удаление. Выбранная формулировка передаёт и намерение, и образ падения с высоты.
- source_word: יִרְצוּ כָזָב
  choice: ложь им по душе
  rationale: רצה с כזב означает находить удовольствие в неправде или одобрять её. Современный русский оборот передаёт положительное расположение к лжи.
- source_word: בְּפִיו יְבָרֵכוּ
  choice: Устами они благословляют
  rationale: Форма буквально содержит местоименный суффикс единственного числа («его устами»), однако параллелизм и коллективный субъект указывают на внешнюю речь врагов. Основной текст передаёт вероятный смысл, а формальная особенность отмечена в сноске.
- source_word: וּבְקִרְבָּם
  choice: а в душе
  rationale: Буквально «внутри них»; в контексте речь об их внутреннем расположении. «В душе» естественно противопоставлено внешней речи.
- source_word: יְקַלְלוּ
  choice: проклинают
  rationale: Сохраняет прямую антитезу глаголу «благословляют».
- source_word: סֶלָה
  choice: Села
  rationale: Значение литургического или музыкального термина остаётся неясным, поэтому он передан традиционной транслитерацией.
theological_decisions:
- issue: К кому относится местоименный суффикс в выражении «с его высоты» и подразумеваемое дополнение при «низвергнуть»
  choice: Враги стремятся низвергнуть одного мужчину — псалмопевца или названного в контексте праведника — с его возвышенного положения.
  alternative: Можно было бы передать обобщённо («низвергнуть человека») либо понимать שְׂאֵת прежде всего как достоинство или честь.
  rationale: Еврейский текст использует суффикс мужского рода единственного числа. Перевод «его» сохраняет личного адресата, не отождествляя его с каким-либо более специальным богословским референтом.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Низвергнуть» сохраняет возвышенный образ исходного текста, а «ложь им по душе» и «в душе» делают синтаксис ясным для широкого читателя. Все сноски отмечены в основном тексте.
