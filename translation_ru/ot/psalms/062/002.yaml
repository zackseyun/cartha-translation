lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: В контексте псалма частица подчёркивает исключительность Бога как единственного источника опоры; «только» естественно передаёт эту функцию перед местоимением «Он».
- source_word: הוּא
  choice: Он
  rationale: Местоимение третьего лица мужского рода относится к Богу; прописная буква соответствует принятому благоговейному русскому оформлению.
- source_word: צוּרִי
  choice: моя скала
  rationale: Сохраняет конкретный образ твёрдости, устойчивости и защиты, характерный для צוּר в отношении Бога.
- source_word: וִישׁוּעָתִי
  choice: моё спасение
  rationale: Передаёт широкий смысл избавления и спасения и естественно звучит в данном поэтическом контексте.
- source_word: מִשְׂגַּבִּי
  choice: моя крепость
  rationale: מִשְׂגָּב обозначает безопасное, укреплённое возвышенное место; «крепость» сохраняет образ надёжной защиты и понятно современному читателю.
- source_word: לֹא אֶמּוֹט
  choice: не поколеблюсь
  rationale: Глагол в нифале выражает утрату устойчивости, шатание; «не поколеблюсь» сохраняет метафору и звучит естественно в литературном русском.
- source_word: רַבָּה
  choice: сильно
  rationale: Форма употреблена наречно и указывает на степень колебания. «Сильно» явно сохраняет этот модификатор, не превращая высказывание в абсолютное.
theological_decisions:
- issue: Степень уверенности в заключительной строке
  choice: не поколеблюсь сильно
  alternative: не поколеблюсь
  rationale: В еврейском тексте присутствует רַבָּה, модификатор степени. Его сохранение не позволяет молча гармонизировать строку с более абсолютной параллельной формулировкой далее в псалме.
translation_notes:
  register: Современный литературный русский с сохранением лаконичного параллелизма и традиционных библейских образов. Порядок «Только Он» передаёт начальное акцентное אַךְ הוּא; тире делает именную конструкцию естественной по-русски.
