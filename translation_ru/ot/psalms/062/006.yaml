  text: אַךְ ה֣וּא צ֭וּרִ/י וִֽ/ישׁוּעָתִ֑/י מִ֝שְׂגַּבִּ֗/י לֹ֣א אֶמּֽוֹט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/006.yaml
  text: He alone is my rock and my salvation[a], my stronghold; I will not be shaken.
translation:
  language: ru
  text: Только Он — моя скала и моё спасение, моя крепость; я не поколеблюсь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «меня не поколеблют»; также возможно: «я не сдвинусь».'
    reason: 'Лексическая вариантность еврейского глагола מוֹט в форме нифаль: он может обозначать утрату устойчивости, колебание или смещение.'
lexical_decisions:
- source_word: אַךְ הוּא
  choice: Только Он
  rationale: 'Сочетание выражает исключительность с усилением: Бог один является основанием безопасности псалмопевца. Такой порядок слов естественен по-русски и сохраняет акцент еврейского текста.'
- source_word: צוּרִי
  choice: моя скала
  rationale: Сохраняет поэтический образ твёрдости, устойчивости и защиты; «скала» естественнее и точнее в данном контексте, чем буквальное пространственное «утёс».
- source_word: וִישׁוּעָתִי
  choice: моё спасение
  rationale: Передаёт широкий смысл избавления и безопасности, не сужая его до спасения лишь от одной конкретной опасности.
- source_word: מִשְׂגַּבִּי
  choice: моя крепость
  rationale: Передаёт образ высокого, укреплённого и безопасного места. В современном русском «крепость» звучит естественно и сохраняет защитную образность.
- source_word: לֹא אֶמּוֹט
  choice: я не поколеблюсь
  rationale: Форма глагола מוֹט выражает уверенность в том, что говорящий не будет сдвинут, расшатан или лишён устойчивости. «Не поколеблюсь» сохраняет как физическую метафору, так и смысл внутренней стойкости.
theological_decisions:
- issue: Степень уверенности в заключительной фразе
  choice: я не поколеблюсь
  alternative: меня не поколеблют / я не сдвинусь
  rationale: Перевод сохраняет уверенное упование на Бога как источник устойчивости, но не превращает высказывание в отвлечённое учение об абсолютной неуязвимости.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного параллелизма и защитно-пространственных метафор еврейской поэзии. Местоимение «Он» написано с прописной буквы как ясная отсылка к Богу в данном контексте.
