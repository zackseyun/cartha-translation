  yaml_path: translation/ot/psalms/062/003.yaml
  text: How long will you assail a man? Will you all break him down[a], like a leaning wall[c][b], a tottering fence?
translation:
  language: ru
  text: 'Доколе вы будете нападать на человека,

    все вместе сокрушать его[a],

    словно накренившуюся стену,

    пошатнувшуюся ограду?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убивать его». Глагол обычно обозначает убийство, но здесь может быть употреблён метафорически в связи с последующим образом разрушаемой стены и ограды.'
    reason: lexical_alternative
  - marker: b
    text: 'Образы стены и ограды могут описывать человека, которого нападающие стремятся окончательно сокрушить. Возможно и другое понимание: они относятся к самим нападающим, всей массой обрушивающимся на него.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהֽוֹתְת֣וּ
  choice: нападать
  rationale: Редкий глагол обозначает враждебное, насильственное нападение. «Нападать» ясно передаёт основное действие, не уточняя без достаточных оснований его способ или повторность.
- source_word: עַל אִישׁ
  choice: на человека
  rationale: אִישׁ здесь обозначает одного конкретного человека как объект совместного нападения; русское «человек» сохраняет единственное число и естественно звучит в контексте.
- source_word: תְּרָצְּחוּ
  choice: сокрушать его
  rationale: Обычное значение корня связано с убийством, однако образ стены и ограды позволяет понять глагол метафорически — как разрушение или сокрушение человека. Основной текст сохраняет цельность образа, а прямое значение отмечено в сноске.
- source_word: כֻלְּכֶם
  choice: все вместе
  rationale: Так передана эмфатическая совокупность нападающих и сохранена естественная русская поэтическая речь.
- source_word: כְּקִיר נָטוּי
  choice: словно накренившуюся стену
  rationale: נָטוּי описывает стену, отклонившуюся от вертикали и близкую к падению; «накренившуюся» сохраняет наглядность и не добавляет самого факта обрушения.
- source_word: גָּדֵר הַדְּחוּיָה
  choice: пошатнувшуюся ограду
  rationale: Форма от דחה рисует ограду, сдвинутую или оттеснённую со своего положения. «Пошатнувшуюся» естественно передаёт её неустойчивость, не сводя образ к одному конкретному физическому движению.
