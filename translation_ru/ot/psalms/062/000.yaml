lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов слово обозначает человека, руководящего музыкальным исполнением; этот перевод ясен современному читателю и соответствует литургическому контексту.
- source_word: עַל
  choice: По
  rationale: 'Краткая формула «по Идифуну» сохраняет неопределённость еврейского выражения: оно может указывать на напев, стиль или способ исполнения, связанный с Идифуном.'
- source_word: יְדוּתוּן
  choice: Идифун
  rationale: Традиционная русская передача личного имени; здесь может подразумеваться сам левитский музыкант либо связанный с ним напев или исполнительская традиция.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Обычное жанровое обозначение מִזְמוֹר в надписаниях, не вносящее лишней конкретизации.
- source_word: לְדָוִד
  choice: Давида
  rationale: Формула «Псалом Давида» естественна по-русски и оставляет возможными авторство, посвящение или более широкую связь с Давидом, что дополнительно поясняется в сноске.
theological_decisions:
- issue: Значение לְדָוִד в надписании
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида
  rationale: Еврейская конструкция сама по себе не требует выбирать между авторством, посвящением и иной связью с Давидом; традиционная формула вместе со сноской сохраняет эту неоднозначность.
