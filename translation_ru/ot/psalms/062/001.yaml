lexical_decisions:
- source_word: אַךְ
  choice: Только
  rationale: Передаёт ограничительное значение частицы и исключительную обращённость души к Богу, сохраняя поэтическую краткость.
- source_word: אֶל
  choice: к
  rationale: 'Предлог обозначает направленность: внутреннее безмолвие души обращено к Богу. Русское «к Богу» естественно сохраняет эту пространственно-образную ориентацию.'
- source_word: אֱלֹהִים
  choice: Богу
  rationale: В данном контексте обозначает Бога Израиля; дательный падеж обусловлен предлогом «к».
- source_word: דּוּמִיָּה
  choice: безмолвна
  rationale: Существительное выражает безмолвие, тишину или покой. Предикативное «безмолвна» сохраняет основной образ и звучит естественно в возвышенной русской поэзии.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Сохраняет поэтический и традиционный смысл внутреннего человеческого существа; порядок слов соответствует dignified русскому библейскому регистру без архаизации.
- source_word: מִמֶּנּוּ
  choice: от Него
  rationale: Прямо передаёт источник спасения. Исключительность уже выражена словом «только», поэтому добавление «одного» не требуется.
- source_word: יְשׁוּעָתִי
  choice: спасение моё
  rationale: Передаёт как богословское значение спасения, так и конкретный оттенок избавления; инверсия поддерживает поэтический ритм.
theological_decisions:
- issue: Смысл сочетания דּוּמִיָּה נַפְשִׁי
  choice: Безмолвная, доверчивая обращённость души к Богу
  alternative: Душа молча ожидает Бога; душа находит покой в Боге
  rationale: Еврейское существительное допускает значения безмолвия, тишины, спокойного ожидания и покоя. Основной текст сохраняет непосредственный образ безмолвия, не сводя его однозначно ни к ожиданию, ни к отдыху.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «душа моя» и «спасение моё» сохраняет достоинство псалма, оставаясь понятной современному читателю. Местоимение о Боге написано с прописной буквы согласно принятой русской библейской издательской норме.
