base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/001.yaml
  text: Only for God is my soul silent[b][a]; from him comes my salvation.
translation:
  language: ru
  text: Лишь перед Богом безмолвна душа моя[a]; от Него — спасение моё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Только Бога в безмолвии ожидает душа моя»; или: «Только в Боге покоится душа моя».'
