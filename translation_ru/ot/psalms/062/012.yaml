  text: И Тебе, Господи, принадлежит неизменная любовь, ибо Ты воздаёшь каждому по его делам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְךָ
  choice: И Тебе ... принадлежит
  rationale: Вынесенное вперёд предложное сочетание выражает принадлежность и подчёркивает, что названное качество принадлежит Богу; в русском безглагольное еврейское предложение естественно передаётся с глаголом «принадлежит».
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Это божественный титул Адонай. «Владыка» сохраняет значение господства и естественно звучит как обращение в возвышенной поэтической речи.
- source_word: חָסֶד
  choice: верная любовь
  rationale: Сочетание передаёт любовь, милость и неизменную преданность, заключённые в חֶסֶד, не сводя слово только к милосердию или только к заветной обязанности.
- source_word: כִּי
  choice: ведь
  rationale: Здесь союз вводит основание или пояснение предыдущего утверждения; «ведь» естественно связывает две части русского поэтического высказывания.
- source_word: תְשַׁלֵּם
  choice: воздаёшь
  rationale: Форма от שׁלם означает дать человеку то, что ему причитается. «Воздаёшь» допускает как благоприятное, так и неблагоприятное воздаяние и не ограничивает смысл одной наградой.
- source_word: לְאִישׁ
  choice: каждому
  rationale: Еврейское אִישׁ в данном обобщающем контексте имеет распределительный смысл. «Каждому» точно и естественно выражает охват всякого человека без тяжеловесного «каждому человеку».
- source_word: כְּמַעֲשֵׂהוּ
  choice: по его делам
  rationale: Русское устойчивое выражение «воздать каждому по его делам» точно передаёт соответствие воздаяния содеянному. Хотя в еврейском стоит единственное число «по его делу», русское множественное число здесь естественно обозначает совокупность поступков.
theological_decisions:
- issue: Соотношение Божьей верной любви и воздаяния по делам
  choice: 'Сохранить рядом оба утверждения: Богу принадлежит верная любовь, и Он воздаёт каждому по его делам.'
  alternative: Сузить חֶסֶד до милосердия либо истолковать תְשַׁלֵּם только как положительную награду.
  rationale: Еврейский текст соединяет верную любовь Бога с Его справедливым воздаянием. Перевод не должен устранять это богословское напряжение или заранее определять воздаяние как исключительно положительное.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Прописные местоимения в обращении к Богу следуют распространённой русской религиозно-литературной норме. Формула «воздаёшь каждому по его делам» ясна современному читателю и сохраняет традиционную торжественность без архаизмов.
