  text: Лишь к Богу[a] будь безмолвна[b], душа моя[c], ибо от Него — надежда моя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также перевод: «Лишь для Бога»; предлог передаёт направленность к Богу.'
