    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: только
  rationale: Частица выражает исключительность и подчёркивает, что душа обращена к одному Богу; это соответствует повторяющемуся мотиву псалма.
- source_word: לֵאלֹהִים
  choice: пред Богом
  rationale: Так естественно по-русски передаётся направленность к Богу при призыве хранить безмолвие; буквальное «для Бога» могло бы ошибочно означать действие ради Его пользы.
- source_word: דּוֹמִּי
  choice: будь безмолвна
  rationale: Форма от דמם понята как обращённое к душе повеление женского рода. Перевод сохраняет основное значение молчания и покоя, не вводя прямо отсутствующий в глаголе смысл «ожидать».
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Сохранено характерное для Псалтири обращение человека к самому себе; по-русски оно понятно и стилистически уместно.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для призыва и естественно связывает обе части русской фразы.
- source_word: מִמֶּנּוּ
  choice: от Него
  rationale: Местоимение отсылает к Богу; исключительность не переносится сюда искусственно, поскольку в еврейском она выражена частицей אַךְ в начале стиха.
- source_word: תִּקְוָתִי
  choice: моя надежда
  rationale: תִּקְוָה обычно означает надежду или ожидание; «моя надежда» — ясный и естественный русский эквивалент.
theological_decisions:
- issue: Понимать ли דּוֹמִּי как призыв к душе или как описание её состояния
  choice: 'Призыв: «будь безмолвна, душа моя»'
  alternative: 'Утверждение: «лишь Бога безмолвно ожидает душа моя»'
  rationale: Масоретская огласовка естественно допускает повелительную форму женского рода, согласованную с נֶפֶשׁ. При этом в примечании сохранено традиционное альтернативное понимание как описательного утверждения.
- issue: Передавать ли в основном тексте подразумеваемое ожидание
  choice: Сохранить прямое значение «будь безмолвна»
  alternative: «Безмолвно ожидай»
  rationale: Контекст связывает безмолвие с упованием, однако сам глагол прежде всего обозначает молчание или неподвижный покой. Расширенное значение отмечено в сноске, а не внесено безоговорочно в текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Инверсия «душа моя» и оборот «пред Богом» сохраняют достоинство поэтической речи, оставаясь понятными современному читателю.
