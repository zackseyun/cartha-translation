  yaml_path: translation/ot/psalms/062/008.yaml
  text: Trust in him at all times[a], O people; pour out your hearts before him. God is a refuge for us[d][c][b]. Selah
translation:
  language: ru
  text: Во всякое время доверяйте Ему, народ! Изливайте перед Ним свои сердца. Бог — наше прибежище. Села.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Села» — вероятно, литургический или музыкальный термин; его точное значение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: בִּטְחוּ בּוֹ
  choice: доверяйте Ему
  rationale: Глагол בטח в повелительном наклонении выражает доверие и уверенность; местоимение мужского рода в контексте относится к Богу.
- source_word: בְכָל־עֵת
  choice: во всякое время
  rationale: Близко передаёт буквальное «во всякое время» и естественно выражает постоянство призыва.
- source_word: עָם
  choice: народ
  rationale: Существительное употреблено как прямое обращение к общине; обращение передано без добавления междометия «о», необязательного в современном русском.
- source_word: שִׁפְכוּ ... לְבַבְכֶם
  choice: изливайте ... ваши сердца
  rationale: Сохранены образ «изливать сердце» и множественное число суффикса, относящегося ко всей общине.
- source_word: לְפָנָיו
  choice: пред Ним
  rationale: Передаёт буквальный пространственно-реляционный образ «перед Ним, в Его присутствии» в возвышенном, но понятном регистре.
- source_word: מַחֲסֶה לָנוּ
  choice: наше прибежище
  rationale: מַחֲסֶה обозначает место защиты и укрытия; притяжательная конструкция естественно передаёт значение «прибежище для нас».
- source_word: סֶלָה
  choice: Села
  rationale: Термин транслитерирован, поскольку его точное литургическое или музыкальное значение неизвестно.
theological_decisions:
- issue: К кому обращено עָם
  choice: Призыв обращён к народу как к единой общине.
  alternative: Понять слово обобщённо как «люди» или передать как «нация».
  rationale: Положение после формы множественного числа повелительного наклонения естественно указывает на звательное употребление; «народ» сохраняет общинный смысл, не сужая его до политической нации.
- issue: Значение סֶלָה
  choice: Сохранить как «Села» без перевода.
  alternative: Передать как «пауза» или «музыкальная интерлюдия».
  rationale: Точное значение термина остаётся спорным; транслитерация сохраняет неопределённость исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической интонацией. Сохранены прямое обращение, параллелизм и метафора излияния сердец; архаичные формы сведены к понятному поэтическому «пред Ним».
