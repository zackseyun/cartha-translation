  text: On God rest my salvation and my glory[a]; the rock of my strength, my refuge[b], is in God.
translation:
  language: ru
  text: На Боге держатся моё спасение и моя слава[a]; в Боге — скала моей силы, моё прибежище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моя честь»; речь может идти о достоинстве псалмопевца или об оправдании его доброго имени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: На
  rationale: 'Предлог сохраняет образ опоры и зависимости: спасение и слава псалмопевца основаны на Боге.'
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Обычный русский эквивалент, когда אֱלֹהִים обозначает Бога Израиля.
- source_word: יִשְׁעִי
  choice: моё спасение
  rationale: Передаёт избавление во всей широте смысла и естественно звучит в псалме.
- source_word: וּכְבוֹדִי
  choice: и моя слава
  rationale: Сохраняет основной образ כבוד и допускает заложенный в контексте оттенок чести, достоинства или оправдания доброго имени.
- source_word: צוּר
  choice: скала
  rationale: Сохраняет распространённую метафору устойчивости, надёжности и защиты.
- source_word: עֻזִּי
  choice: моей силы
  rationale: Прямо передаёт значение עֹז, не подменяя его более конкретным образом крепости.
- source_word: מַחְסִי
  choice: моё прибежище
  rationale: Естественное для русской псалмовой речи обозначение места защиты и укрытия.
- source_word: בֵּאלֹהִים
  choice: в Боге
  rationale: Передаёт местонахождение и основание прибежища; связка в русском поэтическом предложении выражена тире.
theological_decisions:
- issue: Связь начального предложного оборота с безглагольной частью стиха
  choice: Сохранить формулу «На Боге — моё спасение и моя слава», выражающую зависимость и опору без добавления смыслового глагола.
  alternative: «От Бога моё спасение и моя слава» или «На Боге покоятся моё спасение и моя слава».
  rationale: Еврейский текст безглагольный и допускает несколько способов раскрыть отношение עַל. Буквально-естественная русская конструкция сохраняет напряжение образа и не уточняет его как происхождение («от») либо покой («покоятся»).
- issue: Значение כבוד в выражении «моя слава»
  choice: Оставить «моя слава» в основном тексте и отметить возможный смысл чести или достоинства в сноске.
  alternative: «Моя честь» или «моё достоинство».
  rationale: כבוד имеет диапазон значений «слава, честь, достоинство». Выбор «слава» сохраняет поэтическую и богословскую широту, а сноска предотвращает неоправданное сужение смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Синтаксический параллелизм и безглагольность оригинала сохранены посредством тире; архаизмы не используются.
