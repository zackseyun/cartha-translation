lexical_decisions:
- source_word: תִּבְטְחוּ
  choice: надейтесь
  rationale: Глагол בטח означает доверять, полагаться. В данном предостережении естественное русское «не надейтесь на» ясно выражает запрет искать опору в несправедливом средстве.
- source_word: בְעֹשֶׁק
  choice: на угнетение
  rationale: עֹשֶׁק обозначает угнетение, притеснение и эксплуатацию; «угнетение» сохраняет широкий нравственный смысл, не сужая его до вымогательства.
- source_word: בְגָזֵל
  choice: грабежом
  rationale: גָזֵל — грабёж или добыча, захваченная силой. Творительный падеж обусловлен естественной русской конструкцией «обольщаться чем».
- source_word: תֶּהְבָּלוּ
  choice: не обольщайтесь
  rationale: Редкий глагол от הבל связан с пустотой и тщетой; в контексте «не обольщайтесь» передаёт напрасное упование на грабёж, не устраняя лексическую неоднозначность, отмеченную в сноске.
- source_word: חַיִל
  choice: богатство
  rationale: Хотя חַיִל может означать силу, состояние или ресурсы, сочетание с יָנוּב указывает здесь на возрастающее материальное достояние.
- source_word: כִּי יָנוּב
  choice: если богатство умножается
  rationale: נוב буквально описывает произрастание или прирост; условное «если… умножается» естественно передаёт образ увеличения состояния и допустимый условный оттенок כִּי.
- source_word: תָּשִׁיתוּ לֵב
  choice: не привязывайтесь к нему сердцем
  rationale: Идиома שׁית לב означает направить или обратить сердце на что-либо. Русская формулировка сохраняет образ сердца и выражает внутреннюю привязанность без излишне буквального оборота.
theological_decisions:
- issue: Смысл предостережения в средней строке
  choice: Запрет обольщаться грабежом как пустой и ненадёжной опорой
  alternative: «Не суетитесь из-за грабежа» или «не хвалитесь грабежом»
  rationale: Форма תֶּהְבָּלוּ трудна и допускает оттенки тщетности, пустого упования или похвальбы. Основной текст даёт естественный контекстуальный смысл, а сноска сохраняет реальные альтернативы; последняя часть распространяет предостережение и на богатство вообще.
translation_notes:
  register: Современный литературный русский язык; повелительные формы во множественном числе сохраняют обращение оригинала. Тон краткий и наставительный. Параллелизм трёх предостережений передан без конфессиональных уточнений.
