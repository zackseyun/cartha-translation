base_translation:
  language: en
  yaml_path: translation/ot/psalms/062/009.yaml
  text: Surely the sons of man are a breath; the sons of men are a lie[a]. In the balances they go up; together they are lighter than a breath.
translation:
  language: ru
  text: 'Поистине, люди — лишь дуновение,

    мужи — ложь[a].


    На весах они поднимаются:

    все вместе они легче дуновения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также толкование: «люди низкого положения» и «люди высокого положения». Буквально в еврейском тексте стоят два разных выражения: «сыны человека» и «сыны мужа».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Поистине
  rationale: Передаёт усилительно-утвердительную функцию частицы в контексте псалма естественным для возвышенной современной речи способом.
- source_word: הֶבֶל
  choice: дуновение
  rationale: Сохраняет конкретный образ чего-то мимолётного и невесомого; повтор слова передан и во второй половине стиха.
- source_word: בְּנֵי אָדָם
  choice: сыны человеческие
  rationale: Сохраняет образное еврейское выражение и его отличие от параллельного בְּנֵי אִישׁ, не превращая возможный социальный контраст в однозначное утверждение.
- source_word: כָּזָב
  choice: обман
  rationale: Передаёт не только фактическую ложь, но и ненадёжность, обманчивость людей в данном поэтическом сопоставлении.
- source_word: בְּנֵי אִישׁ
  choice: сыны мужей
  rationale: Формально сохраняет отличие אִישׁ от אָדָם и поэтическую параллель, оставляя возможное указание на общественное положение в примечании.
- source_word: בְּמֹאזְנַיִם
  choice: на весах
  rationale: Это естественное современное русское выражение для образа взвешивания.
- source_word: לַעֲלוֹת
  choice: поднимаются
  rationale: Сохраняет буквальный образ чаши весов, которая поднимается из-за отсутствия веса, вместо пояснительного «оказываются лёгкими».
- source_word: מֵהֶבֶל
  choice: легче дуновения
  rationale: Сравнительное значение предлога раскрывается в соответствии с образом весов, а повтор הֶבֶל сохраняется.
- source_word: יָחַד
  choice: все вместе
  rationale: Передаёт совокупность обеих названных групп и усиливает всеобщность оценки.
theological_decisions:
- issue: Передача пары בְּנֵי אָדָם / בְּנֵי אִישׁ
  choice: Сохранить различие как «сыны человеческие» / «сыны мужей».
  alternative: «люди низкого положения» / «люди высокого положения» либо «простолюдины» / «знатные»
  rationale: Социальное противопоставление возможно, однако сам еврейский текст использует два близких выражения со словами אָדָם и אִישׁ и не называет общественные сословия прямо. Основной текст сохраняет эту неоднозначность, а толковательная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической интонацией. Формы «сыны человеческие» и «сыны мужей» намеренно сохраняют образность и лексическое различие оригинала; более разговорное перефразирование устранено ради сохранения неоднозначности.
