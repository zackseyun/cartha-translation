  text: ר֣וּמָ/ה עַל שָׁמַ֣יִם אֱלֹהִ֑ים עַ֖ל כָּל הָ/אָ֣רֶץ כְּבוֹדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/011.yaml
  text: Be exalted above the heavens[a], O God; let your glory be above all the earth.
translation:
  language: ru
  text: Возвысься над небесами, Боже; да будет слава Твоя над всей землёй.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слава Твоя — над всей землёй». Во второй строке еврейского текста нет явно выраженного глагола, поэтому её можно понимать и как пожелание, и как утверждение.'
    reason: alternative_reading
lexical_decisions:
- source_word: ר֣וּמָה
  choice: Возвысься
  rationale: Форма от רום обращена к Богу и выражает призыв или моление. «Возвысься» сохраняет образ высоты и естественно звучит в русском поэтическом обращении, не сводя смысл лишь к пространственному движению.
- source_word: עַל
  choice: над
  rationale: В обеих строках предлог передаёт положение выше и оттенок превосходства; «над» сохраняет пространственный образ и параллелизм.
- source_word: שָׁמַיִם
  choice: небесами
  rationale: Русское множественное число соответствует еврейской форме и поддерживает возвышенный, но понятный регистр.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Звательная форма естественно передаёт прямое обращение к Богу.
- source_word: כָּל הָאָרֶץ
  choice: всей землёй
  rationale: В космическом параллелизме с небесами הָאָרֶץ означает землю как весь земной мир, а не отдельную страну.
- source_word: כְּבוֹדֶךָ
  choice: слава Твоя
  rationale: «Слава» традиционно и прозрачно передаёт כבוד применительно к Богу — Его явленное величие и честь; постпозиция местоимения сохраняет достоинство поэтической речи.
theological_decisions:
- issue: Во второй строке еврейского текста отсутствует явно выраженный глагол
  choice: да будет слава Твоя над всей землёй
  alternative: слава Твоя — над всей землёй
  rationale: «Да будет» продолжает молитвенно-пожелательную силу первой строки и сохраняет параллелизм. Поскольку безглагольная еврейская строка допускает также утверждение о уже существующей славе Бога, эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Синтаксис краток и сохраняет двухчастный параллелизм еврейского стиха.
