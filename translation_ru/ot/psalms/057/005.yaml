lexical_decisions:
- source_word: ר֣וּמָה
  choice: Будь превознесён
  rationale: Форма от רום выражает призыв к возвышению или прославлению Бога. «Будь превознесён» сохраняет результативно-пассивный оттенок и не сводит образ к физическому восхождению.
- source_word: עַל הַשָּׁמַיִם
  choice: выше небес
  rationale: Предлог עַל здесь передаёт высоту и превосходство; «выше небес» естественно звучит по-русски и сохраняет пространственный образ еврейской поэзии.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Контекст требует звательной формы прямого обращения; «Боже» соответствует современному литературному и молитвенному русскому языку.
- source_word: עַל כָּל הָאָרֶץ
  choice: над всей землёй
  rationale: Сочетание передаёт всеобщий охват и одновременно образ возвышенности; «над всей землёй» сохраняет параллелизм с первой строкой.
- source_word: כְּבוֹדֶךָ
  choice: слава твоя
  rationale: כבוד применительно к Богу обозначает явленное величие и славу; «слава» — точный, понятный и устойчивый русский эквивалент.
theological_decisions:
- issue: Понимать ли вторую строку без выраженного глагола как молитвенное пожелание или как утверждение
  choice: да будет слава твоя над всей землёй
  alternative: слава твоя — над всей землёй
  rationale: Параллелизм с повелительной формой первой строки позволяет понимать вторую как пожелание или молитву, однако отсутствие глагола в еврейском тексте допускает и декларативное прочтение. Основной текст передаёт наиболее естественную в контексте молитвенную связь, а примечание сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с dignified молитвенно-поэтическим звучанием. Синтаксис сохраняет параллелизм двух полустиший; местоимение «твоя» написано со строчной буквы согласно нейтральной современной издательской практике.
