source:
  edition: WLC
  text: כִּֽי גָדֹ֣ל עַד שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/010.yaml
  text: For your steadfast love is great to the heavens[b][a], and your faithfulness to the clouds.
translation:
  language: ru
  text: Ибо до небес велика Твоя неизменная любовь[a], и до облаков — Твоя верность[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милость».'
    reason: Лексема חֶסֶד включает оттенки милости, преданной любви и неизменной благосклонности.
  - marker: b
    text: 'Или: «истина».'
    reason: Лексема אֱמֶת может обозначать как верность и надёжность, так и истину.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт причинное значение союза и естественно связывает стих с предшествующей хвалой, сохраняя возвышенный поэтический строй.
- source_word: גָדֹל
  choice: велика
  rationale: Прямо передаёт величие и необъятность названного Божьего качества; форма согласована с существительным «любовь».
- source_word: עַד שָׁמַיִם
  choice: до небес
  rationale: Сохраняет пространственный образ предела или протяжённости и параллелизм с выражением «до облаков».
- source_word: חַסְדֶּךָ
  choice: Твоя неизменная любовь
  rationale: חֶסֶד обозначает любовь, проявляющуюся в постоянстве, милости и верности отношениям. «Неизменная любовь» понятно передаёт сочетание любви и надёжности, не сужая смысл до одного лишь чувства или отдельного акта милосердия.
- source_word: וְעַד שְׁחָקִים
  choice: и до облаков
  rationale: Повтор предлога сохранён ради смыслового и ритмического параллелизма; שְׁחָקִים здесь естественно обозначает облака или заоблачные высоты.
- source_word: אֲמִתֶּךָ
  choice: Твоя верность
  rationale: В параллели с חֶסֶד слово אֱמֶת подчёркивает надёжность и постоянство Бога. Возможное значение «истина» отмечено в сноске.
theological_decisions:
- issue: Передача парных характеристик Бога חֶסֶד и אֱמֶת
  choice: «неизменная любовь» и «верность»
  alternative: «милость» и «истина»
  rationale: Выбранная пара передаёт не отвлечённые понятия, а устойчивость Божьей любви и Его надёжность. При этом сноски сохраняют традиционные и лексически возможные варианты, не устраняя многозначность еврейских слов.
- issue: Образ пространственной протяжённости Божьих качеств
  choice: «до небес… до облаков»
  alternative: «простирается до небес… достигает облаков»
  rationale: Более буквальная конструкция сохраняет единый сказуемый «велика» и сжатый параллелизм еврейской поэзии, не добавляя отсутствующих в тексте глаголов движения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «до небес велика» сохраняет образ протяжённости и параллелизм исходного стиха; прописные местоимения использованы как уместная для библейского русского традиция обращения к Богу.
