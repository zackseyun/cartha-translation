  text: אֶ֭קְרָא לֵֽ/אלֹהִ֣ים עֶלְי֑וֹן לָ֝/אֵ֗ל גֹּמֵ֥ר עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/002.yaml
  text: I call to God Most High[a], to God who fulfills his purpose for me.
translation:
  language: ru
  text: 'Я взываю к Богу Всевышнему,

    к Богу, Который доводит до конца то, что касается меня.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Который завершает то, что относится ко мне». Еврейское выражение лаконично; возможен также смысл: «Который исполняет Свой замысел обо мне».'
    reason: Сочетание גֹמֵר עָלָי не называет прямо того, что Бог завершает. Сноска отмечает близкую передачу и возможное контекстуальное истолкование, не вводя «замысел» в основной текст.
lexical_decisions:
- source_word: אֶקְרָא
  choice: Я взываю
  rationale: Форма имперфекта 1-го лица единственного числа может передавать настоящее или будущее действие. В контексте молитвы «я взываю» естественно выражает живое обращение к Богу; при этом глаголу не приписывается чрезмерная эмоциональная окраска.
- source_word: לֵאלֹהִים עֶלְיוֹן
  choice: к Богу Всевышнему
  rationale: עֶלְיוֹן употреблено как божественный титул «Всевышний». Русская конструкция сохраняет поэтическую краткость и традиционный, но понятный современному читателю титул.
- source_word: לָאֵל
  choice: к Богу
  rationale: אֵל здесь обозначает Бога и образует параллель с אֱלֹהִים. Передача тем же словом «Бог» сохраняет смысловой параллелизм и не превращает общее семитское наименование в неясное для читателя имя «Эль».
- source_word: גֹמֵר
  choice: Который доводит до конца
  rationale: Причастие от גמר означает «заканчивать, завершать, доводить до конца». Выбранная формулировка сохраняет образ завершения, не добавляя к еврейскому тексту явно не названного «замысла».
- source_word: עָלָי
  choice: то, что касается меня
  rationale: Предлог עַל с местоименным суффиксом после גמר допускает смысл «обо мне, касающееся меня» или «для меня». Основной вариант ясно передаёт первый оттенок, а второй отмечен в сноске.
theological_decisions:
- issue: Смысл сочетания גֹמֵר עָלָי
  choice: Бог доводит до конца то, что касается псалмопевца
  alternative: Бог совершает для псалмопевца; Бог исполняет Свой замысел о нём
  rationale: В еврейском тексте прямое дополнение не выражено, поэтому «замысел» является возможным контекстуальным пояснением, но не должен незаметно вводиться в основной текст. Формулировка сохраняет мысль о Божьем завершительном действии и исходную смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Строки сохраняют параллелизм еврейского стиха. Местоимение «Который» написано с прописной буквы согласно распространённой русской библейской издательской норме.
