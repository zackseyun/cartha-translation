  text: ע֤וּרָ/ה כְבוֹדִ֗/י ע֭וּרָֽ/ה הַ/נֵּ֥בֶל וְ/כִנּ֗וֹר אָעִ֥ירָה שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/008.yaml
  text: Awake[a], my glory! Awake[b], harp and lyre! I will awaken the dawn.
translation:
  language: ru
  text: Пробудись, слава моя![a] Пробудитесь, арфа и лира![b] Я разбужу зарю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «душа моя» либо «всё существо моё»; выражение «слава моя» здесь может быть поэтическим обозначением самого говорящего.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте названы два древних струнных инструмента; их точные современные соответствия неизвестны.
    reason: cultural_note
lexical_decisions:
- source_word: עוּרָה
  choice: Пробудись / пробудитесь
  rationale: Повелительная форма глагола עור выражает прямой призыв очнуться. «Пробудись» сохраняет поэтический, возвышенный тон; при обращении к двум инструментам в русском естественно употреблено множественное число «пробудитесь».
- source_word: כְבוֹדִי
  choice: слава моя
  rationale: Буквально — «моя слава». В поэтическом контексте выражение может обозначать самого говорящего, его душу или всё его существо, однако буквальный образ сохранён в основном тексте, а возможный смысл пояснён в сноске.
- source_word: הַנֵּבֶל
  choice: арфа
  rationale: Название древнего струнного инструмента, точное устройство которого не установлено. «Арфа» — понятный современному читателю приблизительный эквивалент, позволяющий отличить инструмент от כִּנּוֹר.
- source_word: כִנּוֹר
  choice: лира
  rationale: Название древнего струнного инструмента, традиционно и обоснованно передаваемое как «лира»; выбор сохраняет различие между двумя инструментами.
- source_word: אָעִירָה
  choice: Я разбужу
  rationale: 'Каузативная форма от עור передаёт намерение вызвать пробуждение. «Я разбужу» естественно сохраняет олицетворённый образ: ранняя хвала псалмопевца словно будит саму зарю.'
- source_word: שָּׁחַר
  choice: зарю
  rationale: Слово обозначает рассвет, зарю. «Заря» звучит естественно в русской поэзии и сочетается с глаголом «разбужу».
theological_decisions:
- issue: Поэтическое значение כְבוֹדִי
  choice: В основном тексте сохранено буквальное «слава моя».
  alternative: «Душа моя» или «всё существо моё».
  rationale: Контекст допускает поэтическое самонаименование, но не требует однозначно отождествлять «славу» с душой; буквальная формулировка сохраняет смысловую напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Повтор «Пробудись / Пробудитесь» передаёт анафорическую силу оригинала, а «Я разбужу зарю» сохраняет яркое олицетворение.
