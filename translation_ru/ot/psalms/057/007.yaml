lexical_decisions:
- source_word: נָכוֹן
  choice: твердо
  rationale: В данном контексте слово передаёт устойчивость, внутреннюю решимость и утверждённость сердца. Краткое предикативное «твердо» естественно по-русски и сохраняет повтор исходного текста.
- source_word: לִבִּי
  choice: моё сердце
  rationale: «Сердце» сохраняет древнееврейское представление о внутреннем человеке, включая волю, чувства и решимость; сужать значение до «разума» нет оснований.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения ясно передаёт непосредственное молитвенное обращение к Богу.
- source_word: אָשִׁירָה
  choice: буду петь
  rationale: Когортатив выражает намерение и решимость говорящего; будущее время с «буду» естественно передаёт это в современном русском языке.
- source_word: וַאֲזַמֵּרָה
  choice: и воспевать
  rationale: Глагол זמר в породе пиэль обозначает пение хвалы или музицирование. «Воспевать» сохраняет оттенок хвалебного музыкального исполнения и не превращает второй глагол в полное повторение первого.
