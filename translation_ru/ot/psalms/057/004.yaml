  text: נַפְשִׁ֤/י בְּ/ת֥וֹךְ לְבָאִם֮ אֶשְׁכְּבָ֪ה לֹ֫הֲטִ֥ים בְּֽנֵי אָדָ֗ם שִׁ֭נֵּי/הֶם חֲנִ֣ית וְ/חִצִּ֑ים וּ֝/לְשׁוֹנָ֗/ם חֶ֣רֶב חַדָּֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/004.yaml
  text: My soul is in the midst of lions[a]; I lie down among those who are aflame—sons of man, whose teeth are spears and arrows[b], and whose tongue is a sharp sword.
translation:
  language: ru
  text: Душа моя — среди львов; я лежу среди пышущих огнём[a] — сынов человеческих[b]. Их зубы — копья и стрелы, а язык — острый меч.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди горящих», «среди пылающих».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть людей; буквально: «сынов человеческих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשִׁי
  choice: Душа моя
  rationale: Сохраняет поэтический образ נֶפֶשׁ, который здесь может обозначать душу, жизнь или самого человека, не сводя его только к местоимению «я».
- source_word: בְּתוֹךְ לְבָאִם
  choice: среди львов
  rationale: Передаёт и значение окружённости, и образ львов, не решая за читателя, буквальны они или изображают врагов.
- source_word: אֶשְׁכְּבָה
  choice: я лежу
  rationale: Естественно передаёт форму первого лица от שׁכב и сохраняет конкретный образ человека, лежащего в окружении опасности.
- source_word: לֹהֲטִים
  choice: пышущих огнём
  rationale: Передаёт образ жара и пламени в причастии, характеризующем яростных противников, но не заменяет метафору прямым толкованием вроде «разъярённых».
- source_word: בְּנֵי אָדָם
  choice: сынов человеческих
  rationale: Сохраняет грамматически мужскую и поэтически маркированную еврейскую формулу; более обычное русское «людей» дано в сноске.
- source_word: שִׁנֵּיהֶם חֲנִית וְחִצִּים
  choice: Их зубы — копья и стрелы
  rationale: Сохраняет оружейную метафору. Множественное «копья» естественно по-русски согласуется с образом множества зубов и передаёт собирательную силу единственного חֲנִית.
- source_word: וּלְשׁוֹנָם חֶרֶב חַדָּה
  choice: а язык — острый меч
  rationale: Сохраняет коллективное единственное число и прямую метафору разрушительной речи.
theological_decisions:
- issue: Буквальны ли львы и оружие или это образы человеческих врагов
  choice: Сохранить образы львов, огня и оружия, связав «пышущих огнём» с сынами человеческими, но не объясняя природу львов.
  alternative: Передать всё как прямое описание жестоких человеческих противников либо различить буквальных львов и людей.
  rationale: Стих сочетает звериный образ с явным упоминанием людей; перевод сохраняет это поэтическое наслоение и не устраняет заложенную в тексте напряжённость.
- issue: Как передать בְּנֵי אָדָם
  choice: сынов человеческих
  alternative: людей; мужчин; сынов Адама
  rationale: Основной текст сохраняет мужскую форму и поэтическую окраску оригинала, а сноска поясняет обычное значение выражения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим строем. Инверсия «Душа моя» и формула «сыны человеческие» поддерживают достоинство псалмовой речи; остальной синтаксис остаётся ясным и естественным.
