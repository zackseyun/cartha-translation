  yaml_path: translation/ot/psalms/057/001.yaml
  text: Be gracious to me[a], God, be gracious to me, for in you my soul takes refuge[b]; and in the shadow of your wings I will take refuge until destruction passes by.
translation:
  language: ru
  text: Будь милостив ко мне, Боже, будь милостив ко мне, ибо в Тебе нашла прибежище душа моя[a]. И в тени Твоих крыльев укроюсь, пока не минуют бедствия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «душа моя» (נַפְשִׁי) может также означать «жизнь моя» или просто «я».
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово стоит во множественном числе; возможны также переводы: «несчастья» или «губительные опасности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Будь милостив ко мне
  rationale: Императив от חנן с суффиксом 1-го лица выражает просьбу оказать милость. Такой перевод сохраняет значение благосклонности и естественно звучит в возвышенной современной молитвенной речи.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения естественно передаёт прямое обращение к Богу.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание просьбы; «ведь» ясно сохраняет причинную связь и естественно звучит по-русски.
- source_word: בְךָ חָסָיָה נַפְשִׁי
  choice: у Тебя ищет прибежища душа моя
  rationale: Глагол חסה обозначает поиск убежища или защиты, а ב указывает на того, у кого находят прибежище. Формулировка сохраняет образ убежища и поэтическое נַפְשִׁי, не сводя его молча к местоимению «я».
- source_word: וּבְצֵל כְּנָפֶיךָ
  choice: В тени Твоих крыльев
  rationale: Прямой перевод сохраняет поэтический образ Божьей защиты и не заменяет его объяснительным пересказом.
- source_word: אֶחְסֶה
  choice: я буду укрываться
  rationale: Имперфект выражает продолжающееся и направленное в будущее действие. «Буду укрываться» естественно передаёт длительность доверия и избегает тяжёлого повтора слова «прибежище».
- source_word: עַד יַעֲבֹר
  choice: пока не минуют
  rationale: Передаёт временной предел укрытия и образ опасностей, которые проходят.
- source_word: הַוּוֹת
  choice: бедствия
  rationale: Еврейская форма множественного числа обозначает губительные несчастья или опасности. Множественное «бедствия» сохраняет число оригинала и естественно в данном контексте.
theological_decisions:
- issue: Антропологический диапазон נַפְשִׁי
  choice: душа моя
  alternative: жизнь моя; я сам
  rationale: Сохранён традиционный поэтический образ, однако сноска предупреждает, что נֶפֶשׁ здесь может обозначать жизнь или всего человека, а не обязательно отдельную нематериальную часть человека.
- issue: Образ «тени Твоих крыльев»
  choice: сохранить метафору без поясняющей замены
  alternative: под Твоей защитой
  rationale: Оригинальный образ передан непосредственно, без буквального приписывания Богу телесных крыльев и без устранения образности посредством богословского пересказа.
- issue: Соотношение завершённого חָסָיָה и незавершённого אֶחְסֶה
  choice: «ищет прибежища» и «буду укрываться»
  alternative: «нашла прибежище» и «укроюсь»
  rationale: Перевод сохраняет переход от уже сложившегося доверия к продолжающемуся укрыванию, не превращая грамматический аспект в чрезмерно жёсткую временную схему.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому регистру. Повтор начальной просьбы сохранён; метафора крыльев не разъясняется внутри текста.
