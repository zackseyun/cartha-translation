base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/003.yaml
  text: He will send from heaven and save me[a]; he reproaches the one who pants after me. Selah[b]. God will send his steadfast love and his faithfulness.
translation:
  language: ru
  text: Он пошлёт с небес и спасёт меня; посрамит жаждущего поглотить меня.[a] Села. Бог пошлёт Свою неизменную любовь и Свою верность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жаждущий поглотить меня поносит меня»; возможно также: «спасёт меня от поношения жаждущего поглотить меня». Еврейская строка допускает разные синтаксические разборы.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Он пошлёт
  rationale: Имперфект qal здесь естественно передаёт уверенность псалмопевца в будущем Божьем вмешательстве.
- source_word: מִשָּׁמַיִם
  choice: с небес
  rationale: Русское множественное число сохраняет форму и поэтический образ еврейского שָׁמַיִם.
- source_word: וְיוֹשִׁיעֵנִי
  choice: и спасёт меня
  rationale: Прямо и естественно передаёт каузативную форму от ישׁע в контексте смертельной угрозы.
- source_word: חֵרֵף
  choice: посрамит
  rationale: Форма буквально связана с поношением или поруганием; при понимании Бога как подразумеваемого субъекта «посрамит» естественно выражает направленное на врага действие, не скрывая альтернативного синтаксического разбора, указанного в примечании.
- source_word: שֹׁאֲפִי
  choice: жаждущего поглотить меня
  rationale: Передаёт образ враждебного, жадного устремления, заложенный в שאף, и звучит понятнее по-русски, чем буквальное «задыхающегося вслед за мной».
- source_word: סֶלָה
  choice: Села
  rationale: Традиционная транслитерация сохраняется ввиду неясного значения термина.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Стандартное соответствие; единственное число ясно из контекста.
- source_word: חַסְדּוֹ
  choice: Свою неизменную любовь
  rationale: חסד сочетает любовь, милость и постоянную преданность; «неизменная любовь» естественно передаёт устойчивость этого отношения без узкоконфессиональной терминологии.
- source_word: וַאֲמִתּוֹ
  choice: и Свою верность
  rationale: В паре с חסד слово אמת обозначает надёжность и верность Бога.
theological_decisions:
- issue: Синтаксическое истолкование חֵרֵף שֹׁאֲפִי
  choice: 'Бог — подразумеваемый субъект: «посрамит жаждущего поглотить меня»'
  alternative: 'Враг — субъект: «жаждущий поглотить меня поносит меня»; возможно также: «спасёт меня от поношения жаждущего поглотить меня»'
  rationale: Еврейская строка предельно сжата и допускает несколько синтаксических разборов. Основной текст следует последовательности Божьих действий, а реальная неоднозначность сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Местоимение «Свою» написано с прописной буквы по принятой русской библейской традиции; архаизмы сведены к традиционному термину «Села». Маркер [a] помещён непосредственно после спорной фразы.
