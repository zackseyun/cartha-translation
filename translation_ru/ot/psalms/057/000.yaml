lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов слово обычно обозначает музыкального руководителя. Этот перевод понятен современному читателю и сохраняет функцию указания исполнителю.
- source_word: אַל תַּשְׁחֵת
  choice: «Не погуби»
  rationale: В данном надписании выражение, вероятнее всего, служит названием мелодии или припева; кавычки обозначают эту функцию, не исключая буквального смысла слов.
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая именная форма соответствует стилю надписания и не сводит многозначное לְ к однозначному утверждению об авторстве.
- source_word: מִכְתָּם
  choice: Миктам
  rationale: Точное значение термина неизвестно, поэтому он транслитерирован, а не заменён предположительным жанровым обозначением.
- source_word: בְּבָרְחוֹ
  choice: когда он бежал
  rationale: Инфинитив с предлогом בְּ здесь имеет временное значение; выбран естественный русский оборот.
- source_word: מִפְּנֵי שָׁאוּל
  choice: от Саула
  rationale: Еврейский оборот буквально означает удаление «от лица» кого-либо; в контексте бегства естественный русский эквивалент — «от Саула».
- source_word: בַּמְּעָרָה
  choice: в пещере
  rationale: Предлог естественнее всего указывает на место; перевод не добавляет невыраженного направления движения.
theological_decisions:
- issue: Литературная функция строки
  choice: Вся строка передана как надписание псалма.
  alternative: Считать «Не погуби» частью основного поэтического текста.
  rationale: 'Строка состоит из обычных элементов древнееврейского надписания: указания музыкальному руководителю, названия или обозначения мелодии, связи с Давидом, жанрового термина и исторического обстоятельства.'
- issue: Значение לְדָוִד
  choice: Передать как «Давида», сохранив широту связи с Давидом.
  alternative: «Написанный Давидом» или «для Давида».
  rationale: Предлог לְ в надписаниях допускает авторство, принадлежность, посвящение или более широкую связь; перевод не должен без необходимости устранять эту неоднозначность.
- issue: Значение מִכְתָּם
  choice: 'Сохранить термин в транслитерации: «миктам».'
  alternative: «Надпись», «золотая песнь» или «тайная песнь».
  rationale: Предлагаемые толкования спорны; транслитерация не выдаёт предположение за установленный смысл.
translation_notes:
  register: Современный литературный русский язык; лаконичная, фрагментарная форма сохранена как характерная черта псаломского надписания. «Руководителю хора» выбрано вместо более архаичного «начальнику хора», а неопределённые элементы не истолкованы сверх данных еврейского текста.
