  text: 'For the choirmaster: “Do Not Destroy.” Of David[a]. A miktam, when he fled from Saul[b], in the cave.'
translation:
  language: ru
  text: Руководителю хора. «Не погуби»[a]. Давида. Миктам[b], когда он бежал от Саула и был в пещере.
  philosophy: optimal-equivalence
