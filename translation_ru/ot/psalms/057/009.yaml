  yaml_path: translation/ot/psalms/057/009.yaml
  text: I will give thanks to you among the peoples[a], Lord; I will sing praise to you among the nations.
translation:
  language: ru
  text: 'Буду благодарить Тебя среди народов[a], Господи,

    буду воспевать Тебя среди народов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду славить Тебя среди народов». Еврейский глагол может обозначать и благодарение, и хвалу; вариант «благодарить» сохраняет отличие от следующего «воспевать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: буду благодарить Тебя
  rationale: Глагол ידה в породе hифиль может означать как благодарение, так и хвалу. «Благодарить» сохраняет возможный оттенок благодарения и не дублирует «воспевать» во второй строке.
- source_word: בָעַמִּים
  choice: среди народов
  rationale: Множественное עַמִּים обозначает народы как общности; русский оборот естественно передаёт и множественность, и сферу публичного прославления.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Это божественный титул אֲדֹנָי, а не тетраграмматон. Русская звательная форма «Господи» естественно передаёт прямое обращение.
- source_word: אֲזַמֶּרְךָ
  choice: буду воспевать Тебя
  rationale: זמר в пиэле в псалмах означает петь хвалу, нередко с музыкальным сопровождением. «Воспевать» кратко и достойно передаёт песенный и хвалебный смысл.
- source_word: בַּל
  choice: среди
  rationale: В данном поэтическом контексте форма служит предложным выражением, параллельным בָ в первой строке, и указывает на пребывание среди названных групп.
- source_word: אֻמִּים
  choice: племён
  rationale: אֻמִּים может обозначать народы, племена или этнические общности. «Племён» позволяет сохранить различие между двумя близкими еврейскими существительными, не прибегая к современно-политическому слову «нации».
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господи
  alternative: о Господь
  rationale: Исходный текст содержит титул אֲדֹנָי, а не имя יהוה. Форма «Господи» передаёт титул и прямое обращение без смешения с особой передачей тетраграмматона.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Синтаксический параллелизм и прямое обращение сохранены; архаическое «о Господи» не добавлено.
