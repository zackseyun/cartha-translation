base_translation:
  language: en
  yaml_path: translation/ot/psalms/057/006.yaml
  text: They prepared a net for my steps[a]; my soul was bowed down; they dug a pit before me; they fell into the midst of it[d][c][b]. Selah
translation:
  language: ru
  text: Они приготовили сеть для моих шагов[a]; душа моя поникла[b]; они выкопали передо мной яму — и упали в неё[c]. Села[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ловушку для моих ног».'
    reason: Слово רֶשֶׁת означает сеть для ловли, а לִפְעָמַי допускает передачу как «для моих шагов» или «для моих ног».
  - marker: b
    text: 'Буквально: «душа моя согнулась»; «душа моя» может также означать «я» или «моя жизнь».'
    reason: Сохранён еврейский антропологический и поэтический образ, но отмечены возможные смысловые эквиваленты.
  - marker: c
    text: 'Буквально: «упали посреди неё».'
    reason: Основной текст использует естественное русское «в неё», тогда как примечание сохраняет форму בְתוֹכָהּ точнее.
  - marker: d
    text: Значение слова «Села» неизвестно; возможно, это музыкальная или богослужебная помета.
    reason: Неясный технический термин транслитерирован, а не переведён предположительно.
lexical_decisions:
- source_word: רֶשֶׁת
  choice: сеть
  rationale: Конкретное орудие ловли; слово сохраняет образ западни и прямо соответствует еврейскому существительному.
- source_word: הֵכִינוּ
  choice: приготовили
  rationale: Передаёт намеренное приготовление ловушки, не добавляя отсутствующего в тексте действия вроде её расстановки.
- source_word: לִפְעָמַי
  choice: для моих шагов
  rationale: פעם здесь обозначает шаги или стопы; выбранный вариант сохраняет множественное число и образ движения к ловушке.
- source_word: כָּפַף נַפְשִׁי
  choice: душа моя поникла
  rationale: Естественное по-русски поэтическое выражение передаёт буквальный образ согнувшейся, униженной души, не сводя נֶפֶשׁ просто к местоимению «я».
- source_word: כָּרוּ
  choice: выкопали
  rationale: Прямое значение глагола в сочетании с ямой.
- source_word: לְפָנַי
  choice: передо мной
  rationale: Точно и естественно передаёт пространственное значение выражения.
- source_word: שִׁיחָה
  choice: яму
  rationale: В данном контексте существительное обозначает выкопанную яму, служащую ловушкой.
- source_word: נָפְלוּ בְתוֹכָהּ
  choice: сами упали в неё
  rationale: Направление «в неё» естественно выводится из глагола движения; «сами» ясно передаёт иронический поворот, заложенный сопоставлением устроителей ловушки с их падением, хотя формально не выражено отдельным словом.
- source_word: סֶלָה
  choice: Села
  rationale: Значение литургического или музыкального термина остаётся неясным, поэтому он транслитерирован.
