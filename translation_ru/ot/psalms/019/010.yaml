  yaml_path: translation/ot/psalms/019/010.yaml
  text: They are more desirable than gold[a], even than much fine gold, and sweeter than honey and drippings from the honeycomb.
translation:
  language: ru
  text: Они желаннее золота[a], даже множества чистого золота, и слаще мёда и мёда, стекающего из сот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Они желаннее золота… и слаще мёда — мёда, стекающего из сот». В еврейском тексте употреблены формы со значением свойства в сочетании со сравнительными оборотами. Последнее выражение может быть передано более буквально как «текучий (или капающий) мёд [из] сот».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּחֱמָדִים
  choice: желаннее
  rationale: Страдательное причастие от חמד употреблено предикативно и вместе со следующим сравнительным оборотом естественно передаётся русской сравнительной формой. Местоимение «они» отсылает к установлениям Господа в предыдущем стихе.
- source_word: מִזָּהָב
  choice: золота
  rationale: Предлог מִן выражает сравнение; после сравнительной формы «желаннее» в русском требуется родительный падеж.
- source_word: וּמִפַּז רָב
  choice: даже множества чистого золота
  rationale: פַּז обозначает особо ценное, чистое или очищенное золото, а רָב указывает на его изобилие. «Даже» естественно передаёт усиление второго члена сравнения.
- source_word: וּמְתוּקִים
  choice: и слаще
  rationale: Форма стоит параллельно «желаннее» и получает сравнительное значение благодаря последующему מִן.
- source_word: מִדְּבַשׁ
  choice: мёда
  rationale: מִן вновь выражает сравнение; русская конструкция после «слаще» требует родительного падежа.
- source_word: וְנֹפֶת צוּפִים
  choice: мёда, текущего из сот
  rationale: נֹפֶת — текучий или капающий мёд, а צוּפִים, вероятно, соты. Формулировка сохраняет конкретный образ свежего мёда, вытекающего из сот, не сводя выражение просто к «медовым сотам».
