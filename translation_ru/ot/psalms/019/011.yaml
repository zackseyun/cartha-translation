base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/011.yaml
  text: Also[a], your servant is warned by them[b]; in keeping them there is great reward.
translation:
  language: ru
  text: Также Твой слуга получает от них предостережение[a]; в соблюдении их — великая награда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предостережён ими»; еврейский глагол может означать как получение предупреждения, так и принятие его во внимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «великое воздаяние» либо «великий благой итог».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: И
  rationale: Союз передаёт присоединение этой мысли к предшествующей хвале словам Господа; по-русски «и» здесь звучит естественнее буквального «также».
- source_word: עַבְדְּךָ
  choice: раб Твой
  rationale: В молитвенном обращении псалмопевец смиренно называет себя принадлежащим Богу и служащим Ему; традиционно возвышенное «раб» точно передаёт это отношение.
- source_word: נִזְהָר
  choice: предостережён
  rationale: Форма нифаль от זהר допускает значение «получает предостережение / предупреждён» и сохраняет пассивно-результативный оттенок исходного выражения.
- source_word: בָּהֶם
  choice: ими
  rationale: Местоимение относится к установлениям Господа из предыдущего контекста и выражает средство, через которое раб получает предостережение.
- source_word: בְּשָׁמְרָם
  choice: в соблюдении их
  rationale: Предлог ב с инфинитивом שמר может выражать обстоятельство или средство; формулировка сохраняет ёмкость оригинала и связь соблюдения с последующим благом.
- source_word: עֵקֶב
  choice: награда
  rationale: В данном контексте слово обозначает благой итог или воздаяние, связанное с соблюдением Божьих установлений; «награда» естественно сочетается с определением «великая».
- source_word: רָב
  choice: великая
  rationale: Передаёт значительность и обилие названной награды в естественной русской форме.
theological_decisions:
- issue: Говорит ли стих о заслуживании награды перед Богом или о благом результате послушания
  choice: Формулировка утверждает, что в соблюдении Божьих установлений заключена великая награда, не уточняя механизм заслуги или воздаяния.
  alternative: «За соблюдение их полагается великая награда», что сильнее подчёркивало бы награду как оплату за заслугу.
  rationale: Еврейское выражение связывает соблюдение с великим благим итогом, но само по себе не определяет развитого учения о человеческой заслуге; перевод сохраняет эту богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Инверсия «раб Твой» уместна для поэзии и обращения к Богу; фраза остаётся понятной современному читателю.
