base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/004.yaml
  text: Their line has gone out through all the earth[a], and their words to the end of the world. In them he has set a tent for the sun[b],
translation:
  language: ru
  text: По всей земле пролегла их мерная линия[a], и до края мира — их слова. В них он поставил шатёр для солнца[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всей земле разнёсся их голос» или «звук». Еврейский согласный текст читается как «их линия» или «их мерная линия», однако некоторые древние переводы и многие толкователи понимают это слово в данном поэтическом контексте как «голос» или «звук».'
    reason: alternative_reading
  - marker: b
    text: «В них», вероятнее всего, относится к небесам, упомянутым в предыдущем стихе.
    reason: cross_reference
lexical_decisions:
- source_word: קַוָּם
  choice: их мера
  rationale: Масоретский текст буквально говорит об их «мере» или «мерной линии». Выбор сохраняет засвидетельствованное чтение и образ простирающейся по земле линии, не подменяя его истолковательным вариантом «голос» или «звук»; неоднозначность отмечена в сноске.
- source_word: יָצָא
  choice: прошла
  rationale: Глагол יצא означает «выйти». В сочетании с «мерой/линией» русское «прошла» естественно передаёт завершённое распространение по всей земле.
- source_word: מִלֵּיהֶם
  choice: их слова
  rationale: Существительное обозначает слова или речь. «Слова» сохраняет словесный образ и параллелизм стиха.
- source_word: תֵבֵל
  choice: мир
  rationale: תבל обозначает мир, особенно обитаемую землю. «Мир» поэтично и естественно в сочетании «до края мира».
- source_word: שָׂם
  choice: поставил
  rationale: Глагол означает «поместил, поставил». «Поставил» кратко и непосредственно передаёт действие Бога.
- source_word: אֹהֶל
  choice: шатёр
  rationale: Обычное значение — переносное жилище, шатёр. Это слово сохраняет поэтический образ и не вносит ненужных культовых ассоциаций «скинии».
- source_word: בָּהֶם
  choice: в них
  rationale: Местоимение сохранено без явного уточнения референта; вероятнее всего, оно относится к небесам из предыдущего контекста.
- source_word: לַשֶּׁמֶשׁ
  choice: для солнца
  rationale: Прямое и естественное соответствие еврейской предложной конструкции.
