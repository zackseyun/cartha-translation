  naturalness: '«По всей земле прошла их мера» неестественно для современного литературного русского: мера не «проходит» по земле. «Пролегла их мерная линия» сохраняет пространственный образ еврейского текста и звучит яснее. Строчная форма «он» избегает конфессионально маркированного правила написания местоимений с прописной буквы.'
  terminology: «Шатёр» точно передаёт אֹהֶל без внесения культового значения. «Мерная линия» передаёт קַו точнее, чем «мера». Альтернативное понимание как «голос/звук» следует сохранить в сноске, поскольку оно текстологически и интерпретационно обсуждаемо.
