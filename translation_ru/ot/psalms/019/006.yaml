  variant: modern literary Russian
source:
  edition: WLC
  text: מִ/קְצֵ֤ה הַ/שָּׁמַ֨יִם מֽוֹצָא֗/וֹ וּ/תְקוּפָת֥/וֹ עַל קְצוֹתָ֑/ם וְ/אֵ֥ין נִ֝סְתָּ֗ר מֵֽ/חַמָּת/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/006.yaml
  text: Its rising is from one end of the heavens[a], and its circuit to their ends[c][b], and nothing is hidden from its heat.
translation:
  language: ru
  text: Восходит оно от края небес[a] и совершает круг до их пределов[b]; ничто не укрыто от его жара.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выходит оно». Еврейское слово может обозначать как появление солнца, так и его выход в путь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «проходит свой путь». Еврейское слово передаёт круговое движение, оборот или полный ход солнца по небесам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הַשָּׁמַיִם
  choice: от края небес
  rationale: Сохраняет образ крайней точки небесного свода и поэтическое множественное число שָׁמַיִם; неопределённость еврейского выражения не требует добавлять «одного».
- source_word: מוֹצָאוֹ
  choice: восходит оно
  rationale: В контексте солнца מוֹצָא обозначает его появление, выход или восход. Глагольная формулировка естественнее по-русски, при этом альтернативное «выходит» отмечено в сноске.
- source_word: וּתְקוּפָתוֹ
  choice: и совершает круг
  rationale: תְּקוּפָה передаёт круговое движение, оборот или прохождение пути. Выражение «совершает круг» ясно сохраняет этот образ без внесения современного астрономического уточнения.
- source_word: עַל קְצוֹתָם
  choice: до их пределов
  rationale: Передаёт протяжённость движения до краёв небес; местоимение «их» сохраняет отсылку суффикса множественного числа к небесам.
- source_word: וְאֵין נִסְתָּר
  choice: ничто не укрыто
  rationale: Кратко и близко к еврейской конструкции с отрицательной частицей существования и страдательным причастием; допускается охват как вещей, так и живых существ.
- source_word: מֵחַמָּתוֹ
  choice: от его жара
  rationale: «Жар» передаёт силу חַמָּה точнее, чем более мягкое «тепло». Русское «его» грамматически соотносится с солнцем среднего рода и не усиливает олицетворение.
theological_decisions:
- issue: Степень олицетворения солнца
  choice: Согласовать местоимения с русским словом «солнце» среднего рода, сохранив образ его движения.
  alternative: Использовать формы мужского рода вслед за еврейскими суффиксами.
  rationale: Мужской род суффиксов обусловлен грамматикой еврейского наименования солнца и сам по себе не превращает солнце в личность или божество. Русское среднее «оно» естественно и не устраняет поэтического образа.
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической интонацией. Инверсия «Восходит оно» поддерживает ритм псалма, не создавая архаической тяжеловесности; точка с запятой сохраняет тесную связь двух частей стиха.
