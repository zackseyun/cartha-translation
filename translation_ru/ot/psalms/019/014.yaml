base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/014.yaml
  text: May the words of my mouth and the meditation of my heart be acceptable before you[a], O Yahweh[b], my rock and my redeemer.
translation:
  language: ru
  text: Да будут слова моих уст и размышление моего сердца угодны пред Тобой[a], Яхве, моя скала и мой Искупитель[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Твоих глазах». Буквально: «перед Твоим лицом», то есть в Твоём присутствии.'
    reason: lexical_alternative
  - marker: b
    text: «Искупитель» — тот, кто выкупает, возвращает утраченное или избавляет; в древнем Израиле это слово могло также обозначать близкого родственника, обязанного защищать права своего рода.
    reason: cultural_note
lexical_decisions:
- source_word: יִהְיוּ לְרָצוֹן
  choice: Да будут угодны Тебе
  rationale: Имперфект היה в контексте молитвенного пожелания передан русской оптативной конструкцией «да будут»; לְרָצוֹן выражает угодность и благосклонное принятие.
- source_word: אִמְרֵי פִי
  choice: слова моих уст
  rationale: Сохранены конкретный поэтический образ и конструкция принадлежности; выражение естественно для возвышенной современной русской речи.
- source_word: וְהֶגְיוֹן לִבִּי
  choice: и размышление моего сердца
  rationale: הֶגְיוֹן может обозначать размышление, внутреннее раздумье или тихое проговаривание. «Размышление» сохраняет внутреннюю сторону параллели со словами уст, не сужая смысл до одной мысли.
- source_word: לְפָנֶיךָ
  choice: Тебе
  rationale: В сочетании с «угодны» русский дательный естественно передаёт оценочный смысл «перед Тобой / в Твоём присутствии»; буквальный образ отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: צוּרִי
  choice: моя скала
  rationale: Прямо сохранена метафора צוּר — образ твёрдости, устойчивости и защиты.
- source_word: וְגֹאֲלִי
  choice: и мой Искупитель
  rationale: גֹּאֵל обозначает того, кто выкупает, возвращает утраченное или избавляет, в том числе исполняя обязанности близкого родственника; «Искупитель» кратко сохраняет основной образ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Форма «Яхве» передаёт его непосредственно, не подменяя титулом.
- issue: Метафорический титул צוּרִי
  choice: моя скала
  alternative: моё прибежище
  rationale: Сохранена исходная метафора, а её значение не сведено к одному возможному истолкованию.
- issue: Смысл גֹאֲלִי
  choice: мой Искупитель
  alternative: мой избавитель; мой родственник-искупитель
  rationale: «Избавитель» ослабляет идею выкупа и возвращения, а «родственник-искупитель» чрезмерно уточняет её в данном поэтическом обращении. Более широкий культурно-правовой фон пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Архаическая оптативная конструкция «да будут» сохранена как понятная и уместная для молитвы; местоимения в обращении к Богу написаны с прописной буквы по принятой русской религиозной норме.
