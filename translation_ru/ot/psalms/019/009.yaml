source:
  edition: WLC
  text: יִרְאַ֤ת יְהוָ֨ה טְהוֹרָה֮ עוֹמֶ֪דֶת לָ֫/עַ֥ד מִֽשְׁפְּטֵי יְהוָ֥ה אֱמֶ֑ת צָֽדְק֥וּ יַחְדָּֽו׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/009.yaml
  text: The fear of Yahweh is pure[a], enduring forever; the judgments of Yahweh are true[d][c][b]; they are altogether righteous.
translation:
  language: ru
  text: Страх перед Яхве чист[a] и пребывает вовек[b]; суды Яхве истинны[c], все они праведны[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «непорочен».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «стоит навеки».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «верны»; также возможен перевод: «суды Яхве — истина».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «праведны все вместе», то есть праведны как единое целое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְאַת יְהוָה
  choice: страх перед Яхве
  rationale: Сохраняет буквальный и богословски ёмкий образ благоговейного страха, не сводя его только к почтению, религии или поклонению.
- source_word: טְהוֹרָה
  choice: чист
  rationale: Передаёт моральную и культовую чистоту; по-русски естественно согласуется со словом «страх».
- source_word: עוֹמֶדֶת לָעַד
  choice: пребывает вовек
  rationale: Естественно передаёт буквальный образ «стоит навеки» в значении неизменности и непреходящей силы.
- source_word: מִשְׁפְּטֵי יְהוָה
  choice: суды Яхве
  rationale: Сохраняет судебный оттенок מִשְׁפָּט и допускает понимание как вынесенных решений, так и установлений.
- source_word: אֱמֶת
  choice: истинны
  rationale: Предикативное прилагательное естественно передаёт здесь еврейское существительное «истина» и сохраняет возможность оттенка надёжности.
- source_word: צָדְקוּ יַחְדָּו
  choice: все они праведны
  rationale: 'Передаёт коллективную силу יַחְדָּו: суды праведны все вместе, как единое целое, без тяжеловесного русского оборота.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Значение выражения «страх перед Яхве» в ряду обозначений Божьего откровения
  choice: Сохранить выражение «страх перед Яхве».
  alternative: «почитание Яхве», «поклонение Яхве» или «вера Яхве»
  rationale: Еврейская формулировка допускает связь с благочестием и открытым Богом наставлением, но перевод не должен устранять её образность и богословское напряжение.
- issue: Характер праведности судов Яхве
  choice: «все они праведны»
  alternative: «они совершенно праведны»
  rationale: Так сохраняется возможный коллективный смысл יַחְדָּו — праведность всех судов вместе, — не исключая смысла полной праведности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Вовек» сохраняет поэтическую краткость; синтаксис остаётся ясным для обычного современного читателя.
