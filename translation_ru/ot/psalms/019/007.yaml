  text: תּ֘וֹרַ֤ת יְהוָ֣ה תְּ֭מִימָה מְשִׁ֣יבַת נָ֑פֶשׁ עֵד֥וּת יְהוָ֥ה נֶ֝אֱמָנָ֗ה מַחְכִּ֥ימַת פֶּֽתִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/007.yaml
  text: The law of Yahweh is perfect[a], restoring the soul; the testimony of Yahweh is trustworthy, making the simple wise.
translation:
  language: ru
  text: Закон Яхве совершенен — он восстанавливает душу[a]; свидетельство Яхве надёжно — оно умудряет неопытного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оживляет душу».'
    reason: 'Лексическая альтернатива для מְשִׁיבַת נָפֶשׁ: глагол от корня שוב может в данном контексте передавать оживление наряду с восстановлением.'
lexical_decisions:
- source_word: תּוֹרַת
  choice: Закон
  rationale: תּוֹרָה означает наставление и учение, но здесь имеет весомый смысл данного Яхве откровения. «Закон» сохраняет традиционную богословскую силу слова и естественно звучит в русском поэтическом параллелизме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: תְּמִימָה
  choice: совершенен
  rationale: Прилагательное обозначает целостность, полноту и безупречность; «совершенен» ёмко передаёт эту совокупность значений.
- source_word: מְשִׁיבַת נָפֶשׁ
  choice: восстанавливает душу
  rationale: Причастная форма от שׁוב содержит идею возвращения или восстановления, а נֶפֶשׁ может обозначать душу, жизнь или всего человека. Формулировка сохраняет образ восстановления и не сводит его лишь к эмоциональному освежению.
- source_word: עֵדוּת
  choice: свидетельство
  rationale: В ряду обозначений Божьего откровения слово указывает на засвидетельствованное постановление или свидетельство Яхве; прямой русский эквивалент сохраняет связь с исходным образом.
- source_word: נֶאֱמָנָה
  choice: надёжно
  rationale: Слово выражает твёрдость, достоверность и то, что заслуживает доверия; «надёжно» ясно и естественно передаёт этот смысл.
- source_word: מַחְכִּימַת
  choice: умудряет
  rationale: Причастие каузативной породы означает «делает мудрым»; глагол «умудряет» точно и лаконично передаёт это действие.
- source_word: פֶּתִי
  choice: неопытного
  rationale: Слово обозначает наивного, ещё не сформировавшегося и потому уязвимого человека, не обязательно нравственно порочного. «Неопытного» передаёт это без уничижительного оттенка.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя Бога. Транслитерация «Яхве» сохраняет его как личное заветное имя и не подменяет титулом.
- issue: Смысл выражения מְשִׁיבַת נָפֶשׁ
  choice: восстанавливает душу
  alternative: оживляет душу; возвращает к жизни
  rationale: Корень שׁוב прежде всего несёт идею возвращения и восстановления, однако в контексте возможен оттенок оживления. Основной текст сохраняет корневой образ, а сильная контекстуальная альтернатива вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Два параллельных утверждения разделены точкой с запятой; местоименные пояснения делают отношения между подлежащими и причастными оборотами ясными без утраты лаконизма.
