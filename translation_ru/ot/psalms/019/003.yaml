  text: אֵֽין אֹ֭מֶר וְ/אֵ֣ין דְּבָרִ֑ים בְּ֝לִ֗י נִשְׁמָ֥ע קוֹלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/003.yaml
  text: There is no speech[a], and there are no words; their voice is not heard.
translation:
  language: ru
  text: Нет речи, и нет слов; не слышен их голос.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не слышен их звук». Еврейское קוֹל может означать и «голос», и «звук».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: нет
  rationale: Экзистенциальное отрицание; русское «нет» естественно вводит обе параллельные части.
- source_word: אֹמֶר
  choice: речь
  rationale: Обозначает речевое выражение в целом, а не отдельное изречение; соответствует поэтической параллели со «словами».
- source_word: דְּבָרִים
  choice: слова
  rationale: В контексте возвещения и слышания конкретное значение «слова» наиболее уместно.
- source_word: בְּלִי
  choice: не
  rationale: Передаёт отрицательное обстоятельство при пассивной форме נִשְׁמָע естественной русской конструкцией.
- source_word: נִשְׁמָע
  choice: слышен
  rationale: Прямо и естественно передаёт пассивное значение корня שׁמע.
- source_word: קוֹלָם
  choice: их голос
  rationale: «Голос» сохраняет олицетворение небес; возможное значение «звук» отмечено в сноске, поскольку контекст допускает представление о безмолвном свидетельстве.
theological_decisions:
- issue: Свидетельство небес как неречевое возвещение
  choice: 'Стих отрицает обычную речь и слышимый голос: «Нет речи, и нет слов; не слышен их голос».'
  alternative: Строку можно понимать как указание на то, что их свидетельство распространяется без речи и слов.
  rationale: Еврейский синтаксис естественно допускает прямое отрицание речи, слов и слышимости голоса. Такой перевод сохраняет поэтическое напряжение с предыдущим утверждением о возвещении небес и не разрешает образ однозначно.
translation_notes:
  register: Современный литературный русский язык; лаконичный и возвышенный поэтический строй. Повтор «нет» сохраняет параллелизм оригинала, а инверсия «не слышен их голос» звучит естественно и торжественно.
