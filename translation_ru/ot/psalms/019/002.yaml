  text: י֣וֹם לְ֭/יוֹם יַבִּ֣יעַֽ אֹ֑מֶר וְ/לַ֥יְלָה לְּ֝/לַ֗יְלָה יְחַוֶּה דָּֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/002.yaml
  text: Day to day pours forth speech[b][a], and night to night reveals knowledge.
translation:
  language: ru
  text: День дню изливает речь[a], и ночь ночи возвещает знание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «произносит речь»; еврейский глагол передаёт образ обильного потока, а не просто говорения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «открывает знание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֣וֹם לְיוֹם
  choice: День дню
  rationale: Лаконично передаёт переход от одного дня к другому и сохраняет параллельное поэтическое построение еврейского текста.
- source_word: יַבִּיעַ
  choice: изливает
  rationale: Глагол рисует обильный, непрерывный поток; «изливает» сохраняет этот образ лучше, чем нейтральное «произносит».
- source_word: אֹמֶר
  choice: речь
  rationale: Существительное обозначает словесное выражение; «речь» естественно сочетается с образом излияния и соответствует параллели со «знанием».
- source_word: וְלַיְלָה לְּלַיְלָה
  choice: и ночь ночи
  rationale: Сохраняет симметрию с «день дню» и образ передачи от одной ночи к другой.
- source_word: יְחַוֶּה
  choice: возвещает
  rationale: Форма Piel от חוה означает сообщать, объявлять или делать известным. «Возвещает» передаёт активное провозглашение, не уточняя способ сообщения.
- source_word: דָּעַת
  choice: знание
  rationale: Прямой эквивалент, сохраняющий смысловую параллель с «речью».
