translation:
  language: ru
  text: Руководителю хора. Псалом Давида[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «псалом, написанный Давидом» либо «псалом для Давида»; еврейское выражение может указывать на авторство, связь с Давидом или посвящение ему.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов слово, вероятно, обозначает человека, руководившего музыкальным исполнением. Дательный оборот естественно передаёт prefixed ל и назначение текста; выражение «руководитель хора» понятно современному читателю и сохраняет музыкально-богослужебный контекст.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Это устойчивое жанровое обозначение поэтического произведения, предназначенного для музыкального исполнения; «песнь» было бы менее точно.
- source_word: לְדָוִד
  choice: Давида
  rationale: Родительный падеж в выражении «Псалом Давида» естественен для русского заголовка и, подобно еврейской конструкции, не требует однозначно понимать отношение Давида к псалму только как авторство.
theological_decisions:
- issue: Значение לְדָוִד в заголовке
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида
  rationale: Еврейский предлог לְ может указывать на авторство, принадлежность, связь или посвящение. Основной текст сохраняет эту неоднозначность, не утверждая более определённо, чем источник, что Давид непременно написал псалом.
translation_notes:
  register: Современный литературный русский язык; краткая, традиционно узнаваемая форма заголовка без архаизмов. Маркер сноски поставлен непосредственно после имени Давида, поскольку сноска поясняет выражение לְדָוִד.
