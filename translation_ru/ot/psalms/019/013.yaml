  rationale: Перевод приведён к более современному литературному регистру при сохранении структуры, образа греха как господствующей силы и всех существенных лексических неоднозначностей оригинала. Сноски и их якоря сохранены; вариант «надменные люди» не исключён из-за спорного референта מִזֵּדִים.
