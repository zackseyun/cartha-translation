  - severity: low
    issue: Начальная конструкция и словосочетание «великое преступление»
    rationale: «Также удержи ... от ...» яснее передаёт присоединительное גם, а «тяжкий проступок» более естественен по-русски при сохранении серьёзного характера פשע רָב.
