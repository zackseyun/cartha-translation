source:
  edition: WLC
  text: גַּ֤ם מִ/זֵּדִ֨ים חֲשֹׂ֬ךְ עַבְדֶּ֗/ךָ אַֽל יִמְשְׁלוּ בִ֣/י אָ֣ז אֵיתָ֑ם וְ֝/נִקֵּ֗יתִי מִ/פֶּ֥שַֽׁע רָֽב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/013.yaml
  text: Also keep your servant back from presumptuous sins[a]; do not let them rule over me[d][c][b]. Then I will be blameless and be cleared from great transgression.
translation:
  language: ru
  text: Также удержи Твоего слугу от дерзких грехов[a]; пусть они не властвуют надо мной. Тогда я буду безупречен[b] и свободен от тяжкого проступка[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от надменных людей». Еврейское выражение может обозначать как дерзкие грехи, так и высокомерных людей.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «цел»; «невиновен». Речь может идти о нравственной цельности и безупречности.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «от великого мятежа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: И
  rationale: Союз продолжает молитву предыдущего стиха о неведомых проступках; в русском начале фразы «И» естественно передаёт присоединительное значение.
- source_word: מִזֵּדִים
  choice: от дерзких грехов
  rationale: Форма допускает значение «от надменных людей», но контекст проступков в предыдущем стихе и местоименное продолжение поддерживают понимание как сознательных, высокомерно совершаемых грехов. «Дерзкие» сохраняет оттенок самонадеянности и непокорности.
- source_word: חֲשֹׂךְ
  choice: удержи
  rationale: Императив выражает просьбу к Богу не дать молящемуся впасть в такие грехи; «удержи» кратко и естественно передаёт образ сдерживания.
- source_word: עַבְדֶּךָ
  choice: раба Твоего
  rationale: В молитвенном обращении традиционная русская формула ясно выражает принадлежность Богу, покорность и служение.
- source_word: אַל יִמְשְׁלוּ בִי
  choice: пусть они не властвуют надо мной
  rationale: Глагол с предлогом обозначает господство над кем-либо. «Властвовать» сохраняет метафору грехов как порабощающей силы.
- source_word: אָז
  choice: тогда
  rationale: Указывает на следствие Божьего удерживающего действия.
- source_word: אֵיתָם
  choice: я буду непорочен
  rationale: Слово обозначает цельность и нравственную безупречность; «непорочен» здесь не обязательно утверждает абсолютную безгрешность.
- source_word: וְנִקֵּיתִי
  choice: и чист
  rationale: Форма глагола נקה означает быть свободным от вины, чистым или невиновным. Краткое «чист от» естественно сочетается с последующим обозначением преступления.
- source_word: מִפֶּשַׁע רָב
  choice: от великого преступления
  rationale: פשע обозначает серьёзное преступление, нарушение верности или мятеж. «Великое преступление» сохраняет единственное число и степень тяжести, не сводя смысл только к политическому мятежу.
theological_decisions:
- issue: Референт מִזֵּדִים
  choice: дерзкие грехи
  alternative: надменные люди
  rationale: Непосредственный контекст говорит о проступках и грехах, поэтому предметом молитвы, вероятнее всего, являются сознательные дерзкие грехи. Однако грамматически возможно обозначение надменных людей, что сохранено в сноске.
- issue: Смысл אֵיתָם
  choice: непорочен в смысле нравственной цельности
  alternative: цел / невиновен
  rationale: Перевод передаёт этическую непорочность как результат Божьего удержания, не превращая её в утверждение абсолютного безгрешного совершенства.
- issue: Смысл פֶּשַׁע
  choice: преступление
  alternative: мятеж
  rationale: Слово несёт оттенок сознательного нарушения и бунта против Бога. Основной вариант звучит естественно по-русски, а оттенок «мятежа» отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Сохранены традиционные «раб Твой» и «непорочен», но синтаксис сделан ясным и естественным. Местоимения, относящиеся к Богу, написаны с прописной буквы.
