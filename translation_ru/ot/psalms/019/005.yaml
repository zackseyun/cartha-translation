lexical_decisions:
- source_word: וְהוּא
  choice: Оно
  rationale: Местоимение относится к солнцу из предыдущего стиха; в русском языке слово «солнце» среднего рода. Союз передан структурой продолжения поэтической мысли, без обязательного начального «и».
- source_word: כְּחָתָן
  choice: как жених
  rationale: «Жених» точно передаёт חָתָן и сохраняет возвышенный свадебный образ.
- source_word: יֹצֵא
  choice: выходящий
  rationale: Причастие сохраняет длительный, наглядный характер еврейской формы и естественно сочетается с образом жениха.
- source_word: מֵחֻפָּתוֹ
  choice: из брачного чертога
  rationale: חֻפָּה может обозначать свадебный полог или брачный чертог. В контексте выхода жениха «брачный чертог» создаёт ясный и естественный поэтический образ; альтернативное значение отмечено в сноске.
- source_word: יָשִׂישׂ
  choice: ликует
  rationale: Глагол выражает сильную, торжествующую радость; «ликует» сохраняет интенсивность и поэтический регистр.
- source_word: כְּגִבּוֹר
  choice: как могучий воин
  rationale: גִּבּוֹר обозначает сильного, доблестного человека, часто воина. Сочетание «могучий воин» передаёт и силу, и героический оттенок без архаичного «исполин».
- source_word: לָרוּץ
  choice: которому предстоит пробежать
  rationale: Такая конструкция естественно передаёт направленность инфинитива «бежать», связывая ликование воина с предстоящим бегом, не добавляя соревновательного смысла.
- source_word: אֹרַח
  choice: путь
  rationale: אֹרַח означает путь или тропу. Непритяжательное «путь» следует форме исходного текста и сохраняет образ движения солнца по небосводу.
