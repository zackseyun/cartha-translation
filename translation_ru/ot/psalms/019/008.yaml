base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/008.yaml
  text: The precepts of Yahweh are right[a], rejoicing the heart; the commandment of Yahweh is pure, enlightening the eyes.
translation:
  language: ru
  text: Повеления Яхве правильны, радуют сердце; заповедь Яхве чиста[a], просветляет глаза.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ясна». Еврейское прилагательное прежде всего указывает на чистоту, но в связи со следующими словами «просветляет глаза» может также выражать ясность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּקּוּדֵי
  choice: повеления
  rationale: Слово обозначает установленные предписания или поручения в ряду обозначений Торы. «Повеления» сохраняет направляющий и обязательный характер, не смешивая его с מִצְוָה — «заповедью».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: יְשָׁרִים
  choice: праведны
  rationale: Прилагательное означает «прямые, правильные». В поэтическом описании Божьих повелений «праведны» естественно выражает их нравственную правильность, не сводя смысл только к юридической справедливости.
- source_word: מְשַׂמְּחֵי לֵב
  choice: радуют сердце
  rationale: Причастная конструкция описывает постоянное действие повелений. Русская форма сохраняет каузативный смысл — они делают сердце радостным — и параллелизм со второй половиной стиха.
- source_word: לֵב
  choice: сердце
  rationale: Сохраняется конкретный поэтический образ; в древнееврейском представлении сердце охватывает внутреннюю жизнь, включая чувства, мысль и волю.
- source_word: מִצְוַת
  choice: заповедь
  rationale: Единственное число сохранено и может пониматься собирательно или как представительное обозначение Божьего повеления. Оно также удерживает отличие от פִּקּוּדֵי.
- source_word: בָּרָה
  choice: чиста
  rationale: Основное значение прилагательного связано с чистотой. Вариант «ясна» возможен в свете следующей фразы о просветлении глаз, поэтому отмечен в сноске.
- source_word: מְאִירַת עֵינָיִם
  choice: просветляет глаза
  rationale: Каузативное причастие передаёт действие, дающее свет. Перевод сохраняет конкретный образ глаз и допускает связанные смыслы восприятия и оживления, не заменяя их одним толкованием.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» передаёт тетраграмматон как имя, тогда как «Господь» заменяет его титулом, а «Иегова» отражает более позднюю гибридную форму произношения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Сохранены параллелизм двух полустиший, конкретные образы сердца и глаз и различие между двумя еврейскими обозначениями Божьих предписаний.
