  text: שְׁגִיא֥וֹת מִֽי יָבִ֑ין מִֽ/נִּסְתָּר֥וֹת נַקֵּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/012.yaml
  text: Who can discern his errors? Clear me from hidden faults[a].
translation:
  language: ru
  text: Кто может распознать свои прегрешения? Очисти меня от скрытых грехов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от тайных грехов», «от сокрытых проступков» или «от скрытого». Еврейское выражение может указывать на проступки, скрытые от самого говорящего, от других людей, либо вообще на то, что остаётся сокрытым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁגִיאוֹת
  choice: прегрешения
  rationale: Слово обозначает ошибки, уклонения или проступки, совершённые по заблуждению. «Прегрешения» сохраняет нравственный смысл контекста, не уточняя сверх текста, что речь непременно идёт только о неумышленных грехах.
- source_word: מִי
  choice: кто
  rationale: Обычное вопросительное местоимение; здесь вводит риторический вопрос.
- source_word: יָבִין
  choice: может распознать
  rationale: Глагол означает понимать, различать, распознавать. Сочетание «может распознать» естественно передаёт мысль об ограниченной способности человека увидеть собственные прегрешения.
- source_word: מִנִּסְתָּרוֹת
  choice: от скрытых грехов
  rationale: Форма буквально означает «от скрытых [вещей]». Параллелизм с «прегрешениями» указывает на нравственный смысл, но не определяет, скрыты ли они от самого молящегося, от других людей или вообще остаются неявными.
- source_word: נַקֵּנִי
  choice: очисти меня
  rationale: Повелительная форма может выражать очищение, освобождение от вины или признание невиновным. «Очисти меня» естественно звучит по-русски и сохраняет связь как с нравственным очищением, так и со снятием вины.
theological_decisions:
- issue: Смысл «скрытого»
  choice: Скрытые грехи, без уточнения, от кого именно они скрыты
  alternative: Тайные грехи; сокрытые проступки; скрытые вещи вообще
  rationale: Параллелизм с «прегрешениями» делает нравственное значение наиболее вероятным. При этом перевод не решает, идёт ли речь о грехах, не осознанных самим псалмопевцем, утаённых от других или просто остающихся неявными.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью без архаизации. «Прегрешения» выбрано как понятное нравственное обозначение, а «может распознать» передаёт риторический смысл вопроса. Маркер сноски поставлен непосредственно после выражения, к которому относится.
