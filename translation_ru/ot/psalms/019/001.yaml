  text: הַ/שָּׁמַ֗יִם מְֽסַפְּרִ֥ים כְּבֽוֹד אֵ֑ל וּֽ/מַעֲשֵׂ֥ה יָ֝דָ֗י/ו מַגִּ֥יד הָ/רָקִֽיעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/019/001.yaml
  text: The heavens declare the glory of God[b][a], and the expanse proclaims the work of his hands.
translation:
  language: ru
  text: 'Небеса возвещают славу Бога,

    и небосвод[a] провозглашает дело его рук[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «твердь». Еврейское רָקִיעַ означает распростёртое небо или небесный свод.
    reason: lexical_alternative
  - marker: b
    text: Или «творение его рук».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: Сохраняет возвышенный поэтический регистр и широкий, космический смысл; «небо» могло бы восприниматься лишь как видимый небосвод.
- source_word: מְסַפְּרִים
  choice: возвещают
  rationale: Причастная форма глагола ספר передаёт продолжающееся рассказывание или провозглашение; «возвещают» естественно сочетается со «славой» и поддерживает олицетворение небес.
- source_word: כְּבוֹד
  choice: слава
  rationale: «Слава» является точным и привычным соответствием כבוד в контексте явленного величия и достоинства Бога.
- source_word: אֵל
  choice: Бог
  rationale: Здесь אֵל обозначает Бога как Творца; перевод «Бог» передаёт смысл без необязательной транслитерации титула как имени «Эль».
- source_word: וּמַעֲשֵׂה יָדָיו
  choice: дело его рук
  rationale: Передаёт единственное число מַעֲשֵׂה и сохраняет конкретный антропоморфный образ еврейского выражения.
- source_word: מַגִּיד
  choice: провозглашает
  rationale: Hiphil-причастие от נגד означает «делать известным, объявлять»; «провозглашает» сохраняет поэтический параллелизм с «возвещают».
- source_word: הָרָקִיעַ
  choice: небосвод
  rationale: Современное и понятное русское слово для распростёртого свода неба; оно лучше сохраняет образ רָקִיעַ, чем общее «небо».
theological_decisions:
- issue: Передача אֵל
  choice: Бог
  alternative: Эль
  rationale: В данном стихе контекст требует обозначения Бога-Творца, чью славу являют небеса. Перевод титулом «Бог» не навязывает тексту акцент на собственном имени, которого контекст не требует.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Структура двух параллельных строк сохранена; местоимение «его» дано со строчной буквы согласно обычной современной орфографии и без внесения конфессионального издательского обычая.
