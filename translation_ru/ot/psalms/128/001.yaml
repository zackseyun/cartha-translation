lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Сохраняет традиционную формулу надписания и конкретный образ מַעֲלוֹת — «восхождения», не фиксируя спорную историческую обстановку исполнения.
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Передаёт формулу провозглашения благополучия и полноты жизни в возвышенном, но понятном стиле; не сводит смысл к субъективному чувству счастья.
- source_word: כָּל
  choice: всякий
  rationale: Естественно передаёт распределительное значение «каждый» и согласуется с последующим причастием мужского рода единственного числа, имеющим обобщающий смысл.
- source_word: יְרֵא יְהוָה
  choice: кто боится Яхве
  rationale: Сохраняет характерное для библейской литературы выражение о благоговейном страхе перед Богом, не ослабляя его до одного лишь уважения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: הַהֹלֵךְ
  choice: кто ходит
  rationale: Сохраняет еврейскую этическую метафору пути и поведения, не заменяя её толкованием «живёт».
- source_word: בִּדְרָכָיו
  choice: Его путями
  rationale: Передаёт множественное число דֶּרֶךְ и нравственную метафору; местоимение естественно относится к Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Обобщающий смысл כָּל יְרֵא
  choice: всякий, кто боится
  alternative: все, кто боятся
  rationale: Выбор сохраняет единственное число исходной конструкции, при этом русское «всякий» имеет общий, а не исключительно мужской смысл.
- issue: Смысл אַשְׁרֵי
  choice: Блажен
  alternative: Счастлив
  rationale: «Блажен» сохраняет форму библейского провозглашения благополучия и не ограничивает смысл эмоциональным состоянием; допустимая лексическая альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим регистром. Синтаксический параллелизм и метафора хождения путями сохранены; местоимение «Его» написано с прописной буквы по принятой русской традиции благоговейного обозначения Бога.
