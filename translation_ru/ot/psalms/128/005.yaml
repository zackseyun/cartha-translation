id: PSA.128.5
reference: Psalms 128:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יְבָרֶכְ/ךָ֥ יְהוָ֗ה מִ/צִּ֫יּ֥וֹן וּ֭/רְאֵה בְּ/ט֣וּב יְרוּשָׁלִָ֑ם כֹּ֝֗ל יְמֵ֣י חַיֶּֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/005.yaml
  text: May Yahweh bless you from Zion[a], and may you see the prosperity of Jerusalem all the days of your life.
translation:
  language: ru
  text: Да благословит тебя Яхве с Сиона, и да увидишь ты благоденствие Иерусалима во все дни своей жизни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благо Иерусалима»; или: «благополучие Иерусалима».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: Да благословит тебя
  rationale: Форма imperfect 3 м. р. ед. ч. с суффиксом 2 м. р. ед. ч. в контексте благословения имеет желательное значение; конструкция с «да» естественно передаёт его по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: מִצִּיּוֹן
  choice: с Сиона
  rationale: Предлог מִן обозначает источник; русское «с Сиона» естественно передаёт благословение, исходящее оттуда.
- source_word: וּרְאֵה
  choice: и да увидишь ты
  rationale: Императив в последовательности благословений передан как дальнейшее пожелание, что сохраняет параллельный благословительный тон.
- source_word: בְּטוּב
  choice: благоденствие
  rationale: טוּב охватывает добро, благополучие и процветание; «благоденствие» выражает видимое общественное благополучие Иерусалима, не сводя смысл только к материальному достатку.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалима
  rationale: Устоявшаяся русская форма географического имени; родительный падеж обусловлен сочетанием «благоденствие Иерусалима».
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: во все дни своей жизни
  rationale: Формально и естественно передаёт еврейскую идиому продолжительности всей жизни адресата.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет его и не заменяет титулом.
- issue: Благословение «с Сиона»
  choice: Сохранить Сион как источник благословения без поясняющего расширения
  alternative: Раскрыть Сион как храмовый или мессианский центр
  rationale: Стих связывает благословение с Сионом и благоденствием Иерусалима, но сам не уточняет дальнейший богословский смысл.
- issue: Значение בְּטוּב יְרוּשָׁלִָם
  choice: благоденствие Иерусалима
  alternative: добро Иерусалима; благополучие Иерусалима
  rationale: Сохраняется широкий смысл добра и благополучия города без его неоправданного ограничения исключительно экономическим процветанием.
translation_notes:
  register: Современный литературный русский язык с достоинством благословительной формулы. Инверсия «да увидишь ты» поддерживает поэтический параллелизм, оставаясь понятной современному читателю.
