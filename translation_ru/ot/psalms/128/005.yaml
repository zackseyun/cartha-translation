  naturalness: Формула «Да благословит тебя ... и да увидишь ты ...» обладает уместным для псалма возвышенно-поэтическим, но понятным современному литературному русскому регистром. «С Сиона» естественно и сохраняет образ исходящего оттуда благословения.
  terminology: «Яхве» последовательно передаёт тетраграмматон как имя. Названия «Сион» и «Иерусалим» нормативны. «Благоденствие» не сужает значение טוּב до одного материального процветания; сноска корректно отмечает более буквальные и близкие варианты.
