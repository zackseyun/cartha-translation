lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождения
  rationale: Традиционно и достаточно буквально передаёт заголовок; множественное число в еврейском устойчиво выражает жанровое название цикла.
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Передаёт состояние благополучия и Божьего благоволения; альтернативный оттенок «счастлив» отмечен в сноске.
- source_word: יְרֵא
  choice: боится
  rationale: Сохраняет библейское понятие благоговейного страха без сведения его только к почтению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, записанное тетраграмматоном, а не заменяет его титулом.
- source_word: הַהֹלֵךְ בִּדְרָכָיו
  choice: кто ходит Его путями
  rationale: Сохраняет исходную метафору нравственной жизни и параллельную определительную конструкцию.
theological_decisions:
- issue: Смысл אַשְׁרֵי
  choice: Блажен
  alternative: Счастлив
  rationale: Основной текст сохраняет укоренённую библейскую формулу, а сноска указывает на заложенный в слове смысл счастья и благополучия.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя передано прямо; традиционная титульная замена приведена как возможный вариант в сноске.
translation_notes:
  register: Современный литературный русский с сохранением dignified библейского регистра. Формула «ходит Его путями» намеренно сохраняет ясную и привычную библейскую метафору.
