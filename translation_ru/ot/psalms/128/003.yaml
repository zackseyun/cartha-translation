base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/003.yaml
  text: Your wife will be like a fruitful vine in the recesses of your house[b][a]; your children will be like olive shoots around your table.
translation:
  language: ru
  text: Жена твоя будет как плодоносная виноградная лоза в глубине твоего дома; сыновья твои[a] — как молодые оливковые деревца вокруг твоего стола.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети твои», если слово мужского рода понимать как обобщённое обозначение потомства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתְּךָ
  choice: жена твоя
  rationale: Обычное обозначение жены в брачном и семейном контексте; сохраняет обращение во втором лице.
- source_word: כְּגֶפֶן פֹּרִיָּה
  choice: как плодоносная виноградная лоза
  rationale: Передаёт сравнительную частицу, сельскохозяйственный образ и мотив плодородия; «виноградная лоза» естественнее и точнее одного слова «лоза».
- source_word: בְּיַרְכְּתֵי בֵיתֶךָ
  choice: в глубине твоего дома
  rationale: יַרְכְּתֵי указывает на внутренние, удалённые части дома. Формулировка сохраняет пространственный образ без неестественной буквальности.
- source_word: בָּנֶיךָ
  choice: сыновья твои
  rationale: В еврейском тексте стоит конкретное существительное мужского рода во множественном числе — «сыновья»; возможное обобщённое понимание отмечено в сноске.
- source_word: כִּשְׁתִלֵי זֵיתִים
  choice: как молодые маслины
  rationale: שְׁתִלֵי обозначает посаженные молодые растения или саженцы. «Молодые маслины» естественно передаёт образ растущих оливковых деревьев по-русски.
- source_word: סָבִיב לְשֻׁלְחָנֶךָ
  choice: вокруг твоего стола
  rationale: Прямо и естественно передаёт пространственное расположение семьи вокруг стола.
theological_decisions:
- issue: Гендерно маркированное обозначение потомства
  choice: сыновья твои
  alternative: дети твои
  rationale: Основной текст сохраняет грамматически и лексически выраженное значение «сыновья», не снимая гендерную конкретность оригинала. Сноска указывает на возможность представительного употребления в отношении потомства вообще.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной псалмовой интонацией. Параллелизм двух семейных образов сохранён; порядок «жена твоя / сыновья твои» поддерживает достоинство и ритм стиха.
