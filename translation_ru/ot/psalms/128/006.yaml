lexical_decisions:
- source_word: וּרְאֵה
  choice: И да увидишь
  rationale: Императивная форма в контексте заключительного благословения естественно передаётся по-русски как благопожелание; союз וּ сохранён словом «и».
- source_word: בָנִים לְבָנֶיךָ
  choice: детей у детей твоих
  rationale: Буквально «сыновей у твоих сыновей»; выражение обозначает потомков следующего поколения. Такая формулировка сохраняет образ и звучит понятнее, чем буквальное сочетание.
- source_word: שָׁלוֹם
  choice: Мир
  rationale: «Мир» — прямой и традиционный эквивалент, способный в контексте благословения включать благополучие, целостность и процветание.
- source_word: עַל יִשְׂרָאֵל
  choice: Израилю
  rationale: Русская дательная конструкция естественно передаёт краткую формулу пожелания «мир Израилю», не добавляя отсутствующего в еврейском тексте глагола.
theological_decisions:
- issue: Объём заключительного благословения
  choice: Сохранить прямое указание на Израиль
  alternative: Расширить значение до богослужебной общины вообще или типологически отнести его к Церкви
  rationale: В еврейском тексте прямо назван Израиль; перевод не должен вносить в основной текст более позднее богословское расширение.
- issue: Характер первой фразы
  choice: Передать как благопожелание
  alternative: Передать как повеление «и увидь» или предсказание «и увидишь»
  rationale: Контекст псалма и форма заключительной речи поддерживают благословляющий оттенок, при этом конструкция «да увидишь» сохраняет формальную связь с императивом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, благословляющим звучанием. Инверсия «детей твоих» поддерживает поэтический регистр, оставаясь понятной современному читателю.
