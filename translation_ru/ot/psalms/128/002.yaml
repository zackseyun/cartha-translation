  text: יְגִ֣יעַ כַּ֭פֶּי/ךָ כִּ֣י תֹאכֵ֑ל אַ֝שְׁרֶ֗י/ךָ וְ/ט֣וֹב לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/128/002.yaml
  text: For you will eat the labor of your hands[a]; blessed are you[b], and it will be well with you.
translation:
  language: ru
  text: Ты будешь есть плоды труда своих рук[a]; блажен ты[b], и будет тебе хорошо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «труд твоих рук». Здесь «труд» может означать добытое или произведённое трудом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «счастлив ты»; «благополучен ты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: добытое трудом своих рук
  rationale: Еврейское сочетание буквально означает «труд твоих рук», но יְגִיעַ может обозначать также результат тяжёлого труда. Русская формулировка сохраняет образ собственного ручного труда и естественно передаёт мысль о том, что человек пользуется добытым им пропитанием.
- source_word: כִּי
  choice: когда
  rationale: 'В этой синтаксической позиции союз естественно понимать как временной: благополучие человека проявляется, когда он ест добытое собственным трудом. Возможен и пояснительный оттенок «ибо».'
- source_word: תֹאכֵל
  choice: ты будешь есть
  rationale: Имперфект передан будущим временем как ожидаемое положение дел; конкретный образ принятия пищи сохранён.
- source_word: אַשְׁרֶיךָ
  choice: блажен ты
  rationale: «Блажен» соответствует формуле אַשְׁרֵי в библейской литературе мудрости и выражает благополучное, достойное похвалы состояние, не сводя его к эмоциональному счастью.
- source_word: וְטוֹב לָךְ
  choice: и благо тебе
  rationale: Краткая русская формула близко передаёт обещание добра и благополучия, сохраняя параллелизм и возвышенную лаконичность оригинала.
theological_decisions:
- issue: Передача формулы блаженства в контексте литературы мудрости
  choice: блажен ты
  alternative: счастлив ты; благополучен ты
  rationale: «Блажен» сохраняет традиционную библейскую формулу и её смысл полноты благополучия перед Богом, тогда как «счастлив» может быть понято преимущественно как обозначение чувства.
- issue: Связь труда и благополучия
  choice: Сохранено прямое утверждение о пользовании добытым собственным трудом без превращения его во всеобщую доктрину воздаяния
  alternative: Истолковать стих как безусловное обещание материального успеха
  rationale: Стих выражает мудростное благословение в контексте страха перед Господом; перевод не усиливает его до универсальной гарантии материального достатка.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Порядок слов и краткое «благо тебе» сохраняют поэтический параллелизм; местоимение «ты» передаёт обращение в единственном числе.
