lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание и вводит подчёркнутое утверждение; «вот» сохраняет возвышенную поэтическую силу и естественно звучит по-русски.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте это обычное обозначение единого Бога, выступающего субъектом предложения.
- source_word: עֹזֵר לִי
  choice: мой помощник
  rationale: Причастие от עזר употреблено предикативно и обозначает личного помощника; сочетание с לִי естественно передаётся русским притяжательным оборотом.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Божественный титул передан традиционным и понятным русским соответствием; здесь это не имя יהוה и не обращение к человеческому господину.
- source_word: בְּסֹמְכֵי
  choice: среди тех, кто поддерживает
  rationale: Сохранено наиболее непосредственное понимание предлога בְּ как указания на нахождение среди или принадлежность к группе, а множественное причастие передано личной конструкцией. Синтаксическая трудность отмечена в сноске.
- source_word: נַפְשִׁי
  choice: мою жизнь
  rationale: В контексте избавления от врагов נֶפֶשׁ обозначает жизнь или самого человека, а не исключительно нематериальную душу; «жизнь» естественно выражает смысл сохранения псалмопевца.
theological_decisions:
- issue: Передача אֲדֹנָי как божественного титула
  choice: Господь
  alternative: Владыка
  rationale: «Господь» сохраняет вес божественного титула и соответствует современному литературному и библейскому русскому употреблению, не превращая титул в личное имя.
- issue: Синтаксическая связь אֲדֹנָי בְּסֹמְכֵי נַפְשִׁי
  choice: Господь — среди тех, кто поддерживает мою жизнь
  alternative: Господь поддерживает мою жизнь
  rationale: Основной текст сохраняет множественное число причастия и возможное значение предлога «среди». Поскольку еврейский синтаксис труден и допускает понимание Господа как непосредственного поддерживающего, эта возможность не исключена, а вынесена в сноску.
- issue: Смысл נַפְשִׁי
  choice: мою жизнь
  alternative: мою душу; меня самого
  rationale: Контекст говорит о сохранении человека перед лицом опасности. «Жизнь» не навязывает более узкого антропологического понимания слова «душа», а лексическая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Конструкция «Бог — мой помощник» ясна и торжественна; несколько необычная вторая половина намеренно сохраняет синтаксическую напряжённость еврейского текста, а не устраняет её без пояснения.
