    reason: lexical_alternative
lexical_decisions:
- source_word: ישוב
  choice: Пусть ... обратится
  rationale: 'Qal imperfect 3-го лица ед. числа допускает как изъявительное «обратится», так и волитивное прочтение. В молитвенном контексте и перед последующим повелительным глаголом естественно передать его как пожелание: «пусть ... обратится».'
- source_word: הָרַע
  choice: зло
  rationale: Слово רַע может обозначать зло, беду или вред. «Зло» сохраняет краткость оригинала и не устраняет ни нравственного, ни воздаятельного оттенка.
- source_word: לְשֹׁרְרָי
  choice: на моих противников
  rationale: Слово обозначает враждебных оппонентов. «Противники» звучит естественно и не сужает смысл до военных врагов; предлог «на» передаёт направленность возвращающегося зла.
- source_word: בַּאֲמִתְּךָ
  choice: по верности Твоей
  rationale: אֱמֶת охватывает значения истины, надёжности и верности. В обращении к Богу «верность» передаёт Его надёжность, а «по» естественно выражает основание или меру действия, не исключая инструментального оттенка.
- source_word: הַצְמִיתֵם
  choice: истреби их
  rationale: Hiphil imperative 2-го лица ед. числа с суффиксом 3-го лица мн. числа от צמת выражает сильное требование уничтожить, положить конец. «Истреби» прямо сохраняет силу императива и поэтический регистр.
theological_decisions:
- issue: Сила проклятия и форма высказывания
  choice: Передать первую строку как молитвенное пожелание Божьего воздаяния, а вторую — как прямую просьбу об истреблении противников.
  alternative: «Зло обратится на моих противников; по верности Твоей Ты истребишь их».
  rationale: Первый глагол грамматически допускает изъявительное и волитивное прочтение, но следующий за ним императив и молитвенное обращение поддерживают пожелание. Резкость просьбы не смягчается, чтобы сохранить богословское напряжение текста.
- issue: Значение Божьей אֱמֶת
  choice: «по верности Твоей»
  alternative: «по истине Твоей»
  rationale: В данном контексте слово может обозначать и истину, и надёжную верность Бога. Основной текст выбирает контекстуально естественное «верность», а примечание сохраняет лексическую альтернативу.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Местоимение обращения к Богу написано с прописной буквы в соответствии с принятой русской библейской традицией. Синтаксис остаётся кратким и параллельным оригиналу; импрекативная сила не смягчена.
