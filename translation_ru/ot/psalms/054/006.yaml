  text: May evil return upon my adversaries[a]; in your faithfulness[b], destroy them.
translation:
  language: ru
  text: Пусть зло обратится на моих противников[a]; в верности Твоей[b] истреби их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Зло обратится на моих противников». Первый глагол можно понимать не как пожелание, а как утверждение.'
