  text: 'Когда зифеи пришли и сказали Саулу: «Разве Давид не скрывается у нас[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с нами». Буквально по-еврейски — «с нами»; выражение «у нас» передаёт мысль о том, что Давид скрывался в местности или среди людей зифеев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא
  choice: когда ... пришли
  rationale: Предлог ב при инфинитиве конструктивной формы בוא образует придаточное времени; эта формулировка естественно передаёт его по-русски.
- source_word: הַזִּיפִים
  choice: зифеи
  rationale: Форма обозначает жителей Зифа; «зифеи» — краткое и традиционное русское наименование этой группы.
- source_word: וַיֹּאמְרוּ
  choice: и сказали
  rationale: Нарративная форма глагола אמר передаёт последовательное действие; простой союз сохраняет структуру исходного текста.
- source_word: לְשָׁאוּל
  choice: Саулу
  rationale: Предлог ל обозначает адресата речи; имя передано в принятой русской библейской форме.
- source_word: הֲלֹא
  choice: разве ... не
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; русская конструкция сохраняет эту прагматику.
- source_word: דָוִד
  choice: Давид
  rationale: Принятая русская форма имени.
- source_word: מִסְתַּתֵּר
  choice: скрывается
  rationale: Причастная форма породы хитпаэль выражает продолжающееся действие, направленное на сокрытие себя; настоящее время естественно передаёт этот смысл.
- source_word: עִמָּנוּ
  choice: у нас
  rationale: Буквально выражение значит «с нами», но в данном контексте речь идёт о пребывании Давида в местности или среде говорящих; «у нас» сохраняет пространственно-групповую неоднозначность и звучит естественно.
