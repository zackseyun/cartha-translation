lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: В контексте молитвенного обращения русская звательная форма «Боже» естественно и точно передаёт прямое обращение, хотя в древнееврейском отдельной звательной формы нет.
- source_word: בְּשִׁמְךָ
  choice: именем Твоим
  rationale: Творительный падеж сохраняет инструментальное значение предлога ב; «имя» указывает на явленную сущность, славу и верность Бога, не разворачивая ёмкое выражение толковательно.
- source_word: הוֹשִׁיעֵנִי
  choice: спаси меня
  rationale: Прямое соответствие форме породы хифиль от ישׁע; выражает просьбу о спасении или избавлении и сохраняет широкий смысл исходного слова.
- source_word: וּבִגְבוּרָתְךָ
  choice: и силой Твоей
  rationale: גְּבוּרָה обозначает силу и могущество. «Силой» звучит естественно в современном русском и сохраняет инструментальный параллелизм с «именем Твоим».
- source_word: תְדִינֵנִי
  choice: оправдай меня
  rationale: Глагол דִּין может означать «судить», но в просьбе о правосудии против врагов речь, вероятнее всего, идёт о благоприятном судебном решении — признании правоты молящегося.
theological_decisions:
- issue: Смысл просьбы תְדִינֵנִי в связи с Божьим правосудием
  choice: оправдай меня
  alternative: суди меня; защити моё дело
  rationale: Контекст предполагает просьбу не просто о нейтральном разбирательстве, а о восстановлении справедливости и признании правоты молящегося. В сноске сохранён более буквальный судебный смысл и возможная альтернатива.
