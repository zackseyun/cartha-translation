base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[b] of David[a].'
translation:
  language: ru
  text: Руководителю хора. В сопровождении струнных инструментов. Маскил[b] Давида[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давидов», «Давиду» или «написанный Давидом»; еврейское надписание может указывать на авторство, посвящение, принадлежность или связь с Давидом.'
    reason: alternative_reading
  - marker: b
    text: «Маскил» — еврейский специальный термин в заголовках псалмов; вероятно, он обозначает вид произведения или способ его исполнения, но точный смысл неизвестен.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов слово обозначает человека, руководящего музыкальным исполнением. Этот вариант естественен для современного русского языка и передаёт литургико-музыкальную функцию.
- source_word: בִּנְגִינֹת
  choice: В сопровождении струнных инструментов
  rationale: Форма с предлогом указывает на музыкальное сопровождение; существительное в данном заголовке связано со струнными инструментами. Перевод ясно и естественно выражает способ исполнения.
- source_word: מַשְׂכִּיל
  choice: Маскил
  rationale: Это специальный термин в заголовках псалмов, точное значение которого остаётся неясным. Транслитерация не навязывает спорного толкования вроде «поучительная» или «созерцательная песнь».
- source_word: לְדָוִד
  choice: Давида
  rationale: Еврейская конструкция может указывать на авторство, принадлежность, посвящение или связь с Давидом. Русский родительный падеж в кратком заголовке позволяет не сводить её значение исключительно к авторству.
theological_decisions:
- issue: Смысл указания לְדָוִד в надписании
  choice: Давида
  alternative: Давидов; Давиду; написанный Давидом
  rationale: Надписание может обозначать авторство, принадлежность, посвящение или иную связь с Давидом. Основной текст сохраняет эту неоднозначность, а примечание делает её явной.
translation_notes:
  register: Современный литературный русский язык; краткая форма надписания сохранена. Формулировка «в сопровождении» звучит естественно и не устраняет музыкальный смысл. Неясный технический термин передан транслитерацией, а неоднозначность связи с Давидом сохранена.
