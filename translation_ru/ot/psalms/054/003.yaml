  text: Боже, услышь мою молитву, внемли словам моих уст.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Слово употреблено как прямое обращение; русский звательный оборот естественно передаётся формой «Боже».
- source_word: שְׁמַע
  choice: услышь
  rationale: Императив в молитвенном контексте означает не просто восприятие звука, а внимательное принятие просьбы; «услышь» сохраняет традиционную и понятную библейскую формулу.
- source_word: תְּפִלָּתִי
  choice: мою молитву
  rationale: Обычное значение существительного — «молитва»; форма с суффиксом первого лица означает «мою молитву».
- source_word: הַאֲזִינָה
  choice: внемли
  rationale: Императив выражает внимательное слушание. «Внемли» сохраняет возвышенный поэтический регистр и отличается от параллельного «услышь», не становясь непонятным современному читателю.
- source_word: לְאִמְרֵי
  choice: словам
  rationale: Конструктивное множественное число אֵמֶר здесь естественно означает «слова», а предлог ל передаётся управлением глагола «внимать».
- source_word: פִי
  choice: моих уст
  rationale: Буквально — «моего рта». В русском поэтическом и библейском регистре «слова моих уст» естественно сохраняет конкретный образ исходного текста.
