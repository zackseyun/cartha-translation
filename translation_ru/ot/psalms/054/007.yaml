  text: בִּ/נְדָבָ֥ה אֶזְבְּחָה לָּ֑/ךְ א֤וֹדֶה שִּׁמְ/ךָ֖ יְהוָ֣ה כִּי טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/007.yaml
  text: I will sacrifice a freewill offering to you[a]; I will give thanks to your name, O Yahweh[c][b], for it is good.
translation:
  language: ru
  text: Я принесу Тебе добровольную жертву[a]; буду славить имя Твоё, Яхве[b], ибо оно благо[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добровольно принесу Тебе жертву».'
    reason: lexical_alternative
  - marker: b
    text: Евр. יהוה (YHWH), личное имя Бога; традиционно переводится «Господь».
    reason: lexical_alternative
  - marker: c
    text: 'Еврейский текст буквально не называет подлежащего: «ибо благо». Возможно также: «ибо Ты благ» или «ибо Он благ», то есть речь может идти непосредственно о Яхве, а не о Его имени.'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּנְדָבָה
  choice: добровольно
  rationale: Существительное נְדָבָה в сочетании с глаголом жертвоприношения может обозначать добровольное приношение или иметь наречный оттенок — «добровольно». Русское «добровольно принесу жертву» естественно и сохраняет обе смысловые стороны; более предметное понимание отмечено в сноске.
- source_word: אֶזְבְּחָה
  choice: принесу жертву
  rationale: Глагол זבח означает совершить жертвоприношение. В современном литературном русском «принесу жертву» звучит естественнее, чем буквальное «пожертвую», и сохраняет культовый смысл.
- source_word: לָּךְ
  choice: Тебе
  rationale: Предлог ל־ обозначает адресата жертвы; в молитвенном обращении естественно «Тебе».
- source_word: אוֹדֶה
  choice: буду славить
  rationale: Глагол ידה в породе Hiphil охватывает благодарение, исповедание и хвалу. При прямом дополнении «имя Твоё» русское «славить» звучит естественно, не сводя значение только к словесной благодарности.
- source_word: שִׁמְךָ
  choice: имя Твоё
  rationale: Сохранено явное упоминание имени как выражение открытого Богом характера и славы; оно не заменено местоимением «Тебя».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное божественное имя, представленное тетраграмматоном, а не заменено титулом «Господь».
- source_word: כִּי טוֹב
  choice: ибо оно благо
  rationale: В еврейском нет выраженного подлежащего. Местоимение среднего рода естественно связывает определение с ближайшим словом «имя», а «благо» сохраняет краткость и возвышенный регистр.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Основной текст сохраняет личное имя за тетраграмматоном; традиционная замена титулом возможна, но менее непосредственно отражает исходный текст.
- issue: К чему относится טוֹב в כִּי טוֹב
  choice: «оно благо» — об имени Яхве
  alternative: «Он благ» — о Яхве
  rationale: Еврейская фраза не выражает подлежащего и допускает оба понимания. Основной текст связывает прилагательное с ближайшим «имя Твоё», а богословски значимая альтернатива сохранена в сноске.
- issue: Характер жертвы в בִּנְדָבָה
  choice: добровольный образ действия
  alternative: добровольное приношение как вид жертвы
  rationale: Форма допускает наречное понимание и указание на особый вид приношения. Перевод не устраняет эту неоднозначность, а предметное прочтение приводит в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-поэтической речи. Формы «Тебе», «Твоё» передают прямое обращение; инверсия «имя Твоё» сохраняет псалмический ритм без чрезмерной архаизации. Все сноски обозначены в основном тексте.
