  text: כִּ֤י זָרִ֨ים קָ֤מוּ עָלַ֗/י וְֽ֭/עָרִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י לֹ֤א שָׂ֨מוּ אֱלֹהִ֖ים לְ/נֶגְדָּ֣/ם סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/004.yaml
  text: For strangers have risen against me[a], and ruthless men seek my life; they do not set God before them[c][b]. Selah
translation:
  language: ru
  text: 'Ибо чужие[a] восстали против меня,

    и жестокие люди[b] посягают на мою жизнь[c];

    они не ставят Бога перед собой.

    Села.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «иноземцы». Еврейское слово может обозначать чужих, посторонних или иноземцев.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «люди насилия» или «безжалостные люди».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «ищут моей души»; здесь «душа» означает жизнь самого псалмопевца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание предшествующей мольбы; «ибо» сохраняет причинную связь и уместен в современной возвышенной поэтической речи.
- source_word: זָרִים
  choice: чужие
  rationale: Слово может обозначать чужаков, посторонних или иноземцев. «Чужие» сохраняет эту широту и не утверждает без необходимости, что речь именно об этнических иностранцах.
- source_word: קָמוּ עָלַי
  choice: восстали против меня
  rationale: Сохраняет образ вставания и ясно передаёт враждебное выступление против говорящего.
- source_word: עָרִיצִים
  choice: жестокие люди
  rationale: Передаёт значение безжалостных, насильственных и притесняющих людей естественным современным русским выражением.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: посягают на мою жизнь
  rationale: В контексте смертельной угрозы נֶפֶשׁ означает жизнь самого говорящего. «Посягают на мою жизнь» естественно передаёт намерение врагов убить его.
- source_word: לֹא שָׂמוּ אֱלֹהִים לְנֶגְדָּם
  choice: они не ставят Бога перед собой
  rationale: Формулировка сохраняет еврейскую пространственную метафору и выражает сознательное отсутствие Бога в их поле зрения, не сводя смысл к одной интерпретации.
- source_word: סֶלָה
  choice: Села
  rationale: Неясный литургический или музыкальный термин сохранён в традиционной транслитерации, а не истолкован предположительно.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ в контексте смертельной угрозы
  choice: «жизнь»
  alternative: «душа»
  rationale: Здесь враги угрожают самому существованию псалмопевца; «жизнь» передаёт конкретный смысл слова, не привнося в текст позднейшее противопоставление души и тела.
- issue: Смысл отсутствия Бога «перед ними»
  choice: 'Сохранена метафора: «не ставят Бога перед собой»'
  alternative: «не считаются с Богом»
  rationale: Более истолковывающий вариант верно указывает на нравственное пренебрежение, но устраняет исходный образ. Сохранение метафоры оставляет её смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмодическим звучанием. Параллелизм строк и исходная метафора сохранены; архаические обороты используются только там, где они остаются понятными и естественными.
