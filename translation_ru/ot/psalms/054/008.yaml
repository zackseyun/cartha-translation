  text: כִּ֣י מִ/כָּל צָ֭רָה הִצִּילָ֑/נִי וּ֝/בְ/אֹיְבַ֗/י רָאֲתָ֥ה עֵינִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/054/008.yaml
  text: For he has delivered me from every trouble[a], and my eye has looked on my enemies.
translation:
  language: ru
  text: Ведь Он избавил меня от всякой беды, и око моё увидело врагов моих.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и око моё смотрело на врагов моих»; возможно, подразумевается их поражение или оправдание псалмопевца перед ними.'
    reason: Лексическая альтернатива и сохранение неявного контекстуального смысла оборота רָאֲתָה עֵינִי בְּאֹיְבַי.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-обосновывающую силу союза в связи с предшествующим обещанием хвалы; звучит естественно в современном русском.
- source_word: מִכָּל צָרָה
  choice: от всякой беды
  rationale: Сохраняет распределительное значение כָּל с предлогом מִן. «Беда» естественно и достаточно широко передаёт צָרָה как бедствие или тяжёлое положение.
- source_word: הִצִּילָנִי
  choice: Он избавил меня
  rationale: Передаёт каузативное значение Hiphil глагола נצל — вызволить, избавить. Прошедшее совершённого вида соответствует завершённому действию еврейского перфекта.
- source_word: וּבְאֹיְבַי
  choice: и ... врагов моих
  rationale: При ראה предлог בְּ допускает обозначение объекта зрения. В русском прямое дополнение естественнее и не добавляет прямо не выраженных значений поражения или торжества.
- source_word: רָאֲתָה עֵינִי
  choice: око моё увидело
  rationale: Сохранён образный еврейский оборот, где «око» является подлежащим. «Увидело» непосредственно передаёт ראה и оставляет открытым, что именно подразумевает вид врагов.
theological_decisions:
- issue: Подразумеваемый смысл того, что псалмопевец увидел врагов
  choice: «око моё увидело врагов моих» — без добавления их поражения, гибели или торжества псалмопевца
  alternative: «око моё увидело падение врагов моих»; «я с торжеством смотрел на врагов моих»
  rationale: Еврейский текст прямо говорит лишь о видении врагов. Контекст может подразумевать избавление и оправдание псалмопевца, однако конкретный исход для врагов не назван, поэтому двусмысленность сохранена.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой образностью. «Око моё» намеренно сохраняет яркий образ оригинала; синтаксис остаётся понятным обычному читателю.
