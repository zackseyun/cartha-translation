lexical_decisions:
- source_word: חָנֵּנִי
  choice: Будь милостив ко мне
  rationale: Повелительная форма породы пиэль от חנן с суффиксом первого лица выражает просьбу о Божьей милости и благоволении. Этот вариант сохраняет смысл без обязательного покаянного оттенка слова «помилуй».
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма русского звательного обращения естественно передаёт прямое обращение к Богу.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание просьбы и естественно связывает строки молитвы.
- source_word: שְׁאָפַנִי
  choice: жадно преследует меня
  rationale: Глагол שׁאף передаёт образ тяжёлого дыхания, сопения и отсюда — алчного, враждебного преследования. Выбранный вариант естественен по-русски и сохраняет образ настойчивой враждебности; конкретные возможные оттенки вынесены в примечание.
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Существительное обозначает смертного, немощного человека; единственное число сохранено, поскольку в строке противник представлен как отдельный человек.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Естественная современная передача обстоятельства продолжительности.
- source_word: לֹחֵם
  choice: сражаясь
  rationale: Причастие от לחם передано деепричастием как обстоятельство сопутствующего непрерывного враждебного действия.
- source_word: יִלְחָצֵנִי
  choice: он теснит меня
  rationale: Глагол לחץ означает давить, притеснять, теснить. «Теснит» сохраняет конкретный образ давления и хорошо сочетается с военным контекстом.
theological_decisions:
- issue: Передача אֱנוֹשׁ и противопоставление человека Богу
  choice: человек
  alternative: смертный
  rationale: «Человек» сохраняет грамматическое единственное число и обозначение конкретного противника, не превращая его в человечество вообще. Оттенок человеческой смертности присутствует в еврейском слове, но в основном тексте «смертный» звучал бы менее естественно.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Синтаксис краток и пригоден для псалмового параллелизма; архаические формы избегаются, кроме естественного обращения «Боже».
