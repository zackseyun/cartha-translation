    reason: lexical_alternative
  - marker: c
    text: 'Или: «в свете живых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт обосновывающую связь с предыдущим контекстом и естественно звучит в русском поэтическом благодарении.
- source_word: הִצַּלְתָּ
  choice: Ты избавил
  rationale: Hифиль перфекта נצל обозначает совершённое спасительное действие; «избавил» сохраняет традиционную торжественность без архаизации.
- source_word: נַפְשִׁי
  choice: душу мою
  rationale: Сохраняет многозначность נֶפֶשׁ — душа, жизнь, сам человек — и поэтический образ; возможное значение «жизнь» вынесено в примечание.
- source_word: מִמָּוֶת
  choice: от смерти
  rationale: Прямо передаёт угрозу или власть смерти.
- source_word: הֲלֹא
  choice: не Ты ли и
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ, и связь второго избавления с первым.
- source_word: רַגְלַי
  choice: ноги мои
  rationale: Сохраняет конкретный образ исходного текста и связь с последующим хождением.
- source_word: מִדֶּחִי
  choice: от падения
  rationale: דֶּחִי может обозначать падение, спотыкание или низвержение; «падение» естественно сочетается с образом сохранённых ног.
- source_word: לְהִתְהַלֵּךְ
  choice: чтобы я ходил
  rationale: Передаёт целевое значение инфинитива с ל и продолжительный образ жизненного пути.
- source_word: לִפְנֵי אֱלֹהִים
  choice: пред Богом
  rationale: Кратко и торжественно передаёт буквальное значение «перед лицом/в присутствии Бога».
- source_word: בְּאוֹר הַחַיִּים
  choice: во свете жизни
  rationale: Сохраняет поэтический образ и наиболее прямо отражает форму הַחַיִּים; альтернативное понимание отмечено в сноске.
theological_decisions:
- issue: Антропологический оттенок נַפְשִׁי
  choice: душу мою
  alternative: жизнь мою; меня
  rationale: Контекст не требует технического разделения души и тела. Буквальный поэтический оборот сохранён, а более широкое значение всего человека или его жизни указано в примечании.
- issue: Значение בְּאוֹר הַחַיִּים
  choice: во свете жизни
  alternative: в свете живых
  rationale: Выбран вариант, наиболее непосредственно соответствующий данной еврейской форме, без устранения возможного идиоматического смысла жизни среди живых.
translation_notes:
  register: Современный литературный русский с умеренно торжественным псалмическим звучанием. Инверсия «душу мою», «ноги мои» и форма «пред Богом» поддерживают поэтический регистр, оставаясь понятными современному читателю. Тире отмечает крупную смысловую границу после первого утверждения, а риторический вопрос исходного текста сохранён.
