base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/007.yaml
  text: Because of iniquity[a], do not let them escape; in anger bring down the peoples[b], O God.
translation:
  language: ru
  text: За их беззаконие не дай им ускользнуть[a]; во гневе низложи народы[b], Боже.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «За беззаконие не избавляй их». Еврейская фраза трудна: глагол может означать «избавь, спаси» или «дай избежать», а отрицание в тексте явно не выражено; возможно и вопросительное понимание: «Неужели им удастся избежать [суда] благодаря беззаконию?»'
    reason: alternative_reading
  - marker: b
    text: 'Или: «племена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל אָוֶן
  choice: за беззаконие
  rationale: Предлог עַל здесь естественно понимать как указывающий на основание суда, а אָוֶן — как нравственное зло и виновность. «За беззаконие» кратко и естественно передаёт эту причинную связь.
- source_word: פַּלֶּט לָמוֹ
  choice: не дай им спастись
  rationale: Глагол פלט связан со спасением или избавлением. В контексте молитвы о суде выражение передано как просьба не позволить нечестивым избежать возмездия; поскольку отрицание в еврейском тексте прямо не выражено, неоднозначность отмечена в сноске.
- source_word: בְּאַף
  choice: во гневе
  rationale: אַף в данном сочетании означает гнев. Притяжательное «Твоём» не добавлено, так как в еврейском тексте оно не выражено.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число עַמִּים обозначает народы; это значение сохранено без сужения до отдельных политических государств.
- source_word: הוֹרֵד
  choice: низложи
  rationale: Каузативный императив от ירד буквально призывает заставить народы сойти вниз; «низложи» сохраняет образ унижения и передаёт смысл их свержения в естественном русском библейском стиле.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма обращения в конце прошения естественно передаётся русским звательным обращением «Боже».
theological_decisions:
- issue: Просьба о суде и подразумеваемое отрицание в трудной первой строке
  choice: Первая строка передана как просьба к Богу не позволить виновным спастись от суда.
  alternative: «За беззаконие не спасай их»; возможно также понимание без подразумеваемого отрицания, поскольку еврейская фраза синтаксически сжата.
  rationale: В еврейском тексте отрицательная частица отсутствует, однако контекст псалма и параллельная просьба низложить народы поддерживают значение отрицательного прошения. Сноска сохраняет существенную неоднозначность и не выдаёт контекстуальное толкование за бесспорную грамматику.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. «Низложи» выбрано как понятное возвышенное слово, сохраняющее метафору нисхождения; синтаксис остаётся кратким и напряжённым, как в еврейском стихе.
