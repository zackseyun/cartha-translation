  text: They gather together[a]; they hide themselves; they watch my steps[d][c][b], as they wait for my life.
translation:
  language: ru
  text: Они собираются[a], прячутся и следят за моими шагами[b], поджидая меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также значения: «они нападают» или «они возбуждают распри». В данном враждебном контексте вероятнее всего речь идёт о совместном сборе противников.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «мои пятки»; то есть мои шаги или передвижения.'
    reason: idiom
  - marker: c
    text: 'Буквально: «как они ждали моей жизни». Глагол обычно означает «ждать» или «надеяться», но в данном враждебном контексте может подразумевать ожидание удобного случая. Слово «жизнь» также может означать самого человека.'
    reason: source_ambiguity
lexical_decisions:
- source_word: יָגוּרוּ
  choice: сбиваются вместе
  rationale: В данном враждебном контексте форма глагола גור обозначает совместное собирание противников. «Сбиваются вместе» естественно передаёт их сплочение, не добавляя прямого указания на нападение.
- source_word: יצפינו
  choice: прячутся
  rationale: 'Глагол צפן здесь имеет контекстуально возвратный смысл: враги скрываются, вероятно ради засады. «Прячутся» ясно и естественно передаёт основное значение.'
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение подчёркивает действующих лиц. В русском это выражено явным «они» в начале цепочки действий.
- source_word: עֲקֵבַי
  choice: моими шагами
  rationale: Буквально — «моими пятами», но в данном контексте речь идёт о выслеживании передвижений псалмопевца. Русское «следят за моими шагами» сохраняет образ и звучит естественно.
- source_word: יִשְׁמֹרוּ
  choice: следят
  rationale: שמר здесь означает не охрану ради защиты, а пристальное наблюдение за человеком во враждебных целях.
- source_word: כַּאֲשֶׁר
  choice: поджидая
  rationale: Связь между наблюдением и ожиданием передана русским деепричастным оборотом как характеристика одновременного враждебного действия; буквальное «как» в русском создало бы неясное или неестественное сравнение.
- source_word: קִוּוּ
  choice: поджидая
  rationale: קוה обычно означает ожидание или надежду, но здесь контекст явно враждебный. «Поджидая» сохраняет идею ожидания и передаёт угрозу без чрезмерного усиления до прямого нападения.
- source_word: נַפְשִׁי
  choice: меня, чтобы лишить жизни
  rationale: נפש здесь обозначает жизнь или самого человека как живое существо. Развёрнутая русская формулировка естественно выражает намерение врагов посягнуть на жизнь псалмопевца.
theological_decisions:
- issue: Значение נַפְשִׁי в контексте угрозы
  choice: меня, чтобы лишить жизни
  alternative: мою душу
  rationale: Здесь речь идёт прежде всего о физической жизни псалмопевца, а не о противопоставлении души и тела. Выбор не вводит антропологического толкования, отсутствующего в контексте.
- issue: Связь כַּאֲשֶׁר קִוּוּ с предшествующим наблюдением
  choice: 'передать как одновременное враждебное ожидание: «поджидая»'
  alternative: «как они ожидали моей жизни» или причинное «потому что»
  rationale: Еврейская конструкция допускает некоторую синтаксическую неоднозначность. Основной текст передаёт наиболее естественную по контексту связь образа действия, а примечание сохраняет буквальную форму и возможную альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Краткая цепочка однородных действий сохраняет напряжение стиха; идиоматические выражения переведены понятно, а буквальные образы и синтаксическая неоднозначность отмечены в сносках.
