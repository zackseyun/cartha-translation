source:
  edition: WLC
  text: אָ֥֨ז יָ֘שׁ֤וּבוּ אוֹיְבַ֣/י אָ֭חוֹר בְּ/י֣וֹם אֶקְרָ֑א זֶה יָ֝דַ֗עְתִּי כִּֽי אֱלֹהִ֥ים לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/009.yaml
  text: Then my enemies will turn back in the day I call. This I know[a], that God is for me.
translation:
  language: ru
  text: 'Тогда, в день, когда я воззову, мои враги отступят. Это я знаю[a]: Бог за меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Из этого я знаю, что Бог за меня».'
    reason: 'Еврейское זֶה יָדַעְתִּי можно понимать либо как «это я знаю», либо инструментально: «из этого я знаю».'
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временную последовательность и ожидаемый результат обращения псалмопевца к Богу.
- source_word: יָשׁוּבוּ אָחוֹר
  choice: отступят
  rationale: Сочетание глагола «возвращаться, поворачивать» с наречием «назад» в данном контексте означает обращение вспять, то есть отступление врагов.
- source_word: אוֹיְבַי
  choice: мои враги
  rationale: Прямое и естественное соответствие еврейскому существительному с притяжательным суффиксом.
- source_word: בְּיוֹם אֶקְרָא
  choice: в тот день, когда я воззову
  rationale: Сохраняет конкретный временной образ «в день» и передаёт молитвенное обращение глагола קרא без добавления прямо не названного объекта.
- source_word: זֶה יָדַעְתִּי
  choice: Это я знаю
  rationale: Сохраняет указательное זֶה и естественно выражает уверенность псалмопевца; возможное инструментальное понимание вынесено в сноску.
- source_word: כִּי
  choice: '[двоеточие перед содержанием знания]'
  rationale: כִּי вводит содержание того, что известно псалмопевцу; в русском это естественно передаётся бессоюзным пояснением после двоеточия.
- source_word: אֱלֹהִים לִי
  choice: Бог за меня
  rationale: Кратко и выразительно передаёт поддержку и благоволение Бога в контексте отступления врагов, сохраняя лаконичность еврейской фразы.
theological_decisions:
- issue: Значение выражения אֱלֹהִים לִי
  choice: Бог поддерживает псалмопевца, то есть «Бог за меня»
  alternative: Бог принадлежит мне / Бог — мой
  rationale: Предлог לִי допускает оттенок принадлежности, но контекст молитвы и отступления врагов прежде всего указывает на Божью поддержку; выбранная формулировка не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным глаголом «воззову». Формулировка лаконична, понятна и сохраняет поэтическую уверенность оригинала.
