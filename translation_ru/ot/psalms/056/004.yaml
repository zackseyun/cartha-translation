lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: В Боге / на Бога
  rationale: В первой строке сохранено необычное «В Боге», передающее сферу или основание хвалы; при глаголе доверия русское управление требует естественного «на Бога».
- source_word: אֲהַלֵּל
  choice: восхвалю
  rationale: Форма обозначает решимость или будущее действие; «восхвалю» сохраняет поэтическую возвышенность без архаического оттенка.
- source_word: דְּבָרוֹ
  choice: Его слово
  rationale: «Слово» сохраняет широту еврейского דָּבָר и не сужает смысл до одного лишь обещания.
- source_word: בָּטַחְתִּי
  choice: я положился
  rationale: Совершенный вид передаёт уже совершившееся доверие, из которого вытекает нынешняя уверенность псалмопевца.
- source_word: לֹא אִירָא
  choice: не устрашусь
  rationale: Будущая форма выражает твёрдую решимость не бояться; «не устрашусь» естественно звучит в поэтическом контексте.
- source_word: מַה יַּעֲשֶׂה
  choice: Что сделает
  rationale: Сохранена буквальная будущая форма еврейского текста и риторическая открытость вопроса; значение невозможности отмечено в сноске.
- source_word: בָשָׂר
  choice: плоть
  rationale: Буквальный образ подчёркивает человеческую немощь в противопоставлении Богу и не сводит выражение к конкретному противнику.
- source_word: לִי
  choice: мне
  rationale: Прямое и естественное соответствие еврейскому местоименному сочетанию.
theological_decisions:
- issue: Антропологический образ בָשָׂר в противопоставлении Богу
  choice: плоть
  alternative: человек / смертный
  rationale: «Плоть» сохраняет богословски значимый образ бренности и ограниченности человека, а сноска разъясняет его референт, не устраняя метафору.
- issue: Риторический смысл вопроса מַה יַּעֲשֶׂה
  choice: Что сделает мне плоть?
  alternative: Что может сделать мне плоть?
  rationale: Основной текст следует будущей форме оригинала; альтернативный русский оборот яснее выражает подразумеваемое бессилие людей и поэтому приведён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Необычное «В Боге» сохранено ради структуры и образности оригинала; далее употреблено естественное русское управление «на Бога». Тире подчёркивает, что отсутствие страха непосредственно следует из доверия Богу.
