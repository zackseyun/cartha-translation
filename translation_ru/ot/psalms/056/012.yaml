  text: На мне лежат обеты, данные Тебе, Боже[a]; я воздам Тебе благодарственные жертвы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Твои обеты на мне». Вероятно, имеются в виду обеты, данные Богу и потому обязательные для псалмопевца; также возможно: «мои обеты Тебе».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «благодарения». Еврейское слово может означать как выражения благодарности, так и благодарственные жертвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלַי
  choice: на мне
  rationale: Сохраняет еврейский образ лежащего на человеке обязательства и естественно сочетается в русском с обетами.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения естественно передаёт прямое обращение к Богу.
- source_word: נְדָרֶיךָ
  choice: обеты Тебе
  rationale: Буквально форма означает «Твои обеты», то есть обеты, принадлежащие Богу или причитающиеся Ему. По-русски «обеты Тебе» сохраняет направленность к Богу без добавления отсутствующего в еврейском местоимения «мои».
- source_word: אֲשַׁלֵּם
  choice: я воздам
  rationale: Порода пиэль глагола שלם выражает уплату или исполнение должного; «воздам» передаёт исполнение обязательства и естественно относится к жертвам.
- source_word: תּוֹדֹת
  choice: благодарственные жертвы
  rationale: Существительное может обозначать благодарения или благодарственные приношения; контекст обетов и глагола исполнения долга поддерживает жертвенный оттенок.
- source_word: לָךְ
  choice: Тебе
  rationale: Передаёт получателя действия и сохраняет обращение к Богу.
theological_decisions:
- issue: Принадлежность обетов в выражении נְדָרֶיךָ
  choice: «обеты Тебе»
  alternative: «Твои обеты»; «мои обеты Тебе»
  rationale: Еврейский суффикс буквально даёт «Твои обеты», но, вероятно, означает обеты, данные Богу и потому причитающиеся Ему. Основной текст передаёт этот смысл естественно, не добавляя явно «мои»; буквальная форма отмечена в сноске.
- issue: Значение תּוֹדֹת
  choice: «благодарственные жертвы»
  alternative: «благодарения»
  rationale: Слово допускает оба значения. Параллель с обетами и אֲשַׁלֵּם делает культовое значение вероятным, однако более широкое значение сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмным звучанием. Прописные местоимения в обращении к Богу соответствуют принятой русской религиозной письменной норме; синтаксис остаётся ясным для современного читателя.
