lexical_decisions:
- source_word: שָׁאֲפוּ
  choice: жаждут растерзать
  rationale: Глагол передаёт образ хищного, жадного устремления и в данном враждебном контексте — стремление погубить или сокрушить. Такая передача сохраняет образность и естественно звучит по-русски, не сводя значение к буквальному «тяжело дышат».
- source_word: שׁוֹרְרַי
  choice: враги мои
  rationale: Слово обозначает враждебных противников; этот вариант ясен, поэтичен и соответствует контексту плача.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Естественная современная передача устойчивого обозначения непрерывности действия.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание жалобы; «ведь» сохраняет причинно-пояснительную связь и поэтическое течение.
- source_word: רַבִּים
  choice: многие
  rationale: Прямая и естественная передача количественного прилагательного.
- source_word: לֹחֲמִים לִי
  choice: сражаются против меня
  rationale: Причастная конструкция выражает продолжающееся враждебное действие, направленное против псалмопевца; глагол сохраняет военную окраску.
- source_word: מָרוֹם
  choice: надменно
  rationale: В сжатом синтаксисе заключительное слово вероятно употреблено наречно и указывает на высокомерный образ действий противников. Альтернативные понимания сохраняются в примечании.
theological_decisions:
- issue: Толкование מָרוֹם
  choice: надменно
  alternative: «с высоты» или обращение «о Всевышний»
  rationale: 'Еврейская конструкция допускает наречное, пространственное и звательное понимание. Основной текст использует контекстуально вероятное наречное значение, не устраняя подлинную неоднозначность: иные чтения приведены в примечании.'
