  text: נֹדִ/י֮ סָפַ֪רְתָּ֫ה אָ֥תָּה שִׂ֣ימָ/ה דִמְעָתִ֣/י בְ/נֹאדֶ֑/ךָ הֲ֝/לֹ֗א בְּ/סִפְרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/008.yaml
  text: You have counted my wanderings[a]; put my tears in your bottle—are they not in your book?
translation:
  language: ru
  text: Ты исчислил мои скитания[a]. Положи мои слёзы в Твой кожаный сосуд[b] — разве они не в Твоей книге?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «мои странствия», «мою бесприютность».'
    reason: Лексема נֹדִי может обозначать сами скитания, а также связанное с ними состояние бесприютности.
  - marker: b
    text: 'Или: «в Твой мех», «в Твой бурдюк». Речь идёт о сосуде из кожи, а не о современной стеклянной бутылке.'
    reason: Еврейское נֹאד обозначает древний кожаный сосуд.
lexical_decisions:
- source_word: נֹדִי
  choice: мои скитания
  rationale: Существительное связано с נוד — странствовать, скитаться. «Скитания» естественно передаёт вынужденные перемещения псалмопевца, не сводя образ к отвлечённому «горю».
- source_word: סָפַרְתָּה
  choice: исчислил
  rationale: Глагол ספר прежде всего означает считать, исчислять, а также учитывать или записывать. «Исчислил» сохраняет конкретный образ тщательного счёта и звучит уместно в возвышенной поэзии.
- source_word: שִׂימָה
  choice: собери
  rationale: Буквально императив означает «положи, помести». В сочетании со слезами и сосудом русское «собери … в» естественно передаёт требуемое действие, не устраняя конкретного образа.
- source_word: דִמְעָתִי
  choice: мои слёзы
  rationale: Естественная русская передача собирательного значения еврейской формы.
- source_word: בְנֹאדֶךָ
  choice: в свой кожаный мех
  rationale: נֹאד обозначает сосуд из кожи, то есть мех или бурдюк. «Кожаный мех» исторически конкретен и не вызывает современного образа стеклянной бутылки; возвратное «свой» естественно соотносит сосуд с подлежащим «ты».
- source_word: הֲלֹא
  choice: разве … не
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ, вместо превращения его в прямое утверждение.
- source_word: בְסִפְרָתֶךָ
  choice: в твоей книге
  rationale: Сохраняет конкретный образ Божьей книги или письменного учёта. Глагол в еврейском опущен, поэтому он не добавлен и в переводе.
theological_decisions:
- issue: Антропоморфные образы Бога, собирающего слёзы и ведущего книгу
  choice: Сохранить оба конкретных образа без отвлечённого пересказа
  alternative: 'Передать смысл толкованием: «ты помнишь все мои страдания»'
  rationale: Поэтические образы выражают личное внимание Бога к страданиям молящегося. Их замена абстрактным объяснением ослабила бы образность и заранее истолковала текст.
- issue: Эллиптический заключительный вопрос
  choice: «разве они не в твоей книге?» без добавления глагола «записаны»
  alternative: «разве они не записаны в твоей книге?»
  rationale: В еврейском тексте сказуемое отсутствует. Русская эллиптическая конструкция остаётся понятной и сохраняет возможность воспринимать слёзы как непосредственно находящиеся в книге либо как внесённые в неё.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Местоимения, относящиеся к Богу, даны со строчной буквы согласно общим нормам современного русского текста; образность оригинала сохранена.
