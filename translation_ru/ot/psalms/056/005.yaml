  text: Весь день они искажают мои слова[a]; все их помыслы против меня — во зло[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вредят моим словам». Еврейский глагол труден для истолкования и может означать причинение боли или вреда; при словах «мои слова» вероятнее всего имеется в виду их враждебное искажение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все их замыслы против меня направлены на зло». Еврейское слово может обозначать мысли, намерения или замыслы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Весь день
  rationale: Естественно передаёт длительное, непрерывное действие на протяжении дня.
- source_word: דְּבָרַי
  choice: мои слова
  rationale: Хотя דָּבָר может означать также «дело» или «обстоятельство», сочетание с враждебным действием здесь лучше всего относится к словам говорящего.
- source_word: יְעַצֵּבוּ
  choice: искажают
  rationale: Форма глагола трудна и допускает значения причинения боли или вреда; при дополнении «мои слова» контекстуально наиболее уместно злонамеренное искажение.
- source_word: עָלַי
  choice: против меня
  rationale: В контексте преследования предлог имеет враждебную направленность; «против меня» естественно выражает её по-русски.
- source_word: כָּל מַחְשְׁבֹתָם
  choice: все их помыслы
  rationale: «Помыслы» сохраняет широту значения — мысли, намерения или замыслы — и соответствует возвышенному, но понятному регистру псалма.
- source_word: לָרָע
  choice: во зло
  rationale: Передаёт вредоносную цель и сохраняет нравственную окраску רַע, не сводя выражение лишь к практическому ущербу.
