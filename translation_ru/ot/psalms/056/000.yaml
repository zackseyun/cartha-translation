  text: לַ/מְנַצֵּ֤חַ עַל י֬וֹנַת אֵ֣לֶם רְ֭חֹקִים לְ/דָוִ֣ד מִכְתָּ֑ם בֶּֽ/אֱחֹ֨ז אֹת֖/וֹ פְלִשְׁתִּ֣ים בְּ/גַֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/000.yaml
  text: 'For the choir director: according to “The Silent Dove of Distant Places.” Of David[a]. A miktam[b], when the Philistines seized him in Gath.'
translation:
  language: ru
  text: Руководителю хора. На мотив «Безмолвная голубка далёких мест»[a]. Давида. Миктам[b], когда филистимляне схватили его в Гате.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Вероятно, название мелодии. Смысл еврейского выражения не вполне ясен; буквально оно может означать: «голубка безмолвия далёких [мест]».'
    reason: alternative_reading
  - marker: b
    text: Миктам — технический термин в надписаниях псалмов; его точное значение неизвестно.
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Обычная формула в надписаниях псалмов, обращённая к руководителю музыкального исполнения; перевод передаёт функцию понятным современным языком.
- source_word: עַל
  choice: На мотив
  rationale: В музыкальном надписании предлог, вероятно, вводит название мелодии или способ исполнения; «на мотив» естественно передаёт эту функцию по-русски.
- source_word: יוֹנַת אֵלֶם רְחֹקִים
  choice: «Безмолвная голубка вдали»
  rationale: Неясное выражение, вероятнее всего название мелодии. אֵלֶם связано с безмолвием или немотой, а רְחֹקִים — с удалённостью; кавычки и сноска сохраняют неопределённость.
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая конструкция сохраняет неоднозначность еврейского לְ: речь может идти об авторстве, посвящении или принадлежности к Давиду, не вынуждая выбрать одно толкование.'
- source_word: מִכְתָּם
  choice: Миктам
  rationale: Это технический термин надписаний с неустановленным точным значением; транслитерация предпочтительнее догадочного перевода.
- source_word: בֶּאֱחֹז אֹתוֹ
  choice: когда … схватили его
  rationale: Конструкция обозначает обстоятельство времени, а глагол передаёт враждебное задержание Давида без излишнего уточнения характера плена.
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Устоявшееся русское обозначение народа.
- source_word: בְּגַת
  choice: в Гате
  rationale: Естественная русская передача местного значения предлога при названии города.
theological_decisions:
- issue: Статус надписания
  choice: Перевести надписание как часть еврейского текста, сохранив музыкальное и историческое указания.
  alternative: Вынести его в редакционные метаданные или опустить.
  rationale: В масоретском тексте надписание входит в текст псалма; его перевод не требует превращать неясные детали в уверенные исторические или богословские утверждения.
- issue: Отношение псалма к Давиду
  choice: Передать לְדָוִד как «Давида», сохранив широкий смысл связи с Давидом.
  alternative: «Написано Давидом» или «посвящается Давиду».
  rationale: Еврейский предлог допускает несколько видов отношения; категорическое утверждение об авторстве или посвящении сузило бы исходный текст.
- issue: Значение מִכְתָּם
  choice: Оставить термин как «миктам» и пояснить неопределённость в сноске.
  alternative: Перевести предположительно как «золотой псалом», «надпись» или «песнь искупления».
  rationale: Ни одно из предлагаемых значений не установлено достаточно надёжно; транслитерация не вносит конфессионального или частного толкования.
translation_notes:
  register: Современный литературный русский язык с краткой формой традиционного псаломного надписания. Неясные музыкальные и технические выражения не истолкованы категорически; архаизмы и конфессионально окрашенные догадки исключены.
