lexical_decisions:
- source_word: י֥וֹם
  choice: Когда
  rationale: 'Существительное «день» здесь вводит временное придаточное: буквально «в день, когда я боюсь». Русское «когда» естественно передаёт эту функцию.'
- source_word: אִירָ֑א
  choice: мне страшно
  rationale: Форма Qal имперфекта 1-го лица ед. числа от ירא обозначает переживание страха. Безличное русское выражение «мне страшно» звучит естественно и не подразумевает благоговейного страха.
- source_word: אֲ֝נִ֗י
  choice: я
  rationale: Самостоятельное местоимение подчёркивает субъект, уже выраженный глагольной формой. В русском явное «я» перед «уповаю» сохраняет акцент без тяжеловесного «я сам».
- source_word: אֵלֶ֥י/ךָ
  choice: на Тебя
  rationale: Предлог אֶל при בטח направляет доверие к адресату. Русское устойчивое сочетание «уповать на Тебя» естественно передаёт этот смысл.
- source_word: אֶבְטָֽח
  choice: уповаю
  rationale: Имперфект от בטח может выражать решимость или продолжающееся доверие. Настоящее время «уповаю» в русском афористическом высказывании естественно передаёт намеренный ответ на страх, не исключая оттенка решимости.
theological_decisions:
- issue: Соотношение страха и доверия
  choice: Страх признаётся, но встречается сознательным упованием на Бога.
  alternative: Представить уверенность как полное отсутствие или окончательное исчезновение страха.
  rationale: Еврейский текст ставит переживание страха рядом с упованием и не утверждает, что страх вовсе отсутствует.
translation_notes:
  register: Современный литературный русский язык с краткой, молитвенно-поэтической формой. «Уповаю» сохраняет достоинство псалма и остаётся понятным; прописное «Тебя» отражает традиционное русское обращение к Богу.
