  text: בֵּֽ/אלֹהִ֣ים בָּ֭טַחְתִּי לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה אָדָ֣ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/011.yaml
  text: In God I have trusted; I will not fear[a]. What can man do to me?
translation:
  language: ru
  text: На Бога я уповаю — не убоюсь. Что сделает мне человек?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что может сделать мне человек?» Риторический вопрос подразумевает ограниченность человеческой силы, хотя отдельного слова «может» в еврейском тексте нет.'
    reason: translation_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: На Бога
  rationale: 'Предлог ב в формуле доверия указывает на объект упования. По-русски естественно и точно: «уповать на Бога».'
- source_word: בָּטַחְתִּי
  choice: я уповаю
  rationale: Перфект 1-го лица ед. числа выражает утвердившееся, твёрдое доверие. Русское настоящее «уповаю» естественно передаёт сохраняющееся состояние, не превращая его лишь в прошлое действие.
- source_word: לֹא אִירָא
  choice: не убоюсь
  rationale: Имперфект после отрицания выражает уверенное решение относительно предстоящей опасности. «Не убоюсь» сохраняет будущую направленность и соответствует возвышенному поэтическому регистру.
- source_word: מַה יַּעֲשֶׂה
  choice: Что сделает
  rationale: Буквальная риторическая конструкция естественна и в русском языке. Она сохраняет форму еврейского текста, не добавляя явно выраженной модальности «может».
- source_word: אָדָם
  choice: человек
  rationale: 'Единственное число употреблено репрезентативно: речь идёт о любом смертном человеке в противопоставлении Богу. Русское «человек» сохраняет и число, и обобщённый смысл.'
- source_word: לִי
  choice: мне
  rationale: Дательный эквивалент прямо передаёт ל с местоименным суффиксом и естественно сочетается с глаголом «сделает».
theological_decisions:
- issue: 'Риторический вопрос: способность человека или его возможное действие'
  choice: Что сделает мне человек?
  alternative: Что может сделать мне человек?
  rationale: В еврейском тексте нет отдельного модального глагола. Буквальная русская конструкция сохраняет намеренную риторическую напряжённость; смысл человеческого бессилия остаётся понятен из контекста.
- issue: Репрезентативное значение אָדָם
  choice: человек
  alternative: смертный / люди
  rationale: «Человек» точно сохраняет единственное число и общий антропологический смысл, не сужая значение до подчёркнутой смертности и не заменяя форму множественным числом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. «Уповаю» и «не убоюсь» уместны для псалма и понятны широкому читателю; порядок слов в вопросе близок к еврейскому и остаётся естественным.
