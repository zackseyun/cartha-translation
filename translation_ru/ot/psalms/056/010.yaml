  text: בֵּֽ֭/אלֹהִים אֲהַלֵּ֣ל דָּבָ֑ר בַּ֝/יהוָ֗ה אֲהַלֵּ֥ל דָּבָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/056/010.yaml
  text: In God I will praise the word[a]; in Yahweh I will praise the word.
translation:
  language: ru
  text: В Боге восхвалю слово[a], в Яхве восхвалю слово.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обещание» — в обеих строках; еврейское דָּבָר может означать «слово», «дело» или, в зависимости от контекста, «обещание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: В Боге
  rationale: 'Предлог בְּ перед אֱלֹהִים естественно передать как «в»: хвала совершается в отношении к Богу и с упованием на Него. Это также сохраняет точный параллелизм с בַּיהוָה.'
- source_word: אֲהַלֵּל
  choice: восхвалю
  rationale: Пиэль, имперфект 1-го лица единственного числа от הלל выражает здесь решимость говорящего. «Восхвалю» естественно передаёт усиленное значение формы и лаконизм поэтической строки.
- source_word: דָּבָר
  choice: слово
  rationale: דָּבָר может означать «слово», «дело» или, по контексту, «обещание». Основное «слово» сохраняет лексическую форму и намеренно не снимает смысловую открытость.
- source_word: בַּיהוָה
  choice: в Яхве
  rationale: Предлог בְּ передан так же, как в первой половине стиха, ради параллелизма; личное имя יהוה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное заветное имя Бога. «Яхве» отличает его от титула «Господь» и следует предоставленному консультационному решению.
- issue: Что именно восхваляет псалмопевец
  choice: слово
  alternative: обещание
  rationale: Контекст допускает понимание Божьего слова как обещания, однако еврейское דָּבָר шире. Перевод «слово» сохраняет подлинную смысловую напряжённость, а возможное значение «обещание» указано в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным псалмическим ритмом. Повтор и параллельная конструкция оригинала сохранены; «восхвалю» выбрано вместо менее выразительного «буду хвалить».
