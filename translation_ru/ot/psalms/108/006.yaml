  text: לְ֭מַעַן יֵחָלְצ֣וּ/ן יְדִידֶ֑י/ךָ הוֹשִׁ֖יעָ/ה יְמִֽינְ/ךָ֣ וַ/עֲנֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/006.yaml
  text: So that your beloved ones may be rescued[a], save with your right hand and answer me.
translation:
  language: ru
  text: Чтобы Твои возлюбленные были избавлены, спаси десницей Твоей и ответь мне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמַעַן
  choice: Чтобы
  rationale: Передаёт цель или ожидаемый результат и естественно связывает придаточное с последующей просьбой.
- source_word: יֵחָלְצוּן
  choice: избавились
  rationale: Нифаль глагола חלץ здесь выражает избавление от беды; русское «избавились» сохраняет смысл и допускает подразумеваемое Божье действие.
- source_word: יְדִידֶיךָ
  choice: возлюбленные Твои
  rationale: Передаёт множественное число и оттенок особой близости и любви; местоимение сохраняет обращение к Богу.
- source_word: הוֹשִׁיעָה
  choice: спаси
  rationale: Кратко и точно передаёт повелительную форму ישׁע и соответствует языку молитвенной просьбы.
- source_word: יְמִינְךָ
  choice: десницей Твоей
  rationale: Сохраняет телесный образ Божьей силы и инструментальное значение; «десница» остаётся понятным и уместным словом в возвышенном библейском регистре.
- source_word: וַעֲנֵנִי
  choice: и ответь мне
  rationale: Точно сохраняет повелительную форму с суффиксом первого лица единственного числа, не гармонизируя её с предшествующим множественным числом.
theological_decisions:
- issue: Переход от множества получателей избавления к одному молящемуся
  choice: 'Сохранить: «возлюбленные Твои» — «ответь мне»'
  alternative: Сгладить переход чтением «ответь нам»
  rationale: Масоретский текст намеренно или по меньшей мере явно сочетает множественное число тех, ради кого звучит просьба, с единственным числом молящегося; перевод сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной молитвенной окраской. Слово «десница» выбрано для сохранения устойчивого библейского образа без архаизации синтаксиса.
