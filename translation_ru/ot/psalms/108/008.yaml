base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/008.yaml
  text: Gilead is mine[a]; Manasseh is mine; Ephraim is the stronghold of my head[b]; Judah is my ruler's staff.
translation:
  language: ru
  text: Мне принадлежит Галаад, мне — Манассия; Ефрем — крепость моей головы[a], Иуда — мой жезл власти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ефрем — крепость моей головы»; это поэтический образ защиты и силы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иуда — мой законодатель» или «Иуда — мой правитель». Еврейское слово может обозначать носителя власти либо жезл как знак власти.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִי
  choice: мне принадлежит / мне
  rationale: Предлог ל с суффиксом первого лица выражает принадлежность. В первой строке это передано естественным русским оборотом «мне принадлежит», а в параллельной — кратким «мне».
- source_word: גִלְעָד
  choice: Галаад
  rationale: Устоявшаяся русская форма географического названия.
- source_word: מְנַשֶּׁה
  choice: Манассия
  rationale: Устоявшаяся русская библейская форма названия колена и области.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Устоявшаяся русская библейская форма названия колена.
- source_word: מָעוֹז
  choice: крепость
  rationale: Слово обозначает твердыню, укрепление или источник защиты; «крепость» сохраняет военно-защитный образ.
- source_word: רֹאשִׁי
  choice: для моей головы
  rationale: Сохранён буквальный образ головы, но добавлен естественный для русского языка предлог «для», передающий защитную функцию крепости.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Устоявшаяся русская библейская форма названия колена.
- source_word: מְחֹקְקִי
  choice: мой жезл правителя
  rationale: Слово связано с установлением постановлений и может обозначать правителя, законодателя либо его жезл. «Жезл правителя» сохраняет конкретный царственно-властный образ, не сводя значение к обычному скипетру.
theological_decisions:
- issue: Образ власти Иуды в מְחֹקְקִי
  choice: Иуда — мой жезл правителя
  alternative: Иуда — мой законодатель / Иуда — мой правитель
  rationale: Еврейское слово допускает как обозначение носителя власти, так и жезла — символа управления. Основной текст сохраняет предметный поэтический образ, а примечание отмечает личное значение, не разрешая неоднозначность конфессионально обусловленным толкованием.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного поэтического параллелизма. Устоявшиеся русские формы библейских имён сочетаются с конкретными военными и властными образами оригинала.
