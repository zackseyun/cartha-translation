id: PSA.108.7
reference: Psalms 108:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֱלֹהִ֤ים דִּבֶּ֥ר בְּ/קָדְשׁ֗/וֹ אֶעְלֹ֥זָה אֲחַלְּקָ֥ה שְׁכֶ֑ם וְ/עֵ֖מֶק סֻכּ֣וֹת אֲמַדֵּֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/007.yaml
  text: 'God has spoken in his holiness: “I will exult[b][a]; I will divide up Shechem and measure out the Valley of Succoth.”'
translation:
  language: ru
  text: 'Бог сказал в Своей святости[a]: «Я буду торжествовать[b], разделю Сихем и отмерю долину Суккот».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Своём святилище»; возможно также: «Своей святостью». Еврейское выражение может указывать как на Божью святость, так и на принадлежащее Ему святое место.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «буду ликовать». Еврейский глагол выражает радостное, победное ликование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Единственное число глагола דִּבֶּר показывает, что речь идёт о Боге Израиля.
- source_word: דִּבֶּר
  choice: сказал
  rationale: Русское совершенное прошедшее естественно передаёт завершённое божественное изречение; его актуальность определяется контекстом.
- source_word: בְּקָדְשׁוֹ
  choice: в Своей святости
  rationale: Фраза наиболее естественно указывает на святость Бога как качество или сферу Его речи, но допускает понимание святого места или клятвы Его святостью.
- source_word: אֶעְלֹזָה
  choice: Я буду торжествовать
  rationale: Глагол выражает ликующее, победное торжество; этот вариант сохраняет возвышенный тон.
- source_word: אֲחַלְּקָה
  choice: разделю
  rationale: В контексте земельных владений означает разделить или распределить территорию.
- source_word: שְׁכֶם
  choice: Сихем
  rationale: Устоявшаяся русская библейская форма географического названия.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: долину Суккот
  rationale: Передаёт еврейскую конструкцию принадлежности; Суккот — современная транслитерация названия места.
- source_word: אֲמַדֵּד
  choice: отмерю
  rationale: Форма глагола обозначает измерение территории с оттенком её распределения или утверждения власти над ней.
theological_decisions:
- issue: Говорящий и границы прямой речи
  choice: Глаголы первого лица переданы как слова Бога о Его верховной власти над землёй.
  alternative: После сообщения о Божьих словах от первого лица говорит псалмопевец.
  rationale: Синтаксис естественно вводит прямую речь Бога, а территориальная образность соответствует провозглашению Его суверенного права.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим оттенком. Заглавная буква в местоимении «Своей» следует принятой русской традиции почтительного обозначения Бога; топоним «Сихем» дан в устоявшейся библейской форме, «Суккот» — в прозрачной современной транслитерации.
