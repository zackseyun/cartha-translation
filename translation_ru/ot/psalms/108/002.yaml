  text: ע֭וּרָֽ/ה הַ/נֵּ֥בֶל וְ/כִנּ֗וֹר אָעִ֥ירָה שָּֽׁחַר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/002.yaml
  text: Awake[a], harp and lyre; I will awaken the dawn.
translation:
  language: ru
  text: Пробудитесь, арфа и лира! Я разбужу рассвет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я пробужу зарю»; смысл поэтического образа в том, что псалмопевец встаёт славить Бога ещё до рассвета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרָה
  choice: Пробудитесь
  rationale: Повелительная форма от עור поэтически обращена к двум инструментам. Множественное число естественно согласует призыв с однородными обращениями, хотя в еврейском употреблена форма единственного числа.
- source_word: הַנֵּבֶל
  choice: арфа
  rationale: נבל обозначает струнный инструмент; «арфа» — понятный современному читателю традиционный эквивалент, не претендующий на точную органологическую идентификацию.
- source_word: וְכִנּוֹר
  choice: и лира
  rationale: כינור обычно понимается как лира. Отдельное наименование сохраняет различие между двумя инструментами.
- source_word: אָעִירָה
  choice: Я разбужу
  rationale: Форма 1-го лица от того же корня עור выражает решительное намерение; «разбужу» сохраняет перекличку с начальным призывом и яркую персонификацию.
- source_word: שָּׁחַר
  choice: рассвет
  rationale: שחר означает рассвет, зарю. «Рассвет» естественно передаёт образ псалмопевца, начинающего хвалу до наступления дня.
