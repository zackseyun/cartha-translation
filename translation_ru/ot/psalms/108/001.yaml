lexical_decisions:
- source_word: נָכוֹן
  choice: твердо
  rationale: Слово обозначает утверждённость, устойчивость и решимость. «Твердо моё сердце» естественно передаёт внутреннюю стойкость говорящего, не сводя значение только к готовности.
- source_word: לִבִּי
  choice: моё сердце
  rationale: В древнееврейской поэзии «сердце» обозначает внутреннего человека, включая волю и чувства; буквальный образ ясен и естественен по-русски.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма употреблена как прямое обращение; русский звательный оборот «Боже» передаёт эту функцию естественно и достойно.
- source_word: אָשִׁירָה
  choice: я буду петь
  rationale: Когортатив выражает намерение и решимость говорящего. Будущее время с личным местоимением ясно передаёт волевой оттенок.
- source_word: וַאֲזַמְּרָה
  choice: и играть
  rationale: Глагол זמר в породе piel может обозначать музыкальное прославление — пение или игру. В паре с «петь» слово «играть» сохраняет параллелизм без тавтологии и допускает инструментальный оттенок.
- source_word: אַף
  choice: тоже
  rationale: Частица добавляет и подчёркивает заключительный поэтический элемент. В данной эллиптической конструкции «тоже» естественно показывает присоединение «моей славы» к хвале.
- source_word: כְּבוֹדִי
  choice: слава моя
  rationale: Это буквальное значение выражения. Оно сохранено в основном тексте ради поэтического образа и смысловой неоднозначности; возможные значения поясняются в сноске.
theological_decisions:
- issue: Смысл כְּבוֹדִי в языке поэтической хвалы
  choice: слава моя
  alternative: всё моё существо; душа моя; язык мой
  rationale: Древнееврейское выражение метафорично и допускает несколько толкований. Буквально-поэтическая передача не устраняет намеренно неоднозначный образ, а сноска сообщает основные смысловые возможности без предпочтения частного богословского прочтения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным псалмическим звучанием. Эллипсис заключительной фразы слегка раскрыт словом «тоже», при этом необычный образ «слава моя» сохранён.
