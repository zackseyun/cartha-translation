lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: чаша для моего омовения
  rationale: Сочетание обозначает сосуд, используемый для мытья. «Чаша для моего омовения» сохраняет конкретный и уничижительный образ и звучит яснее в современном русском, чем буквальное «горшок для омовения».
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: брошу свою сандалию
  rationale: Глагол означает «бросать», а נַעַל — обувь; «сандалия» естественно передаёт древний культурный контекст. Конкретный жест сохранён без замены его предполагаемым значением — господством или предъявлением права.
- source_word: עַל / עֲלֵי
  choice: на / над
  rationale: 'Многозначный предлог передан по пространственному контексту: сандалию бросают «на Эдом», а клич раздаётся «над Филистией». Возможный враждебный оттенок не превращён в отдельное толкование.'
- source_word: אֶתְרוֹעָע
  choice: издам торжествующий клич
  rationale: Форма глагола указывает на громкий клич, который может быть радостным, победным или воинским. Выбор сохраняет голосовое действие и контекст торжества, не сводя его строго к военному термину.
- source_word: פְלֶשֶׁת
  choice: Филистия
  rationale: В еврейском тексте назван край, а не непосредственно народ, поэтому употреблено географическое название «Филистия».
- source_word: מוֹאָב / אֱדוֹם
  choice: Моав / Эдом
  rationale: Использованы принятые в русской библейской традиции формы географических и этнических названий.
theological_decisions:
- issue: Метафорические образы господства над враждебными народами
  choice: Сохранить конкретные образы чаши для омовения, брошенной сандалии и торжествующего клича.
  alternative: 'Передать смысл толкованием: «Моав будет служить мне; на Эдом заявлю право; над Филистией одержу победу».'
  rationale: Поэтические образы выражают унижение, подчинение и торжество, но точная символика жеста с сандалией не вполне однозначна. Основной текст сохраняет образность и напряжение оригинала, а вероятный смысл поясняется в сносках.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Параллелизм трёх строк и конкретные древневосточные образы сохранены; архаизмы и чрезмерно толковательный пересказ избегаются.
