  yaml_path: translation/ot/psalms/108/003.yaml
  text: I will give thanks to you among the peoples[a], O Yahweh[b], and I will sing praise to you among the nations.
translation:
  language: ru
  text: 'Буду благодарить Тебя среди народов[a], Яхве[b],

    и буду воспевать Тебя среди народов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду славить Тебя». В еврейском тексте глагол может выражать и благодарность, и хвалу.'
    reason: lexical_alternative
  - marker: b
    text: Яхве — личное имя Бога; в еврейском тексте יהוה (ЙХВХ).
    reason: divine_name
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Буду благодарить Тебя
  rationale: В породе hifil глагол ידה в псалмах означает благодарить или прославлять с признанием Божьих деяний. «Благодарить» естественно передаёт основное значение, не исключая оттенка хвалы.
- source_word: בָעַמִּים
  choice: среди народов
  rationale: Множественное עַמִּים обозначает народы и подчёркивает международный круг слушателей.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: וַאֲזַמֶּרְךָ
  choice: буду воспевать Тебя
  rationale: Порода piel глагола זמר обозначает музыкальное восхваление; «воспевать» кратко и естественно соединяет пение с хвалой.
- source_word: בַּל
  choice: среди
  rationale: В данном поэтическом контексте частица выступает как предлог и параллельна בָּ в первой строке.
- source_word: אֻמִּים
  choice: племён
  rationale: Слово обозначает народы или этнические общности. «Племён» сохраняет лексическое различие между двумя параллельными еврейскими существительными, хотя оба имеют широкий собирательный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение אוֹדְךָ
  choice: Буду благодарить Тебя
  alternative: Буду славить Тебя
  rationale: Оба значения возможны в псалмах. Выбрана благодарность как основное контекстное значение, а реальная смысловая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим синтаксисом. Опущен союз перед второй строкой, поскольку русское бессоюзное построение естественно передаёт параллелизм. «Народы / племена» сохраняет лексическое варьирование оригинала без ослабления международного масштаба хвалы.
