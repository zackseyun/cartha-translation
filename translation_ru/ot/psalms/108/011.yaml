lexical_decisions:
- source_word: הֲלֹא
  choice: Разве не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно звучит по-русски.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Обе формы стоят в прямом обращении; русский звательный оборот «Боже» естественно передаёт обращение к единому Богу.
- source_word: זְנַחְתָּנוּ
  choice: отверг нас
  rationale: Глагол זנח выражает сильное отвержение или отбрасывание; «отверг нас» сохраняет силу жалобы и не смягчает её до простого оставления.
- source_word: וְלֹא
  choice: и не
  rationale: Сохраняет простое еврейское соединение и отрицание, не внося дополнительного противопоставления.
- source_word: תֵצֵא
  choice: не выходишь
  rationale: Имперфект в контексте жалобы естественно понимается как настоящее или повторяющееся действие. Базовое «выходишь» сохраняет образ выступления Бога вместе с войском, не усиливая его толкованием «идёшь в бой».
- source_word: בְּצִבְאֹתֵינוּ
  choice: с нашими войсками
  rationale: צָבָא в данном военном контексте означает войско; предлог ב передан идиоматически через «с», обозначая сопровождение и поддержку.
theological_decisions:
- issue: Язык Божьего отвержения в плаче
  choice: 'Сохранено прямое утверждение в форме риторического вопроса: Бог отверг народ и не выходит с его войсками.'
  alternative: Смягчить до «оставил нас» или «не пребываешь с нами».
  rationale: Еврейское זנח выражает сильное отвержение. Перевод сохраняет напряжённость молитвенной жалобы и не ослабляет обвинительный оттенок.
- issue: Область действия вопросительной частицы
  choice: Весь стих оформлен как один риторический вопрос, охватывающий обе согласованные части.
  alternative: 'Передать вторую часть как отдельное повествовательное утверждение: «и Ты не выходишь…».'
  rationale: Начальное הֲלֹא естественно может распространять вопросительную силу на координированную вторую часть; единый вопрос также хорошо передаёт ход еврейской жалобы, не исключая тесной утвердительной силы риторического вопроса.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Повтор обращения «Боже» сохранён вслед за еврейским текстом; инверсия «не Ты» подчёркивает риторическую направленность вопроса без архаизации.
