  yaml_path: translation/ot/psalms/108/011.yaml
  text: Have you not rejected us[a], O God? And do you not go out with our armies?
translation:
  language: ru
  text: Разве не Ты, Боже, отверг нас[a] и не выходишь с нашими войсками?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отбросил нас». Еврейский глагол может выражать сильное отвержение.'
