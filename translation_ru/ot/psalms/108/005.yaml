base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/005.yaml
  text: Be exalted above the heavens[a], O God[b], and your glory over all the earth.
translation:
  language: ru
  text: 'Будь превознесён[a] над небесами, Боже,

    и над всей землёй — слава Твоя[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вознесись над небесами».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и над всей землёй слава Твоя». Глагол во второй строке не выражен; по параллелизму здесь может подразумеваться молитвенное пожелание: «и да будет слава Твоя над всей землёй».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּמָה
  choice: Вознесись
  rationale: Форма от רום обращена к Богу как повеление или молитвенное пожелание и передаёт возвышение как в пространственном, так и в почётном смысле. «Вознесись» сохраняет поэтическую краткость и эту смысловую ёмкость.
- source_word: עַל שָׁמַיִם
  choice: над небесами
  rationale: Предлог עַל при глаголе возвышения обозначает положение выше чего-либо; «над небесами» естественно передаёт вертикальный образ и сохраняет множественное число שָׁמַיִם.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Это прямое обращение; русский звательный оборот естественно передаётся формой «Боже».
- source_word: וְעַל כָּל הָאָרֶץ
  choice: и над всей землёй
  rationale: В параллели с небесами הָאָרֶץ означает всю землю, а не отдельную страну. «Над всей землёй» сохраняет повтор предлога и устройство параллельных строк.
- source_word: כְּבוֹדֶךָ
  choice: слава Твоя
  rationale: כָּבוֹד применительно к Богу означает Его славу, величие и явленное достоинство. Постпозиция местоимения поддерживает торжественный поэтический строй.
theological_decisions:
- issue: Смысл повелительной формы רוּמָה
  choice: Вознесись
  alternative: Будь превознесён
  rationale: Еврейская форма допускает оттенки «поднимись», «будь высоко» и «будь превознесён». Основной текст не сводит образ только к прославлению или только к пространственному движению; альтернатива указана в сноске.
- issue: Отсутствующий глагол во второй строке
  choice: и над всей землёй — слава Твоя
  alternative: и да будет слава Твоя над всей землёй
  rationale: 'В еврейском тексте вторая строка безглагольна. Тире сохраняет её открытость: строку можно понимать как продолжение молитвенного пожелания первой строки либо как утверждение о Божьей славе, не навязывая один вариант.'
translation_notes:
  register: Современный литературный русский с торжественной псалмовой интонацией. Синтаксическая краткость и двухстрочный параллелизм оригинала сохранены; архаичные формы, кроме общеупотребительного обращения «Боже», не используются.
