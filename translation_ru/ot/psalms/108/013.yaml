  yaml_path: translation/ot/psalms/108/013.yaml
  text: With God we will do valiantly[a], and he will trample our foes.
translation:
  language: ru
  text: С Богом мы явим доблесть[a], и Он растопчет наших врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершим великие дела»; еврейское выражение может означать проявление силы и доблести или победоносные действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: С Богом
  rationale: 'Предлог ב здесь допускает оттенки совместности и средства: народ действует с Божьей помощью и в зависимости от Него. «С Богом» естественно по-русски и не сужает смысл до одной лишь инструментальности.'
- source_word: נַעֲשֶׂה חָיִל
  choice: мы явим доблесть
  rationale: Сочетание עשה חיל обозначает проявление силы, доблести или совершение победоносных дел. «Явим доблесть» сохраняет деятельный и воинский характер выражения, оставаясь естественным для поэтической речи.
- source_word: וְהוּא
  choice: и Он
  rationale: Союз передан простым соединительным «и», а местоимение сохранено явно; прописная буква помогает естественно обозначить Бога в русском контексте, не добавляя нового смысла.
- source_word: יָבוּס
  choice: попирает
  rationale: Глагол בוס буквально означает топтать, попирать. Настоящее-будущее «попирает» в русском языке передаёт несовершенный вид и уверенность псалмического утверждения, не устраняя его перспективу.
- source_word: צָרֵינוּ
  choice: наших врагов
  rationale: צרים — враждебные противники. «Враги» ясно, современно и уместно в воинском контексте псалма.
theological_decisions:
- issue: Соотношение человеческого и Божьего действия в победе
  choice: Народ проявляет доблесть с Богом, а решающее попрание врагов приписано Самому Богу.
  alternative: Передать первую часть исключительно как Божье действие либо представить Бога лишь помощником человеческих усилий.
  rationale: Еврейский текст одновременно говорит о действии общины — «мы явим доблесть» — и о действии Бога — «Он попирает». Перевод сохраняет это напряжение и не сводит одну сторону к другой.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. «Явим доблесть» и «попирает» сохраняют воинскую образность оригинала без излишней архаизации.
