source:
  edition: WLC
  text: הָֽבָ/ה לָּ֣/נוּ עֶזְרָ֣ת מִ/צָּ֑ר וְ֝/שָׁ֗וְא תְּשׁוּעַ֥ת אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/012.yaml
  text: Give us help against the adversary[b][a], for the salvation of man is vain.
translation:
  language: ru
  text: Подай нам помощь против врага[a], ведь спасение от человека — тщетно[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из беды», если צַר понимать не как «враг», а как «бедствие, нужда».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «спасение человека тщетно». Здесь «человек» имеет обобщённый смысл: человеческая помощь вообще.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָבָה
  choice: Подай
  rationale: Просительная форма от יהב в молитвенном контексте. «Подай» естественно и достойно передаёт настойчивую просьбу к Богу.
- source_word: לָּנוּ
  choice: нам
  rationale: 'Косвенное дополнение при просьбе; обычное русское управление: «подай нам помощь».'
- source_word: עֶזְרַת
  choice: помощь
  rationale: Форма сопряжённого состояния со значением «помощь». Это ясный и естественный русский эквивалент, сохраняющий параллель со «спасением» во второй строке.
- source_word: מִצָּר
  choice: против врага
  rationale: צַר может означать как бедствие, так и врага. Военный контекст псалма поддерживает личное значение; предлог מִן после существительного «помощь» по-русски естественно передан как «против».
- source_word: וְשָׁוְא
  choice: ведь ... тщетно
  rationale: שָׁוְא выражает тщету, пустоту, бесполезность. Союз передан причинным «ведь», поскольку вторая часть обосновывает просьбу первой; именная конструкция восполнена связкой и наречным сказуемым по нормам русского языка.
- source_word: תְּשׁוּעַת
  choice: спасение
  rationale: Слово может обозначать спасение, избавление или победу. «Спасение» сохраняет основное лексическое значение, не внося в текст дополнительного догматического уточнения.
- source_word: אָדָם
  choice: от человека
  rationale: אָדָם употреблено обобщённо и обозначает человека как источник помощи. Конструкция «спасение от человека» сохраняет лаконичность и указывает на человеческое, а не Божье избавление.
theological_decisions:
- issue: Обобщённое значение אָדָם в утверждении об ограниченности человеческого спасения
  choice: от человека
  alternative: от людей / человеческое спасение
  rationale: Единственное число сохраняет форму и поэтическую краткость еврейского текста, оставаясь в русском языке родовым обозначением. Смысл относится не к одному мужчине, а к человеческой помощи вообще; это пояснено в сноске.
- issue: Значение תְּשׁוּעָה в данном контексте
  choice: спасение
  alternative: избавление / победа
  rationale: Контекст говорит о помощи в борьбе, однако более широкое «спасение» сохраняет лексическую связь и не сводит смысл исключительно к военной победе.
translation_notes:
  register: Современный литературный русский язык с лаконичным молитвенно-поэтическим строем. «Подай» сохраняет возвышенность без архаизации; тире перед «тщетно» подчёркивает афористичность второй части.
