  text: כִּֽי גָד֣וֹל מֵֽ/עַל שָׁמַ֣יִם חַסְדֶּ֑/ךָ וְֽ/עַד שְׁחָקִ֥ים אֲמִתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/108/004.yaml
  text: For your steadfast love is great above the heavens[a], and your faithfulness reaches to the clouds.
translation:
  language: ru
  text: Ведь Твоя неизменная любовь выше небес, и Твоя верность[a] простирается до облаков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истина».'
    reason: Лексически אֱמֶת может обозначать как верность и надёжность, так и истину.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для окружающего призыва к хвале; «ведь» естественно передаёт эту связь в современной русской поэтической речи.
- source_word: גָדוֹל
  choice: превыше
  rationale: В сочетании с מֵעַל выражает величие, представленное через образ превосходящей высоты. Русское «превыше небес» лаконично сохраняет пространственную метафору.
- source_word: מֵעַל שָׁמַיִם
  choice: превыше небес
  rationale: Передаёт значение нахождения выше или превосходства по высоте, не сводя образ только к абстрактному величию.
- source_word: חַסְדֶּךָ
  choice: Твоя неизменная любовь
  rationale: חֶסֶד обозначает милостивую, верную и устойчивую любовь. «Неизменная любовь» понятно современному читателю и передаёт её постоянный характер без внесения специальной конфессиональной терминологии.
- source_word: וְעַד
  choice: и … до
  rationale: עַד обозначает предел распространения; глагол «простирается» естественно восполняется из поэтического параллелизма.
- source_word: שְׁחָקִים
  choice: облаков
  rationale: Слово обозначает облака или небесные выси; «облака» сохраняют конкретный поэтический образ.
- source_word: אֲמִתֶּךָ
  choice: Твоя верность
  rationale: Хотя אֱמֶת может означать «истина», в параллели с חֶסֶד применительно к Богу особенно ясно выражает надёжность и верность.
theological_decisions:
- issue: Передача парных характеристик Бога חֶסֶד и אֱמֶת
  choice: «неизменная любовь» и «верность»
  alternative: «милость» и «истина»
  rationale: Выбранная пара передаёт устойчивый, надёжный характер Божьего отношения, не превращая חֶסֶד в узко технический термин. Лексически возможное «истина» сохранено в сноске, чтобы не скрывать смысловую многозначность אֱמֶת.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим ритмом. Обращённые к Богу местоимения написаны с прописной буквы в соответствии с распространённой русской библейской традицией; архаические слова и узкоконфессиональная терминология избегаются.
