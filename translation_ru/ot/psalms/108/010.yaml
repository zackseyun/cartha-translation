  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a][b][c]
translation:
  language: ru
  text: Кто приведёт меня в укреплённый город? Кто доведёт меня до Эдома?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто довёл меня до Эдома?» Древнееврейский глагол формально стоит в форме завершённого действия, но в поэтическом параллелизме с первым полустишием может иметь значение будущего.'
    reason: lexical_alternative
  - marker: b
    text: Под «укреплённым городом», возможно, подразумевается конкретная крепость в Эдоме, которую традиционно отождествляют с Селой (Петрой), однако в древнееврейском тексте город не назван.
    reason: cultural_note
lexical_decisions:
- source_word: מִי
  choice: кто
  rationale: Вопросительное местоимение естественно и точно передаётся простым «кто»; в обоих полустишиях сохраняется риторический вопрос.
- source_word: יֹבִלֵנִי
  choice: приведёт меня
  rationale: Порода hифиль глагола יבל выражает приведение к месту назначения; «приведёт» естественно сочетается с «в укреплённый город».
- source_word: עִיר מִבְצָר
  choice: укреплённый город
  rationale: Сопряжённое сочетание буквально обозначает город-крепость, то есть укреплённый город. Определённость в древнееврейской форме явно не выражена, однако контекст, вероятно, подразумевает конкретный город.
- source_word: נָחַנִי
  choice: доведёт меня
  rationale: Глагол נחה означает «вести, направлять». Несмотря на форму qatal, поэтический параллелизм с יֹבִלֵנִי и направленный в будущее контекст поддерживают будущее значение; «доведёт» также естественно передаёт достижение предела, обозначенного עַד.
- source_word: עַד אֱדוֹם
  choice: до Эдома
  rationale: Предлог עַד обозначает предел движения; «до Эдома» точно и естественно сохраняет этот оттенок, не сводя его просто к направлению «в Эдом».
theological_decisions:
- issue: Временное значение נָחַנִי
  choice: 'будущее: «доведёт меня»'
  alternative: 'прошедшее: «довёл меня»'
  rationale: Формально употреблён qatal, но синонимический параллелизм с глаголом несовершенного вида в первом полустишии и общий контекст вопроса о предстоящей помощи дают основание передать его будущим временем. Формальная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Параллельная структура двух вопросов сохранена; «приведёт / доведёт» избегает тяжеловесного повтора и передаёт оттенок עַד как достижения предела.
