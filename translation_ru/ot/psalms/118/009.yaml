  text: It is better to take refuge in Yahweh than to trust in nobles[a].
translation:
  language: ru
  text: Лучше искать прибежища у Яхве, чем полагаться на знатных[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на князей». Еврейское слово נְדִיבִים может обозначать знатных людей, вельмож или влиятельных правителей; «князья» — традиционный вариант перевода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: Предикативное прилагательное в сравнительной конструкции; краткая русская форма естественно передаёт оценку преимущества.
- source_word: לַחֲסוֹת
  choice: искать прибежища
  rationale: Инфинитив חסה обозначает обращение за защитой и безопасностью; выражение сохраняет активный смысл упования и поиска убежища.
- source_word: בַּיהוָה
  choice: у Яхве
  rationale: Предлог ב указывает на того, у кого находят защиту; русское «искать прибежища у» звучит естественно. Тетраграмматон передан личным именем «Яхве».
- source_word: מִבְּטֹחַ
  choice: чем полагаться
  rationale: Предлог מן вводит сравнение, а בטח означает доверять или возлагать надежду; «полагаться» точно подходит к человеческим покровителям.
- source_word: בִּנְדִיבִים
  choice: на знатных
  rationale: נְדִיבִים здесь обозначает людей высокого положения — знать или влиятельных правителей; «знатные» сохраняет более широкий смысл, чем «князья».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит Тетраграмматон; транслитерация «Яхве» сохраняет личное имя Бога, не подменяя его титулом.
- issue: Характер противопоставления
  choice: Божье прибежище противопоставлено опоре на влиятельных людей
  alternative: Абсолютный запрет любого доверия людям
  rationale: Сравнительная форма «лучше… чем…» сохранена без превращения её в более категорическое утверждение, которого грамматика стиха прямо не выражает.
translation_notes:
  register: Современный литературный русский язык; сохранены лаконичный параллелизм и сравнительная форма еврейского стиха. Формулировка подходит для поэтического библейского контекста и остаётся понятной широкому читателю.
