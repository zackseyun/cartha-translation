  text: אֵלִ֣/י אַתָּ֣ה וְ/אוֹדֶ֑/ךָּ אֱ֝לֹהַ֗/י אֲרוֹמְמֶֽ/ךָּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/028.yaml
  text: You are my God[a], and I will give thanks to you; my God[b], I will exalt you.
translation:
  language: ru
  text: Ты — мой Бог, и я буду благодарить Тебя[a]; мой Бог, я буду превозносить Тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прославлять Тебя»; в псалмах этот глагол может выражать как благодарение, так и хвалу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «возвеличивать Тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלִי
  choice: мой Бог
  rationale: Форма אֵל с суффиксом первого лица единственного числа означает «мой Бог». Такое соответствие естественно по-русски и сохраняет личный характер обращения.
- source_word: אַתָּה
  choice: Ты —
  rationale: Самостоятельное местоимение образует безглагольное именное предложение и подчёркивает адресата. В русском это естественно передаётся конструкцией «Ты — мой Бог».
- source_word: וְאוֹדֶךָ
  choice: и я буду благодарить Тебя
  rationale: Глагол ידה в породе hифиль в псалмах обычно выражает благодарение, но может включать оттенок прославления; дополнение второго лица передано явно.
- source_word: אֱלֹהַי
  choice: мой Бог
  rationale: Это второе обращение к Богу, параллельное אֵלִי. Повтор «мой Бог» сохраняет поэтическое построение и личную преданность, выраженную в еврейском тексте.
- source_word: אֲרוֹמְמֶךָ
  choice: я буду превозносить Тебя
  rationale: Глагол רום здесь означает возвышать или превозносить в прославлении. «Превозносить» сохраняет образ возвышения и звучит естественно в современном торжественном русском языке.
theological_decisions:
- issue: Передача божественных наименований אֵלִי и אֱלֹהַי
  choice: мой Бог … мой Бог
  alternative: мой Сильный … мой Бог
  rationale: Обе формы служат личным обращением к Богу Израиля. Одинаковая передача не вводит отсутствующего в данном контексте смыслового различия и сохраняет поэтический повтор.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной псалмовой интонацией. Тире передаёт безглагольное предложение и эмфатическое местоимение; параллелизм и повтор «мой Бог» сохранены. Местоимение «Тебя» написано с прописной буквы как знак уважительного обращения в библейском тексте.
