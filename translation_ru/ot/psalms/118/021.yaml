lexical_decisions:
- source_word: אודך
  choice: Буду благодарить Тебя
  rationale: Глагол ידה в породе hифиль здесь означает благодарить или прославлять. Буду благодарить естественно передаёт направленность несовершенного вида и благодарственный характер псалма; местоименное окончание 2 м. ед. ч. передано как Тебя.
- source_word: כי
  choice: за то, что
  rationale: Союз вводит основание благодарности; русская конструкция «благодарить за то, что» естественно и ясно выражает причинную связь.
- source_word: עניתני
  choice: Ты ответил мне
  rationale: Это форма от ענה II «отвечать», а не от омонимичного корня со значением «угнетать, смирять». Перевод сохраняет обычный язык молитвы.
- source_word: ותהי
  choice: и стал
  rationale: Последовательная глагольная форма от היה передаёт развитие события. «Стал» сохраняет динамику исходного текста лучше, чем статичное «был».
- source_word: לי
  choice: моим
  rationale: Буквально «для меня/мне»; при русском выражении «стал моим спасением» притяжательная форма звучит естественно и точно передаёт отношение.
- source_word: לישועה
  choice: спасением
  rationale: ישועה охватывает как избавление от конкретной беды, так и спасение в более широком смысле. «Спасение» сохраняет обе смысловые перспективы и литературно-богословскую весомость слова.
theological_decisions:
- issue: Передача ישועה в благодарственном псалме об избавлении
  choice: спасением
  alternative: избавлением
  rationale: Еврейское слово допускает значение конкретного избавления, но «спасением» сохраняет и непосредственный смысл помощи, и более широкое богословское звучание, не добавляя к тексту позднейших доктринальных уточнений.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Заглавные буквы в местоимениях, обращённых к Богу, соответствуют принятой русской библейской традиции. Порядок мысли и динамика еврейского текста сохранены без ненужной архаизации.
