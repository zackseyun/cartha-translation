  yaml_path: translation/ot/psalms/118/010.yaml
  text: All the nations surrounded me; in the name of the LORD, I surely cut them off.
translation:
  language: ru
  text: Все народы окружили меня; именем ГОСПОДА я непременно отсеку их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: Все народы
  rationale: Прямо передаёт совокупность враждебных народов; в данном контексте גּוֹיִם означает именно народы, а не абстрактных «язычников».
- source_word: סְבָבוּנִי
  choice: окружили меня
  rationale: Сохраняет совершенный вид и образ тесного окружения говорящего.
- source_word: בְּשֵׁם יְהוָה
  choice: именем ГОСПОДА
  rationale: Предлог בְּ передаёт основание или средство действия — действие совершается с призыванием имени и властью ГОСПОДА. Тетраграмматон по принятой русской библейской традиции передан как ГОСПОДЬ.
- source_word: כִּי
  choice: но … непременно
  rationale: В этой повторяющейся формуле частица усиливает уверенность высказывания; по-русски противопоставление естественно выражено союзом «но», а эмфаза — словом «непременно».
- source_word: אֲמִילַם
  choice: отсеку их
  rationale: Редкая форма допускает связь с корнем מול в значении «обрезать, отсекать»; выбран буквальный и образный эквивалент, не сужающий смысл до одного конкретного способа уничтожения.
theological_decisions:
- issue: Смысл действия «именем ГОСПОДА»
  choice: Сохранить формулу «именем ГОСПОДА» без поясняющего расширения
  alternative: «с помощью ГОСПОДА» или «призвав ГОСПОДА»
  rationale: Исходная формула богословски ёмкая и может включать призывание, упование и действие данной Богом властью; конкретизация устранила бы эту многозначность.
- issue: Степень уверенности в заключительной строке
  choice: Передать эмфазу словом «непременно»
  alternative: Оставить простое «отсеку их»
  rationale: Так сохраняется усилительная функция כִּי, отмеченная и в консультационном английском тексте, без превращения стиха в предсказание иной модальности.
translation_notes:
  register: Современный литературный русский с торжественным псалмическим звучанием. Порядок слов близок к еврейскому, но союз «но» делает противопоставление естественным для русского читателя. Заглавное «ГОСПОДА» обозначает тетраграмматон.
