  text: פִּתְחוּ לִ֥/י שַׁעֲרֵי צֶ֑דֶק אָֽבֹא בָ֝/ם אוֹדֶ֥ה יָֽהּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/019.yaml
  text: Open to me the gates of righteousness[c][b][a]; I will enter through them and give thanks to Yah.
translation:
  language: ru
  text: Откройте мне врата праведности[c]; я войду в них и буду благодарить[b] Яха[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «Ях» — краткая форма Божьего имени; в некоторых переводах здесь стоит «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «прославлять». Еврейский глагол, в зависимости от контекста, может означать «благодарить» или «прославлять».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «врата справедливости». Еврейское слово может означать праведность или справедливость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְחוּ
  choice: Отворите
  rationale: Форма повелительного наклонения, мужской род, множественное число от פתח. «Отворите» естественно сочетается с «вратами» и сохраняет возвышенный поэтический регистр.
- source_word: לִי
  choice: мне
  rationale: Предлог ל с суффиксом первого лица единственного числа здесь указывает, для кого следует открыть врата; по-русски естественно «отворите мне».
- source_word: שַׁעֲרֵי
  choice: врата
  rationale: Форма множественного числа в сопряжённом состоянии. «Врата» уместны в храмовом и поэтическом контексте и не требуют отдельной передачи определённого артикля.
- source_word: צֶדֶק
  choice: праведности
  rationale: צֶדֶק может обозначать праведность, справедливость или то, что право. «Праведность» сохраняет традиционную для псалма богословско-нравственную широту; возможность значения «справедливость» отмечена в сноске.
- source_word: אָבֹא
  choice: я войду
  rationale: Имперфект первого лица единственного числа от בוא после повеления выражает намерение говорящего. «Я войду» естественно передаёт движение через врата.
- source_word: בָם
  choice: в них
  rationale: Предлог ב с местоименным суффиксом множественного числа буквально допускает «в них» или по смыслу «через них». Русское «войти в них» сохраняет образ входа во врата без лишнего уточнения.
- source_word: אוֹדֶה
  choice: возблагодарю
  rationale: Форма первого лица единственного числа от ידה в данном богослужебном контексте означает благодарение, но может включать хвалу. «Возблагодарю» точно называет благодарение и соответствует достоинству поэтического регистра; значение «прославлю» отмечено в сноске.
- source_word: יָהּ
  choice: Яха
  rationale: יָהּ — краткая форма личного имени Бога. Она передана транслитерацией «Ях»; винительный падеж после «возблагодарю» требует формы «Яха».
theological_decisions:
- issue: Передача краткой формы Божьего имени יָהּ
  choice: Яха
  alternative: Господа
  rationale: В еврейском тексте употреблена именно краткая форма имени יָהּ, а не тетраграмматон יהוה. Транслитерация сохраняет это различие; форма «Яха» обусловлена русским винительным падежом.
- issue: Смысл צֶדֶק в выражении «врата праведности»
  choice: праведности
  alternative: справедливости
  rationale: Контекст допускает как нравственно-религиозную праведность, так и справедливость. Основной текст сохраняет широкое и укоренённое выражение «врата праведности», а альтернатива вынесена в сноску.
- issue: Смысл ידה применительно к Богу
  choice: возблагодарю
  alternative: прославлю
  rationale: Глагол может передавать благодарение и хвалу. В этом стихе значение благодарения передано в основном тексте, без отрицания хвалебного оттенка, который указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Слова «отворите», «врата» и «возблагодарю» сохраняют достоинство богослужебной поэзии, оставаясь понятными современному читателю. Порядок местоимений и глаголов сделан естественным для русского языка, а смысловые неоднозначности вынесены в сноски.
