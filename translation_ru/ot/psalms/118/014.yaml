lexical_decisions:
- source_word: עָזִּי
  choice: моя сила
  rationale: Существительное עֹז обозначает силу или мощь; «моя сила» естественно звучит по-русски и сохраняет поэтическое исповедание.
- source_word: וְזִמְרָת
  choice: и песнь
  rationale: В устойчивом библейском выражении существительное זִמְרָה лучше передать словом «песнь»; варианты «хвала» и «мелодия» здесь менее точны.
- source_word: יָהּ
  choice: Ях
  rationale: В тексте стоит краткая форма божественного имени, а не тетраграмматон יהוה; транслитерация «Ях» сохраняет это различие.
- source_word: וַיְהִי
  choice: стал
  rationale: Глагольная форма выражает наступивший результат; «стал» передаёт её силу лучше, чем простая связка «есть».
- source_word: לִי
  choice: моим
  rationale: Буквально «для меня / мне», но в этой конструкции естественный русский эквивалент — притяжательное «моим».
- source_word: לִישׁוּעָה
  choice: спасением
  rationale: יְשׁוּעָה может означать спасение, избавление или победу; «спасение» сохраняет широкий смысл и соответствует контексту.
theological_decisions:
- issue: Передача краткой формы божественного имени יָהּ
  choice: Ях
  alternative: Господь
  rationale: «Ях» точно отражает краткую поэтическую форму имени в еврейском тексте и не смешивает её с полным именем יהוה.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного, торжественного поэтического строя. Именная конструкция «Моя сила и песнь — Ях» передаёт синтаксис оригинала без добавления отсутствующей в нём связки.
