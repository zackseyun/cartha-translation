reference: Psalms 118:26
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בָּר֣וּךְ הַ֭/בָּא בְּ/שֵׁ֣ם יְהוָ֑ה בֵּ֝רַֽכְנוּ/כֶ֗ם מִ/בֵּ֥ית יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/026.yaml
  text: Blessed is the one who comes in the name of Yahweh[c][b][a]; we bless you from the house of Yahweh.
translation:
  language: ru
  text: Благословен тот, кто приходит[a] во имя[b] Яхве[c]; благословляем вас из дома Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Благословен грядущий». В еврейском тексте употреблено причастие мужского рода, единственного числа — буквально «приходящий».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «во имя» может также означать «по полномочию», «от имени» или «как представитель».
    reason: lexical_alternative
  - marker: c
    text: Позднее этот стих цитируется в Новом Завете в связи со входом Иисуса в Иерусалим (Мф. 21:9; Мк. 11:9; Лк. 19:38; Ин. 12:13). Основной перевод сохраняет формулировку псалма, не подставляя в неё это последующее применение.
    reason: cross_reference
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Страдательное причастие/прилагательное от ברך образует формулу благословения. «Благословен» естественно и точно передаёт её, не превращая утверждение в пожелание.
- source_word: הַבָּא
  choice: тот, кто приходит
  rationale: 'Субстантивированное причастие с артиклем, мужской род, единственное число: буквально «приходящий». Оборот «тот, кто приходит» звучит естественно в современном русском и сохраняет длительно-характеризующую силу причастия.'
- source_word: בְּשֵׁם
  choice: во имя
  rationale: Устойчивый и прозрачный русский эквивалент, сохраняющий возможные оттенки действия по полномочию, от имени или как представитель, не сводя выражение только к одному из них.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве», а не замена его титулом, сохраняет форму исходного текста.
- source_word: בֵּרַכְנוּכֶם
  choice: благословляем вас
  rationale: Перфект 1-го лица множественного числа с суффиксом 2-го лица множественного числа в литургическом контексте имеет перформативную силу. Настоящее время передаёт совершаемое здесь благословение, а «вас» ясно выражает множественное число.
- source_word: מִבֵּית
  choice: из дома
  rationale: Буквально передаёт предлог מִן и существительное בַּיִת в сопряжённой форме. Храмовый смысл остаётся доступным из контекста, но не подставляется в основной текст вместо слова «дом».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Непосредственный литургический и последующий мессианский смысл выражения הַבָּא
  choice: Сохранить в основном тексте общее благословение приходящего, не добавляя прямого мессианского уточнения
  alternative: Перевести как особый титул «Грядущий» с явно мессианским смыслом
  rationale: Сам псалом допускает непосредственное обращение к приходящему поклоннику или представителю. Новозаветное применение к Иисусу существенно для канонического прочтения, но не должно молча изменять формулировку еврейского текста.
- issue: Временное значение перфекта בֵּרַכְנוּכֶם
  choice: благословляем вас
  alternative: мы благословили вас
  rationale: В литургической речи форма естественно понимается как перформативное провозглашение благословения. Настоящее время передаёт эту функцию, хотя формально возможна передача прошедшим временем.
translation_notes:
  register: Современный литературный русский с достоинством богослужебной формулы. Синтаксис прост и понятен; традиционное «Благословен» сохранено как естественная библейская формула. «Тот, кто приходит» менее архаично, чем «грядущий», а традиционная альтернатива дана в сноске. Местоимение «вас» передаёт множественный объект еврейской формы.
