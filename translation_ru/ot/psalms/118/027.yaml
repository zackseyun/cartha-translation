  text: Yahweh is God[a], and he has given light to us. Bind the festal sacrifice with cords[d][c][b], up to the horns of the altar.
translation:
  language: ru
  text: Господь — Бог, и Он озарил нас.[a] Свяжите праздничную жертву верёвками вплоть до рогов жертвенника.[b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и Он дал нам свет». Глагол может говорить как о дарованном Господом свете, так и о том, что Он озарил народ Своей благосклонностью.'
    reason: lexical_alternative
