    text: 'Буквально: «свяжите праздник». Слово обычно означает «праздник», но здесь его часто понимают как обозначение праздничной жертвы; возможен также образ праздничного шествия.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «толстыми верёвками». Некоторые понимают это слово как «ветвями», однако значение «верёвки, канаты» вероятнее.'
