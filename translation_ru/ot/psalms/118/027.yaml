    reason: alternative_reading
lexical_decisions:
- source_word: אֵל יְהוָה
  choice: Господь — Бог
  rationale: Бессвязочная именная конструкция отождествляет Яхве с Богом. Традиционное русское «Господь» естественно передаёт имя יהוה в библейском регистре.
- source_word: וַיָּאֶר לָנוּ
  choice: и Он озарил нас
  rationale: Порода hифиль глагола אור допускает значение «дать свет, осветить». «Озарил нас» кратко сохраняет образ света и может включать оттенок явленной милости, не сводя выражение только к внутреннему просвещению.
- source_word: אִסְרוּ
  choice: Свяжите
  rationale: Императив множественного числа от אסר прямо означает «свяжите, привяжите».
- source_word: חַג
  choice: праздничную жертву
  rationale: Обычно существительное означает «праздник», но сочетание с повелением связать и упоминанием жертвенника позволяет понимать его метонимически как жертву праздника. Неоднозначность отмечена в сноске.
- source_word: בַּעֲבֹתִים
  choice: верёвками
  rationale: Обычное значение — толстые верёвки или канаты; вариант «ветвями» менее вероятен и вынесен в сноску.
- source_word: עַד קַרְנוֹת הַמִּזְבֵּחַ
  choice: у самых рогов жертвенника
  rationale: עַד выражает достижение предела. Русское «у самых» естественно обозначает конечную точку связывания, не утверждая однозначно, что жертву следует привязать непосредственно к рогам.
theological_decisions:
- issue: Культовый референт слова חַג
  choice: праздничная жертва
  alternative: праздник или праздничное шествие
  rationale: Жертвенный контекст и глагол «связать» поддерживают метонимическое понимание как жертвенного животного, однако еврейская формулировка остаётся трудной, поэтому иной вариант явно отмечен.
- issue: Отношение жертвы к рогам жертвенника
  choice: у самых рогов жертвенника
  alternative: привяжите к рогам жертвенника
  rationale: Предлог עַד скорее указывает предел «до», чем однозначно обозначает прикрепление к рогам. Выбранный перевод сохраняет пространственную неоднозначность.
