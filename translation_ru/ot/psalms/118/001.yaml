  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: ru
  text: Благодарите Яхве[a], ибо Он благ, ибо милость Его — навеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (ЙХВХ), личное имя Бога; традиционно передаётся как «Господь».
    reason: alternative_reading
  - marker: b
    text: Евр. חֶסֶד может также означать «верная любовь», «неизменная доброта» или «верность завету».
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Благодарите
  rationale: Форма повелительного наклонения множественного числа от ידה в породе hифиль здесь призывает общину воздавать благодарность и хвалу; «благодарите» естественно передаёт смысл литургического призыва.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, обозначенное тетраграмматоном יהוה, а не заменяющий его титул.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание для призыва; «ибо» сохраняет повтор, торжественный ритм и причинное значение обеих конструкций.
- source_word: טוֹב
  choice: благ
  rationale: Краткая форма «благ» прямо утверждает Божью благость и соответствует возвышенному, но понятному регистру псалма.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Передаёт временное значение «вечно, навсегда» без добавления отсутствующего в еврейском тексте глагола «пребывает».
- source_word: חַסְדּוֹ
  choice: Его милость
  rationale: «Милость» естественна для русского библейского языка и охватывает благоволение и доброту; примечание сохраняет более широкий оттенок верной, неизменной любви, присущий חֶסֶד.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет различие между именем и титулом, а традиционный вариант указан в примечании.
- issue: Передача חֶסֶד
  choice: милость
  alternative: верная любовь; заветная верность
  rationale: «Милость» звучит естественно и торжественно по-русски, но не исчерпывает всей смысловой широты слова; поэтому оттенок постоянной верности и любви раскрыт в примечании без сужения текста до одной богословской формулы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Повтор «ибо» и безглагольная заключительная фраза сохраняют параллелизм и лаконичность еврейского оригинала.
