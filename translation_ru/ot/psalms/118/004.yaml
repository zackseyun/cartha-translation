lexical_decisions:
- source_word: יֹאמְרוּ נָא
  choice: Пусть же ... скажут
  rationale: Имперфект 3-го лица множественного числа вместе с נָא в литургическом призыве передан как побуждение; частица «же» естественно выражает настойчивый призыв.
- source_word: יִרְאֵי יְהוָה
  choice: боящиеся Яхве
  rationale: Сохраняет библейское выражение о людях, благоговейно почитающих Бога, не сводя ירא только к почтению или только к страху.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: כִּי
  choice: не выражено отдельным союзом
  rationale: Здесь כִּי вводит содержание возгласа; в современном русском после «скажут» это естественно передаётся прямой речью без начального «ибо» или «что».
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт неограниченную длительность рефрена; именная конструкция сохраняет лаконизм еврейского текста.
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: חֶסֶד объединяет любовь, преданность и надёжность в отношениях; «верная любовь» сохраняет эту широту лучше, чем одно лишь «милость» или «верность».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл חֶסֶד
  choice: верная любовь
  alternative: милость; заветная верность
  rationale: Выбранная формулировка сохраняет одновременно сердечную любовь и неизменную преданность, не ограничивая слово исключительно юридической идеей завета.
translation_notes:
  register: Современный литературный русский с достоинством литургического призыва. Формула «боящиеся Яхве» намеренно сохраняет традиционную библейскую ёмкость, а тире в рефрене естественно восполняет отсутствующую в еврейском связку.
