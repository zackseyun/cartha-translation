lexical_decisions:
- source_word: יְמִין
  choice: десница
  rationale: Сохраняет конкретный поэтический образ правой руки как знака силы и победного действия; слово хорошо узнаваемо в возвышенной библейской поэзии.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: רוֹמֵמָה
  choice: высоко поднята
  rationale: Передаёт значение возвышения или поднятия и согласуется с женским родом слова «десница», не сводя неоднозначность к одному лишь торжеству.
- source_word: עֹשָׂה חָיִל
  choice: являет силу
  rationale: Естественно передаёт еврейское сочетание со значением могучего, доблестного или победоносного действия, сохраняя существительное חָיִל в смысловом центре выражения.
theological_decisions:
- issue: Антропоморфный образ Божьего действия
  choice: Сохранить буквальный образ «десницы Яхве».
  alternative: «Сила Яхве высоко вознесена; Яхве действует могущественно».
  rationale: Конкретный образ правой руки существенен для библейской поэзии и обозначает силу и победное вмешательство Бога; замена абстрактным понятием обеднила бы текст.
- issue: Значение רוֹמֵמָה в победном контексте
  choice: «высоко поднята»
  alternative: «превознесена» или «торжествует»
  rationale: Выбранный вариант сохраняет основной пространственно-результативный смысл глагола, тогда как «торжествует» яснее выражает контекст, но сильнее истолковывает его.
