lexical_decisions:
- source_word: אָנָּא ... נָא
  choice: О ...!
  rationale: Две частицы настойчивой мольбы переданы естественной русской просительной конструкцией с «О» и восклицанием; временного значения «сейчас» у נָא здесь нет.
- source_word: יְהוָה
  choice: ГОСПОДИ
  rationale: Тетраграмматон передан традиционным русским «ГОСПОДЬ» в звательной форме; прописные буквы отличают его от нарицательного титула.
- source_word: הוֹשִׁיעָה
  choice: спаси нас
  rationale: Императив означает «спаси / даруй спасение»; объект в еврейском тексте не назван, но «нас» естественно следует из общинной молитвы.
- source_word: הַצְלִיחָה
  choice: даруй нам успех
  rationale: Каузативный императив от צלח выражает просьбу сделать предприятие успешным, дать преуспевание; «даруй нам успех» звучит естественно и сохраняет параллелизм.
theological_decisions:
- issue: Неуказанные объекты двух повелительных форм
  choice: В основном тексте добавлены «нас» и «нам», а их подразумеваемый характер отмечен сноской.
  alternative: 'Буквально: «спаси» и «даруй успех» без объектов.'
  rationale: Контекст совместного богослужебного воззвания поддерживает общинное прочтение, однако грамматическая неопределённость исходного текста не должна быть скрыта.
translation_notes:
  register: Современный литературный русский с торжественным молитвенным звучанием. Повтор обращения сохранён для параллелизма и настойчивости просьбы; архаические частицы и ошибочное временное «ныне» не используются.
