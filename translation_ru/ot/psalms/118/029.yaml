  text: הוֹד֣וּ לַ/יהוָ֣ה כִּי ט֑וֹב כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/029.yaml
  text: Give thanks to Yahweh[a], for he is good, for his steadfast love endures forever.
translation:
  language: ru
  text: Благодарите Яхве, ибо Он благ, ибо Его верная любовь — навеки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «ибо навеки Его верная любовь». Еврейская фраза не содержит отдельного глагола «пребывает» или «длится».'
    reason: Сохранение особенностей еврейского синтаксиса и указание на более буквальный вариант.
lexical_decisions:
- source_word: הוֹדוּ
  choice: Благодарите
  rationale: Форма повелительного наклонения множественного числа от ידה в породе hифиль здесь призывает общину воздавать благодарность; «благодарите» естественно передаёт литургический смысл рефрена.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата благодарения, а тетраграмматон передан как личное имя «Яхве», без замены титулом.
- source_word: כִּי טוֹב
  choice: ибо Он благ
  rationale: כִּי вводит основание для призыва; связка и местоимение добавлены по нормам русского языка, а «благ» сохраняет возвышенный, но понятный поэтический регистр.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Наречие передаёт буквальное значение длительности «вовеки, навсегда» и не вводит отсутствующий в еврейском тексте глагол «пребывает».
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: חֶסֶד объединяет значения любви, милости, преданности и постоянства. «Верная любовь» сохраняет личностный и устойчивый характер понятия лучше, чем одно лишь «милость».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Смысл חֶסֶד
  choice: верная любовь
  alternative: милость
  rationale: Выбранный вариант передаёт как благоволение, так и верность, не сводя многозначное слово исключительно к милосердию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Повтор «ибо» сохраняет параллелизм и литургический ритм оригинала.
