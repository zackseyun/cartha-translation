lexical_decisions:
- source_word: זֶה הַיּוֹם
  choice: Вот день
  rationale: Указательное זֶה вместе с определённым הַיּוֹם выделяет конкретный день. Русское «вот день» естественно передаёт предъявляющую, дейктическую силу оборота.
- source_word: עָשָׂה
  choice: сотворил
  rationale: Форма Qal perfect 3 м. ед. ч. обозначает завершённое действие. С существительным «день» глагол «сотворил» звучит естественно и ясно указывает на Божье действие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: נָגִילָה
  choice: будем ликовать
  rationale: Когортатив 1-го лица мн. числа выражает совместное побуждение. «Будем ликовать» сохраняет эту силу и значение радостного торжества.
- source_word: וְנִשְׂמְחָה
  choice: и радоваться
  rationale: Второй когортатив продолжает совместное побуждение; иной русский глагол сохраняет смысловое различие между גיל и שׂמח.
- source_word: בּוֹ
  choice: в него
  rationale: Местоименный суффикс мужского рода естественно соотносится со словом «день». Буквальное «в него» сохранено, а более привычное русское понимание пояснено в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет это различие.
- issue: Референт местоимения בּוֹ
  choice: 'день: «в него»'
  alternative: 'Бог: «о Нём / в Нём»'
  rationale: Грамматически суффикс мужского рода допускает обе связи, однако ближайший и наиболее естественный антецедент — «день». Возможность иной связи отмечена, но не внесена в основной текст.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным псалмодическим звучанием. Параллельные глаголы переданы различно, чтобы сохранить оттенки исходных слов; точка с запятой отражает переход от провозглашения к общему призыву.
