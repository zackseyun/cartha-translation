id: PSA.118.6
reference: Psalms 118:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יְהוָ֣ה לִ֭/י לֹ֣א אִירָ֑א מַה יַּעֲשֶׂ֖ה לִ֣/י אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/006.yaml
  text: Yahweh is for me[a]; I will not fear[b]. What can man do to me?
translation:
  language: ru
  text: Яхве за меня — я не стану бояться. Что может[b] сделать мне человек[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское אָדָם стоит в единственном числе и здесь означает человека вообще, то есть любого человека.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Что сделает мне человек?» Слово «может» передаёт риторический смысл вопроса.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; это общепринятая русская транслитерация формы Yahweh.
- source_word: לִי
  choice: за меня
  rationale: 'В первой строке предлог ל с местоименным суффиксом выражает поддержку и расположение: Яхве на стороне говорящего.'
- source_word: לֹא אִירָא
  choice: я не стану бояться
  rationale: Имперфект допускает оттенок решимости и уверенности в будущем; эта формулировка передаёт его естественным современным русским языком.
- source_word: מַה יַעֲשֶׂה
  choice: что может сделать
  rationale: Буквально конструкция означает «что сделает», но в контексте это риторический вопрос об ограниченности человеческих возможностей; модальный глагол делает этот смысл естественным по-русски, а буквальная форма отмечена в сноске.
- source_word: לִי
  choice: мне
  rationale: Во второй строке предлог указывает на лицо, которого затрагивает действие; дательный падеж «мне» непосредственно передаёт эту связь.
- source_word: אָדָם
  choice: человек
  rationale: Существительное стоит в единственном числе и употреблено обобщённо, обозначая любого человека; русское «человек» сохраняет и число, и родовое значение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Обобщённое единственное число אָדָם
  choice: человек
  alternative: люди; смертный
  rationale: Выбор «человек» сохраняет грамматическое единственное число и противопоставление Бога ограниченному человеку, не сужая значение до мужчины.
- issue: Модальность риторического вопроса מַה יַעֲשֶׂה
  choice: что может сделать
  alternative: что сделает
  rationale: Форма «может» естественно раскрывает риторический смысл вопроса, не утверждая, будто человек вообще не способен причинить вред; буквальная грамматическая форма сохранена в примечании.
translation_notes:
  register: Современный литературный русский с кратким, уверенным ритмом псалма. Формула «за меня» естественно выражает поддержку; «не стану бояться» сохраняет оттенок решимости без архаичного «не убоюсь».
