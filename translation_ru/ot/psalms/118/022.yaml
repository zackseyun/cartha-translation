lexical_decisions:
- source_word: אֶבֶן
  choice: камень
  rationale: Обычное значение существительного — «камень»; этот вариант естественен по-русски и не уточняет без достаточных оснований ни размер, ни назначение камня.
- source_word: מָאֲסוּ
  choice: отвергли
  rationale: Глагол מאס выражает сознательное отвержение или отказ; «отвергли» точно передаёт смысл в строительной метафоре.
- source_word: הַבּוֹנִים
  choice: строители
  rationale: Субстантивированное причастие от בנה буквально обозначает «строящих»; «строители» — краткий и естественный русский эквивалент.
- source_word: הָיְתָה
  choice: стал
  rationale: Еврейский перфект здесь обозначает совершившееся изменение положения и его результат. Русское «стал» естественно передаёт переход от отвержения к почётному назначению.
- source_word: לְרֹאשׁ פִּנָּה
  choice: краеугольным
  rationale: Буквально выражение означает «главой угла». В сочетании со словом «камень» традиционное и понятное «краеугольным» сохраняет архитектурную метафору, не навязывая менее надёжное уточнение вроде «замкового» или «верхнего» камня.
theological_decisions:
- issue: Мессианское и христологическое применение стиха в позднейших библейских текстах
  choice: В основном тексте сохранена исходная архитектурная метафора без прямого указания на Мессию или Христа.
  alternative: Внести христологическое истолкование непосредственно в перевод.
  rationale: Сам еврейский стих говорит через образ отвержения и последующего возвышения, не называя прямо Мессию. Новозаветное применение отмечено в сноске, благодаря чему каноническая связь видна, но не подменяет смысл исходной формулировки.
- issue: Архитектурная функция выражения רֹאשׁ פִּנָּה
  choice: Передать как «краеугольный», сохранив некоторую неопределённость конкретной функции камня.
  alternative: Уточнить как «замковый камень», «верхний камень» или «главный угловой камень».
  rationale: Буквальное «глава угла» допускает разные представления о положении и функции камня. «Краеугольный» естественно передаёт его главенствующее место, не разрешая спорную деталь без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис краткий и ясный; традиционное «краеугольный» понятно в библейском контексте и сохраняет узнаваемую метафору. Все маркеры сносок помещены в основном тексте.
