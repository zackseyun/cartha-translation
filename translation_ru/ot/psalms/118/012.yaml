lexical_decisions:
- source_word: סַבּוּנִי
  choice: они окружили меня
  rationale: Форма от סבב означает «окружать, обступать»; перевод естественно передаёт враждебное окружение.
- source_word: כִדְבוֹרִים
  choice: словно пчёлы
  rationale: Префикс כ־ вводит прямое сравнение и сохраняет яркий образ пчелиного роя.
- source_word: דֹּעֲכוּ
  choice: погасли
  rationale: Глагол דעך обозначает угасание или затухание, особенно огня; краткий русский глагол точно связывает врагов с последующим образом пламени.
- source_word: כְּאֵשׁ קוֹצִים
  choice: как огонь в терновнике
  rationale: Сжатое еврейское выражение буквально говорит об «огне терний» и допускает оттенки огня из терновника или среди терний; выбранная формулировка естественна по-русски и сохраняет образ быстро вспыхивающего колючего кустарника.
- source_word: בְּשֵׁם יְהוָה
  choice: Именем Яхве
  rationale: Предлог ב־ здесь выражает действие с призыванием имени и опорой на власть Яхве; творительный оборот звучит естественно и торжественно.
- source_word: כִּי
  choice: непременно
  rationale: В повторяющемся рефрене כִּי имеет усилительную функцию; «непременно» передаёт уверенность говорящего, не превращая частицу в причинный союз.
- source_word: אֲמִילַם
  choice: я отсеку их
  rationale: Форма от מול в породе хифиль допускает значения «отсекать, срезать, уничтожать»; «отсеку» сохраняет конкретность образа и не устраняет его возможную связь с терновником.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога, тетраграмматон; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Характер победы над окружившими врагами
  choice: Именем Яхве я непременно отсеку их
  alternative: Во имя Яхве я уничтожил их
  rationale: Выбранный вариант сохраняет и упование на имя Яхве, и образный глагол «отсечь», не сводя выражение к отвлечённому уничтожению; будущая форма соответствует префиксальной форме אֲמִילַם и выраженной уверенности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным псалмическим звучанием. Синтаксический параллелизм и резкие образы оригинала сохранены; архаизмы и конфессионально окрашенные добавления не использованы.
