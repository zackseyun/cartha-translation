- issue: Характер действия אֲמִילַם
  choice: отсеку их
  alternative: отражу их / уничтожу их
  rationale: Основной текст сохраняет резкий образ «отсечения», не уточняя сверх текста, означает ли он буквальное поражение, уничтожение или окончательное устранение угрозы.
