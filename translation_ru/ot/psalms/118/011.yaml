- source_word: בְּשֵׁם יְהוָה
  choice: именем Яхве
  rationale: Предлог בְּ здесь указывает на действие с призыванием имени и опорой на власть Яхве; краткая русская формула «именем Яхве» естественно сохраняет эту многогранность.
- source_word: כִּי
  choice: непременно
  rationale: В данном рефрене כִּי имеет усилительно-утвердительную силу; «непременно» передаёт решимость, не создавая неестественной причинной связи.
- source_word: אֲמִילַם
  choice: я отсеку их
  rationale: Форма от מול в породе hифиль выражает решительное устранение противников и буквально поддерживает образ отсечения. Русское будущее также передаёт волевую, уверенную направленность древнееврейского имперфекта.
