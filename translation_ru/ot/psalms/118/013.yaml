  yaml_path: translation/ot/psalms/118/013.yaml
  text: You pushed me hard so that I might fall[b][a], but Yahweh helped me.
translation:
  language: ru
  text: Ты сильно толкнул меня[a], чтобы я упал, но[b] Яхве помог мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «толкая, ты толкал меня». Это усилительная еврейская конструкция; её можно также передать: «ты сильно толкнул меня» или «ты яростно отталкивал меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и Яхве помог мне». Еврейский союз может означать просто «и», хотя контекст позволяет понимать его как противительный: «но».'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּחֹה דְחִיתַנִי
  choice: изо всех сил толкал меня
  rationale: Инфинитив абсолютный перед личной формой того же глагола усиливает действие. Русское «изо всех сил толкал» естественно передаёт настойчивость и силу враждебного толчка, не воспроизводя буквально еврейский повтор.
- source_word: לִנְפֹּל
  choice: чтобы я упал
  rationale: Инфинитив с לְ допускает оттенок цели или результата. Формулировка «чтобы я упал» сохраняет эту смысловую открытость и естественно звучит по-русски.
- source_word: וַיהוָה
  choice: но Яхве
  rationale: Союз וְ буквально может означать «и», однако здесь по контексту выражает резкое противопоставление нападению; поэтому в основном тексте выбрано «но», а буквальная возможность отмечена в сноске.
- source_word: עֲזָרָנִי
  choice: помог мне
  rationale: Прямая и естественная передача глагольной формы עזר с объектным суффиксом первого лица.
- source_word: יהוה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому личное имя передано транслитерацией «Яхве», без замены титулом.
- issue: Характер связи между нападением и Божьей помощью
  choice: но
  alternative: и
  rationale: Контекст поддерживает противительное прочтение союза, однако его более нейтральное значение «и» остаётся грамматически возможным и указано в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным построением. Единственное число обращённого «ты» сохранено. Выражение «изо всех сил» передаёт усиление без тяжеловесного буквального повтора; неоднозначность союза и усилительная конструкция разъяснены в сносках.
