  text: Ях сурово наказал меня, но смерти не предал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַסֹּר יִסְּרַנִּי
  choice: Строго наказал меня
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает действие. «Строго наказал» естественно передаёт эмфазу и смысл исправляющего взыскания, не добавляя идеи окончательного осуждения.
- source_word: יָּהּ
  choice: Ях
  rationale: Сохранена краткая поэтическая форма божественного имени, отличная от полного тетраграмматона.
- source_word: וְלַמָּוֶת לֹא נְתָנָנִי
  choice: но смерти не предал меня
  rationale: 'Союз в контексте выражает противопоставление: взыскание было строгим, однако не завершилось смертью. נתן с ל перед מָוֶת передано естественным русским оборотом «предать смерти».'
theological_decisions:
- issue: Передача краткой поэтической формы имени יָהּ
  choice: Ях
  alternative: Господь
  rationale: Транслитерация сохраняет различие между краткой формой יָהּ и полным именем יהוה. Это лексико-поэтическое, а не конфессиональное решение.
- issue: Характер Божьего воздействия
  choice: наказал
  alternative: вразумил / подверг взысканию
  rationale: Корень יסר допускает оттенки наказания, исправления и наставления. В сочетании с усилительной конструкцией и противопоставлением смерти «строго наказал» передаёт суровость воздействия, не утверждая, что оно было лишь карательным.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Инверсия в обороте «смерти не предал меня» сохраняет торжественный ритм и подчёркивает контраст между строгим взысканием и избавлением от смерти.
