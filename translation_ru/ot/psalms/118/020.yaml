  text: זֶֽה הַ/שַּׁ֥עַר לַ/יהוָ֑ה צַ֝דִּיקִ֗ים יָבֹ֥אוּ בֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/020.yaml
  text: This is the gate of Yahweh[a]; the righteous will enter through it.
translation:
  language: ru
  text: Это врата Яхве[a]; праведные войдут через них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «врата для Яхве»; или: «врата к Яхве». Еврейский предлог может выражать отношение, принадлежность, предназначение или направление; в данном контексте выражение «врата Яхве» лучше всего передаёт основной смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה
  choice: Это
  rationale: Указательное местоимение вводит отождествление; в русском настоящем времени связка не требуется.
- source_word: הַשַּׁעַר
  choice: врата
  rationale: Слово обозначает ворота или вход. «Врата» сохраняет конкретный образ и соответствует возвышенному храмово-процессионному контексту, оставаясь понятным современному читателю.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל допускает значение принадлежности, отношения или направления. Беспредложное сочетание «врата Яхве» естественно передаёт основное понимание — врата, принадлежащие Яхве или связанные с Ним, — не устраняя полностью смысловую широту оригинала.
- source_word: צַדִּיקִים
  choice: праведные
  rationale: Субстантивированное прилагательное во множественном числе обозначает людей, отличающихся праведностью; «праведные» кратко и естественно сохраняет нравственно-богословский смысл.
- source_word: יָבֹאוּ
  choice: войдут
  rationale: Форма qal imperfect 3-го лица множественного числа здесь выражает будущее действие или уверенность в нём. С существительным «врата» глагол «войдут» звучит естественно.
- source_word: בוֹ
  choice: через них
  rationale: При указании на врата предлог ב контекстуально передаёт прохождение через них. Множественное число местоимения обусловлено русским грамматическим числом слова «врата».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон יהוה. Транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Значение предлога ל в לַיהוָה
  choice: врата Яхве
  alternative: врата для Яхве; врата к Яхве
  rationale: Предлог может выражать принадлежность, отношение, предназначение или направление. В данном контексте связь или принадлежность лучше всего передаётся сочетанием «врата Яхве», а иные реальные возможности отмечены в сноске без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Врата» уместно для храмово-процессионного контекста; синтаксис краток и следует параллельной структуре еврейского стиха.
