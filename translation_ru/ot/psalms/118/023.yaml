  text: מֵ/אֵ֣ת יְ֭הוָה הָ֣יְתָה זֹּ֑את הִ֖יא נִפְלָ֣את בְּ/עֵינֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/023.yaml
  text: This has come from Yahweh[b][a]; it is marvelous in our eyes.
translation:
  language: ru
  text: Это — от Яхве; оно дивно в наших глазах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵת
  choice: от
  rationale: Предлог указывает на источник или происхождение; «от» естественно передаёт, что событие исходит от Яхве, не добавляя отсутствующего в тексте образа руки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление Божьего имени в еврейском тексте.
- source_word: הָיְתָה זֹּאת
  choice: пришло это
  rationale: Буквально конструкция означает «это было/стало». В сочетании с מֵאֵת она указывает на происхождение данного события; «пришло это» сохраняет эту мысль и не уточняет сверх текста, что именно произошло.
- source_word: הִיא
  choice: оно
  rationale: Самостоятельное местоимение подчёркивает предмет высказывания. Средний род соотносится с обобщённым «это» как с событием или делом.
- source_word: נִפְלָאת
  choice: дивно
  rationale: Форма от פלא выражает нечто чудесное, необычайное и вызывающее изумление. «Дивно» сохраняет возвышенный поэтический тон и в данном наречном обороте звучит естественно.
- source_word: בְּעֵינֵינוּ
  choice: в наших глазах
  rationale: Сохранён прозрачный еврейский образ, обозначающий восприятие и оценку говорящих.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога, а не титул. «Яхве» сохраняет это различие и наиболее прямо передаёт тетраграмматон.
- issue: Отнесение указательного и личного местоимений
  choice: «это; оно» оставлено без уточнения конкретного предмета
  alternative: «это дело» или прямое отнесение к отвергнутому камню из предыдущего стиха
  rationale: Контекст допускает связь с событием предыдущего стиха, однако сам стих называет его лишь «это». Добавление существительного или однозначного толкования устранило бы сохранённую в оригинале обобщённость.
translation_notes:
  register: Современный литературный русский с поэтической возвышенностью Псалтири. Инверсия «пришло это» сохраняет акцент на происхождении от Яхве; «дивно в наших глазах» передаёт параллелизм и образность оригинала без излишнего осовременивания.
