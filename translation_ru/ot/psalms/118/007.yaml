lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לִי
  choice: за меня
  rationale: 'Предлог ל с местоименным суффиксом выражает отношение поддержки: «за меня, на моей стороне».'
- source_word: בְּעֹזְרָי
  choice: среди тех, кто мне помогает
  rationale: Сохраняет предлог ב и множественное число причастной формы «помогающие мне», не сводя её к единственному «мой помощник».
- source_word: וַאֲנִי
  choice: и я
  rationale: Самостоятельное местоимение сохраняет обозначенный в еврейском тексте субъект; русское «я» в данном противопоставлении естественно несёт нужное ударение без добавления «сам».
- source_word: אֶרְאֶה
  choice: увижу
  rationale: Сохраняет основное значение ראה и не делает подразумеваемое торжество явным утверждением.
- source_word: בְשֹׂנְאָי
  choice: что станет с ненавидящими меня
  rationale: Естественно передаёт идиоматическое сочетание ראה ב с причастной формой «ненавидящие меня», обозначая наблюдение их участи без прямого уточнения её характера.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Подразумеваемая участь ненавидящих псалмопевца
  choice: не уточнять, что именно с ними произойдёт
  alternative: «увижу их поражение» или «буду торжествовать над ними»
  rationale: Еврейская идиома допускает такой оттенок, но прямо не называет ни поражения, ни торжества; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Конструкция «за меня» передаёт сторону и поддержку, а придаточное «что станет с…» делает еврейскую идиому понятной без чрезмерного истолкования.
