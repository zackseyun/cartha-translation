  text: Яхве — за меня, вместе с теми, кто помогает мне[a]; я увижу ненавидящих меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве — за меня среди тех, кто помогает мне»; возможно также: «Яхве — со мной среди тех, кто помогает мне». Еврейское выражение содержит множественное число: «помогающие мне».'
