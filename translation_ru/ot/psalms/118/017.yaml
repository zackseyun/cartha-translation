source:
  edition: WLC
  text: לֹֽא אָמ֥וּת כִּי אֶֽחְיֶ֑ה וַ֝/אֲסַפֵּ֗ר מַֽעֲשֵׂ֥י יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/017.yaml
  text: I will not die[a], but I will live and recount the deeds of Yah.
translation:
  language: ru
  text: Не умру, но буду жить и возвещать дела Яха.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «Ях» — сокращённая поэтическая форма Божьего имени; во многих переводах здесь стоит «Господь».
    reason: Сохраняется особая форма имени в исходном тексте и указывается распространённый вариант перевода.
lexical_decisions:
- source_word: לֹא אָמוּת
  choice: не умру
  rationale: Отрицание и форма 1-го лица передают уверенное высказывание о будущем; краткая формулировка сохраняет поэтическую силу оригинала.
- source_word: כִּי
  choice: но
  rationale: 'В данном противопоставлении частица естественно выражает контраст: «не умру, но буду жить». Возможное причинное значение «ибо» здесь менее естественно по контексту.'
- source_word: אֶחְיֶה
  choice: буду жить
  rationale: Форма 1-го лица соотнесена с «не умру» и сохраняет антитетический параллелизм.
- source_word: וַאֲסַפֵּר
  choice: и возвещать
  rationale: 'Глагол ספר в породе piel означает рассказывать, возвещать, перечислять. Инфинитив после «буду» по-русски естественно объединяет два будущих действия: «буду жить и возвещать».'
- source_word: מַעֲשֵׂי
  choice: дела
  rationale: Слово обозначает совершённые действия или деяния; «дела» понятно современному читателю и сохраняет традиционную возвышенность псалма.
- source_word: יָהּ
  choice: Ях
  rationale: Передана сокращённая поэтическая форма личного имени Бога, отличная по форме от полного тетраграмматона; это имя, а не титул.
theological_decisions:
- issue: Передача краткой формы Божьего имени יָהּ
  choice: Ях
  alternative: Господь
  rationale: Транслитерация сохраняет присутствующую в еврейском тексте сокращённую поэтическую форму имени и не заменяет её более общим титулом.
- issue: Связь между «не умру» и «буду жить»
  choice: 'противительная: «но»'
  alternative: 'причинная: «ибо»'
  rationale: В контексте стиха כִּי убедительно читается как усиленное противопоставление. Причинное прочтение грамматически возможно, поэтому оно не объявляется невозможным.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным ритмом псалма. Синтаксический параллелизм и контраст оригинала сохранены; редкая форма имени пояснена сноской.
