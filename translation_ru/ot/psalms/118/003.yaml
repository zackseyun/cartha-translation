  text: יֹֽאמְרוּ נָ֥א בֵֽית אַהֲרֹ֑ן כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/003.yaml
  text: Let the house of Aaron now say[a], “His steadfast love endures forever.”
translation:
  language: ru
  text: 'Пусть же дом Аарона скажет: «Ибо Его неизменная любовь пребывает вовек!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: пусть … скажет
  rationale: Форма qal imperfect 3-го лица множественного числа в данном литургическом призыве имеет побудительное значение. В русском языке конструкция «пусть … скажет» естественно передаёт этот оттенок; единственное число согласовано с собирательным выражением «дом Аарона».
- source_word: נָא
  choice: же
  rationale: Частица усиливает призыв или придаёт ему настойчивость. Русское «же» передаёт побудительный акцент, не приписывая частице обязательно временное значение «теперь».
- source_word: בֵית אַהֲרֹן
  choice: дом Аарона
  rationale: Сочетание обозначает весь род Аарона, то есть священническое сообщество. Сохранён библейский образ «дома», понятный и естественный в контексте псалма.
- source_word: כִּי
  choice: не выражено отдельным словом
  rationale: Здесь частица вводит содержание возгласа. В современном русском языке после «скажет» двоеточие естественно выполняет эту функцию; перевод «ибо» мог бы ошибочно представить возглас как объяснение предыдущего призыва.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Наречие кратко и естественно передаёт значение неограниченной продолжительности. Именное предложение с тире сохраняет лаконизм еврейского рефрена.
- source_word: חַסְדּוֹ
  choice: Его неизменная любовь
  rationale: חֶסֶד охватывает преданную, милосердную и надёжную любовь, особенно в отношениях завета. «Неизменная любовь» сохраняет одновременно личный и устойчивый характер понятия, не сужая его только до милосердия или юридической верности.
theological_decisions:
- issue: Передача חֶסֶד в формуле хвалы заветной верности Бога
  choice: неизменная любовь
  alternative: милость; верность завету; преданная любовь
  rationale: Выбранный вариант передаёт устойчивость и личностный характер Божьего отношения, сохраняя смысловую широту еврейского слова. Альтернативы приведены в примечании, чтобы не скрывать его заветный и милосердный оттенки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным литургическим звучанием. Частица «же» сохраняет настойчивость призыва, а краткое именное предложение — ритм повторяющегося рефрена.
