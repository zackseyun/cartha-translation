  text: ט֗וֹב לַ/חֲס֥וֹת בַּ/יהוָ֑ה מִ֝/בְּטֹ֗חַ בָּ/אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/008.yaml
  text: It is better to take refuge in Yahweh than to trust in man[a].
translation:
  language: ru
  text: Лучше искать убежища у Яхве, чем полагаться на человека[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на людей» или «на человечество»; еврейское слово «человек» стоит в единственном числе, но употреблено здесь в обобщённом значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: Предикативное прилагательное вводит сравнительную оценку; русское «лучше» естественно и полно передаёт конструкцию.
- source_word: לַחֲסוֹת
  choice: искать убежища
  rationale: Инфинитив от חסה обозначает обращение за защитой, особенно к Богу; формулировка сохраняет образ убежища и не смешивает его с последующим «полагаться».
- source_word: בַּיהוָה
  choice: у Яхве
  rationale: Предлог указывает на того, у кого ищут защиты; «у» естественно сочетается в русском с выражением «искать убежища». Тетраграмматон передан личным именем «Яхве».
- source_word: מִבְּטֹחַ
  choice: чем полагаться
  rationale: מן при инфинитиве выражает сравнение; בטח означает доверие и уверенную опору. «Полагаться» здесь естественно и сохраняет отличие от образа убежища.
- source_word: בָּאָדָם
  choice: на человека
  rationale: אָדָם употреблено в единственном числе обобщённо и противопоставляет человеческую опору Яхве; русский «человек» сохраняет и единственное число, и родовое значение.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит Тетраграмматон как личное имя Бога; транслитерация «Яхве» сохраняет это имя и соответствует предоставленному богословскому решению.
- issue: Обобщённое значение אָדָם в противопоставлении Богу
  choice: человек
  alternative: люди; человечество
  rationale: Еврейское слово стоит в единственном числе, но имеет обобщённый смысл. «Человек» сохраняет форму источника, не ограничивая значение одним конкретным мужчиной.
translation_notes:
  register: Современный литературный русский язык; краткая параллельная структура стиха сохранена. Формулировка «искать убежища у Яхве» звучит естественно, достойно и удерживает метафору защитного укрытия.
