  text: Из тесноты я воззвал к Яху; Ях ответил мне, дав простор.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Из тесного места я воззвал к Яху; Ях ответил мне на широком месте». В еврейском тексте тесное и широкое место служат образами бедствия и избавления; выражение может описывать ответ как данный в просторе, то есть освобождении от стеснения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן־הַמֵּצַר
  choice: Из тесноты
  rationale: Предлог מִן указывает на исходную точку, а מֵצַר обозначает тесное, стеснённое место и переносно — бедствие. «Из тесноты» естественно по-русски передаёт и состояние беды, и пространственный образ, противопоставленный простору.
- source_word: קָרָאתִי
  choice: я воззвал к
  rationale: В молитвенном контексте קרא означает обращение с призывом. «Воззвал к» сохраняет возвышенный поэтический регистр псалма, оставаясь понятным современному читателю.
- source_word: יָהּ
  choice: Ях
  rationale: В тексте дважды употреблена краткая поэтическая форма Божьего имени, а не полная форма יהוה. Транслитерация «Ях» сохраняет это лексическое различие и повтор.
- source_word: עָנָנִי
  choice: ответил мне
  rationale: Глагол ענה с объектным суффиксом прямо означает «ответил мне».
- source_word: בַמֶּרְחָב
  choice: простором
  rationale: מֶרְחָב — широкое, просторное место, переносно свобода от стеснения. Творительный «простором» допускается значением предлога בְּ и ёмко сохраняет образный контраст с «теснотой», не добавляя отсутствующего в еврейском тексте глагола «вывел».
theological_decisions:
- issue: Передача краткой формы Божьего имени יָהּ
  choice: Ях
  alternative: Господь
  rationale: Транслитерация сохраняет именно краткую поэтическую форму имени и её двукратный повтор. Замена титулом «Господь» устранила бы различие между יָהּ и полным тетраграмматоном.
- issue: Характер ответа Бога в выражении בַמֶּרְחָב
  choice: ответил мне простором
  alternative: ответил мне на просторе / вывел меня на простор
  rationale: Форма с בְּ допускает инструментальное либо локативное понимание. Основной текст передаёт избавление посредством пространственного образа, но не вводит глагол «вывел», которого в масоретском тексте нет; локативная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Парные слова «теснота — простор» сохраняют краткость, параллелизм и пространственную метафору оригинала.
