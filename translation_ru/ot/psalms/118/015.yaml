base_translation:
  language: en
  yaml_path: translation/ot/psalms/118/015.yaml
  text: 'The sound of joyful shouting and salvation is in the tents of the righteous: “The right hand of Yahweh does valiantly!”[a][b]'
translation:
  language: ru
  text: 'В шатрах праведников звучат возгласы ликования и спасения[a]: «Десница Яхве действует могущественно!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавления» или «победы» вместо «спасения».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская идиома; также: «совершает великие дела», «действует с силой» или «доблестно действует».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֤וֹל
  choice: голоса
  rationale: קוֹל означает голос или звук; в сочетании с ликованием естественное русское множественное число передаёт слышимые возгласы в шатрах.
- source_word: רִנָּה
  choice: ликования
  rationale: רִנָּה обозначает громкий радостный возглас или торжествующий крик; «ликование» сохраняет радостный и звучащий характер слова.
- source_word: וִישׁוּעָה
  choice: спасения
  rationale: יְשׁוּעָה может обозначать спасение, избавление или победу. «Спасение» сохраняет широкий смысл, а возможные конкретизации вынесены в примечание.
- source_word: בְּאָהֳלֵי
  choice: в шатрах
  rationale: Сохранён конкретный образ шатров, выраженный формой множественного числа אֹהֶל.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное צַדִּיקִים обозначает праведных людей как нравственно-религиозную категорию.
- source_word: יְמִין יְהוָה
  choice: Десница Яхве
  rationale: «Десница» естественно сохраняет возвышенный библейский образ правой руки как символа могущественного действия; личное имя יהוה передано как «Яхве».
- source_word: עֹשָׂה חָיִל
  choice: являет силу
  rationale: Еврейское идиоматическое сочетание означает действовать могущественно, доблестно или совершать великие дела; «являет силу» звучит естественно и не сужает смысл до одной военной победы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст непосредственно употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя.
- issue: Значение יְשׁוּעָה в контексте победного псалма
  choice: спасение
  alternative: избавление; победа
  rationale: «Спасение» охватывает как конкретное избавление, так и более широкое богословское значение; контекстуальные оттенки сохранены в примечании.
- issue: Образ יְמִין как орудия Божьего действия
  choice: Десница Яхве
  alternative: Правая рука Яхве
  rationale: «Десница» сохраняет метафору и торжественный поэтический регистр, не превращая образ в отвлечённое упоминание силы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Инверсия с тире передаёт возгласный ритм стиха; «шатры» и «десница» сохраняют ключевые образы оригинала. Все маркеры примечаний помещены после цитируемого возгласа.
