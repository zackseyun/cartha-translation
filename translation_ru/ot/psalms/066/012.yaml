  text: הִרְכַּ֥בְתָּ אֱנ֗וֹשׁ לְ/רֹ֫אשֵׁ֥/נוּ בָּֽאנוּ בָ/אֵ֥שׁ וּ/בַ/מַּ֑יִם וַ֝/תּוֹצִיאֵ֗/נוּ לָֽ/רְוָיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/012.yaml
  text: You made a man ride over our heads; we went through fire and through water, yet you brought us out into abundance.
translation:
  language: ru
  text: Ты дал человеку проехать по нашим головам; мы прошли сквозь огонь и воду, но Ты вывел нас к изобилию.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на простор»; еврейское слово передаёт мысль о насыщении, изобилии и благополучии.'
    reason: לָרְוָיָה прежде всего связано с насыщением и достатком; «простор» возможен как контекстуальный образ избавления.
lexical_decisions:
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Существительное стоит в единственном числе и обозначает смертного человека; форма не требует множественного «люди».
- source_word: הִרְכַּבְתָּ
  choice: Ты допустил, чтобы … проехал
  rationale: Каузативная форма буквально выражает «Ты заставил/дал ехать». В контексте испытания естественная русская передача «допустил» сохраняет приписывание происходящего Богу, не утверждая, что Он непосредственно принуждал угнетателя.
- source_word: לְרֹאשֵׁנוּ
  choice: по нашим головам
  rationale: Сохранён яркий образ господства и унижения; предлог допускает представление движения поверх голов.
- source_word: בָאנוּ בָאֵשׁ וּבַמַּיִם
  choice: мы прошли сквозь огонь и воду
  rationale: Глагол буквально означает «мы вошли/пришли», но устойчивое русское «прошли сквозь» естественно передаёт пережитые крайние испытания.
- source_word: לָרְוָיָה
  choice: на простор
  rationale: Редкое слово связано с насыщением, изобилием и облегчением; в данном противопоставлении бедствию «простор» естественно выражает место благополучия, но смысловая широта отмечена сноской.
theological_decisions:
- issue: Божественная причинность в испытании
  choice: Ты допустил, чтобы человек проехал
  alternative: Ты заставил человека проехать
  rationale: Исходный хифиль выражает причинность, однако русское «заставил» может излишне конкретизировать способ Божьего участия и прямое принуждение человека. «Допустил» сохраняет Божье верховенство в контексте псалма, не снимая напряжения полностью.
- issue: Значение конечного избавления
  choice: вывел нас на простор
  alternative: вывел нас к изобилию / в место изобилия
  rationale: Еврейское слово может указывать как на изобилие, так и на просторное, насыщенное благополучием место. Основной текст сохраняет образ избавления, а сноска сообщает альтернативный оттенок.
translation_notes:
  register: Современный литературный русский язык с торжественной поэтической интонацией. Образы огня, воды и попрания сохранены; обращение к Богу оформлено традиционным прописным «Ты».
