lexical_decisions:
- source_word: אָבוֹא
  choice: Войду
  rationale: Qal, имперфект 1-го лица ед. числа от בוא. При дополнении «в Твой дом» русское «войду» естественно передаёт направленное движение внутрь; возможное «приду» менее точно выражает эту пространственную связь.
- source_word: בֵיתְךָ
  choice: Твой дом
  rationale: Буквально «Твой дом». В контексте речь идёт о Божьем святилище, однако основной текст сохраняет конкретный еврейский образ, не сужая его до «храма».
- source_word: בְעוֹלוֹת
  choice: со всесожжениями
  rationale: עוֹלָה — установленное обозначение жертвы, полностью сжигаемой на жертвеннике; ב здесь выражает сопровождение. «Со всесожжениями» точно и естественно для русского библейского регистра.
- source_word: אֲשַׁלֵּם
  choice: исполню
  rationale: Piel, имперфект 1-го лица ед. числа от שלם в сочетании с обетами означает исполнить обязательство, данное в обете. «Исполню» естественнее современного русского «уплачу обеты» и сохраняет смысл обязательности.
- source_word: לְךָ
  choice: перед Тобой
  rationale: ל указывает на Бога как адресата и получателя исполнения обетов. Русское идиоматическое сочетание «исполнить обеты перед Богом» здесь звучит естественнее буквального «Тебе», хотя последнее также возможно.
- source_word: נְדָרָי
  choice: мои обеты
  rationale: Форма множественного числа с суффиксом 1-го лица ед. числа буквально означает «мои обеты».
theological_decisions:
- issue: Следует ли прямо истолковать «Твой дом» как храм или святилище
  choice: Сохранить «Твой дом» в основном тексте
  alternative: Твой храм; Твоё святилище
  rationale: Еврейский текст говорит «Твой дом». Контекст всесожжений ясно указывает на место богослужения, но не требует заменять исходный образ более узким толкованием.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской издательской практике. Синтаксический параллелизм стиха сохранён.
