  text: All the earth will bow down to you and sing praise to you[a]; they will sing praise to your name[b]. Selah
translation:
  language: ru
  text: Вся земля поклонится Тебе и будет петь Тебе хвалу; будет воспевать имя Твоё. Села.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
