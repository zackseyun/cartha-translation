lexical_decisions:
- source_word: כָּל הָאָרֶץ
  choice: Вся земля
  rationale: Сочетание имеет всеобъемлющий смысл; «земля» сохраняет широкий, а не местный охват псалма.
- source_word: יִשְׁתַּחֲווּ
  choice: поклонится
  rationale: Глагол обозначает преклонение, вплоть до простирания ниц, как действие почитания. Русское «поклонится» естественно сохраняет и телесный образ, и богослужебный смысл.
- source_word: לְךָ
  choice: Тебе
  rationale: Дательный падеж естественно передаёт направленность действия к адресату в сочетании с обоими русскими глаголами.
- source_word: וִיזַמְּרוּ / יְזַמְּרוּ
  choice: воспоёт / воспоёт
  rationale: זמר в данном контексте означает хвалебное пение. «Воспоёт» кратко и возвышенно передаёт песенную хвалу; повтор корня сохранён.
- source_word: שִׁמְךָ
  choice: имя Твоё
  rationale: Буквальное «имя» сохраняет значимое библейское выражение, не сводя его к известности или славе.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неизвестно, поэтому он передан транслитерацией, без предположительного истолкования.
theological_decisions:
- issue: Передавать ли יִשְׁתַּחֲווּ явно культовым словом или обозначением телесного действия
  choice: поклонится
  alternative: прострётся перед Тобой; будет поклоняться Тебе
  rationale: «Поклонится» по-русски совмещает телесное преклонение и почитание Бога, не устраняя заложенную в еврейском слове многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Единственное число сказуемых согласовано с собирательным выражением «вся земля». Местоимения, относящиеся к Богу, написаны с прописной буквы согласно устойчивой русской библейской традиции.
