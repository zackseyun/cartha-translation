lexical_decisions:
- source_word: אֲשֶׁר
  choice: которые
  rationale: Относительное местоимение связывает эту строку с обетами предыдущего стиха; форма множественного числа согласуется с русским словом «обеты».
- source_word: פָּצוּ שְׂפָתַי
  choice: произнесли мои уста
  rationale: Глагол פצה буквально описывает раскрытие уст, но здесь означает произнесение слов. Перевод сохраняет образ уст и естественно передаёт речевой акт.
- source_word: וְדִבֶּר פִּי
  choice: и изрёк мой рот
  rationale: Сохранены прямое значение דבר и поэтический параллелизм «мои уста / мой рот»; «изрёк» уместно для торжественной речи об обетах.
- source_word: בַּצַּר לִי
  choice: когда мне было тесно
  rationale: Фраза буквально выражает стеснённое, бедственное положение. Русское «мне было тесно» сохраняет исходную метафору и допускает значение скорби или беды.
