  - marker: b
    text: 'Или: «Радостно воскликните Богу». Еврейский глагол может обозначать громкий радостный или победный возглас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Термин надписания обозначает человека, руководящего музыкальным исполнением. Этот вариант ясен современному читателю и сохраняет литургико-музыкальную функцию, хотя точный круг обязанностей остаётся не вполне определённым.
- source_word: שִׁיר
  choice: Песнь
  rationale: Прямой и стилистически уместный перевод жанрового обозначения.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшийся перевод технического обозначения מִזְמוֹר. Оба жанровых слова сохранены, как и в еврейском тексте.
- source_word: הָרִיעוּ
  choice: Восклицай
  rationale: Глагол означает поднять громкий крик или возглас, нередко радостный либо победный. «Восклицай» передаёт голосовой характер призыва, не делая оттенок радости обязательным в основном тексте.
- source_word: לֵאלֹהִים
  choice: Богу
  rationale: Предлог указывает на адресата возгласа; беспредложный дательный падеж естественно передаёт это по-русски.
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: В контексте всеобщего призыва к хвале אֶרֶץ лучше понимать как весь земной мир, а не как отдельную страну или территорию.
theological_decisions:
- issue: Охват призыва в כָּל הָאָרֶץ
  choice: всеобщий призыв ко всей земле
  alternative: обращение ко всей стране или земной области
  rationale: Контекст псалма поддерживает универсальный смысл. Перевод «земля» сохраняет широкий охват, не уточняя далее, имеются ли в виду народы, люди или всё творение.
translation_notes:
  register: Современный литературный русский с кратким, торжественным строем псаломного надписания. Формы «песнь» и «псалом» сохраняют традиционную библейскую лексику, оставаясь понятными. Единственное число «восклицай» согласовано с собирательным обращением «вся земля», хотя в еврейском употреблена форма множественного числа.
