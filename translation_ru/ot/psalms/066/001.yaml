  text: For the choir director[a]. A song, a psalm. Shout to God[b], all the earth.
translation:
  language: ru
  text: 'Руководителю хора[a]. Песнь. Псалом.


    Воскликните Богу[b], вся земля!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Руководителю музыкантов»; также возможно: «Начальнику хора».'
