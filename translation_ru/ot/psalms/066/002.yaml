lexical_decisions:
- source_word: זַמְּרוּ
  choice: Воспевайте
  rationale: Повелительная форма множественного числа от זמר призывает к музыкальному прославлению. «Воспевайте» естественно сочетается со «славой» и сохраняет возвышенный, но понятный регистр.
- source_word: כְבוֹד שְׁמוֹ
  choice: славу Его имени
  rationale: Сочетание существительных передано прямо, чтобы сохранить еврейский акцент на славе, принадлежащей Божьему имени, а не свести выражение к прилагательному «славное имя».
- source_word: שִׂימוּ
  choice: воздайте
  rationale: Буквально глагол означает «положите, поставьте», но в данном идиоматическом сочетании русский глагол «воздайте» естественно выражает призыв наделить хвалу подобающей славой.
- source_word: כָבוֹד
  choice: славную
  rationale: Еврейское существительное «слава» в русском переводе преобразовано в определение ради естественности выражения; буквальная форма отмечена в сноске.
- source_word: תְּהִלָּתוֹ
  choice: Ему … хвалу
  rationale: Суффикс третьего лица может обозначать хвалу, принадлежащую Богу или обращённую к Нему. Формулировка «Ему … хвалу» ясно и естественно передаёт контекст поклонения, не вводя дополнительного богословского содержания.
