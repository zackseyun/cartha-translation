  text: כִּֽי בְחַנְתָּ֥/נוּ אֱלֹהִ֑ים צְ֝רַפְתָּ֗/נוּ כִּ/צְרָף כָּֽסֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/010.yaml
  text: For you have tested us[a], O God[b]; you have refined us as silver is refined.
translation:
  language: ru
  text: Ибо Ты испытал нас[a], Боже; очистил нас, как очищают серебро[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проверил нас». Еврейский глагол может обозначать испытание, выявляющее подлинность или качество.'
    reason: lexical_alternative
  - marker: b
    text: 'Это образ из обработки металлов: Божье испытание уподоблено очищению серебра огнём.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для хвалы в окружающем контексте; «ибо» естественно передаёт пояснительно-причинную связь и соответствует возвышенному поэтическому регистру.
- source_word: בְחַנְתָּנוּ
  choice: Ты испытал нас
  rationale: Глагол בחן обозначает испытание или исследование качества, нередко с целью выявить подлинность. «Испытал» ясно передаёт этот смысл и подготавливает образ очищения металла.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма обращения естественно передаёт вокативный смысл, очевидный из второго лица глаголов и контекста.
- source_word: צְרַפְתָּנוּ
  choice: очистил нас
  rationale: Глагол צרף относится к очищению металла плавкой. «Очистил» сохраняет цель металлургического процесса и естественно применяется к людям, не устраняя образ, раскрытый следующим сравнением.
- source_word: כִּצְרָף
  choice: как очищают
  rationale: Префикс כְּ вводит сравнение, а форма צְרָף выражает процесс очищения. Неопределённо-личная конструкция по-русски естественно передаёт обобщённое действие без добавления названного в еврейском тексте деятеля.
- source_word: כָּסֶף
  choice: серебро
  rationale: Прямое обозначение драгоценного металла в сравнении с процессом его очищения.
theological_decisions:
- issue: Связь Божьего испытания с очищением
  choice: Сохранены два параллельных глагола — «испытал» и «очистил» — без сведения испытания только к наказанию или только к доказательству верности.
  alternative: Истолковать испытание как наказание, проверку веры или духовное очищение.
  rationale: Еврейский поэтический параллелизм связывает проверку с металлургическим очищением, но не уточняет единственную богословскую цель пережитого испытания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Обращение «Боже» и союз «ибо» уместны для псалма и остаются понятными современному читателю; синтаксический параллелизм еврейской строки сохранён.
