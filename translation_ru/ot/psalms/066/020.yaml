  text: בָּר֥וּךְ אֱלֹהִ֑ים אֲשֶׁ֥ר לֹֽא הֵסִ֘יר תְּפִלָּתִ֥/י וְ֝/חַסְדּ֗/וֹ מֵ/אִתִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/020.yaml
  text: Blessed be God[b][a], who has not turned away my prayer or his steadfast love from me.
translation:
  language: ru
  text: Благословен Бог, который не отверг моей молитвы и не лишил меня Своей милости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своей верной любви»; также возможно: «Своей заветной верности». Еврейское חֶסֶד означает милость, соединённую с верностью и неизменной преданностью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Краткая и естественная для русского библейского регистра формула хвалы, сохраняющая значение пассивного причастия и восклицательно-благословляющий характер выражения.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В контексте прямой хвалы существительное обозначает Бога Израиля.
- source_word: אֲשֶׁר
  choice: который
  rationale: Вводит определительное придаточное, описывающее действие Бога.
- source_word: לֹא הֵסִיר תְּפִלָּתִי
  choice: не отверг моей молитвы
  rationale: Буквально глагол означает «не удалил / не отвёл», но в сочетании с молитвой по-русски естественно передаёт смысл «не отверг». Родительный падеж после отрицания соответствует литературной норме.
- source_word: וְחַסְדּוֹ מֵאִתִּי
  choice: и не лишил меня Своей милости
  rationale: Единое отрицание при двух однородных дополнениях по-русски естественно раскрыто повтором «не». Оборот передаёт буквальный смысл неотнятой у молящегося Божьей חֶסֶד, не создавая неестественной конструкции с одним глаголом для «молитвы» и «милости».
theological_decisions:
- issue: Передача חֶסֶד
  choice: Своей милости
  alternative: Своей верной любви; Своей заветной верности
  rationale: «Милость» естественна и ёмка в русском псалмопевческом контексте, однако еврейское חֶסֶד включает также постоянство, верность и заветную преданность; эта широта отмечена в сноске без навязывания узкоконфессионального толкования.
- issue: Связь отрицания с двумя объектами
  choice: не отверг… и не лишил
  alternative: не удалил моей молитвы и Своей милости от меня
  rationale: В еврейском один глагол относится к «моей молитве» и «Своей милости». Русская формулировка использует два подходящих глагола, сохраняя обе части утверждения и естественное действие отрицания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмопевческим звучанием. Заглавное «Своей» употреблено как традиционный русский знак отнесения местоимения к Богу; смысловых добавлений нет.
