  text: בָּרְכ֖וּ עַמִּ֥ים אֱלֹהֵ֑י/נוּ וְ֝/הַשְׁמִ֗יעוּ ק֣וֹל תְּהִלָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/008.yaml
  text: Bless our God[a], O peoples[b], and make the sound of his praise heard.
translation:
  language: ru
  text: Благословляйте, народы, нашего Бога и возглашайте во всеуслышание хвалу Ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и сделайте слышным голос Его хвалы»; возможно также понимание: «голос хвалы Ему».'
    reason: Сноска сохраняет каузативную форму глагола, слово «голос» и неоднозначность местоименного суффикса при слове «хвала».
lexical_decisions:
- source_word: בָּרְכוּ
  choice: Благословляйте
  rationale: Форма повелительного наклонения множественного числа от ברך. «Благословляйте» сохраняет прямое значение и устойчивый библейский оборот применительно к Богу; «хвалите» здесь возможно по смыслу, но менее точно передаёт сам глагол.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число употреблено как обращение к народам; русское «народы» естественно передаёт этот собирательно-множественный призыв.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Суффикс первого лица множественного числа прямо означает «нашего» и сохраняет перспективу молящейся общины.
- source_word: וְהַשְׁמִיעוּ
  choice: возглашайте во всеуслышание
  rationale: Побудительная каузативная форма означает «сделайте слышным». Сочетание «возглашайте во всеуслышание» естественно по-русски передаёт и повеление, и требование сделать хвалу слышимой.
- source_word: קוֹל
  choice: во всеуслышание
  rationale: Значение «голос, звук» передано в составе идиоматического выражения, подчёркивающего слышимое, публичное звучание хвалы.
- source_word: תְּהִלָּתוֹ
  choice: хвалу Ему
  rationale: В контексте речь идёт о хвале, обращённой к Богу. Русское выражение естественно, а буквальное отношение местоименного суффикса отражено в сноске, чтобы не скрывать структуру оригинала.
theological_decisions:
- issue: Значение местоименного суффикса в תְּהִלָּתוֹ
  choice: хвалу Ему
  alternative: голос Его хвалы
  rationale: По-русски «Его хвала» способно двусмысленно обозначать хвалу, произносимую самим Богом. Основной текст передаёт наиболее естественный контекстуальный смысл — хвалу, обращённую к Нему, а более буквальная конструкция сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным псалмическим звучанием. Оборот «во всеуслышание» позволяет избежать тяжеловесного буквального выражения «сделайте слышным голос», не теряя акустического и каузативного смысла.
