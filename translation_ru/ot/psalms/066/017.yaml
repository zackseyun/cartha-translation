  text: I cried out to him with my mouth[a], and praise was under my tongue.
translation:
  language: ru
  text: 'К Нему воззвал я устами,

    и хвала была у меня на языке.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и хвала — под моим языком». Еврейское слово, переведённое как «хвала», также может означать «превознесение».'
    reason: Сохранение буквального образа и лексической возможности еврейского слова без внесения не подтверждаемого текстом значения «Он был превознесён моим языком».
lexical_decisions:
- source_word: אֵלָיו
  choice: к Нему
  rationale: Предлог с местоименным суффиксом означает «к нему»; прописная буква естественно указывает на Бога как на ясный из контекста антецедент, не заменяя местоимение именем.
- source_word: פִּי
  choice: устами
  rationale: Буквально «моим ртом»; русское «устами» сохраняет телесный образ и соответствует возвышенному поэтическому регистру.
- source_word: קָרָאתִי
  choice: воззвал я
  rationale: В контексте молитвы глагол означает настойчиво звать, взывать; «воззвал» передаёт обращение к Богу без лишнего уточнения.
- source_word: וְרוֹמַם
  choice: и хвала
  rationale: Форма связана с корнем רום («быть высоким, превозносить») и здесь естественно понимается как «превознесение, хвала»; «хвала» ясна по-русски и подходит к речи языком.
- source_word: תַּחַת
  choice: на
  rationale: Буквально «под». В сочетании с «языком» образ обозначает слова, готовые быть произнесёнными; по-русски это естественно передаётся идиомой «на языке», а буквальный образ отмечен в сноске.
- source_word: לְשׁוֹנִי
  choice: у меня на языке
  rationale: Существительное буквально означает «мой язык». Русская конструкция сохраняет этот телесный образ и передаёт готовность хвалы прозвучать.
theological_decisions:
- issue: Грамматико-лексическая неоднозначность וְרוֹמַם
  choice: существительное со значением «хвала»
  alternative: «и Он был превознесён» или «и превознесение»
  rationale: Контекст и параллельная строка поддерживают понимание как произносимой хвалы, однако форма редка и допускает иное грамматическое истолкование; это не следует превращать в однозначное богословское утверждение о результате молитвы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой окраской. Инверсия «воззвал я» поддерживает поэтический ритм; «на языке» выбрано вместо неестественного и потенциально вводящего в заблуждение русского «под языком».
