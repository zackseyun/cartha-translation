    reason: lexical_alternative
lexical_decisions:
- source_word: הֲבֵאתָנוּ
  choice: Ты ввёл нас
  rationale: Каузативная форма глагола בוא с суффиксом первого лица множественного числа означает «ты ввёл/привёл нас». Формулировка прямо сохраняет Божье действие.
- source_word: בַמְּצוּדָה
  choice: в западню
  rationale: מְצוּדָה может обозначать сеть, ловушку либо укреплённое место. В контексте испытания и стеснения «западня» естественно передаёт образ пленения, не сводя его именно к сети.
- source_word: שַׂמְתָּ
  choice: возложил
  rationale: Глагол שׂים означает «класть, помещать». Русское «возложил» естественно сочетается с бременем и сохраняет образ намеренно положенной тяжести.
- source_word: מוּעָקָה
  choice: бремя
  rationale: Существительное выражает гнёт, стеснение, тяготу или давящую тяжесть. «Бремя» ясно передаёт образ возложенной тяготы и хорошо сочетается с упоминанием поясниц.
- source_word: בְמָתְנֵינוּ
  choice: на наши поясницы
  rationale: מָתְנַיִם обозначает поясницу, чресла или область бёдер. «Поясницы» — точное, литературное и всё ещё понятное современному читателю обозначение этой части тела.
theological_decisions:
- issue: Непосредственное действие Бога в переживаемом народом страдании
  choice: 'Сохранено прямое обращение к Богу: «Ты ввёл… возложил».'
  alternative: 'Безличная или смягчённая передача: «мы попали в западню», «на нас легло бремя».'
  rationale: Оба еврейских глагола стоят во втором лице единственного числа и прямо называют Бога действующим лицом. Перевод сохраняет эту богословскую напряжённость, не ослабляя её.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Поясницы» сохраняет телесный образ оригинала без архаического «чресла», а «западня» ясно передаёт образ пленения. Параллелизм двух обращённых к Богу глагольных форм сохранён.
