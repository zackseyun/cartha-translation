lexical_decisions:
- source_word: אִמְרוּ לֵאלֹהִים
  choice: Скажите Богу
  rationale: Императив множественного числа обращён к общине, а предлог ל обозначает адресата речи.
- source_word: מַה נּוֹרָא מַעֲשֶׂיךָ
  choice: Как грозны Твои дела!
  rationale: Восклицательная конструкция מַה с נוֹרָא выражает благоговейное изумление перед тем, что внушает страх; «грозны» сохраняет эту силу естественнее, чем разговорное «потрясающи».
- source_word: בְּרֹב עֻזֶּךָ
  choice: Перед величием Твоей силы
  rationale: בְּ может обозначать основание или обстоятельство, а רֹב עֹז — превосходящую, обильную силу. Русская формулировка естественно связывает её с вынужденной реакцией врагов.
- source_word: יְכַחֲשׁוּ לְךָ
  choice: покоряются Тебе неискренне
  rationale: Piel כחש с ל может обозначать притворную или вынужденную покорность. Перевод сохраняет отрицательный оттенок и не представляет реакцию врагов искренним поклонением.
- source_word: אֹיְבֶיךָ
  choice: враги Твои
  rationale: Прямое соответствие существительному во множественном числе с суффиксом второго лица единственного числа.
theological_decisions:
- issue: Характер покорности врагов Богу
  choice: Неискренняя, вызванная превосходящей силой покорность
  alternative: Вынужденная покорность или притворное повиновение
  rationale: כחש обычно несёт оттенок лжи, отрицания или притворства. Основной текст передаёт эту смысловую напряжённость, не превращая покорность врагов в искреннее поклонение.
