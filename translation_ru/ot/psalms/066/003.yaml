  language: ru
  text: 'Скажите Богу: «Как грозны Твои дела! Из-за величия Твоей силы враги Твои притворно покоряются Тебе[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «враги Твои вынужденно покоряются Тебе»; возможен также смысл: «враги Твои льстят Тебе» или «лгут Тебе». Еврейский глагол может обозначать притворную или вынужденную покорность.'
