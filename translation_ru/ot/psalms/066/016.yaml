  text: לְכֽוּ שִׁמְע֣וּ וַ֭/אֲסַפְּרָה כָּל יִרְאֵ֣י אֱלֹהִ֑ים אֲשֶׁ֖ר עָשָׂ֣ה לְ/נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/016.yaml
  text: Come and hear[a], all you who fear God, and I will tell what he has done for my soul.
translation:
  language: ru
  text: Придите и послушайте, все боящиеся Бога, и я расскажу, что Он сделал для моей души.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что Он сделал для моей жизни». Еврейское נֶפֶשׁ (не́феш) в зависимости от контекста может означать «душа», «жизнь» или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: Придите
  rationale: Хотя глагол буквально означает движение («идите»), в сочетании с повелением слушать он служит приглашением и естественно передаётся по-русски как «придите».
- source_word: שִׁמְעוּ
  choice: послушайте
  rationale: Повелительная форма призывает не просто услышать звук, а внимательно выслушать свидетельство; «послушайте» естественно передаёт это в современном русском языке.
- source_word: וַאֲסַפְּרָה
  choice: и я расскажу
  rationale: Форма от ספר выражает намерение говорящего поведать или перечислить совершённое Богом; «я расскажу» ясно и естественно сохраняет эту силу.
- source_word: כָּל יִרְאֵי אֱלֹהִים
  choice: все боящиеся Бога
  rationale: Перевод сохраняет библейское понятие страха перед Богом, включающее благоговение и послушание, не сводя его ни к простому уважению, ни к одному лишь ужасу.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В исходном тексте употреблён общий титул אֱלֹהִים, а не личное имя YHWH.
- source_word: אֲשֶׁר עָשָׂה
  choice: что Он сделал
  rationale: Относительное предложение естественно передано по-русски; совершенный вид выражает завершённое Божье действие, о котором свидетельствует псалмопевец.
- source_word: לְנַפְשִׁי
  choice: для моей души
  rationale: נֶפֶשׁ может обозначать душу, жизнь или самого человека. «Для моей души» сохраняет личную и внутреннюю направленность выражения, а иной контекстуально возможный смысл отмечен в сноске.
theological_decisions:
- issue: Смысл выражения «боящиеся Бога»
  choice: благоговейный страх перед Богом
  alternative: ужас перед Богом; общее уважение к божеству
  rationale: Исходное выражение характеризует людей, живущих в благоговении и послушании Богу. Слово «боящиеся» сохраняет смысловое напряжение текста, не ослабляя его до простого уважения и не усиливая до одного лишь ужаса.
- issue: Передача נֶפֶשׁ
  choice: душа
  alternative: жизнь; сам человек
  rationale: У еврейского слова широкий диапазон значений. «Душа» сохраняет личную и духовную весомость псалмического свидетельства, тогда как значение «жизнь» остаётся реальной возможностью и вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмической речи. Синтаксис остаётся ясным для обычного читателя; традиционное выражение «боящиеся Бога» сохранено ради смысловой точности. Местоимение «Он» написано с прописной буквы как допустимая русская издательская конвенция при ясном указании на Бога.
