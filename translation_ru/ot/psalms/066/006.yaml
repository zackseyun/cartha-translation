  text: He turned the sea into dry land[a]; they passed through the river on foot[b]; there we rejoiced in him.
translation:
  language: ru
  text: Он превратил море в сушу; они перешли реку пешком[a]. Там мы радовались ему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, здесь вспоминаются и переход через море во время исхода, и переход через реку Иордан в землю.
    reason: cross_reference
  - marker: b
    text: 'Или: «Там возрадуемся ему». Еврейскую форму можно понимать как призыв, а не как рассказ о прошлом.'
    reason: alternative_reading
lexical_decisions:
- source_word: הָפַךְ
  choice: превратил
  rationale: Глагол означает «повернуть, изменить, превратить»; «превратил» естественно передаёт изменение состояния моря.
- source_word: יָם
  choice: море
  rationale: Прямое соответствие еврейскому слову; вероятная отсылка к исходу не конкретизируется в основном тексте.
- source_word: לְיַבָּשָׁה
  choice: в сушу
  rationale: Передаёт направление изменения и конкретный образ сухой земли.
- source_word: בַּנָּהָר
  choice: реку
  rationale: При глаголе движения русское винительное без предлога естественно выражает пересечение реки, тогда как еврейский предлог буквально допускает значение «в/через реку».
- source_word: יַעַבְרוּ
  choice: они перешли
  rationale: Форма обозначает переход через преграду; русский совершенный вид соответствует воспоминанию о завершённом событии.
- source_word: בְרָגֶל
  choice: пешком
  rationale: Естественное современное выражение для прохождения на своих ногах, без лодок или иных средств.
- source_word: שָׁם
  choice: там
  rationale: Сохраняет пространственную отсылку, не уточняя, относится ли она к месту перехода или шире к спасительным событиям.
- source_word: נִשְׂמְחָה
  choice: мы радовались
  rationale: В контексте воспоминания форма понята ретроспективно, как отождествление нынешней общины с народом, пережившим избавление; побудительное значение отмечено в сноске.
- source_word: בּוֹ
  choice: ему
  rationale: Местоименный суффикс мужского рода наиболее естественно относится к Богу. Дательный падеж после «радоваться» звучит по-русски естественнее буквального «в нём».
theological_decisions:
- issue: Историческая отсылка и общинное отождествление
  choice: 'Море и река представлены как два спасительных перехода, а молящаяся община говорит: «мы радовались».'
  alternative: 'Последнюю фразу можно понимать как призыв: «там возрадуемся ему».'
  rationale: Контекст перечисляет прошлые деяния Бога, поэтому ретроспективное прочтение связно; сноска сохраняет побудительную силу еврейской формы и не устраняет её неоднозначность.
- issue: Референт местоимения בּוֹ
  choice: 'Местоимение относится к Богу: «ему».'
  alternative: Грамматически его можно было бы связать с местом или событием, однако такое прочтение менее вероятно в контексте хвалы.
  rationale: Бог остаётся действующим лицом и предметом радости во всём ближайшем контексте.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Архаичные обороты вроде «о Нём веселились» и буквальный, но неестественный оборот «радовались в нём» не использованы; божественное местоимение дано со строчной буквы.
