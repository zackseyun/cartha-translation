lexical_decisions:
- source_word: לְכוּ
  choice: Придите
  rationale: Множественное повелительное от הלך здесь входит в формулу приглашения; по-русски естественно «Придите и посмотрите», хотя основной смысл глагола — «идти».
- source_word: וּרְאוּ
  choice: и посмотрите
  rationale: Повелительная форма множественного числа от ראה призывает обратить внимание на совершённое Богом.
- source_word: מִפְעֲלוֹת
  choice: дела
  rationale: Существительное во множественном числе обозначает совершённое Богом; «дела» сохраняет возвышенный, но понятный регистр.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В данном контексте слово обозначает единого Бога Израиля.
- source_word: נוֹרָא
  choice: грозен
  rationale: Слово передаёт внушающий трепет и страх характер Божьего действия. «Грозен» сохраняет эту смысловую напряжённость лучше, чем ослабленное «величествен».
- source_word: עֲלִילָה
  choice: в Своих деяниях
  rationale: Единственное число имеет собирательно-абстрактное значение — образ или совокупность действий. «В Своих деяниях» естественно по-русски и лексически отличается от предшествующего «дела».
- source_word: עַל
  choice: над
  rationale: Предлог допускает оттенки направленности «к, над, против». «Над» сохраняет широкое значение Божьего действия по отношению к людям, не определяя его заранее как благодетельное или враждебное.
- source_word: בְּנֵי אָדָם
  choice: сынами человеческими
  rationale: Буквально «сынами человека/Адама»; это традиционно понятное русское выражение, обозначающее людей вообще и сохраняющее образ исходного текста.
theological_decisions:
- issue: Обобщающее значение אָדָם в выражении בְּנֵי אָדָם
  choice: сынами человеческими
  alternative: людьми / человечеством
  rationale: Выражение относится ко всему человечеству, но основной текст сохраняет мужской репрезентативный образ еврейского оригинала; общеупотребительный смысл указан в примечании.
- issue: Характер Божьих действий в сочетании נוֹרָא עֲלִילָה עַל
  choice: грозен Он в Своих деяниях над
  alternative: внушительны Его дела для / дивен Он в делах среди
  rationale: Перевод сохраняет трепет и потенциально устрашающий оттенок נוֹרָא, а также не сужает многозначность עַל до исключительно благоприятного отношения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмодическим звучанием. Инверсия «грозен Он» подчёркивает предикат и остаётся естественной для поэтического текста. Маркер примечания поставлен непосредственно после выражения, которое оно поясняет.
