  text: Come and see the works of God[a]; he is awesome in his deeds toward the children of man.
translation:
  language: ru
  text: 'Придите и посмотрите на дела Бога: страшен Он в деяниях Своих по отношению к сынам человеческим.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть по отношению к людям, ко всему человечеству. Буквально: «к сынам человека».'
