source:
  edition: WLC
  text: אָ֭וֶן אִם רָאִ֣יתִי בְ/לִבִּ֑/י לֹ֖א יִשְׁמַ֣ע אֲדֹנָֽ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/066/018.yaml
  text: If I had cherished iniquity in my heart[a], the Lord would not have listened.
translation:
  language: ru
  text: Если бы я лелеял беззаконие в своём сердце[a], Господь не услышал бы меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если бы я видел беззаконие в своём сердце»; возможно также: «если бы я благосклонно смотрел на беззаконие в своём сердце».'
    reason: Сноска сохраняет буквальное значение глагола «видеть» и показывает смысловую неоднозначность еврейского оборота, тогда как основной текст передаёт его вероятный идиоматический смысл.
lexical_decisions:
- source_word: אָוֶן
  choice: беззаконие
  rationale: В данном нравственном контексте слово обозначает зло или неправедность, способные стать препятствием для молитвы. «Беззаконие» сохраняет выраженный этический смысл.
- source_word: אִם
  choice: если бы
  rationale: Частица вводит условие, которое вместе с последующим отрицанием естественно передаётся по-русски конструкцией с «если бы».
- source_word: רָאִיתִי
  choice: лелеял
  rationale: Буквально глагол означает «видел», но в сочетании с «в сердце» передаёт благосклонное внутреннее отношение к беззаконию, а не простое осознание его наличия. «Лелеял» выражает сознательно сохраняемую внутреннюю привязанность.
- source_word: בְלִבִּי
  choice: в своём сердце
  rationale: Сохраняется прозрачный библейский образ сердца как средоточия мыслей, желаний и воли; возвратное «своём» естественно соотносит его с говорящим.
- source_word: לֹא יִשְׁמַע
  choice: не услышал бы меня
  rationale: Глагол может означать как физическое слышание, так и благосклонное, отзывчивое восприятие молитвы. «Не услышал бы» сохраняет эту смысловую широту и не усиливает текст до прямого «не ответил бы». Дополнение «меня» подразумевается контекстом молитвы и необходимо для естественной русской фразы.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Это устойчивый почтительный титул Бога; «Господь» является его естественным и традиционным русским соответствием.
theological_decisions:
- issue: Передавать ли выражение רָאִיתִי בְלִבִּי буквально или раскрыть его идиоматический смысл
  choice: 'Передать как сознательное внутреннее попустительство беззаконию: «лелеял беззаконие в своём сердце»'
  alternative: «видел беззаконие в своём сердце» или «взирал на беззаконие в своём сердце»
  rationale: Речь идёт не о простом распознавании собственного греха, а о благосклонном отношении к нему внутри себя. При этом буквальная образность отмечена в сноске, чтобы не скрывать неоднозначность исходного выражения.
- issue: Означает ли שׁמע здесь «слышать», «слушать» или «отвечать»
  choice: «не услышал бы меня»
  alternative: «не стал бы меня слушать» или «не ответил бы мне»
  rationale: «Услышал бы» естественно обозначает благосклонное восприятие молитвы, не утверждая более определённо, чем еврейский текст, что речь прямо идёт об ответе.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для псалма. Синтаксис прост и понятен; традиционные слова «беззаконие» и «Господь» сохранены как общеупотребительные в библейском контексте. Местоимение «меня» добавлено как ясно подразумеваемое в контексте молитвы.
