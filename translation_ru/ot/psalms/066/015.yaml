  yaml_path: translation/ot/psalms/066/015.yaml
  text: I will offer to you burnt offerings of fattened animals[a], with the smoke of rams; I will prepare cattle and goats[d][c][b]. Selah
translation:
  language: ru
  text: Я вознесу Тебе всесожжения из откормленных животных — вместе с дымом от овнов[a]; принесу в жертву крупный скот и козлов. Села[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместе с благоуханием овнов». Еврейское слово может обозначать дым или запах, поднимающийся при сожжении жертвы.'
    reason: lexical_alternative
  - marker: b
    text: «Села» — вероятно, музыкальное или богослужебное указание; его точное значение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: עֹלוֹת
  choice: всесожжения
  rationale: Устоявшийся русский термин для жертв, целиком сжигаемых на жертвеннике; точно передаёт культовое значение слова.
- source_word: מֵחִים
  choice: из тучных животных
  rationale: Слово обозначает откормленных, упитанных животных, предназначенных для дорогой жертвы. Такая формулировка яснее буквального «тучные» и естественно сочетается со словом «всесожжения».
- source_word: אַעֲלֶה לָךְ
  choice: Я вознесу Тебе
  rationale: Форма глагола עלה в жертвенном контексте означает вознесение жертвы на алтаре. «Вознесу» сохраняет образ восхождения и прямое обращение к Богу.
- source_word: עִם קְטֹרֶת אֵילִים
  choice: вместе с дымом от овнов
  rationale: קְטֹרֶת здесь может обозначать поднимающийся при сожжении жертвы дым или запах. Основной текст передаёт конкретный образ дыма, а смысловая альтернатива отмечена в сноске.
- source_word: אֶעֱשֶׂה
  choice: принесу в жертву
  rationale: Глагол עשׂה буквально значит «делать», но здесь употреблён в жертвенном контексте. Русское выражение ясно передаёт функцию глагола, не создавая неестественного оборота «сделаю скот».
- source_word: בָקָר
  choice: крупный скот
  rationale: Собирательное существительное обозначает животных из крупного рогатого скота без обязательного уточнения пола; перевод сохраняет эту широту.
- source_word: עַתּוּדִים
  choice: козлов
  rationale: Слово обозначает именно взрослых самцов коз; русский перевод прямо сохраняет эту конкретность.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение древнего музыкального или богослужебного обозначения неизвестно, поэтому оно передано традиционной транслитерацией.
