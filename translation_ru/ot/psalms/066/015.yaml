translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической интонацией. Заглавные формы «Тебе» сохраняют традиционное почтительное обращение к Богу. Синтаксис остаётся ясным для широкого читателя, а жертвенная терминология передана точно и без архаических оборотов.
