    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁל
  choice: владычествует
  rationale: Причастие породы qal описывает непрестанное царственное правление Бога; настоящее время сохраняет длительный характер действия, а «владычествует» уместно для возвышенной поэзии.
- source_word: בִּגְבוּרָתוֹ
  choice: Своей мощью
  rationale: גְּבוּרָה означает силу, могущество; предлог ב здесь естественно понимать инструментально — Бог правит посредством Своей мощи.
- source_word: עוֹלָם
  choice: вечно
  rationale: В наречном употреблении слово выражает неограниченную продолжительность правления.
- source_word: עֵינָיו
  choice: Его очи
  rationale: Сохранён явный антропоморфный поэтический образ еврейского текста; «очи» поддерживает возвышенный, но понятный регистр псалма.
- source_word: בַּגּוֹיִם תִּצְפֶּינָה
  choice: наблюдают за народами
  rationale: צפה передаёт пристальное наблюдение, а גּוֹיִם здесь означает народы вообще. Русское управление «наблюдать за» естественно передаёт направленность действия.
- source_word: הַסּוֹרְרִים
  choice: мятежники
  rationale: Причастие от סרר обозначает упорно непокорных, восстающих против власти; существительное «мятежники» кратко и естественно выражает этот смысл.
- source_word: אַל יָרִימוּ לָמוֹ
  choice: Да не возносятся
  rationale: אַל с имперфектом выражает запрещение; сочетание רום с לָמוֹ допускает значение самовозвышения. Возвратная форма сохраняет его, не исключая оттенка «подниматься».
- source_word: סֶלָה
  choice: Села
  rationale: Традиционное обозначение транслитерировано, поскольку его точная литургическая или музыкальная функция остаётся неясной.
theological_decisions:
- issue: Антропоморфное описание Божьего восприятия
  choice: Его очи наблюдают за народами
  alternative: Он наблюдает за народами
  rationale: В оригинале прямо названы Божьи глаза; сохранение образа передаёт поэтическую выразительность, не превращая его в утверждение об ограниченности Бога.
- issue: Смысл запрета, обращённого к непокорным
  choice: Да не возносятся мятежники
  alternative: Да не поднимаются мятежники
  rationale: Форма יָרִימוּ לָמוֹ вероятнее всего указывает на самовозвышение, однако глагол רום может также обозначать поднятие или выступление; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим регистром. Формы «владычествует» и «очи» сохраняют достоинство и образность оригинала, оставаясь понятными современному читателю.
