translation:
  language: ru
  text: Который хранит нас среди живых[a][b] и не дал нашим ногам пошатнуться[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «помещает нашу душу (жизнь) в жизнь». В данном контексте смысл: сохраняет среди живых.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово נֶפֶשׁ может означать «душа», «жизнь» или «сам человек»; поэтому возможно также: «хранит нашу душу среди живых» или «сохраняет нашу жизнь».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не дал нашим ногам поскользнуться»; также возможно: «поколебаться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂם
  choice: Который сохраняет
  rationale: Субстантивированное причастие от שׂוּם буквально выражает действие «помещать, полагать», но в сочетании с נַפְשֵׁנוּ בַּחַיִּים имеет смысл сохранения жизни. Настоящее время передаёт причастную форму и естественно продолжает обращение к Богу.
- source_word: נַפְשֵׁנוּ
  choice: нам жизнь
  rationale: נֶפֶשׁ здесь обозначает жизнь или живое существо, а не обязательно отдельную нематериальную «душу». Конструкция «сохраняет нам жизнь» естественна по-русски и удерживает притяжательное значение суффикса первого лица множественного числа.
- source_word: בַּחַיִּים
  choice: жизнь
  rationale: Форма буквально допускает «в жизни» или «среди живых». В сочетании со שׂוּם и נֶפֶשׁ по-русски идиоматично передаётся выражением «сохраняет жизнь»; более буквальный образ отмечен в сноске.
- source_word: וְלֹא נָתַן
  choice: и не даёт
  rationale: נָתַן с последующим ל и инфинитивом означает «дать, позволить» чему-либо произойти. Настоящее «не даёт» согласуется с причастием первой части и выражает продолжающееся Божье хранение.
- source_word: לַמּוֹט
  choice: пошатнуться
  rationale: 'מוֹט обозначает утрату устойчивости: шатание, колебание или соскальзывание. С существительным «ноги» глагол «пошатнуться» сохраняет телесный образ и метафору неустойчивости.'
- source_word: רַגְלֵנוּ
  choice: нашим ногам
  rationale: Прямое соответствие еврейскому «наши ноги»; конкретный образ сохранён без замены на абстрактные «шаги» или «путь».
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте сохранения Богом
  choice: «жизнь», без антропологического уточнения природы души
  alternative: «нашу душу» или «нас»
  rationale: Контекст говорит прежде всего о сохранении среди живых. Перевод «жизнь» не навязывает учение о составе человека, а возможные значения исходного слова отмечены в сноске.
- issue: Временной аспект Божьего действия
  choice: 'настоящее время: «сохраняет… не даёт»'
  alternative: 'прошедшее или перфектное: «сохранил… не дал»'
  rationale: Первая форма — причастие, а завершённая форма נָתַן подчинена по смыслу описанию Бога. Русское настоящее естественно представляет Бога как Того, кто хранит народ, не исключая уже совершённого действия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Формулировка сохраняет конкретный образ ног и Божьего хранения, избегая как буквализма «полагает душу в жизни», так и излишнего богословского уточнения значения נֶפֶשׁ.
