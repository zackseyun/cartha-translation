lexical_decisions:
- source_word: תְּבוֹאֵנִי
  choice: не наступит на меня
  rationale: Глагол בוא буквально означает «прийти, приблизиться», но при подлежащем «нога гордыни» выражает враждебное приближение. «Не наступит на меня» естественно передаёт образ ноги и угрозу, не превращая метафору в отвлечённое утверждение.
- source_word: רֶגֶל גַּאֲוָה
  choice: нога гордыни
  rationale: Сохранён буквальный поэтический образ с отвлечённым существительным «гордыня». Вариант «нога гордеца» возможен, но конкретизирует носителя качества, тогда как еврейский текст оставляет формулировку образно-обобщённой.
- source_word: יַד רְשָׁעִים
  choice: рука нечестивых
  rationale: «Рука» сохраняет еврейскую метафору силы и действия, а субстантивированное множественное число רְשָׁעִים естественно передано словом «нечестивые» без добавления «люди».
- source_word: תְּנִדֵנִי
  choice: не прогонит меня
  rationale: 'Каузативная форма передаёт вынужденное удаление с места: прогнать, заставить скитаться или бежать. «Не прогонит меня» ясно выражает насильственное вытеснение и сохраняет лаконичный параллелизм стиха.'
- source_word: אַל
  choice: да не
  rationale: Частица с формами волеизъявления выражает молитвенную просьбу-запрет. Оборот «да не» соответствует возвышенному поэтическому регистру и остаётся понятным современному читателю.
