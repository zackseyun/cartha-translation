  - marker: b
    text: «Наслаждений» можно также передать как «услад»; в еврейском слове возможен отзвук названия Эдем.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְוְיֻן
  choice: они насыщаются
  rationale: Форма Qal, 3-е лицо множественного числа, от רוה передаёт состояние обильного насыщения. «Насыщаются» естественно звучит по-русски и сохраняет результативный оттенок, не сводя образ только к питью.
- source_word: מִדֶּשֶׁן
  choice: изобилием
  rationale: דֶּשֶׁן буквально связано с туком, богатством и обилием. В данном поэтическом контексте «изобилием» передаёт метафорический смысл без неестественной буквальности.
- source_word: בֵּיתֶךָ
  choice: Твоего дома
  rationale: Сохранено прямое значение «дом» без уточнения «храм», «домочадцы» или «небесная обитель», поскольку еврейский текст допускает широту образа.
- source_word: וְנַחַל
  choice: из потока
  rationale: נַחַל может обозначать поток, реку или русло. «Поток» сохраняет живой поэтический образ текущей воды и естественно сочетается с глаголом «поишь».
- source_word: עֲדָנֶיךָ
  choice: Твоих услад
  rationale: Слово от корня עדן обозначает наслаждение, удовольствие, отраду. «Услады» сохраняют множественное число и возвышенный поэтический регистр; возможный отзвук названия Эдем отмечен в сноске, но не внесён прямо в текст.
- source_word: תַשְׁקֵם
  choice: Ты поишь их
  rationale: Hiphil от שקה с субъектом во 2-м лице единственного числа и объектом в 3-м лице множественного числа означает «даёшь им пить, поишь их». Выбор сохраняет прямое действие Бога и образ питья.
theological_decisions:
- issue: Образ Божьего «дома»
  choice: Сохранить «Твоего дома» без уточнения референта
  alternative: «Твоего храма», «Твоей обители» или «Твоего семейства»
  rationale: Стих изображает близость к Богу и даруемое Им изобилие, но исходный текст не требует понимать «дом» исключительно как земной храм, небесную обитель или Божье семейство.
- issue: Возможный отзвук Эдема в עֲדָנֶיךָ
  choice: Передать как «Твоих услад» и отметить возможный отзвук в сноске
  alternative: Внести Эдем непосредственно в основной текст
  rationale: Лексическая связь с корнем עדן реальна, однако прямого упоминания Эдема в стихе нет; основной текст не должен превращать возможную аллюзию в однозначное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции. Синтаксический параллелизм и образы насыщения, дома и текущей воды сохранены.
