  text: דִּבְרֵי פִ֭י/ו אָ֣וֶן וּ/מִרְמָ֑ה חָדַ֖ל לְ/הַשְׂכִּ֣יל לְ/הֵיטִֽיב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/003.yaml
  text: The words of his mouth are wickedness and deceit; he has ceased to act wisely[a], to do good.
translation:
  language: ru
  text: Слова уст его — беззаконие и обман; он перестал поступать разумно[a] и делать добро.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он перестал быть разумным в делании добра». Два еврейских инфинитива можно понимать как два однородных дополнения при слове «перестал» либо теснее связывать между собой.'
    reason: Сохраняется синтаксическая неоднозначность связи между לְהַשְׂכִּיל и לְהֵיטִיב.
lexical_decisions:
- source_word: דִּבְרֵי פִיו
  choice: Слова уст его
  rationale: Сохраняет конкретный еврейский образ «слова его рта», но передаёт его естественным и достойным русским оборотом.
- source_word: אָוֶן
  choice: беззаконие
  rationale: В сочетании с «обманом» слово характеризует речь как нравственно порочную; «беззаконие» передаёт этическую силу אָוֶן и соответствует поэтическому регистру псалма.
- source_word: וּמִרְמָה
  choice: и обман
  rationale: מִרְמָה обозначает обман или коварство; в контексте слов уст наиболее непосредственно и естественно «обман».
- source_word: חָדַל
  choice: он перестал
  rationale: Форма глагола חדל выражает прекращение или оставление действия; совершенный вид «перестал» точно и естественно передаёт это значение.
- source_word: לְהַשְׂכִּיל
  choice: поступать разумно
  rationale: Hифиль от שכל здесь указывает на практическое благоразумие, проявляющееся в поведении, а не только на обладание знанием.
- source_word: לְהֵיטִיב
  choice: делать добро
  rationale: Hифиль от יטב может означать «делать добро» или «поступать хорошо»; выбранный вариант ясно сохраняет нравственный смысл.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой формой «слова уст его». Тире подчёркивает именное сказуемое; вторая половина стиха передана ясно и без устранения возможной связи между двумя инфинитивами.
