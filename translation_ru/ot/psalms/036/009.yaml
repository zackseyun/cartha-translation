  text: כִּֽי עִ֭מְּ/ךָ מְק֣וֹר חַיִּ֑ים בְּ֝/אוֹרְ/ךָ֗ נִרְאֶה אֽוֹר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/009.yaml
  text: For with you is the fountain of life[b][a]; in your light we see light.
translation:
  language: ru
  text: Ибо у Тебя — источник жизни[a]; в Твоём свете[b] мы видим свет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родник жизни»; также возможно: «источник, дающий жизнь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «при Твоём свете» или «благодаря Твоему свету».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: Передаёт причинно-пояснительную связь с предшествующим контекстом и естественно звучит в возвышенной поэтической речи.
- source_word: עִמְּךָ
  choice: у Тебя
  rationale: Русская конструкция «у Тебя» естественно передаёт еврейское «с Тобой / при Тебе» в сочетании с образом находящегося у Бога источника, не сводя смысл лишь к пространственному присутствию.
- source_word: מְקוֹר
  choice: источник
  rationale: Сохраняет образ ключа, родника или первоистока и одновременно естественно сочетается в русском языке со словом «жизнь».
- source_word: חַיִּים
  choice: жизни
  rationale: Хотя форма морфологически множественная, это обычное еврейское отвлечённое существительное со значением «жизнь».
- source_word: בְּאוֹרְךָ
  choice: в Твоём свете
  rationale: Сохраняет пространственно-образную широту предлога בְּ и параллелизм стиха, не ограничивая смысл одним лишь инструментальным значением.
- source_word: נִרְאֶה
  choice: мы видим
  rationale: Форма выражает общую истину; прямой русский эквивалент сохраняет простоту и поэтическую силу.
- source_word: אוֹר
  choice: свет
  rationale: Повтор слова «свет» воспроизводит повтор и образность еврейского текста.
theological_decisions:
- issue: Образность жизни и Божьего света
  choice: Сохранить метафоры «источник жизни» и «в Твоём свете мы видим свет» без поясняющей расшифровки.
  alternative: 'Передать смысл толкованием: «Ты даёшь всякую жизнь» или «благодаря Твоей истине мы понимаем».'
  rationale: 'Еврейский текст оставляет образы богословски ёмкими: свет может подразумевать жизнь, благоволение, откровение и способность видеть. Перевод не сужает эту многозначность.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Тире подчёркивает именную конструкцию и не добавляет нового смыслового элемента.
