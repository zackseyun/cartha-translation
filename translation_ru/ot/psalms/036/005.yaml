lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, непосредственно стоящее в еврейском тексте. Русское обращение естественно звучит без архаического междометия «о».
- source_word: בְּהַשָּׁמַיִם
  choice: в небесах
  rationale: Предлог בְּ прежде всего допускает значение местонахождения — «в», а форма множественного числа передана словом «небесах». Возможное значение предела или протяжённости отмечено в сноске.
- source_word: חַסְדֶּךָ
  choice: Твоя неизменная любовь
  rationale: חֶסֶד обозначает стойкую, верную любовь и благоволение. «Неизменная любовь» понятно современному читателю и передаёт устойчивость этого отношения, не сужая смысл до одной лишь милости.
- source_word: אֱמוּנָתְךָ
  choice: Твоя верность
  rationale: В параллели с חֶסֶד слово אֱמוּנָה выражает надёжность и постоянство; «верность» естественно передаёт этот личностный смысл.
- source_word: עַד
  choice: до
  rationale: Кратко и точно выражает предел или протяжённость, сохраняя поэтический параллелизм.
- source_word: שְׁחָקִים
  choice: облаков
  rationale: Слово может обозначать облака или высокие небеса; «облака» сохраняет конкретный поэтический образ и не дублирует «небеса».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст прямо употребляет тетраграмматон как имя в обращении; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Смысл חֶסֶד
  choice: неизменная любовь
  alternative: милость
  rationale: Выбор сохраняет одновременно любовь, постоянство и верность отношения, не вводя узкоконфессионального толкования.
