lexical_decisions:
- source_word: שָׁם
  choice: Там
  rationale: 'Сохранено основное пространственное значение наречия: оно указывает на место или картину падения нечестивых.'
- source_word: נָפְלוּ
  choice: пали
  rationale: Краткая форма естественно и выразительно передаёт завершённое падение; результат дополнительно раскрывается в следующей строке.
- source_word: פֹּעֲלֵי אָוֶן
  choice: творящие беззаконие
  rationale: Причастный оборот сохраняет образ людей, деятельно совершающих зло, а не только обобщённое наименование «злодеи».
- source_word: אָוֶן
  choice: беззаконие
  rationale: В данном контексте слово имеет прежде всего нравственный смысл; «беззаконие» передаёт порочность деяний и соответствует возвышенному поэтическому регистру.
- source_word: דֹּחוּ
  choice: повержены
  rationale: Передаёт пассивный смысл насильственного низвержения и его итог, оставаясь естественным в русской поэтической речи.
- source_word: וְלֹא יָכְלוּ קוּם
  choice: и не могут подняться
  rationale: Передаёт невозможность встать после низвержения; настоящее время подчёркивает сохраняющийся результат падения.
theological_decisions:
- issue: Не назван тот, кто повергает творящих беззаконие
  choice: Сохранена пассивная конструкция «они повержены» без указания действующего лица
  alternative: «Бог поверг их»
  rationale: Еврейский текст не называет субъекта действия; перевод не должен добавлять явное богословское толкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Синтаксический параллелизм и образ окончательного падения сохранены без архаизации.
