  text: 'В моём сердце грех говорит нечестивому: нет страха Божьего перед его глазами.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внутри моего сердца». Некоторые древние переводы и современные переводчики читают или передают это место как «в его сердце» либо «в моём сердце — слово о нечестивом».'
    reason: alternative_reading
lexical_decisions:
- source_word: נְאֻם
  choice: вещает
  rationale: Существительное обозначает торжественное изречение или провозглашение. Глагольная передача сохраняет олицетворение греха и звучит по-русски естественнее, чем буквальное «изречение греха».
- source_word: פֶּשַׁע
  choice: грех
  rationale: Слово может означать мятеж, преступление или сознательное нарушение. «Грех» понятно современному читателю и сохраняет нравственно-религиозный смысл, хотя несколько шире исходного термина.
- source_word: לָרָשָׁע
  choice: нечестивому
  rationale: Форма обозначает адресата изречения — нечестивого человека. Субстантивированное прилагательное сохраняет единственное число и возвышенный поэтический регистр.
- source_word: בְּקֶרֶב לִבִּי
  choice: в моём сердце
  rationale: Сохранено трудное чтение масоретского текста с суффиксом первого лица — «моём», без исправления на «его». «В моём сердце» естественно передаёт внутреннюю сферу восприятия псалмопевца.
- source_word: אֵין פַּחַד אֱלֹהִים
  choice: нет страха Божьего
  rationale: Устойчивое выражение передаёт отсутствие благоговейного страха перед Богом; «ужас» неоправданно сузил бы смысл до испуга.
- source_word: לְנֶגֶד עֵינָיו
  choice: перед его глазами
  rationale: Сохранён образ того, что находится перед взором и принимается во внимание; местоимение третьего лица относится к нечестивому.
theological_decisions:
- issue: Трудное место לִבִּי («моё сердце») и смена лица в עֵינָיו («его глазами»)
  choice: Сохранить масоретское «в моём сердце», понимая его как сферу внутреннего восприятия псалмопевца, а «его» — как указание на нечестивого.
  alternative: 'Исправить или сгладить как «в его сердце» либо истолковать: «В сердце моём слово о нечестивом».'
  rationale: Вокализованный масоретский текст прямо поддерживает первое лицо. Хотя синтаксис остаётся напряжённым, исправление устранило бы подлинную неоднозначность источника.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. «Вещает» выбрано для торжественного נְאֻם и олицетворения греха; необычная смена «моём»/«его» намеренно сохранена и пояснена сноской.
