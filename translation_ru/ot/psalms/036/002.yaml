  text: כִּֽי הֶחֱלִ֣יק אֵלָ֣י/ו בְּ/עֵינָ֑י/ו לִ/מְצֹ֖א עֲוֺנ֣/וֹ לִ/שְׂנֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/002.yaml
  text: For he flatters himself in his own eyes too much to find his iniquity and hate it[a].
translation:
  language: ru
  text: Ведь он льстит себе в собственных глазах, не давая себе обнаружить своё беззаконие и возненавидеть его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ведь он сглаживает для себя в своих глазах — обнаружить его беззаконие, возненавидеть». Еврейская фраза синтаксически трудна. Вероятный смысл: самообольщение мешает ему распознать и отвергнуть собственный грех.'
    reason: Лексическая и синтаксическая неоднозначность оригинала.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение мысли предыдущего стиха; «ведь» естественно передаёт пояснительную связь в русском контексте.
- source_word: הֶחֱלִיק אֵלָיו
  choice: льстит себе
  rationale: Буквально глагол означает «делать гладким», а идиоматически — «льстить»; сочетание с אֵלָיו указывает на действие, направленное на самого человека.
- source_word: בְּעֵינָיו
  choice: в собственных глазах
  rationale: Сохранена обычная древнееврейская идиома, обозначающая личную оценку или восприятие самого себя.
- source_word: לִמְצֹא עֲוֺנוֹ לִשְׂנֹא
  choice: не замечая своего беззакония и не ненавидя его
  rationale: 'Трудная сжатая конструкция передана как результат самообольщения: человек не распознаёт своего греха и не отвергает его. Деепричастная конструкция естественна по-русски, но неоднозначность оригинала отмечена в сноске.'
- source_word: עֲוֺנוֹ
  choice: своего беззакония
  rationale: «Беззаконие» сохраняет нравственную весомость עָוֹן; возвратное местоимение ясно связывает его с субъектом.
theological_decisions:
- issue: Нравственно-психологический смысл стиха
  choice: Самообольщение мешает нечестивому распознать и возненавидеть собственное беззаконие.
  alternative: 'Он льстит себе, пока его беззаконие не обнаруживается как ненавистное; либо буквально: он «сглаживает для себя», чтобы найти своё беззаконие и возненавидеть.'
  rationale: Контекст описывает внутреннюю испорченность нечестивого, однако синтаксис еврейского текста допускает несколько толкований. Основной текст передаёт наиболее связное контекстуальное понимание, а сноска сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; достоинство поэтической речи сохранено без архаизмов. «Льстит себе» понятно обычному читателю, а более буквальный образ и неопределённость синтаксиса вынесены в сноску.
