  text: אָ֤וֶן יַחְשֹׁ֗ב עַֽל מִשְׁכָּ֫ב֥/וֹ יִ֭תְיַצֵּב עַל דֶּ֣רֶךְ לֹא ט֑וֹב רָ֝֗ע לֹ֣א יִמְאָֽס׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/004.yaml
  text: He devises wickedness on his bed[a]; he sets himself on a way that is not good; he does not reject evil.
translation:
  language: ru
  text: На постели своей он замышляет беззаконие[a]; становится на недобрый путь; зла не отвергает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зло»; еврейское слово может также означать беду, неправду или нечестие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָוֶן
  choice: беззаконие
  rationale: В данном контексте слово обозначает нравственное зло, сознательно замышляемое человеком. «Беззаконие» сохраняет этическую силу слова и позволяет отличить его от רָע («зло») в конце стиха.
- source_word: יַחְשֹׁב
  choice: замышляет
  rationale: Глагол חשב может означать «думать», «планировать», «замышлять». Сочетание с אָוֶן и образ размышления на постели указывают на намеренное обдумывание дурного.
- source_word: עַל מִשְׁכָּבוֹ
  choice: на постели своей
  rationale: Прямо передаёт обстоятельство места и сохраняет поэтический образ ночного замысла; порядок слов естественен для русского библейского стиха.
- source_word: יִתְיַצֵּב
  choice: становится
  rationale: Возвратная форма глагола יצב выражает сознательное занятие позиции или вступление на избранный путь. «Становится» сохраняет этот оттенок, не добавляя отсутствующего в тексте объяснения.
- source_word: עַל דֶּרֶךְ לֹא טוֹב
  choice: на недобрый путь
  rationale: Сохраняет метафору пути как образа поведения и близко передаёт буквальное «путь не добрый», оставаясь естественным по-русски.
- source_word: רָע
  choice: зло
  rationale: Здесь слово обозначает нравственное зло как объект отношения человека; прямой русский эквивалент сохраняет обобщённость оригинала.
- source_word: לֹא יִמְאָס
  choice: не отвергает
  rationale: Глагол מאס охватывает значения «отвергать», «презирать», «гнушаться». «Не отвергает» ясно выражает отказ от нравственного отмежевания от зла, не усиливая значение до эмоционального «не гнушается».
