lexical_decisions:
- source_word: מַה יָּקָר
  choice: Как драгоценна
  rationale: מַה вводит восклицание, а יָקָר выражает высокую ценность; сочетание естественно передаёт восхищение и сохраняет поэтическую силу.
- source_word: חַסְדְּךָ
  choice: Твоя верная любовь
  rationale: חֶסֶד объединяет значения любви, милости и неизменной верности. «Верная любовь» сохраняет реляционный и устойчивый характер понятия, не сужая его только до милосердия.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Слово употреблено как прямое обращение; русский звательный эквивалент «Боже» естественен в возвышенной поэтической речи.
- source_word: וּבְנֵי אָדָם
  choice: И сыны человеческие
  rationale: Передаёт соединительный союз и сохраняет образный еврейский оборот, обозначающий людей вообще, а не только мужчин.
- source_word: בְּצֵל כְּנָפֶיךָ
  choice: в тени Твоих крыльев
  rationale: Буквально и естественно сохраняет метафору защитной близости под Божьими крыльями.
- source_word: יֶחֱסָיוּן
  choice: укрываются
  rationale: Глагол חסה означает искать или находить убежище. «Укрываются» кратко и естественно выражает обращение к защите, не уточняя сверх текста, был ли искомый приют уже окончательно найден.
theological_decisions:
- issue: Смысл חֶסֶד
  choice: верная любовь
  alternative: милость; неизменная любовь; заветная верность
  rationale: Выбранное выражение удерживает вместе любовь и верность, не сводя многозначный термин только к милости и не вводя слово «завет», которого в стихе прямо нет.
- issue: Коллективное значение בְּנֵי אָדָם
  choice: сыны человеческие
  alternative: люди; человеческий род
  rationale: Сохранён исходный поэтический образ, при этом сноска разъясняет, что речь идёт обо всех людях, а не исключительно о мужчинах.
- issue: Образ Божьих крыльев
  choice: в тени Твоих крыльев
  alternative: под защитой Твоих крыльев
  rationale: Метафора оставлена без рационализирующей замены, чтобы сохранить образность и богословское напряжение исходного текста.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной псалмовой интонацией. Сохранены восклицание, прямое обращение и образ крыльев. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
