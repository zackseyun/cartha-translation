lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Формула надписаний псалмов обращена к тому, кто руководил музыкальным исполнением; этот вариант краток, понятен и сохраняет богослужебный контекст.
- source_word: לְעֶבֶד
  choice: слуги
  rationale: Здесь עֶבֶד — почётное обозначение Давида как служителя Бога, поэтому «слуга» уместнее, чем «раб».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: לְדָוִד
  choice: Давида
  rationale: Родительный падеж сохраняет широкое значение атрибуции в надписании, не сводя его исключительно к прямому авторству.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Передача עֶבֶד в почётном титуле
  choice: слуга
  alternative: раб
  rationale: В данном надписании слово обозначает почётное отношение служения Яхве, а не подчёркивает подневольный статус.
- issue: Значение לְדָוִד в надписании
  choice: Давида
  alternative: Давидов / написанный Давидом
  rationale: Еврейский предлог допускает авторство, принадлежность или более широкую связь; родительный падеж сохраняет эту неоднозначность.
translation_notes:
