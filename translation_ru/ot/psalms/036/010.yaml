lexical_decisions:
- source_word: מְשֹׁךְ
  choice: Продли
  rationale: Императив буквально означает «тяни, протягивай»; с отвлечённым дополнением חֶסֶד естественное русское «продли» передаёт просьбу о дальнейшем проявлении Божьей милости, сохраняя образ протяжённости.
- source_word: חַסְדְּךָ
  choice: милость Твою
  rationale: חֶסֶד обозначает верную, неизменную благосклонность в отношениях. «Милость» — естественный и достойный русский эквивалент; её верный и постоянный характер здесь поддерживается глаголом «продли» и контекстом псалма.
- source_word: לְיֹדְעֶיךָ
  choice: к знающим Тебя
  rationale: Причастная форма буквально обозначает «знающих Тебя», а ל выражает направленность проявления милости. Формулировка сохраняет личностный смысл знания Бога.
- source_word: וְצִדְקָתְךָ
  choice: и праведность Твою
  rationale: צְדָקָה может обозначать праведность или справедливость. «Праведность» сохраняет более широкое нравственное и заветное значение и не сужает его до судебной сферы.
- source_word: לְיִשְׁרֵי לֵב
  choice: к правым сердцем
  rationale: Еврейская идиома буквально говорит о «прямых/правых сердцем», то есть о людях внутренней цельности. «Правые сердцем» сохраняет поэтическую форму и остаётся понятным в литературном русском.
theological_decisions:
- issue: Передача параллели Божьей милости и праведности
  choice: «милость» и «праведность» без догматического уточнения
  alternative: «заветная любовь» и «справедливость»
  rationale: Так сохраняются широта значений חֶסֶד и צְדָקָה, поэтический параллелизм и богословское напряжение между Божьей благосклонностью и нравственной верностью без привнесения конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим библейским строем. Инверсия «милость Твою» и прописные местоимения сохраняют достоинство молитвенного обращения; тире делает явным параллелизм без добавления нового содержания.
