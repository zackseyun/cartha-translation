source:
  edition: WLC
  text: צִדְקָֽתְ/ךָ֨ כְּֽ/הַרְרֵי אֵ֗ל מִ֭שְׁפָּטֶ/ךָ תְּה֣וֹם רַבָּ֑ה אָ֤דָֽם וּ/בְהֵמָ֖ה תוֹשִׁ֣יעַ יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/036/006.yaml
  text: Your righteousness is like the mountains of God[a]; your judgments are a great deep. O Yahweh[b], you save man and beast.
translation:
  language: ru
  text: Праведность Твоя — как горы Божьи[a], суды Твои — великая бездна. Человека и зверя спасаешь Ты, Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «горы Бога»; это выражение может также означать «могучие горы» или «высочайшие горы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִדְקָתְךָ
  choice: Праведность Твоя
  rationale: «Праведность» сохраняет широкий нравственный и заветный смысл слова, тогда как «справедливость» здесь было бы уже.
- source_word: כְּהַרְרֵי אֵל
  choice: как горы Божьи
  rationale: 'Буквальная конструкция сохраняет поэтический образ и подлинную неоднозначность: речь может идти о горах Бога либо, идиоматически, о могучих или высочайших горах.'
- source_word: מִשְׁפָּטֶךָ
  choice: суды Твои
  rationale: «Суды» передаёт Божьи судебные решения и деяния и не смешивает это слово с параллельным צְדָקָה.
- source_word: תְּהוֹם רַבָּה
  choice: великая бездна
  rationale: Выражение сохраняет образ неизмеримой глубины и естественно звучит в русской поэзии.
- source_word: אָדָם
  choice: человека
  rationale: В данном противопоставлении зверю слово имеет родовое значение и обозначает человека как представителя человечества.
- source_word: וּבְהֵמָה
  choice: и зверя
  rationale: «Зверь» сохраняет обобщённое единственное число и возвышенную поэтическую пару «человек и зверь».
- source_word: תוֹשִׁיעַ
  choice: спасаешь
  rationale: Глагол охватывает спасение, избавление и сохранение; «спасаешь» сохраняет широту смысла и богословскую насыщенность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет имя в тексте, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Родовое значение אָדָם
  choice: человека
  alternative: людей / человечество
  rationale: Единственное число сохраняет поэтический параллелизм со словом «зверя», оставаясь в русском языке родовым обозначением.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Инверсия в последней строке подчёркивает глагол «спасаешь» и сохраняет обращение к Яхве без добавления отсутствующего в оригинале междометия.
