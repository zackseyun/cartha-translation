id: PSA.76.12
reference: Psalms 76:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יִ֭בְצֹר ר֣וּחַ נְגִידִ֑ים נ֝וֹרָ֗א לְ/מַלְכֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/012.yaml
  text: He cuts off the spirit of princes[b][a]; he is feared by the kings of the earth.
translation:
  language: ru
  text: Он сокрушает дух правителей[a], Он грозен царям земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сдерживает дух правителей». Слово «дух» может также означать «дыхание», «мужество» или «нрав».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Он внушает страх царям земли».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִבְצֹר
  choice: сокрушает
  rationale: Глагол בצר здесь выражает решительное ограничение или слом силы правителей. «Сокрушает» естественно по-русски сочетается с «духом» и передаёт решительность действия, не сводя его однозначно ни к лишению жизни, ни к сдерживанию гнева.
- source_word: רוּחַ
  choice: дух
  rationale: «Дух» сохраняет широту еврейского רוּחַ, которое в данном контексте может обозначать внутреннюю силу, мужество, надменный настрой или дыхание.
- source_word: נְגִידִים
  choice: правителей
  rationale: Современное и понятное обозначение вождей и властителей; оно естественно образует поэтическую параллель с «царями земли».
- source_word: נוֹרָא
  choice: грозен
  rationale: «Грозен» передаёт внушающее страх величие Бога и сохраняет форму характеристики, а не превращает её в прямое утверждение о субъективном чувстве всех царей.
- source_word: לְמַלְכֵי אָרֶץ
  choice: царям земли
  rationale: 'Дательный падеж естественно передаёт отношение, выраженное предлогом ל: Бог грозен по отношению к земным царям.'
theological_decisions:
- issue: Характер Божьего действия над правителями
  choice: Бог решительно сокрушает их внутреннюю силу и надменный дух.
  alternative: Бог отнимает у них дыхание и жизнь либо сдерживает их мужество, гнев или нрав.
  rationale: Сочетание בצר и רוּחַ допускает несколько оттенков. Основной текст сохраняет широкий образ Божьего господства над правителями, а примечание указывает на подлинную лексическую неоднозначность.
- issue: Значение נוֹרָא по отношению к царям
  choice: Бог грозен царям земли.
  alternative: Цари земли боятся Его; Он внушает им благоговейный страх.
  rationale: Формулировка «грозен царям» близка к грамматической форме оригинала и не ослабляет значение до простого восхищения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Правители» понятно широкому читателю, а «грозен царям земли» сохраняет достоинство и лаконизм еврейской строки.
