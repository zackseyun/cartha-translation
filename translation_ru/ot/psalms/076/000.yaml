  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֑ת מִזְמ֖וֹר לְ/אָסָ֣ף שִֽׁיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/000.yaml
  text: For the choirmaster[a]; with stringed instruments. A psalm of Asaph[b], a song.
translation:
  language: ru
  text: Руководителю хора[a]. На струнных инструментах. Псалом Асафа[b]. Песнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Руководителю». Еврейское слово обозначает руководителя музыкального исполнения; хор прямо не упомянут.'
    reason: translation_clarification
  - marker: b
    text: Выражение «Асафа» может указывать на авторство, связь с певческим кругом Асафа или посвящение Асафу, а не обязательно только на личное авторство.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов это слово обозначает человека, руководившего музыкальным исполнением. Такой перевод естественен для современного русского языка и передаёт традиционную литургически-музыкальную функцию, хотя упоминание хора в самом слове не выражено прямо.
- source_word: בִּנְגִינֹת
  choice: На струнных инструментах
  rationale: Существительное указывает на струнные инструменты или исполняемую на них музыку. Предлог ב здесь естественно понимать как указание на средство исполнения.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Стандартное обозначение жанра; сохраняет отличие от следующего слова שִׁיר.
- source_word: לְאָסָף
  choice: Асафа
  rationale: 'Краткая традиционная формулировка сохраняет широту связи произведения с Асафом: возможны авторство, принадлежность к его кругу или посвящение.'
- source_word: שִׁיר
  choice: Песнь
  rationale: Передаёт второе жанровое обозначение и сохраняет стоящую в еврейском тексте последовательность «псалом… песнь».
theological_decisions:
- issue: Характер связи псалма с Асафом в לְאָסָף
  choice: Псалом Асафа
  alternative: Псалом для Асафа / псалом, принадлежащий Асафу
  rationale: Предлог לְ допускает авторство, принадлежность к связанному с Асафом певческому кругу или посвящение. Основной текст не сужает эту неоднозначность, а примечание делает её явной.
translation_notes:
  register: Современный литературный русский язык с лаконичной и dignified формой заголовка. Короткие самостоятельные фразы сохраняют последовательность еврейских указаний и не создают ложного впечатления, будто упоминание струнных инструментов поясняет функцию руководителя.
