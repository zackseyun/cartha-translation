lexical_decisions:
- source_word: נוֹדָע
  choice: познан
  rationale: Нифаль от ידע допускает состояние «быть познанным, известным». Краткое «познан» сохраняет поэтическую форму и не вносит прямо не выраженной возвратности; возможный событийный оттенок отмечен в сноске.
- source_word: בִּיהוּדָה
  choice: в Иудее
  rationale: Предлог ב здесь естественно передаётся как «в»; «Иудея» может обозначать как землю, так и народ, что сохраняет географический и общинный оттенки оригинала.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологическую форму множественного числа, слово здесь имеет единственное значение и обозначает Бога Израиля.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Передача предлогом «в» сохраняет параллелизм с «в Иудее» и допускает как территориальное, так и народное понимание.
- source_word: גָּדוֹל
  choice: велико
  rationale: Прилагательное прямо означает «велик»; форма среднего рода согласована в русском с существительным «имя» без превращения признака в действие.
- source_word: שְׁמוֹ
  choice: Его имя
  rationale: Буквальная передача сохраняет библейскую многозначность имени как явленной сущности, репутации и славы Бога.
theological_decisions:
- issue: Смысл выражения «имя Бога»
  choice: Сохранить конкретное выражение «велико Его имя».
  alternative: «велика Его слава» или «Его глубоко чтут»
  rationale: Так сохраняется богословская ёмкость «имени» как явленной сущности и известности Бога, не сводимая только к славе или человеческому почитанию.
- issue: Значение формы נוֹדָע
  choice: «Бог познан»
  alternative: «Бог явил Себя» или «Бог известен»
  rationale: «Познан» сохраняет пассивно-стативную форму еврейского текста и вместе с тем не исключает контекстуального оттенка совершившегося самооткровения; альтернативный оттенок вынесен в сноску.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим строем. Инверсия во второй строке сохраняет параллелизм и акцент оригинала; местоимение «Его» написано с прописной буквы по принятой русской библейской традиции.
