lexical_decisions:
- source_word: בְּקוּם
  choice: когда Бог восстаёт
  rationale: Предлог ב с инфинитивом קום выражает время действия; настоящее время естественно для поэтического описания Божьего вмешательства.
- source_word: לַמִּשְׁפָּט
  choice: для суда
  rationale: Передаёт судебный смысл מִשְׁפָּט, не исключая оттенка осуществления справедливости.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Обычное обозначение Бога Израиля с единственным референтом.
- source_word: לְהוֹשִׁיעַ
  choice: чтобы спасти
  rationale: Инфинитив породы хифиль от ישׁע обозначает спасение или избавление; «спасти» ясно и непосредственно передаёт смысл.
- source_word: כָּל
  choice: всех
  rationale: В сочетании с последующей конструкцией имеет собирательное значение.
- source_word: עַנְוֵי
  choice: смиренных
  rationale: Слово может обозначать смиренных, кротких или угнетённых; «смиренных» сохраняет нравственно-духовный и социальный оттенки, не сводя значение только к страданию.
- source_word: אֶרֶץ
  choice: на земле
  rationale: אֶרֶץ допускает значения «земля» и «страна»; при כָּל широкий смысл «земля» контекстуально естественен.
- source_word: סֶלָה
  choice: Села
  rationale: Традиционная транслитерация сохраняет не вполне ясное литургическое или музыкальное обозначение.
theological_decisions:
- issue: Смысловой диапазон עַנְוֵי
  choice: смиренных
  alternative: кротких или угнетённых
  rationale: Основной вариант сохраняет сочетание внутреннего смирения и низкого положения, а примечание не устраняет подлинную лексическую неоднозначность.
- issue: Масштаб אֶרֶץ
  choice: земле
  alternative: стране
  rationale: Широкое значение соответствует поэтическому контексту, однако локальное значение еврейского слова остаётся возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим строем. Порядок слов слегка сглажен ради естественности; «Села» сохранено без толкования.
