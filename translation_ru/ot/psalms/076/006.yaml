  text: От Твоего окрика[a], Боже Иакова, погрузились в глубокий сон и колесница, и конь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Из-за Твоего окрика»; еврейский предлог может указывать как на источник, так и на причину.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте: «колесница и конь» — поэтический образ военной силы; некоторые понимают его как включающий также возниц и всадников.'
    reason: cultural_note
lexical_decisions:
- source_word: מִגַּעֲרָתְךָ
  choice: От Твоего грозного окрика
  rationale: Предлог מִן может указывать на источник или причину, а גְּעָרָה — на властный, угрожающий окрик. Формулировка передаёт непосредственное действие Божьего слова и сохраняет причинно-исходную неоднозначность еврейского оборота.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Боже Иакова
  rationale: Сочетание является Божьим титулом и в контексте имеет силу прямого обращения; русская звательная форма «Боже» естественна для возвышенной поэзии.
- source_word: נִרְדָּם
  choice: погрузились в глубокий сон
  rationale: Nifal глагола רדם обозначает глубокий сон или оцепенение, а не обычный отдых. Перевод сохраняет образ сна и внезапной утраты силы, не заменяя его прямым утверждением о смерти.
- source_word: וְרֶכֶב וָסוּס
  choice: и колесница, и конь
  rationale: Перевод сохраняет названные в еврейском тексте элементы военной силы и подчёркивает их парность. Замена «колесницы» на «всадника» была бы толкованием, не выраженным непосредственно в тексте.
theological_decisions:
- issue: Характер поражения вражеской силы
  choice: Божий грозный окрик лишает силы колесницу и коня; это выражено образом глубокого сна.
  alternative: Понимать строку либо как буквальный сон, либо как прямое обозначение смерти и полного уничтожения.
  rationale: Образ נִרְדָּם в контексте Божьей победы говорит об обездвиженности и бессилии военной мощи, но сам стих не требует сводить этот образ исключительно к обычному сну или однозначно заменять его словом «смерть».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены прямое обращение, образ глубокого сна и конкретные военные реалии исходного текста.
