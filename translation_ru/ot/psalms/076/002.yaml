  text: His shelter was in Salem[b][a], and his dwelling place in Zion.
translation:
  language: ru
  text: Его шатёр был в Салиме[a], и Его обитель — на Сионе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шалаш», «укрытие», «навес». Салим традиционно отождествляют с Иерусалимом; здесь он поставлен в параллель с Сионом как местом пребывания Бога.'
    reason: Лексическая альтернатива для «шатёр» и пояснение традиционного отождествления Салима без внесения его в основной текст.
lexical_decisions:
- source_word: וַיְהִי
  choice: —
  rationale: Еврейская связка со значением местонахождения естественно передаётся в русском именным предложением с тире; смысл «находится/был» сохраняется без ненужного уточнения времени.
- source_word: בְשָׁלֵם
  choice: в Салиме
  rationale: Сохранено собственное имя שָׁלֵם, а не внесено толкование «Иерусалим»; предложный падеж соответствует русской норме.
- source_word: סֻכּוֹ
  choice: Его шатёр
  rationale: סֻכָּה обозначает временное укрытие, шалаш или шатёр. «Шатёр» звучит естественно и достойно в поэзии, не придавая слову обязательного специального культового смысла.
- source_word: וּמְעוֹנָתוֹ
  choice: и ... Его обитель
  rationale: מְעוֹנָה означает место пребывания, жилище. «Обитель» передаёт смысл ёмко и сохраняет возвышенный поэтический регистр псалма.
- source_word: בְצִיּוֹן
  choice: на Сионе
  rationale: Сохранено собственное имя צִיּוֹן; предлог «на» соответствует устойчивому русскому употреблению применительно к Сиону.
theological_decisions:
- issue: Соотношение Салима и Сиона
  choice: Сохранить оба географических имени как отдельные элементы поэтического параллелизма.
  alternative: Передать «Салим» как «Иерусалим», прямо отождествив названия.
  rationale: Еврейский текст ставит Салим и Сион в параллель, но не заменяет одно название другим. Перевод сохраняет эту форму и не превращает традиционное отождествление в часть основного текста.
translation_notes:
  register: Современный литературный русский с поэтической торжественностью. Эллиптические конструкции с тире воспроизводят краткость и параллелизм еврейской строки. Прописное «Его» выбрано как уважительное обозначение Бога без добавления отсутствующего в тексте имени.
