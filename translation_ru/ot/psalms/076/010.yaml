  text: כִּֽי חֲמַ֣ת אָדָ֣ם תּוֹדֶ֑/ךָּ שְׁאֵרִ֖ית חֵמֹ֣ת תַּחְגֹּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/010.yaml
  text: For the wrath of man will praise you[b][a]; with the remnant of wrath you will gird yourself.
translation:
  language: ru
  text: Ибо человеческая ярость[a] прославит Тебя; остатком ярости Ты препояшешься[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ярость человека»; слово «человек» здесь обозначает людей вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «остаток ярости Ты обуздаешь». Еврейский текст заключительной фразы труден; основной перевод ближе следует масоретской огласовке и сохраняет её метафору.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предшествующему призыву; «ибо» сохраняет причинно-пояснительную связь и соответствует возвышенному поэтическому регистру.
- source_word: חֲמַת אָדָם
  choice: человеческая ярость
  rationale: חֵמָה обозначает жар, ярость или гнев, а אָדָם здесь относится к человечеству вообще. «Человеческая ярость» естественно передаёт обобщённый смысл без неоправданного ограничения одним мужчиной.
- source_word: תּוֹדֶךָּ
  choice: прославит Тебя
  rationale: Форма от ידה может означать благодарение или хвалу. В данном контексте человеческая ярость вопреки своему намерению обращается к Божьей славе; «прославит Тебя» ясно и естественно передаёт этот смысл.
- source_word: שְׁאֵרִית
  choice: остатком
  rationale: Существительное означает то, что осталось. Творительный падеж естественно связан в русском с образом препоясывания и сохраняет метафорическую структуру масоретского текста.
- source_word: חֵמֹת
  choice: ярости
  rationale: Хотя еврейская форма имеет множественное число, здесь оно, вероятно, носит собирательный или усилительный характер. Русское отвлечённое существительное в единственном числе звучит естественно и сохраняет связь с первой половиной стиха.
- source_word: תַּחְגֹּר
  choice: Ты препояшешься
  rationale: Глагол חגר буквально означает опоясаться или препоясаться чем-либо. Выбор сохраняет трудную метафору исходного текста, не сводя её к одному из возможных толкований.
theological_decisions:
- issue: Смысл заключительной фразы שְׁאֵרִית חֵמֹת תַּחְגֹּר
  choice: Бог является подлежащим и «препоясывается» остатком ярости.
  alternative: «Остаток ярости Ты обуздаешь»; либо «остаток ярости празднично окружит Тебя».
  rationale: Форма глагола второго лица мужского рода единственного числа естественнее всего указывает на Бога как подлежащее. Поскольку еврейская фраза трудна, основной текст следует масоретской огласовке и сохраняет метафору, а распространённое толкование об обуздании приводится в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Метафора «препояшешься» намеренно сохранена, несмотря на её необычность, а прописное «Тебя/Ты» поддерживает традиционный русский библейский регистр.
