  text: אֶשְׁתּוֹלְל֨וּ אַבִּ֣ירֵי לֵ֭ב נָמ֣וּ שְׁנָתָ֑/ם וְ/לֹא מָצְא֖וּ כָל אַנְשֵׁי חַ֣יִל יְדֵי/הֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/005.yaml
  text: The stouthearted were plundered; they slept their sleep[a], and none of the men of valor could find their hands.
translation:
  language: ru
  text: Отважные сердцем сами стали добычей; они уснули своим сном, и никто из доблестных воинов не нашёл своих рук.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «никто из доблестных воинов не мог действовать руками», то есть все они оказались бессильны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁתּוֹלְלוּ
  choice: сами стали добычей
  rationale: Форма от корня שלל передаёт мысль о том, что сильные, прежде бравшие добычу, теперь сами подверглись разорению. Этот вариант естественно звучит по-русски и сохраняет военный контекст.
- source_word: אַבִּירֵי לֵב
  choice: отважные сердцем
  rationale: Буквально «могучие сердцем»; выражение обозначает внутренне решительных, смелых людей и в контексте относится к воинам.
- source_word: נָמוּ שְׁנָתָם
  choice: они уснули своим сном
  rationale: Сохранён выразительный еврейский оборот без уточнения, идёт ли речь непосредственно о смерти или о подобном смерти сне поражения.
- source_word: אַנְשֵׁי חַיִל
  choice: доблестные воины
  rationale: Выражение обозначает сильных, храбрых людей, здесь — воинов. Слово «доблестные» сохраняет оттенок воинской отваги.
- source_word: וְלֹא מָצְאוּ ... יְדֵיהֶם
  choice: никто ... не нашёл своих рук
  rationale: В основном тексте сохранён буквальный и яркий образ еврейского оригинала; подразумеваемая неспособность действовать пояснена в сноске.
theological_decisions:
- issue: Характер сна
  choice: Оставить образ «уснули своим сном» без прямого добавления «смертным».
  alternative: «Уснули смертным сном».
  rationale: Контекст убедительно указывает на гибель или полное поражение, однако слово «смертным» отсутствует в еврейском тексте; буквальный образ сохраняет поэтическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконизма и образности еврейской поэзии. Необычное выражение «не нашёл своих рук» намеренно оставлено в тексте и разъяснено в сноске.
