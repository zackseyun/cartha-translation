  text: שָׁ֭מָּ/ה שִׁבַּ֣ר רִשְׁפֵי קָ֑שֶׁת מָגֵ֬ן וְ/חֶ֖רֶב וּ/מִלְחָמָ֣ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/003.yaml
  text: There he shattered the arrows of the bow[a], shield and sword and battle[c][b]. Selah
translation:
  language: ru
  text: Там Он сокрушил стрелы лука[a], щит, меч и войну[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пламенеющие стрелы лука». Еврейское выражение буквально содержит образ «пламени» или «вспышек лука» и поэтически обозначает стрелы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и битву»; также возможно: «и военные действия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמָּה
  choice: Там
  rationale: Наречие места отсылает к месту, названному в предыдущем стихе; название места здесь не повторяется.
- source_word: שִׁבַּר
  choice: сокрушил
  rationale: Порода пиэль передаёт решительное, сильное разрушение; «сокрушил» сохраняет поэтическую выразительность.
- source_word: רִשְׁפֵי קָשֶׁת
  choice: пламенеющие стрелы лука
  rationale: רִשְׁפֵי буквально связано с пламенем или вспышками и в сочетании с луком обозначает стрелы с ярким огненным образом; перевод сохраняет и предметный смысл, и метафору.
- source_word: מָגֵן
  choice: щит
  rationale: Обычное обозначение защитного вооружения.
- source_word: וְחֶרֶב
  choice: меч
  rationale: Естественный русский эквивалент в бессоюзно-союзном поэтическом перечне; союз выражен перед последним кульминационным членом.
- source_word: וּמִלְחָמָה
  choice: и саму войну
  rationale: מִלְחָמָה может обозначать войну, битву или военные действия. «Саму войну» естественно передаёт переход от отдельных видов оружия к уничтожению войны как целого.
- source_word: סֶלָה
  choice: Села
  rationale: Традиционная транслитерация сохранена, поскольку точное значение вероятного музыкально-литургического указания неизвестно.
theological_decisions:
- issue: Подразумеваемое подлежащее при глаголе 3-го лица мужского рода
  choice: Он — Бог, названный в ближайшем контексте
  alternative: Неуточнённое лицо мужского рода
  rationale: В еврейском тексте этого стиха подлежащее явно не названо, однако из контекста псалма действующим лицом является Бог. Местоимение «Он» сохраняет контекстуальную связь, не вставляя имя в сам стих.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным поэтическим ритмом. Повтор еврейских союзов не воспроизведён механически; кульминация перечня передана словами «и саму войну».
