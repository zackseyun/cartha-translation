lexical_decisions:
- source_word: נָאוֹר
  choice: сияешь
  rationale: Слово передаёт сияние и светлое великолепие. Глагольная форма «сияешь» естественна в современной русской поэзии и не предполагает, будто свет получен извне.
- source_word: אַתָּה
  choice: Ты
  rationale: Отдельное местоимение сохраняет эмфатическое обращение еврейского текста.
- source_word: אַדִּיר
  choice: величественнее
  rationale: Слово обозначает величие, благородство и мощь; сравнительная форма обусловлена следующим предлогом מִן и не сводит смысл только к силе.
- source_word: מֵהַרְרֵי
  choice: гор
  rationale: Предлог מִן при אַדִּיר наиболее естественно выражает сравнение, уже переданное сравнительной степенью «величественнее»; конструктивная связь передана сочетанием «гор добычи».
- source_word: טָרֶף
  choice: добычи
  rationale: Существительное прежде всего означает добычу хищника, а расширительно — награбленное имущество. «Добыча» сохраняет яркий поэтический образ и допускает оба смысловых оттенка лучше, чем более узкое «награбленное».
theological_decisions:
- issue: Смысл сочетания מֵהַרְרֵי טָרֶף
  choice: 'Сравнение: Бог величественнее «гор добычи».'
  alternative: Бог сияет «с гор добычи»; либо «горы награбленного».
  rationale: Синтаксис с אַדִּיר предпочтительно указывает на сравнение, однако образ «гор добычи» оставлен без привязки к определённому историческому или богословскому толкованию.
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим ритмом. Заглавное «Ты» уместно для прямого обращения к Богу. Повтор «Ты» делает две характеристики ясными и сохраняет эмфатический строй строки.
