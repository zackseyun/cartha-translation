source:
  edition: WLC
  text: מִ֭/שָּׁמַיִם הִשְׁמַ֣עְתָּ דִּ֑ין אֶ֖רֶץ יָֽרְאָ֣ה וְ/שָׁקָֽטָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/008.yaml
  text: From heaven you made judgment heard[c][b][a]; the earth feared and was quiet.
translation:
  language: ru
  text: С небес Ты возвестил суд[a]; земля[b] устрашилась и затихла[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Ты дал услышать суд»; возможно также: «Ты огласил приговор».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «страна»; однако противопоставление небес и земли поддерживает здесь более широкий смысл.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «замерла» или «успокоилась».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: С небес
  rationale: Предлог מִן указывает на источник, а שָׁמַיִם обозначает небеса как место Божьего пребывания. «С небес» естественно по-русски и сохраняет противопоставление небес и земли.
- source_word: הִשְׁמַעְתָּ
  choice: Ты возвестил
  rationale: Каузативная форма глагола שׁמע буквально означает «дал услышать, сделал слышимым». «Возвестил» естественно передаёт публичное оглашение с небес, а буквальная каузативная формулировка сохранена в примечании.
- source_word: דִּין
  choice: суд
  rationale: דִּין здесь обозначает Божье судебное решение или действие суда. Русское «суд» сохраняет ёмкость и допускает обе смысловые стороны, не сужая значение до одного лишь приговора.
- source_word: אֶרֶץ
  choice: земля
  rationale: Хотя אֶרֶץ может означать и определённую страну, противопоставление небес и земли поддерживает здесь широкий, вселенский смысл.
- source_word: יָרְאָה
  choice: устрашилась
  rationale: Глагол ירא выражает страх, иногда благоговейный трепет. «Устрашилась» сохраняет краткость и возвышенный поэтический тон в контексте Божьего суда.
- source_word: וְשָׁקָטָה
  choice: и затихла
  rationale: שׁקט передаёт тишину, неподвижность или успокоение после смятения. «Затихла» естественно описывает реакцию земли на Божий суд, не уточняя сверх текста, была ли это неподвижность или прекращение шума.
theological_decisions:
- issue: Объём значения אֶרֶץ в противопоставлении небесам
  choice: земля как весь земной мир
  alternative: страна или земля в более узком смысле
  rationale: Поэтическая пара «небеса — земля» указывает на широкий космический охват. Такой перевод не вводит без достаточного основания более узкую национальную отсылку.
- issue: Характер דִּין как Божьего судебного действия
  choice: суд
  alternative: приговор
  rationale: «Суд» сохраняет возможную смысловую широту между судебным решением и самим осуществлением правосудия; «приговор» был бы конкретнее, чем требует еврейский текст.
translation_notes:
  register: Современный литературный русский с лаконичным, возвышенным поэтическим звучанием. Обращение к Богу передано традиционным прописным «Ты». Ритм строится на двух кратких частях и сохраняет небесно-земное противопоставление оригинала.
