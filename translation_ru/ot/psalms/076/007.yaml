lexical_decisions:
- source_word: אַתָּה ... אַתָּה
  choice: Ты — Ты
  rationale: Повтор личного местоимения передаёт подчёркнутость еврейского текста, не добавляя прямо не выраженного значения «Ты один».
- source_word: נוֹרָא
  choice: внушаешь страх
  rationale: Причастно-прилагательная форма от ירא описывает Бога как вызывающего страх и благоговейный трепет. Эта формулировка естественна по-русски и сохраняет направленность на отклик человека.
- source_word: וּמִי
  choice: и кто
  rationale: Союз ו перед вопросительным местоимением естественно передан как «и», без добавления необязательного противительного оттенка.
- source_word: יַעֲמֹד לְפָנֶיךָ
  choice: устоит пред Тобой
  rationale: В риторическом вопросе имперфект выражает возможность; глагол «устоит» идиоматически передаёт неспособность выдержать Божье присутствие и гнев.
- source_word: מֵאָז
  choice: с того времени, как
  rationale: Сохраняет исходное временное значение «с тех пор / от того времени», не сводя его просто к одновременному «когда».
- source_word: אַפֶּךָ
  choice: вспыхнул Твой гнев
  rationale: אַף метонимически означает гнев. Глагол «вспыхнул» добавлен для естественной русской связи с מֵאָז; в примечании сохранена более буквальная временная конструкция.
theological_decisions:
- issue: Характер страха перед Богом
  choice: внушаешь страх
  alternative: страшен; достоин страха; грозен
  rationale: Выбор сохраняет как ужас перед Божьей силой, так и благоговейный трепет, не ограничивая смысл одним из этих оттенков.
- issue: Возможность устоять перед Богом в Его гневе
  choice: риторический вопрос «кто устоит»
  alternative: «кто может устоять»
  rationale: Будущая форма по-русски естественно выражает риторическую невозможность и не превращает высказывание в отвлечённое утверждение о способности.
- issue: Временное отношение מֵאָז к Божьему гневу
  choice: с того времени, как вспыхнул Твой гнев
  alternative: когда Ты гневаешься
  rationale: Сохраняется неоднозначный исходный оттенок начального момента и продолжающегося времени, а не только одновременность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Форма «пред Тобой» поддерживает псалмический регистр, оставаясь понятной современному читателю; прописные местоимения следуют принятой русской благоговейной издательской традиции, не меняя смысла оригинала.
