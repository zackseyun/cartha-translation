  source_fidelity: В целом перевод верно передаёт эмфазу повторённого «Ты», риторический вопрос и значение נוֹרָא как вызывающего страх. Однако «вспыхнул Твой гнев» вводит образ и глагольную экспрессию, которых в еврейском тексте нет. מֵאָז אַפֶּךָ обозначает временную точку/период, связанный с Божьим гневом; безопаснее выразить это как «с тех пор, как Ты разгневался», с буквальным вариантом в примечании.
