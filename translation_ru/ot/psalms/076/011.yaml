  source_fidelity: 'Текст точно передаёт две формы повелительного наклонения во множественном числе: призыв давать обеты Яхве и исполнять их. «Все, кто вокруг Него» обоснованно понимает כָּל־סְבִיבָיו как окружающих лиц или народы, а «пусть несут» удачно передаёт побудительный оттенок последующего глагола. «Дань» допустимо передаёт שַׁי как дар, приносимый высшему правителю, не исключая более общего значения «дар». «Грозному» сохраняет титульное, внушающее страх и трепет значение לַמּוֹרָא.'
