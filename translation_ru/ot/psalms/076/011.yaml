source:
  edition: WLC
  text: נִֽדֲר֣וּ וְ/שַׁלְּמוּ֮ לַ/יהוָ֪ה אֱֽלֹהֵ֫י/כֶ֥ם כָּל סְבִיבָ֑י/ו יוֹבִ֥ילוּ שַׁ֝֗י לַ/מּוֹרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/076/011.yaml
  text: Make vows to Yahweh your God and fulfill them[b][a]; let all around him bring tribute to the Fearsome One.
translation:
  language: ru
  text: Давайте обеты Яхве, вашему Богу, и исполняйте их; все, кто вокруг Него, пусть несут дань[a] Грозному[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дар», «подношение». Еврейское שַׁי обозначает дар почитаемому властителю; слово «дань» подчёркивает почтительный и, возможно, царско-политический оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Тому, Кого должно страшиться», «Внушающему трепет». Еврейское именование подчёркивает, что Бог внушает страх и благоговейный трепет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדֲרוּ
  choice: Давайте обеты
  rationale: Форма повелительного наклонения во множественном числе призывает дать обеты; сочетание «давать обеты» естественно для современного русского языка.
- source_word: וְשַׁלְּמוּ
  choice: и исполняйте их
  rationale: Глагол означает уплату или исполнение обета. Местоимение «их» естественно восполняет подразумеваемое дополнение и связывает повеление с предыдущей фразой.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано собственное имя יהוה, а не заменено титулом, чтобы сохранить употреблённое в еврейском тексте имя Бога.
- source_word: אֱלֹהֵיכֶם
  choice: вашему Богу
  rationale: Суффикс второго лица множественного числа передан притяжательным местоимением; выражение поясняет имя Яхве.
- source_word: כָּל סְבִיבָיו
  choice: все, кто вокруг Него
  rationale: Множественное число сказуемого указывает на людей или народы, окружающих Бога; формулировка сохраняет широту и поэтическую сжатость оригинала.
- source_word: יוֹבִילוּ
  choice: пусть несут
  rationale: Hiphil от יבל здесь обозначает принесение дара. «Пусть несут» естественно передаёт побуждение в русском языке.
- source_word: שַׁי
  choice: дань
  rationale: Слово обозначает дар, приносимый почитаемому властителю; «дань» сохраняет оттенки почтения и царской власти.
- source_word: לַמּוֹרָא
  choice: Грозному
  rationale: Существительное связано со страхом и трепетом и здесь служит именованием Бога. «Грозному» передаёт внушающую страх величественность без ослабления смысла.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя Бога.
- issue: Передача לַמּוֹרָא как божественного именования
  choice: Грозному
  alternative: Тому, Кого должно страшиться; Внушающему трепет
  rationale: Контекст подчёркивает устрашающее величие Бога перед правителями и народами. Выбранное именование сохраняет напряжение между страхом и благоговением, не сводя его к простому восхищению.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Синтаксис остаётся ясным для обычного читателя; прописная буква в «Грозному» показывает, что слово употреблено как божественное именование.
