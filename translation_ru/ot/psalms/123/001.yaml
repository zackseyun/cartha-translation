lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Сохраняет традиционное название этой группы псалмов и образ движения вверх, не уточняя, идёт ли речь о паломничестве, ступенях или ином восхождении.
- source_word: אֵלֶיךָ
  choice: К тебе
  rationale: Передаёт прямое обращение и направленность молитвы, выраженную предлогом אֶל.
- source_word: נָשָׂאתִי
  choice: поднимаю я
  rationale: Перфект первого лица в поэтической молитве обозначает совершаемое молящимся действие; настоящее время естественно передаёт его непосредственность.
- source_word: אֶת עֵינַי
  choice: глаза мои
  rationale: Буквальное и поэтически конкретное соответствие; не заменяется более отвлечённым словом «взор».
- source_word: הַיֹּשְׁבִי
  choice: о Восседающий
  rationale: Причастие от ישׁב буквально означает «сидящий/живущий»; «Восседающий» сохраняет образ сидения и уместный здесь царственный оттенок, а обращение с «о» делает конструкцию естественной по-русски.
- source_word: בַּשָּׁמָיִם
  choice: на небесах
  rationale: Передаёт формально множественное еврейское שָׁמַיִם и соответствует современному возвышенному русскому употреблению.
theological_decisions:
