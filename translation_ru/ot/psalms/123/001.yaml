  choice: о Восседающий на небесах
  alternative: о Живущий на небесах; о Сидящий на небесах
  rationale: Выбранный вариант допускает царственный оттенок контекста, но сноска сохраняет буквальную лексическую неоднозначность между сидением и пребыванием; божественное имя, отсутствующее в еврейском тексте, не добавляется.
- issue: Форма прямого обращения к Богу
  choice: строчная форма «тебе»
  alternative: почтительная прописная форма «Тебе»
  rationale: Строчная буква не вносит в перевод типографическое богословское различение, которого нет в еврейском письме, при этом личное обращение полностью сохраняется.
