  text: הִנֵּ֨ה כְ/עֵינֵ֪י עֲבָדִ֡ים אֶל יַ֤ד אֲֽדוֹנֵי/הֶ֗ם כְּ/עֵינֵ֣י שִׁפְחָה֮ אֶל יַ֪ד גְּבִ֫רְתָּ֥/הּ כֵּ֣ן עֵ֭ינֵי/נוּ אֶל יְהוָ֣ה אֱלֹהֵ֑י/נוּ עַ֝֗ד שֶׁ/יְּחָנֵּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/002.yaml
  text: Look[a], as the eyes of servants are toward the hand of their masters, as the eyes of a female servant are toward the hand of her mistress, so our eyes are toward Yahweh our God[b], until he shows us favor.
translation:
  language: ru
  text: 'Вот: как глаза слуг[a] обращены к руке их господ, как глаза служанки — к руке её госпожи, так наши глаза обращены к Яхве, нашему Богу, пока Он не будет милостив к нам[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рабов». Еврейское слово может обозначать и слуг, и рабов; здесь изображены зависимые служители, внимательно смотрящие на руку господина в ожидании его распоряжения или действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока Он не окажет нам благоволения»; возможно также: «пока Он не помилует нас».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание и вводит сравнение; «вот» сохраняет её указательную силу и уместно звучит в современной поэтической речи.
- source_word: כְעֵינֵי
  choice: как глаза
  rationale: Префикс כְּ выражает сравнение; повтор этой конструкции сохраняет параллелизм еврейского стиха.
- source_word: עֲבָדִים
  choice: слуг
  rationale: Слово может обозначать как слуг, так и рабов. В основном тексте «слуг» естественно передаёт образ зависимых домашних служителей, внимательно следящих за рукой господина; вариант «рабов» указан в сноске.
- source_word: יַד
  choice: руку
  rationale: 'Буквальный образ руки сохранён: она может указывать на распоряжение, действие или подаяние господина, и текст не уточняет, какой оттенок главенствует.'
- source_word: אֲדֹנֵיהֶם
  choice: их господ
  rationale: Форма множественного числа с местоименным суффиксом передана буквально; «господ» соответствует домашнему контексту и сохраняет отличие от Божьего имени.
- source_word: שִׁפְחָה
  choice: служанки
  rationale: Слово обозначает служанку или рабыню; «служанка» ясно и естественно сохраняет женский род в параллельной строке.
- source_word: גְּבִרְתָּהּ
  choice: её госпожи
  rationale: Передаёт женское обозначение хозяйки и структурно соответствует выражению «их господ».
- source_word: כֵּן
  choice: так
  rationale: Вводит вторую часть сравнения и сохраняет чёткую поэтическую соотнесённость строк.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное Божье имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אֱלֹהֵינוּ
  choice: нашему Богу
  rationale: Буквально сохраняет форму с местоименным суффиксом первого лица множественного числа и согласуется с направлением взгляда «к».
- source_word: עַד שֶׁיְּחָנֵּנוּ
  choice: пока Он не явит нам милость
  rationale: Глагол חנן означает проявить благоволение, оказать милость, быть милостивым. Эта формулировка естественна по-русски и передаёт ожидаемое благосклонное действие.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблено собственное Божье имя. Транслитерация «Яхве» сохраняет его как имя и не смешивает с титулом.
- issue: Смысл חנן в заключительной просьбе
  choice: пока Он не явит нам милость
  alternative: пока Он не будет милостив к нам; пока Он не помилует нас
  rationale: חנן прежде всего выражает благосклонность и милостивое отношение. Основной вариант сохраняет этот широкий смысл, а допустимые оттенки приводятся в сноске без сведения их к одной более узкой интерпретации.
- issue: Образ взгляда на руку господина
  choice: сохранить буквально без поясняющего добавления в основном тексте
  alternative: следить за указанием; ждать подаяния или помощи
  rationale: Рука может подразумевать распоряжение, действие, обеспечение или помощь. Исходный текст оставляет образ открытым, поэтому перевод не выбирает один смысл.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой поэзии. Повтор «как глаза… как глаза… так наши глаза» сохраняет синтаксический параллелизм оригинала. Слово «устремлены» добавлено как естественно подразумеваемое сказуемое без устранения образной неоднозначности. Местоимение «Он» написано с прописной буквы по русской благоговейной традиции.
