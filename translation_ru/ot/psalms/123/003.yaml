base_translation:
  language: en
  yaml_path: translation/ot/psalms/123/003.yaml
  text: Be gracious to us[a], O Yahweh; be gracious to us[b], for we have had more than enough of contempt.
translation:
  language: ru
  text: Будь милостив к нам[a], Яхве, будь милостив к нам, ибо мы пресытились презрением[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Помилуй нас». Еврейский глагол может означать проявление благоволения, милости или сострадания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ибо мы весьма насытились презрением» — то есть испытали его более чем достаточно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנוּ
  choice: Помилуй нас
  rationale: Императив от חנן с суффиксом 1-го лица множественного числа выражает просьбу явить благоволение, милость. В современном русском молитвенное «помилуй нас» естественно и ёмко передаёт этот смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом «Господь».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание повторённой просьбы.
- source_word: רַב שָׂבַעְנוּ
  choice: мы пресытились
  rationale: Сочетание усилительного רַב с перфектом שׂבע описывает достигшую чрезмерности насыщенность; русский глагол «пресытились» сохраняет образ наполнения сверх меры.
- source_word: בּוּז
  choice: презрением
  rationale: Слово обозначает презрение или презрительное обращение; абстрактное существительное естественно сочетается с сохранённым образом пресыщения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное Божье имя, не подменяя его титулом.
- issue: Смысл חנן
  choice: Помилуй нас
  alternative: Будь милостив к нам
  rationale: Оба варианта входят в смысловой диапазон глагола. «Помилуй» выбрано как естественная русская форма молитвенной просьбы, а примечание сохраняет оттенок благоволения и милости без сужения смысла.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Повтор сохранён. Образ насыщения передан глаголом «пресытились»; более привычный молитвенный глагол «помилуй» сопровождается примечанием о полном смысловом диапазоне חנן.
