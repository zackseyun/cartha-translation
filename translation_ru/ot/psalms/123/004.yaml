  text: С лихвой насытилась душа наша насмешками беспечных, презрением надменных.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַבַּת
  choice: с лихвой
  rationale: Наречное употребление усиливает глагол и указывает на чрезмерную полноту; выражение «с лихвой» естественно передаёт значение избытка.
- source_word: שָׂבְעָה
  choice: насытилась
  rationale: Глагол означает «насытиться, быть наполненным досыта». Буквальный образ сохранён, включая его горькую иронию применительно к насмешкам и презрению.
- source_word: נַפְשֵׁנוּ
  choice: душа наша
  rationale: Сохранён собирательный образ внутреннего существа говорящей общины и поэтический строй еврейского текста.
- source_word: הַלַּעַג
  choice: насмешками
  rationale: Слово обозначает насмешку, осмеяние или издевательскую речь; творительный падеж естественно сочетается с русским «насытилась».
- source_word: הַשַּׁאֲנַנִּים
  choice: беспечных
  rationale: Прилагательное описывает людей, живущих спокойно и самоуверенно, не тревожимых чужой бедой. «Беспечные» кратко сохраняет как беззаботность, так и оттенок самодовольства.
- source_word: הַבּוּז
  choice: презрением
  rationale: Передаёт отношение и обращение, выражающие пренебрежение, и образует смысловой параллелизм с «насмешками».
- source_word: לִגְאֵיוֹנִים
  choice: надменных
  rationale: Форма обозначает гордых, высокомерных людей. «Надменные» ясно выражает осуждаемую заносчивость и хорошо соответствует параллельному «беспечных».
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский язык с сохранением поэтической инверсии «душа наша». Образ насыщения сохранён намеренно, поскольку он передаёт метафору оригинала; «с лихвой» подчёркивает, что мера страдания уже переполнена. Параллельные определения не сведены к одной характеристике: «беспечные» и «надменные» могут обозначать перекрывающиеся, но не обязательно тождественные группы.'
