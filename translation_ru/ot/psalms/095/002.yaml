lexical_decisions:
- source_word: נְקַדְּמָה
  choice: предстанем пред
  rationale: Гиппильная когортативная форма 1-го лица множественного числа выражает призыв к совместному действию. «Предстанем пред» естественно передаёт приближение и появление перед лицом Бога.
- source_word: פָנָיו
  choice: Его лицом
  rationale: Сохраняет конкретный образ еврейского текста; при этом сочетание «пред Его лицом» в русском языке может обозначать личное присутствие.
- source_word: בְּתוֹדָה
  choice: с благодарением
  rationale: В данном параллелизме слово указывает прежде всего на выражение благодарности, а не на благодарственную жертву; «благодарение» соответствует торжественному поэтическому регистру.
- source_word: בִּזְמִרוֹת
  choice: в песнях
  rationale: Передаёт музыкальный характер хвалы без чрезмерно узкого значения «псалмы»; форма «в песнях» естественно описывает средство выражения ликования.
- source_word: נָרִיעַ
  choice: радостно воскликнем
  rationale: Когортативная форма продолжает совместный призыв, а глагол обозначает громкий ликующий возглас. Выбор передаёт как звучность, так и радостный характер действия.
- source_word: לוֹ
  choice: Ему
  rationale: Дательный падеж прямо и естественно передаёт направленность песенного возгласа к Богу.
