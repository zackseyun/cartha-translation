  text: אֲשֶׁר ל֣/וֹ הַ֭/יָּם וְ/ה֣וּא עָשָׂ֑/הוּ וְ֝/יַבֶּ֗שֶׁת יָדָ֥י/ו יָצָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/005.yaml
  text: The sea is his[a], for he made it[b], and his hands formed the dry land.
translation:
  language: ru
  text: Ему принадлежит море[a], ведь Он создал его[b], и сушу сформировали Его руки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которому (принадлежит) море»; или: «Море — Его».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и Он создал его». Еврейский союз формально означает «и», хотя здесь, вероятно, выражает причину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר לוֹ
  choice: Ему принадлежит
  rationale: Относительная конструкция с ל выражает принадлежность. Такая передача естественна по-русски и сохраняет смысл буквально необычного оборота «которое Ему [принадлежит]».
- source_word: הַיָּם
  choice: море
  rationale: Обычное значение существительного; «океан» было бы более узкой и интерпретирующей передачей.
- source_word: וְהוּא
  choice: ведь Он
  rationale: 'Союз ו формально значит «и», но в данном контексте связь, вероятнее всего, причинная: море принадлежит Богу, поскольку Он его сотворил.'
- source_word: עָשָׂהוּ
  choice: сотворил его
  rationale: Глагол עשה означает «сделал, создал»; «сотворил» уместно в возвышенной поэзии о Божьем творении. Местоимение мужского рода согласуется с русским словом «море» лишь по смыслу, поэтому грамматически употреблено «его» как форма винительного падежа среднего рода.
- source_word: וְיַבֶּשֶׁת
  choice: и сушу
  rationale: יַבֶּשֶׁת обозначает сушу в противопоставлении морю; русское «суша» точно и естественно передаёт этот контраст.
- source_word: יָדָיו
  choice: Его руки
  rationale: Сохранён образ рук Бога, прямо присутствующий в еврейской поэзии; он не заменён отвлечённым указанием на силу или действие.
- source_word: יָצָרוּ
  choice: образовали
  rationale: יצר передаёт намеренное придание формы. «Образовали» сохраняет отличие от עשה («сотворил») и согласуется с подлежащим во множественном числе «руки».
theological_decisions:
- issue: Антропоморфный образ Божьего действия
  choice: сохранить «Его руки образовали»
  alternative: «Он образовал» или «Его сила образовала»
  rationale: В еврейском тексте прямо названы Божьи руки. Сохранение поэтического образа не требует понимать его телесно и не сглаживает выразительность оригинала.
- issue: Различие между глаголами עשה и יצר
  choice: 'передать разными глаголами: «сотворил» и «образовали»'
  alternative: 'повторить один глагол: «создал… создали»'
  rationale: Разные русские глаголы сохраняют лексическое варьирование и поэтический параллелизм оригинала, не превращая это различие в отдельное богословское утверждение.
- issue: Связь между принадлежностью моря Богу и его сотворением
  choice: передать וְהוּא причинным «ведь Он»
  alternative: формальное «и Он»
  rationale: Контекст естественно представляет сотворение как основание принадлежности, однако формальная союзная связь отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены параллелизм, антропоморфный образ рук и различие двух глаголов творения; прописные местоимения о Боге использованы последовательно.
