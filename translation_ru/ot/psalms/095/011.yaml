  text: אֲשֶׁר נִשְׁבַּ֥עְתִּי בְ/אַפִּ֑/י אִם יְ֝בֹא֗וּ/ן אֶל מְנוּחָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/011.yaml
  text: so I swore in my anger[b][a], ‘They shall not enter my rest.’
translation:
  language: ru
  text: 'Поэтому Я поклялся в гневе Моём: «Не войдут они в Мой покой[b]».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «если войдут они в Мой покой» — формула клятвы со значением «не войдут они в Мой покой».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «место Моего покоя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: поэтому
  rationale: В данном контексте слово связывает клятву с предшествующим описанием непокорности народа и передаёт следствие; «поэтому» естественно выражает эту связь по-русски.
- source_word: נִשְׁבַּעְתִּי
  choice: Я поклялся
  rationale: Форма нифаля от שבע обычно означает «клясться, давать клятву»; «поклялся» — прямой и естественный русский эквивалент.
- source_word: בְאַפִּי
  choice: в гневе Моём
  rationale: אַף буквально связано с «носом», но в этой идиоме означает гнев. Формулировка сохраняет образ действия в состоянии гнева и соответствует возвышенному поэтическому регистру.
- source_word: אִם
  choice: не
  rationale: После глагола клятвы אִם вводит эллиптическую формулу клятвы, буквально «если войдут…», фактически выражающую решительное отрицание. В русском отрицание необходимо сделать явным.
- source_word: יְבֹאוּן אֶל
  choice: войдут в
  rationale: Сочетание בוא с אֶל обозначает вхождение или прибытие внутрь; «войдут в» точно и естественно передаёт движение к недоступному покою.
- source_word: מְנוּחָתִי
  choice: Мой покой
  rationale: מְנוּחָה может обозначать как состояние покоя, так и место покоя. «Мой покой» сохраняет краткость и смысловую открытость оригинала, не сужая значение до конкретного места.
theological_decisions:
- issue: Эллиптическая формула клятвы с אִם
  choice: 'Явное отрицание: «Не войдут они в Мой покой»'
  alternative: Буквальное «если войдут они в Мой покой»
  rationale: В древнееврейской формуле клятвы условная частица выражает решительное отрицание с подразумеваемым последствием нарушения клятвы. Явное «не» передаёт смысл формулы, не добавляя нового богословского содержания.
- issue: Значение מְנוּחָה
  choice: Мой покой
  alternative: Место Моего покоя
  rationale: Исходное слово допускает понимание и как состояния покоя, и как места пребывания. Выбранный вариант сохраняет эту неоднозначность и не предрешает её последующее богословское осмысление.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, псалмическим звучанием. Постпозиция «гневе Моём» и прописные местоимения в прямой речи поддерживают традиционную библейскую торжественность, оставаясь понятными современному читателю.
