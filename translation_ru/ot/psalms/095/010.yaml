base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/010.yaml
  text: For forty years I loathed that generation[a], and said, “They are a people who go astray in heart, and they have not known my ways.”
translation:
  language: ru
  text: 'Сорок лет Я питал отвращение к тому поколению[a] и сказал: «Это народ, заблуждающийся сердцем; они не познали Моих путей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я тяготился тем поколением»; возможно также: «Я скорбел о том поколении». Еврейский глагол может выражать отвращение, тягостное пресыщение или скорбь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַרְבָּעִים שָׁנָה
  choice: Сорок лет
  rationale: Начальная позиция сохраняет акцент еврейского текста на длительности происходившего; русский винительный времени естественно передаёт значение продолжительности без предлога.
- source_word: אָקוּט
  choice: Я питал отвращение
  rationale: Глагол קוט выражает сильное неприятие, отвращение или тягостное пресыщение. Эта формулировка сохраняет резкость контекста и при этом звучит естественно и достойно по-русски.
- source_word: בְּדוֹר
  choice: к тому поколению
  rationale: Предлог ב после глагола эмоционального отношения естественно передаётся русским «к»; указательное «тому» определяется контекстом и указывает на поколение пустыни.
- source_word: עַם תֹּעֵי לֵבָב הֵם
  choice: Это народ, заблуждающийся сердцем
  rationale: Причастная форма תֹּעֵי обозначает устойчивое или повторяющееся уклонение, а לֵבָב указывает на внутреннюю направленность человека. Сохранён еврейский образ без поясняющего истолкования.
- source_word: וְהֵם לֹא יָדְעוּ דְרָכָי
  choice: они не познали Моих путей
  rationale: ידע передано обычным «познать», а образ Божьих «путей» сохранён. Совершенный вид передаёт итоговую, установившуюся неспособность народа познать их.
- source_word: וָאֹמַר
  choice: и сказал
  rationale: Сохранена простая последовательность реакции и последующего высказывания без добавления причинного оттенка.
theological_decisions:
- issue: Отношение Бога, выраженное глаголом קוט
  choice: 'Сильное выражение неприятия: «Я питал отвращение»'
  alternative: 'Более мягкое: «Я скорбел о том поколении» или «Мне было тягостно то поколение»'
  rationale: Диапазон глагола включает отвращение, тягость и скорбное пресыщение. Основной текст сохраняет сильную степень Божьего неодобрения, а примечание сообщает о реальной лексической неоднозначности.
- issue: Значение לֹא יָדְעוּ דְרָכָי
  choice: 'Итоговый вердикт: «они не познали Моих путей»'
  alternative: 'Прошедшее несовершенного вида: «они не знали Моих путей»'
  rationale: Совершенный вид русского глагола естественно выражает состоявшийся отрицательный итог, не уточняя сверх текста, идёт ли речь прежде всего о понимании, признании или послушании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Заглавные буквы в местоимениях «Я», «Моих» обозначают говорящего Бога согласно принятой русской издательской практике. Синтаксис близок к еврейскому, но не буквалистичен; сохранены метафоры сердца и Божьих путей.
