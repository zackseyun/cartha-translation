  text: כִּ֤י אֵ֣ל גָּד֣וֹל יְהוָ֑ה וּ/מֶ֥לֶךְ גָּ֝ד֗וֹל עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/003.yaml
  text: For Yahweh is a great God[a], and a great King above all gods.
translation:
  language: ru
  text: Ибо Яхве — великий Бог и великий Царь над всеми богами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над всеми божественными существами». Еврейское אֱלֹהִים в зависимости от контекста может означать богов, божественных или небесных существ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего призыва к поклонению и естественно передаёт причинное значение.
- source_word: אֵל
  choice: Бог
  rationale: Здесь слово прямо называет Яхве Богом; прописная буква соответствует современному русскому употреблению в отношении Бога Израиля.
- source_word: גָּדוֹל
  choice: великий
  rationale: Передаёт величие и возвышенное положение; повтор сохранён в обеих параллельных частях стиха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וּמֶלֶךְ גָּדוֹל
  choice: и великий Царь
  rationale: Сохраняет второе определение Яхве и параллельный повтор прилагательного; «Царь» написано с прописной буквы как титул Бога.
- source_word: עַל
  choice: над
  rationale: В данном контексте выражает превосходство и верховенство.
- source_word: כָּל אֱלֹהִים
  choice: всеми богами
  rationale: Буквальный и контекстуально уместный перевод сохраняет полемическую силу и не решает заранее, обозначены ли здесь ложные боги, идолы или духовные существа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя; форма «Яхве» сохраняет его как имя Бога Израиля.
- issue: Значение אֱלֹהִים во фразе עַל כָּל אֱלֹהִים
  choice: над всеми богами
  alternative: над всеми божественными существами; над всеми небесными существами
  rationale: Вариант «богами» сохраняет лексическую широту, богословское напряжение и сравнительно-полемический характер исходного текста, не уточняя природу названных существ.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранены краткость, причинная связь и параллельный повтор «великий».
