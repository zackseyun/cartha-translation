  text: אֲשֶׁ֣ר בְּ֭/יָד/וֹ מֶחְקְרֵי אָ֑רֶץ וְ/תוֹעֲפ֖וֹת הָרִ֣ים לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/004.yaml
  text: in whose hand are the depths of the earth[b][a], and the heights of the mountains are his.
translation:
  language: ru
  text: В Его руке — глубины земли[a], и высоты гор — Его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровенные места земли».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «горные вершины принадлежат Ему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: В Его руке
  rationale: Еврейское сочетание продолжает относительное предложение предыдущего стиха и выражает обладание и власть через конкретный образ руки. В русском начало «В Его руке» естественно сохраняет этот образ и синтаксическую связь с контекстом.
- source_word: מֶחְקְרֵי אָרֶץ
  choice: глубины земли
  rationale: מֶחְקְרֵי обозначает труднодоступные, скрытые или глубоко лежащие места. «Глубины земли» естественно передают смысл и создают вертикальный контраст с высотами гор.
- source_word: וְתוֹעֲפוֹת הָרִים
  choice: и высоты гор
  rationale: תוֹעֲפוֹת здесь обозначает возвышенности или высочайшие части гор. «Высоты гор» сохраняют поэтическую параллель с «глубинами земли», не сужая значение до отдельных пиков.
- source_word: לוֹ
  choice: Его
  rationale: Краткая именная конструкция «— Его» передаёт лаконичное еврейское утверждение принадлежности и сохраняет поэтический ритм.
theological_decisions:
- issue: Масштаб Божьего владения в образах творения
  choice: Стих говорит о всеобъемлющей власти и владении Господа над земными глубинами и горными высотами.
  alternative: Локальное описание земли Израиля и её рельефа.
  rationale: Контраст между крайними глубинами и высотами имеет меризматический, всеохватный характер; контекст псалма также представляет Господа великим Царём над всем творением.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Тире подчёркивают параллелизм двух полустиший; конкретный образ руки сохранён без пояснительного расширения.
