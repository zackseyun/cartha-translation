  text: אַל תַּקְשׁ֣וּ לְ֭בַבְ/כֶם כִּ/מְרִיבָ֑ה כְּ/י֥וֹם מַ֝סָּ֗ה בַּ/מִּדְבָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/008.yaml
  text: Do not harden your hearts as at Meribah[d][c][b][a], as on the day at Massah in the wilderness.
translation:
  language: ru
  text: Не ожесточайте ваших сердец, как в Мериве[a], как в день Массы[b] в пустыне[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Мерива» означает «спор» или «распря».
    reason: lexical_alternative
  - marker: b
    text: «Масса» означает «испытание».
    reason: lexical_alternative
  - marker: c
    text: См. Исх. 17:7; Чис. 20:13 — о событиях в пустыне, на которые указывает этот стих.
    reason: cross_reference
lexical_decisions:
- source_word: אַל תַּקְשׁוּ
  choice: Не ожесточайте
  rationale: Отрицательная частица אַל с формой глагола выражает запрет; каузативная порода глагола קשׁה означает «делать жёстким, ожесточать». Русское «не ожесточайте» естественно сочетается со словом «сердца» и сохраняет образ оригинала.
- source_word: לְבַבְכֶם
  choice: ваших сердец
  rationale: 'В еврейском тексте существительное стоит в единственном числе с суффиксом 2-го лица множественного числа и имеет собирательный смысл. В обращении к группе людей современный русский естественно передаёт это множественным числом: «ваших сердец».'
- source_word: כִּמְרִיבָה
  choice: как в Мериве
  rationale: מְרִיבָה может означать «спор, распря», но здесь в паре с Массой и при упоминании пустыни выступает как название, отсылающее к известному событию. Предлог «в» естественен в русском при названии места и не устраняет игры со значением имени, пояснённой в сноске.
- source_word: כְּיוֹם מַסָּה
  choice: как в день Массы
  rationale: Сочетание буквально сопоставляет настоящее предостережение с «днём Массы». Родительный оборот точно и естественно передаёт примыкание слов в еврейском тексте, не добавляя отсутствующего в нём предлога места.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность. «В пустыне» — обычная и контекстуально точная русская передача в повествовании об исходе.
theological_decisions:
- issue: Передавать ли מְרִיבָה и מַסָּה как нарицательные слова или как исторические названия
  choice: Передать как названия «Мерива» и «Масса», пояснив их значения в сносках.
  alternative: «как при распре, как в день испытания в пустыне»
  rationale: Контекст указывает на конкретные события странствования по пустыне, названные этими именами в Исх. 17:7 и Чис. 20:13. Сохранение названий поддерживает межтекстовую связь, а сноски сохраняют значимую игру слов и не сводят текст только к одному уровню смысла.
translation_notes:
  register: Современный литературный русский с традиционными библейскими географическими именами. Формулировка сохраняет поэтический параллелизм двух сравнительных оборотов и остаётся понятной без конфессионально обусловленной интерпретации.
