  text: בֹּ֭אוּ נִשְׁתַּחֲוֶ֣ה וְ/נִכְרָ֑עָה נִ֝בְרְכָ֗ה לִֽ/פְנֵי יְהוָ֥ה עֹשֵֽׂ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/006.yaml
  text: Come[a], let us bow down in worship and kneel; let us bless[b] before Yahweh, our Maker.
translation:
  language: ru
  text: Придите, поклонимся и склонимся, преклоним колени пред Яхве, нашим Создателем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּאוּ
  choice: Придите
  rationale: Повелительная форма множественного числа служит призывом к собравшимся; «Придите» естественно сохраняет торжественный богослужебный тон.
- source_word: נִשְׁתַּחֲוֶה
  choice: поклонимся
  rationale: Глагол обозначает поклон, вплоть до простирания ниц, особенно перед Богом. В данном ряду телесных жестов «поклонимся» передаёт и действие, и смысл почитания.
- source_word: וְנִכְרָעָה
  choice: и склонимся
  rationale: Глагол выражает низкое склонение тела; этот перевод сохраняет отличие от последующего прямого упоминания коленопреклонения.
- source_word: נִבְרְכָה
  choice: преклоним колени
  rationale: Форма נִבְרְכָה в данном контексте — когортатив породы qal от ברך со значением «встать на колени», а не форма piel «благословлять». Перевод также соответствует последовательности телесных жестов поклонения.
- source_word: לִפְנֵי
  choice: пред
  rationale: Краткий и возвышенный русский эквивалент, выражающий нахождение в присутствии Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: עֹשֵׂנוּ
  choice: нашим Создателем
  rationale: Причастие с суффиксом первого лица множественного числа буквально означает «Тот, Кто создал/создаёт нас»; «наш Создатель» естественно и точно передаёт смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет это отличие от титула.
- issue: Значение נִבְרְכָה
  choice: преклоним колени
  alternative: благословим
  rationale: Вокализация и синтаксический контекст указывают на qal со значением коленопреклонения. Значение «благословлять» ожидало бы иной формы piel; поэтому консультационное английское «let us bless» здесь не принято.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным богослужебным звучанием. Тройная последовательность телесных жестов сохранена без искусственного устранения близких по смыслу глаголов.
