  text: לְ֭כוּ נְרַנְּנָ֣ה לַ/יהוָ֑ה נָ֝רִ֗יעָה לְ/צ֣וּר יִשְׁעֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/095/001.yaml
  text: Come[a], let us sing for joy to Yahweh; let us shout aloud to the Rock of our salvation.
translation:
  language: ru
  text: Придите, будем радостно петь в честь Яхве[a], громко воскликнем к Скале нашего спасения!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Яхве». Имя יהוה традиционно передаётся как «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: Придите
  rationale: Форма повелительного наклонения множественного числа от הלך здесь употреблена как призыв присоединиться к совместному поклонению; «Придите» естественно передаёт эту побудительную силу.
- source_word: נְרַנְּנָה
  choice: будем радостно петь
  rationale: Когортатив от רנן выражает ликующее голосовое прославление; перевод сохраняет и пение, и радость.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное Божье имя יהוה, а предлог ל отмечает адресата хвалы.
- source_word: נָרִיעָה
  choice: громко восклицать
  rationale: Когортатив от רוע/ריע обозначает громкий возглас, особенно в торжественном или богослужебном контексте; перевод не добавляет радость вторично, поскольку она уже выражена первым глаголом.
- source_word: לְצוּר
  choice: Скале
  rationale: צוּר сохранено как образное именование Бога, передающее прочность, защиту и надёжность; прописная буква показывает личное метафорическое наименование.
- source_word: יִשְׁעֵנוּ
  choice: нашего спасения
  rationale: Существительное יֵשַׁע с суффиксом первого лица множественного числа сохранено в именной форме, не сужая смысл до одного конкретного избавления.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст непосредственно содержит тетраграмматон; «Яхве» передаёт личное имя и отличает его от титула «Господь».
- issue: Метафора צוּר
  choice: Скала нашего спасения
  alternative: Тот, кто твёрдо спасает нас; наша защита
  rationale: 'Сохранение исходной метафоры не устраняет её богословскую многозначность: Бог представлен как надёжное основание, защита и источник спасения.'
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным богослужебным звучанием. Два еврейских когортатива переданы параллельными формами «будем…», а финальный восклицательный знак объединяет стих как энергичный призыв.
