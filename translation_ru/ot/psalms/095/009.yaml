lexical_decisions:
- source_word: אֲשֶׁר
  choice: где
  rationale: Относительная частица указывает на место, названное в предыдущем стихе, поэтому местное значение естественно связывает строки.
- source_word: נִסּוּנִי
  choice: испытывали Меня
  rationale: Глагол נסה означает «испытывать, подвергать испытанию»; выбранный вариант передаёт попытку поставить Бога на испытание.
- source_word: אֲבוֹתֵיכֶם
  choice: ваши отцы
  rationale: Буквально передаёт мужскую форму и сохраняет обращённую к народу риторику псалма.
- source_word: בְּחָנוּנִי
  choice: проверяли Меня
  rationale: Глагол בחן близок по смыслу к נסה, но «проверяли» сохраняет различие между двумя параллельными глаголами и передаёт смысл попытки удостовериться на опыте.
- source_word: גַּם
  choice: хотя и
  rationale: 'Обычное значение — «также, даже», однако контекст допускает и, вероятно, предполагает уступительный смысл: они испытывали Бога, несмотря на увиденное. Более буквальное прочтение сохранено в примечании.'
- source_word: רָאוּ
  choice: видели
  rationale: Простое прошедшее время естественно по-русски и не навязывает точной временной последовательности, не выраженной явно формой глагола.
- source_word: פָעֳלִי
  choice: Моё дело
  rationale: Сохраняет единственное число и широкое значение Божьего действия или совершённого Им дела.
theological_decisions:
- issue: Уступительное значение заключительной части
  choice: хотя и видели Моё дело
  alternative: и видели Моё дело; также видели Моё дело
  rationale: Уступительное прочтение лучше передаёт обличительный смысл контекста, но частица גם сама по себе допускает более буквальное соединительное значение, поэтому оно отмечено в сноске.
- issue: Передача אֲבוֹתֵיכֶם
  choice: ваши отцы
  alternative: ваши предки
  rationale: Форма оригинала грамматически мужская и обозначает праотцов обращённого сообщества; буквальная передача сохраняет риторику текста.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Параллельные глаголы переданы разными, но близкими словами; обращение к Богу обозначено традиционным прописным «Меня», а притяжательное местоимение — «Моё».
