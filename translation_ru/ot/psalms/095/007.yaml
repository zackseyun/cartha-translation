  choice: 'Условно-побудительное начало: «Сегодня, если вы услышите Его голос,—»'
  alternative: 'Желательное восклицание: «О, если бы вы сегодня услышали Его голос!»'
  rationale: Частица אִם обычно вводит условие, и такая передача естественно ведёт к повелению следующего стиха — не ожесточать сердца. Однако в поэтически-побудительном контексте она может выражать горячее пожелание, поэтому эта возможность сохранена в сноске.
