- source_word: הַיּוֹם
  choice: Сегодня
  rationale: Сохраняет риторически значимый временной акцент и переход к последующему предостережению.
- source_word: אִם
  choice: если
  rationale: Условное значение хорошо согласуется с продолжением мысли в следующем стихе; возможный желательный оттенок не устраняется, а отмечается в сноске.
- source_word: בְּקֹלוֹ תִשְׁמָעוּ
  choice: вы услышите Его голос
  rationale: Глагол שׁמע может обозначать слышание, внимательное слушание и послушание. «Услышите» сохраняет основное лексическое значение, оставляя подразумеваемый призыв к послушанию контексту.
theological_decisions:
