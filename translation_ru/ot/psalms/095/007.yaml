- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего призыва к поклонению; «ибо» естественно передаёт объяснительно-причинную связь и соответствует торжественному поэтическому регистру.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
