  text: Если я вспоминаю Тебя на своей постели, я размышляю о Тебе в ночные стражи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Когда
  rationale: Хотя союз может означать «если», здесь он вводит повторяющееся обстоятельство времени; «когда» естественно передаёт смысл в данном поэтическом контексте.
- source_word: יְצוּעָי
  choice: на своей постели
  rationale: Передаёт конкретный образ ложа или постели и притяжательный суффикс первого лица без ненужной архаизации.
- source_word: בְּאַשְׁמֻרוֹת
  choice: в ночные стражи
  rationale: Сохраняет древнее деление ночи на периоды стражи; слово «ночные» уточняет подразумеваемое контекстом время.
- source_word: אֶהְגֶּה
  choice: я размышляю
  rationale: Глагол обозначает сосредоточенное обдумывание или тихое раздумье; выбранное слово естественно по-русски и сохраняет созерцательный смысл.
theological_decisions:
- issue: Условное или временное значение אִם
  choice: Когда я вспоминаю
  alternative: Если я вспоминаю
  rationale: Форма допускает буквальное условное прочтение, однако в поэтической речи אִם может обозначать время повторяющегося действия. Контекст ночного размышления поддерживает временное прочтение, не подразумевающее сомнения в том, вспоминает ли псалмопевец Бога.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства поэтической молитвы. Выражение «ночные стражи» оставлено как понятный библейский образ; местоимение, относящееся к Богу, написано с прописной буквы в соответствии с русской традицией благоговейного обращения.
