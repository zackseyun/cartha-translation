source:
  edition: WLC
  text: כִּֽי הָיִ֣יתָ עֶזְרָ֣תָ/ה לִּ֑/י וּ/בְ/צֵ֖ל כְּנָפֶ֣י/ךָ אֲרַנֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/007.yaml
  text: For you have been my help[a], and in the shadow of your wings I sing for joy.
translation:
  language: ru
  text: Ибо Ты был мне помощью, и в тени Твоих крыльев я радостно пою[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я восклицаю от радости». Еврейский глагол может обозначать как радостное пение, так и звонкий возглас ликования.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит причину сказанного в ближайшем контексте; «ибо» ясно передаёт причинную связь и соответствует возвышенному поэтическому регистру.
- source_word: הָיִיתָ
  choice: Ты был
  rationale: Форма qatal указывает на уже испытанную псалмопевцем помощь Бога. Русское прошедшее время сохраняет это значение, а контекст позволяет видеть его актуальность для настоящего.
- source_word: עֶזְרָתָה לִּי
  choice: мне помощью
  rationale: Так передаётся личная направленность помощи, выраженная сочетанием существительного с לִי, без добавления отсутствующего в тексте уточнения.
- source_word: וּבְצֵל
  choice: и в тени
  rationale: Предлог ב естественно передан как «в», а «тень» сохраняет конкретный библейский образ укрытия и защиты.
- source_word: כְּנָפֶיךָ
  choice: Твоих крыльев
  rationale: Буквальный образ Божьих крыльев ясен по-русски и сохраняет поэтическую метафору исходного текста.
- source_word: אֲרַנֵּן
  choice: я радостно пою
  rationale: Piel глагола רנן обозначает звучное выражение радости — пение или радостный возглас. Основной вариант естественно соединяет голосовое действие и радость, а альтернативный оттенок отмечен в сноске.
theological_decisions:
- issue: Метафора Божьей защиты
  choice: Сохранить буквально образ «в тени Твоих крыльев».
  alternative: 'Передать толкованием: «под Твоей защитой».'
  rationale: Конкретный образ укрытия под крыльями несёт как богословский, так и поэтический смысл; его не следует заменять более узким объяснением.
- issue: Временной оттенок Божьей помощи
  choice: «Ты был мне помощью».
  alternative: «Ты остаёшься моей помощью».
  rationale: Перевод сохраняет прошедшую форму еврейского qatal и не превращает подразумеваемую актуальность прежней помощи в прямо высказанное утверждение о настоящем.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией; синтаксис остаётся простым и понятным.
