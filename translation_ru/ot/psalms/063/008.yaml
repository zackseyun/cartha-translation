  text: דָּבְקָ֣ה נַפְשִׁ֣/י אַחֲרֶ֑י/ךָ בִּ֝֗/י תָּמְכָ֥ה יְמִינֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/008.yaml
  text: My soul clings to you[b][a]; your right hand upholds me.
translation:
  language: ru
  text: Душа моя льнёт к Тебе[a]; Твоя правая рука поддерживает меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «льнёт вслед за Тобой»; выражение может передавать как тесную привязанность, так и неотступное следование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּבְקָה
  choice: льнёт
  rationale: Глагол דבק обозначает тесное прилепление, неотступную привязанность. «Льнёт» естественно передаёт это в возвышенной поэтической речи и допускает значение продолжающегося состояния, выраженного еврейским перфектом.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נפשׁ может означать душу, жизнь, самого человека. В молитвенно-поэтическом контексте «душа моя» сохраняет личную и духовную насыщенность образа, не превращая его в техническое антропологическое утверждение.
- source_word: אַחֲרֶיךָ
  choice: к Тебе
  rationale: Буквально אַחֲרֵי означает «за, вслед за». При דבק сочетание описывает тесную привязанность или неотступное следование; русское «льнёт к Тебе» передаёт основной смысл естественно, а буквальный образ отмечен в сноске.
- source_word: בִּי
  choice: меня
  rationale: 'Предлог ב с местоименным суффиксом здесь образует дополнение при תמך; естественное русское управление требует винительного падежа: «поддерживает меня».'
- source_word: תָּמְכָה
  choice: поддерживает
  rationale: תמך означает поддерживать, удерживать, служить опорой. Настоящее время передаёт состояние продолжающейся Божьей поддержки, подразумеваемое поэтическим контекстом.
- source_word: יְמִינֶךָ
  choice: Твоя правая рука
  rationale: Сохранён конкретный библейский образ правой руки как силы и деятельной поддержки без замены его абстрактными словами «мощь» или «сила».
theological_decisions:
- issue: Антропологическая многозначность נַפְשִׁי
  choice: душа моя
  alternative: я; моя жизнь; всё моё существо
  rationale: Формулировка сохраняет духовную и личную глубину псалма, но сама по себе не навязывает определённого учения о составе человека.
- issue: Образ правой руки Бога
  choice: Твоя правая рука
  alternative: Твоя сила; Твоя мощь
  rationale: Антропоморфный образ оригинала сохранён, а не истолкован абстрактно.
- issue: Связь דבק с אַחֲרֵי
  choice: льнёт к Тебе
  alternative: неотступно следует за Тобой; льнёт вслед за Тобой
  rationale: Основной текст остаётся естественным по-русски, тогда как сноска сохраняет подлинную неоднозначность между привязанностью и неотступным следованием.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой молитвы. «Льнёт» слегка возвышенно, но понятно и уместно в поэзии. Местоимения, относящиеся к Богу, даны с прописной буквы по принятой русской религиозно-литературной норме.
