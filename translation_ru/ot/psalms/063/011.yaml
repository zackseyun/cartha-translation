  text: וְ/הַ/מֶּלֶךְ֮ יִשְׂמַ֪ח בֵּ/אלֹ֫הִ֥ים יִ֭תְהַלֵּל כָּל הַ/נִּשְׁבָּ֣ע בּ֑/וֹ כִּ֥י יִ֝סָּכֵ֗ר פִּ֣י דֽוֹבְרֵי שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/011.yaml
  text: But the king will rejoice in God[a]; everyone who swears by him will boast[c][b], for the mouths of those who speak lies will be shut.
translation:
  language: ru
  text: Но царь возрадуется в Боге; всякий, кто клянётся им[a], будет хвалиться[b], потому что уста говорящих ложь будут закрыты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Местоимение, вероятнее всего, относится к Богу: «кто клянётся Богом». Грамматически возможно также отнесение к царю.'
    reason: referential_ambiguity
  - marker: b
    text: 'Или: «будет славиться» или «будет гордиться». Еврейский глагол передаёт хваление собой, славу или торжество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמֶּלֶךְ
  choice: Но царь
  rationale: Союз וְ допускает простое «и», однако после описанной в предыдущем стихе участи врагов здесь выражен контраст; «но» естественно передаёт ход мысли.
- source_word: יִשְׂמַח בֵּאלֹהִים
  choice: возрадуется в Боге
  rationale: Глагол שׂמח обозначает радость, а ב указывает на её объект или основание. Формулировка сохраняет образ оригинала и остаётся понятной в возвышенном литературном регистре.
- source_word: כָּל הַנִּשְׁבָּע בּוֹ
  choice: всякий, кто клянётся им
  rationale: 'Причастный оборот имеет распределительное значение: речь идёт о каждом, кто приносит клятву, призывая его как свидетеля. Местоимение оставлено без подстановки существительного.'
- source_word: יִתְהַלֵּל
  choice: будет хвалиться
  rationale: Форма хитпаэль от הלל здесь означает «хвалиться, славиться». «Будет хвалиться» прямо передаёт значение, хотя в контексте это не обязательно подразумевает самодовольное хвастовство.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для предшествующего утверждения о радости и похвале.
- source_word: יִסָּכֵר פִּי דֹבְרֵי שָׁקֶר
  choice: уста говорящих ложь будут закрыты
  rationale: Сохранён образ закрытых уст. Русское множественное «уста» естественно передаёт еврейское собирательное единственное «рот» при обозначении множества говорящих.
theological_decisions:
- issue: Кого обозначает «царь»
  choice: Сохранено простое обозначение «царь» без уточнения личности.
  alternative: Давид; мессианский Царь.
  rationale: Сам стих не называет царя по имени и не вводит явного мессианского титула, поэтому перевод не конкретизирует референта.
- issue: К кому относится местоимение в выражении «клянётся им»
  choice: В основном тексте сохранено местоимение; наиболее вероятный референт — Бог.
  alternative: Местоимение относится к царю.
  rationale: Бог — ближайший явно названный референт, а клятва Богом соответствует обычному библейскому словоупотреблению. Однако форма местоимения сама по себе не называет референта, поэтому неоднозначность отмечена в сноске и не устранена подстановкой.
- issue: Характер похвалы в יִתְהַלֵּל
  choice: «будет хвалиться» без уточнения предмета похвалы.
  alternative: «будет славиться»; «будет торжествовать».
  rationale: Еврейский глагол допускает оттенки хвалы, славы и ликования. Перевод сохраняет его прямое значение и не добавляет отсутствующий в стихе объект похвалы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. «Возрадуется» и «уста» сохраняют достоинство и образность оригинала, не делая текст чрезмерно архаичным. Строчная форма местоимения «им» намеренно не устраняет референциальную неоднозначность.
