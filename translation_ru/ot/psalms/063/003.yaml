  text: For your steadfast love is better than life[a]; my lips will praise you.
translation:
  language: ru
  text: Ибо Твоя верная любовь лучше жизни[a]; мои уста будут восхвалять Тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неизменная любовь», «милость» или «любовь завета». Еврейское חֶסֶד означает верную, постоянную любовь, часто проявляемую в отношениях завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание последующего восхваления; «ибо» ясно сохраняет причинную связь и соответствует возвышенному поэтическому регистру.
- source_word: טוֹב ... מֵחַיִּים
  choice: лучше жизни
  rationale: Прилагательное טוֹב с предлогом сравнения מִן имеет сравнительное значение. Морфологически множественное חַיִּים здесь идиоматически обозначает жизнь.
- source_word: חַסְדְּךָ
  choice: Твоя верная любовь
  rationale: חֶסֶד обозначает деятельную, неизменную верность и любовь, нередко в рамках отношений завета. «Верная любовь» естественно по-русски передаёт оба смысловых компонента, не сужая значение до одной лишь милости.
- source_word: שְׂפָתַי
  choice: мои уста
  rationale: Сохранён конкретный телесный образ оригинала; «уста» уместны в современной возвышенной поэзии и естественнее в псалме, чем буквальное «губы».
- source_word: יְשַׁבְּחוּנְךָ
  choice: будут восхвалять Тебя
  rationale: Порода piel глагола שׁבח выражает хвалу или прославление; форма допускает будущее высказывание с оттенком решимости.
theological_decisions:
- issue: Передача חֶסֶד в контексте поклонения
  choice: верная любовь
  alternative: неизменная любовь; милость; любовь завета
  rationale: Выбор сохраняет сочетание любви и надёжной верности, не вводя в основной текст более узкое толкование «любовь завета» и не сводя понятие к милости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции; синтаксический параллелизм и образ «уст» сохранены.
