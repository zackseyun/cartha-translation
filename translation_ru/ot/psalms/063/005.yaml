lexical_decisions:
- source_word: כְּמוֹ
  choice: как
  rationale: Вводит сравнение; в русском оборот «как… пищей» естественно передаёт образ насыщения.
- source_word: חֵלֶב וָדֶשֶׁן
  choice: жирной и сытной пищей
  rationale: חֵלֶב буквально означает «жир», а דֶּשֶׁן — «тучность, изобилие». В данном пищевом образе сочетание обозначает отборную, обильную пищу; перевод сохраняет конкретность образа и звучит естественно по-русски.
- source_word: תִּשְׂבַּע
  choice: насыщается
  rationale: Имперфект в поэзии допускает настоящее, повторяющееся или будущее действие. Настоящее время хорошо соответствует переживаемому псалмопевцем удовлетворению; возможность будущего сохранена в сноске.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נֶפֶשׁ может означать душу, жизнь или самого человека. Здесь традиционное и естественное «душа моя» согласуется с контекстом стремления к Богу и внутреннего насыщения.
- source_word: שִׂפְתֵי רְנָנוֹת
  choice: уста мои с ликованием
  rationale: Буквально это «уста ликований» или «уста радостных возгласов». Русская формулировка передаёт звучащую радостную хвалу без неестественной кальки.
- source_word: יְהַלֶּל פִּי
  choice: уста мои … восхваляют
  rationale: Буквально подлежащее — «мой рот». Слово «уста» в русском поэтическом регистре естественно обозначает орган речи и позволяет избежать грубоватого «рот», сохраняя телесный образ хвалы.
theological_decisions:
- issue: Неявный объект хвалы
  choice: восхваляют Тебя
  alternative: восхваляют
  rationale: В еврейском тексте объект прямо не выражен, но весь псалом обращён к Богу. Местоимение «Тебя» делает русскую фразу полной, не добавляя нового богословского содержания.
- issue: Видо-временное значение поэтических имперфектов
  choice: 'настоящее время: «насыщается», «восхваляют»'
  alternative: 'будущее время: «насытится», «будут восхвалять»'
  rationale: Еврейский имперфект допускает настоящее, привычное и будущее значение. Основной текст передаёт живое настоящее переживание, а реальная временная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным псалмопевческим звучанием. Слово «уста» уместно в поэзии хвалы; архаичное «тук» заменено прозрачным пищевым образом. Добавлен коррелятив «так» для естественного русского синтаксиса сравнения.
