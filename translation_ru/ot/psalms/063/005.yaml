  yaml_path: translation/ot/psalms/063/005.yaml
  text: My soul is satisfied as with fat and richness[b][a], and my mouth praises you with lips of joyful songs.
translation:
  language: ru
  text: Как от жирной и обильной пищи насыщается душа моя[a], так уста мои с ликованием восхваляют Тебя[b].
  philosophy: optimal-equivalence
  footnotes:
