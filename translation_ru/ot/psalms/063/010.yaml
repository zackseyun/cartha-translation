  text: Их предадут во власть меча[a]; они станут добычей лисиц[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст допускает более буквальный перевод: «Его прольют во власть меча». В первом полустишии стоит «его», тогда как во втором — «они», что создаёт грамматическую трудность.'
    reason: textual_grammatical_ambiguity
  - marker: b
    text: 'Или: «шакалов». Еврейское слово שֻׁעָלִים обычно означает лисиц, но здесь его иногда понимают как обозначение шакалов или близких диких псовых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַגִּירֻהוּ
  choice: их предадут
  rationale: Форма буквально содержит местоименный суффикс 3-го лица единственного числа («его») при глаголе от נגר, который в данной породе может передавать образ излияния. Однако контекст говорит о многих противниках, а следующая часть прямо употребляет множественное число. Пассивно-неопределённая формулировка естественно передаёт предполагаемый смысл, не создавая впечатления, будто противники сами совершают казнь; буквальная трудность сохранена в примечании.
- source_word: עַל יְדֵי חָרֶב
  choice: во власть меча
  rationale: Оборот обозначает власть или действенную силу меча, а не буквальные «руки». Выражение «во власть меча» понятно и сохраняет олицетворённый поэтический образ.
- source_word: מְנָת
  choice: добычей
  rationale: Существительное означает долю или удел. В сочетании с хищными животными русское «станут добычей» естественно выражает, что тела погибших достанутся им как доля.
- source_word: שֻׁעָלִים
  choice: лисиц
  rationale: Обычное значение слова — «лисицы», хотя в контексте смерти и запустения возможен более широкий представитель псовых, в частности шакалы; альтернатива отмечена в сноске.
- source_word: יִהְיוּ
  choice: станут
  rationale: Глагол היה здесь обозначает наступившее в результате гибели состояние, поэтому «станут» точнее простого «будут».
theological_decisions:
- issue: Смена числа между יַגִּירֻהוּ («его») и יִהְיוּ («они»)
  choice: 'В основном тексте оба полустишия отнесены к множеству врагов: «Их… они…»'
  alternative: «Его прольют силой меча; они станут долей лисиц»
  rationale: Контекст предыдущего стиха и множественное число во втором полустишии указывают на гибель противников. При этом необычная грамматика еврейского текста не замалчивается, а вынесена в примечание без догматического разрешения.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. «Во власть меча» сохраняет возвышенный библейский образ, а «станут добычей» звучит естественно и ясно для современного читателя.
