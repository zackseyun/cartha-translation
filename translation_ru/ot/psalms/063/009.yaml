  text: וְ/הֵ֗מָּה לְ֭/שׁוֹאָה יְבַקְשׁ֣וּ נַפְשִׁ֑/י יָ֝בֹ֗אוּ בְּֽ/תַחְתִּיּ֥וֹת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/009.yaml
  text: But they[a], who seek my life, to destroy it[b], will go into the depths of the earth.
translation:
  language: ru
  text: А те, кто ищет моей гибели, сойдут в глубины земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «в нижние области земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: А те
  rationale: Местоимение имеет эмфатический характер, а союз в контексте передаёт противопоставление уверенности псалмопевца в предыдущем стихе.
- source_word: לְשׁוֹאָה
  choice: гибели
  rationale: שׁוֹאָה обозначает гибель, разорение или уничтожение; в сочетании с поиском жизни говорящего естественно выражает намерение погубить его.
- source_word: יְבַקְשׁוּ נַפְשִׁי
  choice: кто ищет моей гибели
  rationale: נֶפֶשׁ здесь означает жизнь самого псалмопевца, а не отвлечённую «душу». Русская формулировка естественно передаёт враждебное преследование, объединяя смысл конструкции с לְשׁוֹאָה.
- source_word: יָבֹאוּ
  choice: сойдут
  rationale: Буквально глагол означает «придут», однако при направленности в нижние области земли русское «сойдут» естественно сохраняет образ движения вниз.
- source_word: בְּתַחְתִּיּוֹת הָאָרֶץ
  choice: в глубины земли
  rationale: Фраза обозначает нижние или глубокие области земли; выбранный вариант сохраняет поэтический образ смерти и суда, не превращая его в специальный термин учения о загробном мире.
theological_decisions:
- issue: Смысл нисхождения в «глубины земли»
  choice: Сохранён поэтический образ нисхождения к смерти, в могилу или под суд
  alternative: Буквальные «нижние области земли» либо прямое обозначение преисподней/шеола
  rationale: Древнееврейская фраза допускает пространственный образ и связь с областью мёртвых; основной текст не устраняет эту многозначность и не вводит более разработанную доктрину загробного мира.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью псалма. Оборот «ищет моей гибели» естественен и достоин по регистру; образ «глубин земли» сохранён без конфессионального уточнения.
