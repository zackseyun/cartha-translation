  text: כֵּ֭ן בַּ/קֹּ֣דֶשׁ חֲזִיתִ֑י/ךָ לִ/רְא֥וֹת עֻ֝זְּ/ךָ֗ וּ/כְבוֹדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/002.yaml
  text: So I have looked upon you in the sanctuary[a], to see your power and your glory.
translation:
  language: ru
  text: Так я созерцал Тебя во святилище[a], чтобы увидеть силу Твою и славу Твою.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так, в святом месте, я созерцал Тебя».'
    reason: 'Лексическая и синтаксическая альтернатива: בַּקֹּדֶשׁ можно передать как «в святом месте», а כֵּן — теснее связать с последующей фразой.'
lexical_decisions:
- source_word: כֵּן
  choice: Так
  rationale: 'Наречие связывает этот стих с выраженной ранее жаждой Бога и сохраняет естественную для еврейского текста неопределённость оттенка: «так», «таким образом».'
- source_word: בַּקֹּדֶשׁ
  choice: во святилище
  rationale: В контексте богослужения קֹדֶשׁ с предлогом естественнее всего обозначает святое место, то есть святилище, хотя формально возможно и более буквальное «в святом месте».
- source_word: חֲזִיתִיךָ
  choice: я созерцал Тебя
  rationale: חזה означает не только зрительное восприятие, но и сосредоточенное, воспринимающее видение. «Созерцал» передаёт этот оттенок и отличает глагол от следующего ראה.
- source_word: לִרְאוֹת
  choice: чтобы увидеть
  rationale: Инфинитив с ל естественно выражает цель; совершенный вид «увидеть» звучит по-русски естественно и сохраняет прямоту образа.
- source_word: עֻזְּךָ
  choice: силу Твою
  rationale: עֹז означает силу, мощь или могущество; «сила» — ясный и прямой русский эквивалент.
- source_word: וּכְבוֹדֶךָ
  choice: и славу Твою
  rationale: כָּבוֹד применительно к Богу традиционно и точно передаётся словом «слава», выражающим Его явленное величие.
theological_decisions:
- issue: Характер видения Бога во святилище
  choice: Сохранено прямое поэтическое выражение «созерцал Тебя», за которым следует «увидеть силу Твою и славу Твою».
  alternative: Понимать сказанное либо как воспоминание о богослужении, либо как мистическое видение Бога.
  rationale: Еврейский текст не объясняет природу этого видения. Перевод не сводит его ни к буквальному видению Божьей сущности, ни только к внутреннему религиозному переживанию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической лексикой. Местоимения, относящиеся к Богу, написаны с прописной буквы; синтаксис остаётся ясным для обычного читателя.
