  verdict: approve
  source_fidelity: 'Текст точно передаёт основные элементы еврейского стиха: כֵּן — «Так», אֲבָרֶכְךָ — «буду благословлять Тебя», בְחַיָּי — «всю мою жизнь», בְּשִׁמְךָ — «во имя Твоё», אֶשָּׂא כַפָּי — «вознесу руки мои». Будущее значение и параллелизм строк сохранены. Оборот «во имя Твоё» допустимо передаёт многозначное בְּשִׁמְךָ, не сужая его до одного толкования.'
