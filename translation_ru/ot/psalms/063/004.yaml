  terminology: «Благословлять Тебя» сохраняет лексику ברך и оправданно оставлено в основном тексте, хотя для современного читателя возможно также «прославлять» или «хвалить». Сноска корректно предлагает этот смысловой вариант. Личное местоимение «Тебя» и притяжательное «Твоё» последовательно оформлены в принятом для религиозного русского текста регистре.
