  text: כֵּ֣ן אֲבָרֶכְ/ךָ֣ בְ/חַיָּ֑/י בְּ֝/שִׁמְ/ךָ אֶשָּׂ֥א כַפָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/004.yaml
  text: So I will bless you as long as I live[a]; in your name I will lift up my hands.
translation:
  language: ru
  text: Так буду благословлять Тебя всю мою жизнь[a]; во имя Твоё вознесу руки мои.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прославлять Тебя». Буквально по-еврейски: «благословлять Тебя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Так
  rationale: Наречие связывает обет поклонения с предыдущим утверждением о Божьей милости и естественно передаёт следственно-результативный смысл.
- source_word: אֲבָרֶכְךָ
  choice: буду благословлять Тебя
  rationale: Форма piel глагола ברך буквально означает «благословлять». При обращении к Богу это выражение может подразумевать хвалу, однако основной текст сохраняет исходный образ.
- source_word: בְחַיָּי
  choice: всю мою жизнь
  rationale: Буквально «в моей жизни»; в контексте оборот имеет длительное значение — на протяжении всей жизни псалмопевца.
- source_word: בְּשִׁמְךָ
  choice: во имя Твоё
  rationale: Предлог ב допускает оттенки сферы, основания или призывания. Русский оборот «во имя Твоё» естественно сохраняет связь действия с открытым Божьим именем, не устраняя эту смысловую широту.
- source_word: אֶשָּׂא
  choice: вознесу
  rationale: Глагол נשא означает «поднимать, возносить»; здесь он описывает жест молитвы или хвалы.
- source_word: כַפָּי
  choice: руки мои
  rationale: כף буквально может обозначать ладонь, но в данном устойчивом жесте современный русский естественно употребляет слово «руки».
theological_decisions:
- issue: Значение ברך в речи, обращённой к Богу
  choice: Сохранить в основном тексте «благословлять»
  alternative: «прославлять» или «хвалить»
  rationale: Еврейский текст употребляет именно ברך. В обращении к Богу глагол означает благоговейное восхваление, но более буквальный вариант сохраняет исходную лексику и богословское напряжение; поясняющий вариант дан в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической инверсией во второй строке. Заглавные буквы в местоимениях, относящихся к Богу, выдержаны последовательно. Формулировка сохраняет лаконизм и параллелизм еврейского стиха.
