base_translation:
  language: en
  yaml_path: translation/ot/psalms/063/001.yaml
  text: God[a], you are my God; I seek you at dawn. My soul thirsts for you, my flesh longs for you[b], in a dry and weary land without water.
translation:
  language: ru
  text: Боже, Ты — мой Бог; Тебя ищу на рассвете.[a] Душа моя жаждет Тебя, плоть моя томится по Тебе — в земле сухой и изнурённой, где нет воды.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тебя ищу с раннего утра», «усердно ищу Тебя» или, более толковательно, «ревностно ищу Тебя». Еврейский глагол буквально вызывает образ поисков на рассвете.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, при ином синтаксическом членении: «Душа моя жаждет Тебя; плоть моя томится по Тебе в земле сухой и изнурённой, где нет воды».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма обращения естественно передаёт прямую речь к Богу; русский звательный оттенок выражается формой «Боже» без добавления междометия «о».
- source_word: אֵלִי אַתָּה
  choice: Ты — мой Бог
  rationale: Сохраняет эмфатическое самостоятельное местоимение и именную конструкцию с подразумеваемой связкой.
- source_word: אֲשַׁחֲרֶךָּ
  choice: Тебя ищу на рассвете
  rationale: Передаёт основной образ глагола שׁחר в пиэле — искать с раннего утра, на заре, — не сводя его к более толковательному «усердно».
- source_word: צָמְאָה לְךָ נַפְשִׁי
  choice: Душа моя жаждет Тебя
  rationale: Сохраняет метафору жажды и поэтическое נפשׁ в параллели с «плотью».
- source_word: כָּמַהּ לְךָ בְשָׂרִי
  choice: плоть моя томится по Тебе
  rationale: «Томится» выражает сильное, мучительное стремление; «плоть» сохраняет телесную сторону параллели, не превращая её в абстрактное «всё существо».
- source_word: בְּאֶרֶץ צִיָּה וְעָיֵף
  choice: в земле сухой и изнурённой
  rationale: «Сухой» передаёт צִיָּה, а «изнурённой» сохраняет поэтическое приложение עָיֵף к земле и образ истощения зноем.
- source_word: בְּלִי מָיִם
  choice: где нет воды
  rationale: Естественное современное русское выражение, точно передающее отсутствие воды.
theological_decisions:
- issue: Антропологическая пара נפשׁ / בשר
  choice: «душа моя» и «плоть моя»
  alternative: «всё моё существо» и «тело моё»
  rationale: Сохранена намеренная поэтическая пара внутреннего и телесного измерений человека без утверждения жёсткого философского дуализма.
- issue: Объём обстоятельства «в земле сухой…»
  choice: Пунктуационно связать его со всем двойным выражением жажды и томления
  alternative: Отнести его только к словам о плоти
  rationale: Еврейский порядок допускает ближайшую связь со второй строкой, но поэтический смысл естественно охватывает всё предшествующее описание стремления к Богу; примечание сохраняет возможное более узкое прочтение.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Инверсия «Душа моя… плоть моя…» сохраняет параллелизм и остаётся понятной; прописное «Ты/Тебя» использовано как традиционная русская форма почтительного обращения к Богу.
