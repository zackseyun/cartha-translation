lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Техническое обозначение жанра в надписании; традиционное и точное русское соответствие.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русская родительная конструкция естественна для заголовка и, подобно еврейской конструкции с לְ, не сводит связь с Давидом исключительно к авторству.
- source_word: בִּהְיוֹתוֹ
  choice: когда он был
  rationale: Естественно передаёт временное значение конструкции с инфинитивом היה и местоименным суффиксом.
- source_word: בְּמִדְבַּר
  choice: в … пустыне
  rationale: מִדְבָּר обозначает пустынную, дикую или степную местность; «пустыня» здесь является естественным русским географическим обозначением.
- source_word: יְהוּדָה
  choice: Иудейской
  rationale: В сочетании с названием местности естественная русская форма — «Иудейская пустыня», соответствующая пустынной области Иудеи.
theological_decisions:
- issue: Значение надписания לְדָוִד
  choice: Сохранена неоднозначная формулировка «Псалом Давида».
  alternative: «Псалом, написанный Давидом» или «Псалом для Давида».
  rationale: Предлог לְ в надписаниях псалмов может выражать авторство, принадлежность, посвящение или более широкую связь; исходный текст не требует выбрать только одно значение.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная форма надписания. Традиционное географическое название «Иудейская пустыня» сохраняет узнаваемость, а примечания передают лексическую и синтаксическую неоднозначность оригинала.
