  text: There I will cause a horn to sprout for David[b][a]; I have prepared a lamp for my anointed one.
translation:
  language: ru
  text: Там Я взращу рог Давиду[a]; Я приготовил светильник для Моего помазанника[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дам вырасти рогу для Давида». «Рог» в древнееврейской образности означает силу или царскую власть.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для Моего Мессии». Еврейский текст буквально говорит «для Моего помазанника»; прежде всего здесь имеется в виду царь из дома Давида, но возможен и более широкий мессианский смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Там
  rationale: Наречие указывает на Сион, упомянутый в ближайшем контексте, и сохраняет пространственный акцент еврейского текста.
- source_word: אַצְמִיחַ
  choice: взращу
  rationale: Каузативная форма глагола צמח означает «дать вырасти, взрастить». «Взращу» естественно передаёт действие Бога и сохраняет образ роста, не заменяя его толкованием «воздвигну».
- source_word: קֶרֶן
  choice: рог
  rationale: Сохранён конкретный древнееврейский образ рога как символа силы и царской власти; его переносное значение поясняется в сноске.
- source_word: לְדָוִד
  choice: Давиду
  rationale: Дательный падеж естественно передаёт ל со значением отношения или предназначения и не добавляет отсутствующего в тексте уточнения «роду Давида».
- source_word: עָרַכְתִּי
  choice: Я приготовил
  rationale: Перфект глагола ערך здесь обозначает приготовление или устроение; этот вариант естественно сочетается со словом «светильник».
- source_word: נֵר
  choice: светильник
  rationale: Слово נֵר обозначает светильник, а не отвлечённый «свет». Конкретный образ сохранён, чтобы не сводить его заранее к династической преемственности или продолжению царской власти.
- source_word: לִמְשִׁיחִי
  choice: для Моего помазанника
  rationale: Буквально выражение означает «для Моего помазанника». В ближайшем контексте речь прежде всего о царе из дома Давида; перевод сохраняет и возможность более широкого мессианского прочтения.
theological_decisions:
- issue: Передача מְשִׁיחִי в контексте обетования Давиду
  choice: Моего помазанника
  alternative: Моего Мессии
  rationale: Нарицательное «помазанник» непосредственно передаёт смысл еврейского слова и в данном псалме прежде всего относится к царю из династии Давида. Вариант «Мессия» возможен в более широком мессианском прочтении, но в основном тексте он мог бы преждевременно превратить слово в закреплённый титул.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Конкретные образы «рог» и «светильник» сохранены, а необычный для современного читателя образ рога пояснён в сноске. Местоимения, относящиеся к Богу, оформлены с прописной буквы в соответствии с принятой русской библейской традицией.
