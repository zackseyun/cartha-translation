  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר
  choice: который
  rationale: Относительное местоимение связывает придаточное предложение с Давидом, упомянутым в предыдущем стихе.
- source_word: נִשְׁבַּע
  choice: поклялся
  rationale: Форма нифаль глагола שׁבע означает «поклясться, принести клятву»; краткий русский глагол передаёт торжественный характер действия.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает, кому принесена клятва, а тетраграмматон передан как личное имя «Яхве».
- source_word: נָדַר
  choice: дал обет
  rationale: Глагол נדר означает принести или дать обет. Выражение «дал обет» естественно в современном русском языке и сохраняет параллелизм с «поклялся».
- source_word: לַאֲבִיר יַעֲקֹב
  choice: Могучему Иакова
  rationale: אֲבִיר — возвышенный титул со значением «Могучий, Сильный». Формулировка сохраняет краткость и структуру еврейского титула, не добавляя отсутствующее в тексте слово «Бог».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо употреблено личное имя יְהוָה; транслитерация «Яхве» отличает его от титула «Господь» и не скрывает за традиционной заменой.
- issue: Передача титула אֲבִיר יַעֲקֹב
  choice: Могучий Иакова
  alternative: Сильный Иакова; Могучий Бог Иакова
  rationale: Выбранный вариант сохраняет божественный титул и его лаконичность. Слово «Бог» не добавлено, поскольку в еврейском выражении оно отсутствует, хотя подразумеваемый носитель титула — Бог Израиля.
translation_notes:
  register: Современный литературный русский с возвышенной псалмовой интонацией. Двоеточие сохранено как указание на продолжение содержания обета в следующем стихе.
