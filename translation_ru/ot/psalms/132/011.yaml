base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/011.yaml
  text: 'Yahweh swore to David a sure oath[b][a]; he will not turn back from it: “From the fruit of your womb I will set one on your throne.”'
translation:
  language: ru
  text: 'Яхве дал Давиду непреложную клятву[a] и не отступит от неё: «Одного из твоих потомков[b] Я посажу на твой престол».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верное обещание». Буквально в еврейском тексте: «истина»; это слово подчёркивает непреложность клятвы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от плода твоего чрева», то есть одного из кровных потомков Давида. См. 2 Цар. 7:12; Деян. 2:30.'
    reason: cross_reference
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: поклялся
  rationale: Нифаль глагола שבע обозначает принесение клятвы; совершенный вид естественно передаёт завершённое и непреложное действие.
- source_word: יְהוָה
  choice: Господь
  rationale: В современном русском библейском регистре традиционная передача тетраграмматона словом «Господь» узнаваема и благозвучна.
- source_word: אֱמֶת
  choice: это истина
  rationale: Сохраняет самостоятельное и несколько напряжённое еврейское выражение «истина», которое подчёркивает несомненность клятвы, не сводя его лишь к прилагательному.
- source_word: לֹא יָשׁוּב מִמֶּנָּה
  choice: Он не отступит от неё
  rationale: Передаёт образ возвращения или отступления от клятвы; местоимение женского рода естественно относится к «истине» или подразумеваемой клятве.
- source_word: מִפְּרִי בִטְנְךָ
  choice: Потомка твоего
  rationale: Еврейская метафора буквально означает «от плода твоего чрева» и указывает на кровного потомка; естественная русская формулировка передаёт смысл без неуместного для мужчины слова «чрево».
- source_word: אָשִׁית לְכִסֵּא לָךְ
  choice: Я посажу на твой престол
  rationale: В контексте царской династии שׁית означает поместить или посадить, а сочетание לְכִסֵּא לָךְ естественно понимается как престол Давида.
theological_decisions:
- issue: Мессианский и заветный объём обещания Давиду
  choice: Основной текст говорит о кровном потомке Давида и его престоле, не называя потомка прямо Мессией.
  alternative: Сделать мессианское исполнение явным уже в переводе стиха.
  rationale: На непосредственном уровне псалом формулирует династическое обещание Давиду. Его дальнейшее мессианское прочтение важно в каноне, но не должно подменять формулировку самого стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Синтаксис ясен для обычного читателя; конкретная еврейская идиома пояснена в примечании. Маркеры примечаний размещены при соответствующих выражениях.
