  text: שִׁ֗יר הַֽ/מַּ֫עֲל֥וֹת זְכוֹר יְהוָ֥ה לְ/דָוִ֑ד אֵ֝ת כָּל עֻנּוֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/000.yaml
  text: A Song of Ascents[a]. Remember, Yahweh[b], for David all his affliction.
translation:
  language: ru
  text: 'Песнь восхождений.[a]


    Вспомни, Яхве, ради Давида[b] все его страдания.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Песнь ступеней». Вероятно, это одна из песен, исполнявшихся паломниками при восхождении в Иерусалим.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский предлог можно также понимать как «о Давиде», «в пользу Давида» или «по отношению к Давиду».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «все его тяготы», «всё его унижение». Еврейское слово может обозначать страдание, лишения или состояние униженности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Устойчиво и близко передаёт еврейское надписание; значение множественного מַעֲלוֹת допускает как буквальные подъёмы, так и связанное с ними паломничество.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: לְדָוִד
  choice: ради Давида
  rationale: Сохраняет направленность просьбы в пользу Давида; одна лишь форма «Давида» могла бы ошибочно представить его непосредственным дополнением глагола «вспомни».
- source_word: כָּל־עֻנּוֹתוֹ
  choice: все его страдания
  rationale: 'Естественная русская передача собирательного смысла: речь обо всей совокупности пережитых Давидом бед и тягот.'
theological_decisions:
- issue: Направленность просьбы с לְדָוִד
  choice: ради Давида
  alternative: о Давиде / Давиду
  rationale: Формулировка не решает сверх текста, вспоминает ли Бог ради самого Давида, в его пользу или в связи с ним, но ясно сохраняет благоприятную направленность просьбы.
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя; транслитерация позволяет отличить его от титула אֲדֹנָי.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Порядок слов слегка возвышенный; архаизмы и конфессионально обусловленная замена личного имени титулом исключены.
