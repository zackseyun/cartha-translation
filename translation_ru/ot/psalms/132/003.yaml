  text: אִם אָ֭בֹא בְּ/אֹ֣הֶל בֵּיתִ֑/י אִם אֶ֝עֱלֶ֗ה עַל עֶ֥רֶשׂ יְצוּעָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/003.yaml
  text: Surely I will not enter the tent of my house[b][a]; surely I will not go up onto the bed of my couch—
translation:
  language: ru
  text: Не войду в шатёр своего дома[a], не поднимусь на ложе своей постели[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если войду… если поднимусь…». Это древнееврейская формула клятвы, которая здесь означает: «не войду… не поднимусь…».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на ложе своего места отдыха». В еврейском тексте рядом стоят два близких по значению слова, обозначающих место для лежания или сна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם ... אִם
  choice: не ... не
  rationale: 'Повторяющееся אִם входит в древнееврейскую формулу клятвы: буквально условные придаточные выражают твёрдое обещание не совершать названных действий. В русском отрицательная форма будущего времени естественно передаёт силу обета; буквальная условная конструкция была бы непонятна без отсутствующей здесь второй части клятвы.'
- source_word: אָבֹא
  choice: войду
  rationale: Форма Qal imperfect 1-го лица единственного числа обозначает действие, от которого говорящий клянётся воздержаться; «войду» точно и естественно передаёт движение внутрь.
- source_word: בְּאֹהֶל בֵּיתִי
  choice: в шатёр своего дома
  rationale: Сохранён конкретный образ אֹהֶל («шатёр») и его сочетание с בַּיִת («дом»), хотя по-русски оно звучит поэтически необычно. Возвратное «своего» естественно при подлежащем первого лица.
- source_word: אֶעֱלֶה עַל
  choice: поднимусь на
  rationale: Сочетание сохраняет пространственный образ глагола עלה («подниматься, восходить») и направительное значение предлога עַל.
- source_word: עֶרֶשׂ יְצוּעָי
  choice: ложе своей постели
  rationale: Оба близких по значению слова обозначают место для лежания или сна. Их сочетание сохранено как поэтическое усиление, а не сведено к одному слову.
