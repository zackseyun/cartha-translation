  source_fidelity: 'Текст точно передаёт оба еврейских имперфекта в их молитвенно-пожелательной функции: «да облекутся» соответствует יִלְבְּשׁוּ, а «да восклицают от радости» — יְרַנֵּנוּ. «Твои священники» верно передаёт כֹּהֲנֶיךָ; образ облачения «в праведность» сохраняет метафору и значение צֶדֶק. «Верные Тебе» адекватно выражает חֲסִידֶיךָ как людей, отличающихся верностью/преданностью Богу.'
  naturalness: Фраза звучит как современный литературный русский с уместной возвышенной интонацией псалма. Конструкция «Да ... и да ...» несколько торжественна, но естественна именно для молитвенно-поэтического жанра и ясно передаёт пожелание. Порядок слов и связь «верные Тебе» понятны.
  terminology: '«Священники», «праведность» и «верные Тебе» употреблены последовательно и без конфессионально сужающего толкования. Сноски корректно фиксируют жизнеспособные варианты «справедливость», «благочестивые/святые» и «ликуют/поют от радости». Все маркеры стоят у соответствующих слов: [a] при «праведность», [c] при глаголе радостного возгласа, [b] при «верные Тебе».'
