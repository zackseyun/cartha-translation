  text: כֹּהֲנֶ֥י/ךָ יִלְבְּשׁוּ צֶ֑דֶק וַ/חֲסִידֶ֥י/ךָ יְרַנֵּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/009.yaml
  text: May your priests be clothed with righteousness[c][b][a], and may your faithful ones shout for joy.
translation:
  language: ru
  text: Да облекутся Твои священники в праведность[a], и да восклицают от радости[c] верные Тебе[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость». Еврейское צֶדֶק может обозначать как нравственную праведность, так и справедливость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «преданные Тебе»; традиционно: «Твои благочестивые» или «Твои святые». Еврейское слово обозначает тех, кто отличается верностью и преданностью в отношениях завета.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «да ликуют» или «да поют от радости». Еврейский глагол обозначает громкое радостное ликование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּהֲנֶיךָ
  choice: Твои священники
  rationale: כֹּהֵן прямо обозначает священника; этот выбор сохраняет храмовый и богослужебный контекст псалма. Суффикс 2-го лица единственного числа передан местоимением «Твои».
- source_word: יִלְבְּשׁוּ
  choice: да облекутся
  rationale: Глагол לבשׁ сохраняет образ одежды. Возвышенное, но понятное современному читателю «облекутся» естественно сочетается с абстрактным существительным «праведность» и передаёт молитвенно-пожелательный оттенок формы.
- source_word: צֶדֶק
  choice: праведность
  rationale: צֶדֶק охватывает нравственную правоту и справедливость. В образе облачения священников «праведность» звучит естественно и сохраняет нравственно-заветный смысл; судебно-общественный оттенок отмечен в сноске.
- source_word: וַחֲסִידֶיךָ
  choice: верные Тебе
  rationale: חָסִיד обозначает людей, отличающихся преданностью и верностью в отношениях завета. «Верные Тебе» ясно передаёт эту направленность и не вносит позднейших конфессиональных ассоциаций слова «святые».
- source_word: יְרַנֵּנוּ
  choice: да восклицают от радости
  rationale: Порода пиэль глагола רנן выражает громкое радостное ликование. «Восклицают от радости» передаёт звучность и силу действия, не ограничивая его непременно пением.
theological_decisions:
- issue: Пожелательно-молитвенное значение имперфектов
  choice: 'Передать обе формы конструкцией с «да»: «Да облекутся… и да восклицают…»'
  alternative: «Твои священники облекутся… и верные Тебе будут восклицать…» как утверждение или предсказание
  rationale: В контексте молитвы Псалма 132 имперфекты естественно понимать как просьбу или пожелание. Конструкция с «да» сохраняет эту функцию, не превращая стих в безусловное предсказание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Конструкция «да облекутся» сохраняет молитвенный регистр и метафору одежды; «восклицают от радости» остаётся ясным для обычного читателя.
