  text: Песнь восхождений. Вспомни, Яхве, о Давиде и обо всех его тяготах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Вспомни, Яхве, ради Давида все его лишения» или «всё его унижение». Еврейский предлог при имени Давида может указывать как на отношение к нему, так и на действие ради него; еврейское слово, переданное как «тяготы», охватывает страдания, лишения и унижение.'
