lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Традиционное и при этом близкое к еврейскому обозначение данного собрания псалмов; «песнь» точно передаёт שִׁיר, а «восхождений» сохраняет смысл הַמַּעֲלוֹת без уточнения спорного исторического фона.
- source_word: זְכוֹר
  choice: Вспомни
  rationale: Повелительная форма, обращённая к Богу. «Вспомни» естественно передаёт молитвенную просьбу о деятельном, благосклонном памятовании, не добавляя этого оттенка прямо.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לְדָוִד
  choice: о Давиде
  rationale: Предлог לְ здесь допускает значение отношения или пользы. В сочетании с русским «вспомни» оборот «о Давиде» естественен и сохраняет возможность понимать просьбу как относящуюся к Давиду, не исключая смысла «ради Давида».
- source_word: אֵת כָּל עֻנּוֹתוֹ
  choice: обо всех его тяготах
  rationale: 'Множественное «тяготах» естественно согласуется с כָּל и передаёт широкий круг значений: страдания, лишения, трудности и унижение, не сужая выражение до одного вида бедствия.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение לְדָוִד
  choice: о Давиде
  alternative: ради Давида
  rationale: Еврейский предлог допускает несколько оттенков. Основной текст сохраняет естественную для русского языка связь с глаголом «вспомни», а возможный оттенок пользы указан в примечании.
- issue: Смысл עֻנּוֹתוֹ
  choice: все его тяготы
  alternative: всё его унижение / все его лишения
  rationale: Слово может охватывать страдание, трудности, унижение или самоумаление. «Тяготы» сохраняет широту смысла, а примечание фиксирует альтернативы.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Обращение без частицы «о» звучит естественно по-русски; тире помогает ясно связать Давида с его тяготами. Неопределённость предлога לְ и существительного עֻנּוֹתוֹ сохранена в примечании.
