  text: אִֽם יִשְׁמְר֬וּ בָנֶ֨י/ךָ בְּרִיתִ/י֮ וְ/עֵדֹתִ֥/י ז֗וֹ אֲלַ֫מְּדֵ֥/ם גַּם בְּנֵי/הֶ֥ם עֲדֵי עַ֑ד יֵ֝שְׁב֗וּ לְ/כִסֵּא לָֽ/ךְ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/012.yaml
  text: If your sons keep my covenant and my testimonies that I will teach them[a], then their sons also will sit on your throne forever.
translation:
  language: ru
  text: Если твои сыновья будут хранить Мой завет и Моё свидетельство, которому Я научу их,[a] то и их сыновья будут вечно сидеть на твоём престоле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё установление, которому Я научу их»; возможно также: «Моё постановление».'
    reason: Лексическое значение עֵדוּת/עֵדֹת в данном контексте допускает передачу «свидетельство», «установление» или «постановление»; в масоретском тексте здесь единственное число.
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Сохраняет прямое условное значение и не превращает условие в уверенность.
- source_word: יִשְׁמְרוּ
  choice: будут хранить
  rationale: В сочетании с заветом передаёт верное соблюдение; это естественная и устоявшаяся библейская формулировка по-русски.
- source_word: בָנֶיךָ
  choice: твои сыновья
  rationale: Еврейское слово имеет мужской род и во множественном числе обозначает сыновей; династический контекст также требует этой конкретности.
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: Точный и общепринятый эквивалент в контексте отношений Бога с Давидом.
- source_word: וְעֵדֹתַי
  choice: и Мои свидетельства
  rationale: Сохраняет особое значение עֵדוֹת как данных Богом свидетельств или установлений завета, не смешивая этот термин с другими словами закона.
- source_word: זוֹ אֲלַמְּדֵם
  choice: которым Я научу их
  rationale: Относит единственное указательное זוֹ к собирательно понимаемым «свидетельствам» и естественно передаёт русский объект глагола «научу» творительным падежом; сохраняет связь наставления с Божьими свидетельствами.
- source_word: גַּם
  choice: то и
  rationale: 'В русской условной конструкции естественно выражает добавочное следствие: также и следующее поколение.'
- source_word: בְּנֵיהֶם
  choice: их сыновья
  rationale: Сохраняет мужской род и династическую направленность исходного текста.
- source_word: עֲדֵי עַד
  choice: вечно
  rationale: Кратко и естественно передаёт идиому длительной непрерывности или вечности.
- source_word: יֵשְׁבוּ לְכִסֵּא לָךְ
  choice: будут вечно сидеть на твоём престоле
  rationale: Передаёт образ царского престолонаследия без добавления отсутствующего в тексте глагола «царствовать».
theological_decisions:
- issue: Условность обещания династии Давида
  choice: 'Сохранено реальное условие: продолжение пребывания потомков на престоле связано с верностью сыновей завету и Божьим свидетельствам.'
  alternative: Понять условие как лишь риторическое либо не влияющее на безусловный характер обещания.
  rationale: Конструкция אִם прямо вводит условие. Перевод не устраняет напряжение между этим условием и другими формулировками обещания Давиду.
- issue: К чему относится זוֹ и как связано наставление
  choice: 'Фраза понята как относящаяся к Божьим свидетельствам: «Мои свидетельства, которым Я научу их».'
  alternative: 'Передать וְעֵדֹתַי как «и Мои установления» или понимать связь более свободно: «то, чему Я научу их».'
  rationale: Такая передача следует ближайшему синтаксическому антецеденту и сохраняет смысл Божьего наставления, не расширяя его за пределы текста.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Прописные буквы в местоимениях «Мой», «Я» употреблены как издательская норма благоговейного обозначения Бога; условная структура и династическая конкретность сохранены.
