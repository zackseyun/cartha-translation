  text: I will surely bless her provisions[a]; I will satisfy her poor with bread.
translation:
  language: ru
  text: Я обильно благословлю её припасы[a]; её бедных насыщу хлебом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пищу» или «пропитание»; еврейское слово может обозначать запас продовольствия города.'
