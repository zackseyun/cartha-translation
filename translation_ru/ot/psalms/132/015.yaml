lexical_decisions:
- source_word: צֵידָהּ
  choice: её припасы
  rationale: Существительное צֵיד здесь обозначает запас пищи или продовольствие. В контексте Сиона «припасы» естественно передаёт смысл городских запасов и не создаёт неуместной ассоциации с охотничьей добычей; суффикс женского рода передан словом «её».
- source_word: בָּרֵךְ אֲבָרֵךְ
  choice: Я непременно благословлю
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение. «Непременно благословлю» передаёт эту эмфазу естественным современным русским языком.
- source_word: אֶבְיוֹנֶיהָ
  choice: её бедных
  rationale: אֶבְיוֹן обозначает бедного или нуждающегося. «Бедных» кратко и точно передаёт социально-экономический смысл, а «её» сохраняет отсылку к Сиону.
- source_word: אַשְׂבִּיעַ
  choice: насыщу
  rationale: Порода hифиль глагола שׂבע означает «дать насытиться», «насытить». Русское «насыщу» выражает и обеспечение пищей, и достижение сытости.
- source_word: לָחֶם
  choice: хлебом
  rationale: Еврейский текст содержит конкретное слово «хлеб». Его сохранение удерживает предметный поэтический образ и не заменяет его более общим словом «пища».
theological_decisions:
- issue: К кому относятся суффиксы женского рода
  choice: Слова «её припасы» и «её бедных» относятся к Сиону (Иерусалиму), названному в ближайшем контексте.
  alternative: Обобщённая отсылка к месту обитания Господа.
  rationale: Суффиксы женского рода единственного числа наиболее естественно указывают на Сион в Псалме 132:13–14. Местоимение «её» сохраняет поэтическое олицетворение, не добавляя к тексту иных богословских утверждений.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Инверсия «Её припасы Я…» сохраняет поэтический акцент на заботе о Сионе; параллелизм двух полустиший передан без сглаживания.
