  text: א֭וֹיְבָי/ו אַלְבִּ֣ישׁ בֹּ֑שֶׁת וְ֝/עָלָ֗י/ו יָצִ֥יץ נִזְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/018.yaml
  text: I will clothe his enemies with shame[a], but on him his crown will flourish.
translation:
  language: ru
  text: Его врагов Я облеку позором, а на нём будет цвести его венец.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его диадема расцветёт». Еврейский глагол передаёт образ распускания или цветения, а существительное может означать царский венец или диадему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹיְבָיו
  choice: его врагов
  rationale: Форма множественного числа с суффиксом 3-го лица мужского рода единственного числа; «враги» — прямой и естественный русский эквивалент.
- source_word: אַלְבִּישׁ
  choice: Я облеку
  rationale: Каузативная форма от לבשׁ означает «облечь, одеть»; первое лицо единственного числа явно сохраняет действие говорящего, а «облеку» поддерживает образную и возвышенную речь.
- source_word: בֹּשֶׁת
  choice: позором
  rationale: Существительное обозначает стыд или позор; творительный падеж естественно передаёт метафору «облечь позором».
- source_word: וְעָלָיו
  choice: а на нём
  rationale: Союз передаёт контраст между участью врагов и царя; предлог «на» сохраняет пространственный образ венца на его голове.
- source_word: יָצִיץ
  choice: будет цвести
  rationale: Глагол обозначает цветение, распускание или произрастание. Буквальное «цвести» сохраняет живую растительную метафору и не сводит её лишь к общему процветанию.
- source_word: נִזְרוֹ
  choice: его венец
  rationale: В контексте царского псалма слово естественно обозначает царский венец или диадему; «венец» соответствует достоинству регистра и допускает связанную с корнем идею посвящения, не выдвигая её на первый план.
theological_decisions:
- issue: Царский образ נִזְרוֹ в псалме о Давиде и Сионе
  choice: «его венец» — царское значение без явной мессианской конкретизации
  alternative: «его посвящение»
  rationale: Контекст обещания Давидовой династии поддерживает царский смысл. Перевод сохраняет этот образ, но не вносит в сам стих более узкое богословское толкование.
- issue: Образ действия יָצִיץ применительно к венцу
  choice: сохранена метафора цветения
  alternative: «будет процветать» или «воссияет»
  rationale: Основное значение глагола связано с распусканием и цветением. Необычное сочетание с венцом намеренно сохраняет поэтическую напряжённость еврейского текста.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной поэтической метафоры. «Облеку позором» звучит dignified и естественно для псалма; порядок второй части сохраняет акцент на противопоставлении «на нём».
