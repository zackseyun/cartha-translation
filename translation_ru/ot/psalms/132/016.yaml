  text: וְֽ֭/כֹהֲנֶי/הָ אַלְבִּ֣ישׁ יֶ֑שַׁע וַ֝/חֲסִידֶ֗י/הָ רַנֵּ֥ן יְרַנֵּֽנוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/016.yaml
  text: And I will clothe her priests with salvation[b][a], and her faithful ones will shout for joy.
translation:
  language: ru
  text: 'Её священников Я облеку спасением,

    и её верные[a] будут громко ликовать[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её святые», «её благочестивые». Еврейское слово обозначает людей, отличающихся верностью завету, преданностью и благочестием.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте глагол усилен повторной глагольной формой: буквально — «ликовать будут ликовать», то есть будут громко и радостно восклицать или петь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹהֲנֶיהָ
  choice: её священников
  rationale: Существительное «священники» имеет суффикс 3-го лица женского рода единственного числа, относящийся к Сиону, который в контексте олицетворён как женщина.
- source_word: אַלְבִּישׁ
  choice: Я облеку
  rationale: Каузативная форма глагола לבשׁ означает «одеть, облечь». «Облеку» естественно сохраняет образ спасения как одеяния; форма первого лица указывает на продолжающуюся речь Бога.
- source_word: יֶשַׁע
  choice: спасением
  rationale: Слово обозначает спасение, избавление или победоносную помощь. «Спасением» сохраняет широкий смысл и точно сочетается с метафорой облачения.
- source_word: חֲסִידֶיהָ
  choice: её верные
  rationale: חסיד обозначает людей, отличающихся преданностью, благочестием и верностью отношениям завета. «Верные» понятно современному читателю и не привносит позднейших специальных значений слова «святые».
- source_word: רַנֵּן יְרַנֵּנוּ
  choice: будут громко ликовать
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает действие. «Будут громко ликовать» передаёт и радостное возглашение, и выраженную в еврейской конструкции интенсивность.
theological_decisions:
- issue: Передача חֲסִידֶיהָ в контексте завета и богослужения
  choice: её верные
  alternative: её святые; её благочестивые; преданные Ему люди
  rationale: Выбор сохраняет значение верности и преданности, не ограничивая его позднейшим конфессиональным употреблением слова «святые». Сноска отмечает более широкий смысл еврейского термина.
- issue: Образ спасения как облачения священников
  choice: облеку спасением
  alternative: одену в спасение; облеку избавлением
  rationale: Сохранена исходная метафора без сведения יֶשַׁע только к временному избавлению или военной победе.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Инверсия «Её священников Я облеку» сохраняет тематическое выделение священников в еврейской строке; прописное «Я» ясно обозначает продолжающуюся речь Бога. Параллелизм двух полустиший сохранён.
