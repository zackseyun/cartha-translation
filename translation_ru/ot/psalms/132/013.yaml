  text: Ибо Яхве избрал Сион, пожелал его как Своё жилище.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предыдущего утверждения и естественно передаёт пояснительно-причинную связь в современном русском языке.
- source_word: בָחַר
  choice: избрал
  rationale: Глагол означает «выбрать, избрать»; форма прошедшего времени передаёт завершённое действие, значимое для настоящего контекста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּצִיּוֹן
  choice: Сион
  rationale: При глаголе בחר предлог בְ отмечает избираемый объект; по-русски естественно «избрал Сион».
- source_word: אִוָּהּ
  choice: пожелал его
  rationale: Глагол выражает желание; суффикс относится к грамматически женскому «Сиону», однако в русском название города мужского рода, поэтому основное согласование — «его».
- source_word: לְמוֹשָׁב לוֹ
  choice: Себе в жилище
  rationale: Сочетание обозначает предназначение Сиона как места пребывания Яхве; возвратное «Себе» ясно передаёт לוֹ, не превращая его лишь в притяжательное определение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Местоименное указание на Сион
  choice: его
  alternative: её
  rationale: Еврейский суффикс женского рода согласован с צִיּוֹן, но русское «Сион» мужского рода. Основной текст следует естественной русской грамматике, а форма исходного текста отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтической сдержанностью. Формулировка сохраняет причинную связь, личное имя Бога и различие между избранием Сиона и желанием сделать его местом пребывания.
