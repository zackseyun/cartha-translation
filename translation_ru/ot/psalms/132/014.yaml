  yaml_path: translation/ot/psalms/132/014.yaml
  text: This is my resting place forever; here I will dwell[a], for I have desired it.
translation:
  language: ru
  text: «Вот место Моего покоя навеки; здесь Я буду обитать, потому что возжелал её[a].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что возжелал это место». Суффикс женского рода может относиться не к олицетворённому Сиону, а к месту Божьего покоя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת
  choice: Вот
  rationale: Женское указательное местоимение указывает на Сион, названный в предыдущем стихе; русское «вот» естественно вводит указание на это место.
- source_word: מְנוּחָתִי
  choice: место Моего покоя
  rationale: В данном местном контексте существительное обозначает не только состояние покоя, но и место постоянного пребывания; сочетание сохраняет оба смысловых оттенка.
- source_word: עֲדֵי עַד
  choice: навеки
  rationale: Устойчиво и кратко передаёт значение непрерывной, постоянной длительности.
- source_word: פֹּה
  choice: здесь
  rationale: Прямо передаёт местное наречие и сохраняет непосредственность еврейского текста.
- source_word: אֵשֵׁב
  choice: Я буду обитать
  rationale: В контексте Божьего пребывания на Сионе ישב означает постоянное обитание; буквальное «сидеть» по-русски могло бы ввести в заблуждение, хотя оттенок воцарения остаётся возможным.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание Божьего решения обитать здесь.
- source_word: אִוִּתִיהָ
  choice: возжелал её
  rationale: Глагол выражает сильное желание, а местоимение женского рода сохраняет поэтическое изображение Сиона как женщины, не подменяя желание понятием избрания.
theological_decisions:
- issue: К чему относится суффикс женского рода в אִוִּתִיהָ
  choice: «её» — Сион, поэтически представленный в женском роде
  alternative: «это место» — место Божьего покоя
  rationale: Сион в еврейской поэзии обычно осмысляется как существительное женского рода и нередко персонифицируется. Однако грамматика допускает связь суффикса с מְנוּחָה («место покоя»), также имеющим женский род в еврейском; поэтому альтернативу следует сохранить в примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмовым звучанием. Заглавные буквы в местоимениях «Моего», «Я» следуют принятой русской традиции благоговейного обозначения Бога. Формулировка сохраняет образ Сиона в женском роде и отмечает подлинную референциальную неоднозначность.
