  yaml_path: translation/ot/psalms/132/010.yaml
  text: For the sake of David your servant[b][a], do not turn away the face of your anointed one.
translation:
  language: ru
  text: Ради Давида, Твоего слуги, не отворачивайся от Твоего помазанника.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не отврати лица Твоего помазанника»; то есть не отвергай его.'
    reason: lexical_alternative
  - marker: b
    text: '«Твоего помазанника» можно также передать: «Твоего Мессию», особенно в свете обетований Давиду и более широкого мессианского контекста Писания.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: Ради
  rationale: Передаёт основание мольбы — просьбу ради Давида — естественно и кратко по-русски.
- source_word: דָּוִד
  choice: Давида
  rationale: Общепринятая русская форма библейского имени; родительный падеж обусловлен предлогом «ради».
- source_word: עַבְדֶּךָ
  choice: Твоего слуги
  rationale: В контексте молитвы и отношений с Богом «слуга» естественно передаёт подчинённое служение, не привнося прежде всего социально-правовой смысл рабства.
- source_word: אַל תָּשֵׁב פְּנֵי
  choice: не отвергай
  rationale: Еврейское выражение буквально говорит о повороте лица помазанника, но идиоматически означает отказать ему или отвергнуть его. Русское «не отвергай» ясно передаёт смысл; буквальный образ сохранён в сноске.
- source_word: מְשִׁיחֶךָ
  choice: Твоего помазанника
  rationale: «Помазанник» сохраняет непосредственное обозначение царя из дома Давида и одновременно допускает более широкое мессианское прочтение, не навязывая его в основном тексте.
theological_decisions:
- issue: Следует ли передавать מְשִׁיחֶךָ непосредственно как мессианский титул
  choice: Твоего помазанника
  alternative: Твоего Мессию
  rationale: В ближайшем контексте речь идёт о помазанном царе из рода Давида. «Помазанник» сохраняет и историко-царский смысл, и каноническое мессианское звучание, не отождествляя их без пояснения.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической сдержанностью. Местоимения, обращённые к Богу, написаны с прописной буквы. Основной текст использует естественную русскую идиому, а конкретный еврейский образ и мессианская альтернатива сохранены в сноске.
