  text: הִנֵּֽה שְׁמַֽעֲנ֥וּ/הָ בְ/אֶפְרָ֑תָה מְ֝צָאנ֗וּ/הָ בִּ/שְׂדֵי יָֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/006.yaml
  text: Look, we heard of it in Ephrathah; we found it in the fields of Jaar.
translation:
  language: ru
  text: Вот, мы услышали о нём в Ефрафе, нашли его на полях Яара.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально местоименные формы здесь женского рода: «о ней… её»; вероятно, подразумевается ковчег. «Яар» может быть поэтическим обозначением местности Кириаф-Иарим.'
    reason: Поясняет грамматический род неявного предмета и возможную географическую отсылку, не разрешая неоднозначность в основном тексте.
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественный для возвышенной поэтической речи указательно-вводный эквивалент, привлекающий внимание без архаического «се».
- source_word: שְׁמַעֲנוּהָ / מְצָאנוּהָ
  choice: мы услышали о нём / нашли его
  rationale: Местоименный суффикс в масоретской записи формально женского рода, вероятно соотносится с подразумеваемым словом женского рода (часто понимается как «ковчег»); русский мужской род обусловлен естественным восстановлением «ковчег», но сам предмет в стихе прямо не назван.
- source_word: אֶפְרָתָה
  choice: Ефрафе
  rationale: Традиционно узнаваемая русская передача топонима Ефрафа в предложном падеже.
- source_word: שְׂדֵי יָעַר
  choice: полях Яара
  rationale: Сохраняет буквальную форму топонимического выражения «поля Яара» и связь с созвучным названием Кириаф-Иарим, не подменяя его толкованием.
theological_decisions:
- issue: Неявный предмет местоименных форм
  choice: Сохранить местоименное обозначение «о нём / его», не вставляя «ковчег» в основной текст
  alternative: «мы услышали о ковчеге… нашли его»
  rationale: Контекст позволяет понимать ковчег, однако еврейский стих не называет его прямо; местоимение сохраняет поэтическую недосказанность и экзегетическую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. «Вот» предпочтено архаическому «се»; синтаксический параллелизм оригинала сохранён.
