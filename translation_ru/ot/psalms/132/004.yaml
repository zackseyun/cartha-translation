base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/004.yaml
  text: I will not give sleep to my eyes[a], nor slumber to my eyelids—
translation:
  language: ru
  text: Не дам сна моим глазам, ни дремоты моим векам —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: не
  rationale: Здесь אִם вводит клятвенную формулу с подразумеваемым проклятием, а не обычное условие. По-русски её смысл естественно передаётся решительным отрицанием «не дам»; буквальная форма отмечена в сноске.
- source_word: אֶתֵּן
  choice: дам
  rationale: Глагол נתן имеет основное значение «давать». В сочетании со сном русское «дать сна глазам» сохраняет еврейский образ и звучит поэтично.
- source_word: שְׁנַת
  choice: сна
  rationale: Существительное означает «сон»; родительный падеж обусловлен отрицанием при глаголе «дам».
- source_word: לְעֵינָי
  choice: моим глазам
  rationale: Предлог ל обозначает косвенный объект. Дательный падеж естественно и точно передаёт конструкцию и сохраняет образ глаз.
- source_word: לְעַפְעַפַּי
  choice: моим векам
  rationale: עפעף означает «веко». Сохраняется телесный образ и параллелизм с «моим глазам».
- source_word: תְּנוּמָה
  choice: дремоты
  rationale: «Дремота» отличает תְּנוּמָה от שְׁנַת «сон» и воспроизводит синонимический поэтический параллелизм.
theological_decisions:
- issue: Клятвенная сила אִם при опущенном последствии
  choice: 'Передать как прямое отрицательное обещание: «не дам»'
  alternative: 'Буквально: «если дам...» с оставленным незавершённым условием'
  rationale: Контекст стихов 3–5 показывает обет Давида. Прямое отрицание ясно передаёт функцию формулы, а сноска сохраняет её буквальную форму и присущую оригиналу эллиптичность.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Инверсия не используется; параллелизм «глазам / векам» и различие «сон / дремота» сохранены. Конечное тире показывает, что обет продолжается в следующем стихе.
