  text: קוּמָ֣/ה יְ֭הוָה לִ/מְנוּחָתֶ֑/ךָ אַ֝תָּ֗ה וַ/אֲר֥וֹן עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/008.yaml
  text: Arise[a], O Yahweh, to your resting place[b], you and the ark of your strength.
translation:
  language: ru
  text: Восстань, Яхве, к месту Твоего покоя[a] — Ты и ковчег Твоей силы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Твоему покою». Еврейское слово может обозначать как сам покой, так и место покоя; здесь, вероятно, имеется в виду место постоянного пребывания Яхве.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ковчег Твоего могущества»; возможно также: «ковчег, являющий Твою силу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Восстань
  rationale: Повелительная форма глагола קום, обращённая к Яхве. «Восстань» сохраняет торжественный литургический призыв и не уточняет сверх текста, идёт ли речь прежде всего о действии или о занятии Своего места.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое обращение древнееврейского текста и не заменяет имя титулом.
- source_word: לִמְנוּחָתֶךָ
  choice: к месту Твоего покоя
  rationale: מְנוּחָה может означать как покой, так и место покоя. В контексте ковчега и святилища пространственное значение естественно, однако связь со значением «покой» сохранена.
- source_word: אַתָּה
  choice: Ты
  rationale: Самостоятельное местоимение выражено в еврейском тексте и сохранено ради смыслового выделения и сочетания с последующим упоминанием ковчега.
- source_word: וַאֲרוֹן
  choice: и ковчег
  rationale: В культовом контексте אֲרוֹן обозначает ковчег, связанный с присутствием Яхве; это точный и закрепившийся русский эквивалент.
- source_word: עֻזֶּךָ
  choice: Твоей силы
  rationale: עֹז означает «сила», «могущество». Буквальное родительное сочетание сохраняет краткость и образность еврейского выражения, не превращая его в пояснительный пересказ.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно употреблён тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Смысл выражения «ковчег Твоей силы»
  choice: Сохранить родительное сочетание «ковчег Твоей силы»
  alternative: ковчег Твоего могущества; могучий Твой ковчег; ковчег, являющий Твою силу
  rationale: Выражение связывает ковчег с могущественным присутствием Яхве, но не объясняет точный характер этой связи. Буквальная компактная передача сохраняет поэтическую и богословскую многозначность.
- issue: Значение מְנוּחָה
  choice: место Твоего покоя
  alternative: Твой покой
  rationale: Упоминание ковчега и движение к месту пребывания поддерживают пространственный смысл, но существительное допускает и отвлечённое значение «покой»; оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным литургическим оттенком. Инверсия «месту Твоего покоя» и форма «восстань» передают поэтическую торжественность псалма, оставаясь понятными современному читателю. Тире сохраняет краткое присоединение явно выраженного местоимения и ковчега.
