lexical_decisions:
- source_word: עַד
  choice: пока не
  rationale: В продолжении клятвы из предыдущего стиха обозначает предел воздержания; русская конструкция «пока не» естественно передаёт этот смысл.
- source_word: אֶמְצָא
  choice: найду
  rationale: Qal, имперфект 1-го лица единственного числа; в контексте клятвы выражает намеченное будущее действие.
- source_word: מָקוֹם
  choice: места
  rationale: Общее обозначение места, предназначенного для Яхве, без преждевременного уточнения «святилище» или «храм».
- source_word: לַיהוָה
  choice: для Яхве
  rationale: Предлог ל указывает на предназначение места; тетраграмматон передан личным именем «Яхве».
- source_word: מִשְׁכָּנוֹת
  choice: жилищ
  rationale: Сохраняется множественное число еврейского существительного; «жилища» понятно современному читателю и не сужает значение до переносной скинии.
- source_word: לַאֲבִיר
  choice: для Могучего
  rationale: Божественный эпитет אֲבִיר передан субстантивированным прилагательным, выражающим силу и величие.
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: В сочетании с эпитетом образует традиционно понятное наименование «Могучий Иакова».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и соответствует предоставленному актуальному решению.
- issue: Число существительного מִשְׁכָּנוֹת
  choice: 'множественное: «жилищ»'
  alternative: 'единственное: «жилища»'
  rationale: Еврейская форма морфологически множественная. Хотя контекст допускает собирательное или усилительное понимание и единственное число звучало бы привычнее, основной текст сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством поэтической клятвы. Начальная конструкция намеренно продолжает синтаксис предыдущего стиха. Эпитет «Могучий Иакова» сохранён как возвышенное библейское наименование.
