  text: נָב֥וֹאָה לְ/מִשְׁכְּנוֹתָ֑י/ו נִ֝שְׁתַּחֲוֶ֗ה לַ/הֲדֹ֥ם רַגְלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/132/007.yaml
  text: Let us go into his dwelling place[b][a]; let us bow down at his footstool.
translation:
  language: ru
  text: Войдём в его обители[a], поклонимся перед подножием его ног[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пойдём к его обителям».'
    reason: В зависимости от понимания בוא и предлога ל сочетание допускает как вход внутрь, так и движение к месту; множественное число «обители» соответствует еврейскому тексту.
  - marker: b
    text: 'Буквально: «подножию его ног». Глагол «поклонимся» обозначает почтительное склонение, вплоть до простирания ниц.'
    reason: Поясняется телесный смысл глагола שׁחה и сохраняется образное выражение הֲדֹם רַגְלָיו; «перед» в основном тексте естественно передаёт контекст поклонения.
lexical_decisions:
- source_word: נָבוֹאָה
  choice: Войдём
  rationale: Когортатив 1-го лица множественного числа от בוא выражает совместное побуждение. В данном сочетании с לְמִשְׁכְּנוֹתָיו естественно и точно передаётся как «войдём»; вариант «пойдём» также возможен.
- source_word: לְמִשְׁכְּנוֹתָיו
  choice: в Его обители
  rationale: Существительное стоит во множественном числе с местоименным суффиксом 3-го лица мужского рода. «Обители» сохраняет грамматическое число и передаёт места пребывания без более узкого конфессионального оттенка слова «скинии».
- source_word: נִשְׁתַּחֲוֶה
  choice: поклонимся
  rationale: Форма выражает совместное побуждение и обозначает почтительное склонение или простирание ниц. Русское «поклонимся» естественно сохраняет как телесный жест, так и культовый контекст.
- source_word: לַהֲדֹם רַגְלָיו
  choice: у подножия ног Его
  rationale: Конструкция буквально означает «у/к подножию Его ног». Развёрнутая формулировка сохраняет образ и местоименную отсылку исходного текста; предлог «у» естественно передаёт местное значение ל в контексте поклонения.
theological_decisions:
- issue: К кому относится местоимение «Его»
  choice: Сохранить местоименную отсылку без прямого называния референта
  alternative: 'Уточнить: «Господа» либо связать местоимение с ковчегом'
  rationale: В ближайшем контексте переплетены темы жилища Господа, ковчега и Сиона. Еврейский текст не называет референта в этом стихе прямо, поэтому перевод не устраняет эту литературно-богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвенной речи. Заглавная буква в «Его» служит русской традиции обозначения божественного референта, не заменяя местоимение явным именованием. Множественное число «обители» сознательно сохранено.
