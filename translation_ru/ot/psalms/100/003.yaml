  text: דְּע֗וּ כִּֽי יְהוָה֮ ה֤וּא אֱלֹ֫הִ֥ים הֽוּא עָ֭שָׂ/נוּ ו/לא אֲנַ֑חְנוּ עַ֝מּ֗/וֹ וְ/צֹ֣אן מַרְעִיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/003.yaml
  text: Know that Yahweh[a], he is God. He made us, and not we ourselves; we are his people and the sheep of his pasture.
translation:
  language: ru
  text: Знайте, что Яхве — Бог. Он сотворил нас, а не мы сами себя[a]; мы — Его народ и овцы Его пастбища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному чтению на полях: «Он сотворил нас, и мы — Его».'
    reason: alternative_reading
lexical_decisions:
- source_word: דְּעוּ
  choice: Знайте
  rationale: Форма повелительного наклонения множественного числа призывает слушателей признать это как непреложную истину; «знайте» звучит естественно и сохраняет прямоту еврейского текста.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что следует знать; в русском после «знайте» естественно употребить «что».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: הוּא אֱלֹהִים
  choice: — Бог
  rationale: Русская именная конструкция с тире естественно передаёт утверждение «Он есть Бог»; отдельное «Он» не требуется, поскольку имя Яхве уже является подлежащим, а категоричность утверждения сохраняется.
- source_word: הוּא עָשָׂנוּ
  choice: Он сотворил нас
  rationale: Глагол עשה здесь говорит о Божьем создании народа. «Сотворил» ясно выражает созидательное действие и соответствует возвышенному, но современному регистру псалма.
- source_word: וְלֹא אֲנַחְנוּ
  choice: а не мы сами
  rationale: 'Основной текст следует написанному לא («не»): Бог сотворил нас, а не мы сами. Русский противительный союз «а» естественно выражает контраст.'
- source_word: עַמּוֹ
  choice: Его народ
  rationale: Прямая передача принадлежности народа Богу и устойчивого библейского обозначения.
- source_word: וְצֹאן מַרְעִיתוֹ
  choice: и овцы Его пастбища
  rationale: Сохраняется пастушеский образ и близкое соответствие словам צאן и מרעית; формулировка понятна современному русскому читателю.
theological_decisions:
- issue: Кетив/кере в средней части стиха
  choice: 'Основной текст следует кетиву לא: «Он сотворил нас, а не мы сами»'
  alternative: 'Традиционное кере לו: «Он сотворил нас, и мы — Его»'
  rationale: Написанный согласный текст естественно означает «не», тогда как традиционное чтение означает «Его». Обе версии древние и осмысленные; при первенстве исходного письменного текста кетив помещён в основной текст, а кере сохранено в примечании, чтобы не устранять подлинную текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом псалма. Личное имя «Яхве» сохранено; синтаксис естественен для русского, пастушеская метафора передана буквально. Маркер примечания поставлен после предложения, к которому относится текстовый вариант.
