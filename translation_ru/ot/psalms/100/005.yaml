  source_fidelity: Основная проблема — передача יהוה как «Господь» в основном тексте. В масоретском еврейском тексте стоит личное имя יהוה; примечание не вполне компенсирует его замену титулом. Следуя аудиторскому решению English POB и прямой передаче имени, его следует передать как «Яхве». «Из поколения в поколение» точно и естественно передаёт וְעַד דֹּר וָדֹר. Сохранение именных, безглагольных конструкций оправдано и хорошо отражает поэтический параллелизм оригинала.
  naturalness: «Ибо благ Яхве» сохраняет уместный для псалма умеренно возвышенный, но понятный современному читателю регистр. «Его неизменная любовь» естественнее и семантически полнее передаёт חַסְדּוֹ, чем одно «милость», не устраняя при этом параллелизма с «верностью».
  terminology: «Яхве» последовательно передаёт тетраграмматон, как и English POB. Для חֶסֶד выбрано «неизменная любовь»; сноска отмечает также оттенки милости и верности обязательствам, не превращая один из них в единственно возможное значение. «Верность» — точная передача אֱמוּנָתוֹ.
