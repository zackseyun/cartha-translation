base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/005.yaml
  text: For Yahweh is good[a]; his steadfast love is forever[d][c][b], and his faithfulness endures from generation to generation.
translation:
  language: ru
  text: 'Ибо благ Яхве: Его неизменная любовь — навеки, и Его верность — из поколения в поколение.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для призыва предыдущих стихов; «ибо» естественно передаёт пояснительно-причинную связь.
- source_word: טוֹב
  choice: благ
  rationale: В данном исповедальном контексте «благ» кратко и достойно выражает нравственную доброту и благодетельность Бога.
- source_word: יְהוָה
  choice: Господь
  rationale: В русском библейском употреблении традиционная передача тетраграмматона титулом «Господь» наиболее понятна и литературно естественна; личное имя отмечено в сноске.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Передаёт неограниченную длительность и сохраняет краткость и поэтический параллелизм.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: «Милость» — естественный русский библейский эквивалент חֶסֶד; он охватывает благоволение и верную любовь, а более широкий смысл пояснён в сноске.
- source_word: וְעַד דֹּר וָדֹר
  choice: и … из поколения в поколение
  rationale: Идиоматично выражает непрерывность во всех сменяющих друг друга поколениях, не меняя временного смысла еврейского оборота.
- source_word: אֱמוּנָתוֹ
  choice: верность Его
  rationale: Передаёт надёжность, постоянство и верность Бога и образует ясный параллелизм с חַסְדּוֹ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господь с указанием имени «Яхве» в сноске
  alternative: Яхве в основном тексте
  rationale: Так сохраняется естественный и узнаваемый русский библейский регистр, а наличие в еврейском тексте собственного имени не скрывается благодаря сноске.
- issue: Смысл חֶסֶד
  choice: милость
  alternative: неизменная любовь / верная любовь
  rationale: «Милость» не сводит многозначное חֶסֶד исключительно к договорной категории; сноска сохраняет оттенки постоянной любви, милосердия и верности.
- issue: Эллиптическая структура именных предложений
  choice: сохранить без добавления глагола «пребывает»
  alternative: его верность пребывает из поколения в поколение
  rationale: Еврейский текст не содержит выраженного глагола; русские именные конструкции с тире естественны и сохраняют лаконичный поэтический параллелизм.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Краткие именные конструкции и повтор «Его» поддерживают параллелизм исходного текста; архаичные формы, кроме общепонятного «благ», не используются.
