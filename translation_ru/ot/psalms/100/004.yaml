    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּאוּ
  choice: входите
  rationale: Форма повелительного наклонения во множественном числе от בוא; при упоминании ворот и дворов естественно передаёт движение внутрь.
- source_word: שְׁעָרָיו
  choice: в его ворота
  rationale: Сохраняет конкретный образ входа в священное пространство и суффикс 3-го лица мужского рода единственного числа.
- source_word: בְּתוֹדָה
  choice: с благодарением
  rationale: תּוֹדָה может означать как благодарение, так и благодарственную жертву. В параллели с «хвалой» предпочтителен абстрактный смысл, а подлинная неоднозначность отмечена в сноске.
- source_word: חֲצֵרֹתָיו
  choice: во дворы его
  rationale: Буквально сохраняет храмовые дворы и культовую образность исходного текста.
- source_word: בִּתְהִלָּה
  choice: с хвалой
  rationale: Передаёт значение תְּהִלָּה и образует ясный поэтический параллелизм с «с благодарением».
- source_word: הוֹדוּ לוֹ
  choice: благодарите его
  rationale: В богослужебном контексте форма от ידה выражает благодарение Богу; краткий русский императив естественен и сохраняет смысловую связь с תּוֹדָה.
- source_word: בָּרֲכוּ
  choice: благословляйте
  rationale: Сохраняет собственное значение ברך и не смешивает его с уже названной хвалой.
- source_word: שְׁמוֹ
  choice: его имя
  rationale: Буквально передаёт еврейское выражение, в котором имя связано с явленной личностью и славой Бога, без поясняющей подстановки.
theological_decisions:
- issue: Образ ворот и дворов святилища
  choice: 'Сохранить буквально: «в его ворота… во дворы его».'
  alternative: Обобщить как «в его присутствие» или «в его дом».
  rationale: Еврейский текст прямо изображает вхождение поклоняющихся в священные пределы; обобщение устранило бы конкретную культовую образность.
- issue: Значение תּוֹדָה
  choice: В основном тексте передать как «благодарение».
  alternative: «Благодарственная жертва».
  rationale: Параллелизм с «хвалой» поддерживает абстрактное значение, но культовый смысл жертвоприношения лексически возможен и потому сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным богослужебным звучанием. Инверсия «во дворы его» поддерживает поэтический параллелизм; тире обозначает подразумеваемое повторение глагола «входите». Местоимения, относящиеся к Богу, даны со строчной буквы по современным общим нормам.
