lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Обычное обозначение псалма, особенно в надписаниях; это точный и естественный русский эквивалент.
- source_word: לְתוֹדָה
  choice: для благодарения
  rationale: Предлог לְ передаёт назначение, а תוֹדָה может означать благодарение, хвалу или благодарственную жертву. Основной перевод сохраняет широкое значение и не уточняет без необходимости культовый контекст.
- source_word: הָרִיעוּ
  choice: Радостно воскликните
  rationale: Побудительная форма множественного числа призывает к громкому, торжествующему возгласу. Формулировка передаёт как звучность, так и радостный характер призыва.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог לְ указывает, кому обращён возглас; тетраграмматон передан как личное имя «Яхве», без замены титулом.
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: В контексте всеобщего призыва אָרֶץ означает землю в мировом, а не только территориальном смысле. Обращение «вся земля» сохраняет поэтическую персонификацию оригинала.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Значение תוֹדָה в надписании
  choice: благодарение
  alternative: благодарственная жертва
  rationale: Слово допускает как общее значение благодарения, так и конкретное культовое значение благодарственной жертвы. Основной текст не сужает смысл, а возможное культовое прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной поэтической интонацией. Сохранено прямое обращение к персонифицированной земле и множественное число еврейского повеления, несмотря на намеренную риторическую несогласованность с собирательным обращением.
