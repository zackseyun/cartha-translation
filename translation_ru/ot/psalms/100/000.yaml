lexical_decisions:
- source_word: מִזְמוֹר לְתוֹדָה
  choice: Псалом для благодарения
  rationale: Предлог לְ передаёт назначение псалма; תוֹדָה может обозначать как благодарение, так и благодарственную жертву. Основной вариант сохраняет целевое значение предлога и звучит понятно по-русски.
- source_word: הָרִיעוּ
  choice: радостно восклицай
  rationale: Глагол означает громко восклицать, издавать торжественный или радостный возглас. Единственное число согласовано с собирательным обращением «вся земля», хотя в еврейском стоит множественное число.
- source_word: כָּל־הָאָרֶץ
  choice: вся земля
  rationale: Сохранён широкий и поэтически ёмкий образ всей земли; контекст допускает подразумеваемых её жителей, но не требует вводить их в текст.
- source_word: יהוה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменено титулом.
theological_decisions:
- issue: Значение תוֹדָה в заголовке
  choice: благодарение
  alternative: благодарственная жертва
  rationale: Оба значения лексически возможны. В основном тексте оставлено более широкое «благодарение», а культовое значение отмечено в сноске без догматического разрешения неоднозначности.
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя исходного текста; традиционная титульная передача указана в сноске.
translation_notes:
  register: Современный литературный русский с поэтической краткостью. Перестановка обращения «вся земля» в начало делает фразу естественной; форма единственного числа отражает русское согласование с собирательным подлежащим, тогда как еврейский императив имеет множественное число.
