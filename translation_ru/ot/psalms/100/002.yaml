  text: עִבְד֣וּ אֶת יְהוָ֣ה בְּ/שִׂמְחָ֑ה בֹּ֥אוּ לְ֝/פָנָ֗י/ו בִּ/רְנָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/100/002.yaml
  text: Serve Yahweh with gladness[a]; come before him with joyful shouting.
translation:
  language: ru
  text: Служите Яхве с радостью; предстаньте перед Ним с ликованием.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с радостными возгласами» или «с пением»; еврейское слово может обозначать громкую ликующую хвалу — как возгласы, так и пение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: Служите
  rationale: Форма повелительного наклонения во множественном числе от עבד. В отношении Яхве слово означает преданное служение и послушание; «служите» сохраняет широту смысла и не сводит его только к богослужению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: בְּשִׂמְחָה
  choice: с радостью
  rationale: Предлог בְּ обозначает образ действия; сочетание естественно передаёт радостный характер служения.
- source_word: בֹּאוּ
  choice: предстаньте
  rationale: Повелительная форма от בוא буквально означает «придите». В сочетании с לְפָנָיו русское «предстаньте перед Ним» естественно передаёт приближение и появление в Его присутствии, не уточняя место.
- source_word: לְפָנָיו
  choice: перед Ним
  rationale: Буквально «перед Его лицом»; выбранная формулировка сохраняет пространственно-реляционный смысл и звучит естественно по-русски.
- source_word: בִּרְנָנָה
  choice: с ликованием
  rationale: רְנָנָה обозначает громкое радостное восклицание или ликующую песнь. «С ликованием» сохраняет намеренную широту слова, не ограничивая выражение радости только пением или только возгласом.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. «Предстаньте» уместно для обращения к Богу и не вносит отсутствующего в стихе указания на вход в святилище. Местоимение «Ним» написано с прописной буквы согласно распространённой русской библейской традиции.
