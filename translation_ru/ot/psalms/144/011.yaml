  terminology: «Чужеземцы» — корректная и нейтральная передача идиомы «сынов чужбины/чужеземцев». «Неправда» обоснованно передаёт שָׁוְא, а сноска сохраняет варианты «пустота/тщета». «Обман» приемлемо передаёт שָׁקֶר без ненужной догматической или интерпретационной конкретизации.
