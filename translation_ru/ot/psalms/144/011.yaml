  source_fidelity: 'Текст точно передаёт оба императива с суффиксом 1-го лица, образ «от руки», идиому בְּנֵי נֵכָר как «чужеземцев», а также два параллельных описания: речь, исполненную שָׁוְא, и правую руку, связанную с שָׁקֶר. Подчёркнутый повтор «правая рука» сохранён. «Избавь меня и спаси меня» передаёт двуглагольную настойчивость просьбы, не сливая её в один глагол.'
