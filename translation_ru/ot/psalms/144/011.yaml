  text: פְּצֵ֥/נִי וְ/הַצִּילֵ/נִי֮ מִ/יַּ֪ד בְּֽנֵי נֵ֫כָ֥ר אֲשֶׁ֣ר פִּ֭י/הֶם דִּבֶּר שָׁ֑וְא וִֽ֝/ימִינָ֗/ם יְמִ֣ין שָֽׁקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/011.yaml
  text: Rescue me and deliver me from the hand of foreigners[c][b][a], whose mouth speaks falsehood and whose right hand is a right hand of deceit.
translation:
  language: ru
  text: Избавь меня и спаси меня от руки чужеземцев[a], чьи уста говорят неправду[b] и чья правая рука — правая рука обмана[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов чужбины», то есть чужеземцев.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «говорят пустое»; еврейское слово может означать неправду, пустоту или тщету.'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте повторено «правая рука». Правая рука могла символизировать силу, действие или данное обязательство.
    reason: cultural_note
lexical_decisions:
- source_word: פְּצֵנִי
  choice: Избавь меня
  rationale: Императив от פצה с суффиксом 1-го лица выражает просьбу вызволить или освободить; «избавь меня» естественно передаёт настойчивую мольбу.
- source_word: וְהַצִּילֵנִי
  choice: и спаси меня
  rationale: Порода хифиль глагола נצל означает вырвать из опасности, спасти. Отдельный глагол сохранён, чтобы не сглаживать еврейский параллелизм.
- source_word: מִיַּד
  choice: от руки
  rationale: 'Сохранён образ руки как власти или контроля: он понятен в библейском контексте и перекликается с упоминанием правой руки далее.'
- source_word: בְּנֵי נֵכָר
  choice: чужеземцев
  rationale: Буквально «сынов чужбины»; это идиоматическое обозначение людей из чужой земли. «Чужеземцы» естественно и стилистически достойно передаёт смысл.
- source_word: פִּיהֶם דִּבֶּר שָׁוְא
  choice: чьи уста говорят неправду
  rationale: שָׁוְא может означать пустоту, тщету или ложь. В параллели с שֶׁקֶר здесь уместно «неправду», но возможная смысловая широта отмечена в сноске.
- source_word: וִימִינָם יְמִין שָׁקֶר
  choice: и чья правая рука — правая рука обмана
  rationale: Сохранён подчёркнутый повтор «правая рука». שֶׁקֶר передано словом «обман», обозначающим ложность или вероломство действий либо заверения.
