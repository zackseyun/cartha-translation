  yaml_path: translation/ot/psalms/144/001.yaml
  text: Of David. Blessed be Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: ru
  text: 'Давида.[a]


    Благословен Яхве, скала моя,

    обучающий мои руки сражаться,

    мои пальцы — воевать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Для Давида» или «Давидов». Еврейский предлог в надписании может указывать на авторство, принадлежность, связь или посвящение.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая традиционная форма надписания сохраняет связь псалма с Давидом, не сводя многозначный предлог לְ исключительно к авторству или посвящению.
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Передаёт еврейскую литургическую формулу прославления естественным и возвышенным русским выражением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: צוּרִי
  choice: скала моя
  rationale: Сохраняет конкретную метафору прочности и защиты; «скала» в современном русском яснее передаёт צוּר, чем более многозначное «камень».
- source_word: הַמְלַמֵּד
  choice: обучающий
  rationale: Причастие отражает постоянное характерное действие; контекстные дополнения «битве» и «войне» ясно указывают на военную подготовку.
- source_word: יָדַי לַקְרָב
  choice: руки мои битве
  rationale: Сохраняет образ частей тела и прямой военный смысл קְרָב, а также поэтический параллелизм.
- source_word: אֶצְבְּעוֹתַי לַמִּלְחָמָה
  choice: пальцы мои — войне
  rationale: Точно сохраняет упоминание пальцев и лаконичную параллель между битвой и войной.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Воинская образность применительно к Богу
  choice: Сохранить буквальные образы обучения рук битве и пальцев войне
  alternative: Ослабить или духовно истолковать как общее укрепление
  rationale: Еврейский текст прямо говорит о подготовке к вооружённой борьбе; перевод не должен устранять историческую и богословскую напряжённость этого образа.
translation_notes:
  register: Современный литературный русский с поэтической торжественностью и сохранённым параллелизмом. Инверсия «скала моя», «руки мои», «пальцы мои» поддерживает псалмодический ритм, оставаясь понятной современному читателю.
