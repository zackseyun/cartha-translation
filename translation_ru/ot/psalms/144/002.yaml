  text: חַסְדִּ֥/י וּ/מְצוּדָתִ/י֮ מִשְׂגַּבִּ֪/י וּֽ/מְפַלְטִ֫/י לִ֥/י מָ֭גִנִּ/י וּ/ב֣/וֹ חָסִ֑יתִי הָ/רוֹדֵ֖ד עַמִּ֣/י תַחְתָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/002.yaml
  text: My steadfast love and my fortress[a], my stronghold and my deliverer, my shield, and in him I take refuge[b], the one who subdues peoples under me.
translation:
  language: ru
  text: 'Он — моя неизменная любовь и моя крепость,

    моя твердыня и мой избавитель,

    мой щит; в нём я нахожу убежище,

    тот, кто подчиняет мне мой народ.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народы». Ряд древних переводов и параллельное место в Пс 17:48 поддерживают это чтение; масоретский текст гласит: «мой народ».'
    reason: alternative_reading
lexical_decisions:
- source_word: חַסְדִּי
  choice: моя неизменная любовь
  rationale: Существительное חֶסֶד обозначает верную, стойкую любовь и милость. В ряду обращённых к Богу наименований оно выступает как метафорический титул; «неизменная любовь» сохраняет оттенок постоянной верности и остаётся понятным современному читателю.
- source_word: מְצוּדָתִי
  choice: моя крепость
  rationale: מְצוּדָה — укреплённое место, дающее защиту; «крепость» естественно передаёт военный образ.
- source_word: מִשְׂגַּבִּי
  choice: моя твердыня
  rationale: Слово обозначает высокое, недоступное и безопасное место. «Твердыня» — достоинный поэтический эквивалент, позволяющий отличить его от предшествующего מְצוּדָה.
- source_word: מְפַלְטִי לִי
  choice: мой избавитель
  rationale: Причастие от פלט называет того, кто спасает и даёт вырваться из опасности. Дополнительное לִי усиливает личную направленность, уже естественно выраженную по-русски формой «мой»; буквальное «мой избавитель для меня» было бы тяжеловесным.
- source_word: מָגִנִּי
  choice: мой щит
  rationale: Прямой и ясный военный образ Божьей защиты.
- source_word: וּבוֹ חָסִיתִי
  choice: у него я ищу убежища
  rationale: חסה значит искать или находить убежище. Хотя перфект допускает прошедшее либо результативное понимание, в исповедальном контексте русский настоящий вид естественно выражает устойчивое доверие, не сводя образ к отвлечённому «упованию».
- source_word: הָרוֹדֵד
  choice: он подчиняет
  rationale: 'Причастная форма передаёт продолжающееся действие: Бог приводит под власть царя. «Подчиняет» сохраняет царско-военный смысл без добавочного оттенка жестокости.'
- source_word: עַמִּי
  choice: мой народ
  rationale: 'Масоретская огласовка прямо даёт форму единственного числа с суффиксом первого лица: «мой народ». Это чтение сохранено в основном тексте, а древнее вариантное понимание во множественном числе вынесено в сноску.'
- source_word: תַחְתָּי
  choice: мне
  rationale: Буквально «подо мной» обозначает подчинение власти. В сочетании «подчиняет мне» пространственная метафора естественно и точно передана русским управлением.
theological_decisions:
- issue: Читать עַמִּי как «мой народ» или следовать варианту «народы».
  choice: мой народ
  alternative: народы
  rationale: Приоритет отдан масоретскому тексту с единственным числом и суффиксом первого лица. Это может означать установление Богом законной власти псалмопевца над его народом и не обязано подразумевать угнетение. Поскольку ряд древних переводов и параллель Пс 17:48 поддерживают множественное число, вариант сохранён в сноске.
- issue: Временное значение перфекта חָסִיתִי.
  choice: у него я ищу убежища
  alternative: у него я нашёл убежище
  rationale: Перфект допускает указание на уже совершившееся обретение убежища, однако в цепочке исповедальных наименований настоящее время естественно передаёт сохраняющееся состояние доверия. Неоднозначность не используется для вывода о природе или моменте веры.
translation_notes:
  register: Современный литературный русский с достоинством еврейской поэзии. Параллельные притяжательные наименования сохранены, но синтаксис сделан естественным для русского языка. Местоимения о Боге даны со строчной буквы согласно нейтральной современной издательской практике.
