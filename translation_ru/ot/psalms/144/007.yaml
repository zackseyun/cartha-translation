  yaml_path: translation/ot/psalms/144/007.yaml
  text: Stretch out your hand from on high[a]; rescue me and deliver me from many waters[b], from the hand of foreign sons.
translation:
  language: ru
  text: Простри руку Твою с высоты; вызволи меня и избавь меня из многих вод[a], из руки сынов чужбины[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из многих вод»; также возможно: «из великих вод». Это поэтический образ подавляющей опасности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынов чужбины» — еврейское выражение, означающее чужеземцев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח יָדֶיךָ
  choice: Простри руку Твою
  rationale: Императив שׁלח в сочетании с «рукой» передаёт конкретный образ протянутой для вмешательства руки. Хотя в масоретском тексте יָדֶיךָ формально имеет форму множественного числа («руки Твои»), конструкция и параллель с מִיַּד допускают естественную русскую идиому в единственном числе.
- source_word: מִמָּרוֹם
  choice: с высоты
  rationale: Сохраняет пространственный образ возвышенного места, не конкретизируя его как «небо» сверх сказанного в еврейском тексте.
- source_word: פְּצֵנִי
  choice: вызволи меня
  rationale: Глагол обозначает извлечение или освобождение из опасности; «вызволи» передаёт этот оттенок и сохраняет поэтическую параллель со следующим глаголом.
- source_word: וְהַצִּילֵנִי
  choice: и избавь меня
  rationale: Передаёт спасение от опасности и естественно сочетается с «вызволи», не сводя два параллельных глагола к одному слову.
- source_word: מִמַּיִם רַבִּים
  choice: из вод многих
  rationale: Близко передаёт буквально «из многих вод» и сохраняет поэтический образ подавляющей опасности без его истолкования в основном тексте.
- source_word: מִיַּד
  choice: из руки
  rationale: Сохраняет конкретный образ руки как власти или контроля и перекличку с Божьей рукой в начале стиха.
- source_word: בְּנֵי נֵכָר
  choice: сынов чужеземцев
  rationale: Сохраняет мужской род и сыновнюю формулу оригинала; נֵכָר указывает на чужое, иноземное происхождение. Сноска поясняет идиоматический смысл.
theological_decisions:
- issue: Антропоморфный образ Божьего действия
  choice: 'Сохранить: «Простри руку Твою с высоты»'
  alternative: «Вмешайся с небес»
  rationale: Оригинал изображает спасительное действие Бога через телесный образ; абстрактный пересказ устранил бы поэтическую конкретность.
- issue: Образ «многих вод»
  choice: Сохранить образ в основном тексте
  alternative: «от великой опасности»
  rationale: Воды могут метафорически обозначать непреодолимую угрозу, но перевод не должен молча заменять образ его толкованием.
- issue: Выражение בְּנֵי נֵכָר
  choice: Передать как «сынов чужеземцев»
  alternative: «чужеземцев»
  rationale: Основной текст сохраняет грамматически мужскую сыновнюю формулу, а сноска сообщает её идиоматическое значение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим регистром. Формы «простри» и «вызволи» понятны современному читателю и соответствуют молитвенной речи; местоимение, относящееся к Богу, написано с прописной буквы по принятой русской библейской традиции.
