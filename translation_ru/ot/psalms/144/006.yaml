lexical_decisions:
- source_word: בְּרוֹק בָּרָק
  choice: Блесни молнией
  rationale: Сохраняет однокоренную глагольно-именную конструкцию еврейского текста настолько, насколько это естественно по-русски, и передаёт яркий повелительный образ.
- source_word: וּתְפִיצֵם
  choice: и рассей их
  rationale: Порода hифиль глагола פוץ выражает причинение рассеяния; «рассей» естественно звучит в воинском и поэтическом контексте.
- source_word: שְׁלַח חִצֶּיךָ
  choice: пусти Свои стрелы
  rationale: По-русски «пустить стрелы» естественно передаёт действие שלח с оружием, не добавляя отсутствующего в оригинале содержания.
- source_word: וּתְהֻמֵּם
  choice: и приведи их в смятение
  rationale: Глагол המם может обозначать вызванные ужас, замешательство, панику или разгром. «Приведи в смятение» сохраняет каузативность и не сужает значение до одного лишь поражения.
theological_decisions:
- issue: Образ Бога-воителя
  choice: Сохранена прямая просьба к Богу действовать молнией и стрелами в воинской поэтике.
  alternative: Смягчить образ до общей просьбы о помощи или суде.
  rationale: Еврейский текст прямо обращается к Богу с повелительными формами и использует воинские образы; их следует сохранить, не превращая поэтический язык в более отвлечённый.
- issue: Неопределённость значения וּתְהֻמֵּם
  choice: «приведи их в смятение»
  alternative: «обрати их в бегство» или «разгроми их»
  rationale: Выбранный вариант сохраняет диапазон между паникой, замешательством и поражением, не разрешая лексическую неоднозначность в пользу одного результата битвы.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной псалмовой образностью. Заглавная буква в «Свои» употреблена как уважительное обозначение принадлежности Богу; синтаксис краток и энергичен, в соответствии с параллелизмом стиха.
