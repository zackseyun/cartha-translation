base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/003.yaml
  text: O Yahweh[a], what is man that you know him[c][b], the son of man that you think of him?
translation:
  language: ru
  text: Яхве, что такое человек, что Ты знаешь его, и сын человеческий[a] — что Ты думаешь о нём?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сын смертного»; это поэтическое обозначение человека, подчёркивающее его хрупкость и смертность. Здесь оно употреблено в общем смысле, а не как мессианский титул.'
    reason: lexical_alternative
  - marker: b
    text: 'Ср. Псалом 8:4: этот стих близко перекликается с ним.'
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: В обращении передаёт стоящее в еврейском тексте имя YHWH в укоренённой русской библейской форме; звательная интонация выражена самим обращением.
- source_word: מָה אָדָם
  choice: что такое человек
  rationale: Сохраняет риторический вопрос о малости и незначительности человека перед Богом и звучит естественно по-русски.
- source_word: וַתֵּדָעֵהוּ
  choice: что Ты знаешь его
  rationale: 'Сохраняет основное значение ידע — «знать», не сужая его до одного из возможных оттенков: замечать, признавать или принимать во внимание.'
- source_word: בֶּן אֱנוֹשׁ
  choice: сын человеческий
  rationale: Сохраняет поэтический параллелизм и традиционный библейский оборот; в данном контексте выражение обозначает смертного человека вообще.
- source_word: וַתְּחַשְּׁבֵהוּ
  choice: что Ты думаешь о нём
  rationale: Передаёт חשב как «думать, принимать в расчёт, учитывать», сохраняя близость к исходной метафоре и параллель с «знаешь его».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господи
  alternative: Яхве
  rationale: Русская звательная форма «Господи» естественна, достойна и традиционно представляет тетраграмматон; вариант «Яхве» точнее воспроизводит личное имя, но менее укоренён в общелитературном библейском русском языке.
- issue: Значение выражения בֶּן אֱנוֹשׁ
  choice: общее обозначение смертного человека
  alternative: мессианский титул
  rationale: Параллелизм с אָדָם и контекст человеческой малости указывают здесь на родовое, а не титульное употребление.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной псалмовой интонации. Местоимение «Ты» написано с прописной буквы как принятая русская форма почтительного обращения к Богу. Синтаксический параллелизм оригинала сохранён.
