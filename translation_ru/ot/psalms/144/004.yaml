  text: Человек подобен дыханию[a]; дни его — как проходящая тень.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дуновению», «пару», «суете», «пустоте». Еврейское слово הֶבֶל подчёркивает краткость, неуловимость и непрочность человеческой жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָדָם
  choice: человек
  rationale: В контексте это обобщённое обозначение человека как смертного существа. Русское «человек» естественно передаёт и единственное число, и родовое значение еврейского слова.
- source_word: לַהֶבֶל
  choice: подобен дыханию
  rationale: הֶבֶל буквально обозначает дыхание, дуновение или пар и образно выражает краткость и неуловимость. «Дыхание» сохраняет конкретный поэтический образ, не сводя его к более отвлечённым понятиям «суета» или «пустота».
- source_word: דָּמָה
  choice: подобен
  rationale: Глагол означает «быть подобным, походить». «Подобен» сохраняет прямое сравнение и соответствует возвышенному, но понятному поэтическому регистру.
- source_word: יָמָיו
  choice: дни его
  rationale: Буквально «его дни»; речь идёт о продолжительности человеческой жизни. Постпозиция местоимения поддерживает поэтический ритм и ясную связь с «человеком».
- source_word: כְּצֵל
  choice: как … тень
  rationale: Предлог כְּ вводит сравнение. Русская конструкция «как … тень» естественно сохраняет образ эфемерности.
- source_word: עוֹבֵר
  choice: проходящая
  rationale: Причастие от עבר передаёт тень как движущуюся, проходящую мимо. «Проходящая» ближе к форме и образу оригинала, чем более толковательное «мимолётная».
