  text: מְזָוֵ֣י/נוּ מְלֵאִים֮ מְפִיקִ֥ים מִ/זַּ֗ן אֶ֫ל זַ֥ן צֹאונֵ֣/נוּ מַ֭אֲלִיפוֹת מְרֻבָּב֗וֹת בְּ/חוּצוֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/013.yaml
  text: May our storehouses be full[a], supplying every kind of produce; may our flocks multiply by thousands, by tens of thousands[b], in our open fields.
translation:
  language: ru
  text: Пусть наши кладовые будут полны и дают припасы всякого рода[a]; пусть наши стада умножаются тысячами, десятками тысяч на открытых местах у нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от рода к роду»; речь идёт об изобилии разнообразных припасов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на наших улицах». Еврейское слово может обозначать улицы, открытые места или места за пределами поселения; пастушеский контекст допускает значение открытой местности или окраин.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזָוֵינוּ
  choice: наши кладовые
  rationale: Редкое существительное обозначает места хранения запасов; «кладовые» естественно и ясно передаёт этот смысл в земледельческом контексте.
- source_word: מְלֵאִים
  choice: будут полны
  rationale: Предикативное прилагательное «полны» передано в форме пожелания, согласующейся с контекстом благословения.
- source_word: מְפִיקִים
  choice: дают
  rationale: Причастие от глагола со значением «выводить, производить, доставлять» описывает изобилие, исходящее из кладовых; «дают» звучит естественно и сохраняет направленность наружу.
- source_word: מִזַּן אֶל זַן
  choice: припасы всякого рода
  rationale: Буквально «от рода к роду»; выражение указывает на разнообразие запасов или продуктов.
- source_word: צֹאנֵנוּ
  choice: наши стада
  rationale: Собирательное слово обозначает мелкий скот, прежде всего овец и коз; «стада» сохраняет собирательный смысл.
- source_word: מַאֲלִיפוֹת
  choice: умножаются тысячами
  rationale: Форма связана с числительным «тысяча» и в данном параллелизме выражает многочисленный приплод или увеличение стад.
- source_word: מְרֻבָּבוֹת
  choice: десятками тысяч
  rationale: Форма от רְבָבָה «десять тысяч» усиливает восходящий числовой параллелизм.
- source_word: בְּחוּצוֹתֵינוּ
  choice: на наших просторах
  rationale: חוּצוֹת может обозначать улицы, открытые места или места вне поселения. «На наших просторах» естественно подходит пастушескому контексту, не сужая значение до возделанных полей.
