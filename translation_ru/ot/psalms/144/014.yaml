source:
  edition: WLC
  text: אַלּוּפֵ֗י/נוּ מְֽסֻבָּ֫לִ֥ים אֵֽין פֶּ֭רֶץ וְ/אֵ֣ין יוֹצֵ֑את וְ/אֵ֥ין צְ֝וָחָ֗ה בִּ/רְחֹבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/014.yaml
  text: Our cattle are heavy with young[a]; there is no breach and no going out[c][b], and no cry in our streets.
translation:
  language: ru
  text: Наш скот тяжёл от приплода[a]; нет ни пролома, ни ухода[b], и нет крика на наших площадях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши волы нагружены». Еврейские слова допускают буквальный смысл «наши волы (или скот) обременены ношей»; в контексте благополучия эту строку часто понимают как указание на плодовитость и многочисленный приплод.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нет выхода», «никто не уходит» либо «нет изгнания». Еврейское выражение кратко и не уточняет, имеется ли в виду вынужденный уход из города или иной выход.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַלּוּפֵינוּ
  choice: наш скот
  rationale: Хотя слово может обозначать вождей или предводителей, сочетание с מְסֻבָּלִים и контекст хозяйственного благополучия лучше всего поддерживают значение домашнего скота; русское собирательное «скот» не сужает его до одних волов.
- source_word: מְסֻבָּלִים
  choice: тяжёл от приплода
  rationale: Причастие буквально означает «нагруженные, обременённые». В контексте изобилия выражение передаёт представление о скоте, тяжёлом от потомства, сохраняя образ тяжести.
- source_word: אֵין פֶּרֶץ
  choice: нет пролома
  rationale: Пֶרֶץ обозначает пролом, брешь или прорыв; «пролом» естественно соответствует контексту безопасности поселения и не уточняет сверх текста, идёт ли речь именно о стене.
- source_word: וְאֵין יוֹצֵאת
  choice: ни ухода
  rationale: Еврейское выражение кратко и эллиптично, буквально связано с выходом или уходом. Существительное «уход» сохраняет безличность и допускает как обычный выход, так и вынужденное удаление или изгнание.
- source_word: וְאֵין צְוָחָה
  choice: и нет крика
  rationale: צְוָחָה — крик или вопль, обычно вызванный бедствием. Нейтральное «крик» звучит естественно, а отрицательный контекст передаёт оттенок бедствия.
- source_word: בִּרְחֹבֹתֵינוּ
  choice: на наших площадях
  rationale: רְחֹבוֹת обозначает широкие открытые места, улицы или городские площади. «Площади» подчёркивает общественное пространство и хорошо соответствует древнему городскому контексту.
theological_decisions:
- issue: Неясный характер «ухода» в וְאֵין יוֹצֵאת
  choice: Сохранить общее «ни ухода» и пояснить варианты в примечании.
  alternative: Уточнить как «нет изгнания» или «никто не выходит».
  rationale: Исходный текст не называет ни субъекта, ни причины выхода; прямое отождествление с изгнанием или военным выступлением устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом псалма. Повтор отрицаний передан конструкцией «нет ни… ни…», а неоднозначные хозяйственный и общественно-политический образы сохранены и пояснены в примечаниях.
