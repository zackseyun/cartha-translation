  text: чьи уста говорят пустое[a] и чья правая рука — правая рука лжи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорят ложь». Еврейское слово может означать пустоту, тщету или обман.'
