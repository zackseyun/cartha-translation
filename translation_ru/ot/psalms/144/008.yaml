lexical_decisions:
- source_word: אֲשֶׁר
  choice: чьи / чья
  rationale: Относительная частица вводит характеристику чужеземцев из предыдущего стиха; согласованные формы «чьи» и «чья» естественно передают притяжательное отношение в обеих частях параллелизма.
- source_word: פִּיהֶם
  choice: их уста (в конструкции «чьи уста»)
  rationale: Еврейский текст буквально имеет существительное в единственном числе с суффиксом 3-го лица множественного числа («их рот»), но русское «уста» сохраняет собирательный смысл и соответствует возвышенному поэтическому регистру псалма.
- source_word: דִּבֶּר
  choice: говорят
  rationale: Перфект в описательной относительной конструкции обозначает характерное действие; настоящее время по-русски передаёт это естественно.
- source_word: שָׁוְא
  choice: пустое
  rationale: Слово охватывает значения пустоты, тщеты и обмана. Субстантивированное «пустое» сохраняет широту значения и не дублирует однозначно «ложь» во второй строке.
- source_word: וִימִינָם
  choice: и чья правая рука
  rationale: Повтор относительной конструкции сохраняет синтаксический параллелизм и ясно связывает обе характеристики с теми же людьми.
- source_word: יְמִין
  choice: рука
  rationale: В сказуемой части «рука лжи» повтор русского определения «правая» был бы тяжеловесен; ключевой образ правой руки остаётся в подлежащем, а структура исходного повтора поясняется в сноске.
- source_word: שָׁקֶר
  choice: ложь
  rationale: «Ложь» естественно и точно передаёт значение неправды и обмана, сохраняя абстрактную характеристику выражения.
