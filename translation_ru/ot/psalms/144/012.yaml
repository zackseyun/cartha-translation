  source_fidelity: Первая половина в целом точно передаёт пожелательный характер אֲשֶׁר и образ сыновей как хорошо выросших насаждений в пору их юности. Во второй половине исходный текст говорит об угловых архитектурных элементах, «высеченных/обработанных по образцу (по форме, образцу устройства) дворца». Формулировка черновика «резные угловые столпы дворца» меняет эту связь на принадлежность столпов дворцу и опускает תַּבְנִית («образец, форма, устройство»).
  naturalness: «Пусть наши сыновья в юности будут как хорошо выросшие растения» звучит естественно в современном литературном и поэтическом русском. «Угловые колонны, высеченные по образцу дворца» ясно сохраняет архитектурный образ и является более естественным, чем «угловые столпы дворца», при этом не навязывает значение «краеугольные камни».
