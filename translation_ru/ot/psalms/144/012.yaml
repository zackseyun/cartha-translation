  text: אֲשֶׁ֤ר בָּנֵ֨י/נוּ כִּ/נְטִעִים֮ מְגֻדָּלִ֪ים בִּֽ/נְעוּרֵ֫י/הֶ֥ם בְּנוֹתֵ֥י/נוּ כְ/זָוִיֹּ֑ת מְ֝חֻטָּב֗וֹת תַּבְנִ֥ית הֵיכָֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/012.yaml
  text: May our sons be like well-grown plants in their youth[c][b][a], and our daughters like corner pillars carved in the pattern of a palace.
translation:
  language: ru
  text: Пусть наши сыновья в юности будут как хорошо выросшие растения, а наши дочери — как угловые колонны, высеченные по образцу дворца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храма». Еврейское слово может обозначать дворец, храм или величественный зал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: Пусть
  rationale: Формально это относительная частица, но здесь она продолжает молитвенное пожелание; по-русски оптативный смысл естественно передаётся словом «пусть».
- source_word: בָּנֵינוּ
  choice: наши сыновья
  rationale: Существительное прямо обозначает сыновей и образует параллель с «нашими дочерьми».
- source_word: כִּנְטִעִים מְגֻדָּלִים
  choice: как пышно выросшие растения
  rationale: Образ указывает на насаждения, достигшие хорошего роста; «пышно выросшие» передаёт успешное, заметное развитие, не сужая образ до деревьев.
- source_word: בִּנְעוּרֵיהֶם
  choice: в юности
  rationale: Фраза обозначает период молодости, когда сыновья уподобляются хорошо выросшим растениям.
- source_word: בְּנוֹתֵינוּ
  choice: наши дочери
  rationale: Точно сохраняет родственное и гендерное значение исходного слова.
- source_word: כְזָוִיּוֹת
  choice: как угловые столпы
  rationale: Буквально слово связано с углом; в архитектурном сравнении «угловые столпы» естественно выражает образ заметных опорных элементов, не превращая их однозначно в краеугольные камни.
- source_word: מְחֻטָּבוֹת
  choice: резные
  rationale: Причастие обозначает обработанные высеканием или резьбой архитектурные элементы; «резные» хорошо передаёт изящество образа.
- source_word: תַּבְנִית הֵיכָל
  choice: дворца
  rationale: В сочетании с «резными угловыми столпами» выражение описывает их как выполненные по облику или устройству величественного здания. В русском это естественно и сжато передаётся родительным определением; возможность значения «храм» отмечена в сноске.
theological_decisions:
- issue: Значение הֵיכָל в архитектурном сравнении дочерей
  choice: дворец
  alternative: храм; величественный зал
  rationale: Контекст семейного и общественного благополучия допускает светский образ дворца и не требует культового прочтения. Поскольку слово действительно может обозначать храм, эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Сохранён параллелизм двух частей стиха; архитектурный образ передан без излишней технической конкретизации.
