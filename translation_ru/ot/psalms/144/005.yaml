  text: יְ֭הוָה הַט שָׁמֶ֣י/ךָ וְ/תֵרֵ֑ד גַּ֖ע בֶּ/הָרִ֣ים וְֽ/יֶעֱשָֽׁנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/005.yaml
  text: O Yahweh[a], bend your heavens and come down[b]; touch the mountains so that they smoke.
translation:
  language: ru
  text: Яхве, склони Свои небеса и сойди; коснись гор — и они задымятся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть они задымятся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: הַט שָׁמֶיךָ
  choice: склони Свои небеса
  rationale: Глагол נטה здесь изображает наклонение небес вниз; «склони» естественно сочетается с последующим призывом сойти и сохраняет возвышенную поэтичность.
- source_word: וְתֵרֵד
  choice: и сойди
  rationale: Форма передаёт движение сверху вниз; «сойди» точно и уместно для молитвенного поэтического обращения.
- source_word: גַּע בֶּהָרִים
  choice: коснись гор
  rationale: Сохранено основное значение נגע «касаться» без усиления до «поразить», которого сам текст не требует.
- source_word: וְיֶעֱשָׁנוּ
  choice: и они задымятся
  rationale: Последующая глагольная форма естественно передаёт результат Божьего прикосновения; будущее совершенного вида сохраняет живую последовательность образов.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Модальность וְיֶעֱשָׁנוּ после повеления
  choice: и они задымятся
  alternative: пусть они задымятся
  rationale: Форму можно понимать как указание на последующий результат или как продолжение волеизъявления. Основной текст передаёт наиболее естественную здесь результативную связь, а альтернативу сохраняет примечание.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной псалмовой интонацией. Местоимение «Свои» сохраняет притяжательное значение еврейского суффикса и делает фразу естественной по-русски; тире подчёркивает следствие прикосновения.
