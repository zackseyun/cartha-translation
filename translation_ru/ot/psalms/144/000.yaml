  yaml_path: translation/ot/psalms/144/000.yaml
  text: Of David. Blessed is Yahweh[a], my rock, who trains my hands for battle, my fingers for war.
translation:
  language: ru
  text: 'Давида.[a]


    Благословен Господь, скала моя,

    обучающий мои руки битве,

    пальцы мои — войне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Для Давида», «Давидов»; еврейский предлог в заголовке может указывать на авторство, связь с Давидом или посвящение ему.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая традиционная форма заголовка сохраняет естественную для русского библейского стиля неоднозначность: авторство, принадлежность или посвящение разъяснены в сноске.'
- source_word: יְהוָה
  choice: Господь
  rationale: Передача тетраграмматона словом «Господь» соответствует укоренившейся русской библейской практике и сохраняет достоинство регистра.
- source_word: צוּרִי
  choice: скала моя
  rationale: Конкретный образ скалы точнее передаёт צוּר, чем более общее «твердыня», и сохраняет метафору источника защиты и устойчивости.
- source_word: הַמְלַמֵּד
  choice: обучающий
  rationale: Причастная форма отражает еврейское причастие и характеризует продолжающееся действие Господа.
- source_word: לַקְרָב / לַמִּלְחָמָה
  choice: битве / войне
  rationale: Сохранён поэтический параллелизм двух близких, но не тождественных военных понятий.
theological_decisions:
- issue: Значение לְ в надписании לְדָוִד
  choice: Давида
  alternative: Для Давида; Давидова; Псалом Давида
  rationale: Основной текст не закрепляет исключительно авторское понимание предлога; возможные отношения авторства, связи и посвящения отмечены в сноске.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбрана общепонятная русская литургико-библейская передача без добавления конфессионального толкования; речь именно о личном имени Бога ясна из источника, но форма «Господь» естественнее для широкой русской аудитории.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим синтаксисом. Строки оформлены как параллельные стихотворные члены; инверсия «скала моя» сохраняет достоинство и ритм без архаизации.
