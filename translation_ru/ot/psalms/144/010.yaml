  text: the one who gives salvation to kings[b][a], who rescues David his servant from the evil sword.
translation:
  language: ru
  text: Тот, кто дарует спасение[a] царям, кто избавляет Давида, Своего слугу, от губительного меча[b].
  philosophy: optimal-equivalence
  footnotes:
