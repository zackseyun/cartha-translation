    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתֵן
  choice: Тот, кто дарует
  rationale: Причастие qal с артиклем употреблено субстантивно и указывает на Бога как на «Того, кто дарует». Такая передача сохраняет причастный характер выражения и естественно звучит по-русски.
- source_word: תְּשׁוּעָה
  choice: спасение
  rationale: Слово может обозначать спасение, избавление или победу. «Спасение» сохраняет широту значения, не исключая подразумеваемого здесь военного избавления.
- source_word: לַמְּלָכִים
  choice: царям
  rationale: 'Предлог ל обозначает косвенный объект: Бог дарует спасение царям.'
- source_word: הַפּוֹצֶה
  choice: кто избавляет
  rationale: Причастие передаёт действие освобождения или спасения от опасности. «Избавляет» естественно сочетается с последующим «от меча».
- source_word: אֶת דָּוִד
  choice: Давида
  rationale: Передано стандартной русской формой имени; אֶת отмечает прямое дополнение.
- source_word: עַבְדּוֹ
  choice: Своего слугу
  rationale: В отношении Давида עבד является обозначением его служения и подчинённости Богу. «Слуга» передаёт этот смысл без излишнего акцента на рабском статусе; возвратное «Своего» однозначно относит Давида к действующему лицу.
- source_word: מֵחֶרֶב
  choice: от меча
  rationale: Предлог מן указывает на удаление от опасности или избавление от неё; меч выступает как орудие смертельной угрозы.
- source_word: רָעָה
  choice: злого
  rationale: Буквальное значение прилагательного — «злой, плохой». Формулировка сохраняет необычный образ оригинала и не сводит его только к значению «смертоносный».
theological_decisions:
- issue: Объём значения תְּשׁוּעָה в царском и военном контексте
  choice: спасение
  alternative: избавление; победа
  rationale: Контекст царей и спасения Давида от меча допускает военный оттенок, однако слово имеет более широкое значение. «Спасение» сохраняет эту богословскую широту.
- issue: Передача עַבְדּוֹ применительно к Давиду
  choice: Своего слугу
  alternative: Своего раба
  rationale: Здесь слово служит царским и заветным обозначением принадлежности Давида Богу и его служения Ему. «Слуга» ясно передаёт отношение служения, не усиливая без необходимости оттенок порабощения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмовым звучанием. Повтор «кто» сохраняет параллельные причастные определения оригинала. Заглавная буква в «Своего» следует принятой русской издательской норме для местоимения, относящегося к Богу.
