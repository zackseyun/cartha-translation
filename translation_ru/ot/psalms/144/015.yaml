  text: אַשְׁרֵ֣י הָ֭/עָם שֶׁ/כָּ֣כָה לּ֑/וֹ אַֽשְׁרֵ֥י הָ֝/עָ֗ם שֶׁ/יֲהוָ֥ה אֱלֹהָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/144/015.yaml
  text: Blessed are the people for whom it is so[b][a]; blessed are the people whose God is Yahweh.
translation:
  language: ru
  text: Блажен[a] народ, у которого всё так; блажен народ, чей Бог — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Счастлив».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: блажен
  rationale: Форма блаженства обозначает завидное состояние благополучия и Божьего благоволения. «Блажен» сохраняет возвышенный поэтический строй и в русском естественно согласуется с собирательным существительным «народ» в единственном числе.
- source_word: הָעָם
  choice: народ
  rationale: עָם обозначает народ как общность; «народ» точнее и естественнее здесь, чем более политически окрашенное «нация».
- source_word: שֶׁכָּכָה לּוֹ
  choice: у которого всё так
  rationale: Оборот буквально выражает мысль «для которого/у которого так». Русское «у которого всё так» сохраняет отсылку к описанному выше благополучию, не уточняя сверх текста, что именно имеется в виду.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
- source_word: אֱלֹהָיו
  choice: чей Бог
  rationale: Местоименный суффикс мужского рода единственного числа относится к собирательному «народу»; краткая конструкция «чей Бог» естественно передаёт принадлежность.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога. «Яхве» сохраняет имя и не превращает его в титул.
- issue: Характер блаженства в אַשְׁרֵי
  choice: блажен
  alternative: счастлив
  rationale: «Блажен» сохраняет формулу библейского блаженства, не сводя смысл только к субъективному чувству счастья.
translation_notes:
  register: Современный литературный русский с сохранением краткой параллельной структуры еврейского стиха. Выражение «у которого всё так» намеренно сохраняет указательную неопределённость исходного כָּכָה и связывает стих с предшествующим описанием благополучия.
