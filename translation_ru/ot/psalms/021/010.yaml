  text: פִּ֭רְיָ/מוֹ מֵ/אֶ֣רֶץ תְּאַבֵּ֑ד וְ֝/זַרְעָ֗/ם מִ/בְּנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/010.yaml
  text: You will destroy their fruit from the earth[a], and their offspring from among the sons of man.
translation:
  language: ru
  text: Ты истребишь их плод с земли[a] и их потомство — из среды сынов человеческих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из страны».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть из среды людей, из человечества. Буквально: «из сынов человека».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּרְיָמוֹ
  choice: их плод
  rationale: Сохраняется конкретная поэтическая метафора «плод»; в параллели с «потомством» она обозначает продолжение рода, но перевод не устраняет образность оригинала.
- source_word: מֵאֶרֶץ
  choice: с земли
  rationale: אֶרֶץ может означать как «землю» вообще, так и определённую «страну». В широком контексте царского суда естественнее «земля», а возможное более узкое значение отмечено в сноске.
- source_word: תְּאַבֵּד
  choice: Ты истребишь
  rationale: Порода пиэль выражает причинное действие — «погубить, уничтожить». «Истребишь» естественно сочетается с полным уничтожением потомства и сохраняет прямое обращение во втором лице единственного числа.
- source_word: וְזַרְעָם
  choice: их потомство
  rationale: זֶרַע буквально значит «семя», а применительно к людям — «потомство». Здесь ясное переносное значение поддерживается параллелизмом с «их плод».
- source_word: מִבְּנֵי אָדָם
  choice: из среды сынов человеческих
  rationale: Формулировка сохраняет грамматическую форму и поэтическую окраску еврейского выражения, которое обозначает людей вообще; более привычный смысл пояснён в сноске.
theological_decisions:
- issue: Передача אָדָם в выражении בְּנֵי אָדָם
  choice: сыны человеческие
  alternative: люди; человечество
  rationale: Еврейское выражение имеет обобщённый смысл и относится ко всему человеческому роду, но буквально и поэтически оформлено в мужском роде. Основной текст сохраняет эту форму, не ограничивая её смысл только мужчинами; идиоматическое понимание дано в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой образностью. «Истребишь» передаёт силу суда, «плод» сохраняет метафору оригинала, а «сыны человеческие» — его поэтическую форму; тире помогает ясно прочитать параллельную конструкцию.
