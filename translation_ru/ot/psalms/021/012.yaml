  text: Ибо Ты обратишь их вспять[a]; натянув Свои тетивы, Ты нацелишься им в лицо[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поставишь их плечом». Вероятно, образ означает, что враги обратятся в бегство, подставив спину; возможно также: они будут поставлены боком как мишени.'
    reason: lexical_alternative
