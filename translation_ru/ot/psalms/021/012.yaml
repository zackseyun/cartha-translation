    text: 'Или: «Своими тетивами Ты приготовишь [лук или стрелы] против их лиц». Еврейская фраза выражена сжато: «тетивы» могут подразумевать натягивание лука, а глагол — «приготовить, направить» или «нацелиться».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для высказанной ранее уверенности; «ибо» сохраняет логическую связь и соответствует возвышенному, но понятному стилю псалма.
- source_word: תְּשִׁיתֵמוֹ שֶׁכֶם
  choice: Ты заставишь их повернуться спиной
  rationale: Глагол שׁית буквально означает «поставить, сделать», а שׁכם — «плечо, спина». В военном контексте сочетание, вероятно, изображает обращение врагов в бегство или их разворот спиной.
- source_word: בְּמֵיתָרֶיךָ
  choice: тетивами Своих луков
  rationale: מֵיתָר означает «шнур, тетива». Контекст прицеливания указывает на тетивы луков; слово «луков» добавлено как естественное по-русски пояснение подразумеваемого предмета.
- source_word: תְּכוֹנֵן
  choice: Ты прицелишься
  rationale: Форма от כון может означать «приготовить, направить». В контексте тетив и противника «прицелишься» естественно передаёт вероятное действие, не устраняя более буквальную возможность «приготовишь».
- source_word: עַל־פְּנֵיהֶם
  choice: им в лицо
  rationale: Буквально — «против/на их лица». Русское «им в лицо» сохраняет яркую направленность образа и враждебный контекст.
theological_decisions:
- issue: Соотношение двух полустиший
  choice: Сохранить их как соположенные действия, разделённые точкой с запятой
  alternative: 'Передать второе действие как причину первого: «когда Ты прицелишься…»'
  rationale: Еврейский текст не содержит явного временного или причинного союза. Поэтому логическое напряжение между поворотом врагов спиной и прицеливанием им в лицо не устранено добавлением отсутствующей связи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим регистром. Заглавное «Ты» употреблено как традиционная русская форма обращения к Богу. Сжатость и параллелизм еврейской строки сохранены; неоднозначность образов вынесена в примечания.
