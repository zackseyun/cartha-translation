  text: כִּֽי הַ֭/מֶּלֶךְ בֹּטֵ֣חַ בַּ/יהוָ֑ה וּ/בְ/חֶ֥סֶד עֶ֝לְי֗וֹן בַּל יִמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/007.yaml
  text: For the king trusts in Yahweh[b][a], and through the steadfast love of the Most High he will not be shaken.
translation:
  language: ru
  text: Ведь царь уповает на Яхве и благодаря неизменной любви Всевышнего[a] не поколеблется[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полагаясь на неизменную любовь Всевышнего»; еврейский предлог допускает инструментальное и локативное понимание, а חֶסֶד можно также передать как «верность завету».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не сдвинется с места»; также возможно: «не пошатнётся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с предшествующим контекстом, не сужая её до строго причинного значения.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное обозначает царя, о котором говорится в псалме; в русском языке определённость ясна из контекста.
- source_word: בֹּטֵחַ
  choice: уповает
  rationale: Причастная форма выражает постоянное, характерное доверие; «уповает» естественно для возвышенной поэтической речи и означает уверенное доверие.
- source_word: בַּיהוָה
  choice: на Яхве
  rationale: Предлог обозначает Того, на кого направлено упование; личное имя יהוה передано как «Яхве».
- source_word: וּבְחֶסֶד
  choice: и благодаря неизменной любви
  rationale: חֶסֶד обозначает верную, стойкую любовь и милость; предлог בְּ здесь в основном тексте понят инструментально или причинно, однако возможное иное понимание отмечено в сноске.
- source_word: עֶלְיוֹן
  choice: Всевышнего
  rationale: Субстантивированное божественное именование естественно передаётся традиционным русским титулом «Всевышний».
- source_word: בַּל
  choice: не
  rationale: Поэтическая отрицательная частица передана без добавочного усиления.
- source_word: יִמּוֹט
  choice: не поколеблется
  rationale: Глагол описывает утрату устойчивости — движение, шатание или колебание; выбранный вариант сохраняет метафору и естественно звучит по-русски.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога יהוה; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Значение חֶסֶד
  choice: неизменная любовь
  alternative: верность завету; милость
  rationale: Выбранное выражение передаёт стойкую и верную любовь, не сводя многозначное слово исключительно к юридической категории завета или к милосердию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, псалмическим звучанием. «Уповает» и «не поколеблется» сохраняют достоинство и образность оригинала, оставаясь понятными современному читателю.
