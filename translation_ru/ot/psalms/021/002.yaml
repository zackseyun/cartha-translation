lexical_decisions:
- source_word: תַּאֲוַת לִבּוֹ
  choice: желание его сердца
  rationale: Сочетание буквально обозначает внутреннее желание человека; такой порядок слов естественен для возвышенной современной русской речи и сохраняет образ сердца.
- source_word: נָתַתָּה לּוֹ
  choice: Ты исполнил
  rationale: Буквально глагол означает «дал», однако по-русски желание обычно «исполняют». Выбор естественно передаёт смысл дарованного просимого, не меняя направленности действия.
- source_word: וַאֲרֶשֶׁת
  choice: просьбы
  rationale: Редкое существительное, вероятно, обозначает высказанную просьбу или прошение и образует параллель внутреннему желанию сердца.
- source_word: שְׂפָתָיו
  choice: его уст
  rationale: Сохранён еврейский образ уст как органа, которым произносится просьба; «уста» соответствует поэтическому регистру псалма.
- source_word: בַּל מָנַעְתָּ
  choice: не отверг
  rationale: Глагол буквально значит «удержал, воспрепятствовал, отказал». В сочетании с просьбой «не отверг» звучит естественно и передаёт отсутствие отказа, хотя менее буквально, чем «не удержал».
- source_word: סֶּלָה
  choice: Села
  rationale: Термин передан транслитерацией, поскольку его точное значение и литургическая или музыкальная функция остаются неясными.
