  text: ר֣וּמָ/ה יְהוָ֣ה בְּ/עֻזֶּ֑/ךָ נָשִׁ֥ירָה וּֽ֝/נְזַמְּרָה גְּבוּרָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/013.yaml
  text: Be exalted[a], O Yahweh[b], in your strength! We will sing and make music to your might.
translation:
  language: ru
  text: Вознесись[a], Яхве, в силе Твоей! Будем петь и воспевать Твоё могущество.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Восстань, Яхве, в силе Твоей!» Еврейский глагол может выражать призыв как возвыситься, так и подняться для действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוּמָה
  choice: Вознесись
  rationale: Форма от רום обращена к Богу и может выражать призыв явить Себя возвышенным. «Вознесись» сохраняет образ высоты и естественно звучит в контексте хвалы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не замещающий его титул.
- source_word: בְּעֻזֶּךָ
  choice: в силе Твоей
  rationale: Предлог ב допускает значение сферы или средства; буквальная и поэтически естественная формулировка сохраняет эту смысловую широту.
- source_word: נָשִׁירָה וּנְזַמְּרָה
  choice: Будем петь и воспевать
  rationale: Когортативные формы передают решимость или совместное побуждение. Будущее время здесь естественно выражает решительный ответ поклоняющихся; «воспевать» передаёт музыкально-хвалебный оттенок זמר.
- source_word: גְּבוּרָתֶךָ
  choice: Твоё могущество
  rationale: Слово обозначает мощь, могущество или проявленную доблесть. «Могущество» отличает его от עֹז, уже переданного словом «сила», и служит прямым дополнением к глаголам пения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл призыва רוּמָה
  choice: Вознесись
  alternative: Восстань
  rationale: Контекст допускает как призыв к возвышению, так и призыв подняться для действия. Основной вариант подчёркивает прославление Бога, а альтернативный сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Сохранены параллелизм, обращение к Богу и различие между «силой» и «могуществом»; местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции.
