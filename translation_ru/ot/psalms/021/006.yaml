  text: כִּֽי תְשִׁיתֵ֣/הוּ בְרָכ֣וֹת לָ/עַ֑ד תְּחַדֵּ֥/הוּ בְ֝/שִׂמְחָ֗ה אֶת פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/006.yaml
  text: For you make him blessings forever[b][a]; you gladden him with joy in your presence.
translation:
  language: ru
  text: Ибо Ты делаешь его навеки преисполненным благословений[a]; Ты радуешь его радостью в Своём присутствии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «делаешь его благословениями навеки». Возможно также: «навеки возлагаешь на него благословения» или «навеки делаешь его благословением». Еврейское выражение может говорить как о дарованных царю благословениях, так и о том, что он сам становится воплощением или источником благословения.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт причинно-пояснительную связь с предыдущим стихом и соответствует возвышенному, но понятному стилю псалма.
- source_word: תְשִׁיתֵהוּ בְרָכוֹת
  choice: делаешь его преисполненным благословений
  rationale: Естественно передаёт необычную еврейскую конструкцию «делаешь его благословениями», сохраняя множественное число и идею изобилия; возможные иные смысловые оттенки вынесены в сноску.
- source_word: לָעַד
  choice: навеки
  rationale: Краткий и обычный русский эквивалент значения неограниченной длительности.
- source_word: תְּחַדֵּהוּ
  choice: радуешь его
  rationale: 'Передаёт каузативное значение породы пиэль: Бог вызывает у царя радость.'
- source_word: בְשִׂמְחָה
  choice: радостью
  rationale: Сохраняет однокоренное смысловое усиление «радуешь… радостью», присутствующее в еврейском тексте.
- source_word: אֶת־פָּנֶיךָ
  choice: в Своём присутствии
  rationale: Естественно по-русски передаёт идиоматический смысл выражения, буквально связанного с Божьим лицом.
theological_decisions:
- issue: Смысл выражения תְשִׁיתֵהוּ בְרָכוֹת
  choice: Царь представлен преисполненным Божьих благословений.
  alternative: Бог делает царя благословением или источником благословений.
  rationale: Еврейская конструкция допускает как полученные царём благословения, так и его превращение в воплощение или источник благословения. Основной текст остаётся естественным по-русски, а сноска сохраняет смысловую и богословскую открытость, не ограничивая стих исключительно материальным или мессианским прочтением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы. Сохранено смысловое усиление «радуешь… радостью», хотя в обычной прозе оно могло бы показаться избыточным.
