  yaml_path: translation/ot/psalms/021/008.yaml
  text: Your hand will find all your enemies[a]; your right hand will find those who hate you.
translation:
  language: ru
  text: Твоя рука найдёт всех твоих врагов[a]; твоя правая рука найдёт тех, кто ненавидит тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «достигнет» или «настигнет». Еврейское слово «найдёт» в этом контексте может подразумевать, что рука успешно настигнет врагов и овладеет ими.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: найдёт
  rationale: Основное значение глагола מצא — «найти». В военном контексте он может подразумевать, что рука успешно достигнет или настигнет врагов; буквальный выбор сохраняет еврейский образ и его смысловую ёмкость.
- source_word: יָדְךָ
  choice: твоя рука
  rationale: Конкретный образ руки сохранён как обозначение действенной силы и власти того, к кому обращён псалом.
- source_word: לְכָל
  choice: всех
  rationale: Передаёт всеохватность כל и естественно сочетается по-русски с выражением «твоих врагов».
- source_word: אֹיְבֶיךָ
  choice: твоих врагов
  rationale: Прямой современный эквивалент существительного אויב с сохранением обращения во втором лице единственного числа.
- source_word: יְמִינְךָ
  choice: твоя правая рука
  rationale: Сохраняет параллелизм и традиционный древнееврейский образ правой руки как силы и победоносного действия, не прибегая к архаизму «десница».
- source_word: שֹׂנְאֶיךָ
  choice: тех, кто ненавидит тебя
  rationale: Передаёт глагольный оттенок причастия и звучит естественно в современном русском языке, не сводя выражение к повтору слова «враги».
theological_decisions:
- issue: Антропоморфный образ руки как выражение божественной или царской силы в царском псалме
  choice: Сохранены конкретные образы «рука» и «правая рука».
  alternative: «Твоя сила настигнет всех твоих врагов».
  rationale: Исходный текст не уточняет здесь окончательно, понимается ли адресат исключительно как земной царь или также в более широком богословском смысле. Сохранение телесного образа и строчных местоимений не устраняет эту напряжённость и не заменяет поэзию абстрактным толкованием.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма. Выражение «правая рука» предпочтено архаичному «десница». Местоимения второго лица даны со строчной буквы, поскольку сам стих допускает непосредственное обращение к царю и не требует заранее отождествлять адресата исключительно с Богом.
