  text: Ибо они задумали против Тебя зло[a], составили коварный план[b], но не смогли его осуществить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «протянули (или: направили) против Тебя зло». Это еврейское выражение означает, что они намеревались причинить Тебе зло.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «замыслили злое, но не смогли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего утверждения; «ибо» сохраняет пояснительную связь и соответствует возвышенному поэтическому регистру.
- source_word: נָטוּ
  choice: задумали
  rationale: Буквально глагол означает «протянули, направили», но в сочетании с רָעָה и עַל выражает направленное против кого-либо злое намерение. «Задумали» естественно передаёт этот смысл по-русски.
- source_word: עָלֶיךָ
  choice: против Тебя
  rationale: Предлог עַל при враждебном действии естественно передаётся как «против».
- source_word: רָעָה
  choice: зло
  rationale: Слово обозначает здесь зло, задуманное врагами, и сохраняет нравственную окраску, не сводя смысл лишь к вреду или бедствию.
- source_word: חָשְׁבוּ
  choice: составили
  rationale: В данном контексте глагол означает обдумывание и разработку намерения; в сочетании с «план» русское «составили» избегает тавтологии с «задумали» в первой строке.
- source_word: מְזִמָּה
  choice: коварный план
  rationale: Существительное может означать замысел, план или интригу; отрицательная окраска здесь определяется враждебным контекстом. «Коварный план» ясно передаёт рассчитанный злой умысел.
- source_word: בַּל
  choice: но не
  rationale: Поэтическое отрицание передано с противительным «но», подчёркивающим контраст между замыслом врагов и их неспособностью осуществить его.
- source_word: יוּכָלוּ
  choice: не смогли его осуществить
  rationale: 'Глагол буквально означает «быть способным». Подразумеваемое действие восстановлено из предыдущей части: враги не смогли осуществить задуманный план.'
