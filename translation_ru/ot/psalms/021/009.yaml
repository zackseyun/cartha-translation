  yaml_path: translation/ot/psalms/021/009.yaml
  text: You will make them like a fiery furnace at the time of your presence; Yahweh in his anger will swallow them up[a], and fire will consume them.
translation:
  language: ru
  text: Ты сделаешь их подобными огненной печи во время Твоего явления[a]. Яхве во гневе Своём поглотит их, и огонь пожрёт их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во время лица Твоего»; возможно также: «во время присутствия Твоего».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשִׁיתֵמוֹ
  choice: Ты сделаешь их
  rationale: Глагол שׁית означает «ставить, помещать, делать»; при сравнительном именном сказуемом естественное русское «сделаешь их» передаёт наступившее состояние.
- source_word: כְּתַנּוּר אֵשׁ
  choice: словно огненной печью
  rationale: תנור обозначает печь или горн; сочетание с אֵשׁ создаёт образ печи, пылающей огнём. Творительный падеж после «сделаешь» естественен в современном русском.
- source_word: לְעֵת פָּנֶיךָ
  choice: во время явления Твоего
  rationale: Буквально «во время лица Твоего»; פָּנִים здесь может обозначать присутствие или явление. «Явления Твоего» естественно передаёт момент, когда адресат предстаёт перед врагами, не превращая выражение в специальный эсхатологический термин.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בְּאַפּוֹ
  choice: во гневе Своём
  rationale: אַף буквально связано с носом, но в данной идиоме означает гнев. Русская формулировка ясно передаёт смысл.
- source_word: יְבַלְּעֵם
  choice: поглотит их
  rationale: בלע означает «проглотить, поглотить». Сохранён яркий образ, отличный от следующего действия огня.
- source_word: וְתֹאכְלֵם אֵשׁ
  choice: и огонь пожрёт их
  rationale: Глагол אכל буквально означает «есть, пожирать»; по отношению к огню «пожрёт» естественно и сохраняет образную силу оригинала.
theological_decisions:
- issue: Антропоморфное выражение «во время Твоего лица»
  choice: во время явления Твоего
  alternative: во время присутствия Твоего
  rationale: Перевод сохраняет идею явного предстояния адресата, но не уточняет сверх текста характер или эпоху этого явления. Буквальная форма отмечена в сноске.
- issue: Передача тетраграмматона
  choice: Яхве
  alternative: Господь
  rationale: Личное имя יְהוָה передано транслитерацией, а не заменено титулом.
- issue: Смена лица между обращением к царю и упоминанием Яхве
  choice: 'Сохранена: «Твоего» — затем «Яхве… Своём»'
  alternative: Истолковать все местоимения как относящиеся непосредственно к Яхве
  rationale: Еврейский текст сначала использует второе лицо мужского рода, а затем называет Яхве и говорит о Нём в третьем лице. Перевод не устраняет возможное различение царя и Бога.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Заглавные буквы в местоимениях сохраняют традиционный русский библейский регистр; синтаксис следует смене лица в еврейском тексте.
