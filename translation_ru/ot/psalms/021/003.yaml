source:
  edition: WLC
  text: כִּֽי תְ֭קַדְּמֶ/נּוּ בִּרְכ֣וֹת ט֑וֹב תָּשִׁ֥ית לְ֝/רֹאשׁ֗/וֹ עֲטֶ֣רֶת פָּֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/003.yaml
  text: For you meet him with blessings of good[c][b][a]; you set a crown of fine gold on his head.
translation:
  language: ru
  text: Ведь Ты встречаешь его благими благословениями[a]; возлагаешь на его голову венец из чистого золота[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты предваряешь его благими благословениями»; возможен также смысл: «Ты выходишь ему навстречу с благими благословениями». Еврейский глагол может означать как встречу, так и действие, совершённое заранее.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из отборного золота» или «из очищенного золота».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание сказанного ранее; «ведь» естественно связывает стих с контекстом и сохраняет пояснительный характер.
- source_word: תְקַדְּמֶנּוּ
  choice: Ты встречаешь его
  rationale: Глагол קדם в породе пиэль может означать встречать, выходить навстречу или предварять. Основной вариант естественен по-русски и сохраняет инициативу Бога; возможный оттенок предварения указан в сноске.
- source_word: בִּרְכוֹת טוֹב
  choice: благими благословениями
  rationale: Сохраняются множественное число «благословения» и широкое значение טוֹב — благо, добро, благость — без сведения выражения только к материальному достатку.
- source_word: תָּשִׁית
  choice: возлагаешь
  rationale: В сочетании с венцом русский глагол «возлагать» естественно передаёт действие помещения на голову и поддерживает достойный поэтический регистр.
- source_word: לְרֹאשׁוֹ
  choice: на его голову
  rationale: Предлог ל при глаголе помещения в данном контексте естественно передаётся русским «на».
- source_word: עֲטֶרֶת
  choice: венец
  rationale: В царском псалме слово обозначает царский венец или корону; «венец» сохраняет поэтический и библейский регистр, оставаясь понятным современному читателю.
- source_word: פָּז
  choice: чистое золото
  rationale: Слово обозначает высококачественное золото. «Чистое золото» — ясный и естественный русский эквивалент; близкие варианты приведены в сноске.
theological_decisions:
- issue: Характер благословений, дарованных царю
  choice: Передать выражение широко как «благие благословения», не уточняя их содержание.
  alternative: Истолковать их только как материальное благополучие либо только как духовные или заветные благословения.
  rationale: Еврейское בִּרְכוֹת טוֹב охватывает благо в широком смысле; конкретизация сузила бы намеренно ёмкое выражение исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Сочетание «благими благословениями» намеренно сохраняет форму и смысловую широту еврейского выражения, несмотря на лёгкую стилистическую избыточность.
