  text: חַיִּ֤ים שָׁאַ֣ל מִ֭מְּ/ךָ נָתַ֣תָּה לּ֑/וֹ אֹ֥רֶךְ יָ֝מִ֗ים עוֹלָ֥ם וָ/עֶֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/004.yaml
  text: He asked life from you[b][a]; you gave it to him—length of days forever and ever.
translation:
  language: ru
  text: 'Он просил у Тебя жизни — Ты дал её ему: долготу дней[a] во веки веков.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «долгую жизнь»; буквально: «долготу дней».'
    reason: lexical_alternative
  - marker: b
    text: Слова «во веки веков» можно понимать как царскую гиперболу, говорящую о долгой жизни и прочном царствовании, или как слова, которые находят более полное исполнение в Мессии.
    reason: alternative_reading
lexical_decisions:
- source_word: חַיִּים
  choice: жизни
  rationale: Хотя существительное имеет форму множественного числа, здесь оно употреблено как отвлечённое понятие в значении «жизнь». Продолжительность жизни раскрывается далее отдельным выражением.
- source_word: שָׁאַל מִמְּךָ
  choice: просил у Тебя
  rationale: Глагол обозначает просьбу, а предлог מן указывает, у кого просят. Сочетание «просил у Тебя» естественно для современного русского языка.
- source_word: נָתַתָּה לּוֹ
  choice: Ты дал её ему
  rationale: Местоимение «её» естественно восполняет в русском языке подразумеваемый объект — «жизнь» — и сохраняет связь между двумя частями стиха.
- source_word: אֹרֶךְ יָמִים
  choice: долготу дней
  rationale: Близкая к буквальной передача сохраняет поэтический образ и приложение, поясняющее дарованную жизнь. Более гладкий вариант «долгую жизнь» отмечен в сноске.
- source_word: עוֹלָם וָעֶד
  choice: во веки веков
  rationale: Устойчивое русское библейское выражение передаёт усиленное обозначение неограниченной длительности и сохраняет возвышенный поэтический регистр.
theological_decisions:
- issue: Продолжительность жизни царя в царском псалме
  choice: 'Сохранить прямое выражение неограниченной длительности: «во веки веков».'
  alternative: Понимать слова только как царскую гиперболу о долгой жизни и правлении либо прямо отнести их к вечной жизни и царствованию Мессии.
  rationale: Еврейский текст не разрешает это напряжение внутри самого стиха. Перевод не должен ни ослаблять формулировку до простой гиперболы, ни вводить в основной текст явное мессианское истолкование.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Заглавная буква в местоимении «Тебя/Ты» используется как традиционный знак обращения к Богу; синтаксис сохраняет пояснительное развитие еврейской строки.
