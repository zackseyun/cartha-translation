  source_fidelity: 'Русский текст точно передаёт еврейскую последовательность: царь просил у Бога жизни, Бог дал её ему, а затем названо «долгота дней» с усиленным указанием на неограниченную длительность. Родительный падеж в «просил ... жизни» естественен по-русски и не меняет значения חַיִּים. «Во веки веков» адекватно передаёт עוֹלָם וָעֶד, не разрешая намеренно оставленное в тексте напряжение относительно характера этой длительности.'
