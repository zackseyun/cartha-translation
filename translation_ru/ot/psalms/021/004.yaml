  terminology: «Жизнь», «долгота дней» и «во веки веков» сохраняют библейско-поэтический регистр без архаизации, препятствующей пониманию. Заглавные формы обращения к Богу последовательны. Сноска о возможной царской гиперболе и мессианском исполнении воспроизводит английский аудиторский след и не навязывает ни одного толкования.
