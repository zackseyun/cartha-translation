  text: גָּד֣וֹל כְּ֭בוֹד/וֹ בִּ/ישׁוּעָתֶ֑/ךָ ה֥וֹד וְ֝/הָדָר תְּשַׁוֶּ֥ה עָלָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/021/005.yaml
  text: Great is his glory through your salvation[b][a]; you bestow splendor and majesty on him.
translation:
  language: ru
  text: Велика его слава благодаря Твоему спасению[a][b]; великолепием и величием Ты наделяешь его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через Твоё спасение», «посредством Твоего спасения» или «в Твоём спасении»; еврейский предлог может обозначать средство, основание или сферу.'
    reason: lexical_alternative
  - marker: b
    text: «Спасение» здесь можно также понимать как «избавление» или, в данном царском контексте, как «победу».
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: велика
  rationale: Предикативное прилагательное вынесено в начало строки для сохранения смыслового и поэтического акцента еврейского текста.
- source_word: כְּבוֹדוֹ
  choice: его слава
  rationale: כָּבוֹד обозначает славу и честь; «слава» естественно передаёт царский контекст и возвышенный регистр.
- source_word: בִּישׁוּעָתֶךָ
  choice: благодаря Твоему спасению
  rationale: Предлог ב допускает значение средства, основания или сферы. «Благодаря» естественно связывает славу царя со спасающим действием Бога, не исключая других оттенков, отмеченных в сносках.
- source_word: הוֹד
  choice: великолепием
  rationale: הוֹד выражает сияющее, царственное великолепие; творительный падеж естественно сочетается с глаголом «наделяешь».
- source_word: וְהָדָר
  choice: и величием
  rationale: הָדָר означает величие, достоинство и красоту. «Величие» сохраняет отличие от הוֹד и передаёт царственную окраску пары.
- source_word: תְּשַׁוֶּה
  choice: Ты наделяешь
  rationale: Глагол שׁוה с עַל здесь имеет смысл возложения или дарования. «Наделяешь» звучит естественно по-русски и передаёт дарование царских качеств Богом.
- source_word: עָלָיו
  choice: его
  rationale: Значение «на него» передано русской глагольной конструкцией «наделяешь его», избегающей неестественной кальки.
theological_decisions:
- issue: Значение יְשׁוּעָה в царском псалме
  choice: спасение
  alternative: избавление; победа
  rationale: «Спасение» сохраняет широкий основной смысл слова, тогда как в царском и военном контексте оно может конкретно подразумевать избавление или победу.
- issue: Значение предлога ב при בִּישׁוּעָתֶךָ
  choice: благодаря
  alternative: через; посредством; в
  rationale: Контекст позволяет понимать предлог как указание на средство, основание или сферу. Основной перевод выбран ради естественности, а подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Сохранены параллелизм, начальный акцент на величии славы и различие между двумя близкими царственными понятиями — «великолепием» и «величием».
