lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов это слово обозначает руководителя музыкального исполнения. Такой перевод естественен в современном русском языке и передаёт значение префикса ל как указание адресата.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Обычное жанровое обозначение псалма, связанного с музыкальным исполнением; «псалом» — точный и общепринятый русский эквивалент.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русское сочетание «Псалом Давида» сохраняет смысловую широту еврейской конструкции, которая может указывать на авторство, связь с Давидом или посвящение ему.
theological_decisions:
- issue: Значение надписания לְדָוִד
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида
  rationale: Еврейский предлог ל в надписаниях допускает несколько смыслов. Основной перевод не сводит выражение исключительно к прямому авторству или посвящению.
translation_notes:
  register: Краткое, dignified надписание в современном литературном русском языке. Формула «Руководителю хора» понятна обычному читателю, а «Псалом Давида» сохраняет традиционность и подлинную неоднозначность оригинала.
