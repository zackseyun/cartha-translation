  text: O Yahweh[a], in your strength the king rejoices, and in your salvation how greatly he exults!
translation:
  language: ru
  text: Яхве, силой Твоей радуется царь, и спасением Твоим[a] — как же сильно он ликует!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
