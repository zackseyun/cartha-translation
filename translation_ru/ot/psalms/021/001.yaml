lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога; в еврейском тексте оно стоит в прямом обращении. Русская запятая естественно выражает звательный характер без добавления междометия «о».
- source_word: בְּעָזְּךָ
  choice: Твоей силе
  rationale: Предлог בְּ здесь указывает на сферу или основание радости. Русская конструкция «радоваться силе» естественна и не сужает значение до средства действия.
- source_word: יִשְׂמַח
  choice: радуется
  rationale: Поэтический имперфект допускает настоящее, повторяющееся или перспективное значение. Настоящее время естественно для хвалы и согласуется с параллельным глаголом, не исключая смысловой направленности к будущему.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Хотя в еврейском нет артикля, контекст указывает на определённого царя; в русском это естественно передаётся без дополнительного указательного слова.
- source_word: וּבִישׁוּעָתְךָ
  choice: и Твоему спасению[a]
  rationale: יְשׁוּעָה охватывает значения спасения, избавления и победы. «Спасение» сохраняет широкий смысл, а дательный падеж поддерживает параллелизм с «Твоей силе».
- source_word: מַה ... מְאֹד
  choice: как же сильно
  rationale: מַה имеет восклицательно-усилительное значение, а מְאֹד усиливает степень. Сочетание «как же сильно» передаёт оба элемента естественным современным русским языком.
- source_word: יגיל
  choice: он ликует
  rationale: גיל обозначает особенно бурную, торжествующую радость. «Ликует» сохраняет усиление по сравнению с более общим «радуется».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет Тетраграмматон. «Яхве» сохраняет личное заветное имя, не заменяя его титулом и не вводя позднюю форму «Иегова».
- issue: Смысл יְשׁוּעָה
  choice: спасение
  alternative: избавление; победа
  rationale: Контекст царского псалма допускает военное избавление или победу, однако более широкое «спасение» сохраняет богословскую и лексическую ёмкость исходного слова; альтернативы указаны в сноске.
- issue: Временная отнесённость поэтических форм יִשְׂמַח и יגיל
  choice: 'настоящее время: «радуется… ликует»'
  alternative: 'будущее время: «будет радоваться… будет ликовать»'
  rationale: Еврейский имперфект в поэзии допускает как настоящее/характерное, так и перспективное прочтение. В контексте хвалы настоящее звучит естественно; перевод не добавляет временных указателей, которые жёстко закрепили бы одно толкование.
translation_notes:
  register: Современный литературный русский с возвышенным, но не архаичным поэтическим звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы по принятой русской библейской традиции. Тире подчёркивает восклицательное усиление второй строки и не добавляет нового смыслового отношения.
