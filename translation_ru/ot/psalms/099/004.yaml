lexical_decisions:
- source_word: וְעֹז
  choice: И сила
  rationale: Существительное עֹז обычно означает «сила, могущество». Буквальное существительное сохранено, чтобы не сглаживать сжатую и неоднозначную структуру начала стиха; союз וְ передан как «и», поскольку стих продолжает предшествующую поэтическую речь.
- source_word: מֶלֶךְ
  choice: Царя
  rationale: Родительный падеж естественно связывает слово с «силой». Заглавная буква указывает на Бога как Царя в контексте псалма, не добавляя нового значения.
- source_word: מִשְׁפָּט
  choice: правосудие / суд
  rationale: В первом употреблении «правосудие» естественно обозначает любимый Царём принцип справедливого правления; во втором «суд» сохраняет лексическое повторение на уровне корневого понятия и образует привычную библейскую пару с «праведностью».
- source_word: אָהֵב
  choice: любит
  rationale: 'Форма выражает постоянное свойство: Царь любит правосудие.'
- source_word: אַתָּה
  choice: Ты
  rationale: Явное местоимение сохранено для передачи эмфатического прямого обращения к Богу.
- source_word: כּוֹנַנְתָּ
  choice: утвердил
  rationale: Глагол כון здесь означает установить, прочно основать или утвердить; «утвердил» кратко и естественно передаёт завершённое действие.
- source_word: מֵישָׁרִים
  choice: справедливость
  rationale: Множественное абстрактное существительное обозначает прямоту, правоту и беспристрастность; в контексте правления естественно русское «справедливость». Возможное «правоту» отмечено в сноске.
- source_word: וּצְדָקָה
  choice: и праведность
  rationale: Сохранено отличие צְדָקָה от מִשְׁפָּט и традиционная смысловая пара «суд и праведность».
- source_word: בְּיַעֲקֹב
  choice: в Иакове
  rationale: Сохранены предлог и поэтическое заветное имя народа без поясняющей замены на «Израиль».
- source_word: עָשִׂיתָ
  choice: совершил Ты
  rationale: «Совершил» естественнее русского буквального «сделал» при дополнениях «суд и праведность»; постпозиция «Ты» сохраняет эмфазу повторного местоимения.
theological_decisions:
- issue: Синтаксическое истолкование сжатого оборота וְעֹז מֶלֶךְ
  choice: И сила Царя любит правосудие
  alternative: Могущественный Царь любит правосудие; Царь в Своём могуществе любит правосудие
  rationale: Основной текст сохраняет необычный образ и грамматическую напряжённость еврейского выражения, не превращая существительное עֹז безоговорочно в прилагательное. Более идиоматические разборы приведены в сноске.
- issue: Соотношение מִשְׁפָּט и צְדָקָה
  choice: суд и праведность
  alternative: правосудие и справедливость
  rationale: Выбранная пара не отождествляет два связанных, но различных понятия и сохраняет богословскую напряжённость между справедливым судом и праведностью.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвенной речи. Сохранены прямое обращение «Ты», параллелизм и намеренно необычное начало; инверсия в последней строке подчёркивает повторное אַתָּה.
