source:
  edition: WLC
  text: יְ֭הוָה בְּ/צִיּ֣וֹן גָּד֑וֹל וְ/רָ֥ם ה֝֗וּא עַל כָּל הָֽ/עַמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/002.yaml
  text: Yahweh is great in Zion[a], and he is exalted above all the peoples.
translation:
  language: ru
  text: Яхве велик на Сионе, и Он возвышен над всеми народами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он высок над всеми народами».'
    reason: Лексема רָם может обозначать как буквальную или образную высоту, так и возвышенное положение.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; «Яхве» — общепринятая современная русская транслитерация.
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: Предлог ב имеет местное значение; по-русски в библейской и литературной речи естественно говорить «на Сионе».
- source_word: גָּדוֹל
  choice: велик
  rationale: Прямо передаёт значение величия и сохраняет торжественный язык хвалы, не сужая смысл до одной лишь силы.
- source_word: וְרָם הוּא
  choice: и Он возвышен
  rationale: «Возвышен» передаёт высоту и превосходство; отдельное местоимение הוּא отражено явным «Он», сохраняющим поэтическое ударение.
- source_word: עַל כָּל הָעַמִּים
  choice: над всеми народами
  rationale: עַל выражает положение выше или превосходство, а עַמִּים обозначает народы, не обязательно политические государства.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Характер превосходства Яхве над народами
  choice: возвышен над всеми народами
  alternative: высок над всеми народами
  rationale: Формулировка сохраняет образ высоты и верховенства, не уточняя сверх текста, идёт ли речь о положении, власти или славе.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной псалмовой интонацией. Синтаксис сохраняет параллелизм двух полустиший и усилительное местоимение «Он».
