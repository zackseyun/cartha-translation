base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/001.yaml
  text: Yahweh reigns[a]; let the peoples tremble. He sits enthroned upon the cherubim[b]; let the earth quake.
translation:
  language: ru
  text: Яхве царствует[a] — да трепещут народы! Он восседает на херувимах[b] — да содрогнётся земля!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве царствует — народы трепещут… земля содрогается». Еврейские имперфекты допускают как волитивное, так и изъявительное прочтение.'
    reason: alternative_reading
  - marker: b
    text: 'Возможные варианты: «восседает над херувимами» или «восседает между херувимами». Это еврейское выражение — царственно-храмовое наименование Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом; форма «Яхве» общепринята в современной русской библеистике.
- source_word: מָלָךְ
  choice: царствует
  rationale: Поэтическое провозглашение действующей царской власти Яхве; настоящее время естественно передаёт декларативную силу формы, не навязывая значение «стал царём».
- source_word: יִרְגְּזוּ עַמִּים
  choice: да трепещут народы
  rationale: Передаёт возможную волитивную, близкую к юссиву силу имперфекта и сохраняет множественное число עַמִּים как совокупность многих народов.
- source_word: יֹשֵׁב כְּרוּבִים
  choice: Он восседает на херувимах
  rationale: «Восседает» естественно выражает царственно-храмовый образ; предлог «на» близко передаёт конструкцию, не сводя её исключительно к пространственному положению между херувимами.
- source_word: תָּנוּט הָאָרֶץ
  choice: да содрогнётся земля
  rationale: Сохраняет параллельную волитивную силу и передаёт נוט в значении колебания или сотрясения; «земля» здесь соответствует вселенскому масштабу псалма.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Модальность יִרְגְּזוּ и תָּנוּט
  choice: 'волитивное прочтение: «да трепещут… да содрогнётся»'
  alternative: 'изъявительное прочтение: «народы трепещут… земля содрогается»'
  rationale: После провозглашения царствования волитивное прочтение убедительно передаёт торжественную риторику, но формы допускают и изъявительное понимание, которое сохранено в примечании.
- issue: Пространственный образ יֹשֵׁב כְּרוּבִים
  choice: «восседает на херувимах»
  alternative: «восседает над херувимами»; «восседает между херувимами»
  rationale: Конструкция является царственно-храмовым наименованием Яхве; буквальный предлог в еврейском не выражен, поэтому допустимые пространственные оттенки отмечены, а один из них не абсолютизирован.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим ритмом. «Восседает» сохраняет достойный царский регистр, а парные конструкции с «да» передают параллелизм стиха без архаической перегруженности.
