base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/005.yaml
  text: Exalt Yahweh our God[a], and bow down at his footstool[b]; he is holy.
translation:
  language: ru
  text: 'Превозносите Господа, Бога нашего, и склонитесь перед подножием ног Его[a][b]: Он свят.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «у подножия ног Его». Еврейский предлог в данном контексте поклонения допускает несколько способов передачи.'
    reason: lexical_alternative
  - marker: b
    text: «Подножие ног Его» может обозначать место Божьего престола на земле, например ковчег или святилище, однако сам стих оставляет этот образ неуточнённым.
    reason: cultural_note
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Превозносите
  rationale: Повелительная форма множественного числа от רום призывает возвысить, возвеличить Бога. «Превозносите» естественно звучит в русском псалмическом контексте и сохраняет торжественный оттенок.
- source_word: יְהוָ֤ה
  choice: Господа
  rationale: Передаёт тетраграмматон по укоренившейся русской библейской и богослужебной традиции, сохраняя благоговейный регистр.
- source_word: אֱלֹהֵ֗ינוּ
  choice: Бога нашего
  rationale: Форма с суффиксом первого лица множественного числа буквально означает «наш Бог»; постпозиция определения соответствует возвышенному, но понятному русскому стилю.
- source_word: וְהִשְׁתַּחֲווּ
  choice: и поклоняйтесь
  rationale: Глагол שׁחה обозначает поклон, простирание ниц и тем самым поклонение. Русское «поклоняйтесь» сохраняет как телесный образ, так и культовый смысл.
- source_word: לַהֲדֹ֥ם רַגְלָ֗יו
  choice: у подножия ног Его
  rationale: הֲדֹם означает «подножие», а רַגְלָיו — «Его ног». Предлог ל в данном контексте допускает пространственное или направительное понимание; вариант «у» естественен по-русски и не делает само подножие объектом поклонения.
- source_word: קָד֥וֹשׁ הֽוּא
  choice: Он свят
  rationale: Предикативное прилагательное с местоимением передано ясным современным порядком слов без добавления отсутствующей в еврейском тексте причинной связки «ибо».
theological_decisions:
- issue: К чему относится образ «подножия ног Его»
  choice: Сохранить образ без уточнения его предметного значения
  alternative: Прямо отождествить подножие с ковчегом, Сионом, святилищем или землёй
  rationale: Сам стих не называет референт. Буквальная образность сохраняет возможные храмовые и царские ассоциации, не навязывая одну из них.
- issue: Направленность поклонения при подножии
  choice: «поклоняйтесь у подножия ног Его»
  alternative: «поклоняйтесь подножию ног Его» или «поклоняйтесь перед подножием ног Его»
  rationale: Предлог ל допускает несколько оттенков. Основной вариант указывает место поклонения Богу и избегает однозначного утверждения, будто поклонение обращено к самому подножию; альтернативный пространственный перевод отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Синтаксис остаётся ясным; традиционные слова «Господь», «превозносите» и «подножие» сохранены как понятные и уместные для поэтической речи Псалтири.
