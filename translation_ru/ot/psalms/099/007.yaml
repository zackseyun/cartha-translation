lexical_decisions:
- source_word: בְּעַמּוּד עָנָן
  choice: В столпе облачном
  rationale: Предлог ב допускает местное значение «в» и значение источника/средства. Формулировка сохраняет образ облачного столпа и допускает речь из его среды.
- source_word: יְדַבֵּר
  choice: Он говорил
  rationale: Форма yiqtol в историко-поэтическом контексте естественно передаёт повторявшееся или характерное действие в прошлом; русское несовершенное «говорил» сохраняет этот оттенок.
- source_word: אֲלֵיהֶם
  choice: с ними
  rationale: Русское «говорил с ними» естественно передаёт обращённую к названным ранее лицам речь; местоимение сохраняет связь с предыдущим стихом.
- source_word: שָׁמְרוּ
  choice: они хранили
  rationale: Глагол שׁמר в заветном контексте означает хранить и соблюдать. «Хранили» сохраняет образную и традиционную силу слова, включая послушание.
- source_word: עֵדֹתָיו
  choice: Его свидетельства
  rationale: «Свидетельства» передаёт юридико-заветный смысл עֵדוֹת и сохраняет его лексическое отличие от следующего חֹק.
- source_word: וְחֹק
  choice: и устав
  rationale: Единственное число оригинала сохранено; «устав» передаёт установленное Богом обязательное предписание и отличается от «свидетельств».
- source_word: נָתַן לָמוֹ
  choice: который Он дал им
  rationale: Относительное придаточное естественно связывает глагол с «уставом» и ясно передаёт смысл еврейской конструкции без изменения числа.
theological_decisions:
- issue: К кому относятся «Он» и «они/им»
  choice: «Он» относится к Господу, а «они/с ними/им» — прежде всего к Моисею, Аарону и Самуилу, названным в предыдущем стихе.
  alternative: Местоимение множественного числа может шире подразумевать Израиль, представленный этими вождями.
  rationale: Ближайшие предшествующие лица названы в Пс 99:6. Местоимения оставлены без поясняющей подстановки, чтобы сохранить поэтическую связность и возможную представительную широту.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной библейской интонацией. Инверсия «в столпе облачном» сохраняет поэтичность и устойчивый образ; прописные местоимения относятся к Богу в соответствии с русской издательской традицией.
