  text: In a pillar of cloud he spoke to them[a]; they kept his testimonies and the statute he gave them.
translation:
  language: ru
  text: В облачном столпе Он говорил им[a]; они соблюдали Его свидетельства и устав, который Он дал им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Из облачного столпа Он говорил им». Еврейский предлог может обозначать местонахождение, источник или средство.'
