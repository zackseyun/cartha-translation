  text: מֹ֘שֶׁ֤ה וְ/אַהֲרֹ֨ן בְּֽ/כֹהֲנָ֗י/ו וּ֭/שְׁמוּאֵל בְּ/קֹרְאֵ֣י שְׁמ֑/וֹ קֹרִ֥אים אֶל יְ֝הוָ֗ה וְ/ה֣וּא יַעֲנֵֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/006.yaml
  text: Moses and Aaron were among his priests[a], and Samuel among those who called on his name; they called to Yahweh, and he answered them.
translation:
  language: ru
  text: Моисей и Аарон — среди Его священников, Самуил — среди тех, кто призывал Его имя. Они взывали к Яхве, и Он отвечал им.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּכֹהֲנָיו
  choice: среди Его священников
  rationale: Предлог בְּ при существительном во множественном числе с суффиксом естественно передаёт включение в группу. Формулировка сохраняет прямое значение כֹּהֵן — «священник» — и не утверждает, что Моисей и Аарон были единственными священниками.
- source_word: בְּקֹרְאֵי שְׁמוֹ
  choice: среди тех, кто призывал Его имя
  rationale: Причастный оборот параллелен выражению «среди Его священников» и характеризует группу, к которой отнесён Самуил. «Призывал Его имя» сохраняет явное упоминание имени и молитвенно-богослужебный смысл оборота.
- source_word: קֹרִאים אֶל
  choice: взывали к
  rationale: Так передаётся обращённый к Богу призыв или молитва; «взывали» естественно сочетается с предлогом «к» и не обязательно ограничивает действие исключительно бедствием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: יַעֲנֵם
  choice: Он отвечал им
  rationale: Имперфект в контексте воспоминания об этих ходатаях естественно выражает повторявшееся или характерное действие; несовершенный вид «отвечал» сохраняет этот оттенок лучше, чем однократное «ответил».
- source_word: שְׁמוֹ
  choice: Его имя
  rationale: Сохранено буквальное упоминание имени как значимый библейский оборот, вместо замены местоимением «Его».
theological_decisions:
- issue: Отнесение Моисея и Аарона к священникам при сохранении различия их служений
  choice: Моисей и Аарон — среди Его священников
  alternative: Моисей и Аарон — Его священники
  rationale: Конструкция «среди» сохраняет вероятный партитивный смысл еврейского текста и не сглаживает напряжение, связанное с тем, что Моисей не занимал священническую должность Аарона в узком культовом смысле.
- issue: Характер Божьего ответа названным ходатаям
  choice: Он отвечал им
  alternative: Он ответил им
  rationale: Несовершенный вид позволяет услышать обобщённо-повторительный смысл и не сводит свидетельство псалма к одному эпизоду.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Параллелизм двух именных конструкций сохранён с помощью тире; во второй части восстановлено подразумеваемое «среди». Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятым стилем проекта.
