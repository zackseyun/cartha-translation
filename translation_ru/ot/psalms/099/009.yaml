  text: רֽוֹמְמ֡וּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ֭/הִֽשְׁתַּחֲווּ לְ/הַ֣ר קָדְשׁ֑/וֹ כִּֽי קָ֝ד֗וֹשׁ יְהוָ֥ה אֱלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/009.yaml
  text: Exalt Yahweh our God[a], and bow down at his holy mountain, for Yahweh our God is holy.
translation:
  language: ru
  text: 'Превозносите Яхве, нашего Бога,

    и поклоняйтесь у Его святой горы[a],

    ибо свят Яхве, наш Бог.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «падите ниц у Его святой горы» или «поклоняйтесь, обратившись к Его святой горе». Еврейский глагол может обозначать как земной поклон, так и поклонение, а предлог может указывать на место у горы или на направление к ней.'
    reason: Лексическая и пространственная неоднозначность еврейского выражения.
lexical_decisions:
- source_word: רֽוֹמְמ֡וּ
  choice: Превозносите
  rationale: Форма повелительного наклонения во множественном числе от רום призывает возвеличивать Бога; «превозносите» естественно и уместно для возвышенной поэтической речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: אֱלֹהֵינוּ
  choice: наш Бог / нашего Бога
  rationale: Существительное с суффиксом первого лица множественного числа прямо означает «наш Бог»; падежная форма определяется русским синтаксисом.
- source_word: וְהִשְׁתַּחֲווּ
  choice: и склоняйтесь ниц
  rationale: Глагол שׁחה обозначает поклон или простирание ниц и нередко выражает поклонение. Перевод сохраняет конкретный телесный образ, не сводя значение только к отвлечённому «поклоняйтесь».
- source_word: לְהַר קָדְשׁוֹ
  choice: перед Его святой горой
  rationale: Предлог לְ допускает направительное или локативно-реляционное понимание. «Перед» естественно сочетается со «склоняйтесь ниц» и не создаёт впечатления, будто объект поклонения — сама гора.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание предшествующего призыва; «ибо» сохраняет ясную причинную связь и соответствует достоинству поэтического регистра.
- source_word: קָדוֹשׁ
  choice: свят
  rationale: Краткая форма «свят» точно передаёт именное сказуемое и поддерживает рефрен псалма о святости Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, а не титул. «Яхве» сохраняет это различие и является современной научно обоснованной русской передачей.
- issue: Следует ли передавать הִשְׁתַּחֲווּ прямо как «поклоняйтесь»
  choice: склоняйтесь ниц
  alternative: поклоняйтесь; падайте ниц
  rationale: Выбранный вариант сохраняет телесный смысл глагола и одновременно допускает его культовое значение, не устраняя присущую оригиналу многозначность.
- issue: Пространственное значение לְ при «святой горе»
  choice: перед Его святой горой
  alternative: у Его святой горы; обратившись к Его святой горе
  rationale: Еврейский предлог не требует однозначного выбора между местом и направлением. Основной текст даёт естественную русскую формулировку, а примечание сохраняет возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «свят Яхве» сохраняет акцент еврейского текста на святости и звучит естественно в библейской поэзии; строки оформлены по смысловому параллелизму.
