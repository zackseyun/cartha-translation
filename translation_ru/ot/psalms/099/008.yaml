base_translation:
  language: en
  yaml_path: translation/ot/psalms/099/008.yaml
  text: O Yahweh our God[a], you answered them; you were a forgiving God to them[b], yet an avenger of their deeds.
translation:
  language: ru
  text: Яхве, Бог наш, Ты ответил им; Ты был для них Богом, прощающим их, но и наказывающим за их дела.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Богом, уносившим их вину, но и воздающим за их поступки». Еврейские причастия могут описывать Бога как прощающего — буквально несущего или уносящего вину — и как карающего за совершённые ими дела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» общепринята в современной русской библеистической передаче.
- source_word: אֱלֹהֵינוּ
  choice: Бог наш
  rationale: Сохранено обращение с местоименным суффиксом первого лица множественного числа; порядок слов поддерживает возвышенный, но понятный регистр.
- source_word: אַתָּה עֲנִיתָם
  choice: Ты отвечал им
  rationale: Явное местоимение «Ты» сохраняет еврейское смысловое ударение; глагол передаёт ответ Бога на молитвенные обращения, упомянутые в контексте.
- source_word: אֵל נֹשֵׂא הָיִיתָ לָהֶם
  choice: Ты был для них Богом прощающим
  rationale: Причастие נשׂא в данном контексте означает снятие и унесение вины, то есть прощение; конструкция היה + ל передана отношением «был для них».
- source_word: וְנֹקֵם
  choice: но и взыскивал
  rationale: Причастие от נקם выражает воздаяние или наказание. Русское «взыскивал» сохраняет судебно-карательный смысл без оттенка личной мстительности, который часто имеет современное «мстил»; «но и» явно передаёт контраст с прощением.
- source_word: עַל עֲלִילוֹתָם
  choice: с них за их дела
  rationale: Предлог עַל при נקם передаёт основание и направленность воздаяния. «Дела» сохраняет широту עֲלִילוֹת и не добавляет к самому существительному отрицательной оценки, хотя контекст указывает на наказуемые поступки.
theological_decisions:
- issue: Одновременность Божьего прощения и взыскания
  choice: 'Сохранены обе стороны высказывания: Бог прощал их и вместе с тем взыскивал с них за их дела.'
  alternative: Истолковать наказание как обращённое только на других людей либо представить прощение как исключающее всякое временное взыскание.
  rationale: Еврейский текст непосредственно соединяет прощение и воздаяние, не объясняя, как именно они соотносятся; перевод не устраняет это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Личное имя передано как «Яхве»; архаизмы и конфессионально окрашенные формулы не используются. Повтор «их» сохранён ради ясности соотнесения с предшествующим контекстом.
