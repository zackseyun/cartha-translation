    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Да славят они
  rationale: Глагол ידה в породе hифиль может означать «благодарить», «славить», «исповедывать». При прямом дополнении «Твоё имя» и в контексте псалма естественнее значение публичной хвалы; форма имперфекта здесь передана как пожелание/призыв.
- source_word: שִׁמְךָ
  choice: Твоё ... имя
  rationale: Сохраняется еврейская библейская идиома, где «имя» обозначает также явленную сущность, славу и репутацию Бога.
- source_word: גָּדוֹל
  choice: великое
  rationale: Прямое соответствие основному значению прилагательного; согласование с русским словом «имя».
- source_word: וְנוֹרָא
  choice: и грозное
  rationale: Слово обозначает внушающее страх и благоговейный трепет. «Грозное» сохраняет эту сильную смысловую грань и звучит естественно в современном литературном русском.
- source_word: קָדוֹשׁ
  choice: свят
  rationale: Традиционное и точное соответствие, сохраняющее богословскую и литургическую силу повторяющегося рефрена псалма.
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение имеет эмфатический характер. Инверсия «свят Он» отражает краткую кульминационную структуру еврейской фразы и указывает на Господа.
theological_decisions:
- issue: К кому относится местоимение הוּא в заключительной фразе
  choice: '«Он» относится к Господу: «свят Он»'
  alternative: Фразу можно понимать как литургическое возглашение, примыкающее к упоминанию Божьего имени; грамматически еврейское «имя» мужского рода также допускает тесную связь местоимения с ним.
  rationale: В Псалме 99 формула «свят Он» служит рефреном о самом Господе. Перевод сохраняет местоимение и не добавляет отсутствующего в оригинале причинного союза.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Призыв «Да славят» передаёт юссивный оттенок без архаизма «пусть восхвалят»; инверсия «свят Он» сохраняет лаконичность и литургическую выразительность оригинала.
