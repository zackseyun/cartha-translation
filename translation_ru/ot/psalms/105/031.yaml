  text: אָ֭מַר וַ/יָּבֹ֣א עָרֹ֑ב כִּ֝נִּ֗ים בְּ/כָל גְּבוּלָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/031.yaml
  text: He spoke[a], and swarms of flies came[c][b], and gnats throughout all their territory.
translation:
  language: ru
  text: Он сказал — и налетели рои мух[a], и мошки[b] появились по всей их земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или просто «рои»; еврейское עָרֹב в повествованиях о казнях традиционно понимают как рои мух, хотя точный вид насекомых неизвестен.
    reason: lexical_alternative
  - marker: b
    text: Или «вши» либо «комары»; точное значение еврейского כִּנִּים неизвестно.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר
  choice: Он сказал
  rationale: Передаёт обычное значение глагола «сказать» и сохраняет краткую формулу действенного Божьего слова, не превращая её в явно выраженное повеление.
- source_word: וַיָּבֹא
  choice: налетели
  rationale: В контексте нашествия летающих насекомых естественно передаёт их прибытие; множественное число согласовано с русским выражением «рои мух».
- source_word: עָרֹב
  choice: рои мух
  rationale: Традиционное и контекстуально ясное понимание названия казни; поскольку точный вид насекомых не установлен, неопределённость отмечена в сноске.
- source_word: כִּנִּים
  choice: мошки
  rationale: Современное понятное обозначение мелких докучливых насекомых без чрезмерно точной идентификации; возможные варианты сохранены в сноске.
- source_word: בְּכָל גְּבוּלָם
  choice: по всей их земле
  rationale: Передаёт распространение казни по всей области, принадлежавшей египтянам; здесь גְּבוּל обозначает территорию, а не только пограничную черту.
