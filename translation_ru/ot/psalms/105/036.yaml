  text: Он поразил всех первенцев в их стране — первых плодов всей их силы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первое порождение их жизненной силы». Еврейское выражение называет первенцев первым проявлением силы и жизненной мощи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: Он поразил
  rationale: Форма глагола נכה означает «поразил, нанёс удар»; в контексте гибели первенцев смертельный исход ясен, поэтому добавлять «насмерть» не требуется.
- source_word: כָּל בְּכוֹר
  choice: всякого первенца
  rationale: Сочетание כָּל с существительным в единственном числе имеет распределительное значение; «всякого первенца» точно и естественно передаёт его по-русски.
- source_word: בְּאַרְצָם
  choice: в их земле
  rationale: Сохраняет географическое значение אֶרֶץ и отсылку к земле Египта.
- source_word: רֵאשִׁית
  choice: начаток
  rationale: רֵאשִׁית обозначает начало или первую часть; в приложении к «первенцу» слово «начаток» сохраняет образ первого проявления силы.
- source_word: לְכָל אוֹנָם
  choice: всей их силы
  rationale: Предлог לְ здесь выражает отношение, естественно передаваемое родительным падежом. אוֹן может означать силу, жизненную мощь и производительную способность; «сила» сохраняет широту выражения.
theological_decisions:
- issue: Неявное подлежащее глагола
  choice: «Он» относится к Богу
  alternative: 'Назвать Бога прямо: «Бог поразил»'
  rationale: В еврейском тексте подлежащее в форме 3-го лица единственного числа подразумевается из контекста. Местоимение сохраняет связность оригинала, не добавляя имени, которого в стихе нет.
- issue: Смысл выражения רֵאשִׁית לְכָל אוֹנָם
  choice: Сохранить образное выражение «начаток всей их силы»
  alternative: Разъяснить как «первый плод их жизненной силы» или «первое порождение их мужской силы»
  rationale: Еврейская фраза связывает первенцев с первым проявлением жизненной или производительной силы. Буквально-образная передача сохраняет богословскую и поэтическую напряжённость, а примечание поясняет диапазон смысла.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма. «Начаток» — возвышенное, но понятное библейско-литературное слово; тире ясно показывает приложение второй строки к первенцам.
