  text: כִּֽי זָ֭כַר אֶת דְּבַ֣ר קָדְשׁ֑/וֹ אֶֽת אַבְרָהָ֥ם עַבְדּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/042.yaml
  text: For he remembered his holy word to Abraham his servant[a][b].
translation:
  language: ru
  text: Ибо Он вспомнил Своё святое слово и Авраама, Своего слугу.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо Он вспомнил Своё святое слово, данное Аврааму, Своему слуге». Еврейский текст допускает различное понимание связи имени Авраама со словом «вспомнил».'
    reason: syntactic_alternative
  - marker: b
    text: «Слово» здесь означает обещание, высказанное Богом.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего действия; «ибо» сохраняет пояснительную связь и соответствует возвышенному, но понятному регистру псалма.
- source_word: זָכַר
  choice: вспомнил
  rationale: 'Передаёт обычное значение глагола и сохраняет библейский образ: Бог действует в соответствии с ранее сказанным, без разъяснительной замены на «исполнил обещание».'
- source_word: דְּבַר קָדְשׁוֹ
  choice: Своё святое слово
  rationale: Буквально сохраняет существительное «слово» и характеристику святости; в контексте это слово имеет силу обещания.
- source_word: אֶת אַבְרָהָם
  choice: и Авраама
  rationale: Повтор частицы прямого дополнения אֶת и масоретическое членение позволяют понимать Авраама как второй объект глагола «вспомнил». Союз «и» добавлен для естественного русского синтаксиса; альтернативная связь Авраама со «словом» отмечена в сноске.
- source_word: עַבְדּוֹ
  choice: Своего слугу
  rationale: «Слуга» естественно передаёт почётное обозначение Авраама как служащего Богу; «раб» здесь могло бы неоправданно выдвинуть на первый план социально-правовой статус.
theological_decisions:
- issue: Смысл Божьего «воспоминания»
  choice: Сохранить «вспомнил»
  alternative: «исполнил Своё обещание» или «помнил о Своём обещании»
  rationale: Контекст подразумевает верность Бога сказанному, однако сам еврейский текст употребляет глагол «вспомнил»; перевод не заменяет образ его богословским истолкованием.
- issue: Синтаксическая связь имени Авраама
  choice: 'Понять «Авраама» как второе прямое дополнение: Бог вспомнил слово и Авраама'
  alternative: Понять выражение как «слово, данное Аврааму»
  rationale: В масоретском тексте перед «Авраамом» повторена частица прямого дополнения אֶת, а главное разделительное ударение стоит после «Своё святое слово». Это поддерживает два однородных объекта, хотя контекст обещания Аврааму допускает традиционное альтернативное понимание, сохранённое в сноске.
- issue: Значение «слова»
  choice: Оставить «слово» в основном тексте
  alternative: «обещание»
  rationale: В данном контексте речь идёт об обещании Аврааму, но существительное דָּבָר буквально означает «слово»; более узкий смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Заглавные местоимения, относящиеся к Богу, соответствуют принятой русской библейской издательской традиции. Основной текст следует масоретическому синтаксису, а более привычное понимание «слова, данного Аврааму» вынесено в сноску.
