lexical_decisions:
- source_word: וַיִּקְרָא
  choice: призвал
  rationale: Глагол קרא с голодом в качестве объекта означает призвать, навести его; «призвал» естественно сохраняет образ целенаправленного действия.
- source_word: רָעָב
  choice: голод
  rationale: В контексте речь идёт о бедствии, охватившем страну; русское «голод» обычно обозначает и массовую нехватку пищи.
- source_word: עַל הָאָרֶץ
  choice: на землю
  rationale: Предлог עַל здесь естественно передаётся как «на», а הָאָרֶץ в контексте указывает на страну или землю, не обязательно на весь мир.
- source_word: כָּל מַטֵּה לֶחֶם
  choice: всякую опору хлеба
  rationale: 'Сохранена исходная метафора: хлеб представлен как опора жизни. «Всякую» передаёт полноту כָּל при единственном числе.'
- source_word: שָׁבָר
  choice: сокрушил
  rationale: Глагол означает «сломал, сокрушил»; выбранное слово сохраняет метафору сломанной опоры и подходит возвышенному поэтическому регистру.
theological_decisions:
- issue: Божественное действие в наступлении голода
  choice: 'Оба глагола имеют подразумеваемым субъектом Бога: «Он призвал… сокрушил».'
  alternative: Безличное описание голода как естественного события.
  rationale: Контекст псалма перечисляет деяния Господа, а формы мужского рода единственного числа продолжают тот же субъект. Перевод сохраняет явное божественное действие, ничего не добавляя к тексту.
translation_notes:
  register: Современный литературный русский с поэтической торжественностью. Исходная метафора сохранена в основном тексте и пояснена в сноске; местоимение «Он» продолжает контекстуальное указание на Бога.
