  text: so that they might keep his statutes and observe his laws[b][a]. Praise Yah!
translation:
  language: ru
  text: 'чтобы они соблюдали Его постановления

    и хранили Его наставления.

    Хвалите Яха![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Хвалите Яха!» Ях — краткая форма Божьего имени; этот возглас также передают словом «Аллилуйя» или выражением «Хвалите Господа!»'
    reason: Пояснение краткой формы божественного имени и традиционных вариантов передачи.
lexical_decisions:
- source_word: בַּעֲבוּר
  choice: чтобы
  rationale: Естественно передаёт целевое значение оборота и связь с предшествующими деяниями Бога.
- source_word: יִשְׁמְרוּ חֻקָּיו
  choice: они соблюдали Его постановления
  rationale: «Соблюдать» точно и естественно передаёт שׁמר применительно к предписаниям, а «постановления» сохраняет юридико-заветный оттенок חֻקִּים.
- source_word: וְתוֹרֹתָיו יִנְצֹרוּ
  choice: и хранили Его наставления
  rationale: «Хранить» передаёт оттенок бережного и неуклонного исполнения в נצר; «наставления» сохраняет более широкий смысл множественного תּוֹרוֹת и не сводит его исключительно к законодательству.
- source_word: הַלְלוּ יָהּ
  choice: Хвалите Яха!
  rationale: Императив переведён прямо, а краткая форма божественного имени יָהּ передана отдельно, без отождествления с полным тетраграмматоном.
theological_decisions:
- issue: Передача краткой формы божественного имени יָהּ в заключительном возгласе
  choice: Хвалите Яха!
  alternative: Аллилуйя!; Хвалите Господа!
  rationale: Форма יָהּ — краткое божественное имя. «Яха» сохраняет его отличие от יהוה и одновременно раскрывает значение повеления הַלְלוּ; примечание указывает более привычные варианты.
- issue: Соотношение תּוֹרוֹת с узким понятием закона
  choice: наставления
  alternative: законы
  rationale: Множественное תּוֹרוֹת допускает значение отдельных наставлений или законов. «Наставления» сохраняет широту слова и не вносит более узкого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Параллелизм двух строк сохранён; разные глаголы שׁמר и נצר переданы как «соблюдали» и «хранили».
