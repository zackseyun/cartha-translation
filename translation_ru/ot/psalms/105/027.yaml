  verdict: approve
  source_fidelity: «Они совершили среди них Его знамения и чудеса» верно передаёт идиоматическое значение שָׂמוּ בָם в контексте исходных знамений. «Среди них» сохраняет отсылку к египтянам. Необычный компонент דִּבְרֵי не воспроизведён в основной строке буквально, но его вероятная контекстуальная функция («дела/события») несущественно и естественно включена в «совершили», а формальная особенность добросовестно отмечена в сноске. «В земле Хама» точно сохраняет поэтическое обозначение Египта.
