  text: שָֽׂמוּ בָ֭/ם דִּבְרֵ֣י אֹתוֹתָ֑י/ו וּ֝/מֹפְתִ֗ים בְּ/אֶ֣רֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/027.yaml
  text: They performed among them the words of his signs[c][b][a], and wonders in the land of Ham.
translation:
  language: ru
  text: Они совершили среди них Его знамения[a] и чудеса в земле Хама[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слова Его знамений»; слово דָּבָר может также означать «дело» или «событие».'
    reason: lexical_alternative
  - marker: b
    text: «Земля Хама» — поэтическое название Египта.
    reason: cultural_note
lexical_decisions:
- source_word: שָׂמוּ
  choice: совершили
  rationale: Буквально глагол означает «поместили, установили», но в сочетании со знамениями и чудесами передаёт осуществление чудесных деяний; «совершили» естественно выражает этот смысл по-русски.
- source_word: בָם
  choice: среди них
  rationale: Местоименный суффикс относится к египтянам; предлог ב здесь указывает, что знамения были совершены в их среде.
- source_word: דִּבְרֵי אֹתוֹתָיו
  choice: Его знамения
  rationale: Необычное еврейское сочетание буквально означает «слова/дела Его знамений». В основном тексте передан наиболее вероятный контекстуальный смысл, а формальная особенность и возможные значения דִּבְרֵי сохранены в сноске.
- source_word: וּמֹפְתִים
  choice: и чудеса
  rationale: מוֹפֵת обозначает чудесное явление или дивное деяние и образует устойчивую смысловую пару со «знамениями».
- source_word: בְּאֶרֶץ חָם
  choice: в земле Хама
  rationale: Сохранено поэтическое библейское наименование Египта, без замены его прямым географическим названием.
theological_decisions:
- issue: Смысл необычного выражения דִּבְרֵי אֹתוֹתָיו
  choice: Передать в основном тексте как «Его знамения», отметив буквальную форму в сноске
  alternative: «слова Его знамений» или «дела Его знамений»
  rationale: Буквальные варианты сохраняют каждую лексему, но по-русски звучат неясно и могут создать ложное впечатление, будто сами знамения произносили слова. Контекст говорит о совершённых Моисеем и Аароном знамениях; при этом сноска не скрывает неоднозначность דִּבְרֵי («слова, дела, события»).
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краткий и ясный; поэтическое название «земля Хама» сохранено.
