  terminology: «Знамения» и «чудеса» удачно передают אֹתוֹת и מֹפְתִים как традиционную и понятную пару. «Земля Хама» сохранена без подмены исходного поэтического имени; поясняющая сноска достаточна. Написание «Его» допустимо в принятом возвышенно-библейском регистре и не добавляет богословского содержания.
