lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: Хвалитесь
  rationale: Форма хитпаэль, повелительное наклонение множественного числа, выражает хвалу, ликование и гордость тем, на кого или на что направлена хвала. «Хвалитесь» сохраняет возвратный оттенок и естественно сочетается с предложным оборотом.
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: его святым именем
  rationale: Творительный падеж после «хвалитесь» естественно передаёт еврейское בְּ; слово «имя» сохранено, а קָדְשׁוֹ передано обычным и ясным выражением «его святым».
- source_word: יִשְׂמַח
  choice: пусть радуется
  rationale: Хотя это форма имперфекта 3-го лица единственного числа, в поэтическом контексте после повеления она выражает пожелание или призыв.
- source_word: לֵב
  choice: сердце
  rationale: Сохранено еврейское собирательное единственное число. Русское «сердце тех, кто…» понятно и передаёт внутреннего человека, а не только эмоции.
- source_word: מְבַקְשֵׁי יְהוָה
  choice: тех, кто ищет Яхве
  rationale: Причастная конструкция обозначает людей, для которых поиск Яхве является характерным и продолжающимся действием; придаточная конструкция звучит естественно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом, поскольку в исходном тексте прямо стоит тетраграмматон.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» прямо передаёт личное имя в еврейском тексте и не подменяет его титулом; вариант «Иегова» основан на более позднем традиционном чтении.
- issue: Число слова «сердце»
  choice: 'единственное число: «сердце тех, кто ищет»'
  alternative: 'множественное число: «сердца тех, кто ищет»'
  rationale: Единственное число сохраняет поэтический собирательный образ оригинала и остаётся естественным в русском языке, не исключая каждого отдельного ищущего.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Местоимение «его» написано со строчной буквы, без внесения конфессиональной типографской традиции. Синтаксический параллелизм двух частей стиха сохранён.
