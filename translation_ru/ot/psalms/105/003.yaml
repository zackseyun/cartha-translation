  text: Хвалитесь его святым именем[a]; пусть радуется сердце тех, кто ищет Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Гордитесь его святым именем». Еврейский глагол может выражать ликование или похвальбу.'
