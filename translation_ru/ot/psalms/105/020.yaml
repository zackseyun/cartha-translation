  text: שָׁ֣לַח מֶ֭לֶךְ וַ/יַּתִּירֵ֑/הוּ מֹשֵׁ֥ל עַ֝מִּ֗ים וַֽ/יְפַתְּחֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/020.yaml
  text: The king sent and released him[b][a]; the ruler of peoples set him free.
translation:
  language: ru
  text: Послал царь и освободил его; правитель народов выпустил его на свободу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыл его» или, возможно, «открыл ему»; по смыслу — выпустил из заключения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: послал
  rationale: Прямо передаёт обычное значение Qal; в поэтическом контексте подразумевается, что царь послал повеление или людей, но источник не называет дополнение.
- source_word: מֶלֶךְ
  choice: царь
  rationale: Хотя в еврейском существительное без артикля, из контекста ясно, что речь о конкретном царе — фараоне; русский язык естественно допускает определённость без отдельного артикля.
- source_word: וַיַּתִּירֵהוּ
  choice: освободил его
  rationale: Глагол означает развязать, отпустить или освободить; «освободил» ясно передаёт избавление Иосифа от уз.
- source_word: מֹשֵׁל עַמִּים
  choice: правитель народов
  rationale: Сохраняет причастный титул и буквальное множественное עַמִּים — «народы», а также поэтический параллелизм с «царь».
- source_word: וַיְפַתְּחֵהוּ
  choice: выпустил его на свободу
  rationale: Буквальное значение связано с открыванием, но при человеке как объекте в данном контексте выражение означает открыть темницу или путь наружу, то есть отпустить из заключения.
