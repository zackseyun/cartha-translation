  text: Он утвердил это[a] Иакову как установление, Израилю — как вечный[b] завет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «установил это», «сделал это непреложным». Еврейский глагол выражает мысль о том, что нечто поставлено твёрдо и прочно.'
    reason: lexical_alternative
  - marker: b
