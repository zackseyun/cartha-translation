    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: Он утвердил это
  rationale: Каузативная форма глагола עמד означает «сделать твёрдым, установить, утвердить». Нейтральное указательное «это» сохраняет отсылку к завету, слову или клятве из предшествующего контекста, не сужая её искусственно и не навязывая в русском род существительного.
- source_word: לְיַעֲקֹב
  choice: для Иакова
  rationale: Предлог לְ обозначает адресата или того, для кого нечто установлено; «для Иакова» естественно звучит по-русски в сочетании с последующим «как постановление».
- source_word: לְחֹק
  choice: как постановление
  rationale: חֹק обозначает предписанное и твёрдо установленное положение. «Постановление» сохраняет официальный, нормативный оттенок и при этом понятно современному читателю.
- source_word: לְיִשְׂרָאֵל
  choice: для Израиля
  rationale: Перевод сохраняет синтаксический и поэтический параллелизм с «для Иакова».
- source_word: בְּרִית עוֹלָם
  choice: как вечный завет
  rationale: «Завет» является устойчивым и точным соответствием בְּרִית, а «вечный» передаёт עוֹלָם как неограниченную, непреходящую длительность.
theological_decisions:
- issue: Референт суффикса женского рода в וַיַּעֲמִידֶהָ
  choice: Передать местоимением «это», сохранив общую отсылку к ранее упомянутому Божьему заветному обязательству.
  alternative: Уточнить референт как «завет», «слово» или «клятву».
  rationale: Контекст называет завет, повелённое слово и клятву. Сам стих не требует выбрать только одно из этих близких понятий; «это» сохраняет анафорическую связь и подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранён параллелизм «для Иакова… для Израиля»; тире во второй строке передаёт эллипсис без ненужного повторения глагола.
