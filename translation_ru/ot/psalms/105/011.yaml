lexical_decisions:
- source_word: לֵאמֹר
  choice: говоря
  rationale: Инфинитив вводит прямую речь с Божьим обетованием и естественно связывает стих с предыдущим.
- source_word: לְךָ
  choice: тебе
  rationale: Сохранено обращение во втором лице единственного числа, относящееся в контексте к Аврааму.
- source_word: אֶתֵּן
  choice: дам
  rationale: Имперфект первого лица в данном контексте выражает обещанное будущее действие.
- source_word: אֶרֶץ כְּנָעַן
  choice: землю Ханаанскую
  rationale: Естественное для литературного русского языка обозначение территории Ханаана.
- source_word: חֶבֶל
  choice: удел
  rationale: В контексте распределения земли слово, буквально обозначающее мерную верёвку, метонимически указывает на отмеренную долю.
- source_word: נַחֲלַתְכֶם
  choice: вашего наследия
  rationale: Сохраняет значение наследственного владения и грамматическое множественное число местоименного суффикса.
theological_decisions:
- issue: Переход от единственного числа адресата к множественному числу притяжательного местоимения
  choice: «Тебе… вашего наследия»
  alternative: «Тебе… наследие твоих потомков»
  rationale: Еврейский текст переходит от обращения в единственном числе к притяжательной форме множественного числа. Этот переход сохранён, чтобы не устранять возможное представительное обращение к праотцу и его потомкам.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире перед приложением передаёт бессоюзное пояснение оригинала; архаическое «Ханаанскую землю» заменено более естественным порядком слов без утраты достоинства.
