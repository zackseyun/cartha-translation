  text: ה֭וּא יְהוָ֣ה אֱלֹהֵ֑י/נוּ בְּ/כָל הָ֝/אָ֗רֶץ מִשְׁפָּטָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/007.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: ru
  text: Он — Яхве[a], наш Бог; по всей земле — Его суды[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: יהוה (YHWH); также передаётся как «Иегова».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Его установления» либо «Его правосудие»; еврейское מִשְׁפָּטָיו может обозначать судебные решения, постановления или правосудие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Он —
  rationale: Самостоятельное местоимение имеет подчёркивающую силу; русское именное предложение с тире естественно передаёт подразумеваемую связку.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста, не заменяя её титулом «Господь».
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Форма с суффиксом первого лица множественного числа прямо означает «наш Бог».
- source_word: בְּכָל הָאָרֶץ
  choice: по всей земле
  rationale: В данном контексте выражение указывает на всеобщий охват; «по всей земле» звучит естественно и сохраняет универсальный смысл.
- source_word: מִשְׁפָּטָיו
  choice: Его суды
  rationale: מִשְׁפָּט может обозначать судебные решения, установления либо осуществляемое правосудие; «суды» сохраняет эту смысловую широту лучше более узких вариантов.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте употреблено личное имя; транслитерация «Яхве» сохраняет его, тогда как «Господь» заменяет имя титулом.
- issue: Смысл מִשְׁפָּטָיו
  choice: Его суды
  alternative: Его установления; Его правосудие
  rationale: Контекст не требует выбирать только между постановлениями Бога и проявлениями Его правосудия, поэтому более широкое «суды» не снимает присущую слову неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткий параллелизм и тире сохраняют торжественную поэтическую форму. Заглавная буква в «Его» служит уважительной графической нормой, не меняя смысла исходного текста.
