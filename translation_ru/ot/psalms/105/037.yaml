  text: He brought them out with silver and gold[a], and among his tribes there was no one who stumbled.
translation:
  language: ru
  text: Он вывел их с серебром и золотом, и среди племён Израиля не было ни одного, кто бы спотыкался[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не было ни одного слабого» или «изнемогшего». Еврейское причастие может обозначать того, кто спотыкается, слабеет или изнемогает.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: Он вывел их
  rationale: 'Порода hифиль глагола יצא выражает побуждение к выходу: Бог вывел народ из Египта. «Вывел» естественно по-русски и сохраняет божественное действие.'
- source_word: בְּכֶסֶף וְזָהָב
  choice: с серебром и золотом
  rationale: 'Предлог ב здесь указывает на сопутствующее обладание: народ вышел, имея серебро и золото. Перевод не добавляет отсутствующего в тексте представления о тяжести ноши.'
- source_word: וְאֵין
  choice: и ... не было
  rationale: Экзистенциальная конструкция אין естественно передаётся русским оборотом «не было».
- source_word: בִּשְׁבָטָיו
  choice: среди его племён
  rationale: Существительное שׁבט в контексте означает «племя», а суффикс 3-го лица мужского рода единственного числа сохранён как «его»; он относится к Израилю как к единому народу.
- source_word: כּוֹשֵׁל
  choice: изнемогающего
  rationale: Причастие от כשל может обозначать того, кто спотыкается, слабеет или выбивается из сил. В контексте выхода всего народа «изнемогающий» естественно выражает немощь, не устраняя образ спотыкания, отмеченный в сноске.
theological_decisions:
- issue: Референт суффикса единственного числа в выражении בִּשְׁבָטָיו
  choice: 'Сохранить единственное число: «среди его племён», понимая Израиль как собирательное единство.'
  alternative: «Среди их племён», согласуя местоимение с множеством вышедших людей.
  rationale: В еврейском тексте стоит суффикс мужского рода единственного числа. Его сохранение передаёт корпоративное представление об Израиле и не вносит дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис краток и близок к параллельной структуре еврейского стиха; редкое причастие пояснено сноской.
