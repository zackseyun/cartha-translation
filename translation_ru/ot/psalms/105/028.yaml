  text: שָׁ֣לַֽח חֹ֭שֶׁךְ וַ/יַּחְשִׁ֑ךְ וְ/לֹֽא מָ֝ר֗וּ אֶת דברו/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/028.yaml
  text: He sent darkness and made it dark[a], and they did not rebel against his words.
translation:
  language: ru
  text: Он послал тьму и сделал темно; и они не воспротивились Его словам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Его слову» или «Его повелению». В еврейском тексте не уточнено, кто такие «они»: одни понимают под ними египтян, другие — Моисея и Аарона.'
    reason: Альтернативное понимание числа слова דבריו и неявного подлежащего при מָרוּ.
lexical_decisions:
- source_word: שָׁלַח
  choice: послал
  rationale: Обычное и естественное соответствие глаголу со значением «посылать»; уместно в повествовании о казнях.
- source_word: חֹשֶׁךְ
  choice: тьму
  rationale: Прямое и прозрачное соответствие существительному «тьма», сохраняющее связь с казнью тьмой.
- source_word: וַיַּחְשִׁךְ
  choice: и стало темно
  rationale: Естественно передаёт наступление тьмы, вызванное Божьим действием, и избегает неясного русского «затемнил» без названного объекта.
- source_word: וְלֹא
  choice: и ... не
  rationale: Сохраняет простую еврейскую координацию, не вводя усиленного противопоставления.
- source_word: מָרוּ
  choice: воспротивились
  rationale: Передаёт неповиновение и сопротивление слову Бога; в данном сочетании звучит естественнее буквального «восстали против».
- source_word: אֶת־דבריו
  choice: Его словам
  rationale: Следует засвидетельствованной в масоретском тексте форме множественного числа с местоименным суффиксом; управление «воспротивились ... словам» естественно по-русски.
theological_decisions:
- issue: К кому относится невыраженное подлежащее «они»
  choice: Сохранить неопределённое «они», не называя референта.
  alternative: 'Уточнить: египтяне; либо Моисей и Аарон.'
  rationale: В еврейском тексте подлежащее при глаголе множественного числа прямо не названо. Контекст допускает разные толкования, поэтому перевод не устраняет подлинную неоднозначность.
- issue: Число и смысл דבריו
  choice: «Его словам» во множественном числе.
  alternative: «Его слову» или «Его повелению».
  rationale: Масоретская вокализация указывает на множественное число «Его слова»; единственное число или «повеление» возможны как смысловое понимание, но менее формально соответствуют данной форме текста.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Тире подчёркивает связь между посыланием тьмы и её наступлением; местоимение «Его» написано с прописной буквы по принятой русской библейской традиции.
