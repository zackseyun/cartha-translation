  yaml_path: translation/ot/psalms/105/029.yaml
  text: He turned their waters to blood and caused their fish to die[a].
translation:
  language: ru
  text: Он превратил их воды в кровь и погубил их рыбу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָפַךְ
  choice: превратил
  rationale: Глагол означает «повернуть, изменить, превратить»; в контексте казни выражение «превратил… в кровь» естественно передаёт изменение состояния.
- source_word: מֵימֵיהֶם
  choice: их воды
  rationale: Сохранено множественное число еврейского существительного, собирательно обозначающего водоёмы и водные источники египтян.
- source_word: לְדָם
  choice: в кровь
  rationale: Предлог לְ указывает на результат превращения; по-русски это естественно выражается конструкцией «превратить во что».
- source_word: וַיָּמֶת
  choice: и погубил
  rationale: Каузативная порода глагола מות передаёт действие, приведшее к смерти. «Погубил» сохраняет эту причинность и звучит естественно в поэтическом контексте.
- source_word: דְּגָתָם
  choice: их рыбу
  rationale: Существительное имеет собирательное значение; единственное число «рыбу» естественно передаёт совокупность рыб.
