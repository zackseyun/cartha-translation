  choice: заключил
  rationale: В контексте завета глагол входит в древнееврейское выражение со значением «заключить завет». Русское «заключил» естественно передаёт смысл, тогда как буквальное «рассёк» без пояснения было бы непонятно.
- source_word: אֶת אַבְרָהָם
  choice: с Авраамом
  rationale: В сочетании с глаголом заключения завета конструкция указывает на участника завета; по-русски нормативно «заключить с Авраамом».
- source_word: וּשְׁבוּעָתוֹ
  choice: и клятву Свою
  rationale: Сохранена именная форма «клятва» и принадлежность Богу; «Свою» естественно соотносится с подлежащим «Он».
- source_word: לְיִשְׂחָק
  choice: дал Исааку
  rationale: Предлог לְ обозначает адресата клятвы. Добавление нейтрального «дал» делает эллиптическую параллель естественной по-русски, не изменяя её смысла.
theological_decisions:
