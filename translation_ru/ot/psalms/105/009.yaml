- issue: Соотношение завета с Авраамом и клятвы Исааку
  choice: Сохранить параллель как два соотнесённых обозначения Божьего обязательства
  alternative: Объединить их в одно развёрнутое предложение с явным богословским пояснением
  rationale: Источник не разъясняет дополнительно, являются ли эти формулировки строго тождественными или подчёркивают разные моменты обещания; перевод не устраняет эту смысловую напряжённость.
