  text: שָׂמ֣/וֹ אָד֣וֹן לְ/בֵית֑/וֹ וּ֝/מֹשֵׁ֗ל בְּ/כָל קִנְיָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/021.yaml
  text: He made him lord of his house[a], and ruler over all his possessions.
translation:
  language: ru
  text: Он поставил его господином над своим домом и правителем над всем своим имуществом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂמוֹ
  choice: Он поставил его
  rationale: Форма qal перфекта с объектным суффиксом означает «поставил/назначил его»; «поставил» естественно вводит последующие обозначения должности и сохраняет образ исходного глагола.
- source_word: אָדוֹן
  choice: господином
  rationale: Слово обозначает человека, наделённого властью над домом; «господином» сохраняет возвышенный поэтический регистр и ясно выражает полномочия Иосифа.
- source_word: לְבֵיתוֹ
  choice: над своим домом
  rationale: Предлог לְ здесь указывает на область назначенной власти. Русское «над своим домом» естественно передаёт эту связь и избегает двусмысленного «господином своего дома».
- source_word: וּמֹשֵׁל
  choice: и правителем
  rationale: Причастная форма от משל обозначает того, кто управляет; «правителем» образует ясный параллелизм с «господином».
- source_word: בְּכָל
  choice: над всем
  rationale: При משל предлог בְ обозначает сферу или объект власти; по-русски это естественно передаётся предлогом «над».
- source_word: קִנְיָנוֹ
  choice: своим имуществом
  rationale: קִנְיָן означает приобретённую собственность, владение или имущество. «Имуществом» кратко и широко охватывает всё, что принадлежало царю.
theological_decisions: []
