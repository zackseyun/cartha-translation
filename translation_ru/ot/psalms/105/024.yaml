  text: Он весьма умножил Свой народ[a] и сделал этот народ сильнее его врагов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделал Свой народ весьма плодовитым». Еврейский глагол может подчёркивать как плодовитость, так и численное умножение.'
