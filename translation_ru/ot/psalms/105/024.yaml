lexical_decisions:
- source_word: וַיֶּפֶר
  choice: умножил
  rationale: Порода хифиль глагола פרה означает «сделать плодовитым, дать умножиться». В данном контексте «умножил» естественно передаёт быстрый численный рост народа, не исключая образа плодовитости.
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: עַם обозначает народ как единое целое. Возвратное притяжательное местоимение «Свой» ясно указывает на Бога как действующее лицо и звучит естественно по-русски.
- source_word: מְאֹד
  choice: весьма
  rationale: Наречие усиливает степень действия. «Весьма» сохраняет сжатый, возвышенный псалмопевческий регистр и остаётся понятным современному читателю.
- source_word: וַיַּעֲצִמֵהוּ
  choice: сделал его сильнее
  rationale: Хифиль от עצם выражает наделение силой или могуществом; сравнительное значение раскрывается последующей конструкцией с מִן. Единственное число местоимения сохранено, поскольку русское «народ» также является собирательным существительным мужского рода.
- source_word: מִצָּרָיו
  choice: его врагов
  rationale: צַר означает врага, противника или притеснителя. «Врагов» передаёт общий смысл без неоправданного сужения до египетских притеснителей; местоименный суффикс единственного числа соотнесён с собирательным словом «народ».
theological_decisions:
- issue: Собирательное единственное число в выражениях «его» и «его врагов»
  choice: 'Сохранить единственное число: «сделал его сильнее его врагов».'
  alternative: 'Передать по смыслу множественным числом: «сделал их сильнее их врагов».'
  rationale: В отличие от английского, русский язык естественно согласует последующие местоимения с существительным «народ» в единственном числе. Такое решение сохраняет грамматику еврейского текста и не меняет коллективного смысла.
- issue: 'Смысл глагола פרה: плодовитость или численное умножение'
  choice: 'В основном тексте: «умножил»; образ плодовитости отмечен в сноске.'
  alternative: «Сделал весьма плодовитым».
  rationale: Контекст говорит о росте численности Израиля. «Умножил» ясно и естественно передаёт этот смысл, тогда как сноска сохраняет образную сторону еврейского глагола и его подлинную лексическую широту.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмопевческой окраской. Слово «весьма» выбрано ради достоинства и краткости; синтаксис остаётся прозрачным для обычного читателя.
