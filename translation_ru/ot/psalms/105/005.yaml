lexical_decisions:
- source_word: זִכְרוּ
  choice: Помните
  rationale: Форма повелительного наклонения во множественном числе призывает слушателей хранить в памяти и осмысленно вспоминать Божьи деяния; «помните» — прямой и естественный русский эквивалент.
- source_word: נִפְלְאוֹתָיו
  choice: чудеса
  rationale: Слово обозначает необычайные деяния, вызывающие изумление. «Чудеса» кратко и естественно передаёт смысл, не исключая значения «дивные дела».
- source_word: אֲשֶׁר עָשָׂה
  choice: которые Он совершил
  rationale: Относительное придаточное определяет «чудеса». Глагол «совершил» уместен для великих деяний и сохраняет завершённость действия.
- source_word: מֹפְתָיו
  choice: Его знамения
  rationale: מֹפֵת обозначает знак, предзнаменование или чудесное явление, свидетельствующее о Божьем действии. «Знамения» сохраняет широту термина и поэтический параллелизм.
- source_word: וּמִשְׁפְּטֵי פִיו
  choice: и суды Его уст
  rationale: מִשְׁפָּט допускает значения судебных решений, приговоров и установлений. Буквальное выражение «суды Его уст» сохраняет древнееврейский образ и не сужает возможный смысл до одного толкования.
- source_word: פִיו
  choice: Его уст
  rationale: Поэтическое «уст» естественно в возвышенном русском контексте и сохраняет антропоморфный образ исходящих из Божьих уст решений.
theological_decisions:
- issue: Соотношение נִפְלְאוֹת и מֹפְתִים как обозначений Божьих деяний
  choice: Различные, но пересекающиеся понятия переданы как «чудеса» и «знамения».
  alternative: «дивные дела» и «чудеса»; «чудеса» и «предзнаменования»
  rationale: Стих соединяет близкие термины, не устанавливая между ними жёсткого богословского разграничения. Два разных русских слова сохраняют параллелизм и смысловую широту.
- issue: Значение מִשְׁפְּטֵי פִיו
  choice: 'Сохранён буквальный образ: «суды Его уст».'
  alternative: «приговоры, которые Он произнёс»; «установления, исходящие из Его уст»
  rationale: Фраза может относиться к Божьим приговорам, решениям или установлениям. Буквальный перевод сохраняет поэтический образ и подлинную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Прописное «Он» и притяжательное «Его» употреблены как традиционные русские обозначения Бога; «уст» сохраняет поэтический образ оригинала без чрезмерной архаизации.
