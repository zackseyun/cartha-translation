  text: Египет обрадовался, когда израильтяне ушли, потому что египтян охватил страх перед ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂמַח
  choice: радовался
  rationale: Глагол обозначает радость Египта по поводу ухода израильтян; «радовался» естественно и сохраняет эмоциональную силу оригинала.
- source_word: מִצְרַיִם
  choice: Египет
  rationale: Название страны употреблено как собирательное обозначение её жителей; олицетворение Египта сохранено.
- source_word: בְּצֵאתָם
  choice: их уходу
  rationale: 'Предлог ב с инфинитивом и суффиксом 3-го лица множественного числа выражает временное обстоятельство и одновременно повод для радости: буквально «при их выходе». «Их уходу» естественно передаёт смысл в данном контексте.'
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину радости Египта.
- source_word: נָפַל
  choice: охватил
  rationale: Буквально страх «пал на» египтян; русское «охватил» естественно передаёт наступившее состояние страха, не меняя причинной связи.
- source_word: פַּחְדָּם
  choice: страх перед ними
  rationale: Суффикс указывает на страх, вызванный израильтянами, то есть страх перед ними.
- source_word: עֲלֵיהֶם
  choice: египтян охватил
  rationale: Местоименный суффикс относится к египтянам. Явное существительное устраняет по-русски путаницу между двумя группами, оставаясь верным смыслу еврейского текста.
