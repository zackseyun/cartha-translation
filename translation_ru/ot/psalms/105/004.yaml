  text: דִּרְשׁ֣וּ יְהוָ֣ה וְ/עֻזּ֑/וֹ בַּקְּשׁ֖וּ פָנָ֣י/ו תָּמִֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/004.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: ru
  text: Ищите Яхве и силу Его; ищите лица Его непрестанно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ищите Его присутствия непрестанно». Буквально: «ищите лица Его непрестанно».'
    reason: 'Лексическая альтернатива: еврейское «лицо» может метонимически означать присутствие.'
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: Ищите
  rationale: Форма повелительного наклонения во множественном числе призывает обращаться к Богу и усердно стремиться к Нему; «ищите» естественно передаёт как волевое, так и молитвенное значение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: וְעֻזּוֹ
  choice: и Его силы
  rationale: עֹז означает силу, мощь или могущество. «Сила» — прямой и понятный эквивалент; местоименный суффикс сохранён.
- source_word: בַּקְּשׁוּ
  choice: ищите
  rationale: Глагол выражает деятельное стремление найти или обрести. Повтор «ищите» сохраняет поэтический параллелизм двух еврейских императивов.
- source_word: פָנָיו
  choice: Его лица
  rationale: Буквально — «Его лица»; выражение может обозначать присутствие Бога, но буквальный образ сохраняет личностную и богословскую насыщенность оригинала.
- source_word: תָּמִיד
  choice: всегда
  rationale: Слово обозначает постоянство и регулярность. «Всегда» звучит естественно и кратко в современном русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Буквальная или идиоматическая передача פָנָיו
  choice: Его лица
  alternative: Его присутствия
  rationale: Хотя выражение может означать Божье присутствие, основной текст сохраняет антропоморфный образ и присущую ему богословскую напряжённость; смысловая альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным псалмическим звучанием. Порядок слов близок к еврейскому параллелизму, но остаётся понятным современному читателю.
