  text: Пойте Ему, воспевайте Его, рассказывайте обо всех Его чудесных делах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «говорите обо всех Его чудесных делах» или «размышляйте обо всех Его чудесных делах». Еврейский глагол может обозначать как размышление, так и устный рассказ; здесь контекст хвалы скорее указывает на рассказ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ ל֭וֹ
  choice: Пойте Ему
  rationale: Множественное повелительное наклонение שׁיר с ל выражает направленное к Богу пение; формулировка естественна и близка еврейскому тексту.
- source_word: זַמְּרוּ ל֑וֹ
  choice: воспевайте Его
  rationale: זמר в контексте хвалы означает петь или музицировать во славу кого-либо. «Воспевайте Его» сохраняет хвалебный оттенок и избегает ненужного уточнения об инструментах.
- source_word: שִׂ֝יחוּ
  choice: рассказывайте
  rationale: שׂיח допускает значения размышления и устной речи. В ряду призывов к совместной хвале предпочтителен публично-коммуникативный смысл.
- source_word: בְּכָל נִפְלְאוֹתָֽיו
  choice: обо всех Его чудесных делах
  rationale: ב после глагола речи естественно передаётся как «о/об», כָל сохраняется словом «всех», а נִפְלָאוֹת обозначает вызывающие изумление деяния Бога.
theological_decisions:
- issue: Внутреннее размышление или публичное возвещение в שׂיחוּ
  choice: 'Публичное возвещение: «рассказывайте»'
  alternative: «размышляйте»
  rationale: Оба значения лексически возможны; последовательность множественных повелений «пойте… воспевайте…» поддерживает обращённое к общине устное возвещение, однако неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но общедоступным звучанием. Заглавное написание местоимений, относящихся к Богу, использовано последовательно. Повтор двух близких глаголов сохраняет поэтический параллелизм оригинала.
