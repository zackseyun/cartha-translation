  text: He sent Moses his servant[a], Aaron whom he had chosen.
translation:
  language: ru
  text: Он послал Моисея, своего слугу, и Аарона, которого избрал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «которого избрал прежде». Еврейская форма может обозначать простой прошедший факт; предшествование избрания отправлению прямо не выражено.'
    reason: Возможная передача временного соотношения действий.
lexical_decisions:
- source_word: שָׁלַח
  choice: Он послал
  rationale: Форма qal перфекта 3-го лица мужского рода единственного числа; подразумеваемый субъект — Бог, известный из контекста. «Послал» естественно и точно передаёт значение глагола.
- source_word: מֹשֶׁה
  choice: Моисея
  rationale: Традиционная русская форма имени; винительный падеж обусловлен ролью прямого дополнения.
- source_word: עַבְדּוֹ
  choice: Своего слугу
  rationale: עֶבֶד с суффиксом 3-го лица означает «его слуга/раб». В почётном обозначении Моисея «слуга» естественно передаёт смысл; возвратное «Своего» однозначно связывает принадлежность с субъектом «Он».
- source_word: אַהֲרֹן
  choice: Аарона
  rationale: Традиционная русская форма имени; синтаксически второе прямое дополнение при глаголе «послал».
- source_word: אֲשֶׁר
  choice: которого
  rationale: Относительное местоимение вводит определительное придаточное, относящееся к Аарону.
- source_word: בָּחַר בּוֹ
  choice: которого избрал
  rationale: Глагол בחר с предлогом ב обозначает выбор лица. Русский совершенный вид «избрал» передаёт завершённое действие, но сам по себе не делает предшествование отправлению столь явным, как форма «избрал прежде».
theological_decisions:
- issue: Подразумеваемый субъект глагола
  choice: Сохранено местоимение «Он», относящееся к Богу
  alternative: 'Эксплицировать: «Господь послал»'
  rationale: В еврейском тексте субъект выражен только глагольной формой и восстанавливается из контекста. Местоимение сохраняет ход исходного текста, не добавляя отсутствующего в стихе имени.
- issue: Временное соотношение избрания Аарона и отправления
  choice: «которого избрал»
  alternative: «которого прежде избрал»
  rationale: Еврейский перфект допускает простое обозначение совершившегося выбора; предшествование логически вероятно, однако не маркировано отдельным словом. Основной текст сохраняет эту сдержанность, а вариант с явным предшествованием вынесен в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Выбрано «слуга», а не более архаичное и в данном почётном контексте потенциально вводящее в заблуждение «раб». Заглавная буква в «Своего» следует принятой русской благоговейной орфографической традиции для местоимения, относящегося к Богу.
