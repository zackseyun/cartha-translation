  text: שָׁלַ֣ח לִ/פְנֵי/הֶ֣ם אִ֑ישׁ לְ֝/עֶ֗בֶד נִמְכַּ֥ר יוֹסֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/017.yaml
  text: He sent a man before them[a]; Joseph was sold as a servant.
translation:
  language: ru
  text: Он послал перед ними человека; Иосиф был продан в рабство.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלַח
  choice: послал
  rationale: Прямое соответствие форме Qal perfect 3 м. р. ед. ч.; подразумеваемый субъект — Бог, как следует из контекста.
- source_word: לִפְנֵיהֶם
  choice: перед ними
  rationale: 'Сохраняет пространственно-временную широту еврейского выражения: Иосиф был послан раньше них и впереди них, чтобы приготовить путь.'
- source_word: אִישׁ
  choice: человека
  rationale: Передаёт существительное мужского рода в единственном числе; далее этот человек назван по имени.
- source_word: לְעֶבֶד
  choice: в рабство
  rationale: В сочетании с глаголом «был продан» обозначает не обычное служение, а подневольное положение; по-русски «продан в рабство» естественно передаёт результат продажи.
- source_word: נִמְכַּר
  choice: проданного
  rationale: Причастная конструкция естественно передаёт пассивное значение Niphal и связывает имя Иосифа с обстоятельством его продажи.
- source_word: יוֹסֵף
  choice: Иосифа
  rationale: Традиционная и общепринятая русская форма библейского имени; винительный падеж обусловлен приложением к слову «человека».
theological_decisions:
- issue: Соотношение Божьего послания и человеческой продажи Иосифа
  choice: Сохранить рядом «послал» и «проданного», не объясняя, каким образом соотносятся Божье действие и поступки людей.
  alternative: Уточнить, что Бог использовал совершённую людьми продажу.
  rationale: Стих намеренно выражает богословское напряжение между Божьим промыслом и продажей Иосифа; перевод не должен разрешать его добавленным пояснением.
- issue: Значение עֶבֶד в контексте продажи Иосифа
  choice: рабство
  alternative: служение / слуга
  rationale: Глагол «продать» делает подневольный статус центральным; «рабство» точнее, чем смягчающее «служение».
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Тире ясно вводит Иосифа как того самого «человека», а оборот «проданного в рабство» звучит естественно и сохраняет смысл еврейского текста.
