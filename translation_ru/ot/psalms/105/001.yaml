  text: הוֹד֣וּ לַ֭/יהוָה קִרְא֣וּ בִּ/שְׁמ֑/וֹ הוֹדִ֥יעוּ בָ֝/עַמִּ֗ים עֲלִילוֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/001.yaml
  text: Give thanks to Yahweh[a]; call on his name; make his deeds known among the peoples.
translation:
  language: ru
  text: Благодарите Яхве[a], призывайте Его имя, возвещайте среди народов о Его деяниях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Яхве» — личное имя Бога, традиционно передаваемое в русских переводах словом «Господь».'
    reason: Пояснение передачи тетраграмматона יְהוָה.
lexical_decisions:
- source_word: הוֹדוּ
  choice: Благодарите
  rationale: Форма Hiphil, повелительное наклонение множественного числа, от ידה. В контексте псалмов означает благодарить или воздавать хвалу; «благодарите» естественно сочетается с адресатом, отмеченным ל.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата благодарения; тетраграмматон передан как личное имя «Яхве», в соответствии с прямым употреблением имени в еврейском тексте.
- source_word: קִרְאוּ בִּשְׁמוֹ
  choice: призывайте Его имя
  rationale: Сочетание קרא с בְּשֵׁם может означать призывать, обращаться с воззванием или поклонением. Русское «призывайте Его имя» сохраняет форму исходного выражения и его молитвенно-богослужебный смысл.
- source_word: הוֹדִיעוּ
  choice: возвещайте
  rationale: Hiphil, повелительное наклонение множественного числа, от ידע буквально выражает побуждение других узнать. «Возвещайте» естественно передаёт публичное провозглашение, подразумеваемое контекстом.
- source_word: בָעַמִּים
  choice: среди народов
  rationale: Предлог ב передан как «среди», а множественное עַמִּים — как «народы», без сужения смысла до современных государств.
- source_word: עֲלִילוֹתָיו
  choice: о Его деяниях
  rationale: Существительное обозначает действия или деяния. Предлог «о» требуется русским управлением глагола «возвещать» в данном построении и не меняет смысл исходного дополнения.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя. «Яхве» сохраняет это различие; примечание сообщает читателю традиционную русскую передачу без подмены имени в основном тексте.
- issue: Смысл выражения קִרְאוּ בִּשְׁמוֹ
  choice: призывайте Его имя
  alternative: провозглашайте Его имя
  rationale: Конструкция допускает оттенок призывания Бога и публичного провозглашения. Выбранный вариант сохраняет прежде всего культово-молитвенный смысл и не исключает публичного обращения.
translation_notes:
  register: Современный литературный русский язык, возвышенный, но общепонятный регистр. Сохранена цепочка повелительных форм множественного числа и поэтический параллелизм стиха.
