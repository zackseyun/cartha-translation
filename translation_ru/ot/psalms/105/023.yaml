id: PSA.105.23
reference: Psalms 105:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יָּבֹ֣א יִשְׂרָאֵ֣ל מִצְרָ֑יִם וְ֝/יַעֲקֹ֗ב גָּ֣ר בְּ/אֶֽרֶץ חָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/023.yaml
  text: Then Israel came to Egypt[b][a], and Jacob lived as a foreigner in the land of Ham.
translation:
  language: ru
  text: Тогда Израиль пришёл в Египет, и Иаков жил как чужеземец[a] в земле Хама[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поселился как пришелец»; еврейский глагол подчёркивает проживание в чужой земле, не на правах коренного жителя.'
    reason: lexical_alternative
  - marker: b
    text: «Земля Хама» — поэтическое название Египта.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Тогда … пришёл
  rationale: Форма wayyiqtol от בוא продвигает повествование; «тогда» естественно передаёт последовательность событий в русском историко-поэтическом изложении.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено собственное имя; в параллелизме оно соотнесено с Иаковом, не устраняя представительного оттенка имени.
- source_word: מִצְרָיִם
  choice: Египет
  rationale: Общепринятое русское название страны.
- source_word: וְיַעֲקֹב
  choice: и Иаков
  rationale: Второе имя сохранено ради поэтического параллелизма «Израиль // Иаков», а не заменено местоимением.
- source_word: גָּר
  choice: жил как чужеземец
  rationale: Глагол גור обозначает проживание не на своей родине, в положении пришельца; формулировка ясна современному читателю и передаёт как само проживание, так и статус чужеземца.
- source_word: בְּאֶרֶץ
  choice: в земле
  rationale: אֶרֶץ здесь означает землю или страну; сочетание «земля Хама» сохраняет библейский поэтический образ.
- source_word: חָם
  choice: Хама
  rationale: Имя Хам передано в традиционной русской форме; выражение «земля Хама» сохранено как поэтическое обозначение Египта.
theological_decisions:
- issue: Следует ли свести поэтическую параллель «Израиль // Иаков» к одному наименованию
  choice: Сохранить оба имени в основном тексте
  alternative: Передать обе строки с одним именем или заменить второе имя местоимением
  rationale: Еврейский текст намеренно употребляет оба имени в параллельных частях стиха. Их сохранение передаёт поэтическую структуру и связь патриарха с народом, не добавляя дальнейших богословских выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и оба имени патриарха сохранены; архаизм «странствовал» не использован, поскольку он может ошибочно подразумевать постоянное передвижение.
