  text: אַֽל תִּגְּע֥וּ בִ/מְשִׁיחָ֑/י וְ֝/לִ/נְבִיאַ/י אַל תָּרֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/015.yaml
  text: Do not touch my anointed ones[a], and do my prophets no harm.
translation:
  language: ru
  text: «Не прикасайтесь к Моим помазанникам[a] и не причиняйте зла Моим пророкам».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Моим помазанникам». Древнееврейское слово родственно слову «Мессия», однако здесь оно стоит во множественном числе и обозначает людей, которых Бог отделил для Себя, а не единственного Мессию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: прикасайтесь
  rationale: Глагол נגע имеет значения «касаться, достигать, поражать». В запрете буквальное «не прикасайтесь» сохраняет ёмкость древнееврейского выражения и не ограничивает смысл только физическим насилием.
- source_word: בִמְשִׁיחָי
  choice: к Моим помазанникам
  rationale: 'Существительное מָשִׁיחַ стоит во множественном числе с суффиксом первого лица единственного числа: «Мои помазанники». Предлог ב при נגע естественно передаётся русским «к» в сочетании «прикасаться к».'
- source_word: לִנְבִיאַי
  choice: Моим пророкам
  rationale: נָבִיא означает «пророк»; форма множественного числа с суффиксом первого лица единственного числа прямо означает «Мои пророки». Предлог ל обусловлен управлением русского выражения «причинять зло кому».
- source_word: תָּרֵעוּ
  choice: причиняйте зла
  rationale: Порода hифиль глагола רעע здесь выражает причинение зла или вреда. «Не причиняйте зла» естественно и достаточно широко передаёт запрет, не сводя его лишь к телесному ущербу.
- source_word: אַל
  choice: не
  rationale: אַל с формой имперфекта выражает запрет; по-русски естественно передаётся частицей «не» с повелительным наклонением.
theological_decisions:
- issue: Передача מְשִׁיחַ во множественном числе вне прямого указания на единственного Мессию
  choice: помазанникам
  alternative: мессиям
  rationale: В тексте стоит множественное число, относящееся к людям, которых Бог выделил и посвятил Себе. «Помазанники» сохраняет исходное значение и не создаёт ошибочного впечатления, будто речь непосредственно идёт о единственном эсхатологическом Мессии.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и параллелизма еврейской поэтической строки. Прописные буквы в местоимениях «Моим» передают традиционное русское благоговейное оформление прямой речи Бога.
