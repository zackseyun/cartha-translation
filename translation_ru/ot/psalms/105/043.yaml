  yaml_path: translation/ot/psalms/105/043.yaml
  text: So he brought out his people with joy[b][a], his chosen ones with singing.
translation:
  language: ru
  text: 'И вывел Он Свой народ с радостью,

    Своих избранных — с ликованием.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с радостными возгласами»; еврейское слово может обозначать как ликующее пение, так и громкий возглас радости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִא
  choice: И вывел Он
  rationale: Порода hифиль глагола יצא имеет каузативное значение «заставить выйти, вывести». «Вывел» естественно по-русски и сохраняет связь с исходом.
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: עַם обычно обозначает народ, здесь — принадлежащий Богу народ завета. Возвратное притяжательное местоимение «Свой» соответствует русскому синтаксису при подлежащем «Он».
- source_word: בְשָׂשׂוֹן
  choice: с радостью
  rationale: Существительное означает радость, веселье; предложное сочетание употреблено обстоятельственно. «С радостью» точно и естественно передаёт смысл.
- source_word: בְּרִנָּה
  choice: с ликованием
  rationale: רִנָּה обозначает громкое радостное выражение — ликующий возглас или пение. «Ликование» сохраняет эту смысловую широту и хорошо соответствует поэтическому параллелизму.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия; его функция выражена синтаксисом.
- source_word: בְּחִירָיו
  choice: Своих избранных
  rationale: Субстантивированная форма от בחר означает тех, кого избрал Бог. «Избранные» прозрачно передаёт значение без добавления более узкого богословского толкования.
theological_decisions:
- issue: Передача בְּחִירָיו
  choice: Своих избранных
  alternative: тех, кого Он избрал
  rationale: В контексте исхода выражение параллельно словам «Свой народ» и указывает на избранных Богом. Краткая форма сохраняет заветный смысл и поэтический параллелизм, не уточняя природу избрания сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «вывел Он» поддерживает псалмовый ритм; две строки сохраняют параллелизм еврейского стиха. Заглавные местоимения в отношении Бога применены последовательно в рамках данного стиха.
