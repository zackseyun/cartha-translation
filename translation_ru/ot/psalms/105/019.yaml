source:
  edition: WLC
  text: עַד עֵ֥ת בֹּֽא דְבָר֑/וֹ אִמְרַ֖ת יְהוָ֣ה צְרָפָֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/019.yaml
  text: Until the time his word came to pass[b][a], the word of Yahweh tested him.
translation:
  language: ru
  text: пока не исполнилось его слово[a], — слово Яхве испытывало его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Его слово» может означать сказанное Иосифом — его предсказание, которое впоследствии исполнилось; возможно также понимание: Божье слово об Иосифе.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «очищало его». Еврейский глагол обозначает очищение металла огнём, а переносно — испытание и проверку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד עֵת
  choice: пока не
  rationale: Естественно передаёт временной предел «до того времени, когда» без тяжеловесности.
- source_word: בֹּא דְבָרוֹ
  choice: не исполнилось его слово
  rationale: Буквально слово «пришло»; в данном сочетании речь, вероятно, о наступлении или исполнении сказанного. Местоимение сохранено, чтобы не устранять неоднозначность.
- source_word: אִמְרַת יְהוָה
  choice: слово Яхве
  rationale: Сохраняет параллелизм двух обозначений слова и передаёт тетраграмматон личным именем.
- source_word: צְרָפָתְהוּ
  choice: испытывало его
  rationale: Глагол буквально описывает очищение металла огнём и метафорически означает проверку или испытание; основной текст передаёт смысл, а образ отмечен в сноске.
theological_decisions:
- issue: К кому относится «его» в выражении «его слово»
  choice: Сохранить местоименную неоднозначность; наиболее естественно в контексте понимать слово Иосифа, то есть его предсказание.
  alternative: Слово Бога об Иосифе.
  rationale: Еврейский суффикс сам по себе допускает обе связи. Контекст благоприятствует слову Иосифа, тогда как следующая строка прямо называет слово Яхве; перевод не должен догматически исключать иной смысл.
- issue: Характер действия слова Яхве
  choice: испытывало
  alternative: очищало, как металл
  rationale: Метафора допускает как испытание, так и очищение; выбран ясный русский эквивалент с сохранением исходного образа в сноске.
translation_notes:
  register: Современный литературный русский язык; краткий поэтический синтаксис. Тире обозначает параллельные части стиха. Божественное имя передано как «Яхве».
