  text: Они просили[a] — и Он послал перепелов; хлебом небесным насытил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте глагол стоит в единственном числе — буквально: «он просил»; вероятно, имеется в виду народ Израиля как единое целое.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁאַל
  choice: Они просили
  rationale: В масоретском тексте глагол стоит в форме 3-го лица единственного числа («он просил»), однако по контексту речь идёт о народе Израиля как совокупном субъекте; множественное число естественно передаёт этот смысл. Формальная неоднозначность отмечена в сноске.
- source_word: וַיָּבֵא
  choice: и Он послал
  rationale: Каузативная форма глагола בוא означает «привести, доставить, сделать так, чтобы пришло». В отношении перепелов русское «послал» естественно выражает действие Бога, не утяжеляя поэтическую строку.
- source_word: שְׂלָו
  choice: перепелов
  rationale: Обычное лексическое значение — птица «перепел»; в русском после глагола «послал» требуется винительный падеж множественного числа.
- source_word: לֶחֶם שָׁמַיִם
  choice: хлебом небесным
  rationale: Конструкция буквально означает «хлеб небес». Поэтическое «хлебом небесным» сохраняет возвышенный образ и естественно сочетается с творительным управлением глагола «насытил».
- source_word: יַשְׂבִּיעֵם
  choice: насытил их
  rationale: 'Каузатив от שׂבע передаёт доведение до сытости: «насытить, дать вдоволь». «Насытил их» точно и естественно сохраняет образ полноты Божьего обеспечения.'
theological_decisions:
- issue: Подлежащее начального глагола שָׁאַל
  choice: 'Смысл передан как просьба народа Израиля: «Они просили».'
  alternative: 'Формально: «Он просил» — с возможным пониманием Израиля как собирательного субъекта либо отдельного представителя народа.'
  rationale: Хотя записанная форма глагола единственного числа, контекст повествует о народе Израиля, а местоименный суффикс множественного числа в конце стиха («их») поддерживает совокупное понимание. Сноска сохраняет формальную особенность еврейского текста, не разрешая её молча.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Прописное «Он» обозначает Бога по ясному контексту и соответствует принятой русской библейской стилистике. Порядок слов во второй строке сохраняет образность исходного текста; двоеточие не добавлено, чтобы не превращать соположение образов в более жёсткое логическое пояснение.
