  text: Он сказал — и пришла саранча, и молодой саранчи[a] было не счесть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и пожирающих насекомых было не счесть». Еврейское слово יֶלֶק обозначает насекомое, уничтожающее посевы, вероятно саранчу на определённой стадии развития или одну из её разновидностей; в старых переводах иногда встречается «гусеница».'
