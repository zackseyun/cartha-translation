lexical_decisions:
- source_word: אָמַר
  choice: Он сказал
  rationale: Глагол означает «сказать, произнести». Такой перевод сохраняет прямой смысл и не добавляет более сильного значения «повелел», хотя контекст показывает действенность Божьего слова.
- source_word: וַיָּבֹא
  choice: пришла
  rationale: Форма повествует о наступлении нашествия. Единственное число естественно согласуется с русским собирательным существительным «саранча».
- source_word: אַרְבֶּה
  choice: саранча
  rationale: Существительное в единственном числе имеет собирательное значение и обозначает саранчу как бедствие.
- source_word: יֶלֶק
  choice: молодая саранча
  rationale: Слово обозначает пожирающее посевы насекомое, вероятно одну из стадий или разновидностей саранчи. Выбор сохраняет вероятную связь с саранчой, не используя вводящее в заблуждение традиционное «гусеница».
- source_word: וְאֵין מִסְפָּר
  choice: было не счесть
  rationale: Естественная русская передача идиомы со значением неисчислимого множества; она сохраняет поэтическую выразительность.
