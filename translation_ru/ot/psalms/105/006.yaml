  text: זֶ֭רַע אַבְרָהָ֣ם עַבְדּ֑/וֹ בְּנֵ֖י יַעֲקֹ֣ב בְּחִירָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/006.yaml
  text: offspring of Abraham[a], his servant, sons of Jacob, his chosen ones[c][b],
translation:
  language: ru
  text: 'Потомство Авраама[a], слуги Его,

    сыновья Иакова[b], избранные Им[c]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «семя Авраама». Еврейское слово в единственном числе здесь имеет собирательное значение и обозначает потомков Авраама.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дети Иакова».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Его избранники».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: потомство
  rationale: В данном контексте слово обозначает совокупность потомков Авраама. «Потомство» естественно передаёт собирательное значение еврейского единственного числа.
- source_word: עַבְדּוֹ
  choice: слуги Его
  rationale: 'Форма стоит в единственном числе и относится к Аврааму: он — слуга Бога. Постпозиция сохраняет поэтическую краткость и не позволяет ошибочно принять слово за характеристику всего потомства.'
- source_word: בְּנֵי
  choice: сыновья
  rationale: Перевод сохраняет мужское множественное число исходного выражения и параллелизм с «потомством Авраама»; в этом контексте оно может обозначать не только непосредственных сыновей, но и народ, происходящий от Иакова.
- source_word: בְּחִירָיו
  choice: избранные Им
  rationale: Субстантивированное «избранные» ясно и естественно передаёт форму множественного числа, не привнося специальной позднейшей богословской терминологии.
- source_word: זֶרַע אַבְרָהָם // בְּנֵי יַעֲקֹב
  choice: потомство Авраама // сыновья Иакова
  rationale: Сохранены обе части синонимического параллелизма, которыми община названа через происхождение от патриархов.
theological_decisions:
- issue: К кому относятся местоименные суффиксы в выражениях «слуги Его» и «избранные Им»
  choice: 'Оба отнесены к Богу: Авраам — Его слуга, а сыновья Иакова — избранные Им.'
  alternative: Формально местоимения можно было бы связать с ближайшими упомянутыми патриархами, но в контексте псалма такое прочтение маловероятно.
  rationale: Контекст завета и библейское словоупотребление поддерживают отнесение обоих суффиксов к Богу. Заглавная буква и форма «Им» делают эту связь понятной по-русски, не добавляя отдельного доктринального утверждения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Перенос строки отражает еврейский параллелизм. Формы «потомство», «сыновья» и «избранные» понятны современному читателю; архаизмы не использованы.
