  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנִּיחַ
  choice: не позволял
  rationale: В каузативной форме глагол означает «допускать, позволять»; отрицательная конструкция естественно передаётся как «не позволял».
- source_word: אָדָם
  choice: никому
  rationale: Единственное число употреблено обобщённо в значении «какому-либо человеку»; в отрицательной русской конструкции «никому» точно и естественно передаёт этот смысл.
- source_word: לְעָשְׁקָם
  choice: притеснять их
  rationale: Глагол עשׁק обозначает угнетение, притеснение или корыстное ущемление; «притеснять» сохраняет широкий смысл и соответствует контексту.
- source_word: וַיּוֹכַח
  choice: обличал
  rationale: Здесь יכח выражает порицание или укор; «обличал» передаёт сильное словесное осуждение и сохраняет возвышенный, но понятный регистр псалма.
- source_word: עֲלֵיהֶם
  choice: ради них
  rationale: Предлог על с местоименным суффиксом указывает, что действие совершалось ради патриархов или в связи с ними; «ради них» естественно передаёт причинно-защитный оттенок.
- source_word: מְלָכִים
  choice: царей
  rationale: Существительное прямо обозначает царей, поэтому более широкое «правителей» не требуется.
