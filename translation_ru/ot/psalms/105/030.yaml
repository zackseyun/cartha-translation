  text: Их земля кишела лягушками — даже в покоях их царей.[а]
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: 'Евр.: «их царей». В повествовании о казни лягушками в Исх. 8 употреблено единственное число — «царь»; здесь же псалом использует множественное число, возможно в поэтическом или собирательном значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרַץ
  choice: кишела
  rationale: Глагол обозначает обильное появление и скопление множества живых существ. «Кишела» естественно и образно передаёт нашествие лягушек.
- source_word: אַרְצָם
  choice: их земля
  rationale: Прямая и естественная передача существительного с местоименным суффиксом; в контексте речь идёт о земле египтян.
- source_word: צְפַרְדְּעִים
  choice: лягушками
  rationale: Обычное и контекстуально однозначное соответствие еврейскому существительному.
- source_word: בְּחַדְרֵי
  choice: в покоях
  rationale: Предлог ב указывает на местонахождение, а חֲדָרִים — на внутренние комнаты. «Покои» сохраняет поэтический и царский колорит, оставаясь понятным современному читателю.
- source_word: מַלְכֵיהֶם
  choice: их царей
  rationale: Еврейская форма имеет множественное число с местоименным суффиксом 3-го лица множественного числа. Перевод сохраняет это число и не согласует стих искусственно с единственным числом в повествовании Исхода.
theological_decisions:
- issue: Множественное число в выражении מַלְכֵיהֶם
  choice: их царей
  alternative: их царя
  rationale: Масоретский текст недвусмысленно содержит множественное число. Возможный поэтический или обобщающий характер формы не следует устранять в переводе.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Тире естественно передаёт усиление второй строки: нашествие достигло даже царских покоев.'
