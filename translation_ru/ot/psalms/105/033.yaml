  text: וַ/יַּ֣ךְ גַּ֭פְנָ/ם וּ/תְאֵנָתָ֑/ם וַ֝/יְשַׁבֵּ֗ר עֵ֣ץ גְּבוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/033.yaml
  text: He struck their vines and their fig trees[a], and shattered the trees of their territory.
translation:
  language: ru
  text: Он поразил их виноградные лозы и смоковницы и сокрушил деревья в их пределах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: Он поразил
  rationale: Глагол נכה передаёт сильный удар, здесь — губительное поражение. «Поразил» естественно для возвышенного повествования и сохраняет силу действия без архаизма.
- source_word: גַּפְנָם
  choice: их виноградные лозы
  rationale: גֶּפֶן означает виноградную лозу; форма с суффиксом может иметь собирательный смысл. Множественное число по-русски естественно в описании сельскохозяйственных насаждений.
- source_word: וּתְאֵנָתָם
  choice: и смоковницы
  rationale: תְּאֵנָה — смоковница. Хотя еврейская форма грамматически единственного числа, здесь она употреблена собирательно; русское множественное число ясно передаёт смысл.
- source_word: וַיְשַׁבֵּר
  choice: и поломал
  rationale: Порода пиэль глагола שׁבר выражает энергичное, разрушительное ломание. «Поломал» хорошо сочетается с деревьями и передаёт множественность разрушений; «раздробил» было бы менее естественно.
- source_word: עֵץ גְּבוּלָם
  choice: деревья в их пределах
  rationale: עֵץ здесь обозначает деревья как совокупность, а גְּבוּלָם может означать их территорию или пространство внутри границ. «В их пределах» естественно передаёт местное отношение, не ограничивая смысл только пограничной полосой.
theological_decisions:
- issue: Неявный субъект глаголов
  choice: «Он» — Бог, действующий в Египте
  alternative: Оставить субъект невыраженным
  rationale: В еврейском тексте субъект подразумевается из контекста рассказа о деяниях Господа. Русская законченная фраза требует явного подлежащего; местоимение «Он» сохраняет контекстуальную отсылку, не добавляя имени.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранён параллелизм двух последовательных разрушительных действий; избегнуты архаизмы «смоквы» и «сокрушил», а также чрезмерно разговорное «разбил».
