  text: to bind his princes at his pleasure[b][a], and to teach his elders wisdom.
translation:
  language: ru
  text: 'чтобы связывать его князей по своей воле[a]

    и наставлять его старейшин в мудрости[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «связывать его князей своей душой»; здесь выражение, вероятно, означает «по своей воле» или «по своему желанию».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «делать его старейшин мудрыми»; также: «учить его старейшин мудрости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶאְסֹר
  choice: связывать
  rationale: Инфинитив от אסר выражает цель или результат возвышения Иосифа; «связывать» прямо передаёт образ ограничения власти или свободы, не сужая смысл до заключения в темницу.
- source_word: שָׂרָיו
  choice: его князей
  rationale: שַׂר обозначает князя, начальника или сановника; в контексте царского двора «князей» сохраняет высокий придворно-политический регистр.
- source_word: בְּנַפְשׁוֹ
  choice: по своей воле
  rationale: Буквально сочетание означает «своей душой / по своей душе», но נֶפֶשׁ здесь естественно обозначает желание или волю. Русское «по своей воле» передаёт идиоматический смысл и сохраняет отнесение к Иосифу.
- source_word: וּזְקֵנָיו
  choice: и его старейшин
  rationale: זָקֵן может обозначать как пожилого человека, так и старейшину или старшего сановника; «старейшин» сохраняет возрастной и управленческий оттенки.
- source_word: יְחַכֵּם
  choice: умудрять
  rationale: Пиэль от חכם допускает значения «делать мудрыми» и «учить мудрости». «Умудрять» кратко сохраняет каузативную неоднозначность.
