  text: פָּרַ֣שׂ עָנָ֣ן לְ/מָסָ֑ךְ וְ֝/אֵ֗שׁ לְ/הָאִ֥יר לָֽיְלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/039.yaml
  text: He spread out a cloud as a covering[a], and fire to give light by night.
translation:
  language: ru
  text: Он распростёр облако как покров[a] и огонь, чтобы светить ночью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для покрова», «как заслон» или «как шатёр». Еврейское слово может означать защитный покров, завесу или заслон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַשׂ
  choice: распростёр
  rationale: Глагол означает «расстилать, простирать»; «распростёр» естественно передаёт образ развёрнутого над народом облака.
- source_word: עָנָן
  choice: облако
  rationale: Прямое значение слова; в контексте речь идёт об облаке, сопровождавшем Израиль в пустыне.
- source_word: לְמָסָךְ
  choice: как покров
  rationale: מָסָךְ может обозначать покров, завесу или заслон. «Как покров» сохраняет функциональный образ, не уточняя его сверх сказанного в еврейском тексте.
- source_word: וְאֵשׁ
  choice: и огонь
  rationale: Буквальная передача сохраняет поэтический параллелизм облака и огня и аллюзию на исход.
- source_word: לְהָאִיר
  choice: чтобы светить
  rationale: Инфинитив с לְ выражает цель; эта формулировка естественно передаёт назначение огня.
- source_word: לָיְלָה
  choice: ночью
  rationale: Краткое и естественное русское наречное соответствие значению «в ночное время».
theological_decisions:
- issue: Подразумеваемое подлежащее
  choice: Он, то есть Бог
  alternative: Господь
  rationale: В еврейском тексте подлежащее выражено формой глагола и определяется из контекста. Местоимение «Он» сохраняет связность оригинала, не добавляя имени в сам стих.
- issue: Образы явления Бога в пустыне
  choice: Сохранить буквальные образы облака и огня без пояснительного расширения
  alternative: Прямо назвать их облачным и огненным столпами
  rationale: Стих отсылает к повествованию об исходе, однако называет лишь облако и огонь и указывает их функции. Перевод не добавляет отсутствующего в строке уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Распростёр» и «покров» сохраняют достоинство псалма, оставаясь понятными современному читателю.
