lexical_decisions:
- source_word: הָפַךְ
  choice: изменил
  rationale: Глагол означает «повернуть, обратить, изменить». В сочетании с «сердцем» русское «изменил» естественно передаёт сильное воздействие субъекта и не ослабляет прямое указание на Божье действие.
- source_word: לִבָּם
  choice: их сердце
  rationale: В еврейском стоит единственное число с суффиксом множественного числа — собирательное обозначение внутреннего настроя всего народа. Единственное число сохранено в основном тексте.
- source_word: לִשְׂנֹא
  choice: возненавидели
  rationale: Инфинитив от שׂנא прямо выражает ненависть. Личная форма в русском естественно раскрывает результат изменения сердца, не меняя действующих лиц.
- source_word: עַמּוֹ
  choice: Его народ
  rationale: עַם здесь обозначает народ Господа, Израиль; «народ» — точный и обычный русский эквивалент.
- source_word: לְהִתְנַכֵּל
  choice: стали строить козни
  rationale: Форма от נכל обозначает коварные, злоумышленные действия. Выражение «строить козни против» естественно по-русски передаёт направленную враждебную хитрость; в сноске сохраняется более буквальная альтернатива.
- source_word: בַּעֲבָדָיו
  choice: против Его слуг
  rationale: Предлог ב при данном глаголе обозначает объект враждебного действия и естественно передаётся словом «против». עבד в этом контексте характеризует Израиль как служащих Богу, поэтому выбрано «слуги», а не «рабы».
theological_decisions:
- issue: Божье действие в изменении настроя египтян
  choice: 'Сохранено прямое утверждение: «Он изменил их сердце».'
  alternative: «Он позволил их сердцу измениться» или безличное «их сердце изменилось».
  rationale: В еврейском тексте стоит активный глагол в 3-м лице единственного числа, а подразумеваемый субъект — Бог из ближайшего контекста. Перевод не смягчает напряжение между Божьим действием и враждебными поступками людей.
- issue: Цель или результат в двух инфинитивных конструкциях
  choice: 'Основной текст передаёт их как последовавший результат: «и они возненавидели… стали строить козни».'
  alternative: 'Целевое прочтение: «чтобы они возненавидели… и коварно поступали…».'
  rationale: Еврейский предлог ל с инфинитивом допускает оттенок цели или результата. Контекст естественно допускает результативное прочтение, но неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Собирательное «их сердце» сохранено ради образа оригинала; менее прозрачные элементы пояснены сносками. Местоимение «Его» написано с прописной буквы как издательское обозначение отсылки к Богу.
