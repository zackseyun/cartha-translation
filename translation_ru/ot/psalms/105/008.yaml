  text: זָכַ֣ר לְ/עוֹלָ֣ם בְּרִית֑/וֹ דָּבָ֥ר צִ֝וָּ֗ה לְ/אֶ֣לֶף דּֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/008.yaml
  text: He remembers his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: ru
  text: 'Он вечно помнит Свой завет,

    слово, которое Он установил для тысячи поколений.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обещание, которое Он установил для тысячи поколений».'
    reason: 'Контекстуальная лексическая альтернатива для דָּבָר: слово может пониматься как обещание, связанное с заветом.'
lexical_decisions:
- source_word: זָכַר
  choice: помнит
  rationale: Перфект Qal в поэтическом контексте выражает устойчивую и продолжающуюся верность Бога; настоящее время естественно передаёт эту силу по-русски.
- source_word: לְעוֹלָם
  choice: вечно
  rationale: Кратко и естественно передаёт неограниченную длительность, сохраняя утверждение о неизменности завета.
- source_word: בְּרִיתוֹ
  choice: Свой завет
  rationale: «Завет» — точное и устоявшееся соответствие в библейском контексте; возвратное «Свой» ясно соотносит завет с подлежащим «Он».
- source_word: דָּבָר
  choice: слово
  rationale: Сохраняет широкий смысл еврейского слова и поэтическое соответствие с «заветом», не сужая его без необходимости до «обещания».
- source_word: צִוָּה
  choice: заповедал
  rationale: Передаёт прямое значение интенсивной породы глагола צוה и торжественную силу Божьего установления.
- source_word: לְאֶלֶף דּוֹר
  choice: на тысячу поколений
  rationale: Предлог «на» естественно выражает протяжённость действия, а множественное «поколений» требуется русским сочетанием с числительным «тысячу».
theological_decisions:
- issue: Временной аспект Божьей памяти о завете
  choice: 'Настоящее время: «помнит»'
  alternative: «вспомнил» или «помнил»
  rationale: Контекст прославляет непрестанную верность Бога, поэтому настоящее время не ограничивает действие одним моментом прошлого.
- issue: Значение דָּבָר в параллели с заветом
  choice: В основном тексте — «слово»
  alternative: «обещание»
  rationale: «Слово» сохраняет лексическую широту и формальную поэтическую параллель; «обещание» возможно по контексту, но истолковывает выражение уже.
- issue: Смысл צִוָּה применительно к заветному слову
  choice: «заповедал»
  alternative: «установил»
  rationale: Основное значение глагола сохранено, хотя в данном контексте он может также подразумевать властное установление.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной псалмовой интонацией. Порядок строк сохраняет еврейский параллелизм; местоимение «Свой» написано с прописной буквы как уважительное обозначение принадлежности Богу.
