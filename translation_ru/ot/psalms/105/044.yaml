lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Он отдал
  rationale: Форма Qal wayyiqtol от נתן обозначает совершённое действие — передачу во владение. «Отдал» естественно передаёт дарование земель в данном контексте.
- source_word: לָהֶם
  choice: им
  rationale: Местоименный суффикс третьего лица мужского рода множественного числа указывает на получателей дара.
- source_word: אַרְצוֹת גּוֹיִם
  choice: земли народов
  rationale: Сохраняется множественное число אַרְצוֹת и территориально-политическое значение גּוֹיִם; «народов» здесь точнее и нейтральнее, чем конфессионально окрашенное «язычников».
- source_word: וַעֲמַל
  choice: плоды труда
  rationale: עָמָל может обозначать как сам тяжёлый труд, так и приобретённое или произведённое этим трудом. В сочетании с «унаследовали» метонимическое значение результата труда звучит по-русски естественно; буквальная возможность отмечена в сноске.
- source_word: לְאֻמִּים
  choice: племён
  rationale: לְאֻמִּים означает народы или этнические общности. «Племён» сохраняет коллективный смысл и избегает тяжёлого повтора слова «народов» в одной строке.
- source_word: יִירָשׁוּ
  choice: они унаследовали
  rationale: Qal imperfect от ירש в повествовательной последовательности описывает вступление во владение. «Унаследовали» сохраняет оттенок получения владения по дарованию, а не только силового захвата.
theological_decisions:
- issue: Заветный оттенок ירש
  choice: они унаследовали
  alternative: они завладели
  rationale: В контексте Бог передаёт Израилю земли народов. «Унаследовали» сохраняет смысл владения, полученного как Божий дар, не исключая фактического вступления во владение.
