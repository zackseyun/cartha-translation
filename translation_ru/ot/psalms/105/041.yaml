  yaml_path: translation/ot/psalms/105/041.yaml
  text: He opened the rock[a], and water gushed out; they flowed through the dry places like a river.
translation:
  language: ru
  text: Он открыл скалу — и хлынули воды; они потекли по иссохшим местам, словно река.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «они потекли по иссохшим местам рекой». В еврейском тексте нет отдельного слова «словно», но заключительное «река» вероятнее всего имеет сравнительный смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַח
  choice: открыл
  rationale: Передаёт обычное значение глагола без усиления образа словами «расколол» или «разбил», которых еврейский текст прямо не требует.
- source_word: צוּר
  choice: скалу
  rationale: Контекстуально определённая скала отсылает к известному эпизоду странствования Израиля, хотя артикля в еврейском тексте нет.
- source_word: וַיָּז֣וּבוּ מָיִם
  choice: хлынули воды
  rationale: Сохраняет множественное число существительного и глагола и передаёт внезапное обильное истечение воды.
- source_word: הָלְכוּ
  choice: они потекли
  rationale: Буквально глагол означает «пошли», но применительно к водам естественно передаётся как «потекли»; местоимение сохраняет множественное согласование оригинала.
- source_word: בַּצִּיּוֹת
  choice: по иссохшим местам
  rationale: Передаёт движение вод по сухой, иссушенной местности, не сужая значение до пустынь в строгом смысле.
- source_word: נָהָר
  choice: словно река
  rationale: Явно выраженное сравнение естественно по-русски передаёт предикативно-образную функцию заключительного существительного.
theological_decisions:
- issue: Связь со снабжением Израиля водой во время исхода
  choice: Передать стих как историко-поэтическое описание того, как Бог извёл воду из скалы.
  alternative: Понимать образ прежде всего как обобщённую метафору Божьего обеспечения.
  rationale: Контекст псалма пересказывает историю Израиля; перевод сохраняет конкретное событие и не исключает его более широкого богословского звучания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Форма «воды» сохраняет образ и грамматическое множественное число еврейского текста; архаизмы вроде «отверз» не используются.
