  yaml_path: translation/ot/psalms/105/012.yaml
  text: When they were few in number[a], very few, and sojourners in it,
translation:
  language: ru
  text: 'когда их было мало числом,

    совсем мало, и они были пришельцами в ней.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «временно жили в ней как чужеземцы». Еврейское слово обозначает проживание в чужой земле без положения коренного жителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתָם
  choice: когда их было
  rationale: Предлог ב с инфинитивом היה и суффиксом 3-го лица множественного числа вводит временное придаточное; эта передача естественна по-русски.
- source_word: מְתֵי מִסְפָּר
  choice: мало числом
  rationale: Еврейская идиома обозначает небольшое, легко исчислимое число людей; формулировка сохраняет образ исходного текста и понятна современному читателю.
- source_word: כִּמְעַט
  choice: совсем мало
  rationale: В данном контексте выражение усиливает предшествующую мысль о малочисленности.
- source_word: וְגָרִים
  choice: и они были пришельцами
  rationale: Причастие от גור обозначает людей, живущих не в своей земле как чужеземцы или временные жители. Добавление связки и местоимения требуется для естественного русского синтаксиса.
- source_word: בָּהּ
  choice: в ней
  rationale: Суффикс женского рода единственного числа отсылает к земле, упомянутой в предыдущем контексте; местоименная передача сохраняет форму оригинала.
