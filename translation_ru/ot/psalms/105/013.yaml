lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: они странствовали
  rationale: Форма хитпаэль от הלך передаёт неоднократное перемещение с места на место. «Странствовали» естественно выражает длительное и повторяющееся движение патриархов, не обязательно подразумевая бесцельность.
- source_word: מִגּוֹי אֶל גּוֹי
  choice: от народа к народу
  rationale: גּוֹי обозначает народ или этнополитическую общность. Повтор существительного сохраняет ритм и параллелизм еврейского текста.
- source_word: מִמַּמְלָכָה
  choice: из одного царства
  rationale: מַמְלָכָה означает царство. Слово «одного» добавлено по нормам русского соотносительного оборота «из одного… к другому», не меняя смысла исходной конструкции.
- source_word: אֶל עַם אַחֵר
  choice: к другому племени
  rationale: עַם означает народ или общность людей, а אַחֵר — «другой». «Племени» позволяет сохранить лексическое различие между גּוֹי и עַם и избежать неуклюжего повторения слова «народ» во второй строке.
