lexical_decisions:
- source_word: עִנּוּ
  choice: терзали
  rationale: Пиэль глагола ענה означает «мучить, угнетать, причинять страдание». В сочетании с ногами и оковами «терзали» естественно передаёт причинённую боль, не уточняя не названных в еврейском тексте действующих лиц.
- source_word: בַכֶּבֶל
  choice: оковами
  rationale: כבל обозначает оковы или путы; предлог ב здесь передан как указание на орудие воздействия.
- source_word: רַגְלָיו
  choice: его ноги
  rationale: Форма с местоименным суффиксом прямо указывает на ноги Иосифа.
- source_word: בַּרְזֶל
  choice: в железо
  rationale: Сохранено буквальное «железо», поскольку в тексте прямо не названы ни ошейник, ни цепь; предлог ב допускает пространственное понимание «в».
- source_word: בָּאָה
  choice: вошла
  rationale: 'Глагол בוא в женском роде согласуется с נַפְשׁוֹ, поэтому именно «душа» является грамматическим подлежащим: она «вошла» в железо.'
- source_word: נַפְשׁוֹ
  choice: душа его
  rationale: Нефеш может означать душу, жизнь, самого человека, а иногда в телесном контексте горло или шею. Основной текст сохраняет формально точный и поэтически напряжённый образ, а контекстуальная альтернатива дана в сноске.
