  text: נָתַ֣ן גִּשְׁמֵי/הֶ֣ם בָּרָ֑ד אֵ֖שׁ לֶהָב֣וֹת בְּ/אַרְצָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/105/032.yaml
  text: He gave them hail for rain[a], and flaming fire in their land.
translation:
  language: ru
  text: 'Вместо дождя Он дал им град

    и пылающий огонь[a] на их земле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молнии», «огненные стрелы»; буквально: «огонь пламени» или «пылающий огонь».'
    reason: 'Лексико-контекстуальная альтернатива: выражение может обозначать молнии, сопровождавшие град, но буквальная образность шире.'
lexical_decisions:
- source_word: נָתַן
  choice: дал
  rationale: Основное значение глагола — «дать». Такая передача сохраняет еврейский образ и выражает действие Бога, не заменяя его более истолковывающим «послал».
- source_word: גִּשְׁמֵיהֶם בָּרָד
  choice: вместо дождя Он дал им град
  rationale: Буквально сочетание передаёт замену их обычных дождей градом. Русская конструкция «вместо дождя… град» естественно и ясно сохраняет этот смысл.
- source_word: אֵשׁ לֶהָבוֹת
  choice: пылающий огонь
  rationale: Сочетание буквально соединяет «огонь» и «пламя». «Пылающий огонь» сохраняет усиленный поэтический образ, не сводя его однозначно к молнии.
- source_word: בְּאַרְצָם
  choice: по всей их земле
  rationale: Предлог допускает значение местонахождения «в их земле»; по-русски «по всей их земле» естественно передаёт распространение бедствия в пределах страны, хотя слово «вся» прямо не выражено.
theological_decisions:
- issue: Природа אֵשׁ לֶהָבוֹת в описании египетской казни
  choice: пылающий огонь
  alternative: молнии; огненные стрелы
  rationale: Контекст казни градом допускает понимание образа как молний, однако сама еврейская фраза говорит об огне и пламени. Основной текст сохраняет более широкий образ, а контекстуальные толкования вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Инверсия «Он дал» после начальной предложной группы поддерживает ритм; параллелизм двух бедствий сохранён. Маркер сноски поставлен непосредственно после спорного выражения.
