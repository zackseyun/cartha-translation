  text: יְבָרְכֵ֥/נוּ אֱלֹהִ֑ים וְ/יִֽירְא֥וּ אֹ֝ת֗/וֹ כָּל אַפְסֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/007.yaml
  text: God will bless us[a], and all the ends of the earth will fear him.
translation:
  language: ru
  text: Бог благословит нас, и убоятся Его все концы земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да благословит нас Бог, и да убоятся Его все концы земли». Еврейские формы могут выражать как уверенное ожидание, так и пожелание; глагол «бояться» здесь включает благоговение и трепет перед Богом.'
    reason: Сохранение грамматической и лексической неоднозначности оригинала.
lexical_decisions:
- source_word: יְבָרְכֵנוּ
  choice: благословит нас
  rationale: Пиэль глагола ברך с суффиксом 1-го лица множественного числа означает «благословит нас». Имперфект передан как уверенное будущее; пожелательное «да благословит нас» также возможно, но заключительный стих естественно звучит как выражение уверенности.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму, слово обозначает единственного Бога, что подтверждается контекстом и местоимением единственного числа.
- source_word: וְיִירְאוּ
  choice: и убоятся
  rationale: Глагол ירא по отношению к Богу охватывает страх, благоговение и трепет. «Убоятся» сохраняет эту смысловую напряжённость и соответствует возвышенному поэтическому регистру.
- source_word: אֹתוֹ
  choice: Его
  rationale: Местоимение мужского рода единственного числа относится к Богу.
- source_word: כָּל אַפְסֵי אָרֶץ
  choice: все концы земли
  rationale: Устойчивый поэтический оборот означает все самые отдалённые области мира; буквальная образность сохранена.
theological_decisions:
- issue: Смысл ירא по отношению к Богу
  choice: убоятся Его
  alternative: будут благоговеть перед Ним; исполнятся трепета перед Ним
  rationale: Выбор сохраняет сочетание страха, благоговения, трепета и покорности, не сводя значение лишь к уважению.
- issue: Модальность יְבָרְכֵנוּ
  choice: Бог благословит нас
  alternative: Да благословит нас Бог
  rationale: Имперфект допускает пожелательный оттенок, однако в заключении псалма вероятнее уверенное утверждение о результате Божьего действия; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической окраской. Форма «убоятся» книжная, но понятная и уместная в псалме; она точнее сохраняет многозначность ירא, чем более узкое «будут почитать».
