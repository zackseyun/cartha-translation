  text: אֶ֭רֶץ נָתְנָ֣ה יְבוּלָ֑/הּ יְ֝בָרְכֵ֗/נוּ אֱלֹהִ֥ים אֱלֹהֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/006.yaml
  text: The earth has yielded its produce[a]; God, our God[b], blesses us.
translation:
  language: ru
  text: Земля дала свой урожай[a]; Бог, наш Бог, благословляет нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Страна дала свой урожай». Еврейское אֶרֶץ может означать как «земля», так и «страна».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «да благословит нас Бог, наш Бог»; или: «Бог, наш Бог, благословит нас». Еврейский глагол в этом контексте можно понимать как настоящее утверждение, пожелание или будущее.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶרֶץ
  choice: земля
  rationale: В контексте всеобщего охвата псалма слово лучше понимать широко — как «земля»; при этом еврейское слово допускает и более узкое значение «страна».
- source_word: נָתְנָה
  choice: дала
  rationale: Прямое значение глагола — «дала». В сочетании с урожаем это естественно звучит по-русски и передаёт завершённость действия.
- source_word: יְבוּלָהּ
  choice: свой урожай
  rationale: Слово обозначает плодородный выход земли, её произведение. «Урожай» — ясный и естественный современный русский эквивалент; местоимение «свой» передаёт суффикс третьего лица женского рода, относящийся к земле.
- source_word: יְבָרְכֵנוּ
  choice: благословляет нас
  rationale: Еврейская форма в данном контексте может выражать настоящее утверждение, пожелание или будущее. В основном тексте выбрано уверенное утверждение о Божьем благословении, а другие возможности сохранены в сноске.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Обычный русский эквивалент божественного наименования, здесь относящегося к единому Богу Израиля.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Форма с суффиксом первого лица множественного числа передана прямо. Повтор «Бог, наш Бог» сохранён ради еврейского акцента и близости выражения.
theological_decisions:
- issue: Смысловая сила формы יְבָרְכֵנוּ
  choice: 'изъявительное настоящее: «благословляет нас»'
  alternative: 'пожелание: «да благословит нас»; будущее: «благословит нас»'
  rationale: Имперфектная форма допускает все эти оттенки. Утверждение о уже данном урожае поддерживает чтение как уверенного признания настоящего благословения, однако молитвенный и будущий смыслы нельзя исключить, поэтому они отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с простым, возвышенным звучанием. Параллельность и подчёркнутый повтор «Бог, наш Бог» сохранены; неоднозначность глагольной формы не устранена, а вынесена в сноску.
