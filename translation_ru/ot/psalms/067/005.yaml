lexical_decisions:
- source_word: יוֹדוּךָ
  choice: да восхвалят тебя
  rationale: Порода hифиль глагола ידה в псалмах обычно обозначает публичное прославление Бога, нередко с оттенком благодарения. «Да восхвалят тебя» естественно передаёт здесь молитвенно-пожелательное звучание и подходит к поэтическому рефрену.
- source_word: עַמִּים
  choice: народы
  rationale: Форма множественного числа указывает на разные этнические общности и сохраняет вселенский охват стиха; русское «народы» передаёт это непосредственно и естественно.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Слово употреблено как прямое обращение. Русская звательная форма «Боже» ясно и естественно передаёт эту функцию.
- source_word: כֻּלָּם
  choice: все
  rationale: Слово охватывает народы во всей их совокупности. Сочетание «все народы» кратко и идиоматично передаёт усиление второй строки.
theological_decisions:
- issue: Наклонение и функция повторяющейся фразы
  choice: 'Передать как молитвенное пожелание: «Да восхвалят тебя народы»'
  alternative: «Народы восхвалят тебя»
  rationale: Форма יֹודוּ допускает понимание как будущего времени, однако молитвенный контекст псалма и характер рефрена делают пожелательно-побудительное прочтение наиболее вероятным. Альтернатива сохранена в сноске, чтобы не устранять подлинную грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенно-поэтическим звучанием. Повтор и параллелизм еврейского текста сохранены; местоимение «тебя» написано со строчной буквы в соответствии с нейтральной современной издательской нормой.
