lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов слово обозначает ответственного за музыкальное исполнение или его руководство; дательный падеж естественно передаёт לְ и принятую форму русского надписания.
- source_word: בִּנְגִינֹת
  choice: На струнных инструментах
  rationale: Существительное в музыкальном надписании указывает на струнные инструменты или исполняемую ими музыку; предлог בְּ естественно передан как «на».
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Стандартное жанровое обозначение сохранено отдельно, без сведения его к общему понятию песни.
- source_word: שִׁיר
  choice: Песнь
  rationale: Самостоятельное жанровое обозначение сохраняет двойную формулу еврейского текста; «песнь» соответствует возвышенному, но понятному регистру библейского надписания.
