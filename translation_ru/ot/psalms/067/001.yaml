  text: אֱלֹהִ֗ים יְחָנֵּ֥/נוּ וִֽ/יבָרְכֵ֑/נוּ יָ֤אֵ֥ר פָּנָ֖י/ו אִתָּ֣/נוּ סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/001.yaml
  text: May God be gracious to us and bless us[a]; may his face shine upon us[c][b]. Selah
translation:
  language: ru
  text: Да будет Бог милостив к нам и благословит нас; да засияет над нами Его лицо[a][b]. Села[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Числа 6:24–26, особенно 6:25, где говорится о сиянии лица Господа.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «да сделает сияющим лицо Своё с нами». Еврейское «с нами» в этом образе обычно передаёт направленность Божьего благоволения к народу.'
    reason: lexical_alternative
  - marker: c
    text: «Села» — вероятно, богослужебное или музыкальное указание; его точное значение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Хотя форма существительного морфологически множественная, согласование и контекст ясно указывают здесь на единого Бога; поэтому требуется единственное число.
- source_word: יְחָנֵּנוּ
  choice: да будет милостив к нам
  rationale: Форма от חנן в молитвенном контексте выражает просьбу о благосклонности и милости. Этот вариант сохраняет литургический тон и не сужает значение до одного лишь сострадания.
- source_word: וִיבָרְכֵנוּ
  choice: и благословит нас
  rationale: ברך — обычный глагол со значением «благословлять»; простая формулировка точна и естественна по-русски.
- source_word: יָאֵר
  choice: да озарит
  rationale: Каузативная форма от אור буквально передаёт действие «дать сиять, осветить». В сочетании с образом лица глагол «озарить» естественно выражает направленный на людей свет Божьего благоволения.
- source_word: פָּנָיו
  choice: Своим лицом
  rationale: Сохранён конкретный образ лица, а не заменён толкованием вроде «благоволением» или «присутствием», что также удерживает связь со священническим благословением.
- source_word: אִתָּנוּ
  choice: нас
  rationale: Буквально предлог означает «с нами», однако всё выражение обозначает обращённое к молящимся сияние Божьего лица. Естественная русская конструкция «озарит нас Своим лицом» передаёт этот смысл; буквальная особенность отмечена в сноске.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неизвестно; вероятнее всего, это богослужебное или музыкальное указание. Поэтому он сохранён в транслитерации без предположительного толкования.
theological_decisions:
- issue: Побудительно-желательное значение глагольных форм
  choice: 'Передать как молитвенное пожелание: «Да будет Бог милостив… да озарит…»'
  alternative: 'Изъявительное чтение: «Бог милостив к нам и благословляет нас»'
  rationale: В контексте псалма формы естественно выражают просьбу или благословение, а частица «да» сохраняет их молитвенную направленность.
- issue: Отсылка к священническому благословению
  choice: Сохранить образ сияющего Божьего лица
  alternative: 'Истолковать образ: «пусть Бог посмотрит на нас благосклонно»'
  rationale: Стих перекликается с Числами 6:24–26. Сохранение образа позволяет читателю увидеть эту связь, не добавляя к тексту частного богословского истолкования.
- issue: Необычный предлог אִתָּנוּ
  choice: В основном тексте передать естественный смысл направленного на людей сияния, а буквальное «с нами» указать в сноске
  alternative: 'Буквально: «да сияет Его лицо с нами»'
  rationale: Буквальный вариант по-русски неясен и может быть ошибочно понят, однако отличие еврейской формулировки от Чисел 6:25 заслуживает сохранения в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным ритмом. Частица «да» передаёт пожелание без архаической перегруженности; образ Божьего лица сохранён ради поэтики и межтекстовой связи.
