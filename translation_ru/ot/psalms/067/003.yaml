lexical_decisions:
- source_word: יוֹדוּךָ
  choice: да восхвалят Тебя
  rationale: В хифиле глагол ידה в псалмах означает публично хвалить, прославлять или благодарить Бога. «Да восхвалят» передаёт здесь молитвенно-побудительный оттенок формы и сохраняет повтор припева; «благодарят» возможно, но в контексте всеобщего поклонения несколько сужает смысл.
- source_word: עַמִּים
  choice: народы
  rationale: Форма множественного числа обозначает различные народы или этнические общности. «Народы» прямо передаёт это множество, не ограничивая смысл политическими государствами.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Слово употреблено как прямое обращение; русский звательный эквивалент «Боже» естественно и ясно выражает эту функцию.
- source_word: כֻּלָּם
  choice: все
  rationale: «Все» кратко передаёт значение совокупности — все упомянутые народы без исключения — и сохраняет ритм параллельной строки.
theological_decisions:
- issue: Модальность повторяющейся глагольной формы в молитвенном припеве
  choice: 'Передать как пожелание или молитвенный призыв: «да восхвалят»'
  alternative: «народы восхвалят Тебя»; «пусть народы восхвалят Тебя»
  rationale: Еврейская форма морфологически допускает будущее значение, однако в данном литургическом контексте естественнее волитивное прочтение. Частица «да» сохраняет одновременно молитвенный и призывный характер, не превращая строку в однозначное предсказание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмодическим звучанием. Конструкция «да восхвалят» уместна для молитвенного припева и остаётся понятной современному читателю. Повтор и порядок смысловых компонентов сохранены.
