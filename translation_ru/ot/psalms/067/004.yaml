  text: יִֽשְׂמְח֥וּ וִֽ/ירַנְּנ֗וּ לְאֻ֫מִּ֥ים כִּֽי תִשְׁפֹּ֣ט עַמִּ֣ים מִישׁ֑וֹר וּ/לְאֻמִּ֓ים בָּ/אָ֖רֶץ תַּנְחֵ֣/ם סֶֽלָה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/067/004.yaml
  text: Let the nations be glad and sing for joy[a], for you judge the peoples with equity and guide the nations on the earth[b]. Selah
translation:
  language: ru
  text: 'Пусть народы радуются и ликуют[a],

    ведь Ты справедливо судишь народы

    и ведёшь народы на земле[b]. Села.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть народы радуются и поют от радости» или «…ликующе восклицают». Глагол может обозначать радостное пение или звонкие возгласы радости.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в стране», если אֶרֶץ понимать локально; здесь переведено «на земле», поскольку речь во всём псалме идёт о народах всего мира.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: Пусть радуются
  rationale: Имперфект Qal 3-го лица множественного числа здесь естественно понимать как пожелание или призыв. Эта передача сохраняет волитивный оттенок и не смешивает данный глагол со следующим обозначением громкого ликования.
- source_word: וִירַנְּנוּ
  choice: и ликуют
  rationale: Глагол רנן в Piel обозначает звучное выражение радости — радостное пение или возгласы. «Ликуют» естественно передаёт оба оттенка, не сводя значение только к пению.
- source_word: לְאֻמִּים
  choice: народы
  rationale: В контексте псалма слово обозначает различные народы мира; одинаковый перевод сохранён при обоих его употреблениях в стихе.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для радости народов. «Ведь» ясно и естественно выражает причинную связь в современной русской поэтической речи.
- source_word: תִשְׁפֹּט
  choice: судишь
  rationale: Имперфект допускает будущее или обычное действие. Настоящее время здесь выражает характерное действие Бога, не исключая возможной направленности к будущему.
- source_word: עַמִּים
  choice: племена
  rationale: Так сохраняется лексическое различие между עַמִּים и לְאֻמִּים. В данном контексте «племена» обозначает человеческие общности, а не только родоплеменные группы.
- source_word: מִישׁוֹר
  choice: справедливо
  rationale: Существительное выражает прямоту, ровность и, в судебном контексте, беспристрастную справедливость. Наречная передача по-русски звучит естественно и точно характеризует суд.
- source_word: תַּנְחֵם
  choice: ведёшь
  rationale: Hiphil глагола נחה означает вести или направлять. «Ведёшь» сохраняет образ руководства и не ограничивает его только управлением либо физическим перемещением.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: Универсальный охват псалма поддерживает значение «земля, мир», а не более узкое «страна».
- source_word: סֶלָה
  choice: Села
  rationale: Термин сохранён в транслитерации, поскольку его точная литургическая или музыкальная функция остаётся неясной.
theological_decisions:
- issue: Охват אֶרֶץ
  choice: «на земле» в глобальном смысле
  alternative: «в стране» или «на этой земле» в локальном смысле
  rationale: Повторяющиеся упоминания всех народов в Псалме 67 указывают на всемирный горизонт. Сноска сохраняет допустимое более локальное понимание слова.
- issue: Видо-временное значение имперфектов
  choice: пожелание в первой строке и настоящее, характеризующее Божьи действия, в последующих строках
  alternative: 'будущее: «народы будут радоваться… Ты будешь судить… и вести»'
  rationale: Литургический контекст поддерживает призыв или пожелание, а суд и водительство представлены как основание хвалы. При этом грамматическая возможность будущего значения не отрицается.
- issue: Характер Божьего суда
  choice: «справедливо судишь»
  alternative: «судишь по правоте» или «судишь ровно»
  rationale: Перевод передаёт судебно-нравственный смысл מִישׁוֹר без добавления конфессионально обусловленного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Синтаксис прост и пригоден для публичного чтения; местоимение «Ты» написано с прописной буквы в соответствии с распространённой русской библейской традицией. Лексическое различие לְאֻמִּים / עַמִּים передано словами «народы» / «племена».
