  text: that your way may be known on the earth[b][a], your salvation among all nations.
translation:
  language: ru
  text: 'чтобы на земле[a] знали Твой путь,

    среди всех народов — Твоё спасение[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в стране». Еврейское слово может иметь более местное значение, однако параллель «среди всех народов» поддерживает смысл «на земле».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Твоё избавление». Еврейское слово может обозначать как конкретное избавление, так и спасение в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָדַעַת
  choice: чтобы … знали
  rationale: Инфинитив с ל־ выражает цель, продолжая молитву предыдущего стиха. Неопределённо-личная форма естественна по-русски и не вводит отсутствующего в еврейском тексте подлежащего.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: אֶרֶץ может означать как землю вообще, так и конкретную страну. Параллель «среди всех народов» поддерживает здесь всемирный смысл.
- source_word: דַּרְכֶּךָ
  choice: Твой путь
  rationale: Сохраняется метафора еврейского דֶּרֶךְ, которая может обозначать и путь Бога, и образ Его действий.
- source_word: בְּכָל גּוֹיִם
  choice: среди всех народов
  rationale: גּוֹיִם обозначает народы или нации; «среди всех народов» естественно передаёт международный и всеобщий охват выражения.
- source_word: יְשׁוּעָתֶךָ
  choice: Твоё спасение
  rationale: יְשׁוּעָה охватывает избавление, помощь и спасение. «Спасение» сохраняет широту Божьего спасительного действия, не исключая конкретного избавления.
theological_decisions:
- issue: Масштаб значения אֶרֶץ
  choice: всемирное «земля»
  alternative: местное «страна» или «земля Израиля»
  rationale: Параллель со словами «среди всех народов» указывает на всемирный горизонт, хотя лексически местное понимание возможно.
- issue: Смысл יְשׁוּעָה
  choice: «спасение»
  alternative: «избавление»
  rationale: «Спасение» передаёт широкий спектр Божьего спасительного действия и не сводит слово ни к одной позднейшей догматической формулировке.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью и параллелизмом. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
