id: PSA.3.3
reference: Psalms 3:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַתָּ֣ה יְ֭הוָה מָגֵ֣ן בַּעֲדִ֑/י כְּ֝בוֹדִ֗/י וּ/מֵרִ֥ים רֹאשִֽׁ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/003.yaml
  text: But you[a], O Yahweh, are a shield around me, my glory[b], and the one who lifts up my head.
translation:
  language: ru
  text: Но ты, Яхве, — щит вокруг меня[a], моя слава и тот, кто поднимает мою голову[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «щит для меня» или «щит, защищающий меня». Еврейский предлог может указывать на защиту ради кого-либо; здесь, вероятно, присутствует образ защиты, окружающей человека.'
    reason: lexical_alternative
  - marker: b
    text: «Поднимать голову» — еврейский образ восстановления достоинства и уверенности; он также может подразумевать оправдание или избавление от унижения.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַתָּה
  choice: Но ты
  rationale: Союз с самостоятельным местоимением выражает сильное противопоставление бедственному положению, описанному выше; «Но ты» естественно передаёт этот контраст и сохраняет эмфазу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: מָגֵן בַּעֲדִי
  choice: щит вокруг меня
  rationale: Существительное обозначает защитный щит, а предлог допускает значение защиты ради кого-либо, но в сочетании со «щитом» здесь, вероятно, создаёт образ окружающей защиты.
- source_word: כְּבוֹדִי
  choice: моя слава
  rationale: «Слава» сохраняет ёмкость еврейского слова, которое может также обозначать честь и достоинство, не сводя образ к одному толкованию.
- source_word: וּמֵרִים רֹאשִׁי
  choice: и тот, кто поднимает мою голову
  rationale: Причастная форма представлена как постоянное, характерное действие; буквальный образ головы сохранён, поскольку он может подразумевать восстановление достоинства, уверенности или оправдание.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Смысл выражения «поднимает мою голову»
  choice: Сохранить буквальный образ в основном тексте
  alternative: возвращает мне достоинство; придаёт мне уверенность; оправдывает меня
  rationale: Поэтический образ допускает несколько взаимосвязанных оттенков, поэтому основной текст не ограничивает его одним истолкованием, а пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и параллелизма еврейской поэзии. Местоимение «ты» дано со строчной буквы согласно нейтральной современной орфографической практике; обращение остаётся почтительным благодаря контексту. Конкретные образы «щит» и «поднимает мою голову» сохранены без разъясняющей парафразы.
