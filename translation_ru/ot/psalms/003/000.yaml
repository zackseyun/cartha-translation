lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшееся и точное обозначение поэтико-музыкального произведения в заголовках Псалтири.
- source_word: לְדָוִד
  choice: Давида
  rationale: Родительный падеж естественен в русском заголовке и, подобно еврейской конструкции с לְ, допускает авторство, принадлежность, посвящение или связь с Давидом.
- source_word: בְּבָרְחוֹ
  choice: когда он бежал
  rationale: Конструкция בְּ с инфинитивом и местоименным суффиксом имеет временное значение; этот перевод естественно передаёт его по-русски.
- source_word: מִפְּנֵי
  choice: от
  rationale: Буквально выражение связано с нахождением «перед лицом», но при глаголе бегства идиоматически означает удаление от кого-либо.
- source_word: אַבְשָׁלוֹם
  choice: Авессалом
  rationale: Использована традиционная русская библейская форма имени, понятная современному читателю.
- source_word: בְּנוֹ
  choice: своего сына
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит сына с субъектом «он» и сохраняет подчёркнутую в заголовке родственную связь.
theological_decisions:
- issue: Значение надписания לְדָוִד
  choice: Сохранить неоднозначное «Давида», не уточняя авторство.
  alternative: «написанный Давидом» или «для Давида»
  rationale: Предлог לְ в заголовках псалмов может обозначать авторство, принадлежность, посвящение или связь; исходный текст не требует выбрать только одно значение.
translation_notes:
  register: Современный литературный русский язык с традиционными каноническими терминами «псалом», «Давид» и «Авессалом». Синтаксис заголовка краткий и естественный; подлинная неоднозначность надписания вынесена в сноску.
