translation:
  language: ru
  text: Спасение принадлежит Яхве; над Твоим народом — Твоё благословение.[a] Села.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Да будет над Твоим народом Твоё благословение». В еврейском это безглагольная фраза, которую можно понимать и как утверждение, и как молитвенное пожелание.'
    reason: alternative_reading
  - marker: b
    text: «Села» — вероятно, богослужебная или музыкальная помета; её точное значение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: לַיהוָה
  choice: у Яхве
  rationale: 'Предлог לְ в безглагольной именной фразе выражает принадлежность или источник: спасение принадлежит Яхве либо исходит от Него. Конструкция «у Яхве — спасение» естественно сохраняет эту смысловую ёмкость.'
- source_word: הַיְשׁוּעָה
  choice: спасение
  rationale: Существительное обозначает избавление, спасение или победу. «Спасение» уместно в молитвенном контексте и не сужает смысл до одной лишь военной победы.
- source_word: עַל
  choice: на
  rationale: Предлог указывает на благословение, пребывающее на народе; русское «на народе» сохраняет образ и соответствует возвышенному библейскому регистру.
- source_word: עַמְּךָ
  choice: народе Твоём
  rationale: Слово עַם обозначает народ как общину, связанную с Богом. Перевод сохраняет притяжательное обращение к Богу.
- source_word: בִרְכָתֶךָ
  choice: благословение Твоё
  rationale: Прямой эквивалент существительного בְּרָכָה; он шире и точнее, чем интерпретирующее «милость» или «благоволение».
- source_word: סֶּלָה
  choice: Села
  rationale: Точное значение термина неизвестно; вероятно, это литургическая или музыкальная помета, поэтому он транслитерирован, а не истолкован в основном тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблено собственное имя Бога, Тетраграмматон. «Яхве» передаёт его как имя и не подменяет титулом.
- issue: Понимание безглагольной второй фразы
  choice: на народе Твоём — благословение Твоё
  alternative: да будет на народе Твоём благословение Твоё
  rationale: В еврейском тексте глагол отсутствует, поэтому фраза может быть утверждением или молитвенным пожеланием. Безглагольная русская конструкция сохраняет эту подлинную неоднозначность, не добавляя явно ни изъявительного, ни желательного наклонения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия и тире передают параллелизм двух кратких безглагольных фраз. Прописные буквы в местоимениях «Твоём», «Твоё» поддерживают традиционный благоговейный регистр без внесения дополнительного богословского толкования.
