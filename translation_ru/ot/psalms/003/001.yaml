  text: יְ֭הוָה מָֽה רַבּ֣וּ צָרָ֑/י רַ֝בִּ֗ים קָמִ֥ים עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/001.yaml
  text: O Yahweh[a], how many are my adversaries! Many are rising up against me.
translation:
  language: ru
  text: Яхве[a], как много у меня врагов! Многие восстают против меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Яхве» — личное имя Бога, обозначаемое четырьмя согласными יהוה (ЙХВХ).'
    reason: Уточнение передачи Божьего имени в исходном тексте.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: מָה רַבּוּ
  choice: как много
  rationale: מָה употреблено в восклицательной конструкции, а форма רבה указывает на многочисленность; русское «как много» естественно передаёт и смысл, и эмоциональную силу.
- source_word: צָרָי
  choice: у меня врагов
  rationale: צָר обозначает тех, кто враждебно противостоит говорящему. «Враги» — ясный и естественный эквивалент; притяжательный суффикс передан конструкцией «у меня».
- source_word: רַבִּים
  choice: Многие
  rationale: Субстантивированное прилагательное вынесено в начало второй фразы и сохраняет эмфатический повтор мысли о множестве противников.
- source_word: קָמִים עָלָי
  choice: восстают против меня
  rationale: Причастие קָמִים с עַל описывает продолжающееся враждебное выступление против говорящего; «восстают против меня» сохраняет образ, не уточняя его как прямое нападение.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон. Форма «Яхве» передаёт личное имя и не подменяет его титулом; «Иегова» отражает более позднюю традиционную вокализацию.
translation_notes:
  register: Современный литературный русский язык с краткой, эмоционально напряжённой поэтической фразой. Повтор «много / многие» намеренно сохранён как смысловой и риторический элемент оригинала.
