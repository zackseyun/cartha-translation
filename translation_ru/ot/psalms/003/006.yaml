source:
  edition: WLC
  text: לֹֽא אִ֭ירָא מֵ/רִבְב֥וֹת עָ֑ם אֲשֶׁ֥ר סָ֝בִ֗יב שָׁ֣תוּ עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/006.yaml
  text: I will not fear myriads of people who have set themselves all around me[a].
translation:
  language: ru
  text: Не убоюсь мириадов людей, которые со всех сторон ополчились против меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые расположились вокруг меня».'
    reason: 'Лексическое сочетание סָבִיב שָׁתוּ עָלָי допускает более пространственное прочтение: враги заняли позиции вокруг псалмопевца; основной текст яснее выражает подразумеваемую враждебность.'
lexical_decisions:
- source_word: לֹא אִירָא
  choice: Не убоюсь
  rationale: Сочетание отрицания с имперфектом ירא выражает уверенное отношение к настоящему и будущему; «не убоюсь» кратко и естественно передаёт решимость псалмопевца, сохраняя возвышенный поэтический регистр.
- source_word: מֵרִבְבוֹת
  choice: мириадов
  rationale: רְבָבוֹת обозначает огромные множества, буквально десятки тысяч; «мириады» сохраняет числовой образ, не сводя его к точному подсчёту. Предлог מִן после глагола страха по-русски отдельно не передаётся.
- source_word: עָם
  choice: людей
  rationale: В данном контексте עָם означает множество людей, выступающих против псалмопевца, а не государство или отвлечённый народ.
- source_word: סָבִיב
  choice: со всех сторон
  rationale: Передаёт образ полного окружения, заложенный в наречии סָבִיב.
- source_word: שָׁתוּ עָלָי
  choice: ополчились против меня
  rationale: Буквально выражение говорит о том, что люди расположились или поставили себя вокруг/против говорящего. «Ополчились» естественно передаёт враждебное размещение, а «против меня» сохраняет силу עָלָי.
