  text: With my voice I cry to Yahweh[a], and he answers me from his holy mountain[b]. Selah
translation:
  language: ru
  text: 'Своим голосом я взываю к Яхве,

    и Он отвечает мне[a] со Своей святой горы[b].

    Села.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и Он ответил мне». В данном контексте еврейский глагол можно передать прошедшим временем.'
    reason: alternative_reading
  - marker: b
    text: 'Также возможно: «с Его святого холма». Еврейское слово прежде всего означает «гора»; вероятно, имеется в виду Сион.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: во весь голос
  rationale: Буквально — «мой голос». В сочетании с אֶקְרָא выражение означает слышимое обращение вслух; «во весь голос» естественно передаёт это по-русски и сохраняет выразительность начальной позиции.
- source_word: אֶל
  choice: к
  rationale: Предлог указывает направление обращения к Яхве; русский предлог «к» естественен при глаголе «взывать».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶקְרָא
  choice: взываю
  rationale: В контексте молитвы קרא означает призывать, обращаться с мольбой. «Взываю» соответствует бедственному контексту псалма и сохраняет возвышенный, но понятный регистр.
- source_word: וַיַּעֲנֵנִי
  choice: и Он отвечает мне
  rationale: Хотя форма допускает повествовательное прошедшее время, в поэтической речи её можно понимать как живое или характерное действие. Настоящее время передаёт непосредственную уверенность псалмопевца; прошедшее отмечено в сноске.
- source_word: מֵהַר קָדְשׁוֹ
  choice: со Своей святой горы
  rationale: הַר прежде всего означает «гора». Притяжательное местоимение передано возвратной формой «Своей», поскольку субъектом ответа является Яхве.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неизвестно, поэтому он передан традиционной транслитерацией без истолкования.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Видо-временное значение וַיַּעֲנֵנִי в поэзии
  choice: 'настоящее время: «Он отвечает мне»'
  alternative: 'прошедшее время: «Он ответил мне»'
  rationale: Поэтический контекст допускает и живое настоящее, выражающее уверенность, и отсылку к уже полученному ответу. Основной текст выбирает настоящее, а действительная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия избегается ради ясности. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятым благоговейным библейским регистром.
