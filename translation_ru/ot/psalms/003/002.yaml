translation:
  language: ru
  text: 'Многие говорят обо мне[a]: «Нет ему спасения у Бога».[b] Села.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «моей душе», то есть «мне»; в данном контексте выражение может означать «обо мне».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в Боге». Или: «Нет ему спасения от Бога».'
    reason: lexical_alternative
