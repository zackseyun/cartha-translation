    text: «Села» — вероятно, музыкальный или богослужебный термин; его точное значение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: רַבִּים
  choice: Многие
  rationale: Прилагательное употреблено самостоятельно и обозначает множество людей; краткое «многие» естественно передаёт неопределённое множественное число.
- source_word: אֹמְרִים
  choice: говорят
  rationale: Причастие выражает продолжающееся или повторяющееся действие; русское настоящее время естественно передаёт этот смысл.
- source_word: לְנַפְשִׁי
  choice: обо мне
  rationale: Буквально выражение связано с «моей душой», но נֶפֶשׁ здесь может обозначать самого человека. «Обо мне» ясно передаёт смысл, не создавая ложного впечатления, будто речь только о внутренней жизни псалмопевца.
- source_word: אֵין
  choice: нет
  rationale: Обычное отрицание наличия; «нет» естественно и точно вводит утверждение об отсутствии спасения.
- source_word: יְשׁוּעָתָה
  choice: спасения
  rationale: Слово обозначает спасение или избавление. «Спасение» сохраняет как смысл конкретного избавления, так и более широкий богословский оттенок, свойственный Псалтири.
- source_word: לּוֹ
  choice: ему
  rationale: Местоименный суффикс указывает на псалмопевца в третьем лице внутри цитируемых слов его противников.
- source_word: בֵאלֹהִים
  choice: в Боге
  rationale: Так сохраняется обычное значение предлога ב и намеренно не устраняется неоднозначность выражения; по смыслу возможна мысль, что у Бога или от Бога для него нет спасения.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неизвестно, поэтому он транслитерирован, а не заменён предположительным толкованием вроде «пауза».
theological_decisions:
- issue: Передача יְשׁוּעָה как «спасение» или как более узкое «избавление»
  choice: спасение
  alternative: избавление
  rationale: Контекст допускает конкретное избавление от врагов, однако «спасение» сохраняет более полный диапазон слова и его богословскую значимость, не исключая непосредственного смысла.
- issue: Передача לְנַפְשִׁי буквально или идиоматически
  choice: обо мне
  alternative: моей душе / мне
  rationale: נֶפֶשׁ может обозначать всего человека. Идиоматический перевод понятен современному читателю, а сноска сохраняет буквальную форму и возможность понимать слова как обращённые к псалмопевцу.
- issue: Передача בֵאלֹהִים с сохранением предлога или с пояснением источника спасения
  choice: в Боге
  alternative: от Бога
  rationale: «В Боге» формально соответствует еврейскому предлогу и сохраняет напряжение исходной формулировки; «от Бога» яснее по-русски, но уже истолковывает отношение как источник действия.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным ритмом, уместным для Псалтири. Синтаксис прост и понятен; исходная неоднозначность отмечена в сносках без конфессионального истолкования.
