  text: ק֘וּמָ֤/ה יְהוָ֨ה הוֹשִׁ֘יעֵ֤/נִי אֱלֹהַ֗/י כִּֽי הִכִּ֣יתָ אֶת כָּל אֹיְבַ֣/י לֶ֑חִי שִׁנֵּ֖י רְשָׁעִ֣ים שִׁבַּֽרְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/003/007.yaml
  text: Rise up[a], O Yahweh; save me, my God. For you have struck all my enemies on the cheek; you have broken the teeth of the wicked.
translation:
  language: ru
  text: Восстань, Яхве! Спаси меня, Боже мой! Ведь Ты поразил всех моих врагов по щеке и сокрушил зубы нечестивых.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские формы можно также понимать как выражение постоянного действия или уверенности в грядущем: «Ты поражаешь всех моих врагов… и сокрушаешь зубы нечестивых». Слово, переведённое как «щека», может также означать «челюсть».'
    reason: Сохранение аспектуально-временной неоднозначности еврейских перфектов и лексической неоднозначности לֶחִי.
lexical_decisions:
- source_word: קוּמָה
  choice: Восстань
  rationale: Повелительная форма глагола קום передаёт настойчивый призыв к Божьему вмешательству; «восстань» сохраняет возвышенный, но понятный современному читателю тон.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: הוֹשִׁיעֵנִי
  choice: спаси меня
  rationale: Побудительная форма породы hifil с суффиксом первого лица означает просьбу о спасении или избавлении; «спаси меня» передаёт широкий основной смысл.
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Звательная конструкция естественно передаёт личное обращение псалмопевца.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для просьбы; «ведь» естественно выражает пояснительно-причинную связь в русской молитвенной речи.
- source_word: הִכִּיתָ
  choice: Ты поразил
  rationale: Перфектная форма буквально представляет действие как совершённое. «Поразил» сохраняет силу образа и сочетается с указанием на щёку.
- source_word: אֶת כָּל אֹיְבַי
  choice: всех моих врагов
  rationale: Прямая и естественная передача определённого прямого дополнения.
- source_word: לֶחִי
  choice: по щеке
  rationale: Слово может обозначать щёку или челюсть. «По щеке» естественно по-русски передаёт удар, несущий также оттенок унижения; вариант «по челюсти» отмечен в сноске.
- source_word: שִׁנֵּי רְשָׁעִים
  choice: зубы нечестивых
  rationale: Сохранён конкретный телесный образ и субстантивированное обозначение нечестивых как группы.
- source_word: שִׁבַּרְתָּ
  choice: сокрушил
  rationale: Перфектная форма передана совершенным видом прошедшего времени. «Сокрушил» сохраняет сильный поэтический образ разрушения зубов.
theological_decisions:
- issue: Временная и аспектуальная сила перфектных форм הִכִּיתָ и שִׁבַּרְתָּ
  choice: 'Совершённое действие в прошлом: «Ты поразил… и сокрушил»'
  alternative: 'Настоящее или уверенно предвосхищаемое действие: «Ты поражаешь… и сокрушаешь»'
  rationale: Еврейский перфект непосредственно допускает понимание действия как завершённого, однако в поэтической молитве может выражать характерное действие Бога или уверенность в грядущем вмешательстве. Основной текст следует форме источника, а неоднозначность сохраняется в сноске.
- issue: Насильственная образность суда над врагами
  choice: Сохранить образы удара по щеке и сокрушения зубов
  alternative: Обобщить как победу или поражение нечестивых
  rationale: Источник намеренно использует конкретные образы унижения и лишения силы; их смягчение устранило бы существенную поэтическую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным молитвенным звучанием. Синтаксис остаётся ясным и естественным; конкретная поэтическая образность оригинала не смягчается.
