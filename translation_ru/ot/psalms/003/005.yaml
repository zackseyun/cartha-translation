  text: Я лёг и спал; я пробудился, потому что Яхве поддерживает меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служит мне опорой»; еврейский глагол также может означать «поддерживать», «быть опорой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכַבְתִּי
  choice: я лёг
  rationale: Глагол שׁכב здесь обозначает, что говорящий лёг; краткая форма естественно передаёт последовательность действий.
- source_word: וָאִישָׁנָה
  choice: и уснул
  rationale: Форма от ישׁן означает «спать»; в данном сочетании русское «уснул» естественно выражает переход от того, что псалмопевец лёг, ко сну.
- source_word: הֱקִיצוֹתִי
  choice: я пробудился
  rationale: Форма от קיץ употреблена непереходно и означает, что сам говорящий проснулся; «пробудился» сохраняет поэтическое достоинство без архаизма.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину благополучного пробуждения и ясно передаётся современным причинным оборотом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет употреблённое в еврейском тексте имя, а не заменяет его титулом.
- source_word: יִסְמְכֵנִי
  choice: поддерживает меня
  rationale: Глагол סמך имеет значения «поддерживать, укреплять, служить опорой»; настоящее время по-русски передаёт продолжающуюся Божью поддержку, подразумеваемую несовершенным видом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Временной оттенок יִסְמְכֵנִי
  choice: поддерживает меня
  alternative: поддержал меня
  rationale: Еврейская форма допускает контекстуальные оттенки, однако здесь естественнее указание на продолжающуюся опору Яхве, благодаря которой говорящий спокойно спит и пробуждается.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим ритмом. Сохранены три последовательных действия и причинная связь; имя Яхве передано прямо.
