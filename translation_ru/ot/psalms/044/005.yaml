  text: Through you we push back our foes[b][a]; through your name we trample those who rise against us.
translation:
  language: ru
  text: С Тобою мы оттесним наших врагов[a]; именем Твоим растопчем тех, кто восстаёт против нас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «забодаем наших врагов». Еврейский глагол обозначает бодание рогами и здесь образно передаёт мощный натиск, отбрасывающий противника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во имя Твоё». В библейском употреблении имя Бога указывает на Его явленную личность, власть и силу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: С Тобою
  rationale: Предлог בְּ с личным местоименным суффиксом выражает средство или действенную опору. «С Тобою» естественно по-русски передаёт участие Бога и зависимость от Него, не превращая выражение в пространственное.
- source_word: צָרֵינוּ
  choice: наших врагов
  rationale: Слово обозначает враждебных противников; «враги» — ясный, точный и уместный для поэзии русский эквивалент.
- source_word: נְנַגֵּחַ
  choice: мы оттесним
  rationale: Глагол буквально описывает бодание рогами, а здесь метафорически — мощный натиск, которым противника отбрасывают назад. «Оттесним» сохраняет военную динамику без неестественного буквального образа в основном тексте.
- source_word: בְּשִׁמְךָ
  choice: Твоим именем
  rationale: Форма с בְּ может обозначать средство или основание действия. «Твоим именем» сохраняет краткость и параллелизм; имя подразумевает явленную личность, власть и силу Бога.
- source_word: נָבוּס
  choice: попираем
  rationale: Глагол означает топтать, попирать. «Попираем» передаёт яркий воинский образ и соответствует возвышенному поэтическому регистру.
- source_word: קָמֵינוּ
  choice: восстающих против нас
  rationale: Причастие от קום буквально обозначает тех, кто встаёт или восстаёт против говорящих; русский оборот сохраняет его глагольный оттенок.
theological_decisions:
- issue: Соотношение Божьего действия и участия народа в победе
  choice: Бог представлен как решающий источник и опора победы, тогда как народ действительно действует в сражении.
  alternative: Либо выдвинуть на первый план самостоятельную военную силу народа, либо понять имя Бога как магическую словесную формулу.
  rationale: Параллельные обороты «С Тобою» и «Твоим именем» относят победу к Богу, а глаголы первого лица множественного числа сохраняют реальное участие народа; напряжение между Божьим содействием и человеческим действием не устраняется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмопевческим звучанием. Заглавные местоимения в обращении к Богу соответствуют принятой русской библейской традиции. Видо-временная асимметрия еврейских форм передана естественной для русского поэтического контекста связью будущего «оттесним» и настоящего «попираем», не исключающего уверенного или повторяющегося действия.
