lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Ты сделал нас
  rationale: Форма глагола שׂים передаёт совершившееся действие с сохраняющимся результатом; обращение во втором лице единственного числа направлено к Богу.
- source_word: חֶרְפָּה
  choice: предметом поношения
  rationale: Существительное обозначает поношение, бесчестье или позор, которому человека подвергают другие. Такая передача сохраняет общественный и relational sense слова и естественно звучит по-русски.
- source_word: לִשְׁכֵנֵינוּ
  choice: для наших соседей
  rationale: Предлог ל указывает, в чьих глазах народ стал предметом поношения; «для наших соседей» ясно и естественно передаёт это отношение.
- source_word: לַעַג
  choice: насмешек
  rationale: לַעַג обозначает насмешку и издевательский смех. Множественное число естественно в русском обороте «предмет насмешек».
- source_word: קֶלֶס
  choice: издевательств
  rationale: קֶלֶס выражает презрительное осмеяние или глумление. «Издевательства» отличают его от לַעַג и сохраняют усиление в паре существительных.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: для тех, кто вокруг нас
  rationale: Выражение буквально указывает на находящихся вокруг и в контексте подразумевает окружающие народы; широкая формулировка сохраняет эту референциальную открытость.
