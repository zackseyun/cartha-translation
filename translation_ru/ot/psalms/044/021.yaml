  text: הֲ/לֹ֣א אֱ֭לֹהִים יַֽחֲקָר זֹ֑את כִּֽי ה֥וּא יֹ֝דֵ֗עַ תַּעֲלֻמ֥וֹת לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/021.yaml
  text: Would not God search this out? For he knows the hidden things of the heart[a].
translation:
  language: ru
  text: Разве Бог не исследовал бы этого? Ведь Он знает тайны сердца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровенное сердца».'
    reason: Лексическая альтернатива для תַּעֲלֻמוֹת; «сокровенное» подчёркивает значение скрытого.
lexical_decisions:
- source_word: הֲלֹא
  choice: Разве … не
  rationale: Риторический вопрос предполагает утвердительный ответ; эта русская конструкция сохраняет и вопросительную форму, и ожидаемое «да».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Грамматически множественная форма здесь служит обозначением единого Бога Израиля.
- source_word: יַחֲקָר
  choice: обнаружил бы
  rationale: Глагол חקר означает тщательно исследовать, разыскивать и в результате выявлять. В данном контексте «обнаружил бы» естественно передаёт мысль о том, что скрытое от Бога не утаить; оттенок тщательного исследования отмечен в сноске.
- source_word: זֹאת
  choice: это
  rationale: Указательное местоимение кратко отсылает к обсуждаемому ранее поступку или обстоятельству, не уточняя его сверх исходного текста.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание риторического вопроса; «ведь» естественно и ясно выражает эту пояснительно-причинную связь.
- source_word: יֹדֵעַ
  choice: знает
  rationale: Причастная форма выражает постоянное, присущее Богу знание; русское настоящее время передаёт это естественно.
- source_word: תַּעֲלֻמוֹת
  choice: тайны
  rationale: Существительное обозначает скрытое, сокровенное. «Тайны сердца» — естественное и ёмкое русское сочетание; более буквальная формулировка приведена в сноске.
- source_word: לֵב
  choice: сердца
  rationale: «Сердце» сохраняет библейский образ внутреннего человека, охватывающий мысли, намерения, волю и чувства.
theological_decisions:
- issue: Антропологическое значение לֵב
  choice: сердца
  alternative: ума; внутреннего человека
  rationale: «Сердце» не сужает значение до одного мышления или чувства и сохраняет широту древнееврейского представления о внутренней жизни человека.
- issue: Божественное знание и образ исследования в יַחֲקָר
  choice: обнаружил бы
  alternative: исследовал бы; разыскал бы
  rationale: Контекст утверждает, что сокровенное не может остаться неизвестным Богу. Перевод сохраняет риторический вопрос, не превращая его в отвлечённое доктринальное утверждение; сноска удерживает буквальный образ исследования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимение «Он» написано с прописной буквы по принятой русской религиозно-издательской традиции; синтаксис остаётся ясным для обычного читателя.
