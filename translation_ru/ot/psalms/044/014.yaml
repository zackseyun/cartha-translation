lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Ты сделал нас
  rationale: Форма 2-го лица единственного числа обращена к Богу; глагол שׂים здесь обозначает приведение в унизительное положение. Совершенный вид естественно передаёт достигнутый результат в контексте плача.
- source_word: מָשָׁל
  choice: притчей
  rationale: מָשָׁל может означать притчу, пословицу или нарицательный пример. «Притчей» сохраняет традиционный образ, а насмешливый оттенок пояснён в сноске и выражен параллельной строкой.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם обозначает здесь чужие народы вообще; перевод не вносит более позднего специального смысла слова «язычники».
- source_word: מְנוֹד רֹאשׁ
  choice: качают головой, глядя на нас
  rationale: Буквально сочетание означает «качание головы» — жест насмешки или презрения. Глагольная конструкция звучит по-русски естественно, сохраняя конкретный образ и направленность жеста на Израиль.
- source_word: בַּל אֻמִּים
  choice: племена
  rationale: Редкая форма соответствует по смыслу предлогу «среди/у» с אֻמִּים, «племена, народы». «Племена» сохраняет поэтический параллелизм без дословного повтора «народы».
