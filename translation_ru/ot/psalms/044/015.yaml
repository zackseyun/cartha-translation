lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Весь день
  rationale: 'Естественно передаёт продолжительность: на протяжении всего дня.'
- source_word: כְּלִמָּתִי
  choice: мой позор
  rationale: Слово обозначает бесчестье и публичное унижение; «позор» сохраняет социальный оттенок и не повторяет следующее «стыд».
- source_word: נֶגְדִּי
  choice: передо мной
  rationale: Буквально и естественно передаёт то, что постоянно находится перед глазами говорящего.
- source_word: וּבֹשֶׁת פָּנַי
  choice: и стыд покрывает моё лицо
  rationale: Русская формулировка естественно передаёт образ стыда, видимого на лице, при сохранении глагольной метафоры «покрывать»; более буквальная конструкция отмечена в сноске.
- source_word: כִּסָּתְנִי
  choice: покрывает
  rationale: Глагол כסה означает «покрывать». Настоящее время по-русски хорошо выражает продолжающееся состояние в данном поэтическом контексте.
