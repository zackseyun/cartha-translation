lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: Богом
  rationale: Предлог בְּ при אֱלֹהִים указывает здесь на основание и предмет торжества; русский творительный в выражении «хвалиться Богом» естественно передаёт эту связь.
- source_word: הִלַּלְנוּ
  choice: мы хвалимся
  rationale: Порода piel глагола הלל в сочетании с בְּ может означать не только «хвалить», но и «хвалиться, торжествовать»; в данном контексте «хвалимся» сохраняет эту смысловую напряжённость.
- source_word: כָל־הַיּוֹם
  choice: весь день
  rationale: Конкретно передаёт продолжительность действия и естественно звучит по-русски.
- source_word: וְשִׁמְךָ
  choice: и имя Твоё
  rationale: Сохраняет прямой объект еврейского глагола и библейский образ имени как явленного характера и славы Бога.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Достоинственно и лаконично передаёт неограниченную длительность, оставаясь понятным в современном литературном русском.
- source_word: נוֹדֶה
  choice: будем прославлять
  rationale: Hiphil глагола ידה охватывает благодарное признание и хвалу. «Прославлять» естественно сочетается с «имя Твоё», не сводя значение только к словесной благодарности; имперфект передан как продолжающееся обещание на будущее.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение литургического термина неизвестно, поэтому он передан традиционной транслитерацией.
theological_decisions:
- issue: Смысл хвалы Богом
  choice: «Богом мы хвалимся» — Бог представлен как основание и предмет торжества.
  alternative: «В Боге мы хвалим» или «Бога мы хвалим».
  rationale: Сочетание בֵּאלֹהִים с piel הלל допускает оттенки хвалы и торжествующего хвастовства; выбранный вариант сохраняет идиому, не приписывая человеку независимой заслуги.
- issue: Значение Божьего имени
  choice: Сохранено буквальное «имя Твоё».
  alternative: Развернуть как «Тебя, явившего Себя нам».
  rationale: Библейская формулировка намеренно оставлена без догматического развёртывания; пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. «Вовеки» и «Села» сохраняют достоинство и литургическую окраску; синтаксис остаётся ясным для обычного читателя.
