  text: Богом мы хвалимся весь день[a], и имени Твоему будем вовеки воздавать благодарность[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бога мы восхваляем весь день» или «Богом мы торжествуем весь день». Еврейский глагол может означать как хвалу, так и радостное хвастовство — в зависимости от контекста.'
