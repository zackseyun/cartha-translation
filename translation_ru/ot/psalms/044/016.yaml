translation:
  language: ru
  text: 'Из-за голоса того, кто поносит и хулит[a],

    из-за врага и мстителя[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злословит».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от лица врага и мстителя»; это выражение здесь означает «из-за» или «по причине».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל
  choice: из-за голоса
  rationale: Предлог מִן в данном контексте выражает причину, а «голос» сохраняет конкретный образ еврейского текста.
- source_word: מְחָרֵף
  choice: поносящего
  rationale: Причастная форма передаёт человека, который осыпает презрением и оскорблениями; «поносящего» сохраняет и форму, и смысл.
- source_word: וּמְגַדֵּף
  choice: и хулящего
  rationale: «Хулить» может обозначать как оскорбительную речь, так и нечестивую хулу, поэтому сохраняет смысловой диапазон גדף, не ограничивая его только прямым богохульством.
- source_word: מִפְּנֵי
  choice: из-за
  rationale: Буквально выражение связано с «лицом» или «присутствием», но здесь идиоматически обозначает причину и параллельно מִקּוֹל.
- source_word: אֹיֵב
  choice: врага
  rationale: Сохраняется определённый по контексту единственный образ противника.
- source_word: וּמִתְנַקֵּם
  choice: и мстителя
  rationale: 'Кратко и точно передаёт причастие породы хитпаэль: того, кто мстит или стремится отомстить.'
theological_decisions:
- issue: 'Смысл враждебной речи: оскорбление людей или нечестивая хула'
  choice: хулящего
  alternative: злословящего; богохульствующего
  rationale: Русское «хулящий» сохраняет присущую גדף возможность как общей оскорбительной речи, так и религиозно окрашенной хулы, не разрешая неоднозначность в пользу только одного объекта.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и причастных образов оригинала. Повтор «из-за» ясно передаёт причинное значение обеих еврейских конструкций.
