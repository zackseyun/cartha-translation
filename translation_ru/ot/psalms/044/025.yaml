lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для последующей мольбы; «ибо» естественно передаёт причинный смысл и соответствует возвышенному поэтическому регистру.
- source_word: שָׁחָה
  choice: повержена
  rationale: Глагол описывает крайнюю приниженность — склонённость или опущенность до праха. «Повержена» сохраняет образ полного унижения, не сводя его лишь к позе тела.
- source_word: לֶעָפָר
  choice: в прах
  rationale: Существительное означает «прах, пыль»; сочетание «повержена в прах» естественно по-русски и сохраняет образы унижения и смертности.
- source_word: נַפְשֵׁנוּ
  choice: душа наша
  rationale: נֶפֶשׁ может обозначать душу, жизнь или самого человека. Буквальное поэтическое выражение сохраняет смысловую широту исходного текста.
- source_word: דָּבְקָה
  choice: прильнуло
  rationale: Глагол означает тесно прилепиться или прижаться. «Прильнуло» передаёт длительный тесный контакт и звучит естественно в поэзии.
- source_word: לָאָרֶץ
  choice: к земле
  rationale: אֶרֶץ здесь обозначает землю или почву; «к земле» точно передаёт направление и хорошо образует параллель к «в прах».
- source_word: בִּטְנֵנוּ
  choice: чрево наше
  rationale: בֶּטֶן буквально означает живот, чрево или внутренность тела. «Чрево» сохраняет конкретный образ распростёртого тела и достоинство поэтического регистра, тогда как «тело» чрезмерно сгладило бы метафору.
theological_decisions:
- issue: Антропологический смысл נַפְשֵׁנוּ
  choice: душа наша
  alternative: жизнь наша; мы сами
  rationale: Еврейское слово охватывает душу, жизнь и самого живого человека. Перевод «душа наша» сохраняет поэтическую и богословскую многозначность, не ограничивая речь исключительно нематериальной частью человека.
translation_notes:
