  text: אַף זָ֭נַחְתָּ וַ/תַּכְלִימֵ֑/נוּ וְ/לֹא תֵ֝צֵ֗א בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/009.yaml
  text: Yet you have rejected us and put us to shame[a], and you do not go out with our armies.
translation:
  language: ru
  text: Но Ты отверг нас и посрамил нас, и не выходишь с нашими войсками.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «не выходишь в наших войсках».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Но
  rationale: Частица вводит резкий поворот от воспоминания о прежней Божьей помощи к нынешней жалобе; русское «но» естественно передаёт это противопоставление.
- source_word: זָנַחְתָּ
  choice: Ты отверг нас
  rationale: Глагол означает отвержение, оставление; «отверг» ясно и непосредственно передаёт его смысл.
- source_word: וַתַּכְלִימֵנוּ
  choice: и покрыл нас позором
  rationale: Порода хифиль от כלם выражает причинение стыда или бесчестия; оборот сохраняет каузативный смысл и подходит возвышенному языку плача.
- source_word: וְלֹא תֵצֵא
  choice: и не выходишь
  rationale: Сохраняется базовое значение יצא и последовательное присоединение новой жалобы союзом ו; настоящее время по-русски естественно описывает нынешнее переживание общины.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: с нашими войсками
  rationale: צָבָא здесь обозначает военные силы, а ב допускает сопроводительное понимание «с»; такой перевод естественен в русском и передаёт отсутствие Божьего участия в походе.
theological_decisions:
- issue: Изображение Божьего отстранения в битве
  choice: Стих передан как жалоба общины на то, что Бог отверг её и больше не выступает вместе с её войсками.
  alternative: 'Более буквально: «не выходишь среди наших войск» или «не выходишь в наших войсках».'
  rationale: Перевод сохраняет напряжённость плача и переживание Божьего отсутствия, не превращая слова псалмопевца в более широкое догматическое утверждение и не уточняя причины отвержения.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Местоимение «Ты» написано с прописной буквы согласно распространённой русской библейской традиции; синтаксис остаётся ясным для современного читателя.
