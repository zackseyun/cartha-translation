  text: אֱלֹהִ֤ים בְּ/אָזְנֵ֬י/נוּ שָׁמַ֗עְנוּ אֲבוֹתֵ֥י/נוּ סִפְּרוּ לָ֑/נוּ פֹּ֥עַל פָּעַ֥לְתָּ בִֽ֝/ימֵי/הֶ֗ם בִּ֣/ימֵי קֶֽדֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/001.yaml
  text: God[a], we have heard with our ears; our fathers have told us the deed you did in their days[c][b], in days of old.
translation:
  language: ru
  text: Боже, мы услышали своими ушами; наши отцы рассказали нам о деянии, которое Ты совершил в их дни, в давние дни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Слово стоит в прямом обращении; русский звательный оттенок естественно передаётся формой «Боже» без добавления междометия.
- source_word: בְּאָזְנֵינוּ
  choice: своими ушами
  rationale: Сохраняет телесно-конкретный образ еврейского выражения и естественно звучит по-русски.
- source_word: שָׁמַעְנוּ
  choice: мы слышали
  rationale: Прошедшее время естественно передаёт получение свидетельства от отцов; его сохраняющаяся значимость ясна из контекста.
- source_word: אֲבוֹתֵינוּ
  choice: наши отцы
  rationale: Точно сохраняет мужской род и семейно-поколенческий характер еврейского слова; «предки» было бы более широким вариантом.
- source_word: סִפְּרוּ לָנוּ
  choice: рассказывали нам
  rationale: Глагол обозначает повествовательную передачу памяти о прошлом; несовершенный вид по-русски уместно представляет устное предание.
- source_word: פֹּעַל פָּעַלְתָּ
  choice: о деле, которое Ты совершил
  rationale: Передаёт однокоренную конструкцию существительного и глагола естественным литературным русским, не превращая её в неуклюжее «дело, которое Ты сделал».
- source_word: בִּימֵיהֶם
  choice: в их дни
  rationale: Прямо сохраняет временную отсылку к поколению отцов.
- source_word: בִּימֵי קֶדֶם
  choice: во дни древние
  rationale: Передаёт отдалённую древность и поэтический регистр оригинала; форма понятна современному читателю, хотя несколько возвышенна.
theological_decisions:
- issue: Передача начального прямого обращения к Богу
  choice: Боже, мы слышали своими ушами
  alternative: О Боже, мы слышали своими ушами
  rationale: В еврейском тексте нет отдельной частицы, соответствующей русскому «о»; форма «Боже» ясно и естественно выражает обращение.
- issue: Референт выражения «в их дни»
  choice: Сохранить местоименное «в их дни»
  alternative: 'Уточнить: «при жизни наших отцов»'
  rationale: Оригинал оставляет референт местоимения формально выраженным через предшествующее «наши отцы»; перевод не добавляет отсутствующего пояснения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Синтаксический параллелизм и повтор временных оборотов сохранены; архаизирующие формы ограничены понятным выражением «во дни древние».
