lexical_decisions:
- source_word: קוּמָה
  choice: Восстань
  rationale: Повелительная форма глагола קום выражает настоятельный призыв к Богу подняться и действовать; «восстань» сохраняет образность и соответствует возвышенному, но понятному языку псалма.
- source_word: עֶזְרָתָה לָנוּ
  choice: нам на помощь
  rationale: Существительное עֶזְרָה означает «помощь», а לָנוּ указывает, кому она предназначена. Русское «восстань нам на помощь» естественно передаёт смысл, сохраняя существительное «помощь».
- source_word: וּפְדֵנוּ
  choice: и искупи нас
  rationale: Императив פדה с объектным суффиксом означает освобождение или избавление, иногда посредством выкупа. «Искупи нас» сохраняет широту и богословскую глубину слова, не уточняя способ избавления.
- source_word: לְמַעַן
  choice: ради
  rationale: Предлог указывает на основание или побуждение к действию. «Ради» кратко и естественно передаёт обращение к Божьей верной любви как основанию просьбы.
- source_word: חַסְדֶּךָ
  choice: Твоей верной любви
  rationale: חסד сочетает значения любви, преданности, милости и постоянства в отношениях. «Верная любовь» сохраняет как сердечную, так и заветно-лояльную сторону понятия без чрезмерного догматического уточнения.
theological_decisions:
- issue: Следует ли передать פדה узкоспециальным богословским термином
  choice: искупи нас
  alternative: избавь нас; выкупи нас
  rationale: «Искупи» передаёт мотив освобождения, присущий корню, но само по себе не навязывает стиху позднейшую разработанную доктрину; сноска сохраняет возможность значений «выкупи» и «избавь».
- issue: Как сохранить смысловую многогранность חסד
  choice: Твоей верной любви
  alternative: Твоей милости; Твоей неизменной любви; Твоей заветной любви
  rationale: Выбранное выражение удерживает напряжение между любовью, милостью и верностью, не сводя חסד только к состраданию и не добавляя прямо отсутствующее в строке слово «завет».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. «Восстань» и прописные местоимения в обращении к Богу соответствуют принятому русскому библейскому регистру; синтаксис остаётся ясным для современного читателя.
