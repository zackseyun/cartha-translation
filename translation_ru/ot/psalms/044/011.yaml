base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/011.yaml
  text: You give us over like sheep for food[b][a], and among the nations you have scattered us.
translation:
  language: ru
  text: Ты отдаёшь нас, словно овец на съедение,[a] и рассеял нас среди народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты предаёшь нас, словно овец на съедение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנֵנוּ
  choice: Ты отдаёшь нас
  rationale: Форма от נתן буквально связана с передачей или отданием; в контексте плача «отдаёшь» естественно передаёт смысл предания во власть врагов, не добавляя отсутствующего в тексте уточнения.
- source_word: כְּצֹאן
  choice: словно овец
  rationale: Предлог כ выражает сравнение; «словно овец» сохраняет образ и звучит естественно в современном литературном русском.
- source_word: מַאֲכָל
  choice: на съедение
  rationale: Существительное обозначает пищу или то, что предназначено для еды. «На съедение» ясно передаёт участь овец, не усиливая текст до более конкретного «на заклание».
- source_word: וּבַגּוֹיִם
  choice: среди народов
  rationale: גוים здесь означает другие, чужеземные народы. «Среди народов» сохраняет обычное ветхозаветное значение без новозаветного оттенка слова «язычники».
- source_word: זֵרִיתָנוּ
  choice: рассеиваешь нас
  rationale: זרה означает разбрасывать, рассеивать, а буквально также веять. В контексте пребывания среди народов «рассеиваешь» наиболее ясно выражает смысл; русское настоящее время согласуется с параллельным תִּתְּנֵנוּ и может описывать переживаемое действие.
theological_decisions:
- issue: Образ народа как овец, предназначенных в пищу
  choice: Сохранён резкий образ «словно овец на съедение» без смягчения.
  alternative: «словно овец на заклание»; «словно овец, которых пожирают»
  rationale: מַאֲכָל говорит о пище или съедении, но прямо не называет заклание и не уточняет действующего пожирателя. Перевод сохраняет суровость плача, не конкретизируя метафору сверх еврейского текста.
- issue: Временная соотнесённость זֵרִיתָנוּ с первой строкой
  choice: «рассеиваешь нас»
  alternative: «рассеял нас»
  rationale: Масоретская форма первой строки допускает настоящее значение, тогда как זֵרִיתָנוּ имеет перфектную форму. В поэтическом параллелизме русское настоящее сохраняет цельность жалобы; возможность понимания как уже совершившегося рассеяния отмечена в сноске.
translation_notes:
  register: Современный литературный русский с молитвенно-поэтической сдержанностью. Единственное число «Ты» сохраняет прямое обращение к Богу. «На съедение» понятно обычному читателю и точнее исходного образа, чем традиционное, но более конкретное «на заклание».
