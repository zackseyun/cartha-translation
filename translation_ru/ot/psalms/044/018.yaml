  text: לֹא נָס֣וֹג אָח֣וֹר לִבֵּ֑/נוּ וַ/תֵּ֥ט אֲשֻׁרֵ֗י/נוּ מִנִּ֥י אָרְחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/018.yaml
  text: Our heart has not turned back[a], nor have our steps turned aside from your path.
translation:
  language: ru
  text: Сердце наше не обратилось вспять, и стопы наши не уклонились от Твоего пути.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сердце наше не отступило назад, и шаги наши не свернули с Твоей дороги».'
    reason: Лексические варианты для נָסוֹג אָחוֹר, אֲשֻׁרֵינוּ и אָרְחֶךָ сохраняют оттенки движения назад, шагов и дороги.
lexical_decisions:
- source_word: נָסוֹג אָחוֹר
  choice: не отступило назад
  rationale: Сочетание глагола סוג с наречием אָחוֹר передаёт отступление или движение вспять. Формулировка сохраняет образ и усиление оригинала, не сводя его исключительно к военному отступлению.
- source_word: לִבֵּנוּ
  choice: сердце наше
  rationale: «Сердце» обозначает внутреннего человека, включая волю и верность. Сохранено коллективное единственное число еврейского текста и библейская антропологическая образность.
- source_word: וַתֵּט
  choice: не уклонились
  rationale: В контексте пути נטה означает отклониться, свернуть в сторону. Русское «уклонились» естественно передаёт нравственно-религиозную метафору пути.
- source_word: אֲשֻׁרֵינוּ
  choice: стопы наши
  rationale: Существительное обозначает шаги, поступь. «Стопы» сохраняют конкретный поэтический образ движения по пути; согласование во множественном числе естественно для русского языка.
- source_word: מִנִּי אָרְחֶךָ
  choice: от Твоего пути
  rationale: Предлог указывает на удаление от пути, а אֹרַח — на путь или образ жизни. Перевод сохраняет как пространственный образ, так и его этический смысл.
theological_decisions:
- issue: Антропологическая метафора сердца
  choice: Сохранить буквальное «сердце наше».
  alternative: «Наша верность не поколебалась» или «наши мысли не обратились назад».
  rationale: Оригинал говорит о сердце как о средоточии внутренней жизни, воли и верности. Более толковательный вариант неоправданно сузил бы смысл.
- issue: Метафора пути
  choice: Сохранить «Твой путь».
  alternative: «Предписанный Тобой образ жизни».
  rationale: Буквальный образ пути одновременно допускает этическое и заветное прочтение, не закрепляя в переводе только одно из них.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «сердце наше» и формы «стопы», «Твоего» поддерживают псалмический ритм, оставаясь понятными современному читателю.
