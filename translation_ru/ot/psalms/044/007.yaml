lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: В данном поэтическом контексте союз вводит основание для предшествующего упования и хвалы; «ведь» естественно передаёт пояснительно-причинный оттенок.
- source_word: הוֹשַׁעְתָּנוּ
  choice: Ты спас нас
  rationale: Порода хифиль глагола יָשַׁע обозначает спасение или избавление; совершенный вид передаёт действие как совершившееся.
- source_word: מִצָּרֵינוּ
  choice: от наших врагов
  rationale: צַר обозначает противника или врага, причиняющего бедствие; «врагов» ясно и естественно звучит в современном русском поэтическом тексте.
- source_word: וּמְשַׂנְאֵינוּ
  choice: и ненавидящих нас
  rationale: Причастная форма буквально обозначает тех, кто ненавидит нас; субстантивированное причастие сохраняет эту форму и личную враждебность.
- source_word: הֱבִישׁוֹתָ
  choice: посрамил
  rationale: Хифиль выражает причинение стыда или позора; «посрамил» кратко сохраняет каузативный смысл и соответствует возвышенному регистру псалма.
