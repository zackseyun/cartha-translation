lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов слово обозначает лицо, руководящее музыкальным исполнением. Дательный падеж естественно передаёт возможное значение посвящения или указания адресата, не сужая его до современного названия должности.
- source_word: לִבְנֵי קֹרַח
  choice: Сынов Корея
  rationale: Предлог לְ в заголовках может обозначать авторство, принадлежность, предназначение или иную связь. Краткая родительная конструкция по-русски сохраняет эту неопределённость; имя קֹרַח передано в принятой русской библейской форме «Корей».
- source_word: מַשְׂכִּיל
  choice: Маскил
  rationale: Точное значение термина в заголовках псалмов неизвестно; вероятно, это жанровое, литературное или музыкальное обозначение. Транслитерация не навязывает спорного истолкования.
