base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/023.yaml
  text: Awake! Why do you sleep[a], Lord? Rouse yourself; do not reject us forever.
translation:
  language: ru
  text: Пробудись! Почему Ты спишь, Господи? Очнись; не отвергай нас навеки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отбрасывай нас навсегда».'
    reason: Лексически возможная передача זנח и לָנֶצַח, более наглядно выражающая образ окончательного отвержения.
lexical_decisions:
- source_word: עוּרָה
  choice: Пробудись!
  rationale: Повелительная форма от עור передаёт прямой и дерзновенный призыв к Богу пробудиться; слово естественно для современного литературного русского языка и сохраняет образ сна.
- source_word: לָמָּה
  choice: Почему
  rationale: Обычное вопросительное наречие, вводящее жалобу псалмопевца.
- source_word: תִישַׁן
  choice: Ты спишь
  rationale: Форма от ישׁן употреблена в риторическом вопросе; настоящее время естественно передаёт в русском языке образ предполагаемого бездействия Бога.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Божественный титул в прямом обращении; традиционное и понятное русское соответствие, уместное в возвышенной молитвенной речи.
- source_word: הָקִיצָה
  choice: Очнись
  rationale: Повелительная форма другого глагола пробуждения, קיץ/יקץ. Отличный от первого глагола перевод сохраняет поэтический параллелизм без тяжеловесного повтора.
- source_word: אַל תִּזְנַח
  choice: не отвергай нас
  rationale: זנח означает отвергать, отбрасывать, отринуть. «Не отвергай нас» ясно и естественно передаёт просьбу без архаизации.
- source_word: לָנֶצַח
  choice: навеки
  rationale: Наречное выражение обозначает неограниченную длительность; «навеки» кратко и органично для поэтической молитвы.
theological_decisions:
- issue: Антропоморфный образ спящего и пробуждающегося Бога
  choice: Сохранить прямые образы сна и пробуждения
  alternative: 'Передать смысл толкованием, например: «Почему Ты бездействуешь?»'
  rationale: Еврейский текст дерзновенно обращается к Богу посредством образа сна. Перевод сохраняет напряжение плача и не превращает поэтическую жалобу в отвлечённое толкование.
- issue: Смысл глагола זנח
  choice: «не отвергай нас»
  alternative: «не отбрасывай нас» или «не оставляй нас»
  rationale: Основное значение связано с отвержением или отбрасыванием. Выбранный вариант сохраняет силу просьбы, не подменяя её более общим понятием оставления.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-поэтической речи. Прямота жалобы сохранена; архаизмы вроде «воспрянь» и «отринь» не использованы. Местоимение «Ты» написано с прописной буквы как знак почтительного прямого обращения к Богу.
