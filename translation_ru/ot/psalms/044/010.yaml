lexical_decisions:
- source_word: תְּשִׁיבֵנוּ אָחוֹר
  choice: Ты обращаешь нас в бегство
  rationale: Каузативная форма שוב с наречным אָחוֹר в военном контексте описывает вынужденное отступление; по-русски «обращаешь нас в бегство» естественно и сохраняет прямое указание на действие Бога.
- source_word: מִנִּי צָר
  choice: перед врагом
  rationale: Предлог מן здесь допускает понимание как удаления от противника, так и отступления перед ним. Основной текст передаёт естественную для военного контекста формулировку, а вариант «от врага» отмечен в сноске.
- source_word: מְשַׂנְאֵינוּ
  choice: ненавидящие нас
  rationale: Причастная форма передана глагольно, чтобы сохранить активный смысл ненависти и не свести отличное еврейское выражение к повтору слова «враг».
- source_word: שָׁסוּ
  choice: грабят
  rationale: Глагол означает захватывать добычу, грабить. Настоящее время по-русски живо передаёт разворачивающееся бедствие в плаче.
- source_word: לָמוֹ
  choice: себе
  rationale: Дательная форма указывает на присвоение добычи ненавистниками в собственную пользу; краткое «себе» естественно передаёт этот смысл.
theological_decisions:
- issue: Божественная причинность поражения
  choice: Сохранено прямое «Ты обращаешь нас в бегство»
  alternative: «Мы отступаем» или безличная конструкция
  rationale: Еврейский текст прямо приписывает Богу действие, поэтому напряжение жалобы не смягчается.
translation_notes:
  register: Современный литературный русский с поэтической сжатостью псалма. Сохранено обращение к Богу на «Ты» и параллельное построение двух частей стиха.
