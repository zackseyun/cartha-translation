  text: תִּמְכֹּֽר עַמְּ/ךָ֥ בְ/לֹא ה֑וֹן וְ/לֹ֥א רִ֝בִּ֗יתָ בִּ/מְחִירֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/012.yaml
  text: You sell your people for no gain[a], and you have not increased by their price.
translation:
  language: ru
  text: Ты продаёшь Свой народ без всякой выгоды и не выручаешь многого за него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты продал Свой народ ни за что и не выручил многого за него».'
    reason: Имперфект может пониматься в прошедшем времени; «ни за что» передаёт возможное более категоричное осмысление выражения «без богатства/выгоды».
lexical_decisions:
- source_word: תִּמְכֹּר
  choice: Ты продаёшь
  rationale: Имперфект qal, 2-е лицо мужского рода единственного числа, обращённый к Богу. Настоящее время сохраняет непосредственность поэтической жалобы; по контексту возможно и прошедшее время.
- source_word: עַמְּךָ
  choice: Свой народ
  rationale: Слово עַם обозначает народ в национальном и заветном смысле; возвратное «Свой» естественно по-русски передаёт принадлежность народа Богу.
- source_word: בְלֹא הוֹן
  choice: за бесценок
  rationale: Буквально выражение говорит об отсутствии богатства или ценного возмещения. «За бесценок» естественно передаёт продажу без сколько-нибудь значительной выгоды, не сводя смысл обязательно к нулевой цене.
- source_word: רִבִּיתָ
  choice: не приобретаешь богатства
  rationale: Форма piel от רבה выражает увеличение или умножение; дополнение «богатства» по смыслу выводится из הוֹן в первой строке и делает русскую фразу понятной.
- source_word: בִּמְחִירֵיהֶם
  choice: от их цены
  rationale: מְחִיר означает цену или выручку от продажи, а предлог ב здесь допускает значение средства либо источника. «От их цены» сохраняет необычный образ оригинала.
theological_decisions:
- issue: Изображение Бога продающим Свой народ
  choice: Сохранить прямое обращение и образ продажи
  alternative: Смягчить до «Ты отдал Свой народ»
  rationale: Еврейский текст прямо употребляет מכר, поэтому напряжённый язык жалобы не следует ослаблять или богословски объяснять в самом переводе.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства поэтической жалобы. «За бесценок» звучит естественно и выражает ничтожность полученной цены; в примечании сохранён более категоричный вариант «ни за что». Местоимение «Свой» написано с прописной буквы по принятой русской библейской традиции обращения к Богу.
