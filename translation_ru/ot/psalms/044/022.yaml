  text: כִּֽי עָ֭לֶי/ךָ הֹרַ֣גְנוּ כָל הַ/יּ֑וֹם נֶ֝חְשַׁ֗בְנוּ כְּ/צֹ֣אן טִבְחָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/022.yaml
  text: For your sake we are killed all day long[b][a]; we are regarded as sheep for slaughter.
translation:
  language: ru
  text: Ведь ради Тебя нас убивают весь день; нас считают овцами на заклание.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нас принимают за овец, предназначенных для заклания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание предшествующей жалобы; «ведь» естественно передаёт пояснительно-причинную связь в русском поэтическом контексте.
- source_word: עָלֶיךָ
  choice: ради Тебя
  rationale: Передаёт страдание, претерпеваемое в связи с Богом и принадлежностью Ему, не утверждая однозначно, что Бог непосредственно причиняет его.
- source_word: הֹרַגְנוּ
  choice: нас убивают
  rationale: Хотя еврейская форма морфологически является перфектом, в плаче она описывает продолжающееся или повторяющееся положение; русское настоящее время хорошо сочетается с «весь день».
- source_word: כָל הַיּוֹם
  choice: весь день
  rationale: Естественное современное русское выражение продолжительности; в данном контексте имеет смысл непрестанности.
- source_word: נֶחְשַׁבְנוּ
  choice: нас считают
  rationale: Сохраняет пассивно-оценочное значение глагола и естественно звучит по-русски.
- source_word: כְּצֹאן
  choice: овцами
  rationale: Творительный предикативный после «считают» естественно передаёт сравнение с כְּ без громоздкого буквального оборота.
- source_word: טִבְחָה
  choice: обречёнными на заклание
  rationale: «Заклание» сохраняет торжественно-поэтический регистр и значение насильственного убоя; добавление «обречёнными» ясно передаёт назначение овец на убой.
theological_decisions:
- issue: Указывает ли стих на страдание, непосредственно причинённое Богом, или на страдание из-за верности Ему
  choice: «ради Тебя» — страдание в связи с принадлежностью Богу и верностью Ему без прямого указания Бога как причинителя убийства
  alternative: «из-за Тебя» / «по причине Тебя»
  rationale: Еврейское עָלֶיךָ допускает причинно-относительные оттенки. Основной вариант сохраняет напряжение текста, но не вносит обвинительный смысл, которого грамматика не требует.
translation_notes:
  register: Современный литературный русский с достоинством поэтического плача. Местоимение «Тебя» написано с прописной буквы как уместное обращение к Богу; синтаксис остаётся ясным для обычного читателя.
