lexical_decisions:
- source_word: יָדְךָ
  choice: Своей рукой
  rationale: Творительный падеж естественно передаёт инструментальное значение и сохраняет конкретный образ Божьей руки как силы и действующей власти.
- source_word: גּוֹיִם
  choice: народы
  rationale: В историческом контексте речь идёт о народах, населявших землю; слово «язычники» внесло бы более поздний религиозный оттенок.
- source_word: הוֹרַשְׁתָּ
  choice: изгнал
  rationale: Каузативная форма ירשׁ здесь означает лишение владения и удаление из земли; «изгнал» ясно и естественно выражает это в контексте завоевания.
- source_word: וַתִּטָּעֵם
  choice: а их насадил
  rationale: Сохранена метафора насаждения народа в земле. Местоимение оставлено без явного раскрытия как «предков», поскольку еврейский текст выражен сжато, а предполагаемый референт понятен из предшествующего контекста.
- source_word: תָּרַע
  choice: поразил
  rationale: Hiphil от רעע обозначает причинение вреда или бедствия. «Поразил» передаёт карающее действие, не уточняя его способ, и подходит возвышенной поэтической речи.
- source_word: לְאֻמִּים
  choice: племена
  rationale: Выбор сохраняет поэтическое варьирование рядом с גּוֹיִם («народы») и обозначает этнические сообщества без искусственного повторения.
- source_word: וַתְּשַׁלְּחֵם
  choice: и выслал их
  rationale: «Выслал» непосредственно передаёт значение שלח («посылать, отсылать») и в данном контексте подразумевает удаление из земли, не усиливая глагол до «рассеял» или «истребил».
theological_decisions:
- issue: К кому относятся местоименные суффиксы в выражениях «насадил их» и «выслал их»
  choice: Первое «их» относится к предкам Израиля, подразумеваемым из контекста; последнее «их» — к племенам и народам земли.
  alternative: Оба местоимения, в особенности последнее, могут относиться к предкам Израиля; тогда последняя фраза означает, что Бог дал им распространиться.
  rationale: Стих поэтически сжат, поэтому смена референта прямо не обозначена. Контекст говорит об изгнании народов и утверждении Израиля в земле, а параллелизм второй половины позволяет понимать последнее местоимение как указание на поражённые племена. Допустимое и богословски значимое альтернативное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм и образ насаждения сохранены; архаизмы и конфессионально окрашенная лексика не используются.
