lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующей мысли; «ибо» сохраняет пояснительную связь и соответствует возвышенному, но понятному поэтическому регистру.
- source_word: בְקַשְׁתִּי
  choice: на свой лук
  rationale: קֶשֶׁת означает «лук» как оружие, а предлог ב при глаголе בטח естественно передаётся по-русски конструкцией «полагаться на». Возвратное «свой» нормативно соотносит оружие с говорящим.
- source_word: אֶבְטָח
  choice: не … полагаюсь
  rationale: Qal глагола בטח означает «доверять, полагаться». Настоящее время передаёт вероятный обобщённо-постоянный смысл имперфекта, не исключая отмеченного в сноске будущего прочтения.
- source_word: וְחַרְבִּי
  choice: и не мой меч
  rationale: Сохранены существительное חֶרֶב, притяжательный суффикс первого лица и параллелизм между луком и мечом. Положение отрицания отражает еврейскую конструкцию и звучит естественно по-русски.
- source_word: תוֹשִׁיעֵנִי
  choice: спасает меня
  rationale: Hiphil от ישׁע допускает значения «спасать, избавлять, даровать победу». «Спасает меня» сохраняет широкий смысл корня, тогда как военный оттенок победы остаётся доступным из контекста и поясняется в сноске.
theological_decisions:
- issue: Смысл языка спасения в военном контексте
  choice: «спасает меня»
  alternative: «дарует мне победу» или «избавляет меня»
  rationale: Военный контекст допускает значение победы, однако более широкое «спасает» не сводит высказывание только к успеху в сражении и сохраняет смысловую широту ישׁע без добавления конфессионального толкования.
- issue: Временной оттенок еврейских имперфектов
  choice: 'Настоящее время: «полагаюсь», «спасает»'
  alternative: 'Будущее время: «буду полагаться», «спасёт»'
  rationale: В поэтическом контексте формы могут выражать постоянную или общую установку говорящего, поэтому настоящее время уместно; возможный будущий оттенок сохранён в сноске как подлинная грамматическая неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Полагаюсь» естественно сочетается с оружием и остаётся понятным широкому кругу читателей; синтаксическая асимметрия оригинала между упованием на лук и спасением мечом сохранена.
