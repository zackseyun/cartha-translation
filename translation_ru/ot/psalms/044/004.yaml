  text: אַתָּה ה֣וּא מַלְכִּ֣/י אֱלֹהִ֑ים צַ֝וֵּ֗ה יְשׁוּע֥וֹת יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/004.yaml
  text: You are my King[a], O God; command victories for Jacob.
translation:
  language: ru
  text: Ты — мой Царь, Боже; повели, чтобы Иакову были дарованы победы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повели, чтобы Иакову были дарованы избавления»; возможно также: «спасительные деяния».'
    reason: Еврейское יְשׁוּעוֹת (мн. ч.) может обозначать избавления, спасительные деяния и, в военном контексте псалма, победы. Глагол צַוֵּה буквально означает «повели, прикажи».
lexical_decisions:
- source_word: אַתָּה הוּא
  choice: Ты —
  rationale: Сочетание личного местоимения с הוּא придаёт высказыванию эмфазу. В русском её естественно передаёт конструкция с именным сказуемым и тире; добавление «именно Ты» было бы возможно, но утяжелило бы стих.
- source_word: מַלְכִּי
  choice: мой Царь
  rationale: Существительное с суффиксом 1-го лица единственного числа означает «мой царь». Прописная буква уместна как обозначение Бога в прямом обращении, не добавляя отдельного богословского смысла.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма понята как звательное обращение. Русское «Боже» естественно передаёт молитвенный характер строки.
- source_word: צַוֵּה
  choice: повели
  rationale: 'Императив породы пиэль от צוה прямо выражает приказ: «повели, прикажи». «Повели» соответствует возвышенному, но понятному поэтическому регистру.'
- source_word: יְשׁוּעוֹת
  choice: победам
  rationale: Множественное число обозначает спасительные действия или избавления. В военном контексте псалма «победы» ясно передают конкретный результат Божьего избавления, сохраняя множественное число.
- source_word: יַעֲקֹב
  choice: у Иакова
  rationale: Сохранено имя «Иаков» как поэтическое обозначение народа; оно не заменено толковательным «Израиль». Конструкция «быть у Иакова» передаёт адресата/обладателя побед без искусственного «для Иакова».
theological_decisions:
- issue: Значение יְשׁוּעוֹת в военном контексте
  choice: «победам»
  alternative: «избавлениям» или «спасениям»
  rationale: Окружение говорит о борьбе с врагами, поэтому спасительные деяния конкретно проявляются как победы. Сноска сохраняет более широкую семантику спасения и избавления.
- issue: Синтаксическая роль אֱלֹהִים
  choice: 'Прямое обращение: «Боже»'
  alternative: Приложение «мой Царь, Бог» или утверждение «мой Царь — Бог»
  rationale: 'Наиболее естественно синтаксис читается как молитвенное обращение: «Ты — мой Царь, Боже».'
- issue: Связь повеления с победами
  choice: «повели победам быть у Иакова»
  alternative: «даруй Иакову победы»
  rationale: Более развернутая формулировка сохраняет необычный образ исходного текста, где Бог именно повелевает победам, а не просто дарует их.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Обращение на «Ты» и форма «Боже» естественны для русского библейского регистра. Необычная конструкция «повели победам быть» намеренно удерживает образ и синтаксическое напряжение еврейского текста; сноска отмечена в основном тексте.
