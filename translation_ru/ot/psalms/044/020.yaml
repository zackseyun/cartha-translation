  yaml_path: translation/ot/psalms/044/020.yaml
  text: If we had forgotten the name of our God and spread out our hands to a foreign god—[a]
translation:
  language: ru
  text: 'Если бы мы забыли имя нашего Бога

    и простёрли руки к чужому богу…[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к иному богу». Еврейское слово может означать «чужой», «иной» или «чужеземный»; здесь речь о божестве, чуждом заветному поклонению Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если бы
  rationale: Частица вводит гипотетическое условие в контексте заверения в невиновности; русская конструкция «если бы» естественно передаёт нереальное условие.
- source_word: שָׁכַחְנוּ
  choice: мы забыли
  rationale: Перфект 1-го лица множественного числа внутри конструкции «если бы» передаёт предполагаемое предшествующее действие без необходимости добавлять временные уточнения.
- source_word: שֵׁם אֱלֹהֵינוּ
  choice: имя нашего Бога
  rationale: Сохраняется еврейское выражение, где «имя» указывает на открытое и призываемое имя Бога; притяжательная конструкция передана прямо.
- source_word: וַנִּפְרֹשׂ
  choice: и простёрли
  rationale: Глагол обозначает протягивание или разведение рук как жест молитвы и обращения. «Простёрли» точно и достойно сохраняет конкретный образ.
- source_word: כַּפֵּינוּ
  choice: руки
  rationale: Хотя существительное буквально может обозначать ладони, в русском библейском и молитвенном выражении естественно говорить «простереть руки».
- source_word: לְאֵל זָר
  choice: к чужому богу
  rationale: Предлог указывает направление обращения, а זָר обозначает божество, чуждое заветному богопочитанию Израиля. «Чужой бог» естественнее по-русски, чем «иностранный бог», и точнее по смыслу, чем просто «странный».
theological_decisions:
- issue: Жест идолопоклоннического обращения
  choice: простёрли руки к чужому богу
  alternative: поклонились чужому богу
  rationale: Перевод сохраняет конкретный молитвенный жест исходного текста и не заменяет его более общим богословским истолкованием «поклонились».
- issue: Значение определения זָר
  choice: чужому богу
  alternative: иному богу
  rationale: «Чужой» передаёт принадлежность к иному, не заветному культу, не утверждая, что речь лишь о географически иностранном божестве. В сноске сохранён возможный вариант «иному».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оборотом «простёрли руки». Многоточие перед сноской сохраняет незавершённость условной конструкции, продолжение которой следует в следующем стихе.
