  yaml_path: translation/ot/psalms/044/024.yaml
  text: Why do you hide your face and forget our affliction and our oppression?[a]
translation:
  language: ru
  text: Почему Ты скрываешь Своё лицо[a], забываешь о нашем страдании и угнетении?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своё присутствие». Буквально: «Своё лицо» — распространённый древнееврейский образ благосклонного внимания или близости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Почему
  rationale: Естественно передаёт вопрос о причине и сохраняет прямоту плача.
- source_word: פָנֶיךָ
  choice: Своё лицо
  rationale: Сохраняет буквальный поэтический образ, обозначающий Божье благоволение, внимание или близость.
- source_word: תַסְתִּיר
  choice: скрываешь
  rationale: Точно передаёт значение глагола в породе хифиль и естественно сочетается с выражением «скрывать лицо».
- source_word: תִּשְׁכַּח
  choice: забываешь
  rationale: Сохраняет смелую буквальную формулировку плача; более истолковывающее «не замечаешь» ослабило бы её.
- source_word: עָנְיֵנוּ
  choice: нашем страдании
  rationale: Передаёт бедствие и мучительное положение общины современным и достаточно широким словом.
- source_word: וְלַחֲצֵנוּ
  choice: угнетении
  rationale: Передаёт враждебное внешнее давление, подразумеваемое существительным לַחַץ.
theological_decisions:
- issue: Антропоморфный образ Божьего лица
  choice: Сохранить выражение «Своё лицо».
  alternative: «Своё присутствие» или «Своё благоволение».
  rationale: Буквальный образ сохраняет поэтическую силу и напряжённость обращения к Богу, не сводя его заранее к одному толкованию.
- issue: Утверждение, что Бог «забывает» страдание народа
  choice: Сохранить прямое «забываешь».
  alternative: «не замечаешь» или «оставляешь без внимания».
  rationale: Вопрос выражает переживание молящихся и дерзновенный язык плача; смягчение глагола устранило бы заложенную в тексте богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтики плача. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции; синтаксис оставлен прямым и эмоционально напряжённым.
