    issue: Зְרוֹעַ передано как «рука» в обоих случаях.
    rationale: В оригинале «мышца» отличается от «десницы»; замена стирает значимое поэтическое противопоставление и повтор образа.
  - severity: medium
    issue: Положительная часть не содержит понятного сказуемого.
    rationale: После «но Твоя правая рука, Твоя рука и свет Твоего лица» читатель не получает ясного указания, как это перечисление соотносится с двумя предыдущими действиями.
  - severity: low
