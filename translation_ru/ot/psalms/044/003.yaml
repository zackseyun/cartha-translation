  source_fidelity: В основном переданы обладание землёй, контраст человеческого оружия и силы с Божьим действием, а также Божьим благоволением. Однако זְרוֹעַ («мышца», образ мощи) в обеих позициях заменено на «рука», из-за чего утрачено различие между יָד/יָמִין («десница») и זְרוֹעַ, тщательно сохранённое в еврейском параллелизме. Нулевая связка в положительной части допустима в поэзии, но в данном русском тексте она оставляет неясным синтаксическое отношение перечисления к двум предшествующим действиям.
  naturalness: «Не их рука спасла их» звучит тяжеловесно и при этом не передаёт образ «мышцы». Явное, но обобщающее «это совершили» естественно связывает Божьи средства действия как с овладением землёй, так и со спасением, не сводя стих к одному из этих действий.
  terminology: «Десница» уместна для יְמִינְךָ в литературно-поэтическом библейском регистре; «мышца» необходима для זְרוֹעַ и понятна современному читателю в этом контексте. «Свет лица Твоего» сохраняет образ оригинала. Примечание не должно безоговорочно отождествлять образ со «присутствием», поскольку это интерпретационный оттенок, а не буквальное значение.
  issues:
