  text: כִּ֤י לֹ֪א בְ/חַרְבָּ֡/ם יָ֥רְשׁוּ אָ֗רֶץ וּ/זְרוֹעָ/ם֮ לֹא הוֹשִׁ֪יעָ֫ה לָּ֥/מוֹ כִּֽי יְמִֽינְ/ךָ֣ וּ֭/זְרוֹעֲ/ךָ וְ/א֥וֹר פָּנֶ֗י/ךָ כִּ֣י רְצִיתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/003.yaml
  text: For they did not possess the land by their sword[a], and their arm did not save them; but your right hand, your arm, and the light of your face did[b], because you delighted in them.
translation:
  language: ru
  text: Ибо не своим мечом они овладели землёю, и не их мышца принесла им спасение, но это совершили Твоя десница, Твоя мышца и свет лица Твоего[a], ибо Ты благоволил к ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свет лица Твоего»; поэтический образ Божьего благоволения. Возможен также оттенок Божьего присутствия.'
    reason: imagery_clarification
lexical_decisions:
- source_word: יָרְשׁוּ אָרֶץ
  choice: овладели землёй
  rationale: Глагол ירשׁ в контексте завоевания означает вступить во владение землёй; «овладели» естественно передаёт активное обретение территории.
- source_word: זְרוֹעָם / זְרוֹעֲךָ
  choice: их рука / Твоя рука
  rationale: Сохранён телесный образ силы и намеренный контраст между человеческой и Божьей силой. Русское «рука» здесь звучит естественнее буквального «мышца».
- source_word: הוֹשִׁיעָה לָּמוֹ
  choice: спасла их
  rationale: Передаёт основное значение ישׁע и сохраняет формулировку шире, чем только «даровала победу».
- source_word: יְמִינְךָ
  choice: Твоя правая рука
  rationale: Сохранён традиционный и понятный образ Божьего могущественного действия.
- source_word: אוֹר פָּנֶיךָ
  choice: свет Твоего лица
  rationale: Буквальный поэтический образ сохранён в основном тексте, не сводясь исключительно к абстрактному «благоволению» или «присутствию».
- source_word: רְצִיתָם
  choice: Ты благоволил к ним
  rationale: Глагол выражает Божье расположение и благосклонность; «благоволил» соответствует возвышенному поэтическому регистру и не усиливает значение до эмоционального восторга.
- source_word: כִּי ... כִּי
  choice: Ведь ... потому что
  rationale: Первое כִּי вводит объяснение предшествующего утверждения, последнее указывает причину Божьего действия.
theological_decisions:
- issue: Божье действие и человеческая военная сила
  choice: Получение земли и спасение приписаны Божьей силе и благоволению, а не оружию и силе народа.
  alternative: Обобщённое утверждение о необходимости полагаться на Бога.
  rationale: Перевод сохраняет прямой контраст еврейского текста между «их мечом/рукой» и «Твоей правой рукой/рукой/светом лица», не расширяя его до не сформулированной здесь доктрины.
- issue: Образ אוֹר פָּנֶיךָ
  choice: В основном тексте сохранено «свет Твоего лица».
  alternative: «свет Твоего присутствия» или «Твоё благоволение».
  rationale: Буквальный образ одновременно допускает оттенки присутствия и благосклонности; перевод не устраняет эту многозначность.
- issue: Эллипсис сказуемого в положительной части
  choice: Сказуемое оставлено подразумеваемым после перечисления Божьих средств действия.
  alternative: 'Добавить «это совершили» или перестроить: «но благодаря Твоей...»'
  rationale: Еврейский стих не повторяет глагол; русская синтаксическая конструкция после противопоставительного «но» позволяет сохранить выразительный эллипсис без навязывания одного из двух предшествующих действий.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Местоимения, обращённые к Богу, написаны с прописной буквы. Параллелизм и повтор слова «рука» сохранены; более архаичное «мышца» вынесено в примечание.
