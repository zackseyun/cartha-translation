  text: כָּל זֹ֣את בָּ֭אַתְ/נוּ וְ/לֹ֣א שְׁכַחֲנ֑וּ/ךָ וְ/לֹֽא שִׁ֝קַּ֗רְנוּ בִּ/בְרִיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/044/017.yaml
  text: All this has come upon us[a], yet we have not forgotten you, and we have not been false to your covenant.
translation:
  language: ru
  text: Всё это постигло нас, но мы не забыли Тебя и не изменили Твоему завету.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не поступили вероломно по отношению к Твоему завету».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זֹאת
  choice: Всё это
  rationale: Естественное собирательное выражение, отсылающее ко всем бедствиям, описанным ранее, и сохраняющее всеохватность כָּל.
- source_word: בָּאַתְנוּ
  choice: постигло нас
  rationale: Глагол בוא буквально описывает то, что «пришло на нас»; русское «постигло нас» естественно передаёт наступление бедствия и результативность формы.
- source_word: וְלֹא
  choice: но не
  rationale: В контексте союз выражает контраст между перенесёнными бедствиями и сохраняемой верностью; «но» естественно передаёт эту противительную связь.
- source_word: שְׁכַחֲנוּךָ
  choice: мы не забыли Тебя
  rationale: Прямо передаёт значение глагола и местоименный суффикс второго лица, сохраняя личный характер обращения к Богу.
- source_word: שִׁקַּרְנוּ
  choice: не нарушили верности
  rationale: Порода глагола שקר здесь означает поступать ложно, вероломно; в контексте завета выражение указывает на неверность, а не только на произнесение лжи.
- source_word: בִּבְרִיתֶךָ
  choice: Твоему завету
  rationale: Предлог ב при שקר обозначает сферу или объект неверности; русский дательный после «нарушить верность» идиоматично выражает отношение к завету и сохраняет обращение к Богу.
theological_decisions:
- issue: Характер заявления Израиля о невиновности среди страданий
  choice: Текст передан как утверждение сохраняемой верности Богу и Его завету.
  alternative: Понимать стих как заявление о полной безгрешности перед Богом.
  rationale: Еврейский текст отрицает конкретно забвение Бога и ложное отношение к Его завету; перевод не расширяет это до утверждения абсолютной невиновности.
- issue: Смысл שׁקר применительно к завету
  choice: Нарушить верность завету.
  alternative: Солгать о завете или поступить ложно в отношении завета.
  rationale: Выбранная формулировка ясно передаёт заветную нелояльность, а сноска сохраняет более буквальную и широкую лексическую возможность.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Заглавные местоимения в обращении к Богу соответствуют принятой русской библейской традиции. Сноска отмечена в основном тексте.
