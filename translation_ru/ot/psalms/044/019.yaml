  - marker: b
    text: Здесь, вероятно, имеются в виду шакалы как обитатели опустошённых мест; в старых переводах встречается «драконы».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «тенью смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: И всё же
  rationale: 'В контексте предыдущих стихов частица вводит резкое противопоставление: народ не отступил от Божьего пути, и всё же был сокрушён. Перевод передаёт ход мысли естественно по-русски; возможное причинное прочтение отмечено в сноске.'
- source_word: דִכִּיתָנוּ
  choice: Ты сокрушил нас
  rationale: Глагол דכה обозначает сокрушение, подавление или унижение. «Сокрушил» сохраняет силу и конкретность поэтического образа, не сводя его к одним лишь душевным переживаниям.
- source_word: בִּמְקוֹם תַּנִּים
  choice: в краю шакалов
  rationale: В образе опустошённой местности תַּנִּים вероятнее всего означает шакалов. «В краю шакалов» звучит естественно и поэтично, сохраняя значение места, характеризуемого этими животными.
- source_word: וַתְּכַס עָלֵינוּ
  choice: и покрыл нас
  rationale: Форма продолжает прямое обращение к Богу. «Покрыл нас» сохраняет конкретную метафору еврейского текста и значение עַל без неестественной русской конструкции.
- source_word: בְצַלְמָוֶת
  choice: глубокой тьмой
  rationale: צַלְמָוֶת может обозначать непроглядную, глубокую тьму, а традиционно понимается также как «тень смерти». Основной текст передаёт вероятное идиоматическое значение, а альтернативный образ сохранён в сноске.
theological_decisions:
- issue: Значение בְצַלְמָוֶת
  choice: глубокой тьмой
  alternative: тенью смерти
  rationale: Основной вариант не превращает образ непременно в прямое указание на смерть, но традиционное и богословски значимое прочтение сохраняется в сноске.
- issue: Логическая функция כִּי
  choice: И всё же
  alternative: Ибо / ведь
  rationale: 'Ближайший контекст подчёркивает контраст между верностью народа и постигшим его сокрушением. Вместе с тем многозначность частицы не устраняется: причинное прочтение указано в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Прямое обращение к Богу передано с прописной буквы по принятой русской библейской традиции. Образы сокрушения, края шакалов и покрывающей тьмы сохранены без конфессионального истолкования.
