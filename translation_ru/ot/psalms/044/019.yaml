  yaml_path: translation/ot/psalms/044/019.yaml
  text: For you crushed us in a place of jackals and covered us with deep darkness[a][b].
translation:
  language: ru
  text: Ибо[a] Ты сокрушил нас в краю шакалов[b] и покрыл нас глубокой тьмой[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «Ведь». Еврейская частица вводит основание или объяснение.'
