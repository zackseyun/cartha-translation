  text: רָאִ֣יתָה יְ֭הוָה אַֽל תֶּחֱרַ֑שׁ אֲ֝דֹנָ֗/י אֲל תִּרְחַ֥ק מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/022.yaml
  text: You have seen[a], O Yahweh; do not be silent. O Lord, do not be far from me.
translation:
  language: ru
  text: Ты видел, Яхве, — не молчи! Господь, не будь далеко от меня!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאִיתָה
  choice: Ты видел
  rationale: 'Qal perfect, 2-е лицо, мужской род, единственное число: псалмопевец обращается к Богу, утверждая, что Он уже видел происходящее. Русское прошедшее время естественно передаёт завершённость действия.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени отличает его от следующего титула אֲדֹנָי и сохраняет различие исходного текста.
- source_word: אַל תֶּחֱרַשׁ
  choice: не молчи
  rationale: Глагол חרשׁ здесь означает «молчать»; сочетание с אַל выражает настойчивую просьбу. Краткая форма естественна по-русски и сохраняет образ бездействующего молчания.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Стандартный божественный титул передан обычным русским соответствием и отличён от личного имени Яхве.
- source_word: אַל תִּרְחַק
  choice: не будь далеко
  rationale: Глагол רחק обозначает пребывание вдали; отрицательная конструкция выражает просьбу не оставаться на расстоянии. Перевод сохраняет пространственно-реляционный образ.
- source_word: מִמֶּנִּי
  choice: от меня
  rationale: Предлог מן с суффиксом 1-го лица единственного числа непосредственно означает «от меня» и естественно сочетается с «не будь далеко».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе рядом стоят личное имя יְהוָה и титул אֲדֹנָי. Передача «Яхве» и «Господь» сохраняет это значимое лексическое различие и не смешивает имя с титулом.
translation_notes:
  register: Современный литературный русский язык с лаконичным, молитвенно-поэтическим синтаксисом. Тире перед второй просьбой подчёркивает переход от признания «Ты видел» к настойчивому призыву. Восклицательные знаки передают эмоциональную напряжённость, не добавляя нового содержания.
