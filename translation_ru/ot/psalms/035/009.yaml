  text: וְ֭/נַפְשִׁ/י תָּגִ֣יל בַּ/יהוָ֑ה תָּ֝שִׂישׂ בִּ/ישׁוּעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/009.yaml
  text: Then my soul will rejoice in Yahweh[b][a]; it will exult in his salvation.
translation:
  language: ru
  text: А моя душа возрадуется в Яхве, будет ликовать о спасении Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет ликовать о Его избавлении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנַפְשִׁי
  choice: А моя душа
  rationale: נֶפֶשׁ здесь естественно передаётся как «душа», сохраняя личный и внутренний характер радости; וְ переведено союзом «А», который связывает стих с ожидаемым избавлением и допускает оттенок следствия без излишнего уточнения.
- source_word: תָּגִיל
  choice: возрадуется
  rationale: Глагол גיל обозначает радость и торжество; «возрадуется» соответствует возвышенному поэтическому регистру псалма и остаётся понятным современному читателю.
- source_word: בַּיהוָה
  choice: в Яхве
  rationale: Предлог ב передаёт предмет или сферу радости, а имя יהוה транслитерируется как «Яхве», сохраняя личное Божье имя исходного текста.
- source_word: תָּשִׂישׂ
  choice: будет ликовать
  rationale: שׂישׂ выражает бурную, торжествующую радость; «ликовать» сохраняет усиление по отношению к «возрадуется».
- source_word: בִּישׁוּעָתוֹ
  choice: о спасении Его
  rationale: יְשׁוּעָה может означать «спасение» или конкретное «избавление». «Спасение» сохраняет широту слова, а «о» естественно по-русски обозначает основание ликования; местоимение соотносится с Яхве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя יהוה; форма «Яхве» прямо сохраняет его, не заменяя титулом.
- issue: Значение יְשׁוּעָה в контексте избавления от врагов
  choice: спасение
  alternative: избавление
  rationale: «Спасение» сохраняет более широкий смысл еврейского слова, тогда как контекст допускает конкретное избавление; эта возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической лексикой. Параллелизм сохранён посредством пары «возрадуется — будет ликовать». Инверсия «спасении Его» поддерживает поэтическое звучание, не затемняя смысла.
