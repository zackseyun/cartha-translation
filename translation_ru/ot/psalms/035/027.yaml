  text: יָרֹ֣נּוּ וְ/יִשְׂמְחוּ֮ חֲפֵצֵ֪י צִ֫דְקִ֥/י וְ/יֹאמְר֣וּ תָ֭מִיד יִגְדַּ֣ל יְהוָ֑ה הֶ֝/חָפֵ֗ץ שְׁל֣וֹם עַבְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/027.yaml
  text: Let those who delight in my vindication shout for joy and be glad[a]; let them say continually, “May Yahweh be magnified[b], who delights in the peace of his servant.”
translation:
  language: ru
  text: 'Да ликуют и радуются те, кому дорого моё оправдание[a]; пусть непрестанно говорят: «Да возвеличится Яхве, желающий мира[b] Своему слуге!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моя праведность» или «моя правота». Еврейское слово может обозначать праведность или справедливость в нравственном и судебном смысле; здесь, вероятно, речь идёт о признании псалмопевца правым.'
    reason: lexical_alternative
  - marker: b
    text: Слово «мир» может также означать «благополучие» или «процветание».
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרֹנּוּ וְיִשְׂמְחוּ
  choice: Да ликуют и радуются
  rationale: Оба глагола передают желательное побуждение к явной радости; «ликуют» сохраняет оттенок громкого радостного возгласа רנן, а «радуются» естественно передаёт שמח.
- source_word: חֲפֵצֵי צִדְקִי
  choice: те, кому желанно моё оправдание
  rationale: Причастие חפץ выражает желание и удовольствие, а צִדְקִי в контексте спора с обвинителями наиболее естественно обозначает признание псалмопевца правым. Формулировка сохраняет эмоциональный смысл и юридический оттенок.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: пусть непрестанно говорят
  rationale: Продолжает желательное значение глагольной последовательности; «непрестанно» передаёт постоянство תָמִיד.
- source_word: יִגְדַּל יְהוָה
  choice: Да возвеличится Яхве
  rationale: Имперфект имеет юссивное значение в формуле хвалы. «Да возвеличится» передаёт пожелание признания величия, а личное имя יהוה транслитерируется как «Яхве».
- source_word: הֶחָפֵץ שְׁלוֹם עַבְדּוֹ
  choice: желающий мира Своему слуге
  rationale: חפץ здесь передаёт благоволение и желание; שָׁלוֹם непосредственно переведено как «мир», сохраняя в примечании более широкий смысл благополучия; עֶבֶד в отношениях псалмопевца с Богом естественно передаётся словом «слуга».
theological_decisions:
- issue: Значение צִדְקִי применительно к псалмопевцу
  choice: моё оправдание
  alternative: моя праведность; моя правота
  rationale: Контекст судебного противостояния указывает прежде всего на подтверждение правоты псалмопевца, не утверждая его нравственного совершенства. Более широкие значения сохранены в примечании.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное Божье имя исходного текста и не заменяет его титулом.
- issue: Смысл שָׁלוֹם
  choice: мир
  alternative: благополучие; процветание
  rationale: «Мир» является прямым и традиционно понятным соответствием, но еврейское слово может охватывать целостное благополучие, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической торжественностью. Синтаксис сохраняет параллелизм и желательное значение еврейских форм; местоимение «Своему» написано с прописной буквы как уважительное указание на Бога.
