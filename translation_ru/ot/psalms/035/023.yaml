lexical_decisions:
- source_word: הָעִירָה
  choice: Пробудись
  rationale: Побудительная форма от עור обращена к Богу и метафорически призывает Его перейти от кажущегося бездействия к действию. «Пробудись» сохраняет образ и уместно звучит в возвышенной молитвенной речи.
- source_word: וְהָקִיצָה
  choice: и восстань
  rationale: Второй глагол пробуждения усиливает первый. Различная передача двух близких глаголов позволяет сохранить настойчивый параллелизм без неестественного повтора по-русски.
- source_word: לְמִשְׁפָּטִי
  choice: на суд за меня
  rationale: 'מִשְׁפָּט имеет судебный диапазон значений: суд, правосудие, судебное решение или оправдание. В контексте псалмопевец просит Бога выступить в его защиту; выбранная формулировка сохраняет судебный смысл и не сводит его однозначно к оправданию.'
- source_word: אֱלֹהַי
  choice: Бог мой
  rationale: Прямая передача притяжательной формы в обращении; постпозиция местоимения поддерживает поэтический и молитвенный регистр.
- source_word: וַאדֹנָי
  choice: и Господь мой
  rationale: אֲדֹנָי здесь является обращённым к Богу титулом. «Господь» соответствует устойчивому русскому библейскому употреблению, не внося в псалом дополнительных христологических уточнений.
- source_word: לְרִיבִי
  choice: вступись в мою тяжбу
  rationale: רִיב обозначает спор, тяжбу или судебное дело. Добавление подразумеваемого глагола «вступись» необходимо для естественного русского синтаксиса и передаёт просьбу принять сторону молящегося, не сужая значение до современного формального иска.
theological_decisions:
- issue: Двойное обращение אֱלֹהַי וַאדֹנָי
  choice: Бог мой и Господь мой
  alternative: Бог мой и Владыка мой
  rationale: Два титула сохранены раздельно как торжественное прямое обращение. «Господь» естественно передаёт божественный титул אֲדֹנָי и не привносит в данный ветхозаветный контекст конфессионально обусловленного толкования.
- issue: Характер просьбы о מִשְׁפָּט
  choice: на суд за меня
  alternative: ради моего оправдания
  rationale: Перевод сохраняет просьбу о Божьем судебном вмешательстве, не утверждая заранее конкретный исход процесса. Возможное значение оправдания или восстановления справедливости отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенным звучанием. Пара «Пробудись и восстань» передаёт усиление двух еврейских глаголов, а судебная образность сохраняется словами «суд» и «тяжба».
