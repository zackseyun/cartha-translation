  choice: Сохранить буквальный образ Бога, берущего щиты и встающего на помощь псалмопевцу.
  alternative: Передать стих как общий призыв защитить псалмопевца без упоминания оружия.
  rationale: Древнееврейский текст прямо использует воинскую метафорику и изображает Бога защитником-воином; смягчение устранило бы существенный образ исходного текста.
