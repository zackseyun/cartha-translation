- source_word: וְקוּמָה
  choice: встань
  rationale: Повелительная форма קום выражает настойчивый призыв подняться и вмешаться; «встань» естественно звучит по-русски и сохраняет образ действия.
- source_word: בְּעֶזְרָתִי
  choice: мне на помощь
  rationale: Идиоматическое русское выражение точно передаёт движение к действию ради помощи псалмопевцу.
theological_decisions:
