  text: וְ/הָ֘רֵ֤ק חֲנִ֣ית וּ֭/סְגֹר לִ/קְרַ֣את רֹדְפָ֑/י אֱמֹ֥ר לְ֝/נַפְשִׁ֗/י יְֽשֻׁעָתֵ֥/ךְ אָֽנִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/003.yaml
  text: Draw the spear and block the way against those who pursue me[a]; say to my soul[b], “I am your salvation.”
translation:
  language: ru
  text: 'Обнажи копьё и прегради путь моим преследователям[a]; скажи душе моей[b]: «Я — твоё спасение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Обнажи копьё и боевой топор против моих преследователей», если וּסְגֹר понимать как название оружия, а не как глагол «прегради, перекрой».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «скажи мне» или «скажи жизни моей». Еврейское נֶפֶשׁ может означать душу, жизнь или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָרֵק
  choice: Обнажи
  rationale: Каузативный императив от ריק в данном воинском контексте означает вынуть или обнажить оружие; «обнажи» естественно сочетается с копьём и сохраняет образ действия.
- source_word: חֲנִית
  choice: копьё
  rationale: Обычное обозначение копья; определённость в русском языке передаётся контекстом без артикля.
- source_word: וּסְגֹר
  choice: и прегради путь
  rationale: Если понимать форму как императив от סגר, буквально «закрой, перекрой», подразумеваемым объектом является путь преследователей. Добавление «путь» делает смысл естественным по-русски, не устраняя альтернативного понимания, отмеченного в сноске.
- source_word: לִקְרַאת
  choice: моим преследователям
  rationale: Сочетание означает движение навстречу или против кого-либо; при глаголе «прегради путь» русский дательный естественно выражает направленное противодействие.
- source_word: רֹדְפָי
  choice: моим преследователям
  rationale: Причастие с суффиксом первого лица буквально обозначает «преследующих меня» или «моих преследователей»; существительное сохраняет длительное враждебное действие и звучит лаконично.
- source_word: אֱמֹר
  choice: скажи
  rationale: Прямое соответствие простому повелительному наклонению глагола אמר.
- source_word: לְנַפְשִׁי
  choice: душе моей
  rationale: נפש может означать душу, жизнь или самого человека. Поэтическое «душе моей» сохраняет образность и не сводит выражение просто к «мне».
- source_word: יְשֻׁעָתֵךְ
  choice: твоё спасение
  rationale: יְשׁוּעָה обозначает спасение или избавление. «Спасение» сохраняет как конкретный смысл избавления от преследователей, так и более широкий смысл слова.
- source_word: אָנִי
  choice: Я —
  rationale: Самостоятельное местоимение имеет эмфатическую силу; тире в русском именном сказуемом передаёт утверждение «Я — твоё спасение».
theological_decisions:
- issue: Передача יְשׁוּעָה в молитве об избавлении
  choice: спасение
  alternative: избавление
  rationale: Контекст говорит о непосредственном спасении от преследователей, поэтому «избавление» возможно. Однако «спасение» столь же соответствует еврейскому слову и сохраняет его более широкий смысл, не привнося позднейшей конфессиональной конкретизации.
- issue: Антропологический смысл נֶפֶשׁ
  choice: душе моей
  alternative: мне / жизни моей
  rationale: Выражение может обозначать самого молящегося или его жизнь, но буквальный поэтический оборот «душе моей» естественен в русском псалме и сохраняет семантическую широту без жёсткого учения о составе человека.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Инверсия «душе моей» слегка возвышенна, но понятна; воинская образность сохранена. Подлинная неясность וּסְגֹר вынесена в сноску.
