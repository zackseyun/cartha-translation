  text: שָׁפְטֵ֣/נִי כְ֭/צִדְקְ/ךָ יְהוָ֥ה אֱלֹהָ֗/י וְ/אַל יִשְׂמְחוּ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/024.yaml
  text: Vindicate me according to your righteousness[a], O Yahweh my God, and do not let them rejoice over me.
translation:
  language: ru
  text: Оправдай меня по праведности Твоей[a], Яхве, Бог мой, и не дай им торжествовать надо мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по справедливости Твоей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Оправдай меня
  rationale: В контексте просьбы к Богу глагол שׁפט с личным дополнением означает просьбу вынести решение в пользу псалмопевца и подтвердить его правоту, а не просто беспристрастно оценить его.
- source_word: כְצִדְקְךָ
  choice: по праведности Твоей
  rationale: צדק указывает на праведный характер и справедливую норму Бога. «Праведность» сохраняет широту и богословскую весомость еврейского слова; возможное «справедливость» вынесено в сноску.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом.
- source_word: אֱלֹהָי
  choice: Бог мой
  rationale: Сохранён явно выраженный суффикс первого лица; порядок слов соответствует возвышенному, но естественному русскому обращению.
- source_word: וְאַל יִשְׂמְחוּ
  choice: и не дай им торжествовать
  rationale: Конструкция с אַל выражает обращённую к Богу отрицательную просьбу. «Торжествовать» естественно передаёт враждебную радость противников в данном контексте.
- source_word: לִי
  choice: надо мной
  rationale: При глаголе радости в контексте вражды предлог выражает злорадство или торжество за счёт псалмопевца; по-русски это естественно передаётся сочетанием «торжествовать надо мной».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова
  rationale: В тексте стоит личное имя Бога; форма «Яхве» наиболее вероятно отражает его древнееврейское произношение и не подменяет имя титулом.
- issue: Значение צִדְקְךָ
  choice: по праведности Твоей
  alternative: по справедливости Твоей
  rationale: Основной вариант сохраняет нравственный и богословский диапазон צדק, тогда как вариант «справедливость» яснее подчёркивает судебный аспект. Значимая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Заглавные буквы в местоимении «Твоей» отражают русскую традицию почтительного обращения к Богу; порядок «Бог мой» сохраняет поэтический тон без архаизации.
