lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для обращения псалмопевца; «ведь» естественно передаёт причинно-пояснительную связь в русском поэтическом контексте.
- source_word: חִנָּם
  choice: без причины
  rationale: Передаёт незаслуженный, ничем не оправданный характер вражды. Повтор сохранён в обеих частях стиха.
- source_word: טָמְנוּ
  choice: скрыли
  rationale: Глагол означает «спрятали, скрыли» и сохраняет образ замаскированной ловушки.
- source_word: לִי
  choice: для меня
  rationale: Предлог с местоименным суффиксом обозначает намеченную жертву; буквальная компактность сохранена без добавления «чтобы я упал».
- source_word: שַׁחַת רִשְׁתָּם
  choice: яму с сетью
  rationale: Оба элемента охотничьей ловушки сохранены. Русское сочетание читается естественно, а точная синтаксическая связь между «ямой» и «их сетью», не вполне ясная в еврейском тексте, отмечена в сноске.
- source_word: חָפְרוּ
  choice: выкопали
  rationale: Прямо передаёт конкретное действие и продолжает образ ямы-ловушки.
- source_word: לְנַפְשִׁי
  choice: посягая на мою жизнь
  rationale: נֶפֶשׁ здесь обозначает жизнь или самого человека, а не «душу» в узком позднейшем смысле. Оборот естественно выражает направленность враждебного действия.
theological_decisions:
- issue: Значение נֶפֶשׁ
  choice: моя жизнь
  alternative: моя душа / я сам
  rationale: Контекст говорит об угрозе жизни и личности псалмопевца; перевод не навязывает антропологического разделения человека на тело и нематериальную душу.
