  text: אַל יֹאמְר֣וּ בְ֭/לִבָּ/ם הֶאָ֣ח נַפְשֵׁ֑/נוּ אַל יֹ֝אמְר֗וּ בִּֽלַּעֲנֽוּ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/025.yaml
  text: Let them not say in their heart[a], “Aha, our desire!” Let them not say, “We have swallowed him up.”
translation:
  language: ru
  text: 'Да не скажут они в сердце своём: «Ага! Этого мы и желали!»[a] Да не скажут: «Мы поглотили его!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наша душа». Здесь еврейское слово נֶפֶשׁ может означать также желание, влечение или удовлетворённость желаемым; возможный перевод: «Вот чего мы хотели!»'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יֹאמְרוּ
  choice: Да не скажут
  rationale: Сочетание אַל с имперфектом/юссивом выражает отрицательное пожелание в молитве; «да не скажут» естественно и достойно передаёт эту форму.
- source_word: בְלִבָּם
  choice: в сердце своём
  rationale: Сохранён еврейский собирательный единственный падеж и образ внутренней речи; возвратное «своём» ясно связывает сердце с говорящими.
- source_word: הֶאָח
  choice: Ага!
  rationale: Междометие выражает злорадное торжество; русский эквивалент сохраняет краткость и насмешливую силу.
- source_word: נַפְשֵׁנוּ
  choice: Этого мы и желали!
  rationale: נֶפֶשׁ здесь, вероятнее всего, обозначает желание или вожделенное удовлетворение, а не нематериальную «душу». Фраза передаёт идиоматический смысл, сохраняя его неоднозначность в примечании.
- source_word: בִּלַּעֲנוּהוּ
  choice: Мы поглотили его
  rationale: Глагол בלע буквально означает «глотать, поглощать» и образно выражает полное уничтожение или поражение; сохранена яркая метафора оригинала.
