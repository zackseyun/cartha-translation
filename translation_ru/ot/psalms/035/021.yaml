  text: 'Они широко разинули на меня рты и сказали: «Ага, ага! Наши глаза это видели[a]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наш глаз видел». В еврейском глагол и слово «глаз» стоят в единственном числе как собирательное выражение; «это» подразумевается по контексту.'
    reason: Передаёт отмеченную в оригинале форму единственного числа и поясняет подразумеваемый объект, не добавляя его в основной текст как конкретное содержание.
lexical_decisions:
- source_word: וַיַּרְחִיבוּ ... פִּיהֶם
  choice: широко разинули ... рты
  rationale: Глагол רחב в породе хифиль буквально означает «расширили»; в сочетании со словом «рот» передаёт образ широко раскрытого рта при злорадстве. «Разинули» естественно и выразительно сохраняет враждебный оттенок.
- source_word: עָלַי
  choice: на меня
  rationale: Предлог עַל при враждебном жесте или речи указывает на направленность против говорящего. Русское «разинули на меня рты» сохраняет и образ, и враждебную направленность.
- source_word: פִּיהֶם
  choice: рты
  rationale: В еврейском стоит форма «их рот», возможная в собирательном значении; по-русски при множественном субъекте естественнее распределительное множественное число «рты».
- source_word: הֶאָח הֶאָח
  choice: Ага! Ага!
  rationale: Повторённое междометие выражает злорадное торжество. «Ага!» сохраняет повтор, насмешливость и естественно звучит в современном русском.
- source_word: רָאֲתָה עֵינֵינוּ
  choice: Мы сами всё видели
  rationale: 'Буквально: «наш глаз видел». Это коллективное выражение означает свидетельство очевидцев. Русская формулировка передаёт эмфатический смысл и естественно выражает их торжествующее заявление; «сами» отражает акцент на непосредственном видении, а «всё» передаёт подразумеваемый объект без его конкретизации.'
