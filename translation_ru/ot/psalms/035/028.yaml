lexical_decisions:
- source_word: וּלְשׁוֹנִי
  choice: И язык мой
  rationale: Сохранены союз, буквальный образ языка как обозначения речи и связь с предыдущим контекстом.
- source_word: תֶּהְגֶּה
  choice: будет возвещать
  rationale: Глагол הגה может обозначать тихое произнесение, размышление или высказывание; при подлежащем «язык» и в контексте хвалы речь, вероятнее всего, идёт о слышимом выражении. «Возвещать» естественно сочетается с обоими дополнениями и не уточняет громкость.
- source_word: צִדְקֶךָ
  choice: Твою праведность
  rationale: «Праведность» сохраняет широту еврейского понятия, которое здесь включает правильность Божьих действий и справедливое оправдание псалмопевца.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Современное и точное обозначение непрерывности на протяжении дня; позиция перед вторым дополнением отражает еврейский поэтический порядок.
- source_word: תְּהִלָּתֶךָ
  choice: Твою хвалу
  rationale: Формально передаёт существительное с местоименным суффиксом, не сводя его однозначно ни к хвале, обращённой к Богу, ни к Его славе или достоинству хвалы.
theological_decisions:
- issue: Значение צִדְקֶךָ в контексте Божьего заступничества
  choice: Твою праведность
  alternative: Твою справедливость
  rationale: Основной вариант сохраняет одновременно нравственную правоту Бога и праведность Его суда; контекстуально возможная «справедливость» дана в примечании, чтобы не сужать смысл.
- issue: Направленность выражения תְּהִלָּתֶךָ
  choice: Твою хвалу
  alternative: хвалу Тебе
  rationale: Еврейская форма допускает понимание как хвалы, относящейся к Богу, так и хвалы, воздаваемой Ему. Основной текст сохраняет эту широту, а примечание предлагает более явное русское выражение второго смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Инверсия «язык мой» и эллиптическое тире сохраняют достоинство и параллелизм стиха, не делая его архаичным.
