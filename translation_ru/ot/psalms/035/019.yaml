lexical_decisions:
- source_word: אַל יִשְׂמְחוּ לִי
  choice: Да не злорадствуют надо мной
  rationale: Отрицательная частица с имперфектом выражает обращённую к Богу просьбу. Глагол означает «радоваться», а לִי в данном враждебном контексте указывает на торжество над псалмопевцем; «злорадствовать надо мной» естественно передаёт оба оттенка.
- source_word: אֹיְבַי שֶׁקֶר
  choice: мои лживые враги
  rationale: Сжатое еврейское сочетание связывает врагов с ложью, но синтаксически допускает несколько толкований. Основной вариант краток и сохраняет прямую связь со словом «ложь»; неоднозначность отмечена в сноске.
- source_word: שֹׂנְאַי חִנָּם
  choice: ненавидящие меня без причины
  rationale: Причастие передаёт продолжающееся враждебное отношение, а חִנָּם здесь означает беспричинность и необоснованность ненависти.
- source_word: יִקְרְצוּ עָיִן
  choice: подмигивают глазом
  rationale: Сохранён конкретный образ еврейской идиомы — знак глазами, выражающий насмешку, злорадство или тайный сговор. Пояснение дано в сноске.
