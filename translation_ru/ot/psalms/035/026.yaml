  rationale: Передаёт совместность и общую участь названной группы.
- source_word: שְׂמֵחֵי רָעָתִי
  choice: радующиеся моей беде
  rationale: רָעָה здесь означает постигшую псалмопевца беду или несчастье, а не его нравственное зло.
- source_word: יִלְבְּשׁוּ
  choice: да облекутся в
  rationale: Сохраняет еврейскую метафору одежды и желательное значение формы.
- source_word: בֹשֶׁת וּכְלִמָּה
  choice: стыд и позор
  rationale: Естественная русская пара близких по значению слов, сохраняющая усиление оригинала.
- source_word: הַמַּגְדִּילִים עָלָי
  choice: превозносящиеся надо мной
  rationale: Передаёт буквальный образ тех, кто делает себя великим над другим, и подразумеваемое высокомерное самоутверждение.
