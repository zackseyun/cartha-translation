  yaml_path: translation/ot/psalms/035/015.yaml
  text: But at my stumbling they rejoiced and gathered together[a]; they gathered against me—strangers whom I did not know[d][c][b]. They tore at me and did not stop.
translation:
  language: ru
  text: Но когда я споткнулся, они обрадовались и собрались[a]; собрались против меня нападавшие, мне незнакомые[b]. Они терзали меня и не умолкали[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда я захромал»; возможен и более широкий смысл: «когда я ослабел» или «когда потерпел неудачу».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово редкое и неясное. Возможно: «бьющие» или «нападавшие»; по другому толкованию — «увечные» или «хромые». Фразу можно также понять так: «собрались против меня нападавшие, а я не знал об этом».'
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: 'Или: «они раздирали меня и не прекращали». Если речь идёт о злословии, смысл может быть таким: «они поносили меня без умолку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְצַלְעִי
  choice: когда я споткнулся
  rationale: צלע может указывать на хромоту, спотыкание или более широко — на момент слабости и падения. Глагольная формулировка естественна по-русски и сохраняет телесный и переносный оттенки.
- source_word: שָׂמְחוּ
  choice: они обрадовались
  rationale: Прямо передаёт враждебную радость противников по поводу несчастья псалмопевца.
- source_word: וְנֶאֱסָפוּ / נֶאֶסְפוּ
  choice: и собрались; собрались
  rationale: Повтор корня אסף сохранён, поскольку он создаёт в еврейском тексте смысловое и риторическое усиление.
- source_word: עָלַי
  choice: против меня
  rationale: В данном враждебном контексте это естественная русская передача буквального «на меня».
- source_word: נֵכִים
  choice: погромщики
  rationale: Редкое и неясное слово, вероятно связанное с нанесением ударов. «Погромщики» передаёт агрессивный смысл и звучит естественнее, чем буквальные «бьющие»; неопределённость отмечена в сноске.
- source_word: וְלֹא יָדַעְתִּי
  choice: незнакомые мне
  rationale: 'Фраза понята как характеристика собравшихся: псалмопевец не знал этих нападавших. Возможный смысл «а я не знал об этом» сохранён в сноске.'
- source_word: קָרְעוּ
  choice: они терзали меня
  rationale: קרע буквально означает «разрывать, раздирать». «Терзали» не уточняет без необходимости, была ли атака физической или словесной.
- source_word: וְלֹא דָמּוּ
  choice: и не умолкали
  rationale: דמם может означать «молчать» или «прекращать». «Не умолкали» хорошо сочетается с возможным образом непрерывной словесной травли; альтернативный общий смысл указан в сноске.
theological_decisions:
- issue: Характер нападения
  choice: Не уточнять, было ли оно физическим или словесным
  alternative: Описать прямое физическое избиение либо только злословие
  rationale: Сочетание קָרְעוּ и וְלֹא דָמּוּ допускает образ как жестокого нападения, так и непрерывной словесной травли; перевод сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством псалма. Сохранён повтор «собрались», а редкое נֵכִים и неоднозначность последних глаголов не сглажены, но вынесены в ясные сноски.
