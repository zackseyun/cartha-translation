  yaml_path: translation/ot/psalms/035/001.yaml
  text: Of David[a]. Contend, O Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: ru
  text: 'Давида.


    Веди тяжбу[a], Яхве, с теми, кто ведёт тяжбу со мной;

    сразись с теми, кто сражается со мной.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Борись, Яхве, с моими противниками». Еврейский глагол может обозначать ведение судебного дела, а также спор или противоборство вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая надпись с לְ при имени допускает авторство или связь с Давидом, не уточняя её характера сверх еврейского текста.
- source_word: רִיבָה
  choice: Вступись … против
  rationale: Глагол ריב может обозначать ведение тяжбы, спор или противоборство. «Вступись против» естественно по-русски передаёт просьбу выступить на стороне псалмопевца, сохраняя как судебный, так и более широкий состязательный оттенок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶת יְרִיבַי
  choice: против тех, кто спорит со мной
  rationale: Относительное предложение сохраняет связь с корнем ריב и естественно передаёт людей, ведущих спор или тяжбу против говорящего.
- source_word: לְחַם
  choice: сразись с
  rationale: Императив передаёт прямой призыв вступить в бой; «сразись» сохраняет военную силу образа и звучит естественно и торжественно.
- source_word: אֶת לֹחֲמָי
  choice: с теми, кто сражается со мной
  rationale: Относительное предложение воспроизводит в русском повтор того же корня, который в еврейском связывает повеление с обозначением противников.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя יְהוָה; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Юридический или общий смысл ריב
  choice: Вступись … против
  alternative: Веди мою тяжбу с
  rationale: Исходный глагол допускает судебное и более широкое состязательное значение. Основной текст не ограничивает образ только судопроизводством, а сноска сохраняет юридическую возможность.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Сохранён повтор «сразись — сражается» во второй строке; в первой выбран естественный русский оборот, позволяющий не устранять юридическую многозначность корня ריב.
