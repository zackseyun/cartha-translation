base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/008.yaml
  text: Let destruction come upon him unawares[a], and let the net that he hid catch him[c][b]; into that very destruction let him fall.
translation:
  language: ru
  text: Пусть гибель постигнет его нежданно[a], и сеть, которую он спрятал, уловит его; пусть он упадёт в неё[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пусть придёт на него гибель — он не знает». Возможный перевод: «Пусть гибель постигнет его, когда он не ожидает».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пусть он упадёт в ту самую гибель». Еврейское «в неё» может относиться либо к сети, либо к гибели.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּבוֹאֵהוּ שׁוֹאָה
  choice: пусть гибель постигнет его
  rationale: 'Буквально: «пусть придёт на него гибель». Русское «постигнет» естественно передаёт наступление бедствия и сохраняет желательное значение формы в контексте молитвы.'
- source_word: לֹא יֵדָע
  choice: нежданно
  rationale: 'Буквально: «он не знает». Наречие естественно выражает отсутствие у человека предвидения; буквальная конструкция поясняется в сноске.'
- source_word: וְרִשְׁתּוֹ אֲשֶׁר טָמַן
  choice: и сеть, которую он спрятал
  rationale: Суффикс указывает на «его сеть», а придаточное ясно связывает сеть с тем, кто её спрятал. «Спрятал» непосредственно передаёт טמן и подходит к образу тайной ловушки.
- source_word: תִּלְכְּדוֹ
  choice: уловит его
  rationale: В сочетании с сетью «уловит» естественно передаёт לכד — поймать, захватить — и сохраняет возвышенный поэтический регистр.
- source_word: בְּשׁוֹאָה יִפָּל בָּהּ
  choice: пусть он сам упадёт в неё
  rationale: Женский суффикс может относиться к ближайшей «сети» или возобновлять «гибель». Основной текст сохраняет яркий образ попадания в собственную сеть, а альтернативный синтаксический разбор отмечен в сноске.
theological_decisions:
- issue: Объект местоимения בָּהּ
  choice: «в неё» относится к сети
  alternative: 'Местоимение возобновляет שׁוֹאָה: «пусть он упадёт в ту самую гибель»'
  rationale: Оба существительных женского рода, поэтому грамматика допускает оба понимания. Отнесение к сети создаёт связный образ воздаяния через собственную ловушку, но альтернативу нельзя устранять, и она приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Императивно-желательные формы «пусть» сохраняют характер молитвы о воздаянии; реальная неоднозначность последней строки вынесена в сноску.
