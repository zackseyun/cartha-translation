  yaml_path: translation/ot/psalms/035/014.yaml
  text: I walked about as though he were my friend[a], as though he were my brother; I bowed down in gloom[c][b], like one mourning for a mother.
translation:
  language: ru
  text: Я держался так, словно он был мне другом, словно был мне братом[a]; я мрачно поник[b], как человек, оплакивающий мать[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как друг, как брат мне, я ходил»; еврейский оборот подчёркивает тесную личную близость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «потемневший»; это образ мрачного, подавленного вида скорбящего.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «словно скорбящий по матери».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֵעַ כְּאָח לִי
  choice: словно он был мне другом, словно братом
  rationale: Два оборота с כְּ выражают сравнение и близость отношений. В русском для ясности из контекста восполнено «он был», а לִי естественно передано дательным «мне».
- source_word: הִתְהַלָּכְתִּי
  choice: я держался так
  rationale: Форма от הלך здесь описывает не просто физическую ходьбу, а образ поведения по отношению к страдавшему человеку. «Держался так» естественно передаёт этот смысл и связывает глагол с двумя предшествующими сравнениями.
- source_word: כַּאֲבֶל אֵם
  choice: как оплакивающий мать
  rationale: Сочетание означает человека, скорбящего по матери. Сравнение сохранено отдельно от קֹדֵר, чтобы не смешивать два образа.
- source_word: קֹדֵר
  choice: омрачённый
  rationale: Слово буквально связано с потемнением и в контексте скорби описывает мрачный, подавленный вид. «Омрачённый» сохраняет образ темноты, оставаясь понятным по-русски.
- source_word: שַׁחֽוֹתִי
  choice: я поник
  rationale: Глагол обозначает согбенное, опущенное состояние. «Поник» кратко передаёт и телесную позу, и душевную подавленность.
