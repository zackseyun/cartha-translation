  text: יְֽהִי דַרְכָּ֗/ם חֹ֥שֶׁךְ וַ/חֲלַקְלַקּ֑וֹת וּ/מַלְאַ֥ךְ יְ֝הוָ֗ה רֹדְפָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/006.yaml
  text: May their way be dark and slippery[a], with the angel of Yahweh pursuing them.
translation:
  language: ru
  text: 'Пусть их путь будет тёмным и скользким,

    и пусть Ангел Яхве преследует их.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Ангел Яхве преследует их». Еврейский союз допускает как простое присоединение, так и значение сопутствующего обстоятельства.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: יְהִי
  choice: пусть … будет
  rationale: Юссив глагола היה выражает пожелание-проклятие. Оборот «пусть … будет» естественно передаёт это значение в современном русском языке.
- source_word: דַרְכָּם
  choice: их путь
  rationale: דֶּרֶךְ означает «путь, дорога» и здесь допускает как буквальное, так и переносное понимание; слово «путь» сохраняет оба оттенка.
- source_word: חֹשֶׁךְ
  choice: тёмным
  rationale: Буквально существительное «тьма» выступает в роли сказуемого. Русское прилагательное «тёмным» естественно передаёт образ мрака и опасности.
- source_word: וַחֲלַקְלַקּוֹת
  choice: и скользким
  rationale: Форма множественного числа обозначает скользкие места или скользкость. Прилагательное согласовано со словом «путь» ради естественности русского выражения, не устраняя образ опасной дороги.
- source_word: וּמַלְאַךְ יְהוָה
  choice: и пусть Ангел Яхве
  rationale: Союз ו передан как «и». Повтор «пусть» делает явной продолжающуюся формулу пожелания-проклятия; возможное обстоятельственное понимание союза отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени «Яхве», а не заменён титулом.
- source_word: רֹדְפָם
  choice: преследует их
  rationale: Причастие от רדף выражает продолжающееся активное преследование. «Преследует» сохраняет широту исходного значения, не уточняя способ действия.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Синтаксическая связь второй строки с пожеланием-проклятием
  choice: «и пусть … преследует» как продолжение пожелания
  alternative: «когда Ангел Яхве преследует их» как сопутствующее обстоятельство
  rationale: Контекст и начальный юссив поддерживают продолжение проклятия, однако еврейский союз ו при причастии допускает и обстоятельственный оттенок; эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмическим звучанием. Параллелизм строк сохранён; архаичные формы избегаются.
