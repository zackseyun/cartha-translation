base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/000.yaml
  text: Of David[a]. Contend, Yahweh, with those who contend with me[b]; fight against those who fight against me.
translation:
  language: ru
  text: 'Давида.[a]


    Веди тяжбу, Господи, с моими противниками;

    сразись с теми, кто сражается против меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давиду»; еврейское надписание может указывать на авторство, принадлежность, посвящение или иную связь с Давидом.'
    reason: source_ambiguity
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая надпись сохраняет формальную неоднозначность еврейского оборота: он может указывать на авторство, принадлежность, посвящение или связь с Давидом.'
- source_word: רִיבָה ... אֶת־יְרִיבַי
  choice: Вступись ... в тяжбу с теми, кто судится со мной
  rationale: Корень ריב допускает как судебный смысл тяжбы, так и более широкий смысл противоборства. Судебная формулировка естественна в русском и сохраняет контраст со следующим военным образом.
- source_word: יְהוָה
  choice: Господи
  rationale: В обращении тетраграмматон передан традиционным русским эквивалентом «Господь» в звательном употреблении, без реконструкции произношения имени.
- source_word: לְחַם אֶת־לֹחֲמָי
  choice: сразись с теми, кто сражается против меня
  rationale: Сохранены императив, однокоренной повтор и военный смысл второй параллельной строки.
theological_decisions:
- issue: 'Характер первой просьбы: судебная защита или общее противоборство'
  choice: 'Судебный образ: «вступись ... в тяжбу»'
  alternative: «Борись с теми, кто борется со мной»
  rationale: Употребление ריב поддерживает юридическую сцену, тогда как следующая строка явно говорит о сражении; различение образов сохраняет поэтическое нарастание и не исключает более широкого значения.
- issue: Передача надписания לְדָוִד
  choice: «Давида» с примечанием об неоднозначности
  alternative: «Псалом Давида» или «Давиду»
  rationale: В исходном тексте нет существительного «псалом», а предлог לְ допускает несколько отношений; краткая форма не навязывает единственного толкования.
translation_notes:
  register: Современный литературный русский с поэтическим параллелизмом. «Вступись в тяжбу» передаёт судебный оттенок без архаичного «веди тяжбу», а «сразись» сохраняет достоинство и военную образность второй строки.
