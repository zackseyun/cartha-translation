  text: יֵבֹ֣שׁוּ וְ/יִכָּלְמוּ֮ מְבַקְשֵׁ֪י נַ֫פְשִׁ֥/י יִסֹּ֣גוּ אָח֣וֹר וְ/יַחְפְּר֑וּ חֹ֝שְׁבֵ֗י רָעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/004.yaml
  text: Let those who seek my life be put to shame and humiliated[b][a]; let those who devise my harm turn back and be disgraced.
translation:
  language: ru
  text: Да постыдятся и будут посрамлены ищущие моей жизни[a]; да отступят назад и покроются позором замышляющие против меня зло[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ищущие моей души»; в этом контексте еврейское выражение означает тех, кто посягает на жизнь человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «замышляющие против меня беду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: да постыдятся
  rationale: Форма передаёт молитвенное пожелание, а глагол בוש — переживание стыда и поражения.
- source_word: וְיִכָּלְמוּ
  choice: и будут посрамлены
  rationale: Нифаль глагола כלם имеет пассивно-результативный оттенок; перевод сохраняет усиление первого выражения о стыде.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: ищущие моей гибели
  rationale: В данном враждебном контексте сочетание буквально означает тех, кто посягает на жизнь говорящего; «гибели» естественно передаёт их намерение.
- source_word: יִסֹּגוּ אָחוֹר
  choice: да отступят назад
  rationale: Сочетание סוג с אָחוֹר обозначает отход, отступление или обращение вспять.
- source_word: וְיַחְפְּרוּ
  choice: и покроются позором
  rationale: Здесь חפר относится к позору и унижению, а не к буквальному копанию; выражение отличает этот глагол от двух предыдущих слов поля стыда.
- source_word: חֹשְׁבֵי רָעָתִי
  choice: замышляющие мне зло
  rationale: חשב передаёт обдумывание и замысел, а רָעָתִי допускает значение зла или беды, направленных против псалмопевца.
theological_decisions:
- issue: Молитвенно-пожелательная сила несовершенных форм
  choice: Передать оборотом «да…» как просьбу или пожелание суда
  alternative: 'Будущее изъявительное: «постыдятся… отступят…»'
  rationale: В контексте обращённой к Богу молитвы эти формы естественно имеют юссивное, импрекаторное значение, хотя морфологически сами по себе могут быть неоднозначны.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным строем. Параллелизм и три близких, однако не полностью тождественных выражения стыда и позора сохранены.
