base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/012.yaml
  text: They repay me evil for good[b][a], bereavement to my soul.
translation:
  language: ru
  text: 'Они воздают мне злом за добро,

    а душе моей — тяжкая утрата.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «утрата для моей души». Еврейское слово שְׁכוֹל может обозначать тяжёлую утрату, нередко связанную с потерей детей или близких; נֶפֶשׁ также может означать «жизнь» или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלְּמוּנִי
  choice: Они воздают мне
  rationale: Пиэль глагола שׁלם здесь означает воздаяние или отплату. «Воздают мне» естественно сочетается с противопоставлением зла и добра и сохраняет возвышенный поэтический регистр.
- source_word: רָעָה תַּחַת טוֹבָה
  choice: злом за добро
  rationale: Краткая русская формула точно передаёт обмен, выраженный предлогом תַּחַת, и сохраняет резкий нравственный контраст оригинала.
- source_word: שְׁכוֹל
  choice: осиротела
  rationale: Существительное обозначает тяжёлую утрату, обычно утрату детей или близких. Русский образ осиротевшей души передаёт состояние лишённости и скорби, не ограничивая смысл буквальной бездетностью.
- source_word: לְנַפְשִׁי
  choice: душа моя
  rationale: נֶפֶשׁ может означать душу, жизнь или самого человека. «Душа моя» сохраняет поэтический образ и внутреннюю глубину фразы; смысловая широта отмечена в сноске.
theological_decisions:
- issue: Связь заключительной именной фразы שְׁכוֹל לְנַפְשִׁי с первой строкой
  choice: 'Передать её после тире как состояние говорящего: «душа моя осиротела»'
  alternative: «осиротение душе моей» или «утрата для моей жизни»
  rationale: В еврейском тексте связь не выражена глаголом. Тире сохраняет резкое присоединение, а полная русская фраза делает стих понятным, не вводя причинной связи более определённой, чем в оригинале.
translation_notes:
  register: Современный литературный русский с поэтической сжатостью. Глагол «осиротела» употреблён образно и передаёт тяжёлую утрату без утверждения о буквальной потере детей; тире отражает бессоюзное присоединение заключительной фразы.
