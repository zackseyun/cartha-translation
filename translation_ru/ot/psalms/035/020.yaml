lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание для предшествующей жалобы; «ведь» естественно передаёт пояснительно-причинную связь в русском поэтическом контексте.
- source_word: לֹא שָׁלוֹם יְדַבֵּרוּ
  choice: они говорят не о мире
  rationale: Сохраняет שָׁלוֹם как объект речи и не сводит выражение к наречию «немирно»; речь этих людей не направлена к миру или примирению.
- source_word: שָׁלוֹם
  choice: мир
  rationale: Передаёт основное значение слова, включая уместные здесь оттенки мирных отношений и благополучия.
- source_word: וְעַל
  choice: а против
  rationale: Русский противительный союз ясно выражает контраст между тем, о чём они не говорят, и тем, что замышляют против других.
- source_word: רִגְעֵי אֶרֶץ
  choice: тех, кто мирно живёт на земле
  rationale: 'Естественно передаёт вероятный смысл редкого выражения: людей, живущих тихо и мирно; неоднозначность отмечена в сноске.'
- source_word: דִּבְרֵי מִרְמוֹת
  choice: лживые речи
  rationale: Передаёт еврейское сочетание как намеренно обманные высказывания и звучит естественно в современном литературном русском.
- source_word: יַחֲשֹׁבוּן
  choice: замышляют
  rationale: В данном враждебном контексте глагол означает намеренное обдумывание и составление злого замысла, а не просто размышление.
