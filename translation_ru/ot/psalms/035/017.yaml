  text: אֲדֹנָ/י֮ כַּ/מָּ֪ה תִּ֫רְאֶ֥ה הָשִׁ֣יבָ/ה נַ֭פְשִׁ/י מִ/שֹּׁאֵי/הֶ֑ם מִ֝/כְּפִירִ֗ים יְחִידָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/017.yaml
  text: Lord, how long will you look on? Restore my life from their ravages, my only one from the young lions.
translation:
  language: ru
  text: Господи, долго ли Ты будешь смотреть? Вызволи мою жизнь от их разорения, мою единственную[a] — от молодых львов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мою единственную жизнь»; возможный смысл: «самое дорогое, что у меня есть».'
    reason: Еврейское יְחִידָתִי буквально означает «мою единственную» и в поэтическом параллелизме относится к жизни псалмопевца.
lexical_decisions:
- source_word: תִּרְאֶה
  choice: будешь смотреть
  rationale: Сохраняет буквальный образ безучастного наблюдения и риторический вопрос «долго ли?».
- source_word: הָשִׁיבָה נַפְשִׁי
  choice: вызволи мою жизнь
  rationale: נפשׁ здесь обозначает жизнь самого молящегося, а повелительная форма השׁיב выражает просьбу вернуть её из опасности, то есть вызволить.
- source_word: מִשֹּׁאֵיהֶם
  choice: от их разорения
  rationale: Передаёт причиняемое врагами опустошение или разорение, не превращая образ в конкретный способ нападения, которого нет в исходном тексте.
- source_word: מִכְּפִירִים
  choice: от молодых львов
  rationale: Прямое соответствие образу сильных и опасных молодых львов; метафора врагов сохранена.
theological_decisions:
- issue: Значение נַפְשִׁי и יְחִידָתִי
  choice: «мою жизнь… мою единственную»
  alternative: «мою душу… мою единственную»
  rationale: В данном контексте речь идёт о спасении жизни от смертельной угрозы. При этом параллелизм и необычный образ «единственной» сохранены, а не истолкованы конфессионально как отдельная нематериальная сущность.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконизма, риторического напряжения и образности еврейской поэзии. Обращение к Богу оформлено традиционным уважительным «Ты».
