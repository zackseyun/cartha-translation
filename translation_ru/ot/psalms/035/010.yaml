  text: כָּ֥ל עַצְמוֹתַ֨/י תֹּאמַרְנָה֮ יְהוָ֗ה מִ֥י כָ֫מ֥וֹ/ךָ מַצִּ֣יל עָ֭נִי מֵ/חָזָ֣ק מִמֶּ֑/נּוּ וְ/עָנִ֥י וְ֝/אֶבְי֗וֹן מִ/גֹּזְלֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/035/010.yaml
  text: All my bones will say, “O LORD, who is like you, delivering the poor from one stronger than he, and the poor and needy from the one who robs him?”
translation:
  language: ru
  text: 'Все кости мои скажут: «Господи, кто подобен Тебе? Ты избавляешь бедного от того, кто сильнее его, бедного и нищего — от того, кто его грабит».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל עַצְמוֹתַי
  choice: Все кости мои
  rationale: Сохранён конкретный древнееврейский образ, выражающий свидетельство всего существа человека.
- source_word: יְהוָה
  choice: Господи
  rationale: Традиционная русская передача обращения к тетраграмматону в форме звательного обращения.
- source_word: עָנִי
  choice: бедного
  rationale: В данном контексте слово обозначает социально уязвимого, угнетённого человека; «бедный» естественно сочетается с последующим «нищий» и не сужает смысл лишь до душевного страдания.
- source_word: אֶבְיוֹן
  choice: нищего
  rationale: Передаёт крайнюю нужду и сохраняет различие между עָנִי и אֶבְיוֹן.
- source_word: גֹּזְלוֹ
  choice: того, кто его грабит
  rationale: Глагольная конструкция естественно передаёт действующего притеснителя и значение насильственного отнятия.
theological_decisions:
- issue: Риторический вопрос מִי כָמוֹךָ
  choice: кто подобен Тебе?
  alternative: нет подобного Тебе
  rationale: Сохранена форма исходного риторического вопроса, выражающего несравненность Бога, без превращения её в поясняющее утверждение.
- issue: Причастная характеристика מַצִּיל
  choice: Ты избавляешь
  alternative: избавляющий
  rationale: Личное предложение естественно по-русски продолжает прямое обращение к Господу и сохраняет действие в обобщённо-настоящем смысле.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического телесного образа. Местоимение «Тебе» написано с прописной буквы как уместная в библейском русском регистре форма почтительного обращения; синтаксис сделан ясным без устранения параллелизма.
