lexical_decisions:
- source_word: בְּחַנְפֵי
  choice: с нечестивыми
  rationale: Существительное от חנף обозначает людей нечестивых или безбожных, иногда лицемерных. Здесь религиозно-нравственная характеристика «нечестивые» точнее, чем более узкое «лицемеры»; предлог ב передан как «с».
- source_word: לַעֲגֵי
  choice: насмешниками
  rationale: Форма от לעג обозначает тех, кто насмехается и глумится; «насмешники» естественно звучит в современном русском языке.
- source_word: מָעוֹג
  choice: на пиру
  rationale: Редкое и неясное слово, возможно связанное с пиршеством либо с лепёшкой или куском пищи. В основном тексте выбран вероятный социальный контекст пира, а неопределённость сохранена в сноске.
- source_word: חָרֹק
  choice: они скрежещут
  rationale: Глагол חרק описывает скрежет зубов как выражение вражды. Для естественной русской фразы причастная форма передана личным глаголом.
- source_word: עָלַי
  choice: на меня
  rationale: При выражении «скрежетать зубами» сочетание «на меня» естественно передаёт направленную враждебность.
- source_word: שִׁנֵּימוֹ
  choice: зубами
  rationale: Форма означает «их зубы»; русский глагол «скрежетать» нормативно требует творительного падежа, а принадлежность ясно выражена подлежащим «они».
