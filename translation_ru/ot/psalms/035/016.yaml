  source_fidelity: 'Основной смысл передан верно: враждебные насмешники скрежещут зубами на псалмопевца. Однако «с нечестивыми насмешниками ... они» в русском языке обычно означает совместное действие («они скрежещут вместе с насмешниками»), тогда как בְּ здесь в принятом переводческом решении имеет значение среды/окружения: «среди». Неясность מָעוֹג надлежащим образом отмечена сноской.'
  naturalness: «Среди нечестивых насмешников на пиру» устраняет синтаксическую двусмысленность и естественно звучит в современном литературном русском. «Скрежещут зубами на меня» — нормативная и выразительная передача образа.
