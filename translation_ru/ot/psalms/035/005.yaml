  text: Да будут они как мякина перед ветром, и[a] пусть ангел Яхве гонит их прочь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а ангел Яхве гонит их прочь». Еврейский союз может означать простое «и»; причастие передаёт действие ангела и может быть переведено личной формой «гонит» либо причастным оборотом: «гонящий» или «оттесняющий их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Да будут они
  rationale: Форма в контексте имеет пожелательно-проклинательный оттенок; конструкция с «да» естественно передаёт его в русском библейском регистре.
- source_word: כְּמֹץ
  choice: как мякина
  rationale: מֹץ обозначает лёгкие остатки после обмолота, уносимые ветром; «мякина» сохраняет образ и привычна для русской библейской речи.
- source_word: לִפְנֵי רוּחַ
  choice: перед ветром
  rationale: Буквально передаёт пространственный образ беспомощной мякины, подхваченной ветром.
- source_word: וּמַלְאַךְ יְהוָה
  choice: и ангел Яхве
  rationale: Союз ו передан нейтральным «и», без уточнения логической связи; מַלְאַךְ в устойчивом сочетании естественно передать как «ангел», а личное имя יהוה — как «Яхве».
- source_word: דּוֹחֶה
  choice: да гонит их прочь
  rationale: Причастие от דחה выражает энергичное оттеснение или изгнание. В русском оно согласовано с пожелательной формой первой части; подразумеваемое дополнение восстановлено из контекста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Идентичность מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: вестник Яхве
  rationale: «Ангел» наиболее естественен в устойчивом библейском выражении, но перевод не уточняет природу или личность этого ангела.
- issue: Связь между двумя частями стиха
  choice: и ангел Яхве да гонит их прочь
  alternative: а ангел Яхве пусть гонит их прочь
  rationale: Нейтральное «и» сохраняет многозначность еврейского ו и не превращает вторую часть в явно обстоятельственную конструкцию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Конструкция «да будут… да гонит» передаёт молитвенно-импрекативный характер, оставаясь понятной современному читателю.
