lexical_decisions:
- source_word: יְקוּמוּן
  choice: встают
  rationale: Форма от קום описывает, как враждебные свидетели выступают или занимают своё место; «встают» сохраняет живой и возможный судебный оттенок.
- source_word: עֵדֵי חָמָס
  choice: свидетели неправды
  rationale: Буквально — «свидетели насилия/беззакония». Здесь חָמָס обозначает причиняющую вред несправедливость; «свидетели неправды» естественно по-русски передаёт злонамеренный и неправедный характер свидетельства, не сужая значение до одной лишь фактической лжи.
- source_word: אֲשֶׁר לֹא יָדַעְתִּי
  choice: о том, чего я не знаю
  rationale: В еврейском относительном обороте объект прямо не выражен. Русская формулировка минимально восполняет его и сохраняет заявление говорящего о незнании предмета обвинений.
- source_word: יִשְׁאָלוּנִי
  choice: спрашивают меня
  rationale: שׁאל означает «спрашивать, расспрашивать, требовать». Нейтральное «спрашивают» сохраняет широту глагола, тогда как «допрашивают» могло бы чрезмерно конкретизировать судебную обстановку.
