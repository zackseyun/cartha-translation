  text: Встают жестокие свидетели[a] и спрашивают меня о том, чего я не знаю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лжесвидетели» или «злонамеренные свидетели»; буквально: «свидетели насилия».'
