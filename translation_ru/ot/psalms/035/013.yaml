    text: 'Буквально: «молитва моя возвращалась к моей груди (в моё лоно)». Смысл еврейского выражения не вполне ясен. Возможно: «молитва моя возвращалась без ответа», «её благо возвращалось ко мне» или «я молился так, словно молился о себе».'
