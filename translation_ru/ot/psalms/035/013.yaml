lexical_decisions:
- source_word: בַּחֲלוֹתָם
  choice: когда они болели
  rationale: 'Предлог ב с инфинитивной формой и суффиксом 3-го лица множественного числа передаёт обстоятельство времени: «когда они болели». Такое выражение естественно в современном русском языке.'
- source_word: לְבוּשִׁי שָׂק
  choice: носил вретище
  rationale: 'Буквально: «одеждой моей было вретище». Русское «носил вретище» естественно передаёт состояние траура и скорби, не добавляя мотива, которого нет в исходном тексте.'
- source_word: עִנֵּיתִי בַצּוֹם נַפְשִׁי
  choice: постом смирял себя
  rationale: Буквально говорится о смирении или изнурении своей души постом. Возвратное «смирял себя» ясно передаёт еврейскую идиому самоумаления и воздержания.
- source_word: עַל חֵיקִי תָשׁוּב
  choice: возвращалась ко мне на грудь
  rationale: Сохранены и глагол «возвращаться», и телесный образ חֵיק — груди, лона или складки одежды у груди. Необычность формулировки отражает неоднозначность еврейской идиомы, не закрепляя одно толкование.
theological_decisions:
- issue: Смысл выражения «молитва моя возвращалась ко мне на грудь»
  choice: В основном тексте сохранён еврейский образ возвращающейся к молящемуся молитвы.
  alternative: «молитва моя возвращалась без ответа»; «молитва моя обращалась мне во благо»; «я молился так, словно молился о себе»
  rationale: 'Еврейское выражение допускает несколько пониманий: молитва могла остаться без желаемого ответа, её благо могло возвратиться к молящемуся либо речь могла идти об особенно личном характере ходатайства. Контекст не позволяет уверенно выбрать одно из них.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Слово «вретище» сохранено как точный и укоренённый культурный термин и пояснено в сноске. Необычный образ молитвы, возвращающейся на грудь, намеренно сохранён ради подлинной неоднозначности исходного текста.
