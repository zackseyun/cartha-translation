  text: А я угнетён, и мне больно; Боже, пусть Твоё спасение поднимет меня на недосягаемую высоту[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоё спасение, Боже, поднимет меня на недосягаемую высоту». Еврейскую глагольную форму можно понимать не только как молитвенную просьбу, но и как утверждение о будущем.'
    reason: alternative_reading
  - marker: b
    text: 'Буквальный образ — оказаться высоко, вне досягаемости опасности; по смыслу также: «защитит меня» или «укроет меня в безопасности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Сочетание союза с местоимением подчёркивает противопоставление предыдущему контексту; краткое «А я» естественно передаёт этот контраст по-русски.
- source_word: עָנִי
  choice: угнетён
  rationale: В псалмах слово может означать не только материальную бедность, но и униженное, тяжёлое положение. В сочетании с «страдаю» контексту лучше соответствует значение «угнетён».
- source_word: וְכוֹאֵב
  choice: и страдаю
  rationale: Причастная форма от כאב описывает продолжающееся состояние боли или страдания. Русское «страдаю» естественно и не уточняет без основания, физическая это боль или душевная.
- source_word: יְשׁוּעָתְךָ
  choice: Твоё спасение
  rationale: «Спасение» сохраняет широту ישועה, включающую избавление, помощь и возвращение в безопасность.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения ясно и естественно передаёт прямое обращение псалмопевца к Богу.
- source_word: תְּשַׂגְּבֵנִי
  choice: пусть ... поднимет меня на недосягаемую высоту
  rationale: Глагол שׂגב в породе пиэль изображает помещение человека высоко, вне досягаемости опасности. Перевод сохраняет пространственную метафору и одновременно даёт понять её защитный смысл.
theological_decisions:
- issue: Модальное значение имперфекта תְּשַׂגְּבֵנִי
  choice: 'Просьба: «пусть Твоё спасение поднимет меня»'
  alternative: 'Уверенное утверждение о будущем: «Твоё спасение поднимет меня»'
  rationale: В контексте плача и молитвенного обращения форма естественно воспринимается как просьба, однако еврейский имперфект допускает и чтение как утверждение о будущем; эта неоднозначность отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с молитвенно-поэтическим достоинством. Синтаксис сделан естественным для русского: обращение «Боже» поставлено перед просьбой. Пространственная метафора оригинала сохранена, а её защитный смысл пояснён в сноске.'
