  text: שְׁפָךְ עֲלֵי/הֶ֥ם זַעְמֶ֑/ךָ וַ/חֲר֥וֹן אַ֝פְּ/ךָ֗ יַשִּׂיגֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/024.yaml
  text: Pour out your indignation on them[b][a], and let your burning anger overtake them.
translation:
  language: ru
  text: Излей на них Своё негодование[a], и пусть пылающий гнев Твой[b] настигнет их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ярость».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «жар Твоего носа» — еврейское образное выражение, означающее сильный гнев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפָךְ
  choice: Излей
  rationale: Повелительная форма глагола שׁפך сохраняет яркий образ излияния Божьего негодования и естественно звучит по-русски.
- source_word: עֲלֵיהֶם
  choice: на них
  rationale: Предлог עַל с местоименным суффиксом указывает на тех, против кого направлено негодование; «на них» — точное и естественное соответствие.
- source_word: זַעְמֶךָ
  choice: Своё негодование
  rationale: זַעַם обозначает сильный, нередко судебный гнев. «Негодование» передаёт нравственную окраску и не сливает это слово со следующим выражением о гневе.
- source_word: וַחֲרוֹן אַפְּךָ
  choice: и пусть пылающий гнев Твой
  rationale: Устойчивое еврейское выражение буквально связано с жаром или пыланием носа и означает сильный гнев. «Пылающий гнев» сохраняет образ жара и остаётся понятным современному читателю.
- source_word: יַשִּׂיגֵם
  choice: настигнет их
  rationale: Форма от נשׂג означает достигнуть, догнать или настичь. «Настигнет» передаёт образ гнева, догоняющего тех, на кого он направлен.
theological_decisions:
- issue: Просьба о Божьем суде над врагами
  choice: Сохранена прямая просьба излить Божье негодование и дать Его гневу настичь врагов.
  alternative: Смягчить до просьбы лишь показать недовольство.
  rationale: Еврейский текст выражает недвусмысленную молитву о Божьем суде. Смягчение устранило бы присущую псалму богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией; сила проклятийной просьбы не смягчена.
