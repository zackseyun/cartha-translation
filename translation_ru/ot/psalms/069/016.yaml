  text: עֲנֵ֣/נִי יְ֭הוָה כִּי ט֣וֹב חַסְדֶּ֑/ךָ כְּ/רֹ֥ב רַ֝חֲמֶ֗י/ךָ פְּנֵ֣ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/016.yaml
  text: Answer me[a], O Yahweh, for your steadfast love is good; according to your abundant mercies, turn to me.
translation:
  language: ru
  text: Ответь мне, Яхве, ибо блага Твоя неизменная любовь; по множеству милостей Твоих обратись ко мне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲנֵנִי
  choice: Ответь мне
  rationale: Императив ענה в молитвенном контексте выражает просьбу к Богу откликнуться; «Ответь мне» естественно и точно передаёт эту мольбу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание просьбы; «ибо» сохраняет краткую причинную связь и соответствует возвышенному, но понятному молитвенному регистру.
- source_word: טוֹב
  choice: блага
  rationale: Предикативное прилагательное характеризует חֶסֶד как благую; форма женского рода согласована с русским словом «любовь».
- source_word: חַסְדֶּךָ
  choice: Твоя неизменная любовь
  rationale: חֶסֶד включает любовь, верность и постоянство. «Неизменная любовь» передаёт эти оттенки без узкоконфессионального истолкования.
- source_word: כְּרֹב
  choice: по множеству
  rationale: 'Сочетание כְּ с רֹב выражает меру или основание: «сообразно множеству»; «по множеству» сохраняет структуру и естественно звучит по-русски.'
- source_word: רַחֲמֶיךָ
  choice: милостей Твоих
  rationale: Множественное число сохраняет грамматическую форму оригинала и обозначает многочисленные проявления сострадания и милосердия.
- source_word: פְּנֵה אֵלָי
  choice: обратись ко мне
  rationale: Императив פנה с אֶל означает повернуться или обратиться к кому-либо; «обратись ко мне» естественно передаёт направленность и личный характер просьбы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале употреблено собственное имя Бога, а не титул; транслитерация сохраняет это различие.
- issue: Смысл חֶסֶד
  choice: неизменная любовь
  alternative: милость
  rationale: Выбранный вариант сохраняет одновременно смысл любви и её верной, постоянной природы, не сводя многозначный термин только к милосердию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции. Параллелизм двух просьб и двух оснований сохранён.
