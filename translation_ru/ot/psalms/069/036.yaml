  text: וְ/זֶ֣רַע עֲ֭בָדָי/ו יִנְחָל֑וּ/הָ וְ/אֹהֲבֵ֥י שְׁ֝מ֗/וֹ יִשְׁכְּנוּ בָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/036.yaml
  text: The offspring of his servants will inherit it[b][a], and those who love his name will dwell in it.
translation:
  language: ru
  text: И потомки его слуг унаследуют её[a], и любящие его имя будут жить в ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимения «её» и «ней» относятся к Сиону в предшествующем контексте; возможно также, что имеется в виду восстановленный город, Иерусалим или земля.
    reason: cross_reference
lexical_decisions:
- source_word: זֶרַע
  choice: потомки
  rationale: Существительное זֶרַע буквально означает «семя», но здесь собирательно обозначает потомство. «Потомки» естественно и ясно передаёт этот смысл в современном русском языке.
- source_word: עֲבָדָיו
  choice: его слуг
  rationale: В псалме עֶבֶד обозначает людей, служащих Богу. «Слуги» сохраняет отношения служения и принадлежности, не выдвигая на первый план социальный институт рабства.
- source_word: יִנְחָלוּהָ
  choice: унаследуют его
  rationale: Глагол נחל выражает получение во владение как наследства. Будущее «унаследуют» сохраняет этот оттенок; местоимение мужского рода согласовано с ближайшим контекстуальным референтом «Сион».
- source_word: אֹהֲבֵי שְׁמוֹ
  choice: любящие его имя
  rationale: Передана буквальная библейская формула любви к Божьему имени без сведения её к более общему «любящие его».
- source_word: יִשְׁכְּנוּ בָהּ
  choice: будут жить в нём
  rationale: שׁכן означает жить, обитать, селиться. «Будут жить» понятно современному читателю и естественно в данном контексте; местоимение отсылает к Сиону.
theological_decisions:
- issue: Референт суффиксов женского рода в יִנְחָלוּהָ и בָהּ
  choice: Сион, упомянутый в непосредственном контексте; в русском тексте — «его / в нём» по грамматическому роду слова «Сион».
  alternative: В более широком понимании — восстановленный город, Иерусалим или земля.
  rationale: Предыдущий стих говорит о спасении Сиона и восстановлении городов Иудеи. Формы женского рода в еврейском естественно отсылают к צִיּוֹן или подразумеваемому городу/земле; русский грамматический род требует мужского местоимения при референте «Сион». Сноска сохраняет более широкий диапазон возможных отсылок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Параллелизм двух частей стиха сохранён; «любящие его имя» оставлено как значимый библейский образ.
