source:
  edition: WLC
  text: יָגַ֣עְתִּי בְ/קָרְאִ/י֮ נִחַ֪ר גְּר֫וֹנִ֥/י כָּל֥וּ עֵינַ֑/י מְ֝יַחֵ֗ל לֵ/אלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/003.yaml
  text: I am weary from my crying[a]; my throat is parched[b]; my eyes fail while I wait for my God.
translation:
  language: ru
  text: Я изнемог, взывая; горло моё пересохло[a], глаза мои истомились в ожидании моего Бога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «горло моё охрипло». Еврейское слово буквально указывает на сухость, жар или воспаление от долгого взывания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «надеясь на моего Бога». Еврейский глагол может означать как ожидание, так и исполненное надежды упование.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגַעְתִּי
  choice: Я изнемог
  rationale: Форма выражает наступившее вследствие длительного действия изнеможение; совершенный вид естественно передаёт достигнутое состояние.
- source_word: בְקָרְאִי
  choice: взывая
  rationale: קרא здесь означает неоднократно звать на помощь; деепричастная конструкция сохраняет обстоятельственно-причинную связь с изнеможением.
- source_word: נִחַר
  choice: пересохло
  rationale: Глагол передаёт сухость, жар или воспаление. «Пересохло» сохраняет телесный образ и естественно сочетается со словом «горло».
- source_word: גְּרוֹנִי
  choice: горло моё
  rationale: Прямое и естественное соответствие анатомическому образу גרון.
- source_word: כָּלוּ עֵינַי
  choice: глаза мои истомились
  rationale: כלה означает иссякать, подходить к концу, изнемогать. Русское «истомились» передаёт длительное напряжённое ожидание, не сводя образ только к ослаблению зрения.
- source_word: מְיַחֵל
  choice: в ожидании
  rationale: יחל совмещает значения ожидания и надежды. Основной текст подчёркивает продолжительность ожидания, а примечание сохраняет оттенок надежды.
- source_word: לֵאלֹהָי
  choice: моего Бога
  rationale: Личный суффикс сохранён, а зависимость от «в ожидании» естественно передаёт направленность ожидания к Богу.
theological_decisions:
- issue: 'Смысл יחל: ожидать или надеяться'
  choice: в ожидании моего Бога
  alternative: надеясь на моего Бога
  rationale: Еврейский глагол допускает оба взаимосвязанных оттенка. В основном тексте сохранена временная сторона длительного ожидания, а надежда отмечена как подлинная лексическая альтернатива.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической жалобы. Синтаксис краток и ритмичен; телесные образы оригинала сохранены. Лексическая неоднозначность נחר и יחל вынесена в примечания без конфессионального истолкования.
