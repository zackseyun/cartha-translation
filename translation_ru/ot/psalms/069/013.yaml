base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/013.yaml
  text: But as for me[a], my prayer is to you, O Yahweh, at a time of favor; O God, in the abundance of your steadfast love[b], answer me in the truth of your salvation.
translation:
  language: ru
  text: А моя молитва — к Тебе, Яхве, во время благоволения[a]. Боже, в обилии Твоей милости ответь мне в истине Твоего спасения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в благоприятное время». Еврейское выражение обозначает благоприятное время, когда Бог слышит и действует.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в верности Твоего спасения». Еврейское אֱמֶת может означать «истина», «верность» или «надёжность».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Союз и самостоятельное местоимение выражают контраст и подчёркивают говорящего; «А я» естественно передаёт это в современном русском.
- source_word: תְפִלָּתִי לְךָ
  choice: с молитвой к Тебе
  rationale: Буквально конструкция означает «моя молитва — к Тебе». Русская предложная формулировка сохраняет направленность молитвы и избегает тяжеловесности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: עֵת רָצוֹן
  choice: во время благоволения
  rationale: Сочетание обозначает благоприятное, угодное Богу время, когда Он слышит и действует.
- source_word: בְּרָב חַסְדֶּךָ
  choice: по великой милости Твоей
  rationale: חסד включает милость, неизменную любовь и верность отношениям; «милость» естественна в русской молитвенной речи, а «по» передаёт основание просьбы.
- source_word: עֲנֵנִי
  choice: ответь мне
  rationale: Прямое значение императива в контексте молитвы.
- source_word: בֶּאֱמֶת יִשְׁעֶךָ
  choice: в верности спасения Твоего
  rationale: אמת может означать истину, верность и надёжность. В данном обращении выражение естественно указывает на надёжность Божьего спасительного действия, не исключая смысла истины.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Значение אֱמֶת в сочетании с «спасением»
  choice: верность
  alternative: истина
  rationale: Контекст допускает как «истину», так и «верность/надёжность». В основном тексте выбрана более естественная по-русски «верность», а подлинная лексическая неоднозначность отмечена в сноске.
- issue: Значение חסד
  choice: милость
  alternative: неизменная любовь; верная любовь
  rationale: Термин сочетает милость, преданную любовь и постоянство. «Милость» уместна в просьбе о Божьем ответе, хотя не исчерпывает всего диапазона слова.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Заглавные буквы в местоимениях обращения к Богу поддерживают традиционный русский библейский регистр, не вводя дополнительного толкования.
