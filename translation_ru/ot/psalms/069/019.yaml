  text: Ты знаешь моё поругание, мой стыд и моё унижение; все мои враги — пред Тобой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: Ты знаешь
  rationale: Перфект qal, обращённый к Богу, здесь естественно передаёт устойчивое знание и полную осведомлённость; настоящее время сохраняет этот смысл в современном русском.
- source_word: חֶרְפָּתִי
  choice: моё поругание
  rationale: Слово обозначает поношение, насмешку и связанное с ними бесчестье. «Поругание» сохраняет социальный характер оскорбления и достойный поэтический регистр.
- source_word: בָשְׁתִּי
  choice: мой стыд
  rationale: Прямое и естественное соответствие существительному со значением стыда и бесчестья.
- source_word: כְלִמָּתִי
  choice: моё унижение
  rationale: Передаёт усиленный оттенок публичного посрамления и позволяет сохранить накопление трёх близких, но не тождественных понятий.
- source_word: נֶגְדְּךָ
  choice: пред Тобой
  rationale: Кратко и естественно передаёт нахождение перед лицом Бога, то есть в Его поле зрения и присутствии.
- source_word: כָּל
  choice: все
  rationale: Передаёт всеохватность еврейского определителя при существительном во множественном числе.
- source_word: צוֹרְרָי
  choice: мои враги
  rationale: Слово от צרר обозначает враждебных противников. «Враги» ясно, естественно и без излишней книжности передаёт активную враждебность.
