source:
  edition: WLC
  text: אַל תִּשְׁטְפֵ֤/נִי שִׁבֹּ֣לֶת מַ֭יִם וְ/אַל תִּבְלָעֵ֣/נִי מְצוּלָ֑ה וְ/אַל תֶּאְטַר עָלַ֖/י בְּאֵ֣ר פִּֽי/הָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/015.yaml
  text: Do not let the flood of waters sweep me away[a], and do not let the deep swallow me up[b], and do not let the pit close its mouth over me.
translation:
  language: ru
  text: Пусть водный поток не унесёт меня[a], пусть пучина не поглотит меня, и пусть яма[b] не сомкнёт надо мной свою пасть.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бурный поток вод».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «колодец»; здесь в поэтическом параллелизме имеется в виду угрожающая глубокая яма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁטְפֵנִי
  choice: не унесёт меня
  rationale: Глагол שטף описывает захлёстывающий, увлекающий напор воды; «не унесёт меня» естественно передаёт смертельную силу потока.
- source_word: שִׁבֹּלֶת מַיִם
  choice: водный поток
  rationale: שִׁבֹּלֶת здесь обозначает течение или бурный поток; сочетание «водный поток» сохраняет образ движущейся массы воды без излишнего уточнения.
- source_word: תִּבְלָעֵנִי
  choice: не поглотит меня
  rationale: בלע буквально означает «глотать»; «поглотит» естественно передаёт полное исчезновение в глубине.
- source_word: מְצוּלָה
  choice: пучина
  rationale: Слово обозначает водную глубину; «пучина» кратко и поэтично сохраняет угрожающий образ.
- source_word: תֶּאְטַר
  choice: не сомкнёт
  rationale: Глагол выражает закрывание или запирание; «сомкнёт» хорошо сочетается с олицетворённой пастью ямы.
- source_word: בְּאֵר
  choice: яма
  rationale: Обычное значение — «колодец», однако в данном параллелизме это углубление, способное навсегда заключить человека; «яма» яснее передаёт смертельную угрозу, а буквальная возможность отмечена в сноске.
- source_word: פִּיהָ
  choice: свою пасть
  rationale: Буквально «свои уста/свой рот»; «пасть» сохраняет олицетворение отверстия ямы как чего-то пожирающего.
- source_word: עָלַי
  choice: надо мной
  rationale: Предлог указывает на закрытие отверстия сверху над говорящим.
theological_decisions:
- issue: Образ בְּאֵר как колодца или смертельной ямы
  choice: яма
  alternative: колодец
  rationale: Контекст водной гибели и поглощения поддерживает образ смертельной ямы, но лексическая неоднозначность сохраняется в сноске, без отождествления ямы с каким-либо богословски определённым местом.
translation_notes:
  register: Современный литературный русский язык с поэтическим параллелизмом. Повтор «пусть… не» передаёт тройное древнееврейское אַל; слова «пучина», «сомкнёт» и образ «пасти» сохраняют достоинство и напряжённость оригинала.
