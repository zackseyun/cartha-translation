lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение причины отчуждения псалмопевца; «ибо» естественно связывает стих с предшествующим контекстом.
- source_word: עָלֶיךָ
  choice: ради Тебя
  rationale: Предлог עַל здесь указывает на основание или причину страдания. «Ради Тебя» сохраняет личную направленность выражения; возможный причинный оттенок отмечен в сноске.
- source_word: נָשָׂאתִי
  choice: я терплю
  rationale: В сочетании с חֶרְפָּה глагол означает нести, переносить поношение. Настоящее время по-русски естественно передаёт продолжающееся и актуальное страдание.
- source_word: חֶרְפָּה
  choice: поношение
  rationale: Слово обозначает оскорбление, поругание и связанный с ними общественный стыд; «поношение» сохраняет эту многозначность и уместно в поэтическом регистре.
- source_word: כִּסְּתָה
  choice: покрыл
  rationale: Глагол буквально означает «покрывать». В русском сказуемое согласовано с выбранным существительным мужского рода «позор», при сохранении исходного образа.
- source_word: כְלִמָּה
  choice: позор
  rationale: Слово передаёт стыд, бесчестье и унижение. «Позор» хорошо сохраняет общественный аспект и лексически отличается от «поношения».
- source_word: פָנַי
  choice: моё лицо
  rationale: В образе покрытого позором лица имеется в виду лицо как видимое выражение унижения; буквальный образ сохранён.
