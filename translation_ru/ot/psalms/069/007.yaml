review_pass:
  verdict: revise
  source_fidelity: עָלֶיךָ expresses the grounds/account of the reproach; «ради Тебя» is possible but can suggest purpose or voluntary action. More importantly, נָשָׂאתִי is a perfect and should not be recast without necessity as the present «терплю». «Понёс» preserves the completed-yet-relevant bearing of reproach. The second colon accurately retains the concrete image and its feminine Hebrew subject, «стыд».
  naturalness: The revised wording is natural modern literary Russian while retaining an appropriately elevated psalmic register. «Ибо» works as a contextual connective; «из-за Тебя» clearly marks the causal/account sense, though it is less elevated than «ради Тебя».
  terminology: «Поношение» is a fitting equivalent for חֶרְפָּה. «Стыд» is the direct, idiomatic equivalent of כְלִמָּה and avoids making both Hebrew terms denote public disgrace in the same way. «Лицо» correctly preserves פָנַי.
  issues:
  - severity: medium
    issue: Tense/aspect of נָשָׂאתִי
    rationale: The draft’s present-tense «я терплю» interprets the Hebrew perfect as ongoing action. The source more directly says «я понёс / я нёс», and the English audit likewise has «I have borne». A Russian perfective past best preserves the stated action and its present relevance.
  - severity: low
    issue: Nuance of עָלֶיךָ
    rationale: «Ради Тебя» is a viable traditional rendering, but it can imply purpose or benefaction. «Из-за Тебя» more explicitly conveys the causal/account sense identified by the source and audit trail.
  revised_text: Ибо из-за Тебя я понёс поношение[a]; стыд покрыл моё лицо[b].
