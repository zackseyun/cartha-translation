base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/023.yaml
  text: Let their eyes be darkened from seeing[b][a], and make their loins shake continually.
translation:
  language: ru
  text: Да померкнут их глаза, чтобы они не видели,[a] и сделай так, чтобы их чресла непрестанно подгибались.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от видения».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сделай так, чтобы их чресла непрестанно пошатывались».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּחְשַׁכְנָה
  choice: Да померкнут
  rationale: Форма глагола в контексте проклятия-молитвы выражает пожелание; «да померкнут» сохраняет этот оттенок и возвышенный поэтический строй.
- source_word: עֵינֵיהֶם
  choice: их глаза
  rationale: Прямой перевод сохраняет телесный образ еврейского текста.
- source_word: מֵרְאוֹת
  choice: чтобы они не видели
  rationale: Буквально конструкция означает «от видения», но после глагола «померкнуть» по-русски естественнее передать значение лишения способности видеть целевым оборотом.
- source_word: וּמָתְנֵיהֶם
  choice: и их чресла
  rationale: מָתְנַיִם обозначает область поясницы и бёдер. «Чресла» точно сохраняет библейский телесный образ и соответствует торжественному регистру псалма.
- source_word: תָּמִיד
  choice: непрестанно
  rationale: Передаёт длительное, не прекращающееся состояние и органично звучит в поэзии.
- source_word: הַמְעַד
  choice: заставь ... дрожать
  rationale: Побудительная порода и повелительная форма требуют сохранить обращённый к Богу призыв вызвать телесную неустойчивость; «дрожать» естественно передаёт этот образ по-русски.
theological_decisions:
- issue: Сила проклятия-молитвы
  choice: 'Передать как молитвенное пожелание суда: «Да померкнут… и заставь…»'
  alternative: 'Передать как предсказание будущего: «Их глаза померкнут…»'
  rationale: В контексте псалма глагольные формы служат обращённой к Богу просьбой о суде, а не нейтральным предсказанием.
- issue: Адресат второй части
  choice: 'Сохранить прямое повелительное обращение: «заставь»'
  alternative: 'Согласовать с первой частью как безличное пожелание: «пусть их чресла дрожат»'
  rationale: Еврейская форма הַמְעַד имеет каузативное значение и непосредственно обращена к одному адресату, которым в контексте является Бог.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим строем. Слово «чресла» несколько возвышенно, но сохраняет точный библейский телесный образ; синтаксис остаётся понятным современному читателю.
