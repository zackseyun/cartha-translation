  text: אַל יֵ֘בֹ֤שׁוּ בִ֨/י קֹוֶי/ךָ֮ אֲדֹנָ֥/י יְהוִ֗ה צְבָ֫א֥וֹת אַל יִכָּ֣לְמוּ בִ֣/י מְבַקְשֶׁ֑י/ךָ אֱ֝לֹהֵ֗י יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/006.yaml
  text: Let not those who hope in you be put to shame because of me[a], Lord Yahweh of hosts; let not those who seek you be humiliated because of me[b], God of Israel.
translation:
  language: ru
  text: Да не постыдятся из-за меня надеющиеся на Тебя[a], Владыка, Яхве Воинств; да не будут унижены из-за меня ищущие Тебя, Бог Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ожидающие Тебя»; еврейское причастие выражает ожидание, исполненное надежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: да не постыдятся
  rationale: Глагол בוש в qal обозначает пережить стыд или посрамление; русская возвратная форма естественно передаёт это значение в молитвенном пожелании.
- source_word: בִי
  choice: из-за меня
  rationale: 'Предлог ב с местоименным суффиксом здесь имеет причинное значение: псалмопевец боится стать поводом для позора других.'
- source_word: קֹוֶיךָ
  choice: надеющиеся на Тебя
  rationale: Причастие קוה совмещает ожидание и исполненную надежды устремлённость; «надеющиеся» естественно передаёт доверительное ожидание.
- source_word: אֲדֹנָי יְהוָה צְבָאוֹת
  choice: Владыка Яхве Сил
  rationale: «Владыка» различает אֲדֹנָי и личное имя יְהוָה, переданное как «Яхве»; «Сил» сохраняет образ небесных воинств без подмены титулом «Всемогущий».
- source_word: יִכָּלְמוּ
  choice: да не будут унижены
  rationale: כלם выражает позор и унижение; отдельная передача сохраняет лексическое отличие от параллельного בוש.
- source_word: מְבַקְשֶׁיךָ
  choice: ищущие Тебя
  rationale: Причастие בקש обозначает продолжающееся, деятельное искание Бога.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Точно передаёт конструкцию принадлежности и её обращённый к Богу характер.
theological_decisions:
- issue: Передача имени יְהוָה в сочетании אֲדֹנָי יְהוָה
  choice: Владыка Яхве
  alternative: Господь Бог; Господь ГОСПОДЬ
  rationale: Форма «Яхве» прямо представляет личное имя в еврейском тексте, а «Владыка» позволяет не смешивать его с предшествующим אֲדֹנָי.
- issue: Значение צְבָאוֹת в божественном титуле
  choice: Сил
  alternative: воинств; Всемогущий
  rationale: «Сил» — понятная и достоинственная русская форма традиционного титула, сохраняющая множественный образ организованных небесных сил; «Всемогущий» был бы толкованием.
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью. Сохранён параллелизм двух просьб и различие между глаголами «постыдиться» и «быть униженным». Местоимения обращения к Богу написаны с прописной буквы по принятой русской благоговейной норме.
