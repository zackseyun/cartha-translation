lexical_decisions:
- source_word: הוֹשִׁיעֵנִי
  choice: Спаси меня
  rationale: Побудительная форма породы хифиль от ישׁע с суффиксом первого лица единственного числа выражает прямую мольбу об избавлении. «Спаси меня» естественно для русской молитвенной речи и передаёт непосредственную угрозу.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Слово употреблено как обращение; русский звательный эквивалент «Боже» естественно и ясно передаёт эту функцию.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание мольбы. «Потому что» прозрачно передаёт причинную связь в современном русском языке.
- source_word: בָאוּ
  choice: дошли
  rationale: Глагол «пришли/достигли» вместе с пределом, обозначенным עַד, естественно передаётся русским «дошли»; это сохраняет образ наступающей воды без лишнего уточнения.
- source_word: מַיִם
  choice: воды
  rationale: Множественная форма «воды» сохраняет поэтическую образность еврейского текста и не добавляет отсутствующего в оригинале уточнения «паводковые».
- source_word: עַד נָפֶשׁ
  choice: до горла
  rationale: В образе утопления נֶפֶשׁ может указывать на горло — место дыхания и предел, за которым гибнет жизнь. «До горла» ясно передаёт непосредственную опасность, а буквальная многозначность отмечена в сноске.
theological_decisions:
- issue: Передача נֶפֶשׁ в поэтическом образе смертельной опасности
  choice: Конкретное телесное значение «горло» в основном тексте
  alternative: 'Более буквально: «до души»; экзистенциально: «до самой жизни»'
  rationale: 'Здесь речь не обязательно идёт об антропологическом учении о душе: контекст создаёт образ человека, которого почти поглотила вода. Перевод «до горла» передаёт этот образ, тогда как сноска сохраняет буквальную форму и семантическую широту слова נֶפֶשׁ.'
translation_notes:
  register: Современный литературный русский язык с краткой, настойчивой молитвенной интонацией. Обращение «Боже» сохраняет достоинство псалма, а выражение «воды дошли мне до горла» остаётся понятным и образным для обычного читателя.
