  text: תְּֽנָ/ה עָ֭וֺן עַל עֲוֺנָ֑/ם וְ/אַל יָ֝בֹ֗אוּ בְּ/צִדְקָתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/027.yaml
  text: Add iniquity to their iniquity[b][a], and do not let them come into your righteousness.
translation:
  language: ru
  text: Прибавь вину к их вине[a], и пусть они не войдут в Твою праведность[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беззаконие к их беззаконию». Еврейское слово может означать беззаконие, вину или последствие вины.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Твою справедливость». Здесь Божья праведность может подразумевать Его справедливое или оправдывающее действие.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּנָה
  choice: Прибавь
  rationale: Императив от נתן буквально означает «дай, положи»; в сочетании עָוֺן עַל עֲוֺנָם естественно передаёт присоединение одной вины к другой.
- source_word: עָוֺן ... עֲוֺנָם
  choice: вину ... к их вине
  rationale: עָוֺן может обозначать беззаконие, вину или последствие вины. «Вину к их вине» сохраняет повтор одного слова и не сводит значение ни исключительно к поступку, ни к наказанию.
- source_word: עַל
  choice: к
  rationale: Хотя основное пространственное значение — «на, поверх», русский оборот «прибавить X к Y» естественно передаёт суммирующий смысл конструкции.
- source_word: וְאַל יָבֹאוּ
  choice: и пусть они не войдут
  rationale: Сочетание אַל с имперфектом выражает отрицательное пожелание; форма «пусть не войдут» сохраняет молитвенно-пожелательный характер обращения к Богу.
- source_word: בְּצִדְקָתֶךָ
  choice: в Твою праведность
  rationale: Сохраняется широкое значение צְדָקָה — «праведность», которое здесь может включать Божью справедливость и оправдывающее либо избавляющее действие.
theological_decisions:
- issue: Значение выражения «Твоя праведность» в контексте молитвы о суде
  choice: Сохранить «Твою праведность» без уточнения характера доступа к ней
  alternative: «Твою справедливость»; «оправдание перед Тобой»; «Твоё спасительное оправдание»
  rationale: Еврейское выражение допускает смысл Божьей праведности, справедливого действия или оправдания. Основной текст не должен устранять эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-поэтической речи. Прописная буква в местоимении «Твою» отражает принятую русскую библейскую традицию; синтаксис остаётся ясным для обычного читателя.
