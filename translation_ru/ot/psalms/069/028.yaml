  text: יִ֭מָּחֽוּ מִ/סֵּ֣פֶר חַיִּ֑ים וְ/עִ֥ם צַ֝דִּיקִ֗ים אַל יִכָּתֵֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/028.yaml
  text: Let them be blotted out of the book of life[b][a], and let them not be written with the righteous.
translation:
  language: ru
  text: Пусть они будут вычеркнуты из книги жизни[a] и не будут записаны вместе с праведниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из книги живых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּחוּ
  choice: пусть они будут вычеркнуты
  rationale: Нифаль имперфекта в данном ряду проклятий имеет желательное значение. «Будут вычеркнуты» естественно передаёт пассивное удаление и поддерживает образ книги и записи.
- source_word: מִסֵּפֶר
  choice: из книги
  rationale: Слово סֵפֶר обозначает письменный документ, свиток или книгу; в данном устойчивом образе современное «книга» звучит наиболее естественно.
- source_word: חַיִּים
  choice: жизни
  rationale: Множественная форма может обозначать как жизнь, так и живых. Основной перевод сохраняет известное и богословски открытое выражение «книга жизни», а иной смысл отмечен в сноске.
- source_word: וְעִם
  choice: и … вместе с
  rationale: Предлог עִם означает «с»; выражение «вместе с праведниками» естественно передаёт включение в одну запись или число.
- source_word: צַדִּיקִים
  choice: праведниками
  rationale: Стандартная передача субстантивированного множественного прилагательного, сохраняющая нравственно-религиозную категорию исходного текста.
- source_word: אַל יִכָּתֵבוּ
  choice: не будут записаны
  rationale: אַל с нифалем имперфекта выражает отрицательное пожелание. «Не будут записаны» сохраняет пассивное значение כתב и образ письменного перечня.
theological_decisions:
- issue: Значение выражения «книга жизни»
  choice: Сохранить метафору «книга жизни», не уточняя её богословский смысл.
  alternative: «Книга живых», то есть перечень ныне живущих.
  rationale: Само выражение допускает понимание как перечня живых, так и божественной книги, связанной со спасением; контекст стиха не требует устранять эту напряжённость.
- issue: Сила проклятия-прошения
  choice: 'Передать формы как пожелание: «Пусть… не будут…».'
  alternative: 'Передать их как предсказание: «Они будут вычеркнуты…».'
  rationale: В контексте последовательности проклятий глагольные формы имеют юссивную силу, а не просто сообщают о будущем.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Вычеркнуты» понятно современному читателю и последовательно поддерживает образ книги и записи; синтаксис сохраняет параллелизм еврейского стиха.
