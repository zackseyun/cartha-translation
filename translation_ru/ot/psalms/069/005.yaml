source:
  edition: WLC
  text: אֱֽלֹהִ֗ים אַתָּ֣ה יָ֭דַעְתָּ לְ/אִוַּלְתִּ֑/י וְ֝/אַשְׁמוֹתַ֗/י מִמְּ/ךָ֥ לֹא נִכְחָֽדוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/005.yaml
  text: God[a], you know my foolishness[b], and my guilt is not hidden from you.
translation:
  language: ru
  text: Боже, Ты знаешь моё безрассудство, и мои проступки от Тебя не скрыты.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и моя вина от Тебя не скрыта». Еврейское слово стоит во множественном числе и может обозначать конкретные провинности либо совокупную вину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Существительное употреблено как прямое обращение; русский звательный оттенок естественно передаётся формой «Боже».
- source_word: אַתָּה
  choice: Ты
  rationale: Явно выраженное местоимение подчёркивает адресата; в русском оно сохранено.
- source_word: יָדַעְתָּ
  choice: знаешь
  rationale: Перфект глагола ידע здесь обозначает наличное, полное знание; настоящее время естественно передаёт это состояние.
- source_word: לְאִוַּלְתִּי
  choice: моё безрассудство
  rationale: אִוֶּלֶת означает нравственно предосудительную глупость или безрассудство, а не только недостаток ума; «безрассудство» ясно и достойно звучит в современном русском.
- source_word: וְאַשְׁמוֹתַי
  choice: мои проступки
  rationale: Форма множественного числа указывает на конкретные провинности или виновные деяния. «Проступки» сохраняет множественность и параллелизм, не вводя неуместного здесь значения жертв за вину.
- source_word: מִמְּךָ
  choice: от Тебя
  rationale: Предлог מן с суффиксом буквально означает «от Тебя» и в сочетании с глаголом сокрытия выражает невозможность скрыть что-либо от Божьего знания.
- source_word: לֹא נִכְחָדוּ
  choice: не скрыты
  rationale: 'Nifal, перфект, множественное число: проступки не остались сокрытыми; именная конструкция «не скрыты» естественна и согласуется с множественным подлежащим.'
theological_decisions:
- issue: Признание говорящим своей вины в псалме, позднее получившем мессианское применение
  choice: Сохранить прямое признание говорящего в собственном безрассудстве и проступках.
  alternative: Истолковать признание только как корпоративное или представительское и отразить это в переводе.
  rationale: Еврейский текст недвусмысленно использует формы первого лица. Перевод не должен устранять богословское напряжение посредством привнесённого толкования.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической сдержанностью. Формы «Ты/Тебя» написаны с прописной буквы как принятая русская форма почтительного обращения к Богу; архаизмы и конфессионально окрашенная терминология избегаются.
