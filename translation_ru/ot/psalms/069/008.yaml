base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/008.yaml
  text: I have become a stranger to my brothers[b][a], and a foreigner to my mother's sons.
translation:
  language: ru
  text: 'Чужим стал я для братьев моих[a],

    посторонним — для сыновей моей матери[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Чужим был я для братьев моих». Еврейский глагол может обозначать как состояние в прошлом, так и переход в это состояние.'
    reason: lexical_alternative
  - marker: b
    text: «Сыновья моей матери» — поэтическое обозначение ближайших кровных родственников, прежде всего родных братьев.
    reason: cultural_note
lexical_decisions:
- source_word: מוּזָר
  choice: чужим
  rationale: 'Причастно-прилагательная форма передаёт состояние отчуждённости: псалмопевец стал своим братьям словно чужой. «Чужим» естественно звучит по-русски и сохраняет связь с параллельным «посторонним».'
- source_word: הָיִיתִי
  choice: стал я
  rationale: Форма qatal глагола היה допускает значение состояния («был») и вхождения в него («стал»). В плаче естественно передать возникшее и сохраняющееся отчуждение словом «стал», отметив альтернативу в сноске.
- source_word: לְאֶחָי
  choice: для братьев моих
  rationale: 'Сохранено буквальное мужское обозначение родства и дательный оттенок отношения: он стал чужим для своих братьев. Постпозиция местоимения поддерживает достоинство и поэтичность регистра.'
- source_word: וְנָכְרִי
  choice: посторонним
  rationale: נָכְרִי обозначает чужака, человека не из своей среды. «Посторонним» ясно передаёт усиление отчуждения и не создаёт лишней ассоциации с гражданством, возможной у слова «иностранец».
- source_word: לִבְנֵי אִמִּי
  choice: для сыновей моей матери
  rationale: Сохранён конкретный древнееврейский оборот и параллелизм с «братьями моими»; выражение подчёркивает особенно близкое кровное родство.
theological_decisions:
- issue: Гендерно маркированные обозначения родства
  choice: Сохранить «братьев» и «сыновей моей матери»
  alternative: 'Передать обобщённо: «родных» или «семьи»'
  rationale: В еврейском тексте стоят явно мужские термины אָח и בֵּן во множественном числе. Контекст не требует устранять их конкретность, а буквальная образность усиливает трагедию семейного отчуждения.
- issue: Характер отчуждения
  choice: 'Передать как возникшее состояние: «стал»'
  alternative: 'Передать только прошлое состояние: «был»'
  rationale: Форма הָיִיתִי допускает оба прочтения. Основной текст выбирает естественное для плача результативно-ингрессивное понимание, но неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим порядком слов. Две параллельные строки сохраняют структуру еврейского стиха; «посторонним» избегает современного юридико-национального оттенка слова «иностранец».
