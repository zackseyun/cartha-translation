  text: רָא֣וּ עֲנָוִ֣ים יִשְׂמָ֑חוּ דֹּרְשֵׁ֥י אֱ֝לֹהִ֗ים וִ/יחִ֥י לְבַבְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/032.yaml
  text: The humble have seen and rejoice[a]; you who seek God[c][b], let your hearts live.
translation:
  language: ru
  text: Смиренные увидели и радуются[a]; ищущие Бога, да оживут ваши сердца[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Страждущие увидели и радуются»; также возможно: «Кроткие увидели и радуются».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «да оживёт ваше сердце». Это образное пожелание обновлённых сил, мужества и надежды.'
    reason: cultural_note
lexical_decisions:
- source_word: רָאוּ
  choice: увидели
  rationale: Форма qal перфекта, 3-е лицо множественного числа. Простое прошедшее время прямо передаёт завершённое действие; объект в еврейском тексте не выражен, поэтому «это» не добавлено.
- source_word: עֲנָוִים
  choice: смиренные
  rationale: Слово может обозначать смиренных, кротких, униженных или страждущих. «Смиренные» сохраняет нравственно-духовной оттенок, не исключая их бедственного и униженного положения.
- source_word: יִשְׂמָחוּ
  choice: радуются
  rationale: Имперфект допускает настоящее или будущее осмысление. Настоящее время естественно передаёт живой поэтический отклик на уже увиденное, не превращая его однозначно в предсказание.
- source_word: דֹּרְשֵׁי אֱלֹהִים
  choice: ищущие Бога
  rationale: 'Причастный оборот с последующим обращением во 2-м лице множественного числа лучше понимать как вокатив: псалмопевец непосредственно обращается к ищущим Бога.'
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В данном контексте форма обозначает единого Бога Израиля и естественно передаётся русским единственным числом.
- source_word: וִיחִי לְבַבְכֶם
  choice: да оживут ваши сердца
  rationale: Пожелательная форма глагола חיה передана частицей «да». Множественное число «сердца» естественно для русского обращения к группе, хотя в еврейском стоит собирательное единственное «сердце» с местоименным суффиксом множественного числа.
