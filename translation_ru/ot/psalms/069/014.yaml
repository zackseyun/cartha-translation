  source_fidelity: 'В целом структура двух просьб и параллелизм переданы точно: הַצִּילֵנִי — «Избавь меня», отрицательная просьба «не дай мне утонуть», затем возобновлённая волитивная просьба об избавлении от ненавидящих и от водных глубин. Однако «тина» обычно означает водную растительность или налёт на воде, а не טיט — вязкую грязь, ил, глину, в которых можно увязнуть или погрузиться.'
