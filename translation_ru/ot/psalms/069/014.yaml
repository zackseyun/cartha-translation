base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/014.yaml
  text: Rescue me from the mire; do not let me sink[a]. Let me be delivered from those who hate me and from the depths of the waters.
translation:
  language: ru
  text: Избавь меня из вязкой грязи, не дай мне утонуть. Да буду я избавлен от ненавидящих меня и от водных глубин.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Избавь меня
  rationale: 'Порода hифиль, повелительная форма с суффиксом первого лица: настойчивая просьба об активном спасении. «Избавь меня» естественно и достойно звучит в современной русской поэтической речи.'
- source_word: מִטִּיט
  choice: от тины
  rationale: טיט обозначает грязь, ил, вязкую жижу. «Тина» сохраняет поэтический образ вязкой среды, в которой можно утонуть.
- source_word: וְאַל אֶטְבָּעָה
  choice: не дай мне утонуть
  rationale: Отрицание אַל с формой первого лица выражает молитвенное пожелание. Русская конструкция передаёт этот смысл естественно, не утверждая, что Бог непосредственно вызывает погружение.
- source_word: אִנָּצְלָה
  choice: Да буду я избавлен
  rationale: Нифаль с когортативным оттенком выражает возобновлённую просьбу; пассивная формулировка сохраняет смену залога и поэтический параллелизм с начальным הַצִּילֵנִי.
- source_word: מִשֹּׂנְאַי
  choice: от ненавидящих меня
  rationale: Буквально — «от моих ненавидящих». Причастная конструкция точнее, чем интерпретирующее «от врагов», и естественна по-русски.
- source_word: וּמִמַּעֲמַקֵּי מָיִם
  choice: и от водных глубин
  rationale: Сочетание существительного во множественном числе «глубины» с «водами» передано компактно и поэтично, с сохранением образа опасной глубины.
