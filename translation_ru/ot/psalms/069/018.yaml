lexical_decisions:
- source_word: קָרְבָה
  choice: Приблизься
  rationale: Повелительная форма глагола קרב выражает прямую просьбу к Богу подойти близко. «Приблизься» сохраняет лаконичность, поэтическое достоинство и силу повеления.
- source_word: נַפְשִׁי
  choice: к душе моей
  rationale: נפשׁ может обозначать душу, жизнь или самого человека. Буквальное «душе моей» сохраняет образность и личный, эмоциональный строй стиха; широта значения отмечена в сноске.
- source_word: גְאָלָהּ
  choice: искупи её
  rationale: Глагол גאל означает искупить, возвратить или освободить, выступив избавителем. Местоимение женского рода соотнесено с «душой». «Искупи» сохраняет характерный оттенок действия избавителя.
- source_word: לְמַעַן
  choice: из-за
  rationale: למען обычно выражает цель или основание. Здесь враги представлены как обстоятельство, побуждающее просить об избавлении, поэтому контекстуально естественно «из-за»; более буквальная целевая формулировка приведена в сноске.
- source_word: אֹיְבַי
  choice: врагов моих
  rationale: Обычное и ясное соответствие форме множественного числа с суффиксом первого лица.
- source_word: פְּדֵנִי
  choice: выкупи меня
  rationale: Глагол פדה обозначает освобождение посредством выкупа. «Выкупи» отличает его от стоящего ранее גאל и сохраняет сочетание двух близких, но не тождественных глаголов.
theological_decisions:
- issue: Различение парных глаголов избавления גאל и פדה
  choice: Передать גאל как «искупи», а פדה как «выкупи»
  alternative: Передать оба глагола словом «искупи» либо второй — словом «избавь»
  rationale: Разные русские глаголы сохраняют лексическую и поэтическую насыщенность еврейского текста. «Выкупи» выражает освобождение, но само по себе не навязывает стиху позднейшую разработанную теорию искупления.
- issue: Значение לְמַעַן перед упоминанием врагов
  choice: 'Основной текст: «из-за врагов моих»'
  alternative: «ради врагов моих»
  rationale: Контекст просьбы указывает, что враги служат причиной или поводом для избавления, а не его благополучателями. При этом формальная целевая неоднозначность оборота сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого молитвенного повеления и поэтического параллелизма. Инверсия «душе моей» и «врагов моих» придаёт строке достоинство псалма, не делая её архаичной.
