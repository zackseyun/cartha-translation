lexical_decisions:
- source_word: וָאֶבְכֶּה
  choice: Когда я плакал
  rationale: Глагол בכה означает «плакать». Союз ו в данной последовательности допускает временное прочтение, естественно связывающее плач и последовавшее поношение.
- source_word: בַצּוֹם
  choice: постясь
  rationale: צוֹם означает «пост», а предлог ב указывает здесь на сопутствующее действие или обстоятельство. Деепричастие передаёт это естественным современным русским языком.
- source_word: נַפְשִׁי
  choice: в душе
  rationale: נֶפֶשׁ может обозначать душу, самого человека, жизнь или внутреннее существо. Перевод сохраняет явно названную внутреннюю сторону плача, не подменяя её глаголом «смирял», отсутствующим в этой строке.
- source_word: וַתְּהִי
  choice: это стало
  rationale: Форма היה выражает наступивший результат; местоимение «это» относится ко всему предшествующему действию — плачу и посту.
- source_word: לַחֲרָפוֹת
  choice: поношением
  rationale: 'Форма חֲרָפוֹת морфологически множественная, но в конструкции имеет собирательно-абстрактный смысл: насмешки, укор и бесчестье. Русское «поношение» сохраняет этот смысл и возвышенный регистр псалма.'
- source_word: לִי
  choice: для меня
  rationale: Предлог ל обозначает затронутое лицо; «для меня» естественно передаёт то, чем обернулось действие псалмопевца.
theological_decisions:
- issue: Связь נַפְשִׁי с плачем или постом
  choice: «в душе» связано с плачем, а «постясь» передаёт בַצּוֹם
  alternative: «я смирял себя постом» или буквальное «постом душу мою»
  rationale: Синтаксис краток и допускает разные способы связи слов. Основной текст сохраняет и плач, и пост, и נַפְשִׁי, не вводя отсутствующий в еврейской строке глагол «смирять»; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением традиционно-псалмового слова «поношение». Конструкция сделана понятной для обычного читателя, а необычная краткость и неоднозначность еврейского выражения вынесены в сноску.
