  text: לַ/מְנַצֵּ֬חַ עַֽל שׁוֹשַׁנִּ֬ים לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/000.yaml
  text: 'For the choirmaster: according to Lilies[a]. Of David[b].'
translation:
  language: ru
  text: Руководителю хора. На мотив «Лилии»[a]. Давида[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или, возможно, «по „Лилиям“»; вероятно, это название мелодии или музыкального стиля.
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение «Давида» может указывать на авторство, посвящение или связь с Давидом и само по себе не решает этот вопрос.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов слово обозначает руководителя музыкального исполнения. Дательный падеж естественно передаёт адресованное ему указание, а выражение «руководитель хора» понятно современному читателю.
- source_word: עַל
  choice: на мотив
  rationale: В музыкальных надписаниях предлог, вероятно, вводит название напева, мелодии или способа исполнения. Перевод «на мотив» естественен по-русски, а сохраняющаяся неопределённость отмечена в сноске.
- source_word: שׁוֹשַׁנִּים
  choice: «Лилии»
  rationale: Буквальное значение — «лилии»; здесь это, вероятнее всего, название мелодии или музыкального образца. Кавычки обозначают название, не заменяя его транслитерацией.
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая родительная конструкция соответствует форме надписания и не сводит широкое значение еврейского לְ к однозначному утверждению авторства.
theological_decisions:
- issue: Значение לְדָוִד в заголовке псалма
  choice: Давида
  alternative: Написано Давидом; для Давида
  rationale: Еврейская конструкция допускает авторство, посвящение, принадлежность или иную связь с Давидом. Выбранная формулировка вместе со сноской сохраняет эту неоднозначность.
translation_notes:
  register: Краткое надписание передано современным литературным русским языком. Синтаксис сохранён как заголовочный и лаконичный; кавычки помогают распознать «Лилии» как вероятное название.
