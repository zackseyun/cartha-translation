lexical_decisions:
- source_word: וְאַל
  choice: Не
  rationale: Сочетание וְ с запретительной частицей אַל продолжает цепь прошений. В русском отдельное «и» здесь необязательно и утяжеляло бы начало стиха; запретительное значение точно передаётся формой «не скрывай».
- source_word: תַּסְתֵּר פָּנֶיךָ
  choice: не скрывай… Своего лица
  rationale: Сохраняется еврейский образ «скрыть лицо», обозначающий лишение благоволения, внимания или близости; он понятен в русском поэтическом контексте.
- source_word: מֵעַבְדֶּךָ
  choice: от Твоего раба
  rationale: עֶבֶד обозначает раба или слугу. В молитвенном обращении к Богу русское «раб» естественно выражает смиренное подчинение и принадлежность, не сводя выражение к наёмной службе.
- source_word: כִּי צַר לִי
  choice: ведь я в беде
  rationale: כִּי вводит основание просьбы, а краткое צַר לִי описывает стеснённое, бедственное положение. «Я в беде» естественно и ясно передаёт смысл современному читателю.
- source_word: מַהֵר עֲנֵנִי
  choice: поспеши ответить мне
  rationale: מַהֵר выражает требование поспешить, а עֲנֵנִי — просьбу об ответе в молитве. Такая конструкция сохраняет настоятельность оригинала и звучит естественно по-русски.
theological_decisions:
- issue: Антропоморфный образ Божьего лица
  choice: Сохранить «Своего лица» в основном тексте
  alternative: Своего присутствия; Своего благоволения
  rationale: Буквальный образ передаёт одновременно Божье внимание, близость и благоволение, не сводя многозначную метафору к одному толкованию.
- issue: Значение עֶבֶד в отношении молящегося к Богу
  choice: раб
  alternative: слуга
  rationale: «Раб» точнее сохраняет оттенок полной принадлежности и подчинения Богу, характерный для псалмической молитвы; при этом контекст не требует развивать социально-правовые детали рабства.
- issue: Образ стеснения в צַר לִי
  choice: я в беде
  alternative: мне тесно; мне тяжело
  rationale: Основной текст передаёт состояние бедствия ясным современным выражением, а примечание сохраняет буквальный пространственный образ и его эмоциональную напряжённость.
translation_notes:
  register: Современный литературный русский язык с лаконичным молитвенно-поэтическим строем. Заглавные местоимения в обращении к Богу поддерживают традиционный русский библейский регистр; инверсия «от Твоего раба Своего лица» сохраняет ясность связей и торжественное звучание без архаизации.
