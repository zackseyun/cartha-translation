lexical_decisions:
- source_word: תְּהִי
  choice: Пусть … опустеет
  rationale: Форма употреблена волитивно, выражая пожелание-просьбу; конструкция с «пусть» естественно передаёт юссивную силу.
- source_word: טִירָתָם
  choice: их стан
  rationale: Слово может обозначать стан, ограждённое поселение или место обитания. «Стан» сохраняет собирательный и конкретный образ и соответствует параллели с шатрами.
- source_word: נְשַׁמָּה
  choice: опустеет
  rationale: Форма выражает состояние запустения и разорения. Глагол «опустеет» естественно сочетается с «пусть» и передаёт переход к запустению.
- source_word: בְּאָהֳלֵיהֶם
  choice: в их шатрах
  rationale: אֹהֶל буквально означает «шатёр»; в поэзии слово может шире обозначать жилище, но конкретный образ здесь сохранён.
- source_word: אַל יְהִי
  choice: пусть … никто не
  rationale: Отрицательная юссивная конструкция выражает пожелание; русская конструкция с «пусть» сохраняет её волитивный характер.
- source_word: יֹשֵׁב
  choice: не живёт
  rationale: Причастие от ישב в данном контексте означает постоянное пребывание или проживание. «Никто не живёт» звучит естественно и точно передаёт смысл.
theological_decisions:
- issue: Юссивные проклятия-прошения в псалме-плаче
  choice: 'Передать как пожелания-просьбы: «Пусть…; пусть…»'
  alternative: 'Передать как простое предсказание: «Их стан опустеет; в их шатрах никто не будет жить».'
  rationale: Еврейские формы имеют волитивную силу, а контекст представляет собой обращённое к Богу прошение, а не только предсказание. Перевод сохраняет напряжённую риторику псалма, не смягчая её.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим синтаксисом. Параллелизм двух пожеланий сохранён; конкретные образы стана и шатров не заменены отвлечёнными понятиями.
