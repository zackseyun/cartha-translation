  yaml_path: translation/ot/psalms/069/025.yaml
  text: May their encampment become desolate[b][a]; let there be no one dwelling in their tents.
translation:
  language: ru
  text: Пусть их стан[a] опустеет; пусть в их шатрах никто не живёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поселение»; «место обитания».'
