  yaml_path: translation/ot/psalms/069/022.yaml
  text: May their table before them become a trap[a], and for their well-being a snare.
translation:
  language: ru
  text: 'Пусть их стол перед ними станет западнёй,

    а их благополучие[a] — силком.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их мирные жертвы». Еврейское слово может обозначать благополучие, мир или процветание; возможно и культовое прочтение: «мирные жертвы».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: пусть … станет
  rationale: Юссив выражает пожелание-проклятие; эта конструкция естественно передаёт его волевое значение по-русски.
- source_word: שֻׁלְחָנָם
  choice: стол перед ними
  rationale: Сохранён конкретный образ стола как пищи, достатка или пиршества, без замены его толкованием.
- source_word: לְפָח
  choice: западнёй
  rationale: פַּח обозначает ловушку или западню; выбран отдельный русский эквивалент, чтобы сохранить различие с מוֹקֵשׁ.
- source_word: שְׁלוֹמִים
  choice: их благополучие
  rationale: В данном контексте слово естественно понимается абстрактно как благополучие или то, что служит благу; возможный жертвенный оттенок сохранён в сноске.
- source_word: לְמוֹקֵשׁ
  choice: силком
  rationale: מוֹקֵשׁ — ловушка, силок; слово передаёт охотничий образ и поддерживает варьированный параллелизм с «западнёй».
theological_decisions:
- issue: Значение שְׁלוֹמִים в контексте проклятия
  choice: Передать как «их благополучие»
  alternative: «их мирные жертвы»
  rationale: Абстрактное значение хорошо согласуется с мыслью о том, что благо обращается в средство гибели. Вместе с тем форма допускает культовый оттенок «мирных жертв», поэтому неоднозначность отмечена в сноске, а не устранена.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, параллелизма и суровой интонации древнееврейского проклятия. «Западня» и «силок» передают два близких, но различных слова оригинала.
