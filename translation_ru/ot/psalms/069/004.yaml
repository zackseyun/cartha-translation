base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/004.yaml
  text: Those who hate me without cause are more than the hairs of my head[a]; those who would destroy me, my false enemies, are mighty. What I did not steal[b], then I must restore.
translation:
  language: ru
  text: Ненавидящих меня без причины больше, чем волос на моей голове; сильны те, кто хочет погубить меня, — мои лживые враги.[a] Чего я не похитил, то возвращаю.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение можно также понять как «враги мои, враждующие со мной без основания». Оно может характеризовать врагов как лживых либо указывать на ложность и беспочвенность их вражды против псалмопевца.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тогда я возвращаю» или «тогда я возвращу». В контексте это может означать, что псалмопевца заставляют возмещать то, чего он не похищал.'
    reason: lexical_alternative
