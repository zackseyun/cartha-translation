- source_word: רַבּוּ מִשַּׂעֲרוֹת רֹאשִׁי
  choice: больше, чем волос на моей голове
  rationale: Глагол выражает многочисленность, а מִן вводит сравнение; естественный русский оборот сохраняет гиперболический образ.
- source_word: שֹׂנְאַי חִנָּם
  choice: ненавидящих меня без причины
  rationale: חִנָּם здесь указывает на отсутствие основания или вины, а не платы.
- source_word: עָצְמוּ
  choice: сильны
  rationale: Форма от עצם передаёт силу и могущество противников; краткая форма поддерживает поэтический параллелизм.
- source_word: מַצְמִיתַי
  choice: те, кто хочет погубить меня
  rationale: Причастие обозначает людей, стремящихся уничтожить или привести говорящего к гибели; перевод ясно выражает их намерение.
- source_word: אֹיְבַי שֶׁקֶר
  choice: враги мои, преследующие меня ложью
  rationale: שֶׁקֶר допускает характеристику врагов как лживых и указание на неправомерность их вражды. Развёрнутый оборот звучит естественно и не сводит выражение к одному из этих смыслов.
- source_word: אֲשֶׁר לֹא גָזַלְתִּי
  choice: чего я не похищал
  rationale: גזל обозначает насильственное или неправомерное отнятие; «похищал» точнее передаёт этот оттенок, чем более общее «крал».
- source_word: אָז אָשִׁיב
  choice: то должен теперь возвратить
  rationale: Буквально глагол значит «возвращаю/возвращу»; контекст подразумевает вынужденное возмещение за то, чего псалмопевец не отнимал. «Должен» делает эту связь понятной, а примечание сохраняет буквальную форму.
theological_decisions:
- issue: Вынужденное возмещение при заявленной невиновности
  choice: Чего я не похищал, то должен теперь возвратить.
  alternative: Чего я не похищал, то теперь возвращаю.
  rationale: Контекст несправедливого преследования позволяет понять возврат как навязанный, однако еврейский глагол сам по себе не содержит значения долженствования; неоднозначность отмечена в сноске.
- issue: Связь שֶׁקֶר с врагами или с их враждой
  choice: враги мои, преследующие меня ложью
  alternative: мои лживые враги / враги мои безвинно
  rationale: Конструкция допускает как характеристику врагов, так и указание на ложность или беспочвенность их нападок. Основной текст удерживает оба оттенка, а сноска прямо обозначает варианты.
