  text: כִּֽי קִנְאַ֣ת בֵּיתְ/ךָ֣ אֲכָלָ֑תְ/נִי וְ/חֶרְפּ֥וֹת ח֝וֹרְפֶ֗י/ךָ נָפְל֥וּ עָלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/009.yaml
  text: For zeal for your house has consumed me[b][a], and the reproaches of those who reproach you have fallen on me.
translation:
  language: ru
  text: Ибо ревность о Твоём доме поглотила меня[a], и поношения тех, кто поносит Тебя, пали на меня.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «съела меня»; также возможно: «пожрала меня».'
    reason: lexical_alternative
  - marker: b
    text: Первая часть этого стиха цитируется в Ин 2:17 применительно к Иисусу.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт объяснительную связь со словами окружающего контекста и сохраняет возвышенный, но понятный поэтический строй.
- source_word: קִנְאַת
  choice: ревность
  rationale: Здесь означает горячую преданность и рвение, а не зависть; сочетание «ревность о Твоём доме» точно и естественно для библейской поэзии.
- source_word: בֵּיתְךָ
  choice: Твоём доме
  rationale: Сохраняет буквальное «доме», не сужая значение заранее до храма, хотя святилище подразумевается контекстом.
- source_word: אֲכָלָתְנִי
  choice: поглотила меня
  rationale: Передаёт сильную метафору глагола «есть, пожирать» естественным современным русским выражением.
- source_word: וְחֶרְפּוֹת
  choice: и поношения
  rationale: Передаёт словесное бесчестие и презрение, сохраняя достоинство поэтического регистра и однокоренную связь со следующим словом.
- source_word: חֹרְפֶיךָ
  choice: тех, кто поносит Тебя
  rationale: Естественно передаёт причастную форму и сохраняет в русском однокоренную связь «поношения — поносит».
- source_word: נָפְלוּ עָלַי
  choice: пали на меня
  rationale: 'Близко воспроизводит еврейский образ: оскорбления, направленные против Бога, обрушились на псалмопевца.'
theological_decisions:
- issue: Мессианское и каноническое звучание стиха
  choice: Основной текст переведён в непосредственном псалмическом смысле, а новозаветная связь указана в примечании.
  alternative: Внести явное христологическое толкование непосредственно в текст стиха.
  rationale: Еврейский текст говорит голосом псалмопевца и не называет Мессию прямо; применение первой строки к Иисусу в Ин 2:17 важно для канонического чтения, но не должно менять формулировку исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Формы обращения к Богу даны с прописной буквы. Сохранены параллелизм, образ «поглощения» и однокоренная конструкция «поношения тех, кто поносит».
