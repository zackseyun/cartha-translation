lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего прошения о суде; «ибо» сохраняет причинную связь и соответствует возвышенному поэтическому регистру.
- source_word: אַתָּה אֲשֶׁר הִכִּיתָ
  choice: того, кого Ты поразил
  rationale: В еврейском тексте подразумевается объект в единственном числе; русское «того, кого» естественно восполняет его, не меняя числа.
- source_word: רָדָפוּ
  choice: они преследуют
  rationale: Глагол обозначает враждебное преследование; настоящее время естественно передаёт описываемое продолжающееся действие.
- source_word: וְאֶל
  choice: и о
  rationale: Предлог אֶל здесь вводит предмет речи при глаголе יְסַפֵּרוּ; русское управление «рассказывать о» естественно передаёт эту связь.
- source_word: מַכְאוֹב
  choice: боли
  rationale: Прямое соответствие значению физической или душевной боли; единственное число оригинала сохранено.
- source_word: חֲלָלֶיךָ
  choice: раненных Тобой
  rationale: Слово может обозначать пронзённых, раненых или убитых. В сочетании с «болью» значение живых раненых наиболее связно, а суффикс второго лица передан указанием на Бога как действующего.
- source_word: יְסַפֵּרוּ
  choice: рассказывают
  rationale: Пиэль глагола ספר означает рассказывать или подробно излагать; выбранное слово сохраняет смысл речи о страдании, не добавляя неявной оценки вроде насмешки.
theological_decisions:
- issue: Следует ли понимать חֲלָלֶיךָ как раненых Богом или как убитых Им
  choice: раненных Тобой
  alternative: Твоих убитых; пронзённых Тобой
  rationale: Упоминание их боли лучше сочетается с ранеными, продолжающими страдать, однако лексически возможно и значение «убитые». Неоднозначность сохранена в сноске, без устранения напряжения, связанного с тем, что поражение приписывается Богу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Местоимение «Ты» в обращении к Богу написано с прописной буквы. Порядок слов сохраняет поэтический акцент и параллелизм, оставаясь понятным современному читателю.
