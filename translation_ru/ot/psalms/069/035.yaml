source:
  edition: WLC
  text: כִּ֤י אֱלֹהִ֨ים י֘וֹשִׁ֤יעַ צִיּ֗וֹן וְ֭/יִבְנֶה עָרֵ֣י יְהוּדָ֑ה וְ/יָ֥שְׁבוּ שָׁ֝֗ם וִ/ירֵשֽׁוּ/הָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/035.yaml
  text: For God will save Zion and build the cities of Judah[b][a], and they will dwell there and possess it.
translation:
  language: ru
  text: Ибо Бог спасёт Сион и построит города Иудеи; там будут жить и унаследуют её[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут владеть ею», «овладеют ею». Древнееврейский глагол может обозначать получение наследия или вступление во владение, особенно землёй. Местоименный суффикс имеет женский род и может относиться к Сиону, представленному как женский образ, либо к земле.'
    reason: Лексическая альтернатива и неоднозначность референта местоимения.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующей надежды и хвалы; «ибо» естественно передаёт пояснительную связь в возвышенном, но современном русском регистре.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Глагол стоит в единственном числе, поэтому здесь требуется значение единственного числа — «Бог».
- source_word: יוֹשִׁיעַ
  choice: спасёт
  rationale: Порода hifil глагола ישׁע означает «спасти, избавить»; будущее время соответствует контексту обещания.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Сохранено традиционное русское написание географического и богословски значимого имени.
- source_word: וְיִבְנֶה
  choice: и построит
  rationale: Глагол בנה прямо означает «строить». Вариант «восстановит» возможен по контексту, но добавляет не выраженную самим глаголом идею повторного строительства.
- source_word: עָרֵי יְהוּדָה
  choice: города Иудеи
  rationale: Естественная русская передача древнееврейской сопряжённой конструкции.
- source_word: וְיָשְׁבוּ שָׁם
  choice: там будут жить
  rationale: ישׁב обозначает устойчивое проживание или поселение. Безлично выраженный субъект множественного числа сохранён без уточнения, кого именно имеет в виду текст.
- source_word: וִירֵשׁוּהָ
  choice: и унаследуют её
  rationale: ירשׁ может означать «унаследовать», «владеть» или «овладеть». Местоимение «её» сохраняет женский род и неопределённость референта древнееврейского суффикса.
theological_decisions:
- issue: К чему относится суффикс женского рода в וִירֵשׁוּהָ
  choice: Сохранено местоимение «её» без явного уточнения референта.
  alternative: «овладеют этой землёй» или «будут владеть Сионом»
  rationale: Древнееврейский текст допускает соотнесение суффикса с Сионом, представленным как женский образ, либо с землёй/областью. Явное существительное в переводе необоснованно устранило бы эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Точка с запятой разграничивает Божье действие и последующее проживание людей. Неуказанный в оригинале субъект множественного числа не конкретизирован.
