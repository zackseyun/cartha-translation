lexical_decisions:
- source_word: יְהַלְלוּהוּ
  choice: Да хвалят Его
  rationale: Пиэль, имперфект 3-го лица множественного числа с объектным суффиксом 3-го лица единственного числа; в контексте поэтического призыва форма естественно передаётся русской побудительной конструкцией «да хвалят», при этом сохраняется возможный оттенок пожелания.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: небеса и земля
  rationale: «Небеса и земля» — естественная для русского библейского и литературного языка парная формула, передающая весь сотворённый мир и сохраняющая формальное множественное число שָׁמַיִם.
- source_word: יַמִּים
  choice: моря
  rationale: Прямое соответствие форме множественного числа; «моря» точнее исходного слова и поэтически естественнее, чем более узкое современное «океаны».
- source_word: וְכָל רֹמֵשׂ
  choice: и всё, что движется
  rationale: Причастие от רמש может обозначать движение, ползание или кишение живых существ. Широкое «всё, что движется» подходит морскому контексту и не сужает смысл до пресмыкающихся.
- source_word: בָּם
  choice: в них
  rationale: Местоименный суффикс мужского рода множественного числа естественно соотносится с ближайшим антецедентом «моря»; русское местоимение сохраняет эту связь.
theological_decisions:
- issue: Модальность призыва творения к хвале
  choice: Побудительно-пожелательное «Да хвалят Его»
  alternative: Предсказательное «будут хвалить Его»
  rationale: Форма имперфекта допускает разные модальные оттенки, однако в данном славословном контексте вероятнее призыв или пожелание. Конструкция «да хвалят» сохраняет эту силу, не превращая стих в однозначное предсказание.
- issue: Объём призыва к хвале
  choice: Космический призыв, охватывающий небеса, землю, моря и живущих в них существ
  alternative: Узкое обращение только к морским существам
  rationale: Синтаксический ряд перечисляет основные области мироздания; последние слова конкретизируют обитателей морей, не ограничивая всеохватность предшествующего призыва.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. «Да хвалят» понятно современному читателю и сохраняет достоинство поэтического призыва; местоимение «Его» написано с прописной буквы согласно распространённой русской библейской традиции.
