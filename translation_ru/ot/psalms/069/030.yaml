  text: 'Буду славить имя Бога песней

    и возвеличу Его с благодарностью.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодарственной жертвой»; еврейское תּוֹדָה может означать как благодарность, так и благодарственную жертву — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: Воспою
  rationale: Когортатив первого лица выражает решимость говорящего. «Воспою» естественно сочетается с בְּשִׁיר и передаёт хвалу, воздаваемую песней.
- source_word: שֵׁם אֱלֹהִים
  choice: имя Бога
  rationale: Сохранена прозрачная конструкция исходного текста и её благоговейное звучание.
- source_word: בְּשִׁיר
  choice: в песне
  rationale: Предлог ב здесь обозначает способ выражения хвалы; «в песне» естественно в современном литературном русском.
- source_word: וַאֲגַדְּלֶנּוּ
  choice: и возвеличу Его
  rationale: Форма от גדל означает признавать и провозглашать величие Бога. «Возвеличу» сохраняет параллелизм с хвалой и не предполагает буквального увеличения.
- source_word: בְתוֹדָה
  choice: благодарением
  rationale: В данном музыкально-словесном параллелизме наиболее вероятно значение выраженной благодарности, хотя слово может также обозначать благодарственную жертву.
theological_decisions:
- issue: Означает ли תּוֹדָה благодарение или благодарственную жертву
  choice: благодарение
  alternative: благодарственная жертва
  rationale: Упоминания хвалы, песни и возвеличивания поддерживают словесно-песенное значение; жертвенный оттенок лексически возможен и отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Формы «воспою» и «возвеличу» уместны для псалма и остаются понятными современному читателю; синтетическое будущее также передаёт волевую направленность еврейских когортативов.
