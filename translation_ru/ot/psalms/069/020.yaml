base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/020.yaml
  text: Reproach has broken my heart[a], and I am sick; I looked for sympathy, but there was none, and for comforters, but I found none.
translation:
  language: ru
  text: Поношение разбило моё сердце, и я тяжело болен. Я ждал сочувствия[a], но его не было; ждал утешителей, но никого не нашёл.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сострадания». Еврейское слово означает участливый, сострадательный отклик на чужое горе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרְפָּה
  choice: поношение
  rationale: Передаёт как обращённые против страдальца насмешки и оскорбления, так и причиняемый ими публичный позор; соответствует возвышенной речи плача.
- source_word: שָׁבְרָה לִבִּי
  choice: разбило моё сердце
  rationale: Сохраняет образ завершённого сокрушительного воздействия на внутреннего человека и естественно звучит по-русски.
- source_word: וָאֲנוּשָׁה
  choice: и я изнемог
  rationale: Форма описывает тяжёлое, болезненное состояние. «Изнемог» не сводит смысл исключительно к телесной болезни и не усиливает его до неизлечимости.
- source_word: וָאֲקַוֶּה
  choice: я ждал
  rationale: Глагол выражает ожидание или надежду; в контексте ожидания человеческого отклика прямое «ждал» сохраняет исходный смысл.
- source_word: לָנוּד
  choice: сочувствия
  rationale: Инфинитив здесь обозначает сострадательный отклик, участие в чужом горе; «сочувствие» отличает эту мысль от последующего упоминания утешителей.
- source_word: וָאַיִן
  choice: но его не было
  rationale: Передаёт отсутствие ожидаемого сочувствия и контекстуальную противительность.
- source_word: וְלַמְנַחֲמִים
  choice: и утешителей
  rationale: Причастие во множественном числе обозначает людей, способных утешить; существительное сохраняет лаконизм и параллелизм.
- source_word: וְלֹא מָצָאתִי
  choice: но никого не нашёл
  rationale: Поскольку речь идёт об утешителях-людях, «никого» ясно передаёт подразумеваемый личный объект.
theological_decisions:
- issue: Мессианское применение псалма в христианском прочтении
  choice: Перевести стих прежде всего как личный плач в его собственном псалмическом контексте, не вводя явной мессианской терминологии.
  alternative: Сформулировать основной текст как непосредственное предсказание страданий Мессии.
  rationale: Новый Завет применяет Псалом 68/69 к Иисусу, однако еврейский текст данного стиха представляет речь страдающего псалмопевца. Перевод сохраняет возможность последующего мессианского применения, не внося его прямо в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмового плача. Сохранены параллелизм и контраст между ожидаемым участием и полным одиночеством; архаизмы сведены к минимуму.
