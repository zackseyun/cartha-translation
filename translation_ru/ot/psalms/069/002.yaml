source:
  edition: WLC
  text: טָבַ֤עְתִּי בִּ/יוֵ֣ן מְ֭צוּלָה וְ/אֵ֣ין מָעֳמָ֑ד בָּ֥אתִי בְ/מַעֲמַקֵּי מַ֝֗יִם וְ/שִׁבֹּ֥לֶת שְׁטָפָֽתְ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/002.yaml
  text: I have sunk in deep mire[a], and there is no foothold; I have come into deep waters, and the flood has swept over me.
translation:
  language: ru
  text: 'Я погряз в глубокой тине, и нет опоры;

    я вошёл в глубокие воды,

    и поток[a] захлестнул меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «течение унесло меня»; также возможно: «бурный поток поглотил меня».'
    reason: 'Сочетание שִׁבֹּלֶת שְׁטָפָתְנִי допускает разные близкие передачи: поток или течение смывает, затопляет либо поглощает говорящего.'
lexical_decisions:
- source_word: טָבַעְתִּי
  choice: я погряз
  rationale: Форма Qal perfect, 1-е лицо ед. числа, описывает уже переживаемое состояние. «Погряз» естественно сочетается с тиной и передаёт утрату возможности выбраться.
- source_word: בִּיוֵן מְצוּלָה
  choice: в глубокой тине
  rationale: יוֵן означает тину или грязь, а מְצוּלָה — глубину, глубокое место. Сочетание «глубокая тина» сохраняет оба элемента образа и естественно звучит по-русски.
- source_word: וְאֵין מָעֳמָד
  choice: и нет опоры
  rationale: מָעֳמָד обозначает место, где можно стоять, либо устойчивую опору. Краткое «нет опоры» сохраняет образ отсутствия твёрдой почвы.
- source_word: בָּאתִי
  choice: я вошёл
  rationale: Qal perfect, 1-е лицо ед. числа, от בוא. В сочетании с водами русское «вошёл» естественно передаёт движение в опасную среду.
- source_word: בְמַעֲמַקֵּי מַיִם
  choice: в глубокие воды
  rationale: Выражение буквально указывает на глубины вод. «В глубокие воды» ясно и естественно передаёт направление движения при глаголе «вошёл».
- source_word: שִׁבֹּלֶת
  choice: поток
  rationale: В данном контексте слово обозначает поток или течение. «Поток» сохраняет конкретный водный образ, не уточняя без необходимости, идёт ли речь о паводке, стремнине или течении.
- source_word: שְׁטָפָתְנִי
  choice: захлестнул меня
  rationale: Глагол שטף выражает действие воды, которая разливается, смывает или покрывает. «Захлестнул меня» передаёт и движение воды, и её подавляющую силу.
