lexical_decisions:
- source_word: וָאֶתְּנָה
  choice: Я сделал
  rationale: В сочетании с «своей одеждой» и «рубищем» глагол נתן выражает назначение или избрание чего-либо в качестве одежды; «сделал» естественно передаёт этот смысл.
- source_word: לְבוּשִׁי
  choice: своей одеждой
  rationale: Передаёт предмет ношения и притяжательное значение; возвратное «своей» естественно при подлежащем первого лица.
- source_word: שָׂק
  choice: рубище
  rationale: Традиционное и понятное русское обозначение грубой одежды или ткани, которую носили в знак скорби и унижения.
- source_word: וָאֱהִי
  choice: стал
  rationale: Глагол היה здесь обозначает наступившее состояние, поэтому «стал» точнее простого «был».
- source_word: לָהֶם
  choice: для них
  rationale: 'Сохраняет отношение, выраженное предлогом ל: в глазах этих людей говорящий стал предметом насмешки.'
- source_word: לְמָשָׁל
  choice: посмешищем
  rationale: В контексте публичного поношения מָשָׁל означает не нейтральную мудрую пословицу, а человека, ставшего предметом насмешливых поговорок и злословия.
