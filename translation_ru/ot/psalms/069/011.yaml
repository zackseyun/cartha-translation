  text: Я облачился в рубище и стал для них посмешищем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «притчей» или «поговоркой» — то есть человеком, о котором насмешливо говорят.'
