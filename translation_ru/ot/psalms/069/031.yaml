  text: וְ/תִיטַ֣ב לַֽ֭/יהוָה מִ/שּׁ֥וֹר פָּ֗ר מַקְרִ֥ן מַפְרִֽיס׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/031.yaml
  text: And it will please Yahweh more than an ox[a], a bull with horns and split hooves.
translation:
  language: ru
  text: И это будет угоднее Яхве, чем вол — бык с рогами и раздвоенными копытами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское сочетание можно передать и так: «чем вола, быка с рогами и раздвоенными копытами». Связь слов «вол» и «бык» допускает риторическое повторение или пояснение; речь идёт о полноценном жертвенном животном.'
    reason: Сочетание שׁוֹר פָּר допускает риторическое повторение («вол, бык») либо приложение, где второе слово уточняет первое.
lexical_decisions:
- source_word: וְתִיטַב
  choice: И это будет угоднее
  rationale: Форма Qal imperfect 3-го лица женского рода от יטב относится к хвале и благодарению из предыдущего стиха; сравнительная конструкция с מִן естественно передаётся словом «угоднее».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: מִשּׁוֹר
  choice: чем вол
  rationale: Предлог מִן после יטב выражает сравнение; שׁוֹר обозначает крупный рогатый скот, здесь жертвенного вола.
- source_word: פָּר
  choice: чем бык
  rationale: Сохраняет отдельное обозначение פָּר и допускаемую еврейским синтаксисом риторическую параллель; отношение к שׁוֹר поясняется в сноске.
- source_word: מַקְרִן
  choice: с рогами
  rationale: Причастная форма от קרן описывает животное как имеющее рога; современная и ясная русская формулировка.
- source_word: מַפְרִיס
  choice: с раздвоенными копытами
  rationale: Причастная форма от פרס указывает на разделённое копыто; формулировка передаёт признак пригодного для жертвы чистого животного без добавления толкования в основной текст.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; «Яхве» сохраняет личное заветное имя и соответствует предоставленному аудированному решению.
- issue: Сравнение хвалы с жертвой
  choice: будет угоднее ... чем
  alternative: будет лучше ... вола
  rationale: Так явно передаётся, что подразумеваемые хвала и благодарение угодны Яхве больше жертвенного животного, при этом богословское противопоставление не усиливается сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Конструкция «будет угоднее» естественно сохраняет сравнительный смысл; описание животного оставлено конкретным и понятным.
