lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: дали
  rationale: Обычное значение глагола נתן; форма выражает последовательное повествовательное действие в прошедшем времени.
- source_word: בְּבָרוּתִי
  choice: в пищу мне
  rationale: Существительное בָּרוּת обозначает пищу или пропитание. Оборот «в пищу мне» естественно передаёт назначение и сохраняет вынесение этого элемента в начало строки.
- source_word: רֹאשׁ
  choice: яд
  rationale: В данном поэтическом контексте слово обозначает ядовитое либо резко горькое вещество, а не обычное значение «голова». «Яд» ясно передаёт основной смысл; традиционное «желчь» отмечено в сноске.
- source_word: וְלִצְמָאִי
  choice: а когда я жаждал
  rationale: Буквальное «для моей жажды» по-русски звучит неестественно. Временной оборот передаёт обстоятельственный смысл и подчёркивает жестокий контраст между нуждой страдальца и тем, что ему подали.
- source_word: יַשְׁקוּנִי
  choice: напоили
  rationale: Порода hифиль глагола שׁקה означает «дать пить, напоить». Русский глагол кратко и естественно передаёт эту каузативную форму.
- source_word: חֹמֶץ
  choice: уксусом
  rationale: חֹמֶץ обозначает уксус или прокисшее вино. «Уксус» — точный и традиционно узнаваемый эквивалент; возможное значение «кислое вино» приведено в сноске.
theological_decisions:
- issue: Связь со страстными повествованиями Евангелий
  choice: 'Основной текст переведён прежде всего по смыслу еврейского текста псалма: «яд» и «уксус».'
  alternative: Использовать «желчь» и/или «кислое вино», чтобы сделать новозаветную перекличку более явной.
  rationale: Формулировки Нового Завета не должны ретроспективно подменять лексику еврейского псалма. Вместе с тем традиционные и лексически допустимые варианты сохранены в сносках.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Начальное «В пищу мне» сохраняет смысловой акцент и параллелизм еврейской строки; «когда я жаждал» выбрано вместо неестественного буквального оборота «для моей жажды».
