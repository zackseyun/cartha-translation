  text: В пищу мне дали яд[a], а когда я жаждал, напоили уксусом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «желчь». Еврейское слово רֹאשׁ здесь обозначает ядовитое или горькое вещество; перевод «желчь» является традиционным.'
