  yaml_path: translation/ot/psalms/069/012.yaml
  text: Those who sit in the gate talk about me[b][a], and I am the song of those who drink strong drink.
translation:
  language: ru
  text: 'Обо мне говорят сидящие у ворот[a],

    и я — тема песен пьющих хмельное[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ворота древнего города служили местом общественной жизни и суда; вероятно, здесь подразумеваются публичные насмешки людей, имевших влияние в обществе, а не просто привратники.
    reason: cultural_note
  - marker: b
    text: 'Или: «и пьяницы распевают обо мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂיחוּ בִי
  choice: обо мне говорят
  rationale: Глагол שׂיח может обозначать размышление или речь, но в данном враждебном общественном контексте речь идёт о разговорах о псалмопевце. Предлог ב обозначает тему речи; перевод «обо мне» не добавляет прямо не выраженного значения «против меня».
- source_word: יֹשְׁבֵי שָׁעַר
  choice: сидящие у ворот
  rationale: Перевод сохраняет древнееврейский образ и не сужает значение до привратников или старейшин. Ворота древнего города были местом общественной жизни и суда.
- source_word: וּנְגִינוֹת
  choice: и я стал песней
  rationale: Существительное обозначает песни или музыку. В параллельной строке подразумевается, что сам псалмопевец сделался темой их песен; связка и местоимение естественно восполнены по-русски.
- source_word: שׁוֹתֵי שֵׁכָר
  choice: для пьющих хмельное
  rationale: שֵׁכָר — опьяняющий напиток, отличный от вина. «Хмельное» передаёт смысл естественным современным русским языком, не превращая характеристику действия в более интерпретирующее существительное «пьяницы».
