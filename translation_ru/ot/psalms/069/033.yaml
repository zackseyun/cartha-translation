source:
  edition: WLC
  text: כִּֽי שֹׁמֵ֣עַ אֶל אֶבְיוֹנִ֣ים יְהוָ֑ה וְ/אֶת אֲ֝סִירָ֗י/ו לֹ֣א בָזָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/069/033.yaml
  text: For Yahweh hears the needy[a], and he does not despise his prisoners.
translation:
  language: ru
  text: 'Ибо Яхве внемлет нуждающимся

    и узников Своих[a] не презирает.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пленников Своих». Еврейское слово может обозначать людей, находящихся в заключении или плену.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующего призыва к хвале; «ибо» естественно передаёт причинную связь и соответствует поэтическому регистру.
- source_word: שֹׁמֵעַ אֶל
  choice: внемлет
  rationale: Сочетание שמע с אֶל означает не только слышать, но и обращать внимание, откликаться; «внемлет» кратко сохраняет эту смысловую насыщенность.
- source_word: אֶבְיוֹנִים
  choice: нуждающимся
  rationale: Слово обозначает бедных и нуждающихся, находящихся в уязвимом положении. Выбор не ограничивает смысл исключительно материальной бедностью.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֲסִירָיו
  choice: узников Своих
  rationale: אֲסִיר обозначает узника или пленника, а суффикс третьего лица единственного числа сохранён притяжательным местоимением. Постпозиция «Своих» естественна в русском стихе и подчёркивает принадлежность без уточнения природы заключения.
- source_word: לֹא בָזָה
  choice: не презирает
  rationale: Хотя בָזָה формально является перфектом, в данном поэтическом параллелизме выражена постоянная, характерная черта Яхве; настоящее время согласуется с причастием שֹׁמֵעַ и передаёт общий смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Притяжательный суффикс в אֲסִירָיו
  choice: узников Своих
  alternative: узников / пленников
  rationale: Притяжательный суффикс сохранён, но текст не уточняет, означает ли он особую принадлежность Богу или просто Его отношение к этим людям; перевод не развивает эту богословскую деталь сверх сказанного.
- issue: Временной оттенок לֹא בָזָה
  choice: не презирает
  alternative: не презрел
  rationale: Контекст допускает формально-прошедшую передачу перфекта, однако параллелизм с причастием и характер утверждения поддерживают гномическое настоящее. Альтернатива отмечает реальную аспектуально-временную возможность без изменения основной мысли.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Внемлет» выбрано как понятное и ёмкое слово молитвенно-псалмического регистра; синтаксический параллелизм оригинала сохранён.
