source:
  edition: WLC
  text: מְעוֹדֵ֣ד עֲנָוִ֣ים יְהוָ֑ה מַשְׁפִּ֖יל רְשָׁעִ֣ים עֲדֵי אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/006.yaml
  text: Yahweh lifts up the humble[b][a]; he brings the wicked down to the ground.
translation:
  language: ru
  text: Яхве поднимает смиренных[a], а нечестивых низвергает до земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поддерживает кротких (униженных)»; еврейские слова могут указывать как на смирение, так и на бедственное, униженное положение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «до земли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעוֹדֵד
  choice: поднимает
  rationale: Причастие от עודד передаёт укрепление, поддержку или восстановление. «Поднимает» естественно выражает помощь униженным и сохраняет образную противоположность последующему «низвергает».
- source_word: עֲנָוִים
  choice: смиренных
  rationale: Слово обозначает смиренных, кротких или людей униженных и бедствующих. «Смиренных» кратко и ясно передаёт основное значение, а смысловая широта отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: מַשְׁפִּיל
  choice: низвергает
  rationale: Каузативная форма означает «делает низким, унижает, низводит». «Низвергает» сохраняет активное действие и резкий пространственный контраст с «поднимает».
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Обычное для Псалмов обозначение людей, поступающих неправедно; передаёт нравственную категорию без расширительного толкования.
- source_word: עֲדֵי אָרֶץ
  choice: до земли
  rationale: Выражение буквально указывает предел низведения — «до земли»; русский оборот сохраняет пространственный образ и усиление.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; передача «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Смысл עֲנָוִים
  choice: смиренных
  alternative: кротких; униженных; бедствующих
  rationale: Слово объединяет нравственный оттенок смирения и социальное положение униженных или притесняемых. Основной текст не сводит его исключительно к одной социальной либо духовной категории, а сноска сохраняет смысловую широту.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Пара «поднимает — низвергает» сохраняет антитезу еврейской строки; союз «а» естественно обозначает противопоставление.
