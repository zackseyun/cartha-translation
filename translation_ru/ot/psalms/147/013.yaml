base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/013.yaml
  text: For he has strengthened the bars of your gates[b][a]; he has blessed your children within you.
translation:
  language: ru
  text: Ведь Он укрепил засовы твоих ворот, благословил твоих детей среди тебя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоих сыновей». Еврейское слово может обозначать как сыновей, так и детей или потомков в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для предшествующего призыва к хвале; «ведь» естественно передаёт причинно-пояснительную связь в русском поэтическом контексте.
- source_word: חִזַּק
  choice: укрепил
  rationale: 'Пиэль перфекта от חזק обозначает совершённое действие: сделал крепкими, усилил.'
- source_word: בְּרִיחֵי
  choice: засовы
  rationale: Слово обозначает запирающие ворота брусья или засовы; «засовы» точно и естественно в сочетании с воротами.
- source_word: שְׁעָרָיִךְ
  choice: твоих ворот
  rationale: Форма с суффиксом 2-го лица женского рода единственного числа обращена к олицетворённому Иерусалиму; русское «твоих» сохраняет это обращение.
- source_word: בֵּרַךְ
  choice: благословил
  rationale: Пиэль перфекта от ברך прямо передаётся совершённым видом «благословил».
- source_word: בָּנַיִךְ
  choice: твоих детей
  rationale: בנים может означать как сыновей, так и детей или потомков в целом. В обращении к городу собирательное «детей» лучше охватывает его жителей, не устраняя лексической альтернативы, отмеченной в сноске.
- source_word: בְּקִרְבֵּךְ
  choice: среди тебя
  rationale: Буквально «в твоей среде, внутри тебя»; «среди тебя» сохраняет образ жителей, находящихся в пределах олицетворённого города.
theological_decisions:
- issue: Олицетворённый адресат женского рода
  choice: 'Сохранено обращение к городу во 2-м лице: «твоих… тебя» без добавления имени Иерусалима.'
  alternative: Явно вставить «Иерусалим» или заменить обращение описанием города.
  rationale: Еврейские суффиксы имеют форму женского рода единственного числа и относятся к олицетворённому Иерусалиму, однако имя города в самом стихе отсутствует.
- issue: Значение בנים в городском контексте
  choice: «твоих детей»
  alternative: «твоих сыновей»
  rationale: Слово допускает как мужское конкретное, так и широкое собирательное значение. Контекст обращения к городу благоприятствует значению его детей или жителей, но более узкая возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксический параллелизм двух завершённых действий сохранён; прописное «Он» следует принятой русской библейской издательской норме для местоименного указания на Бога.
