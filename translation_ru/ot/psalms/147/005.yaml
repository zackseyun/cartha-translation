  text: גָּד֣וֹל אֲדוֹנֵ֣י/נוּ וְ/רַב כֹּ֑חַ לִ֝/תְבוּנָת֗/וֹ אֵ֣ין מִסְפָּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/005.yaml
  text: Great is our Lord[a], and abundant in power; his understanding is beyond number.
translation:
  language: ru
  text: Велик наш Владыка и могуч силой; разум Его неизмерим.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разуму Его нет числа»; возможно также: «разум Его неисчислим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Велик
  rationale: Предикативное прилагательное вынесено в начало, как в еврейском тексте; это сохраняет хвалебную силу и естественно звучит по-русски.
- source_word: אֲדֹנֵינוּ
  choice: наш Владыка
  rationale: אֲדוֹן — титул, а не имя יהוה. «Владыка» передаёт смысл господства и сохраняет притяжательный суффикс «наш».
- source_word: וְרַב כֹּחַ
  choice: и могуч силой
  rationale: Буквально сочетание указывает на великое изобилие силы. Русское «могуч силой» кратко, достойно и избегает неестественного «обилен силой».
- source_word: לִתְבוּנָתוֹ
  choice: разум Его
  rationale: תְּבוּנָה обозначает разумение, понимание или проницательность; «разум» естественно сочетается с образом неизмеримости и доступен современному читателю.
- source_word: אֵין מִסְפָּר
  choice: неизмерим
  rationale: 'Буквально: «нет числа». В контексте Божьего разумения идиома означает отсутствие исчислимого предела; вариант сохраняет поэтическую краткость, а буквальный образ отмечен в сноске.'
theological_decisions:
- issue: Передача божественного титула אֲדֹנֵינוּ
  choice: наш Владыка
  alternative: наш Господь
  rationale: В оригинале употреблён титул אֲדוֹן с суффиксом первого лица множественного числа, а не имя יהוה. «Владыка» ясно передаёт титул и не смешивает его с принятой передачей имени Божьего.
- issue: Характер утверждения о Божьем разумении
  choice: разум Его неизмерим
  alternative: разуму Его нет числа
  rationale: Основной текст передаёт отсутствие предела, не уточняя философски природу Божьего знания. Сноска сохраняет буквальный счётный образ и подлинную вариативность выражения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмическим регистром. Начальная инверсия сохраняет еврейский порядок слов и славословный акцент; местоимение «Его» написано с прописной буквы по традиции русского религиозного стиля.
