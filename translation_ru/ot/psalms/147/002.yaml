base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/002.yaml
  text: Yahweh builds Jerusalem[b][a]; he gathers the outcasts of Israel.
translation:
  language: ru
  text: Яхве отстраивает Иерусалим[a] и собирает изгнанников Израиля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «строит Иерусалим». Еврейское причастие можно передать более буквально; «отстраивает» подчёркивает восстановление города в данном контексте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рассеянных», «изгнанных» или «отверженных израильтян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בּוֹנֵה
  choice: отстраивает
  rationale: Причастие qal от בנה выражает продолжающееся или характерное действие. В контексте восстановления Иерусалима «отстраивает» естественно передаёт не просто строительство, а возрождение разрушенного города; более буквальное «строит» сохранено в сноске.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Общепринятая русская форма географического имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: נִדְחֵי
  choice: изгнанников
  rationale: Форма от נדח обозначает людей, которых оттеснили, изгнали или рассеяли. «Изгнанники» сохраняет идею насильственного удаления, не ограничивая её исключительно официальной депортацией.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Общепринятая русская форма имени в родительном падеже.
- source_word: יְכַנֵּס
  choice: собирает
  rationale: Порода piel глагола כנס означает собирать вместе. Настоящее время естественно сочетается с причастной конструкцией первой части и передаёт восстановительное действие Бога.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя Бога. Форма «Яхве» прямо передаёт тетраграмматон и не подменяет его титулом.
- issue: Характер восстановления Иерусалима
  choice: отстраивает
  alternative: строит
  rationale: Контекст допускает восстановительный смысл, однако сам глагол буквально означает «строить»; поэтому буквальная возможность отмечена в сноске без догматического уточнения исторической ситуации.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем. Союз «и» естественно связывает два параллельных действия Яхве. Сохранены настоящее время и смысловая неоднозначность обозначения людей, удалённых из своей земли или общины.
