lexical_decisions:
- source_word: מַשְׁלִיךְ
  choice: бросает
  rationale: Причастие породы хифиль передаёт активное, зримое действие; настоящее время соответствует описательной поэзии контекста.
- source_word: קַרְחוֹ
  choice: свой лёд
  rationale: קֶרַח обозначает лёд или иней; «лёд» лучше сочетается с образом разбрасываемых мелких частиц, а возвратное «свой» естественно передаёт принадлежность действующему лицу.
- source_word: כְפִתִּים
  choice: словно крошки
  rationale: פִּתִּים — мелкие куски или ломтики, особенно хлеба; «крошки» ясно и естественно передают образ рассыпанных обломков.
- source_word: לִפְנֵי
  choice: перед
  rationale: 'Сохранено обычное пространственно-образное значение предлога: стоять «перед» силой посланной Богом стужи.'
- source_word: קָרָתוֹ
  choice: его стужей
  rationale: קָרָה означает холод; «стужа» передаёт сильный холод и сохраняет возвышенный, но понятный поэтический регистр.
- source_word: מִי יַעֲמֹד
  choice: кто устоит
  rationale: Буквальный образ «стоять» сохранён глаголом «устоять», который по-русски также естественно выражает способность выдержать воздействие.
