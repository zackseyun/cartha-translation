  text: לֹ֤א בִ/גְבוּרַ֣ת הַ/סּ֣וּס יֶחְפָּ֑ץ לֹֽא בְ/שׁוֹקֵ֖י הָ/אִ֣ישׁ יִרְצֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/010.yaml
  text: He does not delight in the strength of the horse; he takes no pleasure in the legs of the man.
translation:
  language: ru
  text: Его не радует сила коня, и не доставляют Ему удовольствия ноги человека.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְבוּרַת הַסּוּס
  choice: силе коня
  rationale: Буквально «сила коня»; выражение сохраняет образ мощи боевого или рабочего животного.
- source_word: יֶחְפָּץ
  choice: радуется
  rationale: Глагол חפץ обозначает удовольствие, благоволение или заинтересованность; здесь естественно передаётся как «радуется».
- source_word: שׁוֹקֵי הָאִישׁ
  choice: быстрота человеческих ног
  rationale: Буквально «голени мужчины/человека». В параллели с силой коня имеются в виду физические способности человека, особенно сила и быстрота ног; перевод раскрывает образ без привязки к одному конкретному мужчине.
- source_word: יִרְצֶה
  choice: Ему угодна
  rationale: Глагол רצה может означать принятие с благоволением или удовольствие; формулировка «Ему угодна» естественно сохраняет этот оттенок.
theological_decisions:
- issue: Предмет Божьего благоволения
  choice: Стих отрицает, что Богу угодны сами по себе физическая мощь и быстрота.
  alternative: Понять строку исключительно как осуждение военной силы.
  rationale: Образ коня может иметь военный оттенок, однако еврейский текст формулирует более широкое сопоставление силы коня и человеческих ног; сужать смысл до военной темы не следует.
translation_notes:
  register: Современный литературный русский язык; сохранены поэтический параллелизм и торжественная простота. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятым благоговейным библейским регистром.
