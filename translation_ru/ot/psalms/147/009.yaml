base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/009.yaml
  text: He gives food to the animals[b][a], and to the young ravens that cry out.
translation:
  language: ru
  text: Он даёт пищу животным и птенцам ворона, которые кричат.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые зовут»; в еврейском тексте не сказано, к кому обращён их зов.'
