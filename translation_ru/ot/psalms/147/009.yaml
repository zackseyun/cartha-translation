lexical_decisions:
- source_word: נוֹתֵן
  choice: Он даёт
  rationale: Причастие породы qal употреблено как сказуемое и выражает постоянное, характерное действие; настоящее время естественно передаёт этот смысл по-русски.
- source_word: לִבְהֵמָה
  choice: животным
  rationale: בְּהֵמָה может обозначать животное вообще или домашний скот; параллель с воронами поддерживает более широкое значение.
- source_word: לַחְמָהּ
  choice: пищу
  rationale: Буквально «её хлеб», однако לֶחֶם нередко означает пищу вообще; применительно к животным «пищу» точно и естественно передаёт смысл.
- source_word: לִבְנֵי עֹרֵב
  choice: птенцам ворона
  rationale: Сочетание בְּנֵי с названием животного обозначает его потомство. «Птенцам ворона» сохраняет образ и число исходного текста, оставаясь естественным по-русски.
- source_word: אֲשֶׁר יִקְרָאוּ
  choice: которые кричат
  rationale: Глагол קרא здесь означает «звать, кричать». Дополнение в еврейском тексте не названо, поэтому перевод не уточняет, к кому обращён крик.
theological_decisions:
- issue: Следует ли прямо указать, что птенцы взывают к Богу
  choice: 'Оставить адресата невыраженным: «которые кричат»'
  alternative: «которые взывают к Нему»
  rationale: В еврейском тексте адресат глагола не указан. Контекст говорит о Божьем попечении, но явное «к Нему» добавило бы отсутствующее в стихе уточнение.
translation_notes:
  register: Современный литературный русский язык; ясная и достойная формулировка. Сохранены образ птенцов ворона и невыраженный адресат их крика.
