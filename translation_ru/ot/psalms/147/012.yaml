  text: שַׁבְּחִ֣י יְ֭רוּשָׁלִַם אֶת יְהוָ֑ה הַֽלְלִ֖י אֱלֹהַ֣יִ/ךְ צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/012.yaml
  text: Praise Yahweh[a], O Jerusalem; praise your God, O Zion.
translation:
  language: ru
  text: Славь Яхве[a], Иерусалим; восхваляй Бога твоего, Сион!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה (ЙХВХ) — личное имя Бога, здесь переданное как «Яхве».
    reason: Пояснение передачи божественного имени.
lexical_decisions:
- source_word: שַׁבְּחִי
  choice: Славь
  rationale: Повелительная форма второго лица женского рода единственного числа обращена к олицетворённому Иерусалиму. «Славь» естественно и кратко передаёт призыв к хвале.
- source_word: יְרוּשָׁלִַם
  choice: Иерусалим
  rationale: Употреблена общепринятая русская форма географического и библейского имени.
- source_word: אֶת יְהוָה
  choice: Яхве[a]
  rationale: Частица אֶת отмечает прямое дополнение, а יהוה — личное имя Бога. Транслитерация «Яхве» сохраняет имя, присутствующее в еврейском тексте.
- source_word: הַֽלְלִי
  choice: восхваляй
  rationale: Повелительная форма второго лица женского рода единственного числа параллельна שַׁבְּחִי. «Восхваляй» передаёт близкий смысл, сохраняя при этом лексическое разнообразие оригинала.
- source_word: אֱלֹהַיִךְ
  choice: Бога твоего
  rationale: Форма с суффиксом второго лица женского рода единственного числа означает «твой Бог». Порядок слов «Бога твоего» поддерживает возвышенный поэтический ритм, оставаясь понятным современному читателю.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Употреблена традиционная русская форма имени; в параллелизме оно обозначает олицетворённый город и его народ.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В основном тексте сохранено личное имя, непосредственно стоящее в еврейском оригинале; примечание поясняет его форму, не подменяя имя титулом.
- issue: Соотношение Иерусалима и Сиона
  choice: Сохранить два параллельных обращения без поясняющего расширения
  alternative: Истолковать оба названия как прямое обращение к народу Израиля
  rationale: Поэтический параллелизм позволяет видеть и город, и его общину, но оригинал не требует явно выбирать только одно из этих значений.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной поэтической интонацией. Два близких глагола — «славь» и «восхваляй» — сохраняют синонимический параллелизм еврейской строки; обращения поставлены после соответствующих повелений для естественного русского звучания.
