  text: מוֹנֶ֣ה מִ֭סְפָּר לַ/כּוֹכָבִ֑ים לְ֝/כֻלָּ֗/ם שֵׁמ֥וֹת יִקְרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/004.yaml
  text: He counts the number of the stars; he calls all of them by name.
translation:
  language: ru
  text: Он исчисляет число звёзд; всех их зовёт по именам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹנֶה מִסְפָּר
  choice: исчисляет
  rationale: Сочетание причастия מנה с существительным מִסְפָּר выражает точный подсчёт. Русское «исчисляет» естественно и ёмко передаёт этот смысл в возвышенной поэтической речи, не создавая тяжеловесного повтора «считает число».
- source_word: לַכּוֹכָבִים
  choice: звёзды
  rationale: Предлог ל входит в еврейскую конструкцию со значением подсчёта; в русском языке прямое дополнение «звёзды» передаёт её естественно.
- source_word: לְכֻלָּם
  choice: каждую из них
  rationale: 'Буквально выражение означает «всех их». Поскольку речь идёт о звёздах, форма женского рода и единственное число с «каждую» ясно передают распределительное значение: ни одна звезда не исключена.'
- source_word: שֵׁמוֹת יִקְרָא
  choice: называет по имени
  rationale: קרא с שֵׁמוֹת допускает значения называния или призывания по имени. Русское выражение «называет по имени» сохраняет образ индивидуального обращения и не вынуждает выбирать исключительно между присвоением имени и зовом.
theological_decisions:
- issue: Подразумеваемое подлежащее — Бог
  choice: Он
  alternative: Господь / Бог
  rationale: В еврейском стихе имя подлежащего не повторено, а подразумевается из контекста. Местоимение сохраняет связность с предыдущим стихом и не добавляет отсутствующего здесь божественного имени.
- issue: Смысл выражения «называет по имени»
  choice: Сохранить формулировку, допускающую личное знание и обращение к каждой звезде
  alternative: даёт каждой имя
  rationale: Глагол קרא может означать «звать», «называть» или «нарекать». Более узкое «даёт имя» сняло бы присущую источнику смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим оттенком. «Исчисляет» сохраняет достоинство псалма, оставаясь понятным; синтаксис краток и естественен.
