  text: הַ/שֹּׁלֵ֣חַ אִמְרָת֣/וֹ אָ֑רֶץ עַד מְ֝הֵרָ֗ה יָר֥וּץ דְּבָרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/015.yaml
  text: He sends his command to the earth[b][a]; his word runs swiftly.
translation:
  language: ru
  text: Он посылает Своё повеление[a] на землю; стремительно[b] бежит Его слово.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своё изречение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «очень быстро» или «поспешно»; еврейское выражение подчёркивает быстроту движения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁלֵחַ
  choice: Он посылает
  rationale: Причастие здесь описывает продолжающееся действие Бога; личная форма глагола естественна для современного русского языка и сохраняет динамику стиха.
- source_word: אִמְרָתוֹ
  choice: Своё повеление
  rationale: Слово обозначает произнесённое высказывание; в контексте действенной речи Бога «повеление» передаёт её властную силу и при этом позволяет отличить этот термин от דְּבָרוֹ во второй строке.
- source_word: אָרֶץ
  choice: на землю
  rationale: В сочетании с глаголом «посылает» это естественная русская конструкция; контекст псалма указывает на землю в широком, мироустроительном смысле, а не на отдельную страну.
- source_word: עַד מְהֵרָה
  choice: стремительно
  rationale: Выражение подчёркивает быстроту движения. «Стремительно» естественно по-русски и хорошо сочетается с сохранённым поэтическим образом бегущего слова.
- source_word: יָרוּץ
  choice: бежит
  rationale: Сохранено основное значение глагола и поэтическое олицетворение Божьего слова.
- source_word: דְּבָרוֹ
  choice: Его слово
  rationale: «Слово» — наиболее прямой и естественный эквивалент здесь; оно сохраняет смысловой параллелизм с אִמְרָתוֹ, не стирая лексическое различие двух еврейских существительных.
theological_decisions:
- issue: Характер Божьей речи в поэтическом параллелизме
  choice: Передать Божью речь как действенное повеление и слово, не добавляя в основной текст позднейших богословских отождествлений.
  alternative: Перевести оба существительных одинаково как «слово» либо придать второй строке явно христологический смысл.
  rationale: В контексте псалма речь идёт о могущественном Божьем слове, действующем в творении и промысле. Перевод сохраняет эту богословскую силу, но не вносит утверждений, которых сам еврейский текст прямо не выражает.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Инверсия «стремительно бежит Его слово» сохраняет образность и параллелизм оригинала; прописные местоимения употреблены в соответствии с традиционным благоговейным библейским регистром.
