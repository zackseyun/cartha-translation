lexical_decisions:
- source_word: מַגִּיד
  choice: возвещает
  rationale: Причастие породы hифиль от נגד обозначает сообщение или объявление чего-либо. «Возвещает» передаёт активное обнародование и сохраняет поэтическую торжественность.
- source_word: דברו
  choice: слово Своё
  rationale: דָּבָר имеет широкий смысл «слово, дело, повеление». В параллели с установлениями и законами выражение «слово Своё» сохраняет широту значения и заветный контекст.
- source_word: ליעקב
  choice: Иакову
  rationale: Предлог ל обозначает адресата. Имя «Иаков» употреблено собирательно и образует поэтическую параллель с «Израилем».
- source_word: חקיו
  choice: установления Свои
  rationale: חֻקִּים — предписанные нормы или установления. Этот вариант естественен по-русски и сохраняет юридико-заветный оттенок.
- source_word: ומשפטיו
  choice: и законы Свои
  rationale: מִשְׁפָּטִים в данном юридико-заветном контексте обозначает обязательные правовые нормы, постановления или судебные решения. «Законы» понятно современному читателю, а примечание сохраняет другие возможные оттенки.
- source_word: לישראל
  choice: Израилю
  rationale: Предлог ל вновь обозначает адресата; «Израиль» параллелен «Иакову» как второе имя народа завета.
theological_decisions:
- issue: Собирательное значение имён Иаков и Израиль
  choice: 'Передать имена прямо: «Иакову» и «Израилю», не добавляя в основной текст слов «народу» или «потомкам».'
  alternative: «народу Иакова… народу Израиля» или «потомкам Иакова… Израилю»
  rationale: В еврейской поэзии непосредственно употреблены два заветных имени. Их прямое воспроизведение сохраняет параллелизм и не вносит пояснительного толкования в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным поэтическим звучанием. Инверсия «слово Своё» и повтор «Свои» поддерживают параллелизм еврейской строки. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
