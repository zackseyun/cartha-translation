base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/007.yaml
  text: Sing to Yahweh with thanksgiving[b][a]; make melody to our God with the lyre.
translation:
  language: ru
  text: Пойте Яхве с благодарностью[a], пойте нашему Богу под звуки лиры[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Откликнитесь Яхве с благодарностью». Еврейский глагол может означать «отвечать, откликаться», но здесь, вероятно, подразумевает ответное пение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «под звуки арфы»; еврейское слово обозначает струнный инструмент, точнее — лиру.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֱנוּ
  choice: Пойте
  rationale: В Qal глагол ענה буквально может означать «отвечать, откликаться», но в песенно-богослужебном контексте и в параллели с זַמְּרוּ естественно передаёт призыв петь, возможно — петь в ответ.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל указывает адресата песни, а тетраграмматон передан личным именем «Яхве».
- source_word: בְּתוֹדָה
  choice: с благодарностью
  rationale: תּוֹדָה обозначает благодарение, благодарность или хвалу; сочетание с ב здесь естественно выражает сопровождающее песнь благодарение.
- source_word: זַמְּרוּ
  choice: играйте
  rationale: זמר может обозначать пение хвалы и музицирование; упоминание лиры позволяет естественно передать здесь инструментальную сторону действия и избежать неуклюжего повтора «пойте».
- source_word: לֵאלֹהֵינוּ
  choice: нашему Богу
  rationale: Сохранены адресат действия и общинное притяжательное значение суффикса «наш».
- source_word: בְכִנּוֹר
  choice: на лире
  rationale: כִּנּוֹר — древний струнный инструмент, точнее передаваемый словом «лира», хотя традиционно его также называют гуслями или арфой.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с поэтической краткостью. Императивы сохранены; синтаксический параллелизм двух полустиший передан естественно. Формулировка «играйте… на лире» подчёркивает инструментальное сопровождение, не исключая общего значения хвалебной музыки.
