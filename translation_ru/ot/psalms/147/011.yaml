  yaml_path: translation/ot/psalms/147/011.yaml
  text: Yahweh delights in those who fear him[b][a], in those who hope for his steadfast love.
translation:
  language: ru
  text: Яхве благоволит к тем, кто боится его, к тем, кто надеется[b] на его неизменную любовь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское хесед обозначает любовь, соединённую с верностью, постоянством и милостью.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к тем, кто ожидает его неизменной любви». Еврейский глагол может выражать и ожидание, и надежду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רוֹצֶה
  choice: благоволит к
  rationale: Причастие от רצה выражает благосклонность и удовольствие, а не простое желание. «Благоволит к» естественно сочетается с людьми как объектом и сохраняет возвышенный, но понятный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом «Господь».
- source_word: יְרֵאָיו
  choice: к тем, кто боится его
  rationale: Сохраняется прямое значение корня ירא и присущее ему напряжение между страхом и благоговением; перевод не сводит выражение к одному лишь уважению.
- source_word: הַמְיַחֲלִים
  choice: к тем, кто уповает
  rationale: Глагол יחל обозначает исполненное надежды ожидание. «Уповать» кратко и естественно передаёт направленную на Бога надежду, а неоднозначность между надеждой и ожиданием отмечена в сноске.
- source_word: לְחַסְדּוֹ
  choice: на его неизменную любовь
  rationale: חסד включает любовь, милость, верность и постоянство отношений. «Неизменная любовь» сохраняет как сердечную, так и устойчивую сторону понятия без чрезмерного догматического уточнения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет его, не подменяя титулом.
- issue: Значение ירא применительно к Богу
  choice: боится его
  alternative: благоговеет перед ним
  rationale: Буквальная лексема «боится» сохраняет богословское напряжение текста и не ослабляет его до почтительности или уважения.
- issue: Смысл חסד
  choice: неизменная любовь
  alternative: милость; верная любовь
  rationale: Выбор передаёт устойчивую и благую направленность Божьего חסד, не ограничивая многозначное слово только милосердием и не добавляя отсутствующее в стихе слово «завет».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм двух групп людей сохранён; местоимения, относящиеся к Богу, даны со строчной буквы по общим нормам современного издания.
