base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/001.yaml
  text: Praise Yah[a], for it is good to sing praises to our God[b]; for it is pleasant and praise is fitting.
translation:
  language: ru
  text: Хвалите Яха[a], ведь хорошо воспевать нашего Бога; ведь хвала приятна и уместна[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ях — краткая форма Божьего имени; во многих переводах здесь стоит «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «хвала прекрасна» либо «хвала благолепна»; еврейское слово может обозначать как красоту, так и уместность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: Хвалите
  rationale: Форма повелительного наклонения во множественном числе передаёт прямой призыв псалма к хвале.
- source_word: יָהּ
  choice: Яха
  rationale: Сохранена краткая форма божественного имени; винительный падеж естественно выражает объект глагола «хвалите» и сохраняет связь с «аллилуйя».
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание для призыва; «ведь» естественно передаёт эту пояснительно-причинную связь в современном русском языке.
- source_word: טוֹב
  choice: хорошо
  rationale: Сохраняет широкую положительную оценку действия, не сужая её до приятности или пользы.
- source_word: זַמְּרָה
  choice: воспевать
  rationale: Инфинитив от זמר обозначает музыкальную хвалу; «воспевать» кратко объединяет пение и прославление.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Точно передаёт форму с суффиксом первого лица множественного числа и согласуется с управлением глагола «воспевать».
- source_word: נָעִים
  choice: приятно
  rationale: Передаёт эстетически и эмоционально положительное качество хвалы, сохраняя предикативную краткость еврейского текста.
- source_word: נָאוָה
  choice: подобает
  rationale: Передаёт значение уместности и надлежащего соответствия; возможный оттенок красоты отмечен в сноске.
- source_word: תְהִלָּה
  choice: хвала
  rationale: Прямо и кратко передаёт существительное, обозначающее хвалу как действие или её содержание.
theological_decisions:
- issue: Передача краткой формы божественного имени יָהּ
  choice: Ях
  alternative: Господь
  rationale: 'В источнике употреблена именно краткая форма имени, а не полный тетраграмматон. Транслитерация сохраняет различие форм и связь с возгласом «аллилуйя»; в основном тексте имя склоняется: «Яха».'
- issue: Смысл נָאוָה применительно к хвале
  choice: хвала подобает
  alternative: хвала прекрасна / хвала благолепна
  rationale: Контекст допускает оттенки уместности, достойности и красоты. Основной текст выбирает естественное русское выражение уместности, не исключая эстетического оттенка, указанного в сноске.
