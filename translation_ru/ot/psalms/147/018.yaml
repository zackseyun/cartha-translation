  yaml_path: translation/ot/psalms/147/018.yaml
  text: He sends out his word and melts them; he makes his wind blow[a], and the waters flow.
translation:
  language: ru
  text: Он посылает Своё слово и растапливает их; даёт Своему ветру подуть[a] — и текут воды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своему духу» или «Своему дыханию». Еврейское слово может иметь любое из этих значений, но образ ветра лучше всего соответствует описанию погоды в этом стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: посылает
  rationale: Форма обозначает характерное действие Бога в поэтическом описании; настоящее время естественно передаёт это значение по-русски.
- source_word: דְּבָרוֹ
  choice: Своё слово
  rationale: «Слово» сохраняет поэтический образ действенной Божьей речи и не сужает значение до явно выраженного приказа.
- source_word: וְיַמְסֵם
  choice: и растапливает их
  rationale: Каузативное значение передано переходным глаголом «растапливает»; местоимение сохраняет не названный прямо объект, отсылающий к замёрзшим осадкам предыдущего стиха.
- source_word: יַשֵּׁב
  choice: поднимает
  rationale: В сочетании с ветром русский глагол «поднимает» естественно выражает то, что Бог вызывает его дуновение, не перегружая стих буквальной конструкцией «заставляет дуть».
- source_word: רוּחוֹ
  choice: Свой ветер
  rationale: В контексте таяния и текущих вод значение «ветер» наиболее непосредственно, а возвратное притяжательное местоимение ясно указывает на Божью власть над ним.
- source_word: יִזְּלוּ
  choice: текут
  rationale: Глагол широко обозначает движение жидкости; «текут» точно и естественно передаёт результат таяния.
- source_word: מָיִם
  choice: воды
  rationale: Множественное число сохраняет поэтическую форму еврейского текста и хорошо согласуется с глаголом во множественном числе.
theological_decisions:
- issue: Значение רוּחוֹ и характер Божьего действия
  choice: Свой ветер
  alternative: Свой дух; Своё дыхание
  rationale: 'Ближайший контекст описывает погоду: замёрзшая вода тает, ветер дует, воды текут. Поэтому «ветер» является наиболее вероятным контекстуальным значением, однако семантическая широта רוּחַ сохранена в примечании без исключения иных возможных смыслов.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим ритмом. Параллельные части разделены тире и точкой с запятой; прописные формы «Своё/Свой» помогают однозначно соотнести местоимения с Богом.
