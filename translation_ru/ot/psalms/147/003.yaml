  yaml_path: translation/ot/psalms/147/003.yaml
  text: He heals the brokenhearted and binds up their wounds[a].
translation:
  language: ru
  text: 'Он исцеляет сокрушённых сердцем

    и перевязывает их раны[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их боли»; также возможно: «их повреждения». Еврейское слово может обозначать боль или причинённое повреждение; вариант «раны» соответствует образу перевязывания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹפֵא
  choice: Он исцеляет
  rationale: Причастие породы qal описывает постоянное, характерное действие Бога; в современном русском языке это естественно передаётся личной формой настоящего времени.
- source_word: לִשְׁבוּרֵי לֵב
  choice: сокрушённых сердцем
  rationale: Сочетание буквально означает «сокрушённых сердцем». Выбранная формулировка сохраняет образ внутренней сломленности и звучит достойно и понятно в современном литературном русском.
- source_word: וּמְחַבֵּשׁ
  choice: и перевязывает
  rationale: Глагол חבש в контексте врачевания означает обвязывать или перевязывать повреждённое место. «Перевязывает» ясно сохраняет конкретный образ лечения.
- source_word: לְעַצְּבוֹתָם
  choice: их раны
  rationale: Существительное может обозначать болезненные повреждения или боли. «Раны» лучше всего сочетаются с глаголом «перевязывает», при этом параллелизм не исключает душевной боли.
theological_decisions:
- issue: Объём образа исцеления
  choice: Сохранить сочетание душевной сокрушённости и конкретного образа перевязывания ран.
  alternative: Передать стих либо исключительно как духовное утешение, либо исключительно как телесное исцеление.
  rationale: Поэтический параллелизм соединяет сокрушённое сердце с перевязыванием ран. Перевод не сужает этот образ до одной сферы страдания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Сохранены параллелизм и врачебная образность еврейского текста; архаичные и конфессионально маркированные обороты не используются.
