  source_fidelity: 'Глагол הַשָּׂם означает «устанавливает/полагает», а сочетание גְּבוּלֵךְ שָׁלוֹם буквально говорит о том, что Бог устанавливает мир в пределах адресата. В черновике «делает мирными твои пределы» передаёт общий смысл, но несколько меняет образ: еврейское גְּבוּלֵךְ имеет форму единственного числа с суффиксом и не требует русского множественного «пределы».'
  naturalness: «Водворяет мир в твоих пределах» — естественная для современного литературно-поэтического русского формулировка; она яснее, чем «делает мирными твои пределы», и сохраняет образ мира, установленного Богом. «Насыщает тебя отборной пшеницей» звучит естественно и точно в контексте изобилия.
  terminology: «Мир» сохраняет широту שָׁלוֹם, не ограничивая его лишь отсутствием войны. «Отборная пшеница» удачно передаёт идиоматическое חֵלֶב חִטִּים («жир/лучшая часть пшеницы»). Сноска корректно раскрывает буквальный образ.
