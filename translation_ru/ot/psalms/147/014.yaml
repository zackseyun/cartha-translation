lexical_decisions:
- source_word: הַשָּׂם
  choice: Он делает
  rationale: Причастная форма от שׂים («класть, помещать, делать») продолжает описание Божьих действий; в современном русском естественно передать её личной глагольной формой.
- source_word: גְּבוּלֵךְ שָׁלוֹם
  choice: мирными твои пределы
  rationale: גְּבוּל может обозначать границу, пределы или территорию, а שָׁלוֹם — мир, благополучие и безопасность. Такая формулировка близко передаёт предикативный смысл сочетания, не сводя его только к военной безопасности.
- source_word: חֵלֶב חִטִּים
  choice: лучшей пшеницей
  rationale: Буквально «жиром пшеницы»; חֵלֶב в подобных сочетаниях означает наиболее богатую, отборную часть. «Лучшая пшеница» естественно передаёт еврейскую идиому.
- source_word: יַשְׂבִּיעֵךְ
  choice: насыщает тебя
  rationale: Каузативная форма от שׂבע означает «насыщать, давать вдоволь». «Насыщает» сохраняет образ полного удовлетворения пищей.
