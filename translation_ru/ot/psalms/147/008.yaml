translation:
  language: ru
  text: Который покрывает небеса облаками, готовит для земли дождь, даёт взойти траве на горах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְכַסֶּה
  choice: покрывает
  rationale: Причастие от כסה обозначает покрытие или сокрытие; «покрывает» прямо и естественно передаёт образ облаков, закрывающих небеса.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Формально множественное שָׁמַיִם здесь означает небесный свод; «небеса» сохраняет поэтический и возвышенный регистр.
- source_word: עָבִים
  choice: облаками
  rationale: Слово обозначает облака, иногда густые; контекст не требует добавлять определение «густыми».
- source_word: מֵכִין
  choice: готовит
  rationale: Каузативная форма כון может означать «готовить, устраивать»; в сочетании с дождём выражает целенаправленное Божье обеспечение.
- source_word: לָאָרֶץ
  choice: для земли
  rationale: В контексте небес, облаков и дождя אֶרֶץ имеет широкий смысл «земля», а не локальное «страна».
- source_word: מָטָר
  choice: дождь
  rationale: Прямое и обычное значение существительного.
- source_word: מַצְמִיחַ
  choice: взращивает
  rationale: Каузатив от צמח означает «давать произрастать». «Взращивает» естественно выражает причиняющее действие и сохраняет поэтический тон.
- source_word: הָרִים
  choice: на горах
  rationale: Обычное значение — «горы»; ослаблять образ до «холмов» нет оснований.
- source_word: חָצִיר
  choice: траву
  rationale: В данном природном контексте חָצִיר естественнее всего передаётся словом «трава».
theological_decisions:
- issue: Божье действие выражено цепочкой причастий
  choice: Начальная относительная конструкция «Который покрывает…» с однородными сказуемыми «готовит» и «взращивает»
  alternative: Трижды повторить «Который…» или преобразовать всё в самостоятельные предложения «Он покрывает…»
  rationale: Еврейские определённые причастия продолжают описание Бога из предшествующего контекста и изображают Его постоянную деятельность. Начальное «Который» сохраняет эту связь, а однородные русские сказуемые избегают тяжеловесного повтора без изменения смысла.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис сохраняет связь стиха с предшествующим контекстом. Сноска английского консультационного текста не воспроизведена: её маркер стоит после «clouds», тогда как содержание относится к последней части строки и по существу лишь перефразирует выбранный перевод; источник не создаёт здесь значимой текстовой неоднозначности.'
