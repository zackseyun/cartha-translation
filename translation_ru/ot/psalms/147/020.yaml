  text: לֹ֘א עָ֤שָׂה כֵ֨ן לְ/כָל גּ֗וֹי וּ/מִשְׁפָּטִ֥ים בַּל יְדָע֗וּ/ם הַֽלְלוּ יָֽהּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/147/020.yaml
  text: He has not done so for any nation; they have not known his judgments[a]. Praise Yah!
translation:
  language: ru
  text: Он не сделал так ни для одного народа; Его постановлений они не знают. Хвалите Яха![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Аллилуйя!»; также возможно: «Хвалите Господа!» Еврейское выражение «халелу-ях» буквально означает «Хвалите Яха», где «Ях» — краткая форма Божьего имени.'
    reason: Лексическая альтернатива и пояснение краткой формы божественного имени.
lexical_decisions:
- source_word: לֹא עָשָׂה כֵן
  choice: Он не сделал такого
  rationale: Отрицание с перфектом עשה передаёт совершённое действие, а כֵן отсылает к описанному выше дарованию Божьего слова и установлений. «Такого» естественно передаёт эту анафорическую связь по-русски.
- source_word: לְכָל גּוֹי
  choice: ни для одного другого народа
  rationale: При отрицании כָּל имеет смысл «ни для какого». Слово «другого» ясно выражает подразумеваемое сопоставление Израиля с прочими народами, не меняя смысла исходного текста.
- source_word: וּמִשְׁפָּטִים
  choice: Его установлений
  rationale: מִשְׁפָּטִים здесь обозначает данные Богом нормативные постановления. «Установления» сохраняет правовой оттенок, но не сужает значение до судебных приговоров; притяжательное «Его» восполняется из контекста и соотносится с местоименным суффиксом следующего слова.
- source_word: בַּל יְדָעוּם
  choice: они не знают
  rationale: Поэтическое отрицание בַּל и перфект ידע с объектным суффиксом буквально означают «они их не знали/не знают». Настоящее время естественно по-русски передаёт сохраняющееся положение, а объект выражен предшествующим словом «установлений».
- source_word: הַלְלוּ יָהּ
  choice: Хвалите Яха!
  rationale: Императив множественного числа передан как обращённый ко многим призыв «Хвалите», а краткая форма божественного имени יָהּ транслитерирована как «Ях» с требуемым падежным окончанием.
theological_decisions:
- issue: Передача краткой формы божественного имени יָהּ
  choice: Яха
  alternative: Господа; Аллилуйя
  rationale: В еврейском тексте стоит краткая форма имени יָהּ, поэтому прозрачный перевод призыва с транслитерацией имени точнее, чем замена титулом «Господь» или передача всего выражения традиционной формой «Аллилуйя».
- issue: Смысл מִשְׁפָּטִים
  choice: установления
  alternative: суды; законы; постановления
  rationale: Контекст говорит о явленной Израилю Божьей нормативной воле. «Установления» сохраняет юридико-нормативный смысл и не ограничивает слово только судебными решениями или одним сводом законов.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмодическим звучанием. Синтаксис краток и параллелен; местоимение «Его» написано с прописной буквы согласно распространённой русской библейской традиции.
