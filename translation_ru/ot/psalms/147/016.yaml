  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּתֵן
  choice: Он даёт
  rationale: Причастие породы qal от נתן описывает постоянное действие Бога в гимнической последовательности. В современном русском естественна личная форма настоящего времени, сохраняющая обычный, повторяющийся характер действия.
- source_word: שֶׁלֶג
  choice: снег
  rationale: Прямое и общеупотребительное соответствие; контекст не требует иного значения.
- source_word: כַּצָּמֶר
  choice: словно шерсть
  rationale: Предлог сравнения כְּ с צֶמֶר образует поэтическое уподобление. «Словно шерсть» естественно передаёт образ белого мягкого покрова.
- source_word: כְּפוֹר
  choice: иней
  rationale: В данном образе כְּפוֹר обозначает осевший белый морозный налёт; русское «иней» точнее и нагляднее общего слова «мороз» и естественно сочетается с глаголом «рассыпает».
- source_word: כָּאֵפֶר
  choice: словно пепел
  rationale: Сравнительный כְּ с אֵפֶר передан естественным русским сравнительным оборотом. Собирательное «пепел» соответствует веществу, с которым сопоставляется иней.
- source_word: יְפַזֵּר
  choice: рассыпает
  rationale: Форма piel от פזר выражает разбрасывание или рассеивание. «Рассыпает» сохраняет яркий вещественный образ пепла и параллелизм строки.
