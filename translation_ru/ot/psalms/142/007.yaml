  text: ה֘וֹצִ֤יאָ/ה מִ/מַּסְגֵּ֨ר נַפְשִׁ/י֮ לְ/הוֹד֪וֹת אֶת שְׁ֫מֶ֥/ךָ בִּ֭/י יַכְתִּ֣רוּ צַדִּיקִ֑ים כִּ֖י תִגְמֹ֣ל עָלָֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/007.yaml
  text: Bring my soul out of prison[a], so that I may give thanks to your name; the righteous will gather around me, for you will deal bountifully with me.
translation:
  language: ru
  text: Выведи душу мою из темницы, чтобы мне воздать благодарение имени Твоему; праведники соберутся вокруг меня[a], потому что Ты окажешь мне милость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведники окружат меня». Еврейское выражение можно также, хотя это менее обычно, понять так: «праведники будут венчать себя благодаря мне» или «будут торжествовать благодаря мне».'
    reason: Лексическая неоднозначность глагола יַכְתִּרוּ и предлога בִּי.
lexical_decisions:
- source_word: הוֹצִיאָה
  choice: Выведи
  rationale: Каузативный императив от יצא выражает просьбу вывести наружу; «выведи» прямо и естественно передаёт действие.
- source_word: מִמַּסְגֵּר
  choice: из темницы
  rationale: מַסְגֵּר обозначает место заключения. «Темница» сохраняет образ заточения и соответствует возвышенному, но понятному регистру псалма.
- source_word: נַפְשִׁי
  choice: душу мою
  rationale: נֶפֶשׁ может означать душу, жизнь или самого человека. Буквальное выражение здесь естественно по-русски и сохраняет целостно-личный характер мольбы.
- source_word: לְהוֹדוֹת אֶת שְׁמֶךָ
  choice: чтобы мне славить имя Твоё
  rationale: Инфинитив выражает цель; ידה включает благодарение и хвалу. В русском сочетание «славить имя» звучит естественно и сохраняет упоминание Божьего имени.
- source_word: בִּי יַכְתִּרוּ צַדִּיקִים
  choice: праведники соберутся вокруг меня
  rationale: כּתר в данной форме допускает значение окружения, а בִּי — пространственное или причинное понимание. Основной перевод передаёт наиболее связный в контексте образ общины, окружающей избавленного псалмопевца; неоднозначность отмечена в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание ожидаемого отклика праведников.
- source_word: תִגְמֹל עָלָי
  choice: Ты явишь мне благость
  rationale: גמל с על может обозначать то, как с кем-либо поступают, в том числе благодеяние. Формулировка передаёт ожидаемое добро со стороны Бога, не превращая его однозначно в заслуженную награду.
theological_decisions:
- issue: Предполагает ли תִגְמֹל עָלָי награду по заслугам
  choice: Ожидаемое благодеяние Бога псалмопевцу
  alternative: Бог воздаст псалмопевцу по его заслугам
  rationale: Контекст мольбы об избавлении поддерживает благоприятное действие Бога, тогда как глагол сам по себе может выражать и воздаяние. Перевод не вносит утверждения о заслуженности, которого стих прямо не требует.
- issue: Как понимать реакцию праведников
  choice: Они соберутся вокруг избавленного псалмопевца
  alternative: Они окружат его; либо будут торжествовать или украшаться венцом благодаря ему
  rationale: Редкое и неоднозначное сочетание допускает несколько толкований. В основном тексте выбран контекстуально цельный пространственный образ, а иные возможности сохранены в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы. Порядок «душу мою» и слово «темница» поддерживают достоинство поэтического регистра, оставаясь понятными современному читателю.
