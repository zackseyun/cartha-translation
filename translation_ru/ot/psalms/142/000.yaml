  text: A Maskil[a] of David[b], when he was in the cave. A prayer.
translation:
  language: ru
  text: Маскил[a] Давида[b], когда он был в пещере. Молитва.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. маскил — специальный термин в заголовках псалмов; возможно, он обозначает созерцательное или наставительное произведение.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для Давида», «принадлежащий Давиду» либо «написанный Давидом»; еврейское надписание может указывать на авторство, посвящение или связь с Давидом.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: Маскил
  rationale: Это специальный термин в заголовках псалмов, точное значение которого неясно. Транслитерация сохраняет еврейское обозначение, не утверждая спорного толкования.
- source_word: לְדָוִד
  choice: Давида
  rationale: Естественная для русского заголовка конструкция, которая может выражать авторство, принадлежность или связь с Давидом и не сужает значение до однозначного «написанный Давидом».
- source_word: בִּהְיוֹתוֹ
  choice: когда он был
  rationale: Предлог ב с инфинитивом היה и местоименным суффиксом имеет здесь временное значение; выбран ясный современный русский оборот.
- source_word: בַמְּעָרָה
  choice: в пещере
  rationale: Определённая форма указывает на известную из контекста пещеру; русский язык естественно передаёт такую определённость без артикля.
- source_word: תְפִלָּה
  choice: Молитва
  rationale: Существительное служит отдельным жанровым обозначением в надписании псалма, поэтому оформлено как самостоятельная краткая фраза.
theological_decisions:
- issue: Связь надписания с Давидом
  choice: Давида
  alternative: для Давида; принадлежащий Давиду; написанный Давидом
  rationale: Еврейское לְדָוִד допускает авторство, посвящение, принадлежность или более общую связь; основной текст сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой надписания. Неясный технический термин сохранён транслитерацией; синтаксис сделан естественным без устранения смысловой неоднозначности.
