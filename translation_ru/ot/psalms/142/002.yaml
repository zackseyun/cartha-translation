source:
  edition: WLC
  text: אֶשְׁפֹּ֣ךְ לְ/פָנָ֣י/ו שִׂיחִ֑/י צָ֝רָתִ֗/י לְ/פָנָ֥י/ו אַגִּֽיד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/002.yaml
  text: I pour out my complaint before him[b][a]; I declare my distress before him.
translation:
  language: ru
  text: Изливаю перед Ним свою жалобу[a], перед Ним рассказываю о своей беде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своё сетование»; еврейское слово может также означать «размышление» или «раздумье», но в контексте плача, вероятнее всего, речь идёт о высказанной жалобе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о своей скорби», «о своём страдании».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁפֹּךְ
  choice: изливаю
  rationale: Сохраняет образ еврейского глагола «лить, изливать» и естественно звучит в контексте искренней молитвы.
- source_word: לְפָנָיו
  choice: перед Ним
  rationale: Передаёт буквальный смысл «перед Его лицом, в Его присутствии»; повтор сохранён в обоих полустишиях как элемент еврейского параллелизма.
- source_word: שִׂיחִי
  choice: свою жалобу
  rationale: Слово допускает значения размышления, сетования или жалобы; в контексте плача и в параллели с бедой наиболее вероятна высказанная Богу жалоба.
- source_word: צָרָתִי
  choice: о своей беде
  rationale: Естественно и достаточно широко передаёт значение «беда, теснота, скорбь, страдание», не уточняя, является ли переживание внешним или внутренним.
- source_word: אַגִּיד
  choice: рассказываю
  rationale: Hiphil глагола נגד означает «сообщать, объявлять, рассказывать». Здесь «рассказываю» естественно передаёт личное обращение к Богу и не придаёт ему излишне публичного оттенка.
