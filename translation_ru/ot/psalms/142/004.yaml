lexical_decisions:
- source_word: הַבֵּיט יָמִין וּרְאֵה
  choice: Посмотри направо и увидь
  rationale: Сохраняет два повелительных глагола и пространственное значение «направо», оставаясь естественным по-русски.
- source_word: מַכִּיר
  choice: признаёт
  rationale: Причастие от נכר здесь означает не просто знать, а узнавать или признавать человека; в контексте речь идёт об отсутствии сторонника.
- source_word: אָבַד מָנוֹס מִמֶּנִּי
  choice: не стало для меня убежища
  rationale: Передаёт исчезновение доступного прибежища и естественно выражает сочетание אָבַד с מִמֶּנִּי; значение מָנוֹס уточняется в сноске.
- source_word: דּוֹרֵשׁ לְנַפְשִׁי
  choice: заботится обо мне
  rationale: Буквальный образ «ищет мою жизнь/душу» в данном контексте означает проявлять участие и заботу о самом человеке; буквальная форма могла бы по-русски ошибочно звучать как угроза его жизни.
theological_decisions:
- issue: Значение נֶפֶשׁ в плаче
  choice: обо мне
  alternative: о моей жизни; о моей душе
  rationale: Здесь נֶפֶשׁ обозначает самого человека или его жизнь, а не обязательно отдельную нематериальную сущность. Перевод не навязывает более позднюю антропологическую схему, а сноска сохраняет образ исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Параллелизм сохранён посредством трёх кратких частей; архаизмы и потенциально двусмысленное русское выражение «ищет моей жизни» устранены.
