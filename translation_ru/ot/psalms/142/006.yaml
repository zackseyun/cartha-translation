    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Внемли
  rationale: Повелительная форма קשׁב означает внимательное слушание. «Внемли» передаёт настойчивую молитвенную просьбу и сохраняет достойный поэтический регистр.
- source_word: רִנָּתִי
  choice: моему воплю
  rationale: В плаче רִנָּה обозначает громкий зов о помощи; «вопль» здесь точнее, чем «пение» или нейтральное «просьба».
- source_word: כִּי
  choice: ведь
  rationale: В обоих случаях союз вводит основание просьбы. «Ведь» естественно передаёт причинно-пояснительную связь в современной русской молитвенной речи.
- source_word: דַלּוֹתִי מְאֹד
  choice: я совсем изнемог
  rationale: Форма от דלל выражает состояние крайнего ослабления, истощения или умаления. «Совсем изнемог» естественно по-русски передаёт достигнутое состояние и усилитель מְאֹד.
- source_word: הַצִּילֵנִי
  choice: избавь меня
  rationale: В контексте נצל означает конкретное избавление от преследователей. Русское «избавь» передаёт спасение от непосредственной опасности без ненужного расширения смысла.
- source_word: מֵרֹדְפַי
  choice: от преследующих меня
  rationale: Причастие רדף буквально указывает на тех, кто гонится за говорящим. Описательный оборот сохраняет действие и не сужает его до религиозного преследования.
- source_word: אָמְצוּ מִמֶּנִּי
  choice: они сильнее меня
  rationale: Глагол אמץ обозначает силу, а מן имеет сравнительное значение; русский сравнительный оборот прямо и естественно передаёт эту конструкцию.
theological_decisions:
- issue: Возможное расширение значения просьбы о спасении
  choice: избавь меня
  alternative: спаси меня
  rationale: Здесь речь непосредственно идёт об избавлении от человеческих преследователей. «Избавь меня» сохраняет конкретный смысл, не исключая богословского измерения молитвы, но и не навязывая его.
- issue: Характер слабости псалмопевца
  choice: я совсем изнемог
  alternative: я крайне унижен / я стал очень слаб
  rationale: Еврейское דַלּוֹתִי допускает оттенки ослабления, умаления и доведения до бедственного состояния. Основной текст передаёт физически и душевно понятное изнеможение, а примечание сохраняет более широкую смысловую возможность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенно-поэтическим оттенком. «Внемли» и «вопль» уместны для псалма и остаются понятными современному читателю; синтаксис краток и естественен.
