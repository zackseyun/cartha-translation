  text: זָעַ֥קְתִּי אֵלֶ֗י/ךָ יְה֫וָ֥ה אָ֭מַרְתִּי אַתָּ֣ה מַחְסִ֑/י חֶ֝לְקִ֗/י בְּ/אֶ֣רֶץ הַֽ/חַיִּים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/005.yaml
  text: I cried out to you[a], O Yahweh; I said, “You are my refuge, my portion in the land of the living.”
translation:
  language: ru
  text: 'Я воззвал к Тебе, Яхве; я сказал: «Ты — моё убежище, моя доля на земле живых».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָעַקְתִּי
  choice: Я воззвал
  rationale: Глагол זעק выражает сильный крик, нередко зов о помощи. «Воззвал» сохраняет напряжённость молитвенного обращения и остаётся естественным для возвышенной поэтической речи.
- source_word: אֵלֶיךָ
  choice: к Тебе
  rationale: Предлог указывает, к кому направлен зов; русское «к Тебе» точно и естественно передаёт эту направленность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя, поскольку в еврейском тексте стоит тетраграмматон יהוה, а не титул אֲדֹנָי. Форма «Яхве» — распространённая научная передача имени по-русски.
- source_word: אָמַרְתִּי
  choice: я сказал
  rationale: Обычное значение אמר и последовательность завершённых действий переданы простым прошедшим временем без усиления смысла.
- source_word: אַתָּה
  choice: Ты —
  rationale: Самостоятельное местоимение в еврейском подчёркнуто; русская конструкция с тире естественно передаёт именное сказуемое и акцент на адресате.
- source_word: מַחְסִי
  choice: моё убежище
  rationale: מַחְסֶה обозначает место защиты и безопасности. «Убежище» точно и понятно современному читателю.
- source_word: חֶלְקִי
  choice: моя доля
  rationale: חֵלֶק означает выделенную человеку долю или удел. «Моя доля» сохраняет образ принадлежащей псалмопевцу части, не сужая его до формального наследства.
- source_word: בְּאֶרֶץ הַחַיִּים
  choice: на земле живых
  rationale: Устойчивый еврейский образ обозначает область земной жизни в противоположность смерти и шеолу; русская формулировка сохраняет сам образ.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет собственное имя Бога. Транслитерация сохраняет различие между יהוה и титулом «Господь», не добавляя в основной текст отсутствующего в оригинале титула.
- issue: Смысл выражения חֶלְקִי
  choice: моя доля
  alternative: моё наследие
  rationale: «Наследие» могло бы преждевременно сузить многозначный образ до наследственного владения. «Доля» сохраняет как идею назначенного удела, так и исповедание того, что сам Бог составляет всё принадлежащее молящемуся.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Синтаксический параллелизм еврейской строки сохранён; архаизмы вроде «удел мой» и «в земле живущих» не использованы. Прописные буквы в местоимениях прямого обращения поддерживают принятый в русской религиозной письменности уважительный регистр.
