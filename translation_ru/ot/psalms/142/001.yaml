  yaml_path: translation/ot/psalms/142/001.yaml
  text: With my voice I cry out to Yahweh[c][b][a]; with my voice I plead to Yahweh for mercy.
translation:
  language: ru
  text: Голосом своим взываю к Яхве; голосом своим молю Яхве о милости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ק֭וֹלִי
  choice: во весь голос
  rationale: Буквально «моим голосом». Русское «во весь голос» естественно передаёт слышимый, настойчивый характер обращения; повтор сохранён ради еврейского акцента и поэтического параллелизма.
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает направленность обращения к Яхве; с глаголами «взывать» и «молить» это естественно выражается русским «к» либо падежным управлением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: אֶזְעָק
  choice: я взываю
  rationale: Глагол זעק обозначает громкий, настойчивый крик о помощи. «Взываю» соответствует возвышенному поэтическому регистру и остаётся понятным современному читателю.
- source_word: אֶתְחַנָּן
  choice: молю о милости
  rationale: Форма от חנן выражает настойчивую просьбу о благосклонности или милости. Такой перевод естественен по-русски и сохраняет смысл обращения за милостью.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя, поэтому транслитерация «Яхве» сохраняет лексическое различие между именем и титулом.
- issue: Смысл אֶתְחַנָּן
  choice: молю о милости
  alternative: умоляю
  rationale: Дополнение «о милости» явно передаёт заложенную в корне חנן просьбу о благосклонности, не связывая её с узкой конфессиональной трактовкой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Симметричный повтор «во весь голос» воспроизводит параллелизм оригинала; пунктуация разделяет две тесно связанные строки.
