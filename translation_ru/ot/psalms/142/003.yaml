base_translation:
  language: en
  yaml_path: translation/ot/psalms/142/003.yaml
  text: When my spirit grows faint within me[a], you know my path. On the way where I walk[b], they have hidden a trap for me.
translation:
  language: ru
  text: Когда мой дух изнемогает во мне[a], Ты знаешь мой путь. На дороге, которой я иду, они спрятали для меня ловушку[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда мой дух подавлен во мне».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «силок».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִתְעַטֵּף
  choice: когда… изнемогает
  rationale: Предлог ב при инфинитиве образует временную конструкцию. Глагол описывает ослабление или состояние подавленности; «изнемогает» естественно передаёт тяжёлое внутреннее состояние, не устраняя допустимую неоднозначность.
- source_word: רוּחִי
  choice: мой дух
  rationale: רוּחַ здесь обозначает внутреннюю жизнь или дух псалмопевца, а не ветер; прямое и понятное соответствие — «мой дух».
- source_word: עָלַי
  choice: во мне
  rationale: Буквально предлог может означать «на мне/надо мной», но в сочетании с изнемогающим духом русская идиома требует «во мне», указывая на внутреннее состояние.
- source_word: יָדַעְתָּ
  choice: Ты знаешь
  rationale: 'Перфектная форма в поэтическом контексте допускает настоящее стативное значение: Бог знает путь молящегося в момент бедствия.'
- source_word: נְתִיבָתִי
  choice: мою стезю
  rationale: Существительное обозначает тропу или путь. «Стезя» сохраняет образ жизненного пути и достойный поэтический регистр, оставаясь понятным современному читателю.
- source_word: בְּאֹרַח זוּ אֲהַלֵּךְ
  choice: на пути, по которому я иду
  rationale: זוּ выступает как относительная частица, а הלך передаёт движение или образ действий. Формулировка естественна по-русски и сохраняет метафору пути.
- source_word: טָמְנוּ
  choice: они скрыли
  rationale: Глагол означает спрятать или тайно устроить; прошедшее время передаёт совершённое враждебное действие без излишнего уточнения вида ловушки.
- source_word: פַח
  choice: ловушку
  rationale: פַח — ловушка или силок. «Ловушка» наиболее доступна современному читателю, а более конкретный вариант отмечен в сноске.
- source_word: לִי
  choice: для меня
  rationale: Предлог с местоименным суффиксом указывает, что ловушка предназначена псалмопевцу; буквальное «для меня» сохраняет сжатость оригинала.
theological_decisions:
- issue: Знание Богом пути псалмопевца
  choice: Ты знаешь мою стезю
  alternative: Ты знал мою стезю
  rationale: В поэзии форма יָדַעְתָּ может выражать настоящее состояние знания. Настоящее время подчёркивает осведомлённость Бога среди нынешней беды, не добавляя к тексту особого доктринального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Стезя» выбрана ради образности и различения נְתִיבָה и אֹרַח; синтаксис остальной строки остаётся простым и общедоступным.
