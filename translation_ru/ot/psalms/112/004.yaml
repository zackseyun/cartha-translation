  text: זָ֘רַ֤ח בַּ/חֹ֣שֶׁךְ א֭וֹר לַ/יְשָׁרִ֑ים חַנּ֖וּן וְ/רַח֣וּם וְ/צַדִּֽיק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/004.yaml
  text: Light dawns in the darkness for the upright[a]; he is gracious and compassionate and righteous.
translation:
  language: ru
  text: Во тьме восходит свет для честных[a]; он милостив, сострадателен и праведен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Во тьме восходит свет для честных — милостивый, сострадательный и праведный». Последние определения могут относиться к «свету» и перекликаться с описанием Господа в Псалме 110:4.'
    reason: alternative_reading
lexical_decisions:
- source_word: זָרַח
  choice: восходит
  rationale: Глагол обозначает восход или появление света. Настоящее время естественно для русского поэтического изречения и передаёт обобщённую истину, выраженную здесь еврейским перфектом.
- source_word: בַּחֹשֶׁךְ
  choice: во тьме
  rationale: Краткое и естественное соответствие предложной форме с определённым существительным; сохраняет как буквальный, так и переносный смысл.
- source_word: אוֹר
  choice: свет
  rationale: Существительное является подлежащим первой части стиха; без артикля по-русски оно звучит естественно и поэтично.
- source_word: לַיְשָׁרִים
  choice: для людей с прямым сердцем
  rationale: Передаёт нравственную прямоту יְשָׁרִים понятным современным выражением и сохраняет отличие от צַדִּיק («праведен») в конце стиха.
- source_word: חַנּוּן
  choice: милостив
  rationale: Передаёт качество того, кто оказывает милость и благоволение; форма мужского рода сохраняет грамматическую неоднозначность еврейского текста.
- source_word: רַחוּם
  choice: сострадателен
  rationale: Выражает деятельное сочувствие и не сливается по значению с חַנּוּן.
- source_word: צַדִּיק
  choice: праведен
  rationale: Прямо передаёт нравственно-религиозное значение слова и сохраняет ключевую лексику псалма.
theological_decisions:
- issue: К кому относятся три заключительных определения (חַנּוּן וְרַחוּם וְצַדִּיק)
  choice: В основном тексте они отнесены к праведному человеку, описываемому в псалме, посредством местоимения «он».
  alternative: Определения могут характеризовать «свет» или перекликаться с качествами Господа в Псалме 110:4.
  rationale: Определения стоят в единственном числе, хотя יְשָׁרִים имеет множественное число. Контекст псалма неоднократно говорит об одном праведном человеке, однако словесная перекличка с предыдущим псалмом не позволяет полностью исключить другие связи; поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Выражение «люди с прямым сердцем» понятно широкому читателю и позволяет не смешивать יְשָׁרִים с צַדִּיק. Нумерация Псалма 110 в сноске соответствует принятой в русской традиции нумерации; в иной системе это Псалом 111.
