  text: Сердце его твердо; он не устрашится, пока не увидит поражения своих врагов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к буквальному: «пока не увидит своих противников». В этом выражении речь, вероятно, идёт о созерцании желанного исхода по отношению к ним; оно может подразумевать их поражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָמוּךְ
  choice: твердо
  rationale: Страдательное причастие от סמך передает состояние опоры, утвержденности и устойчивости. В сочетании с «сердце» наречное сказуемое «твердо» естественно по-русски и сохраняет образ внутренней стойкости.
- source_word: לִבּוֹ
  choice: его сердце
  rationale: לֵב обозначает сердце как внутренний центр мысли, воли и решимости; традиционный русский эквивалент здесь сохраняет широту образа.
- source_word: לֹא יִירָא
  choice: он не устрашится
  rationale: Имперфект ירא допускает будущее или устойчиво-характеризующее значение. «Не устрашится» передает непреходящую уверенность и соответствует возвышенному поэтическому регистру.
- source_word: עַד אֲשֶׁר
  choice: пока не
  rationale: Сочетание вводит временную границу. Русское «пока не» естественно передает конструкцию, а контекст последующей победы не предполагает, что после этого страх вернется.
- source_word: יִרְאֶה בְצָרָיו
  choice: увидит поражение своих врагов
  rationale: Буквально выражение говорит о том, что он «увидит на/в своих противниках»; конструкция ראה ב в контексте торжества и оправдания может подразумевать созерцание желанного исхода для врагов. Добавление «поражение» делает подразумеваемый смысл ясным по-русски, не создавая ложного впечатления, будто бесстрашие длится лишь до встречи с врагами.
- source_word: צָרָיו
  choice: своих врагов
  rationale: צַר может обозначать врага, недруга или враждебного противника. «Враги» — ясный, краткий и поэтически уместный русский эквивалент.
theological_decisions:
- issue: Смысл созерцания врагов в заключительной строке
  choice: увидит поражение своих врагов
  alternative: увидит своих врагов
  rationale: Более буквальный вариант сохраняет формальную неопределенность, но по-русски способен означать лишь встречу с врагами и тем самым ошибочно представить ее границей бесстрашия. Контекст псалма и конструкция ראה ב указывают на то, что праведник станет свидетелем желанного исхода над противниками; степень подразумеваемого торжества отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической интонацией. Синтаксис краток и параллелен оригиналу; архаизм «доколе» не используется. «Не устрашится» выбрано как понятное современному читателю, но более торжественное, чем разговорное «не испугается».
