  text: הוֹן וָ/עֹ֥שֶׁר בְּ/בֵית֑/וֹ וְ֝/צִדְקָת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/003.yaml
  text: Wealth and riches are in his house[a], and his righteousness stands forever.
translation:
  language: ru
  text: Богатство и изобилие — в его доме, и его праведность пребывает вовек.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его справедливость пребывает вовек».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹן
  choice: богатство
  rationale: Передаёт материальное состояние или имущество и сохраняет первый член поэтической пары с עֹשֶׁר.
- source_word: וָעֹשֶׁר
  choice: и изобилие
  rationale: Сохраняет отдельный оттенок второго существительного и избегает неестественного русского сочетания двух почти тождественных слов.
- source_word: בְּבֵיתוֹ
  choice: в его доме
  rationale: Сохраняет конкретный образ еврейского текста; более широкий смысл «в его хозяйстве/семье» остаётся возможным.
- source_word: וְצִדְקָתוֹ
  choice: и его праведность
  rationale: В контексте псалма естественно обозначает праведность самого богобоязненного человека; возможный оттенок справедливости отмечен в сноске.
- source_word: עֹמֶדֶת
  choice: пребывает
  rationale: Естественно по-русски выражает устойчивость и продолжительность, заложенные в причастии от עמד, не сводя смысл лишь к буквальному «стоит».
- source_word: לָעַד
  choice: вовек
  rationale: Кратко и в достойном поэтическом регистре передаёт неограниченную длительность.
theological_decisions:
- issue: Значение выражения «его праведность» на фоне материального благословения
  choice: Праведность богобоязненного человека, включая устойчивую нравственную прямоту и возможный оттенок щедрости
  alternative: Божье оправдание этого человека либо специальное учение о вменённой праведности
  rationale: Грамматика и контекст Псалма 112 относят местоимение к описываемому праведнику. Перевод сохраняет прямой смысл и не вводит более поздние догматические категории.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Тире перед обстоятельством сохраняет компактность и параллелизм строки; «вовек» уместно для псалма и понятно современному читателю.
