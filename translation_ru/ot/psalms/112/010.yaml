source:
  edition: WLC
  text: רָ֘שָׁ֤ע יִרְאֶ֨ה וְ/כָעָ֗ס שִׁנָּ֣י/ו יַחֲרֹ֣ק וְ/נָמָ֑ס תַּאֲוַ֖ת רְשָׁעִ֣ים תֹּאבֵֽד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/010.yaml
  text: The wicked man will see and be angry[a]; he will gnash his teeth and melt away; the desire of the wicked will perish.
translation:
  language: ru
  text: Нечестивый увидит и разгневается[a], заскрежещет зубами и истает; желание нечестивых погибнет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нечестивые увидят и разгневаются». В еврейском тексте стоит единственное число, употреблённое в обобщённом смысле.'
    reason: 'Лексико-грамматическая альтернатива: представительное единственное число можно естественно передать по-русски множественным.'
lexical_decisions:
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное мужского рода единственного числа; русское «нечестивый» сохраняет грамматическую форму и допускает обобщённое значение.
- source_word: יִרְאֶה
  choice: увидит
  rationale: Имперфект Qal 3 м. ед. в контексте итогового противопоставления естественно передаётся будущим временем.
- source_word: וְכָעָס
  choice: и разгневается
  rationale: Форма продолжает поэтическую последовательность; «разгневается» естественно и точно передаёт כעס.
- source_word: שִׁנָּיו יַחֲרֹק
  choice: будет скрежетать зубами
  rationale: Сохраняет телесный образ ярости и досады; в русском это устойчивое и понятное выражение.
- source_word: וְנָמָס
  choice: и истает
  rationale: Передаёт метафору таяния или угасания, сохраняя поэтическую выразительность и не сводя значение исключительно к физической гибели.
- source_word: תַּאֲוַת
  choice: желание
  rationale: Широкий современный эквивалент, охватывающий желание, стремление и вожделение без неоправданного сужения смысла.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Множественное число передано буквально и естественно в конструкции родительного падежа.
- source_word: תֹּאבֵד
  choice: погибнет
  rationale: Точно передаёт полную утрату и несбыточность желания; форма согласована с существительным «желание».
theological_decisions:
- issue: Обобщённое значение мужского единственного רָשָׁע
  choice: нечестивый
  alternative: нечестивые / нечестивый человек
  rationale: Основной текст сохраняет мужское единственное число оригинала, но оно имеет представительное, а не исключительно мужское значение; это пояснено в сноске.
- issue: Объект глагола «увидит»
  choice: оставить невыраженным, как в еврейском тексте
  alternative: добавить «это» или разъяснить, что речь о благополучии праведного
  rationale: Источник не называет объект прямо; сохранение эллипсиса удерживает поэтическую связь с предыдущими стихами и не устраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой поэзии. «Истает» несколько возвышенно, но понятно и сохраняет яркую метафору оригинала; синтаксис краток и ритмичен.
