base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/001.yaml
  text: Praise Yah! Blessed is the man who fears Yahweh[b][a], who greatly delights in his commandments.
translation:
  language: ru
  text: Хвалите Ях![a] Блажен муж[b], который боится Яхве и весьма любит его заповеди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционной передаче: «Аллилуйя!»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «муж»; в этом изречении мудрости форма мужского рода в единственном числе употреблена в обобщённом смысле.'
    reason: cultural_note
lexical_decisions:
- source_word: הַ֥לְלוּ יָ֨הּ
  choice: Хвалите Ях!
  rationale: Передаёт повелительное множественное число הַלְלוּ и сохраняет краткую форму божественного имени יָהּ, не смешивая её с формой יְהוָה далее в стихе.
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Сохраняет форму мудростного изречения о достойном зависти благополучии и возвышенный, но понятный современному читателю регистр.
- source_word: אִישׁ
  choice: муж
  rationale: Сохраняет мужское единственное число оригинала и его представительный характер в изречении мудрости; примечание поясняет обобщённое употребление.
- source_word: יָרֵא אֶת יְהוָה
  choice: боится Яхве
  rationale: Глагол «боится» сохраняет прямое значение יָרֵא и присущее тексту напряжение между страхом, благоговением и почтением; имя יְהוָה передано как «Яхве».
- source_word: בְּמִצְוֺתָיו
  choice: в его заповедях
  rationale: Сохраняет предлог בְּ и весомое значение существительного מִצְוֹת; местоимение относится к Яхве.
- source_word: חָפֵץ מְאֹד
  choice: находит великую радость
  rationale: Естественно по-русски выражает удовольствие и глубокое расположение, обозначенные חָפֵץ, а прилагательное «великую» передаёт усиление מְאֹד.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Передача краткой формы имени יָהּ
  choice: Ях
  alternative: Аллилуйя; Господь
  rationale: «Ях» сохраняет краткую форму имени и её отличие от יְהוָה во второй части стиха; традиционный возглас указан в примечании.
- issue: Обобщённое мужское אִישׁ
  choice: муж
  alternative: человек; тот
  rationale: Оригинал использует существительное мужского рода в единственном числе как представительный образ в наставлении мудрости; это сохраняется без ограничения смысла только мужчинами.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром псалма мудрости. Слово «муж» намеренно сохраняет форму оригинала, а необычное для русской традиции «Ях» поясняется примечанием.
