  text: פִּזַּ֤ר נָ֘תַ֤ן לָ/אֶבְיוֹנִ֗ים צִ֭דְקָת/וֹ עֹמֶ֣דֶת לָ/עַ֑ד קַ֝רְנ֗/וֹ תָּר֥וּם בְּ/כָבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/009.yaml
  text: He has distributed freely[a]; he has given to the poor. His righteousness stands forever[c][b]; his horn will be lifted up in honor.
translation:
  language: ru
  text: Он щедро раздаёт, даёт нуждающимся. Его праведность пребывает вовеки[a]; его рог вознесётся во славе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его справедливость пребывает вовеки». Еврейское слово может означать и праведность, и справедливость.'
    reason: lexical_alternative
  - marker: b
    text: '«Рог» — древнееврейский образ силы, достоинства и возвышенного положения. Последнюю строку можно также перевести: «его рог вознесётся с честью».'
    reason: cultural_note_and_lexical_alternative
lexical_decisions:
- source_word: פִּזַּר
  choice: щедро раздавал
  rationale: Буквально глагол передаёт рассеивание; в контексте помощи нуждающимся он означает широкую, щедрую раздачу. Такой перевод естественен по-русски и сохраняет образ открытой щедрости.
- source_word: נָתַן
  choice: давал
  rationale: Прямой перевод глагола; несовершенный вид в русском выражает характерное для праведника действие и поддерживает параллелизм с «раздавал».
- source_word: לָאֶבְיוֹנִים
  choice: нуждающимся
  rationale: אֶבְיוֹן обозначает бедного, нуждающегося человека. «Нуждающимся» точно передаёт состояние нужды и звучит естественно в современном русском.
- source_word: צִדְקָתוֹ
  choice: его праведность
  rationale: Слово охватывает праведность и справедливость. «Праведность» сохраняет нравственно-богословскую широту и не сводит смысл исключительно к благотворительности или общественной справедливости.
- source_word: עֹמֶדֶת לָעַד
  choice: пребывает вовеки
  rationale: Оборот выражает непреходящую устойчивость. «Пребывает вовеки» естественно для возвышенной поэзии и передаёт длительность без ослабления утверждения.
- source_word: קַרְנוֹ
  choice: его рог
  rationale: Сохранена древнееврейская метафора силы, достоинства и возвышенного положения; её значение поясняется в сноске, а не подменяется толкованием в основном тексте.
- source_word: תָּרוּם
  choice: вознесётся
  rationale: Глагол означает стать высоким, быть возвышенным. «Вознесётся» кратко и поэтически сочетается с образом рога, не уточняя, кем совершается возвышение.
- source_word: בְּכָבוֹד
  choice: в чести
  rationale: כָבוֹד может обозначать честь, достоинство или славу. Здесь «в чести» ясно передаёт почётное возвышение праведника; возможный оттенок славы сохранён в сноске.
theological_decisions:
- issue: Связь «его праведности» с милостыней
  choice: Фраза обозначает непреходящую праведность щедрого человека, проявляющуюся в его поступке, но не сводимую к нему.
  alternative: Понимать выражение только как указание на благотворительность либо преимущественно как на заветную справедливость.
  rationale: Широкое слово «праведность» сохраняет связь между характером и делом человека, не вводя идеи заслуженного спасения и не ограничивая смысл одной этической категорией.
- issue: Образ поднятого рога
  choice: Сохранить метафору возвышения силы и достоинства.
  alternative: 'Передать толковательно: «его достоинство» или «его сила возвысится».'
  rationale: Исходный поэтический образ богословски не требует однозначного сведения к силе, почёту или статусу; сноска позволяет сохранить его смысловой диапазон.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Синтаксический параллелизм сохранён; архаизирующее «вовеки» уместно как понятное поэтическое слово. Метафора рога оставлена в основном тексте и разъяснена в сноске.
