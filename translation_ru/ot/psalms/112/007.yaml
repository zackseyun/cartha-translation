  text: מִ/שְּׁמוּעָ֣ה רָ֭עָה לֹ֣א יִירָ֑א נָכ֥וֹן לִ֝בּ֗/וֹ בָּטֻ֥חַ בַּ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/007.yaml
  text: He will not fear bad news[a]; his heart is steadfast[b], trusting in Yahweh.
translation:
  language: ru
  text: Он не устрашится дурной вести[a]; его сердце твердо[b] и уповает на Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злого слуха» или «плохого известия».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его сердце утверждено» или «его сердце непоколебимо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְּׁמוּעָה רָעָה
  choice: дурной вести
  rationale: Сочетание обозначает неблагоприятную, тревожную весть, а не нравственно злой слух; «дурная весть» естественно и точно передает смысл.
- source_word: לֹא יִירָא
  choice: не устрашится
  rationale: Имперфект в контексте псалма мудрости выражает характерное поведение; форма будущего времени сохраняет аспект исходного текста.
- source_word: נָכוֹן
  choice: твердо
  rationale: Слово описывает сердце как утвержденное, устойчивое и непоколебимое; наречная конструкция естественна по-русски.
- source_word: לִבּוֹ
  choice: его сердце
  rationale: «Сердце» сохраняет библейский образ внутреннего человека, его воли и расположения.
- source_word: בָּטֻחַ
  choice: уповает
  rationale: Форма выражает уверенное доверие; русский глагол «уповает» естественно сочетается с объектом доверия и сохраняет возвышенный библейский регистр.
- source_word: בַּיהוָה
  choice: на Яхве
  rationale: Предлог указывает на Того, кому доверяют; тетраграмматон передан личным именем «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не заменяя его титулом.
- issue: Связь בָּטֻחַ с נָכוֹן לִבּוֹ
  choice: его сердце твердо и уповает на Яхве
  alternative: его сердце твердо, уверено в Яхве
  rationale: Так сохраняется смысловая связь твердости сердца с доверием Яхве без утверждения более узкого синтаксического разбора, чем допускает еврейский текст.
translation_notes:
  register: Современный литературный русский с достоинством поэтического текста. «Устрашится» и «уповает» слегка возвышенны, но понятны современному читателю; параллелизм и образ сердца сохранены.
