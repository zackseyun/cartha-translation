  text: כִּֽי לְ/עוֹלָ֥ם לֹא יִמּ֑וֹט לְ/זֵ֥כֶר ע֝וֹלָ֗ם יִהְיֶ֥ה צַדִּֽיק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/112/006.yaml
  text: For he will never be shaken[a]; the righteous will be remembered forever.
translation:
  language: ru
  text: Ибо он не поколеблется вовек; праведник останется в памяти навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к предыдущему утверждению; «ибо» сохраняет связующую силу и соответствует возвышенному поэтическому регистру.
- source_word: לְעוֹלָם לֹא יִמּוֹט
  choice: не поколеблется вовек
  rationale: Сочетание отрицания с לְעוֹלָם выражает непреходящую устойчивость. «Не поколеблется вовек» естественно передаёт образ невозможности быть сдвинутым или лишиться устойчивости.
- source_word: לְזֵכֶר עוֹלָם
  choice: останется в памяти навеки
  rationale: Еврейское именное выражение буквально говорит о вечной памяти; русская глагольная конструкция ясно передаёт непреходящее воспоминание о праведнике.
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода единственного числа естественно и точно передаётся русским существительным «праведник», которое здесь обозначает типичного праведного человека.
- source_word: יִהְיֶה
  choice: останется
  rationale: В сочетании с выражением «в памяти» контекстуальное «останется» естественно передаёт будущую продолжительность состояния, не меняя смысла связочного глагола.
theological_decisions:
- issue: Обобщающее значение мужского рода единственного числа צַדִּיק
  choice: праведник
  alternative: праведный человек / праведные
  rationale: «Праведник» сохраняет грамматическое число и род исходного текста и при этом в русском языке естественно служит обобщающим обозначением всякого праведного человека; отдельная сноска не требуется.
- issue: Характер непреходящей памяти
  choice: останется в памяти навеки
  alternative: будет в вечной памяти
  rationale: Перевод сохраняет утверждение текста об enduring remembrance, не уточняя, идёт ли речь о человеческой памяти, Божьей памяти или обеих, поскольку источник этого не определяет.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Параллелизм двух полустиший сохранён; архаизирующее «вовек» уместно в поэзии и сбалансировано общеупотребительным оборотом «останется в памяти».
