lexical_decisions:
- source_word: טוֹב אִישׁ
  choice: Хорош тот
  rationale: Передаёт начальную предикативную конструкцию естественным современным русским языком, сохраняя положительную оценку человека.
- source_word: חוֹנֵן
  choice: милостив
  rationale: Сохраняет значение благосклонности и милости, не сужая его только до материальной щедрости.
- source_word: וּמַלְוֶה
  choice: и даёт взаймы
  rationale: Прямо и ясно передаёт экономическое действие каузативного причастия от לוה без добавления отсутствующего в тексте оттенка безвозмездности.
- source_word: יְכַלְכֵּל
  choice: ведёт
  rationale: В сочетании с «дела» глагол естественно означает распоряжаться, управлять или вести.
- source_word: דְּבָרָיו
  choice: свои дела
  rationale: В данном контексте слово естественно обозначает дела или обстоятельства человека, хотя лексически возможно и значение «слова».
- source_word: בְּמִשְׁפָּט
  choice: справедливо
  rationale: Передаёт этико-правовой смысл מִשְׁפָּט естественным русским наречием.
