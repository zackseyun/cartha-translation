  - marker: b
    text: 'Или: «в стране»; еврейское אֶרֶץ может означать как землю вообще, так и определённую землю или страну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבּוֹר
  choice: сильным
  rationale: В данном именном сказуемом слово обозначает силу или влиятельность потомства, не обязательно воинскую доблесть. «Сильным» сохраняет широту значения и не вносит излишне военного оттенка.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: אֶרֶץ может означать как конкретную страну или землю, так и землю вообще. Русское «на земле» естественно в данном контексте и сохраняет часть исходной многозначности; более узкий вариант отмечен в сноске.
- source_word: יִהְיֶה
  choice: будет
  rationale: Простая современная передача формы глагола היה, выражающей обещание или ожидаемый результат благословения.
- source_word: זַרְעוֹ
  choice: его потомство
  rationale: זֶרַע здесь собирательно обозначает потомков. «Потомство» естественно по-русски, сохраняет собирательность и не имеет архаического буквального оттенка слова «семя».
- source_word: דּוֹר
  choice: поколение
  rationale: Передаёт דּוֹר без сведения его смысла исключительно к ближайшим детям или ко всему далёкому потомству.
- source_word: יְשָׁרִים
  choice: прямых
  rationale: «Прямых» сохраняет образ нравственной прямоты в יָשָׁר и не смешивает это слово с отдельным еврейским обозначением «праведный» (צַדִּיק).
- source_word: יְבֹרָךְ
  choice: будет благословенно
  rationale: Явно сохраняет пассивное значение ברך и богословски насыщенную речь о благословении, не сводя её лишь к материальному процветанию.
theological_decisions:
- issue: Объём обещанного благословения в псалме мудрости
  choice: Сохранено широкое утверждение о силе потомства и благословении поколения прямых.
  alternative: Ограничить смысл либо материальным благополучием, либо гарантированным спасением потомков.
  rationale: Еврейский текст говорит о силе и благословении в широком смысле и не уточняет их исключительно материальную или сотериологическую природу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и следует параллелизму еврейского стиха; «прямых» намеренно сохраняет исходный нравственный образ и лексическое отличие от «праведных».
