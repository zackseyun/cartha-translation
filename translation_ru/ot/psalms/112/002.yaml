  text: His offspring will be mighty in the land[b][a]; the generation of the upright will be blessed.
translation:
  language: ru
  text: Его потомство[a] будет сильным на земле[b]; поколение честных будет благословенно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его потомки»; еврейское слово имеет собирательное значение.'
