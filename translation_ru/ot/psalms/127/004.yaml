  text: כְּ/חִצִּ֥ים בְּ/יַד גִּבּ֑וֹר כֵּ֝֗ן בְּנֵ֣י הַ/נְּעוּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/004.yaml
  text: Like arrows in the hand of a warrior[a], so are the sons of one's youth.
translation:
  language: ru
  text: Как стрелы в руке воина — таковы сыновья, рождённые в молодости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/חִצִּים
  choice: Как стрелы
  rationale: חִצִּים — обычное обозначение стрел; предлог כְּ вводит прямое сравнение.
- source_word: בְּ/יַד
  choice: в руке
  rationale: Буквально передаёт единственное число יָד и естественно выражает образ стрел, которыми распоряжается воин.
- source_word: גִּבּוֹר
  choice: воина
  rationale: В данном воинском образе גִּבּוֹר означает сильного, доблестного бойца; «воин» по-русски точно и естественно соответствует контексту.
- source_word: כֵּן
  choice: таковы
  rationale: Слово завершает сопоставление «как… так…»; «таковы» сохраняет краткую афористичную структуру.
- source_word: בְּנֵי
  choice: сыновья
  rationale: Мужская форма множественного числа прямо означает «сыновья»; её не следует без необходимости обобщать до «детей».
- source_word: הַ/נְּעוּרִים
  choice: рождённые в молодости
  rationale: Буквальное «сыновья молодости» в современном русском неясно. В сочетании с בְּנֵי выражение идиоматически указывает на сыновей, появившихся у человека в молодые годы.
theological_decisions:
- issue: Гендерно маркированное выражение בְּנֵי הַנְּעוּרִים
  choice: сыновья, рождённые в молодости
  alternative: дети, рождённые в молодости
  rationale: Еврейский текст употребляет явно мужское существительное «сыновья», и образ следующего стиха связан с общественной опорой семьи. Перевод сохраняет грамматический и контекстуальный пол, не расширяя значение до всех детей.
- issue: Смысл конструкции בְּנֵי הַנְּעוּרִים
  choice: сыновья, рождённые в молодости
  alternative: сыновья молодости
  rationale: Формально возможное «сыновья молодости» сохраняет структуру оригинала, но в современном русском звучит неестественно и допускает ошибочное понимание, будто молодыми являются сами сыновья. Выбранная формулировка явно передаёт наиболее вероятное идиоматическое значение.
translation_notes:
  register: Краткий, образный и достойный литературный русский. Парная конструкция «Как… — таковы…» сохраняет поэтическое сравнение и афористичность еврейской строки; тире передаёт паузу между её половинами.
