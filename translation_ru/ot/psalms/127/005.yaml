  text: אַשְׁרֵ֤י הַ/גֶּ֗בֶר אֲשֶׁ֤ר מִלֵּ֥א אֶת אַשְׁפָּת֗/וֹ מֵ֫/הֶ֥ם לֹֽא יֵבֹ֑שׁוּ כִּֽי יְדַבְּר֖וּ אֶת אוֹיְבִ֣ים בַּ/שָּֽׁעַר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/005.yaml
  text: Blessed is the man who fills his quiver with them[c][b][a]; they will not be put to shame when they speak with enemies in the gate.
translation:
  language: ru
  text: Блажен муж, наполнивший ими свой колчан! Они не будут посрамлены[a], когда будут говорить[b] с врагами у ворот[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они не постыдятся». Некоторые считают, что речь идёт только об отце, и переводят: «он не будет посрамлён». В еврейском тексте глаголы стоят во множественном числе.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «вступят в спор с врагами» или «будут отстаивать перед врагами своё дело». В этой обстановке глагол может иметь судебный или состязательный оттенок.'
    reason: lexical_alternative
  - marker: c
    text: Городские ворота в древности служили местом суда, общественных разбирательств и деловых встреч.
    reason: cultural_note
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Идиоматическая форма вводит изречение-блаженство. «Блажен» сохраняет возвышенный тон псалма мудрости и не сводит смысл к субъективному ощущению счастья.
- source_word: הַגֶּבֶר
  choice: муж
  rationale: Существительное обозначает взрослого мужчину, здесь — отца, о сыновьях которого говорится в контексте. «Муж» точно сохраняет грамматический род и уместен в возвышенной поэтической речи.
- source_word: מִלֵּא
  choice: наполнивший
  rationale: Перфект описывает человека как уже наполнившего колчан; причастная конструкция естественно передаёт эту характеристику по-русски.
- source_word: אַשְׁפָּתוֹ
  choice: свой колчан
  rationale: Слово означает колчан для стрел. Возвратное «свой» естественно соотносит колчан с подлежащим и сохраняет метафору предыдущего стиха.
- source_word: מֵהֶם
  choice: ими
  rationale: 'Предлог в данном контексте указывает на содержимое: колчан наполнен «ими», то есть сыновьями, уподобленными стрелам в предыдущем стихе.'
- source_word: לֹא יֵבֹשׁוּ
  choice: они не будут посрамлены
  rationale: Форма глагола множественного числа сохранена. Страдательная формулировка передаёт публичный аспект позора, особенно у городских ворот.
- source_word: כִּי
  choice: когда
  rationale: Союз вводит обстоятельство, при котором они не будут посрамлены; временное «когда» естественно передаёт связь предложений.
- source_word: יְדַבְּרוּ
  choice: будут говорить
  rationale: Основное значение глагола — «говорить». Контекст допускает судебный спор или защиту дела, но основной текст не сужает заложенную в еврейском неоднозначность.
- source_word: אֶת אוֹיְבִים
  choice: с врагами
  rationale: Конструкция обозначает сторону, с которой вступают в речь или спор. «С врагами» сохраняет широту исходного выражения.
- source_word: בַּשָּׁעַר
  choice: у ворот
  rationale: В русском языке «у ворот» естественно обозначает место публичных разбирательств у городских ворот; культурное значение поясняется в сноске.
theological_decisions:
- issue: Мужской род обозначения отца
  choice: муж
  alternative: человек; тот, кто
  rationale: Еврейское слово грамматически и семантически обозначает мужчину и в контексте относится к отцу. Перевод не нейтрализует эту особенность текста.
- issue: Множественное число глаголов לֹא יֵבֹשׁוּ и יְדַבְּרוּ
  choice: они не будут посрамлены… будут говорить
  alternative: он не будет посрамлён… будет говорить
  rationale: Масоретский текст содержит формы множественного числа, вероятно относящиеся к отцу вместе с сыновьями или ко всей семье. Основной текст сохраняет грамматическое число и не устраняет смысловое напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. «Блажен муж» сохраняет жанр изречения-блаженства; остальной синтаксис остаётся ясным и современным. Все смысловые альтернативы, которые нельзя уверенно разрешить по еврейскому тексту, вынесены в сноски.
