  text: Вот, дети — наследие от Яхве[a], плод чрева — награда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети — наследие Яхве».'
    reason: 'Альтернативное грамматическое понимание конструкции: она может указывать не на источник наследия, а на его принадлежность Яхве.'
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт привлекающую внимание и выразительную силу еврейской частицы естественным для современной русской поэзии словом.
- source_word: נַחֲלַת יְהוָה
  choice: наследие от Яхве
  rationale: Конструкция допускает значение принадлежности или источника. Здесь параллель с «наградой» поддерживает смысл дара, исходящего от Яхве; слово «наследие» сохраняет образ оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, стоящее в еврейском тексте, принятой русской транслитерацией.
- source_word: בָּנִים
  choice: дети
  rationale: Форма мужского рода множественного числа в данном контексте обозначает потомство в целом, а не только сыновей.
- source_word: שָׂכָר
  choice: награда
  rationale: Передаёт положительный метафорический смысл слова без нежелательного оттенка коммерческой платы.
- source_word: פְּרִי הַבָּטֶן
  choice: плод чрева
  rationale: Сохраняет поэтический телесный образ и библейскую межтекстовую связь, оставаясь понятным в возвышенном русском регистре.
theological_decisions:
- issue: Значение сопряжённой конструкции נַחֲלַת יְהוָה
  choice: дети — наследие от Яхве
  alternative: дети — наследие Яхве
  rationale: Грамматика допускает как источник дара, так и принадлежность Богу. Параллелизм с «наградой» несколько сильнее поддерживает значение источника, однако альтернативное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Традиционный образ «плод чрева» сохранён ради образности и библейского звучания; тире ясно выражают две параллельные именные конструкции.
