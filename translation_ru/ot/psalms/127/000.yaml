  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לִ/שְׁלֹ֫מֹ֥ה אִם יְהוָ֤ה לֹא יִבְנֶ֬ה בַ֗יִת שָׁ֤וְא עָמְל֣וּ בוֹנָ֣י/ו בּ֑/וֹ אִם יְהוָ֥ה לֹֽא יִשְׁמָר עִ֝֗יר שָׁ֤וְא שָׁקַ֬ד שׁוֹמֵֽר־׀־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/000.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor over it in vain. Unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: ru
  text: 'Песнь восхождений. Соломона.[a]


    Если Яхве не построит дом,[b]

    напрасно строители трудятся над ним;

    если Яхве не охраняет город,

    напрасно бодрствует страж.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское надписание можно также понять как «для Соломона» или «принадлежащая Соломону»: оно может указывать на авторство, посвящение или иную связь с Соломоном.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово «дом» может также означать семью, род или династию.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Традиционное и точное обозначение цикла паломнических песен; сохраняет конкретный образ восхождения, не сужая его до одного предполагаемого исторического употребления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: בַיִת
  choice: дом
  rationale: Основное значение слова и прямой объект строительства; возможные значения «семья», «род» или «династия» отмечены в сноске.
- source_word: עָמְלוּ ... בּוֹ
  choice: строители трудятся над ним
  rationale: Предлог «над» естественно передаёт работу по возведению дома и сохраняет явную отсылку местоимения בּוֹ к дому.
- source_word: שָׁקַד שׁוֹמֵר
  choice: бодрствует страж
  rationale: Сохраняет образ неусыпного дозора и параллелизм стиха без избыточного пояснения.
theological_decisions:
- issue: Значение לִשְׁלֹמֹה в надписании
  choice: Соломона
  alternative: Для Соломона; о Соломоне; принадлежащая Соломону
  rationale: Краткая традиционная формулировка естественна по-русски, однако еврейская конструкция сама по себе не позволяет окончательно решить, обозначает ли она авторство, посвящение или связь с Соломоном; неоднозначность вынесена в сноску.
- issue: Возможный переносный смысл «дома»
  choice: В основном тексте сохранён конкретный «дом»
  alternative: семья; род; династия
  rationale: Непосредственный контекст говорит о строителях, поэтому конкретный смысл первичен, но более широкий библейский оттенок не исключён и указан в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Синтаксис четырёх строк следует структуре еврейского текста; имя Яхве передано открыто и единообразно. Формулировки понятны широкому читателю, но сохраняют достоинство псалма.
