  text: שָׁ֤וְא לָ/כֶ֨ם מַשְׁכִּ֪ימֵי ק֡וּם מְאַֽחֲרֵי שֶׁ֗בֶת אֹ֭כְלֵי לֶ֣חֶם הָ/עֲצָבִ֑ים כֵּ֤ן יִתֵּ֖ן לִֽ/ידִיד֣/וֹ שֵׁנָֽא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/002.yaml
  text: It is in vain for you to rise early[a], to sit up late, eating the bread of toil; for he gives sleep to his beloved.
translation:
  language: ru
  text: 'Напрасно вам вставать рано, засиживаться допоздна и есть хлеб тяжкого труда: ведь Он даёт Своему возлюбленному сон.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «так Он даёт Своему возлюбленному во сне» или «Он даёт Своему возлюбленному, пока тот спит». Еврейская фраза предельно сжата и может означать либо то, что Бог дарует сам сон, либо то, что Он даёт Свои дары даже во время сна.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁוְא
  choice: напрасно
  rationale: Передаёт идею тщетности и бесполезности напряжённых усилий; естественно вводит весь последующий ряд действий.
- source_word: מַשְׁכִּימֵי קוּם
  choice: встаёте рано
  rationale: Точно и естественно передаёт конструкцию, обозначающую ранний подъём.
- source_word: מְאַחֲרֵי שֶׁבֶת
  choice: засиживаетесь допоздна
  rationale: Сохраняет образ длительного сидения и ясно противопоставляется раннему подъёму, подразумевая затянувшийся труд.
- source_word: אֹכְלֵי לֶחֶם הָעֲצָבִים
  choice: едите хлеб тяжкого труда
  rationale: Сохраняет метафору хлеба и передаёт עֲצָבִים как мучительный, изнурительный труд, не сводя значение только к душевной скорби или тревоге.
- source_word: כֵּן
  choice: ведь
  rationale: В данном контексте естественно вводит основание для утверждения о тщетности изнуряющих усилий; буквальные «так» или «таким образом» возможны, но менее ясно передают связь частей стиха.
- source_word: יִתֵּן
  choice: даёт
  rationale: Настоящее время выражает общее, постоянно верное утверждение; подразумеваемый субъект — Бог, о котором говорится в контексте псалма.
- source_word: לִידִידוֹ
  choice: Своему любимому
  rationale: Передаёт единственное число и оттенок близости; местоимение с прописной буквы ясно указывает на Бога в соответствии с русской библейской традицией, не добавляя нового содержания.
- source_word: שֵׁנָא
  choice: сон
  rationale: Основное значение существительного — «сон». В главном тексте оно понято как прямое дополнение при глаголе «даёт», а синтаксическая неоднозначность отмечена в сноске.
theological_decisions:
- issue: Сжатый синтаксис כֵּן יִתֵּן לִידִידוֹ שֵׁנָא
  choice: ведь Он даёт Своему любимому сон
  alternative: так Он даёт Своему любимому во сне; Он даёт Своему любимому, пока тот спит
  rationale: Еврейский текст допускает понимание слова «сон» либо как того, что Бог даёт, либо как указания на обстоятельство, при котором Бог даёт Свои дары. Основное чтение естественно продолжает противопоставление тревожного труда дарованному Богом покою, а альтернативы сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм действий сохранён, а выражение «засиживаетесь допоздна» делает древнееврейский образ понятным современному читателю.
