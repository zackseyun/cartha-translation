id: PSA.127.1
reference: Psalms 127:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּֽעֲל֗וֹת לִ/שְׁלֹ֫מֹ֥ה אִם יְהוָ֤ה לֹא יִבְנֶ֬ה בַ֗יִת שָׁ֤וְא עָמְל֣וּ בוֹנָ֣י/ו בּ֑/וֹ אִם יְהוָ֥ה לֹֽא יִשְׁמָר עִ֝֗יר שָׁ֤וְא שָׁקַ֬ד שׁוֹמֵֽר־׀־׀־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/127/001.yaml
  text: A Song of Ascents[a]. Of Solomon. Unless Yahweh builds the house, its builders labor in vain; unless Yahweh guards the city[c][b], the watchman stays awake in vain.
translation:
  language: ru
  text: 'Песнь восхождений. Соломона[a].

    Если Яхве не построит дом[b],

    напрасно трудятся над ним строители;

    если Яхве не охранит город,

    напрасно бодрствует страж.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Для Соломона» или «Связанная с Соломоном». Еврейское надписание может указывать на авторство, посвящение или иную связь.'
    reason: alternative_reading
  - marker: b
    text: Еврейское слово «дом» может также означать семью, род или династию.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Сохраняет лексическое значение מַעֲלוֹת и принятое название цикла псалмов, не сводя его смысл только к паломничеству.
- source_word: לִשְׁלֹמֹה
  choice: Соломона
  rationale: Краткая и традиционная форма надписания; сноска сохраняет неоднозначность предлога ל, который может указывать на авторство, посвящение или связь.
- source_word: אִם ... לֹא
  choice: Если ... не
  rationale: Естественная русская условная конструкция, точно передающая смысл «если не / если только не» в обеих параллельных строках.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: יִבְנֶה בַיִת
  choice: построит дом
  rationale: Сохраняет конкретный образ строительства; возможные расширенные значения «семья» и «династия» отмечены в сноске.
- source_word: שָׁוְא
  choice: напрасно
  rationale: Естественно выражает тщетность усилий и позволяет сохранить повтор в двух параллельных частях стиха.
- source_word: עָמְלוּ בֹנָיו בּוֹ
  choice: трудятся над ним строители
  rationale: Передаёт напряжённый труд строителей и местоименную отсылку к дому без неестественной для русского языка буквальной конструкции «его строители трудятся в нём».
- source_word: יִשְׁמָר עִיר
  choice: охранит город
  rationale: Глагол שׁמר здесь означает защиту и охрану, что поддерживается параллельным образом стража.
- source_word: שָׁקַד
  choice: бодрствует
  rationale: Передаёт буквальный образ неусыпной бдительности, не дублируя значение существительного «страж».
- source_word: שׁוֹמֵר
  choice: страж
  rationale: Краткое и уместное в поэтическом контексте обозначение человека, охраняющего город.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет отличие имени от титула.
- issue: Значение בַיִת в контексте псалма мудрости
  choice: дом
  alternative: семья; род; династия
  rationale: Параллель с городом и стражем поддерживает конкретный образ здания, однако сноска сохраняет более широкий семантический диапазон еврейского слова.
- issue: Связь Соломона с псалмом в надписании
  choice: Соломона
  alternative: для Соломона; относящаяся к Соломону
  rationale: Еврейский предлог ל не позволяет с полной уверенностью решить, обозначены ли авторство, посвящение или иная связь; неоднозначность явно сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Сохранены параллелизм, повтор «напрасно» и конкретные образы дома, города и стража; синтаксис сделан естественным для широкого круга читателей.
