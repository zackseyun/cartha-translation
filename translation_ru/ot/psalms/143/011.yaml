  text: לְמַֽעַן שִׁמְ/ךָ֣ יְהוָ֣ה תְּחַיֵּ֑/נִי בְּ/צִדְקָתְ/ךָ֓ תוֹצִ֖יא מִ/צָּרָ֣ה נַפְשִֽׁ/י־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/011.yaml
  text: For the sake of your name[a], O Yahweh, preserve my life[d][c][b]; in your righteousness bring my soul out of distress.
translation:
  language: ru
  text: Ради имени Твоего, Яхве, сохрани мне жизнь[a]; по праведности Твоей выведи душу мою из беды[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оживи меня», «дай мне жизнь». Еврейский глагол может означать сохранение жизни или восстановление жизненных сил.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «праведностью Твоей»; возможен также перевод «по справедливости Твоей».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «душу мою»; в еврейской речи это может означать «меня» или «мою жизнь». «Из беды» можно также перевести «из скорби» или «из бедственного положения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן שִׁמְךָ
  choice: Ради имени Твоего
  rationale: Сохраняет цельно-мотивирующее значение לְמַעַן и библейский образ имени как явленной чести и славы Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: תְּחַיֵּנִי
  choice: сохрани мне жизнь
  rationale: Порода пиэль глагола חיה здесь может означать сохранение или восстановление жизни; в контексте мольбы об избавлении выбран естественный русский оборот без указания на воскресение.
- source_word: בְּצִדְקָתְךָ
  choice: по праведности Твоей
  rationale: Предлог ב допускает смысл основания или средства. Оборот «по праведности» естественно выражает просьбу действовать согласно Божьей праведности, не устраняя возможного инструментального оттенка.
- source_word: תוֹצִיא
  choice: выведи
  rationale: Сохраняет каузативное и конкретно-образное значение породы хифиль глагола יצא — «вывести, заставить выйти».
- source_word: מִצָּרָה
  choice: из беды
  rationale: צָרָה обозначает беду, тесноту, скорбь или тяжёлое положение; «беда» ясно и поэтически естественно в данном контексте.
- source_word: נַפְשִׁי
  choice: душу мою
  rationale: Сохраняет еврейский антропологический образ и поэтическую форму, хотя по смыслу выражение может обозначать самого молящегося или его жизнь.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Смысл צְדָקָה в просьбе об избавлении
  choice: праведность
  alternative: справедливость; верность
  rationale: «Праведность» сохраняет широкий нравственный и богословский смысл слова, включая верность Бога Своему характеру, тогда как «справедливость» могла бы неоправданно сузить его до судебного значения.
- issue: Референт נַפְשִׁי
  choice: душу мою
  alternative: меня; мою жизнь
  rationale: Буквальный образ сохранён в основном тексте, но примечание поясняет, что в еврейском употреблении речь может идти о человеке в целом, а не об отделимой части его существа.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим строем. Постпозиция притяжательного местоимения («имени Твоего», «праведности Твоей», «душу мою») поддерживает поэтическое достоинство, оставаясь понятной. Синтаксис следует параллелизму еврейского стиха.
