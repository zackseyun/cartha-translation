base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/003.yaml
  text: For an enemy has pursued my soul[a]; he has crushed my life to the ground; he has made me dwell in dark places[b], like those long dead.
translation:
  language: ru
  text: Ибо враг преследовал мою душу[a], сокрушил мою жизнь до земли, поселил меня в тёмных местах, словно я давно умер[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «меня самого»; древнееврейское «моя душа» часто обозначает самого человека.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как давно умершие». Возможно также: «как умершие навеки».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт причинно-пояснительную связь с предшествующей мольбой и естественно звучит в русской поэтической речи.
- source_word: רָדַף אוֹיֵב
  choice: враг преследует
  rationale: «Преследует» сохраняет прямой смысл глагола; неопределённость существительного без артикля в русском не требует слова «некий», которое здесь звучало бы неестественно.
- source_word: נַפְשִׁי
  choice: мою душу
  rationale: Сохраняет еврейский поэтический образ и отличает נֶפֶשׁ от следующего חַיָּתִי; сноска поясняет, что речь может идти о самом человеке.
- source_word: דִּכָּא לָאָרֶץ חַיָּתִי
  choice: втоптал мою жизнь в землю
  rationale: «Втоптал» ярко и естественно передаёт сокрушение и унижение до земли; «мою жизнь» соответствует значению חַיָּתִי в контексте.
- source_word: הוֹשִׁיבַנִי בְמַחֲשַׁכִּים
  choice: поселил меня во тьме
  rationale: Каузативная форма передана глаголом «поселил»; собирательное русское «во тьме» естественно выражает пребывание в мрачной области, хотя еврейское слово имеет форму множественного числа.
- source_word: כְּמֵתֵי עוֹלָם
  choice: словно давно умерших
  rationale: Передаёт наиболее вероятный временной смысл עוֹלָם — умершие в давние времена, оставленные во мраке и забвении.
theological_decisions:
- issue: Смысл נַפְשִׁי
  choice: «мою душу» с пояснением значения «меня самого»
  alternative: «меня» или «мою жизнь»
  rationale: Буквальный образ сохранён без утверждения позднейшего антропологического разделения души и тела; сноска удерживает обычное древнееврейское значение целостного «я».
- issue: Временной смысл כְּמֵתֵי עוֹלָם
  choice: «словно давно умерших»
  alternative: «словно умерших навеки»
  rationale: Контекст вероятнее указывает на умерших издревле, однако возможный оттенок безвозвратности не устраняется и отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Синтаксис сжатый и ритмичный; сохранены параллелизм, образ души, поверженной жизни и пребывания во тьме.
