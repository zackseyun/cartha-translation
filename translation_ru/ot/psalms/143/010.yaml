base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/010.yaml
  text: Teach me to do your will[a], for you are my God. Let your good Spirit lead me in level ground.
translation:
  language: ru
  text: Научи меня исполнять Твою волю, ведь Ты — мой Бог. Пусть Твой благой Дух[a] ведёт меня по ровной земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть Твой благой дух ведёт меня». В еврейском письме нет различия между прописными и строчными буквами, поэтому эти слова можно понимать как указание на Божьего Духа либо, в более общем смысле, на Божий благой дух или расположение.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְּדֵנִי
  choice: Научи меня
  rationale: 'Пиэль, императив с суффиксом 1-го лица единственного числа: просьба научить или наставить говорящего. «Научи меня» естественно и прямо звучит в современной русской молитвенной речи.'
- source_word: לַעֲשׂוֹת רְצוֹנֶךָ
  choice: исполнять Твою волю
  rationale: Буквально — «делать Твою волю». Русское «исполнять волю» естественно передаёт практическое осуществление того, чего желает Бог, не сводя просьбу лишь к познанию Его воли.
- source_word: כִּי אַתָּה אֱלֹהָי
  choice: ведь Ты — мой Бог
  rationale: כִּי указывает на основание просьбы. «Ведь» сохраняет причинно-обосновывающую связь и естественно звучит по-русски.
- source_word: רוּחֲךָ טוֹבָה
  choice: Твой благой Дух
  rationale: רוּחֲךָ означает «Твой дух/Дух», а טוֹבָה — «добрый, благой». «Благой» сохраняет характеристику Божьего Духа и соответствует достоинству молитвенного регистра; прописная буква отражает вероятное понимание как Божьего Духа, но неоднозначность отмечена в сноске.
- source_word: תַּנְחֵנִי
  choice: Пусть … ведёт меня
  rationale: Хифиль от נחה означает «вести, направлять». Конструкция с «пусть» естественно передаёт молитвенно-пожелательный оттенок формы.
- source_word: בְּאֶרֶץ מִישׁוֹר
  choice: по ровной земле
  rationale: מִישׁוֹר обозначает ровное место или равнину и может также вызывать ассоциацию с прямотой. «По ровной земле» сохраняет пространственный образ безопасного, беспрепятственного пути.
theological_decisions:
- issue: Следует ли понимать רוּחֲךָ как Божьего Духа или как Божий дух/расположение
  choice: Твой благой Дух
  alternative: Твой благой дух
  rationale: Обращение непосредственно к Богу и выражение «Твой дух» естественно допускают понимание Божьего Духа. Однако в еврейском письме нет различения прописных и строчных букв, поэтому иной оттенок не исключён и сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с естественным, сдержанно возвышенным молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы как принято в русском религиозном тексте; это не устраняет отмеченную сноской неоднозначность слова רוּחַ.
