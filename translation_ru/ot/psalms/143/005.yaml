lexical_decisions:
- source_word: זָכַרְתִּי
  choice: Вспоминаю
  rationale: Перфект 1-го лица ед. числа допускает передачу прошедшим временем, однако в поэтическом контексте обозначает совершаемое псалмопевцем припоминание; настоящее время естественно связывает три параллельных действия.
- source_word: יָמִים מִקֶּדֶם
  choice: дни давние
  rationale: Кратко и поэтично передаёт давние, прежние времена без излишней архаизации.
- source_word: הָגִיתִי
  choice: размышляю
  rationale: Глагол הגה выражает сосредоточенное размышление; выбранное слово естественно в современном русском и сохраняет созерцательный характер строки.
- source_word: בְּכָל פָּעֳלֶךָ
  choice: обо всех Твоих деяниях
  rationale: Собирательное значение פֹּעַל передано множественным числом, более естественным после «всех» в русском; «деяния» сохраняет возвышенный, но понятный регистр.
- source_word: בְּמַעֲשֵׂה יָדֶיךָ
  choice: дела Твоих рук
  rationale: Сохранён конкретный антропоморфный образ рук, а не заменён более отвлечённым толкованием.
- source_word: אֲשׂוֹחֵחַ
  choice: обдумываю
  rationale: В данном параллелизме שׂיח вероятнее обозначает внутреннее размышление, хотя может также относиться к речи. «Обдумываю» отличает его от הגה и не разрушает смысловой параллелизм.
