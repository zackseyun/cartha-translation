  source_fidelity: 'Текст точно передаёт структуру и смысл еврейского стиха: надписание «Псалом Давида» сохраняет неоднозначность לְדָוִד; два параллельных призыва услышать молитву переданы различимыми, уместными в поэзии глаголами; תַּחֲנוּנַי передано как «мольбы». «По верности Твоей… по праведности Твоей» допустимо передаёт неоднозначную функцию בְּ, не навязывая одного толкования.'
