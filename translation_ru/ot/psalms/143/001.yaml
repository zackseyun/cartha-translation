  variant: modern literary Russian
source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֤ה שְׁמַ֬ע תְּפִלָּתִ֗/י הַאֲזִ֥ינָ/ה אֶל תַּחֲנוּנַ֑/י בֶּ/אֱמֻנָתְ/ךָ֥ עֲ֝נֵ֗/נִי בְּ/צִדְקָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/001.yaml
  text: A psalm of David[a]. O Yahweh, hear my prayer; give ear to my pleas for mercy. In your faithfulness answer me[c][b], in your righteousness.
translation:
  language: ru
  text: Псалом Давида[a]. Яхве, услышь мою молитву, внемли моим мольбам! По верности Твоей ответь мне, по праведности Твоей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Псалом, принадлежащий Давиду», «Псалом Давида» может указывать на авторство, принадлежность или связь с Давидом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в верности Твоей… в праведности Твоей»; последнее слово можно также перевести как «справедливости». Еврейский предлог допускает понимание этих качеств как образа действия или основания ответа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшееся жанровое обозначение в надписаниях псалмов.
- source_word: לְדָוִד
  choice: Давида
  rationale: Родительный падеж сохраняет возможные значения принадлежности, авторства или связи с Давидом, не сводя их к одному.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: שְׁמַע תְּפִלָּתִי
  choice: услышь мою молитву
  rationale: Прямо и естественно передаёт повелительную просьбу и её объект.
- source_word: הַאֲזִינָה אֶל־תַּחֲנוּנַי
  choice: внемли моим мольбам
  rationale: «Внемли» сохраняет усиленную просьбу об attentive hearing и поэтический параллелизм; «мольбы» передаёт настойчивые прошения о благосклонности.
- source_word: בֶּאֱמֻנָתְךָ
  choice: по верности Твоей
  rationale: אֱמוּנָה здесь обозначает надёжность и верность Бога; «по» естественно сохраняет возможность понимать ב как образ действия или основание просьбы.
- source_word: עֲנֵנִי
  choice: ответь мне
  rationale: Обычное молитвенное значение глагола; благоприятный характер ответа остаётся подразумеваемым контекстом.
- source_word: בְּצִדְקָתֶךָ
  choice: по праведности Твоей
  rationale: Сохраняет параллелизм с «по верности Твоей» и выражает обращение к праведному характеру Бога, не исключая оттенка справедливости.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя, не подменяя его титулом.
- issue: Смысл ב в בֶּאֱמֻנָתְךָ и בְּצִדְקָתֶךָ
  choice: по верности Твоей… по праведности Твоей
  alternative: в верности Твоей… в праведности Твоей; благодаря верности Твоей… благодаря праведности Твоей
  rationale: Предлог может указывать на образ действия или основание ответа. Русское «по» оставляет эту связь достаточно открытой и звучит естественно.
- issue: Значение צְדָקָה
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» шире передаёт нравственную прямоту и надёжность Божьего действия; возможный судебный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим регистром. «Внемли» уместно в молитвенной поэзии и сохраняет различие между двумя параллельными глаголами слуха. Местоимения, обращённые к Богу, оформлены с прописной буквы согласно распространённой русской издательской традиции.
