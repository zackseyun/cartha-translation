source:
  edition: WLC
  text: וּֽ/בְ/חַסְדְּ/ךָ֮ תַּצְמִ֪ית אֹ֫יְבָ֥/י וְֽ֭/הַאֲבַדְתָּ כָּל צֹרֲרֵ֣י נַפְשִׁ֑/י כִּ֝֗י אֲנִ֣י עַבְדֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/012.yaml
  text: And in your steadfast love you will cut off my enemies[a], and you will destroy all the adversaries of my soul[b], for I am your servant.
translation:
  language: ru
  text: И по Своей неизменной любви Ты истребишь моих врагов[a] и погубишь всех, кто теснит душу мою[b], ведь я — Твой слуга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своей неизменной любовью»; еврейский предлог может указывать не только на основание, но и на средство действия.'
    reason: lexical_alternative
  - marker: b
    text: «Душу мою» может также означать «мою жизнь» или просто «меня».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְחַסְדְּךָ
  choice: И по Своей неизменной любви
  rationale: חֶסֶד обозначает верную, постоянную любовь и милость, нередко в контексте заветной верности. Предлог ב здесь естественно передать как основание действия («по»), не исключая инструментального оттенка.
- source_word: תַּצְמִית
  choice: Ты истребишь
  rationale: Hiphil от צמת выражает прекращение существования, уничтожение. «Истребишь» сохраняет силу глагола и отличается от следующего «погубишь».
- source_word: אֹיְבַי
  choice: моих врагов
  rationale: Прямое соответствие форме множественного числа с суффиксом первого лица.
- source_word: וְהַאֲבַדְתָּ
  choice: и погубишь
  rationale: Hiphil от אבד значит «заставить погибнуть, погубить». Выбор сохраняет сильный смысл и поэтическое варьирование параллельных глаголов.
- source_word: כָּל צֹרֲרֵי נַפְשִׁי
  choice: всех, кто теснит душу мою
  rationale: Причастие צרר обозначает тех, кто враждебно притесняет или теснит. Глагольная конструкция естественна по-русски, а «душу мою» сохраняет многозначность נֶפֶשׁ и возвышенный поэтический строй.
- source_word: כִּי אֲנִי עַבְדֶּךָ
  choice: ведь я — Твой слуга
  rationale: כִּי вводит основание просьбы, естественно передаваемое «ведь». עֶבֶד в молитвенном обращении выражает принадлежность Богу, смирение и служение; «слуга» здесь точнее по контексту, чем социально маркированное «раб».
theological_decisions:
- issue: Просьба об уничтожении врагов
  choice: 'Сохранить прямой и сильный язык Божьего суда: «истребишь» и «погубишь».'
  alternative: Смягчить до «победишь», «остановишь» или «заставишь умолкнуть».
  rationale: Еврейские глаголы выражают уничтожение и гибель. Перевод не должен устранять напряжение, присущее молитве гонимого псалмопевца о Божьем суде.
- issue: Значение נַפְשִׁי
  choice: «душу мою» с пояснением возможных значений.
  alternative: «мою жизнь» или «меня».
  rationale: Буквальное поэтическое выражение сохраняет широту נֶפֶשׁ и не навязывает узкого антропологического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Инверсия «душу мою» сохраняет псалмический ритм и остается понятной. Заглавные местоимения в обращении к Богу применены последовательно.
