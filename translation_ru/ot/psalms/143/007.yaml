  text: מַ֘הֵ֤ר עֲנֵ֨/נִי יְהוָה֮ כָּלְתָ֪ה ר֫וּחִ֥/י אַל תַּסְתֵּ֣ר פָּנֶ֣י/ךָ מִמֶּ֑/נִּי וְ֝/נִמְשַׁ֗לְתִּי עִם יֹ֥רְדֵי בֽוֹר׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/007.yaml
  text: Answer me quickly[a], O Yahweh; my spirit fails. Do not hide your face from me, or I will become like those who go down to the pit.
translation:
  language: ru
  text: 'Скорее ответь мне, Яхве: дух мой изнемог. Не скрывай от меня Своего лица, иначе я уподоблюсь тем, кто сходит в яму[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могилу». Буквально: «в яму»; это поэтический образ смерти.'
    reason: 'Лексическая альтернатива: «могила» передаёт подразумеваемый контекст смерти, тогда как основной текст сохраняет конкретный образ еврейского בור — «яма».'
lexical_decisions:
- source_word: מַהֵר עֲנֵנִי
  choice: Скорее ответь мне
  rationale: 'Императив מַהֵר при просьбе עֲנֵנִי передаёт настоятельность: псалмопевец просит ответить без промедления. «Скорее» естественно в современной русской молитвенной речи.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» общепринята в современной русской библеистике.
- source_word: כָּלְתָה רוּחִי
  choice: дух мой изнемог
  rationale: Глагол כלה выражает исчерпание сил, истощение. «Изнемог» сохраняет образ внутреннего истощения и подходит к возвышенному поэтическому регистру.
- source_word: אַל תַּסְתֵּר פָּנֶיךָ מִמֶּנִּי
  choice: Не скрывай от меня Своего лица
  rationale: Сохранён прозрачный древнееврейский образ сокрытия лица, обозначающий удаление благоволения или присутствия, без его истолкования в основном тексте.
- source_word: וְנִמְשַׁלְתִּי
  choice: иначе я уподоблюсь
  rationale: Нифаль глагола משל означает «стать подобным, быть уподобленным». Союз «иначе» естественно передаёт угрожающее последствие после отрицательной просьбы.
- source_word: יֹרְדֵי בוֹר
  choice: сходящим в могилу
  rationale: בור буквально означает яму или ров и здесь служит поэтическим образом смерти. Русское «могила» естественно передаёт этот образ; буквальная форма отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон, поэтому сохранено личное имя. Это не подменяет его титулом и не вносит конфессионального истолкования.
- issue: Значение образа בור
  choice: могила с указанием буквального образа в сноске
  alternative: яма; ров; преисподняя
  rationale: В контексте «сходящие» обозначает уходящих в область смерти. Перевод «могила» понятен современному читателю, а сноска сохраняет конкретный еврейский образ и не уточняет сверх текста учение о посмертном состоянии.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Инверсия «дух мой» и глагол «изнемог» поддерживают псалмический ритм без выраженной архаизации; местоимение «Своего» написано с прописной по принятой русской благоговейной норме.
