  text: И дух мой изнемогает во мне[a], сердце моё цепенеет во мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух мой подавлен; сердце моё опустошено во мне».'
    reason: וַתִּתְעַטֵּף может означать «быть подавленным, охваченным», а יִשְׁתּוֹמֵם — «быть опустошённым, потрясённым»; в русском альтернативный вариант передаёт эту смысловую возможность без неясной кальки предлога עָלַי.
lexical_decisions:
- source_word: וַתִּתְעַטֵּף
  choice: изнемогает
  rationale: Возвратная порода глагола עטף в плачах передаёт ослабление, угасание сил или подавленность. «Изнемогает» естественно сочетается с «дух мой» и сохраняет образ внутреннего упадка.
- source_word: עָלַי
  choice: во мне
  rationale: Буквально предлог означает «на мне/надо мной», но при описании состояния духа выражение имеет внутреннюю направленность; «во мне» по-русски естественно и соответствует параллельному בְּתוֹכִי.
- source_word: רוּחִי
  choice: дух мой
  rationale: Здесь רוּחַ обозначает внутреннюю жизненную силу и состояние псалмопевца, а не просто дыхание и не Святого Духа. Словопорядок поддерживает возвышенный поэтический регистр.
- source_word: בְּתוֹכִי
  choice: внутри меня
  rationale: Выражение прямо указывает на внутреннее состояние человека. «Внутри меня» естественно передаёт эту локализацию и сохраняет параллелизм.
- source_word: יִשְׁתּוֹמֵם
  choice: цепенеет
  rationale: Глагол שמם может выражать оцепенение, потрясение и опустошённость. «Цепенеет» передаёт состояние потрясённой неподвижности, не сводя смысл только к страху или унынию.
- source_word: לִבִּי
  choice: сердце моё
  rationale: «Сердце» сохраняет обычную библейскую антропологическую метафору внутреннего человека и поэтическую параллель с «духом».
