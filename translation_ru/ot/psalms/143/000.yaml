  text: A psalm of David. O LORD, hear my prayer; give ear to my pleas for mercy! In your faithfulness answer me, in your righteousness!
translation:
  language: ru
  text: Псалом Давида. Господи, услышь мою молитву, внемли моим мольбам![a] По верности Твоей ответь мне, по праведности Твоей![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моим прошениям о милости».'
