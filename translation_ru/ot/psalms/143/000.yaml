    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Псалом Давида
  rationale: Естественная и традиционная передача заглавия; конструкция לְדָוִד допускает связь с Давидом без уточнения характера авторства.
- source_word: הַאֲזִינָה אֶל־תַּחֲנוּנַי
  choice: внемли моим мольбам
  rationale: תחנונים обозначает настойчивые мольбы о милости; «внемли» сохраняет возвышенный поэтический регистр и параллелизм с «услышь».
- source_word: בֶּאֱמוּנָתְךָ
  choice: по верности Твоей
  rationale: Предлог ב может обозначать основание или сферу действия; «по верности» естественно передаёт обращение к Божьей надёжности, не исключая оттенка «в Своей верности».
- source_word: בְּצִדְקָתֶךָ
  choice: по праведности Твоей
  rationale: צדקה здесь относится к Божьему праведному действию; «праведность» сохраняет богословскую широту понятия, а «по» передаёт возможное основание ответа.
theological_decisions:
- issue: Смысл обращения к Божьим верности и праведности
  choice: По верности Твоей ответь мне, по праведности Твоей
  alternative: В верности Твоей ответь мне, в праведности Твоей
  rationale: Еврейский предлог ב допускает инструментальный, причинный и сферический оттенки. Основной текст естественно выражает просьбу, основанную на качествах Бога, а сноска сохраняет неоднозначность.
- issue: Авторская атрибуция заглавия
  choice: Псалом Давида
  alternative: Псалом, принадлежащий Давиду / посвящённый Давиду
  rationale: Краткая формула сохраняет обычную семантическую открытость еврейского לְדָוִד и не уточняет сверх текста точный тип связи с Давидом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой дикцией. Формы «Господи», «внемли» и прописные местоимения при обращении к Богу поддерживают достоинство текста, оставаясь понятными современному читателю.
