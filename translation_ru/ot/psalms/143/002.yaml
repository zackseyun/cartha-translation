source:
  edition: WLC
  text: וְ/אַל תָּב֣וֹא בְ֭/מִשְׁפָּט אֶת עַבְדֶּ֑/ךָ כִּ֤י לֹֽא יִצְדַּ֖ק לְ/פָנֶ֣י/ךָ כָל חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/002.yaml
  text: And do not enter into judgment with your servant[a], for no living one is righteous before you.
translation:
  language: ru
  text: И не вступай в суд с твоим слугой, ведь перед тобой не оправдается никто из живущих.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь никто из живущих не окажется праведным перед тобой».'
    reason: 'Лексическая альтернатива: יִצְדַּק может означать как судебное оправдание или признание правым, так и состояние праведности.'
lexical_decisions:
- source_word: וְ/אַל
  choice: И не
  rationale: Союз וְ продолжает мольбу предыдущего стиха, а אַל выражает запрет или настоятельную просьбу в отрицательной форме.
- source_word: תָּבוֹא בְּמִשְׁפָּט
  choice: вступай в суд
  rationale: Сочетание בוא с בְּמִשְׁפָּט обозначает вступление в судебное разбирательство. Русское выражение сохраняет юридический образ и звучит естественно и торжественно.
- source_word: אֶת עַבְדֶּךָ
  choice: с твоим слугой
  rationale: При русском выражении «вступать в суд» участник разбирательства естественно вводится предлогом «с». «Слуга» передаёт молитвенное самообозначение עֶבֶד без неуместного для данного контекста акцента на рабском статусе.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание просьбы; «ведь» ясно и естественно передаёт причинно-пояснительную связь в современной русской речи.
- source_word: לֹא יִצְדַּק
  choice: не оправдается
  rationale: 'В контексте суда форма от צדק имеет выраженный судебный смысл: никто не окажется правым или оправданным перед Богом. Выбор сохраняет этот контекст, не исключая нравственного смысла праведности.'
- source_word: לְפָנֶיךָ
  choice: перед тобой
  rationale: Естественный русский эквивалент выражения, обозначающего пребывание перед лицом Бога и под его оценкой.
- source_word: כָל חָי
  choice: никто из живущих
  rationale: Под отрицанием буквальное «всякий живущий» выражает всеобщее отрицание. Формулировка относится к каждому живому человеку и сохраняет поэтическую широту исходного выражения.
theological_decisions:
- issue: Судебный и нравственный оттенки יִצְדַּק
  choice: «не оправдается» — судебный оттенок вынесен в основной текст
  alternative: «не окажется праведным» — нравственный оттенок указан в примечании
  rationale: Образ суда непосредственно поддерживает судебное прочтение глагола, однако корень צדק также выражает праведность. Примечание сохраняет эту смысловую напряжённость, не сводя стих к позднейшей доктринальной формуле.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Местоимения, относящиеся к Богу, даны со строчной буквы по общему современному издательскому принципу; юридический образ оригинала сохранён.
