  text: I spread out my hands to you; my soul is like a weary land for you[a]. Selah
translation:
  language: ru
  text: Я простёр к Тебе руки; душа моя — как истомлённая земля, жаждущая Тебя. Села.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֵּרַשְׂתִּי
  choice: Я простираю
  rationale: Форма перфекта в поэтической молитве передаёт совершённый жест, сохраняющий актуальность; настоящее время по-русски естественно выражает положение молящегося. «Простираю» точно передаёт конкретный жест мольбы.
- source_word: יָדַי
  choice: руки
  rationale: Форма с суффиксом первого лица обозначает обе руки; принадлежность ясно выражена глагольной формой «я простираю» и по-русски не требует повторного «мои».
- source_word: אֵלֶיךָ
  choice: к Тебе
  rationale: Предлог אֶל выражает направленность к адресату; «к Тебе» естественно для русского языка молитвы.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Сохраняет широкий смысл נֶפֶשׁ — внутреннее существо, жизнь, сам человек — и поэтический параллелизм телесного жеста и внутренней жажды.
- source_word: כְּאֶרֶץ עֲיֵפָה
  choice: как истомлённая земля
  rationale: עֲיֵפָה буквально означает «утомлённая, изнемогшая». «Истомлённая» сохраняет олицетворённый образ и естественно подразумевает землю, изнывающую от засухи, не подменяя при этом исходное прилагательное прямым словом «иссохшая».
- source_word: לְךָ
  choice: перед Тобой
  rationale: Краткое לְךָ поэтически неоднозначно и может обозначать направленность, отношение или ожидание. «Перед Тобой» сохраняет обращённость души к Богу и звучит естественнее буквального «для Тебя», не добавляя «одному» или явно названной жажды.
- source_word: סֶלָה
  choice: Села
  rationale: Значение термина остаётся неясным; традиционная транслитерация сохраняет богослужебно-поэтическую помету без догадочного перевода.
theological_decisions:
- issue: Направленность души, выраженная לְךָ
  choice: перед Тобой
  alternative: к Тебе / по Тебе / для Тебя
  rationale: Еврейское выражение эллиптично. Перевод не уточняет, идёт ли речь именно о жажде, принадлежности или направленности, и тем самым сохраняет поэтическое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Местоимение «Тебе/Тобой» написано с прописной буквы как уместная русская издательская норма прямого обращения к Богу. Синтаксис краткий и ритмичный; образ намеренно не разъяснён внутри основного текста.
