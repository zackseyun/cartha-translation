base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/009.yaml
  text: Deliver me from my enemies[a], O Yahweh; in you I have taken refuge.
translation:
  language: ru
  text: Избавь меня от моих врагов, Яхве; у Тебя я укрылся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к Тебе я скрылся». Также возможно: «к Тебе я ищу убежища». Еврейское выражение говорит о поиске защиты у Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Избавь меня
  rationale: Побудительная форма породы hифиль от נצל с суффиксом первого лица выражает прямую просьбу о спасении от опасности. «Избавь меня» естественно и достойно звучит в молитвенной речи.
- source_word: מֵאֹיְבַי
  choice: от моих врагов
  rationale: Предлог מִן обозначает избавление или удаление от кого-либо, а форма אֹיְבַי прямо означает «мои враги».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является принятой русской транслитерацией тетраграмматона.
- source_word: אֵלֶיךָ
  choice: у Тебя
  rationale: Сам по себе предлог означает направление «к Тебе», но вместе с כסה здесь указывает на обращение к Богу как к месту защиты. Русское «у Тебя» естественно передаёт эту связь, не устраняя образ укрытия.
- source_word: כִסִּתִי
  choice: я укрылся
  rationale: Форма от כסה буквально связана с покрытием или сокрытием. В данном сочетании она выражает поиск защиты у Бога; «я укрылся» сохраняет исходную метафору и результативный оттенок еврейской формы.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Смысл выражения אֵלֶיךָ כִסִּתִי
  choice: у Тебя я укрылся
  alternative: к Тебе я прибегаю / в Тебе я нашёл убежище
  rationale: Выбранный вариант сохраняет образ сокрытия и направленность к Богу как защитнику, не уточняя сверх текста, идёт ли речь только о внутреннем доверии или о более широком поиске Божьей защиты.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Порядок слов «у Тебя я укрылся» сохраняет смысловое выделение Бога как единственного прибежища. Прописная буква в местоимении «Тебя» соответствует принятому русскому благоговейному употреблению.
