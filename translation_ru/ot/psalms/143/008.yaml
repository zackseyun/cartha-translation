  text: הַשְׁמִ֘יעֵ֤/נִי בַ/בֹּ֨קֶר חַסְדֶּ/ךָ֮ כִּֽי בְ/ךָ֪ בָ֫טָ֥חְתִּי הוֹדִיעֵ֗/נִי דֶּֽרֶךְ ז֥וּ אֵלֵ֑ךְ כִּֽי אֵ֝לֶי/ךָ נָשָׂ֥אתִי נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/143/008.yaml
  text: Let me hear your steadfast love in the morning[a], for in you I trust. Make known to me the way I should go[c][b], for to you I lift up my soul.
translation:
  language: ru
  text: Дай мне утром услышать о Твоей верной любви[a], ведь я на Тебя уповаю. Укажи мне путь, по которому мне идти[b], ведь к Тебе я возношу душу мою[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Дай мне утром услышать Твою верную любовь»; вероятный смысл — дай мне услышать весть о ней или испытать её.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «путь, по которому я пойду».'
    reason: lexical_alternative
  - marker: c
    text: «Возносить душу» — еврейский образ устремления всего внутреннего существа к Богу и доверительного вручения себя Ему.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁמִיעֵנִי
  choice: Дай мне услышать
  rationale: Побудительная форма буквально означает «дай/сделай так, чтобы я услышал». В русском языке молитвенное «дай мне услышать» естественно передаёт просьбу, не ослабляя каузативного оттенка.
- source_word: בַבֹּקֶר
  choice: с утра
  rationale: Обозначает время наступающего утра. «С утра» естественно в русском контексте пробуждения и молитвы; возможен также более буквальный вариант «утром».
- source_word: חַסְדֶּךָ
  choice: о Твоей верной любви
  rationale: חסד соединяет любовь, преданность и неизменную благосклонность. Предлог «о» делает сочетание с «услышать» естественным и понимает просьбу как ожидание вести или явления Божьей верной любви.
- source_word: בְךָ בָטָחְתִּי
  choice: я на Тебя уповаю
  rationale: Перфект выражает установившееся доверие. «Уповаю» — ясное и достойное слово современной молитвенной речи, передающее деятельную надежду на Бога.
- source_word: הוֹדִיעֵנִי
  choice: Укажи мне
  rationale: Каузатив ידע буквально означает «дай мне узнать». В просьбе о направлении русское «укажи мне путь» естественно и точно передаёт требуемое раскрытие пути.
- source_word: דֶּרֶךְ זוּ אֵלֵךְ
  choice: путь, по которому мне идти
  rationale: 'Буквально: «путь, которым я пойду». Дательный предикатив «мне идти» естественно выражает контекстуальный смысл искомого Божьего руководства, а примечание сохраняет буквальную форму.'
- source_word: נָשָׂאתִי נַפְשִׁי
  choice: я возношу душу мою
  rationale: Сохранена еврейская метафора обращения всего внутреннего существа к Богу и вверения себя Ему. Настоящее время соответствует продолжающейся молитве; постпозиция «душу мою» поддерживает достоинство поэтической речи.
theological_decisions:
- issue: Значение חסד в обращённой к Богу молитве
  choice: Твоя верная любовь
  alternative: Твоя милость; Твоя заветная любовь
  rationale: «Верная любовь» сохраняет одновременно сердечную любовь и постоянство Божьей преданности, не сводя חסד только к милосердию и не добавляя в основной текст явного термина «завет».
- issue: Образ נָשָׂאתִי נַפְשִׁי
  choice: к Тебе я возношу душу мою
  alternative: Тебе я вверяю себя; к Тебе устремляю всё своё существо
  rationale: 'Исходная метафора сохранена, чтобы не сужать её до единственного толкования: она может включать устремлённость, молитвенное обращение и доверительное вручение себя Богу.'
- issue: Модальность выражения דֶּרֶךְ זוּ אֵלֵךְ
  choice: путь, по которому мне идти
  alternative: путь, по которому я пойду
  rationale: Контекст просьбы о руководстве допускает смысл долженствования, однако буквальная будущая форма остаётся отмечена в сноске, чтобы не скрывать неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-поэтическим звучанием. Сохранены параллелизм стиха и образ «возносить душу»; архаичные формы избегаются, кроме понятного современному читателю глагола «уповать».
