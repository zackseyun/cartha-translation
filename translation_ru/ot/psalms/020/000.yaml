lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов это слово, вероятно, обозначает человека, руководившего музыкальным исполнением. Такой перевод естественен по-русски и не сужает значение до конкретной современной должности, например дирижёра.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Слово обозначает песнопение, предназначенное для музыкального исполнения; в данном жанровом контексте точным и общепринятым русским соответствием является «псалом».
- source_word: לְדָוִד
  choice: Давида
  rationale: Русская родительная конструкция сохраняет некоторую широту еврейского выражения, которое может указывать на авторство, связь с Давидом или посвящение ему, не закрепляя однозначно лишь одно толкование.
- source_word: לְ
  choice: Руководителю
  rationale: Предлог указывает на адресата исполнительского указания; в русском надписании это естественно передаётся дательным падежом.
theological_decisions:
- issue: Значение надписания לְדָוִד
  choice: Псалом Давида
  alternative: «Псалом, написанный Давидом» или «псалом, посвящённый Давиду»
  rationale: Еврейская конструкция сама по себе не требует однозначно выбирать между авторством, принадлежностью, связью и посвящением. Основной текст сохраняет традиционную краткость и возможную неоднозначность, а варианты разъясняются в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная форма надписания. «Руководителю хора» понятно широкому читателю и сохраняет музыкально-исполнительную функцию выражения.
