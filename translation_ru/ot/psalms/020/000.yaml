  text: Руководителю хора. Псалом Давида[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «псалом, написанный Давидом»; или: «псалом, посвящённый Давиду». Еврейское надписание может указывать на авторство, связь с Давидом или посвящение ему.'
