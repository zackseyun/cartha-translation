  source_fidelity: 'Текст точно передаёт еврейский оригинал: пожелательная форма «Да вспомнит он» соответствует יִזְכֹּר в благословительной формуле; «все» передаёт כָּל; «приношения» обоснованно сохраняет широту מִנְחֹתֶךָ; «всесожжение» — точный традиционный эквивалент עוֹלָה; «примет» адекватно передаёт идиоматическое יְדַשְּׁנֶה. «Села» оставлено без искусственной интерпретации.'
