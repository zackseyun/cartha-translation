id: PSA.20.3
reference: Psalms 20:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יִזְכֹּ֥ר כָּל מִנְחֹתֶ֑/ךָ וְ/עוֹלָתְ/ךָ֖ יְדַשְּׁנֶ֣/ה סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/003.yaml
  text: May he remember all your offerings and accept your burnt offering[b][a]. Selah
translation:
  language: ru
  text: Да вспомнит он все твои приношения[a] и примет твоё всесожжение[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хлебные приношения». Еврейское минха может обозначать как хлебное приношение, так и приношение или дар в более широком смысле.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сделает тучным» или «сочтёт тучным» — образное выражение, означающее благосклонно принять жертву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְכֹּר
  choice: Да вспомнит
  rationale: Форма qal imperfect 3 м. р. ед. ч. в контексте молитвенного благословения выражает пожелание; конструкция «да вспомнит» естественно передаёт это значение.
- source_word: כָּל
  choice: все
  rationale: Сохраняет полный охват, выраженный еврейским определителем.
- source_word: מִנְחֹתֶךָ
  choice: твои приношения
  rationale: מִנְחָה может обозначать как дар или приношение вообще, так и конкретно хлебное приношение; широкое «приношения» не снимает лексическую неоднозначность.
- source_word: וְעוֹלָתְךָ
  choice: и твоё всесожжение
  rationale: עוֹלָה — установленное обозначение жертвы, целиком сжигаемой на жертвеннике; «всесожжение» точно и естественно для русского библейского регистра.
- source_word: יְדַשְּׁנֶה
  choice: примет
  rationale: Пиэль от דשן буквально связан с тучностью или изобилием, но в жертвенном контексте идиоматически означает благосклонное принятие жертвы.
- source_word: סֶלָה
  choice: Села
  rationale: Сохранена традиционная транслитерация, поскольку точное значение термина остаётся неясным.
theological_decisions:
- issue: Подразумеваемое подлежащее глаголов в 3-м лице единственного числа
  choice: 'В молитвенном пожелании подразумевается Бог, по-русски выраженный местоимением «он»: «Да вспомнит он… и примет…»'
  alternative: Оставить божественного деятеля грамматически невыраженным
  rationale: В контексте Псалма 20 община просит Божьего благоволения к царю. Еврейский текст здесь не называет подлежащее, однако русская конструкция естественно требует его выражения; местоимение не добавляет нового богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Частица «да» передаёт пожелание, а традиционные культовые термины «приношение» и «всесожжение» сохраняют точность без излишней архаизации. Местоимение о Боге дано со строчной буквы согласно обычной современной издательской практике.
