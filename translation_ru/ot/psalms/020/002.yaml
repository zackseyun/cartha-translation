base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/002.yaml
  text: May he send you help from the sanctuary and sustain you from Zion[a][b].
translation:
  language: ru
  text: Да пошлёт Он тебе помощь из святилища[a] и с Сиона да поддержит тебя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «из святого места»; еврейское слово может означать и «святость». Здесь, вероятно, имеется в виду Божье святилище.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «да укрепит тебя»; также: «да будет тебе опорой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁלַח
  choice: Да пошлёт
  rationale: Имперфект qal, 3-е лицо, ед. число; в контексте молитвенного благословения передан как пожелание, а не как простое будущее.
- source_word: עֶזְרְךָ
  choice: тебе помощь
  rationale: Существительное עֵזֶר с суффиксом 2-го лица мужского рода допускает буквальное «твою помощь», однако по-русски естественнее «пошлёт тебе помощь».
- source_word: מִקֹּדֶשׁ
  choice: из святилища
  rationale: קֹדֶשׁ может означать как «святость», так и «святое место»; параллелизм с Сионом указывает здесь на место Божьего присутствия.
- source_word: וּמִצִּיּוֹן
  choice: и с Сиона
  rationale: Союз сохраняет параллелизм двух частей стиха; для названия города по-русски нормативно употребление предлога «с».
- source_word: יִסְעָדֶךָּ
  choice: да поддержит тебя
  rationale: Глагол סעד значит «поддерживать, укреплять, служить опорой»; форма в данном контексте, как и первый имперфект, выражает пожелание.
theological_decisions:
- issue: Не названный прямо субъект глаголов
  choice: «Он» без вставки имени «Господь»
  alternative: «Господь»
  rationale: В еврейском стихе субъект прямо не назван и определяется из предыдущего контекста. Местоимение сохраняет эту особенность и не добавляет отсутствующего здесь Божьего имени.
- issue: Значение מִקֹּדֶשׁ
  choice: конкретное святое место — «святилище»
  alternative: абстрактное «из святости» или более общее «из святого места»
  rationale: Локальный параллелизм с «с Сиона» делает указание на Божье святилище наиболее вероятным, не отождествляя его в переводе с более узким конфессиональным понятием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенно-поэтическим строем. Повтор частицы «да» передаёт параллельные пожелания оригинала; прописное «Он» ясно указывает на Бога из контекста, не вставляя отсутствующее в строке имя.
