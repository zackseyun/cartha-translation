source:
  edition: WLC
  text: נְרַנְּנָ֤ה בִּ֘/ישׁ֤וּעָתֶ֗/ךָ וּ/בְ/שֵֽׁם אֱלֹהֵ֥י/נוּ נִדְגֹּ֑ל יְמַלֵּ֥א יְ֝הוָ֗ה כָּל מִשְׁאֲלוֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/005.yaml
  text: We will shout for joy in your salvation[a], and in the name of our God we will raise our banners[c][b]. May Yahweh fulfill all your requests.
translation:
  language: ru
  text: Будем ликовать о твоём спасении[a] и во имя нашего Бога поднимем знамёна[b]. Пусть Яхве исполнит все твои просьбы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о твоей победе» или «о твоём избавлении». Еврейское слово может обозначать спасение в широком смысле, включая избавление и победу в сражении.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «водрузим знамя». Еврейский глагол, вероятно, рисует поднятие или выставление знамени в знак торжества.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Яхве исполнит все твои просьбы». Еврейскую форму можно понять и как молитвенное пожелание, и как утверждение о будущем; в данном контексте более вероятно пожелание.'
    reason: alternative_reading
lexical_decisions:
- source_word: נְרַנְּנָה
  choice: будем ликовать
  rationale: Когортативная форма глагола רנן выражает совместное радостное торжество. «Будем ликовать» естественно передаёт как побуждение, так и уверенное намерение, не ограничивая ликование именно пением.
- source_word: בִּישׁוּעָתֶךָ
  choice: о твоём спасении
  rationale: יְשׁוּעָה охватывает спасение, избавление и победу. «Спасение» сохраняет широкий смысл слова, тогда как военный контекст допускает понимание как победы или избавления.
- source_word: וּבְשֵׁם אֱלֹהֵינוּ
  choice: и во имя нашего Бога
  rationale: Предлог ב при слове «имя» передаёт действие под властью Бога, с упованием на Него и как Его народа; русское «во имя» естественно сохраняет этот оборот.
- source_word: נִדְגֹּל
  choice: поднимем знамёна
  rationale: Глагол דגל, вероятно, вызывает образ поднятия или выставления знамени в знак торжества. Множественное число по-русски естественно передаёт коллективную праздничную сцену.
- source_word: יְמַלֵּא
  choice: пусть … исполнит
  rationale: Хотя это формально имперфект, в молитвенном контексте он естественно читается как пожелание. «Пусть … исполнит» сохраняет благословительный характер строки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом, чтобы сохранить различие между именем יהוה и обозначениями «Господь» или «Бог».
- source_word: כָּל מִשְׁאֲלוֹתֶיךָ
  choice: все твои просьбы
  rationale: מִשְׁאֲלוֹת обозначает то, о чём просят. «Просьбы» ясно и современно передаёт молитвенный смысл, не расширяя его до любых желаний.
theological_decisions:
- issue: Значение יְשׁוּעָה в царском псалме, связанном с битвой
  choice: спасение
  alternative: победа; избавление
  rationale: Непосредственный контекст допускает военную победу, однако «спасение» сохраняет более широкий смысл еврейского слова и не исключает избавления в сражении.
- issue: Модальное значение יְמַלֵּא
  choice: 'молитвенное пожелание: «Пусть Яхве исполнит»'
  alternative: 'утверждение о будущем: «Яхве исполнит»'
  rationale: Литургический и просительный контекст поддерживает пожелание, но грамматическая форма допускает также прочтение как уверенного утверждения о будущем; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис остаётся ясным для обычного читателя; избегаются как церковнославянизмы, так и разговорная сниженная лексика.
