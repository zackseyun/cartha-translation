  yaml_path: translation/ot/psalms/020/009.yaml
  text: O Yahweh[a], save! May the King answer us in the day we call.
translation:
  language: ru
  text: Яхве, спаси! Да ответит нам царь[a] в день, когда мы воззовём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «Яхве, спаси царя! Ответь нам в день, когда мы воззовём» или: «Яхве, спаси! Царь ответит нам в день, когда мы воззовём». Еврейская фраза предельно сжата и допускает разные способы связать слово «царь» с соседними частями предложения.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: הוֹשִׁיעָה
  choice: спаси!
  rationale: Повелительная форма в прямом молитвенном обращении; «спаси» сохраняет широкий смысл избавления, не сводя его только к военной победе.
- source_word: הַמֶּלֶךְ
  choice: Царь
  rationale: Определённое существительное «царь». В основном тексте прописная буква отражает синтаксически вероятное понимание Царя как Бога, отвечающего на призыв, но подлинная неоднозначность конструкции отмечена в сноске.
- source_word: יַעֲנֵנוּ
  choice: да ответит нам
  rationale: Имперфект в молитвенном контексте естественно допускает желательное значение; конструкция с «да» передаёт просьбу, а не категорическое предсказание.
- source_word: בְיוֹם
  choice: в день, когда
  rationale: Сохраняет временной образ еврейского выражения и при этом звучит естественно в современном русском языке.
- source_word: קָרְאֵנוּ
  choice: мы воззовём
  rationale: Глагол קרא означает «звать, призывать»; «воззовём» уместно в молитвенной поэзии и передаёт обращение к Богу без излишней разговорности.
theological_decisions:
- issue: К кому относится «Царь» и как членится сжатая еврейская фраза
  choice: 'После «Яхве, спаси!» слово «Царь» понимается как подлежащее: «Да ответит нам Царь»; прописная буква указывает на вероятное отнесение к Яхве.'
  alternative: '«Яхве, спаси царя! Ответь нам в день, когда мы воззовём»; возможно также утвердительное: «Яхве, спаси! Царь ответит нам в день, когда мы воззовём».'
  rationale: Масоретское членение отделяет «Яхве, спаси!» и поддерживает понимание «Царь» как подлежащего следующей части. Однако сжатый синтаксис и царский контекст псалма допускают чтение, при котором речь идёт о спасении земного царя. Неоднозначность нельзя устранять без оговорки.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Форма «да ответит» сохраняет просительный оттенок, а «воззовём» поддерживает возвышенный, но понятный регистр.
