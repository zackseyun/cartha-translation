  text: עַתָּ֤ה יָדַ֗עְתִּי כִּ֤י הוֹשִׁ֥יעַ יְהוָ֗ה מְשִׁ֫יח֥/וֹ יַ֭עֲנֵ/הוּ מִ/שְּׁמֵ֣י קָדְשׁ֑/וֹ בִּ֝/גְבֻר֗וֹת יֵ֣שַׁע יְמִינֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/006.yaml
  text: I know that the LORD saves his anointed; he answers him from his holy heaven with the mighty saving deeds of his right hand.
translation:
  language: ru
  text: 'Теперь я знаю: ГОСПОДЬ спас Своего помазанника; Он ответит ему со Своих святых небес могучими деяниями спасения Своей десницы.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַתָּה
  choice: Теперь
  rationale: Наречие прямо обозначает настоящий момент и переход к вновь обретённой уверенности; поэтому оно сохранено вопреки его отсутствию в английском консультационном тексте.
- source_word: הוֹשִׁיעַ
  choice: спасает
  rationale: Форма допускает понимание совершённого спасения, но в контексте исповедания уверенности естественно выражает действенное спасение, совершаемое ГОСПОДОМ; настоящее время также сохраняет формулировку без излишнего уточнения временного плана.
- source_word: מְשִׁיחוֹ
  choice: Своего помазанника
  rationale: Передаёт царский титул буквально и понятно, не превращая его без текстового основания в имя собственное или исключительно христианский титул.
- source_word: יַעֲנֵהוּ
  choice: Он ответит ему
  rationale: Имперфект передан будущим временем, что соответствует ожиданию ответа на молитву и не сливает его по времени с предшествующим исповеданием.
- source_word: מִשְּׁמֵי קָדְשׁוֹ
  choice: со Своих святых небес
  rationale: Естественно передаёт буквальное «с небес Его святости» и сохраняет множественное число שָׁמַיִם.
- source_word: בִּגְבֻרוֹת יֵשַׁע יְמִינוֹ
  choice: могучими, спасающими деяниями Своей десницы
  rationale: Сохраняет идеи могущества, спасения и действенного вмешательства; «десница» уместна в поэтическом библейском регистре и передаёт יָמִין точнее, чем нейтральное «правая рука».
theological_decisions:
- issue: Референт выражения «помазанник»
  choice: Сохранён общий царский титул «помазанник»
  alternative: «Мессия» как однозначное собственное наименование
  rationale: В непосредственном контексте псалма речь идёт о помазанном царе; перевод не исключает более широкого мессианского прочтения, но и не навязывает его.
- issue: Временной аспект спасения
  choice: «спасает»
  alternative: «спас» или «даровал победу»
  rationale: Древнееврейская форма может представлять спасение как уже удостоверенное, однако русское настоящее время сохраняет исповедальный характер утверждения и широкий смысл корня ישׁע, не ограничивая его военной победой.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Написание «ГОСПОДЬ» обозначает тетраграмматон יהוה. Местоимения о Боге написаны с прописной буквы согласно принятому русскому библейскому регистру; «десница» сохранена как понятное возвышенно-поэтическое слово.
