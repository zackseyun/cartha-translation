  text: These trust in chariots and those in horses, but we call on the name of the LORD our God.
translation:
  language: ru
  text: Одни полагаются на колесницы, другие — на коней, а мы поминаем имя Господа, Бога нашего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «упоминаем» или «провозглашаем имя Господа, Бога нашего»; еврейский глагол допускает эти оттенки.'
    reason: Глагол נַזְכִּיר в данном контексте имеет диапазон значений, связанный с поминанием, упоминанием и провозглашением имени; основной перевод сохраняет наиболее прямую передачу.
lexical_decisions:
- source_word: אֵלֶּה בָרֶכֶב וְאֵלֶּה בַסּוּסִים
  choice: Одни полагаются на колесницы, другие — на коней
  rationale: 'В первой половине еврейского стиха сказуемое опущено: буквально «одни — на/в колесницах, другие — на/в конях». «Полагаются» естественно передаёт подразумеваемое противопоставление человеческой военной силы упованию на Бога, не перегружая русский текст эллипсисом.'
- source_word: בְּשֵׁם יְהוָה אֱלֹהֵינוּ נַזְכִּיר
  choice: мы призываем имя Господа, нашего Бога
  rationale: Форма נַזְכִּיר от זכר в сочетании с именем Бога может означать «упоминать, возвещать, призывать (имя)». Выбрано естественное русское выражение, соответствующее контрасту стиха; неоднозначность отмечена в сноске.
- source_word: יְהוָה
  choice: Господа
  rationale: Тетраграмматон передан принятой в русской библейской традиции формой «Господь»; в данном синтаксисе — родительный падеж «Господа».
theological_decisions:
- issue: Характер противопоставления колесниц и коней имени Бога
  choice: полагаются … а мы призываем
  alternative: хвалятся … а мы хвалимся; одни — на колесницах … а мы вспоминаем
  rationale: Еврейский текст эллиптичен и допускает оттенки упования, похвалы и публичного исповедания. Перевод не утверждает, что колесницы или кони сами по себе осуждаются, а передаёт противопоставление источников надежды; лексическая неоднозначность второй части сохранена в сноске.
translation_notes:
  register: Современный литературный русский, ясный и торжественный без архаизации. Параллелизм «одни… другие… а мы…» воспроизводит поэтическое строение еврейской строки; тире экономно отмечает эллипсис во второй части первой половины.
