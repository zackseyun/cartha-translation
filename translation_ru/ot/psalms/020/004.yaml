  yaml_path: translation/ot/psalms/020/004.yaml
  text: May he grant you according to your heart[a], and fulfill all your counsel.
translation:
  language: ru
  text: Да даст он тебе то, чего желает твоё сердце, и исполнит все твои намерения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все твои замыслы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּן
  choice: Да даст
  rationale: Форма yiqtol в контексте молитвенных пожеланий Псалма 20 естественно передаётся русской желательной конструкцией «да даст»; при этом сохраняется основное значение глагола נתן — «давать».
- source_word: לְךָ
  choice: тебе
  rationale: Дательный падеж прямо и естественно передаёт еврейское косвенное дополнение с לְ.
- source_word: כִלְבָבֶךָ
  choice: по сердцу твоему
  rationale: Выражение сохраняет еврейский образ сердца как средоточия желаний, намерений и воли, не сужая его до одного из этих значений; предлог כְּ передан как «по».
- source_word: וְכָל
  choice: и все
  rationale: «И» передаёт союз וְ, а «все» естественно сочетается в русском с множественным числом «замыслы».
- source_word: עֲצָתְךָ
  choice: твои замыслы
  rationale: עֵצָה может обозначать совет, намерение, замысел или план. В данном контексте молитвы об успехе царя «замыслы» звучит естественно и сохраняет оттенок обдуманного намерения.
- source_word: יְמַלֵּא
  choice: исполнит
  rationale: Порода piel глагола מלא здесь означает довести до осуществления, полностью реализовать; русский глагол «исполнить» точно передаёт этот смысл.
theological_decisions:
- issue: Сила глагольных форм в контексте благословения и молитвы
  choice: 'Оба глагола переданы как единое пожелание: «Да даст… и исполнит…»'
  alternative: 'Будущее время: «Он даст… и исполнит…»'
  rationale: Хотя обе формы морфологически являются yiqtol, последовательность прошений в псалме указывает на желательное, близкое к юссиву употребление, а не на простое предсказание.
- issue: Значение слова «сердце»
  choice: Сохранён образ сердца без поясняющего сужения значения
  alternative: «по твоему желанию» или «как ты задумал»
  rationale: Еврейское לֵבָב охватывает желание, волю и намерение. Буквенный образ сохраняет присущую тексту смысловую широту и его представление о внутреннем человеке.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной молитвенной интонацией. Оборот «по сердцу твоему» намеренно сохраняет библейский образ и параллелизм, оставаясь понятным современному читателю. Местоимение «он» написано со строчной буквы в соответствии с обычной современной издательской практикой и без внесения конфессиональной стилистики.
