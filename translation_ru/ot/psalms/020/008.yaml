source:
  edition: WLC
  text: הֵ֭מָּה כָּרְע֣וּ וְ/נָפָ֑לוּ וַ/אֲנַ֥חְנוּ קַּ֝֗מְנוּ וַ/נִּתְעוֹדָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/008.yaml
  text: They have bowed down and fallen[a], but we have risen and stand upright.
translation:
  language: ru
  text: Они согнулись и пали, а мы поднялись и стоим твёрдо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укрепились», «выпрямились» или «утвердились».'
    reason: Редкий заключительный глагол допускает оттенки восстановления сил, выпрямления и обретения устойчивости.
lexical_decisions:
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение 3-го лица множественного числа подчёркивает противопоставление последующему «мы»; по-русски это естественно передаётся местоимением «они».
- source_word: כָּרְעוּ
  choice: согнулись
  rationale: Глагол обозначает сгибание, преклонение колен или оседание; «согнулись» сохраняет телесный образ поражения и естественно сочетается с «пали».
- source_word: וְנָפָלוּ
  choice: и пали
  rationale: Прямой поэтический эквивалент, сохраняющий координацию и контраст с последующим «поднялись».
- source_word: וַאֲנַחְנוּ
  choice: а мы
  rationale: Хотя союз формально может означать «и», контекст выражает явное противопоставление; русское «а» передаёт его без излишнего усиления.
- source_word: קַּמְנוּ
  choice: поднялись
  rationale: Глагол קום означает «встать, подняться»; выбор сохраняет прямой контраст с падением противников.
- source_word: וַנִּתְעוֹדָד
  choice: стоим твёрдо
  rationale: Редкая рефлексивная форма передаёт восстановление, укрепление или выпрямление; «стоим твёрдо» естественно выражает достигнутую устойчивость, не исключая оттенка восстановления.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением краткости, параллелизма и телесной образности еврейской поэзии. Контраст הֵמָּה / וַאֲנַחְנוּ передан как «они… а мы».
