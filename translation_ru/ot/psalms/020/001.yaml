  text: יַֽעַנְ/ךָ֣ יְ֭הוָה בְּ/י֣וֹם צָרָ֑ה יְ֝שַׂגֶּבְ/ךָ֗ שֵׁ֤ם אֱלֹהֵ֬י יַעֲקֹֽב׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/020/001.yaml
  text: May Yahweh answer you in the day of trouble[a]; may the name of the God of Jacob protect you.
translation:
  language: ru
  text: Да ответит тебе Яхве в день бедствия; да укроет тебя в недосягаемой вышине имя Бога Иакова[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «да защитит тебя». Еврейский глагол рисует образ человека, помещённого на недосягаемую высоту, где он находится в безопасности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַנְךָ
  choice: Да ответит тебе
  rationale: Глагол ענה означает «отвечать, откликаться»; в молитвенно-благословительном контексте несовершенный вид передан пожеланием с частицей «да».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּיוֹם צָרָה
  choice: в день бедствия
  rationale: Сохраняет временную конструкцию и библейский образ «дня», когда человека постигает тяжёлая беда.
- source_word: יְשַׂגֶּבְךָ
  choice: да укроет тебя в недосягаемой вышине
  rationale: Глагол שׂגב в породе пиэль выражает помещение на недосягаемую высоту и тем самым защиту; формулировка сохраняет пространственный образ, оставаясь понятной по-русски.
- source_word: שֵׁם
  choice: имя
  rationale: Буквальное «имя» сохраняет поэтическое и богословское значение — призываемое присутствие, власть и слава Бога — без сведения его к одному толкованию.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Бога Иакова
  rationale: Естественно передаёт конструкцию принадлежности и сохраняет историко-заветное наименование.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Модальность глагольных форм
  choice: Пожелание или молитвенное прошение с «да»
  alternative: 'Простое будущее: «ответит… укроет»'
  rationale: Контекст псалма-благословения указывает на юссивно-оптативную силу форм, но не превращает их в категорическое предсказание.
- issue: Образ в יְשַׂגֶּבְךָ
  choice: Сохранён образ укрытия в недосягаемой вышине
  alternative: «да защитит тебя»
  rationale: Прямая защитная функция ясна из контекста, однако пространственный образ исходного глагола значим и потому сохранён в тексте, а более обобщённый вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной молитвенной интонацией. Параллелизм двух пожеланий передан повтором «да»; метафора высоты сохранена без архаической лексики.
