  text: В день, когда я воззвал, Ты ответил мне; Ты придал мне душевную силу и смелость.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол здесь труден для перевода: возможны значения «придал мне смелости», «укрепил меня» или, более буквально, «расширил меня». Фразу можно также передать: «Ты укрепил меня в душе силой» или «Ты укрепил меня изнутри».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹם
  choice: В день, когда
  rationale: Сохраняет конкретный временной образ еврейского выражения и при этом естественно звучит по-русски.
- source_word: קָרָאתִי
  choice: я воззвал
  rationale: В молитвенном контексте передаёт обращение к Богу; «позвал» было бы слишком бытовым, а «вскричал» добавляло бы не выраженную прямо эмоциональную интенсивность.
- source_word: וַתַּעֲנֵנִי
  choice: Ты ответил мне
  rationale: Прямо передаёт глагол и местоименный суффикс первого лица, сохраняя личную взаимность высказывания.
- source_word: תַּרְהִבֵנִי
  choice: Ты исполнил … отвагой
  rationale: Трудная форма Hiphil от רהב, по контексту обозначающая наделение внутренней смелостью или укрепление. Такая формулировка передаёт каузативный смысл и не вводит физического значения «расширить» в основной текст.
- source_word: בְנַפְשִׁי
  choice: мою душу
  rationale: Сохраняет явное упоминание נֶפֶשׁ как внутреннего «я»; русская конструкция перестроена ради естественности.
- source_word: עֹז
  choice: силой
  rationale: Передаёт значение «сила, мощь» и сохраняет этот элемент отдельно от идеи отваги, заключённой в трудном глаголе.
theological_decisions:
- issue: Толкование трудной фразы תַּרְהִבֵנִי בְנַפְשִׁי עֹז
  choice: «Ты исполнил мою душу силой и отвагой» — Бог наделил молящегося внутренней силой и смелостью.
  alternative: «Ты укрепил меня в душе силой»; буквально возможное «Ты расширил меня в душе силой».
  rationale: Еврейская фраза допускает оттенки придания смелости, расширения и укрепления. Основной текст естественно передаёт внутреннее укрепление, а примечание сохраняет подлинную лексическую неоднозначность без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической торжественностью. Заглавное «Ты» употреблено как уважительное обращение к Богу. Синтаксис сделан естественным для русского, при этом сохранены временной образ, личное обращение и отдельные понятия души, силы и отваги.
