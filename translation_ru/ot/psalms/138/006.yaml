id: PSA.138.6
reference: Psalms 138:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּי רָ֣ם יְ֭הוָה וְ/שָׁפָ֣ל יִרְאֶ֑ה וְ֝/גָבֹ֗הַּ מִ/מֶּרְחָ֥ק יְיֵדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/006.yaml
  text: For Yahweh is high[a], yet he sees the lowly[c][b]; but the haughty he knows from afar.
translation:
  language: ru
  text: Ибо высок Яхве, но смиренного[a] Он видит, а надменного[b] знает издали[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «униженного», «занимающего низкое положение».'
    reason: Еврейское слово может указывать как на смирение, так и на низкое положение человека.
  - marker: b
    text: 'Буквально: «высокого»; здесь, в противопоставлении смиренному, — гордого или высокомерного.'
    reason: Сноска сохраняет буквальный образ высоты и объясняет его контекстуальное нравственное значение.
  - marker: c
    text: 'Или: «узнаёт издали». Слова «знает издали» могут подразумевать отчуждённость, не называя её прямо.'
    reason: Исходная формулировка допускает несколько оттенков и не должна быть усилена до явного отвержения.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующей хвалы; «ибо» сохраняет пояснительное значение и соответствует возвышенному поэтическому регистру.
- source_word: רָם
  choice: высок
  rationale: Передаёт образ высоты и возвышенное положение Яхве без добавления отвлечённого богословского термина.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: שָׁפָל
  choice: смиренного
  rationale: Естественно обозначает человека, занимающего низкое положение или не возвышающего себя; более широкий диапазон значения отмечен в сноске.
- source_word: יִרְאֶה
  choice: видит
  rationale: Сохраняет основное значение глагола и не усиливает его до «благоволит» или «заботится».
- source_word: גָבֹהַּ
  choice: надменного
  rationale: Буквально прилагательное означает «высокий», но в противопоставлении смиренному описывает гордого, высокомерного человека.
- source_word: מִמֶּרְחָק
  choice: издали
  rationale: Кратко и поэтично сохраняет пространственный образ дистанции.
- source_word: יְיֵדָע
  choice: знает
  rationale: Передаёт лексическое ядро глагола и оставляет открытым вопрос, выражает ли контекст узнавание, осведомлённость или отсутствие близости.
theological_decisions:
- issue: Отношение Яхве к надменному, выраженное словами «знает издали»
  choice: знает издали
  alternative: узнаёт издали; держит на расстоянии
  rationale: Еврейский текст прямо говорит о знании «издали». Он допускает оттенок отношений на расстоянии, но не формулирует явно ни отвержения, ни осуждения, поэтому перевод сохраняет напряжение исходного текста.
- issue: Контраст между высотой Яхве и Его вниманием к смиренному
  choice: высок Яхве, но смиренного Он видит
  alternative: возвышен Яхве и взирает на униженного
  rationale: 'Союз «но» естественно выражает подразумеваемую уступительность: возвышенность Бога не мешает Ему видеть находящегося внизу. При этом не добавляется утверждение, которого нет в самих словах стиха.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Синтаксис краток и сохраняет трёхчастный ход еврейской строки; местоимение «Он» помогает ясно отнести сказуемое к Яхве.
