source:
  edition: WLC
  text: וְ֭/יָשִׁירוּ בְּ/דַרְכֵ֣י יְהוָ֑ה כִּ֥י גָ֝ד֗וֹל כְּב֣וֹד יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/005.yaml
  text: and they will sing of the ways of Yahweh[a], for great is the glory of Yahweh.
translation:
  language: ru
  text: 'И будут петь о путях Яхве[a],

    ибо велика слава Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на путях Яхве» или «по путям Яхве»; вероятно, речь идёт о пении о путях Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָשִׁירוּ
  choice: И будут петь
  rationale: Порода qal, имперфект 3-го лица множественного числа от שׁיר. В контексте естественно передаёт будущее действие; повелительное «пусть поют» было бы излишним уточнением модальности.
- source_word: בְּדַרְכֵי
  choice: о путях
  rationale: Предлог בְּ допускает буквальное «на/по путям», однако после глагола «петь» сочетание, вероятнее всего, указывает на тему песни. Русское «петь о путях» естественно выражает этот смысл, а буквальная форма отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом «Господь».
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание для пения. «Ибо» сохраняет причинную связь и соответствует возвышенному, но понятному поэтическому регистру.
- source_word: גָדוֹל
  choice: велика
  rationale: Прямое соответствие прилагательному со значением величия; согласовано со словом «слава».
- source_word: כְּבוֹד
  choice: слава
  rationale: Обычное и уместное в отношении Бога соответствие כָּבוֹד, сохраняющее богословскую ёмкость исходного слова.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Смысл выражения בְּדַרְכֵי יְהוָה
  choice: петь о путях Яхве
  alternative: петь на путях Яхве; петь, следуя путями Яхве
  rationale: Наиболее вероятно, что пути Яхве являются темой песни, но еврейская конструкция допускает более буквальное пространственное или образное понимание; неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллельность и краткость еврейской строки сохранены; архаичные формы не использованы.
