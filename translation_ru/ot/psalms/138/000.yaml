  text: Давида. Буду благодарить Тебя всем сердцем; перед богами[a] буду воспевать Тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед небесными существами»; возможно также: «перед ангелами». Еврейское слово в зависимости от контекста может обозначать Бога, богов или небесных существ.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая традиционная форма надписания сохраняет неоднозначность еврейского לְ: псалом может пониматься как принадлежащий Давиду, написанный им, посвящённый ему или связанный с ним.'
- source_word: אוֹדְךָ
  choice: буду славить Тебя
  rationale: Глагол ידה в данной форме выражает обращённое к Богу прославление и благодарение; «славить» естественно сочетается с последующим «воспевать» и не сужает смысл только до благодарности.
- source_word: בְכָל־לִבִּי
  choice: всем сердцем
  rationale: Естественная русская передача полноты внутренней преданности без ненужного буквального предлога.
- source_word: נֶגֶד אֱלֹהִים
  choice: перед богами
  rationale: Формально передаёт множественное по смыслу употребление אֱלֹהִים и сохраняет напряжённость и неоднозначность выражения; возможное значение «небесные существа» отмечено в сноске.
- source_word: אֲזַמְּרֶךָּ
  choice: буду воспевать Тебя
  rationale: Передаёт музыкальное прославление, выраженное глаголом זמר, естественным и возвышенным русским оборотом.
theological_decisions:
- issue: Кого обозначает אֱלֹהִים во фразе נֶגֶד אֱלֹהִים
  choice: боги
  alternative: небесные существа; ангелы
  rationale: Контекст допускает несколько референтов. Основной текст сохраняет наиболее прямое лексическое значение, а сноска сообщает другие обоснованные варианты, не разрешая неоднозначность конфессионально.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным псалмическим звучанием. Заглавные буквы в местоимениях «Тебя» отражают уважительное обращение к Богу; синтаксический параллелизм оригинала сохранён.
