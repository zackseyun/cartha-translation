  yaml_path: translation/ot/psalms/138/001.yaml
  text: Of David[a]. I will give thanks to you with my whole heart; before the gods I will sing praises to you.
translation:
  language: ru
  text: Давида. Буду благодарить Тебя всем сердцем; перед богами[a] буду воспевать Тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед небесными существами»; возможно также: «перед ангелами» или «перед Богом». Еврейское слово אֱלֹהִים в зависимости от контекста может означать Бога, богов или небесных существ.'
    reason: Сохраняется смысловая неоднозначность еврейского אֱלֹהִים.
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая надписательная формула сохраняет неоднозначность לְ: псалом может быть Давидовым по авторству, принадлежности или посвящению; русский родительный заголовочный оборот не сводит её однозначно к «написан Давидом».'
- source_word: אוֹדְךָ
  choice: Благодарю Тебя
  rationale: Форма ידה в породе hифиль здесь выражает благодарение или хвалу, обращённую к Богу. Настоящее время естественно передаёт поэтическое обязательство, выраженное еврейским имперфектом.
- source_word: בְכָל לִבִּי
  choice: всем сердцем
  rationale: Естественный современный русский эквивалент буквального «всем моим сердцем», передающий полноту и нераздельность внутренней преданности.
- source_word: נֶגֶד
  choice: перед
  rationale: Передаёт пространственно-реляционное значение «перед лицом, в присутствии» и сохраняет поэтическую краткость.
- source_word: אֱלֹהִים
  choice: богами
  rationale: Форма допускает значения «Бог», «боги» и «небесные существа». В данной конструкции прямое множественное «богами» сохраняет грамматическую форму и риторическое напряжение, а иные возможные значения отмечены в сноске.
- source_word: אֲזַמְּרֶךָ
  choice: воспеваю Тебя
  rationale: זמר в пиэле обозначает пение или музыкальное прославление; «воспеваю» соединяет музыкальный и хвалебный оттенки и естественно принимает прямое дополнение.
theological_decisions:
- issue: Кого обозначает אֱלֹהִים во фразе נֶגֶד אֱלֹהִים
  choice: перед богами
  alternative: перед небесными существами; перед ангелами; перед Богом
  rationale: Контекст допускает богов народов либо членов небесного собрания. Основной текст сохраняет наиболее прямое множественное прочтение, не превращая выражение ни в полемику, ни в однозначную ангелологию; смысловые альтернативы вынесены в сноску.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным поэтическим строем. Заглавная буква в местоимении «Тебя» обозначает обращение к Богу как редакционную норму русского религиозного текста, не добавляя нового смысла.
