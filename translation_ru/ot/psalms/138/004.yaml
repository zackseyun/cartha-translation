  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַלְכֵי אָ֑רֶץ כִּ֥י שָׁ֝מְע֗וּ אִמְרֵי פִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/004.yaml
  text: All the kings of the earth will give thanks to you[a], O Yahweh, for they have heard the words of your mouth.
translation:
  language: ru
  text: 'Все цари земли будут благодарить Тебя, Яхве,


    потому что они услышали слова Твоих уст.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: прославят Тебя
  rationale: Форма hifil глагола ידה означает «благодарить, восхвалять». В данном поэтическом контексте «прославят Тебя» естественно передаёт обращённую к Богу хвалу, не исключая оттенка благодарения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: כָּל מַלְכֵי אָרֶץ
  choice: все цари земли
  rationale: Сохранены собирательность כָּל и конкретное обозначение правителей; выражение естественно звучит в русской библейской поэзии.
- source_word: כִּי
  choice: потому что
  rationale: 'Союз вводит основание будущего прославления: цари услышали Божьи слова.'
- source_word: שָׁמְעוּ
  choice: они услышали
  rationale: Перфект передан завершённым действием, предшествующим будущему прославлению.
- source_word: אִמְרֵי פִיךָ
  choice: слова Твоих уст
  rationale: Сохранён конкретный поэтический образ еврейского текста; в современном литературном русском он остаётся понятным и торжественным.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Оттенок значения יוֹדוּךָ
  choice: прославят Тебя
  alternative: возблагодарят Тебя
  rationale: Глагол допускает значения хвалы и благодарения. Выбор «прославят» соответствует универсальному признанию Бога царями, при этом не устраняет благодарственного оттенка исходного глагола.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «слова Твоих уст» сохраняет образ оригинала и псалмовую торжественность; местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской религиозной издательской норме.
