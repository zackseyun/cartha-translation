  text: אֶשְׁתַּחֲוֶ֨ה אֶל הֵיכַ֪ל קָדְשְׁ/ךָ֡ וְ/א֘וֹדֶ֤ה אֶת שְׁמֶ֗/ךָ עַל חַסְדְּ/ךָ֥ וְ/עַל אֲמִתֶּ֑/ךָ כִּֽי הִגְדַּ֥לְתָּ עַל כָּל שִׁ֝מְ/ךָ֗ אִמְרָתֶֽ/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/002.yaml
  text: I bow down toward your holy temple and give thanks to your name for your steadfast love and your faithfulness[a], for you have exalted your word above all your name.
translation:
  language: ru
  text: Поклонюсь, обратившись к Твоему святому храму, и воздам хвалу Твоему имени за Твою неизменную любовь и верность, ибо Ты возвеличил слово Твоё превыше всего имени Твоего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо Ты возвеличил обещание Твоё превыше всего». Древнееврейская заключительная фраза трудна; её также понимают так: «ибо Ты превыше всего возвеличил имя Твоё и слово Твоё».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשְׁתַּחֲוֶה
  choice: поклонюсь
  rationale: Передаёт конкретное телесное действие поклонения; естественнее в современном русском, чем буквальное «прострусь ниц», и конкретнее общего «буду поклоняться».
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: перед Твоим святым храмом
  rationale: אֶל при глаголе поклонения обозначает направленность к храму. Русское «перед храмом» естественно выражает поклонение, обращённое в его сторону, не подразумевая пребывания внутри.
- source_word: וְאוֹדֶה אֶת שִׁמְךָ
  choice: и возблагодарю имя Твоё
  rationale: Форма ידה здесь выражает благодарение, основания которого далее вводятся עַל. Сочетание с «именем» сохраняет древнееврейский образ, а «возблагодарю» поддерживает достойный поэтический регистр.
- source_word: עַל חַסְדְּךָ
  choice: за Твою неизменную любовь
  rationale: חסד обозначает преданную, стойкую любовь; «неизменная любовь» понятно современному читателю и передаёт постоянство без внесения узкой конфессиональной терминологии.
- source_word: וְעַל אֲמִתֶּךָ
  choice: и верность
  rationale: אמת может означать истину, надёжность или верность; в параллели с חסד контекстуально уместна «верность».
- source_word: כִּי
  choice: ибо
  rationale: Вводит основание благодарения и соответствует возвышенному, но понятному стилю псалма.
- source_word: הִגְדַּלְתָּ
  choice: Ты возвеличил
  rationale: Передаёт каузативное значение «сделал великим, возвысил» и естественно сочетается со «словом».
- source_word: עַל כָּל שִׁמְךָ
  choice: превыше всего имени Твоего
  rationale: Следует масоретской последовательности и сохраняет трудность выражения, не подменяя её более гладким толкованием.
- source_word: אִמְרָתֶךָ
  choice: слово Твоё
  rationale: אִמְרָה означает слово, изречение или обещание. «Слово» сохраняет широту исходного значения, тогда как значение обещания остаётся возможным по контексту.
theological_decisions:
- issue: Толкование трудной заключительной фразы כִּי הִגְדַּלְתָּ עַל כָּל שִׁמְךָ אִמְרָתֶךָ
  choice: ибо Ты возвеличил слово Твоё превыше всего имени Твоего
  alternative: 'ибо Ты возвеличил обещание Твоё превыше всего; либо: ибо Ты превыше всего возвеличил имя Твоё и слово Твоё'
  rationale: Масоретский текст синтаксически труден и допускает несколько традиционных истолкований. Основной текст близко следует порядку слов WLC и сохраняет напряжение между «словом» и «именем», не превращая перевод в богословское объяснение. Альтернативы указаны в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической интонацией. Местоимения и притяжательные формы, относящиеся к Богу, написаны с прописной буквы. Инверсия «имя Твоё», «слово Твоё» сохраняет поэтическое достоинство, оставаясь понятной.
