source:
  edition: WLC
  text: יְהוָה֮ יִגְמֹ֪ר בַּ֫עֲדִ֥/י יְ֭הוָה חַסְדְּ/ךָ֣ לְ/עוֹלָ֑ם מַעֲשֵׂ֖י יָדֶ֣י/ךָ אַל תֶּֽרֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/008.yaml
  text: Yahweh will fulfill his purpose for me[a]; O Yahweh, your steadfast love endures forever[b]. Do not forsake the work of your hands.
translation:
  language: ru
  text: Яхве доведёт до конца то, что касается меня[a]. Яхве, твоя верная любовь — навеки! Не оставляй дел рук твоих[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве совершит за меня»; возможен также смысл: «Яхве довершит ради меня».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Не отступай от дел рук твоих».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: יִגְמֹר
  choice: доведёт до конца
  rationale: Глагол גמר означает завершать, доводить до полноты; выбранное выражение естественно по-русски и не привносит прямо не названное в еврейском тексте «предназначение».
- source_word: בַּעֲדִי
  choice: всё, что касается меня
  rationale: Предлог с суффиксом допускает значения «за меня», «ради меня», «обо мне / касательно меня». Основной вариант передаёт значение отношения к псалмопевцу, а альтернативные оттенки сохранены в сноске.
- source_word: חַסְדְּךָ
  choice: твоя верная любовь
  rationale: חסד обозначает стойкую, деятельную и верную любовь; этот вариант сохраняет как личный, так и постоянный характер отношения, не сужая смысл до одной лишь милости.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт неограниченную длительность; именная конструкция с тире соответствует лаконизму еврейской строки.
- source_word: מַעֲשֵׂי יָדֶיךָ
  choice: дел своих рук
  rationale: 'Сохраняет множественное число еврейского מַעֲשֵׂי и открытость референта: речь может идти как о содеянном Богом в жизни молящегося, так и шире о Божьих творениях и делах.'
- source_word: אַל תֶּרֶף
  choice: не оставляй
  rationale: רפה здесь выражает просьбу не отпускать, не прекращать заботу и не бросать начатое; «не оставляй» естественно передаёт этот смысл в молитвенной речи.
theological_decisions:
- issue: Что именно Яхве завершит в выражении יִגְמֹר בַּעֲדִי
  choice: «доведёт до конца всё, что касается меня»
  alternative: «совершит за меня» или «осуществит свой замысел обо мне»
  rationale: В еврейском тексте нет существительного «замысел» или «предназначение». Основной перевод остаётся понятным по-русски, но не делает этот подразумеваемый объект явным богословским утверждением; иные оттенки предлога отмечены в сноске.
- issue: Референт выражения מַעֲשֵׂי יָדֶיךָ
  choice: Сохранено широкое выражение «дел своих рук»
  alternative: «дела, начатого во мне» или собирательное «творения своих рук»
  rationale: Фраза может включать самого псалмопевца и Божье действие в его жизни, но грамматика не ограничивает её этим смыслом. Множественное число сохраняет исходную широту.
translation_notes:
  register: Современный литературный русский язык с кратким молитвенно-поэтическим ритмом. Божественное имя передано как «Яхве»; местоимения второго лица набраны со строчной буквы согласно нейтральной современной орфографической практике. Сохранены параллелизм, восклицательная сила средней строки и смысловая открытость заключительной просьбы.
