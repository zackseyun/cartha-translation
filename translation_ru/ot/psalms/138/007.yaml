  text: אִם אֵלֵ֤ךְ בְּ/קֶ֥רֶב צָרָ֗ה תְּחַ֫יֵּ֥/נִי עַ֤ל אַ֣ף אֹ֭יְבַ/י תִּשְׁלַ֣ח יָדֶ֑/ךָ וְ/ת֖וֹשִׁיעֵ֣/נִי יְמִינֶֽ/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/138/007.yaml
  text: If I walk in the midst of trouble[a], you preserve my life; you stretch out your hand against the anger of my enemies[c][b], and your right hand saves me.
translation:
  language: ru
  text: Если я пойду посреди беды[a], Ты сохранишь мне жизнь[b]; против ярости моих врагов[c] Ты прострёшь Свою руку, и Твоя правая рука спасёт меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Хотя я иду посреди беды». Еврейское אִם в данном контексте может вводить как условное, так и уступительное придаточное предложение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ты оживишь меня»; «Ты сохранишь меня в живых». Еврейский глагол может обозначать как оживление, так и сохранение жизни.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «против гнева моих врагов». Еврейское אַף, буквально «нос», часто служит образным обозначением гнева или ярости.'
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Частица может иметь условное или уступительное значение. «Если» непосредственно передаёт её основное значение, а возможное «хотя» отмечено в сноске.
- source_word: אֵלֵךְ בְּקֶרֶב צָרָה
  choice: я пойду посреди беды
  rationale: Сохраняется конкретный образ движения внутри бедственного положения; «посреди беды» естественно и поэтично звучит по-русски.
- source_word: תְּחַיֵּנִי
  choice: Ты сохранишь мне жизнь
  rationale: Порода пиэль глагола חיה может означать оживление или сохранение в живых. В контексте опасности от врагов речь естественнее всего понимать как сохранение жизни.
- source_word: עַל אַף אֹיְבַי
  choice: против ярости моих врагов
  rationale: אַף буквально означает «нос», но служит устойчивым обозначением гнева. Перевод сохраняет направленность Божьего действия именно против вражеской ярости.
- source_word: תִּשְׁלַח יָדֶךָ
  choice: Ты прострёшь Свою руку
  rationale: «Простереть руку» естественно передаёт образ активного вмешательства, не устраняя антропоморфный язык оригинала.
- source_word: וְתוֹשִׁיעֵנִי יְמִינֶךָ
  choice: и Твоя правая рука спасёт меня
  rationale: Буквально сохраняется образ правой руки как силы, совершающей спасение; глагол ישע передан широким и прямым «спасёт».
theological_decisions:
- issue: Смысл Божьего действия в תְּחַיֵּנִי
  choice: сохранение жизни среди нынешней опасности
  alternative: оживление или восстановление
  rationale: Упоминание беды и врагов поддерживает значение сохранения псалмопевца в живых, однако более широкая возможность «оживишь» сохранена в сноске.
- issue: Направленность действия в עַל אַף אֹיְבַי
  choice: Бог действует против ярости врагов
  alternative: Бог действует против самих врагов
  rationale: Перевод не опускает слово אַף и тем самым сохраняет особую образность и напряжение еврейской фразы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Формы «прострёшь» и образ «правая рука» сохраняют достоинство и конкретность еврейской поэзии, оставаясь понятными широкому читателю. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
