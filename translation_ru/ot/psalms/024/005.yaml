  text: יִשָּׂ֣א בְ֭רָכָה מֵ/אֵ֣ת יְהוָ֑ה וּ֝/צְדָקָ֗ה מֵ/אֱלֹהֵ֥י יִשְׁעֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/005.yaml
  text: He will receive blessing from Yahweh[a], and righteousness from the God of his salvation.
translation:
  language: ru
  text: Он получит благословение от Яхве и праведность[a] от Бога своего спасения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оправдание»; возможно также: «справедливость». Еврейское слово может обозначать не только нравственную праведность, но и благоприятный судебный приговор или спасающую справедливость Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: получит
  rationale: С абстрактным дополнением «благословение» глагол נָשָׂא идиоматически означает получение; буквальные «понесёт» или «поднимет» здесь были бы неестественны.
- source_word: בְרָכָה
  choice: благословение
  rationale: Стандартная передача существительного; единственное число сохранено.
- source_word: מֵאֵת יְהוָה
  choice: от Яхве
  rationale: Предлог указывает на источник, а личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: וּצְדָקָה
  choice: и праведность
  rationale: «Праведность» сохраняет широкое значение צְדָקָה, не сводя его только к нравственности или судебному оправданию; контекстуальные варианты отмечены в сноске.
- source_word: מֵאֱלֹהֵי יִשְׁעוֹ
  choice: от Бога своего спасения
  rationale: Передача сохраняет конструкцию «Бог его спасения» и допускает понимание Бога как источника и совершителя спасения.
- source_word: יִשְׁעוֹ
  choice: своего спасения
  rationale: «Спасение» соответствует возвышенному богословскому регистру псалма и охватывает также смысл избавления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; форма «Яхве» прямо передаёт его как имя, не заменяя титулом.
- issue: Значение צְדָקָה в данном контексте
  choice: праведность
  alternative: оправдание; справедливость
  rationale: Основной вариант сохраняет нравственные, заветные и судебно-спасительные оттенки слова; подлинная неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксический параллелизм еврейского стиха сохранён; местоимение «своего» естественно соотносит спасение с субъектом «он».
