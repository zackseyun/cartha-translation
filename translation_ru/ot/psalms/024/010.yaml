source:
  edition: WLC
  text: מִ֤י ה֣וּא זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְהוָ֥ה צְבָא֑וֹת ה֤וּא מֶ֖לֶךְ הַ/כָּב֣וֹד סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/010.yaml
  text: Who is this King of glory? Yahweh of hosts—he is the King of glory[b][a]. Selah
translation:
  language: ru
  text: 'Кто Он, этот Царь славы?

    Яхве Воинств[a] — Он Царь славы.

    Села[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве армий». Еврейский титул может широко обозначать небесные воинства или упорядоченные силы.'
    reason: lexical_alternative
  - marker: b
    text: «Села» — вероятно, музыкальная или богослужебная помета; её точное значение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: מִי הוּא זֶה
  choice: Кто Он, этот
  rationale: Сочетание вопросительного слова, местоимения и указательного местоимения образует подчёркнутый риторический вопрос. Такая формулировка сохраняет эмфазу и естественно звучит по-русски.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Царь славы
  rationale: Сохранена еврейская сопряжённая конструкция и многозначность כָּבוֹד, включающая славу, величие и честь. Заглавная буква указывает на употребление выражения как божественного титула.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: «Воинства» сохраняет широту еврейского слова, которое может обозначать небесные войска или упорядоченные силы, не сводя смысл только к земным армиям.
- source_word: הוּא
  choice: Он
  rationale: 'Явно переданное местоимение сохраняет усиленное отождествление: именно Яхве Воинств есть Царь славы, без добавления отсутствующего в тексте слова «один».'
- source_word: סֶלָה
  choice: Села
  rationale: Поскольку точное значение термина неизвестно, он передан транслитерацией, без догматического или музыкального истолкования в основном тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» непосредственно передаёт имя и не заменяет его титулом.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Яхве армий; Господь Саваоф
  rationale: Выбранная форма сохраняет образ множественных воинств и не уточняет без достаточного основания, земные это армии, небесные силы или весь упорядоченный сонм.
translation_notes:
  register: Современный литературный русский язык с поэтической краткостью и торжественностью псалма. Повтор и риторическая эмфаза оригинала сохранены; архаизм «воинств» оставлен как точный и достаточно понятный элемент божественного титула.
