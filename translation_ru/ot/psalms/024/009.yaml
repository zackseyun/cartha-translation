  rationale: Еврейский текст прямо говорит о «головах» ворот. Сохранение метафоры передаёт поэтическую и литургическую силу строки, не навязывая архитектурного толкования.
- issue: Значение עוֹלָם в сочетании פִּתְחֵי עוֹלָם
  choice: «древние двери»
  alternative: «вечные двери» / «вековые двери»
  rationale: Слово допускает как давнюю древность, так и длительность без обозримого конца. Основной текст использует естественное контекстуальное значение, а реальная неоднозначность сохраняется в сноске.
