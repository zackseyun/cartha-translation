  text: Таков род тех, кто ищет его, кто ищет твоего лица, Иаков.[a] Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза синтаксически трудна. Основной текст следует традиционному чтению: «ищущих его, ищущих твоего лица, Иаков». В написании еврейского текста возможно также: «они ищут». В некоторых древних переводах: «ищущие лица Бога Иакова».'
    reason: Примечание отражает отмеченное в WLC кетив/кере и распространённое древнее толкование, не добавляя в основной текст отсутствующее слово «Бог».
lexical_decisions:
- source_word: זֶה דּוֹר
  choice: Таков род
  rationale: Именная конструкция буквально означает «это/таков род (поколение)»; «таков род» естественно передаёт характеристику людей, данную в предыдущих стихах.
- source_word: דֹּרְשָׁיו
  choice: ищущих его
  rationale: Суффикс третьего лица сохранён без замены на имя Бога; глагол דרשׁ здесь выражает усердное обращение к кому-либо и стремление найти его.
- source_word: מְבַקְשֵׁי פָנֶיךָ
  choice: ищущих твоего лица
  rationale: Сохранён библейский образ «искать лица», то есть стремиться к присутствию и благоволению адресата, без поясняющей подстановки в основной текст.
- source_word: יַעֲקֹב
  choice: Иаков
  rationale: Масоретский текст содержит только имя «Иаков», без слов «Бог Иакова»; оно сохранено как обращение, несмотря на синтаксическую трудность.
- source_word: סֶלָה
  choice: Села
  rationale: Технический литургический или музыкальный термин транслитерирован, поскольку его точное значение неизвестно.
theological_decisions:
- issue: К кому относится обращение «Иаков»
  choice: Сохранить «Иаков» как прямое обращение
  alternative: «Бога Иакова» или «о Боже Иакова»
  rationale: Еврейский масоретский текст буквально читает «ищущие твоего лица, Иаков». Добавление слова «Бог» устраняет трудность, но не представлено в данном еврейском тексте и потому не внесено в основной перевод.
- issue: Референт местоимения в «ищущих его»
  choice: Сохранить местоимение «его»
  alternative: «ищущих Господа»
  rationale: Так сохраняется грамматическая форма оригинала и не устраняется переход от третьего лица к обращению во втором лице.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и намеренно трудной формулировки оригинала. Местоимения, относящиеся к Богу, даны со строчной буквы как обычные местоимения современного текста; это не снижает почтительности и не добавляет отсутствующей в еврейском письме интерпретации.
