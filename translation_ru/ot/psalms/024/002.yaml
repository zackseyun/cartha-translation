  text: Ибо Он основал её на морях и утвердил её на реках.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для утверждения предыдущего стиха. «Ведь» естественно передаёт причинно-пояснительную связь в современной русской поэтической речи.
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение явно называет и слегка подчёркивает субъект; прописная буква уместна как традиционное уважительное обозначение Бога в русском библейском тексте.
- source_word: עַל
  choice: на
  rationale: В образе основания предлог естественно передаётся русским «на»; более буквальное или пространственное «над» неоправданно сужало бы образ.
- source_word: יַמִּים
  choice: морях
  rationale: Это обычное значение множественного числа от יָם. Оно сохраняет древний поэтический образ вод, не заменяя его объяснительной парафразой.
- source_word: יְסָדָהּ
  choice: основал её
  rationale: Глагол יסד обозначает закладку основания. Местоимение женского рода отсылает к «земле» в предыдущем стихе.
- source_word: וְעַל
  choice: и … на
  rationale: Сохраняет синтаксический и поэтический параллелизм двух полустиший.
- source_word: נְהָרוֹת
  choice: реках
  rationale: Прямое и прозрачное значение существительного; возможный космологический оттенок водных потоков не следует вносить в основной текст посредством расширительной передачи.
- source_word: יְכוֹנְנֶהָ
  choice: утвердил её
  rationale: Глагол כון здесь передаёт придание устойчивости и прочности. «Утвердил» сохраняет смысловое отличие от יסד и звучит естественно и достойно.
theological_decisions:
- issue: Космологический образ земли, основанной на морях и реках
  choice: 'Сохранить образ прямо: «на морях… на реках».'
  alternative: Истолковать его отвлечённо как устойчивость мира либо заменить современной научной парафразой.
  rationale: Еврейский текст использует поэтический язык устройства творения. Перевод должен сохранить этот образ, не демифологизируя его и не превращая в научное утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, псалмическим звучанием. Параллелизм «основал… утвердил» и «на морях… на реках» сохранён; архаизмы и пояснительные добавления не используются.
