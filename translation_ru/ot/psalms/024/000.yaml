base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/000.yaml
  text: A psalm of David[a]. Yahweh's is the earth and its fullness[b], the world and those who dwell in it.
translation:
  language: ru
  text: 'Псалом Давида.[a]


    Земля и всё, что её наполняет,[b] принадлежат Яхве,

    вселенная и живущие в ней.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Псалом, посвящённый Давиду».'
    reason: В заголовке предлог לְ может обозначать авторство, принадлежность или посвящение.
  - marker: b
    text: 'Буквально: «и полнота её».'
    reason: Сохраняется более формальная лексическая альтернатива для מְלוֹאָהּ.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: псалом
  rationale: Традиционный и общепонятный русский эквивалент, обозначающий песнь с музыкальным сопровождением.
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая естественная передача заголовочной формулы; сохраняет обычное понимание связи псалма с Давидом, а возможная неоднозначность предлога отмечена в сноске.
- source_word: לַיהוָה
  choice: принадлежат Яхве
  rationale: Дательный предлог выражает принадлежность; явный глагол добавлен по нормам русского языка. Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: הָאָרֶץ וּמְלוֹאָהּ
  choice: земля и всё, что её наполняет
  rationale: Передаёт составное подлежащее и естественно раскрывает идиоматическое значение «полноты» как всего содержащегося на земле.
- source_word: תֵּבֵל
  choice: вселенная
  rationale: Поэтический русский эквивалент для обитаемого мира как целого; он отличает слово от הָאָרֶץ, не делая различие чрезмерно жёстким.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: и живущие в ней
  rationale: Близкая и естественная передача причастной конструкции, включающей всех обитателей мира.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Источник содержит личное имя Бога; его явная передача сохраняет лексическое различие между именем и титулом и согласуется с консультационным слоем.
- issue: Отношение Давида к псалму в формуле לְדָוִד
  choice: Псалом Давида
  alternative: Псалом, посвящённый Давиду
  rationale: Наиболее привычная формула не уточняет категорически вид связи, тогда как менее обычная возможность посвящения сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Перенос строки отражает параллелизм еврейского стиха; тире связывает две соотнесённые пары подлежащих с общей идеей принадлежности.
