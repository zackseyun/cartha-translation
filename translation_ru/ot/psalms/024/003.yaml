    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: кто
  rationale: Вопросительное местоимение вводит риторический вопрос о том, кто достоин или вправе приблизиться; краткое «кто» естественно сохраняет форму еврейского текста.
- source_word: יַעֲלֶה
  choice: может взойти
  rationale: Форма qal imperfect глагола עלה означает «подниматься, восходить». В данном литургическом контексте речь идёт не просто о будущем действии, а о возможности и праве приблизиться; «может взойти» передаёт этот оттенок, не превращая его в категорическое утверждение.
- source_word: בְהַר
  choice: на гору
  rationale: Существительное הַר может обозначать гору или холм. «Гора» уместна в связи с Сионом и сохраняет традиционный возвышенный образ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой в современной русской библеистике транслитерацией «Яхве», а не заменено титулом.
- source_word: וּמִי
  choice: и кто
  rationale: Союз и вопросительное местоимение сохранены, чтобы передать параллелизм двух поэтических строк.
- source_word: יָקוּם
  choice: может стоять
  rationale: Глагол קום может означать «встать» или «стоять». В контексте доступа к святому месту «стоять» выражает возможность занять место и оставаться в присутствии Бога.
- source_word: בִּמְקוֹם
  choice: на ... месте
  rationale: מָקוֹם имеет широкое значение «место». Русское сочетание «стоять на месте» естественно, а последующее определение уточняет, что речь идёт о святом месте.
- source_word: קָדְשׁוֹ
  choice: Его святом
  rationale: 'Форма выражает принадлежность: «его святое [место]». Притяжательное местоимение относится к Яхве; прописная буква использована согласно принятой русской благоговейной письменной норме.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Смысл imperfect в риторических вопросах
  choice: может взойти / может стоять
  alternative: взойдёт / встанет; способен взойти / способен стоять
  rationale: Вопрос касается допуска и соответствия человека святому месту, но сами глагольные формы могут допускать оттенки будущности и способности. «Может» естественно передаёт модальный смысл, не уточняя, идёт ли речь прежде всего о разрешении, способности или достоинстве.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим синтаксисом. Параллелизм двух вопросов сохранён; лексика понятна широкому читателю и не перегружена церковнославянизмами.
