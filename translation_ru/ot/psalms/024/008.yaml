source:
  edition: WLC
  text: מִ֥י זֶה֮ מֶ֤לֶךְ הַ/כָּ֫ב֥וֹד יְ֭הוָה עִזּ֣וּז וְ/גִבּ֑וֹר יְ֝הוָ֗ה גִּבּ֥וֹר מִלְחָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/008.yaml
  text: Who is this King of glory? Yahweh[a], strong and mighty; Yahweh, mighty in battle.
translation:
  language: ru
  text: Кто этот Царь славы? Яхве, сильный и могучий, Яхве, могучий в битве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могучий на войне».'
    reason: Лексическая альтернатива для מִלְחָמָה, которое может обозначать как отдельную битву, так и войну.
lexical_decisions:
- source_word: מִי זֶה
  choice: Кто этот
  rationale: Естественно передаёт идиоматический вопрос и сохраняет прямую литургическую форму вызова и ответа.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Царь славы
  rationale: Буквально и ёмко передаёт конструкцию сопряжённого сочетания, сохраняя титульный характер выражения и повторяющийся рефрен псалма.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עִזּוּז
  choice: сильный
  rationale: Передаёт значение силы и позволяет отличить это слово от следующего גִבּוֹר.
- source_word: וְגִבּוֹר
  choice: и могучий
  rationale: Сохраняет параллельные, но не тождественные характеристики и не вводит образ воина раньше следующей фразы.
- source_word: גִּבּוֹר מִלְחָמָה
  choice: могучий в битве
  rationale: Сохраняет сочетание определения со словом «битва», естественно звучит по-русски и не добавляет отсутствующее в еврейском тексте существительное «воин».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным литургическим звучанием. Параллелизм и краткость еврейской строки сохранены.
