base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/001.yaml
  text: A psalm of David[a]. The earth and its fullness are Yahweh’s[b], the world and those who dwell in it.
translation:
  language: ru
  text: 'Псалом Давида.[a]


    Яхве принадлежат

    земля и всё, что её наполняет,

    мир и все живущие в нём.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский заголовок можно также понять как «псалом, принадлежащий Давиду» или «псалом для Давида».
    reason: Служебное слово לְ может обозначать авторство, принадлежность, связь или посвящение.
  - marker: b
    text: 'По традиции имя Яхве часто передают словом «Господь»: «Господу принадлежат».'
    reason: Указывает традиционный способ передачи тетраграмматона, не подменяя им имя в основном тексте.
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: Родительный падеж в заголовке естественен для русского языка и, подобно еврейскому לְ, не уточняет однозначно, идёт ли речь об авторстве, принадлежности или посвящении.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Стандартное и понятное русское обозначение поэтической песни этого жанра.
- source_word: לַיהוָה
  choice: принадлежат Яхве
  rationale: Еврейская безглагольная конструкция выражает принадлежность. Русский глагол «принадлежат» передаёт её ясно и естественно, а личное имя Яхве непосредственно отражает יהוה.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Параллелизм с תֵּבֵל и всеобщий охват стиха указывают здесь на всю землю, а не на отдельную страну.
- source_word: וּמְלוֹאָהּ
  choice: и всё, что её наполняет
  rationale: Так естественно по-русски передаётся буквальное «и полнота её» без потери образа наполненности.
- source_word: תֵּבֵל
  choice: мир
  rationale: Слово обозначает обитаемый, устроенный мир; «мир» здесь современнее и естественнее, чем «вселенная», которая может быть понята как космос.
- source_word: וְיֹשְׁבֵי בָהּ
  choice: и все живущие в нём
  rationale: Передаёт субстантивированное причастие и сохраняет его словесную динамику, не сводя выражение к более отвлечённому «обитатели».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и представляет наиболее распространённую научную реконструкцию его произношения; традиционная замена «Господь» указана в сноске.
- issue: Объём утверждения о принадлежности
  choice: Сказуемое «принадлежат Яхве» относится как к земле со всем её наполнением, так и к миру со всеми живущими в нём
  alternative: Повторить сказуемое во второй строке
  rationale: Еврейский поэтический параллелизм ставит рядом две соотнесённые пары и подразумевает одно и то же отношение принадлежности, не повторяя его.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным поэтическим строем. Синтаксис следует еврейскому параллелизму, но буквальное «полнота её» заменено понятным выражением «всё, что её наполняет». Род местоимений согласован с русскими существительными: «земля — её», «мир — в нём».'
