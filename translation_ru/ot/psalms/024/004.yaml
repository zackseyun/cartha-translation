  yaml_path: translation/ot/psalms/024/004.yaml
  text: The one who has clean hands and a pure heart[c][b][a], who has not lifted up his soul to falsehood or sworn deceitfully.
translation:
  language: ru
  text: Тот, у кого чисты руки и чисто сердце, кто не обращал души моей[a] ко лжи[b] и не клялся ложно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В согласном тексте — «моей души»; многие принимают чтение «своей души», соответствующее описанию в третьем лице на протяжении всего стиха.
    reason: textual_variant
  - marker: b
    text: 'Или: «к суете», «к пустому», «к тому, что ложно»; иногда здесь подразумевают идола.'
