lexical_decisions:
- source_word: נְקִי כַפַּיִם
  choice: у кого чисты руки
  rationale: Сохраняет конкретный еврейский образ нравственной чистоты, проявляющейся в поступках, и естественно звучит по-русски.
- source_word: בַר לֵבָב
  choice: чисто сердце
  rationale: Передаёт внутреннюю нравственную чистоту и сохраняет параллель между руками и сердцем.
- source_word: נָשָׂא ... נַפְשׁוֹ / נַפְשִׁי
  choice: обращал души своей
  rationale: Глагол с существительным «душа» выражает направленность внутреннего стремления. «Обращал» естественнее буквального «возносил», но не устраняет исходный образ и допускает неоднозначность оборота.
- source_word: לַשָּׁוְא
  choice: ко лжи
  rationale: Слово שָׁוְא может обозначать ложь, пустоту или ничтожное. В нравственном контексте и рядом с обманной клятвой «ложь» является ясным, но не исчерпывающим соответствием; другие значения отмечены в сноске.
- source_word: נִשְׁבַּע לְמִרְמָה
  choice: не клялся с обманом
  rationale: Передаёт как ложность клятвы, так и намерение обмануть, не сужая выражение только до фактической неправды.
theological_decisions:
- issue: Местоименный суффикс в נַפְשִׁי («моей души») и контекстуальное чтение «своей души»
  choice: 'В основном тексте: «души своей»'
  alternative: «моей души»
  rationale: Описание последовательно относится к третьему лицу, поэтому чтение «своей души» связно по контексту и соответствует традиционному масоретскому чтению, учитывающему исправление. Однако согласный текст WLC допускает форму «моей души»; она сохранена в сноске, чтобы не скрывать текстологическое напряжение.
- issue: Значение שָׁוְא
  choice: «ложь»
  alternative: «суета», «пустое», возможно «идол»
  rationale: «Ложь» хорошо согласуется с последующим упоминанием обмана, но более широкий смысл слова не исключается и указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис сохраняет ответную формулу «Тот, у кого…», а параллель «чисты руки — чисто сердце» передаёт внешнюю и внутреннюю нравственную цельность без конфессионального истолкования.
