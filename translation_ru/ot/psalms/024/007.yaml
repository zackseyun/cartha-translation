source:
  edition: WLC
  text: שְׂא֤וּ שְׁעָרִ֨ים רָֽאשֵׁי/כֶ֗ם וְֽ֭/הִנָּשְׂאוּ פִּתְחֵ֣י עוֹלָ֑ם וְ֝/יָב֗וֹא מֶ֣לֶךְ הַ/כָּבֽוֹד׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/024/007.yaml
  text: Lift up your heads[a], O gates, and be lifted up, O ancient doors, that the King of glory may come in.
translation:
  language: ru
  text: 'Поднимите головы, ворота,

    вознеситесь, древние двери[a],

    чтобы вошёл Царь славы!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечные двери». Еврейское выражение может обозначать как двери глубокой древности, так и двери, пребывающие вечно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ
  choice: Поднимите
  rationale: Повелительная форма сохраняет прямое, энергичное обращение к олицетворённым воротам.
- source_word: שְׁעָרִים
  choice: ворота
  rationale: Обычный и точный русский эквивалент для городских или храмовых ворот.
- source_word: רָאשֵׁיכֶם
  choice: головы
  rationale: Буквальное значение поддерживает поэтическое олицетворение ворот и не заменяет образ архитектурным пояснением вроде «верхи».
- source_word: וְהִנָּשְׂאוּ
  choice: вознеситесь
  rationale: Возвышенный, но понятный императив передаёт пассивно-возвратный оттенок нифаля и создаёт поэтический отклик на «поднимите».
- source_word: פִּתְחֵי עוֹלָם
  choice: древние двери
  rationale: פִּתְחֵי в параллелизме естественно передано как «двери», а עוֹלָם здесь может указывать на глубокую древность; возможное значение вечной длительности сохранено в сноске.
- source_word: וְיָבֹא
  choice: чтобы вошёл
  rationale: После двух повелений сочетание союза с имперфектом естественно выражает цель или ожидаемый результат.
- source_word: מֶלֶךְ הַכָּבוֹד
  choice: Царь славы
  rationale: Буквально передаёт конструкцию сопряжения и сохраняет её торжественное звучание как титула.
theological_decisions:
- issue: Сохранение олицетворения и образа царского входа без сужающего толкования
  choice: Ворота и двери остаются непосредственными адресатами повелений и наделяются «головами».
  alternative: Передать образ пояснительно как простой призыв открыть или расширить ворота.
  rationale: Еврейский текст прямо обращается к воротам и дверям. Сохранение олицетворения передаёт поэтическую и богослужебную напряжённость стиха, не навязывая конкретной исторической или мессианской идентификации сцены.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. «Вознеситесь» выбрано как понятное возвышенное слово, уместное для псалма; синтаксис остаётся ясным для современного читателя. Маркер сноски поставлен непосредственно после выражения, к которому относится лексическая альтернатива.
