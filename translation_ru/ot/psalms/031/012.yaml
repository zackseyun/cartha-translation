lexical_decisions:
- source_word: נִשְׁכַּחְתִּי
  choice: Я забыт
  rationale: Нифаль перфекта 1-го лица единственного числа выражает состояние говорящего как забытого; русское настоящее краткое причастие естественно передаёт этот наличный результат.
- source_word: כְּמֵת
  choice: словно мёртвый
  rationale: Предлог כְּ обозначает сравнение, а מֵת стоит в единственном числе; перевод сохраняет личный образ одного умершего.
- source_word: מִלֵּב
  choice: исчез из памяти
  rationale: Буквально выражение означает «из сердца», однако לֵב здесь связано с внутренним сознанием и памятью. Русская идиома передаёт смысл естественно, не повторяя слово «забыт».
- source_word: הָיִיתִי
  choice: я стал
  rationale: Перфект глагола היה в данном сравнении указывает на наступившее состояние; «я стал» кратко и естественно передаёт эту перемену.
- source_word: כִּכְלִי
  choice: словно … сосуд
  rationale: כְּלִי может обозначать сосуд, орудие или предмет. «Сосуд» сохраняет традиционно-поэтический образ, не уточняя материал или назначение.
- source_word: אֹבֵד
  choice: потерянный
  rationale: Причастие от אבד допускает значения утраченности, гибели и разрушения. «Потерянный» сохраняет основную неоднозначность, а другие оттенки отмечены в сноске.
