lexical_decisions:
- source_word: בְּיָדְךָ
  choice: В Твоей руке
  rationale: Сохраняет еврейский образ руки как власти и попечения, а также смысловую перекличку с последующим выражением «от руки моих врагов».
- source_word: עִתֹּתָי
  choice: времена моей жизни
  rationale: 'Передаёт множественное «мои времена» естественным современным русским языком, сохраняя широкий смысл: периоды, события и обстоятельства жизни, — без сужения до одной лишь «судьбы».'
- source_word: הַצִּילֵנִי
  choice: избавь меня
  rationale: Ясно выражает конкретное спасение от непосредственной опасности и соответствует возвышенному поэтическому регистру псалма.
- source_word: מִיַּד
  choice: от руки
  rationale: 'Сохраняет метафору власти и намеренный контраст: жизнь псалмопевца находится в руке Бога, но он просит вырвать его из руки врагов.'
- source_word: אֹיְבַי
  choice: моих врагов
  rationale: Прямой и естественный эквивалент обозначения враждебных противников.
- source_word: וּמֵרֹדְפָי
  choice: и от моих преследователей
  rationale: Передаёт причастное обозначение тех, кто гонится за псалмопевцем, не добавляя более узкого смысла религиозного или институционального преследования.
theological_decisions:
- issue: Смысловой объём выражения «мои времена»
  choice: Широкое указание на периоды, события и обстоятельства жизни псалмопевца, находящиеся во власти Бога
  alternative: «моя судьба» или только «назначенные мне сроки»
  rationale: Еврейское выражение поэтически многозначно. Формулировка «времена моей жизни» сохраняет эту широту и не превращает стих в более определённое утверждение о судьбе или исключительно о заранее назначенных сроках.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Сохранены метафора «руки» и её смысловой контраст в двух частях стиха; местоимение, относящееся к Богу, написано с прописной буквы в соответствии с принятой русской библейской традицией.
