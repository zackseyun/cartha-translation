source:
  edition: WLC
  text: תֵּ֥אָלַ֗מְנָה שִׂפְתֵ֫י שָׁ֥קֶר הַ/דֹּבְר֖וֹת עַל צַדִּ֥יק עָתָ֗ק בְּ/גַאֲוָ֥ה וָ/בֽוּז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/018.yaml
  text: Let lying lips be silenced[d][c][b][a], which speak arrogantly against the righteous with pride and contempt.
translation:
  language: ru
  text: Да онемеют[a] лживые уста, дерзко[c] говорящие против праведника[b], с гордостью и презрением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «да умолкнут»; еврейский глагол может означать как прекращение речи, так и онемение.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское единственное число может относиться к конкретному праведному человеку или обозначать праведника как представителя всех праведных.
    reason: lexical_alternative
  - marker: c
    text: Буквально здесь употреблено существительное со значением «дерзость», «наглость» или «надменность», характеризующее речь.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּאָלַמְנָה
  choice: Да онемеют
  rationale: Нифаль, имперфект 3-го лица женского рода множественного числа с пожелательно-побудительным значением. «Да онемеют» естественно передаёт и значение прекращения речи, и силу проклятия-пожелания.
- source_word: שִׂפְתֵי שָׁקֶר
  choice: лживые уста
  rationale: Сопряжённое сочетание буквально означает «уста лжи». «Лживые уста» сохраняет образ и звучит естественно в современном литературном русском языке.
- source_word: הַדֹּבְרוֹת
  choice: говорящие
  rationale: Причастие женского рода множественного числа согласуется с «устами» и определяет их.
- source_word: עַל צַדִּיק
  choice: против праведника
  rationale: Предлог выражает направленность враждебной речи, а единственное число צַדִּיק может обозначать как конкретного праведного человека, так и праведника как тип.
- source_word: עָתָק
  choice: дерзко
  rationale: Существительное обозначает дерзость, наглость или надменную речь; наречное «дерзко» естественно характеризует говорение и не дублирует буквально последующее «с гордостью».
- source_word: בְּגַאֲוָה
  choice: с гордостью
  rationale: Предлог בְּ здесь указывает на образ или характер действия; перевод сохраняет отдельный акцент на высокомерии.
- source_word: וָבוּז
  choice: и презрением
  rationale: בּוּז означает презрение, пренебрежение или поношение; «презрение» точно сочетается с «гордостью».
theological_decisions:
- issue: Кого обозначает צַדִּיק в единственном числе
  choice: праведника
  alternative: праведного / праведных
  rationale: Перевод не отождествляет праведника с определённым лицом и сохраняет возможность как индивидуального, так и типологически-обобщённого прочтения.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной псалмовой формулы «Да онемеют» и библейского образа «уста». Порядок смысловых компонентов близок к еврейскому; «дерзко» отличает עָתָק от последующего בְּגַאֲוָה и избегает стилистически слабого повтора «надменно… с гордостью».
