  language: en
  yaml_path: translation/ot/psalms/031/004.yaml
  text: Bring me out of this net that they have hidden for me[a], for you are my stronghold.
translation:
  language: ru
  text: Выведи меня из сети, которую они спрятали для меня, ведь Ты — моя твердыня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תּוֹצִיאֵנִי
  choice: Выведи меня
  rationale: Каузативная форма глагола יצא означает «вывести, дать выйти». «Выведи меня» естественно звучит по-русски и сохраняет прямую просьбу без добавления значения избавления, которого сам глагол не требует.
- source_word: מֵרֶשֶׁת
  choice: из сети
  rationale: רֶשֶׁת буквально обозначает сеть и может метафорически представлять ловушку. Перевод сохраняет конкретный образ оригинала.
- source_word: זוּ
  choice: которую
  rationale: Редкая форма זוּ здесь допускает относительное или указательное понимание. В сочетании с последующим глаголом естественное русское относительное предложение «сеть, которую…» точно передаёт синтаксическую связь, не вводя неестественного «эту сеть, которую».
- source_word: טָמְנוּ לִי
  choice: они тайно расставили для меня
  rationale: טמן означает «прятать, скрывать»; применительно к сети речь идёт о её скрытом размещении. «Тайно расставили» сохраняет идею сокрытия и естественно сочетается с образом сети; более буквальное «спрятали для меня» по-русски может ошибочно звучать благожелательно.
- source_word: כִּי
  choice: ведь
  rationale: כִּי вводит основание просьбы. «Ведь» естественно связывает прошение с исповеданием доверия и сохраняет поэтический тон.
- source_word: מָעוּזִּי
  choice: моя твердыня
  rationale: מָעוֹז обозначает укреплённое место, оплот или источник защищающей силы. «Твердыня» сохраняет защитно-крепостной образ и соответствует возвышенному, но понятному библейскому регистру.
theological_decisions:
- issue: Метафора Бога как защищающей крепости
  choice: Ты — моя твердыня
  alternative: Ты — моё убежище / Ты — моя крепость
  rationale: «Твердыня» передаёт Бога как источник прочной защиты, не сводя метафору только к месту укрытия и не превращая её в узкое догматическое утверждение.
- issue: Характер сети как скрытой западни
  choice: которую они тайно расставили для меня
  alternative: которую они спрятали для меня
  rationale: Контекст выражает враждебное действие, однако сохраняется конкретный образ скрытой сети. Перевод не заменяет этот образ обобщённым словом «ловушка».
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической интонацией. Местоимение «Ты» написано с прописной буквы как уважительная издательская норма; синтаксис остаётся ясным для обычного читателя. Образ сети сохранён буквально, а значение скрытой западни пояснено в сноске.
