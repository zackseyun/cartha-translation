  text: כִּֽי סַלְעִ֣/י וּ/מְצוּדָתִ֣/י אָ֑תָּה וּ/לְמַ֥עַן שִׁ֝מְ/ךָ֗ תַּֽנְחֵ֥/נִי וּֽ/תְנַהֲלֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/003.yaml
  text: For you are my rock and my fortress[c][b][a]; and for your name’s sake you will lead me and guide me.
translation:
  language: ru
  text: Ведь[a] Ты — моя скала и моя крепость[b]; ради имени Твоего поведёшь меня и направишь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Потому что». Еврейское כִּי может вводить как причину, так и пояснение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «моя твердыня».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможен перевод как просьба: «веди меня и направляй». Два еврейских глагола близки по значению; разные русские слова сохраняют поэтический параллелизм.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание предыдущей просьбы и одновременно поясняет её. «Ведь» естественно передаёт эту связь в современной русской поэтической речи, не сводя значение только к строгому причинному союзу.
- source_word: סַלְעִי
  choice: моя скала
  rationale: Существительное обозначает скалу или утёс и метафорически выражает надёжную защиту. «Скала» сохраняет конкретный образ и привычно звучит по-русски.
- source_word: מְצוּדָתִי
  choice: моя крепость
  rationale: Слово означает укреплённое, защищённое место. «Крепость» ясно передаёт оборонительный образ и хорошо сочетается со «скалой».
- source_word: אָתָּה
  choice: Ты
  rationale: Самостоятельное местоимение в еврейском тексте подчёркивает, что именно Бог является скалой и крепостью псалмопевца; русская конструкция с тире сохраняет это отождествление без добавления глагола-связки.
- source_word: וּלְמַעַן שִׁמְךָ
  choice: ради имени Твоего
  rationale: Сохранена ёмкая библейская формула, связывающая действие Бога с Его именем — открытым характером, честью и верностью, — без сужающего толкования в основном тексте.
- source_word: תַּנְחֵנִי
  choice: поведёшь меня
  rationale: Hiphil от נחה означает вести или направлять. Совершенный вид будущего времени по-русски естественно выражает уверенное ожидание в контексте молитвы.
- source_word: וּתְנַהֲלֵנִי
  choice: и направишь
  rationale: Глагол близок по смыслу предыдущему и описывает руководство или сопровождение. «Направишь» отличает его от «поведёшь» и сохраняет поэтический параллелизм; объект «меня» естественно относится к обоим глаголам.
theological_decisions:
- issue: Смысл выражения «ради имени Твоего»
  choice: Просьба обосновывается Божьим именем, которое охватывает Его открытый характер, честь и верность.
  alternative: Понимать «имя» только как репутацию Бога перед людьми.
  rationale: Еврейская формула шире одной лишь внешней репутации. Её сохранение без развёрнутой парафразы удерживает богословскую ёмкость и не навязывает более узкого прочтения.
- issue: Модальность глаголов תַּנְחֵנִי и תְנַהֲלֵנִי
  choice: 'Уверенное будущее: «поведёшь меня и направишь».'
  alternative: 'Просьба: «веди меня и направляй»; либо настоящее время: «ведёшь меня и направляешь».'
  rationale: Префиксальные формы допускают контекстуальные оттенки ожидания или просьбы. После исповедания «Ты — моя скала и моя крепость» будущее время естественно передаёт доверительную уверенность, а примечание сохраняет реальную грамматико-контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский с ясной, достойной молитвенно-поэтической интонацией. Метафоры «скала» и «крепость» сохранены. Божественные местоимения написаны с прописной буквы как знак уважительного обращения, без изменения смысла исходного текста.
