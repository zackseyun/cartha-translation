base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/023.yaml
  text: Love Yahweh[b][a], all his faithful ones! Yahweh preserves the faithful and fully repays the one who acts proudly.
translation:
  language: ru
  text: Любите Господа, все верные Ему![a] Господь хранит верных и с избытком воздаёт тому, кто поступает надменно.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все преданные Ему», «все Его благочестивые» или «все Его святые». Еврейское слово обозначает людей, отличающихся верностью и преданностью Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сполна воздаёт». Еврейское выражение подчёркивает полноту или чрезмерность воздаяния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהֱבוּ
  choice: Любите
  rationale: Форма повелительного наклонения, множественного числа, прямо призывает общину любить Господа; настоящее несовершенное естественно передаёт постоянную направленность призыва.
- source_word: יְהוָה
  choice: Господа / Господь
  rationale: Традиционная русская передача тетраграмматона словом «Господь» сохраняет узнаваемость библейского регистра; в первом случае употреблён требуемый винительный падеж.
- source_word: כָּל־חֲסִידָיו
  choice: все верные Ему
  rationale: חסידיו обозначает принадлежащих Богу людей, отличающихся преданностью и верностью завету. Такая передача ясна современному читателю и сохраняет местоименный суффикс.
- source_word: אֱמוּנִים
  choice: верных
  rationale: Субстантивированное прилагательное во множественном числе обозначает верных, надёжных людей; краткая передача сохраняет смысловую связь с первой строкой.
- source_word: נֹצֵר
  choice: хранит
  rationale: Причастие от נצר выражает бережную охрану и сохранение; «хранит» естественно и уместно в русском поэтическом библейском стиле.
- source_word: וּמְשַׁלֵּם עַל־יֶתֶר
  choice: но сполна воздаёт
  rationale: שלם в породе пиэль означает воздаяние, а עַל־יֶתֶר усиливает его как полное или избыточное. «Сполна воздаёт» сохраняет интенсивность и допускает контекстуально отрицательный смысл суда.
- source_word: עֹשֵׂה גַאֲוָה
  choice: тому, кто поступает надменно
  rationale: Буквально «делающему гордость»; идиоматическая русская формулировка передаёт деятельное проявление высокомерия, а не просто внутреннее чувство.
theological_decisions:
- issue: Заветный смысл חֲסִידָיו
  choice: все верные Ему
  alternative: все святые Его; все благочестивые Его; все преданные Ему
  rationale: Выбор передаёт отношение верности и преданности Богу, не ограничивая слово позднейшим специальным значением «святые».
- issue: Соотношение אֱמוּנִים и חֲסִידָיו
  choice: 'Сохранить повтор корня «верн-» в русском: «верные Ему… верных»'
  alternative: «преданные Ему… верных»
  rationale: Хотя еврейские слова различны, в данном контексте оба характеризуют верность Богу. Повтор делает связь двух полустиший явной, не утверждая полного лексического тождества.
- issue: Характер Божьего воздаяния гордому
  choice: но сполна воздаёт тому, кто поступает надменно
  alternative: и с избытком воздаёт поступающему гордо
  rationale: Формулировка сохраняет противопоставление Божьей охраны верных и суда над надменным, не смягчая и не конкретизируя сверх текста природу воздаяния.
translation_notes:
  register: Современный литературный русский с достоинством псалмового призыва. Синтаксис прост и пригоден для публичного чтения; «надменно» сохраняет возвышенный, но понятный регистр. Частица «но» эксплицирует контраст, ясно подразумеваемый сопоставлением двух действий Господа.
