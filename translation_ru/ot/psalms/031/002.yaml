lexical_decisions:
- source_word: הַטֵּה אֵלַי אָזְנְךָ
  choice: Приклони ко мне ухо Твоё
  rationale: Сохранён конкретный образ Бога, склоняющего ухо к молящемуся; выражение понятно в современном литературном русском и уместно в возвышенной поэзии.
- source_word: מְהֵרָה
  choice: скорее
  rationale: Наречие передаёт настойчивую просьбу о немедленном действии; «скорее» естественнее по-русски в сочетании с повелительным наклонением.
- source_word: הַצִּילֵנִי
  choice: избавь меня
  rationale: Глагол נצל означает вырвать из опасности, избавить. Этот выбор передаёт срочность и позволяет отличить его от ישׁע в конце стиха.
- source_word: הֱיֵה לִי
  choice: Будь мне
  rationale: Кратко и непосредственно передаёт императив היה с местоимением в дательном значении, сохраняя личный характер просьбы.
- source_word: לְצוּר מָעוֹז
  choice: скалой-убежищем
  rationale: «Скала» сохраняет конкретную метафору צוּר, а «убежище» передаёт защитную функцию מָעוֹז. Дефисное сочетание естественно выражает единый поэтический образ.
- source_word: לְבֵית מְצוּדוֹת
  choice: укреплённым домом
  rationale: Перевод сохраняет образ בַּיִת, не сводя его просто к «крепости», и передаёт оборонительный смысл формы множественного числа מְצוּדוֹת.
- source_word: לְהוֹשִׁיעֵנִי
  choice: чтобы спасти меня
  rationale: Инфинитив с לְ передаёт цель или ожидаемый результат. «Спасти» прямо выражает значение ישׁע и сохраняет лексическое отличие от предшествующего «избавь».
