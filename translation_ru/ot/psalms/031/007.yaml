    reason: lexical_alternative
lexical_decisions:
- source_word: אָגִילָה
  choice: Буду ликовать
  rationale: Когортатив Qal, 1-е лицо единственного числа, выражает решимость или устремление к радостному ликованию. «Буду ликовать» естественно передаёт волевой и поэтический оттенок формы.
- source_word: וְאֶשְׂמְחָה
  choice: и радоваться
  rationale: Глагол שׂמח образует с גיל усилительную поэтическую пару. Сочетание «ликовать и радоваться» сохраняет параллелизм без неестественного повтора.
- source_word: בְּחַסְדֶּךָ
  choice: Твоей верной любви
  rationale: חֶסֶד обозначает деятельную, постоянную и верную любовь; такое выражение сохраняет как личный, так и заветный оттенок слова, не сужая его до одной лишь милости.
- source_word: אֲשֶׁר
  choice: потому что
  rationale: Относительная частица здесь по смыслу вводит основание для ликования; причинная связь естественно передаётся словами «потому что».
- source_word: רָאִיתָ אֶת עָנְיִי
  choice: Ты увидел моё страдание
  rationale: עֳנִי может обозначать бедствие, угнетённость или страдание. «Увидел моё страдание» кратко и ясно передаёт и факт восприятия, и тяжесть положения псалмопевца.
- source_word: יָדַעְתָּ
  choice: узнал о
  rationale: ידע охватывает знание, распознавание и внимательное отношение. «Узнал о» естественно сочетается в русском языке с последующим обозначением бедствий, сохраняя широту исходного глагола.
- source_word: בְּצָרוֹת נַפְשִׁי
  choice: о бедствиях моей души
  rationale: Множественное число צָרוֹת передано словом «бедствиях», а נֶפֶשׁ — словом «души». Это сохраняет поэтическую глубину выражения, не утверждая при этом технического противопоставления души и тела.
theological_decisions:
- issue: Передача נֶפֶשׁ в псалме-плаче
  choice: души
  alternative: жизни; меня самого
  rationale: В данном контексте נֶפֶשׁ может обозначать душу, жизнь или всю личность. «Души» уместно в поэтической речи и сохраняет смысловую широту; возможные целостные значения отмечены в сноске, чтобы не навязывать дуалистическое прочтение.
- issue: Смысл חֶסֶד
  choice: верная любовь
  alternative: милость; неизменная любовь; заветная верность
  rationale: Выбранная формулировка удерживает вместе любовь и постоянство, не сводя слово исключительно к милосердию и не добавляя в основной текст более узкую богословскую терминологию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Сохранены поэтическая парность глаголов и множественное число «бедствия».
