  text: וַ/אֲנִ֤י אָ֘מַ֤רְתִּי בְ/חָפְזִ֗/י נִגְרַזְתִּי֮ מִ/נֶּ֪גֶד עֵ֫ינֶ֥י/ךָ אָכֵ֗ן שָׁ֭מַעְתָּ ק֥וֹל תַּחֲנוּנַ֗/י בְּ/שַׁוְּעִ֥/י אֵלֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/022.yaml
  text: As for me[a], I said in my alarm[b], “I am cut off from before your eyes.” Yet you heard the sound of my pleas when I cried to you for help.
translation:
  language: ru
  text: 'А я в смятении[a] сказал: «Я отсечён от Твоего взора[b]». Но Ты услышал голос моих молений, когда я взывал к Тебе о помощи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в поспешности»; еврейское слово может обозначать поспешность, тревогу или панику.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от того, что перед Твоими глазами»; то есть вне Твоего поля зрения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְחָפְזִי
  choice: в смятении
  rationale: В данном плаче слово обозначает не просто поспешность, а тревожное, взволнованное состояние. «В смятении» естественно передаёт этот смысл по-русски, не усиливая его до однозначной паники.
- source_word: נִגְרַזְתִּי
  choice: я отсечён
  rationale: Редкая форма от גזר выражает отсечение или удаление. «Отсечён» сохраняет сильный образ исходного текста и непосредственность прямой речи.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: от Твоего взора
  rationale: 'Буквально: «от пред Твоими глазами». Русское «от Твоего взора» сохраняет образ зрения и остаётся понятным, не превращая переживание псалмопевца в явное утверждение о Божьем отвержении.'
- source_word: אָכֵן
  choice: но
  rationale: В контексте частица резко противопоставляет испуганный вывод псалмопевца тому, что Бог в действительности услышал его. «Но» ясно и естественно передаёт этот контраст.
- source_word: קוֹל תַּחֲנוּנַי
  choice: голос моих молений
  rationale: 'Перевод сохраняет оба элемента выражения: קוֹל — «голос» и תַּחֲנוּנִים — настойчивые просьбы о милости или благоволении.'
- source_word: בְּשַׁוְּעִי אֵלֶיךָ
  choice: когда я взывал к Тебе о помощи
  rationale: Глагол שׁוע обозначает обращённый к кому-либо крик о помощи. Добавление «о помощи» раскрывает значение самого глагола, а не привносит новую мысль.
theological_decisions:
- issue: Ощущение оставленности Богом и действительность Божьего ответа
  choice: 'Сохранено переживание псалмопевца: «Я отсечён от Твоего взора», за которым следует противопоставление: «Но Ты услышал».'
  alternative: 'Передать первую часть толковательно: «Я думал, что Ты отверг меня».'
  rationale: Еврейский текст описывает субъективное переживание через пространственный образ, но прямо не утверждает Божьего отвержения. Перевод сохраняет напряжение между человеческим восприятием и действительным Божьим слышанием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмовым звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Конкретный образ отсечения и Божьего взора сохранён, а архаичные «очи» и «прошения» не использованы.
