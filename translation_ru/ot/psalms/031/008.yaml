  text: וְ/לֹ֣א הִ֭סְגַּרְתַּ/נִי בְּ/יַד אוֹיֵ֑ב הֶֽעֱמַ֖דְתָּ בַ/מֶּרְחָ֣ב רַגְלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/008.yaml
  text: and you have not delivered me into the hand of the enemy[b][a]; you have set my feet in a broad place.
translation:
  language: ru
  text: и не предал меня в руки врага; Ты поставил мои ноги на просторе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Простор» здесь передаёт образ свободы, безопасности и избавления от стеснения или бедствия.
    reason: cultural_note
lexical_decisions:
- source_word: הִסְגַּרְתַּנִי
  choice: не предал меня
  rationale: Порода hифиль глагола סגר в данном контексте означает передачу человека под чужую власть. «Не предал меня» естественно и точно передаёт этот смысл, не сводя его к буквальному «не запер меня».
- source_word: בְּיַד
  choice: в руки
  rationale: Еврейская идиома обозначает переход под чью-либо власть. Русское «предать в руки» сохраняет образ руки и звучит естественно; множественное число соответствует устойчивому русскому выражению.
- source_word: אוֹיֵב
  choice: врага
  rationale: Единственное число без артикля допускает понимание конкретного, типичного или собирательного противника. «Врага» сохраняет грамматическое число и не уточняет больше, чем источник.
- source_word: הֶעֱמַדְתָּ
  choice: Ты поставил
  rationale: Каузативная форма עמד буквально выражает действие «поставить, дать стоять». Этот вариант сохраняет телесный образ устойчивого положения.
- source_word: בַמֶּרְחָב
  choice: на просторе
  rationale: מֶרְחָב обозначает широкое, свободное пространство в противоположность тесноте и бедствию. «На просторе» естественно для современного русского языка и сохраняет пространственную метафору.
- source_word: רַגְלָי
  choice: мои ноги
  rationale: Перевод сохраняет множественное число и конкретный образ ног, поставленных в свободном месте.
- source_word: וְלֹא
  choice: и не
  rationale: Простая соединительная связь воспроизведена союзом «и» без внесения дополнительного противительного оттенка.
