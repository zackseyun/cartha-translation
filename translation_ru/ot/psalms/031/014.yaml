  text: וַ/אֲנִ֤י עָלֶ֣י/ךָ בָטַ֣חְתִּי יְהוָ֑ה אָ֝מַ֗רְתִּי אֱלֹהַ֥/י אָֽתָּה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/014.yaml
  text: But as for me[a], I trust in you, O Yahweh; I say, “You are my God.”
translation:
  language: ru
  text: 'Но я[a] на Тебя уповаю, Яхве; я говорю: «Ты — мой Бог».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но я положился на Тебя, Яхве; я сказал: „Ты — мой Бог“». Еврейские формы могут обозначать прошлое действие или сохраняющее силу состояние; здесь они переданы как нынешние слова продолжающегося упования и исповедания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Но я
  rationale: Союз с самостоятельным местоимением выражает противопоставление и подчёркивает позицию псалмопевца; в современном русском это естественно передаётся сочетанием «Но я».
- source_word: עָלֶיךָ בָטַחְתִּי
  choice: на Тебя уповаю
  rationale: Предлог עַל при глаголе בטח указывает на того, на кого полагаются. «Уповаю на Тебя» точно и поэтически передаёт продолжающееся доверие Богу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: אָמַרְתִּי
  choice: я говорю
  rationale: Форма qatal допускает прошедшее или перфектное понимание, однако в контексте молитвы исповедание звучит как актуальное и продолжающееся; настоящее время сохраняет эту непосредственность.
- source_word: אֱלֹהַי אָתָּה
  choice: Ты — мой Бог
  rationale: Суффикс первого лица означает «мой», а отдельное местоимение אָתָּה подчёркивает «Ты»; тире естественно оформляет русское именное сказуемое.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе употреблено собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Временное значение форм בָטַחְתִּי и אָמַרְתִּי
  choice: 'настоящее время: «уповаю», «говорю»'
  alternative: 'прошедшее или настоящее совершённое: «уповал/положился», «сказал»'
  rationale: Еврейские формы допускают оба прочтения. Настоящее время передаёт их как действующие заявления веры в текущей молитве, а альтернативное временное понимание сохранено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой лексикой. Глагол «уповаю» сохраняет молитвенно-поэтический регистр, оставаясь понятным. Местоимения, обращённые к Богу, написаны с прописной буквы; личное имя передано как «Яхве».
