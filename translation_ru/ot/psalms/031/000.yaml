- source_word: לְדָוִד
  choice: Давида
  rationale: Русская родительная конструкция сохраняет традиционную краткость и допускает связь с Давидом, не утверждая однозначно только авторство.
theological_decisions:
- issue: Значение надписания לְדָוִד
  choice: Давида
  alternative: написанный Давидом; для Давида
  rationale: Предлог לְ־ в надписаниях может указывать на авторство, принадлежность, связь или посвящение; перевод не должен устранять эту смысловую открытость.
