base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/011.yaml
  text: Because of all my enemies I have become a reproach[a], especially to my neighbors, and a terror to my acquaintances[c][b]; those who see me in the street flee from me.
translation:
  language: ru
  text: Из-за всех моих врагов я стал предметом поношения[a], особенно для моих соседей, и ужасом для знакомых; те, кто видит меня на улице[b], бегут от меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «От всех моих врагов я стал предметом поношения»; возможно также сравнительное понимание: «Я стал предметом поношения больше, чем все мои враги».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «снаружи»; речь идёт о том, что его видят вне дома, на людях.'
    reason: cultural_note
  - marker: c
    text: 'Или: «сторонятся меня», «удаляются от меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכָּל צֹרְרַי
  choice: Из-за всех моих врагов
  rationale: 'Предлог מִן в данном контексте естественно понимать как указание на причину: враги стали причиной его позора. Сохраняется примечание о возможных иных разборах.'
- source_word: הָיִיתִי חֶרְפָּה
  choice: я стал посмешищем
  rationale: Конструкция היה с существительным обозначает наступившее состояние. «Стал» передаёт переход и сохраняющийся результат, а «посмешище» естественно выражает положение человека, сделавшегося объектом поношения.
- source_word: וְלִשֲׁכֵנַי מְאֹד
  choice: особенно для соседей
  rationale: מְאֹד усиливает сказанное применительно к соседям; «особенно» передаёт это усиление естественным современным русским языком.
- source_word: וּפַחַד לִמְיֻדָּעָי
  choice: и ужасом для знакомых
  rationale: פַחַד означает страх или ужас, а מְיֻדָּעַי — знакомых, то есть тех, кто знает говорящего, без обязательного оттенка близкой дружбы.
- source_word: רֹאַי בַּחוּץ
  choice: те, кто видит меня на улице
  rationale: בַחוּץ буквально означает «снаружи, вне дома», но здесь указывает на публичное пространство; «на улице» ясно и естественно передаёт ситуацию.
- source_word: נָדְדוּ מִמֶּנִּי
  choice: бегут от меня
  rationale: נָדַד допускает значения «бежать, удаляться, скитаться». В контексте испуганного публичного избегания «бегут» наиболее выразительно, при этом альтернативы отмечены в сноске.
