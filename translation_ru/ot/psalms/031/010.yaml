base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/010.yaml
  text: For my life is spent with grief[a], and my years with sighing; my strength has failed because of my iniquity[b], and my bones waste away.
translation:
  language: ru
  text: 'Ибо жизнь моя истощилась в скорби,

    и годы мои — во вздохах;

    из-за моего беззакония[a] ослабела сила моя[b],

    и кости мои иссохли[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за моей вины». Еврейское слово может означать беззаконие, вину или последствие вины.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол буквально означает «пошатнулась» или «споткнулась».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «изнемогли». Еврейский глагол означает истощаться, увядать или слабеть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предшествующей жалобы и сохраняет причинно-пояснительную связь.
- source_word: כָלוּ בְיָגוֹן חַיַּי
  choice: жизнь моя истощилась в скорби
  rationale: Форма חַיַּי, хотя морфологически множественная, идиоматически означает «моя жизнь»; כלה передаёт исчерпанность, изнурение или приближение к концу, а יָגוֹן — скорбь.
- source_word: וּשְׁנוֹתַי בַּאֲנָחָה
  choice: и годы мои — во вздохах
  rationale: 'Сохранён поэтический параллелизм и эллипсис: сказуемое из первой строки подразумевается и здесь. אֲנָחָה обозначает вздохи или стенания.'
- source_word: כָּשַׁל ... כֹחִי
  choice: ослабела сила моя
  rationale: כשל буквально описывает спотыкание или шатание, но применительно к силе метафорически означает её упадок; «ослабела» естественно передаёт смысл, а буквальный образ отмечен в сноске.
- source_word: בַּעֲוֺנִי
  choice: из-за моего беззакония
  rationale: Предлог ב здесь естественно понимать причинно. עָוֹן может означать беззаконие, вину или последствие вины; основной текст сохраняет нравственное значение, не уточняя механизм страдания.
- source_word: וַעֲצָמַי עָשֵׁשׁוּ
  choice: и кости мои иссохли
  rationale: Сохранён телесный образ; редкий глагол עשש выражает истощение, увядание или ослабление, чему в данном контексте соответствует «иссохли».
theological_decisions:
- issue: Значение עָוֹן в объяснении упадка сил псалмопевца
  choice: «беззаконие» в основном тексте
  alternative: «вина» или «последствие моей вины»
  rationale: Слово охватывает проступок, вину и её последствия. Перевод «беззаконие» сохраняет нравственную напряжённость признания, тогда как сноска оставляет открытыми другие лексически возможные оттенки и не утверждает определённой схемы прямого воздаяния.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Инверсия «сила моя», «кости мои» поддерживает ритм и достоинство стиха, оставаясь понятной. Разбивка на четыре строки передаёт еврейский параллелизм.
