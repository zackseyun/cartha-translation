  text: בְּ/יָדְ/ךָ֮ אַפְקִ֪יד ר֫וּחִ֥/י פָּדִ֖יתָה אוֹתִ֥/י יְהוָ֗ה אֵ֣ל אֱמֶֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/005.yaml
  text: Into your hand I commit my spirit; you have redeemed me[a], O Yahweh, God of truth.
translation:
  language: ru
  text: В твою руку я вверяю свой дух; ты искупил меня, Яхве, Бог истины[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верный Бог». Еврейское слово может означать истину, надёжность или верность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיָדְךָ
  choice: В твою руку
  rationale: Предлог בְּ при глаголе вверения естественно передаётся направительным сочетанием «в руку»; образ сохраняет смысл передачи себя под Божью власть и защиту.
- source_word: אַפְקִיד
  choice: я вверяю
  rationale: Порода хифиль глагола פקד здесь означает поручать или отдавать на попечение. «Вверяю» ясно выражает доверие и звучит естественно и торжественно.
- source_word: רוּחִי
  choice: свой дух
  rationale: רוּחַ может означать дух, дыхание или жизненную силу. В молитвенном контексте «дух» сохраняет широкий смысл личной жизни и внутреннего существа говорящего; возвратное «свой» естественно по-русски при подлежащем «я».
- source_word: פָּדִיתָה
  choice: ты искупил
  rationale: Глагол פדה означает выкупать или избавлять ценой выкупа. Прошедшее время прямо передаёт еврейский перфект, а «искупил» сохраняет присущий слову образ избавления.
- source_word: אוֹתִי
  choice: меня
  rationale: Прямое дополнение передано без смыслового расширения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: אֵל
  choice: Бог
  rationale: אֵל в приложении к имени Яхве естественно и точно передаётся словом «Бог».
- source_word: אֱמֶת
  choice: истины
  rationale: Существительное אֱמֶת охватывает значения истины, надёжности и верности. «Бог истины» формально сохраняет конструкцию исходного текста, а контекстуальное значение верности отмечено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл אֱמֶת в сочетании אֵל אֱמֶת
  choice: Бог истины
  alternative: верный Бог
  rationale: Еврейское слово может обозначать как истину, так и верность или надёжность. Основной текст сохраняет форму сочетания, а сноска не позволяет свести его смысл только к отвлечённой истинности.
- issue: Значение רוּחִי
  choice: свой дух
  alternative: своё дыхание / свою жизнь
  rationale: Слово רוּחַ имеет широкий диапазон значений. «Дух» сохраняет присущую стиху антропологическую и богословскую открытость, не ограничивая смысл одним лишь физическим дыханием.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью без архаизмов. Местоимения, обращённые к Богу, даны со строчной буквы как обычные местоимения исходного текста; пунктуация показывает, что «Яхве, Бог истины» — обращение.
