  text: בְּ/ךָ֖ יְהוָ֣ה חָ֭סִיתִי אַל אֵב֣וֹשָׁה לְ/עוֹלָ֑ם בְּ/צִדְקָתְ/ךָ֥ פַלְּטֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame. In your righteousness deliver me.
translation:
  language: ru
  text: 'В Тебе, Яхве, я нашёл убежище;

    да не буду я посрамлён вовек.

    По праведности Твоей[a] избавь меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По справедливости Твоей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּךָ
  choice: У Тебя
  rationale: Передаёт Бога как место убежища и сохраняет пространственную метафору, не сводя выражение к абстрактному «на Тебя уповаю».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом «Господь».
- source_word: חָסִיתִי
  choice: я нашёл убежище
  rationale: Форма qatal обозначает уже совершившееся или утвердившееся действие; перевод сохраняет конкретный образ укрытия.
- source_word: אַל אֵבוֹשָׁה לְעוֹלָם
  choice: да не буду я посрамлён вовек
  rationale: «Да не буду» передаёт молитвенное отрицательное пожелание; «посрамлён» обозначает публичный позор вследствие несбывшейся надежды, а «вовек» сохраняет абсолютную временную формулировку.
- source_word: בְּצִדְקָתְךָ
  choice: По праведности Твоей
  rationale: «Праведность» сохраняет широкое значение Божьей верности тому, что право; предлог «по» естественно выражает основание спасительного действия, не исключая инструментального оттенка.
- source_word: פַלְּטֵנִי
  choice: избавь меня
  rationale: Кратко и естественно передаёт повелительную форму со значением активного спасения от опасности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит Тетраграмматон; транслитерация сохраняет личное имя Бога и не заменяет его титулом.
- issue: Значение צְדָקָה применительно к спасительному действию Бога
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет более широкий смысл верности Бога тому, что право, тогда как «справедливость» подчёркивает прежде всего судебно-правовой оттенок. Допустимая альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмовым звучанием. Слова «посрамлён» и «вовек» сохранены как понятные элементы библейско-поэтического регистра; местоимение, относящееся к Богу, написано с прописной буквы.
