base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/020.yaml
  text: You hide them in the shelter of your presence from the schemes of man[b][a]; you conceal them in a shelter from the strife of tongues.
translation:
  language: ru
  text: Ты скрываешь их в укрытии Твоего присутствия от людских козней[a]; прячешь их в укрытии от распри языков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от людских заговоров», «от людских происков». Еврейское слово редко и может обозначать враждебные замыслы либо сговоры.'
