lexical_decisions:
- source_word: תַּסְתִּירֵם
  choice: Ты укрываешь их
  rationale: Порода hифиль глагола סתר выражает действие сокрытия и защиты; «укрываешь» естественно передаёт оба оттенка.
- source_word: בְּסֵתֶר פָּנֶיךָ
  choice: под покровом Твоего присутствия
  rationale: סֵתֶר обозначает укрытие или тайное место, а פָּנִים здесь естественно понимается как присутствие; формулировка сохраняет образы защиты и близости.
- source_word: מֵרֻכְסֵי אִישׁ
  choice: от людских козней
  rationale: Редкое רֻכְסֵי, вероятно, обозначает враждебные замыслы, сговоры или объединения. «Людских» передаёт обобщённое значение единственного אִישׁ естественным русским языком.
- source_word: תִּצְפְּנֵם
  choice: прячешь их
  rationale: צפן означает прятать, скрывать или хранить в укрытии. «Прячешь» сохраняет параллелизм, не вводя отсутствующей в тексте идеи накопления.
- source_word: בְּסֻכָּה
  choice: в Своей скинии
  rationale: סֻכָּה — шалаш, шатёр или укрытие. «Скиния» сохраняет конкретный поэтический образ защитного шатра; притяжательное «Своей» естественно следует из обращения к Богу, хотя в еврейском не выражено явно.
- source_word: מֵרִיב לְשֹׁנוֹת
  choice: от распри языков
  rationale: Буквальный образ «распри языков» сохраняет метафору враждебной, обвиняющей или клеветнической речи.
theological_decisions:
- issue: Передача обобщённого אִישׁ
  choice: людских
  alternative: человеческих; человека
  rationale: Единственное число имеет здесь родовое значение. «Людских козней» звучит по-русски естественно и не сужает смысл до одного конкретного мужчины.
- issue: Образ Божьего лица
  choice: Твоего присутствия
  alternative: Твоего лица
  rationale: פָּנִים буквально означает «лицо», но в данном сочетании обозначает личное присутствие Бога. Перевод не устраняет богословскую близость и избегает неясного русского выражения «тайник лица».
translation_notes:
  register: Современный литературный русский с сохранением возвышенного поэтического регистра псалма. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксический параллелизм двух строк и метафора «языков» сохранены.
