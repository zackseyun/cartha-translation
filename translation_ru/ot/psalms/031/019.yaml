  variant: modern literary Russian
source:
  edition: WLC
  text: מָ֤ה רַֽב טוּבְ/ךָ֮ אֲשֶׁר צָפַ֪נְתָּ לִּֽ/ירֵ֫אֶ֥י/ךָ פָּ֭עַלְתָּ לַ/חֹסִ֣ים בָּ֑/ךְ נֶ֝֗גֶד בְּנֵ֣י אָדָם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/019.yaml
  text: How abundant is your goodness[a], which you have stored up for those who fear you, which you have worked for those who take refuge in you before the sons of man.
translation:
  language: ru
  text: Как велико благо Твоё, которое Ты припас для боящихся Тебя и совершил для тех, кто ищет у Тебя убежища, на глазах у людей[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед сынами человеческими»; это еврейское выражение означает людей вообще.'
    reason: Сноска сохраняет буквальную антропологическую формулу и поясняет её представительный смысл.
lexical_decisions:
- source_word: מָה רַב
  choice: Как велико
  rationale: Восклицательная конструкция выражает изумление величием и изобилием; «Как велико» естественно звучит по-русски и сохраняет поэтический тон.
- source_word: טוּבְךָ
  choice: благо Твоё
  rationale: Собирательное «благо» передаёт как Божью благость, так и исходящие от Него благодеяния, не сужая значение до одного свойства или дара.
- source_word: צָפַנְתָּ
  choice: Ты припас
  rationale: Глагол обозначает откладывание и хранение в запасе. «Припас» сохраняет образ блага, заранее сбережённого для Божьих почитателей.
- source_word: לִירֵאֶיךָ
  choice: для боящихся Тебя
  rationale: Формулировка прямо сохраняет библейское понятие страха перед Богом, включающее благоговение и почтение, без сведения его только к ужасу.
- source_word: פָּעַלְתָּ
  choice: совершил
  rationale: Глагол означает деятельно произвести или осуществить нечто. «Совершил» сохраняет совершенный вид исходной формы и параллель со словами «Ты припас».
- source_word: לַחֹסִים בָּךְ
  choice: для тех, кто ищет у Тебя убежища
  rationale: Перевод сохраняет конкретный образ укрытия и защиты, заключённый в חָסָה; доверие Богу подразумевается, но не заменяет этот образ.
- source_word: נֶגֶד
  choice: на глазах у
  rationale: В данном контексте слово указывает на открытость и публичную видимость Божьего действия; русское выражение ясно передаёт этот смысл.
- source_word: בְּנֵי אָדָם
  choice: людей
  rationale: Это устойчивое еврейское обозначение человеческих существ вообще. В современном русском «людей» точно и естественно передаёт его собирательный смысл; буквальная форма приведена в сноске.
theological_decisions:
- issue: Значение выражения בְּנֵי אָדָם
  choice: людей
  alternative: сынов человеческих
  rationale: Еврейская конструкция имеет представительное значение и относится к людям вообще. Основной текст передаёт смысл естественным современным русским выражением, а сноска сохраняет буквальную форму и подлинную образность.
- issue: Связь выражения נֶגֶד בְּנֵי אָדָם
  choice: на глазах у людей — публичное совершение блага для ищущих убежища
  alternative: ищущие убежища перед людьми
  rationale: Положение оборота допускает тесную связь с непосредственно предшествующими словами, однако по смыслу он указывает прежде всего на открытое проявление совершённого Богом блага. Русская пунктуация оставляет оборот при всей второй части фразы и не превращает его в характеристику места, где люди ищут убежища.
translation_notes:
  register: Современный литературный русский с умеренно поэтической, достойной псалма интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы. «Припас» конкретно и понятно передаёт образ сохранённого в запасе блага; «ищет у Тебя убежища» удерживает исходную метафору защиты.
