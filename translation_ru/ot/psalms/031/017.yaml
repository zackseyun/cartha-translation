  text: יְֽהוָ֗ה אַל אֵ֭בוֹשָׁה כִּ֣י קְרָאתִ֑י/ךָ יֵבֹ֥שׁוּ רְ֝שָׁעִ֗ים יִדְּמ֥וּ לִ/שְׁאֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/017.yaml
  text: O Yahweh[a], let me not be put to shame, for I call on you; let the wicked be put to shame; let them be silent in Sheol.
translation:
  language: ru
  text: Яхве[a], да не постыжусь, ибо я воззвал к Тебе; пусть постыдятся нечестивые, пусть умолкнут в шеоле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте стоит личное имя Бога — Яхве.
    reason: Уточняет передачу Тетраграмматона יהוה.
  - marker: b
    text: 'Или: «пусть безмолвствуют в шеоле»; возможно также: «пусть сойдут в шеол безмолвно». Еврейский глагол может означать молчание или неподвижность. Шеол — мир мёртвых; это слово не обязательно означает ад.'
    reason: Сохраняет лексическую и синтаксическую неоднозначность יִדְּמוּ לִשְׁאוֹל.
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: В обращении естественная и укоренённая русская передача имени יהוה; звательная интонация выражена формой «Господи».
- source_word: אַל אֵבוֹשָׁה
  choice: да не буду я посрамлён
  rationale: Передаёт отрицательную молитвенную просьбу и сохраняет параллель с последующим пожеланием о нечестивых.
- source_word: כִּי קְרָאתִיךָ
  choice: потому что взываю к Тебе
  rationale: כִּי вводит основание просьбы, а קרא с обращением к Богу означает молитвенно призывать Его; русский настоящий вид естественно выражает продолжающееся упование.
- source_word: יֵבֹשׁוּ רְשָׁעִים
  choice: пусть нечестивые будут посрамлены
  rationale: Передаёт пожелательное значение формы и лексически поддерживает параллель с «да не буду я посрамлён».
- source_word: יִדְּמוּ
  choice: пусть умолкнут
  rationale: Глагол обозначает молчание или неподвижность; «умолкнут» сохраняет образ без добавления явного внешнего деятеля.
- source_word: לִשְׁאוֹל
  choice: в шеоле
  rationale: Контекстуально передаёт состояние или место молчания; транслитерация сохраняет особое древнееврейское понятие мира мёртвых и не отождествляет его автоматически с адом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господи
  alternative: Яхве
  rationale: Русская звательная форма «Господи» естественна, понятна и соответствует устойчивому благоговейному чтению Тетраграмматона; примечание открыто сообщает собственное имя в еврейском тексте.
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: мир мёртвых; могила; преисподняя
  rationale: Транслитерация не сужает многозначное древнееврейское представление до отдельной могилы и не вносит более позднее представление об аде.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Синтаксический параллелизм сохранён; «да не буду» и «пусть…» различают личную просьбу и пожелание о нечестивых. Прописное «Тебе» используется как благоговейная русская издательская конвенция.
