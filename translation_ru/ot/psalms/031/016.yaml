lexical_decisions:
- source_word: הָאִירָה
  choice: озари … светом
  rationale: Каузативный императив от אור выражает просьбу сделать так, чтобы лицо Бога засияло. Русская конструкция «озари … светом» естественно передаёт повелительную просьбу и сохраняет образ сияния.
- source_word: פָנֶיךָ
  choice: лица Твоего
  rationale: Сохранён конкретный образ Божьего лица, обозначающий Его благосклонность; он не заменён более отвлечённым словом «присутствие».
- source_word: עַל
  choice: раба Твоего светом лица Твоего
  rationale: 'В русском языке направление благосклонного света естественнее передаётся перестройкой фразы: свет лица обращён на раба, без тяжеловесного буквального «над рабом».'
- source_word: עַבְדֶּךָ
  choice: раба Твоего
  rationale: В молитвенном обращении עבד обозначает человека, принадлежащего Богу и служащего Ему; «раб» сохраняет традиционный библейский смысл и уместен в русском молитвенном регистре.
- source_word: הוֹשִׁיעֵנִי
  choice: спаси меня
  rationale: Императив от ישׁע означает просьбу о спасении или избавлении. «Спаси меня» передаёт широкий смысл и непосредственную мольбу псалмопевца.
- source_word: בְחַסְדֶּךָ
  choice: по неизменной любви Твоей
  rationale: 'חסד здесь указывает на постоянную, верную любовь Бога. Предлог ב допускает близкие оттенки основания, средства или сферы; основной текст передаёт смысл основания: «по… любви».'
theological_decisions:
- issue: Передача חסד
  choice: неизменная любовь
  alternative: милость; верная любовь
  rationale: «Неизменная любовь» ясно и современно выражает постоянство Божьей преданной любви, не сводя חסד лишь к состраданию и не вводя узкоконфессионального толкования.
- issue: Образ сияющего Божьего лица
  choice: 'сохранить образ: «светом лица Твоего»'
  alternative: «яви Свою благосклонность»
  rationale: Исходный образ несёт богословскую и поэтическую значимость; перевод не заменяет его истолкованием, хотя ради естественного русского синтаксиса перестраивает фразу.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Инверсия местоимений («Твоего», «Твоей») поддерживает возвышенный регистр, оставаясь понятной. Синтаксис первой строки перестроен для естественности русского языка при сохранении образа сияющего лица.
