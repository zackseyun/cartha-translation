lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Я ненавижу
  rationale: Перфект 1-го лица ед. числа в поэтической речи выражает устойчивое отношение; настоящее время естественно передаёт эту твёрдую позицию.
- source_word: הַשֹּׁמְרִים
  choice: тех, кто держится за
  rationale: Глагол שמר буквально означает «хранить, соблюдать, следить», но при данном объекте обозначает стойкую приверженность; «держится за» сохраняет образ и естественно звучит по-русски.
- source_word: הַבְלֵי שָׁוְא
  choice: пустых идолов
  rationale: Сочетание выражает пустоту, тщетность и ложность; в контексте противопоставления упованию на Яхве речь идёт о ложных предметах почитания или доверия. Сноска сохраняет более буквальную широту выражения.
- source_word: וַאֲנִי
  choice: а я
  rationale: Союз и самостоятельное местоимение подчёркивают контраст между псалмопевцем и упомянутыми людьми.
- source_word: אֶל יְהוָה בָּטָחְתִּי
  choice: уповаю на Яхве
  rationale: Хотя אֶל буквально означает направление «к», с בטח русское «уповать на» идиоматично передаёт направленное доверие; перфект описывает установившееся доверие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Референт выражения הַבְלֵי שָׁוְא
  choice: пустых идолов
  alternative: пустых призраков; суетной лжи; тщетных пустышек
  rationale: Контраст с упованием на Яхве позволяет понимать выражение как указание на ложные предметы почитания или доверия, однако еврейская формулировка шире и буквально подчёркивает пустоту и ложность; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим параллелизмом. «Уповаю» сохраняет достоинство псалмового регистра и остаётся понятным современному читателю; «а я» передаёт резкое противопоставление.
