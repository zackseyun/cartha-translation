- source_word: עָשְׁשָׁה
  choice: исчахло
  rationale: Глагол обозначает истощение, ослабление или угасание. «Исчахло» передаёт постепенное изнеможение и подходит ко всем трём последующим членам.
- source_word: בְכַעַס
  choice: от скорби
  rationale: כעס может обозначать досаду, раздражение, гнев или мучительную печаль. В контексте плача «от скорби» естественно передаёт внутреннее страдание, не исключая более широкого спектра значения.
- source_word: עֵינִי
  choice: моё око
  rationale: Сохранено единственное число еврейского текста; «око» уместно в поэтическом регистре псалма и позволяет естественно употребить глагол «исчахло».
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נפש может означать душу, жизнь или самого человека. «Душа моя» сохраняет поэтическую и антропологическую многозначность.
- source_word: וּבִטְנִי
  choice: и утроба моя
  rationale: בטן буквально обозначает живот, чрево или внутренность. «Утроба» передаёт внутренние части тела и сохраняет телесную образность стиха.
