  yaml_path: translation/ot/psalms/031/024.yaml
  text: Be strong[a], and let your heart be courageous, all you who wait for Yahweh.
translation:
  language: ru
  text: Будьте сильны, и пусть Он укрепит ваше сердце, все вы, надеющиеся на Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все ожидающие Яхве». Еврейское причастие может выражать и ожидание, и надежду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ
  choice: Будьте сильны
  rationale: Форма Qal, повелительное наклонение, множественное число, прямо призывает адресатов быть сильными; перевод сохраняет императив и звучит естественно по-русски.
- source_word: וְיַאֲמֵץ
  choice: и да укрепится
  rationale: Hiphil imperfect после императива имеет побудительно-желательное значение. Конструкция «да укрепится» передаёт этот оттенок и естественно сочетается со словом «сердце».
- source_word: לְבַבְכֶם
  choice: ваше сердце
  rationale: В библейской поэзии לֵבָב обозначает внутреннего человека, включая волю и мужество; «сердце» сохраняет образ и остаётся понятным современному читателю.
- source_word: כָּל
  choice: все
  rationale: Передаёт охват всей названной группы и естественно вводит обращение «все надеющиеся».
- source_word: הַמְיַחֲלִים
  choice: надеющиеся
  rationale: Причастие יחל выражает терпеливое ожидание, соединённое с надеждой. В русском сочетание «надеющиеся на» здесь естественнее, чем «ожидающие Яхве», а значение ожидания сохранено в примечании.
- source_word: לַיהוָה
  choice: на Яхве
  rationale: Предлог ל при יחל указывает на того, к кому обращены надежда и ожидание. Выбрано личное имя «Яхве», непосредственно соответствующее יהוה.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господа
  rationale: Исходный текст содержит тетраграмматон; форма «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Соотношение ожидания и надежды в יחל
  choice: надеющиеся
  alternative: ожидающие
  rationale: Контекст допускает оба оттенка. Основной текст использует естественное русское выражение «надеющиеся на Яхве», а примечание сохраняет значение терпеливого ожидания.
translation_notes:
  register: Современный литературный русский язык с поэтической торжественностью. Параллелизм двух побуждений сохранён; архаичная, но прозрачная конструкция «да укрепится» уместна для псалма.
