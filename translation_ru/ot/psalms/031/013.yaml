  source_fidelity: 'Еврейский перфект שָׁמַעְתִּי естественнее передать прошедшим временем: «я слышал». Существительное דִּבָּה обозначает враждебные пересуды, молву или клевету; исходный вариант «как многие клевещут» неоправданно превращает существительное в глагольное сообщение и выбирает более узкое значение. Формулу מָגוֹר מִסָּבִיב лучше не оформлять как прямую речь: ее синтаксическая связь в стихе допускает разные оттенки. «Когда они сообща сговаривались против меня, замышляя отнять мою жизнь» передает враждебное совместное совещание и цель лишить псалмопевца жизни.'
