base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/013.yaml
  text: For I have heard the whispering of many—terror on every side!—as they conspired together against me[a], plotting to take my life.
translation:
  language: ru
  text: Ибо я слышал пересуды многих — ужас со всех сторон! — когда они сообща сговаривались против меня, замышляя отнять мою жизнь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительную связь с окружающим контекстом, не сводя оттенок исключительно к причинному «потому что».
- source_word: שָׁמַעְתִּי
  choice: я слышу
  rationale: Еврейский перфект описывает услышанное как живую и актуальную для говорящего реальность; настоящее время естественно передаёт это по-русски.
- source_word: דִּבַּת רַבִּים
  choice: как многие клевещут
  rationale: Существительное דִּבָּה может обозначать дурную молву, клевету или враждебные пересуды. Глагольная конструкция звучит естественно по-русски и сохраняет отрицательный смысл.
- source_word: מָגוֹר מִסָּבִיב
  choice: Ужас со всех сторон!
  rationale: Сохраняет краткую формулу окружающей опасности. Кавычки позволяют связать возглас с услышанной враждебной речью, однако синтаксическая функция фразы в еврейском допускает и понимание как авторского восклицания.
- source_word: בְּהִוָּסְדָם יַחַד עָלַי
  choice: Они сообща сговариваются против меня
  rationale: Передаёт совместное враждебное совещание и направленность действий против псалмопевца.
- source_word: לָקַחַת נַפְשִׁי זָמָמוּ
  choice: замышляя отнять у меня жизнь
  rationale: נֶפֶשׁ здесь означает жизнь или самого человека, а זָמַם — намеренное составление враждебного замысла.
