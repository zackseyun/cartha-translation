  text: בָּר֥וּךְ יְהוָ֑ה כִּ֥י הִפְלִ֘יא חַסְדּ֥/וֹ לִ֝֗/י בְּ/עִ֣יר מָצֽוֹר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/031/021.yaml
  text: Blessed be Yahweh[a], for he has wonderfully shown his steadfast love to me in a fortified city.
translation:
  language: ru
  text: Благословен Яхве, ибо Он дивно явил мне Свою неизменную любовь в осаждённом городе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в укреплённом городе». Древнееврейское выражение может обозначать как осаждённый, так и укреплённый город.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Страдательное причастие употреблено как славословие; краткая форма «Благословен» естественна для современного литературного русского языка и сохраняет торжественность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: כִּי
  choice: ибо
  rationale: Вводит основание славословия; «ибо» лаконично и уместно в возвышенном, но понятном регистре.
- source_word: הִפְלִיא
  choice: дивно явил
  rationale: Порода hifil глагола פלא обозначает необычайное, чудесное действие; в сочетании с חסד естественно передаётся как поразительное проявление любви.
- source_word: חַסְדּוֹ
  choice: Свою неизменную любовь
  rationale: חסד выражает верную, постоянную и деятельную любовь; «неизменная любовь» передаёт устойчивость этой любви без узкоконфессиональной терминологии.
- source_word: לִי
  choice: мне
  rationale: Обозначает личного получателя проявленной любви.
- source_word: בְּעִיר מָצוֹר
  choice: в осаждённом городе
  rationale: מָצוֹר может обозначать осаду, осадное положение либо укреплённое место. В контексте опасности псалма выбран вероятный смысл «осаждённый город», а лексическая неоднозначность сохранена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; транслитерация сохраняет это различие.
- issue: Смысл выражения בְּעִיר מָצוֹר
  choice: в осаждённом городе
  alternative: в укреплённом городе
  rationale: Древнееврейское выражение допускает оба понимания. Основной текст отражает контекст бедствия и избавления, а иной лексически возможный смысл указан в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Ибо» и «дивно» поддерживают достоинство славословия, оставаясь понятными; личное имя передано как «Яхве». Маркер сноски поставлен непосредственно после неоднозначного выражения.
