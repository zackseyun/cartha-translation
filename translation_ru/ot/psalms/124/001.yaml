  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ יֹֽאמַר נָ֝א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/001.yaml
  text: A Song of Ascents[a]. Of David. If Yahweh had not been for us—let Israel now say—
translation:
  language: ru
  text: 'Песнь восхождений. Давида.


    Если бы Яхве не был за нас, —

    пусть скажет ныне Израиль, —'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Сохраняет традиционный смысл надписания и буквально передаёт מַעֲלוֹת, не устраняя возможный паломнический или литургический оттенок.
- source_word: לְדָוִד
  choice: Давида
  rationale: Естественная для русского библейского надписания форма; родительный падеж оставляет открытыми авторство, принадлежность к Давидовой традиции или посвящение.
- source_word: לוּלֵי
  choice: Если бы не
  rationale: Передаёт контрфактическое условие, завершение которого следует в следующем стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: שֶׁהָיָה לָנוּ
  choice: Который был за нас
  rationale: 'Близко передаёт еврейскую конструкцию и её смысл поддержки: Яхве действовал в пользу Израиля. Формулировка «был за нас» естественнее по-русски, чем буквальное «был нам», и не вводит пространственный образ стороны.'
- source_word: יֹאמַר נָא
  choice: пусть скажет теперь
  rationale: Передаёт побудительное значение формы и частицу נָא как риторический призыв к Израилю.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Стандартная передача имени народа завета без поясняющей парафразы.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет заветное имя и не подменяет его титулом.
- issue: Смысл выражения שֶׁהָיָה לָנוּ
  choice: Который был за нас
  alternative: Который был на нашей стороне; Который был с нами
  rationale: Выражение обозначает поддержку и действие в пользу Израиля. «Был за нас» сохраняет краткость и связь с еврейской формой, не усиливая её до пространственного образа «на нашей стороне» и не ослабляя до простого присутствия «с нами».
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического и богослужебного текста. Тире сохраняют незавершённость условной конструкции и обрамляют призыв к Израилю; смысловой итог наступает в следующем стихе.
