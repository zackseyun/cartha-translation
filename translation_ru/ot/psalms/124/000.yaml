lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Традиционный и достаточно прозрачный формальный эквивалент; сохраняет возможную связь с паломническим восхождением и не сужает значение заголовка.
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая естественная передача надписания; еврейский предлог может обозначать авторство, принадлежность или посвящение, и русский родительный падеж сохраняет эту широту.
- source_word: יְהוָה
  choice: Господь
  rationale: В русском библейском употреблении это естественная и благоговейная передача тетраграмматона; она не вводит непривычную русскому читателю реконструкцию произношения имени.
- source_word: שֶׁהָיָה לָנוּ
  choice: бывший за нас
  rationale: Сохраняет буквальную конструкцию «был для/за нас» и ее смысл поддержки, не сводя ее безоговорочно к более идиоматическому «был на нашей стороне».
- source_word: יֹאמַר נָא יִשְׂרָאֵל
  choice: пусть скажет теперь Израиль
  rationale: Передает побуждение נָא и вводит общинный отклик, сохраняя незавершенность фразы, которая продолжается в следующем стихе.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбрана устоявшаяся русская передача без утверждения спорной вокализации тетраграмматона.
- issue: Смысл выражения היה לנו
  choice: был за нас
  alternative: был на нашей стороне
  rationale: Основной текст сохраняет более широкую и несколько необычную формулировку источника; идиоматический смысл поддержки вынесен в примечание.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Заголовок отделен от основной строки. Тире в конце сохраняет риторическую незавершенность стиха и его продолжение в следующей строке.
