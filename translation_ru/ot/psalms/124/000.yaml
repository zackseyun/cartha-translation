  text: 'Песнь восхождений. Давида.


    Если бы Господь не был за нас[a], — пусть скажет теперь Израиль, —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «Если бы Господь не был на нашей стороне».'
