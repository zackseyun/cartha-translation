base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/007.yaml
  text: Our soul has escaped like a bird from the snare of the fowlers[a]; the snare is broken[b], and we have escaped.
translation:
  language: ru
  text: Душа наша[a], словно птица, вырвалась из силка птицеловов; силок разорван, и мы вырвались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жизнь наша»; еврейское слово נֶפֶשׁ здесь может обозначать жизнь или человека в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: душа наша
  rationale: Сохраняет прямое соответствие еврейскому נֶפֶשׁ и коллективное единственное число; примечание поясняет, что здесь речь может идти о жизни или обо всём человеке, а не обязательно о душе в противопоставлении телу.
- source_word: כְּצִפּוֹר
  choice: словно птица
  rationale: צִפּוֹר — общее обозначение птицы; контекст не требует более узкого «воробей».
- source_word: נִמְלְטָה / נִמְלָטְנוּ
  choice: вырвалась / вырвались
  rationale: Глагол передаёт избавление из ловушки; повтор однокоренных форм воспроизводит еврейское поэтическое повторение и естественно звучит по-русски.
- source_word: פַּח
  choice: силок
  rationale: В образе пойманной птицы «силок» точнее общего слова «ловушка»; повтор сохранён в обеих половинах стиха.
- source_word: יוֹקְשִׁים
  choice: птицеловов
  rationale: Причастная форма обозначает ставящих силки; в данном образном контексте «птицеловы» точно и литературно передаёт смысл.
- source_word: נִשְׁבָּר
  choice: разорван
  rationale: Для силка естественнее «разорван», чем общее «разбит»; пассивная форма и результат совершившегося действия сохранены.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ
  choice: В основном тексте сохранено «душа», а широкий смысл пояснён в сноске.
  alternative: «Жизнь наша» или «мы сами»
  rationale: Так перевод не сводит многозначное נֶפֶשׁ к одной антропологической модели и сохраняет поэтическое напряжение оригинала.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Инверсия «душа наша» сохраняет поэтический строй, а «словно» и «вырвались» остаются понятными современному читателю.
