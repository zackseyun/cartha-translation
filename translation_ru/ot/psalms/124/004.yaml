- source_word: הַמַּיִם
  choice: воды
  rationale: Сохраняет множественное число и поэтический образ нахлынувших вод.
- source_word: שְׁטָפוּנוּ
  choice: смыли бы нас
  rationale: Глагол обозначает затопление или смывание мощным потоком; условная частица «бы» выражает подразумеваемое контрфактическое значение в контексте.
- source_word: נַחְלָה
  choice: поток
  rationale: Слово может обозначать русло, ручей или поток; здесь контекст опасных вод придаёт образу разрушительную силу, не требуя добавления поясняющего прилагательного.
- source_word: עָבַר
  choice: прошёл бы
  rationale: Сохраняет основное значение «проходить» и условно-контрфактическую связь с предыдущим стихом.
- source_word: עַל
  choice: над
  rationale: Передаёт движение воды поверх того, кто оказался под потоком.
- source_word: נַפְשֵׁנוּ
  choice: нашей душой
  rationale: Сохраняет еврейский поэтический образ и форму первого лица множественного числа, при этом примечание разъясняет, что נֶפֶשׁ здесь может означать жизнь или самого человека целиком.
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте смертельной опасности
  choice: нашей душой
  alternative: нашей жизнью; над нами
  rationale: Здесь слово не обязательно выражает специальное учение о составе человека. Буквальный поэтический образ сохранён в тексте, а более широкое значение — «жизнь» или «мы сами» — указано в примечании, чтобы не сужать смысл.
translation_notes:
