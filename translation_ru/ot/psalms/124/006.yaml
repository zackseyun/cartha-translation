lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Краткая именная формула естественно передаёт древнееврейское благословение и сохраняет его славословный, литургический характер.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: שֶׁלֹּא
  choice: который не
  rationale: Относительная конструкция естественно связывает благословение Яхве с совершённым Им избавлением; причинное понимание также возможно, но не нуждается в явном уточнении.
- source_word: נְתָנָנוּ
  choice: не отдал нас
  rationale: Глагол נתן буквально означает «дать», но в данном контексте «отдал» по-русски яснее выражает передачу во власть врагов, не усиливая образ сверх исходного текста.
- source_word: טֶרֶף
  choice: в добычу
  rationale: Существительное обозначает добычу хищника; выбор сохраняет образ врагов как зверей.
- source_word: לְשִׁנֵּיהֶם
  choice: их зубам
  rationale: Сохранён конкретный и выразительный образ исходного текста без поясняющей замены вроде «на растерзание».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер формулы בָּרוּךְ
  choice: Благословен
  alternative: Да будет благословен
  rationale: Форма «Благословен Яхве» может выражать как признание Его благословенности, так и славословие, не устраняя присущую еврейской формуле смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с торжественным псалмодическим звучанием. Порядок слов естественный для русского, при этом сохранён конкретный образ добычи, отданной зубам хищника.
