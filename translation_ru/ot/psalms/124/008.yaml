lexical_decisions:
- source_word: עֶזְרֵנוּ
  choice: Помощь наша
  rationale: Существительное עֵזֶר с суффиксом 1-го лица множественного числа обозначает помощь, а не помощника; инверсия естественна для возвышенного псалмового регистра.
- source_word: בְּשֵׁם
  choice: в имени
  rationale: Сочетание בְּ с שֵׁם указывает на основание упования и сохраняет литургический смысл обращения к Божьему имени.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: עֹשֵׂה
  choice: сотворившего
  rationale: Причастие характеризует Яхве как Того, кто создал небо и землю; русское причастие естественно согласуется с формой «Яхве» и не превращает слово в отдельный титул.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: небо и землю
  rationale: Устойчивое библейское сочетание и меризм, обозначающий всё творение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное Божье имя, а примечание поясняет исходную форму.
- issue: Характер причастия עֹשֵׂה
  choice: сотворившего
  alternative: Творца
  rationale: Причастная форма сохраняет характеристику действием и не усиливает титульность сверх явно выраженного в источнике.
translation_notes:
