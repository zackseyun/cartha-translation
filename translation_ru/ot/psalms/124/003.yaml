lexical_decisions:
- source_word: אֲזַי
  choice: тогда
  rationale: Временное наречие вводит следствие в условно-контрфактической последовательности стихов 2–5; «тогда» естественно и точно.
- source_word: חַיִּים
  choice: живьём
  rationale: Адвербиальное употребление со значением «живыми»; сочетание «проглотили бы нас живьём» передаёт яркий образ естественным современным русским языком.
- source_word: בְּלָעוּנוּ
  choice: они проглотили бы нас
  rationale: Форма перфекта в контексте подразумеваемого нереального условия лучше передаётся условным наклонением; «проглотили» сохраняет конкретную метафору.
- source_word: בַּחֲרוֹת
  choice: когда ... разгорелся
  rationale: Инфинитивная конструкция с ב обозначает временное обстоятельство, буквально «при разгорании»; «когда разгорелся» сохраняет образ огня.
- source_word: אַפָּם
  choice: их гнев
  rationale: אַף буквально означает «нос», но в данном обороте идиоматически обозначает гнев; «гнев» ясно передаёт смысл.
- source_word: בָּנוּ
  choice: против нас
  rationale: При глаголе гнева предлог ב указывает на направленность враждебного чувства; «против нас» естественно выражает это по-русски.
theological_decisions:
- issue: Временное значение перфекта בְּלָעוּנוּ
  choice: 'Контрфактическое: «проглотили бы нас»'
  alternative: 'Простое прошедшее: «проглотили нас»'
  rationale: Хотя сама форма допускает простое прошедшее, синтаксис и контекст стихов 2–5 образуют нереальное условие; альтернативу следует сохранить в примечании.
