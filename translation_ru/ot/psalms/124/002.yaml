id: PSA.124.2
reference: Psalms 124:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לוּלֵ֣י יְ֭הוָה שֶׁ/הָ֣יָה לָ֑/נוּ בְּ/ק֖וּם עָלֵ֣י/נוּ אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/124/002.yaml
  text: If Yahweh had not been for us when man rose up against us—[a]
translation:
  language: ru
  text: Если бы Яхве не был за нас, когда люди восстали против нас…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если бы Яхве не был на нашей стороне, когда люди восстали против нас».'
    reason: Лексическая альтернатива для выражения «был за нас».
lexical_decisions:
- source_word: לוּלֵי
  choice: если бы … не
  rationale: Вводит нереальное условие в прошлом; эта конструкция естественно продолжается следствием в следующем стихе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: שֶׁהָיָה לָנוּ
  choice: не был за нас
  rationale: Сочетание היה с ל здесь выражает поддержку; формулировка сохраняет близость к еврейскому тексту и его оттенок.
- source_word: בְּקוּם
  choice: когда … восстали
  rationale: Предлог ב при инфинитиве обозначает время действия, а קום в контексте враждебного выступления естественно передаётся как «восстали».
- source_word: עָלֵינוּ
  choice: против нас
  rationale: В контексте нападения על имеет значение направленной против кого-либо враждебности.
- source_word: אָדָם
  choice: люди
  rationale: Существительное стоит в единственном числе, но употреблено собирательно и обозначает человеческих противников; русское множественное число естественно согласуется с этим смыслом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Смысл выражения שֶׁהָיָה לָנוּ
  choice: был за нас
  alternative: был на нашей стороне
  rationale: Выбрана более сжатая и близкая к форме оригинала передача поддержки, тогда как распространённый смысловой вариант приведён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Многоточие передаёт незавершённое условное предложение, продолжение которого находится в следующем стихе.
