lexical_decisions:
- source_word: דִּמְיֹנוֹ
  choice: Он подобен
  rationale: Идиоматическая передача именной конструкции «его подобие — как…»; она ясно относит сравнение к описываемому врагу и избегает неестественного повтора «его подобие подобно».
- source_word: כְּאַרְיֵה
  choice: льву
  rationale: Предлог כ выражает прямое сравнение; русская конструкция «подобен льву» естественно передаёт образ.
- source_word: יִכְסוֹף
  choice: жаждущему
  rationale: Глагол выражает сильное желание или стремление; в хищническом контексте «жаждущему» сохраняет интенсивность образа.
- source_word: לִטְרוֹף
  choice: растерзать добычу
  rationale: טרף в образе хищника означает схватить и разорвать добычу. Добавление «добычу» делает подразумеваемый объект ясным по-русски, не меняя образа.
- source_word: וְכִכְפִיר
  choice: молодому льву
  rationale: כפיר — молодой лев; вторая сравнительная конструкция продолжает параллельный образ. Союз отдельно не воспроизведён ради естественного русского перечисления.
- source_word: יֹשֵׁב
  choice: сидящему
  rationale: Сохранено буквальное значение причастия «сидящий»; значение затаившегося хищника возникает из контекста укрытия.
- source_word: בְּמִסְתָּרִים
  choice: в укрытии
  rationale: Существительное во множественном числе обозначает скрытые места. Русское собирательное «в укрытии» естественно передаёт место засады; формальное множественное число отмечено в сноске.
