  yaml_path: translation/ot/psalms/017/012.yaml
  text: He is like a lion eager to tear[c][b][a], like a young lion sitting in hiding places.
translation:
  language: ru
  text: Он подобен льву, жаждущему терзать, и подобен молодому льву, сидящему в укрытиях.[a]
  philosophy: optimal-equivalence
  footnotes:
