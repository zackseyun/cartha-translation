base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/003.yaml
  text: You have examined my heart; you have visited me by night; you have tested me and find nothing[a]. I have purposed that my mouth will not transgress.
translation:
  language: ru
  text: 'Ты испытал моё сердце, посетил меня ночью, проверил меня — и ничего не нашёл.[a] Я решил: мои уста не переступят границы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст в конце стиха сжат и допускает другие прочтения: «то, что я решил, уста мои не перейдут» или «уста мои не преступают». В принятом переводе это понимается как решение не переступать дозволенного в речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּחַנְתָּ
  choice: испытал
  rationale: Глагол обозначает исследование или испытание внутреннего характера; «испытал» естественно сочетается с «сердцем» и сохраняет оценочный смысл.
- source_word: לִבִּי
  choice: моё сердце
  rationale: '«Сердце» сохраняет библейскую антропологию: внутренний мир человека, включая мысли и намерения.'
- source_word: פָּקַדְתָּ
  choice: посетил
  rationale: פקד может означать посещение, внимание или проверку. «Посетил» сохраняет еврейский образ, тогда как общий контекст ясно указывает на Божье исследование человека.
- source_word: לַּיְלָה
  choice: ночью
  rationale: Существительное употреблено обстоятельственно; «ночью» — краткий и естественный современный русский эквивалент.
- source_word: צְרַפְתַּנִי
  choice: проверил меня
  rationale: צרף буквально связано с плавкой и очищением металла, а переносно — с испытанием человека. «Проверил» передаёт контекстуальный смысл, не усиливая образ очищения, которого здесь текст прямо не развивает.
- source_word: בַל תִּמְצָא
  choice: и ничего не нашёл
  rationale: В еврейском объект не назван. «Ничего не нашёл» сохраняет эту краткость и не добавляет конкретного проступка или зла.
- source_word: זַמֹּתִי
  choice: я решил
  rationale: 'Форма понимается как глагольная: «я замыслил, решил». «Я решил» ясно выражает твёрдое намерение и естественно вводит следующую фразу.'
- source_word: בַל יַעֲבָר פִּי
  choice: мои уста не преступят границы
  rationale: עבר буквально означает переход через предел. В сочетании с «устами» речь идёт о недопустимом высказывании; перевод сохраняет образ границы и нравственный смысл, не уточняя сверх текста, в чём именно состояло бы нарушение.
theological_decisions:
- issue: Синтаксис и смысл заключительной части стиха
  choice: '«Я решил: мои уста не преступят границы» — слова понимаются как решение псалмопевца не переступать дозволенного в речи.'
  alternative: Возможны более буквальное соединение «что я замыслил, того мои уста не преступят» и статическое понимание «мои уста не преступают».
  rationale: Еврейский текст сжат и допускает неоднозначность. Глагольное понимание זַמֹּתִי создаёт связное утверждение о решимости хранить речь; образ «перехода границы» оставлен видимым, а не заменён более узким толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим регистром. «Уста» сохранены как естественное поэтическое обозначение речи; синтаксис краток и соответствует последовательности образов оригинала.
