lexical_decisions:
- source_word: אַשֻּׁרֵינוּ
  choice: наши шаги
  rationale: Сохраняет конкретный образ шагов или следов движения и форму первого лица множественного числа.
- source_word: עַתָּה
  choice: теперь
  rationale: Прямо передаёт временное наречие и подчёркивает нынешнюю опасность.
- source_word: סבבוני
  choice: они окружили меня
  rationale: Передаёт значение «окружать» и сохраняет явный суффикс первого лица единственного числа, не сглаживая переход от «наших» к «меня».
- source_word: עֵינֵיהֶם יָשִׁיתוּ
  choice: глаза свои устремили
  rationale: 'Естественно по-русски передаёт буквальный образ: враги направляют и фиксируют взгляд с враждебным намерением.'
- source_word: לִנְטוֹת
  choice: чтобы пригнуть
  rationale: В сочетании с «к земле» выражает намерение заставить пасть или склониться; отсутствие выраженного дополнения в переводе сохраняет недосказанность еврейского текста.
- source_word: בָּאָרֶץ
  choice: к земле
  rationale: Здесь אֶרֶץ обозначает землю как поверхность, к которой хотят пригнуть или повергнуть жертву.
theological_decisions:
- issue: Переход от множественного «наши» к единственному «меня»
  choice: 'Сохранить переход: «Наши шаги… окружили меня»'
  alternative: 'Согласовать число: «окружили наши шаги» или «окружили нас»'
  rationale: Масоретский текст содержит форму «наши шаги» и явный объект «меня». Сглаживание устранило бы реальное грамматическое и поэтическое напряжение источника.
- issue: Неуказанный объект при לִנְטוֹת
  choice: Не добавлять «меня» или «нас» в основной текст
  alternative: «Чтобы повергнуть меня/нас на землю»
  rationale: Еврейский инфинитив не называет объект явно. Русская эллиптическая конструкция позволяет сохранить эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим синтаксисом. Начальная конструкция намеренно отмечена тире, чтобы сохранить трудную структуру еврейской строки и переход от коллективного к индивидуальному без конфессионального истолкования.
