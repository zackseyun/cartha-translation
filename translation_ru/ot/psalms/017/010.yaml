lexical_decisions:
- source_word: חֶלְבָּמוֹ
  choice: свои ожиревшие сердца
  rationale: 'Буквально: «свой жир». В поэтическом контексте «жир» служит образом самодовольной бесчувственности; подразумеваемое «сердца» делает метафору понятной по-русски, не устраняя её конкретного образа.'
- source_word: סָּגְרוּ
  choice: замкнули
  rationale: Глагол означает «закрыть, запереть». «Замкнули» естественно сочетается с подразумеваемыми сердцами и передаёт их закрытость и нечувствительность.
- source_word: פִּימוֹ
  choice: устами
  rationale: Форма буквально означает «их уста»; русский творительный оборот естественно передаёт средство речи и сохраняет возвышенный поэтический регистр.
- source_word: דִּבְּרוּ
  choice: говорят
  rationale: Перфект в еврейской поэзии здесь допускает настоящее, характеризующее постоянное поведение нечестивых.
- source_word: בְגֵאוּת
  choice: надменно
  rationale: Существительное обозначает гордость или высокомерие; наречие «надменно» естественно при глаголе речи и сохраняет отрицательную оценку.
