base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/002.yaml
  text: May my judgment come forth from before you[b][a]; may your eyes behold what is upright.
translation:
  language: ru
  text: Пусть решение по моему делу выйдет от лица Твоего[a]; пусть Твои глаза увидят то, что справедливо[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица Твоего», то есть из Твоего присутствия. Или: «Пусть от Тебя выйдет моё оправдание»; «Пусть выйдет решение обо мне».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «справедливость», «правоту», «то, что правильно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּפָנֶיךָ
  choice: от Тебя
  rationale: Еврейское выражение буквально указывает на исход от лица или из присутствия Бога. По-русски «от Тебя» естественно передаёт источник судебного решения, а буквальное «от лица Твоего» здесь могло бы быть понято как устойчивый оборот с иным оттенком.
- source_word: מִשְׁפָּטִי
  choice: решение по моему делу
  rationale: מִשְׁפָּטִי допускает значения «мой суд», «моё дело» и «решение обо мне». В контексте просьбы справедливее всего сохранить судебный образ и не предполагать заранее оправдательный исход.
- source_word: יֵצֵא
  choice: выйдет
  rationale: Глагол יצא буквально означает «выходить». Выбор сохраняет образ решения, исходящего от Бога, и звучит понятно в поэтическом контексте.
- source_word: עֵינֶיךָ
  choice: Твои глаза
  rationale: Сохранён конкретный антропоморфный образ еврейского текста, а не заменён абстрактным «Ты».
- source_word: תֶּחֱזֶינָה
  choice: увидят
  rationale: Форма от חזה обозначает внимательное видение или созерцание. «Увидят» современно и естественно; оттенок Божьего рассмотрения задаётся судебным контекстом.
- source_word: מֵישָׁרִים
  choice: правду
  rationale: Множественное מֵישָׁרִים может обозначать прямоту, справедливость, правоту или то, что правильно. «Правду» естественно объединяет нравственный и судебный оттенки, при этом другие допустимые значения отмечены в сноске.
theological_decisions:
- issue: Просьба или уверенное предсказание
  choice: 'Просьба: «Пусть… выйдет; пусть… увидят»'
  alternative: 'Будущее или декларация: «Решение… выйдет; Твои глаза увидят»'
  rationale: Имперфекты допускают будущее прочтение, но в молитвенном окружении естественно имеют желательное, близкое к юссиву значение. Формула «пусть» передаёт просьбу, не превращая её в категорическое утверждение.
- issue: Означает ли מִשְׁפָּטִי непременно оправдание
  choice: Нейтральное «решение по моему делу»
  alternative: «Моё оправдание»
  rationale: Контекст допускает просьбу об оправдании, однако само слово шире. Нейтральный перевод сохраняет судебную напряжённость и не вносит исход прямо в основной текст.
translation_notes:
  register: Современный литературный русский с сохранением молитвенно-поэтического параллелизма и судебного образа. Местоимения, обращённые к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
