  yaml_path: translation/ot/psalms/017/007.yaml
  text: Show your wondrous steadfast love[a], O Savior of those who take refuge from those who rise up against them[b], by your right hand.
translation:
  language: ru
  text: Яви Свою дивную верную любовь[a], Ты, спасающий Своей правой рукой тех, кто ищет у Тебя убежища от восстающих на них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сделай Свою верную любовь дивной». Еврейский глагол может означать как явить нечто чудесное, так и придать чему-либо особый, дивный характер.'
    reason: lexical_alternative
  - marker: b
    text: 'Последние слова можно также связать с ищущими убежища: «тех, кто ищет убежища у Твоей правой руки».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְלֵה
  choice: Яви дивную
  rationale: Повелительная форма породы hифиль от פלא просит Бога явить Свою милость как необычайную, чудесную; выражение естественно по-русски и сохраняет силу исходного образа.
- source_word: חֲסָדֶיךָ
  choice: милость Твою
  rationale: חסד соединяет значения милосердия, верности и преданной любви. «Милость» естественна в русском псалмическом контексте, хотя не исчерпывает всего смыслового диапазона; дополнительный оттенок отмечен в сноске.
- source_word: מוֹשִׁיעַ
  choice: Спаситель
  rationale: Причастие употреблено как обращение или приложение к Богу — Тому, Кто спасает.
- source_word: חוֹסִים
  choice: тех, кто ищет у Тебя убежища
  rationale: חסה передаёт конкретный образ обращения к Богу за защитой, а не только отвлечённое доверие.
- source_word: מִמִּתְקוֹמְמִים
  choice: от восстающих на них
  rationale: Форма от קום обозначает тех, кто враждебно поднимается против кого-либо. Объект в еврейском тексте не выражен; «на них» естественно соотносится с ищущими убежища.
- source_word: בִּימִינֶךָ
  choice: правой рукой Твоей
  rationale: Основной вариант понимает оборот как указание на средство Божьего спасения и сохраняет антропоморфный образ силы Божьей десницы.
theological_decisions:
- issue: Синтаксическая связь בִּימִינֶךָ
  choice: 'Оборот относится к спасительному действию Бога: Он спасает правой рукой.'
  alternative: 'Оборот может относиться к ищущим убежища: «ищущих убежища у Твоей правой руки»; менее вероятно — к восстающим против Божьей правой руки.'
  rationale: Конечное положение предложного оборота допускает несколько синтаксических связей. Основное чтение наиболее связно в контексте молитвы о вмешательстве Бога, но подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Добавлен глагол «спаси» как контекстуальное раскрытие причастия מוֹשִׁיעַ и связи с בִּימִינֶךָ; тире делает структуру обращения ясной.
