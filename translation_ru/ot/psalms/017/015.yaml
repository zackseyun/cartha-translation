  text: אֲנִ֗י בְּ֭/צֶדֶק אֶחֱזֶ֣ה פָנֶ֑י/ךָ אֶשְׂבְּעָ֥ה בְ֝/הָקִ֗יץ תְּמוּנָתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/015.yaml
  text: As for me[a], in righteousness I will behold your face; when I awake[b], I will be satisfied with your likeness.
translation:
  language: ru
  text: А я в праведности буду созерцать Твоё лицо; пробудившись[a], насыщусь Твоим образом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «пробудившись» можно понимать как обычное пробуждение ото сна или как пробуждение при окончательном оправдании и воскресении.
    reason: alternative_reading
  - marker: b
    text: 'Или: «Твоим обликом»; «Твоим подобием».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֶדֶק
  choice: в праведности
  rationale: Сохраняет краткость еврейского выражения и не уточняет преждевременно, идёт ли речь о праведности псалмопевца, о Божьем правосудии или об оправдании.
- source_word: אֶחֱזֶה
  choice: буду созерцать
  rationale: Глагол חזה обозначает не просто зрительное восприятие, но внимательное видение; «созерцать» передаёт возвышенный и сосредоточенный характер фразы.
- source_word: פָנֶיךָ
  choice: Твоё лицо
  rationale: Передаёт конкретный образ оригинала буквально, не заменяя его толкованием «Твоё присутствие».
- source_word: אֶשְׂבְּעָה
  choice: насыщусь
  rationale: Глагол שׂבע означает насытиться, получить полноту удовлетворения; русский совершенный вид естественно передаёт ожидаемый результат.
- source_word: בְּהָקִיץ
  choice: пробудившись
  rationale: Естественно передаёт временное значение конструкции с ב, сохраняя неопределённость относительно того, имеется ли в виду обычное пробуждение или окончательное восстание.
- source_word: תְּמוּנָתֶךָ
  choice: Твоим образом
  rationale: תְּמוּנָה может означать образ, облик или подобие. «Образ» сохраняет конкретность существительного, не утверждая определённой телесной формы.
theological_decisions:
- issue: Относится ли בְּהָקִיץ к обычному пробуждению ото сна или подразумевает воскресение и окончательное оправдание
  choice: В основном тексте оставлено неопределённое «пробудившись».
  alternative: Понимать выражение либо как обычное утреннее пробуждение, либо как эсхатологическое пробуждение — воскресение или окончательное оправдание.
  rationale: Еврейская фраза сама по себе не определяет характер пробуждения, поэтому перевод сохраняет богословское напряжение, а возможные понимания указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией; синтаксис остаётся компактным и близким к параллелизму оригинала.
