lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Молитва Давида
  rationale: Естественная русская передача надписания; конструкция с לְ допускает связь авторства или принадлежности, которую русский родительный падеж сохраняет без излишнего уточнения.
- source_word: צֶדֶק
  choice: правое дело
  rationale: В контексте просьбы быть услышанным слово обозначает правоту или справедливость дела молящегося. Такая передача естественнее буквального «праведность», но неоднозначность отмечена в сноске.
- source_word: רִנָּתִי
  choice: моему воплю
  rationale: Здесь רִנָּה в контексте мольбы означает громкий призыв или вопль, а не радостное пение.
- source_word: הַאֲזִינָה
  choice: приклони ухо
  rationale: Сохранён образный характер еврейского призыва внимательно выслушать, в понятной и dignified русской библейской формулировке.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: исходящей из уст, в которых нет лжи
  rationale: Связывает заключительную фразу с молитвой и ясно передаёт отсутствие обмана в речи, избегая неестественного буквального оборота «не устами лжи».
theological_decisions:
- issue: Смысл צֶדֶק в первой просьбе
  choice: правое дело
  alternative: праведность; справедливость; правый суд
  rationale: Контекст допускает как абстрактную праведность/справедливость, так и справедливое дело псалмопевца. Основной текст выбирает контекстуально вероятное значение, а сноска сохраняет широту оригинала.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: В русском библейском литературном регистре традиционная передача «Господь» наиболее понятна широкой аудитории; имя адресата при этом не смешивается с отдельным титулом внутри данного стиха.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным регистром. Формы «внемли» и «приклони ухо» сохраняют поэтический параллелизм, оставаясь понятными; устаревшие грамматические формы и чрезмерная церковнославянизация исключены.
