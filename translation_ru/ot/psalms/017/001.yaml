base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/001.yaml
  text: A prayer of David. Hear[a], O Yahweh, a just cause; attend to my cry; give ear to my prayer from lips without deceit.
translation:
  language: ru
  text: Молитва Давида. Услышь, Яхве, правое дело[a]; внемли моему воплю, прислушайся к моей молитве — она из уст, чуждых обману.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «услышь то, что право» (или «праведность»). Еврейское слово צֶדֶק может означать праведность, справедливость, правоту или справедливое дело; здесь, вероятно, имеется в виду правота дела псалмопевца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה לְדָוִד
  choice: Молитва Давида
  rationale: Надписание псалма; לְ при личном имени естественно указывает на авторство или связь с Давидом. Краткая форма соответствует русской традиции заголовков.
- source_word: שִׁמְעָה
  choice: Услышь
  rationale: Императив שׁמע передан прямым прошением. «Услышь» естественно по-русски и в молитвенном контексте означает не только восприятие звука, но и благосклонный отклик.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: צֶדֶק
  choice: правое дело
  rationale: В роли объекта глагола «услышь» слово, вероятнее всего, обозначает справедливость дела или правоту тяжущегося, а не отвлечённую праведность. Формулировка сохраняет юридический оттенок.
- source_word: הַקְשִׁיבָה
  choice: внемли
  rationale: Императив породы hифиль выражает внимательное слушание. «Внемли» сохраняет возвышенный поэтический регистр и отличается от соседних глаголов слуха.
- source_word: רִנָּתִי
  choice: моему воплю
  rationale: В контексте молитвы-плача существительное обозначает громкий настойчивый призыв; «вопль» передаёт его силу точнее нейтрального «крик».
- source_word: הַאֲזִינָה
  choice: прислушайся
  rationale: Глагол אזן призывает обратить слух. «Прислушайся» естественно передаёт образ без архаичной русской конструкции «приклони ухо».
- source_word: תְפִלָּתִי
  choice: к моей молитве
  rationale: Прямое значение существительного сохранено и поддерживает лексическую связь с надписанием.
- source_word: בְּלֹא שִׂפְתֵי מִרְמָה
  choice: она из уст, в которых нет обмана
  rationale: Фраза характеризует источник молитвы. Эксплицированное местоимение устраняет возможную синтаксическую неясность в русском, сохраняя образ уст и отсутствие лжи.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя Бога. «Яхве» сохраняет его как имя и отражает наиболее принятую научную реконструкцию произношения.
- issue: Значение צֶדֶק в просьбе псалмопевца
  choice: правое дело
  alternative: праведность; справедливость; то, что право
  rationale: Контекст допускает буквальное «услышь праведность», но сочетание с просьбой о слушании указывает на правоту дела псалмопевца. Сноска сохраняет присущую еврейскому слову неоднозначность, не превращая утверждение в доктринальное заявление о безусловной безгрешности говорящего.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенно-поэтическим звучанием. Формы «внемли» и «вопль» уместны в псалме, но синтаксис остаётся понятным современному читателю; избегнуты церковнославянские грамматические формы.
