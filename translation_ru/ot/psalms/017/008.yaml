  text: Keep me like the pupil of the eye[a]; hide me in the shadow of your wings.
translation:
  language: ru
  text: Храни меня, как зрачок глаза[a]; укрой меня в тени твоих крыльев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, традиционно: «Храни меня как зеницу ока».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Храни меня
  rationale: Глагол שׁמר означает хранить, оберегать, стеречь. «Храни меня» кратко и естественно передаёт молитвенную просьбу о защите, не уточняя её способ.
- source_word: כְּאִישׁוֹן בַּת עָיִן
  choice: как зрачок глаза
  rationale: Еврейское выражение обозначает зрачок — уязвимую часть глаза, которую тщательно оберегают. Современная передача раскрывает образ непосредственно; традиционный вариант сохранён в сноске.
- source_word: בְּצֵל
  choice: в тени
  rationale: צֵל означает «тень» или «сень». «В тени» сохраняет конкретный поэтический образ защитного покрова и естественно сочетается с образом крыльев.
- source_word: כְּנָפֶיךָ
  choice: твоих крыльев
  rationale: כָּנָף означает «крыло». Буквальная передача сохраняет образ Божьей защиты и не заменяет метафору её толкованием.
- source_word: תַּסְתִּירֵנִי
  choice: укрой меня
  rationale: Порода hифиль глагола סתר означает «скрыть, укрыть». «Укрой меня» естественно по-русски выражает просьбу спрятать ради защиты, сохраняя связь с тенью крыльев.
theological_decisions:
- issue: Передача образного выражения о зрачке
  choice: 'Передать значение выражения прозрачно: «как зрачок глаза».'
  alternative: Традиционное «как зеницу ока».
  rationale: Стих создаёт образ бережной защиты, а не формулирует отдельное вероучительное положение. Основной текст делает смысл понятным современному читателю, а сноска сохраняет знакомую традиционную формулу.
- issue: Сохранение образа крыльев
  choice: Оставить метафору «твоих крыльев».
  alternative: 'Передать толкованием: «под твоей защитой» или «под твоей опекой».'
  rationale: В еврейском тексте употреблён конкретный поэтический образ Божьего покровительства. Его буквальное сохранение передаёт литературное и богословское напряжение стиха без добавочного истолкования.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости молитвенного обращения и конкретной поэтической образности. Местоимения, относящиеся к Богу, даны со строчной буквы в соответствии с современной нейтральной издательской практикой.
