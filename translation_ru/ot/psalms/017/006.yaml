lexical_decisions:
- source_word: קְרָאתִיךָ
  choice: Я взываю к Тебе
  rationale: Перфект Qal, 1-е лицо ед. числа с суффиксом 2-го лица муж. рода ед. числа. В поэтической молитве форма допускает оттенок уже совершённого, настоящего или уверенно совершаемого действия. Настоящее время естественно передаёт непосредственное обращение, а альтернативное понимание отмечено в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для обращения и здесь естественно понимается причинно.
- source_word: תַעֲנֵנִי
  choice: Ты ответишь мне
  rationale: Имперфект Qal, 2-е лицо муж. рода ед. числа с суффиксом 1-го лица ед. числа. Будущее время передаёт уверенность молящегося в Божьем ответе, не превращая её в утверждение о прошлом.
- source_word: אֵל
  choice: Боже
  rationale: Форма употреблена как прямое обращение; русский звательный эквивалент «Боже» естественен для молитвенной речи.
- source_word: הַט אָזְנְךָ לִי
  choice: приклони ко мне ухо Твоё
  rationale: Сохранён конкретный древнееврейский образ внимательного слушания. Инверсия с «Твоё» поддерживает возвышенный поэтический строй, оставаясь понятной современному читателю.
- source_word: שְׁמַע
  choice: услышь
  rationale: Императив Qal передан прямым повелительным обращением. «Услышь» естественно сочетается с просьбой о внимательном слушании и сохраняет поэтический параллелизм.
- source_word: אִמְרָתִי
  choice: речь мою
  rationale: Существительное в представленном тексте имеет форму единственного числа и обозначает слово, высказывание или речь. «Речь мою» сохраняет собирательный смысл произносимой молитвы и звучит естественнее, чем буквальное «слово моё».
theological_decisions:
- issue: Временной оттенок Божьего ответа в תַעֲנֵנִי
  choice: Ты ответишь мне
  alternative: Ты отвечаешь мне / Ты ответил мне
  rationale: Имперфект допускает контекстуальные оттенки настоящего и будущего. Будущее время лучше выражает уверенное ожидание ответа в молитвенном контексте, тогда как сноска сохраняет более широкую временную неоднозначность всей первой строки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-поэтическим строем. Местоимения, относящиеся к Богу, написаны с прописной буквы как устойчивая русская религиозно-литературная норма; это не добавляет толкования. Сохранены параллелизм и телесный образ слуха. Несмотря на английский консультационный вариант «my words», представленная форма WLC אִמְרָתִי морфологически единственного числа, поэтому выбрано собирательное «речь мою».
