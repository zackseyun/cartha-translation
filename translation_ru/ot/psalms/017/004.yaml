source:
  edition: WLC
  text: לִ/פְעֻלּ֣וֹת אָ֭דָם בִּ/דְבַ֣ר שְׂפָתֶ֑י/ךָ אֲנִ֥י שָׁ֝מַ֗רְתִּי אָרְח֥וֹת פָּרִֽיץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/004.yaml
  text: As for the deeds of man[a], by the word of your lips I have kept myself from the paths of the violent.
translation:
  language: ru
  text: Что до дел человеческих, по слову Твоих уст я держался вдали от путей насильника.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «я наблюдал за путями насильника» или «я стерёг пути насильника». Еврейский глагол может означать «хранить, стеречь, соблюдать, наблюдать»; в данном контексте вероятнее речь об уклонении от этих путей.'
    reason: alternative_reading
lexical_decisions:
- source_word: לִפְעֻלּוֹת אָדָם
  choice: Что до дел человеческих
  rationale: Предлог לְ вводит тему высказывания, а אָדָם имеет здесь обобщённое значение. Формулировка передаёт человеческие поступки вообще и сохраняет поэтическую сжатость.
- source_word: בִּדְבַר שְׂפָתֶיךָ
  choice: по слову Твоих уст
  rationale: Предлог בְּ указывает на основание или средство, которым руководствуется псалмопевец. Буквальный образ «слово уст» сохранён как понятная поэтическая метонимия Божьей речи.
- source_word: שָׁמַרְתִּי
  choice: я держался вдали
  rationale: Обычное значение глагола — «хранить, соблюдать, сторожить», однако сочетание с «путями насильника» и контекст заявления о непорочности поддерживают смысл сознательного уклонения от этих путей. Неоднозначность отражена в сноске.
- source_word: אָרְחוֹת
  choice: от путей
  rationale: Сохранена метафора пути как образа поведения и жизненного курса.
- source_word: פָּרִיץ
  choice: насильника
  rationale: Слово обозначает жестокого, склонного к насилию человека. Единственное число исходного текста сохранено без превращения образа в отвлечённое понятие.
theological_decisions:
- issue: Смысл сочетания שָׁמַרְתִּי אָרְחוֹת פָּרִיץ
  choice: Псалмопевец утверждает, что благодаря Божьему слову держался вдали от путей насильника.
  alternative: «Я наблюдал за путями насильника» или «я стерёг пути насильника».
  rationale: Глагол שׁמר допускает значения хранения, соблюдения и наблюдения, но контекст молитвы о правоте и упоминание Божьего слова как руководства склоняют к значению уклонения от насильственного образа жизни. Альтернативное прочтение не устранено, а вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Обращение к Богу оформлено традиционным прописным «Твоих». Выражение «слово Твоих уст» сохраняет образность еврейского текста, а «держался вдали» естественно передаёт наиболее вероятный контекстуальный смысл глагола.
