lexical_decisions:
- source_word: מִפְּנֵי
  choice: от
  rationale: В данном контексте сочетание с פָּנִים указывает на источник угрозы, от которого псалмопевец просит защиты; русское «от» передаёт это естественно.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное обозначает нравственно виновных, злых людей; «нечестивые» сохраняет этическую и религиозную окраску исходного слова.
- source_word: זוּ
  choice: которые / что
  rationale: Относительная частица связывает «нечестивых» с последующим действием; в тексте использована естественная для поэтической речи конструкция.
- source_word: שַׁדּוּנִי
  choice: разоряющих меня
  rationale: Глагол שׁדד выражает насильственное разорение или опустошение. «Разоряющих» передаёт тяжесть враждебного действия, не сводя его непременно к полному уничтожению.
- source_word: אֹיְבַי
  choice: врагов моих
  rationale: Прямо передаёт форму множественного числа с притяжательным суффиксом; постпозиция местоимения поддерживает достоинство поэтического регистра.
- source_word: בְּנֶפֶשׁ
  choice: смертельных
  rationale: В контексте выражение, вероятнее всего, характеризует врагов как угрожающих самой жизни псалмопевца. Поскольку буквальное «душой/жизнью» по-русски неясно, основное значение передано словом «смертельных», а неоднозначность отмечена в сноске.
- source_word: יַקִּיפוּ עָלָי
  choice: окружают меня
  rationale: Форма глагола נקף с עַל описывает окружение или смыкание вокруг человека; «окружают меня» ясно и образно передаёт этот смысл.
theological_decisions:
- issue: Значение בְּנֶפֶשׁ при слове «враги»
  choice: смертельных врагов
  alternative: врагов, посягающих на мою жизнь; врагов, которые всей душой окружают меня
  rationale: Контекст мольбы о защите поддерживает значение угрозы жизни, однако еврейское выражение допускает и иной способ связи слова נֶפֶשׁ с враждебным действием. Основной текст остаётся естественным, а сноска сохраняет смысловую открытость.
