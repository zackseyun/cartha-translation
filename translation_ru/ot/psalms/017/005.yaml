lexical_decisions:
- source_word: תָּמֹךְ
  choice: твёрдо держались
  rationale: Глагол תמך передаёт идею крепко держать или поддерживать. В основном тексте выбрано утверждение о стойкости шагов, согласующееся с параллельной строкой; возможное прочтение как просьбы сохранено в сноске.
- source_word: אֲשֻׁרַי
  choice: мои шаги
  rationale: Существительное обозначает шаги или поступь; буквальный образ пути естественно сохраняется по-русски.
- source_word: בְּמַעְגְּלוֹתֶיךָ
  choice: Твоих путей
  rationale: מַעְגָּל означает колею, тропу или путь. «Пути» звучит естественно и сохраняет конкретную метафору движения; связь с глаголом передана нормативным русским управлением «держаться путей».
- source_word: בַּל
  choice: не
  rationale: Прямой эквивалент поэтического отрицания без неоправданного усиления.
- source_word: נָמֹטּוּ
  choice: не поскользнулись
  rationale: מוט может означать колебание, сдвиг или скольжение; при «стопах» глагол «поскользнуться» наиболее ясно сохраняет образ ходьбы.
- source_word: פְעָמָי
  choice: стопы мои
  rationale: В данном параллелизме слово указывает на шаги или ступни. «Стопы» позволяет сохранить телесный образ и избежать дословного повтора слова «шаги».
theological_decisions:
- issue: 'Грамматическая сила תָּמֹךְ: утверждение или просьба'
  choice: 'Утверждение: «Мои шаги твёрдо держались»'
  alternative: 'Просьба: «Поддержи мои шаги»'
  rationale: Форма допускает понимание как призыва или как поэтического утверждения. Параллельное совершенное действие «не поскользнулись» поддерживает утвердительное прочтение, но неоднозначность нельзя устранять, поэтому альтернативное прочтение дано в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Заглавная буква в местоимении «Твоих» соответствует традиционному уважительному обращению к Богу; «стопы» сохраняет библейскую образность, оставаясь понятным в контексте.
