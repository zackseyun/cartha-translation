base_translation:
  language: en
  yaml_path: translation/ot/psalms/017/014.yaml
  text: from men by your hand[a], O Yahweh, from men of the world, whose portion is in this life. You fill their belly with your stored-up treasure; they are satisfied with sons[c][b], and they leave their abundance to their children.
translation:
  language: ru
  text: 'От людей — Твоей рукой, Яхве,[a]

    от людей этого мира,

    чья доля — в этой жизни.


    Ты наполняешь их чрево тем, что Ты хранишь в запасе;

    они насыщаются сыновьями,[b]

    а свой избыток оставляют своим малым детям.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский синтаксис здесь сжат. Возможны также понимания: «от людей, Твоей рукой» (с подразумеваемым из предыдущего стиха «избавь меня») или «от людей руки Твоей».'
    reason: alternative_reading
  - marker: b
    text: 'Еврейское слово означает «сыновья». Возможно также понимание: «их сыновья насыщаются».'
    reason: lexical_alternative
  - marker: c
    text: Буквально речь идёт о маленьких детях, даже младенцах.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְתִים
  choice: от людей
  rationale: В контексте это человеческие противники; выражение параллельно словам «от людей этого мира». Значение «от мёртвых» здесь маловероятно.
- source_word: יָדְךָ
  choice: рукою Твоею
  rationale: Сохраняет образ Божьей руки и возможное значение орудия или действующей силы, не устраняя сжатость еврейского синтаксиса.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: מֵחֶלֶד
  choice: этого мира
  rationale: חֶלֶד обозначает преходящий мир человеческой жизни; указательное «этого» естественно выражает контекстуальный акцент на нынешнем земном порядке.
- source_word: חֶלְקָם בַּחַיִּים
  choice: чья доля — в этой жизни
  rationale: Передаёт мысль об уделе в нынешней жизни, сохраняя краткость и не добавляя прямого утверждения о посмертной участи.
- source_word: וּצְפוּנְךָ
  choice: Своими сокровищами
  rationale: Слово связано с тем, что скрыто или сохранено в запасе. «Сокровища» естественно передают предоставленное Богом изобилие, не сводя его исключительно к деньгам.
- source_word: תְּמַלֵּא בִטְנָם
  choice: Ты наполняешь их утробу
  rationale: Сохраняет конкретный образ בטן и форму прямого обращения к Богу.
- source_word: יִשְׂבְּעוּ בָנִים
  choice: они насыщаются сыновьями
  rationale: Сохраняет мужской род בנים и возможную мысль о многочисленных сыновьях как признаке благополучия; синтаксическая альтернатива отмечена в сноске.
- source_word: וְהִנִּיחוּ יִתְרָם
  choice: а свой избыток оставляют
  rationale: יֶתֶר означает остаток, излишек или избыток; в контексте речь идёт о накопленном достатке, передаваемом потомкам.
- source_word: לְעוֹלְלֵיהֶם
  choice: своим малым детям
  rationale: עוֹלֵל точнее обозначает маленького ребёнка; такой перевод сохраняет возрастной оттенок и остаётся естественным по-русски.
theological_decisions:
- issue: Связь противников с Божьей рукой
  choice: «От людей — рукою Твоею»
  alternative: «от людей руки Твоей» или «от людей, от руки Твоей»
  rationale: Сжатый еврейский оборот допускает несколько синтаксических связей. Основной текст выражает Божье действие, но не уточняет, являются ли эти люди орудиями суда или лишь находятся под Его властью.
- issue: Земной удел благополучных противников
  choice: «чья доля — в этой жизни»
  alternative: «чья доля — среди живых»
  rationale: Перевод показывает временный, земной горизонт их удела, но не вводит в сам стих развёрнутого учения о будущей участи.
- issue: Кто насыщается в выражении יִשְׂבְּעוּ בָנִים
  choice: «они насыщаются сыновьями»
  alternative: «их сыновья насыщаются»
  rationale: Еврейская конструкция допускает понимание בנים как того, чем они удовлетворены, либо как подлежащего следующей мысли. Неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмовым ритмом. Местоимения, относящиеся к Богу, написаны с прописной буквы. Конкретные образы «рука» и «утроба» сохранены; неоднозначные места не сглажены.
