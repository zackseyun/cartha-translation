    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Восстань
  rationale: Повелительная форма קום выражает настоятельный призыв к Богу действовать; «восстань» сохраняет возвышенный поэтический регистр и понятно современному читателю.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: קַדְּמָה פָנָיו
  choice: Выйди ему навстречу
  rationale: Буквально выражение связано с выходом перед чьим-либо лицом; в данном враждебном контексте оно означает встретить противника и преградить ему путь.
- source_word: הַכְרִיעֵהוּ
  choice: повергни его
  rationale: Каузативная форма от כרע означает заставить преклониться или пасть. «Повергни» естественно передаёт воинственный образ и повелительную силу текста.
- source_word: פַּלְּטָה
  choice: избавь
  rationale: Глагол פלט обозначает избавление или спасение от непосредственной опасности; «избавь» соответствует молитвенному регистру псалма.
- source_word: נַפְשִׁי
  choice: мою жизнь
  rationale: נפש здесь обозначает жизнь или самого человека, которому угрожает смертельная опасность, а не непременно нематериальную «душу».
- source_word: מֵרָשָׁע
  choice: от нечестивца
  rationale: Форма единственного числа и предшествующие местоименные суффиксы мужского рода единственного числа указывают на конкретного нечестивого противника; перевод не добавляет отсутствующее в еврейском тексте указание на пол словом «человек».
- source_word: חַרְבֶּךָ
  choice: Своим мечом
  rationale: 'Основной текст понимает «Твой меч» инструментально: Яхве избавляет псалмопевца посредством Своего меча. Притяжательное «Своим» естественно соотносит меч с подлежащим повелительного глагола.'
theological_decisions:
- issue: Связь выражения חַרְבֶּךָ («Твой меч») со словом רָשָׁע («нечестивец»)
  choice: 'Инструментальное понимание: Бог избавляет молящегося Своим мечом.'
  alternative: 'Аппозитивное понимание: нечестивец сам назван мечом Бога, то есть орудием в Его руке.'
  rationale: Сжатый еврейский оборот допускает оба синтаксических прочтения. Контекст прямых просьб о вмешательстве поддерживает инструментальное прочтение в основном тексте, но альтернативу необходимо сохранить, поскольку она существенно влияет на образ Божьего владычества и посреднической роли нечестивца.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но не архаичным молитвенно-поэтическим звучанием. Краткие повелительные формы сохраняют напряжённость оригинала; пунктуация передаёт последовательность настойчивых просьб.
