  text: וַ/אֲנִ֗י בְּ/רֹ֣ב חַ֭סְדְּ/ךָ אָב֣וֹא בֵיתֶ֑/ךָ אֶשְׁתַּחֲוֶ֥ה אֶל הֵֽיכַל קָ֝דְשְׁ/ךָ֗ בְּ/יִרְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/007.yaml
  text: But as for me[a], by the abundance of your steadfast love I will enter your house[b]; I will bow down toward your holy temple in fear of you.
translation:
  language: ru
  text: А я, благодаря обилию Твоей неизменной любви[a], войду в Твой дом; поклонюсь перед Твоим святым храмом в страхе перед Тобой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря обилию Твоей верности завету»; также возможно: «по великой милости Твоей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с благоговением перед Тобой» или «в трепете перед Тобой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Самостоятельное местоимение вместе с союзом выражает контраст с нечестивыми, о которых говорится выше; по-русски этот контраст естественно передаётся сочетанием «А я».
- source_word: בְּרֹב חַסְדְּךָ
  choice: благодаря обилию Твоей неизменной любви
  rationale: בְּרֹב указывает на основание или обстоятельство приближения, а חֶסֶד обозначает устойчивую, верную любовь. Формулировка сохраняет как идею изобилия, так и постоянство Божьей любви.
- source_word: אָבוֹא בֵיתֶךָ
  choice: войду в Твой дом
  rationale: Имперфект выражает намерение или ожидание, а בַּיִת буквально означает «дом». Это также позволяет не отождествлять слово заранее с «храмом», названным далее.
- source_word: אֶשְׁתַּחֲוֶה
  choice: поклонюсь
  rationale: Глагол обозначает телесное склонение или простирание в поклонении. Русское «поклонюсь» сохраняет и телесный образ, и культовый смысл.
- source_word: אֶל הֵיכַל קָדְשְׁךָ
  choice: обратившись к Твоему святому храму
  rationale: אֶל здесь передаёт направленность поклонения к святилищу. Оборот «обратившись к» ясно выражает направление и не подразумевает вход во внутреннее святилище.
- source_word: בְּיִרְאָתֶךָ
  choice: в страхе перед Тобой
  rationale: יִרְאָה охватывает страх, благоговение и трепет. Основной перевод сохраняет прямоту еврейского выражения и не смягчает его до одного лишь уважения.
theological_decisions:
- issue: Значение חֶסֶד как основания приближения к Богу
  choice: неизменная любовь
  alternative: верность завету; милость
  rationale: Выражение указывает на устойчивую и верную Божью любовь, на основании которой псалмопевец входит в Божий дом. «Неизменная любовь» сохраняет личный и длительный характер חֶסֶד, не сужая его только до милосердия и не вводя слово «завет», отсутствующее в самом стихе.
- issue: Оттенок יִרְאָה в поклонении Богу
  choice: страх перед Тобой
  alternative: благоговение перед Тобой; трепет перед Тобой
  rationale: Текст сочетает доступ к Богу по Его любви со святым страхом. Такой перевод сохраняет богословское напряжение между близостью и благоговейной боязнью, не сводя יִרְאָה ни к ужасу, ни к простому почтению.
translation_notes:
  register: 'Современный литературный русский язык с возвышенным, но понятным молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Пунктуация подчёркивает две последовательные части стиха: вход в Божий дом и поклонение по направлению к святому храму.'
