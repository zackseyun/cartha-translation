    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָרַי
  choice: моим словам
  rationale: Форма множественного числа с суффиксом первого лица означает «мои слова»; дательный падеж обусловлен естественным русским управлением глагола «внимать».
- source_word: הַאֲזִינָה
  choice: внемли
  rationale: Просительная форма от אזן призывает внимательно выслушать. «Внемли» сохраняет усиленное значение и молитвенное достоинство, не сводя его к простому восприятию звука.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное Божье имя, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: בִּינָה
  choice: пойми
  rationale: Императив от בין выражает просьбу воспринять и постичь то, что псалмопевец не вполне высказывает словами.
- source_word: הֲגִיגִי
  choice: мой стон
  rationale: Слово может обозначать внутреннее размышление, невнятное бормотание или тихий звук. В контексте молитвы-плача «мой стон» естественно передаёт мучительное, едва выраженное переживание, сохраняя альтернативы в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Характер הֲגִיגִי
  choice: мой стон
  alternative: моё размышление / моё бормотание
  rationale: Контекст плача поддерживает значение тихого мучительного излияния, однако многозначность еврейского слова не позволяет исключить внутреннее размышление или невнятное произнесение; поэтому варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский с приподнятым молитвенным оттенком. «Внемли» несколько торжественно, но общеупотребительно и точно передаёт просьбу об особо внимательном слушании. Сноска поставлена после слова «стон», к которому относится лексическая неоднозначность.
