base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/010.yaml
  text: Declare them guilty[a], O God; let them fall by their own counsels. Drive them away because of their many transgressions[b], for they have rebelled against you.
translation:
  language: ru
  text: Признай их виновными, Боже; пусть они падут из-за собственных замыслов.[a] За множество их преступлений изгони их,[b] ведь они восстали против Тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть они падут от своих замыслов»; еврейский предлог может обозначать источник или причину их падения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «отвергни их»; еврейский глагол может означать удаление, изгнание или отбрасывание прочь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲשִׁימֵם
  choice: Признай их виновными
  rationale: Повелительная форма породы хифиль от אשם с местоименным суффиксом выражает просьбу к Богу признать их виновными или поступить с ними как с виновными. Перевод сохраняет судебный смысл, не уточняя меру наказания.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма обращения естественно передаётся русским звательным употреблением «Боже».
- source_word: יִפְּלוּ
  choice: пусть они падут
  rationale: Имперфект с юссивным оттенком продолжает прямую молитвенную просьбу; «пусть они падут» сохраняет просительный, а не предсказательный характер строки.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: из-за собственных замыслов
  rationale: מוֹעֵצוֹת обозначает советы, планы или замыслы, а מן допускает значение источника либо причины. Основной текст естественно передаёт мысль, что причиной падения становятся их собственные замыслы, а примечание сохраняет альтернативное понимание «лишившись своих замыслов».
- source_word: בְּרֹב פִּשְׁעֵיהֶם
  choice: за множество их преступлений
  rationale: ב здесь имеет причинно-оснóвное значение, а פֶּשַׁע означает преступление, нарушение или мятеж. Формулировка сохраняет нравственный и судебный вес выражения.
- source_word: הַדִּיחֵמוֹ
  choice: изгони их
  rationale: Хифиль от נדח означает заставить удалиться, изгнать или отринуть. «Изгони» кратко, сильно и уместно в молитве о Божьем суде.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предыдущих просьб; «ведь» естественно связывает причину с прошением в современной русской поэтической речи.
- source_word: מָרוּ בָךְ
  choice: они восстали против Тебя
  rationale: מרה с предлогом ב выражает непокорность или мятеж против Бога. «Восстали против Тебя» прямо передаёт активный характер бунта.
theological_decisions:
- issue: Язык молитвы о суде над врагами
  choice: Сохранить прямые просьбы о признании виновности, падении и изгнании.
  alternative: Передать формы как предсказание будущего наказания или смягчить их до просьбы о пресечении зла.
  rationale: В еврейском тексте употреблены повелительные формы и имперфект с юссивным оттенком в обращении к Богу. Прямой перевод сохраняет характер молитвы о Божьем суде и не устраняет богословское напряжение текста.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Синтаксис краткий и энергичный; формы «падут», «изгони», «восстали» сохраняют торжественность без архаизации. Прописное «Тебя» употреблено как уважительное обращение к Богу.
