  text: 'For the choirmaster: according to the flutes[a]. A psalm of David[b].'
translation:
  language: ru
  text: Руководителю хора. На флейтах[a]. Псалом Давида[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «на духовых инструментах». Еврейское слово, вероятно, является специальным музыкальным термином; традиционно его также передают без перевода: «Нехилот».'
    reason: lexical_alternative
  - marker: b
    text: Заголовок «Псалом Давида» может указывать на авторство, посвящение или принадлежность к собранию, связанному с Давидом.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов это слово обычно обозначает человека, руководящего музыкальным исполнением. Дательный падеж передаёт значение приставки לְ, а выражение звучит естественно и понятно в современном русском языке.
- source_word: אֶל הַנְּחִילוֹת
  choice: На флейтах
  rationale: В музыкальном заголовке אֶל, вероятно, указывает на способ или инструмент исполнения. Значение редкого технического термина הַנְּחִילוֹת не вполне ясно; традиционное понимание как флейт или духовых инструментов отражено в тексте, а неопределённость сохранена в сноске.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Это обычное обозначение псалма как предназначенной для музыкального исполнения священной песни; традиционный русский эквивалент точен и общепонятен.
- source_word: לְדָוִד
  choice: Давида
  rationale: Конструкция «Псалом Давида» естественно передаёт краткий еврейский заголовок, не добавляя в основной текст более определённого «написанный Давидом». Возможные отношения авторства, посвящения или принадлежности к собранию разъяснены в сноске.
theological_decisions:
- issue: Значение לְ в выражении לְדָוִד
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида
  rationale: Еврейский предлог допускает авторство, принадлежность, посвящение или связь с Давидовым собранием. Перевод не должен без достаточных оснований устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой богослужебного заголовка. Синтаксис разделён на три короткие фразы, чтобы ясно передать адресата, указание для исполнения и жанрово-коллекционную атрибуцию.
