base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/005.yaml
  text: The boastful will not stand before your eyes[b][a]; you hate all workers of wickedness.
translation:
  language: ru
  text: Надменные[a] не смогут предстать перед Твоим взором; Ты ненавидишь всех, кто творит беззаконие[b].
  philosophy: optimal-equivalence
  footnotes:
