lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: не устоят
  rationale: Возвратная порода глагола יצב передаёт значение «становиться, занимать своё место, представать». «Не устоят» естественно по-русски выражает невозможность оставаться в Божьем присутствии, сохраняя при этом образ стояния.
- source_word: הוֹלְלִים
  choice: надменные
  rationale: Причастная форма обозначает людей самодовольных, кичливых и дерзких. «Надменные» передаёт нравственную оценку и хорошо согласуется с параллельным упоминанием творящих беззаконие.
- source_word: לְנֶגֶד עֵינֶיךָ
  choice: перед Твоими глазами
  rationale: Сохранён конкретный древнееврейский образ «перед глазами», который в контексте означает пребывание перед Богом, под Его взором.
- source_word: שָׂנֵאתָ
  choice: Ты ненавидишь
  rationale: Глагол прямо означает «ненавидеть». Перевод не смягчает резкое утверждение исходного текста словами «отвергаешь» или «противишься».
- source_word: פֹּעֲלֵי אָוֶן
  choice: всех, кто творит беззаконие
  rationale: Оборот буквально называет совершающих или делающих אָוֶן. Формулировка «кто творит беззаконие» сохраняет деятельный смысл причастия и нравственную силу существительного, оставаясь естественной для русского читателя.
theological_decisions:
- issue: Высказывание о Божьей ненависти
  choice: 'Сохранить прямое утверждение: «Ты ненавидишь всех, кто творит беззаконие».'
  alternative: «Ты отвергаешь» или «Ты противишься всем, кто творит беззаконие».
  rationale: Древнееврейское שָׂנֵאתָ прямо выражает ненависть. Смягчение устранило бы намеренную богословскую остроту текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Конкретный образ «перед Твоими глазами» сохранён, а синтаксис сделан понятным обычному современному читателю. Местоимения, обращённые к Богу, написаны с прописной буквы согласно принятой русской библейской традиции.
