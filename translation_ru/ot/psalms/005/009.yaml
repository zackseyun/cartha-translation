  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֤י אֵ֪ין בְּ/פִ֡י/הוּ נְכוֹנָה֮ קִרְבָּ֪/ם הַ֫וּ֥וֹת קֶֽבֶר פָּת֥וּחַ גְּרוֹנָ֑/ם לְ֝שׁוֹנָ֗/ם יַחֲלִֽיקוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/009.yaml
  text: For there is nothing trustworthy in their mouth[a]; their inward part is destruction. Their throat is an open grave[c][b]; with their tongue they flatter.
translation:
  language: ru
  text: Ибо нет ничего надёжного в их устах[a]; внутри них — погибель[b]. Их горло — открытая могила; своим языком они льстят[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в его устах»; далее в стихе речь о тех же людях идёт во множественном числе.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «их внутренность — пагуба»; возможно также: «внутри них — гибельные замыслы».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «делают свой язык гладким», то есть говорят льстиво или гладко.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание для предшествующей просьбы; «ибо» ясно передаёт логическую связь и соответствует достоинству поэтической речи.
- source_word: אֵין
  choice: нет ничего
  rationale: Экзистенциальное отрицание выражает полное отсутствие названного качества; по-русски естественно передаётся сочетанием «нет ничего».
- source_word: בְּפִיהוּ
  choice: в их устах
  rationale: Форма буквально имеет суффикс единственного числа («в его устах»), однако последующие местоименные суффиксы стоят во множественном числе и указывают на собирательное множество нечестивых. Основной текст согласован по числу, а формальная особенность сохранена в примечании.
- source_word: נְכוֹנָה
  choice: надёжного
  rationale: Слово обозначает нечто твёрдое, верное, заслуживающее доверия. В контексте лживой речи «надёжного» сохраняет смысл достоверности, не сводя его только к фактической истинности.
- source_word: קִרְבָּם
  choice: внутри них
  rationale: Буквально речь идёт об их внутренней части или внутреннем существе. Русское «внутри них» естественно сохраняет широкую антропологическую метафору, не сужая её до одного лишь сердца.
- source_word: הַוּוֹת
  choice: погибель
  rationale: Множественная форма может обозначать пагубу, разрушение или гибельные замыслы. Собирательное «погибель» передаёт предикативную силу и разрушительный характер внутреннего состояния.
- source_word: קֶבֶר פָּתוּחַ
  choice: открытая могила
  rationale: Буквальный и выразительный образ смертоносной, разлагающей речи хорошо сохраняется в современном русском.
- source_word: גְּרוֹנָם
  choice: их горло
  rationale: В контексте органов речи «горло» — точный и естественный русский эквивалент.
- source_word: לְשׁוֹנָם
  choice: своим языком
  rationale: Еврейский собирательный единственный естественно передаётся русским единственным числом; возвратное местоимение ясно связывает язык с действующими лицами.
- source_word: יַחֲלִיקוּן
  choice: они льстят
  rationale: Порода hифиль от חלק буквально выражает действие «делать гладким» и в данном речевом контексте означает пользоваться гладкой, льстивой речью. «Льстят» кратко и естественно передаёт прагматический смысл.
theological_decisions:
- issue: Антропологическая метафора קִרְבָּם
  choice: внутри них
  alternative: их внутренность; их сердце
  rationale: Выражение описывает внутреннюю испорченность, проявляющуюся в речи. Широкая формулировка сохраняет поэтическую напряжённость и не отождествляет внутреннее существо исключительно с сердцем как отдельной способностью.
- issue: Число местоименного суффикса в בְּפִיהוּ
  choice: в их устах
  alternative: в его устах
  rationale: Хотя данная форма морфологически стоит в единственном числе, остальная часть стиха последовательно говорит о той же группе во множественном. Основной перевод передаёт контекстуальный коллективный смысл, а буквальная форма отмечена в сноске.
- issue: Образ открытой могилы
  choice: сохранить прямую метафору «их горло — открытая могила»
  alternative: истолковать как смертоносную или развращающую речь
  rationale: 'Исходный текст не разъясняет метафору, поэтому перевод сохраняет её многозначность: она может указывать и на смерть, и на разложение, и на ненасытность, не закрепляя единственное богословское толкование.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим регистром. «Ибо» поддерживает связь с предыдущим контекстом; остальная лексика общеупотребительна. Параллелизм и резкие телесные образы еврейской поэзии сохранены без конфессионального истолкования.
