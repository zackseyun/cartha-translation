base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/011.yaml
  text: But let all who take refuge in you rejoice[a]; let them shout for joy forever. Spread your protection over them[b], so that those who love your name may exult in you.
translation:
  language: ru
  text: Но пусть радуются все, кто находит прибежище в Тебе; пусть вечно ликуют[a]. Простри над ними Свой покров[b], и да торжествуют в Тебе любящие имя Твоё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть вечно восклицают от радости» или «пусть вечно поют от радости». Еврейский глагол обозначает звонкие ликующие возгласы и может подразумевать пение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «покрой их» или «укрой их». В еврейском тексте использован образ защитного покрова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂמְחוּ
  choice: пусть радуются
  rationale: Имперфект Qal в контексте молитвы естественно передаёт пожелание или просьбу, а не только предсказание.
- source_word: חוֹסֵי בָךְ
  choice: кто находит прибежище в Тебе
  rationale: Причастие от חסה сохраняет конкретный образ поиска убежища и защиты, не сводя его лишь к внутреннему доверию.
- source_word: לְעוֹלָם
  choice: вечно
  rationale: Передаёт длительность и естественно звучит в современной русской поэтической речи.
- source_word: יְרַנֵּנוּ
  choice: пусть вечно ликуют
  rationale: Piel глагола רנן обозначает громкое радостное возглашение и может включать пение; «ликуют» сохраняет широту значения и возвышенный тон.
- source_word: וְתָסֵךְ עָלֵימוֹ
  choice: Укрой их Своей защитой
  rationale: Hiphil от סכך выражает защитное покрытие или укрытие; формулировка сохраняет образ и ясно передаёт его защитный смысл.
- source_word: וְיַעְלְצוּ בְךָ
  choice: да торжествуют в Тебе
  rationale: עלץ выражает сильную, восторженную радость; «торжествуют» отличает её от обычной радости и сохраняет направленность на Бога.
- source_word: אֹהֲבֵי שְׁמֶךָ
  choice: любящие имя Твоё
  rationale: Сохранено прямое упоминание Божьего имени как выражения Его явленного характера и славы.
theological_decisions:
- issue: Молитвенное пожелание или предсказание во всём стихе
  choice: 'Формы переданы как просьбы и пожелания: «пусть…», «да…».'
  alternative: «Будут радоваться… будут ликовать… будут торжествовать».
  rationale: В молитвенном контексте псалма еврейские имперфекты естественно имеют юссивную силу. При этом возможный оттенок будущего не превращён в категорическое предсказание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы как допустимая русская библейская издательская норма. Синтаксический параллелизм и различие между «радоваться», «ликовать» и «торжествовать» сохранены.
