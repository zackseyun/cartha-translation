  text: Pay attention to the sound of my cry for help[a], my King and my God, for to you I pray.
translation:
  language: ru
  text: Услышь голос моего вопля о помощи, мой Царь и мой Бог, ибо Тебе я молюсь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду молиться». Еврейская форма в зависимости от контекста может обозначать настоящее, продолжающееся или будущее действие.'
    reason: Сохранение видо-временной неоднозначности еврейского имперфекта.
lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Внемли
  rationale: Императив выражает просьбу об attentive, сосредоточенном слушании. «Внемли» естественно для современного литературного молитвенного регистра и сильнее простого «услышь» передаёт призыв обратить внимание.
- source_word: לְקוֹל
  choice: голосу
  rationale: קוֹל означает «голос, звук». В сочетании с «моего вопля» русское «голосу» сохраняет еврейскую конструкцию и звучит естественнее буквального «звуку».
- source_word: שַׁוְעִי
  choice: моего вопля о помощи
  rationale: שַׁוְעָה обозначает крик бедствия и зов о помощи, поэтому уточнение «о помощи» передаёт заложенный в слове просительный смысл.
- source_word: מַלְכִּי וֵאלֹהָי
  choice: Царь мой и Бог мой
  rationale: Сохранены оба обращения к Богу и притяжательные суффиксы; прописные буквы соответствуют принятому русскому оформлению прямого обращения к Богу.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание просьбы. «Ведь» ясно и естественно выражает причинную связь в данном молитвенном обращении.
- source_word: אֵלֶיךָ
  choice: Тебе
  rationale: Предлог указывает на направленность молитвы к адресату; дательный падеж с глаголом «молиться» передаёт это по-русски естественно.
- source_word: אֶתְפַּלָּל
  choice: я молюсь
  rationale: Форма имперфекта может иметь настоящее, продолжающееся или будущее значение. В непосредственной молитве настоящее время наиболее естественно, а временная неоднозначность отмечена в сноске.
theological_decisions:
- issue: Обращение к Богу с царским титулом
  choice: Царь мой и Бог мой
  alternative: царь мой и Бог мой
  rationale: Текст прямо обращается к Богу и как к Царю, и как к Богу. Оба титула сохранены без внесения дополнительных доктринальных смыслов; прописная буква — особенность русского оформления божественных наименований.
- issue: Видо-временное значение אֶתְפַּלָּל
  choice: я молюсь
  alternative: я буду молиться
  rationale: Еврейский имперфект допускает настоящее, продолжающееся либо будущее понимание. Контекст непосредственного прошения благоприятствует настоящему времени, но будущий оттенок остаётся возможным и указан в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. «Внемли» несколько возвышенно, но общеупотребительно в религиозно-поэтическом контексте; синтаксис остаётся ясным для современного читателя.
