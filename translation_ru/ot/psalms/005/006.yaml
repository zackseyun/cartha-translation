lexical_decisions:
- source_word: תְּאַבֵּד
  choice: Ты губишь
  rationale: Пиэль глагола אבד во 2-м лице мужского рода единственного числа означает «приводить к гибели, уничтожать». Настоящее время естественно передаёт здесь общее, характерное действие Бога, при сохранении в сноске возможного будущего значения.
- source_word: דֹּבְרֵי כָזָב
  choice: тех, кто говорит ложь
  rationale: Конструктивное сочетание буквально означает «говорящие ложь». Развёрнутый оборот сохраняет глагольную силу еврейского выражения и звучит естественно по-русски.
- source_word: אִישׁ דָּמִים
  choice: человеком, повинным в кровопролитии
  rationale: Идиома «человек кровей» обозначает человека, отмеченного насилием, пролитием крови или кровной виной. «Повинный в кровопролитии» передаёт смысл без неоправданного сужения до убийцы.
- source_word: וּמִרְמָה
  choice: и коварстве
  rationale: מִרְמָה может означать обман, вероломство или коварство. «Коварство» хорошо сочетается с кровопролитием и сохраняет нравственную тяжесть выражения.
- source_word: יְתָעֵב
  choice: гнушается
  rationale: Пиэль תעב выражает сильное нравственное отвращение. «Гнушается» соответствует интенсивности и возвышенному поэтическому регистру псалма.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом, что сохраняет форму исходного текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохранено личное имя Бога без замены титулом.
- issue: Временное значение תְּאַבֵּד
  choice: Ты губишь
  alternative: Ты погубишь
  rationale: Форма yiqtol допускает как общее утверждение о Божьем действии, так и будущее значение. Основной текст следует контексту общих утверждений, а подлинная неоднозначность отмечена в сноске.
- issue: Передача אִישׁ דָּמִים וּמִרְמָה
  choice: человеком, повинным в кровопролитии и коварстве
  alternative: человеком кровей и обмана; кровожадным и лживым человеком
  rationale: Выбранный вариант сохраняет мужской род и единственное число, передаёт идиому о кровной вине или насилии и не сужает её значения исключительно до убийства.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Инверсия во второй строке сохраняет смысловой акцент на нравственном облике человека, не делая фразу архаичной; лексика передаёт сильное отвращение исходного глагола.
