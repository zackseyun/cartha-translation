base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/003.yaml
  text: Yahweh[a], in the morning you hear my voice[b]; in the morning I lay my request before you and watch expectantly.
translation:
  language: ru
  text: Яхве, утром Ты услышишь мой голос; утром я изложу перед Тобой свою молитву[a] и буду ждать с надеждой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «расположу (или: приведу в порядок) для Тебя». Подразумевается, вероятно, молитва или просьба, которую псалмопевец представляет Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «буду всматриваться в ожидании». Еврейский глагол может означать наблюдение, ожидание или устремлённый вперёд взгляд с надеждой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: בֹּקֶר
  choice: утром
  rationale: Естественно передаёт обстоятельственное употребление существительного; повтор сохранён в обеих частях стиха.
- source_word: תִּשְׁמַע
  choice: Ты услышишь
  rationale: Имперфект допускает будущее и обычное действие. Будущее время естественно выражает уверенное ожидание молящегося, не превращая глагол в просьбу.
- source_word: קוֹלִי
  choice: мой голос
  rationale: Прямое соответствие обычному значению קוֹל; вариант «мой вопль» был бы сильнее, чем требует еврейский текст.
- source_word: אֶעֱרָךְ לְךָ
  choice: я изложу перед Тобой свою молитву
  rationale: Глагол ערך означает «располагать, приводить в порядок, представлять». В молитвенном контексте подразумеваемым объектом, вероятно, служит молитва; дополнение добавлено для ясности и отмечено сноской.
- source_word: וַאֲצַפֶּה
  choice: и буду ждать с надеждой
  rationale: Передаёт сочетание наблюдения, ожидания и устремлённой надежды, присущее צפה в данном контексте, без добавления прямо не названного «ответа».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Характер Божьего слышания
  choice: Ты услышишь
  alternative: Ты слышишь
  rationale: Еврейский имперфект допускает обе возможности. Будущее время соответствует утреннему обращению и выражает уверенность псалмопевца, не утверждая, что Бог слышит лишь впоследствии.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы как уместная русская стилистическая норма. Параллельный повтор «утром» и последовательность частей еврейского стиха сохранены.
