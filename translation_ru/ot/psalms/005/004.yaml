  source_fidelity: 'Текст точно передаёт обе части еврейского стиха: כִּי как обоснование («Ведь»), отрицание Божьего благоволения к רֶשַׁע и невозможность пребывания רָע у Бога. «Не поселится у Тебя» адекватно передаёт образ גור — проживания/пребывания пришельца или гостя; будущая форма естественно выражает исключение из Божьего присутствия.'
