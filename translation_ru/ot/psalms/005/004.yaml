  text: כִּ֤י לֹ֤א אֵֽל חָפֵ֘ץ רֶ֥שַׁע אָ֑תָּה לֹ֖א יְגֻרְ/ךָ֣ רָֽע׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/005/004.yaml
  text: For you are not a God who delights in wickedness[a]; evil may not dwell with you.
translation:
  language: ru
  text: Ведь Ты не Бог, которому приятно нечестие; зло не поселится у Тебя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «злой человек не поселится у Тебя»; «злодей не сможет пребывать у Тебя».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Вводит основание предшествующей просьбы и естественно передаёт аргументативную связь в русском тексте псалма.
- source_word: אֵל
  choice: Бог
  rationale: Обращение к истинному Богу; обычное и уместное русское соответствие.
- source_word: חָפֵץ
  choice: которому приятно
  rationale: Передаёт значение расположения и удовольствия от чего-либо, а не только волевого желания; оборот звучит естественно при отрицании.
- source_word: רֶשַׁע
  choice: нечестие
  rationale: Сохраняет абстрактный характер существительного и его нравственно-религиозную окраску.
- source_word: יְגֻרְךָ
  choice: не поселится у Тебя
  rationale: Глагол גור обозначает проживание или пребывание в качестве пришельца либо гостя; выбранная формулировка сохраняет пространственный образ и естественна по-русски.
- source_word: רָע
  choice: зло
  rationale: Абстрактное прочтение поддерживается параллелизмом с «нечестием», однако грамматически возможно и личное значение, отмеченное в сноске.
theological_decisions:
- issue: Следует ли понимать רָע как абстрактное «зло» или как личное «злой человек»
  choice: зло
  alternative: злой человек / злодей
  rationale: Параллелизм с абстрактным רֶשַׁע благоприятствует значению «зло», тогда как субстантивированное прилагательное допускает личное прочтение. Основной текст не сужает смысл, а реальная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Местоимение «Ты» написано с прописной буквы как традиционный знак почтительного обращения к Богу. Образ временного проживания сохранён без архаичного «обитать».
