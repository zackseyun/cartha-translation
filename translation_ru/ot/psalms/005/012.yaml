lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание предшествующей уверенности и естественно передаёт причинно-пояснительную связь.
- source_word: תְּבָרֵךְ
  choice: благословляешь
  rationale: Имперфект выражает характерное и уверенно ожидаемое действие Бога; настоящее время естественно передаёт эту уверенность по-русски.
- source_word: צַדִּיק
  choice: праведника
  rationale: Субстантивированное прилагательное в единственном числе обозначает типичного представителя праведных; форма «праведника» сохраняет исходное число и звучит естественно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога сохраняет прямую отсылку к тетраграмматону, а не заменяет его титулом.
- source_word: כַּצִּנָּה
  choice: словно щитом
  rationale: Предлог сравнения и существительное переданы инструментальным сравнительным оборотом; цинна могла обозначать большой щит, но уточнение размера в основном тексте не обязательно.
- source_word: רָצוֹן
  choice: благоволением
  rationale: В данном контексте слово обозначает благосклонное отношение Бога, представленное как окружающая праведника защита.
- source_word: תַּעְטְרֶנּוּ
  choice: Ты окружаешь его
  rationale: Глагол допускает значения «венчать» и «окружать»; образ щита поддерживает значение защитного окружения. Личное «Ты» сохраняет обращение к Яхве, выраженное глагольной формой.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Носитель действия в заключительной строке
  choice: Яхве окружает праведника благоволением
  alternative: Благоволение окружает праведника
  rationale: Форма תַּעְטְרֶנּוּ — глагол второго лица мужского рода единственного числа с объектным суффиксом, поэтому грамматическим субъектом остаётся Бог; רָצוֹן понимается как то, чем Он окружает праведника.
