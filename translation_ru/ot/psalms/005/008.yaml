- from: Яхве, веди меня в Твоей праведности ради тех, кто враждебно следит за мной[a]; выпрями предо мной Твой путь[b].
  to: Яхве, веди меня в Твоей праведности из-за моих врагов[a]; сделай Твой путь прямым передо мной[b].
