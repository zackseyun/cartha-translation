  text: Яхве, веди меня в Твоей праведности из-за моих врагов[a]; сделай Твой путь прямым передо мной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за тех, кто враждебно наблюдает за мной» или «из-за тех, кто подстерегает меня»; еврейское слово может обозначать не просто врагов, а враждебных наблюдателей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сделай ровным передо мной Твой путь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте; обращение выражено русской формой без добавления частицы «о».
- source_word: נְחֵנִי
  choice: веди меня
  rationale: Прямо и естественно передаёт просьбу направлять говорящего; сохраняет образ движения по пути.
- source_word: בְצִדְקָתֶךָ
  choice: в Твоей праведности
  rationale: Сохраняет возможное значение сферы или нормы Божьего водительства и более широкий нравственный смысл צְדָקָה, не сужая его до судебной справедливости.
- source_word: לְמַעַן
  choice: ради
  rationale: Передаёт основание или мотив просьбы; в данном контексте речь идёт о необходимости Божьего водительства ввиду враждебных наблюдателей.
- source_word: שׁוֹרְרָי
  choice: тех, кто враждебно следит за мной
  rationale: Отражает не только общее понятие врагов, но и вероятный оттенок враждебного наблюдения или подстерегания, присущий редкому еврейскому слову.
- source_word: הושר
  choice: выпрями
  rationale: Каузативная форма от ישר означает сделать прямым или ровным; «выпрями» сохраняет образ пути и допускает нравственный подтекст.
- source_word: לְפָנַי
  choice: предо мной
  rationale: Естественное для возвышенной поэтической речи обозначение пути, открываемого перед молящимся.
- source_word: דַּרְכֶּךָ
  choice: Твой путь
  rationale: 'Сохраняет единственное число и двойной оттенок: дорога, по которой следует идти, и установленный Богом образ жизни.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено собственное имя Бога; «Яхве» непосредственно передаёт его общепринятую научную реконструкцию, не заменяя титулом.
- issue: Значение בְצִדְקָתֶךָ
  choice: в Твоей праведности
  alternative: по Твоей праведности; Твоей справедливостью
  rationale: Формулировка сохраняет широту еврейского выражения и его неоднозначность между сферой, нормой и основанием Божьего водительства.
- issue: Образ выпрямленного пути
  choice: выпрями предо мной Твой путь
  alternative: сделай ровным предо мной Твой путь
  rationale: Перевод не определяет насильно, означает ли образ устранение препятствий, ясное указание направления или нравственную прямоту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Заглавные местоимения при обращении к Богу использованы как принятая русская благоговейная орфографическая норма; синтаксис остаётся ясным для обычного читателя.
