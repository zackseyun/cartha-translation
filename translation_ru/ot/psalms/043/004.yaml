    reason: cultural_note
lexical_decisions:
- source_word: וְאָבוֹאָה
  choice: И войду я
  rationale: Когортатив первого лица выражает намерение и решимость как результат предшествующей просьбы; порядок слов придаёт фразе уместную поэтическую торжественность.
- source_word: אֶל מִזְבַּח אֱלֹהִים
  choice: к жертвеннику Бога
  rationale: Прямо передаёт конструкцию принадлежности и сохраняет возвышенный культовый контекст.
- source_word: אֶל אֵל
  choice: к Богу
  rationale: Здесь אֵל служит обозначением единого Бога параллельно אֱלֹהִים; перевод не вводит искусственного различия между божественными титулами.
- source_word: שִׂמְחַת גִּילִי
  choice: радости моего ликования
  rationale: Сохраняет сочетание двух близких слов со значением радости и его усилительный, поэтический характер, не сводя выражение к толкованию «высшая радость».
- source_word: וְאוֹדְךָ
  choice: и буду славить Тебя
  rationale: В контексте богослужения и музыкального сопровождения ידה обозначает публичное прославление; «славить» естественно передаёт этот смысл.
- source_word: בְכִנּוֹר
  choice: на лире
  rationale: כִּנּוֹר — древний струнный инструмент, вероятнее всего близкий к лире; русское управление «играть/славить на лире» звучит естественно.
- source_word: אֱלֹהִים אֱלֹהָי
  choice: Боже, Боже мой
  rationale: Русский звательный оборот ясно передаёт прямое обращение и сохраняет повтор и личное исповедание псалмопевца.
theological_decisions:
- issue: Передача повторяющихся обозначений Бога אֱלֹהִים / אֵל
  choice: Оба обозначения переданы словом «Бог» в соответствующих падежных формах.
  alternative: Передать אֵל как «Бог Всемогущий», «Сильный» или транслитерировать как «Эль».
  rationale: В данном стихе эти слова образуют поэтический параллелизм и указывают на одного Бога; контекст не требует превращать лексическое различие в отдельное вероучительное утверждение.
- issue: Усилительное сочетание שִׂמְחַת גִּילִי
  choice: Сохранено как «радости моего ликования».
  alternative: 'Передать интерпретирующе: «моей высшей радости» или «Богу, Который радует меня».'
  rationale: 'Буквально-поэтическая передача сохраняет двойной язык радости и его богословскую напряжённость: Бог назван не только источником, но самой радостью ликования псалмопевца.'
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим строем. Инверсия «И войду я» и обращение «Боже» сохраняют торжественность псалма без архаических форм; прописные местоимения в обращении к Богу соответствуют принятой русской религиозной письменной норме.
