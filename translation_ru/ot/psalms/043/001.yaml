lexical_decisions:
- source_word: שָׁפְטֵנִי
  choice: Рассуди меня
  rationale: Императив שׁפט с личным объектом в молитве-просьбе означает просьбу к Богу вынести справедливое судебное решение в пользу молящегося. «Рассуди меня» сохраняет судебный образ и не подразумевает простого нравственного осуждения.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма русского звательного обращения естественно и достойно передаёт прямое обращение к Богу.
- source_word: וְרִיבָה רִיבִי
  choice: и веди мою тяжбу
  rationale: Сочетание глагола ריב с однокоренным существительным обозначает ведение судебного дела. «Веди мою тяжбу» сохраняет юридическую образность и звучит естественно в возвышенной молитвенной речи.
- source_word: מִגּוֹי לֹא חָסִיד
  choice: против неверного народа
  rationale: В контексте тяжбы предлог מִן указывает на противную сторону. Отрицание לֹא חָסִיד характеризует народ как лишённый верности и преданности; «неверный» сохраняет этот этико-реляционный смысл, не сводя выражение только к отсутствию благочестия.
- source_word: מֵאִישׁ מִרְמָה וְעַוְלָה
  choice: от человека лживого и несправедливого
  rationale: Конструкция с абстрактными существительными характеризует человека обманом и неправдой. Русские прилагательные естественно передают этот смысл, сохраняя единственное число и судебный оттенок עַוְלָה.
- source_word: תְפַלְּטֵנִי
  choice: избавь меня
  rationale: Пиэль глагола פלט означает вывести из опасности, спасти. «Избавь меня» соответствует срочной молитвенной просьбе и современному литературному библейскому регистру.
theological_decisions:
- issue: Передача לֹא חָסִיד
  choice: неверного
  alternative: неблагочестивого; не хранящего верности
  rationale: חָסִיד связан с верностью, преданностью и חסד. В отрицательной конструкции «неверный» сохраняет отношение к нарушенной верности, тогда как «неблагочестивый» шире и может скрыть этот оттенок. Альтернативы отмечены в сноске для сохранения смысловой неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-судебного контекста. Юридические образы оригинала сохранены без чрезмерной архаизации; синтаксис остаётся ясным для обычного читателя.
