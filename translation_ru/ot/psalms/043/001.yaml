  text: Оправдай меня[a], Боже, и веди мою тяжбу против неверного народа; избавь меня от лживого и несправедливого человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Рассуди меня». Еврейское выражение означает просьбу вынести судебное решение, подтверждающее правоту молящегося. «Неверного народа» также можно передать: «неблагочестивого народа» или «народа, не хранящего верности».'
