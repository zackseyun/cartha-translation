lexical_decisions:
- source_word: שְׁלַח
  choice: Пошли
  rationale: Повелительная форма глагола שלח. «Пошли» естественно передаёт молитвенную просьбу и движение света и истины от Бога к молящемуся.
- source_word: אוֹרְךָ
  choice: свет Твой
  rationale: Сохраняет конкретный поэтический образ אוֹר, не сводя его смысл к пояснительным словам «водительство» или «спасение».
- source_word: אֲמִתְּךָ
  choice: истину Твою
  rationale: Прямо передаёт אֱמֶת и сохраняет широту значения; возможный оттенок верности отмечен в сноске.
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение подчёркивает, что именно Божий свет и Божья истина выступают как ведущие; это также сохраняет олицетворение.
- source_word: יַנְחוּנִי
  choice: пусть они ведут меня
  rationale: Юссивное значение имперфекта после повеления естественно передано конструкцией «пусть… ведут».
- source_word: יְבִיאוּנִי
  choice: пусть приведут меня
  rationale: Передаёт каузативное движение к месту Божьего присутствия и параллельную юссивную силу формы.
- source_word: הַר קָדְשְׁךָ
  choice: на святую гору Твою
  rationale: Естественное русское соответствие конструкции «гора святости Твоей»; вероятное указание на Сион не конкретизируется сверх текста.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: в обители Твои
  rationale: «Обители» сохраняет множественное число и сакрально-поэтический оттенок, оставаясь понятным в современном литературном русском.
theological_decisions:
- issue: Считать ли «свет» и «истину» отвлечёнными качествами или олицетворёнными проводниками
  choice: 'Сохранить олицетворение и согласовать с ними глаголы во множественном числе: «пусть они ведут… пусть приведут».'
  alternative: Передать смысл пояснительно как просьбу о Божьем водительстве.
  rationale: В еврейском тексте имеются самостоятельное местоимение и глаголы множественного числа, относящиеся к свету и истине; буквенный образ и поэтическое напряжение следует сохранить.
- issue: Следует ли прямо назвать Сион и храм
  choice: Оставить «святую гору» и «обители» без уточнений.
  alternative: Перевести как «Сион» и «святилище/храм».
  rationale: Хотя контекст, вероятно, указывает на Сион и святилище, исходный текст использует более широкие поэтические выражения, которые не следует без необходимости сужать.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным псалмопевческим звучанием. Постпозиция притяжательного местоимения («свет Твой», «истину Твою») поддерживает поэтический регистр без тяжёлой архаизации.
