base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: ru
  text: Почему ты поникла, душа моя, и почему волнуешься во мне? Надейся на Бога, ибо я ещё буду славить Его — Спасителя моего и Бога моего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «спасения лица моего и Бога моего». Это трудное выражение; оно может говорить о Боге как о Том, Чьё спасение вновь поднимает поникшее лицо псалмопевца. Возможен также перевод: «помощь лица моего и Бог мой».'
    reason: Сохранение буквальной образности, множественного числа еврейского слова «спасения» и синтаксической неоднозначности масоретского текста.
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: ты поникла
  rationale: Глагол описывает склонённость, подавленность. «Поникла» естественно передаёт как образ опущенности, так и внутреннее уныние.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: В контексте самообращения נֶפֶשׁ обозначает внутреннее «я»; традиционное «душа моя» понятно современному читателю и уместно в поэтическом регистре.
- source_word: תֶּהֱמִי
  choice: волнуешься
  rationale: Слово передаёт внутренний шум, смятение или беспокойство. «Волнуешься» сохраняет образ внутреннего движения без излишнего истолкования.
- source_word: עָלָי
  choice: во мне
  rationale: Буквально «на мне/надо мной», но при обращении к собственной душе русское «во мне» естественно выражает внутреннее смятение.
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: надейся на Бога
  rationale: Императив призывает к терпеливому, уверенному ожиданию Бога; данное сочетание естественно и точно по-русски.
- source_word: כִּי עוֹד אוֹדֶנּוּ
  choice: ибо я ещё буду славить Его
  rationale: עוֹד указывает на будущую хвалу вопреки нынешнему унынию, а ידה в богослужебном контексте уместно передать как «славить».
- source_word: יְשׁוּעוֹת פָּנַי
  choice: спасение лица моего
  rationale: Формулировка сохраняет необычный образ масоретского текста — буквально «спасения лица моего» — и не сводит его безоговорочно к одному толкованию.
- source_word: וֵאלֹהָי
  choice: и Бога моего
  rationale: Сохранены союз и структура еврейского окончания, где выражение тесно связано с предшествующим определением Бога.
theological_decisions:
- issue: Связь выражений יְשׁוּעוֹת פָּנַי и וֵאלֹהָי
  choice: «спасение лица моего и Бога моего»
  alternative: «Того, Кто спасает меня, Бога моего» / «спасение моё и Бога моего»
  rationale: Масоретский текст допускает трудное, напряжённое сочетание и буквально говорит о «спасениях лица моего». Основной текст сохраняет эту образность, а сноска объясняет вероятный смысл, не превращая его в единственно возможное прочтение.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Синтаксис самообращения сохранён; устаревшие «лик», «возмущаешься» и тяжёлое «уповай» не использованы. Заглавная буква в местоимении «Его» соответствует принятому благоговейному издательскому регистру.
