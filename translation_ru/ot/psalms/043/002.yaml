base_translation:
  language: en
  yaml_path: translation/ot/psalms/043/002.yaml
  text: For you are the God of my refuge[b][a]; why have you rejected me? Why do I go about mourning under the oppression of the enemy?
translation:
  language: ru
  text: Ведь Ты — Бог, у Которого я нахожу убежище.[a] Почему Ты отверг меня? Почему я хожу в скорби под гнётом врага?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог моей твердыни» или «Бог моей силы». Еврейское слово может обозначать убежище, укреплённое место или силу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Почему я хожу помрачённый из-за притеснения врага?» Еврейский текст буквально говорит о помрачённом состоянии — образе скорби.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание просьбы и одновременно подчёркивает резкий контраст между исповеданием Бога как защиты и переживанием отверженности.
- source_word: אֱלֹהֵי מָעוּזִּי
  choice: Бог, моя твердыня
  rationale: מָעוֹז обозначает защищённое место, оплот или источник силы. «Твердыня» сохраняет образ надёжной защиты и естественно передаёт конструкцию принадлежности в русском поэтическом тексте.
- source_word: לָמָה
  choice: почему
  rationale: Повтор вопросительного слова сохранён ради ритма и силы прямой жалобы.
- source_word: זְנַחְתָּנִי
  choice: Ты отверг меня
  rationale: Глагол זנח означает отвергнуть или отринуть; «отверг» ясно и сильно передаёт жалобу, не усиливая её до однозначного полного оставления.
- source_word: קֹדֵר
  choice: в скорби
  rationale: Буквально слово описывает помрачённое, мрачное состояние и в данном контексте выражает скорбь. Русское «в скорби» естественно передаёт идиоматический смысл.
- source_word: אֶתְהַלֵּךְ
  choice: я хожу
  rationale: Форма глагола передаёт продолжающееся движение или образ жизни; «хожу» сохраняет конкретный образ и длительность состояния.
- source_word: בְּלַחַץ
  choice: под гнётом
  rationale: לַחַץ означает притеснение, давление. Выражение «под гнётом» естественно передаёт состояние угнетённости.
- source_word: אוֹיֵב
  choice: врага
  rationale: Единственное число обозначает известного противника либо собирательный образ враждебной силы; определённость естественно выражается контекстом.
theological_decisions:
- issue: Речь о Божьем отвержении в плаче
  choice: 'Сохранить прямой вопрос: «Почему Ты отверг меня?»'
  alternative: «Почему Ты оставил меня?» или смягчённое описание ощущения удалённости Бога
  rationale: Еврейский текст выражает острую жалобу при одновременном исповедании Бога как твердыни. Перевод сохраняет эту богословскую напряжённость и не объясняет её за псалмопевца.
translation_notes:
  register: Современный литературный русский с достоинством поэтического плача. Обращение к Богу оформлено с прописной буквы. Лексика ясная, без излишней архаизации; «твердыня» оставлена как ёмкий и понятный библейско-поэтический образ.
