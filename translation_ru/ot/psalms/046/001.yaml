base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/001.yaml
  text: God is our refuge and strength[b][a], a very present help in troubles.
translation:
  language: ru
  text: Бог — наше прибежище и сила, весьма доступная помощь в бедах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «помощь в бедах; Он чрезвычайно обретается (как помощь)». Еврейское выражение сжато и необычно; оно может означать, что Бог оказывается особенно доступной, действенной помощью в бедах.'
    reason: Лексическая и синтаксическая неоднозначность выражения נִמְצָא מְאֹד.
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Хотя форма существительного морфологически множественная, здесь оно обозначает единого Бога Израиля и имеет значение единственного числа.
- source_word: לָנוּ
  choice: наше
  rationale: 'Буквально «для нас»; при именной части сказуемого русское притяжательное местоимение естественно передаёт смысл принадлежности: «наше прибежище».'
- source_word: מַחֲסֶה
  choice: прибежище
  rationale: Слово обозначает место защиты и безопасности; «прибежище» сохраняет поэтическое достоинство и ясно современному читателю.
- source_word: וָעֹז
  choice: и сила
  rationale: עֹז означает силу или мощь; абстрактное «сила» непосредственно передаёт еврейскую конструкцию и естественно сочетается с «прибежищем».
- source_word: עֶזְרָה
  choice: помощь
  rationale: Прямое соответствие существительному со значением помощи или поддержки.
- source_word: בְצָרוֹת
  choice: в бедах
  rationale: Сохранено множественное число еврейского слова, обозначающего бедствия, тесные обстоятельства и времена нужды.
- source_word: נִמְצָא מְאֹד
  choice: всегда доступная
  rationale: Буквальное сочетание «найден чрезвычайно» в данном контексте выражает, что Бога можно несомненно и без промедления обрести как помощь. Русское «всегда доступная» естественно передаёт эту доступность, не сводя смысл только к пространственной близости.
theological_decisions:
- issue: Сжатая структура заключительной части стиха
  choice: «всегда доступная помощь в бедах»
  alternative: «помощь в бедах, найденная чрезвычайно»; «великая помощь в бедах»
  rationale: Еврейское выражение допускает оттенки как доступности, так и доказанной действенности помощи. Основной текст передаёт наиболее вероятный идиоматический смысл, а примечание сохраняет необычную буквальную форму и альтернативный оттенок, не превращая стих в конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим, достойным звучанием. Тире ясно оформляет именное сказуемое; «прибежище» сохраняет привычный псалмический образ, а заключительная фраза остаётся понятной обычному читателю.
