id: PSA.46.9
reference: Psalms 46:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מַשְׁבִּ֥ית מִלְחָמוֹת֮ עַד קְצֵ֪ה הָ֫/אָ֥רֶץ קֶ֣שֶׁת יְ֭שַׁבֵּר וְ/קִצֵּ֣ץ חֲנִ֑ית עֲ֝גָל֗וֹת יִשְׂרֹ֥ף בָּ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/009.yaml
  text: He makes wars cease to the end of the earth[a]; he breaks the bow and cuts the spear in two[b]; he burns the wagons with fire.
translation:
  language: ru
  text: Он прекращает войны до самых краёв земли, ломает лук, разрубает копьё[a] и сжигает огнём повозки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отсекает копьё».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «колесницы». Еврейское слово обычно означает «повозки» или «телеги», однако из-за военного контекста его иногда переводят как «колесницы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּית מִלְחָמוֹת
  choice: прекращает войны
  rationale: Причастие породы хифиль от שׁבת выражает причинение прекращения; по-русски «прекращает войны» естественно и точно передаёт этот смысл.
- source_word: עַד קְצֵה הָאָרֶץ
  choice: до самых краёв земли
  rationale: 'Буквально: «до края земли». Идиоматическое множественное число «до самых краёв земли» передаёт всеобщий охват и сохраняет пространственный образ.'
- source_word: קֶשֶׁת יְשַׁבֵּר
  choice: ломает лук
  rationale: Единственное число имеет обобщающий смысл, а порода пиэль глагола שׁבר обозначает решительное разрушение оружия.
- source_word: וְקִצֵּץ חֲנִית
  choice: разрубает копьё
  rationale: קצץ означает отсекать или разрубать. «Разрубает копьё» естественно описывает уничтожение оружия, не добавляя отсутствующего в еврейском тексте точного числа частей.
- source_word: עֲגָלוֹת
  choice: повозки
  rationale: Обычное значение существительного — «повозки, телеги»; это не стандартное еврейское слово для колесниц. Военный контекст позволяет понимать военные транспортные повозки.
- source_word: יִשְׂרֹף בָּאֵשׁ
  choice: сжигает огнём
  rationale: Передаёт инструментальное значение предлога ב и звучит естественно в современном русском языке.
theological_decisions:
- issue: Традиционное понимание עֲגָלוֹת в военном контексте
  choice: повозки
  alternative: колесницы
  rationale: Основной текст следует обычному лексическому значению еврейского слова, а традиционное контекстуальное толкование «колесницы» сохранено в сноске. Доктринального различия между вариантами нет.
- issue: Степень конкретизации действия קצץ над копьём
  choice: разрубает копьё
  alternative: отсекает копьё
  rationale: Еврейский глагол допускает значения «отсекать» и «разрубать», но не уточняет, что копьё разделено ровно на две части. Выбран естественный русский оборот без лишней конкретизации.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным ритмом псалма. Однородные глаголы объединены в одно плавное предложение; сохранены конкретные образы уничтожаемого оружия и военного транспорта.
