lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов слово обычно обозначает человека, руководящего музыкальным исполнением; эта формулировка ясна современному читателю и сохраняет адресный оттенок предлога לְ.
- source_word: לִבְנֵי קֹרַח
  choice: Сынов Кореевых
  rationale: Предлог לְ в надписании может указывать на авторство, принадлежность или предназначение для исполнения; краткая родительная конструкция сохраняет эту неоднозначность.
- source_word: עַל
  choice: На
  rationale: В музыкальных надписаниях עַל может вводить указание на мелодию, лад или способ исполнения; традиционная краткая формула не уточняет неизвестную функцию.
- source_word: עֲלָמוֹת
  choice: Аламот
  rationale: 'Значение технического термина неясно: возможно, это название мелодии либо указание на девичьи или высокие голоса. Транслитерация не снимает неопределённость искусственно.'
- source_word: שִׁיר
  choice: Песнь
  rationale: Слово обозначает жанр произведения; «песнь» естественно и уместно в русском библейском регистре.
