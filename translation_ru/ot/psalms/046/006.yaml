  text: הָמ֣וּ ג֭וֹיִם מָ֣טוּ מַמְלָכ֑וֹת נָתַ֥ן בְּ֝/קוֹל֗/וֹ תָּמ֥וּג אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/006.yaml
  text: Nations raged[a], kingdoms tottered; he uttered his voice, the earth melted.
translation:
  language: ru
  text: Народы бушевали[a], царства колебались; Он издал голос — земля растаяла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Народы были в смятении».'
    reason: 'Лексическая альтернатива: הָמוּ может подчёркивать как яростное бушевание, так и шумное смятение.'
lexical_decisions:
- source_word: הָמוּ
  choice: бушевали
  rationale: Глагол передаёт шумное волнение и мятежное движение. «Бушевали» естественно и поэтично сохраняет оба оттенка.
- source_word: גּוֹיִם
  choice: народы
  rationale: В параллели с царствами речь идёт о политических сообществах; «народы» не привносит отсутствующего здесь противопоставления иудеев и язычников.
- source_word: מָטוּ
  choice: шатались
  rationale: Форма описывает утрату устойчивости, но не обязательно завершившееся падение. «Шатались» сохраняет этот образ и аспект.
- source_word: מַמְלָכוֹת
  choice: царства
  rationale: Прямое и естественное обозначение политических владений, соответствующее поэтическому параллелизму.
- source_word: נָתַן בְּקוֹלוֹ
  choice: Он подал голос
  rationale: Буквально «дал Свой голос». Русское выражение «подал голос» сохраняет лаконичность и смысл властного звучания, не сводя его непременно к повышению громкости.
- source_word: תָּמוּג
  choice: растаяла
  rationale: Глагол выражает таяние, растворение или утрату твёрдости. «Растаяла» прямо и образно передаёт реакцию земли на Божий голос.
- source_word: אָרֶץ
  choice: земля
  rationale: Универсальный масштаб стиха и псалма указывает скорее на всю землю, чем на отдельную страну.
theological_decisions:
- issue: Неявное подлежащее נָתַן
  choice: Он, то есть Бог по контексту
  alternative: Явно назвать «Господь»
  rationale: В еврейском тексте стоит невыраженное подлежащее мужского рода единственного числа. Местоимение сохраняет лаконичность оригинала и позволяет контексту определить Бога как действующее лицо, не добавляя в этот стих отсутствующее в нём Божье имя.
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической сжатостью. Точка с запятой сохраняет параллелизм первых двух строк, тире подчёркивает немедленное действие Божьего голоса.
