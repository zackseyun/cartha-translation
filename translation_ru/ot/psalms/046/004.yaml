lexical_decisions:
- source_word: נָהָר
  choice: Река
  rationale: Неопределённая форма существительного и безглагольное поэтическое начало переданы прямо, без добавления «есть»; в русском такое назывное начало естественно.
- source_word: פְּלָגָיו
  choice: её потоки
  rationale: Суффикс 3-го лица мужского рода указывает на реку; «потоки» естественно передаёт ответвляющиеся водные течения.
- source_word: יְשַׂמְּחוּ
  choice: радуют
  rationale: Форма piel выражает причинение радости; русский переходный глагол кратко и естественно сохраняет эту силу.
- source_word: עִיר אֱלֹהִים
  choice: город Бога
  rationale: Прямо передаёт сопряжённую конструкцию, сохраняя ясность и торжественность.
- source_word: קְדֹשׁ
  choice: святые
  rationale: Прилагательное понято как определение к следующему существительному во множественном числе; согласование по числу необходимо в русском.
- source_word: מִשְׁכְּנֵי
  choice: обители
  rationale: Сохранено множественное число еврейской формы. «Обители» звучит поэтично и достойно, не сводя выражение к одной святыне.
- source_word: עֶלְיוֹן
  choice: Всевышнего
  rationale: Устоявшееся русское наименование Бога, точно передающее титул «Наивысший».
theological_decisions:
- issue: Отношение выражения «святые обители Всевышнего» к «городу Бога»
  choice: Сохранить приложение без добавления поясняющей связки
  alternative: «город Бога, где свята обитель Всевышнего»
  rationale: Еврейская поэзия допускает сжатую конструкцию и некоторую синтаксическую неоднозначность; добавление «где» и единственного числа сильнее истолковало бы связь.
- issue: Число מִשְׁכְּנֵי
  choice: 'Сохранить множественное число: «обители»'
  alternative: «обитель» или «святилище»
  rationale: Исходная форма множественная. Хотя она может иметь собирательный или усилительный смысл, перевод не должен без необходимости устранять эту особенность.
translation_notes:
  register: Современный литературный русский с поэтической сжатостью и умеренно возвышенной библейской лексикой. Тире сохраняет резкое безглагольное начало; множественное «обители» следует форме оригинала.
