  yaml_path: translation/ot/psalms/046/002.yaml
  text: Therefore we will not fear though the earth changes[b][a], though the mountains slip into the heart of the seas.
translation:
  language: ru
  text: Поэтому мы не убоимся, даже если земля изменится[a] и горы поколеблются в сердце морей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда земля изменится»; возможно также: «когда земля будет изменена». Еврейский глагол может обозначать изменение или замену; здесь контекст рисует разрушение устойчивого миропорядка.'
    reason: lexical_alternative
  - marker: b
