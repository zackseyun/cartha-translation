lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего исповедания Бога как прибежища и силы и естественно связывает стихи.
- source_word: לֹא נִירָא
  choice: мы не убоимся
  rationale: Форма 1-го лица множественного числа выражает уверенность и решимость. «Не убоимся» сохраняет возвышенный поэтический регистр, оставаясь понятным современному читателю.
- source_word: בְּהָמִיר
  choice: даже если … изменится
  rationale: Инфинитив с предлогом ב обозначает сопутствующее обстоятельство. Глагол מור может означать изменение или замену; прямое «изменится» сохраняет широту значения, а контекст указывает на катастрофическую утрату устойчивости.
- source_word: אָרֶץ
  choice: земля
  rationale: Космический образ гор и морей указывает здесь скорее на землю как мир, а не на отдельную страну или территорию.
- source_word: וּבְמוֹט
  choice: и … сдвинутся
  rationale: מוט обозначает утрату устойчивости, колебание или смещение. В сочетании с горами среди морей «сдвинутся» естественно передаёт их перемещение с привычного места, не устраняя оттенка колебания.
- source_word: הָרִים
  choice: горы
  rationale: Прямое соответствие, сохраняющее космическую образность стиха.
- source_word: בְּלֵב
  choice: в сердце
  rationale: Сохраняет буквальную и яркую пространственную метафору еврейского текста; по смыслу речь идёт о внутренней части, середине морей.
- source_word: יַמִּים
  choice: морей
  rationale: Сохранено явно выраженное в еврейском тексте множественное число.
