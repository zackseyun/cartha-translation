  text: יְהוָ֣ה צְבָא֣וֹת עִמָּ֑/נוּ מִשְׂגָּֽב לָ֝/נוּ אֱלֹהֵ֖י יַעֲקֹ֣ב סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/011.yaml
  text: Yahweh of Armies is with us[a]; the God of Jacob is a stronghold for us[c][b]. Selah
translation:
  language: ru
  text: Яхве Воинств с нами[a]; Бог Иакова — крепость для нас[b]. Села[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь воинств с нами». Еврейское צְבָאוֹת обозначает воинства, то есть войска или организованные силы, нередко с указанием на небесное воинство.'
    reason: lexical_alternative
  - marker: b
    text: «Крепость» можно также перевести как «убежище», «неприступная твердыня» или «крепость на высоте». Еврейское מִשְׂגָּב обозначает защищённое, возвышенное место.
    reason: lexical_alternative
  - marker: c
    text: «Села» — еврейский богослужебный или музыкальный термин, точное значение которого неизвестно; поэтому он оставлен без перевода.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет значение множества организованных сил — земных или небесных войск — и устойчиво сочетается с именем Яхве.
- source_word: עִמָּנוּ
  choice: с нами
  rationale: Естественно передаёт предлог עִם с суффиксом первого лица множественного числа; связка в русском настоящем времени не требуется.
- source_word: מִשְׂגָּב
  choice: крепость
  rationale: Передаёт образ защищённого, укреплённого и возвышенного убежища, оставаясь понятным современному читателю.
- source_word: לָנוּ
  choice: для нас
  rationale: 'Передаёт значение пользы и защиты: Бог служит крепостью для своего народа.'
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Бог Иакова
  rationale: Сохраняет форму еврейского сочетания и его заветную историческую отсылку.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение литургического или музыкального термина неизвестно, поэтому он оставлен в транслитерации.
theological_decisions:
- issue: Передача сочетания יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Господь воинств
  rationale: Выбранный вариант сохраняет непосредственно употреблённое личное имя и военный образ צְבָאוֹת, не подменяя имя титулом.
- issue: Смысл מִשְׂגָּב
  choice: крепость для нас
  alternative: убежище для нас; неприступная твердыня наша
  rationale: «Крепость» сохраняет метафору надёжной укреплённой защиты, а примечание удерживает возможные оттенки возвышенного убежища.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным параллелизмом оригинала. Сохранён именной строй двух еврейских предложений; порядок частей и повтор «для нас / с нами» переданы без стилистического усложнения.
