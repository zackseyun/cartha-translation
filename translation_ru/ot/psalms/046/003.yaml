- source_word: יֶהֱמוּ
  choice: ревут
  rationale: Глагол המה передаёт громкий, бурный шум; «ревут» естественно и образно описывает бушующие воды.
- source_word: יֶחְמְרוּ
  choice: пенятся
  rationale: В контексте вод форма от חמר, вероятно, описывает бурление, помутнение или вспенивание; «пенятся» сохраняет зримый образ и хорошо сочетается с «ревут».
- source_word: מֵימָיו
  choice: его воды
  rationale: Местоименный суффикс 3-го лица мужского рода единственного числа сохранён; его ближайший образный референт — море из предыдущего стиха.
- source_word: יִרְעֲשׁוּ
  choice: содрогаются
  rationale: רעשׁ обозначает сильное сотрясение; «содрогаются» выразительно и естественно употребляется по отношению к горам.
- source_word: הָרִים
  choice: горы
  rationale: Определённость формы передаётся контекстом поэтической картины; отдельное указательное уточнение в русском не требуется.
- source_word: בְּגַאֲוָתוֹ
  choice: от его волнения
  rationale: גאוה может означать возвышение, гордость, величие или вздымание. В контексте бурных вод «волнение» передаёт физическое движение и допускает образ мощного вздымающегося моря.
- source_word: סֶלָה
  choice: Села
  rationale: Неясный литургический или музыкальный термин передан традиционной транслитерацией без попытки установить его точное значение.
