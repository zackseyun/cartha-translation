  text: הַרְפּ֣וּ וּ֭/דְעוּ כִּי אָנֹכִ֣י אֱלֹהִ֑ים אָר֥וּם בַּ֝/גּוֹיִ֗ם אָר֥וּם בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/046/010.yaml
  text: Be still[a], and know that I am God. I will be exalted among the nations[c][b]; I will be exalted in the earth.
translation:
  language: ru
  text: Остановитесь[a] и знайте, что Я — Бог. Я буду превознесён[b] среди народов, буду превознесён на земле[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Перестаньте», «ослабьте усилия» или «отпустите». Еврейский глагол может означать прекратить действие, ослабить напряжение или выпустить что-либо из рук.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я превознесён». Еврейская форма в данном контексте может быть понята как настоящее или будущее время.'
    reason: alternative_reading
  - marker: c
    text: Еврейское слово может также означать «земля» в смысле страны, но параллель с народами указывает здесь, вероятнее всего, на всю землю.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְפּוּ
  choice: Остановитесь
  rationale: Повелительная форма множественного числа от רפה передаёт прекращение действия, ослабление усилий или отпускание. «Остановитесь» естественно звучит по-русски и в контексте псалма выражает призыв прекратить человеческие усилия и признать Божье владычество, не сводя смысл лишь к внутреннему молчанию.
- source_word: וּדְעוּ
  choice: и знайте
  rationale: ידע прямо означает «знать», а в данном контексте также допускает оттенок признания. «Знайте» сохраняет краткость и силу повеления.
- source_word: כִּי
  choice: что
  rationale: Здесь כִּי вводит содержание того, что надлежит знать; русский союз «что» естественно передаёт эту функцию.
- source_word: אָנֹכִי אֱלֹהִים
  choice: Я — Бог
  rationale: Самостоятельное местоимение אָנֹכִי придаёт утверждению выразительность. В русском она естественно передаётся конструкцией с тире без добавления толковательного усилителя.
- source_word: אָרוּם
  choice: Я буду превознесён
  rationale: Имперфект Qal от רום может иметь настоящее или будущее значение. Будущее время хорошо передаёт уверенность в признании Божьего верховенства; страдательная форма «превознесён» уместна в поэтической речи и сохраняет богословский смысл.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם обозначает народы как коллективные общности. «Среди народов» естественно передаёт предлог ב и всемирный охват утверждения.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: אֶרֶץ может означать как отдельную землю или страну, так и всю землю. Параллель с «среди народов» поддерживает всемирный смысл; по-русски нормативно «на земле».
theological_decisions:
- issue: Смысл повеления הַרְפּוּ
  choice: 'Призыв прекратить усилия и признать Божье владычество: «Остановитесь»'
  alternative: «Умолкните», «перестаньте» или «отпустите»; возможны более узкие толкования как прекращение войны либо внутренняя созерцательная тишина
  rationale: Глагол означает ослабить, отпустить или прекратить. Контекст потрясений и мятущихся народов указывает на прекращение человеческого противления и самоуверенной деятельности, однако формулировка не исключает внутреннего успокоения перед Богом.
- issue: Временное значение אָרוּם
  choice: 'Будущее: «буду превознесён»'
  alternative: 'Настоящее: «Я превознесён»'
  rationale: Еврейский имперфект допускает контекстуально настоящее или будущее прочтение. Будущее выражает несомненное торжество Божьего верховенства, а сноска сохраняет грамматическую неоднозначность.
- issue: Масштаб בָּאָרֶץ
  choice: 'Всемирный смысл: «на земле»'
  alternative: 'Локальный смысл: «в стране» или «на этой земле»'
  rationale: Существительное допускает оба значения, но параллелизм с народами и широкий горизонт псалма делают всемирное прочтение более вероятным, не устраняя лексической альтернативы.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Заглавное «Я» употреблено как графическое обозначение речи Бога. «Остановитесь» выбрано вместо традиционного «умолкните», поскольку исходный глагол говорит прежде всего о прекращении или ослаблении действия, а не только об отсутствии речи. Повтор «буду превознесён» сохранён как значимый параллелизм еврейского стиха.
