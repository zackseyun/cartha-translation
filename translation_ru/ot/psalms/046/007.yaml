  yaml_path: translation/ot/psalms/046/007.yaml
  text: Yahweh of Armies is with us; the God of Jacob is a stronghold for us[a]. Selah
translation:
  language: ru
  text: Яхве Воинств с нами; Бог Иакова — наша крепость.[a] Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве Воинств с нами; Бог Иакова — неприступное убежище для нас». Традиционно: «Господь Саваоф с нами».'
    reason: Сохраняет возможную более буквальную передачу לָנוּ и смысловой диапазон מִשְׂגָּב, а также отмечает традиционную форму божественного титула.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет традиционную и ёмкую передачу множественного числа, которое может охватывать небесные и земные силы, не сужая значение до одних человеческих армий.
- source_word: עִמָּנוּ
  choice: с нами
  rationale: Прямо и естественно выражает присутствие, солидарность и защиту.
- source_word: מִשְׂגָּב
  choice: крепость
  rationale: Передаёт образ защищённого, неприступного убежища; в русском языке естественно сочетается с конструкцией «наша крепость».
- source_word: לָנוּ
  choice: наша
  rationale: Притяжательная конструкция естественно передаёт отношение и значение пользы, выраженные ל с суффиксом первого лица множественного числа.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Бог Иакова
  rationale: Прямая передача сопряжённой конструкции с сохранением заветной связи с патриархом Иаковом.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неясно, поэтому он сохраняется в транслитерации без толкования.
theological_decisions:
- issue: Передача божественного имени и титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Господь воинств
  rationale: «Яхве» сохраняет личное заветное имя, а «Воинств» не ограничивает неоднозначный титул только человеческими армиями и удерживает его широкий военный и космический оттенок.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической строки. Порядок частей и параллелизм еврейского текста сохранены; «Села» оставлено без истолкования.
