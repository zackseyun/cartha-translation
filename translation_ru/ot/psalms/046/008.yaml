lexical_decisions:
- source_word: לְכוּ חֲזוּ
  choice: Придите и посмотрите
  rationale: Два повелительных глагола переданы естественным русским призывом; חזוּ здесь означает зрительно убедиться, увидеть.
- source_word: מִפְעֲלוֹת
  choice: дела
  rationale: Обозначает совершённые действия или деяния; «дела» ясно и естественно в данном контексте.
- source_word: יְהוָה
  choice: ГОСПОДА
  rationale: Тетраграмматон передан традиционным русским заместительным титулом прописными буквами.
- source_word: שָׂם
  choice: произвёл
  rationale: Буквально глагол может значить «положил, установил, сделал»; в сочетании с «опустошениями» русское «произвёл» естественно выражает причинение результата, не уточняя способ.
- source_word: שַׁמּוֹת
  choice: опустошения
  rationale: Сохранён сильный образ разорения и запустения, а также множественное число еврейского текста.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: Предлог и существительное допускают значение всей земли или страны; русская формулировка сохраняет эту контекстуальную широту.
theological_decisions:
- issue: Бог представлен совершающим опустошения
  choice: какие опустошения Он произвёл
  alternative: которые Он прекратил / как Он прекращает войны
  rationale: 'Синтаксис непосредственно связывает אֲשֶׁר שָׂם с שַׁמּוֹת: ГОСПОДЬ произвёл или установил опустошения. Перевод не смягчает богословское напряжение и не переносит содержание следующего стиха в этот.'
