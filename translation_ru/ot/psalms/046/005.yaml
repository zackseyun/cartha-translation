lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В контексте псалма форма אֱלֹהִים обозначает единого Бога Израиля, поэтому требуется единственное число.
- source_word: בְּקִרְבָּהּ
  choice: среди неё
  rationale: Выражение указывает на присутствие Бога внутри города, в самой его среде. «Среди неё» естественно по-русски и сохраняет местоимение женского рода.
- source_word: בַּל
  choice: не
  rationale: Поэтическая отрицательная частица прямо отрицает последующий глагол; простое «не» передаёт смысл без добавления усиления.
- source_word: תִּמּוֹט
  choice: поколеблется
  rationale: Глагол מוט в нифале означает утратить устойчивость, быть поколебленным или пошатнуться. «Не поколеблется» естественно передаёт образ незыблемости.
- source_word: יַעְזְרֶהָ
  choice: поможет ей
  rationale: Имперфект выражает ожидаемое или несомненное действие Бога; будущее время кратко и точно передаёт эту мысль.
- source_word: לִפְנוֹת בֹּקֶר
  choice: с наступлением утра
  rationale: Оборот обозначает поворот или наступление утра, то есть рассвет. Выбранная формулировка сохраняет образ прихода утра и звучит естественно в современном русском языке.
theological_decisions:
- issue: К кому относятся местоимения женского рода
  choice: Местоимения «неё», «она» и «ей» относятся к Божьему городу, упомянутому в ближайшем контексте.
  alternative: Они могут шире пониматься как указание на общину Божьего народа.
  rationale: Женский род в еврейском тексте непосредственно соотносится с городом из предыдущего стиха. Перевод сохраняет местоимения и не заменяет их истолковывающим существительным.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным псалмическим ритмом. Сохранены женские местоимения и образ устойчивости города; буквальный оттенок заключительного оборота вынесен в примечание.
