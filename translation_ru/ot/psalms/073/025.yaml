  text: מִי לִ֥/י בַ/שָּׁמָ֑יִם וְ֝/עִמְּ/ךָ֗ לֹא חָפַ֥צְתִּי בָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/025.yaml
  text: Whom have I in heaven but you? And besides you[a], I desire nothing on earth.
translation:
  language: ru
  text: Кто у меня на небесах, кроме тебя? И кроме тебя[a] ничего не желаю на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «И с тобой я не желал [ничего] на земле». Еврейская строка эллиптична; по смыслу псалмопевец не желает на земле ничего помимо Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי לִי
  choice: Кто у меня
  rationale: 'Вопросительное местоимение и предложное сочетание выражают отношение принадлежности или опоры: «кто есть у меня». По-русски естественно и ёмко: «кто у меня».'
- source_word: בַשָּׁמָיִם
  choice: на небесах
  rationale: Форма множественного числа обозначает небесную сферу; «на небесах» сохраняет поэтический регистр и противопоставление земле.
- source_word: וְעִמְּךָ
  choice: И кроме тебя
  rationale: 'Буквально: «и с тобой». В эллиптическом параллелизме сочетание выражает исключительность: рядом с Богом псалмопевец не желает ничего другого. Более буквальная конструкция сохранена в сноске.'
- source_word: לֹא חָפַצְתִּי
  choice: ничего не желаю
  rationale: Глагол может означать желание, расположение или удовольствие. Здесь «желаю» естественно передаёт устойчивую направленность воли; перфект в контексте выражает сложившееся нынешнее состояние. Отсутствующий объект восполнен словом «ничего».
- source_word: בָאָרֶץ
  choice: на земле
  rationale: Передаёт земную сферу в прямом противопоставлении небесам.
theological_decisions:
- issue: Смысл второго полустишия
  choice: Исключительное желание Бога превыше всего земного
  alternative: «И с тобой я не желал [ничего] на земле»
  rationale: Еврейская строка эллиптична. Основной текст ясно передаёт исключительную ценность Бога для псалмопевца, не превращая высказывание в более широкое метафизическое утверждение; буквальная синтаксическая возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим строем. Местоимение «тебя» дано со строчной буквы согласно общим нормам современной русской орфографии; обращение остаётся ясным из контекста.
