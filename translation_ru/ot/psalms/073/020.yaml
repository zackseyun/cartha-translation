  text: Как сон после пробуждения, Господи, когда Ты пробудишься[a], Ты презришь их образ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, менее вероятно: «в городе Ты презришь их образ». Еврейские согласные допускают такое прочтение, но контекст убедительно поддерживает смысл «когда Ты пробудишься».'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּחֲלוֹם
  choice: Как сон
  rationale: Префикс כַּ־ выражает сравнение, а חֲלוֹם означает «сон, сновидение». Краткое «как сон» естественно передаёт поэтический образ.
- source_word: מֵהָקִיץ
  choice: при пробуждении
  rationale: 'Форма от קיץ/יקץ «пробуждаться» с предлогом מ־ имеет здесь временной смысл: сон исчезает при пробуждении. Такой перевод естественен по-русски и сохраняет основу сравнения.'
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Божественный титул אֲדֹנָי употреблён как обращение; русский звательный эквивалент «Господи» точно и естественно передаёт эту функцию.
- source_word: בָּעִיר
  choice: когда Ты пробудишься
  rationale: Контекст и параллель с пробуждением от сна поддерживают глагольное понимание от עור «пробуждаться, подниматься». Перевод сохраняет намеренное повторение мотива пробуждения.
- source_word: צַלְמָם
  choice: их образ
  rationale: צֶלֶם означает «образ, подобие, облик». «Их образ» сохраняет лексическую широту и не решает однозначно, имеется ли в виду внешний облик, видимость или призрачность их благополучия.
- source_word: תִּבְזֶה
  choice: Ты презришь
  rationale: Глагол בזה означает «презирать, считать ничтожным». Имперфект в данном контексте естественно передаётся будущим временем.
theological_decisions:
- issue: Толкование בָּעִיר
  choice: 'глагольное: «когда Ты пробудишься»'
  alternative: 'локативное существительное: «в городе»'
  rationale: Непосредственное сравнение со сном при пробуждении и поэтический параллелизм убедительно поддерживают глагольное прочтение. Альтернатива не устранена, а вынесена в сноску.
- issue: Смысл צַלְמָם
  choice: «их образ»
  alternative: «их призрак» или «их облик»
  rationale: 'Более буквальное «образ» сохраняет неоднозначность: стих может говорить об их видимом облике, мнимой значительности или преходящей, подобной сну реальности.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Повтор «пробуждении — пробудишься» сохранён как значимый параллелизм оригинала; местоимение «Ты» написано с прописной буквы в обращении к Богу.
