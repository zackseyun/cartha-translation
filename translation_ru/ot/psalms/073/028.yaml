lexical_decisions:
- source_word: וַאֲנִי
  choice: А мне
  rationale: Союз и самостоятельное местоимение подчёркивают противопоставление участи нечестивых положению псалмопевца; по-русски это естественно передаётся конструкцией «А мне».
- source_word: קִרֲבַת אֱלֹהִים
  choice: близость Бога
  rationale: 'Сохраняет именную форму еврейского выражения и его смысловую открытость: речь может идти как о Божьей близости, так и о близости человека к Богу.'
- source_word: לִי טוֹב
  choice: мне благо
  rationale: Кратко и достойно передаёт значение пользы и подлинного блага для говорящего, оставаясь близким к структуре оригинала.
- source_word: שַׁתִּי
  choice: я сделал
  rationale: В сочетании с «прибежищем» выражает сознательный выбор и доверие; это естественный русский эквивалент «положил, поставил» в данном обороте.
- source_word: בַּאדֹנָי יְהוִה
  choice: Владыку Яхве
  rationale: Передаёт сочетание титула אֲדֹנָי и личного имени יהוה без неестественного повтора «Господь ГОСПОДЬ»; «Владыка» ясно сохраняет титул, а «Яхве» — Божье имя.
- source_word: מַחְסִי
  choice: своим прибежищем
  rationale: «Прибежище» точно и привычно передаёт место защиты и безопасности; возвратное «своим» естественно соотносится с подлежащим.
- source_word: לְסַפֵּר
  choice: чтобы возвещать
  rationale: Инфинитив с ל здесь естественно понимать как выражение цели; «возвещать» передаёт публичное рассказывание о Божьих делах.
- source_word: כָּל מַלְאֲכוֹתֶיךָ
  choice: обо всех Твоих делах
  rationale: Сохраняет полный охват כָּל и прямое значение מְלָאכָה как совершённых Богом дел.
theological_decisions:
- issue: Смысл конструкции קִרֲבַת אֱלֹהִים
  choice: близость Бога
  alternative: приближаться к Богу
  rationale: Основной текст сохраняет именную конструкцию и не устраняет намеренно сохраняемую оригиналом смысловую напряжённость; более деятельное понимание дано в примечании.
- issue: Передача сочетания אֲדֹנָי יְהוִה
  choice: Владыку Яхве
  alternative: Господа Бога
  rationale: Так раздельно передаются титул и личное Божье имя, присутствующее в еврейском тексте, без конфессионально нагруженного истолкования.
- issue: Связь לְסַפֵּר с предыдущей частью
  choice: чтобы возвещать
  alternative: и возвещать
  rationale: Целевое прочтение грамматически естественно, однако не превращается в более узкое богословское утверждение о причине спасения.
