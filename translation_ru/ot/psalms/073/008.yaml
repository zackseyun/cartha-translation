  text: Они глумятся и говорят со злобой[a], свысока говорят об угнетении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они насмехаются и говорят злое; надменно говорят об угнетении». Значение первого еврейского глагола неясно; выражение, переданное как «свысока», может обозначать как высокое положение, так и высокомерную манеру речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִיקוּ
  choice: Они глумятся
  rationale: Форма глагола трудна для истолкования; в контексте надменной речи значение насмешливого презрения лучше всего соответствует параллелизму. «Глумятся» передаёт враждебную издёвку, не принимая более спорного значения «развращены».
- source_word: וִידַבְּרוּ
  choice: и говорят
  rationale: Простое продолжение описания поведения нечестивых; настоящее время естественно для русского контекста псалма.
- source_word: בְרָע
  choice: со злобой
  rationale: Сочетание предлога с существительным может характеризовать как содержание, так и манеру речи. «Со злобой» естественно передаёт её нравственно враждебный характер.
- source_word: עֹשֶׁק
  choice: об угнетении
  rationale: Существительное обозначает угнетение, притеснение или эксплуатацию. «Угнетение» сохраняет широкий общественно-нравственный смысл, не сужая его до вымогательства.
- source_word: מִמָּרוֹם
  choice: свысока
  rationale: Буквально выражение связано с высотой, но здесь, вероятнее всего, характеризует надменную манеру речи. «Свысока» сохраняет образ высоты и естественно передаёт высокомерие.
- source_word: יְדַבֵּרוּ
  choice: говорят
  rationale: Повтор глагола сохранён, чтобы передать еврейское усиление и параллельное построение строки.
