  yaml_path: translation/ot/psalms/073/026.yaml
  text: My flesh and my heart may fail[b][a], but God is the rock of my heart and my portion forever.
translation:
  language: ru
  text: Истощаются плоть моя и сердце моё[a], но Бог — скала[b] моего сердца и моя доля навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
