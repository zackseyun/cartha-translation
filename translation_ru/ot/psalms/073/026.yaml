    reason: lexical_alternative
lexical_decisions:
- source_word: כָּלָה
  choice: изнемогают
  rationale: Глагол выражает истощение, угасание или приближение к концу. «Изнемогают» естественно сочетается и с плотью, и с сердцем, сохраняя образ человеческой немощи; временно-видовая неоднозначность отмечена в сноске.
- source_word: שְׁאֵרִי
  choice: плоть моя
  rationale: В сочетании с сердцем слово обозначает телесную сторону человека. «Плоть» сохраняет конкретный библейский образ, не сводя его к нейтральному «тело».
- source_word: לְבָבִי
  choice: сердце моё / моего сердца
  rationale: «Сердце» прозрачно передаёт внутреннего человека — мысли, волю и чувства. Повтор сохранён ради поэтического акцента исходного текста.
- source_word: צוּר
  choice: скала
  rationale: Сохранена конкретная метафора устойчивости, надёжности и защиты, а не её толкование через абстрактное «сила».
- source_word: חֶלְקִי
  choice: моя доля
  rationale: «Доля» естественно выражает принадлежащую человеку часть или его истинное достояние и остаётся понятной современному читателю.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В контексте это прямое исповедание о Боге Израиля.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко и поэтично передаёт непреходящую длительность.
theological_decisions:
- issue: Антропологический язык начальной строки
  choice: плоть моя и сердце моё
  alternative: тело моё и внутренний мой человек
  rationale: Сочетание охватывает телесную немощь и внутреннюю жизнь человека, сохраняя образный язык текста и не навязывая позднейшей антропологической схемы.
- issue: Значение и временно-видовая сила כָּלָה
  choice: изнемогают
  alternative: могут изнемочь / изнемогли
  rationale: Еврейская форма допускает описание переживаемого или общего истощения. Настоящее время в русском сохраняет прямоту исповедания, а допустимые оттенки не устраняются и указаны в сноске.
- issue: Метафора Бога как צוּר
  choice: Бог — скала моего сердца
  alternative: Бог — сила моего сердца
  rationale: Исходный текст называет Бога «скалой». Сохранение метафоры передаёт устойчивость и надёжность, не сужая смысл до одной лишь силы.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Синтаксис слегка приподнят ради параллелизма псалма, но лексика остаётся понятной обычному читателю. Конкретные образы «плоть», «сердце» и «скала» сохранены.
