  yaml_path: translation/ot/psalms/073/019.yaml
  text: How they became a desolation in a moment! They came to an end[b][a]; they were consumed by terrors.
translation:
  language: ru
  text: Как в одно мгновение они обратились в запустение! Они исчезли, поглощённые ужасами.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исчезли, погибли от ужасов».'
