lexical_decisions:
- source_word: אֵיךְ
  choice: Как внезапно
  rationale: Вводит не вопрос, а восклицание об ошеломляюще резком повороте; наречие «внезапно» естественно передаёт силу сочетания с כְרָגַע.
- source_word: הָיוּ לְשַׁמָּה
  choice: они превратились в развалины
  rationale: Результативное сочетание обозначает переход к состоянию опустошения и гибели; «превратились» передаёт динамику, а «развалины» — зримый итог разорения.
- source_word: כְרָגַע
  choice: в одно мгновение
  rationale: Идиоматически указывает на крайнюю краткость и внезапность произошедшего.
- source_word: סָפוּ
  choice: они исчезли
  rationale: Глагол выражает прекращение существования, гибель или уничтожение; «исчезли» сохраняет краткость и не уточняет способ гибели.
- source_word: תַמּוּ
  choice: погибли
  rationale: В параллелизме усиливает предшествующий глагол, подчёркивая окончательность их конца.
- source_word: מִן בַּלָּהוֹת
  choice: от ужасов
  rationale: מִן здесь естественно понимать как указание на причину гибели, а בַּלָּהוֹת — как внушающие ужас бедствия или ужасы.
