lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ибо вот
  rationale: כִּי вводит основание для предыдущей мысли, а הִנֵּה торжественно привлекает внимание; сочетание «Ибо вот» сохраняет обе функции и уместно в поэтической речи.
- source_word: רְחֵקֶיךָ
  choice: далёкие от Тебя
  rationale: Субстантивированное множественное число обозначает людей, чья удалённость от Бога имеет прежде всего характер отношений, а не пространства.
- source_word: יֹאבֵדוּ
  choice: погибнут
  rationale: Форма от אבד выражает гибель или окончательную утрату; будущее время прямо соответствует еврейской форме и естественно звучит по-русски.
- source_word: הִצְמַתָּה
  choice: Ты истребил
  rationale: Перфект породы hифиль от צמת передаёт причинение гибели, уничтожение. Прошедшее время сохраняет формальный аспект еврейского текста и его оттенок совершённости или несомненности, не сводя его безоговорочно к общему настоящему.
- source_word: כָּל זוֹנֶה מִמֶּךָּ
  choice: всех, кто изменяет Тебе
  rationale: זנה здесь метафорически обозначает отступничество и неверность Богу; «изменяет Тебе» сохраняет образ нарушенной верности и естественное управление в современном русском языке.
theological_decisions:
- issue: Метафорическое значение זנה по отношению к Богу
  choice: «кто изменяет Тебе» — духовная и заветная неверность с сохранением брачной образности
  alternative: «кто блудно отступает от Тебя» / буквально «кто блудодействует, удаляясь от Тебя»
  rationale: Контекст противопоставляет удалённость от Бога близости к Нему. Глагол זנה в библейской традиции может изображать отступничество как супружескую неверность; русский глагол «изменяет» передаёт эту метафору без ошибочного сведения стиха к буквальному сексуальному проступку.
- issue: Временное значение перфекта הִצְמַתָּה
  choice: Сохранить прошедшее «Ты истребил»
  alternative: Гномическое или уверенное настоящее «Ты истребляешь»
  rationale: Еврейский перфект допускает взгляд на действие как совершённое либо несомненное. Прошедшее сохраняет напряжение с предшествующим будущим «погибнут» и не устраняет аспектуальную неоднозначность посредством молчаливой гармонизации.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим оттенком. Заглавное «Тебя/Ты» принято как уважительное обращение к Богу. Формулировка сохраняет параллелизм, краткость и образ заветной неверности.
