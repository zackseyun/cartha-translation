  yaml_path: translation/ot/psalms/073/000.yaml
  text: A psalm of Asaph[a]. Surely God is good to Israel[b], to the pure of heart.
translation:
  language: ru
  text: Псалом Асафа. Поистине, благ Бог к Израилю, к чистым сердцем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё же благ Бог к Израилю, к чистым сердцем». Частица אַךְ может иметь подтверждающий смысл («поистине») или, в контексте псалма, уступительно-противительный оттенок («всё же»).'
    reason: Передаёт допустимый альтернативный оттенок частицы אַךְ, не навязывая толкование отношения между двумя параллельными оборотами.
lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Псалом Асафа
  rationale: Естественная русская передача надписания; конструкция לְאָסָף допускает связь с Асафом без уточнения, является ли он автором, адресатом или исполнителем.
- source_word: אַךְ
  choice: Поистине
  rationale: В начале утверждения частица выражает уверенное подтверждение; «поистине» сохраняет торжественный регистр и не устраняет возможный оттенок «всё же» в контексте псалма.
- source_word: טוֹב ... אֱלֹהִים
  choice: благ Бог
  rationale: Краткая предикативная конструкция передаёт утверждение о Божьей благости, сохраняя поэтический порядок слов.
- source_word: לְבָרֵי לֵבָב
  choice: к тем, чьё сердце чисто
  rationale: Идиоматическая и понятная передача буквального «чистым сердцем»; множественное обозначение людей естественно выражено придаточной конструкцией.
theological_decisions:
- issue: Соотношение «Израиля» и «чистых сердцем»
  choice: 'Поставить тире и передать вторую фразу как пояснение: «к Израилю — к тем, чьё сердце чисто»'
  alternative: «к Израилю, к чистым сердцем» или понимание второй группы как отдельного адресата
  rationale: 'Параллельные конструкции с לְ естественно допускают уточняющее приложение: подлинный Израиль здесь характеризуется чистотой сердца. Тире делает синтаксис ясным, не добавляя конфессионального толкования.'
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим строем. Надписание не отделено нумерацией от первого стиха, поскольку предоставленный сегмент включает и заголовок, и начальную строку псалма.
