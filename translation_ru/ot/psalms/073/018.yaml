id: PSA.73.18
reference: Psalms 73:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַ֣ךְ בַּ֭/חֲלָקוֹת תָּשִׁ֣ית לָ֑/מוֹ הִ֝פַּלְתָּ֗/ם לְ/מַשּׁוּאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/018.yaml
  text: Surely you set them in slippery places[b][a]; you cast them down to ruin.
translation:
  language: ru
  text: Воистину, Ты ставишь их на скользкие места[a] и низвергаешь их в погибель[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в гладких местах»; возможно также: «на скользкой земле».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «в разорение» или «в опустошение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Воистину
  rationale: Частица здесь подчёркивает уверенность и вводит итоговое прозрение псалмопевца, а не выражает ограничение.
- source_word: בַּחֲלָקוֹת
  choice: на скользкие места
  rationale: Буквально — «в гладких местах»; в контексте падения речь идёт о ненадёжной, скользкой опоре. Русский глагол «ставить» естественно сочетается с направительным «на».
- source_word: תָּשִׁית לָמוֹ
  choice: Ты ставишь их
  rationale: Сохраняет прямое обращение к Богу и выраженную в еврейском тексте Божью деятельность.
- source_word: הִפַּלְתָּם
  choice: низвергаешь их
  rationale: Каузативная форма глагола נפל означает «заставить упасть»; «низвергаешь» естественно и ёмко передаёт это активное действие.
- source_word: לְמַשּׁוּאוֹת
  choice: в погибель
  rationale: Существительное обозначает разорение, опустошение или гибель; «в погибель» естественно передаёт направленность к гибельному исходу и сохраняет поэтический регистр.
theological_decisions:
- issue: Божье участие в падении нечестивых
  choice: 'Прямое действие Бога сохранено: «Ты ставишь… и низвергаешь».'
  alternative: Смягчить причинность, представив падение лишь следствием обстоятельств.
  rationale: Оба еврейских глагола стоят во втором лице единственного числа и обращены к Богу; текст прямо приписывает Ему как положение нечестивых на ненадёжное место, так и их падение.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Прописное «Ты» отражает традиционное благоговейное обращение к Богу, не меняя смысла оригинала.
