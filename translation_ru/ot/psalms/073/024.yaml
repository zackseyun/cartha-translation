  text: בַּ/עֲצָתְ/ךָ֥ תַנְחֵ֑/נִי וְ֝/אַחַ֗ר כָּב֥וֹד תִּקָּחֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/024.yaml
  text: With your counsel you guide me[a], and afterward you will receive me to glory.
translation:
  language: ru
  text: Твоим советом Ты ведёшь меня, а после примешь меня в славу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а после примешь меня с честью».'
    reason: Еврейское כָּבוֹד может обозначать как славу, в которую Бог принимает псалмопевца, так и честь, с которой Он его принимает.
lexical_decisions:
- source_word: בַּעֲצָתְךָ
  choice: Твоим советом
  rationale: Существительное עֵצָה означает «совет», «замысел»; предлог בְּ здесь естественно передаёт средство, поэтому творительный падеж сохраняет смысл и хорошо звучит по-русски.
- source_word: תַנְחֵנִי
  choice: Ты ведёшь меня
  rationale: Каузативная форма от נחה означает «вести, направлять». «Ведёшь» передаёт образ Божьего руководства и остаётся естественным для современного русского языка.
- source_word: וְאַחַר
  choice: а после
  rationale: אַחַר употреблено наречно и указывает на последующее событие. «А после» кратко сохраняет временную последовательность и поэтический строй.
- source_word: כָּבוֹד
  choice: во славу
  rationale: כָּבוֹד может означать как «славу», так и «честь». В основном тексте выбрана «слава», сохраняющая возвышенный и потенциально эсхатологический смысл, но альтернативный инструментальный смысл отмечен в сноске.
- source_word: תִּקָּחֵנִי
  choice: примешь меня
  rationale: לקח означает «взять» или «принять». В данном сочетании «примешь меня» естественно по-русски и не уточняет способ или обстоятельства принятия сверх еврейского текста.
theological_decisions:
- issue: Смысл выражения וְאַחַר כָּבוֹד תִּקָּחֵנִי
  choice: «а после примешь меня во славу»
  alternative: «а после примешь меня с честью»
  rationale: Краткая еврейская конструкция допускает понимание כָּבוֹד как цели или состояния («во славу»), а также как сопутствующего обстоятельства («с честью»). Основной вариант сохраняет возможную направленность к посмертной славе, не делая её более определённой, чем оригинал; сноска сохраняет иную грамматически возможную трактовку.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим синтаксисом. Заглавное «Ты» употреблено как традиционная русская форма почтительного обращения к Богу. Подлинная неоднозначность заключительной фразы сохранена посредством сноски.
