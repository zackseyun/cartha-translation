- source_word: עַמּוֹ
  choice: народ его
  rationale: Сохраняет местоименный суффикс мужского рода и не определяет, относится ли он к Богу или к упомянутому нечестивцу.
- source_word: הֲלֹם
  choice: сюда
  rationale: Естественно передаёт направительное значение наречия «сюда, в это место».
- source_word: וּמֵי מָלֵא
  choice: и обильные воды
  rationale: Передаёт поэтический образ буквально засвидетельствованных «вод полноты», но на понятном современном русском языке.
- source_word: יִמָּצוּ
  choice: выпиваются до конца
  rationale: Передаёт пассивную форму и значение полного извлечения или осушения; образ остаётся намеренно необычным.
- source_word: לָמוֹ
  choice: ими
  rationale: В сочетании с пассивным глаголом возможно орудийно-деятельное понимание «ими», хотя также допустимо «для них».
theological_decisions:
- issue: К кому относится «его» в выражении «народ его»
  choice: Референт оставлен неопределённым
  alternative: Народ нечестивца; Божий народ
  rationale: Еврейский суффикс сам по себе не называет референта, а трудный синтаксис стиха не позволяет устранить неоднозначность без толкования.
- issue: Получают ли люди обильную долю или сами исчерпывают воду
  choice: 'В основном тексте сохранено пассивное чтение с деятелем: «выпиваются ими»'
  alternative: «Выжимаются для них» или «даются им полной мерой»
  rationale: Глагол и значение предлога при местоимении допускают разные связи; альтернативное чтение вынесено в примечание, чтобы не сглаживать смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Необычность образа сохранена, но буквальное «воды полноты» вынесено в примечание ради ясности основного текста.
