  source_fidelity: 'Русский текст точно передаёт условный, контрфактический ход еврейского высказывания: «Если бы я сказал… — то предал бы…». «Буду говорить так» адекватно передаёт אֲסַפְּרָה כְמוֹ как намерение публично высказать тот же взгляд. «То» естественно оформляет следствие и в данном русском условном обороте достаточно передаёт прагматическую функцию הִנֵּה, не требуя неестественного «вот».'
