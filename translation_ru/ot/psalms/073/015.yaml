source:
  edition: WLC
  text: אִם אָ֭מַרְתִּי אֲסַפְּרָ֥ה כְמ֑וֹ הִנֵּ֤ה ד֭וֹר בָּנֶ֣י/ךָ בָגָֽדְתִּי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/015.yaml
  text: If I had said[a], “I will speak thus,” behold, I would have betrayed the generation of your children.
translation:
  language: ru
  text: 'Если бы я сказал: «Буду говорить так», — то предал бы поколение Твоих детей.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поступил бы вероломно с поколением Твоих сыновей».'
    reason: Лексическая и формальная альтернатива для בגד и בָּנֶיךָ.
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Если бы я сказал
  rationale: Условная конструкция в контексте выражает нереализованное намерение; русский сослагательный оборот естественно передаёт этот смысл.
- source_word: אֲסַפְּרָה כְמוֹ
  choice: Буду говорить так
  rationale: 'Глагол ספר здесь означает высказать или поведать изложенный выше взгляд, а כְמוֹ отсылает к нему: «так».'
- source_word: הִנֵּה
  choice: то
  rationale: В данном условном предложении הִנֵּה подчёркивает наступивший бы результат; русское «то» ясно и естественно оформляет аподосис без архаического «вот».
- source_word: דּוֹר בָּנֶיךָ
  choice: поколение Твоих детей
  rationale: דּוֹר — «поколение», а בָּנֶיךָ буквально «Твоих сыновей», но в контексте обозначает принадлежащий Богу народ в целом.
- source_word: בָגָדְתִּי
  choice: предал бы
  rationale: בגד обозначает вероломство или нарушение верности; «предал бы» кратко и естественно передаёт серьёзность поступка.
theological_decisions:
- issue: К кому относится «Твоих детей» и кого оно обозначает
  choice: Местоимение обращено к Богу, а «дети» обозначают Его народ в целом.
  alternative: Формально-буквальное «Твоих сыновей».
  rationale: Суффикс второго лица мужского рода указывает на обращение к Богу; множественное «сыновья» в данном общинном контексте имеет собирательный смысл и не требует ограничения только мужчинами.
- issue: Характер предполагаемого предательства
  choice: Публичное повторение сомнений было бы неверностью поколению Божьего народа.
  alternative: «Поступил бы вероломно с поколением Твоих сыновей».
  rationale: Перевод сохраняет нравственно-богословское напряжение текста, не уточняя сверх оригинала ни форму высказывания, ни конкретные последствия.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Заглавная буква в «Твоих» обозначает обращение к Богу. Тире помогает естественно передать переход от условия к следствию.
