    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: Ведь … я был
  rationale: Форма продолжает объяснение предыдущей мысли; «ведь» естественно передаёт пояснительно-причинную связь, а «я был» сохраняет значение первого лица и состояния.
- source_word: נָגוּעַ
  choice: под ударами
  rationale: Форма от נגע описывает человека как поражённого, терпящего бедствие. Выражение «под ударами» передаёт образ поражения, не сводя его непременно к болезни или буквальным физическим ударам.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Естественное современное русское выражение, сохраняющее смысл непрерывной продолжительности.
- source_word: וְתוֹכַחְתִּי
  choice: и … под наказанием
  rationale: 'Буквально это существительное с суффиксом первого лица: «моё исправление / обличение / наказание». В параллельной русской конструкции «под наказанием» естественно передаёт переживаемое взыскание, не ограничивая его словесным укором.'
- source_word: לַבְּקָרִים
  choice: каждое утро
  rationale: Множественное число «по утрам» имеет повторительно-распределительный смысл; «каждое утро» ясно выражает регулярность.
theological_decisions:
- issue: Характер страдания псалмопевца
  choice: Общее описание постоянных ударов и исправляющего наказания без уточнения их конкретной формы или непосредственного деятеля
  alternative: Телесная болезнь или кара; либо исключительно словесное обличение
  rationale: Еврейские слова допускают широкий смысл поражения и исправительного взыскания. Перевод сохраняет эту напряжённость и не сужает текст до болезни, буквального избиения или одних лишь слов укора.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Эллипсис во второй части («и каждое утро — под наказанием») сохраняет плотность еврейской строки и остаётся понятным без архаизмов.
