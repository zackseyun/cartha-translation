  text: until I entered the sanctuaries of God[b][a]; then I understood their end.
translation:
  language: ru
  text: пока я не вошёл в Божьи святилища[a]; тогда я понял их конечную участь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Божье святилище». В еврейском тексте стоит форма множественного числа — «святилища»; она может собирательно обозначать всё священное пространство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их конец», «их исход». Еврейское слово указывает на их окончательный исход или участь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד
  choice: пока не
  rationale: Передаёт предел, до которого продолжалось недоумение псалмопевца, и вводит переломный момент.
- source_word: אָבוֹא
  choice: я не вошёл
  rationale: Форма глагола в сочетании с עַד указывает на решающий момент входа; прошедшее время естественно передаёт повествовательный контекст по-русски.
- source_word: מִקְדְּשֵׁי אֵל
  choice: в священные места Бога
  rationale: Сохраняет множественное число еврейского существительного и при этом звучит естественнее, чем буквальное «в святилища Бога»; выражение может обозначать совокупность священных помещений или пределов.
- source_word: אָבִינָה
  choice: тогда я понял
  rationale: Глагол בין выражает понимание и проницательное постижение; «тогда» явно передаёт подразумеваемую последовательность.
- source_word: לְאַחֲרִיתָם
  choice: какой конец их ждёт
  rationale: Передаёт не просто прекращение, а окончательный исход или участь нечестивых; развёрнутая русская формулировка ясна и сохраняет эсхатологический вес выражения.
theological_decisions:
- issue: Передавать ли מִקְדְּשֵׁי традиционным единственным числом или еврейским множественным
  choice: священные места Бога
  alternative: святилище Бога
  rationale: В основном тексте сохранено грамматическое множественное число оригинала без навязывания особого учения о нескольких святилищах; оно может собирательно обозначать священные пределы Божьего присутствия.
- issue: Степень определённости значения אַחֲרִיתָם
  choice: какой конец их ждёт
  alternative: их исход / их будущую участь
  rationale: Перевод сохраняет направленность к окончательному результату, не уточняя сверх текста, идёт ли речь исключительно о смерти, суде или более широко об их конечной участи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Порядок слов остаётся естественным, а точка с запятой подчёркивает перелом от недоумения к пониманию.
