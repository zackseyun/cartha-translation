source:
  edition: WLC
  text: כִּ֤י אֵ֖ין חַרְצֻבּ֥וֹת לְ/מוֹתָ֗/ם וּ/בָרִ֥יא אוּלָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/004.yaml
  text: For they have no pains until death, and their body is fat.
translation:
  language: ru
  text: Ведь они не знают мучений до самой смерти[a], и тело у них упитанное.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при смерти у них нет мучений». Еврейская фраза допускает оба понимания; значение слова, переведённого как «мучения», также не вполне ясно.'
    reason: Сохранить лексическую и синтаксическую неоднозначность еврейского текста.
lexical_decisions:
- source_word: חַרְצֻבּוֹת
  choice: мучений
  rationale: Редкое слово, вероятно обозначающее боли, страдания или мучительные узы; «мучений» естественно передаёт смысл в данном контексте, не сужая его до одной разновидности боли.
- source_word: לְמוֹתָם
  choice: до самой смерти
  rationale: Предлог לְ допускает понимание временного предела; такое прочтение согласуется с образом безмятежной жизни нечестивых в ближайшем контексте. Подлинная неоднозначность отмечена в сноске.
- source_word: וּבָרִיא אוּלָם
  choice: и тело у них упитанное
  rationale: בָּרִיא означает «тучный, упитанный, здоровый», а אוּלָם здесь, вероятно, «их тело». Формулировка звучит естественно по-русски и сохраняет образ телесного благополучия.
theological_decisions:
- issue: Испытывают ли нечестивые мучения до смерти или именно при смерти
  choice: до самой смерти
  alternative: при смерти у них нет мучений
  rationale: Грамматика допускает оба понимания. Основной текст следует контексту псалма и консультационному английскому тексту, но вариант, относящий отсутствие мучений к самой смерти, сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык; фраза проста и понятна, но сохраняет достоинство поэтической речи. «Упитанное» передаёт видимое благополучие без архаичного «тучное».
