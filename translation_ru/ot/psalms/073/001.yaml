translation:
  language: ru
  text: 'Псалом Асафа.[a]


    Поистине, благ Бог к Израилю, к чистым сердцем.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское надписание можно понимать как указание на авторство, принадлежность или предназначение псалма: «псалом Асафа», «псалом, принадлежащий Асафу» или «псалом для Асафа».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «благ Бог к Израилю, к тем, у кого чистое сердце». Вторая фраза может уточнять, какой Израиль имеется в виду, либо стоять с первой в одном ряду.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшееся и точное обозначение жанра в надписаниях псалмов.
- source_word: לְאָסָף
  choice: Асафа
  rationale: Родительный падеж естественно передаёт традиционное надписание, не сводя возможное значение לְ исключительно к авторству; иные оттенки отмечены в сноске.
- source_word: אַךְ
  choice: Поистине
  rationale: Здесь частица выражает уверенное утверждение и вводит основную мысль псалма; «поистине» передаёт этот смысл в достойном современном регистре.
- source_word: טוֹב
  choice: благ
  rationale: Краткое прилагательное «благ» сохраняет широкое значение Божьей доброты и благости, не сужая его до одного конкретного благодеяния.
- source_word: לְיִשְׂרָאֵל
  choice: к Израилю
  rationale: Предлог «к» естественно сочетается с «благ» и передаёт еврейское לְ как отношение или направленность блага.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Слово употреблено в единственном значении и обозначает Бога Израиля.
- source_word: לְבָרֵי לֵבָב
  choice: к чистым сердцем
  rationale: Сжатая поэтическая формулировка передаёт внутреннюю нравственную чистоту и сохраняет параллелизм двух оборотов с לְ.
theological_decisions:
- issue: Соотношение выражений «к Израилю» и «к чистым сердцем»
  choice: Сохранить их как допускающее уточнение поэтическое соположение, обозначив его тире
  alternative: 'Понять их как две отдельные однородные группы: Израиль и, кроме него, чистые сердцем'
  rationale: Повторение לְ допускает как пояснительно-уточняющую, так и координативную связь. Тире мягко указывает на вероятное уточнение, а сноска сохраняет синтаксическую и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский с лаконичным, возвышенным поэтическим строем. «Благ» выбрано вместо более разговорного «добр», а «чистым сердцем» сохраняет образность и компактность еврейской строки.
