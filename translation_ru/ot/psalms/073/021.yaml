lexical_decisions:
- source_word: כִּי
  choice: когда
  rationale: В контексте вводит обстоятельство, предшествующее признанию в следующем стихе; «когда» естественно передаёт временно-обстоятельственную связь, не исключая пояснительного оттенка.
- source_word: יִתְחַמֵּץ
  choice: наполнялось горечью
  rationale: Форма от חמץ буквально связана с закисанием и здесь образно описывает внутреннее ожесточение или горечь. Русское выражение сохраняет метафору горечи и звучит естественнее буквального «закисало».
- source_word: לְבָבִי
  choice: сердце моё
  rationale: Сохраняет обычный древнееврейский образ сердца как средоточия мыслей, воли и чувств.
- source_word: וְכִלְיוֹתַי
  choice: в почках
  rationale: כִּלְיָה буквально означает «почка» и образно указывает на глубочайшие внутренние переживания. Конкретный телесный образ сохранён в основном тексте, а его смысл пояснён в сноске.
- source_word: אֶשְׁתּוֹנָן
  choice: я был пронзён
  rationale: Редкая форма в первом лице передаёт резкое болезненное воздействие, подобное уколу или пронзанию. Перевод сохраняет лицо глагола и телесную метафору.
theological_decisions:
- issue: Связь כִּי с ближайшим контекстом
  choice: временное «когда»
  alternative: причинно-пояснительное «ибо / ведь»
  rationale: И временное, и пояснительное понимание возможно. В сочетании со следующим признанием («тогда я был невеждой…») временное прочтение образует естественную последовательность, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением яркой древнееврейской телесной метафоры. Инверсия «сердце моё» придаёт строке умеренно поэтическое, но понятное звучание. Запятая в конце отражает продолжение мысли в следующем стихе.
