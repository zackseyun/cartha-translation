lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Союз связывает признание псалмопевца с предшествующим размышлением и естественно передаёт переход к самооценке, не усиливая причинно-временной оттенок сверх явно выраженного в еврейском тексте.
- source_word: בַעַר
  choice: был неразумен
  rationale: Слово обозначает отсутствие разумения, доходящее до животной тупости. «Неразумен» сохраняет нравственно-интеллектуальный смысл и подходит для современного литературного регистра.
- source_word: וְלֹא אֵדָע
  choice: и не понимал
  rationale: Хотя ידע обычно значит «знать», здесь параллель с בַעַר и последующее сравнение с животным указывают на неспособность осмыслить происходящее; «не понимал» естественно передаёт это по-русски.
- source_word: בְּהֵמוֹת
  choice: словно животное
  rationale: Форма морфологически множественного числа может иметь собирательное или усилительное значение. Русское единственное число естественно передаёт сравнение псалмопевца с неразумным животным; особенность формы отмечена в сноске.
- source_word: הָיִיתִי
  choice: был я
  rationale: Форма глагола описывает состояние псалмопевца. Инверсия после сравнительного оборота сохраняет поэтическую выразительность без архаизации.
- source_word: עִמָּךְ
  choice: пред Тобой
  rationale: Буквально предлог обычно значит «с Тобой», однако в данном признании русское «пред Тобой» естественно выражает состояние человека в присутствии Бога и сохраняет направленность исповеди к Нему.
theological_decisions:
- issue: Смысл сравнения псалмопевца с животным перед Богом
  choice: 'Сравнение выражает его собственное признание в неразумии: «словно животное».'
  alternative: Более буквальное «я был как животные» либо более истолковывающее «я был как неразумная скотина».
  rationale: Текст является покаянной самооценкой конкретного говорящего, а не общим догматическим утверждением о природе человека. Формулировка сохраняет резкость образа, не превращая его в отдельное учение.
- issue: Отношение, выраженное עִמָּךְ
  choice: «пред Тобой» — в Божьем присутствии и перед Его лицом.
  alternative: «с Тобой» — более прямое лексическое соответствие, подчёркивающее, что псалмопевец оставался с Богом даже в своём неразумии.
  rationale: Контекст допускает оба оттенка. «Пред Тобой» звучит естественно и исповедально по-русски, не отрицая близости к Богу, явно выраженной следующим стихом.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим порядком слов. Местоимение «Тобой» написано с прописной буквы как традиционное уважительное обращение к Богу; архаические и грубо-разговорные обозначения неразумия исключены.
