  text: А я был неразумен и не понимал; я был словно животное[a] с Тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «животные»; множественное число, вероятно, употреблено собирательно или для усиления образа: «словно животное», «по-животному».'
