  text: בַּ/עֲמַ֣ל אֱנ֣וֹשׁ אֵינֵ֑/מוֹ וְ/עִם אָ֝דָ֗ם לֹ֣א יְנֻגָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/005.yaml
  text: They are not in the trouble of mortal man[a], and they are not plagued with mankind.
translation:
  language: ru
  text: Им не ведомы тяготы смертных, и вместе с людьми они не подвергаются бедствиям[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они не несут людского бремени и вместе с людьми не бывают поражаемы».'
    reason: עָמָל может означать тяготы, тяжёлый труд или бремя; пассивное יְנֻגָּעוּ буквально означает «бывают поражаемы/поражаются».
lexical_decisions:
- source_word: בַּעֲמַל
  choice: не знают тягот
  rationale: עָמָל обозначает тяготы, тяжкий труд или бедствие. В контексте кажущегося благополучия нечестивых «не знают тягот» естественно передаёт отсутствие обычных человеческих лишений.
- source_word: אֱנוֹשׁ
  choice: смертного человека
  rationale: אֱנוֹשׁ может подчёркивать слабость и смертность человека; определение «смертного» сохраняет этот оттенок и отличает слово от более общего אָדָם во второй строке.
- source_word: אֵינֵמוֹ
  choice: они не знают
  rationale: Отрицательная экзистенциальная конструкция с местоименным суффиксом означает, что эти тяготы им не свойственны и не выпадают на их долю. По-русски это естественно выражается оборотом «они не знают тягот».
- source_word: וְעִם
  choice: вместе с
  rationale: 'Предлог выражает совместность: нечестивые, по наблюдению псалмопевца, не подвергаются бедствиям вместе с остальными людьми.'
- source_word: אָדָם
  choice: другими людьми
  rationale: Здесь אָדָם имеет собирательное значение человечества вообще. В русском контексте «другими людьми» ясно передаёт противопоставление описываемых нечестивых остальным людям, не превращая слово в имя собственное.
- source_word: יְנֻגָּעוּ
  choice: не терпят бедствий
  rationale: Пассивная форма от נגע означает быть поражённым или подвергнуться бедствию. «Не терпят бедствий» передаёт смысл естественно и сохраняет параллелизм с первой строкой.
