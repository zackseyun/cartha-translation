lexical_decisions:
- source_word: שַׁתּוּ
  choice: обратили
  rationale: Глагол означает «положили, поставили». В сочетании с «устами» русское «обратили» естественно передаёт направленность речи, не приписывая самому глаголу враждебного значения.
- source_word: בַשָּׁמַיִם
  choice: против небес
  rationale: Предлог буквально означает «в», однако контекст изображает дерзкую речь нечестивых. «Против небес» передаёт вероятную направленность и вызов, а буквальная возможность сохранена в сноске.
- source_word: פִּיהֶם
  choice: свои уста
  rationale: Единственное число в еврейском имеет собирательное значение. Русское «уста» сохраняет поэтический регистр и естественно сочетается с множественным субъектом.
- source_word: וּלְשׁוֹנָם
  choice: и язык их
  rationale: Сохранено единственное число оригинала как собирательный и образный параллелизм к «устам».
- source_word: תִּהֲלַךְ
  choice: расхаживает
  rationale: Буквально «ходит». «Расхаживает» передаёт не только движение, но и контекстуальный оттенок самоуверенности и высокомерия; буквальный вариант дан в сноске.
- source_word: בָּאָרֶץ
  choice: по земле
  rationale: При глаголе движения «по земле» звучит естественно. «Земля» сохраняет широкий пространственный контраст с небесами, не сужая смысл до отдельной страны.
theological_decisions:
- issue: Направленность речи по отношению к небесам
  choice: против небес
  alternative: на небесах / к небесам
  rationale: Контекст допускает понимание дерзкой речи, обращённой против неба, но еврейский предлог сам по себе этого не решает. Поэтому основной текст передаёт контекстуальный смысл, а формальная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма. «Уста» поддерживает возвышенный псалмический регистр, а «расхаживает» оживляет олицетворение языка без разговорной сниженности.
