  source_fidelity: 'Первое полустишие передано точно: יָצָא ... מֵחֵלֶב описывает выступающие/выпученные от тучности глаза. Во втором полустишии черновик меняет синтаксические роли: עָבְרוּ — глагол мужского рода множественного числа, тогда как מַשְׂכִּיּוֹת — существительное женского рода множественного числа. Поэтому «помыслы ... переливаются через край» не отражает грамматику еврейского текста. Более вероятно, что подразумеваемое «они» превосходит «помыслы сердца».'
  naturalness: «Глаза их выпучились от жира» — резкое, но естественное и уместное для образного обличительного языка. «Они превзошли помыслы сердца» несколько поэтично, однако понятно в контексте псалма и не привносит в текст отсутствующий предел («через край», «всякую меру»).
  terminology: «Жир» сохраняет намеренно телесный образ חֵלֶב, не сводя его к достатку. «Помыслы сердца» передаёт מַשְׂכִּיּוֹת לֵבָב без конфессионального истолкования. У «сердца» в оригинале нет явно выраженного притяжательного суффикса; русское родительное «сердца» сохраняет эту лаконичность.
