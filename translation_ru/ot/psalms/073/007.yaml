lexical_decisions:
- source_word: יָצָא
  choice: выпучились
  rationale: Глагол буквально означает «вышли», но в сочетании с глазами и жиром передаёт образ выступающих, выпученных глаз; выбран естественный русский эквивалент, сохраняющий телесную конкретность.
- source_word: מֵחֵלֶב
  choice: от жира
  rationale: Сохраняется буквальный образ жира, который в контексте также подразумевает чрезмерное благополучие и изобилие, без сведения смысла только к богатству.
- source_word: עֵינֵמוֹ
  choice: глаза их
  rationale: Точно передаёт существительное во множественном числе с местоименным суффиксом третьего лица множественного числа.
- source_word: עָבְרוּ
  choice: переливаются через край
  rationale: Основное значение — «переходить, переступать предел». Русское выражение передаёт избыточность и образ выхода за границы.
- source_word: מַשְׂכִּיּוֹת
  choice: помыслы
  rationale: Слово может обозначать образы, замыслы или внутренние представления. «Помыслы» естественно сочетаются с сердцем и не сужают смысл исключительно до фантазий или злых замыслов.
- source_word: לֵבָב
  choice: их сердца
  rationale: Еврейский текст употребляет собирательное единственное число «сердце» без отдельного суффикса; по контексту оно относится к описываемым нечестивым. Русское «их сердца» ясно выражает эту связь, сохраняя единственное число существительного.
