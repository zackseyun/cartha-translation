  yaml_path: translation/ot/psalms/073/023.yaml
  text: Yet I am continually with you[a]; you have held my right hand.
translation:
  language: ru
  text: 'Но я всегда с Тобой: Ты взял меня за правую руку.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты держишь меня за правую руку». Еврейский глагол означает «схватить, взять, держать»; форма перфекта может указывать на совершённое действие с продолжающимся результатом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Но я
  rationale: Союз с местоимением в контексте выражает противопоставление прежнему смятению псалмопевца; «Но я» естественно передаёт этот поворот.
- source_word: תָמִיד
  choice: всегда
  rationale: Слово обозначает непрерывность и постоянство; «всегда» ясно и естественно звучит в современном русском языке.
- source_word: עִמָּךְ
  choice: с Тобой
  rationale: Предлог עם прямо выражает пребывание вместе или близость; буквальное и естественное соответствие — «с Тобой».
- source_word: אָחַזְתָּ
  choice: держишь
  rationale: Глагол אחז может обозначать как схватывание, так и удерживание. Настоящее время по-русски передаёт сохраняющийся результат совершённого действия и согласуется с «всегда».
- source_word: בְּיַד יְמִינִי
  choice: меня за правую руку
  rationale: При אחז сочетание указывает, за какую часть тела держат. Русская идиома требует конструкции «держать кого-либо за руку»; добавление «меня» грамматически проясняет объект, уже заключённый в суффиксе «моя» исходного текста.
theological_decisions:
- issue: Видо-временной оттенок совершенной формы אָחַזְתָּ и характер Божьей поддержки
  choice: Ты держишь меня за правую руку
  alternative: Ты взял меня за правую руку
  rationale: Еврейский перфект допускает совершённое действие с продолжающимся результатом. Настоящее «держишь» естественно передаёт в русском контексте продолжающуюся поддержку, не отрицая предшествующего момента, когда Бог взял псалмопевца за руку; альтернативный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык, простой и достойный по тону. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской стилистике. Двоеточие передаёт смысловую связь между постоянным пребыванием с Богом и Его поддержкой.
