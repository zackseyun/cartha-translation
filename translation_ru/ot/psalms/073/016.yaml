  text: Но когда я пытался понять это[a], для меня это было тяжким трудом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но когда я думал, как познать это, для меня это было тяготой».'
    reason: 'Передаёт возможные более буквальные соответствия: «думал» для חשׁב, «познать» для לדעת и «тягота» для עָמָל; «для меня» естественно выражает смысл еврейского «в моих глазах».'
lexical_decisions:
- source_word: וָאֲחַשְּׁבָה
  choice: когда я пытался
  rationale: Глагол חשׁב означает «думать, обдумывать, замышлять»; в сочетании с инфинитивом לָדַעַת здесь выражает целенаправленную попытку осмысления. Союз ו передан противительным «но» по контексту.
- source_word: לָדַעַת
  choice: понять
  rationale: Буквально «знать»; применительно к размышлению над названным вопросом естественное русское «понять» передаёт стремление постичь его смысл.
- source_word: זֹאת
  choice: это
  rationale: Указательное местоимение отсылает к затруднительному вопросу предыдущего контекста, не называя его прямо.
- source_word: עָמָל
  choice: мучительным трудом
  rationale: Слово охватывает значения тяжкого труда, тяготы, мучения и беды. Сочетание сохраняет и усилие размышления, и причиняемую им тягость.
- source_word: הִיא
  choice: это было
  rationale: Местоимение служит связкой в именном сказуемом и соотносится с указательным זֹאת; по-русски естественно повторить «это».
- source_word: בְעֵינָי
  choice: в моих глазах
  rationale: Сохранён буквальный образ еврейской идиомы, означающей также «для меня, по моему восприятию».
