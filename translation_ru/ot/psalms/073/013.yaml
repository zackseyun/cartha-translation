    reason: cultural_note
lexical_decisions:
- source_word: אַךְ רִיק
  choice: так не напрасно ли
  rationale: В контексте размышления псалмопевца сочетание передаёт горький вывод о кажущейся тщетности праведной жизни. Вопросительная форма естественно связывает стих с окружающим сетованием, не превращая его в окончательное богословское утверждение.
- source_word: זִכִּיתִי
  choice: я сохранял ... чистым
  rationale: Глагол допускает значение очищения или поддержания чистоты; с «сердцем» по-русски естественно звучит «сохранял сердце чистым».
- source_word: לְבָבִי
  choice: сердце
  rationale: Сохраняется библейский образ внутреннего, нравственного и волевого центра человека.
- source_word: וָאֶרְחַץ
  choice: и омывал
  rationale: «Омывал» сохраняет поэтический и образный характер действия, не сводя его к бытовому мытью.
- source_word: בְּנִקָּיוֹן כַּפָּי
  choice: руки в невинности
  rationale: «Руки» естественнее буквальных «ладоней»; «в невинности» сохраняет идиому нравственной чистоты и её связь с образом омовения.
theological_decisions:
- issue: Нравственная или обрядовая чистота
  choice: Образ омовения передаёт прежде всего нравственную невиновность и чистоту.
  alternative: Понимать выражение главным образом как указание на обрядовую чистоту.
  rationale: Параллелизм сердца и рук и общий контекст псалма указывают на этическую направленность, при этом образ омовения сохранён и не истолкован чрезмерно узко.
- issue: Утверждение или риторический вопрос
  choice: Передать строку как риторический вопрос о кажущейся тщетности чистой жизни.
  alternative: «Поистине, напрасно я сохранял сердце чистым…»
  rationale: В масоретском тексте нет знака вопроса, поэтому утвердительное чтение возможно; однако в русском контексте вопрос лучше выражает внутреннее рассуждение и не делает временный кризис псалмопевца его окончательным выводом.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим, достойным регистром. Сохранены параллелизм «сердце — руки» и метафора омовения; синтаксис сделан естественным для современного читателя.
