lexical_decisions:
- source_word: וַאֲנִי
  choice: А у меня
  rationale: Союз и самостоятельное местоимение подчёркивают противопоставление предыдущему стиху. Оборот «А у меня» естественно передаёт этот контраст по-русски и плавно сочетается с образом ног.
- source_word: כִּמְעַט
  choice: едва не
  rationale: Наречие указывает на событие, которое почти произошло. «Едва не» кратко и естественно передаёт эту близость.
- source_word: נטוי
  choice: не оступились
  rationale: Форма от נטה описывает утрату устойчивости или отклонение. В сочетании с «ногами» глагол «оступиться» сохраняет конкретный образ почти случившегося падения, не сводя его прямо к нравственному или вероучительному смыслу.
- source_word: רַגְלָי
  choice: ноги
  rationale: Сохранён буквальный телесный образ, который в контексте может также обозначать жизненную устойчивость и путь человека.
- source_word: כְּאַיִן
  choice: едва не
  rationale: Идиоматическое выражение имеет значение «почти», «чуть не». Повтор «едва не» поддерживает строгий поэтический параллелизм.
- source_word: שפכה
  choice: не поскользнулись
  rationale: Основное значение корня связано с изливанием, но применительно к стопам или шагам здесь возникает образ скольжения и утраты опоры. «Поскользнулись» ясно и естественно передаёт его по-русски.
- source_word: אֲשֻׁרָי
  choice: стопы
  rationale: Слово обозначает шаги, поступь или следование. «Стопы» сохраняет телесно-путевой образ и образует естественную поэтическую пару со словом «ноги».
theological_decisions:
- issue: Образ утраты устойчивости
  choice: Сохранить конкретные образы ног и стоп, которые едва не оступились и не поскользнулись, не раскрывая метафору толкованием.
  alternative: 'Передать смысл прямо: «я едва не потерял веру» или «едва не пал духовно».'
  rationale: Стих допускает духовное и нравственное осмысление, однако сам не уточняет характер почти случившегося падения. Сохранение образа не устраняет заложенную в тексте смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия сведена к минимуму; слова «ноги» и «стопы» сохраняют параллелизм и традиционный библейский образ без архаизации.
