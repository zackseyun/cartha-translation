  text: А я[a] — едва не пошатнулись мои ноги, чуть не поскользнулись мои стопы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «А я — мои ноги едва не уклонились, мои шаги чуть не соскользнули». Еврейский поэтический параллелизм соединяет близкие, частично перекрывающиеся образы отклонения и утраты опоры.'
