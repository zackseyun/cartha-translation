  yaml_path: translation/ot/psalms/073/011.yaml
  text: And they say[b][a], “How does God know? Is there knowledge in the Most High?”
translation:
  language: ru
  text: 'И говорят[a]: «Как Бог знает? И есть ли у Всевышнего знание?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И сказали», если перфект понимать как простое прошедшее время, а не как описание их обычной речи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: И говорят
  rationale: Перфект в поэтическом описании может передавать повторяющуюся, характерную речь; настоящее время естественно выражает продолжающееся отношение нечестивых. Возможное прошедшее время отмечено в сноске.
- source_word: אֵיכָה יָדַע
  choice: Как узнает
  rationale: Вопросительное אֵיכָה означает «как?», а יָדַע — «знать, узнавать». Форма «как узнает» сохраняет резкость риторического вопроса и не добавляет отсутствующего в еврейском тексте модального «может».
- source_word: אֵל
  choice: Бог
  rationale: Обычное обозначение Бога в данном контексте, а не передаваемое транслитерацией имя.
- source_word: וְיֵשׁ דֵּעָה
  choice: Разве есть знание
  rationale: Экзистенциальная конструкция передана естественным русским риторическим вопросом; «знание» сохраняет смысловую связь с предшествующим глаголом «узнает».
- source_word: בְעֶלְיוֹן
  choice: у Всевышнего
  rationale: Русская конструкция обладания «есть у» естественно передаёт буквальное «есть знание во Всевышнем», не меняя смысла вопроса о том, обладает ли Всевышний знанием.
theological_decisions:
- issue: Передача божественного титула עֶלְיוֹן
  choice: Всевышний
  alternative: Превознесённый
  rationale: «Всевышний» — общепринятый русский божественный титул, ясно выражающий верховенство Бога и не вносящий дополнительного толкования.
- issue: Характер вопросов о Божьем знании
  choice: Сохранены как дерзкие риторические вопросы без поясняющей вставки
  alternative: «Откуда Богу знать?» / «Неужели Всевышний знает?»
  rationale: Исходный текст ставит под сомнение знание Бога и наличие знания у Всевышнего; перевод сохраняет эту богословскую напряжённость, не смягчая и не разрешая её.
translation_notes:
  register: Современный литературный русский язык с кратким, резким риторическим строем. «Разве» естественно обозначает вопросительное прочтение второй части, а «у Всевышнего» идиоматично выражает обладание. Маркер сноски поставлен непосредственно после спорной глагольной формы.
