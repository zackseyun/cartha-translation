  text: לָ֭/כֵן עֲנָקַ֣תְ/מוֹ גַאֲוָ֑ה יַעֲטָף שִׁ֝֗ית חָמָ֥ס לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/073/006.yaml
  text: Therefore pride is their necklace[a]; violence covers them like a garment.
translation:
  language: ru
  text: Поэтому гордость — их ожерелье[a], насилие окутывает их, словно одежда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поэтому гордость украшает их, как ожерелье; насилие облекает их, как одежда».'
    reason: 'Лексико-синтаксическая альтернатива: еврейский текст допускает более явно глагольную передачу обеих метафор.'
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт следствие из предшествующего описания нечестивых и сохраняет логическую связь с контекстом.
- source_word: עֲנָקַתְמוֹ
  choice: их ожерелье
  rationale: Форма от ענק обозначает шейное украшение; именная конструкция кратко и естественно сохраняет образ того, что они выставляют напоказ.
- source_word: גַאֲוָה
  choice: гордость
  rationale: В данном контексте слово имеет отрицательный нравственный смысл; «гордость» — прямой и понятный русский эквивалент.
- source_word: יַעֲטָף
  choice: окутывает
  rationale: Глагол выражает обёртывание или окружение чем-либо и хорошо сочетается с образом одежды.
- source_word: שִׁית
  choice: словно одежда
  rationale: Редкое существительное понимается как одежда или покров; «словно» естественно обозначает метафорическое сравнение в русском языке.
- source_word: חָמָס
  choice: насилие
  rationale: Передаёт основной смысл жестокого насилия и неправедного притеснения, сохраняя краткость оригинала.
- source_word: לָמוֹ
  choice: их
  rationale: Местоименная форма указывает на описываемых людей; в русской конструкции естественно выражается как прямое дополнение.
