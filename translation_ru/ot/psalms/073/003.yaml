lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предшествующего признания псалмопевца; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: קִנֵּאתִי
  choice: я завидовал
  rationale: Глагол קנא здесь обозначает зависть к чужому положению; несовершенный вид по-русски естественно описывает продолжавшееся внутреннее состояние.
- source_word: בַּהוֹלְלִים
  choice: надменным
  rationale: Форма обозначает людей самодовольных, хвастливых и заносчивых; «надменным» передаёт нравственную характеристику и естественно сочетается с «завидовал».
- source_word: שְׁלוֹם
  choice: благополучие
  rationale: В данном контексте שָׁלוֹם означает не только отсутствие вражды, но видимое благосостояние, безбедность и спокойную жизнь нечестивых.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Традиционное и точное обозначение людей, виновных в нравственном зле, в поэтической и премудростной речи.
- source_word: אֶרְאֶה
  choice: видя
  rationale: Еврейский имперфект обозначает обстоятельство, вызвавшее зависть; деепричастие сохраняет тесную связь между наблюдением и внутренней реакцией без излишнего уточнения времени.
