lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательная частица с оттенком привлечения внимания; «вот» естественно и выразительно передаёт её функцию в современном русском.
- source_word: אֵלֶּה
  choice: они
  rationale: В сочетании «вот они» ясно указывает на только что описанных людей и не утяжеляет фразу буквальным «эти».
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Устойчивое для Псалтири обозначение людей, нравственно противящихся Богу; сохраняет религиозно-нравственный смысл исходного слова.
- source_word: וְשַׁלְוֵי עוֹלָם
  choice: всегда безмятежны
  rationale: Передаёт состояние длительного покоя, благополучия и отсутствия тревог. Временной компонент עוֹלָם выражен словом «всегда», без утверждения метафизической вечности.
- source_word: הִשְׂגּוּ
  choice: умножают
  rationale: Форма допускает смысл достижения, приобретения или наращивания. В сочетании с חָיִל и в контексте процветания естественно передаётся как продолжающееся накопление.
- source_word: חָיִל
  choice: богатство
  rationale: Хотя слово может означать силу, доблесть или войско, контекст благополучия нечестивых поддерживает имущественное значение.
theological_decisions:
- issue: Характер благополучия нечестивых
  choice: всегда безмятежны
  alternative: навеки обеспечены
  rationale: Перевод сохраняет наблюдаемую длительность их благополучия, но не превращает жалобу псалмопевца в богословское утверждение об их окончательной вечной безопасности.
