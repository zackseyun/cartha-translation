  terminology: «Яхве» корректно передаёт тетраграмматон. «Человек» для אָדָם и אִישׁ не вносит неосновательного акцента на поле и сохраняет единственное число. «Насилие» верно передаёт חֲמָסִים как интенсивное/обобщённое понятие.
