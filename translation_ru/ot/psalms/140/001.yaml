source:
  edition: WLC
  text: חַלְּצֵ֣/נִי יְ֭הוָה מֵ/אָדָ֣ם רָ֑ע מֵ/אִ֖ישׁ חֲמָסִ֣ים תִּנְצְרֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/001.yaml
  text: Rescue me[a], O Yahweh, from the evil man; guard me from the violent man.
translation:
  language: ru
  text: Избавь меня[a], Яхве, от злого человека; охрани меня от человека, творящего насилие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Спаси меня».'
    reason: Лексическая альтернатива для חַלְּצֵנִי, которое может означать как избавление, так и спасение из опасности.
lexical_decisions:
- source_word: חַלְּצֵנִי
  choice: Избавь меня
  rationale: Побудительная форма породы hифиль с суффиксом 1-го лица передаёт настоятельную просьбу вызволить из опасности. «Избавь меня» естественно и точно выражает значение глагола חלץ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: מֵאָדָם רָע
  choice: от злого человека
  rationale: В параллелизме с אִישׁ речь идёт о враждебном человеке; русский язык не выражает определённость артиклем, поэтому двусмысленность между конкретным и типичным злодеем сохраняется контекстом.
- source_word: מֵאִישׁ חֲמָסִים
  choice: от человека, творящего насилие
  rationale: Оборот сохраняет существительное חֲמָסִים со значением насилия и звучит по-русски естественнее буквального «человек насилия».
- source_word: תִּנְצְרֵנִי
  choice: охрани меня
  rationale: Глагол נצר означает хранить, оберегать, сохранять. «Охрани меня» отличает продолжающуюся защиту от первоначального избавления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет это имя и не подменяет его титулом.
- issue: Передача אָדָם и אִישׁ в мужском единственном числе
  choice: человек
  alternative: мужчина
  rationale: В данном контексте оба слова обозначают отдельного злодея, но акцент на его поле отсутствует. «Человек» сохраняет единственное число и не добавляет излишнего смыслового оттенка.
- issue: Число и абстрактное значение חֲמָסִים
  choice: творящего насилие
  alternative: жестокого человека
  rationale: Форма множественного числа может усиливать или обобщать понятие насилия. Выбранный оборот сохраняет его как существительное и не сужает смысл до черты характера.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической сжатостью. Обращение «Яхве» выделено запятыми; параллелизм двух просьб сохранён.
