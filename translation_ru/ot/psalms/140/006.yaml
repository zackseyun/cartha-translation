lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Я говорю
  rationale: Форма перфекта в поэтическом контексте может передавать утвердительное, актуальное исповедание; настоящее время естественно по-русски и соответствует контексту молитвы.
- source_word: לַיהוָה / יְהוָה
  choice: Господу / Господи
  rationale: Тетраграмматон передан традиционным русским библейским эквивалентом «Господь»; во втором случае употреблён звательный по функции именительный «Господи».
- source_word: הַאֲזִינָה
  choice: Услышь
  rationale: Императив означает внимательное слушание; «услышь» естественно выражает молитвенную просьбу без избыточного уточнения.
- source_word: קוֹל תַּחֲנוּנָי
  choice: голос моих молений
  rationale: Сохранён образ «голоса» и множественное число существительного, обозначающего мольбы о милости.
theological_decisions:
- issue: Временная отнесённость исповедания אָמַרְתִּי
  choice: Я говорю
  alternative: Я сказал
  rationale: Возможны прошедшее время и перформативно-настоящее значение. В данном молитвенном высказывании настоящее время сохраняет актуальность исповедания и не вводит дополнительной временной дистанции.
translation_notes:
  register: Современный литературный русский язык с dignified молитвенным звучанием; сохранены параллелизм, прямое обращение и образность еврейского текста.
