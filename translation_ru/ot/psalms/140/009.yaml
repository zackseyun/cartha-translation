lexical_decisions:
- source_word: רֹאשׁ
  choice: глава
  rationale: Сохраняет единственное число и конкретный образ еврейского текста. Именительная конструкция с тире передаёт вынесенную тему сжатой фразы, не превращая «главу» без достаточных оснований в «главы» или «вождя».
- source_word: מְסִבָּי
  choice: окружающих меня
  rationale: Естественно передаёт причастную форму от סבב с суффиксом первого лица и сохраняет образ враждебного окружения, не уточняя его как формальную осаду.
- source_word: עֲמַל
  choice: зло
  rationale: В сочетании с «устами» обозначает причиняемый речью вред или злой умысел. «Зло» звучит по-русски естественнее буквального «тягота» и сохраняет широкий отрицательный смысл.
- source_word: שְׂפָתֵימוֹ
  choice: их уст
  rationale: Сохраняет буквальный поэтический образ губ/уст и конструкцию принадлежности. «Уста» уместны в достоинственном поэтическом регистре Псалтири.
- source_word: יכסומו
  choice: пусть … покроет их
  rationale: Передаёт глагол כסה «покрывать» как пожелание-проклятие, соответствующее молитвенному контексту, и сохраняет местоименный объект множественного числа «их».
theological_decisions:
- issue: Синтаксис фразы и характер высказывания
  choice: 'Единственное число «глава» оставлено вынесенной темой, а глагол передан как пожелание: «пусть … покроет их».'
  alternative: «Пусть головы окружающих меня покроет зло их уст» либо индикативное «зло их уст покроет их».
  rationale: Масоретский текст сжат и синтаксически неоднозначен. Единственное число רֹאשׁ следует сохранять в основном тексте, тогда как контекст поддерживает не предсказание, а просительное пожелание воздаяния.
