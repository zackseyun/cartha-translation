translation:
  language: ru
  text: Они наточили язык свой, как у змеи[a]; под их губами — яд ядовитой змеи[b]. Села[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как змея». Сравнение может относиться к языку либо к действию «наточили».'
    reason: ambiguity
  - marker: b
    text: 'Еврейское название ядовитой змеи; точный вид неизвестен. Возможны переводы: «гадюка», «аспид».'
    reason: lexical_alternative
  - marker: c
    text: «Села» — вероятно, литургическая или музыкальная помета; её точное значение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: שָֽׁנֲנ֣וּ
  choice: изострили
  rationale: Пиэль глагола שׁנן означает «точить, заострять». «Изострили» сохраняет образ намеренно сделанной опасной речи и звучит уместно в поэтическом регистре.
- source_word: לְשׁוֹנָם
  choice: свой язык
  rationale: В еврейском стоит единственное число с суффиксом 3-го лица множественного числа. Русское собирательное «свой язык» естественно передаёт форму оригинала.
- source_word: כְּמוֹ נָחָשׁ
  choice: как змея
  rationale: נָחָשׁ — общее обозначение змеи; перевод не уточняет вид и не привносит лишних ассоциаций.
- source_word: חֲמַת
  choice: яд
  rationale: Хотя חֵמָה может означать ярость, в сочетании с ядовитой змеёй слово обозначает яд.
- source_word: עַכְשׁוּב
  choice: гадюки
  rationale: Точный вид ядовитой змеи неизвестен. «Гадюка» — ясное современному читателю родовое обозначение в данном образе; неопределённость отмечена в сноске.
- source_word: תַּחַת שְׂפָתֵימוֹ
  choice: под их губами
  rationale: Сохраняется краткая безглагольная конструкция оригинала и образ скрытого смертоносного содержания речи.
- source_word: סֶלָה
  choice: Села
  rationale: Неясный, вероятно литургический или музыкальный термин передан транслитерацией, а не истолкован.
