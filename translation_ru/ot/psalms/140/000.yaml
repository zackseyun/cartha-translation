  rationale: Родительный падеж сохраняет свойственную еврейскому надписанию широту связи с Давидом, не сводя её исключительно к авторству или посвящению.
theological_decisions:
- issue: Характер связи псалма с Давидом в надписании
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида
  rationale: Еврейское לְדָוִד допускает авторство, принадлежность, связь или посвящение. Традиционная русская формулировка сохраняет эту неоднозначность и не усиливает историческое утверждение.
translation_notes:
  register: Краткое, dignified надписание в современном литературном русском. Формула «Руководителю хора» понятна современному читателю и передаёт функцию адресата без архаизма; маркер сноски поставлен непосредственно после слов «Псалом Давида», к которым относится пояснение.
