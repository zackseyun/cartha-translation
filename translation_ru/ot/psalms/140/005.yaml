  yaml_path: translation/ot/psalms/140/005.yaml
  text: The proud have hidden a trap for me[a], and with cords they have spread a net beside the path; they have set snares for me[c][b]. Selah
translation:
  language: ru
  text: Гордецы спрятали для меня ловушку и верёвки; раскинули сеть у тропы; расставили для меня силки. Села[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Села» — вероятно, богослужебная или музыкальная помета; её точное значение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: טָמְנוּ
  choice: спрятали
  rationale: Глагол означает «прятать, скрывать» и здесь передаёт образ тайно устроенной ловушки.
- source_word: גֵאִים
  choice: гордецы
  rationale: Слово обозначает гордых, надменных людей; «гордецы» кратко и естественно передаёт нравственную характеристику без добавления указания на пол.
- source_word: פַּח
  choice: ловушку
  rationale: Обозначает ловушку или западню; выбранное слово сохраняет охотничий образ и отличается от последующего מֹקְשִׁים.
- source_word: וַחֲבָלִים
  choice: и верёвки
  rationale: Буквально «и верёвки/шнуры». Сочинительная связь с «ловушкой» сохранена, поскольку синтаксис допускает понимание верёвок как отдельного спрятанного предмета; инструментальное толкование «верёвками раскинули сеть» не навязывается.
- source_word: פָּרְשׂוּ רֶשֶׁת
  choice: раскинули сеть
  rationale: Обычное сочетание со значением «раскинуть, растянуть сеть»; по-русски естественно в контексте ловли.
- source_word: לְיַד מַעְגָּל
  choice: у тропы
  rationale: לְיַד означает «возле, рядом с», а מַעְגָּל — путь, колею или тропу; перевод сохраняет пространственный образ засады возле маршрута.
- source_word: מֹקְשִׁים
  choice: силки
  rationale: Слово обозначает западни или ловушки; «силки» сохраняет образ ловли и позволяет избежать однообразного повтора слова «ловушка».
- source_word: שָׁתוּ
  choice: расставили
  rationale: Глагол означает «положить, поставить»; «расставили силки» — естественное русское сочетание.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неизвестно; вероятно, это богослужебная или музыкальная помета, поэтому он передан транслитерацией.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического охотничьего образа. Порядок образов и неоднозначная связь слова «верёвки» с окружающими членами предложения переданы максимально близко к еврейскому тексту; пунктуация позволяет читать «верёвки» вместе со спрятанной ловушкой.
