base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/013.yaml
  text: Surely the righteous will give thanks to your name[a]; the upright will dwell before your face.
translation:
  language: ru
  text: Поистине, праведные будут воздавать благодарность Твоему имени; честные будут пребывать пред лицом Твоим[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Твоём присутствии». Буквально: «пред лицом Твоим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Поистине
  rationale: Частица выражает уверенное, emphатическое заключение, а не ограничение со значением «только»; «поистине» сохраняет торжественность без чрезмерной архаичности.
- source_word: צַדִּיקִים
  choice: праведные
  rationale: Субстантивированное прилагательное во множественном числе; традиционное и понятное обозначение людей, поступающих праведно.
- source_word: יוֹדוּ
  choice: будут благодарить
  rationale: Форма породы хифиль от ידה в псалмах обычно обозначает благодарение или хвалу; «благодарить» сохраняет основной смысл данного контекста.
- source_word: לִשְׁמֶךָ
  choice: Твоё имя
  rationale: Сохраняется направленность благодарения к Божьему имени, хотя русский глагол не требует передачи еврейского предлога отдельным словом.
- source_word: יֵשְׁבוּ
  choice: будут жить
  rationale: Глагол может означать «сидеть», «обитать», «пребывать». Здесь речь идёт об устойчивой жизни в Божьем присутствии; «будут жить» звучит естественно и не сводит образ к позе.
- source_word: יְשָׁרִים
  choice: прямодушные
  rationale: Субстантивированное прилагательное обозначает нравственно прямых, честных людей; «прямодушные» отличает его от уже употреблённого слова «праведные».
- source_word: אֶת פָּנֶיךָ
  choice: пред лицом Твоим
  rationale: Буквально сохранён конкретный еврейский образ лица как выражения личной близости и присутствия Бога.
theological_decisions:
- issue: Антропоморфный образ Божьего лица
  choice: пред лицом Твоим
  alternative: в Твоём присутствии; пред Тобой
  rationale: Буквальный образ сохраняет поэтическое и богословское выражение близости к Богу, не сводя его молча к абстрактному понятию присутствия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Инверсия «пред лицом Твоим» сохраняет поэтический ритм и образность оригинала.
