lexical_decisions:
- source_word: ידעת
  choice: Я знаю
  rationale: Хотя масоретская огласовка соответствует форме 2-го лица мужского рода единственного числа («ты знаешь»), древние переводы и роль стиха как заключительного исповедания псалмопевца поддерживают чтение «я знаю». Неоднозначность отмечена в сноске.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание знания и естественно передаётся русским изъяснительным «что».
- source_word: יַעֲשֶׂה ... דִּין
  choice: отстоит дело
  rationale: Буквально сочетание означает «сделает дело/тяжбу», но в судебном контексте выражает защиту и поддержание правого дела. «Отстоит дело» сохраняет юридический оттенок и звучит естественно по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: עָנִי
  choice: угнетённого
  rationale: В контексте псалма слово обозначает страдающего от насилия и притеснения; «угнетённый» точнее передаёт эту уязвимость, чем исключительно экономическое «бедный».
- source_word: מִשְׁפַּט
  choice: справедливости
  rationale: Здесь слово обозначает справедливое судебное решение или восстановление прав; конструкция «добьётся справедливости» ясно передаёт действенное правосудие.
- source_word: אֶבְיוֹנִים
  choice: нуждающихся
  rationale: Слово обозначает бедных и нуждающихся; данный выбор сохраняет множественное число и параллелизм с угнетённым.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому сохранено личное имя в распространённой научной русской передаче без замены титулом.
- issue: Кто выражает знание в начале стиха
  choice: Я знаю
  alternative: Ты знаешь
  rationale: 'Основной текст следует древним переводам и контексту заключительного исповедания, но масоретская форма не исправляется молча: чтение «Ты знаешь» явно приведено в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Судебная образность сохранена словами «отстоит дело» и «добьётся справедливости»; синтаксис сделан ясным для обычного читателя.
