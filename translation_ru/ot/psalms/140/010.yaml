base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/010.yaml
  text: Let burning coals fall on them[a]; let him cast them into the fire, into deep pits[b], never to rise again.
translation:
  language: ru
  text: Да обрушатся на них горящие угли[a]; пусть он низринет их в огонь, в глубокие ямы[b], так что им уже не подняться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть на них обрушат угли». Еврейский глагол может означать причинение падения или низвержение чего-либо.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в бездны» либо «в водные глубины». Еврейское слово встречается редко, и его точный оттенок неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ימיטו
  choice: Да обрушатся
  rationale: 'Форма имеет причинительное значение и в контексте выражает пожелание или проклятие: угли должны быть обрушены на нечестивых. Возвратная конструкция естественна по-русски и не называет неуказанного деятеля; возможный более буквальный причинительный перевод отмечен в сноске.'
- source_word: עֲלֵיהֶם
  choice: на них
  rationale: Прямое и естественное соответствие предлогу על с местоименным суффиксом.
- source_word: גֶּחָלִים
  choice: горящие угли
  rationale: Существительное обозначает угли или раскалённые головни; определение «горящие» ясно передаёт образ в непосредственном контексте огня.
- source_word: בָּאֵשׁ
  choice: в огонь
  rationale: 'При глаголе причинённого падения предложная группа естественно передаёт направление: низринуть в огонь.'
- source_word: יַפִּלֵם
  choice: пусть он низринет их
  rationale: 'Причинительная форма 3-го лица единственного числа с объектным суффиксом передана глаголом «низринет». Местоимение «он» сохранено со строчной буквы: вероятный божественный деятель остаётся подразумеваемым, как и в еврейском тексте.'
- source_word: בְּמַהֲמֹרוֹת
  choice: в глубокие ямы
  rationale: Редкое слово, точное значение которого неясно, по контексту обозначает гибельные углубления или глубины. «Глубокие ямы» сохраняет конкретный образ падения; иные возможности приведены в сноске.
- source_word: בַּל
  choice: уже не
  rationale: Отрицательная частица выражает окончательный результат; сочетание «уже не» естественно передаёт невозможность последующего восстановления.
- source_word: יָקוּמוּ
  choice: подняться
  rationale: קום значит «встать, подняться». После низвержения в огонь и ямы инфинитив «подняться» передаёт образ необратимого падения.
theological_decisions:
- issue: Проклятие о суде и подразумеваемый субъект глагола единственного числа
  choice: Сохранить молитвенное пожелание суда и формулировку «пусть он низринет», не называя Бога прямо.
  alternative: 'Передать безлично: «пусть их низринут»; либо пояснить субъект: «пусть Бог низринет их».'
  rationale: Еврейский текст переходит от формы множественного числа к форме единственного числа; субъект последней, вероятно, Бог, но прямо он не назван. Строчное «он» сохраняет грамматическое число и не устраняет заложенную в тексте неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенными глаголами «обрушатся» и «низринет», уместными для поэтической молитвы о суде. Синтаксис остаётся ясным для обычного читателя; редкость исходного слова и неопределённость деятеля не сглажены.
