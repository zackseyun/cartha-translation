lexical_decisions:
- source_word: אֲשֶׁר
  choice: которые
  rationale: Относительная частица продолжает описание злых людей; русское «которые» естественно связывает стих с предшествующим контекстом.
- source_word: חָשְׁבוּ
  choice: замышляют
  rationale: Глагол обозначает намеренное обдумывание и составление злых планов, а не просто мыслительную деятельность.
- source_word: רָעוֹת
  choice: зло
  rationale: Форма множественного числа обозначает злые или пагубные замыслы и дела; собирательное русское «зло» звучит естественно и сохраняет нравственный смысл.
- source_word: בְּלֵב
  choice: в сердце
  rationale: Сохранён древнееврейский антропологический образ сердца как средоточия мысли и намерения; единственное число соответствует форме источника и поэтически относится ко всей группе.
- source_word: כָּל יוֹם
  choice: весь день
  rationale: Передаёт временное выражение буквально и естественно, подчёркивая непрерывность действий.
- source_word: יָגוּרוּ
  choice: разжигают
  rationale: Трудный глагол в сочетании с «войнами» и в параллели со злым умыслом вероятно указывает на возбуждение или провоцирование столкновений; «разжигают» естественно сочетается с «войны».
- source_word: מִלְחָמוֹת
  choice: войны
  rationale: Сохраняет прямое значение существительного и его множественное число, не ослабляя поэтической силы образа.
