id: PSA.140.8
reference: Psalms 140:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַל תִּתֵּ֣ן יְ֭הוָה מַאֲוַיֵּ֣י רָשָׁ֑ע זְמָמ֥/וֹ אַל תָּ֝פֵ֗ק יָר֥וּמוּ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/008.yaml
  text: O Yahweh[a], do not grant the desires of the wicked; do not advance his scheme, lest they be exalted[b]. Selah
translation:
  language: ru
  text: 'Не исполняй, Яхве, желаний нечестивого;

    не дай осуществиться его замыслу[a],

    чтобы они не вознеслись[b]. Села.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не продвигай его замысел»; возможно также: «не доводи его замысел до исполнения». Значение еврейского глагола здесь не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, по смысловому согласованию с единственным числом: «чтобы он не вознёсся». В еврейском тексте глагол стоит во множественном числе: «они вознеслись».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма «Яхве» общепринята в современной русской библеистике.
- source_word: מַאֲוַיֵּי
  choice: желаний
  rationale: Нейтрально и естественно передаёт желания или стремления; отрицательная нравственная окраска задаётся словом «нечестивого».
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Сохраняет грамматическое единственное число и обычное для псалмов обозначение человека, противящегося Божьей правде.
- source_word: זְמָמוֹ
  choice: его замыслу
  rationale: «Замысел» допускает подразумеваемый злой умысел, но не усиливает его до однозначно злодейской «интриги».
- source_word: תָּפֵק
  choice: не дай осуществиться
  rationale: Глагол в данном месте труден; выбранная формулировка естественно передаёт просьбу не продвигать и не доводить замысел до исполнения, не утверждая более точного значения, чем позволяет контекст.
- source_word: יָרֻמוּ
  choice: они не вознеслись
  rationale: Сохранено множественное число масоретской формы, несмотря на предшествующие формы единственного числа; «вознеслись» может обозначать возвышение вследствие успеха или торжество.
- source_word: סֶלָה
  choice: Села
  rationale: Термин транслитерирован, поскольку его точное значение и литургическая функция остаются неясными.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Личное имя сохранено в тексте, а не заменено титулом; «Яхве» ближе к принятой научной реконструкции произношения.
- issue: Переход от единственного числа к множественному в заключительной фразе
  choice: 'Сохранить множественное число: «они не вознеслись»'
  alternative: 'Согласовать с ближайшим субъектом: «он не вознёсся»'
  rationale: 'Масоретский текст содержит глагол во множественном числе. Сохранение числа удерживает подлинную неоднозначность: речь может расширяться от одного нечестивого к его сторонникам или нечестивым вообще.'
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Параллелизм сохранён; трудный глагол передан естественной конструкцией без устранения лексической неопределённости, а необычная смена числа сохранена и пояснена в сноске.
