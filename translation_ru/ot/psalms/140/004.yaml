  text: שָׁמְרֵ֤/נִי יְהוָ֨ה מִ֘/ידֵ֤י רָשָׁ֗ע מֵ/אִ֣ישׁ חֲמָסִ֣ים תִּנְצְרֵ֑/נִי אֲשֶׁ֥ר חָ֝שְׁב֗וּ לִ/דְח֥וֹת פְּעָמָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/140/004.yaml
  text: Keep me[a], O Yahweh, from the hands of the wicked; guard me from the violent man[b], who has planned to trip up my feet.
translation:
  language: ru
  text: Сохрани меня, Яхве, от рук нечестивца[a]; убереги меня от человека насилия — от тех, кто замыслил сбить меня с ног[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от рук нечестивых». Еврейское слово стоит в единственном числе, но может иметь собирательное значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «оттеснить мои шаги»; возможный смысл: «поколебать мои шаги» или «низринуть меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Сохрани меня
  rationale: Императив שׁמר выражает просьбу о защите. «Сохрани меня» естественно и достойно звучит по-русски и образует смысловой параллелизм со следующим «убереги меня».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет форму исходного текста, а не заменяет её титулом.
- source_word: מִידֵי רָשָׁע
  choice: от рук нечестивца
  rationale: Сохраняется еврейский образ рук как власти или силы, а морфологически единственное число רָשָׁע передано существительным «нечестивец»; возможное собирательное значение отмечено в сноске.
- source_word: מֵאִישׁ חֲמָסִים
  choice: от человека насилия
  rationale: Конструкция сохраняет единственное число אִישׁ и интенсивно-абстрактный смысл חֲמָסִים. Формулировка намеренно несколько образна, но понятна и ближе к еврейскому сочетанию, чем просто «жестокий человек».
- source_word: תִּנְצְרֵנִי
  choice: убереги меня
  rationale: נצר здесь означает охранять и оберегать. «Убереги» естественно передаёт повторную мольбу о защите, не создавая тяжеловесного дословного повтора.
- source_word: אֲשֶׁר חָשְׁבוּ
  choice: от тех, кто замыслил
  rationale: Глагол חָשְׁבוּ стоит во множественном числе, несмотря на предшествующие формы единственного числа. «От тех, кто» сохраняет этот переход к множественности и не исправляет напряжение исходного текста молча.
- source_word: לִדְחוֹת פְּעָמָי
  choice: сбить меня с ног
  rationale: דחה обозначает отталкивание или низвержение, а פְּעָמָי — стопы либо шаги. Русский оборот ясно и естественно передаёт образ намеренно вызванного падения; более буквальный вариант приведён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя сохраняется как имя, без замены традиционным титулом.
- issue: Смена числа между רָשָׁע / אִישׁ и חָשְׁבוּ
  choice: 'Единственное число в обозначениях противника и множественное в относительной конструкции: «нечестивца… человека насилия — от тех, кто замыслил»'
  alternative: 'Согласовать всё в единственном числе: «который замыслил»'
  rationale: 'Еврейский текст действительно переходит от грамматически единственных обозначений к глаголу множественного числа. Перевод сохраняет эту неоднозначность: речь может идти о собирательно представленном круге врагов либо о нескольких противниках.'
- issue: Образ לִדְחוֹת פְּעָמָי
  choice: сбить меня с ног
  alternative: поколебать мои стопы / низринуть мои шаги
  rationale: Выбран естественный русский образ физического падения, который не требует решать, идёт ли речь буквально о стопах или метафорически о жизненном пути.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Синтаксис остаётся ясным для обычного читателя; тире помогает передать резкий переход исходника от единственного числа к множественному. Словосочетание «человек насилия» сохранено как выразительный семитский образ, не становясь архаизмом.
