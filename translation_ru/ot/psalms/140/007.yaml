  yaml_path: translation/ot/psalms/140/007.yaml
  text: O Yahweh[a], my Lord, the strength of my salvation, you have covered my head in the day of battle.
translation:
  language: ru
  text: О Яхве, Владыка мой, сила моего спасения! Ты укрыл мою голову в день битвы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в день оружия»; еврейское выражение, вероятно, означает время вооружённого столкновения, поэтому в основном тексте — «в день битвы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהֹוִה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном; форма прямого обращения сохранена частицей «О».
- source_word: אֲדֹנָי
  choice: мой Владыка
  rationale: Форма содержит суффикс первого лица единственного числа («мой»). «Владыка» естественно передаёт אֲדֹנָי и позволяет отличить титул от стоящего рядом имени Яхве.
- source_word: עֹז יְשׁוּעָתִי
  choice: сила моего спасения
  rationale: Сохранена конструкция, в которой עֹז обозначает силу, а יְשׁוּעָתִי — спасение или избавление псалмопевца.
- source_word: סַכֹּתָה
  choice: Ты укрывал
  rationale: Глагол סכך означает покрывать, укрывать, защищать. «Укрывал» сохраняет конкретный образ защиты и естественно звучит как описание Божьего действия в период битвы.
- source_word: לְרֹאשִׁי
  choice: мою голову
  rationale: После русского глагола «укрывать» винительный падеж естественно передаёт защищаемую часть тела и сохраняет образ еврейского текста.
- source_word: בְּיוֹם נָשֶׁק
  choice: в день битвы
  rationale: Буквально выражение связано с «днём оружия», но в контексте обозначает время вооружённого столкновения; более буквальная возможность отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом; следующий титул אֲדֹנָי при этом отдельно передан словом «Владыка».
- issue: Характер выражения «сила моего спасения»
  choice: Сохранён образ силы, принадлежащей спасению или обеспечивающей его
  alternative: «моя спасительная сила» или «крепость моего избавления»
  rationale: Более буквальная именная конструкция сохраняет широту связи между Божьей силой и спасением, не сводя её исключительно к крепости, победе или одному военному избавлению.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Восклицательный знак после именного обращения помогает естественно оформить длинную вокативную конструкцию; конкретный защитный образ сохранён без излишнего толкования.
