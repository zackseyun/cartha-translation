base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/006.yaml
  text: Will you not return and revive us[b][a], so that your people may rejoice in you?
translation:
  language: ru
  text: Неужели Ты не вернёшься[a] и не оживишь нас[b], чтобы Твой народ находил радость в Тебе?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обратишься ли снова». При другом синтаксическом понимании: «не оживишь ли Ты нас снова?»'
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: 'Или: «не вернёшь ли нас к жизни», «не дашь ли нам вновь жить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Неужели ... не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и сохраняет тон исполненной надежды просьбы.
- source_word: תָּשׁוּב
  choice: вернёшься
  rationale: Сохраняет основной образ глагола שוב — возвращение или поворот назад, не добавляя прямо отсутствующих в еврейском тексте слов «к нам» или «с благоволением».
- source_word: תְּחַיֵּנוּ
  choice: оживишь нас
  rationale: Каузативное значение породы пиэль от חיה выражает возвращение к жизни или наделение жизнью; русский глагол не сужает смысл до одной лишь духовной либо политической сферы.
- source_word: וְעַמְּךָ
  choice: чтобы Твой народ
  rationale: Союз передан как связь цели или результата с предшествующей просьбой; выражение «Твой народ» сохраняет язык принадлежности Богу и заветных отношений.
- source_word: יִשְׂמְחוּ
  choice: радовался
  rationale: Форма имперфекта в данном контексте выражает желаемый результат; сослагательная конструкция с «чтобы» естественно передаёт этот оттенок по-русски.
- source_word: בָךְ
  choice: Тебе
  rationale: При глаголе радости предлог ב обозначает того, в ком или о ком находят радость. Дательный падеж после «радоваться» звучит естественно в современном русском и сохраняет Бога как средоточие радости.
theological_decisions:
- issue: Следует ли пояснить, что Божье «возвращение» означает возвращение к народу с благоволением
  choice: В основном тексте оставлено более широкое «вернёшься»
  alternative: «снова обратишься к нам» или «вновь явишь нам благоволение»
  rationale: Контекст допускает и, вероятно, предполагает возвращение Божьего благоволения, однако дополнения «к нам» и «с благоволением» в еврейском тексте прямо не выражены.
- issue: Относится ли «оживишь нас» только к духовному обновлению
  choice: Смысл не сужен и оставлен широким
  alternative: «духовно обновишь нас» или «восстановишь жизнь нашего народа»
  rationale: Общинная молитва говорит о восстановлении после суда, но еврейская формулировка может охватывать духовное, общественное и общее жизненное возрождение.
- issue: Синтаксическая связь תָּשׁוּב с תְּחַיֵּנוּ
  choice: 'Переданы как два связанных действия: «вернёшься и не оживишь»'
  alternative: «не оживишь ли нас снова»
  rationale: Форму תָּשׁוּב можно понимать либо как самостоятельное «вернёшься», либо наречно — «снова». Основной текст следует масоретическому членению и сохраняет образ Божьего возвращения, а альтернативный синтаксис отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью без архаизмов. Риторический вопрос сохранён. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской практикой.
