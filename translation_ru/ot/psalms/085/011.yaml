  text: אֱ֭מֶת מֵ/אֶ֣רֶץ תִּצְמָ֑ח וְ֝/צֶ֗דֶק מִ/שָּׁמַ֥יִם נִשְׁקָֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/011.yaml
  text: Truth will spring up from the earth[b][a], and righteousness will look down from heaven.
translation:
  language: ru
  text: Истина прорастёт из земли[a], и праведность[b] взглянет с небес.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Верность прорастёт из земли».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֶת
  choice: истина
  rationale: Слово может обозначать истину, верность и надёжность. «Истина» естественно сочетается здесь с «праведностью» как отвлечённое нравственное качество; значение «верность» сохранено в сноске.
- source_word: מֵאֶרֶץ
  choice: из земли
  rationale: אֶרֶץ может означать как землю вообще, так и конкретную страну. Вертикальная параллель с «небесами» и образ прорастания указывают здесь на «землю».
- source_word: תִּצְמָח
  choice: прорастёт
  rationale: Глагол описывает появление и рост растения. «Прорастёт» сохраняет земледельческую метафору и звучит ясно в современной русской поэзии.
- source_word: צֶדֶק
  choice: праведность
  rationale: Слово охватывает значения праведности и справедливости. В основном тексте выбрана «праведность» как нравственное качество, параллельное истине; «справедливость» дана в сноске.
- source_word: מִשָּׁמַיִם
  choice: с небес
  rationale: Форма שָׁמַיִם обозначает небо или небеса. Русское «с небес» сохраняет возвышенный поэтический регистр и пространственный контраст с землёй.
- source_word: נִשְׁקָף
  choice: взглянет
  rationale: Нифаль глагола שׁקף передаёт взгляд или наблюдение сверху. «Взглянет с небес» сохраняет олицетворение и направление взгляда без тяжеловесного уточнения.
theological_decisions:
- issue: Передача צֶדֶק в нравственно насыщенном поэтическом контексте
  choice: праведность
  alternative: справедливость
  rationale: Еврейское слово допускает оба значения. «Праведность» лучше передаёт названное отвлечённое нравственное качество в параллели с истиной, однако возможное общественно-правовое значение не устраняется и сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Сохранены параллелизм земли и небес, растительная метафора и олицетворение праведности.
