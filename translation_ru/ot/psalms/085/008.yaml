id: PSA.85.8
reference: Psalms 85:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֶשְׁמְעָ֗ה מַה יְדַבֵּר֮ הָ/אֵ֪ל יְה֫וָ֥ה כִּ֤י יְדַבֵּ֬ר שָׁל֗וֹם אֶל עַמּ֥/וֹ וְ/אֶל חֲסִידָ֑י/ו וְֽ/אַל יָשׁ֥וּבוּ לְ/כִסְלָֽה־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/008.yaml
  text: I will hear what God Yahweh will speak[a], for he will speak peace to his people and to his faithful ones[b]; but let them not turn back to folly.
translation:
  language: ru
  text: 'Послушаю, что скажет Бог, Яхве: Он возвестит мир Своему народу и Своим верным[a] — но пусть они не возвращаются к безрассудству[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своим святым»; или: «Своим благочестивым».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к глупости». Менее вероятное понимание: «к самоуверенности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשְׁמְעָה
  choice: Послушаю
  rationale: Когортативная форма выражает решимость или намерение говорящего. «Послушаю» естественно передаёт волевой оттенок и сознательное внимание к Божьей речи.
- source_word: מַה יְדַבֵּר
  choice: что скажет
  rationale: Имперфект указывает на предстоящую речь Бога. «Что скажет» звучит естественно по-русски и сохраняет направленность в будущее.
- source_word: הָאֵל יְהוָה
  choice: Бог, Яхве
  rationale: 'Сохраняются оба элемента еврейского выражения: обозначение Бога אֵל и личное имя יהוה. Приложение через запятую естественно для современного русского языка.'
- source_word: כִּי יְדַבֵּר שָׁלוֹם
  choice: Он возвестит мир
  rationale: כִּי здесь обосновывает ожидание псалмопевца и может передаваться пунктуационно. Сочетание «возвестит мир» сохраняет буквальный образ речи о мире и звучит достойно и ясно.
- source_word: שָׁלוֹם
  choice: мир
  rationale: «Мир» сохраняет широкий смысл благополучия, целостности и восстановленной гармонии, не сужая еврейское понятие.
- source_word: עַמּוֹ
  choice: Своему народу
  rationale: Прямо передаёт притяжательное отношение; возвратное «Своему» естественно при подлежащем «Он».
- source_word: חֲסִידָיו
  choice: Своим верным
  rationale: חסיד обозначает людей, отличающихся преданностью и благочестием в отношениях с Богом. «Верные» передаёт этот этико-реляционный смысл без позднейшего узкотехнического оттенка слова «святые».
- source_word: וְאַל יָשׁוּבוּ
  choice: но пусть они не возвращаются
  rationale: אַל с имперфектом выражает запрет или увещание. Союз «но» ясно передаёт контраст между Божьим возвещением мира и предупреждением народу.
- source_word: לְכִסְלָה
  choice: к безрассудству
  rationale: Обычное значение существительного — глупость, безрассудство. «Безрассудство» естественно описывает пагубный образ действий, к которому нельзя возвращаться.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон. «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Значение חֲסִידָיו
  choice: Своим верным
  alternative: Своим святым; Своим благочестивым
  rationale: Выбор сохраняет идею преданности Богу и не вводит более позднее техническое понимание «святых».
- issue: Сила заключительной части стиха
  choice: 'увещание: «пусть они не возвращаются»'
  alternative: 'предсказание: «они не возвратятся»'
  rationale: Сочетание אַל с имперфектом убедительно указывает на запретительно-желательное значение. Так сохраняется напряжение между обещанным миром и ответственностью народа не возвращаться к прежнему безрассудству.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Порядок слов и двоеточие подчёркивают переход от намерения псалмопевца слушать к содержанию ожидаемой Божьей речи. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют традиционному благоговейному русскому оформлению.
