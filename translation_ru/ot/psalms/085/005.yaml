  text: הַ/לְ/עוֹלָ֥ם תֶּֽאֱנַף בָּ֑/נוּ תִּמְשֹׁ֥ךְ אַ֝פְּ/ךָ֗ לְ/דֹ֣ר וָ/דֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/005.yaml
  text: Will you be angry with us forever? Will you prolong your anger from generation to generation?[a][b]
translation:
  language: ru
  text: Неужели Ты будешь гневаться на нас[a] вечно? Неужели продлишь Свой гнев из поколения в поколение?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против нас».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будешь тянуть Свой гнев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְעוֹלָם
  choice: вечно
  rationale: Вопросительная частица הַ при לְעוֹלָם образует риторический вопрос о неограниченной длительности; «вечно» естественно и точно передаёт этот смысл.
- source_word: תֶּאֱנַף בָּנוּ
  choice: будешь гневаться на нас
  rationale: 'Глагол אנף прямо обозначает гнев, а בָּנוּ указывает на его объект. По-русски нормативно и естественно: «гневаться на нас».'
- source_word: תִּמְשֹׁךְ
  choice: продлишь
  rationale: משך буквально означает «тянуть, растягивать»; применительно к гневу речь идёт о его продолжительности, что естественно передаётся глаголом «продлить».
- source_word: אַפְּךָ
  choice: Свой гнев
  rationale: אַף буквально означает «нос», а идиоматически — «гнев». Возвратное притяжательное местоимение «Свой» естественно соотносит гнев с подлежащим «Ты».
- source_word: לְדֹר וָדֹר
  choice: из поколения в поколение
  rationale: Устойчивый русский оборот передаёт последовательность сменяющих друг друга поколений и сохраняет протяжённость во времени.
theological_decisions:
- issue: Антропопатический образ Божьего гнева
  choice: Сохранено прямое слово «гневаться» и существительное «гнев».
  alternative: «быть недовольным» или «противиться»
  rationale: Еврейский текст прямо говорит о Божьем гневе; смягчение ослабило бы напряжение плача и внесло бы не обусловленное текстом толкование.
- issue: Соотношение «вечно» и «из поколения в поколение»
  choice: Обе временные формулы сохранены без согласования или богословского сглаживания.
  alternative: Перефразировать обе части как один вопрос о долгом гневе.
  rationale: Параллельные вопросы усиливают плач и оставляют присущее тексту риторическое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. «Неужели» передаёт риторическую силу вопросительной частицы; прописные местоимения в обращении к Богу соответствуют принятому русскому библейскому регистру.
