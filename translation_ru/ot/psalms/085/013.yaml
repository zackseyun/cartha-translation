  source_fidelity: «Праведность пойдёт перед Ним» точно передаёт צֶדֶק לְפָנָיו יְהַלֵּךְ, сохраняя образ персонифицированной праведности. «И проложит путь для Его стоп» следует принятому в английском POB пониманию сжатой и синтаксически спорной второй строки (וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו). Хотя еврейская формулировка буквально допускает также оттенок «сделает его шаги путём», данный вариант не выходит за пределы вероятного смысла и не добавляет самостоятельного богословского утверждения.
