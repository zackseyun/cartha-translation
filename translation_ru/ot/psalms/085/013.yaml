  text: צֶ֭דֶק לְ/פָנָ֣י/ו יְהַלֵּ֑ךְ וְ/יָשֵׂ֖ם לְ/דֶ֣רֶךְ פְּעָמָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/013.yaml
  text: Righteousness will go before him and will make a path for his steps.
translation:
  language: ru
  text: Праведность пойдёт перед Ним и проложит путь для Его стоп.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֶדֶק
  choice: Праведность
  rationale: Сохраняет абстрактное существительное и его персонификацию в еврейском тексте.
- source_word: לְפָנָיו
  choice: перед Ним
  rationale: Естественно передаёт пространственно-образное значение «перед его лицом / впереди него»; прописная буква указывает на Бога по контексту, не добавляя имени, которого в стихе нет.
- source_word: יְהַלֵּךְ
  choice: пойдёт
  rationale: Передаёт породу piel глагола הלך в данном контексте как движение впереди Бога.
- source_word: וְיָשֵׂם לְדֶרֶךְ פְּעָמָיו
  choice: и проложит путь для Его стоп
  rationale: 'Следует наиболее вероятному синтаксическому пониманию: праведность подготавливает путь, по которому Он будет ступать; «стоп» сохраняет поэтический образ פְּעָמָיו.'
theological_decisions:
- issue: Кто действует во второй строке
  choice: 'Подлежащее — «праведность»: она прокладывает путь для Божьих стоп.'
  alternative: Бог обращает Свои стопы на путь / делает Свои стопы путём.
  rationale: Продолжение подлежащего первой строки и масоретская формулировка допускают выбранное чтение; оно также сохраняет параллельный образ праведности, идущей впереди Бога, хотя синтаксис еврейской строки сжат и не вполне однозначен.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтической библейской образностью. Формулировка ясна обычному читателю; архаизмы исключены, кроме уместного поэтического слова «стоп».
