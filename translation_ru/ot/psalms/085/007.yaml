  text: הַרְאֵ֣/נוּ יְהוָ֣ה חַסְדֶּ֑/ךָ וְ֝/יֶשְׁעֲ/ךָ֗ תִּתֶּן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/007.yaml
  text: Show us your steadfast love[a], O Yahweh, and grant us your salvation.
translation:
  language: ru
  text: Покажи[a] нам, Яхве, свою верную любовь и даруй нам своё спасение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Дай нам увидеть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְאֵנוּ
  choice: Покажи нам
  rationale: Побудительная форма породы хифиль от ראה с суффиксом 1-го лица множественного числа буквально означает «дай нам увидеть». Русское «покажи нам» естественно передаёт и каузативный смысл, и силу молитвенного повеления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: חַסְדֶּךָ
  choice: свою верную любовь
  rationale: חסד обозначает неизменную, преданную любовь и милость в отношениях завета. «Верная любовь» передаёт как сердечную привязанность, так и постоянство, не сужая значение до одной лишь милости.
- source_word: וְיֶשְׁעֲךָ
  choice: и своё спасение
  rationale: ישע может означать спасение, избавление или победу. «Спасение» сохраняет широкий смысл Божьего избавления и соответствует молитвенному контексту псалма.
- source_word: תִּתֶּן לָנוּ
  choice: даруй нам
  rationale: Буквально — «дай нам». В обращённой к Богу просьбе «даруй нам» звучит естественно и достойно, сохраняя смысл дарования.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно употреблён тетраграмматон. Транслитерация «Яхве» сохраняет личное имя Бога и не заменяет его титулом.
- issue: Смысл חֶסֶד
  choice: верная любовь
  alternative: милость; любовь завета
  rationale: Выбрано выражение, сохраняющее одновременно любовь, благость и постоянную верность; слово «завет» не добавлено, поскольку в самом стихе оно прямо не названо.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Местоимение «свой» устраняет ненужное повторение и однозначно относится к Яхве; строчная буква соответствует современной нейтральной орфографической практике.
