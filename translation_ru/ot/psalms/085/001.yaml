  text: רָצִ֣יתָ יְהוָ֣ה אַרְצֶ֑/ךָ שַׁ֝֗בְתָּ שבות יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/001.yaml
  text: You have shown favor to your land[a], O Yahweh; you restored the fortunes of Jacob.
translation:
  language: ru
  text: Ты был благосклонен к Твоей земле, Яхве; Ты восстановил благополучие Иакова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты вернул Иакова из плена»; возможно: «Ты возвратил пленников Иакова». Еврейское выражение может означать возвращение из изгнания или, шире, перемену участи к лучшему.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָצִיתָ
  choice: явил благоволение
  rationale: Qal глагола רצה выражает расположение, благосклонность или принятие. «Явил благоволение» естественно передаёт благотворное отношение Бога к земле и сохраняет возвышенный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
- source_word: אַרְצֶךָ
  choice: к Своей земле
  rationale: אֶרֶץ здесь означает землю, принадлежащую Богу и связанную с Ним заветными отношениями; «земля» точнее и менее политизированно, чем «страна».
- source_word: שַׁבְתָּ
  choice: восстановил
  rationale: В сочетании с שׁבות глагол שוב образует устойчивое выражение о возвращении прежнего благополучного состояния или о возвращении из плена.
- source_word: שבות
  choice: благополучие
  rationale: В идиоме שׁוּב שְׁבוּת слово может обозначать общее восстановление участи, а не исключительно буквальное освобождение из плена. «Благополучие» естественно выражает этот широкий смысл по-русски.
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Сохранено данное в еврейском тексте имя; в поэтическом контексте оно собирательно обозначает народ Израиля.
theological_decisions:
- issue: Значение идиомы שׁוּב שְׁבוּת יַעֲקֹב
  choice: восстановил благополучие Иакова
  alternative: вернул пленников Иакова; возвратил Иакова из плена
  rationale: Идиома допускает как широкое понимание — поворот участи к лучшему, — так и конкретный образ возвращения из плена. Основной текст сохраняет широкий смысл, а связанное с изгнанием прочтение приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Местоимение «Ты» и притяжательное «Своей» написаны с прописной буквы как форма благоговейного обращения; синтаксический параллелизм двух частей сохранён.
