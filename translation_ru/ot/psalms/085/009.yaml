  text: אַ֤ךְ קָר֣וֹב לִ/ירֵאָ֣י/ו יִשְׁע֑/וֹ לִ/שְׁכֹּ֖ן כָּב֣וֹד בְּ/אַרְצֵֽ/נוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/009.yaml
  text: Surely his salvation is near to those who fear him[b][a], so that glory may dwell in our land.
translation:
  language: ru
  text: Поистине, спасение Его близко к боящимся Его, чтобы слава обитала в нашей земле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Слава» может означать явленное присутствие Бога или честь, возвращённую земле.
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Поистине
  rationale: Частица здесь выражает уверенное, усиленное утверждение, а не ограничение; «поистине» естественно передаёт эту функцию в возвышенной поэтической речи.
- source_word: קָרוֹב
  choice: близко
  rationale: Сохраняет прямой образ пространственной близости и естественно сочетается со словом «спасение».
- source_word: לִירֵאָיו
  choice: к боящимся Его
  rationale: Передаёт религиозно-заветный смысл страха перед Богом, не сводя его лишь к почтению.
- source_word: יִשְׁעוֹ
  choice: спасение Его
  rationale: Сохраняет широкий смысл избавления и богословскую насыщенность существительного, а также притяжательное отношение исходного текста.
- source_word: לִשְׁכֹּן
  choice: чтобы ... обитала
  rationale: Инфинитив с ל допускает целевое или результирующее понимание; конструкция с «чтобы» естественно передаёт эту связь по-русски.
- source_word: כָּבוֹד
  choice: слава
  rationale: Сохраняет поэтическую и богословскую ёмкость слова, не уточняя преждевременно, имеется ли в виду явленное присутствие Бога или восстановленная честь земли.
- source_word: בְּאַרְצֵנוּ
  choice: в нашей земле
  rationale: В контексте речь идёт о земле народа; «в нашей земле» сохраняет библейский образ и не расширяет значение до всей земли.
theological_decisions:
- issue: К чему относится «слава» (כָּבוֹד)
  choice: Оставлено общее слово «слава» без пояснения референта в основном тексте.
  alternative: Явленное присутствие и слава Бога либо честь и достоинство, возвращённые земле.
  rationale: Древнееврейский текст допускает оба оттенка и не требует однозначно выбирать между ними; перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «спасение Его» и прописное «Его» поддерживают псалмовый регистр; синтаксис остаётся понятным современному читателю.
