- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов слово обозначает человека, ответственного за музыкальное исполнение или руководство им. Дательный падеж естественно передаёт префикс לְ и назначение надписания.
- source_word: לִבְנֵי
  choice: Сынов
  rationale: Конструкция с לְ может указывать на авторство, принадлежность, связь или посвящение. Краткая родительная формула естественна для русского надписания и не уточняет авторство сверх исходного текста.
- source_word: קֹרַח
  choice: Кореевых
  rationale: Традиционная русская форма отчества от имени Корей в выражении «сыны Кореевы»; здесь употреблён современный родительный порядок слов.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Стандартное жанровое обозначение песнопения, связанного с музыкальным исполнением.
