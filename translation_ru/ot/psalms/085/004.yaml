  text: שׁ֭וּבֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ וְ/הָפֵ֖ר כַּֽעַסְ/ךָ֣ עִמָּֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/004.yaml
  text: Restore us[a], God of our salvation, and put away your anger from us.
translation:
  language: ru
  text: Восстанови нас[a], Боже нашего спасения, и отврати от нас Свой гнев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Возврати нас, Боже нашего спасения». Еврейский глагол буквально может означать «дай нам вернуться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבֵנוּ
  choice: Восстанови нас
  rationale: Форма гифиль повелительного наклонения от שוב с суффиксом 1-го лица множественного числа буквально выражает просьбу «возврати нас / дай нам вернуться». В контексте псалма речь идёт о восстановлении народа и Божьего благоволения; «восстанови нас» естественно передаёт этот смысл, не сводя просьбу только к внутреннему покаянию. Более буквальная возможность отмечена в сноске.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Боже нашего спасения
  rationale: Конструкционная цепь буквально означает «Бог нашего спасения». Звательная форма «Боже» естественна для русской молитвенной речи и сохраняет мысль о Боге как источнике спасения.
- source_word: וְהָפֵר
  choice: и отврати
  rationale: Гифиль от פרר может означать «нарушить, отменить, сделать недействующим, прекратить». При дополнении «Твой гнев» русское «отврати» естественно выражает просьбу удалить или прекратить гнев, сохраняя повелительную силу формы.
- source_word: כַּעַסְךָ
  choice: Свой гнев
  rationale: כעס здесь обозначает Божий гнев. Возвратное притяжательное местоимение «Свой» нормативно соотносится с адресатом повеления и звучит естественнее, чем «Твой», при том же смысле.
- source_word: עִמָּנוּ
  choice: от нас
  rationale: Хотя עם обычно значит «с», в сочетании с глаголом прекращения или удаления гнева по-русски требуется «от нас». Перевод «против нас» сильнее истолковывал бы отношение, чем это выражено в еврейском тексте.
theological_decisions:
- issue: Передавать ли начальную просьбу как нравственное обращение народа или как его восстановление Богом
  choice: Восстанови нас
  alternative: Возврати нас / дай нам вернуться
  rationale: Контекст возобновления Божьего благоволения после гнева поддерживает значение восстановления, однако гифиль от שוב также сохраняет идею того, что Бог возвращает народ. Сноска удерживает эту неоднозначность и подчёркивает Божью инициативу, не ограничивая просьбу одной доктринальной трактовкой.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Сохранено традиционно весомое выражение «Боже нашего спасения», но синтаксис остаётся ясным для современного читателя.
