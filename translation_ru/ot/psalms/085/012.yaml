  text: גַּם יְ֭הוָה יִתֵּ֣ן הַ/טּ֑וֹב וְ֝/אַרְצֵ֗/נוּ תִּתֵּ֥ן יְבוּלָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/012.yaml
  text: Indeed[a], Yahweh will give what is good, and our land will yield its produce.
translation:
  language: ru
  text: Да, Яхве даст благо[a], и наша земля даст свой урожай.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что хорошо» или «доброе». Еврейское выражение имеет широкий смысл и в этом контексте может включать как нравственное добро, так и материальные блага.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Да
  rationale: В данном поэтическом контексте частица усиливает уверенность в обещанном, а не просто добавляет ещё один факт; русское «да» естественно передаёт это подтверждение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: יִתֵּן
  choice: даст
  rationale: Имперфект в контексте выражает ожидаемое будущее действие.
- source_word: הַטּוֹב
  choice: благо
  rationale: Субстантивированное прилагательное с артиклем обозначает благо в широком смысле; выбранное слово не ограничивает его только материальными дарами.
- source_word: וְאַרְצֵנוּ
  choice: и наша земля
  rationale: В земледельческом контексте אֶרֶץ означает землю народа; буквальное и естественное русское соответствие сохраняет образ.
- source_word: תִּתֵּן
  choice: даст
  rationale: Повтор глагола «дать» сохранён, поскольку он естественно звучит по-русски и поддерживает поэтический параллелизм между даром Яхве и плодом земли.
- source_word: יְבוּלָהּ
  choice: свой урожай
  rationale: יְבוּל обозначает произведённый землёй урожай или плод; «свой урожай» ясно и естественно передаёт земледельческий смысл и местоименный суффикс.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Объём значения הַטּוֹב
  choice: благо
  alternative: то, что благо; доброе; блага
  rationale: Форма может охватывать как нравственное добро, так и материальное благополучие. Единственное собирательное «благо» сохраняет эту смысловую широту без её богословского сужения.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим звучанием. Повтор «даст… даст» намеренно сохраняет параллелизм еврейской строки; «свой урожай» звучит естественно и ясно.
