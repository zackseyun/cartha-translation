lexical_decisions:
- source_word: נָשָׂאתָ
  choice: простил
  rationale: Глагол буквально означает «поднял, понёс, унёс», но в сочетании с עָוֹן образует устойчивое выражение прощения или снятия вины. «Простил» ясно передаёт смысл, а исходный образ сохранён в сноске.
- source_word: עֲוֺן
  choice: вину
  rationale: Слово может обозначать беззаконие, вину или последствие проступка. В сочетании с נשׂא здесь естественно «вина»; этот выбор также сохраняет отличие от следующего חַטָּאת.
- source_word: עַמֶּךָ
  choice: народа Твоего
  rationale: עַם обозначает народ как общность; форма с суффиксом второго лица передаёт его принадлежность Богу.
- source_word: כִּסִּיתָ
  choice: покрыл
  rationale: Сохранён буквальный поэтический образ покрытия греха, который в данном контексте выражает прощение.
- source_word: כָל
  choice: весь
  rationale: Согласование с собирательно употреблённым существительным в единственном числе сохраняет значение полноты.
- source_word: חַטָּאתָם
  choice: их грех
  rationale: В еврейском тексте стоит единственное число с суффиксом множественного числа; русский собирательный оборот «весь их грех» сохраняет эту форму, хотя по смыслу возможно «все их грехи».
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неизвестно, поэтому он передан традиционной транслитерацией без истолковывающего перевода.
theological_decisions:
- issue: Передача выражения נָשָׂא עָוֹן
  choice: Ты простил вину
  alternative: Ты унёс вину; Ты понёс вину; Ты снял вину
  rationale: В контексте выражение означает Божье прощение и устранение вины. Основной текст передаёт этот смысл прямо, не приписывая глаголу более узкого богословского толкования; буквальный образ отмечен в сноске.
- issue: Число существительного חַטָּאתָם
  choice: весь их грех
  alternative: все их грехи
  rationale: Единственное число оригинала допускает собирательное понимание. Оно сохранено в основном тексте, а естественный распределительный вариант во множественном числе дан в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим строем. Местоимение «Твоего» написано с прописной буквы как обращённое к Богу. Метафора «покрыл» и неистолкованный термин «Села» сохранены.
