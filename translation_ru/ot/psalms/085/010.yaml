  text: חֶֽסֶד וֶ/אֱמֶ֥ת נִפְגָּ֑שׁוּ צֶ֖דֶק וְ/שָׁל֣וֹם נָשָֽׁקוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/085/010.yaml
  text: Steadfast love and truth have met[b][a]; righteousness and peace have kissed.
translation:
  language: ru
  text: Верная любовь и истина[a] встретились; праведность[b] и мир поцеловались.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верность».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: верная любовь
  rationale: Передаёт устойчивую, преданную любовь в отношениях, не сводя значение лишь к чувству или к проявлению жалости.
- source_word: אֱמֶת
  choice: истина
  rationale: Сохраняет основное значение слова и естественно сочетается с «верной любовью»; возможное значение «верность» отмечено в сноске.
- source_word: נִפְגָּשׁוּ
  choice: встретились
  rationale: Совершенный вид и прошедшее время естественно передают еврейский перфект и сохраняют олицетворение названных качеств.
- source_word: צֶדֶק
  choice: праведность
  rationale: Сохраняет нравственно-богословскую широту слова; значение «справедливость» остаётся допустимым и вынесено в сноску.
- source_word: שָׁלוֹם
  choice: мир
  rationale: Наиболее естественный русский эквивалент, допускающий также оттенки целостности и благополучия.
- source_word: נָשָׁקוּ
  choice: поцеловались
  rationale: Передаёт буквальный поэтический образ взаимного поцелуя двух олицетворённых качеств, не ослабляя его пересказом.
theological_decisions:
- issue: Олицетворение заветных и нравственных качеств
  choice: 'Сохранить буквальные поэтические образы: «встретились» и «поцеловались»'
  alternative: 'Истолковывающий пересказ: «соединились в согласии» или «примирились»'
  rationale: В еврейском тексте качества представлены как действующие лица. Буквальная передача сохраняет образность и богословское напряжение, не навязывая более узкого толкования.
translation_notes:
