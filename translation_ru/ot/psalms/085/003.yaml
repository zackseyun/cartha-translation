lexical_decisions:
- source_word: אָסַפְתָּ
  choice: Ты отвёл
  rationale: В сочетании с «гневом» глагол אָסַף имеет переносный смысл удаления или прекращения; «отвёл» естественно передаёт этот смысл, не добавляя идеи раскаяния.
- source_word: כָל
  choice: весь
  rationale: Передаёт полноту устранения гнева.
- source_word: עֶבְרָתֶךָ
  choice: Свой гнев
  rationale: עֶבְרָה обозначает сильный гнев, ярость; «гнев» сохраняет возвышенный псалмический регистр и не перегружает первую строку.
- source_word: הֱשִׁיבוֹתָ
  choice: Ты отвратился
  rationale: Каузативная форма שוב с מן выражает поворот назад или прочь от чего-либо. «Отвратился от» сохраняет образ поворота и допускаемую синтаксисом направленность действия.
- source_word: מֵחֲרוֹן
  choice: от пыла
  rationale: חָרוֹן несёт образ жара, пылания и усиливает выражение гнева; существительное «пыл» естественно сохраняет тепловую метафору.
- source_word: אַפֶּךָ
  choice: ярости Своей
  rationale: אַף буквально связано с «носом», но в данном устойчивом выражении означает гнев. «Ярость» позволяет естественно передать интенсивность сочетания חֲרוֹן אַף.
theological_decisions:
- issue: Антропоморфный и тепловой образ Божьего гнева
  choice: Сохранить образ в выражении «пыл ярости», не сводя его к отвлечённому «сильному гневу».
  alternative: Ты отвёл весь Свой гнев; Ты отошёл от Своей пламенной ярости.
  rationale: Еврейский текст говорит о гневе языком жара и поворота. Такой перевод сохраняет образность и богословское напряжение, не смягчая тему суда и не приписывая Богу эмоционального раскаяния.
- issue: Неоднозначность объекта глагола הֱשִׁיבוֹתָ
  choice: Передать как непереходное по-русски «Ты отвратился от».
  alternative: Ты отвёл пыл ярости Своей.
  rationale: Форма глагола буквально может подразумевать «повернул назад/отвёл», тогда как контекст допускает идиоматическое понимание «отвратился». Основной текст следует древней и контекстуально естественной трактовке, а сноска отмечает альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской издательской традиции. Параллелизм двух полустиший сохранён.
