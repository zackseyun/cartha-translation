  text: You withdrew all your wrath[a]; you turned back from the burning of your anger.
translation:
  language: ru
  text: Ты отвёл всю Свою ярость; Ты отвернулся от пыла Своего гнева.[a]
  philosophy: optimal-equivalence
  footnotes:
