  text: Тогда Он скажет им в Своём гневе и в Своей пылающей ярости приведёт их в ужас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Временное наречие обозначает следующий шаг в развитии событий и естественно передаёт последовательность псалма.
- source_word: יְדַבֵּר
  choice: Он заговорит
  rationale: Имперфект породы пиэль в данном контексте указывает на последующий ответ Бога; совершенный вид «заговорит» естественно передаёт начало этого действия.
- source_word: אֵלֵימוֹ
  choice: с ними
  rationale: Глагол דבר в пиэле с אֶל может естественно передаваться по-русски конструкцией «говорить с кем-либо»; местоимение относится к царям и правителям из предыдущих стихов.
- source_word: בְאַפּוֹ
  choice: в Своём гневе
  rationale: אַף буквально связан с носом, но здесь идиоматически означает гнев; русский перевод сохраняет смысл без неясного буквализма.
- source_word: וּבַחֲרוֹנוֹ
  choice: Своей пылающей яростью
  rationale: חָרוֹן обозначает жар, пыл гнева; «пылающая ярость» сохраняет образ жара и усиление по сравнению с первой фразой.
- source_word: יְבַהֲלֵמוֹ
  choice: приведёт их в ужас
  rationale: Пиэль глагола בהל означает вызвать внезапный страх, смятение или панику; эта формулировка передаёт сильное воздействие Божьего суда естественным современным русским языком.
theological_decisions:
- issue: Антропопатический язык о Божьем гневе
  choice: Сохранить прямое упоминание Божьего гнева и пылающей ярости.
  alternative: Смягчить выражение до «неудовольствия» или безличного «суда».
  rationale: Еврейский текст намеренно изображает личное и решительное противостояние Бога мятежу. Перевод сохраняет эту богословскую напряжённость, не ослабляя и не истолковывая её сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Заглавные буквы в местоимениях, относящихся к Богу, использованы в соответствии с распространённой русской библейской традицией. Параллелизм двух обозначений гнева сохранён, причём второе выражение усилено образом пылающей ярости.
