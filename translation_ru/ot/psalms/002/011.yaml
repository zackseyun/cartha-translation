    text: 'Или: «ликуйте с трепетом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִבְדוּ
  choice: Служите
  rationale: Императив множественного числа от עבד обозначает служение и верность Яхве; «служите» сохраняет широкий смысл, не сужая его только до богослужения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не замена его титулом.
- source_word: בְּיִרְאָה
  choice: со страхом
  rationale: יִרְאָה может означать страх, благоговение или трепетное почтение. Прямая передача «со страхом» сохраняет суровый тон псалма; возможный оттенок благоговения отмечен в сноске.
- source_word: וְגִילוּ
  choice: и радуйтесь
  rationale: גיל означает радоваться, ликовать. «Радуйтесь» естественно звучит по-русски и сохраняет повелительную форму.
- source_word: בִּרְעָדָה
  choice: с трепетом
  rationale: רְעָדָה означает дрожь или трепет, нередко вызванные страхом и благоговением. «С трепетом» сохраняет парадоксальное сочетание радости и страха.
theological_decisions:
- issue: Сочетание радостного отклика и боязливого подчинения
  choice: 'Сохранить оба повеления в их напряжённом сочетании: «Служите Яхве со страхом и радуйтесь с трепетом».'
  alternative: Сгладить сочетание в сторону благоговейной радости либо в сторону ужаса.
  rationale: Еврейский текст непосредственно соединяет страх, радость и трепет, не объясняя их соотношения; перевод не должен устранять это богословское напряжение.
- issue: Передача יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Сохранён параллелизм двух повелений и намеренно не сглажено сочетание радости, страха и трепета.
