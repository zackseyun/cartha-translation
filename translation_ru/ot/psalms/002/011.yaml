  text: Служите Яхве со страхом[a] и радуйтесь с трепетом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с благоговением»; еврейское слово может означать также благоговейный страх перед Богом.'
    reason: lexical_alternative
