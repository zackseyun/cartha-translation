  text: נַשְּׁקוּ בַ֡ר פֶּן יֶאֱנַ֤ף וְ/תֹ֬אבְדוּ דֶ֗רֶךְ כִּֽי יִבְעַ֣ר כִּ/מְעַ֣ט אַפּ֑/וֹ אַ֝שְׁרֵ֗י כָּל ח֥וֹסֵי בֽ/וֹ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/012.yaml
  text: Kiss the son[a], lest he be angry and you perish in the way, for his anger burns quickly[c][b]. Blessed are all who take refuge in him.
translation:
  language: ru
  text: Целуйте сына[a], чтобы он не разгневался и вы не погибли на пути, ведь гнев его вспыхивает быстро[b]. Блаженны все, кто находит прибежище в нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Воздайте почтение сыну». Глагол буквально означает «целуйте» и в царском контексте может обозначать жест покорности или почтения. Слово бар здесь необычно; его обычно понимают как «сын», в соответствии со стихом 7, но предлагались и другие значения, например «чистота» или «чисто».'
    reason: lexical_alternative_and_alternative_reading
  - marker: b
    text: 'Или: «ведь гнев его вскоре запылает»; возможно также: «ведь гнев его немного разгорится». Краткое еврейское выражение может указывать на внезапность или близость вспышки гнева, а также на малую меру или краткость его горения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְּׁקוּ
  choice: Целуйте
  rationale: Сохранён прямой образ глагола נשׁק «целовать»; в царском контексте этот жест выражает покорность и почтение, что отмечено в сноске.
- source_word: בַר
  choice: сына
  rationale: Хотя בַר необычно для еврейского текста и допускает иные толкования, значение «сын» лучше всего согласуется с царственным контекстом и Пс 2:7. Неопределённость отражена в сноске.
- source_word: פֶּן יֶאֱנַף
  choice: чтобы он не разгневался
  rationale: Передаёт отрицательное предостережение после повеления естественным современным русским оборотом, не устраняя личного субъекта.
- source_word: וְתֹאבְדוּ דֶרֶךְ
  choice: и вы не погибли на пути
  rationale: Сжатое еврейское выражение сохранено без уточнения способа гибели; «на пути» естественно передаёт דֶרֶךְ в данном контексте.
- source_word: כִּי יִבְעַר כִּמְעַט אַפּוֹ
  choice: ведь гнев его вспыхивает быстро
  rationale: Глагол בער передан огненным образом «вспыхивает», а כמעט — как указание на быстроту. Возможная трактовка как скорой близости или малой меры отмечена в сноске.
- source_word: אַשְׁרֵי
  choice: Блаженны
  rationale: Традиционное и литературно естественное обозначение псалмовой формулы благополучия под Божьим покровом.
- source_word: חֹסֵי בוֹ
  choice: кто находит прибежище в нём
  rationale: Передаёт образ поиска защиты у него, не сводя חסה к более отвлечённому «доверяет».
theological_decisions:
- issue: Значение и референт בַר в Пс 2:12
  choice: «сына» — в связи с царственным сыном из Пс 2:7
  alternative: «чистоту», «чисто» либо признание места неразрешимой текстовой трудностью
  rationale: Литературный контекст псалма поддерживает сыновнее и царское прочтение, однако необычность арамейской формы בַר в еврейском контексте требует сохранить альтернативы в сноске, не превращая перевод в утверждение более поздней конфессиональной системы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмовым звучанием. Конкретные образы «целуйте», «вспыхивает» и «прибежище» сохранены; синтаксис сделан понятным для обычного читателя. Все сноски обозначены в основном тексте.
