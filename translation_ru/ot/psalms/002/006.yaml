  text: But as for me[a], I have installed my king on Zion, my holy mountain.
translation:
  language: ru
  text: Но Я поставил моего царя на Сионе, моей святой горе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я утвердил моего царя»; некоторые понимают глагол как «Я помазал моего царя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Но Я
  rationale: 'Сочетание союза с самостоятельным местоимением имеет здесь противительно-эмфатическую силу: слова Господа противопоставлены мятежу народов и замыслам земных правителей. В русском «Но Я» естественно передаёт и контраст, и акцент.'
- source_word: נָסַכְתִּי
  choice: поставил
  rationale: В данном царском контексте глагол означает назначение и утверждение царя. «Поставил» звучит естественно и сохраняет широту значения, не отождествляя этот глагол с обычным еврейским глаголом помазания.
- source_word: מַלְכִּי
  choice: Моего царя
  rationale: Существительное с суффиксом первого лица означает «моего царя». Строчная буква у слова «царь» не навязывает мессианское толкование средствами орфографии, хотя контекст допускает его в более широком каноническом прочтении.
- source_word: עַל צִיּוֹן
  choice: на Сионе
  rationale: Предлог указывает здесь на место, а не на область владычества; «на Сионе» — обычная и точная русская конструкция.
- source_word: הַר קָדְשִׁי
  choice: Моей святой горе
  rationale: Естественная русская передача сочетания «гора Моей святости» с сохранением значения הַר как «гора».
theological_decisions:
- issue: Передавать ли נָסַכְתִּי как ритуальное помазание или как царское поставление
  choice: 'царское поставление: «Я поставил Моего царя»'
  alternative: «Я помазал Моего царя»; «Я утвердил Моего царя»
  rationale: 'Ближайший контекст изображает ответ Господа восставшим царям: Он объявляет о Своём царе на Сионе. «Поставил» передаёт назначение и воцарение, не смешивая этот глагол с משׁח, обычным еврейским глаголом «помазывать», и не сужает возможное мессианское прочтение.'
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Заглавные буквы в местоимениях «Я», «Моего», «Моей» обозначают речь Бога согласно устойчивой русской издательской традиции; слово «царь» оставлено со строчной буквы, чтобы не закреплять толкование орфографически.
