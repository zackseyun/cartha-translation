source:
  edition: WLC
  text: תְּ֭רֹעֵ/ם בְּ/שֵׁ֣בֶט בַּרְזֶ֑ל כִּ/כְלִ֖י יוֹצֵ֣ר תְּנַפְּצֵֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/009.yaml
  text: You will break them with an iron scepter[b][a]; like a potter’s vessel you will shatter them.
translation:
  language: ru
  text: Ты сокрушишь их железным скипетром[b][a]; словно сосуд горшечника, разобьёшь их вдребезги.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно иному текстовому преданию, отражённому в некоторых древних переводах и получившему отклик в книге Откровение: «Ты будешь пасти их железным жезлом» или «Ты будешь править ими железным скипетром».'
    reason: alternative_reading
  - marker: b
    text: 'Слово «скипетр» можно также перевести как «жезл»: еврейское слово может обозначать знак власти или орудие наказания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרֹעֵם
  choice: сокрушишь их
  rationale: Масоретская огласовка связывает форму со значением разрушения, а параллелизм с תְּנַפְּצֵם («разобьёшь их вдребезги») подтверждает образ губительного суда. Глагол «сокрушишь» передаёт силу действия и сохраняет возвышенный поэтический регистр.
- source_word: בְּשֵׁבֶט
  choice: скипетром
  rationale: שֵׁבֶט может означать жезл, посох или скипетр. В царском контексте псалма «скипетр» ясно выражает царскую власть и одновременно допускает образ орудия суда.
- source_word: בַּרְזֶל
  choice: железным
  rationale: Прямое обозначение материала; железо подчёркивает непреклонную силу и суровость царского суда.
- source_word: כִּכְלִי יוֹצֵר
  choice: словно сосуд горшечника
  rationale: כְּלִי — широкое обозначение сосуда или предмета, но в сочетании с יוֹצֵר естественно означает глиняный сосуд, изготовленный горшечником. Формулировка сохраняет конкретный образ исходного текста.
- source_word: תְּנַפְּצֵם
  choice: разобьёшь их вдребезги
  rationale: Глагол обозначает сильный удар, разбивающий предмет на части. Русское выражение естественно сочетается с образом хрупкого глиняного сосуда и передаёт интенсивность действия.
theological_decisions:
- issue: Изображает ли первый глагол разрушительный суд или царское управление
  choice: 'разрушительный суд: «Ты сокрушишь их»'
  alternative: 'царское управление: «Ты будешь пасти их» или «Ты будешь править ими»'
  rationale: Масоретская огласовка и смысловой параллелизм с «разобьёшь их вдребезги» поддерживают значение разрушения. Однако древняя альтернативная традиция, отражённая в некоторых версиях и новозаветных цитатах, достаточно значима, чтобы быть сохранённой в примечании без подмены основного чтения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. «Сокрушишь» и «разобьёшь вдребезги» сохраняют энергичный параллелизм еврейского стиха; «скипетр» подчёркивает царский контекст.
