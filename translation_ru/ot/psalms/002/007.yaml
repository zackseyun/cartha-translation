lexical_decisions:
- source_word: אֲסַפְּרָה
  choice: Я возвещу
  rationale: Форма вводит торжественное провозглашение. «Возвещу» передаёт официальный и поэтически возвышенный тон лучше, чем нейтральное «расскажу».
- source_word: אֶל חֹק
  choice: постановление
  rationale: В контексте воцарения חֹק означает властное, установленное решение. По-русски прямое сочетание «возвещу постановление» естественно передаёт смысл всей конструкции.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул.
- source_word: אָמַר אֵלַי
  choice: Он сказал мне
  rationale: Местоимение естественно указывает на Яхве, названного непосредственно перед этим, и сохраняет плавность русской речи.
- source_word: בְּנִי אַתָּה
  choice: Ты — Мой Сын
  rationale: Сохраняется буквальный смысл «Мой сын — ты» и царско-мессианская значимость выражения; прописная буква является редакционным истолкованием и потому оговорена в сноске.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямой и естественный современный эквивалент, сохраняющий временное ударение текста.
- source_word: יְלִדְתִּיךָ
  choice: Я родил Тебя
  rationale: Глагол ילד здесь использует образ рождения/порождения. Прямой перевод сохраняет этот образ и не сводит его заранее к одному объяснению — биологическому рождению, усыновлению или возведению на престол.
theological_decisions:
- issue: Царское сыновство и мессианское значение בְּנִי
  choice: «Ты — Мой Сын» с прописной буквы
  alternative: «Ты — мой сын»
  rationale: В ближайшем контексте речь идёт о царе из дома Давида, а в дальнейшем каноническом употреблении стих получает мессианское прочтение. Поскольку древнееврейское письмо не передаёт различия прописных и строчных букв, альтернативное оформление отмечено в сноске.
- issue: Смысл слов «сегодня Я родил Тебя»
  choice: Сохранить образ рождения без дополнительного истолкования
  alternative: «сегодня Я стал Тебе Отцом»
  rationale: Исходный текст прямо использует глагол рождения. Такой перевод сохраняет напряжение между образами царского воцарения, заветного усыновления и мессианского исполнения, не разрешая его в пользу одной богословской схемы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным регистром. Порядок слов слегка выровнен ради естественности; параллельно сохранены краткость, царский тон и богословская неоднозначность оригинала.
