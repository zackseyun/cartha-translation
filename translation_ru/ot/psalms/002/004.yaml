base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/004.yaml
  text: The one enthroned in the heavens laughs[a]; the Lord mocks them.
translation:
  language: ru
  text: Восседающий на небесах смеётся[a]; Господь насмехается над ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сидящий на небесах смеётся».'
    reason: 'Лексическая альтернатива: יוֹשֵׁב буквально означает «сидящий»; «Восседающий» передаёт уместный в контексте царственный оттенок.'
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: Восседающий
  rationale: Причастие буквально означает «сидящий» или «обитающий», но в контексте псалма о мятеже земных царей подразумевает царственное и властное положение Бога. «Восседающий» естественно передаёт эту оттенённую контекстом царскую образность, не превращая её в пояснительный пересказ.
- source_word: בַּשָּׁמַיִם
  choice: на небесах
  rationale: Форма שָׁמַיִם морфологически множественная. Русское «на небесах» сохраняет возвышенный поэтический регистр и лучше соответствует еврейской форме, чем единственное число «на небе».
- source_word: יִשְׂחָק
  choice: смеётся
  rationale: Имперфект здесь уместно понимать как поэтически живое настоящее. Прямое значение «смеётся» сохраняет антропоморфный образ, а презрительный характер смеха раскрывается контекстом и следующим глаголом.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Здесь употреблён титул אֲדֹנָי, а не имя יהוה. «Владыка» ясно отличает этот титул от передачи божественного имени и соответствует возвышенному поэтическому контексту.
- source_word: יִלְעַג
  choice: насмехается
  rationale: Глагол לעג выражает насмешку и презрение. «Насмехается» — ясный современный эквивалент, сохраняющий параллелизм со «смеётся».
- source_word: לָמוֹ
  choice: над ними
  rationale: Местоименная форма относится к народам и правителям из предшествующих стихов. Русское управление «насмехается над ними» передаёт этот смысл естественно и точно.
theological_decisions:
- issue: Царственное и антропоморфное изображение Бога
  choice: Передать причастие царственно окрашенным словом «Восседающий», сохранив прямые антропоморфные глаголы «смеётся» и «насмехается».
  alternative: «Сидящий на небесах смеётся; Господь глумится над ними».
  rationale: Стих изображает полное превосходство Бога над восставшими правителями. Перевод сохраняет яркий образ смеха и насмешки, не сводя его к абстрактному утверждению о Божьем превосходстве. При этом «Восседающий» передаёт подразумеваемую контекстом царскую власть, не разрешая богословское напряжение антропоморфного языка.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмическим регистром. Причастие «Восседающий» поддерживает царскую образность; «Владыка» передаёт титул אֲדֹנָי и не смешивает его с божественным именем.
