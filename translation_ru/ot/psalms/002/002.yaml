  yaml_path: translation/ot/psalms/002/002.yaml
  text: The kings of the earth take their stand[b][a], and rulers gather together against Yahweh and against his Anointed.
translation:
  language: ru
  text: Цари земли занимают свои позиции[a], и правители собираются вместе против Яхве и против его помазанника[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выступают» или «становятся». Еврейский глагол указывает на намеренное занятие позиции, здесь — в противостоянии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «против Господа и против его помазанника»; также возможно: «против Яхве и против его Мессии».'
    reason: alternative_reading
lexical_decisions:
- source_word: יִתְיַצְּבוּ
  choice: выступают
  rationale: Возвратная порода глагола передаёт намеренное занятие позиции; в данном враждебном контексте «выступают» естественно выражает открытое противостояние.
- source_word: מַלְכֵי אֶרֶץ
  choice: цари земли
  rationale: Конструкция имеет универсальный политический охват, поэтому «земли» предпочтительнее локального «страны».
- source_word: רוֹזְנִים
  choice: правители
  rationale: Слово обозначает высокопоставленных властителей или руководителей; «правители» ясно и не архаично передаёт широкий смысл.
- source_word: נוֹסְדוּ יָחַד
  choice: объединяются
  rationale: Выражение указывает на согласованное совместное действие. «Объединяются» сохраняет эту мысль, не усиливая её до однозначного «замышляют заговор».
- source_word: עַל
  choice: против
  rationale: Контекст открытой вражды требует противительного значения предлога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: מְשִׁיחוֹ
  choice: Его Помазанника
  rationale: Буквальное «Его Помазанника» сохраняет непосредственную связь с помазанным царём и одновременно мессианскую перспективу псалма, не подменяя исходное слово более интерпретирующим титулом.
theological_decisions:
- issue: Передача מְשִׁיחוֹ с непосредственным царским и более широким мессианским значением
  choice: Его Помазанника
  alternative: Его Мессии
  rationale: «Помазанник» непосредственно передаёт значение еврейского существительного и сохраняет напряжение между историческим царским референтом и мессианским прочтением. «Мессия» возможно, но делает более явным канонико-богословское толкование.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господа
  rationale: «Яхве» воспроизводит личное имя в исходном тексте; традиционная замена «Господь» отмечена как вариант.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Синтаксис краток и параллелен еврейскому стиху; «объединяются» передаёт согласованность действий без чрезмерно толковательного «сговариваются».
