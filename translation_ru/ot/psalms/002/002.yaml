  terminology: «Яхве» корректно передаёт тетраграмматон. «Помазанник» — прямой эквивалент מְשִׁיחוֹ; строчная буква сохраняет непосредственную царскую референцию и допускаемую текстом мессианскую перспективу. Сноска уместно отмечает варианты «Господь» и «Мессия».
