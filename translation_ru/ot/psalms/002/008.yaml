base_translation:
  language: en
  yaml_path: translation/ot/psalms/002/008.yaml
  text: Ask of me[a], and I will give the nations as your inheritance, and the ends of the earth as your possession.
translation:
  language: ru
  text: Проси у Меня — и Я дам тебе народы в наследие, и края земли[a] — во владение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до самых дальних пределов земли».'
    reason: Лексический вариант передаёт значение אַפְסֵי אָרֶץ как наиболее удалённых частей земли.
lexical_decisions:
- source_word: שְׁאַל מִמֶּנִּי
  choice: Проси у Меня
  rationale: Императив שְׁאַל требует прямой просьбы, а сочетание с מִמֶּנִּי естественно передаётся по-русски как «проси у Меня».
- source_word: וְאֶתְּנָה
  choice: и Я дам
  rationale: Когортатив после императива выражает обещанный ответ на просьбу; «и Я дам» сохраняет последовательность и силу обязательства.
- source_word: גּוֹיִם
  choice: народы
  rationale: Слово обозначает народы или нации; «народы» естественно в контексте всемирной власти и не привносит позднейшего противопоставления иудеев и язычников.
- source_word: נַחֲלָתֶךָ
  choice: Тебе ... в наследие
  rationale: נַחֲלָה обозначает наследственный удел или достояние; конструкция «дать ... в наследие» точно и естественно передаёт предикативное отношение.
- source_word: וַאֲחֻזָּתְךָ
  choice: во владение
  rationale: אֲחֻזָּה означает владение или закреплённое имущество; «во владение» сохраняет параллелизм, не сливая значение с «наследием».
- source_word: אַפְסֵי אָרֶץ
  choice: края земли
  rationale: Идиома обозначает крайние, наиболее удалённые пределы земли; «края земли» звучит естественно и сохраняет пространственный образ.
theological_decisions:
- issue: Царский и мессианский охват обещания
  choice: Передать стих как прямое Божье обещание обращённому к Нему царю/сыну, не уточняя его личность в переводе.
  alternative: Сделать формулировку явно мессианской или христологической.
  rationale: Еврейский текст обещает адресату народы и всю землю как владение, но сам стих не называет его прямо Мессией; нейтральная передача сохраняет возможность канонического христологического прочтения, не внося его в формулировку.
- issue: Прописные местоимения при обращении к адресату
  choice: Тебе
  alternative: тебе
  rationale: Прописная буква сохраняет традиционно-достоинный русский библейский регистр и согласуется с обращением к царю/Сыну, не добавляя явного титула или толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Тире подчёркивает параллельные части обещания. Смысловая двусмысленность царского и мессианского прочтения сохранена.
