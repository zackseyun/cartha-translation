lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Передаёт выводный переход от предшествующего провозглашения к увещанию; временной оттенок «теперь» в русском здесь естественно включён в переходное «итак».
- source_word: מְלָכִים
  choice: цари
  rationale: Контекст ясно указывает на прямое обращение; русский язык не требует отдельной звательной частицы.
- source_word: הַשְׂכִּילוּ
  choice: будьте благоразумны
  rationale: Императив породы hифиль от שכל призывает к разумному пониманию, проявляющемуся в поведении. «Будьте благоразумны» сохраняет и интеллектуальный, и практический оттенки.
- source_word: הִוָּסְרוּ
  choice: примите наставление
  rationale: Форма нифаль от יסר может обозначать принятие наставления, вразумления или исправления. Выбор сохраняет воспринимающее значение формы и не сводит многозначное слово только к предупреждению.
- source_word: שֹׁפְטֵי אָרֶץ
  choice: судьи земли
  rationale: Сохраняется конкретное значение «судьи», а «земли» соответствует всемирному охвату Псалма 2, а не отдельной стране.
