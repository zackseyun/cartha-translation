  text: «Разорвём их оковы и сбросим с себя их путы!»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְנַתְּקָה
  choice: Разорвём
  rationale: Когортатив первого лица множественного числа выражает решительный призыв; глагол передаёт разрыв или расторжение удерживающих уз.
- source_word: מֹוסְרוֹתֵימוֹ
  choice: их оковы
  rationale: Существительное обозначает узы или оковы. «Оковы» конкретно и поэтично передают образ внешнего ограничения, не уточняя материал.
- source_word: וְנַשְׁלִיכָה
  choice: и сбросим
  rationale: Когортатив продолжает решительный призыв. В сочетании с «с себя» глагол «сбросим» естественно передаёт удаление удерживающих пут.
- source_word: מִמֶּנּוּ
  choice: с себя
  rationale: Предлог с суффиксом первого лица множественного числа указывает на удаление от самих говорящих; по-русски естественно «с себя».
- source_word: עֲבֹתֵימוֹ
  choice: их путы
  rationale: Слово обозначает толстые верёвки, шнуры или узы. «Путы» сохраняют конкретный образ связывания и создают естественный поэтический параллелизм с «оковами».
theological_decisions:
- issue: Метафора божественной и царской власти как сдерживающих уз
  choice: Сохранить конкретные образы «оковы» и «путы», не характеризуя их как угнетение или освобождение.
  alternative: 'Передать абстрактнее: «узы» и «связи», либо явно истолковать их как власть Господа и Его Помазанника.'
  rationale: В контексте это слова восставших народов, но сам стих даёт их образную речь без авторского пояснения. Конкретная метафора сохраняет богословское напряжение и не принимает оценку говорящих за оценку псалма.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным и поэтически параллельным строем. Восклицательный знак передаёт решительный характер двух когортативов; кавычки показывают продолжение прямой речи из предыдущего стиха.
