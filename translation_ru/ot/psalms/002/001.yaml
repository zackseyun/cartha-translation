  source_fidelity: 'Основной перевод в целом точно передаёт еврейский риторический вопрос и параллелизм: רָגְשׁוּ — бурное, враждебное волнение народов; יֶהְגּוּ רִיק — обдумывание/бормотание пустого, тщетного. «Буйствуют» допустимо, но «бушуют» точнее передаёт коллективный tumult без дополнительного оттенка распущенного поведения. «Племена» приемлемо как второй член параллелизма к «народам».'
  naturalness: '«Почему народы бушуют, а племена замышляют тщетное?» звучит естественно в современном литературном русском, сохраняя возвышенную псалмовую интонацию. Сноска нуждается в синтаксическом и лексическом уточнении: «тихое произнесение» неудачно описывает значение глагола, а альтернативы лучше сформулировать как варианты перевода.'
  terminology: Термины «народы» и «племена» не привносят позднейших религиозных противопоставлений и достаточно сохраняют поэтический параллелизм גוֹיִם / לְאֻמִּים. «Тщетное» корректно передаёт רִיק как субстантивированное прямое дополнение, не сводя его к наречному «напрасно».
