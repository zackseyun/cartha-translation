- source_word: לָמָּה
  choice: Почему
  rationale: Естественно передаёт вопросительное наречие и сохраняет риторическую силу вопроса.
- source_word: רָגְשׁוּ
  choice: буйствуют
  rationale: Передаёт бурное, враждебное возбуждение множества; менее истолковательно, чем «сговариваются».
- source_word: גוֹיִם
  choice: народы
  rationale: Обозначает политические и этнические сообщества без привнесения позднейшего противопоставления иудеев и язычников.
- source_word: לְאֻמִּים
  choice: племена
  rationale: Сохраняет параллелизм с «народами» и коллективное множественное значение, не повторяя то же русское слово.
- source_word: יֶהְגּוּ
  choice: замышляют
  rationale: В контексте мятежа естественно выражает обдумывание враждебного намерения, при этом более широкое значение глагола отмечено в сноске.
- source_word: רִיק
  choice: тщетное
  rationale: Передаёт прямое дополнение со значением пустоты, бесплодности и обречённости на неудачу, не превращая его в наречное «напрасно».
