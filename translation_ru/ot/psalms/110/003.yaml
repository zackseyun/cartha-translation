  yaml_path: translation/ot/psalms/110/003.yaml
  text: Your people will offer themselves freely on the day of your power[a], in holy splendor; from the womb of the dawn[c][b], to you belongs the dew of your youth.
translation:
  language: ru
  text: 'Твой народ готов добровольно отдать себя

    в день твоей мощи[a],

    в святом великолепии[b].


    Из чрева зари —

    тебе принадлежит роса твоей юности[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в день твоей силы» либо «в день твоего войска». Еврейское слово может означать мощь, силу или войско.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в священном убранстве», «в великолепии святости»; возможно также: «в священных одеждах».'
    reason: lexical_alternative
  - marker: c
    text: 'Заключительные слова еврейского текста трудны для понимания. Возможно: «твои юноши — как роса из чрева зари»; другое понимание связывает росу со свежестью твоей юности.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמְּךָ
  choice: твой народ
  rationale: Обычное значение עַם — «народ». Военный контекст ощущается в образах псалма, но перевод «войско» неоправданно сужал бы значение.
- source_word: נְדָבֹת
  choice: добровольно отдаст себя тебе
  rationale: Существительное во множественном числе буквально обозначает добровольные приношения или дары. В сочетании с «твой народ» оно поэтически выражает добровольную самоотдачу; глагольная передача естественна по-русски.
- source_word: בְּיוֹם
  choice: в день
  rationale: Стандартное временное значение предлога ב при יוֹם.
- source_word: חֵילֶךָ
  choice: твоей мощи
  rationale: חַיִל может обозначать силу, мощь, войско или военную силу. «Мощь» сохраняет широкий смысл и воинственный оттенок контекста, не сводя выражение только к войску.
- source_word: בְּהַדְרֵי קֹדֶשׁ
  choice: в святом великолепии
  rationale: Выражение может указывать на священное убранство, одеяние или великолепие святости. Выбранный вариант сохраняет поэтичность и не устраняет неоднозначность.
- source_word: מֵרֶחֶם מִשְׁחָר
  choice: из чрева зари
  rationale: 'Сохранён яркий образ рождения или происхождения: רֶחֶם — «чрево», а מִשְׁחָר связано с зарёй, ранним утром.'
- source_word: לְךָ
  choice: тебе
  rationale: Краткая еврейская конструкция с לְ допускает отношение принадлежности; русское «тебе» сохраняет её поэтическую сжатость.
- source_word: טַל
  choice: роса
  rationale: Сохранён основной образ еврейского текста без дополнительного истолкования.
- source_word: יַלְדֻתֶיךָ
  choice: твоей юности
  rationale: Слово может обозначать юность, молодость или, по одной трактовке, молодых людей. «Твоей юности» непосредственно передаёт форму текста и сохраняет спорную поэтическую связь с росой.
theological_decisions:
- issue: Смысл заключительной строки о росе и юности
  choice: 'Сохранён сжатый образ: «тебе роса твоей юности».'
  alternative: «Твои юноши — как роса из чрева зари»; либо понимание образа как указания на свежесть и силу юности; в богословской традиции также встречается христологическое истолкование образа рождения.
  rationale: Еврейский текст необычайно сжат и допускает несколько синтаксических и образных толкований. Основной перевод не превращает одну из них в бесспорный смысл и не вводит в текст более позднее догматическое уточнение.
translation_notes:
  register: Современный литературный русский язык с достоинством и поэтической сжатостью, соответствующей псалму. Переносы строк подчёркивают параллелизм. Архаизм «чрево» сохранён как понятный библейско-поэтический образ; неоднозначные образы не разъясняются внутри основного текста.
