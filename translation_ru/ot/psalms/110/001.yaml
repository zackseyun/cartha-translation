base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/001.yaml
  text: Of David[a]. A psalm. Yahweh says to my lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: ru
  text: 'Давидов псалом. Изречение Господа[a] моему господину[b]: «Сядь по правую руку от Меня, пока Я не сделаю твоих врагов подножием для твоих ног».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит יהוה (ЙХВХ) — личное имя Бога, традиционно передаваемое словом «Господь». Еврейское слово, вводящее изречение, также можно передать как «возвещение» или «пророческое изречение».
    reason: lexical_alternative
  - marker: b
    text: Еврейское «моему господину» — почтительный титул, отличный от имени יהוה в начале изречения.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Давидов
  rationale: Предлог לְ в надписаниях псалмов допускает авторство, принадлежность или связь с Давидом. Краткая традиционная формула «Давидов» сохраняет эту неоднозначность лучше, чем однозначное «написанный Давидом».
- source_word: מִזְמוֹר
  choice: псалом
  rationale: Устоявшееся и понятное русское обозначение данного жанра.
- source_word: נְאֻם
  choice: говорит
  rationale: Слово вводит торжественное изречение или пророческое провозглашение. «Говорит» естественно вводит прямую речь, а более торжественный оттенок отмечен в сноске.
- source_word: יְהוָה
  choice: Господь
  rationale: В русском библейском регистре «Господь» является узнаваемой передачей тетраграмматона; сноска раскрывает, что в еврейском тексте стоит личное имя Бога, отличное от последующего титула.
- source_word: לַאדֹנִי
  choice: моему господину
  rationale: אֲדֹנִי — форма со значением «мой господин/владыка», отличная от имени יהוה. Строчная буква не вносит в сам перевод позднейшее христологическое отождествление.
- source_word: שֵׁב
  choice: Сядь
  rationale: Прямой эквивалент повелительной формы; контекст места по правую руку передаёт оттенок возведения к власти.
- source_word: לִימִינִי
  choice: по правую руку от Меня
  rationale: Естественный русский библейский оборот, сохраняющий образ почётного места и власти.
- source_word: עַד
  choice: пока
  rationale: Передаёт временное значение עַד без вывода о том, что положение по правую руку обязательно прекратится после названного события.
- source_word: אָשִׁית
  choice: Я не сделаю
  rationale: В сочетании с «подножием» глагол שׁית имеет результативный смысл «сделать/обратить во что-либо»; отрицательная частица входит в русскую конструкцию «пока не» и не отрицает действие.
- source_word: אֹיְבֶיךָ
  choice: твоих врагов
  rationale: Прямое и современное соответствие форме множественного числа с суффиксом второго лица.
- source_word: הֲדֹם
  choice: подножием
  rationale: Точный русский эквивалент, сохраняющий образ царской победы и подчинения.
- source_word: לְרַגְלֶיךָ
  choice: для твоих ног
  rationale: Буквально сохраняет значение предлога לְ — «для», не заменяя его более толковательным «под ноги».
theological_decisions:
- issue: Различение יהוה и אֲדֹנִי в мессиански значимом стихе
  choice: «Господь говорит моему господину» с пояснением имени יהוה в сноске
  alternative: «Яхве говорит моему господину»
  rationale: Основной текст сохраняет естественный и узнаваемый русский библейский регистр, а сноска делает явным принципиальное различие между личным именем Бога и титулом второго лица.
- issue: Идентичность названного «моим господином»
  choice: Строчное «господину» без уточнения личности
  alternative: «моему Господу» с прописной буквы
  rationale: Еврейский текст содержит почтительный титул, но не называет второе лицо прямо. Строчная буква сохраняет лексическую форму и не разрешает типографически богословское напряжение, хотя последующая каноническая традиция понимает стих мессиански.
- issue: Временная сила עַד
  choice: «пока Я не сделаю»
  alternative: «до тех пор, пока Я не сделаю»
  rationale: Формула указывает на срок до совершения названного действия, но сама по себе не утверждает прекращения пребывания по правую руку после победы.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Надписание дано кратко; прямая речь ритмична и ясна. Прописные местоимения в речи Бога применены как устойчивая русская издательская конвенция, не меняющая смысла оригинала.
