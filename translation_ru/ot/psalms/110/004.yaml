base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/004.yaml
  text: 'Yahweh has sworn and will not change his mind: “You are a priest forever after the manner of Melchizedek.”[a]'
translation:
  language: ru
  text: 'Господь поклялся и не изменит Своего решения: «Ты — священник навеки по чину Мелхиседека»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «согласно Моему слову (или: установлению), Мелхиседек». Древнееврейская фраза трудна для понимания; её также переводят: «подобно Мелхиседеку».'
    reason: alternative_reading
lexical_decisions:
- source_word: נִשְׁבַּע
  choice: поклялся
  rationale: Совершенный вид передаёт состоявшуюся торжественную клятву; по-русски это естественнее буквального «дал клятву».
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона; сохраняет отличие Божьего имени от обычного обращения с помощью прописной буквы.
- source_word: וְלֹא יִנָּחֵם
  choice: и не передумает
  rationale: 'Форма от נחם здесь выражает неизменность данной клятвы: Господь не изменит принятого решения. Современная формулировка не привносит значения нравственного покаяния.'
- source_word: אַתָּה כֹהֵן
  choice: Ты — священник
  rationale: Сохраняет прямое обращение и именную конструкцию; тире естественно для современного русского языка.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Краткая, естественная и стилистически достойная передача продолжительности без установленного конца.
- source_word: עַל דִּבְרָתִי
  choice: по чину
  rationale: Контекстуально передаёт связь священства адресата с образцом или порядком Мелхиседека, но трудность древнееврейской фразы и её более буквальное прочтение отмечены в сноске.
- source_word: מַלְכִּי־צֶדֶק
  choice: Мелхиседек
  rationale: Устоявшаяся русская форма библейского имени.
theological_decisions:
- issue: Значение трудной фразы עַל דִּבְרָתִי מַלְכִּי־צֶדֶק
  choice: по чину Мелхиседека
  alternative: по Моему слову / установлению, Мелхиседек
  rationale: Основной вариант естественно выражает священнический образец, связанный с Мелхиседеком, и согласуется с древним пониманием текста. Однако синтаксис еврейской фразы допускает более буквальное прочтение, поэтому неоднозначность не устраняется, а фиксируется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Поклялся», «навеки» и «по чину» сохраняют торжественность без архаизации; трудность заключительной фразы раскрыта в сноске.
