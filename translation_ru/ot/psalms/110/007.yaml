lexical_decisions:
- source_word: מִנַּחַל
  choice: из потока
  rationale: נחל обозначает поток, русло потока или сезонный водоток. «Из потока» естественно по-русски и сохраняет поэтический образ утоления жажды, не уточняя постоянный ли это водоём.
- source_word: בַּדֶּרֶךְ
  choice: на пути
  rationale: דרך означает путь, дорогу или странствие; сочетание с предлогом ב здесь естественно передаётся как «на пути», то есть во время движения.
- source_word: יִשְׁתֶּה
  choice: он будет пить
  rationale: Имперфект допускает будущее или повторяющееся действие; в последовательности действий этого псалма уместна форма будущего времени.
- source_word: עַל־כֵּן
  choice: поэтому
  rationale: Оборот выражает следствие и связывает питьё из потока с последующим поднятием головы.
- source_word: יָרִים רֹאשׁ
  choice: поднимет голову
  rationale: Буквальный образ может указывать на восстановление сил, уверенность или возвышение; перевод сохраняет эту многозначность и не заменяет её толкованием.
theological_decisions:
- issue: К кому относятся глаголы мужского рода единственного числа в царском псалме
  choice: Сохранить местоимение «он», не называя прямо его референта.
  alternative: 'Уточнить: царь из рода Давида, царь-священник или Мессия.'
  rationale: В еврейском тексте субъект выражен лишь формами мужского рода единственного числа. Перевод не вносит явного отождествления, сохраняя возможность как исходного царского, так и последующего мессианского прочтения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим строем. Порядок слов слегка приподнят, но понятен; образность и смысловая неоднозначность еврейского текста сохранены.
