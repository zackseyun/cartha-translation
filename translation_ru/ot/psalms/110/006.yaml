  yaml_path: translation/ot/psalms/110/006.yaml
  text: He will judge among the nations[a]; he will fill them with corpses[d][c][b]; he will crush the head over a broad land.
translation:
  language: ru
  text: Он будет судить среди народов; наполнит трупами[a]; сокрушит голову над обширной землёй[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполнит трупами»; еврейский текст не называет, что именно будет наполнено.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вождя»; возможно также собирательное значение «головы». В еврейском тексте стоит единственное число.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «на обширной земле»; еврейское אֶרֶץ может означать как землю или страну, так и весь мир.'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: будет судить
  rationale: Форма qal imperfect 3-го лица ед. числа в этом поэтическом контексте естественно выражает будущее действие. «Судить» сохраняет судебный смысл, не сводя его исключительно к военной расправе.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: 'גּוֹיִם означает «народы», а предлог ב здесь естественно передаётся как «среди»: суд совершается в их среде.'
- source_word: מָלֵא גְוִיּוֹת
  choice: всё наполнит трупами
  rationale: Еврейская фраза предельно сжата и не называет объекта глагола «наполнит». В русском добавлено нейтральное «всё» для грамматической завершённости; отсутствие объекта в оригинале отмечено в сноске.
- source_word: גְוִיּוֹת
  choice: трупами
  rationale: Слово обозначает мёртвые тела. «Трупами» прямо и без смягчения передаёт суровый образ поля битвы.
- source_word: מָחַץ
  choice: сокрушит
  rationale: Глагол обозначает сильный удар, которым разбивают или сокрушают. «Сокрушит» сохраняет интенсивность и соответствует возвышенному поэтическому регистру.
- source_word: רֹאשׁ
  choice: главу
  rationale: Сохранено единственное число оригинала. «Глава» допускает как конкретный образ головы, так и значение предводителя, не вынуждая выбрать один референт.
- source_word: עַל אֶרֶץ רַבָּה
  choice: на обширной земле
  rationale: אֶרֶץ может означать отдельную землю или всю землю как мир; רַבָּה указывает на большое пространство. Основной текст сохраняет территориальный смысл без преждевременного универсализирования.
theological_decisions:
- issue: Кого или что обозначает единственное число רֹאשׁ в царско-мессианском псалме
  choice: Сохранить единственное число и образное слово «глава», не устанавливая референта.
  alternative: «головы» как собирательное множественное; «вождя»; конкретного верховного врага
  rationale: Еврейский текст употребляет единственное число, но не отождествляет эту «главу». Такой перевод сохраняет богословскую и поэтическую неоднозначность.
- issue: Пространственный охват אֶרֶץ
  choice: Передать как «земля» в территориальном смысле.
  alternative: «вся земля», то есть весь мир
  rationale: Слово допускает оба значения. Более сдержанный основной вариант не расширяет масштаб сверх того, что однозначно выражено в тексте; более широкий смысл указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой лексикой. Параллельные глагольные формы и резкие военные образы сохранены; синтаксическая краткость оригинала передана тремя однородными частями, разделёнными точками с запятой.
