lexical_decisions:
- source_word: מַטֵּה
  choice: жезл
  rationale: Слово может означать посох, жезл или прут. В контексте царского псалма «жезл» естественно передаёт конкретный образ знака царской власти.
- source_word: עֻזְּךָ
  choice: силы твоей
  rationale: Прямо передаёт значение «сила, могущество» и сохраняет поэтическое сочетание, в котором жезл выражает силу царя.
- source_word: יִשְׁלַח
  choice: посылает
  rationale: Глагол означает «посылать, высылать». Настоящее время по-русски естественно передаёт поэтическое провозглашение; возможное будущее значение отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: מִצִּיּוֹן
  choice: с Сиона
  rationale: Прямо передаёт исходную точку действия и сохраняет собственное имя с его царскими и богословскими ассоциациями.
- source_word: רְדֵה
  choice: владычествуй
  rationale: Императив означает «править, владычествовать». «Владычествуй» сохраняет возвышенный царский оттенок, оставаясь понятным в современном литературном русском.
- source_word: בְּקֶרֶב
  choice: среди
  rationale: Естественно передаёт значение «в среде, посреди»; более буквальный пространственный вариант приведён в сноске.
- source_word: אֹיְבֶיךָ
  choice: врагов твоих
  rationale: Прямая передача формы множественного числа с суффиксом второго лица мужского рода; постпозиция местоимения поддерживает поэтический регистр.
theological_decisions:
- issue: Царская и мессианская образность Псалма 110
  choice: Сохранить царский образ жезла и повеление владычествовать, не уточняя в переводе личность адресата сверх сказанного в еврейском тексте.
  alternative: Либо ослабить царскую образность более общими словами, либо прямо внести мессианское истолкование в основной текст.
  rationale: Еврейский текст изображает царственную фигуру, чью власть поддерживает Яхве. Такая передача допускает непосредственный царский и более широкий мессианский смысл, не разрешая богословское напряжение посредством добавлений.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Инверсия «силы твоей», «врагов твоих» придаёт строке умеренно возвышенное звучание без архаизации; двоеточие сохраняет переход от действия Яхве к обращённому к царю повелению.
