base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/000.yaml
  text: Of David[a]. A psalm. Yahweh says to my Lord[c][b], “Sit at my right hand until I make your enemies a footstool for your feet.”
translation:
  language: ru
  text: 'Псалом Давида.[a]


    Яхве[b] говорит моему господину:


    «Сядь по правую руку от Меня,


    пока Я не сделаю твоих врагов


    подножием для твоих ног».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское надписание можно понимать как «псалом Давида», «псалом, принадлежащий Давиду» или «псалом для Давида».
    reason: source_ambiguity
  - marker: b
    text: В еврейском тексте здесь стоит личное имя Бога — יהוה (Яхве), тогда как далее употреблено слово «господин» с суффиксом «мой».
    reason: lexical_distinction
  - marker: c
    text: 'Буквально: «подножием для ног твоих»; этот образ выражает покорение врагов, но в основном тексте сохранена сама метафора.'
    reason: idiom
lexical_decisions:
- source_word: לְדָוִד מִזְמוֹר
  choice: Псалом Давида
  rationale: Естественно передаёт надписание; конструкция с לְ допускает связь с Давидом без обязательного уточнения характера этой связи.
- source_word: נְאֻם יְהוָה
  choice: Яхве сказал
  rationale: נְאֻם вводит торжественное божественное изречение; «сказал» ясно и естественно по-русски, тогда как имя «Яхве» сохраняет различие между יהוה и אדני.
- source_word: לַאדֹנִי
  choice: моему господину
  rationale: Форма אֲדֹנִי означает «мой господин» и отличается от личного имени Бога יהוה; строчная буква помогает сохранить это различие.
- source_word: שֵׁב לִימִינִי
  choice: Сядь по правую руку от Меня
  rationale: Передаёт пространственный образ почётного места справа естественным современным русским выражением.
- source_word: הֲדֹם לְרַגְלֶיךָ
  choice: подножием для твоих ног
  rationale: Сохраняет конкретную метафору подножия, не заменяя её толкованием «под твою власть».
theological_decisions:
- issue: Различие между יהוה и אֲדֹנִי
  choice: «Яхве» и «моему господину»
  alternative: «Господь» и «моему Господу»
  rationale: Выбранный вариант непосредственно показывает, что в еврейском тексте употреблены разные обозначения, и не предрешает личность адресата.
- issue: Смысл правой стороны и подножия
  choice: Сохранены исходные образы
  alternative: Истолковать как возведение к власти и полное покорение врагов
  rationale: Образы несут богословскую значимость, но сам стих не разворачивает их толкование; перевод не должен сужать возможный смысл.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Синтаксис прост и пригоден для чтения вслух; архаизмы вроде «одесную» и «доколе» не используются. Поэтическая разбивка отражает смысловые строки, не добавляя содержания.
