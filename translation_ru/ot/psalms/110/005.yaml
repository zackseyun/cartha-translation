  text: אֲדֹנָ֥/י עַל יְמִֽינְ/ךָ֑ מָחַ֖ץ בְּ/יוֹם אַפּ֣/וֹ מְלָכִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/110/005.yaml
  text: The Lord is at your right hand[a]; he will shatter kings on the day of his wrath.
translation:
  language: ru
  text: Господь — по правую руку от тебя[a]; в день Своего гнева Он сокрушит царей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «господин по правую руку от тебя». Эти слова могут относиться к царю (Мессии), к которому обращены слова псалма; другие понимают здесь «Господь» как указание на Бога, совершающего суд.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Форма огласована как אֲדֹנָי (Адонай), поэтому передана традиционным титулом «Господь», но не как имя Яхве, которого в этом стихе нет.
- source_word: עַל יְמִינְךָ
  choice: по правую руку от тебя
  rationale: Сохраняет конкретный образ нахождения справа и естественно звучит по-русски; возможные оттенки поддержки, чести и силы не раскрываются непосредственно в тексте.
- source_word: מָחַץ
  choice: сокрушит
  rationale: Глагол обозначает нанесение сокрушительного удара. Будущее время естественно передаёт действие в предстоящий день суда, хотя еврейская перфектная форма сама по себе допускает взгляд на действие как на совершившееся.
- source_word: בְּיוֹם אַפּוֹ
  choice: в день Своего гнева
  rationale: Сохраняет временную конструкцию «в день»; אַף здесь имеет устойчивое переносное значение сильного гнева.
- source_word: מְלָכִים
  choice: царей
  rationale: Прямой эквивалент множественного числа «цари», сохраняющий явное указание на правителей.
theological_decisions:
- issue: К кому относится титул אֲדֹנָי в Псалме 109:5
  choice: В основном тексте дано нейтральное «Господь», а неоднозначность референта отмечена в сноске.
  alternative: Понимать титул либо как указание на Бога, совершающего суд, либо как обозначение царя/Мессии, к которому обращены слова псалма.
  rationale: В еврейском стоит אֲדֹנָי, а не имя יהוה; синтаксис и ход псалма допускают разные соотнесения. Перевод не должен устранять эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским регистром. Тире после «Господь» естественно передаёт еврейское именное предложение. Прописные местоимения «Своего», «Он» поддерживают чтение «Господь» в основном тексте, тогда как альтернативное понимание явно сохранено в сноске.
