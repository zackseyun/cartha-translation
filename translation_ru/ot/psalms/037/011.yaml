source:
  edition: WLC
  text: וַ/עֲנָוִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ֝/הִתְעַנְּג֗וּ עַל רֹ֥ב שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/011.yaml
  text: But the humble will inherit the land and delight themselves in abundant peace[a][b].
translation:
  language: ru
  text: А кроткие унаследуют землю[a] и будут наслаждаться полнотой мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страну».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲנָוִים
  choice: кроткие
  rationale: Слово обозначает смиренных, незаносчивых и часто находящихся в стеснённых обстоятельствах людей. «Кроткие» естественно для возвышенного поэтического регистра и сохраняет значимую межтекстовую связь с Мф. 5:5, не сводясь в русском языке лишь к робости.
- source_word: יִירְשׁוּ
  choice: унаследуют
  rationale: Глагол может означать «унаследовать» или «овладеть, получить во владение». «Унаследуют» сохраняет образ дарованного владения и его заветный оттенок.
- source_word: אָרֶץ
  choice: землю
  rationale: אֶרֶץ допускает значения «земля, страна». В контексте псалма вероятен смысл земли как места устойчивого проживания и наследия, однако русское «землю» также сохраняет возможное более широкое понимание.
- source_word: וְהִתְעַנְּגוּ
  choice: и будут наслаждаться
  rationale: Форма хитпаэль передаёт активное, глубокое наслаждение. Русское выражение естественно и сохраняет интенсивность глагола.
- source_word: עַל
  choice: — конструкция «наслаждаться полнотой»
  rationale: Предлог буквально имеет значения «на, над, из-за», но при глаголе наслаждения по-русски естественно передаётся творительным падежом без отдельного предлога.
- source_word: רֹב
  choice: полнотой
  rationale: Существительное означает изобилие, множество, полноту. «Полнотой» сохраняет субстантивный образ и звучит естественно с глаголом «наслаждаться».
- source_word: שָׁלוֹם
  choice: мира
  rationale: שָׁלוֹם включает мир, благополучие, целостность и безопасность. «Мир» — традиционный и ёмкий русский эквивалент; родительный падеж обусловлен сочетанием «полнота мира».
theological_decisions:
- issue: Связь с Мф. 5:5 и объём значения אָרֶץ
  choice: «кроткие унаследуют землю»
  alternative: «смиренные унаследуют страну»
  rationale: Основной текст непосредственно передаёт допустимые значения еврейских слов и сохраняет узнаваемую межтекстовую связь, не утверждая однозначно, означает ли «земля» конкретную землю наследия или всю землю.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Союз «А» передаёт контраст וַ־ с участью нечестивых в контексте. Формулировка избегает архаизмов, сохраняя традиционное «кроткие» и смысловую широту слова «мир».
