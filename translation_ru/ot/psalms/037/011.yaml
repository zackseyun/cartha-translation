  source_fidelity: 'Текст точно передаёт еврейскую строку: עֲנָוִים — «кроткие», יִירְשׁוּ — «унаследуют», אָרֶץ — «землю», а וְהִתְעַנְּגוּ עַל רֹב שָׁלוֹם — «будут наслаждаться полнотой мира». Будущее время и поэтический контраст, выраженный начальным «А», сохранены. «Полнота мира» адекватно передаёт изобилие/множество шалом, не сужая его до отсутствия войны.'
