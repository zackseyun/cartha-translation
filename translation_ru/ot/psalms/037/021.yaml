  text: The wicked borrows and does not repay[b][a], but the righteous is gracious and gives.
translation:
  language: ru
  text: Нечестивый берёт взаймы и не отдаёт, а праведный милостив[a] и даёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благосклонен»; по контексту также возможно: «щедр». Еврейский глагол означает проявлять милость или благосклонность, здесь выраженную в щедром поступке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹוֶה
  choice: берёт взаймы
  rationale: Причастие qal от לוה означает «брать взаймы». Настоящее время передаёт обобщённый, афористический характер высказывания.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное обозначает представителя определённого нравственного типа; традиционное и понятное русское слово сохраняет противопоставление с «праведным».
- source_word: לֹא יְשַׁלֵּם
  choice: не отдаёт
  rationale: Piel от שלם в контексте займа означает возвратить долг. «Не отдаёт» естественно по-русски и однозначно связано с взятым взаймы.
- source_word: צַדִּיק
  choice: праведный
  rationale: Субстантивированное прилагательное в единственном числе, прямо противопоставленное слову רָשָׁע; сохраняется представительный единственный род и стиль литературы мудрости.
- source_word: חוֹנֵן
  choice: милостив
  rationale: Причастие qal от חנן выражает проявление милости или благосклонности. «Милостив» сохраняет основное лексическое значение, тогда как «щедр» сильнее сужает его до материальной щедрости.
- source_word: וְנוֹתֵן
  choice: и даёт
  rationale: נתן обычно означает «давать». Перевод сохраняет широту еврейского глагола и не сужает его без достаточного основания до «даёт взаймы».
theological_decisions:
- issue: Представительное мужское единственное число в противопоставлении литературы мудрости
  choice: Сохранить формы единственного числа «нечестивый» и «праведный».
  alternative: «Нечестивые… праведные» или «нечестивый человек… праведный человек».
  rationale: В еврейском тексте употреблены субстантивированные формы мужского рода единственного числа, представляющие нравственные типы. Русские формы «нечестивый» и «праведный» естественно сохраняют это противопоставление без лишнего пояснения.
- issue: Связь חוֹנֵן с материальной щедростью
  choice: Передать как «милостив», сохранив последовательность «милостив и даёт».
  alternative: «Щедр и даёт» или «оказывает милость и даёт».
  rationale: Контекст связывает милость с даянием, но сам глагол חנן шире материальной щедрости. Буквенно естественный вариант сохраняет и лексическую широту, и напряжение между внутренним качеством и поступком.
- issue: Значение וְנוֹתֵן в контексте займа
  choice: Перевести буквально «и даёт».
  alternative: «И даёт взаймы».
  rationale: Хотя контекст допускает понимание щедрого предоставления займа, נתן сам по себе означает «давать». Перевод не должен без необходимости превращать даяние в кредитование.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Синтаксис краткий и афористичный; формы «нечестивый» и «праведный» сохраняют традиционную библейскую лексику, оставаясь понятными современному читателю.
