  text: I have seen a wicked[a], ruthless man spreading himself out like a flourishing native tree.
translation:
  language: ru
  text: Я видел безжалостного нечестивца, разраставшегося, словно пышное дерево, выросшее на родной почве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно для истолкования. Буквально אֶזְרָח означает «коренной житель» или «уроженец». Вероятно, здесь подразумевается дерево, растущее в родной почве; поэтому возможен также перевод: «…словно пышное местное дерево». Слово רַעֲנָן может означать «зелёный», «свежий» или «цветущий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִיתִי
  choice: Я видел
  rationale: Форма Qal perfect, 1-е лицо единственного числа. В русском простое прошедшее естественно передаёт свидетельство псалмопевца; контекст определяет его сохраняющуюся значимость.
- source_word: רָשָׁע
  choice: нечестивца
  rationale: Устоявшееся и понятное обозначение нравственно порочного человека в поэтической и библейской речи.
- source_word: עָרִיץ
  choice: жестокого
  rationale: Слово обозначает сильного, угнетающего и внушающего страх человека. «Жестокого» передаёт его беспощадность, не сводя значение исключительно к физическому насилию.
- source_word: וּמִתְעָרֶה
  choice: разраставшегося
  rationale: Причастная форма Hitpael рисует продолжающееся пышное распространение или разрастание. Русское слово сохраняет образ растения и одновременно описывает возрастающее благополучие нечестивца.
- source_word: כְּאֶזְרָח
  choice: как … дерево на родной почве
  rationale: אֶזְרָח обычно означает «коренной житель, уроженец». В трудном поэтическом сравнении, вероятно, подразумевается дерево, буйно растущее в своей почве; добавленные слова делают этот образ понятным по-русски.
- source_word: רַעֲנָן
  choice: пышно зеленеющее
  rationale: Передаёт свежесть, зелень и жизненную силу, выраженные прилагательным, сохраняя растительный образ.
