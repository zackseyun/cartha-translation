  source_fidelity: 'Текст точно передаёт все основные элементы еврейского стиха: תּוֹרַת אֱלֹהָיו — «Закон его Бога», בְּלִבּוֹ — «в его сердце», и לֹא תִמְעַד אֲשֻׁרָיו — «его стопы не пошатнутся». Будущее «не пошатнутся» является допустимой передачей еврейского имперфекта в контексте уверенного общего утверждения. Смысловой диапазон מעד сохранён без излишней конкретизации.'
