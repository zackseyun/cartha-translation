  text: תּוֹרַ֣ת אֱלֹהָ֣י/ו בְּ/לִבּ֑/וֹ לֹ֖א תִמְעַ֣ד אֲשֻׁרָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/031.yaml
  text: The law of his God is in his heart[a]; his steps do not slip.
translation:
  language: ru
  text: Закон его Бога — в его сердце[a]; его стопы не пошатнутся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наставление его Бога — в его сердце; его стопы не оступятся».'
    reason: Лексические варианты для תּוֹרָה и מעד.
lexical_decisions:
- source_word: תּוֹרַת
  choice: Закон
  rationale: תּוֹרָה означает наставление или закон; здесь речь идёт об авторитетной Божьей воле, усвоенной праведником. «Закон» сохраняет заветный и нравственный вес слова.
- source_word: אֱלֹהָיו
  choice: его Бога
  rationale: 'Суффикс 3-го лица мужского рода выражает принадлежность и личные отношения: «его Бога».'
- source_word: בְּלִבּוֹ
  choice: в его сердце
  rationale: Еврейское «сердце» обозначает внутреннего человека, включая разум и волю; русский оборот естественно передаёт усвоенность Божьего закона.
- source_word: לֹא תִמְעַד
  choice: не пошатнутся
  rationale: מעד может означать «поскользнуться», «оступиться» или «пошатнуться». Выбранный глагол естественно сочетается со «стопами» и сохраняет образ устойчивой ходьбы.
- source_word: אֲשֻׁרָיו
  choice: его стопы
  rationale: Слово обозначает шаги или поступь. «Стопы» сохраняет телесный образ и в современном литературном русском уместно в возвышенной поэзии.
theological_decisions:
- issue: Значение תּוֹרָה в контексте псалма мудрости
  choice: «Закон»
  alternative: «наставление» или «учение»
  rationale: «Закон» передаёт авторитетный и заветный характер открытой Божьей воли, не исключая более широкого значения наставления.
- issue: Временной оттенок לֹא תִמְעַד
  choice: Будущее «не пошатнутся»
  alternative: Настоящее обобщающее «не шатаются»
  rationale: Еврейский имперфект допускает обобщающее или перспективное понимание. Будущее по-русски естественно выражает уверенность в устойчивости праведника, не превращая её в абсолютное утверждение о каждом отдельном мгновении.
