id: PSA.37.24
reference: Psalms 37:24
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי יִפֹּ֥ל לֹֽא יוּטָ֑ל כִּֽי יְ֝הוָ֗ה סוֹמֵ֥ךְ יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/024.yaml
  text: Though he falls[a], he will not be hurled down[b], for Yahweh holds his hand.
translation:
  language: ru
  text: Хотя он и упадёт[a], не будет повержен, потому что Яхве держит его за руку[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Если он упадёт, то не будет повержен»; также возможно: «Когда он упадёт». Еврейский союз допускает значения «ибо», «если», «когда» и, в данном контексте, уступительное «хотя».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «поддерживает его руку».'
    reason: literal_rendering
lexical_decisions:
- source_word: כִּי
  choice: Хотя… и
  rationale: 'В контексте союз естественно передаёт уступительное отношение: праведник может упасть, но не останется поверженным. При этом другие возможные значения союза отмечены в сноске.'
- source_word: יִפֹּל
  choice: он и упадёт
  rationale: Глагол נפל имеет основное значение «падать». Формулировка сохраняет широкую метафору и не сводит падение только к греху, духовному отступничеству или физической опасности.
- source_word: יוּטָל
  choice: не будет повержен
  rationale: Пассивная форма от טול означает быть брошенным или низвергнутым. «Не будет повержен» отличает этот глагол от предшествующего «упадёт» и передаёт мысль о том, что падение не станет окончательным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: סוֹמֵךְ
  choice: держит… за руку
  rationale: Причастие от סמך выражает продолжающуюся поддержку. Русское «держит его за руку» естественно передаёт образ непосредственной помощи, заданный сочетанием с «его рукой».
- source_word: יָדוֹ
  choice: его за руку
  rationale: Еврейский текст прямо упоминает «его руку». Русская предложная конструкция сохраняет этот образ и звучит естественнее буквального «поддерживает его руку».
theological_decisions:
- issue: Смысл образа падения
  choice: Сохранён общий образ беды, неудачи или ослабления праведника без уточнения их характера.
  alternative: Понимать падение исключительно как нравственный грех, духовное отступничество или физическую опасность.
  rationale: Еврейский текст не конкретизирует вид падения; более широкая формулировка сохраняет его смысловую и богословскую открытость.
- issue: Сила отрицания «не будет повержен»
  choice: Стих утверждает, что падение не приведёт к окончательному низвержению.
  alternative: Понимать стих как обещание, что праведник вообще никогда не упадёт.
  rationale: Текст прямо допускает падение, но противопоставляет ему поддерживающее действие Яхве.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Уступительная конструкция «хотя… и» звучит естественно, а «держит его за руку» сохраняет телесный образ Божьей поддержки без тяжеловесной буквальности.
