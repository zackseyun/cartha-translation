  source_fidelity: 'Текст точно передаёт структуру и образы еврейского стиха: уступительное «Хотя он и упадёт» допустимо для כִּי в данном контексте; «не будет повержен» сохраняет отличие יוּטָל («быть брошенным/низвергнутым») от предшествующего «упадёт»; Яхве продолжает поддерживать его руку. «Держит его за руку» — естественная русская передача образа поддержки и согласуется с английской редакционной траекторией «holds his hand».'
