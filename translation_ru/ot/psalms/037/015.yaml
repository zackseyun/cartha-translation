lexical_decisions:
- source_word: חַרְבָּם
  choice: их меч
  rationale: Существительное стоит в единственном числе с суффиксом 3-го лица множественного числа. Русское «их меч» сохраняет собирательно-распределительный образ еврейского текста.
- source_word: תָּבוֹא
  choice: войдёт
  rationale: Форма Qal imperfect согласуется с «мечом»; при сочетании с בְּ и «сердцем» естественно выражает проникновение внутрь.
- source_word: בְלִבָּם
  choice: в их же сердце
  rationale: Предлог передаёт направление внутрь, а частица «же» естественно подчёркивает подразумеваемый контекстом возврат оружия против его владельцев, не добавляя отдельного рефлексивного местоимения.
- source_word: וְקַשְּׁתוֹתָם
  choice: и луки их
  rationale: Форма множественного числа с притяжательным суффиксом передана прямо; постпозиция местоимения поддерживает достоинство поэтической речи.
- source_word: תִּשָּׁבַרְנָה
  choice: будут сломаны
  rationale: Niphal imperfect женского рода множественного числа имеет пассивный смысл. «Будут сломаны» точно и без усиления передаёт значение שבר.
