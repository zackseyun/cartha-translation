  text: כִּ֤י רְשָׁעִ֨ים יֹאבֵ֗דוּ וְ/אֹיְבֵ֣י יְ֭הוָה כִּ/יקַ֣ר כָּרִ֑ים כָּל֖וּ בֶ/עָשָׁ֣ן כָּֽלוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/020.yaml
  text: For the wicked will perish[a], and the enemies of Yahweh are like the glory of the pastures; they vanish—like smoke they vanish away.
translation:
  language: ru
  text: 'Ибо нечестивые погибнут, и враги Яхве — словно краса пастбищ[a]: они исчезнут, исчезнут как дым.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному толкованию: «словно жир ягнят». Еврейское выражение неясно.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Но
  rationale: В данном контексте частица вводит противопоставление участи нечестивых участи праведных в предыдущих стихах; русское «но» естественно передаёт эту связь, хотя частица допускает и пояснительное «ибо».
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Устойчивое и понятное обозначение людей, живущих вопреки Божьей правде, в поэтической и премудростной речи.
- source_word: יֹאבֵדוּ
  choice: погибнут
  rationale: Передаёт обычное значение глагола אבד — погибнуть, прийти к гибели — и сохраняет форму будущего времени.
- source_word: וְאֹיְבֵי יְהוָה
  choice: и враги Яхве
  rationale: Прямо передаёт конструкцию принадлежности и сохраняет личное имя Бога.
- source_word: כִּיקַר כָּרִים
  choice: словно краса пастбищ
  rationale: Передаёт יקר как «краса, великолепие», а כרים как «пастбища». Образ согласуется с последующим исчезновением, но ввиду трудности еврейского выражения традиционное толкование отмечено в сноске.
- source_word: כָּלוּ ... כָּלוּ
  choice: они исчезнут, исчезнут
  rationale: Повтор глагола כלה сохранён для передачи поэтического усиления и полноты исчезновения.
- source_word: בֶעָשָׁן
  choice: как дым
  rationale: Сравнительная передача предлога ב естественна по-русски и ясно выражает образ быстрого и полного исчезновения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон — личное имя Бога; форма «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Толкование כִּיקַר כָּרִים
  choice: словно краса пастбищ
  alternative: словно жир ягнят
  rationale: 'Еврейское выражение лексически неоднозначно: כרים может обозначать пастбища либо баранов/ягнят, а יקר — красу, ценность или, согласно традиционному пониманию, жир. Основной текст сохраняет образ красы пастбищ, а альтернативу сообщает сноска.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Повтор «исчезнут» намеренно сохранён как стилистический приём еврейского текста; «краса» выбрана ради краткости и псалмического регистра.
