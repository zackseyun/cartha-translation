source:
  edition: WLC
  text: יוֹדֵ֣עַ יְ֭הוָה יְמֵ֣י תְמִימִ֑ם וְ֝/נַחֲלָתָ֗/ם לְ/עוֹלָ֥ם תִּהְיֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/018.yaml
  text: Yahweh knows the days of the blameless[b][a], and their inheritance will be forever.
translation:
  language: ru
  text: Яхве знает дни непорочных[a], и наследие их будет вовек[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «людей цельных»; речь идёт о людях, отличающихся цельностью и безупречностью, а не обязательно об абсолютной безгрешности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и наследие их будет вовек». Эти слова могут подразумевать как непреходящий характер наследия, так и постоянное обладание им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: יוֹדֵעַ
  choice: знает
  rationale: Прямо передаёт причастную форму со значением постоянного, внимательного знания, не добавляя толкований «одобряет» или «хранит».
- source_word: יְמֵי
  choice: дни
  rationale: Сохраняет конкретный еврейский образ; в контексте речь идёт о днях жизни и жизненном пути.
- source_word: תְמִימִם
  choice: непорочных
  rationale: Передаёт значение цельности и нравственной безупречности в контрасте с нечестивыми, не обязательно подразумевая абсолютную безгрешность.
- source_word: נַחֲלָתָם
  choice: наследие их
  rationale: Сохраняет как значение полученного удела, так и заветный оттенок слова; постпозиция местоимения поддерживает достоинство поэтической строки.
- source_word: לְעוֹלָם
  choice: вовек
  rationale: Краткое и естественное для русской библейской поэзии обозначение непреходящей длительности.
- source_word: תִּהְיֶה
  choice: будет
  rationale: Формально передаёт простую форму глагола «быть», не добавляя прямо не выраженного значения «останется».
theological_decisions:
- issue: Значение «непорочных» в контексте литературы мудрости
  choice: Люди, отличающиеся цельностью и нравственной безупречностью
  alternative: Абсолютно безгрешные люди; праведные; цельные сердцем
  rationale: תְמִימִם описывает цельность характера в противопоставлении нечестивым; перевод сохраняет силу слова, но не утверждает абсолютной безгрешности.
- issue: Смысл знания Яхве
  choice: Передать простым глаголом «знает», оставив в контексте оттенок внимательного, личного знания
  alternative: «печётся о», «наблюдает за», «одобряет»
  rationale: В контексте знание, вероятно, означает больше простого осведомления, однако более развёрнутые варианты вносили бы в перевод не выраженное прямо толкование.
- issue: Продолжительность наследия
  choice: «будет вовек» — сохранение утверждения о непреходящем наследии без уточнения его характера
  alternative: «останется навеки»; «будет принадлежать им вечно»
  rationale: Еврейский текст допускает оттенки постоянства наследия или длительного обладания им, но не уточняет механизм и характер этой непреходящести.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Слова «вовек» и постпозиция в сочетании «наследие их» сохраняют достоинство псалма, оставаясь понятными современному читателю.
