  text: שְׁמָר תָּ֭ם וּ/רְאֵ֣ה יָשָׁ֑ר כִּֽי אַחֲרִ֖ית לְ/אִ֣ישׁ שָׁלֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/037.yaml
  text: Observe the blameless[a], and see the upright[c][b], for there is a future for the man of peace.
translation:
  language: ru
  text: Наблюдай за непорочным[a] и смотри на праведного, ведь у миролюбивого человека[c] есть будущее[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Замечай непорочного и всматривайся в праведного».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово אַחֲרִית может также означать «конец» или «исход»; некоторые понимают его здесь как «потомство».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «у человека мира»; שָׁלוֹם может также выражать благополучие или целостность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר
  choice: наблюдай за
  rationale: В данном контексте повелительная форма означает внимательно замечать человека и следить за его судьбой, а не охранять или сохранять его.
- source_word: תָּם
  choice: непорочным
  rationale: Слово обозначает нравственную цельность и безупречность, не обязательно абсолютную безгрешность.
- source_word: וּרְאֵה
  choice: и смотри на
  rationale: Сохранена вторая повелительная форма и поэтический параллелизм первой строке.
- source_word: יָשָׁר
  choice: праведного
  rationale: Здесь прилагательное употреблено как существительное и характеризует нравственно прямого человека; «праведный» естественно передаёт этот смысл в современном русском.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для призыва; «ведь» естественно выражает пояснительно-причинную связь.
- source_word: אַחֲרִית
  choice: будущее
  rationale: Слово может обозначать будущее, конец или конечный исход. В данном контексте «будущее» передаёт положительную перспективу, не устраняя прочие возможные оттенки, отмеченные в сноске.
- source_word: לְאִישׁ
  choice: у … человека
  rationale: Еврейский текст употребляет существительное мужского рода в единственном числе; русская конструкция с «человеком» сохраняет это и звучит естественно.
- source_word: שָׁלוֹם
  choice: миролюбивого
  rationale: В сочетании с אִישׁ слово характеризует человека как мирного, стремящегося к миру; более широкие значения благополучия и целостности сохранены в сноске.
theological_decisions:
- issue: Мужской род единственного числа אִישׁ в изречении мудрости
  choice: человека
  alternative: человека любого пола / того, кто
  rationale: Перевод сохраняет грамматически мужскую форму оригинала, не отрицая обобщающей применимости изречения.
- issue: Значение אַחֲרִית для судьбы праведного
  choice: есть будущее
  alternative: будет добрый конец / есть потомство
  rationale: Контекст противопоставляет конечную участь праведного участи беззаконных. «Будущее» передаёт благую перспективу, но не уточняет без достаточных оснований, идёт ли речь о конечном исходе либо потомстве.
- issue: Характеристика אִישׁ שָׁלוֹם
  choice: миролюбивый человек
  alternative: человек мира / благополучный человек
  rationale: Основной текст естественно передаёт характеристику человека как стремящегося к миру, а сноска сохраняет возможные оттенки благополучия и целостности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Синтаксис остаётся простым и ясным; смысловые неоднозначности אַחֲרִית и שָׁלוֹם не устранены, а вынесены в сноски.
