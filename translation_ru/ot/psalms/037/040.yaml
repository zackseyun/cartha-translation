base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/040.yaml
  text: Yahweh helps them and delivers them[a]; he delivers them from the wicked and saves them[b], because they take refuge in him.
translation:
  language: ru
  text: Яхве помогает им и избавляет их[a]; Он избавляет их от нечестивых и спасает их, потому что они ищут у Него прибежища[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасает их» в обоих случаях; в еврейском тексте один и тот же глагол избавления повторён для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «полагаются на Него»; буквально речь идёт о том, чтобы искать у Него укрытия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: וַיַּעְזְרֵם
  choice: помогает им
  rationale: Глагол עזר означает «помогать, оказывать помощь»; настоящее время естественно передаёт итоговое, обобщающее утверждение псалма.
- source_word: וַיְפַלְּטֵם / יְפַלְּטֵם
  choice: избавляет их; Он избавляет их
  rationale: Обе формы происходят от פלט и обозначают избавление или спасение от опасности. Повтор сохранён как выразительный приём еврейского текста.
- source_word: מֵרְשָׁעִים
  choice: от нечестивых
  rationale: Субстантивированное множественное число обозначает нечестивых людей без указания пола; традиционное русское слово точно сохраняет нравственную характеристику.
- source_word: וְיוֹשִׁיעֵם
  choice: и спасает
  rationale: Глагол ישׁע имеет широкий смысл спасения и избавления; «спасает» сохраняет как непосредственный, так и богословский вес выражения.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину спасительного действия Яхве.
- source_word: חָסוּ בוֹ
  choice: они ищут у Него прибежища
  rationale: חסה выражает обращение к кому-либо за укрытием и защитой. Формулировка сохраняет образ прибежища, не сводя его к отвлечённому доверию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон, поэтому личное имя сохранено, а не заменено титулом. «Яхве» соответствует принятой научной реконструкции произношения.
- issue: Сохранение повтора глагола פלט
  choice: «избавляет их; Он избавляет их»
  alternative: Объединить в одно выражение «помогает и избавляет их»
  rationale: Повтор в еврейском тексте усиливает мысль и связывает общее избавление с избавлением от нечестивых; его устранение ослабило бы поэтический акцент.
- issue: Смысл חָסוּ בוֹ
  choice: «ищут у Него прибежища»
  alternative: «полагаются на Него»
  rationale: Выбранный вариант сохраняет конкретную метафору укрытия и защиты, одновременно допуская подразумеваемое доверие.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Синтаксический параллелизм и повтор исходного текста сохранены; устаревшие формы и конфессионально специфические добавления не использованы.
