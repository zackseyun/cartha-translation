lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Обычное и достойное русское соответствие божественному титулу אֲדֹנָי; оно ясно указывает на Бога и естественно звучит в псалме.
- source_word: יִשְׂחַק
  choice: смеётся
  rationale: Сохраняет прямое значение глагола שׂחק. В данном контексте смех имеет насмешливый оттенок, пояснённый в сноске, но основной текст не заменяет образ его толкованием.
- source_word: לוֹ
  choice: над ним
  rationale: При глаголе «смеяться» русское «над ним» естественно обозначает человека как объект насмешливого смеха.
- source_word: כִּי
  choice: потому что
  rationale: Первое כִּי вводит причину смеха Господа.
- source_word: רָאָה
  choice: видит
  rationale: Хотя в еврейском употреблена перфектная форма, здесь она выражает актуальное восприятие грядущего исхода; настоящее время естественно передаёт это по-русски.
- source_word: כִּי
  choice: что / двоеточие
  rationale: Второе כִּי вводит содержание того, что Господь видит. В русском это естественно передаётся бессоюзной конструкцией после двоеточия.
- source_word: יָבֹא
  choice: приходит
  rationale: Передаёт несовершенный вид еврейского глагола и живо изображает грядущий день как приближающийся, не уточняя сверх текста степень его близости.
- source_word: יוֹמוֹ
  choice: день его
  rationale: Сохраняет краткость и поэтическую выразительность буквального «его день», не раскрывая в основном тексте подразумеваемый день падения или суда.
theological_decisions:
- issue: Характер смеха Господа
  choice: «Господь смеётся над ним» с пояснением насмешливого оттенка в сноске
  alternative: «Господь насмехается над ним»
  rationale: Еврейский глагол буквально означает «смеяться», тогда как контекст придаёт смеху оттенок презрения к тщетным замыслам нечестивого перед судом. Буквальный образ сохранён без приписывания Богу легкомыслия или жестокости.
- issue: Значение выражения «день его»
  choice: Сохранить выражение в основном тексте и пояснить его в сноске
  alternative: «день его гибели/суда»
  rationale: Сам еврейский текст оставляет «день» кратким и контекстуально наполненным образом. Уточнение в основном тексте устранило бы поэтическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Инверсия «день его» намеренно сохраняет библейскую выразительность и смысловую ударность исходного текста; сноски стоят непосредственно при поясняемых выражениях.
