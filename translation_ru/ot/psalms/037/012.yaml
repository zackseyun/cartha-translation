  text: 'Нечестивый строит козни против праведника[a]

    и скрежещет зубами на него[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «замышляет против праведника»; возможно: «замышляет зло против праведника».'
