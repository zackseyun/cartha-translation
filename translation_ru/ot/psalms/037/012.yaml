lexical_decisions:
- source_word: זֹמֵם
  choice: замышляет зло
  rationale: Причастие обозначает обдумывание враждебного замысла. Добавление «зло» естественно передаёт подразумеваемую злонамеренность и соответствует контексту.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное в единственном числе обозначает нечестивого человека; традиционное для псалмов слово остаётся понятным в современном литературном русском.
- source_word: לַצַּדִּיק
  choice: против праведника
  rationale: Предлог לְ в данном контексте указывает на объект враждебного замысла, поэтому передан словом «против».
- source_word: חֹרֵק
  choice: скрежещет
  rationale: Глагол обозначает скрежет зубов как проявление ярости и вражды; русский фразеологический оборот сохраняет образ и эмоциональную силу.
- source_word: עָלָיו
  choice: на него
  rationale: При выражении «скрежетать зубами» русский язык естественно обозначает направленность вражды сочетанием «на кого-либо».
- source_word: שִׁנָּיו
  choice: зубами
  rationale: Еврейское «его зубы» в русском устойчивом выражении естественно передаётся творительным падежом без притяжательного местоимения.
