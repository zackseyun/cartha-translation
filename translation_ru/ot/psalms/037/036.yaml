    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: он прошёл
  rationale: Глагол עבר буквально обозначает прохождение или переход и в данном контексте ведёт к внезапному исчезновению нечестивого. «Прошёл» сохраняет исходный образ и не уточняет без достаточных оснований, идёт ли речь именно о смерти.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Частица הִנֵּה привлекает внимание к неожиданному результату; современное русское «и вот» естественно передаёт её риторическую силу.
- source_word: אֵינֶנּוּ
  choice: его уже нет
  rationale: Еврейское выражение означает отсутствие или исчезновение. «Его уже нет» сохраняет краткость и резкость фразы, не утверждая уничтожения личности.
- source_word: וָאֲבַקְשֵׁהוּ
  choice: я искал его
  rationale: בקשׁ здесь означает искать кого-либо; выбранный вариант ясен, краток и соответствует поэтическому регистру.
- source_word: וְלֹא נִמְצָא
  choice: но не нашёл
  rationale: 'Буквально: «и не был найден». После слов «я искал его» русская активная конструкция звучит естественнее и точно передаёт безуспешность поиска; союз «но» выражает подразумеваемое противопоставление.'
theological_decisions:
- issue: Обозначает ли исчезновение нечестивого непосредственно его смерть
  choice: Не уточнять смерть, сохранив образ прохождения и последующего отсутствия
  alternative: «Он умер» или «он ушёл из жизни»
  rationale: Глагол עבר допускает понимание прохождения, ухода или исчезновения; контекст говорит об отсутствии нечестивого, но сам стих не называет смерть прямо.
translation_notes:
  register: Современный литературный русский с лаконичным поэтическим строем. Тире перед «и вот» подчёркивает внезапность перемены; сохранена смысловая неоднозначность еврейского глагола.
