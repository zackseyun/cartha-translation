lexical_decisions:
- source_word: פִּי צַדִּיק
  choice: Уста праведника
  rationale: Сохраняется еврейская конструкция «уста праведника» и метонимия речи. Субстантивированное צַדִּיק естественно передаётся по-русски словом «праведник», без добавления отсутствующего в оригинале слова «мужчина».
- source_word: יֶהְגֶּה
  choice: изрекают
  rationale: Глагол הגה может обозначать размышление, негромкое произнесение или высказывание. Поскольку подлежащим служат «уста», а параллельная строка говорит о языке, здесь предпочтителен смысл осмысленного устного выражения.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Прямой и устойчивый русский эквивалент; мудрость представлена как содержание речи праведника.
- source_word: וּלְשׁוֹנוֹ
  choice: и язык его
  rationale: Сохранён образ языка как органа речи и поэтический параллелизм с устами; постпозиция местоимения соответствует достоинству поэтического регистра.
- source_word: תְּדַבֵּר
  choice: говорит
  rationale: Прямой эквивалент דבר, согласующийся с подлежащим «язык» и не усиливающий значение до «провозглашает».
- source_word: מִשְׁפָּט
  choice: справедливое
  rationale: В данном контексте слово обозначает то, что право и справедливо. Субстантивированное «справедливое» естественнее при глаголе «говорит», чем буквальное, но менее русское «говорит справедливость»; многозначность отмечена в сноске.
theological_decisions:
- issue: Мужской род единственного числа в поэзии мудрости
  choice: праведника
  alternative: праведного человека
  rationale: Еврейское צַדִּיק — субстантивированная форма мужского рода единственного числа с типовым, представительным значением. Русское «праведник» точно отражает форму и не утверждает, что сказанное применимо исключительно к мужчинам.
- issue: Значение מִשְׁפָּט
  choice: справедливое
  alternative: суд; правосудие; то, что право
  rationale: Контекст характеризует речь праведника вообще, а не обязательно судебный приговор. Перевод сохраняет этическое значение, не исключая юридических оттенков, указанных в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. «Уста» и «изрекают» сохраняют достоинство псалма и параллелизм оригинала, оставаясь понятными современному читателю.
