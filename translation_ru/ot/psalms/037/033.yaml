  text: יְ֭הוָה לֹא יַעַזְבֶ֣/נּוּ בְ/יָד֑/וֹ וְ/לֹ֥א יַ֝רְשִׁיעֶ֗/נּוּ בְּ/הִשָּׁפְטֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/033.yaml
  text: Yahweh will not leave him in his hand[c][b][a], nor condemn him when he is judged.
translation:
  language: ru
  text: Яхве не оставит его в руке нечестивца[a] и не признает его виновным, когда его будут судить[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в его руке», то есть во власти нечестивца.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и не осудит его, когда он будет судим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма «Яхве» общепринята в современной русской библеистике.
- source_word: יַעַזְבֶנּוּ
  choice: не оставит его
  rationale: Глагол עזב допускает значения «оставить», «покинуть», «предать»; «не оставит» естественно по-русски и сохраняет широкий смысл исходного слова.
- source_word: בְיָדוֹ
  choice: в руке нечестивца
  rationale: 'Сохранён образ руки как власти или контроля. Слово «нечестивца» проясняет контекстуальный референт местоименного суффикса: речь идёт о нечестивом из предыдущего стиха; буквальная форма отмечена в сноске.'
- source_word: יַרְשִׁיעֶנּוּ
  choice: не признает его виновным
  rationale: Порода hifil глагола רשע здесь имеет судебный смысл — признать или объявить виновным. Эта формулировка точнее передаёт судебное решение, чем более широкое «осудить».
- source_word: בְּהִשָּׁפְטוֹ
  choice: когда его будут судить
  rationale: Предлог בְּ с инфинитивом и местоименным суффиксом передан временным придаточным; неопределённо-личная конструкция естественна по-русски и не уточняет, кто именно осуществляет суд.
theological_decisions:
- issue: К кому относятся местоимения
  choice: Объектные местоимения относятся к праведнику, а «его рука» — к нечестивцу из ближайшего контекста.
  alternative: Сохранить формально неоднозначное «в его руке» без названного референта.
  rationale: Предыдущий стих говорит о нечестивом, который подстерегает праведника и ищет его смерти. Уточнение «нечестивца» предотвращает ложное русское прочтение, будто речь идёт о руке самого праведника, при этом буквальная форма сохраняется в сноске.
- issue: Судебный смысл второй части стиха
  choice: Яхве не признает праведника виновным, когда того будут судить.
  alternative: Яхве не позволит осудить праведника или не даст счесть его нечестивым.
  rationale: Форма יַרְשִׁיעֶנּוּ непосредственно называет действие Яхве и имеет форензический смысл. Перевод не добавляет модального значения «не позволит» и не связывает обещание с более поздними богословскими категориями.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены образ «руки» и судебная лексика; синтаксис сделан понятным без устранения значимой смысловой напряжённости.
