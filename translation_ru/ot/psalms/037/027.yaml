  source_fidelity: 'Основной текст точно передаёт три еврейских повеления: סוּר — «уклоняйся», מֵרָע — «от зла», וַעֲשֵׂה טוֹב — «и делай добро», וּשְׁכֹן לְעוֹלָם — «и живи вовек». «Живи» несколько шире буквального «обитай/пребывай», но в данном кратком поэтическом контексте естественно передаёт продолжительное пребывание и не добавляет невыраженный объект.'
  naturalness: Текст звучит естественно в современном литературном русском и сохраняет умеренно возвышенный псалмовый регистр. «Уклоняйся от зла и делай добро» — ясная и устойчивая нравственная формула; «вовек» уместно для жанра. Тире допустимо как интонационное членение и не меняет синтаксической силы заключительного повеления.
