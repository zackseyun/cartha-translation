  text: ס֣וּר מֵ֭/רָע וַ/עֲשֵׂה ט֗וֹב וּ/שְׁכֹ֥ן לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/027.yaml
  text: Turn away from evil and do good[a], and dwell forever.
translation:
  language: ru
  text: Уклоняйся от зла и делай добро — и живи вовек.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с учётом повторяющейся темы псалма: «и живи в земле вовек» или «и живи вовек в безопасности». В еврейском тексте этого стиха слова «в земле» прямо не выражены.'
    reason: alternative_reading
lexical_decisions:
- source_word: סוּר
  choice: уклоняйся
  rationale: Повелительная форма выражает сознательный отказ и удаление от зла; «уклоняйся» естественно передаёт нравственную направленность глагола, не сводя его к пространственному движению.
- source_word: מֵרָע
  choice: от зла
  rationale: Предлог מִן указывает, от чего следует удаляться, а רַע в данном нравственном контексте естественно означает «зло».
- source_word: וַעֲשֵׂה טוֹב
  choice: и делай добро
  rationale: Краткая и естественная передача повеления сохраняет параллелизм со словами «уклоняйся от зла».
- source_word: וּשְׁכֹן
  choice: и живи
  rationale: Глагол означает «обитать, жить, поселяться». Русское «живи» здесь звучит естественнее, чем «обитай», при этом сохраняет идею продолжительного пребывания; возможная связь с проживанием в земле отмечена в сноске.
- source_word: לְעוֹלָם
  choice: вовек
  rationale: Передаёт длительное, неограниченное продолжение и соответствует возвышенному, но понятному регистру псалма.
theological_decisions:
- issue: Смысл וּשְׁכֹן לְעוֹלָם
  choice: 'Сохранить повелительную форму и не добавлять в основной текст прямо не названный объект: «и живи вовек».'
  alternative: «и будешь жить вовек»; «и живи в земле вовек»; «и живи вовек в безопасности»
  rationale: В еврейском тексте стоит последовательность повелительных форм. Тема земли и безопасного пребывания в ней неоднократно возникает в Псалме 37, однако в самом стихе объект «земля» и наречие «безопасно» отсутствуют. Основной текст сохраняет лаконичность и напряжение оригинала, а контекстуальные толкования вынесены в сноску.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. «Уклоняйся» и «вовек» понятны современному читателю и сохраняют достоинство поэтической речи; тире помогает ясно связать заключительное повеление с двумя предыдущими.
