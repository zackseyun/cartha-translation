base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/023.yaml
  text: From Yahweh a man's steps are established[b][a], and he delights in his way.
translation:
  language: ru
  text: Господь утверждает шаги человека и радуется его пути.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и человек радуется своему пути»; в еврейском тексте подлежащее глагола не названо явно.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵיְהוָה
  choice: От Господа
  rationale: Предлог מִן обозначает источник, а при страдательной форме также подразумевает деятеля. «От Господа» сохраняет исходный образ и порядок еврейской фразы; священное имя יהוה по принятой русской библейской традиции передано как «Господь».
- source_word: מִצְעֲדֵי
  choice: шаги
  rationale: Слово обозначает шаги, поступь и в переносном смысле ход жизни. «Шаги» естественно сохраняет метафору оригинала.
- source_word: גֶבֶר
  choice: человека
  rationale: Существительное имеет мужской род и может обозначать мужчину, однако в данном изречении употреблено обобщённо. Русское «человека» естественно выражает общий смысл, не устраняя грамматически мужской образ.
- source_word: כּוֹנָנוּ
  choice: утверждаются
  rationale: Пассивная форма глагола כון означает, что шаги делаются твёрдыми, устойчивыми, надёжно установленными. «Утверждаются» сохраняет залог и не сужает смысл до одного лишь направления или руководства.
- source_word: וְדַרְכּוֹ
  choice: к его пути
  rationale: דֶּרֶךְ — «путь», буквально или как образ образа жизни. Местоимение «его» в основном чтении относится к человеку.
- source_word: יֶחְפָּץ
  choice: Он благоволит
  rationale: Глагол חפץ выражает удовольствие, расположение или благоволение. «Благоволит» здесь естественно передаёт положительное отношение Господа к пути человека, не сводя его к эмоциональной радости.
theological_decisions:
- issue: Подлежащее при יֶחְפָּץ («благоволит / находит удовольствие»)
  choice: 'В основном тексте подлежащим является Господь: «Он благоволит к его пути».'
  alternative: 'Подлежащим может быть человек: «и он находит удовольствие в своём пути».'
  rationale: В еврейском тексте подлежащее глагола не выражено явно. Господь — наиболее естественный смысловой субъект, однако грамматика допускает отнесение глагола к человеку; эта подлинная неоднозначность сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены начальная конструкция «От Господа», страдательный залог и метафора шагов; прописная буква в «Он» обозначает основное толкование, а допустимая неоднозначность отражена в сноске.
