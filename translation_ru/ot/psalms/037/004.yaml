lexical_decisions:
- source_word: הִתְעַנַּג
  choice: Находи радость
  rationale: Возвратный императив породы хитпаэль призывает находить удовольствие и отраду. Формулировка естественна для современного русского языка и передаёт направленное действие самого адресата.
- source_word: עַל
  choice: в
  rationale: Хотя основное пространственное значение предлога — «на», при обозначении того, в ком находят радость, русское «в» естественно передаёт его реляционный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: יִתֶּן
  choice: Он даст
  rationale: Имперфект с союзом в данном наставительно-поэтическом контексте естественно выражает последующий результат или обещание.
- source_word: מִשְׁאֲלֹת
  choice: то, чего желает
  rationale: Существительное может обозначать желания либо просьбы. В сочетании с «сердцем» основной текст передаёт внутренние желания; лексическая альтернатива сохранена в сноске.
- source_word: לִבֶּךָ
  choice: твоё сердце
  rationale: «Сердце» сохраняет библейский образ внутреннего центра желаний, воли и намерений человека.
theological_decisions:
- issue: Возможность прочитать обещание как безусловную гарантию материального благополучия
  choice: Сохранить прямое обещание без добавочных ограничений
  alternative: Добавить «угодные Богу желания» или пояснить, что Бог сначала изменяет желания человека
  rationale: Таких уточнений в еврейском тексте нет; перевод не должен устранять присущее высказыванию богословское напряжение.
- issue: Передача тетраграмматона
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя יהוה; транслитерация сохраняет имя, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с поэтической сдержанностью. «Находи радость» звучит естественнее буквального «наслаждайся» и сохраняет призыв самого адресата обрести отраду в Яхве. Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской библейской традицией.
