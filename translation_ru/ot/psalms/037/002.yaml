lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит основание для предшествующего увещания; в современном русском «потому что» естественно передаёт причинно-пояснительную связь.
- source_word: כֶחָצִיר
  choice: как трава
  rationale: חָצִיר обычно обозначает траву или травянистую растительность; «трава» ясно и естественно передаёт образ недолговечности.
- source_word: מְהֵרָה
  choice: быстро
  rationale: Наречие подчёркивает скорое исчезновение нечестивых; «быстро» непосредственно передаёт значение исходного слова.
- source_word: יִמָּלוּ
  choice: увянут
  rationale: В данном растительном образе глагол, вероятнее всего, описывает увядание или засыхание, хотя возможна традиционная трактовка «будут скошены»; неоднозначность отмечена в сноске.
- source_word: וּכְיֶרֶק דֶּשֶׁא
  choice: как зелёная поросль
  rationale: Сочетание обозначает свежую зелёную растительность. «Зелёная поросль» сохраняет образ нежной, пышной зелени и избегает неуклюжего повтора слова «трава».
- source_word: יִבּוֹלוּן
  choice: поблекнут
  rationale: Глагол означает увядать, терять свежесть и жизненную силу; «поблекнут» создаёт естественный русский параллелизм с «увянут» без полного лексического повтора.
