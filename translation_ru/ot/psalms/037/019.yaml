id: PSA.37.19
reference: Psalms 37:19
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹֽא יֵ֭בֹשׁוּ בְּ/עֵ֣ת רָעָ֑ה וּ/בִ/ימֵ֖י רְעָב֣וֹן יִשְׂבָּֽעוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/019.yaml
  text: They will not be put to shame in a time of trouble[c][b][a], and in days of famine they will be satisfied.
translation:
  language: ru
  text: Не будут они посрамлены[a] во время бедствия[b], и в дни голода будут сыты[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будут стыдиться». Еврейский глагол может означать как переживание стыда, так и посрамление или разочарование из-за несбывшихся ожиданий.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во время невзгод», «в пору несчастья». Здесь имеется в виду беда, а не нравственное зло.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «насытятся», «будут насыщены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: не будут посрамлены
  rationale: Глагол בושׁ может обозначать переживание стыда, разочарование из-за несбывшихся ожиданий или публичное посрамление. «Не будут посрамлены» естественно передаёт результативный оттенок и сохраняет обещание псалма.
- source_word: בְּעֵת רָעָה
  choice: во время бедствия
  rationale: Сочетание обозначает пору несчастья или тяжёлых обстоятельств. «Во время бедствия» ясно и литературно передаёт смысл без ошибочной нравственной трактовки слова רָעָה.
- source_word: רָעָה
  choice: бедствие
  rationale: В данном контексте слово относится к несчастью и невзгодам, а не к нравственному злу.
- source_word: וּבִימֵי רְעָבוֹן
  choice: и в дни голода
  rationale: Буквально и естественно передаёт еврейскую конструкцию; «голод» здесь обозначает тяжёлую нехватку пищи.
- source_word: רְעָבוֹן
  choice: голод
  rationale: Слово означает голод, нехватку продовольствия или состояние острого недоедания; «голод» — точный и привычный русский эквивалент.
- source_word: יִשְׂבָּעוּ
  choice: будут сыты
  rationale: Глагол שׂבע означает насытиться, иметь достаточно пищи. «Будут сыты» кратко, ясно и непосредственно связано с упомянутыми днями голода.
theological_decisions:
- issue: Значение רָעָה в выражении בְּעֵת רָעָה
  choice: бедствие, то есть внешние невзгоды
  alternative: зло в нравственном смысле
  rationale: Контекст противопоставляет тяжёлое время Божьему обеспечению праведных; речь идёт о несчастье или бедствии, а не об этическом зле.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Инверсия «Не будут они» сохраняет умеренно возвышенный псалмический ритм, оставаясь понятной современному читателю; лексика конкретна и не перегружена архаизмами.
