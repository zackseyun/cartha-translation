  text: Better is a little that belongs to the righteous than the abundance of many wicked people[a][b].
translation:
  language: ru
  text: Лучше малое у праведника[a], чем изобилие у многих нечестивых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «малое для праведника». Еврейская фраза эллиптична; предлог может указывать как на обладание, так и на то, что предназначено кому-либо.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «богатство многих нечестивых». Еврейское слово может означать обилие, множество или богатство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: Лучше
  rationale: В сравнительной конструкции слово имеет значение «лучше» и сохраняет краткий, афористичный тон.
- source_word: מְעַט
  choice: малое
  rationale: Субстантивированное «малое» естественно по-русски передаёт небольшое количество и образует ясный контраст с «изобилием».
- source_word: לַצַּדִּיק
  choice: у праведника
  rationale: Предлог ל в эллиптической конструкции допускает значение обладания; русская конструкция «у праведника» выражает его естественно, сохраняя единственное число.
- source_word: מֵהֲמוֹן
  choice: чем изобилие
  rationale: הָמוֹן может обозначать множество, обилие или богатство. «Изобилие» сохраняет широту слова и не ограничивает его исключительно материальным богатством.
- source_word: רְשָׁעִים רַבִּים
  choice: у многих нечестивых
  rationale: 'Прилагательное רַבִּים естественно относится к существительному во множественном числе רְשָׁעִים: «многие нечестивые». Повтор конструкции с «у» ясно передаёт подразумеваемое обладание.'
