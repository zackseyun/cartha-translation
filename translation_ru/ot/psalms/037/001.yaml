  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/001.yaml
  text: Of David[a]. Do not be provoked by evildoers[b]; do not envy those who do wrong.
translation:
  language: ru
  text: 'Давида.[a]


    Не раздражайся из-за злодеев,

    не завидуй творящим неправду.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давидов», «Давидом» или «для Давида». Еврейское надписание может указывать на авторство, принадлежность, связь или посвящение.'
    reason: textual_ambiguity
  - marker: b
    text: 'Или: «поступающим несправедливо» / «творящим беззаконие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткое надписание сохраняет традиционную и относительно нейтральную передачу конструкции לְדָוִד, которая может указывать на авторство, принадлежность, связь или посвящение.
- source_word: אַל תִּתְחַר
  choice: Не раздражайся
  rationale: Глагол חרה в хитпаэле описывает внутреннее разгорячение, волнение или досаду. «Не раздражайся» естественно звучит по-русски и не сужает значение до ярости.
- source_word: בַּמְּרֵעִים
  choice: из-за злодеев
  rationale: Предлог ב здесь указывает на причину или повод внутреннего волнения; «из-за» ясно выражает эту связь. Причастная форма מרעים обозначает людей, делающих зло.
- source_word: אַל תְּקַנֵּא
  choice: не завидуй
  rationale: В данном контексте קנא означает зависть к тем, кто поступает неправедно; русское «завидовать» точно и естественно передаёт смысл.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: творящим неправду
  rationale: Причастная конструкция буквально обозначает совершающих עַוְלָה — неправду, несправедливость или неправедность. Формулировка сохраняет деятельный характер выражения и достоинство поэтической речи.
