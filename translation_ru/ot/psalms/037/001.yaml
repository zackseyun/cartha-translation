  source_fidelity: 'Текст точно передаёт еврейский оригинал: надписание לְדָוִד оставлено нейтральным («Давида»); запрет אַל с формами несовершенного вида передан естественным русским повелительным отрицанием; תִּתְחַר передано как внутреннее раздражение, вызванное злодеями; תְּקַנֵּא — как зависть. Параллельные характеристики מְרֵעִים и עֹשֵׂי עַוְלָה сохранены без искусственного отождествления.'
  naturalness: «Не раздражайся из-за злодеев, не завидуй творящим неправду» звучит естественно в современном литературном русском и сохраняет лаконичный поэтический параллелизм. «Творящим неправду» несколько возвышенно, но уместно для псалма и понятно современному читателю.
  terminology: «Злодеи» адекватно передаёт מְרֵעִים, а «творящие неправду» — עֹשֵׂי עַוְלָה. Примечание к надписанию корректно отражает семантическую широту לְדָוִד, не навязывая авторское значение. Примечание b уместно фиксирует варианты для עַוְלָה.
