lexical_decisions:
- source_word: צוֹפֶה
  choice: подстерегает
  rationale: Причастие от צפה буквально обозначает наблюдение, но в данном враждебном контексте подразумевает слежку с намерением причинить зло; русское «подстерегает» естественно передаёт и наблюдение, и угрозу.
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное в единственном числе обозначает типичного нечестивого человека; «нечестивый» сохраняет этическую категорию псалма и представительный характер единственного числа.
- source_word: לַצַּדִּיק
  choice: праведника
  rationale: צַדִּיק обозначает праведного человека. В сочетании с «подстерегает» дательный показатель ל естественно передаётся русским винительным падежом.
- source_word: וּמְבַקֵּשׁ
  choice: и ищет, как
  rationale: בקש имеет основное значение «искать» и здесь выражает направленное злое намерение. Оборот «ищет, как» звучит по-русски естественно и не ослабляет деятельного характера замысла.
- source_word: לַהֲמִיתוֹ
  choice: умертвить его
  rationale: Каузативный инфинитив породы хифиль от מות означает «причинить смерть». «Умертвить его» сохраняет каузативную силу и возвышенно-поэтический регистр без архаичного «предать смерти».
- source_word: וּ
  choice: и
  rationale: 'Союз прямо связывает два одновременных действия нечестивого: он подстерегает и ищет способ умертвить.'
