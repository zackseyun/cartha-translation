  text: For those blessed by him will inherit the land[a], but those cursed by him will be cut off.
translation:
  language: ru
  text: Ибо благословлённые Им унаследуют землю[a], а проклятые Им будут отсечены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страну». Еврейское אֶרֶץ может означать «землю» или «страну»; в контексте псалма особенно заметен смысл обещанной земли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующей мысли; «ибо» естественно передаёт пояснительно-причинную связь и соответствует достоинству поэтической речи.
- source_word: מְבֹרָכָיו
  choice: благословлённые Им
  rationale: Страдательное причастие с суффиксом 3-го лица мужского рода единственного числа обозначает тех, кто благословлён Господом; такая передача сохраняет пассивную форму и ясно выражает подразумеваемого деятеля.
- source_word: יִירְשׁוּ
  choice: унаследуют
  rationale: Глагол ירש может означать «наследовать» или «владеть». «Унаследуют» сохраняет здесь смысл получения земли и его заветный оттенок.
- source_word: אָרֶץ
  choice: землю
  rationale: Слово может обозначать как конкретную землю/страну, так и землю в более широком смысле. Русское «землю» естественно сохраняет эту неоднозначность; возможное широкое понимание отмечено в сноске.
- source_word: וּמְקֻלָּלָיו
  choice: а проклятые Им
  rationale: Страдательное причастие с тем же местоименным суффиксом противопоставлено первой группе. Союз «а» ясно передаёт контраст, не усиливая его сверх еврейского текста.
- source_word: יִכָּרֵתוּ
  choice: будут истреблены
  rationale: Нифаль от כרת выражает устранение, букв. «будут отсечены». «Будут истреблены» естественно по-русски передаёт судебно-гибельный смысл в данном контексте, не уточняя способ.
theological_decisions:
- issue: К кому относятся суффиксы в מְבֹרָכָיו и מְקֻלָּלָיו
  choice: 'Передано явно: «Им», то есть Господом по контексту псалма.'
  alternative: «Его благословлённые» и «Его проклятые», без явного обозначения действующего лица.
  rationale: Еврейские формы допускают буквальную передачу принадлежности, но в контексте указывают на Господа как благословляющего и проклинающего. «Им» проясняет синтаксическое отношение без внесения нового богословского утверждения.
- issue: Объём значения אָרֶץ
  choice: «землю» с сохранением контекстуального смысла обещанной земли.
  alternative: «всю землю» или «земной мир».
  rationale: В Псалме 37 повторяется обещание праведным наследовать אָרֶץ. Непояснённое русское «землю» сохраняет как заветно-территориальный, так и потенциально более широкий смысл и не разрешает неоднозначность преждевременно.
- issue: Смысл יִכָּרֵתוּ
  choice: «будут истреблены».
  alternative: 'Более буквально: «будут отсечены».'
  rationale: Образ «отсечения» несёт судебный смысл исключения и гибели. Выбранная формулировка понятна современному читателю, при этом сноска сохраняет буквальный образ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмопевческим звучанием. Параллелизм двух частей и противопоставление сохранены; местоимение «Им» написано с прописной буквы как ясная отсылка к Господу в контексте.
