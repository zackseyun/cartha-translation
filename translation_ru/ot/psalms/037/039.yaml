  text: וּ/תְשׁוּעַ֣ת צַ֭דִּיקִים מֵ/יְהוָ֑ה מָֽ֝עוּזָּ֗/ם בְּ/עֵ֣ת צָרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/039.yaml
  text: The salvation of the righteous is from Yahweh[c][b][a]; he is their stronghold in a time of trouble.
translation:
  language: ru
  text: Спасение[a] праведных — от Яхве[b]; Он — их крепость[c] во время беды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавление»; еврейское слово может также обозначать спасение от опасности или победу.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское имя YHWH; традиционно переводится как «Господь».
    reason: alternative_reading
  - marker: c
    text: 'Или: «убежище», «твердыня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְשׁוּעַת
  choice: Спасение
  rationale: Существительное תְּשׁוּעָה обозначает спасение, избавление или победное избавление. «Спасение» сохраняет широкий смысл слова и возвышенный, но понятный регистр псалма.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Форма множественного числа употреблена субстантивированно и обозначает людей, отличающихся праведностью; родительный падеж естественно зависит от слова «спасение».
- source_word: מֵיְהוָה
  choice: от Яхве
  rationale: 'Предлог מִן указывает на источник: спасение исходит от Яхве. Краткая конструкция с тире естественно передаёт безглагольное еврейское предложение.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое заветное именование Бога в исходном тексте.
- source_word: מָעוּזָּם
  choice: их крепость
  rationale: מָעוֹז означает укреплённое место или источник силы и защиты. «Крепость» сохраняет конкретный оборонительный образ, а местоимение «их» передаёт суффикс третьего лица множественного числа.
- source_word: בְּעֵת צָרָה
  choice: во время беды
  rationale: Сочетание обозначает пору бедствия или тяжёлых обстоятельств; «во время беды» звучит естественно и сохраняет временной смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя יְהוָה, а не титул אֲדֹנָי; транслитерация сохраняет это различие.
- issue: Подлежащее второй безглагольной части
  choice: Он — их крепость
  alternative: Яхве — их крепость
  rationale: Местоимение естественно связывает вторую часть с Яхве из первой и не вводит нового референта. Заглавная буква здесь обусловлена началом самостоятельной части после точки с запятой, а не особой богословской системой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмодическим звучанием. Синтаксический параллелизм и образ крепости сохранены; подразумеваемая в еврейских именных предложениях связка передана тире.
