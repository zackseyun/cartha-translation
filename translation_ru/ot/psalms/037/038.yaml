translation:
  language: ru
  text: Но преступники все вместе будут уничтожены; будущее нечестивых оборвётся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конец нечестивых будет отсечён». Еврейское слово אַחֲרִית может означать «будущее», «исход» или «конец».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פֹשְׁעִים
  choice: Но беззаконники
  rationale: פֹשְׁעִים обозначает тех, кто преступает установленные границы и восстаёт против Бога. «Беззаконники» естественно передаёт нравственно-религиозный смысл в русском псалме, а союз «но» выражает контраст с участью праведных в контексте.
- source_word: נִשְׁמְדוּ
  choice: будут истреблены
  rationale: Нифаль глагола שׁמד означает быть уничтоженным или истреблённым. «Будут истреблены» сохраняет суровость суда, не вводя идеи метафизического небытия.
- source_word: יַחְדָּו
  choice: все вместе
  rationale: Наречие допускает значения «вместе» и «все без исключения». Сочетание «все вместе» естественно сохраняет коллективный и всеохватный оттенок.
- source_word: אַחֲרִית
  choice: будущее
  rationale: Слово может обозначать будущее, конечный исход или конец. В контексте сопоставления участи праведных и нечестивых «будущее» ясно выражает перспективу нечестивых, не сужая значение до потомства.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: «Нечестивые» — естественное и устойчивое обозначение нравственно виновных людей в русской библейской и поэтической речи.
- source_word: נִכְרָתָה
  choice: будет пресечено
  rationale: Нифаль כרת буквально передаёт отсечение. «Будет пресечено» сохраняет образ прекращения и звучит естественнее по-русски в сочетании со словом «будущее», чем буквальное «будет отсечено».
theological_decisions:
- issue: Значение אַחֲרִית в контексте суда
  choice: будущее нечестивых будет пресечено
  alternative: конец нечестивых; потомство нечестивых
  rationale: Еврейское существительное может указывать на будущее, конечный исход, конец или потомство. Контекст говорит о различной участи людей, поэтому основной текст передаёт общую перспективу нечестивых. Возможное значение «конец» сохранено в примечании, чтобы не устранять подлинную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой лексикой. Синтаксический параллелизм и резкость образов суда сохранены; архаические формы и конфессионально окрашенные уточнения не добавлены.
