lexical_decisions:
- source_word: וְהוֹצִיא
  choice: Он явит
  rationale: Каузативная форма глагола יצא означает «вывести наружу, сделать явным». «Явит» естественно передаёт мысль о том, что Бог сделает нечто открытым и видимым, сохраняя возвышенный поэтический регистр.
- source_word: כָאוֹר
  choice: как свет
  rationale: Предлог כ выражает сравнение, а אוֹר означает «свет». Краткое «как свет» сохраняет образ ясной видимости.
- source_word: צִדְקֶךָ
  choice: твою праведность
  rationale: צדק может обозначать праведность, правоту или оправдание. В основном тексте сохранено традиционное и лексически прозрачное «праведность», а контекстуальный оттенок публичного подтверждения правоты указан в сноске.
- source_word: וּמִשְׁפָּטֶךָ
  choice: и правоту твоего дела
  rationale: משפט может означать суд, справедливость, судебное решение или дело, представленное на суд. В данном параллелизме речь, вероятно, идёт о справедливости притязания человека; формулировка «правоту твоего дела» естественно передаёт этот юридический оттенок, не сводя слово к вынесению приговора.
- source_word: כַצָּהֳרָיִם
  choice: как полдень
  rationale: צָהֳרַיִם означает полдень — время наиболее яркого света. Буквальное сравнение сохраняет поэтическую параллель со светом в первой строке.
theological_decisions:
- issue: Значение צִדְקֶךָ и מִשְׁפָּטֶךָ в контексте Божьего действия
  choice: Сохранить «праведность» в первой строке и передать משפט как «правоту твоего дела» во второй.
  alternative: 'Перевести оба выражения преимущественно в смысле оправдания: «Он выведет на свет твою правоту и твоё оправдание — как полдень».'
  rationale: Еврейский параллелизм допускает как нравственный, так и судебно-оправдательный оттенок. Выбранный текст сохраняет напряжение между внутренней праведностью и публичным подтверждением правоты, не превращая стих в узкое догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис прост и понятен; тире подчёркивает параллелизм двух строк.
