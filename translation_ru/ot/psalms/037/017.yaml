  text: כִּ֤י זְרוֹע֣וֹת רְ֭שָׁעִים תִּשָּׁבַ֑רְנָה וְ/סוֹמֵ֖ךְ צַדִּיקִ֣ים יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/017.yaml
  text: For the arms of the wicked will be broken[a], but Yahweh upholds the righteous.
translation:
  language: ru
  text: Ибо руки нечестивых будут сломлены[a], а праведных поддерживает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «руки»; здесь этот образ, вероятно, обозначает силу или могущество нечестивых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего утверждения; «ибо» естественно передаёт причинно-пояснительную связь и соответствует поэтическому регистру.
- source_word: זְרוֹעוֹת
  choice: руки
  rationale: Буквально — «руки» (часто подразумеваются руки как средоточие силы). Конкретный поэтический образ сохранён, а его переносное значение пояснено в сноске.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное во множественном числе обозначает людей, противящихся правде; «нечестивые» — ясный и устойчивый эквивалент в псалмическом контексте.
- source_word: תִּשָּׁבַרְנָה
  choice: будут сломлены
  rationale: Форма нифаля, женского рода, множественного числа, согласована со словом «руки» и выражает пассивное действие в будущем.
- source_word: וְ
  choice: а
  rationale: Соединительный союз здесь вводит противопоставление участи нечестивых и праведных; русское «а» передаёт его без чрезмерного усиления.
- source_word: סוֹמֵךְ
  choice: поддерживает
  rationale: 'Причастие выражает продолжающееся, характерное действие: Яхве служит опорой праведным и не даёт им пасть.'
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Субстантивированное прилагательное во множественном числе; форма родительного-винительного падежа обусловлена управлением русского глагола «поддерживает».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано принятой современной русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет различие между именем и титулом и отражает наиболее распространённую научную реконструкцию произношения.
- issue: Образ сломленных рук
  choice: Сохранить буквальный образ и пояснить его переносный смысл в сноске
  alternative: Перевести непосредственно как «сила нечестивых будет сокрушена»
  rationale: Еврейское זְרוֹעוֹת буквально означает «руки», но в данном контексте образ обозначает силу или могущество. Буквальная передача сохраняет поэтическую выразительность, не исключая метонимического смысла.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Параллелизм и противопоставление двух полустиший сохранены; синтаксис остаётся понятным обычному читателю.
