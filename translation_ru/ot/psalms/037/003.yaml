  yaml_path: translation/ot/psalms/037/003.yaml
  text: Trust in Yahweh and do good[a]; dwell in the land and cultivate faithfulness.
translation:
  language: ru
  text: Уповай на Яхве и делай добро; живи на земле и взращивай верность[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «питайся верностью»; возможно также: «живи в безопасности». Еврейское выражение необычно и может вызывать образ выпаса или питания верностью и надёжностью.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּטַח
  choice: Уповай
  rationale: Повелительная форма выражает доверие и уверенность в ком-либо. «Уповай» естественно сочетается с именем Бога и сохраняет краткость и возвышенность еврейского призыва.
- source_word: בַּיהוָה
  choice: на Яхве
  rationale: Предлог בְּ обозначает того, на кого возлагают упование. Имя יהוה передано как «Яхве», то есть как личное заветное имя, а не заменено титулом.
- source_word: וַעֲשֵׂה טוֹב
  choice: и делай добро
  rationale: Прямой и естественный перевод повелительной формы с субстантивированным прилагательным; сохраняет лаконичность оригинала.
- source_word: שְׁכָן אֶרֶץ
  choice: живи на земле
  rationale: Глагол שׁכן означает жить, обитать, поселяться. В контексте псалма אֶרֶץ — прежде всего земля как место устойчивой жизни и Божьего дара, а не земной шар.
- source_word: וּרְעֵה
  choice: и взращивай
  rationale: רעה буквально связано с выпасом, кормлением и пастьбой. При абстрактном дополнении «верность» выражение трудно и допускает разные толкования. «Взращивай» сохраняет образ заботливого, деятельного поддержания, оставаясь понятным по-русски; более буквальный образ отмечен в сноске.
- source_word: אֱמוּנָה
  choice: верность
  rationale: אֱמוּנָה может обозначать верность, надёжность, твёрдость или безопасность. «Верность» лучше всего согласуется с нравственными призывами стиха, но иное понимание сохранено в сноске.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное заветное имя, присутствующее в еврейском тексте, не подменяя его титулом.
- issue: Толкование וּרְעֵה אֱמוּנָה
  choice: взращивай верность
  alternative: питайся верностью; паси верность; живи в безопасности
  rationale: Еврейское выражение необычно и действительно неоднозначно. Основной текст передаёт деятельный характер повеления естественным русским образом, а сноска сохраняет буквальную пастушескую образность и возможное значение безопасности.
