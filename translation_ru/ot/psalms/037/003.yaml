  source_fidelity: «Уповай на Яхве и делай добро; живи на земле и взращивай верность» верно передаёт четыре еврейских повеления. «Уповай на» точно выражает בטח ב, а «Яхве» последовательно передаёт יהוה. «Живи на земле» сохраняет שׁכן ארץ без неоправданного сужения. Заключительное «взращивай верность» является осмысленной, современной передачей спорного רְעֵה אֱמוּנָה; пастушеская буквальность и возможное значение безопасности не скрыты, а отмечены в сноске.
  naturalness: Текст краток, ритмичен и звучит как современный литературный русский с уместной библейской возвышенностью. «Взращивай верность» несколько образно, но естественно в данном наставительном контексте и удачно соответствует выбранному в английском аудиторском следе «cultivate faithfulness».
