  text: קַוֵּ֤ה אֶל יְהוָ֨ה וּ/שְׁמֹ֬ר דַּרְכּ֗/וֹ וִֽ֭/ירוֹמִמְ/ךָ לָ/רֶ֣שֶׁת אָ֑רֶץ בְּ/הִכָּרֵ֖ת רְשָׁעִ֣ים תִּרְאֶֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/034.yaml
  text: Wait for Yahweh and keep his way[a], and he will exalt you to inherit the land; when the wicked are cut off[c][b], you will see it.
translation:
  language: ru
  text: Терпеливо надейся на Яхве[b] и держись Его пути. Он возвысит тебя, чтобы ты унаследовал землю[a][c]; когда нечестивые будут истреблены, ты это увидишь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово אָרֶץ может означать «землю» в смысле страны или края, а также всю землю. В этом псалме оно связано с языком заветного наследия.
    reason: alternative_reading
  - marker: b
    text: 'Возможный перевод: «Жди Яхве» или «Уповай на Яхве». Еврейский глагол выражает терпеливое и исполненное надежды ожидание.'
    reason: lexical_alternative
  - marker: c
    text: Ср. Матфея 5:5, где вновь звучит обещание наследовать землю.
    reason: cross_reference
lexical_decisions:
- source_word: קַוֵּה
  choice: Терпеливо надейся на
  rationale: Императив קוה выражает терпеливое, исполненное ожидания доверие. Сочетание «терпеливо надейся» передаёт и ожидание, и упование естественнее, чем буквальное «жди Яхве».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: שְׁמֹר דַּרְכּוֹ
  choice: держись Его пути
  rationale: Глагол שׁמר означает хранить, соблюдать. В сочетании с «путём» выражение указывает на верность Божьему пути; русский оборот «держись Его пути» ясен и не требует избыточного пояснения.
- source_word: וִירוֹמִמְךָ
  choice: Он возвысит тебя
  rationale: Каузативная форма רום означает «поднять, возвысить»; выбранный вариант сохраняет поэтический регистр и смысл оправдания перед лицом нечестивых.
- source_word: לָרֶשֶׁת אָרֶץ
  choice: чтобы ты унаследовал землю
  rationale: ירשׁ здесь передаёт получение во владение, причём «унаследовал» сохраняет заветную окраску. Русское «землю», как и еврейское אָרֶץ, допускает значение как страны/территории, так и земли в более широком смысле.
- source_word: בְּהִכָּרֵת רְשָׁעִים
  choice: когда нечестивые будут истреблены
  rationale: Предлог ב с инфинитивом задаёт временное обстоятельство. «Будут истреблены» естественно передаёт окончательное устранение нечестивых, подразумеваемое идиомой כרת, не вводя способ их гибели.
- source_word: תִּרְאֶה
  choice: ты это увидишь
  rationale: У глагола нет выраженного дополнения; местоимение «это» добавлено для естественности русского синтаксиса и отсылает к истреблению нечестивых.
theological_decisions:
- issue: Значение אָרֶץ в контексте завета и литературы мудрости
  choice: землю
  alternative: страну; всю землю
  rationale: Псалом многократно использует язык наследования земли, связанный с заветным обещанием Израилю, но слово אָרֶץ допускает и более широкое значение. Русское «землю» удачно сохраняет эту смысловую открытость, не сводя обещание только к территории и не навязывая универсального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис сделан ясным для обычного читателя; богословская неоднозначность слова אָרֶץ сохранена словом «земля» и пояснена в сноске.
