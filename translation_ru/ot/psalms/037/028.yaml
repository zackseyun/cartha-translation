id: PSA.37.28
reference: Psalms 37:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֤י יְהוָ֨ה אֹ֘הֵ֤ב מִשְׁפָּ֗ט וְ/לֹא יַעֲזֹ֣ב אֶת חֲ֭סִידָי/ו לְ/עוֹלָ֣ם נִשְׁמָ֑רוּ וְ/זֶ֖רַע רְשָׁעִ֣ים נִכְרָֽת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/028.yaml
  text: For Yahweh loves justice and does not forsake his faithful ones[a]; they are kept forever[b], but the offspring of the wicked will be cut off.
translation:
  language: ru
  text: 'Ведь Яхве любит справедливость

    и не оставляет верных Ему[a];

    они хранимы вовеки[b],

    а потомство нечестивых будет отсечено.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его святых», «благочестивых» или «преданных Ему».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст можно также передать более слитно: «Своих верных Он хранит вовеки».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, сохраняя его отличие от титула «Господь».
- source_word: אֹהֵב
  choice: любит
  rationale: Прямое и естественное соответствие причастной форме от אהב; выражает постоянное отношение Яхве.
- source_word: מִשְׁפָּט
  choice: справедливость
  rationale: В данном контексте обозначает правосудие и нравственно справедливый порядок, а не отдельный судебный приговор.
- source_word: יַעֲזֹב
  choice: не оставляет
  rationale: Естественно передаёт עזב и сохраняет смысл неизменной заботы без излишней архаичности слова «покидает» или повышенной окраски «оставляет на произвол».
- source_word: חֲסִידָיו
  choice: верных Ему
  rationale: Передаёт принадлежность местоименного суффикса и связанную с חסד идею преданности и благочестия, не сужая значение до позднейшего специального употребления слова «святые».
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Передаёт неограниченную длительность; форма уместна в возвышенном поэтическом регистре и понятна современному читателю.
- source_word: נִשְׁמָרוּ
  choice: хранимы
  rationale: 'Сохраняет пассивное значение нифаля от שמר: эти люди находятся под охраной и сберегаются.'
- source_word: זֶרַע
  choice: потомство
  rationale: В контексте коллективно обозначает потомков, а не буквальное семя.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Традиционное и точное обозначение нравственно виновных людей в противопоставлении верным.
- source_word: נִכְרָת
  choice: будет отсечено
  rationale: Сохраняет образ и судебную силу нифаля от כרת, а согласование в единственном числе соответствует собирательному существительному «потомство».
theological_decisions:
- issue: Значение и адресат חֲסִידָיו
  choice: «верных Ему» — людей, отличающихся преданностью Яхве
  alternative: «Его святых», «благочестивых» или «преданных Ему»
  rationale: Выбранное выражение сохраняет заветно-реляционный оттенок חסד, но не превращает слово в позднейший технический термин.
- issue: Связь средних частей стиха
  choice: «не оставляет верных Ему; они хранимы вовеки» как два тесно связанных утверждения
  alternative: 'Более тесное объединение: «Своих верных Он хранит вовеки»'
  rationale: Порядок еврейских слов допускает восприятие נִשְׁמָרוּ как отдельного утверждения, развивающего предыдущее; точка с запятой сохраняет и связь, и формальную самостоятельность частей.
- issue: Судьба потомства нечестивых
  choice: «будет отсечено»
  alternative: «будет истреблено» или «будет искоренено»
  rationale: Буквальный образ כרת сохранён без уточнения конкретного способа или полного догматического истолкования суда.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Вовеки», «нечестивых» и «отсечено» сохраняют библейский регистр, оставаясь понятными; синтаксис и разбиение на строки следуют параллелизму еврейского стиха.
