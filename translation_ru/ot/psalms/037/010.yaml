  choice: 'Сохранить единственное число: «нечестивого»'
  alternative: 'Передать собирательно во множественном числе: «нечестивых»'
  rationale: Еврейская форма грамматически стоит в мужском роде единственного числа, но способна представлять целую категорию людей. Основной текст сохраняет форму источника, а сноска — подлинную широту её значения.
