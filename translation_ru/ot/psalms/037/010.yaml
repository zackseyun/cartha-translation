- source_word: רָשָׁע
  choice: нечестивого
  rationale: Субстантивированное прилагательное мужского рода в единственном числе сохранено как обозначение типичного представителя; возможное собирательное понимание отмечено в сноске.
- source_word: וְהִתְבּוֹנַנְתָּ
  choice: вглядишься
  rationale: Форма от בין в породе hitpolel обозначает внимательное рассмотрение; «вглядишься» кратко и естественно передаёт намеренное, тщательное наблюдение.
- source_word: עַל מְקוֹמוֹ
  choice: в его место
  rationale: Сочетание указывает на место, куда направлен внимательный взгляд; формулировка сохраняет конкретный образ исходного текста.
- source_word: וְאֵינֶנּוּ
  choice: а его уже нет
  rationale: Заключительная экзистенциальная формула конкретизирует отсутствие нечестивого на прежнем месте; «а» естественно передаёт контраст, а «уже» — результат ожидаемого исчезновения.
theological_decisions:
