source:
  edition: WLC
  text: צַדִּיקִ֥ים יִֽירְשׁוּ אָ֑רֶץ וְ/יִשְׁכְּנ֖וּ לָ/עַ֣ד עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/029.yaml
  text: The righteous will inherit the land and dwell on it forever[a].
translation:
  language: ru
  text: Праведники унаследуют землю и будут жить на ней вечно[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское אֶרֶץ может означать как определённую землю, страну, так и всю землю.
    reason: alternative_reading
lexical_decisions:
- source_word: צַדִּיקִים
  choice: праведники
  rationale: Субстантивированное прилагательное во множественном числе обозначает праведных людей как группу; «праведники» естественно и точно передаёт нравственно-богословский смысл.
- source_word: יִירְשׁוּ
  choice: унаследуют
  rationale: Глагол ירשׁ может означать получение наследия или вступление во владение; «унаследуют» сохраняет характерный для псалма оттенок обетования.
- source_word: אָרֶץ
  choice: землю
  rationale: אֶרֶץ допускает значения «земля» как страна или территория и «земля» как весь земной мир. Русское «землю» естественно сохраняет эту многозначность, которая уточняется в сноске.
- source_word: וְיִשְׁכְּנוּ
  choice: и будут жить
  rationale: שׁכן означает жить, обитать, поселяться. «Будут жить» ясно и естественно выражает продолжительное пребывание без архаического оттенка.
- source_word: לָעַד
  choice: вечно
  rationale: Передаёт идею непрекращающейся, постоянной длительности в краткой и естественной русской форме.
- source_word: עָלֶיהָ
  choice: на ней
  rationale: Предлог עַל с местоименным суффиксом женского рода относится к земле; буквальное и естественное соответствие — «на ней».
theological_decisions:
- issue: Объём значения אָרֶץ в контексте обетования
  choice: землю
  alternative: страну; всю землю
  rationale: Повторяющееся в Псалме 37 обещание наследовать אָרֶץ допускает конкретный смысл обетованной земли и более широкий смысл земли как мира. Основной русский вариант «землю» сохраняет обе возможности, а сноска прямо отмечает неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, возвышенная, но понятная формулировка. Многозначность אָרֶץ сохранена, а не сведена к одному богословскому толкованию.
