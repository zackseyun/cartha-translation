  text: נַ֤עַר הָיִ֗יתִי גַּם זָ֫קַ֥נְתִּי וְֽ/לֹא רָ֭אִיתִי צַדִּ֣יק נֶעֱזָ֑ב וְ֝/זַרְע֗/וֹ מְבַקֶּשׁ לָֽחֶם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/025.yaml
  text: I was young[a], and now I am old[b], yet I have not seen the righteous forsaken or his offspring begging for bread.
translation:
  language: ru
  text: Я был молод и теперь состарился, но не видел, чтобы праведник был оставлен или чтобы его потомки[b] просили хлеба[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искали хлеба». Еврейский глагол означает «искать» или «просить»; здесь, вероятно, речь идёт о просьбе дать самое необходимое, то есть о попрошайничестве из-за нужды.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его семя», то есть его потомство или потомки.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר הָיִיתִי
  choice: Я был молод
  rationale: Предикативное נַעַר с הָיִיתִי естественно передаётся по-русски прилагательным; сохраняется автобиографический контраст с преклонным возрастом.
- source_word: גַּם זָקַנְתִּי
  choice: и теперь состарился
  rationale: גַּם связывает два этапа жизни, а перфект זָקַנְתִּי обозначает достигнутое состояние; «теперь» естественно выражает временное развитие, подразумеваемое контекстом.
- source_word: וְלֹא רָאִיתִי
  choice: но не видел
  rationale: Союз передан лёгким противопоставлением; форма первого лица сохраняет характер личного свидетельства, а не превращает его в безусловное обещание.
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода в единственном числе имеет обобщающее значение; «праведник» точно и естественно сохраняет эту форму.
- source_word: נֶעֱזָב
  choice: был оставлен
  rationale: Страдательное значение нифаля от עזב передано нейтрально и весомо; формулировка не уточняет без основания, кем именно оставлен праведник.
- source_word: וְזַרְעוֹ
  choice: или чтобы его потомки
  rationale: זֶרַע здесь означает потомство. «Потомки» естественнее буквального «семя» и допускает как детей, так и дальнейших наследников; «или» ясно показывает два положения, которых псалмопевец не наблюдал.
- source_word: מְבַקֶּשׁ לָחֶם
  choice: просили хлеба
  rationale: בקש буквально означает «искать, просить»; при объекте «хлеб» выражение может указывать на просьбу о самом необходимом. «Просили хлеба» сохраняет лексическую широту и не усиливает её без необходимости до «нищенствовали».
theological_decisions:
- issue: Личное наблюдение или всеобщее безусловное обещание
  choice: 'Сохранено свидетельство от первого лица: «не видел».'
  alternative: Передать стих как абсолютную гарантию того, что праведник и его потомки никогда не испытают нужды.
  rationale: Еврейский текст прямо описывает опыт говорящего от молодости до старости. Перевод не расширяет наблюдение до утверждения, которого грамматическая форма сама по себе не выражает.
- issue: Кем оставлен праведник
  choice: «был оставлен» без названного действующего лица.
  alternative: «оставлен Богом».
  rationale: В стихе субъект оставления не указан. Сохранение пассивной конструкции не снимает возможного богословского подтекста, но и не делает его явным вопреки тексту.
- issue: Значение просьбы о хлебе
  choice: «просили хлеба» с примечанием о возможном смысле нужды и попрошайничества.
  alternative: «нищенствовали, выпрашивая хлеб».
  rationale: Так сохраняется подлинная лексическая широта מבקש и одновременно отмечается вероятный контекст крайней нужды.
translation_notes:
  register: 'Современный литературный русский язык с достоинством поэтического свидетельства. Синтаксис остаётся ясным для обычного читателя; сохранены обобщающий единственный субъект и конкретный образ хлеба. Маркеры примечаний поставлены после соответствующей части стиха: [a] относится к просьбе о хлебе, [b] — к потомкам.'
