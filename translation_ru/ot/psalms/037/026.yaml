base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/026.yaml
  text: All day long he is gracious and lends[a], and his offspring are a blessing.
translation:
  language: ru
  text: Он всегда щедр и даёт взаймы, и его потомство — благословение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его потомство благословенно». Буквально: «его потомство — для благословения».'
    reason: Альтернативное понимание неоднозначного выражения לִבְרָכָה.
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Весь день
  rationale: Сохраняет временной образ еврейского выражения «весь день» и в данном контексте передаёт постоянный, привычный образ действий.
- source_word: חוֹנֵן
  choice: милостив
  rationale: Причастие от חנן обозначает проявление милости или благоволения. «Милостив» сохраняет основной смысл и не сводит его только к материальной щедрости.
- source_word: וּמַלְוֶה
  choice: и даёт взаймы
  rationale: Порода hифиль глагола לוה здесь означает давать в долг, а не брать взаймы. Выражение естественно по-русски и передаёт привычное действие.
- source_word: וְזַרְעוֹ
  choice: и его потомство
  rationale: זֶרַע — собирательное существительное со значением «потомство, потомки». «Потомство» сохраняет собирательный характер формы.
- source_word: לִבְרָכָה
  choice: — благословение
  rationale: Буквально выражение означает «для благословения». Именная конструкция «потомство — благословение» естественно передаёт значение предназначения или характеристики, не превращая потомство однозначно в получателя благословения.
theological_decisions:
- issue: Смысл заключительного выражения לִבְרָכָה
  choice: его потомство — благословение
  alternative: его потомство благословенно
  rationale: 'Предлог לְ при בְּרָכָה естественнее указывает на предназначение или характеристику: потомство является благословением либо служит к благословению. Вариант «благословенно» возможен, но понимает потомство прежде всего как получателя благословения; эта неоднозначность отмечена в сноске.'
translation_notes:
  register: Современный литературный русский язык с краткой, ритмичной формой, подходящей для поэтического текста. Лексика понятна широкому читателю; сохранены привычный характер действий и смысловая неоднозначность последней фразы.
