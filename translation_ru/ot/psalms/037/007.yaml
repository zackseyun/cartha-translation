  text: דּ֤וֹם לַ/יהוָה֮ וְ/הִתְח֪וֹלֵ֫ל ל֥/וֹ אַל תִּ֭תְחַר בְּ/מַצְלִ֣יחַ דַּרְכּ֑/וֹ בְּ֝/אִ֗ישׁ עֹשֶׂ֥ה מְזִמּֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/007.yaml
  text: Be still before Yahweh[a], and wait patiently for him; do not burn with anger because of one who prospers in his way[c][b], because of a man who carries out schemes.
translation:
  language: ru
  text: Умолкни пред Яхве[a] и терпеливо жди Его[b]. Не распаляйся гневом[c] из-за того, кому сопутствует успех на его пути, из-за человека, осуществляющего свои замыслы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будь спокоен пред Яхве». Еврейский глагол может подчёркивать как молчание, так и неподвижное спокойствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «томительно жди Его». Еврейская форма может выражать терпеливое, напряжённое и даже мучительное ожидание; традиционно переводили также «покойся в Нём».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не разгорайся». Еврейский глагол изображает гнев или раздражение как внутренний жар.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹם
  choice: Умолкни
  rationale: Повелительная форма от דמם выражает молчание и спокойствие перед Богом. «Умолкни» сохраняет прежде всего прямое значение глагола, а примечание указывает на более широкую возможность «будь спокоен».
- source_word: לַיהוָה
  choice: пред Яхве
  rationale: При דום предлог ל здесь естественно передаёт направленность к Богу и пребывание в Его присутствии; личное имя יהוה передано как «Яхве».
- source_word: וְהִתְחוֹלֵל לוֹ
  choice: и терпеливо жди Его
  rationale: Редкая форма от חול может передавать мучительное, напряжённое или томительное ожидание. В данном увещевательном контексте «терпеливо жди» ясно выражает смысл, не исключая оттенка внутреннего напряжения, отмеченного в сноске.
- source_word: אַל תִּתְחַר
  choice: Не распаляйся гневом
  rationale: Глагол חרה буквально связан с жаром и воспламенением и здесь обозначает вспыхивающий гнев или раздражение. Русское выражение сохраняет исходную метафору.
- source_word: בְּמַצְלִיחַ דַּרְכּוֹ
  choice: из-за того, кому сопутствует успех на его пути
  rationale: Предлог ב обозначает причину или объект раздражения; причастие מצליח указывает на преуспевание, а דרכו — на жизненный путь или образ действий. Формулировка сохраняет образ пути и не утверждает, что сам путь нравственно одобряем.
- source_word: בְּאִישׁ
  choice: из-за человека
  rationale: איש обозначает отдельного человека мужского рода, однако в современном русском «человек» естественно передаёт представителя описываемого типа без неуместного акцента на поле.
- source_word: עֹשֶׂה מְזִמּוֹת
  choice: осуществляющего свои замыслы
  rationale: מזמות может обозначать планы, замыслы или козни. «Замыслы» сохраняет возможную смысловую широту, тогда как отрицательная оценка следует из контекста; притяжательное «свои» естественно по-русски и не меняет референцию.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно передано транслитерацией «Яхве», а не заменено титулом.
- issue: Характер ожидания в וְהִתְחוֹלֵל לוֹ
  choice: терпеливо жди Его
  alternative: томись в ожидании Его; покойся в Нём
  rationale: Контекст призывает к сдержанности перед Богом, однако форма допускает оттенок мучительного или напряжённого ожидания. Основной текст передаёт понятный увещевательный смысл, а сноска сохраняет напряжение исходного выражения.
- issue: Нравственная окраска מְזִמּוֹת
  choice: замыслы
  alternative: козни; злые планы
  rationale: В данном контексте слово, вероятно, имеет отрицательный оттенок, но само по себе может обозначать продуманные планы. Поэтому перевод не добавляет определения «злые», сохраняя контекстуальную двусмысленность.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического увещевания. Императив «Умолкни» лаконичен и соответствует псалмическому регистру; более редкие или спорные оттенки вынесены в сноски. Местоимение «Его» написано с прописной буквы согласно распространённой русской библейской традиции.
