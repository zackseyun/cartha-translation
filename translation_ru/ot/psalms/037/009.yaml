lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предыдущим наставлением естественно для русского контекста.
- source_word: מְרֵעִים
  choice: делающие зло
  rationale: Точно передаёт субстантивированное причастие породы хифиль от רעע и звучит естественнее, чем более книжное «злодеи».
- source_word: יִכָּרֵתוּן
  choice: будут истреблены
  rationale: Передаёт судебное устранение, выраженное нифалем от כרת; формула сохраняет серьёзность образа, хотя русское «отсечены» здесь звучало бы неестественно и могло бы затемнять смысл.
- source_word: וְקֹוֵי
  choice: а надеющиеся на
  rationale: Причастие от קוה обозначает ожидающих с надеждой. «Надеющиеся на» передаёт доверительное ожидание, а союз «а» естественно выражает контраст.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение сохраняет подчёркивание субъекта; тире помогает естественно воспроизвести акцент.
- source_word: יִירְשׁוּ
  choice: унаследуют
  rationale: Сохраняет смысл обещанного наследия и заветный оттенок глагола ירשׁ, присутствующий в повторяющемся мотиве псалма.
- source_word: אָרֶץ
  choice: землю
  rationale: 'Русское «землю» сохраняет подлинную двусмысленность еврейского слова: оно может обозначать как конкретную землю, так и всю землю; контекстуальная альтернатива уточнена в сноске.'
theological_decisions:
- issue: Объём значения אָרֶץ в обещании
  choice: землю
  alternative: страну / Землю обетованную; всю землю
  rationale: В контексте псалма выражение отсылает к заветному наследованию земли, однако еврейское אָרֶץ допускает и более широкий смысл «земля». Русская форма «землю» естественно удерживает оба возможных прочтения, не сводя обещание только к одному из них.
- issue: Смысл наказания в יִכָּרֵתוּן
  choice: будут истреблены
  alternative: будут отсечены / устранены
  rationale: Еврейский глагол выражает устранение или прекращение удела нечестивых и может иметь сильный судебный оттенок. Перевод не уточняет сверх текста способ или окончательный богословский объём этого суда.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Параллельный контраст сохранён, а независимое הֵמָּה передано подчёркнутым «они» после тире. Слово «землю» выбрано также потому, что в русском оно лучше сохраняет многозначность оригинала, чем однозначное «страну».
