  yaml_path: translation/ot/psalms/037/005.yaml
  text: Commit your way to Yahweh[a]; trust in him[b], and he will act.
translation:
  language: ru
  text: Вверь свой путь Яхве[a], доверься Ему, и Он будет действовать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Переложи свой путь на Яхве». Здесь этот образ означает вверить Ему свой жизненный путь.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «Он сделает это» или «Он приведёт это в исполнение». В еврейском тексте сказано только «Он сделает / будет действовать», без явно названного объекта.'
    reason: alternative_reading
lexical_decisions:
- source_word: גּוֹל
  choice: Вверь
  rationale: Буквально глагол означает «скати, переложи», но в сочетании с עַל и «твой путь» выражает передачу своего жизненного пути на попечение Яхве. «Вверь» естественно передаёт смысл идиомы и сохраняет повелительную силу.
- source_word: עַל
  choice: Яхве (дательный падеж при «вверь»)
  rationale: Предлог буквально означает «на», однако русский глагол «вверить» требует дательного падежа; образ переложения сохранён в примечании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: דַּרְכֶּךָ
  choice: свой путь
  rationale: «Путь» прямо передаёт образ древнееврейского текста и может обозначать жизненный курс или образ действий. Возвратное «свой» естественно по-русски соотносит путь с адресатом повеления.
- source_word: וּבְטַח
  choice: доверься
  rationale: Глагол בטח выражает уверенное упование и опору. «Доверься» естественно сочетается с личным дополнением и избегает неуместного оттенка проверки, возможного у формы «доверь».
- source_word: עָלָיו
  choice: Ему
  rationale: Хотя предлог буквально означает «на Него», при русском «довериться» нормативно употребляется дательный падеж.
- source_word: וְהוּא
  choice: и Он
  rationale: 'Союз и самостоятельное местоимение подчёркивают действующего: именно Яхве совершит действие. Тире перед этой частью естественно выражает следствие, не превращая союз в явно условное «тогда».'
- source_word: יַעֲשֶׂה
  choice: совершит
  rationale: Глагол עשה имеет широкий смысл «сделает, совершит, подействует», а объект не назван. Непереходное употребление «совершит» сохраняет открытость формулировки, хотя в современном русском оно слегка приподнято; варианты пояснены в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит собственное имя Бога; транслитерация «Яхве» сохраняет это имя, не подменяя его титулом.
- issue: Следует ли восполнять неназванный объект יַעֲשֶׂה
  choice: 'Оставить действие без названного объекта: «Он совершит»'
  alternative: «Он сделает это»; «Он всё исполнит»; «Он приведёт это в исполнение»
  rationale: В древнееврейском тексте объект отсутствует. Открытая формулировка не уточняет сверх текста, что именно Яхве совершит, и сохраняет смысловую и богословскую напряжённость обещания.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. «Вверь свой путь» понятно и сохраняет традиционный библейский образ без буквализма; «совершит» намеренно оставлено без дополнения ради неопределённости оригинала. Местоимение «Он» написано с прописной буквы как уместная русская форма благоговейного регистра, не меняющая содержания.
