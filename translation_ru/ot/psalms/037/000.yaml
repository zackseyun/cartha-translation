source:
  edition: WLC
  text: לְ/דָוִ֨ד אַל תִּתְחַ֥ר בַּ/מְּרֵעִ֑ים אַל תְּ֝קַנֵּ֗א בְּ/עֹשֵׂ֥י עַוְלָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/000.yaml
  text: Of David[a]. Do not fret because of evildoers[b]; do not be envious of those who do wrong.
translation:
  language: ru
  text: 'Давида.[a]


    Не раздражайся из-за злодеев,

    не завидуй творящим неправду.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Псалом Давида»; еврейская надпись может указывать на авторство, принадлежность или посвящение.'
    reason: textual_heading_ambiguity
  - marker: b
    text: 'Или: «делающим несправедливость»; также возможно: «творящим беззаконие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая надпись с לְ естественно передаётся традиционной родительной конструкцией, не устраняя возможных оттенков авторства, принадлежности или посвящения.
- source_word: אַל־תִּתְחַר
  choice: Не раздражайся
  rationale: Глагол חרה буквально связан с разгоранием и здесь обозначает внутреннее возбуждение, досаду или гнев; «не раздражайся» естественно по-русски и сохраняет эту образность косвенно.
- source_word: בַּמְּרֵעִים
  choice: из-за злодеев
  rationale: Предлог בְּ в данном контексте указывает на повод для раздражения; причастно-субстантивированная форма обозначает людей, делающих зло.
- source_word: אַל־תְּקַנֵּא
  choice: не завидуй
  rationale: В этой параллельной заповеди קנא естественно означает зависть к видимому благополучию нечестивых, хотя слово может также выражать ревность.
- source_word: בְּעֹשֵׂי עַוְלָה
  choice: творящим неправду
  rationale: Передаёт деятельный характер причастия עֹשֵׂי и широкий смысл עַוְלָה — неправда, несправедливость, неправедность — без конфессионального уточнения.
theological_decisions:
- issue: Отношение праведника к благополучию делающих зло
  choice: 'Сохранены две параллельные заповеди: не поддаваться раздражению и не завидовать.'
  alternative: Истолковать первый глагол только как гнев или только как тревогу.
  rationale: Еврейский текст допускает спектр внутреннего возбуждения; перевод не должен сводить наставление к одной богословски нагруженной эмоции.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим членением. Сохранён достоинственный библейский регистр без архаизмов; надпись отделена от двух параллельных строк.
