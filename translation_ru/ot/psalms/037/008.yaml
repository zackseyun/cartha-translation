  text: הֶ֣רֶף מֵ֭/אַף וַ/עֲזֹ֣ב חֵמָ֑ה אַל תִּ֝תְחַ֗ר אַךְ לְ/הָרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/037/008.yaml
  text: Let go of anger[a], and abandon wrath[b]; do not be provoked—it only leads to evil.
translation:
  language: ru
  text: Оставь гнев и откажись от ярости; не раздражайся — это ведёт лишь ко злу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «не раздражайся только для того, чтобы делать зло». Последнюю фразу можно понимать как указание либо на цель, либо на результат.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֶרֶף מֵאַף
  choice: Оставь гнев
  rationale: Императив הֶרֶף выражает прекращение или оставление, а אַף здесь имеет обычное переносное значение «гнев». Краткая формулировка естественна по-русски и сохраняет повелительную силу.
- source_word: וַעֲזֹב חֵמָה
  choice: и откажись от ярости
  rationale: עזב означает оставить или отвергнуть; חֵמָה обозначает более сильный, пылающий гнев. «Ярость» сохраняет смысловое усиление по отношению к «гневу».
- source_word: אַל תִּתְחַר
  choice: не раздражайся
  rationale: Форма от חרה передаёт внутреннее разгорячение, досаду или возбуждение. «Не раздражайся» звучит современно и сохраняет связь с повторяющимся увещеванием псалма, не сужая его до одного лишь внешнего действия.
- source_word: אַךְ לְהָרֵעַ
  choice: это ведёт лишь ко злу
  rationale: אַךְ имеет ограничительное значение «лишь», а инфинитив с לְ допускает целевое либо результативное понимание. В контексте естественно выражен результат, при этом буквальная целевая возможность отмечена в сноске.
theological_decisions:
- issue: Смысл заключительной фразы
  choice: 'Предупреждение о результате раздражения: «это ведёт лишь ко злу»'
  alternative: «только чтобы делать зло»
  rationale: Конструкция לְהָרֵעַ допускает как целевое, так и результативное прочтение. Контекст наставления поддерживает результативную формулировку, но более буквальная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным поэтическим звучанием. Параллелизм двух повелений сохранён; различие между אַף и חֵמָה передано словами «гнев» и «ярость».
