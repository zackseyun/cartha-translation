  yaml_path: translation/ot/psalms/037/014.yaml
  text: The wicked have drawn the sword and bent their bow[a], to bring down the poor and needy[b], to slaughter those upright in way.
translation:
  language: ru
  text: Нечестивые обнажили меч и натянули свой лук, чтобы повергнуть бедного[a] и нуждающегося, чтобы заколоть тех, чей путь прям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «угнетённого»; еврейское слово может обозначать как бедного, так и страдающего или униженного человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב פָּתְחוּ
  choice: обнажили меч
  rationale: Буквально глагол означает «открыли», но в сочетании с мечом это устойчивый образ извлечения меча из ножен; «обнажили меч» естественно передаёт военную идиому.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Передаёт нравственно-религиозную категорию псалма, не добавляя указания на пол.
- source_word: וְדָרְכוּ קַשְׁתָּם
  choice: и натянули свой лук
  rationale: Глагол в сочетании с луком обозначает его сгибание или натягивание перед выстрелом. Единственное число сохранено как собирательный образ, а возвратное «свой» естественно передаёт суффикс 3-го лица множественного числа.
- source_word: לְהַפִּיל
  choice: чтобы повергнуть
  rationale: Каузатив от נפל означает «заставить упасть». «Повергнуть» сохраняет образ падения и соответствует возвышенному поэтическому регистру.
- source_word: עָנִי וְאֶבְיוֹן
  choice: бедного и нуждающегося
  rationale: Сочетание обозначает социально уязвимых людей. Перевод сохраняет различие между бедностью или угнетённостью עָנִי и нуждой אֶבְיוֹן.
- source_word: לִטְבֹחַ
  choice: чтобы заколоть
  rationale: Глагол сильнее общего «убить» и передаёт жестокость расправы, сохраняя образ заклания.
- source_word: יִשְׁרֵי דָרֶךְ
  choice: тех, чей путь прям
  rationale: Еврейское выражение буквально означает «прямые путём». Русская конструкция естественна, сохраняет метафору пути и не сводит её явно только к поведению.
theological_decisions:
- issue: Смысл выражения יִשְׁרֵי דָרֶךְ
  choice: тех, чей путь прям
  alternative: живущих праведно
  rationale: Выбранный вариант сохраняет библейскую метафору пути и нравственную характеристику, не подменяя образ более узким толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксический параллелизм двух целевых оборотов сохранён; архаизмы и конфессионально маркированные формулы не используются.
