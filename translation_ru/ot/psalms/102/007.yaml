  text: Я не сплю и подобен одинокой птице на крыше.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как одинокий воробей на крыше». Еврейское צִפּוֹר — общее слово со значением «птица», хотя традиционно его иногда переводят более конкретно: «воробей».'
