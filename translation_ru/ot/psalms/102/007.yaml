lexical_decisions:
- source_word: שָׁקַדְתִּי
  choice: Я не сплю
  rationale: Глагол שׁקד может обозначать бодрствование или бдение; в контексте плача естественное русское выражение «не сплю» передаёт мучительное состояние бессонницы, не добавляя идеи несения стражи.
- source_word: וָאֶהְיֶה
  choice: и стал
  rationale: Форма היה продолжает повествование о состоянии говорящего и допускает значение «стал». Прошедшее время согласуется с формой שָׁקַדְתִּי и сохраняет образ возникшего состояния.
- source_word: כְּצִפּוֹר
  choice: как ... птица
  rationale: צִפּוֹר — общее обозначение птицы, нередко небольшой; перевод «птица» сохраняет широту еврейского слова, тогда как традиционное «воробей» вынесено в примечание.
- source_word: בּוֹדֵד
  choice: одинокая
  rationale: בּוֹדֵד означает находящийся в одиночестве, обособленный. «Одинокая» естественно и поэтично передаёт здесь как изолированность птицы, так и силу сравнения, не усиливая его до «покинутая».
- source_word: עַל גָּג
  choice: на крыше
  rationale: Буквально «на крыше»; это естественное современное русское выражение, сохраняющее образ открытого и уединённого места.
