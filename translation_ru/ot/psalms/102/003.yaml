  text: For my days vanish like smoke[a], and my bones burn like a hearth.
translation:
  language: ru
  text: 'Ибо дни мои исчезают, как дым,

    и кости мои пылают, как очаг.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кости мои опалены, как головня», «как печь» или «как жаровня». Редкое еврейское слово может обозначать горящий предмет либо место, где горит огонь; точный образ неясен, но речь идёт о сильном жаре.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Сохраняет причинную связь с предыдущей мольбой и соответствует возвышенному, но понятному поэтическому регистру.
- source_word: כָלוּ בְעָשָׁן יָמָי
  choice: дни мои исчезают, как дым
  rationale: כָלוּ означает, что дни иссякают или подходят к концу; образ дыма передаёт их быстрое и бесследное исчезновение. Предлог ב здесь естественно передать сравнительной конструкцией.
- source_word: וְעַצְמוֹתַי
  choice: и кости мои
  rationale: Прямой перевод сохраняет телесный образ глубочайшего страдания.
- source_word: נִחָרוּ
  choice: обожжены
  rationale: 'Форма выражает состояние, возникшее вследствие сильного жара: кости опалены или обожжены. Перевод сохраняет страдательный оттенок и не усиливает его до полного обугливания.'
- source_word: כְמוֹ קֵד
  choice: словно в очаге
  rationale: Редкое קֵד, вероятно, обозначает связанный с огнём предмет или место. Формулировка «словно в очаге» создаёт естественный русский образ сильного жара, а лексическая неопределённость отмечена в сноске.
