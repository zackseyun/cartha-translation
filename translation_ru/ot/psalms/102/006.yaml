  text: דָּ֭מִיתִי לִ/קְאַ֣ת מִדְבָּ֑ר הָ֝יִ֗יתִי כְּ/כ֣וֹס חֳרָבֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/006.yaml
  text: I am like a desert owl[b][a]; I have become like an owl among the ruins.
translation:
  language: ru
  text: Я подобен пустынной сове[a], я стал как сыч среди развалин[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я подобен пеликану в пустыне». Точное значение еврейского названия птицы קָאַת неизвестно; в традиционных переводах часто встречается «пеликан».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как сова среди развалин». Точный вид птицы, обозначаемой еврейским словом כּוֹס, неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּמִיתִי
  choice: я подобен
  rationale: Форма qal от דמה выражает уподобление; настоящее состояние естественно передаёт результативный оттенок перфекта и сохраняет поэтический параллелизм.
- source_word: לִקְאַת
  choice: пустынной сове
  rationale: Название птицы קָאַת точно не установлено. В контекстах запустения оно, вероятно, обозначает обитающую в безлюдных местах птицу; «пустынная сова» сохраняет образ одиночества, а традиционное «пеликан» указано в примечании.
- source_word: מִדְבָּר
  choice: пустынной
  rationale: מִדְבָּר обозначает пустынную, невозделанную местность; определение «пустынная» звучит по-русски естественно в названии птицы.
- source_word: הָיִיתִי
  choice: я стал
  rationale: Перфект היה может обозначать возникшее и сохраняющееся состояние; «стал» передаёт этот результативный оттенок.
- source_word: כְּכוֹס
  choice: как сыч
  rationale: כּוֹס здесь является названием птицы, хотя точный вид неясен. «Сыч» — понятное современное обозначение небольшой совы, подходящее образу одинокой птицы в развалинах.
- source_word: חֳרָבוֹת
  choice: среди развалин
  rationale: Множественное число обозначает развалины или опустошённые места; «среди развалин» естественно передаёт место обитания птицы.
