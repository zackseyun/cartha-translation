lexical_decisions:
- source_word: עִנָּה
  choice: изнурил
  rationale: Пиэль глагола ענה здесь передаёт причинение немощи, унижение или ослабление. «Изнурил» естественно сочетается с «силой» и сохраняет активное воздействие, не превращая выражение в пояснительный пересказ.
- source_word: בַדֶּרֶךְ
  choice: в пути
  rationale: Буквальное пространственное выражение сохраняет образ еврейского текста; метафорическое значение жизненного пути отмечено в сноске.
- source_word: כחו
  choice: его силу
  rationale: В представленном еврейском тексте суффикс третьего лица мужского рода означает «его». Необычная смена лица сохранена, а ожидаемое по контексту «мою силу» дано как альтернативное прочтение.
- source_word: קִצַּר
  choice: сократил
  rationale: Глагол означает «сделал короче, сократил»; выбранный вариант точно передаёт образ сокращённой продолжительности жизни.
- source_word: יָמָי
  choice: мои дни
  rationale: Форма содержит суффикс первого лица и обозначает дни жизни говорящего.
theological_decisions:
- issue: Смена лица между «его силой» и «моими днями»
  choice: Сохранить в основном тексте третье лицо в первой части и первое лицо во второй.
  alternative: «Он изнурил в пути мою силу, сократил мои дни».
  rationale: 'Предоставленный еврейский текст содержит реальное грамматическое напряжение: כחו — «его сила», тогда как ימי — «мои дни». Перевод не устраняет эту трудность молча; контекстуально ожидаемое первое лицо вынесено в сноску.'
translation_notes:
  register: Современный литературный русский язык с кратким, достойным поэтическим строем. Буквенный образ пути и резкая смена грамматического лица сохранены; порядок маркеров следует словам, к которым относятся сноски.
