id: PSA.102.28
reference: Psalms 102:28
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּנֵֽי עֲבָדֶ֥י/ךָ יִשְׁכּ֑וֹנוּ וְ֝/זַרְעָ֗/ם לְ/פָנֶ֥י/ךָ יִכּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/028.yaml
  text: The children of your servants will dwell[a], and their offspring will be established before you.
translation:
  language: ru
  text: Дети[a] Твоих слуг будут жить, и их потомство утвердится пред Тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сыновья».'
    reason: Лексема בֵּן во множественном числе может быть передана более буквально как «сыновья», однако в контексте также допускает более широкое «дети».
lexical_decisions:
- source_word: בְּנֵי
  choice: Дети
  rationale: Форма множественного числа в сопряжённом состоянии от בֵּן может обозначать сыновей или шире — детей и потомков. «Дети» естественно передаёт родственную преемственность и не сужает смысл до лиц мужского пола.
- source_word: עֲבָדֶיךָ
  choice: Твоих слуг
  rationale: עֶבֶד допускает значения «слуга» и «раб». В обращении к Богу в этом псалме «слуг» звучит естественно и передаёт отношение служения без неоправданного акцента на подневольном статусе.
- source_word: יִשְׁכּוֹנוּ
  choice: будут жить
  rationale: Глагол שכן означает «жить, обитать, поселяться». «Будут жить» ясно и естественно передаёт здесь продолжительное пребывание; дополнительное значение безопасности в текст не внесено.
- source_word: וְזַרְעָם
  choice: и их потомство
  rationale: זֶרַע в данном контексте имеет собирательное значение потомков. «Потомство» сохраняет это значение и звучит по-русски естественнее буквального «семя».
- source_word: לְפָנֶיךָ
  choice: пред Тобой
  rationale: Буквально выражение означает «перед Твоим лицом». «Пред Тобой» кратко сохраняет пространственно-реляционный образ и соответствует возвышенному регистру псалма.
- source_word: יִכּוֹן
  choice: утвердится
  rationale: Нифаль от כון передаёт состояние установленности, прочности и устойчивости. Возвратная форма «утвердится» естественно выражает результирующее значение и не уточняет механизм обещанной устойчивости.
theological_decisions:
- issue: Следует ли прямо истолковать обещание как заветное или эсхатологическое
  choice: Сохранить общее утверждение о продолжении жизни слуг Божьих в их детях и об устойчивости их потомства пред Богом.
  alternative: Прямо обозначить это как обещание Израилю в рамках завета или как обещание окончательного эсхатологического спасения.
  rationale: Сам еврейский текст говорит о жизни детей Божьих слуг и утверждении их потомства пред Богом, но не называет конкретный богословский механизм или временной горизонт.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Написание местоимений «Твоих», «Тобой» с прописной буквы поддерживает традиционный почтительный регистр. Добавочное понятие безопасности в יִשְׁכּוֹנוּ не внесено.
