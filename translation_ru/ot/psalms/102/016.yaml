  yaml_path: translation/ot/psalms/102/016.yaml
  text: For Yahweh has built Zion[a]; he has appeared in his glory.
translation:
  language: ru
  text: Ибо Яхве построил Сион; Он явился в Своей славе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он виден в Своей славе»; возможно также: «Он был увиден в Своей славе». Еврейский глагол может означать как явление, так и то, что кто-либо становится видимым или бывает увиден.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для окружающих утверждений; «ибо» естественно сохраняет пояснительно-причинную связь и поэтический регистр.
- source_word: בָנָה
  choice: отстроил
  rationale: Перфект представляет действие как завершённое. В контексте восстановления Сиона «отстроил» естественно передаёт созидание города, не утверждая столь прямо, как «восстановил», что речь исключительно о повторном строительстве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: צִיּוֹן
  choice: Сион
  rationale: Сохранено собственное имя, без замены его более общим обозначением Иерусалима или Божьего народа.
- source_word: נִרְאָה
  choice: явился
  rationale: Нифаль глагола ראה допускает значение «явиться» наряду со страдательным «быть увиденным». В сочетании с Божьей славой «явился» естественно выражает богоявление, а альтернативная синтаксическая возможность отмечена в сноске.
- source_word: בִּכְבוֹדוֹ
  choice: в Своей славе
  rationale: «Слава» прямо и ёмко передаёт כָּבוֹד; предлог «в» сохраняет способ или сферу явления. Возвратное притяжательное «Своей» ясно соотносит славу с подлежащим.
theological_decisions:
- issue: Значение נִרְאָה в описании явления Яхве
  choice: Он явился в Своей славе
  alternative: Он виден в Своей славе / Он был явлен в Своей славе
  rationale: Еврейская форма допускает как значение самостоятельного явления, так и значение видимости или восприятия. Основной текст выбирает естественное для контекста значение «явился», но сноска сохраняет реальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. «Ибо» сохраняет связь стиха с контекстом; прописные местоимения употреблены как принятый в русском библейском стиле знак почтения.
