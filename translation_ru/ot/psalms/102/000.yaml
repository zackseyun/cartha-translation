  text: תְּ֭פִלָּה לְ/עָנִ֣י כִֽי יַעֲטֹ֑ף וְ/לִ/פְנֵ֥י יְ֝הוָ֗ה יִשְׁפֹּ֥ךְ שִׂיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/000.yaml
  text: A prayer of the afflicted one when he grows faint and pours out his complaint before Yahweh[a][b].
translation:
  language: ru
  text: Молитва страдальца, когда он изнемогает[a] и изливает перед Яхве свою жалобу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда он подавлен».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «своё размышление» или «свой плач».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Молитва
  rationale: Именное начало соответствует форме надписания псалма и естественно звучит по-русски.
- source_word: לְעָנִי
  choice: страдальца
  rationale: Слово עָנִי обозначает человека, испытывающего бедствие, угнетение или нужду. «Страдалец» сохраняет личный и широкий характер обозначения, не сводя его лишь к материальной бедности.
- source_word: כִי
  choice: когда
  rationale: В надписании союз вводит обстоятельство, при котором произносится молитва; временное «когда» наиболее естественно в данном контексте.
- source_word: יַעֲטֹף
  choice: изнемогает
  rationale: Глагол может передавать ослабление, обморочное состояние или чувство подавленности. «Изнемогает» сохраняет телесно-душевную широту образа.
- source_word: וְלִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: לִפְנֵי означает «перед, в присутствии», а имя יהוה передано как личное имя «Яхве».
- source_word: יִשְׁפֹּךְ
  choice: изливает
  rationale: Передаёт метафору изливания внутренней речи в молитве и является естественным русским сочетанием.
- source_word: שִׂיחוֹ
  choice: свою жалобу
  rationale: В контексте бедствия שִׂיחַ вероятнее всего означает жалобу, хотя может также обозначать размышление или плач; возвратное «свою» естественно соотносит её с подлежащим.
theological_decisions:
- issue: Передача Божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; форма «Яхве» передаёт его как личное заветное имя, не подменяя титулом.
- issue: Смысл שִׂיחוֹ в молитвенном надписании
  choice: свою жалобу
  alternative: своё размышление; свой плач
  rationale: Контекст страдания и изливания речи поддерживает значение жалобы, но возможные оттенки размышления и плача сохранены в примечании.
translation_notes:
  register: Современный литературный и достоинственный регистр надписания. «Страдалец» кратко обозначает человека в бедствии; «изнемогает» и «изливает» сохраняют поэтическую образность без архаической синтаксической тяжести.
