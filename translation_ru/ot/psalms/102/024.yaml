  text: אֹמַ֗ר אֵלִ֗/י אַֽל תַּ֭עֲלֵ/נִי בַּ/חֲצִ֣י יָמָ֑/י בְּ/ד֖וֹר דּוֹרִ֣ים שְׁנוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/024.yaml
  text: I say[a], “My God, do not take me away in the middle of my days[b]; your years are through all generations.”
translation:
  language: ru
  text: 'Я говорю[a]: «Боже мой, не забирай меня[b] в середине моих дней! Твои годы — из рода в род[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я сказал»; возможно также: «Я скажу». Еврейская глагольная форма допускает эти оттенки времени.'
    reason: грамматическая неоднозначность
  - marker: b
    text: 'Буквально: «не поднимай меня» или «не заставляй меня взойти»; по контексту, вероятно, речь о преждевременном уходе из жизни.'
    reason: лексическая альтернатива
  - marker: c
    text: 'Или: «во все поколения».'
    reason: лексическая альтернатива
lexical_decisions:
- source_word: אֹמַר
  choice: Я говорю
  rationale: Форма Qal imperfect 1-го лица ед. числа допускает настоящее или будущее значение, а в поэзии может вводить речь и как повествовательное прошедшее. Настоящее время живо и естественно вводит мольбу; неоднозначность отмечена в сноске.
- source_word: אֵלִי
  choice: Боже мой
  rationale: Существительное с суффиксом 1-го лица ед. числа означает «мой Бог»; обращение естественно передано русским звательным оборотом «Боже мой».
- source_word: אַל
  choice: не
  rationale: Отрицательная частица при форме со значением просьбы или запрещения; вместе с глаголом образует мольбу «не забирай».
- source_word: תַּעֲלֵנִי
  choice: не забирай меня
  rationale: Hiphil от עלה буквально означает «поднимать / заставлять взойти», однако в контексте прерванной жизни выражает преждевременное устранение из жизни. «Не забирай меня» ясно передаёт этот смысл, не уточняя способ смерти.
- source_word: בַּחֲצִי יָמָי
  choice: в середине моих дней
  rationale: Буквально «в половине моих дней». Перевод сохраняет образ отмеренных человеку дней и остаётся понятным на современном русском языке.
- source_word: בְּדוֹר דּוֹרִים
  choice: из рода в род
  rationale: Еврейский оборот обозначает непрерывность во всех сменяющихся поколениях. Русское устойчивое выражение «из рода в род» сохраняет поэтическую краткость и длительность.
- source_word: שְׁנוֹתֶיךָ
  choice: Твои годы
  rationale: Форма множественного числа с суффиксом 2-го лица ед. числа прямо противопоставляет непреходящие годы Бога краткости человеческой жизни.
theological_decisions:
- issue: Образное обозначение преждевременной смерти
  choice: «не забирай меня»
  alternative: «не возводи меня» / «не уводи меня»
  rationale: Контекст противопоставляет ограниченные дни молящегося бесконечным годам Бога. Передача «не забирай меня» выражает вероятный идиоматический смысл, не превращая его в более определённое богословское утверждение о смерти.
- issue: Контраст человеческой краткости и Божьей непреходящести
  choice: Сохранено прямое сопоставление «моих дней» и «Твоих годов»
  alternative: 'Передать смысл пояснительно: «моя жизнь коротка, а Ты вечен»'
  rationale: Прямые временные образы исходного текста сохраняют поэтическое и богословское напряжение без добавленного истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Обращение «Боже мой» и параллель «моих дней / Твои годы» сохраняют достоинство молитвенной речи; синтаксис остаётся ясным для обычного читателя.
