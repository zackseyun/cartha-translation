  text: because of your indignation and your wrath[a], for you have lifted me up and cast me away.
translation:
  language: ru
  text: из-за Твоего негодования и Твоего гнева, ведь Ты поднял меня и отбросил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִפְּנֵי
  choice: из-за
  rationale: В сочетании с обозначениями гнева оборот выражает причину, а не пространственное значение.
- source_word: זַעַמְךָ
  choice: Твоего негодования
  rationale: «Негодование» передаёт сильное неодобрение и сохраняет отличие от следующего близкого по смыслу слова.
- source_word: וְקִצְפֶּךָ
  choice: и Твоего гнева
  rationale: «Гнев» естественно и весомо передаёт קֶצֶף, сохраняя поэтическую пару близких понятий.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит объяснение сказанного и естественно звучит в современном русском поэтическом контексте.
- source_word: נְשָׂאתַנִי
  choice: Ты поднял меня
  rationale: Передаёт конкретный образ поднятия, подготавливающий контраст с последующим броском.
- source_word: וַתַּשְׁלִיכֵנִי
  choice: и отбросил
  rationale: Глагол передаёт как движение броска, так и оттенок отвержения, не добавляя отсутствующего в еврейском тексте дополнения.
theological_decisions:
- issue: Изображение Божьего гнева
  choice: 'Сохранены два близких, но различающихся обозначения: «негодование» и «гнев».'
  alternative: Объединить оба понятия одним словом «гнев» или смягчить их.
  rationale: Еврейский текст использует два интенсивных обозначения Божьего неудовольствия; их не следует ни сглаживать, ни расширять доктринальным толкованием.
- issue: Образ поднятия и отбрасывания
  choice: 'Сохранён прямой образ: «Ты поднял меня и отбросил».'
  alternative: Истолковать поднятие как возвышение или благословение с последующим отвержением.
  rationale: Контекст допускает яркий образ подхваченного и брошенного человека, однако не требует конкретного богословского объяснения причины или характера «поднятия».
translation_notes:
  register: Современный литературный русский язык с достойным поэтическим звучанием. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют распространённой русской библейской традиции; синтаксис остаётся ясным и естественным.
