  text: O Yahweh[a], hear my prayer, and let my cry come to you.
translation:
  language: ru
  text: Яхве[a], услышь мою молитву, и да придёт к Тебе мой вопль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «ЙХВХ» — личное имя Бога; традиционно передаётся «Господь». Возможные передачи произношения: «Яхве», «Иегова».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: В русском библейском и молитвенном употреблении традиционная передача тетраграмматона как «Господь» естественна и сохраняет возвышенный регистр; звательная форма передаёт прямое обращение. Еврейское имя отмечено в сноске.
- source_word: שִׁמְעָה
  choice: услышь
  rationale: Императив שׁמע выражает прямую просьбу. Русское «услышь» здесь естественнее простого «слушай» и в молитвенном контексте подразумевает благосклонное внимание, не добавляя отдельного толкования.
- source_word: תְפִלָּתִי
  choice: мою молитву
  rationale: Прямое и общепонятное соответствие существительному תְּפִלָּה с суффиксом первого лица.
- source_word: וְשַׁוְעָתִי
  choice: и пусть мой вопль
  rationale: «Вопль» передаёт сильную эмоциональную окраску שַׁוְעָה и сохраняет краткость оригинала; значение просьбы о помощи остаётся подразумеваемым.
- source_word: אֵלֶיךָ תָבֹוא
  choice: дойдёт до Тебя
  rationale: Сочетание буквально описывает приход вопля к адресату. «Дойдёт до Тебя» звучит естественно по-русски и сохраняет образ движения, тогда как «достигнет Тебя» могло бы звучать чрезмерно пространственно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господи с указанием имени ЙХВХ в сноске
  alternative: Яхве
  rationale: Основной текст использует укоренённую русскую библейскую форму обращения, а сноска прозрачно показывает, что в еврейском стоит личное Божье имя. Это не скрывает источник и не навязывает спорную реконструкцию произношения.
- issue: Просьба о том, чтобы вопль пришёл к Богу
  choice: пусть мой вопль дойдёт до Тебя
  alternative: да придёт к Тебе мой вопль
  rationale: Сохранена юссивная сила формы תָבֹוא и образ движения к Богу без истолкования фразы как гарантии ответа на молитву.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Синтаксис прямой и понятный; прописное «Тебя» соответствует распространённой русской практике благоговейного обращения к Богу.
