source:
  edition: WLC
  text: תִּכָּ֣תֶב זֹ֭את לְ/ד֣וֹר אַחֲר֑וֹן וְ/עַ֥ם נִ֝בְרָ֗א יְהַלֶּל יָֽהּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/018.yaml
  text: This will be written for a generation to come[a], and a people yet to be created will praise Yah.
translation:
  language: ru
  text: Это будет записано для грядущего поколения, и народ, который ещё будет сотворён, восхвалит Яха[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Ях» — краткая поэтическая форма божественного имени; во многих переводах здесь стоит «Господь».
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכָּתֶב
  choice: будет записано
  rationale: Нифаль имперфекта כתב выражает пассивное действие с направленностью в будущее; форма «будет записано» естественна по-русски и не добавляет оттенка повеления.
- source_word: זֹאת
  choice: это
  rationale: Указательное местоимение отсылает к предшествующему свидетельству или молитве в целом; добавлять существительное вроде «повествование» нет необходимости.
- source_word: לְדוֹר אַחֲרוֹן
  choice: для грядущего поколения
  rationale: אַחֲרוֹן здесь имеет временной смысл «последующий, будущий», а не обязательно эсхатологический смысл «последний».
- source_word: וְעַם
  choice: и народ
  rationale: עַם означает «народ»; отсутствие артикля позволяет сохранить неопределённость, не отождествляя его с уже названной группой.
- source_word: נִבְרָא
  choice: который ещё будет сотворён
  rationale: Пассивное причастие от ברא буквально связано с сотворением. В параллели с грядущим поколением оно имеет перспективный смысл; «ещё будет сотворён» ясно передаёт его без замены образом рождения.
- source_word: יְהַלֶּל
  choice: восхвалит
  rationale: Пиэль имперфекта הלל передаёт усиленное «хвалить, восхвалять» и согласуется с будущей направленностью обеих частей стиха.
- source_word: יָהּ
  choice: Яха
  rationale: Это краткая поэтическая форма божественного имени. Русская форма «Ях» сохраняет различие между יָהּ и полным יהוה; винительный падеж требует формы «Яха».
theological_decisions:
- issue: Передача краткой формы божественного имени יָהּ
  choice: Яха
  alternative: Господа
  rationale: В еврейском тексте стоит краткая форма יָהּ, а не полное имя יהוה. Транслитерация сохраняет реальное лексическое и поэтическое различие; традиционное «Господа» сделало бы его незаметным.
- issue: Смысл выражения עַם נִבְרָא
  choice: народ, который ещё будет сотворён
  alternative: новосотворённый народ
  rationale: Контекст допускает богословски насыщенное понимание нового творения, но грамматика сама по себе не требует его. Перспективная формулировка сохраняет образ сотворения, не навязывая конкретного догматического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического текста. «Грядущее поколение» передаёт возвышенный регистр псалма без архаической тяжеловесности. Маркер сноски поставлен непосредственно после слова «Яха», к которому относится пояснение.
