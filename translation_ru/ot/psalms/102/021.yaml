  text: чтобы возвещать на Сионе имя Яхве[a] и в Иерусалиме — хвалу Ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское יהוה — личное имя Бога; здесь оно передано как «Яхве». Точное древнее произношение достоверно не известно.
    reason: Передача и произношение Божьего имени
lexical_decisions:
- source_word: לְסַפֵּר
  choice: чтобы возвещать
  rationale: Инфинитив с לְ выражает цель или результат в связи с предыдущим контекстом. Пиэль глагола ספר здесь означает публично провозглашать, а не просто рассказывать.
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: Для названия Сион русская литературная норма требует предлога «на», хотя еврейский בְּ обозначает местонахождение.
- source_word: שֵׁם
  choice: имя
  rationale: Прямое соответствие еврейскому существительному; сохраняет смысл открытой людям личности и славы Бога, не сводя его к одной лишь известности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя יהוה транслитерацией, а не заменяет его титулом.
- source_word: וּתְהִלָּתוֹ
  choice: и хвалу Ему
  rationale: תְּהִלָּה означает «хвала», а местоименный суффикс указывает на Бога. Русское «хвалу Ему» естественно передаёт хвалу, обращённую к Нему, и согласуется с управлением глагола «возвещать».
- source_word: בִּירוּשָׁלִָם
  choice: в Иерусалиме
  rationale: Предлог בְּ с названием города естественно передаётся по-русски как «в».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное Божье имя. Форма «Яхве» сохраняет различие между именем и титулом, не утверждая при этом абсолютной достоверности реконструированного произношения.
- issue: Значение местоименного суффикса в וּתְהִלָּתוֹ
  choice: хвалу Ему
  alternative: Его хвалу; Его славу
  rationale: Суффикс допускает буквальное «Его хвала», но по смыслу речь, вероятнее всего, о хвале, воздаваемой Богу или провозглашаемой о Нём. Формулировка «хвалу Ему» звучит естественно и не подменяет «хвалу» словом «слава».
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Сохранён параллелизм «на Сионе — в Иерусалиме»; тире слегка подчёркивает соответствие двух частей стиха.
