  text: But you are the same[a], and your years will not come to an end.
translation:
  language: ru
  text: Но Ты — тот же[a], и годы Твои не кончатся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ты — Он»; это выражение может означать: «Ты — тот же» или «Ты остаёшься неизменным».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Но Ты
  rationale: Союз с самостоятельным местоимением выражает противопоставление изменчивому и преходящему творению, о котором говорится выше.
- source_word: הוּא
  choice: Тот же
  rationale: Буквально «Ты — Он»; в данном контексте это устойчивое выражение неизменной тождественности. «Тот же» естественно передаёт смысл, не добавляя отвлечённой богословской терминологии.
- source_word: וּ/שְׁנוֹתֶיךָ
  choice: и годы Твои
  rationale: Существительное שָׁנָה с местоименным суффиксом прямо означает «Твои годы».
- source_word: לֹא יִתָּמּוּ
  choice: не кончатся
  rationale: Глагол תמם означает завершиться, прийти к концу; несовершенный вид с отрицанием здесь естественно передаётся будущим временем и утверждает бесконечную продолжительность.
theological_decisions:
- issue: Передача выражения «Ты — Он» в связи с неизменностью Бога
  choice: Ты — Тот же
  alternative: Ты — Он; Ты остаёшься тем же
  rationale: Перевод сохраняет утверждение о неизменной тождественности Бога в противопоставлении преходящему творению, не вводя в текст дополнительной философской формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской традиции; тире помогает естественно передать именную конструкцию.
