base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/002.yaml
  text: Do not hide your face from me in the day of my distress[a]; incline your ear to me. In the day I call[c][b], answer me quickly.
translation:
  language: ru
  text: Не скрывай от меня Своего лица[a] в день моей беды[b]; приклони ко мне ухо Твоё. В день, когда я взываю, быстро ответь мне[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Своего присутствия»; еврейское «лицо» может обозначать благосклонное присутствие Бога.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в день, когда беда мне»; или: «в день, когда мне тесно».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «поспеши ответить мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּסְתֵּר
  choice: Не скрывай
  rationale: Отрицательная частица с глаголом выражает настоятельную мольбу; «не скрывай» прямо и естественно передаёт еврейское выражение.
- source_word: פָּנֶיךָ מִמֶּנִּי
  choice: от меня Своего лица
  rationale: Сохранён конкретный образ «лица», который в контексте может также обозначать благосклонное присутствие Бога.
- source_word: בְּיוֹם צַר לִי
  choice: в день, когда мне тесно
  rationale: Формулировка сохраняет образ тесноты и бедственного положения в צַר, а также личную конструкцию לִי.
- source_word: הַטֵּה אֵלַי אָזְנֶךָ
  choice: приклони ко мне ухо Твоё
  rationale: Сохранена традиционная и понятная поэтическая антропоморфная метафора внимательного слушания.
- source_word: בְּיוֹם אֶקְרָא
  choice: В день, когда я взываю
  rationale: Повтор «в день» сохраняет поэтическое построение; «взываю» естественно передаёт молитвенный оттенок קרא.
- source_word: מַהֵר עֲנֵנִי
  choice: поспеши ответить мне
  rationale: Передаёт как срочность מַהֵר, так и просьбу об ответе; естественно звучит по-русски.
theological_decisions:
- issue: 'Антропоморфные образы Бога: «лицо» и «ухо»'
  choice: Сохранить конкретные образы в основном тексте
  alternative: 'Передать истолковательно: «не лишай меня Своего присутствия» и «услышь меня»'
  rationale: Еврейский текст использует телесные образы для выражения Божьего благоволения и внимания. Их сохранение поддерживает поэтическую силу, не утверждая телесность Бога.
- issue: Значение выражения צַר לִי
  choice: 'Сохранить образ: «когда мне тесно»'
  alternative: 'Передать смысловым эквивалентом: «в день моего бедствия» или «когда я в беде»'
  rationale: Буквальный образ тесноты понятен в русском поэтическом контексте и не сводит многозначное обозначение беды к одному толкованию.
- issue: Повтор временной конструкции בְּיוֹם
  choice: Сохранить повтор «в день»
  alternative: Сгладить обе конструкции союзом «когда»
  rationale: Повтор принадлежит поэтической структуре стиха и усиливает настойчивость молитвы.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Формы «Своего», «Твоё» сохраняют возвышенный библейский регистр; синтаксис остаётся понятным. Образы лица, уха и тесноты сохранены, а возможные смысловые эквиваленты вынесены в сноски.
