  choice: обездоленный человек как собирательное обозначение
  alternative: одинокий; человек, уподобленный пустынному кустарнику
  rationale: Упоминание молитвы и переход к местоимению множественного числа требуют человеческого референта, однако образ крайней лишённости и изоляции отмечен в сноске.
