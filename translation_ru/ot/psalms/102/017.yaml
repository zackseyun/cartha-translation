- source_word: פָּנָה
  choice: обратился к
  rationale: Сохраняет конкретный образ поворота к кому-либо или чему-либо и в сочетании с молитвой естественно выражает благосклонное внимание.
- source_word: תְּפִלַּת
  choice: к молитве
  rationale: Передаёт обычное значение существительного и сохраняет его повтор во второй половине стиха.
- source_word: הָעַרְעָר
  choice: обездоленного
  rationale: В данном контексте слово обозначает человека, лишённого опоры и средств; единственное число сохранено, тогда как последующее «их» указывает на собирательное значение.
- source_word: בָזָה
  choice: пренебрёг
  rationale: Точно передаёт отношение презрения и отвержения; конструкция «не пренебрёг молитвой» естественна в современном литературном русском.
- source_word: תְּפִלָּתָם
  choice: их молитвой
  rationale: Сохраняет множественный притяжательный суффикс при существительном в единственном числе и повтор слова «молитва».
theological_decisions:
