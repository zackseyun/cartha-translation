lexical_decisions:
- source_word: מִקּוֹל
  choice: От звука
  rationale: Передаёт сочетание предлога מִן с существительным קוֹל, сохраняя образ слышимого выражения скорби. Предлог допускает как значение источника, так и причинное значение, отмеченное в сноске.
- source_word: אַנְחָתִי
  choice: моих стонов
  rationale: Существительное обозначает стоны или тяжёлые вздохи, вызванные страданием; «стоны» естественно передают напряжённость плача.
- source_word: דָּבְקָה
  choice: прильнули
  rationale: Глагол означает «пристать, прилипнуть, тесно прилегать». «Прильнули» сохраняет яркий телесный образ и соответствует возвышенному поэтическому регистру без архаичности.
- source_word: עַצְמִי
  choice: кости мои
  rationale: Форма с суффиксом может иметь собирательное значение; русский множественный оборот естественно описывает исхудавшее тело.
- source_word: לִבְשָׂרִי
  choice: к плоти
  rationale: Основное конкретное значение בָּשָׂר — «плоть». Оно сохранено в тексте, а контекстуально возможное «к коже» вынесено в сноску, чтобы не устранять лексическую неоднозначность.
