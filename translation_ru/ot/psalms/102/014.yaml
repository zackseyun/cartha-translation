lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт причинную связь с предшествующей мыслью и естественно звучит в современной русской поэзии.
- source_word: רָצוּ
  choice: любят
  rationale: В данном контексте глагол выражает благосклонное, исполненное привязанности отношение к камням Сиона; «любят» ясно передаёт эту эмоциональную вовлечённость.
- source_word: עֲבָדֶיךָ
  choice: Твои слуги
  rationale: В обращении к Богу слово обозначает принадлежащих Ему и служащих Ему людей; «слуги» сохраняет смысл без неуместного акцента на рабском статусе.
- source_word: אֶת אֲבָנֶיהָ
  choice: её камни
  rationale: Женский суффикс относится к олицетворённому Сиону; местоимение «её» сохраняет это олицетворение.
- source_word: וְאֶת עֲפָרָהּ
  choice: и её прах
  rationale: «Прах» сохраняет буквальный поэтический образ עָפָר и одновременно допускает контекстуальный смысл пыли и обломков разрушенного города.
- source_word: יְחֹנֵנוּ
  choice: жалеют
  rationale: Форма от חנן здесь выражает сострадание и милостивое отношение; по-русски «жалеют её прах» естественно передаёт нежную привязанность к разрушенному Сиону.
theological_decisions:
- issue: Олицетворение Сиона посредством женских местоименных суффиксов
  choice: Передано местоимением «её»
  alternative: Безличное «его» применительно к городу или Сиону
  rationale: Древнееврейский текст последовательно использует формы женского рода, поэтому перевод сохраняет поэтическое олицетворение Сиона.
- issue: Смысл חנן по отношению к праху Сиона
  choice: «жалеют»
  alternative: «благоволят к» / «милуют»
  rationale: Глагол совмещает оттенки благосклонности и сострадания. Перевод не превращает отношение к праху в отдельное богословское утверждение о даровании благодати, а сохраняет контекст скорби о разрушенном городе.
translation_notes:
  register: Современный литературный русский с поэтической сдержанностью. Заглавная буква в «Твои» отмечает обращение к Богу согласно распространённой русской библейской традиции. «Прах» выбран вместо прозаического «пыль», чтобы сохранить достоинство и образность строки.
