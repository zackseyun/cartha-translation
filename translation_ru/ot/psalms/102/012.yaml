base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/012.yaml
  text: But you[a], O Yahweh, sit enthroned forever[b], and your remembrance is from generation to generation.
translation:
  language: ru
  text: 'Но Ты, Яхве, восседаешь вовеки[a],

    и память о Тебе — из рода в род[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сидишь вовеки». Еврейский глагол может также означать постоянное пребывание, а в царственном контексте — восседание на престоле.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «памятование о Тебе», «память Твоего имени» или «Твоя слава». Еврейское существительное может обозначать память, памятное упоминание или непреходящую известность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Но Ты
  rationale: Самостоятельное местоимение вместе с союзом подчёркивает контраст между бренностью творения в предыдущем контексте и неизменностью Бога; в современном русском этот оттенок естественно передаётся словом «но».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Выражает неограниченную длительность и сохраняет возвышенный поэтический регистр псалма.
- source_word: תֵּשֵׁב
  choice: восседаешь
  rationale: Глагол буквально означает «сидеть», а применительно к Богу в поэтическом контексте допускает царственный смысл пребывания на престоле; «восседаешь» естественно передаёт этот оттенок, не превращая его в развёрнутое толкование.
- source_word: וְזִכְרְךָ
  choice: и память о Тебе
  rationale: Сохраняет основное значение памяти или поминовения и не сужает многозначность существительного до одной лишь славы или известности.
- source_word: לְדֹר וָדֹר
  choice: из рода в род
  rationale: Устойчивое русское выражение передаёт непрерывность во всех последующих поколениях и соответствует поэтическому стилю.
theological_decisions:
- issue: Царственный оттенок глагола תֵּשֵׁב
  choice: восседаешь вовеки
  alternative: сидишь вовеки; пребываешь вовеки
  rationale: «Восседаешь» допускает образ вечного царствования, возникающий в контексте речи о Боге, однако сноска сохраняет буквальное значение и не выдаёт царственный оттенок за единственно возможный.
- issue: Значение זִכְרְךָ
  choice: память о Тебе
  alternative: Твоё памятование; Твоя слава; Твоё имя памятно
  rationale: Еврейское слово охватывает память, памятное упоминание и славу, сохраняющуюся среди людей. Основной текст оставляет эту смысловую широту сравнительно открытой, а сноска указывает возможные оттенки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Формы «вовеки» и «из рода в род» понятны современному читателю и уместны в псалме; архаическая синтаксическая тяжеловесность избегается. Заглавная буква в местоимении «Ты» отражает принятое в русском религиозном письме почтительное обращение, не изменяя смысла оригинала.
