id: PSA.102.13
reference: Psalms 102:13
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַתָּ֣ה תָ֭קוּם תְּרַחֵ֣ם צִיּ֑וֹן כִּי עֵ֥ת לְ֝/חֶֽנְנָ֗/הּ כִּי בָ֥א מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/013.yaml
  text: You will arise and have compassion on Zion[a], for it is time to show her favor[b], for the appointed time has come.
translation:
  language: ru
  text: Ты восстанешь и смилуешься над Сионом, ведь настало время оказать ему милость[a], ведь назначенный срок пришёл[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «явить ему благоволение»; «быть милостивым к нему».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «установленное время настало».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקוּם
  choice: восстанешь
  rationale: Форма qal imperfect 2 м. ед. ч. передаёт ожидаемое будущее действие Бога. «Восстанешь» сохраняет яркий антропоморфный образ еврейского текста и соответствует возвышенному, но современному регистру псалма.
- source_word: תְּרַחֵם
  choice: смилуешься
  rationale: Форма piel imperfect от רחם выражает сострадание и милосердие. «Смилуешься над» естественно сочетается с названием города и сохраняет смысл деятельного сострадания.
- source_word: צִיּוֹן
  choice: Сионом
  rationale: Собственное имя сохранено, а не истолковано как «Иерусалим» или «народ Божий». Творительный падеж обусловлен русским управлением «смиловаться над».
- source_word: כִּי
  choice: ведь
  rationale: В обоих случаях союз вводит основание для предшествующего утверждения. Повтор «ведь… ведь…» сохраняет параллелизм и объяснительную силу двух כִּי, не придавая фразе излишне архаичного звучания.
- source_word: עֵת
  choice: настало время
  rationale: Существительное означает «время». Русская безличная конструкция естественно передаёт наступление решающего момента.
- source_word: לְחֶנְנָהּ
  choice: оказать ему милость
  rationale: Инфинитив חנן с предлогом ל и суффиксом 3 ж. ед. ч. означает проявить благоволение или милость к Сиону. В русском местоимение согласовано с грамматически мужским «Сион», тогда как референт еврейского суффикса сохранён.
- source_word: בָא
  choice: пришёл
  rationale: Перфект 3 м. ед. ч. от בוא обозначает, что срок уже наступил. «Пришёл» сохраняет образ прибытия, присутствующий в еврейском глаголе.
- source_word: מוֹעֵד
  choice: назначенный срок
  rationale: מוֹעֵד обозначает установленное, определённое время. «Назначенный срок» ясно передаёт как временной предел, так и его предустановленность.
theological_decisions:
- issue: Передавать ли Сион буквально или истолковывать его как Иерусалим либо народ Божий
  choice: Сохранить имя «Сион» как непосредственный объект Божьего сострадания.
  alternative: Передать как «Иерусалим» или «народ Божий».
  rationale: Еврейский текст прямо называет Сион. Более широкие богословские ассоциации возможны, но их не следует вносить в основной текст вместо данного названия.
- issue: Связь двух выражений Божьего милосердия
  choice: Различить רחם как «смиловаться» и חנן как «оказать милость».
  alternative: Передать оба глагола одним и тем же русским выражением либо истолковать второй как простое указание на помощь.
  rationale: Так сохраняются близкие, но не полностью тождественные оттенки сострадания и благоволения, а присущее стиху смысловое усиление не сглаживается.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Сохранены антропоморфный образ «восстанешь», имя «Сион» и повтор причинного союза. Местоимение «ему» согласовано с русским грамматическим родом слова «Сион».
