lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт причинно-пояснительную связь с окружающим плачем и естественно звучит в русской поэзии.
- source_word: אֵפֶר
  choice: пепел
  rationale: Точно сохраняет образ скорби, унижения и траура; более конкретно, чем «прах».
- source_word: כַּלֶּחֶם
  choice: как хлеб
  rationale: Сохраняет прямо выраженное частицей כ сравнение.
- source_word: אָכָלְתִּי
  choice: ем
  rationale: Древнееврейский перфект описывает переживаемое состояние псалмопевца; русское настоящее время естественно передаёт продолжающееся бедствие в контексте плача.
- source_word: שִׁקֻּוַי
  choice: питьё моё
  rationale: Передаёт обычное значение напитка без необоснованного культового оттенка «возлияния»; порядок слов поддерживает поэтический регистр.
- source_word: בִּבְכִי
  choice: с плачем
  rationale: Сохраняет отвлечённое значение «плач», не конкретизируя его как «слёзы» в основном тексте.
- source_word: מָסָכְתִּי
  choice: смешиваю
  rationale: Передаёт обычное значение смешивания жидкостей и сохраняет образ питья, смешанного с плачем.
