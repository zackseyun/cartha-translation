translation:
  language: ru
  text: когда народы и царства соберутся вместе[a], чтобы служить[b] Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда народы и царства будут собраны вместе»; также: «при собрании народов и царств».'
    reason: lexical_alternative
  - marker: b
    text: В отношении Бога «служить» может также означать «поклоняться».
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/הִקָּבֵץ
  choice: когда … соберутся
  rationale: 'Сочетание בְּ с инфинитивом породы нифаль имеет временное значение: «когда / при собрании». Возвратная форма «соберутся» естественна по-русски и передаёт событие собирания, не уточняя внешнего деятеля.'
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число сохраняет корпоративный и этнический смысл еврейского слова, не сводя его к отдельным людям или современным государствам.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Наречие прямо выражает совместность собрания; «вместе» — естественный и точный русский эквивалент.
- source_word: וּ/מַמְלָכוֹת
  choice: и царства
  rationale: Слово обозначает царства или владения и синтаксически сочетается с «народами» как участниками собрания.
- source_word: לַ/עֲבֹד
  choice: чтобы служить
  rationale: Инфинитив עבד выражает цель собрания. «Служить» сохраняет широкий смысл преданного служения Богу, который включает поклонение, но не исчерпывается им.
- source_word: אֶת יְהוָה
  choice: Яхве
  rationale: Непосредственно передано личное заветное имя יהוה; показатель прямого дополнения אֶת отдельно не переводится.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя сохранено, а не заменено титулом.
- issue: Значение עבד по отношению к Богу
  choice: служить
  alternative: поклоняться
  rationale: Глагол может обозначать богопочитание, когда его объектом является Бог, однако его основное значение шире. Основной текст сохраняет эту широту, а контекстуальный вариант отмечен в сноске.
- issue: Кто участвует в собрании
  choice: народы и царства соберутся вместе
  alternative: народы соберутся вместе, и царства — чтобы служить Яхве
  rationale: Наиболее естественно понимать «народы» и «царства» как однородных участников одного собрания. Альтернативное пунктуационно-синтаксическое членение возможно, но по-русски оно менее ясно и не меняет общего образа совместного служения.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная. Порядок слов выстроен естественно для русского, а оба собирательных субъекта объединены без устранения смысловой широты глаголов.
