  text: לִ֭/שְׁמֹעַ אֶנְקַ֣ת אָסִ֑יר לְ֝/פַתֵּ֗חַ בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/020.yaml
  text: to hear the groaning of the prisoner[a], to release the sons of death,
translation:
  language: ru
  text: чтобы услышать стон узника, освободить сынов смерти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть обречённых на смерть или приговорённых к смерти. Буквально по-еврейски: «сынов смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁמֹעַ
  choice: чтобы услышать
  rationale: Инфинитив с לְ выражает цель или результат в составе более широкого предложения; «чтобы услышать» естественно передаёт эту связь.
- source_word: אֶנְקַת
  choice: стон
  rationale: Слово обозначает стон или тяжёлый вздох в бедствии; «стон» сохраняет силу выраженного страдания.
- source_word: אָסִיר
  choice: узника
  rationale: Обозначает связанного или заключённого человека; «узник» соответствует возвышенному поэтическому регистру псалма и остаётся понятным современному читателю.
- source_word: לְפַתֵּחַ
  choice: освободить
  rationale: Буквально глагол означает «открыть», но применительно к заключённым передаёт открытие пути на свободу; «освободить» естественно выражает смысл в русском языке.
- source_word: בְּנֵי
  choice: сынов
  rationale: Сохранён буквальный элемент еврейского устойчивого сочетания «сыны смерти», чтобы не устранять исходный поэтический образ.
- source_word: תְמוּתָה
  choice: смерти
  rationale: Существительное означает «смерть»; в сочетании оно, вероятно, указывает на обречённых умереть, что поясняется в сноске без замены образа в основном тексте.
