  text: הוּכָּֽה כָ֭/עֵשֶׂב וַ/יִּבַ֣שׁ לִבִּ֑/י כִּֽי שָׁ֝כַ֗חְתִּי מֵ/אֲכֹ֥ל לַחְמִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/004.yaml
  text: My heart is struck like grass and withered[c][b][a], for I forget to eat my bread.
translation:
  language: ru
  text: Сердце моё поражено, словно трава, и иссохло, потому что я забываю есть свой хлеб.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я забыл есть свой хлеб»; еврейский перфект можно понимать как описание продолжающегося бедствия либо как завершённое действие, результат которого сохраняется.'
    reason: lexical_alternative
  - marker: b
    text: «Хлеб» здесь может означать пищу вообще.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּכָּה
  choice: поражено
  rationale: Страдательная форма от נכה передаёт нанесённый удар или тяжкое поражение; «поражено» сохраняет пассивность и поэтическую силу без архаизма.
- source_word: כָעֵשֶׂב
  choice: словно трава
  rationale: עֵשֶׂב обозначает траву или зелень; «словно трава» естественно передаёт сравнение с хрупкой, засыхающей растительностью.
- source_word: וַיִּבַשׁ
  choice: и иссохло
  rationale: Глагол יבש означает «высохнуть, увянуть». «Иссохло» согласуется с образом травы и выражает утрату жизненной силы.
- source_word: לִבִּי
  choice: сердце моё
  rationale: לֵב обозначает сердце как внутреннее средоточие мыслей, чувств и воли; традиционное и прозрачное «сердце» сохраняет поэтическую антропологию текста.
- source_word: כִּי
  choice: потому что
  rationale: Здесь כִּי вводит причину описанного состояния; «потому что» ясно передаёт причинную связь.
- source_word: שָׁכַחְתִּי
  choice: я забываю
  rationale: Перфект допускает описание совершившегося забывания с сохраняющимся результатом, однако в контексте продолжающегося бедствия естественно настоящее время «забываю»; альтернатива отмечена в сноске.
- source_word: מֵאֲכֹל
  choice: есть
  rationale: 'Буквально конструкция означает «от вкушения», но после «забывать» современный русский требует инфинитива: «забываю есть».'
- source_word: לַחְמִי
  choice: свой хлеб
  rationale: לֶחֶם буквально означает «хлеб», а шире — «пища». «Свой хлеб» сохраняет конкретность еврейского образа; общее значение указано в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с сохранением поэтического образа и еврейского порядка двух сказуемых. Формулировка «поражено, словно трава, и иссохло» сохраняет возможную синтаксическую связь сравнения прежде всего с первым глаголом, не исключая его смыслового распространения на всё состояние сердца.
