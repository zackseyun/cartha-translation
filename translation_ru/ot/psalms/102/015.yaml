source:
  edition: WLC
  text: וְ/יִֽירְא֣וּ ג֭וֹיִם אֶת שֵׁ֣ם יְהוָ֑ה וְֽ/כָל מַלְכֵ֥י הָ֝/אָ֗רֶץ אֶת כְּבוֹדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/015.yaml
  text: Then the nations will fear the name of Yahweh[b][a], and all the kings of the earth your glory.
translation:
  language: ru
  text: Тогда[a] народы будут страшиться имени Яхве[b], и все цари земли — славы Твоей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И народы будут страшиться…» Союз можно передать простым «и»; «тогда» явно выражает следствие из сказанного в предыдущем стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут благоговеть перед именем Яхве». Еврейский глагол может обозначать страх в смысле благоговейного трепета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִירְאוּ
  choice: Тогда … будут страшиться
  rationale: Форма Qal imperfect 3-го лица множественного числа от ירא выражает страх, который может включать благоговение. Будущее время соответствует контексту, а «тогда» передаёт следственное значение союза וְ в связи с предыдущим стихом.
- source_word: גּוֹיִם
  choice: народы
  rationale: Обычное значение — народы или нации; «народы» естественно звучит в русском псалмическом контексте и не вносит более позднего противопоставления иудеев и язычников.
- source_word: אֶת שֵׁם יְהוָה
  choice: имени Яхве
  rationale: Сохраняется образ «имени» как явленной личности и славы Бога, без поясняющего пересказа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: וְכָל מַלְכֵי הָאָרֶץ
  choice: и все цари земли
  rationale: כָל при существительном во множественном числе естественно передаётся как «все», а הָאָרֶץ — как «земли».
- source_word: אֶת כְּבוֹדֶךָ
  choice: славы Твоей
  rationale: כָּבוֹד означает славу, честь, величие; «слава» лучше всего сохраняет поэтический и богословский регистр. Местоименный суффикс 2-го лица единственного числа передан прямым обращением «Твоей».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет личное имя, не подменяя его титулом.
- issue: Смысл глагола ירא по отношению к народам и царям
  choice: будут страшиться
  alternative: будут бояться; будут благоговеть
  rationale: Выбранное выражение сохраняет напряжение между страхом и благоговейным трепетом, не сводя значение только к ужасу или только к почтению.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным псалмическим звучанием. Эллипсис во второй половине («цари земли — славы Твоей») сохраняет параллелизм и краткость еврейской строки. Заглавная буква в «Твоей» служит русской традиции почтительного обращения к Богу, не меняя смысла текста.
