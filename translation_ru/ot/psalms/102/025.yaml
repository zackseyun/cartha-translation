  text: לְ֭/פָנִים הָ/אָ֣רֶץ יָסַ֑דְתָּ וּֽ/מַעֲשֵׂ֖ה יָדֶ֣י/ךָ שָׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/025.yaml
  text: Long ago you founded the earth[a], and the heavens are the work of your hands.
translation:
  language: ru
  text: Давно Ты основал землю[a], и небеса — дело Твоих рук.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда-то Ты положил основание земли».'
    reason: 'Лексико-образная альтернатива: יָסַד можно передать развёрнуто как «положил основание», а לְפָנִים — как «когда-то».'
lexical_decisions:
- source_word: לְפָנִים
  choice: Издавна
  rationale: 'Наречие обозначает давнее время: «прежде, издревле». «Издавна» естественно для современной русской поэзии и сохраняет временной смысл.'
- source_word: הָאָרֶץ
  choice: землю
  rationale: Параллелизм с небесами указывает на космический смысл — землю как часть сотворённого мира, а не отдельную страну.
- source_word: יָסַדְתָּ
  choice: Ты основал
  rationale: Глагол יסד передаёт образ основания или закладки фундамента. «Основал» кратко сохраняет этот образ и грамматически соответствует прямому обращению к Богу.
- source_word: וּמַעֲשֵׂה
  choice: и … дело
  rationale: Сочетание образует именную фразу «дело Твоих рук»; в русском настоящая связка естественно опускается.
- source_word: יָדֶיךָ
  choice: Твоих рук
  rationale: Сохраняется поэтический антропоморфный образ Божьего мастерства и множественное число исходного выражения.
- source_word: שָׁמָיִם
  choice: небеса
  rationale: «Небеса» сохраняет множественную форму, возвышенный поэтический регистр и космический параллелизм с землёй.
theological_decisions:
- issue: Прямое приписывание творения Богу
  choice: 'Сохранено обращение во втором лице: Бог основал землю, а небеса названы делом Его рук.'
  alternative: Безлично описать возникновение земли и небес либо ослабить образ рук.
  rationale: Еврейский текст прямо обращён к Богу и недвусмысленно приписывает Ему творение; образ рук следует сохранить как поэтический антропоморфизм.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой поэзии. Прописные местоимения в обращении к Богу следуют принятой русской религиозно-литературной норме; тире естественно оформляет бессвязочную именную конструкцию.
