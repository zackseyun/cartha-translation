  text: הֵ֤מָּה יֹאבֵדוּ֮ וְ/אַתָּ֪ה תַ֫עֲמֹ֥ד וְ֭/כֻלָּ/ם כַּ/בֶּ֣גֶד יִבְל֑וּ כַּ/לְּב֖וּשׁ תַּחֲלִיפֵ֣/ם וְֽ/יַחֲלֹֽפוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/102/026.yaml
  text: They will perish[a], but you will remain; all of them will wear out like a garment. Like clothing you will change them[b], and they will pass away.
translation:
  language: ru
  text: Они погибнут, а Ты останешься[a]; все они износятся, как одежда. Как одежду Ты сменишь их[b], и они пройдут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будешь стоять». Здесь еврейский глагол выражает непреходящее существование в противоположность гибели творения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заменишь их». Еврейский глагол может означать смену или замену, продолжая образ одежды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение мужского рода множественного числа отсылает к небесам и земле в предыдущем стихе и подчёркивает противопоставление Творцу.
- source_word: יֹאבֵדוּ
  choice: погибнут
  rationale: Qal imperfect глагола אבד выражает грядущую гибель; «погибнут» передаёт это прямо, не обязательно подразумевая полное уничтожение.
- source_word: וְאַתָּה
  choice: а Ты
  rationale: 'Союз ו в данном контексте имеет противительное значение: творение погибнет, а Бог останется.'
- source_word: תַעֲמֹד
  choice: останешься
  rationale: Буквальное значение — «будешь стоять», но здесь глагол выражает непреходящее существование в противоположность гибели творения. Более буквальный образ сохранён в сноске.
- source_word: וְכֻלָּם
  choice: все они
  rationale: Оборот целиком охватывает названный ранее сотворённый мир.
- source_word: כַּבֶּגֶד
  choice: как одежда
  rationale: בגד — общее обозначение одежды; перевод сохраняет сравнение с изнашивающейся вещью.
- source_word: יִבְלוּ
  choice: износятся
  rationale: Глагол בלה обычно обозначает изнашивание, особенно одежды, поэтому метафора передана непосредственно.
- source_word: כַּלְּבוּשׁ
  choice: как одеяние
  rationale: לבוש также обозначает одежду. Слово «одеяние» сохраняет поэтический параллелизм и избегает дословного повтора.
- source_word: תַּחֲלִיפֵם
  choice: Ты сменишь их
  rationale: Hiphil глагола חלף с объектным суффиксом допускает значения «сменить» и «заменить». «Сменишь» естественно продолжает образ смены одежды, а альтернатива отмечена в сноске.
- source_word: וְיַחֲלֹפוּ
  choice: и они минуют
  rationale: Qal глагола חלף здесь указывает на то, что сотворённое пройдёт, уйдёт; «минут» передаёт преходящесть и перекликается с образом смены одежды, не утверждая абсолютного уничтожения.
theological_decisions:
- issue: Непреходящее бытие Бога в противопоставлении преходящему творению
  choice: Передать תַעֲמֹד как «останешься», ясно выражая контраст между гибелью творения и непреходящим существованием Бога.
  alternative: «Будешь стоять» — буквальное сохранение пространственного образа.
  rationale: Контекст придаёт глаголу значение постоянства, однако буквальная возможность не скрыта и приведена в сноске; более поздняя догматическая терминология в текст не внесена.
- issue: Характер изменения сотворённого порядка
  choice: 'Сохранить метафору смены одежды: «Ты сменишь их… и они минуют».'
  alternative: «Ты заменишь их… и они изменятся».
  rationale: Еврейский корень חלף допускает смысл смены, замены и прохождения. Основной текст сохраняет напряжение между действием Бога и преходящестью творения, не уточняя способ или окончательный результат сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Одеяние» и «минут» поддерживают жанр псалма, оставаясь понятными. Прописная буква в обращённом к Богу местоимении соответствует распространённой русской библейской издательской традиции.
