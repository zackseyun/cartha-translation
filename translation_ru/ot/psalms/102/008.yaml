  yaml_path: translation/ot/psalms/102/008.yaml
  text: All day long my enemies reproach me[b][a]; those who mock me swear by me.
translation:
  language: ru
  text: 'Весь день мои враги поносят меня;

    те, кто глумится надо мной, клянутся мной.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «клянутся против меня»; возможно также, что они употребляют псалмопевца — его имя или участь — как формулу проклятия. Еврейское выражение трудно для толкования.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּל הַיּוֹם
  choice: Весь день
  rationale: Естественное русское выражение, передающее продолжительность действия на протяжении всего дня.
- source_word: חֵרְפוּנִי
  choice: поносят меня
  rationale: Глагол חרף обозначает оскорбительное поношение и презрительную брань; «поносят» сохраняет возвышенный поэтический регистр и широкий смысл.
- source_word: אֹיְבַי
  choice: враги
  rationale: Прямая и естественная передача существительного с притяжательным суффиксом; принадлежность выражена местоимением «меня» в составе строки.
- source_word: מְהוֹלָלַי
  choice: глумящиеся надо мной
  rationale: Форма трудна для толкования, но контекст указывает на людей, подвергающих псалмопевца насмешке и издевательству. Причастный оборот звучит естественно и не сужает значение до лёгкой насмешки.
- source_word: בִּי נִשְׁבָּעוּ
  choice: клянутся мною
  rationale: Буквально сохраняется сочетание глагола «клясться» с обозначением того, кем клянутся. В данном враждебном контексте выражение, вероятно, связано с употреблением участи или имени псалмопевца в формуле проклятия; эта трудность отмечена в сноске.
theological_decisions:
- issue: Связь выражения בִּי נִשְׁבָּעוּ с клятвой или проклятием
  choice: В основном тексте сохранено буквальное «клянутся мною», а в сноске раскрыт вероятный оттенок проклятия.
  alternative: «Клянут меня» или «употребляют моё имя в проклятиях».
  rationale: Еврейская конструкция допускает понимание обычной клятвы кем-либо, однако в контексте враждебного поношения, вероятно, означает, что имя или бедственное положение псалмопевца стало формулой проклятия. Перевод не должен безоговорочно устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Поносят» и «глумящиеся» передают резкость враждебного презрения, не становясь архаичными; трудная конструкция второй строки намеренно сохранена и пояснена сноской.
