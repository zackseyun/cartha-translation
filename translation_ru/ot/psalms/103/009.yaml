  language: ru
  text: Он не будет вечно вести тяжбу[a] и не будет навсегда хранить гнев[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет обвинять», «будет спорить». Еврейский глагол может означать спор, противоборство или ведение дела против кого-либо.'
