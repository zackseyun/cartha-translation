    reason: implicit_object_and_lexical_alternative
lexical_decisions:
- source_word: לָנֶצַח
  choice: не вечно
  rationale: Сочетание לְ с נֶצַח обозначает длительность; «не вечно» естественно передаёт отрицание бесконечной продолжительности и сохраняет параллелизм с לְעוֹלָם.
- source_word: יָרִיב
  choice: будет вести тяжбу
  rationale: Глагол ריב может означать спор, противоборство или ведение дела против кого-либо. «Вести тяжбу» сохраняет судебно-отношенческий оттенок, не сводя смысл только к обвинению.
- source_word: לְעוֹלָם
  choice: не навсегда
  rationale: עוֹלָם обозначает неопределённо долгую или вечную длительность. «Не навсегда» естественно по-русски и позволяет избежать дословного повторения «не вечно» во второй строке.
- source_word: יִטּוֹר
  choice: сохранит гнев
  rationale: Глагол נטר буквально означает «хранить, удерживать, стеречь», а в данном контексте — продолжать держать гнев или злобу. «Сохранит гнев» ясно и естественно передаёт контекстуальный смысл.
theological_decisions:
- issue: Следует ли явно называть объект глагола יִטּוֹר
  choice: Передать подразумеваемый по контексту объект словом «гнев», отметив это в сноске.
  alternative: 'Оставить объект невыраженным: «и не навсегда будет хранить».'
  rationale: В еврейском тексте объект прямо не назван, однако абсолютное употребление נטר здесь идиоматически означает хранить гнев или затаивать обиду. В основном тексте явное «гнев» делает смысл понятным по-русски, а сноска сохраняет сведения о лаконичности оригинала.
- issue: Судебный или общий смысл יָרִיב
  choice: «будет вести тяжбу»
  alternative: «будет обвинять» или «будет спорить»
  rationale: Перевод сохраняет возможный судебный оттенок корня ריב, но не утверждает, что речь идёт исключительно о формальном судебном обвинении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Параллель «не вечно — не навсегда» сохранён без тяжеловесного повтора; местоимение «Он» указывает на Господа из контекста псалма.
