  text: בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/אַל תִּ֝שְׁכְּחִ֗י כָּל גְּמוּלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/002.yaml
  text: Bless Yahweh[a], O my soul, and do not forget all his benefits.
translation:
  language: ru
  text: Благословляй, душа моя, Яхве и не забывай всех его благодеяний[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех его деяний»; также возможно: «всего, чем он воздал». Еврейское слово может широко обозначать то, что один делает для другого или чем ему воздаёт, но здесь контекст указывает на благодеяния.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכִי
  choice: Благословляй
  rationale: Форма повелительного наклонения женского рода единственного числа обращена к «душе». «Благословляй» сохраняет основной религиозный смысл корня ברך и традиционную связь с благословением, не сводя его лишь к хвале.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Здесь נֶפֶשׁ обозначает самого псалмопевца, обращающегося к себе. Инверсия «душа моя» естественна для возвышенной русской поэзии и ясно передаёт обращение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: וְאַל תִּשְׁכְּחִי
  choice: и не забывай
  rationale: Сочетание союза с отрицательной частицей и формой 2-го лица женского рода выражает запрещение; простой русский императив точно и естественно передаёт конструкцию.
- source_word: כָּל
  choice: всех
  rationale: Сохраняет всеохватный смысл еврейского определителя.
- source_word: גְּמוּלָיו
  choice: его благодеяний
  rationale: גְּמוּל может обозначать деяние, воздаяние или то, что человек получает от другого. Перечень милостей в последующих стихах указывает здесь на положительный смысл; «благодеяния» передаёт его кратко и естественно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога, а не титул. «Яхве» сохраняет это различие и отражает наиболее общепринятую научную реконструкцию произношения.
- issue: Смысл גְּמוּלָיו
  choice: его благодеяний
  alternative: всех его деяний; всего, чем он воздал
  rationale: Само слово допускает более широкое и даже двустороннее значение воздаяния, однако ближайший контекст перечисляет благие действия Яхве. Положительный смысл выбран в тексте, а исходная широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Обращение «душа моя» сохраняет достоинство и ритм псалма; архаические формы и избыточная церковнославянская лексика не используются.
