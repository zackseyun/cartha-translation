  text: בָּרֲכ֥וּ יְהוָ֗ה מַלְאָ֫כָ֥י/ו גִּבֹּ֣רֵי כֹ֭חַ עֹשֵׂ֣י דְבָר֑/וֹ לִ֝/שְׁמֹ֗עַ בְּ/ק֣וֹל דְּבָרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/020.yaml
  text: Bless Yahweh[a], his angels, mighty in strength, who do his word[b], obeying the voice of his word.
translation:
  language: ru
  text: Благословляйте Яхве, ангелы Его, могучие силой, исполняющие Его слово, внимающие голосу Его слова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исполняющие Его слово, слушаясь голоса Его слова».'
    reason: Основной текст передаёт лִשְׁמֹעַ как «внимать», сохраняя слуховой образ; вариант подчёркивает подразумеваемый в контексте оттенок послушания.
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Благословляйте
  rationale: Форма повелительного наклонения множественного числа сохраняет повторяющийся в псалме призыв благословлять Яхве; «прославляйте» было бы менее точным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена титулом.
- source_word: מַלְאָכָיו
  choice: ангелы Его
  rationale: В небесном контексте речь идёт об ангелах, а не о человеческих посланниках.
- source_word: גִּבֹּרֵי כֹחַ
  choice: могучие силой
  rationale: Сохраняет усиленное еврейское выражение о могуществе и силе, не вводя военного образа «воинов».
- source_word: עֹשֵׂי דְבָרוֹ
  choice: исполняющие Его слово
  rationale: Естественно по-русски передаёт деятельное осуществление сказанного Богом и сохраняет повтор слова דָּבָר.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: слушаясь голоса
  rationale: Конструкция означает не просто физически слышать, а внимать с послушанием; формулировка сохраняет одновременно слуховой образ и смысл повиновения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя Бога; его транслитерация сохраняет различие между именем и титулом.
- issue: Смысл שׁמע в описании ангелов
  choice: слушаясь
  alternative: слушая
  rationale: Контекст исполнения Божьего слова предполагает действенное послушание, однако «слушаясь» сохраняет связь со слуховым значением корня и не сводит выражение лишь к абстрактному повиновению.
- issue: Отношение עֹשֵׂי דְבָרוֹ к לִשְׁמֹעַ בְּקוֹל דְּבָרוֹ
  choice: исполняющие Его слово, слушаясь голоса Его слова
  alternative: исполняющие Его слово, как только услышат Его повеление
  rationale: Сохраняется синтаксическая и образная напряжённость оригинала без добавления временного значения «как только» и без сужения דָּבָר до «повеления».
translation_notes:
  register: Современный литературный русский с достоинством поэтического призыва. Инверсия «ангелы Его» и «Его слово» поддерживает возвышенный регистр без чрезмерной архаизации; повтор «слово… слова» намеренно сохранён вслед за еврейским текстом.
