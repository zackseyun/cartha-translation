id: PSA.103.21
reference: Psalms 103:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בָּרֲכ֣וּ יְ֭הוָה כָּל צְבָאָ֑י/ו מְ֝שָׁרְתָ֗י/ו עֹשֵׂ֥י רְצוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/021.yaml
  text: Bless Yahweh[a], all his hosts, his ministers[b], who do his will.
translation:
  language: ru
  text: Благословляйте Яхве, все Его воинства[a], Его служители[b], исполняющие Его волю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все Его войска»; по контексту — «весь Его небесный сонм».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Его слуги»; «те, кто служит Ему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרֲכוּ
  choice: Благословляйте
  rationale: Форма повелительного наклонения во множественном числе. «Благословляйте» точно сохраняет ключевой повтор псалма и обращение к небесным существам.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: כָּל צְבָאָיו
  choice: все Его воинства
  rationale: צָבָא означает войско или сонм. В контексте речь, вероятнее всего, о небесных силах, однако «воинства» сохраняет широту и образность еврейского слова.
- source_word: מְשָׁרְתָיו
  choice: Его служители
  rationale: Причастная форма от שׁרת обозначает тех, кто служит или исполняет особое служение. «Служители» естественно и уместно для возвышенного контекста.
- source_word: עֹשֵׂי רְצוֹנוֹ
  choice: исполняющие Его волю
  rationale: Причастный оборот естественно передаёт характеристику служителей; רָצוֹן здесь означает Божью волю, желание или угодное Ему.
theological_decisions:
- issue: Кого обозначают «Его воинства» и «Его служители»
  choice: Формулировка допускает прежде всего небесные силы и ангельских служителей.
  alternative: Все земные служители Бога в более широком смысле.
  rationale: Предыдущий стих прямо обращён к ангелам, поэтому контекст указывает на небесный сонм. При этом перевод не добавляет слово «ангелы» и сохраняет смысловую широту оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Порядок слов сделан естественным для русского языка, а повтор «Его» сохраняет ясные связи между определениями.
