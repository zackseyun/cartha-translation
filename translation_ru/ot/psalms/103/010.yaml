  text: לֹ֣א כַ֭/חֲטָאֵי/נוּ עָ֣שָׂה לָ֑/נוּ וְ/לֹ֥א כַ֝/עֲוֺנֹתֵ֗י/נוּ גָּמַ֥ל עָלֵֽי/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/010.yaml
  text: He has not dealt with us according to our sins[a], nor repaid us according to our iniquities.
translation:
  language: ru
  text: Он поступил с нами не по нашим грехам[a] и не воздал нам по нашим беззакониям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он поступил с нами не так, как заслуживают наши грехи, и не воздал нам того, чего заслуживают наши беззакония».'
    reason: Лексическая альтернатива, явно раскрывающая значение соразмерности, выраженное предлогом כְּ.
lexical_decisions:
- source_word: כַּחֲטָאֵינוּ
  choice: не по нашим грехам
  rationale: 'Предлог כְּ выражает меру или соразмерность: Бог поступил не в соответствии с грехами и не так, как они того заслуживают. «Грехи» передаёт множественное חֲטָאִים как конкретные греховные поступки.'
- source_word: עָשָׂה לָנוּ
  choice: поступил с нами
  rationale: В данном сочетании широкое по значению עשה описывает обращение или действие по отношению к людям. «Поступил с нами» естественно звучит по-русски и не добавляет отсутствующей в тексте конкретики.
- source_word: וְלֹא
  choice: и не
  rationale: Союз с повторной отрицательной частицей соединяет два параллельных утверждения; буквальное «и не» сохраняет их равновесие и звучит естественно.
- source_word: כַּעֲוֺנֹתֵינוּ
  choice: по нашим беззакониям
  rationale: עָוֹן может обозначать беззаконие, вину или её последствия. «Беззакония» сохраняет отличие от «грехов» в первой строке и не сужает значение только до субъективной виновности.
- source_word: גָּמַל עָלֵינוּ
  choice: воздал нам
  rationale: גמל здесь означает отплатить или воздать сообразно содеянному. В отрицательном контексте «не воздал нам» ясно выражает милосердное невоздаяние по мере беззаконий; предлог עַל естественно передан русской конструкцией с дательным местоимением.
- source_word: לֹא ... וְלֹא
  choice: не ... и не
  rationale: Повтор отрицания сохраняет подчёркнутый параллелизм двух частей еврейского стиха.
theological_decisions:
- issue: Утверждение о Божьем милосердии без привнесения определённой теории искупления или сроков суда
  choice: Общее утверждение о том, что Бог не поступает со Своим народом и не воздаёт ему соразмерно его грехам и беззакониям
  alternative: Ограничить смысл только земными наказаниями либо понять стих как безусловное отрицание всякого Божьего суда
  rationale: Еврейский текст широко говорит о милосердном отношении Бога и о том, что Он не воздаёт по мере греха. Перевод не ограничивает это утверждение временными последствиями, но и не превращает его в абсолютное отрицание суда.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Формулы «поступить с нами» и «воздать нам» понятны широкому читателю и сохраняют параллелизм оригинала без излишней архаизации.
