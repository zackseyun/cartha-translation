  source_fidelity: 'Текст точно передаёт все смысловые компоненты еврейского оригинала: רַחוּם — «сострадателен», חַנּוּן — «милостив», личное имя יְהוָה — «Яхве», идиому אֶרֶךְ אַפַּיִם — «не скор на гнев», а רַב־חָסֶד — «богат неизменной любовью». Противопоставления или добавления смысла нет.'
