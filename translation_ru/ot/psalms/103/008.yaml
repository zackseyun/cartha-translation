  text: רַח֣וּם וְ/חַנּ֣וּן יְהוָ֑ה אֶ֖רֶךְ אַפַּ֣יִם וְ/רַב חָֽסֶד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/008.yaml
  text: Yahweh is compassionate and gracious[b][a], slow to anger and abounding in steadfast love.
translation:
  language: ru
  text: Сострадателен[a] и милостив Яхве, не скор на гнев и богат неизменной любовью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милосерден».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское חֶסֶד обозначает неизменную, верную любовь и нередко подразумевает верность отношениям завета; возможные переводы: «верная любовь», «милость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַחוּם
  choice: сострадателен
  rationale: Передаёт глубокое сочувствие и милосердие как личное качество Бога, не сливаясь по смыслу со следующим словом חַנּוּן.
- source_word: חַנּוּן
  choice: милостив
  rationale: Выражает готовность даровать милость и благоволение; это естественное и укоренённое в русском библейском стиле соответствие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֶרֶךְ אַפַּיִם
  choice: не скор на гнев
  rationale: Естественно передаёт еврейскую идиому, буквально связанную с замедленным проявлением гнева, без неясного буквального калькирования.
- source_word: רַב
  choice: богат
  rationale: В сочетании с существительным выражает изобилие качества; по-русски «богат любовью» звучит естественно и достойно.
- source_word: חָסֶד
  choice: неизменная любовь
  rationale: Сохраняет сочетание любви, постоянства и верности, присущее этому ёмкому слову, не сводя его исключительно к юридической верности завету.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Передача חָסֶד в описании Божьего характера
  choice: неизменная любовь
  alternative: верная любовь; милость; верность завету
  rationale: Выбор сохраняет одновременно сердечный и устойчивый характер חָסֶד. Примечание указывает на верность и заветный оттенок, не превращая один из аспектов в единственное значение.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной синтаксической формой. Инверсия сохраняет начальное перечисление качеств в еврейском тексте; идиома о гневе передана естественным выражением «не скор на гнев».
