  terminology: «Яхве» последовательно передаёт тетраграмматон как имя. Разведение «сострадателен» и «милостив» удачно сохраняет различие двух соседних еврейских определений. «Неизменная любовь» является приемлемой современной передачей חֶסֶד; примечание корректно отмечает оттенки верности и отношений завета, не сужая значение до одного аспекта.
