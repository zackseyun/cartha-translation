source:
  edition: WLC
  text: עֹשֵׂ֣ה צְדָק֣וֹת יְהוָ֑ה וּ֝/מִשְׁפָּטִ֗ים לְ/כָל עֲשׁוּקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/006.yaml
  text: Yahweh works righteousness and justice for all who are oppressed[a].
translation:
  language: ru
  text: Яхве совершает праведные дела и вершит правосудие для всех угнетённых[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве творит правду и суд для всех угнетённых».'
    reason: Лексическая альтернатива сохраняет более буквальную и компактную передачу צְדָקוֹת и מִשְׁפָּטִים.
lexical_decisions:
- source_word: עֹשֵׂה
  choice: совершает … и вершит
  rationale: 'Причастие qal описывает постоянную, характерную деятельность Яхве. В русском один еврейский глагол естественно передан двумя сочетающимися с существительными глаголами: «совершает дела» и «вершит правосудие».'
- source_word: צְדָקוֹת
  choice: праведные дела
  rationale: Форма множественного числа может обозначать конкретные проявления праведности и справедливости. «Праведные дела» сохраняет множественное число и не смешивает это слово с последующим מִשְׁפָּטִים.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» принята в современной русской библеистической передаче.
- source_word: וּמִשְׁפָּטִים
  choice: и вершит правосудие
  rationale: מִשְׁפָּטִים может обозначать судебные решения или действия, осуществляющие справедливость. «Вершит правосудие» естественно по-русски передаёт собирательный смысл, не исключая конкретных справедливых решений.
- source_word: לְכָל
  choice: для всех
  rationale: Предлог לְ здесь указывает на тех, в чью пользу совершается действие; «для всех» ясно передаёт значение благополучателя.
- source_word: עֲשׁוּקִים
  choice: угнетённых
  rationale: Страдательное причастие обозначает людей, подвергающихся притеснению, насилию или эксплуатации. Субстантивированное «угнетённых» кратко и естественно сохраняет пассивный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Соотношение צְדָקוֹת и מִשְׁפָּטִים
  choice: праведные дела и правосудие
  alternative: правду и суд
  rationale: Выбранная передача сохраняет различие между праведными действиями и осуществлением суда, но не навязывает узкого юридического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Формулировка ясна обычному читателю; пара «совершает праведные дела — вершит правосудие» естественно передаёт еврейский параллелизм.
