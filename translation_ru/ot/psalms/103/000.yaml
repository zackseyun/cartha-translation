lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая надпись передана без добавления слова «псалом», которого нет в еврейском тексте; конструкция допускает значение авторства или принадлежности.
- source_word: בָּרֲכִי
  choice: Благословляй
  rationale: Императив женского рода согласован с обращением к душе; длительная форма по-русски естественно выражает призыв к постоянному действию.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Сохраняет традиционный и контекстуально естественный образ внутреннего «я», обращающегося к самому себе.
- source_word: כָל־קְרָבַי
  choice: всё, что внутри меня
  rationale: Передаёт совокупность внутренних частей как всё внутреннее существо человека, не ограничивая выражение телесными органами.
- source_word: שֵׁם קָדְשׁוֹ
  choice: Его святое имя
  rationale: Сохраняет прямое значение и поэтический параллелизм.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» соответствует укоренившейся русской библейской традиции и передаёт традиционное чтение имени, не утверждая спорную реконструкцию произношения.
- issue: Подразумеваемый глагол во второй части строки
  choice: Глагол «благословляй» не повторён, но обозначен синтаксически с помощью тире
  alternative: 'Повторить: «и всё, что внутри меня, благословляй Его святое имя»'
  rationale: В еврейском тексте второй объект зависит от того же императива; русская конструкция с тире сохраняет эллипсис и избегает тяжеловесного повтора.
