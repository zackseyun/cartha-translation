lexical_decisions:
- source_word: הַמַּשְׂבִּיעַ
  choice: насыщает
  rationale: Причастие породы hифиль от שׂבע продолжает ряд деяний Господа; «насыщает» передаёт полноту даруемого блага и сохраняет возвышенный поэтический тон.
- source_word: בַּטּוֹב
  choice: благами
  rationale: Субстантивированное טוֹב имеет собирательный смысл. Множественное «благами» естественно по-русски и не уточняет сверх текста, о каких именно дарах идёт речь.
- source_word: עֶדְיֵךְ
  choice: жизнь твою
  rationale: Масоретская форма буквально обычно означает «твоё украшение», но в данном сочетании трудна. «Жизнь твою» передаёт широко принятую контекстуальную интерпретацию продолжительности жизни, при этом исходная неясность отмечена в сноске.
- source_word: תִּתְחַדֵּשׁ
  choice: обновляется
  rationale: Форма hitpael от חדש допускает возвратно-пассивный оттенок; русское «обновляется» естественно передаёт его, не называя явно действующего лица.
- source_word: כַּנֶּשֶׁר
  choice: как у орла
  rationale: נֶשֶׁר обозначает крупную хищную птицу, традиционно орла; конструкция «как у орла» ясно связывает сравнение с юностью, сохраняя традиционный поэтический образ.
- source_word: נְעוּרָיִכִי
  choice: юность твоя
  rationale: Абстрактное существительное во множественном числе с суффиксом 2-го лица означает юность или юношескую силу. Буквальное «юность твоя» сохраняет образ и допускает оба оттенка.
