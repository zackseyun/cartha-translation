  text: כִּ/רְחֹ֣ק מִ֭זְרָח מִֽ/מַּֽעֲרָ֑ב הִֽרְחִ֥יק מִ֝מֶּ֗/נּוּ אֶת פְּשָׁעֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/012.yaml
  text: As far as the east is from the west[b][a], so far he has removed our transgressions from us.
translation:
  language: ru
  text: Как далёк восток от запада, так далеко Он удалил от нас наши преступления.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «так Он отдалил от нас наши преступления».'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «преступления», может также означать «мятежи», «неповиновение» или «нарушения».
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּרְחֹק
  choice: Как далёк … так далеко
  rationale: Сравнительная конструкция описывает степень или расстояние. Русская парная формула «как далёк… так далеко» естественно передаёт сопоставление и связывает образ расстояния с последующим действием.
- source_word: מִזְרָח מִמַּעֲרָב
  choice: восток от запада
  rationale: Названия противоположных сторон света сохраняют пространственный образ огромной, фактически неизмеримой удалённости; предлог «от» естественно выражает исходную точку расстояния по-русски.
- source_word: הִרְחִיק
  choice: удалил
  rationale: Каузативная форма глагола רחק означает «сделать далёким, отдалить, удалить». «Удалил» ясно и ёмко передаёт отделение проступков от людей, не устраняя пространственную метафору.
- source_word: מִמֶּנּוּ
  choice: от нас
  rationale: Местоименный суффикс первого лица множественного числа прямо указывает на сообщество говорящих.
- source_word: פְּשָׁעֵינוּ
  choice: наши преступления
  rationale: פשע обозначает преступление, нарушение или мятежное неповиновение. «Преступления» сохраняет оттенок сознательного нарушения лучше, чем более общее «грехи», и остаётся понятным современному читателю.
theological_decisions:
- issue: Пространственная метафора прощения
  choice: Сохранить образ предельного удаления преступлений от людей.
  alternative: Передать общий смысл как прощение грехов без образа расстояния.
  rationale: Еврейский текст сначала сопоставляет восток и запад, а затем тем же понятием удалённости описывает действие Бога. Сохранение этого образа подчёркивает полноту избавления от преступлений, не уточняя механизм и не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с поэтической симметрией исходного стиха. Заглавное «Он» указывает на Бога в ближайшем контексте псалма, не добавляя имени, отсутствующего в данном стихе.
