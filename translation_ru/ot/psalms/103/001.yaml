source:
  edition: WLC
  text: לְ/דָוִ֨ד בָּרֲכִ֣י נַ֭פְשִׁ/י אֶת יְהוָ֑ה וְ/כָל קְ֝רָבַ֗/י אֶת שֵׁ֥ם קָדְשֽׁ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/001.yaml
  text: Of David. Bless Yahweh[a], O my soul, and all that is within me, bless his holy name.
translation:
  language: ru
  text: Давидов. Благослови, душа моя, Яхве; и всё, что во мне, да благословит Его святое имя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְדָוִד
  choice: Давидов
  rationale: Надписание с לְ и личным именем обозначает связь псалма с Давидом, не уточняя однозначно авторство, посвящение или принадлежность. Традиционная краткая форма «Давидов» сохраняет эту неопределённость.
- source_word: בָּרֲכִי
  choice: Благослови
  rationale: Форма пиэля от ברך означает «благословлять». Повелительное обращение к собственной душе передано прямо, без замены более толковательным «прославь».
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נפש может обозначать душу, жизнь, самого человека или внутреннее существо. В поэтическом самообращении естественное русское соответствие — «душа моя».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного Божьего имени, а не заменён титулом «Господь».
- source_word: וְכָל קְרָבַי
  choice: и всё, что внутри меня
  rationale: Буквально выражение относится ко «всем моим внутренностям», то есть ко всему внутреннему существу человека. Выбран естественный современный оборот, сохраняющий всеохватность оригинала.
- source_word: שֵׁם קָדְשׁוֹ
  choice: Его святое имя
  rationale: Еврейская конструкция буквально означает «имя Его святости» и идиоматично передаётся как «Его святое имя».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В тексте стоит собственное имя Бога. «Яхве» передаёт его непосредственно; титул «Господь» скрыл бы различие между именем и титулом.
- issue: Значение לְדָוִד в надписании
  choice: Давидов
  alternative: Псалом Давида; Давиду; Давидом
  rationale: Краткая форма не навязывает спорного решения о том, означает ли предлог авторство, посвящение или более широкую связь с Давидом.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного поэтического самообращения. Тире помогает ясно соотнести «всё, что внутри меня» с подразумеваемым призывом благословлять святое имя, не добавляя в текст повторного глагола, отсутствующего в масоретском тексте.
