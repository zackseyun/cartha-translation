base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/017.yaml
  text: But the steadfast love of Yahweh is from everlasting to everlasting on those who fear him[a], and his righteousness to children's children.
translation:
  language: ru
  text: 'Но неизменная любовь Яхве — от века и до века — пребывает с боящимися его,

    и его праведность[a] — с детьми их детей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость». Еврейское слово в данном контексте может иметь оба значения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחֶסֶד
  choice: Но неизменная любовь
  rationale: Союз וְ в контексте противопоставляет быстротечность человеческой жизни в предыдущем стихе непреходящей любви Яхве, поэтому передан как «Но». חֶסֶד обозначает верную, постоянную любовь; «неизменная любовь» ясно выражает её устойчивость и не сужает значение до одного лишь чувства или юридического обязательства.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано принятой русской транслитерацией «Яхве», а не заменено титулом.
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: от века и до века
  rationale: Сохранён поэтический еврейский оборот, обозначающий неограниченную длительность в обоих направлениях; эта формула естественна для возвышенной русской речи.
- source_word: עַל יְרֵאָיו
  choice: к боящимся Его
  rationale: עַל здесь выражает направленность или отношение любви, поэтому по-русски естественно «к». «Боящиеся Его» сохраняет присущий ירא смысл благоговейного страха, не ослабляя его до простого уважения.
- source_word: וְצִדְקָתוֹ
  choice: и праведность Его
  rationale: צְדָקָה может обозначать как праведность, так и справедливость. В параллели с неизменной любовью «праведность» лучше сохраняет широту нравственного и заветного смысла; значимая альтернатива отмечена в сноске.
- source_word: לִבְנֵי בָנִים
  choice: к детям их детей
  rationale: Передан буквальный образ последовательных поколений, а местоимение «их» естественно связывает потомков с боящимися Бога. Это шире и образнее, чем «к внукам».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Его транслитерация сохраняет различие между именем и титулом.
- issue: Значение צִדְקָה в данном поэтическом контексте
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» охватывает нравственную правоту и верность Бога, тогда как «справедливость» может быть понята преимущественно в судебном смысле. Поскольку еврейское слово допускает оба оттенка, альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксический параллелизм и повтор «от века и до века» сохранены; тире помогают ясно передать эллиптическое строение второй строки.
