  text: יְֽהוָ֗ה בַּ֭/שָּׁמַיִם הֵכִ֣ין כִּסְא֑/וֹ וּ֝/מַלְכוּת֗/וֹ בַּ/כֹּ֥ל מָשָֽׁלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/019.yaml
  text: Yahweh has established his throne in the heavens[b][a], and his kingdom rules over all.
translation:
  language: ru
  text: 'Яхве утвердил Свой престол на небесах,

    и царство Его[a] владычествует над всем.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «царская власть Его»; или: «царствование Его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
- source_word: בַּשָּׁמַיִם
  choice: на небесах
  rationale: Естественное русское соответствие еврейской форме множественного числа שָׁמַיִם; сохраняет возвышенный поэтический регистр.
- source_word: הֵכִין
  choice: утвердил
  rationale: Порода хифиль глагола כון выражает установление и упрочение; «утвердил» естественно сочетается с образом царского престола.
- source_word: כִּסְאוֹ
  choice: Свой престол
  rationale: Стандартная передача в контексте царской власти; возвратное «Свой» ясно соотносит престол с подлежащим «Яхве».
- source_word: וּמַלְכוּתוֹ
  choice: и царство Его
  rationale: מַלְכוּת может означать царство, царскую власть или царствование. «Царство» кратко и естественно, а альтернативы отмечены в сноске.
- source_word: בַּכֹּל
  choice: над всем
  rationale: В сочетании с משל предлог ב выражает область и всеобщий охват владычества.
- source_word: מָשָׁלָה
  choice: владычествует
  rationale: Глагол передаёт осуществление верховной власти. Настоящее время естественно выражает постоянную, всеобщую реальность, хотя в еврейском употреблена перфектная форма.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога, не подменяя его титулом и не принимая позднюю гибридную огласовку.
- issue: Значение מַלְכוּת
  choice: царство
  alternative: царская власть; царствование
  rationale: Сохранён конкретный и привычный образ царства, при этом сноска сообщает, что слово может обозначать также саму царскую власть или правление.
- issue: Временной оттенок מָשָׁלָה
  choice: владычествует
  alternative: владычествовало; стало владычествовать
  rationale: Перфект при утверждении устойчивого положения может иметь статическое или общеистинное значение; настоящее время не ограничивает Божье владычество прошлым событием.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксический параллелизм оригинала сохранён; «небеса», «престол» и «владычествует» поддерживают царственный регистр без архаизации.
