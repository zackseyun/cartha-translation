  text: to those who keep his covenant[a], and to those who remember his precepts[b], to do them.
translation:
  language: ru
  text: тем, кто соблюдает Его завет[a] и помнит Его предписания[b], чтобы исполнять их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хранит Его завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Его установления» или «Его наставления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁמְרֵי
  choice: тем, кто соблюдает
  rationale: Причастие от שׁמר может означать «хранить», «оберегать» или «соблюдать». В контексте завета «соблюдает» естественно передаёт верность его требованиям.
- source_word: בְרִיתוֹ
  choice: Его завет
  rationale: בְּרִית — обычное библейское обозначение заветных отношений; слово «завет» сохраняет присущий выражению богословский и исторический вес.
- source_word: וּלְזֹכְרֵי
  choice: и помнит
  rationale: זכר обозначает памятование и сознательное внимание, которое здесь направлено на последующее исполнение. «Помнит» сохраняет прямой образ исходного текста.
- source_word: פִקֻּדָיו
  choice: Его предписания
  rationale: פִּקּוּדִים обозначает данные Богом распоряжения или установленные требования. «Предписания» достаточно точно передаёт смысл и не смешивает этот термин с другими словами, переводимыми как «заповеди» или «уставы».
- source_word: לַעֲשׂוֹתָם
  choice: чтобы исполнять их
  rationale: Инфинитив с לְ связывает памятование с практическим исполнением и допускает целевое понимание. Такая формулировка естественна по-русски и сохраняет эту синтаксическую связь.
theological_decisions:
- issue: Практический смысл памятования о Божьих предписаниях
  choice: «помнит Его предписания, чтобы исполнять их»
  alternative: «помнит Его предписания для их исполнения»
  rationale: Исходный текст связывает памятование с действием. Перевод передаёт послушание как характеристику названных людей, не добавляя утверждений о том, что милость заслуживается делами.
translation_notes:
  register: Современный литературный русский язык; достоинство поэтического контекста сохранено без архаизации. Конструкция продолжает синтаксис предыдущего стиха, но остаётся понятной и как отдельный фрагмент.
