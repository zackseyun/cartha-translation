id: PSA.103.11
reference: Psalms 103:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֤י כִ/גְבֹ֣הַּ שָׁ֭מַיִם עַל הָ/אָ֑רֶץ גָּבַ֥ר חַ֝סְדּ֗/וֹ עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/011.yaml
  text: For as high as the heavens are above the earth[a], so great is his steadfast love toward those who fear him.
translation:
  language: ru
  text: Ибо как высоко небо над землёй, так велика Его верная любовь[a] к боящимся Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милость» или «заветная верность». Еврейское חֶסֶד означает верную, неизменную любовь и милость, проявляемые в отношениях завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующей хвалы; «ибо» сохраняет пояснительную функцию и возвышенный поэтический строй.
- source_word: כִגְבֹהַּ שָׁמַיִם עַל־הָאָרֶץ
  choice: как высоко небо над землёй
  rationale: Сравнительная конструкция передаёт степень; форма с «как… так…» естественна по-русски и сохраняет образ неизмеримой высоты.
- source_word: גָּבַר
  choice: так велика
  rationale: Глагол означает «быть сильным, могущественным, превосходить». В данном сравнении речь идёт о величии и преизбытке Божьей любви, поэтому буквальное «возобладала» звучало бы как указание на борьбу, которой контекст не требует.
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: חֶסֶד сочетает милость, любовь и неизменную верность в отношениях. «Верная любовь» передаёт как сердечное расположение, так и постоянство, не сводя смысл только к состраданию.
- source_word: עַל־יְרֵאָיו
  choice: к боящимся Его
  rationale: Предлог обозначает направленность любви, а форма יְרֵאָיו — людей, для которых характерен страх перед Богом. «Боящимся Его» прямо сохраняет лексику страха и не ослабляет её до одного лишь почтения.
theological_decisions:
- issue: Передача חֶסֶד в контексте Божьего сострадания и верности
  choice: Его верная любовь
  alternative: Его милость; Его заветная верность
  rationale: Основной вариант сохраняет одновременно личностную любовь и её неизменность. Слово «милость» может сузить значение до сострадания, а «заветная верность» яснее выражает заветный оттенок, но слабее передаёт любовь и вносит отсутствующее в стихе явное слово «завет».
- issue: Значение страха в יְרֵאָיו
  choice: боящимся Его
  alternative: почитающим Его; благоговеющим перед Ним
  rationale: Прямой вариант сохраняет богословское напряжение библейского выражения «страх Господень» и включает благоговение, не устраняя смысл страха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Парная конструкция «как… так…» сохраняет риторику оригинала; написание «Его» с прописной буквы следует принятой русской библейской традиции и устраняет возможную местоименную неясность.
