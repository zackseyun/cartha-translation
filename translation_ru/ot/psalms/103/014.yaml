source:
  edition: WLC
  text: כִּי ה֖וּא יָדַ֣ע יִצְרֵ֑/נוּ זָ֝כ֗וּר כִּי עָפָ֥ר אֲנָֽחְנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/014.yaml
  text: For he knows our frame[a]; he remembers that we are dust.
translation:
  language: ru
  text: Ибо Он знает, как мы устроены[a], помнит, что мы — прах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наше устройство», «как мы сформированы». Еврейское слово обозначает то, что сформировано или создано.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предыдущего утверждения; «ибо» естественно сохраняет причинно-пояснительную связь и соответствует возвышенному поэтическому регистру.
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение передаёт выраженное в еврейском тексте подлежащее; из контекста ясно, что речь идёт о Боге.
- source_word: יָדַע
  choice: знает
  rationale: Форма перфекта обозначает здесь устойчивое, актуальное знание; настоящее время естественно передаёт этот смысл по-русски.
- source_word: יִצְרֵנוּ
  choice: как мы устроены
  rationale: יֵצֶר связано с формированием и обозначает сформированное устройство или склад. Эта формулировка естественна по-русски, сохраняет образ сотворённой человеческой природы и не сводит его только к телесному составу.
- source_word: זָכוּר
  choice: помнит
  rationale: Формально это пассивное причастие со значением постоянной памятливости или осведомлённости; в данном контексте русское «помнит» ясно и естественно передаёт продолжающееся отношение Бога и поддерживает параллелизм со словом «знает».
- source_word: כִּי
  choice: что
  rationale: Здесь союз вводит содержание того, о чём Бог помнит, поэтому русское «что» точно передаёт синтаксическую функцию.
- source_word: עָפָר
  choice: прах
  rationale: «Прах» буквально передаёт образ сухой земли и сохраняет библейские ассоциации с сотворением, смертностью и человеческой немощью.
- source_word: אֲנָחְנוּ
  choice: мы —
  rationale: Местоимение сохранено, а тире естественно оформляет в русском языке именное сказуемое без добавления отсутствующей в еврейском тексте связки.
theological_decisions:
- issue: Образ человеческой бренности
  choice: «мы — прах»
  alternative: «мы всего лишь прах»
  rationale: Прямая формулировка сохраняет утверждение о сотворённости, смертности и слабости человека, не добавляя слова «всего лишь», которое могло бы неоправданно усилить оттенок умаления человеческого достоинства.
- issue: Значение יִצְרֵנוּ
  choice: «как мы устроены»
  alternative: «наш состав» / «наше образование»
  rationale: Выбранный вариант сохраняет широкий смысл сформированности человека и не ограничивает выражение анатомией либо процессом создания; возможная лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмопевческим звучанием. Заглавное «Он» указывает на Бога согласно русской библейской издательской традиции. Формулировка остаётся ясной для широкого читателя и сохраняет параллелизм двух частей стиха.
