lexical_decisions:
- source_word: הַגּוֹאֵל
  choice: избавляет
  rationale: Причастие от גאל обозначает действие избавителя и искупителя. «Избавляет» естественно сочетается с образом спасения жизни от могилы и не сужает смысл до юридического выкупа, хотя несколько ослабляет оттенок искупления.
- source_word: מִשַּׁחַת
  choice: от могилы
  rationale: שַׁחַת может обозначать яму, могилу или гибель. В данном контексте «могила» ясно передаёт угрозу смерти и сохраняет поэтический образ; другие значения отмечены в сноске.
- source_word: חַיָּיְכִי
  choice: твою жизнь
  rationale: Форма с суффиксом второго лица женского рода относится к душе, к которой обращается псалмопевец. Русское единственное число естественно передаёт смысл חַיִּים здесь без привнесения представления о нематериальной «душе».
- source_word: הַמְעַטְּרֵכִי
  choice: венчает тебя
  rationale: Глагол עטר передаёт образ увенчания или окружения благами. «Венчает» сохраняет поэтическую метафору и высокий, но современно понятный регистр.
- source_word: חֶסֶד
  choice: верной любовью
  rationale: חֶסֶד обозначает преданную, неизменную благость и любовь. «Верная любовь» сохраняет как личностный, так и устойчивый характер отношения, не вводя прямо отсутствующее в строке слово «завет».
- source_word: וְרַחֲמִים
  choice: и состраданием
  rationale: Множественное רַחֲמִים часто употребляется как собирательное обозначение глубокого сострадания и милосердия. Единственное отвлечённое существительное естественно звучит по-русски рядом с «любовью».
theological_decisions:
- issue: Объём образа избавления
  choice: Поэтическое избавление жизни от смерти и гибели без ограничения смысла одной доктринальной категорией.
  alternative: Исключительно телесное спасение от смерти либо исключительно окончательное духовное спасение.
  rationale: Сочетание גאל и שׁחת допускает широкое представление о спасении от смертельной гибели. Перевод сохраняет этот диапазон и не отождествляет образ только с временным избавлением или только с эсхатологическим спасением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Местоименная форма «тебя» сохраняет обращение к душе из контекста псалма; порядок слов сделан естественным для современного русского.
