  text: בָּרֲכ֤וּ יְהוָ֨ה כָּֽל מַעֲשָׂ֗י/ו בְּ/כָל מְקֹמ֥וֹת מֶמְשַׁלְתּ֑/וֹ בָּרֲכִ֥י נַ֝פְשִׁ֗/י אֶת יְהוָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/022.yaml
  text: Bless Yahweh[a], all his works, in all the places of his dominion. Bless Yahweh[c][b], O my soul.
translation:
  language: ru
  text: Благословляйте Яхве, все Его дела, во всех пределах Его владычества! Благословляй Яхве, душа моя!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרֲכ֤וּ / בָּרֲכִ֥י
  choice: Благословляйте / благословляй
  rationale: Сохраняется основной смысл корня ברך, повтор одного и того же глагола и обрамляющий псалом призыв; формы передают соответственно множественное и женское единственное число повелительного наклонения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, непосредственно стоящее в еврейском тексте, без замены титулом «Господь».
- source_word: כָּל מַעֲשָׂיו
  choice: все дела Его
  rationale: מַעֲשֶׂה может обозначать как содеянное, так и сотворённое Богом; «дела» сохраняет эту широту, не сводя выражение только к творениям.
- source_word: בְּכָל מְקֹמוֹת מֶמְשַׁלְתּוֹ
  choice: во всех местах Его владычества
  rationale: Формулировка передаёт локативное בְּכָל מְקֹמוֹת и абстрактное значение מֶמְשָׁלָה — власть, правление, владычество.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Естественное для русской библейской поэзии прямое обращение псалмопевца к самому себе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» прямо представляет тетраграмматон как личное имя и не превращает его в титул.
- issue: Кого обозначают «все дела Его»
  choice: Сохранено широкое выражение без уточнения
  alternative: все творения Его; всё, что Он сотворил
  rationale: Еврейское מַעֲשָׂיו допускает связь как с Божьими деяниями, так и со всем Им созданным; перевод не устраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Инверсия «душа моя» и прописная буква в местоимении «Его» поддерживают возвышенный библейский регистр; синтаксис ясно представляет «все дела Его» как адресата повеления.
