source:
  edition: WLC
  text: יוֹדִ֣יעַ דְּרָכָ֣י/ו לְ/מֹשֶׁ֑ה לִ/בְנֵ֥י יִ֝שְׂרָאֵ֗ל עֲלִילֽוֹתָי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/007.yaml
  text: He made his ways known to Moses[a], his deeds to the sons of Israel.
translation:
  language: ru
  text: 'Он открыл Моисею Свои пути,

    сынам Израиля[a] — Свои деяния.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детям Израиля»; или: «народу Израиля».'
    reason: Лексическая альтернатива для собирательного выражения בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: יוֹדִיעַ
  choice: открыл
  rationale: 'Форма hифиль от ידע выражает причинное значение: Бог дал узнать, сделал известными. «Открыл» естественно передаёт сообщение прежде неведомого, не устраняя смысла намеренного раскрытия.'
- source_word: דְּרָכָיו
  choice: Свои пути
  rationale: Сохранена еврейская метафора «путей» как образа Божьего образа действий; она понятна и укоренена в русском библейском стиле.
- source_word: לְמֹשֶׁה
  choice: Моисею
  rationale: Дательный падеж естественно передаёт адресата откровения, обозначенного предлогом לְ.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Передано формально мужское выражение בְּנֵי יִשְׂרָאֵל без замены на нейтральное собирательное обозначение; более идиоматические варианты приведены в сноске.
- source_word: עֲלִילוֹתָיו
  choice: Свои деяния
  rationale: «Деяния» передаёт заметные действия Бога в возвышенном, но понятном регистре и не добавляет отсутствующего в самом существительном определения «могущественные».
theological_decisions:
- issue: Гендерно маркированное собирательное выражение בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: детям Израиля; народу Израиля
  rationale: Основной текст сохраняет грамматически мужскую форму традиционного этнонима, тогда как сноска отмечает допустимый собирательный смысл, охватывающий весь народ.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Параллелизм еврейской строки сохранён; во второй строке подразумеваемый глагол обозначен тире. Местоимение «Свои» написано с прописной буквы в соответствии с распространённой русской традицией почтительного обозначения Бога.
