source:
  edition: WLC
  text: כְּ/רַחֵ֣ם אָ֭ב עַל בָּנִ֑ים רִחַ֥ם יְ֝הוָ֗ה עַל יְרֵאָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/103/013.yaml
  text: As a father has compassion on his children[a], so Yahweh has compassion on those who fear him.
translation:
  language: ru
  text: Как отец сострадает своим детям[a], так Яхве сострадает тем, кто боится Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как отец жалеет своих сыновей, так Яхве жалеет боящихся Его».'
    reason: 'Лексическая альтернатива: רחם может передаваться как «жалеть», а בנים — формально как «сыновья».'
lexical_decisions:
- source_word: כְּ/רַחֵם
  choice: Как … сострадает
  rationale: Префикс כְּ вводит сравнение, а רִחַם выражает глубокое, нежное сострадание. Русское «сострадает» естественно передаёт смысл, не сводя его лишь к жалости.
- source_word: אָב
  choice: отец
  rationale: 'Существительное употреблено в обобщённом смысле: речь идёт не о конкретном отце, а о характерном отцовском отношении.'
- source_word: עַל
  choice: своим детям / тем, кто
  rationale: При глаголе רחם предлог עַל обозначает объект сострадания. В русском языке это отношение естественно выражается дательным падежом.
- source_word: בָּנִים
  choice: своим детям
  rationale: Форма мужского рода множественного числа здесь обозначает потомство в целом. «Детям» точно передаёт общий семейный смысл; «своим» естественно раскрывает отношение между отцом и детьми.
- source_word: רִחַם
  choice: сострадает
  rationale: Повтор того же русского глагола сохраняет поэтический параллелизм двух употреблений רחם. Настоящее время передаёт общее, неизменное положение, выраженное древнееврейской формой в данном контексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: יְרֵאָיו
  choice: тем, кто боится Его
  rationale: Причастная форма обозначает людей, для которых характерен страх перед Яхве. «Боится» прямо сохраняет смысл ירא и не ослабляет его до одного лишь почтения.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Родовое значение בָּנִים
  choice: детям
  alternative: сыновьям
  rationale: Хотя древнееврейская форма грамматически мужского рода, в данном сравнении она охватывает детей отца вообще. Перевод «детям» не сужает смысл только до лиц мужского пола.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формулировкой. Повтор «сострадает» сохраняет поэтический параллелизм оригинала; конструкция «тем, кто боится Его» звучит естественнее буквального субстантивированного оборота.
