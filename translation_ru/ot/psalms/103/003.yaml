lexical_decisions:
- source_word: הַסֹּלֵחַ
  choice: Он прощает
  rationale: Субстантивированное причастие с артиклем характеризует постоянное действие Господа. В контексте русского текста личная форма естественнее буквального «прощающий» и сохраняет связь с предшествующим упоминанием Господа.
- source_word: לְכָל
  choice: все
  rationale: Перед формами множественного числа передаёт полный, всеохватный объём действия без стилистической тяжеловесности.
- source_word: עֲוֺנֵכִי
  choice: твои беззакония
  rationale: עָוֹן охватывает смысловой круг проступка, вины и его последствий. «Беззакония» сохраняет нравственную весомость слова, а форма множественного числа соответствует еврейской форме.
- source_word: הָרֹפֵא
  choice: исцеляет
  rationale: Личная форма создаёт естественный русский параллелизм с «прощает» и точно передаёт действие רפא — исцелять.
- source_word: תַּחֲלֻאָיִכִי
  choice: твои болезни
  rationale: Существительное обозначает болезни или недуги. «Болезни» — ясный современный эквивалент, сохраняющий прямой телесный смысл и не исключающий более широкого поэтического прочтения.
theological_decisions:
- issue: Следует ли истолковывать исцеление исключительно духовно
  choice: Сохранено прямое «исцеляет все твои болезни» без уточнения характера болезней.
  alternative: «исцеляет все твои духовные болезни» или «избавляет от всех твоих немощей»
  rationale: Еврейское слово непосредственно обозначает болезнь, но поэтический контекст допускает более широкое богословское осмысление. Перевод не сужает смысл ни до исключительно телесного, ни до исключительно духовного исцеления.
- issue: Передача עָוֹן как проступка, вины или последствия греха
  choice: В основном тексте выбрано «беззакония», а другие оттенки отмечены в сноске.
  alternative: «вина» или «грехи»
  rationale: Слово способно обозначать как неправедный поступок, так и вину либо тягостное последствие. «Беззакония» сохраняет нравственную конкретность, а сноска удерживает подлинную смысловую широту.
translation_notes:
  register: Современный литературный русский язык с простым и торжественным параллелизмом. Личные формы «прощает / исцеляет» естественно продолжают обращение души к Господу в контексте псалма. Сохранена конечная запятая, поскольку стих входит в продолжающийся перечень Божьих благодеяний.
