lexical_decisions:
- source_word: שִׁגָּיוֹן
  choice: Шиггайон
  rationale: Редкий и неясный еврейский термин передан транслитерацией, чтобы сохранить его возможный музыкальный или поэтический характер и не закреплять спорное толкование.
- source_word: לְדָוִד
  choice: Давида
  rationale: Родительный падеж естественно передаёт краткую формулу надписания, сохраняя открытыми оттенки авторства, принадлежности или посвящения.
- source_word: אֲשֶׁר שָׁר
  choice: который он пел
  rationale: Прямая передача относительного оборота и формы прошедшего времени; глагол «пел» не добавляет значения прославления, которое могло бы подразумеваться словом «воспел».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя Бога передано как «Яхве», в соответствии с формой тетраграмматона в исходном тексте.
- source_word: עַל דִּבְרֵי
  choice: о словах
  rationale: Формально и естественно передаёт тему надписания, не уточняя без достаточных оснований, были ли это обвинения, дело или повод к песне.
- source_word: כּוּשׁ
  choice: Куша
  rationale: Личное имя транслитерировано в привычной русской библейской форме.
- source_word: בֶּן יְמִינִי
  choice: вениамитянина
  rationale: Идиоматическое обозначение человека из колена Вениамина передано естественным русским этнонимом.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; форма «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Связь Давида с псалмом
  choice: Давида
  alternative: для Давида; написанный Давидом
  rationale: Еврейский предлог ל допускает авторство, принадлежность или посвящение; краткая форма с родительным падежом не снимает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной формой псалмового надписания. Неясный технический термин сохранён транслитерацией; синтаксис остаётся понятным обычному читателю.
