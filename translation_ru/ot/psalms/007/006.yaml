  text: ק֘וּמָ֤/ה יְהוָ֨ה בְּ/אַפֶּ֗/ךָ הִ֭נָּשֵׂא בְּ/עַבְר֣וֹת צוֹרְרָ֑/י וְ/ע֥וּרָ/ה אֵ֝לַ֗/י מִשְׁפָּ֥ט צִוִּֽיתָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/006.yaml
  text: Rise up[a], O Yahweh, in your anger; lift yourself up against the fury of my enemies; awake for me[c][b]; you have appointed judgment.
translation:
  language: ru
  text: Восстань, Яхве, во гневе Твоём; поднимись против ярости врагов моих; пробудись ради меня — Ты постановил суд.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пробудись ради меня для суда, который Ты постановил». Еврейская фраза допускает различное синтаксическое членение.'
    reason: alternative_reading
lexical_decisions:
- source_word: קוּמָה
  choice: Восстань
  rationale: Повелительная форма קום призывает Бога выступить и начать действовать; «восстань» сохраняет поэтический образ и уместно в возвышенной молитвенной речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בְּאַפֶּךָ
  choice: во гневе Твоём
  rationale: אַף буквально означает «нос», но в данном устойчивом употреблении обозначает гнев.
- source_word: הִנָּשֵׂא
  choice: поднимись
  rationale: Нифаль повелительного наклонения от נשׂא продолжает образ решительного выступления Бога; русская возвратная форма естественно передаёт значение глагола.
- source_word: בְּעַבְרוֹת צוֹרְרָי
  choice: против ярости врагов моих
  rationale: עֶבְרָה обозначает сильную, переливающуюся через край ярость; предлог ב в контексте передан как направленность действия против вражеской ярости.
- source_word: וְעוּרָה אֵלַי
  choice: пробудись ради меня
  rationale: 'Сохранён антропоморфный поэтический императив, а אֵלַי истолковано бенефактивно: псалмопевец просит Бога действовать ради него; буквально возможно «ко мне».'
- source_word: מִשְׁפָּט צִוִּיתָ
  choice: Ты повелел совершить суд
  rationale: מִשְׁפָּט обозначает судебное действие или решение, а צוה обычно значит «повелевать». Добавлен инфинитив «совершить», чтобы по-русски естественно выразить эллиптическое сочетание, не устраняя его судебного смысла.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Антропоморфные повеления Богу
  choice: Сохранить образы «восстань», «поднимись», «пробудись»
  alternative: 'Передать обобщённо: «вмешайся» или «начни действовать»'
  rationale: Образный язык составляет риторическую силу молитвы и сам по себе не утверждает, будто Бог буквально спит или бездействует.
- issue: Синтаксис заключительных слов מִשְׁפָּט צִוִּיתָ
  choice: 'Самостоятельное утверждение: «Ты повелел совершить суд»'
  alternative: 'Связать с предыдущим повелением: «пробудись ради меня для суда, который Ты назначил»'
  rationale: Краткая еврейская конструкция допускает различное синтаксическое членение; основной текст сохраняет порядок и утвердительную силу заключения, а сноска отмечает альтернативную связь.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Инверсия «во гневе Твоём» и «врагов моих» поддерживает псалмический ритм, оставаясь понятной современному читателю. Прописные местоимения по отношению к Богу использованы как русская издательская конвенция, не как добавочное толкование.
