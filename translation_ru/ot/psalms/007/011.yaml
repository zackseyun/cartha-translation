  text: אֱ֭לֹהִים שׁוֹפֵ֣ט צַדִּ֑יק וְ֝/אֵ֗ל זֹעֵ֥ם בְּ/כָל יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/011.yaml
  text: God is a righteous judge[b][a], and a God who is indignant every day.
translation:
  language: ru
  text: Бог — праведный судья[a], и Бог негодует каждый день[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог судит праведника».'
    reason: Грамматически צַדִּיק можно понять не как характеристику судьи, а как объект причастия שׁוֹפֵט; это понимание менее вероятно в данном контексте.
  - marker: b
    text: 'Или: «гневается».'
    reason: זֹעֵם допускает более прямую передачу словом «гневается».
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Хотя форма морфологически множественная, здесь она обозначает единого Бога и сочетается с формой единственного числа.
- source_word: שׁוֹפֵט צַדִּיק
  choice: праведный Судья
  rationale: 'Причастие שׁוֹפֵט понято предикативно как обозначение Судьи, а צַדִּיק — как характеристика Его праведности. В сноске сохранён грамматически возможный вариант, где צַדִּיק выступает объектом: «судит праведника».'
- source_word: וְאֵל
  choice: и Бог
  rationale: Союз וְ передан явно, а אֵל в данном параллелизме продолжает говорить о Боге; повтор сохраняет структуру еврейского текста и естественно звучит в торжественной поэтической речи.
- source_word: זֹעֵם
  choice: негодует
  rationale: Причастие выражает продолжающееся нравственно обусловленное Божье недовольство. «Негодует» точнее передаёт этот оттенок, чем более общее «гневается», которое приведено в сноске.
- source_word: בְּכָל יוֹם
  choice: каждый день
  rationale: Оборот указывает на регулярность — «каждый день», а не обязательно на непрерывность в течение всего дня.
theological_decisions:
- issue: Высказывание о Божьем гневе
  choice: Бог негодует каждый день
  alternative: Бог гневается каждый день
  rationale: Перевод прямо сохраняет утверждение текста о постоянном Божьем негодовании, не смягчая богословское напряжение; вариант с «гневается» отмечен как допустимый лексический эквивалент.
- issue: Синтаксис первой части стиха
  choice: Бог — праведный Судья
  alternative: Бог судит праведника
  rationale: Наиболее естественно צַדִּיק характеризует Бога как праведного Судью, однако еврейская последовательность допускает понимание слова как объекта действия, поэтому альтернативу важно сохранить в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным поэтическим звучанием. Повтор слова «Бог» сохраняет еврейский параллелизм и союз; прописная буква в слове «Судья» подчёркивает употребление как именования Бога.
