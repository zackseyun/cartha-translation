  text: if I have repaid the one at peace with me with evil[a], or delivered my enemy for nothing—
translation:
  language: ru
  text: 'если я отплатил злом тому, кто живёт со мной в мире,

    или спас своего врага без всякой причины[a], —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «или без причины ограбил (обобрал) своего врага». Еврейский глагол может означать «избавил, спас», но в данном контексте его также понимают в смысле лишения имущества; значение и синтаксическая связь слов «без всякой причины» спорны.'
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: если
  rationale: Вводит условную часть самообязывающей клятвы; русское «если» естественно сохраняет незавершённость конструкции, продолжающейся в следующем стихе.
- source_word: גָּמַלְתִּי
  choice: я отплатил
  rationale: Передаёт значение воздаяния или ответного поступка и естественно сочетается с «злом».
- source_word: שׁוֹלְמִי
  choice: тому, кто был со мной в мире
  rationale: Буквально и ясно передаёт человека, состоявшего с говорящим в мирных отношениях, не сужая смысл до друга или формального союзника.
- source_word: רָע
  choice: злом
  rationale: Сохраняет нравственную силу еврейского слова и в русском языке естественно оформляет содержание воздаяния.
- source_word: וָאֲחַלְּצָה
  choice: или … ограбил
  rationale: В основном тексте выбран засвидетельствованный контекстуальный смысл лишения имущества или добычи; союз «или» естественно связывает два возможных проступка в условной клятве.
- source_word: צוֹרְרִי
  choice: своего врага
  rationale: Передаёт враждебно настроенного противника ясным современным словом; возвратное местоимение естественно указывает на говорящего.
- source_word: רֵיקָם
  choice: без причины
  rationale: В основном прочтении наречие характеризует враждебный поступок как совершённый без основания.
theological_decisions:
- issue: Смысл וָאֲחַלְּצָה צוֹרְרִי רֵיקָם
  choice: «или без причины ограбил своего врага»
  alternative: «хотя я спас того, кто без причины враждовал со мной»
  rationale: Глагол обычно может означать «извлечь, избавить, спасти», но допускает связанный смысл снятия или лишения, откуда «ограбить». Последнее создаёт параллель двух отрицаемых злых поступков. Положительное прочтение «спас» лексически весомо и потому сохранено в примечании; при нём רֵיקָם относится к необоснованной вражде противника.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формой. Синтаксическая незавершённость и тире сохранены, поскольку условная клятва продолжается в следующем стихе.
