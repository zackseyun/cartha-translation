  text: And let the assembly of peoples surround you[b][a]; and over them return on high.
translation:
  language: ru
  text: Пусть собрание народов[a] окружит Тебя, а над ним[b] возвратись на высоту.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «племён».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст говорит о собрании как о едином целом; по смыслу также возможно: «над ними», то есть над собравшимися народами.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֲדַת
  choice: собрание
  rationale: Существительное обозначает собравшуюся группу. «Собрание» естественно передаёт коллективный смысл и не вносит лишней конфессиональной окраски.
- source_word: לְאֻמִּים
  choice: народов
  rationale: Множественное число обозначает народы или этнические общности. «Народов» точно и естественно передаёт распределительное значение.
- source_word: תְּסוֹבְבֶךָּ
  choice: пусть окружит Тебя
  rationale: Форма от סבב означает «окружать». В контексте её лучше понимать как пожелание или молитвенное побуждение, а не как простое будущее время.
- source_word: וְעָלֶיהָ
  choice: над ним
  rationale: Местоименный суффикс имеет форму женского рода единственного числа и грамматически отсылает к собранию как к единому целому. Русское «над ним» сохраняет это согласование и пространственный образ.
- source_word: לַמָּרוֹם
  choice: ввысь
  rationale: מָרוֹם обозначает высоту или возвышенное место. «Ввысь» сохраняет поэтический пространственный образ, не добавляя прямо не выраженной лексики престола или небес.
- source_word: שׁוּבָה
  choice: возвратись
  rationale: Это повелительная форма глагола שוב — «возвращаться, обращаться назад». «Возвратись» передаёт прямое молитвенное обращение без дополнительного толкования.
theological_decisions:
- issue: Изображает ли стих возвращение Бога к возвышенному месту суда и владычества или буквальное движение вверх
  choice: 'Сохранено поэтическое прошение: Бог должен возвратиться ввысь над собранием народов.'
  alternative: 'Просьба буквально взойти на небеса над собранием либо утверждение о будущем действии: «возвратишься».'
  rationale: Повелительная форма שׁוּבָה поддерживает прочтение как прошения. «Ввысь» сохраняет образ возвышенного положения, не уточняя сверх текста, идёт ли речь о престоле, небесах или буквальном движении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Молитвенное побуждение передано конструкцией «пусть…» и императивом «возвратись»; сохранены лаконизм и пространственная образность еврейского текста.
