  text: מָֽגִנִּ֥/י עַל אֱלֹהִ֑ים מ֝וֹשִׁ֗יעַ יִשְׁרֵי לֵֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/010.yaml
  text: My shield is with God[b][a], who saves the upright in heart.
translation:
  language: ru
  text: 'Мой щит — у Бога[a],

    спасающего тех, чьё сердце право.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог — мой щит». Еврейская фраза кратка и допускает такое истолкование.'
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנִּי
  choice: Мой щит
  rationale: Сохранён конкретный образ щита, а не заменён отвлечёнными словами «защита» или «защитник».
- source_word: עַל אֱלֹהִים
  choice: в Боге
  rationale: Краткая русская формулировка передаёт мысль о том, что защита псалмопевца находится в Боге. Она сохраняет необычное построение еврейской фразы, не превращая его без пояснения в более истолковывающую формулу «Бог — мой щит».
- source_word: מוֹשִׁיעַ
  choice: спасающем
  rationale: Причастие описывает характерное действие Бога и естественно согласуется в русском с оборотом «в Боге».
- source_word: יִשְׁרֵי לֵב
  choice: тех, чьё сердце право
  rationale: Формулировка сохраняет нравственный смысл ישר («прямой, правый») и образ сердца как внутреннего человека; она понятнее современному читателю, чем буквальное «правых сердцем».
theological_decisions:
- issue: Синтаксическая связь первой части стиха
  choice: «Мой щит — в Боге»
  alternative: «Бог — мой щит»
  rationale: В еврейском тексте нет выраженной связки, а сочетание מָגִנִּי עַל אֱלֹהִים допускает несколько способов истолкования. Основной текст близко передаёт компактную исходную конструкцию и указывает, что защита псалмопевца обретается в Боге; более гладкое отождествление вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Разбивка на две строки отражает две смысловые части стиха.
