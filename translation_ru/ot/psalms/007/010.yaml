  source_fidelity: '«В Боге» передаёт зависимость/опору, однако для עַל в этой компактной и синтаксически спорной конструкции это слишком конкретное смысловое уточнение: по-русски оно также может вызвать оттенок пребывания «в Боге». Формулировка «у Бога» лучше сохраняет неразвёрнутую связь первого колона, не отождествляя прямо Бога со щитом.'
