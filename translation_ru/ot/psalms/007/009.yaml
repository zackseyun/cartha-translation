    reason: Поясняет непривычный современному русскому читателю буквальный образ כְלָיוֹת, не устраняя его из основного текста.
lexical_decisions:
- source_word: יִגְמָר נָא
  choice: Пусть прекратится
  rationale: 'Передаёт желательное значение формы с частицей נָא: это настойчивая просьба, а не простое предсказание.'
- source_word: רַע רְשָׁעִים
  choice: зло нечестивых
  rationale: Сохраняет различие между злом как явлением и совершающими его нечестивыми людьми.
- source_word: וּתְכוֹנֵן צַדִּיק
  choice: а праведника утверди
  rationale: Глагол כון в данной породе означает сделать твёрдым, укрепить, утвердить; единственное число צַדִּיק сохранено.
- source_word: לִבּוֹת וּכְלָיוֹת
  choice: сердца и почки
  rationale: 'Сохранён конкретный древнееврейский образ: сердце и почки обозначают сокровенную внутреннюю жизнь человека, включая мысли, побуждения и чувства.'
- source_word: אֱלֹהִים צַדִּיק
  choice: праведный Бог
  rationale: Сохранены существительное и определение без добавления конфессионально обусловленной терминологии.
theological_decisions:
- issue: Синтаксическая связь заключительных слов о Боге
  choice: «праведный Бог, испытывающий…» прочитано как обращение, продолжающее просьбу
  alternative: «Праведный Бог испытывает сердца и почки» как самостоятельное утверждение
  rationale: Еврейская именная конструкция допускает сжатое декларативное прочтение, однако обращение естественно связывается с предшествующим повелительным «утверди». В основном тексте не добавлены причинные союзы вроде «ведь», которые окончательно устранили бы неоднозначность.
- issue: Антропологический образ «почек»
  choice: Сохранить «почки» в тексте и пояснить образ в сноске
  alternative: Заменить на «внутренность», «разум» или «помыслы»
  rationale: Буквальный образ является значимой частью древнееврейского представления о глубочайших чувствах и мотивах; его замена одним абстрактным понятием сузила бы смысл.
