lexical_decisions:
- source_word: פֶּן
  choice: чтобы… не
  rationale: Естественно вводит по-русски опасаемое последствие, сохраняя отрицательное значение еврейской частицы.
- source_word: יִטְרֹף
  choice: растерзал
  rationale: Глагол описывает действие хищника над добычей; «растерзал» точно и выразительно передаёт этот образ.
- source_word: כְּאַרְיֵה
  choice: словно лев
  rationale: Сохраняет прямое сравнение, выраженное еврейским префиксом כְּ־.
- source_word: נַפְשִׁי
  choice: меня
  rationale: В данном контексте נֶפֶשׁ обозначает самого человека, его жизнь, находящуюся под угрозой; «меня» звучит естественно и не сужает смысл до нематериальной души.
- source_word: פֹּרֵק
  choice: разрывая на части
  rationale: Причастие развивает образ нападения льва и подчёркивает полное уничтожение жертвы.
- source_word: וְאֵין מַצִּיל
  choice: и некому спасти
  rationale: Кратко и естественно передаёт отсутствие того, кто мог бы избавить псалмопевца от опасности.
