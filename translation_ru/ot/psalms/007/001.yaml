  yaml_path: translation/ot/psalms/007/001.yaml
  text: O Yahweh my God[a], in you I have taken refuge; save me from all who pursue me, and deliver me.
translation:
  language: ru
  text: Яхве, Боже мой, у Тебя я нашёл убежище[a]. Спаси меня от всех, кто гонится за мной, и избавь меня.
  philosophy: optimal-equivalence
  footnotes:
