lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма общеупотребительна в современной библеистике.
- source_word: אֱלֹהַי
  choice: Бог мой
  rationale: Форма с суффиксом первого лица единственного числа означает «мой Бог»; в русском обращении естествен и торжествен порядок «Бог мой».
- source_word: בְּךָ
  choice: На Тебя
  rationale: При глаголе חסה русское «уповать на» естественно передаёт доверие и поиск защиты; значения «только» в еврейском тексте нет.
- source_word: חָסִיתִי
  choice: я уповаю
  rationale: Перфект первого лица от חסה обозначает поиск убежища и доверие защите. В молитвенном контексте настоящее время естественно выражает состояние, сохраняющееся в момент речи.
- source_word: הוֹשִׁיעֵנִי
  choice: Спаси меня
  rationale: Императив породы hифиль от ישׁע прямо выражает просьбу о спасении.
- source_word: מִכָּל רֹדְפַי
  choice: от всех, кто гонится за мной
  rationale: Причастие с суффиксом обозначает тех, кто продолжает преследовать молящегося; придаточная конструкция сохраняет глагольную динамику.
- source_word: וְהַצִּילֵנִי
  choice: и избавь меня
  rationale: Императив породы hифиль от נצל передаёт избавление от опасности и сохраняет некоторое отличие от предшествующего «спаси».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом; «Иегова» основано на позднем смешении согласных тетраграмматона с огласовкой замещающего чтения.
- issue: Временное значение חָסִיתִי
  choice: я уповаю
  alternative: я нашёл убежище; я прибегнул под защиту
  rationale: Еврейский перфект допускает указание как на совершённое обращение за защитой, так и на его нынешнюю значимость. В молитвенном контексте русское настоящее передаёт продолжающееся доверие, а сноска сохраняет аспектуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Прописная буква в «Тебя» отражает принятую русскую традицию уважительного обращения к Богу. Пара «спаси — избавь» сохраняет параллелизм и различие двух еврейских глаголов.
