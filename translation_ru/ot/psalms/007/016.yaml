    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּב
  choice: обратится
  rationale: Форма глагола שׁוב передаёт возвращение содеянного к самому нечестивцу; «обратится» естественно выражает возвратное действие и поэтическое воздаяние.
- source_word: עֲמָלוֹ
  choice: его злодеяние
  rationale: עָמָל может означать тяготу, беду или причиняющее вред злодеяние. В контексте замысленного зла «злодеяние» ясно обозначает нравственно предосудительное действие, не сводя слово к нейтральному труду.
- source_word: בְרֹאשׁוֹ
  choice: на его же голову
  rationale: Русское устойчивое выражение передаёт последствия, возвращающиеся к самому виновнику; частица «же» естественно подчёркивает рефлексивный смысл.
- source_word: וְעַל
  choice: и ... на
  rationale: Сохраняет сочинительную связь и параллелизм двух строк.
- source_word: קָדְקֳדוֹ
  choice: ему на темя
  rationale: קָדְקֹד обозначает верхнюю часть головы, темя. Этот выбор точнее анатомически и поэтичнее, чем «череп», и сохраняет усиление параллельного образа.
- source_word: חֲמָסוֹ
  choice: его насилие
  rationale: חָמָס обычно означает насилие, жестокость или насильственную неправду; прямой эквивалент сохраняет силу и нравственную окраску исходного слова.
- source_word: יֵרֵד
  choice: падёт
  rationale: Глагол ירד буквально описывает движение вниз. В русском сочетание «падёт на темя» естественно сохраняет вертикальный образ и смысл воздаяния.
theological_decisions:
- issue: Образ воздаяния за зло
  choice: Собственное злодеяние и насилие нечестивца возвращаются на него самого.
  alternative: Можно понять עָמָל шире как беду или тяготу, которая возвращается к человеку.
  rationale: Параллельные образы возвращения на голову и нисхождения на темя в контексте псалма выражают поэтическую справедливость, но перевод не добавляет утверждений о механизме или сроках воздаяния.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма. «Злодеяние» и «насилие» передают нравственную направленность контекста, а «голова» и «темя» воспроизводят усиленный телесный образ исходного текста.
