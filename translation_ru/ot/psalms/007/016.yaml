  text: Его зло вернётся на его же голову[a], и на его темя[b] сойдёт его насилие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его беда возвратится на его же голову». Еврейское עָמָל может означать беду, причинённый вред или злое деяние.'
