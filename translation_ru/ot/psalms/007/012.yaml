  text: אִם לֹ֣א יָ֭שׁוּב חַרְבּ֣/וֹ יִלְט֑וֹשׁ קַשְׁתּ֥/וֹ דָ֝רַ֗ךְ וַֽ/יְכוֹנְנֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/012.yaml
  text: If he does not turn back[a], he will sharpen his sword[c][b]; he has bent his bow and made it ready.
translation:
  language: ru
  text: Если он не обратится[a], он наточит свой меч[b]; он натянул свой лук и приготовил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не покается», «не повернёт назад». Еврейский глагол означает «возвратиться, обратиться» и в этом контексте может подразумевать покаяние.'
    reason: lexical_alternative
  - marker: b
    text: Субъект глаголов во второй части стиха прямо не назван. В контексте вероятнее всего имеется в виду Бог, готовящий оружие суда против нераскаявшегося человека; возможно также, хотя менее вероятно, что речь по-прежнему идёт о нечестивом, готовящем собственное оружие.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם לֹא
  choice: Если ... не
  rationale: Прозрачно сохраняет условную конструкцию еврейского текста.
- source_word: יָשׁוּב
  choice: не обратится
  rationale: Глагол שׁוב означает «повернуть назад, возвратиться» и в данном контексте может подразумевать покаяние; «обратится» сохраняет оба оттенка естественнее, чем узкое «покается».
- source_word: חַרְבּוֹ יִלְטוֹשׁ
  choice: наточит Свой меч
  rationale: יִלְטוֹשׁ обозначает затачивание клинка; будущее время соответствует форме глагола и условной конструкции.
- source_word: קַשְׁתּוֹ דָרַךְ
  choice: натянул Свой лук
  rationale: В сочетании с луком דרך идиоматически означает привести его в состояние готовности, натянув тетиву; это естественный современный русский оборот.
- source_word: וַיְכוֹנְנֶהָ
  choice: и приготовил его
  rationale: Глагол передаёт приведение лука в готовность; местоимение относится к слову «лук» и потому по-русски имеет мужской род.
theological_decisions:
- issue: К кому относятся местоимения третьего лица
  choice: Строчное «он» в условии относится к нечестивому, а прописные «Он/Свой» далее — к Богу как Судье.
  alternative: Все местоимения могут быть поняты как относящиеся к нечестивому, который готовит собственное оружие.
  rationale: Ближайший контекст представляет Бога праведным Судьёй, готовящим орудия суда, если нечестивый не обратится. Однако в самом еврейском стихе подлежащее прямо не названо, поэтому альтернативное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Прописные местоимения помогают передать основное контекстуальное прочтение, а сноска сохраняет подлинную неоднозначность еврейского текста.
