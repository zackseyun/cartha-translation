source:
  edition: WLC
  text: יִֽרַדֹּ֥ף אוֹיֵ֨ב נַפְשִׁ֡/י וְ/יַשֵּׂ֗ג וְ/יִרְמֹ֣ס לָ/אָ֣רֶץ חַיָּ֑/י וּ/כְבוֹדִ֓/י לֶ/עָפָ֖ר יַשְׁכֵּ֣ן סֶֽלָה׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/005.yaml
  text: let the enemy pursue my life and overtake it[a]; let him trample my life to the ground and make my glory dwell in the dust[b]. Selah
translation:
  language: ru
  text: Пусть враг преследует меня[a] и настигнет; пусть втопчет мою жизнь в землю и повергнет мою славу в прах[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мою душу» или «мою жизнь». Еврейское נַפְשִׁי может обозначать самого человека, его душу или жизнь — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мою честь» или «моё достоинство».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרַדֹּף
  choice: пусть преследует
  rationale: Форма передаёт желательное, клятвенно-самоосуждающее значение в связи с условием предыдущего стиха; «преследует» естественно выражает образ погони.
- source_word: אוֹיֵב
  choice: враг
  rationale: Существительное стоит в единственном числе без артикля; русское «враг» естественно сохраняет обобщённость и не требует искусственного неопределённого местоимения.
- source_word: נַפְשִׁי
  choice: меня
  rationale: Здесь נֶפֶשׁ обозначает самого человека, которого преследуют; объектное «меня» передаёт это естественнее, не навязывая противопоставления души и тела.
- source_word: וְיַשֵּׂג
  choice: и настигнет
  rationale: Глагол означает догнать или настичь и продолжает образ преследования.
- source_word: וְיִרְמֹס
  choice: пусть втопчет
  rationale: Передаёт сильный образ попрания ногами и сохраняет желательное значение ряда глаголов.
- source_word: לָאָרֶץ
  choice: в землю
  rationale: В сочетании с «втопчет» это естественный русский эквивалент буквального «к земле/в землю».
- source_word: חַיָּי
  choice: мою жизнь
  rationale: Формально множественное חַיִּים здесь идиоматически означает жизнь.
- source_word: וּכְבוֹדִי
  choice: мою славу
  rationale: «Слава» сохраняет поэтическую широту כָּבוֹד, которое также может означать честь или достоинство.
- source_word: לֶעָפָר
  choice: в прах
  rationale: «Прах» сохраняет поэтический образ унижения и смерти.
- source_word: יַשְׁכֵּן
  choice: повергнет
  rationale: Каузатив глагола буквально означает «поселит, заставит пребывать»; в русском «повергнет ... в прах» естественно передаёт результат действия, тогда как буквальное «поселит» звучало бы неясно.
- source_word: סֶלָה
  choice: Села
  rationale: Сохранена традиционная транслитерация, поскольку точное значение термина не установлено.
theological_decisions:
- issue: Антропологический смысл נַפְשִׁי
  choice: меня
  alternative: мою душу / мою жизнь
  rationale: Контекст говорит о преследовании человека и не требует понимания נֶפֶשׁ как отдельной нематериальной части; местоимение сохраняет значение целостной личности. Лексическая широта отмечена в сноске.
- issue: Смысл כְבוֹדִי в поэтическом самообозначении
  choice: мою славу
  alternative: мою честь / моё достоинство
  rationale: «Слава» сохраняет метафорическую насыщенность и не сужает значение до общественной репутации; возможные значения указаны в сноске.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Параллелизм и нарастание образов сохранены; «Села» оставлено без перевода ввиду неопределённости значения.
