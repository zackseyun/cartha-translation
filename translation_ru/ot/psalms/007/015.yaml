lexical_decisions:
- source_word: בּוֹר
  choice: яма
  rationale: В контексте ловушки слово обозначает выкопанную яму; более узкое «колодец» здесь неуместно.
- source_word: כָּרָה
  choice: вырыл
  rationale: Передаёт конкретное действие копания естественным современным русским глаголом.
- source_word: וַיַּחְפְּרֵהוּ
  choice: углубил её
  rationale: Второй глагол копания развивает образ и, вероятно, указывает на дальнейшее выкапывание; перевод сохраняет нарастание без тяжеловесного повтора.
- source_word: וַיִּפֹּל
  choice: и сам упал
  rationale: «Упал» прямо передаёт נפל, а «сам» естественно подчёркивает поэтическую иронию, имплицитную в исходной строке.
- source_word: שַׁחַת
  choice: западня
  rationale: В данном образе это выкопанная ловушка; «западня» различает שׁחת и בור, сохраняя конкретный смысл и избегая повтора слова «яма».
- source_word: יִפְעָל
  choice: устроил
  rationale: Контекстуально передаёт то, что человек подготовил или сделал ловушку; по-русски естественно сочетается со словом «западня».
