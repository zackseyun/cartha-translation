lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, сохраняя его отличие от титула «Господь».
- source_word: אֱלֹהַי
  choice: Бог мой
  rationale: Форма с суффиксом первого лица единственного числа означает «мой Бог»; порядок слов сохраняет возвышенный характер прямого обращения и естественен для русской поэзии.
- source_word: אִם
  choice: если
  rationale: Частица вводит условные положения самообвинительной клятвы, продолжение которой следует далее.
- source_word: עָשִׂיתִי זֹאת
  choice: я сделал это
  rationale: Точно передаёт перфект Qal первого лица и указательное местоимение, не конкретизируя намеренно неопределённое «это».
- source_word: יֶשׁ
  choice: есть
  rationale: Естественный русский эквивалент экзистенциальной частицы.
- source_word: עָוֶל
  choice: неправда
  rationale: В данном контексте обозначает нравственную неправоту, несправедливость или виновность; «неправда» сохраняет широту значения и соответствует стилю псалма.
- source_word: בְּכַפָּי
  choice: на руках моих
  rationale: Сохраняет еврейский образ ладоней/рук как сферы совершённого человеком деяния и возможной вины; русское «на руках» естественно выражает лежащую на человеке ответственность.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому личное имя передано непосредственно, а не заменено титулом.
- issue: Характер заявления псалмопевца
  choice: Условное заявление о невиновности
  alternative: Безусловное утверждение собственной безгрешности
  rationale: Повторение אִם вводит условия самообвинительной клятвы; стих не утверждает всеобщую или абсолютную безгрешность говорящего.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим библейским строем. Инверсия «Бог мой» и «на руках моих» придаёт достоинство и сохраняет параллелизм, оставаясь понятной современному читателю. Тире отражает незавершённость условия, продолжающегося в следующем стихе.
