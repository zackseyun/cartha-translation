    rationale: 'В современном литературном русском «мучиться родами» звучит ненормативно, а родительный падеж в «родами беззакония» создаёт неясность: беззаконие оказывается как будто субъектом или результатом родов. Нужна формулировка, в которой «беззаконие» остаётся тем, с чем он мучительно трудится/мается, при сохранении родового образа.'
  - severity: low
    issue: Неточность альтернативы в сноске «трудится над».
    rationale: Это выражение по-русски обычно не имеет значения родовых мук или мучительного труда; лучше дать альтернативы, непосредственно отражающие «корчится в родовых муках» и «мучительно трудится».
