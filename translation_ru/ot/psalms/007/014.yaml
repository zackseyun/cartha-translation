lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Междометие привлекает внимание к яркому образу; «вот» естественно и выразительно в современном литературном русском.
- source_word: יְחַבֶּל
  choice: мучится родами
  rationale: Глагол передаёт родовые муки, тяжёлое мучительное усилие. Выбор сохраняет исходный образ и необычную последовательность действий, не подменяя этот глагол зачатием.
- source_word: אָוֶן
  choice: беззакония
  rationale: Слово сочетает значения нравственного зла, неправды и бедствия. «Беззаконие» подчёркивает нравственный смысл и отличает его от следующего עָמָל.
- source_word: הָרָה
  choice: зачинает
  rationale: Глагол прямо относится к зачатию или беременности. «Зачинает» позволяет кратко сохранить сжатую образность еврейской строки.
- source_word: עָמָל
  choice: беду
  rationale: В данном контексте слово обозначает пагубу, тяготу или бедствие, возникающее из злого замысла; «беда» звучит естественно и сохраняет смысловую широту.
- source_word: יָלַד שָׁקֶר
  choice: рождает ложь
  rationale: Выражение завершает образ деторождения; буквальная и естественная русская формулировка сохраняет нравственный итог описанного процесса.
