  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте наслаиваются образы родовых мук, зачатия и рождения. Первый глагол можно также передать как «корчится в родовых муках» или «мучительно трудится»; значения слов «беззаконие» и «беда» частично пересекаются.
