source:
  edition: WLC
  text: אוֹדֶ֣ה יְהוָ֣ה כְּ/צִדְק֑/וֹ וַ֝/אֲזַמְּרָ֗ה שֵֽׁם יְהוָ֥ה עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/017.yaml
  text: I will give thanks to Yahweh according to his righteousness[a], and I will sing praise to the name of Yahweh Most High.
translation:
  language: ru
  text: Возблагодарю Яхве за Его праведность[a] и воспою имя Яхве Всевышнего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «согласно Его праведности»; слово также может означать «справедливость» или «правосудие».'
    reason: Еврейское כְּצִדְקוֹ допускает оттенки основания или соответствия, а צדק охватывает праведность и справедливость.
lexical_decisions:
- source_word: אוֹדֶה
  choice: возблагодарю
  rationale: В породе hифиль глагол ידה в псалмах обычно означает благодарить или прославлять. «Возблагодарю» естественно передаёт обращённую к Богу благодарственную хвалу и сохраняет возвышенный поэтический регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона транслитерацией сохраняет личное Божье имя, присутствующее в еврейском тексте, вместо замены его титулом.
- source_word: כְּצִדְקוֹ
  choice: за Его праведность
  rationale: Предлог כְ допускает смысл соответствия («согласно») и основания хвалы («за», «по причине»). В русском «за Его праведность» естественно выражает причину благодарения; возможный оттенок справедливого суда отмечен в сноске.
- source_word: וַאֲזַמְּרָה
  choice: и воспою
  rationale: Форма имеет волитивный оттенок и обозначает хвалебное пение, нередко с музыкальным сопровождением. «Воспою» кратко и уместно для современной литературной библейской поэзии.
- source_word: שֵׁם
  choice: имя
  rationale: Буквальная передача сохраняет библейское значение явленной личности, славы и репутации Бога без излишнего истолкования.
- source_word: עֶלְיוֹן
  choice: Всевышнего
  rationale: Божественный титул עֶלְיוֹן естественно передаётся как «Всевышний». Родительный падеж связывает титул с оборотом «имя Яхве» без добавления отсутствующего в еврейском слова «Бог».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст дважды прямо употребляет тетраграмматон. «Яхве» сохраняет личное имя и не подменяет его титулом; «Иегова» отражает более позднюю традиционную форму.
- issue: Значение צדק применительно к Богу
  choice: праведность
  alternative: справедливость; правосудие
  rationale: צדק охватывает как нравственную правоту, так и справедливое действие или суд. Основной текст сохраняет более широкое «праведность», а судебный оттенок указывается в сноске.
- issue: Смысл предлога כְ в כְּצִדְקוֹ
  choice: за Его праведность
  alternative: согласно Его праведности
  rationale: В контексте заключительной хвалы естественно понимать Божью праведность как основание благодарения. Однако формальное значение соответствия остаётся возможным и не исключается сноской.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Формы «возблагодарю» и «воспою» слегка возвышенны, но понятны; синтаксис краток и естественен. Местоимение «Его» написано с прописной буквы в соответствии с распространённой русской библейской издательской традицией.
