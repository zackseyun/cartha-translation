  text: And for him he has prepared weapons of death[a]; he makes his arrows fiery.
translation:
  language: ru
  text: И для него Он приготовил смертоносные орудия; Свои стрелы Он делает огненными[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Свои стрелы Он готовит для преследователей» либо «против преследователей». Еврейское слово можно связать не с горением, а с преследованием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹו
  choice: И для него
  rationale: 'Предлог ל с местоименным суффиксом естественно передаёт адресата: орудия приготовлены для нечестивого, о котором говорится в контексте. Перевод не превращает выражение в возвратное «для Себя».'
- source_word: הֵכִין
  choice: приготовил
  rationale: Порода hифиль глагола כון означает «приготовить, привести в готовность». Совершенный вид передаёт завершённость действия.
- source_word: כְּלֵי מָוֶת
  choice: смертоносные орудия
  rationale: כְּלִי может обозначать орудие или оружие; ближайшее упоминание стрел задаёт военный образ. Прилагательное «смертоносные» естественно передаёт еврейскую конструкцию «орудия смерти».
- source_word: חִצָּיו
  choice: Свои стрелы
  rationale: Передаёт существительное во множественном числе с суффиксом третьего лица; возвратное «Свои» в русском ясно соотносит стрелы с действующим лицом.
- source_word: לְדֹלְקִים
  choice: огненными
  rationale: Корень דלק допускает значение горения и значение преследования. В сочетании со стрелами «огненными» создаёт понятный военный образ зажигательных стрел, а иной разбор сохранён в примечании.
- source_word: יִפְעָל
  choice: делает
  rationale: Qal глагола פעל имеет общее значение «делать, создавать». В конструкции со стрелами настоящее время сохраняет незавершённую форму и поэтическую непосредственность.
theological_decisions:
- issue: Явно ли обозначать Бога как действующее лицо
  choice: Местоимение «Он» добавлено и написано с прописной буквы по контексту предыдущего стиха
  alternative: 'Оставить субъект невыраженным: «для него приготовил»'
  rationale: Личные формы глагола и суффикс у «стрел» указывают на одно действующее лицо, которым в контексте является Бог. Местоимение необходимо для естественного русского синтаксиса и не изменяет участников сцены.
translation_notes:
  register: Современный литературный русский с краткой, напряжённой поэтической фразой. Сохранены военный образ, смена глагольного вида и лексическая неоднозначность последнего оборота.
