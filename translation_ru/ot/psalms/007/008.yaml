source:
  edition: WLC
  text: יְהוָה֮ יָדִ֪ין עַ֫מִּ֥ים שָׁפְטֵ֥/נִי יְהוָ֑ה כְּ/צִדְקִ֖/י וּ/כְ/תֻמִּ֣/י עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/007/008.yaml
  text: Yahweh judges the peoples[a]; judge me, O Yahweh[c][b], according to my righteousness and according to my integrity that is upon me.
translation:
  language: ru
  text: 'Яхве судит народы;

    суди меня, Яхве[a], по моей праведности

    и по моей непорочности, которая во мне[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оправдай меня, Яхве». Просьба «суди меня» может означать просьбу вынести благоприятный приговор и подтвердить правоту.'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «которая на мне».'
    reason: literal_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
- source_word: יָדִין
  choice: судит
  rationale: Имперфект здесь естественно понимать как выражение постоянного, характерного действия; настоящее время также сохраняет связь со следующим повелением.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число обозначает человеческие народы или группы людей; «народы» — естественный и точный русский эквивалент.
- source_word: שָׁפְטֵנִי
  choice: суди меня
  rationale: Сохраняет прямое судебное значение глагола שפט и его связь с יָדִין; в контексте просьба может подразумевать благоприятный приговор, что отмечено в сноске.
- source_word: כְּצִדְקִי
  choice: по моей праведности
  rationale: Передаёт нормативное значение предлога כ и сохраняет прямое утверждение псалмопевца о собственной праведности в рассматриваемом деле.
- source_word: וּכְתֻמִּי
  choice: и по моей непорочности
  rationale: תֻּם обозначает цельность, безупречность или непорочность. «Непорочность» уместна в возвышенной поэзии и не требует понимания как утверждения абсолютной безгрешности.
- source_word: עָלָי
  choice: которая во мне
  rationale: Буквальное «на мне» в русском здесь неестественно. «Во мне» передаёт принадлежность названного качества говорящему; буквальный образ сохранён в сноске.
theological_decisions:
- issue: Подразумевает ли заявление псалмопевца абсолютную безгрешность
  choice: Прямо сохранить выражения «моя праведность» и «моя непорочность» как ситуативное обращение к Божьему суду.
  alternative: Смягчить текст до «правота моего дела» или «моя невиновность в этом деле».
  rationale: Еврейский текст прямо говорит о «моей праведности» и «моей непорочности». Перевод сохраняет богословское напряжение и не добавляет ни абсолютной безгрешности, ни ограничивающего пояснения, отсутствующего в стихе.
- issue: Судебный смысл просьбы שָׁפְטֵנִי
  choice: Оставить в основном тексте «суди меня».
  alternative: Передать как «оправдай меня» или «защити мою правоту».
  rationale: Контекст допускает просьбу о благоприятном решении, однако нейтральное «суди» точнее сохраняет форму и напряжение исходного текста; возможный смысл указан в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Параллелизм и судебная лексика оригинала сохранены; неестественное русское «непорочность на мне» вынесено в буквальную сноску.
