source:
  edition: WLC
  text: לַ֭/מְנַצֵּחַ עַל שׁוּשַׁ֣ן עֵד֑וּת מִכְתָּ֖ם לְ/דָוִ֣ד לְ/לַמֵּֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/000.yaml
  text: 'For the choirmaster: according to “Lily of Testimony.”[a] A miktam[b] of David[c], for teaching when he fought against Aram-naharaim and Aram-zobah, and Joab returned and struck down twelve thousand of Edom in the Valley of Salt.'
translation:
  language: ru
  text: Руководителю хора. На мотив «Лилия свидетельства».[a] Миктам[b] Давида,[c] для наставления.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «по „Лилии свидетельства“». Еврейское выражение, вероятно, сохраняет название мелодии или литургическое указание, но его точный смысл неизвестен.'
    reason: lexical_alternative
  - marker: b
    text: «Миктам» — еврейское обозначение жанра или музыкальной формы с неизвестным точным значением.
    reason: lexical_alternative
  - marker: c
    text: Слова «Давида» могут означать «написанный Давидом», «связанный с Давидом» или «посвящённый Давиду»; еврейская конструкция допускает разные виды связи.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов слово обычно обозначает руководителя, отвечающего за музыкальное исполнение; этот перевод краток, понятен и передаёт литургическую функцию.
- source_word: עַל שׁוּשַׁן עֵדוּת
  choice: На мотив «Лилия свидетельства»
  rationale: Предлог עַל в надписаниях часто вводит название мелодии или способ исполнения. Формулировка естественна по-русски, а примечание сохраняет неопределённость точного смысла.
- source_word: מִכְתָּם
  choice: Миктам
  rationale: Точное значение еврейского жанрового или музыкального обозначения неизвестно, поэтому транслитерация предпочтительнее предположительного перевода.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русская родительная конструкция естественна для надписания и не требует прямо выбирать между авторством и более широкой связью с Давидом; возможные значения пояснены в примечании.
- source_word: לְלַמֵּד
  choice: для наставления
  rationale: Инфинитив с לְ выражает цель; «для наставления» передаёт назначение текста естественным и достойным русским языком.
theological_decisions:
- issue: Характер связи псалма с Давидом
  choice: Миктам Давида
  alternative: Миктам, написанный Давидом / миктам для Давида
  rationale: Еврейское לְדָוִד допускает авторство, принадлежность, связь или посвящение; основной текст не должен без необходимости сводить эту конструкцию только к авторству.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формой надписания. Переведён только представленный еврейский текст WLC; историческое пояснение о войне и долине Соли, имеющееся в английском консультационном слое, в предоставленном оригинальном фрагменте отсутствует и поэтому в основной текст не включено.
