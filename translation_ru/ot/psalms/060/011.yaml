lexical_decisions:
- source_word: הָבָה לָּנוּ
  choice: Даруй нам
  rationale: Просительная форма в молитвенном контексте означает просьбу к Богу дать или предоставить; «даруй» естественно для современной возвышенной молитвенной речи.
- source_word: עֶזְרַת
  choice: помощь
  rationale: Прямо передаёт значение помощи или поддержки и сохраняет лаконичность стиха.
- source_word: מִצָּר
  choice: против врага
  rationale: צַר может означать как бедствие, так и врага. Военный контекст псалма поддерживает личное значение, а предлог מן при слове «помощь» идиоматически передан как «против».
- source_word: תְּשׁוּעַת
  choice: спасение
  rationale: Слово охватывает спасение, избавление и победу. «Спасение» сохраняет основное лексическое значение, а контекст уточняет речь о человеческой помощи в опасности.
- source_word: אָדָם
  choice: которое даёт человек
  rationale: אָדָם обозначает человека как представителя человечества. Развёрнутая конструкция ясно передаёт здесь источник спасения и избегает двусмысленного русского сочетания «спасение человека».
- source_word: וְשָׁוְא
  choice: ведь ... тщетно
  rationale: שָׁוְא выражает пустоту, ненадёжность и тщетность. Союз по смыслу вводит основание просьбы, поэтому естественно передан словом «ведь».
theological_decisions:
- issue: Противопоставление Божьей помощи человеческому спасению
  choice: Стих говорит о тщетности спасения, которое может дать человек, в противопоставлении помощи, испрашиваемой у Бога.
  alternative: Общее утверждение о тщетности любых человеческих усилий.
  rationale: Контекст непосредственно сопоставляет Божью помощь с недостаточностью человеческого избавления; перевод не расширяет это до всеобщего осуждения человеческой деятельности.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным молитвенно-поэтическим звучанием. Порядок второй части слегка развёрнут ради ясности субъектного значения оборота תְּשׁוּעַת אָדָם.
