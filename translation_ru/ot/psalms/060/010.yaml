  text: הֲ/לֹֽא אַתָּ֣ה אֱלֹהִ֣ים זְנַחְתָּ֑/נוּ וְֽ/לֹא תֵצֵ֥א אֱ֝לֹהִ֗ים בְּ/צִבְאוֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/010.yaml
  text: Have you not[a], O God, rejected us, and do you not go out, O God[c][b], with our armies?
translation:
  language: ru
  text: Не Ты ли, Боже, отверг нас[a] и не выступаешь[b], Боже, с нашими войсками?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отринул нас».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не выходишь»; здесь имеется в виду выход вместе с войском на битву.'
    reason: cultural_note
lexical_decisions:
- source_word: הֲלֹא אַתָּה
  choice: Не Ты ли
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и сохраняет усиление независимого местоимения אַתָּה.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения естественна для современного литературного русского; повтор сохранён в соответствии с еврейским текстом.
- source_word: זְנַחְתָּנוּ
  choice: отверг нас
  rationale: Прямо передаёт значение глагола זנח и не смягчает выраженную в плаче мысль о Божьем отвержении народа.
- source_word: וְלֹא תֵצֵא
  choice: и не выступаешь
  rationale: Сохраняет отрицание в пределах единого риторического вопроса; «выступать» естественно передаёт выход в военный поход.
- source_word: בְּצִבְאוֹתֵינוּ
  choice: с нашими войсками
  rationale: Предлог передан как сопровождение, а צבאות в данном контексте обозначает военные силы.
theological_decisions:
- issue: Божественное отвержение в молитве-плаче
  choice: Сохранить прямое утверждение, что Бог отверг народ и не выступает с его войсками.
  alternative: 'Смягчить: «допустил, чтобы нас отвергли» или «как будто отверг нас».'
  rationale: Еврейский текст прямо приписывает Богу отвержение и неучастие в военном походе; напряжение молитвы-плача не следует устранять толкованием.
- issue: Синтаксический охват риторического вопроса
  choice: 'Обе части стиха включены в один вопрос: «Не Ты ли… отверг… и не выступаешь…?»'
  alternative: 'Понять вторую часть как отдельное повествовательное утверждение: «и Ты не выступаешь».'
  rationale: Начальное הֲלֹא естественно охватывает соединённые союзом действия, хотя в русском различие главным образом выражается общей вопросительной конструкцией.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного обращения. Прямое «Не Ты ли» сохраняет риторическую силу, повтор «Боже» — выразительную структуру оригинала, а «выступаешь» делает военный смысл понятным без архаизма.
