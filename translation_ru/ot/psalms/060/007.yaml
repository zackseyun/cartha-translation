lexical_decisions:
- source_word: לִי
  choice: принадлежит Мне / Мне
  rationale: Предлог с суффиксом первого лица выражает принадлежность. В первой строке глагол раскрыт для естественности русского текста, а во второй части опущен во избежание тяжеловесного повтора.
- source_word: גִלְעָד
  choice: Галаад
  rationale: Традиционная русская передача географического названия.
- source_word: מְנַשֶּׁה
  choice: Манассия
  rationale: Традиционная русская библейская передача названия колена и области.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Традиционная русская библейская передача названия колена.
- source_word: מָעוֹז
  choice: крепость
  rationale: Слово обозначает укреплённое место или источник защиты и силы; «крепость» сохраняет военно-политический образ.
- source_word: רֹאשִׁי
  choice: для головы Моей
  rationale: Сохраняется конкретный образ «головы», а русский предлог «для» естественно передаёт защитную функцию крепости, не сводя метафору к отвлечённой «силе».
- source_word: מְחֹקְקִי
  choice: скипетр Мой
  rationale: В контексте царской и военной образности «скипетр» естественно передаёт знак и орудие правления; возможное личное значение «законодатель» сохранено в примечании.
theological_decisions:
- issue: Значение מְחֹקְקִי в образе царской власти
  choice: скипетр Мой
  alternative: законодатель Мой; жезл правителя Моего
  rationale: Еврейское слово допускает как личное значение — того, кто устанавливает постановления, — так и предметное — жезл, символизирующий власть. Основной текст сохраняет параллельную военно-царскую образность, а примечание не устраняет лексическую неоднозначность.
- issue: Связь слов מָעוֹז и רֹאשִׁי
  choice: крепость для головы Моей
  alternative: крепость головы Моей
  rationale: Конструкция буквально связывает «крепость» с «моей головой», но точный характер метафоры не разъясняется. Предлог «для» делает русский текст понятным как образ защиты, а буквальная форма приведена в примечании.
translation_notes:
  register: Современный литературный русский с достоинством поэтической царской речи. Прописные местоимения передают речь Бога по принятой русской библейской традиции. Синтаксический параллелизм и краткие именные формулы оригинала сохранены без архаизмов.
