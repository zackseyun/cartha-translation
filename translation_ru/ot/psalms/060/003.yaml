base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/003.yaml
  text: You have shown your people hard things[a]; you have made us drink wine of staggering.
translation:
  language: ru
  text: Ты дал Своему народу испытать суровое; Ты напоил нас вином, от которого мы шатаемся.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вином шатания»; возможно также: «вином оцепенения» или «вином смятения».'
    reason: Лексическое значение редкого слова תַּרְעֵלָה допускает оттенки шатания, головокружения, оцепенения и смятения.
lexical_decisions:
- source_word: הִרְאִיתָה
  choice: дал… испытать
  rationale: Каузативная форма глагола ראה буквально означает «дал увидеть, показал», но в данном контексте речь о том, что Бог дал народу пережить тяжёлое. «Дал испытать» естественно передаёт этот смысл по-русски, не превращая образ в объяснительный пересказ.
- source_word: עַמְּךָ
  choice: Своему народу
  rationale: עַם здесь обозначает принадлежащий Богу народ; возвратное «Своему» естественно соотносит его с подлежащим «Ты».
- source_word: קָשָׁה
  choice: суровое
  rationale: Субстантивированное прилагательное женского рода означает нечто тяжёлое, суровое. Единственное собирательное «суровое» сохраняет лаконичность и грамматическую неопределённость еврейского выражения.
- source_word: הִשְׁקִיתָנוּ
  choice: Ты напоил нас
  rationale: Hiphil от שׁקה означает «дать пить, напоить». «Напоил» кратко и естественно передаёт каузативное действие и сохраняет образ.
- source_word: יַיִן
  choice: вином
  rationale: Обычное значение — «вино»; здесь слово участвует в метафоре навязанного Богом состояния смятения и утраты устойчивости.
- source_word: תַּרְעֵלָה
  choice: от которого шатает
  rationale: Редкое существительное обозначает шатание, головокружение или оцепеняющее смятение. Относительная конструкция естественна в современном русском и сохраняет конкретный телесный образ, не сводя его к абстрактному «страданию».
theological_decisions:
- issue: Образ вина
  choice: Сохранён метафорический образ вина, вызывающего шатание и дезориентацию как переживание бедствия или суда.
  alternative: Понять речь буквально о вине либо заменить образ прямым обозначением страдания.
  rationale: Параллель с «суровым» и библейская образность чаши/вина поддерживают метафорическое прочтение, однако перевод не уточняет сверх текста точный характер бедствия.
translation_notes:
  register: Современный литературный русский с торжественной библейской лаконичностью. Синтаксический параллелизм двух обращений «Ты…; Ты…» сохранён; архаизмы и конфессионально окрашенные уточнения не используются.
