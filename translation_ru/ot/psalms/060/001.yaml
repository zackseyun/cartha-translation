  text: אֱ֭לֹהִים זְנַחְתָּ֣/נוּ פְרַצְתָּ֑/נוּ אָ֝נַ֗פְתָּ תְּשׁ֣וֹבֵ֥ב לָֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/001.yaml
  text: God[a], you have rejected us; you have broken us through; you have been angry[b]. Restore us.
translation:
  language: ru
  text: Боже, Ты отверг нас, пробил в нас брешь, разгневался. Восстанови нас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вернись к нам». Еврейское выражение может означать как восстановление народа, так и возвращение Бога к нему.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения естественно передаёт прямое обращение к Богу и соответствует современному литературному русскому языку.
- source_word: זְנַחְתָּנוּ
  choice: Ты отверг нас
  rationale: Глагол זנח означает отвергать, оставлять или отбрасывать; «отверг» ясно передаёт переживание Божьего отвержения без архаизации.
- source_word: פְרַצְתָּנוּ
  choice: пробил в нас брешь
  rationale: פרץ несёт образ прорыва или пролома. Русское выражение сохраняет образ разрушенной обороны или целостности народа и звучит естественнее буквального «проломил нас».
- source_word: אָ֝נַפְתָּ
  choice: разгневался
  rationale: Глагол выражает гнев; совершенный вид соответствует цепочке завершённых действий и сохраняет сжатость еврейского стиха.
- source_word: תְּשׁוֹבֵב לָנוּ
  choice: Восстанови нас
  rationale: Фраза допускает понимание как просьбы восстановить народ после поражения. Это естественная по-русски передача, а возможный смысл возвращения Бога к народу отмечен в сноске.
theological_decisions:
- issue: Смысл заключительной просьбы תְּשׁוֹבֵב לָנוּ
  choice: Просьба восстановить народ после Божьего суда
  alternative: Просьба к Богу вернуться к Своему народу
  rationale: Еврейская конструкция допускает оба взаимосвязанных смысла. Основной текст передаёт восстановление народа, но сноска сохраняет подлинную смысловую неоднозначность и не сводит её к одному богословскому толкованию.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного плача. Краткая последовательность глаголов сохраняет напряжённый ритм оригинала; образ бреши передан конкретно, без неясного буквализма.
