  text: בֵּֽ/אלֹהִ֥ים נַעֲשֶׂה חָ֑יִל וְ֝/ה֗וּא יָב֥וּס צָרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/012.yaml
  text: With God we will do valiantly[b][a], and he will trample our adversaries.
translation:
  language: ru
  text: С Богом[a] мы совершим подвиги, и Он растопчет наших врагов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Благодаря Богу». Еврейский предлог может указывать как на совместность, так и на средство действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהִים
  choice: С Богом
  rationale: Предлог בְּ здесь допускает значение как совместности, так и средства. «С Богом» естественно по-русски выражает действие в единении с Богом и при Его помощи, не сводя оборот только к инструментальному значению.
- source_word: נַעֲשֶׂה חָיִל
  choice: мы совершим подвиги
  rationale: Сочетание עָשָׂה חַיִל — идиома со значением проявить доблесть, совершить нечто могучее. «Совершим подвиги» передаёт её воинско-поэтический смысл ясным современным языком.
- source_word: וְהוּא
  choice: и Он
  rationale: Самостоятельное местоимение подчёркивает Божье личное и решающее действие; союз וְ сохраняется как «и».
- source_word: יָבוּס
  choice: растопчет
  rationale: Глагол בּוּס обозначает попирание ногами. «Растопчет» сохраняет яркий образ полного поражения противников.
- source_word: צָרֵינוּ
  choice: наших врагов
  rationale: צָר обозначает неприятеля или противника. В данном воинском контексте «врагов» звучит естественно и точно.
theological_decisions:
- issue: Соотношение человеческого и Божьего действия в победе
  choice: 'Сохранены оба утверждения: народ с Богом совершает подвиги, а Бог Сам растаптывает врагов.'
  alternative: Истолковать победу либо исключительно как человеческое достижение, либо исключительно как Божье действие, устранив активность народа.
  rationale: Еврейский текст намеренно соединяет человеческое действие с решающим действием Бога; перевод не снимает этого напряжения.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного, возвышенного и воинского характера древнееврейской поэзии. Местоимение «Он» написано с прописной буквы как ясная отсылка к Богу; синтаксис остаётся простым и пригодным для публичного чтения.
