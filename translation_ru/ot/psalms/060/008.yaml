lexical_decisions:
- source_word: סִיר רַחְצִי
  choice: мой таз для омовения
  rationale: סִיר обозначает сосуд или ёмкость, а רַחְצִי уточняет его назначение для мытья. «Таз для омовения» передаёт конкретный и унизительный образ подчинения естественнее, чем архаичное «умывальная лохань».
- source_word: אַשְׁלִיךְ נַעֲלִי
  choice: я брошу свою сандалию
  rationale: Каузативная форма от שלך означает «бросить», а נַעַל — обувь; «сандалия» соответствует древнему контексту и сохраняет образ господства над Эдомом.
- source_word: עַל אֱדוֹם
  choice: на Эдом
  rationale: 'Предлог עַל сохранён в прямом пространственном значении: сандалия бросается на Эдом как знак власти и унижения.'
- source_word: עָלַי פְּלֶשֶׁת
  choice: Филистия ... для меня
  rationale: Сочетание предлога с суффиксом первого лица допускает несколько синтаксических толкований. В связи с последующим повелительным глаголом оно передано как указание, что клич должен быть возглашён для говорящего; неоднозначность отмечена в сноске.
- source_word: הִתְרֹעָעִי
  choice: возгласи ... победный клич
  rationale: Форма от רוע обозначает громкий возглас, нередко военный или победный. Повелительное наклонение женского рода согласуется с Филистией как землёй или страной; перевод сохраняет образ клича и иронический оттенок подчинения.
- source_word: מוֹאָב / אֱדוֹם / פְּלֶשֶׁת
  choice: Моав / Эдом / Филистия
  rationale: Географические и национальные названия переданы в их общепринятых русских библейских формах; פְּלֶשֶׁת обозначает землю или страну Филистию.
theological_decisions:
- issue: Смысл повелительной формы הִתְרֹעָעִי, обращённой к Филистии
  choice: Ироническое повеление покорённой Филистии возгласить победный клич для говорящего
  alternative: «Над Филистией я возглашу победный клич» — при ином прочтении или огласовке формы
  rationale: Масоретская огласовка указывает на повелительное наклонение второго лица женского рода, грамматически подходящее при обращении к стране. Контекст господства над соседними народами позволяет понимать это как ироническое повеление, однако трудность еврейской формы и традиционное чтение от первого лица отражены в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Конкретные образы оригинала сохранены без архаизмов; трудное заключительное полустишие переведено по масоретской огласовке, а альтернативное чтение вынесено в сноску.
