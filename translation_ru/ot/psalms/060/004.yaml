lexical_decisions:
- source_word: נָתַתָּה
  choice: Ты дал
  rationale: Qal, перфект, 2-е лицо мужского рода единственного числа от נתן; прямое обращение к Богу. Русское прошедшее время естественно передаёт завершённое действие.
- source_word: לִירֵאֶיךָ
  choice: боящимся Тебя
  rationale: Субстантивированное причастие от ירא с местоименным суффиксом; выражение обозначает благоговейный страх перед Богом, не сводя его к испугу.
- source_word: נֵס
  choice: знамя
  rationale: Слово обозначает поднятый знак или воинское знамя. «Знамя» сохраняет образ видимого ориентира, вокруг которого собираются люди.
- source_word: לְהִתְנוֹסֵס
  choice: чтобы поднять его
  rationale: Трудная и спорная форма. В сочетании с נֵס наиболее вероятен смысл поднятия или выставления знамени; объект «его» естественно отсылает к знамени.
- source_word: מִפְּנֵי
  choice: ради
  rationale: Предлог буквально связан со значениями «перед лицом» и «из-за»; здесь «ради» кратко и естественно передаёт вероятное основание или цель действия, не перегружая строку.
- source_word: קֹשֶׁט
  choice: истины
  rationale: Редкое поэтическое слово, вероятнее всего означающее «истина» или «верность». Выбрано «истина» как прямой и контекстуально уместный эквивалент.
- source_word: סֶלָה
  choice: Села
  rationale: Неясное литургическое или музыкальное обозначение сохранено в традиционной русской транслитерации.
