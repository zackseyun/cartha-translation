base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/006.yaml
  text: 'God has spoken in his holiness: “I will exult[a]; I will divide up Shechem[b], and measure out the Valley of Succoth.”'
translation:
  language: ru
  text: 'Бог сказал в Своей святости[a]: «Я возликую[b], разделю Сихем и отмерю долину Суккота».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Своём святом месте»; возможно также: «Своей святостью». Еврейское выражение может обозначать Божью святость или сферу Его святого присутствия.'
    reason: lexical_alternative
  - marker: b
    text: Возможно, слова «Я возликую» принадлежат псалмопевцу и выражают его отклик на Божье слово, а не являются частью речи Бога.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму, единственное число глагола דִּבֶּר однозначно указывает на единого Бога Израиля.
- source_word: דִּבֶּר
  choice: сказал
  rationale: Перфект обозначает завершённое речевое действие; простое прошедшее время естественно и точно звучит по-русски.
- source_word: בְּקָדְשׁוֹ
  choice: в Своей святости
  rationale: Сохраняет компактность и неоднозначность еврейского выражения, которое может указывать как на Божью святость, так и на сферу Его святого присутствия.
- source_word: אֶעְלֹזָה
  choice: Я возликую
  rationale: Передаёт торжественную, победную радость, выраженную глаголом עלז.
- source_word: אֲחַלְּקָה
  choice: разделю
  rationale: В контексте территории означает разделить или распределить землю; русский глагол сохраняет образ без лишнего уточнения.
- source_word: שְׁכֶם
  choice: Сихем
  rationale: Устоявшаяся русская библейская форма географического названия.
- source_word: וְעֵמֶק סֻכּוֹת
  choice: долину Суккота
  rationale: Передаёт конструктивную цепочку с географическим названием; форма «Суккот» близка еврейскому звучанию, а родительный падеж естественен по-русски.
- source_word: אֲמַדֵּד
  choice: отмерю
  rationale: Передаёт буквальный образ измерения территории и подразумеваемое установление её границ или распределение.
theological_decisions:
- issue: Граница прямой речи и смена говорящего
  choice: Все глаголы первого лица, начиная с «Я возликую», представлены как слова Бога.
  alternative: «Возликую» может быть ответом псалмопевца на Божье слово, а последующие слова — началом Божьего изречения.
  rationale: Последовательность наиболее естественно читается как единое Божье изречение, особенно ввиду заявлений о разделе и измерении земли; альтернативное членение отмечено в сноске.
- issue: Значение בְּקָדְשׁוֹ
  choice: «в Своей святости»
  alternative: «в Своём святом месте» или «Своей святостью»
  rationale: Основной перевод не конкретизирует, идёт ли речь о Божьем свойстве, сфере святого присутствия или основании клятвенного утверждения; неоднозначность сохранена с помощью сноски.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Заглавная буква в местоимении «Своей» принята как традиционный русский способ обозначения Бога; географические названия переданы в привычной библейской форме («Сихем») и близкой к еврейскому форме («Суккот»).
