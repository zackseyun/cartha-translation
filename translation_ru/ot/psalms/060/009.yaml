  text: מִ֣י יֹ֭בִלֵ/נִי עִ֣יר מָצ֑וֹר מִ֖י נָחַ֣/נִי עַד אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/060/009.yaml
  text: Who will bring me to the fortified city? Who will lead me as far as Edom?[a]
translation:
  language: ru
  text: Кто приведёт меня в укреплённый город? Кто доведёт меня до Эдома?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Кто приведёт меня в укреплённый город? Кто довёл меня до Эдома?» Еврейская форма второго глагола допускает чтение в прошедшем времени, однако основной текст передаёт поэтический параллелизм как два вопроса о будущем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: кто
  rationale: Вопросительное местоимение вводит риторический вопрос; прямое и естественное соответствие в русском языке.
- source_word: יֹבִלֵנִי
  choice: приведёт меня
  rationale: 'Порода hифиль глагола יבל выражает побуждение или сопровождение к месту назначения: «привести, отвести». Будущее время естественно передаёт направленный вперёд риторический вопрос.'
- source_word: עִיר מָצוֹר
  choice: укреплённый город
  rationale: Сочетание обозначает город, отличающийся укреплениями, то есть крепость; выбран буквальный и естественный для современного русского вариант без неоднозначного смысла «осаждённый город».
- source_word: נָחַנִי
  choice: доведёт меня
  rationale: Глагол נחה означает «вести, направлять». «Доведёт» сохраняет образ движения к конечной точке и избегает стилистического повтора с первым полустишием. Хотя форма морфологически допускает перфектное прочтение, параллелизм позволяет понимать её как направленный вперёд вопрос.
- source_word: עַד אֱדוֹם
  choice: до Эдома
  rationale: Предлог עַד указывает на предел или конечную точку пути; «до Эдома» точно и естественно передаёт это значение.
- source_word: אֱדוֹם
  choice: Эдом
  rationale: Традиционная русская передача географического имени.
