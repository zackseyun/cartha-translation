lexical_decisions:
- source_word: הִרְעַשְׁתָּה
  choice: Ты потряс
  rationale: Порода hифиль глагола רָעַשׁ выражает причинение сотрясения; «потряс» естественно передаёт образ землетрясения и каузативный смысл.
- source_word: אֶרֶץ
  choice: землю
  rationale: אֶרֶץ может обозначать как землю вообще, так и определённую страну; «землю» сохраняет широкий поэтический образ, не исключая национального смысла.
- source_word: פְּצַמְתָּהּ
  choice: расколол её
  rationale: Глагол означает разломить или расколоть; этот выбор ясно связывает действие с последующими «трещинами».
- source_word: רְפָה
  choice: Исцели
  rationale: Императив רָפָא обычно означает «исцелять». Сохранение этой лексемы передаёт поэтическое олицетворение земли.
- source_word: שְׁבָרֶיהָ
  choice: её трещины
  rationale: שֶׁבֶר обозначает разлом, повреждение или пролом; «трещины» естественно соответствует образу расколовшейся земли.
- source_word: כִי
  choice: ибо
  rationale: Союз вводит основание просьбы; «ибо» краток и уместен в dignified поэтическом регистре.
- source_word: מָטָה
  choice: она колеблется
  rationale: Глагол передаёт отклонение, шаткость или неустойчивость. «Колеблется» сохраняет продолжающееся состояние без преждевременного смысла полного обрушения.
