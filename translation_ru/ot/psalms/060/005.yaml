  yaml_path: translation/ot/psalms/060/005.yaml
  text: So that your beloved ones may be delivered[b][a], save with your right hand and answer me.
translation:
  language: ru
  text: Чтобы были избавлены[a] те, кого Ты любишь, спаси Своей правой рукой и ответь нам.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были спасены».'
    reason: lexical_alternative
  - marker: b
    text: 'В масоретском чтении (кере): «ответь мне».'
    reason: textual_variant
lexical_decisions:
- source_word: לְמַעַן
  choice: Чтобы
  rationale: Передаёт целевое значение союза и естественно вводит прошение в современном русском языке.
- source_word: יֵחָלְצוּן
  choice: были избавлены
  rationale: Страдательная конструкция передаёт нифаль глагола חלץ — быть вызволенными, избавленными — и не создаёт впечатления, будто люди спасаются сами.
- source_word: יְדִידֶיךָ
  choice: те, кого Ты любишь
  rationale: Естественно передаёт множественное число и значение близких, любимых Богом людей, не прибегая к архаичному «возлюбленные».
- source_word: הוֹשִׁיעָה
  choice: спаси
  rationale: Прямое повелительное прошение о спасительном действии; кратко и естественно для молитвенной речи.
- source_word: יְמִינְךָ
  choice: Своей правой рукой
  rationale: Сохраняет образ Божьей правой руки как орудия силы и спасения, не заменяя его отвлечённым словом «сила».
- source_word: וַעֲנֵנוּ
  choice: и ответь нам
  rationale: Следует представленному в WLC чтению с объектным суффиксом первого лица множественного числа и сохраняет общинный характер просьбы.
theological_decisions:
- issue: Образ Божьей правой руки
  choice: 'Сохранить антропоморфный образ: «Своей правой рукой».'
  alternative: 'Передать отвлечённо: «Своей силой».'
  rationale: Образ существен для поэтики и богословского языка псалма; контекст ясно указывает на Божью спасающую силу.
- issue: Число объектного суффикса в заключительном глаголе
  choice: «ответь нам»
  alternative: «ответь мне»
  rationale: Основной текст следует данному еврейскому источнику ועננו с суффиксом первого лица множественного числа; засвидетельствованное единственное число отмечено в сноске, без устранения текстовой неоднозначности.
translation_notes:
  register: Современный литературный русский язык с ясным молитвенным ритмом. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской издательской традицией; архаизм «десница» не используется.
