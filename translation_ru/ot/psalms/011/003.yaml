  text: כִּ֣י הַ֭/שָּׁתוֹת יֵֽהָרֵס֑וּ/ן צַ֝דִּ֗יק מַה פָּעָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/003.yaml
  text: If the foundations are destroyed[a], what can the righteous do?
translation:
  language: ru
  text: Если основания разрушены[a], что может сделать праведник?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо основания разрушаются; что сделал праведник?» Последний глагол в еврейском тексте формально допускает перевод в прошедшем времени, хотя по контексту его обычно понимают в смысле: «что может сделать праведник?»'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Если
  rationale: В данном поэтическом контексте частица естественно вводит условие, за которым следует риторический вопрос, хотя возможен и причинный смысл «ибо».
- source_word: הַשָּׁתוֹת
  choice: основания
  rationale: Сохраняет конкретный образ еврейского текста, не сводя его к одному толкованию — общественному устройству, правосудию или нравственному порядку.
- source_word: יֵהָרֵסוּן
  choice: разрушены
  rationale: Передаёт страдательное значение нифаля от הרס и естественно звучит по-русски.
- source_word: צַדִּיק
  choice: праведник
  rationale: Передаёт единственное число и обобщённый характер обозначения человека, живущего праведно.
- source_word: מַה פָּעָל
  choice: что может сделать
  rationale: Формально פָּעָל — форма qatal, «сделал», но в связи с условием риторический вопрос наиболее естественно выражает практическую возможность действия. Формально прошедшее прочтение сохранено в сноске.
theological_decisions:
- issue: Метафорический объём слова «основания»
  choice: Сохранить метафору без уточнения её предмета.
  alternative: Истолковать как основы общества, правосудия, нравственного порядка или заветного устройства.
  rationale: Еврейский образ намеренно широк; конкретизация в основном тексте неоправданно устранила бы его смысловую открытость.
- issue: Временное и модальное значение פָּעָל
  choice: 'Передать контекстуально: «что может сделать праведник?»'
  alternative: «Что сделал праведник?»
  rationale: Основной вариант соответствует условно-риторическому ходу стиха, но альтернативное, более формальное понимание qatal действительно возможно и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и возвышенная, но понятная. Сохранены образ «оснований», риторический вопрос и неоднозначность еврейского глагола посредством сноски.
