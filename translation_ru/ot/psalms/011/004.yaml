base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/004.yaml
  text: Yahweh is in his holy temple[a]; Yahweh—his throne is in heaven. His eyes see[d][c][b]; his eyelids examine the children of man.
translation:
  language: ru
  text: Яхве — в своём святом храме[a]; Яхве — его престол на небесах. Его глаза видят[b], его веки исследуют[c] людей[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своём святом дворце»; слово הֵיכָל может обозначать и храм, и царский дворец.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «созерцают».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «проверяют», «испытывают».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «сынов человека»; то есть людей, человечество.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: בְּהֵיכַל קָדְשׁוֹ
  choice: в своём святом храме
  rationale: הֵיכָל может означать храм или дворец; в данном сакральном контексте «храм» естественно передаёт образ святого места пребывания, не уточняя, земное оно или небесное.
- source_word: בַּשָּׁמַיִם כִּסְאוֹ
  choice: престол его на небесах
  rationale: Сохраняет вынесенную конструкцию еврейского текста и параллель с предшествующим утверждением о святом храме.
- source_word: עֵינָיו יֶחֱזוּ
  choice: Его глаза видят
  rationale: חזה означает «видеть, созерцать»; простой глагол «видят» ясен современному читателю и сохраняет прямоту образа.
- source_word: עַפְעַפָּיו יִבְחֲנוּ
  choice: его веки испытывают
  rationale: Буквальное «веки» сохраняет антропоморфный поэтический параллелизм с «глазами», а «испытывают» передаёт בחן — проверять, исследовать, подвергать испытанию.
- source_word: בְּנֵי אָדָם
  choice: людей
  rationale: Идиома буквально означает «сыны человека/Адама», но здесь обозначает всех людей; «людей» естественно и точно передаёт её собирательное значение в современном русском.
theological_decisions:
- issue: Образ места пребывания Яхве
  choice: 'Сохранены рядом оба утверждения: Яхве находится в святом храме, а его престол — на небесах.'
  alternative: Отождествить святой храм исключительно с земным храмом либо исключительно с небом.
  rationale: Еврейский текст не объясняет соотношение двух образов; перевод сохраняет эту поэтическую и богословскую напряжённость.
- issue: Антропоморфный образ Божьего наблюдения и суда
  choice: Сохранено буквальное упоминание глаз и век.
  alternative: Сгладить образ как «его взор испытывает людей».
  rationale: Буквальная передача воспроизводит параллелизм оригинала и не устраняет его выразительный антропоморфизм.
- issue: Собирательное значение בְּנֵי אָדָם
  choice: людей
  alternative: сынов человеческих
  rationale: В контексте выражение относится ко всему человечеству, а не только к мужчинам; современное «людей» передаёт реальный объём значения без ненужной архаизации.
translation_notes:
  register: Современный литературный русский с поэтической сдержанностью. Повтор имени «Яхве», вынесенная конструкция «Яхве — престол его…» и буквальный образ век сохранены ради структуры и образности еврейского стиха. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная издательская норма.
