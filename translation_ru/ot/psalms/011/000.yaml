  yaml_path: translation/ot/psalms/011/000.yaml
  text: For the choirmaster[a]. Of David. In Yahweh I take refuge; how can you say to my soul, “Flee to your mountain[b], bird” ?
translation:
  language: ru
  text: 'Руководителю хора.[a] Давида. У Яхве я ищу убежища. Как вы можете говорить душе моей: «Улетай, как птица, на свою гору»?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Начальнику певцов»; точное значение еврейского обозначения не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейская фраза трудна. Буквально её слова могут быть переданы как: «Бегите на вашу гору, птица»; формы глагола и притяжательного слова множественного числа, тогда как «птица» — единственного. Возможно также: «Улетай на свою гору, птица».'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Обычное и понятное обозначение адресата надписания; еврейское слово буквально указывает на руководителя исполнения, хотя точная должность не вполне ясна.
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая форма сохраняет многозначность еврейского надписания: оно может указывать на авторство, принадлежность, посвящение или связь с Давидом.'
- source_word: בַּיהוָה חָסִיתִי
  choice: У Яхве я ищу убежища
  rationale: Передаёт образ обращения к Яхве за защитой и состояние упования; личное имя יהוה не заменено титулом.
- source_word: לְנַפְשִׁי
  choice: душе моей
  rationale: Сохранён прямой антропологический образ оригинала, а не упрощённое «мне».
- source_word: נודו הַרְכֶם צִפּוֹר
  choice: Улетайте на вашу гору, птица
  rationale: 'Основной текст следует представленному WLC: глагол и притяжательное окончание имеют форму множественного числа, тогда как «птица» стоит в единственном; эта трудность не сглажена без пояснения.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация показывает, что в оригинале стоит личное имя Бога, и не вносит в основной текст замену именем-титулом.
- issue: Значение לְדָוִד
  choice: Давида
  alternative: Псалом Давида
  rationale: Добавление слова «псалом» сделало бы надписание естественнее, но его нет в данном еврейском тексте; краткая конструкция лучше сохраняет открытый характер связи с Давидом.
translation_notes:
  register: Современный литературный русский с достоинством поэтического надписания. Синтаксис основного текста намеренно сохраняет необычное обращение и расхождение числа в заключительной еврейской фразе; более гладкие варианты вынесены в примечание.
