source:
  edition: WLC
  text: יַמְטֵ֥ר עַל רְשָׁעִ֗ים פַּ֫חִ֥ים אֵ֣שׁ וְ֭/גָפְרִית וְ/ר֥וּחַ זִלְעָפ֗וֹת מְנָ֣ת כּוֹסָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/006.yaml
  text: He will rain down traps on the wicked; fire and sulfur and a scorching wind will be the portion of their cup.
translation:
  language: ru
  text: 'Он дождём обрушит на нечестивых силки;

    огонь, сера и палящий ветер — доля их чаши.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּחִים
  choice: силки
  rationale: Масоретская огласовка и древняя традиция поддерживают значение «силки, ловушки». Слово «силки» сохраняет необычный поэтический образ того, что Бог низвергает их дождём.
- source_word: רוח זלעפות
  choice: палящий ветер
  rationale: Передаёт губительный, обжигающий характер ветра естественным современным русским выражением, не сужая образ до конкретного природного явления.
- source_word: מנת כוסם
  choice: доля их чаши
  rationale: Сохраняет древнееврейскую метафору чаши как назначенного удела или участи; контекст ясно указывает на суд.
theological_decisions:
- issue: Субъект глагола ימטיר выражен местоименно и определяется предыдущим стихом
  choice: Он
  alternative: Господь
  rationale: Сохранено местоимение исходного текста, чтобы не вводить в этот стих повтор имени, которого в нём нет.
- issue: Образ чаши может быть истолкован как мера Божьего суда
  choice: доля их чаши
  alternative: назначенная им участь
  rationale: Сохранена исходная метафора и её богословская напряжённость без поясняющего истолкования в основном тексте.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Инверсия «доля их чаши» намеренно сохраняет библейскую метафору; «обрушит дождём» делает необычное сочетание «дождь силков» понятным, не устраняя его образность.
