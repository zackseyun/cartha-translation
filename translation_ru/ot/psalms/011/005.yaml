  choice: «Его душа» относится к Яхве и выражает Его глубокое личное отвращение
  alternative: Сгладить оборот до «Он ненавидит»
  rationale: Еврейский текст прямо приписывает ненависть נֶפֶשׁ Яхве. Сохранение антропоморфного оборота не устраняет богословское напряжение и не добавляет предположений о природе божественных чувств.
- issue: Синтаксическая роль צַדִּיק
  choice: 'Понимать как прямое дополнение: «Яхве испытывает праведника»'
  alternative: 'Понимать как сказуемое: «Яхве праведен; Он испытывает…»'
  rationale: Масоретическая акцентуация и параллелизм с «нечестивцем» поддерживают понимание «праведника» как объекта глагола «испытывает».
