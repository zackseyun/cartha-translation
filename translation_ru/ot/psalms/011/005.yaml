- source_word: חָמָס
  choice: насилие
  rationale: Слово может включать насилие и сопряжённую с ним неправду; в данном контексте прямое «насилие» точно передаёт основной смысл.
- source_word: שָׂנְאָה נַפְשׁוֹ
  choice: ненавидит Его душа
  rationale: Сохранён образный еврейский оборот «Его душа ненавидит», выражающий глубокое личное отвращение Яхве; инверсия делает фразу приемлемой для литературного русского языка.
