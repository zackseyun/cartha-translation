  text: Ибо Яхве праведен, Он любит праведные дела; честные увидят Его лицо[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, менее вероятно: «Его лицо взирает на праведного». Синтаксис заключительной части еврейского текста допускает разные толкования.'
