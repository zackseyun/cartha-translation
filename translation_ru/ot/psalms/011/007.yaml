lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего утверждения; «ибо» естественно передаёт пояснительно-причинную связь и сохраняет возвышенный тон псалма.
- source_word: צַדִּיק
  choice: праведен
  rationale: Слово характеризует нравственную правоту Яхве. Выбор сохраняет связь с однокоренным צְדָקוֹת — «праведные дела».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, а не заменяет его титулом.
- source_word: צְדָקוֹת
  choice: праведные дела
  rationale: Форма множественного числа здесь естественно указывает на конкретные проявления праведности; перевод также сохраняет корневую связь со словом «праведен».
- source_word: אָהֵב
  choice: любит
  rationale: Прямо выражает постоянное отношение Яхве к праведным поступкам.
- source_word: יָשָׁר
  choice: праведные
  rationale: Прилагательное употреблено субстантивно; множественное число в русском согласовано с последующим еврейским глаголом во множественном числе. В данном контексте «праведные» звучит естественнее, хотя частично сближает термин с корнем צדק.
- source_word: יֶחֱזוּ
  choice: увидят
  rationale: Глагол означает «видеть, созерцать». «Увидят» ясно и естественно передаёт смысл, не усиливая заложенную в слове степень созерцательности.
- source_word: פָנֵימוֹ
  choice: Его лицо
  rationale: Сохраняется конкретный образ еврейского текста; возможные значения присутствия и благоволения отмечены в сноске.
theological_decisions:
- issue: Синтаксис и субъект заключительной части стиха
  choice: праведные увидят Его лицо
  alternative: Его лицо взирает на праведного
  rationale: Глагол יֶחֱזוּ стоит во множественном числе, поэтому наиболее естественно считать субстантивированное יָשָׁר собирательным обозначением праведных людей, а «Его лицо» — дополнением. Менее вероятный иной синтаксический разбор сохранён в сноске, чтобы не устранять подлинную неоднозначность.
- issue: Смысл выражения «увидят Его лицо»
  choice: сохранить буквальный образ
  alternative: будут в Его присутствии / испытают Его благоволение
  rationale: Образ лица может подразумевать присутствие или благоволение Бога, однако основной текст не должен подменять образ его истолкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмовым звучанием. Синтаксис остаётся кратким и параллельным; личное имя передано как «Яхве». Местоимение «Он» добавлено для естественности русского предложения, не меняя смысла.
