  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד בַּֽ/יהוָ֨ה חָסִ֗יתִי אֵ֭יךְ תֹּאמְר֣וּ לְ/נַפְשִׁ֑/י נודו הַרְ/כֶ֥ם צִפּֽוֹר׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/011/001.yaml
  text: For the choirmaster. Of David. In the LORD I have taken refuge; how can you say to me, “Flee to your mountain like a bird”?
translation:
  language: ru
  text: 'Руководителю хора. Давида. У Господа я нашёл убежище. Как же вы говорите мне: «Лети на вашу гору, птица!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Улетай на вашу гору, как птица». Еврейский порядок слов допускает как обращение «птица», так и сравнение; в древних переводах встречается вариант со сравнением.'
    reason: Сохраняет действительную синтаксическую неоднозначность, не выдавая второе прочтение за основной текст.
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Начальнику хора
  rationale: Традиционно и понятно передаёт указание руководителю музыкального исполнения, хотя точная функция термина не вполне ясна.
- source_word: לְדָוִד
  choice: Псалом Давида
  rationale: Естественно передаёт надписание; еврейское לְ может обозначать авторство, принадлежность или посвящение, поэтому формулировка не уточняет это сверх текста.
- source_word: בַּיהוָה חָסִיתִי
  choice: На Господа я уповаю
  rationale: Передаёт совершенное действие חָסִיתִי как состоявшийся выбор и нынешнюю уверенность; «Господь» представляет тетраграмматон в принятой русской библейской форме.
- source_word: לְנַפְשִׁי
  choice: мне
  rationale: В данном обращении נֶפֶשׁ означает самого человека; буквальное «моей душе» звучало бы по-русски как обращение к отдельной части личности.
- source_word: נוּדִי הַרְכֶם צִפּוֹר
  choice: Птицей улетай на вашу гору
  rationale: Сохраняет масоретское чтение и образ птицы; «улетай» естественно выражает бегство птицы к горе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Использована укоренённая русская библейская передача, не добавляющая конфессионального толкования.
- issue: Число в местоимении הַרְכֶם
  choice: вашу гору
  alternative: твою гору
  rationale: Масоретский текст содержит суффикс второго лица множественного числа; это согласуется с обращением «вы говорите» и сохраняет грамматическую напряжённость между единственным числом повеления и множественным числом адресатов.
translation_notes:
  register: Современный литературный русский с достоинством псалмового надписания. Сохранено обращение к нескольким советчикам («вы», «вашу»), тогда как повеление относится к одному говорящему («улетай»).
