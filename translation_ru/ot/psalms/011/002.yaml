lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ведь вот
  rationale: כִּי связывает угрозу с предшествующими словами как их основание, а הִנֵּה живо привлекает к ней внимание. Сочетание «ведь вот» сохраняет обе функции и естественно звучит по-русски.
- source_word: הָרְשָׁעִים
  choice: нечестивые
  rationale: В псалмах слово обозначает нравственно порочных противников, а не только виновных в юридическом смысле; «нечестивые» сохраняет этот устойчивый этический оттенок.
- source_word: יִדְרְכוּן קֶשֶׁת
  choice: натягивают лук
  rationale: Еврейская идиома описывает приведение лука в готовность к выстрелу. Русское «натягивают лук» передаёт образ ясно и без излишнего буквализма.
- source_word: כּוֹנְנוּ חִצָּם עַל יֶתֶר
  choice: уже наложили стрелу на тетиву
  rationale: Фраза изображает намеренную подготовку стрелы к выстрелу. Единственное число «стрелу» следует форме исходного текста, а «уже» передаёт завершённость действия на фоне предыдущего глагола.
- source_word: לִירוֹת
  choice: чтобы ... стрелять
  rationale: Инфинитив выражает цель приготовления оружия; конструкция с «чтобы» естественно передаёт эту связь.
- source_word: בְּמוֹ אֹפֶל
  choice: во тьме
  rationale: Предложная фраза прежде всего указывает на тёмную обстановку или укрытие нападения. Краткое «во тьме» сохраняет поэтическую плотность и допускает оттенок скрытности.
- source_word: לְיִשְׁרֵי לֵב
  choice: в правых сердцем
  rationale: Еврейское выражение обозначает людей внутренней нравственной прямоты. «Правые сердцем» сохраняет образ сердца и привычную возвышенную лексику псалма.
