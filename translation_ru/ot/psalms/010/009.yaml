  text: יֶאֱרֹ֬ב בַּ/מִּסְתָּ֨ר כְּ/אַרְיֵ֬ה בְ/סֻכֹּ֗/ה יֶ֭אֱרֹב לַ/חֲט֣וֹף עָנִ֑י יַחְטֹ֥ף עָ֝נִ֗י בְּ/מָשְׁכ֥/וֹ בְ/רִשְׁתּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/009.yaml
  text: He lies in wait in hiding[a], like a lion in his lair; he lies in wait to seize the poor[c][b]; he seizes the poor when he drags him into his net.
translation:
  language: ru
  text: Он подстерегает в тайном месте[a], как лев в своём укрытии[b]; подстерегает, чтобы схватить бедного; хватает бедного, затягивая его в свою сеть[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тайно».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в своём логове»; еврейское слово может обозначать укрытие, скрытое место или заросли.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «увлекая его своей сетью» или «таща его в своей сети».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶאֱרֹב
  choice: подстерегает
  rationale: Глагол ארב означает выжидать в засаде с намерением напасть. «Подстерегает» естественно передаёт намеренность и хищнический характер действия; повтор исходного глагола сохранён.
- source_word: בַּמִּסְתָּר
  choice: в тайном месте
  rationale: מִסְתָּר может обозначать скрытое место или тайное действие. Выбранный вариант сохраняет пространственный образ укрытия, не исключая оттенка скрытности.
- source_word: כְּאַרְיֵה
  choice: как лев
  rationale: Прямое воспроизведение сравнения, сохраняющее образ опасного хищника.
- source_word: בְסֻכֹּה
  choice: в своём укрытии
  rationale: סֻכָּה здесь может обозначать укрытие, логово или скрытое место среди зарослей. «Укрытие» не сужает многозначность слова до конкретного вида львиного убежища.
- source_word: לַחֲטוֹף
  choice: чтобы схватить
  rationale: חטף выражает внезапный и насильственный захват. «Схватить» ясно и естественно передаёт это действие.
- source_word: עָנִי
  choice: бедного
  rationale: עָנִי может означать бедного, угнетённого или несчастного. В контексте социальной жестокости псалма «бедного» является прямым переводом и сохраняет представление о беззащитности жертвы.
- source_word: יַחְטֹף
  choice: хватает
  rationale: Повтор того же корня חטף передан тем же русским глаголом для сохранения поэтического усиления.
- source_word: בְּמָשְׁכוֹ
  choice: затягивая его
  rationale: Инфинитивная конструкция с בְּ может обозначать средство или сопутствующее обстоятельство. «Затягивая» естественно связывает захват жертвы с образом сети, сохраняя насильственный оттенок משך.
- source_word: בְּרִשְׁתּוֹ
  choice: в свою сеть
  rationale: רֶשֶׁת означает сеть. Хотя предлог буквально допускает значения «в» или «посредством», в сочетании с «затягивая» по-русски естественно указать движение внутрь сети.
