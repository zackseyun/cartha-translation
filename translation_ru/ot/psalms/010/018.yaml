lexical_decisions:
- source_word: לִשְׁפֹּט
  choice: судить по праву
  rationale: Инфинитив выражает цель Божьего действия в предыдущем контексте. Сочетание сохраняет судебный смысл שׁפט и ясно передаёт правосудие в защиту уязвимых.
- source_word: יָתוֹם
  choice: сироту
  rationale: יָתוֹם обозначает ребёнка, лишённого отца или родителей; «сирота» — естественный и устойчивый русский эквивалент.
- source_word: דַּךְ
  choice: угнетённого
  rationale: Слово описывает придавленного, униженного или бедствующего человека; «угнетённый» естественно передаёт его социальную и переживаемую уязвимость.
- source_word: בַּל יוֹסִיף עוֹד
  choice: чтобы ... больше не
  rationale: Отрицательная конструкция с יסף и עוֹד выражает прекращение дальнейшего или повторного действия; по-русски это естественно передаётся оборотом «чтобы больше не».
- source_word: לַעֲרֹץ
  choice: наводил ужас
  rationale: ערץ означает внушать страх, приводить в ужас. Оборот «наводить ужас» сохраняет эту силу и не смешивает значение с угнетением.
- source_word: אֱנוֹשׁ מִן הָאָרֶץ
  choice: земной человек
  rationale: אֱנוֹשׁ подчёркивает смертность и бренность человека, а מִן הָאָרֶץ — его земное происхождение или принадлежность земле. «Земной человек» звучит естественно и сохраняет противопоставление Богу.
theological_decisions:
- issue: Обобщающее единственное число אֱנוֹשׁ
  choice: земной человек
  alternative: смертный, происходящий из земли
  rationale: Сохранено единственное число и человеческая бренность без сведения выражения к конкретному мужчине или к отвлечённому «человечеству».
- issue: Связь заключительной цели с Божьим правосудием
  choice: чтобы ... больше не наводил ужас
  alternative: и земной человек больше не будет наводить ужас
  rationale: בַּל допускает оттенок цели или результата. Конструкция «чтобы» сохраняет связь с предшествующим инфинитивом и не превращает высказывание в однозначное предсказание.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Формулировка сохраняет судебную лексику, цель/результат заключительной части и образ бренного человека, связанного с землёй.
