  text: רָשָׁ֗ע כְּ/גֹ֣בַהּ אַ֭פּ/וֹ בַּל יִדְרֹ֑שׁ אֵ֥ין אֱ֝לֹהִ֗ים כָּל מְזִמּוֹתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/004.yaml
  text: In the pride of his face[a], the wicked man does not seek; all his thoughts are[b], “There is no God.”
translation:
  language: ru
  text: 'С надменным видом[a] нечестивый не ищет Бога; все его помыслы: «Бога нет»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «при высоте его носа (или лица)» — образ надменности и гордой осанки.'
    reason: cultural_note
  - marker: b
    text: 'Возможно и другое понимание: «Во всех его помыслах нет Бога». Еврейский текст может говорить не о прямой мысли «Бога нет», а о полном отсутствии Бога в мышлении нечестивого.'
    reason: alternative_reading
lexical_decisions:
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Субстантивированное прилагательное мужского рода в единственном числе изображает одного типичного нечестивца; русское «нечестивый» сохраняет и единственное число, и обобщающий характер.
- source_word: כְּגֹבַהּ אַפּוֹ
  choice: с надменным видом
  rationale: Буквальный образ «при высоте его носа/лица» выражает гордую осанку или надменное выражение лица. «С надменным видом» естественно передаёт идиому, а конкретный образ поясняется в сноске.
- source_word: בַּל יִדְרֹשׁ
  choice: не ищет Бога
  rationale: Поэтическое отрицание с имперфектом описывает характерное поведение. У глагола «искать» объект в еврейском тексте не выражен, но из следующей части ясно, что подразумевается Бог; в русском объект добавлен для связности.
- source_word: אֵין אֱלֹהִים
  choice: «Бога нет»
  rationale: Экзистенциальное отрицание передано краткой прямой формулой, естественной по-русски и соответствующей возможному содержанию помыслов нечестивого.
- source_word: כָּל מְזִמּוֹתָיו
  choice: все его помыслы
  rationale: מְזִמּוֹת может обозначать мысли, замыслы или планы. «Помыслы» охватывает внутренний строй мышления, не сужая смысл до злых козней.
theological_decisions:
- issue: Синтаксическая связь заключительной части стиха
  choice: '«все его помыслы: „Бога нет“» — слова אֵין אֱלֹהִים поняты как содержание мыслей нечестивого.'
  alternative: «Богу нет места ни в одном из его помыслов» — слова могут описывать отсутствие Бога во всём его мышлении, а не прямо цитировать отрицание Его существования.
  rationale: Порядок слов допускает обе трактовки. Основной текст сохраняет резкую формулу «Бога нет», а давняя и грамматически возможная альтернатива приведена в сноске, чтобы не устранять подлинную неоднозначность.
- issue: Невыраженный объект глагола יִדְרֹשׁ
  choice: В русском основном тексте добавлено «Бога».
  alternative: 'Оставить без объекта: «не ищет».'
  rationale: В еврейской строке прямого объекта нет, однако следующая часть непосредственно называет Бога. Русское «не ищет» без объекта звучит незавершённо; добавление восстанавливает подразумеваемую связь, не вводя иного референта.
translation_notes:
  register: Современный литературный русский язык с кратким, поэтически ёмким синтаксисом. «Нечестивый» и «помыслы» сохраняют достоинство псалмового регистра, оставаясь понятными современному читателю; архаические обороты устранены.
