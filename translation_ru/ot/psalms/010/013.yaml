  text: עַל מֶ֤ה נִאֵ֖ץ רָשָׁ֥ע אֱלֹהִ֑ים אָמַ֥ר בְּ֝/לִבּ֗/וֹ לֹ֣א תִּדְרֹֽשׁ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/013.yaml
  text: Why does the wicked man despise God? He says in his heart, “You will not call to account.”
translation:
  language: ru
  text: 'Почему нечестивый презирает Бога? Он говорит в сердце своём: «Ты не призовёшь к ответу».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты не станешь разыскивать (виновного)»; также возможно: «Ты не потребуешь ответа».'
    reason: Еврейский глагол דרש может означать разыскивать, расследовать, требовать ответа или привлекать к ответственности; при отсутствии дополнения точный оттенок остаётся открытым.
lexical_decisions:
- source_word: רָשָׁע
  choice: нечестивый
  rationale: Передаёт нравственно-религиозную характеристику человека и естественно звучит в поэтическом библейском контексте.
- source_word: נִאֵץ
  choice: презирает
  rationale: Глагол выражает пренебрежение и неуважение к Богу; настоящее время соответствует контексту и русской речи.
- source_word: בְּלִבּוֹ
  choice: в своём сердце
  rationale: Сохраняет древнееврейский образ внутренней мысли и намерения.
- source_word: לֹא תִּדְרֹשׁ
  choice: Ты не взыщешь
  rationale: 'Кратко сохраняет смысл דרש: Бог не станет искать ответа, расследовать дело или привлекать к ответу; неоднозначность пояснена в сноске.'
theological_decisions:
- issue: Смысл утверждения нечестивого о Божьем действии
  choice: «Ты не взыщешь»
  alternative: «Ты не призовёшь к ответу» / «Ты не потребуешь отчёта»
  rationale: Форма второго лица обращена к Богу и передаёт дерзкое внутреннее убеждение нечестивого. Более широкий смысл исходного глагола не сводится исключительно к формальному отчёту.
translation_notes:
  register: Современный литературный русский с сохранением достоинства псалмовой речи. Лаконичная формулировка следует риторическому вопросу оригинала; местоимение «Ты» обозначает Бога.
