source:
  edition: WLC
  text: רָאִ֡תָה כִּֽי אַתָּ֤ה עָ֘מָ֤ל וָ/כַ֨עַס תַּבִּיט֮ לָ/תֵ֪ת בְּ/יָ֫דֶ֥/ךָ עָ֭לֶי/ךָ יַעֲזֹ֣ב חֵלֶ֑כָה יָ֝ת֗וֹם אַתָּ֤ה הָיִ֬יתָ עוֹזֵֽר־׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/014.yaml
  text: You have seen[a], for you look upon trouble and grief, to take it into your hand. The helpless commits himself to you[c][b]; you have been the helper of the fatherless.
translation:
  language: ru
  text: Ты видишь, ведь Ты взираешь на беду и горе, чтобы взять их в Свои руки[a]. Беспомощный вверяет себя Тебе[b]; Ты был помощником сироты[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы положить в Свою руку». Оборот может означать, что Бог принимает это дело и приступает к действию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Беспомощный оставляет своё дело Тебе». Еврейский текст допускает, что Богу доверяется либо сам человек, либо его дело.'
    reason: alternative_reading
  - marker: c
    text: Еврейское слово может быть передано также как «лишённый отца».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאִתָה
  choice: Ты видишь
  rationale: Форма Qal perfect 2 м. ед. обращена к Богу и утверждает несомненность Его видения. В русском контексте настоящее время естественно передаёт не разовое действие в прошлом, а постоянную осведомлённость Бога.
- source_word: עָמָל וָכַעַס
  choice: беду и горе
  rationale: В жалобном псалме עָמָל обозначает тяготу, бедствие или причиняемое зло, а כַעַס — мучение, огорчение, вызванное этим злом. Сочетание «беду и горе» естественно и не сводит כַעַס к Божьему гневу.
- source_word: תַּבִּיט
  choice: Ты замечаешь
  rationale: Hiphil от נבט выражает внимательный взгляд, не просто зрительное восприятие. «Замечаешь» передаёт сознательное внимание и не звучит архаично.
- source_word: לָתֵת בְּיָדֶךָ
  choice: чтобы взять дело в Свои руки
  rationale: 'Буквально оборот означает «положить/дать в Твою руку». Русская идиома передаёт вероятный контекстуальный смысл: Бог принимает дело к рассмотрению и действию, не уточняя способ вмешательства.'
- source_word: עָלֶיךָ יַעֲזֹב
  choice: Тебе вверяет себя
  rationale: Конструкция с עזב и עַל здесь выражает доверение себя или своего дела Богу. «Вверяет себя» сохраняет мотив зависимости и не создаёт значения оставленности Богом.
- source_word: חֵלֶכָה
  choice: несчастный
  rationale: Редкое существительное обозначает слабого, обездоленного или несчастного человека. «Несчастный» достаточно широко сохраняет эту уязвимость.
- source_word: יָתוֹם
  choice: сироте
  rationale: Слово обозначает ребёнка, лишённого отца, и шире — сироту как особо уязвимого члена общества. Основной текст использует естественное современное русское слово.
- source_word: עוֹזֵר
  choice: помощником
  rationale: Причастие употреблено как личное обозначение Бога — Того, кто помогает. «Помощником» кратко и прямо сохраняет эту предикативную форму.
theological_decisions:
- issue: Означает ли Божий взгляд только наблюдение или ведёт к вмешательству
  choice: Бог видит страдание и берёт дело в Свои руки
  alternative: Бог видит беду и горе, чтобы положить их в Свою руку
  rationale: Инфинитив לָתֵת с выражением «в руку» вероятнее указывает на принятие дела для действия. Перевод передаёт деятельное участие, но не определяет заранее форму суда или помощи; буквальная конструкция отмечена в сноске.
- issue: Что именно несчастный доверяет Богу
  choice: Несчастный вверяет Богу себя
  alternative: Несчастный оставляет Богу своё дело
  rationale: В еврейском тексте возможно отнести доверение как к самому человеку, так и к его делу. В основном тексте выбран личный смысл, соответствующий непосредственному параллелизму с сиротой, а предметная альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи, без архаизмов. Заглавные местоимения в обращении к Богу соответствуют принятой русской библейской стилистике. «Всегда» естественно передаёт устойчивый опыт, выраженный конструкцией הָיִיתָ עוֹזֵר, не превращая её в отвлечённое наименование.
