  text: לָ/מָ֣ה יְ֭הוָה תַּעֲמֹ֣ד בְּ/רָח֑וֹק תַּ֝עְלִ֗ים לְ/עִתּ֥וֹת בַּצָּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/001.yaml
  text: Why[a], Yahweh, do you stand far away? Why do you hide yourself in times of trouble?
translation:
  language: ru
  text: Почему, Яхве, Ты стоишь вдали? Почему скрываешься[a] во времена бедствий?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скрываешь Себя».'
    reason: Еврейский глагол может быть передан возвратной формой «скрываешься» или явной конструкцией со значением «скрывать Себя».
lexical_decisions:
- source_word: לָמָה
  choice: Почему
  rationale: Краткое вопросительное слово сохраняет прямоту и эмоциональную силу жалобы псалмопевца.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: תַּעֲמֹד
  choice: Ты стоишь
  rationale: Сохраняет буквальный пространственный образ еврейского глагола עמד, не сводя его лишь к бездействию.
- source_word: בְּרָחוֹק
  choice: вдали
  rationale: Естественно по-русски передаёт ощущение удалённости Бога и сохраняет пространственную метафору.
- source_word: תַּעְלִים
  choice: скрываешься
  rationale: 'Естественно выражает подразумеваемое возвратное значение: Бог воспринимается молящимся как скрывающий Себя.'
- source_word: לְעִתּוֹת
  choice: во времена
  rationale: Передаёт множественное число עת и временную функцию предложной конструкции.
- source_word: בַּצָּרָה
  choice: бедствия
  rationale: «Бедствие» охватывает значения нужды, скорби и тяжёлых обстоятельств, не сужая их до конкретного вида страдания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет его как имя, а не заменяет титулом.
- issue: Повтор вопросительного слова во второй строке
  choice: Повторить «Почему»
  alternative: 'Оформить вторую строку без повторного вопросительного слова: «скрываешься во времена бедствия»'
  rationale: Хотя второе לָמָה в еврейском тексте не повторено, поэтический параллелизм распространяет вопрос на обе части стиха; повтор делает это ясным по-русски, не устраняя напряжённости жалобы.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтической прямоты молитвенной жалобы. Местоимение «Ты» написано с прописной буквы по принятой русской традиции благоговейного обращения к Богу; пространственные образы «стоишь вдали» и «скрываешься» сохранены.
