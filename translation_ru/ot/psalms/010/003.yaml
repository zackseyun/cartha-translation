    text: 'В еврейском тексте объект глагола «благословляет» не назван, а синтаксическая связь заключительных слов спорна. Возможны, в частности, такие понимания: «нечестивый благословляет корыстолюбца, которого презирает ГОСПОДЬ» или «корыстолюбец проклинает (эвфемистически: „благословляет“) и презирает ГОСПОДА».'
    reason: Сноска сохраняет существенную синтаксическую и лексическую неоднозначность בֵּרֵךְ נִאֵץ יהוה, не приписывая альтернативному чтению неверные субъект и объект.
lexical_decisions:
- source_word: הִלֵּל
  choice: хвалится
  rationale: Порода piel от הלל здесь передаёт хвастовство нечестивого; возвратная русская форма естественно выражает этот смысл.
- source_word: תַּאֲוַת נַפְשׁוֹ
  choice: желаниями своей души
  rationale: Сохраняет образный язык оригинала и допускает как страстное желание, так и вожделение, не сужая значение без необходимости.
- source_word: בֹצֵעַ
  choice: корыстолюбец
  rationale: Слово обозначает человека, жадного до неправедной выгоды; «корыстолюбец» передаёт нравственную окраску и остаётся понятно современному читателю.
- source_word: בֵּרֵךְ
  choice: благословляет себя
  rationale: У глагола буквально значение «благословлять»; возвратное дополнение следует вероятному синтаксическому пониманию и согласуется с параллельным самовосхвалением, однако неоднозначность отмечена в сноске.
- source_word: נִאֵץ
  choice: презирает
  rationale: Передаёт дерзкое пренебрежение и поношение в данном контексте естественным русским глаголом.
- source_word: יהוה
  choice: ГОСПОДА
  rationale: Тетраграмматон передан традиционным русским титулом прописными буквами, позволяющим отличить его от обычного אֲדֹנָי.
theological_decisions:
- issue: Кто является объектом глагола «благословляет» и как он связан с «презирает ГОСПОДА»
  choice: «благословляет себя и презирает ГОСПОДА»
  alternative: «благословляет того, кто презирает ГОСПОДА» или «благословляет, но презирает ГОСПОДА»
  rationale: Масоретский текст допускает различные синтаксические прочтения. Основной текст сохраняет последовательность действий одного нечестивца, соответствующую параллелизму, а существенная неоднозначность вынесена в сноску.
translation_notes:
