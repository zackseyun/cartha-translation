  text: אָמַ֣ר בְּ֭/לִבּ/וֹ שָׁ֣כַֽח אֵ֑ל הִסְתִּ֥יר פָּ֝נָ֗י/ו בַּל רָאָ֥ה לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/011.yaml
  text: He says in his heart[a], “God has forgotten; he has hidden his face; he will never see.”
translation:
  language: ru
  text: 'Он говорит в своём сердце[a]: «Бог забыл, скрыл Своё лицо и никогда не увидит».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он сказал в своём сердце: “Бог забывает, скрывает Своё лицо и вовек не увидит”». Еврейские формы совершенного вида в поэзии допускают как настоящее, так и прошедшее либо результативное понимание.'
    reason: лексическая и временная альтернатива
lexical_decisions:
- source_word: אָמַר
  choice: говорит
  rationale: Перфект qal 3-го лица ед. числа в поэтическом описании может иметь настоящее, гномическое значение; настоящее время передаёт продолжающиеся внутренние рассуждения нечестивого.
- source_word: בְּלִבּוֹ
  choice: в своём сердце
  rationale: Сохранён естественный для русского библейского языка образ внутренней речи; возвратное местоимение ясно соотносит сердце с говорящим.
- source_word: שָׁכַח
  choice: забыл
  rationale: Основное значение глагола — «забыть». Русское прошедшее совершенного вида естественно выражает предполагаемый завершившийся поступок Бога и его нынешнее следствие.
- source_word: אֵל
  choice: Бог
  rationale: Обычное обозначение Бога; перевод без дополнительного истолкования значения силы.
- source_word: הִסְתִּיר פָּנָיו
  choice: скрыл Своё лицо
  rationale: Сохранён конкретный древнееврейский образ сокрытия лица, который подразумевает отсутствие внимания или вмешательства, но не сводится в тексте к одному толкованию.
- source_word: בַּל ... לָנֶצַח
  choice: никогда не
  rationale: Сочетание отрицания с выражением длительности естественно передаётся по-русски как категорическое «никогда не».
- source_word: רָאָה
  choice: увидит
  rationale: Сохранено основное значение «видеть»; возможный контекстуальный смысл «заметить и взыскать» не внесён непосредственно в перевод.
theological_decisions:
- issue: Антропоморфный образ Бога, скрывающего лицо
  choice: Сохранить выражение «скрыл Своё лицо»
  alternative: «отвернулся» или «перестал обращать внимание»
  rationale: Буквенный образ богословски содержателен и понятен современному читателю; более объяснительный вариант преждевременно сужает смысл.
- issue: Временная отнесённость еврейских перфектов в поэзии
  choice: Начать с настоящего «говорит», а последующие действия передать как «забыл, скрыл»
  alternative: «Сказал… Бог забывает… скрывает… никогда не увидит»
  rationale: Так естественно передаётся текущая внутренняя речь и уверенность нечестивого в уже наступившем Божьем бездействии, при этом допустимая временная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемого библейского образа «скрыть лицо». Синтаксис краткий и энергичный, соответствующий поэтическому обвинению; местоимение «Своё» оформлено с традиционной прописной буквы при указании на Бога.
