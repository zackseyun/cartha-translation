  yaml_path: translation/ot/psalms/010/006.yaml
  text: He says in his heart[a], “I will not be shaken[b]; through generation after generation I will not be in trouble.”
translation:
  language: ru
  text: 'Он говорит в своём сердце: «Не поколеблюсь; из рода в род не постигнет меня беда[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская заключительная фраза эллиптична. Возможен также перевод: «из рода в род я не буду в беде»; при относительном понимании: «из рода в род — человек, не знающий беды».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמַר
  choice: Он говорит
  rationale: Перфект в поэтическом описании передаёт живо представленную внутреннюю речь нечестивого; настоящее время естественно по-русски.
- source_word: בְּלִבּוֹ
  choice: в своём сердце
  rationale: Сохраняет древнееврейский образ внутренней мысли и при этом понятно современному читателю.
- source_word: בַּל אֶמּוֹט
  choice: не поколеблюсь
  rationale: Глагол מוט в нифале означает быть поколебленным, сдвинутым или утратить устойчивость; «не поколеблюсь» естественно сохраняет метафору уверенности в собственной незыблемости.
- source_word: לְדֹר וָדֹר
  choice: из рода в род
  rationale: Устойчивое русское выражение передаёт продолжение во многих поколениях, не усиливая его до безусловного «вечно».
- source_word: אֲשֶׁר לֹא בְרָע
  choice: не постигнет меня беда
  rationale: Конечная часть эллиптична. Формулировка раскрывает подразумеваемое продолжение хвастливой речи от первого лица и передаёт רָע как бедствие или несчастье.
theological_decisions:
- issue: Эллиптическая заключительная часть и перспектива говорящего
  choice: 'Продолжить прямую речь от первого лица: «не постигнет меня беда».'
  alternative: «из рода в род — тот, кто не знает беды» либо более буквально «который не в беде».
  rationale: Контекст поддерживает непрерывную внутреннюю речь нечестивого, однако синтаксис еврейского текста допускает относительное прочтение; неоднозначность отмечена в сноске, а не устранена без оговорки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «В своём сердце» сохраняет исходный образ, «не поколеблюсь» — метафору устойчивости, а краткая прямая речь передаёт самоуверенный тон нечестивого.
