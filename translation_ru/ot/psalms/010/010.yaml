lexical_decisions:
- source_word: ו/דכה
  choice: Он пригибается
  rationale: Форма и значение трудны, однако в сочетании со следующим יָשֹׁחַ и с образом хищника в ближайшем контексте наиболее вероятно описание низкой, затаившейся позы нечестивого. «Пригибается» естественно передаёт это по-русски, не усиливая образ до явно не названного «крадётся».
- source_word: יָשֹׁחַ
  choice: припадает к земле
  rationale: Глагол обозначает склонение или опускание вниз. В данном контексте выражение передаёт телесную позу и естественно продолжает «пригибается», сохраняя параллелизм без буквального повтора.
- source_word: וְ/נָפַל ... חלכאים
  choice: и беспомощные падают
  rationale: Хотя глагол имеет форму 3-го лица мужского рода единственного числа, сжатый и трудный синтаксис допускает понимание חלכאים как смыслового подлежащего. Такое прочтение лучше соответствует контексту, где нечестивый охотится на беззащитных; грамматическая альтернатива отмечена в сноске.
- source_word: בַּ/עֲצוּמָיו
  choice: под его силой
  rationale: Буквальная множественная форма с суффиксом может означать «его сильными», но здесь, вероятно, выражает могущество или средства насилия нечестивого. «Под его силой» звучит естественно по-русски и передаёт, что беспомощные оказываются повержены его мощью, тогда как буквальное и образное прочтения сохранены в сноске.
- source_word: חלכאים
  choice: беспомощные
  rationale: Слово обозначает слабых, несчастных и уязвимых людей. «Беспомощные» ясно и современно выражает их беззащитность в контексте псалма.
