source:
  edition: WLC
  text: יָ֘חִ֤ילוּ דרכ/ו בְּ/כָל עֵ֗ת מָר֣וֹם מִ֭שְׁפָּטֶי/ךָ מִ/נֶּגְדּ֑/וֹ כָּל צ֝וֹרְרָ֗י/ו יָפִ֥יחַ בָּ/הֶֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/005.yaml
  text: His ways prosper at all times[a]; your judgments are on high, out of his sight; as for all his adversaries[b], he snorts at them.
translation:
  language: ru
  text: Во всякое время пути его успешны[a]; Твои суды высоко, вне поля его зрения; на всех своих противников он презрительно фыркает[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пути его всегда прочны». Еврейский глагол труден для истолкования; его также связывали со значением корчей или мук, однако контекст скорее указывает на неизменный успех или устойчивое положение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «фыркает на них» или «пышет на них» — яркий образ презрения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָחִילוּ
  choice: успешны
  rationale: Значение глагола в этом месте не вполне ясно. В контексте жалобы на благополучие нечестивого прилагательное «успешны» естественно передаёт мысль о постоянном успехе его дел, не устраняя альтернативу «прочны» из примечания.
- source_word: דרכו
  choice: пути его
  rationale: Еврейская идиома обозначает образ действий и жизненный ход; буквальный поэтический образ «пути» естественен и понятен по-русски.
- source_word: בכל עת
  choice: во всякое время
  rationale: Формальная и ясная передача значения постоянства.
- source_word: מרום
  choice: высоко
  rationale: Сохраняет пространственный образ высоты и связанной с ней удалённости Божьих судов от восприятия нечестивого.
- source_word: משפטיך
  choice: Твои суды
  rationale: Передаёт как Божьи судебные решения, так и Его справедливые действия, не сужая смысл до законоположений.
- source_word: מנגדו
  choice: вне его взора
  rationale: В сочетании с «высоко» выражает недоступность Божьих судов его восприятию, сохраняя зрительно-пространственный образ.
- source_word: כל צורריו
  choice: всех своих противников
  rationale: Нейтрально и точно обозначает всех, кто ему противостоит, при этом подходит к возвышенному поэтическому регистру.
- source_word: יפיח בהם
  choice: он презрительно фыркает
  rationale: Сохраняет яркий телесный образ выдоха или фырканья; наречие проясняет выраженное этим жестом презрение, не заменяя образ отвлечённым «насмехается».
theological_decisions:
- issue: Смысл יָחִילוּ применительно к положению нечестивого
  choice: Его пути постоянно успешны.
  alternative: Его пути всегда прочны или устойчивы; менее вероятно — глагол связан с корчами или мучением.
  rationale: 'Псалом сетует на кажущееся благополучие и самоуверенность нечестивого: Божьи суды представляются ему далёкими, а к противникам он относится с презрением. Значение успеха лучше всего соответствует этому контексту, тогда как подлинная лексическая неопределённость отмечена в сноске.'
- issue: Удалённость Божьих судов
  choice: Высота судов представлена как их нахождение вне поля зрения нечестивого.
  alternative: Божьи суды возвышенны или слишком высоки для него.
  rationale: Перевод сохраняет пространственную метафору и не утверждает, будто Божьи суды объективно отсутствуют или неприменимы; речь идёт о положении дел с точки зрения и восприятия нечестивого.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатого поэтического строя, пространственной метафоры высоты и выразительного образа фырканья. Заглавное «Твои» следует принятой русской библейской традиции обращения к Богу.
