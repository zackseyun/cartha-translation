    reason: lexical_alternative
lexical_decisions:
- source_word: אָלָה
  choice: проклятий
  rationale: В контексте враждебной речи существительное обозначает проклятия, а не нейтральную клятву; множественное число естественно сочетается по-русски с оборотом «уста полны».
- source_word: פִּיהוּ
  choice: его уста
  rationale: Сохраняет телесный образ еврейского текста и соответствует возвышенному, но понятному русскому библейскому регистру.
- source_word: מָלֵא
  choice: полны
  rationale: Передаёт состояние наполненности кратко и естественно.
- source_word: מִרְמוֹת
  choice: обмана
  rationale: Собирательное существительное естественно передаёт множественную форму со значением обманных и вероломных действий или речей.
- source_word: תֹךְ
  choice: притеснения
  rationale: Здесь слово обозначает причиняющее вред угнетение или неправду; «притеснение» сохраняет социальную направленность зла и не дублирует «обман».
- source_word: תַּחַת לְשׁוֹנוֹ
  choice: под языком у него
  rationale: Сохраняет яркую метафору скрытого или готового выйти наружу зла.
- source_word: עָמָל
  choice: беда
  rationale: В данном контексте речь не об обычном труде, а о пагубе или беде, которую несёт нечестивый.
- source_word: אָוֶן
  choice: беззаконие
  rationale: Передаёт нравственное зло и неправедность слова, сохраняя его весомость в параллели с עָמָל.
