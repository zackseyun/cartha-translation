    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֹר
  choice: Сломи
  rationale: Повелительная форма, обращённая к Богу. «Сломи» естественно передаёт силу просьбы и сохраняет образ, не усиливая его до «сокруши».
- source_word: זְרוֹעַ
  choice: руку
  rationale: Буквально «рука» как образ силы и способности причинять зло. Конкретная поэтическая метафора сохранена.
- source_word: רָשָׁע
  choice: нечестивому
  rationale: Субстантивированное прилагательное обозначает нечестивого человека; дательный падеж обусловлен русским управлением «сломить руку кому».
- source_word: וָרָע
  choice: и злому человеку
  rationale: Передано как второй характеризующий оборот, согласованный с единственным числом последующего местоимения «его». Сноска сохраняет возможное понимание как отдельного субстантивированного обозначения — «злодею».
- source_word: תִּדְרוֹשׁ
  choice: разыщи
  rationale: Глагол דרש означает искать, разыскивать, исследовать или взыскивать. «Разыщи» сохраняет прямой образ настойчивого поиска и допускает судебный оттенок контекста.
- source_word: רִשְׁעוֹ
  choice: его нечестие
  rationale: Сохраняет лексическую связь с רָשָׁע и передаёт как злые дела, так и виновность нечестивого.
- source_word: בַל תִּמְצָא
  choice: пока больше ничего не найдёшь
  rationale: 'Естественная русская передача желаемого предела поиска: зло должно быть полностью обнаружено и устранено. Добавленное «ничего» лишь выражает подразумеваемый объект отрицательного глагола и не уточняет способ исчезновения нечестия.'
theological_decisions:
- issue: Образ «руки» нечестивого
  choice: Сохранить конкретное «руку»
  alternative: Передать отвлечённо как «силу» или «власть»
  rationale: Просьба подразумевает лишение угнетателя способности творить зло, но сам еврейский текст выражает это поэтическим образом руки; перевод не заменяет образ толкованием.
- issue: Связь רָשָׁע וָרָע
  choice: 'Понять как два определения одного представительного лица: «нечестивому и злому человеку»'
  alternative: 'Понять как два субстантивированных обозначения: «нечестивцу и злодею»'
  rationale: Единственное число «его нечестие» поддерживает чтение как характеристики одного лица, однако синтаксис допускает и два параллельных обозначения; эта неоднозначность отмечена в сноске.
- issue: Смысл заключительного בַל תִּמְצָא
  choice: «пока больше ничего не найдёшь»
  alternative: «чтобы ты не нашёл его» или «и не найдёшь»
  rationale: Основной перевод выражает желаемый итог Божьего разыскания и суда, не утверждая отдельно, означает ли это устранение злых дел, исчерпание вины или исчезновение самого нечестия.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Сохранены повелительное обращение к Богу, телесный образ руки и намеренно напряжённая формулировка о поиске нечестия; архаизмы вроде «мышца» и отвлечённые пояснительные замены избегаются.
