lexical_decisions:
- source_word: תַּאֲוַת
  choice: желание
  rationale: Существительное обозначает желание или стремление; «желание» естественно звучит в молитвенном контексте и не усиливает эмоциональную окраску исходного слова.
- source_word: עֲנָוִים
  choice: смиренных
  rationale: Слово может обозначать смиренных, кротких или угнетённых. «Смиренных» сохраняет значение приниженности и внутреннего смирения, не исключая контекст притеснения в псалме.
- source_word: שָׁמַעְתָּ
  choice: Ты услышал
  rationale: Перфект указывает на совершившееся действие, значимое для настоящей молитвы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: תָּכִין
  choice: Ты укрепишь
  rationale: Порода хифиль глагола כון может означать сделать твёрдым, утвердить или приготовить. В сочетании с сердцем «укрепишь» естественно передаёт идею придания стойкости, сохраняя альтернативы в сноске.
- source_word: לִבָּם
  choice: их сердце
  rationale: Сохранены как конкретный библейский образ «сердце», так и единственное число еврейского собирательного выражения.
- source_word: תַּקְשִׁיב
  choice: будет внимать
  rationale: Глагол выражает внимательное слушание; «внимать» точно сочетается с сохранённым образом уха и соответствует достоинству поэтической речи.
- source_word: אָזְנֶךָ
  choice: Твоё ухо
  rationale: Сохранён конкретный поэтический антропоморфный образ исходного текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; передача «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Значение עֲנָוִים в контексте
  choice: смиренных
  alternative: угнетённых; кротких
  rationale: Контекст говорит о притесняемых, но само слово также несёт значение смирения и кротости. Основной текст и сноска сохраняют эту смысловую напряжённость.
- issue: Значение תָּכִין применительно к сердцу
  choice: укрепишь
  alternative: утвердишь; приготовишь
  rationale: Глагол допускает значения укрепления, утверждения и приготовления. «Укрепишь» передаёт придание сердцу твёрдости, не объявляя остальные значения невозможными.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Сохранены прямое обращение к Яхве, конкретный образ уха и собирательное единственное число «их сердце».
