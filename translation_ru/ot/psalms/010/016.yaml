  text: Яхве — Царь во веки веков; народы исчезли с его земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с его земли» в значении «с земли в целом». Еврейское слово может означать как страну или территорию, так и землю в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет форму исходного текста и не заменяет имя титулом.
- source_word: מֶלֶךְ
  choice: Царь
  rationale: Именное сказуемое передано существительным; тире обеспечивает естественный русский синтаксис.
- source_word: עוֹלָם וָעֶד
  choice: во веки веков
  rationale: Устойчивое и понятное русское выражение сохраняет усиленное указание на бесконечную продолжительность.
- source_word: אָבְדוּ
  choice: исчезли
  rationale: Глагол אָבַד может обозначать гибель, уничтожение или исчезновение. В сочетании с מִן («из») значение «исчезли из» естественно передаёт завершённое устранение народов, не вводя прямо не выраженного деятеля уничтожения.
- source_word: גּוֹיִם
  choice: народы
  rationale: Здесь речь идёт о народах, а не о «язычниках» как специально очерченной религиозной категории.
- source_word: מֵאַרְצוֹ
  choice: из Его земли
  rationale: אֶרֶץ допускает значения «земля» как страна/территория и «земля» как весь мир. Русское «земля» сохраняет часть этой многозначности; местоимение указывает на принадлежность Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Исходный текст содержит личное имя; транслитерация «Яхве» сохраняет его и не подменяет титулом.
- issue: Объём значения אַרְצוֹ
  choice: Его земли
  alternative: Его страны; Его мира
  rationale: Фраза может обозначать конкретную землю, принадлежащую Яхве, либо всю землю как Его владение. Основной текст сохраняет естественное русское «земля», а примечание явно отмечает более широкий вариант.
translation_notes:
  register: Современный литературный русский с достоинством поэтической декларации. Сохранён параллелизм двух кратких утверждений; архаизирующее «во веки веков» здесь остаётся общеупотребительным библейским оборотом.
