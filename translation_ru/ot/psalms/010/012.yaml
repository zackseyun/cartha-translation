  text: קוּמָ֤/ה יְהוָ֗ה אֵ֭ל נְשָׂ֣א יָדֶ֑/ךָ אַל תִּשְׁכַּ֥ח עניים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/012.yaml
  text: Rise up[a], O Yahweh; O God, lift up your hand. Do not forget the afflicted.
translation:
  language: ru
  text: Восстань, Яхве! Боже, подними Свою руку; не забудь угнетённых[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бедных», «униженных» или «страдающих». Еврейское слово может обозначать людей, доведённых до бедственного, униженного и уязвимого положения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּמָה
  choice: Восстань
  rationale: Повелительная форма глагола קום выражает настойчивый призыв к Богу вмешаться. «Восстань» сохраняет поэтическую силу оригинала и остаётся понятным в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֵל
  choice: Боже
  rationale: Форма обращения передаёт вокатив и сохраняет поэтический параллелизм с обращением «Яхве».
- source_word: נְשָׂא יָדֶךָ
  choice: подними Свою руку
  rationale: Сохранён конкретный антропоморфный образ поднятой руки как готовности действовать; значение не раскрывается толкованием внутри текста.
- source_word: אַל תִּשְׁכַּח
  choice: не забудь
  rationale: Прямая передача отрицательного волеизъявления сохраняет еврейский образ; вариант «не оставь без внимания» был бы более истолковательным.
- source_word: עניים
  choice: угнетённых
  rationale: В контексте псалма речь идёт о людях, доведённых до бедственного и уязвимого положения действиями нечестивых. Выбор передаёт контекст, а более широкий смысловой диапазон отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Образ поднятой руки Бога
  choice: сохранить как «подними Свою руку»
  alternative: «вмешайся» или «яви Свою силу»
  rationale: Оригинал использует телесный поэтический образ, который может подразумевать суд, избавление или иное решительное действие; перевод не должен устранять эту смысловую открытость.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Краткие повелительные формы и конкретный образ руки сохранены; местоимение, относящееся к Богу, написано с прописной буквы по принятой русской библейской традиции.
