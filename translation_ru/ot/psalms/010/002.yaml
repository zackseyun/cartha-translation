base_translation:
  language: en
  yaml_path: translation/ot/psalms/010/002.yaml
  text: In the pride of the wicked[a], the poor man is hotly pursued[b]; let them be caught in the schemes they have devised.
translation:
  language: ru
  text: В своей гордыне нечестивец неотступно преследует бедняка[a]; пусть нечестивцы сами попадутся в козни, которые задумали[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза синтаксически сжата. Возможно также: «Из-за гордыни нечестивца бедняка преследуют» или «в гордыне нечестивца бедняк терпит преследование».'
    reason: lexical_alternative
  - marker: b
    text: 'Или как утверждение: «они сами попадаются в козни, которые задумали». Еврейскую форму можно понять не как пожелание, а как сообщение о происходящем.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּגַאֲוַת
  choice: в своей гордыне
  rationale: Предлог ב передаёт обстоятельство или побуждение действия; «в своей гордыне» естественно по-русски выражает и состояние, и мотив нечестивца.
- source_word: רָשָׁע
  choice: нечестивец
  rationale: Субстантивированное прилагательное мужского рода в единственном числе обозначает типичного представителя нечестивых; русское «нечестивец» сохраняет это число и нравственную характеристику.
- source_word: יִדְלַק
  choice: яростно преследует
  rationale: Глагол דלק может означать гореть или гнаться по пятам. В контексте притеснения бедняка естествен смысл настойчивого, враждебного преследования; наречие «яростно» передаёт интенсивность образа.
- source_word: עָנִי
  choice: бедняка
  rationale: עָנִי обозначает бедного, угнетённого или страдающего человека. «Бедняк» сохраняет конкретный мужской единственный образ и соответствует контексту социальной уязвимости.
- source_word: יִתָּפְשׂוּ
  choice: пусть нечестивцы сами попадутся
  rationale: 'Нифаль несовершенного вида прочитан как пожелание о воздаянии: преследователи должны быть пойманы собственными кознями. Явное «нечестивцы» устраняет неясность русского местоимения при переходе от единственного к множественному числу, а «сами» подчёркивает заложенный в строке поворот замысла против замышлявших.'
- source_word: בִּמְזִמּוֹת
  choice: в козни
  rationale: מְזִמּוֹת здесь означает злонамеренные планы или интриги. «Козни» естественно сочетаются с «задумали» и сохраняют отрицательную окраску.
- source_word: זוּ
  choice: которые
  rationale: Относительная частица זוּ вводит придаточное, определяющее «козни».
- source_word: חָשָׁבוּ
  choice: задумали
  rationale: חשב обозначает обдумывание и составление плана; «задумали» передаёт намеренность злого умысла без лишнего уточнения.
theological_decisions:
- issue: Синтаксис первой половины стиха
  choice: Нечестивец выступает преследователем, а бедняк — объектом преследования.
  alternative: «Из-за гордыни нечестивца бедняка преследуют» или «в гордыне нечестивца бедняк терпит преследование».
  rationale: Еврейская строка предельно сжата, а דלק допускает выражение как активного преследования, так и переживаемой погони. Основной текст выбирает контекстуально ясное активное прочтение, но примечание сохраняет синтаксическую неоднозначность.
- issue: Модальная сила второй половины стиха
  choice: 'Пожелание или молитва о воздаянии: «пусть нечестивцы сами попадутся».'
  alternative: 'Утверждение: «они сами попадаются в козни, которые задумали».'
  rationale: Форма יִתָּפְשׂוּ может быть понята как юссивное пожелание либо как повествовательное утверждение. Молитвенное прочтение соответствует риторике псалма, но альтернативное значение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Лексика доступна широкому читателю; сохранены представительный единственный образ «нечестивец», переход к множественному числу во второй строке и подлинная неоднозначность модальности.
