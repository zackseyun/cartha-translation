lexical_decisions:
- source_word: יֵשֵׁב
  choice: сидит
  rationale: Сохраняет конкретный образ продолжительного пребывания; в сочетании «сидит в засаде» по-русски естественно передаёт выжидающую позу.
- source_word: בְּמַאְרַב
  choice: в засаде
  rationale: Передаёт значение засады или места, где скрытно поджидают жертву, естественным современным выражением.
- source_word: חֲצֵרִים
  choice: у селений
  rationale: В данном контексте множественное число, вероятнее всего, обозначает селения или поселения. Предлог «у» естественно рисует засаду рядом с населёнными местами, хотя еврейский בְּ допускает более буквальное «в».
- source_word: בַּמִּסְתָּרִים
  choice: в укромных местах
  rationale: Сохраняет конкретный множественный образ скрытых мест и звучит естественно по-русски.
- source_word: יַהֲרֹג
  choice: убивает
  rationale: Глагол означает «убивать». Контекст ясно показывает преступное насилие, поэтому нейтральное «убивает» не ослабляет смысла и не вносит дополнительной юридической квалификации.
- source_word: נָקִי
  choice: невинного
  rationale: Передаёт человека, свободного от вины, и естественно сочетается с описанием насильственного убийства.
- source_word: עֵינָיו
  choice: его глаза
  rationale: Сохраняет яркий телесный образ оригинала, не заменяя его абстрактным «он».
- source_word: לְחֵלְכָה
  choice: беспомощного
  rationale: Редкое и трудное слово в контексте псалма обозначает уязвимую, несчастную жертву; «беспомощного» естественно передаёт эту роль, не утверждая более узкого социального статуса.
- source_word: יִצְפֹּנוּ
  choice: тайно высматривают
  rationale: Форма связана с идеей сокрытия и имеет множественное число, согласующееся по смыслу с «глазами». Русское выражение передаёт скрытое наблюдение за намеченной жертвой, сохраняя субъект «глаза».
