lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: הוֹדִיעַ
  choice: явил
  rationale: Естественно передаёт каузативное значение «сделал известным» и сохраняет поэтический параллелизм с «открыл».
- source_word: יְשׁוּעָתוֹ
  choice: Своё спасение
  rationale: «Спасение» сохраняет широкий смысл избавления и победоносного спасительного деяния; возвратное местоимение ясно соотносит его с подлежащим.
- source_word: לְעֵינֵי
  choice: перед глазами
  rationale: Сохраняет зримый образ еврейской идиомы; возможный более идиоматичный вариант указан в примечании.
- source_word: הַגּוֹיִם
  choice: народов
  rationale: В данном псалме обозначает народы мира; «язычников» было бы уже и конфессионально окрашеннее.
- source_word: גִּלָּה
  choice: открыл
  rationale: Передаёт значение «раскрыл, сделал явным» и звучит естественно в русской поэзии.
- source_word: צִדְקָתוֹ
  choice: Свою праведность
  rationale: Сохраняет широкий нравственный и заветный смысл слова, не сводя его только к судебной справедливости.
theological_decisions:
- issue: Передача Божьей צִדְקָה в контексте спасения
  choice: Свою праведность
  alternative: Свою справедливость
  rationale: «Праведность» сохраняет смысловую широту Божьей верности и правоты, явленной в спасительном действии; возможный оттенок справедливости сохранён в примечании.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Заглавные буквы в местоимениях «Своё», «Свою» употреблены как традиционный знак почтения к Богу. Порядок частей следует еврейскому поэтическому параллелизму; маркеры примечаний поставлены непосредственно после соответствующих выражений.
