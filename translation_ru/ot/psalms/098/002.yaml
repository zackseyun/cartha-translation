  text: Yahweh has made his salvation known[b][a]; before the eyes of the nations he has revealed his righteousness.
translation:
  language: ru
  text: Яхве сделал известным Своё спасение; на глазах у народов[a] открыл Свою праведность.[b]
  philosophy: optimal-equivalence
  footnotes:
