base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/003.yaml
  text: He has remembered his steadfast love and his faithfulness to the house of Israel[a]; all the ends of the earth have seen the salvation of our God.
translation:
  language: ru
  text: Он вспомнил о своей неизменной любви и верности дому Израиля; все концы земли увидели спасение[a] нашего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавление»; в контексте псалма еврейское слово может также подразумевать победоносное спасительное действие.'
    reason: Лексическая альтернатива для יְשׁוּעָה без неоправданного сужения смысла в основном тексте.
lexical_decisions:
- source_word: זָכַר
  choice: вспомнил
  rationale: Форма qal perfect 3 м. ед. обозначает совершившееся действие. Русское прошедшее время естественно передаёт его в хвалебном контексте, не добавляя отсутствующего в еврейском тексте аспектуального уточнения.
- source_word: חַסְדּוֹ
  choice: Своей неизменной любви
  rationale: חֶסֶד здесь указывает на стойкую, верную любовь Бога. «Неизменная любовь» передаёт постоянство и заветный оттенок слова без архаизма и без сужения смысла до одного лишь милосердия.
- source_word: וֶאֱמוּנָתוֹ
  choice: и верности
  rationale: אֱמוּנָה в параллели с חֶסֶד означает надёжность и верность. Русское «верность» сохраняет личностный и заветный смысл.
- source_word: לְבֵית יִשְׂרָאֵל
  choice: к дому Израиля
  rationale: Предлог לְ обозначает направленность или отношение. Оборот относится к Божьей любви и верности, а традиционное выражение «дом Израиля» точно сохраняет коллективный образ исходного текста.
- source_word: רָאוּ
  choice: увидели
  rationale: Qal perfect 3 мн. Передано обычным русским прошедшим временем как завершённое действие, свидетелями которого стали все дальние земли.
- source_word: כָל אַפְסֵי אָרֶץ
  choice: все концы земли
  rationale: Устойчивый библейский образ обозначает самые отдалённые области мира; русское выражение понятно и сохраняет поэтическую форму оригинала.
- source_word: יְשׁוּעַת
  choice: спасение
  rationale: יְשׁוּעָה охватывает спасение и избавление и может включать оттенок победоносного действия. «Спасение» сохраняет наибольшую смысловую широту; варианты отмечены в сноске.
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Сопряжённая конструкция буквально означает «спасение нашего Бога» — спасение, принадлежащее Богу или совершённое Им. Перевод сохраняет эту допустимую неоднозначность отношения.
theological_decisions:
- issue: Заветный оттенок חֶסֶד и אֱמוּנָה
  choice: «неизменная любовь» и «верность»
  alternative: «милость» и «истина»
  rationale: Выбранная пара передаёт стойкость Божьего благоволения и Его надёжность по отношению к Израилю, не сводя חֶסֶד только к состраданию, а אֱמוּנָה — к отвлечённой истине.
- issue: Смысл יְשׁוּעַת אֱלֹהֵינוּ
  choice: «спасение нашего Бога»
  alternative: «избавление нашего Бога» или «победа нашего Бога»
  rationale: Еврейское выражение допускает спасительный, избавительный и победный оттенки, но не требует сужать смысл до военной победы. Основной текст сохраняет широту, а сноска сообщает о возможных оттенках.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической краткости псалма. Местоимение «Своей» написано с прописной буквы как традиционное уважительное обозначение Бога; синтаксис остаётся ясным и не перегружен архаизмами.
