review_pass:
  verdict: revise
  source_fidelity: Нужна правка. В еврейском тексте все четыре глагола стоят во множественном числе; исходное «восклицай / ликуй / пой / славь» в единственном числе не воспроизводит форму обращения. Кроме того, יהוה следует передать как «Яхве» согласно указанному решению проекта, а не как «Господу». «Славь Его песней» вводит местоимение «Его», которого в стихе нет, и несколько сужает זמר до словесного прославления песней.
  naturalness: Предлагаемая редакция сохраняет торжественный поэтический регистр и звучит естественно в современном литературном русском. Множественное число при собирательном обращении «вся земля» здесь уместно и соответствует еврейскому тексту.
  terminology: «Яхве» прямо передаёт тетраграмматон. «Воспевайте» удачно передаёт זמר в контексте хвалы, не навязывая обязательного инструментального сопровождения; «разразитесь» сохраняет образ внезапно прорывающегося возгласа в פצחו.
  issues:
  - severity: high
    issue: Тетраграмматон передан как «Господу».
    rationale: Исходный текст содержит יהוה, а предоставленное богословско-редакционное решение предписывает передачу личного имени как «Яхве».
  - severity: medium
    issue: Повелительные формы переведены единственным числом.
    rationale: הָרִיעוּ, פִּצְחוּ, רַנְּנוּ и זַמֵּרוּ — формы 2-го лица множественного числа; русское обращение должно сохранить эту грамматическую форму.
  - severity: medium
    issue: Добавлено «Его» и конкретизация «песней».
    rationale: В еврейском тексте при זַמֵּרוּ нет местоименного дополнения; добавление меняет степень явной выраженности объекта и несколько сужает значение глагола.
  revised_text: Восклицайте Яхве, вся земля; разразитесь, ликуйте и воспевайте!
