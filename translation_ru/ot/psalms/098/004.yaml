  text: Восклицайте Яхве, вся земля; разразитесь, ликуйте и воспевайте!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִיעוּ
  choice: Восклицай
  rationale: Побудительная форма רוע призывает издать громкий радостный или торжествующий возглас. «Восклицай» естественно передаёт этот призыв в возвышенной поэзии.
- source_word: לַיהוָה
  choice: Господу
  rationale: Предлог ל указывает, к кому обращено ликование; тетраграмматон передан принятой в русской библейской речи формой «Господь».
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: В контексте всеобщего призыва псалма אָרֶץ означает весь мир, а не отдельную страну.
- source_word: פִּצְחוּ
  choice: ликуй
  rationale: פצח буквально изображает внезапно прорывающийся звук. В сочетании с последующими глаголами «ликуй» естественно передаёт порыв громкой радости, хотя ослабляет образ прорыва.
- source_word: וְרַנְּנוּ
  choice: пой от радости
  rationale: Речь идёт о звонком радостном пении или возгласе; этот вариант сохраняет музыкальный характер последовательности.
- source_word: וְזַמֵּרוּ
  choice: славь Его песней
  rationale: זמר в обращённом к Богу призыве означает петь или музицировать в хвалу. «Славь Его песней» ясно выражает хвалебную направленность, не утверждая, что речь обязательно об инструментальном сопровождении.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Русское «Господь» сохраняет укоренившееся богослужебное чтение тетраграмматона и остаётся понятным широкому кругу читателей. Само имя в еврейском тексте допускает более прямую передачу «Яхве», но для данного стиха выбрана традиционная литературная форма.
translation_notes:
  register: Современный литературный русский с поэтической торжественностью. Единственное число в обращении «вся земля» согласуется с собирательным адресатом; ряд кратких повелений сохраняет энергичный ритм еврейского стиха.
