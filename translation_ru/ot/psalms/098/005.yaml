    reason: lexical_alternative
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Воспевайте
  rationale: Форма пиэль, повелительное наклонение множественного числа, призывает к музыкальному прославлению. «Воспевайте» естественно соединяет пение с направленностью хвалы.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата, а имя יהוה передано транслитерацией «Яхве», чтобы сохранить личное Божье имя в исходном тексте.
- source_word: בְּכִנּוֹר
  choice: под лиру
  rationale: כִּנּוֹר — древний струнный инструмент, обычно отождествляемый с лирой. В данном контексте ב имеет инструментальное значение; по-русски сочетание «воспевать под лиру» звучит естественно.
- source_word: בְּכִנּוֹר
  choice: под лиру
  rationale: Повтор сохранён, поскольку он создаёт поэтический параллелизм и ритмическое усиление еврейской строки.
- source_word: וְקוֹל זִמְרָה
  choice: и звуки песни
  rationale: קוֹל может означать «голос» или «звук», а זִמְרָה — «песня», «мелодия» или «музыка». Формулировка сохраняет слуховой образ и связь двух существительных, не устраняя исходную многозначность.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В стихе непосредственно употреблено личное имя יהוה. Транслитерация «Яхве» сохраняет различие между Божьим именем и титулом «Господь».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Повтор «под лиру» намеренно сохранён вслед за еврейским параллелизмом; формулировка остаётся понятной при чтении вслух.
