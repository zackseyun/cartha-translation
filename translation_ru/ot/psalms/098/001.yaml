  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have worked salvation for him.
translation:
  language: ru
  text: 'Псалом. Пойте Яхве новую песнь, ибо Он совершил чудеса: Его правая рука и святая мышца принесли Ему победу.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принесли Ему спасение» или «спасли Его». Еврейское выражение может обозначать, что Яхве Своей силой обрёл спасение или победу.'
