lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Стандартное и ясное обозначение жанра и надписания псалма.
- source_word: שִׁירוּ לַיהוָה
  choice: Пойте Яхве
  rationale: Передаёт прямое повеление во множественном числе и сохраняет личное имя יהוה в принятой проектом форме.
- source_word: שִׁיר חָדָשׁ
  choice: новую песнь
  rationale: Естественное для русской библейской поэзии выражение, точно соответствующее еврейскому словосочетанию.
- source_word: נִפְלָאוֹת עָשָׂה
  choice: Он совершил чудеса
  rationale: Сохраняет смысл дивных, вызывающих изумление деяний и звучит естественно в современном литературном русском.
- source_word: הוֹשִׁיעָה לּוֹ
  choice: принесли Ему победу
  rationale: В контексте образов Божьей силы выражение означает, что собственная сила Яхве достигла спасения или победы для Него; выбранный вариант ясен по-русски, а буквальная неоднозначность отмечена в сноске.
- source_word: יְמִינוֹ וּזְרוֹעַ קָדְשׁוֹ
  choice: Его правая рука и Его святая мышца
  rationale: Сохраняет параллельные антропоморфные образы силы; «мышца» здесь возвышенно, но понятно передаёт поэтическое זְרוֹעַ.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в соответствии с проектным решением и не заменяет его титулом.
- issue: Смысл הוֹשִׁיעָה לּוֹ применительно к Божьей руке и мышце
  choice: принесли Ему победу
  alternative: спасли Его; совершили для Него спасение
  rationale: Форма допускает более буквальную передачу, однако контекст говорит не о спасении Бога от опасности чужой силой, а о победе или избавлении, достигнутом Его собственной силой. Сноска сохраняет языковую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой поэзии. Синтаксис краткий и певучий; местоимения, относящиеся к Богу, написаны с прописной буквы. Образ «святая мышца» сохранён ради поэтического параллелизма с «правой рукой».
