id: PSA.98.9
reference: Psalms 98:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לִֽ/פְֽנֵי יְהוָ֗ה כִּ֥י בָא֮ לִ/שְׁפֹּ֪ט הָ֫/אָ֥רֶץ יִשְׁפֹּֽט תֵּבֵ֥ל בְּ/צֶ֑דֶק וְ֝/עַמִּ֗ים בְּ/מֵישָׁרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/009.yaml
  text: before Yahweh[a], for he comes to judge the earth; he will judge the world with righteousness[e][d][c][b], and the peoples with equity.
translation:
  language: ru
  text: перед Яхве[a], ибо Он приходит[b] судить землю; Он будет судить мир[c] по правде, а народы — по справедливости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед лицом Яхве». «Яхве» передаёт еврейское имя יהוה (ЙХВХ), которое также традиционно заменяют словом «Господь».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «идёт»; возможен смысл: «уже приходит» или «непременно придёт».'
    reason: lexical_alternative
  - marker: c
    text: То есть обитаемый мир.
    reason: lexical_clarification
lexical_decisions:
- source_word: לִפְנֵי
  choice: перед
  rationale: Устойчивое сочетание буквально связано с «лицом» и означает «перед, в присутствии». Краткое «перед» естественно продолжает призыв предыдущего стиха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: כִּי בָא
  choice: ибо Он приходит
  rationale: כִּי вводит основание для ликования, а поэтическая форма בָא живо изображает близкое или несомненное пришествие, не сводя его однозначно к прошедшему времени.
- source_word: לִשְׁפֹּט
  choice: судить
  rationale: Глагол может включать управление и восстановление правого порядка, однако «судить» прямо передаёт судебный образ и сохраняет его широкое богословское напряжение.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Параллелизм со всем миром и народами указывает на всемирный, а не местный смысл.
- source_word: יִשְׁפֹּט
  choice: Он будет судить
  rationale: Будущее время естественно выражает предстоящее действие Того, Кто приходит судить.
- source_word: תֵּבֵל
  choice: мир
  rationale: Слово обозначает мир как обитаемую землю; «мир» кратко и естественно звучит в русском поэтическом параллелизме.
- source_word: בְּצֶדֶק
  choice: по правде
  rationale: Выражает норму и нравственное качество суда. «По правде» сохраняет библейскую ёмкость понятия צֶדֶק и отличается от следующего обозначения беспристрастной справедливости.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число сохраняет представление о различных человеческих сообществах.
- source_word: בְּמֵישָׁרִים
  choice: по справедливости
  rationale: В судебном контексте существительное передаёт прямоту, беспристрастность и справедливость суда; выбранная формулировка ясна современному читателю.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл Божьего суда в שׁפט
  choice: судить
  alternative: править; восстановить справедливость
  rationale: «Судить» позволяет слышать и ответственность перед Богом, и установление правого порядка, не ограничивая смысл только осуждением или управлением.
- issue: Временной оттенок בָא
  choice: приходит
  alternative: пришёл; идёт; придёт
  rationale: Поэтическая завершённая форма может представлять близкое или несомненное событие как уже наступающее. Настоящее время сохраняет живость и допускает эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Синтаксический параллелизм сохранён; «по правде» и «по справедливости» передают близкие, но не полностью совпадающие качества Божьего суда.
