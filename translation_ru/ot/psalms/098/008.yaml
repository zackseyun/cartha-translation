  text: נְהָר֥וֹת יִמְחֲאוּ כָ֑ף יַ֝֗חַד הָרִ֥ים יְרַנֵּֽנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/008.yaml
  text: Let the rivers clap their hands[a]; let the mountains sing for joy together,
translation:
  language: ru
  text: 'Пусть реки рукоплещут,

    пусть горы вместе ликуют[a]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместе радостно поют»; еврейский глагол может обозначать и ликующий возглас, и радостное пение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְהָרוֹת
  choice: реки
  rationale: Прямое и естественное соответствие; сохраняет образ всего творения, воздающего хвалу.
- source_word: יִמְחֲאוּ כָף
  choice: рукоплещут
  rationale: Еврейское сочетание буквально описывает хлопанье ладонью. «Рукоплещут» естественно передаёт этот образ по-русски и сохраняет олицетворение рек.
- source_word: יַחַד
  choice: вместе
  rationale: Прямо передаёт наречие совместности и относит его к единому ликованию гор.
- source_word: הָרִים
  choice: горы
  rationale: Точное соответствие исходному существительному; вариант «холмы» неоправданно ослабил бы величие образа.
- source_word: יְרַנֵּנוּ
  choice: пусть ... ликуют
  rationale: Форма выражает призыв, а глагол обозначает радостное, звучное ликование и может подразумевать как пение, так и торжествующий возглас. «Ликуют» сохраняет эту смысловую широту.
theological_decisions:
- issue: Поэтическое олицетворение творения в хвале
  choice: Сохранить прямые образы рукоплещущих рек и ликующих гор
  alternative: Истолковать их отвлечённо как воздействие природы на человеческую хвалу
  rationale: В еврейском тексте реки и горы непосредственно изображены участниками общей хвалы; перевод не должен сводить этот поэтический образ к поясняющей метафоре.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. «Рукоплещут» здесь уместно как краткое и образное выражение, а «ликуют» сохраняет лексическую неоднозначность еврейского глагола.
