  source_fidelity: Начальная жанровая помета, призыв воспеть Яхве, «чудеса» и смысл заключительной фразы в целом переданы верно. Однако זְרוֹעַ означает «рука/мышца, плечо» в отличие от יָמִין «правая рука»; перевод обоих образов словом «рука» стирает существенное различие. Глагол הוֹשִׁיעָה в сочетании с לּוֹ допускает передачу как совершения/обретения спасения для Него, а не требует догматического истолкования.
