base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/000.yaml
  text: A psalm. Sing to Yahweh a new song[a], for he has done wondrous things; his right hand and his holy arm have brought him salvation.
translation:
  language: ru
  text: Псалом. Пойте Яхве новую песнь, потому что Он совершил чудеса; Его десница и святая мышца принесли Ему спасение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «спасли Его» или «добыли для Него победу». Еврейское выражение допускает более буквальную передачу, но указывает на то, что Яхве Своей силой совершил избавление или победу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Кратко и традиционно передаёт жанровое обозначение, стоящее в начале еврейского текста.
- source_word: יהוה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: נִפְלָאוֹת
  choice: чудеса
  rationale: Естественное современное русское соответствие для дивных, необычайных деяний Бога.
- source_word: יְמִינוֹ
  choice: Его десница
  rationale: Сохраняет образ правой руки как символа силы; слово «десница» уместно в возвышенной поэтической речи.
- source_word: זְרוֹעַ קָדְשׁוֹ
  choice: Его святая рука
  rationale: Передаёт образ могучей руки без неестественного для современного русского сочетания «святая мышца».
- source_word: הוֹשִׁיעָה לּוֹ
  choice: добыли Ему спасение
  rationale: Сохраняет идею спасения и местоименное «Ему», одновременно выражая достигнутый собственной силой результат.
theological_decisions:
- issue: Смысл выражения הוֹשִׁיעָה לּוֹ применительно к Богу
  choice: добыли Ему спасение
  alternative: спасли Его; принесли Ему победу
  rationale: Еврейская формулировка необычна и допускает оттенки спасения, избавления и победы. Основной текст сохраняет слово «спасение» и не объясняет выражение как указание на нужду Бога в избавлении; варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Слово «десница» сохраняет псалмический образ, а синтаксис остаётся ясным для обычного читателя.
