  text: בַּ֭/חֲצֹ֣צְרוֹת וְ/ק֣וֹל שׁוֹפָ֑ר הָ֝רִ֗יעוּ לִ/פְנֵ֤י הַ/מֶּ֬לֶךְ יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/098/006.yaml
  text: With trumpets and the sound of the horn[a], raise a shout before the King, Yahweh.
translation:
  language: ru
  text: Под звуки труб и рога[a] громко восклицайте перед Царём — Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бараньего рога». Еврейское שׁוֹפָר часто обозначает именно бараний рог — инструмент, отличный от труб, упомянутых ранее в стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲצֹצְרוֹת
  choice: под звуки труб
  rationale: Существительное обозначает трубы, отличные от שׁוֹפָר; предлог ב имеет инструментальное значение. Оборот «под звуки» естественно передаёт это по-русски, не добавляя отсутствующего в еврейском тексте указания на серебро.
- source_word: וְקוֹל שׁוֹפָר
  choice: и рога[a]
  rationale: שׁוֹפָר — духовой инструмент из рога, нередко именно бараньего. «Рог» сохраняет отличие от упомянутых ранее труб; более конкретное значение вынесено в сноску. Слово «звуки» в общем обороте «под звуки труб и рога» передаёт קוֹל и естественно относится к обоим инструментам.
- source_word: הָרִיעוּ
  choice: громко восклицайте
  rationale: Побудительная форма множественного числа призывает к громкому торжественному возгласу. Перевод сохраняет значение шумного провозглашения, не вводя прямо не выраженное здесь слово «радость».
- source_word: לִפְנֵי
  choice: перед
  rationale: Краткая и естественная передача пространственно-реляционного значения «перед, в присутствии».
- source_word: הַמֶּלֶךְ
  choice: Царём
  rationale: Определённое существительное выступает как титул Бога; прописная буква соответствует русскому оформлению божественного титула.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя, выраженное тетраграмматоном, передано транслитерацией «Яхве», а не заменено титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Связь הַמֶּלֶךְ и יְהוָה
  choice: Царём — Яхве
  alternative: Яхве, Царём; перед Царём, перед Яхве
  rationale: Последовательность слов естественно допускает приложение, в котором имя «Яхве» уточняет, кто назван Царём. Тире ясно передаёт это отождествление, не переставляя элементы исходного текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Формула «под звуки» устраняет неестественную буквальность «трубами и звуком рога», сохраняя инструментальный смысл и различие между двумя видами инструментов.
