lexical_decisions:
- source_word: בְּחָנֵנִי
  choice: Исследуй меня
  rationale: Глагол בחן обозначает тщательное исследование или проверку подлинности. «Исследуй меня» естественно передаёт первый императив и отличает его от следующего נסה.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является принятой современной русской транслитерацией тетраграмматона.
- source_word: וְנַסֵּנִי
  choice: и испытай меня
  rationale: נסה означает подвергать испытанию, проверяя качества или верность. «Испытай меня» сохраняет смысл и поэтический параллелизм с первым глаголом.
- source_word: צרופה
  choice: переплавь
  rationale: צרף — металлургический образ очищения металла плавкой. «Переплавь» сохраняет конкретную и напряжённую метафору исходного текста, не сводя её к абстрактному «очисти».
- source_word: כִלְיוֹתַי
  choice: мои почки
  rationale: Буквально названы почки, которые в древнееврейской антропологии служат образом сокровенных мыслей и чувств. Конкретный поэтический образ сохранён, а его значение пояснено в сноске.
- source_word: וְלִבִּי
  choice: и сердце
  rationale: לֵב обозначает сердце как средоточие мыслей, воли и чувств. Обычное русское «сердце» сохраняет и образ, и широкий смысл слова.
theological_decisions:
- issue: Антропологическая образность древнееврейской поэзии
  choice: Сохранить буквальную пару «почки и сердце», пояснив первый образ в сноске.
  alternative: 'Передать смысл толкованием: «сокровенные мысли и сердце» или «разум и сердце».'
  rationale: Исходный текст использует два телесных образа внутреннего человека. Их буквальная передача сохраняет поэтическую силу и не сужает значение до одной психологической способности.
- issue: Образ очищения металла
  choice: Передать צרף глаголом «переплавь».
  alternative: «Очисти» или «проверь».
  rationale: Металлургическая метафора связывает проверку с очищающим воздействием. «Переплавь» сохраняет эту напряжённость, не уточняя сверх текста ни способ, ни результат испытания.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Повтор «меня» сохранён ради ясности двух обращённых к Богу просьб; конкретные образы «переплавь», «почки» и «сердце» удерживают необычность и силу еврейского оригинала.
