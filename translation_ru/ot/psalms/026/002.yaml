  text: Examine me[a], O Yahweh, and test me; refine my mind and my heart.
translation:
  language: ru
  text: Исследуй меня, Яхве, и испытай меня; очисти мои почки[a] и сердце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «почки»; в древнееврейской образной речи они обозначают сокровенные мысли и чувства человека. Глагол «очисти» передаёт образ очищения металла.
