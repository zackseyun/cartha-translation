lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим утверждением и естественно звучит в современном русском языке.
- source_word: חַסְדְּךָ
  choice: Твоя неизменная любовь
  rationale: Сохраняет сочетание любви, доброты и постоянной верности, присущее חֶסֶד, не сводя слово только к милости или формальному обязательству завета.
- source_word: לְנֶגֶד עֵינַי
  choice: перед моими глазами
  rationale: Буквально и идиоматично передаёт образ того, что псалмопевец постоянно держит в поле зрения и сознании.
- source_word: וְהִתְהַלַּכְתִּי
  choice: и я ходил
  rationale: Сохраняет еврейскую метафору жизненного пути и обозначает сложившийся образ поведения псалмопевца.
- source_word: בַּאֲמִתֶּךָ
  choice: в Твоей истине
  rationale: Сохраняет широкое значение אֱמֶת — истина, верность и надёжность — не устраняя заложенную в выражении смысловую многозначность.
theological_decisions:
- issue: Смысловой диапазон חֶסֶד и אֱמֶת как характеристик Бога
  choice: חֶסֶד передано как «неизменная любовь», а אֱמֶת — как «истина».
  alternative: Передать соответственно как «верность завету» и «верность».
  rationale: Основной текст сохраняет одновременно личностный и устойчивый характер Божьей любви, а также широту понятия истины; возможные заветные оттенки отмечены в сносках без навязывания более узкого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены метафоры «перед глазами» и «ходить в истине»; местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
