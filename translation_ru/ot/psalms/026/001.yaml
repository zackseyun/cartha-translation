  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/001.yaml
  text: Of David[a]. Vindicate me, O Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: ru
  text: 'Давида.[a]


    Оправдай меня, Яхве,[b]

    ведь я ходил в своей непорочности[c]

    и уповал на Яхве —

    не пошатнусь.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская надпись может означать «Давида», «для Давида» или указывать на связь псалма с Давидом.
    reason: лексическая неоднозначность
  - marker: b
    text: 'Или: «Суди меня, Яхве». Здесь глагол, вероятно, означает просьбу вынести решение в пользу молящегося.'
    reason: лексическая альтернатива
  - marker: c
    text: 'Или: «в своей цельности», «в своей безупречности». Речь идёт о честности и цельности поведения, а не обязательно об абсолютной безгрешности.'
    reason: лексическая и богословская неоднозначность
  - marker: d
    text: 'Или: «не поскользнусь», «не оступлюсь». Еврейский образ передаёт потерю устойчивости или опоры.'
    reason: образная лексическая альтернатива
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая надпись сохраняет традиционную форму и неоднозначность еврейского לְ: она может указывать на авторство, принадлежность, посвящение или связь с Давидом.'
- source_word: שָׁפְטֵנִי
  choice: Оправдай меня
  rationale: В данном судебном контексте просьба означает не просто «суди меня», а «вынеси решение в мою пользу, подтверди мою правоту». Русское «оправдай» естественно передаёт этот смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: בְּתֻמִּי
  choice: в своей непорочности
  rationale: Слово обозначает цельность, безупречность и честность поведения; формулировка сохраняет нравственное утверждение псалмопевца, не превращая его в заявление об абсолютной безгрешности.
- source_word: הָלַכְתִּי
  choice: я ходил
  rationale: Сохранена понятная библейская метафора жизненного пути и образа поведения.
- source_word: בָּטַחְתִּי
  choice: уповал
  rationale: Глагол выражает доверие и уверенную опору; «уповал» естественно для современного литературного русского языка в молитвенно-поэтическом контексте.
- source_word: לֹא אֶמְעָד
  choice: не пошатнусь
  rationale: Форма выражает уверенность в будущем, а глагол рисует потерю устойчивости или опоры. «Не пошатнусь» сохраняет образ и звучит естественно.
theological_decisions:
- issue: Смысл просьбы שָׁפְטֵנִי
  choice: Оправдай меня
  alternative: Суди меня
  rationale: Контекст представляет судебное обращение с просьбой о благоприятном решении на основании заявленной непорочности. В сноске сохранено более буквальное прочтение.
- issue: Утверждение о תֻם
  choice: непорочность как цельность и честность поведения
  alternative: абсолютная безгрешность
  rationale: Текст содержит реальное нравственное притязание, но само слово не требует понимать его как заявление о полном отсутствии греха; напряжение не снимается поясняющим добавлением в основном тексте.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Сохранено личное имя, непосредственно присутствующее в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-поэтическим звучанием. Сохранены параллелизм строк, метафора хождения и повтор имени Яхве; архаичные формы и конфессионально окрашенные добавления не использованы.
