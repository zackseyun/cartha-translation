  text: שָׂ֭נֵאתִי קְהַ֣ל מְרֵעִ֑ים וְ/עִם רְ֝שָׁעִ֗ים לֹ֣א אֵשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/005.yaml
  text: I hate the assembly of evildoers[a], and I will not sit with the wicked.
translation:
  language: ru
  text: 'Ненавижу собрание злодеев[a]

    и с нечестивыми не сяду.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ненавижу собрание делающих зло».'
    reason: 'Лексическая альтернатива: קְהַל нейтрально обозначает собрание, а מְרֵעִים — тех, кто делает зло; основной текст передаёт характеристику более сжато и поэтично.'
lexical_decisions:
- source_word: שָׂנֵאתִי
  choice: Ненавижу
  rationale: Форма qal perfect, 1-е лицо единственного числа, в данном поэтическом контексте естественно выражает устойчивое отношение говорящего. Настоящее время по-русски передаёт это состояние яснее, чем «я возненавидел» или «я ненавидел».
- source_word: קְהַל
  choice: сборище
  rationale: Слово обозначает собравшуюся группу. «Сборище» естественно сочетается со «злодеями» и здесь уместно передаёт отрицательную оценку, хотя само еврейское существительное может быть нейтральным.
- source_word: מְרֵעִים
  choice: злодеев
  rationale: Субстантивированное причастие обозначает людей, делающих зло. «Злодеи» кратко и поэтично передаёт характеристику по поступкам.
- source_word: וְ/עִם
  choice: и с
  rationale: Союз и предлог прямо связывают вторую строку с первой; русское «и с» сохраняет параллелизм.
- source_word: רְשָׁעִים
  choice: нечестивыми
  rationale: Субстантивированное прилагательное обозначает нравственно порочных людей. «Нечестивые» — краткое, узнаваемое в поэтическом библейском регистре соответствие без сужения значения до юридической виновности.
- source_word: לֹא אֵשֵׁב
  choice: не сяду
  rationale: Отрицание с имперфектом выражает решительный отказ или устойчивое намерение. «Не сяду» сохраняет конкретный образ совместного сидения и не усиливает его до значения проживания.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с лаконичным поэтическим параллелизмом. «Сборище» и «злодеи» понятны обычному читателю; «нечестивые» сохраняет достоинство библейского регистра. Перфект передан настоящим временем как устойчивое отношение, имперфект — формой решительного будущего.
