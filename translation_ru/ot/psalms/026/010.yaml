- source_word: אֲשֶׁר בִּידֵיהֶם
  choice: у которых в руках
  rationale: Относительная конструкция продолжает характеристику людей из предыдущего стиха; формулировка сохраняет еврейский образ и естественно звучит по-русски.
- source_word: זִמָּה
  choice: злой умысел
  rationale: Слово может обозначать нечестие, преступный замысел или развращённость. В параллели со взятками здесь уместен смысл сознательного злого или преступного намерения, без неоправданного сведения к сексуальной распущенности.
- source_word: וִימִינָם
  choice: и правая рука
  rationale: Сохранено собирательное единственное число и образ правой руки как орудия действия.
- source_word: מָלְאָה
  choice: полна
  rationale: Кратко и естественно передаёт результативно-состоящее значение еврейской формы.
- source_word: שֹׁחַד
  choice: взяток
  rationale: Хотя еврейское существительное имеет форму единственного числа, оно употреблено собирательно; русское множественное число естественно выражает привычную продажность.
