  text: וַ֭/אֲנִי בְּ/תֻמִּ֥/י אֵלֵ֗ךְ פְּדֵ֣/נִי וְ/חָנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/011.yaml
  text: But as for me[a], I will walk in my integrity[b]; redeem me and be gracious to me.
translation:
  language: ru
  text: Я же буду ходить в своей непорочности[a]; искупи меня и будь милостив ко мне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своей цельности»; также возможно: «в своей невиновности».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «помилуй меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Я же
  rationale: Самостоятельное местоимение с союзом подчёркивает противопоставление псалмопевца окружающим нечестивым; частица «же» естественно передаёт этот контраст по-русски.
- source_word: בְּתֻמִּי
  choice: в своей непорочности
  rationale: תֻּם обозначает цельность, нравственную безупречность и непорочность поведения. «Непорочность» сохраняет положительную нравственную силу слова, а притяжательное «своей» передаёт суффикс первого лица.
- source_word: אֵלֵךְ
  choice: буду ходить
  rationale: Форма допускает направленность в будущее или продолженное намерение. «Буду ходить» сохраняет еврейскую метафору жизненного пути, не заменяя её более общим «буду жить».
- source_word: פְּדֵנִי
  choice: искупи меня
  rationale: Глагол פדה означает выкупить или избавить посредством выкупа. «Искупи» сохраняет его более конкретный и богословски значимый оттенок по сравнению с общим «избавь».
- source_word: וְחָנֵּנִי
  choice: и будь милостив ко мне
  rationale: חנן выражает дарование милости или благоволения. Формулировка «будь милостив ко мне» естественна в современном литературном русском и сохраняет молитвенный регистр.
theological_decisions:
- issue: Смысл заявления псалмопевца о תֻּם
  choice: Речь о нравственной цельности и непорочности его жизненного пути, а не обязательно о безгрешности в абсолютном смысле.
  alternative: Понимать выражение как более сильное заявление о полной невиновности или безупречности.
  rationale: Контекст противопоставляет образ жизни псалмопевца поведению нечестивых, но просьбы об искуплении и милости сохраняют напряжение между заявлением о непорочности и зависимостью от Божьей благодати. Перевод не устраняет это напряжение.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-поэтической речи. Сохранены метафора хождения, контрастное «Я же» и параллельные повелительные просьбы; архаические формы избегаются.
