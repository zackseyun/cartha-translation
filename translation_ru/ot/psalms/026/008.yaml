  text: 'Яхве, я люблю обитель Твоего дома

    и место, где пребывает Твоя слава.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: В русском библейском обращении звательная форма «Господи» естественно и достойно передаёт обращение к Богу, обозначенному тетраграмматоном, не создавая непривычной русскому читателю транслитерации.
- source_word: אָהַבְתִּי
  choice: я люблю
  rationale: Перфект здесь выражает устойчивую расположенность говорящего; настоящее время естественно передаёт поэтическое исповедание.
- source_word: מְעוֹן בֵּיתֶךָ
  choice: обитель Твоего дома
  rationale: «Обитель» сохраняет значение места пребывания, а «Твоего дома» буквально передаёт образ святилища, не заменяя его более узким словом «храм».
- source_word: וּמְקוֹם
  choice: место
  rationale: Вторая строка естественно читается как поясняющее приложение; союз можно не воспроизводить, сохраняя русскую поэтическую плавность.
- source_word: מִשְׁכַּן
  choice: где пребывает
  rationale: Еврейское существительное в сочетании «место обитания славы» передано придаточным предложением ради естественного современного русского языка без утраты образа пребывания.
- source_word: כְּבוֹדֶךָ
  choice: Твоя слава
  rationale: «Слава» — прямой и укоренённый русский эквивалент כָּבוֹד в контексте явленного Божьего присутствия.
theological_decisions:
- issue: Конкретность языка святилища
  choice: Сохранены «Твой дом» и место пребывания славы
  alternative: «Твой храм» или «место, где Ты восседаешь во славе»
  rationale: Исходный текст говорит о доме и пребывании славы; перевод не сужает дом до явно названного храма и не вводит отсутствующий образ воцарения.
- issue: Передача тетраграмматона
  choice: Господи
  alternative: Яхве
  rationale: Русская форма обращения «Господи» сохраняет непосредственное обращение к Богу и соответствует устойчивому литературному и библейскому регистру; альтернативная транслитерация имени возможна в проектах, последовательно избирающих её.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Синтаксис сделан плавным, но параллелизм и конкретные образы еврейского текста сохранены.
