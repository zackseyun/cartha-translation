  text: רַ֭גְלִ/י עָֽמְדָ֣ה בְ/מִישׁ֑וֹר בְּ֝/מַקְהֵלִ֗ים אֲבָרֵ֥ךְ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/012.yaml
  text: My foot stands on level ground[a]; in the assemblies I will bless Yahweh.
translation:
  language: ru
  text: Моя нога стоит на ровном месте[a]; в собраниях я буду благословлять Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на ровной земле»; еврейское выражение может также подразумевать прямоту и праведность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלִי
  choice: Моя нога
  rationale: Существительное стоит в единственном числе с суффиксом первого лица единственного числа. Русский текст естественно сохраняет этот поэтический образ и грамматическое число.
- source_word: עָמְדָה
  choice: стоит
  rationale: Форма перфекта согласована с существительным женского рода «нога» и в данном поэтическом контексте выражает достигнутое устойчивое состояние; настоящее время естественно передаёт этот смысл.
- source_word: בְמִישׁוֹר
  choice: на ровном месте
  rationale: Слово обозначает ровное, прямое место или поверхность и может иметь дополнительный оттенок прямоты и праведности. Основной текст сохраняет конкретный пространственный образ, не устраняя возможного нравственного подтекста.
- source_word: בְמַקְהֵלִים
  choice: в собраниях
  rationale: Форма множественного числа обозначает собравшиеся сообщества людей. «В собраниях» сохраняет множественность и не привносит узкой конфессиональной окраски.
- source_word: אֲבָרֵךְ
  choice: я буду благословлять
  rationale: Порода пиэль глагола ברך прямо означает «благословлять». Будущее время передаёт декларативно-волевую направленность формы, не подменяя её более узким «прославлять».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте употреблено собственное имя Бога. Транслитерация «Яхве» сохраняет имя, тогда как «Господь» заменяет его титулом.
- issue: Возможный нравственный оттенок בְמִישׁוֹר
  choice: Конкретный образ «на ровном месте» с пояснением в сноске
  alternative: в правоте
  rationale: Еврейское слово допускает ассоциацию с прямотой и праведностью, но прежде всего создаёт пространственный образ устойчивого положения. Перевод не должен превращать возможный подтекст в единственное значение.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного поэтического параллелизма. Единственное число «нога», множественное «собрания» и прямое «благословлять» воспроизводят заметные особенности еврейского текста.
