  text: אַל תֶּאֱסֹ֣ף עִם חַטָּאִ֣ים נַפְשִׁ֑/י וְ/עִם אַנְשֵׁ֖י דָמִ֣ים חַיָּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/009.yaml
  text: Do not gather my soul with sinners[b][a], nor my life with men of bloodshed.
translation:
  language: ru
  text: 'Не забери мою душу вместе с грешниками[a],

    мою жизнь — вместе с людьми, проливающими кровь[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не погуби мою душу вместе с грешниками». Глагол буквально может означать «собирать», а здесь — забирать или уносить вместе с нечестивыми на суде.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «людьми кровей» — еврейское выражение о жестоких людях или людях, виновных в пролитии крови.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱסֹף
  choice: не забери
  rationale: Глагол אָסַף буквально означает «собирать», но в контексте суда может обозначать устранение или взятие вместе с другими. «Не забери… вместе» естественно звучит по-русски и сохраняет мысль о разделении общей участи.
- source_word: נַפְשִׁי
  choice: мою душу
  rationale: נֶפֶשׁ может означать душу, жизнь или самого человека. Перевод «душу» сохраняет отличие от параллельного חַיָּי, не превращая его в строгое антропологическое определение.
- source_word: חַטָּאִים
  choice: грешниками
  rationale: Прямое и понятное обозначение людей, характеризуемых грехом.
- source_word: אַנְשֵׁי דָמִים
  choice: людьми, проливающими кровь
  rationale: Буквально «люди кровей» — еврейская идиома, обозначающая жестоких или виновных в пролитии крови людей. Выбранный вариант сохраняет образ крови и не сужает значение только до юридической категории убийц.
- source_word: חַיָּי
  choice: мою жизнь
  rationale: В параллели с נַפְשִׁי слово естественно означает «мою жизнь»; различие двух поэтических выражений сохранено.
- source_word: אַל
  choice: не
  rationale: С формой имперфекта אַל выражает отрицательную мольбу; русская конструкция «не забери» естественна для молитвенной речи.
theological_decisions:
- issue: Антропологический оттенок נַפְשִׁי и חַיָּי
  choice: 'Сохранены два разных поэтических выражения: «мою душу» и «мою жизнь».'
  alternative: 'Передать более обобщённо: «меня» и «мою жизнь» либо повторить слово «жизнь».'
  rationale: Текст не формулирует точного учения о соотношении души и тела, но намеренно использует два близких, не тождественных слова. Их различение сохраняет поэтическое напряжение без привнесения позднейшей терминологии.
translation_notes:
  register: Современный литературный русский язык; молитвенный тон с ясным поэтическим параллелизмом. Формулировка избегает неестественного буквального «собери мою душу» и сохраняет образ пролитой крови.
