lexical_decisions:
- source_word: אֶרְחַץ
  choice: Омою
  rationale: Имперфект qal, 1-е лицо ед. числа, в поэтическом контексте допускает значение намерения или решительного действия. «Омою» естественно сочетается с последующим когортативом и сохраняет возвышенный регистр.
- source_word: בְּנִקָּיוֹן
  choice: в невиновности
  rationale: Существительное נִקָּיוֹן обозначает чистоту и невиновность. Здесь выражение передаёт не только обрядовую чистоту, но и нравственную непричастность; неоднозначность отмечена в сноске.
- source_word: כַּפָּי
  choice: руки
  rationale: Буквально форма указывает на ладони, однако по-русски устойчиво и естественно говорится «омыть руки».
- source_word: וַאֲסֹבְבָה
  choice: и обойду
  rationale: Глагол סבב означает обходить или двигаться вокруг. Когортативная форма может выражать намерение или решимость; «обойду» передаёт это без излишнего толкования характера действия.
- source_word: מִזְבַּחֲךָ
  choice: Твой жертвенник
  rationale: Обычное соответствие для מִזְבֵּחַ с суффиксом 2-го лица мужского рода ед. числа. Заглавная буква в местоимении следует принятой русской благоговейной письменной традиции.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом; форма «Яхве» является современной русской транслитерацией тетраграмматона.
theological_decisions:
- issue: Нравственная невиновность или обрядовая чистота в בְּנִקָּיוֹן
  choice: в невиновности
  alternative: в чистоте / чистыми руками
  rationale: Контекст псалма подчёркивает нравственную непорочность, однако слово сохраняет связь с чистотой, в том числе обрядовой; поэтому основное чтение и альтернатива представлены без устранения напряжения.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя; транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Временное и модальное значение глаголов
  choice: Омою… и обойду
  alternative: Омываю… и обхожу / да омою… и обойду
  rationale: Еврейские формы допускают оттенок привычного действия, намерения или решимости. Будущее совершенного вида по-русски компактно передаёт намерение, не превращая строку в прямое повеление или обещание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической интонацией. Сохранена образность омовения рук и обхода жертвенника; синтаксис сделан ясным и пригодным для чтения вслух.
