lexical_decisions:
- source_word: לַשְׁמִעַ
  choice: громко возвестить
  rationale: Порода хифиль глагола שׁמע буквально означает «дать услышать, сделать слышимым». Сочетание «громко возвестить» естественно передаёт публичный и каузативный смысл.
- source_word: בְּקוֹל תּוֹדָה
  choice: благодарение
  rationale: תּוֹדָה здесь обозначает выраженную словами или пением благодарность. Русское «благодарение» сохраняет поэтический и богослужебный оттенок, не сводя значение к более широкому понятию хвалы.
- source_word: וּלְסַפֵּר
  choice: и рассказать
  rationale: Глагол ספר в пиэле означает рассказывать, подробно излагать или перечислять. «Рассказать» звучит естественно и сохраняет параллелизм с «возвестить».
- source_word: כָּל
  choice: обо всех
  rationale: Передаёт всеохватное значение כָּל и согласуется с русским управлением глагола «рассказать».
- source_word: נִפְלְאוֹתֶיךָ
  choice: Твоих чудесных делах
  rationale: Существительное נִפְלָאוֹת часто обозначает необычайные деяния Бога. «Чудесные дела» ясно выражает подразумеваемый деятельный смысл и естественно звучит по-русски.
