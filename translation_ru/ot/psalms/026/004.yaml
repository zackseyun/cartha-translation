lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: не сидел
  rationale: Сохраняет конкретный образ глагола ישׁב («сидеть, пребывать»), который в сочетании с «с» также подразумевает общение и пребывание в чьём-либо обществе.
- source_word: מְתֵי שָׁוְא
  choice: с людьми лжи
  rationale: Передаёт конструкцию «люди лжи/обмана» и нравственный смысл שָׁוְא, не сужая его до одного лишь значения «обманщики».
- source_word: נַעֲלָמִים
  choice: тем, кто скрывает себя
  rationale: 'Причастная форма от עלם связана с сокрытием. Формулировка сохраняет намеренную неясность: речь может идти о скрытных людях либо о тех, кто прячет свою подлинную сущность.'
- source_word: אָבוֹא
  choice: не вхожу
  rationale: Буквально сохраняет образ בוא («входить, приходить»); в параллели с «не сидел» выражение подразумевает присоединение к обществу таких людей.
- source_word: וְעִם
  choice: и … к тем
  rationale: Русская конструкция с глаголом «вхожу» требует «к тем»; союз «и» сохраняет простое параллельное соединение еврейских частей стиха.
