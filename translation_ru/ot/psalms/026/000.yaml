source:
  edition: WLC
  text: לְ/דָוִ֨ד שָׁפְטֵ֤/נִי יְהוָ֗ה כִּֽי אֲ֭נִי בְּ/תֻמִּ֣/י הָלַ֑כְתִּי וּ/בַ/יהוָ֥ה בָּ֝טַ֗חְתִּי לֹ֣א אֶמְעָֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/026/000.yaml
  text: Of David[a]. Judge me, Yahweh, for I have walked in my integrity, and I have trusted in Yahweh[c][b]; I will not slip.
translation:
  language: ru
  text: 'Давида.[a]


    Суди меня, Яхве,[b] ведь я жил непорочно[c] и на Яхве уповал — не пошатнусь.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давидов». Еврейское надписание может указывать на авторство, принадлежность, посвящение или связь с Давидом.'
    reason: source_ambiguity
  - marker: b
    text: 'Или: «Оправдай меня, Яхве»; в данном контексте просьба «суди» может означать «вынеси решение в мою пользу».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «я ходил в своей непорочности». Еврейское слово обозначает цельность, честность и безупречность поведения.'
    reason: idiom_and_lexical_range
  - marker: d
    text: 'Или: «не поскользнусь», «не поколеблюсь». В еврейском тексте использован образ утраты опоры.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая форма сохраняет лаконичность еврейского надписания и не добавляет отсутствующее в тексте слово «псалом».
- source_word: שָׁפְטֵנִי
  choice: Суди меня
  rationale: Передаёт прямое значение глагола «судить», не устраняя возможного в контексте смысла «оправдай меня, вынеси решение в мою пользу».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога как имя, а не заменяет его титулом; форма «Яхве» общепринята в современном русском языке.
- source_word: בְּתֻמִּי הָלַכְתִּי
  choice: я жил непорочно
  rationale: Глагол «ходить» здесь идиоматически описывает образ жизни; «непорочно» естественно передаёт целостность и безупречность поведения, не заявляя абсолютного безгрешия.
- source_word: לֹא אֶמְעָד
  choice: не пошатнусь
  rationale: Сохраняет образ утраты устойчивости и допускает смысл «не поскользнусь, не поколеблюсь».
theological_decisions:
- issue: Просьба псалмопевца о суде
  choice: Суди меня
  alternative: Оправдай меня
  rationale: Основной текст сохраняет напряжение прямой просьбы о Божьем суде; более узкое понимание как решения в пользу молящегося вынесено в примечание.
- issue: Значение заявления о непорочности
  choice: я жил непорочно
  alternative: я ходил в своей целостности
  rationale: Формулировка относится к цельности и безупречности жизненного пути в данном контексте и не превращается в доктринальное утверждение об абсолютной безгрешности.
- issue: Временная или следственная окраска заключительной фразы
  choice: не пошатнусь
  alternative: я не пошатнулся
  rationale: Еврейская форма допускает оттенки настоящего или будущего; русский будущий вид естественно выражает уверенность, основанную на уповании, не делая причинную связь более явной, чем в оригинале.
translation_notes:
  register: Современный литературный русский с лаконичным, молитвенно-поэтическим звучанием. Синтаксис остаётся простым и близким к параллельному строю оригинала; идиома «ходить» передана естественным русским «жить», а основные смысловые альтернативы сохранены в примечаниях.
