lexical_decisions:
- source_word: הֶאֱכַלְתָּם
  choice: Ты кормил их
  rationale: Порода хифиль от אכל с суффиксом 3-го лица множественного числа означает «давать есть, кормить». Несовершенный вид естественно передаёт продолжительное переживание народа в поэтическом обращении к Богу.
- source_word: לֶחֶם דִּמְעָה
  choice: хлебом слёз
  rationale: Сохранён выразительный еврейский образ, где слёзы представлены как хлеб; творительный падеж после «кормил» звучит естественно по-русски.
- source_word: וַתַּשְׁקֵמוֹ
  choice: и поил их
  rationale: Хифиль от שׁקה означает «давать пить, поить»; форма сохраняет параллелизм с «кормил их».
- source_word: בִּדְמָעוֹת
  choice: слезами
  rationale: Предлог ב при глаголе питья обозначает то, чем поят; по-русски это естественно передаётся творительным падежом.
- source_word: שָׁלִישׁ
  choice: в полной мере
  rationale: Редкий и не вполне ясный термин, вероятно обозначающий крупную меру или усиленное количество. Перевод передаёт изобилие, не приписывая слову недоказанную точную метрологическую величину; буквальные варианты вынесены в сноску.
