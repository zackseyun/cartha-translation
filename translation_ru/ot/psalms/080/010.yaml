  text: 'Горы были покрыты её тенью,

    а её ветви покрыли кедры Божьи.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могучие кедры». Древнееврейское выражение «кедры Божьи» может обозначать необычайно величественные кедры.'
