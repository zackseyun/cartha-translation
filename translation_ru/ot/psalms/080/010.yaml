lexical_decisions:
- source_word: כָּסּוּ
  choice: покрылись
  rationale: Qal, перфект, 3-е лицо множественного числа от כסה. Русская возвратная конструкция естественно передаёт состояние гор, покрытых тенью лозы.
- source_word: הָרִים
  choice: горы
  rationale: Прямое соответствие существительному во множественном числе; определённость в русском контексте не требует отдельного показателя.
- source_word: צִלָּהּ
  choice: её тенью
  rationale: צֵל означает «тень» или «сень»; «тень» — современное и понятное слово, сохраняющее образ широко разросшейся лозы. Местоимение женского рода соотносится с лозой из предыдущего контекста.
- source_word: וַעֲנָפֶיהָ
  choice: а её ветви
  rationale: עָנָף обозначает ветвь или сук. «Ветви» естественно и доступно передаёт ботанический образ; союз «а» плавно вводит параллельную строку.
- source_word: אַרְזֵי אֵל
  choice: кедры Божьи
  rationale: Буквальное сочетание сохраняет явное אֵל и образ величественных кедров, не устраняя возможного идиоматического значения «могучие кедры».
theological_decisions:
- issue: Передача אֵל в выражении אַרְזֵי אֵל
  choice: Сохранить в основном тексте буквальный образ «кедры Божьи»
  alternative: «могучие кедры»
  rationale: Божественное имя в подобных древнееврейских конструкциях может усиливать признак и выражать необычайное величие. Буквальная передача сохраняет исходный образ и его неоднозначность, а идиоматическое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтическим параллелизмом. «Кедры Божьи» звучит возвышенно, но понятно; сноска поясняет вероятное усилительное значение конструкции.
