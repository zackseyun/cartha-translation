  text: וְ/לֹא נָס֥וֹג מִמֶּ֑/ךָּ תְּ֝חַיֵּ֗/נוּ וּ/בְ/שִׁמְ/ךָ֥ נִקְרָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/018.yaml
  text: Then we will not turn back from you; revive us[a], and we will call on your name.
translation:
  language: ru
  text: И мы не отступим от Тебя; оживи нас[a], и мы будем призывать Твоё имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «даруй нам жизнь»; еврейское выражение может также означать «сохрани нас в живых».'
    reason: Лексический диапазон חיה в породе пиэль включает оживление, дарование жизни и сохранение в живых.
lexical_decisions:
- source_word: וְלֹא
  choice: Тогда ... не
  rationale: Союз с отрицанием здесь естественно передаёт следствие предшествующей молитвы; «тогда» ясно выражает эту связь.
- source_word: נָסוֹג
  choice: отступим
  rationale: Глагол סוג означает отступить, повернуть назад; «отступим» естественно звучит в контексте верности Богу и не привносит более узкого смысла отпадения.
- source_word: מִמֶּךָּ
  choice: от Тебя
  rationale: Предлог מן с местоименным суффиксом имеет прямое разделительное значение и естественно сочетается с «отступим».
- source_word: תְּחַיֵּנוּ
  choice: оживи нас
  rationale: Пиэль глагола חיה может означать оживить, сохранить в живых или даровать жизнь. «Оживи нас» кратко и естественно передаёт просьбу о Божьем животворящем действии, а примечание сохраняет широту значения.
- source_word: וּבְשִׁמְךָ נִקְרָא
  choice: и мы будем призывать Твоё имя
  rationale: Сочетание קרא с בְּשֵׁם в данном контексте означает призывать имя Бога. Такой перевод сохраняет смысл молитвенного обращения и звучит естественно по-русски.
theological_decisions:
- issue: Смысл просьбы תְּחַיֵּנוּ
  choice: Просьба к Богу оживить народ, чтобы он оставался верным и призывал Его имя.
  alternative: Просьба сохранить народ в живых или даровать ему жизнь.
  rationale: Еврейский глагол допускает восстановление жизни, её дарование и сохранение. Основной текст использует естественное «оживи нас», а примечание не позволяет сузить смысл только до духовного возрождения или только до физического выживания.
- issue: Логическая связь первой строки с контекстом
  choice: «Тогда» как указание на следствие Божьего вмешательства, о котором просит псалмопевец.
  alternative: Буквальное соединительное «и».
  rationale: וְ может иметь соединительный или следственный оттенок. В контексте обещание не отступать следует за просьбой о Божьем восстановлении; «тогда» естественно выражает эту связь, не превращая её в жёсткое условие.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-поэтической речи. Местоимения, обращённые к Богу, написаны с прописной буквы согласно принятой русской библейской традиции; синтаксис остаётся ясным для современного читателя.
