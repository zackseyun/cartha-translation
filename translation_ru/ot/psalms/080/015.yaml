lexical_decisions:
- source_word: כַנָּה
  choice: ствол
  rationale: Редкое существительное употреблено в контексте образа виноградной лозы. «Ствол» сохраняет растительную метафору и не уточняет без достаточных оснований, идёт ли речь об отростке, ветви или подвое.
- source_word: נָטְעָה
  choice: насадила
  rationale: Глагол נטע обычно означает «сажать, насаждать»; выбранное слово естественно продолжает образ виноградника.
- source_word: יְמִינֶךָ
  choice: Твоя правая рука
  rationale: Буквальный образ правой руки сохраняет указание на могущественное действие Бога, не заменяя его отвлечённым словом «сила».
- source_word: וְעַל
  choice: и сына
  rationale: Предлог עַל вводит второй объект подразумеваемого из контекста глагола обращения к Богу; в русском винительный падеж делает связь с предшествующим призывом естественной.
- source_word: בֵּן
  choice: сын
  rationale: Сохранено прямое значение еврейского слова. Оно поддерживает олицетворённый или корпоративный образ и не сводит его безоговорочно к ботанической «ветви».
- source_word: אִמַּצְתָּה
  choice: укрепил
  rationale: 'Порода пиэль передаёт причинное значение: сделать крепким, придать силу. «Укрепил» кратко и естественно выражает этот смысл.'
- source_word: לָּךְ
  choice: для Себя
  rationale: 'Так передан дательный отношения или пользы с уместным здесь возвратным оттенком: Бог укрепил сына для Своей цели.'
theological_decisions:
- issue: Кого обозначает «сын» в метафоре лозы
  choice: В основном тексте сохранено слово «сын» без уточнения его референта.
  alternative: Понять слово ботанически как «ветвь», корпоративно как Израиль или типологически и мессиански.
  rationale: Ближайший контекст изображает Израиль как лозу, однако в еврейском тексте стоит обычное слово «сын». Сохранение этого слова не устраняет намеренную образную напряжённость и не вносит в перевод определённое богословское толкование.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской издательской традиции. Винительный падеж «ствол… и сына» сохраняет синтаксическую зависимость от призыва в предшествующем стихе; данный стих представляет собой продолжение предложения.
