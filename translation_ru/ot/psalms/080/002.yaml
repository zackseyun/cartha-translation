  yaml_path: translation/ot/psalms/080/002.yaml
  text: Before Ephraim and Benjamin and Manasseh[b][a], stir up your might and come to save us.
translation:
  language: ru
  text: Перед Ефремом, Вениамином и Манассией пробуди свою мощь[b] и приди спасти нас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и выступи нам на спасение». Еврейский глагол буквально означает «иди», но здесь это просьба к Богу вмешаться ради своего народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «силу» или «могущество».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: перед
  rationale: Пространственное значение предлога соответствует образу Бога, являющегося перед названными коленами или идущего впереди них; перевод сохраняет присущую еврейскому выражению краткость.
- source_word: אֶפְרַיִם וּבִנְיָמִן וּמְנַשֶּׁה
  choice: Ефремом, Вениамином и Манассией
  rationale: Имена переданы в традиционной русской библейской форме; творительный падеж обусловлен предлогом «перед».
- source_word: עוֹרְרָה
  choice: пробуди
  rationale: Императив выражает просьбу привести силу в действие. «Пробуди» естественно сохраняет метафору пробуждения, не объясняя её сверх текста.
- source_word: אֶת גְּבוּרָתֶךָ
  choice: свою мощь
  rationale: גְּבוּרָה обозначает силу, мощь или могущество. «Мощь» кратко, выразительно и уместно в возвышенной молитвенной речи.
- source_word: וּלְכָה
  choice: и приди
  rationale: Хотя הלך буквально значит «идти», в обращённой к Богу просьбе контекстуально естественно движение к молящимся ради их избавления; буквальная возможность отмечена в сноске.
- source_word: לִישֻׁעָתָה לָּנוּ
  choice: спасти нас
  rationale: Конструкция выражает цель божественного действия — спасение или избавление народа. Русский инфинитив ясно и естественно передаёт эту функцию.
theological_decisions:
- issue: Характер просимого действия Бога
  choice: 'Прямая просьба явить силу и прийти ради спасения народа: «пробуди свою мощь и приди спасти нас»'
  alternative: «Пробуди свою силу и выступи нам на спасение»
  rationale: Перевод сохраняет напряжённость и настоятельность молитвы, не превращая её в отвлечённое вероучительное утверждение и не добавляя отсутствующих в тексте подробностей.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Синтаксис краток и следует движению еврейской строки; повтор союза между всеми тремя именами естественно сглажен русской пунктуацией.
