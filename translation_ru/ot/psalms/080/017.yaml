    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִי
  choice: Да будет
  rationale: Юссивная форма выражает молитвенное пожелание; «да будет» естественно передаёт его в возвышенной русской поэзии.
- source_word: יָדְךָ
  choice: рука Твоя
  rationale: Сохранён конкретный образ руки, подразумевающий деятельную силу и поддержку Бога, но не сводящий метафору к одному толкованию.
- source_word: עַל
  choice: над
  rationale: В сочетании «рука над кем-либо» предлог естественно передаёт покровительство и действие, сохраняя образ исходного текста.
- source_word: אִישׁ יְמִינֶךָ
  choice: муж Твоей правой руки
  rationale: 'Формально близкая передача сохраняет необычный еврейский оборот и его неоднозначность: речь может идти о человеке, особо избранном, поддерживаемом или поставленном Богом по правую руку.'
- source_word: בֶּן אָדָם
  choice: сын человеческий
  rationale: Сохранены единственное число, мужской род и устойчивый библейский оборот, допускающий как обычное значение «человек», так и царские либо мессианские отзвуки.
- source_word: אִמַּצְתָּ
  choice: Ты укрепил
  rationale: Порода пиэль глагола אמץ обозначает наделение силой или утверждение; русский совершенный вид соответствует завершённому действию еврейского перфекта.
- source_word: לָּךְ
  choice: для Себя
  rationale: Передаёт отношение предназначения или избрания для Бога, включая возвратный оттенок местоименного суффикса.
theological_decisions:
- issue: Следует ли прямо обозначить «мужа Твоей правой руки» и «сына человеческого» как Мессию
  choice: Оставить поэтическое описание без добавленного мессианского титула
  alternative: Передать как прямое именование Мессии либо как однозначное обозначение Израиля
  rationale: В контексте псалма возможны личное, царское, собирательное и мессианское прочтения. Еврейский текст не требует выбрать лишь одно из них, поэтому перевод сохраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Необычное выражение «муж Твоей правой руки» намеренно сохраняет образ и неоднозначность еврейского оригинала; прописные буквы в местоимениях, относящихся к Богу, поддерживают традиционный молитвенный регистр.
