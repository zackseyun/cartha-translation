source:
  edition: WLC
  text: לָ֭/מָּה פָּרַ֣צְתָּ גְדֵרֶ֑י/הָ וְ֝/אָר֗וּ/הָ כָּל עֹ֥בְרֵי דָֽרֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/012.yaml
  text: Why have you broken down its walls[b][a], so that all who pass by the way pluck its fruit?
translation:
  language: ru
  text: Почему Ты разрушил её ограды[a], так что все проходящие по дороге срывают с неё плоды[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её изгороди»; еврейское слово обозначает защитное ограждение вокруг виноградника — стену, ограду или изгородь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «обирают её». Еврейский глагол означает срывать или собирать плоды с лозы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Почему
  rationale: Естественно передаёт вопросительное наречие, вводящее скорбный вопрос к Богу.
- source_word: פָּרַצְתָּ
  choice: Ты разрушил
  rationale: Глагол פרץ означает «проломить, разрушить преграду»; в образе виноградника речь идёт об устранении защитного ограждения.
- source_word: גְדֵרֶיהָ
  choice: её ограды
  rationale: גדר обозначает стену, изгородь или иную ограду, защищающую виноградник. «Ограды» сохраняет множественное число и не создаёт образ городских стен.
- source_word: וְאָרוּהָ
  choice: так что … срывают с неё плоды
  rationale: Глагол ארה выражает срывание или собирание плодов; женский объектный суффикс относится к лозе. Упоминание плодов эксплицирует подразумеваемый объект действия, а «так что» естественно передаёт следствие разрушения оград.
- source_word: כָּל עֹבְרֵי דָרֶךְ
  choice: все проходящие по дороге
  rationale: Близко передаёт буквальное «все проходящие путём» и сохраняет поэтический образ случайных прохожих.
theological_decisions:
- issue: К чему относятся суффиксы женского рода
  choice: 'Сохранить непосредственный образ лозы: «её», «с неё»'
  alternative: Заменить метафору прямым упоминанием Израиля
  rationale: В ближайшем контексте Израиль изображён лозой, вынесенной из Египта. Сохранение женских местоименных форм удерживает метафору и не сводит её к пояснительной прозе.
- issue: Связь между разрушением оград и действиями прохожих
  choice: 'Передать союз как следствие: «так что»'
  alternative: Формально передать простым союзом «и»
  rationale: Еврейский ו допускает контекстуальное значение результата; здесь действия прохожих представлены естественным следствием снятия защиты, хотя формально возможна и простая сочинительная связь.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Прямое обращение к Богу отмечено прописным «Ты» согласно распространённой русской библейской традиции; синтаксис остаётся понятным обычному читателю.
