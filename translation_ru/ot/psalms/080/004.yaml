base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/004.yaml
  text: O Yahweh God of hosts[a], how long will you smoke against the prayer of your people?
translation:
  language: ru
  text: Яхве, Бог воинств, доколе Ты будешь дымиться от гнева[a] на молитву Твоего народа?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дымиться». В еврейском тексте дым служит образом гнева; возможно также: «доколе Ты будешь гневаться на молитву Твоего народа?»'
    reason: Сохраняет буквальную метафору и указывает более естественную смысловую передачу, не скрывая трудного отношения Божьего гнева к молитве народа.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Бог воинств
  rationale: Сохраняет традиционный и достаточно понятный образ воинств, не уточняя без основания, земные они или небесные.
- source_word: עַד מָתַי
  choice: доколе
  rationale: Естественная для русской поэзии и молитвенной речи формула плача, передающая настойчивость вопроса.
- source_word: עָשַׁנְתָּ
  choice: будешь дымиться гневом
  rationale: Сохраняет буквальный образ дыма как выражения Божьего гнева; добавление «гневом» делает метафору понятной современному читателю, не устраняя её.
- source_word: בִּתְפִלַּת
  choice: против молитвы
  rationale: Передаёт вероятное противительное значение предлога ב при глаголе, описывающем гневную реакцию.
- source_word: עַמֶּךָ
  choice: Твоего народа
  rationale: Передаёт общинный и заветный смысл обращения без излишнего уточнения.
theological_decisions:
- issue: Передача имени יְהוָה в составном обращении
  choice: Яхве, Бог воинств
  alternative: Господь, Бог сил
  rationale: Текст прямо содержит тетраграмматон; транслитерация сохраняет личное имя, а «Бог воинств» — широту военного и космического образа.
- issue: Сохранение метафоры дыма как Божьего гнева
  choice: будешь дымиться гневом
  alternative: будешь гневаться
  rationale: Более гладкий вариант устранил бы яркий антропоморфный образ еврейского глагола. Выбранная формулировка сохраняет поэтическую напряжённость плача.
- issue: Отношение Божьего гнева к молитве народа
  choice: против молитвы
  alternative: на молитву
  rationale: 'Противительная формулировка сохраняет трудную богословскую мысль текста: гнев направлен даже против молитвы народа, а не только вызван иным предметом.'
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим оттенком. «Доколе» уместно для псалмового плача; необычность выражения «дымиться гневом» намеренно сохраняет образ оригинала. Местоимения обращения к Богу написаны с прописной буквы в соответствии с русской благоговейной издательской традицией.
