  text: Кабан из леса обгрызает её[a], и полевые звери кормятся ею[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разоряет её»; редкий глагол описывает разрушительное объедание или обгрызание.'
