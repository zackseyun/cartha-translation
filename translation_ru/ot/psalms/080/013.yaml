    text: 'Или: «пасутся на ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְכַרְסְמֶנָּה
  choice: объедает её
  rationale: Редкий глагол כרסם обозначает разрушительное объедание или обгрызание животным. «Объедает» естественно передаёт повреждение виноградной лозы при поедании, не усиливая смысл до полного уничтожения.
- source_word: חֲזִיר
  choice: кабан
  rationale: חֲזִיר означает свинью или кабана; указание на лес делает «кабан» естественным и точным выбором.
- source_word: מִיָּעַר
  choice: лесной
  rationale: Буквально сочетание означает «из леса». В русском определение «лесной» кратко и естественно передаёт происхождение и среду обитания кабана.
- source_word: זִיז שָׂדַי
  choice: полевые звери
  rationale: Редкое זִיז обозначает движущихся живых существ, особенно диких животных; в сочетании со שָׂדַי выражение естественно передаётся как «полевые звери».
- source_word: יִרְעֶנָּה
  choice: кормятся ею
  rationale: Глагол רעה в qal означает пастись или кормиться. Женский суффикс относится к лозе; «кормятся ею» сохраняет образ животных, поедающих растительность.
