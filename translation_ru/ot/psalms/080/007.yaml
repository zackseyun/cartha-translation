lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Слово употреблено как прямое обращение; русский звательный оборот естественно передаётся формой «Боже».
- source_word: צְבָאוֹת
  choice: воинств
  rationale: 'В составе божественного титула традиционное «воинств» сохраняет широту значения: речь может идти о небесных силах и иных подвластных Богу воинствах, а не только о человеческих армиях.'
- source_word: הֲשִׁיבֵנוּ
  choice: восстанови нас
  rationale: Каузативная форма от שוב допускает значения «возврати нас», «обрати нас» и «восстанови нас». В данном рефрене «восстанови нас» естественно передаёт просьбу, не ограничивая её географическим возвращением или исключительно духовным обращением.
- source_word: וְהָאֵר פָּנֶיךָ
  choice: озари нас светом лица Твоего
  rationale: Каузатив от אור означает «заставить светить». Русская библейская идиома «озари нас светом лица Твоего» сохраняет образ Божьего лица и ясно выражает направленность Его благоволения на молящихся.
- source_word: וְנִוָּשֵׁעָה
  choice: и мы спасёмся
  rationale: Нифаль от ישׁע обозначает спасение или избавление как результат Божьего благоволения. Формулировка сохраняет широкий смысл и естественную последовательность просьбы и результата.
theological_decisions:
- issue: Передача божественного титула אֱלֹהִים צְבָאוֹת
  choice: Боже воинств
  alternative: Боже сил; Боже небесных воинств
  rationale: «Боже воинств» сохраняет установленный библейский титул и не сужает Божье владычество до командования человеческими армиями.
- issue: Объём значения וְנִוָּשֵׁעָה
  choice: и мы спасёмся
  alternative: и мы будем избавлены
  rationale: Еврейское слово может обозначать как конкретное избавление от беды, так и спасение в более широком смысле. «Спасёмся» сохраняет эту богословскую и контекстуальную открытость.
- issue: Образ Божьего лица
  choice: озари нас светом лица Твоего
  alternative: да воссияет лицо Твоё; яви нам Своё благоволение
  rationale: Конкретный образ лица сохранён, поскольку он выражает Божье благосклонное присутствие, не сводя его к отвлечённому понятию.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Сохранены традиционный титул «Боже воинств» и библейский образ света Божьего лица; синтаксис сделан естественным для современного читателя. Все примечания отмечены в основном тексте.
