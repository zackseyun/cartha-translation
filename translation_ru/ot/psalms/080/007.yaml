  text: God of hosts[a], restore us; make your face shine[c][b], and we will be saved.
translation:
  language: ru
  text: Боже воинств, восстанови нас[a]; пусть воссияет лицо Твоё[b], и мы спасёмся[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возврати нас» или «обрати нас». Еврейский глагол может выражать как возвращение, так и восстановление.'
