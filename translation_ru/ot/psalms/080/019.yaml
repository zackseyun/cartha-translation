  text: יְה֘וָ֤ה אֱלֹהִ֣ים צְבָא֣וֹת הֲשִׁיבֵ֑/נוּ הָאֵ֥ר פָּ֝נֶ֗י/ךָ וְ/נִוָּשֵֽׁעָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/019.yaml
  text: O Yahweh God of hosts[a], restore us; make your face shine[b], that we may be saved.
translation:
  language: ru
  text: Яхве, Боже воинств, восстанови нас[a]; да засияет лицо Твоё, чтобы мы спаслись[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возврати нас»; или: «обрати нас».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и мы спасёмся».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Боже воинств
  rationale: В обращении אֱלֹהִים передано звательной формой «Боже», а צְבָאוֹת — традиционным и достаточно ясным «воинств», которое не сужает образ исключительно до земных армий.
- source_word: הֲשִׁיבֵנוּ
  choice: восстанови нас
  rationale: Каузативный императив от שוב может означать «возврати/обрати нас»; по контексту рефрена речь также идёт о восстановлении народа. Основной вариант естественно охватывает обе стороны смысла, а буквальные альтернативы сохранены в примечании.
- source_word: הָאֵר פָּנֶיךָ
  choice: да засияет лицо Твоё
  rationale: Сохраняет конкретный образ Божьего лица и передаёт каузативную просьбу естественной русской формой пожелания, не заменяя «лицо» толкованием «присутствие».
- source_word: וְנִוָּשֵׁעָה
  choice: чтобы мы спаслись
  rationale: Когортативная форма после повелений естественно допускает целевое или результативное понимание. Основной текст передаёт цель молитвы; сочинительное прочтение дано в примечании.
theological_decisions:
- issue: Передача сочетания יְהוָה אֱלֹהִים צְבָאוֹת
  choice: Яхве, Боже воинств
  alternative: Господи, Боже воинств; Яхве, Бог воинств
  rationale: Личное имя יְהוָה сохранено как «Яхве», а грамматическая форма обращения естественно передана русским звательным «Боже». «Воинств» сохраняет широту традиционного божественного титула.
- issue: Смысл заключительной формы וְנִוָּשֵׁעָה
  choice: чтобы мы спаслись
  alternative: и мы спасёмся
  rationale: Последовательность повелений и когортатива позволяет видеть здесь цель или ожидаемый результат. Целевое прочтение помещено в основной текст, но возможное результативное прочтение не устранено и указано в примечании.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным молитвенным звучанием. Сохранены библейские образы «воинств» и сияющего Божьего лица; местоимение «Твоё» написано с прописной буквы как уважительная издательская норма.
