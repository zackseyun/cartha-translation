  source_fidelity: Текст точно передаёт еврейское обращение «Яхве, Боже воинств», каузативный императив הֲשִׁיבֵנוּ («восстанови нас»), просьбу о сиянии Божьего лица и заключительную волитивную форму в целевом прочтении («чтобы мы спаслись»). Формула «да засияет лицо Твоё» — естественная русская передача еврейского каузативного призыва в молитвенно-библейском регистре.
