  yaml_path: translation/ot/psalms/080/011.yaml
  text: It sent out its branches as far as the sea[b][a], and its shoots to the River.
translation:
  language: ru
  text: Она простёрла свои ветви до моря[a], а свои побеги — до Реки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово здесь необычно и может обозначать ветви лозы или, шире, её разрастающуюся поросль. Под морем, вероятно, подразумевается Средиземное море.
    reason: lexical_alternative
  - marker: b
    text: «Река», вероятно, означает Евфрат; море и Река обозначают идеальные западную и восточную границы земли Израиля.
    reason: cross_reference
lexical_decisions:
- source_word: תְּשַׁלַּח
  choice: простёрла
  rationale: Пиэль глагола שלח здесь изображает лозу, широко протягивающую свою поросль; «простёрла» естественно и поэтично передаёт пространственный размах.
- source_word: קְצִירֶהָ
  choice: свои ветви
  rationale: Редкое в данном значении слово в контексте лозы обозначает распространяющуюся поросль. «Ветви» ясно соответствует образу и сохраняет параллелизм с «побегами».
- source_word: עַד יָם
  choice: до моря
  rationale: Предлог עַד обозначает предел распространения; русское «до моря» естественно выражает эту протяжённость. Вероятно, имеется в виду Средиземное море.
- source_word: וְאֶל נָהָר
  choice: до Реки
  rationale: В формуле границ земли «Река» обычно означает Евфрат; прописная буква передаёт вероятное географическое употребление, не вставляя название в основной текст.
- source_word: יוֹנְקוֹתֶיהָ
  choice: свои побеги
  rationale: Слово обозначает молодую поросль или ответвления растения; «побеги» — точный и понятный современный ботанический образ.
theological_decisions:
- issue: Географический смысл образа моря и Реки
  choice: Сохранить поэтические обозначения «море» и «Река», пояснив вероятные референты в сноске.
  alternative: Прямо назвать в тексте Средиземное море и Евфрат.
  rationale: Еврейский текст использует нарицательные обозначения; такое решение сохраняет образность и не превращает вероятную идентификацию в явное содержание стиха.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтической образности. Местоимение «она» относится к виноградной лозе из контекста; повтор «свои» поддерживает ясность параллельных строк.
