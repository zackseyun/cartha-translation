  text: 'For the choir director: according to “Lilies.” A testimony[b][a]. A psalm of Asaph.'
translation:
  language: ru
  text: Руководителю хора. На мотив «Лилии». Свидетельство.[a] Псалом Асафа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское надписание содержит музыкальные или богослужебные обозначения, точный смысл и связь которых неясны. Возможно также: «Руководителю хора. На мотив „Лилии свидетельства“. Псалом Асафа».'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Обычная формула в надписаниях псалмов, обращённая к тому, кто руководит музыкальным исполнением; современная и ясная передача без излишней конкретизации его должности.
- source_word: אֶל
  choice: На мотив
  rationale: В надписаниях псалмов предлог, вероятно, вводит название мелодии или способ исполнения. Такая передача естественна по-русски, хотя точная функция обозначения не вполне ясна.
- source_word: שֹׁשַׁנִּים
  choice: «Лилии»
  rationale: Вероятнее всего, это название мелодии или иное музыкальное обозначение, поэтому слово оформлено как название, а не как буквальное упоминание цветов.
- source_word: עֵדוּת
  choice: Свидетельство
  rationale: Сохранено прямое значение слова и его отдельное положение в еврейском тексте; возможно, это литургическое или музыкальное обозначение, точный смысл которого неизвестен.
- source_word: לְאָסָף
  choice: Асафа
  rationale: Родительный падеж естественно передаёт традиционную атрибуцию, не уточняя, означает ли она авторство, принадлежность кругу Асафа или включение в связанную с ним коллекцию.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшееся русское обозначение песнопения данного жанра.
theological_decisions:
- issue: Характер связи псалма с Асафом
  choice: Псалом Асафа
  alternative: Псалом для Асафа / псалом из собрания Асафа
  rationale: Еврейский предлог לְ допускает несколько видов связи. Традиционная русская формула сохраняет атрибуцию, не утверждая однозначно личное авторство.
- issue: Связь слова עֵדוּת с соседними элементами надписания
  choice: 'Передать отдельным предложением: «Свидетельство»'
  alternative: 'Объединить с названием: «Лилии свидетельства»'
  rationale: Синтаксическая связь в кратком надписании неясна; раздельная передача не навязывает спорное понимание как части названия мелодии.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской сдержанностью. Краткие фразы сохраняют характер древнего надписания; кавычки показывают, что «Лилии» вероятнее всего являются названием мелодии.
