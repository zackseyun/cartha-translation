  yaml_path: translation/ot/psalms/080/016.yaml
  text: Burned with fire, cut down—at the rebuke of your face they perish.
translation:
  language: ru
  text: Огнём сожжена, срублена — от грозного Твоего окрика погибают.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂרֻפָה בָאֵשׁ
  choice: Огнём сожжена
  rationale: Женский род сохраняет связь с виноградной лозой из ближайшего контекста; сочетание передаёт усиленную еврейскую конструкцию буквально и естественно.
- source_word: כְּסוּחָה
  choice: срублена
  rationale: Передаёт образ лозы, которую отсекли или срубили; краткая форма согласована с שְׂרֻפָה.
- source_word: מִגַּעֲרַת פָּנֶיךָ
  choice: от грозного взгляда Твоего
  rationale: גְּעָרָה означает грозный окрик или обличение, а פָּנֶיךָ буквально — «Твоего лица». По-русски сочетание выражает губительное Божье неодобрение естественно, не сводя образ к обычному словесному упрёку.
- source_word: יֹאבֵדוּ
  choice: погибают
  rationale: Настоящее время сохраняет незавершённый аспект и живую поэтическую сцену; множественное число оригинала оставлено без явного подлежащего.
theological_decisions:
- issue: Субъект формы יֹאבֵדוּ во множественном числе после описания лозы в женском единственном числе
  choice: Сохранить безлично-контекстуальное «погибают» без добавления субъекта
  alternative: «она погибает» или «пусть они погибнут»
  rationale: Множественное число может относиться к народу, врагам либо частям лозы; добавление явного субъекта или замена числа устранили бы подлинную неоднозначность.
- issue: Передача «лица» Бога
  choice: «грозного взгляда Твоего»
  alternative: «от укоризны лица Твоего»
  rationale: Сохраняется антропоморфный образ Божьего обращения к виновным, но фраза звучит понятно и достойно в современном русском языке.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической краткостью. Инверсия «Огнём сожжена» и тире сохраняют резкость и параллелизм еврейской строки; местоимение, обращённое к Богу, написано с прописной буквы согласно русской библейской традиции.
