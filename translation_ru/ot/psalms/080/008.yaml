  text: You brought a vine out of Egypt[b][a]; you drove out nations and planted it.
translation:
  language: ru
  text: Ты вынес из Египта виноградную лозу[a][b], изгнал народы и посадил её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вывел виноградную лозу из Египта», «перенёс виноградную лозу из Египта» или «выкорчевал виноградную лозу из Египта». Еврейский глагол может обозначать побуждение отправиться в путь, удаление или перенос для пересадки.'
    reason: lexical_alternative
  - marker: b
    text: Виноградная лоза здесь — образ Израиля.
    reason: cross_reference
lexical_decisions:
- source_word: גֶּפֶן
  choice: виноградную лозу
  rationale: Существительное обозначает виноградную лозу и здесь служит метафорой Израиля. Полное выражение естественно и ясно для современного русского читателя.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Предлог указывает на исходную точку движения; выражение естественно передаёт связь с исходом.
- source_word: תַּסִּיעַ
  choice: Ты вынес
  rationale: Порода hифиль глагола נסע допускает значения побуждения отправиться, удаления и перенесения. «Вынес» сохраняет образ лозы, которую извлекают и пересаживают, а также движение из Египта.
- source_word: תְּגָרֵשׁ
  choice: изгнал
  rationale: Порода пиэль глагола גרש означает изгнать, вытеснить. «Изгнал» точно и естественно передаёт действие по отношению к народам.
- source_word: גּוֹיִם
  choice: народы
  rationale: В контексте заселения земли речь идёт о народах; вариант «язычники» вносил бы ненужный позднейший религиозный оттенок.
- source_word: וַתִּטָּעֶהָ
  choice: и посадил её
  rationale: Глагол означает посадить, а местоименный суффикс относится к грамматически женскому существительному «лоза»; русский женский род естественно сохраняет эту связь.
theological_decisions:
- issue: Отождествление виноградной лозы
  choice: Сохранить метафору лозы в основном тексте, пояснив её референт в примечании.
  alternative: Заменить метафору прямым обозначением «Израиль».
  rationale: Еврейский текст говорит об Израиле образно. Прямая замена метафоры толкованием устранила бы поэтический образ.
- issue: Смысл תַּסִּיעַ в образе исхода и пересадки
  choice: Передать как «вынес», сохранив одновременно движение из Египта и образ переноса лозы.
  alternative: «вывел», «заставил отправиться» или «выкорчевал».
  rationale: Глагол допускает несколько близких оттенков. «Вынес» не исключает идею пересадки и не сводит образ только к человеческому путешествию либо только к выкорчёвыванию.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим синтаксисом. Метафора сохранена; обращение к Богу передано местоимением «Ты» с прописной буквы согласно распространённой русской библейской традиции.
