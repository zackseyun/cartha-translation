  yaml_path: translation/ot/psalms/080/014.yaml
  text: God of hosts[a], please return; look down from heaven and see, and visit this vine.
translation:
  language: ru
  text: Боже воинств, вернись же! Взгляни с небес и посмотри, посети[a] эту лозу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может означать «посетить», «обратить внимание», «позаботиться» или «осмотреть»; здесь речь идёт о деятельном вмешательстве ради блага лозы.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Боже воинств
  rationale: Сохраняет форму прямого обращения и образ Бога как Повелителя воинств, не заменяя его более широким по смыслу титулом «Всемогущий» и не прибегая к малопонятному современному читателю «Саваоф».
- source_word: שׁוּב נָא
  choice: вернись же
  rationale: «Вернись» прямо передаёт שׁוּב, а частица «же» естественно выражает настойчивую мольбу, заключённую в נָא, без разговорного оттенка слова «пожалуйста».
- source_word: הַבֵּט מִשָּׁמַיִם
  choice: Взгляни с небес
  rationale: Передаёт повелительную форму глагола внимательного смотрения и небесную точку обзора; направление вниз естественно подразумевается контекстом.
- source_word: וּרְאֵה
  choice: и увидь
  rationale: Сохраняет простой второй императив и поэтическую последовательность «взгляни… и увидь», не сводя её к одному действию.
- source_word: וּפְקֹד
  choice: посети
  rationale: «Посети» формально сохраняет широкий и значимый библейский глагол, который здесь подразумевает деятельное внимание и вмешательство ради блага лозы; смысловая широта пояснена в сноске.
- source_word: גֶּפֶן זֹאת
  choice: эту лозу
  rationale: Точно сохраняет единственное число и развитую в псалме метафору лозы, не подменяя её виноградником.
theological_decisions:
- issue: Передача божественного титула
  choice: Боже воинств
  alternative: Боже Всемогущий; Боже Саваоф
  rationale: Выбранный вариант сохраняет образ воинств и не вносит в текст более общее понятие всемогущества; традиционное «Саваоф» менее прозрачно для обычного современного читателя.
- issue: Характер Божьего посещения
  choice: посети с пояснением благожелательного смысла в сноске
  alternative: позаботься; обрати внимание; осмотри
  rationale: Контекст молитвы указывает на помощь лозе, однако широкий смысл פקד не следует без пояснения сужать до одной формы заботы или проверки.
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенным ритмом. Императивы и повторы еврейской поэзии сохранены; архаизм «Саваоф» не использован. Частица «же» передаёт мольбу естественнее, чем разговорно-вежливое «пожалуйста».
