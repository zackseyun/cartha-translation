lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма является обращением к Богу Израиля. Русский звательный эквивалент «Боже» естественно передаёт прямое обращение без добавления отдельной частицы.
- source_word: הֲשִׁיבֵנוּ
  choice: восстанови нас
  rationale: Каузативная форма от שוב буквально выражает побуждение к возвращению. В данном рефрене «восстанови нас» естественно охватывает и возвращение к Богу, и избавление народа от бедственного положения; буквальные оттенки отмечены в сноске.
- source_word: וְהָאֵר
  choice: пусть воссияет
  rationale: Каузативный императив от אור означает «сделай сияющим». Русская конструкция с «пусть» сохраняет молитвенное побуждение и звучит естественнее, чем тяжеловесное «сделай так, чтобы… сияло».
- source_word: פָּנֶיךָ
  choice: лицо Твоё
  rationale: Сохранён буквальный образ лица, обозначающий Божье благоволение и присутствие; перевод «присутствие» неоправданно устранил бы метафору.
- source_word: וְנִוָּשֵׁעָה
  choice: чтобы мы спаслись
  rationale: Форма 1-го лица множественного числа породы нифаль имеет волитивный оттенок и после повелений естественно понимается как желаемый результат. «Спаслись» сохраняет широкий смысл избавления, не сужая его до одного вида бедствия.
theological_decisions:
- issue: Волитивный оттенок заключительного глагола и его связь с предшествующими просьбами
  choice: 'Передать как молитву о желаемом результате: «чтобы мы спаслись».'
  alternative: «И мы спасёмся».
  rationale: Последовательность повелительных форм и заключительной волитивной формы позволяет услышать просьбу о результате, но допускает и уверенное утверждение. Основной текст передаёт молитвенный оттенок, а альтернативу сохраняет сноска.
- issue: Образ сияющего Божьего лица
  choice: 'Сохранить конкретный образ: «пусть воссияет лицо Твоё».'
  alternative: 'Передать смысл истолковательно: «яви нам Своё благоволение» или «яви нам Своё присутствие».'
  rationale: Образ несёт одновременно значения благоволения и присутствия и перекликается со священническим благословением; замена абстрактным понятием устранила бы эту многозначность.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью. Синтаксис краток и пригоден для рефрена; традиционный библейский образ «сияющего лица» сохранён без архаизмов. Местоимение «Твоё» написано с прописной буквы как допустимая норма религиозного регистра.
