  text: רֹ֘עֵ֤ה יִשְׂרָאֵ֨ל הַאֲזִ֗ינָ/ה נֹהֵ֣ג כַּ/צֹּ֣אן יוֹסֵ֑ף יֹשֵׁ֖ב הַ/כְּרוּבִ֣ים הוֹפִֽיעָ/ה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/001.yaml
  text: Shepherd of Israel[a], give ear, you who lead Joseph like a flock; you who are enthroned above the cherubim[c][b], shine forth.
translation:
  language: ru
  text: 'Пастырь Израиля, внемли,

    Ты, ведущий Иосифа, словно стадо;

    Ты, восседающий на херувимах,

    воссияй!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רֹעֵה
  choice: Пастырь
  rationale: Причастие породы qal употреблено как обращение и божественный титул. «Пастырь» естественно и поэтично сохраняет образ заботы и водительства.
- source_word: הַאֲזִינָה
  choice: внемли
  rationale: Повелительная форма выражает просьбу внимательно услышать. «Внемли» сохраняет возвышенный поэтический тон и при этом понятно современному читателю.
- source_word: נֹהֵג
  choice: ведущий
  rationale: Причастие продолжает пастушеский образ и передаёт деятельное водительство без излишне жёсткого оттенка глагола «гнать».
- source_word: כַּצֹּאן
  choice: словно стадо
  rationale: Собирательное существительное обозначает мелкий скот как стадо; перевод сохраняет сравнение и его коллективный смысл.
- source_word: יוֹסֵף
  choice: Иосифа
  rationale: Собственное имя сохранено, поскольку оно прямо стоит в еврейском тексте, хотя здесь метонимически обозначает народ или его северные племена.
- source_word: יֹשֵׁב הַכְּרוּבִים
  choice: Восседающий на херувимах
  rationale: В данном царственно-храмовом образе ישב означает не просто пребывание, а восседание. Предлог в еврейском выражении не назван явно, поэтому пространственная связь остаётся несколько неопределённой и поясняется в сноске.
- source_word: הוֹפִיעָה
  choice: явись в сиянии
  rationale: Побудительная форма в контексте богоявления сочетает смысл явления с сияющим величием; формулировка передаёт оба оттенка.
theological_decisions:
- issue: Образ Божьего восседания и херувимов
  choice: Восседающий на херувимах
  alternative: Восседающий над херувимами; пребывающий среди херувимов
  rationale: Перевод сохраняет царский образ Божьего присутствия, связанный с ковчегом и святилищем, не сводя выражение к простому указанию места. Возможные пространственные истолкования вынесены в сноску.
- issue: Значение имени «Иосиф»
  choice: Сохранить имя «Иосиф» в основном тексте
  alternative: Заменить на «Израиль» или «северные племена»
  rationale: Подмена имени истолкованием устранила бы метонимию оригинала. Возможный коллективный смысл разъяснён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмической интонацией. Параллельные обращения и повелительные формы расположены отдельными строками, чтобы передать поэтическую структуру и масоретическое членение стиха.
