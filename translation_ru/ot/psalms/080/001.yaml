  rationale: 'Перевод уточнён в соответствии с еврейским текстом: «воссияй» непосредственно передаёт призыв к сияющему явлению, а параллельные обращения сделаны синтаксически ясными по-русски. Сноска исправлена так, чтобы не приписывать еврейскому тексту отсутствующий предлог и сохранить допустимую неоднозначность образа херувимов.'
