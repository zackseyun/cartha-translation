  text: פִּנִּ֥יתָ לְ/פָנֶ֑י/הָ וַ/תַּשְׁרֵ֥שׁ שָׁ֝רָשֶׁ֗י/הָ וַ/תְּמַלֵּא אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/009.yaml
  text: You cleared the ground before it[c][b][a], and it took root and filled the land.
translation:
  language: ru
  text: Ты расчистил перед ней место[a]; она пустила корни[b] и наполнила землю[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты приготовил для неё место». Еврейское выражение может означать расчистку или подготовку пространства перед лозой.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «она укоренила свои корни» — еврейский поэтический оборот, означающий, что лоза прочно укоренилась.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может означать как определённую землю или страну, так и землю в более широком смысле.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּנִּיתָ לְפָנֶיהָ
  choice: Ты расчистил перед ней место
  rationale: Пиэль глагола פנה в сочетании с לְפָנֶיהָ передаёт устранение препятствий и подготовку пространства перед лозой. Формулировка сохраняет сельскохозяйственный образ и женский род лозы из предыдущего стиха.
- source_word: וַתַּשְׁרֵשׁ שָׁרָשֶׁיהָ
  choice: она пустила корни
  rationale: Буквальное сочетание «укоренила свои корни» по-русски неестественно. «Пустила корни» естественно передаёт еврейскую фигуру внутреннего объекта, не добавляя отсутствующего в тексте усиления «глубоко».
- source_word: וַתְּמַלֵּא
  choice: наполнила
  rationale: Сохраняет основное значение מלא и образ разросшейся лозы, занявшей пространство.
- source_word: אָרֶץ
  choice: землю
  rationale: Русское «землю» допускает как местное значение территории или страны, так и более широкий смысл земли, сохраняя неоднозначность еврейского אֶרֶץ.
theological_decisions:
- issue: Референт образа лозы
  choice: Сохранить в стихе образ лозы, обозначив её местоимением женского рода.
  alternative: Раскрыть метафору и прямо назвать Израиль.
  rationale: Контекст псалма связывает лозу с Израилем, но сам стих продолжает растительную метафору; её не следует заменять толкованием.
- issue: Степень укоренения
  choice: «пустила корни» без усиления
  alternative: «глубоко укоренилась»
  rationale: Еврейский текст подчёркивает укоренение посредством однокоренного глагола и существительного, но не содержит отдельного слова со значением «глубоко».
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим ритмом. Женское местоимение сохраняет связь с лозой из предыдущего стиха; национальный референт метафоры не раскрывается непосредственно.
