  text: תְּשִׂימֵ֣/נוּ מָ֭דוֹן לִ/שְׁכֵנֵ֑י/נוּ וְ֝/אֹיְבֵ֗י/נוּ יִלְעֲגוּ לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/080/006.yaml
  text: You make us a cause of strife to our neighbors, and our enemies mock them.
translation:
  language: ru
  text: 'Ты делаешь нас предметом раздора для наших соседей,

    и наши враги насмехаются над ними.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּשִׂימֵנוּ
  choice: Ты делаешь нас
  rationale: Имперфект второго лица передан настоящим временем как описание продолжающегося Божьего действия; объект первого лица множественного числа сохранён.
- source_word: מָדוֹן
  choice: предметом раздора
  rationale: Существительное обозначает раздор, распрю; выражение «предметом раздора» естественно передаёт конструкцию, в которой народ становится поводом для вражды.
- source_word: לִשְׁכֵנֵינוּ
  choice: для наших соседей
  rationale: Предлог ל передан без добавления отсутствующего в тексте уточнения о том, происходит ли раздор между соседями или направлен против народа.
- source_word: יִלְעֲגוּ לָמוֹ
  choice: насмехаются над ними
  rationale: Глагол לעג означает насмехаться, а местоименная форма לָמוֹ формально указывает на третье лицо множественного числа — «над ними».
theological_decisions:
- issue: Референт местоимения לָמוֹ
  choice: над ними
  alternative: над нами
  rationale: Масоретский текст содержит форму третьего лица множественного числа, ближайший грамматический референт которой — «наши соседи». Более привычное по контексту «над нами» потребовало бы исправления или смысловой подмены исходной формы.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Сохранён параллелизм двух строк и необычный переход от «нас» к «ним», присутствующий в масоретском тексте.
