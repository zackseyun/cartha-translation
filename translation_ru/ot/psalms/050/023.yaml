base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/023.yaml
  text: Whoever offers a sacrifice of thanksgiving honors me[c][b][a], and to the one who orders his way I will show the salvation of God.
translation:
  language: ru
  text: Кто приносит благодарственную жертву[a], тот чтит Меня; а тому, кто упорядочивает свой путь[b], Я покажу Божье спасение[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертву благодарения». Еврейское תּוֹדָה означает благодарение, выраженное в форме жертвоприношения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кто упорядочивает свою жизнь»; возможно также: «кто готовит путь». Еврейское выражение кратко и допускает разные способы понимания.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «Божье избавление» либо «Божью победу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: Кто приносит
  rationale: Субстантивированное причастие породы qal обозначает всякого совершающего жертвоприношение; русская конструкция с «кто» естественно передаёт обобщённое значение.
- source_word: תּוֹדָה
  choice: благодарственную жертву
  rationale: В жертвенном контексте слово обозначает благодарение, выраженное посредством жертвоприношения; перевод сохраняет и благодарственный, и культовый смысл.
- source_word: יְכַבְּדָנְנִי
  choice: чтит Меня
  rationale: Форма piel от כבד означает «чтить, прославлять». «Чтит» ясно и естественно выражает признание Божьей чести.
- source_word: וְשָׂם דֶּרֶךְ
  choice: а тому, кто приводит свой путь в порядок
  rationale: Сжатое еврейское выражение буквально говорит об установлении или упорядочении пути. Выбранная формулировка сохраняет образ пути и передаёт вероятный смысл — упорядочить свою жизнь и поведение.
- source_word: אַרְאֶנּוּ
  choice: Я явлю
  rationale: Hiphil от ראה с местоименным суффиксом означает «дам ему увидеть, покажу ему». «Я явлю» кратко и достойно передаёт обещание, а адресат уже выражен словом «тому».
- source_word: בְּיֵשַׁע אֱלֹהִים
  choice: Божье спасение
  rationale: יֵשַׁע может означать спасение, избавление или победу. «Божье спасение» наиболее естественно в контексте псалма; предлог בְ входит в еврейскую конструкцию со значением того, что будет показано.
theological_decisions:
- issue: Смысл выражения וְשָׂם דֶּרֶךְ
  choice: Обещание обращено к тому, кто приводит свой жизненный путь в порядок.
  alternative: «кто устанавливает путь» или «кто готовит путь»
  rationale: Еврейская фраза допускает разные способы синтаксического осмысления. Основной перевод передаёт вероятный этический смысл, но примечание сохраняет образную и смысловую неоднозначность, не превращая стих в более узкое вероучительное утверждение.
- issue: Значение יֵשַׁע אֱלֹהִים
  choice: Божье спасение
  alternative: Божье избавление или Божья победа
  rationale: Слово охватывает спасение, избавление и победоносную помощь. «Спасение» сохраняет широкий богословский диапазон, а альтернативы отмечены в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для псалма. Формулировка избегает архаизмов, сохраняет жертвенную лексику и образ жизненного пути. Заглавные буквы в «Меня» и «Я» обозначают говорящего Бога по принятой русской библейской традиции.
