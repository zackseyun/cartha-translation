lexical_decisions:
- source_word: יִקְרָא
  choice: призывает
  rationale: Форма qal, 3-е лицо мужского рода единственного числа, допускает значения «звать» и «созывать». В судебном контексте «призывает» естественно передаёт обращение к небесам и земле как к участникам или свидетелям, не превращая этот оттенок в явный юридический термин.
- source_word: אֶל הַשָּׁמַיִם מֵעָל
  choice: небеса свыше
  rationale: אֶל обозначает направленность действия, а מֵעָל здесь естественно понимать как наречное уточнение к «небесам». Поэтическое «небеса» сохраняет космический масштаб параллели с землёй.
- source_word: וְאֶל הָאָרֶץ
  choice: и землю
  rationale: В сочетании с глаголом «призывает» русское прямое дополнение звучит естественно; параллель с небесами указывает именно на землю как часть космоса, а не на отдельную страну.
- source_word: לָדִין
  choice: чтобы судить
  rationale: Инфинитив с לְ выражает цель. Конструкция «чтобы судить» ясно и естественно передаёт целевое значение.
- source_word: עַמּוֹ
  choice: свой народ
  rationale: Существительное עַם передано как «народ», а местоименный суффикс — русским возвратным притяжательным «свой», поскольку обладатель совпадает с подразумеваемым субъектом.
theological_decisions:
- issue: Подразумеваемый субъект глагола
  choice: Сохранено местоименное «Он» без добавления имени «Бог».
  alternative: «Бог призывает…»
  rationale: В еврейском стихе субъект выражен только формой глагола мужского рода единственного числа и устанавливается из контекста. Добавление слова «Бог» сделало бы неявное явным.
- issue: Роль небес и земли в сцене суда
  choice: Текст говорит, что Он их «призывает», не уточняя формально их судебную роль.
  alternative: «созывает небеса и землю как свидетелей»
  rationale: Судебный контекст допускает представление о небесах и земле как о свидетелях, но сам стих не называет их свидетелями; такое уточнение было бы толкованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. «Небеса свыше» сохраняет образность оригинала; строчная буква в «свой» соответствует нейтральной современной орфографии и не вводит конфессиональной стилизации. Двоеточие показывает переход к последующему призыву.
