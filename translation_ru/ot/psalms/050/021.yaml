  text: אֵ֤לֶּה עָשִׂ֨יתָ וְֽ/הֶחֱרַ֗שְׁתִּי דִּמִּ֗יתָ הֱֽיוֹת אֶֽהְיֶ֥ה כָמ֑וֹ/ךָ אוֹכִיחֲ/ךָ֖ וְ/אֶֽעֶרְכָ֣ה לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/021.yaml
  text: You did these things[a], and I kept silent; you thought that I was altogether like you[b]. I will rebuke you and set the case before your eyes.
translation:
  language: ru
  text: Ты совершил всё это, и Я молчал; ты думал, что Я такой же, как ты.[a] Я обличу тебя и изложу всё перед твоими глазами.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ты вообразил, что Я буду таким же, как ты». Еврейская конструкция допускает различное выражение времени ошибочного предположения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и расположу перед твоими глазами». Что именно будет расположено или изложено, в еврейском тексте прямо не сказано; по контексту речь идёт о проступках или обвинении.'
    reason: implicit_object
lexical_decisions:
- source_word: אֵלֶּה עָשִׂיתָ
  choice: Ты это делал
  rationale: Указательное местоимение отсылает к перечисленным выше поступкам; несовершенный вид естественно передаёт повторявшееся поведение в контексте обвинения.
- source_word: וְהֶחֱרַשְׁתִּי
  choice: и Я молчал
  rationale: Форма обозначает молчание Бога на фоне совершаемых проступков; простая русская формулировка сохраняет напряжение, не истолковывая молчание как одобрение.
- source_word: דִּמִּיתָ
  choice: ты думал
  rationale: Здесь глагол выражает ошибочное предположение; «думал» ясно и естественно для современного русского языка.
- source_word: הֱיוֹת אֶהְיֶה כָמוֹךָ
  choice: что Я такой же, как ты
  rationale: Инфинитив с личной формой היה передаёт содержание ошибочного предположения. «Такой же» отражает усиленную идею уподобления, не навязывая узкой догматической трактовки.
- source_word: אוֹכִיחֲךָ
  choice: Я обличу тебя
  rationale: 'Глагол יכח в породе хифиль здесь имеет нравственно-судебный оттенок: Бог выявляет и предъявляет неправоту. «Обличу» сохраняет вес и достоинство речи.'
- source_word: וְאֶעֶרְכָה
  choice: и изложу всё
  rationale: ערך означает «расположить, привести в порядок, изложить». Дополнение в еврейском тексте не выражено; «всё» по-русски позволяет передать подразумеваемое содержание, а сноска сохраняет буквальную неопределённость.
- source_word: לְעֵינֶיךָ
  choice: перед твоими глазами
  rationale: Сохранён зримый еврейский образ открытого предъявления человеку его поступков.
theological_decisions:
- issue: Божье молчание и последующее обличение
  choice: Молчание передано без поясняющей вставки, а затем следует решительное обличение.
  alternative: Передать молчание как долготерпение или попустительство.
  rationale: Сам стих противопоставляет прежнее молчание Бога ошибочному выводу человека и последующему обличению; перевод не должен заранее сводить молчание к одному богословскому объяснению.
- issue: Степень уподобления Бога человеку
  choice: «что Я такой же, как ты»
  alternative: «что Я буду подобен тебе»
  rationale: Выбранная формулировка естественно выражает ошибочное представление человека о сходстве Бога с ним; сноска отмечает временную неоднозначность конструкции.
- issue: Судебный оттенок וְאֶעֶרְכָה
  choice: «изложу всё перед твоими глазами»
  alternative: «расположу перед твоими глазами» или «предъявлю тебе обвинение»
  rationale: Перевод сохраняет образ упорядоченного предъявления, но не делает подразумеваемый объект исключительно «обвинением», поскольку в оригинале он не назван.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической судебной речи. Заглавные местоимения «Я» следуют принятому русскому библейскому оформлению. Обращение последовательно передано формой единственного числа «ты».
