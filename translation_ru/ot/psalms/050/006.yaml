lexical_decisions:
- source_word: וַיַּגִּידוּ
  choice: возвещают
  rationale: Порода hифиль глагола נגד означает публично объявлять, делать известным. «Возвещают» сохраняет торжественный поэтический тон и естественно передаёт действие в разворачивающейся сцене суда.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Формально множественное еврейское слово здесь имеет собирательное значение; «небеса» — естественный русский поэтический эквивалент.
- source_word: צִדְקוֹ
  choice: Его праведность
  rationale: צדק охватывает как нравственную правоту, так и справедливость, особенно в контексте суда. «Праведность» сохраняет более широкий смысл, а судебный оттенок отмечен в сноске.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предшествующего утверждения. «Ведь» естественно передаёт причинно-пояснительную связь в современном русском языке.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на форму множественного числа, согласование со сказуемым и местоимением ясно указывает на единственное число.
- source_word: שֹׁפֵט
  choice: Судья
  rationale: Причастие употреблено как именная часть сказуемого. «Судья» сохраняет его номинальную силу, не превращая выражение просто в глагол «судит».
- source_word: הוּא
  choice: Сам
  rationale: Самостоятельное местоимение при именном сказуемом несёт эмфатическую функцию; «Сам Бог» естественно передаёт это выделение по-русски.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение древнееврейского литургического обозначения неизвестно, поэтому оно передано традиционной транслитерацией без истолкования.
theological_decisions:
- issue: Значение צדק применительно к Божьему суду
  choice: Его праведность
  alternative: Его справедливость
  rationale: «Праведность» сохраняет широкий смысл Божьей нравственной правоты, проявляющейся в суде, тогда как «справедливость» сильнее подчёркивает судебный аспект. Реальная смысловая возможность альтернативы сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Заглавные буквы в «Его» и «Сам» сохраняют принятую в русском библейском стиле почтительность; тире ясно оформляет именное сказуемое. Неопределённость термина «Села» не устраняется толкованием.
