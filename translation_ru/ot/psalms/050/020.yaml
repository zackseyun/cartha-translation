  text: Ты сидишь и говоришь против брата своего, сына матери своей порочишь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возводишь порочащие обвинения на сына матери своей». Еврейское выражение буквально означает «даёшь поношение»; это идиома, означающая порочить человека поношениями или обвинительной речью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּשֵׁב
  choice: Ты сидишь
  rationale: Сохраняет конкретный образ еврейского глагола ישׁב и его обличительную риторическую силу, не превращая его в наречное «постоянно».
- source_word: בְּאָחִיךָ תְדַבֵּר
  choice: говоришь против брата своего
  rationale: При глаголе דבר предлог ב в контексте враждебной речи имеет значение «против»; порядок слов остаётся естественным для русского языка.
- source_word: בְּבֶן אִמְּךָ
  choice: сына матери своей
  rationale: Формально близкая передача сохраняет параллелизм и подчёркивает самое близкое кровное родство, не сводя выражение к общему «родственник».
- source_word: תִּתֶּן דֹּפִי
  choice: порочишь
  rationale: Редкое сочетание буквально означает возлагать на кого-либо поношение или вину, то есть чернить его обвинительной речью. «Порочишь» естественно и ёмко передаёт идиому, не утверждая непременно, что обвинение заведомо ложно.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического параллелизма и несколько торжественной библейской инверсии «брата своего / матери своей». «Порочишь» выбрано вместо более узкого «клевещешь», поскольку еврейское דֹּפִי обозначает поношение или порочащую речь, но само по себе не обязательно уточняет ложность обвинения.
