lexical_decisions:
- source_word: אִם רָאִיתָ
  choice: Если ты видишь
  rationale: Частица אִם вводит условный, риторически описывающий обычное поведение оборот. Перфект רָאִיתָ в таком условии естественно передаётся по-русски настоящим временем.
- source_word: גַּנָּב
  choice: вора
  rationale: Прямое и общеупотребительное соответствие существительному со значением «вор, похититель».
- source_word: וַתִּרֶץ עִמּוֹ
  choice: то одобряешь его
  rationale: Глагол רצה выражает благосклонность, принятие или одобрение; такой перевод сохраняет обвинение в сознательном согласии с вором, не сводя его просто к нахождению в одной компании.
- source_word: מְנָאֲפִים
  choice: прелюбодеями
  rationale: Субстантивированное причастие обозначает людей, совершающих супружескую измену; «прелюбодеи» кратко и точно передаёт это значение в библейском регистре.
- source_word: חֶלְקֶךָ
  choice: твоя доля
  rationale: Сохраняется древнееврейский образ доли или удела, который здесь указывает на сопричастность и отождествление с названной группой.
