base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/022.yaml
  text: Understand this[a], please, you who forget God, lest I tear you apart, and there be no one to rescue.
translation:
  language: ru
  text: Поймите же это, забывающие Бога, иначе Я растерзаю вас, и некому будет вас спасти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּֽינוּ
  choice: Поймите
  rationale: Форма повелительного наклонения множественного числа от בין призывает осмыслить и уразуметь предупреждение; «поймите» прямо и естественно передаёт этот призыв.
- source_word: נָא
  choice: же
  rationale: Частица придаёт настойчивость увещанию. В данном торжественном предупреждении русское «же» естественнее, чем буквальное вежливое «пожалуйста».
- source_word: זֹאת
  choice: это
  rationale: Указательное местоимение отсылает к предшествующему обличению и не требует поясняющего добавления «предупреждение».
- source_word: שֹׁכְחֵי אֱל֑וֹהַּ
  choice: забывающие Бога
  rationale: Причастная форма употреблена как обращение; перевод сохраняет её длительный, характеризующий оттенок без перехода к более отвлечённому «забывшие».
- source_word: פֶּן
  choice: иначе
  rationale: Частица вводит угрожающее последствие. «Иначе» ясно и естественно передаёт предупредительный смысл в современном русском.
- source_word: אֶ֝טְרֹ֗ף
  choice: Я растерзаю
  rationale: Глагол טרף обозначает разрывание добычи. «Растерзаю» сохраняет яркую хищническую метафору; подразумеваемый объект понятен из обращения и в русском может не выражаться.
- source_word: וְ/אֵ֣ין מַצִּֽיל
  choice: и некому будет спасти
  rationale: Отрицательная бытийная конструкция с причинным причастием נצל указывает на отсутствие избавителя. Эта формулировка естественна по-русски и сохраняет безличную структуру.
theological_decisions:
- issue: Образ Божьего суда в אֶטְרֹף
  choice: 'Сохранить прямую метафору растерзания: «Я растерзаю».'
  alternative: Смягчить до «Я погублю» или «Я схвачу».
  rationale: Еврейский глагол создаёт образ хищника, разрывающего добычу. Смягчение ослабило бы суровость Божьего предупреждения и устранило бы присущее тексту напряжение.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной формой предупреждения. Заглавная буква в «Я» указывает на говорящего Бога по непосредственному контексту. Тире перед заключительной фразой подчёркивает итоговую безысходность, не изменяя синтаксической связи с союзом «и».
