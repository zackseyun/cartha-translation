lexical_decisions:
- source_word: שִׁמְעָה
  choice: Слушай
  rationale: Повелительная форма שׁמע призывает не просто услышать звук, а внимательно выслушать. «Слушай» естественно по-русски и сохраняет торжественный призыв.
- source_word: עַמִּי
  choice: народ Мой
  rationale: Форма с суффиксом первого лица выражает принадлежность и отношения завета. Постпозиция местоимения поддерживает возвышенный, но понятный регистр.
- source_word: וַאֲדַבֵּרָה
  choice: и Я буду говорить
  rationale: Когортатив первого лица после повеления передаёт намерение говорящего. Будущее время естественно выражает последовательность и решимость.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Имя сохранено в общепринятой русской форме и выступает прямым обращением, поясняющим «народ Мой».
- source_word: וְאָעִידָה בָּךְ
  choice: Я буду свидетельствовать против тебя
  rationale: Hiphil глагола עוד с предлогом בְּ здесь имеет судебно-свидетельский смысл. «Свидетельствовать против тебя» сохраняет юридическую образность, не ослабляя её до простого предостережения.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму, в данном контексте слово обозначает единственного говорящего и требует единственного числа.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма с суффиксом второго лица единственного числа передаёт личное отношение и формулу завета.
- source_word: אָנֹכִי
  choice: Я —
  rationale: Самостоятельное местоимение подчёркивает личность говорящего. Тире в русском именном предложении естественно передаёт эмфатическое отождествление при отсутствии связки в еврейском.
theological_decisions:
- issue: Передача самоназвания אֱלֹהִים אֱלֹהֶיךָ אָנֹכִי
  choice: Я — Бог, твой Бог
  alternative: Бог, твой Бог — Я
  rationale: Выбранный порядок естественен для современного русского языка, сохраняет усиленное самоотождествление и утверждение отношений завета, не добавляя отсутствующих в тексте богословских уточнений.
- issue: Судебный смысл וְאָעִידָה בָּךְ
  choice: Я буду свидетельствовать против тебя
  alternative: Я предостерегу тебя
  rationale: Контекст изображает Бога как судью и свидетеля. Более слабое «предостерегу» снимает подлинное юридическое напряжение выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Обращение «Израиль» передано без частицы «о», неестественной для обычной современной русской речи. Прописная буква в «Мой» употреблена как издательское обозначение речи Бога; смысл от неё не зависит.
