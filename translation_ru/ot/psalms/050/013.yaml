lexical_decisions:
- source_word: הַאוֹכַל
  choice: Разве Я ем
  rationale: Вопросительная частица с формой 1-го лица образует риторический вопрос; «разве» естественно передаёт ожидаемый отрицательный ответ.
- source_word: בְּשַׂר
  choice: плоть
  rationale: Сохраняет конкретный и торжественный образ жертвенной плоти точнее, чем более бытовое «мясо».
- source_word: אַבִּירִים
  choice: быков
  rationale: В жертвенном контексте слово обозначает сильных животных крупного рогатого скота; «быков» ясно передаёт смысл.
- source_word: וְדַם
  choice: или ... кровь
  rationale: Еврейский союз формально означает «и», но между двумя частями единого риторического вопроса русское «или» звучит естественно и сохраняет параллелизм.
- source_word: עַתּוּדִים
  choice: козлов
  rationale: Существительное обозначает самцов коз; «козлов» передаёт это точно и без необходимости пояснения в основном тексте.
- source_word: אֶשְׁתֶּה
  choice: пью
  rationale: Форма 1-го лица продолжает риторический вопрос; настоящее время естественно для русского обобщённого высказывания.
theological_decisions:
- issue: Антропоморфный язык о жертвенной пище Бога
  choice: Сохранить прямой риторический вопрос и конкретные образы еды и питья
  alternative: 'Передать отвлечённо: «Разве Мне нужны ваши жертвы?»'
  rationale: Текст отрицает буквальную зависимость Бога от жертвенной пищи и крови; конкретный образ выражает эту мысль сильнее и не устраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Заглавное «Я» относится к Богу. Конструкция с «разве» ясно передаёт риторический характер вопроса.
