lexical_decisions:
- source_word: פִּיךָ
  choice: свои уста
  rationale: Сохраняет образ части тела, употреблённой как обозначение речи, и поэтический параллелизм с «язык твой».
- source_word: שָׁלַחְתָּ
  choice: предаёшь
  rationale: Глагол буквально означает «посылать, отпускать»; в сочетании с «уста» выражает предоставление речи во власть или на служение злу. «Предаёшь» естественно передаёт направленность, не сводя образ к простому произнесению слов.
- source_word: בְרָעָה
  choice: злу
  rationale: Дательный падеж при «предаёшь» передаёт направленность еврейского בְ и сохраняет широкий нравственный смысл רָעָה — «зло», а не только причинённый вред.
- source_word: וּלְשׁוֹנְךָ
  choice: и язык твой
  rationale: Буквальное образное выражение сохраняет параллелизм с «свои уста»; порядок слов поддерживает возвышенный поэтический регистр.
- source_word: תַּצְמִיד
  choice: прилепляешь
  rationale: Порода хифиль от צמד обозначает присоединение, сцепление или скрепление. «Прилепляешь» передаёт активное соединение языка с обманом и не подменяет этот образ значением «создаёшь».
- source_word: מִרְמָה
  choice: обману
  rationale: «Обман» — широкое и естественное соответствие для מִרְמָה в контексте лживой речи; оно допускает как ложь, так и коварство.
