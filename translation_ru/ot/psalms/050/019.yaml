  text: 'Ты даёшь своим устам волю для зла[a],

    и язык твой плетёт обман[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обращаешь свои уста ко злу»; буквально: «отпускаешь/посылаешь свои уста во зло».'
