  yaml_path: translation/ot/psalms/050/010.yaml
  text: For every wild animal of the forest is mine[b][a], the cattle on a thousand hills.
translation:
  language: ru
  text: Ведь Мне принадлежат все лесные звери и скот на тысяче гор.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мне принадлежат все звери леса и животные на тысяче холмов». Еврейское слово בְּהֵמוֹת может обозначать крупных животных вообще, а הַרְרֵי — горы или холмы.'
    reason: Сохраняет лексическую широту названий животных и форм рельефа, а также сказуемое принадлежности в альтернативном переводе.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Связывает стих с предыдущим высказыванием как его обоснование; в современном русском «ведь» естественно передаёт причинно-пояснительный оттенок.
- source_word: לִי
  choice: Мне принадлежат
  rationale: Предложная конструкция выражает принадлежность Богу; явный предикат делает русскую фразу ясной и естественной.
- source_word: כָל חַיְתוֹ יָעַר
  choice: все лесные звери
  rationale: Передаёт собирательное значение и принадлежность животных лесу без архаичного оборота «зверь лесной».
- source_word: בְּהֵמוֹת
  choice: скот
  rationale: В данном поэтическом сопоставлении с лесными зверями слово естественно понимать как крупных, преимущественно домашних или пастбищных животных; более широкое значение отмечено в сноске.
- source_word: בְּהַרְרֵי
  choice: на ... гор
  rationale: Предлог указывает на местонахождение, а הָרִים может обозначать горы или возвышенности; «горы» прямо и достойно передаёт образ.
- source_word: אָלֶף
  choice: тысяче
  rationale: Сохраняется названное в еврейском тексте число, не заменяемое толкованием «бесчисленных».
theological_decisions:
- issue: Объём образа Божьей собственности
  choice: Сохранён поэтический образ лесных зверей и скота на тысяче гор как выражение всеохватной принадлежности животных Богу.
  alternative: Понять выражение как строгое указание ровно на тысячу гор или заменить число пояснением «на всех горах».
  rationale: Буквенный образ и число следует сохранить, не сводя поэтическое утверждение ни к инвентарному подсчёту, ни к пояснительному пересказу.
- issue: Связь двух групп животных
  choice: В русском тексте добавлен союз «и», передающий бессоюзное поэтическое перечисление двух параллельных групп.
  alternative: 'Передать второй оборот как приложение: «все лесные звери, скот на тысяче гор».'
  rationale: В еврейском союза нет, однако русское бессоюзие способно ошибочно представить вторую группу как переименование первой. Союз проясняет координацию, не меняя смысла принадлежности.
translation_notes:
  register: Современный литературный русский язык с ясным, но торжественным звучанием. Заглавная буква в «Мне» отражает принятое уважительное оформление речи Бога. Союз «и» введён ради естественной русской координации при бессоюзном параллелизме оригинала.
