lexical_decisions:
- source_word: וְאַתָּה
  choice: Ты же
  rationale: Явно выраженное местоимение подчёркивает обращение, а частица «же» естественно передаёт контраст с предшествующими словами. Союз допускает также пояснительное прочтение, указанное в сноске.
- source_word: שָׂנֵאתָ
  choice: ненавидишь
  rationale: Форма перфекта в данном обвинительном контексте характеризует устойчивое отношение адресата; настоящее время естественно передаёт эту функцию по-русски.
- source_word: מוּסָר
  choice: вразумление
  rationale: Слово обозначает наставление, имеющее исправительный и нравственно-воспитательный характер. «Вразумление» сохраняет обе стороны значения и соответствует возвышенному, но понятному регистру псалма.
- source_word: וַתַּשְׁלֵךְ
  choice: отбрасываешь
  rationale: Глагол сохраняет конкретный образ решительного отвержения. Настоящее время согласуется с характеризующим обвинением в первой половине стиха.
- source_word: דְּבָרַי
  choice: Мои слова
  rationale: Прямой эквивалент еврейского выражения без сужающего истолкования как заповедей или наставлений.
- source_word: אַחֲרֶיךָ
  choice: себе за спину
  rationale: Сохраняет пространственную метафору отвержения и пренебрежения. Возвратное «себе» делает выражение естественным по-русски и не привносит значения тайного действия.
