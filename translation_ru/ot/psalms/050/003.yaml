  yaml_path: translation/ot/psalms/050/003.yaml
  text: Our God comes and does not keep silent[a]; a fire devours before him[b], and around him it storms violently.
translation:
  language: ru
  text: Приходит наш Бог и не молчит[a]. Перед Ним огонь пожирает всё, и вокруг Него неистово бушует буря[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Придёт наш Бог и не будет молчать». Еврейские имперфекты в этом поэтическом контексте могут иметь будущее значение; сочетание с אַל также может передавать оттенок: «пусть Он не молчит».'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте нет отдельного существительного «буря»: употреблена глагольная форма со значением бурного, вихревого движения. Возможны также передачи: «вокруг Него чрезвычайно бурно» или «вокруг Него всё неистово бушует».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָבֹא
  choice: приходит
  rationale: Имперфект Qal от בוא в поэтическом описании может иметь настоящее или будущее значение. Настоящее время передаёт живую непосредственность теофании; возможное будущее значение отмечено в сноске.
- source_word: אֱלֹהֵינוּ
  choice: наш Бог
  rationale: Прямая передача формы אֱלֹהִים с суффиксом первого лица множественного числа; порядок слов сохранён естественным для русского поэтического высказывания образом.
- source_word: וְאַל יֶחֱרַשׁ
  choice: и не молчит
  rationale: Глагол חרשׁ означает молчать, безмолвствовать. В контексте явления Бога сочетание передано как утверждение; грамматически возможный оттенок пожелания или призыва сохранён в сноске.
- source_word: אֵשׁ ... תֹּאכֵל
  choice: пожирает огонь
  rationale: אכל при подлежащем «огонь» означает поглощать, пожирать. Инверсия сохраняет поэтическую выразительность и образ движущегося перед Богом огня.
- source_word: לְפָנָיו
  choice: перед Ним
  rationale: Естественная русская передача пространственного выражения «перед Его лицом», без ненужного буквализма.
- source_word: נִשְׂעֲרָה מְאֹד
  choice: неистово бушует буря
  rationale: Редкая форма передаёт бурное, грозовое или вихревое движение, усиленное מְאֹד. Существительное «буря» добавлено для естественной русской грамматики, не меняя образа; более безличное прочтение дано в сноске.
theological_decisions:
- issue: Изображение явления Бога для суда
  choice: Сохранено прямое описание прихода Бога, огня и бури без добавления христологического или конфессионального толкования.
  alternative: Истолковать стих как прямое пророчество о последнем суде.
  rationale: Сам еврейский текст изображает теофанию с огнём и бурей, но не уточняет её в терминах позднейшего богословия.
- issue: Временное и модальное значение יָבֹא и וְאַל יֶחֱרַשׁ
  choice: 'Основной текст дан как живое повествование в настоящем времени: «приходит… не молчит».'
  alternative: «Придёт… не будет молчать» или «да не молчит».
  rationale: Поэтический имперфект допускает настоящее и будущее прочтения, а אַל с имперфектом обычно имеет волитивную окраску. Неоднозначность не устраняется, а отмечается в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной псалмовой образностью. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Инверсия «пожирает огонь» сохраняет поэтический ритм и не затрудняет понимание.
