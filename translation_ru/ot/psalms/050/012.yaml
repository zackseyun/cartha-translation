source:
  edition: WLC
  text: אִם אֶ֭רְעַב לֹא אֹ֣מַר לָ֑/ךְ כִּי לִ֥/י תֵ֝בֵ֗ל וּ/מְלֹאָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/012.yaml
  text: If I were hungry[a], I would not tell you, for the world and its fullness are mine.
translation:
  language: ru
  text: Если бы Я проголодался, Я не сказал бы тебе об этом, ведь Мне принадлежит мир и всё, что его наполняет[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обитаемая земля и всё, что её наполняет».'
    reason: 'Лексическая альтернатива: תֵבֵל может обозначать мир как обитаемую землю.'
lexical_decisions:
- source_word: אִם אֶרְעַב
  choice: Если бы Я проголодался
  rationale: Сочетание условной частицы אִם с имперфектом выражает здесь риторическую гипотезу. Русская конструкция с «если бы» естественно передаёт условный, а не фактический голод.
- source_word: לֹא אֹמַר לָךְ
  choice: Я не сказал бы тебе об этом
  rationale: Условная форма «не сказал бы» согласуется с первой частью. Добавление «об этом» естественно для русского языка и явно указывает на предполагаемый голод, не меняя смысла.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предыдущего утверждения. «Ведь» сохраняет пояснительно-причинную связь и хорошо звучит в современной литературной речи.
- source_word: לִי
  choice: Мне принадлежит
  rationale: Предложная конструкция выражает принадлежность. Такая передача естественна по-русски и сохраняет акцент на Божьем владении.
- source_word: תֵבֵל
  choice: мир
  rationale: Слово обозначает мир, особенно обитаемую землю. «Мир» — краткий и естественный эквивалент; более узкий оттенок отмечен в сноске.
- source_word: וּמְלֹאָהּ
  choice: и всё, что его наполняет
  rationale: Буквально существительное означает «его полнота». Развёрнутая русская формулировка ясно и естественно передаёт совокупность всего находящегося в мире, не сужая её до имущества или обитателей.
theological_decisions:
- issue: Божья независимость от жертвенной пищи
  choice: 'Стих передан как риторическое условие: даже при гипотетическом голоде Бог не нуждался бы в человеческом обеспечении.'
  alternative: 'Более буквальная форма: «Если Я проголодаюсь, не скажу тебе».'
  rationale: Контекст отвергает представление, будто Бог зависит от приносимой людьми пищи. Условное наклонение по-русски передаёт этот риторический смысл, не добавляя к тексту философских формулировок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Сохранены условность высказывания и краткая причинная связь между частями стиха.
