base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/001.yaml
  text: A psalm of Asaph. The Mighty One[a], God, Yahweh, has spoken and called the earth from the rising of the sun to its setting.
translation:
  language: ru
  text: Псалом Асафа. Могучий Бог, Яхве[a], сказал и призвал землю от восхода солнца до его заката.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бог, Бог, Яхве»; первые два божественных именования также понимают как «Бог богов, Яхве».'
    reason: Сохраняет отмеченную в еврейском тексте и английском аудиторском следе неоднозначность синтаксической связи אֵל אֱלֹהִים יְהוָה.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшееся и точное жанровое обозначение в заголовках псалмов.
- source_word: לְאָסָף
  choice: Асафа
  rationale: Краткая естественная формулировка, сохраняющая возможные оттенки авторства, принадлежности или связи со сборником Асафа.
- source_word: אֵל
  choice: Могучий
  rationale: Передаёт особую лексическую силу אֵל и не сливает три последовательных божественных именования в повтор слова «Бог».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Единственное число обусловлено именем יהוה и глаголами в единственном числе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не замена его титулом.
- source_word: דִּבֶּר
  choice: сказал
  rationale: Совершенный вид естественно передаёт завершённое действие и сохраняет торжественную последовательность высказывания и призыва.
- source_word: וַיִּקְרָא
  choice: и призвал
  rationale: Передаёт последовательное действие и возможный оттенок созыва земли на суд, не делая этот оттенок явным толкованием.
- source_word: אָרֶץ
  choice: землю
  rationale: Универсальный охват от восхода до заката указывает на всю землю, а не на отдельную страну.
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: от восхода солнца
  rationale: Сохраняет поэтический образ и близко следует еврейской формулировке.
- source_word: עַד מְבֹאוֹ
  choice: до его заката
  rationale: Местоимение естественно отнесено к солнцу; формулировка сохраняет меризм всеобщего пространственного охвата.
theological_decisions:
- issue: Передача тройного именования אֵל אֱלֹהִים יְהוָה
  choice: Могучий, Бог, Яхве
  alternative: Бог богов, Яхве; либо Бог, Бог, Яхве
  rationale: Еврейский текст допускает различное понимание связи первых двух слов. Основной вариант сохраняет последовательность трёх именований и передаёт אֵל отлично от אֱלֹהִים, не устраняя подлинную синтаксическую неоднозначность, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным поэтическим звучанием. Сохранены образ восхода и заката, последовательность действий и неоднозначность начального божественного именования.
