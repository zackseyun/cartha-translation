base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/016.yaml
  text: But to the wicked God says[b][a], “What right do you have to recount my statutes and to take my covenant on your lips?”
translation:
  language: ru
  text: 'А нечестивому Бог говорит:


    «Какое у тебя право возвещать Мои постановления[a]

    и носить Мой завет на устах?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что тебе до того, чтобы рассказывать Мои постановления?»'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и поднимать (или: нести) Мой завет на твоём рту».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָרָשָׁע
  choice: А нечестивому
  rationale: Союз וְ в контексте вводит противопоставление предшествующему обращению, а רָשָׁע обозначает нравственно нечестивого человека, а не только виновного в юридическом смысле.
- source_word: אָמַר אֱלֹהִים
  choice: Бог говорит
  rationale: Хотя אָמַר формально стоит в перфекте, в поэтическом введении прямой речи настоящее время естественно передаёт живое, совершающееся обращение Бога.
- source_word: מַה לְּךָ
  choice: Какое право ты имеешь
  rationale: Идиома выражает не нейтральный вопрос, а вызов притязанию и уместности действий нечестивого; этот перевод ясно передаёт обличительный смысл.
- source_word: לְסַפֵּר
  choice: возвещать
  rationale: Глагол סָפַר здесь относится к словесному изложению или провозглашению Божьих предписаний. «Возвещать» сохраняет торжественный поэтический регистр и не сводит действие к механическому перечислению.
- source_word: חֻקָּי
  choice: Мои постановления
  rationale: חֹק обозначает установленное предписание или закон. «Постановления» понятно современному читателю и сохраняет правовой оттенок.
- source_word: וַתִּשָּׂא
  choice: и носить
  rationale: נָשָׂא буквально значит «поднимать, нести». В сочетании с речевым образом уст форма «носить ... на устах» естественна по-русски и сохраняет исходную метафору.
- source_word: בְרִיתִי
  choice: Мой завет
  rationale: «Завет» — устойчивый и содержательно точный эквивалент בְּרִית, сохраняющий его библейский и богословский вес.
- source_word: עֲלֵי פִיךָ
  choice: на устах
  rationale: Буквально сказано «на твоих устах/на твоём рту». Русское «на устах» естественно обозначает произнесение и сохраняет телесный образ оригинала.
theological_decisions:
- issue: Характер обличения нечестивого
  choice: Бог ставит под сомнение нравственное право нечестивого провозглашать Его постановления и завет.
  alternative: Полный запрет нечестивому при любых обстоятельствах упоминать Божий завет.
  rationale: Идиома מַה לְּךָ обличает неуместное притязание и лицемерное несоответствие жизни словам; она не обязательно устанавливает безусловный запрет на всякое упоминание Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным поэтическим звучанием. «Нечестивому», «завет» и «на устах» сохраняют достоинство библейского регистра, оставаясь понятными; синтаксис воспроизводит параллелизм еврейской строки.
