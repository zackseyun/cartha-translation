  yaml_path: translation/ot/psalms/050/015.yaml
  text: And call on me in the day of distress; I will deliver you[a], and you will honor me.
translation:
  language: ru
  text: 'И призови Меня в день бедствия: Я избавлю тебя, и ты прославишь Меня.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּקְרָאֵנִי
  choice: И призови Меня
  rationale: Глагол קרא с объектным суффиксом здесь означает обращение к Богу за помощью. «Призови Меня» естественно для возвышенной современной русской речи и передаёт смысл молитвенного обращения.
- source_word: בְּיוֹם צָרָה
  choice: в день бедствия
  rationale: Буквальное и естественное воспроизведение еврейского временного оборота; «бедствие» передаёт тяжёлое положение или несчастье без излишнего уточнения его характера.
- source_word: אֲחַלֶּצְךָ
  choice: Я избавлю тебя
  rationale: Пиэль глагола חלץ означает избавить или спасти от опасности. «Избавлю» кратко и точно передаёт обещание освобождения.
- source_word: וּתְכַבְּדֵנִי
  choice: и ты прославишь Меня
  rationale: Пиэль כבד может означать «почитать» или «прославлять». В обращении Бога и в поэтическом контексте «прославишь» естественно выражает воздаяние Богу славы как ответ на избавление.
theological_decisions:
- issue: Ответ человека на Божье избавление
  choice: и ты прославишь Меня
  alternative: и ты почтишь Меня
  rationale: Еврейский глагол допускает оба оттенка. «Прославишь» естественно передаёт публичное или молитвенное признание Божьего величия после избавления, не исключая общего смысла почитания.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Сохранены последовательность повеления, обещания и ответного прославления, а также единственное число обращения.
