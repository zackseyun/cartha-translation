lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Псалом Асафа
  rationale: Краткая традиционная формулировка заголовка; еврейский предлог לְ допускает связь псалма с Асафом, не требуя однозначно понимать его как указание на авторство.
- source_word: דִּבֶּר
  choice: изрёк слово
  rationale: Передаёт совершившееся властное речевое действие; добавление «слово» естественно для современного русского и не вносит нового содержания.
- source_word: וַיִּקְרָא אָרֶץ
  choice: и призвал землю
  rationale: Сохраняет прямой объект и оттенок властного призыва или созыва земли.
- source_word: מִמִּזְרַח שֶׁמֶשׁ עַד מְבֹאוֹ
  choice: от восхода солнца до заката
  rationale: Естественно передаёт меризм от места восхода солнца до места его захода, то есть всю землю.
theological_decisions:
- issue: Последовательность божественных наименований אֵל אֱלֹהִים יְהוָה
  choice: Бог, Бог, Яхве
  alternative: Бог богов, Господь; Могучий, Бог, Господь
  rationale: Основной текст сохраняет три наименования и их напряжённую, необычную последовательность, не превращая её без необходимости в конструкцию «Бог богов». Альтернативные способы синтаксического и лексического понимания отмечены в сноске.
- issue: Передача тетраграмматона יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя передано транслитерацией, чтобы отличить его от титулов אֵל и אֱלֹהִים; традиционная замена «Господь» указана как вариант.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической интонацией. Необычное тройное именование Бога намеренно сохранено, а его возможные толкования вынесены в сноску.
