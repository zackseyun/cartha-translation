base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/014.yaml
  text: Offer to God a sacrifice of thanksgiving[a], and fulfill your vows to the Most High.
translation:
  language: ru
  text: Принеси Богу жертву благодарения[a] и исполни свои обеты Всевышнему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принеси Богу благодарность как жертву». Еврейское слово תודה в этом жертвенном контексте может означать как «благодарение», так и «благодарственную жертву».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבַח
  choice: Принеси
  rationale: Повелительная форма глагола זבח обозначает принесение жертвы. «Принеси» естественно звучит по-русски в сочетании с существительным «жертва» и сохраняет культовый смысл.
- source_word: לֵאלֹהִים
  choice: Богу
  rationale: Предлог ל указывает на того, кому приносится жертва; русский дательный падеж передаёт это естественно и точно.
- source_word: תּוֹדָה
  choice: жертву благодарения
  rationale: תודה может означать как благодарение, так и благодарственную жертву. Формулировка сохраняет одновременно смысл благодарности и жертвенный контекст, не сводя выражение однозначно к специальному виду обряда.
- source_word: וְשַׁלֵּם
  choice: и исполни
  rationale: В сочетании с обетами שלם означает выполнить принятое обязательство. «Исполни обеты» — естественное современное русское выражение без излишне буквального оттенка «заплати».
- source_word: לְעֶלְיוֹן
  choice: Всевышнему
  rationale: עֶלְיוֹן — божественный титул «Всевышний». Русский дательный падеж передаёт предлог ל.
- source_word: נְדָרֶיךָ
  choice: свои обеты
  rationale: Форма множественного числа с суффиксом второго лица мужского рода единственного числа означает «твои обеты». Возвратное «свои» естественно соотносит обеты с адресатом повеления.
theological_decisions:
- issue: Культовое сочетание זבח и תודה
  choice: жертву благодарения
  alternative: «благодарение» или «благодарственную жертву»
  rationale: Еврейское выражение допускает понимание благодарности, приносимой как жертва, либо благодарственной жертвы как культового приношения. Основной текст удерживает обе стороны смысла, а сноска прямо отмечает неоднозначность.
- issue: Божественный титул עֶלְיוֹן
  choice: Всевышнему
  alternative: «Эльону»
  rationale: Это осмысленный божественный титул, поэтому он переведён, а не транслитерирован.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и понятным повелительным строем. Единственное число адресата сохранено; лексическая неоднозначность תודה вынесена в сноску.
