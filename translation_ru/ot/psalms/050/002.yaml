lexical_decisions:
- source_word: מִצִּיּוֹן
  choice: С Сиона
  rationale: Предлог מִן обозначает источник или исходную точку; «с Сиона» естественно передаёт этот смысл по-русски.
- source_word: מִכְלַל יֹפִי
  choice: совершенства красоты
  rationale: Сочетание выражает полноту, совершенное воплощение красоты и в приложении поэтически характеризует Сион.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма употреблена с глаголом в единственном числе и здесь имеет единственное значение.
- source_word: הוֹפִיעַ
  choice: воссиял
  rationale: Глагол передаёт сияющее явление или выступление в блеске; совершенный вид соответствует древнееврейскому перфекту и сохраняет поэтическую образность.
theological_decisions:
- issue: Отнесение выражения «совершенство красоты»
  choice: 'Понимать его как приложение к Сиону: «С Сиона, совершенства красоты»'
  alternative: 'Понимать обстоятельственно: «С Сиона Бог воссиял в совершенной красоте»; либо относить характеристику непосредственно к Богу'
  rationale: Последовательность слов наиболее естественно допускает приложение к Сиону, однако синтаксис не исключает обстоятельственного понимания, поэтому оно отмечено в сноске.
- issue: Временное значение הוֹפִיעַ
  choice: воссиял
  alternative: сияет
  rationale: Древнееврейский перфект естественно передаётся совершенным прошедшим, хотя в поэтическом контексте возможно настоящее время.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной поэтической лексикой. «Воссиял» сохраняет образ явления в свете и уместен в псалме; структура приложения намеренно сохраняет смысловую напряжённость оригинала.
