  text: יָ֭דַעְתִּי כָּל ע֣וֹף הָרִ֑ים וְ/זִ֥יז שָׂ֝דַ֗י עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/011.yaml
  text: I know every bird of the mountains[b][a], and the creatures of the field are with me.
translation:
  language: ru
  text: Я знаю каждую птицу в горах, и существа Моих полей[a] — со Мной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что движется в Моих полях»; значение редкого еврейского слова זִיז точно не установлено. Возможны также переводы «животные» или «дикие животные».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «принадлежат Мне»; буквально: «со Мной».'
    reason: alternative_reading
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Я знаю
  rationale: Перфект глагола ידע здесь выражает устойчивое состояние знания; настоящее время естественно передаёт совершенное и непрерывное Божье знание.
- source_word: כָּל עוֹף הָרִים
  choice: всякую птицу в горах
  rationale: כָּל при собирательном существительном передано дистрибутивно; עוֹף в данном контексте естественно означает птиц, а הָרִים указывает на горную местность.
- source_word: וְזִיז שָׂדַי
  choice: и звери полевые
  rationale: Редкое и трудное זִיז, вероятно, обозначает движущихся существ открытой местности. «Звери полевые» звучит естественно и сохраняет широкое значение, хотя точный смысл слова остаётся неясным.
- source_word: עִמָּדִי
  choice: со Мной
  rationale: Буквально предлог означает «со мной». Такая передача сохраняет формулировку древнееврейского текста и не превращает подразумеваемое владение в прямое утверждение.
theological_decisions:
- issue: Подразумеваемая принадлежность творения Богу в עִמָּדִי
  choice: со Мной
  alternative: принадлежат Мне
  rationale: Контекст допускает смысл принадлежности или доступности, однако древнееврейский текст буквально говорит «со Мной». Перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим строем. Инверсия «звери полевые» поддерживает возвышенный регистр, оставаясь понятной. Заглавная буква в «Мной» следует принятой русской библейской типографической традиции для местоимения, относящегося к Богу.
