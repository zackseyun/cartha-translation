  text: אִסְפוּ לִ֥/י חֲסִידָ֑/י כֹּרְתֵ֖י בְרִיתִ֣/י עֲלֵי זָֽבַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/005.yaml
  text: Gather to me my faithful ones[a], those who make my covenant by sacrifice.
translation:
  language: ru
  text: Соберите ко Мне Моих верных — тех, кто заключил со Мной завет при жертве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тех, кто режет Мой завет над/при жертве»; «резать завет» — древнееврейское выражение со значением «заключать завет».'
    reason: Буквальная идиома сохранена; варианты «над/при» отмечают неоднозначность предлога על в сочетании с жертвой.
lexical_decisions:
- source_word: אִסְפוּ
  choice: Соберите
  rationale: Повелительная форма множественного числа от אסף. «Соберите» естественно передаёт приказ, обращённый к нескольким исполнителям.
- source_word: לִי
  choice: ко Мне
  rationale: В контексте призыва на судное собрание ל с суффиксом первого лица указывает на собирание к Богу, в Его присутствие.
- source_word: חֲסִידָי
  choice: верных Моих
  rationale: חסיד обозначает людей, проявляющих преданность и верность в отношениях завета. Эта формулировка не привносит более позднего специального значения слова «святые».
- source_word: כֹּרְתֵי בְרִיתִי
  choice: тех, кто заключил со Мной завет
  rationale: Буквально выражение означает «режущие Мой завет», однако по-русски устойчиво говорят «заключить завет». «Со Мной» естественно раскрывает принадлежность завета Богу, выраженную суффиксом первого лица.
- source_word: עֲלֵי זָבַח
  choice: при жертве
  rationale: Предлог על связывает заключение завета с жертвенным обрядом. «При жертве» сохраняет эту ритуальную связь, не сужая значение исключительно до средства действия.
theological_decisions:
- issue: Значение חֲסִידָי в контексте завета
  choice: верных Моих
  alternative: святых Моих; благочестивых Моих; преданных Мне
  rationale: Выбор подчёркивает верность и преданность в отношениях завета, избегая позднейших технических или конфессиональных ассоциаций.
- issue: Идиома заключения завета и связь с жертвой
  choice: тех, кто заключил со Мной завет при жертве
  alternative: заключающих Мой завет посредством жертвы; режущих Мой завет над жертвой
  rationale: 'Основной текст передаёт смысл идиомы естественным русским языком. «При жертве» сохраняет неоднозначность על: жертва могла сопровождать заключение завета или служить ритуальным средством, поэтому более узкое «посредством жертвы» не избрано.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «верных Моих» сохраняет торжественный поэтический тон, оставаясь понятной современному читателю.
