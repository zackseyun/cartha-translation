  text: לֹ֣א עַל זְ֭בָחֶי/ךָ אוֹכִיחֶ֑/ךָ וְ/עוֹלֹתֶ֖י/ךָ לְ/נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/008.yaml
  text: I do not rebuke you for your sacrifices[a]; your burnt offerings are continually before me.
translation:
  language: ru
  text: 'Не за жертвы твои Я обличаю тебя[a]: всесожжения твои всегда предо Мной.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не за жертвы твои Я укоряю тебя».'
    reason: 'Лексическая альтернатива для אוֹכִיחֶךָ: «укоряю» передаёт близкий оттенок порицания.'
lexical_decisions:
- source_word: לֹא עַל זְבָחֶיךָ אוֹכִיחֶךָ
  choice: Не за жертвы твои Я обличаю тебя
  rationale: Конструкция לֹא עַל с формой יכח отрицает, что жертвы являются основанием обличения. Порядок слов сохраняет смысловой акцент исходного текста и при этом естественен для русского поэтического регистра.
- source_word: זְבָחֶיךָ
  choice: жертвы твои
  rationale: זֶבַח — широкое обозначение жертвы, обычно животной; перевод не вводит излишнего уточнения.
- source_word: אוֹכִיחֶךָ
  choice: Я обличаю тебя
  rationale: В данной речи Бога форма Hiphil от יכח означает обличать или укорять. «Обличаю» передаёт серьёзность обращения и не сужает смысл до судебного обвинения.
- source_word: וְעוֹלֹתֶיךָ
  choice: всесожжения твои
  rationale: עוֹלָה — установленный культовый термин для жертвы, целиком сжигаемой на жертвеннике; «всесожжение» является точным и узнаваемым русским соответствием.
- source_word: לְנֶגְדִּי
  choice: предо Мной
  rationale: Выражение обозначает нахождение перед Богом, в Его присутствии и поле зрения; «предо Мной» сохраняет достоинство поэтической речи.
- source_word: תָמִיד
  choice: всегда
  rationale: Наречие передаёт постоянное или регулярное присутствие приношений. «Всегда» естественно и ёмко выражает эту продолжающуюся реальность.
theological_decisions:
- issue: Отношение стиха к жертвоприношениям Израиля
  choice: 'Бог говорит, что обличает народ не за отсутствие жертв: всесожжения постоянно находятся пред Ним.'
  alternative: Бог отвергает жертвоприношения как таковые.
  rationale: Вторая часть стиха подтверждает постоянное наличие всесожжений. Поэтому стих не объявляет жертвы сами по себе незаконными, а переносит внимание на более глубокую проблему поклонения, раскрываемую в контексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Инверсия «жертвы твои» и форма «предо Мной» сохраняют поэтическое достоинство, оставаясь понятными современному читателю.
