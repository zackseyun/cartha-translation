base_translation:
  language: en
  yaml_path: translation/ot/psalms/050/009.yaml
  text: I will not take a bull from your house[a], or goats from your pens.
translation:
  language: ru
  text: 'Не возьму из твоего дома быка,

    ни козлов из твоих загонов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא אֶקַּח
  choice: Не возьму
  rationale: Отрицание לֹא с имперфектом Qal 1-го лица ед. числа естественно передаёт твёрдое заявление Бога о будущем или предполагаемом действии; по-русски форма совершенного вида сохраняет эту силу.
- source_word: מִבֵּיתְךָ
  choice: из твоего дома
  rationale: Буквальное пространственное значение בַּיִת уместно в контексте имущества поклоняющегося и не требует расширения до «домочадцев» или «хозяйства».
- source_word: פָר
  choice: быка
  rationale: פָר обозначает быка, в том числе жертвенного; «бык» — точный и естественный современный эквивалент.
- source_word: מִמִּכְלְאֹתֶיךָ
  choice: из твоих загонов
  rationale: מִכְלָאָה — огороженное место для скота; «загоны» ясно и современно передаёт конкретный образ.
- source_word: עַתּוּדִים
  choice: козлов
  rationale: Еврейское слово обозначает именно самцов коз; русское «козлов» сохраняет это значение непосредственно, поэтому пояснительная сноска не нужна.
