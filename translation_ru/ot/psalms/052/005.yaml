  terminology: «Лживый язык» — естественная русская передача «языка обмана/коварства» и сохраняет библейский образ языка как носителя речи. Богословски нагруженных терминов в стихе нет. Маркер сноски стоит непосредственно после «слов», к которому относится лексическое пояснение.
