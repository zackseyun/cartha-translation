  text: You love all words of destruction[a], O deceitful tongue.
translation:
  language: ru
  text: Ты любишь все губительные слова[a], лживый язык!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «все слова поглощения»; то есть слова, которые пожирают или губят.'
    reason: Сохранена лексическая альтернатива для בָלַע и его яркий образ поглощения.
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Ты любишь
  rationale: Форма Qal perfect, 2-е лицо мужского рода единственного числа. В поэтическом обвинении русское настоящее время естественно передаёт устойчивую склонность; формально возможны «ты полюбил» или «ты любил».
- source_word: כָל דִּבְרֵי
  choice: все ... слова
  rationale: 'Сочетание כָל с формой множественного числа выражает полноту: «все слова».'
- source_word: בָלַע
  choice: губительные
  rationale: Слово связано с корнем «поглощать, пожирать» и здесь характеризует речь, ведущую к гибели или разрушению. «Губительные» естественно звучит по-русски, а образ поглощения отмечен в сноске.
- source_word: לְשׁוֹן
  choice: язык
  rationale: Сохранена древнееврейская метафора языка как речи; заключительное обращение передаёт поэтическую персонификацию.
- source_word: מִרְמָה
  choice: лживый
  rationale: Существительное означает «обман, коварство». В сочетании с «язык» современное русское прилагательное естественно передаёт смысл конструкции «язык обмана».
