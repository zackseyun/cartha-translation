  source_fidelity: «Ты любишь все губительные слова, лживый язык!» точно передаёт прямое обращение во 2-м лице, полноту כָּל, множественное число «слова» и заключительное персонифицированное «язык». Настоящее время в русском поэтическом обвинении допустимо передаёт закрепившуюся склонность, выраженную еврейским перфектом. «Губительные» адекватно передаёт разрушительный смысл בָּלַע; сноска уместно отмечает более образную этимологическую окраску «поглощения/пожирания».
