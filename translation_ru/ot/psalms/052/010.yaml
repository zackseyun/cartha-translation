id: PSA.52.10
reference: Psalms 52:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אוֹדְ/ךָ֣ לְ֭/עוֹלָם כִּ֣י עָשִׂ֑יתָ וַ/אֲקַוֶּ֖ה שִׁמְ/ךָ֥ כִֽי ט֝֗וֹב נֶ֣גֶד חֲסִידֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/010.yaml
  text: I will give thanks to you forever[a], because you have done it; I will wait for your name, for it is good[c][b], in the presence of your faithful ones.
translation:
  language: ru
  text: Буду вечно благодарить Тебя за то, что Ты совершил это; буду уповать на имя Твоё[a], ибо оно благо[b], перед верными Твоими.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «буду ждать имени Твоего»; глагол может означать и ожидание, и надежду.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «ибо это благо» или «ибо имя Твоё благо».'
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹדְךָ
  choice: буду благодарить Тебя
  rationale: Hiphil глагола ידה выражает благодарение и хвалу; «благодарить» естественно передаёт отклик на совершённое Богом деяние.
- source_word: לְעוֹלָם
  choice: вечно
  rationale: Передаёт неограниченную длительность в современном литературном русском языке.
- source_word: כִּי עָשִׂיתָ
  choice: за то, что Ты совершил это
  rationale: Первое כִּי имеет причинное значение, а широкое עשה здесь указывает на Божье деяние, раскрытое контекстом псалма. Местоимение «это» сохраняет контекстуальную недосказанность.
- source_word: וַאֲקַוֶּה שִׁמְךָ
  choice: буду уповать на имя Твоё
  rationale: קוה сочетает ожидание и надежду. Буквальное «ждать имени Твоего» по-русски неясно, тогда как «уповать на имя» естественно выражает ожидающее доверие, сохраняя образ имени.
- source_word: כִּי טוֹב
  choice: ибо оно благо
  rationale: Сжатая еврейская конструкция допускает соотнесение טוֹב с ближайшим существительным «имя». Средний род местоимения делает эту связь возможной, не повторяя существительное.
- source_word: נֶגֶד חֲסִידֶיךָ
  choice: перед верными Твоими
  rationale: נֶגֶד обозначает действие перед кем-либо, в чьём-либо присутствии; חֲסִידִים — преданные Богу люди, отличающиеся верностью. «Верные» избегает позднейшего узкотехнического оттенка слова «святые».
theological_decisions:
- issue: Значение קוה при необычном прямом дополнении «имя»
  choice: буду уповать на имя Твоё
  alternative: буду ждать имени Твоего
  rationale: Выбрано осмысленное для современного русского выражение доверчивого ожидания; буквальная синтаксическая возможность сохранена в сноске.
- issue: К чему относится сказуемое טוֹב («благо/хорошо»)
  choice: ибо оно благо
  alternative: ибо имя Твоё благо / ибо это благо
  rationale: Ближайший грамматический референт — «имя», однако еврейская фраза лаконична. Основной текст не повторяет референт, а сноска отмечает возможную безлично-оценочную передачу.
- issue: Передача חֲסִידֶיךָ
  choice: верными Твоими
  alternative: святыми Твоими / преданными Тебе
  rationale: «Верные» передаёт преданность и заветную верность, не вводя поздней технической экклезиологической категории.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим строем. Формы «Тебя», «Твоё», «Ты» сохраняют традиционную почтительность; инверсия «имя Твоё», «верными Твоими» поддерживает достоинство поэтической речи, оставаясь понятной.
