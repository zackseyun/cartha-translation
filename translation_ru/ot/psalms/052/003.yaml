  text: Ты замышляешь погибель[a]; твой язык — словно отточенная бритва; ты прибегаешь к обману[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пагубы» или «разрушения»; еврейское слово стоит во множественном числе и собирательно обозначает причиняемый разрушительный вред.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «твой язык, словно отточенная бритва, творит обман». Заключительные слова могут характеризовать как самого человека, так и его язык.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: погибель
  rationale: Форма множественного числа обозначает совокупный разрушительный вред. Собирательное «погибель» естественно по-русски и передаёт не просто неприятность, а намерение погубить.
- source_word: תַּחְשֹׁב
  choice: замышляешь
  rationale: Глагол во 2-м лице единственного числа выражает намеренное обдумывание злого дела; «замышляешь» сохраняет идею расчётливого умысла.
- source_word: לְשׁוֹנֶךָ
  choice: твой язык
  rationale: Сохранён телесный образ языка как орудия вредоносной речи; он не заменён отвлечённым словом «речь».
- source_word: כְּתַעַר מְלֻטָּשׁ
  choice: словно отточенная бритва
  rationale: «Словно» естественно передаёт сравнение, а «отточенная» подчёркивает подготовленную остроту и опасность лезвия.
- source_word: עֹשֵׂה רְמִיָּה
  choice: ты действуешь коварно
  rationale: Выражение передаёт активное совершение обмана или коварства. Личное прочтение согласуется с мужским родом причастия и обращением к нечестивцу, а возможная связь выражения с языком отмечена в сноске.
theological_decisions:
- issue: К кому относится עֹשֵׂה רְמִיָּה — к человеку или к его языку
  choice: 'В основном тексте выражение отнесено к человеку: «ты действуешь коварно».'
  alternative: 'Фраза может продолжать образ языка: «твой язык… творит обман».'
  rationale: Мужская форма причастия естественно допускает приложение к человеку, к которому обращён псалом, однако поэтическое построение позволяет смысловую связь и с языком. Альтернативу не следует устранять без пояснения.
translation_notes:
  register: Современный литературный русский с сохранением поэтической краткости и образа языка-бритвы. Точка с запятой передаёт основное членение еврейской строки и не делает «язык» подлежащим глагола «замышляешь».
