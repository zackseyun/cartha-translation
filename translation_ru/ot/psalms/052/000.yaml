  text: Начальнику хора[a]. Маскил[b] Давида[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Для начальника хора».'
    reason: lexical_alternative
  - marker: b
    text: 'Евр. маскил — вероятно, музыкальный или литературный термин; возможно: «поучительный псалом» или «песнь для размышления».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «написанный Давидом» или «для Давида»; еврейская конструкция может указывать на авторство, посвящение, принадлежность или связь.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Начальнику хора
  rationale: В надписаниях псалмов слово обозначает лицо, руководящее музыкальным исполнением. Дательный падеж естественно передаёт возможное указание адресату, не исключая смысла предназначения.
- source_word: מַשְׂכִּיל
  choice: Маскил
  rationale: Точное значение термина в надписаниях псалмов неясно; вероятно, это жанровое или исполнительское обозначение. Транслитерация сохраняет эту неопределённость.
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Русская именная конструкция «Маскил Давида» звучит естественно и остаётся достаточно нейтральной: она может указывать на авторство, принадлежность или связь, не сводя смысл однозначно к «написанный Давидом».'
theological_decisions:
- issue: Характер связи Давида с псалмом, выраженный לְדָוִד
  choice: Давида
  alternative: Давидов; написанный Давидом; для Давида
  rationale: Еврейский предлог לְ в надписании не устанавливает однозначно авторство и может обозначать принадлежность, посвящение либо иную связь. Выбранная формулировка не усиливает историко-богословское утверждение сверх источника.
translation_notes:
  register: Краткое надписание передано современным литературным русским языком. «Начальник хора» понятнее обычному читателю, чем узкопрофессиональные варианты; технический термин «маскил» сохранён и пояснён в сноске. Все маркеры стоят непосредственно при поясняемых выражениях.
