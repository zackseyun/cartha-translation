  yaml_path: translation/ot/psalms/052/002.yaml
  text: Why do you boast in evil, mighty man? The steadfast love of God endures all day long.
translation:
  language: ru
  text: Почему ты хвалишься злом, могучий? Верная любовь Бога пребывает непрестанно[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «верная любовь Бога — весь день»; в еврейском тексте глагол не выражен. Выражение «весь день» в поэтическом контексте означает непрестанность.'
    reason: Отмечает грамматическую эллиптичность второй строки и поясняет идиоматическое значение временного выражения.
lexical_decisions:
- source_word: תִּתְהַלֵּל בְּרָעָה
  choice: хвалишься злом
  rationale: Передаёт возвратную форму глагола הלל и предлог ב без смягчения нравственного смысла רָעָה («зло»).
- source_word: הַגִּבּוֹר
  choice: могучий
  rationale: Сохраняет прямое обращение и оттенок силы или влиятельности, не ограничивая смысл физической силой, как могло бы слово «силач».
- source_word: חֶסֶד אֵל
  choice: верная любовь Бога
  rationale: חֶסֶד обозначает стойкую, верную любовь и благость; «верная любовь» естественно передаёт длительную надёжность этого отношения, а אֵל здесь передано как «Бога».
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Буквально сохраняет временное выражение, которое по контексту также может означать постоянство или непрерывность.
theological_decisions:
- issue: Эллиптический характер второй строки
  choice: Верная любовь Бога пребывает весь день
  alternative: Верная любовь Бога — весь день
  rationale: В еврейском тексте нет выраженного глагола. «Пребывает» добавлено для естественности русского предложения, но не уточняет сверх текста, каким именно образом Божья любовь действует или противостоит хвастовству злодея.
- issue: Связь второй строки с вопросом первой
  choice: Сохранены два самостоятельных предложения без поясняющего союза
  alternative: Почему ты хвалишься злом, могучий, когда верная любовь Бога пребывает весь день?
  rationale: Еврейский текст не выражает логическую связь союзом; отсутствие союза сохраняет возможную напряжённость и не навязывает одно толкование.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Обращение «могучий» звучит возвышенно, но понятно; синтаксис остаётся кратким и резким, как в еврейском оригинале.
