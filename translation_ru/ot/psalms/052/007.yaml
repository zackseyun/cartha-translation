  text: וְ/יִרְא֖וּ צַדִּיקִ֥ים וְ/יִירָ֗אוּ וְ/עָלָ֥י/ו יִשְׂחָֽקוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/007.yaml
  text: 'The righteous will see and fear[b][a], and they will laugh at him:'
translation:
  language: ru
  text: 'Праведные увидят и устрашатся[a], и посмеются над ним[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убоятся»; еврейское слово может обозначать страх или ужас, а в данном контексте также может подразумевать благоговейный страх перед Божьим судом.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «будут смеяться над ним»; по контексту этот смех имеет насмешливый оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְאוּ
  choice: увидят
  rationale: Форма Qal imperfect 3-го лица множественного числа от ראה в поэтической последовательности имеет здесь будущее значение; «увидят» сохраняет прямой смысл восприятия зрением.
- source_word: צַדִּיקִים
  choice: праведные
  rationale: Прилагательное во множественном числе употреблено субстантивно; «праведные» естественно передаёт нравственную категорию.
- source_word: וְיִירָאוּ
  choice: устрашатся
  rationale: Форма Qal imperfect 3-го лица множественного числа от ירא. «Устрашатся» сохраняет оттенок страха перед Божьим судом, не сводя его однозначно ни к паническому ужасу, ни к благоговению.
- source_word: וְעָלָיו
  choice: над ним
  rationale: Предлог על при שׂחק естественно передаётся русским сочетанием «смеяться/посмеяться над кем-либо».
- source_word: יִשְׂחָקוּ
  choice: посмеются
  rationale: Форма Qal imperfect 3-го лица множественного числа от שׂחק означает «смеяться»; контекст подразумевает насмешку, но перевод сохраняет основной лексический образ.
theological_decisions:
- issue: Смысл страха в ответ на суд
  choice: устрашатся
  alternative: убоятся; испугаются; проникнутся благоговейным страхом
  rationale: Свидетельство Божьего суда может вызывать и трепет, и страх; выбранный вариант сохраняет эту богословскую напряжённость и не уточняет сверх того, что выражено в еврейском тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Будущее совершенного вида естественно передаёт последовательность действий; двоеточие сохранено как переход к последующей прямой речи.
