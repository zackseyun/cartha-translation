  source_fidelity: 'Текст точно передаёт три последовательных глагола в еврейском тексте: «увидят», «устрашатся», «посмеются над ним». Будущее значение имперфектов и субъект «праведные» сохранены. «Устрашатся» не устраняет намеренно открытую грань בין страхом/трепетом в יִירָאוּ.'
