  terminology: «Праведные» — устоявшаяся и точная передача צַדִּיקִים. «Устрашатся» и «посмеются над ним» соответствуют контексту суда, не подменяя страх однозначно благоговением, а смех — более эксплицитным «осмеянием». Сноски корректно привязаны к соответствующим словам и сохраняют варианты без догматического уточнения.
