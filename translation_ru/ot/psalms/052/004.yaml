  text: אָהַ֣בְתָּ רָּ֣ע מִ/טּ֑וֹב שֶׁ֓קֶר מִ/דַּבֵּ֖ר צֶ֣דֶק סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/004.yaml
  text: You have loved evil more than good[a], falsehood more than speaking righteousness. Selah
translation:
  language: ru
  text: Ты любишь зло больше, чем добро, ложь — больше, чем говорить правду. Села.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: ты любишь
  rationale: Перфект 2-го лица мужского рода в поэтическом обличении выражает сложившуюся и сохраняющуюся склонность; русский презенс естественно передаёт её актуальный характер.
- source_word: רָּע
  choice: зло
  rationale: В противопоставлении добру слово имеет прежде всего нравственный смысл.
- source_word: מִטּוֹב
  choice: больше, чем добро
  rationale: 'Предлог מן после глагола предпочтения обозначает сравнительное предпочтение: зло ставится выше добра.'
- source_word: שֶׁקֶר
  choice: ложь
  rationale: Слово обозначает ложь или обман; краткое «ложь» естественно в русском поэтическом параллелизме и сохраняет широкий смысл.
- source_word: מִדַּבֵּר
  choice: больше, чем говорить
  rationale: Повторное מן вводит второй объект сравнения, а глагольная форма естественно передаётся инфинитивом.
- source_word: צֶדֶק
  choice: правду
  rationale: В сочетании с глаголом речи и в противопоставлении лжи צֶדֶק означает то, что право и истинно; по-русски «говорить правду» точнее и естественнее, чем буквальное «говорить праведность».
- source_word: סֶלָה
  choice: Села
  rationale: Не вполне ясный литургический или музыкальный термин сохранён в транслитерации без попытки истолкования.
theological_decisions:
- issue: Передача צֶדֶק в контексте речи
  choice: правду
  alternative: праведность; то, что правильно; справедливость
  rationale: Контраст с שֶׁקֶר и зависимость от «говорить» направляют смысл к правдивой, правильной речи. «Правду» сохраняет этический смысл, не привнося исключительно судебного значения и не создавая неестественного русского оборота.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественный поэтический параллелизм. Тире во второй строке мысленно восполняет глагол «любишь». Обращение передано формой единственного числа «ты».
