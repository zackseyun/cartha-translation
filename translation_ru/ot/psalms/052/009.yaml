  text: וַ/אֲנִ֤י כְּ/זַ֣יִת רַ֭עֲנָן בְּ/בֵ֣ית אֱלֹהִ֑ים בָּטַ֥חְתִּי בְ/חֶֽסֶד אֱ֝לֹהִ֗ים עוֹלָ֥ם וָ/עֶֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/009.yaml
  text: But as for me[a], I am like a flourishing olive tree in the house of God[b]; I trust in the steadfast love of God forever and ever.
translation:
  language: ru
  text: А я — как зеленеющая маслина[a] в доме Бога; я уповаю на неизменную любовь[b] Бога во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «пышная маслина», «свежая маслина». Еврейское прилагательное подчёркивает свежую зелень и жизненную силу дерева.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское хесед часто означает верную, неизменную любовь Бога; возможны также переводы «милость», «верная любовь» или «заветная любовь».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Сочетание союза с самостоятельным местоимением подчёркивает противопоставление нечестивцу, описанному выше.
- source_word: כְּזַיִת רַעֲנָן
  choice: как зеленеющая маслина
  rationale: Предлог כְּ передаёт сравнение, а רַעֲנָן обозначает свежую зелень, жизненную силу и благоденствие, а не только цвет.
- source_word: בְּבֵית אֱלֹהִים
  choice: в доме Бога
  rationale: Прямой перевод сохраняет образ Божьего святилища и при этом естественно звучит по-русски.
- source_word: בָּטַחְתִּי
  choice: я уповаю
  rationale: Перфект выражает утвердившееся, продолжающееся доверие; настоящее время соответствует исповедальному характеру строки.
- source_word: בְחֶסֶד אֱלֹהִים
  choice: на неизменную любовь Бога
  rationale: חֶסֶד сочетает значения любви, верности и постоянной благосклонности; «неизменная любовь» передаёт это ёмко, не сводя слово лишь к милости или к формальному понятию завета.
- source_word: עוֹלָם וָעֶד
  choice: во веки веков
  rationale: Устойчивое русское выражение сохраняет усиленное указание на бесконечную длительность.
theological_decisions:
- issue: Передача חֶסֶד в контексте доверия Богу
  choice: неизменная любовь
  alternative: милость; верная любовь; заветная любовь
  rationale: Выбранный вариант сохраняет одновременно личный и устойчивый характер Божьего благоволения, не навязывая узкого конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. «Уповаю» и «во веки веков» сохраняют достоинство и библейскую узнаваемость, оставаясь понятными современному читателю.
