id: PSA.52.8
reference: Psalms 52:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: הִנֵּ֤ה הַ/גֶּ֗בֶר לֹ֤א יָשִׂ֥ים אֱלֹהִ֗ים מָֽע֫וּזּ֥/וֹ וַ֭/יִּבְטַח בְּ/רֹ֣ב עָשְׁר֑/וֹ יָ֝עֹ֗ז בְּ/הַוָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/052/008.yaml
  text: Look[a], this is the man who did not make God his refuge[b], but trusted in the abundance of his riches and sought strength in his destruction.
translation:
  language: ru
  text: Вот человек, который не сделал Бога своей твердыней[a], а полагался на изобилие своего богатства и укреплялся в своей погибели[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убежищем» или «крепостью».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское הַוָּה может также означать «разорение», «пагубное желание» или «разрушительные замыслы».
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательная частица вводит наглядный, подчёркнутый вывод; «вот» естественно передаёт её силу в современном русском.
- source_word: הַגֶּבֶר
  choice: человек
  rationale: Существительное стоит в мужском роде и единственном числе, но здесь прежде всего указывает на конкретного человека, ставшего назидательным примером; перевод «сильный муж» неоправданно усилил бы побочное значение корня.
- source_word: לֹא יָשִׂים אֱלֹהִים מָעוּזוֹ
  choice: не сделал Бога своей твердыней
  rationale: Конструкция שׂים с именной частью означает «сделать/поставить кем-либо или чем-либо», а מָעוֹז — источник или место защиты и силы. «Твердыня» сохраняет образ и остаётся понятным библейским словом.
- source_word: וַיִּבְטַח
  choice: а полагался
  rationale: 'Союз передаёт контраст: человек не искал защиты в Боге, а доверял богатству. «Полагался» естественно сочетается с обозначением ложной опоры.'
- source_word: בְּרֹב עָשְׁרוֹ
  choice: на изобилие своего богатства
  rationale: 'Перевод сохраняет оба смысловых компонента: רֹב — изобилие, множество, величина; עֹשֶׁר — богатство.'
- source_word: יָעֹז
  choice: укреплялся
  rationale: Глагол выражает обретение или проявление силы. «Укреплялся» передаёт динамический оттенок, не добавляя явно не выраженной цели вроде «искал силы».
- source_word: בְּהַוָּתוֹ
  choice: в своей погибели
  rationale: 'הַוָּה может обозначать погибель, бедствие, пагубное желание или разрушительные замыслы. «В своей погибели» сохраняет вероятную иронию: человек находил силу в том, что вело его к гибели, не устраняя лексическую трудность.'
theological_decisions:
- issue: Мужской род и единственное число הַגֶּבֶר
  choice: человек
  alternative: муж; сильный человек
  rationale: Русское «человек» сохраняет единственное число и мужскую референцию в контексте, не превращая возможный оттенок силы в основное утверждение.
- issue: Смысл הַוָּה
  choice: погибель
  alternative: разорение; пагубное желание; разрушительные замыслы
  rationale: Контекст противопоставляет Бога как истинную твердыню богатству и пагубной опоре нечестивого. Однако широкий диапазон еврейского слова не позволяет исключить значения желания или злого замысла, поэтому они отмечены в сноске.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Слово «твердыня» сохраняет конкретный образ защищённого места, а синтаксис остаётся ясным для обычного читателя. Лексическая неоднозначность заключительной фразы сохранена в тексте и раскрыта в сноске.
