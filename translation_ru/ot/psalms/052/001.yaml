  text: 'когда эдомитянин Доэг пришёл и сообщил Саулу, и сказал ему: «Давид пришёл в дом Ахимелеха».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבוֹא
  choice: когда… пришёл
  rationale: Предлог ב с инфинитивом-сопряжённым בוא вводит временное придаточное; такой перевод естественно передаёт еврейскую конструкцию по-русски.
- source_word: דּוֹאֵג הָאֲדֹמִי
  choice: эдомитянин Доэг
  rationale: Этникон обозначает происхождение Доэга; порядок слов естественен для современного русского языка.
- source_word: וַיַּגֵּד לְשָׁאוּל
  choice: и донёс Саулу
  rationale: Форма Hiphil глагола נגד означает сообщить или донести. В данном контексте «донёс» точно передаёт сообщение царю о действиях Давида, не добавляя сведений сверх текста.
- source_word: וַיֹּאמֶר לוֹ
  choice: сказав ему
  rationale: Деепричастная конструкция естественно вводит содержание сообщения и сохраняет местоимение исходного текста.
- source_word: בָּא דָוִד
  choice: Давид пришёл
  rationale: Перфект בוא обозначает завершённое прибытие. Русское прошедшее время естественно сохраняет возможную актуальность результата без необходимости вводить отдельную грамматическую форму.
- source_word: אֶל בֵּית אֲחִימֶלֶךְ
  choice: в дом Ахимелеха
  rationale: אֶל с בֵּית обозначает направленное движение к месту; по-русски после глагола «пришёл» наиболее естественно «в дом».
