  yaml_path: translation/ot/psalms/052/006.yaml
  text: But God will also tear you down forever[a]; he will snatch you up and pull you from your tent, and uproot you from the land of the living[c][b]. Selah
translation:
  language: ru
  text: Но и Бог навеки разрушит тебя, схватит тебя и вырвет тебя из шатра, искоренит тебя из земли живых.[a] Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и твой корень — из земли живых»; по смыслу: «искоренит тебя из земли живых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Но
  rationale: В данном контексте частица вводит противопоставление предыдущему хвастовству нечестивца; русское «но» естественно передаёт контекстуальный противительный оттенок, тогда как добавочное значение не требует отдельного «также».
- source_word: אֵל
  choice: Бог
  rationale: Обычное и естественное обозначение Бога в современном русском языке.
- source_word: יִתָּצְךָ
  choice: разрушит тебя
  rationale: Глагол נתץ означает разрушать, сносить; выражение сохраняет образ насильственного уничтожения, применённый здесь к человеку.
- source_word: לָנֶצַח
  choice: навеки
  rationale: Передаёт наиболее естественное значение длительной, окончательной необратимости суда, не уточняя сверх текста его метафизический характер.
- source_word: יַחְתְּךָ
  choice: схватит тебя
  rationale: Редкий глагол חתה здесь обозначает резкое, силовое захватывание или удаление; «схватит» естественно по-русски и сохраняет силу действия.
- source_word: וְיִסָּחֲךָ
  choice: и вырвет
  rationale: Глагол נסח выражает насильственное удаление, вырывание; выбор согласуется с последующим образом искоренения.
- source_word: מֵאֹהֶל
  choice: из шатра
  rationale: Сохранён конкретный буквальный образ шатра, который в контексте может также обозначать жилище.
- source_word: וְשֵׁרֶשְׁךָ
  choice: искоренит тебя
  rationale: В еврейском тексте буквально стоит «и твой корень» в эллиптической конструкции; русское глагольное выражение ясно передаёт подразумеваемое удаление корня и сохраняет метафору.
- source_word: מֵאֶרֶץ חַיִּים
  choice: из земли живых
  rationale: Устойчивый библейский образ мира живущих, противопоставленного смерти; формулировка точна и понятна.
- source_word: סֶלָה
  choice: Села
  rationale: Значение термина остаётся неясным, поэтому он передан транслитерацией без истолкования.
theological_decisions:
- issue: Характер суда в выражении לָנֶצַח
  choice: навеки
  alternative: полностью; раз и навсегда
  rationale: Наиболее естественно выражение обозначает непреходящую окончательность. Перевод сохраняет суровость Божьего суда, но не делает дополнительных выводов о его метафизической природе.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Конкретные образы разрушения, шатра и корня сохранены; синтаксическая эллиптичность последней строки раскрыта минимально ради ясности.
