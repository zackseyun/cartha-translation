  text: From heaven Yahweh looks[a]; he sees all the sons of man.
translation:
  language: ru
  text: С небес взирает Яхве; видит всех сынов человеческих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех людей», «всё человечество»; буквально: «всех сынов человека» — еврейское поэтическое выражение, обозначающее людей в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁמַיִם
  choice: С небес
  rationale: Предлог מִן обозначает исходную точку наблюдения, а שָׁמַיִם имеет форму множественного числа. «С небес» естественно звучит в русской поэзии и сохраняет образ небесной высоты.
- source_word: הִבִּיט
  choice: взирает
  rationale: Порода hифиль глагола נבט выражает направленный, внимательный взгляд. Настоящее время передаёт общеистинное значение поэтического перфекта, а «взирает» сохраняет возвышенный, но понятный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: רָאָה
  choice: видит
  rationale: Обычное значение ראה — «видеть». Настоящее время согласуется с параллельным הִבִּיט и передаёт постоянное наблюдение как общую истину.
- source_word: כָּל
  choice: всех
  rationale: При последующем множественном выражении כָּל обозначает всю совокупность людей.
- source_word: בְּנֵי הָאָדָם
  choice: сынов человеческих
  rationale: Русское поэтическое выражение сохраняет образную форму еврейского оборота и при этом означает людей вообще; коллективный смысл разъяснён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Коллективный смысл בְּנֵי הָאָדָם
  choice: сынов человеческих
  alternative: всех людей; всё человечество
  rationale: Основной текст сохраняет мужской репрезентативный образ еврейской поэзии, не ограничивая его значение только мужчинами; сноска сообщает общеохватный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух глаголов зрения сохранён; оба перфекта переданы настоящим временем как общеистинное утверждение.
