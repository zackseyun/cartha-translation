  text: Вот, око Яхве обращено к боящимся Его, к тем, кто ожидает Его верной любви[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «надеется на Его верную любовь». Еврейский глагол может выражать и надежду, и исполненное надежды ожидание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную и эмфатическую силу частицы, естественно звуча в современной русской поэзии.
- source_word: עֵין
  choice: око
  rationale: Сохраняет прозрачный антропоморфный образ еврейского текста; «око» уместно в возвышенном поэтическом регистре и не добавляет толкования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶל
  choice: обращено к
  rationale: В сочетании с «око» естественно передаёт направленное внимание и наблюдение, выраженные предлогом אֶל.
- source_word: יְרֵאָיו
  choice: боящимся Его
  rationale: Сохраняет библейское выражение о благоговейном страхе перед Яхве, не ослабляя его до одного лишь почтения.
- source_word: לַמְיַחֲלִים
  choice: к тем, кто надеется
  rationale: Глагол יחל обозначает надежду и исполненное ожидания упование; основной вариант звучит естественно по-русски, а оттенок ожидания отмечен в сноске.
- source_word: לְחַסְדּוֹ
  choice: на Его верную любовь
  rationale: «Верная любовь» передаёт сочетание благоволения, постоянства и верности, заключённое в חֶסֶד, не сужая значение до одной только жалости.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Передача חֶסֶד
  choice: верная любовь
  alternative: милость; неизменная любовь
  rationale: Этот вариант сохраняет одновременно любовь, благоволение и постоянную верность, не навязывая узкого конфессионального истолкования.
- issue: Смысл יחל
  choice: надеется
  alternative: ждёт; уповает
  rationale: Еврейский глагол совмещает надежду с терпеливым ожиданием; основной текст передаёт надежду, а сноска сохраняет вторую сторону значения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Буквальный образ «око Яхве» сохранён, однако конструкция «обращено к» делает фразу естественной и понятной.
