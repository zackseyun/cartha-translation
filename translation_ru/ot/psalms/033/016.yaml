source:
  edition: WLC
  text: אֵֽין הַ֭/מֶּלֶךְ נוֹשָׁ֣ע בְּ/רָב חָ֑יִל גִּ֝בּ֗וֹר לֹֽא יִנָּצֵ֥ל בְּ/רָב כֹּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/016.yaml
  text: The king is not saved by a great army[b][a]; a warrior is not delivered by great strength.
translation:
  language: ru
  text: Не многочисленным войском спасается царь[a]; не великой силой избавляется воин[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не великой мощью спасается царь»; еврейское слово может обозначать войско, силу или военные ресурсы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «сильный муж».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין
  choice: не … спасается
  rationale: Отрицание при причастии передано естественной русской конструкцией; оно выражает общее положение, а не отрицание существования царя.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённая форма употреблена обобщённо; по-русски такое обобщение естественно передаётся существительным без артикля.
- source_word: נוֹשָׁע
  choice: спасается
  rationale: Нифаль причастия от ישׁע означает «быть спасённым, получить избавление»; форма «спасается» сохраняет привычную библейскую лексику и обобщённый характер высказывания.
- source_word: בְּרָב חָיִל
  choice: многочисленным войском
  rationale: ב обозначает средство, רָב — многочисленность или величину, а חָיִל в военном контексте может обозначать войско; выбран конкретный военный смысл, при этом более широкое значение отмечено в сноске.
- source_word: גִּבּוֹר
  choice: воин
  rationale: Слово обозначает сильного, доблестного человека, особенно бойца; «воин» естественно соответствует военному контексту и параллели с царём и войском.
- source_word: יִנָּצֵל
  choice: избавляется
  rationale: Нифаль от נצל означает «быть избавленным, спасённым»; «избавляется» сохраняет смысл и передаёт лексическое варьирование еврейского параллелизма.
- source_word: בְּרָב כֹּחַ
  choice: великой силой
  rationale: Предлог ב передаёт средство, а сочетание רָב כֹּחַ — большую силу; «великой силой» звучит естественно и соответствует поэтическому регистру.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Инверсия «Не … спасается» подчёркивает отрицаемое средство спасения и сохраняет параллелизм двух строк.
