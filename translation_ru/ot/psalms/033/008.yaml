  text: יִֽירְא֣וּ מֵ֭/יְהוָה כָּל הָ/אָ֑רֶץ מִמֶּ֥/נּוּ יָ֝ג֗וּרוּ כָּל יֹשְׁבֵ֥י תֵבֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/008.yaml
  text: Let all the earth fear Yahweh[a]; let all the inhabitants of the world stand in awe of him.
translation:
  language: ru
  text: Да боится Яхве вся земля; да трепещут перед Ним все жители мира.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִירְאוּ
  choice: да боится
  rationale: Имперфект qal 3-го лица множественного числа в побудительном контексте передан русской конструкцией с «да», сохраняющей увещевательно-пожелательную силу и возвышенный поэтический регистр.
- source_word: מֵיְהוָה
  choice: Яхве
  rationale: 'После ירא предлог מן вводит объект страха; по-русски управление передаётся без предлога: «бояться Яхве». Личное имя יהוה транслитерировано как «Яхве».'
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: Параллель со «всеми жителями мира» указывает на всемирный, а не территориально ограниченный смысл אֶרֶץ.
- source_word: מִמֶּנּוּ יָגוּרוּ
  choice: да трепещут перед Ним
  rationale: גור в данном контексте выражает боязливый трепет; «трепещут» сохраняет интенсивность и поэтически варьирует первое «боится». «Перед Ним» естественно передаёт отношение к Тому, Кто вызывает трепет.
- source_word: כָּל יֹשְׁבֵי תֵבֵל
  choice: все жители мира
  rationale: Причастная конструкция означает населяющих обитаемый мир; выбран краткий и естественный современный русский эквивалент.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблено личное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Характер страха перед Богом
  choice: боится / трепещут
  alternative: благоговеет / испытывают благоговение
  rationale: Сохранена присущая параллельным еврейским глаголам напряжённость между страхом и благоговением; перевод не ослабляет её до одного лишь почтения и не сводит к паническому ужасу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим синтаксисом. Параллелизм двух строк сохранён; местоимение «Ним» написано с прописной буквы согласно распространённой русской библейской традиции.
