source:
  edition: WLC
  text: מִֽ/מְּכוֹן שִׁבְתּ֥/וֹ הִשְׁגִּ֑יחַ אֶ֖ל כָּל יֹשְׁבֵ֣י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/014.yaml
  text: From the place of his dwelling he looks out on all the inhabitants of the earth[a][b].
translation:
  language: ru
  text: С места Своего обитания Он взирает на всех живущих на земле[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пристально смотрит» или «наблюдает». Еврейский глагол подразумевает внимательное наблюдение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в стране», если понимать выражение регионально; здесь выбрано «на земле», поскольку контекст имеет всеобщий охват.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמְּכוֹן
  choice: С места
  rationale: מָכוֹן обозначает установленное, постоянное место; в сочетании со שִׁבְתּוֹ естественно передаётся как «с места Своего обитания».
- source_word: שִׁבְתּוֹ
  choice: Своего обитания
  rationale: Форма с суффиксом означает «его обитание» или «место, где он пребывает»; возвратное «Своего» ясно соотносит место с Богом.
- source_word: הִשְׁגִּיחַ
  choice: взирает
  rationale: Hифиль от שׁגח выражает направленное, внимательное наблюдение, вероятно сверху; «взирает» сохраняет этот оттенок и соответствует достоинству поэтической речи.
- source_word: אֶל
  choice: на
  rationale: При глаголе зрительного восприятия אֶל естественно передаётся русским предлогом «на», сохраняя направленность взгляда.
- source_word: כָּל
  choice: всех
  rationale: Перед субстантивированным причастием множественного числа כָּל имеет всеохватное значение.
- source_word: יֹשְׁבֵי
  choice: живущих
  rationale: Причастие от ישׁב буквально обозначает «тех, кто живёт/обитает»; «живущих» звучит естественно и сохраняет словесный характер формы.
- source_word: הָאָרֶץ
  choice: на земле
  rationale: В универсальном контексте выражение относится ко всей земле, а не к отдельной стране или области.
theological_decisions:
- issue: Охват Божьего наблюдения
  choice: 'Всеобщий: Бог видит всех живущих на земле'
  alternative: 'Региональный: Бог видит жителей определённой страны'
  rationale: Сочетание כָּל יֹשְׁבֵי הָאָרֶץ и широкий контекст псалма указывают на всё человечество; это контекстуальное, а не конфессиональное решение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим глаголом «взирает». Заглавные буквы в местоимениях, относящихся к Богу, выдержаны в традиционном русском библейском регистре; смысловой неоднозначности они не добавляют.
