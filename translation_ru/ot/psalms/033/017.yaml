  text: שֶׁ֣קֶר הַ֭/סּוּס לִ/תְשׁוּעָ֑ה וּ/בְ/רֹ֥ב חֵ֝יל֗/וֹ לֹ֣א יְמַלֵּֽט׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/017.yaml
  text: A horse is a false hope for deliverance[b][a], and by its great strength it cannot rescue.
translation:
  language: ru
  text: Конь — ложная надежда на избавление[a]; при всей своей огромной силе он не спасёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Конь — ложь для избавления»; то есть как средство избавления он обманчив и ненадёжен. Слово «избавление» можно также перевести как «спасение» или «победа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁקֶר
  choice: ложная надежда
  rationale: Существительное означает ложь, обман или нечто ненадёжное. В сочетании с конём как средством избавления естественный русский оборот «ложная надежда» передаёт мысль о том, что упование на него обманчиво.
- source_word: הַסּוּס
  choice: конь
  rationale: Определённая форма употреблена обобщённо. В русском языке единственное число без местоимения естественно обозначает коня как типичное средство военной силы.
- source_word: לִתְשׁוּעָה
  choice: на избавление
  rationale: תְּשׁוּעָה может означать спасение, избавление или победу. Военный контекст и параллель с «не спасёт» благоприятствуют слову «избавление», не исключая оттенка победы.
- source_word: וּבְרֹב חֵילוֹ
  choice: при всей своей огромной силе
  rationale: 'Буквально: «и при/посредством множества своей силы». Уступительный русский оборот ясно передаёт контраст: даже большая сила коня не обеспечивает спасения.'
- source_word: לֹא יְמַלֵּט
  choice: не спасёт
  rationale: Пиэль глагола מלט означает избавлять или спасать. Будущая форма с отрицанием передана прямо и естественно; субъектом по смыслу остаётся конь.
theological_decisions:
- issue: Значение תְּשׁוּעָה в военном контексте
  choice: избавление
  alternative: спасение; победа
  rationale: «Избавление» сохраняет широкий смысл избавления от опасности, тогда как «победа» сужает значение, а «спасение» в современном церковном употреблении может неоправданно усилить сотериологический оттенок.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой. «Конь» сохраняет возвышенно-поэтический и военный оттенок псалма; «не спасёт» звучит естественно и достойно.
