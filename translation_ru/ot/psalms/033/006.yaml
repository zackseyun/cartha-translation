  yaml_path: translation/ot/psalms/033/006.yaml
  text: By the word of Yahweh the heavens were made[a], and by the breath of his mouth all their host.
translation:
  language: ru
  text: 'Словом Яхве созданы небеса,

    и дыханием[a] его уст создано всё их воинство.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духом». Еврейское слово может означать «дыхание», «ветер» или «дух».'
    reason: alternative_reading
lexical_decisions:
- source_word: בִּדְבַר
  choice: Словом
  rationale: 'Предлог בְּ здесь имеет инструментальное значение: небеса сотворены посредством слова Яхве. Русский творительный падеж естественно и кратко передаёт это значение.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом «Господь».
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Сохраняется множественная форма и широкий смысл небесной сферы, а не только видимого неба.
- source_word: נַעֲשׂוּ
  choice: сотворены
  rationale: Глагол עשה означает «делать, создавать». В контексте возникновения небес «сотворены» звучит естественно и не требует употреблять менее ясное «сделаны»; при этом перевод не утверждает отдельного лексического оттенка глагола ברא.
- source_word: וּבְרוּחַ
  choice: и дыханием
  rationale: В параллели с «Его уст» слово רוּחַ прежде всего обозначает дыхание. Возможное значение «Дух» сохранено в примечании.
- source_word: פִּיו
  choice: Его уст
  rationale: Сохраняется поэтический образ и параллелизм со словом; «уста» соответствуют возвышенному регистру псалма, оставаясь понятными современному читателю.
- source_word: כָּל־צְבָאָם
  choice: всё их воинство
  rationale: צָבָא применительно к небесам обозначает совокупность небесных светил или небесное воинство. Местоимение «их» ясно отсылает к множественному «небеса».
theological_decisions:
- issue: Значение רוּחַ в рассказе о творении и возможный намёк на Духа
  choice: дыхание
  alternative: Дух
  rationale: Непосредственный параллелизм «словом Яхве» и «дыханием Его уст» поддерживает значение «дыхание» и не превращает возможный богословский отзвук в однозначное личное указание. Значимое альтернативное прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмической лексикой. Инверсия и тире сохраняют поэтический параллелизм; слово «воинство» оставлено ради образа צָבָא и связи с небесами.
