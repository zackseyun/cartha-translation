  text: Our soul waits for Yahweh[a]; he is our help and our shield.
translation:
  language: ru
  text: Наша душа ожидает Яхве[a]; Он — наша помощь и наш щит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «наша душа»; здесь «душа» обозначает всё внутреннее существо общины, а не только нематериальную часть человека.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַפְשֵׁנוּ
  choice: Душа наша
  rationale: 'Сохраняет единственное число и собирательный поэтический образ еврейского текста: речь идёт обо всём внутреннем существе общины, а не только о нематериальной части человека.'
- source_word: חִכְּתָה
  choice: уповает
  rationale: Глагол חכה обозначает терпеливое, исполненное ожидания ожидание. «Уповает» естественно передаёт в данном контексте ожидание, соединённое с доверием, не привязывая форму перфекта исключительно к прошедшему времени.
- source_word: לַיהוָה
  choice: на Яхве
  rationale: Предлог ל отмечает того, к кому направлено ожидание; с русским «уповать» нормативно употребляется предлог «на». Имя יהוה передано как «Яхве».
- source_word: עֶזְרֵנוּ
  choice: помощь наша
  rationale: Сохраняется отвлечённое существительное «помощь», соответствующее עֵזֶר, без замены на личное «помощник».
- source_word: וּמָגִנֵּנוּ
  choice: и щит наш
  rationale: Сохранён ясный и традиционно понятный конкретный образ щита, а не истолковывающая замена «защитник».
- source_word: הוּא
  choice: Он —
  rationale: Самостоятельное местоимение подчёркивает подлежащее в безглагольном именном предложении; русское тире естественно передаёт связку настоящего времени без добавления отсутствующего в еврейском слова «один».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон יהוה. Транслитерация «Яхве» сохраняет личное заветное имя и соответствует указанному решению проекта, не подменяя его титулом.
- issue: Значение ожидания в חִכְּתָה
  choice: уповает
  alternative: ожидает; ждала
  rationale: Контекст помощи и защиты допускает выраженный оттенок доверительного ожидания. При этом перевод не добавляет отдельного утверждения о спасительной уверенности сверх смысла глагола и контекста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «душа наша», «помощь наша», «щит наш» сохраняет параллелизм и достоинство псалма, оставаясь понятной современному читателю.
