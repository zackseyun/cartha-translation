  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «их душу». Еврейское слово нефеш может означать душу, самого человека или жизнь; также возможно: «их жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַצִּיל
  choice: избавить
  rationale: Инфинитив породы хифиль от נצל означает вызволить, спасти от опасности. «Избавить от смерти» естественно звучит по-русски и сохраняет возвышенный поэтический регистр.
- source_word: מִמָּוֶת
  choice: от смерти
  rationale: Предлог מן имеет здесь значение удаления или избавления; краткое выражение «от смерти» точно передаёт еврейскую конструкцию, не сужая её до процесса умирания.
- source_word: נַפְשָׁם
  choice: их душу
  rationale: נֶפֶשׁ может обозначать душу, жизнь или самого человека. Единственное число с суффиксом множественного числа передано формально как собирательное «их душу», а контекстуально возможный смысл «их жизнь» отмечен в сноске.
- source_word: וּלְחַיּוֹתָם
  choice: и сохранить им жизнь
  rationale: Форма от חיה означает поддерживать жизнь, оставлять в живых. Русское «сохранить им жизнь» ясно передаёт физическое сохранение и избегает неестественного повторения местоимения.
- source_word: בָּרָעָב
  choice: во время голода
  rationale: רָעָב в данном контексте обозначает общественное бедствие — голод, а не только субъективное чувство. «Во время голода» естественно передаёт обстоятельственное значение предлога ב.
