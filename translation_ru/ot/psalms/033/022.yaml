lexical_decisions:
- source_word: חֶסֶד
  choice: милость
  rationale: Передаёт здесь верную, благую любовь Бога естественным и торжественным русским словом; в молитвенном контексте «милость» охватывает и благоволение, и преданность завету.
- source_word: יְהוָה
  choice: Господи
  rationale: В прямом обращении тетраграмматон передан традиционной русской формой звательного обращения «Господи», соответствующей принятому замещению «Господь».
- source_word: יִחַלְנוּ לָךְ
  choice: мы и надеемся на Тебя
  rationale: Глагол выражает исполненное ожидания упование; «надеемся на Тебя» естественно передаёт направленность, выраженную לָךְ.
- source_word: כַּאֲשֶׁר
  choice: как
  rationale: Сохраняет сравнительно-соотносительную связь между прошением о милости и упованием общины; частица «и» естественно подчёркивает соответствие.
theological_decisions:
- issue: Соотношение Божьей милости и человеческого упования
  choice: «как мы и надеемся на Тебя»
  alternative: «поскольку мы надеемся на Тебя» / «по мере того как мы надеемся на Тебя»
  rationale: Еврейское כַּאֲשֶׁר допускает оттенки соответствия и основания. Перевод «как» сохраняет эту неоднозначность и не превращает Божью милость ни в механическую награду, ни исключительно в причинное следствие человеческой надежды.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Сохранён параллелизм краткого заключительного прошения псалма; местоимения при обращении к Богу написаны с прописной буквы согласно распространённой русской религиозной традиции.
