lexical_decisions:
- source_word: הַיֹּצֵר
  choice: Тот, кто создал
  rationale: Субстантивированное причастие Qal от יצר обозначает Бога как создателя человеческих сердец. Совершенный вид «создал» естественно передаёт здесь акт сотворения, не устраняя характеризующего оттенка причастия.
- source_word: יַחַד
  choice: их всех
  rationale: 'В данном контексте слово указывает на совокупность всех людей: Бог создал сердце каждого из них. Такой перевод избегает возможного впечатления, будто сердца были созданы одновременно или одинаковыми.'
- source_word: לִבָּם
  choice: сердца их
  rationale: Формально единственное число с суффиксом 3-го лица множественного числа имеет распределительное значение; по-русски естественно множественное «сердца», относящееся ко всем людям.
- source_word: הַמֵּבִין
  choice: кто понимает
  rationale: Причастие Hiphil от בין передаёт понимание и распознавание. «Понимает» ясно и естественно сохраняет параллель с первым причастным оборотом.
- source_word: אֶל כָּל מַעֲשֵׂיהֶם
  choice: все их дела
  rationale: При בין предлог אֶל вводит объект понимания и в русском отдельно не передаётся. מַעֲשֵׂיהֶם означает совокупность человеческих поступков или дел.
theological_decisions:
- issue: Круг людей, о которых говорится в стихе
  choice: Бог создаёт сердца всех людей и понимает все их дела.
  alternative: Отнести слова лишь к царям или народам, упомянутым в ближайшем контексте.
  rationale: Стихи 13–15 говорят обо всех сынах человеческих и всех жителях земли, поэтому перевод сохраняет широкий охват, не сужая его сверх текста.
- issue: Значение יַחַד при сотворении сердец
  choice: 'Передать как охват всех людей: «сердца их всех».'
  alternative: «создал их сердца вместе» или «создал их сердца одинаковыми».
  rationale: Еврейское слово допускает буквальное «вместе», однако контекст не требует ни одновременности сотворения, ни одинаковости сердец. Основной текст сохраняет коллективно-распределительный смысл, а буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным синтаксисом псалма. Порядок «сердца их всех» слегка формален, но понятен и позволяет точно связать «всех» с обладателями сердец, не утверждая одинаковость самих сердец.
