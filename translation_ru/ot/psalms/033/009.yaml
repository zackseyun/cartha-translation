  text: כִּ֤י ה֣וּא אָמַ֣ר וַ/יֶּ֑הִי הֽוּא צִ֝וָּ֗ה וַֽ/יַּעֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/009.yaml
  text: For he spoke[a], and it came to be; he commanded[b], and it stood firm.
translation:
  language: ru
  text: Ибо Он сказал[a] — и стало; Он повелел[b] — и утвердилось.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и было»; еврейское выражение предельно кратко: «и было/стало».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и встало», «и устояло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт причинно-обосновывающую связь с предшествующим контекстом и сохраняет достойный поэтический регистр.
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение сохраняется в обеих параллельных строках, поддерживая эмфазу еврейского текста без добавочного «Сам».
- source_word: אָמַר
  choice: сказал
  rationale: Прямой и естественный эквивалент; в сочетании с результативным «и стало» выражает действенность Божьего слова.
- source_word: וַיְהִי
  choice: и стало
  rationale: Кратко передаёт предельно сжатое еврейское «и было/стало», сохраняя как результативность, так и поэтическую лаконичность.
- source_word: צִוָּה
  choice: повелел
  rationale: Точно выражает издание властного повеления и естественно соответствует возвышенному контексту.
- source_word: וַיַּעֲמֹד
  choice: и утвердилось
  rationale: Передаёт образ устойчивого установления возникшего по Божьему повелению; буквальное «встало» по-русски здесь могло бы создать неверную предметную картину.
theological_decisions:
- issue: Возникновение и устойчивость творения вследствие Божьего слова
  choice: «и стало» / «и утвердилось»
  alternative: «и было» / «и встало» или «и возникло» / «и устояло»
  rationale: Формулировка сохраняет параллелизм и подчёркивает немедленную и устойчивую действенность Божьего слова, не добавляя к тексту подробной доктринальной интерпретации.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Тире подчёркивает симметрию двух полустиший и непосредственность результата; лаконичность оригинала сохранена.
