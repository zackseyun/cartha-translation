base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/003.yaml
  text: Sing to him a new song[a]; play skillfully with a joyful shout.
translation:
  language: ru
  text: Пойте Ему новую песню; искусно играйте с радостным возгласом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с ликованием»; возможно также: «при трубном звуке». Еврейское תְּרוּעָה может означать ликующий крик, громкое восклицание или трубный сигнал.'
    reason: Лексема допускает несколько близких значений, и контекст не позволяет полностью исключить инструментальный оттенок.
lexical_decisions:
- source_word: שִׁירוּ
  choice: Пойте
  rationale: Форма повелительного наклонения множественного числа от שׁיר прямо призывает к пению; «пойте» естественно и точно передаёт этот призыв.
- source_word: לוֹ
  choice: Ему
  rationale: Предлог ל с местоименным суффиксом указывает на адресата песни — Бога, названного Господом в ближайшем контексте.
- source_word: שִׁיר חָדָשׁ
  choice: новую песню
  rationale: Прямой перевод устойчивого псалмового выражения сохраняет его поэтическое и богослужебное звучание.
- source_word: הֵיטִיבוּ נַגֵּן
  choice: искусно играйте
  rationale: הֵיטִיבוּ употреблено наречно при נַגֵּן и требует хорошего, умелого исполнения; נגן обозначает игру на музыкальном инструменте, особенно струнном. «Искусно играйте» естественно передаёт сочетание целиком.
- source_word: בִּתְרוּעָה
  choice: с радостными возгласами
  rationale: תְּרוּעָה обозначает громкий крик, ликование, торжественный возглас, а иногда трубный сигнал. В контексте хвалы наиболее вероятны радостные возгласы, однако неоднозначность отмечена в сноске.
theological_decisions:
- issue: К кому относится местоимение «Ему»
  choice: К Господу, Богу, Которому воздаётся хвала
  alternative: Оставить референт местоимения неуточнённым вне контекста
  rationale: Предыдущие стихи прямо призывают праведных славить Господа, поэтому местоимение естественно относится к Нему; добавлять имя в сам стих не требуется.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмовым звучанием. Параллелизм двух повелений сохранён; прописная буква в «Ему» следует русской традиции почтительного обозначения Бога без добавления отсутствующего в стихе имени.
