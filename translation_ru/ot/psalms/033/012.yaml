    reason: alternative_reading
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Идиоматическая форма библейского изречения о состоянии благополучия под Божьим благоволением; сохраняет псалмический и богослужебный тон лучше, чем «счастлив» или «удачлив».
- source_word: הַגּוֹי
  choice: народ
  rationale: В данном поэтическом контексте обозначает этнокультурную общность; русское «народ» естественно и позволяет сохранить параллелизм с הָעָם, не вводя политического оттенка слова «нация».
- source_word: אֲשֶׁר יְהוָה אֱלֹהָיו
  choice: у которого Бог — Яхве
  rationale: 'Естественно передаёт относительную конструкцию и именную предикацию: Яхве является Богом этого народа.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: הָעָם
  choice: народ
  rationale: Сохраняет прямое значение и поэтический параллелизм; контекст допускает особое указание на Израиль, но имя народа в тексте не названо.
- source_word: בָּחַר
  choice: избрал
  rationale: Совершенный вид передаёт завершённый акт избрания; «избрал» соответствует возвышенному, но понятному регистру псалма.
- source_word: לְנַחֲלָה לוֹ
  choice: Себе в наследие
  rationale: Передаёт и значение принадлежности Богу, и образ נַחֲלָה — наследия или удела; возвратное «Себе» естественно соотносится с подлежащим «Он».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Кого обозначают «народ» в обеих строках
  choice: Не уточнять в основном тексте и сохранить поэтическое обозначение
  alternative: Явно вставить «Израиль»; истолковать первую строку как относящуюся к любому народу
  rationale: Особенно вторая строка естественно указывает на избранный Богом Израиль, однако еврейский текст говорит просто о «народе». Перевод не должен устранять эту смысловую напряжённость добавлением отсутствующего имени.
- issue: Образ наследия применительно к Богу
  choice: Сохранить «в наследие»
  alternative: «в удел»; «как Своё достояние»
  rationale: Так сохраняется заветный образ נַחֲלָה без попытки рационализировать то, каким образом народ назван Божьим наследием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Блажен», «избрал» и «наследие» сохраняют литургическую и заветную окраску, оставаясь понятными современному читателю. Маркеры сносок размещены после всего стиха в последовательном порядке.
