base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/005.yaml
  text: He loves righteousness and justice[a]; the earth is full of the steadfast love of Yahweh.
translation:
  language: ru
  text: Он любит праведность и справедливость; земля полна неизменной любви Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верной любви». Еврейское חֶסֶד (хесед) обозначает любовь, в которой соединяются верность, постоянство и милость.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֵב
  choice: Он любит
  rationale: Причастие qal мужского рода единственного числа описывает постоянное свойство Яхве; русская личная форма естественно передаёт этот обычный, устойчивый смысл.
- source_word: צְדָקָה
  choice: праведность
  rationale: В паре с מִשְׁפָּט слово обозначает нравственную правоту и праведность, не дублируя понятие справедливого суда.
- source_word: מִשְׁפָּט
  choice: справедливость
  rationale: Здесь имеется в виду справедливый порядок и правосудие в широком нравственном смысле; «справедливость» образует естественную пару с «праведностью».
- source_word: חֶסֶד
  choice: верная любовь
  rationale: Сочетание передаёт любовь, сохраняющую верность и постоянство, включая присущий слову оттенок преданной, заветной привязанности, но без введения в основной текст специальной терминологии.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: מָלְאָה
  choice: полна
  rationale: Перфект женского рода согласуется со словом «земля» и выражает наличное состояние; краткое прилагательное с нулевой связкой звучит по-русски естественно.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Космический контекст псалма указывает на всю землю, а не на отдельную страну или территорию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо употребляет тетраграмматон; форма «Яхве» сохраняет личное имя и наиболее вероятную традиционную реконструкцию его произношения.
- issue: Смысл חֶסֶד
  choice: верная любовь
  alternative: неизменная любовь; милость
  rationale: Выбранная формулировка сохраняет одновременно любовь и верность, не сводя многозначное слово только к милосердию и не делая заветный оттенок чрезмерно явным.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной псалмической фразой. Синтаксический параллелизм и различие между «праведностью» и «справедливостью» сохранены; богословская ёмкость חֶסֶד пояснена в сноске.
