  variant: modern literary Russian
source:
  edition: WLC
  text: עֲצַ֣ת יְ֭הוָה לְ/עוֹלָ֣ם תַּעֲמֹ֑ד מַחְשְׁב֥וֹת לִ֝בּ֗/וֹ לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/011.yaml
  text: The counsel of Yahweh stands forever[a], the plans of his heart from generation to generation.
translation:
  language: ru
  text: Замысел Яхве пребудет вовеки[a], намерения Его сердца — из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «решение» или «намерение» вместо «замысел»; «мысли» или «планы» вместо «намерения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: замысел
  rationale: Слово может означать совет, решение, замысел или намерение. В данном параллелизме «замысел» естественно передаёт целенаправленную волю Яхве, не сводя значение к данному кому-либо совету.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Обозначает непреходящую длительность; «вовеки» сохраняет поэтическую торжественность и понятно современному читателю.
- source_word: תַּעֲמֹד
  choice: пребудет
  rationale: 'Имперфект выражает устойчивость и продолжительность: замысел остаётся в силе. Будущее «пребудет» естественно передаёт эту непреложность в русском поэтическом контексте.'
- source_word: מַחְשְׁבוֹת
  choice: намерения
  rationale: Слово охватывает мысли, планы и намерения. Здесь, в параллели с עֲצַת, «намерения» передаёт осмысленную направленность, сохраняя отличие от «замысла» в первой строке.
- source_word: לִבּוֹ
  choice: Его сердца
  rationale: Сохранён еврейский образ сердца как средоточия мысли и воли без истолковывающей замены на «разум».
- source_word: לְדֹר וָדֹר
  choice: из поколения в поколение
  rationale: Устойчивый русский оборот точно выражает непрерывность во всех последующих поколениях.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Форма «Яхве» сохраняет имя и соответствует наиболее принятой научной реконструкции произношения, тогда как «Господь» заменяет его титулом.
- issue: Соотношение замысла и намерений Бога
  choice: Сохранить поэтический параллелизм без догматического уточнения
  alternative: Передать оба существительных одним словом «планы» или разъяснить их как предопределение
  rationale: Еврейский текст утверждает непреложность Божьего замысла и намерений, но сам стих не определяет их объём или связь с конкретной доктриной.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. «Пребудет» и «вовеки» уместны для псалма и остаются понятными; синтаксический параллелизм оригинала сохранён.
