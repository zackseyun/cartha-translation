  text: רַנְּנ֣וּ צַ֭דִּיקִים בַּֽ/יהוָ֑ה לַ֝/יְשָׁרִ֗ים נָאוָ֥ה תְהִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/001.yaml
  text: Shout for joy in Yahweh[a], you righteous[b]; praise is fitting for the upright.
translation:
  language: ru
  text: Ликуйте в Яхве, праведные! Честным подобает хвала[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «Для честных хвала прекрасна»; также возможно: «Честным прилична хвала».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַנְּנוּ
  choice: ликуйте
  rationale: Форма повелительного наклонения множественного числа выражает громкую, радостную реакцию. «Ликуйте» естественно и ёмко передаёт торжественную радость, хотя явный оттенок вокального выражения отмечен в сноске.
- source_word: צַדִּיקִים
  choice: праведные
  rationale: Субстантивированное прилагательное употреблено как обращение после повеления; русская форма «праведные» ясно сохраняет этот звательный смысл.
- source_word: בַּיהוָה
  choice: в Яхве
  rationale: Предлог ב обозначает основание или сферу ликования. Буквально близкое «в Яхве» сохраняет связь радости с самим Яхве и не заменяет её направительным значением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: לַיְשָׁרִים
  choice: праведным
  rationale: יְשָׁרִים буквально означает «прямые», то есть нравственно честные и правые. В данном параллелизме русское «праведным» естественно соотносится с צַדִּיקִים, не вводя отдельной категории людей.
- source_word: נָאוָה
  choice: подобает
  rationale: Слово выражает уместность, пристойность или красоту. «Подобает» кратко и достойно передаёт мысль о том, что хвала соответствует праведным; оттенок красоты сохранён в сноске.
- source_word: תְהִלָּה
  choice: хвала
  rationale: Существительное обозначает хвалу или хвалебное выражение. «Хвала» сохраняет обобщённый характер утверждения и не уточняет без необходимости форму песни.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Связь хвалы с «праведными»
  choice: Праведным подобает хвала
  alternative: Хвала праведных прекрасна
  rationale: Дательный с ל естественнее понимать как указание на тех, кому хвала пристойна, а не как однозначное обозначение её источника. Такая передача сохраняет нравственно-богословское утверждение стиха без добавления притяжательного смысла.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным богослужебным звучанием. Краткий параллелизм еврейской поэзии сохранён; обращение выделено запятой, а первая строка завершена восклицательным знаком.
