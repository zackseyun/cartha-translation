  text: כִּֽי יָשָׁ֥ר דְּבַר יְהוָ֑ה וְ/כָל מַ֝עֲשֵׂ֗/הוּ בֶּ/אֱמוּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/004.yaml
  text: For the word of Yahweh is upright[b][a], and all his work is done in faithfulness.
translation:
  language: ru
  text: 'Ибо слово Яхве право,

    и все Его дела совершаются верно.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и всё Его дело — в верности».'
    reason: Сноска сохраняет безглагольную конструкцию, единственное собирательное число מַעֲשֵׂהוּ и предложную форму בֶּאֱמוּנָה.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего призыва славить Бога; «ибо» сохраняет причинный смысл и соответствует возвышенному поэтическому регистру.
- source_word: יָשָׁר
  choice: право
  rationale: Передаёт прямоту и нравственную правильность сказанного; «право» здесь точнее сохраняет образ и поэтический параллелизм, чем более общее «истинно».
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: דָּבָר в данном контексте обозначает Божье слово или изречение; личное имя יהוה передано как «Яхве».
- source_word: וְכָל מַעֲשֵׂהוּ
  choice: и все Его дела
  rationale: Еврейское единственное число может собирательно охватывать всю деятельность Бога. Русское множественное число естественно выражает всеобъемлющий смысл כָּל.
- source_word: בֶּאֱמוּנָה
  choice: совершаются с верностью
  rationale: אֱמוּנָה обозначает верность, надёжность и постоянство. Оборот «с верностью» сохраняет существительное и не сводит смысл лишь к правильности действий.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Смысл אֱמוּנָה применительно к Божьим делам
  choice: с верностью
  alternative: верно / истинно
  rationale: Выбранная формулировка подчёркивает надёжность и постоянство Бога, не смешивая אֱמוּנָה с понятием фактической истинности и не добавляя конфессионального толкования.
- issue: Число существительного מַעֲשֵׂהוּ
  choice: все Его дела
  alternative: всё Его дело
  rationale: Единственное число в еврейском допускает собирательное понимание. Множественное число по-русски естественнее выражает совокупность Божьих действий; буквальная форма отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным ритмом псалма. «Ибо» и краткое «право» поддерживают поэтическую торжественность, а вторая строка сформулирована понятно для современного читателя.
