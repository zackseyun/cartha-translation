  text: 'Он собирает воды моря, словно груду[a],

    помещает пучины[b] в хранилища.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно насыпь»; в свете сходных библейских образов стоящих вод некоторые понимают это слово как «словно стену».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «глубины», «бездны» или «глубокие воды». Еврейское слово стоит во множественном числе и может обозначать океанские либо первозданные глубины.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּנֵס
  choice: собирает
  rationale: Причастие породы qal от כנס означает собирание воедино. Настоящее время естественно передаёт описательный характер еврейского причастия.
- source_word: כַּנֵּד
  choice: словно груду
  rationale: נֵד обычно обозначает груду или нагромождённую массу; сравнение сохраняет конкретный поэтический образ собранных вод.
- source_word: מֵי הַיָּם
  choice: воды моря
  rationale: Точно и естественно передаёт конструкцию «воды моря», не заменяя море более узким или современным понятием океана.
- source_word: נֹתֵן
  choice: помещает
  rationale: Причастие qal от נתן здесь означает «класть, помещать». Выбор согласуется с образом хранилищ и сохраняет параллелизм действий.
- source_word: בְּאֹצָרוֹת
  choice: в хранилища
  rationale: אֹצָר может означать сокровищницу, кладовую или хранилище. В данном космологическом образе «хранилища» ясно выражает место, куда складывают и где удерживают воды.
- source_word: תְּהוֹמוֹת
  choice: пучины
  rationale: Множественное число от תְּהוֹם обозначает океанские или первозданные глубины. «Пучины» сохраняет водную образность и поэтический регистр.
theological_decisions:
- issue: Космологический образ Божьей власти над морскими водами
  choice: Сохранить конкретные образы груды и хранилищ
  alternative: 'Передать абстрактно: «Он управляет морем» или «Он сдерживает океаны»'
  rationale: Еврейский текст изображает упорядочение вод через поэтические, а не научные категории. Буквенная образность сохраняет Божью власть над морем, не сглаживая напряжение древнего космологического языка.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Груда» сохраняет необычность исходного образа, а «пучины» — возвышенный, но понятный водный образ. Порядок маркеров приведён в соответствие с теми словами, которые они поясняют.
