base_translation:
  language: en
  yaml_path: translation/ot/psalms/033/010.yaml
  text: Yahweh frustrates the counsel of the nations[a]; he thwarts the plans of the peoples.
translation:
  language: ru
  text: 'Яхве[a] разрушает замысел народов,

    расстраивает намерения народов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. YHWH; также передаётся: «Иегова».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма «Яхве» привычна в современной русской библеистике.
- source_word: הֵפִיר
  choice: разрушает
  rationale: Порода хифиль от פרר означает сделать совет или замысел недействительным, сорвать его; «разрушает замысел» естественно передаёт результативную силу глагола.
- source_word: עֲצַת
  choice: замысел
  rationale: Здесь עֵצָה обозначает не просто совет, а выработанный план или намерение; «замысел» подходит контексту действий народов и сохраняет отличие от второго параллельного существительного.
- source_word: גּוֹיִם
  choice: народов
  rationale: В данном поэтическом контексте слово обозначает народы вообще, без обязательного значения «язычники».
- source_word: הֵנִיא
  choice: расстраивает
  rationale: Хифиль от נוא/ניא передаёт воспрепятствование осуществлению намерения; русское «расстраивает намерения» идиоматично и сохраняет параллелизм без буквального повторения.
- source_word: מַחְשְׁבוֹת
  choice: намерения
  rationale: В параллели с עֲצַת речь идёт о задуманных действиях, а не просто о мыслях; «намерения» сохраняет смысл и поэтическое различие.
- source_word: עַמִּים
  choice: племён
  rationale: Так передано отличие от גּוֹיִם в первой строке. «Племена» здесь имеет собирательный этнополитический смысл и позволяет избежать одинакового перевода двух параллельных слов.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо содержит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя; традиционная замена «Господь» превращает его в титул, а «Иегова» отражает более позднюю гибридную форму произношения.
translation_notes:
  register: Современный литературный русский с лаконичным поэтическим параллелизмом. Порядок строк следует еврейским колонам; настоящее время передаёт обобщённое утверждение. Сохранено смысловое различие между двумя парами близких слов.
