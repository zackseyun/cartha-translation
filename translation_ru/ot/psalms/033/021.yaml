  text: For our heart rejoices in him[b][a], because we have trusted in his holy name.
translation:
  language: ru
  text: Ибо в Нём радуется наше сердце[a], ведь мы уповали на Его святое имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возрадуется наше сердце» — если понимать еврейскую форму как будущее время, а не как настоящее, выражающее постоянное состояние. В еврейском тексте «сердце» стоит в единственном числе и собирательно обозначает внутреннюю жизнь говорящих.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Первое כִּי вводит основание для мысли предыдущего стиха; «ибо» естественно сохраняет причинную связь и поэтический строй.
- source_word: בּוֹ
  choice: в Нём
  rationale: Местоименный суффикс мужского рода единственного числа в контексте относится к Господу; перевод не вставляет само имя там, где его нет в данном стихе.
- source_word: יִשְׂמַח
  choice: радуется
  rationale: Имперфект может обозначать обычное настоящее или уверенное будущее. Настоящее время естественно передаёт продолжающееся исповедание псалма, а возможность будущего отмечена в сноске.
- source_word: לִבֵּנוּ
  choice: наше сердце
  rationale: 'Сохранено еврейское единственное число с суффиксом первого лица множественного числа: это собирательное обозначение внутренней жизни народа.'
- source_word: כִּי
  choice: потому что
  rationale: Второе כִּי указывает причину радости; «потому что» ясно выражает эту связь в современном русском языке.
- source_word: בְשֵׁם
  choice: на ... имя
  rationale: При глаголе בטח предлог указывает на объект упования; русское сочетание «уповать на имя» естественно и точно.
- source_word: קָדְשׁוֹ
  choice: Его святое
  rationale: «Святое» передаёт религиозно-нравственный и заветный смысл определения без ослабления до общего «священное».
- source_word: בָטָחְנוּ
  choice: мы уповаем
  rationale: Еврейский перфект обозначает состоявшееся доверие с сохраняющимся результатом. В русском настоящее «уповаем» естественно передаёт устойчивое доверие; буквальное «мы уповали» могло бы ошибочно звучать как только прошедшее.
theological_decisions:
- issue: К кому относятся местоимения в בּוֹ и קָדְשׁוֹ
  choice: К Господу, названному в ближайшем контексте псалма
  alternative: Общее указание на Бога без явной связи с заветным именем
  rationale: Контекст неоднократно говорит о Господе, поэтому местоимения естественно относятся к Нему. Однако в сам стих имя Господь не добавлено.
- issue: Временная направленность יִשְׂמַח
  choice: Настоящее, продолжающееся ликование
  alternative: 'Уверенное будущее: «возрадуется»'
  rationale: Поэтический имперфект допускает оба прочтения. Основной текст отражает настоящее исповедание, а подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой лексикой. «Уповаем» сохранено как широко понятное и уместное библейско-поэтическое слово. Прописные буквы в местоимениях о Боге следуют принятой русской издательской норме, не добавляя отсутствующего в стихе божественного имени.
