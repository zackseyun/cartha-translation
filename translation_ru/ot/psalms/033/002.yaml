lexical_decisions:
- source_word: הוֹדוּ
  choice: Благодарите
  rationale: Форма повелительного наклонения во множественном числе от ידה в богослужебном контексте означает «благодарить, воздавать благодарение»; этот выбор сохраняет более конкретный смысл, чем общее «прославляйте».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Тетраграмматон יְהוָה передан личным именем «Яхве», а не титулом, в соответствии с прямым употреблением имени в еврейском тексте.
- source_word: בְּכִנּוֹר
  choice: под звуки лиры
  rationale: כִּנּוֹר обозначает древний струнный инструмент, обычно отождествляемый с лирой. Оборот «под звуки» естественно передаёт инструментальное значение предлога בְּ в русском поэтическом контексте.
- source_word: בְּנֵבֶל עָשׂוֹר
  choice: на десятиструнной арфе
  rationale: נֵבֶל — древний струнный инструмент неопределённого точного типа, а עָשׂוֹר указывает на десять струн. «Десятиструнная арфа» ясно сохраняет отличие от כִּנּוֹר и числовую характеристику.
- source_word: זַמְּרוּ לוֹ
  choice: играйте Ему
  rationale: В контексте двух названных инструментов זמר уместно передать как исполнение музыки. «Играйте Ему» звучит естественно и сохраняет направленность хвалы Богу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо содержит личное имя Бога. «Яхве» передаёт его как имя и не заменяет титулом; вариант «Иегова» отражает более позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский язык с достоинством богослужебной поэзии. Параллелизм еврейской строки сохранён; точная идентификация древнего инструмента не утверждается без оговорки.
