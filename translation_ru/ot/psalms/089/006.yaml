base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/006.yaml
  text: For who in the skies can be compared to Yahweh? Who among the sons of God is like Yahweh?[a]
translation:
  language: ru
  text: Ибо кто в небесах сравнится с Господом? Кто среди сынов Божьих подобен Господу?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди небесных существ», «среди божественных существ» или «среди сынов могущественных». Буквально по-еврейски: «среди сынов Бога/богов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующей хвалы; «ибо» естественно связывает контекст с риторическим вопросом и сохраняет возвышенный регистр.
- source_word: בַשַּׁחַק
  choice: в небесах
  rationale: שׁחק может обозначать небо, небеса или облака; форма «в небесах» передаёт небесную сферу и хорошо согласуется со второй строкой.
- source_word: יַעֲרֹךְ לַיהוָה
  choice: сравнится с Господом
  rationale: Глагол ערך выражает сопоставление или постановку рядом; русский возвратный глагол ясно и естественно передаёт смысл риторического вопроса.
- source_word: יִדְמֶה לַיהוָה
  choice: подобен Господу
  rationale: Формулировка точно передаёт идею сходства и сохраняет смысловой параллелизм с первым вопросом.
- source_word: בִּבְנֵי אֵלִים
  choice: среди сынов Божьих
  rationale: Буквальная образность еврейского выражения сохранена, а возможное указание на небесных существ не сведено в основном тексте к одному толкованию.
- source_word: יהוה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, уместная в современном литературном библейском тексте.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» следует устойчивой русской библейской традиции; транслитерация остаётся возможной, но для данного текста не избрана.
- issue: Толкование בִּבְנֵי אֵלִים
  choice: среди сынов Божьих
  alternative: среди небесных существ; среди божественных существ; среди сынов могущественных
  rationale: Основной вариант ближе к форме оригинала и сохраняет образ и богословское напряжение, тогда как пояснительные варианты приводятся в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Параллелизм двух риторических вопросов сохранён; архаические синтаксические формы не используются.
