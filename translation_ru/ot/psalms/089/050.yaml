  text: זְכֹ֣ר אֲ֭דֹנָ/י חֶרְפַּ֣ת עֲבָדֶ֑י/ךָ שְׂאֵתִ֥/י בְ֝/חֵיקִ֗/י כָּל רַבִּ֥ים עַמִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/050.yaml
  text: Remember[a], Lord, the reproach of your servants[b], which I bear in my bosom from many peoples.
translation:
  language: ru
  text: Вспомни, Господи, о поношении Твоих рабов, которое я несу на своей груди[b] от многих народов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я несу на своей груди поношение всех многочисленных народов». Древнееврейский синтаксис после слов «на своей груди» сжат: народы могут пониматься либо как источник поношения («от многих народов»), либо как содержание или объём того поношения, которое он несёт.'
    reason: alternative_reading
  - marker: b
    text: «Нести на груди» передаёт древнееврейский образ того, что человек несёт глубоко лично и близко к себе, а не только физически.
    reason: cultural_note
lexical_decisions:
- source_word: זְכֹר
  choice: Вспомни
  rationale: Повелительная форма от זכר выражает прямую молитвенную просьбу к Богу. «Вспомни» естественно звучит в русском языке плача и молитвы.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Это закрепившийся божественный титул в прямом обращении; русская звательная форма «Господи» передаёт обращение естественно и торжественно, не добавляя значения притяжательности «мой».
- source_word: חֶרְפַּת
  choice: о поношении
  rationale: חֶרְפָּה охватывает значения поношения, позора и презрения. «Поношение» сохраняет молитвенно-поэтический регистр и не сводит смысл только к словесной насмешке.
- source_word: עֲבָדֶיךָ
  choice: Твоих рабов
  rationale: В молитвенной речи עבד обозначает принадлежащих Богу и служащих Ему людей. «Рабы» сохраняет традиционную библейскую формулу и более полно передаёт отношение зависимости, чем нейтральное «служители».
- source_word: שְׂאֵתִי
  choice: которое я ношу
  rationale: Форма от נשׂא означает «нести, переносить». Относительное придаточное делает русскую фразу ясной, сохраняя образ лично несомого поношения.
- source_word: בְחֵיקִי
  choice: в своей груди
  rationale: חֵיק буквально обозначает грудь или лоно. Выражение сохраняет телесный образ близко и глубоко носимого бремени, оставаясь понятным современному читателю.
- source_word: כָּל רַבִּים עַמִּים
  choice: от многих народов
  rationale: Сжатая еврейская конструкция допускает понимание народов как источника поношения. Предлог «от» добавлен для естественного русского синтаксиса; множественное «народы» сохраняет עמים.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господи
  alternative: Владыка; мой Господь
  rationale: В данном месте אֲדֹנָי — устойчивый божественный титул в обращении. «Господи» соответствует русской молитвенной норме, тогда как «мой Господь» вносило бы не обязательный здесь притяжательный оттенок.
- issue: К кому относится поношение
  choice: Поношение Твоих рабов, которое несёт псалмопевец
  alternative: Поношение всех многочисленных народов как содержание того, что он несёт
  rationale: Основной текст связывает חֶרְפַּת с עֲבָדֶיךָ и понимает народы как источник поношения, но сжатость древнееврейского синтаксиса не позволяет исключить альтернативное прочтение; оно сохранено в примечании.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного плача. Сохранены традиционное обращение «Господи», библейское «рабы» и конкретный образ ношения в груди; спорная связь заключительной фразы не устранена, а вынесена в текстологически значимое примечание.
