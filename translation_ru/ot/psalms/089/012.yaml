  text: The north and the south—you created them[b][a]; Tabor and Hermon sing for joy in your name.
translation:
  language: ru
  text: Север и юг — Ты сотворил их[a]; Фавор и Ермон ликуют при Твоём имени[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «север и правую сторону». Здесь «правая сторона», вероятно, служит географическим обозначением юга.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «радостно поют»; также возможно: «радостно восклицают».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָפוֹן
  choice: север
  rationale: Обычное значение слова — «север, северная область». В паре с יָמִין оно обозначает одну из противоположных сторон света.
- source_word: יָמִין
  choice: юг
  rationale: Буквально слово означает «правая рука, правая сторона», но при традиционной ориентации лицом на восток правая сторона соответствует югу. В сочетании с «севером» здесь естественно выражена полнота пространственного охвата.
- source_word: בְרָאתָם
  choice: Ты сотворил их
  rationale: Форма Qal perfect, 2-е лицо мужского рода единственного числа, с местоименным суффиксом 3-го лица множественного числа. Прошедшее время естественно передаёт утверждение о Божьем творении.
- source_word: תָּבוֹר
  choice: Фавор
  rationale: Устоявшаяся русская библейская форма географического названия.
- source_word: חֶרְמוֹן
  choice: Ермон
  rationale: Устоявшаяся русская библейская форма географического названия.
- source_word: בְּשִׁמְךָ
  choice: Твоим именем
  rationale: Предлог בְּ допускает значения сферы, основания или повода. Русский творительный передаёт ликование, связанное с Божьим именем, не сводя выражение только к одному оттенку.
- source_word: יְרַנֵּנוּ
  choice: ликуют
  rationale: Piel от רנן обозначает звучное выражение радости — радостное пение или восклицание. «Ликуют» естественно сохраняет широту образа и поэтическое олицетворение гор.
theological_decisions:
- issue: Значение יָמִין в паре с צָפוֹן
  choice: географическая пара «север и юг»
  alternative: буквальное «север и правая сторона»
  rationale: Географическое значение создаёт поэтическую пару противоположностей и выражает всеохватность Божьего творения. Буквальное значение отмечено в сноске, поскольку оно действительно присутствует в исходной лексеме.
- issue: Олицетворение Фавора и Ермона
  choice: сами горы поэтически представлены ликующими
  alternative: ликуют жители областей Фавора и Ермона
  rationale: Множественный глагол согласуется с двумя названиями гор как составным подлежащим, а олицетворение творения обычно для поэзии Псалмов. Перевод не подменяет образ пояснением о жителях.
- issue: Связь ликования с Божьим именем
  choice: «ликуют Твоим именем» с сохранением широты предлога בְּ
  alternative: «ликуют при звуке Твоего имени» или «ликуют во имя Твоё»
  rationale: Исходное выражение может указывать на сферу, основание или повод ликования. Выбранная формулировка не ограничивает его исключительно моментом произнесения имени и не придаёт обороту узкого значения действия по чьему-либо полномочию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены традиционные русские формы имён «Фавор» и «Ермон», обращённое к Богу местоимение написано с прописной буквы. Тире передаёт эмфатическое выдвижение первой пары в еврейской строке.
