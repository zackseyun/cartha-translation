lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Я положу
  rationale: Перфект 1-го лица единственного числа с союзом в контексте обещания естественно передаётся русским будущим временем. «Положу» сохраняет конкретный поэтический образ.
- source_word: בַיָּם
  choice: на море
  rationale: Предлог ב допускает здесь пространственное «на»; выражение сохраняет образ руки, простёртой на область моря, не превращая его прямо в толкование о власти.
- source_word: יָדוֹ
  choice: руку его
  rationale: Сохранён буквальный образ части тела, который в контексте подразумевает силу, власть или пределы господства.
- source_word: וּבַנְּהָרוֹת
  choice: и на реки
  rationale: Множественное נְהָרוֹת обычно означает «реки». Повтор предлога сохраняет параллелизм еврейской строки.
- source_word: יְמִינוֹ
  choice: правую руку его
  rationale: Буквальный перевод сохраняет параллелизм и связанные с правой рукой оттенки силы и власти.
theological_decisions:
- issue: Образ царского владычества
  choice: Сохранить конкретный образ руки и правой руки, положенных на море и реки, лишь косвенно выражающий широкое владычество.
  alternative: «Я дам ему власть над морем и над реками».
  rationale: Еврейский текст говорит образно и не называет власть прямо; буквальный образ сохраняет поэтическую и богословскую многозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Постпозиция местоимения «руку его» сохраняет ритм и библейское достоинство, оставаясь понятной современному читателю.
