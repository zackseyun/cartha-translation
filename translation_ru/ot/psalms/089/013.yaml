  yaml_path: translation/ot/psalms/089/013.yaml
  text: Yours is an arm with might[a]; your hand is strong; your right hand is exalted.
translation:
  language: ru
  text: Твоя мышца исполнена мощи; сильна Твоя рука, высоко поднята Твоя десница.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «У Тебя могучая мышца; Твоя рука являет силу, Твоя десница возвышенна».'
