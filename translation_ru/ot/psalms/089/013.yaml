lexical_decisions:
- source_word: לְךָ
  choice: Тебе принадлежит
  rationale: Дательный оборот выражает принадлежность и поставлен в начале строки для эмфазы; русский вариант сохраняет это ударение и звучит естественно.
- source_word: זְרוֹעַ
  choice: рука
  rationale: Слово обозначает руку как образ силы; конкретная телесная метафора сохранена. В первом полустишии «рука» передаёт именно образ могучей руки, тогда как далее параллельно употреблено יָד.
- source_word: עִם גְּבוּרָה
  choice: исполненная мощи
  rationale: Конструкция характеризует руку как наделённую могуществом. Такой оборот естественен в современной русской поэзии и не превращает образ в отвлечённое понятие.
- source_word: תָּעֹז
  choice: сильна
  rationale: Форма глагола выражает состояние или проявление силы. Краткое прилагательное естественно передаёт предикативный смысл и сохраняет параллелизм.
- source_word: יָדְךָ
  choice: Твоя рука
  rationale: Буквальный образ действующей Божьей силы сохранён.
- source_word: תָּרוּם
  choice: высоко поднята
  rationale: Форма от רום допускает значения высоты, возвышения или поднятия. «Высоко поднята» сохраняет пространственный образ и оттенок торжественной силы, не сводя его только к абстрактному прославлению.
- source_word: יְמִינֶךָ
  choice: Твоя десница
  rationale: «Десница» — понятное литературно-библейское обозначение правой руки; оно помогает различить параллельные יָד и יָמִין и сохраняет торжественный регистр.
theological_decisions:
- issue: Антропоморфный образ Божьего могущества
  choice: Сохранены образы руки и десницы.
  alternative: Передать их отвлечёнными словами «сила» и «могущество».
  rationale: Еврейский текст изображает Божью силу посредством телесной метафоры. Её сохранение передаёт поэтическую выразительность и не навязывает буквального представления о телесности Бога.
- issue: Значение תָּרוּם применительно к деснице
  choice: «высоко поднята»
  alternative: «возвышенна» или «превознесена»
  rationale: Исходная форма допускает как пространственный, так и статусный оттенок. Основной текст сохраняет конкретный образ поднятой десницы, а примечание отмечает возможный оттенок возвышенности.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим звучанием. Антропоморфные образы оригинала сохранены; «десница» употреблена как укоренённое и понятное библейско-поэтическое слово. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской издательской традиции.
