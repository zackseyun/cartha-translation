source:
  edition: WLC
  text: וְ/אַתָּ֣ה זָ֭נַחְתָּ וַ/תִּמְאָ֑ס הִ֝תְעַבַּ֗רְתָּ עִם מְשִׁיחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/038.yaml
  text: But you have cast off and rejected[a]; you have become enraged with your anointed one.
translation:
  language: ru
  text: Но Ты отверг и презрел, разгневался на Своего помазанника[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово можно также передать как «Своего Мессию». Здесь оно непосредственно относится к помазанному царю из рода Давида, с которым связан Божий завет.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Но Ты
  rationale: Самостоятельное местоимение с союзом подчёркивает резкий поворот от предшествующих утверждений о верности Божьему завету; «Но Ты» естественно передаёт это противопоставление.
- source_word: זָנַחְתָּ
  choice: отверг
  rationale: Глагол означает отвергнуть, отринуть или отбросить. «Отверг» ясно и достойно звучит в современном русском тексте.
- source_word: וַ/תִּמְאָס
  choice: и презрел
  rationale: מאס обозначает отвержение с оттенком пренебрежения или презрения. Такое различение сохраняет усиление, создаваемое двумя близкими еврейскими глаголами.
- source_word: הִתְעַבַּרְתָּ
  choice: разгневался
  rationale: Форма hitpael здесь идиоматически выражает сильный гнев. «Разгневался» передаёт силу выражения и соответствует литературному регистру.
- source_word: עִם
  choice: на
  rationale: Хотя предлог буквально означает «с», при русском глаголе «разгневаться» естественное управление — «на кого-либо»; смысл отношения гнева к помазаннику сохраняется.
- source_word: מְשִׁיחֶךָ
  choice: Своего помазанника
  rationale: Слово означает «твой помазанник». Возвратное «Своего» естественно соотносит помазанника с подлежащим «Ты», а «помазанник» сохраняет царский титул и его мессианское звучание.
theological_decisions:
- issue: Передача מְשִׁיחֶךָ в плаче о царе из рода Давида при наличии мессианского звучания
  choice: Своего помазанника
  alternative: Своего Мессию
  rationale: В непосредственном контексте речь идёт о помазанном царе из рода Давида. Перевод «помазанник» не навязывает более узкого христологического отождествления, чем выражено в самом стихе, а связь со словом «Мессия» отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Пара «отверг и презрел» сохраняет еврейское усиление, а краткий синтаксис — резкость обвинительного поворота.
