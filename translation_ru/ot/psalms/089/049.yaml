  text: Where are your former acts of steadfast love[a], Lord[b], which you swore to David in your faithfulness?
translation:
  language: ru
  text: Где Твои прежние проявления верной любви[a], Владыка, которые Ты обещал Давиду, поклявшись в Своей верности[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твои прежние милости»; или: «Твоя прежняя верная любовь». В еврейском тексте существительное стоит во множественном числе: буквально «Твои прежние проявления верной любви».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Своей верностью» или «по Своей верности». Оборот может указывать на образ действия или на основание клятвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה
  choice: Где
  rationale: Вопросительное наречие выражает вопрос о местонахождении или наличии; в контексте плача это вопрос о том, где теперь обещанные проявления Божьей любви.
- source_word: חֲסָדֶיךָ הָרִאשֹׁנִים
  choice: Твои прежние проявления неизменной любви
  rationale: Множественное число חֲסָדֶיךָ указывает на неоднократные или конкретные проявления חֶסֶד. Добавление слова «проявления» естественно передаёт множественное число по-русски, а «неизменная любовь» сохраняет смысл верной, устойчивой любви в контексте завета.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Это обращение к Богу посредством титула אֲדֹנָי, а не личного имени. «Владыка» ясно передаёт значение господства и позволяет отличить этот титул от передачи тетраграмматона.
- source_word: נִשְׁבַּעְתָּ לְדָוִד
  choice: Ты поклялся явить Давиду
  rationale: 'Буквально: «Ты поклялся Давиду». В русском требуется обозначить подразумеваемое отношение к предшествующим «проявлениям любви»; «явить» делает связь грамматически естественной, не меняя содержания клятвы.'
- source_word: בֶּאֱמוּנָתֶךָ
  choice: в Своей верности
  rationale: אֱמוּנָה означает твёрдость, надёжность и верность. Предлог ב допускает понимание сферы, образа действия или основания клятвы; формулировка «в Своей верности» сохраняет эту смысловую широту.
theological_decisions:
- issue: Передача חֶסֶד в контексте заветного плача
  choice: неизменная любовь
  alternative: милость; верная любовь; благость
  rationale: Псалмопевец взывает к устойчивой любви Бога, связанной с Его обещаниями Давиду. «Неизменная любовь» передаёт как любовь, так и её постоянный, верный характер, не сводя слово только к состраданию.
- issue: Передача множественного числа חֲסָדֶיךָ
  choice: проявления неизменной любви
  alternative: милости; неизменная любовь
  rationale: Форма в еврейском тексте множественная. Выражение «проявления неизменной любви» естественно по-русски обозначает конкретные свидетельства этой любви, не устраняя множественное число.
- issue: Смысл ב в בֶּאֱמוּנָתֶךָ
  choice: в Своей верности
  alternative: Своей верностью; по Своей верности
  rationale: Еврейский предлог может указывать на образ действия, сферу или основание. Основной текст не сужает эту неоднозначность до одного инструментального или причинного значения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции. Синтаксис сохраняет прямой вопрос и напряжение плача.
