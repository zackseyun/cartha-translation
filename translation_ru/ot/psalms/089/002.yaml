  text: כִּֽי אָמַ֗רְתִּי ע֭וֹלָם חֶ֣סֶד יִבָּנֶ֑ה שָׁמַ֓יִם תָּכִ֖ן אֱמוּנָתְ/ךָ֣ בָ/הֶֽם־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/002.yaml
  text: For I said[a], “Steadfast love will be built up forever; in the heavens you will establish your faithfulness.”
translation:
  language: ru
  text: 'Ибо я сказал: «Неизменная любовь будет созидаться вовеки[a]; на небесах Ты утвердишь Свою верность».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неизменная любовь будет утверждена навеки». Еврейский глагол может означать буквально «строиться, созидаться» или, шире, «утверждаться». В основном тексте сохранён строительный образ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт пояснительно-причинную связь с предшествующим контекстом и соответствует возвышенному, но понятному поэтическому регистру.
- source_word: אָמַרְתִּי
  choice: я сказал
  rationale: Прямо передаёт форму Qal perfect 1-го лица единственного числа, не превращая высказывание в более интерпретирующее «я провозглашаю».
- source_word: עוֹלָם
  choice: вовеки
  rationale: Наречное употребление выражает неограниченную длительность; «вовеки» естественно для современной русской библейской поэзии.
- source_word: חֶסֶד
  choice: неизменная любовь
  rationale: Сочетание передаёт и любовь, и устойчивую преданность, не сужая значение до одной лишь жалости или до специально оговорённого заветного термина.
- source_word: יִבָּנֶה
  choice: будет созидаться
  rationale: Сохраняет пассивное значение Nifal и строительный образ корня בנה, а также допускает процессуальный оттенок несовершенного вида.
- source_word: שָׁמַיִם
  choice: на небесах
  rationale: Передаёт поэтическое значение формы множественного числа и служит явным антецедентом последующего местоименного указания.
- source_word: תָּכִן
  choice: Ты утвердишь
  rationale: Передаёт Hiphil со значением «сделать твёрдым, установить» и явное обращение к Богу во 2-м лице мужского рода единственного числа.
- source_word: אֱמוּנָתְךָ
  choice: Свою верность
  rationale: «Верность» естественно выражает надёжность и постоянство; возвратное «Свою» по нормам русского языка соотносит качество с подлежащим «Ты».
- source_word: בָהֶם
  choice: на небесах
  rationale: Местоимение относится к שָׁמַיִם; в русском явное повторение антецедента звучит яснее, чем буквальное «на них».
theological_decisions:
- issue: Смысл חֶסֶד в заветно-поэтическом контексте
  choice: неизменная любовь
  alternative: милость; заветная любовь
  rationale: Выбранное выражение сохраняет сочетание любви и постоянной преданности, не ограничивая слово только состраданием и не добавляя отсутствующее в самой строке слово «завет».
- issue: Прямое обращение к Богу во второй части стиха
  choice: «Ты утвердишь Свою верность»
  alternative: безличное утверждение о том, что верность утверждена на небесах
  rationale: Форма глагола 2-го лица мужского рода единственного числа и суффикс 2-го лица прямо указывают на обращение к Богу.
- issue: Временной и видовой оттенок יִבָּנֶה
  choice: будет созидаться
  alternative: будет воздвигнута; утвердится
  rationale: Будущее время согласуется с несовершенной формой и параллельным תָּכִן, а несовершенный вид сохраняет возможность длительного созидания, не устраняя поэтической напряжённости образа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Строительная метафора оригинала сохранена; формы «Ты» и «Свою» обозначают прямое обращение к Богу без добавления конфессионально специфической терминологии.
