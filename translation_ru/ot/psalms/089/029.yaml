base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/029.yaml
  text: I will establish his offspring forever[a], and his throne as the days of heaven.
translation:
  language: ru
  text: 'Я утвержу навеки его потомство,

    и престол его — как дни небес[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «пока существуют небеса».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Я утвержу
  rationale: Глагол שׂים буквально означает «поставить, поместить», но в контексте заветного обещания передаёт смысл прочного установления. «Утвержу» естественно выражает этот оттенок по-русски.
- source_word: לָעַד
  choice: навеки
  rationale: Сочетание предлога ל с עַד обозначает неограниченную продолжительность; «навеки» ясно и уместно передаёт силу обещания.
- source_word: זַרְעוֹ
  choice: его потомство
  rationale: זֶרַע здесь имеет собирательное значение и может обозначать потомство или потомков. «Потомство» сохраняет собирательность и заветный оттенок без архаичного буквального «семя».
- source_word: וְכִסְאוֹ
  choice: и престол его
  rationale: כִּסֵּא прямо означает царский престол; порядок «престол его» поддерживает возвышенный поэтический строй русского текста.
- source_word: כִּימֵי
  choice: как дни
  rationale: Префикс כְּ вводит сравнение, а יְמֵי — сопряжённая форма слова «дни». Формулировка сохраняет образ исходного текста, не заменяя его толкованием продолжительности.
- source_word: שָׁמָיִם
  choice: небес
  rationale: Форма שָׁמַיִם обычно обозначает небеса. Русское множественное число «небес» сохраняет космический масштаб сравнения и поэтический регистр.
theological_decisions:
- issue: Продолжительность обещания в завете с Давидом
  choice: 'Сохранить прямые выражения вечности: «навеки» и «как дни небес».'
  alternative: 'Передать вторую строку толковательно: «пока существуют небеса».'
  rationale: Исходный текст соединяет прямое указание на вечность с поэтическим сравнением. Перевод сохраняет силу и напряжение обещания, не ограничивая его определённой династической или эсхатологической схемой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Необычный образ «как дни небес» сохранён намеренно как близкое отражение еврейского сравнения; более естественный русский вариант дан в сноске.
