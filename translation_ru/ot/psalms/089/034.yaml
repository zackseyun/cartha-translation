  yaml_path: translation/ot/psalms/089/034.yaml
  text: I will not violate my covenant[b][a], or alter what has gone out from my lips.
translation:
  language: ru
  text: 'Я не нарушу Своего завета[a]

    и не изменю того, что вышло из Моих уст[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «не оскверню Своего завета» или «не попру Своего завета».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «то, что вышло из Моих уст», то есть сказанное Мною.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲחַלֵּל
  choice: не нарушу
  rationale: Пиэль глагола חלל здесь означает осквернить или нарушить завет. «Не нарушу» естественно сочетается с «заветом» в современном русском языке и ясно передаёт мысль о недопустимости его попрания.
- source_word: בְּרִיתִי
  choice: Своего завета
  rationale: בְּרִית — обычное библейское обозначение завета. Возвратное «Своего» естественно передаёт суффикс первого лица при выраженном подлежащем «Я».
- source_word: מוֹצָא שְׂפָתַי
  choice: того, что вышло из Моих уст
  rationale: Сохранён еврейский образ буквального «выхода уст», обозначающий произнесённое Богом слово; формулировка при этом понятна современному читателю.
- source_word: אֲשַׁנֶּה
  choice: не изменю
  rationale: Пиэль שנה означает «изменять». Выбор прямо передаёт отрицание любого изменения уже произнесённого.
- source_word: לֹא ... לֹא
  choice: не нарушу ... и не изменю
  rationale: Оба отрицания переданы явно, чтобы сохранить параллелизм и усиление еврейского текста.
theological_decisions:
- issue: Характер Божьего обязательства
  choice: Сохранить конкретные образы завета и слова, вышедшего из Божьих уст
  alternative: 'Передать обобщённо: «Я не нарушу Своего обещания»'
  rationale: Исходный текст говорит именно о завете и произнесённом слове; перевод не расширяет это высказывание до отвлечённой формулы о неизменности Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм сохранён; местоимения, относящиеся к Богу в прямой речи, написаны с прописной буквы.
