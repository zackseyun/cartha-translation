  text: לְ֭/עוֹלָ֗ם אשמור ל֣/וֹ חַסְדִּ֑/י וּ֝/בְרִיתִ֗/י נֶאֱמֶ֥נֶת לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/028.yaml
  text: Forever I will keep my steadfast love for him[a], and my covenant will remain faithful to him.
translation:
  language: ru
  text: Навеки сохраню для него Мою неизменную любовь, и Мой завет останется для него незыблемым[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мой завет будет верен ему»; также возможно: «Мой завет будет для него надёжным».'
    reason: Еврейское נֶאֱמֶנֶת может характеризовать завет как верный, надёжный или незыблемый; конструкция с לוֹ допускает оттенки «ему» и «для него».
lexical_decisions:
- source_word: לְעוֹלָם
  choice: Навеки
  rationale: Предлог לְ с עוֹלָם выражает неограниченную длительность; «навеки» естественно и подчёркивает непреложность обещания.
- source_word: אֶשְׁמֹר
  choice: сохраню
  rationale: Глагол שׁמר означает хранить, оберегать, соблюдать. В сочетании с חֶסֶד форма «сохраню» естественно передаёт деятельное поддержание неизменной любви.
- source_word: לוֹ
  choice: для него / с ним
  rationale: Первое לוֹ передано как отношение пользы — «для него». Во второй части естественное русское сочетание «завет с ним» выражает ту же соотнесённость завета с названным лицом.
- source_word: חַסְדִּי
  choice: Мою неизменную любовь
  rationale: חֶסֶד объединяет любовь, милость и преданность обязательству. «Неизменная любовь» передаёт устойчивость и личностный характер понятия, не сводя его только к милосердию.
- source_word: וּבְרִיתִי
  choice: и Мой завет
  rationale: בְּרִית — обычное библейское обозначение торжественно установленного завета; русское «завет» точно и узнаваемо в данном контексте.
- source_word: נֶאֱמֶנֶת
  choice: останется незыблемым
  rationale: Причастие нифаля от אמן выражает надёжность, твёрдость и непреложность. «Останется незыблемым» естественно по-русски передаёт устойчивую надёжность завета, а вариант «будет верен» сохранён в примечании.
theological_decisions:
- issue: Отнесение обещания к Давиду и его царской линии без внесения явного мессианского истолкования
  choice: Сохранено местоименное указание «для него» и выражение «завет с ним» без уточнения личности в самом стихе.
  alternative: Явно назвать Давида, его потомка или Мессию.
  rationale: Еврейский текст использует только местоимение לוֹ. Непосредственный контекст относится к Давидову царю, но явное мессианское уточнение внесло бы в перевод последующее каноническое истолкование.
- issue: Персонификация верности завета
  choice: «завет… останется незыблемым»
  alternative: «завет… будет верен ему»
  rationale: Нֶאֱמֶנֶת допускает характеристику завета как верного или надёжного. Основной вариант звучит естественнее по-русски и сохраняет идею непреложности; более буквальная персонификация отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Заглавные буквы в притяжательных местоимениях обозначают речь Бога. Синтаксис остаётся ясным для обычного читателя, а богатство חֶסֶד и неоднозначность נֶאֱמֶנֶת переданы без конфессионального уточнения.
