base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/019.yaml
  text: Then you spoke in a vision to your faithful ones and said[a], “I have set help upon a mighty one[d][c][b]; I have exalted one chosen from the people.”
translation:
  language: ru
  text: 'Тогда Ты говорил в видении верным Твоим[a] и сказал: «Я даровал помощь могучему[b]; Я возвысил избранного[c] из народа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Согласно другому чтению, отражённому в некоторых древних версиях: «верному Твоему».'
    reason: textual_variant
  - marker: b
    text: 'Или: «воина», «сильного», «героя».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможен также перевод: «юношу»; здесь контекст Божьего избрания позволяет понять слово как «избранного».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Естественно передаёт временное наречие, вводящее речь Бога в повествовательно-поэтической последовательности.
- source_word: דִּבַּרְתָּ
  choice: Ты говорил
  rationale: Сохраняет отличие более общего глагола «говорить» от последующего וַתֹּאמֶר — «и сказал».
- source_word: בְחָזוֹן
  choice: в видении
  rationale: Передаёт видение как среду или способ откровения без излишнего уточнения.
- source_word: לַחֲסִידֶיךָ
  choice: верным Твоим
  rationale: Передаёт множественное число данной формы и значение благочестивой, заветной верности; избегает более поздних церковных ассоциаций слова «святые».
- source_word: שִׁוִּיתִי עֵזֶר עַל
  choice: Я возложил помощь на
  rationale: Сохраняет образ буквального размещения помощи на человеке и поэтическую необычность исходного выражения, не сводя его к более свободному «даровал помощь».
- source_word: גִּבּוֹר
  choice: могучего
  rationale: Оставляет широкое значение сильного, доблестного человека; контекст не требует сужения до «воина».
- source_word: הֲרִימוֹתִי
  choice: Я возвысил
  rationale: Соответствует каузативному значению корня רום и контексту возведения избранника к высокому положению.
- source_word: בָחוּר
  choice: избранного
  rationale: В параллелизме с Божьим возвышением наиболее уместно значение «избранный», хотя возможно и лексическое понимание «юноша».
- source_word: מֵעָם
  choice: из народа
  rationale: Кратко и точно обозначает среду, из которой избран человек.
theological_decisions:
- issue: Референт стиха в контексте завета с Давидом
  choice: Перевод оставлен на уровне непосредственного историко-поэтического контекста избрания Давида.
  alternative: Сделать мессианское или типологическое прочтение явным в самом переводе.
  rationale: Текст говорит об избрании и возвышении человека из народа, но сам по себе не требует эксплицитного мессианского уточнения; возможное дальнейшее типологическое прочтение не исключается.
- issue: Число в לַחֲסִידֶיךָ
  choice: 'Множественное число: «верным Твоим».'
  alternative: 'Единственное число: «верному Твоему».'
  rationale: Предоставленный текст WLC содержит форму множественного числа; иное чтение отмечено в сноске, а не подменяет исходный текст.
- issue: Смысл בָחוּר
  choice: «избранного».
  alternative: «юношу».
  rationale: Контекст Божьего возвышения и выбора Давида поддерживает значение «избранный», но реальная лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Необычный образ «возложил помощь на» сохранён ради близости к древнееврейскому тексту; прописные местоимения обращения к Богу соответствуют устойчивой русской библейской издательской традиции.
