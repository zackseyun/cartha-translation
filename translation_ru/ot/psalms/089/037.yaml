  text: כְּ֭/יָרֵחַ יִכּ֣וֹן עוֹלָ֑ם וְ/עֵ֥ד בַּ֝/שַּׁ֗חַק נֶאֱמָ֥ן סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/037.yaml
  text: Like the moon[a], it will be established forever, and the witness in the sky is faithful[b]. Selah
translation:
  language: ru
  text: Как луна, он[a] будет утверждён навеки, и свидетель в небесах верен[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте подлежащее здесь не названо прямо; оно подразумевается из предыдущих строк — вероятнее всего, речь идёт о престоле Давида.
    reason: implicit_subject
  - marker: b
    text: Под «свидетелем в небесах» часто понимают луну как неизменного небесного свидетеля непреложности завета, однако сам текст прямо этого не уточняет.
    reason: alternative_reading
lexical_decisions:
- source_word: כְּיָרֵחַ
  choice: Как луна
  rationale: Префикс כְּ выражает сравнение, а יָרֵחַ означает «луна». Формулировка сохраняет краткость и поэтический образ.
- source_word: יִכּוֹן
  choice: будет утверждён
  rationale: Форма нифаля от כון передаёт значение утверждённости и прочности; страдательная конструкция сохраняет грамматический оттенок исходного текста.
- source_word: עוֹלָם
  choice: навеки
  rationale: В контексте завета слово обозначает непреходящую длительность; «навеки» естественно и поэтически звучит по-русски.
- source_word: וְעֵד
  choice: и свидетель
  rationale: עֵד означает «свидетель». Неопределённость референта сохранена без поясняющей вставки в основной текст.
- source_word: בַּשַּׁחַק
  choice: в небесах
  rationale: Поэтическое שַׁחַק может обозначать небосвод, небеса или облака. «В небесах» сохраняет возвышенный поэтический регистр и не сужает образ до облаков.
- source_word: נֶאֱמָן
  choice: верен
  rationale: Прилагательное выражает верность, надёжность и достоверность; «верен» сохраняет как обычный смысл надёжности, так и заветный оттенок.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неизвестно, поэтому он передан традиционной транслитерацией, а не предположительным переводом.
theological_decisions:
- issue: Референт подразумеваемого подлежащего при יִכּוֹן
  choice: Сохранено местоимение «он» с пояснением, что подлежащее восстанавливается из предыдущего контекста.
  alternative: Прямо вставить «его престол» или «его потомство».
  rationale: В еврейском стихе подлежащее явно не названо. Мужское местоимение необходимо для естественного русского синтаксиса, но сноска не позволяет незаметно выдать одно толкование за прямо выраженный текст.
- issue: Кто назван «свидетелем в небесах»
  choice: В основном тексте оставлено неопределённое обозначение «свидетель в небесах».
  alternative: Отождествить свидетеля с луной либо с иным небесным знамением.
  rationale: Еврейский текст прямо не называет свидетеля. Вероятную связь с луной уместно отметить в сноске, не устраняя подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатого, возвышенного параллелизма еврейской поэзии. Неопределённость подразумеваемого подлежащего и личности небесного свидетеля не устранена; «Села» транслитерировано.
