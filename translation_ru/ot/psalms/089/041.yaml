  text: שַׁ֭סֻּ/הוּ כָּל עֹ֣בְרֵי דָ֑רֶךְ הָיָ֥ה חֶ֝רְפָּ֗ה לִ/שְׁכֵנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/041.yaml
  text: All who pass by the way have plundered him[a]; he has become a reproach to his neighbors.
translation:
  language: ru
  text: Все проходящие по дороге разграбили его[a]; он стал предметом поношения у своих соседей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Все прохожие обобрали его». Буквально: «все проходящие дорогой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁסֻּהוּ
  choice: разграбили его
  rationale: Форма от שׁסה передаёт совершённое враждебное разграбление; «разграбили» сохраняет конкретность действия и естественно звучит по-русски.
- source_word: כָּל
  choice: Все
  rationale: Слово имеет всеохватное значение и естественно сочетается с причастным оборотом «проходящие».
- source_word: עֹבְרֵי דָרֶךְ
  choice: проходящие по дороге
  rationale: Близко передаёт буквальное «проходящие дорогой», сохраняя образ дороги без излишнего уточнения, кто именно эти люди.
- source_word: הָיָה
  choice: стал
  rationale: В данном контексте глагол обозначает наступившее вследствие прежних событий состояние.
- source_word: חֶרְפָּה
  choice: посмешищем
  rationale: Существительное обозначает поношение, позор и объект насмешек; «посмешищем» естественно выражает здесь унизительное положение перед окружающими.
- source_word: לִשְׁכֵנָיו
  choice: для своих соседей
  rationale: 'שָׁכֵן — живущий рядом, сосед; предлог ל выражает отношение: он стал объектом насмешек для соседей.'
theological_decisions:
- issue: Референт местоимений третьего лица единственного числа
  choice: Сохранить местоимение «его», не называя референта.
  alternative: 'Уточнить: «царя», «помазанника» или представленный царём народ.'
  rationale: Контекст указывает на Давидова царя или помазанника, однако сам стих содержит лишь местоименную форму. Неуточнённое «его» сохраняет заложенную в тексте неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмового плача. Синтаксис близок к еврейскому, но естественен для обычного читателя; архаизмы избегаются.
