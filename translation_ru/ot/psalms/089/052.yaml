  yaml_path: translation/ot/psalms/089/052.yaml
  text: Blessed be Yahweh forever[a]. Amen and amen.
translation:
  language: ru
  text: Благословен Яхве вовеки! Аминь и аминь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Страдательное причастие в литургической формуле благословения; краткая именная конструкция естественна для русского библейского и богослужебного регистра и сохраняет славословный характер фразы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом «Господь».
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Передаёт значение неограниченной длительности и звучит естественно в краткой русской литургической формуле.
- source_word: אָמֵן
  choice: Аминь
  rationale: Традиционная транслитерация литургического подтверждения уместнее смысловых переводов «истинно» или «да будет так».
- source_word: וְאָמֵן
  choice: и аминь
  rationale: Сохраняет соединительный союз и усилительное повторение заключительной литургической формулы.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; форма «Яхве» сохраняет личное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский с достоинством краткого литургического славословия. Восклицательный знак естественно выражает доксологическую силу еврейской именной формулы; повтор «Аминь и аминь» сохранён буквально.
