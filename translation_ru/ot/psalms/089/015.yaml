id: PSA.89.15
reference: Psalms 89:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַשְׁרֵ֣י הָ֭/עָם יוֹדְעֵ֣י תְרוּעָ֑ה יְ֝הוָ֗ה בְּֽ/אוֹר פָּנֶ֥י/ךָ יְהַלֵּכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/015.yaml
  text: Blessed are the people who know the joyful shout[a]; O Yahweh[b], they walk in the light of your face.
translation:
  language: ru
  text: Блажен народ, знающий радостный возглас[a]! Яхве, они ходят в свете Твоего лица[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праздничное ликование»; это слово может также подразумевать трубный возглас во время богослужения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «лица»; здесь образ может указывать на Божье присутствие или благоволение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Форма вводит торжественное изречение о благословенном состоянии; «блажен» сохраняет псалмический и богословский оттенок, не сводя смысл к субъективному счастью.
- source_word: הָעָם
  choice: народ
  rationale: В контексте псалма речь идёт о народе как общине, а не о государственно-политической нации.
- source_word: יוֹדְעֵי
  choice: знающий
  rationale: Причастие обозначает устойчивую характеристику народа; буквальный образ сохранён без истолкования как одного лишь понимания.
- source_word: תְרוּעָה
  choice: радостный возглас
  rationale: Слово обозначает громкое восклицание или сигнал и допускает празднично-богослужебный контекст, включая трубное звучание. Основной вариант сохраняет радостную литургическую окраску, не ограничивая значение только трубой.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул; форма соответствует принятой современной русской транслитерации.
- source_word: בְּאוֹר
  choice: в свете
  rationale: 'Предлог выражает сферу пребывания и движения: народ ходит в свете, исходящем от Божьего лица.'
- source_word: פָּנֶיךָ
  choice: Твоего лица
  rationale: Сохранён буквальный и богословски насыщенный образ лица; возможные значения присутствия и благоволения вынесены в примечание.
- source_word: יְהַלֵּכוּן
  choice: они ходят
  rationale: Передаёт продолжающееся движение и сохраняет библейскую метафору образа жизни перед Богом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Его транслитерация сохраняет отличие имени от титула и не вводит конфессионально обусловленную замену.
- issue: Образ פָּנֶיךָ
  choice: Твоего лица
  alternative: Твоего присутствия; Твоего благоволения
  rationale: 'Буквальный образ оставлен в основном тексте, чтобы не устранять многозначность: лицо может указывать одновременно на присутствие, обращённость и благоволение Бога.'
- issue: Характер תְרוּעָה
  choice: радостный возглас
  alternative: праздничное ликование; трубный звук
  rationale: Контекст располагает к празднично-богослужебному пониманию, однако само слово не позволяет уверенно свести возглас исключительно к вокальному или инструментальному звучанию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Сохранены краткость, параллелизм и конкретный образ Божьего лица; местоимение «Твоего» написано с прописной буквы как элемент традиционного русского библейского регистра.
