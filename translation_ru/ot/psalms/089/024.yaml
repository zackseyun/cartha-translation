  text: וֶֽ/אֶֽמוּנָתִ֣/י וְ/חַסְדִּ֣/י עִמּ֑/וֹ וּ֝/בִ/שְׁמִ֗/י תָּר֥וּם קַרְנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/024.yaml
  text: And my faithfulness and my steadfast love will be with him[a], and in my name his horn will be exalted.
translation:
  language: ru
  text: И Моя верность и Моя неизменная любовь будут с ним, и в Моём имени возвысится его рог[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Рог» — древнееврейский образ силы, достоинства или царской власти.
    reason: cultural_note
lexical_decisions:
- source_word: אֱמוּנָתִי
  choice: Моя верность
  rationale: В данном контексте אֱמוּנָה обозначает надёжность и верность Бога, а не человеческую веру; это значение естественно сочетается с חַסְדִּי.
- source_word: חַסְדִּי
  choice: Моя неизменная любовь
  rationale: חֶסֶד здесь выражает постоянную, преданную любовь Бога в отношениях завета. Формулировка сохраняет и личный, и устойчивый характер этой любви, не вводя специальной конфессиональной терминологии.
- source_word: עִמּוֹ
  choice: с ним
  rationale: Прямое значение предлога עִם с местоименным суффиксом; передаёт сопровождающее присутствие и поддержку.
- source_word: בִּשְׁמִי
  choice: Моим именем
  rationale: Творительный оборот естественно передаёт еврейское בִּשְׁמִי как основание или средство возвышения, сохраняя образ имени Бога без избыточного истолкования.
- source_word: תָּרוּם
  choice: возвысится
  rationale: Форма от רוּם означает «стать высоким, возвыситься». Возвратный глагол по-русски естественно сочетается с сохранённым поэтическим образом рога.
- source_word: קַרְנוֹ
  choice: его рог
  rationale: Буквальный образ קֶרֶן сохранён в основном тексте как важная библейская метафора силы, достоинства и царской власти; значение пояснено в сноске.
theological_decisions:
- issue: Сохранение царской метафоры рога
  choice: возвысится его рог
  alternative: возвысится его сила / возрастёт его могущество
  rationale: Буквальная метафора сохраняет поэтическую и царско-заветную образность псалма, тогда как замена на абстрактную «силу» сузила бы выразительность оригинала.
- issue: Связь возвышения с Божьим именем
  choice: Моим именем
  alternative: в Моём имени / благодаря Моему имени
  rationale: Еврейский предлог допускает оттенки сферы и средства. Русский творительный оборот передаёт, что власть и достоинство царя возвышаются силой и авторитетом Божьего имени, не фиксируя значение чрезмерно узко.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Повтор «Моя… Моя…» сохранён ради еврейского параллелизма и смыслового акцента; образ «рога» оставлен в тексте и кратко разъяснён в сноске.
