base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/032.yaml
  text: Then I will punish their transgression with the rod[a], and their iniquity with blows.
translation:
  language: ru
  text: 'тогда Я накажу[a] их жезлом за их преступление

    и ударами — за их беззаконие.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я взыщу за их преступление жезлом и за их беззаконие — ударами». Еврейский глагол может означать «посетить» в значении обратить внимание на кого-либо или что-либо; в данном контексте он выражает взыскание или наказание. Вместо «ударами» возможно также «поражениями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: тогда Я накажу
  rationale: В данном контексте פקד означает карательное взыскание. «Тогда» естественно передаёт последовательность, заданную условием предыдущего стиха.
- source_word: בְשֵׁבֶט
  choice: жезлом
  rationale: שֵׁבֶט может означать жезл, посох или скипетр; здесь это орудие наказания. «Жезл» сохраняет поэтический и библейский образ без акцента на царской власти.
- source_word: פִּשְׁעָם
  choice: их преступление
  rationale: פֶּשַׁע обозначает преступление или мятеж. «Преступление» сохраняет нравственный смысл и не сужает его до политического бунта.
- source_word: וּבִנְגָעִים
  choice: и ударами
  rationale: נֶגַע может означать поражение, бедствие, язву или удар. Параллель с жезлом делает «ударами» наиболее естественным здесь, хотя более широкое значение «поражениями» остаётся возможным.
- source_word: עֲוֹנָם
  choice: их беззаконие
  rationale: עָוֹן может обозначать беззаконие, вину или её последствия. «Беззаконие» сохраняет нравственную весомость и поэтический параллелизм с «преступлением».
theological_decisions:
- issue: Характер Божьего ответа на грех участников завета
  choice: Передано реальное наказание посредством конкретных образов жезла и ударов.
  alternative: Смягчить смысл до неопределённого посещения или исправления.
  rationale: Непосредственный контекст содержит явную карательную образность, поэтому её нельзя ослаблять. При этом перевод не добавляет к самому стиху вывода об окончательном отвержении.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Инверсия во второй строке сохраняет параллелизм и не затрудняет понимание; прописная «Я» следует принятой русской библейской традиции для речи Бога.
