lexical_decisions:
- source_word: נֵאַרְתָּה
  choice: отверг
  rationale: Редкий глагол נאר в пиэле выражает решительное отвержение или отказ. «Отверг» естественно звучит по-русски и сохраняет силу обвинения в плаче.
- source_word: בְּרִית
  choice: завет
  rationale: Устоявшийся русский эквивалент в контексте отношений Бога с Давидом и его царской линией; сохраняет религиозный и обязательственный смысл.
- source_word: עַבְדֶּךָ
  choice: со Своим рабом
  rationale: Конструкция буквально означает «завет Твоего раба», но по смыслу речь идёт о завете Бога с Его рабом. «Раб» сохраняет библейское обозначение подчинённого Богу царя.
- source_word: חִלַּלְתָּ
  choice: осквернил
  rationale: Глагол חלל в пиэле обозначает лишение святости, поругание или осквернение. Выбор сохраняет связь венца с посвящением и передаёт не просто политическое унижение.
- source_word: לָאָרֶץ
  choice: бросив на землю
  rationale: Буквально «на землю». Добавленное по смыслу деепричастие естественно передаёт образ низвержения венца, не уточняя способ действия сверх контекста.
- source_word: נִזְרוֹ
  choice: его венец
  rationale: В царском контексте נזר обозначает венец или диадему, одновременно сохраняя оттенок посвящения. «Венец» звучит достойно и подходит к сакральной царской образности.
theological_decisions:
- issue: Царско-заветная образность и кажущееся отвержение Давидова завета
  choice: 'Сохранено прямое обращённое к Богу обвинение: «Ты отверг… осквернил…»'
  alternative: Смягчить высказывание до описания временного политического поражения либо истолковать его через позднейшее мессианское исполнение
  rationale: Стих выражает напряжение плача перед видимым крушением обещанного Давиду царства. Перевод не разрешает это напряжение и не привносит в сам стих более позднее богословское толкование.
translation_notes:
  register: Современный литературный русский с достоинством библейского плача. Божественные местоимения написаны с прописной буквы в соответствии с распространённой русской библейской традицией; параллельная структура и резкость обращения сохранены.
