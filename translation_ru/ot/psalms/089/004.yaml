  text: עַד ע֭וֹלָם אָכִ֣ין זַרְעֶ֑/ךָ וּ/בָנִ֨יתִי לְ/דֹר וָ/ד֖וֹר כִּסְאֲ/ךָ֣ סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/004.yaml
  text: I will establish your offspring forever[a], and build your throne for generation after generation[b]. Selah
translation:
  language: ru
  text: Навеки утвержу твоё потомство[a] и воздвигну твой престол на все поколения. Села[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоё семя»; еврейское слово стоит в единственном числе, но может собирательно обозначать потомков.'
    reason: lexical_alternative
  - marker: b
    text: «Села» — вероятно, музыкальное или богослужебное указание; его точное значение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт неограниченную длительность обещания в заветном контексте.
- source_word: אָכִין
  choice: утвержу
  rationale: Порода хифиль глагола כון означает «сделать прочным, утвердить»; выбор уместен для обещания о продолжении династии.
- source_word: זַרְעֶךָ
  choice: твоё потомство
  rationale: Передаёт собирательное значение еврейского существительного в единственном числе и звучит естественно в современном русском языке.
- source_word: וּבָנִיתִי
  choice: и воздвигну
  rationale: Форма получает будущее значение из поэтического параллелизма с אָכִין. «Воздвигну» сохраняет образ строительства применительно к престолу.
- source_word: לְדֹר וָדֹר
  choice: на все поколения
  rationale: Естественно передаёт непрерывность через последовательные поколения, не воспроизводя еврейскую идиому механически.
- source_word: כִּסְאֲךָ
  choice: твой престол
  rationale: Стандартное обозначение царской власти и династического правления в данном контексте.
- source_word: סֶלָה
  choice: Села
  rationale: Значение термина точно не установлено, поэтому транслитерация меньше всего навязывает толкование.
theological_decisions:
- issue: Династическое обещание в контексте царского завета
  choice: Сохранено прямое обращение «твоё потомство» и «твой престол» без добавленного истолкования.
  alternative: Прямо обозначить мессианское исполнение либо обобщить обещание до обычного продолжения рода.
  rationale: Еврейский текст говорит о царском потомстве и престоле. Перевод сохраняет историко-династический смысл и оставляет более широкое каноническое значение неявным.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической и царственно-заветной речи. Синтаксис краткий и параллельный; архаичное «семя» вынесено в примечание.
