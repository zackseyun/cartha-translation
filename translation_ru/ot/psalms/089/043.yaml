source:
  edition: WLC
  text: אַף תָּ֭שִׁיב צ֣וּר חַרְבּ֑/וֹ וְ/לֹ֥א הֲ֝קֵימֹת֗/וֹ בַּ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/043.yaml
  text: Indeed[a], you turn back the edge of his sword[b], and you have not made him stand in battle.
translation:
  language: ru
  text: Более того, Ты обратил вспять остриё его меча[a] и не дал ему устоять в битве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обратил назад остриё его меча»; возможный смысл: «затупил его меч», то есть сделал его оружие бесполезным.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не поддержал его в битве», «не дал ему выстоять в битве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Более того
  rationale: Частица усиливает и продолжает ряд обвинений в плаче; «более того» естественно передаёт одновременно добавочное и эмфатическое значение.
- source_word: תָּשִׁיב
  choice: обратил вспять
  rationale: Порода хифиль от שׁוב означает «заставить вернуться, обратить назад». Выражение сохраняет образ направленного назад оружия, не сводя его сразу к толкованию «затупил».
- source_word: צוּר
  choice: остриё
  rationale: В сочетании с «его меча» слово обозначает режущую кромку или остроту оружия, а не обычное значение «скала».
- source_word: חַרְבּוֹ
  choice: его меча
  rationale: 'Передана конструктивная связь: «остриё его меча».'
- source_word: הֲקֵימֹתוֹ
  choice: не дал ему устоять
  rationale: 'Хифиль от קום выражает причинение состояния стояния: «поставить, дать устоять, поддержать». В военном контексте эта формулировка сохраняет конкретный образ способности держаться в бою.'
- source_word: בַּמִּלְחָמָה
  choice: в битве
  rationale: Естественное русское обозначение непосредственного военного столкновения; определённость ясна из контекста.
theological_decisions:
- issue: Бог прямо представлен действующим против царя из рода Давида
  choice: 'Сохранено прямое обращение к Богу: «Ты обратил… и не дал…»'
  alternative: Ослабить указание на Божье действие безличной конструкцией
  rationale: Плач прямо приписывает военное поражение царя действию Бога. Эту богословскую напряжённость нельзя смягчать переводом.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. «Обратил вспять» сохраняет необычный еврейский образ, а сноска поясняет его возможный смысл. Прописное «Ты» уместно в прямом обращении к Богу, не добавляя в текст конфессионального толкования.
