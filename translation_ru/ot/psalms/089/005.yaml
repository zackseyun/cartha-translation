id: PSA.89.5
reference: Psalms 89:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/י֘וֹד֤וּ שָׁמַ֣יִם פִּלְאֲ/ךָ֣ יְהוָ֑ה אַף אֱ֝מֽוּנָתְ/ךָ֗ בִּ/קְהַ֥ל קְדֹשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/005.yaml
  text: The heavens will praise your wonders[a], O Yahweh—indeed, your faithfulness in the assembly of the holy ones.
translation:
  language: ru
  text: 'Небеса прославят Твои чудеса, Яхве,

    и Твою верность — в собрании святых[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святых существ»; судя по контексту, вероятнее всего, речь идёт о небесных существах.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֹודוּ
  choice: прославят
  rationale: Порода hифиль глагола ידה в данном хвалебном контексте означает «прославлять, восхвалять». Будущее время естественно передаёт значение имперфекта.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Сохраняет форму множественного числа и возвышенный поэтический регистр еврейского слова.
- source_word: פִּלְאֲךָ
  choice: Твои чудеса
  rationale: Передаёт собирательный смысл необычайных и дивных деяний Бога, не ограничивая выражение одним чудом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: אַף
  choice: и
  rationale: В этом параллельном поэтическом построении частица продолжает и усиливает первую строку; русское «и» естественно передаёт добавочное значение без излишнего истолкования.
- source_word: אֱמוּנָתְךָ
  choice: Твою верность
  rationale: Здесь אֱמוּנָה обозначает надёжность и постоянство Бога; «верность» ясно и естественно выражает этот смысл.
- source_word: בִּקְהַל
  choice: в собрании
  rationale: Сохраняет конкретный образ собравшегося сообщества, выраженный существительным קהל.
- source_word: קְדֹשִׁים
  choice: святых
  rationale: Нейтрально сохраняет широту еврейского обозначения; ближайший контекст указывает, вероятно, на небесных существ, но само слово не называет их прямо ангелами.
theological_decisions:
- issue: Кого обозначает קְדֹשִׁים («святые»)
  choice: Сохранено общее обозначение «святых», с пояснением вероятного небесного референта в сноске.
  alternative: «ангелов» или «святых людей»
  rationale: Контекст небесного совета в Псалме 89 делает небесных существ наиболее вероятным референтом, однако еврейское слово само по себе не требует более узкого определения; перевод не устраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм оригинала сохранён делением на две строки; тире помогает ясно связать обстоятельство «в собрании святых» со второй частью стиха.
