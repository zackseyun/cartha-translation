lexical_decisions:
- source_word: דִכִּאתָ
  choice: сокрушил
  rationale: Глагол обозначает сильное разрушительное действие; «сокрушил» естественно передаёт образ решительной победы.
- source_word: כֶחָלָל
  choice: словно сражённого
  rationale: Предлог כְּ выражает сравнение, а חָלָל обычно означает пронзённого или убитого в бою. Формулировка сохраняет сравнение и воинский образ.
- source_word: רָהַב
  choice: Раава
  rationale: Транслитерация сохраняет поэтическое имя и не разрешает преждевременно его возможную отсылку к Египту либо олицетворённой силе хаоса.
- source_word: בִּזְרוֹעַ עֻזְּךָ
  choice: могучей рукой
  rationale: Естественное русское инструментальное выражение, сохраняющее антропоморфный образ Божьей силы; «рукой» здесь литературно естественнее буквального «мышцей».
- source_word: פִּזַּרְתָּ
  choice: рассеял
  rationale: Прямо передаёт значение разбрасывания или рассеивания, не добавляя более узкого значения военного разгрома.
- source_word: אוֹיְבֶיךָ
  choice: Своих врагов
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносит врагов с подлежащим «Ты».
theological_decisions:
- issue: Кого или что обозначает רָהַב в поэтическом контексте
  choice: Сохранить в основном тексте имя «Раав» как обозначение побеждённого космического или политического противника.
  alternative: Перевести как «Египет» либо истолковать как мифическое чудовище или силу хаоса.
  rationale: Имя может поэтически обозначать Египет и одновременно вызывать образ укрощённого хаоса. Транслитерация сохраняет намеренную многозначность и богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с возвышенной поэтической окраской. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской библейской традиции; синтаксис остаётся ясным для обычного читателя.
