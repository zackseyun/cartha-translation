  text: פָּרַ֥צְתָּ כָל גְּדֵרֹתָ֑י/ו שַׂ֖מְתָּ מִבְצָרָ֣י/ו מְחִתָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/040.yaml
  text: You have broken down all his walls[c][b][a]; you have made his strongholds a ruin.
translation:
  language: ru
  text: Ты проломил все его ограды[a], его крепости[b] превратил в развалины[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все его стены», «все его изгороди» или «все его заграждения». Еврейское слово широко обозначает различные ограждающие и защитные сооружения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его укрепления» или «его оплоты».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «обрёк на разрушение»; возможны также значения «ужас» или «смятение». В данном контексте вероятнее речь о разрушении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרַצְתָּ
  choice: проломил
  rationale: Глагол פרץ обозначает прорыв или образование бреши. «Проломил» естественно сочетается с оградами и сохраняет образ насильственного разрушения защиты.
- source_word: כָל
  choice: все
  rationale: Передаёт полноту разрушения без ослабления смысла.
- source_word: גְּדֵרֹתָיו
  choice: его ограды
  rationale: גְּדֵרָה может означать стену, ограду, изгородь или иное заграждение. «Ограды» сохраняет широту значения и в параллели с крепостями воспринимается как защитное сооружение.
- source_word: שַׂמְתָּ
  choice: превратил
  rationale: В сочетании с обозначением итогового состояния широкий по значению глагол שׂים естественно передаётся по-русски как «превратил».
- source_word: מִבְצָרָיו
  choice: его крепости
  rationale: מִבְצָר обозначает укреплённое место или оплот. «Крепости» ясно и поэтично передаёт оборонительный смысл.
- source_word: מְחִתָּה
  choice: в развалины
  rationale: В контексте разрушенных оборонительных сооружений слово указывает прежде всего на разгром и состояние разрушенности. Множественное «развалины» является естественным русским дополнением при множественном «крепости», не устраняя отмечаемые словарями альтернативные оттенки.
theological_decisions:
- issue: Референт местоименных суффиксов третьего лица мужского рода единственного числа в плаче о Давидовом помазаннике
  choice: Сохранить местоимение «его», не уточняя референта в основном тексте.
  alternative: Передать явно как «ограды царя» либо истолковать укрепления как принадлежащие Сиону или Иерусалиму.
  rationale: Еврейский текст использует местоименные суффиксы мужского рода единственного числа, а ближайший контекст говорит о падении Давидова помазанника. Неуточнённое «его» сохраняет поэтическую и богословскую напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим строем. Параллелизм двух полустиший сохранён; местоимение «Ты» написано с прописной буквы в соответствии с принятым благоговейным библейским регистром.
