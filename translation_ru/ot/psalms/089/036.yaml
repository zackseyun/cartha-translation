  text: זַ֭רְע/וֹ לְ/עוֹלָ֣ם יִהְיֶ֑ה וְ/כִסְא֖/וֹ כַ/שֶּׁ֣מֶשׁ נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/036.yaml
  text: His offspring will endure forever[c][b][a], and his throne will be like the sun before me.
translation:
  language: ru
  text: Потомство его пребудет вовеки[a], и престол его будет как солнце предо Мной[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «Семя его будет вовеки». Еврейское слово имеет собирательное значение и может обозначать потомство.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в Моём присутствии». Буквально: «предо Мной».'
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте во второй части стиха нет выраженного глагола: «и престол его — как солнце предо Мной». Слово «будет» восполнено по смыслу.'
    reason: source_structure
lexical_decisions:
- source_word: זַרְעוֹ
  choice: потомство его
  rationale: Зֶרַע может означать буквальное «семя» или собирательно — потомство. В контексте царского завета речь идёт о династической линии; «потомство» естественно передаёт собирательное значение, не сводя его к одному потомку.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Здесь עוֹלָם выражает непрекращающуюся длительность заветного обещания. «Вовеки» сохраняет поэтическую торжественность и остаётся понятным современному читателю.
- source_word: יִהְיֶה
  choice: пребудет
  rationale: Буквально глагол означает «будет», однако сочетание «потомство его будет вовеки» по-русски звучит менее естественно. «Пребудет» передаёт продолжительное существование, подразумеваемое контекстом.
- source_word: וְכִסְאוֹ
  choice: и престол его
  rationale: כִּסֵּא буквально означает «престол» и метонимически указывает на царскую власть. Конкретный поэтический образ сохранён.
- source_word: כַשֶּׁמֶשׁ
  choice: как солнце
  rationale: Префикс כְּ выражает сравнение; прямой образ солнца сохранён без истолкования.
- source_word: נֶגְדִּי
  choice: предо Мной
  rationale: נֶגֶד с суффиксом первого лица означает «передо мной, в моём присутствии». «Предо Мной» сохраняет прямую речь Бога и торжественный поэтический регистр.
theological_decisions:
- issue: К кому относится первое лицо в נֶגְדִּי
  choice: 'Сохранена прямая речь Бога: «предо Мной»'
  alternative: «в Моём присутствии»
  rationale: В данном разделе псалма Господь говорит о Давиде и его потомстве. Первое лицо сохранено явно, без поясняющего богословского перефразирования.
- issue: Смысл обещания о потомстве
  choice: Собирательное «потомство»
  alternative: «семя» или «потомки»
  rationale: Форма допускает собирательный смысл и в контексте относится к царской линии. Перевод не ограничивает обещание одним лицом и не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой окраской. Формы «пребудет», «вовеки» и «предо Мной» создают достойный поэтический регистр, оставаясь понятными обычному современному читателю. Заглавная буква в «Мной» обозначает Бога как говорящего.
