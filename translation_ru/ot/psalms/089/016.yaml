  text: בְּ֭/שִׁמְ/ךָ יְגִיל֣וּ/ן כָּל הַ/יּ֑וֹם וּ/בְ/צִדְקָתְ/ךָ֥ יָרֽוּמוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/016.yaml
  text: In your name they rejoice all day long[a], and in your righteousness they are exalted.
translation:
  language: ru
  text: 'Твоим именем они ликуют весь день,

    и Твоей праведностью возвышаются.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и Твоей справедливостью возвышаются».'
    reason: Лексема צדקה может означать «праведность» или «справедливость»; «возвышаются» сохраняет непереходную форму еврейского глагола רום.
lexical_decisions:
- source_word: בְּשִׁמְךָ
  choice: Твоим именем
  rationale: Творительный падеж естественно передаёт ב как основание или средство ликования; «имя» обозначает открытый людям Божий характер и славу, а не только наименование.
- source_word: יְגִילוּן
  choice: ликуют
  rationale: Глагол גיל выражает сильную, торжествующую радость; «ликуют» точно и естественно передаёт эту интенсивность.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Современное идиоматическое выражение, сохраняющее значение продолжающегося на протяжении дня ликования.
- source_word: וּבְצִדְקָתְךָ
  choice: и Твоей праведностью
  rationale: צדקה охватывает праведность и справедливое действие. «Праведность» сохраняет широту понятия, а творительный падеж передаёт Божью праведность как основание возвышения.
- source_word: יָרוּמוּ
  choice: возвышаются
  rationale: Форма от רום означает «становиться высоким, возвышаться». Возвратная форма сохраняет непереходность еврейского глагола и не вводит прямо названного деятеля, хотя контекст связывает возвышение с Богом.
theological_decisions:
- issue: Значение Божьей צדקה в контексте хвалы
  choice: праведность
  alternative: правосудие; справедливость
  rationale: В контексте псалма слово указывает и на нравственную правоту Бога, и на Его верные, справедливые действия. «Праведность» лучше сохраняет этот широкий смысл; возможность судебного оттенка отмечена в сноске.
- issue: Кто производит возвышение
  choice: возвышаются
  alternative: вознесены; Ты возвышаешь их
  rationale: Еврейский текст употребляет непереходную форму и не называет деятеля прямо. Перевод не превращает её в явную пассивную или каузативную конструкцию, но сохраняет связь возвышения с Божьей праведностью.
translation_notes:
  register: Современный литературный русский язык с поэтической торжественностью. Инверсия во второй строке сохраняет параллелизм и не затрудняет понимание; местоимения, относящиеся к Богу, написаны с прописной буквы.
