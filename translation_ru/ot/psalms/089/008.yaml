  yaml_path: translation/ot/psalms/089/008.yaml
  text: O Yahweh[a], God of hosts, who is mighty like you, O Yah? Your faithfulness surrounds you.
translation:
  language: ru
  text: 'Яхве, Бог воинств,

    кто подобен Тебе, о могучий Ях[a]?

    И верность Твоя — вокруг Тебя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ях» — краткая форма имени «Яхве»; во многих переводах здесь стоит «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, не заменяя его титулом «Господь».
- source_word: אֱלֹהֵי צְבָאוֹת
  choice: Бог воинств
  rationale: Сохраняет широкий образ множества войск или небесных сил, не уточняя без основания, о каких именно воинствах идёт речь.
- source_word: מִי כָמוֹךָ
  choice: кто подобен Тебе
  rationale: Естественно передаёт риторический вопрос о несравненности Бога и сохраняет поэтическую прямоту оригинала.
- source_word: חֲסִין
  choice: могучий
  rationale: Передаёт значение силы и мощи и естественно выступает определением при краткой форме Божьего имени.
- source_word: יָהּ
  choice: Ях
  rationale: Сохраняет краткую форму Божьего имени и её отличие от יְהוָה в начале стиха.
- source_word: וֶאֱמוּנָתְךָ
  choice: Верность Твоя
  rationale: אֱמוּנָה здесь обозначает надёжность и неизменную верность Бога; союз естественно передан переходом к следующей строке.
- source_word: סְבִיבוֹתֶיךָ
  choice: окружает Тебя
  rationale: 'Идиоматично выражает пространственный образ: верность пребывает вокруг Бога со всех сторон.'
theological_decisions:
- issue: Различение יְהוָה и краткой формы יָהּ в одном стихе
  choice: Передать как «Яхве» и «Ях» соответственно
  alternative: Передать обе формы как «Господь» или обе как «Яхве»
  rationale: Так сохраняется намеренное различие двух форм Божьего имени в еврейском тексте без подмены имени титулом.
- issue: Синтаксическая связь חֲסִין יָהּ
  choice: «могучий Ях» как обращение, продолжающее риторический вопрос
  alternative: 'Понимать חֲסִין как сказуемое: «кто могуч, как Ты, Ях?»'
  rationale: Отсутствие сравнительной части после חֲסִין и непосредственное соседство с יָהּ поддерживают чтение прилагательного как определения при обращении; пунктуация не устраняет риторического смысла несравненности.
translation_notes:
  register: Современный литературный русский с краткими поэтическими строками и умеренно возвышенной библейской лексикой. Местоимения, обращённые к Богу, написаны с прописной буквы. Слово «воинств» сохраняет достоинство и широту исходного образа, хотя имеет традиционную окраску.
