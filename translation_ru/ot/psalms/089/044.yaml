  text: You have brought his splendor to an end and cast his throne to the ground[a][b].
translation:
  language: ru
  text: Ты лишил его блеска[a] и поверг его престол на землю[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты положил конец его сиянию (чистоте)». Еврейское слово может означать чистоту, яркость или блеск; здесь царский контекст делает значение «блеск» наиболее вероятным.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «к земле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּתָּ
  choice: Ты лишил
  rationale: Каузативная форма глагола שׁבת означает «прекратить, положить конец». В сочетании с дополнением «его блеска» русское «лишил» естественно передаёт прекращение царственного сияния, не утяжеляя поэтическую строку.
- source_word: מִטְּהָרוֹ
  choice: его блеска
  rationale: טֹהַר может обозначать чистоту, яркость или сияющий блеск. В контексте унижения царя «блеск» естественно указывает на утраченное царственное величие; неоднозначность отражена в сноске.
- source_word: וְכִסְאוֹ
  choice: и его престол
  rationale: כִּסֵּא прямо означает «престол»; союз и местоименный суффикс сохранены.
- source_word: לָאָרֶץ
  choice: на землю
  rationale: אֶרֶץ здесь обозначает землю как низ, куда повергают престол. «На землю» — естественное русское соответствие, сохраняющее образ унижения.
- source_word: מִגַּרְתָּה
  choice: поверг
  rationale: Глагол выражает низвержение или бросок вниз. «Поверг» уместен в возвышенной поэтической речи и ясно передаёт низвержение престола.
theological_decisions:
- issue: К кому относятся местоименные суффиксы третьего лица
  choice: Передано местоимением «его» без уточнения лица.
  alternative: Прямо назвать царя из рода Давида или помазанника завета.
  rationale: В еврейской строке стоит лишь местоименный суффикс, а подразумеваемый царственный референт определяется контекстом. Неуточнённое «его» сохраняет поэтическое течение и не снимает намеренно оставленную имплицитность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим тоном. Краткая параллельная конструкция сохраняет силу обвинительного обращения к Богу; местоимение «его» не получает добавленного толкования.
