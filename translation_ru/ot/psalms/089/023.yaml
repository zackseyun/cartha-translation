  text: И Я сокрушу перед ним[a] его противников и поражу[b] тех, кто ненавидит его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, букв.: «от его лица»; еврейский оборот может выражать устранение врагов из его присутствия.'
