lexical_decisions:
- source_word: וְכַתּוֹתִי
  choice: И Я сокрушу
  rationale: Глагол כתת передаёт решительное, силовое сокрушение. Будущее время соответствует последовательности Божьих обещаний в данном контексте.
- source_word: מִפָּנָיו
  choice: перед ним
  rationale: Еврейское выражение буквально означает «от его лица / из его присутствия» и здесь изображает устранение противников, стоящих перед царём. В основном тексте сохранён естественный русский оборот, а более буквальный пространственный оттенок отмечен в сноске.
- source_word: צָרָיו
  choice: его противников
  rationale: Слово обозначает тех, кто активно враждует и теснит. «Противников» сохраняет отличие от параллельного выражения «тех, кто ненавидит его».
- source_word: וּמְשַׂנְאָיו
  choice: тех, кто ненавидит его
  rationale: Причастная форма выражает постоянную или характерную ненависть; придаточная конструкция звучит естественно в современном русском языке и сохраняет глагольную силу оригинала.
- source_word: אֶגּוֹף
  choice: поражу
  rationale: Глагол נגף может означать нанесение сильного удара, поражение в битве или кару. «Поражу» сохраняет широту значения и решительный характер действия, не ограничивая его конкретным способом.
theological_decisions:
- issue: Образ Бога-воителя в заветном обещании царю из дома Давида
  choice: 'Сохранить прямое и сильное описание Божьего действия: «сокрушу» и «поражу».'
  alternative: 'Передать обобщённо: «побежу» или «одолеть не позволю».'
  rationale: Оба еврейских глагола выражают активное и решительное поражение врагов Богом. Смягчение до общей защиты ослабило бы царскую и воинскую образность текста.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической царской речи. Параллелизм сохранён; лексика сильная, но не архаичная. Заглавная буква в местоимении «Я» подчёркивает речь Бога в соответствии с принятой русской библейской издательской практикой.
