  text: Доколе, Яхве, Ты будешь скрываться? Вечно ли? Будет ли Твой гнев пылать, как огонь?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד מָה
  choice: Доколе
  rationale: Устойчивая формула плача, выражающая мучительный вопрос о продолжительности бедствия. «Доколе» естественно для поэтической молитвы и сохраняет её настойчивый тон.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога сохраняет прямое обращение еврейского текста.
- source_word: תִּסָּתֵר
  choice: будешь скрываться
  rationale: Нифаль от סתר в данном контексте передаёт представление о Боге, который скрывает Себя или остаётся сокрытым от молящегося. Возвратная форма по-русски звучит естественно и не снимает напряжения плача.
- source_word: לָנֶצַח
  choice: вечно
  rationale: Наречие ясно передаёт идею неопределённо долгой, кажущейся бесконечной продолжительности.
- source_word: תִּבְעַר
  choice: будет пылать
  rationale: Глагол означает «гореть, пылать»; «пылать» сохраняет образ интенсивного огня и естественно сочетается со словом «гнев».
- source_word: כְּמוֹ אֵשׁ
  choice: как огонь
  rationale: Прямая и естественная передача сравнения, без добавочного толкования.
- source_word: חֲמָתֶךָ
  choice: Твой гнев
  rationale: Существительное обозначает жар, ярость или гнев. «Гнев» сохраняет возвышенный регистр псалма и остаётся понятным современному читателю.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте звучит личное имя Бога, а не титул. «Яхве» передаёт тетраграмматон непосредственно; традиционный вариант указан в сноске.
- issue: Риторический характер вопросов
  choice: Неужели Ты будешь…? Неужели Твой гнев будет…?
  alternative: Будешь ли Ты…? Будет ли Твой гнев…?
  rationale: «Неужели» естественно передаёт скорбь и напряжённое недоумение плача, не превращая вопрос в утверждение и не устраняя его богословскую остроту.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. «Доколе» уместно как понятная библейско-поэтическая формула; обращения к Богу оформлены с прописной буквы по принятой русской традиции.
