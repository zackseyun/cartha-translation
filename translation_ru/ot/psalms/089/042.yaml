  text: הֲ֭רִימוֹתָ יְמִ֣ין צָרָ֑י/ו הִ֝שְׂמַ֗חְתָּ כָּל אוֹיְבָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/042.yaml
  text: You have exalted the right hand of his foes[a]; you have made all his enemies rejoice.
translation:
  language: ru
  text: Ты возвысил правую руку его противников; Ты обрадовал всех его врагов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲרִימוֹתָ
  choice: возвысил
  rationale: Порода хифиль, перфект, 2-е лицо мужского рода единственного числа от רום означает «поднять, возвысить». В сочетании с «правой рукой» слово передаёт дарование силы или превосходства, сохраняя при этом образ оригинала.
- source_word: יְמִין
  choice: правую руку
  rationale: Существительное обозначает правую руку и нередко служит образом силы и могущества. Буквальный образ естественен и понятен по-русски.
- source_word: צָרָיו
  choice: его противников
  rationale: צָר обозначает враждебного противника. «Противников» сохраняет смысл и позволяет передать второе близкое по значению еврейское слово иначе — как «врагов».
- source_word: הִשְׂמַחְתָּ
  choice: обрадовал
  rationale: 'Хифиль от שׂמח имеет каузативное значение: Бог сделал так, что враги возрадовались. «Обрадовал» кратко и естественно передаёт эту причинность.'
- source_word: כָּל
  choice: всех
  rationale: Перед множественным числом естественно передаётся русским «всех».
- source_word: אוֹיְבָיו
  choice: его врагов
  rationale: Обычное обозначение врагов прямо передано словом «врагов»; отличие от צָרָיו отражено без преувеличения смысловой разницы.
theological_decisions:
- issue: К кому относятся суффиксы 3-го лица мужского рода единственного числа
  choice: Переданы местоимением «его», относящимся в ближайшем контексте к Давидову царю, помазаннику.
  alternative: Сформулировать более обобщённо, не обозначая референта местоимением.
  rationale: Еврейская грамматика прямо содержит суффиксы «его», а контекст псалма говорит о кажущемся отвержении Давидова помазанника. Перевод сохраняет грамматическую отсылку и богословское напряжение, не уточняя её сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранён древнееврейский образ «правой руки»; близкие синонимы צָרָיו и אוֹיְבָיו разведены как «противники» и «враги». Заглавное «Ты» отражает принятое в русском библейском стиле обращение к Богу.
