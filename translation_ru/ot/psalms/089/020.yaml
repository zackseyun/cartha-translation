source:
  edition: WLC
  text: מָ֭צָאתִי דָּוִ֣ד עַבְדִּ֑/י בְּ/שֶׁ֖מֶן קָדְשִׁ֣/י מְשַׁחְתִּֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/020.yaml
  text: I have found David my servant[a]; with my holy oil I have anointed him.
translation:
  language: ru
  text: Я обрёл Давида, слугу Моего[a]; святым елеем Моим Я помазал его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я нашёл Давида, слугу Моего; святым елеем Моим Я помазал его».'
    reason: Еврейский перфект допускает простое указание на совершившееся в прошлом действие; глагол מצא можно передать как «нашёл» или, с учётом контекста избрания, как «обрёл».
lexical_decisions:
- source_word: מָצָאתִי
  choice: Я обрёл
  rationale: Qal perfect, 1-е лицо ед. числа, от מצא. В поэтической речи Бога обозначает совершившееся действие; «обрёл» естественно передаёт также значимость сделанного выбора, не добавляя отсутствующего в тексте глагола «избрал».
- source_word: דָּוִד
  choice: Давида
  rationale: Общепринятая русская форма личного имени, поставленная в винительном падеже по синтаксису предложения.
- source_word: עַבְדִּי
  choice: слугу Моего
  rationale: עבד может означать раба или слугу. Здесь это почётное обозначение Давида как царя, служащего Богу, поэтому «слуга» уместнее, чем «раб»; порядок слов поддерживает возвышенный поэтический регистр.
- source_word: בְּשֶׁמֶן
  choice: елеем
  rationale: Предлог ב при משח обозначает средство помазания. «Елей» — понятное в библейском контексте название оливкового масла, употребляемого для священного помазания.
- source_word: קָדְשִׁי
  choice: святым ... Моим
  rationale: Форма с суффиксом первого лица буквально означает «Моей святости», то есть «Моим святым». Русское согласованное определение точно и естественно передаёт культовую отделённость елея.
- source_word: מְשַׁחְתִּיו
  choice: Я помазал его
  rationale: Qal perfect, 1-е лицо ед. числа, с местоименным суффиксом 3-го лица муж. рода. Русское совершенное прошедшее естественно передаёт завершённое помазание Давида.
theological_decisions:
- issue: Царское помазание и возможный мессианский смысл
  choice: Сохранена прямая историческая отсылка к Давиду без добавления титула «Мессия» или «Помазанник».
  alternative: Истолковательно подчеркнуть мессианскую типологию.
  rationale: Еврейский текст прямо называет Давида и сообщает о его помазании. Возможное типологическое значение не следует вносить в сам перевод.
- issue: Значение עַבְדִּי
  choice: слугу Моего
  alternative: раба Моего
  rationale: Оба значения лексически возможны, но в данном царско-заветном контексте слово выступает как почётное обозначение служения Богу, а не как акцент на несвободном положении.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. «Елей» сохранён как устоявшийся и понятный библейский термин; инверсия «слугу Моего» и «елеем Моим» поддерживает достоинство божественной речи без чрезмерной архаизации.
