source:
  edition: WLC
  text: מִ֤י גֶ֣בֶר יִֽ֭חְיֶה וְ/לֹ֣א יִרְאֶה מָּ֑וֶת יְמַלֵּ֨ט נַפְשׁ֖/וֹ מִ/יַּד שְׁא֣וֹל סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/048.yaml
  text: What man can live and not see death? Can he deliver his soul from the hand of Sheol? Selah[a][b][c]
translation:
  language: ru
  text: Кто из людей проживёт и не увидит смерти?[a] Кто избавит свою душу[b] от руки шеола?[c] Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не испытает смерти». Буквально: «не увидит смерти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «свою жизнь»; или: «самого себя».'
    reason: lexical_alternative
  - marker: c
    text: 'Шеол — древнееврейское название мира мёртвых; возможный перевод: «могила».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי גֶבֶר
  choice: Кто из людей
  rationale: Риторический вопрос относится к человеку как представителю смертного рода. Оборот «кто из людей» естественен в современном русском и сохраняет значение маскулинного существительного גֶבֶר, не ограничивая смысл одним конкретным мужчиной.
- source_word: יִחְיֶה
  choice: проживёт
  rationale: 'Имперфект в риторическом вопросе выражает возможность: найдётся ли человек, который проживёт жизнь, не встретившись со смертью. Русское будущее время естественно передаёт эту обобщённую перспективу.'
- source_word: וְלֹא יִרְאֶה מָוֶת
  choice: и не увидит смерти
  rationale: Сохранён буквальный поэтический образ «увидеть смерть»; значение «испытать смерть» указано в сноске.
- source_word: יְמַלֵּט
  choice: Кто избавит
  rationale: Порода пиэль обозначает избавление, спасение от власти или захвата. Вторая вопросительная фраза естественно передана самостоятельным риторическим вопросом.
- source_word: נַפְשׁוֹ
  choice: свою душу
  rationale: נפש может обозначать душу, жизнь или самого человека. «Душу» сохраняет поэтическую и богословскую многозначность, а альтернативы вынесены в сноску.
- source_word: מִיַּד
  choice: от руки
  rationale: Сохранена еврейская метафора руки как власти или хватки; в русском поэтическом контексте она понятна.
- source_word: שְׁאוֹל
  choice: шеола
  rationale: Транслитерация не сводит древнееврейское понятие ни к могиле, ни к аду в позднейшем догматическом смысле. Строчная буква соответствует употреблению как названия мира мёртвых, а пояснение дано в сноске.
- source_word: סֶלָה
  choice: Села
  rationale: Традиционная транслитерация сохранена, поскольку точное значение литургического или музыкального термина неизвестно.
theological_decisions:
- issue: Значение שְׁאוֹל в поэтическом контексте
  choice: Сохранить термин «шеол»
  alternative: «могила» или «мир мёртвых»
  rationale: Транслитерация сохраняет древнееврейскую категорию и не привносит более позднего представления об аде; возможные смысловые эквиваленты пояснены в сноске.
- issue: Объём значения נֶפֶשׁ
  choice: «душу» с пояснением
  alternative: «жизнь» или «самого себя»
  rationale: Контекст смерти и шеола допускает все эти оттенки. Основной текст сохраняет традиционный поэтический образ, не утверждая узкое антропологическое понимание души.
- issue: Репрезентативный характер גֶבֶר
  choice: «кто из людей»
  alternative: «какой мужчина» или «кто из смертных»
  rationale: Существительное имеет мужской род и может указывать на мужчину, однако риторический смысл охватывает человеческую смертность вообще. Выбранный русский оборот передаёт этот общий смысл без ненужного сужения.
translation_notes:
  register: Современный литературный русский язык с достоинством еврейской поэзии. Синтаксический параллелизм двух риторических вопросов сохранён; буквальные образы «увидеть смерть» и «рука шеола» оставлены в основном тексте. Все сносочные маркеры стоят непосредственно при соответствующих выражениях.
