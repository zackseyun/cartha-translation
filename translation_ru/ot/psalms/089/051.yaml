    reason: alternative_reading
lexical_decisions:
- source_word: חֵרְפוּ
  choice: поносили
  rationale: Глагол חרף выражает презрительное, оскорбительное поношение. «Поносили» сохраняет сильную враждебную окраску и естественно сочетается с контекстом поношения в предыдущем стихе.
- source_word: אוֹיְבֶיךָ
  choice: Твои враги
  rationale: Прямая передача существительного с суффиксом второго лица мужского рода единственного числа.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֲשֶׁר
  choice: которым
  rationale: Относительное местоимение связывает стих с упомянутым ранее поношением; творительный падеж естественно выражает эту связь по-русски.
- source_word: עִקְּבוֹת
  choice: шаги
  rationale: Слово может обозначать пятки, следы или шаги. «Шаги» сохраняет телесно-пространственный образ и допускает смысл движений или приближения помазанника, не уточняя метафору сверх текста.
- source_word: מְשִׁיחֶךָ
  choice: Твоего помазанника
  rationale: В ближайшем контексте речь идёт о помазанном царе из рода Давида. Описательное «помазанник» сохраняет исходное значение, не превращая слово безусловно в позднейший титул.
theological_decisions:
- issue: Передача מְשִׁיחֶךָ в царском псалме с мессианским звучанием
  choice: Твоего помазанника
  alternative: Твоего Мессии
  rationale: Контекст непосредственно указывает на царя-помазанника из рода Давида, но то же еврейское слово несёт мессианский потенциал. Основной текст не устраняет эту напряжённость, а титульное прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Повтор «которым… которым» сохранён как заметная черта еврейского текста; местоимение «они» во второй части добавлено ради ясного и естественного русского синтаксиса.
