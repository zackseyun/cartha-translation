base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/018.yaml
  text: For our shield belongs to Yahweh[a], and our king to the Holy One of Israel.
translation:
  language: ru
  text: 'Ведь Господу принадлежит наш щит,

    и Святому Израиля — наш царь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-обосновывающую связь с предшествующим контекстом естественнее для современного русского стиха, не усиливая её до «воистину» или «несомненно».
- source_word: לַיהוָה
  choice: Господу принадлежит
  rationale: Предлог ל здесь выражает принадлежность или отношение. Добавленный по-русски глагол раскрывает эллиптическую конструкцию, а имя יהוה передано принятой библейской формой «Господь».
- source_word: מָגִנֵּנוּ
  choice: наш щит
  rationale: Сохранён буквальный и прозрачный поэтический образ щита, который может обозначать защитника, не сводя метафору к одному толкованию.
- source_word: וְלִקְדוֹשׁ יִשְׂרָאֵל
  choice: и Святому Израилеву
  rationale: Сохранены параллельная конструкция принадлежности и устойчивый торжественный титул Бога. Пропуск повторного глагола естественен в русском и отражает лаконичный параллелизм оригинала.
- source_word: מַלְכֵּנוּ
  choice: наш царь
  rationale: Прямое значение существительного сохраняет царскую образность и допускает вероятную отсылку к земному царю Израиля, не закрепляя её в самом переводе.
theological_decisions:
- issue: К кому относятся выражения «наш щит» и «наш царь»
  choice: 'Перевод сохраняет две параллельные конструкции принадлежности: «Господу принадлежит наш щит» и «Святому Израилеву — наш царь».'
  alternative: Понять «наш щит» как прямое наименование Бога, а «наш царь» — как земного царя; либо считать и щит, и царя обозначениями царского представителя Израиля.
  rationale: В обеих частях еврейского стиха употреблён параллельный предлог ל. Формулировка с «принадлежит» передаёт эту структуру и не устраняет намеренно сохраняемую поэтическую и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным псалмовым звучанием. Инверсия «Святому Израилеву — наш царь» сохраняет параллелизм и поэтическую компактность оригинала; архаические грамматические формы вне традиционного титула не используются.
