  text: חַֽסְדֵ֣י יְ֭הוָה עוֹלָ֣ם אָשִׁ֑ירָה לְ/דֹ֥ר וָ/דֹ֓ר אוֹדִ֖יעַ אֱמוּנָתְ/ךָ֣ בְּ/פִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/001.yaml
  text: I will sing of the steadfast love of Yahweh forever[a]; from generation to generation I will make your faithfulness known with my mouth.
translation:
  language: ru
  text: О милостях[a] Яхве буду петь вовеки; из поколения в поколение устами моими буду возвещать верность Твою.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о проявлениях неизменной любви». Еврейское слово חַסְדֵי может обозначать милости Яхве — многократные проявления Его верной, заветной любви.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדֵי
  choice: о милостях
  rationale: Форма множественного числа указывает на многократные проявления חֶסֶד — верной, заветной любви и милости. Русское «о милостях» сохраняет множественность и естественно звучит в поэтическом контексте; смысловой объём пояснён в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление имени Бога в еврейском тексте, не заменяя его титулом.
- source_word: עוֹלָם
  choice: вовеки
  rationale: Наречное употребление обозначает неограниченную длительность пения. «Вовеки» — краткая, понятная и уместная для поэзии современная литературная форма.
- source_word: אָשִׁירָה
  choice: буду петь
  rationale: Когортатив выражает намерение или решимость говорящего; будущее время естественно передаёт эту направленность.
- source_word: לְדֹר וָדֹר
  choice: из поколения в поколение
  rationale: Русский идиоматический оборот передаёт непрерывность свидетельства среди сменяющих друг друга поколений.
- source_word: אוֹדִיעַ
  choice: буду возвещать
  rationale: Hiphil от ידע означает «давать знать, делать известным». «Возвещать» естественно сочетается с публичным устным провозглашением и сохраняет возвышенный поэтический регистр.
- source_word: אֱמוּנָתְךָ
  choice: верность Твою
  rationale: Здесь אֱמוּנָה обозначает надёжность и постоянство Бога; «верность» точно передаёт это значение и соответствует параллелизму с חסד.
- source_word: בְּפִי
  choice: устами моими
  rationale: Сохраняется конкретный образ устного провозглашения. Такой порядок слов естествен для русской библейской поэзии и не затрудняет понимание.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» сохраняет его как имя и не подменяет титулом; «Иегова» менее точно отражает принятую научную реконструкцию произношения.
- issue: Смысл חַסְדֵי во множественном числе
  choice: милости как многократные проявления верной любви
  alternative: неизменная любовь; дела заветной любви
  rationale: Множественное число допускает акцент на повторяющихся деяниях милости, тогда как само слово включает оттенки любви, благости и заветной верности. Основной текст сохраняет множественность, а сноска — смысловую широту.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «верность Твою» и выражение «устами моими» поддерживают ритм и достоинство псалма, оставаясь понятными обычному читателю.
