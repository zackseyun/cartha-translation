lexical_decisions:
- source_word: אֵל
  choice: Бог
  rationale: В данном поэтическом контексте слово обозначает Бога Израиля; «Бог» — естественный и точный русский эквивалент.
- source_word: נַעֲרָץ ... רַבָּה
  choice: внушает великий трепет
  rationale: Страдательное причастие с усилительным наречием выражает благоговейный страх и преклонение. Такая передача естественна по-русски и не приписывает Богу нравственной жестокости.
- source_word: בְּסוֹד
  choice: в совете
  rationale: סוֹד может обозначать близкий круг советников или совещательное собрание; в контексте небесных существ «совет» лучше сохраняет этот образ.
- source_word: קְדֹשִׁים
  choice: святых
  rationale: Форма допускает буквальную передачу «святых», не уточняя прямо их природу; контекст, вероятнее всего, указывает на небесных существ.
- source_word: וְנוֹרָא
  choice: Он грозен
  rationale: Слово выражает внушающий страх и благоговение характер Бога. «Грозен» сохраняет возвышенный поэтический регистр и параллель с первым полустишием.
- source_word: עַל כָּל סְבִיבָיו
  choice: для всех, кто вокруг Него
  rationale: Предлог עַל здесь допускает оттенок направленности или превосходства. Формулировка передаёт, что окружающие Бога испытывают перед Ним трепет, не усиливая сравнительное значение сверх необходимого.
theological_decisions:
- issue: Кого обозначают «святые» и окружающие Бога
  choice: В основном тексте сохранено общее обозначение «святые»; в примечании указано, что, вероятнее всего, это небесные существа.
  alternative: Люди-святые или смешанное собрание поклоняющихся.
  rationale: Ближайший контекст псалма говорит о небесах и собрании небесных существ, однако сама еврейская лексема не называет их природу прямо, поэтому уточнение вынесено в примечание.
- issue: Значение עַל во втором полустишии
  choice: «для всех, кто вокруг Него»
  alternative: «превыше всех, кто вокруг Него» / «страшнее всех окружающих Его»
  rationale: Еврейская конструкция может выражать отношение к окружающим Бога либо сравнительное превосходство над ними. Выбранная формулировка естественна и сохраняет основной смысл благоговейного страха, а возможный сравнительный оттенок отмечен в примечании.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим тоном. Синтаксис сделан ясным и естественным; сохранены параллелизм стиха и неоднозначность обозначения «святые».
