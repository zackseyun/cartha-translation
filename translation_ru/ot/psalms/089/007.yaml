  text: God is greatly feared in the council of the holy ones[b][a], and awesome above all who surround him.
translation:
  language: ru
  text: Бог внушает великий трепет в совете святых[a][b] и страшнее всех, кто окружает Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в собрании»; еврейское слово может обозначать близкий круг советников или совещательное собрание.'
