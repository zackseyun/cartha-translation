    text: 'Буквально: «не поступлю ложно в Моей верности»; возможно также: «не окажусь неверным Моей верности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַסְדִּי
  choice: преданной любви Моей
  rationale: חֶסֶד обозначает деятельную, прочную и верную любовь, особенно в отношениях завета. «Преданная любовь» передаёт и личную теплоту, и постоянство, не сводя смысл лишь к состраданию.
- source_word: אָפִיר
  choice: не отниму
  rationale: Порода hифиль глагола פור здесь выражает удаление или лишение чего-либо. В сочетании с מֵעִמּוֹ естественно переводится как «не отниму у него».
- source_word: מֵעִמּוֹ
  choice: у него
  rationale: Сочетание предлога отделения с עִם и местоименным суффиксом указывает на удаление от названного лица; в русском обороте с «отниму» нормативно и естественно «у него».
- source_word: אֲשַׁקֵּר
  choice: не изменю
  rationale: Пиэль שׁקר означает поступить ложно, оказаться неверным или обмануть. В связи с אֱמוּנָה русский глагол «изменить» передаёт нарушение верности и не ограничивает смысл словесной ложью.
- source_word: בֶּאֱמוּנָתִי
  choice: Моей верности
  rationale: אֱמוּנָה здесь означает надёжность и верность. Еврейский предлог ב допускает несколько способов осмысления; русский оборот «изменю Моей верности» естественно передаёт неверность собственной неизменной преданности.
- source_word: וְ
  choice: Но
  rationale: Начальный союз в контексте противопоставляет неизменность Божьей любви предшествующему наказанию за беззаконие.
theological_decisions:
- issue: Заветный характер Божьего отношения к потомку Давида
  choice: Передать חֶסֶד как «преданная любовь», а אֱמוּנָה как «верность»
  alternative: Перевести традиционно как «милость» и «истина»
  rationale: Стих сохраняет напряжение между Божьим наказанием и продолжающейся верностью обещанию. Выбранные слова ясно выражают надёжную любовь, не вводя позднейших систематических категорий.
- issue: Связь ложности с Божьей верностью во второй строке
  choice: «не изменю Моей верности»
  alternative: «не поступлю ложно в Моей верности» или «не окажусь неверным Моей верности»
  rationale: Выбранный оборот передаёт смысл неверного действия, а не только произнесения лжи, и остаётся естественным для современного русского языка. Смысловая неоднозначность конструкции отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим порядком слов. Прописные местоимения, относящиеся к Богу, сохраняют традиционную русскую библейскую почтительность; лексика остаётся понятной без архаизмов.
