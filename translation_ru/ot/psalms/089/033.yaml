  text: But my steadfast love I will not remove from him[b][a], nor will I deal falsely in my faithfulness.
translation:
  language: ru
  text: Но Моей преданной любви[a] Я не отниму у него и не нарушу Моей верности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неизменной любви Моей», «милости Моей» или «любви Моей, верной завету».'
