  text: צֶ֣דֶק וּ֭/מִשְׁפָּט מְכ֣וֹן כִּסְאֶ֑/ךָ חֶ֥סֶד וֶ֝/אֱמֶ֗ת יְֽקַדְּמ֥וּ פָנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/014.yaml
  text: Righteousness and justice are the foundation of your throne[a]; steadfast love and faithfulness go before you.
translation:
  language: ru
  text: Праведность и правосудие — основание Твоего престола; неизменная любовь и верность идут перед Тобой[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед Твоим лицом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק
  choice: праведность
  rationale: В сочетании с מִשְׁפָּט обозначает нравственную правоту и должный порядок; этот перевод сохраняет отличие от судебного аспекта следующего слова.
- source_word: מִשְׁפָּט
  choice: правосудие
  rationale: В контексте Божьего престола передаёт справедливое осуществление суда и власти, не сливаясь по значению с צֶדֶק.
- source_word: מְכוֹן
  choice: основание
  rationale: Слово обозначает прочное, установленное место или опору; применительно к престолу естественно передаётся как «основание».
- source_word: כִּסְאֶךָ
  choice: Твоего престола
  rationale: Прямо сохраняет царственный образ и обращение к Богу во втором лице.
- source_word: חֶסֶד
  choice: неизменная любовь
  rationale: Передаёт устойчивую, верную и деятельную любовь; одно слово «милость» здесь не полностью выражает оттенок постоянства и преданности.
- source_word: אֱמֶת
  choice: верность
  rationale: В устойчивой паре с חֶסֶד слово подчёркивает надёжность и постоянство, хотя само по себе может также означать «истина».
- source_word: יְקַדְּמוּ
  choice: идут перед
  rationale: Сохраняет динамический поэтический образ качеств, предшествующих Богу, и звучит естественно по-русски.
- source_word: פָנֶיךָ
  choice: перед Тобой
  rationale: Идиоматически передаёт буквальное «перед Твоим лицом» как указание на личное присутствие, избегая неестественной русской конструкции.
theological_decisions:
- issue: Передача пары חֶסֶד וֶאֱמֶת
  choice: неизменная любовь и верность
  alternative: милость и истина
  rationale: Выбранный вариант сохраняет реляционный оттенок постоянной любви и надёжности, не сводя выражение только к абстрактным качествам и не вводя узкоконфессиональной терминологии.
- issue: Передача פָנֶיךָ
  choice: перед Тобой
  alternative: перед Твоим лицом
  rationale: Идиоматический русский вариант выражает присутствие адресата, а буквальный телесный образ сохраняется в примечании как реальная особенность еврейского текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Параллелизм двух полустиший сохранён; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
