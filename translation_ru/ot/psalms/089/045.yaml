  text: הִ֭קְצַרְתָּ יְמֵ֣י עֲלוּמָ֑י/ו הֶֽעֱטִ֨יתָ עָלָ֖י/ו בּוּשָׁ֣ה סֶֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/045.yaml
  text: You have shortened the days of his youth; you have covered him with shame[a]. Selah
translation:
  language: ru
  text: Ты сократил дни его юности; покрыл его стыдом[a]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «облёк его стыдом».'
    reason: 'Лексическая альтернатива: עטה может передавать как покрытие, так и облачение.'
lexical_decisions:
- source_word: הִקְצַרְתָּ
  choice: Ты сократил
  rationale: Порода hифиль глагола קצר означает «делать коротким, сокращать». Русский совершенный вид естественно передаёт завершённое действие с сохраняющимся результатом.
- source_word: יְמֵי
  choice: дни
  rationale: Форма сопряжённого множественного числа буквально означает «дни» и здесь обозначает продолжительность периода жизни; образ исходного текста сохранён.
- source_word: עֲלוּמָיו
  choice: его юности
  rationale: Существительное обозначает молодость или пору юности. Выбор прямо и естественно передаёт смысл, сохраняя мужской суффикс третьего лица без уточнения референта.
- source_word: הֶעֱטִיתָ
  choice: покрыл
  rationale: Hифиль от עטה может означать «покрывать, окутывать, облачать». В сочетании со «стыдом» глагол «покрыл» звучит естественно и сохраняет образ.
- source_word: עָלָיו
  choice: его
  rationale: Буквально «на нём/над ним»; русская конструкция «покрыть кого-либо стыдом» естественно включает значение предлога.
- source_word: בּוּשָׁה
  choice: стыдом
  rationale: Слово означает стыд, позор или бесчестие. «Стыд» — основной и поэтически уместный эквивалент.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение литургического или музыкального термина неясно, поэтому он передан традиционной транслитерацией без истолкования.
theological_decisions:
- issue: Референт местоименных суффиксов в выражениях «его юности» и «его»
  choice: Сохранить мужское единственное число, не называя референта.
  alternative: Уточнить референт как Давидова царя либо как олицетворённую Давидову династию/помазанника.
  rationale: Контекст указывает на униженного помазанного царя или связанную с ним династию, однако сам стих использует только суффиксы мужского рода единственного числа. Неуточнённое «его» сохраняет контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим строем. Синтаксический параллелизм двух строк и традиционная форма «Села» сохранены.
