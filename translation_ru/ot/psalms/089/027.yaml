  text: אַף אָ֭נִי בְּכ֣וֹר אֶתְּנֵ֑/הוּ עֶ֝לְי֗וֹן לְ/מַלְכֵי אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/027.yaml
  text: Indeed[a], I will make him the firstborn, the highest of the kings of the earth.
translation:
  language: ru
  text: И Я сделаю его первенцем[a], высшим из царей земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «первенствующим». Здесь «первенец» означает высшее положение и особые права, а не обязательно рождение первым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף אָנִי
  choice: И Я
  rationale: Сочетание частицы אַף с самостоятельным местоимением усиливает личное обязательство говорящего и одновременно продолжает предыдущее высказывание. «И Я» естественно передаёт оба оттенка, не сводя частицу только к простому добавлению.
- source_word: בְּכוֹר
  choice: первенцем
  rationale: Сохранён ключевой образ первенца, который в данном царском контексте обозначает прежде всего высший статус, преимущество и права наследника, а не обязательно порядок рождения.
- source_word: אֶתְּנֵהוּ
  choice: сделаю его
  rationale: Глагол נתן с именной характеристикой выражает наделение положением или назначение; «сделаю его» естественно передаёт результирующий смысл.
- source_word: עֶלְיוֹן
  choice: высшим
  rationale: Здесь слово указывает на превосходство в ранге. Форма «высшим» избегает восприятия «Всевышний» как божественного титула.
- source_word: לְמַלְכֵי אָרֶץ
  choice: из царей земли
  rationale: Предлог לְ после עֶלְיוֹן задаёт отношение или сравнение. Русское «высшим из царей земли» ясно выражает превосходство по отношению к земным царям.
theological_decisions:
- issue: Царский и потенциально мессианский смысл слова «первенец»
  choice: Сохранить «первенцем» как обозначение царского первенства, не делая мессианское толкование явным в основном тексте.
  alternative: Передать истолковательно как «главным», «первенствующим» или «наследником».
  rationale: В непосредственном контексте речь идёт о царе из дома Давида, а в христианском каноническом прочтении стих получает мессианское звучание. Сохранение исходного образа удерживает оба уровня смысла и не вносит в перевод более узкое толкование.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным синтаксисом. Заглавная буква в «Я» подчёркивает, что говорит Бог; лексика остаётся понятной без конфессионально специфических формулировок.
