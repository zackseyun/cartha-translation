lexical_decisions:
- source_word: אַחַת
  choice: Однажды
  rationale: В формуле клятвы слово употреблено наречно и указывает на однократность и решительность клятвы. «Однажды» естественно по-русски; возможный оттенок «раз и навсегда» отмечен в сноске.
- source_word: נִשְׁבַּעְתִּי
  choice: Я поклялся
  rationale: Нифаль глагола שׁבע означает «поклясться, дать клятву». Русский совершенный вид передаёт совершённую клятву, сохраняющую силу в контексте.
- source_word: בְקָדְשִׁי
  choice: святостью Моей
  rationale: Предлог ב здесь обозначает то, чем клянётся говорящий; קדשׁ с суффиксом первого лица естественно понимать как «Моя святость». Инверсия придаёт речи достоинство, не делая её архаичной.
- source_word: אִם
  choice: не
  rationale: 'После клятвы אִם вводит эллиптическую формулу самопроклятия: буквально «если солгу Давиду», по смыслу — решительное «не солгу Давиду». Отрицание выражено явно для естественного русского синтаксиса, а буквальная форма дана в сноске.'
- source_word: לְדָוִד
  choice: Давиду
  rationale: Предлог ל указывает на лицо, которому могла бы быть сказана ложь или по отношению к которому обещание могло бы оказаться ложным. Дательный падеж естественно передаёт это отношение.
- source_word: אֲכַזֵּב
  choice: солгу
  rationale: Пиэль כזב здесь означает «солгать» либо «оказаться неверным» по отношению к обещанию. «Солгу» кратко, лично и близко к прямому значению глагола; более широкий оттенок отмечен в сноске.
theological_decisions:
- issue: Передача эллиптической древнееврейской формулы божественной клятвы
  choice: Давиду не солгу
  alternative: если Я солгу Давиду…
  rationale: 'В оригинале отрицание формально не выражено: условная частица вводит подразумеваемое самопроклятие. Явное русское отрицание передаёт установленный смысл клятвенной формулы, тогда как буквальное условие выглядело бы незаконченным. Сноска сохраняет форму оригинала.'
- issue: Основание клятвы
  choice: святостью Моей
  alternative: Моей святыней
  rationale: Контекст поддерживает клятву Бога собственной святостью. Перевод не разворачивает эту формулу в дополнительное учение о характере или заветной верности Бога.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной инверсией «святостью Моей». Заглавные местоимения относятся к Богу в соответствии с принятым русским библейским регистром. Все сносочные маркеры помещены непосредственно при соответствующих выражениях.
