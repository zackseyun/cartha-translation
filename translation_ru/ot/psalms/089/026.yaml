  text: ה֣וּא יִ֭קְרָאֵ/נִי אָ֣בִ/י אָ֑תָּה אֵ֝לִ֗/י וְ/צ֣וּר יְשׁוּעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/026.yaml
  text: He will call to me[a], ‘You are my Father, my God, and the rock of my salvation.’
translation:
  language: ru
  text: 'Он воззовёт ко Мне[a]: «Ты — мой Отец, мой Бог и скала моего спасения».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он назовёт Меня»; возможно также: «Он призовёт Меня». Еврейский глагол может обозначать зов или обращение, в том числе молитвенное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: Он
  rationale: Самостоятельное местоимение третьего лица мужского рода выражено в еврейском тексте и сохраняется для смыслового акцента.
- source_word: יִקְרָאֵנִי
  choice: воззовёт ко Мне
  rationale: Глагол קרא с местоименным суффиксом может обозначать обращение или призыв; в контексте молитвенного обращения «воззовёт ко Мне» естественно передаёт направленность к Богу, не сводя выражение к присвоению имени.
- source_word: אָבִי
  choice: мой Отец
  rationale: Существительное с суффиксом первого лица передаёт личное родственное обращение к Богу; порядок слов выбран естественный для современного русского языка.
- source_word: אָתָּה
  choice: Ты —
  rationale: Явно выраженное еврейское местоимение сохранено, а тире передаёт подразумеваемую именную связку.
- source_word: אֵלִי
  choice: мой Бог
  rationale: אֵל в данном параллельном обращении однозначно относится к Богу; «мой Бог» точно и естественно передаёт форму с суффиксом первого лица.
- source_word: וְצוּר
  choice: и скала
  rationale: Сохранена буквальная и традиционная библейская метафора צוּר — устойчивость, защита и прибежище; притяжательность выражена последующим сочетанием.
- source_word: יְשׁוּעָתִי
  choice: моего спасения
  rationale: Существительное יְשׁוּעָה передано словом «спасение», а конструктивная связь с «скалой» сохранена без разъясняющей парафразы.
theological_decisions:
- issue: Обращение к Богу в царском и мессианском контексте
  choice: 'Прямая речь сохранена как непосредственное обращение к Богу: «Ты — мой Отец, мой Бог и скала моего спасения».'
  alternative: Передать «отец» со строчной буквы либо истолковать фразу исключительно как царскую гиперболу.
  rationale: Сам стих использует личный язык отношений и завета. Перевод сохраняет эту богословскую насыщенность, но не вносит в текст более поздние доктринальные выводы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Метафора «скала спасения» сохранена. Заглавные буквы в местоимениях прямого обращения к Богу соответствуют принятой русской религиозно-издательской норме.
