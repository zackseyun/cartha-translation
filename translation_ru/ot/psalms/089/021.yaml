  yaml_path: translation/ot/psalms/089/021.yaml
  text: with whom my hand will be established[a]; indeed[c][b], my arm will strengthen him.
translation:
  language: ru
  text: с ним будет тверда Моя рука[a], и Моя мышца также укрепит его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с ним утвердится Моя рука».'
    reason: lexical_alternative
  - marker: b
    text: «Мышца» — поэтический образ силы и могущества.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר ... עִמּוֹ
  choice: с ним
  rationale: Относительное אֲשֶׁר отсылает к избраннику из предыдущего стиха, а עִמּוֹ буквально означает «с ним». В русском продолжение «с ним» естественно связывает стих с предшествующим контекстом, не перегружая фразу относительной конструкцией.
- source_word: יָדִי
  choice: Моя рука
  rationale: Сохранён конкретный поэтический образ руки как выражение деятельной силы и поддержки Бога.
- source_word: תִּכּוֹן
  choice: будет тверда
  rationale: Нифаль от כון обозначает состояние твёрдости, устойчивости, утверждённости. «Будет тверда» естественно звучит по-русски и сохраняет результативно-стативный оттенок формы.
- source_word: אַף
  choice: и
  rationale: В параллельной строке אַף усиливает и добавляет второе утверждение. Русский союз «и» передаёт присоединение без тяжеловесного эмфатического наречия; усиление поддерживается самим поэтическим параллелизмом.
- source_word: זְרוֹעִי
  choice: Моя мышца
  rationale: «Мышца» сохраняет различие между יָד («рука») и זְרוֹעַ («рука от плеча, мышца») и традиционный поэтический образ силы, оставаясь понятным в возвышенном литературном регистре.
- source_word: תְאַמְּצֶנּוּ
  choice: укрепит его
  rationale: Пиэль от אמץ с местоименным суффиксом означает «сделает его сильным, укрепит его»; выбран точный и естественный русский эквивалент.
theological_decisions:
- issue: Антропоморфные образы Божьего действия
  choice: Сохранить образы «Моя рука» и «Моя мышца».
  alternative: 'Передать отвлечённо: «Моя сила» и «Моё могущество».'
  rationale: Еврейский текст намеренно изображает Божью действенную поддержку царя посредством телесных метафор. Их сохранение передаёт поэзию и не навязывает дополнительного богословского истолкования.
- issue: Будущее обещание или общее настоящее
  choice: 'Передать глаголы будущим временем: «будет тверда», «укрепит».'
  alternative: 'Настоящее время: «тверда», «укрепляет».'
  rationale: Имперфектные формы в контексте обещания избранному царю естественно выражают будущую и продолжающуюся Божью поддержку.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «будет тверда Моя рука» сохраняет ритм и акцент еврейской строки; слово «мышца» удерживает параллелизм двух разных древнееврейских обозначений руки.
