    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַתִּי
  choice: Я заключил
  rationale: Сочетание כרת ברית — устойчивое древнееврейское выражение со значением «заключить завет». Русское «заключил» естественно передаёт идиому; форма прошедшего времени сохраняет совершённость и действующую силу поступка в контексте.
- source_word: בְּרִית
  choice: завет
  rationale: «Завет» сохраняет богословскую и контекстуальную значимость ברית и предпочтительнее более общих слов «договор» или «соглашение».
- source_word: לִבְחִירִי
  choice: с Моим избранником
  rationale: При כרת ברית предлог ל естественно передаётся по-русски как «с». Существительное בחיר с суффиксом означает «Мой избранник»; формулировка сохраняет личное обозначение и не добавляет мессианского толкования.
- source_word: נִשְׁבַּעְתִּי
  choice: поклялся
  rationale: Нифаль глагола שׁבע означает принесение клятвы. «Поклялся» точно и естественно передаёт торжественный характер высказывания и образует удачный поэтический параллелизм с «заключил».
- source_word: לְדָוִד
  choice: Давиду
  rationale: После נשבע предлог ל обозначает адресата клятвы; русский дательный падеж передаёт это прямо и естественно.
- source_word: עַבְדִּי
  choice: Моему слуге
  rationale: В отношении Давида עבד выступает как почётное обозначение служителя Бога в заветных отношениях. «Слуга» здесь контекстуально точнее, чем «раб», которое могло бы неоправданно выдвинуть на первый план социально-правовой статус.
theological_decisions:
- issue: Кого обозначает выражение «Мой избранник»
  choice: Сохранить непосредственное указание на Давида, не вводя в текст прямого мессианского отождествления.
  alternative: Передать выражение так, чтобы явно обозначить Мессию или типологическое исполнение за пределами Давида.
  rationale: Параллельные строки соотносят «Моего избранника» с «Давидом, Моим слугой». Возможное более широкое мессианское значение относится к толкованию и не должно вноситься в формулировку стиха.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Заглавные буквы в местоименных формах «Моим», «Моему» отражают принятую русскую практику почтительного обозначения Бога. Двоеточие сохранено, поскольку клятва раскрывается в следующем стихе.
