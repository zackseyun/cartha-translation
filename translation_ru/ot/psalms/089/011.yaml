  source_fidelity: 'Перевод точно передаёт два утверждения еврейского текста: небеса и земля принадлежат Богу, а вселенную/мир и всё, что его наполняет, Он основал. «Небеса» сохраняет множественное число שָׁמַיִם; «земля» уместно передаёт космический смысл אָרֶץ. «Вселенную и всё, что её наполняет» адекватно передаёт תֵּבֵל וּמְלֹאָהּ, а «основал Ты» сохраняет יסד и поэтическое выделение деятеля.'
