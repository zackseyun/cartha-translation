  text: לְ/ךָ֣ שָׁ֭מַיִם אַף לְ/ךָ֥ אָ֑רֶץ תֵּבֵ֥ל וּ֝/מְלֹאָ֗/הּ אַתָּ֥ה יְסַדְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/011.yaml
  text: The heavens are yours; the earth also is yours[a]. The world and its fullness—you founded them.
translation:
  language: ru
  text: Небеса — Твои, и земля — Твоя. Вселенную и всё, что её наполняет[a], основал Ты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «её полноту».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: Твои / Твоя
  rationale: Предлог לְ с суффиксом 2-го лица мужского рода единственного числа выражает принадлежность. Именная конструкция с тире естественно передаёт это по-русски.
- source_word: שָׁמַיִם
  choice: небеса
  rationale: Сохраняет форму множественного числа и возвышенный поэтический регистр еврейского слова.
- source_word: אַף
  choice: и
  rationale: 'В параллельной конструкции частица расширяет утверждение: Богу принадлежат не только небеса, но и земля. Русский союз «и» передаёт это естественно и без излишнего усиления.'
- source_word: אָרֶץ
  choice: земля
  rationale: Параллель с небесами и последующее упоминание вселенной указывают на космический, а не территориальный смысл.
- source_word: תֵּבֵל
  choice: вселенная
  rationale: Слово обозначает обитаемый, устроенный мир. «Вселенная» сохраняет возвышенный поэтический регистр и отличает תֵּבֵל от предшествующего אָרֶץ.
- source_word: מְלֹאָהּ
  choice: всё, что её наполняет
  rationale: Буквально «её полнота»; выбранная формулировка ясно и естественно обозначает всё, что находится в мире, сохраняя образ наполненности.
- source_word: יְסַדְתָּם
  choice: основал Ты
  rationale: Глагол יסד выражает основание или учреждение и сохраняет образ творческого устроения мира. Вынесение «Ты» в конец передаёт поэтическое ударение оригинала; множественный объект охватывается предшествующей парой «вселенную и всё, что её наполняет».
theological_decisions:
- issue: Божественное владение и творческое действие
  choice: Передать и принадлежность Богу небес и земли, и Его действие по основанию вселенной со всем её содержимым.
  alternative: Развернуть стих в явное утверждение о творении из ничего либо свести его только к теме Божьего владычества.
  rationale: Еврейский текст прямо соединяет принадлежность («Твои») с действием основания (יסד), но не уточняет способ творения; перевод не добавляет позднейших догматических формулировок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Параллелизм первой строки сохранён; инверсия «основал Ты» подчёркивает Бога как деятеля и остаётся понятной современному читателю.
