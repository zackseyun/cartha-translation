  yaml_path: translation/ot/psalms/089/022.yaml
  text: No enemy will exact tribute from him[b][a], and no son of wickedness will afflict him.
translation:
  language: ru
  text: Враг не потребует с него дани[a], и сын беззакония[b] не будет притеснять его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «враг не обманет его» или «не станет притеснять его». Еврейский глагол допускает несколько близких значений; перевод «не потребует с него дани» соответствует контексту вражеского угнетения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сын беззакония» — еврейский оборот, означающий беззаконного или злого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַשִּׁא
  choice: не обложит данью
  rationale: В данном контексте форма глагола допускает значение взыскания или наложения повинности. Параллель с «угнетать» и контекст защиты царя говорят в пользу враждебной политико-экономической эксплуатации, хотя возможны и другие значения.
- source_word: אוֹיֵב
  choice: враг
  rationale: Прямой и естественный современный эквивалент существительного в единственном числе, соответствующий царскому и военному контексту псалма.
- source_word: בּוֹ
  choice: его
  rationale: При переводе глагола как «обложить данью» русский синтаксис требует прямого дополнения; значение еврейского предлога передано конструкцией в целом.
- source_word: בֶן עַוְלָה
  choice: сын беззакония
  rationale: Сохранён выразительный еврейский оборот, обозначающий беззаконного человека; это также поддерживает возвышенный поэтический строй.
- source_word: עַוְלָה
  choice: беззаконие
  rationale: Слово охватывает неправду, несправедливость и нравственное зло; «беззаконие» естественно в данном поэтическом обороте.
- source_word: יְעַנֶּנּוּ
  choice: не будет угнетать его
  rationale: Порода Piel глагола ענה здесь выражает причинение страдания, притеснение или угнетение. «Угнетать» ясно передаёт враждебное подавление и хорошо сочетается с первой строкой.
theological_decisions:
- issue: К кому относится защищаемый человек
  choice: Сохранено местоимение единственного числа «его» без уточняющего толкования.
  alternative: Уточнить как Давида, царя из рода Давида или Мессию.
  rationale: В непосредственном контексте речь идёт об одной царственной фигуре в рамках завета. Перевод сохраняет формулировку еврейского текста и не сужает её богословское прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух строк сохранён; редкий образ «сын беззакония» оставлен ради формы и выразительности оригинала и пояснён в сноске.
