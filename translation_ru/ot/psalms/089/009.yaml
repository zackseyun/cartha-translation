base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/009.yaml
  text: You rule over the swelling of the sea[a]; when its waves rise[b], you still them.
translation:
  language: ru
  text: Ты властвуешь над вздыманием моря[a]; когда поднимаются его волны, Ты усмиряешь их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над гордыней моря» или «над величием моря». Еврейское слово может означать гордость, величие или вздымание; в данном контексте вероятнее всего имеется в виду подъём морских вод.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «успокаиваешь их» или «унимаешь их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשֵׁל
  choice: властвуешь
  rationale: Причастная форма выражает постоянное, деятельное господство. «Властвуешь» естественно сочетается с предлогом «над» и сохраняет поэтическое достоинство.
- source_word: בְּגֵאוּת הַיָּם
  choice: над бушующим морем
  rationale: גֵּאוּת может обозначать величие, гордость или вздымание. В сочетании с морем и последующим упоминанием волн выбран конкретный образ бурно вздымающейся морской стихии; בְּ после מוֹשֵׁל передано по-русски как «над».
- source_word: בְּשׂוֹא גַלָּיו
  choice: когда вздымаются его волны
  rationale: Инфинитив נשׂא описывает поднятие волн и естественно передаётся временным придаточным предложением. Местоимение «его» относится к морю.
- source_word: תְשַׁבְּחֵם
  choice: Ты укрощаешь их
  rationale: Порода пиэль глагола שׁבח здесь означает усмирять или успокаивать. «Укрощаешь» передаёт не только прекращение движения, но и власть над бурной стихией, не выходя за рамки контекста.
theological_decisions:
- issue: Божье владычество над морской стихией
  choice: Прямое утверждение, что Бог властен над морем и усмиряет его волны.
  alternative: Мифопоэтический намёк на победу Бога над космическим хаосом.
  rationale: Текст непосредственно изображает власть Бога над морем. Перевод сохраняет конкретный поэтический образ, но не вносит в основной текст не выраженную явно мифологическую схему.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Заглавное «Ты» употреблено как традиционное почтительное обращение к Богу; синтаксис остаётся ясным для широкого круга читателей.
