  yaml_path: translation/ot/psalms/089/047.yaml
  text: Remember how short my lifetime is! For what vanity have you created all the sons of man?[a][b]
translation:
  language: ru
  text: Вспомни, как краток мой век! Для чего Ты сотворил всех сынов человеческих? Неужели для тщеты?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всех людей», «всё человечество». Буквально: «всех сынов человека».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Для какой тщеты Ты сотворил всех сынов человеческих?»'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: זְכָר
  choice: Вспомни
  rationale: Повелительное наклонение, 2-е лицо мужского рода единственного числа; прямая просьба к Богу естественно передаётся простым императивом.
- source_word: אֲנִי מֶה חָלֶד
  choice: как краток мой век
  rationale: Буквальное построение «я — каков [мой] век» в русском неестественно. חֶלֶד обозначает срок или продолжительность земной жизни; контекст подчёркивает её краткость.
- source_word: עַל מַה שָּׁוְא
  choice: Зачем… — неужели напрасно?
  rationale: עַל מַה вводит вопрос о цели или причине, а שָׁוְא означает пустоту, тщету, напрасность. Такая формулировка сохраняет риторический вопрос и звучит естественно по-русски.
- source_word: בָּרָאתָ
  choice: Ты сотворил
  rationale: Форма 2-го лица мужского рода единственного числа обращена к Богу; совершенный вид соответствует завершённому акту творения.
- source_word: כָל בְּנֵי אָדָם
  choice: всех сынов человеческих
  rationale: Сохраняется поэтический древнееврейский оборот с обобщённым значением «все люди»; его значение пояснено в сноске.
theological_decisions:
- issue: Обобщённое обозначение человечества в בְּנֵי אָדָם
  choice: всех сынов человеческих
  alternative: всех людей / всё человечество
  rationale: Основной текст сохраняет грамматически мужской и поэтический образ оригинала, не ограничивая его значение только мужчинами.
- issue: Вопросительное или утвердительное прочтение עַל מַה שָּׁוְא
  choice: 'риторический вопрос: «Зачем… — неужели напрасно?»'
  alternative: 'утверждение-восклицание: «Как напрасно Ты сотворил…»'
  rationale: Сочетание עַל מַה естественно допускает вопрос о цели, но еврейская поэтическая строка может восприниматься и как горестное утверждение; альтернативу следует сохранить в сноске.
translation_notes:
  register: Современный литературный русский с молитвенно-поэтическим достоинством. Заглавное «Ты» передаёт уважительное обращение к Богу, не добавляя толкования. Необычный образ «сыны человеческие» сохранён ради связи с формой оригинала и разъяснён в сноске.
