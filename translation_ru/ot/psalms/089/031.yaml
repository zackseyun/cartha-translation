lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Условный союз вводит протасис; «если» прямо передаёт условное значение, не превращая его во временное «когда».
- source_word: חֻקֹּתַי
  choice: Мои уставы
  rationale: «Уставы» естественно передаёт предписанные Богом установления и сохраняет различие с параллельным «заповедями».
- source_word: יְחַלֵּלוּ
  choice: осквернят
  rationale: Порода пиэль глагола חלל выражает профанацию или осквернение; это сильнее простого нарушения и сохраняет религиозно-заветную весомость выражения.
- source_word: וּמִצְוֺתַי
  choice: и Моих заповедей
  rationale: «Заповеди» — ясный и традиционно понятный эквивалент מִצְוֹת в контексте Божьих повелений; родительный падеж обусловлен русским управлением глагола «соблюдать» при отрицании.
- source_word: לֹא יִשְׁמֹרוּ
  choice: не будут соблюдать
  rationale: В контексте закона שׁמר означает соблюдать, исполнять предписанное; форма будущего времени естественно согласуется с условной конструкцией.
theological_decisions:
- issue: Сила выражения חלל применительно к Божьим уставам
  choice: «осквернят Мои уставы»
  alternative: «нарушат Мои уставы»
  rationale: «Осквернят» сохраняет присущий глаголу оттенок профанации и показывает не только неповиновение, но и бесчестное обращение со священными установлениями, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической и заветно-правовой речи. Заглавные буквы в притяжательных местоимениях, относящихся к Богу, соответствуют распространённой русской библейской издательской традиции. Конечная запятая сохраняет синтаксическую незавершённость условной части, продолжающейся в следующем стихе.
