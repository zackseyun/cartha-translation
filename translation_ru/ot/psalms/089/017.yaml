  text: כִּֽי תִפְאֶ֣רֶת עֻזָּ֣/מוֹ אָ֑תָּה וּ֝/בִ/רְצֹנְ/ךָ֗ תרים קַרְנֵֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/017.yaml
  text: For you are the glory of their strength[b][a], and by your favor you exalt our horn.
translation:
  language: ru
  text: Ибо Ты — слава их силы[a], и по Твоему благоволению Ты возвышаешь наш рог[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великолепие» или «краса их силы».'
    reason: lexical_alternative
  - marker: b
    text: «Рог» — древнееврейский поэтический образ силы, могущества, достоинства или высокого положения.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для предшествующего утверждения; «ведь» естественно передаёт пояснительно-причинную связь в русском контексте.
- source_word: תִפְאֶרֶת
  choice: слава
  rationale: 'Слово может означать славу, великолепие или красоту. «Слава» сохраняет ёмкость образа: Бог является славой и почётным основанием силы народа.'
- source_word: עֻזָּמוֹ
  choice: их силы
  rationale: Суффикс третьего лица множественного числа требует перевода «их»; родительный оборот естественно передаёт еврейское сочетание.
- source_word: אָתָּה
  choice: Ты
  rationale: Самостоятельное местоимение выражено явно и эмфатично; в русском именная конструкция с тире естественно передаёт сказуемое без добавления связки.
- source_word: וּבִרְצֹנְךָ
  choice: и по Твоему благоволению
  rationale: רָצוֹן обозначает благоволение, расположение, благосклонность. «По Твоему благоволению» естественно выражает то, что возвышение совершается благодаря Божьему благосклонному изволению.
- source_word: תרים
  choice: возвышается
  rationale: Вокализация тивериадской масоры допускает чтение как форму 3-го лица женского рода — «возвышается» — при подлежащем קַרְנֵנוּ («наш рог», грамматически женского рода). Кетив без огласовки также допускает традиционное понимание «Ты возвышаешь»; неоднозначность отмечена в решениях.
- source_word: קַרְנֵנוּ
  choice: наш рог
  rationale: Буквальный образ сохранён. В древнееврейской поэзии рог обозначает силу, могущество, достоинство или высокое положение.
theological_decisions:
- issue: Образ рога
  choice: Сохранить в основном тексте «наш рог».
  alternative: нашу силу; наше могущество; наше достоинство
  rationale: Образ значим для библейской поэзии и не должен быть без необходимости заменён толкованием; пояснение дано в сноске.
- issue: Смена местоимений
  choice: Сохранить «их силы» и «наш рог».
  alternative: Согласовать оба выражения как «нашей силы» и «наш рог».
  rationale: В еврейском тексте действительно происходит переход от суффикса третьего лица множественного числа к первому лицу множественного числа; сглаживание устранило бы подлинное напряжение текста.
- issue: Чтение תרים
  choice: Следовать масоретской огласовке как «возвышается».
  alternative: «Ты возвышаешь»
  rationale: При записанной в WLC огласовке תָּרוּם/תָּרִים-подобное понимание формы соотносится с женским существительным «рог»; однако согласный текст традиционно понимают и как обращённый к Богу глагол второго лица. Основной текст следует вокализованной форме источника, не превращая альтернативу в догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим регистром. Заглавные формы местоимений при обращении к Богу соответствуют принятой русской библейской традиции. Смена «их» на «наш» сохранена. Основной текст следует масоретской огласовке спорной глагольной формы.
