source:
  edition: WLC
  text: אִם יַֽעַזְב֣וּ בָ֭נָי/ו תּוֹרָתִ֑/י וּ֝/בְ/מִשְׁפָּטַ֗/י לֹ֣א יֵלֵכֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/089/030.yaml
  text: If his sons abandon my law and do not walk in my judgments[b][a],
translation:
  language: ru
  text: Если его сыновья оставят Мой закон[a] и не будут ходить по Моим установлениям[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моё наставление». Древнееврейское слово тора может означать не только закон, но также учение или наставление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будут поступать по Моим предписаниям»; буквальнее: «не будут ходить в Моих судах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Союз вводит условное придаточное; «если» сохраняет прямой условный смысл, не представляя отступление как неизбежное.
- source_word: יַעַזְבוּ
  choice: оставят
  rationale: Глагол עזב означает «оставлять, покидать» и здесь передаёт отступление от заветной верности; «оставят» естественно звучит по-русски и сохраняет серьёзность действия.
- source_word: בָנָיו
  choice: его сыновья
  rationale: Форма мужского рода множественного числа с местоименным суффиксом 3-го лица единственного числа буквально означает «его сыновья»; это также соответствует контексту потомков Давида.
- source_word: תּוֹרָתִי
  choice: Мой закон
  rationale: תּוֹרָה может означать как закон, так и наставление. В параллели с מִשְׁפָּטַי здесь особенно заметен правовой и заветный оттенок, поэтому выбрано «Мой закон».
- source_word: וּבְמִשְׁפָּטַי
  choice: по Моим установлениям
  rationale: מִשְׁפָּטִים может обозначать судебные решения, нормы или установления. Русское «по Моим установлениям» естественно передаёт нормативный смысл и значение предлога בְ в сочетании с глаголом движения.
- source_word: לֹא יֵלֵכוּן
  choice: не будут ходить
  rationale: Сохранена библейская метафора хождения как образа образа жизни и поведения; форма будущего времени соответствует древнееврейской условной конструкции.
theological_decisions:
- issue: Передача תּוֹרָה в заветно-правовом контексте
  choice: Мой закон
  alternative: Моё наставление
  rationale: Хотя слово шире понятия закона и может означать наставление, параллель с «Моими установлениями» подчёркивает здесь заветно-правовую сторону. Альтернативный смысл отмечен в сноске.
- issue: Передача בָנָיו
  choice: его сыновья
  alternative: его дети / его потомки
  rationale: Основной текст сохраняет явно мужскую форму древнееврейского оригинала и связь с сыновьями Давида, не расширяя её без текстового основания до гендерно нейтрального выражения.
- issue: Метафора хождения в לֹא יֵלֵכוּן
  choice: не будут ходить
  alternative: не будут жить / не будут поступать
  rationale: Буквальная метафора понятна по-русски и сохраняет заветный образ поведения, не сводя выражение к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены условная конструкция, мужское обозначение сыновей и метафора хождения. Прописные буквы в «Мой/Моим» обозначают речь Бога в соответствии с принятой русской библейской издательской традицией.
