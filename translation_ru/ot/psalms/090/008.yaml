  text: שת עֲוֺנֹתֵ֣י/נוּ לְ/נֶגְדֶּ֑/ךָ עֲ֝לֻמֵ֗/נוּ לִ/מְא֥וֹר פָּנֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/008.yaml
  text: You have set our iniquities before you[b][a], our hidden sins in the light of your face.
translation:
  language: ru
  text: 'Ты поставил наши беззакония перед Собой,

    наши скрытые грехи[a] — на свет Твоего лица[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наши тайные грехи». Еврейское слово обозначает то, что скрыто или утаено.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к свету Твоего лица» — образ полной открытости перед Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שת (שִׁית)
  choice: Ты поставил
  rationale: Глагол означает «ставить, помещать». Совершенный вид передаёт уже совершённое Богом действие, а «поставил» сохраняет конкретность еврейского образа.
- source_word: עֲוֺנֹתֵינוּ
  choice: наши беззакония
  rationale: עָוֹן может обозначать беззаконие, вину или греховный поступок. «Беззакония» сохраняет нравственную весомость и форму множественного числа.
- source_word: לְנֶגְדֶּךָ
  choice: перед Собой
  rationale: Оборот означает нахождение непосредственно перед адресатом, открытое его взору. Возвратное «Собой» естественно по-русски при обращении к Богу.
- source_word: עֲלֻמֵנוּ
  choice: наши скрытые грехи
  rationale: Слово обозначает скрытое или утаённое; параллелизм с «беззакониями» позволяет ясно выразить подразумеваемые грехи, не сводя выражение к нейтральным тайнам.
- source_word: לִמְאוֹר
  choice: в свете
  rationale: Русский оборот «в свете» естественно передаёт образ полного обнаружения и соответствует функции еврейского выражения в данном контексте.
- source_word: פָּנֶיךָ
  choice: Твоего лица
  rationale: Сохранён буквальный и поэтически значимый образ Божьего лица; замена на «присутствие» была бы более толковательной.
theological_decisions:
- issue: Следует ли явно назвать עֲלֻמֵנוּ грехами
  choice: «наши скрытые грехи»
  alternative: «наше сокрытое» / «наши тайны»
  rationale: Параллелизм с «нашими беззакониями» указывает на скрываемые проступки. Добавление слова «грехи» раскрывает поэтический эллипсис, не вводя постороннего богословского содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Сохранены параллелизм и конкретный образ Божьего лица; местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции.
