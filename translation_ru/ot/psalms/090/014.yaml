base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/014.yaml
  text: Satisfy us in the morning with your steadfast love[a], and we will sing for joy and be glad all our days.
translation:
  language: ru
  text: Насыть нас утром Твоей неизменной любовью[a], и мы будем ликовать и радоваться во все наши дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоей верной завету любовью»; или: «Твоей милостью». Еврейское חֶסֶד означает стойкую, верную любовь, проявляемую в благости.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׂבְּעֵנוּ
  choice: Насыть нас
  rationale: Пиэль, повелительная форма с суффиксом 1-го лица множественного числа, выражает просьбу дать полное насыщение. «Насыть нас» передаёт полноту дара и сохраняет образ оригинала.
- source_word: בַבֹּקֶר
  choice: утром
  rationale: Буквальное временное значение сохранено без добавления смыслов «каждое утро» или «к утру», которых форма сама по себе не требует.
- source_word: חַסְדֶּךָ
  choice: Твоей неизменной любовью
  rationale: חֶסֶד обозначает устойчивую, верную любовь, проявляемую в благости. «Неизменная любовь» естественно звучит по-русски и передаёт постоянство, не сводя значение только к милости.
- source_word: וּנְרַנְּנָה
  choice: и мы будем ликовать
  rationale: Глагол רנן выражает громкую радость — ликующий возглас или пение. «Ликовать» сохраняет торжественную и эмоциональную силу, не уточняя без необходимости, идёт ли речь именно о пении.
- source_word: וְנִשְׂמְחָה
  choice: и радоваться
  rationale: Глагол שמח означает радоваться, веселиться. В сочетании с «ликовать» перевод сохраняет поэтический параллелизм двух близких выражений.
- source_word: בְּכָל יָמֵינוּ
  choice: во все наши дни
  rationale: Выражение охватывает всю продолжительность жизни молящихся; «во все наши дни» точно и естественно передаёт временной смысл.
theological_decisions:
- issue: Передача חֶסֶד в молитве о Божьем благоволении
  choice: Твоей неизменной любовью
  alternative: Твоей верной завету любовью; Твоей милостью
  rationale: 'Основной вариант сохраняет широту понятия: любовь, постоянство, верность и благость. Упоминание завета возможно по контексту употребления слова, но не вводится прямо в основной текст; «милость» передаёт лишь часть смыслового диапазона.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-поэтическим звучанием. Местоимение, относящееся к Богу, написано с прописной буквы согласно распространённой русской библейской традиции.
