  text: יְמֵֽי שְׁנוֹתֵ֨י/נוּ בָ/הֶ֥ם שִׁבְעִ֪ים שָׁנָ֡ה וְ/אִ֤ם בִּ/גְבוּרֹ֨ת שְׁמ֘וֹנִ֤ים שָׁנָ֗ה וְ֭/רָהְבָּ/ם עָמָ֣ל וָ/אָ֑וֶן כִּי גָ֥ז חִ֝֗ישׁ וַ/נָּעֻֽפָ/ה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/010.yaml
  text: The days of our years are seventy years[a], or if by strength, eighty years; yet their pride is toil and trouble, for it is soon gone[b], and we fly away.
translation:
  language: ru
  text: Срок нашей жизни — семьдесят лет, а при крепости — восемьдесят; но даже лучшее в них — труд и горе[a], ибо они быстро проходят[b], и мы улетаем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но то, чем они могут похвалиться, — труд и горе». Еврейское слово может обозначать гордость, предмет похвалы или наиболее выдающееся в этих годах.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ибо они быстро обрываются».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמֵי שְׁנוֹתֵינוּ
  choice: Дней наших лет
  rationale: Сохраняет поэтический еврейский оборот, оставаясь понятным в современном русском языке.
- source_word: בָהֶם שִׁבְעִים שָׁנָה
  choice: семьдесят лет
  rationale: Предлог с местоимением здесь идиоматически указывает на общую продолжительность жизни; в русском связка естественно опускается.
- source_word: וְאִם בִּגְבוּרֹת
  choice: а при крепости
  rationale: 'Передаёт условно-исключительный смысл: при наличии особой телесной силы жизнь может достигать восьмидесяти лет.'
- source_word: וְרָהְבָּם
  choice: но и лучшее в них
  rationale: В данном контексте רהב указывает на наиболее сильную, выдающуюся или внушительную часть этих лет. Такой перевод естественнее буквального «их гордость» и сохраняет иронию высказывания; лексическая неоднозначность отмечена в сноске.
- source_word: עָמָל וָאָוֶן
  choice: труд и горе
  rationale: Передаёт тяготу труда и бедствие человеческой жизни, не привнося возможное в иных контекстах значение нравственного нечестия.
- source_word: כִּי גָז חִישׁ
  choice: потому что они быстро проходят
  rationale: Глагол допускает значения быстрого прохождения или отсечения. Множественное «они» естественно соотносится в русском с годами; альтернативный образ отмечен в сноске.
- source_word: וַנָּעֻפָה
  choice: и мы улетаем
  rationale: Сохраняет яркий образ полёта и форму первого лица множественного числа.
