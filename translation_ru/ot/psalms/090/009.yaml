lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Сохраняет пояснительно-причинную связь с предыдущей мыслью и естественно звучит в русской поэзии.
- source_word: כָל יָמֵינוּ
  choice: все наши дни
  rationale: Прямо передаёт множественное число и сохраняет поэтический параллелизм со словами «свои годы».
- source_word: פָּנוּ
  choice: проходят
  rationale: В контексте времени глагол обозначает уход или истечение дней; настоящее время по-русски естественно выражает обобщённую мысль о человеческой жизни.
- source_word: בְעֶבְרָתֶךָ
  choice: под Твоим гневом
  rationale: Существительное выражает сильный гнев; предлог «под» естественно передаёт обстоятельство или сферу, в которой проходят дни, не превращая связь прямо в причинную.
- source_word: כִּלִּינוּ
  choice: мы оканчиваем
  rationale: Передаёт значение породы пиэль — доводить до конца, завершать — и сохраняет личную форму исходного текста.
- source_word: שָׁנֵינוּ
  choice: свои годы
  rationale: Сохраняет множественное число и естественно соотносит годы с подлежащим «мы».
- source_word: כְמוֹ
  choice: словно
  rationale: Естественный русский поэтический эквивалент сравнительной частицы.
- source_word: הֶגֶה
  choice: вздох
  rationale: Слово обозначает негромкий звук — вздох, стон или тихое произнесение. «Вздох» уместно передаёт краткость и хрупкость жизни в данном контексте, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: Обозначение Божьего гнева
  choice: под Твоим гневом
  alternative: под Твоим негодованием; в ярости Твоей
  rationale: Перевод сохраняет силу слова עֶבְרָה и прямо связывает быстротечность человеческих дней с Божьим гневом, не смягчая богословское напряжение текста.
