lexical_decisions:
- source_word: תְּפִלָּה
  choice: Молитва
  rationale: Существительное прямо обозначает молитву и служит жанровым наименованием в надписании псалма.
- source_word: לְמֹשֶׁה
  choice: Моисея
  rationale: Русская родительная конструкция в заголовке звучит естественно и, подобно еврейскому לְ, не обязательно ограничивает связь одним лишь авторством.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человека Божьего
  rationale: Сохранено определённое почётное обозначение Моисея; «Божьего» передаёт принадлежность Богу естественным современным русским языком.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Форма обращения к Богу передана русским звательным употреблением слова «Господь» без добавления притяжательного «мой».
- source_word: מָעוֹן
  choice: обителью
  rationale: Слово сохраняет пространственный образ постоянного места пребывания и защиты, не сводя его только к значению убежища.
- source_word: הָיִיתָ לָּנוּ
  choice: Ты был для нас
  rationale: Прошедшее время сохраняет еврейский перфект, а оборот «для нас» передаёт לָּנוּ и отношение Бога к общине; длительность раскрывается следующей строкой.
- source_word: בְּדֹר וָדֹר
  choice: из поколения в поколение
  rationale: Современный русский оборот ясно передаёт непрерывность на протяжении сменяющих друг друга поколений.
theological_decisions:
- issue: Значение לְ в надписании לְמֹשֶׁה
  choice: «Молитва Моисея» с пояснением неоднозначности
  alternative: «Молитва, написанная Моисеем» или «Молитва для Моисея»
  rationale: Еврейский предлог может обозначать авторство, связь или посвящение. Родительная конструкция не превращает возможное авторство в более определённое утверждение, чем допускает источник.
- issue: Образ Бога как מָעוֹן
  choice: «обитель»
  alternative: «убежище»
  rationale: «Обитель» сохраняет исходный образ места пребывания; «убежище» подчёркивает защиту, но уже истолковывает и сужает метафору.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Обитель» сохраняет достоинство и пространственную метафору, а «из поколения в поколение» остаётся понятным общеупотребительным оборотом. Местоимение «Ты» написано с прописной буквы как принятая в русском религиозном письме форма почтительного обращения.
