base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/001.yaml
  text: A prayer of Moses[a], the man of God. Lord[b], you have been a dwelling place for us from generation to generation.
translation:
  language: ru
  text: 'Молитва Моисея[a], человека Божьего.


    Господи, Ты был для нас жилищем[b]

    во все поколения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молитва Моисея» в смысле молитвы, написанной Моисеем, связанной с ним или посвящённой ему. Еврейский предлог в надписании может указывать на авторство, связь или посвящение.'
