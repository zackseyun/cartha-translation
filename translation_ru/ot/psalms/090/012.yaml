  text: לִ/מְנ֣וֹת יָ֭מֵי/נוּ כֵּ֣ן הוֹדַ֑ע וְ֝/נָבִ֗א לְבַ֣ב חָכְמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/012.yaml
  text: Teach us to number our days[a], that we may gain a heart of wisdom.
translation:
  language: ru
  text: Научи нас так исчислять наши дни[a], чтобы мы обрели мудрое сердце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Научи нас так исчислять наши дни — и мы принесём сердце мудрости». Заключительные слова на еврейском допускают разные толкования; многие понимают их в смысле: «чтобы мы обрели мудрое сердце».'
    reason: alternative_reading
lexical_decisions:
- source_word: לִמְנוֹת
  choice: исчислять
  rationale: Инфинитив מנה означает считать, исчислять. «Исчислять» сохраняет конкретный образ и звучит естественно в возвышенной поэтической речи.
- source_word: יָמֵינוּ
  choice: наши дни
  rationale: Прямо передаёт сочетание с суффиксом первого лица множественного числа и указывает на ограниченный срок человеческой жизни.
- source_word: כֵּן
  choice: так
  rationale: Сохраняет буквальное и неоднозначное «так/таким образом», не добавляя отсутствующего в тексте наречия «правильно».
- source_word: הוֹדַע
  choice: научи нас
  rationale: Каузативный императив от ידע буквально значит «дай нам знать». В русской молитвенной речи «научи нас» естественно выражает просьбу о дарованном Богом понимании.
- source_word: וְנָבִא
  choice: чтобы мы обрели
  rationale: Форма от בוא буквально связана со значением «приносить/приводить», но трудную конструкцию часто понимают идиоматически как достижение или обретение мудрого сердца. Альтернатива отмечена в сноске.
- source_word: לְבַב חָכְמָה
  choice: мудрое сердце
  rationale: Естественная русская передача буквального «сердце мудрости»; сохраняет библейское представление о сердце как внутреннем центре понимания и воли.
theological_decisions:
- issue: Смысл заключительной цели или следствия
  choice: Просьба научить осознавать меру человеческих дней, чтобы молящиеся обрели мудрое сердце.
  alternative: «Научи нас так исчислять наши дни — и мы принесём сердце мудрости».
  rationale: Еврейская конструкция с וְנָבִא сжата и трудна. Основной вариант естественно согласуется с размышлением псалма о смертности, но буквальная возможность «принесём» сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. «Исчислять» слегка возвышенно, но понятно и сохраняет традиционный конкретный образ; неоднозначность заключительной части вынесена в сноску.
