lexical_decisions:
- source_word: תְּפִלָּה
  choice: Молитва
  rationale: Прямое и естественное соответствие еврейскому обозначению молитвы в надписании.
- source_word: לְמֹשֶׁה
  choice: Моисея
  rationale: Русский родительный падеж естественно передаёт традиционное понимание связи молитвы с Моисеем, а неоднозначность предлога ל пояснена в сноске.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человека Божьего
  rationale: Устойчивое, dignified выражение, точно передающее почётное обозначение Моисея.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Обычное русское соответствие божественному титулу Адонай; обращение сохранено.
- source_word: מָעוֹן
  choice: обителью
  rationale: Передаёт основное значение постоянного места пребывания; возможные оттенки «жилище» и «прибежище» отмечены в сноске.
- source_word: בְּדֹר וָדֹר
  choice: из поколения в поколение
  rationale: Естественная русская идиома, передающая непрерывность на протяжении всех поколений.
theological_decisions:
- issue: Характер связи надписания с Моисеем
  choice: «Молитва Моисея» с примечанием о неоднозначности
  alternative: «Молитва, принадлежащая Моисею» или «Молитва о Моисее»
  rationale: Еврейский предлог ל допускает авторство, принадлежность, посвящение или иную связь; основной текст следует наиболее естественному традиционному прочтению, не устраняя альтернативы.
- issue: Образ Бога как מָעוֹן
  choice: «обитель»
  alternative: «жилище» или «прибежище»
  rationale: Сохранён пространственный образ пребывания в Боге без сведения его исключительно к защите; лексическая широта указана в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Заглавная буква в «Ты» поддерживает традиционный русский молитвенный регистр. Надписание отделено от основной строки псалма.
