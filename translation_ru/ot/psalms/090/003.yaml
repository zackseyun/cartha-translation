base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/003.yaml
  text: You return man to dust[a], and say, “Return[b], sons of man.”
translation:
  language: ru
  text: 'Ты возвращаешь человека в прах[a] и говоришь: «Вернитесь, сыны человеческие[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до полного сокрушения» или «в состояние сокрушения». Еврейское слово обозначает нечто раздробленное или превращённое в порошок; в данном контексте «прах» естественно передаёт этот смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыны человека»; возможно также: «сыны Адама», то есть люди.'
    reason: alternative_reading
lexical_decisions:
- source_word: תָּשֵׁב
  choice: возвращаешь
  rationale: Каузативная форма глагола שׁוב означает «возвращать, обращать назад»; настоящее время естественно передаёт обобщённое поэтическое утверждение.
- source_word: אֱנוֹשׁ
  choice: человека
  rationale: Слово обозначает человека как слабое и смертное существо; единственное число сохраняет собирательный характер оригинала.
- source_word: עַד דַּכָּא
  choice: в прах
  rationale: דַּכָּא указывает на раздробленное, превращённое в порошок состояние. «В прах» естественно выражает результат и соответствует контексту человеческой смертности, не исключая буквального образа сокрушения.
- source_word: וַתֹּאמֶר
  choice: и говоришь
  rationale: Настоящее время согласуется с обобщённым характером строки и прямым обращением к Богу.
- source_word: שׁוּבוּ
  choice: Вернитесь
  rationale: Повелительное множественного числа от שׁוב; повтор корня передан однокоренными словами «возвращаешь — вернитесь».
- source_word: בְנֵי אָדָם
  choice: сыны человеческие
  rationale: Традиционно-поэтическое, но понятное русское выражение сохраняет буквальный образ «сынов человека/Адама» и обозначает людей вообще.
theological_decisions:
- issue: Смысл возвращения человека
  choice: возвращение в прах
  alternative: доведение до сокрушения
  rationale: Контекст псалма говорит о человеческой смертности, поэтому «прах» уместно передаёт образ, однако лексическая неоднозначность דַּכָּא отмечена в сноске.
- issue: Передача בְנֵי אָדָם
  choice: сыны человеческие
  alternative: сыны Адама; люди
  rationale: Выбранный вариант сохраняет антропологический образ оригинала без обязательного превращения אָדָם в личное имя и при этом обозначает всё человечество.
translation_notes:
  register: Современный литературный русский с торжественной поэтической окраской. Формы «сыны человеческие» сохраняют достоинство псалма и образность еврейского текста; лексическая связь שׁוב передана повтором «возвращаешь — вернитесь».
