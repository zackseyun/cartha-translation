  text: בַּ֭/בֹּקֶר יָצִ֣יץ וְ/חָלָ֑ף לָ֝/עֶ֗רֶב יְמוֹלֵ֥ל וְ/יָבֵֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/006.yaml
  text: In the morning it sprouts and flourishes[c][b][a]; by evening it withers and dries up.
translation:
  language: ru
  text: Утром она даёт ростки[a] и разрастается[b], а к вечеру увядает[c] и засыхает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «расцветает». Еврейский глагол может обозначать как появление ростков, так и цветение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или, буквальнее: «и проходит» либо «и сменяется». В образе растительности это слово, вероятно, указывает на дальнейший рост или обновление.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «срезается». Еврейский глагол здесь может обозначать как увядание, так и срезание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Утром
  rationale: Естественно передаёт временное выражение и подчёркивает контраст между утром и вечером.
- source_word: יָצִיץ
  choice: она даёт ростки
  rationale: Глагол обозначает появление ростков или цветение; выбранный вариант ясно передаёт начало краткого жизненного цикла травы.
- source_word: וְחָלָף
  choice: и разрастается
  rationale: В растительном образе глагол может описывать дальнейший рост или обновление, хотя его основное значение допускает также движение, смену или прохождение; контекстуальный перевод сохраняет последовательность роста и увядания.
- source_word: לָעֶרֶב
  choice: а к вечеру
  rationale: Передаёт резкий временной контраст и быстроту перехода от роста к гибели.
- source_word: יְמוֹלֵל
  choice: увядает
  rationale: В данном растительном контексте выражает увядание или поблёкшее состояние, не вводя без необходимости внешнего деятеля; возможное значение «срезается» отмечено в сноске.
- source_word: וְיָבֵשׁ
  choice: и засыхает
  rationale: Точно и естественно передаёт высыхание растения как заключительную стадию его увядания.
