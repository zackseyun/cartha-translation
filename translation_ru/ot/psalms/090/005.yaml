lexical_decisions:
- source_word: זְרַמְתָּם
  choice: Ты сметаешь их потоком
  rationale: Глагол זָרַם передаёт унесение бурным потоком. Такой перевод сохраняет водный образ и одновременно естественно выражает внезапность исчезновения.
- source_word: שֵׁנָה
  choice: словно сон
  rationale: Существительное буквально означает «сон» или «состояние сна». В сжатой поэтической конструкции сравнение «словно сон» естественно передаёт мимолётность, не устраняя буквальной возможности понимания как «сон» в значении сна-состояния.
- source_word: יִהְיוּ
  choice: они словно
  rationale: Имперфект множественного числа здесь имеет описательное, обобщающее значение. Настоящее время естественно для русского поэтического изложения.
- source_word: בַּבֹּקֶר
  choice: Поутру
  rationale: Краткая литературная форма сохраняет временной акцент и поэтический ритм.
- source_word: כֶּחָצִיר
  choice: как трава
  rationale: חָצִיר обозначает траву или зелень; «трава» ясно и традиционно передаёт образ непрочной человеческой жизни.
- source_word: יַחֲלֹף
  choice: вновь прорастает
  rationale: В контексте параллелизма со следующим стихом глагол может описывать обновление или новый рост утренней травы. Единственное число согласовано с «травой». При этом значение корня допускает и понимание «проходит», поэтому оно отмечено в сноске.
