  source_fidelity: 'Основной смысл передан верно: Бог внезапно уносит людей; они подобны сну, а утренний образ травы относится к её обновлению/прорастанию. Однако сноска c неверно оформляет альтернативу: в еврейском тексте «как трава» — часть основного образа, а не сравнительное дополнение к варианту «она проходит». Кроме того, «сметаешь их потоком» несколько неестественно по-русски и чрезмерно превращает образ глагола в орудийную конструкцию.'
