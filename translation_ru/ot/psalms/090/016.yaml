source:
  edition: WLC
  text: יֵרָאֶ֣ה אֶל עֲבָדֶ֣י/ךָ פָעֳלֶ֑/ךָ וַ֝/הֲדָרְ/ךָ֗ עַל בְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/016.yaml
  text: Let your work appear to your servants, and your splendor upon their children.
translation:
  language: ru
  text: Да явится Твоё дело рабам Твоим и Твоё величие — над их детьми.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֵרָאֶה
  choice: да явится
  rationale: Передаёт нифальную форму со значением «стать видимым, явиться» и сохраняет молитвенно-пожелательный характер стиха.
- source_word: פָעֳלֶךָ
  choice: Твоё дело
  rationale: Единственное число обозначает Божье деяние или совокупность Его действий; «дело» сохраняет ёмкость исходного выражения.
- source_word: וַהֲדָרְךָ
  choice: и Твоё величие
  rationale: הָדָר может означать великолепие, славу, величие; «величие» естественно передаёт явленное Божье великолепие без излишнего уточнения.
- source_word: עַל־בְּנֵיהֶם
  choice: над их детьми
  rationale: Сохраняет пространственно-образное значение предлога עַל («над, на») и не сводит его к простому адресату действия.
theological_decisions:
- issue: Связь Божьего величия с детьми Его рабов
  choice: «Твоё величие — над их детьми»
  alternative: «Твоё величие — их детям»
  rationale: Буквальное «над» сохраняет образ Божьего величия, пребывающего или являющегося над следующим поколением, не устраняя возможную смысловую многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Частица «да» передаёт пожелание; тире естественно восполняет опущенный во второй строке глагол. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятому благоговейному регистру.
