lexical_decisions:
- source_word: מִי
  choice: Кто
  rationale: Вопросительное местоимение вводит риторический вопрос; простое «кто» точно передаёт его силу без добавления отсутствующих в еврейском тексте слов.
- source_word: יוֹדֵעַ
  choice: знает
  rationale: Причастие от ידע означает знание или осознание. «Знает» сохраняет прямой смысл, а полнота осознания подразумевается риторическим контекстом.
- source_word: עֹז
  choice: силу
  rationale: Слово обозначает силу или мощь; «силу гнева» естественно звучит по-русски и передаёт действенную мощь, а не только степень чувства.
- source_word: אַפֶּךָ
  choice: Твоего гнева
  rationale: Хотя אַף буквально связано с носом или ноздрями, в данном устойчивом употреблении оно обозначает гнев. Перевод передаёт смысл идиомы, не внося неуместного буквального антропоморфизма.
- source_word: וּכְיִרְאָתְךָ
  choice: и… по мере страха, подобающего Тебе
  rationale: Сочетание союза, предлога сравнения/соответствия и существительного «страх» с местоименным суффиксом выражено предельно сжато. Формулировка сохраняет идею соответствия ярости благоговейному страху перед Богом, не устраняя синтаксическую неоднозначность.
- source_word: עֶבְרָתֶךָ
  choice: ярость Твою
  rationale: עֶבְרָה обозначает сильный гнев, ярость. «Ярость» сохраняет возвышенный тон и позволяет отличить это слово от стоящего ранее אַף, не скрывая их смысловой близости.
theological_decisions:
- issue: Связь между Божьей яростью и страхом в וּכְיִרְאָתְךָ עֶבְרָתֶךָ
  choice: «ярость Твою — по мере страха, подобающего Тебе»
  alternative: «и ярость Твоя соответствует страху перед Тобой»; «каков страх перед Тобой, такова и ярость Твоя»
  rationale: Еврейское выражение компактно и допускает более одного синтаксического прочтения. Основной перевод передаёт вероятную мысль о соответствии Божьей ярости тому благоговейному страху, которого Он достоин, но сноска сохраняет иные возможные связи слов и не разрешает богословское напряжение посредством парафраза.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Инверсия «ярость Твою» поддерживает поэтический параллелизм; прописные местоимения выбраны как допустимая традиционная форма обращения к Богу.
