  naturalness: '«Ярость Твою — по мере страха, подобающего Тебе» звучит в современном русском не вполне гладко: тире не разрешает синтаксическую связь, а «страх, подобающий Тебе» тяжеловесно. «Твою ярость по мере благоговейного страха перед Тобой» естественнее в возвышенном литературном регистре и сохраняет вопросительную, поэтическую неполноту оригинала.'
