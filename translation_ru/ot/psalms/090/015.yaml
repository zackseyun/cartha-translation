lexical_decisions:
- source_word: שַׂמְּחֵנוּ
  choice: Радуй нас
  rationale: Пиэльный императив с суффиксом 1-го лица множественного числа выражает просьбу к Богу даровать радость. «Радуй нас» естественно передаёт каузативно-просительный смысл и сохраняет словесную связь с радостью.
- source_word: כִּימוֹת
  choice: столько же дней, сколько
  rationale: Предлог כ в этой сравнительной конструкции выражает соответствие или соразмерность. Такая формулировка ясно передаёт просьбу о радости, соразмерной времени прежнего страдания.
- source_word: עִנִּיתָנוּ
  choice: Ты подвергал нас страданиям
  rationale: Пиэль глагола ענה здесь означает причинение страдания или уничижение. Выбранный вариант сохраняет широкий смысл бедствия и не сужает его до внутреннего смирения либо человеческого угнетения.
- source_word: שְׁנוֹת
  choice: столько же лет, сколько
  rationale: Конструктивная форма множественного числа продолжает параллель с «днями»; повтор сравнительной конструкции сохраняет соразмерность и поэтический параллелизм.
- source_word: רָאִינוּ
  choice: мы видели
  rationale: Буквальная передача глагола сохраняет библейский образ пережитого как увиденного; по-русски выражение остаётся понятным и естественным.
- source_word: רָעָה
  choice: бедствие
  rationale: В данном контексте רעה обозначает пережитую невзгоду или несчастье, а не нравственное зло. «Бедствие» соответствует плачевному контексту и параллели со страданиями.
theological_decisions:
- issue: Значение רָעָה в связи с действием Бога
  choice: Переведено как пережитое «бедствие», а не нравственное зло.
  alternative: зло; несчастье; страдание
  rationale: Контекст противопоставляет даруемую Богом радость прежним страданиям общины. Перевод не приписывает Богу нравственного зла, но и не ослабляет прямого указания текста на Божье действие в словах «Ты подвергал нас страданиям».
- issue: Соразмерность радости и страдания
  choice: «столько же дней, сколько… столько же лет, сколько»
  alternative: «по числу дней… по числу лет»; «за дни… за годы»
  rationale: Еврейская конструкция допускает идею соответствия меры. Выбранная формулировка сохраняет просьбу о радости, соразмерной длительности бедствия, не превращая стих в утверждение о механическом воздаянии.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Повтор «столько же… сколько» сохраняет еврейский параллелизм и ясно передаёт соразмерность; прописное «Ты» соответствует уважительному обращению к Богу в русском религиозном тексте.
