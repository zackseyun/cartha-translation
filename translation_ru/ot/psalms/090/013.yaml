  yaml_path: translation/ot/psalms/090/013.yaml
  text: Return[a], O Yahweh—how long? And have compassion on your servants.
translation:
  language: ru
  text: Вернись, Яхве! Доколе? Сжалься[a] над Твоими слугами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «измени решение относительно Твоих слуг».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: Вернись
  rationale: Повелительная форма глагола שוב, обращённая к Яхве. «Вернись» сохраняет прямой пространственно-отношенческий образ молитвы-плача и не переносит сюда оттенок перемены решения, выраженный следующим глаголом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве», а не заменяющим его титулом.
- source_word: עַד מָתָי
  choice: Доколе?
  rationale: Устойчивое, краткое и выразительное русское соответствие формуле плача «до каких пор?», уместное в современной литературной библейской речи.
- source_word: וְהִנָּחֵם
  choice: Сжалься
  rationale: Нифаль императива נחם может обозначать сожаление, перемену намерения или движение сострадания. «Сжалься» естественно передаёт просьбу о милости, не приписывая Богу нравственного проступка; оттенок перемены решения отмечен в сноске.
- source_word: עַל
  choice: над
  rationale: При глаголе «сжалиться» объект естественно оформляется по-русски сочетанием «сжалиться над».
- source_word: עֲבָדֶיךָ
  choice: Твоими рабами
  rationale: «Рабы» — традиционное и семантически точное обозначение принадлежащих Богу и служащих Ему людей; в молитвенном контексте оно не сводится к современному социальному институту рабства.
theological_decisions:
- issue: Передача נחם применительно к Богу
  choice: Сжалься
  alternative: Отмени Свой гнев на Твоих рабов / перемени решение о Твоих рабах
  rationale: Основной текст сохраняет аффективный оттенок сострадания и избегает слова «раскайся», которое в современном русском обычно подразумевает признание нравственной вины. Сноска сохраняет реально присутствующий оттенок отказа от прежнего действия или намерения, не устраняя богословское напряжение.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. «Доколе?» сохраняет лаконизм и напряжённость еврейского плача; прописные местоимения в обращении к Богу поддерживают принятый русский библейский регистр.
