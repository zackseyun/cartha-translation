base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/007.yaml
  text: For we are consumed by your anger[b][a], and by your wrath we are terrified.
translation:
  language: ru
  text: Ибо от Твоего гнева мы гибнем[a], от Твоей ярости мы в ужасе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мы приходим к концу»; еврейский глагол может означать, что нечто исчерпывается, заканчивается или прекращает существовать.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мы в смятении», «мы потрясены»; еврейский глагол выражает тревогу, смятение или ужас.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение сказанного выше; «ибо» естественно передаёт причинно-пояснительную связь и сохраняет возвышенный поэтический регистр.
- source_word: כָלִינוּ
  choice: мы гибнем
  rationale: Глагол כלה обозначает исчерпание, завершение или прекращение существования. «Мы гибнем» естественно по-русски передаёт тяжесть действия Божьего гнева, не сводя смысл только к физическому уничтожению.
- source_word: בְאַפֶּךָ
  choice: от Твоего гнева
  rationale: Предлог ב в данном контексте имеет причинное или орудийное значение; русское «от» ясно выражает гнев как причину гибели.
- source_word: חֲמָתְךָ
  choice: Твоей ярости
  rationale: חֵמָה означает пылающий, сильный гнев. «Ярость» сохраняет усиление по отношению к אַף и не сливает два параллельных еврейских слова в одно.
- source_word: נִבְהָלְנוּ
  choice: мы в ужасе
  rationale: Форма от בהל выражает состояние сильной тревоги, потрясения или страха. «Мы в ужасе» звучит естественно и передаёт интенсивность реакции, сохраняя возможность более широкого оттенка смятения в сноске.
theological_decisions:
- issue: Передача двух обозначений Божьего гнева в поэтическом параллелизме
  choice: 'Сохранены разные слова: «гнев» и «ярость»'
  alternative: Передать оба еврейских слова одним русским словом либо использовать пару «гнев» и «пыл»
  rationale: В еврейском тексте употреблены связанные, но разные слова אַף и חֵמָה. Их различение сохраняет поэтическое усиление, не добавляя особого доктринального смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Краткий параллелизм оригинала сохранён; повтор «мы» подчёркивает симметрию двух полустиший.
