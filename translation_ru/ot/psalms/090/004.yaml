  yaml_path: translation/ot/psalms/090/004.yaml
  text: For a thousand years in your sight are like yesterday when it is past[c][b][a], or like a watch in the night.
translation:
  language: ru
  text: Ибо тысяча лет в Твоих глазах — как вчерашний день, когда он прошёл,[a] и как ночная стража.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда он проходит». Еврейское выражение допускает несколько иной временной оттенок.'
    reason: lexical_alternative
  - marker: b
    text: Стража — одна из частей, на которые делили ночь для несения караула.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предыдущей мысли; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: אֶלֶף שָׁנִים
  choice: тысяча лет
  rationale: Прямой перевод числового выражения сохраняет поэтическое сопоставление Божьего и человеческого восприятия времени.
- source_word: בְּעֵינֶיךָ
  choice: в Твоих глазах
  rationale: Сохранён образ еврейского текста, обозначающий Божью точку зрения, без отвлечённого философского истолкования.
- source_word: כְּיוֹם אֶתְמוֹל
  choice: как вчерашний день
  rationale: Естественное русское выражение точно передаёт образ уже ушедшего дня.
- source_word: כִּי יַעֲבֹר
  choice: когда он миновал
  rationale: Придаточное определяет вчерашний день как уже прошедший; форма «миновал» естественна по-русски, а возможный оттенок процесса отмечен в сноске.
- source_word: וְאַשְׁמוּרָה
  choice: и как стража
  rationale: Союз וְ передан как «и», а подразумеваемый показатель сравнения повторён для ясности русского текста.
- source_word: אַשְׁמוּרָה בַלָּיְלָה
  choice: стража в ночи
  rationale: Формулировка сохраняет конкретный древний образ периода ночного караула; его культурное значение пояснено в сноске.
theological_decisions:
- issue: Антропоморфный образ Божьего восприятия времени
  choice: Сохранить выражение «в Твоих глазах» и оба временных сравнения без философского расширения.
  alternative: 'Передать обобщённо: «для Тебя тысяча лет — ничто» или истолковать стих как прямое утверждение о Божьей вневременности.'
  rationale: Еврейский текст выражает контраст посредством поэтических образов, но не формулирует отвлечённое учение о природе времени.
translation_notes:
  register: Современный литературный русский язык с поэтической сдержанностью. Сохранены образ «в Твоих глазах», параллельные сравнения и традиционно узнаваемое, но пояснённое слово «стража».
