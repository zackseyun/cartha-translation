  terminology: «Бог» точно передаёт אֵל. «Произвёл на свет» сохраняет генеративный образ исходного глагола, не сводя его к нейтральному «создал». Примечание об альтернативе «Ты родил землю и мир» прозрачно объясняет родовую/родильную образность, хотя сама альтернатива намеренно менее обычна для русского употребления с мужским субъектом.
