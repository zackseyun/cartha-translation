  text: בְּ/טֶ֤רֶם הָ֘רִ֤ים יֻלָּ֗דוּ וַ/תְּח֣וֹלֵֽל אֶ֣רֶץ וְ/תֵבֵ֑ל וּֽ/מֵ/עוֹלָ֥ם עַד ע֝וֹלָ֗ם אַתָּ֥ה אֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/002.yaml
  text: Before the mountains were born[a], and you brought forth the earth and the world, from everlasting to everlasting you are God.
translation:
  language: ru
  text: Прежде чем родились горы и Ты произвёл на свет[a] землю и мир, от века и до века Ты — Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты родил землю и мир»; еврейский глагол сохраняет образ родов и рождения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: прежде чем
  rationale: 'Естественно передаёт временное значение: речь идёт о времени до возникновения творения.'
- source_word: הָרִים יֻלָּדוּ
  choice: родились горы
  rationale: Сохраняет страдательное значение глагола ילד и поэтический образ рождения гор.
- source_word: וַתְּחוֹלֵל
  choice: Ты произвёл на свет
  rationale: Передаёт образ родов и рождения, заложенный в глаголе, но звучит естественнее по-русски, чем буквальное «Ты родил».
- source_word: אֶרֶץ וְתֵבֵל
  choice: землю и мир
  rationale: В космическом контексте אֶרֶץ означает землю, а תֵבֵל — мир, в особенности обитаемый и устроенный мир.
- source_word: וּמֵעוֹלָם עַד עוֹלָם
  choice: от века и до века
  rationale: Сохраняет еврейскую идиому неограниченной длительности в обоих направлениях и её возвышенное поэтическое звучание.
- source_word: אַתָּה אֵל
  choice: Ты — Бог
  rationale: Явное местоимение сохранено ради смыслового ударения; именная конструкция естественно передана с тире.
theological_decisions:
- issue: Антропоморфный образ рождения при описании творения
  choice: 'Сохранить образ рождения: горы «родились», а Бог «произвёл на свет» землю и мир.'
  alternative: 'Передать нейтрально: «сотворил» или «создал».'
  rationale: Еврейский текст намеренно использует лексику рождения и родовых мук. Её сохранение передаёт поэтическую силу стиха, не превращая метафору в утверждение о физическом способе творения.
- issue: Выражение вечности Бога
  choice: от века и до века Ты — Бог
  alternative: из вечности в вечность Ты — Бог
  rationale: Выбранный вариант сохраняет форму еврейской идиомы и утверждает безграничность Божьего бытия, не добавляя позднейшей философской терминологии.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим ритмом. Местоимение «Ты» написано с прописной буквы как уместная в библейском обращении русская издательская норма; архаическая лексика сведена к прозрачной идиоме «от века и до века».
