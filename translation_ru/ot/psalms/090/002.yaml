  source_fidelity: Русский текст точно передаёт временное предшествование Бога творению, образ рождения гор и образ родов/порождения земли и мира. Союз «и» соответствует וְ в еврейском тексте; «земля и мир» удачно передаёт אֶרֶץ וְתֵבֵל в космическом параллелизме. «От века и до века» адекватно выражает מֵעוֹלָם עַד־עוֹלָם, не добавляя философских уточнений.
