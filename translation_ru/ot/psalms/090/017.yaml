  text: וִ/יהִ֤י נֹ֤עַם אֲדֹנָ֥/י אֱלֹהֵ֗י/נוּ עָ֫לֵ֥י/נוּ וּ/מַעֲשֵׂ֣ה יָ֭דֵי/נוּ כּוֹנְנָ֥/ה עָלֵ֑י/נוּ וּֽ/מַעֲשֵׂ֥ה יָ֝דֵ֗י/נוּ כּוֹנְנֵֽ/הוּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/090/017.yaml
  text: May the favor of the Lord our God be upon us[a], and establish the work of our hands upon us; yes[c][b], establish the work of our hands.
translation:
  language: ru
  text: Да будет благоволение Господа, Бога нашего, на нас[a], и дело рук наших утверди для нас[b]; и дело рук наших — утверди его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «красота», «приятность» или «отрада» Господа, Бога нашего.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «утверди дело рук наших на нас»; предлог также можно понимать как указание на действие ради нас или для нашего блага.'
    reason: source_ambiguity
  - marker: c
    text: 'В еврейском тексте просьба повторена для усиления: «и дело рук наших — утверди его».'
    reason: literary_structure
lexical_decisions:
- source_word: וִיהִי
  choice: Да будет
  rationale: Юссивная форма выражает молитвенное пожелание; «да будет» естественно передаёт его в возвышенном, но современном русском регистре.
- source_word: נֹעַם
  choice: благоволение
  rationale: Слово обозначает приятность, красоту или расположение. В молитве о прочности человеческого труда «благоволение» передаёт контекстуальный смысл Божьего милостивого расположения, не исключая прочих оттенков.
- source_word: אֲדֹנָי אֱלֹהֵינוּ
  choice: Господа, Бога нашего
  rationale: Сохраняются оба божественных наименования и притяжательная форма первого лица множественного числа.
- source_word: עָלֵינוּ
  choice: на нас / для нас
  rationale: В первом употреблении предлог естественно обозначает пребывание благоволения «на нас»; во втором при глаголе утверждения русское «для нас» ясно передаёт возможный бенефактивный смысл, тогда как буквальное повторение «на нас» было бы неясным.
- source_word: מַעֲשֵׂה יָדֵינוּ
  choice: дело рук наших
  rationale: Сохраняет конкретный древнееврейский образ человеческого труда и звучит понятно в русской поэтической речи.
- source_word: כּוֹנְנָה / כּוֹנְנֵהוּ
  choice: утверди / утверди его
  rationale: Глагол означает сделать прочным, устойчивым. Во второй строке сохранено местоименное дополнение мужского рода, относящееся к «делу».
theological_decisions:
- issue: Смысл Божьего נֹעַם в молитве
  choice: благоволение
  alternative: красота, приятность, отрада
  rationale: Контекст связывает Божье נֹעַם с просьбой утвердить человеческий труд, поэтому «благоволение» наиболее естественно выражает Божье милостивое расположение; лексическая многозначность отмечена в сноске.
- issue: Передача второго עָלֵינוּ
  choice: для нас
  alternative: на нас
  rationale: Предлог допускает отнесение действия к молящимся или их благу. «Для нас» даёт понятный русский смысл, а буквальная форма сохранена в сноске, чтобы не скрывать неоднозначность.
- issue: Повтор заключительной просьбы
  choice: сохранить повтор с местоимением «его»
  alternative: сгладить повтор или добавить усилительное «да»
  rationale: Древнееврейский текст повторяет просьбу и во второй раз содержит явное местоименное дополнение. Сохранение структуры передаёт поэтическое усиление без добавления отсутствующего в оригинале слова.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Инверсия «дело рук наших» сохраняет образ и параллелизм, оставаясь понятной. Пунктуация подчёркивает настойчивый заключительный повтор.
