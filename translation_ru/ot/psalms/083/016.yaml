lexical_decisions:
- source_word: מַלֵּא
  choice: Покрой
  rationale: Пиэль, повелительное наклонение, 2-е лицо мужского рода единственного числа, обращённое к Богу. Буквально глагол означает «наполни», однако сочетание «наполни их лица позором» в современном русском звучит неестественно; «покрой их лица позором» естественно передаёт образ всецелого, видимого бесчестья.
- source_word: פְנֵיהֶם
  choice: их лица
  rationale: Форма множественного числа с суффиксом 3-го лица множественного числа. Перевод сохраняет еврейский образ видимого, публичного посрамления.
- source_word: קָלוֹן
  choice: позором
  rationale: Слово обозначает стыд, бесчестье или позор. «Позор» естественно сочетается в русском с образом покрытых лиц и допускает как внутреннее чувство стыда, так и публичное унижение.
- source_word: וִיבַקְשׁוּ
  choice: чтобы они искали
  rationale: Имперфект 3-го лица множественного числа с союзом после повелительной формы, вероятно, выражает цель или результат. «Чтобы они искали» передаёт эту связь, не утверждая, что искание непременно состоится.
- source_word: שִׁמְךָ
  choice: Твоего имени
  rationale: Буквальный перевод сохраняет библейское выражение, охватывающее явленную личность, славу и репутацию Бога, без поясняющего истолкования в основном тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан принятой русской транслитерацией личного имени Бога, а не заменён титулом «Господь».
theological_decisions:
- issue: Цель Божьего суда
  choice: Просимое посрамление представлено как ведущее к тому, чтобы враги искали имя Яхве.
  alternative: «И пусть они ищут Твоего имени» — простое продолжение прошения без явно выраженного значения цели.
  rationale: Еврейский имперфект с союзом после императива может выражать цель или результат. Контекст допускает понимание суда как направленного к признанию Бога, но не гарантирует покаяния; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Конструкция «Покрой их лица позором» предпочтена буквальному, но неестественному «Наполни их лица позором». Местоимение «Твоего» написано с прописной буквы в соответствии с распространённой русской практикой благоговейного обращения к Богу.
