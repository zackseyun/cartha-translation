lexical_decisions:
- source_word: גְּבָל
  choice: Гевал
  rationale: Сохранена транслитерация еврейского топонима; возможное историческое отождествление с Библом не подменяет форму исходного текста.
- source_word: וְעַמּוֹן
  choice: Аммон
  rationale: Употреблена традиционная русская форма названия народа и земли.
- source_word: וַעֲמָלֵק
  choice: Амалик
  rationale: Употреблена закрепившаяся в русской библейской традиции форма национального имени.
- source_word: פְּלֶשֶׁת
  choice: Филистия
  rationale: Еврейское слово обозначает страну или область; перевод сохраняет это значение, не заменяя его прямо названием народа.
- source_word: עִם
  choice: вместе с
  rationale: Естественно передаёт присоединение последнего участника к перечню.
- source_word: יֹשְׁבֵי צֽוֹר
  choice: жителями Тира
  rationale: Конструктивное сочетание буквально означает жителей, или обитателей, Тира; выбран современный естественный эквивалент.
- source_word: צֽוֹר
  choice: Тир
  rationale: Использована общепринятая русская форма топонима.
