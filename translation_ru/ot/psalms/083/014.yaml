    и как пламя охватывает горы,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּאֵשׁ
  choice: как огонь
  rationale: Предлог כְּ вводит сравнение; «как огонь» естественно передаёт поэтический образ и сохраняет параллелизм со второй строкой.
- source_word: תִּבְעַר
  choice: сжигает
  rationale: Форма Qal от בער обозначает действие огня. «Сжигает» естественно сочетается с объектом «лес» и передаёт более сильное воздействие, чем непереходное «горит».
- source_word: יָעַר
  choice: лес
  rationale: Существительное означает «лес, лесистая местность». В русском обобщённом сравнении нулевой артикль передаётся без дополнительных определителей.
- source_word: וּכְלֶהָבָה
  choice: как пламя
  rationale: לֶהָבָה означает «пламя», а сравнительный כְּ начинает параллельный образ; союз естественно не повторён по-русски между двумя однородными сравнительными строками.
- source_word: תְּלַהֵט
  choice: опаляет
  rationale: Piel от להט выражает интенсивное действие жара или пламени. «Опаляет» сохраняет образ сильного огненного воздействия и не добавляет отсутствующего в тексте явного значения начала горения.
- source_word: הָרִים
  choice: горы
  rationale: Слово означает «горы»; определённость, выраженная еврейским артиклем, в русском здесь естественно передаётся контекстом без указательного слова.
