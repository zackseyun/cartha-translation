    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Форма с суффиксом первого лица единственного числа употреблена как прямое обращение; русский звательный оборот «Боже мой» естественен и точно передаёт молитвенный призыв.
- source_word: שִׁיתֵמוֹ
  choice: сделай их
  rationale: В данном контексте императив שׁית вводит два сравнительных образа; «сделай их подобными» естественно передаёт каузативный смысл просьбы.
- source_word: כַגַּלְגַּל
  choice: подобными перекати-полю
  rationale: גַּלְגַּל буквально может обозначать колесо или нечто катящееся и кружащееся. «Перекати-поле» сохраняет образ предмета, гонимого ветром, и соответствует параллели с соломой, при этом лексическая неоднозначность отмечена в сноске.
- source_word: כְּקַשׁ
  choice: как солому
  rationale: קַשׁ означает солому или сухую стерню, а не собственно мякину. «Солома» сохраняет прямое сельскохозяйственное значение и остаётся понятным образом лёгкого материала, уносимого ветром.
- source_word: לִפְנֵי רוּחַ
  choice: гонимую ветром
  rationale: Идиома буквально означает «перед ветром», то есть подхваченную и несомую им. Причастная конструкция естественна по-русски и ясно выражает динамику образа.
