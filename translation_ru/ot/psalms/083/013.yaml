  text: My God[a], make them like whirling dust[b], like chaff before the wind.
translation:
  language: ru
  text: Боже мой, сделай их как кружащуюся пыль[a], как солому перед ветром[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как колесо»; еврейское גַּלְגַּל может обозначать колесо либо нечто катящееся и кружащееся.'
    reason: lexical_alternative
  - marker: b
