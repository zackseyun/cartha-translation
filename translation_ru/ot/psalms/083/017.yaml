  text: Пусть они будут посрамлены и охвачены ужасом навеки[a]; пусть они будут опозорены и погибнут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть они устыдятся… пусть они будут посрамлены»; в еврейском тексте употреблены два близких по значению слова, обозначающих стыд и позор (בוש, חפר).'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: пусть они будут посрамлены
  rationale: Qal imperfect 3-го лица множественного числа от בוש в контексте молитвенного пожелания. «Будут посрамлены» естественно передаёт состояние позора и сохраняет страдательно-результативный оттенок.
- source_word: וְיִבָּהֲלוּ
  choice: и охвачены ужасом
  rationale: Niphal imperfect 3-го лица множественного числа от בהל обозначает смятение, потрясение или ужас. Оборот «охвачены ужасом» передаёт интенсивность и грамматически подчиняется начальному «пусть».
- source_word: עֲדֵי עַד
  choice: навеки
  rationale: Усиленное обозначение продолжительности, буквально близкое к «до вечности»; «навеки» звучит естественно и торжественно в современном русском.
- source_word: וְיַחְפְּרוּ
  choice: пусть они будут унижены
  rationale: חפר здесь относится к стыду и унижению. Выбор «унижены» сохраняет отличие от близкого по смыслу בוש и подчёркивает утрату достоинства.
- source_word: וְיֹאבֵדוּ
  choice: и погибнут
  rationale: Qal imperfect 3-го лица множественного числа от אבד имеет широкий смысл «погибнуть, исчезнуть, быть уничтоженным». «Погибнут» не уточняет способ гибели и сохраняет молитвенно-пожелательную силу ряда.
theological_decisions:
- issue: Пожелательная сила форм imperfect
  choice: Передать последовательность как молитвенное пожелание с «пусть»
  alternative: «Они будут посрамлены… они погибнут» как простое предсказание
  rationale: В контексте псалма формы imperfect выражают просьбу или пожелание суда над врагами, а не только сообщение о будущем.
- issue: Соотношение двух слов со значением стыда
  choice: Развести בוש и חפר как «посрамлены» и «унижены»
  alternative: Оба раза перевести словом «пристыжены» или «посрамлены»
  rationale: Еврейские слова близки по значению, но их различение в переводе сохраняет поэтическое нарастание, не превращая его в строгое богословское разграничение.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-поэтической речи. Начальное «пусть» сохраняет просительный характер стиха; во второй половине оно повторено ради ясности и параллелизма. Маркер [a] помещён после «навеки», как в консультационном тексте.
