  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי הִנֵּה
  choice: Ведь вот
  rationale: Передаёт причинно-пояснительное כִּי и привлекающее внимание הִנֵּה, сохраняя связь со стихом 1 и живую выразительность.
- source_word: יֶהֱמָיוּן
  choice: шумят
  rationale: Глагол обозначает громкий гул, рёв или бурное волнение; «шумят» естественно по-русски и сохраняет образ враждебного многоголосого возбуждения.
- source_word: נָשְׂאוּ רֹאשׁ
  choice: подняли голову
  rationale: Сохранена еврейская идиома, выражающая дерзость, уверенное выступление или возвышение; контекст не требует сводить её к одному толкованию.
theological_decisions:
- issue: К кому обращены слова «Твои» и «Тебя»
  choice: Сохранено прямое обращение к Богу с прописной буквы по русской издательской традиции
  alternative: Строчные «твои», «тебя»
  rationale: Грамматика прямо указывает на адресата предыдущего стиха; прописная буква служит только уважительным оформлением и не добавляет богословского содержания.
- issue: Смысл выражения «подняли голову»
  choice: Сохранён образ без поясняющей конкретизации
  alternative: «возгордились» или «дерзко выступили»
  rationale: Исходная идиома допускает оттенки гордости, дерзости и обретённой силы; буквальный естественный русский образ сохраняет эту многозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Обращение к Богу оформлено традиционными прописными местоимениями; архаизмы и избыточное толкование устранены.
