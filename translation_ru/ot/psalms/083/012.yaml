lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: которые говорили
  rationale: Относительное местоимение связывает строку с врагами из предшествующего контекста; перфект אָמְרוּ передаёт их высказанное намерение. В русском поэтическом контексте несовершенный вид естественно представляет характерные речи перечисляемых врагов.
- source_word: נִירֲשָׁה
  choice: Завладеем
  rationale: Форма когортатива от ירשׁ выражает совместное побуждение и в воинственном контексте означает овладеть, получить во владение; «завладеем» кратко передаёт и намерение, и захват.
- source_word: לָּנוּ
  choice: включено в значение «завладеем»
  rationale: Конструкция указывает на приобретение для себя. Русский глагол «завладеть» уже подразумевает присвоение, поэтому отдельное «себе» было бы возможно, но стилистически избыточно.
- source_word: נְאוֹת
  choice: пастбищами
  rationale: Слово может обозначать пастбища, обители или места обитания. «Пастбища» сохраняет конкретный образ еврейского текста и не сужает значение до святилищ.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В контексте псалма речь идёт о Боге Израиля; родительный падеж естественно передаёт принадлежность.
theological_decisions:
- issue: Значение נְאוֹת אֱלֹהִים
  choice: пастбищами Бога
  alternative: обителями Бога; жилищами Бога
  rationale: Выражение может обозначать принадлежащие Богу пастбищные земли либо Его обители и места пребывания. Основной текст сохраняет предметный пасторальный образ, а примечание — смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, поэтическая и достойная. Восклицательный знак передаёт решительное побуждение когортатива, не добавляя конфессионального толкования.
