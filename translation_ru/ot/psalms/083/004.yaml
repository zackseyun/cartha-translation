lexical_decisions:
- source_word: אָמְרוּ
  choice: Они говорят
  rationale: Перфект qal, 3-е лицо множественного числа, в поэтическом повествовании передан настоящим временем для живости и как выражение продолжающегося замысла врагов.
- source_word: לְכוּ
  choice: Пойдём
  rationale: Императив множественного числа от הלך здесь служит побуждением к совместному действию; русское «Пойдём» естественно вводит предложение заговорщиков.
- source_word: וְנַכְחִידֵם
  choice: истребим их
  rationale: Форма hiphil, 1-е лицо множественного числа, с суффиксом 3-го лица множественного числа выражает намерение заставить исчезнуть, уничтожить; «истребим» сохраняет силу и целенаправленность.
- source_word: מִגּוֹי
  choice: чтобы они перестали быть народом
  rationale: Сочетание מן с גוי обозначает устранение из состояния национального существования, то есть цель лишить Израиль бытия как народа.
- source_word: וְלֹא יִזָּכֵר
  choice: и ... больше не вспоминалось
  rationale: Niphal imperfect от זכר сохраняет пассивно-безличный смысл «не быть вспоминаемым»; по-русски естественно передано безличной формой.
- source_word: שֵׁם יִשְׂרָאֵל
  choice: имя Израиля
  rationale: Прямо передаёт конструктивное сочетание и сохраняет библейский образ имени как обозначения идентичности и существования.
- source_word: עוֹד
  choice: больше не
  rationale: В отрицательном контексте עוד означает «уже не», «больше не»; выбран современный и естественный русский оборот.
