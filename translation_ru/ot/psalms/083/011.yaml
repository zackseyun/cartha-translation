  text: שִׁיתֵ֣/מוֹ נְ֭דִיבֵ/מוֹ כְּ/עֹרֵ֣ב וְ/כִ/זְאֵ֑ב וּֽ/כְ/זֶ֥בַח וּ֝/כְ/צַלְמֻנָּ֗ע כָּל נְסִיכֵֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/011.yaml
  text: Make their nobles like Oreb and Zeeb[a], and all their princes like Zebah and Zalmunna.
translation:
  language: ru
  text: Поступи с их знатными, как с Оревом и Зеевом,[a] и со всеми их князьями — как с Зевахом и Цалмунной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Орев и Зеев — мадианитянские предводители, побеждённые в Судей 7:25; Зевах и Цалмунна — мадианитянские цари, побеждённые в Судей 8:5–21.
    reason: cross_reference
lexical_decisions:
- source_word: שִׁיתֵמוֹ
  choice: Сделай с их… как с…
  rationale: Императив, обращённый к Богу. Русская конструкция «сделай с ними, как с…» естественно передаёт подразумеваемую просьбу подвергнуть вражеских предводителей той же участи, что и названных лиц.
- source_word: נְדִיבֵמוֹ
  choice: их знатными
  rationale: נָדִיב здесь обозначает знатных, влиятельных предводителей; «знатные» сохраняет отличие от נְסִיכֵמוֹ во второй половине стиха.
- source_word: כְּעֹרֵב וְכִזְאֵב
  choice: как с Оревом и Зевом
  rationale: Имена переданы в традиционной русской библейской форме; сравнительная сила обеих еврейских частиц כ сохраняется общей конструкцией «как с».
- source_word: וּכְזֶבַח וּכְצַלְמֻנָּע
  choice: как с Зевеем и Салманом
  rationale: Сохранены традиционные русские формы имён из повествования о мадианитянах; повтор сравнительной частицы естественно выражен одной конструкцией перед парой имён.
- source_word: כָּל נְסִיכֵמוֹ
  choice: со всеми их князьями
  rationale: כָּל передано явно как «всеми», а נָסִיךְ — как «князья», что сохраняет высокий политический регистр и параллелизм со «знатными».
theological_decisions:
- issue: Историческая аллюзия в молитве о суде
  choice: Стих просит Бога поступить с нынешними вражескими правителями так же, как прежде с конкретными мадианитянскими предводителями.
  alternative: Считать эти имена лишь обобщёнными примерами побеждённых врагов.
  rationale: Орев, Зев, Зевей и Салман — конкретные лица из Судей 7–8. Имена и сравнительная конструкция сохраняют обращение псалмопевца к прежнему Божьему избавлению, не добавляя в основной текст лишнего толкования.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Конструкция «сделай с… как с…» яснее и естественнее буквального «сделай их как…» и сохраняет подразумеваемую участь названных врагов. Использованы укоренившиеся в русской библейской традиции формы собственных имён.
