lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения естественно передаёт прямую молитвенную речь; первое божественное наименование — אֱלֹהִים.
- source_word: אַל דֳּמִי לָךְ
  choice: не безмолвствуй
  rationale: Идиома выражает просьбу к Богу не хранить молчание и не оставаться безучастным. «Не безмолвствуй» сохраняет поэтический регистр и отличается от следующего глагола.
- source_word: אַל תֶּחֱרַשׁ
  choice: не оставайся глух
  rationale: Глагол חרשׁ допускает значения глухоты и молчания. Выбор «не оставайся глух» сохраняет лексическое отличие от דמי и передаёт ощущение отсутствия ответа, не устраняя неоднозначность, которая отмечена в сноске.
- source_word: וְאַל תִּשְׁקֹט
  choice: и не пребывай в покое
  rationale: שׁקט обозначает спокойствие, тишину или бездействие. Здесь просьба направлена против Божьего кажущегося невмешательства; «не пребывай в покое» естественно завершает нарастание трёх параллельных просьб.
- source_word: אֵל
  choice: Боже
  rationale: Второе божественное наименование передано тем же естественным русским обращением, а отличие от אֱלֹהִים указано в сноске.
theological_decisions:
- issue: Передача двух божественных наименований אֱלֹהִים и אֵל
  choice: Оба переданы обращением «Боже»
  alternative: Передать אֵל как «Сильный» или «Могучий»
  rationale: В данном молитвенном контексте повтор «Боже … Боже» звучит естественно и благоговейно. Вариант «Сильный» мог бы чрезмерно конкретизировать возможный оттенок אֵל; лексическое различие сохранено в сноске.
- issue: 'Неоднозначность חרשׁ: глухота или молчание'
  choice: «не оставайся глух» с указанием альтернативы в сноске
  alternative: «не молчи» или «не храни молчания»
  rationale: Так сохраняется возможный образ Бога, словно не слышащего мольбу, а также различие между тремя параллельными глаголами. Сноска не позволяет представить этот оттенок как единственно возможный.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Трёхчастный параллелизм еврейского текста сохранён; умеренно возвышенные глаголы «безмолвствуй» и «пребывай» понятны современному читателю и не создают архаической синтаксической формы.
