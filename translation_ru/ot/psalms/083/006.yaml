lexical_decisions:
- source_word: אָהֳלֵי
  choice: шатры
  rationale: Форма сопряжённого множественного числа от אֹהֶל, буквально «шатры». Конкретный поэтический образ сохранён, хотя здесь он может метонимически обозначать народы или племена.
- source_word: אֱדוֹם
  choice: Эдома
  rationale: Собственное имя народа или страны; после слова «шатры» естественно употреблено в родительном падеже.
- source_word: יִשְׁמְעֵאלִים
  choice: измаильтян
  rationale: Множественное название народа, происходящее от имени Измаил; передано общепринятым русским этнонимом.
- source_word: מוֹאָב
  choice: Моава
  rationale: Собственное имя народа или страны; сохранена форма имени, а не заменена этнонимом «моавитяне».
- source_word: הַגְרִים
  choice: агарян
  rationale: Название народа, традиционно связанное с именем Агарь; «агаряне» — понятная и укоренённая русская форма.
