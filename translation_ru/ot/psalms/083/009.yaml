  text: עֲשֵֽׂה לָ/הֶ֥ם כְּ/מִדְיָ֑ן כְּֽ/סִֽיסְרָ֥א כְ֝/יָבִ֗ין בְּ/נַ֣חַל קִישֽׁוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/009.yaml
  text: Do to them as to Midian[a], as to Sisera, as to Jabin, at the Kishon Brook[b],
translation:
  language: ru
  text: Поступи с ними, как с Мадиамом[a], как с Сисарой, как с Иавином у потока Киссона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Сделай им, как Мадиаму, как Сисаре, как Иавину у потока Киссона».'
    reason: lexical_alternative
  - marker: b
    text: О поражении Сисары и Иавина у Киссона см. Судей 4:7, 13; 5:21.
    reason: cross_reference
lexical_decisions:
- source_word: עֲשֵׂה לָהֶם
  choice: Поступи с ними
  rationale: Буквальное «сделай им» в современном русском звучит неестественно. В данном контексте עשה с ל выражает просьбу совершить над врагами действие по образцу прежнего суда; «поступи с ними» сохраняет прямую силу повеления, не уточняя само действие сверх еврейского текста.
- source_word: כְּמִדְיָן
  choice: как с Мадиамом
  rationale: Сравнительная частица כ указывает на исторический образец Божьего действия. Русская конструкция с повтором «с» естественно продолжает «поступи с ними», при этом не вводит отсутствующего в тексте явного глагола «поступил».
- source_word: כְּסִיסְרָא כְיָבִין
  choice: как с Сисарой, как с Иавином
  rationale: Сохранён параллельный повтор сравнительной конструкции и принятые в русской библейской традиции формы имён Сисара и Иавин.
- source_word: בְּנַחַל קִישׁוֹן
  choice: у потока Киссона
  rationale: נחל обозначает поток, водоток или пересыхающее русло; «поток» является понятным и уместным обозначением названного водного объекта, а ב передаёт местное значение «у».
theological_decisions:
- issue: Неявный характер действия над врагами
  choice: Не уточнять действие как уничтожение или поражение
  alternative: «Разгроми их, как Мадиам»
  rationale: Еврейский текст употребляет общее עשה и раскрывает смысл через исторические сравнения. Более конкретный глагол устранил бы намеренную эллиптичность и усилил текст сверх источника.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной псалмовой интонацией. Повтор «как с…» передаёт параллелизм еврейской строки; традиционные формы библейских имён сохранены.
