  text: וְֽ/יֵדְע֗וּ כִּֽי אַתָּ֬ה שִׁמְ/ךָ֣ יְהוָ֣ה לְ/בַדֶּ֑/ךָ עֶ֝לְי֗וֹן עַל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/083/018.yaml
  text: Let them know that you alone[a], whose name is Yahweh[b], are the Most High over all the earth.
translation:
  language: ru
  text: Пусть узнают, что Ты, чьё имя — Яхве, один являешься Всевышним над всей землёй.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Пусть узнают
  rationale: Имперфект с союзом продолжает молитвенно-побудительный контекст предыдущих стихов; русская конструкция передаёт пожелание, а не простое будущее.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что должны узнать противники.
- source_word: אַתָּה שִׁמְךָ יְהוָה
  choice: Ты, чьё имя — Яхве
  rationale: Относительная конструкция естественно по-русски передаёт древнееврейское приложение и прямо сохраняет личное имя Бога.
- source_word: לְבַדֶּךָ
  choice: Ты один
  rationale: Передаёт усиленную исключительность, выраженную формой с местоименным суффиксом.
- source_word: עֶלְיוֹן
  choice: Всевышний
  rationale: Устоявшийся, понятный и возвышенный русский эквивалент божественного титула.
- source_word: עַל כָּל הָאָרֶץ
  choice: над всей землёй
  rationale: Предлог обозначает верховенство, а контекст требует универсального значения «земля», а не локального «страна».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя, а не титул. «Яхве» является современной научно обоснованной русской передачей; примечание указывает традиционные варианты.
- issue: К чему относится исключительность לְבַדֶּךָ
  choice: «Ты один» — только адресат является Всевышним над всей землёй
  alternative: Связать «один» преимущественно с именем Яхве
  rationale: Порядок слов допускает некоторую синтаксическую напряжённость, однако לְבַדֶּךָ естественнее подчёркивает исключительность всего утверждения о верховенстве Бога.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Заглавное «Ты» сохраняет принятый в русском религиозном письме почтительный регистр; тире выделяет именную часть и облегчает чтение сложной древнееврейской конструкции.
