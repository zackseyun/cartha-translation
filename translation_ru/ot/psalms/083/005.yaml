lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего призыва псалмопевца и естественно передаёт пояснительное значение частицы.
- source_word: נוֹעֲצוּ
  choice: сговорились
  rationale: Форма нифаль обозначает совместное совещание; в данном враждебном контексте «сговорились» естественно передаёт как взаимность действия, так и злой умысел, не делая его непременно тайным.
- source_word: לֵב יַחְדָּו
  choice: единые сердцем
  rationale: Выражение сохраняет образ сердца как средоточия намерений и передаёт согласованность участников, не заменяя метафору отвлечённым «с единой целью».
- source_word: עָלֶיךָ
  choice: против Тебя
  rationale: Контекст враждебного совещания и заключения завета требует противительного значения предлога עַל.
- source_word: בְּרִית יִכְרֹתוּ
  choice: заключают завет
  rationale: Русское «заключать завет» ясно передаёт устойчивое еврейское выражение буквально «рубить завет», сохраняя формальный и обязывающий характер соглашения.
theological_decisions:
- issue: Характер соглашения, направленного против Бога
  choice: против Тебя заключают завет
  alternative: против Тебя заключают союз
  rationale: «Завет» точнее сохраняет значение בְּרִית и весомость обязательства между сторонами, тогда как «союз» естественнее в политическом контексте, но несколько сужает исходный термин.
- issue: Степень выраженности враждебного замысла в נוֹעֲצוּ
  choice: сговорились
  alternative: совещаются
  rationale: Контекст прямо указывает на объединение против Бога, поэтому «сговорились» оправданно передаёт враждебный умысел; примечание сохраняет более нейтральное лексическое прочтение глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмовым звучанием. Местоимение «Тебя» написано с прописной буквы как обращение к Богу. Инверсия «против Тебя заключают» сохраняет смысловое ударение еврейского порядка слов.
