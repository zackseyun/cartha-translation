  - marker: b
    text: 'Или: «стали навозом на земле». Буквально: «стали навозом для земли» — образ погибших тел, оставшихся как нечистоты или удобрение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְדוּ
  choice: были истреблены
  rationale: Нифаль, перфект, 3-е лицо множественного числа от שׁמד передаёт пассивный результат полного уничтожения; «были истреблены» сохраняет силу и пассивную форму еврейского глагола.
- source_word: בְּעֵין דֹּאר
  choice: у Аэндора
  rationale: Предлог בְּ при топониме имеет локативное значение; «у Аэндора» естественно обозначает место события, не уточняя сверх текста, произошло ли оно внутри поселения или рядом с ним.
- source_word: הָיוּ
  choice: стали
  rationale: 'В сочетании с именной частью сказуемого היה допускает результативно-ингрессивный смысл: они перешли в названное состояние.'
- source_word: דֹּמֶן
  choice: навозом
  rationale: Существительное означает навоз, нечистоты; «навозом» прямо и выразительно передаёт образ крайнего унижения и тел, оставшихся удобрять землю.
- source_word: לָאֲדָמָה
  choice: для земли
  rationale: לְ сохраняет отношение предназначения или результата, а אֲדָמָה здесь означает почву, землю; буквальный образ — навоз для земли.
