  text: So pursue them with your storm[a], and terrify them with your tempest.
translation:
  language: ru
  text: Так преследуй их бурей Твоей[a] и устраши их вихрем Твоим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Так гони их бурей Твоей и вихрем Твоим приведи их в ужас».'
    reason: Лексические варианты для רדף, סוּפָה и בהל, а также возможная иная расстановка поэтических акцентов.
lexical_decisions:
- source_word: כֵּן
  choice: Так
  rationale: Кратко и естественно связывает просьбу с предшествующим образом, передавая значение «таким образом».
- source_word: תִּרְדְּפֵם
  choice: преследуй их
  rationale: Передаёт обычное значение רדף — гнаться, преследовать — и сохраняет военный и поэтический оттенок контекста.
- source_word: בְּסַעֲרֶךָ
  choice: бурей Твоей
  rationale: 'Творительный падеж естественно передаёт инструментальное בְּ: буря выступает средством Божьего преследования.'
- source_word: וּבְסוּפָתְךָ
  choice: вихрем Твоим
  rationale: סוּפָה обозначает бурю или вихрь; «вихрь» сохраняет отдельный образ и поэтическое усиление после «бури».
- source_word: תְבַהֲלֵם
  choice: устраши их
  rationale: Порода пиэль выражает причинение ужаса или смятения; «устраши» сохраняет интенсивность молитвенного призыва и высокий поэтический регистр.
theological_decisions:
- issue: Божественное действие в молитве о суде
  choice: 'Сохранено прямое обращение-просьба: «преследуй… устраши».'
  alternative: «Да преследуешь Ты… да приведёшь их в ужас».
  rationale: В молитвенном контексте еврейские имперфекты имеют побудительно-желательное значение. Русский императив естественно передаёт обращённую к Богу просьбу и не смягчает напряжённость текста.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Инверсия «бурей Твоей / вихрем Твоим» поддерживает параллелизм и торжественный ритм без архаизации.
