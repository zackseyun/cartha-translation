lexical_decisions:
- source_word: יַעֲרִימוּ סוֹד
  choice: замышляют коварное
  rationale: Сочетание глагола ערם в породе hифиль с существительным סוֹד передаёт тайное, искусное и в данном контексте враждебное замышление. Русское выражение сохраняет эту мысль без чрезмерно конкретного «строят заговор».
- source_word: וְיִתְיָעֲצוּ
  choice: сообща совещаются
  rationale: Форма hitpael от יעץ указывает на взаимное обсуждение. «Сообща совещаются» естественно передаёт совместность, не усиливая смысл до однозначного «сговариваются».
- source_word: עַל עַמְּךָ
  choice: против народа Твоего
  rationale: При глаголах враждебного замышления предлог עַל выражает направленность против кого-либо.
- source_word: צְפוּנֶיךָ
  choice: тех, кого Ты хранишь
  rationale: Форма от צפן может обозначать сокрытых, сбережённых или хранимых. Контекстуально естественное русское выражение передаёт идею сохранения Богом, а буквальная образность и оттенок особой ценности отмечены в сноске.
theological_decisions:
- issue: Значение צְפוּנֶיךָ применительно к Божьему народу
  choice: тех, кого Ты хранишь
  alternative: сокрытых Тобой; тех, кем Ты дорожишь
  rationale: Еврейское слово допускает оттенки сокрытия, хранения и сбережения как ценности. Основной перевод не решает однозначно, идёт ли речь прежде всего о защите или о драгоценности для Бога; эта смысловая широта отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Местоимения, относящиеся к Богу, написаны с прописной буквы. Параллелизм двух полустиший сохранён; «сообща» явно передаёт взаимность еврейской глагольной формы.
