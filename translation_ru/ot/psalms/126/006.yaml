  text: Идёт он, плача, неся семена для посева[a]; непременно вернётся с радостными возгласами[b], неся свои снопы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неся мешок с семенами». Еврейское выражение, переведённое как «семена для посева», трудно для точного истолкования; его также понимают как запас или мешок семян.'
    reason: lexical_alternative
