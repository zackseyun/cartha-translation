translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Слово «сеятель» добавлено как естественно подразумеваемый субъект сельскохозяйственной картины; усиление второй глагольной конструкции передано наречием «непременно». Сохранены контраст плача и ликования и параллелизм ухода с возвращением.
