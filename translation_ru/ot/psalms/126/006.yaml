lexical_decisions:
- source_word: הָלוֹךְ יֵלֵךְ
  choice: уходит
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает глагольную идею. В первой половине стиха естественное русское «уходит» передаёт движение в поле и создаёт смысловую пару с последующим «вернётся».
- source_word: וּבָכֹה
  choice: с плачем
  rationale: 'Форма описывает обстоятельство действия: сеятель идёт плача. «С плачем» звучит естественно и сохраняет явное противопоставление последующей радости.'
- source_word: נֹשֵׂא
  choice: неся
  rationale: Причастие обозначает действие, сопутствующее уходу и возвращению; деепричастие «неся» передаёт это кратко и естественно.
- source_word: מֶשֶׁךְ הַזָּרַע
  choice: семена для посева
  rationale: Еврейское выражение трудно для точного истолкования. Контекст ясно указывает на семена, которые несут сеять; этот перевод передаёт основной смысл, не превращая спорное מֶשֶׁךְ без достаточных оснований в мешок или меру.
- source_word: בֹּא יָבוֹא
  choice: непременно вернётся
  rationale: Абсолютный инфинитив с личной формой выражает усиление и уверенность. «Непременно вернётся» естественно передаёт эмфазу и подразумеваемое возвращение с поля.
- source_word: בְרִנָּה
  choice: с радостными возгласами
  rationale: רִנָּה обозначает слышимое ликование — радостный крик, пение или торжествующий возглас. Выбранная формулировка сохраняет звучащий характер радости.
- source_word: אֲלֻמֹּתָיו
  choice: свои снопы
  rationale: Существительное конкретно обозначает связанные снопы собранного урожая; «свои снопы» точно и понятно передаёт форму с местоименным суффиксом.
