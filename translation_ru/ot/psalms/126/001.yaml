base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/001.yaml
  text: A Song of Ascents. When Yahweh restored the fortunes of Zion[a], we were like those who dream.
translation:
  language: ru
  text: 'Песнь восхождений.


    Когда Яхве вернул Сиону благополучие[a], мы были словно во сне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернул пленников Сиона» или «вернул изгнанников Сиона». Еврейское выражение может обозначать как возвращение из изгнания, так и восстановление благополучия в более широком смысле.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождения
  rationale: Традиционное заглавие этой группы псалмов. «Восхождение» сохраняет прямой смысл מַעֲלוֹת, не конкретизируя, идёт ли речь о паломничестве, ступенях или ином подъёме.
- source_word: בְּשׁוּב
  choice: Когда ... восстановил
  rationale: Предлог בְּ с инфинитивом образует временную конструкцию «когда». В сочетании с שִׁיבַת глагол שׁוב выражает возвращение или восстановление прежнего состояния.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное в еврейском тексте тетраграмматоном, а не заменяет его титулом.
- source_word: שִׁיבַת צִיּוֹן
  choice: благополучие Сиона
  rationale: Выражение может идиоматически обозначать восстановление благополучия и вместе с тем допускать более конкретное понимание как возвращение пленников. Основной текст естественно передаёт широкий смысл, а примечание сохраняет альтернативу.
- source_word: הָיִינוּ
  choice: мы были
  rationale: Простая форма прошедшего времени от היה обозначает состояние и естественно передаётся как «мы были».
- source_word: כְּחֹלְמִים
  choice: словно во сне
  rationale: Еврейское причастие буквально обозначает «видящих сон / спящих». Русское «словно во сне» естественно выражает сравнение и состояние изумлённой нереальности, не превращая его в утверждение о буквальном сне.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. «Яхве» сохраняет различие между именем и титулом и соответствует наиболее принятой научной реконструкции произношения.
- issue: Значение שִׁיבַת צִיּוֹן
  choice: восстановил благополучие Сиона
  alternative: вернул пленников Сиона; возвратил Сион из плена
  rationale: Еврейское выражение допускает как широкое значение перемены участи, так и конкретную отсылку к возвращению из плена. Основной текст не сужает смысл, а сноска сохраняет исторически конкретное прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического текста. «Песнь» сохраняет традиционный библейский регистр, тогда как синтаксис основной строки остаётся ясным и естественным. Слово «словно» поддерживает поэтическое сравнение без архаизации.
