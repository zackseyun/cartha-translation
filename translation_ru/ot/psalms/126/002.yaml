base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/002.yaml
  text: Then our mouth was filled with laughter[a], and our tongue with joyful shouting; then they said among the nations[b], “Yahweh has done great things for them.”
translation:
  language: ru
  text: 'Тогда уста наши наполнились смехом, и язык наш — радостным криком[a]. Тогда среди народов говорили: «Яхве совершил для них великое»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ликующим возгласом»; буквально речь идёт о звонком крике радости.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Яхве совершил великое с этими»; еврейское выражение означает: «Яхве совершил для них великое».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временную последовательность и результат восстановления, описанного в предыдущем стихе.
- source_word: יִמָּלֵא
  choice: наполнились
  rationale: Поэтический имперфект в ретроспективном контексте естественно передаётся прошедшим временем; форма сохраняет результативно-пассивный смысл.
- source_word: שְׂחוֹק
  choice: смехом
  rationale: В параллели с רִנָּה и в контексте восстановления означает ликующий смех, а не насмешку.
- source_word: פִּינוּ
  choice: уста наши
  rationale: Сохраняет собирательное единственное число еврейского текста и звучит естественно в возвышенной русской поэзии.
- source_word: וּלְשׁוֹנֵנוּ
  choice: и язык наш
  rationale: Сохраняет собирательное единственное число и поэтический параллелизм с «уста наши».
- source_word: רִנָּה
  choice: радостным криком
  rationale: Передаёт громкое выражение радости, не сужая значение до формального пения.
- source_word: יֹאמְרוּ
  choice: говорили
  rationale: Прошедшее время соответствует ретроспективному ходу псалма; несовершенный вид естественно выражает звучавшую среди народов речь.
- source_word: בַגּוֹיִם
  choice: среди народов
  rationale: Прозрачно обозначает окружающие народы без конфессионально нагруженного слова «язычники».
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: совершил ... великое
  rationale: Естественно передаёт еврейскую идиому «сделал великим, чтобы сделать», то есть «совершил великие дела».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עִם אֵלֶּה
  choice: для них
  rationale: Передаёт благотворное действие по отношению к упомянутому народу; местоимение естественно в прямой речи.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя; транслитерация сохраняет это отличие от титула.
- issue: Временной план יִמָּלֵא
  choice: 'прошедшее время: «наполнились»'
  alternative: 'будущее время: «наполнятся»'
  rationale: Контекст вспоминает уже пережитое восстановление; при этом морфологическая неоднозначность имперфекта отмечается в решении, а не догматизируется.
- issue: Значение עִם אֵלֶּה в идиоме
  choice: «для них»
  alternative: 'буквально: «с этими»'
  rationale: Бенефактивное понимание соответствует контексту восхищения Божьими делами для Израиля, тогда как буквальная русская калька неясна.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Формы «уста наши» и «язык наш» сохраняют параллелизм и собирательное единственное число оригинала; синтаксис остаётся понятным современному читателю.
