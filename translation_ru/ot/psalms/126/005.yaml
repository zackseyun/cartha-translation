lexical_decisions:
- source_word: הַזֹּרְעִים
  choice: Сеющие
  rationale: Причастие с артиклем употреблено субстантивно и обозначает людей, занятых севом; русское «сеющие» естественно передаёт обобщённое значение множественного числа.
- source_word: בְּדִמְעָה
  choice: со слезами
  rationale: Предлог ב с существительным «слеза» описывает обстоятельство или образ действия; «со слезами» звучит естественно и сохраняет образ.
- source_word: בְּרִנָּה
  choice: с радостными возгласами
  rationale: רִנָּה обозначает громкий ликующий крик и может включать торжественное пение; выбранная формулировка сохраняет слышимое, бурное выражение радости.
- source_word: יִקְצֹרוּ
  choice: будут пожинать
  rationale: Имперфект выражает будущий результат; «будут пожинать» сохраняет земледельческую метафору и параллель с «сеющими».
