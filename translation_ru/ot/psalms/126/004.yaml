  text: Восстанови наше благополучие[a], Яхве, как потоки в Негеве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верни наших пленников» / «восстанови нас после плена». Еврейское выражение может означать как возвращение изгнанников, так и более широкое восстановление благополучия народа.'
    reason: alternative_reading
  - marker: b
