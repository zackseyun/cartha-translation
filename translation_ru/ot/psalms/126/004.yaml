lexical_decisions:
- source_word: שׁוּבָה
  choice: Верни
  rationale: Повелительная форма глагола שוב, обращённая к Яхве. В сочетании с שְׁבוּת выражает просьбу обратить бедственное положение и восстановить общину; «верни» естественно передаёт образ возвращения утраченного.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель прямого дополнения; его грамматическая функция выражена русским синтаксисом.
- source_word: שבותנו
  choice: нам благополучие
  rationale: В составе идиомы שוב את־שבות допускает как широкое значение восстановления прежнего благополучия, так и более узкое — возвращение пленников. Основной текст сохраняет широкий смысл, а альтернативное прочтение отмечено в сноске.
- source_word: כַּאֲפִיקִים
  choice: как потоки
  rationale: אֲפִיקִים обозначает русла или водотоки. «Потоки» ясно и поэтично передаёт картину внезапно наполняющихся водой сухих русел; географическая подробность поясняется в сноске.
- source_word: בַּנֶּגֶב
  choice: в Негеве
  rationale: Здесь נֶגֶב вероятнее всего обозначает засушливую южную область Негев, что непосредственно связано с образом сухих русел, наполняемых дождём.
theological_decisions:
- issue: Значение идиомы שוב את־שבות
  choice: Молитва о восстановлении благополучия общины
  alternative: Молитва о возвращении пленников или изгнанников
  rationale: Еврейская идиома допускает оба понимания. Контекст псалма имеет оттенок возвращения из плена, однако формулировка может охватывать всё бедственное состояние народа; поэтому основной текст оставлен широким, а более узкий смысл указан в сноске.
translation_notes:
  register: 'Современный литературный русский язык с краткой, молитвенной и поэтической интонацией. «Благополучие» употреблено без материально-финансового сужения: речь идёт о восстановлении положения общины в целом.'
