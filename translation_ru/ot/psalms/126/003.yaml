  text: הִגְדִּ֣יל יְ֭הוָה לַ/עֲשׂ֥וֹת עִמָּ֗/נוּ הָיִ֥ינוּ שְׂמֵחִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/126/003.yaml
  text: Yahweh has done great things for us[a]; we were glad.
translation:
  language: ru
  text: Яхве совершил для нас великое[a], и мы были рады.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «Яхве совершил великое с нами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִגְדִּיל לַעֲשׂוֹת
  choice: совершил великое
  rationale: Сочетание каузативной формы גדל с инфинитивом עשה представляет собой идиому со значением «сделать нечто великое». Русское «совершил великое» естественно передаёт её смысл и сохраняет возвышенный поэтический регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет прямое употребление Божьего имени в еврейском тексте; форма «Яхве» общепринята в современной русской библеистике.
- source_word: עִמָּנוּ
  choice: для нас
  rationale: 'Предлог עם буквально означает «с», однако в данном обороте контекст допускает и естественно предполагает благодетельный смысл: великое совершено ради народа и в его пользу. Буквальный вариант сохранён в сноске.'
- source_word: הָיִינוּ שְׂמֵחִים
  choice: мы были рады
  rationale: Именная конструкция с формой היה и прилагательным שׂמח описывает состояние радости. «Мы были рады» точнее сохраняет грамматическую форму, чем глагольное «мы радовались».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, а не титул. Транслитерация сохраняет это различие, не привнося дополнительного толкования.
- issue: Значение עִמָּנוּ
  choice: для нас
  alternative: с нами
  rationale: Основной текст передаёт вероятный благодетельный смысл выражения, тогда как сноска сохраняет буквальную формулировку и присущую ей смысловую возможность.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Синтаксис остаётся простым и понятным; буквальная неоднозначность предлога עם отмечена в сноске.
