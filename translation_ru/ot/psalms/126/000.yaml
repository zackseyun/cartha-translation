lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождения
  rationale: Традиционное и понятное обозначение жанрового заголовка; сохраняет образ восхождения, не уточняя его исторический или литургический контекст.
- source_word: יְהוָה
  choice: Господь
  rationale: В основном тексте употреблено принятое в русской библейской речи соответствие тетраграмматону, сохраняющее достоинство и естественность изложения.
- source_word: שׁוּב ... אֶת שִׁיבַת
  choice: возвратил благополучие
  rationale: Идиоматическое выражение передано в широком смысле восстановления прежнего благополучия; возможный более конкретный смысл возвращения пленников сохранён в сноске.
- source_word: כְּחֹלְמִים
  choice: словно во сне
  rationale: Естественная русская передача сравнения, выражающая ошеломляющую, почти невероятную радость, без излишнего уточнения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: «Господь» соответствует устойчивой русской библейской норме и не вносит конфессионально специфического звучания; при этом речь явно относится к Богу Израиля.
- issue: Значение שׁוב את שיבת ציון
  choice: возвратил благополучие Сиону
  alternative: возвратил пленников Сиона / возвратил Сион из плена
  rationale: Еврейская идиома допускает как общее восстановление судьбы и благополучия, так и конкретное возвращение из плена. Основной текст сохраняет более широкий смысл, а исторически конкретная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулировка краткая и певучая; историческая неоднозначность еврейской идиомы сохранена посредством сноски.
