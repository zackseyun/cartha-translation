base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/010.yaml
  text: So he saved them from the hand of the one who hated them[b][a], and redeemed them from the hand of the enemy.
translation:
  language: ru
  text: Он спас их от руки ненавидевшего их[a] и искупил их от руки врага[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от власти ненавидевшего их». Буквально: «от руки»; в еврейском это образ власти или контроля.'
    reason: idiom_clarification
  - marker: b
    text: '«Искупил» можно также передать как «избавил» или «освободил»: еврейский глагол обозначает избавление посредством вмешательства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: спас Он их
  rationale: Глагол ישׁע обозначает спасение, избавление от опасности. «Спас» естественно звучит по-русски и сохраняет смысл Божьего спасительного вмешательства.
- source_word: מִיַּד
  choice: от руки
  rationale: Сохранён еврейский образ руки как власти или контроля; этот оборот понятен в возвышенной русской речи и поддерживает параллелизм обеих строк.
- source_word: שׂוֹנֵא
  choice: ненавидевшего их
  rationale: Субстантивированное причастие стоит в единственном числе. Перевод сохраняет это число и передаёт подразумеваемый объект ненависти, выраженный местоименным суффиксом при глаголе спасения в контексте фразы.
- source_word: וַיִּגְאָלֵם
  choice: искупил их
  rationale: Глагол גאל означает возвращение, освобождение или избавление посредством решительного вмешательства. «Искупил» сохраняет отличительный смысл и богословскую насыщенность термина, не смешивая его с ישׁע.
- source_word: אוֹיֵב
  choice: врага
  rationale: Сохранено единственное число и определённый по контексту образ противника; русская конструкция после «от руки» не требует артиклевого уточнения.
theological_decisions:
- issue: Следует ли свести ישׁע и גאל к одному общему понятию избавления
  choice: 'Передать их разными глаголами: «спас» и «искупил»'
  alternative: Оба глагола перевести как «избавил»
  rationale: Два близких, но не тождественных глагола образуют поэтический параллелизм. Их различение сохраняет напряжение между спасением от опасности и возвращением через вмешательство, не добавляя частного догматического толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «спас Он» подчёркивает Бога как действующее лицо и соответствует продолжению псалма. Сохранены параллелизм, повтор «от руки» и оба единственных обозначения противника.
