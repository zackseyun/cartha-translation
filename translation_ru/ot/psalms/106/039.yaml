lexical_decisions:
- source_word: וַיִּטְמְאוּ
  choice: осквернились
  rationale: Форма глагола טמא передаёт вхождение в состояние нечистоты без названного внешнего деятеля; возвратное «осквернились» естественно по-русски и сохраняет результативный смысл.
- source_word: בְמַעֲשֵׂיהֶם
  choice: своими делами
  rationale: מַעֲשֶׂה означает дело или действие, а предлог ב здесь естественно понимать как указание на средство или причину осквернения.
- source_word: וַיִּזְנוּ
  choice: блудодействовали
  rationale: זנה несёт яркий образ половой распущенности, метафорически выражающий идолопоклонство и неверность; «блудодействовали» сохраняет этот образ, не сводя его сразу к толкованию.
- source_word: בְמַעַלְלֵיהֶם
  choice: своими поступками
  rationale: מַעֲלָל обозначает поступки или деяния, нередко с нравственной окраской; «поступками» сохраняет поэтическое варьирование относительно предшествующего «делами».
theological_decisions:
- issue: Следует ли прямо передать זנה как заветную неверность или сохранить сексуализированный образ
  choice: 'Сохранить в основном тексте образ: «блудодействовали»'
  alternative: «были неверны»
  rationale: В контексте псалма речь идёт об идолопоклонстве Израиля, однако еврейский текст выражает это через образ блуда. Основной текст сохраняет образ и присущую ему богословскую напряжённость, а сноска поясняет метафорический смысл.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. «Осквернились» и «блудодействовали» принадлежат к возвышенному библейскому регистру, но остаются понятными; пара «делами / поступками» воспроизводит лексическое варьирование оригинала.
