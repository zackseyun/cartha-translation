lexical_decisions:
- source_word: וַיִּתְאַוּוּ תַאֲוָה
  choice: их охватило сильное желание
  rationale: Глагол и однокоренное существительное образуют усилительную конструкцию, буквально «возжелали желание». Русская формулировка естественно передаёт силу желания, не добавляя отсутствующий в стихе объект и не придавая выражению исключительно сексуального смысла.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность; «в пустыне» ясно и сохраняет связь со странствованием Израиля.
- source_word: וַיְנַסּוּ
  choice: испытывали
  rationale: נסה значит «испытывать, подвергать проверке». Несовершенный вид уместно передаёт повествовательную форму и действие народа в данном эпизоде.
- source_word: אֵל
  choice: Бога
  rationale: В этом контексте обычное русское обозначение Бога точно передаёт божественный титул אֵל.
- source_word: בִּישִׁימוֹן
  choice: среди безлюдья
  rationale: יְשִׁימוֹן подчёркивает безлюдную, опустошённую местность. Эта передача сохраняет отличие от מִדְבָּר и звучит по-русски литературно.
theological_decisions:
- issue: Как передать усилительную однокоренную конструкцию וַיִּתְאַוּוּ תַאֲוָה
  choice: 'Идиоматически: «их охватило сильное желание»'
  alternative: 'Буквально: «они возжелали желание»; более экспрессивно: «они страстно возжелали»'
  rationale: Идиоматическая передача сохраняет эмфазу оригинала и неопределённость предмета желания, не привнося идеи алчности или сексуальной похоти.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Различие между מִדְבָּר и יְשִׁימוֹן сохранено выражениями «пустыня» и «безлюдье».
