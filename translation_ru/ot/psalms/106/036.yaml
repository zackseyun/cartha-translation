  text: וַ/יַּעַבְד֥וּ אֶת עֲצַבֵּי/הֶ֑ם וַ/יִּהְי֖וּ לָ/הֶ֣ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/036.yaml
  text: They served their idols[a], and they became a snare to them.
translation:
  language: ru
  text: Они служили своим идолам[a], и те стали для них западнёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они поклонялись своим идолам, и те стали для них ловушкой».'
    reason: 'Лексические варианты: עבד может передаваться как «поклоняться» в контексте служения божествам, а מוֹקֵשׁ — как «ловушка».'
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: служили
  rationale: Глагол עבד в породе qal здесь обозначает служение ложным богам. «Служили» сохраняет прямое значение глагола и религиозный смысл, не сужая его до одного лишь обряда поклонения.
- source_word: עֲצַבֵּיהֶם
  choice: их идолам
  rationale: עֲצַבִּים обычно обозначает идолов и в полемическом контексте несёт отрицательную окраску. «Идолы» ясно передаёт референт, тогда как «изваяния» было бы менее определённо.
- source_word: וַיִּהְיוּ
  choice: те стали
  rationale: 'היה с לְמוֹקֵשׁ выражает наступивший результат: идолы сделались западнёй для служивших им. Местоимение «те» естественно указывает на ближайшее существительное во множественном числе.'
- source_word: לָהֶם
  choice: для них
  rationale: Предлог ל обозначает отношение и воздействие; по-русски сочетание «стали для них западнёй» естественно передаёт пагубное последствие для самого народа.
- source_word: לְמוֹקֵשׁ
  choice: западнёй
  rationale: מוֹקֵשׁ означает ловушку или западню, в том числе метафорически — то, что губительно опутывает человека. «Западня» сохраняет образ скрытой опасности и звучит естественно в современном литературном русском языке.
theological_decisions:
- issue: 'К чему относится подразумеваемое подлежащее во второй части: «стали для них западнёй»'
  choice: Идолы стали западнёй для служившего им народа.
  alternative: Само служение идолам стало для них западнёй.
  rationale: Ближайший и грамматически наиболее естественный антецедент формы множественного числа וַיִּהְיוּ — «их идолы». Формулировка «и те стали» делает эту связь ясной, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Западня» сохраняет конкретный образ древнееврейского текста; синтаксис остаётся кратким и параллельным оригиналу.
