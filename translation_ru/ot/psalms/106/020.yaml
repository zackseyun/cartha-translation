    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמִירוּ
  choice: Они променяли
  rationale: 'Глагол מוּר обозначает замену или обмен одного на другое. «Променяли» естественно передаёт обвинительный оттенок: отказались от несравненно более ценного ради идола.'
- source_word: כְּבוֹדָם
  choice: свою славу
  rationale: Буквально в еврейском тексте — «их славу». Возвратное «свою» по-русски ясно связывает славу с подлежащим и сохраняет намеренно нераскрытое обозначение Бога.
- source_word: בְּתַבְנִית
  choice: на изображение
  rationale: תַּבְנִית означает образ, изображение, подобие или форму. При глаголе обмена русская конструкция «променяли ... на изображение» звучит естественно и соответствует контексту идолопоклонства.
- source_word: שׁוֹר
  choice: быка
  rationale: שׁוֹר может обозначать быка или вола. «Бык» здесь естественнее в связи с культовым изображением и не подменяет слово обычным еврейским обозначением тельца.
- source_word: אֹכֵל עֵשֶׂב
  choice: который ест траву
  rationale: Причастие с дополнением естественно передано определительным придаточным; так сохраняется ироническое противопоставление Божьей славы обычному травоядному животному.
theological_decisions:
- issue: Кого обозначает выражение «свою славу»
  choice: Сохранить в основном тексте буквальное выражение «свою славу».
  alternative: «своего славного Бога» или «Бога»
  rationale: Контекст указывает на Бога как на славу Израиля, однако еврейский текст не называет Его прямо. Буквальная формулировка сохраняет образность, межтекстовые связи и богословское напряжение, не превращая толкование в текст.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, выразительная и доступная. «Променяли» передаёт не просто замену, а унизительный и неразумный характер выбора. Местоимение «свою» соответствует нормальной русской референции при подлежащем «они».
