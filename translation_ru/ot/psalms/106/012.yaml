  text: וַ/יַּאֲמִ֥ינוּ בִ/דְבָרָ֑י/ו יָ֝שִׁ֗ירוּ תְּהִלָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/012.yaml
  text: Then they believed his words[a]; they sang his praise.
translation:
  language: ru
  text: Тогда они поверили Его словам[a] и воспели Ему хвалу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И они поверили Его словам». Еврейская повествовательная форма допускает как простое соединение «и», так и более явное указание на последовательность — «тогда».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ
  choice: Тогда они поверили
  rationale: Порода hифиль глагола אמן выражает веру или доверие; повествовательная форма с וַ־ продвигает рассказ, поэтому «тогда» естественно передаёт последовательность событий.
- source_word: בִדְבָרָיו
  choice: Его словам
  rationale: Существительное דָּבָר стоит во множественном числе с суффиксом 3-го лица мужского рода единственного числа; дательный падеж обусловлен русским управлением глагола «поверить».
- source_word: יָשִׁירוּ
  choice: воспели
  rationale: Имперфект qal в данном повествовательном контексте передаёт последующее завершённое действие. «Воспели» сохраняет значение пения и соответствует возвышенному, но понятному регистру псалма.
- source_word: תְּהִלָּתוֹ
  choice: Ему хвалу
  rationale: תְּהִלָּה с местоименным суффиксом обозначает относящуюся к Нему или воздаваемую Ему хвалу. В русском сочетание «воспели Ему хвалу» естественнее буквального «воспели Его хвалу» и не меняет смысла.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмовым звучанием. Местоимение, относящееся к Богу, написано с прописной буквы согласно распространённой русской библейской традиции.
