lexical_decisions:
- source_word: חָטָאנוּ
  choice: мы согрешили
  rationale: Qal перфект 1-го лица множественного числа от חטא выражает совершённый грех; русский прошедший вид естественно звучит в покаянном исповедании.
- source_word: עִם
  choice: вместе с
  rationale: Предлог обозначает сопричастность и солидарность с прежними поколениями, а не только сходство с ними.
- source_word: אֲבוֹתֵינוּ
  choice: нашими отцами
  rationale: Сохраняется буквальный мужской термин родства; по смыслу речь также может идти о предках вообще.
- source_word: הֶעֱוִינוּ
  choice: поступали неправедно
  rationale: Hiphil перфект от עוה передаёт нравственно неправильное, превратное поведение. Формулировка понятна современному читателю и сохраняет отличие от следующего глагола.
- source_word: הִרְשָׁעְנוּ
  choice: творили зло
  rationale: Hiphil перфект от רשע выражает порочное, нечестивое действие; эта формулировка сохраняет кульминацию трёхчастного признания.
theological_decisions:
- issue: Корпоративная солидарность в исповедании
  choice: «вместе с нашими отцами»
  alternative: «подобно нашим отцам»
  rationale: עִם прежде всего означает совместность или сопричастность, а не сравнение. Перевод сохраняет межпоколенческое измерение общего исповедания, не превращая его в отдельное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-покаянной речи. Трёхчастное признание сохранено; повтор местоимения и вспомогательных конструкций не вводится, поскольку в русском последовательность однородных сказуемых звучит естественнее.
