source:
  edition: WLC
  text: וַֽ֭/יּוֹשִׁיעֵ/ם לְמַ֣עַן שְׁמ֑/וֹ לְ֝/הוֹדִ֗יעַ אֶת גְּבוּרָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/008.yaml
  text: Yet he saved them for the sake of his name[c][b][a], to make his might known.
translation:
  language: ru
  text: Но Он спас их ради Своего имени[a], чтобы явить Своё могущество[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ради славы Своего имени»; имя здесь может подразумевать также Божью честь и открытый Им характер.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы сделать известной Свою силу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשִׁיעֵם
  choice: Но Он спас их
  rationale: Глагол ישׁע означает «спасать, избавлять». Союз ו в контексте противопоставляет спасительное действие Бога непокорности народа, описанной в предыдущем стихе; «но» естественно передаёт этот контраст.
- source_word: לְמַעַן
  choice: ради
  rationale: Предлог выражает основание или мотив действия. В сочетании с «именем» краткое русское «ради» сохраняет смысл «ради чести и явления Своего имени».
- source_word: שְׁמוֹ
  choice: Своего имени
  rationale: Сохраняется буквальный и богословски ёмкий образ имени, включающий открытый Богом характер, честь и известность; возвратное «Своего» естественно соотносит имя с действующим субъектом.
- source_word: לְהוֹדִיעַ
  choice: чтобы явить
  rationale: Каузативный инфинитив значит «сделать известным». «Явить» в данном контексте естественно выражает цель — наглядно обнаружить Божье могущество, не сводя смысл лишь к словесному сообщению.
- source_word: אֶת
  choice: '[отдельно не переводится]'
  rationale: Показатель прямого дополнения не имеет самостоятельного русского соответствия и передаётся синтаксической конструкцией.
- source_word: גְּבוּרָתוֹ
  choice: Своё могущество
  rationale: גְּבוּרָה обозначает силу, могущество или проявление силы. «Могущество» естественно передаёт абстрактное значение единственного числа и соответствует контексту Божьего спасительного деяния.
theological_decisions:
- issue: Смысл выражения «ради Своего имени»
  choice: Спасение совершается ради чести, откровения и верности Божьего имени и характера.
  alternative: «Ради Своей репутации».
  rationale: 'Понятие имени включает репутацию, но не исчерпывается общественным мнением: оно также обозначает открываемую Богом личность и Его честь. Поэтому образ «имени» сохранён без сужающего толкования.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные местоимения, относящиеся к Богу, использованы как издательская норма целевого текста; синтаксис краток и сохраняет поэтическую цельность стиха.
