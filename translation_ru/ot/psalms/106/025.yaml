    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרָגְנוּ
  choice: И роптали они
  rationale: Глагол רגן обозначает недовольное ворчание, ропот или жалобы. «Роптали» естественно для современного литературного русского языка и сохраняет отрицательную окраску; начальное וַ передано повествовательным союзом «и».
- source_word: בְאָהֳלֵיהֶם
  choice: в своих шатрах
  rationale: אֹהֶל буквально означает «шатёр». Конкретный образ сохранён; возвратное «своих» естественно передаёт принадлежность шатров действующим лицам.
- source_word: לֹא שָׁמְעוּ בְּקוֹל
  choice: не слушали голоса
  rationale: Оборот שׁמע בקול может означать как слушание, так и послушание. Буквальная слуховая образность сохранена в основном тексте, а подразумеваемый смысл повиновения отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом, что соответствует непосредственно представленному еврейскому тексту.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» сохраняет имя и отражает наиболее распространённую научную реконструкцию произношения.
- issue: Значение оборота שׁמע בקול
  choice: не слушали голоса
  alternative: не повиновались
  rationale: Основной вариант сохраняет еврейский образ и его смысловую напряжённость между слушанием и послушанием; более явно выраженное значение повиновения дано как допустимый вариант в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичности и параллельной структуры еврейского стиха. «Шатры» удерживают конкретный образ повествовательного контекста; формула «слушали голоса» намеренно сохраняет семитскую образность, оставаясь понятной по-русски.
