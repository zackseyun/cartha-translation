  text: И роптали они[a] в своих шатрах; не слушали голоса Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ворчали» или «жаловались». Еврейский глагол передаёт недовольное ворчание или жалобы.'
