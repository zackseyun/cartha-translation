  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּבְעַר
  choice: вспыхнул
  rationale: Глагол בער здесь обозначает возгорание или разгорание огня; «вспыхнул» естественно передаёт начало и силу действия в повествовательном контексте.
- source_word: אֵשׁ
  choice: огонь
  rationale: Прямое и обычное значение существительного; контекст не требует метафорического расширения.
- source_word: בַּעֲדָתָם
  choice: среди их собрания
  rationale: עֵדָה обозначает собравшуюся общину или группу, а предлог בְּ в данном контексте естественно передаётся словом «среди».
- source_word: לֶהָבָה
  choice: пламя
  rationale: Сохраняет поэтический параллелизм с «огнём» и точно передаёт значение существительного.
- source_word: תְּלַהֵט
  choice: пожрало
  rationale: Интенсивная форма глагола להט выражает яростное, губительное горение; «пожрало» передаёт уничтожающую силу пламени и соответствует возвышенной поэтической речи.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Традиционное и точное обозначение людей, характеризуемых как виновные перед Богом; форма не добавляет отсутствующих в еврейском тексте уточнений.
theological_decisions:
- issue: Характер огня и суда
  choice: Сохранено конкретное описание огня, поразившего нечестивых среди общины.
  alternative: Понимать огонь лишь как обобщённую метафору суда.
  rationale: Контекст псалма повествует об исторических событиях и Божьем суде над мятежниками; перевод не аллегоризирует образ и не расширяет его до отдельного доктринального утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух полустиший сохранён; формулировка краткая, ясная и пригодная для публичного чтения.
