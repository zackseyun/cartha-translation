lexical_decisions:
- source_word: וַיְקַנְאוּ
  choice: стали завидовать
  rationale: В данном контексте קנא обозначает завистливую ревность к Моисею и Аарону; сочетание «стали завидовать» естественно передаёт возникновение этого отношения в поэтическом повествовании.
- source_word: לְמֹשֶׁה ... לְאַהֲרֹן
  choice: Моисею и Аарону
  rationale: Предлог ל при קנא указывает на объект зависти; русское управление глагола «завидовать» требует дательного падежа.
- source_word: בַּמַּחֲנֶה
  choice: в стане
  rationale: מַחֲנֶה — стан израильтян в пустыне. «В стане» сохраняет библейское достоинство слога и остаётся понятным современному читателю.
- source_word: קְדוֹשׁ יְהוָה
  choice: святому Яхве
  rationale: Форма допускает понимание Аарона как святого, принадлежащего Яхве или посвящённого Ему; краткая конструкция сохраняет исходную неоднозначность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Значение обозначения Аарона קְדוֹשׁ יְהוָה
  choice: «святому Яхве» — Аарон назван святым, принадлежащим Яхве
  alternative: «посвящённому Яхве»
  rationale: Основной текст сохраняет компактность и двусмысленность еврейского сочетания между принадлежностью и посвящённостью; возможное уточняющее понимание вынесено в сноску.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмовым звучанием; «стан» выбран вместо разговорно-нейтрального «лагерь». Повтор предлога из еврейского текста не воспроизводится, поскольку русское «Моисею и Аарону» естественно объединяет однородные дополнения.
