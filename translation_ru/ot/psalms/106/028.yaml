source:
  edition: WLC
  text: וַ֭/יִּצָּ֣מְדוּ לְ/בַ֣עַל פְּע֑וֹר וַ֝/יֹּאכְל֗וּ זִבְחֵ֥י מֵתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/028.yaml
  text: They joined themselves to Baal of Peor and ate sacrifices of the dead[a][b].
translation:
  language: ru
  text: Они прилепились к Ваал-Пеору[a] и ели жертвы мёртвых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «связали себя с Ваал-Пеором».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «жертвы мёртвых». Это выражение может относиться либо к жертвам, принесённым безжизненным идолам, либо к обрядам, связанным с умершими.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצָּמְדוּ
  choice: прилепились
  rationale: Глагол צמד обозначает тесное присоединение или связывание. «Прилепились» естественно передаёт возвратный смысл и намеренную приверженность чужому культу, сохраняя при этом образ тесной связи.
- source_word: לְבַעַל פְּעוֹר
  choice: к Ваал-Пеору
  rationale: Сочетание обозначает божество, связанное с Пеором. Написание через дефис сохраняет оба элемента имени и не превращает топоним в истолковывающее прилагательное.
- source_word: וַיֹּאכְלוּ
  choice: и ели
  rationale: Простой глагол точно передаёт действие и последовательность повествования без ненужного повышения стиля.
- source_word: זִבְחֵי
  choice: жертвы
  rationale: Существительное זֶבַח обозначает жертвы или жертвенные приношения. Контекст глагола «ели» уже указывает на участие в жертвенной трапезе, поэтому пояснение в основном тексте не требуется.
- source_word: מֵתִים
  choice: мёртвых
  rationale: Еврейское слово буквально означает «мёртвые». Такой перевод сохраняет неопределённость относительно того, имеются ли в виду безжизненные божества или умершие люди.
theological_decisions:
- issue: Кого обозначают «мёртвые» в выражении זִבְחֵי מֵתִים
  choice: Сохранить широкую формулировку «жертвы мёртвых».
  alternative: «жертвы безжизненным идолам» или «жертвы умершим»
  rationale: Еврейский текст прямо не уточняет референта. Конкретизация как идолов либо умерших людей устранила бы подлинную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейским звучанием. «Прилепились» сохраняет образ тесной культовой приверженности; имя передано как «Ваал-Пеор». Неоднозначность выражения «жертвы мёртвых» оставлена в основном тексте и пояснена в сноске.
