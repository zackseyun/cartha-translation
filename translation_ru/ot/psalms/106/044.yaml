  text: וַ֭/יַּרְא בַּ/צַּ֣ר לָ/הֶ֑ם בְּ֝/שָׁמְע֗/וֹ אֶת רִנָּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/044.yaml
  text: Yet he saw their distress when he heard their cry,[a]
translation:
  language: ru
  text: Но Он увидел их бедствие, когда услышал их вопль.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Он увидел бедствие, постигшее их, когда услышал их вопль».'
    reason: Лָהֶם можно понимать не как притяжательное определение («их бедствие»), а как указание на бедствие, бывшее или постигшее их; начальный וַ также допускает простое соединительное «и».
lexical_decisions:
- source_word: וַיַּרְא
  choice: Он увидел
  rationale: Глагол ראה прямо означает «увидел», а в данном контексте также передаёт внимательное отношение Бога к бедствию народа.
- source_word: בַּצַּר לָהֶם
  choice: их бедствие
  rationale: Существительное צַר обозначает бедствие, стеснённое положение или скорбь; сочетание с לָהֶם естественно передаётся по-русски притяжательной конструкцией «их бедствие».
- source_word: בְּשָׁמְעוֹ
  choice: когда услышал
  rationale: Предлог ב при инфинитиве-сопряжении выражает временное отношение; «когда услышал» ясно и естественно передаёт еврейскую конструкцию.
- source_word: רִנָּתָם
  choice: их вопль
  rationale: רִנָּה может означать громкий возглас, в том числе радостный, но в контексте бедствия речь идёт о настойчивом крике о помощи; «вопль» сохраняет силу выражения.
- source_word: וַ
  choice: Но
  rationale: Хотя союз формально может означать «и», контекст противопоставляет прежнее неповиновение и угнетение народа последующему милосердному вниманию Бога.
theological_decisions:
- issue: Смысл начального союза в контексте милости после суда
  choice: Противительное «Но»
  alternative: Соединительное «И» или последовательное «Тогда»
  rationale: Контекст псалма подчёркивает, что Бог обратил внимание на народ вопреки его прежнему неповиновению. «Но» сохраняет напряжение между судом и милостью, не добавляя нового содержания.
translation_notes:
  register: Современный литературный русский язык с традиционно возвышенной, но понятной библейской лексикой. Местоимение «Он» написано с прописной буквы как ясное указание на Бога в данном контексте.
