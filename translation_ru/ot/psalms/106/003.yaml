  text: אַ֭שְׁרֵי שֹׁמְרֵ֣י מִשְׁפָּ֑ט עֹשֵׂ֖ה צְדָקָ֣ה בְ/כָל עֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/003.yaml
  text: Blessed are those who keep justice[a], who do righteousness at all times.
translation:
  language: ru
  text: Блаженны те, кто соблюдает справедливость[a], кто во всякое время поступает праведно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Блаженны те, кто блюдёт правосудие, кто всегда делает то, что правильно».'
    reason: Лексические варианты для מִשְׁפָּט и צְדָקָה позволяют подчеркнуть соответственно правосудие и правильные поступки.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блаженны
  rationale: Форма вводит характерное для Псалтири изречение-блаженство; «блаженны» сохраняет возвышенный религиозный тон, не сводя смысл к субъективному ощущению счастья.
- source_word: שֹׁמְרֵי
  choice: те, кто соблюдает
  rationale: Причастие выражает постоянную, привычную практику. «Соблюдает» естественно передаёт верность нравственному требованию; буквальное «хранит» здесь звучало бы менее ясно.
- source_word: מִשְׁפָּט
  choice: справедливость
  rationale: В данном этическом контексте слово обозначает справедливый порядок и поведение, а не отдельное судебное решение.
- source_word: עֹשֵׂה
  choice: кто… поступает
  rationale: Единственное число еврейского причастия после множественного выражения имеет обобщающий смысл. Повтор относительной конструкции естественен по-русски и сохраняет значение постоянного действия.
- source_word: צְדָקָה
  choice: праведно
  rationale: Наречная конструкция «поступает праведно» ясно передаёт совершение праведных дел и сохраняет отличие от предшествующей «справедливости».
- source_word: בְּכָל עֵת
  choice: во всякое время
  rationale: Формулировка сохраняет подчёркнутую всеохватность исходного выражения и возвышенный поэтический регистр.
theological_decisions:
- issue: Соотношение מִשְׁפָּט и צְדָקָה
  choice: Передать раздельно как «справедливость» и «поступает праведно».
  alternative: Передать оба слова близкими выражениями со значением справедливости или второе как «делает то, что правильно».
  rationale: Это родственные, но не тождественные нравственные понятия. Раздельная передача сохраняет напряжение и параллелизм еврейского текста, не сливая их в одну идею.
translation_notes:
  register: Современный литературный русский с достоинством поэтического блаженства. Синтаксис сделан ясным для широкого читателя; «во всякое время» сохраняет библейскую возвышенность без архаизации.
