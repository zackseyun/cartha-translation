lexical_decisions:
- source_word: וַיִּזְבְּחוּ
  choice: приносили в жертву
  rationale: Глагол זבח обозначает ритуальное заклание или принесение жертвы. Выражение «приносили в жертву» естественно по-русски и ясно передаёт культовый смысл.
- source_word: אֶת
  choice: '[показатель прямого дополнения, не переводится]'
  rationale: У еврейского показателя определённого прямого дополнения нет отдельного соответствия в русском языке; его функция передаётся синтаксисом и винительным падежом.
- source_word: בְּנֵיהֶם
  choice: своих сыновей
  rationale: Форма בְּנֵיהֶם конкретно означает «их сыновей». Возвратное «своих» естественно соотносит детей с подлежащим и сохраняет значение принадлежности.
- source_word: וְאֶת
  choice: и [показатель прямого дополнения не переводится]
  rationale: Союз וְ передан как «и», а показатель прямого дополнения отдельно не переводится.
- source_word: בְּנוֹתֵיהֶם
  choice: дочерей
  rationale: Форма בְּנוֹתֵיהֶם означает «их дочерей». Общее для однородных членов «своих» распространяется и на «дочерей», избегая тяжеловесного повтора.
- source_word: לַשֵּׁדִים
  choice: бесам
  rationale: שֵׁדִים обозначает демонических существ; «бесам» — ясный, литературный и традиционно понятный русский эквивалент. Предлог לְ передаёт адресата жертвоприношения дательным падежом.
theological_decisions:
- issue: Передача שֵׁדִים
  choice: бесам
  alternative: демонам; ложным богам; злым духам
  rationale: «Бесам» сохраняет утверждение текста о духовных существах и не сводит его к абстрактным идолам; при этом перевод не добавляет позднейших представлений об их природе.
- issue: Определённость формы לַשֵּׁדִים
  choice: бесам с примечанием о возможном «этим бесам»
  alternative: этим бесам
  rationale: Артикль формально присутствует в слитной форме לַ, однако русский язык не требует регулярно выражать такую определённость. Основной текст остаётся естественным, а примечание сохраняет формальную возможность.
translation_notes:
  register: Современный литературный русский язык с достоинством и без архаической тяжеловесности. Формулировка сохраняет параллельное упоминание сыновей и дочерей и культовый характер действия.
