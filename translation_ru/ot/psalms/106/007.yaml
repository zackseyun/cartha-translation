  text: אֲב֘וֹתֵ֤י/נוּ בְ/מִצְרַ֨יִם לֹא הִשְׂכִּ֬ילוּ נִפְלְאוֹתֶ֗י/ךָ לֹ֣א זָ֭כְרוּ אֶת רֹ֣ב חֲסָדֶ֑י/ךָ וַ/יַּמְר֖וּ עַל יָ֣ם בְּ/יַם סֽוּף׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/007.yaml
  text: Our fathers in Egypt did not understand your wondrous deeds[a]; they did not remember the abundance of your steadfast love[b], but rebelled at the sea—the Red Sea.
translation:
  language: ru
  text: Наши отцы в Египте не постигли Твоих чудес, не помнили о множестве Твоих милостей и восстали у моря — у Красного моря[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у моря Суф». Еврейское название יַם סוּף традиционно передаётся как «Красное море»; слово סוּף обычно означает «тростник», откуда также перевод «Тростниковое море».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבוֹתֵינוּ
  choice: Наши отцы
  rationale: Буквально передаёт мужской родственный термин и вместе с тем обозначает прежние поколения Израиля.
- source_word: הִשְׂכִּילוּ
  choice: не постигли
  rationale: Передаёт не просто отсутствие сведений, а неспособность понять значение Божьих деяний; формулировка естественна для современного литературного русского языка.
- source_word: נִפְלְאוֹתֶיךָ
  choice: Твоих чудес
  rationale: Обозначает совершённые Богом необычайные деяния; краткое русское выражение сохраняет предметный смысл в данном контексте.
- source_word: רֹב חֲסָדֶיךָ
  choice: о множестве Твоих милостей
  rationale: רֹב выражает множество или изобилие, а множественное חֲסָדֶיךָ указывает на многочисленные проявления верной, милосердной любви Бога. «Милостей» сохраняет множественное число и звучит естественно по-русски.
- source_word: וַיַּמְרוּ
  choice: и проявили непокорность
  rationale: מרה означает противиться, быть непокорным. Такая передача сохраняет подразумеваемую направленность против Бога, не превращая море в объект восстания.
- source_word: עַל יָם בְּיַם סוּף
  choice: у моря — у Красного моря
  rationale: Обе предложные группы обозначают место и стоят в пояснительном приложении. Тире ясно передаёт, что второе название уточняет первое.
theological_decisions:
- issue: Передача חֶסֶד
  choice: милость
  alternative: неизменная любовь; верная любовь
  rationale: В контексте слово включает верность Бога и Его благодеяния народу. Множественное «милости» естественно обозначает многочисленные проявления этой верной любви, не сводя смысл только к эмоциональной привязанности.
- issue: Название יַם סוּף
  choice: Красное море
  alternative: море Суф; Тростниковое море
  rationale: Традиционное географическое название понятно современному читателю, тогда как еврейская форма допускает передачу «море Суф» и обычно связывается с тростником. Исходная особенность названия сохранена в примечании.
- issue: Связь וַ־ с предшествующими отрицаниями
  choice: и проявили непокорность
  alternative: но проявили непокорность
  rationale: Еврейский союз допускает контекстуально-противительное понимание, однако обычное соединительное «и» сохраняет формальную открытость текста и не усиливает противопоставление сверх необходимого.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Повтор «у моря — у Красного моря» намеренно сохранён как риторическое уточнение еврейского текста.
