  text: לִ/רְא֤וֹת בְּ/ט֘וֹבַ֤ת בְּחִירֶ֗י/ךָ לִ֭/שְׂמֹחַ בְּ/שִׂמְחַ֣ת גּוֹיֶ֑/ךָ לְ֝/הִתְהַלֵּ֗ל עִם נַחֲלָתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/005.yaml
  text: that I may see the good of your chosen ones[a], rejoice in the joy of your nation[b], and glory with your inheritance.
translation:
  language: ru
  text: чтобы мне увидеть благо Твоих избранных, радоваться радости Твоего народа и торжествовать вместе с Твоим наследием.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִרְאוֹת
  choice: чтобы мне увидеть
  rationale: Инфинитив с ל продолжает просьбу предыдущего стиха и выражает цель; конкретный глагол «увидеть» сохранён.
- source_word: בְּטוֹבַת
  choice: благо
  rationale: טוֹבָה обозначает добро и благополучие, которым пользуются избранные; «благо» сохраняет широту еврейского слова, не сужая его до материального процветания.
- source_word: בְּחִירֶיךָ
  choice: Твоих избранных
  rationale: Передаёт людей, избранных Богом, без более узкого систематико-богословского оттенка слова «избранники» или специального термина «элект».
- source_word: לִשְׂמֹחַ בְּשִׂמְחַת
  choice: радоваться радости
  rationale: Сохранена выразительная однокоренная конструкция оригинала; по-русски она звучит возвышенно, но понятно.
- source_word: גּוֹיֶךָ
  choice: Твоего народа
  rationale: Хотя גּוֹי буквально может означать «народ» или «нация», в обращении к Богу «Твой народ» естественно передаёт корпоративную общность Израиля и не вносит современного политического оттенка слова «нация».
- source_word: לְהִתְהַלֵּל
  choice: торжествовать
  rationale: В данном положительном контексте hitpael от הלל выражает радостное ликование или славу; «торжествовать» естественно передаёт это без отрицательного оттенка русского «хвалиться».
- source_word: עִם נַחֲלָתֶךָ
  choice: вместе с Твоим наследием
  rationale: עִם выражает совместность, а נַחֲלָה сохранено как заветный образ народа, принадлежащего Богу.
theological_decisions:
- issue: Передача трёх заветных наименований народа
  choice: Твои избранные ... Твой народ ... Твоё наследие
  alternative: Твои избранники ... Твоя нация ... Твоё достояние
  rationale: Сохранены три различных образа оригинала без сведения их к одному слову и без привнесения позднейших конфессиональных систем.
- issue: Смысл לְהִתְהַלֵּל в положительном контексте
  choice: торжествовать
  alternative: хвалиться; славиться; ликовать
  rationale: Форма допускает оттенки хваления, славы и ликования. Контекст совместной радости с Божьим народом делает «торжествовать» уместным, при этом не превращая выражение в самовосхваление.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому библейскому регистру. Однокоренное «радоваться радости» намеренно сохраняет поэтическую фигуру еврейского текста.
