  text: כִּֽי הִמְר֥וּ אֶת רוּח֑/וֹ וַ֝/יְבַטֵּ֗א בִּ/שְׂפָתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/033.yaml
  text: For they embittered his spirit[b][a], and he spoke rashly with his lips.
translation:
  language: ru
  text: потому что они огорчили его дух[a], и он опрометчиво говорил устами своими[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раздражили его дух»; возможен также смысл: «воспротивились его духу». Еврейский глагол допускает оттенки огорчения, раздражения или противления.'
    reason: lexical_alternative
  - marker: b
    text: То есть Моисей говорил опрометчиво у вод Меривы; ср. Чис 20:10.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину сказанного в предыдущем стихе; «потому что» ясно передаёт причинную связь.
- source_word: הִמְרוּ
  choice: возмутили
  rationale: В породе hифиль глагол מרה здесь допускает значения причинения горечи и провокации. «Возмутили его дух» естественно передаёт воздействие на внутреннее состояние Моисея, не сводя выражение лишь к неповиновению.
- source_word: אֶת רוּחוֹ
  choice: его дух
  rationale: Сохранён конкретный антропологический термин רוח и местоименная неоднозначность самого стиха; в контексте речь идёт о внутреннем состоянии Моисея, а не о Святом Духе.
- source_word: וַיְבַטֵּא
  choice: он необдуманно сказал
  rationale: Глагол обозначает произнесение слов, а контекст Меривы придаёт речи отрицательный оттенок поспешности или необдуманности.
- source_word: בִּשְׂפָתָיו
  choice: своими устами
  rationale: Передаёт буквальный образ еврейского выражения и ясно связывает притяжательное местоимение с подлежащим «он».
theological_decisions:
- issue: К кому относятся местоимения в выражениях «его дух» и «своими устами»
  choice: В контексте они относятся к Моисею.
  alternative: Отнести «дух» к Божьему Духу либо оба местоимения к народу.
  rationale: Последовательность Пс 105:32–33 в русской нумерации описывает, как действия народа привели к проступку Моисея у вод Меривы; это согласуется с Чис 20:10. При этом основной текст сохраняет местоименную форму оригинала.
translation_notes:
  register: Современный литературный русский язык с сохранением поэтического образа «дух» и «уста». «Необдуманно сказал» понятно широкому читателю и передаёт отрицательную контекстуальную окраску без излишней конфессиональной конкретизации.
