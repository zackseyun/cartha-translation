  source_fidelity: 'Основной смысл передан верно: действия народа вызвали внутреннее потрясение/огорчение у Моисея, вследствие чего он произнёс необдуманные слова. Однако «возмутили его дух» в современном русском двусмысленно и неудачно: обычно оно означает «встревожили, взволновали», а не передаёт оттенок огорчения/раздражения, который контекстуально связывается с опрометчивой речью. Формулировка «сказал своими устами» также менее естественна, чем глагол речи.'
