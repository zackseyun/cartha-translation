base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/041.yaml
  text: He gave them into the hand of the nations[b][a], and those who hated them ruled over them.
translation:
  language: ru
  text: Он отдал их в руки народов[a], и ненавидевшие их властвовали над ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руку народов» — еврейский образ, означающий передачу под чужую власть.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנֵם
  choice: Он отдал их
  rationale: Форма נתן с местоименным дополнением буквально передаёт активное действие подразумеваемого субъекта — Бога. «Отдал» естественно по-русски и не ослабляет смысл до простого попущения; «предал» возможно, но стилистически и богословски более нагружено.
- source_word: בְּיַד גּוֹיִם
  choice: в руки народов
  rationale: Сохранён еврейский образ руки как власти. В русском выражение «отдать в руки» понятно и естественно; множественное «руки» соответствует русской идиоматике, тогда как в еврейском стоит единственное число.
- source_word: גּוֹיִם
  choice: народов
  rationale: В данном историко-поэтическом контексте речь идёт об иноземных народах. «Народы» нейтральнее и точнее, чем конфессионально окрашенное «язычники».
- source_word: וַיִּמְשְׁלוּ בָהֶם
  choice: властвовали над ними
  rationale: Глагол משל с предлогом ב обозначает властвование над кем-либо. «Властвовали» сохраняет оттенок господства враждебной силы; «правили» могло бы звучать слишком нейтрально.
- source_word: שֹׂנְאֵיהֶם
  choice: ненавидевшие их
  rationale: Причастная форма обозначает именно тех, кто их ненавидел. Такой перевод точнее, чем более широкое по смыслу «враги».
theological_decisions:
- issue: Божественное действие в суде над Израилем
  choice: Сохранено прямое утверждение, что Бог отдал их во власть других народов.
  alternative: 'Передать действие как простое дозволение: «Он допустил, чтобы они оказались во власти народов».'
  rationale: Еврейский глагол נתן прямо приписывает действие Богу как подразумеваемому субъекту. Перевод не смягчает это богословское напряжение и не добавляет объяснений сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксический параллелизм стиха сохранён; архаизмы и конфессионально нагруженные слова избегаются.
