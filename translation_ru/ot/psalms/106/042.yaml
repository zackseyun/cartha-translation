lexical_decisions:
- source_word: וַיִּלְחָצוּם
  choice: притесняли их
  rationale: Глагол לחץ в породе qal с объектным суффиксом означает «теснить, угнетать, притеснять». В контексте вражеского господства «притесняли их» естественно передаёт длительное угнетение.
- source_word: אֹיְבֵיהֶם
  choice: враги
  rationale: Обычное значение существительного אויב с суффиксом 3-го лица множественного числа; контекст говорит о враждебном господстве.
- source_word: וַיִּכָּנְעוּ
  choice: были покорены
  rationale: 'Нифаль глагола כנע выражает состояние подчинения: «быть покорённым, смирённым, приведённым в подчинение». «Были покорены» сохраняет страдательно-результативный смысл.'
- source_word: תַּחַת יָדָם
  choice: под их рукой
  rationale: Буквально «под их рукой»; это образное выражение означает пребывание под чьей-либо властью. Основной текст сохраняет конкретный древнееврейский образ, а сноска поясняет его.
