  text: Then Phinehas stood up and interceded[a], and the plague was stopped.
translation:
  language: ru
  text: Тогда встал Финеес и вмешался[a], и мор прекратился.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершил суд»; возможно также: «помолился» или «ходатайствовал». Употреблённый здесь еврейский глагол может иметь судебный или ходатайственный смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: встал
  rationale: Глагол עמד означает «стоять, встать»; в повествовательной последовательности «встал» естественно передаёт начало решительного действия.
- source_word: פִּינְחָס
  choice: Финеес
  rationale: Использована традиционная русская библейская форма имени, понятная современному читателю.
- source_word: וַיְפַלֵּל
  choice: вмешался
  rationale: Форма глагола פלל допускает судебный и ходатайственный оттенки. «Вмешался» сохраняет широту смысла и согласуется с аллюзией на решительное действие Финееса в Числах 25, не сводя его только к молитве или совершению суда.
- source_word: וַתֵּעָצַר
  choice: прекратилось
  rationale: Нифаль глагола עצר обозначает остановку или прекращение; по-русски сочетание «поражение прекратилось» звучит естественно.
- source_word: הַמַּגֵּפָה
  choice: поражение
  rationale: מגפה обозначает смертельное поражение, мор или бедствие. «Поражение» сохраняет традиционную библейскую связь с рассказом в Числах 25, не обязательно уточняя природу бедствия как эпидемию.
theological_decisions:
- issue: Смысл וַיְפַלֵּל применительно к поступку Финееса
  choice: В основном тексте употреблено широкое «вмешался».
  alternative: «совершил суд»; «помолился» или «ходатайствовал»
  rationale: Контекст Чисел 25 указывает на решительное судебное действие Финееса, тогда как глагол способен иметь также ходатайственный оттенок. Широкий перевод и сноска сохраняют эту смысловую и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Краткий параллелизм стиха сохранён; неоднозначность ключевого глагола вынесена в сноску.
