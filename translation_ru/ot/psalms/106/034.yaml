  text: Они не истребили народы, которых Яхве сказал им истребить[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «Они не истребили народы, которых Яхве сказал им». Слово «истребить» добавлено, поскольку содержание сказанного подразумевается в еврейском тексте и ясно из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: не
  rationale: Обычное отрицание; в сочетании с формой прошедшего времени естественно передаётся русским «не».
- source_word: הִשְׁמִידוּ
  choice: истребили
  rationale: Порода hифиль глагола שׁמד обозначает причинение уничтожения. «Истребили» сохраняет силу исходного слова и уместно по отношению к народам, не добавляя оттенков, которых нет в тексте.
- source_word: אֶת הָעַמִּים
  choice: народы
  rationale: Множественное число עַמִּים указывает на несколько этнических общностей; русское «народы» передаёт это прямо и естественно.
- source_word: אֲשֶׁר
  choice: которых
  rationale: Относительное местоимение относится к людям, обозначенным словом «народы», и согласуется с подразумеваемым объектом действия.
- source_word: אָמַר
  choice: велел
  rationale: Сам глагол буквально означает «сказал», однако здесь после него эллиптически опущено содержание ранее данного указания. «Велел» естественно выражает контекстуальный смысл, тогда как подразумеваемое действие раскрывается повтором «истребить».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: לָהֶם
  choice: им
  rationale: Местоименный косвенный объект прямо и естественно передаётся русским дательным падежом.
theological_decisions:
- issue: Эллиптически опущенное содержание слов Яхве
  choice: В основном тексте добавлено подразумеваемое «истребить»
  alternative: «Они не истребили народы, о которых Яхве говорил им»
  rationale: Еврейский текст буквально заканчивается конструкцией «которых Яхве сказал им», не называя содержания сказанного. Предыдущий глагол и контекст ясно указывают на повеление истребить эти народы. Добавление делает фразу связной по-русски, а сноска сохраняет видимой эллиптичность оригинала.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Повтор «истребили — истребить» намеренно сохраняет смысловую связь, которая в еврейском выражена эллиптически.
