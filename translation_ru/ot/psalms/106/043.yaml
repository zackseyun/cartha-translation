    reason: lexical_alternative
lexical_decisions:
- source_word: פְּעָמִים רַבּוֹת
  choice: Много раз
  rationale: Точно передаёт многократность действия и естественно звучит в современном русском языке.
- source_word: יַצִּילֵם
  choice: Он избавлял их
  rationale: Форма породы hифиль от נצל обозначает избавление или спасение от опасности; несовершенный вид в русском передаёт повторявшееся действие.
- source_word: וְהֵמָּה יַמְרוּ
  choice: но они упорствовали
  rationale: Противительный союз передаёт контраст, а «упорствовали» выражает устойчивое сопротивление и мятежность, не превращая глагол в прилагательное.
- source_word: בַעֲצָתָם
  choice: в своём замысле
  rationale: עֵצָה может означать совет, замысел или намерение; «замысел» естественно сочетается с упорством и сохраняет идею избранного ими собственного пути.
- source_word: וַיָּמֹכּוּ
  choice: были унижены
  rationale: מוך означает стать низким, прийти в упадок или быть униженным; данная передача сохраняет результирующее состояние и допускаемую контекстом пассивность.
- source_word: בַּעֲוֺנָם
  choice: своим беззаконием
  rationale: Творительный падеж передаёт причинно-инструментальную силу предлога ב; «беззаконие» сохраняет нравственную весомость עָוֹן и не сводит его только к чувству вины.
theological_decisions:
- issue: Кто избавляет
  choice: Местоимение «Он» оставлено без поясняющего имени; из контекста псалма ясно, что речь о Боге.
  alternative: Повторить «Господь» или «Бог».
  rationale: В еврейском тексте субъект выражен только формой глагола; добавление имени неоправданно расширило бы стих.
- issue: Характер мятежа
  choice: «Упорствовали» передаёт продолжающееся, устойчивое сопротивление.
  alternative: «Восставали» или «были мятежны».
  rationale: Выбор сохраняет глагольность ימרו и вместе с тем не ограничивает значение единичным актом восстания.
- issue: Связь беззакония с унижением
  choice: «Были унижены своим беззаконием» сохраняет беззаконие как причину или средство их падения.
  alternative: «Поникли в своём беззаконии» или «изнемогли из-за своего беззакония».
  rationale: Еврейские формы допускают оттенки снижения, упадка и истощения; основной текст не уточняет механизм сверх сказанного источником.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой тональностью. Синтаксис прост и доступен; «беззаконие» сохранено как понятный библейский нравственный термин. Все сноски отмечены в основном тексте.
