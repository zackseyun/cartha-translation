    rationale: Оно способно характеризовать манеру действия («забыли в спешке»), а не его скорое наступление. «Быстро забыли» точнее передаёт связь מִהֲרוּ с שָׁכְחוּ.
  - severity: low
    issue: Положение маркера сноски
    rationale: Маркер относится к «совета», но в черновике поставлен после точки. Для ясной привязки его следует поместить после слова и перед знаком препинания.
  - severity: low
    issue: Формулировка сноски
    rationale: Повтор «или:» после точки с запятой менее плавен; единая формула с одним «Или» яснее, не меняя содержания.
