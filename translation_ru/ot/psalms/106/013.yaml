lexical_decisions:
- source_word: מִהֲרוּ
  choice: поспешно
  rationale: Форма от מהר передаёт поспешность, а не только краткий промежуток времени; наречное употребление естественно сочетается с «забыли».
- source_word: שָׁכְחוּ
  choice: забыли
  rationale: Прямое соответствие Qal perfect 3-го лица множественного числа; в повествовательном контексте уместен русский прошедший вид.
- source_word: מַעֲשָׂיו
  choice: Его дела
  rationale: «Дела» сохраняет краткость и широкий смысл מעשה как Божьих деяний; прописная буква ясно указывает на Бога в соответствии с русской библейской традицией.
- source_word: לֹא חִכּוּ
  choice: не стали ждать
  rationale: Передаёт совершенное прошедшее действие и естественно выражает отказ дождаться Божьего указания.
- source_word: לַעֲצָתוֹ
  choice: Его совета
  rationale: '«Совет» сохраняет широту עצה: наставление, замысел или намерение, не сводя слово исключительно к предвечному установлению.'
theological_decisions:
- issue: Значение Божьей עֵצָה в контексте
  choice: Его совета
  alternative: Его замысла / Его намерения
  rationale: «Совет» сохраняет одновременно оттенки Божьего руководства и Его замысла, не разрешая неоднозначность в пользу узкого учения о предопределённом плане.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллелизм и лаконичность еврейской строки сохранены; «поспешно» передаёт именно оттенок поспешности.
