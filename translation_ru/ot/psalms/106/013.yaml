  verdict: revise
  source_fidelity: 'В целом смысл передан верно: מִהֲרוּ שָׁכְחוּ означает, что они быстро забыли Божьи деяния, а לֹא חִכּוּ לַעֲצָתוֹ — что они не стали ждать Его совета/замысла. Однако «поспешно забыли» в русском языке может означать, что само забывание было совершено торопливо, тогда как еврейский оборот естественнее передать как «быстро забыли».'
  naturalness: «Они быстро забыли» — более обычная и ясная современная русская формулировка. «Не стали ждать Его совета» естественно и сохраняет смысл без добавления того, что они уже ждали, но не дождались.
  terminology: «Дела» адекватно передаёт מַעֲשָׂיו. «Совет» — допустимое широкое соответствие עֵצָה; сноска уместно указывает варианты «замысел» и «намерение». Маркер сноски следует поставить непосредственно после слова, к которому она относится, до точки.
