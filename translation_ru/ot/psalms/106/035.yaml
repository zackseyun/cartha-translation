  terminology: «Народы» предпочтительнее «язычники» или «иноплеменники», поскольку не вносит позднейших конфессиональных коннотаций. Формулировка не добавляет к тексту ни идеи ритуального осквернения, ни нейтрального простого проживания среди народов. Сноски корректно фиксируют альтернативу «среди народов» и буквальное значение «дела».
