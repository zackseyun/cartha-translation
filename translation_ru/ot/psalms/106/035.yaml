  source_fidelity: '«Но смешались с народами и переняли их обычаи» точно передаёт последовательность еврейского текста: Hitpael וַיִּתְעָרְבוּ выражен возвратным «смешались», בַּגּוֹיִם адекватно передано как «с народами», а активное וַיִּלְמְדוּ сохранено в «переняли». «Обычаи» — контекстуально точная передача מַעֲשֵׂיהֶם («дела, действия, практики»), не сужающая значение до одних религиозных обрядов.'
