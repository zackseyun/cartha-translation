  text: but they mixed with the nations and learned their practices[a][b].
translation:
  language: ru
  text: но смешались с народами и переняли их обычаи[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смешались среди народов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «научились их делам»; имеются в виду характерные для этих народов поступки и обычаи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעָרְבוּ
  choice: смешались
  rationale: Возвратная форма глагола передаёт смешение и сближение с окружающими народами; «смешались» кратко и естественно сохраняет этот смысл, не добавляя идеи осквернения.
- source_word: בַגּוֹיִם
  choice: с народами
  rationale: В данном историческом контексте גּוֹיִם — окружающие Израиль народы. В сочетании с «смешались» русский предлог «с» звучит естественно; вариант «среди народов» также возможен.
- source_word: וַיִּלְמְדוּ
  choice: переняли
  rationale: Буквально глагол означает «научились», однако по-русски применительно к чужим обычаям естественнее «переняли». Активная форма сохраняет ответственность самих израильтян.
- source_word: מַעֲשֵׂיהֶם
  choice: их обычаи
  rationale: Буквально — «их дела». В контексте речь идёт о характерных действиях и установившихся практиках народов; «обычаи» ясно передаёт этот смысл, не сводя его исключительно к религиозным обрядам.
theological_decisions:
- issue: Нравственно-религиозный смысл сближения Израиля с народами
  choice: Передать виновное уподобление через выражение «смешались с народами и переняли их обычаи», не добавляя прямого осуждения.
  alternative: Нейтральное «жили среди народов» либо усиленное «осквернились среди народов».
  rationale: Еврейский текст говорит о смешении и усвоении поступков народов, тогда как отрицательная оценка раскрывается контекстом псалма. Перевод не должен ни смягчать, ни усиливать её.
translation_notes:
  register: Современный литературный русский язык; формулировка лаконична и достойна по тону. Союз «но» сохраняет противопоставление предыдущему стиху. «Переняли их обычаи» естественно для широкого круга читателей, а сноска сохраняет буквальный образ исходного текста.
