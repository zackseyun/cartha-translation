  text: Then they despised the pleasant land[b][a]; they did not believe his word.
translation:
  language: ru
  text: И презрели они желанную землю[a], не поверили Его слову[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прекрасную землю», «землю, доставляющую радость».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не доверились Его слову»; «Его слово» здесь можно также понимать как «Его обещание».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְאֲסוּ
  choice: И презрели они
  rationale: Глагол מאס выражает отвержение с сильной отрицательной оценкой; «презрели» естественно передаёт эту силу. Союз «и» сохраняет повествовательную связь waw с контекстом.
- source_word: בְּאֶרֶץ חֶמְדָּה
  choice: желанную землю
  rationale: Существительное חֶמְדָּה обозначает нечто желанное, привлекательное или драгоценное. «Желанная земля» близко передаёт еврейское выражение и уместно обозначает обещанную землю.
- source_word: הֶאֱמִינוּ
  choice: поверили
  rationale: Hiphil глагола אמן допускает значения «верить» и «доверять». С дополнением «слову» форма «поверили» точна и естественна.
- source_word: לִדְבָרוֹ
  choice: Его слову
  rationale: 'דָּבָר имеет широкий смысл: «слово», «сказанное», а в данном контексте также «обещание». Основной текст сохраняет более широкое значение исходного слова.'
theological_decisions:
- issue: Следует ли прямо назвать Божье слово обещанием о земле
  choice: Сохранить в основном тексте более широкое «Его слову»
  alternative: Его обещанию
  rationale: Еврейский текст буквально говорит о «Его слове». Контекст позволяет понимать его как обещание, но явное уточнение сузило бы сохраняющуюся в оригинале формулировку.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «презрели они» поддерживает поэтический ритм, не затемняя смысла; прописная буква в местоимении указывает на Бога в соответствии с русской библейской издательской традицией.
