  text: וַ/יִּֽשְׁפְּכ֨וּ דָ֪ם נָקִ֡י דַּם בְּנֵ֘י/הֶ֤ם וּֽ/בְנוֹתֵי/הֶ֗ם אֲשֶׁ֣ר זִ֭בְּחוּ לַ/עֲצַבֵּ֣י כְנָ֑עַן וַ/תֶּחֱנַ֥ף הָ֝/אָ֗רֶץ בַּ/דָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/038.yaml
  text: They poured out innocent blood—the blood of their sons and daughters[c][b][a], whom they sacrificed to the idols of Canaan—and the land was polluted with blood.
translation:
  language: ru
  text: Они пролили[a] невинную кровь — кровь своих сыновей и дочерей, которых они принесли в жертву идолам Ханаана, — и земля была осквернена кровью[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «излили»; это обычное древнееврейское выражение о пролитии крови.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте буквально «кровями» — форма множественного числа, которая может указывать на кровопролитие или на вину за пролитую кровь.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «земля была осквернена виной за пролитую кровь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁפְּכוּ
  choice: проливали
  rationale: Глагол שׁפך буквально означает «лить, изливать» и устойчиво употребляется о пролитии крови. «Проливали» естественно по-русски передаёт как образ, так и насильственный характер действия.
- source_word: דָם נָקִי
  choice: невинную кровь
  rationale: Устойчивое и понятное русское выражение сохраняет прямую нравственную оценку убитых как невиновных.
- source_word: דַּם בְּנֵיהֶם וּבְנוֹתֵיהֶם
  choice: кровь своих сыновей и дочерей
  rationale: Повтор слова «кровь» сохраняет пояснительное присоединение еврейского текста и подчёркивает, чья именно невинная кровь была пролита.
- source_word: אֲשֶׁר זִבְּחוּ
  choice: которых приносили в жертву
  rationale: В культовом контексте זבח обозначает жертвоприношение; относительное местоимение отнесено к сыновьям и дочерям.
- source_word: לַעֲצַבֵּי כְנָעַן
  choice: идолам Ханаана
  rationale: עֲצַבִּים обозначает идолов или изваяния с отрицательной оценкой; «идолы» ясно передаёт эту полемическую окраску.
- source_word: וַתֶּחֱנַף
  choice: была осквернена
  rationale: Здесь корень חנף описывает нравственно-религиозное осквернение земли кровопролитием; «осквернена» точнее сохраняет культовую и моральную весомость, чем бытовое «загрязнена».
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте имеется в виду страна, связанная с Ханааном и Израилем; русское «земля» естественно допускает это территориальное значение.
- source_word: בַּדָּמִים
  choice: кровью
  rationale: Формально в еврейском стоит множественное число «кровями», которое может обозначать неоднократное кровопролитие или вину за кровь. Основной текст сохраняет повтор образа крови без преждевременного устранения этой смысловой ёмкости.
theological_decisions:
- issue: Нравственный статус детей, принесённых в жертву
  choice: Убийство прямо названо пролитием невинной крови.
  alternative: Кровь невиновных.
  rationale: Формулировка следует явной оценке דָם נָקִי и не добавляет к ней конфессионального толкования.
- issue: Характер осквернения земли
  choice: Земля осквернена кровью.
  alternative: Земля осквернена виной за пролитую кровь.
  rationale: Основной вариант сохраняет конкретный образ и повтор слова «кровь», тогда как примечание отмечает допустимый юридико-нравственный оттенок еврейского множественного числа.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Повтор слова «кровь» намеренно сохранён как важный риторический элемент стиха; синтаксис остаётся ясным и доступным без архаизмов.
