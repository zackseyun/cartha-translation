  yaml_path: translation/ot/psalms/106/048.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. And let all the people say[b], “Amen!” Praise Yah!
translation:
  language: ru
  text: 'Благословен Яхве, Бог Израиля, от века и до века![a] И сказал весь народ: «Аминь!» Хвалите Яха![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от вечности до вечности»; возможен также смысл «от века к веку».'
