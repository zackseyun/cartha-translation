  - marker: b
    text: Еврейское выражение содержит краткую форму имени Яхве; традиционная передача — «Аллилуйя», то есть «Хвалите Яха».
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Пассивное причастие образует традиционную хвалебную формулу; краткая форма «благословен» естественна для русского богослужебного и литературного языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет отличие имени Бога от титула «Господь».
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Точно и естественно передаёт еврейскую сопряжённую конструкцию.
- source_word: מִן הָעוֹלָם וְעַד הָעוֹלָם
  choice: от века и до века
  rationale: Сохраняет повтор עוֹלָם и широкий временной охват хвалебной формулы, не уточняя без необходимости, идёт ли речь о вечности или о веках.
- source_word: וְאָמַר
  choice: И пусть … скажет
  rationale: Хотя форма глагола морфологически перфектная, в данном литургическом контексте она выражает призыв к общему ответу.
- source_word: כָּל הָעָם
  choice: весь народ
  rationale: Естественная русская передача собирательного обозначения участвующего в поклонении народа.
- source_word: אָמֵן
  choice: Аминь
  rationale: Сохраняет общепринятую литургическую форму ответа.
- source_word: הַלְלוּ יָהּ
  choice: Хвалите Яха
  rationale: Передаёт множественное повелительное наклонение הַלְלוּ и краткую форму божественного имени יָהּ, не смешивая её с полным именем יְהוָה.
theological_decisions:
- issue: Передача полного имени יְהוָה и краткой формы יָהּ в одном стихе
  choice: «Яхве» и «Яха»
  alternative: «Господь» в обоих случаях; либо «Яхве» и «Аллилуйя»
  rationale: Раздельная передача сохраняет употреблённые в еврейском тексте полную и краткую формы божественного имени. Форма «Яха» обусловлена русским падежным управлением после переходного глагола «хвалите».
- issue: Временной смысл עוֹלָם
  choice: «от века и до века»
  alternative: «от вечности до вечности»; «во веки веков»
  rationale: Выбранная формула сохраняет образ исходного текста и его возможную смысловую широту, не устраняя напряжение между значениями «век» и «вечность».
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным литургическим звучанием. Синтаксис сохраняет краткость и ритм заключительного славословия; восклицательные знаки подчёркивают хвалебный и ответный характер стиха.
