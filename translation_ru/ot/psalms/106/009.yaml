lexical_decisions:
- source_word: וַיִּגְעַר
  choice: грозно повелел
  rationale: Глагол גער означает «порицать, грозно приказывать». В данном поэтическом образе Бог обращается к морю как к живому; сочетание «грозно повелел» естественно передаёт властную речь, не сводя её к нейтральному приказу.
- source_word: בְּיַם סוּף
  choice: Красному морю
  rationale: יַם סוּף — устойчивое библейское название моря исхода. Традиционное русское «Красное море» ясно указывает на это событие; буквальная и лексически возможная передача приведена в сноске.
- source_word: וַיֶּחֱרָב
  choice: оно высохло
  rationale: Форма от חרב обозначает переход в сухое состояние. «Высохло» сохраняет непереходное значение и звучит естественно по-русски.
- source_word: וַיּוֹלִיכֵם
  choice: Он провёл их
  rationale: Каузативная форма глагола הלך здесь означает, что Бог вёл народ через море. «Провёл» точно выражает завершённое движение через пространство.
- source_word: בַּתְּהֹמוֹת
  choice: через морские глубины
  rationale: Множественное תְּהֹמוֹת означает «глубины, бездны» и здесь относится к морским глубинам. Уточнение «морские» естественно в русском контексте и сохраняет поэтический образ.
- source_word: כַּמִּדְבָּר
  choice: словно через пустыню
  rationale: Предлог сравнения כְּ сопоставляет путь через морские глубины с передвижением по пустыне. Повтор подразумеваемого «через» делает образ ясным и соответствует глаголу движения.
theological_decisions:
- issue: Передача יַם סוּף в отсылке к исходу
  choice: Красное море
  alternative: Тростниковое море (буквально также возможно «Море тростника» или «Камышовое море»)
  rationale: Традиционное название «Красное море» безошибочно связывает стих с исходом и привычно русскому читателю. Поскольку буквальный смысл еврейского названия остаётся предметом обсуждения, он сохранён в сноске без утверждения иной географической идентификации.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Заглавное «Он» употреблено как уважительное местоименное обозначение Бога. Тире подчёркивает немедленный результат Божьего властного слова.
