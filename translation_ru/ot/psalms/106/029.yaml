  text: They provoked him to anger by their deeds[a], and a plague broke out among them.
translation:
  language: ru
  text: Они прогневили Его своими делами[a], и среди них разразился мор.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своими поступками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְעִיסוּ
  choice: прогневили Его
  rationale: 'Порода hифиль глагола כעס выражает причинение гнева: «вызвали гнев, прогневили». Дополнение в еврейском тексте не выражено, но из контекста ясно, что речь идёт о Боге; русское «Его» естественно восполняет его.'
- source_word: בְּמַעַלְלֵיהֶם
  choice: своими делами
  rationale: מַעֲלָלִים обозначает дела или поступки, здесь с нравственной окраской; предлог ב указывает на средство или причину. «Своими делами» кратко и естественно передаёт обе особенности.
- source_word: וַתִּפְרָץ
  choice: разразился
  rationale: Глагол פרץ передаёт внезапное прорывание или начало; в сочетании с бедствием русское «разразился» сохраняет эту динамику.
- source_word: בָּם
  choice: среди них
  rationale: Предлог ב с обозначением группы здесь естественно понимать как указание на происходящее внутри неё. Вариант «против них» возможен, но сильнее истолковывает направленность бедствия.
- source_word: מַגֵּפָה
  choice: мор
  rationale: מַגֵּפָה означает губительное массовое поражение, нередко как суд Божий. «Мор» передаёт смертельный характер бедствия и естественно сочетается с «разразился», не сводя смысл только к медицинской эпидемии.
theological_decisions:
- issue: Неявно выраженный объект глагола «прогневили»
  choice: Восполнено местоимение «Его», относящееся к Богу.
  alternative: Оставить объект невыраженным либо прямо написать «Бога».
  rationale: Хотя в данной строке объект отсутствует, контекст псалма однозначно указывает на Бога. Местоимение обеспечивает ясность по-русски, не добавляя имени, которого нет в стихе.
- issue: Характер מַגֵּפָה как суда
  choice: Передано словом «мор», без явного добавления, что Бог непосредственно его послал.
  alternative: «Поражение» или «кара».
  rationale: Контекст допускает понимание бедствия как Божьего суда, однако сам стих сообщает лишь о его возникновении. Перевод сохраняет эту богословскую связь, не делая причинность более явной, чем в оригинале.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. «Прогневили» и «мор» понятны в библейском контексте и сохраняют достоинство и краткость еврейского параллелизма; синтаксис остаётся простым и доступным.
