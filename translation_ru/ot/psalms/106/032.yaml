  text: וַ֭/יַּקְצִיפוּ עַל מֵ֥י מְרִיבָ֑ה וַ/יֵּ֥רַע לְ֝/מֹשֶׁ֗ה בַּ/עֲבוּרָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/032.yaml
  text: They provoked anger at the waters of Meribah[b][a], and it went badly for Moses because of them.
translation:
  language: ru
  text: Они вызвали гнев у вод Меривы[a][b], и Моисею стало худо из-за них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Мерива означает «спор» или «распря».
    reason: cultural_note
  - marker: b
    text: 'Или: «Они прогневили Его у вод Меривы». В еврейском тексте этой строки прямо не сказано, чей гнев они вызвали.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְצִיפוּ
  choice: вызвали гнев
  rationale: Глагол קצף в каузативном значении указывает на то, что народ стал причиной гнева. Такая передача сохраняет каузативность и не добавляет отсутствующий в еврейской строке объект.
- source_word: עַל
  choice: у
  rationale: 'В сочетании с названием водоёма предлог естественно обозначает место события: «у вод Меривы».'
- source_word: מֵי מְרִיבָה
  choice: вод Меривы
  rationale: Мерива передана как имя места; конструкция сохраняет буквальное упоминание вод.
- source_word: וַיֵּרַע
  choice: пришлось худо
  rationale: Безличная русская конструкция естественно передаёт неблагоприятный исход для Моисея, не приписывая ему нравственного зла.
- source_word: לְמֹשֶׁה
  choice: Моисею
  rationale: Дательный падеж обозначает лицо, которого коснулось неблагоприятное последствие.
- source_word: בַּעֲבוּרָם
  choice: из-за них
  rationale: Выражение в данном контексте обозначает причину и связывает беду Моисея с действиями народа.
theological_decisions:
- issue: Характер неблагоприятного исхода для Моисея
  choice: Сказано лишь, что из-за народа Моисею пришлось худо, без уточнения всей богословской причинности.
  alternative: Увидеть здесь исключительно указание либо на грех Моисея при Мериве, либо только на вину народа.
  rationale: Еврейский текст сохраняет напряжение между виной народа, поступком Моисея и его последствиями; перевод не разрешает его за пределами сказанного в строке.
- issue: Объект вызванного гнева
  choice: Не называть прямо того, чей гнев был вызван.
  alternative: «Они прогневили Его» или «они прогневили Бога».
  rationale: В этой строке прямое дополнение отсутствует; хотя контекст допускает отнесение к Богу, основной текст не должен устранять грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Оборот «пришлось худо» понятен обычному читателю и сохраняет безличный характер еврейской фразы; «вызвали гнев» оставляет объект гнева неуточнённым.
