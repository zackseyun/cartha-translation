  text: וּ/לְ/הַפִּ֣יל זַ֭רְעָ/ם בַּ/גּוֹיִ֑ם וּ֝/לְ/זָרוֹתָ֗/ם בָּ/אֲרָצֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/027.yaml
  text: and to make their offspring fall among the nations[b][a], and to scatter them through the lands.
translation:
  language: ru
  text: 'и повергнуть их потомков[a] среди народов,

    и рассеять их по землям[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их семя»; также: «их потомство».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по странам»; буквально: «по землям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהַפִּיל
  choice: и повергнуть
  rationale: Порода hифиль от נפל выражает причинное значение — «заставить пасть, повергнуть». «Повергнуть» сохраняет это значение, не сводя его однозначно ни к физической смерти, ни к военному поражению.
- source_word: זַרְעָם
  choice: их потомков
  rationale: Буквально «их семя»; в данном контексте זֶרַע обозначает потомство. «Потомки» естественно и ясно передаёт смысл в современном русском языке.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: גּוֹיִם здесь означает чужеземные народы, среди которых окажутся потомки Израиля. «Народы» сохраняет обычное ветхозаветное значение без более поздних конфессиональных оттенков слова «язычники».
- source_word: וּלְזָרוֹתָם
  choice: и рассеять их
  rationale: זרה может означать «веять» или «рассеивать»; параллелизм и указание на множество земель требуют здесь значения географического рассеяния.
- source_word: בָּאֲרָצוֹת
  choice: по разным землям
  rationale: Множественное число אֲרָצוֹת обозначает различные земли или страны. Добавление «разным» естественно для русского языка и ясно выражает множественность мест рассеяния.
theological_decisions:
- issue: Характер суда над потомками
  choice: Передано общее значение поражения и последующего рассеяния потомков среди чужих народов.
  alternative: 'Первую строку можно понять более узко: потомки погибнут среди народов либо будут ими низложены.'
  rationale: Причинная форма נפל шире прямого обозначения смерти. Параллельная строка о рассеянии указывает на суд изгнанием, но сама по себе не исключает более тяжёлого смысла; поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмопевческим ритмом. Параллелизм двух строк сохранён; архаизмы и конфессионально окрашенная лексика не используются.
