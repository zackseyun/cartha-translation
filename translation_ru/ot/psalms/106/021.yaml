  text: שָׁ֭כְחוּ אֵ֣ל מוֹשִׁיעָ֑/ם עֹשֶׂ֖ה גְדֹל֣וֹת בְּ/מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/021.yaml
  text: They forgot God their Savior[a], who had done great things in Egypt.
translation:
  language: ru
  text: Они забыли Бога, своего Спасителя[a], совершившего великие дела в Египте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своего Избавителя». Еврейское причастие может подчёркивать, что Бог — Тот, кто спасает их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכְחוּ
  choice: они забыли
  rationale: Форма qal perfect, 3-е лицо множественного числа, описывает завершённое действие в историческом повествовании псалма; естественное русское прошедшее время точно передаёт смысл.
- source_word: אֵל
  choice: Бога
  rationale: Хотя слово אֵל может подчёркивать могущество, здесь оно служит обозначением Бога Израиля; перевод «Бога» естественен и не добавляет отсутствующего в контексте акцента.
- source_word: מוֹשִׁיעָם
  choice: своего Спасителя
  rationale: Причастие hiphil от ישׁע с суффиксом 3-го лица множественного числа буквально означает «спасающего их» или «их спасителя». «Своего Спасителя» кратко и естественно выражает постоянную роль Бога по отношению к ним.
- source_word: עֹשֶׂה
  choice: совершившего
  rationale: Причастие qal определяет Бога и по-русски естественно передаётся причастным оборотом; совершенный вид указывает на совершённые прежде деяния в Египте, не устраняя качественного оттенка исходного причастия.
- source_word: גְדֹלוֹת
  choice: великие дела
  rationale: Субстантивированное прилагательное во множественном числе обозначает великие деяния; «великие дела» ясно и достойно передаёт смысл.
- source_word: בְּמִצְרָיִם
  choice: в Египте
  rationale: Предлог ב здесь обозначает место; это прямой и естественный русский эквивалент.
theological_decisions:
- issue: Передача божественного обозначения אֵל
  choice: Бога
  alternative: Могучего; Бога могучего
  rationale: В данном стихе אֵל прежде всего указывает на Бога, которого забыл Израиль. Перевод «Бога» сохраняет это отождествление и не вносит дополнительного титульного акцента.
- issue: Передача מוֹשִׁיעָם как роли Бога
  choice: своего Спасителя
  alternative: своего Избавителя; Того, кто спасал их
  rationale: «Спаситель» сохраняет и личное обозначение, и значение Бога как того, кто спасает. В сноске отмечен допустимый оттенок избавления, чтобы не сужать смысл причастия.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественный. Местоимение «своего» естественно соотносит Спасителя с подлежащим «они», а прописная буква сохраняет уважительное обозначение Бога.
