  terminology: «Пустыня» является устойчивым и контекстуально точным соответствием מִדְבָּר в повествовании о странствиях. Сноска корректно отмечает клятвенный оттенок жеста, не навязывая его как единственно возможное значение. Формулировка «поклялся против них» допустима как краткая интерпретационная альтернатива.
