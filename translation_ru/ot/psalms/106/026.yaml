  source_fidelity: 'Текст точно передаёт основные элементы еврейского стиха: וַיִּשָּׂא יָדוֹ — «поднял ... руку», направленность לָהֶם — «на них», каузатив לְהַפִּיל — «чтобы повергнуть их», и בַּמִּדְבָּר — «в пустыне». Сохраняется образный характер исходного выражения без неоправданного сведения его к явной формуле клятвы.'
