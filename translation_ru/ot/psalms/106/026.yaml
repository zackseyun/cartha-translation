  text: וַ/יִּשָּׂ֣א יָד֣/וֹ לָ/הֶ֑ם לְ/הַפִּ֥יל א֝וֹתָ֗/ם בַּ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/026.yaml
  text: So he raised his hand against them[a], to make them fall in the wilderness.
translation:
  language: ru
  text: И Он поднял на них руку[a], чтобы повергнуть их в пустыне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклялся против них». Поднятие руки могло быть жестом принесения клятвы, особенно в контексте суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: поднял
  rationale: Глагол נשׂא буквально означает «поднимать, нести». В сочетании со словом «рука» сохраняется конкретный образ исходного текста, не исключающий клятвенного жеста.
- source_word: יָדוֹ
  choice: руку
  rationale: Буквальная передача сохраняет древнееврейский образ; по контексту речь идёт о руке Бога.
- source_word: לָהֶם
  choice: на них
  rationale: Хотя предлог לְ буквально может означать «к/для», русское выражение «поднять на кого-либо руку» естественно передаёт направленность действия против них и сохраняет образ.
- source_word: לְהַפִּיל
  choice: чтобы повергнуть
  rationale: Каузативная форма глагола נפל означает «сделать так, чтобы пали». «Повергнуть» кратко и естественно передаёт этот смысл, включая возможность гибели или поражения.
- source_word: אוֹתָם
  choice: их
  rationale: Прямая передача местоимения в роли объекта.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: «Пустыня» — естественное и традиционно узнаваемое русское обозначение מִדְבָּר в контексте странствий Израиля.
theological_decisions:
- issue: Значение выражения «поднял руку»
  choice: Сохранить древнееврейский образ в основном тексте и указать возможный смысл клятвы в сноске.
  alternative: «Он поклялся погубить их» или «Он поднял руку, клянясь против них».
  rationale: В контексте суда выражение, вероятно, обозначает торжественную клятву Бога. Однако еврейский текст сохраняет сам жест, а не употребляет явную формулу клятвы, поэтому перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Выражение «поднял на них руку» понятно по-русски, сохраняет образ оригинала и допускает судебно-клятвенный оттенок; «повергнуть» передаёт каузативность без излишнего толкования.
