  yaml_path: translation/ot/psalms/106/017.yaml
  text: The earth opened and swallowed Dathan[c][b][a], and covered the company of Abiram.
translation:
  language: ru
  text: Земля разверзлась, поглотила Дафана[a] и покрыла общину Авирона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: См. Чис. 16:31–33, где подробнее рассказано об этом суде.
    reason: cross_reference
  - marker: b
    text: 'Или: «собрание Авирона»; еврейское слово обозначает общину, группу людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְתַּח
  choice: разверзлась
  rationale: Форма Qal 3-го лица женского рода единственного числа с אֶרֶץ в роли подлежащего; в поэтическом рассказе обозначает прошлое событие. «Разверзлась» естественно и выразительно передаёт раскрытие земли в контексте Чис 16.
- source_word: אֶרֶץ
  choice: земля
  rationale: Здесь имеется в виду земля под мятежниками, а не страна или территория.
- source_word: וַתִּבְלַע
  choice: и поглотила
  rationale: Последовательная повествовательная форма от בלע. «Поглотила» прямо передаёт образ и сохраняет согласование с «земля».
- source_word: דָּתָן
  choice: Дафана
  rationale: Традиционная русская библейская передача личного имени; винительный падеж обусловлен синтаксисом.
- source_word: וַתְּכַס עַל
  choice: и накрыла
  rationale: Глагол כסה с עַל выражает покрытие сверху. Русское «накрыла» естественно передаёт действие земли, закрывшей людей, без лишнего добавления.
- source_word: עֲדַת
  choice: сборище
  rationale: Сопряжённая форма от עֵדָה обозначает группу или сообщество. В данном контексте «сборище» ясно указывает на объединение мятежников и не приобретает церковного оттенка слова «собрание».
- source_word: אֲבִירָם
  choice: Авирона
  rationale: Традиционная русская библейская передача личного имени; родительный падеж соответствует конструкции принадлежности.
theological_decisions:
- issue: Соотношение стиха с полным рассказом в Числах 16
  choice: Передать краткое поэтическое изложение суда именно в том объёме, в каком оно дано в псалме.
  alternative: Добавить упоминание семейств или других участников мятежа из Чис 16.
  rationale: Стих называет Дафана и группу Авирона; детали из более полного повествования не следует вводить непосредственно в перевод.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. «Разверзлась» сохраняет яркость древнееврейского образа и остаётся понятным библейским словом; «сборище» передаёт конкретную мятежную группу, не превращая её в богослужебное собрание.
