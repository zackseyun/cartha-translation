base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/023.yaml
  text: So he said he would destroy them—had not Moses[a], his chosen one, stood in the breach before him to turn back his wrath from destroying.
translation:
  language: ru
  text: И сказал Он, что истребит их, если бы Моисей, Его избранник, не встал в проломе[a] перед Ним, чтобы отвратить Его ярость, чтобы Он не погубил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «встал в бреши». Здесь использован образ человека, занявшего место в проломе стены; так описано заступничество Моисея.'
    reason: Лексическая альтернатива и пояснение исходной метафоры.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал Он
  rationale: Последовательная форма продвигает повествование; «и сказал» естественно передаёт связь с предшествующим контекстом.
- source_word: לְהַשְׁמִידָם
  choice: что истребит их
  rationale: Инфинитив с ל после глагола речи выражает намеренное действие. «Истребит» сохраняет силу השמיד, не обязательно подразумевая метафизическое уничтожение.
- source_word: לוּלֵי
  choice: если бы ... не
  rationale: 'Передаёт контрфактическое исключение: объявленное уничтожение произошло бы, если бы Моисей не вмешался.'
- source_word: בְחִירוֹ
  choice: избранник Его
  rationale: Краткое и естественное обозначение человека, избранного Богом, без привнесения специальной догматической терминологии.
- source_word: עָמַד בַּפֶּרֶץ
  choice: встал ... в проломе
  rationale: Сохраняет конкретный образ человека, занявшего место в проломе стены, и его переносный смысл заступничества.
- source_word: לְפָנָיו
  choice: пред Ним
  rationale: Суффикс естественно относится к Богу; выражение передаёт пребывание Моисея перед Ним как заступника.
- source_word: לְהָשִׁיב חֲמָתוֹ
  choice: чтобы отвратить ярость Его
  rationale: Каузатив שוב означает заставить повернуть назад; в современном русском «отвратить ярость» ясно и достойно передаёт этот смысл.
- source_word: מֵהַשְׁחִית
  choice: и не дать Ему погубить их
  rationale: Предлог מן с инфинитивом выражает предотвращение действия. Развёрнутая формулировка устраняет неестественное русское «отвратить ярость от уничтожения» и сохраняет Бога как подразумеваемого деятеля.
theological_decisions:
- issue: Антропопатический язык о Божьем гневе
  choice: Сохранить выражение «ярость Его»
  alternative: гнев Его; суд
  rationale: Текст прямо говорит о Божьей חֵמָה; перевод не смягчает её до безличного суда и сохраняет богословское напряжение.
- issue: Образ заступничества Моисея
  choice: Сохранить метафору «встал ... в проломе»
  alternative: заступился за них; встал между ними и Богом
  rationale: Образ пролома является существенной частью еврейского текста и представляет Моисея как заступника, не сводя метафору к толкованию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Заглавные местоимения, относящиеся к Богу, использованы последовательно в пределах стиха. Метафора пролома сохранена, а синтаксис второй цели сделан естественным для русского языка.
