lexical_decisions:
- source_word: זָכְרֵנִי
  choice: Вспомни обо мне
  rationale: Императив Qal с суффиксом первого лица выражает прямую молитвенную просьбу. «Вспомни обо мне» естественно по-русски и не добавляет отсутствующей в тексте оценки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בִּרְצוֹן עַמֶּךָ
  choice: когда будешь благоволить к Своему народу
  rationale: 'רָצוֹן обозначает благоволение, расположение, принятие. Предлог בְּ допускает временно-обстоятельственное понимание: псалмопевец просит вспомнить о нём при проявлении Божьего благоволения к народу. Более буквальная возможность сохранена в сноске.'
- source_word: פָּקְדֵנִי
  choice: позаботься обо мне
  rationale: В молитвенном контексте פקד означает обратить внимание, посетить действенной помощью, позаботиться. Выбор передаёт благотворное Божье вмешательство и естественно звучит в современном русском языке.
- source_word: בִּישׁוּעָתֶךָ
  choice: даруя Своё спасение
  rationale: יְשׁוּעָה означает спасение или избавление. Такая формулировка естественно передаёт בְּ как способ спасительного Божьего действия, сохраняя широкое значение существительного.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст прямо содержит тетраграмматон; транслитерация сохраняет личное имя Бога и не заменяет его титулом.
- issue: Смысл בִּרְצוֹן עַמֶּךָ
  choice: 'временно-обстоятельственный: «когда будешь благоволить к Своему народу»'
  alternative: 'сопутствующий или ассоциативный: «с благоволением к Своему народу»'
  rationale: Сжатая еврейская конструкция допускает оба понимания. Основной текст выражает наиболее ясный в контексте смысл, а формально более близкий вариант отмечен в сноске.
- issue: Связь בִּישׁוּעָתֶךָ с глаголом פקד
  choice: Бог заботится о молящемся, даруя спасение
  alternative: Бог посещает молящегося со Своим спасением
  rationale: Сохраняется мысль о действенном Божьем обращении к человеку, но не утверждается, будто речь идёт лишь о пространственном «посещении».
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической торжественностью. Местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксическая неоднозначность первой предложной конструкции и более буквальное значение פקד отражены в сносках.
