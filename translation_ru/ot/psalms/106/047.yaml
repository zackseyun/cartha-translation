    rationale: Существительное תְּהִלָּה означает «хвала, восхваление»; «слава» возможна лишь как отдалённый контекстуальный эффект, но не является здесь равноценной передачей. Основной текст не должен устранять образ хвалы, присутствующий в оригинале.
  - severity: low
    issue: Порядок обращения «Яхве, Бог наш»
    rationale: Он понятен, но «Яхве, наш Бог» звучит в современном литературном русском более непосредственно и не меняет смысла.
  - severity: low
