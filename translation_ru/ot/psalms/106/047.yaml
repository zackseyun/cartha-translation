  text: הוֹשִׁיעֵ֨/נוּ יְה֘וָ֤ה אֱלֹהֵ֗י/נוּ וְ/קַבְּצֵ/נוּ֮ מִֽן הַ/גּ֫וֹיִ֥ם לְ֭/הֹדוֹת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ לְ֝/הִשְׁתַּבֵּ֗חַ בִּ/תְהִלָּתֶֽ/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/047.yaml
  text: Save us[a], O Yahweh our God, and gather us from among the nations[b], that we may give thanks to your holy name and glory in your praise.
translation:
  language: ru
  text: Спаси нас, Яхве, наш Бог, и собери нас из среды народов, чтобы мы благодарили Твоё святое имя и торжествовали, воздавая Тебе хвалу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и хвалились Твоей хвалой»; также возможно: «и ликовали в Твоей хвале».'
    reason: לְהִשְׁתַּבֵּחַ может передавать оттенки «хвалиться», «славиться», «ликовать». Оборот בִּתְהִלָּתֶךָ буквально означает «в Твоей хвале» и допускает как более буквальное, так и разъяснительное русское выражение.
lexical_decisions:
- source_word: הוֹשִׁיעֵנוּ
  choice: Спаси нас
  rationale: Побудительная форма породы хифиль от ישׁע с суффиксом 1-го лица множественного числа выражает прямую молитвенную просьбу о спасении или избавлении; «спаси нас» естественно и полно передаёт её силу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, а не заменяющий его титул; форма «Яхве» общепонятна в современной русской библейской речи.
- source_word: אֱלֹהֵינוּ
  choice: Бог наш
  rationale: Форма с суффиксом 1-го лица множественного числа буквально означает «наш Бог»; порядок слов «Бог наш» сохраняет достоинство молитвенного обращения.
- source_word: וְקַבְּצֵנוּ
  choice: и собери нас
  rationale: Пиэль-императив от קבץ обозначает собирание рассеянных людей; «собери нас» точно и естественно передаёт контекст.
- source_word: מִן הַגּוֹיִם
  choice: из среды народов
  rationale: Предлог מן здесь указывает на выведение из окружения народов, среди которых рассеян народ молитвенника; «из среды народов» делает этот смысл ясным.
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  choice: чтобы мы благодарили твоё святое имя
  rationale: Инфинитив с לְ выражает цель просьбы, а ידה в хифиле здесь означает благодарение; объектом названо святое имя Бога.
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: и хвалились твоей славой
  rationale: Форма хитпаэль от שׁבח передаёт значение «хвалиться, славиться», а תְּהִלָּה допускает значение хвалы, славы или предмета хвалы. Русское сочетание сохраняет необычную и напряжённую образность оригинала.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон, поэтому личное имя сохранено, а не заменено титулом.
- issue: Смысл לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: хвалились твоей славой
  alternative: ликовали, восхваляя тебя; хвалились твоей хвалой
  rationale: Выбранное выражение сохраняет рефлексивно-торжественный смысл глагола и не сводит неоднозначное существительное תְּהִלָּה только к действию восхваления.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Синтаксис остаётся близким к еврейскому, но звучит естественно; строчная форма местоимения «твоё» соответствует современным общим нормам издания.
