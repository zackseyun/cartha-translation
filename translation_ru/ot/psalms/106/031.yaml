  text: And it was counted to him as righteousness from generation to generation forever[a][b].
translation:
  language: ru
  text: И это было засчитано ему как праведность — из поколения в поколение, навеки[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сочтено» либо «вменено». Еврейский оборот означает, что нечто было признано праведностью.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для поколения и поколения» — то есть во всех поколениях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּחָשֶׁב
  choice: было вменено
  rationale: Нифаль от חשב выражает пассивное значение «было сочтено, вменено». «Вменено» сохраняет смысл признания или зачтения, характерный для библейского оборота, хотя в современной речи звучит несколько возвышенно.
- source_word: לוֹ
  choice: ему
  rationale: Предлог ל с местоименным суффиксом указывает на лицо, которому это вменяется; русское «ему» естественно передаёт конструкцию.
- source_word: לִצְדָקָה
  choice: в праведность
  rationale: В сочетании חשב + ל традиционный и точный русский оборот «вменить в праведность» сохраняет смысл оценки как праведности и связь с Быт. 15:6, не сужая значение до одного «праведного поступка».
- source_word: לְדֹר וָדֹר
  choice: из поколения в поколение
  rationale: Буквально «для поколения и поколения» — устойчивое выражение непрерывности во всех следующих поколениях. Русский оборот «из поколения в поколение» передаёт этот смысл естественно.
- source_word: עַד עוֹלָם
  choice: навеки
  rationale: Выражение означает продолжительность без обозначенного конца. «Навеки» естественно для поэтического регистра и точно передаёт усиление временной перспективы.
theological_decisions:
- issue: Связь с Быт. 15:6 и смысл вменённой праведности
  choice: Сохранить формулу «вменено ему в праведность» без последующего богословского разъяснения.
  alternative: «это было признано его праведным поступком»
  rationale: Еврейский текст использует формулу, созвучную Быт. 15:6. Перевод сохраняет эту межтекстовую и богословскую напряжённость, не определяя, идёт ли речь исключительно об оценке поступка, о статусе человека или о более позднем доктринальном понимании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Оборот «вменено в праведность» сохранён ради точности и библейского созвучия; сноска поясняет его обычными современными словами.
