  yaml_path: translation/ot/psalms/106/002.yaml
  text: Who can recount the mighty deeds of Yahweh[b][a], or proclaim all his praise?
translation:
  language: ru
  text: Кто способен поведать о могучих деяниях Яхве[a], возвестить всю хвалу Ему?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH) — личное имя Бога; традиционно переводится как «Господь».
    reason: divine_name
  - marker: b
    text: 'Буквально: «дать услышать всю его хвалу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: Кто способен
  rationale: Вопросительное местоимение вводит риторический вопрос о человеческой способности исчерпывающе рассказать о деяниях Бога.
- source_word: יְמַלֵּל
  choice: поведать
  rationale: Форма породы пиэль от מלל означает высказать или рассказать; «поведать» естественно сочетается с повествованием о могучих деяниях и сохраняет поэтическое достоинство.
- source_word: גְּבוּרוֹת
  choice: могучие деяния
  rationale: Множественное число обозначает проявления силы, то есть совершённые Богом могущественные дела, а не отвлечённое качество силы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: יַשְׁמִיעַ
  choice: возвестить
  rationale: Каузативная форма от שמע буквально значит «дать услышать»; «возвестить» естественно передаёт публичное провозглашение.
- source_word: כָּל
  choice: всю
  rationale: Сохраняет всеохватность еврейского выражения и подчёркивает невозможность исчерпывающе выразить хвалу.
- source_word: תְּהִלָּתוֹ
  choice: хвалу Ему
  rationale: Единственное число с местоименным суффиксом передано собирательно. Дательный оборот по-русски естественно обозначает хвалу, обращённую к Богу, не сужая её до перечня отдельных похвал.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя יהוה, а не титул; транслитерация сохраняет это различие без внесения конфессионального толкования.
- issue: Смысл выражения כָּל־תְּהִלָּתוֹ
  choice: всю хвалу Ему
  alternative: всё, за что Его следует хвалить
  rationale: Выбранный вариант сохраняет грамматически единственное число и допускает как саму хвалу Богу, так и всё содержание Его славы, не сводя выражение только к перечню деяний.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Параллельные инфинитивы «поведать» и «возвестить» передают структуру риторического вопроса; подразумеваемое «способен» относится к обеим частям.
