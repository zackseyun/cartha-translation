  yaml_path: translation/ot/psalms/106/011.yaml
  text: The waters covered their adversaries[b][a]; not one of them remained.
translation:
  language: ru
  text: Воды покрыли их противников; ни одного из них не осталось.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַסּוּ
  choice: покрыли
  rationale: Прямо передаёт значение глагола כסה и сохраняет зримый образ вод, накрывших преследователей.
- source_word: מַיִם
  choice: воды
  rationale: Сохраняет грамматическое число еврейского слова и естественно звучит в поэтическом повествовании о море.
- source_word: צָרֵיהֶם
  choice: их противников
  rationale: Передаёт значение враждебно настроенных преследователей, не добавляя лишней конкретизации; «врагов» также возможно.
- source_word: אֶחָד מֵהֶם לֹא נוֹתָר
  choice: ни одного из них не осталось
  rationale: Естественная русская передача буквального «один из них не остался», ясно выражающая полное отсутствие уцелевших, но не заменяющая глагол более толковательным «выжил».
