lexical_decisions:
- source_word: וַיִּתֵּן
  choice: И Он дал
  rationale: Прямо передаёт последовательную глагольную форму от נתן; «даровал» возможно, но несколько сильнее истолковывает действие.
- source_word: לָהֶם
  choice: им
  rationale: Естественная передача местоименного косвенного дополнения.
- source_word: שֶׁאֱלָתָם
  choice: то, чего они просили
  rationale: שְׁאֵלָה обозначает просьбу или просимое; эта формулировка ясна по-русски и не сводит значение к отвлечённой «просьбе».
- source_word: וַיְשַׁלַּח
  choice: но послал
  rationale: Буквально союз означает «и», однако в контексте между исполненной просьбой и последовавшим бедствием выражен явный контраст; русское «но» естественно его передаёт.
- source_word: רָזוֹן
  choice: истощение
  rationale: Слово обозначает худобу, исхудание или истощение. «Истощение» сохраняет образ и не вводит более узкого медицинского диагноза.
- source_word: בְּנַפְשָׁם
  choice: в их души
  rationale: נֶפֶשׁ может означать душу, жизнь, самого человека или всё его существо. Буквально направительная формулировка сохраняет образ бедствия, достигающего внутренней жизни человека.
theological_decisions:
- issue: Значение נֶפֶשׁ в контексте суда
  choice: Сохранить «души» в основном тексте
  alternative: «жизнь», «всё их существо»
  rationale: «Душа» допустимо и выразительно передаёт еврейское слово, однако не исчерпывает его широкого значения; сноска удерживает эту смысловую открытость и не навязывает противопоставление тела и нематериальной души.
- issue: Связь между исполнением просьбы и бедствием
  choice: Передать союз как «но»
  alternative: Буквальное «и»
  rationale: Контекстуальное противопоставление очевидно, но причинная связь не уточняется сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский с сохранением лаконичного поэтического параллелизма. Местоимение «Он» написано с прописной буквы как ясная ссылка на Бога в контексте псалма; синтаксис остаётся простым и торжественным.
