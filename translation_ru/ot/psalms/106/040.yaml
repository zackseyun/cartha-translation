source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֣ף יְהוָ֣ה בְּ/עַמּ֑/וֹ וַ֝/יְתָעֵ֗ב אֶת נַחֲלָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/040.yaml
  text: So Yahweh’s anger burned against his people[b][a], and he abhorred his inheritance.
translation:
  language: ru
  text: И воспылал гнев Яхве на Его народ[a], и Он возгнушался Своим наследием[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и разгорелась ярость Яхве против Его народа».'
    reason: 'Лексическая альтернатива: сочетание חרה אף допускает передачу «разгорелась ярость», а ב — «против».'
  - marker: b
    text: 'Или: «и Он возненавидел Свой удел».'
    reason: 'Лексическая альтернатива: תעב выражает сильное отвращение, а נחלה может означать «удел».'
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: воспылал гнев
  rationale: Сочетание חרה с אַף буквально рисует гнев как разгорающийся жар. «Воспылал гнев» сохраняет эту метафору и соответствует торжественному, но понятному языку псалма.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены его титулом.
- source_word: בְּעַמּוֹ
  choice: на Его народ
  rationale: Предлог ב при обозначении гнева указывает на объект, против которого он направлен; по-русски это естественно передаётся сочетанием «гнев на».
- source_word: וַיְתָעֵב
  choice: возгнушался
  rationale: Глагол תעב выражает сильное отвращение. «Возгнушался» сохраняет интенсивность и нравственно-эмоциональную окраску исходного слова.
- source_word: נַחֲלָתוֹ
  choice: Своим наследием
  rationale: נחלה означает наследие или удел. Здесь так назван принадлежащий Яхве народ; «наследие» сохраняет заветный и образный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Антропопатический образ Божьего гнева
  choice: воспылал гнев
  alternative: Яхве разгневался
  rationale: Исходный текст использует яркий образ жара. Он сохранён без ослабления и без попытки разрешить богословское напряжение, связанное с описанием Божьей эмоции.
- issue: Сильное отвращение к собственному наследию
  choice: Он возгнушался Своим наследием
  alternative: Он отверг Своё наследие
  rationale: Текст говорит именно об отвращении, а не просто об отвержении. Сильная формулировка сохранена, как и напряжение между принадлежностью народа Богу и Его судом над ним.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Заглавные местоимения при указании на Бога использованы последовательно в рамках стиха. Параллелизм двух еврейских предложений сохранён.
