base_translation:
  language: en
  yaml_path: translation/ot/psalms/106/001.yaml
  text: Praise Yah! Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: ru
  text: Аллилуйя![a] Благодарите Яхве, ибо Он благ, ибо Его неизменная любовь пребывает вовеки.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское «халлелу-Ях» означает «восхваляйте Яха»; Ях — краткая форма имени Яхве.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ибо милость Его — навеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ יָהּ
  choice: Аллилуйя!
  rationale: Устойчивое русское литургическое восклицание передаёт еврейский призыв во множественном числе «восхваляйте Ях» и сохраняет его узнаваемую поэтическую форму.
- source_word: הוֹד֣וּ
  choice: Благодарите
  rationale: Форма повелительного наклонения множественного числа от ידה в данном псаломном контексте призывает воздавать благодарение.
- source_word: לַ/יהוָ֣ה
  choice: Яхве
  rationale: Предлог ל обозначает адресата благодарения, а личное имя יהוה передано распространённой русской транслитерацией «Яхве».
- source_word: כִּי ט֑וֹב
  choice: ибо Он благ
  rationale: כִּי вводит основание для благодарения; у прилагательного טוֹב подразумевается подлежащее, относящееся к Яхве. «Благ» соответствует возвышенному, но понятному стилю псалма.
- source_word: לְ/עוֹלָ֣ם חַסְדּֽ/וֹ
  choice: ибо навеки Его неизменная любовь
  rationale: לְעוֹלָם выражает неограниченную длительность, а חֶסֶד сочетает оттенки любви, милости и постоянной верности. Именная конструкция без добавленного глагола сохраняет лаконизм и ритм еврейского текста.
theological_decisions:
- issue: Передача личного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет тетраграмматон; транслитерация сохраняет личное Божье имя, не смешивая его с титулом.
- issue: Передача краткой формы имени יָהּ в הַלְלוּ־יָהּ
  choice: Аллилуйя
  alternative: Восхваляйте Яха
  rationale: Укоренившееся литургическое слово сохраняет краткую форму имени внутри цельного еврейского возгласа; значение поясняется в сноске.
- issue: Смысл חֶסֶד
  choice: неизменная любовь
  alternative: милость
  rationale: Выбранный вариант удерживает одновременно личный характер любви и её постоянство; традиционное «милость» допустимо, но передаёт более узкий оттенок многозначного слова.
translation_notes:
  register: Современный литературный русский с возвышенной псаломной интонацией. Повтор «ибо… ибо…» сохраняет параллелизм оригинала; местоимение «Он» написано с прописной буквы как принятое в русском религиозном письме, без изменения смысла исходного текста.
