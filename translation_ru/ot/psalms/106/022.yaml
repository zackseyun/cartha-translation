lexical_decisions:
- source_word: נִפְלָאוֹת
  choice: чудеса
  rationale: Форма множественного числа от פלא обозначает необычайные, дивные деяния; «чудеса» естественно и ёмко передаёт смысл в поэтическом параллелизме.
- source_word: בְּאֶרֶץ
  choice: в земле
  rationale: Предлог בְּ с אֶרֶץ имеет здесь обычное локативное значение; выражение «в земле» сохраняет поэтический и библейский регистр.
- source_word: חָם
  choice: Хама
  rationale: В основном тексте сохранено собственное имя, как в еврейском оригинале; в данном контексте это поэтическое обозначение Египта, что поясняется в сноске.
- source_word: נוֹרָאוֹת
  choice: грозные дела
  rationale: Слово от корня ירא обозначает деяния, внушающие страх и благоговейный трепет. «Грозные дела» передаёт эту силу без смысла нравственного зла, возможного у слова «ужасные».
- source_word: עַל
  choice: у
  rationale: При географическом объекте עַל может обозначать местоположение рядом с ним; русское «у» естественно в данном контексте.
- source_word: יַם סוּף
  choice: море Суф
  rationale: Транслитерация сохраняет собственно еврейское наименование и его лексическую неоднозначность; традиционное «Красное море» и буквальная возможность «Тростниковое море» приведены в сноске.
