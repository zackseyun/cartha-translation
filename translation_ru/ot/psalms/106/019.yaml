lexical_decisions:
- source_word: יַעֲשׂוּ
  choice: сделали
  rationale: Глагол עשה в породе qal обычно означает «делать, создавать». «Сделали» прямо и естественно передаёт его значение, не добавляя способа изготовления.
- source_word: עֵגֶל
  choice: тельца
  rationale: Слово עֵגֶל обозначает телёнка или молодого быка. «Телец» сохраняет устойчивую связь с рассказом Исхода 32 и не добавляет отсутствующего здесь определения «золотой».
- source_word: בְּחֹרֵב
  choice: у Хорива
  rationale: Предлог בְ в данном контексте обозначает место. «У Хорива» естественно указывает на местность возле горы и соответствует русскому библейскому употреблению.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: и поклонились
  rationale: Форма глагола שׁחה означает склониться или простереться перед кем-либо в знак почитания. «Поклонились» сохраняет как телесное действие, так и очевидный из контекста смысл идолопоклонства.
- source_word: לְמַסֵּכָה
  choice: литому изваянию
  rationale: מַסֵּכָה обозначает изображение, изготовленное литьём, обычно из металла. «Литое изваяние» передаёт и предмет, и способ его изготовления, не сводя значение к более общему слову «идол».
theological_decisions:
- issue: Следует ли прямо назвать тельца золотым
  choice: Оставить «тельца» без определения «золотого».
  alternative: «золотого тельца»
  rationale: В Исходе 32 сказано, что телец был сделан из золота, однако в данном стихе он назван лишь тельцом и литым изваянием. Добавление «золотого» внесло бы в основной текст деталь из более широкого контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Телец» и «изваяние» понятны современному читателю и уместны в поэтическом контексте; синтаксис кратко воспроизводит параллельные действия еврейского текста.
