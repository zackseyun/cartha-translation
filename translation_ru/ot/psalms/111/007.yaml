  text: מַעֲשֵׂ֣י יָ֭דָי/ו אֱמֶ֣ת וּ/מִשְׁפָּ֑ט נֶ֝אֱמָנִ֗ים כָּל פִּקּוּדָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/007.yaml
  text: The works of his hands are truth and justice[b][a]; all his precepts are trustworthy.
translation:
  language: ru
  text: Дела рук Его — истина и правосудие[a]; все повеления Его надёжны.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «верность и правосудие» вместо «истина и правосудие».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все наставления Его достойны доверия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲשֵׂי
  choice: дела
  rationale: Форма сопряжённого множественного числа обозначает сделанное или совершённое; «дела» естественно и точно звучит в русской поэзии.
- source_word: יָדָיו
  choice: рук Его
  rationale: Сохранён буквальный поэтический образ рук как выражение действующей силы Бога.
- source_word: אֱמֶת
  choice: истина
  rationale: Существительное характеризует Божьи дела; «истина» сохраняет форму и смысловой диапазон еврейского слова, не сливая его со следующим утверждением о надёжности.
- source_word: וּמִשְׁפָּט
  choice: и правосудие
  rationale: Здесь слово обозначает справедливый суд и правовой порядок; «правосудие» естественно выступает отвлечённым качеством в паре с «истиной».
- source_word: נֶאֱמָנִים
  choice: надёжны
  rationale: Предикативная форма выражает устойчивую достоверность и то, что на Божьи повеления можно положиться.
- source_word: כָּל
  choice: все
  rationale: Сохранён прямой всеобщий смысл.
- source_word: פִּקּוּדָיו
  choice: повеления Его
  rationale: «Повеления» передаёт установленные Богом обязательные предписания и сохраняет юридико-нравственный оттенок, оставаясь понятным современному читателю.
theological_decisions:
- issue: Передача אֱמֶת при характеристике Божьих дел
  choice: истина
  alternative: верность
  rationale: «Истина» сохраняет именную форму и поэтическое сочетание с правосудием; значение надёжности уже отчётливо выражено словом נֶאֱמָנִים во второй половине стиха.
- issue: Передача פִּקּוּדָיו
  choice: повеления Его
  alternative: наставления Его
  rationale: «Повеления» не ослабляет обязательную, нормативную силу еврейского термина, тогда как «наставления» может восприниматься как более общий совет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Постпозиция местоимения «Его» поддерживает достоинство псалмового регистра без чрезмерной архаизации; еврейский параллелизм и образ «рук» сохранены.
