  yaml_path: translation/ot/psalms/111/009.yaml
  text: He sent redemption to his people[a]; he has commanded his covenant forever[b]. Holy and awesome is his name.
translation:
  language: ru
  text: 'Он послал избавление Своему народу;

    навеки установил Свой завет[a].

    Свято Его имя, и оно внушает благоговейный трепет[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «навеки повелел Свой завет». Еврейский глагол означает «повелеть, назначить»; в этом контексте он может выражать властное установление завета.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «страшно Его имя». Еврейское слово говорит о страхе и благоговейном трепете, которые внушает Божье имя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּדוּת
  choice: избавление
  rationale: Слово обозначает освобождение, в том числе достигнутое выкупом или решительным вмешательством. «Избавление» естественно по-русски и сохраняет широкий смысл; «искупление» могло бы неоправданно сузить его до богословского термина.
- source_word: שָׁלַח
  choice: послал
  rationale: Сохранён прямой смысл глагола и образ Бога, посылающего избавление Своему народу.
- source_word: לְעַמּוֹ
  choice: Своему народу
  rationale: Предлог לְ указывает на адресата или получателя. Возвратное «Своему» естественно связывает народ с подлежащим «Он».
- source_word: צִוָּה
  choice: заповедал
  rationale: Передаёт властный характер еврейского глагола «повелеть, назначить». Хотя сочетание «заповедал завет» несколько возвышенно, оно понятно и ближе к форме источника, чем более толковательное «установил».
- source_word: לְעוֹלָם
  choice: навек
  rationale: Краткий поэтический эквивалент, выражающий неограниченную длительность.
- source_word: בְּרִיתוֹ
  choice: Свой завет
  rationale: «Завет» — точный и укоренённый русский эквивалент בְּרִית; возвратное местоимение ясно соотносит его с Богом.
- source_word: קָדוֹשׁ
  choice: свято
  rationale: Краткая форма среднего рода согласуется со словом «имя» и сохраняет предикативное утверждение исходного текста.
- source_word: וְנוֹרָא
  choice: внушает трепет
  rationale: Передаёт сочетание благоговения и страха, заключённое в נוֹרָא, не сводя смысл ни к разговорному «потрясающее», ни к одному лишь ужасу.
- source_word: שְׁמוֹ
  choice: Его имя
  rationale: Сохранён библейский образ имени как явленного характера и славы Бога без поясняющего парафраза.
theological_decisions:
- issue: Смысл צִוָּה при словах «Свой завет»
  choice: навек заповедал Свой завет
  alternative: навек установил Свой завет
  rationale: Основной текст сохраняет властную силу глагола «повелеть, назначить» и не подменяет её исключительно идеей учреждения; более естественное контекстуальное прочтение дано в примечании.
- issue: Смысл נוֹרָא применительно к имени Бога
  choice: внушает трепет
  alternative: страшно; достойно благоговейного страха
  rationale: Формулировка удерживает одновременно величие и благоговейный страх, не ослабляя слово до общего восхищения и не представляя его как простой ужас.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия сведена к минимуму; три смысловые строки сохраняют параллелизм псалма. Прописные буквы в местоимениях, относящихся к Богу, соответствуют принятому благоговейному русскому издательскому регистру.
