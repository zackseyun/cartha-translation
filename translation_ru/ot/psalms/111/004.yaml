base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/004.yaml
  text: He has caused his wondrous works to be remembered[a]; Yahweh is gracious and compassionate.
translation:
  language: ru
  text: Он сделал так, чтобы помнили о Его чудесных делах[a]; милостив и сострадателен Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он установил памятный знак в память о Своих чудесных делах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵכֶר
  choice: чтобы … помнили
  rationale: Существительное обозначает «память, памятование, памятный знак». В сочетании с עָשָׂה и לְנִפְלְאוֹתָיו естественная русская глагольная конструкция передаёт мысль о том, что Бог обеспечил Своим делам непреходящую память, не исключая более предметного смысла «памятный знак».
- source_word: עָשָׂה
  choice: сделал так
  rationale: Буквально глагол означает «сделал». В данной конструкции оборот «сделал так, чтобы» естественно передаёт результативный смысл и не требует добавлять не названное в тексте средство сохранения памяти.
- source_word: לְנִפְלְאֹתָיו
  choice: Его чудесные дела
  rationale: נִפְלָאוֹת здесь обозначает необычайные, вызывающие изумление деяния Бога. «Чудесные дела» яснее сохраняет деятельный смысл, чем одно слово «чудеса».
- source_word: חַנּוּן
  choice: милостив
  rationale: Прилагательное выражает благосклонность и готовность даровать милость; «милостив» — прямой, привычный и достойный русский эквивалент.
- source_word: וְרַחוּם
  choice: и сострадателен
  rationale: רַחוּם обозначает сострадание и милосердие. «Сострадателен» различает оттенки двух соседних прилагательных и передаёт эмоциональную сторону этого слова.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом «Господь».
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Форма «Яхве» сохраняет его как имя и соответствует принятой научной реконструкции произношения.
- issue: Подлежащее первой части стиха
  choice: «Он» относится к Яхве, названному в конце стиха
  alternative: 'Безличное прочтение: «О Его чудесных делах установлена память»'
  rationale: Глагол стоит в мужском роде, единственном числе, а явное подлежащее появляется лишь в конце строки. Такое отложенное называние подлежащего естественно для еврейской поэзии; местоимение делает эту связь ясной по-русски, не вводя нового участника.
- issue: Характер памяти о чудесных делах
  choice: Бог сделал так, чтобы их помнили
  alternative: Бог создал памятный знак Своим чудесным делам
  rationale: Сочетание זֵכֶר עָשָׂה допускает как результативную мысль о сохранении в памяти, так и более предметное понимание памятного установления. Основной текст передаёт первое, а сноска сохраняет второе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «милостив и сострадателен Яхве» сохраняет торжественный параллелизм исходной строки, оставаясь понятной современному читателю.
