    reason: alternative_reading
lexical_decisions:
- source_word: כֹּחַ
  choice: силу
  rationale: Передаёт значение силы и могущества; сочетание «сила Своих дел» сохраняет образ еврейского текста.
- source_word: מַעֲשָׂיו
  choice: Своих дел
  rationale: «Дела» естественно и достаточно формально передаёт Божьи деяния, о которых говорится в псалме.
- source_word: הִגִּיד
  choice: явил
  rationale: Hiphil от נגד означает сообщить, возвестить, сделать известным. В этом контексте «явил» естественно выражает раскрытие Божьего могущества через историческое действие.
- source_word: לְעַמּוֹ
  choice: Своему народу
  rationale: 'Предлог ל обозначает косвенный объект: Бог явил это Своему народу.'
- source_word: לָתֵת
  choice: отдав
  rationale: 'Деепричастная конструкция передаёт вероятный оттенок средства или проявившегося результата: сила была явлена тем, что Бог дал народу наследие. Целевая трактовка сохранена в сноске.'
- source_word: לָהֶם
  choice: им
  rationale: Местоимение явно отсылает к Божьему народу и сохранено в переводе.
- source_word: נַחֲלַת
  choice: во владение наследие
  rationale: «Наследие» сохраняет важное значение נַחֲלָה как удела, полученного во владение; оборот «во владение» делает действие передачи земли естественным по-русски.
- source_word: גּוֹיִם
  choice: народов
  rationale: Здесь имеются в виду чужие народы, чья земля стала уделом Израиля; «народов» нейтрально и контекстуально точно.
theological_decisions:
- issue: Связь оборота לָתֵת לָהֶם נַחֲלַת גּוֹיִם с главным предложением
  choice: 'Оттенок средства или результата: Бог явил силу Своих дел, отдав им наследие народов.'
  alternative: 'Целевой оттенок: Бог возвестил Своему народу силу Своих дел, чтобы дать им наследие народов.'
  rationale: Инфинитив с ל может обозначать цель, результат или средство. Контекст воспевает Божьи исторические деяния, поэтому основному тексту подходит инструментальное понимание, а подлинная грамматическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают принятый русский библейский регистр. Формулировка сохраняет сжатость стиха и не устраняет неоднозначность инфинитивной конструкции.
