  text: גְּ֭דֹלִים מַעֲשֵׂ֣י יְהוָ֑ה דְּ֝רוּשִׁ֗ים לְ/כָל חֶפְצֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/002.yaml
  text: Great are the works of the LORD, studied by all who delight in them.
translation:
  language: ru
  text: Велики дела Господа[a]; их исследуют все, кто находит в них радость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте здесь стоит личное имя Бога — יהוה (ЙХВХ), традиционно передаваемое словом «Господь».
    reason: Показывает исходное Божественное имя, не нарушая привычного русского чтения.
lexical_decisions:
- source_word: גְּדֹלִים
  choice: велики
  rationale: Сохраняет вынесенное в начало emphатическое определение и торжественный поэтический строй.
- source_word: מַעֲשֵׂי
  choice: дела
  rationale: Обычное и широкое соответствие, охватывающее деяния и творения Господа без ненужного сужения смысла.
- source_word: דְּרוּשִׁים
  choice: их исследуют
  rationale: Передаёт значение того, что усердно разыскивают, рассматривают и изучают; активная безлично-обобщённая конструкция естественнее по-русски, чем буквальное «исследуемы».
- source_word: חֶפְצֵיהֶם
  choice: кто находит в них радость
  rationale: Передаёт не только интеллектуальный интерес, но и удовольствие, расположение и наслаждение делами Господа; местоимение «них» соотнесено с «делами».
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь с пояснительной сноской
  alternative: Яхве
  rationale: Следует укоренившейся русской библейской традиции, при этом сноска сохраняет сведения о личном имени в еврейском тексте.
- issue: Характер отношения к делам Господа
  choice: исследование соединено с радостью от них
  alternative: их ищут все желающие их
  rationale: 'Так сохраняются оба смысловых элемента стиха: внимательное обращение к делам и удовольствие тех, кто ими занимается, без сведения חפץ к одному лишь волевому желанию.'
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным псалмовым ритмом. Точка с запятой подчёркивает параллельность двух частей стиха.
