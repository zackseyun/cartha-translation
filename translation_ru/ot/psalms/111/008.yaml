  text: סְמוּכִ֣ים לָ/עַ֣ד לְ/עוֹלָ֑ם עֲ֝שׂוּיִ֗ם בֶּ/אֱמֶ֥ת וְ/יָשָֽׁר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/008.yaml
  text: They are established forever and ever[b][a], done in truth and uprightness.
translation:
  language: ru
  text: Они твёрдо установлены навеки, навсегда[a], устроены по истине и правде[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поддерживаемы навеки, навсегда»; еврейское причастие может подчёркивать, что они поддерживаются или сделаны незыблемыми.'
    reason: lexical_alternative
  - marker: b
    text: '«По истине» можно также перевести: «в верности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְמוּכִים
  choice: прочно утверждены
  rationale: Страдательное причастие от סמך передаёт идею поддержки и придания прочности. «Прочно утверждены» естественно выражает незыблемость Божьих повелений и сохраняет оттенок установленной прочности.
- source_word: לָעַד לְעוֹלָם
  choice: навеки и навсегда
  rationale: Два близких обозначения длительности взаимно усиливают мысль о непреходящем характере повелений; русская парная формула сохраняет этот акцент.
- source_word: עֲשׂוּיִם
  choice: исполнены
  rationale: Страдательное причастие от עשה буквально указывает на то, что они сделаны или осуществлены. «Исполнены» сохраняет пассивную форму и достойно звучит в описании Божьих повелений, не вводя дополнительного субъекта действия.
- source_word: בֶּאֱמֶת
  choice: в истине
  rationale: אֱמֶת охватывает значения истины, надёжности и верности. Основной текст сохраняет прямое значение «истина», а возможный оттенок верности отмечен в сноске.
- source_word: וְיָשָׁר
  choice: и правоте
  rationale: יָשָׁר означает прямое, правильное, правое. Существительное «правота» согласуется с абстрактным выражением «в истине» и передаёт нравственную правильность без конфессионального уточнения.
theological_decisions:
- issue: 'Характер Божьих повелений: объективная истинность или верность'
  choice: в истине
  alternative: в верности
  rationale: Еврейское אֱמֶת допускает оба оттенка. В основном тексте оставлено более прямое «истина», а богословски значимый оттенок надёжности и верности сохранён как открытая альтернатива в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Формула «навеки и навсегда» передаёт усиление двух еврейских обозначений вечной длительности; лексическая неоднозначность אֱמֶת сохранена с помощью сноски.
