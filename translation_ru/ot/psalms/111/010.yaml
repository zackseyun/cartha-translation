id: PSA.111.10
reference: Psalms 111:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: רֵ֘אשִׁ֤ית חָכְמָ֨ה יִרְאַ֬ת יְהוָ֗ה שֵׂ֣כֶל ט֭וֹב לְ/כָל עֹשֵׂי/הֶ֑ם תְּ֝הִלָּת֗/וֹ עֹמֶ֥דֶת לָ/עַֽד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/010.yaml
  text: The fear of Yahweh is the beginning of wisdom[a]; good understanding belongs to all who practice it[c][b]. His praise stands forever.
translation:
  language: ru
  text: Страх перед Яхве — начало мудрости; здравое разумение — у всех, кто исполняет их[a]. Его хвала пребывает вовеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у всех, кто делает их». Местоимение «их» не имеет явно названного объекта в этом стихе; вероятно, речь о повелениях Яхве, упомянутых выше, однако выражение можно понимать и шире — как исполнение того, чего требует страх перед Ним.'
    reason: Сохранение синтаксической неоднозначности еврейского текста.
  - marker: b
    text: 'Или: «Его хвала стоит вечно».'
    reason: Более буквальная передача еврейского образа устойчивости и непреходящего пребывания.
lexical_decisions:
- source_word: רֵאשִׁית חָכְמָה
  choice: начало мудрости
  rationale: Сохраняет естественный смысл исходной точки или основания мудрости, не сужая его лишь до временного начала.
- source_word: יִרְאַת יְהוָה
  choice: страх перед Яхве
  rationale: «Страх» сохраняет присущие еврейскому выражению благоговение, трепет и серьёзность, а личное имя יהוה передано как «Яхве».
- source_word: שֵׂכֶל טוֹב
  choice: здравое разумение
  rationale: По-русски естественно выражает положительно оцениваемые разумность, проницательность и практическое благоразумие.
- source_word: לְכָל עֹשֵׂיהֶם
  choice: у всех, кто исполняет их
  rationale: Передаёт отсутствующую в еврейском связку и сохраняет местоимение множественного числа без навязывания ему прямо не названного в стихе объекта.
- source_word: תְּהִלָּתוֹ
  choice: Его хвала
  rationale: Местоименный суффикс естественнее всего относится к Яхве; «хвала» сохраняет возможность понимать выражение как воздаваемую Ему хвалу или Его славу и достохвальность.
- source_word: עֹמֶדֶת לָעַד
  choice: пребывает вовеки
  rationale: Естественно передаёт устойчивость и непреходящий характер хвалы, стоящие за еврейским образом «стоит навеки».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно употреблено личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Смысл יִרְאָה
  choice: страх
  alternative: благоговение
  rationale: «Благоговение» передаёт часть значения, но может чрезмерно смягчить сильное слово исходного текста; «страх» сохраняет богословское напряжение традиционной формулы мудрости.
- issue: Неявный объект в עֹשֵׂיהֶם
  choice: сохранить множественное «их» и пояснить сноской
  alternative: «поступает так» или «практикует его», относя выражение к страху перед Яхве
  rationale: Еврейский суффикс имеет форму множественного числа, хотя явного множественного антецедента в самом стихе нет. Вероятна отсылка к повелениям Яхве из предшествующего контекста, но текст не следует молча уточнять.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической строки. Тире воспроизводят краткость именных предложений; «вовеки» сохраняет уместный для псалма возвышенный, но понятный регистр.
