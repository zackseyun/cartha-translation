base_translation:
  language: en
  yaml_path: translation/ot/psalms/111/005.yaml
  text: He has given food to those who fear him[a]; he will remember his covenant forever.
translation:
  language: ru
  text: Он дал пищу[a] тем, кто боится Его; Он вечно будет помнить Свой завет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «добычу»; еврейское слово может обозначать пищу, добытую охотой, но здесь, вероятно, речь идёт о пище вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶף
  choice: пищу
  rationale: Существительное может означать добычу или пищу, добытую охотой, однако в контексте Божьего благодеяния естественнее общее значение «пища». Конкретность еврейского слова сохранена без расширительного толкования «всё необходимое».
- source_word: נָתַן
  choice: дал
  rationale: Еврейский перфект обозначает совершённое действие; простое прошедшее время точно и естественно передаёт его здесь.
- source_word: לִירֵאָיו
  choice: тем, кто боится Его
  rationale: Причастная форма обозначает людей, для которых характерен страх перед Богом. Формулировка сохраняет вес глагола ירא и звучит естественно по-русски, не ослабляя его до одного лишь почтения.
- source_word: יִזְכֹּר
  choice: будет помнить
  rationale: Имперфект допускает будущее или обобщённо-настоящее прочтение. В сочетании с לְעוֹלָם здесь выбран будущий смысл, подчёркивающий непрекращающуюся верность Бога завету; буквальный образ «помнить» сохранён.
- source_word: לְעוֹלָם
  choice: вечно
  rationale: Естественно передаёт неограниченную длительность в контексте Божьего завета.
- source_word: בְּרִיתוֹ
  choice: Свой завет
  rationale: «Завет» — точный и укоренённый русский эквивалент ברית. Возвратное притяжательное местоимение естественно указывает на завет Бога как подлежащего второй части стиха.
theological_decisions:
- issue: Смысл того, что Бог «помнит» завет
  choice: Сохранено буквальное выражение «будет помнить Свой завет», подразумевающее верность завету, проявляемую в поступках.
  alternative: «Будет верен Своему завету» или «будет соблюдать Свой завет».
  rationale: В библейском употреблении Божье «воспоминание» о завете включает действие в соответствии с ним. Буквальный перевод сохраняет исходный образ и не подменяет его толкованием.
- issue: Временное значение יִזְכֹּר
  choice: 'Будущее время: «будет помнить».'
  alternative: 'Обобщённое настоящее: «помнит».'
  rationale: Обе возможности грамматически допустимы, но לְעוֹלָם естественно поддерживает направленное вперёд утверждение о неизменной верности Бога.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным ритмом. Повтор «Он» делает параллельные утверждения прозрачными. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с традиционным русским библейским регистром.
