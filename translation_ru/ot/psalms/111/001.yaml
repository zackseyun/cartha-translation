  yaml_path: translation/ot/psalms/111/001.yaml
  text: Praise Yah! I will give thanks to Yahweh with my whole heart[b][a], in the council of the upright and in the congregation.
translation:
  language: ru
  text: Аллилуйя![a] Буду благодарить Яхве всем сердцем — в кругу праведных и в собрании.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Хвалите Ях!»; «Ях» — краткая форма имени Яхве.
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово, переданное как «круг», может означать близкий круг, совет или собравшееся сообщество.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַ֥לְלוּ יָ֨הּ
  choice: Аллилуйя!
  rationale: Традиционная и естественная для русского библейского и богослужебного языка передача еврейского призыва во множественном числе «хвалите Ях». Примечание раскрывает буквальный смысл и краткую форму имени.
- source_word: אוֹדֶ֣ה
  choice: Буду славить
  rationale: Форма выражает личное намерение или обет публично восхвалять Бога с благодарностью; «славить» естественно передаёт широкий смысл ידה в контексте псалма.
- source_word: יְ֭הוָה
  choice: Яхве
  rationale: Передаёт личное божественное имя, сохраняя отличие полной формы יהוה от краткой формы יה в начальном возгласе.
- source_word: בְּ/כָל לֵבָ֑ב
  choice: всем сердцем
  rationale: Естественное современное русское выражение полной, нераздельной внутренней преданности.
- source_word: בְּ/ס֖וֹד
  choice: в кругу
  rationale: סוֹד может обозначать близкий круг, совет или собрание. «В кругу» сохраняет оттенок тесного сообщества и отличает это слово от следующего עֵדָה.
- source_word: יְשָׁרִ֣ים
  choice: праведных
  rationale: В данном нравственном контексте обозначает людей прямых и честных перед Богом; «праведных» понятно современному русскому читателю.
- source_word: וְ/עֵדָֽה
  choice: и в собрании
  rationale: עֵדָה обозначает собравшуюся общину; «собрание» естественно в данном контексте и сохраняет отличие от סוֹד.
theological_decisions:
- issue: Передача יָהּ и יְהוָה в одном стихе
  choice: Краткую форму יָהּ сохранить внутри традиционного «Аллилуйя», а יְהוָה передать как «Яхве»
  alternative: Передать обе формы словом «Господь» либо написать «Хвалите Яха! … Яхве»
  rationale: Так сохраняется различие форм божественного имени, присутствующее в еврейском тексте, при этом начальный возглас звучит естественно и узнаваемо по-русски.
- issue: Значение אוֹדֶה
  choice: «Буду славить»
  alternative: «Буду благодарить»
  rationale: Еврейский глагол охватывает благодарение и хвалу. Контекст допускает оба оттенка; основной текст сохраняет широкое значение прославления, не исключая благодарности.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Традиционное «Аллилуйя» сохранено ради естественности и узнаваемости; тире ясно связывает обстоятельства места с глаголом. Все примечания отмечены в основном тексте.
