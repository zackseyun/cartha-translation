  yaml_path: translation/ot/psalms/111/003.yaml
  text: Splendor and majesty are his work[a], and his righteousness stands forever.
translation:
  language: ru
  text: Его деяние исполнено великолепия и величия, и Его праведность[a] пребывает вечно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד
  choice: славно
  rationale: В сочетании с הָדָר слово передаёт сияющее великолепие и славу. Наречная форма естественно выражает в русском языке именное сказуемое еврейской строки.
- source_word: הָדָר
  choice: величественно
  rationale: Слово обозначает величие, великолепие и почёт; «величественно» сохраняет возвышенный поэтический тон и не сливается по значению со «славно».
- source_word: פָּעֳלוֹ
  choice: Его деяние
  rationale: Существительное в единственном числе означает дело, деяние или деятельность. «Деяние» сохраняет единственное число и возвышенный, но понятный регистр псалма.
- source_word: צִדְקָתוֹ
  choice: Его праведность
  rationale: Основное значение связано с праведностью, хотя в данном смысловом поле возможно и «справедливость». «Праведность» шире описывает неизменную нравственную верность Бога.
- source_word: עֹמֶדֶת
  choice: пребывает
  rationale: Причастие от עמד буквально выражает стояние и устойчивость. «Пребывает» естественно передаёт непрерывность и постоянство, не утяжеляя русскую строку буквализмом «стоит».
- source_word: לָעַד
  choice: вовеки
  rationale: Выражение означает вечную продолжительность. «Вовеки» ясно, лаконично и соответствует возвышенному поэтическому регистру.
theological_decisions:
- issue: Передача צִדְקָתוֹ как свойства Бога, пребывающего вовеки
  choice: Его праведность
  alternative: Его справедливость
  rationale: Еврейское слово может обозначать как праведность, так и справедливость. Контекст прославляет Божьи деяния и Его неизменное нравственное совершенство в широком смысле, поэтому в основном тексте сохранено «праведность», а судебно-общественный оттенок «справедливость» отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Именная конструкция оригинала естественно преобразована в «деяние славно и величественно»; смысл и пара близких понятий сохранены. Местоимение «Его» написано с прописной буквы как принятое в русском библейском стиле уважительное обозначение Бога.
