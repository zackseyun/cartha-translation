source:
  edition: WLC
  text: עַד אָ֨נָה אָשִׁ֪ית עֵצ֡וֹת בְּ/נַפְשִׁ֗/י יָג֣וֹן בִּ/לְבָבִ֣/י יוֹמָ֑ם עַד אָ֓נָה יָר֖וּם אֹיְבִ֣/י עָלָֽ/י־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/002.yaml
  text: How long must I take counsel in my soul[b][a], with sorrow in my heart all day? How long will my enemy be exalted over me?
translation:
  language: ru
  text: Доколе мне строить планы в душе моей[a], весь день нося скорбь в сердце? Доколе враг мой будет возвышаться надо мной[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Доколе мне слагать замыслы в душе моей?»'
    reason: Лексически более буквальная передача глагола «класть, полагать» и существительного «замыслы, советы».
  - marker: b
    text: 'Или: «будет торжествовать надо мной?» Буквально: «будет возвышаться надо мной».'
    reason: «Торжествовать» естественно выражает смысл образа, тогда как основной текст сохраняет буквальную метафору.
lexical_decisions:
- source_word: עַד־אָנָה
  choice: доколе
  rationale: Краткая и возвышенная, но понятная современному читателю формула плача; повтор сохранён.
- source_word: אָשִׁית עֵצוֹת
  choice: мне строить планы
  rationale: Глагол буквально означает «класть, полагать», а существительное во множественном числе — «советы, замыслы, планы». Русское сочетание естественно передаёт мучительное самостоятельное обдумывание дальнейших действий.
- source_word: בְּנַפְשִׁי
  choice: в душе моей
  rationale: Сохраняет еврейское обозначение внутреннего существа человека и поэтический регистр.
- source_word: יָגוֹן בִּלְבָבִי יוֹמָם
  choice: весь день нося скорбь в сердце
  rationale: Причастный оборот естественно связывает безглагольную еврейскую фразу с первой строкой, не меняя её смысла; יוֹמָם передано как продолжительность в течение дня.
- source_word: יָרוּם ... עָלָי
  choice: будет возвышаться надо мной
  rationale: Сохраняет буквальный вертикальный образ превосходства врага, не сводя его без необходимости к более толковательному «торжествовать».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с поэтическим оттенком. «Доколе» поддерживает повтор и напряжение плача; синтаксис сделан естественным для русского, а образ души, сердца и возвышающегося врага сохранён.
