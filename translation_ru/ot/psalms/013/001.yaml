lexical_decisions:
- source_word: עַד־אָנָה
  choice: доколе
  rationale: Устойчивое поэтическое вопрошание о длительности. «Доколе» естественно для литературной русской молитвенной речи и сохраняет повторяющийся возглас плача.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: תִּשְׁכָּחֵנִי
  choice: Ты будешь забывать меня
  rationale: Qal imperfect, 2-е лицо единственного числа мужского рода с объектным суффиксом 1-го лица; форма вопроса передаёт переживание продолжающегося оставления.
- source_word: נֶצַח
  choice: вечно?
  rationale: Наречное употребление усиливает жалобу. Отдельный вопросительный акцент сохраняет напряжённое сочетание «доколе» и «вечно».
- source_word: תַּסְתִּיר
  choice: будешь скрывать
  rationale: Прямая передача Hiphil imperfect от סתר; в сочетании с «лицом» русский глагол сохраняет образ исходного текста.
- source_word: פָּנֶיךָ
  choice: Своё лицо
  rationale: Сохранён конкретный древнееврейский образ; «Своё» естественно по-русски при совпадении действующего лица и обладателя.
- source_word: מִמֶּנִּי
  choice: от меня
  rationale: Обычное обозначение удаления или отделения, естественное при глаголе «скрывать».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Следует ли раскрыть выражение «Своё лицо» как «Своё присутствие»
  choice: Сохранить «Своё лицо» в основном тексте
  alternative: Своё присутствие; Своё благоволение
  rationale: Образ может подразумевать присутствие и благоволение Бога, однако исходный текст сохраняет конкретную метафору. Её истолкование вынесено в примечание.
- issue: Напряжение между «доколе» и «вечно»
  choice: Сохранить буквально и подчеркнуть пунктуацией
  alternative: Доколе Ты будешь совсем забывать меня?
  rationale: Фраза представляет собой эмоционально напряжённый вопрос плача, а не логическое утверждение о буквальном вечном забвении; сглаживание устранило бы намеренную риторическую силу.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. «Доколе» слегка возвышенно, но понятно и точно передаёт повторный возглас плача. Заглавные буквы в местоимениях, относящихся к Богу, использованы как принятая русская издательская норма.
