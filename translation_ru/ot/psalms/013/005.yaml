  text: וַ/אֲנִ֤י בְּ/חַסְדְּ/ךָ֣ בָטַחְתִּי֮ יָ֤גֵ֥ל לִבִּ֗/י בִּֽ/ישׁוּעָ֫תֶ֥/ךָ אָשִׁ֥ירָה לַ/יהוָ֑ה כִּ֖י גָמַ֣ל עָלָֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/013/005.yaml
  text: But as for me[a], I have trusted in your steadfast love; my heart will rejoice in your salvation. I will sing to Yahweh, because he has dealt bountifully with me.
translation:
  language: ru
  text: Но я положился на Твою неизменную любовь; моё сердце возрадуется Твоему спасению[a]. Я буду петь Яхве, потому что Он щедро одарил меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавлению». Еврейское слово может обозначать как избавление от нынешней беды, так и спасение в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Но я
  rationale: Союз и самостоятельное местоимение подчёркивают контраст с предшествующей жалобой; в современном русском «Но я» передаёт его естественно и без излишней тяжеловесности.
- source_word: בְּחַסְדְּךָ
  choice: на Твою неизменную любовь
  rationale: חֶסֶד обозначает милостивую, верную и постоянную любовь, нередко в контексте отношений завета. «Неизменная любовь» сохраняет оттенки любви и надёжности, не сужая значение до одной лишь милости.
- source_word: בָטַחְתִּי
  choice: я положился
  rationale: Перфект выражает совершившийся и сохраняющий силу акт доверия. «Положился» передаёт эту устойчивую опору точнее, чем простое настоящее «уповаю».
- source_word: יָגֵל
  choice: возрадуется
  rationale: Имперфект направлен к ожидаемой Божьей помощи; будущее время естественно передаёт предвкушаемую радость.
- source_word: לִבִּי
  choice: моё сердце
  rationale: Прямой перевод сохраняет библейское обозначение внутреннего человека.
- source_word: בִּישׁוּעָתֶךָ
  choice: Твоему спасению
  rationale: יְשׁוּעָה допускает как конкретное избавление от беды, так и более широкое спасение. «Спасение» сохраняет обе перспективы, а русское управление «возрадоваться чему» естественно передаёт еврейскую конструкцию с בְּ.
- source_word: אָשִׁירָה
  choice: Я буду петь
  rationale: Когортатив выражает намерение и решимость; будущее время с личным местоимением ясно передаёт волевой оттенок.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаётся личное имя יהוה, а не заменяющий его титул.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину пения; «потому что» ясно и современно.
- source_word: גָמַל עָלָי
  choice: Он щедро одарил меня
  rationale: Идиома описывает щедрое благодеяние. Этот перевод сохраняет положительный смысл и избегает возможного оттенка заслуженной награды в слове «воздал».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Объём значения יְשׁוּעָה
  choice: спасение
  alternative: избавление
  rationale: «Спасение» сохраняет широкую богословскую перспективу, не исключая конкретного избавления из нынешней беды; возможное более узкое значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Сохранены контраст между жалобой и доверием, движение от совершившегося упования к ожидаемой радости и решительное обещание петь. Местоимения, относящиеся к Богу, написаны с прописной буквы как уместная русская библейская норма.
