lexical_decisions:
- source_word: הַבִּיטָה
  choice: Взгляни
  rationale: Повелительная форма выражает просьбу о внимательном, обращённом к молящемуся взгляде Бога; «взгляни» кратко и естественно передаёт прямоту обращения.
- source_word: עֲנֵנִי
  choice: ответь мне
  rationale: В молитвенном контексте глагол обычно означает «ответить»; перевод не добавляет прямо не выраженного значения благоприятного вмешательства.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהָי
  choice: Бог мой
  rationale: Сохраняет притяжательную форму и личный характер обращения; порядок слов уместен в возвышенной русской молитвенной речи.
- source_word: הָאִירָה עֵינַי
  choice: дай свет моим глазам
  rationale: Сохраняет телесно-поэтический образ причинения света глазам, не сводя его однозначно к силе, ясности или надежде.
- source_word: פֶּן
  choice: иначе
  rationale: Естественно вводит в современном русском языке опасаемое следствие, сохраняя связь между просьбой и угрозой смерти.
- source_word: אִישַׁן הַמָּוֶת
  choice: я усну смертным сном
  rationale: Передаёт метафору смерти как сна в естественной и традиционно понятной русской форме, хотя существительное «сон» в еврейском явно не выражено.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит собственное имя Бога; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Значение образа света в глазах
  choice: 'Сохранить открытый метафорический образ: «дай свет моим глазам»'
  alternative: «верни мне силы» / «дай мне ясность» / «подари мне надежду»
  rationale: Образ может подразумевать оживление, ясность или надежду, но сам стих не выбирает только одно из этих значений.
- issue: Метафора сна и смерти
  choice: «усну смертным сном»
  alternative: «усну в смерти» / «усну смертью»
  rationale: Выбранная формулировка естественна по-русски и сохраняет поэтическое сопоставление смерти со сном; примечание отмечает более буквальное строение еврейской фразы.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Прямые повелительные формы сохраняют настойчивость мольбы; метафоры света и сна не заменены толкованием.
