lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Термин в надписаниях псалмов обозначает человека, руководящего музыкальным исполнением; дательный падеж естественно передаёт приставку לַ־ в таком заголовке.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Обычное жанровое обозначение песни с музыкальным сопровождением; «псалом» — точный и общепонятный русский эквивалент.
- source_word: לְדָוִד
  choice: Давида
  rationale: Родительный падеж в выражении «псалом Давида» звучит естественно и, подобно еврейской конструкции, допускает авторство или более широкую связь с Давидом.
theological_decisions:
- issue: Значение לְדָוִד в надписании
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида
  rationale: Еврейский предлог לְ־ в надписаниях может указывать на авторство, принадлежность, посвящение или связь со сборником. Основной перевод не сужает значение исключительно до авторства, а примечание прямо сохраняет возможные оттенки.
translation_notes:
  register: Краткое надписание передано современным литературным русским языком в традиционном, но понятном библейском регистре. Маркер примечания поставлен непосредственно после слова «Давида», к которому относится пояснение.
