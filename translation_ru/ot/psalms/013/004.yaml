lexical_decisions:
- source_word: פֶּן
  choice: чтобы… не
  rationale: Вводит нежелательный результат, который псалмопевец просит Бога предотвратить; по-русски естественно передаётся конструкцией «чтобы… не».
- source_word: יֹאמַר
  choice: сказал
  rationale: Обычное значение глагола אמר; форма согласована с отрицательно-целевой конструкцией после פֶּן.
- source_word: אֹיְבִי
  choice: враг мой
  rationale: Точно передаёт существительное в единственном числе с суффиксом первого лица; порядок слов поддерживает поэтический регистр.
- source_word: יְכָלְתִּיו
  choice: Я одолел его
  rationale: Глагол יכל с объектным суффиксом означает, что враг хвалится тем, что превозмог или одолел псалмопевца; «одолел» естественно в контексте противоборства и не предполагает непременно полного уничтожения.
- source_word: צָרַי
  choice: противники мои
  rationale: Передаёт множественное число с суффиксом первого лица и сохраняет лексическое различие с единственным «враг мой» в первой части стиха.
- source_word: יָגִילוּ
  choice: ликовали
  rationale: Передаёт не просто радость, а торжествующее злорадство противников.
- source_word: כִּי
  choice: когда
  rationale: В данном контексте может обозначать обстоятельство или момент ликования противников. Временное прочтение естественно по-русски; причинное значение сохранено в примечании.
- source_word: אֶמּוֹט
  choice: я пошатнусь
  rationale: Форма от מוט описывает утрату устойчивости — буквальную или переносную. «Пошатнусь» сохраняет образ и не усиливает его до окончательного падения.
