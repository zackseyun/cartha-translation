base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/005.yaml
  text: He does not lend his money at interest[a], and does not take a bribe against the innocent[b]. The one who does these things will never be shaken.
translation:
  language: ru
  text: Тот, кто не даёт денег под проценты[a] и не берёт взятки против невиновного, не поколеблется вовек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не даёт денег в рост»; еврейское נֶשֶׁךְ означает процент, взимаемый по займу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּסְפּוֹ
  choice: своих денег
  rationale: כֶּסֶף буквально означает «серебро», но в контексте займа естественно обозначает деньги; возвратное «своих» согласуется с русской конструкцией при подлежащем «кто».
- source_word: נָתַן בְּנֶשֶׁךְ
  choice: даёт ... в рост
  rationale: Устойчивое русское выражение «давать деньги в рост» ясно передаёт предоставление займа под проценты и сохраняет отрицательную нравственную окраску контекста, не ограничивая смысл лишь чрезмерными процентами.
- source_word: שֹׁחַד
  choice: взятки
  rationale: «Взятка» — прямой и общепонятный русский эквивалент, сохраняющий судебно-нравственный смысл.
- source_word: עַל נָקִי
  choice: против невиновного
  rationale: Предлог עַל здесь указывает, что взятку принимают ради действия против человека, не несущего вины; буквальная сжатость оригинала сохранена.
- source_word: עֹשֵׂה אֵלֶּה
  choice: Кто так поступает
  rationale: Субстантивированное причастие естественно передано русским обобщённо-личным оборотом; «так» охватывает перечисленные в псалме качества и поступки.
- source_word: לֹא יִמּוֹט לְעוֹלָם
  choice: не поколеблется вовек
  rationale: «Поколеблется» сохраняет метафору устойчивости глагола מוֹט, а «вовек» передаёт לְעוֹלָם и соответствует возвышенному, но понятному регистру Псалтири.
theological_decisions:
- issue: Нравственный охват запрета на נֶשֶׁךְ
  choice: Передать как «даёт деньги в рост», не сужая запрет до чрезмерных процентов.
  alternative: «Не отдаёт денег под грабительские проценты» или «не занимается ростовщичеством».
  rationale: נֶשֶׁךְ обозначает процент по займу; уточнение о чрезмерности отсутствует в еврейском тексте, а современное «ростовщичество» может восприниматься как особая практика с непомерной ставкой.
- issue: Характер обещанной устойчивости
  choice: Сохранить образное «не поколеблется вовек».
  alternative: «Никогда не будет низвержен».
  rationale: Глагол מוֹט выражает шатание или утрату устойчивости, не уточняя конкретный вид бедствия; перевод не должен догматически конкретизировать обещание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмопевческим звучанием. Синтаксис краток и доступен; «вовек» уместно сохраняет достоинство и ритм заключительной формулы.
