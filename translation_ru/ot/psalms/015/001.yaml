lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшееся и точное обозначение поэтического произведения этого жанра в надписании.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русская родительная конструкция естественна для надписания и не вынуждает однозначно понимать еврейский предлог לְ как указание только на авторство.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет употреблённое в еврейском тексте имя, не заменяя его титулом.
- source_word: יָגוּר
  choice: может быть гостем
  rationale: Глагол גור обозначает проживание пришельца или гостя; эта формулировка сохраняет оттенок гостеприимства и отличается от более постоянного «жить» во второй строке.
- source_word: בְּאָהֳלֶךָ
  choice: в Твоём шатре
  rationale: «Шатёр» передаёт конкретный образ אֹהֶל и при этом не устраняет подразумеваемую связь со святилищем.
- source_word: יִשְׁכֹּן
  choice: может жить
  rationale: שׁכן означает жить, обитать или поселяться; простое «жить» естественно по-русски и сохраняет параллель с пребыванием гостя.
- source_word: בְּהַר קָדְשֶׁךָ
  choice: на Твоей святой горе
  rationale: Прямая и естественная передача выражения, относящегося к святой горе Бога, вероятно Сиону.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение לְ в надписании לְדָוִד
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида
  rationale: Еврейская конструкция допускает авторство, связь с Давидом или посвящение; родительный падеж и примечание сохраняют эту неоднозначность.
- issue: Образ шатра
  choice: шатёр с возможным указанием на святилище в примечании
  alternative: скиния
  rationale: Буквальное значение אֹהֶל — «шатёр»; культовый контекст вероятен, но перевод «скиния» сделал бы подразумеваемую связь однозначной.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. «Быть гостем» передаёт оттенок временного или зависимого проживания в גור, а «жить» во второй строке сохраняет смысловой контраст. Местоимения, обращённые к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
