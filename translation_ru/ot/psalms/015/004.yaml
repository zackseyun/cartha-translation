- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет это различие.
- issue: Смысл נִבְזֶה בְּעֵינָיו נִמְאָס
  choice: В его глазах отвержен презренный
  alternative: В его глазах презрен человек негодный
  rationale: Еврейская конструкция предельно сжата и допускает близкие варианты синтаксического и смыслового прочтения. Основной текст сохраняет её оценочную напряжённость, а традиционное нравственное истолкование отмечено в сноске.
- issue: Смысл клятвы לְהָרַע
  choice: клятва, исполнение которой вредит самому давшему её
  alternative: клятва причинить зло
  rationale: Контекст описывает верность слову; однако буквальная конструкция не выражает местоименного объекта, поэтому эллиптичность отмечена в сноске.
