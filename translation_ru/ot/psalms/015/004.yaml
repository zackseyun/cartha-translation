lexical_decisions:
- source_word: נִבְזֶה בְּעֵינָיו נִמְאָס
  choice: В его глазах отвержен презренный
  rationale: Сохраняет сжатость и два пассивно-оценочных элемента еврейской фразы, не превращая презренного безоговорочно в нравственно «мерзкого» человека.
- source_word: יִרְאֵי יְהוָה
  choice: боящихся Яхве
  rationale: Сохраняет обычное библейское выражение о благоговейном страхе перед Богом, не ослабляя его до одного лишь уважения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: יְכַבֵּד
  choice: почитает
  rationale: 'Естественно передаёт значение piel глагола כבד: оказывать честь, считать достойным уважения.'
- source_word: נִשְׁבַּע לְהָרַע
  choice: поклявшись себе во вред
  rationale: 'Передаёт наиболее вероятный смысл эллиптической фразы: человек остаётся верен клятве, даже когда её исполнение оборачивается ущербом для него самого.'
- source_word: וְלֹא יָמִר
  choice: не изменяет клятве
  rationale: Глагол означает «менять, заменять»; добавление подразумеваемого объекта делает русскую фразу ясной, не меняя смысла.
