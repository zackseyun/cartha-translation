  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис первой строки намеренно несколько плотный, чтобы сохранить компактность и неоднозначность еврейского текста; «почитает» и «боящихся» поддерживают библейский регистр без архаизации.
