base_translation:
  language: en
  yaml_path: translation/ot/psalms/015/003.yaml
  text: He does not slander with his tongue[a], does not do evil to his neighbor[c][b], and does not bear reproach against his close one.
translation:
  language: ru
  text: Кто не клевещет языком своим[a], не делает зла ближнему своему[b] и не высказывает оскорбления против близкого своего[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не ходит, разнося сплетни языком своим».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не причиняет зла другу своему» или «товарищу своему».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может означать родственника, близкого человека или того, кто находится рядом; «оскорбление» также можно передать как «поношение» или «позор».
    reason: lexical_alternative
lexical_decisions:
- source_word: רָגַל
  choice: клевещет
  rationale: В сочетании с «языком» глагол обозначает распространение порочащих речей или пересудов; «клевещет» естественно и кратко передаёт основную этическую силу выражения.
- source_word: עַל לְשֹׁנוֹ
  choice: языком своим
  rationale: Творительный падеж естественно выражает орудие речи и сохраняет конкретный образ языка.
- source_word: עָשָׂה ... רָעָה
  choice: не делает зла
  rationale: Широкое выражение оригинала сохранено без сужения до физического вреда или конкретной обиды.
- source_word: לְרֵעֵהוּ
  choice: ближнему своему
  rationale: רֵעַ может означать друга, товарища или человека из ближайшего сообщества; «ближний» сохраняет широкую нравственную направленность.
- source_word: חֶרְפָּה
  choice: поношения
  rationale: Слово охватывает оскорбление, поругание и связанный с ними общественный позор; «поношение» уместно в достоинственном русском регистре.
- source_word: נָשָׂא ... עַל
  choice: не возводит ... на
  rationale: Буквальный образ поднятия или несения поношения в данном сочетании передаёт активное навлечение или высказывание позора против другого; «возводить поношение на» сохраняет образ и остаётся понятным.
- source_word: קְרֹבוֹ
  choice: близкого своего
  rationale: Форма означает близкого или находящегося рядом человека и может включать родственника либо близкого знакомого; перевод намеренно не ограничивает значение кровным родством.
