lexical_decisions:
- source_word: הוֹלֵךְ
  choice: живёт
  rationale: Причастие от הלך буквально описывает «хождение», но здесь это устойчивый образ образа жизни и поведения. «Живёт» естественно передаёт этот смысл в современном русском языке.
- source_word: תָּמִים
  choice: непорочно
  rationale: Слово обозначает цельность и нравственную безупречность поведения, не обязательно абсолютное совершенство или безгрешность. Наречная форма согласуется со смыслом сочетания הוֹלֵךְ תָּמִים.
- source_word: וּפֹעֵל
  choice: поступает
  rationale: Причастие от פעל означает «делает, осуществляет». В сочетании с צֶדֶק русское «поступает» естественно выражает практическое нравственное действие.
- source_word: צֶדֶק
  choice: праведно
  rationale: צֶדֶק охватывает значения праведности, справедливости и того, что правильно. «Поступает праведно» сохраняет нравственный смысл и звучит естественнее буквального «делает праведность».
- source_word: וְדֹבֵר
  choice: говорит
  rationale: Прямое значение причастия דבר; форма сохраняет параллелизм трёх характеристик человека.
- source_word: אֱמֶת
  choice: истину
  rationale: В сочетании с глаголом речи слово прежде всего указывает на правдивость, хотя может также включать оттенок надёжности и верности.
- source_word: בִּלְבָבוֹ
  choice: в своём сердце
  rationale: Буквально «в его сердце». Возвратное местоимение естественно по-русски соотносит сердце с действующим лицом, а образ сердца сохраняет указание на внутреннего человека и искренность.
theological_decisions:
- issue: Нравственная цельность или абсолютная безгрешность
  choice: живёт непорочно
  alternative: живёт совершенно; живёт честно и цельно
  rationale: תָּמִים характеризует цельность и безупречность жизненного пути, но сам по себе не требует утверждения абсолютной безгрешности.
- issue: Род и обобщающее единственное число
  choice: Тот, кто… в своём сердце
  alternative: Человек, который… в своём сердце; всякий, кто… в своём сердце
  rationale: Мужской род и единственное число исходного текста переданы как обычное для русского языка обобщающее обозначение человека без изменения референции.
- issue: Праведность и справедливость в צֶדֶק
  choice: поступает праведно
  alternative: поступает справедливо; делает то, что правильно
  rationale: Контекст допускает оттенки праведности, справедливости и правильного поведения. Основной текст сохраняет традиционную нравственно-богословскую лексику, а примечание отмечает широту слова.
