  yaml_path: translation/ot/psalms/015/000.yaml
  text: A psalm of David[a]. Yahweh[b], who may dwell in your tent? Who may live on your holy mountain?
translation:
  language: ru
  text: 'Псалом Давида[a].


    Господи, кто может пребывать в Твоём шатре[b]? Кто может обитать на Твоей святой горе?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «псалом, связанный с Давидом» или «псалом для Давида»; еврейская надпись может указывать на авторство, принадлежность, связь с Давидом или посвящение ему.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «скинии»; буквально в еврейском тексте — «шатре», что, вероятно, указывает на святилище как место Божьего присутствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Обычное и точное русское обозначение поэтической песни, исполняемой с музыкальным сопровождением.
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая традиционная передача еврейской конструкции; её смысловой диапазон — авторство, принадлежность, связь или посвящение — сохранён в сноске.
- source_word: יְהוָה
  choice: Господи
  rationale: В прямом обращении употреблена укоренённая в русской библейской речи передача Божественного имени; звательная форма естественно выражает обращение.
- source_word: יָגוּר
  choice: может пребывать
  rationale: Передаёт идею пребывания у Бога, не усиливая временный оттенок глагола до явно краткого гостевания.
- source_word: בְּאָהֳלֶךָ
  choice: в Твоём шатре
  rationale: Сохраняет буквальный образ шатра и его контекстуальную связь со святилищем; возможное значение разъяснено в сноске.
- source_word: יִשְׁכֹּן
  choice: может обитать
  rationale: Передаёт устойчивое проживание и сохраняет поэтический параллелизм с «пребывать».
- source_word: בְּהַר קָדְשֶׁךָ
  choice: на Твоей святой горе
  rationale: Прямая и естественная передача образа святой горы как места Божьего присутствия.
theological_decisions:
- issue: Передача тетраграмматона יְהוָה
  choice: Господи
  alternative: Яхве
  rationale: Выбрана естественная и благоговейная форма прямого обращения, привычная современному русскому читателю; она не добавляет конфессионально специфического толкования.
- issue: Характер пребывания в Божьем присутствии
  choice: пребывать / обитать
  alternative: гостить / жить
  rationale: Пара сохраняет различие еврейских глаголов и богословское напряжение между допуском в святилище и устойчивым пребыванием, не сводя первый вопрос лишь к краткому визиту.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Заголовок отделён от основного текста. Прописные буквы в местоимениях «Твоём» и «Твоей» поддерживают благоговейный русский религиозный регистр; два параллельных вопроса сохранены.
