  terminology: «Имя», «все народы», «благословятся через него» и «назовут его блаженным» адекватно передают ключевые выражения. «Через него» в русском яснее, чем «в нём», для обозначения средства/основания благословения, не исключая возвратного понимания, которое сохранено в сноске. «Блаженным» уместно в высоком псалмовом регистре для יְאַשְּׁרוּהוּ.
