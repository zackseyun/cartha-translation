base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/017.yaml
  text: May his name endure forever[a]; before the sun, may his name continue. May all nations be blessed in him[c][b]; may they call him blessed.
translation:
  language: ru
  text: 'Да пребудет имя его вовек;


    пока светит солнце,[a]

    да процветает имя его.[b]


    Да благословятся через него все народы,[c]

    да назовут его блаженным.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед солнцем». В поэтическом контексте это, вероятно, означает: «пока существует (светит) солнце».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол редок и допускает также значения «продолжается», «умножается» или «распространяется».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «пусть все народы благословляют себя им». Еврейскую форму можно понимать возвратно.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי שְׁמוֹ לְעוֹלָם
  choice: Да будет имя его вовеки
  rationale: Юссив выражает пожелание или молитву. Формулировка сохраняет еврейский образ имени и естественно передаёт непреходящую славу и память.
- source_word: לִפְנֵי שֶׁמֶשׁ
  choice: перед солнцем
  rationale: Буквальный пространственный образ сохранён в основном тексте; вероятный временной смысл «пока существует солнце» указан в сноске.
- source_word: ינין שְׁמוֹ
  choice: да продолжается имя его
  rationale: Редкий и трудный глагол, вероятно, указывает на продолжение, произрастание, умножение или распространение имени. Нейтральное «продолжается» не снимает неопределённость чрезмерно.
- source_word: וְיִתְבָּרְכוּ בוֹ
  choice: да благословятся в нём
  rationale: Возвратно-средняя форма допускает как получение благословения, так и благословение себя посредством царя. Русское «благословятся в нём» сохраняет эту библейскую формулу и её связь с обещанием народам.
- source_word: כָּל גּוֹיִם
  choice: все народы
  rationale: В универсальном царском контексте речь идёт обо всех народах мира; это естественный и точный русский эквивалент.
- source_word: יְאַשְּׁרוּהוּ
  choice: да назовут его блаженным
  rationale: Порода piel глагола אשר означает признать или провозгласить кого-либо счастливым, благословенным. «Назовут блаженным» сохраняет возвышенный библейский регистр.
theological_decisions:
- issue: Царский и мессианский масштаб стиха
  choice: Сохранить непосредственную отнесённость к царю и возможность более широкого мессианского прочтения, не вводя прямого христологического отождествления.
  alternative: Ограничить стих лишь историческим царём либо представить его исключительно как прямое мессианское пророчество.
  rationale: Язык псалма относится к царю, но его всемирный и непреходящий масштаб выходит за пределы обычной царской похвалы. Формула о благословении всех народов сохраняет межтекстовую связь с обещанием Аврааму без конфессионального уточнения.
- issue: Значение возвратной формы וְיִתְבָּרְכוּ
  choice: «да благословятся в нём»
  alternative: «пусть благословляют себя им»
  rationale: Еврейская форма допускает средне-пассивное и возвратное понимание. Основной текст оставляет естественное для русского языка средне-пассивное прочтение, а возвратная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим строем. Частица «да» передаёт молитвенно-пожелательный характер юссивов; инверсия «имя его» поддерживает достоинство псалмового регистра, оставаясь понятной современному читателю.
