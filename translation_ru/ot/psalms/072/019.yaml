base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/019.yaml
  text: And blessed be his glorious name forever[a], and may his glory fill the whole earth[b]. Amen and amen.
translation:
  language: ru
  text: Да будет благословенно Его славное имя вовек[a], и да наполнит Его слава всю землю[b]. Аминь и аминь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имя Его славы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всю страну».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: И благословенно
  rationale: Пассивное причастие в славословной формуле передано так, чтобы сохранить как утверждение, так и пожелательно-литургический оттенок.
- source_word: שֵׁם כְּבוֹדוֹ
  choice: имя славы Его
  rationale: Сохранена еврейская сопряжённая конструкция «имя Его славы», естественно перестроенная по-русски; это не сводит выражение однозначно к прилагательному «славное».
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Краткая и укоренённая в русском библейском регистре передача неограниченной длительности.
- source_word: וְיִמָּלֵא
  choice: и да наполнит
  rationale: 'Нифаль имперфекта понят пожелательно: в данной конструкции с показателем прямого дополнения слава выступает тем, что наполняет землю.'
- source_word: כְבוֹדוֹ
  choice: слава Его
  rationale: «Слава» точно соответствует славословному контексту и сохраняет смысловую связь с предшествующим כְּבוֹדוֹ.
- source_word: אֶת כֹּל הָאָרֶץ
  choice: всю землю
  rationale: Контекст заключительного славословия указывает на всеобщий охват; винительный показатель אֶת обозначает землю как объект наполнения.
- source_word: אָמֵן וְאָמֵן
  choice: Аминь и аминь
  rationale: Сохранена удвоенная литургическая формула подтверждения.
theological_decisions:
- issue: Объём значения הָאָרֶץ
  choice: вся земля — весь мир
  alternative: вся страна / вся земля Израиля
  rationale: Всеобщий горизонт псалма и космический образ наполнения славой поддерживают универсальное значение, хотя слово само по себе может означать и страну.
- issue: Синтаксическая роль славы в וְיִמָּלֵא כְבוֹדוֹ אֶת־כֹּל הָאָרֶץ
  choice: Его слава наполняет всю землю
  alternative: вся земля наполняется Его славой
  rationale: Наличие אֶת перед כֹּל הָאָרֶץ формально отмечает «всю землю» как прямое дополнение; русский активный оборот сохраняет эту структуру, не устраняя пожелательный оттенок формы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным богослужебным звучанием. Формы «вовеки» и «аминь» сохранены как понятные и уместные в славословии; синтаксис не перегружен архаизмами.
