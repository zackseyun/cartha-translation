    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «и пусть он молится о нём». В еврейском тексте субъект молитвы прямо не указан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיחִי
  choice: Да живёт он!
  rationale: Форма юссива 3-го лица мужского рода единственного числа от חיה выражает пожелание или благословение, а не однозначное предсказание будущего.
- source_word: וְיִתֶּן לוֹ
  choice: Пусть ему дают
  rationale: В еврейском употреблена активная форма единственного числа, но действующее лицо не названо. Русская неопределённо-личная конструкция естественно передаёт неопределённого дарителя, не вводя его в текст.
- source_word: מִזְּהַב שְׁבָא
  choice: золото из Савы
  rationale: Предлог מן указывает на происхождение или источник дара; оборот сохраняет географическую связь золота с Савой и звучит естественно по-русски.
- source_word: וְיִתְפַּלֵּל בַּעֲדוֹ
  choice: пусть о нём непрестанно молятся
  rationale: Hitpael глагола פלל с בעד означает молитву за кого-либо. Неопределённо-личная русская конструкция сохраняет отсутствие явно названного субъекта.
- source_word: תָמִיד
  choice: непрестанно
  rationale: Слово обозначает постоянство или регулярную непрерывность; «непрестанно» соответствует возвышенному поэтическому регистру.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Краткий и естественный русский эквивалент временного выражения.
- source_word: יְבָרֲכֶנְהוּ
  choice: пусть весь день благословляют его
  rationale: Форма содержит объектный суффикс «его», тогда как субъект прямо не назван. Неопределённо-личное «благословляют» естественно передаёт общее пожелание публичного благословения.
theological_decisions:
- issue: К кому относятся царские прошения в Псалме 72
  choice: Передать стих как молитвенное пожелание о царе из дома Давида, не добавляя в перевод прямого мессианского истолкования.
  alternative: Перевести стих как непосредственное пророчество о Мессии.
  rationale: Еврейский текст непосредственно выражает пожелания о царе; при этом перевод не исключает более широкого канонического или мессианского прочтения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Повтор «пусть» сохраняет последовательность пожеланий; неопределённо-личные конструкции не вынуждают называть отсутствующих в еврейском тексте действующих лиц.
