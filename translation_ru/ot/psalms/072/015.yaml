  yaml_path: translation/ot/psalms/072/015.yaml
  text: May he live[a], and may gold from Sheba be given to him. May prayer be made for him continually[b]; all day long may they bless him.
translation:
  language: ru
  text: Да живёт он! Пусть ему дают[a] золото из Савы; пусть о нём непрестанно молятся[b], пусть весь день благословляют его.
  philosophy: optimal-equivalence
  footnotes:
