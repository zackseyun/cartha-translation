lexical_decisions:
- source_word: יָדִין
  choice: Да судит
  rationale: Форма Qal imperfect 3 м. р. ед. ч. допускает как пожелание, так и будущее значение. В контексте молитвы о царе конструкция «да судит» естественно передаёт пожелательный оттенок, не скрывая иной возможности, отмеченной в сноске.
- source_word: עַמְּךָ
  choice: твой народ
  rationale: Точно передаёт собирательное существительное עם с суффиксом 2 м. р. ед. ч.; порядок слов естественен для современного русского языка.
- source_word: בְצֶדֶק
  choice: по правде
  rationale: Передаёт צדק как нравственную правоту и справедливость царского суда, при этом сохраняет лексическое различие с последующим מִשְׁפָּט.
- source_word: וַעֲנִיֶּיךָ
  choice: и твоих угнетённых
  rationale: Слово עָנִי может обозначать бедных, нуждающихся, угнетённых или страдающих. «Угнетённых» хорошо передаёт их уязвимое и притесняемое положение, а варианты вынесены в сноску.
- source_word: בְמִשְׁפָּט
  choice: по справедливости
  rationale: Здесь מִשְׁפָּט обозначает справедливый суд или правосудие. Русское выражение ясно передаёт норму, согласно которой царь должен судить.
theological_decisions:
- issue: Пожелательное или предсказательное значение начального имперфекта в царском псалме
  choice: 'Пожелание: «Да судит»'
  alternative: 'Будущее: «Он будет судить»'
  rationale: Начало псалма имеет характер молитвы о царе, поэтому пожелательное прочтение контекстуально убедительно. Поскольку еврейская форма допускает и будущее понимание, оно сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской формулой «да судит». Местоимения, относящиеся к Богу, даны со строчной буквы в соответствии с нейтральной современной издательской практикой. Эллипсис во второй части обозначен тире для ясности и естественного русского ритма.
