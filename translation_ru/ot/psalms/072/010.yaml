source:
  edition: WLC
  text: מַלְכֵ֬י תַרְשִׁ֣ישׁ וְ֭/אִיִּים מִנְחָ֣ה יָשִׁ֑יבוּ מַלְכֵ֥י שְׁבָ֥א וּ֝/סְבָ֗א אֶשְׁכָּ֥ר יַקְרִֽיבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/010.yaml
  text: May the kings of Tarshish and of the coastlands bring tribute; may the kings of Sheba and Seba present gifts.
translation:
  language: ru
  text: 'Пусть цари Фарсиса и островов принесут дань,

    пусть цари Шевы и Севы поднесут дары.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַרְשִׁישׁ
  choice: Фарсис
  rationale: Традиционная и узнаваемая русская передача географического названия Таршиш.
- source_word: אִיִּים
  choice: острова
  rationale: Основное значение слова — «острова»; в контексте оно может охватывать далёкие морские земли, но конкретизация до «побережий» не обязательна.
- source_word: מִנְחָה
  choice: дань
  rationale: В политическом контексте царей дар имеет характер подношения или дани; «дань» естественно передаёт смысл признания власти.
- source_word: יָשִׁיבוּ
  choice: принесут
  rationale: Буквально глагол может означать «возвратят», однако в сочетании с подношением выражает принесение дани; русское «принесут» звучит естественно и не привносит идею ранее существовавшего долга.
- source_word: שְׁבָא וּסְבָא
  choice: Шевы и Севы
  rationale: Сохраняется различие между двумя названиями в еврейском тексте без отождествления их с современными территориями.
- source_word: אֶשְׁכָּר
  choice: дары
  rationale: Редкое слово обозначает дар или дань; здесь «дары» отличает его от מִנְחָה и соответствует параллелизму.
- source_word: יַקְרִיבוּ
  choice: поднесут
  rationale: Передаёт торжественное представление даров царю и сохраняет оттенок приближения/предъявления, присущий глаголу.
theological_decisions:
- issue: Модальность глагольных форм в благопожелательном контексте псалма
  choice: «Пусть ... принесут / пусть ... поднесут»
  alternative: «... принесут / ... поднесут» как простое предсказание
  rationale: Краткие формы в данном контексте допускают пожелание; конструкция с «пусть» сохраняет благопожелательный тон, не превращая стих в категорическое пророческое утверждение.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим параллелизмом. Географические имена переданы узнаваемо, при этом различие Шевы и Севы сохранено.
