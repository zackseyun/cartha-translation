  text: יְהִ֤י פִסַּת בַּ֨ר בָּ/אָרֶץ֮ בְּ/רֹ֪אשׁ הָ֫רִ֥ים יִרְעַ֣שׁ כַּ/לְּבָנ֣וֹן פִּרְי֑/וֹ וְ/יָצִ֥יצוּ מֵ֝/עִ֗יר כְּ/עֵ֣שֶׂב הָ/אָֽרֶץ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/016.yaml
  text: May there be an abundance of grain in the land[a]; on the tops of the mountains may its fruit wave like Lebanon; and may people blossom from the city like the grass of the earth.
translation:
  language: ru
  text: Да будет на земле обилие зерна[a]; пусть на вершинах гор колышется его плод, словно Ливан; и пусть жители города цветут, как трава на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «горсть зерна на земле». Редкое еврейское выражение может указывать либо на небольшое количество зерна, которое приносит необычайно обильный плод, либо просто на изобилие зерна.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהִי
  choice: Да будет
  rationale: Юссив глагола היה выражает молитвенное пожелание; «да будет» естественно и достойно передаёт эту силу в русском поэтическом контексте.
- source_word: פִסַּת בַּר
  choice: обилие хлеба
  rationale: Редкое и спорное сочетание может обозначать как малую меру зерна, так и изобилие. В контексте необычайного плодородия основной текст передаёт смысл «обилие хлеба», а буквальная традиционная возможность отмечена в сноске.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: В контексте земледельческого благословения речь идёт о земле как территории страны; русское «на земле» сохраняет также возможный более широкий оттенок.
- source_word: בְּרֹאשׁ הָרִים
  choice: на вершинах гор
  rationale: Прямой и естественный перевод образа, подчёркивающего плодородие даже на горных вершинах.
- source_word: יִרְעַשׁ ... פִּרְיוֹ
  choice: пусть колышется его плод
  rationale: Глагол буквально означает сильное движение, дрожание или сотрясение; о растительности «колышется» естественно передаёт движение обильного урожая.
- source_word: כַּלְּבָנוֹן
  choice: словно Ливан
  rationale: Сравнение с Ливаном сохранено без истолкования; оно вызывает образ величия и пышной растительности.
- source_word: וְיָצִיצוּ מֵעִיר
  choice: и пусть люди цветут в городах
  rationale: Множественное число глагола предполагает жителей как невыраженное подлежащее. «Люди цветут» сохраняет растительную метафору; единственное собирательное מֵעִיר естественно передано русским множественным «в городах».
- source_word: כְּעֵשֶׂב הָאָרֶץ
  choice: как трава на земле
  rationale: Сохраняется прямое сравнение многочисленности и процветания людей с обильно растущей травой.
theological_decisions:
- issue: Толкование редкого сочетания פִסַּת בַּר
  choice: обилие хлеба
  alternative: горсть зерна
  rationale: Образ обильного плода, который колышется, словно Ливан, поддерживает значение изобилия. Однако лексически возможное и традиционное понимание как малой меры зерна не исключено и сохранено в сноске, чтобы не устранять подлинную неоднозначность.
- issue: Неявное подлежащее וְיָצִיצוּ
  choice: люди
  alternative: они
  rationale: В еврейском тексте подлежащее прямо не названо, но сочетание с городом естественно указывает на его жителей. Явное «люди» делает русский текст понятным, не вводя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-поэтическим строем. «Хлеб» употреблено в библейском земледельческом значении «зерно, злаки»; синтаксис сохраняет параллелизм стиха.
