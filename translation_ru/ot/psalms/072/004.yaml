lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: да судит
  rationale: Имперфект qal 3 м. ед. от שׁפט допускает будущее и пожелательное прочтение. В контексте молитвы о царе конструкция «да судит» естественно передаёт пожелание, сохраняя судебный смысл глагола.
- source_word: עֲנִיֵּי עָם
  choice: бедных из народа
  rationale: עֲנִיִּים обозначает бедных, страждущих или угнетённых; параллель с «детьми нуждающегося» выдвигает на первый план нужду. «Из народа» естественно по-русски передаёт конструкцию принадлежности, не превращая её в неопределённое «среди людей».
- source_word: יוֹשִׁיעַ
  choice: спасает
  rationale: Hiphil от ישׁע означает спасать или избавлять. Вслед за пожелательным «да судит» форма настоящего времени входит в русскую конструкцию с частицей «да» и сохраняет сильный смысл избавления.
- source_word: לִבְנֵי אֶבְיוֹן
  choice: детей нуждающегося
  rationale: בני буквально означает «сыновей/детей» и здесь имеет собирательный, не ограниченный мужским полом смысл. Единственное число «нуждающегося» сохраняет грамматическую форму אֶבְיוֹן и отличие от עֲנִיֵּי.
- source_word: וִידַכֵּא
  choice: и сокрушает
  rationale: דכא выражает сокрушение или разрушение. «Сокрушает» сохраняет силу образа и ясно направляет действие царского правосудия против притеснителя.
- source_word: עוֹשֵׁק
  choice: угнетателя
  rationale: Причастие от עשׁק обозначает того, кто угнетает, притесняет или эксплуатирует. «Угнетатель» кратко и естественно передаёт постоянную характеристику действующего лица.
theological_decisions:
- issue: Наклонение глаголов во всём стихе
  choice: 'пожелательно-молитвенное: «Да судит он…»'
  alternative: 'простое будущее: «Он будет судить…»'
  rationale: Контекст Псалма 72 допускает восприятие еврейских имперфектов как молитвенного пожелания о царе, но не исключает будущего значения. Основной текст передаёт молитвенную силу, а примечание сохраняет альтернативу без усиления предсказательного смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Частица «да» передаёт пожелательность без архаической перегруженности; однородные сказуемые читаются под её действием.
