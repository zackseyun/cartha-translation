source:
  edition: WLC
  text: יֵ֭רֵד כְּ/מָטָ֣ר עַל גֵּ֑ז כִּ֝/רְבִיבִ֗ים זַרְזִ֥יף אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/006.yaml
  text: May he come down like rain on mown grass[c][b][a], like showers that water the earth.
translation:
  language: ru
  text: Да сойдёт он, как дождь на скошенную траву[a][b], как ливни, орошающие землю[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он сойдёт, как дождь на скошенную траву». Еврейский имперфект в данном контексте может выражать как пожелание или молитву, так и описание будущего.'
    reason: alternative_reading
  - marker: b
    text: '«Скошенная трава» — также возможно: «срезанная трава». Некоторые понимают еврейское слово как «состриженная шерсть», но сельскохозяйственный образ лучше согласуется с упоминанием дождя и земли.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «почву»; возможно также: «страну».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵרֵד
  choice: Да сойдёт он
  rationale: Имперфект в контексте молитвы о царе естественно передаёт пожелание; «сойдёт» сохраняет образ движения сверху вниз и звучит достойно и поэтично.
- source_word: כְּמָטָר
  choice: как дождь
  rationale: Прямо передаёт сравнительную частицу כ и существительное מָטָר.
- source_word: עַל
  choice: на
  rationale: Обычное и естественное русское соответствие предлогу в данном образе.
- source_word: גֵּז
  choice: скошенную траву
  rationale: Слово обозначает срезанное или состриженное; сочетание с дождём и землёй поддерживает сельскохозяйственный образ, хотя возможно понимание «состриженная шерсть».
- source_word: כִּרְבִיבִים
  choice: как ливни
  rationale: Передаёт множественное число и образ обильных дождевых потоков, сохраняя параллелизм первой строке.
- source_word: זַרְזִיף
  choice: орошающие
  rationale: Редкая форма обозначает капание или излияние воды; причастие создаёт естественную русскую конструкцию и передаёт воздействие ливней.
- source_word: אָרֶץ
  choice: землю
  rationale: «Земля» сохраняет поэтическую широту אָרֶץ; по контексту также возможны «почва» или «страна».
theological_decisions:
- issue: Модальность имперфекта יֵרֵד в царском псалме-молитве
  choice: 'Пожелание или молитва: «Да сойдёт он»'
  alternative: 'Предсказательное будущее: «Он сойдёт»'
  rationale: Контекст Псалма 72 преимущественно молитвенно-благословляющий, поэтому желательная модальность вероятна, однако грамматическая форма допускает и описание будущего; это отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим оттенком. Конструкция «Да сойдёт» сохраняет возвышенность без архаизации; параллелизм двух сравнений удержан. Маркеры сносок размещены непосредственно после относящихся к ним выражений.
