  text: וְ֭/יֵרְדְּ מִ/יָּ֣ם עַד יָ֑ם וּ֝/מִ/נָּהָ֗ר עַד אַפְסֵי אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/008.yaml
  text: May he rule from sea to sea[b][a], and from the River to the ends of the earth.
translation:
  language: ru
  text: Да владычествует он от моря до моря[a] и от Реки[b] до краёв земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он будет владычествовать от моря до моря и от Реки до краёв земли».'
    reason: Альтернативное понимание глагольной формы как предсказания, а не пожелания.
  - marker: b
    text: Под «Рекой», вероятно, подразумевается Евфрат — обычная библейская географическая граница.
    reason: Культурно-географическое пояснение вероятного референта.
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: Да владычествует он
  rationale: Глагол רדה означает «править, владычествовать». Конструкция с «да» естественно передаёт возможную юссивную силу формы в контексте молитвы о царе, а «владычествует» сохраняет поэтическую торжественность и идею господства.
- source_word: מִיָּם עַד יָם
  choice: от моря до моря
  rationale: Буквальное и естественное по-русски выражение сохраняет меризм, поэтический параллелизм и широкий географический охват, не уточняя, какие именно моря имеются в виду.
- source_word: וּמִנָּהָר
  choice: и от Реки
  rationale: Слово נהר здесь, вероятно, употреблено как традиционное географическое обозначение Евфрата. Прописная буква указывает на это вероятное значение, но не вставляет название, отсутствующее в еврейском тексте.
- source_word: עַד אַפְסֵי אָרֶץ
  choice: до краёв земли
  rationale: אַפְסֵי обозначает крайние пределы. Выражение «до краёв земли» понятно современному читателю и сохраняет пространственный размах еврейского образа.
theological_decisions:
- issue: Значение имперфекта/юссива в царском псалме
  choice: 'Пожелание или молитва: «Да владычествует он»'
  alternative: 'Предсказание: «Он будет владычествовать»'
  rationale: В окружающем контексте форма допускает юссивное понимание как продолжение молитвы о царе. Основной перевод сохраняет этот молитвенный тон, а сноска удерживает возможное предсказательное прочтение и связанную с ним богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. «Владычествовать» уместно для царского псалма и точно передаёт идею господства; синтаксис остаётся ясным и компактным.
