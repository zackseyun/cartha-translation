lexical_decisions:
- source_word: יָחֹס
  choice: пожалеет
  rationale: Глагол выражает сострадательное отношение к уязвимым людям; «пожалеет» естественно по-русски и допускает оттенок милосердного щажения.
- source_word: דַּל
  choice: бедного
  rationale: Слово обозначает бедного, слабого или социально беспомощного человека; «бедного» ясно передаёт основной смысл в данном контексте.
- source_word: אֶבְיוֹן
  choice: нуждающегося
  rationale: Выбор сохраняет отличие от דַּל и передаёт состояние нужды; повтор во второй строке соответствует еврейскому тексту.
- source_word: נַפְשׁוֹת
  choice: жизни
  rationale: В сочетании с глаголом спасения נֶפֶשׁ естественно означает жизнь или самого человека, а не обязательно нематериальную душу.
- source_word: יוֹשִׁיעַ
  choice: спасёт
  rationale: Hiphil от ישׁע означает спасти, избавить; «спасёт» прямо и ёмко передаёт значение и сохраняет библейскую лексическую связь.
theological_decisions:
- issue: Значение נַפְשׁוֹת в представлении о человеке
  choice: «жизни»
  alternative: «души» или «самих нуждающихся»
  rationale: Контекст царской защиты и избавления прежде всего указывает на сохранение жизни. Это не утверждает и не отрицает определённую антропологическую доктрину; подлинная широта еврейского слова отмечена в сноске.
translation_notes:
