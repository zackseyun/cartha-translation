  variant: modern literary Russian
source:
  edition: WLC
  text: כִּֽי יַ֭צִּיל אֶבְי֣וֹן מְשַׁוֵּ֑עַ וְ֝/עָנִ֗י וְֽ/אֵין עֹזֵ֥ר לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/012.yaml
  text: For he delivers the needy when he cries out[a], and the poor who has no helper.
translation:
  language: ru
  text: Ибо он избавит нуждающегося, когда тот взывает, и бедного[a], которому некому помочь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «угнетённого». Еврейское עָנִי может указывать не только на бедность, но и на страдание или притеснение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующей хвалы царю; «ибо» естественно передаёт причинную связь и соответствует возвышенному поэтическому регистру.
- source_word: יַצִּיל
  choice: избавит
  rationale: Форма породы hифиль от נצל означает вывести из опасности, спасти или избавить. Будущее «избавит» сохраняет видовременную форму еврейского глагола и не придаёт ему исключительно духовного смысла.
- source_word: אֶבְיוֹן
  choice: нуждающегося
  rationale: Слово обозначает человека, испытывающего нужду и зависящего от помощи. Этот вариант отличает его от следующего עָנִי и естественно звучит по-русски.
- source_word: מְשַׁוֵּעַ
  choice: когда тот взывает
  rationale: Причастие от שׁוע описывает обращение за помощью. Придаточное времени естественно передаёт эту мысль; местоимение «тот» ясно указывает на нуждающегося и устраняет возможную синтаксическую двусмысленность.
- source_word: וְעָנִי
  choice: и бедного
  rationale: עָנִי может означать бедного, угнетённого или страдающего. В параллели с אֶבְיוֹן на первом плане находится нужда, однако возможность значения «угнетённый» сохранена в сноске.
- source_word: וְאֵין עֹזֵר לוֹ
  choice: которому некому помочь
  rationale: Оборот передаёт полное отсутствие того, кто оказал бы помощь. Такая формулировка современна и естественна, хотя личное существительное עֹזֵר преобразовано в безличную русскую конструкцию.
theological_decisions:
- issue: К кому относится местоимение «он»
  choice: Сохранено неспецифицированное «он», которое в контексте относится к восхваляемому царю.
  alternative: Праведный правитель вообще; мессианский царь в типологическом или пророческом смысле.
  rationale: В еврейском тексте стоит глагол в третьем лице мужского рода единственного числа без явного называния деятеля. Сам стих не уточняет его тождество сверх царского контекста псалма, поэтому перевод не разрешает эту богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим оттенком. «Ибо» поддерживает причинную связь и стиль псалма; остальная фраза построена просто и понятно. Строчная буква в «он» не навязывает отождествления царя с конкретной богословской фигурой.
