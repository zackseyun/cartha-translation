    reason: alternative_reading
lexical_decisions:
- source_word: מִתּוֹךְ וּמֵחָמָס
  choice: от угнетения и насилия
  rationale: מִתּוֹךְ буквально указывает на избавление «из среды» бедствия; в сочетании с חָמָס естественное русское «от» передаёт выход из-под угнетения. חָמָס обозначает насилие, неправду или жестокий произвол; «насилие» сохраняет конкретность образа.
- source_word: יִגְאַל
  choice: он избавит
  rationale: Глагол גאל означает выкупить, возвратить или избавить, выступив как искупитель. «Избавит» ясно звучит по-русски в данном контексте и не сводит действие исключительно к денежному выкупу, сохраняя оттенок заступничества.
- source_word: נַפְשָׁם
  choice: их жизнь
  rationale: נֶפֶשׁ здесь может означать жизнь, самого человека или душу. Форма единственного числа с суффиксом множественного числа позволяет передать собирательное «их жизнь», не устраняя лексическую многозначность; варианты вынесены в примечание.
- source_word: וְיֵיקַר
  choice: будет драгоценна
  rationale: יקר выражает высокую ценность и значимость. «Будет драгоценна» естественно передаёт оценку и сохраняет связь с буквальным образом следующего выражения.
- source_word: דָּמָם
  choice: кровь их
  rationale: דָּם буквально означает «кровь» и здесь подчёркивает, что пролитие их крови не считается чем-то незначительным. Конкретный образ сохранён без пояснительного расширения.
- source_word: בְּעֵינָיו
  choice: в его глазах
  rationale: Буквальный еврейский оборот означает «в его глазах», то есть в его оценке. Он понятен в современном русском и сохраняет образность оригинала.
theological_decisions:
- issue: К кому относится местоимение единственного числа «он / его»
  choice: Местоимение сохранено без замены существительным; в ближайшем контексте оно естественно относится к царю.
  alternative: Понимать слова как прямое указание на Бога, Который избавляет угнетённых и дорожит их кровью.
  rationale: Еврейские формы единственного числа продолжают речь о царе в Псалме 72, однако описанное избавление созвучно Божьей заботе об угнетённых. Перевод не устраняет эту богословскую напряжённость добавлением имени субъекта.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Синтаксический параллелизм и конкретные образы оригинала сохранены; архаизмы и конфессионально нагруженные добавления не использованы.
