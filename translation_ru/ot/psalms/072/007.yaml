base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/007.yaml
  text: In his days the righteous will flourish[d][c][b][a], and there will be an abundance of peace until the moon is no more.
translation:
  language: ru
  text: В его дни будет процветать праведник[a], и будет изобилие мира[b] — пока луны не станет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведные будут процветать»: единственное число в еврейском тексте может иметь собирательный смысл. Возможно также, что речь идёт о царе как о праведнике.'
    reason: alternative_reading
  - marker: b
    text: Еврейское шалом может означать не только мир, но также благополучие, целостность и процветание.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «до тех пор, пока не будет луны»; поэтический образ непреходящей длительности.'
    reason: cultural_note
lexical_decisions:
- source_word: יִפְרַח
  choice: будет процветать
  rationale: Глагол פרח обозначает распускание, цветение и, метафорически, процветание. «Будет процветать» естественно передаёт образ благополучия при царе, не устраняя растительную метафору полностью.
- source_word: בְּיָמָיו
  choice: В его дни
  rationale: Буквально передаёт еврейское выражение и в контексте указывает на время правления царя.
- source_word: צַדִּיק
  choice: праведник
  rationale: Форма грамматически единственного числа. Русское «праведник» сохраняет эту форму и допускает как обобщённое понимание, так и отнесение к одному праведному человеку.
- source_word: וְרֹב שָׁלוֹם
  choice: и будет изобилие мира
  rationale: Существительное רֹב означает множество или изобилие; связка «будет» восполняет подразумеваемую именную конструкцию и делает русский текст ясным. «Мир» сохраняет основной смысл שָׁלוֹם.
- source_word: עַד בְּלִי יָרֵחַ
  choice: пока не станет луны
  rationale: Близкая к буквальной передача поэтического выражения «до отсутствия луны» сохраняет образ чрезвычайно долгой, непреходящей длительности.
theological_decisions:
- issue: Объём значения צַדִּיק в царском псалме
  choice: Единственное число «праведник» с примечанием о возможном собирательном смысле
  alternative: «праведные» как обозначение праведных людей вообще; либо «Праведник» как указание на самого идеального царя
  rationale: Еврейское слово стоит в единственном числе, но может употребляться обобщённо. Основной текст сохраняет грамматическую неоднозначность и не навязывает узкого мессианского или исключительно коллективного толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной поэтичности псалма. Синтаксис ясен для обычного читателя; тире подчёркивает заключительный образ длительности. Все примечания отмечены в основном тексте.
