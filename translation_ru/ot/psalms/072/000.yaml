base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/000.yaml
  text: Of Solomon.[a] O God, give your justice to the king, and your righteousness[b] to the king's son.
translation:
  language: ru
  text: Соломона.[a] Боже, даруй царю Твоё правосудие, и Твою праведность[b] — сыну царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Для Соломона»; или: «Соломону» — в надписании.'
    reason: alternative_reading
  - marker: b
    text: '«Твою праведность» можно также перевести: «Твою справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּטֶיךָ
  choice: Твоё правосудие
  rationale: Форма буквально означает «Твои суды», но в обращённой к Богу молитве о царском правлении естественное русское «Твоё правосудие» передаёт способность справедливо судить и управлять.
- source_word: צִדְקָתְךָ
  choice: Твою праведность
  rationale: Сохраняет прямое значение слова и параллелизм с «правосудием», не сводя оба еврейских понятия к одному русскому термину.
- source_word: לִשְׁלֹמֹה
  choice: Соломона
  rationale: Традиционное и краткое оформление надписания; еврейский предлог допускает также значения «для Соломона» и «Соломону», поэтому неоднозначность отмечена в сноске.
theological_decisions:
- issue: Связь Божьего правосудия и праведности с царём
  choice: Сохранено обращение с просьбой даровать царю Божье правосудие и праведность
  alternative: Передать как просьбу научить царя справедливости
  rationale: Глагол תֵּן прямо означает «дай/даруй»; более объяснительная передача сузила бы смысл и сняла богословское напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы как стилистический выбор; синтаксический параллелизм еврейской строки сохранён.
