  text: לְ֭/פָנָי/ו יִכְרְע֣וּ צִיִּ֑ים וְ֝/אֹיְבָ֗י/ו עָפָ֥ר יְלַחֵֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/009.yaml
  text: Before him the desert dwellers will bow down[a], and his enemies will lick the dust.
translation:
  language: ru
  text: Перед ним склонятся жители пустыни[a], и враги его будут лизать прах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «племена пустыни»; еврейское слово צִיִּים может обозначать обитателей пустынных областей, а в некоторых контекстах — пустынных животных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: Перед ним
  rationale: Идиоматично передаёт значение «перед ним, в его присутствии» и естественно звучит в контексте подчинения царю.
- source_word: יִכְרְעוּ
  choice: склонятся
  rationale: Глагол обозначает преклонение колен или поклон; «склонятся» сохраняет образ покорности и соответствует возвышенному поэтическому регистру.
- source_word: צִיִּים
  choice: жители пустыни
  rationale: Трудное существительное может обозначать обитателей пустынных мест, а в некоторых контекстах — пустынных животных. Параллель с человеческими врагами и царский контекст здесь поддерживают значение людей, не уточняя их этническую принадлежность.
- source_word: וְאֹיְבָיו
  choice: и враги его
  rationale: Прямой и естественный эквивалент существительного со значением враждебных царю людей; постпозиция местоимения поддерживает поэтический строй.
- source_word: עָפָר
  choice: прах
  rationale: «Прах» сохраняет конкретный образ пыли или земли и придаёт строке уместный поэтический регистр, не устраняя метафору крайнего унижения.
- source_word: יְלַחֵכוּ
  choice: будут лизать
  rationale: Буквально сохраняет яркий образ, выражающий поражение и унижение.
theological_decisions:
- issue: Характер образа подчинения
  choice: Сохранить прямые поэтические образы преклонения и лизания праха как язык царской победы и подчинения.
  alternative: 'Передать абстрактно: «покорятся ему и будут полностью унижены».'
  rationale: Исходный текст использует конкретную образность и не требует решать, описываются ли буквальные действия или традиционная метафора полного подчинения.
- issue: Кого обозначает צִיִּים
  choice: Людей, живущих в пустыне.
  alternative: Пустынных зверей.
  rationale: Сочетание с «врагами его» в контексте всемирного царского владычества делает человеческий референт вероятнее, однако подлинная лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Прах» и порядок слов «враги его» сохраняют достоинство и поэтичность, оставаясь понятными современному читателю.
