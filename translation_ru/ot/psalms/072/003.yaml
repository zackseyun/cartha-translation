lexical_decisions:
- source_word: יִשְׂאוּ
  choice: да принесут
  rationale: Глагол נָשָׂא буквально означает «нести, поднимать». В поэтическом контексте горы и холмы олицетворены, поэтому естественное русское «принесут» передаёт образ без неуместного буквализма; конструкция с «да» выражает пожелание или молитву.
- source_word: הָרִים
  choice: горы
  rationale: Прямое соответствие форме множественного числа; определённость в русском языке не требует отдельного выражения.
- source_word: שָׁלוֹם
  choice: мир
  rationale: שָׁלוֹם охватывает мир, благополучие и целостность. «Мир» — естественный и традиционный выбор, не исключающий более широкого смысла общего благоденствия.
- source_word: לָעָם
  choice: народу
  rationale: Предлог ל может обозначать адресата или получателя пользы. Русский дательный падеж естественно передаёт мысль о мире, приносимом народу, сохраняя оттенок «для народа» в сноске.
- source_word: וּגְבָעוֹת
  choice: и холмы
  rationale: Сохранены явный союз и поэтический параллелизм с горами.
- source_word: בִּצְדָקָה
  choice: благодаря праведности
  rationale: Предлог ב здесь может обозначать средство или образ действия. «Благодаря праведности» ясно связывает наступление мира с праведным правлением; возможные значения «по справедливости» и «посредством праведности» сохранены в сноске.
theological_decisions:
- issue: Значение префиксальной глагольной формы в царском молитвенном псалме
  choice: 'пожелание или молитва: «да принесут»'
  alternative: 'предсказание: «принесут»'
  rationale: В контексте молитвы о царе форма лучше понимается как пожелание, а не как простое предсказание.
- issue: Синтаксическая связь בִּצְדָקָה во второй поэтической строке
  choice: праведность как основание или средство, благодаря которому холмы приносят подразумеваемый мир
  alternative: '«праведность» как параллельный прямой объект: «холмы принесут справедливость»'
  rationale: В масоретском тексте перед צְדָקָה стоит предлог ב, поэтому перевод сохраняет его обстоятельственное значение и не превращает существительное без достаточных оснований в прямое дополнение. Пропущенный во второй строке глагол и объект естественно восстанавливаются из первой строки.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Частица «да» передаёт пожелание; тире сохраняет лаконичный параллелизм и эллипсис еврейской строки.
