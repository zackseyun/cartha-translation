  text: Пусть все цари преклонятся перед ним[a], пусть все народы служат ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонятся ему»; оба еврейских глагола — «преклоняться» и «служить» — могут иметь как смысл почтения царю, так и религиозный оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׁתַּחֲווּ
  choice: пусть ... преклонятся
  rationale: Форма глагола שׁחה обозначает поклон, преклонение или простирание ниц. В контексте царского псалма «преклонятся» естественно передаёт почтение царю, не ограничивая смысл исключительно богослужебным поклонением; имперфект с союзом понят как пожелание.
- source_word: לוֹ
  choice: перед ним
  rationale: При глаголе преклонения еврейское לֹו естественно передаётся по-русски сочетанием «перед ним», обозначающим направленное к нему почтение.
- source_word: כָל מְלָכִים
  choice: все цари
  rationale: Прямой перевод, сохраняющий всеобщий охват царского подчинения.
- source_word: כָל גּוֹיִם
  choice: все народы
  rationale: גּוֹיִם здесь обозначает народы мира и образует параллель к «всем царям»; вариант «народы» нейтрален и уместен в данном контексте.
- source_word: יַעַבְדוּהוּ
  choice: пусть ... служат ему
  rationale: Глагол עבד в своей основной семантике означает «служить» и может включать как подданническую службу, так и религиозное служение. Такой перевод сохраняет широту исходного выражения.
theological_decisions:
- issue: Следует ли прямо называть отношение царей и народов к царю поклонением в религиозном смысле
  choice: Сохранить более широкие выражения «преклонятся перед ним» и «служат ему».
  alternative: Перевести один или оба глагола как «поклонятся ему».
  rationale: Царский контекст допускает смысл почтения и подданнической службы, тогда как оба еврейских глагола могут также иметь религиозные оттенки. Выбранный перевод сохраняет эту богословскую напряжённость и не сужает смысл преждевременно.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Повтор «пусть» сохраняет параллелизм и пожелательный характер двух строк; «преклонятся» звучит естественно и не столь архаично, как «падут ниц».
