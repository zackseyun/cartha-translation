  yaml_path: translation/ot/psalms/072/020.yaml
  text: The prayers of David son of Jesse are ended[a].
translation:
  language: ru
  text: Окончены молитвы Давида, сына Иессея.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Завершены молитвы Давида, сына Иессея»; или: «Молитвы Давида, сына Иессея, подошли к концу».'
    reason: Лексема כָּלּוּ допускает близкие по смыслу варианты передачи завершённости.
lexical_decisions:
- source_word: כָּלּוּ
  choice: окончены
  rationale: Пуаль, перфект 3-го лица множественного числа от כלה; согласуется с «молитвы» и выражает завершение. Краткий страдательный оборот сохраняет форму и смысл еврейского текста.
- source_word: תְפִלּוֹת
  choice: молитвы
  rationale: Прямое и естественное соответствие множественному числу תְּפִלָּה; не сужает значение до прошений и не добавляет жанрового определения «песни».
- source_word: דָּוִד
  choice: Давида
  rationale: Традиционная русская передача личного имени; родительный падеж обусловлен принадлежностью молитв.
- source_word: בֶּן יִשָׁי
  choice: сына Иессея
  rationale: Точно передаёт конструкцию происхождения и сохраняет традиционную русскую форму имени Иессей.
theological_decisions:
- issue: Является ли стих редакционным колофоном или частью самой молитвы
  choice: Передать как простое утверждение о завершении молитв Давида
  alternative: Явно обозначить стих как позднюю редакционную приписку
  rationale: Еврейский текст сообщает о завершении молитв, но сам по себе не устанавливает историю составления; перевод не должен разрешать этот вопрос добавлением отсутствующей информации.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формулировкой, подходящей для заключительной пометы. Инверсия «Окончены молитвы» сохраняет лаконичность и акцент еврейского текста; маркер сноски помещён после всего предложения.
