base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/001.yaml
  text: Of Solomon[a]. O God, give your judgments to the king[b], and your righteousness to the king’s son.
translation:
  language: ru
  text: Соломона[a]. Боже, дай царю Твои суды и Твою праведность[b] — сыну царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Для Соломона»; или: «Соломону» — в надписании.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «справедливость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִשְׁלֹמֹה
  choice: Соломона
  rationale: В надписании предлог לְ может указывать на авторство, посвящение или адресата. Традиционная краткая формула «Соломона» естественна для русского надписания, но не устраняет полностью возможные связи с Соломоном; основные альтернативы вынесены в примечание.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Существительное употреблено как прямое молитвенное обращение; русский звательный оборот «Боже» точно и естественно передаёт эту функцию.
- source_word: מִשְׁפָּטֶיךָ
  choice: Твои суды
  rationale: 'Сохранены множественное число и широкий смысл מִשְׁפָּט: Божьи судебные решения, нормы справедливого суда и способность судить по ним. Более узкое «правосудие» сгладило бы конкретный множественный образ.'
- source_word: לְמֶלֶךְ
  choice: царю
  rationale: Русский дательный падеж прямо обозначает получателя дара и естественно передаёт еврейское לְ.
- source_word: תֵּן
  choice: дай
  rationale: Прямой и естественный эквивалент повелительной формы в молитвенной просьбе; «даруй» было бы допустимо, но стилистически более возвышенно.
- source_word: וְצִדְקָתְךָ
  choice: и Твою праведность
  rationale: «Праведность» сохраняет нравственную и судебную широту צְדָקָה, тогда как «справедливость» сильнее подчёркивает только общественно-судебный аспект.
- source_word: לְבֶן־מֶלֶךְ
  choice: сыну царя
  rationale: Буквально и естественно передаёт конструкцию и не решает заранее, идёт ли речь о наследнике, о самом царе в династическом параллелизме или о более широком образе идеального царя.
theological_decisions:
- issue: Кого обозначают «царь» и «сын царя»
  choice: Сохранить непосредственный язык царской молитвы без явного мессианского отождествления.
  alternative: Понимать слова исключительно как молитву о Соломоне либо прямо отнести их к Мессии.
  rationale: Сам стих допускает историческое, династическое и мессиански развиваемое прочтение, но не требует, чтобы перевод выбирал только одно из них.
- issue: Соотношение «судов» и «праведности»
  choice: Сохранить два разных еврейских термина и их параллельность.
  alternative: Передать оба слова через близкие понятия «правосудие» и «справедливость».
  rationale: Различение удерживает напряжение между Божьими решениями или нормами суда и Его праведностью как более широким нравственно-судебным качеством.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным молитвенным звучанием. Заглавные местоимения при обращении к Богу использованы в соответствии с распространённой русской библейской традицией. Тире во второй строке ясно отмечает эллипсис глагола «дай», присутствующий в еврейском параллелизме.
