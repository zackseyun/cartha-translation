  text: בָּר֤וּךְ יְהוָ֣ה אֱ֭לֹהִים אֱלֹהֵ֣י יִשְׂרָאֵ֑ל עֹשֵׂ֖ה נִפְלָא֣וֹת לְ/בַדּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/018.yaml
  text: Blessed be Yahweh God[a], the God of Israel, who alone does wondrous things.
translation:
  language: ru
  text: Благословен Яхве, Бог Израиля, который один творит чудеса.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Страдательное причастие входит в формулу славословия. «Благословен» сохраняет её краткость, торжественность и утвердительно-перформативный характер.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Слово стоит в приложении к имени Яхве; прямой перевод естественен и точно передаёт структуру еврейского текста.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая передача сопряжённой конструкции сохраняет указание на принадлежность и особые отношения Бога с Израилем.
- source_word: עֹשֵׂה
  choice: Который ... творит
  rationale: Причастие описывает постоянное, характерное действие; относительное предложение звучит естественно по-русски, а глагол «творит» уместен в возвышенном контексте чудесных деяний.
- source_word: נִפְלָאוֹת
  choice: чудеса
  rationale: Обычное современное русское обозначение необычайных Божьих деяний; оно ясно и не требует описательного оборота.
- source_word: לְבַדּוֹ
  choice: один
  rationale: 'Слово подчёркивает исключительность действующего лица: чудеса творит Он один. Такая позиция в русском предложении сохраняет связь определения с Богом, а не с отдельным действием.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте употреблено собственное имя Бога. «Яхве» передаёт тетраграмматон как имя, не заменяя его титулом.
- issue: Смысл לְבַדּוֹ применительно к Божьему действию
  choice: Который один творит чудеса
  alternative: Который Сам творит чудеса; единственный творящий чудеса
  rationale: «Один» сохраняет выраженное в еврейском тексте исключительное приписывание чудесных деяний Богу, не уточняя сверх текста характер этой исключительности.
translation_notes:
  register: Современный литературный русский с кратким и торжественным строем славословия. Сохранены повтор «Бог, Бог Израиля» и личное имя Яхве; синтаксис остаётся понятным без архаизации.
