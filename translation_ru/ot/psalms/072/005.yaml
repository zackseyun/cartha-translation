  text: יִֽירָא֥וּ/ךָ עִם שָׁ֑מֶשׁ וְ/לִ/פְנֵ֥י יָ֝רֵ֗חַ דּ֣וֹר דּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/072/005.yaml
  text: May they fear you as long as the sun endures[a], and before the moon[c][b], through all generations.
translation:
  language: ru
  text: Да благоговеют они перед тобой, пока существуют солнце и луна[a], из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они будут благоговеть перед тобой»; еврейскую форму можно понимать не как пожелание, а как утверждение о будущем.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִירָאוּךָ
  choice: Да благоговеют они перед Тобой
  rationale: Глагол ירא может означать как страх, так и почтительное благоговение. В царском и богословском контексте псалма «благоговеют перед Тобой» естественно передаёт почтительный страх; конструкция с «да» сохраняет вероятную желательную силу формы.
- source_word: עִם־שָׁמֶשׁ
  choice: пока светит солнце
  rationale: Буквально «с солнцем»; здесь сочетание выражает продолжительность. Добавлен естественный для русского языка глагол «светит», не меняющий образа.
- source_word: וְלִפְנֵי יָרֵחַ
  choice: и пока пребывает луна
  rationale: Буквально «и перед луной». В параллелизме с солнцем оборот указывает на длительность существования; идиоматический перевод делает смысл ясным, а буквальная форма отмечена в сноске.
- source_word: דּוֹר דּוֹרִים
  choice: из поколения в поколение
  rationale: Устойчивая русская формула сохраняет повтор и подчёркивает непрерывную смену поколений.
theological_decisions:
- issue: К кому относится местоимение «Тобой» в царском псалме
  choice: Сохранено прямое обращение без уточнения референта.
  alternative: Явно отнести благоговение либо к царю, либо к Богу.
  rationale: Еврейский текст сам не вводит здесь пояснения; царский контекст допускает напряжение между непосредственным адресатом и богословским уровнем псалма.
- issue: Модальность יִירָאוּךָ
  choice: 'Желание или молитвенное пожелание: «Да благоговеют».'
  alternative: 'Предсказательное будущее: «Они будут благоговеть».'
  rationale: Контекст допускает юссивное прочтение, но форма также может восприниматься как будущее; эта неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой поэзии. «Благоговеют» передаёт почтительный страх без оттенка панического ужаса; прописная буква в «Тобой» не устраняет намеренно сохранённую неопределённость адресата.
