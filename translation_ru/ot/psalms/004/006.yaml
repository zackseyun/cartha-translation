lexical_decisions:
- source_word: רַבִּים אֹמְרִים
  choice: Многие говорят
  rationale: Субстантивированное «многие» сохраняет неопределённо-собирательный смысл, а причастие передано настоящим временем, допускающим продолжающуюся или характерную речь.
- source_word: יַרְאֵנוּ טוֹב
  choice: покажет нам добро
  rationale: Порода hифиль глагола ראה имеет каузативный смысл «дать увидеть, показать»; טוֹב оставлено широким словом «добро», без сужения до благополучия или материального достатка.
- source_word: נְסָה עָלֵינוּ
  choice: вознеси над нами
  rationale: Сохраняется поэтический образ света Божьего лица, поднятого или простёртого над молящимися; «вознеси» передаёт возвышенный императив без пояснительного перефразирования.
- source_word: אוֹר פָּנֶיךָ
  choice: свет твоего лица
  rationale: Буквальный антропоморфный образ сохранён, а не заменён толкованием «благоволение» или «присутствие».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем, а не заменён титулом «Господь».
theological_decisions:
- issue: Образ «свет твоего лица»
  choice: Сохранить метафору в основном тексте
  alternative: Передать как «твоё благоволение» или «свет твоего присутствия»
  rationale: Буквальный образ одновременно выражает благосклонность и благодатное присутствие Бога; его раскрытие в основном тексте сузило бы поэтическую многозначность.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет это различие, а примечание сообщает традиционную замену титулом.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконизма и поэтической образности еврейского стиха. Местоимение о Боге дано со строчной буквы как нейтральная современная орфографическая норма; обращение «Яхве» сохранено внутри прямой речи.
