base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/008.yaml
  text: In peace I will both lie down and sleep[a], for you alone, O Yahweh[b], make me dwell in safety.
translation:
  language: ru
  text: В мире я и лягу, и усну[a], ибо только Ты, Яхве[b], даёшь мне жить в безопасности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «В мире, вместе я лягу и усну» или «В мире я разом лягу и усну». Еврейское наречие может означать «вместе» или иметь усилительное значение; в основном тексте оно передано парной конструкцией «и …, и …», объединяющей два действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «ибо Ты, Яхве, даёшь мне жить одному в безопасности». Еврейское слово, переданное как «только», можно отнести к пребыванию псалмопевца, хотя в основном тексте оно отнесено к Богу.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּשָׁלוֹם
  choice: В мире
  rationale: שָׁלוֹם обозначает мир, благополучие и целостность. «В мире» естественно передаёт состояние спокойствия и защищённости в контексте псалма.
- source_word: יַחְדָּו
  choice: и лягу, и усну
  rationale: Наречие буквально значит «вместе» или «совместно». В сочетании с двумя глаголами его объединяющая сила естественно передаётся русской парной конструкцией «и …, и …»; буквальная возможность отмечена в сноске.
- source_word: אֶשְׁכְּבָה
  choice: лягу
  rationale: Имперфект выражает уверенное намерение или ближайшее будущее. В русском контексте форма «лягу» передаёт спокойную решимость говорящего.
- source_word: וְאִישָׁן
  choice: и усну
  rationale: Глагол ישן означает «спать». Здесь «усну» естественно следует за «лягу» и передаёт начало сна, подразумеваемое последовательностью действий.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание уверенности псалмопевца. «Ведь» естественно связывает мирный сон с доверием Богу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом, чтобы сохранить характер еврейского текста.
- source_word: לְבָדָד
  choice: Ты один
  rationale: 'Основной текст относит наречие «один» к Яхве: именно Он один обеспечивает безопасность. Грамматически возможное отнесение к месту или состоянию псалмопевца сохранено в сноске.'
- source_word: לָבֶטַח
  choice: в безопасности
  rationale: בֶּטַח обозначает безопасность и защищённость. Предложное сочетание ясно передаёт устойчивое безопасное состояние.
- source_word: תּוֹשִׁיבֵנִי
  choice: даёшь мне жить
  rationale: Каузативная форма ישׁב буквально означает «поселяешь меня» или «даёшь мне обитать». «Даёшь мне жить» сохраняет причиняющую роль Бога и звучит естественно по-русски.
theological_decisions:
- issue: Связь наречия לְבָדָד
  choice: 'Наречие относится к Богу: «Ты один, Яхве».'
  alternative: «Ты, Яхве, даёшь мне жить одному в безопасности».
  rationale: Порядок слов и смысл контекста несколько больше поддерживают исключительную зависимость от Яхве, однако еврейский синтаксис допускает связь наречия с безопасным пребыванием псалмопевца. Альтернатива не устранена, а вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим ритмом. Сохранены образ мира, личное имя Яхве и синтаксическая неоднозначность наречия לְבָדָד; парная конструкция «и …, и …» естественно воспроизводит объединяющую функцию יַחְדָּו.
