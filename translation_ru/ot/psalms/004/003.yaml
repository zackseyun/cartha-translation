  text: וּ/דְע֗וּ כִּֽי הִפְלָ֣ה יְ֭הוָה חָסִ֣יד ל֑/וֹ יְהוָ֥ה יִ֝שְׁמַ֗ע בְּ/קָרְאִ֥/י אֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/003.yaml
  text: And know that Yahweh has set apart the godly for himself[b][a]; Yahweh hears when I call to him.
translation:
  language: ru
  text: И знайте, что Яхве отделил для Себя верного[a]; Яхве слышит[b], когда я взываю к Нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благочестивого» или «преданного». Еврейское слово может подчёркивать благочестие, преданность и верность завету.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «услышит». Еврейская форма может обозначать как обычное действие, так и уверенно ожидаемое будущее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְעוּ
  choice: И знайте
  rationale: Форма множественного числа повелительного наклонения обращена к нескольким слушателям; союз ו передан нейтральным «и», без навязывания противопоставления.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что слушатели должны знать; после «знайте» это естественная русская конструкция.
- source_word: הִפְלָה
  choice: отделил
  rationale: Порода hифиль здесь указывает на выделение, обособление как особого; сочетание с לוֹ поддерживает смысл «отделил для Себя».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: חָסִיד
  choice: верного
  rationale: Слово обозначает человека, отличающегося преданностью, благочестием и верностью завету. «Верного» сохраняет личный и этико-религиозный смысл, не сужая его до одной конфессиональной трактовки.
- source_word: לוֹ
  choice: для Себя
  rationale: Предлог с местоименным суффиксом указывает, что Яхве выделил этого человека именно для Себя; русское возвратное местоимение ясно соотносится с подлежащим.
- source_word: יִשְׁמַע
  choice: слышит
  rationale: Имперфект допускает характеристику обычного действия или уверенность в будущем ответе. Настоящее время естественно выражает исповедуемую псалмопевцем уверенность, а возможное будущее отмечено в сноске.
- source_word: בְּקָרְאִי
  choice: когда я взываю
  rationale: Предлог ב с инфинитивной конструкцией выражает временное обстоятельство; «когда я взываю» естественно передаёт молитвенное обращение.
- source_word: אֵלָיו
  choice: к Нему
  rationale: Предлог указывает направление молитвенного обращения к Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл חָסִיד
  choice: верного
  alternative: благочестивого; преданного; верного завету
  rationale: Термин соединяет благочестие и верность, в том числе верность отношениям завета. Основной текст сохраняет ёмкость понятия, а сноска обозначает другие возможные оттенки.
- issue: Временное значение יִשְׁמַע
  choice: слышит
  alternative: услышит
  rationale: Еврейский имперфект может выражать как характерное действие, так и уверенность в будущем. Настоящее время выбрано для основной строки, но будущее остаётся открытым в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным ритмом псалма. Обращение во множественном числе сохранено. Заглавные буквы в местоимениях «Себя» и «Нему» употреблены как уважительная издательская норма при отнесении к Богу.
