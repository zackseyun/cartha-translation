  text: 'Руководителю хора: на струнных инструментах. Псалом Давида[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «псалом, написанный Давидом» либо «псалом для Давида»; еврейское выражение может указывать на авторство, связь или посвящение.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов слово обычно понимается как указание музыкальному руководителю. Такой перевод ясен современному читателю и сохраняет литургический контекст.
- source_word: בִּנְגִינוֹת
  choice: На струнных инструментах
  rationale: Форма указывает на музыкальное исполнение со струнными инструментами; предлог «на» естественен в русском языке применительно к игре на инструментах.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Это традиционное и точное русское обозначение данного поэтического и музыкального жанра.
- source_word: לְדָוִד
  choice: Давида
  rationale: В сочетании «Псалом Давида» русский родительный падеж сохраняет традиционную формулировку и допускает более широкую связь с Давидом, не утверждая исключительно прямое авторство.
theological_decisions:
- issue: Авторство или иная связь, выраженная לְדָוִד в надписании
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида
  rationale: Еврейский предлог לְ может обозначать авторство, принадлежность, связь или посвящение. Основной текст не сужает эту неоднозначность, а примечание делает её явной.
translation_notes:
  register: Современный литературный русский язык; краткое надписание передано с традиционной библейской сдержанностью. Маркер примечания поставлен непосредственно после слов «Псалом Давида», к которым он относится.
