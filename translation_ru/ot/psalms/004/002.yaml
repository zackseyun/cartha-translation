- source_word: בְּנֵי אִישׁ
  choice: Сыны человеческие
  rationale: Сохранено прямое мужское обращение и поэтическая образность еврейского выражения; простое «люди» было бы менее выразительным.
- source_word: עַד מֶה
  choice: доколе
  rationale: Естественная для возвышенной русской поэзии форма вопроса о длительности, передающая упрёк.
- source_word: כְבוֹדִי
  choice: мою честь
  rationale: В контексте публичного унижения слово прежде всего указывает на достоинство и доброе имя говорящего; возможное значение «слава» сохранено в сноске.
- source_word: לִכְלִמָּה
  choice: обращать … в позор
  rationale: Предлог לְ в эллиптической конструкции выражает результат; добавленный по-русски глагол делает смысл ясным, не уточняя способ унижения.
- source_word: תֶּאֱהָבוּן
  choice: будете любить
  rationale: Имперфект второго лица множественного числа в риторическом упрёке передан как продолжающееся поведение под вопросом «доколе».
- source_word: רִיק
  choice: пустоту
  rationale: Передаёт тщетность, бессодержательность и бесплодность без архаического оттенка слова «суета».
- source_word: תְּבַקְשׁוּ
  choice: искать
  rationale: Прямой эквивалент глагола בקשׁ, сохраняющий параллелизм с «любить».
- source_word: כָזָב
  choice: лжи
  rationale: Абстрактное существительное в единственном числе сохраняет поэтическую параллель с «пустотой» и не сужает смысл до отдельных высказываний.
- source_word: סֶלָה
  choice: Села
  rationale: Традиционная русская транслитерация неясного музыкального или литургического обозначения; его функция не истолковывается в основном тексте.
theological_decisions:
- issue: Значение и референт כְבוֹדִי («моя честь / моя слава»)
  choice: «мою честь» без уточнения её происхождения или царского характера
  alternative: «мою славу»; «честь, данную мне Богом»
  rationale: Еврейский текст допускает как общественное достоинство псалмопевца, так и более широкое понятие его славы; перевод не связывает выражение исключительно с царским статусом или с особым даром Бога.
- issue: Оттенок רִיק и כָזָב
  choice: «пустоту» и «ложь» как намеренно широкие понятия
  alternative: «идолов» или «ложных богов»
  rationale: Хотя слова могут иметь религиозные ассоциации, сам стих прямо не называет идолопоклонство; широкая формулировка сохраняет нравственную и богословскую многозначность.
