  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. «Доколе» и «сыны человеческие» сохраняют риторическую силу оригинала, оставаясь понятными; синтаксически подразумеваемое действие раскрыто глаголом «обращать».
