id: PSA.4.1
reference: Psalms 4:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: בְּ/קָרְאִ֡/י עֲנֵ֤/נִי אֱלֹ֘הֵ֤י צִדְקִ֗/י בַּ֭/צָּר הִרְחַ֣בְתָּ לִּ֑/י חָ֝נֵּ֗/נִי וּ/שְׁמַ֥ע תְּפִלָּתִֽ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/001.yaml
  text: When I call[a], answer me, O God of my righteousness. In distress you have made room for me[b]. Be gracious to me and hear my prayer.
translation:
  language: ru
  text: Когда я взываю, ответь мне, Боже правды моей[a]. В тесноте Ты дал мне простор[b]. Будь милостив ко мне и услышь мою молитву.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведный Бог мой»; или: «Бог, оправдывающий меня». Буквально: «Бог моей правды (праведности)».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Ты облегчил мою участь». В еврейском тексте использован пространственный образ: Бог вывел молящегося из тесноты на простор.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקָרְאִי
  choice: Когда я взываю
  rationale: Предлог ב с инфинитивом и суффиксом 1-го лица имеет здесь временное значение. «Взываю» естественно для молитвенного обращения и передаёт קרא без излишнего усиления.
- source_word: עֲנֵנִי
  choice: ответь мне
  rationale: Прямое и естественное соответствие глаголу ענה в контексте молитвы.
- source_word: אֱלֹהֵי צִדְקִי
  choice: Боже правды моей
  rationale: 'Сохраняет конструкцию «Бог моей правды/праведности» и её смысловую открытость: речь может идти о дарованной Богом правоте или о Божьем оправдании и защите молящегося.'
- source_word: בַּצָּר
  choice: В тесноте
  rationale: Передаёт как бедственное положение, так и пространственный образ стеснённости, противопоставленный простору в следующем глаголе.
- source_word: הִרְחַבְתָּ לִּי
  choice: Ты дал мне простор
  rationale: Естественно по-русски сохраняет образ выхода из стеснённого положения на простор; прошедшее время соответствует перфектной форме древнееврейского глагола.
- source_word: חָנֵּנִי
  choice: Будь милостив ко мне
  rationale: Точно передаёт просьбу חנן о благосклонности и милости.
- source_word: וּשְׁמַע תְּפִלָּתִי
  choice: и услышь мою молитву
  rationale: Обычное и естественное выражение для внимательного принятия молитвы.
theological_decisions:
- issue: Значение выражения אֱלֹהֵי צִדְקִי
  choice: Сохранить в основном тексте формальное выражение «Боже правды моей»
  alternative: «праведный Бог мой» или «Бог, оправдывающий меня»
  rationale: Древнееврейская конструкция не вынуждает выбирать только одно толкование. Основной текст сохраняет напряжение между Божьей праведностью, даруемой человеку правотой и Божьим оправдывающим действием.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Образное противопоставление «теснота — простор» сохранено; несколько необычное выражение «Боже правды моей» намеренно удерживает форму и богословскую многозначность оригинала.
