source:
  edition: WLC
  text: זִבְח֥וּ זִבְחֵי צֶ֑דֶק וּ֝/בִטְח֗וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/005.yaml
  text: Offer sacrifices of righteousness[a], and trust in Yahweh.
translation:
  language: ru
  text: Приносите жертвы праведности[a] и уповайте на Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведные жертвы»; или: «жертвы справедливости»; возможно также: «правильные жертвы».'
    reason: Лексическая и синтаксическая неоднозначность сочетания זִבְחֵי צֶדֶק.
lexical_decisions:
- source_word: זִבְחוּ זִבְחֵי
  choice: Приносите жертвы
  rationale: Сочетание глагола и однокоренного существительного обозначает совершение жертвоприношений. По-русски «приносите жертвы» естественно передаёт культовый смысл, хотя не воспроизводит однокоренной повтор буквально.
- source_word: צֶדֶק
  choice: праведности
  rationale: Форма допускает характеристику жертв как праведных, правильных или справедливых. Родительный оборот сохраняет смысловую широту и не сводит выражение только к ритуальной правильности либо нравственной искренности.
- source_word: וּבִטְחוּ
  choice: и уповайте
  rationale: Императив множественного числа выражает призыв довериться. «Уповайте» — естественное и уместно возвышенное русское соответствие в обращении к Богу.
- source_word: אֶל
  choice: на
  rationale: При русском глаголе «уповать» нормативно употребляется предлог «на»; он идиоматически передаёт направленность доверия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Смысл выражения זִבְחֵי צֶדֶק
  choice: «жертвы праведности» — жертвы, соотносимые с праведностью и должным порядком, без уточнения, идёт ли речь прежде всего о нравственной искренности, законности обряда или о том и другом
  alternative: «правильные жертвы»; «праведные жертвы»; «жертвы справедливости»
  rationale: Еврейское сочетание сохраняет как нравственный, так и культовый оттенок. Буквально близкий родительный оборот не устраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским глаголом «уповайте». Формулировка краткая, ритмичная и понятная; двусмысленность определения צֶדֶק сохранена в основном тексте и пояснена в сноске.
