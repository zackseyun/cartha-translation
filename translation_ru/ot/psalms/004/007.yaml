  text: נָתַ֣תָּה שִׂמְחָ֣ה בְ/לִבִּ֑/י מֵ/עֵ֬ת דְּגָנָ֖/ם וְ/תִֽירוֹשָׁ֣/ם רָֽבּוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/007.yaml
  text: You have put joy in my heart more than when their grain and their new wine abound[a].
translation:
  language: ru
  text: Ты вложил в моё сердце больше радости, чем бывает у них, когда их зерно и молодое вино в изобилии[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «С того времени, как умножились их зерно и молодое вино, ты вложил радость в моё сердце». Еврейскую фразу обычно понимают как сравнение: радость, которую даёт Бог, превосходит радость от материального изобилия.'
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַתָּה
  choice: Ты вложил
  rationale: Форма Qal perfect, 2-е лицо мужского рода единственного числа, обращена к Богу. «Вложил» естественно сочетается с образом радости в сердце и сохраняет смысл совершённого действия с продолжающимся результатом.
- source_word: שִׂמְחָה
  choice: радости
  rationale: Существительное означает радость, веселье; «радость» — ясное и естественное обозначение внутреннего состояния в данном контексте.
- source_word: בְלִבִּי
  choice: в моё сердце
  rationale: לֵב обозначает сердце как внутреннего человека. Предлог בְ буквально указывает на нахождение «в сердце», однако с русским глаголом «вложил» естественно употребляется винительный падеж направления без изменения образа.
- source_word: מֵעֵת
  choice: больше … чем … когда
  rationale: 'Сочетание מִן с עֵת обычно понимается как введение основания сравнения: дарованная Богом радость превосходит радость времени материального изобилия. Неоднозначность более буквального временного прочтения отмечена в сноске.'
- source_word: דְּגָנָם
  choice: их зерно
  rationale: דָּגָן означает зерно или хлебные злаки; «зерно» точно и понятно современному читателю.
- source_word: וְתִירוֹשָׁם
  choice: и молодое вино
  rationale: תִּירוֹשׁ обозначает новое, молодое вино как плод урожая; перевод сохраняет сельскохозяйственный образ и отличает его от общего обозначения вина.
- source_word: רָבּוּ
  choice: в изобилии
  rationale: Qal perfect, 3-е лицо множественного числа от רבה означает «умножились, стали многочисленны». Именная русская конструкция «в изобилии» естественно передаёт состояние обильного урожая, подразумеваемое совершенной формой.
theological_decisions:
- issue: Сравнительный или временной смысл מֵעֵת
  choice: Дарованная Богом внутренняя радость больше радости людей при изобилии зерна и молодого вина.
  alternative: «С того времени, как умножились их зерно и молодое вино, ты вложил радость в моё сердце».
  rationale: Сравнительное понимание конструкции с מִן лучше соответствует противопоставлению упования на Бога материальному благополучию в контексте псалма. При этом грамматически возможное более буквальное временное прочтение не исключено и вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с ясной, молитвенно-поэтической интонацией. Местоимение «ты» написано со строчной буквы как нейтральная современная норма; обращение к Богу однозначно из контекста. Сравнительная конструкция передана естественно, а подлинная синтаксическая неоднозначность сохранена в сноске.
