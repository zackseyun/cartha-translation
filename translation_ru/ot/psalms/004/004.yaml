base_translation:
  language: en
  yaml_path: translation/ot/psalms/004/004.yaml
  text: Tremble[a], and do not sin; speak in your hearts on your beds, and be still[b]. Selah
translation:
  language: ru
  text: Трепещите[a] и не грешите; говорите в своих сердцах на своих постелях и умолкните[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Гневайтесь, но не грешите». Еврейский глагол может обозначать дрожь, сильное волнение или гнев.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «останьтесь в покое». Еврейский глагол может означать как молчание, так и неподвижный покой.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: רִגְזוּ
  choice: Трепещите
  rationale: Глагол רגז может обозначать дрожь, сильное волнение или гнев. «Трепещите» сохраняет широту эмоционального потрясения и не сводит его исключительно к гневу; это также соответствует последующему призыву к внутреннему размышлению и тишине.
- source_word: וְאַל תֶּחֱטָאוּ
  choice: и не грешите
  rationale: Прямой и естественный перевод запрета с обычным глаголом חטא — «грешить».
- source_word: אִמְרוּ בִלְבַבְכֶם
  choice: говорите в своих сердцах
  rationale: Сохраняет значение повелительного אִמְרוּ — «говорите, скажите» и библейское представление о сердце как внутреннем человеке, средоточии мысли и воли. Возвратное «своих» делает множественное число естественным по-русски.
- source_word: עַל מִשְׁכַּבְכֶם
  choice: лёжа на постелях
  rationale: Передаёт место и обстоятельство внутренней речи. Деепричастная конструкция звучит естественнее буквального «на постелях ваших», сохраняя множественное число.
- source_word: וְדֹמּוּ
  choice: и умолкните
  rationale: Глагол דמם допускает значения молчания и неподвижного покоя. «Умолкните» естественно завершает движение стиха от волнения через внутреннюю речь к молчанию.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение литургического термина не установлено, поэтому он передан традиционной транслитерацией, а не истолкован.
theological_decisions:
- issue: Значение רגזו в нравственном призыве
  choice: Призыв трепетать или быть глубоко взволнованными, не впадая в грех
  alternative: «Гневайтесь, но не грешите»
  rationale: Еврейский глагол допускает как трепет и волнение, так и гнев. Контекст внутреннего разговора и последующего молчания поддерживает более широкое значение эмоционального потрясения, однако традиционное понимание как гнева остаётся возможным и отмечено в сноске.
- issue: Соотношение внутренней речи и последующего молчания
  choice: Сохранить последовательность «говорите в своих сердцах… и умолкните»
  alternative: Передать первую часть как «размышляйте», сглаживая кажущееся напряжение
  rationale: 'Буквальная внутренняя речь и затем молчание создают осмысленное напряжение оригинала: человек обращается к себе в глубине сердца, после чего затихает. Его не следует устранять толкованием.'
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис остаётся близким к еврейскому параллелизму, но оборот «лёжа на постелях» устраняет тяжеловесную буквальность. «Села» сохранено как традиционный неистолкованный литургический термин.
