lexical_decisions:
- source_word: עַל
  choice: на
  rationale: Обычное пространственное значение предлога — «на»; естественно передаёт положение инструментов на деревьях.
- source_word: עֲרָבִים
  choice: тополях
  rationale: Еврейское название может обозначать ивы либо деревья типа тополя. «Тополя» вероятнее соответствуют месопотамской обстановке; традиционное «ивы» сохранено в сноске.
- source_word: בְּתוֹכָהּ
  choice: среди него
  rationale: Суффикс женского рода единственного числа отсылает к Вавилонии из предыдущего стиха. Формулировка сохраняет местоименную отсылку и не добавляет в основной текст отсутствующее здесь название.
- source_word: תָּלִינוּ
  choice: мы повесили
  rationale: Форма qal perfect 1-го лица множественного числа прямо означает «мы повесили» и естественно передаёт образ оставленных в скорби инструментов.
- source_word: כִּנֹּרוֹתֵינוּ
  choice: наши лиры
  rationale: כִּנּוֹר — древний струнный инструмент, вероятнее всего лира. Традиционный вариант «арфы» приведён в сноске.
