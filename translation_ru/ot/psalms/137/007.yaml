  text: Remember[a], O Yahweh, against the sons of Edom the day of Jerusalem, those who were saying, “Lay it bare, lay it bare[b], down to its foundation!”
translation:
  language: ru
  text: 'Вспомни, Яхве, против сыновей Едома день Иерусалима[a] — тех, кто говорил: «Оголите её, оголите[b] до самого основания!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть день бедствия или падения Иерусалима; буквально: «день Иерусалима».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «Обнажите её, обнажите» или, по смыслу полного уничтожения, «Разрушайте её, разрушайте». Еврейский глагол прежде всего рисует образ полного обнажения города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Припомни
  rationale: Повелительная форма обращена к Богу. В сочетании с дательным «сынам Едома» глагол «припомни» естественно передаёт враждебно-судебный оттенок конструкции זכר ל, не добавляя отдельного слова «против».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לִבְנֵי אֱדוֹם
  choice: сынам Едома
  rationale: Сохраняет еврейское родственно-национальное выражение; дательный падеж вместе с «припомни» передаёт направленность против Едома.
- source_word: אֵת יוֹם יְרוּשָׁלִָם
  choice: день Иерусалима
  rationale: Сохраняет краткую и неоднозначную конструкцию оригинала; контекстуальное значение дня бедствия или падения города поясняется в сноске.
- source_word: הָאֹמְרִים
  choice: тем, кто говорил
  rationale: Передаёт причастное определение, относящееся к сынам Едома, и их повторявшийся призыв во время бедствия.
- source_word: עָרוּ עָרוּ
  choice: Обнажайте её, обнажайте
  rationale: Сохраняет повтор и основной образ глагола — раскрыть, оголить, лишив покрова. Местоимение делает выражение естественным по-русски и относится к Иерусалиму.
- source_word: עַד הַיְסוֹד בָּהּ
  choice: до основания
  rationale: Естественно передаёт полное обнажение или разрушение города вплоть до его основания, сохраняя единственное число существительного.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо употреблено личное имя Бога; транслитерация сохраняет его отличие от титула.
- issue: Судебно-враждебная направленность просьбы
  choice: Припомни ... сынам Едома
  alternative: Вспомни о сынах Едома
  rationale: Первый вариант сохраняет направленность Божьего воспоминания против Едома, тогда как «вспомни о» могло бы звучать нейтрально или благожелательно.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. «Припомни» выбрано ради естественной русской передачи судебно-враждебной конструкции; «день Иерусалима» намеренно сохраняет сжатость оригинала. Повтор повелительного глагола сохранён.
