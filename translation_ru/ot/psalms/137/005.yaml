  text: If I forget you[a], Jerusalem, may my right hand forget.
translation:
  language: ru
  text: Если я забуду тебя, Иерусалим, пусть забудет моя правая рука.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более развёрнуто: «пусть моя правая рука забудет своё умение». В еврейском тексте мысль выражена неполно; такое уточнение предполагается из контекста и отражено в некоторых переводах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Вводит условную формулу клятвы; «если» прямо и естественно передаёт её форму.
- source_word: אֶשְׁכָּחֵךְ
  choice: я забуду тебя
  rationale: Форма первого лица единственного числа с суффиксом второго лица женского рода; сохраняется прямое обращение к Иерусалиму.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Общепринятая русская форма имени; синтаксически это обращение.
- source_word: תִּשְׁכַּח
  choice: пусть забудет
  rationale: Имперфект третьего лица женского рода имеет здесь желательное, самопроклинающее значение в составе клятвы.
- source_word: יְמִינִי
  choice: моя правая рука
  rationale: Буквально передаёт обычное значение יָמִין; рука выступает орудием умения, что соответствует контексту пения и игры.
theological_decisions:
- issue: Эллиптическое самопроклятие во второй части стиха
  choice: пусть забудет и моя правая рука
  alternative: пусть моя правая рука забудет своё умение
  rationale: В масоретском тексте глагол «забудет» не имеет выраженного дополнения. Основной текст сохраняет эту намеренную краткость и не добавляет предполагаемый объект; более развёрнутое контекстуальное понимание вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической клятвы. Эллипсис оригинала сохранён, хотя по-русски он звучит необычно; частица «и» естественно связывает условие с последствием.
