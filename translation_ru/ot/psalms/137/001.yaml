base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/001.yaml
  text: By the rivers of Babylon[a], there we sat down[b]; we also wept when we remembered Zion.
translation:
  language: ru
  text: У рек Вавилона[a] — там мы сидели; мы также плакали, когда вспоминали Сион[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «У потоков Вавилона».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «…там мы сидели и плакали, вспоминая Сион». Перед глаголом «плакали» в еврейском тексте стоит добавочная частица: «также», «и ещё».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: у
  rationale: В сочетании с географическим обозначением передаёт нахождение возле рек; русское «у рек» естественно и точно.
- source_word: נַהֲרוֹת
  choice: рек
  rationale: Обычное значение множественного числа от נָהָר; вариант «потоков» возможен, но менее нейтрален.
- source_word: בָּבֶל
  choice: Вавилона
  rationale: Традиционная русская форма топонима, поставленная в родительном падеже после «рек».
- source_word: שָׁם
  choice: там
  rationale: 'Сохранено дейктическое ударение: изгнанники находились именно там, в Вавилоне.'
- source_word: יָשַׁבְנוּ
  choice: мы сидели
  rationale: Глагол может означать «сидеть» или «жить, обитать»; сцена плача у рек поддерживает конкретное значение «сидели».
- source_word: גַּם בָּכִינוּ
  choice: и плакали
  rationale: Частица גַּם имеет добавочное значение; в естественном русском контексте оно передано союзом «и». Возможное более явное «также плакали» отмечено в сноске.
- source_word: בְּזָכְרֵנוּ
  choice: вспоминая
  rationale: Предлог בְּ с инфинитивной конструкцией здесь выражает сопутствующее время или обстоятельство; деепричастие естественно передаёт эту связь, не сводя её строго к причине.
- source_word: אֶת צִיּוֹן
  choice: Сион
  rationale: Показатель прямого дополнения не переводится; название Сион сохранено, а не заменено толкованием «Иерусалим».
theological_decisions:
- issue: Передача צִיּוֹן
  choice: Сион
  alternative: Иерусалим
  rationale: Сохранение исходного названия удерживает его географическую и богословско-поэтическую многозначность.
- issue: Связь плача с воспоминанием о Сионе
  choice: вспоминая Сион
  alternative: когда мы вспоминали Сион / при воспоминании о Сионе
  rationale: Деепричастная конструкция сохраняет временно-обстоятельственную связь и не делает причинное толкование более определённым, чем еврейский текст.
translation_notes:
  register: Современный литературный русский с торжественной поэтической сдержанностью. Тире сохраняет выразительную паузу после указания места; синтаксис остаётся простым и пригодным для публичного чтения.
