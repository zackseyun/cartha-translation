  text: אַשְׁרֵ֤י שֶׁ/יֹּאחֵ֓ז וְ/נִפֵּ֬ץ אֶֽת עֹ֝לָלַ֗יִ/ךְ אֶל הַ/סָּֽלַע׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/009.yaml
  text: Blessed is the one who seizes and dashes your little ones against the rock[a].
translation:
  language: ru
  text: Блажен тот, кто схватит и разобьёт о скалу твоих младенцев[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоих малых детей». Еврейское слово обозначает совсем маленьких детей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен тот
  rationale: Идиоматическая форма выражает торжественную оценку блаженства; «блажен» сохраняет псалмический регистр и не ослабляет напряжённость стиха.
- source_word: שֶׁיֹּאחֵז
  choice: кто схватит
  rationale: Глагол обозначает решительное захватывание; «схватит» естественно и передаёт силу действия.
- source_word: וְנִפֵּץ
  choice: и разобьёт
  rationale: Глагол выражает насильственное разбивание; сочетание «разобьёт о скалу» точно и естественно передаёт жестокий образ без смягчения.
- source_word: עֹלָלַיִךְ
  choice: твоих младенцев
  rationale: Слово относится к совсем маленьким детям; «младенцев» в современном русском точнее, чем более широкое «детей».
- source_word: אֶל הַסָּלַע
  choice: о скалу
  rationale: При глаголе удара русский язык требует конструкции «разбить о»; «скала» передаёт определённое הַסָּלַע и сохраняет образ.
theological_decisions:
- issue: Этическая и богословская сила אַשְׁרֵי в контексте псалма-проклятия
  choice: 'Передать прямо: «Блажен тот», не смягчая и не морализируя высказывание.'
  alternative: «Счастлив тот» или описательный перевод, ослабляющий оценку.
  rationale: Еврейский текст прямо провозглашает блаженство в контексте возмездия Вавилону. Перевод должен сохранить риторическое и богословское напряжение текста, не превращая его при этом в отвлечённое одобрение личной жестокости.
translation_notes:
  register: Современный литературный русский с торжественным псалмическим оттенком. Жестокость исходного образа сохранена без эвфемизма; восклицательный знак передаёт эмоциональную силу заключительной строки псалма.
