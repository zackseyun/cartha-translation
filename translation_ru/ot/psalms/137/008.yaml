  choice: Сохранить прямую формулу «Блажен тот, кто воздаст тебе»
  alternative: Смягчить до предсказания или общего утверждения о справедливости
  rationale: Еврейский текст прямо выражает блаженство и тем самым сохраняет нравственную и богословскую напряжённость молитвы о возмездии; перевод не должен её устранять.
