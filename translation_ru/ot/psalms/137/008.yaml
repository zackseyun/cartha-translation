- source_word: שֶׁיְשַׁלֶּם לָךְ
  choice: кто воздаст тебе
  rationale: Передаёт значение ответного воздаяния и судебной взаимности без разговорного оттенка.
- source_word: אֶת גְּמוּלֵךְ
  choice: за то
  rationale: В сочетании «воздаст тебе за то, что…» естественно передаёт объект воздаяния и избегает тяжеловесного буквального повтора.
- source_word: שֶׁגָּמַלְתְּ לָנוּ
  choice: что ты сделала нам
  rationale: Передаёт контекстуально отрицательное значение גמל и сохраняет прямую связь воздаяния с деяниями Вавилона.
