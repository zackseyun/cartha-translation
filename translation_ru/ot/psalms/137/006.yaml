base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/006.yaml
  text: May my tongue cling to the roof of my mouth if I do not remember you[b][a], if I do not exalt Jerusalem above my highest joy.
translation:
  language: ru
  text: Пусть язык мой прилипнет к нёбу, если я не буду помнить тебя, если не поставлю Иерусалим превыше всякой моей радости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «если не подниму Иерусалим над главой моей радости»; также возможно: «если не поставлю Иерусалим во главе моей радости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּדְבַּק
  choice: Пусть ... прилипнет
  rationale: Форма от דבק передаёт прилипание или тесное прилегание; в контексте самоосуждающей клятвы русская конструкция с «пусть» естественно выражает пожелание кары.
- source_word: לְשׁוֹנִי
  choice: язык мой
  rationale: Сохранён прямой анатомический образ утраты способности говорить.
- source_word: לְחִכִּי
  choice: к нёбу
  rationale: חֵךְ означает нёбо; это точный и естественный современный русский эквивалент.
- source_word: אִם לֹא
  choice: если ... не
  rationale: Сохранена условная структура древнееврейской клятвы.
- source_word: אֶזְכְּרֵכִי
  choice: я не буду помнить тебя
  rationale: Глагол זכר передан основным значением «помнить»; местоимение женского рода относится к олицетворённому Иерусалиму и сохраняет прямое обращение.
- source_word: אַעֲלֶה אֶת יְרוּשָׁלַם
  choice: не поставлю Иерусалим
  rationale: Каузатив от עלה буквально выражает поднятие; вместе с עַל רֹאשׁ здесь означает отведение Иерусалиму высшего места.
- source_word: עַל רֹאשׁ שִׂמְחָתִי
  choice: превыше всякой моей радости
  rationale: Буквально «над главой моей радости»; выбранная формулировка естественно передаёт смысл высшего приоритета, а буквальный образ указан в сноске.
theological_decisions:
- issue: К кому относится суффикс 2-го лица женского рода в אֶזְכְּרֵכִי
  choice: К Иерусалиму, к которому обращаются как к олицетворённому городу
  alternative: К Сиону или городу в более широком поэтическом смысле
  rationale: Контекст псалма и женский грамматический род делают Иерусалим наиболее естественным референтом; прямое обращение сохраняет эмоциональную силу текста.
- issue: Смысл вознесения Иерусалима «над главой радости»
  choice: Ставить Иерусалим выше всякой собственной радости
  alternative: Считать Иерусалим главной или высшей радостью
  rationale: Древнееврейская конструкция допускает близкие оттенки ранга и первенства; основной текст передаёт приоритет, не превращая Иерусалим непосредственно в саму радость, а сноска сохраняет буквальный образ.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным строем. Инверсия «язык мой» поддерживает поэтическое достоинство, не создавая архаичности; «нёбо» точно сохраняет телесный образ.
