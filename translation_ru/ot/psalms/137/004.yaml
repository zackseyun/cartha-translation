  text: אֵ֗יךְ נָשִׁ֥יר אֶת שִׁיר יְהוָ֑ה עַ֝֗ל אַדְמַ֥ת נֵכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/004.yaml
  text: How can we sing the song of Yahweh on foreign soil?[a][b]
translation:
  language: ru
  text: Как нам петь песню Яхве[a] на чужой земле?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'По-еврейски буквально: «песню Яхве»; традиционный перевод: «песню Господню».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в чужой стране». Еврейское выражение буквально означает «на чужой земле (почве)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Как нам
  rationale: В риторическом вопросе это естественно передаёт значение способа с подразумеваемой невозможностью или неуместностью действия, не превращая вопрос в прямое утверждение.
- source_word: נָשִׁיר
  choice: петь
  rationale: Форма qal, имперфект, 1-е лицо множественного числа. В сочетании «как нам петь» естественно выражает предполагаемое действие и сохраняет скорбную риторическую силу вопроса.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель определённого прямого дополнения не имеет отдельного соответствия в русском языке.
- source_word: שִׁיר
  choice: песню
  rationale: Сочетание с Божьим именем обозначает определённую песню или песнопение, принадлежащее Яхве либо обращённое к Нему; русский винительный падеж обусловлен глаголом «петь».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом; примечание указывает традиционный вариант.
- source_word: עַל
  choice: на
  rationale: Сохраняет конкретный пространственный образ еврейского предлога и естественно сочетается со словом «земле».
- source_word: אַדְמַת
  choice: земле
  rationale: Слово обозначает землю, почву или территорию. «На чужой земле» сохраняет конкретный образ и при этом звучит естественно в современном русском.
- source_word: נֵכָר
  choice: чужой
  rationale: Здесь означает землю, принадлежащую другому народу, то есть иноземную. «Чужой» передаёт и географическую чужбину, и эмоциональное отчуждение контекста.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя, а традиционная замена титулом отмечена в сноске.
- issue: Отношение в сочетании שִׁיר יְהוָה
  choice: песня Яхве
  alternative: Господня песня
  rationale: Конструкция допускает оттенок принадлежности, посвящения или богослужебной направленности. Буквальная именная конструкция не сужает эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с краткой, ритмичной формой риторического вопроса. Выражение «как нам петь» естественно и достойно передаёт плач; «чужая земля» сохраняет конкретность еврейского образа и эмоциональный оттенок изгнания.
