base_translation:
  language: en
  yaml_path: translation/ot/psalms/137/003.yaml
  text: 'For there our captors asked us for words of song[a], and our tormentors for gladness: “Sing for us one of the songs of Zion.”'
translation:
  language: ru
  text: 'Ибо там пленившие нас просили у нас песен, а наши мучители[a] — веселья: «Спойте нам одну из песен Сиона!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насмешники». Редкое еврейское слово может указывать как на жестокое обращение, так и на издевательскую насмешку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предыдущего стиха; «ибо» естественно передаёт причинно-пояснительную связь в возвышенной поэтической речи.
- source_word: שָׁם
  choice: там
  rationale: Прямое указание на место, в контексте — на Вавилон.
- source_word: שְׁאֵלוּנוּ
  choice: требовали от нас
  rationale: Глагол буквально означает «просили у нас», но в устах пленителей просьба имеет характер властного требования; такой выбор естественен по-русски и соответствует контексту.
- source_word: שׁוֹבֵינוּ
  choice: пленившие нас
  rationale: Причастная форма обозначает тех, кто захватил говорящих в плен; оборот точнее сохраняет действие еврейского слова, чем существительное «пленители».
- source_word: דִּבְרֵי שִׁיר
  choice: песен
  rationale: Буквально «слов песни»; в данном контексте это идиоматическое обозначение песенного исполнения. Русское «песен» звучит естественно и не сводит требование лишь к произнесению текста.
- source_word: וְתוֹלָלֵינוּ
  choice: а наши мучители
  rationale: Редкое и не вполне ясное слово может обозначать издевающихся или жестоко обращающихся людей. «Мучители» передаёт враждебное притеснение, а неопределённость отмечена в сноске.
- source_word: שִׂמְחָה
  choice: веселья
  rationale: Слово означает радость или веселье; здесь пленители требуют весёлого развлечения.
- source_word: שִׁירוּ לָנוּ
  choice: Спойте нам
  rationale: Повелительное наклонение во множественном числе с ל естественно передаётся русским «спойте нам».
- source_word: מִשִּׁיר צִיּוֹן
  choice: одну из песен Сиона
  rationale: 'Предлог מן имеет разделительное значение: требуется одна песня из множества песен, связанных с Сионом.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. «Ибо» сохраняет пояснительную связь, а прямая речь звучит естественно. Необычное «слова песни» не воспроизведено буквально, поскольку по-русски оно может ошибочно сузить смысл до текста песни.
