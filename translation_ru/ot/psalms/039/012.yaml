  edition: WLC
  text: שִֽׁמְעָ֥/ה תְפִלָּתִ֨/י יְהוָ֡ה וְ/שַׁוְעָתִ֨/י הַאֲזִינָ/ה֮ אֶֽל דִּמְעָתִ֗/י אַֽל תֶּ֫חֱרַ֥שׁ כִּ֤י גֵ֣ר אָנֹכִ֣י עִמָּ֑/ךְ תּ֝וֹשָׁ֗ב כְּ/כָל אֲבוֹתָֽ/י־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/012.yaml
  text: Hear my prayer[a], O Yahweh, and give ear to my cry; do not be deaf to my tears. For I am a sojourner with you[b], a resident alien like all my fathers.
translation:
  language: ru
  text: 'Услышь мою молитву, Яхве,

    и внемли моему воплю;

    не молчи при моих слезах[a].


    Ибо я у Тебя пришелец,

    поселенец, как и все мои отцы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не оставайся глух к моим слезам». Еврейский глагол может означать как «молчать», так и «быть глухим»; контекст просьб услышать и внять поддерживает второе прочтение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как и все мои предки». Буквально: «как и все мои отцы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעָה
  choice: Услышь
  rationale: Повелительная форма שׁמע выражает прямую мольбу к Богу; «услышь» естественно для русской молитвенной речи.
- source_word: תְפִלָּתִי
  choice: мою молитву
  rationale: Прямой и общепринятый эквивалент существительного תְּפִלָּה.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: וְשַׁוְעָתִי
  choice: моему воплю
  rationale: שַׁוְעָה обозначает настойчивый крик, часто зов о помощи; «вопль» сохраняет эмоциональную силу и поэтический регистр.
- source_word: הַאֲזִינָה
  choice: внемли
  rationale: Повелительная форма от אזן означает внимательное слушание; «внемли» сохраняет параллелизм с «услышь» и уместно в возвышенной, но понятной молитвенной речи.
- source_word: אֶל־דִּמְעָתִי
  choice: перед моими слезами
  rationale: Единственное דִּמְעָה употреблено собирательно; русский множественный оборот естественно сохраняет образ плача. «Перед» позволяет связать слёзы с последующим призывом не молчать.
- source_word: אַל־תֶּחֱרַשׁ
  choice: не будь безмолвен
  rationale: חרשׁ допускает значения «молчать» и «быть глухим». Основной текст сохраняет прямое значение молчания, а слуховой оттенок контекста отмечен в сноске.
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание просьбы; «ибо» ясно передаёт причинную связь и соответствует поэтическому регистру.
- source_word: גֵר
  choice: пришелец
  rationale: גֵּר — человек, живущий не на своей родной земле и не обладающий полным статусом коренного жителя; «пришелец» сохраняет библейскую социальную и странническую окраску.
- source_word: עִמָּךְ
  choice: у Тебя
  rationale: Буквально предлог означает «с Тобой», но в сочетании со статусом пришельца русский оборот «у Тебя» естественно выражает пребывание во владениях и под покровительством Бога, не устраняя отношения с Ним.
- source_word: תּוֹשָׁב
  choice: временный житель
  rationale: תּוֹשָׁב обозначает проживающего на месте человека без полного статуса коренного владельца. Выражение отличает термин от גֵּר и понятно современному читателю.
- source_word: כְּכָל־אֲבוֹתָי
  choice: как и все мои отцы
  rationale: Формально передаёт мужское множественное אֲבוֹתַי и сохраняет библейский образ предшествующих поколений; более широкое «предки» дано как допустимая альтернатива.
theological_decisions:
- issue: 'Два обозначения неполноправного жителя: גֵר и תּוֹשָׁב'
  choice: Различить их как «пришелец» и «временный житель».
  alternative: «странник и поселенец» или сведение обоих терминов к одному понятию
  rationale: Различение сохраняет два еврейских социально-правовых термина и подчёркивает временность человеческого пребывания перед Богом, не превращая их в полные синонимы.
- issue: Двузначность אַל־תֶּחֱרַשׁ
  choice: В основном тексте — «не будь безмолвен».
  alternative: «не будь глух» или «не оставайся глух к моим слезам»
  rationale: Глагол способен обозначать как молчание, так и глухоту. Основной вариант ближе к обычному значению формы, а сноска сохраняет слуховое прочтение, поддержанное предшествующими просьбами услышать и внять.
- issue: Значение אֲבוֹתַי
  choice: «мои отцы» в основном тексте.
  alternative: «мои предки»
  rationale: «Отцы» формально сохраняет выраженное в источнике родовое обозначение; «предки» является естественным смысловым эквивалентом и отмечено в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Формы «внемли», «ибо» и «пришелец» слегка возвышенны, но остаются понятными; синтаксис краток и следует параллелизму еврейского стиха.
