lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов слово обозначает руководителя музыкального исполнения; этот традиционный современный эквивалент ясно передаёт культово-музыкальный контекст.
- source_word: לִידוּתוּן
  choice: согласно Идифуну
  rationale: Предлог ל допускает значение направленности или связи. «Согласно Идифуну» сохраняет вероятную отсылку к манере исполнения, напеву или кругу Идифуна, не представляя эту интерпретацию как несомненную.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшееся и точное русское обозначение жанра музыкально-поэтического произведения в Псалтири.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русская родительная конструкция естественно передаёт широкую связь с Давидом, не ограничивая смысл исключительно авторством.
theological_decisions:
- issue: Характер связи псалма с Давидом
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом
  rationale: Еврейский предлог ל может обозначать авторство, принадлежность, посвящение или иную связь; выбранная формулировка сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с традиционной терминологией Псалтири. Заголовок передан кратко и торжественно; неоднозначность обоих оборотов с предлогом ל отмечена в сносках.
