lexical_decisions:
- source_word: הָשַׁע
  choice: Отведи… свой взгляд
  rationale: Повелительная форма просит Бога перестать смотреть на псалмопевца, то есть прекратить тяготеющее над ним воздействие. Такой перевод естественен по-русски и сохраняет образ взгляда.
- source_word: מִמֶּנִּי
  choice: от меня
  rationale: Предлог с суффиксом первого лица выражает удаление или отстранение от говорящего.
- source_word: וְאַבְלִיגָה
  choice: чтобы я вновь воспрянул[a]
  rationale: Глагол בלג может передавать возвращение бодрости, облегчения, светлого выражения лица или сил. «Вновь воспрянул» естественно объединяет оттенки ободрения и восстановления, не сводя значение только к улыбке или физической силе.
- source_word: בְּטֶרֶם
  choice: прежде чем
  rationale: Передаёт временное значение «до того как» в современном литературном русском языке.
- source_word: אֵלֵךְ
  choice: уйду
  rationale: Сохраняет сдержанную метафору ухода, которой еврейский текст обозначает приближение смерти, не заменяя её прямым словом «умру».
- source_word: וְאֵינֶנִּי
  choice: и меня не станет
  rationale: Естественная русская идиома, передающая отсутствие и прекращение земной жизни с той же торжественной окончательностью.
theological_decisions:
- issue: Следует ли прямо назвать смерть в выражении אֵלֵךְ וְאֵינֶנִּי
  choice: «прежде чем уйду и меня не станет»
  alternative: «прежде чем умру и исчезну»
  rationale: Контекст явно указывает на смерть, однако еврейский текст говорит о ней косвенно. Сохранение образа ухода передаёт поэтическую сдержанность и не делает высказывание более прямым, чем в источнике.
translation_notes:
