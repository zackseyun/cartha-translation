base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/006.yaml
  text: Surely a man walks about as a shadow[a]; surely they are in turmoil in vain[c][b]. He heaps up wealth and does not know who will gather it.
translation:
  language: ru
  text: Воистину, человек ходит словно призрак[a]; воистину, напрасно они суетятся[b]. Он копит и не знает, кто соберёт накопленное им[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как образ», «как одно лишь подобие» или «как призрак». Еврейское слово буквально означает «образ»; здесь оно подчёркивает невещественность и непрочность человеческой жизни.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «они шумят (волнуются) напрасно». Множественное число глагола после единственного «человек», вероятно, обобщённо относится ко всем людям.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «кто соберёт их», то есть накопленные им вещи или богатства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: воистину
  rationale: Повтор частицы передан одинаково в обеих строках; «воистину» выражает усилительное значение и сохраняет поэтический повтор, не исключая возможного ограничительного оттенка.
- source_word: בְּצֶלֶם
  choice: как призрачный образ
  rationale: צֶלֶם буквально означает «образ, изображение», но здесь указывает на непрочность и невещественность человеческого существования. Сочетание «призрачный образ» сохраняет исходную лексику и передаёт контекстуальный смысл.
- source_word: יִתְהַלֶּךְ אִישׁ
  choice: человек ходит
  rationale: Форма породы хитпаэль от הלך описывает хождение или движение; אִישׁ здесь представляет человека вообще.
- source_word: הֶבֶל
  choice: напрасно
  rationale: В сочетании с глаголом волнения или суеты слово имеет обстоятельственный смысл тщетности, хотя буквально может обозначать «дуновение», «пустоту».
- source_word: יֶהֱמָיוּן
  choice: они суетятся
  rationale: Сохранено множественное число еврейского глагола и его значение беспокойного, шумного движения. Русское «суетятся» естественно передаёт тщетную человеческую занятость.
- source_word: יִצְבֹּר
  choice: он копит
  rationale: Глагол означает собирать в кучу, накапливать. Без дополнения русский глагол сохраняет невыраженный объект исходного текста.
- source_word: וְלֹא יֵדַע
  choice: и не знает
  rationale: Сохранены простое сочинение и отрицание еврейского текста.
- source_word: מִי אֹסְפָם
  choice: кто соберёт накопленное им
  rationale: Так передана мысль о будущем обладателе накопленного при сохранении глагола «собрать»; пояснение в сноске отмечает буквальное множественное местоимение.
theological_decisions:
- issue: Обобщающее значение אִישׁ и переход к множественному числу
  choice: «человек» в единственном числе, затем «они суетятся»
  alternative: «люди суетятся» или согласованное единственное число «он суетится»
  rationale: 'Перевод сохраняет грамматическое напряжение оригинала: единичный образ человека сменяется множественным глаголом, вероятно относящимся к людям вообще.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Повтор «воистину» воспроизводит структуру стиха; синтаксическая смена числа намеренно сохранена и разъяснена в сноске.
