lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: Я безмолвен
  rationale: Нифаль от אלם выражает состояние немоты или безмолвия как результат; «я безмолвен» естественно передаёт это состояние и не вводит явно не названного деятеля, как вариант «меня заставили умолкнуть».
- source_word: לֹא אֶפְתַּח פִּי
  choice: не открываю уст моих
  rationale: Сочетание פתח с «моими устами» означает начало речи. Настоящее время соответствует текущему состоянию псалмопевца; «уста» сохраняет достоинство поэтической речи и близость к еврейскому образу.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину безмолвия; «потому что» ясно передаёт причинную связь в современном русском языке.
- source_word: אַתָּה
  choice: Ты
  rationale: Личное местоимение в еврейском тексте выражено отдельно и имеет смысловое ударение; его сохранение подчёркивает прямое обращение к Богу.
- source_word: עָשִׂיתָ
  choice: сделал это
  rationale: Глагол עשה имеет широкое значение «делать, совершать». Объект в еврейском тексте не назван; местоимение «это» делает русскую фразу естественной, не уточняя характера Божьего действия.
theological_decisions:
- issue: Неназванный объект עָשִׂיתָ и Божье действие
  choice: «потому что Ты сделал это» — признание действия Бога с сохранением неопределённости его объекта
  alternative: «потому что Ты действовал» или «ибо это совершил Ты»
  rationale: Еврейский текст не называет объект действия. Перевод не поясняет, что именно сделал Бог, и тем самым сохраняет напряжение контекста страдания и признания Божьего действия, не добавляя богословского истолкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим оттенком. «Безмолвен» и «уста» уместны для псалма, понятны современному читателю и не создают архаической синтаксической тяжеловесности.
