  text: בְּֽ/תוֹכָ֘ח֤וֹת עַל עָוֺ֨ן יִסַּ֬רְתָּ אִ֗ישׁ וַ/תֶּ֣מֶס כָּ/עָ֣שׁ חֲמוּד֑/וֹ אַ֤ךְ הֶ֖בֶל כָּל אָדָ֣ם סֶֽלָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/011.yaml
  text: With rebukes for iniquity you discipline a man[a], and like a moth you consume what is precious to him; surely every man is vapor[b]. Selah
translation:
  language: ru
  text: Обличениями за беззаконие Ты вразумляешь человека и, словно моль, губишь то, что ему дорого[a]. Поистине, всякий человек — лишь дуновение[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты даёшь истлеть тому, что ему дорого, словно от моли». Еврейское слово может означать «его красоту» либо, шире, всё, чем он дорожит.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское הֶבֶל обозначает нечто подобное дыханию или мимолётному дуновению — непрочное и преходящее; традиционный перевод: «суета».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּתוֹכָחוֹת
  choice: обличениями
  rationale: Передаёт множественное число и инструментальное значение предлога בְּ, сохраняя смысл порицания и исправления.
- source_word: עַל עָוֺן
  choice: за беззаконие
  rationale: В данном контексте выражение указывает на основание наказующего вразумления; «беззаконие» сохраняет нравственную весомость עָוֺן.
- source_word: יִסַּרְתָּ
  choice: Ты вразумляешь
  rationale: Глагол יסר обозначает исправляющее воздействие, дисциплинирование или наказание; «вразумляешь» естественно по-русски и сохраняет исправительную направленность.
- source_word: אִישׁ
  choice: человека
  rationale: Хотя существительное имеет мужской род, здесь оно употреблено обобщённо; русское «человека» сохраняет и форму, и общий смысл.
- source_word: וַתֶּמֶס
  choice: истребляешь
  rationale: Форма от מסס выражает причинение разрушения, таяния или истощения; «истребляешь» согласуется с образом моли, постепенно уничтожающей ценное.
- source_word: כָּעָשׁ
  choice: словно моль
  rationale: Прямо сохраняет сравнительный образ постепенного разрушения.
- source_word: חֲמוּדוֹ
  choice: то, что ему дорого
  rationale: חֲמוּד обозначает желанное, ценное или привлекательное; выбранная формулировка сохраняет широкий объём значения, не ограничивая его красотой или имуществом.
- source_word: אַךְ
  choice: поистине
  rationale: Передаёт усилительный и заключительный оттенок частицы в торжественном контексте.
- source_word: הֶבֶל
  choice: лишь пар
  rationale: «Пар» сохраняет конкретный образ чего-то мимолётного и неуловимого; «лишь» передаёт оттенок незначительности и краткости.
- source_word: כָּל אָדָם
  choice: всякий человек
  rationale: 'Точно передаёт обобщённое значение: каждый представитель человечества.'
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение богослужебно-музыкального термина неясно, поэтому он передан традиционной транслитерацией.
theological_decisions:
- issue: Обобщённое обозначение человека
  choice: «человека» и «всякий человек»
  alternative: «мужчину» и «всякий мужчина»
  rationale: אִישׁ и אָדָם в этом контексте имеют представительное, общечеловеческое значение. Русское «человек» грамматически мужского рода и не сужает смысл до лиц мужского пола.
- issue: Характер Божьего воздействия
  choice: «вразумляешь»
  alternative: «наказываешь» или «караешь»
  rationale: יסר включает наказующую дисциплину, но также предполагает исправление. «Вразумляешь» сохраняет эту напряжённость, не сводя действие исключительно к возмездию.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Синтаксис остаётся ясным для обычного читателя; сохранены образ моли, обобщённая антропология и неясный термин «Села».
