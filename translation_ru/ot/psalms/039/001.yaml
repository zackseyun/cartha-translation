  text: אָמַ֗רְתִּי אֶֽשְׁמְרָ֣ה דְרָכַ/י֮ מֵ/חֲט֪וֹא בִ/לְשׁ֫וֹנִ֥/י אֶשְׁמְרָ֥ה לְ/פִ֥/י מַחְס֑וֹם בְּ/עֹ֖ד רָשָׁ֣ע לְ/נֶגְדִּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/001.yaml
  text: I said[a], “I will guard my ways from sinning with my tongue; I will keep a muzzle for my mouth while the wicked is before me.”
translation:
  language: ru
  text: 'Я сказал: «Буду беречь пути мои, чтобы не согрешить языком моим; буду держать уста мои под уздой, пока нечестивец[a] предо мной».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечестивый»; возможно также: «злой человек». В еврейском тексте — форма мужского рода единственного числа.'
    reason: лексическая альтернатива и сохранение грамматической формы оригинала
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Я сказал
  rationale: Прямо передаёт форму qal, перфект, 1-е лицо единственного числа от אמר; контекст придаёт высказыванию характер принятого решения, но глагол «решил» был бы более истолковательным.
- source_word: אֶשְׁמְרָה דְרָכַי
  choice: Буду беречь пути мои
  rationale: Когортативное значение выражает твёрдое намерение; «беречь» передаёт внимательное хранение, а «пути мои» сохраняет понятный библейский образ образа жизни и поведения.
- source_word: מֵחֲטוֹא בִלְשׁוֹנִי
  choice: чтобы не согрешить языком моим
  rationale: 'Предлог מן с инфинитивом выражает предотвращение действия, а ב имеет инструментальное значение: возможный грех совершается посредством языка.'
- source_word: אֶשְׁמְרָה לְפִי מַחְסוֹם
  choice: буду держать уста мои под уздой
  rationale: Передаёт намерение сдерживать речь и сохраняет конкретный образ מַחְסוֹם — узды или намордника; русское выражение «держать под уздой» звучит естественно и достойно.
- source_word: בְּעוֹד
  choice: пока
  rationale: 'Передаёт одновременность и продолжительность: сдерживать речь в то время, когда нечестивец находится перед псалмопевцем.'
- source_word: רָשָׁע
  choice: нечестивец
  rationale: Субстантивированное прилагательное мужского рода единственного числа передано существительным того же числа и рода без добавления отсутствующего в еврейском тексте слова «человек».
- source_word: לְנֶגְדִּי
  choice: предо мной
  rationale: Сохраняет краткость безглагольной еврейской конструкции и допускает оттенки «передо мной» и «в моём присутствии».
theological_decisions:
- issue: Род и определённость слова רָשָׁע
  choice: нечестивец
  alternative: нечестивый; злой человек
  rationale: Еврейская форма имеет мужской род и единственное число, однако артикля нет, а контекст не позволяет с полной уверенностью определить, имеется ли в виду конкретный нечестивец или представитель типа. Русское «нечестивец» сохраняет число и род, не вводя лишнего слова.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Формы «пути мои», «языком моим», «уста мои» и «предо мной» сохраняют поэтический параллелизм и достоинство речи, оставаясь понятными современному читателю.
