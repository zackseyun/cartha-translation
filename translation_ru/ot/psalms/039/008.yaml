  text: מִ/כָּל פְּשָׁעַ֥/י הַצִּילֵ֑/נִי חֶרְפַּ֥ת נָ֝בָ֗ל אַל תְּשִׂימֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/008.yaml
  text: Deliver me from all my transgressions[a]; do not make me the reproach of a fool.
translation:
  language: ru
  text: Избавь меня от всех моих преступлений; не делай меня предметом поношения для глупца[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не делай меня позором глупца». Еврейское выражение может означать как поношение, исходящее от глупца, так и позор, связанный с глупцом или глупостью.'
    reason: Лексическая и синтаксическая неоднозначность сочетания חֶרְפַּת נָבָל.
lexical_decisions:
- source_word: מִכָּל פְּשָׁעַי
  choice: от всех моих преступлений
  rationale: Сочетание מִן с כֹּל охватывает всю совокупность проступков, а פֶּשַׁע обозначает преступление или сознательное нарушение должного порядка. «Преступления» сохраняет нравственную серьёзность слова и естественно звучит в современной русской молитвенной речи.
- source_word: הַצִּילֵנִי
  choice: избавь меня
  rationale: Побудительная форма глагола נצל выражает просьбу спасти или высвободить из бедственного положения. «Избавь меня» точно передаёт направленную к Богу молитвенную просьбу и не уточняет без достаточного основания, идёт ли речь о самих грехах или об их последствиях.
- source_word: חֶרְפַּת
  choice: предметом поношения
  rationale: 'חֶרְפָּה может обозначать поношение, поругание или позор. Оборот «предметом поношения» естественно передаёт вероятный смысл: псалмопевец просит не допустить, чтобы глупец его поносил.'
- source_word: נָבָל
  choice: глупца
  rationale: נָבָל обозначает не просто человека с недостатком ума, а нравственно неразумного, нечестивого человека. Традиционное и лаконичное «глупец» сохраняет широту значения, не добавляя в основной текст толкования.
- source_word: אַל תְּשִׂימֵנִי
  choice: не делай меня
  rationale: שׂים с личным дополнением здесь означает привести человека в определённое положение или сделать его кем-либо. «Не делай меня» — прямой и естественный русский эквивалент.
theological_decisions:
- issue: Смысл просьбы о поношении со стороны глупца
  choice: Псалмопевец просит Бога не допустить, чтобы он стал предметом поношения для нравственно неразумного человека.
  alternative: Псалмопевец просит не сделать его позором, связанным с глупцом или глупостью.
  rationale: Сочетание חֶרְפַּת נָבָל допускает разные смысловые отношения между существительными. Основной текст передаёт наиболее вероятное понимание — поношение, исходящее от глупца, — а примечание сохраняет возможность значения позора, связанного с глупцом или глупостью, не устраняя подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным молитвенным звучанием. Синтаксический параллелизм еврейской строки сохранён; терминология не привязана к конфессионально специфическому толкованию.
