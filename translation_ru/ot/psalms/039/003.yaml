lexical_decisions:
- source_word: חַם
  choice: разгорелось
  rationale: Передаёт нарастание внутреннего жара, не сливая полностью этот образ с последующим прямым упоминанием огня.
- source_word: לִבִּי
  choice: сердце моё
  rationale: Сохраняет еврейский образ сердца как средоточия мыслей, воли и чувств.
- source_word: בְּקִרְבִּי
  choice: во мне
  rationale: Естественно по-русски выражает внутреннее местонахождение переживания.
- source_word: בַּהֲגִיגִי
  choice: пока я размышлял
  rationale: הֲגִיג допускает значения внутреннего раздумья, размышления или тихого бормотания; временное прочтение предлога естественно в данном контексте.
- source_word: תִבְעַר אֵשׁ
  choice: запылал огонь
  rationale: Сохраняет яркий образ огня и передаёт усиление от внутреннего жара к открытому пламени; отсутствие артикля в русском позволяет не решать, определён ли этот огонь.
- source_word: דִּבַּרְתִּי
  choice: тогда я заговорил
  rationale: «Тогда» естественно обозначает последовательность от внутреннего размышления к речи, а «заговорил» передаёт наступление речевого действия.
- source_word: בִּלְשׁוֹנִי
  choice: языком моим
  rationale: Сохраняет телесный образ исходного текста и его подчёркнутое указание на произнесённую вслух речь.
