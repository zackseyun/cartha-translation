base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/005.yaml
  text: Behold[a], you have made my days a few handbreadths, and my lifetime is as nothing before you; surely every man, though standing firm, is altogether vapor[c][b]. Selah
translation:
  language: ru
  text: 'Вот, Ты сделал дни мои длиною в несколько ладоней,

    и срок моей жизни — ничто пред Тобой.

    Поистине, всякий человек, даже прочно стоящий[a], — лишь пар[b].

    Села.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стоящий»; возможно также: «утвердившийся», то есть кажущийся устойчивым и защищённым.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «дуновение», «суета» или «тщета»; еврейское הֶבֶל обозначает нечто неуловимое, непрочное и быстро исчезающее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет эмфатическое привлечение внимания и возвышенный поэтический тон, оставаясь естественным для современного русского языка.
- source_word: טְפָחוֹת נָתַתָּה יָמַי
  choice: Ты отмерил моим дням лишь несколько ладоней
  rationale: «Ладонь» передаёт конкретную малую меру длины; глагол «отмерил» естественно выражает назначенную Богом краткость жизни. «Лишь несколько» раскрывает подразумеваемую ничтожность меры, не устраняя образ.
- source_word: וְחֶלְדִּי
  choice: и срок моей жизни
  rationale: Передаёт продолжительность земной жизни и поддерживает параллелизм с «моими днями».
- source_word: כְאַיִן נֶגְדֶּךָ
  choice: ничто пред Тобой
  rationale: Сохраняет сравнение с ничтожеством в Божьем присутствии или по отношению к Богу; «пред Тобой» соответствует поэтическому регистру.
- source_word: אַךְ
  choice: Поистине
  rationale: Передаёт усилительное, утвердительное значение частицы в итоговом обобщении.
- source_word: כָּל אָדָם
  choice: всякий человек
  rationale: Естественный русский родовой единственный термин, охватывающий любого человека без ненужного гендерного сужения.
- source_word: נִצָּב
  choice: даже прочно стоящий
  rationale: Сохраняет буквальный образ стояния и вероятный оттенок устойчивости или прочного положения; «даже» выявляет контраст с человеческой мимолётностью.
- source_word: הֶבֶל
  choice: пар
  rationale: Передаёт конкретный образ чего-то неуловимого, непрочного и быстро исчезающего, не сводя многозначность слова только к «суете» или «тщете».
- source_word: סֶלָה
  choice: Села
  rationale: Сохранена традиционная транслитерация, поскольку точное значение литургического или музыкального термина неизвестно.
theological_decisions:
- issue: Обобщающее значение אָדָם
  choice: всякий человек
  alternative: всё человечество
  rationale: Единственное число и дистрибутивное כָּל лучше сохраняются выражением «всякий человек», которое в современном русском естественно включает всех людей.
- issue: Смысл נִצָּב в утверждении о человеческой бренности
  choice: даже прочно стоящий
  alternative: стоящий / утвердившийся
  rationale: Причастие допускает буквальное «стоящий» и смысл устойчивого положения. Основной текст передаёт вероятный контраст, а сноска сохраняет более буквальную и альтернативную возможность.
- issue: Образ הֶבֶל
  choice: пар
  alternative: дуновение / суета / тщета
  rationale: «Пар» сохраняет исходный чувственный образ мимолётности и не навязывает исключительно нравственный или философский смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Синтаксис остаётся ясным для обычного читателя; конкретные еврейские образы «ладоней» и «пара» сохранены. Прописные местоимения обращения к Богу использованы в соответствии с устойчивой русской библейской традицией.
