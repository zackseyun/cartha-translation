lexical_decisions:
- source_word: הָסֵר מֵעָלַי
  choice: Отведи от меня
  rationale: Повелительная форма передаёт прямую мольбу об устранении того, что тяготеет над псалмопевцем. «Отведи от меня» естественно звучит по-русски и сохраняет направленность действия.
- source_word: נִגְעֶךָ
  choice: Твой удар
  rationale: נגע может обозначать удар, поражение, бедствие или язву. «Удар» сохраняет образ непосредственного Божьего воздействия, не уточняя его как болезнь или судебное наказание.
- source_word: מִתִּגְרַת יָדְךָ
  choice: под натиском Твоей руки
  rationale: תגרה передаёт враждебный напор, столкновение или нападение. «Под натиском» естественно сочетается с образом руки и сохраняет ощущение непреодолимого давления; образ Божьей руки оставлен без отвлечённой замены словом «сила».
- source_word: אֲנִי כָלִיתִי
  choice: я изнемог
  rationale: כלה здесь может означать истощение, угасание или приближение к концу. «Я изнемог» кратко передаёт завершённость и крайнюю степень истощения, не утверждая буквальную гибель говорящего.
theological_decisions:
- issue: Характер воздействия, обозначенного נִגְעֶךָ
  choice: Передано как «Твой удар» — прямое воздействие Бога, без уточнения его природы.
  alternative: «Твоё поражение», «Твоё бедствие», «Твоя язва»
  rationale: Еврейский текст связывает страдание с Богом, но не определяет, является ли оно болезнью, наказанием или иным бедствием. Перевод сохраняет эту напряжённость.
- issue: Образ Божьей руки в מִתִּגְרַת יָדְךָ
  choice: 'Сохранён телесный образ: «под натиском Твоей руки».'
  alternative: «от Твоего могущества» или «из-за Твоего воздействия»
  rationale: Антропоморфный образ принадлежит самому тексту и выражает действенную Божью силу; его не следует устранять поясняющим пересказом.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической сжатостью. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают принятый в русском библейском стиле благоговейный регистр. Параллелизм двух полустиший сохранён; формулировки не конкретизируют страдание как болезнь либо кару.
