lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительный союз וְ и временной поворот עַתָּה, естественно вводя итоговое обращение псалмопевца.
- source_word: מַה
  choice: чего
  rationale: В сочетании с глаголом ожидания русский родительный падеж передаёт вопросительное «чего?» естественнее буквального «что?».
- source_word: קִוִּיתִי
  choice: мне ждать
  rationale: קוה объединяет значения ожидания и надежды. Инфинитивная русская конструкция после «чего» естественно выражает нынешнюю направленность вопроса, хотя еврейская форма грамматически перфектная.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт божественный титул אֲדֹנָי и отличает его от передачи тетраграмматона; форма обращения звучит современно и достойно.
- source_word: תּוֹחַלְתִּי
  choice: моя надежда
  rationale: Существительное обозначает надежду или исполненное ожидания упование; «надежда» — наиболее естественный и центральный русский эквивалент.
- source_word: לְךָ הִיא
  choice: На Тебя моя надежда
  rationale: Конструкция с לְ указывает, к кому направлена надежда; русское «на Тебя» сохраняет эту направленность, а местоимение הִיא передаётся именной конструкцией без избыточного «она».
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Владыка
  alternative: Господь; мой Господь
  rationale: אֲדֹנָי здесь является обращением к Богу и стандартным божественным титулом. «Владыка» переводит титул, не превращая исторический суффикс формы в обязательное притяжательное «мой» и не смешивая его с принятой передачей имени יהוה.
- issue: Объект надежды в לְךָ
  choice: На Тебя моя надежда
  alternative: Моя надежда — в Тебе
  rationale: Еврейский предлог לְ буквально выражает направленность к адресату. «На Тебя» сохраняет этот оттенок, не исключая смысла доверия и опоры, который яснее выражает альтернатива «в Тебе».
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейским регистром. Заглавные формы «Тебя» употреблены как уважительное обращение к Богу. Риторический вопрос сохранён; смысловая связь между ожиданием и надеждой отмечена в сноске.
