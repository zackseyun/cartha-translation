  text: נֶאֱלַ֣מְתִּי ד֭וּמִיָּה הֶחֱשֵׁ֣יתִי מִ/טּ֑וֹב וּ/כְאֵבִ֥/י נֶעְכָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/002.yaml
  text: I was mute in silence[a]; I kept silent from good[b], and my pain was stirred up.
translation:
  language: ru
  text: Я онемел и хранил безмолвие; я молчал, воздерживаясь от доброго[a], и боль моя усилилась.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв. «от добра». Возможно: «молчал, не говоря ничего доброго»; также возможно: «воздерживался от того, что было благом».'
    reason: 'Лаконичное выражение מִטּוֹב неоднозначно: оно может относиться к добрым словам либо к добру вообще.'
lexical_decisions:
- source_word: נֶאֱלַמְתִּי
  choice: я онемел
  rationale: Форма нифаля передаёт состояние немоты или неспособности говорить, не уточняя, было ли молчание добровольным или вынужденным.
- source_word: דּוּמִיָּה
  choice: и безмолвствовал
  rationale: Существительное обозначает безмолвие, тишину, неподвижность. Глагольная передача естественна по-русски и сохраняет усилительный параллелизм.
- source_word: הֶחֱשֵׁיתִי
  choice: молчал
  rationale: Форма хифиля от חשׁה означает хранить молчание; простой русский глагол ясно передаёт продолжение намеренного воздержания от речи.
- source_word: מִטּוֹב
  choice: даже о добром
  rationale: Краткое еврейское выражение буквально значит «от добра» и допускает несколько толкований. В контексте обета молчания наиболее естественно понять его как воздержание даже от добрых слов; неоднозначность отмечена в сноске.
- source_word: וּכְאֵבִי
  choice: и боль моя
  rationale: כאב может обозначать как физическую боль, так и душевное страдание; слово «боль» сохраняет эту широту.
- source_word: נֶעְכָּר
  choice: усилилась
  rationale: Нифаль от עכר описывает взбудораженное, потревоженное состояние. В сочетании с болью естественное русское «усилилась» передаёт нарастание внутреннего страдания.
theological_decisions:
- issue: Смысл выражения מִטּוֹב
  choice: Воздержание даже от добрых слов
  alternative: Воздержание от добра или от того, что приносит благо
  rationale: Контекст говорит о сдерживании языка, но необычная конструкция допускает более широкое понимание; поэтому основной текст следует ближайшему контексту, а альтернатива сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм двух выражений молчания сохранён без искусственной буквальности.
