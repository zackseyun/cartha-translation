  text: הוֹדִ֘יעֵ֤/נִי יְהוָ֨ה קִצִּ֗/י וּ/מִדַּ֣ת יָמַ֣/י מַה הִ֑יא אֵ֝דְעָ֗ה מֶה חָדֵ֥ל אָֽנִי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/039/004.yaml
  text: O Yahweh[a], make me know my end and what is the measure of my days; let me know how fleeting I am.
translation:
  language: ru
  text: Дай мне узнать, Яхве, каков мой конец и какова мера моих дней, чтобы я понял, насколько я недолговечен[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насколько я немощен» или «как я бренен». Краткое еврейское выражение может подчёркивать как человеческую немощь, так и быстротечность жизни.'
    reason: Лексическая неоднозначность выражения מֶה חָדֵל אָֽנִי.
lexical_decisions:
- source_word: הוֹדִיעֵנִי
  choice: Дай мне знать
  rationale: Побудительная форма глагола ידע означает «сделай так, чтобы я узнал». Русское «дай мне знать» естественно передаёт просьбу и сохраняет значение познания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом «Господь».
- source_word: קִצִּי
  choice: мой конец
  rationale: קֵץ обозначает конец или предел; в контексте размышления о краткости жизни «мой конец» точно передаёт смысл без добавления идеи предопределённой судьбы.
- source_word: וּמִדַּת יָמַי מַה הִיא
  choice: и какова мера моих дней
  rationale: Сохранён образ «меры» (מִדָּה), а сочетание מַה הִיא естественно передано вопросительным «какова».
- source_word: אֵדְעָה
  choice: чтобы я понял
  rationale: Когортатив здесь выражает цель или желаемый результат предшествующей просьбы. «Чтобы я понял» естественно по-русски связывает обе части стиха, не превращая вторую форму в отдельное повеление.
- source_word: מֶה חָדֵל אָֽנִי
  choice: как я недолговечен
  rationale: Краткое и трудное еврейское выражение в данном контексте указывает прежде всего на преходящесть человеческой жизни. «Недолговечен» ясно и естественно передаёт эту мысль, а возможный оттенок немощи отмечен в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит личное имя יהוה. Форма «Яхве» сохраняет имя и соответствует наиболее принятой научной реконструкции его произношения.
- issue: Смысл выражения מֶה חָדֵל אָֽנִי
  choice: как я недолговечен
  alternative: как я слаб; как я преходящ
  rationale: Контекст псалма подчёркивает краткость человеческих дней, однако слово חָדֵל допускает оттенки бренности, немощи и исчезновения; поэтому основной текст не следует понимать как исключающий эти оттенки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Синтаксический параллелизм и образ «меры дней» сохранены; архаизмы вроде «возвести мне» и чрезмерно церковнославянская лексика не использованы.
