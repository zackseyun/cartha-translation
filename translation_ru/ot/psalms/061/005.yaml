  text: כִּֽי אַתָּ֣ה אֱ֭לֹהִים שָׁמַ֣עְתָּ לִ/נְדָרָ֑/י נָתַ֥תָּ יְ֝רֻשַּׁ֗ת יִרְאֵ֥י שְׁמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/005.yaml
  text: For you[a], O God, have heard my vows[b]; you have given me the inheritance of those who fear your name.
translation:
  language: ru
  text: Ибо Ты, Боже, услышал мои обеты; Ты дал наследие[a] боящихся имени Твоего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «Ты дал мне наследие боящихся имени Твоего». В еврейском тексте слово «мне» прямо не выражено, но его можно подразумевать из контекста.'
    reason: alternative_reading
  - marker: b
    text: «Боящиеся имени Твоего» — люди, живущие в благоговейном страхе перед Богом.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующей просьбы или уверенности; «ибо» сохраняет причинно-пояснительную связь и соответствует возвышенному, но понятному стилю молитвы.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма обращения естественно передаёт звательный смысл, ясный из местоимения и глаголов второго лица.
- source_word: שָׁמַעְתָּ
  choice: услышал
  rationale: Перфект обозначает совершившееся действие, значимое для настоящего; русский вид глагола естественно передаёт эту завершённость без обязательного добавления вспомогательных слов.
- source_word: לִנְדָרָי
  choice: мои обеты
  rationale: נדר обозначает прежде всего обет, а не обязательно приношение во исполнение обета. Предлог ל при глаголе «слышать» в русском естественно не воспроизводится отдельно.
- source_word: נָתַתָּ
  choice: Ты дал
  rationale: Перфект передан совершенным видом как завершённое Божье действие. Получатель в основном тексте не добавлен, поскольку в еврейском он прямо не назван.
- source_word: יְרֻשַּׁת
  choice: наследие
  rationale: Слово обозначает наследуемое достояние или удел. «Наследие» сохраняет как предметный, так и богословски значимый оттенок дарованного достояния.
- source_word: יִרְאֵי שְׁמֶךָ
  choice: боящихся имени Твоего
  rationale: Буквальная и устойчивая формулировка сохраняет смысл благоговейного страха перед Богом, не сводя его лишь к почтению.
theological_decisions:
- issue: Кому дано «наследие боящихся имени Твоего»
  choice: Ты дал наследие боящихся имени Твоего
  alternative: Ты дал мне наследие боящихся имени Твоего
  rationale: В масоретском тексте после נָתַתָּ нет выраженного косвенного дополнения «мне». Контекст позволяет подразумевать псалмопевца как получателя, но основной текст не делает этот вывод явным; альтернативное понимание отмечено в сноске.
- issue: Смысл выражения «боящиеся имени Твоего»
  choice: Сохранено слово «боящиеся»
  alternative: почитающие имя Твоё
  rationale: Еврейское ירא включает благоговение и страх. Более мягкое «почитающие» частично снимает присущее выражению богословское напряжение.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. «Ибо» и обращение «Боже» поддерживают возвышенный регистр, оставаясь понятными. Прописные буквы в местоимениях, относящихся к Богу, использованы последовательно в рамках принятого библейского оформления.
