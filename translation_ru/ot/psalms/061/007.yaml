base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/007.yaml
  text: May he sit enthroned before God forever[b][a]; appoint steadfast love and truth to guard him.
translation:
  language: ru
  text: Да восседает он вовеки пред Богом[a]; поставь неизменную любовь и верность[b] стражами его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да пребывает он вовеки пред Богом». Еврейский глагол может означать «сидеть», «пребывать» или «жить»; в царском контексте возможно значение «восседать на престоле».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «милость и истину». Это устойчивое сочетание может обозначать неизменную благосклонность и надёжность; здесь они представлены как охраняющие его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשֵׁב
  choice: Да восседает
  rationale: Форма допускает значения «сидеть», «пребывать», «жить» и, в царском контексте, «восседать на престоле». Пожелательная конструкция «да восседает» согласуется с молитвенным характером стиха и сохраняет царственный оттенок.
- source_word: עוֹלָם
  choice: вовеки
  rationale: Передаёт неограниченную, непрестанную длительность и естественно звучит в современной возвышенной поэзии.
- source_word: לִפְנֵי אֱלֹהִים
  choice: пред Богом
  rationale: Кратко и точно передаёт значение «перед Богом, в присутствии Бога», сохраняя поэтический регистр.
- source_word: חֶסֶד
  choice: милость
  rationale: В данном устойчивом сочетании обозначает деятельную, неизменную благосклонность и заветную преданность. «Милость» — естественный и ёмкий русский эквивалент, не сводящий слово лишь к чувству.
- source_word: אֱמֶת
  choice: верность
  rationale: В паре с חֶסֶד слово подчёркивает надёжность и постоянство; «верность» здесь контекстуально яснее буквального «истина», которое сохранено в сноске как реальная альтернатива.
- source_word: מַן
  choice: поставь
  rationale: Императив понимается как просьба Богу определить или назначить милость и верность защитниками царя. «Поставь» естественно сочетается с олицетворёнными качествами.
- source_word: יִנְצְרֻהוּ
  choice: охранять его
  rationale: Глагол נצר означает хранить, оберегать, сохранять. Множественное число представляет милость и верность как олицетворённых хранителей.
theological_decisions:
- issue: Модальность יֵשֵׁב в царской молитве
  choice: 'Пожелание: «Да восседает он»'
  alternative: 'Предсказание: «Он будет восседать»; либо «Да пребывает он»'
  rationale: Молитвенный контекст и повеление во второй половине стиха поддерживают пожелательное прочтение, однако лексическая неоднозначность глагола отмечена в сноске.
- issue: Смысл сочетания חֶסֶד וֶאֱמֶת
  choice: 'Олицетворённые Божьи качества: «милость и верность»'
  alternative: «милость и истина»
  rationale: Сочетание выражает надёжную, неизменную благосклонность Бога. «Верность» раскрывает контекстуальный смысл אֱמֶת, а вариант «истина» сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Формы «вовеки» и «пред Богом» сохраняют достоинство поэзии, оставаясь понятными современному читателю; синтаксический параллелизм и олицетворение исходного текста сохранены.
