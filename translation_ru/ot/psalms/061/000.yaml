  text: For the choir director; with stringed instruments. Of David[a].
translation:
  language: ru
  text: Руководителю хора. На струнных инструментах. Давида[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Давидом» или «для Давида»; еврейская конструкция может указывать на авторство, связь с Давидом или посвящение ему.'
    reason: Сохранение смысловой широты еврейского предлога לְ.
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов слово обозначает руководителя музыкального исполнения. Такой перевод естественен в современном русском языке и передаёт литургико-музыкальный контекст, хотя само слово «хор» в еврейском тексте прямо не названо.
- source_word: עַל
  choice: На
  rationale: 'В сочетании с обозначением инструментов предлог естественно передаёт способ музыкального исполнения: «на струнных инструментах».'
- source_word: נְגִינַת
  choice: струнных инструментах
  rationale: Форма указывает на музыку или сопровождение струнных инструментов; данный вариант ясен современному читателю и соответствует музыкальному контексту надписания.
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая родительная конструкция сохраняет традиционную форму надписания и не сводит многозначный еврейский предлог к однозначному утверждению об авторстве.
theological_decisions:
- issue: Значение предлога לְ в надписании לְדָוִד
  choice: Давида
  alternative: «Давидом» или «для Давида»
  rationale: Еврейская конструкция может указывать на авторство, принадлежность, связь или посвящение. Перевод не должен утверждать прямое авторство более категорично, чем исходный текст.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная форма музыкального надписания. Маркер сноски поставлен непосредственно после слова «Давида», к которому относится пояснение.
