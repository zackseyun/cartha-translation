lexical_decisions:
- source_word: כֵּן
  choice: Так
  rationale: Частица связывает стих с предшествующей молитвой и выраженной уверенностью, вводя следствие или решимость; «так» естественно сохраняет эту связь.
- source_word: אֲזַמְּרָה
  choice: я буду воспевать
  rationale: Форма глагола זמר обозначает пение, особенно хвалебное; «воспевать» передаёт и музыкальность, и направленность хвалы.
- source_word: שִׁמְךָ
  choice: Твоё имя
  rationale: Прямо сохраняет древнееврейское выражение, которое может подразумевать явленный характер и славу Бога, не сводя его к пояснительной перифразе.
- source_word: לָעַד
  choice: вовеки
  rationale: Передаёт идею непрекращающейся длительности; слово уместно в современном литературном русском и сохраняет возвышенный поэтический регистр псалма.
- source_word: לְשַׁלְּמִי
  choice: чтобы исполнять
  rationale: Глагол שלם в породе пиэль при слове «обеты» означает выполнить обязательство, буквально также «уплатить» его. «Исполнять» естественно по-русски и сохраняет смысл верности данному обету.
- source_word: נְדָרַי
  choice: свои обеты
  rationale: נדר — обычное обозначение религиозного обета; возвратное «свои» естественно соотносит обеты с говорящим.
- source_word: יוֹם יוֹם
  choice: изо дня в день
  rationale: Повтор существительного выражает постоянную регулярность; русское сочетание передаёт итеративный смысл и поэтический ритм.
