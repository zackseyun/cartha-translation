lexical_decisions:
- source_word: שִׁמְעָה
  choice: Услышь
  rationale: Повелительная форма глагола שׁמע, обращённая к Богу. «Услышь» естественно для русской молитвенной речи и сохраняет прямой образ слухового восприятия.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения к Богу; русское «Боже» ясно и естественно передаёт непосредственное молитвенное воззвание.
- source_word: רִנָּתִי
  choice: мой вопль
  rationale: Существительное רִנָּה может обозначать громкий, звонкий возглас, крик или радостное восклицание. В сочетании с «моей молитвой» контекст указывает на настойчивый молитвенный зов; «вопль» сохраняет его силу, не превращая его в песнь хвалы.
- source_word: הַקְשִׁיבָה
  choice: внемли
  rationale: Повелительная форма породы хифиль от קשׁב выражает просьбу внимательно услышать. «Внемли» точно и кратко передаёт усиленное внимание и уместно в современной возвышенной молитвенной речи.
- source_word: תְּפִלָּתִי
  choice: моей молитве
  rationale: Стандартное обозначение молитвы. Дательный падеж обусловлен управлением глагола «внимать» и сохраняет параллелизм стиха.
