  text: יָמִ֣ים עַל יְמֵי מֶ֣לֶךְ תּוֹסִ֑יף שְׁ֝נוֹתָ֗י/ו כְּמוֹ דֹ֥ר וָ/דֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/006.yaml
  text: May you add days to the days of the king[b][a]; may his years be like generation after generation.
translation:
  language: ru
  text: Прибавь дни к дням царя[a]; пусть его годы длятся поколение за поколением[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты прибавишь дни к дням царя; его годы будут длиться поколение за поколением». Еврейскую глагольную форму можно понимать не как просьбу, а как утверждение о будущем.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «как поколение и поколение» — еврейское выражение, обозначающее непрерывную смену поколений.'
    reason: lexical_alternative
  - marker: c
    text: 'В написанном еврейском тексте: «мои годы»; традиционное чтение: «его годы».'
    reason: textual_variant
lexical_decisions:
- source_word: יָמִים עַל יְמֵי מֶלֶךְ
  choice: дни ко дням царя
  rationale: Сохраняет еврейский образ прибавления дней и параллелизм с «годами», оставаясь понятным по-русски.
- source_word: תּוֹסִיף
  choice: прибавь
  rationale: Hифиль глагола יסף означает «прибавлять, увеличивать». В молитвенном контексте форма понята как просьба к Богу; возможное чтение как будущего времени отмечено в сноске.
- source_word: שְׁנוֹתָיו
  choice: годы его
  rationale: Местоименный суффикс мужского рода относится к царю; такой порядок слов поддерживает возвышенный поэтический регистр.
- source_word: דֹר וָדֹר
  choice: из поколения в поколение
  rationale: Передаёт устойчивое значение последовательной смены поколений естественным современным русским выражением.
theological_decisions:
- issue: Просьба о долголетии царя или утверждение о будущем
  choice: 'Форма передана как молитвенная просьба: «Прибавь…; пусть…»'
  alternative: «Ты прибавишь…; годы его будут…»
  rationale: Еврейский имперфект допускает будущее изъявительное значение, однако молитвенный контекст псалма благоприятствует волитивному прочтению. Неоднозначность сохранена в сноске.
- issue: Характер обещанного царю долголетия
  choice: «пусть годы его длятся из поколения в поколение»
  alternative: 'Буквально: «годы его — как поколение и поколение»'
  rationale: Перевод сохраняет образ продолжительности через череду поколений, не уточняя, следует ли понимать его как поэтическую гиперболу, династическую преемственность или вечное царствование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Еврейский образ «дни ко дням» сохранён; во второй строке добавлен естественный для русского глагол «длятся», подразумеваемый безглагольной еврейской конструкцией.
