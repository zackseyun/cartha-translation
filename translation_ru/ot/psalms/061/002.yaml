id: PSA.61.2
reference: Psalms 61:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: מִ/קְצֵ֤ה הָ/אָ֨רֶץ אֵלֶ֣י/ךָ אֶ֭קְרָא בַּ/עֲטֹ֣ף לִבִּ֑/י בְּ/צוּר יָר֖וּם מִמֶּ֣/נִּי תַנְחֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/061/002.yaml
  text: From the end of the earth I call to you when my heart grows faint[b][a]; lead me to a rock higher than I.
translation:
  language: ru
  text: С края земли взываю к Тебе, когда изнемогает моё сердце[a]. Веди меня к скале, что выше меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда моё сердце подавлено».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к скале, слишком высокой для меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְצֵה הָאָרֶץ
  choice: С края земли
  rationale: קָצֶה обозначает край или предел. Сочетание «с края земли» сохраняет пространственный образ крайней удалённости и естественно звучит в современной русской поэзии.
- source_word: אֵלֶיךָ אֶקְרָא
  choice: взываю к Тебе
  rationale: קרא может означать «звать», «взывать», «кричать». «Взываю» передаёт направленную к Богу молитвенную настойчивость, оставаясь понятным и уместным в возвышенной поэтической речи.
- source_word: בַּעֲטֹף לִבִּי
  choice: когда изнемогает моё сердце
  rationale: עטף здесь описывает ослабление, угасание сил или состояние подавленности. «Изнемогает моё сердце» сохраняет образ утраты внутренних сил, не сводя его только к определённой эмоции.
- source_word: בְּצוּר
  choice: к скале
  rationale: צוּר — конкретный образ скалы, несущий оттенки высоты, устойчивости и убежища. Предлог и глагол направления естественно передаются сочетанием «веди меня к скале».
- source_word: יָרוּם מִמֶּנִּי
  choice: что выше меня
  rationale: רוּם означает «быть высоким, возвышаться», а מִמֶּנִּי допускает прямое сравнение. Перевод сохраняет образ и его неоднозначность, не утверждая прямо, что скала недоступна.
- source_word: תַנְחֵנִי
  choice: веди меня
  rationale: Каузативная форма נחה означает «вести, направлять». «Веди меня» естественно выражает продолжающуюся просьбу о руководстве к названной цели.
theological_decisions:
- issue: Метафорический смысл скалы
  choice: Сохранить конкретный образ «скалы», не поясняя в основном тексте, что это Бог или безопасное убежище.
  alternative: «Веди меня в безопасное место» или «веди меня в убежище».
  rationale: Еврейский текст использует конкретное слово צוּר. Сохранение метафоры удерживает поэтическую и богословскую многозначность, не подменяя образ толкованием.
- issue: Смысл выражения יָרוּם מִמֶּנִּי
  choice: 'Передать как простое сравнение: «что выше меня».'
  alternative: «К скале, для меня недосягаемой» или «к скале, слишком высокой для меня».
  rationale: Фраза буквально указывает на высоту скалы относительно говорящего; значение недоступности возможно, но не обязательно, поэтому оно вынесено в примечание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. «Взываю» и образ скалы сохраняют достоинство и поэтичность, тогда как синтаксис остаётся простым и понятным. Местоимение «Тебе» написано с прописной буквы как уважительное обращение к Богу.
