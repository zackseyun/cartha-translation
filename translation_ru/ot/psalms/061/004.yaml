    reason: lexical_alternative
lexical_decisions:
- source_word: אָג֣וּרָה
  choice: Да поселюсь я
  rationale: Когортатив Qal, 1-е лицо единственного числа, выражает сильное желание или решимость; конструкция с «да» сохраняет молитвенно-волевой оттенок.
- source_word: בְ֭אָהָלְךָ
  choice: в Твоём шатре
  rationale: אָהֶל буквально означает «шатёр» и может вызывать образ Божьего святилища или места Его пребывания, не конкретизируя его как храм.
- source_word: עוֹלָמִים
  choice: навеки
  rationale: Форма множественного числа усиливает идею продолжительности; «навеки» естественно передаёт её в возвышенном, но современном русском регистре.
- source_word: אֶחֱסֶה
  choice: укроюсь
  rationale: Глагол חסה означает искать или находить убежище. В параллели с когортативом он допускает волевой оттенок; «укроюсь» кратко и естественно сохраняет образ защиты.
- source_word: בְסֵתֶר
  choice: под покровом
  rationale: סֵתֶר обозначает скрытое, защищённое место. В сочетании с крыльями русское «под покровом» естественно передаёт одновременно укрытие и защиту.
- source_word: כְּנָפֶיךָ
  choice: Твоих крыльев
  rationale: Сохраняется конкретная древнееврейская метафора Божьей защиты.
- source_word: סֶּלָה
  choice: Села
  rationale: Точное значение литургического или музыкального термина неизвестно, поэтому он передан традиционной транслитерацией.
theological_decisions:
- issue: Образ Божьего шатра
  choice: Сохранить «Твоём шатре» без истолковывающей замены.
  alternative: «в Твоей скинии», «в Твоём святилище» или «в Твоей обители»
  rationale: Еврейский текст использует конкретное слово «шатёр». Оно может подразумевать святилище и Божье присутствие, но перевод не должен устранять образ или чрезмерно уточнять его.
- issue: Модальность двух глагольных форм
  choice: 'Передать первую строку как желание, а вторую — как допускающую решимость: «Да поселюсь я… укроюсь».'
  alternative: «Я поселюсь… я укроюсь» или «Позволь мне жить… позволь мне укрыться»
  rationale: Когортатив אָגוּרָה явно выражает волю или желание; последующий имперфект אֶחֱסֶה в параллельной молитвенной строке может разделять этот оттенок, но также звучать как намерение. Различие форм сохранено без жёсткого устранения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятой русской библейской традиции. Конкретные образы «шатра» и «крыльев» сохранены.
