base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/007.yaml
  text: Nevertheless[a], you will die like men[b], and fall like one of the princes.
translation:
  language: ru
  text: Но вы умрёте, как люди[a], и падёте, как один из правителей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как Адам», если здесь имеется в виду первый человек, а не люди вообще.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «князья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָכֵן
  choice: Но
  rationale: Передаёт подчёркнутый противительный переход от провозглашённого высокого положения адресатов к приговору о смертности; по-русски кратко и естественно.
- source_word: כְּאָדָם
  choice: как люди
  rationale: אָדָם здесь естественно понимать собирательно — как указание на обычную человеческую смертность; русский множественный оборот согласуется с множественным адресатом. Возможная отсылка к Адаму сохранена в сноске.
- source_word: תְּמוּתוּן
  choice: вы умрёте
  rationale: Форма 2-го лица множественного числа выражает предстоящее событие или приговор; современное будущее время передаёт её прямо.
- source_word: וּכְאַחַד
  choice: и … как любой из
  rationale: אַחַד с определённым множественным существительным может означать одного представителя группы; «любой из» естественно передаёт, что участь постигнет каждого из адресатов, не уточняя конкретного правителя.
- source_word: הַשָּׂרִים
  choice: правителей
  rationale: שַׂר обозначает князя, правителя или высокопоставленного начальника. «Правители» здесь ясно и широко передаёт властный статус; «князей» отмечено как допустимая альтернатива.
- source_word: תִּפֹּלוּ
  choice: падёте
  rationale: Сохраняет образ נפל и его смысл гибели или низвержения под судом, не заменяя метафору толкованием.
theological_decisions:
- issue: Значение אָדָם в כְּאָדָם
  choice: собирательное «люди»
  alternative: «Адам», то есть возможная отсылка к первому человеку
  rationale: Контекст противопоставляет названный ранее возвышенный статус адресатов их общей с людьми смертности. Однако форма אָדָם допускает прочтение как имени первого человека, поэтому эта неоднозначность не устранена, а вынесена в сноску.
- issue: Значение שָׂרִים
  choice: «правители»
  alternative: «князья»
  rationale: Оба варианта лексически возможны. «Правители» понятнее современному читателю и не предполагает наследственного титула, тогда как «князья» сохраняет традиционный оттенок.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественный судебный приговор. Сохранены параллелизм двух строк, множественное обращение и метафора падения. Все маркеры сносок стоят непосредственно при соответствующих выражениях.
