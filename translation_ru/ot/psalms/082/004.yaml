lexical_decisions:
- source_word: פַּלְּטוּ
  choice: Спасайте
  rationale: Форма повелительного наклонения во множественном числе от פלט призывает активно вывести уязвимых из опасности; «спасайте» естественно передаёт настойчивость призыва.
- source_word: דַל
  choice: бедного
  rationale: דַּל может обозначать бедного, слабого или социально бесправного. В паре с אֶבְיוֹן и в контексте правосудия «бедного» хорошо передаёт социально-экономическую уязвимость, а иной смысл отмечен в сноске.
- source_word: אֶבְיוֹן
  choice: нуждающегося
  rationale: Слово обозначает человека, испытывающего нужду или лишения. «Нуждающегося» сохраняет отличие от דַל и естественно звучит по-русски.
- source_word: מִיַּד
  choice: из руки
  rationale: Сохранён еврейский образ руки как власти и контроля; выражение понятно в русском библейском и литературном контексте.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Субстантивированное прилагательное во множественном числе обозначает нравственно виновных притеснителей; «нечестивых» сохраняет этическую силу слова и не добавляет указания на пол.
- source_word: הַצִּילוּ
  choice: избавляйте
  rationale: Повелительная форма множественного числа от נצל выражает освобождение от опасности или чужой власти. «Избавляйте» сохраняет второй, параллельный призыв, не сливая его с первым.
theological_decisions:
- issue: Передача параллельных повелений без сглаживания поэтической силы
  choice: 'Сохранить два согласованных повеления: «Спасайте… избавляйте…»'
  alternative: 'Объединить их в одно: «Спасайте бедного и нуждающегося из руки нечестивых»'
  rationale: В еврейском тексте стоят два параллельных императива, усиливающих призыв защищать уязвимых; сохранение обоих передаёт поэтическую структуру и нравственную настойчивость.
- issue: Число местоименного дополнения при коллективно понимаемых существительных единственного числа
  choice: «их»
  alternative: «его»
  rationale: דַל и אֶבְיוֹן стоят в единственном числе как обозначения категорий уязвимых людей, тогда как רְשָׁעִים — во множественном. Русское «их» естественно выражает коллективный смысл, не превращая стих в обращение об одном конкретном человеке.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Сохранены параллелизм двух повелений и прозрачный образ «из руки»; формулировка понятна широкому читателю.
