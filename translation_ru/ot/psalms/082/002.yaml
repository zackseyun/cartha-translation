  text: עַד מָתַ֥י תִּשְׁפְּטוּ עָ֑וֶל וּ/פְנֵ֥י רְ֝שָׁעִ֗ים תִּשְׂאוּ סֶֽלָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/002.yaml
  text: How long will you judge unjustly and show partiality to the wicked? Selah[a]
translation:
  language: ru
  text: Доколе вы будете судить несправедливо и проявлять пристрастие к нечестивым? Села.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднимать лицо нечестивых» — еврейская идиома со значением «оказывать благоволение, проявлять пристрастие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד מָתַי
  choice: Доколе
  rationale: Устойчивый русский вопрос с оттенком упрёка; передаёт продолжительность осуждаемого действия и уместен в возвышенной поэтической речи.
- source_word: תִּשְׁפְּטוּ
  choice: будете судить
  rationale: Имперфект во риторическом вопросе выражает продолжающееся действие; русская конструкция «доколе вы будете» естественно передаёт этот смысл.
- source_word: עָוֶל
  choice: несправедливо
  rationale: Существительное употреблено обстоятельственно и характеризует неправедный способ суда; наречие ясно сохраняет судебный смысл.
- source_word: וּפְנֵי רְשָׁעִים תִּשְׂאוּ
  choice: и проявлять пристрастие к нечестивым
  rationale: Буквально «поднимать лицо нечестивых» — идиома благоволения или предпочтения. В судебном контексте «проявлять пристрастие» точно передаёт осуждаемое лицеприятие.
- source_word: רְשָׁעִים
  choice: нечестивым
  rationale: Передаёт нравственно-судебную категорию виновных и порочных людей, не сужая значение до одного конкретного преступления.
- source_word: סֶלָה
  choice: Села
  rationale: Сохранена традиционная транслитерация, поскольку точное значение и литургическая функция термина остаются неясными.
theological_decisions:
- issue: Судебная идиома благоволения к нечестивым
  choice: проявлять пристрастие к нечестивым
  alternative: благоволить к нечестивым; поднимать лицо нечестивых
  rationale: Выбранная формулировка явно передаёт осуждение предвзятого суда, но не добавляет частных богословских толкований; буквальный образ сохранён в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. «Доколе» уместно для псалма и остаётся понятным; синтаксис прост и естественен.
