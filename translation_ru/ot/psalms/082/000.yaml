lexical_decisions:
- source_word: מִזְמוֹר לְאָסָף
  choice: Псалом Асафа
  rationale: Естественная и традиционно узнаваемая передача заголовка; конструкция допускает связь псалма с Асафом без уточнения характера этой связи.
- source_word: נִצָּב
  choice: встал
  rationale: Передаёт совершенную форму глагола со значением занять место или предстать; в контексте это торжественная поза председательствующего судьи.
- source_word: בַּעֲדַת אֵל
  choice: в собрании Божьем
  rationale: Сохраняет буквальную связь עֲדַת с собранием и передаёт אֵל как определение принадлежности, не конкретизируя состав собрания.
- source_word: בְּקֶרֶב אֱלֹהִים
  choice: среди богов
  rationale: Сохраняет множественное значение אֱלֹהִים, подсказанное предлогом «среди», и не снимает намеренно оставленную в тексте неоднозначность.
- source_word: יִשְׁפֹּט
  choice: вершит суд
  rationale: В данном судебном контексте выражение естественнее простого «судит» и может передавать действие, представленное как происходящее в сцене.
theological_decisions:
- issue: Кого обозначает אֱלֹהִים во второй строке
  choice: боги
  alternative: божественные существа; человеческие судьи или правители
  rationale: Основной текст прозрачно передаёт форму множественного числа и сохраняет напряжение между единым Богом-судьёй и участниками собрания; примечание сообщает основные варианты понимания без догматического разрешения.
- issue: Значение выражения עֲדַת אֵל
  choice: собрание Божье
  alternative: божественное собрание
  rationale: Формулировка «собрание Божье» ближе к синтаксису еврейского текста и не предрешает, является ли собрание небесным советом или иной судебной ассамблеей.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным судебным регистром. Заголовок сохранён отдельным предложением; местоимение «Он» использовано для ясного соотнесения с Богом.
