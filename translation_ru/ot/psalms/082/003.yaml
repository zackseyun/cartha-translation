  yaml_path: translation/ot/psalms/082/003.yaml
  text: Defend the weak and the fatherless; vindicate the afflicted and the poor.
translation:
  language: ru
  text: Защищайте слабого и сироту, отстаивайте права угнетённого и бедного.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁפְטוּ
  choice: защищайте
  rationale: В данном призыве к справедливому суду глагол означает не просто вынесение решения, а практическую защиту прав уязвимых; перевод сохраняет повелительную форму множественного числа.
- source_word: דַל
  choice: слабого
  rationale: Слово обозначает слабого, беспомощного или социально незащищённого человека; «слабого» кратко сохраняет широту значения.
- source_word: יָתוֹם
  choice: сироту
  rationale: Прямое и естественное соответствие еврейскому обозначению ребёнка, лишённого отцовской и социальной защиты.
- source_word: הַצְדִּיקוּ
  choice: отстаивайте права
  rationale: Порода hifil от צדק здесь призывает признать правоту и обеспечить справедливое решение; выражение естественно передаёт судебно-правовой смысл, не сводя его к абстрактному «оправдывайте».
- source_word: עָנִי
  choice: угнетённого
  rationale: Слово может означать страдающего, униженного или притесняемого; в контексте неправедного суда «угнетённый» передаёт социальную уязвимость.
- source_word: רָשׁ
  choice: бедного
  rationale: Прямое соответствие слову, обозначающему неимущего человека.
theological_decisions:
- issue: Характер повеления судьям
  choice: Передать стих как требование активно защищать уязвимых и обеспечивать им справедливость.
  alternative: Буквальное «судите слабого и сироту; оправдывайте угнетённого и бедного».
  rationale: Контекст псалма обращён к тем, кто вершит суд. Выбранные выражения раскрывают судебный смысл, не добавляя конфессионального толкования и не превращая משפט в общее проявление доброты.
translation_notes:
  register: Современный литературный русский язык; параллелизм двух повелений сохранён. Формулировка торжественная, но понятная, без архаизмов и канцелярской тяжеловесности.
