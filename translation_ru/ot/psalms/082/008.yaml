review_pass:
  verdict: approve
  source_fidelity: Текст точно передаёт два императива («Восстань… суди»), прямое обращение к Богу, всемирный смысл «земли» в связи со «всеми народами» и мотивировку כִּי. «Наследуешь все народы» сохраняет образ נחל, включая его будущую форму; сноска уместно отмечает смысл вступления во владение. Русское прямое дополнение идиоматично передаёт универсальный охват выражения בְּכָל־הַגּוֹיִם, не создавая ложной локализации.
  naturalness: Фраза краткая, ясная и естественная для современного литературного русского в молитвенно-поэтическом регистре. «Восстань, Боже» является понятной возвышенной формой и хорошо передаёт настоятельный призыв «Rise up». «Ведь» даёт естественную причинную связь без ненужной архаизации.
  terminology: «Боже» корректно передаёт обращение; «суди» сохраняет как судебный, так и царственный диапазон שׁפט. «Наследуешь» точно сохраняет образ наследования/обретения во владение и не подменяет его исключительно абстрактной собственностью. Прописное «Ты» последовательно соответствует избранному молитвенному регистру.
