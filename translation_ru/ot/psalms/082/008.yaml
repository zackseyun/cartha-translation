source:
  edition: WLC
  text: קוּמָ֣/ה אֱ֭לֹהִים שָׁפְטָ֣/ה הָ/אָ֑רֶץ כִּֽי אַתָּ֥ה תִ֝נְחַ֗ל בְּ/כָל הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/008.yaml
  text: Rise up[a], O God; judge the earth[b], for you will inherit all the nations.
translation:
  language: ru
  text: Восстань, Боже, суди землю, ведь Ты наследуешь все народы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь Ты будешь владеть всеми народами».'
    reason: Лексема נחל может обозначать как получение наследия, так и вступление во владение; форма имперфекта допускает явное будущее прочтение.
lexical_decisions:
- source_word: קוּמָה
  choice: Восстань
  rationale: Повелительная форма קום выражает настоятельный призыв к Богу вмешаться; «восстань» естественно для возвышенной современной молитвенной речи.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения передаёт прямое обращение к единственному Богу, что ясно из форм единственного числа.
- source_word: שָׁפְטָה
  choice: суди
  rationale: Сохраняет судебный и царственный смысл שׁפט, не сужая его до одного лишь управления или оправдания.
- source_word: הָאָרֶץ
  choice: землю
  rationale: Параллель со «всеми народами» указывает на всемирный, а не местный смысл.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание просьбы и естественно связывает обе части стиха в современном русском языке.
- source_word: אַתָּה
  choice: Ты
  rationale: Явно выраженное местоимение в еврейском подчёркивает, что именно Бог обладает этим правом; прописная буква соответствует принятому русскому молитвенному регистру, не добавляя нового смысла.
- source_word: תִנְחַל
  choice: наследуешь
  rationale: Будущая форма נחל сохраняет образ получения во владение как наследия; контекст допускает оттенок «владеешь/получишь во владение», отмеченный в сноске.
- source_word: בְּכָל הַגּוֹיִם
  choice: все народы
  rationale: При נחל предлог בְ идиоматически передаёт область или объект владения; по-русски естественен прямой объект «все народы».
theological_decisions:
- issue: Отношение Бога к народам в תִנְחַל בְּכָל הַגּוֹיִם
  choice: ведь Ты наследуешь все народы
  alternative: ведь Ты владеешь всеми народами
  rationale: Основной вариант сохраняет метафору наследия и универсальное право Бога на народы, не превращая её лишь в отвлечённое утверждение о собственности. Сноска указывает смысловую возможность владения.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-поэтической речи. Краткие повелительные формы сохраняют настойчивость оригинала; архаизмы сведены к уместному и понятному «восстань».
