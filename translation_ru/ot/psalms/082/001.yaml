source:
  edition: WLC
  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֗ים נִצָּ֥ב בַּ/עֲדַת אֵ֑ל בְּ/קֶ֖רֶב אֱלֹהִ֣ים יִשְׁפֹּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/001.yaml
  text: A psalm of Asaph[a]. God stands in the divine assembly; in the midst of the gods he judges.
translation:
  language: ru
  text: Псалом Асафа. Бог стоит в Божьем собрании; среди богов[a] Он вершит суд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «божественных существ». Некоторые понимают здесь слово «боги» как указание на человеческих судей или правителей.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Обычное и точное русское обозначение жанра в надписаниях псалмов.
- source_word: לְאָסָף
  choice: Асафа
  rationale: Родительный падеж естественно передаёт связь псалма с Асафом, не уточняя, идёт ли речь об авторстве, принадлежности или предназначении.
- source_word: אֱלֹהִים (первое употребление)
  choice: Бог
  rationale: Единственное число причастия נִצָּב и глагольная форма далее показывают, что это единственный субъект — Бог Израиля.
- source_word: נִצָּב
  choice: стоит
  rationale: Причастие изображает Бога стоящим в обстановке суда; настоящее время сохраняет статичность и непосредственность образа.
- source_word: בַּעֲדַת־אֵל
  choice: в Божьем собрании
  rationale: Передаёт собрание, принадлежащее Богу или связанное с Ним, и не сужает значение до более толковательного «небесного совета».
- source_word: בְּקֶרֶב
  choice: среди
  rationale: Естественно выражает положение Бога внутри группы и сохраняет смысл еврейского оборота.
- source_word: אֱלֹהִים (второе употребление)
  choice: богов
  rationale: Здесь слово имеет множественное значение и обозначает группу, среди которой Бог совершает суд. Прямой перевод сохраняет лексическую и богословскую напряжённость текста.
- source_word: יִשְׁפֹּט
  choice: вершит суд
  rationale: Передаёт судебный смысл глагола שפט и поддерживает торжественный, но понятный современному читателю регистр.
theological_decisions:
- issue: Кого обозначает второе אֱלֹהִים
  choice: «богов» — участников божественного или небесного собрания, находящихся под Божьим судом
  alternative: «божественных существ»; по другому пониманию — человеческих судей или правителей
  rationale: Грамматика отличает первого אֱלֹהִים как единственного субъекта от второго употребления, обозначающего группу. Контекст собрания благоприятствует пониманию небесных существ, однако прямое «богов» лучше сохраняет формулировку и напряжённость оригинала; основные альтернативы отмечены в сноске.
- issue: Значение עֲדַת־אֵל
  choice: «Божье собрание»
  alternative: «божественное собрание»; «совет Бога»
  rationale: Выбранный вариант формально и естественно передаёт сочетание, не решая сверх необходимого, является ли это обозначением небесного совета или собрания, принадлежащего Богу.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формулировка краткая и судебная по образности; неоднозначность слова אֱלֹהִים сохранена в основном тексте и пояснена в сноске.
