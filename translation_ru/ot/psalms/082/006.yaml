  yaml_path: translation/ot/psalms/082/006.yaml
  text: I said, “You are gods, and all of you are sons of the Most High.”
translation:
  language: ru
  text: 'Я сказал: «Вы — боги, и все вы — сыны Всевышнего».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲנִי אָמַרְתִּי
  choice: Я сказал
  rationale: Прямо передаёт местоимение первого лица и перфект глагола אמר; порядок слов по-русски естественен.
- source_word: אֱלֹהִים אַתֶּם
  choice: Вы — боги
  rationale: Сохраняет буквальное и контекстуально напряжённое обозначение אֱלֹהִים во множественном числе, не подменяя его толкованием вроде «судьи».
- source_word: וּבְנֵי עֶלְיוֹן
  choice: и … сыны Всевышнего
  rationale: Передаёт союз ו, конструкцию «сыны» и божественный титул עֶלְיוֹן традиционным, понятным русским соответствием.
- source_word: כֻּלְּכֶם
  choice: все вы
  rationale: Сохраняет обращение ко всей группе и естественное русское ударное построение.
theological_decisions:
- issue: Кого обозначает אֱלֹהִים («боги»)
  choice: Сохранено «боги» без поясняющей подмены.
  alternative: «судьи», «божественные существа» или иное интерпретирующее обозначение
  rationale: Сам стих не устраняет референтную неоднозначность; перевод должен сохранять её и богословское напряжение текста.
- issue: Значение выражения «сыны Всевышнего»
  choice: Сохранён исходный родственный образ.
  alternative: «дети Всевышнего» или «принадлежащие Всевышнему»
  rationale: Формулировка «сыны» точно отражает בני и не разворачивает метафору в доктринальное толкование.
translation_notes:
  register: Современный литературный русский язык с торжественной библейской интонацией. Тире подчёркивает именную конструкцию «вы — боги»; союз «и» сохранён по еврейскому тексту.
