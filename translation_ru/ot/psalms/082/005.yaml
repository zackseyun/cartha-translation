id: PSA.82.5
reference: Psalms 82:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לֹ֤א יָֽדְע֨וּ וְ/לֹ֥א יָבִ֗ינוּ בַּ/חֲשֵׁכָ֥ה יִתְהַלָּ֑כוּ יִ֝מּ֗וֹטוּ כָּל מ֥וֹסְדֵי אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/082/005.yaml
  text: They do not know[a], and they do not understand; they walk about in darkness[b]; all the foundations of the earth are shaken.
translation:
  language: ru
  text: Не знают они и не понимают; во тьме бродят; колеблются все основания земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все основания страны». Еврейское слово אָרֶץ может означать как землю в широком смысле, так и страну.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָדְעוּ
  choice: не знают они
  rationale: Перфект ידע в данном поэтическом контексте передаёт сохраняющееся состояние неведения и образует параллель со следующим глаголом; настоящее время естественно по-русски.
- source_word: וְלֹא יָבִינוּ
  choice: и не понимают
  rationale: Hiphil בין означает «понимать, различать». «Не понимают» сохраняет смысл и параллелизм с «не знают».
- source_word: בַּחֲשֵׁכָה
  choice: во тьме
  rationale: Предлог בְּ с существительным обозначает пребывание в сфере тьмы; «во тьме» естественно и сохраняет поэтический образ.
- source_word: יִתְהַלָּכוּ
  choice: бродят
  rationale: Hitpael הלך может обозначать продолжающееся хождение туда и сюда. «Бродят» кратко передаёт повторность и отсутствие верного направления, не превращая образ в явное толкование поведения.
- source_word: יִמּוֹטוּ
  choice: колеблются
  rationale: 'Niphal מוט выражает утрату устойчивости: колебаться, шататься, сдвигаться. «Колеблются» сохраняет незавершённость образа и не утверждает окончательного обрушения.'
- source_word: כָּל מוֹסְדֵי אָרֶץ
  choice: все основания земли
  rationale: מוֹסְדֵי — «основания, устои»; אָרֶץ допускает значения «земля» и «страна». В широком поэтическом контексте выбрано «земли», при этом локальная возможность отмечена в сноске.
theological_decisions:
- issue: Масштаб значения אָרֶץ и образ утраты устойчивости
  choice: «основания земли» — образ мирового порядка, теряющего устойчивость
  alternative: «основания страны» — более локальное прочтение
  rationale: Контекст псалма связывает несправедливость властителей с устойчивостью всего порядка; однако многозначность אָרֶץ не устраняется и отражена в примечании.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим ритмом. Инверсия «не знают они» подчёркивает субъект и поддерживает параллелизм. Точка с запятой сохраняет последовательность трёх взаимосвязанных утверждений.
