lexical_decisions:
- source_word: כֻּלּוֹ
  choice: Все они
  rationale: Передаёт собирательное значение формы и естественно обозначает всю упомянутую группу.
- source_word: סָג
  choice: уклонились
  rationale: Глагол выражает отклонение от должного пути; русский вариант сохраняет нравственный смысл, не уточняя его сверх текста.
- source_word: יַחְדָּו
  choice: все вместе
  rationale: Передаёт совместность и одновременно подчёркивает всеобщий охват в поэтическом параллелизме.
- source_word: נֶאֱלָחוּ
  choice: растлились
  rationale: Форма обозначает, что они стали нравственно испорченными или осквернёнными. «Растлились» сохраняет этический смысл и возвышенный поэтический регистр.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: нет делающего добро
  rationale: Сохраняет экзистенциальное отрицание и причастную конструкцию, оставаясь понятным в торжественной поэтической речи.
- source_word: גַּם אֶחָד
  choice: ни одного
  rationale: 'Кратко и emphатически передаёт усиленное отрицание: исключений нет.'
theological_decisions:
- issue: Объём нравственного обвинения в контексте псалма
  choice: 'Сохранить всеобщую формулировку: «Все они… нет… ни одного».'
  alternative: Ограничить обвинение только непосредственно упомянутой группой злодеев.
  rationale: Еврейский текст использует последовательность всеохватных выражений. Перевод сохраняет эту поэтическую универсальность, но не разворачивает её в более широкую догматическую систему.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим звучанием. Синтаксический параллелизм оригинала сохранён; лексика понятна современному читателю, хотя «растлились» намеренно несколько возвышенно и передаёт нравственную испорченность.
