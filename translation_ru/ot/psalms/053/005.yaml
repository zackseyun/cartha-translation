source:
  edition: WLC
  text: שָׁ֤ם פָּֽחֲדוּ פַחַד֮ לֹא הָ֪יָה֫ פָ֥חַד כִּֽי אֱלֹהִ֗ים פִּ֭זַּר עַצְמ֣וֹת חֹנָ֑/ךְ הֱ֝בִשֹׁ֗תָה כִּֽי אֱלֹהִ֥ים מְאָסָֽ/ם׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/005.yaml
  text: There they were in great fear[a], where there was no fear; for God scattered the bones of the one encamping against you. You put them to shame[c][b], for God rejected them.
translation:
  language: ru
  text: Там они были охвачены великим страхом[a], где не было страха, ибо Бог рассеял кости осаждавшего тебя[b]. Ты посрамил их[c], ибо Бог отверг их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «они устрашились страхом». В еврейском тексте однокоренные глагол и существительное употреблены вместе для усиления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «располагавшегося станом вокруг тебя» или «ставшего станом против тебя». В этом контексте имеется в виду вражеский стан, то есть осаждающий.'
    reason: lexical_alternative
  - marker: c
    text: 'Здесь повествование о Боге неожиданно сменяется прямым обращением к Нему: «Ты посрамил их», после чего текст вновь говорит о Боге в третьем лице. Эта поэтическая смена сохранена в переводе.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Там
  rationale: Простое наречие места сохраняет краткость и резкое начало еврейской поэтической строки.
- source_word: פָּחֲדוּ פַחַד
  choice: были охвачены великим страхом
  rationale: Однокоренная глагольно-именная конструкция усиливает значение. По-русски это естественно передаётся сочетанием «великий страх», тогда как буквальное «убоялись страхом» звучало бы архаично и неестественно.
- source_word: לֹא הָיָה פַחַד
  choice: где не было страха
  rationale: Близкая к форме источника передача сохраняет необычность и возможную смысловую напряжённость строки, не превращая её однозначно в пояснение «нечего было бояться».
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание или пояснение; «ибо» уместно в достоинственном поэтическом регистре и остаётся понятным современному читателю.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Обычная передача грамматически множественной формы, обозначающей единого Бога Израиля.
- source_word: פִּזַּר
  choice: рассеял
  rationale: Глагол выражает энергичное разбрасывание; «рассеял» ясно передаёт картину полного поражения врага.
- source_word: עַצְמוֹת
  choice: кости
  rationale: Прямой эквивалент сохраняет конкретный и суровый образ погибшего войска.
- source_word: חֹנָךְ
  choice: осаждавшего тебя
  rationale: Причастие от חנה буквально связано с расположением лагерем. В контексте рассеянных костей речь идёт о враждебном стане; «осаждавшего» естественно выражает этот смысл, не уточняя личность адресата.
- source_word: הֱבִשֹׁתָה
  choice: Ты посрамил их
  rationale: Форма лучше всего понимается как каузатив со значением «подвергнуть позору» и как обращение к Богу во втором лице мужского рода. Прошедшее время соответствует контексту совершённого поражения.
- source_word: מְאָסָם
  choice: отверг их
  rationale: Глагол מאס обозначает отвержение, иногда с оттенком презрения. «Отверг» передаёт основной судебно-оценочный смысл без излишнего эмоционального усиления.
theological_decisions:
- issue: Резкая смена лица внутри стиха
  choice: 'Сохранён переход от повествования о Боге в третьем лице к прямому обращению: «Ты посрамил их», а затем обратно к третьему лицу.'
  alternative: 'Сгладить переход: «Бог посрамил их»; либо понимать второе лицо как обращение к Сиону или Иерусалиму.'
  rationale: Масоретский текст содержит форму второго лица мужского рода. Поэтическое прямое обращение к Богу сохраняет грамматику текста и не устраняет его намеренную резкость.
- issue: Значение חֹנָךְ
  choice: 'Враждебный смысл: «осаждавшего тебя».'
  alternative: 'Более буквально: «располагавшегося станом вокруг тебя» или «ставшего станом против тебя».'
  rationale: Упоминание рассеянных костей и последующего посрамления ясно указывает на вражеское окружение, хотя сам корень חנה означает просто расположение лагерем.
- issue: Смысл выражения «где не было страха»
  choice: Сохранена буквальная и несколько загадочная формулировка.
  alternative: Истолковать её как «хотя бояться было нечего» или «когда не было причины бояться».
  rationale: Еврейский текст не называет прямо ни причину, ни отсутствие причины для страха. Близкая передача сохраняет подлинную неоднозначность и связь с повтором слова «страх».
translation_notes:
  register: Современный литературный русский язык с достоинственным поэтическим звучанием. Синтаксическая необычность «где не было страха» сохранена ради образа и неоднозначности оригинала; архаизмы вроде «убоялись страхом» исключены.
