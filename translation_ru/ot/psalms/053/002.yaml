source:
  edition: WLC
  text: אֱֽלֹהִ֗ים מִ/שָּׁמַיִם֮ הִשְׁקִ֪יף עַֽל בְּנֵ֫י אָדָ֥ם לִ֭/רְאוֹת הֲ/יֵ֣שׁ מַשְׂכִּ֑יל דֹּ֝רֵ֗שׁ אֶת אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/002.yaml
  text: God looks down from heaven on the children of man to see whether there is anyone who has understanding[a], who seeks God.
translation:
  language: ru
  text: Бог с небес смотрит на сынов человеческих, чтобы увидеть, есть ли разумный, ищущий Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма грамматически множественного числа здесь обозначает единого Бога; контекст требует стандартного русского единственного числа.
- source_word: מִשָּׁמַיִם
  choice: с небес
  rationale: Русское «с небес» естественно передаёт еврейскую форму множественного числа и сохраняет возвышенный поэтический образ.
- source_word: הִשְׁקִיף
  choice: смотрит
  rationale: Глагол обозначает взгляд сверху вниз. В сочетании «с небес смотрит на» направление ясно из контекста, а настоящее время сохраняет поэтическую наглядность.
- source_word: בְּנֵי אָדָם
  choice: сынов человеческих
  rationale: Устойчивое и понятное русское библейское выражение передаёт буквальный образ и одновременно обозначает людей вообще.
- source_word: לִרְאוֹת הֲיֵשׁ
  choice: чтобы увидеть, есть ли
  rationale: Передаёт инфинитив цели и последующую вопросительно-экзистенциальную конструкцию без добавочного толкования.
- source_word: מַשְׂכִּיל
  choice: разумный
  rationale: Субстантивированное прилагательное естественно передаёт человека, обладающего разумением; слово включает нравственно-религиозную проницательность, а не только интеллект.
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: ищущий Бога
  rationale: Причастный оборот близко сохраняет форму и смысл еврейского причастия, выражающего направленность человека к Богу.
theological_decisions:
- issue: Значение אָדָם в выражении בְּנֵי אָדָם
  choice: сынов человеческих
  alternative: людей / рода человеческого
  rationale: Выбранный вариант сохраняет конкретный образ исходного выражения и его собирательное значение, не ограничивая речь мужчинами.
- issue: Связь מַשְׂכִּיל и דֹּרֵשׁ
  choice: есть ли разумный, ищущий Бога
  alternative: есть ли кто разумный и ищущий Бога
  rationale: Еврейский текст допускает понимание второго причастия как характеристики того же искомого человека. Причастный оборот сохраняет эту тесную связь и не вводит отдельную категорию людей.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Синтаксис остаётся ясным для обычного читателя; архаизмы вроде «взыскующий» и «воззрел» не используются.
