lexical_decisions:
- source_word: נָבָל
  choice: глупец
  rationale: В контексте это не просто человек с недостатком ума, а нравственно испорченный и отвергающий Бога; традиционное «глупец» сохраняет ёмкость библейского понятия.
- source_word: בְּלִבּוֹ
  choice: в своём сердце
  rationale: Сохранён древнееврейский образ сердца как средоточия внутренней мысли и расположения, а возвратное местоимение естественно связывает выражение с подлежащим.
- source_word: אֵין אֱלֹהִים
  choice: Нет Бога
  rationale: Краткая экзистенциальная формула естественно передаёт отрицание Бога в богословском контексте псалма.
- source_word: הִשְׁחִיתוּ
  choice: они развратились
  rationale: Форма множественного числа передаёт переход от единичного представителя к группе, а глагол выражает наступившую нравственную испорченность.
- source_word: וְהִתְעִיבוּ עָוֶל
  choice: и творят мерзкое беззаконие
  rationale: Передаётся сочетание глагола со значением мерзости и существительного עָוֶל со значением зла, неправды или беззакония; формулировка сохраняет оба смысловых компонента.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: нет делающего добро
  rationale: Причастная конструкция воспроизведена достаточно близко к еврейскому тексту и звучит в русском языке торжественно, но понятно.
theological_decisions:
- issue: Переход от единственного числа «глупец» к глаголам множественного числа
  choice: 'Сохранить переход: «Глупец говорит… Они развратились…»'
  alternative: Согласовать всё в единственном числе или обобщить всё во множественном числе
  rationale: Смена числа присутствует в масоретском тексте и риторически расширяет характеристику от типичного глупца до всего круга подобных людей.
- issue: Значение עָוֶל при глаголе וְהִתְעִיבוּ
  choice: «творят мерзкое беззаконие»
  alternative: «совершают мерзкую несправедливость» или «сделали свои дела мерзкими»
  rationale: Еврейское выражение допускает несколько способов синтаксического осмысления; основной текст передаёт нравственное зло без чрезмерного сужения до общественной несправедливости, а примечание сохраняет альтернативы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Сохранены образ «сердца», краткость отрицания и резкий переход от единственного числа к множественному.
