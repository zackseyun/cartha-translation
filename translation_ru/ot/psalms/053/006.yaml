base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/006.yaml
  text: Oh[a], that the salvation of Israel would come out of Zion! When God restores the fortunes of his people, let Jacob rejoice; let Israel be glad.
translation:
  language: ru
  text: О, если бы с Сиона пришло спасение Израиля! Когда Бог восстановит благополучие Своего народа[a], возрадуется Иаков, возвеселится Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вернёт из плена Свой народ» или «вернёт Свой пленённый народ». Еврейский оборот может обозначать восстановление после бедствия вообще, нередко включая возвращение из плена.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: О, если бы … пришло
  rationale: Еврейское сочетание выражает страстное пожелание, а не буквальный вопрос. Русская конструкция «О, если бы…» естественно передаёт этот оптативный смысл.
- source_word: מִצִּיּוֹן
  choice: с Сиона
  rationale: Предлог מִן указывает на источник; «с Сиона» — естественное русское обозначение происхождения ожидаемого спасения.
- source_word: יְשֻׁעוֹת יִשְׂרָאֵל
  choice: спасение Израиля
  rationale: Форма «спасения» морфологически множественная, но здесь естественно понимается как отвлечённое или усилительное множественное со значением избавления, предназначенного Израилю.
- source_word: בְּשׁוּב אֱלֹהִים שְׁבוּת עַמּוֹ
  choice: Когда Бог восстановит благополучие Своего народа
  rationale: בְּ с инфинитивом передаёт временное обстоятельство «когда», а сочетание שׁוּב שְׁבוּת обозначает поворот бедственного положения и восстановление; оно может включать возвращение из плена, но не ограничивается им.
- source_word: יָגֵל יַעֲקֹב
  choice: возрадуется Иаков
  rationale: Будущая форма естественно передаёт ожидаемое следствие Божьего восстановления и сохраняет возвышенный поэтический тон.
- source_word: יִשְׂמַח יִשְׂרָאֵל
  choice: возвеселится Израиль
  rationale: Отдельный русский глагол сохраняет смысловую близость и лёгкое лексическое разнообразие параллельных строк.
theological_decisions:
- issue: Значение оборота שׁוּב שְׁבוּת
  choice: восстановит благополучие Своего народа
  alternative: вернёт из плена Свой народ; возвратит пленников Своего народа
  rationale: Идиома шире буквального возвращения из плена и может означать восстановление после любого бедствия. Основной текст передаёт широкий смысл, а более буквальная возможность сохранена в примечании.
- issue: Наклонение יָגֵל и יִשְׂמַח
  choice: возрадуется … возвеселится
  alternative: да возрадуется … да возвеселится
  rationale: После временного придаточного эти формы естественно читаются как ожидаемый результат восстановления. При этом контекст пожелания допускает молитвенно-пожелательный оттенок, который не исключается формой будущего времени.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Начальное «О, если бы» передаёт сильное желание без архаической буквальности; пара «возрадуется — возвеселится» сохраняет поэтический параллелизм.
