  yaml_path: translation/ot/psalms/053/004.yaml
  text: Do not the workers of wickedness know—those who eat up my people as they eat bread? They do not call on God[a][b][c].
translation:
  language: ru
  text: Неужели не знают творящие беззаконие — пожирающие мой народ, словно едят хлеб? К Богу они не взывают.[a][b]
  philosophy: optimal-equivalence
  footnotes:
