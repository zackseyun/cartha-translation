    text: 'Буквально: «поедающие мой народ — едят хлеб». Сопоставление подразумевает, что они пожирают народ так же легко и обыденно, как едят хлеб.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «мой народ» может звучать как речь Бога или как слова псалмопевца; еврейский текст здесь прямо не называет говорящего.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יָדְעוּ
  choice: Неужели не знают
  rationale: Риторический вопрос предполагает утвердительный ответ; настоящее время естественно передаёт здесь общую характеристику.
- source_word: פֹּעֲלֵי אָוֶן
  choice: творящие беззаконие
  rationale: Сохраняет образ деятельного совершения зла и нравственную силу сочетания, оставаясь понятным в современном русском языке.
- source_word: אֹכְלֵי עַמִּי
  choice: поедающие мой народ
  rationale: Сохраняет прямую метафору поедания, описывающую хищническое угнетение народа.
- source_word: אָכְלוּ לֶחֶם
  choice: как едят хлеб
  rationale: 'Передаёт подразумеваемое сопоставление: народ поглощают так же обыденно и легко, как хлеб; буквальная синтаксическая шероховатость отмечена в сноске.'
- source_word: אֱלֹהִים לֹא קָרָאוּ
  choice: Они не призывают Бога
  rationale: Глагол קרא при אֱלֹהִים означает обращение к Богу, призывание Его; настоящее время соответствует общей характеристике нечестивых.
theological_decisions:
- issue: К кому относится выражение «мой народ»
  choice: Сохранить форму «мой народ», не уточняя говорящего
  alternative: Понимать это либо как прямую речь Бога, либо как слова псалмопевца
  rationale: Еврейский текст содержит суффикс первого лица единственного числа, но в самой строке не называет говорящего; перевод не устраняет эту подлинную неоднозначность.
