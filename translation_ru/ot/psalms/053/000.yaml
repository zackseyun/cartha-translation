  text: לַ/מְנַצֵּ֥חַ עַֽל מָחֲלַ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/053/000.yaml
  text: 'For the choir director: according to Mahalath[a]. A Maskil[b] of David[c].'
translation:
  language: ru
  text: Руководителю хора. На мотив «Махалат»[a]. Маскил[b] Давида[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, название мелодии либо музыкальный или литургический термин; точное значение слова «Махалат» неизвестно.
    reason: lexical_alternative
  - marker: b
    text: «Маскил» — специальный термин в заголовках псалмов; возможно, он обозначает назидательное или созерцательное произведение.
    reason: lexical_alternative
  - marker: c
    text: Еврейское выражение «Давида» может указывать на авторство, принадлежность, посвящение или связь со сборником.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов слово обозначает лицо, руководящее музыкальным исполнением; этот вариант ясен современному читателю и не привносит архаической окраски.
- source_word: עַל
  choice: На мотив
  rationale: В музыкальном заголовке предлог вводит указание на мелодию, способ или порядок исполнения. В сочетании с транслитерированным названием естественное русское «на мотив» передаёт вероятную функцию, а неопределённость самого термина отмечена в сноске.
- source_word: מָחֲלַת
  choice: Махалат
  rationale: Значение и референт термина неясны; транслитерация не навязывает предположительного перевода вроде «болезнь» и позволяет сохранить его как возможное название мелодии или музыкально-литургическое указание.
- source_word: מַשְׂכִּיל
  choice: Маскил
  rationale: Это специальный термин в заголовках псалмов с не вполне установленным значением; транслитерация избегает ложной точности.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русская родительная конструкция естественно передаёт принадлежность или связь, не сводя многозначность еврейского לְ к однозначному утверждению авторства.
theological_decisions:
- issue: Статус надписания и характер связи псалма с Давидом
  choice: Надписание переведено как часть еврейского текста, а לְדָוִד передано неоднозначной формой «Давида».
  alternative: «Написанный Давидом» либо вынесение надписания в непереводимый редакционный материал.
  rationale: WLC включает надписание в текст. Форма «Давида» сохраняет возможность авторства, принадлежности, посвящения или связи со сборником и не утверждает больше, чем допускает еврейская конструкция.
translation_notes:
  register: Современный литературный русский язык с краткой, традиционно торжественной формой надписания. Неясные технические термины транслитерированы и объяснены в сносках; все маркеры размещены непосредственно после поясняемых выражений.
