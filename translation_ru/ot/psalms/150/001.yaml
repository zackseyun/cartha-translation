source:
  edition: WLC
  text: הַ֥לְלוּ יָ֨הּ הַֽלְלוּ אֵ֥ל בְּ/קָדְשׁ֑/וֹ הַֽ֝לְל֗וּ/הוּ בִּ/רְקִ֥יעַ עֻזּֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/001.yaml
  text: Praise Yah! Praise God in his sanctuary[c][b][a]; praise him in the expanse of his strength.
translation:
  language: ru
  text: Аллилуйя![a] Хвалите Бога в Его святилище;[b] хвалите Его на небосводе Его могущества![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Аллилуйя» — еврейское «хвалите Ях»; Ях — краткая форма Божественного имени. Во многих переводах её передают словом «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «в Его святости»; также возможно: «в Его святом месте».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «на тверди Его могущества» или «на Его могучем небосводе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Аллилуйя
  rationale: Устойчивое русское литургическое восклицание передаёт еврейский призыв «хвалите Ях», сохраняя его торжественную краткость; значение и форма имени поясняются в сноске.
- source_word: אֵל
  choice: Бога
  rationale: Здесь אֵל — обычное обозначение Бога; добавление «Всемогущего» или «Сильного» внесло бы отсутствующее в тексте уточнение.
- source_word: בְקָדְשׁוֹ
  choice: в Его святилище
  rationale: קדשׁ может обозначать святость или святое место. Параллелизм с пространственным רָקִיעַ поддерживает локативное значение «святилище», при этом иные возможные смыслы отмечены в сноске.
- source_word: בִרְקִיעַ
  choice: на небосводе
  rationale: רָקִיעַ обозначает распростёртый свод или пространство. «Небосвод» естественно сохраняет пространственный и космологический образ, не прибегая к архаичному «твердь».
- source_word: עֻזּוֹ
  choice: Его могущества
  rationale: עֹז означает силу или могущество. Родительная конструкция сохраняет неоднозначную связь с «небосводом», не сводя её безоговорочно к качественному прилагательному «могучем».
theological_decisions:
- issue: Передача краткой формы Божественного имени יָהּ
  choice: Аллилуйя с пояснением в сноске
  alternative: Хвалите Яха / Хвалите Господа
  rationale: יָהּ — краткая форма Божественного имени, а не полная форма יהוה. Устоявшееся «Аллилуйя» сохраняет особую литургическую формулу; сноска раскрывает её буквальное значение и не стирает различие между формами имени.
- issue: Значение בְקָדְשׁוֹ
  choice: в Его святилище
  alternative: в Его святости / в Его святом месте
  rationale: Контекст допускает как пространственное, так и абстрактное понимание. В основном тексте выбран наиболее вероятный локативный смысл, а реальная лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным литургическим звучанием. Повтор повелительного «хвалите» сохранён. Заглавные буквы в местоимениях, относящихся к Богу, соответствуют принятому русскому религиозному регистру; синтаксис остаётся ясным для широкого читателя.
