base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/003.yaml
  text: Praise him with the blast of the trumpet[a]; praise him with harp and lyre.
translation:
  language: ru
  text: Хвалите Его трубным звуком[a], хвалите Его на арфе и лире.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звуком шофара». Шофар — рог, часто бараний, который использовали при богослужении и для подачи сигналов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ/הוּ
  choice: Хвалите Его
  rationale: Форма повелительного наклонения множественного числа от הלל с местоименным суффиксом 3-го лица мужского рода единственного числа; перевод сохраняет прямой призыв ко всей общине и его повтор.
- source_word: בְּ/תֵקַע
  choice: трубным звуком
  rationale: Существительное תֵּקַע обозначает трубление, звучание или трубный сигнал. Формулировка передаёт именно производимый звук, а не только средство исполнения.
- source_word: שׁוֹפָר
  choice: трубным … [a]
  rationale: שׁוֹפָר — ритуальный и сигнальный рог, часто бараний. В основном тексте употреблено естественное для русского библейско-поэтического контекста «трубным», а историческая конкретика сохранена в сноске.
- source_word: בְּ/נֵבֶל
  choice: на арфе
  rationale: נֵבֶל обозначает струнный инструмент; «арфа» — понятный современному читателю эквивалент, позволяющий отличить его от следующего инструмента.
- source_word: וְ/כִנּוֹר
  choice: и лире
  rationale: כִּנּוֹר — иной струнный инструмент, обычно передаваемый словом «лира»; различение двух названий сохраняет параллельную пару оригинала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Повтор «Хвалите Его» сохранён. Конструкция «на арфе и лире» естественно обозначает игру на инструментах; термин «шофар» вынесен в сноску, чтобы основной текст оставался понятным.
