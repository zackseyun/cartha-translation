base_translation:
  language: en
  yaml_path: translation/ot/psalms/150/002.yaml
  text: Praise him for his mighty acts[b][a]; praise him according to the abundance of his greatness.
translation:
  language: ru
  text: Хвалите Его за Его могучие деяния[a]; хвалите Его по множеству Его величия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хвалите Его в Его могучих деяниях»; еврейский предлог допускает более формальную передачу, однако здесь, вероятно, указывает на основание хвалы: «за Его могучие деяния».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «хвалите Его соразмерно Его величию». Буквально: «по множеству Его величия»; оборот может выражать меру или соответствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Хвалите Его
  rationale: Форма представляет собой повелительное наклонение множественного числа от הלל с местоименным суффиксом 3-го лица мужского рода единственного числа. «Хвалите Его» — прямое и естественное обращение к общине.
- source_word: בִגְבוּרֹתָיו
  choice: за могучие деяния
  rationale: 'Существительное גְּבוּרוֹת обозначает деяния, в которых проявляется сила. Предлог ב здесь естественно понимать как указывающий на основание хвалы: хвалить за совершённые Им могучие дела.'
- source_word: כְּרֹב
  choice: по мере … великого
  rationale: Сочетание כְּ с רֹב выражает соответствие мере или обилию. Оборот «по мере» сохраняет этот пропорциональный оттенок, а прилагательное «великого» естественно передаёт идею обилия в русском контексте.
- source_word: גֻּדְלוֹ
  choice: Его величия
  rationale: Слово от корня גדל обозначает величие или огромность. «Величие» является прямым, естественным и богословски нейтральным соответствием.
theological_decisions:
- issue: Основание и мера хвалы
  choice: Первое полустишие называет основанием хвалы могучие деяния Бога, а второе призывает воздавать хвалу сообразно Его великому величию.
  alternative: 'Второе полустишие можно понимать не как указание на меру хвалы, а просто как ещё одно её основание: хвалить Бога за Его великое величие.'
  rationale: 'Различие предлогов ב и כ позволяет сохранить два взаимодополняющих оттенка: хвалу за Божьи деяния и хвалу, соответствующую Его величию, не сводя оба полустишия к одной и той же мысли.'
translation_notes:
  register: Современный литературный русский язык с приподнятым, но понятным богослужебно-поэтическим звучанием. Параллелизм и повтор «Хвалите Его» сохранены; архаизмы и конфессионально окрашенные формулы не используются.
