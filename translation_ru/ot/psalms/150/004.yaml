  text: Praise him with tambourine and dancing[b][a]; praise him with strings and pipe.
translation:
  language: ru
  text: Хвалите Его с бубном и в танце; хвалите Его на струнных инструментах и свирели[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на струнах».'
    reason: lexical_alternative
  - marker: b
    text: Точное устройство этого древнего духового инструмента неизвестно; его также можно назвать дудкой или тростниковой трубкой. Традиционный перевод «орган» не означает современный клавишный инструмент.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּהוּ
  choice: Хвалите Его
  rationale: Форма повелительного наклонения во множественном числе от הלל с местоименным суффиксом 3-го лица мужского рода единственного числа. Русское «хвалите Его» сохраняет обращение ко всей общине и прямое дополнение.
- source_word: בְתֹף
  choice: под звуки бубна
  rationale: תֹף обозначает ручной ударный инструмент, вероятнее всего рамочный барабан или бубен. «Бубен» понятен современному читателю, а оборот «под звуки» естественно передаёт инструментальное значение предлога בְּ.
- source_word: וּמָחוֹל
  choice: и в танце
  rationale: מָחוֹל означает танец или пляску. «В танце» ясно представляет танец как способ прославления и звучит естественно и достойно в современном русском.
- source_word: בְּמִנִּים
  choice: на струнных инструментах
  rationale: מִנִּים — общее обозначение струнных инструментов. Полная формулировка понятнее, чем краткое «на струнах», и не уточняет неизвестный вид инструмента.
- source_word: וְעוּגָב
  choice: и свирели
  rationale: עוּגָב обозначает духовой инструмент, вероятно трубку или язычковую свирель. «Свирель» передаёт древний духовой инструмент и не вызывает ошибочной ассоциации с современным клавишным органом.
