  source_fidelity: «Всё, что дышит» точно и естественно передаёт כֹּל הַנְּשָׁמָה, сохраняя всеобщий охват и образ дыхания без неоправданного сведения к «душе». Побудительное «да славит» адекватно передаёт волитивный оттенок תְּהַלֵּל. Заключительное «Славьте Ях!» сохраняет множественное повеление הַלְלוּ и краткую форму имени יָהּ.
