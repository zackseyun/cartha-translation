translation:
  language: ru
  text: Всё, что дышит, да славит Ях! Славьте Ях[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Аллилуйя!» Еврейское выражение הַלְלוּ־יָהּ («Славьте Ях») стало источником богослужебного возгласа «Аллилуйя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הַנְּשָׁמָה
  choice: всё, что дышит
  rationale: Сочетание כֹּל с הַנְּשָׁמָה имеет всеохватный смысл и обозначает всякое существо, в котором есть дыхание. Формулировка «всё, что дышит» естественна по-русски и сохраняет образ дыхания, не сужая значение до «души».
- source_word: תְּהַלֵּל
  choice: да славит
  rationale: Имперфект в заключительном призыве имеет побудительное значение. Конструкция «да славит» передаёт это значение кратко, торжественно и понятно современному читателю.
- source_word: יָהּ
  choice: Ях
  rationale: Сохранена краткая поэтическая форма Божьего имени, отличная от полной формы יהוה. Русская передача «Ях» также позволяет увидеть связь с возгласом «Аллилуйя».
- source_word: הַלְלוּ יָהּ
  choice: Славьте Ях!
  rationale: Императив множественного числа передан как прямой призыв ко всем слушателям. Глагол «славьте» естественно выражает хвалу Богу в современном литературном русском языке; традиционная транслитерация дана в сноске.
theological_decisions:
- issue: Передача краткой формы Божьего имени יָהּ
  choice: Ях
  alternative: Господь
  rationale: Транслитерация сохраняет присутствующую в еврейском тексте краткую поэтическую форму имени и не смешивает её с обычной заместительной передачей полной формы יהוה.
- issue: Перевод или транслитерация выражения הַלְלוּ־יָהּ
  choice: Славьте Ях!
  alternative: Аллилуйя!
  rationale: В основном тексте раскрыто значение еврейского повелительного выражения, а широко известная богослужебная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский с кратким торжественным синтаксисом. Конструкция «да славит» сохраняет поэтический и призывный характер финала псалма, оставаясь понятной широкому читателю.
