    reason: lexical_alternative
lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Хвалите
  rationale: Форма повелительного наклонения во множественном числе передаёт обращённый ко всем призыв к хвале.
- source_word: יָהּ
  choice: Яха
  rationale: Краткая поэтическая форма божественного имени передана транслитерацией «Ях» в требуемой русской падежной форме; она не слита с глаголом в традиционное «Аллилуйя».
- source_word: הַלְלִי
  choice: Хвали
  rationale: Повелительное наклонение женского рода единственного числа согласуется с обращением к душе и сохраняет прямое самоувещевание псалмопевца.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: В контексте поэтического обращения к самому себе «душа моя» естественно и точно передаёт נַפְשִׁי; порядок слов сохраняет возвышенное, но понятное звучание.
- source_word: אֶת
  choice: отдельно не переводится
  rationale: Показатель прямого дополнения не имеет самостоятельного лексического соответствия в русском языке; его функция выражена винительным падежом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное божественное имя передано принятой русской транслитерацией, а не заменено титулом «Господь».
theological_decisions:
- issue: Передача יָהּ и יְהוָה в одном стихе
  choice: Передать краткую форму как «Ях», а полную — как «Яхве»
  alternative: Обе формы передать словом «Господь» либо первую фразу воспроизвести как «Аллилуйя»
  rationale: Раздельная передача сохраняет два употреблённых в еврейском тексте начертания божественного имени и не скрывает буквального смысла начального призыва.
translation_notes:
  register: Современный литературный русский с краткими параллельными восклицаниями. Форма «Яха» обусловлена русским управлением переходного глагола; обращение «душа моя» сохраняет достоинство и поэтический ритм.
