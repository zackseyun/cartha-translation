  yaml_path: translation/ot/psalms/146/008.yaml
  text: Yahweh opens the eyes of the blind[a]; Yahweh raises up those who are bowed down; Yahweh loves the righteous.
translation:
  language: ru
  text: Яхве открывает глаза слепым[a]; Яхве поднимает согбенных; Яхве любит праведных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвращает зрение слепым». По-еврейски буквально: «открывает слепых», то есть открывает им глаза.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; форма «Яхве» общепринята в современной русской библеистике.
- source_word: פֹּקֵחַ עִוְרִים
  choice: открывает глаза слепым
  rationale: В еврейском буквально сказано «открывает слепых», при этом подразумеваются глаза. Русский вариант сохраняет конкретный образ и естественно передаёт смысл.
- source_word: זֹקֵף
  choice: поднимает
  rationale: Глагол означает выпрямлять или поднимать; в сочетании с «согбенными» передаёт как телесный образ, так и более широкий смысл восстановления.
- source_word: כְּפוּפִים
  choice: согбенных
  rationale: Краткое субстантивированное обозначение людей, которые согнуты или подавлены; сохраняет образ и не ограничивает его только физическим состоянием.
- source_word: אֹהֵב
  choice: любит
  rationale: Прямой и естественный эквивалент причастной формы, выражающей постоянное действие или свойство.
- source_word: צַדִּיקִים
  choice: праведных
  rationale: Стандартно и ясно передаёт субстантивированное прилагательное со значением людей, живущих праведно.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст трижды употребляет личное имя Бога. Транслитерация «Яхве» сохраняет это имя и не подменяет его титулом.
- issue: Характер помощи слепым и согбенным
  choice: Сохранены конкретные телесные образы без ограничения их смысла
  alternative: Истолковать выражения исключительно как физическое исцеление или исключительно как духовное восстановление
  rationale: Поэтические выражения допускают прямой и более широкий смысл; перевод не должен устранять эту смысловую объёмность.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Трёхкратное повторение имени «Яхве» и параллельное строение строк сохранены; лексика проста и понятна без архаизации.
