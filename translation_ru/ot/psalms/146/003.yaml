  source_fidelity: Текст точно передаёт запрет אַל תִּבְטְחוּ, адресат доверия/упования — נְדִיבִים («князья») и обобщённого смертного человека (בֶּן־אָדָם), а также заключительное утверждение שֶׁאֵין לוֹ תְשׁוּעָה. Формулировка «у которого нет спасения» намеренно сохраняет не до конца конкретизированный характер еврейского выражения и не сводит его преждевременно к «не может спасти».
  naturalness: «Не надейтесь на князей, на человека, у которого нет спасения» — естественный современный литературный русский с уместной для псалма возвышенной сдержанностью. Повтор предлога «на» ясно организует два однородных дополнения. «Князья» в данном контексте понятны как влиятельные правители или вельможи.
  terminology: '«Спасение» адекватно передаёт תְשׁוּעָה и сохраняет широкий, в том числе богословски значимый, смысл; сноска корректно указывает «избавление» как альтернативу. Передача בֶּן־אָדָם словом «человек» с примечанием удачна: она не создаёт в основном тексте ложной титульной ассоциации, но документирует буквальный образ и его нетитулярный характер.'
