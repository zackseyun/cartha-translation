  text: אַל תִּבְטְח֥וּ בִ/נְדִיבִ֑ים בְּ/בֶן אָדָ֓ם שֶׁ֤/אֵֽין ל֥/וֹ תְשׁוּעָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/003.yaml
  text: Do not trust in princes[a], in a son of man[b], in whom there is no salvation.
translation:
  language: ru
  text: Не надейтесь на князей, на человека[a], у которого нет спасения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сына человека» — то есть смертного человека; здесь это не мессианский титул.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избавления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּבְטְחוּ
  choice: Не надейтесь
  rationale: Отрицательная частица с глагольной формой выражает запрет. «Не надейтесь» естественно передаёт призыв не возлагать доверие и надежду на кого-либо.
- source_word: בִנְדִיבִים
  choice: на князей
  rationale: Слово может обозначать князей, вельмож или знатных людей. В контексте предостережения против упования на влиятельных людей «князья» точно и ёмко передаёт социально-политический смысл.
- source_word: בְּבֶן אָדָם
  choice: на человека[a]
  rationale: Буквально — «на сына человека». Здесь это еврейское обозначение обычного смертного человека, а не мессианский титул. Буквальная калька по-русски могла бы ошибочно восприниматься как титул, поэтому смысл передан естественно, а образ отмечен в сноске.
- source_word: שֶׁאֵין לוֹ
  choice: у которого нет
  rationale: Передаёт относительную конструкцию с отрицанием наличия, не уточняя сверх текста, идёт ли речь о способности спасти или о доступном спасении.
- source_word: תְשׁוּעָה
  choice: спасения[b]
  rationale: Существительное означает спасение или избавление. «Спасение» сохраняет широкий смысл и богословскую весомость противопоставления человека Богу.
theological_decisions:
- issue: Значение выражения «сын человека»
  choice: Обычный смертный человек; в основном тексте — «человек» с пояснением в сноске
  alternative: Буквальное «сын человеческий» как возможный мессианский титул
  rationale: В данном псалме выражение обобщённо указывает на человека, включая могущественного правителя, и противопоставляет его Богу как истинному источнику спасения. Контекст не указывает на мессианский титул.
- issue: Характер отсутствующего у человека спасения
  choice: Сохранить формулировку «у которого нет спасения»
  alternative: Истолковывающее «который не может спасти»
  rationale: Еврейская конструкция буквально говорит, что у человека нет спасения. Более разъясняющий вариант возможен, но сужает подлинную смысловую напряжённость до одной лишь способности спасать других.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмового наставления. Синтаксис близок к еврейскому, но избегает архаичной кальки «сын человеческий», способной создать в русском тексте непредусмотренную мессианскую ассоциацию.
