lexical_decisions:
- source_word: יִמְלֹךְ
  choice: будет царствовать
  rationale: Форма qal imperfect 3-го лица единственного числа здесь естественно передаёт будущее и непрестанное царствование; русский будущий вид сохраняет гимническое утверждение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является принятой русской транслитерацией тетраграмматона.
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Выражает неограниченную длительность. «Вовеки» кратко, понятно и уместно в возвышенной поэтической речи.
- source_word: אֱלֹהַיִךְ
  choice: твой Бог
  rationale: Суффикс 2-го лица женского рода единственного числа относится к олицетворённому Сиону; форма обращения сохранена.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Собственное имя передано в устойчивой русской форме; в контексте оно является обращением.
- source_word: לְדֹר וָדֹר
  choice: из рода в род
  rationale: Устойчивое русское соответствие еврейскому повторному обороту, обозначающему непрерывность через сменяющиеся поколения.
- source_word: הַלְלוּ יָהּ
  choice: Аллилуйя!
  rationale: Сохранено укоренившееся русское литургическое заимствование; буквальный смысл и краткая форма Божьего имени пояснены в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога. Его транслитерация сохраняет различие между именем и титулом.
- issue: Передача הַלְלוּ יָהּ
  choice: Аллилуйя!
  alternative: Хвалите Ях!
  rationale: Традиционная форма естественна для русского псалмового текста, а буквальное значение раскрывается в сноске без утраты краткой формы имени.
- issue: Связь אֱלֹהַיִךְ צִיּוֹן с первой строкой
  choice: — твой Бог, Сион, из рода в род
  alternative: ; твой Бог, Сион, — из рода в род
  rationale: Тире сохраняет приложение «твой Бог» к имени Яхве и обращение к Сиону, не вводя в текст отсутствующий глагол; поэтическая сжатость и некоторая синтаксическая напряжённость оригинала остаются заметны.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой лексикой. Формы «вовеки» и «из рода в род» общеупотребительны в библейско-поэтическом регистре и остаются понятными современному читателю. Маркер сноски поставлен непосредственно после слова «Аллилуйя», которое он поясняет.
