  yaml_path: translation/ot/psalms/146/010.yaml
  text: Yahweh will reign forever—your God[a], Zion, from generation to generation. Hallelujah!
translation:
  language: ru
  text: Яхве будет царствовать вовеки — твой Бог, Сион, из рода в род. Аллилуйя![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Хвалите Ях!» «Ях» — краткая форма имени Яхве.'
