base_translation:
  language: en
  yaml_path: translation/ot/psalms/146/004.yaml
  text: His breath goes out[a]; he returns to his ground; on that very day his plans perish.
translation:
  language: ru
  text: Его дыхание уходит[a] — он возвращается в свою землю; в тот день гибнут его замыслы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его дух». Еврейское רוּחַ может означать «дыхание» или «дух».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּצֵא
  choice: выходит
  rationale: Форма глагола יצא буквально передаёт уход жизненного дыхания при смерти; «выходит» сохраняет конкретный образ еврейского текста, не уточняя его сверх сказанного.
- source_word: רוּחוֹ
  choice: его дыхание
  rationale: רוּחַ может означать «дыхание», «ветер» или «дух». В контексте смерти и возвращения человека в землю «дыхание» естественно передаёт жизненное дыхание, а возможное значение «дух» сохранено в сноске.
- source_word: יָשֻׁב
  choice: он возвращается
  rationale: Глагол שוב означает «возвращаться». Здесь субъектом естественно понимать человека, который возвращается в землю.
- source_word: לְאַדְמָתוֹ
  choice: в свою землю
  rationale: אֲדָמָה означает землю, почву; притяжательный суффикс передан словом «свою». Перевод «прах» не выбран, поскольку в данном стихе употреблено другое существительное.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот же день
  rationale: 'Так передаётся временная непосредственность: замыслы человека гибнут именно в день его смерти.'
- source_word: אָבְדוּ
  choice: гибнут
  rationale: Глагол אבד выражает гибель, исчезновение или крушение. «Гибнут» кратко и весомо передаёт прекращение человеческих замыслов.
- source_word: עֶשְׁתֹּנֹתָיו
  choice: его замыслы
  rationale: Редкое существительное может обозначать мысли, намерения или планы. «Замыслы» сохраняет целенаправленный оттенок и хорошо соответствует предостережению не полагаться на смертного человека.
theological_decisions:
- issue: Антропологический смысл רוּחוֹ в контексте смерти
  choice: 'В основном тексте: «его дыхание»'
  alternative: «его дух»
  rationale: «Дыхание» сохраняет конкретный образ прекращения земной жизни и не вводит определённого учения о состоянии человека после смерти. Поскольку רוּחַ допускает и значение «дух», этот вариант указан в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным псалмическим звучанием. Тире ясно связывает уход дыхания со смертью человека, не устраняя смысловой многозначности ключевого еврейского слова.
