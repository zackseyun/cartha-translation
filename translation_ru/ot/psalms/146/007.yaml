lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפָּט
  choice: вершит правосудие
  rationale: Сочетание передаёт устойчивое действие Бога и естественно выражает не просто вынесение приговора, а восстановление справедливости.
- source_word: לָעֲשׁוּקִים
  choice: для угнетённых
  rationale: Субстантивированное страдательное причастие обозначает людей, подвергающихся притеснению; краткая форма сохраняет социально-нравственную силу оригинала.
- source_word: נֹתֵן לֶחֶם
  choice: даёт хлеб
  rationale: Сохранено прямое значение обоих слов; «хлеб» может также обозначать пищу вообще, но обобщение в основном тексте не требуется.
- source_word: לָרְעֵבִים
  choice: голодным
  rationale: Субстантивированное прилагательное естественно передаётся дательным падежом при глаголе «даёт».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
- source_word: מַתִּיר אֲסוּרִים
  choice: освобождает узников
  rationale: Контекстуально ясная русская передача образа развязывания или освобождения связанных людей; более буквальная широта отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Объём значения אֲסוּרִים
  choice: узников
  alternative: связанных
  rationale: «Узники» естественно в данном контексте, но еврейское слово буквально шире и может обозначать связанных; эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Параллелизм еврейской поэзии сохранён; причастные формы переданы личными глаголами настоящего времени как постоянные, характерные действия Бога.
