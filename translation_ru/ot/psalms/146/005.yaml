  yaml_path: translation/ot/psalms/146/005.yaml
  text: Blessed is the one whose help is the God of Jacob[a], whose hope is in Yahweh his God.
translation:
  language: ru
  text: Блажен тот, чья помощь — Бог Иакова, чья надежда — на Яхве, его Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен тот
  rationale: Форма блаженства обозначает достойное зависти благополучие человека, а не просто субъективное ощущение счастья; «блажен» сохраняет возвышенный псалмический регистр.
- source_word: שֶׁאֵל יַעֲקֹב בְּעֶזְרוֹ
  choice: кому помогает Бог Иакова
  rationale: Масоретская акцентуация и синтаксис допускают понимание Бога Иакова как помощи или помощника этого человека. Русская глагольная конструкция естественно передаёт данное отношение, не вводя тяжеловесного оборота.
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Сохраняется традиционная русская форма библейского имени и историко-заветное именование «Бог Иакова».
- source_word: שִׂבְרוֹ
  choice: кто надеется
  rationale: Существительное означает «надежда, ожидание»; перестройка в личную глагольную конструкцию естественна по-русски и сохраняет параллелизм двух характеристик одного человека.
- source_word: עַל
  choice: на
  rationale: При глаголе «надеяться» русский предлог «на» точно обозначает объект упования и зависимости.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֱלֹהָיו
  choice: своего Бога
  rationale: Возвратное притяжательное местоимение естественно для русского языка и ясно соотносит Бога с тем же лицом, которое надеется на Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога; «Яхве» непосредственно сохраняет его как имя и не подменяет титулом.
- issue: Неявно выраженный субъект формулы блаженства
  choice: тот … кому … кто
  alternative: муж; человек; он
  rationale: В еврейском тексте нет отдельного существительного «муж» или «человек». Местоименная конструкция сохраняет единственное число без добавления отсутствующего в оригинале обозначения.
- issue: Отношение Бога Иакова к блаженному человеку
  choice: кому помогает Бог Иакова
  alternative: чья помощь — Бог Иакова; чей помощник — Бог Иакова
  rationale: Формулировка сохраняет Бога как действующего помощника и естественно звучит по-русски, не разрешая смысл в сторону безличной «помощи».
translation_notes:
  register: Современный литературный русский язык с традиционным псалмическим словом «блажен». Синтаксис сделан ясным и естественным; параллельные придаточные «кому… кто…» описывают одного человека. Имя «Яхве» сохраняется как личное имя.
