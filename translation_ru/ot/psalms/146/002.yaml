  text: I will praise Yahweh all my life[a]; I will sing praises to my God as long as I live.
translation:
  language: ru
  text: Буду восхвалять Яхве всю мою жизнь[a], буду петь хвалу моему Богу, пока живу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в моей жизни»; во второй строке — «пока я существую». Оба выражения указывают на продолжительность жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲהַלְלָה
  choice: буду восхвалять
  rationale: Форма первого лица единственного числа выражает решимость или волевую направленность; будущее время естественно передаёт твёрдое намерение псалмопевца.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: בְּחַיָּי
  choice: всю мою жизнь
  rationale: Буквально «в моей жизни»; в данном поэтическом контексте оборот обозначает продолжительность всей жизни.
- source_word: אֲזַמְּרָה
  choice: буду петь хвалу
  rationale: Глагол זמר обозначает музыкальное прославление; выражение сохраняет и пение, и хвалебную направленность.
- source_word: לֵאלֹהַי
  choice: моему Богу
  rationale: Предлог ל при глаголе пения естественно передаётся русским дательным падежом.
- source_word: בְּעוֹדִי
  choice: пока живу
  rationale: Оборот буквально указывает на продолжающееся существование; идиоматический перевод ясно выражает длительность и сохраняет параллелизм с первой строкой.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит тетраграмматон как личное имя. «Яхве» передаёт его транслитерацией, не заменяя титулом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным поэтическим звучанием. Повтор «буду» сохраняет параллелизм и решительный тон еврейского текста.
