  yaml_path: translation/ot/psalms/146/009.yaml
  text: Yahweh watches over the sojourners[a]; he upholds the fatherless and the widow[b], but he twists the way of the wicked.
translation:
  language: ru
  text: Яхве хранит пришельцев[a], поддерживает сироту и вдову, а путь нечестивых искривляет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чужеземцев», «переселенцев»; еврейское слово обозначает людей неместного происхождения, живущих среди народа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «делает путь нечестивых кривым»; по смыслу возможно: «обращает путь нечестивых к погибели».'
