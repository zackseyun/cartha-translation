lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: שֹׁמֵר
  choice: хранит
  rationale: Причастная форма описывает постоянную охрану и заботу; «хранит» естественно и ёмко передаёт этот смысл в русской поэтической речи.
- source_word: גֵּרִים
  choice: пришельцев
  rationale: Обозначает людей не местного происхождения, живущих среди народа и находящихся в социально уязвимом положении; возможные современные соответствия пояснены в сноске.
- source_word: יָתוֹם
  choice: сироту
  rationale: Собирательное единственное число сохранено; в современном русском «сирота» естественнее, чем буквальное сужение до ребёнка без отца.
- source_word: אַלְמָנָה
  choice: вдову
  rationale: 'Сохранено собирательное единственное число и традиционная пара уязвимых лиц: сирота и вдова.'
- source_word: יְעוֹדֵד
  choice: поддерживает
  rationale: Глагол означает укреплять и давать опору; выбранное слово ясно выражает действенную заботу.
- source_word: דֶרֶךְ
  choice: путь
  rationale: Сохраняет поэтическую метафору жизненного направления и поведения.
- source_word: רְשָׁעִים
  choice: нечестивых
  rationale: Передаёт субстантивированное множественное число как нравственную категорию, обычную для языка Псалмов.
- source_word: יְעַוֵּת
  choice: делает кривым
  rationale: Сохраняет основной образ глагола — искривлять, извращать — и не сводит его без необходимости к истолкованию «губит».
theological_decisions:
- issue: Изображение Божьего суда в заключительной части стиха
  choice: а путь нечестивых делает кривым
  alternative: а путь нечестивых обращает к погибели
  rationale: Еврейский глагол прежде всего выражает искривление или извращение. Буквенный образ сохранён, чтобы не устранять напряжение и не подменять метафору одним предполагаемым результатом.
translation_notes:
  register: Современный литературный русский с лаконичным поэтическим ритмом. Сохранены параллелизм стиха, личное имя Яхве и метафорическая неоднозначность заключительного глагола.
