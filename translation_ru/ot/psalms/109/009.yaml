base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/009.yaml
  text: May his sons be fatherless[a], and his wife a widow.
translation:
  language: ru
  text: Пусть его сыновья останутся без отца[a], а его жена — вдовой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «станут сиротами». Еврейское слово может обозначать детей, лишившихся отца; здесь выражение «без отца» соответствует параллели с женой, ставшей вдовой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: пусть ... останутся
  rationale: Юссивно-пожелательное, в данном контексте проклинающее значение передано конструкцией «пусть...», а «останутся» естественно выражает наступление названного состояния по-русски.
- source_word: בָנָיו
  choice: его сыновья
  rationale: Форма множественного числа существительного בֵּן с суффиксом 3-го лица мужского рода единственного числа означает именно «его сыновья», а не обобщённо «его дети».
- source_word: יְתוֹמִים
  choice: без отца
  rationale: Еврейское слово обозначает сирот, особенно детей, лишившихся отца; здесь уточнённое выражение поддерживает параллель с женой, ставшей вдовой.
- source_word: וְאִשְׁתּוֹ
  choice: а его жена
  rationale: אִשָּׁה с притяжательным суффиксом в контексте означает «его жена»; союз передан как «а» для естественного русского параллелизма без изменения смысловой связи.
- source_word: אַלְמָנָה
  choice: вдовой
  rationale: Существительное прямо обозначает вдову; русский творительный падеж требуется конструкцией «останется вдовой».
theological_decisions:
- issue: Проклинающее пожелание в псалме
  choice: 'Передать как пожелание: «Пусть его сыновья останутся без отца, а его жена — вдовой»'
  alternative: 'Предсказательное будущее: «Его сыновья останутся без отца, а его жена — вдовой»'
  rationale: Форма глагола и контекст Псалма 109 указывают на юссивное, импрекативное значение, а не на простое предсказание; перевод сохраняет напряжённую риторику текста, не смягчая её.
translation_notes:
  register: Современный литературный русский язык с достоинством, свойственным поэтической молитве. Конструкция «пусть» ясно передаёт пожелание-проклятие; тире в именной части сказуемого делает вторую половину стиха естественной и выразительной.
