base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/030.yaml
  text: I will give great thanks to Yahweh with my mouth[b][a]; in the midst of many I will praise him.
translation:
  language: ru
  text: Я буду горячо благодарить Яхве своими устами[a] и среди многих восхвалять Его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «буду весьма благодарить Яхве моими устами».'
    reason: lexical_alternative
  - marker: b
    text: То есть открыто, находясь среди множества людей; слово «собрание» в еврейском тексте прямо не употреблено.
    reason: cultural_note
lexical_decisions:
- source_word: א֘וֹדֶ֤ה
  choice: буду благодарить
  rationale: Форма глагола ידה в данном контексте означает благодарение или хвалу. «Благодарить» естественно сочетается с последующим «восхвалять» и сохраняет смысловой параллелизм.
- source_word: יְהוָ֣ה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном יהוה, а не заменено титулом.
- source_word: מְאֹ֣ד
  choice: горячо
  rationale: Наречие усиливает действие благодарения. «Горячо благодарить» естественно в современном литературном русском и выражает интенсивность, не превращая её в указание на количество.
- source_word: בְּ/פִ֑/י
  choice: своими устами
  rationale: Предлог обозначает средство выражения благодарности; «устами» сохраняет телесную конкретность и поэтический регистр оригинала.
- source_word: וּ/בְ/ת֖וֹךְ רַבִּ֣ים
  choice: и среди многих
  rationale: Буквально сохранено пространственно-общественное выражение «среди многих» без добавления отсутствующего в тексте слова «собрание».
- source_word: אֲהַֽלְלֶֽ/נּוּ
  choice: восхвалять Его
  rationale: Порода piel глагола הלל здесь означает усиленную хвалу; местоименное окончание мужского рода указывает на Яхве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В еврейском тексте непосредственно стоит личное имя Бога. Транслитерация сохраняет отличие имени от титула, не вводя дополнительного толкования.
- issue: Смысл выражения «среди многих»
  choice: сохранить неопределённое «среди многих»
  alternative: «в многолюдном собрании» или «публично перед толпой»
  rationale: Контекст предполагает публичную хвалу, однако существительное «собрание» в стихе отсутствует; перевод сохраняет подлинную широту выражения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой лексикой. «Устами» и «восхвалять» поддерживают достоинство поэтической речи, а прямой порядок и знакомые слова делают стих понятным обычному читателю.
