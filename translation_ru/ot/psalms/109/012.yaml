  text: אַל יְהִי ל֭/וֹ מֹשֵׁ֣ךְ חָ֑סֶד וְֽ/אַל יְהִ֥י ח֝וֹנֵ֗ן לִ/יתוֹמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/012.yaml
  text: Let there be no one to extend kindness to him[b][a], and let there be no one to show favor to his fatherless children.
translation:
  language: ru
  text: Да не найдётся никого, кто продолжил бы оказывать ему милость[a], и никого, кто проявил бы благосклонность к его сиротам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кто тянул бы милость»; выражение означает продолжить или продлить оказание милости.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «его детей, оставшихся без отца». Еврейское слово часто обозначает сироту, особенно ребёнка без отца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹשֵׁךְ
  choice: продолжил бы оказывать
  rationale: Причастие от משׁך буквально означает «тянуть», а в сочетании с חֶסֶד передаёт продолжение или продление милости; выбранное выражение естественно по-русски и сохраняет длительный оттенок.
- source_word: חָסֶד
  choice: милость
  rationale: В данном контексте слово обозначает милосердное, благосклонное отношение человека к нуждающемуся; «милость» передаёт это значение без обязательного сведения его к заветной терминологии.
- source_word: חוֹנֵן
  choice: пожалел бы
  rationale: Глагол חנן означает проявлять благосклонность, милость или сострадание. В отношении осиротевших детей «пожалел бы» звучит естественно и передаёт практическое милосердие, не придавая выражению исключительно богословского оттенка.
- source_word: יְתוֹמָיו
  choice: его осиротевших детей
  rationale: יָתוֹם обозначает сироту, нередко ребёнка без отца. Контекст показывает, что речь идёт о детях названного человека, которые после его гибели останутся без отца.
- source_word: אַל יְהִי
  choice: да не найдётся никого
  rationale: Отрицательная юссивная конструкция выражает пожелание или призыв, а не простое предсказание; русская конструкция с «да не» сохраняет молитвенно-проклинательную силу.
theological_decisions:
- issue: Передача проклинательного прошения без смягчения
  choice: 'Сохранено прямое пожелание: «Да не найдётся никого…»'
  alternative: 'Будущее утверждение: «Не найдётся никого…»'
  rationale: Еврейские юссивные формы выражают пожелание или призыв. Прямое прошение сохраняет напряжённость и силу проклинательного псалма, не превращая его в нейтральное предсказание.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим поэтической молитве. Конструкция «да не» сохраняет возвышенный, но понятный императивно-пожелательный регистр; порядок фраз следует параллелизму еврейского стиха.
