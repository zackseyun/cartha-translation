  text: כִּֽי יַ֭עֲמֹד לִ/ימִ֣ין אֶבְי֑וֹן לְ֝/הוֹשִׁ֗יעַ מִ/שֹּׁפְטֵ֥י נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/031.yaml
  text: For he stands at the right hand of the poor[b][a], to save him from those who judge his soul.
translation:
  language: ru
  text: Ибо он стоит по правую руку нуждающегося, чтобы спасти его от тех, кто судит его[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от его судей». Еврейское слово נֶפֶשׁ может здесь означать самого человека, его жизнь или «душу»; выражение может обозначать как тех, кто выступает в роли его судей, так и, шире, тех, кто выносит ему приговор.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующей хвалы и уверенности; «ибо» сохраняет пояснительную связь и соответствует возвышенному поэтическому регистру.
- source_word: יַעֲמֹד
  choice: он стоит
  rationale: Имперфект может обозначать характерное либо несомненное действие. Настоящее время естественно выражает постоянную защиту, не сводя смысл только к будущему.
- source_word: לִימִין
  choice: по правую руку
  rationale: Сохранён образ близкого присутствия, поддержки и защиты; выражение естественно для современного литературного русского языка.
- source_word: אֶבְיוֹן
  choice: нуждающегося
  rationale: Слово обозначает бедного, нуждающегося и социально уязвимого человека. Этот вариант передаёт нужду и уязвимость, не ограничивая смысл исключительно материальной бедностью.
- source_word: לְהוֹשִׁיעַ
  choice: чтобы спасти
  rationale: Инфинитив выражает цель; «спасти» передаёт широкий смысл избавления, в том числе от судебной угрозы.
- source_word: מִשֹּׁפְטֵי
  choice: от тех, кто судит
  rationale: Причастная форма может указывать как на судей, так и шире на выносящих человеку неблагоприятный приговор. Основной текст сохраняет судебный образ без уточнения «осуждает».
- source_word: נַפְשׁוֹ
  choice: его душу
  rationale: Формальный эквивалент сохраняет многозначность נֶפֶשׁ и напряжение необычного сочетания «судить душу»; сноска поясняет возможные контекстуальные значения «жизнь» и «самого человека».
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ
  choice: В основном тексте — «его душу», с пояснением широты значения в сноске
  alternative: «его жизнь» или «его самого»
  rationale: 'Еврейское נֶפֶשׁ не обязательно обозначает отделимую нематериальную часть человека: здесь речь может идти о жизни или о самом человеке. Буквальное «душу» сохраняет исходный образ, а сноска предотвращает неоправданное догматическое сужение.'
- issue: Характер действия יַעֲמֹד
  choice: Настоящее время «стоит»
  alternative: Будущее время «встанет»
  rationale: Форма допускает как будущую, так и характерную или уверенно ожидаемую защиту. Настоящее время передаёт утверждение о Божьем заступничестве, не отрицая его осуществления в будущем.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимение «он» написано со строчной буквы, поскольку в еврейском тексте графического почтительного выделения нет; референт определяется контекстом. Судебный образ и многозначность נֶפֶשׁ намеренно сохранены.
