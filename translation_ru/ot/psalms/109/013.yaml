  text: יְהִֽי אַחֲרִית֥/וֹ לְ/הַכְרִ֑ית בְּ/ד֥וֹר אַ֝חֵ֗ר יִמַּ֥ח שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/013.yaml
  text: May his posterity be cut off[a]; in the next generation may their name be blotted out.
translation:
  language: ru
  text: Да будет истреблено его потомство[a], и в следующем поколении да изгладится их имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да будет его конец — истребление». Слово אַחֲרִית может означать «конец» или «будущее», но здесь контекст, вероятнее всего, указывает на потомство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהִי
  choice: да будет
  rationale: Юссив глагола היה выражает пожелание-проклятие; конструкция «да будет» естественно передаёт волитивную силу и сохраняет возвышенный регистр.
- source_word: אַחֲרִיתוֹ
  choice: его потомство
  rationale: Слово может означать «конец» или «будущее», но параллель с последующим упоминанием следующего поколения и «их имени» указывает здесь на потомков, продолжающих род.
- source_word: לְהַכְרִית
  choice: истреблено
  rationale: Инфинитив כרת с ל обозначает результат или назначение. «Истреблено» передаёт полное пресечение рода и естественно сочетается с «потомством».
- source_word: בְּדוֹר אַחֵר
  choice: в следующем поколении
  rationale: Буквально возможно «в другом поколении», однако в контексте речь идёт о поколении, следующем за поколением нечестивца.
- source_word: יִמַּח
  choice: да изгладится
  rationale: Нифаль от מחה означает «быть стёртым, изглаженным»; «изгладится» сохраняет библейский образ удаления имени и передаёт юссивную силу.
- source_word: שְׁמָם
  choice: их имя
  rationale: Местоименный суффикс имеет множественное число и относится к потомкам, тогда как единственное «имя» обозначает общее родовое имя или память о них.
theological_decisions:
- issue: Проклятие-молитва в стихе
  choice: Сохранить форму пожелания суда над родом нечестивца
  alternative: Передать как нейтральное предсказание его будущего
  rationale: Юссивные формы и контекст Псалма 109 выражают молитвенное призывание суда, а не простое сообщение о будущем; суровость и напряжение текста не смягчаются.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской формой «да будет / да изгладится». Синтаксис остаётся ясным для обычного читателя; лексическая неоднозначность אַחֲרִית вынесена в сноску.
