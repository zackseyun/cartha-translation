  text: Пусть его дети скитаются и просят милостыню; пусть ищут у своих развалин[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть ищут прочь от своих развалин». Буквально: «от/из своих развалин»; еврейский предлог может указывать как на источник, так и на удаление. Предмет поисков в тексте не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֹועַ יָנוּעוּ
  choice: пусть ... скитаются
  rationale: Сочетание абсолютного инфинитива с имперфектом усиливает значение глагола נוע. В контексте проклятия форма с «пусть» естественно передаёт пожелание, а «скитаются» — бесцельное, продолжающееся перемещение.
- source_word: בָנָיו
  choice: его дети
  rationale: בנים может обозначать как сыновей, так и детей вообще. В данном семейном контексте современное русское «дети» сохраняет широту возможного значения.
- source_word: וְשִׁאֵלוּ
  choice: и просят милостыню
  rationale: Обычно שאל означает «просить», но соседство со скитанием и разорением указывает здесь на просьбу о подаянии. «Просят милостыню» ясно и естественно выражает этот смысл.
- source_word: וְדָרְשׁוּ
  choice: пусть ищут
  rationale: דרש означает «искать, разыскивать». Объект в еврейском тексте не назван, поэтому перевод не уточняет его как пищу или подаяние и сохраняет недосказанность оригинала.
- source_word: מֵחָרְבוֹתֵיהֶם
  choice: среди своих развалин
  rationale: חָרְבוֹת обозначает развалины или опустошённые места. Предлог מן может указывать на источник либо удаление; в основном тексте выбрано контекстуально понятное место поисков, а значение удаления отмечено в сноске.
