  text: יְקַֽלְלוּ הֵמָּה֮ וְ/אַתָּ֪ה תְבָ֫רֵ֥ךְ קָ֤מוּ וַ/יֵּבֹ֗שׁוּ וְֽ/עַבְדְּ/ךָ֥ יִשְׂמָֽח־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/028.yaml
  text: They may curse[a], but you will bless. They rise up and are put to shame[b], but your servant will rejoice.
translation:
  language: ru
  text: Пусть они проклинают[a], а Ты благослови. Они поднимутся — и будут посрамлены[b], а Твой слуга возрадуется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Они проклинают, а Ты благословляешь» или «Пусть они проклинают, но Ты благословишь». Еврейские формы допускают волитивный, уступительный или будущий оттенок.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «Они поднялись — и устыдились (были посрамлены)». Глагол «подняться» может в контексте подразумевать враждебное выступление, но нападение прямо не названо; последовательность глагольных форм допускает также пожелательный или ожидаемый итог.'
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: יְקַֽלְלוּ
  choice: Пусть они проклинают
  rationale: Пиэль, имперфект 3-го лица множественного числа, допускает будущее, обычное или волитивно-уступительное значение. В противопоставлении Божьему благословению естественное русское «пусть» сохраняет оттенок допущения, не утверждая, что проклятие действенно.
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение подчёркивает субъект и контраст с «Ты»; в русском это передано явным местоимением.
- source_word: וְאַתָּה תְבָרֵךְ
  choice: а Ты благослови
  rationale: Союз имеет контрастное значение. Форму תְבָרֵךְ можно понимать как будущее либо как обращённое к Богу волитивное пожелание; «благослови» хорошо соответствует параллельному «пусть они проклинают», но альтернативная временная трактовка отмечена в сноске.
- source_word: קָמוּ
  choice: Они восстали
  rationale: Каль, перфект 3-го лица множественного числа от קום буквально означает «встали, поднялись». «Восстали» в данном контексте передаёт вероятную враждебность действия, не конкретизируя его как нападение.
- source_word: וַיֵּבֹשׁוּ
  choice: и будут посрамлены
  rationale: בוש обозначает стыд, позор или посрамление. Вав с формой, внешне совпадающей с нарративным претеритом, здесь может выражать желаемое или ожидаемое следствие; пассивно-результативное «будут посрамлены» естественно передаёт публичный позор.
- source_word: וְעַבְדְּךָ
  choice: а Твой слуга
  rationale: Сочетание означает «Твой слуга/раб». «Слуга» естественно для молитвенного самообозначения и не выдвигает на первый план правовой статус; союз передан как контрастный.
- source_word: יִשְׂמָח
  choice: возрадуется
  rationale: Каль, имперфект от שמח, обозначает радость. «Возрадуется» сохраняет будущую направленность и возвышенный поэтический регистр.
theological_decisions:
- issue: К кому относится выражение «Твой слуга»
  choice: Молящийся смиренно называет так самого себя.
  alternative: Обобщённый образ праведного слуги или мессианское прочтение.
  rationale: В непосредственном контексте псалма это самообозначение говорящего в молитве. Перевод не исключает дальнейших канонических применений, но не вносит их в сам стих.
- issue: Модальность проклятия и благословения
  choice: 'Обе начальные формы переданы волитивно: «Пусть они проклинают, а Ты благослови».'
  alternative: 'Уступительно-будущее прочтение: «Пусть они проклинают, но Ты благословишь» или «Они проклинают, а Ты благословляешь».'
  rationale: Еврейские имперфекты допускают более одного оттенка. В молитвенном контексте согласованное волитивное прочтение естественно, а подлинная неоднозначность отражена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической окраской. Заглавные местоимения при обращении к Богу сохранены по русской библейской традиции. Тире подчёркивает следствие, не добавляя нового смыслового элемента.
