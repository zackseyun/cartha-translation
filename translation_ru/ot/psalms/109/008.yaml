    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: да будут
  rationale: Имперфект в контексте проклятия передаёт пожелание; «да будут» естественно сохраняет оптативно-импрекативную силу.
- source_word: יָמָיו
  choice: дни его
  rationale: Прямо передаёт форму множественного числа с суффиксом 3-го лица мужского рода; по контексту речь о продолжительности жизни.
- source_word: מְעַטִּים
  choice: немногочисленны
  rationale: Сохраняет буквальный образ малого числа дней, не заменяя его истолкованием «коротки».
- source_word: פְּקֻדָּתוֹ
  choice: его должность
  rationale: Обозначает вверенную обязанность или назначенное положение; «должность» понятно современному читателю и не вводит специально церковного смысла.
- source_word: יִקַּח
  choice: пусть … займёт
  rationale: В параллели с первой строкой имперфект имеет побудительно-пожелательное значение; «займёт должность» — естественное русское сочетание.
- source_word: אַחֵר
  choice: другой
  rationale: Прямой и идиоматичный эквивалент.
theological_decisions:
- issue: Значение פְּקֻדָּתוֹ с учётом последующего цитирования в Деян 1:20
  choice: должность
  alternative: надзор; поручение; место служения
  rationale: Еврейское слово допускает значения вверенной ответственности, надзора и назначенного положения. «Должность» сохраняет широту назначенной роли и согласуется с возможностью новозаветного применения, не превращая стих псалма в техническое описание церковного сана.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического проклятия. Конструкция «да будут …; пусть …» передаёт параллельные пожелательные формы, а порядок «дни его» слегка возвышает регистр, оставаясь понятным.
