base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/021.yaml
  text: But you[a], O Lord Yahweh, deal with me for your name’s sake; because your steadfast love is good[d][c][b], deliver me.
translation:
  language: ru
  text: Но Ты, Господи, Владыка мой[a], поступи со мной ради имени Твоего, ибо блага милость Твоя[b] — избавь меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте подряд стоят имя Бога YHWH и титул Адонай. YHWH традиционно передаётся по-русски обращением «Господи»; Адонай означает «Владыка мой».
    reason: alternative_reading
  - marker: b
    text: Еврейское хесед может также означать неизменную любовь, преданную милость или верность обязательствам.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Но Ты
  rationale: Местоимение с союзом противопоставляет Господа враждебным людям из ближайшего контекста; «Но Ты» естественно передаёт этот контраст.
- source_word: יְהוָה אֲדֹנָי
  choice: Господи, Владыка мой
  rationale: 'Сохранены оба следующих подряд божественных обращения: имя YHWH передано традиционным русским «Господи», а אֲדֹנָי — «Владыка мой».'
- source_word: עֲשֵׂה אִתִּי
  choice: поступи со мной
  rationale: Буквально широкое «сделай со мной» в данном молитвенном контексте означает просьбу Богу поступить с молящимся благосклонно; перевод сохраняет некоторую неопределённость выражения.
- source_word: לְמַעַן שְׁמֶךָ
  choice: ради имени Твоего
  rationale: Передаёт устойчивое обращение к Божьему имени, то есть к Его явленному характеру и славе, не разворачивая это толкование в основном тексте.
- source_word: כִּי טוֹב חַסְדְּךָ
  choice: ибо блага милость Твоя
  rationale: «Ибо» передаёт основание просьбы, טוֹב сохраняется как «блага», а חֶסֶד — как ёмкое и привычное для русской псалмовой речи «милость».
- source_word: הַצִּילֵנִי
  choice: избавь меня
  rationale: Глагол означает избавить или вырвать из опасности; «избавь меня» точно и уместно для возвышенной молитвенной речи.
theological_decisions:
- issue: Двойное божественное обращение יְהוָה אֲדֹנָי
  choice: Господи, Владыка мой
  alternative: Господь, мой Владыка; Господи Боже
  rationale: Перевод не сливает имя YHWH и титул אֲדֹנָי в одно обозначение и сохраняет личное «мой» в соответствии с масоретским чтением.
- issue: Смысл עֲשֵׂה אִתִּי
  choice: поступи со мной
  alternative: вступись за меня; сотвори со мной
  rationale: Контекст подразумевает благоприятное Божье действие, однако еврейское выражение само по себе широко. Поэтому основной текст не уточняет его до «вступись», сохраняя напряжение просьбы.
- issue: Передача חֶסֶד
  choice: милость
  alternative: неизменная любовь; верная любовь; заветная верность
  rationale: «Милость» естественна и богословски ненавязчива в современном русском библейском регистре, а примечание отмечает присущие слову оттенки верности и постоянства.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой молитвы. Умеренная инверсия («блага милость Твоя») сохраняет поэтический строй, оставаясь понятной; прописные местоимения выбраны как традиционная русская форма почтительного обращения к Богу.
