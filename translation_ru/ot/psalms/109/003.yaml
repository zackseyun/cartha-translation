lexical_decisions:
- source_word: דִבְרֵי שִׂנְאָה
  choice: словами ненависти
  rationale: Сочетание означает враждебные, исполненные ненависти высказывания. Творительный оборот естественно передаёт по-русски то, чем враги окружают говорящего, сохраняя образ текста.
- source_word: סְבָבוּנִי
  choice: окружают меня
  rationale: Глагол סבב обозначает окружение или обступание. Настоящее время передаёт ярко изображённую продолжающуюся враждебность и согласуется с поэтическим контекстом.
- source_word: וַיִּלָּחֲמוּנִי
  choice: борются со мной
  rationale: Форма от לחם означает сражаться или вести борьбу против кого-либо. Выбранный вариант сохраняет образ противостояния, не ограничивая его исключительно буквальной войной.
- source_word: חִנָּם
  choice: без причины
  rationale: Наречие указывает на отсутствие основания для враждебных действий и подчёркивает их несправедливость.
