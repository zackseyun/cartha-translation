lexical_decisions:
- source_word: זֹאת
  choice: Вот
  rationale: Указательное местоимение с подразумеваемой связкой вводит итоговое утверждение; «вот» естественно и выразительно передаёт эту функцию по-русски.
- source_word: פְּעֻלַּת
  choice: воздаяние
  rationale: Буквально существительное обозначает «дело, действие», но в данном контексте речь идёт о том, что противники получат от Яхве. «Воздаяние» сохраняет отрицательный контекстуальный смысл, не уточняя сверх текста его конкретную форму.
- source_word: שֹׂטְנַי
  choice: моим обвинителям
  rationale: Форма от שׂטן может обозначать как противников вообще, так и обвинителей. В псалме особенно заметны словесные обвинения, поэтому «обвинителям» уместно, а более широкое значение отмечено в сноске.
- source_word: מֵאֵת
  choice: от
  rationale: Предлог указывает на источник или действующее лицо; краткое «от» точно сохраняет эту связь.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: וְהַדֹּבְרִים רָע
  choice: и тем, кто говорит злое
  rationale: Союз сохранён, причастная конструкция передана естественным русским придаточным оборотом, а רָע — существительным «злое», сохраняющим нравственную окраску.
- source_word: עַל נַפְשִׁי
  choice: против моей жизни
  rationale: נֶפֶשׁ здесь может означать душу, жизнь или самого человека. «Против моей жизни» передаёт конкретную угрозу в контексте и не сводит выражение к современному узкому представлению о душе.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Связь между «обвинителями» и «теми, кто говорит злое»
  choice: Сохранены две соединённые союзом группы
  alternative: 'Понять вторую группу как пояснение к первой: «обвинителям, то есть тем, кто говорит злое»'
  rationale: Еврейский союз допускает как простое присоединение, так и пояснительное прочтение. Перевод с «и» формально сохраняет конструкцию и не устраняет возможное смысловое совпадение групп.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис краткий и ясный; сохранены союзная структура оригинала, личное имя Яхве и контекстуально значимые лексические альтернативы в сносках.
