  yaml_path: translation/ot/psalms/109/020.yaml
  text: This is the reward of my accusers from Yahweh[b][a], and of those who speak evil against my life.
translation:
  language: ru
  text: Таково воздаяние[a] от Яхве моим обвинителям[b] и тем, кто говорит зло против моей жизни[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дело» или «результат действий». В данном контексте слово означает то, что будет дано противникам в отплату.'
