  text: Like a shadow when it lengthens[a], I am gone[c][b]; I am shaken off like a locust.
translation:
  language: ru
  text: Как тень, когда она удлиняется[a], я исчезаю[b]; меня стряхивают, как саранчу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда она склоняется» или «когда она простирается»; еврейский глагол может описывать, как вечерняя тень вытягивается или клонится.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я ухожу» или «я прохожу»; буквально употреблён глагол «идти», который здесь передаёт исчезновение.'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово обычно означает «саранча»; возможен также перевод «кузнечик».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצֵל
  choice: как тень
  rationale: Префикс כְּ выражает сравнение, а צֵל означает «тень»; русский оборот естественно сохраняет образ.
- source_word: כִּנְטוֹתוֹ
  choice: когда она удлиняется
  rationale: Форма от נטה может означать «простираться, склоняться, поворачиваться»; в образе вечерней тени «удлиняется» ясно передаёт временное и поэтическое значение, не устраняя иных оттенков.
- source_word: נֶהֱלָכְתִּי
  choice: я исчезаю
  rationale: Нифаль глагола הלך буквально связан с уходом; здесь в сопоставлении с тенью он передаёт исчезновение или уход. «Я исчезаю» звучит естественно и сохраняет образ бренности.
- source_word: נִנְעַרְתִּי
  choice: меня стряхивают
  rationale: Нифаль от נער выражает действие «быть стряхнутым, вытряхнутым». Личная пассивная конструкция точно и естественно передаёт уязвимость говорящего.
- source_word: כָּאַרְבֶּה
  choice: как саранчу
  rationale: אַרְבֶּה обычно означает «саранча». В русском после «стряхивают» винительный падеж естественно передаёт сравнение.
