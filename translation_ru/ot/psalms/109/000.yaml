  text: לַ֭/מְנַצֵּחַ לְ/דָוִ֣ד מִזְמ֑וֹר אֱלֹהֵ֥י תְ֝הִלָּתִ֗/י אַֽל תֶּחֱרַֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. O God of my praise[b], do not be silent.
translation:
  language: ru
  text: 'Руководителю хора. Псалом Давида[a].


    Боже моей хвалы, не молчи[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Псалом для Давида» или «Псалом о Давиде»; еврейское надписание допускает разные толкования.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «не храни молчания».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Традиционное и понятное обозначение лица, которому предназначена песнь; еврейский термин указывает на руководителя исполнения, хотя точный характер его должности не вполне ясен.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: Боже моей хвалы
  rationale: 'Сохранена сжатая конструкция оригинала и её смысловая широта: Бог является Тем, Кому обращена хвала псалмопевца, и может мыслиться как её источник.'
- source_word: אַל־תֶּחֱרַשׁ
  choice: не молчи
  rationale: Прямо передаёт просьбу к Богу не оставаться безмолвным и естественно звучит по-русски.
theological_decisions:
- issue: Значение надписания לְדָוִד
  choice: Псалом Давида
  alternative: Псалом для Давида / о Давиде
  rationale: Наиболее естественное традиционное понимание связывает псалом с Давидом, но предлог допускает и другие отношения; неоднозначность отмечена в сноске.
- issue: Отношение Бога к «хвале» в אֱלֹהֵי תְהִלָּתִי
  choice: Боже моей хвалы
  alternative: Боже, Которого я прославляю
  rationale: Буквально-сжатая формулировка не ограничивает выражение только значением объекта хвалы и сохраняет поэтическое богословское напряжение оригинала.
translation_notes:
  register: Современный литературный русский с лаконичной, возвышенной поэтической формой. Необычное, но ясное выражение «Боже моей хвалы» намеренно сохраняет образность и неоднозначность еврейского текста.
