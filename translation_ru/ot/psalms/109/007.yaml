lexical_decisions:
- source_word: בְּהִשָּׁפְטוֹ
  choice: Когда его будут судить
  rationale: Предлог בְּ с инфинитивом нифаля и суффиксом 3-го лица имеет временное значение. Формулировка сохраняет пассивный и судебный смысл и естественно звучит по-русски.
- source_word: יֵצֵא רָשָׁע
  choice: пусть он выйдет виновным
  rationale: В контексте суда יֵצֵא описывает исход разбирательства, а רָשָׁע — обвинительный вердикт. Частица «пусть» передаёт желательное значение формы в ряду проклятий-просьб.
- source_word: וּתְפִלָּתוֹ
  choice: и пусть его молитва
  rationale: תְּפִלָּה означает «молитва»; повторение «пусть» ясно выражает параллельную просьбу.
- source_word: תִּהְיֶה לַחֲטָאָה
  choice: вменится ему в грех
  rationale: Конструкция היה ל может обозначать становление или результат. «Вменится ему в грех» естественно передаёт судебно-оценочный смысл, не утверждая, будто молитва буквально превращается в некую сущность.
theological_decisions:
- issue: Модальная сила глагольных форм в контексте молитвы о воздаянии
  choice: 'Передать как пожелание-просьбу: «пусть… и пусть…»'
  alternative: 'Предсказательное будущее: «он выйдет… его молитва станет…»'
  rationale: Контекст псалма поддерживает желательное прочтение, однако перевод не усиливает его сверх выраженной в еврейском последовательности форм.
- issue: Смысл לַחֲטָאָה применительно к молитве
  choice: «вменится ему в грех»
  alternative: «станет грехом»
  rationale: Так передаётся вероятный смысл отрицательной оценки молитвы, при этом буквальная альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Судебная образность сохранена; синтаксис двух параллельных пожеланий передан явно.
