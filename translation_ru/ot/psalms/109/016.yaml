lexical_decisions:
- source_word: יַעַן אֲשֶׁר
  choice: за то, что
  rationale: Оборот вводит основание суда, выраженного в ближайшем контексте; «за то, что» естественно связывает проступок с воздаянием.
- source_word: לֹא זָכַר עֲשׂוֹת חָסֶד
  choice: не помнил о том, чтобы творить милость
  rationale: זָכַר с инфинитивом означает помнить о должном действии и исполнять его. «Творить милость» сохраняет конкретный этический смысл חֶסֶד и допускает оттенки доброты, верной любви и преданности.
- source_word: וַיִּרְדֹּף
  choice: но преследовал
  rationale: «Преследовал» передаёт образ настойчивой погони; союз «но» естественно подчёркивает противопоставление между отказом от милости и активным гонением уязвимого человека.
- source_word: אִישׁ עָנִי וְאֶבְיוֹן
  choice: бедного и нуждающегося
  rationale: Сохраняются единственное число и парное обозначение материально и социально уязвимого человека; слово אִישׁ по-русски естественно подразумевается в субстантивированных прилагательных.
- source_word: וְנִכְאֵה לֵבָב
  choice: сокрушённого сердцем
  rationale: Выражение буквально описывает человека, чьё сердце сокрушено; форма согласована с единичным, вероятно собирательно-представительным образом жертвы.
- source_word: לְמוֹתֵת
  choice: чтобы умертвить его
  rationale: Инфинитив передаёт цель или итог преследования. Единственное число местоимения сохраняет грамматическую форму еврейского описания и его образ одной типичной жертвы.
