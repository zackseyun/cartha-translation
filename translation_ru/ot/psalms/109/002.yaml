  rationale: Союз вводит основание для мольбы псалмопевца; «ибо» естественно передаёт причинно-пояснительную связь и соответствует возвышенному поэтическому регистру.
- source_word: פִי רָשָׁע
  choice: уста нечестивого
  rationale: 'Буквально: «уста нечестивого»; субстантивированное прилагательное в единственном числе сохранено без превращения в собирательное множественное.'
- source_word: וּפִי מִרְמָה
  choice: и уста коварства
  rationale: Сохранены повтор слова «уста» и абстрактная конструкция оригинала. מִרְמָה обозначает обман, коварство или вероломство; «коварство» здесь естественно выражает враждебный обман.
- source_word: עָלַי פָּתָחוּ
  choice: отверзлись против меня
  rationale: Множественное сказуемое соотносится с двумя параллельными обозначениями уст. «Против меня» передаёт враждебную направленность עָלַי, а «отверзлись» сохраняет образ оригинала в достойном поэтическом регистре.
- source_word: דִּבְּרוּ אִתִּי
  choice: они говорят со мной
  rationale: Предлог אִתִּי буквально допускает «со мной»; настоящее время по-русски естественно передаёт актуальное состояние, выраженное еврейским перфектом в жалобе. Конструкция намеренно не уточняет сверх текста, обращена ли речь непосредственно к псалмопевцу или ведётся о нём в его присутствии.
- source_word: לְשׁוֹן שָׁקֶר
  choice: лживым языком
  rationale: Сохранён конкретный образ «языка», а שֶׁקֶר передано естественным русским прилагательным «лживый».
