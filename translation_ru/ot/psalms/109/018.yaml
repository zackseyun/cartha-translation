base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/018.yaml
  text: He clothed himself with cursing as his garment[a]; it came into his inward parts like water[c][b], and like oil into his bones.
translation:
  language: ru
  text: Он облекся проклятием, словно одеждой своей; оно проникло в его внутренности, как вода, и в его кости, как масло.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Или: «внутрь него»; возможно также: «в его внутреннее существо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְבַּשׁ
  choice: Он облёкся
  rationale: Возвратный глагол сохраняет значение «одеться, облечься» и образ добровольно надетой одежды.
- source_word: קְלָלָה
  choice: проклятием
  rationale: Русское «проклятие» может обозначать и произнесённое проклятие, и его действие, поэтому сохраняет смысловую широту еврейского существительного.
- source_word: כְּמַדּוֹ
  choice: как своей одеждой
  rationale: מַד означает одежду или одеяние; такой перевод естественно продолжает метафору облечения и передаёт суффикс принадлежности.
- source_word: וַתָּבֹא
  choice: оно вошло
  rationale: Местоимение соотнесено с «проклятием»; глагол движения передаёт проникновение внутрь.
- source_word: כַמַּיִם
  choice: словно вода
  rationale: Прямо сохранено сравнение, выражающее глубокое проникновение.
- source_word: בְּקִרְבּוֹ
  choice: в него
  rationale: В данном телесном параллелизме выражение означает внутренность человека; краткая русская формулировка звучит естественно, а буквальный оттенок отмечен в сноске.
- source_word: וְכַשֶּׁמֶן
  choice: словно масло
  rationale: Сохранено прямое сравнение; в контексте масло изображает проникновение, а не благословение.
- source_word: בְּעַצְמוֹתָיו
  choice: в его кости
  rationale: Предлог передан направительным «в» после глагола «вошло», что сохраняет образ проникновения до самых костей.
theological_decisions:
- issue: Образ проклятия и действующая сила
  choice: Стих изображает человека облекшимся проклятием, которое затем проникает в него самого, не уточняя непосредственную божественную причинность.
  alternative: Прямо указать, что Бог навёл на него проклятие, либо свести образ только к психологическому последствию.
  rationale: Еврейский текст описывает самооблечение проклятием и его последующее проникновение, но в этом стихе не называет механизм действия; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с сохранением плотного телесного параллелизма и возвышенной поэтической образности; пунктуация подчёркивает два сопоставленных образа проникновения.
