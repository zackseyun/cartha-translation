    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующей мольбы; «ибо» сохраняет причинно-пояснительную связь и соответствует возвышенному, но понятному регистру псалма.
- source_word: עָנִי
  choice: беден
  rationale: Слово может обозначать бедного, угнетённого или страдающего человека. В устойчивой паре с אֶבְיוֹן перевод «беден» сохраняет прямой смысл, не сужая его до одного вида страдания.
- source_word: אֶבְיוֹן
  choice: нуждаюсь
  rationale: Передаёт состояние нужды и беспомощности, отличая этот член пары от עָנִי. Глагольная форма естественна по-русски после «я беден».
- source_word: אָנֹכִי
  choice: я
  rationale: Самостоятельное местоимение в еврейском подчёркивает говорящего; русское «я» сохраняет это явное личное указание.
- source_word: לִבִּי
  choice: сердце моё
  rationale: «Сердце» сохраняет библейский образ внутреннего человека, включая чувства, мысли и волю; постпозиция местоимения поддерживает поэтический регистр.
- source_word: חָלַל
  choice: изранено
  rationale: В данном контексте глагол выражает нанесение глубокой раны, вплоть до пронзения или смертельного поражения. «Изранено» естественно сочетается с «сердце» и не устраняет диапазон образа.
- source_word: בְּקִרְבִּי
  choice: во мне
  rationale: Фраза буквально указывает на внутреннее пространство говорящего. «Во мне» кратко и точно сохраняет внутреннюю локализацию.
