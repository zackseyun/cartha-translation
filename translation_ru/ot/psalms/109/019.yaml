  text: תְּהִי ל֭/וֹ כְּ/בֶ֣גֶד יַעְטֶ֑ה וּ֝/לְ/מֵ֗זַח תָּמִ֥יד יַחְגְּרֶֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/019.yaml
  text: May it be like a garment that he wraps around himself[a], and like a belt that he always girds on.
translation:
  language: ru
  text: Да будет оно ему как одежда, в которую он облачается,[a] и как пояс, которым он всегда подпоясывается.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да будет оно ему как одежда, которую он надевает, и как пояс, которым он постоянно подпоясывается».'
    reason: 'Лексическая альтернатива для עטה и חגר: возможен более бытовой перевод «надевает / подпоясывается» вместо «облачается / подпоясывается»; «постоянно» передаёт תָּמִיד.'
lexical_decisions:
- source_word: תְּהִי
  choice: Да будет
  rationale: Юссив Qal, 3-е лицо женского рода единственного числа, в контексте проклятия выражает пожелание; «да будет» сохраняет эту силу и соответствует возвышенному, но понятному русскому регистру.
- source_word: ל֭וֹ
  choice: для него
  rationale: Предлог с местоименным суффиксом обозначает отношение к человеку, на которого направлено пожелание; в русском это естественно передаётся словами «для него».
- source_word: כְּבֶגֶד
  choice: как одежда
  rationale: בגד — общее обозначение одежды; такой перевод сохраняет метафору, не уточняя без основания вид одеяния.
- source_word: יַעְטֶה
  choice: в которую он облачается
  rationale: Глагол עטה может означать покрываться, облекаться или облачаться. Выбор сохраняет образ одежды, охватывающей человека, и не добавляет отсутствующего возвратного местоимения.
- source_word: וּלְמֵזַח
  choice: и как пояс
  rationale: מֵזַח обозначает пояс или опоясывающую повязку. «Пояс» — ясный современный эквивалент, сохраняющий предметный образ.
- source_word: תָּמִיד
  choice: всегда
  rationale: Наречие передаёт постоянство или непрерывную повторяемость; «всегда» естественно выражает это по-русски.
- source_word: יַחְגְּרֶהָ
  choice: которым он всегда опоясывается
  rationale: חגר означает подпоясываться или опоясываться; суффикс 3-го лица женского рода относится к подразумеваемому предмету женского рода. Русская относительная конструкция сохраняет конкретный образ подпоясывания и согласуется со словом «пояс» по смыслу.
theological_decisions:
- issue: Юссивная сила в контексте проклятия
  choice: 'Передать как пожелание: «Да будет…»'
  alternative: 'Предсказательное будущее: «Оно будет…»'
  rationale: Форма глагола и контекст псалма поддерживают значение пожелания суда, а не простого сообщения о будущем; перевод сохраняет риторическую напряжённость текста, не добавляя богословского истолкования.
- issue: Неопределённый референт местоимения женского рода
  choice: Сохранить местоименное «оно», опирающееся на содержание предыдущего стиха
  alternative: Явно назвать «проклятие»
  rationale: В данном стихе референт не назван заново. Явное добавление слова «проклятие» сняло бы формальную неоднозначность, поэтому в основном тексте сохранено местоимение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной формой пожелания «да будет». Образы одежды и пояса сохранены; архаичное «препоясывается» не использовано. Маркер [a] помещён непосредственно после первой образной конструкции.
