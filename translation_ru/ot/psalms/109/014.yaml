id: PSA.109.14
reference: Psalms 109:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: יִזָּכֵ֤ר עֲוֺ֣ן אֲ֭בֹתָי/ו אֶל יְהוָ֑ה וְ/חַטַּ֥את אִ֝מּ֗/וֹ אַל תִּמָּֽח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/014.yaml
  text: May the guilt of his fathers be remembered before Yahweh[c][b][a], and may the sin of his mother not be blotted out.
translation:
  language: ru
  text: Да будет вспомнена перед Яхве вина его отцов[a][b], и да не изгладится грех его матери[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беззаконие его отцов». Еврейское עָוֹן может означать беззаконие, вину или ответственность, возникающую вследствие греха.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его отцов»; по смыслу возможно также «его праотцов» или «его предков».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «да не будет стёрт грех его матери».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזָּכֵר
  choice: да будет вспомнена
  rationale: Нифаль imperfect употреблён как пожелание в контексте проклятия. Пассивная конструкция сохраняет форму еврейского текста и связь с последующим «да не изгладится».
- source_word: עֲוֺן
  choice: вина
  rationale: עָוֹן может обозначать беззаконие, вину или ответственность и последствия греха. Здесь «вина» естественно передаёт нравственную ответственность, вспоминаемую перед Богом.
- source_word: אֲבֹתָיו
  choice: его отцов
  rationale: Буквально сохранён термин родства; в данном контексте он может охватывать прежние поколения мужских предков.
- source_word: אֶל יְהוָה
  choice: перед Яхве
  rationale: При глаголе זכר сочетание с אֶל выражает представление вины на память Богу, в его присутствии. «Перед Яхве» сохраняет направленность и судебный оттенок выражения.
- source_word: וְחַטַּאת
  choice: и ... грех
  rationale: חַטָּאת здесь обозначает грех, а не жертву за грех, и образует смысловой параллелизм с עָוֹן.
- source_word: אִמּוֹ
  choice: его матери
  rationale: Прямое и естественное соответствие еврейскому существительному с притяжательным суффиксом.
- source_word: אַל תִּמָּח
  choice: да не изгладится
  rationale: Отрицательное пожелание передаёт образ стирания записи или устранения вины. «Изгладится» сохраняет библейско-юридический образ, оставаясь понятным в современном литературном русском языке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит тетраграмматон; форма «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Ответственность за грехи предков
  choice: Сохранено буквальное пожелание о том, чтобы вина отцов была вспомнена
  alternative: Истолковать выражение как наказание адресата за грехи предков либо только как память об их собственных грехах
  rationale: Стих не разъясняет механизм и меру ответственности. Перевод сохраняет напряжение исходного текста и не добавляет богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмической формой «да будет / да не изгладится». Пассивная конструкция намеренно сохранена ради соответствия еврейскому тексту; имя Яхве передано прямо.
