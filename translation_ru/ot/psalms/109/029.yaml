  text: Пусть мои обвинители[a] облекутся позором и закутаются в свой стыд, словно в плащ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мои противники». Еврейское слово может обозначать как противников вообще, так и обвинителей в более узком, судебном смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִלְבְּשׁוּ
  choice: пусть ... облекутся
  rationale: Имперфект Qal, 3-е лицо множественного числа от לבשׁ, в контексте молитвы-проклятия естественно передаётся как пожелание. «Облекутся» сохраняет образ надевания позора как одежды.
- source_word: שׂוֹטְנַי
  choice: мои обвинители
  rationale: Причастная форма множественного числа от שׂטן с суффиксом 1-го лица единственного числа может обозначать как противников вообще, так и обвинителей. В судебно-враждебном контексте псалма уместно «мои обвинители», при сохранении альтернативы в сноске.
- source_word: כְּלִמָּה
  choice: позор
  rationale: Существительное обозначает публичный стыд, бесчестье или унижение. «Позор» естественно сочетается с «облекутся» и позволяет отличить его от בָּשְׁתָּם, переданного как «своим стыдом».
- source_word: וְיַעֲטוּ
  choice: и ... окутаются
  rationale: Имперфект Qal, 3-е лицо множественного числа от עטה, передаёт действие окутывания или покрытия себя. Возвратное «окутаются» естественно продолжает метафору одежды.
- source_word: כַמְעִיל
  choice: словно плащом
  rationale: מְעִיל — верхняя одежда, мантия или плащ. Творительный падеж после «окутаются» ясно и естественно передаёт сравнительный образ исходного текста.
- source_word: בָּשְׁתָּם
  choice: своим стыдом
  rationale: Форма существительного בֹּשֶׁת с суффиксом 3-го лица множественного числа означает «их стыд». При совпадении субъекта в русском возвратное притяжательное «своим» точнее и естественнее.
theological_decisions:
- issue: Наклонение глаголов в молитве-проклятии
  choice: 'Передать имперфекты как пожелание-молитву: «Пусть ... облекутся ... и ... окутаются».'
  alternative: 'Будущее или предсказание: «Мои обвинители облекутся ... и окутаются».'
  rationale: В контексте прошений Псалма 109 формы естественно имеют юссивное значение. Такая передача сохраняет характер обращения к Богу и не превращает пожелание в безусловное предсказание.
translation_notes:
  register: 'Современный литературный русский язык с достоинством поэтической молитвы. Сохранена единая метафора одежды: «облекутся», «окутаются», «плащом»; различены близкие по смыслу כְּלִמָּה («позор») и בָּשְׁתָּם («стыд»).'
