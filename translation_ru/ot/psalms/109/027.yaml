lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: Пусть узнают
  rationale: Форма Qal imperfect 3-го лица множественного числа с союзом в данном контексте имеет желательное значение и выражает молитвенное пожелание псалмопевца.
- source_word: כִּי
  choice: что
  rationale: Союз вводит содержание того, что должны узнать, а не причину.
- source_word: יָדְךָ
  choice: Твоя рука
  rationale: Сохранён буквальный образ руки как обозначения Божьего действия и силы.
- source_word: זֹּאת
  choice: это
  rationale: Указательное местоимение относится к упомянутому действию или вмешательству; нейтральное «это» не сужает смысл.
- source_word: אַתָּה
  choice: Ты
  rationale: Отдельное личное местоимение имеет эмфатическую функцию; явное «Ты» перед именем сохраняет акцент.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: עֲשִׂיתָהּ
  choice: совершил это
  rationale: Глагол עשה с суффиксом женского рода указывает на действие, выраженное предшествующим זֹּאת; «совершил» естественно передаёт осуществлённое Божье деяние.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Характер Божьего участия
  choice: Сохранён образ «Твоя рука» и прямое утверждение «Ты… совершил это»
  alternative: Разъяснить как «это произошло благодаря Твоей силе»
  rationale: Исходный текст прямо утверждает Божье действие и использует метафору руки; перевод не ослабляет и не расширяет это утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Заглавные буквы в местоимениях «Твоя» и «Ты» поддерживают традиционный русский библейский регистр; тире подчёркивает именную конструкцию «это — Твоя рука».
