  text: 'Пусть узнают, что это — Твоя рука: Ты, Яхве, совершил это.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «И пусть узнают…» или «Да узнают…»; еврейская форма в контексте имеет пожелательное значение.'
