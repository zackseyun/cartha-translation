base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/015.yaml
  text: May they be before Yahweh continually[a], and may he cut off their memory from the earth.
translation:
  language: ru
  text: Пусть они всегда будут перед Яхве, и пусть Он изгладит память о них с земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из страны»; еврейское אֶרֶץ может означать как «землю», так и «страну».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִהְיוּ
  choice: Да будут
  rationale: Имперфект Qal, 3-е лицо множественного числа, в контексте молитвы-проклятия передаёт пожелание; конструкция «да будут» сохраняет юссивную силу.
- source_word: נֶגֶד
  choice: пред
  rationale: Обозначает пребывание перед кем-либо, в его присутствии; «пред» естественно для возвышенного поэтического регистра.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, не заменяя его титулом.
- source_word: תָּמִיד
  choice: всегда
  rationale: Передаёт непрерывность и постоянство; в современном русском звучит естественнее, чем более книжное «непрестанно».
- source_word: וְיַכְרֵת
  choice: и да истребит Он
  rationale: Имперфект Hiphil, 3-е лицо единственного числа, вслед за первой юссивной формой также выражает пожелание. «Истребит» передаёт каузативное устранение и идиому полного уничтожения памяти.
- source_word: מֵאֶרֶץ
  choice: с земли
  rationale: אֶרֶץ допускает значения «земля» и «страна»; в данном выражении «с земли» естественно передаёт всеобъемлющее исчезновение из человеческой памяти, не исключая локального значения.
- source_word: זִכְרָם
  choice: память о них
  rationale: Передаёт память, сохраняемую о людях, и по-русски яснее и естественнее буквального «их память», которое может означать их способность помнить.
theological_decisions:
- issue: Юссивная сила проклятия-молитвы
  choice: 'Оба глагола переданы как пожелания: «Да будут… и да истребит…»'
  alternative: 'Будущее утверждение: «Они будут… и Он истребит…»'
  rationale: Контекст молитвы-проклятия и последовательность еврейских имперфектов поддерживают юссивное прочтение. Перевод сохраняет резкость и богословское напряжение текста, не смягчая его.
- issue: Референт местоимения при וְיַכְרֵת
  choice: «Он» с прописной буквы как указание на Яхве
  alternative: 'Безличная или неявная передача субъекта: «и да истребится память о них»'
  rationale: Единственный явно названный субъект, подходящий к форме 3-го лица единственного числа, — Яхве. Активная конструкция сохраняет грамматику оригинала.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Формы «да будут», «пред Яхве» и «да истребит» сохраняют молитвенно-импрекативный строй; лексика остаётся понятной обычному читателю.
