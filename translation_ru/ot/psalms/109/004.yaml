  text: תַּֽחַת אַהֲבָתִ֥/י יִשְׂטְנ֗וּ/נִי וַ/אֲנִ֥י תְפִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/004.yaml
  text: In return for my love[a], they accuse me, but I am prayer.
translation:
  language: ru
  text: За мою любовь они обвиняют меня, а я — молитва.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, передавая смысл более явно: «а я молюсь» или «а я — человек молитвы». Буквально по-еврейски: «а я — молитва».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: за
  rationale: 'В данном контексте предлог выражает ответное воздаяние или обмен: обвинение становится ответом на любовь. Русское «за мою любовь» естественно передаёт этот смысл.'
- source_word: אַהֲבָתִי
  choice: мою любовь
  rationale: Прямо передаёт существительное от корня אהב и сохраняет обычную библейскую лексику любви.
- source_word: יִשְׂטְנוּנִי
  choice: они обвиняют меня
  rationale: Глагол שטן в этой форме означает выступать против кого-либо как противник или обвинитель; «обвиняют» сохраняет присущий контексту состязательный, возможно судебный оттенок.
- source_word: וַאֲנִי
  choice: а я
  rationale: Формально союз может означать «и», но здесь он противопоставляет поведение врагов ответу говорящего; русское «а я» естественно выражает этот контраст.
- source_word: תְפִלָּה
  choice: молитва
  rationale: Еврейская безглагольная фраза буквально означает «а я — молитва». Сохранение существительного передаёт её необычную сжатость и выразительность, не сводя смысл к одному толкованию.
theological_decisions:
- issue: Смысл безглагольной фразы וַאֲנִי תְפִלָּה
  choice: Сохранить образное «а я — молитва».
  alternative: «а я молюсь»; «а я — человек молитвы»
  rationale: Исходный текст допускает понимание постоянной молитвы или полной преданности молитве, но выражает это предельно сжатой именной конструкцией. Основной текст сохраняет напряжение и образность оригинала, а более явные варианты вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным ритмом. Тире обозначает подразумеваемую связку в еврейской безглагольной фразе; необычная метафора сохранена намеренно.
