  register: Современный литературный русский язык с сохранением лаконичного поэтического параллелизма. Конкретные существительные «проклятие» и «благословение» передают антитезу оригинала; синтаксис намеренно не уточняет, идёт ли речь о действии, состоянии или конкретном произнесённом проклятии.
