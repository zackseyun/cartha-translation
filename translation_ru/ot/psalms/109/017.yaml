  text: וַ/יֶּאֱהַ֣ב קְ֭לָלָה וַ/תְּבוֹאֵ֑/הוּ וְֽ/לֹא חָפֵ֥ץ בִּ֝/בְרָכָ֗ה וַ/תִּרְחַ֥ק מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/017.yaml
  text: He loved cursing[a], and it came upon him; he did not delight in blessing[b], and it was far from him.
translation:
  language: ru
  text: Он любил проклятие[a], и оно пришло на него; не желал благословения[b], и оно было далеко от него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Он любил проклинать». Еврейское существительное может обозначать как проклятие вообще, так и отдельное произнесённое проклятие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не находил удовольствия в благословении».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: любил
  rationale: Форма глагола אהב прямо выражает любовь, привязанность или сильное расположение; «любил» сохраняет волевой и эмоциональный оттенок.
- source_word: קְלָלָה
  choice: проклятие
  rationale: Единственное число существительного может обозначать как проклятие вообще, так и конкретное проклятие. Русское «проклятие» сохраняет эту неоднозначность и параллель с «благословением».
- source_word: וַתְּבוֹאֵהוּ
  choice: оно пришло на него
  rationale: Глагол בוא с местоименным суффиксом буквально передаёт приход проклятия к человеку или на него. Оборот «пришло на него» сохраняет образ исходного текста, не усиливая его до «постигло».
- source_word: וְלֹא חָפֵץ
  choice: не желал
  rationale: חפץ охватывает желание, удовольствие и расположение. «Не желал» естественно звучит по-русски и сохраняет волевой контраст с «любил».
- source_word: בִּבְרָכָה
  choice: благословения
  rationale: Существительное образует прямую антитезу слову «проклятие» и здесь естественно передаётся как благословение в общем смысле.
- source_word: וַתִּרְחַק מִמֶּנּוּ
  choice: оно было далеко от него
  rationale: רחק означает быть или стать далёким. Формулировка сохраняет образ пространственной удалённости, не добавляя однозначно ни ухода, ни длительного пребывания.
