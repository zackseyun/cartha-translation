lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: воздали
  rationale: Глагол שׂים буквально означает «класть, помещать», однако в сочетании с עָלַי и параллельными оборотами с תַּחַת выражает ответное воздаяние. «Воздали» естественно передаёт эту обменную направленность, не устраняя буквальную возможность, отмеченную в сноске.
- source_word: עָלַי
  choice: мне
  rationale: Предлог עַל с суффиксом буквально означает «на меня», но при русском глаголе «воздали» естественно передаётся дательным дополнением «мне».
- source_word: רָעָה
  choice: злом
  rationale: «Зло» сохраняет широкое нравственное и враждебное значение слова רָעָה и образует прямую антитезу с «добром».
- source_word: תַּחַת
  choice: за
  rationale: В обоих полустишиях תַּחַת обозначает замену или ответный обмен. Русское «за» кратко и естественно передаёт смысл «в ответ на».
- source_word: טוֹבָה
  choice: добро
  rationale: «Добро» сохраняет широту еврейского слова и поэтическое противопоставление злу, не сужая смысл до конкретного благодеяния.
- source_word: וְשִׂנְאָה
  choice: и ненавистью
  rationale: Абстрактное существительное «ненависть» точно соответствует форме источника; творительный падеж продолжает конструкцию «воздали ... чем».
- source_word: אַהֲבָתִי
  choice: мою любовь
  rationale: Буквальное «моя любовь» сохраняет лаконичность и не уточняет сверх текста, была ли речь о чувстве, отношении или проявленной любви.
