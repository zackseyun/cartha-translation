lexical_decisions:
- source_word: יְנַקֵּשׁ
  choice: захватит
  rationale: Пиэль глагола נקש буквально связан с постановкой западни и поимкой; при подлежащем «заимодавец» и объекте «всё, что ему принадлежит» контекст указывает на наложение руки на имущество. «Захватит» естественно передаёт результат этого действия, не превращая образ в буквальную ловушку.
- source_word: נ֭וֹשֶׁה
  choice: заимодавец
  rationale: Слово обозначает того, кто дал взаймы и взыскивает долг. «Заимодавец» точно и достаточно понятно передаёт юридико-экономический смысл, сохраняя возвышенный регистр.
- source_word: לְכָל אֲשֶׁר לוֹ
  choice: всё, что ему принадлежит
  rationale: Оборот охватывает всё имущество человека и естественно звучит по-русски.
- source_word: וְיָבֹזּוּ
  choice: разграбят
  rationale: Глагол בזז означает насильственно брать добычу, грабить; «разграбят» сохраняет хищнический и насильственный оттенок.
- source_word: זָרִים
  choice: чужие
  rationale: זָרִים — посторонние, не принадлежащие к семье или своему кругу. «Чужие» не сужает значение до иностранцев и подходит поэтическому контексту.
- source_word: יְגִיעוֹ
  choice: нажитое его трудом
  rationale: יְגִיעַ здесь обозначает не сам труд, а его плод, приобретённое тяжёлым трудом. Выбранный оборот ясно передаёт предмет разграбления.
theological_decisions:
- issue: Пожелательно-проклятийная сила форм yiqtol
  choice: 'Передать обе формы как пожелание: «Пусть… захватит… и пусть… разграбят…»'
  alternative: 'Будущее время как предсказание: «Заимодавец захватит… и чужие разграбят…»'
  rationale: В череде проклятий Псалма 109 формы выражают пожелание или молитвенное прошение, а не простое сообщение о будущем. Конструкция «пусть» сохраняет эту силу и присущее тексту богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. «Заимодавец» предпочтён разговорному «кредитор» в библейско-поэтическом контексте; синтаксический параллелизм оригинала сохранён.
