  text: My knees give way from fasting[a], and my flesh grows lean from lack of fat.
translation:
  language: ru
  text: 'Колени мои ослабели от поста,

    и плоть моя исхудала, лишившись жира.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально еврейское выражение можно передать: «плоть моя исхудала без жира»; речь идёт об утрате телесного жира, то есть об истощении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּרְכַּי
  choice: колени мои
  rationale: Форма множественного числа с суффиксом первого лица обозначает колени как часть тела; этот прямой смысл соответствует образу физической слабости.
- source_word: כָּשְׁלוּ
  choice: ослабели
  rationale: Глагол выражает шаткость, спотыкание или неспособность устоять. В сочетании с коленями и постом «ослабели» естественно передаёт физическое изнеможение, не добавляя падения как совершившегося действия.
- source_word: מִצּוֹם
  choice: от поста
  rationale: 'Предлог מִן здесь указывает на причину: колени ослабели вследствие поста. «От поста» кратко и естественно сохраняет эту связь.'
- source_word: וּבְשָׂרִי
  choice: и плоть моя
  rationale: Существительное בשר буквально означает «плоть». Сохранение этого слова поддерживает конкретный телесный образ еврейского текста и уместно в возвышенной поэтической речи.
- source_word: כָּחַשׁ
  choice: исхудала
  rationale: Глагол обозначает уменьшение, истощение или потерю упитанности. «Исхудала» точно и естественно описывает результат продолжительного лишения пищи.
- source_word: מִשָּׁמֶן
  choice: лишившись жира
  rationale: Буквальное сочетание с предлогом допускает сжатое «без жира» или «от жира», но по смыслу описывает утрату телесного жира, то есть истощение. Причастный оборот делает этот образ понятным по-русски, не заменяя его общим словом «истощение».
