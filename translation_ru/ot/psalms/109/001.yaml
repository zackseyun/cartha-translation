lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов слово обычно обозначает музыкального руководителя; этот вариант естественен в современном русском языке и сохраняет адресную форму еврейского выражения.
- source_word: לְדָוִד
  choice: Давидов
  rationale: Краткая традиционная форма сохраняет связь псалма с Давидом, не сводя неоднозначный предлог ל исключительно к прямому авторству; возможные отношения пояснены в сноске.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшееся и точное русское обозначение жанра.
- source_word: אֱלֹהֵי תְהִלָּתִי
  choice: Боже хвалы моей
  rationale: 'Буквально передаёт сопряжённую конструкцию «Бог моей хвалы» и сохраняет поэтическую многозначность: Бог является предметом и основанием хвалы.'
- source_word: אַל תֶּחֱרַשׁ
  choice: не молчи
  rationale: Естественно передаёт отрицание с формой просьбы/побуждения и контекстуальный смысл призыва к Богу не оставаться безответным.
theological_decisions:
- issue: Значение надписания לְדָוִד
  choice: Передать как «Давидов» и пояснить неоднозначность в сноске
  alternative: «Давида», «Давиду», «для Давида» или «от Давида»
  rationale: Еврейский предлог может указывать на авторство, посвящение или более широкую связь. Перевод не должен превращать возможное авторство в более категоричное утверждение, чем допускает источник.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-поэтической речи. Инверсия «Боже хвалы моей» намеренно сохраняет образ и структуру еврейского текста; архаизмы сведены к минимуму.
