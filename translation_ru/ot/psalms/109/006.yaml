source:
  edition: WLC
  text: הַפְקֵ֣ד עָלָ֣י/ו רָשָׁ֑ע וְ֝/שָׂטָ֗ן יַעֲמֹ֥ד עַל יְמִינֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/109/006.yaml
  text: Appoint a wicked man over him[a], and let an accuser stand at his right hand.
translation:
  language: ru
  text: Поставь над ним нечестивца, и пусть обвинитель встанет по правую руку от него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и пусть Сатана встанет по правую руку от него». Еврейское слово может означать «обвинитель», «противник», а в некоторых контекстах употребляется как имя «Сатана».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַפְקֵד
  choice: Поставь
  rationale: Каузативный императив породы хифиль от פקד здесь означает назначить или поставить кого-либо над другим; «поставь» естественно передаёт повеление и не уточняет должность сверх текста.
- source_word: עָלָיו
  choice: над ним
  rationale: При פקד предлог על обычно указывает на лицо, над которым кого-либо ставят; это лучше всего соответствует административно-судебному оттенку контекста.
- source_word: רָשָׁע
  choice: нечестивца
  rationale: Субстантивированное прилагательное обозначает нечестивого человека. Форма «нечестивца» кратка, ясна и сохраняет личный референт.
- source_word: שָׂטָן
  choice: обвинитель
  rationale: 'В данном судебном контексте слово естественно понимать как нарицательное: «обвинитель» или «противник». Выбор «обвинитель» поддерживается следующим образом судебного разбирательства, не исключая указанной в сноске иной трактовки.'
- source_word: יַעֲמֹד
  choice: пусть … встанет
  rationale: Имперфект после императива имеет здесь юссивное значение; конструкция «пусть … встанет» естественно передаёт пожелание-проклятие.
- source_word: עַל יְמִינוֹ
  choice: по правую руку от него
  rationale: Выражение обозначает положение справа от человека, здесь, вероятно, в судебной сцене. Русский оборот сохраняет пространственный образ и библейское звучание.
theological_decisions:
- issue: Следует ли передавать שָׂטָן как имя собственное «Сатана» или как нарицательное существительное
  choice: 'нарицательное: «обвинитель»'
  alternative: «Сатана»; «противник»
  rationale: Еврейская форма сама по себе не требует понимания как имени собственного, а ближайший контекст имеет судебный характер. «Обвинитель» передаёт вероятный смысл, не привнося более позднее демонологическое толкование; подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренным библейским звучанием. Синтаксис сохраняет параллелизм и императивно-юссивную форму оригинала; неоднозначность שָׂטָן вынесена в сноску.
