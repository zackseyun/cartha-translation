  text: עֵֽדֹתֶ֨י/ךָ נֶאֶמְנ֬וּ מְאֹ֗ד לְ/בֵיתְ/ךָ֥ נַאֲוָה קֹ֑דֶשׁ יְ֝הוָ֗ה לְ/אֹ֣רֶךְ יָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/005.yaml
  text: Your testimonies are very trustworthy[a]; holiness befits your house, O Yahweh[b], for length of days.
translation:
  language: ru
  text: Твои свидетельства совершенно надёжны; святость подобает Твоему дому, Яхве, навеки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на долготу дней».'
    reason: Сохранение буквального образа еврейской идиомы длительности.
lexical_decisions:
- source_word: עֵדֹתֶיךָ
  choice: Твои свидетельства
  rationale: Сохраняет основной смысл божественных свидетельств и заветных возвещений, не сужая его до одних лишь законов или постановлений.
- source_word: נֶאֶמְנוּ מְאֹד
  choice: совершенно надёжны
  rationale: Форма от אמן выражает твёрдость и достоверность; מְאֹד усиливает признак. Такое сочетание естественно и ясно звучит по-русски.
- source_word: לְבֵיתְךָ
  choice: Твоему дому
  rationale: Передаёт буквальный образ дома Бога, сохраняя подразумеваемое значение святилища или храма.
- source_word: נַאֲוָה קֹדֶשׁ
  choice: святость подобает
  rationale: נַאֲוָה указывает на уместность и соответствие, а קֹדֶשׁ здесь естественно понимается как отвлечённое понятие «святость».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לְאֹרֶךְ יָמִים
  choice: навеки
  rationale: Буквально «на долготу дней»; это устойчивое обозначение длительности, естественно передаваемое здесь словом «навеки». Буквальный образ отмечен в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Длительность, выраженная לְאֹרֶךְ יָמִים
  choice: навеки
  alternative: на долготу дней; на долгие дни
  rationale: Идиома указывает на непрекращающуюся длительность, однако её буквальная образность не полностью совпадает с русским «навеки», поэтому она сохранена в сноске.
- issue: Синтаксическая связь заключительной фразы
  choice: «навеки» относится к утверждению о святости Божьего дома
  alternative: возможна менее естественная связь с обращением «Яхве»
  rationale: Порядок слов допускает некоторую поверхностную неоднозначность, но смысл и синтаксис лучше поддерживают связь временной фразы со святостью, подобающей Божьему дому.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмового высказывания. Сохранены образ «дома» и личное имя Яхве; архаичные обороты не используются.
