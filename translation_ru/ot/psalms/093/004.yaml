base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/004.yaml
  text: More majestic than the sound of many waters[a], than the mighty breakers of the sea[b], is Yahweh on high.
translation:
  language: ru
  text: Яхве в вышине сильнее шума многих вод, сильнее могучих морских валов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִקֹּלוֹת
  choice: могущественнее шума
  rationale: Предлог מִן в данном контексте естественно передаёт сравнение, а קוֹל применительно к водам означает «шум, гул». Сравнительная форма вынесена к началу строки в соответствии с еврейским порядком и поэтическим движением.
- source_word: מַיִם רַבִּים
  choice: многих вод
  rationale: Сохранён библейский образ «многих вод» без сужения смысла до моря или океана.
- source_word: אַדִּירִים
  choice: могучих
  rationale: Прилагательное выражает силу, величие и внушительность; «могучих» естественно согласуется с морскими валами и сохраняет связь с последующим אַדִּיר.
- source_word: מִשְׁבְּרֵי יָם
  choice: морских валов
  rationale: מִשְׁבָּר обозначает разбивающуюся, накатывающую морскую волну. «Морские валы» передают мощь прибоя в литературном русском языке.
- source_word: אַדִּיר
  choice: могущественнее
  rationale: Единственное число служит сказуемым при имени Яхве. Сравнительная форма по-русски ясно выражает превосходство над силами вод, подразумеваемое начальным מִן.
- source_word: בַּמָּרוֹם
  choice: в вышине
  rationale: Передаёт возвышенное местопребывание и положение, не конкретизируя его словом «небо» сверх еврейского текста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное Божье имя передано распространённой русской транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон, поэтому личное имя сохранено; примечание сообщает традиционную замену титулом.
- issue: Синтаксическая роль начального מִן
  choice: 'Сравнение: Яхве могущественнее шума вод и морских валов'
  alternative: 'Описание могучих вод с последующим самостоятельным утверждением: «могуч в вышине Яхве»'
  rationale: Начальное מִן наиболее естественно имеет сравнительное значение, однако сжатый параллелизм допускает менее связное прочтение; оно сохранено в примечании.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Слова «могучих» и «могущественнее» удерживают повтор корня אַדיר, а тире подчёркивает кульминационное появление Божьего имени.
