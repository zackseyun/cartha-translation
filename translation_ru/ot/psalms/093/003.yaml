lexical_decisions:
- source_word: נָשְׂאוּ / יִשְׂאוּ
  choice: подняли / поднимают
  rationale: Глагол נשׂא означает «поднимать, нести». Два перфекта переданы прошедшим видом «подняли», а заключительный имперфект — ярким настоящим «поднимают», чтобы сохранить нарастание поэтического параллелизма.
- source_word: נְהָרוֹת
  choice: реки
  rationale: Обычное значение существительного — «реки». Вариант «потоки» лучше подчёркивает образ бушующих вод, однако для основного текста выбран прямой лексический эквивалент.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом. Частица «о» естественно оформляет прямое обращение по-русски.
- source_word: קוֹלָם
  choice: свой голос
  rationale: קוֹל может означать голос, звук или шум. «Свой голос» сохраняет поэтическое олицетворение рек.
- source_word: דָּכְיָם
  choice: свои грохочущие волны
  rationale: Редкое слово обозначает сокрушительный удар или грохот воды и, вероятно, прибойные волны. Развёрнутая передача ясно выражает образ для современного читателя, не скрывая лексической неопределённости, отмеченной в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве, в обращении «о Яхве»
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Тройной повтор «реки» и глагола «поднять» сохраняет структуру и нарастание оригинала; начальная смысловая неполнота («подняли реки…») намеренно удерживает эллипсис еврейской строки.
