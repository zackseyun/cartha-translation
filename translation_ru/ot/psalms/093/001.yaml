source:
  edition: WLC
  text: יְהוָ֣ה מָלָךְ֮ גֵּא֪וּת לָ֫בֵ֥שׁ לָבֵ֣שׁ יְ֭הוָה עֹ֣ז הִתְאַזָּ֑ר אַף תִּכּ֥וֹן תֵּ֝בֵ֗ל בַּל תִּמּֽוֹט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/001.yaml
  text: Yahweh reigns[a]; he is clothed with majesty; Yahweh is clothed with strength; he has girded himself. Indeed, the world is established[e][d][c][b]; it will not be moved.
translation:
  language: ru
  text: 'Яхве царствует[a], Он облечён величием;

    Яхве облечён силой, Он препоясался[b].

    Да, вселенная утверждена — она не поколеблется[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Яхве стал царём»; еврейский глагол допускает начинательное значение, хотя здесь, вероятнее всего, провозглашается Его царствование.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «Он препоясался»; речь идёт об образе силы, которую надевают, словно пояс или воинское снаряжение.'
    reason: cultural_note
  - marker: c
    text: 'Или: «обитаемый мир прочно установлен — он не пошатнётся».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: מָלָךְ
  choice: царствует
  rationale: В контексте псалма форма провозглашает нынешнее царское владычество Яхве; возможное начинательное значение отмечено в сноске.
- source_word: גֵּאוּת
  choice: величие
  rationale: По отношению к Яхве слово обозначает возвышенное царственное величие, а не отрицательную гордость.
- source_word: לָבֵשׁ
  choice: облечён
  rationale: Сохранён повторяющийся поэтический образ одеяния; возвышенный, но понятный русский глагол соответствует жанру псалма.
- source_word: עֹז
  choice: сила
  rationale: Прямое и естественное обозначение могущества в образе облачения.
- source_word: הִתְאַזָּר
  choice: препоясался ею
  rationale: Возвратная форма и образ препоясывания сохранены; местоимение связывает образ с упомянутой силой, как естественно подразумевает контекст.
- source_word: אַף
  choice: Да
  rationale: Частица передана как торжественное подтверждение и усиление следующего утверждения.
- source_word: תִּכּוֹן
  choice: утверждена
  rationale: Передаёт состояние прочной установленности мира.
- source_word: תֵּבֵל
  choice: вселенная
  rationale: В поэтическом русском языке естественно обозначает обитаемый, упорядоченный мир и сохраняет отличие от обычного слова «земля».
- source_word: בַּל תִּמּוֹט
  choice: она не поколеблется
  rationale: Передаёт устойчивость перед возможным потрясением или падением и естественно звучит по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя; транслитерация «Яхве» сохраняет это отличие, не подменяя имя титулом.
- issue: Видо-временное значение מָלָךְ
  choice: настоящее «царствует»
  alternative: «стал Царём»
  rationale: Главный текст провозглашает действительное царствование Яхве, но еврейская форма допускает начинательное понимание, поэтому оно сохранено в сноске.
- issue: Связь עֹז с הִתְאַזָּר
  choice: сила относится к облачению и подразумевается при препоясывании
  alternative: «Яхве облечён и препоясался силой»
  rationale: Порядок и синтаксис еврейского текста прежде всего связывают «силу» с «облечён», однако образ препоясывания продолжает ту же мысль; местоимение даёт естественный русский текст без устранения образа.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим строем. Сохранены параллелизм, повтор имени Яхве и образы облачения и препоясывания; инверсия «величием Он облечён» служит ритму и смысловому акценту, оставаясь понятной современному читателю.
