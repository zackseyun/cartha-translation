  text: נָכ֣וֹן כִּסְאֲ/ךָ֣ מֵ/אָ֑ז מֵֽ/עוֹלָ֣ם אָֽתָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/093/002.yaml
  text: Your throne is established from of old[a]; you are from everlasting.
translation:
  language: ru
  text: Престол Твой утверждён издревле[a]; Ты — от вечности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Престол Твой утверждён с древних времён; Ты — от вечности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: утверждён
  rationale: Форма выражает прочное, установленное состояние престола; краткое страдательное причастие естественно передаёт этот статический смысл по-русски.
- source_word: כִּסְאֲךָ
  choice: Престол Твой
  rationale: כִּסֵּא имеет обычное значение «престол», а суффикс 2-го лица мужского рода единственного числа передан притяжательным местоимением. Постпозиция «Твой» поддерживает возвышенный поэтический регистр без чрезмерной архаизации.
- source_word: מֵאָז
  choice: издревле
  rationale: В контексте слово указывает на отдалённую древность. «Издревле» лаконично и поэтично передаёт значение «с давних времён».
- source_word: מֵעוֹלָם
  choice: от вечности
  rationale: Применительно к Богу выражение обозначает безграничную древность, уходящую в вечность; «от вечности» сохраняет временную формулировку еврейского текста.
- source_word: אָתָּה
  choice: Ты
  rationale: Самостоятельное местоимение образует безглагольное именное предложение с предшествующим обстоятельственным выражением; тире естественно восполняет отсутствующую в настоящем времени связку.
theological_decisions:
- issue: Временной язык о существовании Бога
  choice: Ты — от вечности
  alternative: Ты существуешь от века
  rationale: Выбранный вариант утверждает предвечное бытие Бога, но не вводит более позднюю метафизическую терминологию и сохраняет образную временную форму исходного текста.
- issue: Соотношение древности престола и вечности Бога
  choice: издревле; Ты — от вечности
  alternative: с древних времён; Ты — извечно
  rationale: Различные русские выражения сохраняют параллелизм и вместе с тем не стирают оттеночную разницу между מֵאָז и מֵעוֹלָם.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмической интонацией. Инверсия «Престол Твой» и слово «издревле» уместны в поэзии и остаются понятными современному читателю.
