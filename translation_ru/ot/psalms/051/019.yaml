  text: הֵיטִ֣יבָ/ה בִ֭/רְצוֹנְ/ךָ אֶת צִיּ֑וֹן תִּ֝בְנֶ֗ה חוֹמ֥וֹת יְרוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/019.yaml
  text: In your good pleasure[a], do good to Zion[b]; build up the walls of Jerusalem.
translation:
  language: ru
  text: По Своему благоволению[a] окажи Сиону благодеяние; возведи[b] стены Иерусалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по Своей милости»; или: «по Своей воле».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «построй»; в смысле восстановления — «отстрой заново».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיבָה
  choice: сделай добро
  rationale: Побудительная форма породы hифиль от יטב выражает молитвенную просьбу к Богу благотворно действовать; «сделай добро» прямо и естественно передаёт эту просьбу.
- source_word: בִּרְצוֹנְךָ
  choice: по Своему благоволению
  rationale: רָצוֹן может обозначать благоволение, расположение или волю. «По Своему благоволению» сохраняет смысл Божьей доброй воли и Его благосклонности.
- source_word: אֶת צִיּוֹן
  choice: Сиону
  rationale: При русском выражении «сделать добро» дательный падеж естественно обозначает Сион как объект и получателя благодеяния.
- source_word: תִּבְנֶה
  choice: возведи
  rationale: Имперфект Qal после повелительной формы имеет значение последующей просьбы. «Возведи» подходит к стенам и не решает однозначно, идёт ли речь о первоначальном строительстве или восстановлении.
- source_word: חוֹמוֹת
  choice: стены
  rationale: Конкретное множественное число обозначает городские стены; «укрепления» было бы шире исходного значения.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалима
  rationale: Традиционная и общепринятая русская форма топонима в родительном падеже после слова «стены».
theological_decisions:
- issue: Связь Божьего благоволения и восстановления
  choice: Стих передан как молитва о том, чтобы Божье благоволение выразилось в ощутимом благе для Сиона и в возведении стен Иерусалима.
  alternative: «По Своей воле сделай добро Сиону» — прочтение, подчёркивающее прежде всего Божье волеизъявление.
  rationale: Еврейское רָצוֹן охватывает как благосклонность, так и волю. Формулировка «по Своему благоволению» сохраняет оба оттенка, не сводя выражение только к отвлечённой воле.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Местоимение «Своему» написано с прописной буквы по устойчивой русской библейской традиции; синтаксис остаётся ясным для обычного читателя.
