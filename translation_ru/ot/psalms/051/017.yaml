  text: For you do not delight in sacrifice[a], or I would give it; you do not take pleasure in burnt offering.
translation:
  language: ru
  text: Ведь жертвы Ты не желаешь — иначе я принёс бы её; всесожжение Тебе не угодно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Потому что Ты не желаешь жертвы, а то я принёс бы её». Еврейский союз и порядок частей допускают такой более буквальный перевод.'
    reason: Лексико-синтаксический вариант передачи כִּי и וְאֶתֵּנָה.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для предшествующей мысли; «ведь» естественно передаёт пояснительно-причинную связь в русском поэтическом рассуждении.
- source_word: לֹא תַחְפֹּץ
  choice: не желаешь
  rationale: Глагол חפץ обозначает желание и благоволение; здесь «не желаешь» звучит естественно и не усиливает высказывание до полного отрицания жертвоприношений как установления.
- source_word: זֶבַח
  choice: жертвы
  rationale: Обычный и достаточно точный русский термин для культовой жертвы; родительный падеж обусловлен отрицательной конструкцией.
- source_word: וְאֶתֵּנָה
  choice: иначе я принёс бы её
  rationale: Контекст позволяет понять союз как вводящий следствие нереализованного условия. «Принёс бы» идиоматично для принесения жертвы; местоимение восполняет подразумеваемый объект.
- source_word: עוֹלָה
  choice: всесожжение
  rationale: Устоявшийся точный русский термин для жертвы, целиком сжигаемой на жертвеннике.
- source_word: לֹא תִרְצֶה
  choice: Тебе не угодно
  rationale: Передаёт отсутствие благосклонного принятия или удовольствия, сохраняя отличие רצה от предшествующего חפץ.
theological_decisions:
- issue: Смысл отрицания жертвы
  choice: Сохранено прямое утверждение, что в данной ситуации Бог не желает жертвы и что всесожжение Ему не угодно.
  alternative: Истолковать стих как всеобщее упразднение или безусловное отвержение любых жертвоприношений.
  rationale: Сам стих не формулирует универсального запрета и не объясняет отношения к жертвенной системе в целом. Перевод сохраняет напряжение между ритуалом и покаянным сердцем, не добавляя доктринального вывода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции; архаизмы и конфессионально маркированные добавления исключены.
