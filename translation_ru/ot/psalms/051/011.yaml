  text: לֵ֣ב טָ֭הוֹר בְּרָא לִ֣/י אֱלֹהִ֑ים וְ/ר֥וּחַ נָ֝כ֗וֹן חַדֵּ֥שׁ בְּ/קִרְבִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/011.yaml
  text: Create in me a clean heart[a], O God[b], and renew a steadfast spirit within me.
translation:
  language: ru
  text: Сердце чистое[a] сотвори во мне, Боже, и дух стойкий[b] обнови внутри меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сердце непорочное».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дух правый»; еврейское слово также несёт смысл твёрдости, устойчивости или утверждённости.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֵב טָהוֹר
  choice: сердце чистое
  rationale: Сохраняет образ «сердца» как внутреннего центра воли, мысли и чувств. «Чистое» естественно передаёт нравственно-очистительный смысл טָהוֹר и созвучно общей теме очищения в псалме.
- source_word: בְּרָא לִי
  choice: сотвори во мне
  rationale: «Сотвори» сохраняет особую связь ברא с Божьим творческим действием. Хотя לִי буквально означает «мне/для меня», сочетание «во мне» естественно выражает внутреннее преображение, о котором просит псалмопевец.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Русская звательная форма ясно передаёт прямое молитвенное обращение.
- source_word: רוּחַ נָכוֹן
  choice: дух стойкий
  rationale: «Дух» сохраняет широту רוּחַ и параллелизм с «сердцем», а «стойкий» передаёт основную идею устойчивости, твёрдости и постоянства в נָכוֹן.
- source_word: חַדֵּשׁ בְּקִרְבִּי
  choice: обнови внутри меня
  rationale: «Обнови» естественно передаёт просьбу о внутреннем восстановлении и оживлении; «внутри меня» явно сохраняет пространственно-внутренний смысл בְּקִרְבִּי.
theological_decisions:
- issue: Значение נָכוֹן в выражении רוּחַ נָכוֹן
  choice: дух стойкий
  alternative: дух правый; дух твёрдый; дух утверждённый
  rationale: В данном контексте слово прежде всего указывает на устойчивость и твёрдость, хотя возможно и понимание нравственной правоты. Перевод «стойкий» сохраняет акцент на постоянстве внутренней верности, не исключая нравственного оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Порядок слов отчасти следует еврейскому оригиналу, но остаётся естественным для русского стиха. Маркер [b] поставлен при выражении «дух стойкий», к которому относится примечание.
