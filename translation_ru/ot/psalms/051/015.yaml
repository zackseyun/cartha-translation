source:
  edition: WLC
  text: הַצִּ֘ילֵ֤/נִי מִ/דָּמִ֨ים אֱֽלֹהִ֗ים אֱלֹהֵ֥י תְּשׁוּעָתִ֑/י תְּרַנֵּ֥ן לְ֝שׁוֹנִ֗/י צִדְקָתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/015.yaml
  text: Deliver me from bloodguilt[a], O God, God of my salvation[b], and my tongue will sing aloud of your righteousness.
translation:
  language: ru
  text: Избавь меня от вины за пролитую кровь[a], Боже, Бог моего спасения, — и язык мой воспоёт Твою праведность[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от кровей»; возможно также: «от кровопролития». Еврейское выражение нередко означает вину за пролитую кровь.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Твою справедливость». Еврейское слово может обозначать как праведность, так и справедливость, в том числе явленную в Божьем спасительном действии.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַצִּילֵנִי
  choice: Избавь меня
  rationale: Императив породы hифиль от נצל с суффиксом 1-го лица ед. числа выражает мольбу об избавлении; русский глагол естественно передаёт просьбу без уточнения способа спасения.
- source_word: מִדָּמִים
  choice: от вины за пролитую кровь
  rationale: Множественное число דמים буквально означает «крови», но часто служит идиомой для кровопролития и связанной с ним виновности. В покаянном контексте развернутая формулировка ясно передаёт именно вину, сохраняя альтернативу в сноске.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма передана русским звательным обращением, естественным для возвышенной молитвенной речи.
- source_word: אֱלֹהֵי תְּשׁוּעָתִי
  choice: Бог моего спасения
  rationale: Сохранена конструкция принадлежности и традиционно-поэтическое значение תְּשׁוּעָה; выражение не сужено до одного конкретного вида избавления.
- source_word: תְּרַנֵּן
  choice: воспоёт
  rationale: Глагол רנן обозначает громкое радостное пение или возглашение. «Воспоёт» естественно сочетается с подлежащим «язык» и сохраняет возвышенный поэтический регистр.
- source_word: לְשׁוֹנִי
  choice: язык мой
  rationale: Сохранён исходный поэтический образ языка как орудия хвалы, а не заменён безобразным местоимением «я».
- source_word: צִדְקָתֶךָ
  choice: Твою праведность
  rationale: צדקה охватывает нравственную правоту, справедливость и верность Бога. «Праведность» сохраняет широкий диапазон, а судебный оттенок отмечен в сноске.
theological_decisions:
- issue: Значение множественного דמים в покаянной молитве
  choice: вина за пролитую кровь
  alternative: кровопролитие; пролитая кровь
  rationale: Контекст исповедания указывает не только на само кровопролитие, но и на виновность молящегося. При этом неоднозначность идиомы не скрыта, а отмечена в сноске.
- issue: Смысл צִדְקָתֶךָ применительно к Богу
  choice: Твоя праведность
  alternative: Твоя справедливость; Твоя спасающая праведность
  rationale: Основной вариант не сводит слово исключительно ни к судебному воздаянию, ни к спасительному действию, тем самым сохраняя присущую еврейскому термину богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Инверсия «язык мой» и глагол «воспоёт» поддерживают поэтический регистр, оставаясь понятными современному читателю. Тире перед следствием передаёт переход от мольбы к обещанию хвалы.
