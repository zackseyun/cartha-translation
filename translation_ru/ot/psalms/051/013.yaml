source:
  edition: WLC
  text: הָשִׁ֣יבָ/ה לִּ֭/י שְׂשׂ֣וֹן יִשְׁעֶ֑/ךָ וְ/ר֖וּחַ נְדִיבָ֣ה תִסְמְכֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/013.yaml
  text: Restore to me the joy of your salvation[c][b][a], and let a willing spirit sustain me.
translation:
  language: ru
  text: Верни мне радость Твоего спасения[a], и пусть дух готовности[b] поддержит меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоего избавления».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «щедрый дух» или «благородный дух». Еврейский текст не уточняет, Божий ли это Дух или внутренний дух молящегося.'
    reason: lexical_and_interpretive_ambiguity
  - marker: c
    text: 'Или: «укрепит меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשִׁיבָה
  choice: Верни
  rationale: Каузативный императив от שוב выражает просьбу сделать так, чтобы прежде испытанная радость возвратилась. «Верни» естественно и точно передаёт эту просьбу.
- source_word: לִּי
  choice: мне
  rationale: Предлог с суффиксом первого лица указывает на получателя возвращаемой радости.
- source_word: שְׂשׂוֹן
  choice: радость
  rationale: Существительное означает радость, веселье или ликование; «радость» здесь наиболее естественно и не усиливает образ без основания.
- source_word: יִשְׁעֶךָ
  choice: Твоего спасения
  rationale: ישׁע охватывает значения спасения и избавления. «Спасение» сохраняет широкое значение Божьего спасительного действия в контексте покаянного псалма.
- source_word: וְרוּחַ
  choice: и пусть дух
  rationale: В данном поэтическом контексте רוּחַ обозначает дух, а союз связывает вторую просьбу с первой. Конструкция «пусть» естественно передаёт просительное значение формы глагола.
- source_word: נְדִיבָה
  choice: готовности
  rationale: Прилагательное может означать готовность, добровольность, щедрость или благородство. Выражение «дух готовности» передаёт внутреннюю свободную готовность и при этом не определяет прямо, чей это дух.
- source_word: תִסְמְכֵנִי
  choice: поддержит меня
  rationale: Глагол סמך означает поддерживать, укреплять или удерживать. Форма здесь имеет просительное значение; «пусть… поддержит меня» передаёт это естественным современным русским языком.
theological_decisions:
- issue: Значение выражения «Твоего спасения» в покаянном псалме
  choice: Твоего спасения
  alternative: Твоего избавления
  rationale: Еврейское слово допускает оба смысла. «Спасение» сохраняет полноту значения в контексте греха, очищения и обновления, не сводя просьбу только к избавлению от временной беды.
- issue: Смысл и принадлежность «духа готовности»
  choice: дух готовности
  alternative: щедрый дух; благородный дух
  rationale: Перевод не уточняет, идёт ли речь о Божьем Духе или об обновлённом внутреннем духе молящегося, поскольку еврейский текст этого прямо не определяет. Основной вариант передаёт готовность и свободное расположение, а другие значения сохранены в примечании.
- issue: Синтаксическая роль слова «дух»
  choice: пусть дух готовности поддержит меня
  alternative: поддержи меня духом готовности
  rationale: Согласование существительного женского рода רוּחַ с глагольной формой допускает понимание «духа» как подлежащего. Этот вариант сохраняет естественный параллелизм просьб и не вводит прямо не выраженного обращения к Богу во второй части.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью без архаизмов. «Дух готовности» выбрано вместо устаревшего «дух доброхотный»; конструкция с «пусть» ясно передаёт просьбу. Местоимение «Твоего» написано с прописной буквы по принятой русской благоговейной традиции обращения к Богу.
