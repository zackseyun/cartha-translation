  text: הַסְתֵּ֣ר פָּ֭נֶי/ךָ מֵ/חֲטָאָ֑/י וְֽ/כָל עֲוֺ֖נֹתַ֣/י מְחֵֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/010.yaml
  text: Hide your face from my sins[b][a], and blot out all my iniquities.
translation:
  language: ru
  text: Скрой Своё лицо от моих грехов и сотри[a] все мои беззакония[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изгладь» или «вытри».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «вину».
    reason: lexical_alternative
lexical_decisions:
- source_word: הַסְתֵּר
  choice: Скрой
  rationale: Повелительная форма породы hифиль от סתר выражает просьбу не смотреть на грехи молящегося. «Скрой» сохраняет конкретный образ и силу повеления, не заменяя его толкованием «отвернись».
- source_word: פָּנֶיךָ
  choice: Своё лицо
  rationale: פנים буквально означает «лицо» и здесь образно передаёт Божье внимание. Возвратное «Своё» естественно в современном русском при обращении к Богу и сохраняет еврейский образ.
- source_word: מֵחֲטָאָי
  choice: от моих грехов
  rationale: חטא обозначает грехи или проступки; «грехов» — прямой и естественный эквивалент. Предлог «от» передаёт מִן и сохраняет конструкцию исходного текста.
- source_word: וְכָל
  choice: и все
  rationale: Союз וְ и כָּל прямо переданы как «и все», связывая две просьбы и подчёркивая полноту.
- source_word: עֲוֺנֹתַי
  choice: мои беззакония
  rationale: עָוֹן может обозначать как беззаконие, так и связанную с ним вину. «Беззакония» сохраняет отличие этого слова от חטא («грехи»), а возможность значения «вина» отмечена в сноске.
- source_word: מְחֵה
  choice: сотри
  rationale: Повелительная форма מחה означает стереть, изгладить или уничтожить запись. «Сотри» естественно по-русски и сохраняет образ полного удаления.
theological_decisions:
- issue: Различение двух обозначений греха
  choice: חטא передано как «грехи», а עון — как «беззакония»
  alternative: Передать оба слова как «грехи» либо передать עון как «вина»
  rationale: В еврейском тексте употреблены разные слова в параллельных просьбах. Их различение сохраняет поэтическое усиление, не превращая лексику стиха в жёсткую богословскую классификацию.
- issue: 'Смысл עון: проступок или вина'
  choice: В основном тексте — «беззакония», значение «вина» дано в сноске
  alternative: «Всю мою вину»
  rationale: Слово способно обозначать и неправедный поступок, и возникшую вследствие него виновность. Контекст допускает обе стороны значения, поэтому неоднозначность не устраняется молча.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Сохранены конкретные образы «скрыть лицо» и «стереть», но избегнуты ненужные архаизмы. Местоимение при обращении к Богу написано с прописной буквы в соответствии с принятой русской библейской традицией.
