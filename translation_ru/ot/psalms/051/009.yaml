lexical_decisions:
- source_word: תַּשְׁמִיעֵנִי
  choice: Дай мне услышать
  rationale: Хифиль от שׁמע с суффиксом 1-го лица ед. числа буквально имеет каузативный смысл «сделай так, чтобы я услышал». В молитвенном русском «дай мне услышать» естественно передаёт и каузативность, и просьбу.
- source_word: שָׂשׂוֹן וְשִׂמְחָה
  choice: ликование и радость
  rationale: Два близких по значению существительных сохранены как поэтическая пара без тавтологического повторения; «ликование» передаёт оттенок торжества у שׂשׂון, а «радость» — широкое значение שׂמחה.
- source_word: תָּגֵלְנָה
  choice: и возрадуются
  rationale: Имперфект 3-го лица жен. рода мн. числа согласуется с עֲצָמוֹת и в молитвенно-поэтическом контексте выражает желаемый результат. Русское будущее после просьбы естественно сохраняет эту направленность.
- source_word: עֲצָמוֹת
  choice: кости
  rationale: В еврейском тексте нет притяжательного суффикса «мои», поэтому он не добавлен; из контекста ясно, что речь идёт о костях псалмопевца.
- source_word: דִּכִּיתָ
  choice: Ты сокрушил
  rationale: Форма 2-го лица муж. рода ед. числа прямо обращена к Богу. «Сокрушил» сохраняет сильную метафору тяжёлого поражения и естественно сочетается с образом костей.
theological_decisions:
- issue: Страдание прямо приписано Богу
  choice: которые Ты сокрушил
  alternative: сокрушённые кости / кости, которые Ты сломал
  rationale: Еврейская форма непосредственно называет Бога действующим лицом. Перевод сохраняет эту богословскую напряжённость и не переводит высказывание в страдательный залог.
translation_notes:
  register: Современный литературный русский с молитвенно-поэтической торжественностью. Местоимение «Ты» написано с прописной буквы как уважительное обращение к Богу; синтаксис остаётся ясным для обычного читателя.
