  yaml_path: translation/ot/psalms/051/009.yaml
  text: Let me hear joy and gladness[c][b][a]; let the bones you have crushed rejoice.
translation:
  language: ru
  text: Дай мне услышать ликование и радость — пусть возрадуются кости, которые Ты сокрушил.[a]
  philosophy: optimal-equivalence
  footnotes:
