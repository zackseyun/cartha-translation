lexical_decisions:
- source_word: תְּחַטְּאֵנִי
  choice: Очисти меня
  rationale: Пиэль глагола חטא здесь имеет очистительное, устраняющее грех или нечистоту значение. «Очисти меня» естественно по-русски и в сочетании с иссопом сохраняет обрядовый оттенок.
- source_word: בְאֵזוֹב
  choice: иссопом
  rationale: Предлог בְּ обозначает средство, а иссоп связан в еврейской Библии с обрядами очищения. Творительный падеж кратко и естественно передаёт этот смысл.
- source_word: וְאֶטְהָר
  choice: и я буду чист
  rationale: טהר означает быть или стать чистым как в обрядовом, так и в нравственном смысле. Формулировка сохраняет результат просьбы и параллелизм стиха.
- source_word: תְּכַבְּסֵנִי
  choice: омой меня
  rationale: כבס буквально обозначает стирку или тщательное мытьё. В поэтической молитве «омой меня» звучит естественно и сохраняет образ глубокого очищения.
- source_word: וּמִשֶּׁלֶג
  choice: снега
  rationale: 'Предлог מִן в данном сравнительном обороте выражает превосходство: «белее снега».'
- source_word: אַלְבִּין
  choice: стану белее
  rationale: Форма глагола לבן указывает на достижение состояния белизны. Вместе со сравнительным оборотом естественно передаётся как «стану белее снега».
theological_decisions:
- issue: Обрядовый образ очищения применён к нравственному греху
  choice: Сохранить прямое упоминание иссопа и язык очищения
  alternative: Передать общий смысл как просьбу простить или удалить грех
  rationale: Еврейский текст намеренно обращается к образам обрядового очищения, выражая через них просьбу об очищении от греха. Перевод сохраняет эту связь, не добавляя более поздних богословских толкований.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. «Омой» сохраняет возвышенный, но понятный регистр; синтаксический параллелизм и тире подчёркивают две просьбы и обещанный результат.
