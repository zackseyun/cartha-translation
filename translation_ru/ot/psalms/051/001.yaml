lexical_decisions:
- source_word: בְּבוֹא
  choice: когда … пришёл
  rationale: Предлог בְּ с инфинитивом בוא образует временную конструкцию; придаточное с «когда» естественно передаёт её по-русски.
- source_word: אֵלָיו
  choice: к нему
  rationale: Передаёт направление, выраженное אֶל с местоименным суффиксом 3-го лица мужского рода единственного числа.
- source_word: נָתָן
  choice: Нафан
  rationale: Устоявшаяся русская передача личного имени.
- source_word: הַנָּבִיא
  choice: пророк
  rationale: Точно передаёт определённый титул Нафана; в русской конструкции перед именем отдельное выражение артикля не требуется.
- source_word: כַּאֲשֶׁר
  choice: после того как
  rationale: 'В данном контексте ясно выражает последовательность событий: посещение Нафана последовало за поступком Давида, при этом не добавляет причинного значения.'
- source_word: בָּא אֶל
  choice: вошёл к
  rationale: Сохранён древнееврейский эвфемистический оборот со значением половой близости; его смысл поясняется в сноске, а не раскрывается непосредственно в тексте.
- source_word: בַּת שָׁבַע
  choice: Вирсавии
  rationale: Использована устоявшаяся русская форма имени Вирсавия в требуемом дательном падеже.
