lexical_decisions:
- source_word: חָנֵּנִי
  choice: Будь благосклонен ко мне
  rationale: Повелительная форма חנן с суффиксом первого лица выражает просьбу о благосклонности и милости. Такой перевод сохраняет отличие от רחמים далее в стихе.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма обращения к Богу естественно передаётся русским звательным употреблением «Боже».
- source_word: כְּחַסְדֶּךָ
  choice: по верной любви Твоей
  rationale: חסד обозначает стойкую, верную любовь и благость, нередко в контексте отношений завета. «Верная любовь» передаёт постоянство и преданность без внесения специальной конфессиональной терминологии.
- source_word: כְּרֹב רַחֲמֶיךָ
  choice: по множеству щедрот Твоих
  rationale: רֹב передаёт множество, обилие или величие, а множественное רחמים — глубокое сострадание и милосердные проявления. «Множество щедрот» сохраняет множественное число и возвышенный поэтический параллелизм.
- source_word: מְחֵה
  choice: изгладь
  rationale: מחה означает стереть, удалить, уничтожить запись. «Изгладь» естественно сохраняет метафору стирания применительно к вине.
- source_word: פְשָׁעַי
  choice: мои преступления
  rationale: פשע обозначает проступок как нарушение установленной воли, вплоть до мятежа. «Преступления» сохраняет нравственно-правовую силу слова и уместно в покаянном контексте.
theological_decisions:
- issue: Передача взаимосвязанных понятий חנן, חסד и רחמים
  choice: 'Использованы разные выражения: «будь благосклонен», «верная любовь» и «щедроты».'
  alternative: Передать все три понятия словами одного корня — «милость/милосердие».
  rationale: Еврейский текст наслаивает близкие, но не тождественные обозначения Божьей благосклонности, верной любви и сострадания. Лексическое разграничение сохраняет поэтическую и богословскую насыщенность стиха.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Инверсия «щедрот Твоих» поддерживает ритм псалма; «изгладь» сохраняет традиционно понятную метафору стирания, не делая стиль архаичным.
