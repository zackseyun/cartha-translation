  text: הרבה כַּבְּסֵ֣/נִי מֵ/עֲוֺנִ֑/י וּֽ/מֵ/חַטָּאתִ֥/י טַהֲרֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/003.yaml
  text: Wash me thoroughly from my iniquity[c][b][a], and cleanse me from my sin.
translation:
  language: ru
  text: Тщательно[a] омой меня от моего беззакония[b] и очисти меня[c] от моего греха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «многократно» либо «снова и снова». Еврейское усилительное слово может указывать на обильное или особенно тщательное омовение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от моей вины» либо «от моего злодеяния». Еврейское слово עָוֹן может охватывать как сам неправедный поступок, так и связанную с ним вину.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сделай меня чистым».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַרְבֵּה
  choice: тщательно
  rationale: Наречие усиливает повеление כַּבְּסֵנִי. «Тщательно» естественно передаёт интенсивность и полноту омовения, не сводя смысл к буквальному повторению действия.
- source_word: כַּבְּסֵנִי
  choice: омой меня
  rationale: Глагол כבס обычно обозначает стирку или тщательное мытьё. «Омой меня» сохраняет образ очищения и звучит достойно и естественно в поэтической молитве.
- source_word: מֵעֲוֺנִי
  choice: от моего беззакония
  rationale: עָוֹן может обозначать беззаконие, вину или проступок, включая как действие, так и связанную с ним виновность. «Беззаконие» сохраняет нравственную весомость и отличие от חַטָּאת.
- source_word: וּמֵחַטָּאתִי
  choice: от моего греха
  rationale: В покаянном контексте חַטָּאת прямо и естественно передаётся словом «грех». Отличие от параллельного עָוֹן сохранено без навязывания строгого смыслового разграничения.
- source_word: טַהֲרֵנִי
  choice: очисти меня
  rationale: טהר означает сделать чистым или чистым в ритуальном и нравственном смысле. «Очисти меня» ясно передаёт оба возможных оттенка.
theological_decisions:
- issue: Передача парных покаянных понятий עָוֹן и חַטָּאת
  choice: 'Сохранить в основном тексте разные слова: «беззаконие» и «грех».'
  alternative: Передать оба понятия более общими или близкими словами либо перевести עָוֹן как «вина».
  rationale: Еврейский текст использует два связанных, но не тождественных понятия в поэтическом параллелизме. Их различение сохраняет фактуру исповедания, не превращая лексическую вариативность в жёсткое богословское противопоставление.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-поэтическим звучанием. Порядок слов сделан естественным для русского языка, при этом сохранены параллельные образы омовения и очищения.
