  terminology: «Согрешил» уместно для покаянной молитвы. «Прав» не вносит конфессионально окрашенного значения слова «оправдан», а «безупречен» передаёт отсутствие вины в контексте суда. Заглавные местоимения допустимы в избранном библейском регистре.
