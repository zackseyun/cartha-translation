  source_fidelity: 'Начальная исповедальная часть передана верно: לְךָ לְבַדְּךָ передано с сохранением усиления, а «я согрешил» и «сделал то, что зло в Твоих глазах» соответствуют еврейскому тексту. В заключении בְּדָבְרֶךָ и בְּשָׁפְטֶךָ естественнее передать как временные обороты «когда говоришь» и «когда судишь»; это также точнее отражает параллельные формы оригинала. «Безупречен» в русском передаёт судебно-нравственный смысл תִּזְכֶּה естественнее, чем «чист».'
