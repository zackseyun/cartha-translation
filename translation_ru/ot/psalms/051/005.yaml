base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/005.yaml
  text: Against you—you alone—I have sinned[a], and I have done what is evil in your eyes[b], so that you may be justified in your words and blameless in your judgment.
translation:
  language: ru
  text: Против Тебя — Тебя одного — я согрешил[a] и сделал то, что зло в Твоих глазах, чтобы Ты был прав, когда говоришь, и безупречен, когда судишь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Против Тебя одного я согрешил». Повторение местоимения в основном тексте передаёт особое смысловое ударение древнееврейской фразы.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы Ты оказался прав в Своих словах и чист в Своём суде».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְךָ לְבַדְּךָ
  choice: Против Тебя — Тебя одного —
  rationale: Предлог לְ в контексте исповедания указывает на того, против кого направлен грех; обособление сохраняет усиление, выраженное повторением и словом «одного».
- source_word: חָטָאתִי
  choice: я согрешил
  rationale: Совершенный вид естественно передаёт совершённый поступок, который исповедует говорящий.
- source_word: וְהָרַע בְּעֵינֶיךָ עָשִׂיתִי
  choice: и сделал зло в Твоих глазах
  rationale: Субстантивированное прилагательное передано словом «зло», а образное древнееврейское выражение «в Твоих глазах» сохранено как понятное указание на Божью нравственную оценку.
- source_word: לְמַעַן
  choice: чтобы
  rationale: Союз может выражать цель или результат; «чтобы» сохраняет эту напряжённую смысловую связь, не заменяя её пояснением.
- source_word: תִּצְדַּק בְּדָבְרֶךָ
  choice: Ты был прав в Своих словах
  rationale: צדק обозначает правоту, в том числе в судебном смысле. Формулировка естественна по-русски и не привносит специальных доктринальных значений слова «оправдать».
- source_word: תִּזְכֶּה בְשָׁפְטֶךָ
  choice: и чист, когда судишь
  rationale: זכה выражает чистоту или отсутствие вины, а конструкция בְשָׁפְטֶךָ естественно допускает временную передачу «когда судишь».
theological_decisions:
- issue: Слова «против Тебя — Тебя одного» при наличии людей, пострадавших от греха
  choice: Сохранить абсолютную направленность исповедания к Богу без смягчения
  alternative: «Прежде всего против Тебя» или «особенно против Тебя»
  rationale: Древнееврейский текст говорит предельно резко; добавление сравнительного ограничения устранило бы заложенное в нём богословское напряжение.
- issue: Судебный оттенок Божьей правоты и чистоты
  choice: «Ты был прав… и чист, когда судишь»
  alternative: «Ты оказался оправдан… и безупречен в Своём суде»
  rationale: Выбранный вариант сохраняет параллелизм нравственной и судебной правоты, избегая при этом искусственного русского оборота и конфессионально нагруженной терминологии.
- issue: Связь исповеданного греха с Божьей правотой, вводимая לְמַעַן
  choice: Сохранить союз цели/результата «чтобы»
  alternative: «поэтому» или «так что»
  rationale: Текст не объясняет причинную логику этой связи; перевод сохраняет подлинную неоднозначность цели и результата, а не разрешает её за читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством покаянной молитвы. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают распространённую русскую библейскую традицию; синтаксис остаётся ясным для обычного читателя, а образ «в Твоих глазах» намеренно сохранён.
