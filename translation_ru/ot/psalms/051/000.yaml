lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов это слово обозначает руководителя музыкального исполнения. Такой перевод краток, естественен по-русски и сохраняет значение еврейского предлога לְ как указания адресата.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшееся русское обозначение данного поэтического и музыкального жанра; оно точнее и традиционнее более общих вариантов «песнь» или «мелодия».
- source_word: לְדָוִד
  choice: Давида
  rationale: Русская родительная конструкция «Псалом Давида» сохраняет смысловую широту еврейского выражения, которое может указывать на авторство, принадлежность, связь или посвящение.
theological_decisions:
- issue: Смысл надписания לְדָוִד
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; Псалом для Давида
  rationale: Еврейская конструкция не требует однозначно понимать связь с Давидом только как авторство. Традиционная русская формулировка сохраняет эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с краткой, традиционно узнаваемой формой надписания. «Руководитель хора» понятнее современному читателю, чем архаичное «начальник хора».
