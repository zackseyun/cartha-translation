lexical_decisions:
- source_word: תַּחְפֹּץ
  choice: Ты благоволишь к
  rationale: Глагол חפץ выражает удовольствие и благосклонное принятие; «благоволить к» естественно в контексте принятого Богом богослужения.
- source_word: זִבְחֵי צֶדֶק
  choice: праведным жертвам
  rationale: Передаёт конструкцию «жертвы праведности» как жертвы, соответствующие праведности, не сводя значение лишь к обрядовой правильности; буквальная конструкция отмечена в сноске.
- source_word: עוֹלָה
  choice: всесожжению
  rationale: Устоявшийся русский термин для жертвы, полностью сжигаемой на жертвеннике.
- source_word: וְכָלִיל
  choice: и жертве, сжигаемой целиком
  rationale: Сохраняет отдельное обозначение כָלִיל и его акцент на полноте сожжения, не устраняя возможную связь с предшествующим «всесожжением».
- source_word: יַעֲלוּ
  choice: вознесут
  rationale: Каузативная форма עלה в жертвенном контексте означает вознести жертву на алтарь; русское «вознесут» сохраняет образ восхождения и культовый смысл.
- source_word: מִזְבַּחֲךָ
  choice: на Твой жертвенник
  rationale: Прямое соответствие еврейскому обозначению алтаря Бога при обращении к Нему.
- source_word: פָרִים
  choice: быков
  rationale: Прямое и контекстуально подходящее обозначение жертвенных животных.
- source_word: אָז ... אָז
  choice: Тогда ... тогда
  rationale: Повтор сохранён, поскольку он подчёркивает последовательность и следствие.
theological_decisions:
- issue: Приемлемость жертв после противопоставления жертвоприношения сокрушённому духу в стихах 18–19 по русской нумерации
  choice: Сохранено буквальное описание восстановленного и принимаемого Богом жертвенного богослужения.
  alternative: Истолковать жертвы исключительно как метафору внутренней праведности либо сгладить культовый смысл.
  rationale: Текст не отменяет жертвоприношения как таковые, а сохраняет напряжение между покаянием и внешним богослужением; перевод не разрешает это напряжение за автора.
- issue: Соотношение עוֹלָה и כָלִיל
  choice: 'Переданы как два согласованных, но лексически различимых выражения: «всесожжение» и «жертва, сжигаемая целиком».'
  alternative: Понять сочетание как единое усиленное выражение «полное всесожжение».
  rationale: Синтаксис допускает тесную связь или пояснение, однако формальное различие двух слов следует сохранить и отметить альтернативу в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Местоимения, обращённые к Богу, написаны с прописной буквы. Термин «всесожжение» сохранён как понятный и укоренённый библейский культовый термин.
