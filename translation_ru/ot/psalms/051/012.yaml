source:
  edition: WLC
  text: אַל תַּשְׁלִיכֵ֥/נִי מִ/לְּ/פָנֶ֑י/ךָ וְ/ר֥וּחַ קָ֝דְשְׁ/ךָ֗ אַל תִּקַּ֥ח מִמֶּֽ/נִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/012.yaml
  text: Do not cast me away from your presence[a], and do not take your Holy Spirit from me.
translation:
  language: ru
  text: 'Не прогоняй меня от Себя

    и Святого Духа Твоего[a] не отнимай у меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святого духа Твоего»; букв.: «Духа святости Твоей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: не прогоняй меня
  rationale: Порода hифиль глагола שלך выражает удаление человека, словно его отбрасывают прочь. «Не прогоняй меня» естественно передаёт силу просьбы по-русски, не ослабляя её до нейтрального «не удаляй».
- source_word: מִלְּפָנֶיךָ
  choice: от Себя
  rationale: Буквально выражение связано с «лицом», но здесь обозначает пребывание перед Богом, в Его присутствии. «От Себя» кратко и естественно передаёт этот реляционный смысл в сочетании с глаголом «прогонять».
- source_word: רוּחַ קָדְשְׁךָ
  choice: Святого Духа Твоего
  rationale: Конструкция буквально означает «Дух Твоей святости» или «Твой святой Дух». Выбранная формулировка естественна для русского библейского регистра и указывает на принадлежащего Богу Духа, не добавляя к исходному тексту пояснений.
- source_word: תִּקַּח
  choice: не отнимай
  rationale: לקח имеет основное значение «брать, взять». В отрицательной просьбе «не отнимай» точно и естественно передаёт действие взятия у молящегося.
- source_word: מִמֶּנִּי
  choice: у меня
  rationale: Русская конструкция «отнять у меня» идиоматически передаёт еврейское «взять от меня».
theological_decisions:
- issue: Передача רוּחַ קָדְשְׁךָ и употребление прописных букв
  choice: Святого Духа Твоего
  alternative: святого духа Твоего; Духа святости Твоей
  rationale: Еврейский текст допускает более буквальное понимание «Дух Твоей святости» и сам по себе не использует различия прописных и строчных букв. Основной вариант следует естественному русскому обозначению Божьего Духа, а подлинная лексико-богословская неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы как стилистический выбор издания. Параллелизм двух просьб сохранён.
