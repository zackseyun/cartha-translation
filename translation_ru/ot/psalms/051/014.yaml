  yaml_path: translation/ot/psalms/051/014.yaml
  text: I will teach transgressors your ways[a], and sinners will return to you.
translation:
  language: ru
  text: Буду учить преступников Твоим путям, и грешники возвратятся к Тебе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратятся к Тебе»; возможен также смысл: «вернутся к Тебе». Еврейский глагол может означать и обращение, и возвращение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲלַמְּדָה
  choice: Буду учить
  rationale: Форма породы hифиль, 1-е лицо ед. числа, с когортативным оттенком выражает намерение или решимость псалмопевца после восстановления. «Буду учить» естественно передаёт эту направленность в русском языке.
- source_word: פֹשְׁעִים
  choice: преступников
  rationale: Слово обозначает тех, кто сознательно преступает установленную границу или восстаёт. «Преступники» сохраняет нравственный смысл и параллелизм с «грешниками», не добавляя узкого юридического значения слова «преступление» в современном праве.
- source_word: דְּרָכֶיךָ
  choice: Твоим путям
  rationale: Множественное число דְּרָכִים метафорически обозначает Божьи пути — Его волю, образ действия и требуемое Им поведение. Русское «Твоим путям» сохраняет метафору и соответствует управлению глагола «учить».
- source_word: חַטָּאִים
  choice: грешники
  rationale: Краткое и естественное соответствие обозначению людей, совершающих грех; оно сохраняет нравственную категорию исходного текста.
- source_word: אֵלֶיךָ
  choice: к Тебе
  rationale: Предлог выражает направление — «к Тебе». Возможный оттенок возвращения передаётся глаголом שׁוב, поэтому дополнительное «назад» не требуется.
- source_word: יָשׁוּבוּ
  choice: возвратятся
  rationale: Глагол שׁוב может означать как «обратиться, повернуться», так и «вернуться». В покаянном контексте псалма «возвратятся» естественно выражает восстановление направленности к Богу, при этом альтернативный оттенок отмечен в сноске.
theological_decisions:
- issue: Покаянный смысл глагола שׁוב
  choice: возвратятся к Тебе
  alternative: обратятся к Тебе; вернутся к Тебе
  rationale: Еврейский глагол допускает значения поворота и возвращения. Контекст восстановления после греха поддерживает «возвратятся», но не требует вкладывать в строку определённую богословскую схему обращения; смысловая широта сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Местоимения, обращённые к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции; синтаксис краток и сохраняет параллелизм оригинала.
