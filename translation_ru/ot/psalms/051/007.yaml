base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/007.yaml
  text: Behold[a], you desire truth in the inward parts[b], and in the hidden place you make wisdom known to me.
translation:
  language: ru
  text: Вот, Ты желаешь истины во внутреннем существе[a], и в сокровенном месте открываешь мне мудрость[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во внутренних частях». Еврейские выражения в этой строке поэтически говорят о скрытой внутренней сфере человека; далее: «в сокровенном месте». Или: «Ты находишь удовольствие в истине».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «даёшь мне познать мудрость»; также возможно: «учишь меня мудрости».'
    reason: translation_alternative
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Передаёт усилительное и привлекающее внимание значение частицы, сохраняя поэтический тон.
- source_word: אֱמֶת
  choice: истины
  rationale: В данном контексте слово обозначает внутреннюю правдивость и подлинность перед Богом; перевод не сужает его до одной лишь верности.
- source_word: חָפַצְתָּ
  choice: Ты желаешь
  rationale: Передаёт направленность Божьей воли; возможный оттенок удовольствия отмечен в сноске.
- source_word: בַטֻּחוֹת
  choice: в глубинах души
  rationale: Естественно по-русски выражает метафорические внутренние, скрытые части человека, не сводя образ к телесной анатомии.
- source_word: וּבְסָתֻם
  choice: в сокровенном
  rationale: Сохраняет образ скрытого внутреннего места и поэтический параллелизм с предыдущим выражением.
- source_word: חָכְמָה
  choice: мудрость
  rationale: Прямой и естественный эквивалент, уместный для нравственно-духовного контекста псалма.
- source_word: תוֹדִיעֵנִי
  choice: даёшь мне познать
  rationale: Передаёт каузативную форму глагола ידע — Бог делает так, чтобы говорящий узнал мудрость; формулировка сохраняет отличие от более свободного «учишь меня».
theological_decisions:
- issue: Характер истины, которой Бог желает внутри человека
  choice: Передать внутреннюю нравственную подлинность без уточнения позднейшими догматическими категориями.
  alternative: Понимать אֱמֶת исключительно как заветную верность либо как психологическое самопознание.
  rationale: Поэтический параллелизм говорит об истине внутри человека и о мудрости, сообщаемой Богом в сокровенном; контекст не требует более узкого толкования.
- issue: Способ сообщения мудрости
  choice: Сохранить значение «дать познать» и не уточнять механизм этого действия.
  alternative: 'Перевести более идиоматично: «учишь меня мудрости».'
  rationale: Каузативная форма допускает смысл обучения, но буквально акцентирует то, что Бог приводит человека к знанию; перевод сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Заглавное «Ты» употреблено как традиционное благоговейное обращение к Богу. Образы внутренней глубины и сокровенного сохранены, но выражены без неестественного анатомизма.
