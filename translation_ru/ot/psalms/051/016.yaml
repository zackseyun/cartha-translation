lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Божественный титул в прямом обращении; звательная форма «Господи» естественна для современной литературной русской молитвенной речи и не смешивает этот титул с именем יהוה.
- source_word: שְׂפָתַי
  choice: мои уста
  rationale: Буквально «мои губы»; «уста» сохраняет телесный образ органа речи и достойный поэтический регистр псалма.
- source_word: תִּפְתָּח
  choice: открой
  rationale: Qal imperfect от פתח в молитвенном контексте выражает просьбу; русский императив передаёт её прямо и естественно.
- source_word: וּפִי
  choice: и мои уста
  rationale: Буквально «и мой рот». Повтор «уста» по-русски звучит естественнее, чем «рот», хотя несколько ослабляет различие между параллельными образами губ и рта.
- source_word: יַגִּיד
  choice: возвестят
  rationale: Hiphil imperfect от נגד означает «объявлять, возвещать»; форма будущего времени передаёт ожидаемый результат Божьего действия.
- source_word: תְּהִלָּתֶךָ
  choice: хвалу Тебе
  rationale: Буквально «Твою хвалу»; в современном русском «возвещать хвалу Тебе» яснее выражает хвалу, обращённую к Богу, не меняя смысла.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי в прямом обращении
  choice: Господи
  alternative: Владыка мой
  rationale: «Господи» передаёт почтительный божественный титул и естественно функционирует как обращение, не добавляя к тексту сочетание «Господь Бог» и не отождествляя титул с יהוה.
translation_notes:
  register: Современный литературный русский с традиционно-поэтическим словом «уста», уместным в псалме. Синтаксис краткий и молитвенный; сохранена соединительная конструкция с «и», без добавления причинно-следственного «тогда».
