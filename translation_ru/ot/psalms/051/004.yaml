  text: כִּֽי פְ֭שָׁעַ/י אֲנִ֣י אֵדָ֑ע וְ/חַטָּאתִ֖/י נֶגְדִּ֣/י תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/004.yaml
  text: For I know my transgressions, and my sin is always before me.
translation:
  language: ru
  text: Ведь я знаю свои преступления, и грех мой всегда передо мной.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание или пояснение к предшествующей мольбе; «ведь» естественно передаёт эту пояснительную связь в русском исповедальном контексте.
- source_word: פְשָׁעַי
  choice: свои преступления
  rationale: Слово обозначает преступления, проступки или мятеж против Бога. «Преступления» сохраняет нравственную тяжесть и множественное число исходного текста; возвратное «свои» естественно при русском «я знаю».
- source_word: אֲנִי אֵדָע
  choice: я знаю
  rationale: ידע здесь выражает осознание и знание собственной вины, не обязательно публичное признание. Явное местоимение אֲנִי сохранено русским «я».
- source_word: וְחַטָּאתִי
  choice: и грех мой
  rationale: В исповедальном контексте חטאת означает «грех», а не жертву за грех. Единственное число сохранено как сосредоточение на грехе, постоянно стоящем перед говорящим.
- source_word: נֶגְדִּי
  choice: передо мной
  rationale: Передаёт образ чего-то находящегося перед глазами или в непосредственном сознании говорящего; форма «передо мной» естественна и благозвучна.
- source_word: תָמִיד
  choice: всегда
  rationale: Передаёт непрерывность присутствия греха в сознании псалмопевца простым и современным русским словом.
theological_decisions:
- issue: Соотношение פשע («преступления») и חטאת («грех»)
  choice: 'Сохранить два разных термина: «преступления» и «грех»'
  alternative: Свести оба слова к одному термину, например «грехи»
  rationale: Еврейский текст употребляет два родственных, но различных слова и меняет число с множественного на единственное. Их различение сохраняет поэтическую фактуру и напряжённость исповедания, не навязывая им искусственно строгого догматического разграничения.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и понятным синтаксисом. «Ведь» сохраняет связь с контекстом, а порядок «грех мой» поддерживает поэтическую выразительность без архаизации.
