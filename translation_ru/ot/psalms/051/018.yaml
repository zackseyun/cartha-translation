lexical_decisions:
- source_word: זִבְחֵי אֱלֹהִים
  choice: Жертвы Богу
  rationale: Конструкция буквально означает «жертвы Бога», но в данном контексте естественный русский дательный передаёт жертвы, приносимые Богу или угодные Ему, не добавляя слова «угодные» в основной текст.
- source_word: רוּחַ נִשְׁבָּרָה
  choice: дух сокрушённый
  rationale: Причастие от שבר передаёт образ сломленности. «Сокрушённый дух» лексически точно, естественно для возвышенного русского регистра и сохраняет покаянную многозначность образа.
- source_word: לֵב נִשְׁבָּר
  choice: сердце сокрушённое
  rationale: Прямо сохраняет повтор корня и параллель с «духом сокрушённым».
- source_word: וְנִדְכֶּה
  choice: и подавленное
  rationale: Причастие от דכה обозначает нечто раздавленное, придавленное или подавленное. «Подавленное» сохраняет конкретную силу образа, не сводя его исключительно к раскаянию.
- source_word: לֹא תִבְזֶה
  choice: не презришь
  rationale: בזה означает презирать, считать ничтожным. «Не презришь» — прямой и уместный в молитвенном контексте эквивалент.
- source_word: אֱלֹהִים
  choice: Богу / Боже
  rationale: В первой строке слово входит в конструкцию, во второй является прямым обращением; русские падежные формы естественно передают обе функции.
theological_decisions:
- issue: Метафора жертвы в покаянном контексте
  choice: Внутреннее сокрушение названо жертвой Богу без добавленного утверждения об отмене внешних жертв.
  alternative: Понимать стих как полное отрицание внешнего жертвоприношения либо только как описание эмоциональной подавленности.
  rationale: Еврейский текст отождествляет «жертвы Богу» с сокрушённым духом и сердцем. Перевод сохраняет это напряжение и не превращает стих в более широкое догматическое утверждение.
- issue: Значение נִדְכֶּה
  choice: Сохранён образ подавленного, придавленного сердца.
  alternative: Передать исключительно как «раскаянное».
  rationale: Контекст допускает покаянный смысл, однако само слово сохраняет образ раздавленности; более узкое толкование дано в сноске как вариант.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-поэтической речи. Инверсия «дух сокрушённый» и форма «не презришь» поддерживают псалмический ритм, оставаясь понятными современному читателю.
