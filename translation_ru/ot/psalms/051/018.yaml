base_translation:
  language: en
  yaml_path: translation/ot/psalms/051/018.yaml
  text: The sacrifices of God are a broken spirit[a]; a broken and crushed heart, O God[b], you will not despise.
translation:
  language: ru
  text: Жертвы Богу — сокрушённый дух; сокрушённого и подавленного сердца Ты, Боже, не презришь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сломленного духа; сокрушённого и раскаянного сердца Ты, Боже, не презришь».'
