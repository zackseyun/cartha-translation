  yaml_path: translation/ot/psalms/051/006.yaml
  text: Behold[a], in iniquity I was brought forth[c][b], and in sin my mother conceived me.
translation:
  language: ru
  text: Вот[a], в беззаконии я был рождён[b][c], и во грехе зачала меня моя мать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поистине»; также возможно: «Действительно».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я родился».'
    reason: lexical_alternative
  - marker: c
    text: Этот стих понимают либо как признание греховности от самого зачатия, либо как покаянное поэтическое преувеличение; сам еврейский текст не разрешает этот вопрос однозначно.
    reason: alternative_reading
lexical_decisions:
- source_word: הֵן
  choice: Вот
  rationale: Частица вводит подчёркнутое, торжественное утверждение. «Вот» сохраняет её выразительную силу, не превращая утверждение в логический вывод.
- source_word: בְּעָוֹן
  choice: в беззаконии
  rationale: Сохраняет предлог בְ и ёмкость עָוֹן, которое может обозначать беззаконие, вину или нравственную испорченность, не уточняя сверх текста, какой оттенок преобладает.
- source_word: חוֹלָלְתִּי
  choice: я был рождён
  rationale: Страдательная форма передаёт образ появления на свет и грамматическую направленность действия на говорящего; вариант «я родился» естественнее разговорно, но менее явно отражает форму еврейского глагола.
- source_word: וּבְחֵטְא
  choice: и во грехе
  rationale: Прямо передаёт חֵטְא и сохраняет предложный параллелизм с выражением «в беззаконии».
- source_word: יֶחֱמַתְנִי
  choice: зачала меня
  rationale: В данном контексте глагол наиболее естественно обозначает зачатие; это согласуется с параллельным упоминанием рождения в первой строке.
- source_word: אִמִּי
  choice: моя мать
  rationale: Прямая и естественная передача существительного с притяжательным суффиксом на современном литературном русском языке.
theological_decisions:
- issue: Говорит ли стих о личном грехе матери, о греховности псалмопевца от зачатия или использует покаянное поэтическое преувеличение
  choice: Передать связь зачатия и рождения псалмопевца с грехом и беззаконием, не определяя её богословский механизм.
  alternative: Понять слова исключительно как учение о врождённой греховности; отнести грех прежде всего к матери или обстоятельствам зачатия; считать выражение лишь покаянной гиперболой.
  rationale: Еврейский текст связывает зачатие и рождение говорящего с עָוֹן и חֵטְא, но не поясняет точный характер этой связи. Перевод сохраняет исходную богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим звучанием. Сохранены параллельные обороты «в беззаконии» и «во грехе», а также сжатость еврейской строки; архаические формы вроде «во грехах родила» не использованы.
