  text: אַתָּ֤ה פוֹרַ֣רְתָּ בְ/עָזְּ/ךָ֣ יָ֑ם שִׁבַּ֖רְתָּ רָאשֵׁ֥י תַ֝נִּינִ֗ים עַל הַ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/013.yaml
  text: You split the sea by your strength[b][a]; you shattered the heads of the sea monsters on the waters.
translation:
  language: ru
  text: Ты силой Своей рассёк море[b]; Ты сокрушил головы морских чудовищ[a] на водах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «драконов» либо «огромных морских существ». Еврейское слово танниним может обозначать чудовищных змееподобных существ, связанных с водами.'
    reason: lexical_alternative
  - marker: b
    text: Этот стих может одновременно перекликаться с поэтическим образом Божьей победы над хаотическим морем и с историческим избавлением у моря во время исхода.
    reason: cross_reference
lexical_decisions:
- source_word: פוֹרַרְתָּ
  choice: рассёк
  rationale: Глагол передаёт решительное разделение или разламывание; «рассёк море» естественно звучит в современной русской поэтической речи и допускает как космический, так и исходный контекст.
- source_word: בְעָזְּךָ
  choice: силой Своей
  rationale: Предлог בְּ здесь имеет инструментальное значение, а עֹז означает силу или мощь. Такая формулировка точна и естественна.
- source_word: יָם
  choice: море
  rationale: Существительное передано без ненужного уточнения, чтобы сохранить возможность видеть как образ первозданного моря, так и отсылку к избавлению при исходе.
- source_word: שִׁבַּרְתָּ
  choice: сокрушил
  rationale: «Сокрушил» передаёт интенсивное и насильственное действие שׁבר и соответствует возвышенной поэтической параллели.
- source_word: רָאשֵׁי
  choice: головы
  rationale: Сохранён прямой анатомический образ множественного числа без метафорического переосмысления.
- source_word: תַנִּינִים
  choice: морских чудовищ
  rationale: תַנִּינִים может обозначать огромных змееподобных водных существ. «Морские чудовища» ясно передаёт поэтико-космический образ, не привнося традиционных ассоциаций слова «драконы».
- source_word: עַל הַמָּיִם
  choice: на водах
  rationale: Буквально сохраняет пространственное значение עַל и необычный поэтический образ, не сглаживая его до более интерпретирующего «в водах».
theological_decisions:
- issue: Характер образов моря и תַנִּינִים
  choice: Сохранить в основном тексте поэтико-космический образ, допускающий также отсылку к исходу.
  alternative: Истолковать стих исключительно как описание исхода либо исключительно как космогоническую борьбу с хаосом.
  rationale: Контекст псалма позволяет услышать оба мотива. Перевод не должен снимать эту богословскую и поэтическую многозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим строем. Заглавные буквы в местоимениях, относящихся к Богу, сохранены как уместная русская издательская норма. Порядок маркеров приведён в соответствие с местами, к которым относятся примечания.
