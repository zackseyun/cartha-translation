source:
  edition: WLC
  text: קוּמָ֣/ה אֱ֭לֹהִים רִיבָ֣/ה רִיבֶ֑/ךָ זְכֹ֥ר חֶרְפָּתְ/ךָ֥ מִנִּי נָ֝בָ֗ל כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/022.yaml
  text: Rise up[a], O God; plead your case[b]. Remember your reproach from the fool all day long.
translation:
  language: ru
  text: Восстань, Боже, отстаивай Своё дело[a]; помни, как безумец[b] поносит Тебя весь день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально — «веди Свою тяжбу». В еврейском тексте употреблён язык судебного спора.
    reason: lexical_alternative
  - marker: b
    text: Здесь «безумец» — нравственно испорченный, нечестивый человек, а не просто человек, которому недостаёт ума.
    reason: cultural_note
lexical_decisions:
- source_word: קוּמָה
  choice: Восстань
  rationale: Повелительная форма קום с добавочным ה выражает настоятельный призыв к Богу начать действовать. «Восстань» сохраняет возвышенный молитвенный тон и остаётся понятным современному читателю.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения естественно передаёт прямое молитвенное обращение к Богу.
- source_word: רִיבָה רִיבֶךָ
  choice: отстаивай Своё дело
  rationale: Однокоренные глагол и существительное относятся к языку судебного спора. По-русски «отстаивай Своё дело» естественно передаёт призыв вступиться за собственную правоту и иск, хотя не воспроизводит этимологическую фигуру оригинала.
- source_word: זְכֹר
  choice: помни
  rationale: Императив сохранён без поясняющего расширения; в молитвенном контексте память подразумевает внимание, ведущее к действию.
- source_word: חֶרְפָּתְךָ
  choice: как… поносит Тебя
  rationale: Существительное חֶרְפָּה обозначает поношение, оскорбление или насмешку. Русская глагольная конструкция ясно и естественно передаёт поношение, направленное на Бога.
- source_word: מִנִּי נָבָל
  choice: безумец… поносит
  rationale: Предлог מן указывает на источник поношения, а נָבָל обозначает нравственно испорченного, нечестивого человека, а не просто человека с низкими умственными способностями.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Выражение указывает на непрерывность или постоянное повторение поношения; «весь день» кратко и естественно сохраняет временной образ оригинала.
theological_decisions:
- issue: К кому относится поношение
  choice: Поношение направлено непосредственно на Бога
  alternative: Поношение терпит Божий народ и святыня, а Бог принимает его как Своё
  rationale: Суффикс второго лица в חֶרְפָּתְךָ наиболее непосредственно указывает на оскорбление Бога, что согласуется с призывом отстаивать «Своё дело». Контекст всего псалма допускает связь с поношением народа и святилища, однако перевод не вводит это более широкое толкование в текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Юридическая метафора передана понятным выражением «отстаивай Своё дело», а более буквальный вариант приведён в сноске. Заглавные местоимения при обращении к Богу использованы последовательно.
