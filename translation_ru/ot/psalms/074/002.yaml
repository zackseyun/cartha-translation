  text: זְכֹ֤ר עֲדָתְ/ךָ֨ קָ֘נִ֤יתָ קֶּ֗דֶם גָּ֭אַלְתָּ שֵׁ֣בֶט נַחֲלָתֶ֑/ךָ הַר צִ֝יּ֗וֹן זֶ֤ה שָׁכַ֬נְתָּ בּֽ/וֹ׀־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/002.yaml
  text: Remember your congregation[a], which you acquired long ago, which you redeemed as the tribe of your inheritance—Mount Zion[d][c][b], this mountain where you dwelled.
translation:
  language: ru
  text: Вспомни Твою общину, которую Ты приобрёл издревле, колено Твоего наследия, которое Ты искупил, гору Сион — эту гору, где Ты обитал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זְכֹר
  choice: Вспомни
  rationale: Повелительная форма 2-го лица мужского рода единственного числа; в молитвенном плаче это прямой призыв к Богу вновь обратить внимание на Свой народ.
- source_word: עֲדָתְךָ
  choice: общину Твою
  rationale: עֵדָה обозначает собранный народ, сообщество; «община» естественно передаёт коллективный смысл и не сужает его до отдельного собрания.
- source_word: קָנִיתָ
  choice: которую Ты приобрёл
  rationale: קנה может означать «приобрести», «купить», «владеть», а иногда «создать». Здесь параллелизм с «искупил» указывает на то, что Бог сделал Израиль Своим народом; «приобрёл» сохраняет широту образа без излишне торгового оттенка.
- source_word: קֶדֶם
  choice: издревле
  rationale: Слово указывает на давнее, древнее время; «издревле» кратко и достойно звучит в поэтической молитве.
- source_word: גָּאַלְתָּ
  choice: искупил
  rationale: גאל обозначает избавление родственником-искупителем и несёт устойчивый библейский смысл Божьего избавления Израиля.
- source_word: שֵׁבֶט נַחֲלָתֶךָ
  choice: как колено Твоего наследия
  rationale: שֵׁבֶט допускает значения «колено», «жезл» и «скипетр». В параллели с общиной и искупленным народом наиболее уместно «колено»; конструкция נַחֲלָתֶךָ выражает принадлежность народа Богу как Его удела.
- source_word: הַר צִיּוֹן זֶה
  choice: гору Сион, эту гору
  rationale: Указательное זֶה относится к горе Сион. Повтор слова «гора» делает приложение ясным по-русски и сохраняет явное указание оригинала.
- source_word: שָׁכַנְתָּ בוֹ
  choice: где Ты обитал
  rationale: שׁכן означает жить, пребывать; применительно к Богу связано с Его присутствием. Прошедшее «обитал» естественно передаёт перфект в контексте воспоминания.
theological_decisions:
- issue: Означает ли קָנִיתָ сотворение или приобретение Израиля Богом как Своего народа
  choice: приобретение Израиля Богом как Своего народа
  alternative: «создал» или «сотворил»
  rationale: Хотя קנה иногда может иметь значение «создавать», параллель с גאל («искупил») и объект «Твоя община» прежде всего указывают на историческое принятие Израиля Богом в Свою собственность. Перевод не вводит идею сотворения, которой контекст не требует.
- issue: Следует ли понимать שֵׁבֶט как народное колено или как жезл/скипетр
  choice: колено
  alternative: «жезл» или «скипетр»
  rationale: Контекст говорит об искупленной общине и Божьем наследии, поэтому обозначение группы людей лучше согласуется с параллелизмом. Предметно-царское значение остаётся лексически возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим регистром. Местоимения, обращённые к Богу, написаны с прописной буквы по принятой русской религиозно-литературной традиции. Синтаксис сохраняет поэтическое приложение «гору Сион, эту гору» и не устраняет указательное זֶה.
