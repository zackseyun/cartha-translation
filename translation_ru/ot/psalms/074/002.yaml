  source_fidelity: 'Основная смысловая линия передана верно: עֵדָה — Божья община, קנה — давнее приобретение, גאל — искупление, שׁבט — вероятнее «колено», а הַר־ציון и указательное זֶה сохранены. Однако «искупил как колено» вводит отсутствующее в еврейском тексте значение роли/качества («как»). В оригинале «колено Твоего наследия» является прямым дополнением к «искупил».'
