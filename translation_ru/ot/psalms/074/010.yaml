  text: עַד מָתַ֣י אֱ֭לֹהִים יְחָ֣רֶף צָ֑ר יְנָ֘אֵ֤ץ אוֹיֵ֖ב שִׁמְ/ךָ֣ לָ/נֶֽצַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/010.yaml
  text: How long[a], O God, will the foe reproach? Will the enemy revile your name forever?
translation:
  language: ru
  text: Доколе, Боже, противник будет поносить? Будет ли враг вечно хулить[a] Твоё имя?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «презирать».'
    reason: 'Лексическая альтернатива: יְנָאֵץ может обозначать как хулу, так и презрительное отношение или отвержение.'
lexical_decisions:
- source_word: עַד מָתַי
  choice: Доколе
  rationale: Устойчивое русское выражение скорбного вопроса о затянувшемся бедствии; сохраняет возвышенный, но понятный псалмический регистр.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения естественно передаёт молитвенное обращение к Богу.
- source_word: יְחָרֶף
  choice: будет глумиться
  rationale: Передаёт насмешку и дерзкое поношение; непереходная русская конструкция не добавляет отсутствующий в еврейском тексте прямой объект.
- source_word: צָר
  choice: противник
  rationale: Точно передаёт значение враждебного противостояния и позволяет отличить это слово от следующего אוֹיֵב.
- source_word: יְנָאֵץ
  choice: будет хулить
  rationale: В контексте Божьего имени выражает презрительное и оскорбительное отношение; вариант «будет презирать» отмечен в сноске как менее интерпретирующая лексическая возможность.
- source_word: אוֹיֵב
  choice: враг
  rationale: Обычный и естественный русский эквивалент, сохраняющий синонимический параллелизм с «противником».
- source_word: שִׁמְךָ
  choice: Твоё имя
  rationale: Сохраняет прямой образ еврейского текста, в котором имя связано с честью и открытой людям личностью Бога.
- source_word: לָנֶצַח
  choice: вечно
  rationale: Естественно передаёт ощущение нескончаемого поношения в контексте плача.
theological_decisions:
- issue: Следует ли заменить «Твоё имя» прямым указанием на Бога
  choice: Сохранить «Твоё имя»
  alternative: «Тебя»
  rationale: Еврейский текст прямо говорит об имени Бога; эта формулировка сохраняет связь с Божьей честью и явленной личностью, не сводя её к поясняющему пересказу.
- issue: Следует ли однозначно передавать יְנָאֵץ как технический религиозный термин «богохульствовать»
  choice: «хулить» в основном тексте с более общим вариантом в сноске
  alternative: «презирать»
  rationale: Контекст Божьего имени допускает значение хулы, однако еврейский глагол шире и может обозначать презрительное отвержение; сноска сохраняет эту смысловую широту.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической интонацией. «Доколе» и форма «Боже» традиционны, ясны и не создают чрезмерной архаичности; порядок слов сохраняет поэтический параллелизм.
