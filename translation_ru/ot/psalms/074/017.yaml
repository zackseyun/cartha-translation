  text: אַתָּ֣ה הִ֭צַּבְתָּ כָּל גְּבוּל֣וֹת אָ֑רֶץ קַ֥יִץ וָ֝/חֹ֗רֶף אַתָּ֥ה יְצַרְתָּ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/017.yaml
  text: You established all the boundaries of the earth[b][a]; summer and winter—you formed them.
translation:
  language: ru
  text: Ты установил все пределы земли; лето и зиму Ты образовал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִצַּבְתָּ
  choice: установил
  rationale: Порода хифиль глагола נצב означает поставить или утвердить; «установил» естественно передаёт как действие, так и устойчивость заданных пределов.
- source_word: כָּל גְּבוּלוֹת אָרֶץ
  choice: все пределы земли
  rationale: В контексте устроения мироздания גְּבוּלוֹת обозначает пределы или границы; «пределы земли» избегает преимущественно политического оттенка слова «границы» и сохраняет космический масштаб.
- source_word: קַיִץ וָחֹרֶף
  choice: лето и зиму
  rationale: Это обычные названия сезонов; данная пара представляет годичный природный цикл.
- source_word: יְצַרְתָּם
  choice: Ты создал их
  rationale: Глагол יצר выражает формирование, придание вида; в данном контексте русское «создал» звучит естественно и не устраняет образ Божьего устроения сезонов. Суффикс мужского рода множественного числа передан местоимением «их» и относится к лету и зиме.
- source_word: אַתָּה ... אַתָּה
  choice: Ты ... Ты
  rationale: Повтор самостоятельного местоимения в еврейском тексте подчёркивает непосредственное действие Бога; повтор сохранён в русском переводе.
theological_decisions:
- issue: Смысл «пределов земли»
  choice: Устроение Богом мироздания
  alternative: Территориальные границы земель или народов
  rationale: Соседнее упоминание лета и зимы задаёт контекст порядка творения, поэтому речь, вероятнее всего, идёт о пределах земли как части устроенного мира, а не о государственных рубежах.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Инверсия и тире сохраняют поэтический параллелизм и подчёркнутый повтор «Ты».
