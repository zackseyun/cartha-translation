source:
  edition: WLC
  text: אֽוֹתֹתֵ֗י/נוּ לֹ֥א רָ֫אִ֥ינוּ אֵֽין ע֥וֹד נָבִ֑יא וְ/לֹֽא אִ֝תָּ֗/נוּ יֹדֵ֥עַ עַד מָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/009.yaml
  text: We do not see our signs; there is no longer any prophet[a], and none among us knows how long.
translation:
  language: ru
  text: Мы не видим наших знамений[a]; больше нет пророка, и никто из нас не знает, доколе это продлится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наших знаков»; еврейское слово может обозначать видимые знаки, свидетельства или эмблемы, но что именно имеется здесь в виду, не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתֵינוּ
  choice: наших знамений
  rationale: «Знамения» сохраняет широкое значение אוֹת — видимый знак или свидетельство — и не сужает неясный референт до знамён, храмовых символов или чудес.
- source_word: לֹא רָאִינוּ
  choice: мы не видим
  rationale: Форма совершенного вида в контексте плача выражает сохраняющееся состояние отсутствия; настоящее время естественно передаёт непосредственность жалобы.
- source_word: אֵין עוֹד
  choice: больше нет
  rationale: Передаёт прекращение прежнего присутствия и звучит естественно на современном русском языке.
- source_word: נָבִיא
  choice: пророка
  rationale: 'Обычный эквивалент נָבִיא; единственное число при אֵין имеет обобщённый смысл: нет ни одного пророка.'
- source_word: וְלֹא אִתָּנוּ יֹדֵעַ
  choice: и никто из нас не знает
  rationale: Естественно передаёт эллиптическую еврейскую конструкцию и принадлежность знающего к общине.
- source_word: עַד מָה
  choice: доколе это продлится
  rationale: В плаче выражение означает «как долго». Добавление «это продлится» делает идиому ясной по-русски, не определяя точнее, что именно должно окончиться.
theological_decisions:
- issue: Референт выражения «наши знамения»
  choice: Сохранено широкое выражение «наши знамения».
  alternative: «наши знамёна»; «знаки Божьего присутствия среди нас»; «наши священные знаки»
  rationale: Еврейский текст не уточняет, имеются ли в виду чудесные знаки, храмовые символы, знамёна или иные свидетельства Божьего благоволения. Широкий перевод сохраняет эту смысловую открытость.
- issue: Неуказанный объект в выражении עַד מָה
  choice: «доколе это продлится» без уточнения содержания «этого»
  alternative: «когда это кончится»; «как долго»
  rationale: Текст не называет прямо, идёт ли речь о бедствии, отсутствии знамений или отсутствии пророческого откровения. Перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. «Доколе» сохраняет библейскую возвышенность, оставаясь понятным; синтаксис краткий и естественный.
