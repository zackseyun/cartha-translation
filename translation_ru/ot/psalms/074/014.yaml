base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/014.yaml
  text: You crushed the heads of Leviathan[a]; you gave him as food for the creatures of the desert.
translation:
  language: ru
  text: Ты сокрушил головы Левиафана; отдал его в пищу обитателям пустыни[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «людям, живущим в пустыне»; возможно: «диким зверям пустыни». Древнееврейское выражение трудно для толкования и может обозначать людей либо животных, обитающих в засушливых местах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִצַּצְתָּ
  choice: сокрушил
  rationale: Глагол выражает насильственное раздробление или сокрушение; этот выбор сохраняет силу древнееврейского образа и естественно звучит в возвышенной поэзии.
- source_word: רָאשֵׁי
  choice: головы
  rationale: Существительное стоит во множественном числе; перевод сохраняет образ многоголового Левиафана, не сводя его к единственной голове.
- source_word: לִוְיָתָן
  choice: Левиафана
  rationale: Сохранено традиционное имя мифопоэтического существа, чтобы не сужать образ до простого обозначения морского чудовища.
- source_word: תִּתְּנֶנּוּ
  choice: отдал его
  rationale: Форма от נתן буквально означает «дал» и содержит местоименный суффикс мужского рода единственного числа, относящийся к Левиафану. «Отдал» естественно сочетается с оборотом «в пищу».
- source_word: מַאֲכָל
  choice: в пищу
  rationale: Обычное значение — «пища, еда»; русский оборот «отдал в пищу» точен и идиоматичен.
- source_word: לְעָם לְצִיִּים
  choice: народу пустыни
  rationale: Перевод сохраняет явное עַם «народ» и передаёт צִיִּים как относящееся к пустынным местам. Поскольку значение и синтаксическая связь выражения трудны и могут указывать на обитателей либо диких животных пустыни, неоднозначность отмечена в сноске.
theological_decisions:
- issue: Природа образа Левиафана
  choice: Сохранить имя «Левиафан» и поэтический образ, не определяя природу существа.
  alternative: Передать как «морское чудовище» либо прямо истолковать как Египет или силы хаоса.
  rationale: Сам стих не уточняет, является ли Левиафан буквальным существом, космическим образом или символом исторического врага; перевод не должен разрешать эту богословско-поэтическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Точка с запятой сохраняет параллелизм двух действий. Необычное выражение «народ пустыни» оставлено ради близости к древнееврейскому тексту, а его возможные значения разъяснены в сноске.
