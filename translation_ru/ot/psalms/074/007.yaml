lexical_decisions:
- source_word: שִׁלְחוּ בָאֵשׁ
  choice: предали огню
  rationale: Буквально сочетание означает «послали/пустили в огонь», но в данном контексте это еврейский способ сказать, что святилище сожгли. «Предали огню» естественно и достойно передаёт разрушительное действие.
- source_word: מִקְדָּשֶׁךָ
  choice: Твоё святилище
  rationale: מִקְדָּשׁ — святое место, святилище. Такой перевод сохраняет широту значения и не сужает его без необходимости до слова «храм».
- source_word: לָאָרֶץ
  choice: до основания
  rationale: Буквально «до земли». В сочетании с глаголом осквернения выражение указывает на крайнее унижение или полное поругание святыни; «до основания» передаёт это по-русски естественнее, а буквальная форма отмечена в сноске.
- source_word: חִלְּלוּ
  choice: осквернили
  rationale: Порода пиэль глагола חלל здесь означает лишить святости, подвергнуть поруганию. «Осквернили» ясно сохраняет противопоставление священного и поруганного.
- source_word: מִשְׁכַּן
  choice: жилище
  rationale: Слово означает место обитания. «Жилище» сохраняет образ пребывания Бога и не вводит техническое «скиния», неуместно сужающее исторический контекст.
- source_word: שְׁמֶךָ
  choice: Твоего имени
  rationale: 'Сохранён значимый ветхозаветный оборот «жилище имени»: он говорит о явленном присутствии Бога, не отождествляя Самого Бога со зданием.'
theological_decisions:
- issue: Передача пары מִקְדָּשׁ / מִשְׁכַּן
  choice: «святилище» и «жилище»
  alternative: «храм» и «святилище» либо «святое место» и «скиния»
  rationale: 'Два разных, но связанных еврейских слова переданы разными русскими словами. Так сохраняются поэтический параллелизм и двойной образ: место свято и одновременно является жилищем Божьего имени.'
- issue: Сохранение богословского оборота מִשְׁכַּן שְׁמֶךָ
  choice: «жилище Твоего имени»
  alternative: «место, где пребывает Твоё имя» либо «Твоё жилище»
  rationale: Буквальный образ сохраняет напряжение между Божьим присутствием в избранном месте и тем, что Бог не сводится к этому месту.
- issue: Связь לָאָרֶץ со второй строкой
  choice: «до основания осквернили»
  alternative: 'Связать выражение с разрушением святилища или передать буквально: «до земли осквернили»'
  rationale: Масоретическая акцентуация отделяет первую строку после «святилище» и поддерживает связь «до земли» с глаголом «осквернили». Русская формулировка сохраняет эту связь, не превращая осквернение прямо в разрушение.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным псалмовым звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксический параллелизм двух полустиший сохранён; неестественный буквальный оборот «послали огонь» раскрыт в сноске.
