  language: ru
  text: Они предали огню Твоё святилище[a]; жилище Твоего имени они осквернили до земли[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «послали огонь в Твоё святилище». Еврейский оборот означает, что его сожгли.'
    reason: lexical_alternative
