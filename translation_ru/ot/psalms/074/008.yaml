  text: אָמְר֣וּ בְ֭/לִבָּ/ם נִינָ֣/ם יָ֑חַד שָׂרְפ֖וּ כָל מוֹעֲדֵי אֵ֣ל בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/008.yaml
  text: They said in their hearts[b][a], “Let us destroy them all together.” They burned all the meeting places of God in the land.
translation:
  language: ru
  text: 'Они сказали в сердце своём: «Истребим их всех разом»[a]. Они сожгли все места собраний Божьих в стране[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово נִינָם трудно для истолкования; возможны значения «подавим их», «покорим их» или иное выражение разрушительного намерения.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все назначенные Богом места»; в некоторых традиционных переводах — «все синагоги Божьи».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָמְרוּ
  choice: Они сказали
  rationale: Форма qal, перфект, 3-е лицо множественного числа; вводит внутреннюю речь врагов в контексте поэтического повествования.
- source_word: בְלִבָּם
  choice: в сердце своём
  rationale: Сохранён еврейский образ сердца как средоточия мысли и намерения, а также собирательное единственное число исходного текста.
- source_word: נִינָם
  choice: истребим их
  rationale: Редкая и трудная форма, по контексту выражающая намерение подавить или уничтожить противников; выбранное выражение естественно по-русски и передаёт разрушительную направленность, а неопределённость отмечена в сноске.
- source_word: יָחַד
  choice: всех разом
  rationale: Передаёт значение совместности или совокупности и в данном контексте подчёркивает всеохватность замысла.
- source_word: שָׂרְפוּ
  choice: они сожгли
  rationale: Прямое значение глагола qal в перфекте; совершенный вид уместен для завершённого разрушительного действия.
- source_word: כָּל מוֹעֲדֵי אֵל
  choice: все места собраний Божьих
  rationale: Глагол «сожгли» и указание местонахождения поддерживают пространственное понимание מוֹעֵד как назначенного места встречи или собрания. Формулировка не вносит анахроничного указания на синагоги.
- source_word: בָּאָרֶץ
  choice: в стране
  rationale: В контексте псалма речь, вероятнее всего, идёт о земле Израиля; «в стране» избегает возможного понимания как всей планеты.
theological_decisions:
- issue: Значение נִינָם
  choice: 'выражение враждебного намерения: «истребим их»'
  alternative: «подавим их», «покорим их» либо иное чтение трудной формы
  rationale: Контекст описывает намерение полного разорения, но лексическая форма неясна; основной текст передаёт вероятный смысл, не выдавая его за бесспорный, а сноска сохраняет альтернативы.
- issue: Значение מוֹעֲדֵי אֵל
  choice: физические места, посвящённые собраниям перед Богом
  alternative: назначенные Богом времена или праздники; «синагоги Божьи»
  rationale: Предметы можно «сжечь», и они находятся в стране, поэтому пространственное значение предпочтительно. Перевод не конкретизирует исторический тип этих мест сверх данных текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Оборот «в сердце своём» сознательно сохраняет образ и собирательное единственное число еврейского текста; остальная фраза построена естественно и ясно для современного читателя.
