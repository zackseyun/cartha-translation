  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская строка сжата и синтаксически трудна. Возможен более буквальный перевод: «Он был известен как тот, кто поднимает топоры вверх в гуще деревьев». Смысловая связь слов «вверх» и «в гуще деревьев» не вполне ясна.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: יִוָּדַע
  choice: Он был известен
  rationale: Нифаль, 3-е лицо мужского рода единственного числа; в поэтическом повествовании передан прошедшим временем. Мужской род сохранён, хотя конкретный референт в сжатой еврейской строке не назван.
- source_word: כְּמֵבִיא
  choice: как тот, кто заносит
  rationale: Префикс כְּ выражает сравнение, а причастие хифиля от בוא буквально связано с принесением или приведением. В образе рубки леса естественное русское «заносит» передаёт поднятие топора для удара, не устраняя трудность всей строки.
- source_word: לְמָעְלָה
  choice: над
  rationale: Выражение указывает на движение вверх. В сочетании «заносит топоры над…» значение передано естественно для русского языка.
- source_word: בִּסֲבָךְ עֵץ
  choice: над лесной чащей
  rationale: סבך означает густые заросли, чащу, а עץ — дерево или древесину. «Лесная чаща» сохраняет древесный образ без тяжеловесного «чаща деревьев»; предлог ב допускает пространственное «в» или направленное понимание, поэтому связь синтаксически остаётся трудной.
- source_word: קַרְדֻּמּוֹת
  choice: топоры
  rationale: Обычное и понятное обозначение рубящих орудий во множественном числе.
