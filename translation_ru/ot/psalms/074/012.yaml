base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/012.yaml
  text: Yet God is my King from of old[a], working acts of salvation in the midst of the earth.
translation:
  language: ru
  text: Но Бог — Царь мой издревле, совершающий спасительные деяния посреди земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страны». Еврейское слово может означать как всю землю, так и определённую страну или область.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֵאלֹהִים
  choice: Но Бог
  rationale: 'В контексте союз וְ имеет противительное значение: нынешнему разорению противопоставляется давняя и неизменная царская власть Бога.'
- source_word: מַלְכִּי
  choice: Царь мой
  rationale: Форма с суффиксом первого лица единственного числа буквально означает «мой царь»; порядок слов «Царь мой» сохраняет возвышенный поэтический регистр.
- source_word: מִקֶּדֶם
  choice: издревле
  rationale: Кратко и естественно передаёт значение глубокой древности, не усиливая его до абсолютного «от начала».
- source_word: פֹּעֵל
  choice: совершающий
  rationale: Причастие выражает характерное или продолжающееся действие Бога; «совершающий» соответствует поэтическому регистру и сочетается с существительным «спасение».
- source_word: יְשׁוּעוֹת
  choice: спасение
  rationale: Еврейская форма множественного числа обозначает спасительные деяния или избавления. В русском собирательное «спасение» звучит естественно и сохраняет богословскую ёмкость выражения.
- source_word: בְּקֶרֶב
  choice: посреди
  rationale: Передаёт пространственное значение «в середине, среди» кратко и поэтично.
- source_word: הָאָרֶץ
  choice: земли
  rationale: אֶרֶץ допускает значения «земля» как мир и «страна» как определённая территория. Основной текст сохраняет более широкое чтение, а альтернативу отмечает сноска.
theological_decisions:
- issue: Масштаб спасительных деяний Бога
  choice: земли
  alternative: страны
  rationale: Контекст воспевает царскую власть и могущественные деяния Бога в широком масштабе, поэтому предпочтено «земли»; однако лексическая неоднозначность אֶרֶץ сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим строем. Инверсия «Царь мой» подчёркивает исповедальный характер строки, не создавая архаической тяжеловесности.
