  text: Why do you hold back your hand[a], your right hand? Draw it out from your bosom and consume them.
translation:
  language: ru
  text: Почему Ты удерживаешь Свою руку, Свою правую руку? Вынь её из Своей пазухи и истреби их![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст выражен сжато: «из середины Твоей пазухи — истреби». Отдельного глагола «вынь» в нём нет: это действие подразумевается образом руки, удерживаемой в пазухе. Дополнение «их» также не выражено и восполнено по контексту врагов в псалме.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Почему
  rationale: Обычное вопросительное наречие причины; вводит скорбный вопрос-предъявление Богу.
- source_word: תָשִׁיב
  choice: удерживаешь
  rationale: Hифиль глагола שוב при дополнении «рука» здесь передаёт не буквальное возвращение, а отведение или удерживание руки от действия; вариант естественно согласуется с образом руки за пазухой.
- source_word: יָדְךָ וִימִינֶךָ
  choice: Свою руку, Свою правую руку
  rationale: Сохранены конкретный образ и поэтическое уточнение. «Правая рука» понятнее современному читателю, чем стилистически архаичная «десница».
- source_word: מִקֶּרֶב חֹוקֶךָ
  choice: из-за пазухи
  rationale: Идиоматично передаёт руку, находящуюся внутри складки одежды у груди; буквальное «из середины Твоего лона» в современном русском звучало бы неясно.
- source_word: כַלֵּה
  choice: покончи с ними
  rationale: Императив Piel от כלה означает «довести до конца, истребить, уничтожить». Местоименный объект в еврейском не выражен; «с ними» минимально восполняет его по контексту врагов в псалме.
theological_decisions:
- issue: Неявное дополнение при заключительном повелении
  choice: «покончи с ними», где «ними» относится к врагам
  alternative: Оставить глагол без дополнения («покончи») либо отнести действие в общем смысле к угрозе или поруганию
  rationale: В еврейском тексте объект не назван, поэтому неоднозначность отмечена в сноске. Контекст псалма — просьба о действии против врагов, разоряющих святилище и насмехающихся над Богом, — позволяет минимально восполнить «с ними», не превращая это в отдельное богословское утверждение.
- issue: Подразумеваемое действие с рукой
  choice: «Вынь её из-за пазухи»
  alternative: 'Передать буквально и эллиптически: «из-за пазухи покончи»'
  rationale: Еврейская строка выражена сжато и буквально не содержит отдельного глагола «вынь». Русская фраза восполняет действие, непосредственно подразумеваемое предлогом «из» и образом удерживаемой за пазухой руки; восполнение раскрыто в сноске.
translation_notes:
  register: Современный литературный русский с сохранением прямого обращения к Богу и телесного поэтического образа. Выбрано понятное «правая рука» вместо архаичного «десница»; «из-за пазухи» естественно передаёт древний образ складки одежды у груди. Заглавные местоимения обращения к Богу соответствуют принятому русскому библейскому регистру.
