  text: לְ/ךָ֣ י֭וֹם אַף לְ/ךָ֥ לָ֑יְלָה אַתָּ֥ה הֲ֝כִינ֗וֹתָ מָא֥וֹר וָ/שָֽׁמֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/016.yaml
  text: The day is yours; the night also is yours[a]. You established the light and the sun.
translation:
  language: ru
  text: Тебе принадлежит день, и ночь тоже Тебе. Ты утвердил светило[a] и солнце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свет». Некоторые понимают здесь луну из-за сопоставления дня и ночи, однако в еврейском тексте слово «луна» прямо не употреблено.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְךָ
  choice: Тебе принадлежит
  rationale: Предлог לְ с местоименным суффиксом выражает принадлежность. Такая конструкция естественна по-русски и сохраняет повторный акцент еврейского текста.
- source_word: יוֹם
  choice: день
  rationale: Обычное значение слова в противопоставлении ночи.
- source_word: אַף
  choice: тоже
  rationale: 'Частица присоединяет вторую часть с усилением: не только день, но и ночь принадлежит Богу.'
- source_word: לָיְלָה
  choice: ночь
  rationale: Обычное значение слова в противопоставлении дню.
- source_word: אַתָּה
  choice: Ты
  rationale: Явно выраженное местоимение сохранено ради смыслового ударения.
- source_word: הֲכִינוֹתָ
  choice: утвердил
  rationale: Порода hифиль корня כון передаёт значение установления, утверждения или приведения в надлежащий порядок; «утвердил» уместно в контексте устроения мира.
- source_word: מָאוֹר
  choice: светило
  rationale: Слово обозначает источник света или светило, а иногда может пониматься как свет. «Светило» непосредственно передаёт предметное значение, не подменяя его словом «луна».
- source_word: וָשָׁמֶשׁ
  choice: и солнце
  rationale: Прямой перевод союза וְ и существительного שֶׁמֶשׁ.
theological_decisions:
- issue: Значение מָאוֹר рядом с שֶׁמֶשׁ
  choice: Перевести как «светило», сохранив неопределённость обозначаемого небесного источника света.
  alternative: Перевести как «свет» либо, исходя из параллели дня и ночи, истолковать как «луна».
  rationale: В еврейском тексте прямо не названа луна. Перевод «светило» сохраняет лексическое значение и поэтическую неоднозначность, не закрепляя контекстуальное толкование как сам текст.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Повтор «Тебе» сохраняет эмфатическую структуру первой строки; формулировка остаётся ясной для обычного читателя.
