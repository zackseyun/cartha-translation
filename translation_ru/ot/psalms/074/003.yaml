lexical_decisions:
- source_word: הָרִימָה פְעָמֶיךָ
  choice: Направь стопы Твои
  rationale: Буквальный образ — «подними Твои стопы/шаги» — является призывом к Богу двинуться к разрушенному святилищу. «Направь стопы» сохраняет антропоморфный образ движения и звучит естественнее по-русски, чем буквальное «подними шаги».
- source_word: לְמַשֻּׁאוֹת נֶצַח
  choice: к вечным развалинам
  rationale: מַשֻּׁאוֹת обозначает опустошённые места или развалины, а נֶצַח подчёркивает их длительное, словно нескончаемое состояние. Предлог ל передан направительным «к».
- source_word: כָּל הֵרַע
  choice: всё разорил
  rationale: כָּל выражает полноту нанесённого ущерба, а каузативная форма רעע здесь означает причинить зло, повредить или разорить. Русское «всё разорил» кратко и сильно передаёт масштаб разрушения.
- source_word: אוֹיֵב
  choice: враг
  rationale: Определённый по контексту единственный враг может представлять вражескую силу собирательно; по-русски нулевой артикль не требует дополнительного уточнения.
- source_word: בַּקֹּדֶשׁ
  choice: во святилище
  rationale: קֹדֶשׁ в данном контексте относится к священному месту, вероятнее всего храмовому святилищу.
theological_decisions:
- issue: Антропоморфный призыв к Богу двинуться к разрушенному святилищу
  choice: 'Сохранён телесный образ: «Направь стопы Твои»'
  alternative: «Приди»; «Поспеши»; буквально «Подними шаги Твои»
  rationale: Текст изображает Бога идущим к святилищу. Перевод не устраняет этот образ и не добавляет отсутствующую в еврейском тексте идею скорости.
- issue: Значение נֶצַח при описании разрушения
  choice: «вечным развалинам»
  alternative: «давним развалинам»; «нескончаемому запустению»
  rationale: Форма допускает оттенки длительности и постоянства. «Вечным» сохраняет напряжённую гиперболическую силу плача, не утверждая отдельного догматического положения о буквальной бесконечности разрушения.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной псалмовой интонацией. Порядок слов «всё разорил враг» сохраняет поэтическое ударение на полноте разорения; прописное «Твои» принято как уважительное обращение к Богу.
