base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/020.yaml
  text: Look to the covenant[c][b][a], for the dark places of the land are full of haunts of violence.
translation:
  language: ru
  text: Взгляни на завет[a], ибо тёмные места земли[b] полны пристанищ насилия[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на Твой завет». В еврейском тексте слово «завет» стоит с определённым артиклем, но без притяжательного суффикса; по контексту речь идёт о Божьем завете с Его народом.'
    reason: alternative_reading
  - marker: b
    text: Еврейское אֶרֶץ может означать «землю, страну» или «землю» в смысле мира.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «жилищами насилия» или «обителями насилия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֵּט
  choice: Обрати взор
  rationale: Повелительная форма глагола נבט призывает Бога благосклонно обратить внимание. «Обрати взор» сохраняет образ зрения, молитвенную настойчивость и достоинство речи без чрезмерной архаизации.
- source_word: לַבְּרִית
  choice: на завет
  rationale: בְּרִית означает «завет»; определённый артикль передан контекстуально. Притяжательное «Твой» не добавлено в основной текст, поскольку в еврейском нет соответствующего суффикса.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание для просьбы. «Ибо» ясно выражает причинную связь и соответствует возвышенному, но понятному регистру молитвы.
- source_word: מָלְאוּ
  choice: полны
  rationale: Перфект Qal, 3-е лицо множественного числа, описывает наступившее и сохраняющееся состояние; краткая форма «полны» естественно передаёт этот смысл.
- source_word: מַחֲשַׁכֵּי אֶרֶץ
  choice: тёмные места земли
  rationale: Сочетание буквально обозначает тёмные места земли или страны. Русское «земли» сохраняет конкретный образ и часть присущей אֶרֶץ смысловой широты.
- source_word: נְאוֹת
  choice: обителей
  rationale: נָוֶה может означать обиталище, жилище или пастбище. В сочетании с «насилием» слово «обители» сохраняет локативный смысл и не уточняет без основания, кто именно там живёт.
- source_word: חָמָס
  choice: насилия
  rationale: חָמָס обозначает насилие, жестокую несправедливость или притеснение; «насилие» является прямым и широким соответствием в данном контексте.
theological_decisions:
- issue: Следует ли явно обозначить завет как Божий
  choice: завет
  alternative: Твой завет
  rationale: В еврейском тексте стоит определённая форма «завет», но нет притяжательного суффикса. Контекст подразумевает Божий завет с Его народом, однако основной текст не делает это подразумеваемое отношение грамматически явным.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенным звучанием. Формула «обрати взор» несколько возвышенна, но общеупотребительна; «обители насилия» сохраняет необычный и выразительный образ оригинала, не истолковывая его как прямое обозначение самих насильников.
