lexical_decisions:
- source_word: וְעַת
  choice: И теперь
  rationale: Сочетание союза с наречием времени обозначает переход к происходящему теперь разрушению и сохраняет связь с предыдущим стихом.
- source_word: פִּתּוּחֶיהָ
  choice: её резные украшения
  rationale: Существительное обозначает резную или гравированную декоративную работу; местоименный суффикс женского рода передан как «её».
- source_word: יַחַד
  choice: разом
  rationale: Наречие выражает совместность или совокупность действия; «разом» естественно передаёт уничтожение всей резной работы без двусмысленного сочетания «вместе с».
- source_word: בְּכַשִּׁיל
  choice: топором
  rationale: Речь идёт о рубящем дерево орудии; точнее определить его современный вид невозможно, а «топор» остаётся ясным и контекстуально уместным соответствием.
- source_word: וְכֵילַפּוֹת
  choice: и молотами
  rationale: Слово обозначает ударные орудия во множественном числе; «молоты» передают разрушительную силу и сохраняют число.
- source_word: יַהֲלֹמוּן
  choice: они крушат
  rationale: Глагол означает наносить удары, разбивать; в сцене преднамеренного уничтожения святилища «крушат» передаёт и действие, и его разрушительный результат.
