  text: Your adversaries roared in the midst of your appointed place[c][b][a]; they set up their own signs as signs.
translation:
  language: ru
  text: Враги Твои рычали посреди места Твоего собрания[a]; они водрузили там свои знаки как знамения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посреди назначенного Тобой места» либо «внутри Твоего собрания». Еврейское слово может обозначать назначенное время, собрание или место встречи; здесь контекст, вероятнее всего, указывает на священное место собрания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально еврейский текст повторяет одно слово: «поставили свои знаки знаками». Возможно, речь идёт о водружённых врагами знамёнах, эмблемах или иных символах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁאֲגוּ
  choice: рычат
  rationale: Глагол передаёт прежде всего львиный рык и переносно — громкий, угрожающий крик; настоящее историческое делает сцену живой и сохраняет звериную образность.
- source_word: צֹרְרֶיךָ
  choice: враги Твои
  rationale: Причастная форма обозначает враждебных противников; «враги» естественно и ясно звучит по-русски в данном военном и культовом контексте.
- source_word: בְּקֶרֶב
  choice: посреди
  rationale: Передаёт нахождение внутри, в самой среде священного пространства, сохраняя пространственный акцент.
- source_word: מוֹעֲדֶךָ
  choice: места Твоего собрания
  rationale: מוֹעֵד допускает значения назначенного времени, собрания и места встречи. В контексте осквернения святилища наиболее вероятно место, предназначенное для встречи или собрания; формулировка не сужает его прямо до храма.
- source_word: שָׂמוּ
  choice: водрузили там
  rationale: שׂים значит «положить, поставить»; «водрузили» естественно передаёт демонстративную установку вражеских символов. «Там» эксплицирует место из первой половины стиха, не меняя смысла.
- source_word: אוֹתֹתָם אֹתוֹת
  choice: свои знаки как знамения
  rationale: Сохранена повторная однокоренная лексика исходника и предикативная конструкция. «Знамения» во втором употреблении передаёт заявленный врагами статус знаков, не уточняя сверх текста, были ли это знамёна, эмблемы или иные символы.
theological_decisions:
- issue: Значение מוֹעֵד в плаче об осквернении священного места
  choice: 'пространственно-культовое: «место Твоего собрания»'
  alternative: «назначенное Тобой место»; «Твоё собрание»; «Твой праздник»
  rationale: Предлог «посреди» и ближайший контекст вторжения во священное пространство поддерживают локативное понимание. При этом перевод сохраняет связь слова с собранием и не вводит отсутствующего в стихе более узкого архитектурного термина.
- issue: Смысл повторения אוֹתֹתָם אֹתוֹת
  choice: 'сохранить повтор понятий: «свои знаки как знамения»'
  alternative: «свои знамёна»; «свои эмблемы как знаки победы»
  rationale: Исходный текст не поясняет назначение символов. Перевод сохраняет его напряжённую и несколько необычную формулировку, не добавляя толкования о победе, собственности или замещении Божьих знаков.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Синтаксис краткий и энергичный; заглавные формы местоимений сохраняют традиционное уважительное обращение к Богу. Необычный повтор исходника передан однокоренными словами и пояснён в сноске.
