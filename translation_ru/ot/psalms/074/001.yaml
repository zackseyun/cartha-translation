  text: מַשְׂכִּ֗יל לְ/אָ֫סָ֥ף לָ/מָ֣ה אֱ֭לֹהִים זָנַ֣חְתָּ לָ/נֶ֑צַח יֶעְשַׁ֥ן אַ֝פְּ/ךָ֗ בְּ/צֹ֣אן מַרְעִיתֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/001.yaml
  text: A Maskil of Asaph. Why[a], O God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: ru
  text: 'Маскил Асафа.[a]

    Почему, Боже, Ты отверг нас навеки?[b]

    Почему дымится Твой гнев против овец Твоего пастбища?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Маскил» — техническое обозначение в заголовках псалмов; возможно, оно указывает на созерцательное или поучительное произведение.
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте дополнение при глаголе «отверг» не выражено прямо; «нас» подразумевается по контексту общинного плача.
    reason: source_ambiguity
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: маскил
  rationale: Это техническое обозначение жанра или типа псалма с не вполне ясным точным значением. Транслитерация сохраняет термин, не сводя его без достаточных оснований к «поучению» или «размышлению».
- source_word: לְאָסָף
  choice: Асафа
  rationale: Краткая форма заголовка естественна по-русски и сохраняет возможные значения принадлежности, авторства или связи с Асафом, не уточняя их искусственно.
- source_word: לָמָה
  choice: Почему
  rationale: Прямое вопросительное слово соответствует напряжённой речи плача. Во втором предложении оно повторено по-русски для ясного распространения вопроса на следующую клаузу.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Звательная форма естественно передаёт прямое молитвенное обращение.
- source_word: זָנַחְתָּ
  choice: Ты отверг
  rationale: Глагол означает отвержение или оставление. В масоретском тексте данного стиха дополнение при нём не выражено, поэтому оно не внесено непосредственно в основной текст.
- source_word: לָנֶצַח
  choice: навеки
  rationale: Слово сохраняет силу плача о кажущемся окончательным и непрерывном отвержении.
- source_word: יֶעְשַׁן
  choice: дымится
  rationale: Сохранён конкретный еврейский образ дыма, связанного с гневом, вместо его сглаживания до «пылает» или «горит».
- source_word: אַפְּךָ
  choice: Твой гнев
  rationale: Буквально существительное может обозначать нос или ноздри, но в устойчивом еврейском употреблении выражает гнев; образ дыма при этом сохранён сказуемым.
- source_word: בְּצֹאן מַרְעִיתֶךָ
  choice: против овец Твоего пастбища
  rationale: Перевод сохраняет пастушеский образ народа как овец, принадлежащих Божьему пастбищу, а предлог «против» передаёт направленность гнева.
theological_decisions:
- issue: Не выраженный в еврейском тексте объект глагола זָנַחְתָּ
  choice: Ты отверг
  alternative: Ты отверг нас / Ты отверг Свой народ
  rationale: В представленном тексте WLC у глагола нет местоименного суффикса первого лица множественного числа. Контекст общинного плача позволяет подразумевать «нас» или «Свой народ», но основной текст не превращает подразумеваемое дополнение в явно выраженное.
- issue: Объём вопросительного слова לָמָה
  choice: повторить «Почему» перед второй клаузой
  alternative: 'один вопрос: «Почему… и Твой гнев дымится…?»'
  rationale: В еврейском тексте вопросительное слово стоит один раз, но может охватывать обе параллельные жалобы. Повтор в русском ясно передаёт эту синтаксическую область, не меняя содержания.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтической сдержанностью. Сохранены образ «дымящегося» гнева и пастушеская метафора; местоимения обращения к Богу написаны с прописной буквы как принятая благоговейная издательская норма.
