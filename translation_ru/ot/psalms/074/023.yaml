base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/023.yaml
  text: Do not forget the voice of your enemies[a], the uproar of those who rise against you[b], which goes up continually.
translation:
  language: ru
  text: Не забудь голоса Твоих врагов[a]; гул восстающих против Тебя непрестанно поднимается[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звука Твоих врагов». Еврейское слово קול может означать как голос, так и звук или шум.'
    reason: lexical_alternative
