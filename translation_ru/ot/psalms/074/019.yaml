  text: אַל תִּתֵּ֣ן לְ֭/חַיַּת נֶ֣פֶשׁ תּוֹרֶ֑/ךָ חַיַּ֥ת עֲ֝נִיֶּ֗י/ךָ אַל תִּשְׁכַּ֥ח לָ/נֶֽצַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/019.yaml
  text: Do not give your dove to the ravenous beast; do not forget the lives of your afflicted ones forever.
translation:
  language: ru
  text: Не отдавай хищному зверю жизнь Твоей голубицы; не забывай навеки жизнь Твоих угнетённых.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְחַיַּת נֶפֶשׁ תּוֹרֶךָ
  choice: хищному зверю Твою голубицу
  rationale: В поэтической строке נֶפֶשׁ תּוֹרֶךָ естественно понимается как «Твоя голубица», а חַיַּת — как зверь, которому её могут отдать. Определение «хищный» передаёт угрозу пожирания, выраженную конструкцией буквально «зверю — жизнь/душу Твоей голубицы», без тяжеловесного буквализма.
- source_word: חַיַּת עֲנִיֶּיךָ
  choice: жизнь Твоих угнетённых
  rationale: Здесь חַיַּת — «жизнь, живое существование», а не повторное «зверь». Собирательное единственное «жизнь» сохранено и по-русски может относиться ко всей общине угнетённых.
- source_word: עֲנִיֶּיךָ
  choice: Твоих угнетённых
  rationale: Слово обозначает бедствующих, униженных или притесняемых; «угнетённых» естественно в контексте вражеского насилия и не сводит смысл только к материальной бедности.
- source_word: לָנֶצַח
  choice: навеки
  rationale: Передаёт продолжительное, окончательное забвение, которое отрицает молитва.
theological_decisions:
- issue: Образ голубицы как обозначение Божьего народа
  choice: Сохранить прямой поэтический образ «Твоя голубица»
  alternative: Разъяснить в тексте как «Твой народ»
  rationale: Метафора присутствует в еврейском тексте и не должна быть заменена толкованием.
- issue: Число при слове «жизнь»
  choice: 'Сохранить собирательное единственное: «жизнь Твоих угнетённых»'
  alternative: «жизни Твоих угнетённых»
  rationale: Еврейское חַיַּת имеет форму единственного числа и может собирательно обозначать жизнь общины; русский вариант сохраняет эту поэтическую напряжённость.
translation_notes:
  register: Современный литературный русский язык; молитвенный, сдержанно возвышенный регистр. Местоимения, обращённые к Богу, написаны с прописной буквы. Параллелизм двух запретов сохранён.
