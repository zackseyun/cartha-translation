  yaml_path: translation/ot/psalms/074/021.yaml
  text: Do not let the oppressed turn back ashamed[b][a]; let the poor and needy praise your name.
translation:
  language: ru
  text: Пусть угнетённый не вернётся посрамлённым[a]; пусть бедный и нуждающийся восхваляют имя Твоё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «униженным»; еврейское слово может подразумевать публичное унижение и бесчестье.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יָשֹׁב
  choice: пусть ... не уйдёт
  rationale: Отрицательная частица с глаголом выражает молитвенную просьбу. שוב буквально означает «вернуться, повернуть назад»; в данном контексте естественное русское «не уйдёт» передаёт мысль о том, чтобы проситель не удалился без ответа и в стыде, не делая этот подразумеваемый контекст явным.
- source_word: דַּךְ
  choice: угнетённый
  rationale: Слово обозначает сокрушённого, придавленного или угнетённого человека. «Угнетённый» звучит естественно в современном русском и сохраняет социально-экзистенциальную силу выражения.
- source_word: נִכְלָם
  choice: посрамлённым
  rationale: Страдательная форма указывает на пережитое посрамление или унижение, в том числе публичное. «Посрамлённым» точнее, чем просто «пристыженным», передаёт причинённый извне позор и соответствует возвышенному молитвенному регистру.
- source_word: עָנִי
  choice: бедный
  rationale: Слово может означать бедного, страдающего или смиренного. В паре с אֶבְיוֹן на первый план выходит нужда; «бедный» сохраняет привычное различение членов этой пары.
- source_word: אֶבְיוֹן
  choice: нуждающийся
  rationale: Обозначает нуждающегося, неимущего человека. Такой перевод отличает его от עָנִי и естественно воспроизводит устойчивую смысловую пару.
- source_word: יְהַלְלוּ
  choice: пусть ... восхваляют
  rationale: Пиэль имперфекта в молитвенной последовательности имеет желательное значение. «Пусть ... восхваляют» сохраняет параллелизм с первой просьбой и не превращает её в утверждение о результате.
- source_word: שְׁמֶךָ
  choice: имя Твоё
  rationale: Буквальное и понятное выражение, относящееся к открытым Божьим качествам и славе; его не следует заменять пояснительным пересказом.
theological_decisions:
- issue: Связь заключительной просьбы с избавлением угнетённого
  choice: 'Сохранена самостоятельная молитвенная просьба: «пусть ... восхваляют».'
  alternative: 'Передать как прямой результат избавления: «чтобы бедный и нуждающийся восхваляли».'
  rationale: Последовательность желательных форм допускает понимание хвалы как ожидаемого итога помощи, но не выражает причинную связь прямо. Перевод сохраняет эту смысловую открытость.
- issue: Что означает возвращение угнетённого
  choice: Передано нейтрально-контекстуальным «не уйдёт».
  alternative: «Не вернётся» или «не повернёт назад».
  rationale: Текст не называет исходную точку движения и может подразумевать уход просителя без полученного избавления. Формулировка не добавляет прямо не названного места или обстоятельства.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Инверсия «имя Твоё» поддерживает поэтический регистр; прописная буква в местоимении соответствует традиционному русскому оформлению обращения к Богу. Единственное число в первой строке и множественное сказуемое при паре обобщённых существительных во второй сохранены по еврейскому тексту.
