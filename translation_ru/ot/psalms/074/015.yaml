  source_fidelity: 'Текст точно передаёт еврейский параллелизм: בָּקַעְתָּ («разверз, рассёк») относится к «источнику и потоку/водотоку», а הוֹבַשְׁתָּ — к рекам. Единственное число у «источник и поток» сохранено. «Неиссякающие реки» адекватно передаёт אֵיתָן как устойчивые, постоянно текущие реки и сохраняет поэтический контраст с «иссушил».'
