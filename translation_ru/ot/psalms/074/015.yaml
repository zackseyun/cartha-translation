  text: אַתָּ֣ה בָ֭קַעְתָּ מַעְיָ֣ן וָ/נָ֑חַל אַתָּ֥ה ה֝וֹבַ֗שְׁתָּ נַהֲר֥וֹת אֵיתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/015.yaml
  text: You split open springs and wadis; you dried up ever-flowing rivers.
translation:
  language: ru
  text: Ты разверз источник и поток; Ты иссушил неиссякающие реки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָקַעְתָּ
  choice: разверз
  rationale: Передаёт каузативный образ рассечения или вскрытия, из-за которого открывается вода; сохраняет возвышенный поэтический регистр без добавления отсутствующего в тексте объекта «землю».
- source_word: מַעְיָן וָנָחַל
  choice: источник и поток
  rationale: 'Сохранены единственные числа и два разных водных образа: бьющий источник и текущий водный поток. «Поток» естественнее по-русски, чем заимствованное «вади», и не требует уточнять, постоянное ли это русло.'
- source_word: נַהֲרוֹת אֵיתָן
  choice: неиссякающие реки
  rationale: 'אֵיתָן обозначает постоянство, устойчивость или непрерывность течения. «Неиссякающие» сохраняет намеренное напряжение с глаголом «иссушил»: Бог иссушает даже то, что обычно не пересыхает.'
theological_decisions:
- issue: Возможная отсылка к сотворению мира, исходу или переходу через Иордан
  choice: Не уточнять историческое событие в основном тексте
  alternative: Передать лексику так, чтобы явно связать стих с одним конкретным событием
  rationale: Сам стих использует обобщённые поэтические образы и допускает наложение нескольких библейских мотивов; перевод не должен устранять эту многозначность.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой поэзии. «Разверз» — возвышенное, но понятное слово; повтор «Ты» сохранён ради еврейского параллелизма и эмфазы.
