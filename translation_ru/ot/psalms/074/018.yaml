base_translation:
  language: en
  yaml_path: translation/ot/psalms/074/018.yaml
  text: 'Remember this: the enemy has mocked Yahweh[c][b][a], and a foolish people have despised your name.'
translation:
  language: ru
  text: 'Вспомни это: враг поносил Яхве[a], и безумный народ[b] презрел Твоё имя[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Яхве» — передача тетраграмматона יהוה, личного имени Бога; традиционно его заменяют словом «Господь».
    reason: divine_name
  - marker: b
    text: «Безумный» здесь имеет нравственный, а не просто интеллектуальный смысл; ср. Псалом 13:1.
    reason: cross_reference
  - marker: c
    text: 'Или: «обращался с Твоим именем с презрением»; возможно также: «хулил Твоё имя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכָר זֹאת
  choice: Вспомни
  rationale: Повелительная форма обращена к Богу. В русском придаточные с «как» естественно раскрывают содержание указательного זֹאת («это»), не добавляя нового смысла.
- source_word: אוֹיֵב
  choice: враг
  rationale: Единственное число сохранено; в контексте слово может обозначать конкретного либо собирательно понимаемого противника.
- source_word: חֵרֵף
  choice: поносил
  rationale: Глагол выражает презрительное оскорбление, поношение или насмешливое поругание. «Поносил» передаёт сильную отрицательную окраску и соответствует возвышенному молитвенному регистру.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: עַם נָבָל
  choice: безумный народ
  rationale: נָבָל обозначает прежде всего нравственное и духовное безумие, а не недостаток умственных способностей; традиционно понятное выражение сохранено с пояснением.
- source_word: נִאֲצוּ
  choice: презирал
  rationale: Глагол означает проявлять презрение, отвергать с пренебрежением; «презирал» сохраняет широкий смысл и не сужает его до более истолковательного «хулил».
- source_word: שְׁמֶךָ
  choice: Твоё имя
  rationale: Сохранён буквальный образ «имени», включающий Божью известность, явленную личность и честь.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, то есть личное имя Бога. Транслитерация сохраняет отличие имени от титула.
- issue: Смысл определения נָבָל
  choice: безумный
  alternative: неразумный; нечестивый; подлый
  rationale: Выбранное слово сохраняет нравственно-религиозную тяжесть выражения, но не подменяет её более узким толкованием «нечестивый».
- issue: Значение נִאֲצוּ при объекте «Твоё имя»
  choice: презирал Твоё имя
  alternative: хулил Твоё имя; обращался с Твоим именем презрительно
  rationale: «Презирал» непосредственно передаёт идею презрения и оставляет открытым, выражалось ли оно именно словесным богохульством.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Повтор «как» делает синтаксис естественным и ясно связывает обе враждебные реплики с просьбой «Вспомни». Прошедшее несовершенного вида допускает длительное или повторявшееся поношение и не вынуждает уточнять вид действия сверх еврейского контекста.
