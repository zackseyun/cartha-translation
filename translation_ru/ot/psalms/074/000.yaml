  text: A Maskil of Asaph. Why[a], God, have you rejected us forever? Why does your anger smoke against the sheep of your pasture?
translation:
  language: ru
  text: 'Маскил[a] Асафа.


    Почему, Боже, ты навеки отверг нас? Почему твой гнев дымится против овец твоего пастбища?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Маскил» — специальный термин в надписании псалма; возможно, он обозначает произведение для размышления или наставления.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׂכִּיל
  choice: маскил
  rationale: Сохранён технический термин надписания псалма, поскольку его точное значение не установлено; возможные значения пояснены в сноске.
- source_word: זָנַחְתָּ
  choice: ты отверг нас
  rationale: Глагол означает «отвергнуть, отринуть». Прямое дополнение в еврейском тексте не выражено, но из обращения и дальнейшего содержания псалма ясно подразумевается народ говорящего; «нас» по-русски необходимо для естественности.
- source_word: לָנֶצַח
  choice: навеки
  rationale: Передаёт временную крайность вопроса, не превращая риторическую жалобу в утверждение об окончательном отвержении.
- source_word: יֶעְשַׁן אַפְּךָ
  choice: твой гнев дымится
  rationale: 'Сохранён яркий исходный образ: буквально «дымится твой гнев» (слово אַף может обозначать и «нос», и «гнев»).'
- source_word: צֹאן מַרְעִיתֶךָ
  choice: овец твоего пастбища
  rationale: Сохранена пастырская метафора и конструкция оригинала без замены её толкованием «твой народ».
theological_decisions:
- issue: Не выраженное в оригинале дополнение при «отверг»
  choice: ты отверг нас
  alternative: ты отверг
  rationale: «Нас» контекстуально подразумевается и делает русский вопрос грамматически естественным, не добавляя отдельного богословского утверждения.
- issue: Смысл слова «навеки»
  choice: сохранить формулировку жалобы без поясняющего ограничения
  alternative: «надолго» или «до каких пор»
  rationale: Оригинал говорит לָנֶצַח, «навсегда/навеки»; напряжение между переживаемым отвержением и обращением к Богу не следует сглаживать.
translation_notes:
  register: Современный литературный русский с сохранением торжественной поэтической образности. Местоимения, обращённые к Богу, даны со строчной буквы по общим нормам современной русской орфографии; обращение «Боже» сохраняет возвышенный тон.
