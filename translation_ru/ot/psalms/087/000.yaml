theological_decisions:
- issue: Неявный референт местоименного суффикса в יְסוּדָתוֹ
  choice: Сохранить буквальное «его», не называя Сион или Иерусалим
  alternative: «Его [Сиона] основание — на святых горах» или «Основание города — на святых горах»
  rationale: Еврейский текст не называет референт прямо; его явное добавление сняло бы подлинную неоднозначность.
- issue: Характер связи сынов Корея с псалмом
  choice: «Псалом сынов Корея»
  alternative: «Псалом для сынов Корея»
  rationale: Формула может обозначать авторство, принадлежность или исполнительскую связь; основной текст следует устойчивому русскому надписанию, а более широкая возможность отражена в сноске.
