lexical_decisions:
- source_word: נִכְבָּדוֹת
  choice: Славное
  rationale: Субстантивированная форма множественного числа от כבד обозначает то, что исполнено чести, величия и славы. В русском поэтическом контексте собирательное «славное» естественно передаёт неопределённое множество славных вещей.
- source_word: מְדֻבָּר
  choice: возвещают
  rationale: Причастие пуаля от דבר выражает то, что произносится или говорится. Неопределённо-личное «возвещают» сохраняет пассивный смысл и придаёт строке уместный возвышенный тон без указания не названного в еврейском тексте говорящего.
- source_word: בָּךְ
  choice: о тебе
  rationale: 'Предлог ב при глаголе речи здесь естественно понимать как указание на предмет речи: «о тебе». При этом возможное пространственное значение «в тебе» сохранено в сноске.'
- source_word: עִיר הָאֱלֹהִים
  choice: город Божий
  rationale: Сопряжённая конструкция буквально означает «город Бога». Фраза стоит в приложении и одновременно звучит как прямое обращение к городу; русский вариант без добавления междометия сохраняет эту форму.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение, вероятно литургического или музыкального термина, неизвестно, поэтому он передан традиционной транслитерацией без истолкования.
