    reason: lexical_alternative
lexical_decisions:
- source_word: וּלֲצִיּוֹן
  choice: И о Сионе
  rationale: Предлог לְ вводит тему высказывания, поэтому «о Сионе» естественно передаёт смысл «что касается Сиона»; союз וּ сохранён для поэтической связи с контекстом.
- source_word: יֵאָמַר
  choice: скажут
  rationale: Безлично-обобщённое «скажут» естественно передаёт нифаль имперфекта «будет сказано», не уточняя говорящего.
- source_word: אִישׁ וְאִישׁ
  choice: И тот и другой
  rationale: Повтор слова אִישׁ имеет распределительное значение. Русская конструкция «и тот и другой» сохраняет указание на отдельных людей и звучит естественнее буквального «человек и человек».
- source_word: יֻלַּד בָּהּ
  choice: родились в нём
  rationale: Форма глагола в еврейском единственного числа согласуется с распределительным оборотом, тогда как по-русски при «и тот и другой» нормативно множественное число. Местоимение мужского рода обусловлено грамматическим родом слова «Сион».
- source_word: וְהוּא
  choice: и Сам
  rationale: Ударное личное местоимение передано усилительным «Сам», относящимся к титулу «Всевышний».
- source_word: יְכוֹנְנֶהָ
  choice: утвердит его
  rationale: Глагол כון здесь означает прочно основать, утвердить или сделать незыблемым. «Утвердит» сохраняет поэтическую ёмкость и идею прочности.
- source_word: עֶלְיוֹן
  choice: Всевышний
  rationale: Устоявшийся русский эквивалент божественного титула עֶלְיוֹן, понятный и соответствующий возвышенному регистру псалма.
theological_decisions:
- issue: К кому относится ударное וְהוּא при עֶלְיוֹן
  choice: «Сам Всевышний» — местоимение относится к Богу и подчёркивает Его действие.
  alternative: «Он, Всевышний, утвердит его».
  rationale: Так сохраняется эмфаза еврейского местоимения без добавления богословских утверждений сверх текста.
- issue: Образ Сиона как города женского рода в еврейском тексте
  choice: Использованы формы «в нём» и «его» по грамматическому роду русского слова «Сион».
  alternative: Передать как «в ней» и «её», подразумевая «город» или персонифицированную женскую фигуру.
  rationale: В русском прямое согласование с названием «Сион» требует мужского рода. Добавление слова «город» ради сохранения женского рода внесло бы отсутствующий в строке элемент; сама персонификация при этом частично ослабляется, что неизбежно из-за различия грамматических родов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Скажут» предпочтено более тяжеловесному «будет сказано»; написание «Сам» подчёркивает ударное местоимение при божественном титуле. Пунктуация оформляет цитату как содержание того, что скажут о Сионе.
