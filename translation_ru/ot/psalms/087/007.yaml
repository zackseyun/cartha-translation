lexical_decisions:
- source_word: וְשָׁרִים
  choice: И певцы
  rationale: Причастная форма от שׁיר естественно означает «поющие, певцы». Возможное при иной огласовке значение «князья» здесь менее вероятно из-за параллели с חֹלְלִים.
- source_word: כְּחֹלְלִים
  choice: и пляшущие
  rationale: 'Слово, вероятнее всего, связано со значением кружения или пляски. В сжатой поэтической конструкции כ передано как присоединение второй группы: «и певцы, и пляшущие». Возможное значение, связанное с игрой на духовом инструменте, отмечено в сноске.'
- source_word: כָּל
  choice: Все
  rationale: Передаёт всеохватность еврейского слова и естественно звучит в поэтическом признании.
- source_word: מַעְיָנַי
  choice: мои родники
  rationale: מַעְיָן обозначает родник или источник. «Родники» сохраняет конкретный, живой поэтический образ и не сводит его к отвлечённому толкованию.
- source_word: בָּךְ
  choice: в тебе
  rationale: 'Предлог ב передан своим обычным значением «в»; местоимение обращено к Сиону. В русском именная конструкция естественно оформляется тире: «родники — в тебе».'
theological_decisions:
- issue: Метафорический смысл «моих родников» в обращении к Сиону
  choice: Сохранить образ родников без догматизирующего пояснения в основном тексте.
  alternative: «Все источники моей жизни — в тебе» или «Все мои благословения — в тебе».
  rationale: Еврейский текст представляет Сион средоточием принадлежности и жизни, но не раскрывает образ однозначно. Буквенная метафора сохраняет поэтическую и богословскую многозначность.
- issue: Подразумеваемый глагол речи
  choice: Добавить «говорят» для ясной и естественной русской фразы.
  alternative: 'Сохранить бессоюзную номинативную конструкцию: «И певцы, и пляшущие: “Все мои родники — в тебе”».'
  rationale: В еврейской строке глагол речи отсутствует, но последующее высказывание естественно понимается как слова названных групп. Добавление не устраняет смысловой неоднозначности образа и делает синтаксис понятным современному читателю.
translation_notes:
  register: Современный литературный русский язык с краткой, возвышенной поэтической формой. Повтор «и … и …» передаёт совместность обеих групп. Кавычки обозначают подразумеваемую прямую речь; образ родников сохранён конкретным и не разъяснён в основном тексте.
