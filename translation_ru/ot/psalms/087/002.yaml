  text: אֹהֵ֣ב יְ֭הוָה שַׁעֲרֵ֣י צִיּ֑וֹן מִ֝/כֹּ֗ל מִשְׁכְּנ֥וֹת יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/002.yaml
  text: Yahweh loves the gates of Zion more than all the dwellings of Jacob[a].
translation:
  language: ru
  text: Яхве любит врата Сиона больше всех жилищ Иакова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве любит врата Сиона превыше всех жилищ Иакова».'
    reason: Лексическая альтернатива передачи сравнительной конструкции מִכֹּל.
lexical_decisions:
- source_word: אֹהֵב
  choice: любит
  rationale: Причастие породы qal от אהב употреблено здесь как сказуемое при יהוה и выражает постоянное отношение; простое настоящее «любит» естественно передаёт этот смысл без усиления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: שַׁעֲרֵי
  choice: врата
  rationale: Сопряжённая форма множественного числа от שׁער передана конкретным образом «врата»; возможную метонимию всего города не следует подставлять в основной текст.
- source_word: צִיּוֹן
  choice: Сиона
  rationale: Использована устоявшаяся в русском библейском и литературном употреблении форма топонима «Сион».
- source_word: מִכֹּל
  choice: больше всех
  rationale: Предлог מן при כל после глагола предпочтения выражает сравнение; по-русски «больше всех» ясно и естественно передаёт предпочтение.
- source_word: מִשְׁכְּנוֹת
  choice: жилищ
  rationale: Множественное число от משכן здесь имеет общее значение мест обитания; «жилища» понятно современному читателю и не привносит культового значения слова «скинии».
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Сохранено собственное имя исходного текста, хотя в контексте оно корпоративно обозначает народ или землю Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Сравнительное значение מִכֹּל
  choice: больше всех жилищ Иакова
  alternative: превыше всех жилищ Иакова
  rationale: Конструкция наиболее естественно сопоставляет врата Сиона со всеми прочими местами обитания Иакова. Основной вариант явно передаёт сравнительную силу, не развивая её в дополнительное богословское утверждение.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенной поэтической лексикой: «врата» сохраняет образ и псалмический регистр, тогда как синтаксис остаётся простым и понятным.'
