  text: אַזְכִּ֤יר רַ֥הַב וּ/בָבֶ֗ל לְֽ/יֹ֫דְעָ֥/י הִנֵּ֤ה פְלֶ֣שֶׁת וְ/צ֣וֹר עִם כּ֑וּשׁ זֶ֝֗ה יֻלַּד שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/004.yaml
  text: 'I will mention Rahab and Babylon among those who know me[a]; behold, Philistia and Tyre[c][b], along with Cush: this one was born there.'
translation:
  language: ru
  text: 'Я упомяну Раав[a] и Вавилон среди знающих меня[b]; вот Филистия и Тир вместе с Кушем: этот родился там[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Раав — поэтическое название Египта.
    reason: alternative_reading
  - marker: b
    text: 'Или: «тем, кто знает меня». Еврейское выражение может обозначать адресатов речи, а не включение в их число.'
    reason: lexical_alternative
  - marker: c
    text: То есть в Сионе, судя по контексту псалма.
    reason: cross_reference
lexical_decisions:
- source_word: אַזְכִּיר
  choice: Я упомяну
  rationale: Каузативная порода глагола זכר здесь означает «упомянуть, назвать». Будущее время и естественный русский глагол сохраняют форму и поэтический характер перечисления.
- source_word: רַהַב
  choice: Раав
  rationale: Сохранено поэтическое имя Египта, а его значение пояснено в сноске, чтобы не заменять образ толкованием в основном тексте.
- source_word: וּבָבֶל
  choice: и Вавилон
  rationale: Употреблено общепринятое русское название страны и города.
- source_word: לְיֹדְעָי
  choice: среди знающих меня
  rationale: Сжатое сочетание предлога לְ с причастием допускает понимание включения в число признающих говорящего. Вариант с адресатом сохранён в сноске.
- source_word: הִנֵּה
  choice: вот
  rationale: «Вот» естественно передаёт указательное и привлекающее внимание значение еврейского слова без архаизации.
- source_word: פְלֶשֶׁת
  choice: Филистия
  rationale: Еврейский текст называет страну или область, а не прямо народ; название сохраняет параллелизм с Тиром и Кушем.
- source_word: וְצוֹר
  choice: и Тир
  rationale: Использовано традиционное русское название города.
- source_word: עִם כּוּשׁ
  choice: вместе с Кушем
  rationale: Оборот передаёт значение сопровождения и объединяет Куш с перечисленными землями.
- source_word: כּוּשׁ
  choice: Куш
  rationale: Транслитерация избегает неточного отождествления древнего Куша с современной Эфиопией.
- source_word: זֶה
  choice: этот
  rationale: Сохранено единственное число мужского рода указательного местоимения; не добавлено отсутствующее в оригинале слово «человек».
- source_word: יֻלַּד שָׁם
  choice: родился там
  rationale: Пассивная форма ילד с שָׁם прямо указывает на рождение в названном контекстом месте; русская возвратная форма звучит естественно.
theological_decisions:
- issue: Кто говорит в выражении «знающих меня»
  choice: Сохранено местоимение первого лица без уточнения личности говорящего.
  alternative: Говорящий — Господь; либо говорящий — олицетворённый Сион.
  rationale: Сам стих не называет говорящего прямо. Строчная буква не навязывает отождествление, оставляя его контексту псалма.
- issue: К чему относится слово «там»
  choice: В основном тексте сохранено неопределённое «там».
  alternative: Явно перевести «в Сионе» или «в городе Божьем».
  rationale: Контекст указывает на Сион, но еврейский текст употребляет наречие, поэтому уточнение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксическая сжатость и перечисление исходного текста сохранены; архаизмы и конфессионально обусловленные уточнения не добавлены.
