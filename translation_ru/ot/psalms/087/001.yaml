  text: לִ/בְנֵי קֹ֭רַח מִזְמ֣וֹר שִׁ֑יר יְ֝סוּדָת֗/וֹ בְּ/הַרְרֵי קֹֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/001.yaml
  text: A psalm of the sons of Korah[a]; a song[c][b]. His foundation is in the holy mountains.
translation:
  language: ru
  text: Псалом сыновей Кораха;[a] песнь. Его основание — на святых горах.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Псалом для сыновей Кораха» или «Псалом, принадлежащий сыновьям Кораха».'
    reason: Еврейский предлог לְ может указывать не только на авторство, но и на принадлежность, связь или предназначение.
  - marker: b
    text: 'Возможно также: «Её основание — на святых горах», если подразумевается Сион или Иерусалим.'
    reason: Еврейский суффикс имеет форму мужского рода, однако его подразумеваемый референт в самом стихе не назван.
lexical_decisions:
- source_word: לִבְנֵי קֹרַח
  choice: сыновей Корея
  rationale: Предлог לְ в надписаниях псалмов может обозначать авторство, принадлежность, связь или предназначение. Краткая формулировка «сыновей Корея» естественна по-русски, а неоднозначность уточняется в сноске.
- source_word: מִזְמוֹר
  choice: псалом
  rationale: Устоявшееся и точное русское обозначение жанра מִזְמוֹר.
- source_word: שִׁיר
  choice: песнь
  rationale: Передаёт отдельное жанровое обозначение שִׁיר; оно сохранено наряду со словом «псалом», как и в еврейском тексте.
- source_word: יְסוּדָתוֹ
  choice: основание его
  rationale: Существительное означает «основание», а суффикс 3-го лица мужского рода — «его». Постпозиция местоимения позволяет не выделять его прописной буквой и не отождествлять явно с Богом.
- source_word: בְּהַרְרֵי קֹדֶשׁ
  choice: на святых горах
  rationale: В данном топографическом контексте בְ естественно передаётся предлогом «на», а сочетание с קֹדֶשׁ — как «святых горах».
theological_decisions:
- issue: К кому относится местоименный суффикс в יְסוּדָתוֹ
  choice: Сохранить формальную мужскую форму и не называть подразумеваемого обладателя основания.
  alternative: «Её основание» — если подразумевается Сион или Иерусалим; либо «Он основал его» — если субъектом считается Бог.
  rationale: Антецедент в стихе прямо не назван. Формулировка «основание его» сохраняет грамматическую форму и не устраняет поэтическую и богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмической лексикой. Два жанровых обозначения сохранены; точка с запятой связывает их в единое надписание. Порядок «основание его» избегает ненамеренной капитализации местоимения и тем самым не навязывает отождествление его референта с Богом.
