base_translation:
  language: en
  yaml_path: translation/ot/psalms/087/006.yaml
  text: Yahweh will count[a], when he records the peoples, “This one was born there.” Selah
translation:
  language: ru
  text: 'Яхве будет вести счёт, записывая народы: «Этот родился там[a]». Села.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с учётом контекста: «в Сионе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: יִסְפֹּר
  choice: сочтёт
  rationale: Сохраняет основное значение глагола ספר — «считать, исчислять»; следующий оборот уточняет образ внесения в запись.
- source_word: בִּכְתוֹב
  choice: когда будет записывать
  rationale: Предлог ב с инфинитивом здесь имеет временное значение. Такая передача естественна по-русски и сохраняет образ регистрации.
- source_word: עַמִּים
  choice: народы
  rationale: Обычное русское соответствие множественному עַמִּים; речь идёт о множестве народов, учитываемых в связи с Сионом.
- source_word: זֶה
  choice: этот
  rationale: Мужское указательное местоимение обозначает отдельного человека; «этот» не добавляет отсутствующего в еврейском тексте существительного.
- source_word: יֻלַּד
  choice: родился
  rationale: Естественно передаёт пассивную форму глагола ילד и подходит для формулы, произносимой при записи.
- source_word: שָׁם
  choice: там
  rationale: Буквально передаёт наречие места и не делает его подразумеваемый антецедент явным; контекстуальный вариант отмечен в сноске.
- source_word: סֶלָה
  choice: Села
  rationale: Неясный по точному значению литургический или музыкальный термин передан традиционной транслитерацией без ложной конкретизации.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: Транслитерация сохраняет личное имя, открытое Богом Израилю, и не подменяет его титулом.
- issue: Следует ли пояснять שָׁם как указание на Сион
  choice: там
  alternative: в ней; в Сионе
  rationale: Еврейский текст употребляет наречие «там», хотя контекст указывает на Сион. Основной текст сохраняет исходную форму и её некоторую недосказанность, а контекстуальное понимание вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Синтаксис сохраняет образ небесной переписи; двоеточие вводит формулу записи. Маркер сноски поставлен непосредственно после слова «там», к которому относится вариант.
