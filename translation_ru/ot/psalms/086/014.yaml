  text: אֱלֹהִ֤ים זֵ֘דִ֤ים קָֽמוּ עָלַ֗/י וַ/עֲדַ֣ת עָ֭רִיצִים בִּקְשׁ֣וּ נַפְשִׁ֑/י וְ/לֹ֖א שָׂמ֣וּ/ךָ לְ/נֶגְדָּֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/014.yaml
  text: God[a], arrogant men have risen against me, and a band of ruthless men has sought my life[c][b]; they have not set you before them.
translation:
  language: ru
  text: Боже, надменные восстали против меня, и сборище жестоких искало моей жизни[a]; они не поставили Тебя перед собой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «искало моей души (или жизни)»; это еврейское выражение означает, что они хотели убить псалмопевца.'
    reason: cultural_note
  - marker: b
    text: То есть они не держали Бога перед глазами и не считались с Ним.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма употреблена как прямое обращение к Богу; русский звательный эквивалент «Боже» естественно передаёт это без добавления междометия.
- source_word: זֵדִים
  choice: надменные
  rationale: Субстантивированное прилагательное обозначает гордых, дерзких людей; «надменные» сохраняет нравственную характеристику и не требует добавлять отсутствующее существительное.
- source_word: קָמוּ עָלַי
  choice: восстали против меня
  rationale: Устойчивое сочетание קום על выражает враждебное выступление против кого-либо; совершенный вид соответствует форме и контексту жалобы.
- source_word: וַעֲדַת עָרִיצִים
  choice: сборище жестоких
  rationale: עֵדָה означает собравшуюся группу, а עָרִיצִים — жестоких, насильственных людей. «Сборище» естественно передаёт здесь враждебный характер группы.
- source_word: בִּקְשׁוּ נַפְשִׁי
  choice: ищет моей смерти
  rationale: Буквально выражение связано с поиском «души/жизни» говорящего, но в данном контексте это еврейская идиома, означающая намерение лишить его жизни. Русское «ищет моей души» было бы неясно и могло бы получить ошибочный духовный смысл.
- source_word: וְלֹא שָׂמוּךָ לְנֶגְדָּם
  choice: они не ставят Тебя перед собой
  rationale: 'Сохранена исходная пространственная метафора: эти люди не держат Бога перед собой, то есть не считаются с Ним.'
theological_decisions:
- issue: Передача обращения אֱלֹהִים
  choice: Боже
  alternative: О Боже
  rationale: Еврейский текст содержит прямое обращение, но не отдельное междометие; русская форма «Боже» передаёт обращение без добавления «о».
- issue: Степень экспликации идиомы בִּקְשׁוּ נַפְשִׁי
  choice: ищет моей смерти
  alternative: ищет моей души / ищет моей жизни
  rationale: В контексте враждебного нападения идиома означает стремление убить молящегося. Экспликация необходима для ясного современного русского языка, а буквальный образ отмечен в сноске.
- issue: Смысл отсутствия Бога «перед ними»
  choice: сохранить метафору в основном тексте
  alternative: они не считаются с Тобой
  rationale: Буквенная метафора понятна по-русски и сохраняет богословски значимую мысль о сознательном отсутствии внимания к Богу; подразумеваемый смысл пояснён в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. «Сборище» передаёт отрицательно окрашенную враждебную группу; прописные формы «Тебя» следуют принятому русскому благоговейному обращению к Богу. Порядок частей и параллелизм еврейской строки сохранены.
