  naturalness: Предлагаемая редакция остаётся современной литературной и молитвенно-достойной. «Сборище жестоких» естественно, а «искало моей жизни» — понятное русское выражение в контексте угрозы; сноска разъясняет его смертельный смысл.
  terminology: «Боже» удачно передаёт прямое обращение. «Надменные» приемлемо для זֵדִים. «Жестоких» допустимо для עָרִיצִים, хотя слово охватывает также насильственный и безжалостный характер этих людей. Прописное «Тебя» последовательно для обращения к Богу.
