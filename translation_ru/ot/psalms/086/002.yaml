source:
  edition: WLC
  text: שָֽׁמְרָ֣/ה נַפְשִׁ/י֮ כִּֽי חָסִ֪יד אָ֥נִי הוֹשַׁ֣ע עַ֭בְדְּ/ךָ אַתָּ֣ה אֱלֹהַ֑/י הַ/בּוֹטֵ֥חַ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/002.yaml
  text: Guard my life[a], for I am faithful; save your servant, my God[b], who trusts in you.
translation:
  language: ru
  text: Береги мою жизнь[a], ведь я предан Тебе[b]; спаси раба Твоего, Боже мой, уповающего на Тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мою душу»; здесь это слово, вероятно, означает «мою жизнь» или «меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «я благочестив», «я верен» или «я верный Тебе». Еврейское слово выражает преданность и верность Богу, а не безгрешное совершенство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְרָה
  choice: Береги
  rationale: Повелительная форма обращения к Богу с просьбой охранять и сохранять; «береги» естественно звучит по-русски и передаёт защитный смысл.
- source_word: נַפְשִׁי
  choice: мою жизнь
  rationale: В контексте просьбы об избавлении נֶפֶשׁ обозначает жизнь или самого человека, а не только нематериальную «душу».
- source_word: כִּי
  choice: ведь
  rationale: Передаёт основание просьбы и естественно связывает части молитвенного обращения.
- source_word: חָסִיד
  choice: предан Тебе
  rationale: Передаёт благочестивую, верную приверженность Богу в отношениях завета, не подразумевая безгрешного совершенства.
- source_word: הוֹשַׁע
  choice: спаси
  rationale: Прямо передаёт повелительную форму со значением спасения и избавления.
- source_word: עַבְדְּךָ
  choice: раба Твоего
  rationale: В молитвенном обращении это традиционное и уместное обозначение смиренного служения и принадлежности Богу.
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Вокативная форма естественно передаёт личное обращение псалмопевца к своему Богу.
- source_word: הַבּוֹטֵחַ אֵלֶיךָ
  choice: уповающего на Тебя
  rationale: Причастный оборот относится к «рабу Твоему» и передаёт продолжающееся доверие и надежду на Бога.
theological_decisions:
- issue: Смысл חָסִיד в самоописании псалмопевца
  choice: «я предан Тебе» — заявление о верности и благочестивой приверженности Богу
  alternative: «я благочестив», «я свят», «я верный»
  rationale: Так сохраняется обращение к отношениям верности с Богом, но не создаётся впечатления, будто говорящий заявляет о безгрешности или заслуживает спасение собственным совершенством.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенным звучанием. Местоимения обращения к Богу написаны с прописной буквы. Синтаксис сохраняет связь причастия «уповающего» с «рабом Твоим», а обращение «Боже мой» не разрывает эту связь.
