  yaml_path: translation/ot/psalms/086/008.yaml
  text: There is none like you among the gods[a], Lord[b], and there are no works like yours.
translation:
  language: ru
  text: Нет подобного Тебе среди богов[a], Господи, и нет дел[b], подобных Твоим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди небесных существ». В еврейском тексте буквально: «среди богов» — распространённый библейский способ провозгласить несравнимость Господа с любыми силами, именуемыми божественными.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «деяний» или «действий».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּמוֹךָ
  choice: Нет подобного Тебе
  rationale: Экзистенциальное отрицание с конструкцией сравнения прямо и поэтично выражает полную несравненность адресата.
- source_word: בָאֱלֹהִים
  choice: среди богов
  rationale: Предлог בְּ и форма אֱלֹהִים в данном сравнительном обороте естественно передаются как «среди богов»; буквальная множественность сохранена без навязывания метафизического толкования.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Форма звательного падежа естественно передаёт божественный титул в молитвенном обращении.
- source_word: וְאֵין כְּמַעֲשֶׂיךָ
  choice: и нет дел, подобных Твоим
  rationale: מַעֲשֶׂה охватывает дела, деяния и действия; «дел» сохраняет широкий смысл и параллелизм стиха.
theological_decisions:
- issue: Значение выражения «среди богов»
  choice: Сохранить множественное «среди богов» как поэтическое утверждение несравненности Господа.
  alternative: «среди небесных существ» или сглаженное «нет бога, подобного Тебе»
  rationale: Еврейский текст прямо употребляет אֱלֹהִים во множественной сравнительной конструкции. Буквальная передача сохраняет богословское напряжение и не утверждает сама по себе политеизма.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Местоимения, обращённые к Богу, написаны с прописной буквы; синтаксический параллелизм еврейской строки сохранён.
