  text: כָּל גּוֹיִ֤ם אֲשֶׁ֥ר עָשִׂ֗יתָ יָב֤וֹאוּ וְ/יִשְׁתַּחֲו֣וּ לְ/פָנֶ֣י/ךָ אֲדֹנָ֑/י וִֽ/יכַבְּד֣וּ לִ/שְׁמֶֽ/ךָ־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/009.yaml
  text: All the nations that you have made will come and bow down before you[a], Lord[b], and they will honor your name.
translation:
  language: ru
  text: Все народы, которые Ты создал, придут и поклонятся перед Тобой[a], Господи, и прославят имя Твоё[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «падут ниц перед Тобой»; еврейский глагол означает почтительно склониться или простереться и в таком контексте — поклониться.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «почтут имя Твоё».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל גּוֹיִם
  choice: все народы
  rationale: Передаёт полный коллективный охват и сохраняет широкое значение גּוֹיִם без более узкого противопоставления Израиля язычникам.
- source_word: אֲשֶׁר עָשִׂיתָ
  choice: которых Ты создал
  rationale: В данном контексте עשה относится к тому, что Бог произвёл народы; «создал» естественно выражает этот смысл по-русски, не меняя референта.
- source_word: יָבֹאוּ
  choice: придут
  rationale: Имперфект выражает ожидаемое будущее действие.
- source_word: וְיִשְׁתַּחֲווּ
  choice: и поклонятся
  rationale: Глагол обозначает преклонение или простирание в почтении и по контексту также несёт смысл поклонения; русский глагол сохраняет оба оттенка.
- source_word: לְפָנֶיךָ
  choice: пред Тобой
  rationale: Естественный для возвышенного современного русского эквивалент выражения «перед Твоим лицом», то есть в Твоём присутствии.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Устоявшаяся передача божественного титула אֲדֹנָי в русском библейском употреблении.
- source_word: וִיכַבְּדוּ
  choice: и прославят
  rationale: Пиэль כבד означает воздать честь или славу. Сочетание «прославят имя» естественно по-русски; вариант «почтут» отмечен в сноске, чтобы сохранить лексическую широту.
- source_word: לִשְׁמֶךָ
  choice: имя Твоё
  rationale: Сохраняет прямой объект и характерный для поэтической речи порядок слов.
theological_decisions:
- issue: Охват ответа народов
  choice: Будущее всеобщее поклонение Господу всех созданных Им народов
  alternative: Гиперболическое обозначение множества народов, а не каждого народа без исключения
  rationale: Формулировка стиха прямо охватывает «все народы»; перевод не сужает и не усиливает это утверждение толкованием.
- issue: Характер действия וְיִשְׁתַּחֲווּ
  choice: «поклонятся» с сохранением значения почтительного преклонения
  alternative: «падут ниц» или «совершат поклонение»
  rationale: Выбранный русский глагол сохраняет как телесный образ поклона, так и религиозное значение, не вынуждая выбирать только один оттенок.
- issue: Передача אֲדֹנָי
  choice: Господь
  alternative: Владыка
  rationale: «Господь» является естественной передачей божественного титула и не добавляет конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Местоимения, относящиеся к Богу, написаны с прописной буквы; инверсия «имя Твоё» поддерживает достоинство и ритм строки, оставаясь понятной.
