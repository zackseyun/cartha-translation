lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующей молитвы и хвалы; «ведь» естественно передаёт причинно-пояснительную связь в современном русском языке.
- source_word: גָדוֹל
  choice: велик
  rationale: Прилагательное выражает величие Бога в достоинстве и силе; «велик» прямо и уместно звучит в поэтической хвале.
- source_word: וְעֹשֵׂה
  choice: и творишь
  rationale: Причастие обозначает характерное, постоянное действие. Настоящее время передаёт этот обобщённый смысл, а «творишь» сохраняет возвышенный, но понятный регистр.
- source_word: נִפְלָאוֹת
  choice: чудеса
  rationale: Слово обозначает необычайные, вызывающие изумление деяния, особенно деяния Бога; «чудеса» — естественный и точный русский эквивалент.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологическую форму множественного числа, обращение во втором лице и утверждение исключительности ясно требуют единственного числа и написания «Бог».
- source_word: לְבַדֶּךָ
  choice: Ты один
  rationale: Форма означает «ты один / только ты». Русская конструкция «Ты один — Бог» подчёркивает исключительность и сохраняет порядок смысловых акцентов еврейского текста.
theological_decisions:
- issue: Исключительное утверждение о Боге в заключительной части стиха
  choice: Ты один — Бог
  alternative: Ты — единственный Бог
  rationale: Выбранный вариант наиболее непосредственно сохраняет утверждение אַתָּה אֱלֹהִים לְבַדֶּךָ и акцент לְבַדֶּךָ на том, что только адресат является Богом. Альтернатива естественна по-русски, но добавляет прилагательное «единственный» вместо более буквального наречного выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Заглавное «Ты» употреблено как традиционное почтительное обращение к Богу; тире помогает ясно выразить именную конструкцию и исключительный акцент заключительной строки.
