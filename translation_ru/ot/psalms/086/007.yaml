lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: В день моей беды
  rationale: Передаёт временную конструкцию и личный характер страдания; «беда» естественно и достаточно широко выражает צָרָה — бедствие, тесноту, тяжёлое положение.
- source_word: אֶקְרָאךָּ
  choice: я взываю к Тебе
  rationale: В молитвенном контексте קרא с объектом лица означает обращение с призывом о помощи; «взываю» точнее простого «зову» и сохраняет возвышенный, но понятный регистр.
- source_word: כִּי
  choice: потому что
  rationale: 'Сохранено причинное значение союза: уверенность в Божьем ответе служит основанием для молитвенного обращения.'
- source_word: תַעֲנֵנִי
  choice: Ты отвечаешь мне
  rationale: Еврейская имперфектная форма в данном контексте выражает уверенное ожидание или характерное действие; русское настоящее время естественно сохраняет уверенность псалмопевца, не сужая смысл до однократного будущего ответа.
theological_decisions:
- issue: Временная перспектива תַעֲנֵנִי
  choice: Ты отвечаешь мне
  alternative: Ты ответишь мне
  rationale: Настоящее время соответствует контексту уверенного обращения и английскому консультационному слою, сохраняя возможность понимать ответ как надёжное Божье действие, а не только как отдельное будущее событие.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью. Местоимения, обращённые к Богу, написаны с прописной буквы по принятой русской религиозной издательской норме; синтаксис краткий и естественный.
