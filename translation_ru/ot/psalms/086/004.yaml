  text: שַׂ֭מֵּחַ נֶ֣פֶשׁ עַבְדֶּ֑/ךָ כִּ֥י אֵלֶ֥י/ךָ אֲ֝דֹנָ֗/י נַפְשִׁ֥/י אֶשָּֽׂא׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/004.yaml
  text: Gladden the soul of your servant[a], for to you, Lord, I lift up my soul.
translation:
  language: ru
  text: 'Возвесели душу раба Твоего[a],

    ибо к Тебе, Господи, возношу я душу мою.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвесели самого раба Твоего»; еврейское слово может означать «душа», «жизнь» или самого человека.'
    reason: Лексическая многозначность נֶפֶשׁ.
lexical_decisions:
- source_word: שַׂמֵּחַ
  choice: возвесели
  rationale: 'Пиэль, повелительное наклонение 2-го лица мужского рода единственного числа: прямая просьба к Богу даровать радость. «Возвесели» сохраняет побудительную силу, молитвенный тон и поэтическую краткость.'
- source_word: נֶפֶשׁ / נַפְשִׁי
  choice: душу / душу мою
  rationale: В контексте молитвы слово обозначает самого человека, его жизнь или внутреннее существо. «Душа» естественно звучит в русской молитвенной речи и позволяет сохранить намеренный повтор еврейского слова.
- source_word: עַבְדֶּךָ
  choice: раба Твоего
  rationale: При обращении к Богу עבד выражает смиренное служение и принадлежность Ему. Традиционное русское «раб Твой» здесь точнее по смысловой силе, чем нейтральное «слуга», но не сводит выражение к описанию общественного положения.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание просьбы. «Ибо» ясно передаёт причинную связь и соответствует возвышенному, но понятному молитвенному регистру.
- source_word: אֵלֶיךָ
  choice: к Тебе
  rationale: Предлог אֶל выражает направленность; «к Тебе» естественно сочетается с метафорой вознесения души.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Божественный титул передан русской звательной формой, естественной в прямом молитвенном обращении.
- source_word: אֶשָּׂא
  choice: возношу
  rationale: Форма от נשׂא буквально передаёт поднятие и сохраняет молитвенную метафору устремления всего существа к Богу.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ
  choice: В обоих случаях передать словом «душа»
  alternative: «сам», «жизнь», «всё моё существо»
  rationale: «Душа» сохраняет духовную и поэтическую выразительность, не навязывая тексту строгого учения о составе человека; диапазон значения отмечен в сноске.
- issue: Смысл עבד в отношении молящегося к Богу
  choice: «раб Твой»
  alternative: «слуга Твой»
  rationale: В псалме выражение подчёркивает смиренную принадлежность Богу и служение Ему. Русское «раб Твой» сохраняет эту силу и укоренено в молитвенной речи, не требуя понимания стиха как высказывания о социальном рабстве.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным звучанием. Сохранены обращение «Господи», параллельный повтор «душу» и метафора её вознесения; прописные местоимения отражают почтительное обращение к Богу.
