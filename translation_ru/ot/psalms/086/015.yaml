  text: וְ/אַתָּ֣ה אֲ֭דֹנָ/י אֵל רַח֣וּם וְ/חַנּ֑וּן אֶ֥רֶךְ אַ֝פַּ֗יִם וְ/רַב חֶ֥סֶד וֶ/אֱמֶֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/015.yaml
  text: But you[a], Lord, are a compassionate and gracious God, slow to anger and abounding in steadfast love and faithfulness.
translation:
  language: ru
  text: Но Ты, Господь, — Бог сострадательный и милостивый, не скорый на гнев, богатый неизменной любовью и верностью[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истиной». В этой формуле завета еврейское слово часто означает верность или надёжность, а не только истину в отвлечённом смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתָּה
  choice: Но Ты
  rationale: Союз в контексте выражает противопоставление, а явное местоимение подчёркивает обращение к Богу.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Это почтительный титул Бога; здесь он не требует буквальной передачи как «мой господин».
- source_word: אֵל
  choice: Бог
  rationale: В данном исповедальном описании слово прямо называет Господа Богом; перевод «могущественный Бог» добавил бы невыраженный оттенок.
- source_word: רַחוּם וְ/חַנּוּן
  choice: сострадательный и милостивый
  rationale: Так сохраняется различие между глубоким состраданием и готовностью являть милость, а формула звучит естественно по-русски.
- source_word: אֶרֶךְ אַפַּיִם
  choice: не скорый на гнев
  rationale: Это естественная передача еврейской идиомы, буквально связанной с «долготой ноздрей» и означающей сдержанность перед лицом провокации.
- source_word: וְ/רַב חֶסֶד
  choice: богатый неизменной любовью
  rationale: רַב указывает на изобилие, а חֶסֶד здесь обозначает устойчивую, верную любовь в отношениях завета; формулировка остаётся понятной современному читателю.
- source_word: וֶ/אֱמֶת
  choice: и верностью
  rationale: В сочетании с חֶסֶד слово выражает надёжность и верность Бога, хотя буквальное и допустимое значение «истина» сохранено в примечании.
theological_decisions:
- issue: Передача формулы Божьего характера, перекликающейся с Исходом 34:6
  choice: сострадательный и милостивый, не скорый на гнев, богатый неизменной любовью и верностью
  alternative: милосердный и милостивый, долготерпеливый, многомилостивый и истинный
  rationale: Выбранный вариант сохраняет богословскую связь с формулой завета, но передаёт её ясным современным русским языком и не сводит אֱמֶת лишь к абстрактной истине.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Прописная буква в «Ты» поддерживает почтительный регистр обращения к Богу; тире ясно оформляет именную конструкцию.
