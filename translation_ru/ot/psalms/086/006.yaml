  text: הַאֲזִ֣ינָ/ה יְ֭הוָה תְּפִלָּתִ֑/י וְ֝/הַקְשִׁ֗יבָ/ה בְּ/ק֣וֹל תַּחֲנוּנוֹתָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/006.yaml
  text: Give ear[a], O Yahweh, to my prayer, and listen to the voice of my pleas for mercy.
translation:
  language: ru
  text: Прислушайся, Яхве, к моей молитве и внемли голосу моих молений о милости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Прислушайся
  rationale: Императив от אזן призывает внимательно склонить слух. «Прислушайся» естественно передаёт этот образ и сохраняет отличие от следующего параллельного глагола.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: תְּפִלָּתִי
  choice: к моей молитве
  rationale: Прямое и естественное соответствие существительному תְּפִלָּה с суффиксом первого лица единственного числа.
- source_word: וְהַקְשִׁיבָה
  choice: и внемли
  rationale: Императив קשב выражает внимательное слушание. «Внемли» сохраняет возвышенный молитвенный регистр и поэтический параллелизм.
- source_word: בְּקוֹל
  choice: голосу
  rationale: קוֹל буквально означает «голос» или «звук»; здесь «голосу» прямо отражает еврейскую конструкцию и естественно сочетается с глаголом «внемли».
- source_word: תַּחֲנוּנוֹתָי
  choice: моих молений о милости
  rationale: Множественное תַּחֲנוּנִים обозначает настойчивые просьбы о благоволении или милости. Эта формулировка передаёт и множественность, и смысловую направленность просьб.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе Бог назван личным заветным именем. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. «Внемли» несколько возвышенно, но понятно и уместно в псалме; пара «прислушайся — внемли» сохраняет параллелизм двух еврейских императивов.
