  text: חָנֵּ֥/נִי אֲדֹנָ֑/י כִּ֥י אֵלֶ֥י/ךָ אֶ֝קְרָ֗א כָּל הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/003.yaml
  text: Be gracious to me[a], Lord, for I call to you all day long.
translation:
  language: ru
  text: Будь милостив ко мне[a], Господи, ведь я взываю к Тебе весь день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Помилуй меня». Еврейский глагол может выражать просьбу о милостивом благоволении или милосердии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנֵּנִי
  choice: Будь милостив ко мне
  rationale: Императив חנן с суффиксом 1-го лица выражает просьбу о милости или благоволении. Этот вариант естественен для современной русской молитвенной речи и сохраняет смысл милостивого расположения.
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Божественный титул אֲדֹנָי передан традиционной русской звательной формой «Господи», уместной при прямом обращении к Богу.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание просьбы. «Ведь» естественно передаёт причинно-обосновывающую связь в современном русском языке.
- source_word: אֵלֶיךָ
  choice: к Тебе
  rationale: Предлог אֶל с суффиксом 2-го лица указывает направление обращения; с глаголом «взывать» естественно сочетание «к Тебе».
- source_word: אֶקְרָא
  choice: я взываю
  rationale: קרא может означать «звать», «призывать» или «взывать». В молитвенном контексте «взываю» ясно передаёт обращение к Богу, не усиливая его до явно обозначенного крика.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Фраза буквально означает «весь день»; русское выражение сохраняет продолжительный или повторяющийся характер молитвенного обращения.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господи
  alternative: Владыка; мой Господь
  rationale: В прямом молитвенном обращении форма «Господи» точно и естественно передаёт титул, не добавляя отдельного притяжательного значения и не вводя конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавные буквы в местоимении «Тебе» отражают принятую русскую практику уважительного обращения к Богу; смысловой неоднозначности это не устраняет.
