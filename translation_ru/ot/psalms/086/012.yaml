source:
  edition: WLC
  text: אוֹדְ/ךָ֤ אֲדֹנָ֣/י אֱ֭לֹהַ/י בְּ/כָל לְבָבִ֑/י וַ/אֲכַבְּדָ֖ה שִׁמְ/ךָ֣ לְ/עוֹלָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/012.yaml
  text: I will praise you[a], Lord my God, with all my heart, and I will glorify your name forever.
translation:
  language: ru
  text: Буду славить Тебя[a], Господи, Боже мой, всем сердцем моим и вечно прославлять имя Твоё.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду благодарить Тебя»; еврейский глагол в контексте поклонения может означать как благодарение, так и хвалу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹדְךָ
  choice: Буду славить Тебя
  rationale: Глагол ידה в породе hифиль может означать благодарение или хвалу. В контексте поклонения и в параллели с прославлением Божьего имени естественнее «славить»; имперфект передан как обещание, обращённое в будущее.
- source_word: אֲדֹנָי אֱלֹהַי
  choice: Господи, Боже мой
  rationale: Сохранены оба обращения и суффикс первого лица; русский звательный оттенок естественно выражен формами «Господи, Боже мой».
- source_word: בְּכָל לְבָבִי
  choice: всем сердцем моим
  rationale: Сохранён образ сердца и смысл полной, неразделённой внутренней преданности; порядок слов соответствует возвышенному, но понятному поэтическому регистру.
- source_word: וַאֲכַבְּדָה
  choice: и вечно прославлять
  rationale: Piel от כבד означает чтить или прославлять. При объекте «имя Твоё» глагол «прославлять» естественно передаёт богослужебный смысл. Инфинитив после «буду» по-русски распространяет будущее значение на вторую часть строки.
- source_word: שִׁמְךָ
  choice: имя Твоё
  rationale: 'Буквальный образ сохранён: имя представляет явленный характер и славу Бога, и его не следует заменять толкованием.'
- source_word: לְעוֹלָם
  choice: вечно
  rationale: Передаёт длительность без конца и естественно сочетается с «прославлять».
theological_decisions:
- issue: 'Значение אוֹדְךָ: хвала или благодарение'
  choice: Буду славить Тебя
  alternative: Буду благодарить Тебя
  rationale: Оба значения лексически возможны. Параллель с прославлением имени склоняет к значению хвалы, но подлинная неоднозначность отмечена в сноске.
- issue: Передача обращения אֲדֹנָי אֱלֹהַי
  choice: Господи, Боже мой
  alternative: Владыка, Бог мой
  rationale: «Господь» — традиционное и современно понятное соответствие титулу אֲדֹנָי; форма обращения сохраняет личное отношение, выраженное суффиксом в אֱלֹהַי, без добавочного толкования.
- issue: Смысл כבד применительно к Божьему имени
  choice: прославлять имя Твоё
  alternative: чтить имя Твоё
  rationale: Оба варианта допустимы, однако «прославлять» лучше сохраняет параллелизм богослужебной хвалы и не вводит конфессиональной конкретизации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмопевческим звучанием. Заглавные местоимения при обращении к Богу сохранены как уместная русская издательская норма; синтаксис остаётся ясным для современного читателя.
