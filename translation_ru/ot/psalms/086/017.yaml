base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/017.yaml
  text: Show me a sign for good[a], so that those who hate me may see and be put to shame, because you, O Yahweh, have helped me and comforted me.
translation:
  language: ru
  text: Яви мне знак во благо[a], чтобы те, кто ненавидит меня, увидели и устыдились, потому что Ты, Яхве, помог мне и утешил меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дай мне знак благоволения»; буквально: «соверши со мной знак во благо».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה עִמִּי אוֹת
  choice: Яви на мне знак
  rationale: Буквально сочетание означает «сделай со мной знак». «Яви на мне знак» естественно по-русски передаёт просьбу о видимом Божьем действии в судьбе псалмопевца и сохраняет оттенок עִמִּי — «со мной / на мне».
- source_word: לְטוֹבָה
  choice: во благо
  rationale: Передаёт направленность знака к добру, благу или благоволению, не уточняя сверх текста, идёт ли речь прежде всего о пользе псалмопевцу или о знаке Божьей милости.
- source_word: וְיִרְאוּ
  choice: чтобы увидели
  rationale: Имперфект после повелительной просьбы выражает желаемый результат или цель.
- source_word: שֹׂנְאַי
  choice: ненавидящие меня
  rationale: Сохраняет буквальный личный смысл причастия — не просто противники, а люди, питающие к говорящему ненависть.
- source_word: וְיֵבֹשׁוּ
  choice: устыдились
  rationale: Глагол может обозначать стыд, посрамление или крушение надежд. «Устыдились» кратко и естественно передаёт желаемый результат, не исключая публичного посрамления.
- source_word: כִּי
  choice: потому что
  rationale: 'Ясно передаёт причинную связь: помощь и утешение Яхве служат основанием того, что ненавидящие увидят знак и будут посрамлены.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: עֲזַרְתַּנִי
  choice: помог мне
  rationale: Перфект обозначает совершившееся действие Бога; русское прошедшее время естественно передаёт его как основание нынешней молитвы.
- source_word: וְנִחַמְתָּנִי
  choice: утешил меня
  rationale: В данной породе נחם означает утешить или ободрить; «утешил» является ясным и общеупотребительным соответствием.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя יְהוָה. Транслитерация сохраняет личное Божье имя, тогда как «Господь» заменяет его титулом.
- issue: Характер просимого знака
  choice: знак во благо
  alternative: знак благоволения
  rationale: Фраза לְטוֹבָה допускает смысл добра, пользы или благоволения. Основной текст сохраняет более широкую формулировку и не сводит знак исключительно к одному богословскому оттенку.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Инверсия «ненавидящие меня» сохраняет близость к еврейской формулировке, оставаясь понятной; местоимение «Ты» написано с прописной буквы в традиционном русском религиозном регистре.
