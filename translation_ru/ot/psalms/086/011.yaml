  text: ה֘וֹרֵ֤/נִי יְהוָ֨ה דַּרְכֶּ֗/ךָ אֲהַלֵּ֥ךְ בַּ/אֲמִתֶּ֑/ךָ יַחֵ֥ד לְ֝בָבִ֗/י לְ/יִרְאָ֥ה שְׁמֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/011.yaml
  text: Teach me your way[a], O Yahweh, that I may walk in your truth[b]; unite my heart to fear your name.
translation:
  language: ru
  text: Научи меня Твоему пути, Яхве, чтобы я ходил в Твоей истине[a]; сделай моё сердце единым[b], чтобы оно боялось Твоего имени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в Твоей верности». Еврейское слово может означать и «истину», и «верность».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дай мне неразделённое сердце». Еврейский глагол означает «объединить, сделать единым» и выражает просьбу о внутренней цельности, без разделённой верности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרֵנִי
  choice: Научи меня
  rationale: Побудительная форма породы hифиль от ירה с суффиксом первого лица означает «научи / наставь меня»; «научи меня» естественно передаёт просьбу о Божьем наставлении.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: דַּרְכֶּךָ
  choice: Твоему пути
  rationale: דֶּרֶךְ означает «путь» и здесь может обозначать предписанный Богом образ жизни; сохранены единственное число и образ пути.
- source_word: אֲהַלֵּךְ
  choice: чтобы мне ходить
  rationale: Имперфект после повелительной формы выражает цель или ожидаемый результат просьбы. Оборот сохраняет метафору хождения и связь с предшествующим «научи».
- source_word: בַּאֲמִתֶּךָ
  choice: в Твоей истине
  rationale: אֱמֶת охватывает значения истины, верности и надёжности. Основной вариант прямо передаёт «истину», а возможное значение «верность» отмечено в сноске.
- source_word: יַחֵד
  choice: сделай … единым
  rationale: 'Пиэль, императив от יחד: «объедини, сделай единым». По-русски эта конструкция яснее буквального «объедини моё сердце» и сохраняет образ внутренней цельности.'
- source_word: לְבָבִי
  choice: моё сердце
  rationale: לֵבָב обозначает внутреннего человека — волю, мысли и чувства; традиционный и понятный эквивалент «сердце» сохраняет библейский образ.
- source_word: לְיִרְאָה
  choice: чтобы бояться
  rationale: Инфинитив с ל выражает цель. Глагол «бояться» сохраняет полноту значения ירא, включающего благоговейный страх, и не ослабляет богословское напряжение.
- source_word: שְׁמֶךָ
  choice: Твоего имени
  rationale: Буквальное «имя» сохраняет богословски значимую библейскую формулировку, где имя представляет личность и славу Бога.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Значение ירא применительно к имени Бога
  choice: бояться Твоего имени
  alternative: благоговеть перед Твоим именем
  rationale: «Бояться» сохраняет смысловую широту и богословский вес ירא — страх, трепет и благоговение — вместо сведения слова лишь к почтению.
- issue: Образ единого сердца
  choice: сделай моё сердце единым
  alternative: дай мне неразделённое сердце
  rationale: Выбранный вариант следует глаголу יחד («сделать единым») и сохраняет просьбу об избавлении от разделённой верности, не уточняя сверх текста, между какими именно привязанностями разделено сердце.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавные буквы в местоимениях, относящихся к Богу, поддерживают привычный русский религиозный регистр. Синтаксис близок к еврейскому параллелизму, но остаётся естественным для современного читателя.
