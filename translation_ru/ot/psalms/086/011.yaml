  source_fidelity: 'Основные соответствия еврейскому тексту точны: הוֹרֵנִי — «Научи меня», יהוה — «Яхве», דַּרְכֶּךָ — «Твоему пути», а אֱמֶת обоснованно передано как «истина» с вариантом «верность». «Сделай моё сердце единым» близко передаёт повелительную форму יַחֵד, не навязывая конкретного объяснения разделённости сердца. В исходном тексте оборот «чтобы бояться» формально может относиться к говорящему, тогда как в еврейской конструкции целью является единение сердца для страха перед именем Бога; явное «оно» лучше сохраняет эту связь.'
