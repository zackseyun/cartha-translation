  text: A prayer of David. Incline your ear[a], O Yahweh, and answer me, for I am poor and needy.
translation:
  language: ru
  text: 'Молитва Давида.


    Приклони, Яхве, ухо Твоё и ответь мне, ибо я беден и в нужде[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я угнетён и в нужде». Еврейское עָנִי может означать бедного, страдающего, угнетённого или смиренного человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּפִלָּה
  choice: Молитва
  rationale: Самостоятельное существительное в надписании псалма естественно передаётся жанровым обозначением «Молитва».
- source_word: לְדָוִד
  choice: Давида
  rationale: Родительный падеж естественно передаёт традиционное «Давида», не устраняя присущую еврейскому לְ неоднозначность между авторством и принадлежностью или связью с Давидом.
- source_word: הַטֵּה
  choice: Приклони
  rationale: Сохраняет образное выражение с «ухом» и звучит естественно в возвышенной современной молитвенной речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אָזְנְךָ
  choice: ухо Твоё
  rationale: Сохраняет телесную метафору внимательного слушания; порядок слов соответствует естественной русской конструкции с глаголом «приклонить».
- source_word: עֲנֵנִי
  choice: ответь мне
  rationale: В контексте молитвы ענה означает просьбу дать ответ.
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание просьбы и ясно выражает причинную связь.
- source_word: עָנִי
  choice: беден
  rationale: Передаёт конкретное значение бедности, сохраняя в сноске возможное значение страдания или угнетённости.
- source_word: וְאֶבְיוֹן
  choice: и нуждаюсь
  rationale: Русское «я беден и нуждаюсь» естественно передаёт смысловую пару עָנִי וְאֶבְיוֹן без тяжеловесного субстантивированного «нуждающийся».
- source_word: אָנִי
  choice: я
  rationale: Явно выраженное местоимение сохраняется в русской именной конструкции «я беден и нуждаюсь».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя, не подменяя его титулом.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Метафора «приклони ухо» сохранена; прописная буква в местоимении «Твоё» поддерживает принятый русский благоговейный регистр.
