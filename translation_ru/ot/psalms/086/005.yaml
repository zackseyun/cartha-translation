    reason: Передаёт возможные более развёрнутые соответствия причинному כִּי, прилагательному סַלָּח и конструкции רַב־חֶסֶד, сохраняя нормативный современный русский язык.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Связывает стих с предыдущей мольбой и вводит её основание; «ведь» естественно передаёт причинно-пояснительную силу союза в русском псалмическом контексте.
- source_word: אַתָּה
  choice: Ты
  rationale: Явное местоимение сохранено ради заложенного в еврейском тексте смыслового ударения в прямом обращении к Богу.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Передаёт божественный титул אֲדֹנָי в прямом обращении; это не тетраграмматон יהוה.
- source_word: טוֹב
  choice: благ
  rationale: Сохраняет широкое значение Божьей благости и соответствует достоинству поэтической молитвы; современному читателю слово понятно.
- source_word: סַלָּח
  choice: готов прощать
  rationale: Редкое прилагательное характеризует Бога как расположенного прощать. Развёрнутая русская формулировка естественнее, чем «прощающ», и не ограничивает значение единичным действием.
- source_word: רַב חֶסֶד
  choice: богат неизменной любовью
  rationale: «Богат» передаёт количественно-интенсивное רַב, а «неизменная любовь» выражает устойчивую благожелательность и верность, заключённые в חֶסֶד.
- source_word: לְכָל קֹרְאֶיךָ
  choice: ко всем, кто призывает Тебя
  rationale: Передаёт адресатов Божьей любви и молитвенное обращение к Богу; «призывает» сохраняет библейскую смысловую насыщенность корня קרא.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: Владыка; мой Господь
  rationale: В тексте стоит титул אֲדֹנָי, а не имя יהוה. «Господь» точно и естественно передаёт обращение, не смешивая титул с особой передачей тетраграмматона.
- issue: Передача חֶסֶד
  choice: неизменная любовь
  alternative: верная любовь; милость
  rationale: Выбранная формулировка удерживает одновременно любовь, постоянство и верность. Одно слово «милость» могло бы чрезмерно сузить богословски ёмкое значение חֶסֶד.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Заглавные формы «Ты/Тебя» употреблены как принятая в русском религиозном регистре форма почтительного прямого обращения. Синтаксис остаётся ясным для обычного читателя без архаизации.
