  yaml_path: translation/ot/psalms/086/005.yaml
  text: For you[a], Lord, are good and forgiving, abounding in steadfast love to all who call on you.
translation:
  language: ru
  text: Ибо Ты, Господи, благ и готов прощать, щедр на неизменную любовь ко всем, кто призывает Тебя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
