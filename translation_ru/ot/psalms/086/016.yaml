  text: פְּנֵ֥ה אֵלַ֗/י וְ/חָ֫נֵּ֥/נִי תְּנָֽ/ה עֻזְּ/ךָ֥ לְ/עַבְדֶּ֑/ךָ וְ֝/הוֹשִׁ֗יעָ/ה לְ/בֶן אֲמָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/016.yaml
  text: Turn to me and be gracious to me[a]; give your strength to your servant[b], and save the son of your maidservant.
translation:
  language: ru
  text: Обратись ко мне и будь милостив ко мне; дай рабу Твоему Твою силу и спаси сына Твоей рабыни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּנֵה אֵלַי
  choice: Обратись ко мне
  rationale: Императив פנה с אֵלַי выражает просьбу к Богу направить внимание к молящемуся; «обратись ко мне» естественно передаёт это движение и личный характер обращения.
- source_word: וְחָנֵּנִי
  choice: и будь милостив ко мне
  rationale: Глагол חנן означает проявление благоволения и милости. Эта формулировка сохраняет оттенок незаслуженной милости, не сводя его только к состраданию.
- source_word: תְּנָה עֻזְּךָ
  choice: дай ... Твою силу
  rationale: Прямо передаёт императив נתן и существительное עֹז — силу или могущество; в контексте это просьба наделить молящегося Божьей силой.
- source_word: לְעַבְדֶּךָ
  choice: рабу Твоему
  rationale: עֶבֶד обозначает зависимого слугу или раба. В русской библейской молитвенной речи «раб Твой» естественно выражает смиренную принадлежность Богу и сильнее сохраняет исходный социальный образ, чем нейтральное «слуга».
- source_word: וְהוֹשִׁיעָה
  choice: и спаси
  rationale: Императив от ישׁע прямо выражает просьбу о спасении или избавлении; «спаси» сохраняет как конкретный, так и богословски широкий смысл.
- source_word: לְבֶן אֲמָתֶךָ
  choice: сына Твоей рабыни
  rationale: Фраза буквально означает «сына Твоей рабыни». Явное упоминание матери сохранено, поскольку подчёркивает давнюю, возможно унаследованную, принадлежность молящегося Божьему дому.
theological_decisions:
- issue: Передача самоназваний עֶבֶד и אָמָה
  choice: «раб Твой» и «Твоя рабыня»
  alternative: «слуга Твой» и «Твоя служанка»
  rationale: Исходный текст использует два родственных обозначения зависимого служения и принадлежности. «Раб» и «рабыня» сохраняют их силу, параллелизм и традиционно понятный в русской молитвенной речи смысл, не превращая выражение в указание на отдельную доктрину.
- issue: Смысл выражения «сын Твоей рабыни»
  choice: Сохранить материнское обозначение без поясняющего истолкования
  alternative: Передать обобщённо как «Твой раб от рождения»
  rationale: Еврейская фраза допускает оттенок принадлежности дому с рождения, однако прямо этого не утверждает. Буквенный образ сохранён, чтобы не устранять смысловую многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Синтаксис сделан ясным и плавным; традиционные «раб» и «рабыня» сохранены как точные и узнаваемые соответствия исходным образам. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с русской благочестивой издательской традицией.
