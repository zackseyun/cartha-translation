base_translation:
  language: en
  yaml_path: translation/ot/psalms/086/013.yaml
  text: For your steadfast love toward me is great[a], and you have delivered my soul from the lowest Sheol.
translation:
  language: ru
  text: Ибо велика Твоя верная любовь ко мне, и Ты избавил мою душу от глубин Шеола[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из самого нижнего мира мёртвых»; возможно также: «из глубокой могилы». Шеол — древнееврейское обозначение мира мёртвых.'
    reason: Лексическая альтернатива и пояснение древнееврейского термина שְׁאוֹל תַּחְתִּיָּה.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Вводит основание для предшествующей хвалы или молитвы и сохраняет поэтическую связность стиха.
- source_word: חַסְדְּךָ
  choice: Твоя верная любовь
  rationale: Передаёт устойчивую, преданную и благую любовь חֶסֶד, не сужая значение до одной лишь милости.
- source_word: גָּדוֹל עָלָי
  choice: велика… ко мне
  rationale: Естественно передаёт величие любви и её направленность на псалмопевца.
- source_word: וְהִצַּלְתָּ
  choice: и Ты избавил
  rationale: Порода hифиль глагола נצל обозначает спасение или избавление от опасности; прошедшее совершенного вида передаёт завершённое действие.
- source_word: נַפְשִׁי
  choice: мою душу
  rationale: Сохраняет поэтическую антропологическую образность נֶפֶשׁ, которая здесь может обозначать душу, жизнь или самого человека, без догматического уточнения.
- source_word: מִשְּׁאוֹל
  choice: от… Шеола
  rationale: Транслитерация сохраняет древнееврейское представление о мире мёртвых и не сводит его только к могиле или позднейшему понятию ада.
- source_word: תַּחְתִּיָּה
  choice: глубин
  rationale: Передаёт образ самого нижнего, глубокого Шеола естественным русским поэтическим выражением, сохраняя нисходящую пространственную образность.
theological_decisions:
- issue: Передача שְׁאוֹל без внесения более поздней догматической определённости
  choice: Шеол
  alternative: мир мёртвых; преисподняя; могила
  rationale: Шеол обозначает область мёртвых в древнееврейской картине мира. Транслитерация сохраняет исходную неоднозначность; пояснение дано в сноске.
- issue: Значение נַפְשִׁי в контексте избавления от Шеола
  choice: мою душу
  alternative: мою жизнь; меня
  rationale: Формальная поэтическая передача сохраняет широту נֶפֶשׁ и не превращает стих в точное утверждение о составе человека или посмертном состоянии.
