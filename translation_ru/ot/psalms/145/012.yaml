  text: to make known to the sons of man his mighty acts and the glorious splendor of his kingdom[a].
translation:
  language: ru
  text: чтобы сделать сынам человеческим[a] известными Его могучие деяния и славное великолепие Его царства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «людям»; «всему человечеству». Буквально: «сынам человека» — общее обозначение всех людей.'
    reason: Лексическая альтернатива и пояснение обобщающего смысла еврейского выражения.
lexical_decisions:
- source_word: לְהוֹדִיעַ
  choice: чтобы сделать известными
  rationale: Хифильный инфинитив от ידע выражает каузативное значение — «дать узнать, сделать известным». Такой перевод естественен по-русски и сохраняет целевую связь с контекстом.
- source_word: לִבְנֵי הָאָדָם
  choice: сынам человеческим
  rationale: Буквально выражение означает «сынам человека» и служит общим обозначением людей. Русская библейская идиома «сыны человеческие» сохраняет образ исходного текста; всеобщий смысл пояснён в сноске.
- source_word: גְּבוּרֹתָיו
  choice: Его могучие деяния
  rationale: Существительное גבורות обозначает проявления силы, то есть могучие дела или подвиги. «Могучие деяния» естественно звучит в возвышенной поэзии хвалы и передаёт конкретные проявления Божьей силы.
- source_word: וּכְבוֹד הֲדַר
  choice: и славное великолепие
  rationale: Сочетание כבוד и הדר объединяет значения славы, величия и великолепия. Передача прилагательным и существительным избегает тяжеловесного «слава великолепия», сохраняя оба смысловых компонента.
- source_word: מַלְכוּתוֹ
  choice: Его царства
  rationale: מלכות может означать царство, царскую власть или правление. Здесь «царство» естественно соответствует царской образности псалма, не исключая оттенка Божьего владычества.
theological_decisions:
- issue: Обобщающее обозначение человечества в לִבְנֵי הָאָדָם
  choice: 'Сохранить в основном тексте еврейский образ: «сынам человеческим»'
  alternative: «людям» или «всему человечеству»
  rationale: Выражение относится ко всем людям, а не только к мужчинам, однако его образная форма значима для поэтического языка. Всеобщий смысл указан в сноске без устранения исходной метафоры.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Синтаксис сохраняет форму целевого придаточного, поскольку стих продолжает мысль предыдущего контекста; местоимение «Его» написано с прописной буквы по принятой русской библейской традиции.
