  text: יוֹד֣וּ/ךָ יְ֭הוָה כָּל מַעֲשֶׂ֑י/ךָ וַ֝/חֲסִידֶ֗י/ךָ יְבָרֲכֽוּ/כָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/010.yaml
  text: All your works will give thanks to you[a], O Yahweh[b], and your faithful ones will bless you.
translation:
  language: ru
  text: 'Все Твои дела будут благодарить Тебя, Яхве[a],

    и верные Тебе[b] будут благословлять Тебя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. YHWH; традиционный перевод — «Господь».
    reason: alternative_reading
  - marker: b
    text: 'Или: «Твои святые», «Твои благочестивые» или «преданные Тебе». Еврейское слово обозначает людей, отличающихся верностью, преданностью и благочестием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּךָ
  choice: будут благодарить Тебя
  rationale: Hифиль глагола ידה означает «благодарить» или «восхвалять». В параллели с «будут благословлять» перевод «благодарить» сохраняет различие между двумя еврейскими глаголами; форма имперфекта передана будущим временем.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: כָּל מַעֲשֶׂיךָ
  choice: все Твои дела
  rationale: מַעֲשֶׂה может обозначать сделанное, творение или деяние. «Все Твои дела» близко к форме исходного текста и сохраняет широту значения, не ограничивая его только сотворёнными существами или только Божьими деяниями.
- source_word: וַחֲסִידֶיךָ
  choice: и верные Тебе
  rationale: חָסִיד обозначает людей, отличающихся преданностью, благочестием и верностью отношениям завета. «Верные Тебе» естественно звучит по-русски и не вносит более поздних церковных ассоциаций слова «святые».
- source_word: יְבָרֲכוּכָה
  choice: будут благословлять Тебя
  rationale: Пиэль глагола ברך здесь означает «благословлять»; местоименный суффикс второго лица сохранён. Имперфект передан будущим временем параллельно первой строке.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя YHWH. Транслитерация сохраняет различие между именем Бога и титулом «Господь».
- issue: Передача חֲסִידֶיךָ
  choice: верные Тебе
  alternative: Твои святые; Твои благочестивые; преданные Тебе
  rationale: Выбранный вариант передаёт верность и преданность, связанные с חָסִיד, не сводя смысл к нравственной набожности и не привнося позднейшее специальное значение слова «святые».
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим строем. Параллелизм двух строк и повтор «Тебя» сохранены; прописные местоимения употреблены в соответствии с русской библейской издательской традицией.
