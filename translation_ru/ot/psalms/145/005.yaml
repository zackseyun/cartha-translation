lexical_decisions:
- source_word: הֲדַר כְּבוֹד הוֹדֶךָ
  choice: великолепие славы Твоего величия
  rationale: Сохраняет накопление трёх близких понятий — великолепия, славы и царственного величия, — оставаясь понятным и торжественным по-русски.
- source_word: וְדִבְרֵי נִפְלְאוֹתֶיךָ
  choice: и о дивных делах Твоих
  rationale: דִּבְרֵי в сочетании с «чудесами» может обозначать относящиеся к ним дела или повествование о них. Передача «дивные дела» естественно выражает конкретные Божьи деяния; предлог «о» связывает эту фразу с тем же глаголом.
- source_word: אָשִׂיחָה
  choice: буду размышлять
  rationale: Глагол שׂיח охватывает как внутреннее размышление, так и произнесение вслух. В основном тексте выбран созерцательный оттенок, а речевой сохранён в примечании.
