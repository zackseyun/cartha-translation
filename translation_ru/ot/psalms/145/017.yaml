  text: Yahweh is righteous in all his ways and faithful in all his works[a].
translation:
  language: ru
  text: Праведен Яхве во всех Своих путях и верен во всех Своих делах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милостив» или «благ». В некоторых переводах: «свят» — согласно иной текстовой традиции; в масоретском тексте стоит слово со значением верности, неизменной благости или милости.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: צַדִּיק
  choice: праведен
  rationale: Точно выражает нравственную правоту и справедливость Бога; естественно звучит в русском языке хвалы.
- source_word: בְּכָל דְּרָכָיו
  choice: во всех Своих путях
  rationale: Сохраняет образ «путей» как образа образа действий Бога и передаёт ב как указание на сферу проявления.
- source_word: חָסִיד
  choice: верен
  rationale: В данном параллелизме передаёт обусловленную חסד надёжность и неизменную благость Бога, не сводя значение только к доброте или милости.
- source_word: בְּכָל מַעֲשָׂיו
  choice: во всех Своих делах
  rationale: «Дела» естественно передаёт действия Бога и сохраняет поэтический параллелизм с «путями».
theological_decisions:
- issue: Передача חָסִיד применительно к характеру Бога
  choice: верен
  alternative: милостив / благ / свят
  rationale: Масоретский текст читает חָסִיד, слово из смыслового поля חסד. «Верен» сохраняет оттенок надёжной, неизменной благости. Варианты «милостив» и «благ» лексически возможны; «свят» отражает иную текстовую традицию и поэтому отмечен в сноске, но не принят в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Инверсия «Праведен Яхве» сохраняет торжественный поэтический акцент; прописное «Своих» соответствует распространённой русской благоговейной орфографической практике.
