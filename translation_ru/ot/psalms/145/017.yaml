  source_fidelity: 'Текст точно передаёт еврейский оригинал: צַדִּיק — «Праведен», יְהוָה — «Яхве», а оба оборота בְּכָל корректно переданы как «во всех». «Пути» и «дела» сохраняют образность и параллелизм דְּרָכָיו / מַעֲשָׂיו. Передача חָסִיד словом «верен» допустима и хорошо выражает свойство Бога, связанное с חסד, не подменяя масоретское чтение вариантом «свят».'
