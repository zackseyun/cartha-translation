  text: כְּב֣וֹד מַלְכוּתְ/ךָ֣ יֹאמֵ֑רוּ וּ/גְבוּרָתְ/ךָ֥ יְדַבֵּֽרוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/011.yaml
  text: They will speak of the glory of your kingdom[b][a], and talk of your might.
translation:
  language: ru
  text: Будут говорить о славе Твоего царства[a] и рассказывать о Твоём могуществе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоей царской власти»; или: «Твоего царствования».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Твоей силе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבוֹד
  choice: слава
  rationale: Слово обозначает славу, честь, величие или весомость. В контексте хвалы «слава» естественно передаёт величие Божьего царства.
- source_word: מַלְכוּתְךָ
  choice: Твоего царства
  rationale: מַלְכוּת может означать царство, царскую власть или царствование. «Царство» сохраняет основной царский образ, не исключая значения Божьего правления.
- source_word: יֹאמֵרוּ
  choice: будут говорить
  rationale: Форма выражает незавершённое или будущее действие; в данном контексте естественно передаётся будущим временем. «Говорить» соответствует широкому значению אָמַר.
- source_word: גְבוּרָתְךָ
  choice: Твоём могуществе
  rationale: גְּבוּרָה обозначает мощь, силу или могущественные деяния. Абстрактное «могущество» точно соответствует форме единственного числа и образует естественную параллель со «славой».
- source_word: יְדַבֵּרוּ
  choice: рассказывать
  rationale: דָּבַר означает говорить. «Рассказывать» сохраняет смысл речи, естественно звучит в контексте возвещения хвалы и позволяет передать различие между двумя еврейскими глаголами без усилительного оттенка слова «провозглашать».
theological_decisions:
- issue: Значение מַלְכוּת применительно к Богу
  choice: царство
  alternative: царская власть; царствование
  rationale: Еврейское слово допускает понимание и как царской области, и как самого правления. «Царство» сохраняет традиционный и широкий образ, а сноска оставляет открытыми другие лексически возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с поэтической, но понятной формулировкой. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией. Параллелизм сохранён двумя близкими, но не тождественными глаголами речи.
