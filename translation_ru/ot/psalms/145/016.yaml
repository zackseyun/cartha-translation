  yaml_path: translation/ot/psalms/145/016.yaml
  text: You open your hand and satisfy the desire of every living thing[a].
translation:
  language: ru
  text: Ты открываешь Свою руку и удовлетворяешь желания всего живого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насыщаешь всё живое благоволением». Еврейское слово может означать «желание», «благоволение» или «благое соизволение»; в контексте Божьей заботы обо всём живом наиболее вероятно значение «желание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פּוֹתֵחַ
  choice: открываешь
  rationale: Причастие породы qal описывает постоянное, характерное действие Бога; настоящее время естественно передаёт этот поэтический смысл.
- source_word: יָדֶךָ
  choice: Свою руку
  rationale: Сохранён конкретный антропоморфный образ еврейского текста; возвратное местоимение естественно по-русски соотносит руку с подлежащим «Ты».
- source_word: וּמַשְׂבִּיעַ
  choice: и насыщаешь
  rationale: Каузативная форма hiphil от שׂבע означает «давать насытиться, удовлетворять»; «насыщаешь» уместно в контексте Божьего пропитания творения.
- source_word: לְכָל חַי
  choice: всё живое
  rationale: Субстантивированное חַי имеет собирательно-универсальный смысл и охватывает всякое живое существо.
- source_word: רָצוֹן
  choice: по его желанию
  rationale: רָצוֹן может означать желание, благоволение или удовольствие. Формулировка сохраняет наиболее вероятный здесь смысл удовлетворения потребности или стремления каждого живого существа, не превращая слово в прямое дополнение, чего еврейский синтаксис не требует.
theological_decisions:
- issue: Антропоморфное изображение Бога
  choice: Сохранить буквальный образ «открываешь Свою руку».
  alternative: «щедро даёшь»
  rationale: Образ руки составляет поэтическую выразительность исходного текста и говорит о Божьей заботе, не требуя догматического пояснения о телесности.
- issue: Неоднозначность רָצוֹן
  choice: 'Основной текст: «по его желанию».'
  alternative: «благоволением» или «по Своему благоволению»
  rationale: Контекст всеобщего Божьего обеспечения поддерживает значение «желание», однако лексическая многозначность сохраняется в примечании, без навязывания одного богословского прочтения.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной псалмовой интонацией. Заглавные буквы в «Ты» и «Свою» следуют принятой русской библейской традиции обращения к Богу. Синтаксис краток и сохраняет параллельность двух причастных действий.
