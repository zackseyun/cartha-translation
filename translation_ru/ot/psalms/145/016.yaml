  source_fidelity: 'Основной смысл передан верно: Бог открывает руку и даёт удовлетворение всему живому. Однако «насыщаешь всё живое по его желанию» делает רָצוֹן обстоятельством («согласно желанию»), тогда как в еврейской конструкции оно является тем, чем/что удовлетворяется у всего живого. Более прямое русское выражение лучше сохраняет синтаксико-смысловую связь.'
