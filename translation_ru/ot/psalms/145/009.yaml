  yaml_path: translation/ot/psalms/145/009.yaml
  text: Yahweh is good to all[a], and his mercies are over all his works.
translation:
  language: ru
  text: Яхве благ ко всем, и Его милости распространяются на все Его творения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טוֹב
  choice: благ
  rationale: Кратко и естественно передаёт нравственную доброту и благость в именной конструкции, не сужая смысл до одной лишь доброжелательности.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לַכֹּל
  choice: ко всем
  rationale: Предлог ל обозначает направленность или отношение; выражение сохраняет всеобщий охват Божьей благости.
- source_word: רַחֲמָיו
  choice: милости Его
  rationale: Форма множественного числа от רחם указывает на сострадание и его многочисленные проявления; «милости» сохраняет число и поэтическую выразительность.
- source_word: עַל
  choice: над
  rationale: Передаёт образ милости, простирающейся над всеми Божьими делами и охватывающей их.
- source_word: כָּל
  choice: всеми
  rationale: Сохраняет универсальный смысл и поэтический повтор слова «все» в обеих частях стиха.
- source_word: מַעֲשָׂיו
  choice: Его творениями
  rationale: В контексте всеобщей Божьей благости слово естественно относится ко всему сотворённому Им; «творениями» ясно передаёт этот смысл, хотя буквально возможно и более широкое «делами».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Объём значения מַעֲשָׂיו
  choice: Его творениями
  alternative: Его делами
  rationale: Параллелизм с благостью «ко всем» указывает прежде всего на совокупность созданного Богом. Вариант «делами» формально шире, но по-русски может быть понят как поступки, а не творения.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Форма «благ» сохраняет достоинство псалмовой речи, оставаясь понятной; тире подчёркивает параллелизм двух строк.
