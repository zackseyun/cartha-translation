  text: קָר֣וֹב יְ֭הוָה לְ/כָל קֹרְאָ֑י/ו לְ/כֹ֤ל אֲשֶׁ֖ר יִקְרָאֻ֣/הוּ בֶ/אֱמֶֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/018.yaml
  text: Yahweh is near to all who call on him[a], to all who call on him in truth.
translation:
  language: ru
  text: Близок Яхве ко всем, кто призывает Его, — ко всем, кто призывает Его в истине[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «искренне», «поистине» или «верно».'
    reason: Выражение בֶאֱמֶת допускает оттенки истинности, искренности и верности.
lexical_decisions:
- source_word: קָרוֹב
  choice: близок
  rationale: Предикативное прилагательное передаёт как близость, так и доступность Бога; начальная позиция сохраняет поэтическое ударение еврейской строки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: לְכָל
  choice: ко всем
  rationale: Предлог обозначает отношение близости к людям; русский оборот «близок ко всем» естественен и сохраняет повторяемую структуру стиха.
- source_word: קֹרְאָיו / אֲשֶׁר יִקְרָאֻהוּ
  choice: кто призывает Его
  rationale: В контексте молитвенного обращения קרא естественно передаётся глаголом «призывать»; одинаковый перевод в обеих частях сохраняет параллелизм.
- source_word: בֶאֱמֶת
  choice: в истине
  rationale: Буквальная и ёмкая передача, сохраняющая возможные оттенки истинности, искренности и верности без сведения выражения к одному из них.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Круг тех, к кому близок Бог
  choice: Сохранить «ко всем, кто призывает Его» с последующим уточнением «в истине»
  alternative: Ограничить высказывание определённой религиозной группой либо распространить его на всех людей без указанного условия
  rationale: Еврейский текст сам задаёт и универсальность слова «всем», и условие «кто призывает Его в истине»; перевод не снимает этого напряжения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «Близок Яхве» подчёркивает ключевое слово стиха; тире ясно обозначает поясняющий параллелизм.
