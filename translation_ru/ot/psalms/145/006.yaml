  text: וֶ/עֱז֣וּז נוֹרְאֹתֶ֣י/ךָ יֹאמֵ֑רוּ ו/גדולתי/ך אֲסַפְּרֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/006.yaml
  text: They will speak of the might of your awesome deeds[b][a], and I will recount your greatness.
translation:
  language: ru
  text: 'О могуществе Твоих деяний, внушающих трепет[a], будут говорить,

    а я возвещу о Твоём величии[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоих грозных деяний». Еврейское выражение относится к делам, вызывающим благоговейный страх, трепет и изумление.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о Твоих великих делах». Еврейское слово может обозначать как величие, так и великие дела Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶ/עֱז֣וּז
  choice: о могуществе
  rationale: Существительное עֱזוּז означает силу, мощь или могущество. Предложная конструкция естественно передаёт его сочетание с последующим обозначением Божьих деяний и сохраняет возвышенный поэтический строй.
- source_word: נוֹרְאֹתֶ֣י/ךָ
  choice: Твоих деяний, внушающих трепет
  rationale: Форма от корня ירא обозначает то, что вызывает страх, благоговейный трепет и изумление. Развёрнутая формулировка по-русски естественна и сохраняет как эмоциональную силу, так и связь с Божьими деяниями.
- source_word: יֹאמֵ֑רוּ
  choice: будут говорить
  rationale: Имперфект третьего лица множественного числа может выражать будущее или обычное, повторяющееся действие. Здесь будущее время согласуется с поэтическим контекстом псалма и сохраняет противопоставление множественного «будут» личному «я возвещу».
- source_word: ו/גדולתי/ך
  choice: о Твоём величии
  rationale: גדלה может обозначать величие, а в данном контексте, возможно, и великие дела. Абстрактное «величие» естественно сохраняет параллелизм, тогда как предметное понимание отмечено в сноске.
- source_word: אֲסַפְּרֶֽ/נָּה
  choice: я возвещу
  rationale: Глагол ספר в пиэле означает рассказывать, перечислять или возвещать. «Возвещу» передаёт намеренное публичное прославление и соответствует возвышенному регистру псалма.
