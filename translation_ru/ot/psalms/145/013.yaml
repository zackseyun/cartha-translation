  yaml_path: translation/ot/psalms/145/013.yaml
  text: Your kingdom is a kingdom of all ages[b][a], and your dominion is through every generation.
translation:
  language: ru
  text: 'Царство Твоё — царство всех веков[a],

    и владычество Твоё — во всяком поколении[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вечное царство». Буквально: «царство всех веков».'
