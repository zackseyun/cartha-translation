    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכוּתְךָ ... מַלְכוּת
  choice: Царство Твоё — царство
  rationale: Сохранён повтор еврейского существительного מַלְכוּת, который подчёркивает царскую власть Бога и допускает как значение царства, так и значение царствования.
- source_word: כָּל עֹלָמִים
  choice: всех веков
  rationale: Множественное עֹלָמִים обозначает всю необозримую последовательность времён. Формулировка сохраняет образ и повторную именную конструкцию оригинала, не сводя её сразу к прилагательному «вечное».
- source_word: וּמֶמְשֶׁלְתְּךָ
  choice: и владычество Твоё
  rationale: מֶמְשָׁלָה означает власть, господство или правление. «Владычество» соответствует возвышенному поэтическому регистру и не ограничивает смысл административным управлением.
- source_word: בְּכָל דּוֹר וָדֹר
  choice: во все поколения
  rationale: Еврейское выражение буквально говорит о каждом следующем поколении и передаёт непрерывность Божьего владычества. Русская формулировка естественна и сохраняет временной охват.
theological_decisions:
- issue: Продолжительность Божьего царствования
  choice: Передать царство как охватывающее все века, а владычество — все поколения
  alternative: «Царство Твоё — вечное царство, и владычество Твоё — из рода в род»
  rationale: Перевод утверждает непрерывность и безграничную длительность Божьего правления, сохраняя поэтическое напряжение и повтор исходного текста без добавления более поздних богословских формул.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмодическим звучанием. Именной параллелизм оригинала сохранён без добавления глагола «пребывает» или «простирается».
