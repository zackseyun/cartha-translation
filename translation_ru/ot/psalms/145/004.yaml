  text: דּ֣וֹר לְ֭/דוֹר יְשַׁבַּ֣ח מַעֲשֶׂ֑י/ךָ וּ/גְב֖וּרֹתֶ֣י/ךָ יַגִּֽידוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/004.yaml
  text: Generation to generation will praise your works[b][a], and will declare your mighty acts.
translation:
  language: ru
  text: Одно поколение будет восхвалять Твои дела другому[a]; о Твоих могучих деяниях будут возвещать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поколение поколению»; возможно также: «из поколения в поколение».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о проявлениях Твоей силы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹר לְדוֹר
  choice: Поколение поколению
  rationale: Передаёт повтор слова «поколение» и направительное ל, сохраняя лаконизм и поэтическую связь между поколениями.
- source_word: יְשַׁבַּח
  choice: будет восхвалять
  rationale: Порода piel выражает усиленную хвалу; будущее время естественно передаёт обобщённо-продолжающееся значение имперфекта в данном контексте.
- source_word: מַעֲשֶׂיךָ
  choice: Твои дела
  rationale: «Дела» — прямой, ёмкий и естественный эквивалент מַעֲשִׂים, относящийся здесь к совершённому Богом.
- source_word: וּגְבוּרֹתֶיךָ
  choice: о Твоих могучих деяниях
  rationale: Слово גְּבוּרוֹת обозначает проявления силы в совершённых деяниях; сочетание сохраняет и действие, и могущество.
- source_word: יַגִּידוּ
  choice: будут возвещать
  rationale: Hiphil от נגד означает сообщать, объявлять, делать известным; «возвещать» соответствует возвышенному, но понятному поэтическому регистру. Форма множественного числа сохранена без добавления явно названного подлежащего.
theological_decisions:
- issue: Переход от единственного числа יְשַׁבַּח к множественному יַגִּידוּ
  choice: 'Сохранить смену числа: «будет восхвалять… будут возвещать»'
  alternative: 'Согласовать оба сказуемых в единственном числе: «будет восхвалять… возвещать»'
  rationale: Еврейский текст сначала представляет «поколение» как единое собирательное подлежащее, а затем употребляет множественное число, вероятно подразумевая поколения или их представителей. Смена числа сохранена, чтобы не сглаживать особенность исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой лексикой. Заглавные буквы в местоимениях, относящихся к Богу, выдержаны как редакционная норма. Необычная смена числа сказуемых намеренно сохраняет грамматическое движение еврейского текста.
