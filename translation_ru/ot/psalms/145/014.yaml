  text: סוֹמֵ֣ךְ יְ֭הוָה לְ/כָל הַ/נֹּפְלִ֑ים וְ֝/זוֹקֵ֗ף לְ/כָל הַ/כְּפוּפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/014.yaml
  text: Yahweh supports all who are falling and raises up all who are bowed down[a].
translation:
  language: ru
  text: Яхве поддерживает всех падающих и поднимает всех согбенных.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поддерживает всех, кто падает». Еврейское причастие может обозначать как продолжающееся, так и более обобщённое действие.'
    reason: Лексико-грамматическая альтернатива для הַנֹּפְלִים.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: סוֹמֵךְ
  choice: поддерживает
  rationale: Причастная форма обозначает продолжающееся или характерное действие; «поддерживает» естественно передаёт помощь, не устраняя образ человека, который падает.
- source_word: לְכָל
  choice: всех
  rationale: В русском языке управление глаголов «поддерживает» и «поднимает» естественно выражается прямым дополнением.
- source_word: הַנֹּפְלִים
  choice: падающих
  rationale: Причастие сохраняет возможный смысл продолжающегося падения, а не только уже совершившегося падения.
- source_word: זוֹקֵף
  choice: поднимает
  rationale: Глагол означает выпрямлять или ставить прямо; «поднимает» естественно передаёт восстановление в параллели с «согбенными».
- source_word: הַכְּפוּפִים
  choice: согбенных
  rationale: Слово сохраняет образ людей, согнутых или склонившихся под тяжестью, и допускает как буквальный, так и переносный смысл без уточнения причины.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В еврейском тексте стоит тетраграмматон; передача «Яхве» сохраняет личное имя, не заменяя его титулом.
- issue: Состояние הַנֹּפְלִים
  choice: падающих
  alternative: упавших; тех, кто падает
  rationale: Еврейское причастие допускает продолжающееся или обобщённо-характерное действие. Основной текст сохраняет динамический образ, а примечание отмечает более общий вариант.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. «Согбенных» сохраняет образный параллелизм и остаётся понятным в контексте псалма.
