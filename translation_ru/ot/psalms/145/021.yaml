lexical_decisions:
- source_word: תְּהִלַּת יְהוָה
  choice: хвалу Яхве
  rationale: Сохранена конструкция со значением хвалы, обращённой к Яхве; личное имя יהוה передано транслитерацией «Яхве», а не заменено титулом.
- source_word: יְדַבֶּר פִּי
  choice: Мои уста будут возвещать
  rationale: Конкретный образ органа речи сохранён через естественное для русского возвышенного стиля слово «уста»; имперфект передан как намерение и продолжающееся действие.
- source_word: וִיבָרֵךְ
  choice: и пусть … благословляет
  rationale: Форма допускает волитивное, юссивное прочтение; при смене субъекта оно естественно выражает заключительный призыв, не сводя текст только к предсказанию.
- source_word: כָּל בָּשָׂר
  choice: всякая плоть
  rationale: Сохранён поэтический древнееврейский образ и его широкий охват всех смертных существ; возможные смысловые эквиваленты пояснены в сноске.
- source_word: שֵׁם קָדְשׁוֹ
  choice: Его святое имя
  rationale: Естественно передаёт Божью явленную идентичность и её святость.
- source_word: לְעוֹלָם וָעֶד
  choice: во веки веков
  rationale: Устойчивое русское выражение сохраняет усиленное значение бесконечной длительности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте стоит личное имя Бога; «Яхве» передаёт его как имя, не заменяя титулом.
- issue: Модальность וִיבָרֵךְ
  choice: пусть … благословляет
  alternative: будет благословлять
  rationale: Древнееврейский имперфект здесь может иметь юссивную силу. Перевод сохраняет возможный переход от личного обещания псалмопевца к призыву, обращённому ко всякой плоти.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. «Уста» и «во веки веков» сохраняют достоинство и поэтичность, оставаясь понятными; синтаксис сделан ясным и естественным.
