base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/003.yaml
  text: Great is Yahweh[a], and greatly to be praised, and his greatness is unsearchable.
translation:
  language: ru
  text: Велик Яхве и весьма достоин хвалы, и величие Его неисследимо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «величие Его невозможно исследовать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּדוֹל
  choice: Велик
  rationale: Предикативное прилагательное, вынесенное в начало стиха. «Велик» прямо передаёт как величие, так и возвышенность, не добавляя значения могущества, которого слово само по себе здесь не требует.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога сохраняет форму исходного текста и не заменяет имя титулом «Господь».
- source_word: מְהֻלָּל מְאֹד
  choice: весьма достоин хвалы
  rationale: Пассивное причастие от הלל вместе с усилительным מְאֹד естественно передаётся по-русски как высокая степень достойности хвалы. Буквальное «весьма прославляем» могло бы ошибочно звучать как сообщение о фактическом действии людей, а не как утверждение о подобающей Ему хвале.
- source_word: לִגְדֻלָּתוֹ
  choice: величие Его
  rationale: Существительное גדלה с местоименным суффиксом означает Его величие. Русская конструкция без буквального воспроизведения предлога ל естественно передаёт смысл еврейской именной фразы.
- source_word: אֵין חֵקֶר
  choice: неисследимо
  rationale: Выражение буквально говорит, что величию Бога нет исследования, то есть его невозможно до конца исследовать или постичь. «Неисследимо» кратко и естественно сохраняет эту смысловую открытость.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, поэтому сохранено личное имя «Яхве». Вариант «Господь» заменяет имя титулом, а «Иегова» отражает позднюю смешанную форму произношения.
- issue: Смысл מְהֻלָּל в утверждении о Боге
  choice: достоин хвалы
  alternative: прославляем
  rationale: Контекст допускает формально пассивное прочтение, однако предикативная конструкция выражает прежде всего то, что Яхве подобает восхвалять. Выбранная формулировка не привязывает стих к какой-либо конфессиональной трактовке.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмодическим звучанием. Начальная инверсия «Велик Яхве» сохраняет акцент еврейского текста; повтор союза «и» отражает строение исходной строки. Местоимение «Его» написано с прописной буквы как допустимая русская традиция благоговейного стиля.
