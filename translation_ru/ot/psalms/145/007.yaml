base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/007.yaml
  text: They will pour forth the memory of your abundant goodness[b][a], and they will sing for joy of your righteousness.
translation:
  language: ru
  text: Они будут рассказывать о Твоей великой благости[a] и радостно петь о Твоей праведности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к образу еврейского текста: «Будут изливать слова, вспоминая Твою обильную благость».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о Твоей справедливости».'
    reason: alternative_reading
lexical_decisions:
- source_word: זֵכֶר
  choice: память
  rationale: Существительное означает память или памятное упоминание; в сочетании с глаголом речи здесь речь идёт о провозглашении сохраняемой памяти о Божьей благости.
- source_word: רַב טוּבְךָ
  choice: Твоя великая благость
  rationale: רַב указывает на величие или изобилие, а טוּב — на благость, проявляемую в благодеяниях. «Великая благость» естественно и широко передаёт сочетание, не сужая его до материальной щедрости.
- source_word: יַבִּיעוּ
  choice: будут возвещать
  rationale: Глагол буквально рисует речь, которая бьёт ключом или изливается. «Возвещать» звучит естественно и достойно в русском поэтическом контексте; образ изливающейся речи отмечен в сноске.
- source_word: וְצִדְקָתְךָ
  choice: о Твоей праведности
  rationale: צדקה охватывает праведность и справедливость. «Праведность» сохраняет более широкий смысл Божьего нравственно верного характера и действий.
- source_word: יְרַנֵּנוּ
  choice: радостно петь
  rationale: Форма глагола выражает звонкий радостный возглас или пение; в параллелизме речи хвалы естественно «радостно петь».
theological_decisions:
- issue: Передача צדקה в контексте хвалы
  choice: праведность
  alternative: справедливость
  rationale: Еврейское слово может обозначать как праведность, так и справедливость. Основной текст сохраняет более широкое нравственное значение, а судебно-этический оттенок указан как допустимая альтернатива.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Параллелизм двух частей стиха сохранён; буквальный образ речи, бьющей ключом, вынесен в сноску ради естественности основного текста.
