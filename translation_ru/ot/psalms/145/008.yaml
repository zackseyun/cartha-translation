  text: Yahweh is gracious and compassionate[a], slow to anger and great in steadfast love.
translation:
  language: ru
  text: Яхве милостив и сострадателен, не скор на гнев и велик в неизменной любви.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «богат неизменной любовью». Еврейское выражение может подчёркивать как величие, так и изобилие неизменной любви.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַנּוּן
  choice: милостив
  rationale: Передаёт готовность оказывать милость и благоволение; это естественное и достойное русское соответствие, отличимое от следующего определения.
- source_word: רַחוּם
  choice: сострадателен
  rationale: Сохраняет значение глубокого сострадания и не сливает его с חַנּוּן, переведённым как «милостив».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя транслитерацией, а не заменяет его титулом «Господь».
- source_word: אֶרֶךְ אַפַּיִם
  choice: медлен на гнев
  rationale: Естественно передаёт еврейскую идиому, буквально связанную с «долгими ноздрями» и обозначающую терпение перед лицом раздражения.
- source_word: גְדָל
  choice: велик
  rationale: Прямо передаёт идею величия или меры; возможный оттенок изобилия отмечен в сноске.
- source_word: חָסֶד
  choice: неизменная любовь
  rationale: Передаёт устойчивую, верную и деятельную любовь; формулировка сохраняет богатство термина, не сводя его только к милости или формальной верности завету.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Смысл חָסֶד
  choice: неизменная любовь
  alternative: милость; верность завету; преданная любовь
  rationale: Выбранная формулировка сохраняет одновременно любовь и её постоянство, не ограничивая многозначный термин одной богословской категорией.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Сохранён параллелизм четырёх характеристик; выражение «медлен на гнев» намеренно оставлено как ясная и близкая к форме оригинала библейская идиома.
