base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/001.yaml
  text: A praise of David[a]. I will exalt you, my God the King[d][c][b], and I will bless your name forever and ever.
translation:
  language: ru
  text: Хвала Давида[a]. Буду превозносить Тебя, Боже мой, Царь мой[b], и буду благословлять имя Твоё во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Хвала, связанная с Давидом». Оборот לְדָוִד в заголовках псалмов может указывать на авторство или на иную связь с Давидом.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «мой Бог, Царь». Возможно также: «мой Бог и Царь», однако союза «и» в еврейском тексте нет. В русском обращении повтор «мой» при слове «Царь» делает конструкцию естественной.'
    reason: alternative_reading
lexical_decisions:
- source_word: תְּהִלָּה
  choice: Хвала
  rationale: Сохраняет именную форму заголовка и естественно звучит как обозначение хвалебного псалма.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русский родительный падеж в заголовке не вынуждает однозначно понимать Давида только как автора и допускает более широкую связь с ним.
- source_word: אֲרוֹמִמְךָ
  choice: Буду превозносить Тебя
  rationale: Передаёт значение возвышения и прославления; глагол уместен в современном возвышенном русском регистре.
- source_word: אֱלוֹהַי הַמֶּלֶךְ
  choice: Боже мой, Царь
  rationale: 'Звательная конструкция естественна по-русски и сохраняет приложение: Бог назван Царём, без добавления отсутствующего в еврейском союза «и».'
- source_word: וַאֲבָרֲכָה
  choice: и благословлять
  rationale: Сохраняет основной смысл ברך и согласует вторую глагольную форму с русской конструкцией «буду… и…».
- source_word: שִׁמְךָ
  choice: имя Твоё
  rationale: Сохраняет важный библейский образ имени как выражения открытой личности и славы Бога.
- source_word: לְעוֹלָם וָעֶד
  choice: во веки веков
  rationale: Традиционное, понятное и точное русское соответствие усиленному выражению бесконечной длительности.
theological_decisions:
- issue: Соотношение слов «мой Бог» и «Царь» в обращении
  choice: «Боже мой, Царь» — приложение, называющее Бога Царём
  alternative: «мой Бог и Царь»
  rationale: Еврейский текст не содержит союза «и» и буквально ставит «Царь» в приложение к «мой Бог». Русское звательное оформление передаёт это отношение без догматического расширения.
translation_notes:
  register: Современный литературный русский с достоинством богослужебной поэзии. Формы обращения к Богу написаны с прописной буквы. Выражение «во веки веков» сохранено как широко понятная библейская формула.
