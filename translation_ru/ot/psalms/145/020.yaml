  text: שׁוֹמֵ֣ר יְ֭הוָה אֶת כָּל אֹהֲבָ֑י/ו וְ/אֵ֖ת כָּל הָ/רְשָׁעִ֣ים יַשְׁמִֽיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/020.yaml
  text: Yahweh preserves all who love him[a], but all the wicked he will destroy.
translation:
  language: ru
  text: Яхве хранит всех, кто любит Его, а[a] всех нечестивых истребит.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и». Здесь союз выражает противопоставление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹמֵר
  choice: хранит
  rationale: Причастие от שׁמר выражает продолжающееся хранение и защиту. «Хранит» естественно для русской библейской поэзии и не сводит смысл лишь к наблюдению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֶת כָּל אֹהֲבָיו
  choice: всех, кто любит Его
  rationale: Субстантивированное причастие означает всех любящих Бога; относительная конструкция звучит ясно и естественно по-русски.
- source_word: וְאֵת כָּל הָרְשָׁעִים
  choice: а всех нечестивых
  rationale: Союз ו формально означает «и», но здесь связывает резко противопоставленные действия; русское «а» сохраняет поэтическую антитезу без чрезмерного усиления.
- source_word: יַשְׁמִיד
  choice: истребит
  rationale: Форма породы хифиль от שׁמד означает причинить уничтожение. «Истребит» передаёт силу глагола и соответствует возвышенному поэтическому регистру.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение союза ו перед второй частью стиха
  choice: противительное сопоставление («а»)
  alternative: простое соединение («и»)
  rationale: Сам союз допускает перевод «и», однако параллелизм противопоставляет хранение любящих Бога и истребление нечестивых. «А» естественно выражает эту связь, сохраняя возможность буквально передать союз в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Синтаксис прост и понятен; «хранит» и «истребит» сохраняют смысловую и поэтическую антитезу исходного текста.
