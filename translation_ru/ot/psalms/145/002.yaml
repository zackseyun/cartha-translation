  text: Every day I will bless you[b][a], and I will praise your name forever and ever.
translation:
  language: ru
  text: Каждый день[a] я буду благословлять Тебя и восхвалять имя Твоё[b] во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изо дня в день».'
    reason: lexical_alternative
  - marker: b
    text: В библейской речи Божье «имя» указывает на то, как Бог открывает Себя, а также на Его характер и славу.
    reason: cultural_note
lexical_decisions:
- source_word: בְּכָל־יוֹם
  choice: Каждый день
  rationale: Сочетание буквально означает «в каждый день» и выражает регулярно повторяющееся, ежедневное действие. «Каждый день» естественно звучит по-русски и сохраняет смысл еврейского выражения.
- source_word: אֲבָרֲכֶךָּ
  choice: я буду благословлять Тебя
  rationale: Глагол ברך в породе пиэль обычно означает «благословлять». Форма здесь передаёт намерение или устремлённость говорящего и согласуется с параллельным «буду восхвалять».
- source_word: וַאֲהַלְלָה
  choice: и восхвалять
  rationale: 'Глагол הלל в породе пиэль означает «хвалить, восхвалять». Инфинитив после общего «буду» создаёт естественную русскую параллель: «буду благословлять… и восхвалять».'
- source_word: שִׁמְךָ
  choice: имя Твоё
  rationale: Буквально — «Твоё имя». В библейской речи имя представляет открытый Богом характер и славу Его личности; конкретный образ сохранён, а не заменён толкованием.
- source_word: לְעוֹלָם וָעֶד
  choice: во веки веков
  rationale: Парное еврейское выражение усиливает идею бесконечной длительности. Устойчивое русское «во веки веков» точно передаёт эту торжественную эмфазу.
theological_decisions:
- issue: Прямое обращение к Богу без добавления титула
  choice: Тебя
  alternative: Тебя, Боже; Тебя, мой Бог и Царь
  rationale: В еврейском тексте этого стиха есть прямое обращение во втором лице, но Божий титул не повторяется. Поэтому перевод не переносит в стих слова из предыдущего стиха.
- issue: Передача выражения «Твоё имя»
  choice: имя Твоё
  alternative: Тебя; Твою славу
  rationale: Текст прямо говорит о восхвалении Божьего имени. Сохранение слова «имя» не устраняет его богатого библейского смысла и не сводит его к одному толкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным поэтическим звучанием. Традиционное «во веки веков» сохранено как понятное и точное соответствие усиленной еврейской формуле. Заглавные буквы в местоимениях прямого обращения к Богу поддерживают принятый в русском религиозном письме почтительный регистр.
