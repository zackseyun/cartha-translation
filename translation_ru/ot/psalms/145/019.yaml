  text: רְצוֹן יְרֵאָ֥י/ו יַעֲשֶׂ֑ה וְֽ/אֶת שַׁוְעָתָ֥/ם יִ֝שְׁמַ֗ע וְ/יוֹשִׁיעֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/019.yaml
  text: He fulfills the desire of those who fear him[b][a]; he hears their cry for help and saves them.
translation:
  language: ru
  text: Он исполняет желание боящихся его; слышит их вопль о помощи[a] и спасает их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их мольбу о помощи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избавляет их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְצוֹן
  choice: желание
  rationale: В данном контексте слово обозначает то, чего желают и к чему стремятся боящиеся Бога; «желание» естественно сочетается с глаголом «исполняет».
- source_word: יְרֵאָיו
  choice: боящихся его
  rationale: Передаёт выраженную в еврейском тексте лексику страха Божьего и её псалмический смысл, не ослабляя её до одного лишь почтения.
- source_word: יַעֲשֶׂה
  choice: исполняет
  rationale: Буквально глагол означает «делает», но при дополнении «желание» по-русски естественно и точно сказать «исполняет желание».
- source_word: שַׁוְעָתָם
  choice: их вопль о помощи
  rationale: Слово обозначает крик бедствующего, обращённый с просьбой о спасении; «вопль о помощи» ясно передаёт и бедствие, и обращение за помощью.
- source_word: יִשְׁמַע
  choice: слышит
  rationale: Сохраняет основное значение глагола; подразумеваемая готовность откликнуться раскрывается последующим «спасает».
- source_word: וְיוֹשִׁיעֵם
  choice: и спасает их
  rationale: Каузативная форма глагола ישׁע означает спасать или избавлять. «Спасает» сохраняет широту значения, не исключая избавления от конкретной беды.
theological_decisions:
- issue: Передача лексики страха Божьего
  choice: боящихся его
  alternative: почитающих его
  rationale: Еврейский текст прямо говорит о страхе; эта формулировка сохраняет характерный для Псалмов язык благочестия и не сводит его значение лишь к почтению.
- issue: Объём значения глагола ישׁע
  choice: спасает их
  alternative: избавляет их
  rationale: «Спасает» передаёт широкий смысл еврейского глагола, а контекст допускает непосредственное избавление от бедствия без ограничения смысла исключительно духовным спасением.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным псалмическим звучанием. Местоимение «его» набрано со строчной буквы по современной нейтральной издательской норме; референт остаётся однозначным из контекста.
