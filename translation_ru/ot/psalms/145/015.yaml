source:
  edition: WLC
  text: עֵֽינֵי כֹ֭ל אֵלֶ֣י/ךָ יְשַׂבֵּ֑רוּ וְ/אַתָּ֤ה נֽוֹתֵן לָ/הֶ֖ם אֶת אָכְלָ֣/ם בְּ/עִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/145/015.yaml
  text: The eyes of all look to you[b][a], and you give them their food in its time.
translation:
  language: ru
  text: Глаза всех с надеждой устремлены к Тебе[a], и Ты даёшь им пищу в должное время[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ожидают Тебя», «с ожиданием смотрят на Тебя» или «уповают на Тебя». Еврейский глагол выражает исполненное надежды ожидание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в своё время»; также возможно: «в надлежащий срок».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי כֹל
  choice: Глаза всех
  rationale: Сохраняет яркий образ еврейского текста и не сужает подразумеваемый круг словом «люди» или «создания».
- source_word: אֵלֶיךָ יְשַׂבֵּרוּ
  choice: с надеждой устремлены к Тебе
  rationale: Передаёт направленность к Богу и заложенное в глаголе напряжённое, исполненное надежды ожидание; по-русски естественно сочетается с подлежащим «глаза».
- source_word: וְאַתָּה
  choice: и Ты
  rationale: 'Простой союз сохраняет параллелизм: все ожидают от Бога, и Бог даёт.'
- source_word: נֹתֵן
  choice: даёшь
  rationale: Настоящее время естественно выражает постоянное, характерное действие, переданное еврейским причастием.
- source_word: אָכְלָם
  choice: им пищу
  rationale: Передаёт пищу вообще, без неоправданного сужения до хлеба; местоимение сохраняет значение суффикса «их».
- source_word: בְּעִתּוֹ
  choice: в должное время
  rationale: Естественно передаёт мысль о соответствующем, надлежащем времени, избегая возможной русской двусмысленности оборота «в своё время».
theological_decisions:
- issue: Круг обозначенных словом כֹל («все»).
  choice: Оставлено широкое «всех» без уточнения.
  alternative: «всех людей» или «всех живых существ»
  rationale: В самом стихе референт не назван прямо; контекст говорит о всеобъемлющей Божьей заботе, но перевод не должен искусственно сужать или расширять выражение.
- issue: Оттенок ожидания в יְשַׂבֵּרוּ.
  choice: «с надеждой устремлены»
  alternative: «ожидают Тебя», «уповают на Тебя» или просто «смотрят на Тебя»
  rationale: Выбранная формулировка удерживает одновременно зрительный образ и смысл исполненного надежды ожидания, не превращая стих в отвлечённое догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с поэтической торжественностью. Сохранён образ глаз, устремлённых к Богу; формы «Тебе» и «Ты» написаны с прописной буквы как уместное в русском библейском регистре обращение к Богу.
