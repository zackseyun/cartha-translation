lexical_decisions:
- source_word: אִמֲרוֹת / אֲמָרוֹת
  choice: слова
  rationale: Повтор существительного сохранён; «слова» естественно передаёт широкий смысл произнесённого, не сужая его до обещаний.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: טְהֹרוֹת
  choice: чистые
  rationale: Прилагательное обозначает чистоту; выбор согласуется и с оценкой слов Яхве, и с последующим образом очищенного серебра.
- source_word: כֶּסֶף
  choice: серебро
  rationale: Прямое обозначение металла, с которым поэтически сопоставляются слова Яхве.
- source_word: צָרוּף
  choice: переплавленное
  rationale: Форма описывает серебро, прошедшее огневую очистку; «переплавленное» естественно вводит металлургический образ.
- source_word: בַּעֲלִיל
  choice: в плавильной печи
  rationale: Редкое слово имеет не вполне ясное точное значение, но контекст уверенно указывает на приспособление для плавки или очистки металла; неопределённость отмечена в сноске.
- source_word: לָאָרֶץ
  choice: на земле
  rationale: Близко передаёт трудную предложную конструкцию, не навязывая ей более узкого пространственного или символического смысла.
- source_word: מְזֻקָּק
  choice: очищенное
  rationale: Продолжает металлургический образ и передаёт тщательную очистку, избегая ненужного повторения глагола «переплавить».
- source_word: שִׁבְעָתָיִם
  choice: семь раз
  rationale: Прозрачно передаёт наречное значение формы и сохраняет образ полноты и тщательности очистки.
theological_decisions:
- issue: Характер чистоты слов Яхве
  choice: Стих утверждает совершенную чистоту слов Яхве посредством образа многократно очищенного серебра.
  alternative: Ограничить смысл только нравственной чистотой либо расширить его до позднейших доктрин о сохранности текста.
  rationale: Еврейский текст говорит о чистоте слов Бога через металлургическое сравнение, но сам по себе не формулирует более поздних учений о способе сохранения Писания.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным поэтическим ритмом. Повтор «слова» воспроизводит еврейский параллелизм; «словно» ясно выражает подразумеваемое поэтическое сравнение. Оба маркера сносок поставлены непосредственно при спорных выражениях.
