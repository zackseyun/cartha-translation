source:
  edition: WLC
  text: הוֹשִׁ֣יעָ/ה יְ֭הוָה כִּי גָמַ֣ר חָסִ֑יד כִּי פַ֥סּוּ אֱ֝מוּנִ֗ים מִ/בְּנֵ֥י אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/001.yaml
  text: Save[a], O Yahweh, for the godly are gone[b]; for the faithful have vanished from among the sons of man.
translation:
  language: ru
  text: Спаси, Яхве, ибо не стало благочестивого[a], ибо исчезли верные среди людей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не стало преданного Тебе человека»; возможно также собирательное понимание: «не стало благочестивых».'
    reason: Лексическое и грамматическое значение חָסִיד в единственном числе допускает как указание на отдельного человека, так и собирательный смысл.
  - marker: b
    text: 'Буквально: «из сынов человеческих», то есть из человеческого общества.'
    reason: Пояснение еврейской антропологической идиомы מִבְּנֵי אָדָם.
lexical_decisions:
- source_word: הוֹשִׁיעָה
  choice: Спаси
  rationale: Повелительная форма глагола ישׁע выражает обращённую к Богу настоятельную просьбу о спасении; «Спаси» прямо и естественно звучит в русской молитвенной речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, выраженное тетраграмматоном, а не заменяется титулом «Господь».
- source_word: כִּי
  choice: ибо
  rationale: Союз дважды вводит основание просьбы; «ибо» сохраняет причинную связь и уместный для псалма возвышенный, но понятный регистр.
- source_word: גָמַר
  choice: не стало
  rationale: Глагол означает достижение конца, прекращение существования или исчезновение. Оборот «не стало» естественно передаёт жалобу на отсутствие такого человека, не уточняя, умер ли он или лишь исчез из общества.
- source_word: חָסִיד
  choice: благочестивого
  rationale: Слово обозначает человека, отличающегося преданностью, благочестием и верностью отношениям завета. Субстантивированное единственное число сохраняет грамматическую форму и допускает собирательное понимание.
- source_word: פַסּוּ
  choice: исчезли
  rationale: Форма множественного числа обозначает прекращение или исчезновение; «исчезли» сохраняет образную силу параллельной строки.
- source_word: אֱמוּנִים
  choice: верные
  rationale: Прилагательное во множественном числе характеризует надёжных, верных людей. «Верные» кратко передаёт как нравственную стойкость, так и надёжность.
- source_word: מִבְּנֵי אָדָם
  choice: среди людей
  rationale: Буквально «из сынов человеческих»; современный русский оборот «среди людей» ясно передаёт значение еврейской идиомы без неестественной буквальности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Форма «Яхве» прямо передаёт тетраграмматон и не подменяет имя титулом.
- issue: Число и собирательное значение חָסִיד
  choice: не стало благочестивого
  alternative: не стало благочестивых; не стало верного человека
  rationale: Сохранено единственное мужское число оригинала, однако формулировка не исключает собирательного смысла в поэтическом контексте. Возможная неоднозначность отмечена в сноске.
- issue: Соотношение חָסִיד и אֱמוּנִים
  choice: благочестивого / верные
  alternative: преданного / надёжные
  rationale: 'Разные русские слова сохраняют смысловой параллелизм, не сводя оба еврейских понятия к одному: первое подчёркивает благочестие и преданность, второе — верность и надёжность.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. «Ибо» поддерживает поэтический параллелизм, а «среди людей» избегает архаичной буквальности. Пунктуация сохраняет единство двучленной жалобы.
