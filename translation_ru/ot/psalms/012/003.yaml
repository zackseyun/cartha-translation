    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְרֵת
  choice: да истребит
  rationale: Форма хифиль имперфекта от כרת здесь естественно выражает молитвенное пожелание или проклятие. «Да истребит» передаёт эту силу и в русском псалмовом контексте звучит естественнее буквального «да отсечёт».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом.
- source_word: כָּל שִׂפְתֵי חֲלָקוֹת
  choice: все льстивые уста
  rationale: Буквальный образ — «уста гладкости»; прилагательное «льстивые» ясно передаёт идиоматический смысл гладкой, заискивающей и обманчивой речи.
- source_word: לָשׁוֹן
  choice: язык
  rationale: Сохранён единственный собирательный образ еврейского текста, следующий за множественным «уста».
- source_word: מְדַבֶּרֶת גְּדֹלוֹת
  choice: говорящий высокомерно
  rationale: Буквально выражение означает «говорящий великое/великие вещи», но в контексте обозначает надменные притязания. Наречная передача естественна по-русски, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это, не подменяя имя титулом.
- issue: Сила глагола יַכְרֵת
  choice: 'молитвенное пожелание: «да истребит»'
  alternative: 'будущее утверждение: «истребит»'
  rationale: Имперфект допускает формальную неоднозначность, однако в данном контексте наиболее естественно выражает призыв или пожелание. Частица «да» показывает эту модальность, не превращая строку в простое предсказание.
- issue: Смысл גְּדֹלוֹת
  choice: высокомерная речь
  alternative: буквально «великие вещи»
  rationale: Контекст речи нечестивых указывает на хвастовство и надменность. Чтобы не скрыть буквальный образ, он сохранён в сноске как допустимая более формальная передача.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой формой «да истребит». Синтаксический параллелизм и телесные образы «уста — язык» сохранены; архаизмы, кроме уместной побудительной конструкции с «да», не используются.
