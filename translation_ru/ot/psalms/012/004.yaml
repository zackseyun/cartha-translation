lexical_decisions:
- source_word: אֲשֶׁר אָמְרוּ
  choice: которые говорят
  rationale: Относительная конструкция продолжает характеристику нечестивых из предыдущего стиха; перфект здесь естественно передаёт их постоянную установку и по-русски звучит в настоящем времени.
- source_word: לִלְשֹׁנֵנוּ
  choice: языком своим
  rationale: 'Предлог ל понимается инструментально: язык выступает средством, которым говорящие намерены взять верх.'
- source_word: נַגְבִּיר
  choice: мы одолеем
  rationale: Хифиль от גבר выражает проявление превосходящей силы или достижение перевеса; «одолеем» сохраняет активную и хвастливую направленность высказывания.
- source_word: שְׂפָתֵינוּ
  choice: наши уста
  rationale: Сохранён конкретный поэтический образ органов речи; «уста» соответствует возвышенному регистру псалма, оставаясь понятным.
- source_word: אִתָּנוּ
  choice: при нас
  rationale: Передаёт буквально-пространственное «с нами», одновременно допуская оттенки обладания, доступности и нахождения на своей стороне, не устраняя неоднозначность еврейского выражения.
- source_word: מִי אָדוֹן לָנוּ
  choice: кто нам господин?
  rationale: Краткая русская конструкция сохраняет значение власти и подчинения. Строчная буква показывает, что אָדוֹן здесь является общим обозначением властителя, а не собственным Божьим именем.
theological_decisions:
- issue: Значение אָדוֹן в хвастливом отрицании власти
  choice: господин
  alternative: владыка; хозяин
  rationale: Контекст говорит об отрицании всякой власти над говорящими, не называя прямо Бога. «Господин» передаёт отношение господства без искусственного отождествления слова с божественным титулом.
- issue: Неоднозначность אִתָּנוּ
  choice: наши уста при нас
  alternative: наши уста принадлежат нам; наши уста на нашей стороне
  rationale: Основной текст сохраняет необычную краткость и смысловую напряжённость оригинала, а примечание обозначает вероятные оттенки автономии и преимущества, не выбирая один из них как бесспорный.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой лексикой. Параллелизм «языком — уста» сохранён; синтаксис сделан кратким и вызывающим, как в еврейской речи.
