lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов слово обозначает человека, руководящего музыкальным исполнением; дательный падеж естественно передаёт адресование.
- source_word: עַל
  choice: на
  rationale: В музыкальном заголовке предлог может вводить мелодию, строй, инструмент или способ исполнения. Краткое «на» сохраняет неопределённость и соответствует русской формуле исполнения на определённый напев.
- source_word: הַשְּׁמִינִית
  choice: «Восьмой»
  rationale: Буквально — «восьмая»; вероятно, это музыкальное или богослужебное обозначение. Кавычки показывают, что слово употреблено как название, не уточняя неизвестный референт.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устойчивое и точное русское обозначение данного поэтического и музыкального жанра.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русская формула «Псалом Давида» сохраняет традиционную краткость и допускает связь с Давидом, не делая обязательным исключительно авторское понимание.
theological_decisions:
- issue: Характер связи с Давидом, выраженной לְדָוִד
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида; псалом, связанный с Давидом
  rationale: Еврейский предлог לְ может обозначать авторство, принадлежность, посвящение или иную связь. Основной текст оставляет эту связь открытой, а примечание называет основные возможности.
translation_notes:
  register: Современный литературный русский язык с лаконичной формой древнего музыкального заголовка. «Руководителю хора» понятно широкому читателю; кавычки при «Восьмой» отмечают специальное название, значение которого остаётся неясным.
