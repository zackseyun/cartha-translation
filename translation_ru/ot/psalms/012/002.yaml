lexical_decisions:
- source_word: שָׁוְא
  choice: пустое
  rationale: Передаёт широкий диапазон значения — пустоту, тщетность и ложь — не сводя обвинение только к фактической лжи.
- source_word: יְדַבְּרוּ
  choice: говорят
  rationale: Прямой и естественный эквивалент; повтор глагола сохранён для передачи поэтического строя еврейской строки.
- source_word: אִישׁ אֶת רֵעֵהוּ
  choice: все говорят друг другу
  rationale: Еврейская дистрибутивная конструкция буквально означает «каждый — своему ближнему»; русское «все... друг другу» естественно и точно передаёт всеобщность взаимного общения.
- source_word: שְׂפַת חֲלָקוֹת
  choice: льстивыми устами
  rationale: Фраза буквально связана с «гладкостью» уст, а в контексте обозначает вкрадчивую, льстивую и обманчивую речь.
- source_word: בְּלֵב וָלֵב
  choice: с двоедушным сердцем
  rationale: Передаёт идиому «с сердцем и сердцем», обозначающую внутреннюю двойственность и неискренность, сохраняя образ сердца.
