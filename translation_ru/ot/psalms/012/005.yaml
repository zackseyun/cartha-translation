  terminology: «Яхве» последовательно и точно передаёт тетраграмматон. «Безопасность» уместно передаёт конкретный результат יֵשַׁע в данном контексте; «помещу ... в безопасность» лучше сохраняет образ исходного глагола, чем «дам».
  issues:
