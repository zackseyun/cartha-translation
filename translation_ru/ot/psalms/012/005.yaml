  text: מִ/שֹּׁ֥ד עֲנִיִּים֮ מֵ/אַנְקַ֪ת אֶבְי֫וֹנִ֥ים עַתָּ֣ה אָ֭קוּם יֹאמַ֣ר יְהוָ֑ה אָשִׁ֥ית בְּ֝/יֵ֗שַׁע יָפִ֥יחַֽ לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/005.yaml
  text: Because of the devastation of the poor[a], because of the groaning of the needy, now I will arise, says Yahweh; I will set him in the safety for which he longs.
translation:
  language: ru
  text: '«Из-за разорения, постигшего бедных,

    из-за стонов нуждающихся

    ныне Я восстану, — говорит Яхве, —

    Я помещу его в безопасность, которой он жаждет[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст заключительной фразы труден. Более буквально: «помещу в безопасность; он пыхтит/дышит на него». Возможен и смысл: «помещу его в безопасность от того, кто фыркает на него». Избранный перевод понимает глагол как «жаждет, страстно желает» и относит местоимение к нуждающемуся.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִשֹּׁד עֲנִיִּים
  choice: из-за разорения бедных
  rationale: Предлог מִן понят как указание на причину действия Яхве, а שֹׁד — как разорение, причинённое губительным насилием. עֲנִיִּים передано наиболее прямым соответствием «бедные».
- source_word: מֵאַנְקַת אֶבְיוֹנִים
  choice: из-за стонов нуждающихся
  rationale: Параллельный предлог снова выражает причину; אַנְקָה обозначает стон от страдания, а אֶבְיוֹנִים подчёркивает нужду и сохраняет отличие от «бедных» в первой строке.
- source_word: עַתָּה אָקוּם
  choice: ныне Я восстану
  rationale: «Ныне» передаёт непосредственность предстоящего вмешательства, а «восстану» сохраняет антропоморфный образ решительного действия Бога.
- source_word: יֹאמַר יְהוָה
  choice: говорит Яхве
  rationale: Настоящее время естественно для формулы, вводящей божественное изречение; тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: אָשִׁית בְּיֵשַׁע
  choice: Я дам ему безопасность
  rationale: Буквально сочетание выражает помещение или утверждение «в спасении/безопасности». По-русски «дам ему безопасность» естественно передаёт итог избавительного действия, не ограничивая יֵשַׁע отвлечённым богословским термином.
- source_word: יָפִיחַ לוֹ
  choice: которой он жаждет
  rationale: Выбрано контекстуально связное понимание глагола как тяжёлого дыхания, переходящего в значение страстного ожидания или жажды. Из-за спорности еврейской конструкции буквальные альтернативы вынесены в примечание.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон, то есть личное имя Бога. Транслитерация «Яхве» сохраняет это различие и не заменяет имя титулом.
- issue: Смысл заключительной фразы
  choice: Бог даёт угнетённому безопасность, которой тот жаждет
  alternative: 'Бог помещает его в безопасность от того, кто фыркает или дышит на него; буквально: «помещу в безопасность; он тяжело дышит к ней/к нему»'
  rationale: Еврейская фраза синтаксически и лексически трудна. Основной текст следует наиболее связному в данном контексте пониманию, а примечание сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Параллелизм первых двух строк сохранён; «ныне» и «восстану» поддерживают возвышенный регистр, оставаясь понятными современному читателю.
