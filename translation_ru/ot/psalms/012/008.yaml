  text: סָבִ֗יב רְשָׁעִ֥ים יִתְהַלָּכ֑וּ/ן כְּ/רֻ֥ם זֻ֝לּ֗וּת לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/012/008.yaml
  text: The wicked walk all around[b][a], when vileness is exalted among the sons of man.
translation:
  language: ru
  text: Нечестивые ходят повсюду,[a] когда низость возвышается среди сынов человеческих.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Нечестивые рыщут со всех сторон».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «среди людей» / «среди человечества». Древнееврейский текст буквально говорит: «среди сынов человека»; выражение относится к людям вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָבִיב
  choice: повсюду
  rationale: Наречие обозначает движение или присутствие со всех сторон. «Повсюду» естественно по-русски передаёт широкое распространение нечестивых, не добавляя образа охоты.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Субстантивированное прилагательное во множественном числе обозначает людей, поступающих порочно. «Нечестивые» сохраняет нравственно-религиозную окраску и не добавляет указания на пол.
- source_word: יִתְהַלָּכוּן
  choice: ходят
  rationale: Форма хитпаэль от הלך передаёт хождение, движение туда и сюда. «Ходят» сохраняет исходный образ; более выразительное «рыщут» вынесено в примечание как допустимый контекстуальный вариант.
- source_word: כְּרֻם
  choice: когда ... возвышается
  rationale: Трудная конструкция с כ описывает обстоятельство, при котором нечестивые свободно ходят повсюду. Временное «когда» ясно передаёт эту связь, не исключая близкого обстоятельственного значения «в то время как».
- source_word: זֻלּוּת
  choice: низость
  rationale: Существительное указывает на нечто низкое, презренное или лишённое ценности. «Низость» естественно выражает здесь нравственно предосудительный смысл и сочетается с глаголом «возвышается».
- source_word: לִבְנֵי אָדָם
  choice: среди сынов человеческих
  rationale: 'Буквально: «у/среди сынов человека». Традиционно понятное русское выражение сохраняет образную форму древнееврейского текста, а его обобщённое значение разъясняется в примечании.'
- source_word: אָדָם
  choice: человеческих
  rationale: В сочетании בני אדם слово имеет собирательное значение и относится к человечеству вообще. Русское «сынов человеческих» сохраняет исходную мужскую форму, не ограничивая смысл только мужчинами.
theological_decisions:
- issue: Обобщённое значение выражения לִבְנֵי אָדָם
  choice: среди сынов человеческих
  alternative: среди людей / среди человечества
  rationale: Древнееврейское выражение грамматически мужского рода, но имеет обобщённое человеческое значение. Основной текст сохраняет исходный образ, а примечание предотвращает ошибочное понимание как ссылки исключительно на мужчин.
- issue: Характер связи כְּרֻם с главным предложением
  choice: когда низость возвышается
  alternative: в то время как низость возвышается / по мере возвышения низости
  rationale: Синтаксис допускает временно-обстоятельственный оттенок и не требует жёсткой причинной связи. «Когда» сохраняет эту открытость и не утверждает прямо, что возвышение низости является единственной причиной поведения нечестивых.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис краткий и ясный; выражение «сыны человеческие» сохраняет поэтическую форму оригинала, а примечание раскрывает его обобщённый смысл.
