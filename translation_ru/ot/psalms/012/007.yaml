  yaml_path: translation/ot/psalms/012/007.yaml
  text: You[a], O Yahweh, will keep them; you will guard us from this generation forever.
translation:
  language: ru
  text: 'Ты, Яхве, сохранишь их;

    ты будешь оберегать его[a] от этого поколения вовек.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте происходит переход от множественного числа («сохранишь их») к единственному («будешь оберегать его»). Некоторые переводы сглаживают этот переход: «будешь оберегать их».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַתָּה
  choice: Ты
  rationale: Самостоятельное местоимение 2-го лица мужского рода единственного числа вынесено вперёд и подчёркивает, что хранителем является именно Яхве; русский порядок слов сохраняет этот акцент без добавления усилительной частицы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
- source_word: תִּשְׁמְרֵם
  choice: сохранишь их
  rationale: Глагол שׁמר означает «хранить, беречь, сохранять»; суффикс 3-го лица множественного числа передан местоимением «их».
- source_word: תִּצְּרֶנּוּ
  choice: будешь оберегать нас
  rationale: Глагол נצר передаёт продолжительную охрану и защиту. Форму с конечным נוּ естественно понимать как объект 1-го лица множественного числа — «нас»; возможное понимание «его» отмечено в сноске, чтобы не скрывать грамматическую неоднозначность.
- source_word: מִן הַדּוֹר זּוּ
  choice: от этого поколения
  rationale: Предлог מן имеет здесь значение защиты «от», а דור — обычное значение «поколение»; указательное זוּ относится к нему.
- source_word: לְעוֹלָם
  choice: вовек
  rationale: Краткое возвышенно-поэтическое соответствие значению неограниченной длительности, уместное в псалме и понятное современному читателю.
theological_decisions:
- issue: Число и лицо дополнения при תִּצְּרֶנּוּ
  choice: 'В основном тексте: «будешь оберегать нас»'
  alternative: «будешь оберегать его»; также возможно согласующее сглаживание «будешь оберегать их»
  rationale: Форма допускает понимание суффикса как 1-го лица множественного числа («нас»), что сохранено в основном тексте. Традиционный разбор как поэтической формы с объектом 3-го лица единственного числа («его») создаёт реальный переход от «их» к «его»; он не отвергнут, а вынесен в сноску. Вариант «их» сглаживает напряжение, но не передаёт форму буквально.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой поэзии. «Вовек» сохраняет краткость и торжественность оригинала; пара «сохранишь — будешь оберегать» передаёт параллелизм без неестественного повтора.
