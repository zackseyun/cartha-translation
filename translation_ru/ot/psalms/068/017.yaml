lexical_decisions:
- source_word: רֶכֶב אֱלֹהִים
  choice: колесниц Божьих
  rationale: רֶכֶב может собирательно обозначать колесницы или колесничное войско; форма «колесниц Божьих» ясно сохраняет образ и притяжательное отношение.
- source_word: רִבֹּתַיִם
  choice: десятки тысяч
  rationale: Двойственная форма буквально может означать «две мириады», но в поэзии выражает огромное множество; «десятки тысяч» естественно передаёт это без требования точного подсчёта.
- source_word: אַלְפֵי שִׁנְאָן
  choice: тысячи и тысячи
  rationale: שִׁנְאָן — редкое и неясное слово, вероятно связанное с повторением или множественностью; выбранная формулировка передаёт вероятный смысл и сохраняет поэтическое нарастание.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Божественный титул אֲדֹנָי передан современным, возвышенным русским словом, выражающим господство и отличающим титул от личного имени.
- source_word: בָם
  choice: среди них
  rationale: Предлог ב с местоименным суффиксом допускает значения «в них», «с ними» и «среди них»; в контексте множества небесных колесниц естественнее «среди них».
- source_word: סִינַי בַּקֹּדֶשׁ
  choice: Синай во святости
  rationale: Краткая, эллиптическая формулировка сохраняет Синай и допускаемое словом קֹדֶשׁ абстрактное значение «святость», не превращая его без необходимости в конкретное святилище.
theological_decisions:
- issue: Толкование сжатой фразы אֲדֹנָי בָם סִינַי בַּקֹּדֶשׁ
  choice: Владыка среди них — Синай во святости
  alternative: «Владыка среди них, как на Синае, во святости»; «Владыка пришёл с Синая во святилище»; «Владыка среди них; Синай — во святилище»
  rationale: Еврейский текст предельно сжат, и синтаксическая связь слов не вполне ясна. Основной текст сохраняет эту напряжённость и не добавляет прямо не выраженных сравнения или движения; примечание сообщает основные возможные понимания.
