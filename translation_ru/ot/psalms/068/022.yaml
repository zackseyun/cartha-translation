  yaml_path: translation/ot/psalms/068/022.yaml
  text: The Lord said[a], “I will bring them back from Bashan; I will bring them back from the depths of the sea,”
translation:
  language: ru
  text: 'Господь сказал: «Я возвращу их с Башана, возвращу их из морских глубин».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Я возвращу с Башана; возвращу из морских глубин». В еврейском тексте дополнение не названо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Передаёт божественный титул אֲדֹנָי естественным для русского библейского стиля словом; это не тетраграмматон יהוה.
- source_word: אָמַר
  choice: сказал
  rationale: Форма qatal прямо вводит речь Господа; простое прошедшее время естественно в данном контексте.
- source_word: מִבָּשָׁן
  choice: с Башана
  rationale: Топоним сохраняется в традиционной русской форме, а מִן передаётся естественным сочетанием «с Башана».
- source_word: אָשִׁיב ... אָשִׁיב
  choice: Я возвращу их ... возвращу их
  rationale: Hiphil глагола שוב имеет каузативно-переходный смысл «возвратить, привести обратно». Местоимение «их» восполняет подразумеваемое дополнение; повтор глагола сохранён.
- source_word: מִמְּצֻלוֹת יָם
  choice: из морских глубин
  rationale: מְצֻלוֹת обозначает глубины, особенно водные; русское выражение сохраняет образ крайней удалённости и опасности.
theological_decisions:
- issue: Подразумеваемое дополнение при повторённом אָשִׁיב
  choice: 'В основном тексте добавить «их»: «Я возвращу их»'
  alternative: 'Формально оставить дополнение невыраженным: «Я возвращу с Башана; возвращу из морских глубин»'
  rationale: В еврейском дополнение не названо, но переходная каузативная форма позволяет восстановить его из контекста. Для естественной русской речи «их» уместно, однако примечание сохраняет подлинную синтаксическую неоднозначность и не определяет безоговорочно, кого именно возвращает Господь.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор исходного глагола сохранён; во второй части местоимение опущено как естественно подразумеваемое в русском, но смысловое «их» относится к обоим глаголам.
