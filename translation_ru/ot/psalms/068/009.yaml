  text: גֶּ֣שֶׁם נְ֭דָבוֹת תָּנִ֣יף אֱלֹהִ֑ים נַחֲלָתְ/ךָ֥ וְ֝/נִלְאָ֗ה אַתָּ֥ה כֽוֹנַנְתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/009.yaml
  text: You sent abundant rain[a], O God; when your inheritance was weary[b], you established it.
translation:
  language: ru
  text: Обильный дождь[a] Ты ниспослал, Боже; когда Твоё наследие[b] изнемогало, Ты укрепил его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «щедрый дождь»; еврейское выражение подчёркивает обильный, щедро дарованный Богом дождь.'
    reason: lexical_alternative
  - marker: b
    text: «Твоё наследие» может означать Божий народ, принадлежащую Ему землю или и то и другое вместе.
    reason: alternative_reading
lexical_decisions:
- source_word: גֶּשֶׁם נְדָבוֹת
  choice: обильный дождь
  rationale: Сочетание буквально связано с добровольностью и щедростью, но здесь идиоматически описывает щедро дарованный, изобильный дождь. «Обильный дождь» естественно передаёт результат Божьей щедрости, а дополнительный оттенок отмечен в сноске.
- source_word: תָּנִיף
  choice: Ты ниспослал
  rationale: Каузативная форма глагола נוּף в сочетании с дождём изображает Бога вызывающим его выпадение. «Ниспослал» сохраняет Божью инициативу, возвышенный поэтический регистр и не навязывает буквальный образ размахивания или встряхивания.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма обращения естественно передаёт вокатив и молитвенно-поэтический характер строки.
- source_word: נַחֲלָתְךָ
  choice: Твоё наследие
  rationale: Так сохраняется широкий смысл Божьего удела или достояния без преждевременного уточнения, идёт ли речь о народе, земле или о том и другом вместе.
- source_word: וְנִלְאָה
  choice: когда … изнемогало
  rationale: Форма женского рода согласуется с נַחֲלָה и обозначает состояние истощения или изнеможения. Временная связь «когда» естественно выражает смысл последовательности в русском языке.
- source_word: כּוֹנַנְתָּהּ
  choice: Ты укрепил его
  rationale: Глагол означает утвердить, сделать прочным, привести в устойчивое состояние. «Укрепил» подходит как к земле, так и к народу и передаёт восстановительное действие без чрезмерного уточнения.
theological_decisions:
- issue: К чему относится выражение «Твоё наследие»
  choice: Сохранено общее выражение «Твоё наследие»
  alternative: Земля Израиля; народ Израиля; Божье достояние, включающее и землю, и народ
  rationale: Еврейский поэтический текст допускает как значение земли, так и значение Божьего народа, возможно объединяя их. Перевод не сужает эту намеренную смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «Обильный дождь Ты ниспослал» сохраняет ритм и акцент исходной строки; обращение «Боже» естественно для псалма.
