base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/007.yaml
  text: God[a], when you went out before your people, when you marched through the wilderness—Selah
translation:
  language: ru
  text: Боже, когда Ты выступал впереди народа Твоего, когда шествовал по пустыне[a], — Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по безлюдной земле»; еврейское слово обозначает пустынную, необитаемую местность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Начальная форма понимается как прямое обращение к Богу; русский звательный по функции оборот «Боже» естественно передаёт это без добавления отдельной частицы.
- source_word: בְּצֵאתְךָ
  choice: когда Ты выступал
  rationale: Предлог ב с инфинитивом-сопряжённой формой и суффиксом 2-го лица выражает время. «Выступал» передаёт начало целенаправленного движения и звучит естественно в контексте шествия.
- source_word: לִפְנֵי עַמֶּךָ
  choice: впереди народа Твоего
  rationale: לִפְנֵי обозначает положение перед кем-либо; перевод сохраняет образ Бога, идущего во главе народа, не расширяя его толкованием.
- source_word: בְּצַעְדְּךָ
  choice: когда шествовал
  rationale: צעד означает шагать или шествовать. Здесь слово параллельно выражению о выходе Бога перед народом и передаёт торжественное, целенаправленное движение.
- source_word: בִישִׁימוֹן
  choice: по пустыне
  rationale: יְשִׁימוֹן называет безлюдную, пустынную местность. Предлог «по» по-русски естественно сочетается с глаголом движения и не уточняет маршрут сверх текста.
- source_word: סֶלָה
  choice: Села
  rationale: Термин передан транслитерацией, поскольку его точное литургическое или музыкальное значение остаётся неясным.
theological_decisions:
- issue: Действие Бога во время странствия народа по пустыне
  choice: Стих передан как прямое обращение к Богу с воспоминанием о том, как Он шёл впереди Своего народа.
  alternative: Понять начальное אֱלֹהִים как часть описательного высказывания, а не как обращение.
  rationale: Синтаксис и контекст псалма поддерживают прямое обращение. Перевод сохраняет образ Божьего предводительства, не добавляя не выраженных в стихе богословских подробностей.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным псалмическим звучанием. Синтаксический параллелизм оригинала сохранён; местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с принятой русской библейской традицией.
