lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов слово, вероятно, обозначает человека, руководившего музыкальным исполнением. Этот перевод понятен современному читателю и сохраняет богослужебно-музыкальный контекст.
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая форма соответствует стилю надписания и не сводит широкое значение еврейского предлога ל исключительно к прямому указанию на авторство.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Традиционный и естественный русский эквивалент жанрового обозначения музыкального произведения.
- source_word: שִׁיר
  choice: Песнь
  rationale: Передаёт второе жанровое обозначение отдельно, не объединяя его со словом «псалом».
theological_decisions:
- issue: Связь надписания с Давидом
  choice: Давида
  alternative: Давидов; для Давида; написанный Давидом
  rationale: Еврейская конструкция допускает авторство, принадлежность, посвящение или иную связь; основной текст и примечание сохраняют эту неоднозначность.
translation_notes:
  register: Краткое, торжественное надписание с отдельной передачей каждого еврейского элемента. Употреблено современное и понятное «руководителю хора», а традиционные жанровые слова «псалом» и «песнь» сохранены.
