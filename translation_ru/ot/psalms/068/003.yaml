lexical_decisions:
- source_word: וְצַדִּיקִים
  choice: А праведники
  rationale: צַדִּיקִים — люди, живущие праведно. Союз וְ сам по себе может означать «и», однако здесь «а» естественно передаёт противопоставление нечестивым из предыдущего стиха, не усиливая его сверх контекста.
- source_word: יִשְׂמְחוּ
  choice: будут радоваться
  rationale: Глагол שׂמח обозначает радость. Нейтральное «будут радоваться» сохраняет его значение и позволяет отличить последующие, более выразительные глаголы.
- source_word: יַעַלְצוּ
  choice: ликовать
  rationale: עלץ выражает бурную, восторженную радость; «ликовать» точно и естественно передаёт эту усиленную окраску.
- source_word: לִפְנֵי אֱלֹהִים
  choice: пред Богом
  rationale: Буквально выражение указывает на нахождение «перед лицом» Бога, то есть в Его присутствии. «Пред Богом» кратко сохраняет пространственно-реляционный образ и соответствует возвышенному поэтическому регистру.
- source_word: וְיָשִׂישׂוּ
  choice: и торжествовать
  rationale: שׂוש означает радостное ликование или торжество. «Торжествовать» различает этот глагол с двумя предшествующими словами радости, сохраняя нарастание поэтического ряда.
- source_word: בְשִׂמְחָה
  choice: с радостью
  rationale: Существительное שִׂמְחָה обозначает радость и уточняет образ действия. «С радостью» сохраняет намеренное еврейское нагромождение слов одного смыслового поля, хотя по-русски оно звучит несколько усиленно.
