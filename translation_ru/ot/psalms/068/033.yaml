  text: לָ֭/רֹכֵב בִּ/שְׁמֵ֣י שְׁמֵי קֶ֑דֶם הֵ֥ן יִתֵּ֥ן בְּ֝/קוֹל/וֹ ק֣וֹל עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/033.yaml
  text: to him who rides in the highest heavens[a], which are from ancient times—behold, he gives forth his voice[b], a mighty voice.
translation:
  language: ru
  text: Тому, кто едет по высочайшим небесам, древним от века! Вот, Он издаёт Свой голос — могучий голос.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָרֹכֵב
  choice: Тому, кто шествует
  rationale: Префикс ל продолжает синтаксис призыва из предыдущего стиха («воздайте силу Богу»), а причастие רֹכֵב обозначает Бога как небесного всадника. «Шествует» естественно и возвышенно передаёт движение, не вводя отсутствующий в тексте предмет езды.
- source_word: בִּשְׁמֵי שְׁמֵי
  choice: по высочайшим небесам
  rationale: Буквальная конструкция «по небесам небес» имеет значение превосходной степени. «Высочайшие небеса» передаёт это значение естественным современным русским языком, а «по» сохраняет образ движения небесного всадника.
- source_word: קֶדֶם
  choice: существующим издревле
  rationale: 'Здесь слово имеет временное значение и относится к небесам: они существуют с древнейших времён. Развёрнутая формулировка устраняет возможное неверное понимание как пространственного «восток».'
- source_word: הֵן
  choice: Вот
  rationale: Частица привлекает внимание и вводит торжественное утверждение; «вот» сохраняет её дейктическую и поэтическую функцию.
- source_word: יִתֵּן בְּקוֹלוֹ
  choice: Он подаёт голос
  rationale: Сочетание נתן с «голосом» означает издать или подать голос. Русское «подаёт голос» сохраняет образ еврейского выражения без лишнего уточнения.
- source_word: קוֹל עֹז
  choice: голос могучий
  rationale: Буквально «голос силы». Постпозиция прилагательного сохраняет поэтическую торжественность и передаёт мощь голоса.
theological_decisions:
- issue: Кого обозначает небесный всадник
  choice: Продолжение обращения к Богу Израиля, описанному как шествующий по небесам
  alternative: Типологическое отнесение образа к Мессии или истолкование его как ангельского существа
  rationale: Непосредственный контекст говорит о Боге. Перевод сохраняет этот референт и не вводит более узкого позднейшего богословского отождествления.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим ритмом. Сохранены обращение, образ небесного всадника, частица привлечения внимания и повтор слова «голос».
