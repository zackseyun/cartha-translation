  to: Тому, кто едет по высочайшим небесам, древним от века! Вот, Он издаёт Свой голос — могучий голос.
  rationale: Редакция прямо передаёт образ небесного всадника в רֹכֵב, сохраняя синтаксическое продолжение обращения из предыдущего стиха («Тому, кто...»). «Древним от века» относит קֶדֶם к «небесам» и звучит естественно в современном литературном поэтическом русском. Глагол «издаёт» и обычный порядок «могучий голос» точнее и естественнее передают נתן קול и קול עז. Сохранены частица «Вот», повтор «голос» и отсутствие доктринального уточнения референта.
