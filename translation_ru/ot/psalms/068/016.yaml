base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/016.yaml
  text: Why do you leap about[a], O many-peaked mountains, at the mountain God desired for his dwelling? Indeed, Yahweh will dwell there forever.
translation:
  language: ru
  text: Почему вы с завистью смотрите[a], многовершинные горы, на гору, на которой Бог пожелал обитать? Да, Яхве будет обитать на ней вечно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему вы скачете, многовершинные горы?» Еврейский глагол редок, и его значение неясно: он может описывать скачки либо завистливый или неприязненный взгляд.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַצְּדוּן
  choice: с завистью смотрите
  rationale: Редкий и неясный глагол. В контексте противопоставления величественных гор горе, избранной для Божьего обитания, значение завистливого или неприязненного взгляда естественно передаёт риторическую силу; возможное значение движения отмечено в сноске.
- source_word: הָרִים גַּבְנֻנִּים
  choice: многовершинные горы
  rationale: Прилагательное, вероятно, изображает горы с выдающимися хребтами, «горбами» или множеством вершин. Этот вариант сохраняет конкретный образ, не сводя его просто к высоте.
- source_word: הָהָר
  choice: гора
  rationale: С артиклем обозначает конкретную гору, о которой идёт речь. Название Сион здесь прямо не употреблено, поэтому оно не добавляется.
- source_word: חָמַד
  choice: пожелал
  rationale: Глагол выражает желание, влечение или благоволение. «Пожелал» близко к исходной формулировке и не заменяет её более истолковывающим «избрал».
- source_word: לְשִׁבְתּוֹ
  choice: для Своего обитания
  rationale: 'Инфинитив с местоименным суффиксом указывает на цель: гора предназначена как место Божьего обитания.'
- source_word: אַף
  choice: да
  rationale: Здесь частица усиливает и подтверждает последующее утверждение; русское «да» кратко и естественно передаёт это emphatic affirmation.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: יִשְׁכֹּן לָנֶצַח
  choice: будет обитать на ней вечно
  rationale: Глагол означает пребывание или поселение, а выражение לָנֶצַח — непрекращающуюся длительность. «На ней» ясно восстанавливает из контекста указание на гору.
theological_decisions:
- issue: Следует ли прямо назвать гору Сионом
  choice: Сохранить общее наименование «гора»
  alternative: «гора Сион»
  rationale: Контекст псалма позволяет видеть здесь Сион, но в самом стихе стоит обычное существительное с артиклем, а не имя собственное. Перевод не вносит отсутствующую в тексте конкретизацию.
- issue: Как передать отношение других гор к горе Божьего обитания
  choice: «с завистью смотрите» с указанием неопределённости в сноске
  alternative: «скачете» или «прыгаете»
  rationale: Редкость глагола не позволяет устранить неоднозначность. Основной вариант отражает риторическое соперничество гор, а значение движения сохраняется как реальная лексическая возможность в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным псалмовым звучанием. Порядок слов слегка риторический; обращение «многовершинные горы» остаётся ясным. Местоимение «Своего» написано с прописной буквы как традиционный знак почтительности, не меняющий смысла исходного текста.
