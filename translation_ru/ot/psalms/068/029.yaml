lexical_decisions:
- source_word: מֵהֵיכָלֶךָ
  choice: От Твоего храма
  rationale: Предлог מִן прежде всего передаёт исходную точку («от, из»), а הֵיכָל в данном контексте означает Божий храм. Более свободное причинное понимание вынесено в примечание.
- source_word: עַל יְרוּשָׁלִָם
  choice: что над Иерусалимом
  rationale: עַל сохраняет пространственный оттенок «над, выше». Оборот «что над Иерусалимом» естественнее по-русски, чем непосредственное «храма над Иерусалимом», и может указывать на возвышенное положение храма, не создавая образа храма, висящего над городом.
- source_word: לְךָ
  choice: Тебе
  rationale: Дательный падеж прямо обозначает получателя при глаголе «принесут».
- source_word: יוֹבִילוּ
  choice: принесут
  rationale: Порода Hiphil глагола יבל здесь означает доставить или принести нечто адресату.
- source_word: מְלָכִים
  choice: цари
  rationale: Прямое соответствие существительному, сохраняющее образ правителей народов.
- source_word: שַׁי
  choice: дань
  rationale: Слово обозначает дар или подношение, в том числе приносимое высшему властителю. «Дань» сохраняет политический и почтительный оттенок контекста; нейтральное «дар» отмечено как возможный вариант.
theological_decisions:
- issue: Синтаксическая связь выражения о храме с Иерусалимом и последующим действием царей
  choice: 'Сохранено пространственное чтение: «От Твоего храма, что над Иерусалимом»'
  alternative: «Из-за Твоего храма в Иерусалиме цари принесут Тебе дары»
  rationale: Еврейские предлоги допускают как более буквальное пространственное понимание, так и причинно-локативное. Основной текст удерживает обычные пространственные значения מִן и עַל, а примечание сохраняет реально возможный иной синтаксический разбор, не превращая его в единственно допустимое толкование.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но ясным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы. Инверсия избегается там, где она мешала бы естественности; неоднозначность еврейского синтаксиса сохранена в примечании.
