  text: כְּ/הִנְדֹּ֥ף עָשָׁ֗ן תִּ֫נְדֹּ֥ף כְּ/הִמֵּ֣ס דּ֭וֹנַג מִ/פְּנֵי אֵ֑שׁ יֹאבְד֥וּ רְ֝שָׁעִ֗ים מִ/פְּנֵ֥י אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/002.yaml
  text: As smoke is driven away[a], so you drive them away; as wax melts before fire[c][b], so the wicked perish before God.
translation:
  language: ru
  text: Как дым развеивается[a], так Ты развеиваешь их; как воск тает перед огнём[b][c], так нечестивые гибнут перед Богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «разгоняется» или «уносится»; еврейский глагол может обозначать удаление, рассеивание или унесение ветром.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от лица огня» и «от лица Бога» — оборот, который может означать присутствие перед кем-либо или причинное воздействие этого присутствия.'
    reason: lexical_alternative
  - marker: c
    text: Еврейские глагольные формы можно также понять как будущее («развеешь… погибнут») или, в данном контексте, как пожелание («да развеешь… да погибнут»).
    reason: alternative_reading
lexical_decisions:
- source_word: כְּ/הִנְדֹּף עָשָׁן
  choice: Как дым развеивается
  rationale: כ с инфинитивом вводит сравнение; русская придаточная конструкция естественно передаёт образ удаления и рассеивания дыма.
- source_word: תִּנְדֹּף
  choice: Ты развеиваешь их
  rationale: Форма обращена к Богу во 2-м лице единственного числа. «Развеиваешь» сохраняет связь с тем же корнем в первой строке, а «их» указывает на подразумеваемых врагов, параллельных нечестивым далее.
- source_word: כְּ/הִמֵּס דּוֹנַג
  choice: как воск тает
  rationale: Сравнительная конструкция естественно передаётся личной формой русского глагола; דּוֹנַג означает «воск».
- source_word: מִ/פְּנֵי אֵשׁ
  choice: перед огнём
  rationale: Сохраняет образ присутствия и воздействия огня, не сводя многозначный оборот лишь к причинному значению.
- source_word: יֹאבְדוּ
  choice: гибнут
  rationale: אבד обозначает гибель или исчезновение; «гибнут» сохраняет поэтическую силу, не уточняя способ уничтожения.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Устойчивое и понятное обозначение людей, характеризуемых нравственной порочностью и противлением Богу.
- source_word: מִ/פְּנֵי אֱלֹהִים
  choice: перед Богом
  rationale: Передаёт буквальный пространственно-реляционный образ «пред лицом/в присутствии Бога» и его контекстуальную причинную силу.
theological_decisions:
- issue: Видо-временная и модальная сила еврейских имперфектов
  choice: 'Настоящее время с обобщённо-наглядным значением: «Ты развеиваешь… гибнут»'
  alternative: Будущее («развеешь… погибнут») либо пожелание («да развеешь… да погибнут»)
  rationale: Поэтический имперфект допускает будущее, обычное действие или модально-пожелательный смысл. Настоящее время сохраняет живую картину и не устраняет присущую контексту неоднозначность; возможные прочтения отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Местоимение «Ты» написано с прописной буквы как форма прямого обращения к Богу; смысловой субъект не добавлен там, где его нет в еврейском тексте, кроме необходимого объекта «их», подразумеваемого контекстом.
