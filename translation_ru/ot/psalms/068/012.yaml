- source_word: יִדֹּדוּן יִדֹּדוּן
  choice: бегут, бегут
  rationale: Прямо передаёт повтор глагола נדד и его поэтическое усиление, не заменяя его толковательным наречием.
- source_word: וּנְוַת בַּיִת
  choice: живущая в доме
  rationale: Передаёт женский род и единственное число, сохраняя образ женщины, остающейся дома, без сужения смысла до современного социального обозначения «домохозяйка».
- source_word: תְּחַלֵּק
  choice: делит
  rationale: 'Естественно передаёт значение породы пиэль: разделять или распределять между получателями.'
- source_word: שָׁלָל
  choice: добычу
  rationale: Обычное современное русское обозначение захваченного на войне имущества; ясно и без излишней архаики.
