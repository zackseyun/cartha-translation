  yaml_path: translation/ot/psalms/068/026.yaml
  text: In the assemblies[a], bless God, the Lord[b], from the fountain of Israel.
translation:
  language: ru
  text: В собраниях благословляйте Бога — Яхве, вы, из источника Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «из источника Израиля» эллиптично. Оно может характеризовать призываемых к поклонению как происходящих из рода Израиля; его синтаксическая связь в строке не вполне ясна.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּמַקְהֵלוֹת
  choice: в собраниях
  rationale: Существительное во множественном числе обозначает собравшиеся группы людей; «собрания» сохраняет число и не придаёт выражению излишне институционального оттенка.
- source_word: בָּרְכוּ
  choice: благословляйте
  rationale: Форма является повелением во множественном числе. При Боге как объекте глагол ברך означает благословлять Его в поклонении; перевод «прославляйте» возможен по смыслу, но менее точно передаёт лексику оригинала.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В данном контексте слово имеет единственное значение и относится к Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
- source_word: מִמְּקוֹר יִשְׂרָאֵל
  choice: происходящие из источника Израиля
  rationale: מָקוֹר буквально значит «источник, родник». Эллиптическая фраза, вероятно, характеризует призываемых к поклонению как происходящих из истока или рода Израиля; добавленное «происходящие» делает эту связь понятной по-русски, не устраняя образ источника.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В масоретском еврейском тексте непосредственно стоит тетраграмматон. Транслитерация сохраняет личное имя, не подменяя его традиционным титулом.
- issue: Синтаксическая связь выражения מִמְּקוֹר יִשְׂרָאֵל
  choice: обращение к людям, происходящим из источника Израиля
  alternative: обстоятельственная фраза «из источника Израиля», относящаяся к благословению или к Яхве
  rationale: Еврейская фраза эллиптична. Понимание её как характеристики поклоняющихся даёт связный русский текст, однако грамматика допускает более буквальное и неоднозначное прочтение, поэтому оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Тире выделяет имя «Яхве» как приложение к слову «Бога». Образ «источника Израиля» сохранён, а необходимое для русского синтаксиса пояснение вынесено в основной текст с оговоркой в сноске.
