lexical_decisions:
- source_word: רָעָשָׁה
  choice: содрогнулась
  rationale: Передаёт сильное сотрясение земли и сохраняет поэтическую возвышенность без излишне технического «затряслась».
- source_word: נָטְפוּ
  choice: пролились дождём
  rationale: Буквально глагол означает «капали, источали влагу»; в контексте теофании естественная русская формулировка передаёт небесные воды, не уточняя сверх текста их характер.
- source_word: מִפְּנֵי
  choice: пред
  rationale: Сохраняет пространственно-реляционное значение «перед лицом / в присутствии» и торжественный поэтический регистр.
- source_word: זֶה סִינַי
  choice: этот Синай
  rationale: Формально сохраняет указательное זֶה и резкую, синтаксически неоднозначную формулу масоретского текста, не превращая её в более гладкое толкование.
theological_decisions:
- issue: Связь слов «этот Синай» с окружающими частями стиха
  choice: 'Сохранена отдельная вставная формула: «— этот Синай —»'
  alternative: «сам Синай» или «на Синае»
  rationale: Еврейский текст необычен и допускает разные способы понимания; буквальная вставная конструкция сохраняет его напряжение и не добавляет отсутствующего предлога.
- issue: Образ реакции небес на явление Бога
  choice: «небеса пролились дождём»
  alternative: «небеса капали»
  rationale: Выбран естественный русский образ осадков при сохранении представления о космической реакции на Божье присутствие; причинная или догматическая интерпретация не добавляется.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим звучанием. Повтор «пред Богом» сохранён как важный элемент еврейского параллелизма; необычность «этот Синай» намеренно не сглажена.
