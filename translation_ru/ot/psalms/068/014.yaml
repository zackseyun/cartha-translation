base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/014.yaml
  text: When the Almighty scattered kings there, it snowed on Zalmon.
translation:
  language: ru
  text: 'Когда Всемогущий рассеял там[a] царей,

    на Цалмоне выпал снег[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в ней»; к чему относится местоимение, в этой строке прямо не указано.'
    reason: Еврейское בָּהּ — местоименная форма женского рода, тогда как перевод «там» является контекстуальным.
  - marker: b
    text: 'Еврейскую форму можно также понять как обращение: «ты заснежил»; при прочтении в третьем лице женского рода её субъект остаётся не назван. Возможен и образный смысл: «стало бело, как от снега».'
    reason: Редкая форма תַּשְׁלֵג допускает разные грамматические разборы и образное понимание; основной текст передаёт допустимое безличное погодное прочтение, не устраняя этой неопределённости.
lexical_decisions:
- source_word: שַׁדַּי
  choice: Всемогущий
  rationale: Традиционный и естественный русский эквивалент божественного титула Шаддай; имя не заменено конфессионально окрашенным толкованием.
- source_word: פָרֵשׂ
  choice: рассеял
  rationale: 'Передаёт распределение или разгон царей; форма с בְּ понята как временная конструкция: «когда…».'
- source_word: בָּהּ
  choice: там
  rationale: Контекстуальное наречное прочтение, соответствующее английскому консультационному тексту; буквальная местоименная форма сохраняется в примечании.
- source_word: צַלְמוֹן
  choice: Цалмон
  rationale: Транслитерация еврейского географического названия צַלְמוֹן, без попытки отождествить место с конкретным современным объектом.
- source_word: תַּשְׁלֵג
  choice: выпал снег
  rationale: Естественная русская безличная передача редкого глагола «снежить/покрывать снегом»; формальная неоднозначность отмечена в примечании.
theological_decisions:
- issue: Субъект и смысл формы תַּשְׁלֵג
  choice: на Цалмоне выпал снег
  alternative: ты/она покрылась снегом на Цалмоне; стало бело, как снег на Цалмоне
  rationale: Краткая строка допускает разные синтаксические и образные толкования. Основной текст следует прямому погодному прочтению, не превращая снег в явно обозначенное сравнение, которого в еврейском тексте нет; неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с лаконичным, возвышенным поэтическим строем. Сохранено географическое имя «Цалмон» и параллельность двух строк; спорные местоименная и глагольная формы не перегружены в основном тексте, но документированы в примечаниях.
