  text: בָּ֤ר֣וּךְ אֲדֹנָ/י֮ י֤וֹם י֥וֹם יַֽעֲמָס לָ֗/נוּ הָ֘/אֵ֤ל יְֽשׁוּעָתֵ֬/נוּ סֶֽלָה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/019.yaml
  text: Blessed be the Lord[a], who day by day bears us up—God is our salvation. Selah
translation:
  language: ru
  text: Благословен Господь, который изо дня в день несёт нас[a], — Бог, наше спасение. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «изо дня в день несёт (или переносит) для нас»; прямое дополнение в еврейском тексте не названо. Возможны также переводы: «изо дня в день поддерживает нас» или, согласно традиционному толкованию, «ежедневно нагружает нас благами».'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Страдательное причастие входит в формулу славословия; «Благословен» естественно и торжественно передаёт её смысл.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Обычная русская передача божественного титула в контексте славословия.
- source_word: יוֹם יוֹם
  choice: изо дня в день
  rationale: Сохраняет распределительное значение и повтор исходного выражения, оставаясь естественным по-русски.
- source_word: יַעֲמָס לָנוּ
  choice: несущий бремя за нас
  rationale: Глагол обозначает возложение ноши или её несение, а לָנוּ значит «для нас/за нас». Дополнение в еврейском тексте не выражено, поэтому «бремя» передаёт образ, но как смысловое восполнение отмечено сноской.
- source_word: הָאֵל
  choice: Бог
  rationale: Естественная русская передача общего божественного наименования; артикль не требует буквального «этот Бог».
- source_word: יְשׁוּעָתֵנוּ
  choice: наше спасение
  rationale: Сохраняет широкий смысл спасения и избавления, не сужая его до одного конкретного вида помощи.
- source_word: סֶלָה
  choice: Села
  rationale: Традиционная транслитерация сохраняет неопределённость значения термина.
theological_decisions:
- issue: Толкование сжатого выражения יַעֲמָס לָנוּ
  choice: Господь ежедневно несёт бремя за свой народ.
  alternative: Господь ежедневно поддерживает нас; Господь ежедневно нагружает нас благами.
  rationale: Корень עמס связан с нагружением и несением ноши, однако прямое дополнение не названо. Основной текст сохраняет образ несения и значение לָנוּ «за нас/для нас», а сноска сообщает о реальной синтаксической неоднозначности, не превращая традиционное восполнение «благами» в сам текст.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмового славословия. Оборот «изо дня в день» сохраняет ритмический повтор; «Села» оставлено без истолкования. Тире подчёркивает итоговое исповедание, не устраняя смысловой связи между Божьей помощью и спасением.
