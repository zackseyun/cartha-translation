  text: עָ֘לִ֤יתָ לַ/מָּר֨וֹם שָׁ֘בִ֤יתָ שֶּׁ֗בִי לָקַ֣חְתָּ מַ֭תָּנוֹת בָּ/אָדָ֑ם וְ/אַ֥ף ס֝וֹרְרִ֗ים לִ/שְׁכֹּ֤ן יָ֬הּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/018.yaml
  text: You ascended on high[a]; you led captivity captive; you received gifts among men, even among the rebellious[b], so that Yah God might dwell there.
translation:
  language: ru
  text: 'Ты взошёл на высоту,

    увёл с собой пленников,

    принял дары среди людей[a],

    даже среди непокорных,

    чтобы там обитал Ях, Бог[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «принял дары от людей». Еврейский предлог может указывать как на пребывание среди людей, так и на получение даров от них.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы Ях, Бог, обитал среди них»; возможно также: «как жилище для Яха, Бога». Заключительная фраза в еврейском тексте очень сжата и допускает несколько синтаксических толкований.'
    reason: alternative_reading
lexical_decisions:
- source_word: עָלִיתָ
  choice: Ты взошёл
  rationale: Форма Qal, перфект, 2-е лицо мужского рода единственного числа. «Взошёл» естественно передаёт движение вверх и сохраняет возвышенный поэтический регистр.
- source_word: לַמָּרוֹם
  choice: на высоту
  rationale: מָרוֹם обозначает высоту или возвышенное место. «На высоту» сохраняет пространственный образ, не уточняя место сверх сказанного в еврейском тексте.
- source_word: שָׁבִיתָ שֶּׁבִי
  choice: увёл с собой пленников
  rationale: Еврейская конструкция с однокоренным дополнением выражает полный триумф над пленёнными. Буквальное «пленил плен» в современном русском звучит неестественно; выбранная формулировка ясно передаёт образ победного шествия с пленниками.
- source_word: לָקַחְתָּ
  choice: принял
  rationale: Хотя לקח буквально может означать «взял», в сочетании с дарами глагол естественно понимается как принятие даров или дани победителем.
- source_word: מַתָּנוֹת
  choice: дары
  rationale: Прямое соответствие существительному со значением подарков или приношений. «Дань» контекстуально возможна, но была бы более узким толкованием.
- source_word: בָּאָדָם
  choice: среди людей
  rationale: Предлог ב допускает понимание сферы («среди»), тогда как другое возможное значение источника («от людей») сохранено в примечании. אָדָם здесь передано обобщённо как «люди».
- source_word: וְאַף סוֹרְרִים
  choice: даже среди непокорных
  rationale: וְאַף придаёт фразе усилительный характер, а סוֹרְרִים обозначает упорно противящихся или мятежных. Повтор «среди» делает синтаксическую связь ясной по-русски, не устраняя смыслового напряжения.
- source_word: לִשְׁכֹּן
  choice: чтобы ... обитал
  rationale: Инфинитив с ל истолкован как выражение цели или результата. Такая передача естественна по-русски, при этом иные синтаксические варианты отмечены в примечании.
- source_word: יָהּ אֱלֹהִים
  choice: Ях, Бог
  rationale: יָהּ — краткая форма божественного имени, переданная транслитерацией «Ях»; אֱלֹהִים передано словом «Бог». Запятые представляют второе наименование как пояснительное приложение и сохраняют оба элемента исходного выражения.
theological_decisions:
- issue: Значение предлога в בָּאָדָם при слове «дары»
  choice: среди людей
  alternative: от людей
  rationale: Еврейский предлог допускает как значение сферы, так и значение источника. Основной текст следует менее направленному прочтению, а важная альтернатива сохранена в примечании без догматического разрешения неоднозначности.
- issue: Синтаксис и подразумеваемое место в לִשְׁכֹּן יָהּ אֱלֹהִים
  choice: чтобы Ях, Бог, обитал там
  alternative: чтобы Господь Бог обитал среди них; как жилище для Яха, Бога
  rationale: Исходная фраза предельно сжата и не называет явно обстоятельство места. «Там» обеспечивает естественность русского предложения, не отождествляя место однозначно ни с высотой, ни с людьми, ни с непокорными; другие возможные связи вынесены в примечание.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Строки кратки и параллельны. Архаическое и в современном русском неясное «пленил плен» заменено естественным «увёл с собой пленников», тогда как краткая форма божественного имени сохранена как «Ях».
