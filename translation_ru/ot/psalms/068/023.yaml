lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое или результативное значение союза естественным современным русским выражением.
- source_word: תִּמְחַץ רַגְלְךָ
  choice: нога твоя сокрушала их
  rationale: Форма תמחץ может быть понята как 3-е лицо женского рода при подлежащем «нога». Глагол מחץ сохраняет сильный образ сокрушения; подразумеваемое дополнение «их» восстанавливается из контекста врагов.
- source_word: בְּדָם
  choice: в крови
  rationale: Сохраняет конкретный и резкий образ еврейского текста, не уточняя сверх необходимого характер связи, выраженной предлогом ב.
- source_word: לְשׁוֹן כְּלָבֶיךָ
  choice: язык твоих псов
  rationale: Собирательное единственное число сохранено. «Псы» соответствует возвышенно-поэтическому, но понятному регистру псалма.
- source_word: מֵאֹיְבִים מִנֵּהוּ
  choice: получил свою долю от врагов
  rationale: Конечная фраза трудна и эллиптична. Контекстуальное восполнение сказуемого и «доли» создаёт понятную русскую строку, сохраняя источник добычи — побеждённых врагов.
theological_decisions:
- issue: Жестокий образ победы над врагами
  choice: Сохранить образы ноги в крови и псов, получающих долю от врагов
  alternative: Смягчить стих до общего утверждения о победе
  rationale: Еврейский текст намеренно использует резкую военную образность; перевод не должен устранять её из-за современных читательских ожиданий.
- issue: Неясность заключительного выражения
  choice: Дать в тексте наиболее связное контекстуальное прочтение и отметить эллиптичность
  alternative: Буквально передать מִנֵּהוּ как «от него»
  rationale: Изолированное «от него» оставило бы неясный референт и создало бы ненормальную русскую фразу; однако подлинная трудность исходного текста прямо отмечена в сноске.
translation_notes:
  register: Современный литературный русский с поэтической торжественностью. Инверсия «нога твоя» и слово «псы» поддерживают псалмовый регистр, не делая текст архаичным.
