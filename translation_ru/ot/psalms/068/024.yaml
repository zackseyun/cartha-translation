  text: רָא֣וּ הֲלִיכוֹתֶ֣י/ךָ אֱלֹהִ֑ים הֲלִ֘יכ֤וֹת אֵלִ֖/י מַלְכִּ֣/י בַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/024.yaml
  text: They have seen your processions[a], O God— the processions of my God, my King, into the sanctuary.
translation:
  language: ru
  text: Видели шествия Твои, Боже, — шествия Бога моего, Царя моего, во святилище.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Видели пути Твои, Боже, — пути Бога моего, Царя моего, в святости».'
    reason: 'Слова הֲלִיכוֹת и בַקֹּדֶשׁ допускают более общее понимание: «пути (хождения)» и «в святости».'
lexical_decisions:
- source_word: רָאוּ
  choice: Видели
  rationale: Форма qal perfect 3-го лица множественного числа обозначает завершённое восприятие; простое прошедшее время естественно передаёт это по-русски.
- source_word: הֲלִיכוֹתֶיךָ
  choice: шествия Твои
  rationale: Существительное во множественном числе может означать хождения, движения или шествия. Празднично-богослужебный контекст благоприятствует значению «шествия»; множественное число сохранено.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Контекст указывает на прямое обращение; русский звательный оборот «Боже» естественно передаёт его.
- source_word: הֲלִיכוֹת
  choice: шествия
  rationale: Повтор того же слова сохранён ради еврейского параллелизма и поэтического усиления.
- source_word: אֵלִי
  choice: Бога моего
  rationale: 'Суффикс 1-го лица единственного числа выражает принадлежность: «мой Бог»; родительный падеж обусловлен синтаксисом русского выражения «шествия Бога моего».'
- source_word: מַלְכִּי
  choice: Царя моего
  rationale: Буквально «мой Царь»; это приложение к «Бога моего», поэтому в русском поставлено в родительном падеже.
- source_word: בַקֹּדֶשׁ
  choice: во святилище
  rationale: В процессуальном контексте выражение вероятнее всего обозначает движение в священное место. Предлог «во» допускает направительное прочтение и сохраняет торжественный ритм.
theological_decisions:
- issue: Что обозначают шествия
  choice: Стих описывает явленные людям шествия Бога, связанные со святилищем.
  alternative: Слова могут более отвлечённо обозначать пути или действия Бога.
  rationale: Повтор הֲלִיכוֹת и заключительное בַקֹּדֶשׁ поддерживают богослужебно-процессионный образ, но примечание сохраняет возможное более широкое значение.
- issue: Значение בַקֹּדֶשׁ
  choice: «во святилище» — направительное понимание в контексте шествия.
  alternative: «в святости» или «в святом месте» — обстоятельство образа действия либо местонахождения.
  rationale: Контекст благоприятствует святилищу, однако еврейское выражение само по себе допускает и значение «в святости», поэтому неоднозначность отмечена.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим строем. Инверсия «Бога моего, Царя моего» сохраняет ритм и библейскую возвышенность, оставаясь понятной современному читателю. Прописные буквы в местоимении «Твои» и титуле «Царь» следуют принятой русской традиции обращения к Богу, не добавляя нового смысла.
