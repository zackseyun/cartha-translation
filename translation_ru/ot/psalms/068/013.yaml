  text: אִֽם תִּשְׁכְּבוּ/ן֮ בֵּ֪ין שְׁפַ֫תָּ֥יִם כַּנְפֵ֣י י֭וֹנָה נֶחְפָּ֣ה בַ/כֶּ֑סֶף וְ֝/אֶבְרוֹתֶ֗י/הָ בִּֽ/ירַקְרַ֥ק חָרֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/013.yaml
  text: Though you lie down among the sheepfolds[a], the wings of a dove are covered with silver[b], and her pinions with yellow gold.
translation:
  language: ru
  text: Хотя вы лежите среди овечьих загонов[a], крылья голубки покрыты серебром, а её маховые перья — зеленоватым золотом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «между перемётными сумами»; или: «между очажными камнями». Значение еврейского слова неясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «желтовато-зелёным золотом» или «золотом с желтовато-зелёным отливом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Хотя
  rationale: В данном поэтическом контексте частица, вероятно, вводит уступительное придаточное; перевод «хотя» естественен по-русски, при этом условное «если» остаётся грамматически возможным.
- source_word: תִּשְׁכְּבוּן
  choice: вы лежите
  rationale: Форма от שׁכב передаёт положение лёжа; настоящее время сохраняет обобщённый, поэтический характер несовершенного вида.
- source_word: בֵּין שְׁפַתָּיִם
  choice: среди овечьих загонов
  rationale: Значение редкого слова שְׁפַתָּיִם спорно. Традиционное понимание как загонов уместно в основном тексте, а существенные альтернативы вынесены в сноску.
- source_word: כַּנְפֵי יוֹנָה
  choice: крылья голубки
  rationale: Естественно передаёт конструкцию принадлежности и сохраняет образ; женский род согласуется с последующим местоименным суффиксом.
- source_word: נֶחְפָּה בַכֶּסֶף
  choice: покрыты серебром
  rationale: Причастие от חפה обозначает покрытие или обкладку; нейтральное «покрыты» не уточняет способ покрытия сверх исходного текста.
- source_word: אֶבְרוֹתֶיהָ
  choice: её маховые перья
  rationale: אֶבְרוֹת обозначает крупные перья крыла; «маховые перья» точнее и понятнее современному читателю, чем книжное «оперение» или редкое «маховые крылья».
- source_word: בִּירַקְרַק חָרוּץ
  choice: зеленоватым золотом
  rationale: ירקרק указывает на зеленовато-жёлтый оттенок, а חרוץ здесь понимается как золото. Необычный цветовой образ сохранён, а альтернативная передача оттенка отмечена в сноске.
