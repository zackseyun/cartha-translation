base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/028.yaml
  text: Your God has commanded your strength. Show strength[a], O God, you who have worked for us.
translation:
  language: ru
  text: Твой Бог определил тебе силу. Яви силу[a], Боже, Ты, кто действовал ради нас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское עוּזָה — трудная форма. Возможны также переводы: «Будь силён, Боже» или, в связи со следующим стихом: «Укрепи, Боже, то, что Ты совершил для нас».'
    reason: alternative_reading
lexical_decisions:
- source_word: צִוָּה
  choice: повелел
  rationale: Перфект передаёт завершённое властное повеление с сохраняющейся значимостью.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма אֱלֹהִים здесь имеет обычное единственное значение и с суффиксом 2-го лица означает «твой Бог».
- source_word: עֻזֶּךָ
  choice: твоей силе
  rationale: Существительное обозначает силу или могущество; дательный падеж естественно связан с глаголом «повелеть».
- source_word: עוּזָה
  choice: Яви силу
  rationale: Трудная форма понята как обращённая к Богу просьба проявить силу; необычность и иные возможные прочтения отмечены в сноске.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Контекст требует звательной функции; современное русское обращение передано формой «Боже».
- source_word: זוּ
  choice: Ты, действовавший
  rationale: Относительная частица вводит характеристику Бога в прямом обращении.
- source_word: פָּעַלְתָּ
  choice: действовавший
  rationale: Глагол выражает действенное совершение или действие; такой выбор не уточняет без необходимости конкретный вид Божьего дела.
- source_word: לָּנוּ
  choice: ради нас
  rationale: 'Предлог понят в бенефактивном смысле: Бог действовал на благо народа.'
theological_decisions:
- issue: Неоднозначная форма עוּזָה
  choice: 'Просьба к Богу проявить силу: «Яви силу, Боже»'
  alternative: '«Будь силён, Боже»; либо в связи со следующим стихом: «Укрепи, Боже, то, что Ты совершил для нас»'
  rationale: Еврейская форма синтаксически трудна. Основной текст сохраняет молитвенный смысл, не добавляя объекта из следующего стиха, а реальные альтернативы приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным обращением. Формулировка «повелел явиться твоей силе» восполняет необходимую по-русски связь, не превращая Божье повеление в утверждение о том, что Бог повелел самому человеку быть сильным.
