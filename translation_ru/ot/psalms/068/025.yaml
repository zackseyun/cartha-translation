lexical_decisions:
- source_word: קִדְּמוּ
  choice: впереди шли
  rationale: Пиэль глагола קדם здесь передаёт движение во главе шествия; выражение естественно по-русски и сохраняет пространственный образ.
- source_word: שָׁרִים
  choice: певцы
  rationale: Форма связана с שׁיר «петь», а не с שׂר «князь»; параллелизм с музыкантами и контекст шествия подтверждают значение.
- source_word: אַחַר
  choice: за ними
  rationale: Передаёт положение следующей группы в шествии; местоимение проясняет естественную русскую конструкцию без изменения смысла.
- source_word: נֹגְנִים
  choice: музыканты
  rationale: Причастная форма от נגן обозначает играющих на инструментах; «музыканты» — ясный и современный эквивалент.
- source_word: בְּתוֹךְ
  choice: среди
  rationale: Естественно передаёт нахождение внутри группы, не уточняя сверх текста точную схему расположения.
- source_word: עֲלָמוֹת
  choice: юных женщин
  rationale: Слово обозначает молодых женщин брачного возраста; перевод не вносит отсутствующего в данном слове явного утверждения о девственности.
- source_word: תּוֹפֵפוֹת
  choice: бьющих в бубны
  rationale: Деноминативная форма передаёт игру на תֹּף; «бить в бубны» сохраняет ударный характер действия и привычно звучит по-русски.
