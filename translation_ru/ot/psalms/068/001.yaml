base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/001.yaml
  text: God rises up; his enemies are scattered[a], and those who hate him flee from before him.
translation:
  language: ru
  text: Восстаёт Бог — и рассеиваются враги Его, а ненавидящие Его бегут от лица Его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному прочтению как пожелания: «Да восстанет Бог, да рассеются враги Его и да бегут от лица Его ненавидящие Его».'
    reason: Альтернативная передача поэтических форм imperfect как молитвенного пожелания.
lexical_decisions:
- source_word: יָקוּם
  choice: восстаёт
  rationale: Форма qal imperfect 3 м. р. ед. ч. от קום допускает в поэтическом контексте как яркое декларативное настоящее, так и пожелание. «Восстаёт» сохраняет образ действия Бога и не превращает форму в однозначный приказ.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму, слово согласовано с глаголом в единственном числе и обозначает Бога Израиля.
- source_word: יָפוּצוּ
  choice: рассеиваются
  rationale: Qal imperfect мн. ч. от פוץ передаёт рассеяние врагов. Возвратная форма естественна по-русски и сохраняет параллелизм с «бегут».
- source_word: אֹיְבָיו
  choice: враги Его
  rationale: Существительное с суффиксом 3 м. р. ед. ч.; постпозиция местоимения поддерживает возвышенный поэтический регистр.
- source_word: וְיָנוּסוּ
  choice: бегут
  rationale: Qal imperfect мн. ч. от נוס означает бегство. Краткое «бегут» звучит естественно и передаёт стремительное удаление.
- source_word: מְשַׂנְאָיו
  choice: ненавидящие Его
  rationale: 'Субстантивированное причастие с суффиксом сохраняет активный смысл: речь о тех, кто ненавидит Бога.'
- source_word: מִפָּנָיו
  choice: от лица Его
  rationale: Буквально «от Его лица». Этот понятный библейско-поэтический оборот сохраняет конкретный еврейский образ и смысл бегства из Божьего присутствия.
theological_decisions:
- issue: 'Смысл глагольных форм imperfect в начале стиха: утверждение или молитвенное пожелание'
  choice: 'Яркое декларативное настоящее: «Восстаёт Бог — и рассеиваются… бегут…»'
  alternative: 'Оптативное прочтение: «Да восстанет Бог, да рассеются враги Его и да бегут от лица Его ненавидящие Его»'
  rationale: Еврейские формы допускают оба оттенка в поэтическом контексте. Основной текст передаёт происходящее как живую картину, а традиционное молитвенно-пожелательное понимание сохраняется в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «враги Его», «от лица Его» уместна для псалма и остаётся понятной современному читателю; тире подчёркивает, что рассеяние и бегство следуют за Божьим восстанием.
