source:
  edition: WLC
  text: תְּנ֥וּ עֹ֗ז לֵֽ/אלֹ֫הִ֥ים עַֽל יִשְׂרָאֵ֥ל גַּאֲוָת֑/וֹ וְ֝/עֻזּ֗/וֹ בַּ/שְּׁחָקִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/034.yaml
  text: Ascribe strength to God[a]; his majesty is over Israel[b], and his strength is in the skies.
translation:
  language: ru
  text: 'Признайте силу Бога[a]:

    Его величие — над Израилем,

    и Его сила — в небесах[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «Дайте силу Богу»; здесь «дать» означает признать или воздать Богу присущую Ему силу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в облаках»; возможен также перевод: «в небесных высотах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Признайте
  rationale: Буквально глагол означает «дайте», но в поэтическом призыве речь идёт о признании и провозглашении присущей Богу силы, а не о наделении Его силой.
- source_word: עֹז / וְעֻזּוֹ
  choice: силу / Его сила
  rationale: Повтор одного и того же слова сохранён, чтобы передать смысловую и поэтическую связь между призывом и последующим утверждением.
- source_word: לֵאלֹהִים
  choice: Бога
  rationale: При глаголе «признать» естественная русская конструкция требует прямого дополнения; смысл еврейского предлога ל передан синтаксически.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל здесь естественно выражает положение свыше или превосходство; «над Израилем» сохраняет пространственно-царственный оттенок и параллелизм стиха.
- source_word: גַּאֲוָתוֹ
  choice: Его величие
  rationale: В контексте хвалы слово обозначает возвышенность и величие Бога; отрицательное русское «гордость» здесь было бы неуместно.
- source_word: בַּשְּׁחָקִים
  choice: в небесах
  rationale: Поэтическое שְׁחָקִים может обозначать небеса, небесные высоты или облака. «В небесах» звучит естественно и сохраняет возвышенный космический образ.
theological_decisions:
- issue: Означает ли повеление, что люди буквально дают Богу силу
  choice: «Признайте силу Бога»
  alternative: «Дайте силу Богу»
  rationale: Еврейская формулировка буквально использует глагол «дать», однако в данном славословии призывает признать и воздать Богу принадлежащую Ему силу. Выбранный вариант не создаёт впечатления, будто Бог получает недостающую Ему силу от людей.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным поэтическим строем. Инверсия «Его величие — над Израилем» сохраняет параллелизм и торжественный ритм, не прибегая к архаизмам.
