lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Это божественный титул «Владыка, Господь», а не тетраграмматон; традиционное и естественное русское соответствие — «Господь».
- source_word: יִתֶּן
  choice: даёт
  rationale: Форма yiqtol допускает настоящее, будущее или модальное значение. В поэтическом контексте настоящее время естественно передаёт разворачивающееся или обобщённое действие, не исключая иных временных оттенков.
- source_word: אֹמֶר
  choice: слово
  rationale: Существительное означает произнесённое слово, изречение, весть или повеление. «Слово» сохраняет краткость и широту еврейского выражения; другие оттенки указаны в сноске.
- source_word: הַמְבַשְּׂרוֹת
  choice: женщин, возвещающих благую весть
  rationale: Причастие стоит во множественном числе женского рода и образовано от глагола «приносить/возвещать добрую весть». Перевод явно сохраняет женский род и смысл благой вести.
- source_word: צָבָא רָב
  choice: великое множество
  rationale: צָבָא может обозначать войско, воинство или многочисленное собрание, а רָב указывает на величину или многочисленность. В основном тексте выбран естественный коллективный оборот; возможная военная образность сохранена в сноске.
theological_decisions:
- issue: Женский род причастия הַמְבַשְּׂרוֹת
  choice: 'Передать явно: «женщин, возвещающих благую весть»'
  alternative: «вестников» или «возвещающих» без указания пола
  rationale: Женский род грамматически выражен в еврейском тексте и является значимой литературной деталью; его нейтрализация была бы неоправданной.
- issue: Характер данного Господом אֹמֶר
  choice: Сохранить широкое значение словом «слово»
  alternative: «весть» или «повеление»
  rationale: Контекст допускает как сообщаемую весть, так и властное повеление; основной перевод не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим строем. Инверсия «женщин… — великое множество» естественна для возвышенной поэзии и точно выражает значение «таких женщин очень много», сохраняя явный женский род. Военная окраска צָבָא не навязана основному тексту, но отмечена в сноске.
