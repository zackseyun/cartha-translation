id: PSA.68.21
reference: Psalms 68:21
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַךְ אֱלֹהִ֗ים יִמְחַץ֮ רֹ֤אשׁ אֹ֫יְבָ֥י/ו קָדְקֹ֥ד שֵׂעָ֑ר מִ֝תְהַלֵּ֗ךְ בַּ/אֲשָׁמָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/021.yaml
  text: Surely God will crush the head of his enemies[a], the hairy crown of the one who walks in his guilt.
translation:
  language: ru
  text: Воистину, Бог сокрушит голову Своих врагов — волосатое темя того, кто ходит в своих преступлениях.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покрытый волосами череп того, кто продолжает жить в своей вине».'
    reason: 'Лексическая неоднозначность: קָדְקֹד может обозначать темя или череп, מִתְהַלֵּךְ — продолжительное поведение, а בַּאֲשָׁמָיו — виновные проступки либо состояние вины.'
lexical_decisions:
- source_word: אַךְ
  choice: Воистину
  rationale: Частица выражает усиленное утверждение и уверенность, а не ограничение «только»; «воистину» передаёт торжественный поэтический регистр.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: При морфологически множественной форме сказуемое стоит в единственном числе, а контекст указывает на Бога Израиля.
- source_word: יִמְחַץ
  choice: сокрушит
  rationale: Глагол обозначает сильный удар, раздробление или сокрушение; выбранное слово сохраняет резкость образа суда.
- source_word: רֹאשׁ
  choice: голову
  rationale: Сохранён конкретный телесный образ; единственное число в еврейском тексте передано без сглаживания, хотя «враги» стоит во множественном числе.
- source_word: אֹיְבָיו
  choice: Своих врагов
  rationale: Суффикс 3-го лица мужского рода единственного числа естественнее всего относится к Богу, непосредственному подлежащему; русское «Своих» ясно выражает эту связь.
- source_word: קָדְקֹד שֵׂעָר
  choice: волосатое темя
  rationale: קָדְקֹד — верх головы, темя; שֵׂעָר описывает его как покрытое волосами. Компактный и намеренно резкий образ сохранён.
- source_word: מִתְהַלֵּךְ
  choice: того, кто ходит
  rationale: Причастие породы hitpael передаёт продолжающийся или привычный образ действий; сохранена библейская метафора хождения как поведения.
- source_word: בַּאֲשָׁמָיו
  choice: в своих преступлениях
  rationale: Форма допускает понимание виновных проступков; в сочетании с причастием движения речь естественно воспринимается как упорное виновное поведение, а не лишь отвлечённое состояние вины.
theological_decisions:
- issue: К кому относится местоименный суффикс в «его врагов»
  choice: Передано как «Своих врагов», то есть врагов Бога.
  alternative: Враги Божьего царя или Божьего народа в более широком контексте.
  rationale: Непосредственное подлежащее — Бог, и глагол при нём стоит в единственном числе; более узкий мессианский или национальный референт самим стихом не задан.
- issue: Значение בַּאֲשָׁמָיו
  choice: «в своих преступлениях» — виновные поступки как привычный путь.
  alternative: «в своей вине» или «в своих винах».
  rationale: Лексема охватывает как вину, так и виновный проступок; связь с причастием «ходит» поддерживает поведенческий смысл, но вариант с состоянием вины отмечен в сноске.
translation_notes:
  register: Современный литературный русский с торжественной поэтической окраской. Сохранены параллельные телесные образы «голова — темя», резкость суда и метафора нравственного «хождения»; тире показывает пояснительное соответствие второй строки первой.
