  text: אֲבִ֣י יְ֭תוֹמִים וְ/דַיַּ֣ן אַלְמָנ֑וֹת אֱ֝לֹהִ֗ים בִּ/מְע֥וֹן קָדְשֽׁ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/005.yaml
  text: God is a father of the fatherless and a judge of widows in his holy dwelling[a][b][c].
translation:
  language: ru
  text: Отец сирот и судья вдов — Бог в Своём святом жилище[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «защитник вдов»; еврейское слово буквально обозначает того, кто судит или вершит правосудие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из Своего святого жилища»; некоторые понимают эти слова как указание на место, откуда действует Бог, хотя еврейский предлог буквально означает «в».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבִי יְתוֹמִים
  choice: Отец сирот
  rationale: Конструктивное сочетание буквально обозначает «отец сирот». Русское «сирот» естественно и охватывает детей, лишённых отцовской защиты; отдельная сноска с вариантом не требуется.
- source_word: דַיַּן אַלְמָנוֹת
  choice: судья вдов
  rationale: דַיַּן обозначает судью, то есть того, кто судит и вершит правосудие. Прямой перевод сохраняет юридический образ; защитный смысл указан как допустимый контекстуальный вариант.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма имеет здесь единственное значение и является подлежащим безглагольного предложения.
- source_word: בִּמְעוֹן קָדְשׁוֹ
  choice: в Своём святом жилище
  rationale: Предлог בְּ имеет обычное местное значение «в», מָעוֹן означает жилище или обитель, а קָדְשׁוֹ — буквально «Его святость» в сочетании, естественно передаваемом прилагательным «святом».
theological_decisions:
- issue: Передавать ли דַיַּן защитным термином
  choice: судья вдов
  alternative: защитник вдов
  rationale: «Судья» сохраняет прямое юридическое значение слова и напряжение образа Бога как вершителя справедливости; «защитник» яснее выражает следствие этой роли, но является более толковательным.
- issue: Понимать ли בִּמְעוֹן как место пребывания или исходную точку действия
  choice: в Своём святом жилище
  alternative: из Своего святого жилища
  rationale: Еврейский предлог прямо означает «в». Вариант «из» возможен как смысловое истолкование того, откуда Бог действует, но не должен подменять основное местное выражение.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической строки. Инверсия сохраняет именную структуру еврейского текста и ставит определения Бога в фокус. Местоимение «Своём» устраняет по-русски возможную неясность принадлежности и написано с прописной буквы согласно принятому благоговейному издательскому регистру.
