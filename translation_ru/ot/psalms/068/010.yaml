    reason: alternative_reading
lexical_decisions:
- source_word: חַיָּתְךָ
  choice: Твои живые существа
  rationale: Буквально передаёт широкий смысл существительного חיה и не сужает его до «стада». Поскольку в контексте возможен собирательный смысл — община или народ Бога, неоднозначность отмечена в сноске.
- source_word: יָשְׁבוּ בָהּ
  choice: поселились в ней
  rationale: ישב означает «сидеть, жить, обитать, поселяться»; здесь речь идёт о пребывании в ранее упомянутой земле, на которую указывает суффикс женского рода.
- source_word: תָּכִין
  choice: Ты позаботился
  rationale: Каузативная форма כון означает «приготовить, устроить, обеспечить». При дополнении «для бедного» естественное русское выражение «позаботился о» передаёт идею Божьего обеспечения.
- source_word: בְּטוֹבָתְךָ
  choice: по Своей благости
  rationale: טובה может означать благость, добро или щедрость; оборот сохраняет связь действия с Божьей благостью и естественно передаёт предлог ב.
- source_word: לֶעָנִי
  choice: о бедном
  rationale: עני охватывает значения «бедный, нуждающийся, угнетённый». Единственное число оригинала сохранено; управление изменено в соответствии с русским глаголом «позаботиться».
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма передана как прямое обращение в конце поэтической строки.
theological_decisions:
- issue: Неясное значение חַיָּתְךָ в поэтическом контексте
  choice: «Твои живые существа» с указанием альтернатив в сноске
  alternative: «Твоя община», «Твой народ», «Твоё стадо»
  rationale: Еврейское слово буквально связано с живым существом, но может употребляться собирательно. Основной текст сохраняет широкий лексический смысл, а сноска не позволяет скрыть вероятную отсылку к Божьему народу.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции; синтаксис остаётся ясным для обычного читателя.
