lexical_decisions:
- source_word: יֶאֱתָיוּ
  choice: придут
  rationale: Форма Qal, имперфект 3-го лица множественного числа, в данном контексте естественно означает приход или прибытие; значение принесения дани не выражено самим глаголом.
- source_word: חַשְׁמַנִּים
  choice: вельможи
  rationale: Редкое существительное, вероятно обозначающее знатных, высокопоставленных людей. «Вельможи» сохраняет этот смысл, не уточняя без достаточных оснований их дипломатическую или царскую роль.
- source_word: מִנִּי מִצְרָיִם
  choice: из Египта
  rationale: Предлог указывает на место происхождения; это естественное выражение в современном русском языке.
- source_word: כּוּשׁ
  choice: Куш
  rationale: Сохранён древнееврейский топоним, а не подставлено более позднее и не вполне тождественное географическое название «Эфиопия».
- source_word: תָּרִיץ
  choice: поспешит простереть
  rationale: Порода Hiphil глагола רוץ передаёт стремительность или побуждение к быстрому движению. В сочетании с руками по-русски естественно передать действие как поспешное простирание рук.
- source_word: יָדָיו
  choice: руки
  rationale: Местоименный суффикс мужского рода единственного числа согласуется с олицетворённым Кушем. В русском возвратное отношение ясно из конструкции с подлежащим, поэтому притяжательное слово можно не выражать явно.
- source_word: לֵאלֹהִים
  choice: к Богу
  rationale: Предлог обозначает направленность жеста к Богу; «к Богу» естественно передаёт её по-русски.
theological_decisions:
- issue: Значение простирания рук Кушем к Богу
  choice: Сохранён открытый образ обращения к Богу — в покорности, молитве или поклонении — без уточнения конкретного смысла жеста.
  alternative: Понять жест исключительно как принесение дани либо как однозначное указание на полное вступление в завет.
  rationale: Оборот допускает значения молитвы, мольбы, покорности и поклонения, но сам стих не определяет точный характер жеста. Перевод не сужает эту богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной псалмовой интонацией. «Простереть руки» сохраняет возвышенный характер жеста и остаётся ясным обычному читателю; редкость исходного слова отмечена в сноске.
