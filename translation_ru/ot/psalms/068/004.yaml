  text: שִׁ֤ירוּ לֵֽ/אלֹהִים֮ זַמְּר֪וּ שְׁ֫מ֥/וֹ סֹ֡לּוּ לָ/רֹכֵ֣ב בָּ֭/עֲרָבוֹת בְּ/יָ֥הּ שְׁמ֗/וֹ וְ/עִלְז֥וּ לְ/פָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/004.yaml
  text: Sing to God[a]; sing praise to his name. Lift up a song for the one who rides through the deserts; Yah is his name[b]; exult before him.
translation:
  language: ru
  text: 'Пойте Богу, воспевайте имя Его!

    Проложите путь Тому, Кто едет по пустынным равнинам[a].

    Ях — имя Его[b]; ликуйте пред Ним!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Тому, Кто едет на облаках». Обычно еврейское слово означает степи или пустынные равнины, но здесь его иногда понимают как теофанический образ облаков.'
    reason: lexical_alternative
  - marker: b
    text: Ях — краткая форма личного имени Бога.
    reason: name_clarification
lexical_decisions:
- source_word: שִׁירוּ לֵאלֹהִים
  choice: Пойте Богу
  rationale: Прямое повеление во множественном числе; אֱלֹהִים в контексте обозначает Бога Израиля.
- source_word: זַמְּרוּ שְׁמוֹ
  choice: воспевайте имя Его
  rationale: זמר обозначает хвалебное пение или музицирование; «воспевайте» естественно передаёт возвышенный поэтический призыв и сохраняет объект «имя Его».
- source_word: סֹלּוּ
  choice: проложите путь
  rationale: Основное значение סלל здесь связано с устройством или подготовкой дороги. Такой перевод сохраняет конкретный образ исходного текста, не заменяя его предположительным «вознесите песнь».
- source_word: לָרֹכֵב
  choice: Тому, Кто едет
  rationale: Причастие רֹכֵב передано описательно, как божественный эпитет, без уточнения средства передвижения, которого в тексте нет.
- source_word: בָּעֲרָבוֹת
  choice: по пустынным равнинам
  rationale: עֲרָבוֹת обычно означает степи, пустынные равнины или безлюдные пространства; формулировка передаёт как открытый ландшафт, так и пустынный характер местности.
- source_word: בְּיָהּ שְׁמוֹ
  choice: Ях — имя Его
  rationale: יָהּ — краткая форма личного имени Бога; она транслитерирована, а синтаксически выделенное именование сохранено.
- source_word: וְעִלְזוּ לְפָנָיו
  choice: ликуйте пред Ним
  rationale: עלז выражает бурную, торжествующую радость; «ликуйте» точно передаёт силу повеления, а «пред Ним» сохраняет возвышенный регистр.
theological_decisions:
- issue: Передача краткой формы божественного имени יָהּ
  choice: Ях
  alternative: Господь
  rationale: Исходный текст употребляет именно краткую форму личного имени, а не титул. Транслитерация сохраняет различие, присутствующее в еврейском тексте.
- issue: Образ בָּעֲרָבוֹת
  choice: по пустынным равнинам
  alternative: на облаках
  rationale: Обычное лексическое значение עֲרָבוֹת связано со степями или пустынными равнинами. Теофаническое понимание «облака» возможно по контексту и древней ближневосточной образности, но не должно молча вытеснять более прямое значение; оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим ритмом. Сохранены параллельные повеления и конкретный образ приготовления пути; местоимения, относящиеся к Богу, оформлены с прописной буквы в соответствии с традиционным русским библейским регистром.
