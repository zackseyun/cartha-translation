  text: נ֤וֹרָ֥א אֱלֹהִ֗ים מִֽ/מִּקְדָּ֫שֶׁ֥י/ךָ אֵ֤ל יִשְׂרָאֵ֗ל ה֤וּא נֹתֵ֨ן עֹ֖ז וְ/תַעֲצֻמ֥וֹת לָ/עָ֗ם בָּר֥וּךְ אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/035.yaml
  text: Awesome is God from your sanctuaries; the God of Israel—he gives strength and mighty power to the people[a]. Blessed be God!
translation:
  language: ru
  text: Грозен Бог из Твоих святилищ[a]; Бог Израиля — Он даёт силу и мощь народу. Благословен Бог!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Твоего святилища»; возможно также: «в Твоём святилище». В еврейском тексте буквально стоит форма множественного числа «из Твоих святилищ», которая может обозначать святое жилище Бога в собирательном или возвышенном смысле.'
    reason: alternative_reading
lexical_decisions:
- source_word: נוֹרָא
  choice: Грозен
  rationale: Передаёт внушаемые Богом трепет и благоговейный страх, сохраняя краткую предикативную форму еврейского текста.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма грамматически множественного числа здесь обозначает единого Бога Израиля.
- source_word: מִמִּקְדָּשֶׁיךָ
  choice: из Твоих святилищ
  rationale: Сохранены предлог «из» и морфологическое множественное число с суффиксом второго лица единственного числа; возможный собирательный или величественный смысл пояснён в сноске.
- source_word: אֵל יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Именное приложение отождествляет упомянутого Бога с Богом Израиля; обращение «о Боже Израиля» грамматически не требуется.
- source_word: הוּא
  choice: Он
  rationale: Явное местоимение сохранено, чтобы передать эмфатическое подлежащее.
- source_word: נֹתֵן
  choice: даёт
  rationale: Причастие выражает постоянное, характерное действие; настоящее время естественно передаёт этот смысл.
- source_word: עֹז
  choice: силу
  rationale: Обычное значение существительного — сила или могущество; «сила» ясно отличается от следующего усилительного понятия.
- source_word: וְתַעֲצֻמוֹת
  choice: и мощь
  rationale: «Мощь» передаёт интенсивное могущество и сохраняет два параллельных, но не полностью тождественных понятия без неестественного русского нагромождения.
- source_word: לָעָם
  choice: народу
  rationale: В еврейском тексте нет притяжательного местоимения «Своему»; определённая форма передана дательным падежом существительного.
- source_word: בָּרוּךְ
  choice: Благословен
  rationale: Естественная русская форма славословия, сохраняющая краткость и восклицательный характер заключения.
theological_decisions:
- issue: Число и смысл слова «святилища»
  choice: из Твоих святилищ
  alternative: из Твоего святилища; в Твоём святилище
  rationale: Масоретский текст морфологически содержит множественное число, поэтому оно сохранено в основном тексте. Возможное понимание формы как обозначения единого святого жилища Бога и более свободное понимание предлога не исключены, а указаны в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем славословия. Синтаксис сохраняет поэтическую напряжённость оригинала, а тире выделяет явное местоимение הוּא. Традиционное уважительное написание местоимений, относящихся к Богу, с прописной буквы поддерживает достоинство библейского регистра.
