- source_word: סוֹרֲרִים
  choice: непокорные
  rationale: Причастие от סרר обозначает упорно противящихся или мятежных; «непокорные» сохраняет нравственный смысл без излишней политической окраски слова «мятежники».
- source_word: שָׁכְנוּ
  choice: обитают
  rationale: Перфект от שכן в поэтическом обобщении может передаваться русским настоящим временем; «обитают» соответствует образному регистру.
- source_word: צְחִיחָה
  choice: в земле иссохшей
  rationale: Существительное обозначает сухую, выжженную местность; поэтическая конструкция «земля иссохшая» сохраняет краткость и образность оригинала.
theological_decisions:
- issue: Характер Божьего действия по отношению к одиноким
  choice: Бог даёт изолированным людям устойчивое место жительства и принадлежность к дому.
  alternative: Бог вводит одиноких именно в семьи.
  rationale: В еврейском тексте сказано «одинокие» и «дом». Перевод «в доме» сохраняет исходный образ и допускаемую идею домашней общности, но не ограничивает его биологической семьёй.
- issue: Результат освобождения узников
  choice: Они выводятся к благополучию.
  alternative: Они выходят в изобилие или с радостным пением.
  rationale: Редкое בַּכּוֹשָׁרוֹת допускает несколько толкований. Основной текст следует вероятному значению благоприятного, преуспевающего состояния, а подлинная лексическая неопределённость сохраняется в сноске.
