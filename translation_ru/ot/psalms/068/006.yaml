  rationale: Слово обозначает людей, находящихся в одиночестве или изоляции; «одиноких» ясно и естественно передаёт этот смысл по-русски.
- source_word: בַּיְתָה
  choice: в доме
  rationale: Форма с направительным ה буквально указывает движение «в дом»; при глаголе «поселяет» русское «в доме» естественно выражает итоговое место проживания, не сужая образ до биологической семьи.
- source_word: מוֹצִיא
  choice: выводит
  rationale: Причастие породы hифиль от יצא означает «заставляет выйти, выводит» и сохраняет параллель с первым действием Бога.
- source_word: אֲסִירִים
  choice: узников
  rationale: Слово обозначает связанных или заключённых; «узники» подходит возвышенному поэтическому регистру и остаётся понятным.
- source_word: בַּכּוֹשָׁרוֹת
  choice: к благополучию
  rationale: Редкая и спорная форма, вероятно, связана с преуспеванием, достатком или благоприятным состоянием. «К благополучию» передаёт положительный результат освобождения; иные возможные смыслы отмечены в сноске.
- source_word: אַךְ
  choice: а
