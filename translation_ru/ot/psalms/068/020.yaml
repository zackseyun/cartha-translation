lexical_decisions:
- source_word: הָאֵל לָנוּ אֵל
  choice: Бог для нас — Бог
  rationale: Сохранён подчёркнутый повтор אֵל и предикативное построение еврейского текста; «для нас» естественно передаёт отношение и благодеяние, выраженные לָנוּ.
- source_word: לְמוֹשָׁעוֹת
  choice: спасений
  rationale: 'Множественное число сохранено как значимое: оно может указывать на многократные или многообразные избавления.'
- source_word: וְלֵיהוִה אֲדֹנָי
  choice: у Господа Яхве
  rationale: Конструкция с ל передаёт принадлежность; אֲדֹנָי переведено как «Господь», а имя יהוה — как «Яхве», так что оба элемента исходного текста сохранены.
- source_word: לַמָּוֶת תּוֹצָאוֹת
  choice: выходы от смерти
  rationale: תּוֹצָאוֹת буквально означает «выходы»; сочетание с לַמָּוֶת по контексту обозначает пути избавления от смерти. Формулировка сохраняет образ и множественное число.
theological_decisions:
- issue: Передача сочетания יהוה אֲדֹנָי
  choice: Господь Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Переданы и титул אֲדֹנָי, и личное имя יהוה без их слияния; порядок адаптирован к естественному русскому сочетанию.
- issue: Значение множественного числа מוֹשָׁעוֹת
  choice: спасений
  alternative: избавлений; спасение
  rationale: Не устранено подлинное множественное число, допускающее смысл многократных или многообразных актов спасения.
- issue: Образ תּוֹצָאוֹת применительно к смерти
  choice: выходы от смерти
  alternative: избавление от смерти; пути спасения от смерти
  rationale: Сохранена метафора «выходов», не сводящая выражение к единственному догматически уточнённому способу избавления.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Необычные множественные формы «спасений» и «выходы» намеренно сохранены ради образности и смысловых оттенков еврейского текста; пояснения даны в сносках.
