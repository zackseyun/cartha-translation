  text: גְּעַ֨ר חַיַּ֪ת קָנֶ֡ה עֲדַ֤ת אַבִּירִ֨ים בְּ/עֶגְלֵ֬י עַמִּ֗ים מִתְרַפֵּ֥ס בְּ/רַצֵּי כָ֑סֶף בִּזַּ֥ר עַ֝מִּ֗ים קְרָב֥וֹת יֶחְפָּֽצוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/030.yaml
  text: Rebuke the beast of the reeds[a], the herd of bulls among the calves of the peoples, trampling on pieces of silver[b]. Scatter the peoples who delight in wars.
translation:
  language: ru
  text: Обуздай зверя среди тростника[a], стадо быков среди телят народов, попирающее куски серебра[b]. Рассей народы, любящие войны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дикого зверя среди тростника»; возможно, это образ Египта или другой враждебной державы.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст этой части стиха труден. Возможен также смысл: «унижаться ради кусков серебра» или «падать ниц с серебряными слитками», то есть приносить дань.'
    reason: alternative_reading
lexical_decisions:
- source_word: גְּעַר
  choice: Укроти
  rationale: Императив גער означает властный окрик или обличение, которое обуздывает враждебную силу. «Укроти» естественно передаёт подразумеваемый результат Божьего грозного окрика, не усиливая его до уничтожения.
- source_word: חַיַּת קָנֶה
  choice: зверя в тростниках
  rationale: Сохранён буквальный образ опасного зверя, обитающего в тростниках; вероятная метафора враждебной державы не раскрывается в основном тексте.
- source_word: עֲדַת אַבִּירִים
  choice: стадо быков
  rationale: На фоне продолжающегося животного образа אַבִּירִים естественно понимать как сильных быков, а עֲדָה — как их стадо.
- source_word: בְּעֶגְלֵי עַמִּים
  choice: среди телят народов
  rationale: Предлог ב понят локально, а עֶגְלֵי передано как «телята»; выражение сохраняет образ более слабых или подчинённых правителей и народов.
- source_word: מִתְרַפֵּס
  choice: попирающее
  rationale: Форма спорна. В основном тексте выбрано значение враждебного попрания, соответствующее образу зверя и последующему упоминанию любящих войну народов; чтение о покорности вынесено в примечание.
- source_word: בְּרַצֵּי כָסֶף
  choice: куски серебра
  rationale: Редкое רַצֵּי не позволяет уверенно уточнить форму серебра; нейтральное «куски» сохраняет вещественно-экономический образ.
- source_word: בִּזַּר
  choice: Рассей
  rationale: Хотя форма огласована как перфект, в поэтической последовательности она естественно воспринимается как продолжение молитвенного повеления.
- source_word: קְרָבוֹת יֶחְפָּצוּ
  choice: которые находят удовольствие в войнах
  rationale: Передаёт устойчивое стремление к войне и нравственную окраску глагола חפץ, не сужая множественное קְרָבוֹת до одной битвы.
theological_decisions:
- issue: Следует ли прямо отождествить «зверя в тростниках» с Египтом
  choice: Сохранить метафору без прямого исторического отождествления
  alternative: Назвать Египет или обобщённую враждебную державу
  rationale: Тростниково-болотный образ может намекать на Египет, однако сам стих державу не называет; перевод не должен делать вероятную аллюзию однозначной.
- issue: Описывает ли מִתְרַפֵּס попрание или покорность с серебряной данью
  choice: В основном тексте передать враждебное попрание
  alternative: «унижающееся с серебром» или «падающее ниц с серебряными слитками», то есть приносящее дань
  rationale: Контекст враждебных зверей и народов, любящих войны, поддерживает значение попрания, но еврейская форма и вся конструкция трудны, поэтому существенное альтернативное понимание сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Сохранены параллелизм, животная метафорика и подлинная неоднозначность трудной серебряной фразы; синтаксис сделан ясным для обычного читателя.
