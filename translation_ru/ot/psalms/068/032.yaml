lexical_decisions:
- source_word: מַמְלְכוֹת הָאָרֶץ
  choice: Царства земли
  rationale: Сочетание обозначает политические царства по всей земле и передаёт всеобщий охват призыва.
- source_word: שִׁירוּ לֵאלֹהִים
  choice: пойте Богу
  rationale: Форма множественного числа повелительного наклонения обращена к царствам; предлог ל указывает адресата пения.
- source_word: זַמְּרוּ
  choice: воспевайте
  rationale: Порода пиэль глагола זמר выражает музыкальное прославление; «воспевайте» естественно и достойно передаёт этот оттенок, не ограничивая действие только инструментальной музыкой.
- source_word: אֲדֹנָי
  choice: Господа
  rationale: Переведён божественный титул Адонай, а не тетраграмматон; форма винительного падежа обусловлена русским управлением глагола «воспевать».
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение литургического или музыкального термина неясно, поэтому он передан традиционной транслитерацией без истолкования.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господа
  alternative: Владыку
  rationale: В еврейском тексте стоит титул אֲדֹנָי, а не имя יהוה. «Господь» является обычной русской передачей этого титула; написание не имитирует специальное оформление тетраграмматона.
- issue: Характер действия, выраженного זמר
  choice: воспевайте
  alternative: играйте
  rationale: Глагол допускает музыкальное прославление и может включать игру на инструментах, но контекст не требует исключать пение. Основной текст сохраняет более широкое значение, а инструментальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным призывом. Параллелизм двух повелений сохранён; неясный термин «Села» оставлен без поясняющей подстановки. Маркер сноски помещён после слова, к которому относится лексическая альтернатива.
