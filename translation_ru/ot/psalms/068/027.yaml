  text: שָׁ֤ם בִּנְיָמִ֨ן צָעִ֡יר רֹדֵ֗/ם שָׂרֵ֣י יְ֭הוּדָה רִגְמָתָ֑/ם שָׂרֵ֥י זְ֝בֻל֗וּן שָׂרֵ֥י נַפְתָּלִֽי׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/068/027.yaml
  text: There is little Benjamin[a], leading them; the princes of Judah in their throng; the princes of Zebulun[b]; the princes of Naphtali.
translation:
  language: ru
  text: Там — малый Вениамин, ведущий их[a], князья Иуды со своим сонмом[b], князья Завулона, князья Неффалима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «властвующий над ними», «управляющий ими». Еврейское причастие может обозначать власть или первенство; здесь оно понято как предводительство в шествии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «со своим множеством», «со своей толпой». Редкое еврейское слово имеет не вполне ясное значение, но, вероятно, обозначает собравшуюся группу, сопровождающую князей Иуды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁם
  choice: Там
  rationale: Наречие места сохранено в краткой поэтической форме и указывает на участников описанного шествия.
- source_word: בִּנְיָמִן צָעִיר
  choice: малый Вениамин
  rationale: צָעִיר может означать «малый», «младший» или «небольшой»; «малый» сохраняет сжатость и возможный намёк как на младшинство Вениамина, так и на малочисленность колена.
- source_word: רֹדֵם
  choice: ведущий их
  rationale: Причастие с местоименным суффиксом буквально допускает значение владычества или управления; в контексте торжественного шествия «ведущий их» естественно передаёт первенство, не устраняя иной возможный смысл.
- source_word: שָׂרֵי
  choice: князья
  rationale: Слово обозначает правителей, начальников или знатных предводителей; «князья» соответствует возвышенному поэтическому регистру.
- source_word: רִגְמָתָם
  choice: со своим сонмом
  rationale: Редкое и неясное слово, вероятно, обозначает собранную группу, множество или толпу. «Сонм» кратко передаёт коллективность и соответствует поэтическому регистру.
- source_word: יְהוּדָה / זְבֻלוּן / נַפְתָּלִי
  choice: Иуда / Завулон / Неффалим
  rationale: Употреблены закрепившиеся в русской библейской традиции формы названий колен.
theological_decisions:
- issue: 'Значение רֹדֵם: руководство в шествии или владычество'
  choice: ведущий их
  alternative: властвующий над ними
  rationale: Контекст перечисляет участников торжественного шествия, поэтому значение предводительства вероятно; однако управленческий оттенок еврейского слова сохранён в сноске.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической окраской. Синтаксическая краткость и перечислительный ритм еврейского стиха сохранены; редкие слова «князья» и «сонм» понятны в библейско-поэтическом контексте и не делают текст архаичным в целом.
