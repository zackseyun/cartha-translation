  text: גַּם צִפּ֨וֹר מָ֪צְאָה בַ֡יִת וּ/דְר֤וֹר קֵ֥ן לָ/הּ֮ אֲשֶׁר שָׁ֪תָה אֶפְרֹ֫חֶ֥י/הָ אֶֽת מִ֭זְבְּחוֹתֶי/ךָ יְהוָ֣ה צְבָא֑וֹת מַ֝לְכִּ֗/י וֵ/אלֹהָֽ/י־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/003.yaml
  text: Even the sparrow has found a home[a], and the swallow a nest for herself, where she may lay her young—at your altars, O Yahweh of Armies[c][b], my King and my God.
translation:
  language: ru
  text: 'Даже воробей нашёл себе дом,

    и ласточка — гнездо,

    где она устроила своих птенцов,

    у Твоих жертвенников[a],

    Яхве Воинств[b],

    Царь мой и Бог мой!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на Твоих жертвенниках»; возможно также: «возле Твоих жертвенников». Еврейская конструкция очень сжата и может обозначать как непосредственное место, так и близость к жертвенникам.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционно: «Господь Саваоф»; также возможно: «Яхве Сил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Даже
  rationale: 'Передаёт эмфатическое включение: даже малые птицы обретают место при святилище Бога.'
- source_word: צִפּוֹר
  choice: воробей
  rationale: Слово может означать небольшую птицу вообще, но традиционное «воробей» лексически допустимо и образует естественную пару с ласточкой.
- source_word: מָצְאָה בַיִת
  choice: нашёл себе дом
  rationale: Передаёт совершённое действие и идиоматический смысл обретённого жилища; род согласован с русским словом «воробей».
- source_word: דְרוֹר
  choice: ласточка
  rationale: Наиболее привычное и лексически обоснованное обозначение этой птицы в данном контексте.
- source_word: קֵן לָהּ
  choice: гнездо
  rationale: Русская конструкция естественно выражает место, обретённое птицей для себя; повтор местоимения не требуется.
- source_word: אֲשֶׁר שָׁתָה אֶפְרֹחֶיהָ
  choice: где положила птенцов своих
  rationale: Сохраняет совершенный вид еврейского перфекта и широкое значение глагола «класть, помещать», не сужая его до откладывания яиц.
- source_word: אֶת מִזְבְּחוֹתֶיךָ
  choice: у Твоих жертвенников
  rationale: Компактная еврейская конструкция после «положила» допускает понимание близости к жертвенникам; «у» избегает маловероятного образа гнезда непосредственно на жертвенниках.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет укоренившуюся возвышенную форму божественного титула и широту образа организованных небесных или земных сил.
- source_word: מַלְכִּי וֵאלֹהָי
  choice: Царь мой и Бог мой
  rationale: Сохраняет прямое личное обращение и поэтический порядок определений.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя; «Яхве» прямо передаёт тетраграмматон и не подменяет его титулом.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Яхве Сил; Господь Саваоф
  rationale: «Воинств» сохраняет буквальный воинский и царственный оттенок צְבָאוֹת, не ограничивая его только человеческими армиями.
- issue: Связь птиц с жертвенниками
  choice: у Твоих жертвенников
  alternative: на Твоих жертвенниках; Твои жертвенники
  rationale: Смысловая близость к святилищу вероятнее буквального размещения птенцов на жертвенниках, однако компактность еврейской конструкции сохраняет неоднозначность, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным поэтическим звучанием. Инверсия «птенцов своих» и формула «Царь мой и Бог мой» сохраняют достоинство псалма, оставаясь понятными современному читателю.
