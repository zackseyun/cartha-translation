base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/009.yaml
  text: Look on our shield[a], O God[b], and look on the face of your anointed.
translation:
  language: ru
  text: Боже, взгляни на наш щит[a] и посмотри на лицо твоего помазанника[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нашего защитника». В еврейском тексте буквально «наш щит»; этот поэтический образ может обозначать либо Бога как защитника, либо царя.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово означает «помазанный» и имеет тот же корень, что и слово «Мессия». Здесь оно, вероятнее всего, прежде всего относится к царю из дома Давида, но может иметь и более широкое мессианское звучание.
    reason: alternative_reading
lexical_decisions:
- source_word: מָגִנֵּנוּ
  choice: наш щит
  rationale: Сохраняет конкретный поэтический образ еврейского текста и не решает преждевременно, обозначает ли он царя или Бога как защитника.
- source_word: רְאֵה
  choice: взгляни
  rationale: Императив выражает просьбу обратить благосклонное внимание, а не просто увидеть.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Русская звательная форма естественно передаёт прямое молитвенное обращение.
- source_word: וְהַבֵּט
  choice: посмотри
  rationale: Передаёт направленный, внимательный взгляд и сохраняет параллелизм двух повелительных глаголов без искусственной архаизации.
- source_word: פְּנֵי
  choice: в лицо
  rationale: Сохраняет буквальный образ лица; сочетание с глаголом «посмотри» естественно для современного русского языка.
- source_word: מְשִׁיחֶךָ
  choice: Твоего помазанника
  rationale: Передаёт значение «помазанный» без превращения контекстуального титула царя в однозначное собственное имя «Мессия».
theological_decisions:
- issue: Кого обозначает «наш щит»
  choice: Метафора «наш щит» сохранена без уточнения референта.
  alternative: Явно истолковать как Бога-защитника или как помазанного царя.
  rationale: Еврейский текст допускает оба понимания; сохранение образа удерживает намеренную поэтическую и богословскую напряжённость.
- issue: Кого обозначает «Твой помазанник»
  choice: Строчное нарицательное «помазанник» в основном тексте.
  alternative: «Твой Мессия».
  rationale: В непосредственном контексте прежде всего подразумевается помазанный царь из дома Давида; мессианская связь реальна, но не должна подменять исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Порядок обращения слегка перестроен ради естественности русского синтаксиса; параллелизм двух просьб и исходные образы сохранены.
