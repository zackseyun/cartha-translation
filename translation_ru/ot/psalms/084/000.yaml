  text: 'For the choir director: according to the Gittith[c][b][a]. A psalm of the sons of Korah.'
translation:
  language: ru
  text: Руководителю хора. На гиттит[a]. Псалом сыновей Корея[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. «гиттит»; вероятно, это обозначение мелодии, способа исполнения или музыкального инструмента, но точное значение неизвестно. Возможен перевод: «на „Гиттит“».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для сыновей Корея». Еврейский предлог в заголовках псалмов может указывать на авторство, принадлежность, связь или посвящение.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов слово обозначает руководителя музыкального исполнения; этот перевод ясен современному читателю и сохраняет культово-музыкальный контекст.
- source_word: עַל הַגִּתִּית
  choice: На гиттит
  rationale: Предлог עַל в музыкальных заголовках может указывать на мелодию, способ исполнения или инструмент. Транслитерация не приписывает неизвестному термину более точного значения, чем позволяет источник.
- source_word: לִבְנֵי קֹרַח
  choice: сыновей Корея
  rationale: Предлог לְ может указывать на авторство, принадлежность, связь или посвящение. Родительный оборот краток и сохраняет широту возможной связи.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Обычное русское обозначение данного жанра — песни, предназначенной для музыкального исполнения.
