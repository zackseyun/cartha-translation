  source_fidelity: 'Текст точно передаёт три элемента еврейского заголовка: адресацию музыкальному руководителю (לַמְנַצֵּחַ), неопределённое музыкальное обозначение с עַל и указание на сыновей Корея, за которым следует жанровая помета «псалом». Неопределённость термина «гиттит» не снимается искусственно.'
