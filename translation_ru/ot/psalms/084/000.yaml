  terminology: «Руководителю хора», «псалом» и «сыновей Корея» терминологически удачны. Транслитерация «гиттит» оправданна ввиду неустановленного значения. Сноска к b корректно сохраняет широту функции לְ; «принадлежность» и «связь» не навязывают авторство.
