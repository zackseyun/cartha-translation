source:
  edition: WLC
  text: כִּ֤י שֶׁ֨מֶשׁ וּ/מָגֵן֮ יְהוָ֪ה אֱלֹ֫הִ֥ים חֵ֣ן וְ֭/כָבוֹד יִתֵּ֣ן יְהוָ֑ה לֹ֥א יִמְנַע ט֝֗וֹב לַֽ/הֹלְכִ֥ים בְּ/תָמִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/011.yaml
  text: For Yahweh God is a sun and shield[a]; Yahweh gives favor and honor[b]. He does not withhold good from those who walk blamelessly.
translation:
  language: ru
  text: 'Ибо Яхве Бог — солнце и щит;

    Яхве дарует благоволение и честь[a].

    Он не лишает блага тех, кто ходит непорочно[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «благодать и славу».'
    reason: lexical_alternative
  - marker: b
    text: «Непорочно» здесь означает цельно и прямо, с нравственной честностью, а не совершенно безгрешно.
    reason: lexical_clarification
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего утверждения псалма; «ибо» естественно звучит в возвышенной поэтической речи.
- source_word: שֶׁמֶשׁ
  choice: солнце
  rationale: Сохранён прямой поэтический образ еврейского текста без истолковывающей замены на «свет» или «источник света».
- source_word: וּמָגֵן
  choice: и щит
  rationale: Сохранена парная метафора Божьей защиты, ясная и в современном русском языке.
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Тетраграмматон передан личным именем «Яхве», а אֱלֹהִים — приложением «Бог».
- source_word: חֵן
  choice: благоволение
  rationale: Слово обозначает благосклонность, расположение и милостивый дар; «благоволение» сохраняет широту смысла и не навязывает более позднюю специальную терминологию.
- source_word: וְכָבוֹד
  choice: и честь
  rationale: В контексте того, что Бог дарует людям, «честь» естественно передаёт даруемое достоинство; возможное «слава» отмечено в сноске.
- source_word: יִתֵּן
  choice: дарует
  rationale: Имперфект выражает характерное действие или общее утверждение; настоящее время уместно, а «дарует» соответствует возвышенному поэтическому регистру.
- source_word: לֹא יִמְנַע
  choice: не лишает
  rationale: Передаёт смысл «не удерживает, не отказывает в чём-либо» и сохраняет обобщённое настоящее время.
- source_word: טוֹב
  choice: блага
  rationale: Субстантивированное значение «добро, благо» передано компактно и естественно; форма родительного падежа обусловлена глаголом «лишать».
- source_word: לַהֹלְכִים
  choice: тех, кто ходит
  rationale: Сохранена библейская метафора хождения как образа образа жизни; она остаётся понятной современному читателю.
- source_word: בְּתָמִים
  choice: непорочно
  rationale: Передаёт цельность, честность и нравственную прямоту поведения, не утверждая абсолютной безгрешности; этот нюанс пояснён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст непосредственно употребляет тетраграмматон; форма «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Возможное понимание בְּתָמִים как абсолютной безгрешности
  choice: непорочно
  alternative: в целостности; с чистой совестью; праведно
  rationale: Сохранена сильная этическая формулировка оригинала, но сноска уточняет присущие слову значения цельности и прямоты, не снимая нравственного напряжения текста.
- issue: Значение пары חֵן וְכָבוֹד
  choice: благоволение и честь
  alternative: благодать и славу
  rationale: Оба варианта лексически возможны. Основной текст подчёркивает Божью благосклонность и даруемое достоинство, а традиционная альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Синтаксический параллелизм и образы «солнце», «щит», «ходить» сохранены. Маркеры сносок поставлены непосредственно при словах, к которым относятся; исправлена очевидная несогласованность маркеров в английском консультационном слое.
