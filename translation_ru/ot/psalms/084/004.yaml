  text: אַ֭שְׁרֵי יוֹשְׁבֵ֣י בֵיתֶ֑/ךָ ע֝֗וֹד יְֽהַלְל֥וּ/ךָ סֶּֽלָה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/004.yaml
  text: Blessed are those who dwell in your house[a]; they will still praise you[c][b]. Selah
translation:
  language: ru
  text: 'Блаженны живущие в Твоём доме[a]: они и впредь будут славить Тебя. Села[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Твой дом» здесь, вероятно, означает Божье святилище или храм.
    reason: cultural_note
  - marker: b
    text: «Села» — древнееврейский богослужебный или музыкальный термин с неясным значением; по традиции его оставляют без перевода.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блаженны
  rationale: Форма вводит поэтическое изречение о блаженстве. «Блаженны» сохраняет возвышенный богослужебный оттенок и естественно звучит в современном литературном русском.
- source_word: יוֹשְׁבֵי
  choice: живущие
  rationale: Причастие от ישׁב здесь обозначает пребывание или обитание, а не просто сидение; форма «живущие» передаёт продолжающийся характер действия.
- source_word: בֵיתֶךָ
  choice: в Твоём доме
  rationale: Сохранено буквальное «доме», не заменённое в основном тексте на более узкое «храме»; в контексте подразумевается Божье святилище.
- source_word: עוֹד
  choice: и впредь
  rationale: Наречие выражает продолжение во времени. «И впредь» сочетается с будущей формой глагола и не усиливает значение до безусловного «непрестанно».
- source_word: יְהַלְלוּךָ
  choice: будут славить Тебя
  rationale: Имперфект допускает будущее или повторяющееся действие. Русское будущее сохраняет эту направленность, а «славить» естественно передаёт הלל в контексте псалма.
- source_word: סֶּלָה
  choice: Села
  rationale: Значение древнееврейского литургического или музыкального термина неясно, поэтому он передан традиционной транслитерацией без истолковывающего перевода.
theological_decisions:
- issue: К чему относится «Твой дом»
  choice: В основном тексте сохранено «Твой дом».
  alternative: Твой храм / Твоё святилище
  rationale: Вероятно, речь идёт о Божьем святилище и служащих или пребывающих там людях, однако буквальный образ не следует без необходимости сужать до слова «храм».
- issue: Временной оттенок восхваления
  choice: «И впредь будут славить» передаёт возможное будущее продолжение действия.
  alternative: «Непрестанно славят» как привычное или постоянное действие
  rationale: Древнееврейский имперфект допускает как будущее, так и обычное действие; выбранный вариант сохраняет связь עוֹד с продолжением, не утверждая более сильного значения «непрестанно».
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным псалмическим звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции. Пунктуация подчёркивает связь между блаженством пребывающих в Божьем доме и их дальнейшей хвалой.
