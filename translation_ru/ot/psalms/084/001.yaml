  text: מַה יְּדִיד֥וֹת מִשְׁכְּנוֹתֶ֗י/ךָ יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/001.yaml
  text: How lovely are your dwelling places[a], O Yahweh of hosts!
translation:
  language: ru
  text: Как милы Твои обители[a], Яхве Воинств!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как дороги Твои жилища»; возможны также: «Как прекрасны Твои обители» или «Как любимы Твои обители».'
    reason: Лексема יְדִידוֹת может выражать милость, дороговизну, привлекательность или любовь; מִשְׁכְּנוֹת означает «обители, жилища».
lexical_decisions:
- source_word: מַה
  choice: Как
  rationale: В данном контексте вводит поэтическое восклицание, а не вопрос; русское «как» естественно передаёт эту функцию.
- source_word: יְּדִידוֹת
  choice: дороги
  rationale: Форма выражает то, что любимо, дорого и привлекательно. «Дороги» естественно сочетается с «обители» и сохраняет эмоциональную направленность стиха, не сводя смысл только к внешней красоте.
- source_word: מִשְׁכְּנוֹתֶיךָ
  choice: Твои обители
  rationale: Сохраняет множественное число и значение мест пребывания Бога; «обители» соответствует возвышенному поэтическому регистру и не ограничивает образ только скинией Моисея.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: В составе божественного титула традиционное широкое «Воинств» не сужает значение до земных армий и сохраняет поэтическую весомость.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Яхве воинств; Яхве небесных сил
  rationale: Так сохраняются личное имя и широкое значение צְבָאוֹת без уточнения, отсутствующего в исходном тексте. Заглавная буква отмечает устойчивый божественный титул.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Сохранены восклицательная форма, множественное число и обращение; местоимение при обращении к Богу написано с прописной буквы.
