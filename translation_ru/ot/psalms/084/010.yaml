    text: 'Буквально: «лучше тысячи»; после слова «тысячи» в еврейском тексте нет уточнения, например «дней» или «в другом месте».'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «Я предпочёл бы стоять у порога в доме моего Бога»; традиционный перевод: «быть привратником в доме моего Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: טוֹב
  choice: лучше
  rationale: В сочетании с сравнительным מֵאָלֶף естественное русское соответствие — сравнительная степень «лучше».
- source_word: בַּחֲצֵרֶיךָ
  choice: во дворах Твоих
  rationale: Сохраняет множественное число и конкретный образ дворов святилища; «дворы» естественно звучит в храмовом контексте.
- source_word: מֵאָלֶף
  choice: лучше тысячи
  rationale: Еврейский текст буквально говорит «чем тысяча», не уточняя «дней» или «в другом месте». В русском эллипсис понятен из первой части строки.
- source_word: בָּחַרְתִּי
  choice: я предпочёл
  rationale: Формально перфект означает «я избрал», но в данном сопоставлении выражает осознанное предпочтение; «предпочёл» передаёт это естественно.
- source_word: הִסְתּוֹפֵף
  choice: стоять у порога
  rationale: Редкий глагол указывает на пребывание у порога, вероятно в скромном положении, но сам по себе не обозначает должность привратника.
- source_word: בְּבֵית אֱלֹהַי
  choice: в доме моего Бога
  rationale: Прямо передаёт образ Божьего дома, не заменяя его более узким толкованием «храм».
- source_word: מִדּוּר
  choice: чем жить
  rationale: Инфинитив со сравнительной частицей естественно передан русской конструкцией «чем жить».
- source_word: בְּאָהֳלֵי רֶשַׁע
  choice: в шатрах нечестия
  rationale: Абстрактное רֶשַׁע передано абстрактным существительным «нечестие», сохраняя нравственную характеристику шатров, а не превращая её прямо в обозначение их обитателей.
theological_decisions:
- issue: Образы святилища
  choice: «во дворах Твоих» / «в доме моего Бога»
  alternative: «во дворах Твоих» / «в храме моего Бога»
  rationale: Перевод сохраняет конкретные и взаимосвязанные образы дворов и дома Божьего, не конкретизируя «дом» как «храм» сверх сказанного в еврейском тексте.
- issue: Положение у порога
  choice: «стоять у порога»
  alternative: «быть привратником»
  rationale: Текст подчёркивает предпочтение самого скромного места рядом с Богом, но не обязательно называет храмовую должность; поэтому традиционное «привратник» оставлено в примечании как возможное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Местоимение «Твоих» написано с прописной буквы согласно распространённой русской библейской традиции; синтаксис остаётся ясным для обычного читателя.
