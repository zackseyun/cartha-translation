base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/010.yaml
  text: For a day in your courts is better than a thousand[b][a]; I would rather stand at the threshold in the house of my God than dwell in the tents of wickedness.
translation:
  language: ru
  text: Ибо день во дворах Твоих лучше тысячи[a]. Я избрал стоять у порога в доме моего Бога[b], чем жить в шатрах нечестия.
  philosophy: optimal-equivalence
  footnotes:
