  text: יְהוָ֥ה צְבָא֑וֹת אַֽשְׁרֵ֥י אָ֝דָ֗ם בֹּטֵ֥חַ בָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/084/012.yaml
  text: O Yahweh of hosts[b][a], blessed is the man who trusts in you.
translation:
  language: ru
  text: Яхве Воинств, блажен[a] человек[b], который полагается на тебя!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «счастлив» или «благополучен».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово стоит в единственном числе, но здесь обозначает любого человека, который полагается на Яхве.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: צְבָאוֹת
  choice: Воинств
  rationale: Сохраняет образ еврейского титула «Яхве Воинств» и не сводит его к толкованию «Всемогущий».
- source_word: אַשְׁרֵי
  choice: блажен
  rationale: Естественно передаёт формулу провозглашения особого благополучия человека; варианты «счастлив» и «благополучен» возможны, но менее полно сохраняют библейский тон.
- source_word: אָדָם
  choice: человек
  rationale: Единственное число сохранено; в данном контексте слово имеет обобщающее значение и относится к любому человеку.
- source_word: בֹּטֵחַ
  choice: который полагается
  rationale: Причастие обозначает характерное, устойчивое действие. Русское «полагается» естественно сочетается с предлогом «на» и передаёт доверие.
- source_word: בָּךְ
  choice: на тебя
  rationale: Предлог ב с глаголом בטח передан естественной русской конструкцией «полагаться на кого-либо»; единственное число сохраняет прямое обращение к Яхве.
theological_decisions:
- issue: Передача титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Всемогущий
  rationale: Выбранный вариант сохраняет и личное имя, и образ воинств, не заменяя его богословским истолкованием «Всемогущий».
- issue: Обобщающее значение אָדָם
  choice: человек
  alternative: всякий
  rationale: «Человек» сохраняет форму единственного числа оригинала, а примечание поясняет, что речь идёт не только о мужчине, но о любом человеке.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной формулы блаженства. Прямое обращение передано без добавления междометия «о», которого нет в еврейском тексте. Строчная буква в местоимении «тебя» не вносит отсутствующего в оригинале графического различия.
