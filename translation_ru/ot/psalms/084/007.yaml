  text: They go from strength to strength[b][a]; each one appears before God in Zion.
translation:
  language: ru
  text: Они идут от силы к силе[a]; каждый предстаёт перед Богом на Сионе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «от отряда к отряду» или «от победы к победе»; еврейское слово может означать силу, доблесть, войско или военную мощь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «является к Богу»; в данном контексте, вероятно, имеется в виду, что каждый паломник предстаёт перед Богом для поклонения. Возможно также понимание: «каждый будет видим Богом на Сионе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: идут
  rationale: Форма Qal imperfect 3-го лица множественного числа от הלך передаёт продолжающееся движение паломников. «Идут» естественно по-русски и не уточняет без необходимости способ передвижения.
- source_word: מֵחַיִל אֶל חָיִל
  choice: от силы к силе
  rationale: 'חַיִל имеет широкий спектр значений: сила, доблесть, войско, военная мощь. В контексте паломничества выражение естественно передаёт сохранение или возрастание сил, при этом устойчивый оборот не исключает иных оттенков.'
- source_word: יֵרָאֶה
  choice: предстаёт
  rationale: Niphal imperfect 3-го лица единственного числа от ראה в контексте паломничества и поклонения может означать явиться, предстать. «Предстаёт» естественно передаёт культовый контекст, не превращая форму в явно пассивную.
- source_word: אֶל אֱלֹהִים
  choice: перед Богом
  rationale: Хотя אֶל буквально указывает направление «к», в сочетании с глаголом явления в контексте поклонения по-русски естественнее «предстать перед Богом».
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: Для русской библейской и литературной речи применительно к горе и священному месту естественно сочетание «на Сионе».
- source_word: יֵרָאֶה (единственное число при предшествующем множественном)
  choice: каждый предстаёт
  rationale: Слово «каждый» сохраняет распределительное единственное число еврейского глагола и ясно связывает его с множеством идущих паломников.
theological_decisions:
- issue: Значение явления перед Богом
  choice: Паломники предстают перед Богом на Сионе для поклонения.
  alternative: 'Форму можно понять более пассивно: «каждый будет видим Богом на Сионе».'
  rationale: В паломническом и богослужебном контексте Niphal глагола ראה обычно передаёт явление или предстояние перед Богом. Перевод сохраняет культовый смысл, не добавляя конфессиональных уточнений.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранён краткий параллельный строй стиха и традиционно узнаваемый оборот «от силы к силе»; смысл единственного числа прояснён словом «каждый».
