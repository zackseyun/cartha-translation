    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: אֱלֹהִים צְבָאוֹת
  choice: Бог Воинств
  rationale: Сохраняет широкий образ небесных сил и войск в составе божественного наименования, не сужая его до одного конкретного вида воинства.
- source_word: שִׁמְעָה תְפִלָּתִי
  choice: услышь мою молитву
  rationale: Прямая и естественная передача повелительной формы и существительного с местоименным суффиксом.
- source_word: הַאֲזִינָה
  choice: внемли
  rationale: Поэтическое, но понятное слово сохраняет усиленный призыв прислушаться и не смешивает его с предшествующим «услышь».
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Бог Иакова
  rationale: Прозрачно передаёт сочетание, указывающее на Бога в Его отношении к Иакову и Израилю.
- source_word: סֶלָה
  choice: Села
  rationale: Транслитерация сохраняет еврейский богослужебный или музыкальный термин, точное значение которого неизвестно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Форма «Яхве» передаёт его непосредственно, тогда как «Господь» является традиционной заменой, а «Иегова» — поздней гибридной формой.
- issue: Толкование термина סֶלָה
  choice: Села
  alternative: пауза; интерлюдия
  rationale: Точное значение термина остаётся спорным, поэтому перевод не закрепляет предположительное толкование.
translation_notes:
  register: Современный литературный русский с возвышенной молитвенной интонацией. Параллелизм «услышь… внемли» и трёхчастное членение стиха сохранены; архаическая формула «Господи Боже Саваоф» не использована, чтобы прямо передать имя и сделать образ понятнее.
