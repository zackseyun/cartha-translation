- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Прямое и уместное в поэтическом контексте обозначение внутреннего «я»; последующая пара «сердце и плоть» не позволяет сводить его только к физической жизни.
- source_word: לְחַצְרוֹת
  choice: дворов
  rationale: Имеются в виду дворы храмового святилища. Краткое «дворов» сохраняет образ оригинала без поясняющей вставки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: לִבִּי וּבְשָׂרִי
  choice: сердце моё и плоть моя
  rationale: Сохранена еврейская пара внутреннего и телесного аспектов человека. «Плоть» точнее удерживает образность оригинала, чем обобщающее «тело».
- source_word: יְרַנְּנוּ
  choice: взывают
  rationale: В контексте напряжённой жажды Божьего присутствия «взывают» звучит естественно, однако глагол способен обозначать также громкий радостный возглас; эта неоднозначность отмечена в сноске.
- source_word: אֶל
  choice: к
  rationale: Предлог непосредственно обозначает направленность возгласа к живому Богу.
- source_word: אֵל חָי
  choice: живому Богу
  rationale: Устойчивое библейское обозначение Бога Израиля; определённость ясна из контекста.
