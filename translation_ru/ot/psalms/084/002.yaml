  choice: взывают
  alternative: ликуют / восклицают от радости
  rationale: Контекст подчёркивает изнуряющую жажду Божьего присутствия, поэтому в основном тексте выбран направленный к Богу возглас. Вместе с тем радостная окраска глагола реальна и сохранена в сноске, а не устранена догматически.
