lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Идиоматическая форма блаженства; единственное число согласовано с אָדָם и сохраняет возвышенный, псалмический тон.
- source_word: אָדָם
  choice: человек
  rationale: Существительное употреблено в единственном числе и имеет обобщённый смысл. Русское «человек» точно передаёт его без неоправданного сужения до лица мужского пола.
- source_word: עֹז
  choice: сила
  rationale: В данном контексте речь идёт о силе, обретаемой в Боге, а не прежде всего о крепости или убежище.
- source_word: לוֹ
  choice: чья
  rationale: Буквально «у него / ему»; относительная конструкция естественно связывает эту фразу с предшествующим словом «человек».
- source_word: בָךְ
  choice: в Тебе
  rationale: 'Сохраняется прямое метафорическое значение предлога: источник и основание силы человека находятся в Боге. Заглавная буква уместна для прямого обращения к Богу в принятом русском библейском регистре.'
- source_word: מְסִלּוֹת
  choice: дороги
  rationale: Слово обозначает проложенные, поднятые или большие дороги. Нейтральное «дороги» естественно по-русски и не добавляет прямо не названного направления «к Сиону».
- source_word: בִּלְבָבָם
  choice: в чьём сердце
  rationale: Для ясности по-русски согласовано с единственным числом «человек». Переход еврейского текста к местоименному суффиксу множественного числа отмечен в сноске.
theological_decisions:
- issue: Обобщённое значение אָדָם
  choice: человек
  alternative: муж
  rationale: В контексте это представитель всякого человека, соответствующего описанию; слово «человек» сохраняет единственное число и обобщённость исходного текста.
- issue: Предполагаемое направление дорог מְסִלּוֹת
  choice: дороги
  alternative: дороги к Сиону / пути паломников
  rationale: Контекст псалма указывает на паломничество к Божьему жилищу, однако сам стих не называет Сион и не определяет эти дороги прямо. Поэтому подразумеваемое направление вынесено в примечание.
- issue: Смена числа в בִּלְבָבָם
  choice: в чьём сердце
  alternative: в их сердце / в сердцах которых
  rationale: Еврейский текст переходит от единственного «человек» к суффиксу множественного числа «их». Основной текст передаёт естественную по-русски связь, а подлинная грамматическая неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой формулой блаженства и сохранением поэтического образа дорог в сердце. Синтаксис слегка возвышенный, но понятный; неявное направление паломничества не внесено в основной текст.
