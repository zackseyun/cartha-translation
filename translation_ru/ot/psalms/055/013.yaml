lexical_decisions:
- source_word: וְאַתָּה
  choice: Но ты
  rationale: Союз с личным местоимением выражает резкое противопоставление предыдущему контексту; «Но ты» естественно передаёт этот поворот и сохраняет прямое обращение.
- source_word: אֱנוֹשׁ
  choice: человек
  rationale: Слово обозначает человека, иногда подчёркивая его смертность или слабость. Здесь главное — предательство со стороны близкого человека, поэтому нейтральное «человек» точнее контекста.
- source_word: כְּעֶרְכִּי
  choice: равный мне
  rationale: Оборот от עֵרֶךְ указывает на равенство или сопоставимое положение. «Равный мне» кратко и естественно передаёт этот смысл.
- source_word: אַלּוּפִי
  choice: мой близкий товарищ
  rationale: אַלּוּף может обозначать близкого спутника или товарища, а также предводителя или наставника. В сочетании со следующим выражением вероятнее значение близкого общения; возможный смысл руководства сохранён в сноске.
- source_word: וּמְיֻדָּעִי
  choice: и мой добрый знакомый
  rationale: Форма от ידע буквально обозначает того, кто хорошо знаком говорящему. «Добрый знакомый» передаёт личную близость лучше, чем нейтральное «знакомый», не превращая оба параллельных обозначения в одинаковое «друг».
