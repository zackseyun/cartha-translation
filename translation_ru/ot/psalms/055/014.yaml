lexical_decisions:
- source_word: אֲשֶׁר
  choice: с ним
  rationale: Относительная частица отсылает к близкому спутнику из предыдущего стиха; по-русски связь естественно передаётся предложным сочетанием «с ним».
- source_word: יַחְדָּו
  choice: вместе
  rationale: Наречие прямо подчёркивает общность и былую близость собеседников.
- source_word: נַמְתִּיק סוֹד
  choice: вели задушевные беседы
  rationale: Сочетание буквально связано с тем, чтобы «делать сладким» доверительное общение. Русское выражение передаёт приятный, близкий и конфиденциальный характер бесед, не превращая оборот в неестественную кальку.
- source_word: בְּבֵית אֱלֹהִים
  choice: в Божий дом
  rationale: При глаголе движения предлог בְּ может естественно передавать направленность; «ходили в Божий дом» ясно обозначает совместное посещение места богослужения.
- source_word: נְהַלֵּךְ
  choice: ходили
  rationale: В контексте воспоминания форма передаёт повторявшееся в прошлом совместное действие; несовершенный вид русского глагола выражает это естественно.
- source_word: בְּרָגֶשׁ
  choice: среди многолюдья
  rationale: Слово обозначает множество людей, возможно шумно движущуюся толпу. «Среди многолюдья» сохраняет храмовый контекст и не навязывает оттенок беспорядка.
