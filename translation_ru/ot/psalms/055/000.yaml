  text: לַ/מְנַצֵּ֥חַ בִּ/נְגִינֹ֗ת מַשְׂכִּ֥יל לְ/דָוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/000.yaml
  text: 'For the choirmaster: with stringed instruments. A Maskil[a] of David[b].'
translation:
  language: ru
  text: Руководителю хора. В сопровождении струнных инструментов. Маскил[a] Давида[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «назидательный псалом», или «песнь для размышления»; точное значение слова «маскил» в заголовках псалмов неизвестно.
    reason: lexical_alternative
  - marker: b
    text: Слова «Давида» могут означать также «написанный Давидом», «принадлежащий Давиду» или «для Давида».
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В заголовках псалмов это слово, вероятно, обозначает руководителя храмового музыкального исполнения; дательный падеж естественно передаёт направительное לְ и не вводит архаичного «начальнику певцов».
- source_word: בִּנְגִינֹת
  choice: В сопровождении струнных инструментов
  rationale: Существительное נְגִינֹת здесь, вероятнее всего, указывает на струнное музыкальное сопровождение. Формулировка естественна по-русски и сохраняет функцию заголовочного указания.
- source_word: מַשְׂכִּיל
  choice: Маскил
  rationale: Точное значение этого технического обозначения жанра или типа псалма неизвестно, поэтому в основном тексте сохранена транслитерация, а возможные значения вынесены в примечание.
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Русский родительный оборот сохраняет известную неоднозначность: он может указывать на авторство, принадлежность или связь с Давидом, не сводя выражение исключительно к значению «написанный Давидом».'
theological_decisions:
- issue: Характер связи с Давидом в выражении לְדָוִד
  choice: Давида
  alternative: Давидов; сочинённый Давидом; для Давида
  rationale: Предлог לְ в заголовках псалмов допускает авторство, принадлежность, посвящение или иную связь. Родительный оборот не утверждает прямое авторство категоричнее, чем еврейский текст.
translation_notes:
  register: Современный литературный русский язык; краткая форма заголовка сохранена. «Руководителю хора» понятно широкому читателю, а «в сопровождении» естественно выражает музыкальную функцию. Технический термин «маскил» оставлен без истолкования в основном тексте, чтобы не устранять неопределённость оригинала.
