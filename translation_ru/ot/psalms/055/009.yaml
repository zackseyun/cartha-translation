lexical_decisions:
- source_word: בַּלַּע
  choice: Приведи их в замешательство
  rationale: Глагол обычно означает «поглотить», а также может иметь губительный смысл; однако параллельное повеление «раздели их речь» позволяет передать здесь идею расстройства согласованных действий. Более буквальные варианты сохранены в примечании.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Передаёт божественный титул אֲדֹנָי и отличает его от личного имени YHWH.
- source_word: פַּלַּג לְשׁוֹנָם
  choice: раздели их речь
  rationale: Сохраняет образ разделения и передаёт идиоматическое значение «языка» как речи или средства общения.
- source_word: כִּי רָאִיתִי
  choice: потому что я вижу
  rationale: Перфект выражает увиденную и остающуюся перед глазами действительность, служащую основанием просьбы; в современном русском здесь естественно настоящее время.
- source_word: חָמָס
  choice: насилие
  rationale: Точно передаёт основное значение жестокого, насильственного зла.
- source_word: וְרִיב
  choice: и распрю
  rationale: «Распря» естественно обозначает вражду и раздор и образует выразительную пару со словом «насилие».
- source_word: בָּעִיר
  choice: в городе
  rationale: Прямое обозначение места; определённость естественно передана контекстом.
theological_decisions:
- issue: Значение начального повеления בַּלַּע в связи с последующим «раздели их речь»
  choice: Просьба привести противников в замешательство
  alternative: «Поглоти их» или «погуби их»
  rationale: Параллелизм с разделением речи поддерживает смысл расстройства общения и совместных замыслов, возможно с отзвуком повествования о Вавилоне. При этом буквальный губительный смысл глагола не исключён и отмечен в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенно-поэтической речи. «Владыка» сохраняет различие между титулом אֲדֹנָי и именем YHWH; «распря» придаёт строке умеренно возвышенный, но понятный характер.
