  source_fidelity: «Услышь меня и ответь мне» точно передаёт два еврейских повеления, обращённые к Богу. «Я мечусь в своей жалобе и стону» адекватно воспроизводит беспокойную, возможно связанную с блужданием, семантику אָרִיד, значение שִׂיחַ в контексте сетования и звучащую скорбь וְאָהִימָה.
