lexical_decisions:
- source_word: הַקְשִׁיבָה
  choice: Услышь
  rationale: Повелительная форма קשׁב призывает Бога не просто слышать, а внимательно откликнуться; «услышь» естественно звучит в современной русской молитвенной речи.
- source_word: לִּי
  choice: меня
  rationale: Местоименный компонент передан естественным русским прямым дополнением при глаголе «услышь».
- source_word: וַעֲנֵנִי
  choice: и ответь мне
  rationale: Глагол ענה здесь прямо обозначает ответ на молитвенное обращение.
- source_word: אָרִיד
  choice: я мечусь
  rationale: Форма от רוד/ריד передаёт беспокойное движение или внутреннее смятение; «мечусь» сохраняет образ неуспокоенности, не сводя его только к эмоциональному состоянию.
- source_word: בְּשִׂיחִי
  choice: в своей жалобе
  rationale: שׂיח может означать размышление, излияние или жалобу; контекст плача поддерживает «жалобу», при этом неоднозначность отмечена в сноске.
- source_word: וְאָהִימָה
  choice: и стону
  rationale: המה обозначает шумное выражение смятения, включая стон или ропот; «стону» ясно передаёт слышимое страдание в контексте плача.
