  text: שָׁלַ֣ח יָ֭דָי/ו בִּ/שְׁלֹמָ֗י/ו חִלֵּ֥ל בְּרִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/020.yaml
  text: He stretched out his hands against those at peace with him[b][a]; he profaned his covenant.
translation:
  language: ru
  text: Он поднял руки на тех, кто был с ним в мире[a]; он осквернил свой завет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на своих друзей» или «на своих союзников». Еврейское выражение обозначает людей, находившихся с ним в мирных отношениях.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «нарушил свой завет». Еврейский глагол буквально передаёт мысль об осквернении или обращении с заветом как с чем-то несвятым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח יָדָיו
  choice: поднял руки
  rationale: Сочетание глагола «посылать, простирать» с «руками» в данном контексте выражает враждебное действие. Русское «поднять руку на кого-либо» естественно передаёт этот смысл, а множественное число сохраняет форму еврейского текста.
- source_word: בִּשְׁלֹמָיו
  choice: на тех, кто был с ним в мире
  rationale: Форма указывает на людей, состоявших с ним в мирных отношениях. Перевод сохраняет широкое relational значение и не сужает его до дружбы или политического союза.
- source_word: חִלֵּל
  choice: осквернил
  rationale: Порода piel глагола חלל означает профанировать, осквернять, обращаться как с чем-то нечистым или несвятым. «Осквернил» сохраняет нравственную и сакральную окраску сильнее, чем нейтральное «нарушил».
- source_word: בְּרִיתוֹ
  choice: свой завет
  rationale: בְּרִית обычно означает «завет». Возвратное притяжательное местоимение естественно по-русски передаёт суффикс 3-го лица и не уточняет сверх текста, кем именно и с кем был заключён завет.
theological_decisions:
- issue: Характер упомянутого завета
  choice: «свой завет» без уточнения, что речь идёт о завете с Богом
  alternative: «свой договор» или явное указание на Божий завет
  rationale: Ближайший контекст говорит о вероломстве человека по отношению к тем, с кем он был в мире. Слово «завет» сохраняет вес еврейского בְּרִית, но перевод не привносит отсутствующего в стихе уточнения о божественном завете.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Выражение «поднял руки на» понятно современному читателю; «осквернил свой завет» сохраняет образность и нравственную напряжённость оригинала.
