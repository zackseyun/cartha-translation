lexical_decisions:
- source_word: יוֹמָם וָלַיְלָה
  choice: Днём и ночью
  rationale: Естественная русская временная пара, передающая непрерывность действия.
- source_word: יְסוֹבְבֻהָ
  choice: они обходят её
  rationale: Глагол סבב может обозначать движение вокруг или окружение. «Обходят» сохраняет образ движения и не уточняет оставшийся невыраженным субъект.
- source_word: עַל חוֹמֹתֶיהָ
  choice: по стенам
  rationale: Предлог עַל имеет основное значение «на, по»; в сочетании с глаголом движения русское «по стенам» естественно передаёт происходящее на городских стенах.
- source_word: אָוֶן
  choice: зло
  rationale: Слово может означать нравственное зло, нечестие или причиняемую ими беду. «Зло» сохраняет широкое значение.
- source_word: עָמָל
  choice: бедствие
  rationale: Слово охватывает тяготу, страдание, притеснение и беду. «Бедствие» передаёт пагубное состояние города, не дублируя «зло».
- source_word: בְּקִרְבָּהּ
  choice: внутри неё
  rationale: Буквально «в её среде». Формулировка сохраняет олицетворение города в женском роде и звучит естественно по-русски.
