  text: Днём и ночью они обходят её по стенам[a]; зло и бедствие — внутри неё[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «окружают её». Еврейский глагол может обозначать как движение вокруг, так и окружение.'
    reason: lexical_alternative
  - marker: b
