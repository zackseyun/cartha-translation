  text: הַשְׁלֵ֤ךְ עַל יְהוָ֨ה יְהָבְ/ךָ֮ וְ/ה֪וּא יְכַ֫לְכְּלֶ֥/ךָ לֹא יִתֵּ֖ן לְ/עוֹלָ֥ם מ֗וֹט לַ/צַּדִּֽיק־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/022.yaml
  text: Cast your burden on Yahweh[a], and he will sustain you[b]; he will never allow the righteous to be shaken.
translation:
  language: ru
  text: Возложи на Яхве своё бремя[a], и Он поддержит тебя; Он никогда не даст праведнику поколебаться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою заботу», «свой удел»; возможно также: «то, что Он дал тебе». Еврейское слово встречается редко и может означать вообще то, что возложено на человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְׁלֵךְ
  choice: Возложи
  rationale: Повелительная форма глагола שלך буквально передаёт действие бросания или возложения на кого-либо. «Возложи» естественно звучит в русском увещании и сохраняет образ передачи ноши другому.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога, тетраграмматон YHWH.
- source_word: יְהָבְךָ
  choice: своё бремя
  rationale: 'Редкое существительное обозначает то, что возложено на человека: его ношу, заботу или жизненный удел. «Бремя» лучше всего соответствует обещанию последующей поддержки; неопределённость отражена в сноске.'
- source_word: יְכַלְכְּלֶךָ
  choice: Он поддержит тебя
  rationale: Глагол כלכל здесь означает поддерживать, обеспечивать или давать силы. «Поддержит» сохраняет и образ опоры, и более широкий смысл заботы.
- source_word: לֹא יִתֵּן לְעוֹלָם
  choice: Он никогда не даст
  rationale: 'Сочетание отрицания с נתן и לְעוֹלָם выражает устойчивое недопущение: Бог никогда не позволит этому произойти.'
- source_word: מוֹט
  choice: поколебаться
  rationale: Слово обозначает утрату устойчивости, шатание или падение. «Поколебаться» естественно сохраняет метафору нестойкости.
- source_word: לַצַּדִּיק
  choice: праведнику
  rationale: Субстантивированное прилагательное стоит в мужском роде единственного числа. Русский дательный «праведнику» точно передаёт грамматическую форму и допускает обобщающее значение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя, а не заменяет его титулом.
- issue: Объём обещания в выражении לֹא יִתֵּן לְעוֹלָם מוֹט
  choice: Он никогда не даст праведнику поколебаться
  alternative: Он не позволит праведнику навеки пасть
  rationale: Перевод сохраняет метафору утраты устойчивости и абсолютное временное выражение, не уточняя, означает ли оно отсутствие любого потрясения или окончательного падения.
- issue: Обобщающее значение לַצַּדִּיק
  choice: праведнику
  alternative: праведным
  rationale: Сохранено еврейское единственное число; в русском оно естественно может обозначать всякого человека, характеризуемого как праведник.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмового увещания. Синтаксис краткий и ритмичный; заглавное «Он» употреблено как традиционный русский знак благоговейного отношения к Богу. Подлинная неопределённость редкого слова יְהָבְךָ вынесена в сноску.
