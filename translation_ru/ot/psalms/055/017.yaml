lexical_decisions:
- source_word: עֶרֶב וָבֹקֶר וְצָהֳרַיִם
  choice: Вечером, утром и в полдень
  rationale: Три времени суток переданы параллельным, естественным для русского языка рядом с сохранением поэтического ритма.
- source_word: אָשִׂיחָה
  choice: я жалуюсь
  rationale: Глагол может означать размышление, речь или сетование; контекст плача и сочетание со следующим глаголом указывают здесь на жалобу, не устраняя лексической неоднозначности, отмеченной в сноске.
- source_word: וְאֶהֱמֶה
  choice: и стенаю
  rationale: Глагол выражает слышимое внутреннее волнение, гул или стон; «стенаю» естественно передаёт язык плача и не усиливает образ сверх исходного текста.
- source_word: וַיִּשְׁמַע
  choice: и Он слышит
  rationale: В поэтическом контексте форма передаёт уверенность псалмопевца в том, что Бог слышит его; настоящее время подходит для повторяющегося действия.
- source_word: קוֹלִי
  choice: мой голос
  rationale: Буквальное и естественное соответствие, сохраняющее указание на слышимую молитву.
theological_decisions:
- issue: Не выраженное существительным подлежащее וַיִּשְׁמַע
  choice: «Он» — Бог, без добавления Божьего имени
  alternative: «Господь слышит мой голос»
  rationale: Из контекста ясно, что речь идёт о Боге, однако в самом стихе Божье имя отсутствует. Местоимение сохраняет эту особенность оригинала.
- issue: Временное значение וַיִּשְׁמַע
  choice: 'настоящее время: «слышит»'
  alternative: 'будущее время: «услышит»'
  rationale: Форма допускает контекстуальное прочтение как уверенное, привычное или результативное действие; настоящее время сохраняет смысл уверенности, не превращая его однозначно в обещание о будущем.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Параллельный ряд времён суток сохранён; заглавное «Он» помогает естественно указать на Бога, не добавляя отсутствующего в стихе имени.
