lexical_decisions:
- source_word: ישימות
  choice: Да постигнет их смерть
  rationale: Начало еврейского текста трудно и допускает разные разборы. Выбранное выражение естественно передаёт проклятие, в котором смерть обрушивается на врагов, и согласуется с последующим образом нисхождения живыми в шеол, не уточняя недостоверно, внезапно ли это происходит или смерть действует обманом.
- source_word: עָלֵימוֹ
  choice: их
  rationale: Объект при глаголе «постигнет» естественно передаёт еврейское «на них» в современном русском языке.
- source_word: יֵרְדוּ
  choice: пусть… сойдут
  rationale: Передаёт юссивное, заклинательное значение в контексте и сохраняет образ движения вниз.
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет широкий древнееврейский смысл — область мёртвых — и не подменяет его более узкими понятиями ада или могилы.
- source_word: חַיִּים
  choice: живыми
  rationale: Творительный предикативный естественно показывает, что они сходят в шеол ещё при жизни.
- source_word: כִּי
  choice: ибо
  rationale: Вводит основание проклятия и соответствует возвышенному поэтическому регистру.
- source_word: רָעוֹת
  choice: зло
  rationale: Собирательное единственное число естественно передаёт нравственное зло и нечестие, а не бедствия.
- source_word: בִּמְגוּרָם
  choice: в их жилищах
  rationale: Передаёт наиболее вероятное локативное значение существительного и образ укоренившегося в их обиталище зла.
- source_word: בְּקִרְבָּם
  choice: среди них
  rationale: Сохраняет вероятный общинный смысл параллельной локативной фразы; возможный внутренний смысл отмечен в сноске.
theological_decisions:
- issue: Смысл שְׁאוֹל
  choice: Сохранить термин «шеол» в основном тексте
  alternative: «могила» или «мир мёртвых»
  rationale: Так сохраняется ветхозаветный поэтический и богословский диапазон слова без отождествления шеола с позднейшим, более узким представлением об аде.
- issue: Неясность начального ישימות
  choice: Передать как «Да постигнет их смерть» и отметить неясность
  alternative: «Да придёт на них опустошение» или «Да настигнет их внезапная смерть»
  rationale: Еврейская форма трудна; основной текст сохраняет несомненное проклятие смертью, но не утверждает спорный оттенок внезапности, обмана или опустошения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллелизм и резкость молитвы-проклятия сохранены; спорные лексические и богословские оттенки не устранены, а вынесены в сноски.
