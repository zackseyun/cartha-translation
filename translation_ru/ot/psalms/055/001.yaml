lexical_decisions:
- source_word: הַאֲזִינָה
  choice: Услышь
  rationale: Повелительная форма אזן призывает Бога внимательно выслушать молящегося. «Услышь» естественно и достойно звучит в современной русской молитвенной речи; более буквальное «приклони ухо» здесь было бы архаичным.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения к Богу естественно передаёт прямое обращение אֱלֹהִים; имени завета в стихе нет.
- source_word: תְּפִלָּתִי
  choice: мою молитву
  rationale: Обычное и точное соответствие общему древнееврейскому слову со значением молитвы.
- source_word: וְאַל
  choice: и не
  rationale: Сохраняет простое соединение второй просьбы с первой и отрицание при форме волеизъявления.
- source_word: תִּתְעַלַּם
  choice: не скрывайся
  rationale: Возвратная форма глагола עלם буквально описывает сокрытие или уклонение от внимания; образ сохранён, а подразумеваемый смысл «не оставляй без внимания» вынесен в примечание.
- source_word: מִתְּחִנָּתִי
  choice: от моей мольбы
  rationale: תְּחִנָּה обозначает настойчивую просьбу о милости. «Мольба» передаёт её напряжённость и сохраняет различие с более общим словом «молитва»; предлог מִן передан как «от».
