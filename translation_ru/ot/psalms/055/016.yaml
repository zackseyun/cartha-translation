source:
  edition: WLC
  text: אֲ֭נִי אֶל אֱלֹהִ֣ים אֶקְרָ֑א וַ֝/יהוָ֗ה יוֹשִׁיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/016.yaml
  text: As for me[a], I call to God, and Yahweh will save me.
translation:
  language: ru
  text: А я взываю к Богу, и Яхве[a] спасёт меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское יהוה — личное имя Бога; возможная традиционная передача: «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי
  choice: А я
  rationale: Отдельное и вынесенное вперёд местоимение подчёркивает говорящего и выражает контраст с описанными ранее людьми; русское «А я» естественно передаёт этот оттенок.
- source_word: אֶל־אֱלֹהִים אֶקְרָא
  choice: взываю к Богу
  rationale: Предлог אֶל обозначает направленность обращения, а קרא — призыв или взывание. Настоящее время допустимо для формы имперфекта и естественно выражает совершаемое или постоянное действие псалмопевца.
- source_word: וַיהוָה
  choice: и Яхве
  rationale: Союз передан как «и», а личное имя Бога יהוה — принятой русской транслитерацией «Яхве».
- source_word: יוֹשִׁיעֵנִי
  choice: спасёт меня
  rationale: Каузативная форма от ישׁע означает «спасти, избавить»; будущее время передаёт уверенное ожидание помощи, а «спасёт» сохраняет основное значение корня.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо употреблено личное имя יהוה. Транслитерация сохраняет различие между этим именем и титулом «Господь», не добавляя конфессионального толкования.
- issue: Временной оттенок אֶקְרָא и יוֹשִׁיעֵנִי
  choice: «взываю» и «спасёт»
  alternative: «воззову» и «спасёт»; «взываю» и «спасает»
  rationale: Еврейский имперфект допускает настоящее, повторяющееся или будущее действие. Контекст поддерживает нынешнее обращение псалмопевца и его уверенность в последующем спасении, однако сама грамматика допускает и иные временные оттенки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим глаголом «взываю». Порядок «А я» сохраняет контраст, а фраза остаётся ясной и естественной для широкого читателя.
