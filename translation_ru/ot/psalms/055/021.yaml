base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/021.yaml
  text: The words of his mouth are smooth[a], but his heart is war; his words are softer than oil[b], yet they are drawn swords.
translation:
  language: ru
  text: Льстивы речи его уст, но в сердце у него — война; слова его мягче масла, однако они — обнажённые мечи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мечи, вынутые из ножен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלְקוּ מַחְמָאֹת פִּיו
  choice: Уста его источают речи, гладкие, как масло
  rationale: Редкое сочетание, вероятно, описывает льстивую, «масляную» речь. Формулировка сохраняет образ масла и делает синтаксис понятным по-русски, не сводя смысл только к абстрактной лести.
- source_word: וּקֲרָב לִבּוֹ
  choice: но в сердце у него — война
  rationale: Существительное קְרָב означает «битва, война». Краткая метафора оригинала сохранена, как и контраст между внешне мягкой речью и внутренней враждой.
- source_word: רַכּוּ דְבָרָיו מִשֶּׁמֶן
  choice: слова его нежнее елея
  rationale: Сравнительная конструкция передана прямо. «Елей» — понятное в библейском поэтическом регистре обозначение масла; оно позволяет избежать близкого повтора слова «масло» в той же строке.
- source_word: וְהֵמָּה פְתִחוֹת
  choice: однако они — обнажённые мечи
  rationale: פְתִחוֹת здесь понимается как вынутые из ножен, готовые поразить клинки. Местоимение отнесено к «словам», а противительный оттенок וְ передан словом «однако».
