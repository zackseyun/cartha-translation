lexical_decisions:
- source_word: אָחִישָׁה
  choice: Я поспешил бы
  rationale: Когортативная форма от חוּשׁ выражает настойчивое личное желание или решимость. Условно-желательная конструкция «поспешил бы» естественно передаёт этот оттенок в данном контексте.
- source_word: מִפְלָט
  choice: в убежище
  rationale: Существительное обозначает убежище, место или средство спасения. Предлог «в» необходим для естественного русского управления при глаголе движения и не добавляет идеи поиска.
- source_word: לִי
  choice: передано личной формой «я … бы» и направленностью к убежищу
  rationale: Дательный личной заинтересованности подчёркивает, что псалмопевец ищет спасения для себя; отдельное «для себя» по-русски здесь звучало бы тяжеловесно.
- source_word: מֵרוּחַ סֹעָה
  choice: от бушующего ветра
  rationale: רוּחַ в сочетании с бурей означает ветер, а причастие סֹעָה описывает его неистовое движение. «Бушующий» ясно и естественно передаёт образ.
- source_word: מִסָּעַר
  choice: от бури
  rationale: סַעַר означает бурю или сильный шторм. Повтор предлога «от» сохраняет еврейский параллелизм.
