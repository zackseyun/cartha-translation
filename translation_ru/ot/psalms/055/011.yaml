  text: Destruction is within her[b][a]; oppression and deceit do not depart from her square.
translation:
  language: ru
  text: Гибель — внутри неё[a], и с её площади[b] не уходят притеснение и обман.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пагубные бедствия — внутри неё». В еврейском тексте существительное стоит во множественном числе.'
