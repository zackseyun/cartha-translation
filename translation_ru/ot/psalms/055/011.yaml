    reason: lexical_alternative
lexical_decisions:
- source_word: הַוּוֹת
  choice: гибель
  rationale: Форма множественного числа может обозначать бедствия, пагубные дела или разрушительное зло. Собирательное «гибель» естественно по-русски и сохраняет образ разрушительного зла внутри олицетворённого города.
- source_word: בְּקִרְבָּהּ
  choice: внутри неё
  rationale: Буквально «в её среде / посреди неё». Местоимение женского рода сохраняет олицетворение города.
- source_word: יָמִישׁ
  choice: не уходят
  rationale: Глагол морфологически стоит в единственном числе, однако два последующих существительных образуют составное подлежащее; русское множественное число естественно передаёт их постоянное присутствие.
- source_word: מֵרְחֹבָהּ
  choice: с площади её
  rationale: רְחוֹב обычно обозначает открытое общественное пространство города, площадь; более широкое значение «улицы» отмечено в сноске.
- source_word: תֹּךְ
  choice: притеснение
  rationale: Слово может обозначать угнетение, притеснение или вымогательство. «Притеснение» понятно современному читателю и соответствует общественному злу, заметному в городском пространстве.
- source_word: וּמִרְמָה
  choice: и обман
  rationale: מִרְמָה охватывает значения обмана, коварства и мошенничества. «Обман» — ясный общий эквивалент, не сужающий смысл без необходимости.
