lexical_decisions:
- source_word: פָּדָה
  choice: избавил
  rationale: Глагол означает выкупить или спасти посредством избавления. В контексте битвы «избавил» естественно передаёт совершившееся спасение, не привнося более узкого богословского смысла слова «искупил».
- source_word: בְשָׁלוֹם
  choice: даровав ей мир
  rationale: שָׁלוֹם охватывает мир, целостность и благополучие. Такая формулировка сохраняет образ мира и звучит по-русски естественнее буквального «в мире» при глаголе избавления.
- source_word: נַפְשִׁי
  choice: душу мою
  rationale: Сохраняет еврейский поэтический образ и допускает присущие נֶפֶשׁ оттенки души, жизни и всего человека.
- source_word: מִקֲּרָב לִי
  choice: от битвы против меня
  rationale: קְרָב означает битву или сражение, а לִי в данном контексте естественно понимается как направленность враждебного действия против говорящего.
- source_word: כִּי
  choice: ведь
  rationale: Передаёт поясняющее или причинное значение союза и естественно связывает части русского поэтического высказывания.
- source_word: בְרַבִּים הָיוּ עִמָּדִי
  choice: многие были со мной
  rationale: Сохраняет прямое значение עִמָּדִי «со мной» и не устраняет контекстуальную неоднозначность заключительной части стиха.
theological_decisions:
- issue: Толкование заключительной части בְרַבִּים הָיוּ עִמָּדִי
  choice: ведь многие были со мной
  alternative: ведь многие были против меня
  rationale: Предлог עִם прямо означает «с», однако контекст враждебного столкновения позволяет понимать выражение в противительном смысле. Основной текст сохраняет буквальное напряжение, а возможное контекстуальное толкование указано в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства и поэтического строя псалма. Инверсия «душу мою» поддерживает библейско-поэтический регистр, оставаясь понятной современному читателю.
