id: PSA.55.23
reference: Psalms 55:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אַתָּ֤ה אֱלֹהִ֨ים תּוֹרִדֵ֬/ם לִ/בְאֵ֬ר שַׁ֗חַת אַנְשֵׁ֤י דָמִ֣ים וּ֭/מִרְמָה לֹא יֶחֱצ֣וּ יְמֵי/הֶ֑ם וַ֝/אֲנִ֗י אֶבְטַח בָּֽ/ךְ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/023.yaml
  text: But you[a], God, will bring them down to the pit of destruction; men of bloodshed and deceit will not live out half their days[b], but I will trust in you.
translation:
  language: ru
  text: Но Ты, Боже, низведёшь их в яму погибели[a]; люди, виновные в кровопролитии и обмане, не доживут и до половины своих дней[b]. А я буду уповать на Тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в яму тления», «в могильную яму» или просто «в яму».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не разделят пополам своих дней»; смысл в том, что их жизнь преждевременно оборвётся.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרִידֵם
  choice: низведёшь их
  rationale: Порода hифиль глагола ירד выражает понуждение или причинение движения вниз. «Низведёшь» сохраняет каузативный смысл и возвышенный поэтический регистр, не уточняя способ суда.
- source_word: לִבְאֵר שַׁחַת
  choice: в яму погибели
  rationale: בְּאֵר обозначает яму или колодец, а שַׁחַת может означать яму, погибель или тление. Сочетание «яма погибели» сохраняет и конкретный образ нисхождения, и смысл гибели, не превращая выражение в специальный эсхатологический термин.
- source_word: אַנְשֵׁי דָמִים
  choice: люди, виновные в кровопролитии
  rationale: Буквально «люди кровей» — еврейское обозначение людей, причастных к насилию и пролитой крови. Русская формулировка передаёт кровную вину без неестественной кальки и без сужения смысла до одной лишь кровожадности.
- source_word: וּמִרְמָה
  choice: и обмане
  rationale: מִרְמָה охватывает значения обмана, лжи и коварства. «Обман» сохраняет широкое значение слова и естественно сочетается с характеристикой этих людей.
- source_word: לֹא יֶחֱצוּ יְמֵיהֶם
  choice: не доживут и до половины своих дней
  rationale: חצה буквально означает «делить пополам». Перевод сохраняет образ половины назначенных или ожидаемых дней и вместе с тем ясно передаёт мысль о преждевременной смерти; частица «и» естественно усиливает значение «даже до половины».
- source_word: וַאֲנִי אֶבְטַח בָּךְ
  choice: А я буду уповать на Тебя
  rationale: Самостоятельное местоимение אֲנִי подчёркивает противопоставление судьбе нечестивых. «А я» передаёт этот контраст, а «уповать» соответствует поэтическому молитвенному регистру и значению בטח — доверяться, полагаться.
theological_decisions:
- issue: Характер образа «ямы погибели»
  choice: Сохранён образ Божьего суда, ведущего к гибели и смерти, без отождествления ямы с адом или иным строго определённым посмертным местом.
  alternative: Передать как «могила», «шеол», «яма тления» или специальное обозначение ада.
  rationale: Еврейское выражение несёт сильный образ смерти и разрушения, но в данном стихе не требует конкретизации позднейшего эсхатологического учения.
- issue: Смысл сокращения дней
  choice: Фраза передана как утверждение о преждевременной смерти виновных.
  alternative: Понимать буквально как точный срок, составляющий менее половины заранее установленной продолжительности жизни.
  rationale: Образ «не разделят пополам своих дней» является идиоматическим и говорит о сокращённой жизни, не позволяя вычислить точный срок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Формы «низведёшь» и «уповать» сохраняют достоинство молитвенной поэзии и остаются понятными современному читателю. Заглавные формы местоимений при обращении к Богу применены последовательно в рамках принятой русской библейской издательской нормы.
