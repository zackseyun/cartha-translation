  text: יִשְׁמַ֤ע אֵ֨ל וְֽ/יַעֲנֵ/ם֮ וְ/יֹ֤שֵׁ֥ב קֶ֗דֶם סֶ֥לָה אֲשֶׁ֤ר אֵ֣ין חֲלִיפ֣וֹת לָ֑/מוֹ וְ/לֹ֖א יָרְא֣וּ אֱלֹהִֽים׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/019.yaml
  text: God will hear and answer them—he who sits enthroned from of old (Selah)—because they have no changes[c][b][a], and they do not fear God.
translation:
  language: ru
  text: Бог услышит и ответит им[a] — Он, восседающий издревле. Села. Ведь у них нет перемен[b], и Бога они не боятся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и смирит их» либо «и поразит их». В этом контексте Божий ответ может означать наказание нечестивых.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «они не знают превратностей»; возможно также: «те, у кого нет перемен». Древнееврейская фраза трудна и, вероятно, говорит о спокойной, ничем не нарушаемой жизни, порождающей беспечность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע
  choice: услышит
  rationale: Форма имперфекта в контексте молитвенной уверенности естественно передаётся будущим временем.
- source_word: אֵל
  choice: Бог
  rationale: Обычное поэтическое наименование Бога; вариант «Бог» точен и естественен по-русски.
- source_word: וְיַעֲנֵם
  choice: ответит им
  rationale: Форма от ענה допускает прямое понимание «ответит им»; в данном контексте ответ Бога может подразумевать судебное действие, не названное прямо в основном тексте.
- source_word: וְיֹשֵׁב קֶדֶם
  choice: Он, восседающий издревле
  rationale: Причастие ישׁב применительно к Богу может выражать пребывание и царственное восседание, а קֶדֶם указывает на древность или вечное прошлое.
- source_word: סֶלָה
  choice: Села
  rationale: Традиционная транслитерация сохраняет неопределённость значения и литургической функции термина.
- source_word: אֲשֶׁר אֵין חֲלִיפוֹת לָמוֹ
  choice: Ведь у них нет перемен
  rationale: חֲלִיפוֹת может обозначать перемены, смены или превратности обстоятельств. Буквально-сдержанная формулировка сохраняет трудность древнееврейской фразы.
- source_word: וְלֹא יָרְאוּ אֱלֹהִים
  choice: и Бога они не боятся
  rationale: Перфект описывает их сложившееся состояние; настоящее время естественно передаёт постоянное отсутствие страха Божьего.
theological_decisions:
- issue: Значение ענה во втором глаголе
  choice: «ответит им» в основном тексте
  alternative: «смирит их» или «поразит их»
  rationale: Вокализация непосредственно допускает значение «ответить», тогда как контекст суда над нечестивыми позволяет понимать Божий ответ как карательное смирение. Альтернатива вынесена в примечание, чтобы не устранять напряжение текста.
- issue: Связь отсутствия перемен с отсутствием страха Божьего
  choice: сохранена причинная связь через «ведь»
  alternative: 'относительное присоединение: «те, у кого нет перемен»'
  rationale: אֲשֶׁר допускает неоднозначную синтаксическую связь. Причинное прочтение хорошо объясняет беспечность нечестивых, но буквальная трудность выражения отмечена в примечании.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Инверсия «Бога они не боятся» подчёркивает заключительное обвинение. «Села» оформлено отдельным кратким предложением как литургическая пауза; неоднозначные места не сглажены.
