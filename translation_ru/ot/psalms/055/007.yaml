lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественно для современного литературного русского языка передаёт привлекающую внимание и придающую непосредственность частицу.
- source_word: אַרְחִיק נְדֹד
  choice: я удалился бы далеко, скитаясь
  rationale: Сочетание личной формы от רחק с инфинитивом от נדד выражает удаление вместе со скитанием или бегством. Формулировка сохраняет оба компонента и не сводит неоднозначный נדד исключительно к бегству.
- source_word: אָלִין
  choice: ночевал бы
  rationale: Глагол לין обозначает пребывание на ночь; «ночевал бы» конкретно и естественно передаёт этот смысл.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: «Пустыня» в русском библейском и общем употреблении может обозначать безлюдную дикую местность, не обязательно песчаную.
- source_word: סֶלָה
  choice: Села́
  rationale: Из-за неясного значения термин сохранён в традиционной транслитерации; ударение облегчает чтение.
