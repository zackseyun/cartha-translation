source:
  edition: WLC
  text: כִּ֤י לֹֽא אוֹיֵ֥ב יְחָֽרְפֵ֗/נִי וְ/אֶ֫שָּׂ֥א לֹֽא מְ֭שַׂנְאִ/י עָלַ֣/י הִגְדִּ֑יל וְ/אֶסָּתֵ֥ר מִמֶּֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/012.yaml
  text: For it is not an enemy who taunts me—then I could bear it[b][a]; it is not one who hates me who has magnified himself against me—then I could hide from him.
translation:
  language: ru
  text: Ведь не враг поносит меня[a] — это я мог бы вынести; не ненавистник мой возносится надо мной[b] — от него я мог бы укрыться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оскорбляет меня», «поносит меня бранью». Еврейский глагол обозначает презрительное словесное поругание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «делает себя великим надо мной»; то есть надменно возвышается или ведёт себя высокомерно по отношению ко мне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предшествующей жалобы; «ведь» естественно передаёт эту связь в русской поэтической речи.
- source_word: אוֹיֵב
  choice: враг
  rationale: Прямое и общеупотребительное соответствие существительному со значением противника.
- source_word: יְחָרְפֵנִי
  choice: поносит меня
  rationale: Глагол חרף обозначает презрительную словесную брань или поругание; «поносит» сохраняет силу и достоинство поэтического регистра.
- source_word: וְאֶשָּׂא
  choice: это я мог бы вынести
  rationale: נשׂא здесь означает «нести, терпеть, переносить». Контрфактическая логика контекста естественно выражена формой «мог бы»; «это» восполняет подразумеваемый объект.
- source_word: מְשַׂנְאִי
  choice: ненавистник мой
  rationale: Субстантивированное причастие буквально обозначает того, кто ненавидит говорящего. Такая формулировка сохраняет личный характер противопоставления и поэтический параллелизм.
- source_word: עָלַי הִגְדִּיל
  choice: возносится надо мной
  rationale: Выражение буквально передаёт возвеличивание себя над говорящим и подразумевает надменное, враждебное поведение. Русская формулировка сохраняет образ, не сводя его только к толкованию «ведёт себя высокомерно».
- source_word: וְאֶסָּתֵר מִמֶּנּוּ
  choice: от него я мог бы укрыться
  rationale: Форма נפעל передаёт укрытие себя, а מן — удаление от человека. «Мог бы» поддерживает контрфактический параллелизм первой половины стиха.
