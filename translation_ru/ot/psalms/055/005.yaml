  text: Страх и трепет охватывают меня, ужас окутывает меня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «террор» или «содрогание».'
    reason: פַּלָּצוּת может обозначать ужас, террор или содрогание; сноска сохраняет лексическую неоднозначность, отмеченную в английской аудиторской записи.
lexical_decisions:
- source_word: יִרְאָה
  choice: страх
  rationale: Прямое и естественное соответствие существительному со значением страха или боязни; вместе с «трепетом» сохраняет устойчивую смысловую пару.
- source_word: וָרַעַד
  choice: и трепет
  rationale: Передаёт физическую дрожь, вызванную страхом, и звучит естественно в сочетании «страх и трепет».
- source_word: יָבֹא בִי
  choice: находят на меня
  rationale: Еврейское выражение буквально говорит о вхождении переживания в человека; русский оборот «находят на меня» естественно передаёт внезапно овладевающее состояние и согласуется с составным подлежащим.
- source_word: וַתְכַסֵּנִי
  choice: и охватывает меня
  rationale: Глагол буквально означает «покрывать», но в русском сочетание «ужас покрывает меня» неестественно; «охватывает» сохраняет образ состояния, полностью овладевающего человеком.
- source_word: פַּלָּצוּת
  choice: ужас
  rationale: Передаёт интенсивный страх и содрогание, не повторяя буквально уже употреблённое слово «страх».
