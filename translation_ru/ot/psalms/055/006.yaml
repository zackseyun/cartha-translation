  text: וָ/אֹמַ֗ר מִֽי יִתֶּן לִּ֣/י אֵ֭בֶר כַּ/יּוֹנָ֗ה אָע֥וּפָה וְ/אֶשְׁכֹּֽנָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/006.yaml
  text: And I said[a], “Who will give me wings like a dove? I would fly away and dwell.”
translation:
  language: ru
  text: 'И я сказал[a]: «Кто дал бы мне крылья, как у голубя? Я улетел бы и поселился».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «О, если бы у меня были крылья, как у голубя! Я улетел бы и обрёл покой».'
    reason: 'Лексико-синтаксическая альтернатива: вопросительная еврейская идиома выражает пожелание, а «обрёл покой» передаёт подразумеваемый контекстом смысл глагола «поселиться, обитать».'
lexical_decisions:
- source_word: וָאֹמַר
  choice: И я сказал
  rationale: Последовательная форма глагола אמר вводит слова псалмопевца; перевод сохраняет простое повествовательное продолжение и естественный порядок слов современного русского языка.
- source_word: מִי יִתֶּן לִּי
  choice: Кто дал бы мне
  rationale: Буквально выражение имеет форму вопроса «кто даст мне», но в данном контексте передаёт сильное желание. Условная форма «дал бы» сохраняет вопросительный образ и одновременно естественно выражает мечту.
- source_word: אֵבֶר
  choice: крылья
  rationale: Существительное стоит в единственном числе, но употреблено собирательно как обозначение крыльев, необходимых для полёта; по-русски здесь естественно множественное число.
- source_word: כַּיּוֹנָה
  choice: как у голубя
  rationale: Предлог כ выражает сравнение. Русская конструкция «крылья, как у голубя» ясна и естественна.
- source_word: אָעוּפָה
  choice: я улетел бы
  rationale: Когортатив выражает желание или намерение. Условная форма передаёт желаемое, но нереализованное бегство.
- source_word: וְאֶשְׁכֹּנָה
  choice: и поселился
  rationale: Глагол שכן непосредственно означает жить, обитать, поселяться. «Поселился» сохраняет образ пребывания в другом месте, не подменяя его контекстуальным толкованием «обрёл покой».
