base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/004.yaml
  text: My heart writhes within me[a], and the terrors of death have fallen upon me.
translation:
  language: ru
  text: Сердце моё содрогается во мне[a], и ужасы смерти обрушились на меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сердце моё трепещет во мне». Еврейский глагол может означать мучительно содрогаться, трепетать или испытывать сильную боль.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבִּי
  choice: сердце моё
  rationale: לֵב обозначает сердце как средоточие внутренней жизни, мыслей и чувств; традиционное и естественное русское соответствие сохраняет телесную образность.
- source_word: יָחִיל
  choice: содрогается
  rationale: Глагол חול/חיל может передавать мучительное внутреннее движение, дрожь или страдание. «Содрогается» естественно объединяет телесную и эмоциональную стороны образа, не сводя его лишь к страху.
- source_word: בְּקִרְבִּי
  choice: во мне
  rationale: קֶרֶב с суффиксом первого лица указывает на внутренность человека; «во мне» звучит ясно и поэтично.
- source_word: אֵימוֹת
  choice: ужасы
  rationale: Множественное число אֵימָה выражает охватившие человека сильные, устрашающие переживания; «ужасы» сохраняет число и интенсивность.
- source_word: מָוֶת
  choice: смерти
  rationale: 'Родительная конструкция «ужасы смерти» сохраняет неоднозначность: это могут быть ужасы, исходящие от смерти, связанные с ней или вызванные ею.'
- source_word: נָפְלוּ
  choice: обрушились
  rationale: Форма qatal описывает уже наступившее состояние. «Обрушились» естественно передаёт образ внезапно павшего на человека множества ужасов, хотя буквально глагол означает «упали».
- source_word: עָלָי
  choice: на меня
  rationale: עַל с суффиксом первого лица прямо передаётся как «на меня» и сочетается с глаголом «обрушились».
