    reason: lexical_alternative
lexical_decisions:
- source_word: מִקּוֹל אוֹיֵב
  choice: От голоса врага
  rationale: Предлог מִן допускает значение причины или источника. Русское «от» сохраняет обе возможности и конкретный образ голоса; единственное число «врага» соответствует еврейской форме.
- source_word: מִפְּנֵי עָקַת רָשָׁע
  choice: от притеснения нечестивого
  rationale: עָקָה обозначает давление, стеснение или угнетение; «притеснение» естественно передаёт враждебное воздействие. Единственное число רָשָׁע сохранено как «нечестивого».
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание описанного бедствия; «ибо» уместно в возвышенной поэтической речи и остаётся понятным современному читателю.
- source_word: יָמִיטוּ עָלַי אָוֶן
  choice: они обрушивают на меня беду
  rationale: Каузативная форма יָמִיטוּ передаёт наведение или низвержение чего-либо на человека. «Обрушивают» сохраняет направленный образ, а «беду» выражает контекстуальное значение אָוֶן.
- source_word: וּבְאַף יִשְׂטְמוּנִי
  choice: и в гневе питают ко мне вражду
  rationale: אַף идиоматически означает гнев, а שׂטם — устойчивую враждебность или ненависть. «Питают ко мне вражду» точнее сохраняет оттенок активной враждебности, не сводя его только к чувству.
