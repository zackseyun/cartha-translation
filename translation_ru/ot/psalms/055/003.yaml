base_translation:
  language: en
  yaml_path: translation/ot/psalms/055/003.yaml
  text: Because of the voice of the enemy[a], because of the oppression of the wicked; for they cast trouble upon me[b], and in anger they hate me.
translation:
  language: ru
  text: От голоса врага, от притеснения нечестивого, ибо они обрушивают на меня беду[a] и в гневе ненавидят меня.
  philosophy: optimal-equivalence
