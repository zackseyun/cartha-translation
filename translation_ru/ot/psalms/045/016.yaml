  text: תַּ֣חַת אֲ֭בֹתֶי/ךָ יִהְי֣וּ בָנֶ֑י/ךָ תְּשִׁיתֵ֥/מוֹ לְ֝/שָׂרִ֗ים בְּ/כָל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/016.yaml
  text: In place of your fathers will be your sons[b][a]; you will appoint them as princes in all the earth.
translation:
  language: ru
  text: Твои сыновья займут место твоих отцов; ты поставишь их князьями по всей земле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по всей стране». Еврейское אֶרֶץ может означать как «землю», так и «страну» — в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת
  choice: займут место
  rationale: Предлог обозначает замещение или преемство, а не пространственное положение. Перестройка фразы естественно передаёт этот смысл по-русски.
- source_word: אֲבֹתֶיךָ
  choice: твоих отцов
  rationale: Сохраняется буквальное значение и династический оттенок; в контексте речь может идти шире о предках.
- source_word: יִהְיוּ
  choice: займут
  rationale: Связка «будут» вместе с תַּחַת идиоматически передана глаголом «займут», выражающим будущее преемство без изменения смысла.
- source_word: בָנֶיךָ
  choice: твои сыновья
  rationale: Мужской род и множественное число сохранены, что соответствует контексту царских наследников.
- source_word: תְּשִׁיתֵמוֹ
  choice: ты поставишь их
  rationale: Глагол שׁית значит «ставить, помещать»; при назначении правителей русское «поставишь» сохраняет образ и звучит естественно.
- source_word: לְשָׂרִים
  choice: князьями
  rationale: שָׂרִים обозначает князей, вождей или правителей. «Князьями» соответствует возвышенному царскому контексту.
- source_word: בְּכָל הָאָרֶץ
  choice: по всей земле
  rationale: אֶרֶץ может означать как землю в широком смысле, так и страну. Основной вариант сохраняет широкий масштаб, а более узкое прочтение отмечено в сноске.
theological_decisions:
- issue: Масштаб значения הָאָרֶץ в царском и потенциально мессианском контексте
  choice: по всей земле
  alternative: по всей стране
  rationale: Широкое прочтение соответствует возвышенному царскому размаху псалма, но еврейское слово допускает и значение «страна»; сноска сохраняет эту неоднозначность, не навязывая позднейшего богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим царскому псалму. Первая половина перестроена в естественный русский порядок слов; образ династического преемства и параллелизм стиха сохранены.
