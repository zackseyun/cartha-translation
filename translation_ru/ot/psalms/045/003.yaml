lexical_decisions:
- source_word: חֲגוֹר
  choice: пристегни
  rationale: Повелительная форма означает «опояшься, прикрепи к поясу». «Пристегни» естественно передаёт конкретное действие в современном русском языке без архаизации.
- source_word: חַרְבְּךָ
  choice: свой меч
  rationale: Существительное с суффиксом 2-го лица мужского рода означает «твой меч»; русское возвратное притяжательное местоимение естественно соотносит меч с адресатом повеления.
- source_word: עַל יָרֵךְ
  choice: к бедру
  rationale: Сохраняет конкретный образ меча, носимого у бедра. Русское «пристегни к бедру» идиоматичнее буквального «на бедре».
- source_word: גִּבּוֹר
  choice: могучий воин
  rationale: Обращение к царю-воителю; контекстуальное «воин» ясно передаёт военный оттенок слова, не устраняя его основного значения «могучий».
- source_word: הוֹדְךָ
  choice: в своём блеске
  rationale: הוֹד в царской поэзии обозначает блеск, великолепие, славу или величие. «Блеск» сохраняет образ царственного сияния и отличается от следующего близкого по смыслу слова.
- source_word: וַהֲדָרֶךָ
  choice: и величии
  rationale: הָדָר обозначает величие, великолепие или красоту. «Величие» поддерживает возвышенный царский регистр и естественно образует пару со словом «блеск».
theological_decisions:
- issue: Царское или мессианское понимание адресата
  choice: Передать прямое обращение к могучему царю-воину, не называя его Мессией в самом переводе.
  alternative: Явно обозначить адресата как мессианского Царя с учётом последующего канонического прочтения.
  rationale: В данном стихе еврейский текст непосредственно обращён к царственному воину, но сам по себе не содержит явного титула «Мессия». Перевод оставляет возможность типологического и мессианского прочтения, не внося его в формулировку стиха.
- issue: Синтаксическая связь הוֹדְךָ וַהֲדָרֶךָ
  choice: Связать слова «блеск и величие» с образом выступающего в бой воина посредством добавленного по-русски предлога «в».
  alternative: 'Понять заключительные существительные как приложение или как характеристику меча: «твой блеск и твоё величие».'
  rationale: В еврейском тексте предлог перед заключительной парой отсутствует, поэтому синтаксическая связь неоднозначна. Основной текст предлагает естественное контекстуальное прочтение, а сноска сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим тоном. Конкретный воинский образ сохранён; архаичные формы вроде «препояшь» не вынесены в основной текст, но буквальная конструкция отмечена в сноске.
