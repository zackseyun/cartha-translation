  text: בְּנ֣וֹת מְ֭לָכִים בְּ/יִקְּרוֹתֶ֑י/ךָ נִצְּבָ֥ה שֵׁגַ֥ל לִֽ֝/ימִינְ/ךָ֗ בְּ/כֶ֣תֶם אוֹפִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/009.yaml
  text: Daughters of kings are among your honored women[b][a]; at your right hand stands the queen in gold of Ophir.
translation:
  language: ru
  text: Дочери царей — среди твоих почётных женщин[a]; по правую руку от тебя стоит царица в золоте Офира[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди дорогих тебе», «среди твоих знатных женщин». Еврейское выражение допускает разные толкования.'
    reason: lexical_alternative
  - marker: b
    text: Золото Офира — высококачественное золото, связанное с Офиром, местностью, которая в Ветхом Завете славилась своим богатством и золотом.
    reason: cultural_note
lexical_decisions:
- source_word: בְּנוֹת מְלָכִים
  choice: Дочери царей
  rationale: Прямой перевод сочетания с сохранением еврейского образа; вариант «царевны» возможен, но менее прозрачно передаёт форму оригинала.
- source_word: בְּיִקְּרוֹתֶיךָ
  choice: среди твоих почётных женщин
  rationale: Трудная форма, вероятно связанная с יקר («дорогой, драгоценный, почитаемый»), в контексте царского двора естественно относится к знатным и почитаемым женщинам при царе. Неопределённость отражена в примечании.
- source_word: נִצְּבָה
  choice: стоит
  rationale: Форма описывает занятое положение в представленной поэтической сцене; настоящее время естественно по-русски.
- source_word: שֵׁגַל
  choice: царица
  rationale: Слово обозначает царскую супругу; «царица» — точный и естественный русский эквивалент в контексте царской свадьбы.
- source_word: לִימִינְךָ
  choice: по правую руку от тебя
  rationale: Устойчивое русское выражение, сохраняющее придворный образ почётного положения рядом с царём.
- source_word: בְּכֶתֶם אוֹפִיר
  choice: в золоте Офира
  rationale: כֶּתֶם означает высококачественное золото, а Офир указывает на прославленный источник; оборот подразумевает золотое убранство, не конкретизируя его сверх оригинала.
