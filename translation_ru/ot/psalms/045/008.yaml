  text: Все одежды твои благоухают миррой, алоэ и кассией; из чертогов, отделанных слоновой костью, тебя порадовали[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение можно передать так: «из чертогов слоновой кости они порадовали тебя». Подлежащее глагола в еврейском тексте не названо; возможно, подразумеваются музыка, музыканты или, согласно традиционному толкованию, струнные инструменты. Значение предлога перед последним глаголом не вполне ясно: «из», «изнутри/от» или «благодаря».'
    reason: Сохраняет невыраженное подлежащее и отмечает спорный синтаксико-семантический нюанс предлога, не выдавая добавленное «они» за буквальное слово текста.
lexical_decisions:
- source_word: מֹר
  choice: мирра
  rationale: Обычное и точное русское название благовонной смолы в библейском контексте.
- source_word: וַאֲהָלוֹת
  choice: алоэ
  rationale: Здесь имеется в виду ароматическая древесина, а не современное суккулентное растение; традиционное «алоэ» сохраняет библейскую образность.
- source_word: קְצִיעוֹת
  choice: кассия
  rationale: Обозначает ароматическую кору или пряность; «кассия» — точный и понятный эквивалент.
- source_word: כָּל בִּגְדֹתֶיךָ
  choice: Все одежды твои благоухают
  rationale: В еврейском тексте глагол отсутствует, а благовония соположены с одеждами. Добавление «благоухают» естественно передаёт вероятный смысл, не создавая впечатления, будто одежды буквально состоят из пряностей.
- source_word: מִן הֵיכְלֵי שֵׁן
  choice: из чертогов, украшенных слоновой костью
  rationale: В контексте царской свадьбы הֵיכָל означает дворцовый чертог, а שֵׁן — слоновую кость. Описательная формулировка по-русски естественнее буквального «чертоги слоновой кости».
- source_word: שִׂמְּחוּךָ
  choice: тебя веселят
  rationale: 'Форма Piel, 3-е лицо множественного числа с суффиксом 2-го лица единственного числа: «они веселят/радуют тебя». Настоящее время уместно в живом поэтическом описании.'
- source_word: implicit subject of שִׂמְּחוּךָ
  choice: не выражен в основном тексте
  rationale: Еврейский текст не называет подлежащее. Сохранение неопределённости точнее, чем внесение в строку «струнных инструментов», музыки или музыкантов.
theological_decisions:
- issue: Царский и возможный мессианский контекст Псалма 45
  choice: Передать непосредственную картину царской свадьбы без добавления мессианской терминологии
  alternative: Сформулировать стих с учётом позднейшего мессианского прочтения
  rationale: Сам стих описывает царские одежды, дворцовые чертоги и торжественную радость; перевод не должен вносить в его лексику богословский слой, прямо не выраженный еврейским текстом.
translation_notes:
  register: Современный литературный русский с поэтической торжественностью. Инверсия «одежды твои» сохраняет возвышенный ритм, оставаясь понятной. Неясное подлежащее последнего глагола не восполнено в основном тексте и объяснено в сноске.
