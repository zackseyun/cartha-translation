  text: And the daughter of Tyre will come with a gift[b][a]; the rich among the people will seek your favor.
translation:
  language: ru
  text: И дочь Тира придёт с даром[a]; богатые из народа будут искать твоего расположения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с приношением» или «с данью». Еврейское מִנְחָה в зависимости от контекста может означать дар, приношение или дань.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «твоё лицо». Это еврейское выражение означает стремление снискать чьё-либо расположение или обратиться с мольбой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַת צֹר
  choice: И дочь Тира
  rationale: Сочетание «дочь» с названием города олицетворяет Тир или его жителей; формально близкий оборот естественен и понятен в русском поэтическом тексте.
- source_word: בְּמִנְחָה
  choice: с даром
  rationale: מִנְחָה может означать дар, приношение или дань. В контексте царского двора нейтральное «дар» сохраняет широту значения без излишне культового или политического уточнения.
- source_word: פָּנַיִךְ יְחַלּוּ
  choice: будут искать твоего расположения
  rationale: Буквально речь идёт об умилостивлении или испрашивании «твоего лица»; русский идиоматический эквивалент передаёт стремление снискать благосклонность адресата женского рода.
- source_word: עֲשִׁירֵי עָם
  choice: богатые из народа
  rationale: Конструктивное сочетание обозначает богатых людей из народа. Перевод не уточняет, какой именно народ имеется в виду, поскольку еврейский текст этого однозначно не определяет.
