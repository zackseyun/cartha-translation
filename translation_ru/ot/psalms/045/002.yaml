  text: יָפְיָפִ֡יתָ מִ/בְּנֵ֬י אָדָ֗ם ה֣וּצַק חֵ֭ן בְּ/שְׂפְתוֹתֶ֑י/ךָ עַל כֵּ֤ן בֵּֽרַכְ/ךָ֖ אֱלֹהִ֣ים לְ/עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/002.yaml
  text: You are more beautiful than the sons of men[a]; grace is poured upon your lips[c][b]; therefore God has blessed you forever.
translation:
  language: ru
  text: Ты прекраснее всех сынов человеческих[a]; благодать излита на устах твоих[b]; поэтому Бог благословил тебя навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прекраснее сынов человеческих», то есть прекраснее других людей.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «благосклонность», «привлекательность» или «любезность»; в связи с устами оно может указывать на благодатную речь.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפְיָפִיתָ
  choice: Ты прекраснее всех
  rationale: Интенсивная поэтическая форма от יפה выражает превосходящую красоту; сравнительная русская конструкция естественно передаёт сопоставление с последующим מִן.
- source_word: מִבְּנֵי אָדָם
  choice: сынов человеческих
  rationale: Поэтическое выражение буквально означает «сынов человека» и обозначает других людей; традиционная русская формула сохраняет мужской образ и возвышенный регистр.
- source_word: הוּצַק
  choice: излита
  rationale: Страдательная форма от יצק сохраняет образ обильного излияния; прошедшее краткое причастие передаёт совершенный вид еврейской формы и её наличный результат.
- source_word: חֵן
  choice: благодать
  rationale: Слово может означать благосклонность, привлекательность или любезность; при упоминании уст «благодать» сохраняет многозначность между дарованным расположением и благодатной речью.
- source_word: בְּשְׂפְתוֹתֶיךָ
  choice: на устах твоих
  rationale: Русское «на устах» естественно сочетается с образом излияния, а «уста» поддерживают поэтический и торжественный регистр.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Ясно и современно передаёт причинно-следственную связь.
- source_word: בֵּרַכְךָ אֱלֹהִים
  choice: Бог благословил тебя
  rationale: Наиболее прямой синтаксический разбор понимает אֱלֹהִים как подлежащее, а перфект בֵּרַכְךָ — как совершившееся действие с сохраняющимся результатом.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Краткий поэтический эквивалент, выражающий неограниченную длительность.
theological_decisions:
- issue: Является ли אֱלֹהִים подлежащим или обращением
  choice: «Бог благословил тебя» — אֱלֹהִים выступает подлежащим.
  alternative: «О Боже, [он] благословил тебя» либо чтение, дополненное словами из следующего стиха.
  rationale: В пределах данного стиха подлежащее «Бог» представляет собой наиболее естественный синтаксический разбор. Перевод не добавляет отсутствующего здесь «твой Бог» и не навязывает богословское разрешение неоднозначности контекста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической лексикой («уста», «навеки»). Инверсия «на устах твоих» сохраняет достоинство стиха без чрезмерной архаизации.
