  text: Listen[a], daughter, and see; incline your ear, and forget your people and your father's house.
translation:
  language: ru
  text: Слушай, дочь, и смотри; склони своё ухо и забудь свой народ и дом своего отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁמְעִי
  choice: Слушай
  rationale: Императив 2-го лица женского рода от שׁמע. «Слушай» естественно передаёт призыв к внимательному восприятию; возможное «услышь» звучало бы менее нейтрально.
- source_word: בַת
  choice: дочь
  rationale: Прямое обращение к женщине. Русский язык не требует добавления звательной частицы «о».
- source_word: וּרְאִי
  choice: и смотри
  rationale: Императив от ראה допускает значения «смотри» и «увидь». В сочетании с призывом слушать «смотри» естественно выражает направленное внимание, не превращая повеление в указание на результат.
- source_word: וְהַטִּי אָזְנֵךְ
  choice: приклони ухо твоё
  rationale: Сохраняет конкретный еврейский образ наклонённого для внимательного слушания уха и остаётся понятным в возвышенном поэтическом регистре.
- source_word: וְשִׁכְחִי
  choice: и забудь
  rationale: Передаёт прямое значение императива от שכח без смягчающей парафразы «оставь позади».
- source_word: עַמֵּךְ
  choice: народ твой
  rationale: עם здесь обозначает народ или этнос, к которому принадлежит адресат; прямой эквивалент сохраняет социальную и родовую широту выражения.
- source_word: וּבֵית אָבִיךְ
  choice: и дом отца твоего
  rationale: Сохраняет устойчивое древнееврейское обозначение отцовской семьи и домашнего рода, не сужая его до здания или места проживания.
theological_decisions:
- issue: Сила наставления невесте
  choice: Сохранено прямое требование забыть свой народ и отцовский дом, подразумевающее решительную смену главной принадлежности в контексте царского брака.
  alternative: Истолковать строку лишь как общее наставление быть внимательной либо смягчить «забудь» до «оставь позади».
  rationale: Последовательность повелений достигает кульминации в словах о народе и доме отца. Перевод сохраняет силу и напряжённость образа, не добавляя позднейших конфессиональных толкований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Порядок притяжательных слов в оборотах «ухо твоё», «народ твой», «дом отца твоего» сохраняет достоинство библейской поэзии, оставаясь понятным современному читателю.
