  text: כָּל כְּבוּדָּ֣ה בַת מֶ֣לֶךְ פְּנִ֑ימָה מִֽ/מִּשְׁבְּצ֖וֹת זָהָ֣ב לְבוּשָֽׁ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/013.yaml
  text: All glorious is the king’s daughter within[b][a]; her clothing is of woven gold.
translation:
  language: ru
  text: Царская дочь внутри — вся в великолепии[a]; её одежда заткана золотом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всё великолепие царской дочери — внутри». Слово «внутри» может указывать либо на внутреннюю красоту, либо на то, что она находится во внутренних покоях дворца.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «её одежда украшена золотыми узорами»; возможно также: «расшита золотом». Точный вид искусной отделки неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כְּבוּדָּה
  choice: вся в великолепии
  rationale: Сочетание כָּל с כְּבוּדָּה передаёт полноту славы и великолепия; по-русски выражение «вся в великолепии» естественно звучит как описание царственного убранства, не сводя смысл только к нравственной красоте.
- source_word: בַת מֶלֶךְ
  choice: царская дочь
  rationale: Буквальная и ясная передача еврейского выражения сохраняет образ дочери царя; слово «царевна» сильнее привязано к русской культурной традиции.
- source_word: פְּנִימָה
  choice: внутри
  rationale: Наречие означает «внутрь, внутри». Краткая передача сохраняет возможность понимать его пространственно — как нахождение во внутренних покоях, — не добавляя отсутствующего в тексте слова «дворец».
- source_word: מִמִּשְׁבְּצוֹת זָהָב
  choice: заткана золотом
  rationale: מִשְׁבְּצוֹת обозначает искусно выполненную узорчатую, плетёную или оправленную работу. В контексте одежды «заткана золотом» естественно передаёт ткань с вплетёнными золотыми нитями, тогда как точная техника изготовления остаётся не вполне определённой.
- source_word: לְבוּשָׁהּ
  choice: её одежда
  rationale: Общее обозначение того, во что она одета; «одежда» не сужает смысл до одного конкретного платья или одеяния.
theological_decisions:
- issue: Относится ли פְּנִימָה к местонахождению царской дочери или к её внутренней красоте
  choice: В основном тексте сохранено пространственное «внутри».
  alternative: «Всё великолепие царской дочери — внутри», то есть её красота является внутренней.
  rationale: Еврейский синтаксис допускает разные способы членения фразы. Контекст царской свадьбы поддерживает значение внутренних покоев, однако формулировка способна вызывать и представление о внутреннем достоинстве; примечание сохраняет эту неоднозначность без догматического выбора.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Инверсия и тире помогают сохранить компактность еврейской строки. Архаичное «царевна» и чрезмерно конкретное «во дворце» не использованы.
