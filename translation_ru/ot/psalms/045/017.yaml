  text: Я сделаю так, чтобы твоё имя помнили в каждом поколении[a]; поэтому народы будут славить тебя во веки веков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я буду упоминать твоё имя»; возможно также: «Я буду помнить твоё имя». Еврейский глагол стоит в каузативной породе и может означать побуждение к активному памятованию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут благодарить тебя». Еврейский глагол в богослужебном контексте может выражать как хвалу, так и благодарение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּירָה
  choice: Я сохраню память
  rationale: 'Форма породы hифиль от זכר имеет каузативный оттенок: говорящий не просто помнит сам, а обеспечивает сохранение памяти. Русское «сохраню память» естественно передаёт активное увековечение имени.'
- source_word: שִׁמְךָ
  choice: о твоём имени
  rationale: Буквально «твоё имя»; в контексте имя также обозначает славу, репутацию и сохраняемую память о личности.
- source_word: בְּכָל דֹּר וָדֹר
  choice: во всех поколениях
  rationale: Удвоенная формула «в каждом поколении и поколении» означает непрерывную последовательность поколений. Выбранная формулировка ясна и поэтична.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Передаёт выраженную в еврейском тексте связь следствия или основания.
- source_word: עַמִּים
  choice: народы
  rationale: Сохраняет множественное число и предполагаемый широкий круг различных народов.
- source_word: יְהוֹדֻךָ
  choice: будут славить тебя
  rationale: Глагол ידה в hифиле в псалмах часто обозначает хвалу или благодарение. «Славить» естественно сочетается с царским и богослужебным контекстом.
- source_word: לְעֹלָם וָעֶד
  choice: во веки веков
  rationale: Традиционная и понятная русская формула, сохраняющая усиленное значение нескончаемой длительности.
theological_decisions:
- issue: К кому относятся местоимения второго лица в царском свадебном псалме
  choice: Сохранено прямое обращение «твоём… тебя» без уточнения адресата
  alternative: Явно назвать либо царя из дома Давида, либо Мессию
  rationale: Сам стих оставляет адресата в форме прямого обращения. Такое решение сохраняет возможность как непосредственного царского, так и канонического мессианского прочтения, не закрепляя одно из них в переводе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Формула «во веки веков» уместна для псалма и остаётся понятной современному читателю; синтаксис краток и сохраняет причинно-следственную структуру оригинала.
