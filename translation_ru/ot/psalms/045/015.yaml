  source_fidelity: 'Текст точно передаёт обе формы женского рода множественного числа: пассивное תּוּבַלְנָה («их поведут») и активное תְּבֹאֶינָה («они войдут»). «С радостью и ликованием» естественно воспроизводит парные שְׂמָחוֹת и גִּיל, не сглаживая их в один термин. «Во дворец царя» обоснованно передаёт בְּהֵיכַל מֶלֶךְ в свадебно-царском контексте.'
