source:
  edition: WLC
  text: תּ֭וּבַלְנָה בִּ/שְׂמָחֹ֣ת וָ/גִ֑יל תְּ֝בֹאֶ֗ינָה בְּ/הֵ֣יכַל מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/015.yaml
  text: They will be led with gladness and rejoicing[b][a]; they will enter the palace of the king.
translation:
  language: ru
  text: Их поведут с радостью и ликованием[a]; они войдут во дворец царя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Их приведут с радостью и торжеством».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово הֵיכָל может означать «дворец», «зал», а в других контекстах — «храм»; здесь обстановка царской свадьбы указывает на дворец.
    reason: cultural_note
lexical_decisions:
- source_word: תּוּבַלְנָה
  choice: их поведут
  rationale: Хофаль, имперфект 3-го лица женского рода множественного числа от יבל, выражает пассивное ведение или приведение. Русская неопределённо-личная конструкция «их поведут» естественно передаёт пассивный смысл и оттенок торжественной процессии.
- source_word: בִּשְׂמָחֹת
  choice: с радостью
  rationale: 'Предлог ב при множественном числе существительного обозначает сопутствующее состояние или образ действия. В современном русском собирательное значение естественно передаётся единственным числом: «с радостью».'
- source_word: וָגִיל
  choice: и ликованием
  rationale: גיל обозначает бурную, торжествующую радость. «Ликование» отличает это слово от предшествующего שׂמחות и сохраняет поэтическую парность.
- source_word: תְּבֹאֶינָה
  choice: они войдут
  rationale: Каль, имперфект 3-го лица женского рода множественного числа от בוא. При указании на дворец глагол естественно и точно переводится как «войдут».
- source_word: בְּהֵיכַל
  choice: во дворец
  rationale: הֵיכָל может означать дворец, большой зал или храм. В контексте царской свадьбы наиболее вероятно значение «дворец».
- source_word: מֶלֶךְ
  choice: царя
  rationale: В определённой контекстом генитивной конструкции речь идёт о царе, уже находящемся в центре псалма; русское «дворец царя» передаёт это без необходимости добавлять указательное уточнение.
theological_decisions:
- issue: К кому относятся глаголы женского рода во множественном числе
  choice: Местоимение «они» оставляет подразумеваемыми участниц свадебного шествия, названных в ближайшем контексте.
  alternative: Явно назвать их «девушками», «подругами невесты» или обобщённо «женщинами».
  rationale: Еврейская грамматика указывает на группу женского рода, но сам стих её повторно не называет. Перевод не конкретизирует референт сверх непосредственного литературного контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Формулировка сохраняет параллелизм двух частей стиха и не перегружена архаизмами.
