lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Дирижёру
  rationale: В заголовках псалмов слово обозначает руководителя музыкального исполнения; краткая форма естественна для русского заголовка и не уточняет сверх текста, шла ли речь именно о хоре.
- source_word: עַל שֹׁשַׁנִּים
  choice: На мотив «Лилии»
  rationale: עַל в музыкальном заголовке, вероятно, вводит название мелодии или способ исполнения, а שֹׁשַׁנִּים буквально означает «лилии». Добавление «мотив» ясно передаёт вероятную функцию, тогда как сноска сохраняет неопределённость.
- source_word: לִבְנֵי קֹרַח
  choice: Сынов Кореевых
  rationale: Предлог לְ может выражать авторство, принадлежность или посвящение. Русская заголовочная формула с родительным падежом сохраняет эту неоднозначность.
- source_word: מַשְׂכִּיל
  choice: Маскиль
  rationale: Это технический термин псалмовых заголовков с не вполне ясным значением; транслитерация избегает ложной точности.
- source_word: שִׁיר יְדִידֹת
  choice: Песнь о любви
  rationale: Идиоматичный русский перевод необычного еврейского сочетания «песнь любовей»; сноска отмечает буквальную форму и возможный оттенок множественного числа.
