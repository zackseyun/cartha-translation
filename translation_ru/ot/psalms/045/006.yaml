base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/006.yaml
  text: Your throne[a], O God, is forever and ever[b]; the scepter of your kingdom is a scepter of uprightness.
translation:
  language: ru
  text: Престол Твой, Боже, — во веки веков[a]; скипетр Твоего царства — скипетр справедливости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твой престол — Бог во веки веков»; или: «Твой божественный престол — во веки веков». Синтаксис еврейского текста понимают по-разному; основной текст следует прочтению слова «Бог» как обращения.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также, с сохранением порядка слов еврейского текста: «скипетр справедливости — скипетр Твоего царства».'
    reason: previous_rendering
lexical_decisions:
- source_word: כִּסְאֲךָ
  choice: Престол Твой
  rationale: כִּסֵּא обозначает престол, царское место власти; в контексте царского псалма «престол» точно и естественно передаёт смысл.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: 'Форма обращения естественно передаёт наиболее прямое вокативное прочтение: «Престол Твой, Боже». Синтаксическая неоднозначность еврейского текста сохранена в примечании.'
- source_word: עוֹלָם וָעֶד
  choice: во веки веков
  rationale: Устойчивое русское поэтическое выражение передаёт непрерывную вечность и усилительный характер еврейской пары.
- source_word: שֵׁבֶט
  choice: скипетр
  rationale: В царском контексте שֵׁבֶט означает знак власти правителя — скипетр, а не обычный жезл или посох.
- source_word: מִישֹׁר
  choice: правота
  rationale: Слово выражает прямоту в нравственном смысле, честность и справедливость; «правота» сохраняет образ этической прямоты и поэтическую ёмкость, не сужая значение до юридического правосудия.
- source_word: שֵׁבֶט מַלְכוּתֶךָ
  choice: скипетр Твоего царства
  rationale: Перевод сохраняет конструктивную связь существительных и царственную образность оригинала.
theological_decisions:
- issue: Синтаксическая и богословская функция אֱלֹהִים в первой строке
  choice: 'Обращение: «Престол Твой, Боже, — во веки веков»'
  alternative: «Твой престол — Бог во веки веков»; «Твой божественный престол — во веки веков»
  rationale: Вокативное прочтение наиболее естественно в контексте прямого обращения и соответствует древней рецепции текста, не устраняя его богословского напряжения. Реально возможные альтернативы вынесены в примечание.
translation_notes:
  register: Современный литературный русский с возвышенной псалмической интонацией. Местоимение «Твой» написано с прописной буквы в соответствии с прямым обращением «Боже». Тире естественно оформляет именные предложения; подлинная синтаксическая неоднозначность первой строки отмечена сноской.
