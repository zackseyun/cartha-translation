base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/007.yaml
  text: You have loved righteousness and hated wickedness[a]; therefore God, your God[b], has anointed you with the oil of gladness beyond your companions.
translation:
  language: ru
  text: 'Ты возлюбил праведность

    и возненавидел нечестие;

    поэтому Бог, твой Бог,[a]

    помазал тебя маслом радости

    больше, чем твоих спутников.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «поэтому, о Боже, твой Бог помазал тебя маслом радости больше, чем твоих спутников». Первое слово «Бог» можно понимать как обращение, а не как подлежащее.'
    reason: alternative_reading
  - marker: b
    text: Этот стих цитируется в Евр. 1:9.
    reason: cross_reference
lexical_decisions:
- source_word: אָהַבְתָּ
  choice: Ты возлюбил
  rationale: Форма qal perfect, 2-е лицо, мужской род, единственное число. Прошедшее совершенного вида передаёт состоявшееся и определяющее адресата отношение, не превращая поэтическое утверждение в отвлечённую сентенцию.
- source_word: צֶּדֶק
  choice: праведность
  rationale: Слово охватывает нравственную правоту и справедливость. «Праведность» сохраняет вес этического контраста в царском псалме, не сужая смысл только до судебной справедливости.
- source_word: וַתִּשְׂנָא
  choice: и возненавидел
  rationale: Координированный глагол во 2-м лице передан параллельно «возлюбил»; приставка «воз-» поддерживает поэтическую симметрию без изменения смысла.
- source_word: רֶשַׁע
  choice: нечестие
  rationale: Обозначает нравственное зло и порочность. «Нечестие» образует ясную противоположность «праведности», тогда как «беззаконие» могло бы неоправданно сузить значение до нарушения закона.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Обычное следственно-выводное выражение, связывающее помазание с названным нравственным качеством адресата.
- source_word: מְשָׁחֲךָ
  choice: помазал тебя
  rationale: Qal perfect, 3-е лицо мужского рода единственного числа, с суффиксом 2-го лица. Сохранён прямой образ царского или посвятительного помазания.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В основном тексте первое אֱלֹהִים понято как подлежащее при «помазал». Допустимое звательное прочтение сохранено в примечании.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: 'Форма с суффиксом 2-го лица передана прямо; при основном синтаксическом прочтении это приложение, уточняющее подлежащее: «Бог, твой Бог».'
- source_word: שֶׁמֶן שָׂשׂוֹן
  choice: маслом радости
  rationale: Сопряжённая конструкция означает масло, связанное с радостью и торжеством. «Масло» понятно современному читателю и сохраняет конкретный образ; «елей» был бы более конфессионально и архаически окрашен.
- source_word: מֵחֲבֵרֶיךָ
  choice: более, чем твоих спутников
  rationale: Предлог מן выражает сравнение. «Спутники» передаёт людей одного круга с адресатом, не уточняя сверх текста, были ли они товарищами, соратниками или равными ему.
theological_decisions:
- issue: Синтаксическая роль первого אֱלֹהִים в выражении אֱלֹהִים אֱלֹהֶיךָ
  choice: 'Первое слово понято как подлежащее: «Бог, твой Бог, помазал тебя».'
  alternative: 'Первое אֱלֹהִים можно понимать как обращение: «о Боже, твой Бог помазал тебя».'
  rationale: Оба разбора грамматически возможны и богословски значимы. Основной текст следует естественному для данного глагольного предложения разбору с подлежащим, а звательное прочтение вынесено в примечание, чтобы не устранять подлинную неоднозначность еврейского текста.
- issue: Связь с Посланием к евреям 1:9
  choice: Указана только перекрёстная ссылка без навязывания новозаветного толкования самому псалму.
  alternative: Можно было встроить христологическое истолкование непосредственно в перевод или пояснение.
  rationale: Перевод должен передавать еврейский текст псалма и сохранять его напряжение; каноническое употребление стиха отмечается справочно, но не подменяет исходный смысл.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Сохранены параллелизм, прямая речь во 2-м лице и образ помазания; избегнуты избыточно церковнославянские слова. Строки разбиты по смысловым поэтическим единицам.
