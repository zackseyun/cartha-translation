- source_word: שְׁנוּנִים
  choice: остры
  rationale: Прилагательное или пассивное причастие со значением «острые, заострённые»; краткая форма сохраняет сжатость поэзии.
- source_word: עַמִּים
  choice: народы
  rationale: Множественное число от עַם; «народы» точно передаёт множественность отдельных человеческих сообществ.
- source_word: תַּחְתֶּיךָ
  choice: пред тобой
  rationale: Буквально «под тобой»; в русском воинско-царском контексте «падут пред тобой» естественно выражает поражение и подчинение, не устраняя исходный образ.
- source_word: יִפְּלוּ
  choice: падут
  rationale: Имперфект 3-го лица множественного числа допускает будущее или поэтически наглядное настоящее; русское будущее здесь звучит естественно.
- source_word: בְּלֵב
  choice: вонзятся в сердца
  rationale: Буквально «в сердце»; еврейская строка эллиптична, и по смыслу стрелы оказываются в сердцах врагов. Глагол «вонзятся» осторожно восполняет подразумеваемое действие для ясного русского синтаксиса.
- source_word: אוֹיְבֵי הַמֶּלֶךְ
  choice: врагов царя
  rationale: Конструктивная цепочка буквально означает «враги царя»; сохранено третье лицо без гармонизации с обращением «твои враги».
theological_decisions:
- issue: Кого обозначает «царь» в царском и мессиански воспринимаемом псалме
  choice: Сохранить непосредственное выражение «царь», не вводя в перевод явного мессианского отождествления.
  alternative: Передать как прямое указание на Мессию или заменить на «твоих врагов».
  rationale: В еврейском тексте сказано «царя». Перевод сохраняет историко-поэтическую формулировку и оставляет типологическое или мессианское прочтение сфере толкования.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Тире поддерживает сжатый ритм исходной строки; «пред тобой» идиоматичнее буквального «под тобой», а сноска сохраняет формальную структуру и подлинную неоднозначность еврейского текста.
