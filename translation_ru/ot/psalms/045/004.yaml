  text: וַ/הֲדָ֬רְ/ךָ֨ צְלַ֬ח רְכַ֗ב עַֽל דְּבַר אֱ֭מֶת וְ/עַנְוָה צֶ֑דֶק וְ/תוֹרְ/ךָ֖ נוֹרָא֣וֹת יְמִינֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/004.yaml
  text: In your majesty ride on victoriously for the cause of truth and meekness and righteousness[b][a]; let your right hand teach you awesome deeds.
translation:
  language: ru
  text: В величии своём победно скачи за истину, кротость и праведность[a]; десница твоя покажет тебе грозные дела[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за истину и кроткую праведность». Еврейское выражение сжато и допускает разную связь слов «кротость» и «праведность».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «и десница твоя научит тебя грозному».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲדָרְךָ
  choice: В величии своём
  rationale: הָדָר означает величие, великолепие или честь; обстоятельственный оборот естественно связывает это слово с повелениями, а союз ו передаёт продолжение поэтической речи.
- source_word: צְלַח רְכַב
  choice: победно мчись
  rationale: צְלַח выражает успешное, триумфальное продвижение, а רְכַב — езду верхом или на колеснице. «Мчись» сохраняет динамичный царственно-воинский образ, а «победно» передаёт значение успеха.
- source_word: עַל דְּבַר אֱמֶת
  choice: за истину
  rationale: עַל דְּבַר здесь может обозначать основание или дело, за которое выступает царь. Краткое «за истину» естественно по-русски и сохраняет смысл действия в её защиту.
- source_word: וְעַנְוָה צֶדֶק
  choice: кротость и праведность
  rationale: Сжатая еврейская конструкция допускает понимание двух существительных как однородного ряда. Такой перевод не превращает неоднозначное сочетание в однозначное «кроткую праведность»; альтернативная синтаксическая связь отмечена в сноске.
- source_word: וְתוֹרְךָ
  choice: явит тебе
  rationale: Форма от ירה в породе хифиль буквально означает «научит тебя», но в сочетании с десницей может идиоматически означать, что она покажет или явит совершаемое. «Явит тебе» сохраняет олицетворение и допускает действенный смысл.
- source_word: נוֹרָאוֹת
  choice: грозные дела
  rationale: Слово обозначает то, что внушает страх и благоговение. «Грозные дела» сохраняет устрашающую силу образа, не сводя его ни к морально плохому, ни только к восхитительному.
- source_word: יְמִינֶךָ
  choice: десница твоя
  rationale: Традиционное, но понятное в возвышенной библейской поэзии «десница» сохраняет образ правой руки как силы и победоносного действия.
theological_decisions:
- issue: Царственно-воинский образ псалма и его позднейшее мессианское прочтение
  choice: Сохранено непосредственное обращение к царю без внесения явного мессианского титула.
  alternative: Сформулировать стих так, чтобы прямо обозначить Мессию.
  rationale: Еврейский текст этого стиха представляет царское поэтическое обращение. Перевод сохраняет историко-литературный смысл и не препятствует каноническому мессианскому прочтению.
- issue: Синтаксис וְעַנְוָה צֶדֶק
  choice: «кротость и праведность» как ряд понятий.
  alternative: «кроткая праведность» или «кротость праведности».
  rationale: Конструкция предельно сжата и допускает несколько связей между существительными; основное чтение отражает отдельные лексемы, а подлинная неоднозначность сохранена в сноске.
- issue: Значение וְתוֹרְךָ נוֹרָאוֹת יְמִינֶךָ
  choice: «и десница твоя явит тебе грозные дела».
  alternative: «и десница твоя научит тебя грозному».
  rationale: Грамматически глагол означает «научит/покажет», а субъектом служит «десница». Выбранная формулировка сохраняет олицетворение, не предполагая, будто царь нуждается в нравственном наставлении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. «Десница» удерживает библейскую образность; прочая лексика остаётся доступной обычному читателю. Все маркеры сносок помещены в основной текст.
