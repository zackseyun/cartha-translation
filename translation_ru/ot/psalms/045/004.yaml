  terminology: «Величие», «истина», «кротость», «праведность» и «десница» удачны. «Грозные дела» передаёт внушающий страх и благоговение оттенок נוֹרָאוֹת, не сводя его к современному разговорному «потрясающие». Сноска а сохраняет спорную синтаксическую возможность; сноска б должна отражать более буквальное «научит».
