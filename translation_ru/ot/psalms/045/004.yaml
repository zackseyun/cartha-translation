  source_fidelity: 'Основной смысл передан верно: это царское побудительное обращение, связанное с истиной, кротостью и праведностью; мессианское истолкование не вносится. Однако «мчись» передаёт стремительность, но не выражает прямо רכַב («ехать/скакать верхом»). «Покажет» точнее отражает значение формы от ירה («научит, укажет, покажет»), чем несколько книжное и более одностороннее «явит».'
