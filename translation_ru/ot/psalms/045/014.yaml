  text: לִ/רְקָמוֹת֮ תּוּבַ֪ל לַ֫/מֶּ֥לֶךְ בְּתוּל֣וֹת אַ֭חֲרֶי/הָ רֵעוֹתֶ֑י/הָ מ֖וּבָא֣וֹת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/045/014.yaml
  text: In embroidered garments she is led to the king[a]; virgins behind her, her companions[c][b], are brought to you.
translation:
  language: ru
  text: В расшитых одеждах её ведут к царю[a]; за нею следуют девы[b], её подруги; их приводят к тебе[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В вышитом наряде её приводят к царю».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово обозначает незамужних девственниц; возможный перевод: «девушки».'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте «к тебе» — обращение к женщине в единственном числе, вероятно к невесте. Некоторые переводы сглаживают эту смену адресата, относя заключительные слова к царю.
    reason: alternative_reading
lexical_decisions:
- source_word: לִרְקָמוֹת
  choice: в расшитых одеждах
  rationale: Существительное רְקָמוֹת обозначает вышитую или пёструю тканую работу. Слово «одеждах» добавлено по контексту свадебного шествия; предложная конструкция передаёт описательное значение еврейского לִ.
- source_word: תּוּבַל
  choice: её ведут
  rationale: 'Хофаль, 3-е лицо женского рода единственного числа от יבל: «быть приведённой/ведомой». В сцене торжественного шествия «ведут» звучит естественно и сохраняет пассивный смысл посредством неопределённо-личной конструкции.'
- source_word: לַמֶּלֶךְ
  choice: к царю
  rationale: Предлог ל указывает направление движения; «к царю» прямо и естественно передаёт это значение.
- source_word: בְּתוּלוֹת
  choice: девы
  rationale: בְּתוּלוֹת конкретно обозначает незамужних девственниц. Поэтическое «девы» сохраняет эту смысловую точность лучше, чем более широкое «девушки», и соответствует возвышенному регистру псалма.
- source_word: אַחֲרֶיהָ
  choice: за нею следуют
  rationale: В контексте процессии слово означает движение следом за невестой. Глагол «следуют» добавлен для естественного русского синтаксиса и не меняет образа.
- source_word: רֵעוֹתֶיהָ
  choice: её подруги
  rationale: Форма обозначает спутниц или подруг. «Подруги» передаёт личную связь, не уточняя без достаточного основания их церемониальную должность.
- source_word: מוּבָאוֹת
  choice: их приводят
  rationale: Хофаль, причастие женского рода множественного числа от בוא. Неопределённо-личная конструкция естественно передаёт пассив «приводятся» и согласуется с предшествующими «девами» и «подругами».
- source_word: לָךְ
  choice: к тебе
  rationale: Суффикс 2-го лица женского рода единственного числа обращён к невесте. Русское «тебе» не выражает рода, однако точно сохраняет второе лицо и неожиданный переход к прямому обращению.
theological_decisions:
- issue: Смена адресата в заключительном לָךְ
  choice: 'Сохранить второе лицо: «к тебе», понимая еврейскую форму как обращение женского рода единственного числа к невесте.'
  alternative: Сгладить переход как «к нему», «к царю» или «вместе с нею».
  rationale: Масоретский текст однозначно содержит суффикс 2-го лица женского рода единственного числа. Перевод сохраняет поэтическую смену перспективы и не исправляет напряжение текста без рукописного основания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. «Девы» выбрано ради лексической точности и свадебно-псалмического регистра; устаревшие местоименные и глагольные формы исключены. Неопределённо-личные конструкции «её ведут» и «их приводят» естественно воспроизводят еврейские пассивы.
