  text: И царь возжелает твоей красоты[a], ведь он — твой господин; поклонись ему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «да возжелает царь твоей красоты»; еврейскую форму можно понимать как сообщение о будущем или как пожелание с волитивным оттенком.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вырази ему почтение». Еврейский глагол означает преклонение перед высшим — в царском или религиозном контексте; возможен также перевод «поклоняйся ему».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיִתְאָו
  choice: И … возжелает
  rationale: 'Форма хитпаэль, имперфект 3 м. ед. ч., естественно передаёт будущее действие: «возжелает». Поэтическое «возжелает» сохраняет значение сильного влечения и соответствует возвышенному регистру псалма; возможный волитивный оттенок отмечен в сноске.'
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное; в русском контексте определённость естественно передаётся без артикля.
- source_word: יָפְיֵךְ
  choice: твоей красоты
  rationale: Существительное со суффиксом 2 ж. ед. ч.; прямой и естественный эквивалент — «твоя красота».
- source_word: כִּי
  choice: ведь
  rationale: Передаёт причинное обоснование и естественно связывает части поэтической строки.
- source_word: הוּא
  choice: он
  rationale: Самостоятельное местоимение сохранено для выраженного в еврейском тексте акцента.
- source_word: אֲדֹנַיִךְ
  choice: твой господин
  rationale: Форма אָדוֹן со суффиксом 2 ж. ед. ч. Здесь это титул царя и обозначение отношения к нему, а не Божественное имя; «господин» точнее сохраняет это различие, чем «Господь».
- source_word: וְהִשְׁתַּחֲוִי
  choice: поклонись
  rationale: Повелительная форма от שׁחה обозначает преклонение перед кем-либо. «Поклонись» сохраняет жест почтения, не уточняя без необходимости, является ли он придворным или религиозным.
- source_word: לוֹ
  choice: ему
  rationale: Предлог ל с местоименным суффиксом 3 м. ед. ч.; по-русски естественно передаётся дательным падежом.
theological_decisions:
- issue: Следует ли передавать וְהִשְׁתַּחֲוִי לּוֹ явно религиозным словом
  choice: поклонись ему
  alternative: почти его / поклонись ему как Богу
  rationale: Глагол может обозначать преклонение как перед Богом, так и перед земным властителем. Основной текст сохраняет эту смысловую открытость и не навязывает культового толкования.
- issue: Как понимать модальность וְיִתְאָו
  choice: царь возжелает
  alternative: пусть царь возжелает / да возжелает царь
  rationale: Имперфект наиболее прямо допускает чтение как будущего времени. Вместе с тем поэтический контекст позволяет услышать пожелательный или волитивный оттенок, поэтому альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмической окраской. «Возжелает» выбрано как уместное поэтическое слово, тогда как синтаксис остаётся ясным и современным. Строчная буква в слове «господин» не превращает царский титул в Божественное имя.
