lexical_decisions:
- source_word: הַֽלְלוּ
  choice: Хвалите
  rationale: Форма повелительного наклонения, множественного числа, породы пиэль от הלל; передаёт прямой призыв воздавать хвалу и естественно звучит по-русски.
- source_word: אֶת יְהוָה
  choice: Яхве
  rationale: Частица прямого дополнения перед тетраграмматоном YHWH. Транслитерация «Яхве» сохраняет личное имя Бога; традиционное «Господа» указано в сноске.
- source_word: כָּל גּוֹיִם
  choice: все народы
  rationale: גּוֹיִם обозначает народы или этнические общности; «все народы» точно передаёт всеобщий характер призыва.
- source_word: שַׁבְּחוּהוּ
  choice: славьте Его
  rationale: Повелительная форма множественного числа от שבח с местоименным суффиксом 3-го лица мужского рода единственного числа. «Славьте Его» сохраняет отличие от первого глагола и поэтический параллелизм.
- source_word: כָּל הָאֻמִּים
  choice: все племена
  rationale: אֻמִּים означает народы, племена или этнические общности. «Все племена» позволяет не смешивать слово с предшествующим גּוֹיִם, сохраняя смысловой параллелизм без чрезмерного отождествления.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное Божье имя YHWH. «Яхве» прямо представляет имя, тогда как «Господь» отражает древнюю традицию благоговейного замещения; альтернативная передача отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным поэтическим звучанием. Два параллельных призыва переданы разными глаголами («хвалите», «славьте»), а близкие существительные — как «народы» и «племена», чтобы отразить лексическое варьирование оригинала.
