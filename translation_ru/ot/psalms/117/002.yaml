source:
  edition: WLC
  text: כִּ֥י גָ֘בַ֤ר עָלֵ֨י/נוּ חַסְדּ֗/וֹ וֶֽ/אֱמֶת יְהוָ֥ה לְ/עוֹלָ֗ם הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/117/002.yaml
  text: For his steadfast love has prevailed over us[a], and the faithfulness of Yahweh is forever. Praise Yah!
translation:
  language: ru
  text: Ибо Его верная любовь возобладала над нами, и верность[a] Яхве — навеки. Хвалите Ях!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «истина».'
    reason: Лексема אֱמֶת может обозначать как верность и надёжность, так и истину.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для призыва к хвале в предыдущем стихе и естественно сохраняет причинную связь.
- source_word: גָבַר עָלֵינוּ
  choice: возобладала над нами
  rationale: Передаёт активную силу глагола גבר — «быть сильным, одолевать, преобладать» — и сохраняет образ любви, проявившей над нами непреодолимую силу.
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: Сочетание передаёт и любовь, и устойчивую преданность, заключённые в многозначном חֶסֶד, не сводя его только к милости.
- source_word: וֶאֱמֶת
  choice: и верность
  rationale: В паре с חֶסֶד слово אֱמֶת естественно обозначает надёжность и верность; буквальное значение «истина» сохранено в примечании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное Божье имя, а не заменяет его титулом.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко и поэтично передаёт неограниченную длительность; тире естественно восполняет отсутствующую в еврейском именную связку.
- source_word: הַלְלוּ יָהּ
  choice: Хвалите Яха!
  rationale: Передаёт повеление «хвалите» и сохраняет краткую форму Божьего имени יָהּ.
theological_decisions:
- issue: Передача многозначного אֱמֶת в сочетании с חֶסֶד
  choice: верность
  alternative: истина
  rationale: Контекст устойчивой Божьей любви поддерживает значение «верность», однако слово также прямо означает «истина»; эта подлинная неоднозначность отмечена, а не устранена.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя, поэтому транслитерация сохраняет различие между именем и титулом.
- issue: Образ глагола גָבַר с предлогом עַל
  choice: возобладала над нами
  alternative: велика к нам
  rationale: Выбранный вариант сохраняет динамический образ мощи и преобладания; традиционный вариант звучит мягче, но ослабляет глагольную силу оригинала.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Заглавная буква в «Его» употреблена как уважительное обозначение Бога. Формы «Яхве» и «Ях» последовательно сохраняют полную и краткую формы Божьего имени.
