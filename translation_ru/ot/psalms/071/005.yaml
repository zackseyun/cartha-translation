lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание предшествующей просьбы; «ведь» естественно передаёт причинно-пояснительную связь в современном русском языке.
- source_word: אַתָּה
  choice: Ты
  rationale: Личное местоимение явно выражено в еврейском тексте и сохранено ради смыслового акцента в прямом обращении к Богу.
- source_word: תִקְוָתִי
  choice: моя надежда
  rationale: Существительное обозначает надежду или ожидание; «моя надежда» точно и естественно звучит в контексте молитвы.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт титул אֲדֹנָי, а «Яхве» — личное имя יהוה, сохраняя различие между двумя компонентами сочетания и избегая неясного «Господь Господь».
- source_word: מִבְטַחִי
  choice: моё упование
  rationale: Слово указывает на того, на кого возлагают доверие, или на основание уверенности. «Моё упование» естественно относится к Богу и сохраняет параллелизм с «моей надеждой».
- source_word: מִנְּעוּרָי
  choice: с юности
  rationale: Предлог מן обозначает исходную точку продолжительного доверия; русское «с юности» ясно выражает этот временной смысл.
theological_decisions:
- issue: Передача сочетания божественного титула אֲדֹנָי и имени יהוה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Выбранный вариант не смешивает титул с личным именем и непосредственно отражает оба элемента еврейского текста, не привнося конфессионального истолкования.
- issue: Характер доверия, выраженный словом מִבְטַחִי
  choice: моё упование
  alternative: моя опора; моя уверенность
  rationale: «Упование» допускает как субъективное доверие, так и указание на Бога как на его основание; тем самым не устраняется присущая существительному смысловая широта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Порядок слов сделан естественным для русского, при этом сохранены обращение, параллелизм «моя надежда — моё упование» и временная перспектива, начинающаяся в юности.
