  yaml_path: translation/ot/psalms/071/010.yaml
  text: For my enemies speak against me[b][a], and those who watch for my life consult together.
translation:
  language: ru
  text: Ибо враги мои говорят против меня, и те, кто подстерегает мою жизнь[a], совещаются вместе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «следят за моей жизнью», «подстерегают меня» или «ищут моей смерти».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «держат совет»; в этом враждебном контексте глагол может также иметь смысл «сговариваются».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующей мольбы; «ибо» естественно сохраняет пояснительную связь в поэтической речи.
- source_word: אָמְרוּ
  choice: говорят
  rationale: Хотя в еврейском употреблена перфектная форма, в поэтическом контексте она обозначает актуальную враждебную речь; настоящее время естественно по-русски.
- source_word: אוֹיְבַי לִי
  choice: враги мои говорят против меня
  rationale: Сочетание לִי в данном враждебном контексте передаёт направленность речи против псалмопевца, а не просто обращение к нему.
- source_word: וְשֹׁמְרֵי נַפְשִׁי
  choice: и те, кто подстерегает мою жизнь
  rationale: Глагол שׁמר здесь означает враждебное наблюдение с намерением причинить вред, а נֶפֶשׁ обозначает жизнь самого человека, находящуюся в опасности.
- source_word: נוֹעֲצוּ
  choice: совещаются
  rationale: Нифаль глагола יעץ передаёт совместное обсуждение замысла. «Совещаются» сохраняет основной смысл, не усиливая его до однозначного «сговариваются».
- source_word: יַחְדָּו
  choice: вместе
  rationale: Наречие прямо указывает на согласованность действий.
