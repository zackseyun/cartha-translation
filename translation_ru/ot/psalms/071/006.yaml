  yaml_path: translation/ot/psalms/071/006.yaml
  text: Upon you I have leaned from the womb; from my mother’s inward parts you are the one who brought me out[a]. In you is my praise continually.
translation:
  language: ru
  text: 'На Тебя я опирался от утробы;

    из недр матери моей Ты извлёк меня[a].

    В Тебе — хвала моя всегда.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более гладко: «из материнской утробы Ты вывел меня». Буквально здесь сказано: «из внутренностей матери моей»; употреблено другое слово, чем в первой строке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיךָ נִסְמַכְתִּי
  choice: я опирался на Тебя
  rationale: Сочетание предлога עַל с формой нифаля глагола סמך передаёт зависимость и сохраняет конкретный образ опоры; «полагался» возможно, но менее образно.
- source_word: מִבֶּטֶן
  choice: с самого рождения
  rationale: Буквально בטן означает «живот, утроба», но конструкция с מִ здесь указывает на начало жизненного пути. «С самого рождения» естественно звучит по-русски и передаёт временной смысл, тогда как буквальное «от утробы» было бы архаичным и неестественным.
- source_word: מִמְּעֵי אִמִּי
  choice: из недр моей матери
  rationale: מֵעֶה обозначает внутренности, внутренние органы. «Из недр моей матери» сохраняет отличие от בטן в первой строке и остаётся понятным поэтическим выражением; более гладкое «из материнской утробы» дано в примечании.
- source_word: אַתָּה גוֹזִי
  choice: Ты извлёк меня
  rationale: Самостоятельное местоимение אַתָּה подчёркивает Божье действие. Редкая форма גוֹזִי в данном контексте традиционно понимается как выведение или извлечение ребёнка из материнского тела; перевод не расширяет её до общего понятия избавления.
- source_word: בְּךָ תְהִלָּתִי תָמִיד
  choice: Тебе хвала моя всегда
  rationale: Русский дательный «Тебе» естественно обозначает направленность хвалы к Богу. «Всегда» кратко и точно передаёт непрерывность, выраженную תָמִיד.
theological_decisions:
- issue: Участие Бога в рождении псалмопевца
  choice: Бог представлен как Тот, Кто извлёк псалмопевца из материнского тела.
  alternative: Бог лишь поддерживал псалмопевца с момента рождения.
  rationale: Образ גוֹזִי в контексте выхода из материнских недр приписывает Богу деятельное участие в рождении, однако перевод не вводит более широких догматических утверждений.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим строем. Инверсия «Тебе хвала моя всегда» сохраняет достоинство и краткость древнееврейской строки без выраженной архаизации.
