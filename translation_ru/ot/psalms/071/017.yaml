  text: אֱֽלֹהִ֗ים לִמַּדְתַּ֥/נִי מִ/נְּעוּרָ֑/י וְ/עַד הֵ֝֗נָּה אַגִּ֥יד נִפְלְאוֹתֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/017.yaml
  text: God[a], you have taught me from my youth, and to this day I declare your wondrous deeds.
translation:
  language: ru
  text: Боже, Ты учил меня с юности моей, и доныне я возвещаю о Твоих чудесных делах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о Твоих чудесах»; также возможно: «о Твоих дивных деяниях».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения естественно передаёт молитвенное обращение к Богу, подразумеваемое еврейским синтаксисом и подтверждаемое формами второго лица.
- source_word: לִמַּדְתַּנִי
  choice: Ты учил меня
  rationale: Порода пиэль глагола למד с суффиксом первого лица означает «Ты учил/наставлял меня». Несовершенный по виду русский глагол естественно выражает продолжительное обучение с юных лет.
- source_word: מִנְּעוּרָי
  choice: с юности моей
  rationale: Передаёт исходную временную точку и сохраняет несколько возвышенный поэтический регистр псалма.
- source_word: וְעַד הֵנָּה
  choice: и доныне
  rationale: Кратко и литературно передаёт продолжение действия вплоть до настоящего момента.
- source_word: אַגִּיד
  choice: я возвещаю
  rationale: Глагол נגד в хифиле означает «сообщать, объявлять, возвещать». Настоящее время по-русски естественно передаёт продолжающееся свидетельство, а «возвещаю» соответствует хвалебному контексту, не усиливая значение до проповеди.
- source_word: נִפְלְאוֹתֶיךָ
  choice: о Твоих чудесных делах
  rationale: Существительное обозначает дивные, необычайные деяния Бога; развёрнутый вариант ясно выражает подразумеваемые действия и звучит естественно по-русски.
theological_decisions:
- issue: Сохранение прямого обращения к Богу
  choice: «Боже, Ты учил меня…»
  alternative: Повествовательное высказывание о Боге
  rationale: Сочетание אֱלֹהִים с последующими формами второго лица естественнее всего понимать как прямое молитвенное обращение.
- issue: Характер Божьих נִפְלָאוֹת
  choice: «чудесные дела»
  alternative: «чудеса»
  rationale: Выражение «чудесные дела» сохраняет акцент на Божьих действиях, не сужая их непременно до сверхъестественных знамений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы как допустимая традиционная издательская норма. Маркер сноски поставлен непосредственно после выражения, к которому относится.
