  source_fidelity: 'Текст точно передаёт основные элементы еврейского стиха: образ «уста мои», продолженное возвещение, Божью праведность и спасение, указание «весь день» и мотив неисчислимости. Оборот «не знаю им счёта» удачно и естественно передаёт סְפֹרוֹת в контексте, не создавая ложной определённости относительно подразумеваемого соотнесения.'
