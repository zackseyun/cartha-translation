  text: פִּ֤/י יְסַפֵּ֬ר צִדְקָתֶ֗/ךָ כָּל הַ/יּ֥וֹם תְּשׁוּעָתֶ֑/ךָ כִּ֤י לֹ֖א יָדַ֣עְתִּי סְפֹרֽוֹת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/015.yaml
  text: My mouth will recount your righteousness and your salvation all day long[b][a], for I do not know their number.
translation:
  language: ru
  text: Уста мои будут весь день возвещать о Твоей праведности[a] и Твоём спасении, ведь я не знаю им счёта[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоей справедливости»; возможен также смысл: «Твоих праведных дел».'
    reason: lexical_alternative
  - marker: b
    text: То есть праведным и спасительным деяниям Бога нет числа.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּי
  choice: Уста мои
  rationale: Сохранён конкретный образ «моих уст», подчёркивающий устное провозглашение хвалы; «уста» уместны в возвышенной поэтической речи и понятны современному читателю.
- source_word: יְסַפֵּר
  choice: будут возвещать
  rationale: Порода пиэль глагола ספר означает рассказывать, подробно излагать или провозглашать. «Возвещать» естественно сочетается с Божьей праведностью и спасением, сохраняя смысл открытого словесного свидетельства.
- source_word: צִדְקָתֶךָ
  choice: о Твоей праведности
  rationale: Абстрактное существительное передано прямо как «праведность», без сведения смысла только к справедливому суду или отдельным праведным деяниям.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Естественное современное выражение непрерывной или постоянно возобновляемой хвалы на протяжении дня.
- source_word: תְּשׁוּעָתֶךָ
  choice: о Твоём спасении
  rationale: «Спасение» сохраняет широкий богословский и поэтический смысл; более узкое «избавление» остаётся возможным по контексту.
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание для непрестанного возвещения; «ведь» естественно передаёт причинно-пояснительную связь.
- source_word: לֹא יָדַעְתִּי סְפֹרוֹת
  choice: я не знаю им счёта
  rationale: Русская идиома точно передаёт отсутствие известного числа и контекстуальную неисчислимость Божьих праведных и спасительных проявлений, сохраняя первое лицо еврейского текста.
theological_decisions:
- issue: Передавать ли צִדְקָתֶךָ как отвлечённое качество или как конкретные праведные и справедливые деяния Бога.
  choice: Твоя праведность
  alternative: Твоя справедливость; Твои праведные дела
  rationale: Еврейское слово стоит в единственном числе и естественно обозначает «праведность», однако в псалмах Божья праведность проявляется в Его верных, справедливых и спасительных деяниях. Основной текст сохраняет эту смысловую напряжённость, а примечание указывает допустимые оттенки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Формула «Уста мои» сохраняет образ еврейского текста, а оборот «не знаю им счёта» звучит естественно и передаёт игру смыслов, связанную с глаголом «рассказывать/перечислять» и словом «число».
