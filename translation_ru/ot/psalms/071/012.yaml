  text: Боже, не удаляйся от меня; Боже мой, поспеши мне на помощь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма прямого обращения к Богу; русский звательный остаток «Боже» естественен и уместен в современной молитвенной речи.
- source_word: אַל תִּרְחַק
  choice: не удаляйся
  rationale: Передаёт отрицательную просьбу и пространственно-реляционную метафору глагола רחק без добавления значения оставления.
- source_word: מִמֶּנִּי
  choice: от меня
  rationale: Прямо передаёт предлог отделения с суффиксом первого лица единственного числа.
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Сохраняет повторное прямое обращение и личный суффикс «мой».
- source_word: לְעֶזְרָתִי
  choice: мне на помощь
  rationale: Естественный русский эквивалент буквального «к/для моей помощи» при глаголе поспешности.
- source_word: חִישָׁה
  choice: поспеши
  rationale: Точно и ясно передаёт повелительную просьбу поторопиться, не добавляя отсутствующего в еврейском тексте глагола «прийти».
theological_decisions:
- issue: Повторение Божьего имени в прямом обращении
  choice: Боже ... Боже мой
  alternative: Бог ... мой Бог
  rationale: Русские формы обращения естественно выражают молитвенный характер стиха и сохраняют усиление личной зависимости во втором обращении, не придавая тексту особой конфессиональной окраски.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии; синтаксис краткий и настойчивый. Архаическое «возспеши» и разговорное «поторопись» отвергнуты.
