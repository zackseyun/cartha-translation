  yaml_path: translation/ot/psalms/071/023.yaml
  text: My lips will shout for joy when I sing praise to you[a], and my soul[c][b], which you have redeemed.
translation:
  language: ru
  text: Возликуют мои уста, когда я буду петь Тебе хвалу[a], и возликует душа моя[b], которую Ты искупил[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо я пою хвалу Тебе». Еврейский союз допускает причинное понимание.'
    reason: syntactic_alternative
  - marker: b
    text: 'Или: «жизнь моя», «всё моё существо». Еврейское нефеш может обозначать душу, жизнь или самого человека.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «выкупил», «избавил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרַנֵּנָּה
  choice: возликуют
  rationale: Пиэль глагола רנן передаёт громкое радостное восклицание или ликующее пение; «возликуют» естественно сочетается с поэтическим образом уст и не сводит значение только к крику или только к мелодии.
- source_word: שְׂפָתַי
  choice: мои уста
  rationale: Сохраняет конкретный поэтический образ органа речи; «уста» соответствует достоинству поэтической речи и остаётся понятным современному читателю.
- source_word: כִּי
  choice: когда
  rationale: Здесь частица естественно обозначает обстоятельство, при котором уста ликуют, хотя возможно и причинное понимание.
- source_word: אֲזַמְּרָה
  choice: я буду петь хвалу
  rationale: Пиэль זמר обычно означает музыкально прославлять; формула передаёт и пение, и направленность хвалы.
- source_word: לָךְ
  choice: Тебе
  rationale: Предлог указывает на адресата хвалебного пения.
- source_word: וְנַפְשִׁי
  choice: и душа моя
  rationale: Сохраняет параллелизм внешнего выражения («уста») и внутреннего существа; слово נפשׁ при этом шире русского «душа», что отмечено в сноске.
- source_word: אֲשֶׁר
  choice: которую
  rationale: Относительное местоимение связывает «душу» с совершённым Богом искуплением.
- source_word: פָּדִיתָ
  choice: Ты искупил
  rationale: פדה означает освобождение посредством выкупа или избавление; «искупил» сохраняет широкую библейскую и богословскую насыщенность без уточнения механизма.
theological_decisions:
- issue: Значение פדה в контексте хвалы
  choice: искупил
  alternative: выкупил; избавил
  rationale: Текст связывает хвалу со спасительным действием Бога. «Искупил» удерживает смысл освобождения и выкупа, не навязывая стиху более узкой поздней догматической схемы.
- issue: Значение נפשׁ
  choice: душа
  alternative: жизнь; всё моё существо; я сам
  rationale: «Душа» сохраняет традиционный поэтический контраст с «устами», однако многозначность еврейского слова явно сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Инверсия «душа моя» поддерживает ритм и библейскую поэтичность, не делая текст архаичным; заглавные местоимения адресата употреблены как принятая русская форма благоговейного обращения.
