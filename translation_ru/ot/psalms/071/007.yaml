  text: כְּ֭/מוֹפֵת הָיִ֣יתִי לְ/רַבִּ֑ים וְ֝/אַתָּ֗ה מַֽחֲסִ/י עֹֽז־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/007.yaml
  text: I have become like a portent to many[a], but you are my strong refuge.
translation:
  language: ru
  text: Для многих я стал словно знамением[a], но Ты — моё крепкое прибежище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чудом», «знаком» или «предметом изумления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמוֹפֵת
  choice: словно знамением
  rationale: 'Существительное מוֹפֵת обозначает знамение, чудо или нечто необычайное, вызывающее изумление; частица כְּ передана словом «словно». «Знамение» сохраняет намеренную неопределённость: речь может идти о поразительном знаке, чуде или предостережении.'
- source_word: הָיִיתִי
  choice: я стал
  rationale: Форма qatal 1-го лица ед. числа от היה описывает наступившее состояние; в данном контексте естественное русское соответствие — «я стал».
- source_word: לְרַבִּים
  choice: для многих
  rationale: Предлог לְ при רַבִּים указывает на тех, для кого псалмопевец стал знамением; «для многих» звучит естественно по-русски.
- source_word: מַחֲסִי
  choice: моё прибежище
  rationale: מַחֲסֶה означает убежище или место защиты. «Прибежище» сохраняет поэтический образ и остаётся понятным в современном литературном русском.
- source_word: עֹז
  choice: надёжное
  rationale: Буквально сочетание означает «прибежище силы / крепости». Прилагательное «надёжное» естественно передаёт смысл крепкой, действенной защиты, хотя менее буквально, чем «крепкое».
theological_decisions:
- issue: Оттенок מוֹפֵת применительно к положению псалмопевца перед людьми
  choice: Псалмопевец стал для многих поразительным знамением, причём положительный или зловещий характер этого знака не уточняется.
  alternative: «чудом», «знаком» или «предметом изумления»
  rationale: Еврейское слово допускает несколько оттенков. «Знамение» и примечание сохраняют эту смысловую напряжённость, не сводя образ ни к положительному чуду, ни к зловещему предвестию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической лексикой. Местоимение «Ты» написано с прописной буквы как принятая в русском религиозном тексте форма обращения к Богу. Порядок второй части подчёркивает противопоставление וְאַתָּה.
