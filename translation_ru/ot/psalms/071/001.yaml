source:
  edition: WLC
  text: בְּ/ךָֽ יְהוָ֥ה חָסִ֑יתִי אַל אֵב֥וֹשָׁה לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/001.yaml
  text: In you[a], O Yahweh, I have taken refuge; let me never be put to shame.
translation:
  language: ru
  text: В Тебе, Яхве[a], я нашёл прибежище; да не буду постыжен вовек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. יהוה (YHWH) — личное имя Бога; традиционно передаётся как «Господь».
    reason: alternative_reading
lexical_decisions:
- source_word: בְּךָ
  choice: В Тебе
  rationale: Предлог ב с местоименным суффиксом обозначает здесь Бога как прибежище. Буквальный образ сохранён без добавления отсутствующего в еврейском тексте усиления «только».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
- source_word: חָסִיתִי
  choice: я нашёл прибежище
  rationale: Глагол חסה означает искать или находить защиту, прибегать под покровительство. Форма перфекта передана как совершившееся действие с сохраняющимся результатом; образ прибежища не сведён к более общему «уповаю».
- source_word: אַל אֵבוֹשָׁה
  choice: да не буду постыжен
  rationale: אַל с формой первого лица выражает отрицательную просьбу или пожелание. «Постыжен» передаёт не только внутреннее смущение, но и публичное посрамление, несостоятельность надежды.
- source_word: לְעוֹלָם
  choice: вовек
  rationale: В сочетании с отрицанием выражает просьбу никогда не оказаться постыженным. «Вовек» лаконично и уместно для поэтической молитвы.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация сохраняет различие между именем יהוה и титулом אֲדֹנָי, а традиционная замена указана в сноске.
- issue: Характер упования в חָסִיתִי
  choice: я нашёл прибежище
  alternative: я уповаю
  rationale: Выбрана формулировка, сохраняющая конкретный образ защитного убежища; она не ограничивает богословский смысл одним лишь внутренним доверием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Формулы «да не буду» и «вовек» сохраняют молитвенно-поэтический регистр, оставаясь понятными современному читателю.
