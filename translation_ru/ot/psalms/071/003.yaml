base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/003.yaml
  text: Be for me a rock of refuge[a], to which I may always come; you have commanded salvation for me[b], for you are my crag and my fortress.
translation:
  language: ru
  text: Будь для меня скалой — убежищем[a], куда я всегда могу приходить. Ты повелел спасти меня[b], ведь Ты — моя скала и моя крепость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скалой, жилищем».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Ты определил спасти меня». Буквально: «Ты повелел спасти меня»; не сказано, кому дано повеление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֱיֵה לִי
  choice: Будь для меня
  rationale: Императив выражает прямую молитвенную просьбу; «для меня» естественно передаёт отношение и пользу.
- source_word: לְצוּר מָעוֹן
  choice: скалой-убежищем
  rationale: Сочетание сохраняет образ скалы и передаёт защитный смысл מָעוֹן; буквальная возможность «скалой-жилищем» отмечена в сноске.
- source_word: לָבוֹא תָּמִיד
  choice: куда я всегда могу приходить
  rationale: Инфинитив בוא указывает на место, куда приходит молящийся; תָּמִיד передано естественным «всегда».
- source_word: צִוִּיתָ לְהוֹשִׁיעֵנִי
  choice: Ты повелел спасти меня
  rationale: Формально и естественно сохраняет значение глагола «повелеть» и буквальную инфинитивную конструкцию «спасти меня», не превращая её в явно не выраженное притяжательное «моё спасение».
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание просьбы; «ведь» естественно для современной русской молитвенно-поэтической речи.
- source_word: סַלְעִי וּמְצוּדָתִי
  choice: моя скала и моя крепость
  rationale: Сохраняет два защитных образа и повтор притяжательного суффикса; «скала» уместно для סלע, «крепость» — для מצודה.
theological_decisions:
- issue: Следует ли истолковывать צִוִּיתָ לְהוֹשִׁיעֵנִי как Божье предопределение спасения или сохранять образ повеления
  choice: Ты повелел спасти меня
  alternative: Ты определил спасти меня; Ты повелел даровать мне спасение
  rationale: В еврейском тексте прямо употреблён глагол «повелеть». Выбранная формулировка сохраняет сильный образ действенного Божьего повеления, но не связывает его с более узкой доктринальной схемой и не уточняет не названного исполнителя.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Заглавное «Ты» употреблено как традиционное уважительное обращение к Богу. Дефисное «скала-убежище» позволяет кратко сохранить оба элемента еврейского сочетания; пунктуация разделяет просьбу, утверждение о повелении и его основание.
