  text: אַֽל תַּ֭שְׁלִיכֵ/נִי לְ/עֵ֣ת זִקְנָ֑ה כִּ/כְל֥וֹת כֹּ֝חִ֗/י אַֽל תַּעַזְבֵֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/009.yaml
  text: Do not cast me off in the time of old age[a]; when my strength fails[c][b], do not forsake me.
translation:
  language: ru
  text: Не отвергни меня в пору старости[a]; когда иссякнет моя сила[b], не покинь меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не отбрось меня». Еврейский глагол может передавать образ отбрасывания прочь или отвержения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда моя сила будет истощена».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «не оставь меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּשְׁלִיכֵנִי
  choice: не отвергни меня
  rationale: Порода hифиль глагола שלך передаёт образ отбрасывания или удаления. «Не отвергни меня» естественно звучит по-русски применительно к человеку и сохраняет смысл отвержения, хотя конкретный образ отбрасывания обозначен в сноске.
- source_word: לְעֵת זִקְנָה
  choice: в пору старости
  rationale: עֵת означает время или пору, а זִקְנָה — старость. «В пору старости» сохраняет временной компонент выражения и звучит естественно в современной литературной молитвенной речи.
- source_word: כִּכְלוֹת
  choice: когда иссякнет
  rationale: Инфинитив כלה с כִּ вводит временное обстоятельство и выражает окончательное истощение. «Когда иссякнет» кратко и образно передаёт постепенное израсходование силы.
- source_word: כֹּחִי
  choice: моя сила
  rationale: כֹּחַ означает силу, мощь или жизненную крепость; в контексте старости «моя сила» — наиболее прямой и естественный эквивалент.
- source_word: תַּעַזְבֵנִי
  choice: не покинь меня
  rationale: עזב может означать оставить, покинуть или бросить. «Не покинь меня» ясно передаёт мольбу о продолжающемся Божьем присутствии и позволяет отличить этот глагол от предшествующего שלך.
- source_word: אַל
  choice: не
  rationale: אַל с формой имперфекта выражает запрет или настойчивую отрицательную просьбу; русская конструкция «не» с повелительной формой естественно передаёт молитвенную мольбу.
theological_decisions:
- issue: Характер просьбы в связи со старостью и Божьим присутствием
  choice: Прямая просьба к Богу не отвергать и не покидать молящегося, когда в старости иссякают его силы
  alternative: Общая жалоба на страдание без особого акцента на старости
  rationale: Еврейский текст прямо связывает просьбу с порой старости и иссякновением силы. Перевод сохраняет эту конкретную зависимость от Бога, не добавляя не выраженных в стихе доктринальных утверждений.
translation_notes:
  register: Современный литературный русский язык с достойным молитвенным звучанием. «В пору старости» сохраняет выраженное в еврейском тексте указание на время; «иссякнет» передаёт истощение без тяжеловесной буквальности. Пара «отвергни / покинь» сохраняет смысловое различие двух еврейских глаголов.
