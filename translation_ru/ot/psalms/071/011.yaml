  text: 'говоря: «Бог оставил его; преследуйте и схватите его, ведь некому его избавить».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵאמֹר
  choice: говоря
  rationale: Инфинитив от אמר вводит прямую речь; деепричастие естественно передаёт эту дискурсивную функцию и сохраняет связь с предшествующим контекстом.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологическую форму множественного числа, согласованный глагол עֲזָבוֹ стоит в единственном числе, поэтому здесь имеется в виду Бог.
- source_word: עֲזָבוֹ
  choice: оставил его
  rationale: Форма qal перфекта 3-го лица мужского рода единственного числа с объектным суффиксом. «Оставил» точно и естественно передаёт עזב, не снимая напряжения в словах врагов.
- source_word: רִדְפוּ
  choice: преследуйте
  rationale: Императив множественного числа от רדף; «преследуйте» передаёт враждебную погоню без лишнего уточнения её цели.
- source_word: וְתִפְשׂוּהוּ
  choice: и схватите его
  rationale: Императив множественного числа от תפשׂ с объектным суффиксом; «схватите» сохраняет прямоту и физическую конкретность действия.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для призыва врагов; «ведь» естественно выражает причинно-пояснительную связь в прямой речи.
- source_word: אֵין מַצִּיל
  choice: некому его избавить
  rationale: אֵין отрицает наличие лица, а причастие Hiphil מַצִּיל обозначает того, кто избавляет. Конструкция сохраняет личный смысл отсутствующего избавителя и звучит естественно по-русски.
theological_decisions:
- issue: Утверждение врагов о том, что Бог оставил псалмопевца
  choice: «Бог оставил его» как содержание прямой речи врагов
  alternative: «Бог покинул его» или формулировка, представляющая это как объективное утверждение повествователя
  rationale: Текст передаёт насмешливое заключение противников, а не подтверждает от лица псалма, что Бог действительно оставил страдальца. Прямая речь сохраняет это богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Императивы переданы прямо и энергично; архаизмы и конфессионально маркированные обороты не используются.
