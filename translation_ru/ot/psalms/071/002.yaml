  text: בְּ/צִדְקָתְ/ךָ֗ תַּצִּילֵ֥/נִי וּֽ/תְפַלְּטֵ֑/נִי הַטֵּֽה אֵלַ֥/י אָ֝זְנְ/ךָ֗ וְ/הוֹשִׁיעֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/002.yaml
  text: In your righteousness rescue me and deliver me[a]; incline your ear to me and save me.
translation:
  language: ru
  text: По праведности Твоей[a] вызволи меня и избавь; приклони ко мне ухо Твоё и спаси меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Праведностью Твоей»; «праведность» здесь можно также понимать как «справедливость».'
    reason: Сохраняется неоднозначность предлога בְּ, который может указывать на основание или средство, а также смысловой диапазон слова צְדָקָה.
lexical_decisions:
- source_word: בְּצִדְקָתְךָ
  choice: По праведности Твоей
  rationale: Предлог בְּ допускает значение основания или средства действия. Оборот «по праведности Твоей» естественно передаёт обращение к праведному и верному характеру Бога, не исключая инструментального понимания.
- source_word: תַּצִּילֵנִי
  choice: вызволи меня
  rationale: Hифиль глагола נצל означает спасение или выведение из опасности. «Вызволи» сохраняет этот смысл и позволяет отличить глагол от последующего וְהוֹשִׁיעֵנִי — «спаси меня».
- source_word: וּתְפַלְּטֵנִי
  choice: и избавь
  rationale: Пиэль глагола פלט выражает избавление, предоставление выхода или безопасного спасения. «Избавь» кратко и естественно передаёт поэтический параллелизм.
- source_word: הַטֵּה
  choice: приклони
  rationale: Императив נטה в сочетании со словом «ухо» образует образную просьбу внимательно услышать. «Приклони» сохраняет метафору и соответствует достоинству молитвенной поэзии.
- source_word: אָזְנְךָ
  choice: ухо Твоё
  rationale: Конкретный образ уха сохранён, а не заменён абстрактным «слухом» или простым «услышь», чтобы передать еврейскую поэтическую образность.
- source_word: וְהוֹשִׁיעֵנִי
  choice: и спаси меня
  rationale: Hифиль глагола ישׁע имеет основное значение «спасать». Эта формулировка сохраняет как непосредственный смысл избавления от опасности, так и более широкое богословское звучание.
theological_decisions:
- issue: Значение צְדָקָה в обращённой к Богу просьбе
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» шире передаёт нравственную прямоту и верность Бога, на которых основана просьба псалмопевца. Возможное судебно-правовое значение «справедливость» сохранено в примечании, чтобы не устранять смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Местоимения, обращённые к Богу, написаны с прописной буквы; конкретная метафора «приклони… ухо» сохранена.
