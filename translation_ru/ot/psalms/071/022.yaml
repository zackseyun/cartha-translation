base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/022.yaml
  text: I also will praise you with the harp for your faithfulness[a], my God; I will make music to you with the lyre[c][b], Holy One of Israel.
translation:
  language: ru
  text: И я буду славить Тебя на арфе[a] за верность Твою[b], Боже мой; буду воспевать Тебя на лире[a], Святой Израиля!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские слова «невел» и «киннор» обозначают два разных древних струнных инструмента; их точное устройство и соответствие современным инструментам неизвестны. Традиционные переводы: «арфа» и «лира».'
    reason: cultural_note
  - marker: b
    text: 'Или: «за истину Твою». Древнееврейское слово может означать как истину, так и верность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: И я
  rationale: Сочетание продолжает мысль предыдущего контекста и подчёркивает личное участие псалмопевца; «И я» естественно передаёт оба оттенка.
- source_word: אוֹדְךָ
  choice: буду славить Тебя
  rationale: В богослужебном и музыкальном контексте форма от ידה обозначает хвалу или благодарение; «славить» хорошо согласуется с параллельным אֲזַמְּרָה.
- source_word: בִכְלִי נֶבֶל
  choice: под звуки невела
  rationale: כְּלִי обозначает инструмент, конкретизированный словом נֶבֶל. Транслитерация сохраняет различие двух древних инструментов и не создаёт ложной уверенности в их точном современном соответствии.
- source_word: אֲמִתְּךָ
  choice: за верность Твою
  rationale: אֱמֶת может обозначать истину, верность и надёжность. Здесь естественно звучит основание хвалы — Божья верность; возможное значение «истина» сохранено в сноске.
- source_word: אֱלֹהָי
  choice: Боже мой
  rationale: Передано как прямое обращение с притяжательным значением.
- source_word: אֲזַמְּרָה לְךָ
  choice: буду воспевать Тебя
  rationale: Piel от זמר означает петь или исполнять хвалу, нередко под музыкальное сопровождение. «Воспевать» естественно передаёт хвалебный и музыкальный характер.
- source_word: בְכִנּוֹר
  choice: под звуки киннора
  rationale: Транслитерация отличает כִּנּוֹר от נֶבֶל и избегает спорной точной идентификации древнего инструмента.
- source_word: קְדוֹשׁ יִשְׂרָאֵל
  choice: Святой Израиля
  rationale: Устоявшийся и понятный русский эквивалент богословского титула; контекст и восклицательный знак передают обращение без добавления междометия «о».
theological_decisions:
- issue: Значение אֱמֶת применительно к Богу
  choice: верность
  alternative: истина
  rationale: В контексте хвалы за Божьи спасительные деяния слово естественно указывает на Его надёжность и верность, но древнееврейское значение не исключает «истину», поэтому альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным поэтическим звучанием. Местоимения при обращении к Богу написаны с прописной буквы согласно принятой русской библейской традиции. Названия инструментов транслитерированы, а традиционные соответствия вынесены в сноску.
