  source_fidelity: 'В целом переданы молитвенное обращение, просьба не оставить псалмопевца, свидетельство перед будущей аудиторией и различие между «рукой» и «могуществом». Однако начальное «И даже до старости, до седых волос» в современном русском синтаксически неясно: его можно понять как ограничение просьбы сроком до старости, тогда как еврейская просьба распространяется и на старость. Уточнённая временная формула передаёт смысл надёжнее.'
  naturalness: Предлагаемая редакция звучит естественно в современном литературном русском и сохраняет высокий молитвенно-поэтический регистр. Убрано несколько тяжеловесное повторение «до ... до ...», а параллельные адресаты сохранены без искусственного противопительного союза «а».
