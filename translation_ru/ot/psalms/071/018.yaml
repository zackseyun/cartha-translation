  text: וְ/גַ֤ם עַד זִקְנָ֨ה וְ/שֵׂיבָה֮ אֱלֹהִ֪ים אַֽל תַּעַ֫זְבֵ֥/נִי עַד אַגִּ֣יד זְרוֹעֲ/ךָ֣ לְ/ד֑וֹר לְ/כָל יָ֝ב֗וֹא גְּבוּרָתֶֽ/ךָ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/018.yaml
  text: Even to old age and gray hairs[a], O God, do not forsake me, until I declare your arm to the next generation[b], your might to everyone who is to come.
translation:
  language: ru
  text: Даже когда я состарюсь и поседею, Боже, не оставляй меня, пока я не возвещу грядущему поколению о Твоей руке[a], всем, кто придёт, — о Твоём могуществе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское слово означает «руку», особенно верхнюю часть руки, и служит образом Божьей деятельной силы; возможно также: «о Твоей силе» или «о Твоей мощи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всем будущим поколениям — о Твоём могуществе». Еврейское выражение буквально говорит обо «всех, кто придёт» и может пониматься как указание на будущие поколения.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: И даже
  rationale: Передаёт продолжение и усилительный оттенок выражения, естественно связывая просьбу с предыдущим контекстом.
- source_word: עַד זִקְנָה וְשֵׂיבָה
  choice: до старости, до седых волос
  rationale: Сохраняет временную направленность עַד и конкретный образ седины, оставаясь понятным в современном русском.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Русская форма звательного обращения естественно передаёт прямое молитвенное обращение.
- source_word: אַל תַּעַזְבֵנִי
  choice: не оставляй меня
  rationale: Точно передаёт просьбу не покидать говорящего; выражение естественно и уместно в молитвенной речи.
- source_word: עַד אַגִּיד
  choice: пока я не возвещу
  rationale: Передаёт предел желаемой Божьей поддержки и публичный характер свидетельства, выраженный глаголом נגד в породе hifil.
- source_word: זְרוֹעֲךָ
  choice: о Твоей руке
  rationale: Сохраняет древнееврейскую метафору руки как действенной силы Бога, не подменяя образ толкованием.
- source_word: לְדוֹר
  choice: грядущему поколению
  rationale: Контекст указывает на поколение, следующее за состарившимся псалмопевцем; «грядущее» передаёт эту направленность без лишней конкретизации.
- source_word: לְכָל יָבוֹא
  choice: всем, кто ещё придёт
  rationale: Сохраняет собирательную широту כָּל с формой единственного числа и перспективу будущих людей.
- source_word: גְּבוּרָתֶךָ
  choice: о Твоём могуществе
  rationale: Передаёт значение силы и мощи, сохраняя возможный оттенок их деятельного проявления.
theological_decisions:
- issue: Сохранять ли телесную метафору «Твоя рука» или раскрыть её как Божью силу
  choice: Сохранить в основном тексте «о Твоей руке»
  alternative: «о Твоей силе» или «о Твоём могуществе»
  rationale: В еврейском тексте рука служит образом действенной Божьей силы. Сохранение образа удерживает поэтическую и богословскую выразительность, а соседнее «могущество» помогает понять смысл.
- issue: Как передать охват будущей аудитории в לְדוֹר ... לְכָל יָבוֹא
  choice: Различить «грядущее поколение» и более широкое «всем, кто ещё придёт»
  alternative: «поколению… всем будущим поколениям»
  rationale: Такая передача сохраняет движение от одного грядущего поколения к более широкому кругу будущих людей, не устраняя неоднозначность второй фразы.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Синтаксис сделан естественным для русского читателя; при этом сохранены метафора Божьей руки, параллелизм двух будущих аудиторий и временная конструкция «пока… не».
