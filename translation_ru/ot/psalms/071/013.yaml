base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/013.yaml
  text: Let those who are hostile to my life be put to shame and come to an end[b][a]; let those who seek my harm be clothed with reproach and disgrace.
translation:
  language: ru
  text: Пусть будут посрамлены и исчезнут[b] те, кто враждует со мной[a]; пусть покроются поношением и бесчестием те, кто желает мне зла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с моей жизнью» или «с моей душой». Еврейское слово здесь может обозначать жизнь или самого человека, а не только душу как нематериальное начало.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «истребятся»; «погибнут».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: пусть будут посрамлены
  rationale: Форма выражает молитвенное пожелание. Пассивно-результативное «будут посрамлены» передаёт не просто внутренний стыд, а постигшее противников публичное посрамление.
- source_word: יִכְלוּ
  choice: исчезнут
  rationale: Глагол כלה может означать окончиться, иссякнуть или погибнуть. «Исчезнут» естественно звучит по-русски и не сужает смысл исключительно до физической смерти.
- source_word: שֹׂטְנֵי נַפְשִׁי
  choice: враги моей жизни
  rationale: Причастие от שטן обозначает враждебных противников, а נֶפֶשׁ здесь вероятнее относится к жизни или самой личности псалмопевца. Формулировка сохраняет упоминание жизни и допускает контекстуальную многозначность.
- source_word: יַעֲטוּ
  choice: пусть покроются
  rationale: Глагол передаёт образ окутывания или покрытия. «Покроются» сохраняет метафору и при этом звучит естественнее современного книжного «облекутся».
- source_word: חֶרְפָּה
  choice: поношением
  rationale: Слово указывает на публичное поругание и укор; «поношение» сохраняет этот оттенок и отличается от следующего обозначения стыда.
- source_word: וּכְלִמָּה
  choice: и бесчестием
  rationale: «Бесчестие» передаёт унижение и позор, сохраняя усилительный параллелизм с חֶרְפָּה.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: те, кто желает мне зла
  rationale: Причастная конструкция обозначает людей, намеренно стремящихся причинить зло. «Желает мне зла» — ясное и естественное русское выражение, сохраняющее враждебный умысел.
theological_decisions:
- issue: Молитвенно-пожелательная сила форм
  choice: Передать глаголы конструкцией «пусть...», как просьбу или пожелание псалмопевца.
  alternative: 'Перевести как простое предсказание: «будут посрамлены и исчезнут».'
  rationale: Последовательность имперфектов в контексте молитвы имеет юссивную, импекаторную силу; перевод не превращает обращённое к Богу прошение в отвлечённое предсказание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Параллелизм двух полустиший сохранён; архаичные синтаксические обороты по возможности устранены, но слова «посрамлены» и «поношение» оставлены ради точной передачи публичного стыда и молитвенной торжественности.
