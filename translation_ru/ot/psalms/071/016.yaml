  yaml_path: translation/ot/psalms/071/016.yaml
  text: I will come in the mighty deeds of the Lord GOD[a]; I will proclaim your righteousness[c][b], yours alone.
translation:
  language: ru
  text: Я приду с могучими деяниями Владыки Яхве[a]; возвещу[b] Твою праведность[c] — лишь Твою.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могучих деяниях Владыки Яхве». Предлог может обозначать как средство или сопровождение («с, посредством»), так и сферу («в»).'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «упомяну», «поведаю». Еврейский глагол может означать «упомянуть», «перечислить» или «возвестить».'
    reason: lexical_alternative
  - marker: c
    text: «Праведность» здесь может также означать «справедливость» или конкретные праведные деяния Бога.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוֹא
  choice: Я приду
  rationale: Форма Qal, 1-е лицо единственного числа, допускает значения «приду», «пойду», «войду». «Я приду» сохраняет наиболее прямое значение, не уточняя без достаточных оснований направление или место движения.
- source_word: בִּגְבֻרוֹת
  choice: с могучими деяниями
  rationale: Множественное число גְּבוּרוֹת может обозначать не только силу, но и проявления силы — «могучие деяния». Предлог ב допускает инструментальное «с, посредством» и пространственно-сферическое «в»; основное чтение передано естественным для русского языка оборотом, а неоднозначность отмечена в сноске.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыки Яхве
  rationale: אֲדֹנָי передано как «Владыка», а личное имя יהוה — как «Яхве». Такое сочетание различает титул и имя и избегает неестественного повтора «Господь Господь».
- source_word: אַזְכִּיר
  choice: возвещу
  rationale: Hiphil глагола זכר может означать «напомню», «упомяну», «перечислю, поведаю» или публично «возвещу». В поэтическом контексте «возвещу» естественно передаёт открытое провозглашение, не исключая оттенка воспоминания и рассказа.
- source_word: צִדְקָתְךָ
  choice: Твою праведность
  rationale: צְדָקָה прежде всего означает «праведность», но может указывать на справедливость или конкретные праведные и спасительные деяния. Основной перевод сохраняет широкое богословское и этическое значение слова.
- source_word: לְבַדֶּךָ
  choice: лишь Твою
  rationale: Оборот подчёркивает исключительность принадлежащей Богу праведности. «Лишь Твою» кратко и естественно связывает это ударение с предшествующим существительным, не добавляя сравнения с кем-либо конкретным.
theological_decisions:
- issue: Передача составного Божественного наименования אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  alternative: Господь Бог; Владыка Господь
  rationale: Текст сочетает титул אֲדֹנָי с личным именем יהוה. Передача «Владыка Яхве» сохраняет оба элемента и не превращает личное имя в общий титул.
- issue: Значение צִדְקָה применительно к Богу
  choice: праведность
  alternative: справедливость; праведные деяния
  rationale: Контекст допускает как качество Бога, так и его конкретные справедливые или спасительные действия. Широкое слово «праведность» сохраняет эту смысловую напряжённость, а варианты указаны в сноске.
translation_notes:
  register: Современный литературный русский с поэтической краткостью и умеренно возвышенным библейским регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис сохраняет параллелизм двух решительных форм будущего времени.
