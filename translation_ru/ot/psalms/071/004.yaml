lexical_decisions:
- source_word: אֱלֹהַי
  choice: Боже мой
  rationale: Форма с суффиксом первого лица употреблена как прямое обращение; русский звательный оборот «Боже мой» естественно передаёт и обращение, и значение «мой Бог».
- source_word: פַּלְּטֵנִי
  choice: избавь меня
  rationale: Императив от פלט выражает просьбу вырвать из опасности; «избавь меня» точно и естественно звучит в современном литературном русском.
- source_word: מִיַּד רָשָׁע
  choice: от руки нечестивого
  rationale: Сохранён древнееврейский образ руки как власти и контроля; оборот понятен по-русски и поддерживает поэтический параллелизм.
- source_word: מִכַּף
  choice: от хватки
  rationale: כף буквально обозначает ладонь, но здесь образно указывает на удерживающую власть; «хватка» естественно передаёт смысл и отличает этот образ от предшествующей «руки».
- source_word: מְעַוֵּל
  choice: творящего неправду
  rationale: Причастие характеризует человека, поступающего неправедно или несправедливо; глагольная формулировка сохраняет деятельный оттенок исходной формы.
- source_word: וְחוֹמֵץ
  choice: и насилие
  rationale: В сочетании с общим причастным оборотом передаёт человека, совершающего неправду и проявляющего насилие; формулировка сохраняет связь двух характеристик одного угнетателя, не ослабляя оттенка жестокого притеснения.
