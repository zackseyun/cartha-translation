  text: וַ֭/אֲנִי תָּמִ֣יד אֲיַחֵ֑ל וְ֝/הוֹסַפְתִּ֗י עַל כָּל תְּהִלָּתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/014.yaml
  text: But as for me[a], I will continually hope[c][b], and I will add to all your praise.
translation:
  language: ru
  text: А я всегда буду надеяться и всё больше воздавать Тебе хвалу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и буду умножать хвалу Тебе». Буквально: «и прибавлю ко всей Твоей хвале»; еврейский оборот передаёт прибавление, или увеличение, хвалы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Сочетание союза с самостоятельным местоимением выделяет говорящего и выражает контраст; «А я» естественно передаёт обе функции по-русски.
- source_word: תָּמִיד
  choice: всегда
  rationale: Наречие обозначает непрерывность и постоянство; в сочетании «всегда буду надеяться» оно звучит естественно и передаёт неизменную направленность надежды.
- source_word: אֲיַחֵל
  choice: буду надеяться
  rationale: Форма глагола יחל выражает надежду и полное ожидания упование; будущее время здесь передаёт продолжающуюся решимость псалмопевца.
- source_word: וְהוֹסַפְתִּי עַל
  choice: и всё больше буду воздавать
  rationale: Оборот с יסף и עַל буквально рисует прибавление к уже существующей хвале. Русское «всё больше» естественно передаёт нарастание, не уточняя, идёт ли речь о количестве, продолжительности или силе хвалы.
- source_word: כָּל תְּהִלָּתֶךָ
  choice: Тебе хвалу
  rationale: Существительное תְּהִלָּה обозначает хвалу, относящуюся к Богу или обращённую к Нему. Дательный «Тебе» ясно и естественно передаёт эту направленность в русском языке; значение כָּל учитывается в обороте «всё больше» и поясняется в сноске.
theological_decisions:
- issue: Значение притяжательного суффикса в תְּהִלָּתֶךָ
  choice: хвала, воздаваемая Богу
  alternative: Божья хвала в смысле Его славных или достойных хвалы дел
  rationale: Контекст допускает связь хвалы как с Богом, так и с тем, за что Его хвалят. Основной текст передаёт прямое действие поклоняющегося, не вводя перечня Божьих деяний; сноска сохраняет образ и широту еврейского выражения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем псалма. «Воздавать хвалу» сохраняет достоинство библейской речи, оставаясь понятным современному читателю; заглавное «Тебе» принято как уважительное обращение к Богу.
