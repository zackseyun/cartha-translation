  - marker: c
    text: 'В еврейском тексте происходит переход от множественного числа к единственному: «оживишь нас… поднимешь меня».'
    reason: textual_variant
  - marker: d
    text: «Глубины земли» могут образно указывать на крайнее унижение или близость смерти, а также напоминать о нисхождении в могилу.
    reason: cultural_note
lexical_decisions:
- source_word: הראיתנו
  choice: давший нам увидеть
  rationale: Каузативная форма глагола ראה передаёт смысл «дать/заставить увидеть». Выбранный оборот сохраняет каузативность и естественно звучит по-русски.
- source_word: צָרוֹת רַבּוֹת וְרָעוֹת
  choice: много бед и несчастий
  rationale: Передаёт многочисленные тяжёлые испытания понятным современным языком; רָעוֹת здесь обозначает бедствия, а не нравственное зло.
- source_word: תָּשׁוּב
  choice: снова
  rationale: Дважды употреблённый שוב имеет значение возобновления действия. Повтор «снова… снова» сохраняет поэтический параллелизм без неестественного русского «вернёшься и оживишь».
- source_word: תְּחַיֵּנוּ
  choice: оживишь нас
  rationale: Порода piel глагола חיה выражает возвращение к жизни или восстановление жизненных сил; «оживишь» сохраняет обе возможности.
- source_word: וּמִתְּהֹמוֹת הָאָרֶץ
  choice: и из глубин земли
  rationale: Сохраняется пространственный и поэтический образ глубин без преждевременного сведения его исключительно к могиле или воскресению.
- source_word: תַּעֲלֵנִי
  choice: поднимешь меня
  rationale: Каузативная форма עלה означает «поднять, вывести наверх» и соответствует образу выхода из земных глубин.
- source_word: נו ... ני
  choice: нас ... меня
  rationale: Сохранён переход масоретского текста от первого лица множественного числа к первому лицу единственного числа.
theological_decisions:
- issue: Обозначает ли רָעוֹת нравственное зло или пережитые бедствия
  choice: несчастия
  alternative: зло; тяжкие беды
  rationale: В контексте речь идёт о постигших людей страданиях. «Несчастия» не приписывает Богу совершение нравственного зла, но сохраняет тяжесть пережитого.
- issue: Следует ли понимать «из глубин земли» исключительно как воскресение из мёртвых
  choice: сохранить образ «из глубин земли»
  alternative: из могилы воскресишь меня
  rationale: Образ может говорить о крайнем унижении, близости смерти или могильных глубинах. Текст не требует выбрать только одно из этих значений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Повтор «снова» воспроизводит двукратное תָּשׁוּב, а смена «нас» на «меня» намеренно не сглажена.
