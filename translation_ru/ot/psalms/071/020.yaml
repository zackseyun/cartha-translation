  yaml_path: translation/ot/psalms/071/020.yaml
  text: You[a], who have made us see many troubles and calamities, will return and revive us[d][c][b]; and from the depths of the earth you will return and bring me up.
translation:
  language: ru
  text: Ты дал нам увидеть[a] много бед и несчастий[b]; Ты вновь оживишь нас[c] и из глубин земли[d] вновь поднимешь меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «показал нам». Еврейская форма каузативна: Бог дал нам увидеть или испытать эти бедствия.'
