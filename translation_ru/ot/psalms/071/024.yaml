  rationale: 'Форма передаёт достигнутый результат: замышлявшие зло оказались покрыты стыдом.'
- source_word: חָפְרוּ
  choice: посрамлены
  rationale: Слово образует поэтическую пару с «постыжены» и передаёт усиленный оттенок унижения и бесчестья.
- source_word: מְבַקְשֵׁי רָעָתִי
  choice: те, кто ищет мне зла
  rationale: Причастный оборот описывает продолжающееся враждебное намерение. Русское выражение естественно передаёт стремление причинить псалмопевцу беду или вред.
