  choice: Твоей праведности
  alternative: Твоей справедливости
  rationale: Основной текст сохраняет традиционно широкое «праведность», поскольку здесь речь может идти одновременно о правоте Бога, Его справедливости и спасительном заступничестве. Более узкое «справедливость» отмечено в сноске.
