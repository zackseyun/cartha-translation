- source_word: לְשׁוֹנִי
  choice: язык мой
  rationale: Сохранён конкретный поэтический образ органа речи, без замены отвлечённым словом «речь».
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Естественное современное выражение, сохраняющее идею непрестанной хвалы на протяжении дня.
- source_word: תֶּהְגֶּה
  choice: будет говорить о
  rationale: Глагол הגה может обозначать размышление, тихое произнесение или высказывание. Поскольку подлежащее — «язык», контекст указывает на выраженную словами хвалу; перевод сохраняет эту направленность, не уточняя громкость речи.
- source_word: צִדְקָתֶךָ
  choice: Твоей праведности
  rationale: «Праведность» сохраняет широкий смысл еврейского слова, включающий нравственную правоту Бога, Его справедливый суд и спасительное оправдание угнетённого.
- source_word: כִּי ... כִּי
  choice: потому что ... и
  rationale: Первое כִּי вводит основание хвалы. Второе тесно связывает два параллельных результата и по-русски естественно передаётся союзом «и», без тяжеловесного повторения «потому что».
- source_word: בֹשׁוּ
