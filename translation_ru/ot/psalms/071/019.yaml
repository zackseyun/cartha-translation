  text: וְ/צִדְקָתְ/ךָ֥ אֱלֹהִ֗ים עַד מָ֫ר֥וֹם אֲשֶׁר עָשִׂ֥יתָ גְדֹל֑וֹת אֱ֝לֹהִ֗ים מִ֣י כָמֽוֹ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/071/019.yaml
  text: And your righteousness[a], O God, reaches to the heights—you who have done great things. O God[b], who is like you?
translation:
  language: ru
  text: И праведность Твоя[a], Боже, простирается до высот[b] — Ты, Который совершил великие дела. Боже, кто подобен Тебе?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «справедливость». Еврейское слово צְדָקָה в зависимости от контекста может означать праведность или справедливость.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «до небес». Буквально еврейское выражение означает «до высоты» или «до выси».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִדְקָתְךָ
  choice: И праведность Твоя
  rationale: «Праведность» сохраняет широкий нравственный смысл צְדָקָה применительно к Богу; союз וְ передан как «и». Возможный оттенок справедливости отмечен в сноске.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: В обоих случаях слово употреблено как прямое обращение; современная русская звательная форма «Боже» естественна и сохраняет повтор.
- source_word: עַד מָרוֹם
  choice: простирается до высот
  rationale: Буквально выражение означает «до высоты / высокого места». Добавленный по смыслу глагол «простирается» делает безглагольную еврейскую конструкцию естественной по-русски, не сводя образ однозначно к небесам.
- source_word: אֲשֶׁר עָשִׂיתָ גְדֹלוֹת
  choice: Ты совершил великое
  rationale: Передаёт великие Божьи деяния и сохраняет широкое субстантивированное значение גְדֹלוֹת. Тире удерживает тесную поэтическую связь с предшествующим обращением, хотя формальная относительная конструкция в русском здесь звучала бы тяжеловесно.
- source_word: מִי כָמוֹךָ
  choice: кто подобен Тебе?
  rationale: Ясно и естественно передаёт риторическое утверждение несравненности Бога.
theological_decisions:
- issue: Значение צְדָקָה как Божьего свойства
  choice: праведность
  alternative: справедливость
  rationale: Контекст восхваляет Божье нравственное совершенство и великие дела в широком смысле, а не только судебную справедливость; при этом допустимое лексическое значение не исключено и вынесено в сноску.
- issue: Объём пространственного образа עַד מָרוֹם
  choice: до высот
  alternative: до небес
  rationale: Еврейское מָרוֹם означает высоту или высь и не требует однозначно понимать образ как конкретное обозначение небес; перевод сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Формы «Твоя», «Тебе» написаны с прописной буквы в соответствии с традиционным русским оформлением обращения к Богу. Пространственная метафора и риторический вопрос сохранены.
