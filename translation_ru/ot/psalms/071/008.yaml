lexical_decisions:
- source_word: יִמָּלֵא
  choice: наполнятся
  rationale: Нифаль, имперфект глагола מלא. Будущее время естественно передаёт основное значение формы в контексте, не исключая возможного настоящего или пожелательного оттенка, отмеченного в сноске.
- source_word: פִי
  choice: уста мои
  rationale: Сохраняет буквальный поэтический образ речи и хвалы; «уста» в современном литературном русском уместно для возвышенной поэзии Псалтири.
- source_word: תְּהִלָּתֶךָ
  choice: хвалой Тебе
  rationale: Суффикс 2-го лица указывает на Бога как предмет хвалы. Русское «хвалой Тебе» естественнее, чем двусмысленное «Твоей хвалой», и не меняет направленность выражения.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Естественное современное русское выражение, сохраняющее длительное временное значение.
- source_word: תִּפְאַרְתֶּךָ
  choice: славой Твоей
  rationale: תפארת охватывает значения славы, великолепия, красоты и величия. «Слава» естественно звучит в данном параллелизме, а более узкие оттенки приведены в сноске.
theological_decisions:
- issue: Модальность יִמָּלֵא
  choice: 'утверждение в будущем времени: «наполнятся»'
  alternative: «наполнены» или «да наполнятся»
  rationale: Имперфект в поэтическом контексте допускает будущее, настоящее либо пожелательное прочтение. Основной текст следует естественному будущему прочтению, а неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой лексикой. Инверсия «уста мои» и форма «хвалой Тебе» сохраняют поэтический параллелизм без архаической тяжеловесности. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской издательской традиции.
