  text: My mouth will be filled with your praise[b][a], with your splendor all day long.
translation:
  language: ru
  text: Уста мои наполнятся хвалой Тебе[a] и Твоей славой[b] весь день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Уста мои наполнены хвалой Тебе»; возможно также: «Пусть уста мои наполнятся хвалой Тебе». В поэтическом контексте древнееврейская форма может иметь значение будущего или настоящего времени либо выражать пожелание.'
    reason: alternative_reading
  - marker: b
