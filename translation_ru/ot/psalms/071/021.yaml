translation:
  language: ru
  text: Умножь[a] моё величие[b] и, обратившись ко мне[c], утешь меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ты умножишь моё величие и, обратившись ко мне, утешишь меня». Еврейские формы глаголов могут выражать здесь как просьбу или пожелание, так и уверенность в будущем.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «моё величие»; речь может идти также о почёте, высоком положении или достоинстве.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и повернись» или «и обернись». Вероятный смысл: «обратись ко мне вновь, чтобы утешить меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּרֶב
  choice: Умножь
  rationale: Хифиль от רבה означает «сделать большим, умножить». В поэтической молитве имперфект 2-го лица может выражать просьбу или пожелание; русский императив естественно передаёт этот оттенок.
- source_word: גְּדֻלָּתִי
  choice: моё величие
  rationale: Существительное גְּדוּלָּה может обозначать величие, высокий статус, достоинство или почёт. «Моё величие» — наиболее прямой перевод, сохраняющий смысловую связь с глаголом «умножь» и не сужающий значение до одного лишь почёта.
- source_word: וְתִסֹּב
  choice: и вновь
  rationale: Глагол סבב буквально передаёт поворот или обращение. Вместе с последующим «утешь меня» он, вероятно, означает, что Бог снова обращается к псалмопевцу с утешением. «Вновь» естественно выражает этот контекстуальный смысл по-русски; буквальный образ отмечен в сноске.
- source_word: תְּנַחֲמֵנִי
  choice: утешь меня
  rationale: Пиэль от נחם здесь означает «утешать, ободрять». «Утешь меня» — точное и естественное выражение молитвенной просьбы в современном литературном русском языке.
theological_decisions:
- issue: Наклонение еврейских имперфектов
  choice: 'Передать как молитвенную просьбу: «Умножь… и… утешь меня».'
  alternative: 'Передать как уверенное высказывание о будущем: «Ты умножишь… и… утешишь меня».'
  rationale: В поэтическом контексте имперфекты допускают как значение будущего, так и пожелательно-просительное значение. Окружающий контекст обращения к Богу поддерживает молитвенное прочтение, однако возможное будущее значение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая, возвышенная молитвенная формулировка. Местоимение при обращении к Богу не добавлено, поскольку его нет в еврейском тексте. Контекстуальное «вновь» делает оборот естественным, а буквальный образ поворота сохраняется в сноске.
