  yaml_path: translation/ot/psalms/070/005.yaml
  text: But as for me[a], I am poor and needy; O God, hurry to me. You are my help and my deliverer; O Yahweh[b], do not delay.
translation:
  language: ru
  text: А я беден и нищ; Боже, поспеши ко мне[a]. Ты — помощь моя и избавитель мой. Яхве[b], не медли!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поспеши ради меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Евр. יהוה (YHWH); традиционно: «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Сочетание союза с местоимением обозначает контрастный переход к положению псалмопевца; «А я» естественно и кратко передаёт его по-русски.
- source_word: עָנִי וְאֶבְיוֹן
  choice: беден и нуждаюсь
  rationale: Первое слово передано прилагательным «беден», а второе — глагольной формой «нуждаюсь», чтобы сохранить различие между бедностью и нуждой без неестественного «бедный и нуждающийся».
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма обращения ясно передаёт вокатив и соответствует возвышенной, но современной русской молитвенной речи.
- source_word: חוּשָׁה לִי
  choice: поспеши ко мне
  rationale: Императив выражает настоятельную просьбу действовать без промедления; לִי наиболее прямо понимается как направление «ко мне», хотя возможно и «ради меня».
- source_word: עֶזְרִי
  choice: помощь моя
  rationale: Существительное עֵזֶר означает помощь, а не обязательно лицо-помощника; именная форма сохраняет образ Бога как помощи молящегося.
- source_word: וּמְפַלְטִי
  choice: и избавитель мой
  rationale: Причастная форма от פלט обозначает того, кто избавляет или даёт спастись; «избавитель» передаёт это ёмко и достойно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между יְהוָה и обращением אֱלֹהִים ранее в стихе.
- source_word: אַל תְּאַחַר
  choice: не медли
  rationale: Краткая отрицательная просьба естественно передаёт настойчивость еврейского выражения и его связь с предшествующим «поспеши».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя יהוה. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом; традиционное «Господь» отмечено как альтернатива.
- issue: Характер утверждения עֶזְרִי וּמְפַלְטִי אַתָּה
  choice: Ты — помощь моя и избавитель мой
  alternative: Ты — мой помощник и избавитель
  rationale: Выбор сохраняет различие между абстрактным существительным עֵזֶר («помощь») и обозначением избавляющего лица מְפַלֵּט, не сводя оба слова к названиям деятеля.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью без архаизмов. Параллелизм и срочность просьбы сохранены; восклицательный знак в конце передаёт настойчивость заключительного повеления.
