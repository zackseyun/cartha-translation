  language: ru
  text: Боже, избавь меня; Яхве, поспеши мне на помощь!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения естественно передаёт прямое молитвенное воззвание.
- source_word: לְהַצִּילֵנִי
  choice: избавь меня
  rationale: Хифиль глагола נצל означает избавить или спасти от опасности; «избавь меня» сохраняет широкий смысл и соответствует языку псалмов.
- source_word: יְהוָה
  choice: Господи[a]
  rationale: В основном тексте употреблена традиционная русская передача тетраграмматона как «Господь» в форме прямого обращения; примечание сообщает личное имя в еврейском тексте.
- source_word: לְעֶזְרָתִי
  choice: мне на помощь
  rationale: Существительное עֶזְרָה с предлогом ל выражает направленность действия к оказанию помощи; русская формула естественна и точна.
- source_word: חוּשָׁה
  choice: поспеши
  rationale: Побудительная форма выражает настоятельную просьбу действовать без промедления; «поспеши» уместно в современном литературном молитвенном регистре.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господи[a]
  alternative: Яхве
  rationale: 'Текст не заменяет имя иным смысловым понятием: традиционная русская передача помещена в основной строке, а форма «Яхве» явно указана в примечании, чтобы читатель видел исходное личное имя.'
translation_notes:
  register: Современный литературный русский язык с кратким, настойчивым молитвенным ритмом. Синтаксический параллелизм еврейской строки сохранён; восклицательный знак передаёт напряжённость мольбы.
