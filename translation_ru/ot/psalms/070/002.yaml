lexical_decisions:
- source_word: יֵבֹשׁוּ
  choice: да постыдятся
  rationale: Передаёт переживание стыда и в сочетании с «да» сохраняет молитвенно-желательное значение формы.
- source_word: וְיַחְפְּרוּ
  choice: и смутятся
  rationale: Сохраняет отдельный оттенок унижения и замешательства, не сливая этот глагол с предшествующим בוש.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: ищущие моей гибели
  rationale: В угрожающем контексте נפש обозначает жизнь или самого человека, а выражение «искать чьей-либо жизни» означает стремиться погубить его; современное «ищущие моей гибели» ясно передаёт смысл.
- source_word: יִסֹּגוּ אָחוֹר
  choice: да отступят назад
  rationale: Точно передаёт движение вспять, выраженное сочетанием סוג и אָחוֹר, и сохраняет параллельную желательную конструкцию.
- source_word: וְיִכָּלְמוּ
  choice: и покроются позором
  rationale: Передаёт публичное посрамление и позволяет различить этот глагол и предыдущие слова поля стыда.
- source_word: חֲפֵצֵי רָעָתִי
  choice: радующиеся моей беде
  rationale: חפץ может выражать удовольствие или удовлетворение, а רעה здесь означает беду, постигшую говорящего, а не его нравственное зло.
theological_decisions:
- issue: Желательно-просительный смысл цепочки имперфектов
  choice: 'Передать повторённой частицей «да»: «да постыдятся… да отступят…»'
  alternative: 'Будущее время: «постыдятся… отступят…»'
  rationale: В контексте молитвы эти формы выражают просьбу или пожелание, а не простое предсказание.
- issue: Значение נַפְשִׁי в контексте враждебного преследования
  choice: «моей гибели» в тексте с примечанием о буквальном образе
  alternative: «души моей» или «моей жизни»
  rationale: Контекст указывает на стремление лишить псалмопевца жизни; перевод не превращает «душу» в отдельное богословское утверждение о составе человека.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной псалмовой интонацией. Параллелизм и молитвенно-желательная сила еврейских форм сохранены посредством частицы «да».
