    reason: lexical_alternative
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Дирижёру
  rationale: Термин в надписаниях псалмов обозначает руководителя музыкального исполнения; дательный падеж естественно передаёт направительное לְ и сохраняет краткость заголовка.
- source_word: לְדָוִד
  choice: Давида
  rationale: Родительный падеж в русском надписании допускает авторство, принадлежность или связь с Давидом и потому не сужает неоднозначность еврейского לְ до значения «написанный Давидом».
- source_word: לְהַזְכִּיר
  choice: Для напоминания
  rationale: Инфинитив породы хифиль от זכר выражает побуждение к воспоминанию или напоминание; краткая целевая формула не уточняет, кто и о чём должен вспомнить.
theological_decisions:
- issue: Функция выражения לְהַזְכִּיר в надписании
  choice: 'Нейтральное обозначение цели: «Для напоминания»'
  alternative: «В воспоминание»; «Чтобы напомнить»; указание на поминальную жертву либо на обращённое к Богу напоминание
  rationale: В еврейском тексте не назван субъект воспоминания, а формула может иметь литургическое значение. Перевод сохраняет эту неопределённость.
translation_notes:
  register: Краткое, dignified надписание в современном литературном русском. «Дирижёру» понятно современному читателю и передаёт музыкально-руководящую функцию; пунктуация сохраняет трёхчастную структуру оригинала.
