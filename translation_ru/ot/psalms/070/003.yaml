  text: Let them turn back because of their shame[a], those who say, “Aha, aha!”
translation:
  language: ru
  text: 'Да отступят из-за своего позора[a] те, кто говорит: «Ага! Ага!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да отступят вследствие своего позора».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: Да отступят
  rationale: Форма qal imperfect 3-го лица множественного числа в контексте молитвенного пожелания передана русской конструкцией с «да», сохраняющей волитивную, импрекативную силу. «Отступят» естественно выражает обращение назад или вынужденное отступление.
- source_word: עַל עֵקֶב
  choice: из-за
  rationale: 'Сочетание употреблено причинно: «из-за, вследствие». Такой перевод передаёт идиоматический смысл без неясного буквального упоминания «пяты» или «следа».'
- source_word: בָּשְׁתָּם
  choice: своего позора
  rationale: Слово относится к семантическому полю стыда и бесчестья. «Позор» здесь естественно обозначает постигшее противников унижение; возвратное «своего» ясно соотносит его с подлежащим.
- source_word: הָאֹמְרִים
  choice: те, кто говорит
  rationale: Субстантивированное причастие с артиклем обозначает людей, характеризуемых этими словами. Русская конструкция звучит естественно и сохраняет описательный характер формы.
- source_word: הֶאָח הֶאָח
  choice: Ага! Ага!
  rationale: Повторённое междометие выражает злорадство и насмешливое торжество. «Ага!» непосредственно и понятно передаёт эту окраску в современном русском языке.
