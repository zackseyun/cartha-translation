    text: 'Или: «Да будет превознесён Бог!» Еврейское выражение передаёт пожелание или торжественное провозглашение Божьего величия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשִׂישׂוּ וְיִשְׂמְחוּ
  choice: да радуются и веселятся
  rationale: 'Два близких по смыслу глагола передают усиленный поэтический параллелизм: שׂושׂ указывает на ликование, а שׂמח — на радость и веселье. Разные русские глаголы сохраняют это сочетание.'
- source_word: בְּךָ
  choice: о Тебе
  rationale: Предлог ב здесь обозначает основание или средоточие радости. «О Тебе» естественно для современного русского языка и сохраняет направленность радости на Бога.
- source_word: כָּל מְבַקְשֶׁיךָ
  choice: все, кто ищет Тебя
  rationale: Причастная конструкция обозначает всех людей, для которых характерно стремление к Богу; выбранная формулировка ясна и естественна по-русски.
- source_word: וְיֹאמְרוּ תָמִיד
  choice: пусть всегда говорят
  rationale: Имперфект в контексте пожелания вместе с תָמִיד выражает постоянное или повторяющееся провозглашение.
- source_word: אֹהֲבֵי יְשׁוּעָתֶךָ
  choice: любящие Твоё спасение
  rationale: יְשׁוּעָה допускает значения как конкретного избавления от беды, так и спасения в более широком смысле. «Спасение» сохраняет эту богословскую широту; альтернатива указана в сноске.
- source_word: יִגְדַּל אֱלֹהִים
  choice: Да возвеличится Бог!
  rationale: Форма выражает пожелание или славословное возглашение, а не простое утверждение. «Да возвеличится» сохраняет волитивную силу и идею публичного признания Божьего величия.
theological_decisions:
- issue: Значение יְשׁוּעָה
  choice: спасение
  alternative: избавление
  rationale: Слово может обозначать и помощь в конкретной беде, и спасение в широком богословском смысле. Основной вариант сохраняет более полный диапазон, а сноска отмечает конкретное значение.
- issue: Речевая сила יִגְדַּל אֱלֹהִים
  choice: Да возвеличится Бог!
  alternative: Велик Бог! / Да будет превознесён Бог!
  rationale: 'Имперфект здесь имеет юссивно-аккламационную силу: это пожелание и призыв признавать Божье величие, а не только сообщение о нём.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмодическим звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно принятой русской религиозной издательской традиции; синтаксис остаётся понятным современному читателю.
