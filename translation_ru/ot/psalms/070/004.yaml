  text: Let all who seek you rejoice and be glad in you[a]; let those who love your salvation say continually[b], “May God be magnified!”
translation:
  language: ru
  text: 'Пусть все, кто ищет Тебя, радуются и ликуют в Тебе; пусть всегда говорят любящие Твоё спасение[a]: «Да возвеличится Бог!»[b]'
