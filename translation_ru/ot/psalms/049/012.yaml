source:
  edition: WLC
  text: וְ/אָדָ֣ם בִּ֭/יקָר בַּל יָלִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/012.yaml
  text: But man in honor does not remain[c][b][a]; he is like the beasts that perish.
translation:
  language: ru
  text: Но человек в почёте не останется[a][b]; он подобен животным, которые погибают[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Но человечество в почёте не останется». Еврейское слово может означать как отдельного человека, так и человечество в целом; единственное число здесь имеет обобщающий смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не переночует». Это выражение означает, что почётное положение человека не продлится.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «которые истреблены». Последний еврейский глагол традиционно понимается здесь как указание на гибель.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: человек
  rationale: Единственное число представляет человека как представителя всего человечества; русское «человек» естественно сохраняет оба оттенка.
- source_word: בִּיקָר
  choice: в почёте
  rationale: יָקָר обозначает почёт, ценность или великолепие; здесь речь идёт о высоком положении человека, а не только о богатстве.
- source_word: בַּל
  choice: не
  rationale: Отрицательная частица придаёт высказыванию характер общего правила.
- source_word: יָלִין
  choice: останется
  rationale: Буквально глагол означает «переночует», но в контексте передаёт мысль о непродолжительности почётного положения.
- source_word: נִמְשַׁל
  choice: подобен
  rationale: Нифаль от משל выражает уподобление; краткая русская форма естественна для поэтической строки.
- source_word: כַּבְּהֵמוֹת
  choice: животным
  rationale: בְּהֵמוֹת здесь обобщённо обозначает животных; это современное и нейтрально-достоинственное соответствие.
- source_word: נִדְמוּ
  choice: которые погибают
  rationale: В данном контексте форму традиционно понимают как указание на гибель; относительное предложение ясно связывает признак с животными.
theological_decisions:
- issue: Представительное значение אָדָם
  choice: человек
  alternative: люди / человечество
  rationale: Сохранено единственное число исходного текста без ограничения смысла одним конкретным мужчиной.
- issue: Значение נִדְמוּ
  choice: погибают
  alternative: истреблены / умолкают
  rationale: Выбрано традиционное контекстуальное понимание, но действительная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической мудрости. «В почёте» сохраняет тему высокого положения, а «животным» избегает излишне архаичного оттенка слова «скоты». Все смысловые альтернативы исходного текста вынесены в сноски без разрешения подлинной неоднозначности.
