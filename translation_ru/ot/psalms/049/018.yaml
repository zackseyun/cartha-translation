  yaml_path: translation/ot/psalms/049/018.yaml
  text: For his soul blesses itself during his life[a], and they praise you when you do well for yourself.
translation:
  language: ru
  text: Ибо при жизни он считает себя благословенным[a], и тебя хвалят, когда ты преуспеваешь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв. евр.: «его душа благословляет (себя)»; также возможно: «поздравляет себя».'
    reason: Сноска сохраняет конкретный еврейский оборот с נֶפֶשׁ и отмечает его смысловой диапазон, не изменяя синтаксическую роль слова «его душа».
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит пояснение к предыдущей мысли псалма; «ибо» передаёт аргументативную связь, не усиливая её до причинного «потому что».
- source_word: נַפְשׁוֹ ... יְבָרֵךְ
  choice: он считает себя благословенным
  rationale: 'נֶפֶשׁ с местоименным суффиксом здесь обозначает самого человека, а сочетание с ברך имеет рефлексивный смысл: он признаёт или считает себя благословенным. Буквальный образ сохранён в сноске.'
- source_word: בְּחַיָּיו
  choice: при жизни
  rationale: 'Естественно и точно передаёт временное значение выражения: в течение его земной жизни.'
- source_word: וְיוֹדֻךָ
  choice: и тебя хвалят
  rationale: Форма глагола имеет неопределённо-личное множественное подлежащее, а суффикс указывает на адресата во втором лице. «Хвалят» соответствует контексту общественного одобрения.
- source_word: כִּי
  choice: когда
  rationale: Второе כִּי вводит обстоятельство, при котором человек получает похвалу; по-русски это естественно передаётся временным союзом «когда».
- source_word: תֵיטִיב לָךְ
  choice: ты преуспеваешь
  rationale: В данном контексте богатства и благополучия выражение означает, что человеку хорошо живётся или его дела идут успешно. «Преуспеваешь» кратко передаёт этот смысл, не превращая его в нравственную оценку «делаешь добро».
theological_decisions:
- issue: Переход от третьего лица к прямому обращению во втором лице
  choice: 'Сохранён: «он… тебя… ты»'
  alternative: 'Унифицировать лицо: «он… его… он» или «человека… его»'
  rationale: Резкая смена лица присутствует в масоретском тексте и является риторической особенностью стиха; её не следует молча сглаживать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка понятна без специальных знаний; архаизмы устранены, а риторический переход от третьего лица ко второму сохранён.
