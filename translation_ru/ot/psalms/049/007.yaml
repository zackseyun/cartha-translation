    reason: lexical_alternative
lexical_decisions:
- source_word: אָח
  choice: брата
  rationale: Слово буквально означает «брат»; здесь оно, вероятно, обозначает близкого человека или другого человека вообще. Винительный падеж естественно передаёт его как объект глагола «выкупить».
- source_word: פָדֹה יִפְדֶּה
  choice: не сможет выкупить
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает глагольную идею; вместе с отрицанием оно выражает полную невозможность, естественно передаваемую по-русски конструкцией «не сможет выкупить».
- source_word: אִישׁ
  choice: никто
  rationale: Хотя слово буквально значит «мужчина, человек», в отрицательной конструкции оно имеет обобщающий смысл. «Никто» ясно и естественно передаёт невозможность для любого человека.
- source_word: לֵאלֹהִים
  choice: Богу
  rationale: В контексте псалма אֱלֹהִים обозначает единого Бога; дательный падеж передаёт направление платежа.
- source_word: כָּפְרוֹ
  choice: выкуп за него
  rationale: כֹּפֶר — цена освобождения, выкуп. Местоименный суффикс допускает соотнесение с тем, кого выкупают; оборот «за него» делает эту связь естественной по-русски, не привнося жертвенно-искупительной терминологии.
- source_word: אָח לֹא
  choice: Никто не сможет выкупить брата
  rationale: 'Начальная последовательность синтаксически трудна: אָח можно понимать как существительное «брат» при глаголе «выкупить», тогда как отрицание и אִישׁ образуют обобщённое «никто». Основной текст следует этому наиболее связному прочтению, а примечание сохраняет неоднозначность конструкции.'
theological_decisions:
- issue: Смысл כֹּפֶר как платежа Богу
  choice: выкуп, который человек не в силах дать Богу за другого человека
  alternative: искупительная плата Богу либо цена освобождения в более общем смысле
  rationale: «Выкуп» сохраняет образ цены за освобождение и мысль о человеческом бессилии перед смертью, не вводя в стих более развитую жертвенную или конфессиональную терминологию.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка без архаизмов. Синтаксическая неоднозначность начала еврейского стиха сохранена в примечании.
