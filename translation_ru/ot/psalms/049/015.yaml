  text: אַךְ אֱלֹהִ֗ים יִפְדֶּ֣ה נַ֭פְשִׁ/י מִֽ/יַּד שְׁא֑וֹל כִּ֖י יִקָּחֵ֣/נִי סֶֽלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/015.yaml
  text: But God will redeem my life from the hand of Sheol[a], for he will take me[b]. Selah
translation:
  language: ru
  text: Но Бог избавит мою жизнь от власти Шеола[a], ибо Он возьмёт меня[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Шеол — древнееврейское название мира мёртвых; возможные варианты перевода: «могила» или «мир мёртвых».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «примет меня».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Частица противопоставляет участь псалмопевца судьбе смертных и богатых, о которой говорится в контексте; русское «но» естественно передаёт это противопоставление.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном предложении это обычное обозначение единого Бога Израиля.
- source_word: יִפְדֶּה
  choice: избавит
  rationale: Глагол פדה означает выкупить или избавить из-под чьей-либо власти. «Избавит» естественно сочетается с образом власти Шеола, не предполагая явно названной выкупной платы.
- source_word: נַפְשִׁי
  choice: мою жизнь
  rationale: Здесь נֶפֶשׁ обозначает жизнь или самого живого человека, а не обязательно нематериальную душу; «мою жизнь» соответствует теме смерти и избавления.
- source_word: מִיַּד
  choice: из власти
  rationale: Буквально «из руки». В этом обороте рука означает власть или хватку; «из власти» ясно и естественно передаёт смысл, тогда как буквальное «из руки Шеола» по-русски звучит менее естественно.
- source_word: שְׁאוֹל
  choice: Шеола
  rationale: Транслитерация сохраняет особый древнееврейский термин, не сводя его ни к могиле как месту погребения, ни к более позднему представлению об аде. Значение поясняется в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание уверенности, выраженной в первой строке.
- source_word: יִקָּחֵנִי
  choice: Он примет меня
  rationale: לקח буквально означает «взять», но при Боге как субъекте может подразумевать принятие человека к Себе. «Примет меня» естественно по-русски и не уточняет способ или время этого действия; более буквальный вариант приведён в сноске.
- source_word: סֶלָה
  choice: Села
  rationale: Традиционная транслитерация уместна, поскольку точное значение и функция термина остаются неясными.
theological_decisions:
- issue: Значение נַפְשִׁי в контексте смерти и избавления
  choice: «мою жизнь»
  alternative: «мою душу»; «меня самого»
  rationale: Такой перевод не привносит в древнееврейскую поэзию более позднее строгое противопоставление тела и души и передаёт речь о жизни или личности в целом.
- issue: Характер избавления от Шеола
  choice: 'Сохранено общее утверждение: Бог избавит жизнь псалмопевца из власти Шеола и примет его'
  alternative: Явное указание на воскресение; только спасение от преждевременной смерти
  rationale: Еврейский текст выражает уверенность в Божьем избавлении, но не уточняет систематически, имеется ли в виду воскресение, посмертное общение с Богом или окончательное оправдание. Перевод не снимает этой напряжённости.
- issue: Смысл Божьего действия יִקָּחֵנִי
  choice: «Он примет меня»
  alternative: «Он возьмёт меня»
  rationale: «Примет» передаёт возможный контекстуальный оттенок принятия Богом, не добавляя «к Себе» и не превращая намёк в недвусмысленное учение; буквальная возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис прост и понятен; термин «Шеол» сохранён ради точности и снабжён пояснением. Заглавная буква в местоимении «Он» следует принятой русской библейской норме благоговейного обозначения Бога.
