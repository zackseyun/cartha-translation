  text: לָ֣/מָּה אִ֭ירָא בִּ֣/ימֵי רָ֑ע עֲוֺ֖ן עֲקֵבַ֣/י יְסוּבֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/005.yaml
  text: Why should I fear in days of evil[a], when the iniquity of my pursuers surrounds me?
translation:
  language: ru
  text: Почему мне бояться в дни бедствия, когда беззаконие идущих за мной по пятам окружает меня?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «когда беззаконие моих пят окружает меня». Неясное еврейское выражение может означать беззаконие тех, кто идёт за человеком по пятам или старается его запнуть; возможно также понимание: собственное беззаконие следует за ним по пятам.'
    reason: Сохранение неоднозначности выражения עֲוֹן עֲקֵבַי.
lexical_decisions:
- source_word: לָמָּה אִירָא
  choice: Почему мне бояться
  rationale: Риторический вопрос с имперфектом естественно передаётся по-русски инфинитивной конструкцией, выражающей отсутствие основания для страха.
- source_word: בִּימֵי רָע
  choice: в дни бедствия
  rationale: Слово רָע здесь допускает значение зла, беды или несчастья; «бедствие» естественно для контекста угрозы и не сужает выражение до нравственного зла.
- source_word: עֲוֹן
  choice: беззаконие
  rationale: Передаёт нравственную тяжесть עָוֹן, которое может обозначать проступок, вину или последствие вины.
- source_word: עֲקֵבַי
  choice: идущих за мной по пятам
  rationale: Буквально форма связана с «моими пятами»; русская идиома сохраняет образ пят и позволяет понять выражение как указание на преследователей, не устраняя полностью неоднозначность.
- source_word: יְסוּבֵּנִי
  choice: окружает меня
  rationale: Передаёт значение глагола סבב и сохраняет единственное число, согласованное с «беззаконие».
theological_decisions:
- issue: Толкование трудного выражения עֲוֹן עֲקֵבַי
  choice: Беззаконие людей, идущих за псалмопевцем по пятам
  alternative: Моё собственное беззаконие следует за мной по пятам; беззаконие у моих пят; беззаконие тех, кто старается меня запнуть
  rationale: Контекст допускает понимание враждебных преследователей, однако еврейское выражение буквально упоминает «мои пяты» и остаётся неоднозначным. Основной текст использует понятную русскую идиому, а сноска сохраняет альтернативы.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Выражение «идущих за мной по пятам» понятно обычному читателю и сохраняет исходный телесный образ; неоднозначность подробно отмечена в сноске.
