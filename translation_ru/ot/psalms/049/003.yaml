lexical_decisions:
- source_word: פִּי
  choice: уста мои
  rationale: Сохраняет еврейский образ уст как органа речи; «уста» естественно для возвышенной поэзии и не смешивает образ с самой речью.
- source_word: יְדַבֵּר
  choice: изрекут
  rationale: Будущее время передаёт имперфект как заявление о намерении; «изрекут» идиоматично сочетается с «устами».
- source_word: חָכְמוֹת
  choice: мудрость
  rationale: Формально множественное число здесь, вероятнее всего, выражает абстрактное понятие; русское единственное число звучит естественно.
- source_word: הָגוּת
  choice: размышление
  rationale: Передаёт внутреннее обдумывание; связь с сердцем сохраняет представление о внутреннем источнике наставления.
- source_word: לִבִּי
  choice: сердца моего
  rationale: Сохраняет образ сердца как средоточия мысли и внутренней жизни, а также поэтический порядок речи.
- source_word: תְבוּנוֹת
  choice: разумение
  rationale: Формально множественное число, вероятно, употреблено абстрактно; «разумение» сохраняет параллель с «мудростью» и достоинство поэтического регистра.
