lexical_decisions:
- source_word: הַבֹּטְחִים
  choice: те, кто полагается
  rationale: Субстантивированное причастие qal мужского рода множественного числа обозначает людей, для которых такое упование характерно; современная русская конструкция «те, кто полагается» естественно передаёт этот смысл.
- source_word: עַל
  choice: на
  rationale: При глаголе בטח предлог указывает на объект упования; по-русски нормативно «полагаться на».
- source_word: חֵילָם
  choice: своё богатство
  rationale: חַיִל может означать силу, средства или богатство. Параллельное עֹשֶׁר во второй строке поддерживает здесь материально-экономический смысл.
- source_word: וּבְרֹב
  choice: и … множеством
  rationale: רֹב выражает большое количество или изобилие. Творительный падеж после «хвалится» позволяет естественно передать еврейскую конструкцию בְּ без тяжеловесного оборота.
- source_word: עָשְׁרָם
  choice: своих сокровищ
  rationale: עֹשֶׁר означает богатство, достаток. «Сокровища» сохраняет материальный смысл и поэтическое различие с חַיִל, переведённым как «богатство».
- source_word: יִתְהַלָּלוּ
  choice: хвалится
  rationale: Hitpael от הלל в данном контексте означает хвалиться или кичиться; «хвалится» ясно и достойно передаёт смысл без излишнего усиления.
