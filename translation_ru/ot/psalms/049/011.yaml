lexical_decisions:
- source_word: קִרְבָּם
  choice: в глубине души они думают
  rationale: Масоретская огласовка указывает на «их внутренность, то, что у них внутри». По-русски эта внутренняя мысль естественно передаётся выражением «в глубине души они думают». Альтернативное понимание «их могилы» сохранено в сноске.
- source_word: בָּתֵּימוֹ
  choice: их дома
  rationale: Обычное значение בַּיִת — «дом». Оно соответствует параллельному «жилища» и теме мнимого постоянства земного владения.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт представление о неограниченной продолжительности; именная конструкция сохраняет сжатость еврейской строки.
- source_word: מִשְׁכְּנֹתָם
  choice: их жилища
  rationale: Нейтральное современное обозначение мест проживания, сохраняющее параллелизм с «домами».
- source_word: לְדֹר וָדֹר
  choice: из рода в род
  rationale: Устойчивое русское выражение, передающее продолжение через сменяющиеся поколения.
- source_word: קָרְאוּ
  choice: называют
  rationale: В данном контексте קרא означает давать имя. Настоящее время по-русски естественно выражает характерное действие, обозначенное еврейским перфектом.
- source_word: בִּשְׁמוֹתָם
  choice: своими именами
  rationale: Передаёт называние владений собственными именами владельцев без ненужной тяжеловесности.
- source_word: עֲלֵי אֲדָמוֹת
  choice: земли
  rationale: Множественное אֲדָמוֹת здесь указывает на земельные владения или территории. «Земли» сохраняет образ и остаётся естественным по-русски.
theological_decisions:
- issue: Масоретское קִרְבָּם и альтернативное понимание «их могилы»
  choice: 'Основной текст следует огласованному WLC: «В глубине души они думают»'
  alternative: «Их могилы — дома им навеки»
  rationale: Предоставленный масоретский текст поддерживает значение «их внутренность», однако древняя и переводческая традиция знает текстовое или вокализационное понимание «могилы». Оно существенно меняет образ, поэтому сохранено в сноске, а не устранено.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Двоеточие и именные конструкции сохраняют афористичность и параллелизм еврейского стиха; архаизмы и конфессионально окрашенная терминология не используются.
