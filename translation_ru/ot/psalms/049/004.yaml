lexical_decisions:
- source_word: אַטֶּה
  choice: Приклоню
  rationale: Гифиль глагола נטה с дополнением «ухо» выражает намеренное внимательное слушание; «приклоню ухо» сохраняет образ оригинала и естественно звучит в возвышенной современной речи.
- source_word: לְמָשָׁל
  choice: к мудрому изречению
  rationale: מָשָׁל может обозначать пословицу, притчу или назидательное мудрое изречение. В контексте псалма выражение «мудрое изречение» достаточно широко и не сужает значение до одного жанра.
- source_word: אָזְנִי
  choice: ухо моё
  rationale: Сохранено единственное число еврейского текста и поэтическая конструкция с притяжательным местоимением.
- source_word: אֶפְתַּח
  choice: раскрою
  rationale: פתח буквально означает «открыть». «Раскрою» сохраняет метафору открытия, одновременно естественно сочетаясь в русском языке с загадкой и не сводя действие только к объяснению.
- source_word: בְּכִנּוֹר
  choice: под звуки лиры
  rationale: כִּנּוֹר — древний струнный инструмент лирообразного типа. Предлог ב допускает инструментальное или сопроводительное понимание; «под звуки лиры» естественно передаёт музыкальное сопровождение.
- source_word: חִידָתִי
  choice: мою загадку
  rationale: חִידָה означает загадку, иносказательное или трудное для понимания изречение. «Загадка» ясно и прямо сохраняет основной образ.
