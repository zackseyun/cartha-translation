  text: כִּ֤י לֹ֣א בְ֭/מוֹת/וֹ יִקַּ֣ח הַ/כֹּ֑ל לֹא יֵרֵ֖ד אַחֲרָ֣י/ו כְּבוֹדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/017.yaml
  text: For at his death he will take nothing[c][b][a]; his glory will not go down after him.
translation:
  language: ru
  text: Ведь когда он умрёт, ничего не возьмёт[a]; слава его не сойдёт вслед за ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не возьмёт всего»; возможно также: «не возьмёт ничего из этого».'
    reason: lexical_alternative
  - marker: b
    text: «Слава» может также означать честь, великолепие, богатство или положение. Образ «не сойдёт вслед за ним» может отсылать к смерти, могиле или шеолу, но место назначения в еврейском тексте не названо.
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предшествующей мысли; «ведь» естественно передаёт пояснительно-причинную связь в русском поэтическом рассуждении.
- source_word: בְמוֹתוֹ
  choice: умирая
  rationale: Предлог בְּ с существительным «смерть» и местоименным суффиксом имеет временное значение. Деепричастная форма звучит естественно и означает «когда он умирает».
- source_word: לֹא ... יִקַּח הַכֹּל
  choice: ничего не возьмёт с собой
  rationale: 'Буквально: «не возьмёт всё/целое». Под отрицанием выражение по смыслу означает, что человек не возьмёт ничего из своего достояния; «с собой» ясно передаёт контекст смерти, не уточняя место назначения.'
- source_word: יֵרֵד
  choice: не сойдёт
  rationale: Глагол ירד означает «спускаться, сходить». Выбор сохраняет пространственный образ нисхождения и не добавляет отсутствующего в еврейском тексте указания на могилу или шеол.
- source_word: אַחֲרָיו
  choice: вслед за ним
  rationale: 'Передаёт последовательность и образ следования: слава человека не отправится вниз после него.'
- source_word: כְּבוֹדוֹ
  choice: слава его
  rationale: כבוד охватывает значения славы, чести, великолепия и общественно-материального веса. «Слава» сохраняет широту и поэтическую силу слова.
theological_decisions:
- issue: Неуказанное место нисхождения после смерти
  choice: Сохранить образ «не сойдёт вслед за ним», не называя могилу или шеол.
  alternative: «Не последует за ним в могилу» или «не сойдёт с ним в шеол».
  rationale: Еврейский текст подразумевает контекст смерти, однако прямо не называет место назначения. Более конкретная формулировка устранила бы подлинную недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой поэзии. Инверсия «слава его» поддерживает возвышенный регистр, оставаясь понятной; конкретный образ нисхождения сохранён без конфессионального уточнения.
