  yaml_path: translation/ot/psalms/049/016.yaml
  text: Do not fear when a man becomes rich[a], when the glory of his house increases;
translation:
  language: ru
  text: 'Не бойся, когда человек богатеет,

    когда умножается слава его дома[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его семьи» или «его владения»; еврейское слово «дом» может обозначать не только здание, но также семью, хозяйство или владение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: אַל с префиксальной формой выражает запрет; краткое «Не бойся» естественно для русской поэзии и точно передаёт еврейскую конструкцию.
- source_word: כִּי
  choice: когда
  rationale: В обоих случаях כִּי вводит обстоятельство, которое не должно вызывать страх; «когда» яснее передаёт этот ситуативный смысл, чем причинное «потому что».
- source_word: יַעֲשִׁר
  choice: богатеет
  rationale: Форма от עשר здесь имеет непереходный смысл «становиться богатым»; настоящее время по-русски естественно выражает обобщённую ситуацию.
- source_word: אִישׁ
  choice: человек
  rationale: «Человек» сохраняет единственное число и обобщённый характер изречения, не создавая ненужного акцента на поле.
- source_word: יִרְבֶּה
  choice: умножается
  rationale: Глагол רבה означает «становиться многочисленным, увеличиваться»; «умножается» сохраняет поэтический строй и хорошо сочетается со «славой».
- source_word: כְּבוֹד
  choice: слава
  rationale: כבוד может обозначать славу, почёт, весомость или достаток. «Слава» сохраняет широкий образ и не сводит смысл исключительно к имуществу.
- source_word: בֵּיתוֹ
  choice: его дома
  rationale: בַּיִת буквально означает «дом», но может охватывать семью, хозяйство или владение; буквальный образ сохранён в тексте, а широта значения отмечена в сноске.
