  text: וְ֭/יֵקַר פִּדְי֥וֹן נַפְשָׁ֗/ם וְ/חָדַ֥ל לְ/עוֹלָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/008.yaml
  text: For the ransom of their life is costly[a], and it ceases forever[b],
translation:
  language: ru
  text: Ибо выкуп за их жизнь дорог, и навсегда приходится от него отказаться[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза сжата; буквальнее: «и он прекращается навеки». Возможный смысл: попытка выкупа навсегда прекращается или от неё приходится отказаться.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיֵקַר
  choice: слишком дорог
  rationale: Корень יקר выражает высокую ценность или дороговизну. В контексте невозможности человеку выкупить другого подразумевается недоступно высокая цена; русское «слишком дорог» естественно передаёт эту контекстуальную силу.
- source_word: פִּדְיוֹן
  choice: выкуп
  rationale: Существительное обозначает цену освобождения. «Выкуп» сохраняет конкретный платёжно-правовой образ лучше, чем более широкое «искупление».
- source_word: נַפְשָׁם
  choice: их жизнь
  rationale: נפש здесь означает жизнь человека, которую пытаются избавить от смерти, а не обязательно нематериальную душу.
- source_word: וְחָדַל לְעוֹלָם
  choice: и навеки останется недостижимым
  rationale: Сжатая еврейская фраза буквально выражает прекращение или оставление навсегда. В контексте выкупной цены выбранный вариант естественно передаёт, что такой выкуп окончательно недоступен, не приписывая ему способность «быть достаточным», которой в тексте прямо нет.
theological_decisions:
- issue: Значение נפש в контексте выкупа от смерти
  choice: жизнь
  alternative: душа
  rationale: Контекст говорит о сохранении человека от смерти; «жизнь» передаёт широту еврейского נפש и не навязывает антропологического дуализма.
- issue: Толкование сжатой фразы וְחָדַל לְעוֹלָם
  choice: выкуп навеки останется недостижимым
  alternative: и прекратится навеки; и от него навсегда отказываются
  rationale: Фраза грамматически сжата и допускает разные способы восстановления подразумеваемого смысла. Основной текст передаёт контекстуальную невозможность выкупа, а более буквальные возможности сохраняются в примечании.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный. «Выкуп» сохраняет экономико-правовой образ; «их жизнь» естественно передаёт собирательную конструкцию. Союз «ведь» связывает стих с аргументом предыдущей строки.
