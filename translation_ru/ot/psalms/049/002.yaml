lexical_decisions:
- source_word: גַּם ... גַּם
  choice: и ... и
  rationale: Повтор גַּם включает обе названные группы; русская парная конструкция «и … и» естественно передаёт это значение.
- source_word: בְּנֵי אָדָם
  choice: незнатные
  rationale: В паре с בְּנֵי אִישׁ выражение, вероятнее всего, обозначает людей невысокого общественного положения, а не буквальных «сынов Адама».
- source_word: בְּנֵי אִישׁ
  choice: знатные
  rationale: В данном противопоставлении выражение указывает на людей высокого общественного положения; «знатные» кратко и ясно сохраняет социальный контраст.
- source_word: יַחַד
  choice: все вместе
  rationale: Слово подводит итог перечислению и объединяет все названные группы. Добавление «все» естественно для русского языка и делает охват явным, не изменяя смысла.
- source_word: עָשִׁיר
  choice: богатые
  rationale: Прямой и естественный русский эквивалент в социально-экономической паре.
- source_word: וְאֶבְיוֹן
  choice: и бедные
  rationale: В противопоставлении богатым «бедные» передаёт смысл яснее и естественнее, чем возможное «нуждающиеся».
