  text: אָדָ֣ם בִּ֭/יקָר וְ/לֹ֣א יָבִ֑ין נִמְשַׁ֖ל כַּ/בְּהֵמ֣וֹת נִדְמֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/020.yaml
  text: Man in honor[a], yet without understanding, is like the beasts that perish.
translation:
  language: ru
  text: Человек в почёте, но не понимает, подобен животным, которые гибнут.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…подобен животным, которые подобны ему», если последнее слово понимать в значении «подобны», а не «гибнут».'
    reason: alternative_reading
lexical_decisions:
- source_word: אָדָם
  choice: человек
  rationale: Единственное число употреблено обобщённо, как в изречении о любом человеке; «человек» естественно передаёт это значение по-русски.
- source_word: בִּיקָר
  choice: в почёте
  rationale: Сочетание обозначает состояние чести, достоинства или высокого положения; «в почёте» кратко и сохраняет контраст с отсутствием понимания.
- source_word: וְלֹא יָבִין
  choice: но не понимает
  rationale: Глагол בין означает понимать, постигать, различать. Союз передан как «но», поскольку контекст подчёркивает противопоставление почёта и непонимания.
- source_word: נִמְשַׁל
  choice: подобен
  rationale: Нифаль от משל здесь выражает уподобление или сравнение; «подобен» естественно для поэтической речи и сохраняет возвышенный регистр.
- source_word: כַּבְּהֵמוֹת
  choice: животным
  rationale: בְּהֵמוֹת здесь имеет широкое значение животных, а не только домашнего скота. Русское «животным» ясно и не вносит лишней отрицательной окраски.
- source_word: נִדְמוּ
  choice: которые гибнут
  rationale: В контексте псалма форма обычно понимается как указание на гибель; такое прочтение поддерживает тему неизбежности смерти, не устраняющуюся человеческим почётом.
theological_decisions:
- issue: Значение заключительного נִדְמוּ
  choice: понято как «гибнут», относящееся к животным
  alternative: 'понято от значения «быть подобным / стать подобным»: «подобен животным — стал таким же, как они»'
  rationale: Основное чтение образует ясное завершение псалма о смертности человека независимо от его положения. Поскольку возможен разбор последнего глагола в значении подобия, эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной и достойной поэтической формой. Синтаксис сохраняет прямой контраст между почётом, непониманием и смертностью.
