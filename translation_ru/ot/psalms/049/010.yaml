  text: כִּ֤י יִרְאֶ֨ה חֲכָ֘מִ֤ים יָמ֗וּתוּ יַ֤חַד כְּסִ֣יל וָ/בַ֣עַר יֹאבֵ֑דוּ וְ/עָזְב֖וּ לַ/אֲחֵרִ֣ים חֵילָֽ/ם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/010.yaml
  text: For he sees that wise men die[a]; together the fool and the brutish man perish[c][b], and they leave their wealth to others.
translation:
  language: ru
  text: Ведь он видит, что мудрецы умирают[a]; вместе гибнут глупец и неразумный[b], и своё богатство[c] оставляют другим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мудрые». В еврейском тексте употреблена форма мужского рода, обозначающая обобщённый человеческий тип.'
    reason: lexical_alternative
  - marker: b
    text: «Неразумный» передаёт слово о человеке, лишённом разумения, грубом, почти подобном бессловесному животному.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «своё имущество», «свои средства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Передаёт пояснительно-причинную связь с предыдущей мыслью естественным для современного русского языка союзным словом.
- source_word: יִרְאֶה
  choice: он видит
  rationale: Сохраняет форму 3-го лица мужского рода единственного числа; настоящее время выражает общее наблюдение.
- source_word: חֲכָמִים
  choice: мудрецы
  rationale: Субстантивированная форма мужского рода во множественном числе обозначает тип людей; «мудрецы» звучит естественно и точно.
- source_word: יָמוּתוּ
  choice: умирают
  rationale: Прямо передаёт значение смерти, а настоящее время соответствует характеру общего утверждения.
- source_word: יַחַד
  choice: вместе
  rationale: Подчёркивает общность участи разных человеческих типов, не обязательно одновременность их смерти.
- source_word: כְּסִיל
  choice: глупец
  rationale: Обычный термин литературы мудрости для нравственно и умственно неразумного человека.
- source_word: בַעַר
  choice: невежда
  rationale: Передаёт образ нерассудительного, лишённого понимания человека; примечание сохраняет более сильный оттенок бесчувственной, почти животной неразумности.
- source_word: יֹאבֵדוּ
  choice: гибнут
  rationale: Передаёт более сильный оттенок אבד — погибнуть, исчезнуть, — а не просто умереть.
- source_word: וְעָזְבוּ
  choice: а ... оставляют
  rationale: «Оставляют» естественно выражает передачу имущества после смерти; союз «а» ясно обозначает переход к судьбе богатства.
- source_word: לַאֲחֵרִים
  choice: другим
  rationale: Точно сохраняет неопределённое обозначение иных людей, не усиливая его до «чужих» или «посторонних».
- source_word: חֵילָם
  choice: своё богатство
  rationale: В контексте смертности חֵיל обозначает имущество или материальные средства; возвратное «своё» естественно соотносит богатство с составным подлежащим.
theological_decisions:
- issue: Род и обобщающий характер חֲכָמִים, כְּסִיל и בַעַר
  choice: мудрецы ... глупец и невежда
  alternative: мудрые люди ... глупый и неразумный человек
  rationale: Сохранены грамматически мужские наименования типичных представителей человечества, при этом примечание поясняет их обобщающий смысл и не ограничивает утверждение только мужчинами.
- issue: Различие между יָמוּתוּ и יֹאבֵדוּ
  choice: умирают ... гибнут
  alternative: умирают ... умирают
  rationale: 'Лексическое различие исходного текста сохранено без вывода о разных посмертных участях: во второй половине подчёркнуты гибель и исчезновение, общие для глупца и невежды.'
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис остаётся ясным для обычного читателя; параллелизм «умирают ... гибнут» и обобщающие наименования человеческих типов сохранены.
