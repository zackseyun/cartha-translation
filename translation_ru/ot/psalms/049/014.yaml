base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/014.yaml
  text: Like sheep they are appointed for Sheol[a]; death will shepherd them, and the upright will rule over them in the morning. Their form will waste away in Sheol[d][c][b], far from its lofty dwelling.
translation:
  language: ru
  text: Словно овец, их отвели в Шеол[a]; смерть будет пасти их. Наутро честные люди будут господствовать над ними[b]. Их облик[c] истлеет в Шеоле, вдали от их величественного жилища[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шеол — мир мёртвых; это понятие шире, чем отдельная могила.
    reason: cultural_note
  - marker: b
    text: 'Или: «с наступлением утра честные люди будут властвовать над ними».'
    reason: alternative_reading
  - marker: c
    text: 'Еврейское слово и вся конструкция трудны для понимания; возможно также: «их скала» или «их сила».'
    reason: lexical_alternative
  - marker: d
    text: 'Заключительная еврейская фраза неясна. Возможно также: «Шеол поглотит их вдали от их величественного жилища» или близкое по смыслу прочтение.'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּצֹּאן
  choice: Как овец
  rationale: Передаёт собирательный образ мелкого скота и сохраняет сравнение с беспомощным стадом.
- source_word: לִשְׁאוֹל שַׁתּוּ
  choice: их определили для Шеола
  rationale: שׁית означает «поместить, назначить, определить»; предлог ל указывает на предназначение или конечную участь. Безличная конструкция естественна по-русски и не вводит явно названного деятеля.
- source_word: מָוֶת יִרְעֵם
  choice: смерть будет пасти их
  rationale: Сохраняется олицетворение смерти и продолжение образа стада; רעה здесь передано в прямом значении «пасти».
- source_word: וַיִּרְדּוּ בָם
  choice: будут господствовать над ними
  rationale: Передаёт значение владычества, не подменяя его возможным, но менее вероятным образом попирания.
- source_word: יְשָׁרִים
  choice: люди прямого сердца
  rationale: Естественно выражает идею нравственной прямоты и не отождествляет автоматически יָשָׁר с отдельной еврейской лексемой «праведный».
- source_word: לַבֹּקֶר
  choice: наутро
  rationale: Кратко и естественно передаёт временное значение, не уточняя, буквальное это утро или образ грядущего перелома.
- source_word: וְצוּרָם
  choice: их облик
  rationale: Контекстуальное понимание трудной формы как «облик, образ» хорошо сочетается с последующим глаголом разрушения; буквальные варианты «их скала» или «их сила» отмечены в сноске.
- source_word: לְבַלּוֹת
  choice: истлеет
  rationale: Передаёт значение изнашивания, разрушения и исчезновения; конечная русская форма делает трудную еврейскую конструкцию читаемой.
- source_word: מִזְּבֻל לוֹ
  choice: вдали от своего величественного жилища
  rationale: זְבֻל может обозначать возвышенное или величественное жилище. Наречное понимание фразы сохраняет контраст между прежним положением и тлением в Шеоле, а её неуверенность отмечена в сноске.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: Шеол
  alternative: могила; мир мёртвых
  rationale: Еврейское слово обозначает не только отдельную могилу, поэтому транслитерация сохраняет более широкий смысл и не навязывает позднейшую богословскую схему.
- issue: Смысл выражения «наутро»
  choice: сохранено без истолкования
  alternative: при воскресении; в день суда; после ночи бедствия
  rationale: Стих допускает эсхатологическое и образное прочтение, но сам по себе не уточняет его, поэтому перевод не разрешает эту напряжённость за читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранены пастушеский образ, олицетворение смерти, термин «Шеол» и неоднозначность слов «наутро» и заключительной фразы; архаическая синтаксическая тяжеловесность по возможности устранена.
