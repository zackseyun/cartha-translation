  - severity: medium
    issue: «Вдали от своего величественного жилища» имеет неудачный референт.
    rationale: Русское возвратное «своего» естественно отсылает к ближайшему существительному «облик», словно облик имел жилище. Еврейская заключительная фраза трудна, но в выбранном прочтении речь уместнее отнести к людям; альтернативы следует оставить в сноске.
