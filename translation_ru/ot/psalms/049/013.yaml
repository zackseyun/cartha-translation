lexical_decisions:
- source_word: זֶה
  choice: Таков
  rationale: Указательное слово вводит итоговую оценку описанного выше; «таков» естественно связывает её с существительным «путь».
- source_word: דַרְכָּם
  choice: их путь
  rationale: Сохраняется образ пути, который одновременно означает образ жизни и поведение.
- source_word: כֵּסֶל לָמוֹ
  choice: их безрассудство
  rationale: כֵּסֶל прежде всего выражает глупость или безрассудство; сжатая еврейская конструкция передана приложением, не устраняющим её оценочного смысла.
- source_word: וְאַחֲרֵיהֶם
  choice: но и те, кто идёт вслед за ними
  rationale: Оборот может обозначать людей, приходящих после них или следующих их примеру. Формулировка сохраняет оба оттенка и не ограничивает речь только биологическими потомками.
- source_word: בְּפִיהֶם
  choice: их речи
  rationale: Буквально «их уста»; в данном сочетании уста метонимически обозначают сказанное ими. Буквальная форма и неоднозначность отмечены в сноске.
- source_word: יִרְצוּ
  choice: одобряют
  rationale: Глагол רצה означает благоволить, принимать с одобрением, находить приятным. «Одобряют» естественно передаёт благосклонное отношение к сказанному.
- source_word: סֶלָה
  choice: Села
  rationale: Сохранена традиционная транслитерация неясного литургического или музыкального обозначения.
theological_decisions:
- issue: Кого обозначает וְאַחֲרֵיהֶם
  choice: людей, которые приходят после них и следуют за ними
  alternative: их потомков
  rationale: Еврейский оборот допускает как общее обозначение последователей, так и потомков. Основной текст не сужает смысл до родства.
- issue: Смысл כֵּסֶל
  choice: безрассудство
  alternative: самоуверенность, ложная уверенность
  rationale: В контексте псалма слово даёт отрицательную оценку их жизненному пути, однако возможный оттенок уверенности сохранён в сноске.
- issue: Соотнесение местоимения в בְּפִיהֶם
  choice: речи ранее упомянутых людей получают одобрение тех, кто следует за ними
  alternative: последующие люди находят удовольствие в собственных словах
  rationale: Наиболее связное прочтение соотносит «их» с людьми, чей путь только что осуждён, но сжатый синтаксис допускает иное соотнесение, поэтому оно отмечено в сноске.
translation_notes:
  register: 'Современный литературный русский язык с сохранением поэтического образа пути. «Безрассудство» звучит достойно и понятно, а «идёт вслед за ними» передаёт одновременно временное следование и подражание. Частица «но и» подчёркивает иронию: несмотря на безрассудство этого пути, позднейшие люди его одобряют.'
