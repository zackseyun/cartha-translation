  text: תָּ֭בוֹא עַד דּ֣וֹר אֲבוֹתָ֑י/ו עַד נֵ֝֗צַח לֹ֣א יִרְאוּ אֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/019.yaml
  text: He will go to the generation of his fathers[c][b][a]; they will never again see the light.
translation:
  language: ru
  text: Он уйдёт к поколению своих отцов[a][b]; они вовек не увидят света[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Форма первого глагола может читаться как «ты придёшь», тогда как далее стоит множественное число: «они увидят». Контекст позволяет понимать первую часть как продолжение рассказа о человеке: «он уйдёт».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «своих предков». Буквально: «своих отцов».'
    reason: lexical_alternative
  - marker: c
    text: «Увидеть свет» — образное выражение, означающее жить; здесь речь о том, что умершие больше не возвратятся к жизни в этом мире.
    reason: cultural_note
lexical_decisions:
- source_word: תָּבוֹא
  choice: он придёт
  rationale: Глагольная форма в масоретском тексте морфологически является 2-м лицом мужского рода единственного числа («ты придёшь»), однако контекст продолжает говорить о человеке из предыдущего стиха, а אֲבוֹתָיו означает «его отцов». В основном тексте выбран связный контекстуальный перевод «он придёт», а формальное расхождение отмечено в сноске.
- source_word: עַד
  choice: к
  rationale: Перед דּוֹר אֲבוֹתָיו предлог обозначает предел или направление движения; русское «к» естественно сочетается с глаголом «придёт».
- source_word: דּוֹר
  choice: поколение
  rationale: Сохранено обычное значение существительного דּוֹר. Здесь выражение обозначает поколение или круг умерших предков, к которым приходит человек.
- source_word: אֲבוֹתָיו
  choice: своих отцов
  rationale: Буквально передаёт родственное обозначение «его отцов»; возвратное «своих» естественно в русском предложении с подлежащим «он». Возможное смысловое уточнение «предков» вынесено в сноску.
- source_word: עַד נֵצַח
  choice: вовек
  rationale: 'В сочетании с отрицанием выражает окончательность: свет больше никогда не будет увиден. «Вовек» сохраняет краткость и возвышенный поэтический строй.'
- source_word: לֹא יִרְאוּ
  choice: они не увидят
  rationale: Форма глагола — 3-е лицо мужского рода множественного числа. Множественное число сохранено, чтобы передать переход от отдельного человека к поколению умерших, с которым он соединяется.
- source_word: אוֹר
  choice: света
  rationale: Сохранён образ света, который в данном контексте связан с жизнью; перевод не заменяет образ прямым толкованием.
theological_decisions:
- issue: Смена лица и числа в стихе
  choice: В первой части дано контекстуальное единственное число («он придёт»), во второй сохранено грамматическое множественное число («они… не увидят»).
  alternative: '«Ты придёшь… они не увидят»; либо сглаженное единственное число: «он придёт… он не увидит».'
  rationale: 'Форма תָּבוֹא сама по себе читается как 2-е лицо единственного числа, тогда как יִרְאוּ стоит во множественном числе. Контекст поддерживает отнесение первой формы к описываемому человеку. Множественное число второй формы не сглажено: оно позволяет услышать переход от отдельного человека к общности его умерших предков.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Синтаксис краток и сохраняет параллелизм еврейской строки; образ света и выражение «поколение своих отцов» оставлены без излишнего разъяснения в основном тексте.
