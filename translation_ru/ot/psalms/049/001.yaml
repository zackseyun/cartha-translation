lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Услышьте
  rationale: Форма повелительного наклонения во множественном числе служит прямым поэтическим призывом к внимательному слушанию; «услышьте» сохраняет её форму и возвышенную лаконичность.
- source_word: זֹאת
  choice: это
  rationale: Указательное местоимение отсылает к последующему наставлению псалмопевца.
- source_word: כָּל הָעַמִּים
  choice: все народы
  rationale: Множественное число עַמִּים обозначает народы или группы людей; русский эквивалент естественно передаёт всеобщий охват обращения.
- source_word: הַאֲזִינוּ
  choice: внимайте
  rationale: Повелительная форма выражает призыв слушать сосредоточенно; «внимайте» сохраняет поэтический регистр и параллелизм с «услышьте».
- source_word: כָּל יֹשְׁבֵי
  choice: все живущие в
  rationale: Субстантивированное причастие обозначает всех тех, кто обитает в определённой сфере; «все живущие» звучит естественно и не утяжеляет строку.
- source_word: חָלֶד
  choice: мире
  rationale: В данном всеобщем призыве слово обозначает мир человеческой жизни, обитаемый земной мир; возможный оттенок земной или преходящей сферы отмечен в сноске.
