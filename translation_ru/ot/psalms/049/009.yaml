  text: וִֽ/יחִי ע֥וֹד לָ/נֶ֑צַח לֹ֖א יִרְאֶ֣ה הַ/שָּֽׁחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/049/009.yaml
  text: that he should still live on forever and not see the Pit[a].
translation:
  language: ru
  text: чтобы он продолжал жить вечно и не увидел ямы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могилы»; возможно также: «тления».'
    reason: Лексема שחת допускает в данном контексте конкретный образ ямы или могилы, а также значение тления.
lexical_decisions:
- source_word: וִיחִי
  choice: чтобы он продолжал жить
  rationale: Форма глагола חיה в связи с предыдущей строкой выражает мыслимый, но недостижимый результат или цель. Союз «чтобы» естественно передаёт эту синтаксическую зависимость по-русски.
- source_word: עוֹד
  choice: продолжал
  rationale: Наречие указывает на продолжение жизни; его значение естественно включено в глагольное сочетание «продолжал жить».
- source_word: לָנֶצַח
  choice: вечно
  rationale: Сочетание ל с נצח обозначает неограниченную длительность; «вечно» точно и естественно передаёт этот смысл.
- source_word: לֹא
  choice: не
  rationale: Прямое отрицание следующего глагола.
- source_word: יִרְאֶה
  choice: увидел
  rationale: Сохранён еврейский образ «увидеть» в смысле столкнуться с чем-либо или испытать это, без поясняющей конкретизации в основном тексте.
- source_word: הַשָּׁחַת
  choice: ямы
  rationale: В поэтическом контексте смерти שחת может обозначать яму, могилу, погибель или тление. «Яма» сохраняет конкретный образ исходного текста и не сводит его только к погребению либо разложению.
theological_decisions:
- issue: Значение שחת в контексте смерти
  choice: ямы
  alternative: могилы; тления
  rationale: Основной вариант сохраняет широкий поэтический образ нисхождения к смерти. Возможные более узкие понимания — могила и тление — приведены в сноске, чтобы не устранять подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет зависимость от предыдущего стиха и поэтический образ оригинала. Порядок слов сделан естественным для русского чтения без устранения смысловой неоднозначности.
