    reason: cultural_note
lexical_decisions:
- source_word: חִצֵּי
  choice: стрелы
  rationale: 'Форма сопряжённого множественного числа от חֵץ; зависимость от גִבּוֹר естественно передана родительным падежом: «стрелы воина».'
- source_word: גִבּוֹר
  choice: воина
  rationale: В данном образе слово обозначает сильного, доблестного бойца; «воин» ясно сохраняет военный смысл и звучит естественно по-русски.
- source_word: שְׁנוּנִים
  choice: заострённые
  rationale: Причастно-прилагательное значение от שנן описывает стрелы как наточенные или заострённые. Выбор передаёт не просто общее качество остроты, а результат затачивания.
- source_word: עִם
  choice: вместе с
  rationale: Предлог связывает два параллельных образа; «вместе с» ясно выражает их сочетание, не уточняя сверх исходного текста характер связи.
- source_word: גַּחֲלֵי
  choice: углями
  rationale: Сопряжённое множественное число от גחלת. Слово передано без добавления «горящими», поскольку соответствующего определения в еврейском тексте нет.
- source_word: רְתָמִים
  choice: дрока
  rationale: Речь идёт о пустынном кустарнике ретаме, древесный уголь которого долго сохраняет жар. «Дрок» — понятное традиционное русское обозначение близкого типа кустарника; точная реалия пояснена в сноске.
