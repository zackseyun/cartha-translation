  source_fidelity: 'Текст точно передаёт еврейскую конструкцию: «заострённые стрелы» соответствует חִצֵּי ... שְׁנוּנִים, «воина» естественно передаёт גִּבּוֹר в воинском образе, а «вместе с углями дрока» сохраняет связь через עִם и не добавляет отсутствующего определения «горящие». Родительный оборот «углями дрока» приемлем как обозначение углей/древесного угля из этого кустарника.'
