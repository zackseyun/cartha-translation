lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: В прямом обращении естественная и укоренённая русская передача имени YHWH — звательная форма «Господи»; она сохраняет молитвенный характер строки.
- source_word: הַצִּילָה
  choice: избавь
  rationale: Императив נצל выражает мольбу о спасении от угрозы; «избавь» естественно сочетается с предлогом «от» и соответствует возвышенному молитвенному регистру.
- source_word: נַפְשִׁי
  choice: меня
  rationale: נפש с местоименным суффиксом здесь обозначает самого говорящего, его жизнь или личность. «Меня» ясно и естественно передаёт смысл, не навязывая узкого антропологического значения слова «душа».
- source_word: מִשְּׂפַת שֶׁקֶר
  choice: от лживых уст
  rationale: Буквально «от уст лжи/ложности»; прилагательное «лживых» естественно выражает отношение конструктивной цепочки, а образ уст сохраняет поэтический параллелизм.
- source_word: מִלָּשׁוֹן רְמִיָּה
  choice: от коварного языка
  rationale: רְמִיָּה обозначает обман, коварство или вероломство. «Коварного» сохраняет нравственную окраску намеренного обмана и поэтически соответствует «лживым устам».
theological_decisions:
- issue: Передача имени יְהוָה в прямом обращении
  choice: Господи
  alternative: Яхве
  rationale: Русская звательная форма «Господи» естественна в молитве и соответствует традиционной передаче тетраграмматона титулом; вариант «Яхве» точнее обозначает личное имя, но менее естественен в данном русском молитвенном регистре.
- issue: Антропологический смысл נַפְשִׁי
  choice: меня
  alternative: мою душу / мою жизнь
  rationale: В контексте просьбы об избавлении נֶפֶשׁ может обозначать целого человека, а не отдельную нематериальную часть. Основной текст сохраняет эту широту; примечание указывает буквальную форму и возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified молитвенным звучанием. Сохранены параллельные образы «уст» и «языка»; синтаксис прост и пригоден для публичного чтения.
