lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Традиционное надписание псалмов 120–134; множественное число «восхождений» сохраняет форму и возможный образ паломнического подъёма, не закрепляя единственное толкование.
- source_word: יְהוָה
  choice: Господь
  rationale: В современном русском библейском регистре «Господь» естественно и узнаваемо передаёт тетраграмматон; написание с прописной буквы отличает имя Бога в данном контексте.
- source_word: בַצָּרָתָה לִּי
  choice: в беде моей
  rationale: Естественная русская передача состояния тесноты, бедствия или скорби; порядок слов сохранён в поэтической форме.
- source_word: קָרָאתִי
  choice: воззвал я
  rationale: «Воззвал» передаёт обращённый к Богу настойчивый зов и соответствует возвышенному, но понятному поэтическому регистру.
- source_word: וַיַּעֲנֵנִי
  choice: и Он ответил мне
  rationale: Прямо сохраняет завершённое действие исходного текста без уточнения способа ответа.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: Господь
  alternative: Яхве
  rationale: Выбранная форма соответствует устойчивой русской библейской традиции и общелитературной понятности, не вводя конфессионально специфического прочтения.
- issue: Временное соотношение глаголов «воззвал» и «ответил»
  choice: Оба переданы прошедшим временем
  alternative: Настоящее или обобщающее прочтение первого глагола
  rationale: Обе еврейские формы в данном высказывании естественно описывают совершившиеся события; перевод не добавляет сведений о характере ответа.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Инверсия «воззвал я» сохраняет поэтический ритм, оставаясь понятной. Маркер сноски поставлен непосредственно после надписания, к которому относится.
