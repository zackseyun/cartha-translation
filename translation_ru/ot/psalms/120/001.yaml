lexical_decisions:
- source_word: שִׁיר
  choice: Песнь
  rationale: Существительное означает песню; «песнь» сохраняет поэтический и надписательный регистр, не подменяя исходное слово более узким термином «псалом».
- source_word: הַמַּעֲלוֹת
  choice: восхождений
  rationale: Передаёт буквальное значение движения вверх и устойчивое название цикла Псалмов 120–134, не уточняя спорное историческое происхождение надписания.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל указывает направление обращения, а тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: בַּצָּרָתָה לִּי
  choice: В беде моей
  rationale: Естественная русская передача еврейской конструкции «в бедствии для/у меня»; сохраняет серьёзность положения без лишнего усиления.
- source_word: קָרָאתִי
  choice: я воззвал
  rationale: «Воззвал» естественно для молитвенно-поэтического контекста и передаёт обращение к Богу в беде, не добавляя содержания крика как отдельной детали.
- source_word: וַיַּעֲנֵנִי
  choice: и Он ответил мне
  rationale: Передаёт последовательность действий и подразумеваемого субъекта — Яхве — ясным литературным русским языком.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное божественное имя; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Временной оттенок совершенных форм קָרָאתִי וַיַּעֲנֵנִי
  choice: 'прошедшее повествование: «воззвал… ответил»'
  alternative: 'настоящее или обобщённое свидетельство: «взываю… отвечает»'
  rationale: Еврейские формы естественнее всего описывают завершённое обращение и последовавший ответ; перевод не уточняет, каким именно образом был дан ответ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Синтаксис краток и понятен; традиционное «в беде моей» сохраняет поэтический ритм. Местоимение «Он» написано с прописной буквы как принятый благоговейный издательский выбор, не меняющий смысла оригинала.
