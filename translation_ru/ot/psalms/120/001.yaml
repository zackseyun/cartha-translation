  text: Песнь восхождений.[a] В беде моей я воззвал к Яхве, и Он ответил мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское надписание «Песнь восхождений» традиционно стоит в начале Псалмов 120–134; буквально возможно также: «песнь подъёмов».'
