base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/005.yaml
  text: Woe to me[a], for I have sojourned in Meshech[b]; I have dwelt among the tents of Kedar.
translation:
  language: ru
  text: 'Горе мне: я жил пришельцем в Мешехе, обитал среди[a] шатров Кедара[b]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с шатрами Кедара».'
    reason: lexical_alternative
  - marker: b
    text: Мешех и Кедар могут быть здесь поэтическими обозначениями далёких, враждебных народов, а не указанием на то, что псалмопевец буквально жил в обоих местах.
    reason: cultural_note
lexical_decisions:
- source_word: אֽוֹיָה לִי
  choice: Горе мне
  rationale: Краткое восклицание передаёт личную скорбь и тяжесть еврейского выражения естественным для русского языка образом.
- source_word: כִּי
  choice: ':'
  rationale: В данном контексте союз вводит причину скорби. Двоеточие естественно выражает эту причинно-пояснительную связь в русской поэтической речи, не утяжеляя строку союзом «потому что».
- source_word: גַרְתִּי
  choice: я жил пришельцем
  rationale: Глагол גור обозначает проживание чужеземца или пришельца, а не просто нейтральное «жил»; выбранное выражение сохраняет оттенок чуждости и непрочного положения.
- source_word: מֶשֶׁךְ
  choice: Мешех
  rationale: Собственное имя передано транслитерацией, без замены толкованием.
- source_word: שָׁכַנְתִּי
  choice: обитал
  rationale: Слово обозначает проживание или пребывание. «Обитал» сохраняет поэтический регистр и отличает этот глагол от более специфического «жил пришельцем» в первой половине стиха.
- source_word: עִם
  choice: среди
  rationale: Буквально «с», но в сочетании с шатрами речь естественно понимается как пребывание посреди лагеря или народа; буквальная возможность отмечена в сноске.
- source_word: אָהֳלֵי
  choice: шатров
  rationale: Сохранён конкретный образ шатров, который также может метонимически указывать на живущий в них народ.
- source_word: קֵדָר
  choice: Кедара
  rationale: Собственное имя народа передано транслитерацией и поставлено в требуемую русской конструкцией форму родительного падежа.
theological_decisions:
- issue: Следует ли понимать Мешех и Кедар буквально как места проживания или как поэтические образы далёких и враждебных народов?
  choice: Сохранить оба собственных имени в основном тексте и не уточнять характер проживания.
  alternative: Заменить имена обобщённым выражением «среди далёких враждебных народов» или прямо назвать их символическими.
  rationale: Еврейский текст непосредственно называет Мешех и Кедар. Их географическая удалённость друг от друга допускает поэтическое употребление, но сам стих не разрешает эту неоднозначность, поэтому она сохранена и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим строем. Выражение «жил пришельцем» сохраняет смысл чужеземного пребывания, а «обитал» поддерживает параллелизм без ненужного архаизирования.
