  text: מַה יִּתֵּ֣ן לְ֭/ךָ וּ/מַה יֹּסִ֥יף לָ֗/ךְ לָשׁ֥וֹן רְמִיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/003.yaml
  text: What will he give to you[a], and what more will he add to you, O deceitful tongue?
translation:
  language: ru
  text: Что даст тебе и что ещё прибавит тебе, язык лживый?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Что сделает с тобой и что ещё сделает с тобой, язык лживый?» Подразумеваемый субъект не назван; в контексте эти слова нередко понимают как указание на Божий суд.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יִּתֵּן לְךָ
  choice: Что даст тебе
  rationale: Прямой риторический вопрос сохраняет неопределённый подразумеваемый субъект еврейского глагола; форма мужского рода передаётся без уточнения, кто именно действует.
- source_word: וּמַה יֹסִיף לָךְ
  choice: и что ещё прибавит тебе
  rationale: «Ещё» естественно выражает добавочное значение יסף, а «прибавит» сохраняет параллелизм с «даст».
- source_word: לָשׁוֹן רְמִיָּה
  choice: язык лживый
  rationale: Сохранено поэтическое прямое обращение к языку как образу лживой речи; постпозиция определения придаёт строке dignified библейско-поэтическое звучание без архаизации.
theological_decisions:
- issue: Подразумеваемый субъект глаголов יִתֵּן и יֹסִיף
  choice: Не называть субъекта в основном тексте, сохранив форму «даст / прибавит»
  alternative: 'Уточнить: «Что сделает с тобой Бог и чем ещё покарает тебя?»'
  rationale: В еврейском тексте субъект прямо не назван. Контекст может подразумевать Божий суд, однако внесение слова «Бог» и идеи кары в основной текст устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с сохранением краткости, риторического параллелизма и поэтического обращения. Инверсия «язык лживый» уместна в возвышенной поэтической строке и остаётся понятной современному читателю.
