  text: Долго жила душа моя с тем, кто ненавидит мир[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Слишком долго жила душа моя с тем, кто ненавидит мир». Начальное еврейское слово подчёркивает длительность и может также подразумевать, что она была чрезмерной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַבַּת
  choice: долго
  rationale: В сочетании с глаголом это слово выражает значительную продолжительность. «Долго» прямо передаёт основной смысл, не делая подразумеваемую чрезмерность явной без оговорки.
- source_word: שָׁכְנָה
  choice: жила
  rationale: Глагол שכן означает жить, обитать. «Жила» естественно звучит по-русски и сохраняет значение продолжительного пребывания.
- source_word: לָּהּ
  choice: отдельно не переводится; «душа моя» оформлено как подлежащее
  rationale: Местоименный суффикс женского рода синтаксически труден и, вероятно, возобновляет или подчёркивает נַפְשִׁי. Отдельная передача создала бы неясную и неестественную русскую конструкцию.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: Сохраняется поэтический образ еврейского текста и указание на личность говорящего, а не упрощается до местоимения «я».
- source_word: עִם
  choice: с
  rationale: Предлог обозначает совместное пребывание или соседство; «с» — его прямой и естественный русский эквивалент.
- source_word: שׂוֹנֵא
  choice: тем, кто ненавидит
  rationale: Причастие характеризует человека по его устойчивому отношению; придаточная конструкция сохраняет словесную силу выражения.
- source_word: שָׁלוֹם
  choice: мир
  rationale: В контексте противопоставления вражде имеется в виду мир в отношениях; «мир» остаётся самым ясным и традиционно понятным соответствием.
