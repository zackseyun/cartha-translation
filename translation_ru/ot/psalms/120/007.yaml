  text: אֲֽנִי שָׁ֭לוֹם וְ/כִ֣י אֲדַבֵּ֑ר הֵ֝֗מָּה לַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/120/007.yaml
  text: I am for peace[a]; but when I speak[b], they are for war.
translation:
  language: ru
  text: Я — за мир[a], но когда я говорю[b], они — за войну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально с еврейского: «я — мир»; здесь передано по смыслу: «я — за мир».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и когда я говорю»; еврейский союз допускает более простое соединительное значение, но контекст указывает на противопоставление.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲנִי שָׁלוֹם
  choice: Я — за мир
  rationale: Буквально безглагольная фраза означает «я — мир». В современном русском «я — за мир» естественно передаёт направленность говорящего к миру и сохраняет параллель с «они — за войну», не создавая онтологического смысла.
- source_word: וְכִי
  choice: но когда
  rationale: Сочетание союза с частицей допускает простое «и когда», однако контекстуальное противопоставление между стремлением говорящего к миру и настроем противников естественно выражается словами «но когда».
- source_word: אֲדַבֵּר
  choice: я говорю
  rationale: Форма Piel imperfect 1-го лица единственного числа здесь передана настоящим временем как общая, повторяющаяся ситуация. Дополнение «о мире» не добавлено, поскольку его нет в еврейском тексте.
- source_word: הֵמָּה
  choice: они
  rationale: Самостоятельное местоимение подчёркивает противников; в русском акцент поддержан контрастной структурой и тире.
- source_word: לַמִּלְחָמָה
  choice: за войну
  rationale: Предлог ל выражает направленность или расположенность. «За войну» кратко и естественно образует антитезу выражению «за мир».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Тире сохраняют выразительность безглагольных еврейских фраз и подчёркивают антитезу «мир — война».
