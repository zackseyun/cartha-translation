source:
  edition: WLC
  text: יְֽהוָ֗ה יִשְׁמָרְ/ךָ֥ מִ/כָּל רָ֑ע יִ֝שְׁמֹ֗ר אֶת נַפְשֶֽׁ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/007.yaml
  text: Yahweh will keep you from all evil[a]; he will keep your soul.
translation:
  language: ru
  text: Яхве сохранит тебя от всякого зла[a]; он сохранит твою жизнь.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово רָע может также означать «беду», «вред» или «несчастье».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «твою душу» либо «тебя самого». Еврейское נֶפֶשׁ может обозначать жизнь, душу или самого человека.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом; форма «Яхве» общепринята в современной русской библеистике.
- source_word: יִשְׁמָרְךָ / יִשְׁמֹר
  choice: сохранит тебя / сохранит
  rationale: Глагол שׁמר означает «хранить, оберегать, охранять». Повтор слова «сохранит» отражает важный для псалма повтор еврейского корня и естественно звучит по-русски.
- source_word: מִכָּל רָע
  choice: от всякого зла
  rationale: Сохраняет широкое значение רָע, которое может охватывать как зло, так и беду или вред, не сужая смысл исключительно до физической опасности.
- source_word: נַפְשֶׁךָ
  choice: твою жизнь
  rationale: В данном контексте נֶפֶשׁ естественно обозначает жизнь или самого человека. «Жизнь» не навязывает более узкого представления о душе как отдельной нематериальной части человека.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит личное имя Бога. Его транслитерация сохраняет различие между именем и титулом, не привнося конфессионально обусловленной замены.
- issue: Антропологический смысл נַפְשֶׁךָ
  choice: твою жизнь
  alternative: твою душу; тебя самого
  rationale: Контекст не требует противопоставления души телу. Основной текст передаёт значение живой жизни человека, а традиционное «душу» отмечено как допустимая альтернатива.
- issue: Объём значения רָע
  choice: зло
  alternative: беда; вред
  rationale: Слово допускает как нравственный, так и бедственный смысл. «Зло» сохраняет эту широту, а примечание явно указывает на контекстуально возможные значения.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но доступной псалмовой интонацией. Повтор «сохранит» намеренно воспроизводит еврейский тематический повтор; местоимение «он» написано со строчной буквы согласно нейтральной современной орфографической практике.
