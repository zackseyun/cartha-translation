  text: שִׁ֗יר לַֽ/מַּ֫עֲל֥וֹת אֶשָּׂ֣א עֵ֭ינַ/י אֶל הֶ/הָרִ֑ים מֵ֝/אַ֗יִן יָבֹ֥א עֶזְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/000.yaml
  text: A Song of Ascents[a]. I lift up my eyes to the mountains; from where will my help come?
translation:
  language: ru
  text: 'Песнь восхождений. Поднимаю глаза к горам: откуда придёт мне помощь?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁיר לַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Традиционное и достаточно буквальное название цикла; множественное число сохраняет форму еврейского выражения, не уточняя спорный исторический контекст восхождений.
- source_word: הֶהָרִים
  choice: горам
  rationale: Обычное значение слова — «горы»; в данном контексте оно естественно передаёт направленность взгляда.
- source_word: מֵאַיִן
  choice: откуда
  rationale: 'Сохранена вопросительная форма и смысловая открытость: говорящий спрашивает об источнике помощи.'
- source_word: עֶזְרִי
  choice: мне помощь
  rationale: Русская конструкция «придёт мне помощь» естественно передаёт притяжательный суффикс «моя помощь» в сочетании с глаголом движения.
theological_decisions:
- issue: Следует ли понимать вопрос как риторическое утверждение, что помощь приходит от гор?
  choice: 'Сохранён прямой вопрос: «откуда придёт мне помощь?»'
  alternative: Передать как утверждение либо связать помощь непосредственно с горами.
  rationale: Еврейский текст грамматически задаёт вопрос, а ответ появляется в следующем стихе; перевод не должен заранее разрешать эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным звучанием. Настоящее время «поднимаю» передаёт незавершённое действие; порядок слов и двоеточие естественно связывают взгляд на горы с последующим вопросом.
