  text: הִנֵּ֣ה לֹֽא יָ֭נוּם וְ/לֹ֣א יִישָׁ֑ן שׁ֝וֹמֵ֗ר יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/004.yaml
  text: Look[a], the keeper of Israel neither slumbers nor sleeps.
translation:
  language: ru
  text: Вот[a], не дремлет и не спит хранящий Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот, хранящий Израиль не задремлет и не уснёт».'
    reason: В еврейском формы глаголов могут выражать как постоянную характеристику, так и направленное в будущее заверение.
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Указательно-эмфатическая частица привлекает внимание к утверждению; «вот» естественно и выразительно в современном литературном русском.
- source_word: לֹא יָנוּם וְלֹא יִישָׁן
  choice: не дремлет и не спит
  rationale: Два отрицания переданы естественной русской конструкцией; различие между краткой дремотой и полноценным сном сохранено.
- source_word: שֹׁמֵר
  choice: хранящий
  rationale: Субстантивированное причастие обозначает того, кто хранит и оберегает. Причастие сохраняет повторяющийся в псалме образ и связь с тем же еврейским корнем.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятая русская форма библейского имени.
theological_decisions:
- issue: Антропоморфное изображение неусыпной бдительности Бога
  choice: Сохранена поэтическая формула «не дремлет и не спит» без поясняющей абстракции.
  alternative: 'Передать смысл описательно: «никогда не перестаёт бодрствовать».'
  rationale: Исходный текст говорит образно и подчёркивает непрерывную бдительность Хранящего Израиль; буквальный образ следует сохранить, не превращая его в выходящее за рамки стиха философское утверждение.
- issue: Временное значение форм йиктоля יָנוּם и יִישָׁן
  choice: 'Настоящее время как общее, неизменное положение: «не дремлет и не спит».'
  alternative: 'Будущее время: «не задремлет и не уснёт».'
  rationale: В контексте псалма формы естественно выражают постоянную характеристику, однако допускают перспективное прочтение; оно сохранено в примечании.
translation_notes:
  register: Современный литературный русский с сохранением краткости, параллелизма и торжественной простоты еврейской поэзии. Порядок слов оставляет смысловой акцент на непрерывной бдительности Хранящего Израиль.
