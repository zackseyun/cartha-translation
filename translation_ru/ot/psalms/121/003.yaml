id: PSA.121.3
reference: Psalms 121:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אַל יִתֵּ֣ן לַ/מּ֣וֹט רַגְלֶ֑/ךָ אַל יָ֝נ֗וּם שֹֽׁמְרֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/003.yaml
  text: He will not let your foot slip[b][a]; your keeper will not slumber.
translation:
  language: ru
  text: Он не даст ноге твоей пошатнуться[b][a]; не задремлет Хранитель твой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Да не даст Он ноге твоей пошатнуться; да не задремлет Хранитель твой». Еврейские формы можно понимать и как пожелание или молитву, и как уверенное заверение.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «поколебаться», «поскользнуться» или «споткнуться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל
  choice: не даст / не задремлет
  rationale: Сочетание אַל с имперфектом допускает пожелательное значение, однако в контексте псалма естественно звучит как уверенное заверение; альтернативная модальность сохранена в примечании [a].
- source_word: יִתֵּן
  choice: даст
  rationale: 'В конструкции с לַמּוֹט глагол נתן имеет разрешительное значение: «не даст, не позволит пошатнуться». Русское «не даст» естественно передаёт эту идиому.'
- source_word: לַמּוֹט
  choice: пошатнуться
  rationale: 'מוֹט обозначает утрату устойчивости: колебаться, шататься, соскальзывать. «Пошатнуться» сохраняет широкий метафорический смысл и естественно сочетается со словом «нога».'
- source_word: רַגְלֶךָ
  choice: ноге твоей
  rationale: Сохранено единственное число еврейского текста и конкретный образ ноги; постпозиция местоимения поддерживает возвышенный поэтический регистр.
- source_word: יָנוּם
  choice: задремлет
  rationale: נוּם означает дремать, погружаться в неглубокий сон. «Задремлет» точно передаёт оттенок и сохраняет различие с полным сном в следующем стихе.
- source_word: שֹׁמְרֶךָ
  choice: Хранитель твой
  rationale: Причастие от שׁמר означает того, кто хранит, оберегает и бодрствует. «Хранитель» кратко передаёт повторяющийся ключевой мотив псалма; прописная буква указывает на Бога из ближайшего контекста, не добавляя имени в сам стих.
theological_decisions:
- issue: Сила отрицательных частиц אַל при имперфектах
  choice: 'Уверенное заверение: «Он не даст… не задремлет…»'
  alternative: 'Пожелание или молитва: «Да не даст Он… да не задремлет…»'
  rationale: Контекст Псалма 121 строится как заверение в охране Господа, поэтому изъявительное значение лучше соответствует ходу речи. Поскольку грамматические формы допускают также пожелательное прочтение, оно явно указано в примечании [a].
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «ноге твоей», «Хранитель твой» поддерживает параллелизм и достоинство псалма, оставаясь понятной современному читателю. Маркеры примечаний поставлены непосредственно после спорного выражения в порядке, соответствующем английскому аудированному слою.
