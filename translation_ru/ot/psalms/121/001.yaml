id: PSA.121.1
reference: Psalms 121:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁ֗יר לַֽ/מַּ֫עֲל֥וֹת אֶשָּׂ֣א עֵ֭ינַ/י אֶל הֶ/הָרִ֑ים מֵ֝/אַ֗יִן יָבֹ֥א עֶזְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/001.yaml
  text: A Song of Ascents[a]. I lift up my eyes to the mountains— from where will my help come?
translation:
  language: ru
  text: 'Песнь восхождений. Поднимаю глаза мои к горам[a]: откуда придёт помощь моя?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к холмам».'
    reason: Лексема הָרִים может в зависимости от рельефа обозначать как горы, так и холмы; основной вариант сохраняет более обычное «горы».
lexical_decisions:
- source_word: שִׁיר
  choice: Песнь
  rationale: Точно передаёт название поэтического произведения и не вносит более узкое жанровое обозначение «псалом», отсутствующее в данном слове.
- source_word: לַמַּעֲלוֹת
  choice: восхождений
  rationale: Сохраняет краткость надписания и значение множественного числа от корня עלה — «подниматься, восходить», не уточняя, о паломничествах, ступенях или ином восхождении идёт речь.
- source_word: אֶשָּׂא
  choice: Поднимаю
  rationale: Форма imperfect 1-го лица единственного числа здесь естественно передаётся поэтическим настоящим и описывает направленное движение взгляда.
- source_word: עֵינַי
  choice: глаза мои
  rationale: Прямо передаёт существительное с суффиксом 1-го лица; постпозиция местоимения поддерживает достоинство и поэтический ритм, оставаясь понятной современному читателю.
- source_word: אֶל הֶהָרִים
  choice: к горам
  rationale: Предлог передаёт направленность, а «горы» сохраняют обычное и более весомое значение הָרִים; возможное «холмы» отмечено в сноске.
- source_word: מֵאַיִן
  choice: откуда
  rationale: Современное и точное вопросительное обозначение источника или происхождения.
- source_word: יָבֹא
  choice: придёт
  rationale: Форма imperfect естественно выражает ожидаемое действие в вопросе и сохраняет устремлённость к ответу в следующем стихе.
- source_word: עֶזְרִי
  choice: помощь моя
  rationale: Прямой перевод существительного עֵזֶר с суффиксом 1-го лица; формулировка проста и сохраняет поэтический параллелизм.
theological_decisions:
- issue: Считать ли вторую строку утверждением или вопросом
  choice: 'Передано как прямой вопрос: «откуда придёт помощь моя?»'
  alternative: 'Передать как утверждение или придаточную конструкцию: «откуда приходит помощь моя».'
  rationale: Сочетание מֵאַיִן с יָבֹא естественнее всего образует вопрос. Это сохраняет напряжение, разрешаемое в стихе 2, и не вводит ответ преждевременно.
- issue: Символическое значение гор
  choice: Сохранено нейтральное «горы» без истолкования их как Сиона, места опасности или языческих высот.
  alternative: Явно истолковать горы положительно как Сион либо отрицательно как место опасности или ложного поклонения.
  rationale: Сам еврейский текст стиха не определяет символического значения гор, поэтому перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным поэтическим звучанием. Надписание сохранено отдельно. Порядок «глаза мои» и «помощь моя» слегка поэтичен, но не архаичен; он поддерживает ритм и близость к еврейской структуре.
