lexical_decisions:
- source_word: עֶזְרִי
  choice: Помощь моя
  rationale: Существительное עֵזֶר означает «помощь»; суффикс первого лица передан словом «моя». Такой порядок слов сохраняет краткость и торжественный строй еврейской строки.
- source_word: מֵעִם
  choice: от
  rationale: Предлог указывает на личный источник помощи. Русское «от» точно и естественно передаёт это значение без добавления отсутствующего в еврейском тексте глагола.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: עֹשֵׂה
  choice: Творца
  rationale: Причастие называет Яхве Тем, кто творит, и здесь имеет характеризующую, почти титульную силу. «Творец» естественно передаёт её по-русски, не сводя выражение только к завершённому действию в прошлом.
- source_word: שָׁמַיִם וָאָרֶץ
  choice: неба и земли
  rationale: Сочетание обозначает весь сотворённый мир. «Небо и земля» — естественная русская формула; родительный падеж обусловлен словом «Творца».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение причастия עֹשֵׂה
  choice: Творца неба и земли
  alternative: сотворившего небо и землю; творящего небо и землю
  rationale: Еврейское причастие допускает характеристику постоянной идентичности. Существительное «Творец» сохраняет титульную силу и не вынуждает выбирать исключительно прошедшее либо продолжающееся действие.
- issue: Отсутствие явного глагола в первой части
  choice: Помощь моя — от Яхве
  alternative: Моя помощь приходит от Яхве
  rationale: Именная конструкция естественна в русском языке и позволяет сохранить лаконичность и синтаксическую открытость еврейского текста без ненужного добавления глагола движения.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем. Инверсия «Помощь моя» уместна для поэтической речи, но остаётся понятной; тире естественно оформляет безглагольную конструкцию.
