    reason: previous_rendering
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом «Господь».
- source_word: יִשְׁמָר
  choice: будет хранить
  rationale: Глагол שׁמר означает «хранить, охранять, оберегать»; «будет хранить» сохраняет повторяющийся в псалме ключевой глагол и естественно звучит по-русски.
- source_word: צֵאתְךָ וּבוֹאֶךָ
  choice: твой выход и вход
  rationale: Формально сохраняет парный образ исходного текста. Вместе эти слова образуют меризм, охватывающий передвижения человека и шире — течение его жизни.
- source_word: מֵעַתָּה
  choice: отныне
  rationale: Кратко и поэтично передаёт начало непрерывного периода с настоящего времени.
- source_word: וְעַד עוֹלָם
  choice: и навеки
  rationale: Естественно передаёт неограниченную будущую длительность, выраженную сочетанием עַד עוֹלָם.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом; вариант «Иегова» основан на более позднем традиционном прочтении.
- issue: Объём обещанного хранения
  choice: Сохранён образ «выход и вход» без сужения значения
  alternative: Хранить только при конкретном отправлении и возвращении
  rationale: Парное выражение может обозначать как повседневные передвижения, так и весь ход жизни; перевод оставляет эту смысловую широту открытой.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным ритмом псалма. Конкретная еврейская образность сохранена, а её идиоматическая широта пояснена в сноске.
