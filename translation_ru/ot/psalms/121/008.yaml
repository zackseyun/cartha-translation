  yaml_path: translation/ot/psalms/121/008.yaml
  text: Yahweh will keep your going out and your coming in from now on and forever[a][b].
translation:
  language: ru
  text: Яхве будет хранить твой выход и вход отныне и навеки[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве будет оберегать тебя, когда ты выходишь и когда входишь». Еврейское выражение «выход и вход» может широко обозначать все передвижения человека или весь ход его жизни.'
    reason: lexical_alternative
  - marker: b
