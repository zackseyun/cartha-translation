base_translation:
  language: en
  yaml_path: translation/ot/psalms/121/005.yaml
  text: Yahweh is your keeper[a]; Yahweh is your shade at your right hand.
translation:
  language: ru
  text: Яхве — твой хранитель; Яхве — твоя тень[a] у твоей правой руки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать также «сень», то есть защитную тень, дающую прохладу и укрытие.
    reason: Уточняет защитный смысл образа «тени», сохраняя буквальную метафору в основном тексте.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: שֹׁמְרֶךָ
  choice: твой хранитель
  rationale: Причастная форма выражает постоянное хранение и сохраняет ключевой повтор корня שׁמר в псалме.
- source_word: צִלְּךָ
  choice: твоя тень
  rationale: Сохраняет конкретный образ צל — тени, дающей защиту и прохладу, — не сводя метафору к отвлечённому слову «защита».
- source_word: עַל יַד יְמִינֶךָ
  choice: по правую руку от тебя
  rationale: Естественный русский оборот передаёт близость защитника с правой стороны; при этом сохраняется телесный образ руки.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Образ צל
  choice: твоя тень
  alternative: твоя защита; твой покров
  rationale: Конкретная метафора защитной тени оставлена без богословского или пояснительного перефразирования.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным параллелизмом оригинала. Именные конструкции сохраняют поэтическую сжатость стиха.
