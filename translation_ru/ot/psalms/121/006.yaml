  yaml_path: translation/ot/psalms/121/006.yaml
  text: By day the sun will not strike you[b][a], nor the moon by night.
translation:
  language: ru
  text: Днём солнце не поразит тебя[a], ни луна ночью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не причинит тебе вреда». Еврейский глагол буквально означает «ударить, поразить», но в данном контексте может подразумевать вредоносное воздействие.'
    reason: lexical_alternative
  - marker: b
    text: Сочетание «днём… ночью» выражает защиту во всякое время; солнце и луну можно понимать буквально, образно или в обоих смыслах.
    reason: cultural_note
lexical_decisions:
- source_word: יוֹמָם
  choice: Днём
  rationale: Наречное употребление со значением «днём, в дневное время»; краткая форма естественно соотносится с «ночью».
- source_word: הַשֶּׁמֶשׁ
  choice: солнце
  rationale: Прямое обозначение солнца; образ сохранён без истолковывающей замены.
- source_word: לֹא
  choice: не
  rationale: Обычное отрицание, относящееся к глаголу и по смыслу распространяющееся на параллельную вторую часть.
- source_word: יַכֶּכָּה
  choice: поразит тебя
  rationale: Глагол נכה буквально означает «ударить, поразить». «Поразит» сохраняет конкретный образ и при этом допускает более широкий смысл причинения вреда.
- source_word: וְיָרֵחַ
  choice: ни луна
  rationale: Союз вводит второй член параллелизма под действием отрицания; по-русски естественна конструкция «не… ни…».
- source_word: בַּלָּיְלָה
  choice: ночью
  rationale: Временное обстоятельство, противопоставленное слову «днём»; форма поддерживает краткость и поэтический параллелизм.
theological_decisions:
- issue: Характер обещанной защиты
  choice: Сохранить конкретные образы солнца и луны, не уточняя, следует ли понимать их буквально, образно или одновременно в обоих смыслах.
  alternative: Истолковать стих только как защиту от природного вреда либо только как образ постоянной защиты.
  rationale: Сочетание дня и ночи может выражать всеохватность защиты, но сам поэтический текст сохраняет конкретные небесные образы и не требует однозначно устранять эту смысловую многослойность.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим параллелизмом. «Поразит» звучит достойно и выразительно, не будучи архаизмом; неоднозначность образов сохранена.
