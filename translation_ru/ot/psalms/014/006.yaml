  text: עֲצַת עָנִ֥י תָבִ֑ישׁוּ כִּ֖י יְהוָ֣ה מַחְסֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/006.yaml
  text: You shame the counsel of the poor[a], because Yahweh is his refuge.
translation:
  language: ru
  text: Вы посрамляете замысел бедняка[a], потому что Яхве — его прибежище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы посрамляете совет бедного»; עֲצַת עָנִי может означать как замысел бедняка, так и его совет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲצַת
  choice: замысел
  rationale: Существительное עֵצָה в сопряжённой форме может означать совет, замысел или намерение. «Замысел» естественно сочетается в русском языке с данным объектом глагола и не ограничивает смысл высказанным советом.
- source_word: עָנִי
  choice: бедняка
  rationale: עָנִי обозначает бедного, нуждающегося или угнетённого человека. «Бедняк» кратко и естественно передаёт социальную уязвимость, не исключая оттенка угнетённости.
- source_word: תָבִישׁוּ
  choice: вы позорите
  rationale: Форма Hiphil, 2-е лицо множественного числа, от בוש означает «заставлять стыдиться», «позорить», «посрамлять». «Вы позорите» сохраняет прямое обращение и образ стыда; более идиоматичное «высмеиваете» было бы уже по смыслу.
- source_word: כִּי
  choice: потому что
  rationale: 'כִּי здесь естественно понимать как причинный союз: убежище бедняка у Яхве показывает ошибочность или тщетность действий обращённых лиц.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: מַחְסֵהוּ
  choice: его прибежище
  rationale: מַחְסֶה с суффиксом 3-го лица мужского рода единственного числа означает «его убежище/прибежище». «Прибежище» сохраняет традиционный и понятный образ защитного места.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Связь причины, вводимой כִּי, с первой частью стиха
  choice: '«потому что»: действия нечестивых направлены против замысла бедняка, тогда как Яхве служит ему прибежищем'
  alternative: «но Яхве — его прибежище», с противительным оттенком
  rationale: 'Основное причинное значение כִּי сохранено, хотя логическая связь допускает оттенок противопоставления: попытка опозорить бедняка неуместна именно ввиду его упования на Яхве.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским словом «прибежище». Множественное «вы» передаёт форму תָבִישׁוּ. Формулировка «позорите замысел» намеренно сохраняет несколько необычное сочетание исходного текста и его смысловую неоднозначность.
