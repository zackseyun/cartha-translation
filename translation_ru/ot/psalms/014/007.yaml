base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/007.yaml
  text: Oh[a], that Israel’s salvation would come from Zion! When Yahweh restores the fortunes of his people, Jacob will rejoice; Israel will be glad.
translation:
  language: ru
  text: О, если бы с Сиона пришло спасение Израиля! Когда Яхве восстановит благополучие своего народа[a], возликует Иаков, возрадуется Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «возвратит плен (или пленение) своего народа». Еврейский оборот часто означает восстановление благополучия народа или перемену его бедственного положения.'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: О, если бы… пришло
  rationale: Еврейское устойчивое выражение передаёт горячее желание, а не буквальный вопрос «Кто даст?». Русская оптативная конструкция естественно сохраняет этот смысл.
- source_word: מִצִּיּוֹן
  choice: с Сиона
  rationale: Предлог מִן указывает на источник; для названия Сион в русском языке нормативно употребление «с Сиона».
- source_word: יְשׁוּעַת יִשְׂרָאֵל
  choice: спасение Израиля
  rationale: Конструкция сопряжённого состояния означает «спасение Израиля» и сохраняет широкий смысл избавления, не сужая его до одной конкретной беды.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: בְּשׁוּב יְהוָה שְׁבוּת עַמּוֹ
  choice: Когда Яхве восстановит благополучие Своего народа
  rationale: Сочетание שׁוּב שְׁבוּת обычно обозначает восстановление прежнего благополучного состояния или перемену тяжёлой участи; временное придаточное естественно передаёт בְּ с инфинитивом.
- source_word: יָגֵל
  choice: возликует
  rationale: Глагол גיל выражает сильную, торжествующую радость; «возликует» уместно в поэтическом регистре.
- source_word: יִשְׂמַח
  choice: возрадуется
  rationale: Глагол שמח передан отдельным русским словом, чтобы сохранить лексическое различие и параллелизм с «возликует».
- source_word: יַעֲקֹב … יִשְׂרָאֵל
  choice: Иаков … Израиль
  rationale: Имена сохранены как параллельные поэтические обозначения одного народа.
theological_decisions:
- issue: Значение оборота שׁוּב שְׁבוּת
  choice: восстановит благополучие Своего народа
  alternative: вернёт пленников Своего народа / возвратит плен Своего народа
  rationale: Контекст псалма не требует понимать выражение исключительно как возвращение из исторического плена. Основной текст передаёт более широкий идиоматический смысл, а буквальная и более узкая возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Междометно-условная конструкция передаёт страстное пожелание; пара «возликует — возрадуется» сохраняет параллелизм и различие еврейских глаголов радости.
