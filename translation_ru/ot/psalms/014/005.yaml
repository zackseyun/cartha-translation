  text: שָׁ֤ם פָּ֣חֲדוּ פָ֑חַד כִּֽי אֱ֝לֹהִ֗ים בְּ/ד֣וֹר צַדִּֽיק׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/005.yaml
  text: There they were in great dread[b][a], for God is with the generation of the righteous.
translation:
  language: ru
  text: Там охватил их великий страх[a], потому что Бог — среди праведного поколения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «испугались страхом» — усилительное выражение, означающее, что их охватил сильный страх.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Бог — с поколением праведных».'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: Там
  rationale: Наречие места сохранено кратко и поэтично; оно указывает на сцену внезапного ужаса, не добавляя отсутствующих в тексте пояснений.
- source_word: פָּחֲדוּ פָחַד
  choice: охватил их великий страх
  rationale: Глагол с однокоренным существительным буквально означает «испугались страхом» и служит усилению. Русское выражение передаёт эмфазу естественно и сохраняет образ страха.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину их страха; причинная связь выражена явно и естественно для современного русского языка.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма множественного числа здесь обозначает единого Бога Израиля и переводится обычным образом.
- source_word: בְּדוֹר
  choice: среди ... поколения
  rationale: Предлог ב допускает значения «в» и «среди». «Среди» естественно передаёт присутствие Бога в среде названного поколения, не усиливая значение до явно выраженного покровительства.
- source_word: צַדִּיק
  choice: праведного
  rationale: Прилагательное в единственном числе характеризует דּוֹר («поколение»). Перевод «праведного поколения» сохраняет грамматическую связь и возможный коллективный смысл.
theological_decisions:
- issue: Отношение Бога к праведному поколению в выражении בְּדוֹר צַדִּיק
  choice: Бог — среди праведного поколения
  alternative: Бог — с поколением праведных
  rationale: Еврейский предлог ב прежде всего позволяет понимать присутствие «в/среди», тогда как «с» может дополнительно подчёркивать солидарность или поддержку. Основной текст сохраняет более непосредственное пространственно-общинное значение, а близкая допустимая передача вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим ритмом. Инверсия «охватил их» поддерживает торжественное звучание, оставаясь понятной; тире передаёт подразумеваемую связку настоящего времени.
