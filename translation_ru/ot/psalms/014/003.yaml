lexical_decisions:
- source_word: הַכֹּל
  choice: Все
  rationale: Определённое собирательное выражение охватывает всех людей, о которых говорится в контексте, и сохраняет всеобщий характер утверждения.
- source_word: סָר
  choice: уклонились
  rationale: Глагол סור означает «свернуть, отступить, уклониться». Хотя форма единственного числа согласована с собирательным подлежащим, по-русски естественно множественное число.
- source_word: יַחְדָּו
  choice: все вместе
  rationale: Наречие подчёркивает совокупность и совместность; повтор «все» естественно передаёт охват, выраженный сочетанием הַכֹּל и יַחְדָּו.
- source_word: נֶאֱלָחוּ
  choice: растлились
  rationale: Форма нифаля обозначает наступившее состояние испорченности. «Растлились» сохраняет результативность и нравственный оттенок, не сводя образ к физической нечистоте.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Нет делающего добро
  rationale: Конструкция с частицей отсутствия и причастием категорически отрицает наличие человека, который делает добро; формулировка близка к синтаксису источника и остаётся понятной по-русски.
- source_word: אֵין גַּם אֶחָד
  choice: нет ни одного
  rationale: Сочетание усиливает отрицание; «ни одного» естественно передаёт эмфатический смысл.
theological_decisions:
- issue: Объём всеобщего утверждения об испорченности людей
  choice: 'Сохранить всеобщий приговор без смягчения: «Все… Нет… ни одного».'
  alternative: Передать как общее наблюдение о большинстве людей.
  rationale: Еврейский текст последовательно использует всеохватные и категорические выражения הַכֹּל, אֵין и גַּם אֶחָד; перевод сохраняет их силу, не добавляя позднейших догматических формулировок.
