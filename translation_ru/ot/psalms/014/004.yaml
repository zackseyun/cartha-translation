translation_notes:
  register: Современный литературный русский с поэтической выразительностью псалма. Конструкция «те, кто…» грамматически требует единственного числа («ест», «призывает»), хотя в еврейском соответствующие формы стоят во множественном числе и относятся ко всем творящим зло. Риторическая незавершённость глагола «знают» сохранена как черта исходного текста.
