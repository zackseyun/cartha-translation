  text: לַ/מְנַצֵּ֗חַ לְ/דָ֫וִ֥ד אָ֘מַ֤ר נָבָ֣ל בְּ֭/לִבּ/וֹ אֵ֣ין אֱלֹהִ֑ים הִֽשְׁחִ֗יתוּ הִֽתְעִ֥יבוּ עֲלִילָ֗ה אֵ֣ין עֹֽשֵׂה טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/014/001.yaml
  text: For the choir director[a]. Of David. The fool says in his heart, “There is no God.” They are corrupt; they do abominable deeds[c][b]. There is no one who does good.
translation:
  language: ru
  text: 'Руководителю хора[a]. Давида[b]. Безумец говорит в своем сердце: «Нет Бога». Они[c] развратились, совершили мерзкие дела. Никто не делает добра.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Руководителю музыки»; традиционно: «Начальнику хора».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение может означать принадлежность Давиду, авторство Давида или посвящение Давиду.
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте после единственного числа («безумец») следует множественное («они»): речь переходит от одного представительного образа ко всем людям такого рода.'
    reason: source_text_feature
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Надписание обращено к лицу, руководящему музыкальным исполнением. Этот вариант понятен современному читателю и сохраняет вероятную функцию термина, не исключая более широкого значения «руководитель музыки».
- source_word: לְדָוִד
  choice: Псалом Давида
  rationale: Традиционная и естественная русская форма надписания. Родительный падеж не сводит связь с Давидом исключительно к авторству; возможные значения еврейского предлога разъяснены в сноске.
- source_word: נָבָל
  choice: безумец
  rationale: Здесь имеется в виду не просто недостаток ума, а нравственное и духовное безрассудство. «Безумец» сохраняет библейскую категорию и представительное единственное число.
- source_word: בְּלִבּוֹ
  choice: в сердце своём
  rationale: В еврейском представлении сердце включает внутренние мысли и волю. Буквальный образ естественен и значим по-русски.
- source_word: אֵין אֱלֹהִים
  choice: Нет Бога
  rationale: Передаёт прямое отрицание существования или присутствия Бога без истолковывающей замены на «Бог не имеет значения» либо «Бог не судит».
- source_word: הִשְׁחִיתוּ
  choice: они развратились
  rationale: Глагол обозначает порчу и нравственное разложение. Возвратная русская форма естественно выражает состояние и поведение названной группы.
- source_word: הִתְעִיבוּ עֲלִילָה
  choice: совершили мерзкие дела
  rationale: Сочетание описывает отвратительное, вызывающее омерзение поведение. Во множественном числе «дела» по-русски идиоматично обозначает совокупность поступков, выраженную собирательным значением еврейского существительного.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: Никто не делает добра
  rationale: Естественно и близко к еврейской конструкции передаёт полное отсутствие делающего добро среди описываемых людей.
theological_decisions:
- issue: Смысл выражения אֵין אֱלֹהִים
  choice: 'Прямое утверждение: «Нет Бога»'
  alternative: 'Практическое безбожие: «Бог не имеет значения» или «Бог не судит»'
  rationale: Еврейская фраза непосредственно отрицает Бога. Контекст допускает практические последствия такого убеждения, но перевод не должен подменять явное высказывание его возможным подразумеваемым смыслом.
- issue: Переход от единственного נָבָל к глаголам во множественном числе
  choice: 'Сохранить переход: «безумец… Они…»'
  alternative: Согласовать всё в единственном числе («он развратился») или поставить начало во множественном («безумцы говорят»)
  rationale: Единственное число представляет типичного безумца, после чего множественное распространяет характеристику на весь представляемый им круг людей. Сохранение грамматического перехода удерживает особенность и напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического библейского текста. Сохранены краткость надписания, образ сердца и резкий переход от единственного числа к множественному. Архаизмы вроде «творящий благо» не использованы; выражение «делает добра» оставлено как естественное и близкое к исходной формуле.
