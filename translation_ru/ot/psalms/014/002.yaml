lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: מִשָּׁמַיִם
  choice: с небес
  rationale: Естественное для русской библейской поэзии выражение, сохраняющее форму и образ еврейского текста.
- source_word: הִשְׁקִיף
  choice: взирает
  rationale: Глагол обозначает взгляд вниз с высоты; настоящее время сохраняет живую поэтическую перспективу псалма.
- source_word: בְּנֵי אָדָם
  choice: сынов человеческих
  rationale: Сохраняет образное собирательное выражение еврейского текста; примечание поясняет, что речь идёт обо всех людях.
- source_word: מַשְׂכִּיל
  choice: разумный
  rationale: Передаёт человека, обладающего пониманием и рассудительностью, не сужая значение до учёности или интеллектуальных способностей.
- source_word: דֹּרֵשׁ אֶת אֱלֹהִים
  choice: ищущий Бога
  rationale: Прямо передаёт активное причастие и его духовно направленный объект без добавочного толкования.
theological_decisions:
- issue: Собирательное мужское выражение בְּנֵי אָדָם
  choice: сынов человеческих
  alternative: людей; человеческий род
  rationale: Буквальный образ сохранён в основном тексте, а его общий антропологический смысл разъяснён в сноске без гендерного сужения референта.
- issue: Связь причастий מַשְׂכִּיל и דֹּרֵשׁ
  choice: разумный, ищущий Бога
  alternative: кто разумеет, кто ищет Бога
  rationale: Так сохраняется возможное чтение второго причастия как характеристики того же человека; текст не разделяется искусственно на две категории людей.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмической лексикой. «Взирает» и «с небес» поддерживают поэтический регистр, оставаясь понятными; синтаксис сохраняет краткость и напряжение оригинала.
