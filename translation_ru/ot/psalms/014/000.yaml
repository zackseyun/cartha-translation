  - marker: b
    text: Еврейское выражение может означать «Давида», «для Давида» или указывать на связь псалма с Давидом.
    reason: lexical_alternative
  - marker: c
    text: 'В еврейском тексте происходит переход от единственного числа («безумец») к множественному («они развратились»): отдельный человек представлен как выразитель целой группы.'
