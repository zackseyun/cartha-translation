- source_word: הִתְעִיבוּ עֲלִילָה
  choice: отвратительны их дела
  rationale: Естественно по-русски передаёт то, что их поступки стали мерзкими или отвратительными, не утяжеляя строку буквальной конструкцией.
- source_word: אֵין עֹשֵׂה טוֹב
  choice: нет делающего добро
  rationale: Сохраняет абсолютную и лаконичную формулировку еврейского текста, включая причастную конструкцию.
theological_decisions:
- issue: Значение исповедания «Нет Бога»
  choice: Сохранена краткая формула «Нет Бога» без пояснения.
  alternative: «Бога нет» или «Бог не действует».
  rationale: Еврейский текст допускает прямое отрицание существования Бога, но контекст также затрагивает практическое отрицание Его власти; перевод не должен устранять эту смысловую напряжённость.
- issue: Переход от единственного числа к множественному
  choice: 'Сохранён переход: «безумец» — «они».'
  alternative: Согласовать всё в единственном числе или явно добавить «такие люди».
  rationale: Грамматический сдвиг присутствует в оригинале и расширяет образ отдельного безумца до представляемой им группы.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического и богослужебного текста. Сохранены лаконизм, параллелизм и резкий переход числа в оригинале; архаизмы сведены к минимуму.
