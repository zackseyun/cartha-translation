lexical_decisions:
- source_word: כְּמוֹ
  choice: Как
  rationale: Вводит сравнение; русское «как» естественно передаёт еврейскую сравнительную конструкцию.
- source_word: פֹלֵחַ וּבֹקֵעַ
  choice: тот, кто пашет и взламывает
  rationale: Оба причастия передают энергичное рассечение почвы. «Пашет» ясно обозначает земледельческий образ, а «взламывает» сохраняет его резкость и не сводит два глагола к одному действию.
- source_word: בָּאָרֶץ
  choice: землю
  rationale: В данном земледельческом образе אֶרֶץ обозначает почву, которую пашут и разламывают.
- source_word: נִפְזְרוּ
  choice: рассеяны
  rationale: Нифаль выражает пассивное действие и его результат; краткое страдательное причастие естественно и выразительно звучит по-русски.
- source_word: עֲצָמֵינוּ
  choice: наши кости
  rationale: Прямой перевод сохраняет намеренно суровый образ.
- source_word: לְפִי
  choice: у пасти
  rationale: Буквально «у рта». Слово «пасть» сохраняет олицетворённый образ шеола как поглощающей области смерти и по-русски звучит естественнее в таком образном контексте.
- source_word: שְׁאוֹל
  choice: шеол
  rationale: Транслитерация сохраняет древнееврейское обозначение мира мёртвых и не привносит более позднее и более узкое представление об аде.
theological_decisions:
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: мир мёртвых; могила; ад
  rationale: «Шеол» сохраняет древнееврейский образ области мёртвых. «Ад» может привнести более поздние богословские смыслы, которых сам стих не уточняет, а «могила» чрезмерно сужает значение.
- issue: Связь между сравнением и главной строкой
  choice: Добавлено соотносительное «так»
  alternative: Как тот, кто пашет и взламывает землю, рассеяны наши кости…
  rationale: В еврейском тексте соответствующее слово не выражено, но в современном русском «как … так» ясно обозначает синтаксическую связь и не устраняет смысловую напряжённость образа.
translation_notes:
  register: Современный литературный русский с сохранением поэтической резкости оригинала. «Пасть шеола» передаёт буквальный и олицетворённый образ выражения לְפִי שְׁאוֹל; строчная буква подчёркивает, что это обозначение мира мёртвых, а не имя собственное.
