base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/003.yaml
  text: Set a guard[a], O Yahweh, over my mouth; keep watch over the door of my lips.
translation:
  language: ru
  text: 'Поставь, Яхве, стражу у моих уст;

    охраняй дверь[a] моих губ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дверь моих губ»; редкое еврейское слово также может означать «вход» или «врата».'
    reason: Уточнение необычного еврейского образа и возможных лексических оттенков דַּל.
lexical_decisions:
- source_word: שִׁיתָה
  choice: Поставь
  rationale: Просительная форма от שׁית означает «поместить, поставить». «Поставь» естественно сочетается со словом «стража» и сохраняет конкретный образ.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом; форма «Яхве» общепринята в современной русской библеистической передаче тетраграмматона.
- source_word: שָׁמְרָה
  choice: стражу
  rationale: Существительное от שמר обозначает стражу или охрану. Выбор сохраняет образ поставленного у уст стража.
- source_word: לְפִי
  choice: у моих уст
  rationale: Буквальное отношение «к/для моих уст» по-русски естественно выражается как местонахождение стражи «у моих уст».
- source_word: נִצְּרָה
  choice: охраняй
  rationale: Просительная форма от נצר передаёт продолжительное бодрствование и охрану; «охраняй» сохраняет параллелизм с первой строкой.
- source_word: עַל
  choice: '[смысловое управление глагола «охраняй»]'
  rationale: В русском языке прямое дополнение при «охраняй» не требует отдельного эквивалента предлога עַל; его отношение к объекту передано синтаксисом.
- source_word: דַּל שְׂפָתָי
  choice: дверь моих губ
  rationale: דַּל здесь означает дверь или дверную створку. Буквальный образ сохранён как метафора, а не сглажен до общего указания на речь.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон. Передача «Яхве» сохраняет личное имя и не заменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с кратким, молитвенным и достойным звучанием. Синтаксический параллелизм двух строк и конкретная метафора охраны речи сохранены.
