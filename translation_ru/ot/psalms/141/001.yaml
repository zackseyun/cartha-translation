  text: מִזְמ֗וֹר לְ/דָ֫וִ֥ד יְהוָ֣ה קְ֭רָאתִי/ךָ ח֣וּשָׁ/ה לִּ֑/י הַאֲזִ֥ינָ/ה ק֝וֹלִ֗/י בְּ/קָרְאִ/י לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/001.yaml
  text: A psalm of David. O Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: ru
  text: 'Псалом Давида.[a]


    Яхве,[b] я взываю к Тебе — поспеши ко мне;

    услышь мой голос, когда я взываю к Тебе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «псалом, связанный с Давидом»; еврейское выражение может означать авторство, принадлежность или посвящение Давиду.'
    reason: linguistic_ambiguity
  - marker: b
    text: Еврейское YHWH — личное имя Бога; традиционно передаётся как «Господь». Произношение «Яхве» является наиболее распространённой реконструкцией.
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Устоявшееся русское обозначение жанра; точно и естественно передаёт термин надписания.
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Традиционная краткая форма надписания, при этом сноска сохраняет многозначность предлога ל: авторство, принадлежность, посвящение или связь с Давидом.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом; вероятностный характер огласовки отмечен в сноске.
- source_word: קְרָאתִיךָ
  choice: я взываю к Тебе
  rationale: В молитвенном контексте перфект выражает совершающееся обращение; «взываю» передаёт настойчивость и сохраняет связь с повтором в конце стиха.
- source_word: חוּשָׁה לִּי
  choice: поспеши ко мне
  rationale: Сохраняет повелительную форму, направление действия и неотложность просьбы.
- source_word: הַאֲזִינָה קוֹלִי
  choice: услышь мой голос
  rationale: Естественная современная русская формулировка, передающая просьбу внимательно услышать обращение; существительное «голос» сохранено явно.
- source_word: בְּקָרְאִי לָךְ
  choice: когда я взываю к Тебе
  rationale: Предлог ב при инфинитивной конструкции естественно передаётся временным придаточным; повтор глагола сохранён как элемент поэтической настойчивости.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя YHWH. Транслитерация сохраняет различие между именем и титулом, а традиционная замена указана в сноске без утверждения спорной огласовки как абсолютно достоверной.
- issue: Связь псалма с Давидом в надписании
  choice: Псалом Давида
  alternative: Псалом для Давида
  rationale: Еврейское לְדָוִד допускает авторство, принадлежность, посвящение или более широкую связь. Основной текст использует привычную русскую форму, а сноска не позволяет свести её только к прямому указанию авторства.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным звучанием. Синтаксический параллелизм и повтор «взываю к Тебе» сохранены; архаизмы вроде «внемли» и «воззвах» не используются.
