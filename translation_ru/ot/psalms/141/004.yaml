source:
  edition: WLC
  text: אַל תַּט לִבִּ֨/י לְ/דָבָ֪ר רָ֡ע לְ/הִתְע֘וֹלֵ֤ל עֲלִל֨וֹת בְּ/רֶ֗שַׁע אֶת אִישִׁ֥ים פֹּֽעֲלֵי אָ֑וֶן וּ/בַל אֶ֝לְחַ֗ם בְּ/מַנְעַמֵּי/הֶֽם־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/004.yaml
  text: Do not incline my heart to any evil thing[a], to practice wicked deeds with men who work iniquity[c][b]; and let me not eat of their delicacies.
translation:
  language: ru
  text: Не склони моё сердце ни к чему злому[a], чтобы творить нечестивые дела вместе с людьми, совершающими беззаконие[b], и да не вкушу я их лакомств[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к злому делу», «к злому слову». Еврейское слово может означать «вещь», «дело», «обстоятельство» или «слово».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вместе со злодеями». Буквально: «с людьми, совершающими беззаконие».'
    reason: lexical_alternative
  - marker: c
    text: То есть их изысканной пищи или приятных вещей; выражение может также подразумевать участие в их греховных удовольствиях.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּט
  choice: склони
  rationale: Глагол נטה с «сердцем» как дополнением передаёт направленность внутренней воли. «Склони» сохраняет метафору и прямое обращение к Богу.
- source_word: לִבִּי
  choice: моё сердце
  rationale: В еврейской антропологии сердце включает волю, желания и мысли; буквальный образ естественен и понятен по-русски.
- source_word: לְדָבָר רָע
  choice: ни к чему злому
  rationale: דבר может означать вещь, дело, обстоятельство или слово. Контекст требует широкого нравственного смысла; конструкция с «ни к чему» естественно выражает неопределённость, не сужая значение до речи.
- source_word: לְהִתְעוֹלֵל עֲלִילוֹת בְּרֶשַׁע
  choice: чтобы творить нечестивые дела
  rationale: Сочетание обозначает деятельное участие в порочных поступках. «Творить ... дела» сохраняет конкретность и намеренный характер действия.
- source_word: אֶת אִישִׁים פֹּעֲלֵי אָוֶן
  choice: вместе с людьми, совершающими беззаконие
  rationale: Передаёт совместность действия и буквально разворачивает характеристику людей как постоянно делающих нравственное зло.
- source_word: וּבַל אֶלְחַם
  choice: и да не вкушу я
  rationale: Отрицательная частица продолжает молитвенное прошение; «да не вкушу я» сохраняет волитивный оттенок и возвышенный, но современно понятный регистр.
- source_word: בְּמַנְעַמֵּיהֶם
  choice: их лакомств
  rationale: Слово обозначает приятные, изысканные вещи, в данном образе — отборную пищу. «Лакомства» сохраняет конкретный образ еды и возможный переносный смысл участия в удовольствиях нечестивых.
theological_decisions:
- issue: Божественное действие и нравственная воля человека в просьбе «не склони моё сердце»
  choice: 'Сохранить прямую просьбу к Богу: «Не склони моё сердце».'
  alternative: «Не дай моему сердцу склониться».
  rationale: Еврейский текст прямо просит Бога не направлять сердце псалмопевца ко злу. Перевод не смягчает причинную формулировку и сохраняет заключённое в ней богословское напряжение.
- issue: Буквальное вкушение или участие в удовольствиях нечестивых
  choice: Сохранить конкретный образ вкушения лакомств.
  alternative: 'Передать истолкованно: «не дай мне разделять их удовольствия».'
  rationale: Контекст допускает как буквальную трапезу, так и образ соучастия; конкретный образ сохраняет эту намеренную многозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. «Да не вкушу я» слегка возвышенно, но ясно и уместно для псалма; остальная фраза избегает архаизмов. Порядок сносок в основном тексте приведён в последовательность [a], [b], [c].
