base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/006.yaml
  text: Their judges have been thrown down by the sides of the rock[a], and they have heard my words[b], for they are pleasant.
translation:
  language: ru
  text: Их судьи были низвергнуты по склонам утёса[a], и они услышали мои слова, ибо они приятны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вниз по склонам скалистого обрыва». Еврейское выражение трудно для понимания; буквальнее: «в руках утёса».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «сладки» или «отрадны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁמְטוּ
  choice: были сброшены
  rationale: Нифаль глагола שׁמט выражает падение или низвержение; страдательная конструкция передаёт вероятный насильственный характер действия, не ослабляя его до простого «поскользнулись».
- source_word: בִידֵי סֶלַע
  choice: со склонов утёса
  rationale: Трудное сочетание буквально связано с «руками утёса», но, вероятно, имеет пространственный смысл и указывает на боковые стороны или склоны скалы. Основной текст передаёт этот образ естественно по-русски, а буквальная возможность отмечена в сноске.
- source_word: שֹׁפְטֵיהֶם
  choice: их судьи
  rationale: Причастная форма от שׁפט прямо обозначает судящих; возможное расширенное значение «правители» не требуется вводить в основной текст.
- source_word: וְשָׁמְעוּ
  choice: и они услышали
  rationale: Форма qatal допускает различную временную соотнесённость в поэзии. Прошедшее время согласуется с предшествующим נִשְׁמְטוּ и не добавляет отсутствующей в еврейском тексте временной связки «тогда».
- source_word: אֲמָרַי
  choice: мои слова
  rationale: Прямой и естественный перевод формы с суффиксом первого лица.
- source_word: כִּי נָעֵמוּ
  choice: ведь они приятны
  rationale: כִּי имеет пояснительно-причинную силу, а נעם обозначает приятность или привлекательность. «Приятны» сохраняет сдержанный характер исходного выражения.
theological_decisions:
- issue: Толкование трудного выражения בִידֵי סֶלַע
  choice: 'пространственный образ: «со склонов утёса»'
  alternative: 'буквальнее: «в руки утёса»; также возможно «со скалистого обрыва»'
  rationale: Синтаксис стиха необычен, а образ допускает несколько пониманий. Пространственное прочтение наиболее естественно в контексте низвержения, однако буквальная образность сохранена в сноске, чтобы не устранять подлинную неоднозначность.
- issue: Временная соотнесённость נִשְׁמְטוּ и וְשָׁמְעוּ
  choice: обе формы переданы прошедшим временем
  alternative: 'возможны настоящее или будущее прочтение: «сбрасывают/услышат»'
  rationale: Поэтический qatal не всегда однозначно задаёт время. Прошедшее время обеспечивает связность русского стиха, но не вводит причинно-временного «тогда», которого нет в оригинале.
translation_notes:
  register: 'Современный литературный русский язык с кратким, достоинственным поэтическим строем. Сохранены параллельность частей стиха и местоименная неоднозначность: «они» грамматически может относиться к судьям, однако более широкий контекст способен допускать иной круг слушателей.'
