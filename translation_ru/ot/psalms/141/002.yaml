  yaml_path: translation/ot/psalms/141/002.yaml
  text: May my prayer be established before you as incense[b][a], the lifting up of my hands as the evening offering.
translation:
  language: ru
  text: Пусть моя молитва будет утверждена[a] перед Тобой, как благовонное курение; поднятие моих рук — как вечернее приношение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет устроена» или «будет приготовлена». Еврейское слово выражает просьбу о том, чтобы молитва была твёрдо поставлена в Божьем присутствии; смысл «будет принята» возможен как оттенок контекста, но прямо не выражен.'
    reason: lexical_alternative
  - marker: b
    text: «Вечернее приношение» — регулярное приношение, совершавшееся вечером; употреблённое здесь еврейское слово может, в частности, обозначать хлебное приношение.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכּוֹן
  choice: да утвердится
  rationale: Нифаль от כון передаёт пожелание, чтобы молитва была прочно поставлена или устроена перед Богом. Формулировка сохраняет этот образ и не сводит его без основания только к значению «будет принята».
- source_word: תְּפִלָּתִי
  choice: моя молитва
  rationale: Прямое соответствие существительному с суффиксом первого лица единственного числа.
- source_word: קְטֹרֶת
  choice: фимиам
  rationale: Передаёт культовое благовонное курение и сохраняет явный образ храмового богослужения.
- source_word: לְפָנֶיךָ
  choice: пред Тобой
  rationale: Естественно передаёт пространственно-отношенческое значение пребывания в Божьем присутствии; умеренно возвышенный регистр соответствует псалму.
- source_word: מַשְׂאַת כַּפַּי
  choice: воздеяние моих рук
  rationale: Сохраняет отглагольный образ самого поднятия рук как молитвенного жеста, а не только положение уже поднятых рук.
- source_word: מִנְחַת עָרֶב
  choice: вечернее приношение
  rationale: Сохраняет жертвенный смысл מִנְחָה, не сужая его в основном тексте до хлебного или зернового приношения; более точный культовый оттенок пояснён в сноске.
theological_decisions:
- issue: Сопоставление молитвы с храмовыми приношениями
  choice: Сохранено прямое поэтическое сравнение молитвы с фимиамом, а воздеяния рук — с вечерним приношением.
  alternative: Истолковать молитву как замену жертве либо ослабить культовый образ до общего обозначения благочестия.
  rationale: Еврейский текст использует явные культовые образы в параллельных сравнениях, но сам по себе не утверждает, что молитва отменяет или заменяет жертвоприношение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. Формы «пред Тобой», «фимиам» и «воздеяние» сохраняют культовый и молитвенный колорит, оставаясь понятными в контексте. Параллелизм двух частей стиха передан симметрично.
