lexical_decisions:
- source_word: שָׁמְרֵנִי
  choice: Убереги меня
  rationale: Просительная форма глагола שׁמר означает «хранить, оберегать». «Убереги меня» естественно передаёт молитвенную просьбу о защите от конкретной опасности.
- source_word: מִידֵי
  choice: от власти
  rationale: Буквально — «из рук / от рук». При неодушевлённом «западня» слово «власть» естественно передаёт образ захвата и опасности, не сводя выражение к простому предлогу «от».
- source_word: פַח
  choice: западни
  rationale: פח обозначает ловушку, западню или силок. «Западня» отличает это слово от следующего מֹקְשׁוֹת, переданного как «силки», и сохраняет вариативность параллелизма.
- source_word: יָקְשׁוּ לִי
  choice: которую они поставили мне
  rationale: Глагол יקשׁ связан с расставлением ловушки. Относительная конструкция ясно и естественно выражает, что неназванные противники приготовили западню для молящегося.
- source_word: וּמֹקְשׁוֹת
  choice: и от силков
  rationale: Множественное מֹקְשׁוֹת означает ловушки или силки. Предлог «от» повторён по-русски для ясного параллелизма.
- source_word: פֹּעֲלֵי אָוֶן
  choice: творящих зло
  rationale: Выражение буквально означает «делающие/творящие зло, нечестие». Причастный оборот сохраняет деятельный оттенок еврейской конструкции и звучит современно и достойно.
