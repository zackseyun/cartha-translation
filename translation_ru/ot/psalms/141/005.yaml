  yaml_path: translation/ot/psalms/141/005.yaml
  text: Let a righteous man strike me—it is a kindness[a]; let him rebuke me—it is oil for the head; let my head not refuse it[d][c][b]. For still my prayer is against their evils.
translation:
  language: ru
  text: Пусть праведник ударит меня — это проявление доброты[a]; пусть обличит меня — это масло для головы; пусть голова моя не отвергнет его[b]. Ведь моя молитва по-прежнему направлена против их злодеяний[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пусть праведник ударит меня с верной любовью». Слово חֶסֶד может означать также верную любовь, преданность или доброту.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст труден; возможный смысл: «пусть голова моя не отклонит (не отвергнет) этого».'
    reason: lexical_alternative
  - marker: c
    text: 'Последняя фраза неясна. Возможны также переводы: «ведь и тогда моя молитва — в их бедствиях» или «ведь даже в их бедах я молюсь за них».'
    reason: alternative_reading
lexical_decisions:
- source_word: יַהֲלְמֵנִי
  choice: пусть … ударит меня
  rationale: Глагол הלם обозначает сильный удар. Перевод сохраняет конкретную метафору сурового, но благотворного исправления и передаёт желательное значение формы.
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода в единственном числе естественно передаётся традиционным и понятным русским словом «праведник».
- source_word: חֶסֶד
  choice: это милость
  rationale: В данном контексте слово характеризует удар праведника как благотворное проявление доброты. «Милость» сохраняет смысл благожелательности и возможный более сильный оттенок верной любви.
- source_word: וְיוֹכִיחֵנִי
  choice: пусть обличит меня
  rationale: Hiphil от יכח здесь означает нравственно указать на вину, исправить. «Обличит» сохраняет резкость воздействия и соответствует возвышенному поэтическому регистру.
- source_word: שֶׁמֶן רֹאשׁ
  choice: елей для головы
  rationale: Буквальный образ масла, наносимого на голову, сохранён. «Елей» естественен в русской библейской поэзии, но не уточняет, идёт ли речь о формальном помазании.
- source_word: אַל־יָנִי רֹאשִׁי
  choice: пусть голова моя не отвергнет его
  rationale: Еврейский оборот и форма глагола трудны, однако контекст указывает на непринятие или отклонение елея-обличения. Сохранён необычный метафорический субъект «голова моя».
- source_word: כִּי עוֹד
  choice: ведь по-прежнему
  rationale: Передаёт как обосновывающую функцию כִּי, так и значение продолжающегося действия у עוֹד.
- source_word: וּתְפִלָּתִי בְּרָעוֹתֵיהֶם
  choice: моя молитва — против их злодеяний
  rationale: Предлог בְּ допускает несколько толкований. Основной текст выбирает направленность молитвы против злых дел, что согласуется с ближайшим контекстом, а иные возможности отмечены в сноске.
theological_decisions:
- issue: Характер удара праведника
  choice: удар назван милостью
  alternative: удар совершается с верной любовью
  rationale: Синтаксис позволяет понимать חֶסֶד либо как именную характеристику действия, либо наречно. Основной текст следует наиболее прямому чтению, не превращая суровое обличение в жестокость.
- issue: Образ елея и головы
  choice: голова не отвергает елей обличения
  alternative: голова не отклоняет или не устраняет его
  rationale: Трудный глагол не даёт оснований догматически уточнять образ. Перевод сохраняет метафору и отмечает лексическую неопределённость.
- issue: Смысл заключительной фразы
  choice: молитва направлена против их злодеяний
  alternative: молитва совершается во время их бедствий или за них в их бедах
  rationale: Еврейский предлог и значение רָעוֹת допускают противоположные по направленности прочтения. Основной вариант учитывает контекст нечестивых дел, а богословски значимая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Слова «праведник», «обличит» и «елей» поддерживают библейский регистр, оставаясь понятными; синтаксическая необычность образа «голова моя не отвергнет» намеренно сохранена из-за трудности оригинала.
