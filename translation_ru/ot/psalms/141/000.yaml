base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/000.yaml
  text: A psalm of David. Yahweh[a], I call to you; hurry to me. Give ear to my voice when I call to you.
translation:
  language: ru
  text: 'Псалом Давида.


    Господи[a], я взываю к Тебе — поспеши ко мне! Услышь мой голос, когда я взываю к Тебе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. YHWH — имя Бога, традиционно передаваемое как «Господь»; возможная передача: «Яхве».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְמוֹר לְדָוִד
  choice: Псалом Давида
  rationale: Традиционная и естественная передача надписания; конструкция может обозначать авторство, принадлежность или посвящение Давиду, и русский родительный падеж сохраняет эту краткость и некоторую неоднозначность.
- source_word: יְהוָה
  choice: Господи[a]
  rationale: В обращении употреблена традиционная русская передача имени YHWH словом «Господь» в звательном значении; сноска сообщает исходную форму и альтернативную передачу.
- source_word: חוּשָׁה לִּי
  choice: поспеши ко мне
  rationale: Сохраняет настоятельную просьбу и направленность действия к молящемуся; естественно звучит по-русски.
- source_word: הַאֲזִינָה קוֹלִי
  choice: Услышь мой голос
  rationale: Идиома означает внимательное слушание; «услышь» передаёт просьбу в естественном современном русском без архаического «внемли».
- source_word: בְּקָרְאִי לָךְ
  choice: когда я взываю к Тебе
  rationale: Временная конструкция передана прямо; повтор глагола «взываю» сохраняет повтор исходного текста.
theological_decisions:
- issue: Передача тетраграмматона YHWH
  choice: Господи[a]
  alternative: Яхве
  rationale: Традиционная русская форма в основном тексте остаётся понятной и богослужебно узнаваемой, а сноска прозрачно указывает личное имя и допустимую альтернативу, не навязывая конфессионального предпочтения.
translation_notes:
  register: Современный литературный русский, торжественный, но понятный. Сохранены лаконичность, настойчивость молитвы и повтор «взываю». Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской издательской традиции.
