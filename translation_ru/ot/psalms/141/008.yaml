lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит основание предшествующей мольбы; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: אֵלֶיךָ ... עֵינַי
  choice: к Тебе ... обращены мои глаза
  rationale: Сохранён пространственный образ направленного к Богу взгляда, выражающий внимание, ожидание и зависимость.
- source_word: יְהֹוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменено титулом, чтобы сохранить различие между יהוה и следующим אֲדֹנָי.
- source_word: אֲדֹנָי
  choice: мой Владыка
  rationale: «Владыка» отличает титул от имени Яхве и передаёт обращение с оттенком личной принадлежности; «мой» отражает смысл формы в данном сочетании.
- source_word: בְּךָ חָסִיתִי
  choice: у Тебя я укрылся
  rationale: Передан образ нахождения убежища у Бога; прошедшая форма отражает еврейский перфект и вместе с тем обозначает сохраняющееся состояние доверия.
- source_word: אַל־תְּעַר נַפְשִׁי
  choice: не оставляй меня беззащитным
  rationale: Контекстуально передаёт мольбу не оставить молящегося открытым для гибели. Буквальный образ опустошения или излияния נֶפֶשׁ пояснён в сноске, поскольку по-русски «не изливай мою жизнь» звучит неясно и неестественно.
theological_decisions:
- issue: Передача двойного обращения יְהֹוָה אֲדֹנָי
  choice: Яхве, мой Владыка
  alternative: Господь Бог; Господи, мой Господь
  rationale: Сохранены и личное имя, и отдельный титул, не сводя их к одному обращению и не скрывая личного оттенка второго элемента.
- issue: Значение נֶפֶשׁ в заключительной мольбе
  choice: меня — в составе выражения «не оставляй меня беззащитным»
  alternative: мою жизнь; мою душу
  rationale: Здесь נֶפֶשׁ может обозначать самого человека или его жизнь. Выбор не утверждает узкое антропологическое понимание «души»; возможные буквальные соответствия сохранены в сноске.
- issue: Неоднозначность תְּעַר
  choice: не оставляй ... беззащитным
  alternative: не изливай; не опустошай; не обнажай
  rationale: Глагол допускает образ излияния, опустошения или обнажения. Контекстуальный перевод передаёт просьбу о защите, а неоднозначность исходного образа не скрывается и отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Инверсия «обращены мои глаза» сохраняет поэтический ритм, оставаясь понятной; архаизмы и конфессионально специфические формулы не используются.
