  text: יִפְּל֣וּ בְ/מַכְמֹרָ֣י/ו רְשָׁעִ֑ים יַ֥חַד אָ֝נֹכִ֗י עַֽד אֶעֱבֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/141/010.yaml
  text: Let the wicked fall into their own nets together[c][b][a], while I pass by.
translation:
  language: ru
  text: Пусть нечестивые все вместе попадут в свои сети[a], а я тем временем пройду мимо[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в его сети». Еврейское существительное стоит во множественном числе, а притяжательный суффикс — в единственном: «его». В контексте это может означать сети самих нечестивых.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «пока я не пройду» или «доколе я не пройду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִפְּלוּ
  choice: пусть … попадут
  rationale: Имперфект qal 3-го лица множественного числа от נפל в контексте молитвы выражает пожелание. Русское «пусть … попадут в сети» естественно передаёт образ падения в ловушку.
- source_word: בְמַכְמֹרָיו
  choice: в свои сети
  rationale: מַכְמֹר — «сеть, ловушка»; форма существительного здесь множественная с суффиксом 3-го лица мужского рода единственного числа — буквально «в его сети». При множественном подлежащем русский возвратный оборот «в свои сети» ясно передаёт вероятный смысл, а формальная неоднозначность отмечена в сноске.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Субстантивированное прилагательное во множественном числе обозначает людей, поступающих нечестиво; традиционное русское слово остаётся понятным и соответствует возвышенному поэтическому регистру.
- source_word: יַחַד
  choice: все вместе
  rationale: Наречие выражает совместность или одновременность; «все вместе» естественно относится к множественному «нечестивые».
- source_word: אָנֹכִי
  choice: а я
  rationale: Самостоятельное местоимение имеет эмфатическую силу. Противительный оборот «а я» передаёт подчёркнутый контраст между участью нечестивых и говорящего.
- source_word: עַד אֶעֱבוֹר
  choice: тем временем пройду мимо
  rationale: Буквально עַד означает «до тех пор, пока», а עבר — «проходить, переходить, проходить мимо». В сжатой поэтической строке оборот описывает прохождение псалмопевца на фоне падения нечестивых; «тем временем» естественно передаёт временное соотношение без добавления отсутствующего в тексте слова «невредимым».
