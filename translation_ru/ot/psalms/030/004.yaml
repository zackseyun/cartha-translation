  yaml_path: translation/ot/psalms/030/004.yaml
  text: Sing praise to Yahweh[a], you his faithful ones[c][b], and give thanks to the remembrance of his holiness.
translation:
  language: ru
  text: Пойте хвалу Яхве[a], верные Ему[b], и благодарите, вспоминая о Его святости[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господу»; евр. יהוה — личное имя Бога, переданное здесь как «Яхве».'
    reason: divine_name
  - marker: b
    text: 'Или: «Его святые», «Его благочестивые» или «преданные Ему».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «при упоминании Его святости» или «в память о Его святости». Еврейское слово может означать память, воспоминание или упоминание; слова «имя» в тексте нет.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: זַמְּרוּ
  choice: Пойте хвалу
  rationale: Форма повелительного наклонения во множественном числе обозначает хвалебное пение, возможно с музыкальным сопровождением. «Пойте хвалу» передаёт и музыкальный, и богослужебный смысл.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передано личное имя יהוה, а не заменяющий его титул; форма «Яхве» привычна и понятна в современной русской библейской речи.
- source_word: חֲסִידָיו
  choice: верные Ему
  rationale: Слово חָסִיד обозначает людей, отличающихся преданностью и благочестием; местоименный суффикс выражен оборотом «Ему». Такое обращение естественно по-русски и не сужает значение до церковно-терминологического «святые».
- source_word: וְהוֹדוּ
  choice: и благодарите
  rationale: В контексте хвалы форма от ידה означает благодарить или воздавать хвалу. «Благодарите» сохраняет самостоятельный оттенок благодарения и хорошо соответствует параллелизму.
- source_word: לְזֵכֶר
  choice: при воспоминании о
  rationale: זֵכֶר может означать воспоминание, память или упоминание. Оборот «при воспоминании о» сохраняет предметную многозначность существительного и приемлем в поэтической речи.
- source_word: קָדְשׁוֹ
  choice: Его святости
  rationale: Буквально существительное קֹדֶשׁ с местоименным суффиксом указывает на принадлежащую Богу святость. Перевод не добавляет отсутствующего в еврейском тексте слова «имя».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст прямо содержит тетраграмматон. «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Значение חֲסִידָיו
  choice: верные Ему
  alternative: Его святые; Его благочестивые; преданные Ему
  rationale: Выбранный вариант удерживает связь с верностью и преданностью, не превращая слово в узкий конфессиональный термин.
- issue: Смысл לְזֵכֶר קָדְשׁוֹ
  choice: при воспоминании о Его святости
  alternative: при упоминании Его святости; чтите память Его святости; благодарите за Его святую память
  rationale: Конструкция допускает оттенки воспоминания, памятования и упоминания. Основной текст сохраняет эту напряжённость и не вводит слово «имя», хотя в контексте оно может подразумеваться.
translation_notes:
  register: Современный литературный русский с достоинством поэтического богослужебного обращения. Обращение «верные Ему» явно отделено запятыми; синтаксис прост и пригоден как для чтения, так и для произнесения вслух.
