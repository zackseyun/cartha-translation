base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/003.yaml
  text: O Yahweh[a], you brought up my soul from Sheol[c][b]; you kept me alive from among those going down to the pit.
translation:
  language: ru
  text: Яхве[a], Ты вывел мою душу[b] из Шеола[c], сохранил мне жизнь, избавив от участи сходящих в яму[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Яхве» — личное имя Бога, переданное в еврейском тексте тетраграмматоном יהוה.
    reason: divine_name
  - marker: b
    text: 'Или: «мою жизнь»; еврейское слово может также обозначать самого человека.'
    reason: lexical_alternative
  - marker: c
    text: 'Шеол — еврейское обозначение мира мёртвых; возможно также: «могила».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «от [участи] сходящих в яму». «Яма» — образ смерти или могилы. Возможны также переводы: «оживил меня из числа сходящих в яму» или «сохранил меня в живых, чтобы я не сошёл в яму».'
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Господи
  rationale: В русском библейском обращении передаёт тетраграмматон естественно и торжественно; форма обращения соответствует синтаксису стиха.
- source_word: הֶעֱלִיתָ
  choice: Ты вывел
  rationale: Передаёт каузативное движение вверх и избавление; сочетание «вывел из шеола» звучит по-русски естественнее буквального «поднял».
- source_word: מִן שְׁאוֹל
  choice: из шеола
  rationale: Сохраняет древнееврейское обозначение мира мёртвых, не сужая его до физической могилы и не отождествляя с адом.
- source_word: נַפְשִׁי
  choice: мою душу
  rationale: Сохраняет поэтическое выражение оригинала; в данном контексте слово также может означать жизнь или самого человека.
- source_word: חִיִּיתַנִי
  choice: сохранил мне жизнь
  rationale: Передаёт сохранение или восстановление жизни, не навязывая явного смысла воскресения.
- source_word: מִיּוֹרְדֵי בוֹר
  choice: среди сходящих в могилу
  rationale: Передаёт отделение говорящего от числа тех, кто нисходит в смертную яму; «могила» здесь естественно выражает погребально-смертельный образ בור.
- source_word: בּוֹר
  choice: могилу
  rationale: В этом параллелизме слово обозначает яму как образ могилы и смерти; буквальный вариант «ров» отмечен в сноске.
theological_decisions:
- issue: Следует ли выражать здесь воскресение или разработанное учение о загробном мире
  choice: Сохранить образы шеола и нисхождения в могилу как поэтическое описание избавления от смерти или смертельной опасности.
  alternative: Перевести как явное воскресение из мёртвых либо заменить шеол словом «ад».
  rationale: Оригинал не уточняет, идёт ли речь о буквальном возвращении из смерти или об избавлении от близкой смерти; перевод не должен устранять эту напряжённость.
- issue: Синтаксическая связь מִיּוֹרְדֵי בוֹר
  choice: «сохранил мне жизнь среди сходящих в могилу»
  alternative: «оживил меня из числа сходящих в могилу» или «не дал мне сойти в могилу»
  rationale: Предлог מן допускает понимание отделения от группы сходящих, но возможны также восстановительное и превентивное прочтения; они сохранены в сноске.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой речи. Синтаксис краткий и параллельный; специальные термины объяснены в сносках. Обращение «Господи» сохраняет привычную русскую молитвенную естественность, а сноска раскрывает стоящее в оригинале имя.
