lexical_decisions:
- source_word: מַה בֶּצַע
  choice: Что пользы
  rationale: Кратко и естественно передаёт риторический вопрос о том, какая выгода или польза последует из смерти псалмопевца.
- source_word: בְּדָמִי
  choice: в моей крови
  rationale: Сохраняет конкретный и многозначный еврейский образ; в контексте кровь подразумевает смерть или пролитие крови, но это толкование не подменяет образ в основном тексте.
- source_word: בְּרִדְתִּי אֶל שָׁחַת
  choice: в том, что я сойду в могилу
  rationale: Естественная русская конструкция передаёт нисхождение в שׁחת как образ приближения к смерти.
- source_word: שָׁחַת
  choice: могилу
  rationale: В данном контексте слово обозначает яму или могилу как место смерти. «Могила» понятна современному читателю, а буквальный образ «ямы» отмечен в сноске.
- source_word: הֲיוֹדְךָ עָפָר
  choice: Разве прах восхвалит Тебя?
  rationale: ידה при обращении к Богу естественно передаётся как «восхвалять»; «прах» сохраняет поэтический образ смертного человека.
- source_word: הֲיַגִּיד
  choice: Разве возвестит он
  rationale: «Возвестит» соответствует возвышенному поэтическому регистру и выражает открытое провозглашение.
- source_word: אֲמִתֶּךָ
  choice: о Твоей верности
  rationale: אמת может означать истину, надёжность или верность; здесь «верность» естественно обозначает неизменность Божьего характера, не устраняя лексическую альтернативу.
theological_decisions:
- issue: Следует ли прямо истолковать образы крови, могилы и праха как смерть
  choice: Сохранить конкретные образы крови и праха, а שׁחת передать контекстуально как «могила»
  alternative: 'Перевести всё интерпретирующе: «какая польза в моей смерти… разве мёртвый восхвалит Тебя?»'
  rationale: Еврейская поэзия выражает мысль о смерти через телесные и погребальные образы. Их сохранение удерживает поэтическое напряжение и не превращает перевод в толкование.
- issue: Значение אֲמִתֶּךָ
  choice: Твоя верность
  alternative: Твоя истина
  rationale: Оба значения допустимы. В молитвенном обращении к Богу «верность» хорошо передаёт Его надёжность, тогда как «истина» сохраняется в сноске как реальная альтернатива.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Риторические вопросы переданы через «разве»; местоимения, относящиеся к Богу, написаны с прописной буквы. Синтаксис сделан естественным для русского языка при сохранении образности и смысловой неоднозначности оригинала.
