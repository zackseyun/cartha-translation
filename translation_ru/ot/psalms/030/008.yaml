  text: To you, O LORD, I call, and to my Lord I plead for mercy.
translation:
  language: ru
  text: К Тебе, Господи, взываю, и Владыку моего молю о милости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: К Тебе
  rationale: Естественно передаёт направленность обращения; местоимение написано с прописной буквы как форма почтительного обращения к Богу.
- source_word: יְהוָה
  choice: Господи
  rationale: В прямом обращении традиционная русская передача имени יהוה словом «Господь» требует звательного по функции «Господи».
- source_word: אֶקְרָא
  choice: взываю
  rationale: Глагол קרא здесь означает настойчивое молитвенное обращение; «взываю» сохраняет возвышенный, но понятный регистр.
- source_word: אֲדֹנָי
  choice: Владыку моего
  rationale: Форма с суффиксом исторически связана с «мой господин»; в данном контексте обозначает Бога. «Владыку моего» сохраняет отличие от יהוה и личный оттенок, не смешивая два наименования.
- source_word: אֶתְחַנָּן
  choice: молю о милости
  rationale: Форма хитпаэль от חנן выражает мольбу о благосклонности или милости; этот перевод передаёт значение явно и естественно.
theological_decisions:
- issue: Соотношение יהוה и אֲדֹנָי в двух параллельных обращениях
  choice: 'Передать различно: «Господи» и «Владыку моего»'
  alternative: Дважды употребить «Господь» либо передать יהוה как «Яхве»
  rationale: Различение сохраняет два разных еврейских обозначения и параллелизм, не делая дополнительных выводов об их богословском соотношении.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Синтаксический параллелизм оригинала сохранён; архаические формы, кроме естественного молитвенного «Господи», не используются.
