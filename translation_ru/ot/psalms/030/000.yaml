lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Стандартное и естественное обозначение жанра в русской библейской традиции; музыкальный оттенок слова сохраняется контекстом заголовка.
- source_word: שִׁיר
  choice: Песнь
  rationale: Передано отдельно, чтобы сохранить два стоящих рядом жанровых обозначения, а не сливать их в одно.
- source_word: חֲנֻכַּת
  choice: на освящение
  rationale: Существительное обозначает посвящение или освящение; предлог «на» естественно выражает назначение песни или повод для её исполнения.
- source_word: הַבַּיִת
  choice: дома
  rationale: Буквально означает «дом» и само по себе не уточняет, имеется ли в виду храм, дворец или иной дом; общий перевод сохраняет эту неоднозначность.
- source_word: לְדָוִד
  choice: Давида
  rationale: Родительный падеж сохраняет традиционную краткость надписания и допускает связь с Давидом без обязательного уточнения авторства, принадлежности или посвящения.
theological_decisions:
- issue: Что означает «дом» в надписании
  choice: дом
  alternative: храм; дворец Давида
  rationale: Еврейское בַּיִת имеет широкий смысл, а надписание не определяет референт однозначно; конкретизация в основном тексте преждевременно сняла бы историко-богословскую неоднозначность.
- issue: Характер связи псалма с Давидом
  choice: Давида
  alternative: написанный Давидом; для Давида; принадлежащий Давиду
  rationale: Еврейское לְדָוִד может обозначать авторство, принадлежность, посвящение или связь; краткая форма «Давида» не навязывает только одно толкование.
translation_notes:
  register: Современный литературный русский с традиционной, но понятной лексикой надписаний. Короткие фразы передают перечислительный характер заголовка. Все сноски привязаны к соответствующим местам основного текста.
