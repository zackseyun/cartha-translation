  text: so that my glory may sing praise to you and not be silent. O Yahweh my God[a], I will give thanks to you forever.
translation:
  language: ru
  text: Чтобы слава моя пела Тебе хвалу и не умолкала. Яхве, Бог мой, вечно буду благодарить Тебя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Чтобы всё существо моё пело Тебе хвалу». Буквально: «слава моя» — поэтическое выражение, которое может обозначать внутреннее «я» псалмопевца или его язык.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Чтобы
  rationale: Передаёт целевое или результативное значение союза и естественно связывает стих с предыдущим контекстом.
- source_word: יְזַמֶּרְךָ
  choice: пела Тебе хвалу
  rationale: Порода piel глагола זמר обозначает пение или музыкальное прославление; формулировка сохраняет и музыкальный, и хвалебный смысл.
- source_word: כָבוֹד
  choice: слава моя
  rationale: Сохраняет буквальный поэтический образ еврейского текста, не устраняя неоднозначность возможного указания на внутреннее «я», всё существо или язык псалмопевца.
- source_word: וְלֹא יִדֹּם
  choice: и не умолкала
  rationale: В противопоставлении пению глагол דמם естественно означает прекращение речи или звука; «не умолкала» также согласовано с подлежащим «слава».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהַי
  choice: Бог мой
  rationale: Точно передаёт притяжательную форму и прямое обращение; порядок слов уместен для возвышенной русской речи.
- source_word: לְעוֹלָם
  choice: вечно
  rationale: Естественно и кратко выражает непрестанную, неограниченную длительность благодарения.
- source_word: אוֹדֶךָּ
  choice: буду благодарить Тебя
  rationale: В контексте благодарственного псалма hiphil глагола ידה обозначает благодарение и хвалебное признание.
theological_decisions:
- issue: Значение כָבוֹד как субъекта хвалы
  choice: В основном тексте сохранён буквальный образ «слава моя».
  alternative: «всё существо моё», «душа моя» или «язык мой»
  rationale: Поэтическое употребление допускает разные референты. Сохранение метафоры не разрешает спорный смысл без достаточных оснований, а примечание сообщает читателю вероятные значения.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация показывает присутствие в исходном тексте личного имени Бога и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Заглавные местоимения в обращении к Богу соответствуют принятой русской благоговейной письменной традиции. Маркер примечания поставлен после всего стиха, поскольку поясняет выражение в первой строке и не нарушает её ритм.
