source:
  edition: WLC
  text: יְהוָ֥ה אֱלֹהָ֑/י שִׁוַּ֥עְתִּי אֵ֝לֶ֗י/ךָ וַ/תִּרְפָּאֵֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/002.yaml
  text: O Yahweh my God[a], I cried out to you[c][b], and you healed me.
translation:
  language: ru
  text: Яхве, Бог мой[a], я взывал к Тебе[b], и Ты исцелил меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Яхве» (יהוה); традиционная передача — «Господь». Встречается также форма «Иегова».
    reason: alternative_reading
  - marker: b
    text: 'Или: «я звал Тебя на помощь».'
    reason: lexical_alternative
  - marker: c
    text: «Исцелил меня» может означать как телесное исцеление, так и более общее восстановление или избавление.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо представленное тетраграмматоном יהוה, в принятой современной русской форме.
- source_word: אֱלֹהָי
  choice: Бог мой
  rationale: Форма с суффиксом первого лица единственного числа означает «мой Бог»; порядок слов «Бог мой» естественен для возвышенного обращения.
- source_word: שִׁוַּעְתִּי
  choice: я взывал
  rationale: Глагол выражает настойчивый зов, обычно мольбу о помощи. «Взывал» сохраняет интенсивность и уместен в современном литературном библейском стиле.
- source_word: אֵלֶיךָ
  choice: к Тебе
  rationale: 'Предлог אֶל с суффиксом второго лица передаёт направленность обращения: «к Тебе».'
- source_word: וַתִּרְפָּאֵנִי
  choice: и Ты исцелил меня
  rationale: Глагол רפא непосредственно означает «исцелять» и допускает как телесное исцеление, так и более широкое восстановление или избавление.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» передаёт присутствующее в еврейском тексте личное имя, не заменяя его титулом; вариант отмечен сноской ввиду устойчивой русской традиции «Господь».
- issue: Смысл רפא
  choice: исцелил меня
  alternative: восстановил меня; возвратил мне здоровье
  rationale: «Исцелил» ближе всего к основному значению глагола и сохраняет контекстуальную открытость между телесным выздоровлением и более общим восстановлением или избавлением.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным псалмовым звучанием. Заглавная буква в местоимениях обращения к Богу соответствует распространённой русской издательской норме. Синтаксис краток и следует трёхчастному движению еврейской строки: обращение, мольба, ответ.'
