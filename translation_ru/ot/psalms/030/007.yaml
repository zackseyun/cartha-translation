- source_word: לְהַרְרִי
  choice: мою гору
  rationale: Сохраняется трудный и поэтически выразительный образ «моей горы», который может указывать на прочность, безопасность или благополучие, но не истолковывается прямо в основном тексте.
- source_word: הִסְתַּרְתָּ פָנֶיךָ
  choice: Ты скрыл Своё лицо
  rationale: Сохранена буквальная и богословски значимая древнееврейская идиома об отнятии благосклонного присутствия.
- source_word: נִבְהָל
  choice: пришёл в смятение
  rationale: Нифаль глагола בהל выражает состояние тревоги, потрясения или ужаса; «пришёл в смятение» передаёт сильную внутреннюю растерянность без неоправданного усиления до крайнего ужаса.
theological_decisions:
