  yaml_path: translation/ot/psalms/030/001.yaml
  text: I will exalt you[a], O Yahweh, because you have drawn me up and have not let my enemies rejoice over me.
translation:
  language: ru
  text: Возвеличу Тебя, Яхве, потому что Ты поднял меня[a] и не дал моим врагам торжествовать надо мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вытащил меня наверх»; еврейский глагол буквально рисует извлечение чего-либо вверх, например из колодца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹמִמְךָ
  choice: Возвеличу Тебя
  rationale: Форма от רום выражает возвышение в смысле прославления. «Возвеличу» естественно звучит в обращённой к Богу хвале и сохраняет образ возвышения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для хвалы; «потому что» ясно передаёт причинную связь в современном русском языке.
- source_word: דִלִּיתָנִי
  choice: Ты поднял меня
  rationale: Глагол דלה рисует извлечение наверх, особенно как при подъёме чего-либо из колодца. В основном тексте «поднял меня» звучит естественно, а конкретный образ сохранён в сноске.
- source_word: וְלֹא שִׂמַּחְתָּ
  choice: и не дал ... торжествовать
  rationale: Каузативный смысл буквально связан с тем, чтобы обрадовать врагов; по-русски в данном контексте он естественно выражается оборотом «не дал ... торжествовать».
- source_word: אֹיְבַי
  choice: моим врагам
  rationale: Прямое и естественное соответствие существительному с притяжательным суффиксом первого лица.
- source_word: לִי
  choice: надо мной
  rationale: Предлог обозначает торжество врагов за счёт псалмопевца; русский оборот «торжествовать надо мной» точно передаёт эту смысловую связь.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте непосредственно стоит тетраграмматон. Передача «Яхве» сохраняет личное имя, не подменяя его титулом; «Иегова» отражает более позднюю гибридную форму.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным молитвенным звучанием. Местоимение «Тебя/Ты» написано с прописной буквы как принятая форма почтительного обращения к Богу; синтаксис избегает излишней архаики.
