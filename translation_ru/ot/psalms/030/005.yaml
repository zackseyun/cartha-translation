source:
  edition: WLC
  text: כִּ֤י רֶ֨גַע בְּ/אַפּ/וֹ֮ חַיִּ֪ים בִּ/רְצ֫וֹנ֥/וֹ בָּ֭/עֶרֶב יָלִ֥ין בֶּ֗כִי וְ/לַ/בֹּ֥קֶר רִנָּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/030/005.yaml
  text: For his anger is for a moment[a]; life is in his favor. Weeping may stay for the night[b], but rejoicing comes in the morning.
translation:
  language: ru
  text: 'Ибо Его гнев — лишь на мгновение,

    а в Его благоволении — жизнь.

    Вечером плач может остаться на ночлег[a],

    но утром приходит ликование[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «переночует плач»; еврейский глагол может означать пребывание на ночлеге как гостя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «радостный возглас»; также возможно: «радостное пение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующей мысли; «ибо» сохраняет пояснительную связь и соответствует возвышенному, но понятному поэтическому регистру.
- source_word: רֶגַע בְּאַפּוֹ
  choice: Его гнев — лишь на мгновение
  rationale: אַף идиоматически означает «гнев», а רֶגַע — краткий миг. Связка и «лишь» естественно выражают эллиптическое именное предложение и контраст с жизнью.
- source_word: חַיִּים בִּרְצוֹנוֹ
  choice: в Его благоволении — жизнь
  rationale: חַיִּים здесь обозначает жизнь как абстрактное понятие, а רָצוֹן — благоволение, благосклонность. Компактная конструкция сохраняет параллелизм и не уточняет без необходимости, является ли благоволение средством или сферой жизни.
- source_word: בָּעֶרֶב יָלִין בֶּכִי
  choice: Вечером плач может остаться на ночлег
  rationale: לין буквально означает провести ночь, остановиться на ночлег. Персонифицированный «плач» и оборот «остаться на ночлег» сохраняют образ временного гостя; «может» естественно передаёт допустительный оттенок в контрасте с утром.
- source_word: וְלַבֹּקֶר רִנָּה
  choice: но утром приходит ликование
  rationale: Контрастное «но» явно передаёт противопоставление вечера и утра. רִנָּה может означать радостный возглас, пение или ликование; «ликование» сохраняет широту значения, а добавленная связка «приходит» делает русскую строку естественной.
theological_decisions:
- issue: К кому относятся местоименные суффиксы в выражениях «Его гнев» и «Его благоволение»
  choice: К Господу, о котором говорится в контексте псалма
  alternative: Оставить референт формально невыраженным или заменить местоимение именем «Господь»
  rationale: Русское «Его» сохраняет местоименную форму оригинала, тогда как контекст ясно указывает на Бога. Перевод удерживает напряжение между подлинностью Божьего гнева и животворностью Его благоволения, не добавляя доктринальных пояснений.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Сохранены краткий параллелизм, противопоставление гнева и благоволения, вечера и утра, а также олицетворение плача. Все сноски отмечены в основном тексте.
