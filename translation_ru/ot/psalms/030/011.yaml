  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в танец». В еврейском тексте добавлено «для меня»; его точный оттенок в этой поэтической строке не вполне ясен.'
    reason: Сохраняет явно присутствующее לִי, отмечая его синтаксическую и смысловую неоднозначность без навязывания толкования.
lexical_decisions:
- source_word: מִסְפְּדִי
  choice: мой плач
  rationale: Передаёт траурный плач или скорбь; в данном поэтическом противопоставлении естественно сочетается с «пляской».
- source_word: לְמָחוֹל לִי
  choice: в пляску для меня
  rationale: Сохраняет явное לִי («для меня»), не устраняя несколько необычный акцент еврейского текста.
- source_word: פִּתַּחְתָּ שַׂקִּי
  choice: Ты снял с меня вретище
  rationale: Буквально глагол означает «развязал/освободил», а в контексте речь о снятии траурной одежды; формулировка естественна по-русски и сохраняет образ.
- source_word: וַתְּאַזְּרֵנִי שִׂמְחָה
  choice: и препоясал меня радостью
  rationale: Сохраняет метафору опоясывания, связанную с корнем אזר, и поэтическое представление радости как нового одеяния.
