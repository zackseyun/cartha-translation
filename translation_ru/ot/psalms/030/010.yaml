  yaml_path: translation/ot/psalms/030/010.yaml
  text: Hear[a], O Yahweh, and be gracious to me; O Yahweh, be my helper.
translation:
  language: ru
  text: Услышь, Яхве, и будь милостив ко мне[a]; Яхве, будь мне помощником.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помилуй меня». Еврейский глагол может выражать просьбу о милости или благоволении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע
  choice: Услышь
  rationale: Императив 2-го лица единственного числа от שׁמע. «Услышь» естественно звучит как прямая молитвенная просьба; подразумеваемое дополнение не добавлено.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
- source_word: וְחָנֵּנִי
  choice: и будь милостив ко мне[a]
  rationale: Императив от חנן с суффиксом 1-го лица единственного числа выражает просьбу оказать милость или благоволение. Основной вариант сохраняет значение милостивого расположения, а сноска отмечает естественную альтернативу.
- source_word: הֱיֵה
  choice: будь
  rationale: Императив от היה здесь употреблён в просьбе и естественно передаётся формой «будь», а не «стань».
- source_word: עֹזֵר לִי
  choice: будь мне помощником
  rationale: Причастие от עזר с предлогом и суффиксом 1-го лица передаёт личного помощника; конструкция «мне помощником» близко сохраняет форму оригинала и естественна в возвышенной молитвенной речи.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе дважды прямо употреблён тетраграмматон. «Яхве» сохраняет личное имя Бога и не заменяет его титулом; форма «Иегова» менее точно отражает общепринятую научную реконструкцию произношения.
- issue: Значение просьбы חנן
  choice: будь милостив ко мне
  alternative: помилуй меня; окажи мне благоволение
  rationale: Глагол допускает оттенки милости, благоволения и сострадания. Основной текст не сужает просьбу исключительно до избавления от наказания, а сноска сохраняет контекстуально возможный вариант «помилуй».
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным молитвенным звучанием. Сохранены параллелизм двух обращений к Яхве и личный характер просьбы о помощи.
