  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/000.yaml
  text: A psalm of Asaph. God[a], nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem into ruins.
translation:
  language: ru
  text: 'Псалом Асафа.[a]


    Боже, народы вошли в Твой удел,

    осквернили Твой святой храм,

    превратили Иерусалим в груды развалин.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Псалом для Асафа».'
    reason: Еврейская конструкция לְאָסָף может указывать на авторство, принадлежность или предназначение псалма.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Традиционный и точный русский эквивалент названия поэтического произведения, исполнявшегося с музыкальным сопровождением.
- source_word: בְּנַחֲלָתֶךָ
  choice: в Твой удел
  rationale: Слово נַחֲלָה обозначает наследственное владение или удел. «Твой удел» естественно по-русски и сохраняет представление о земле и народе, принадлежащих Богу, не сводя смысл только к одному из них.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: Твой святой храм
  rationale: הֵיכָל в данном контексте обозначает храм, а קֹדֶשׁ выражает его святость и принадлежность Богу.
- source_word: לְעִיִּים
  choice: в груды развалин
  rationale: Множественное עִיִּים указывает на груды камней или развалин; русский оборот передаёт и разрушение города, и конкретный образ нагромождённых руин.
theological_decisions:
- issue: Объём значения Божьего «удела»
  choice: Сохранить обобщённое «Твой удел»
  alternative: «Твоё наследие» или конкретизация как «Твоя земля»
  rationale: Еврейский текст допускает связь и с землёй, и с народом как Божьим достоянием. Формулировка «Твой удел» сохраняет эту смысловую широту и не разрешает неоднозначность искусственно.
translation_notes:
  register: 'Современный литературный русский язык с достоинством молитвенного плача. Сохранено прямое обращение «Боже» и трёхчастное нарастание бедствия: вторжение, осквернение храма, разрушение Иерусалима.'
