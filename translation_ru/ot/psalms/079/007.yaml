base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/007.yaml
  text: For they have devoured Jacob and laid waste his dwelling place[a].
translation:
  language: ru
  text: 'Ибо они пожрали Иакова

    и опустошили его жилище.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Потому что они поглотили Иакова и превратили его обиталище в пустыню».'
    reason: Лексические варианты для כִּי, אָכַל, נָוֵהוּ и הֵשַׁמּוּ.
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующей мольбы; «ибо» естественно передаёт пояснительно-причинную связь и соответствует возвышенному поэтическому регистру.
- source_word: אָכַל
  choice: пожрали
  rationale: Буквальное значение — «есть», но здесь глагол метафорически изображает жестокое уничтожение народа. «Пожрали» сохраняет силу и образность еврейского выражения.
- source_word: אֶת יַעֲקֹב
  choice: Иакова
  rationale: Сохранено данное в еврейском тексте поэтическое имя народа; оно не заменено толкованием «Израиль» или «потомки Иакова».
- source_word: נָוֵהוּ
  choice: его жилище
  rationale: Слово может обозначать жилище, обиталище или пастбище. В данном параллелизме речь идёт о месте обитания Иакова/Израиля; «жилище» сохраняет широкий смысл и не сужает его до храма.
- source_word: הֵשַׁמּוּ
  choice: опустошили
  rationale: Форма глагола выражает причинение запустения. «Опустошили» — ясное и выразительное соответствие в современном русском языке.
theological_decisions:
- issue: К чему относится «его жилище»
  choice: К месту обитания Иакова/Израиля в широком смысле
  alternative: Непосредственно к храму/святилищу либо к земле Израиля
  rationale: Местоименный суффикс естественно отсылает к Иакову. Контекст всего псалма допускает связь со святилищем и землёй, однако сама строка не требует такого сужения, поэтому перевод сохраняет смысловую широту.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Параллельное построение строк сохранено; метафора пожирания передана без смягчения.
