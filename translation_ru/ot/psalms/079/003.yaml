  text: Кровь их пролили, как воду, вокруг Иерусалима, и некому было их похоронить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁפְכוּ
  choice: пролили
  rationale: Qal perfect 3-го лица множественного числа передаёт завершённое действие. В сочетании с «кровь» русский глагол «пролили» естественен и при этом сохраняет образ жидкости, усиленный сравнением «как воду».
- source_word: דָמָם
  choice: кровь их
  rationale: 'Буквально: «их кровь». Порядок слов «кровь их» придаёт строке уместное поэтическое звучание без изменения смысла.'
- source_word: כמים
  choice: как воду
  rationale: 'Префикс כ обозначает сравнение. В русском при глаголе «пролили» винительный падеж «как воду» естественно сохраняет образ: с кровью обращались так, словно это была вода.'
- source_word: סביבות ירושלים
  choice: вокруг Иерусалима
  rationale: סביבות обозначает пространство вокруг места. «Вокруг Иерусалима» точно и естественно передаёт широкую локализацию происходящего.
- source_word: ואין
  choice: и некому было
  rationale: Отрицательная экзистенциальная конструкция указывает на отсутствие человека, который мог бы совершить погребение. Прошедшее время в русском согласует описание с завершённым действием «пролили».
- source_word: קובר
  choice: их похоронить
  rationale: Причастие означает «хоронящий» или «тот, кто похоронит». Русская безличная конструкция «некому было их похоронить» естественно выражает этот смысл; местоимение «их» явно обозначает убитых, подразумеваемых контекстом.
