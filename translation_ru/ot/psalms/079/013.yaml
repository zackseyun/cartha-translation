  text: וַ/אֲנַ֤חְנוּ עַמְּ/ךָ֨ וְ/צֹ֥אן מַרְעִיתֶ/ךָ֮ נ֤וֹדֶ֥ה לְּ/ךָ֗ לְ/ע֫וֹלָ֥ם לְ/דֹ֥ר וָ/דֹ֑ר נְ֝סַפֵּ֗ר תְּהִלָּתֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/013.yaml
  text: But we[a], your people and the sheep of your pasture, will give thanks to you forever[b]; from generation to generation we will recount your praise.
translation:
  language: ru
  text: А мы, твой народ и овцы твоего пастбища[a], будем благодарить тебя вовеки; из поколения в поколение будем возвещать хвалу тебе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стадо твоего пастбища».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будем рассказывать о твоей хвале».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: А мы
  rationale: Самостоятельное местоимение с союзом выделяет общину и противопоставляет её народам и разорению, описанным ранее; «А мы» естественно передаёт этот оттенок по-русски.
- source_word: עַמְּךָ
  choice: твой народ
  rationale: Прямое и естественное обозначение народа, принадлежащего Богу; сохраняет заветный контекст без поясняющей надстройки.
- source_word: וְצֹאן מַרְעִיתֶךָ
  choice: и овцы твоего пастбища
  rationale: 'Сохраняет оба элемента пастушеского образа: צֹאן как «овцы» и מַרְעִית как «пастбище». Вариант «стадо» возможен, но менее конкретен.'
- source_word: נוֹדֶה לְּךָ
  choice: будем благодарить тебя
  rationale: Порода Hiphil глагола ידה здесь естественно означает благодарение или прославление. «Благодарить» позволяет отличить этот глагол от следующего существительного «хвала».
- source_word: לְעוֹלָם
  choice: вовеки
  rationale: Краткое, традиционно-поэтическое, но понятное современному читателю обозначение непрекращающегося времени.
- source_word: לְדֹר וָדֹר
  choice: из поколения в поколение
  rationale: Естественная русская идиома, точно передающая продолжение действия во всех последующих поколениях.
- source_word: נְסַפֵּר
  choice: будем возвещать
  rationale: Piel глагола ספר может обозначать рассказывание, перечисление или провозглашение. «Возвещать» естественно сочетается со словом «хвала» и сохраняет публичный характер действия.
- source_word: תְּהִלָּתֶךָ
  choice: хвалу тебе
  rationale: Передаёт хвалу, обращённую к Богу. Еврейское выражение допускает также смысл рассказа о том, что достойно хвалы в Боге, поэтому альтернативный оттенок отмечен в сноске.
theological_decisions:
- issue: Пастушеский образ Божьего народа
  choice: 'Сохранить прямой образ: «овцы твоего пастбища»'
  alternative: «твоё стадо» или «овцы, которых ты пасёшь»
  rationale: Стих называет молящуюся общину и Божьим народом, и овцами под его пастырской заботой. Прямой образ сохраняет смысл исходного текста, не добавляя позднейших доктринальных уточнений.
- issue: Содержание выражения תְּהִלָּתֶךָ
  choice: «хвалу тебе»
  alternative: «твои славные дела» или «то, за что тебя прославляют»
  rationale: Существительное может обозначать как саму хвалу, так и достойные хвалы качества или деяния. Основной текст сохраняет формальную неопределённость, а сноска указывает на смысловую возможность.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим библейским звучанием. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная издательская норма. Параллелизм двух полустиший и пастушеская метафора сохранены.
