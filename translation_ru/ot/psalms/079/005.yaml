source:
  edition: WLC
  text: עַד מָ֣ה יְ֭הוָה תֶּאֱנַ֣ף לָ/נֶ֑צַח תִּבְעַ֥ר כְּמוֹ אֵ֝֗שׁ קִנְאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/005.yaml
  text: How long[a], O Yahweh? Will you be angry forever? Will your jealousy burn like fire?
translation:
  language: ru
  text: Доколе, Яхве? Неужели Ты будешь гневаться вечно? Неужели Твоя ревность[a] будет пылать, как огонь?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоё рвение». Еврейское слово קִנְאָה может означать «ревность» или «рвение».'
    reason: Лексическая неоднозначность исходного слова.
lexical_decisions:
- source_word: עַד מָה
  choice: Доколе
  rationale: Устойчивая и выразительная формула плача, естественная для современного литературного русского языка и передающая вопрос о продолжительности бедствия.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: תֶּאֱנַף
  choice: будешь гневаться
  rationale: Глагол обозначает гнев; русское «гневаться» сохраняет достоинство поэтической речи и не усиливает значение до ярости.
- source_word: לָנֶצַח
  choice: вечно
  rationale: В контексте плача выражает опасение, что Божий гнев не прекратится.
- source_word: תִּבְעַר
  choice: будет пылать
  rationale: Передаёт образ интенсивного горения и естественно сочетается в русском языке со сравнением «как огонь».
- source_word: כְּמוֹ אֵשׁ
  choice: как огонь
  rationale: Прямо и естественно сохраняет еврейское сравнение.
- source_word: קִנְאָתֶךָ
  choice: Твоя ревность
  rationale: «Ревность» сохраняет возможный смысл Божьей исключительной, заветной притязательности; допустимое значение «рвение» отмечено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение קִנְאָה применительно к Богу
  choice: ревность
  alternative: рвение
  rationale: Контекст гнева и образ пылающего огня допускают заветную «ревность», однако еврейское слово также может означать «рвение»; неоднозначность сохранена сноской.
- issue: Вопросительная структура стиха
  choice: Три вопросительных высказывания, последние два с «неужели»
  alternative: «Доколе, Яхве, Ты будешь гневаться? Вечно ли будет пылать…»
  rationale: Масоретская акцентуация поддерживает паузу после обращения, а форма без явных вопросительных частиц допускает риторическое прочтение. «Неужели» естественно передаёт тревожное предположение, не превращая его в утверждение.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной лексикой псалмового плача. «Доколе» сохраняет библейскую торжественность без архаической грамматики; местоимения в обращении к Богу написаны с прописной буквы по русской религиозно-литературной традиции.
