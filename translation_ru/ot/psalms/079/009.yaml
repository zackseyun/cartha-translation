base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/009.yaml
  text: Help us[a], God of our salvation, for the glory of your name[b]; deliver us and atone for our sins for your name’s sake.
translation:
  language: ru
  text: Помоги нам, Боже нашего спасения, ради славы Твоего имени[a]; избавь нас и соверши искупление за наши грехи[b] ради Твоего имени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за славы Твоего имени».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «очисти нас от наших грехов» или «прости наши грехи»; еврейский глагол выражает искупление и устранение вины, а не только прощение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָזְרֵנוּ
  choice: Помоги нам
  rationale: Прямо передаёт повелительную форму עזר с суффиксом первого лица множественного числа и сохраняет настойчивость молитвы.
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: Боже нашего спасения
  rationale: Сохраняет конструкцию «Бог нашего спасения», то есть Бог как источник спасения, и естественно звучит в русском обращении.
- source_word: עַל דְּבַר כְּבוֹד שְׁמֶךָ
  choice: ради славы Твоего имени
  rationale: 'Передаёт основание и побуждение просьбы: псалмопевец взывает к Божьей славе и чести, связанной с Его именем.'
- source_word: וְהַצִּילֵנוּ
  choice: избавь нас
  rationale: Точно передаёт каузативную форму נצל и соответствует возвышенному, но понятному псалмическому регистру.
- source_word: וְכַפֵּר עַל
  choice: соверши искупление за
  rationale: Сохраняет присущий כפר язык искупления и устранения вины, не сводя значение лишь к прощению.
- source_word: חַטֹּאתֵינוּ
  choice: наши грехи
  rationale: Прямо передаёт существительное во множественном числе с суффиксом первого лица множественного числа.
- source_word: לְמַעַן שְׁמֶךָ
  choice: ради Твоего имени
  rationale: Естественно передаёт устойчивое обращение к Божьему имени, то есть к Его характеру, чести и репутации, как основанию действия.
theological_decisions:
- issue: Значение כפר в покаянной просьбе
  choice: соверши искупление за наши грехи
  alternative: прости наши грехи
  rationale: Выбранный вариант сохраняет более насыщенное значение устранения вины посредством искупления, не уточняя его механизм сверх сказанного в тексте. Вариант «прости» понятнее, но сужает значение глагола.
- issue: Двойное обращение к Божьему имени как основанию просьбы
  choice: ради славы Твоего имени ... ради Твоего имени
  alternative: из-за славы Твоего имени ... ради Твоего имени
  rationale: 'Сохранены оба оборота исходного текста, чтобы не устранять его смысловой повтор: помощь испрашивается ради Божьей славы и имени, а не на основании заслуг молящихся.'
translation_notes:
  register: Современный литературный русский язык с достоинством псалмической молитвы. Форма обращения «Боже» естественна по-русски; богословски значимые слова «спасение» и «искупление» сохранены без конфессионального уточнения механизма искупления.
