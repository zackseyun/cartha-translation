  variant: modern literary Russian
source:
  edition: WLC
  text: שְׁפֹ֤ךְ חֲמָתְ/ךָ֨ אֶֽל הַ/גּוֹיִם֮ אֲשֶׁ֪ר לֹא יְדָ֫ע֥וּ/ךָ וְ/עַ֥ל מַמְלָכ֑וֹת אֲשֶׁ֥ר בְּ֝/שִׁמְ/ךָ֗ לֹ֣א קָרָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/006.yaml
  text: Pour out your wrath on the nations that do not know you[b][a], and on the kingdoms that do not call on your name.
translation:
  language: ru
  text: Излей гнев Твой на народы, которые не знают Тебя[a], и на царства, которые не призывают имени Твоего[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не признают Тебя». Еврейское слово «знать» может означать не только осведомлённость, но и личное признание.'
    reason: lexical_alternative
  - marker: b
    text: То есть не обращаются к Тебе в молитве и поклонении. Еврейский оборот «призывать имя» означает молитвенно взывать или поклоняться.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁפֹךְ
  choice: Излей
  rationale: Повелительная форма глагола שפך сохраняет яркий образ гнева как изливаемой жидкости; «излей» естественно звучит в возвышенной молитвенной речи.
- source_word: חֲמָתְךָ
  choice: гнев Твой
  rationale: חֵמָה обозначает сильный, пылающий гнев. «Гнев» точно передаёт смысл без излишне эмоционально окрашенных добавлений вроде «ярость».
- source_word: אֶל הַגּוֹיִם
  choice: на народы
  rationale: В сочетании с русским «излей» предлог «на» естественно обозначает объект суда; גּוֹיִם здесь — чужеземные народы, а не позднейшее конфессионально окрашенное понятие.
- source_word: אֲשֶׁר לֹא יְדָעוּךָ
  choice: которые не знают Тебя
  rationale: יָדַע может включать не только осведомлённость, но и личное признание Бога. Буквальное «не знают Тебя» сохраняет эту смысловую глубину и неоднозначность.
- source_word: וְעַל מַמְלָכוֹת
  choice: и на царства
  rationale: Передаёт координацию и поэтический параллелизм с «на народы»; מַמְלָכוֹת прямо обозначает царства или политические владения.
- source_word: אֲשֶׁר בְּשִׁמְךָ לֹא קָרָאוּ
  choice: которые не призывают имени Твоего
  rationale: Оборот קרא בשם обозначает молитвенное обращение, поклонение или взывание. «Призывать имя» сохраняет библейскую идиому и её религиозный смысл.
theological_decisions:
- issue: Характер знания Бога народами
  choice: «не знают Тебя»
  alternative: «не признают Тебя»
  rationale: Основной текст сохраняет прямоту еврейского יָדַע и не сводит его ни к интеллектуальной осведомлённости, ни исключительно к поклонению; последующая строка отдельно говорит о призывании Божьего имени.
- issue: Смысл призывания Божьего имени
  choice: «не призывают имени Твоего»
  alternative: «не взывают к Тебе»
  rationale: 'Выбранный вариант сохраняет значимость Божьего имени и допускает весь диапазон идиомы: молитвенное обращение, взывание и поклонение.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-поэтическим звучанием. Постпозиция притяжательного местоимения («гнев Твой», «имени Твоего») сохраняет достоинство псалмового стиля, оставаясь понятной современному читателю; прописные местоимения употреблены последовательно как редакционная норма обращения к Богу.
