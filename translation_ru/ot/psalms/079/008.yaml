  text: אַֽל תִּזְכָּר לָ/נוּ֮ עֲוֺנֹ֪ת רִאשֹׁ֫נִ֥ים מַ֭הֵר יְקַדְּמ֣וּ/נוּ רַחֲמֶ֑י/ךָ כִּ֖י דַלּ֣וֹנוּ מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/008.yaml
  text: Do not remember against us the iniquities of former times; let your mercies quickly come to meet us[a], for we have been brought very low.
translation:
  language: ru
  text: Не припоминай нам прежних беззаконий[a]. Пусть Твои милости скорее придут нам навстречу, ибо мы крайне ослабели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «беззаконий наших предков» или «наших прежних беззаконий». Еврейское выражение допускает разные понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּזְכָּר לָנוּ
  choice: Не припоминай нам
  rationale: Запретительная конструкция передана как молитвенная просьба. Глагол זכר означает «помнить, вспоминать», а לָנוּ в данном контексте придаёт смысл неблагоприятного вменения; русское «припоминать кому-либо» естественно сочетает обе стороны выражения.
- source_word: עֲוֺנֹת
  choice: беззаконий
  rationale: עָוֹן обозначает нравственную вину, порочное деяние или его виновность. «Беззакония» сохраняет вес исходного понятия и подходит возвышенному, но современному регистру псалма.
- source_word: רִאשֹׁנִים
  choice: прежних времён
  rationale: Прилагательное означает «прежние, ранние». Временная формулировка не решает, имеются ли в виду грехи предков или прежние грехи самого народа.
- source_word: מַהֵר
  choice: скорее
  rationale: Передаёт настойчивую просьбу о скором действии и естественно звучит с повелительно-желательной конструкцией «пусть… придут».
- source_word: יְקַדְּמוּנוּ
  choice: придут нам навстречу
  rationale: Форма от קדם выражает выход или приближение навстречу, предшествование. Перевод сохраняет образ Божьих милостей, спешащих встретить молящихся.
- source_word: רַחֲמֶיךָ
  choice: милости Твои
  rationale: Еврейское רַחֲמִים выражает сострадание и милосердие и имеет форму множественного числа. «Милости Твои» сохраняет это число и остаётся понятным в современном русском.
- source_word: כִּי דַלּוֹנוּ מְאֹד
  choice: ибо мы крайне ослабели
  rationale: כִּי вводит основание просьбы. דלל описывает состояние крайней слабости, истощения или упадка; перфект здесь передаёт наступившее состояние. «Крайне» отражает усилитель מְאֹד.
theological_decisions:
- issue: К кому относятся «беззакония прежних времён»
  choice: Основной текст оставляет принадлежность беззаконий неуточнённой.
  alternative: «беззаконий наших предков» или «наших прежних беззаконий»
  rationale: Сочетание עֲוֺנֹת רִאשֹׁנִים допускает как отсылку к вине прежних поколений, так и к прежним грехам самого народа. Уточнение в основном тексте неоправданно устранило бы подлинную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Формы «ибо» и порядок «милости Твои» поддерживают псалмодический регистр, не делая текст архаичным; неоднозначность первой строки сохранена и пояснена в сноске.
