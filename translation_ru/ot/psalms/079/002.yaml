base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/002.yaml
  text: They have given the corpses of your servants as food to the birds of the heavens[b][a], the flesh of your faithful ones to the beasts of the earth.
translation:
  language: ru
  text: Они отдали трупы Твоих рабов в пищу птицам небесным, плоть верных Тебе[a] — зверям земным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преданных Тебе», «Твоих благочестивых» или «Твоих святых». Еврейское слово обозначает тех, кто предан Богу и верен Ему в отношениях завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְנוּ
  choice: Они отдали
  rationale: Qal perfect 3-го лица множественного числа обозначает совершённое действие. Русское прошедшее время естественно передаёт повествование о свершившемся бедствии.
- source_word: נִבְלַת
  choice: трупы
  rationale: נְבֵלָה обозначает мёртвое тело, труп. Это точное и современное слово, сохраняющее страшный образ непогребённых тел.
- source_word: עֲבָדֶיךָ
  choice: Твоих рабов
  rationale: В обращении к Богу עֶבֶד указывает на принадлежность и служение. «Рабов» соответствует устойчивому высокому библейскому употреблению в русском языке и не требует уточнять юридический статус.
- source_word: מַאֲכָל
  choice: в пищу
  rationale: В сочетании с נתן выражение означает предназначение тел на съедение; «отдали в пищу» естественно и точно.
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: птицам небесным
  rationale: עוֹף — собирательное обозначение летающих существ, здесь естественно «птицы»; הַשָּׁמַיִם в поэтической параллели передано как «небесным».
- source_word: בְּשַׂר
  choice: плоть
  rationale: Буквальное значение сохраняет резкий телесный образ и параллелизм с «трупами».
- source_word: חֲסִידֶיךָ
  choice: верных Тебе
  rationale: חָסִיד обозначает людей, преданных Богу и проявляющих верность в отношениях завета. Такая передача ясна современному читателю и не вводит позднейший технический смысл слова «святые».
- source_word: לְחַיְתוֹ אָרֶץ
  choice: зверям земным
  rationale: חַיְתוֹ־אָרֶץ означает земных животных, в контексте — диких зверей, пожирающих тела. Поэтическая формулировка сохраняет параллель «птицам небесным — зверям земным».
theological_decisions:
- issue: Передача заветного обозначения חֲסִידֶיךָ
  choice: верных Тебе
  alternative: преданных Тебе; благочестивых Твоих; святых Твоих
  rationale: Еврейское слово может характеризовать принадлежащих Богу как верных, преданных и благочестивых. Основной текст подчёркивает направленность их верности к Богу, а сноска сохраняет смысловую широту и не превращает слово в более поздний конфессиональный термин.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Сохранены резкая телесная образность и поэтический параллелизм; обращения к Богу оформлены с прописной буквы.
