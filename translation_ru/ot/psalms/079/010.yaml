  text: לָ֤/מָּה יֹאמְר֣וּ הַ/גּוֹיִם֮ אַיֵּ֪ה אֱֽלֹהֵ֫י/הֶ֥ם יִוָּדַ֣ע ב/גיים לְ/עֵינֵ֑י/נוּ נִ֝קְמַ֗ת דַּֽם עֲבָדֶ֥י/ךָ הַ/שָּׁפֽוּךְ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/010.yaml
  text: Why should the nations say[b][a], “Where is their God?” Let the vengeance of your servants' shed blood be made known among the nations before our eyes.
translation:
  language: ru
  text: 'Зачем народам говорить: «Где же их Бог?» Пусть у нас на глазах среди народов станет известно о возмездии за пролитую кровь Твоих слуг.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה
  choice: Почему
  rationale: Передаёт риторический протест; форма יֹאמְרוּ сама по себе допускает настоящее или модальное понимание, поэтому естественное русское «Почему ... говорят?» не переуточняет оттенок.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: Речь идёт о чужеземных народах; «язычники» внесло бы более узкий религиозный оттенок.
- source_word: אַיֵּה אֱלֹהֵיהֶם
  choice: Где же их Бог?
  rationale: Частица «же» естественно передаёт насмешливый вызов, а прописная буква указывает на Бога Израиля как референта.
- source_word: יִוָּדַע
  choice: станет известно
  rationale: Сохраняет пассивное значение нифаля ידע и публичный характер ожидаемого действия.
- source_word: לְעֵינֵינוּ
  choice: у нас на глазах
  rationale: Современный и живой русский эквивалент выражения «перед нашими глазами», подчёркивающий желание лично увидеть воздаяние.
- source_word: נִקְמַת
  choice: отомстил
  rationale: Глагольная перестройка естественна по-русски и сохраняет сильный смысл возмездия, не смягчая его до общей справедливости.
- source_word: דַּם עֲבָדֶיךָ הַשָּׁפוּךְ
  choice: за пролитую кровь Твоих слуг
  rationale: Передаёт кровь насильственно убитых Божьих слуг и естественно связывает её с возмездием.
theological_decisions:
- issue: Просьба о Божьем отмщении
  choice: Сохранить прямую просьбу о том, чтобы Бог отомстил за пролитую кровь
  alternative: Передать как просьбу о справедливости или защите
  rationale: נקמה прямо обозначает месть или возмездие; смягчение устранило бы напряжённость молитвы-проклятия.
- issue: Подлежащее действия отмщения
  choice: Эксплицировать Бога местоимением «Ты»
  alternative: Сохранить безлично-пассивную конструкцию «да станет известна месть»
  rationale: Контекст обращения к Богу ясно указывает на Него как совершающего возмездие; экспликация делает русский текст естественным, а примечание сохраняет формальную альтернативу.
- issue: Связь выражения «у нас на глазах»
  choice: Связать с публичным обнаружением Божьего возмездия
  alternative: Связать непосредственно с самой местью
  rationale: Порядок слов допускает некоторую гибкость; выбранный вариант ясно выражает просьбу псалмопевцев самим увидеть воздаяние среди народов.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью. «Слуги» доступнее и естественнее, чем «рабы», при этом не вводит конфессионально маркированной формулы. Местоимения обращения к Богу написаны с прописной буквы согласно традиционному русскому библейскому регистру.
