  source_fidelity: Вторая половина черновика («станет известно, что Ты отомстил») неоправданно превращает еврейскую именную конструкцию נִקְמַת דַּם ... в сообщение о уже совершённом Божьем действии. В тексте стоит просьба о том, чтобы среди народов стало явным возмездие за пролитую кровь слуг Божьих; время совершения возмездия не уточняется. Нифаль יִוָּדַע естественно передаётся безлично-пассивной конструкцией «станет известно».
  naturalness: «Зачем народам говорить?» — естественная современная литературная передача риторического вопроса, точнее передающая протестный оттенок, чем нейтральное настоящее «Почему народы говорят?». «Возмездие за пролитую кровь Твоих слуг» литературно и ясно; порядок обстоятельств сохраняет молитвенную торжественность без архаизации.
  terminology: «Народы» верно передаёт הַגּוֹיִם. «Бог» с прописной буквы, «слуги» для עֲבָדֶיךָ и «пролитая кровь» для דַּם ... הַשָּׁפוּךְ уместны. «Возмездие» передаёт נִקְמַת, не смягчая судебно-карательного смысла и не навязывая уточнения о способе либо моменте действия Бога.
