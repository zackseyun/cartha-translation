  text: Мы стали поношением для наших соседей, посмешищем и предметом глумления для тех, кто нас окружает.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִינוּ
  choice: Мы стали
  rationale: Перфект Qal 1-го лица множественного числа обозначает наступившее вследствие прежних событий состояние; «стали» естественно передаёт переход к нынешнему положению.
- source_word: חֶרְפָּה
  choice: посмешищем
  rationale: Существительное обозначает публичный позор и того, кто подвергается презрению; в русском контексте «стали посмешищем» точно и естественно выражает этот смысл.
- source_word: לִשְׁכֵנֵינוּ
  choice: для наших соседей
  rationale: Предлог ל указывает на тех, по отношению к кому Израиль сделался предметом позора; «для наших соседей» сохраняет эту связь и звучит по-русски естественно.
- source_word: לַעַג
  choice: предметом насмешек
  rationale: Слово обозначает насмешку, издевательское осмеяние; такая передача сохраняет именную конструкцию и ясно показывает, что народ стал объектом насмешек.
- source_word: קֶלֶס
  choice: глумления
  rationale: Слово близко к לַעַג, но усиливает картину унижения; «глумление» сохраняет поэтическое накопление близких, но не тождественных понятий.
- source_word: לִסְבִיבוֹתֵינוּ
  choice: для всех, кто вокруг нас
  rationale: Буквально выражение указывает на окружающих; добавление «всех» естественно передаёт собирательный охват формы и отличает эту группу от ближайших соседей в первой строке.
