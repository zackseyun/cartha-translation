  text: מִזְמ֗וֹר לְ/אָ֫סָ֥ף אֱֽלֹהִ֡ים בָּ֤אוּ גוֹיִ֨ם בְּֽ/נַחֲלָתֶ֗/ךָ טִ֭מְּאוּ אֶת הֵיכַ֣ל קָדְשֶׁ֑/ךָ שָׂ֖מוּ אֶת יְרוּשָׁלִַ֣ם לְ/עִיִּֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/001.yaml
  text: A psalm of Asaph. O God[a], the nations have come into your inheritance; they have defiled your holy temple; they have made Jerusalem a heap of ruins.
translation:
  language: ru
  text: Псалом Асафа. Боже, народы вошли в Твоё наследие, осквернили Твой святой храм, превратили Иерусалим в груды развалин.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «превратили Иерусалим в развалины».'
    reason: Лексема עִיִּים может обозначать как груды или кучи развалин, так и развалины в более общем смысле.
lexical_decisions:
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Обычное и точное русское обозначение жанра в надписаниях псалмов.
- source_word: לְאָסָף
  choice: Асафа
  rationale: Родительный падеж естественно передаёт связь псалма с Асафом, не уточняя, идёт ли речь об авторстве, принадлежности или предназначении.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Русская звательная форма естественно передаёт прямое обращение.
- source_word: בָּאוּ גוֹיִם
  choice: народы вторглись
  rationale: Буквально глагол означает «пришли/вошли», но контекст вражеского разорения делает «вторглись» естественным и точным по смыслу; «народы» сохраняет широкое значение גוים.
- source_word: בְּנַחֲלָתֶךָ
  choice: в Твоё наследие
  rationale: Сохраняет заветный оттенок и намеренно не сужает значение до одной лишь земли или народа.
- source_word: טִמְּאוּ
  choice: осквернили
  rationale: Передаёт культовый смысл нечистоты и святотатственного поругания.
- source_word: הֵיכַל קָדְשֶׁךָ
  choice: Твой святой храм
  rationale: Естественное русское соответствие конструкции «храм Твоей святости».
- source_word: שָׂמוּ אֶת יְרוּשָׁלִַם לְעִיִּים
  choice: превратили Иерусалим в груды развалин
  rationale: Результативная конструкция с שׂים и ל передана глаголом «превратили»; множественное עִיִּים отражено как «груды развалин».
theological_decisions:
- issue: Заветный смысл выражения «Твоё наследие»
  choice: Сохранить «Твоё наследие» без уточнения объекта
  alternative: Твоя земля / Твой народ
  rationale: Еврейский текст допускает широкое понимание Божьего достояния, прежде всего земли и связанного с ней народа; конкретизация необоснованно сузила бы смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного плача. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции. Маркер сноски поставлен непосредственно после относящегося к нему выражения.
