  text: תָּ֤ב֣וֹא לְ/פָנֶי/ךָ֮ אֶנְקַ֪ת אָ֫סִ֥יר כְּ/גֹ֥דֶל זְרוֹעֲ/ךָ֑ ה֝וֹתֵ֗ר בְּנֵ֣י תְמוּתָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/079/011.yaml
  text: Let the groaning of the prisoner come before you; according to the greatness of your arm[a], preserve the children of death.
translation:
  language: ru
  text: Да предстанет пред Тобой стон узника; по великой силе Твоей руки сохрани обречённых на смерть[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов смерти» — то есть тех, кому грозит смерть или кто обречён умереть.'
    reason: Сохраняет буквальный еврейский образ и поясняет его идиоматический смысл.
lexical_decisions:
- source_word: תָּבוֹא לְפָנֶיךָ
  choice: Да предстанет пред Тобой
  rationale: Имперфект в молитвенном контексте передан как пожелание-просьба. «Предстанет пред Тобой» естественно и достойно выражает буквальное «войдёт перед Твоё лицо / придёт пред Тебя».
- source_word: אֶנְקַת אָסִיר
  choice: стон узника
  rationale: אֶנְקָה обозначает стон или тяжкий вздох, а אָסִיר — заключённого, пленника или связанного человека. «Узник» сохраняет широту образа и поэтический регистр.
- source_word: כְּגֹדֶל זְרוֹעֲךָ
  choice: по величию силы Твоей
  rationale: Предлог כ выражает меру или соответствие. Буквальное «по величию руки Твоей» в русском может восприниматься как указание на физический размер; «силы Твоей» передаёт прозрачную метафору זְרוֹעַ в данном контексте.
- source_word: הוֹתֵר
  choice: сохрани
  rationale: Повелительная форма породы хифиль от יתר означает просьбу оставить в живых, дать уцелеть. «Сохрани» естественно передаёт избавление от грозящей смерти.
- source_word: בְּנֵי תְמוּתָה
  choice: обречённых на смерть
  rationale: Буквально «сынов смерти» — еврейское выражение о людях, которым грозит смерть или которые предназначены умереть. Идиоматический перевод понятен современному читателю, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Степень предопределённости в выражении בְּנֵי תְמוּתָה
  choice: обречённых на смерть
  alternative: приговорённых к смерти; тех, кому суждено умереть
  rationale: Еврейское выражение само по себе не уточняет, кем или каким образом определена смерть. «Обречённых» сохраняет угрозу неминуемой смерти, не вводя судебного приговора или учения о предопределении.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенно-поэтическим строем. Заглавные местоимения обращения к Богу соответствуют принятой русской библейской традиции; архаические формы и неясные кальки избегаются.
