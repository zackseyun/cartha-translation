lexical_decisions:
- source_word: וְהָשֵׁב
  choice: И воздай
  rationale: Hiphil от שוב здесь означает обратить содеянное обратно на виновных, то есть «воздать»; этот выбор естественен для молитвенно-поэтического контекста и сохраняет прямоту просьбы.
- source_word: לִשְׁכֵנֵינוּ
  choice: соседям нашим
  rationale: שָׁכֵן буквально обозначает соседа, живущего рядом. В контексте речь, вероятно, об окрестных народах, но перевод не вводит это уточнение в основной текст.
- source_word: שִׁבְעָתַיִם
  choice: семикратно
  rationale: Форма означает «семь раз, всемеро» и выражает полноту либо усиленную меру воздаяния; «семикратно» кратко и соответствует высокому поэтическому регистру.
- source_word: אֶל חֵיקָם
  choice: в лоно их
  rationale: חֵיק обозначает лоно, пазуху или колени; образ говорит о возвращении человеку содеянного им. «В лоно их» сохраняет телесную метафору древнееврейского текста.
- source_word: חֶרְפָּתָם אֲשֶׁר חֵרְפוּךָ
  choice: за поношение, которым они поносили Тебя
  rationale: Однокоренные «поношение» и «поносили» передают намеренный повтор существительного חֶרְפָּה и глагола חרף. Предлог «за» естественно выражает основание воздаяния, тогда как образ направления уже сохранён словами «в лоно их».
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Вокативная форма «Господи» естественно передаёт прямое обращение אֲדֹנָי в русской молитвенной речи.
theological_decisions:
- issue: Просьба о семикратном воздаянии
  choice: Сохранена прямая просьба к Богу воздать врагам семикратно.
  alternative: Смягчить её до общей просьбы восстановить справедливость.
  rationale: Древнееврейский текст представляет напряжённую импрекаторную молитву. Перевод не должен устранять её силу или заранее разрешать богословское напряжение.
- issue: Кому направлено поношение
  choice: 'Сохранено прямое указание: они поносили Бога.'
  alternative: Понять выражение как поношение народа, косвенно задевающее Бога.
  rationale: Местоименный суффикс второго лица в חֵרְפוּךָ грамматически относится непосредственно к Богу, к которому обращена молитва.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой молитвы. Инверсия «соседям нашим» и выражение «в лоно их» слегка возвышенны, но ясны; тире выделяют древнееврейский образ и делают синтаксис читаемым. Маркер сноски поставлен в основном тексте.
