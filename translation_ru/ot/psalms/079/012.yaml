revisions:
- from: И воздай соседям нашим семикратно — в лоно их — за поношение, которым они поносили Тебя, Господи.[a]
  to: Воздай нашим соседям всемеро, обратив против них самих поношение, которым они поносили Тебя, Господи.[a]
  rationale: Правка сохраняет императивную просьбу, семикратную меру, «соседей», однокоренные «поношение / поносили» и прямое обращение к Богу. Она также передаёт еврейский образ возмездия, возвращающегося на виновных, без неестественного для современного русского оборота «в лоно их». Буквальный образ и формальное «их поношение» сохранены в сноске.
