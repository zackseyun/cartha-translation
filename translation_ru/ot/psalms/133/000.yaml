lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождения
  rationale: Традиционно и достаточно буквально передаёт заголовок; множественное число в еврейском выражении допускает понимание восхождений или ступеней, что отмечено в сноске.
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Естественная русская форма заголовка сохраняет широкий смысл еврейского לְ: принадлежность Давиду, авторство или связь с ним.'
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-восклицательную функцию частицы и сохраняет выразительность строки.
- source_word: אַחִים
  choice: братья
  rationale: Прямой эквивалент; в контексте может обозначать как родных братьев, так и более широкую общину соплеменников или участников завета.
- source_word: שֶׁבֶת ... גַּם יָחַד
  choice: когда братья живут вместе
  rationale: Инфинитив שֶׁבֶת естественно передан придаточным времени, а גַּם יָחַד — словом «вместе»; возможный усилительный оттенок גַּם пояснён в сноске без добавления толкования «в единстве» в основной текст.
theological_decisions:
- issue: Объём значения אַחִים
  choice: Сохранено буквальное «братья»
  alternative: «родные» или «единоверцы»
  rationale: Еврейское слово допускает буквальное и общинное понимание; основной текст не сужает эту намеренную широту.
- issue: Характер совместной жизни в גַּם יָחַד
  choice: «живут вместе»
  alternative: «живут в единстве»
  rationale: «Вместе» непосредственно отражает יָחַד и не вводит более узкое богословско-нравственное толкование, хотя контекст явно положительно оценивает такое совместное пребывание.
