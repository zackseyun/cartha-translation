  text: כְּ/טַל חֶרְמ֗וֹן שֶׁ/יֹּרֵד֮ עַל הַרְרֵ֪י צִ֫יּ֥וֹן כִּ֤י שָׁ֨ם צִוָּ֣ה יְ֭הוָה אֶת הַ/בְּרָכָ֑ה חַ֝יִּ֗ים עַד הָ/עוֹלָֽם־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/003.yaml
  text: like the dew of Hermon[a], which falls on the mountains of Zion. For there Yahweh commanded the blessing[b], life forever.
translation:
  language: ru
  text: словно роса Ермона, сходящая на горы Сиона. Ведь там Яхве заповедал благословение — жизнь навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/טַל
  choice: словно роса
  rationale: Префикс כְּ выражает сравнение, а טַל означает «роса». «Словно роса» естественно передаёт поэтическое сравнение по-русски.
- source_word: חֶרְמוֹן
  choice: Ермона
  rationale: Название горы передано принятой русской библейской формой; родительный падеж обусловлен сочетанием «роса Ермона».
- source_word: שֶׁ/יֹּרֵד
  choice: сходящая
  rationale: Причастная форма сохраняет значение ירד — движения сверху вниз — и естественно согласуется со словом «роса».
- source_word: עַל הַרְרֵי צִיּוֹן
  choice: на горы Сиона
  rationale: Сохранены предлог עַל и множественное число הַרְרֵי; «горы Сиона» точнее формы оригинала, чем сглаживание до единственного числа.
- source_word: כִּי שָׁם
  choice: Ведь там
  rationale: כִּי вводит основание предшествующего утверждения, а שָׁם оставлено неопределённым «там», без поясняющего толкования.
- source_word: צִוָּה
  choice: заповедал
  rationale: Глагол означает властно повелеть или установить. «Заповедал» сохраняет силу исходного глагола и возвышенный поэтический регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом «Господь».
- source_word: אֶת הַ/בְּרָכָה
  choice: благословение
  rationale: Определённое прямое дополнение передано без добавочного истолкования; определённость в русском контексте выражается самим контекстом.
- source_word: חַיִּים עַד הָ/עוֹלָם
  choice: жизнь навеки
  rationale: Краткая формула сохраняет значение непрекращающейся жизни и естественно звучит в современной литературной русской речи.
theological_decisions:
- issue: Связь заключительной фразы с «благословением»
  choice: «жизнь навеки» оформлена как приложение, раскрывающее содержание благословения
  alternative: Понимать её как отдельное предложение или восклицание
  rationale: Последовательность «благословение, жизнь навеки» естественно допускает приложение. Тире ясно передаёт эту связь по-русски, не разворачивая её в дополнительное богословское утверждение.
- issue: Референт слова «там»
  choice: Сохранено неопределённое «там»
  alternative: 'Уточнить в основном тексте: «на Сионе» или «среди живущих в единстве братьев»'
  rationale: В еврейском тексте стоит только שָׁם. Уточнение устранило бы поэтическую многозначность и внесло бы толкование в перевод.
translation_notes:
  register: Современный литературный русский с достоинством древнееврейской поэзии. Синтаксис краткий и певучий; архаизмы сведены к минимуму. Перевод начинается со строчной буквы, поскольку стих продолжает сравнение из предыдущего стиха.
