  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד הִנֵּ֣ה מַה טּ֭וֹב וּ/מַה נָּעִ֑ים שֶׁ֖בֶת אַחִ֣ים גַּם יָֽחַד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/001.yaml
  text: A Song of Ascents[a]. Of David. Behold[c][b], how good and how pleasant it is when brothers dwell together!
translation:
  language: ru
  text: 'Песнь восхождений[a]. Давида[b].

    Вот, как хорошо и как приятно братьям[c] жить вместе[d]!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также: «Песнь подъёмов». Возможно, речь идёт о паломнических восхождениях в Иерусалим, однако само надписание этого не уточняет.'
    reason: lexical_alternative
  - marker: b
    text: Надписание может означать, что псалом написан Давидом, посвящён ему или связан с ним.
    reason: source_ambiguity
  - marker: c
    text: «Братья» могут означать как родных братьев, так и, шире, соплеменников или членов общины.
    reason: lexical_alternative
  - marker: d
    text: 'Еврейское выражение усилено частицей и подчёркивает совместность: «действительно вместе»; по смыслу возможно также «в единстве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Традиционное надписание псалмов 120–134. «Восхождений» достаточно формально передаёт מַעֲלוֹת и не уточняет предположительный исторический контекст паломничества.
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая традиционная формула сохраняет возможные значения еврейского לְ: авторство, принадлежность, связь или посвящение Давиду.'
- source_word: הִנֵּה
  choice: Вот
  rationale: «Вот» естественно привлекает внимание и передаёт восхищённый поэтический тон הִנֵּה без архаичного «се».
- source_word: מַה טּוֹב וּמַה נָּעִים
  choice: как хорошо и как приятно
  rationale: Повторное מַה образует два параллельных восклицания; повтор «как» сохраняет структуру и выразительность оригинала.
- source_word: שֶׁבֶת
  choice: жить
  rationale: Инфинитив от ישׁב обозначает пребывание или совместное проживание. Русское «жить» здесь естественнее буквального «сидеть» и сохраняет длительный характер действия.
- source_word: אַחִים
  choice: братьям
  rationale: Существительное имеет форму мужского множественного числа и может обозначать как родных братьев, так и более широкий круг соплеменников или членов общины; основной текст сохраняет прямое значение.
- source_word: גַּם יָחַד
  choice: вместе
  rationale: יַחַד прямо означает «вместе», а גַּם усиливает выражение. В русском контексте «жить вместе» звучит естественно; усилительная особенность отмечена в сноске, без добавления толкования «в единстве» в основной текст.
theological_decisions:
- issue: Объём значения אַחִים
  choice: Сохранить «братьям» в основном тексте
  alternative: «родным», «сородичам» или «членам общины»
  rationale: Еврейское слово допускает буквальное и расширенное общинное понимание. Перевод не сужает его до кровного родства и не заменяет конкретный образ обобщающим выражением.
- issue: Смысл גַּם יָחַד
  choice: «вместе» с пояснением усиления в сноске
  alternative: «в единстве»
  rationale: «Вместе» точнее соответствует יַחַד и сохраняет возможность понимать строку как совместное проживание; «в единстве» сильнее подчёркивало бы гармонию, которая вероятна в контексте, но не выражена отдельным существительным.
translation_notes:
  register: Современный литературный русский с достоинством поэтического восклицания. «Вот» предпочтено архаичному «се», а «жить вместе» — буквальному и неестественному здесь «сидеть вместе». Повтор «как» сохраняет параллелизм еврейской строки.
