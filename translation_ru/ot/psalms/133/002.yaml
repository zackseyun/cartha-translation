    reason: lexical_alternative
lexical_decisions:
- source_word: כַּשֶּׁמֶן הַטּוֹב
  choice: как доброе масло
  rationale: Префикс כְּ вводит сравнение, а טוֹב буквально означает «добрый, хороший». Сочетание «доброе масло» сохраняет прямой смысл еврейского текста и звучит естественно в поэтическом контексте.
- source_word: יֹרֵד / שֶׁיֹּרֵד
  choice: стекающее / что стекает
  rationale: Форма от ירד обозначает движение вниз. Применительно к маслу глагол «стекать» естественно передаёт образ; повтор сохранён вслед за еврейским стихом.
- source_word: הַזָּקָן זְקַן אַהֲרֹן
  choice: на бороду, на бороду Аарона
  rationale: Повтор слова «борода» воспроизводит поэтическое усиление оригинала.
- source_word: פִּי מִדּוֹתָיו
  choice: к вороту его одежд
  rationale: פֶּה буквально значит «рот», но применительно к одежде обозначает её отверстие или край; здесь естественнее всего «ворот». מִדּוֹתָיו в данном контексте относится к одеждам Аарона.
theological_decisions:
- issue: Смысл образа масла
  choice: Сохранён поэтический образ обильного масла, связанного с Аароном, без внесения в основной текст явного богословского толкования.
  alternative: Прямо назвать масло священным маслом помазания.
  rationale: Стих вызывает ассоциацию с помазанием Аарона, однако сам еврейский текст не объясняет символ и не добавляет к слову «масло» определения «священное» или «для помазания».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксический повтор глагола и слова «борода» сохранён как значимая особенность еврейского параллелизма.
