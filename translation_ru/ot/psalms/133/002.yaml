base_translation:
  language: en
  yaml_path: translation/ot/psalms/133/002.yaml
  text: It is like the good oil on the head[a], running down on the beard, on Aaron’s beard[b], which runs down on the collar of his robes.
translation:
  language: ru
  text: Это — как доброе масло[a] на голове, стекающее на бороду, на бороду Аарона, спускающуюся до ворота его одежд[b].
  philosophy: optimal-equivalence
  footnotes:
