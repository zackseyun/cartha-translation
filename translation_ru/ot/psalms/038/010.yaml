lexical_decisions:
- source_word: לִבִּי
  choice: сердце моё
  rationale: В контексте телесного страдания לֵב обозначает сердце как средоточие жизни и физических ощущений; буквальный образ естественен и по-русски.
- source_word: סְחַרְחַר
  choice: трепещет
  rationale: Слово передаёт беспокойное, нарушенное движение; здесь, рядом с утратой сил и света в глазах, оно, вероятнее всего, описывает учащённое или неровное биение сердца. «Трепещет» сохраняет образ, не сводя его к точному медицинскому диагнозу.
- source_word: עֲזָבַנִי כֹחִי
  choice: силы покинули меня
  rationale: Оборот буквально говорит, что сила оставила говорящего. Русское множественное «силы» идиоматично выражает утрату телесной крепости, сохраняя образ исходного текста.
- source_word: וְאוֹר עֵינַי
  choice: света в глазах
  rationale: Выражение может означать как способность видеть, так и блеск, свидетельствующий о жизненной силе. Русский образ «свет в глазах» позволяет сохранить обе возможности.
- source_word: גַּם הֵם אֵין אִתִּי
  choice: даже света в глазах у меня не стало
  rationale: Частица גַּם передана словом «даже», а отсутствие — естественным русским оборотом «не стало». Формально множественное הֵם связано с «глазами», но буквальное воспроизведение местоимения по-русски создало бы впечатление, будто у говорящего нет самих глаз; смысловой центр выражения — исчезнувший свет.
