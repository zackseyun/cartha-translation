  text: כִּֽי אָ֭מַרְתִּי פֶּן יִשְׂמְחוּ לִ֑/י בְּ/מ֥וֹט רַ֝גְלִ֗/י עָלַ֥/י הִגְדִּֽילוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/016.yaml
  text: For I said, “Otherwise they would rejoice over me; when my foot slips, they boast against me.”
translation:
  language: ru
  text: 'Ибо я сказал: «Как бы они не возрадовались надо мной; когда поскользнётся моя нога, они станут превозноситься надо мной».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: иначе
  rationale: В данном контексте вводит опасение о возможном исходе; естественно передаёт значение «как бы не / чтобы не», не превращая его в утверждение о уже случившемся.
- source_word: יִשְׂמְחוּ לִי
  choice: обрадуются моему несчастью
  rationale: Буквально «обрадуются обо мне/из-за меня»; добавление «моему несчастью» ясно выражает подразумеваемый неблагоприятный для говорящего повод радости.
- source_word: בְּמוֹט רַגְלִי
  choice: когда дрогнет моя нога
  rationale: Сохраняет телесную метафору неустойчивости и возможного падения; «дрогнет» звучит естественно и не утверждает полного падения.
- source_word: עָלַי הִגְדִּילוּ
  choice: станут превозноситься надо мной
  rationale: Конструкция буквально говорит, что противники «возвеличиваются» над говорящим; выбор сохраняет образ самовозвышения и допускает оттенок хвастовства.
theological_decisions:
- issue: Временная и модальная сила несовершенных форм после פֶּן
  choice: 'передать как возможный будущий исход: «обрадуются… станут превозноситься»'
  alternative: 'настоящее или привычное действие: «радуются… превозносятся»'
  rationale: Частица опасения פֶּן и контекст речи лучше поддерживают нежелательную возможность, а не констатацию уже происходящего.
translation_notes:
  register: Современный литературный русский язык; сохранены параллелизм и образ ноги, но эллиптическое «обрадуются обо мне» раскрыто ради ясности. Тон молитвенный и достойный, без архаизации.
