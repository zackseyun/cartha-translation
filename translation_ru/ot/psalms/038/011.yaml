- source_word: אֹהֲבַי
  choice: любящие меня
  rationale: Причастная форма с суффиксом первого лица обозначает тех, кто любит псалмопевца. Такой перевод точен, естественен и не придаёт выражению исключительно романтического смысла.
- source_word: וְרֵעַי
  choice: и мои друзья
  rationale: רֵעַ обозначает друга, товарища или близкого спутника; «друзья» ясно передаёт личные отношения и соответствует параллелизму.
- source_word: מִנֶּגֶד
  choice: в стороне от
  rationale: Предлог с существительным נֶגֶד создаёт пространственный образ положения напротив или на некотором удалении. В данном контексте «в стороне от» естественно передаёт дистанцирование, не превращая его явно в враждебность.
- source_word: נִגְעִי
  choice: моего недуга
  rationale: נֶגַע может означать удар, поражение, язву, рану или телесный недуг. «Недуг» сохраняет телесный контекст псалма, не сужая значение до конкретной болезни или раны.
- source_word: יַעֲמֹדוּ
  choice: стоят
  rationale: Глагол עמד описывает занятую или сохраняемую позицию; настоящее время передаёт продолжающуюся сцену.
- source_word: וּקְרוֹבַי
  choice: а мои близкие
  rationale: קָרוֹב может обозначать близких людей, в том числе родственников. «Близкие» сохраняет допустимую широту значения и хорошо соответствует поэтическому параллелизму.
- source_word: מֵרָחֹק
  choice: вдали
  rationale: Выражение прямо обозначает пространственную удалённость; «вдали» кратко и естественно передаёт этот образ.
- source_word: עָמָדוּ
  choice: стоят
  rationale: Хотя форма совершенного вида может быть передана прошедшим временем, параллелизм с первой строкой и изображение продолжающегося положения позволяют употребить настоящее время.
