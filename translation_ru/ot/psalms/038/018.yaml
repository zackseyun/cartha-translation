  text: כִּֽי עֲוֺנִ֥/י אַגִּ֑יד אֶ֝דְאַ֗ג מֵֽ/חַטָּאתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/018.yaml
  text: For I confess my iniquity[b][a]; I am anxious because of my sin.
translation:
  language: ru
  text: Ибо я признаю своё беззаконие[a] и тревожусь из-за своего греха[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «объявляю о своём беззаконии». Еврейский глагол буквально означает «сообщать», «объявлять» или «делать известным»; перевод «признаю» учитывает покаянный контекст.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «скорблю о своём грехе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение или основание сказанного прежде; «ибо» сохраняет эту связь и соответствует возвышенному, но понятному стилю псалма.
- source_word: עֲוֺנִי
  choice: своё беззаконие
  rationale: עָוֹן может обозначать как неправедный поступок, так и связанную с ним вину. «Беззаконие» сохраняет нравственную весомость слова, не устраняя эту смысловую глубину.
- source_word: אַגִּיד
  choice: я признаю
  rationale: Форма глагола נגד буквально означает «сообщать, объявлять, делать известным». В покаянном контексте «признаю» естественно передаёт открытое признание собственного беззакония, а буквальная альтернатива отмечена в сноске.
- source_word: אֶדְאַג
  choice: тревожусь
  rationale: דאג выражает беспокойство, внутреннюю тревогу или тягостную озабоченность. «Тревожусь» ясно и естественно передаёт это состояние.
- source_word: מֵחַטָּאתִי
  choice: из-за своего греха
  rationale: Предлог מִן здесь указывает на причину или повод тревоги; «из-за» непосредственно выражает причинную связь.
- source_word: חַטָּאתִי
  choice: своего греха
  rationale: חַטָּאת — обычное обозначение греха; «грех» является прямым и прозрачным соответствием.
theological_decisions:
- issue: Соотношение открытого признания беззакония и внутренней тревоги в покаянном псалме
  choice: Стих передан как личное признание беззакония и тревога из-за греха без добавления развёрнутого учения о покаянии.
  alternative: Можно передать אַגִּיד более буквально как «объявляю» или «рассказываю», ослабив явный оттенок исповедания.
  rationale: Еврейский текст говорит, что псалмопевец делает своё беззаконие известным и тревожится из-за своего греха. «Признаю» учитывает покаянный контекст, но не добавляет выводов, которых сам стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Ибо» сохраняет логическую связь, «признаю» звучит естественно в покаянном контексте, а возвратное притяжательное местоимение «свой» соответствует русской норме при одном субъекте.
