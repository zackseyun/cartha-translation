  text: אֲֽדֹנָ/י נֶגְדְּ/ךָ֥ כָל תַּאֲוָתִ֑/י וְ֝/אַנְחָתִ֗/י מִמְּ/ךָ֥ לֹא נִסְתָּֽרָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/009.yaml
  text: Lord[a], all my desire is before you[b], and my groaning is not hidden from you.
translation:
  language: ru
  text: Господи, пред Тобой — всё, чего я желаю[a], и мой стон[b] от Тебя не скрыт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё моё томление».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мой вздох».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָי
  choice: Господи
  rationale: Форма обращения передаёт божественный титул אֲדֹנָי естественным для русского языка звательным оборотом и не смешивает его с тетраграмматоном יהוה.
- source_word: נֶגְדְּךָ
  choice: пред Тобой
  rationale: Передаёт нахождение в присутствии и на виду у Бога; оборот естественен для возвышенной поэтической речи.
- source_word: כָל תַּאֲוָתִי
  choice: всё, чего я желаю
  rationale: Сохраняет полноту, выраженную כָל, и единственное число собирательного понятия, избегая неестественного русского сочетания «всё моё желание».
- source_word: וְאַנְחָתִי
  choice: и мой стон
  rationale: Передаёт выражение глубокого страдания в контексте плача; возможное значение «вздох» отмечено в сноске.
- source_word: מִמְּךָ לֹא נִסְתָּרָה
  choice: от Тебя не скрыт
  rationale: Точно воспроизводит пассивное состояние и обозначает Бога как Того, от Кого стон не может быть сокрыт.
theological_decisions:
- issue: Обращение אֲדֹנָי, а не божественное имя יהוה
  choice: Господи
  alternative: ГОСПОДИ
  rationale: В исходном тексте стоит титул אֲדֹנָי, поэтому перевод не использует оформление, которым может обозначаться тетраграмматон. Русская форма «Господи» естественно передаёт прямое обращение.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Инверсия «пред Тобой» сохраняет акцент на полной открытости перед Богом; прописная буква в местоимении следует принятому благоговейному регистру.
