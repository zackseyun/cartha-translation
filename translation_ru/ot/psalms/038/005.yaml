  text: My wounds stink and fester because of my foolishness[a].
translation:
  language: ru
  text: Мои раны смердят и гниют из-за моего безрассудства.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мои раны стали зловонными и разлагаются из-за моей глупости».'
    reason: Лексические варианты для הִבְאִישׁוּ, נָמַקּוּ и אִוַּלְתִּי.
lexical_decisions:
- source_word: הִבְאִישׁוּ
  choice: смердят
  rationale: Глагол передаёт отвратительный запах; «смердят» сохраняет резкую телесную образность еврейского текста и уместно в возвышенной поэтической речи.
- source_word: נָמַקּוּ
  choice: гноятся
  rationale: Глагол означает разлагаться, истлевать или чахнуть. В сочетании с ранами «гноятся» естественно передаёт болезненное разложение, хотя буквальное «разлагаются» также возможно.
- source_word: חַבּוּרֹתָי
  choice: мои раны
  rationale: Существительное может обозначать раны, ушибы или рубцы от ударов. Контекст зловония и разложения делает «раны» наиболее естественным соответствием.
- source_word: מִפְּנֵי
  choice: из-за
  rationale: Предлог здесь выражает причину; «из-за» ясно и естественно передаёт причинную связь.
- source_word: אִוַּלְתִּי
  choice: моего безрассудства
  rationale: Слово обозначает глупость или безрассудство с нравственным оттенком. «Безрассудство» звучит естественно и сохраняет самообвинение псалмопевца, не сужая смысл до незнания.
theological_decisions:
- issue: Причинная связь между страданием и безрассудством псалмопевца
  choice: из-за моего безрассудства
  alternative: по причине моей глупости
  rationale: Текст прямо связывает состояние псалмопевца с его собственным безрассудством. Перевод сохраняет эту связь, не превращая её в общее утверждение о причине всякого страдания.
translation_notes:
  register: Современный литературный русский с сохранением резкой телесной образности и достоинства библейской поэзии. Союз «и» естественно объединяет два параллельных еврейских глагола.
