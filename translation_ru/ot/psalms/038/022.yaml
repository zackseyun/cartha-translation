  text: Поспеши мне на помощь, Господь, спасение моё.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּשָׁה
  choice: Поспеши
  rationale: Повелительная форма глагола חושׁ выражает настоятельную просьбу действовать без промедления. «Поспеши» естественно и достойно передаёт эту срочность.
- source_word: לְעֶזְרָתִי
  choice: мне на помощь
  rationale: 'Буквально: «к моей помощи / на помощь мне». Русское выражение «поспеши мне на помощь» точно и естественно передаёт смысл.'
- source_word: אֲדֹנָי
  choice: Господь
  rationale: Стандартный божественный титул אֲדֹנָי передан традиционным русским соответствием «Господь».
- source_word: תְּשׁוּעָתִי
  choice: спасение моё
  rationale: Существительное תְּשׁוּעָה обозначает спасение или избавление. «Спасение моё» сохраняет именную метафору и широкий богословский смысл исходного текста.
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Господь
  alternative: мой Господь
  rationale: В данном употреблении אֲדֹנָי функционирует как устойчивый божественный титул; поэтому притяжательное значение отдельно не подчёркивается.
- issue: Передача תְּשׁוּעָתִי
  choice: спасение моё
  alternative: избавление моё
  rationale: Выбрано более широкое «спасение», при этом сохранена грамматическая и поэтическая напряжённость обращения к Богу как к самому спасению молящегося.
translation_notes:
  register: Современный литературный русский язык с лаконичным, молитвенным и поэтически возвышенным звучанием. Порядок слов «спасение моё» сохраняет достоинство псалмового обращения без архаической перегруженности.
