  language: ru
  text: Но я, как глухой, не слышу; я — как немой, который не открывает рта.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте после первого лица («я… не слышу») следует глагол в третьем лице: буквально «как немой — он не открывает своего рта». Вероятно, это продолжает сравнение с немым. По смыслу возможно также: «и, как немой, я не открываю рта».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Но я
  rationale: Сочетание союза с личным местоимением противопоставляет поведение псалмопевца словам его противников в контексте; «Но я» естественно передаёт этот оттенок.
- source_word: כְחֵרֵשׁ
  choice: как глухой
  rationale: Предлог כְּ выражает сравнение, а חֵרֵשׁ обозначает глухого человека; краткая форма сохраняет образ и параллелизм.
- source_word: לֹא אֶשְׁמָע
  choice: не слышу
  rationale: Глагол שׁמע здесь передан в своём основном значении «слышать»; выражение сохраняет телесный образ, одновременно допуская смысл сознательного отсутствия ответа.
- source_word: וּכְאִלֵּם
  choice: и как немой
  rationale: אִלֵּם обозначает немого человека и образует точную параллель к «глухому».
- source_word: לֹא יִפְתַּח פִּיו
  choice: он не открывает рта
  rationale: В еврейском тексте употреблено третье лицо и буквально сказано «не откроет своего рта». Русское выражение «не открывает рта» сохраняет идиому и необычный переход к третьему лицу.
