  yaml_path: translation/ot/psalms/038/008.yaml
  text: I am faint and utterly crushed; I roar because of the groaning of my heart.
translation:
  language: ru
  text: Я изнемог и совершенно сокрушён; я реву от стонов моего сердца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְפוּגוֹתִי
  choice: Я изнемог
  rationale: Форма от פוג передаёт утрату сил, ослабление; «изнемог» естественно и точно выражает крайнюю немощь.
- source_word: וְנִדְכֵּיתִי עַד מְאֹד
  choice: и совершенно сокрушён
  rationale: Страдательная форма דכא указывает на состояние подавленности или сокрушённости, а עַד מְאֹד усиливает его до крайней степени.
- source_word: שָׁאַגְתִּי
  choice: я реву
  rationale: Глагол обычно обозначает громкий рёв; выбор сохраняет силу и почти животный характер крика, не ослабляя его до обычного стона.
- source_word: מִנַּהֲמַת לִבִּי
  choice: от стонов моего сердца
  rationale: נַהֲמָה обозначает глухое стонание или внутренний гул; сочетание с «сердцем» передаёт внутреннюю муку, прорывающуюся наружу.
theological_decisions:
- issue: Связь внешнего крика с внутренним страданием
  choice: «я реву от стонов моего сердца»
  alternative: «я стону из-за смятения в сердце»
  rationale: Выбранный вариант сохраняет различие между сильным внешним «рёвом» (שׁאג) и внутренними «стонами» (נהמה), не сводя оба образа к одному действию и не конкретизируя неоднозначную природу сердечной муки.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Сохранены интенсивность стиха и телесно-звуковая образность еврейского текста; инверсия «сердца моего» не использована ради естественного современного звучания.
