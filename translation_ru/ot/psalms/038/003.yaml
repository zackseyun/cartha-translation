  text: אֵין מְתֹ֣ם בִּ֭/בְשָׂרִ/י מִ/פְּנֵ֣י זַעְמֶ֑/ךָ אֵין שָׁל֥וֹם בַּ֝/עֲצָמַ֗/י מִ/פְּנֵ֥י חַטָּאתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/003.yaml
  text: There is no soundness in my flesh because of your indignation[b][a]; there is no peace in my bones because of my sin.
translation:
  language: ru
  text: В моей плоти нет ничего здорового из-за Твоего негодования[a]; нет покоя[b] в моих костях из-за моего греха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гнева».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благополучия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְתֹם
  choice: ничего здорового
  rationale: Существительное обозначает целость, неповреждённость, здоровое состояние. Отрицательная конструкция «нет ничего здорового» естественно передаёт телесное страдание, не сводя образ к узкому медицинскому диагнозу.
- source_word: בִּבְשָׂרִי
  choice: в моей плоти
  rationale: Сохранён конкретный поэтический образ «плоти»; слово «тело» было бы естественнее в разговорной речи, но ослабило бы образность оригинала.
- source_word: מִפְּנֵי
  choice: из-за
  rationale: В обеих частях стиха предлог выражает причину; «из-за» ясно и естественно передаёт эту связь.
- source_word: זַעְמֶךָ
  choice: Твоего негодования
  rationale: Слово обозначает сильный гнев, возмущение или негодование. «Негодование» передаёт тяжесть Божьего недовольства, а вариант «гнев» сохранён в сноске.
- source_word: שָׁלוֹם
  choice: покоя
  rationale: В данном телесном контексте слово может означать покой, благополучие или целостность. «Покой» естественно сочетается с образом костей и сохраняет многозначность без чрезмерного уточнения.
- source_word: בַּעֲצָמַי
  choice: в моих костях
  rationale: Буквальный образ костей передаёт глубокое физическое и внутреннее страдание и остаётся понятным по-русски.
- source_word: חַטָּאתִי
  choice: моего греха
  rationale: Прямое и естественное соответствие, сохраняющее признание псалмопевцем собственного греха как причины бедствия.
theological_decisions:
- issue: Связь Божьего гнева, греха псалмопевца и его страдания
  choice: 'Обе причинные связи переданы прямо: телесное страдание связано с Божьим негодованием и с собственным грехом псалмопевца.'
  alternative: Слова можно понимать как поэтическое описание переживаемого отчуждения, а не как исчерпывающее учение о причинах всякого страдания.
  rationale: Перевод не смягчает ни Божье негодование, ни личный грех и не объясняет механизм их связи со страданием, сохраняя напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Порядок слов в первой части сделан естественным для русского языка; параллелизм двух отрицательных утверждений сохранён. Местоимение, обращённое к Богу, написано с прописной буквы.
