base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/001.yaml
  text: O Yahweh[a], do not rebuke me in your anger[c][b], nor discipline me in your wrath.
translation:
  language: ru
  text: Яхве[a], не обличай меня в гневе Твоём и не наказывай меня в ярости Твоей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. יהוה (ЙХВХ) — личное имя Бога; вероятное произношение: «Яхве». В еврейской и многих переводческих традициях при чтении его заменяют словом «Господь».'
    reason: textual-cultural clarification
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом «Господь».
- source_word: אַל
  choice: не
  rationale: Отрицательная частица вводит мольбу о том, чтобы названные действия не совершались.
- source_word: בְּקֶצְפְּךָ
  choice: в гневе Твоём
  rationale: קֶצֶף обозначает гнев, негодование; предлог בְּ сохранён естественной русской конструкцией.
- source_word: תוֹכִיחֵנִי
  choice: не обличай меня
  rationale: Каузативная форма יכח здесь означает обличать, укорять, указывать на вину; «обличай» сохраняет судебно-нравственный оттенок и отличается от последующего יסר.
- source_word: וּבַחֲמָתְךָ
  choice: и ... в ярости Твоей
  rationale: חֵמָה выражает более сильный, пылающий гнев; «ярость» передаёт усиление относительно קֶצֶף. Союз ו продолжает отрицательную просьбу и естественно передан как «и не».
- source_word: תְיַסְּרֵנִי
  choice: не наказывай меня
  rationale: Piel от יסר обозначает исправляющее наказание или взыскание. «Наказывай» естественно по-русски и сохраняет отличие от «обличай», хотя аспект воспитательного исправления поясняется в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя; примечание сообщает о традиционной замене при чтении, не выдавая реконструированное произношение за бесспорное.
- issue: Характер просьбы об обличении и наказании
  choice: Просьба не совершать этого во гневе и ярости
  alternative: Безусловная просьба вообще не обличать и не наказывать
  rationale: Предложные обороты «в гневе Твоём» и «в ярости Твоей» могут относиться к обстоятельствам обличения и наказания. Перевод сохраняет синтаксис и не решает сверх текста, отвергает ли молящийся само исправление или просит лишь не исправлять его в гневе.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной поэзии. Сохранены прямое обращение, параллелизм двух полустиший и различие между «гневом» и более сильной «яростью». Заглавные буквы в местоимениях «Твоём» соответствуют русской благоговейной издательской традиции, не меняя смысла оригинала.
