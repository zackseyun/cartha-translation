lexical_decisions:
- source_word: נַעֲוֵיתִי
  choice: Я согбен
  rationale: Глагол עוה передаёт состояние искривлённости, согнутости. «Согбен» естественно сочетается с последующим параллельным глаголом и сохраняет образ телесной и душевной подавленности.
- source_word: שַׁחֹתִי
  choice: поник
  rationale: Форма от שחח означает «согнуться, опуститься, быть униженным». «Поник» сохраняет усилительный параллелизм, не сводя смысл только к физической позе.
- source_word: עַד מְאֹד
  choice: совсем
  rationale: 'Выражение обозначает крайнюю степень. «Совсем» кратко и естественно усиливает объединённый образ: «согбен и поник».'
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Обычное современное русское выражение непрерывной продолжительности.
- source_word: קֹדֵר
  choice: в скорби
  rationale: Причастие от קדר может указывать на мрачность, потемнение или траурный вид. В контексте плача «в скорби» естественно передаёт состояние говорящего, а образ мрачности отмечен в сноске.
- source_word: הִלָּכְתִּי
  choice: хожу
  rationale: הלך здесь описывает постоянный образ движения и поведения в течение дня. Настоящее время соответствует продолжающемуся состоянию плача и звучит естественно по-русски.
