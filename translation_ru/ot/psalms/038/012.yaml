  - marker: b
    text: 'Или: «говорят пагубное» или «говорят о бедствиях». Еврейское слово может обозначать гибель, разорение или пагубные замыслы.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «бормочут обман» или «размышляют об обмане». Глагол может означать тихо произносить, обдумывать или замышлять.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַקְשׁוּ
  choice: расставляют сети
  rationale: Передаёт образ улавливания посредством западни и естественно звучит в современном русском языке.
- source_word: מְבַקְשֵׁי נַפְשִׁי
  choice: ищущие моей жизни
  rationale: В данном враждебном контексте נֶפֶשׁ обозначает жизнь человека; оборот сохраняет библейскую выразительность и остаётся понятным.
- source_word: וְדֹרְשֵׁי רָעָתִי
  choice: желающие мне зла
  rationale: Естественно передаёт направленное против говорящего стремление причинить вред, не сужая его до конкретного действия.
- source_word: דִּבְּרוּ הַוּוֹת
  choice: говорят о погибели
  rationale: הַוּוֹת может обозначать гибель, бедствие или пагубное; выбранная формулировка сохраняет связь с речью и не превращает её прямо в действие.
- source_word: וּמִרְמוֹת
  choice: обман
  rationale: Передаёт собирательное значение обманных и коварных замыслов или речей.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Краткий и естественный русский эквивалент, выражающий непрерывность.
- source_word: יֶהְגּוּ
  choice: замышляют
  rationale: В сочетании с «обман» глагол указывает на длительное внутреннее обдумывание или тихое проговаривание; «замышляют» естественно передаёт враждебный контекст, а неоднозначность отмечена в сноске.
