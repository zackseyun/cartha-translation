  yaml_path: translation/ot/psalms/038/012.yaml
  text: Those who seek my life set traps[a], and those who seek my harm speak destruction[d][c][b]; all day long they mutter deceit.
translation:
  language: ru
  text: Ищущие моей жизни расставляют сети[a], и желающие мне зла произносят гибельные речи[b]; весь день они бормочут коварные речи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ставят западни». Еврейский глагол передаёт образ ловушки или силка.'
