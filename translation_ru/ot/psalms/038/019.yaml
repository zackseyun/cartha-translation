lexical_decisions:
- source_word: אֹיְבַי
  choice: враги мои
  rationale: Прямой и естественный русский эквивалент личных врагов или противников; постпозиция местоимения уместна в поэтической речи.
- source_word: חַיִּים
  choice: живы
  rationale: Сохраняет буквальное значение прилагательного и возможное противопоставление ослабленному состоянию псалмопевца.
- source_word: עָצֵמוּ
  choice: сильны
  rationale: Передаёт результативное значение глагола — враги обрели силу и теперь сильны; формулировка естественна по-русски.
- source_word: רַבּוּ
  choice: многочисленны
  rationale: Выражает увеличение числа и нынешнюю многочисленность ненавидящих; согласуется с поэтическим строем стиха.
- source_word: שֹׂנְאַי
  choice: те, кто ненавидит меня
  rationale: Сохраняет глагольную силу субстантивированного причастия и не смешивает эту группу с обозначением «враги» в первой строке.
- source_word: שָׁקֶר
  choice: несправедливо
  rationale: Естественно передаёт наречное употребление слова «ложь, неправда», не исключая ни ложности обвинений, ни беспочвенности ненависти; неоднозначность пояснена в сноске.
