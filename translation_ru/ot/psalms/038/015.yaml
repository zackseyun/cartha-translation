lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предыдущей мысли; «ибо» естественно сохраняет причинно-пояснительную связь, не сводя значение к усилительному «поистине».
- source_word: לְךָ
  choice: Тебя
  rationale: При глаголе יחל предлог לְ указывает на того, кого ожидают или на кого возлагают надежду. В современном русском естественно сказать «жду Тебя».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул; форма «Яхве» является принятой русской транслитерацией YHWH.
- source_word: הוֹחָלְתִּי
  choice: я жду с надеждой
  rationale: Глагол יחל в породе хифиль сочетает ожидание и надежду. Эта формулировка сохраняет оба оттенка, а настоящее время выражает устойчивую позицию молящегося.
- source_word: אַתָּה
  choice: Ты
  rationale: Самостоятельное местоимение имеет эмфатический характер; его явное употребление перед сказуемым естественно передаёт акцент в русском.
- source_word: תַעֲנֶה
  choice: ответишь
  rationale: Глагол означает «ответить, откликнуться». Дополнение «мне» не добавлено, поскольку в еврейском тексте оно отсутствует.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: Божественный титул передан словом «Владыка», чтобы отличить его от личного имени Яхве и сохранить прямое обращение.
- source_word: אֱלֹהָי
  choice: Бог мой
  rationale: Постпозиция местоимения соответствует возвышенному поэтическому обращению и точно передаёт суффикс первого лица.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем Яхве и следующим за ним титулом אֲדֹנָי.
- issue: Уверенность в Божьем ответе
  choice: Ты ответишь
  alternative: Ты ответь
  rationale: Форма תַעֲנֶה в данном контексте естественно выражает уверенное ожидание, а не повелительную просьбу. При этом объект ответа в перевод не добавлен.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной поэзии. Инверсия «Бог мой» сохраняет возвышенный характер обращения, а выражение «жду с надеждой» делает доступным двойной оттенок еврейского глагола — ожидание и упование.
