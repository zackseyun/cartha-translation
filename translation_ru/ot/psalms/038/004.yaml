  text: כִּ֣י עֲ֭וֺנֹתַ/י עָבְר֣וּ רֹאשִׁ֑/י כְּ/מַשָּׂ֥א כָ֝בֵ֗ד יִכְבְּד֥וּ מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/004.yaml
  text: For my iniquities have gone over my head; like a heavy burden[a], they are too heavy for me.
translation:
  language: ru
  text: Ибо беззакония мои поднялись выше головы моей; словно тяжкое бремя, они слишком тяжелы для меня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вина моя»; еврейское слово может обозначать как беззакония, так и возникающую из-за них вину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание плача; «ибо» сохраняет пояснительную силу и соответствует высокому, но понятному поэтическому регистру.
- source_word: עֲוֺנֹתַי
  choice: беззакония мои
  rationale: עָוֹן может обозначать беззаконие, вину или её последствия. В основном тексте выбрано обозначение нравственных проступков, а более широкая смысловая возможность отмечена в сноске.
- source_word: עָבְרוּ רֹאשִׁי
  choice: поднялись выше головы моей
  rationale: Перевод сохраняет конкретный образ чего-то поднимающегося и захлёстывающего человека, не заменяя метафору отвлечённым «одолели меня».
- source_word: כְּמַשָּׂא כָבֵד
  choice: словно тяжкое бремя
  rationale: Сохраняется физическая метафора тяжёлой ноши и поэтическая связь с последующим глаголом от корня כבד.
- source_word: יִכְבְּדוּ מִמֶּנִּי
  choice: они слишком тяжелы для меня
  rationale: 'Формулировка передаёт сравнительно-превосходящую силу מִן: эта тяжесть превышает способность говорящего её нести.'
theological_decisions:
- issue: Смысловой диапазон עָוֹן в покаянном контексте
  choice: В основном тексте — «беззакония», прежде всего нравственные проступки псалмопевца.
  alternative: «Вина», с акцентом на виновность или последствия проступков.
  rationale: Контекст допускает как сами греховные поступки, так и связанную с ними вину. Основной текст называет проступки, а сноска сохраняет подлинную смысловую широту еврейского слова.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Инверсия «головы моей» и слово «тяжкое» поддерживают поэтический строй, оставаясь понятными обычному читателю. Маркер сноски поставлен после всего утверждения, поскольку поясняет семантику «беззаконий» в контексте обеих метафор.
