lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение страдания псалмопевца; «ибо» естественно сохраняет причинно-пояснительную связь и возвышенный поэтический регистр.
- source_word: כְסָלַי
  choice: чресла мои
  rationale: כֶּסֶל обозначает область поясницы, боков или бёдер. «Чресла» сохраняет телесную конкретность и традиционный поэтический регистр, не сужая значение до одного органа.
- source_word: מָלְאוּ
  choice: полны
  rationale: Форма выражает состояние наполненности; краткое «полны» естественно передаёт конструкцию и хорошо сочетается с родительным «жжения».
- source_word: נִקְלֶה
  choice: жжения
  rationale: Редкое и трудное слово в данном телесном контексте, вероятнее всего, обозначает жар, жжение или воспаление. Перевод «жжение» не добавляет отсутствующих в еврейском тексте «язв» и сохраняет неопределённость характера недуга.
- source_word: וְאֵין
  choice: и нет
  rationale: Прямо передаёт еврейское бытийное отрицание.
- source_word: מְתֹם
  choice: здоровья
  rationale: В телесном контексте слово означает целость, невредимость или здоровое состояние. «Здоровье» понятно современному читателю и естественно выражает отсутствие телесной целости.
- source_word: בִּבְשָׂרִי
  choice: в плоти моей
  rationale: בָּשָׂר здесь буквально обозначает физическую плоть псалмопевца. «Плоть» сохраняет телесную конкретность оригинала; порядок слов поддерживает поэтический регистр.
theological_decisions:
- issue: Значение בשרי в описании страдания
  choice: буквальная физическая «плоть»
  alternative: тело
  rationale: Параллелизм с чреслами и отсутствием здоровья указывает на телесное страдание; оснований превращать слово в богословскую метафору здесь нет.
- issue: Характер недуга, обозначенного נִקְלֶה
  choice: жжение
  alternative: воспаление; жгучие язвы; нечто постыдное
  rationale: Контекст поддерживает физическое ощущение жара или воспаления, однако точный диагноз текст не называет. Поэтому перевод не вводит «язвы» и не переносит слово в нравственную сферу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Слова «чресла» и «плоть» сохраняют телесную образность и достоинство оригинала; трудное נִקְלֶה передано без неподтверждённого уточнения «язвы».
