lexical_decisions:
- source_word: לְצֶלַע
  choice: упасть
  rationale: Существительное צֶלַע здесь обозначает падение или шаткость; в сочетании с נָכוֹן выражает готовность или близость падения. «Упасть» естественно по-русски и сохраняет образ исходного текста.
- source_word: נָכוֹן
  choice: готов
  rationale: В данной конструкции слово передаёт состояние готовности или непосредственной близости события.
- source_word: מַכְאוֹבִי
  choice: боль моя
  rationale: מַכְאוֹב может означать физическую или душевную боль; общее «боль» сохраняет эту широту.
- source_word: נֶגְדִּי תָמִיד
  choice: всегда предо мной
  rationale: Близко передаёт пространственную метафору постоянного присутствия боли и сохраняет поэтическую сжатость.
