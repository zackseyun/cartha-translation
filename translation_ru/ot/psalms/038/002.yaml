  text: Ибо стрелы Твои вонзились в меня[a], и рука Твоя опустилась на меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сошли в меня», «глубоко вошли в меня». Еврейский глагол буквально означает движение вниз или сошествие; здесь он употреблён о стрелах, вошедших в псалмопевца.'
    reason: lexical_alternative
  - marker: b
    text: «Рука» — еврейский образ деятельной силы Бога; здесь она представлена как опустившаяся на псалмопевца в его страдании.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предшествующей жалобы; «ибо» сохраняет причинный смысл и уместен в современной литературной поэзии.
- source_word: חִצֶּיךָ
  choice: стрелы Твои
  rationale: Буквальная передача множественного числа с суффиксом второго лица; сохраняется воинский образ бедствия, исходящего от Бога.
- source_word: נִחֲתוּ בִי
  choice: вонзились в меня
  rationale: Глагол буквально обозначает движение вниз, сошествие; при стрелах и предлоге ב естественный русский образ — стрелы, вошедшие и оставшиеся в теле. «Вонзились» передаёт контекст, не заменяя метафору отвлечённым толкованием.
- source_word: וַתִּנְחַת עָלַי
  choice: опустилась на меня
  rationale: Повтор того же еврейского корня передан глаголом нисходящего движения. Формулировка сохраняет образ Божьей руки, сошедшей на псалмопевца, и не уточняет сверх текста, идёт ли речь о наказании, взыскании или иной тяжести.
- source_word: יָדֶךָ
  choice: рука Твоя
  rationale: Конкретный антропоморфный образ сохранён буквально, без подмены словами «сила», «суд» или «наказание».
theological_decisions:
- issue: Антропоморфный образ Божьей руки
  choice: Сохранить буквальное «рука Твоя»
  alternative: «Твоя сила» или «Твой суд»
  rationale: Еврейский текст использует конкретный образ Божьего действия. Буквальная передача сохраняет поэтическую и богословскую напряжённость, не навязывая одного истолкования.
- issue: Характер Божьего действия в страдании псалмопевца
  choice: Не уточнять, является ли оно наказанием или дисциплинарным взысканием
  alternative: Передать как «Ты наказал меня»
  rationale: Стих изображает действие через стрелы и руку, но сам по себе не формулирует отвлечённого богословского объяснения; поэтому образы сохранены без поясняющей догматизации.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Постпозиция местоимения в сочетаниях «стрелы Твои» и «рука Твоя» поддерживает достоинство псалмового регистра, оставаясь понятной современному читателю. Параллелизм двух строк и нисходящее движение исходных глаголов сохранены настолько, насколько позволяет естественный русский язык.
