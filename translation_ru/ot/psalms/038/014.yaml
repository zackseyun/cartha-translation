  text: וָ/אֱהִ֗י כְּ֭/אִישׁ אֲשֶׁ֣ר לֹא שֹׁמֵ֑עַ וְ/אֵ֥ין בְּ֝/פִ֗י/ו תּוֹכָחֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/038/014.yaml
  text: And I became like a man who does not hear[a], and in whose mouth there are no reproofs.
translation:
  language: ru
  text: И стал я как человек, который не слышит и у которого в устах нет возражений[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обличений», «доводов» или «ответов». Еврейское слово может означать как словесное обличение, так и возражение или ответ в споре.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: И стал я
  rationale: Форма Qal wayyiqtol, 1-е лицо единственного числа от היה, продолжает высказывание; «стал» естественно передаёт уподобление и возможное развитие состояния, не добавляя явно противительного оттенка.
- source_word: כְּאִישׁ
  choice: как человек
  rationale: אִישׁ обозначает отдельного человека; в современном русском «человек» здесь естественно и точно, без необходимости подчёркивать мужской пол сравнительного образа.
- source_word: אֲשֶׁר לֹא שֹׁמֵעַ
  choice: который не слышит
  rationale: Причастие שֹׁמֵעַ допускает значения «слышит» и «слушает». Прямое «не слышит» сохраняет образ и не привносит отсутствующую в тексте неспособность слышать.
- source_word: וְאֵין בְּפִיו
  choice: и у которого в устах нет
  rationale: Передано отрицательное бытийное אֵין и сохранён телесный образ речи בְּפִיו, буквально «в его устах»; относительная конструкция звучит по-русски связно.
- source_word: תּוֹכָחוֹת
  choice: возражений
  rationale: Множественное תּוֹכָחוֹת может обозначать обличения, доводы или ответы-возражения. В контексте молчания перед противниками «возражений» лучше всего выражает ответную речь, не сводя слово только к нравственному обличению.
theological_decisions:
- issue: Характер молчания говорящего
  choice: «не слышит» и «нет возражений» без уточнения причины
  alternative: «не может слышать» или «не хочет отвечать»
  rationale: Еврейский текст описывает состояние и отсутствие ответной речи, но не определяет явно, вызваны ли они неспособностью, намеренным молчанием или иной причиной; эта неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим оборотом «в устах». Порядок «И стал я» сохраняет псалмическую торжественность, оставаясь понятным обычному читателю.
