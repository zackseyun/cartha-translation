  source_fidelity: «И стал я как человек, который не слышит и у которого в устах нет возражений» точно передаёт וָאֱהִי כְּאִישׁ אֲשֶׁר לֹא שֹׁמֵעַ וְאֵין בְּפִיו תּוֹכָחוֹת. «Стал» допустимо отражает wayyiqtol היה в сравнительной конструкции; «не слышит» не добавляет значения неспособности; «возражений» удачно передаёт контекстуально вероятное значение תּוֹכָחוֹת как ответных возражений, сохраняя его лексическую широту в примечании.
