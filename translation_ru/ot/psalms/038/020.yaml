lexical_decisions:
- source_word: וּמְשַׁלְּמֵי
  choice: А те, кто воздаёт
  rationale: Причастие от שלם обозначает тех, кто отплачивает или воздаёт; «воздаёт» сохраняет ответный характер действия и звучит естественно в данном устойчивом сочетании.
- source_word: רָעָה
  choice: злом
  rationale: Слово имеет нравственную силу и образует ясное противопоставление добру.
- source_word: תַּחַת
  choice: за; за то, что
  rationale: В первом случае предлог выражает возмещение или обмен («злом за добро»), а во втором — основание вражды; примечание сохраняет более буквальную конструкцию ответного действия.
- source_word: טוֹבָה
  choice: добро
  rationale: Сохраняет краткое противопоставление злу, не уточняя сверх текста, идёт ли речь о благодеянии или добре вообще.
- source_word: יִשְׂטְנוּנִי
  choice: враждуют со мной
  rationale: Глагол от שטן выражает враждебное противостояние. Такой перевод передаёт продолжительную активную вражду, не сужая значение до судебного обвинения.
- source_word: רְדֹפִי
  choice: я стремлюсь
  rationale: Инфинитивная конструкция от רדף буквально говорит о преследовании или следовании за чем-либо; в отношении добра русское «стремлюсь» естественно передаёт целенаправленность.
- source_word: טוֹב
  choice: к добру
  rationale: Субстантивированное прилагательное обозначает добро как предмет стремления; краткая русская форма сохраняет ёмкость оригинала.
theological_decisions:
- issue: Смысл второй конструкции с תַּחַת
  choice: за то, что я стремлюсь к добру
  alternative: в отплату за моё стремление к добру
  rationale: Основной текст естественно выражает основание вражды, но не устраняет присущий еврейской конструкции оттенок воздаяния; он сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Сохранены параллелизм «злом за добро» и смысловая напряжённость второго תַּחַת; архаичные и конфессионально окрашенные формулировки не использованы.
