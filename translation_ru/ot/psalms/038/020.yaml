  yaml_path: translation/ot/psalms/038/020.yaml
  text: And those who repay evil for good oppose me[a], because I pursue what is good.
translation:
  language: ru
  text: А те, кто воздают злом за добро, враждуют со мной[a] за то, что я стремлюсь к добру.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «враждуют со мной в отплату за моё стремление к добру».'
