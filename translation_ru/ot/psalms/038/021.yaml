  yaml_path: translation/ot/psalms/038/021.yaml
  text: Do not forsake me[a], O Yahweh my God; do not be far from me.
translation:
  language: ru
  text: Не оставляй меня, Яхве, мой Бог; не будь далёк от меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תַּעַזְבֵנִי
  choice: Не оставляй меня
  rationale: Отрицательная частица אַל с глагольной формой передаёт прямую молитвенную просьбу. עזב значит «оставлять, покидать»; «не оставляй меня» естественно звучит по-русски и сохраняет напряжённость плача.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом.
- source_word: אֱלֹהַי
  choice: мой Бог
  rationale: Форма с суффиксом первого лица единственного числа буквально означает «мой Бог».
- source_word: אַל תִּרְחַק מִמֶּנִּי
  choice: не удаляйся от меня
  rationale: רחק обозначает пребывание или становление далёким. В обращённой к Богу просьбе «не удаляйся от меня» естественно передаёт образ пространственной и личной отдалённости, не уточняя её причины.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; его транслитерация сохраняет различие между именем и титулом.
- issue: Характер Божьего удаления
  choice: не удаляйся от меня
  alternative: не будь далёк от меня
  rationale: Перевод сохраняет молитвенную просьбу и не решает, идёт ли речь о переживаемой псалмопевцем дистанции или о предстоящем удалении.
translation_notes:
  register: Современный литературный русский язык; краткая, прямая и торжественная молитвенная речь. Параллелизм двух отрицательных просьб сохранён.
