source:
  edition: WLC
  text: יִשְׂמַ֣ח יִשְׂרָאֵ֣ל בְּ/עֹשָׂ֑י/ו בְּנֵֽי צִ֝יּ֗וֹן יָגִ֥ילוּ בְ/מַלְכָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/002.yaml
  text: Let Israel rejoice in his Maker[b][a]; let the sons of Zion exult in their King.
translation:
  language: ru
  text: 'Пусть Израиль радуется своему Создателю[a],

    пусть сыны Сиона ликуют о своём Царе[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «своим создателям»; в еврейском тексте стоит форма множественного числа, обычно понимаемая здесь как обозначение Бога — Создателя Израиля.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о своём царе», если речь идёт о земном царе, а не о Боге.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׂמַח
  choice: пусть … радуется
  rationale: Имперфект породы qal употреблён в побудительном значении; эта формулировка естественно передаёт призыв в русском поэтическом тексте.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Собственное имя народа сохранено в традиционной русской форме.
- source_word: בְּעֹשָׂיו
  choice: своему Создателю
  rationale: Предлог ב при глаголе радости передан русским дательным управлением. Хотя причастие морфологически имеет форму множественного числа («создателям его»), по контексту оно обозначает Бога как Создателя Израиля; значимая особенность числа отмечена в сноске.
- source_word: בְּנֵי צִיּוֹן
  choice: сыны Сиона
  rationale: Сохранён буквальный мужской образ и возвышенный поэтический регистр; выражение собирательно обозначает народ Сиона.
- source_word: יָגִילוּ
  choice: пусть … ликуют
  rationale: Глагол גיל выражает бурную, торжествующую радость; «ликуют» передаёт усиление относительно «радуется».
- source_word: בְמַלְכָּם
  choice: о своём Царе
  rationale: Предлог ב при גיל естественно передан сочетанием «ликовать о ком-либо». Контекстуальный параллелизм с «Создателем» указывает прежде всего на Бога, что отражено прописной буквой.
theological_decisions:
- issue: Кого обозначает «их царь»
  choice: Бога как Царя Израиля
  alternative: земного царя Израиля
  rationale: Параллелизм связывает Царя с Создателем и убедительно поддерживает божественный референт; возможное прочтение о земном царе сохранено в сноске.
- issue: Число в בְּעֹשָׂיו
  choice: единственное число «Создателю»
  alternative: буквальное множественное число «создателям»
  rationale: Грамматическая форма множественного числа не требует здесь представления о нескольких создателях и в данном контексте относится к Богу; формальная особенность еврейского текста документирована в сноске.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным поэтическим звучанием. Синтаксический параллелизм двух строк сохранён; «сыны Сиона» удерживает исходный образ, а не заменяет его нейтральным обозначением жителей.
