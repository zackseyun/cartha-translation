  text: 'чтобы сковать их царей цепями,

    а их знатных — железными оковами.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֶאְסֹר
  choice: чтобы заключить
  rationale: Инфинитив выражает цель по отношению к предшествующему стиху. «Заключить в оковы» естественно по-русски передаёт конкретный образ связывания и не сужает смысл до официального тюремного заключения.
- source_word: מַלְכֵיהֶם
  choice: их царей
  rationale: מֶלֶךְ означает именно «царь»; местоименный суффикс 3-го лица множественного числа передан словом «их».
- source_word: בְּזִקִּים
  choice: в оковы
  rationale: זִקִּים обозначает цепи или оковы. Сочетание «заключить в оковы» сохраняет вещественный образ и звучит естественно в возвышенной поэтической речи.
- source_word: וְנִכְבְּדֵיהֶם
  choice: а их вельмож
  rationale: Форма от כבד обозначает почитаемых, влиятельных людей. «Вельможи» кратко и естественно передаёт высокий общественный статус, не превращая обозначение в абстрактное «почитаемые».
- source_word: בְּכַבְלֵי בַרְזֶל
  choice: в железные кандалы
  rationale: כֶּבֶל обозначает путы или оковы, а בַרְזֶל — железо. «Железные кандалы» сохраняет усиленный образ физического ограничения и передаёт лексическое варьирование относительно זִקִּים.
theological_decisions:
- issue: Передача мужского множественного וְנִכְבְּדֵיהֶם
  choice: их вельмож
  alternative: их почитаемых людей
  rationale: «Вельможи» сохраняет указание на мужчин высокого положения, соответствующее мужской форме древнееврейского слова, и не нейтрализует её.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Параллелизм двух полустиший сохранён; союз וְ передан как противопоставительно-присоединительное «а». Термины «оковы» и «кандалы» воспроизводят лексическое разнообразие оригинала.
