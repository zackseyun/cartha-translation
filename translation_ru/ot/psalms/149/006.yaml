lexical_decisions:
- source_word: רוֹמְמוֹת
  choice: славословия
  rationale: Множественное существительное от רומם обозначает возвышенные хвалебные возгласы или прославления. «Славословия» передаёт торжественный поэтический регистр без искусственного сочетания «высокие хвалы».
- source_word: אֵל
  choice: Богу
  rationale: Здесь אֵל — обозначение Бога Израиля; дательный падеж естественно выражает адресата славословий по-русски.
- source_word: בִּגְרוֹנָם
  choice: в их гортани
  rationale: גרון буквально означает «горло, гортань». Перевод сохраняет яркий телесный образ исходящего голоса, не заменяя его более привычным, но менее точным выражением «на устах».
- source_word: וְחֶרֶב
  choice: и меч
  rationale: Союз соединяет параллельные образы хвалы и оружия; неопределённость существительного в русском передаётся без артикля.
- source_word: פִּיפִיּוֹת
  choice: обоюдоострый
  rationale: Слово характеризует меч как имеющий два острия, то есть два режущих лезвия. «Обоюдоострый» — точное и естественное для возвышенной поэзии русское соответствие.
- source_word: בְּיָדָם
  choice: в их руке
  rationale: В еврейском стоит форма единственного числа «рука» с местоименным суффиксом множественного числа. Русский коллективный оборот сохраняет эту форму и поэтический параллелизм.
theological_decisions:
- issue: Воинственный образ рядом с богослужебной хвалой
  choice: Сохранить непосредственное соседство славословия и меча, не смягчая ни один из образов.
  alternative: Истолковать меч метафорически уже в основном тексте.
  rationale: Еврейский текст соединяет хвалу и воинский образ без поясняющего истолкования. Перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский с торжественной поэтической сжатостью. Безглагольный параллелизм оригинала сохранён при помощи тире; телесный и воинственный образы не сглажены.
