base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/001.yaml
  text: Praise Yah! Sing to Yahweh a new song[b][a], his praise in the assembly of the faithful.
translation:
  language: ru
  text: Хвалите Ях[a]! Пойте Яхве новую песнь; пусть в собрании верных звучит хвала Ему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение «халелу-Ях», традиционно передаваемое как «аллилуйя», буквально означает «хвалите Ях».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в собрании благочестивых», «в собрании святых» либо «в собрании преданных». Еврейское слово указывает на верность, преданность и благочестие. Буквально: «Его хвала в собрании верных»; в оригинале глагол в этой части стиха не выражен.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַלְלוּ יָהּ
  choice: Хвалите Ях
  rationale: Сохранены повелительное число множественного числа от הלל и краткая форма божественного имени יָהּ; перевод передаёт буквальный смысл возгласа «Аллилуйя», не скрывая составляющих его слов.
- source_word: שִׁירוּ לַיהוָה
  choice: Пойте Яхве
  rationale: Повелительная форма שׁיר передана прямо, а предлог ל — русским дательным падежом. Имя יהוה передано как «Яхве», чтобы сохранить личное имя в исходном тексте.
- source_word: שִׁיר חָדָשׁ
  choice: новую песнь
  rationale: Устойчивое поэтическое выражение передано близко к форме оригинала; «песнь» поддерживает возвышенный псалмодический регистр.
- source_word: תְּהִלָּתוֹ
  choice: воздавайте Ему хвалу
  rationale: Буквально «Его хвала». В еврейском это безглагольное продолжение, синтаксически связанное с предыдущим призывом; добавление «воздавайте» делает фразу естественной по-русски, не меняя её побудительного смысла.
- source_word: בִּקְהַל חֲסִידִים
  choice: в собрании верных
  rationale: קהל означает собравшееся сообщество, а חסידים — людей, отличающихся преданностью и верностью Богу. «Верных» сохраняет смысл преданности и не вносит позднейших конфессиональных оттенков слова «святые».
theological_decisions:
- issue: Передача יָהּ и יהוה в одном стихе
  choice: «Ях» и «Яхве»
  alternative: «Господь» в обоих случаях либо «Господь» только для יהוה
  rationale: Разные формы имени в еврейском тексте сохранены различными русскими формами; это позволяет увидеть краткую форму יָהּ и полную форму יהוה, не сводя их к одному титулу.
- issue: Смысл חֲסִידִים
  choice: «верных»
  alternative: «благочестивых», «святых», «преданных»
  rationale: Слово допускает оттенки благочестия, преданности и заветной верности. «Верных» естественно для современного русского языка и не превращает термин в узкое богословское обозначение.
- issue: Синтаксис תְּהִלָּתוֹ
  choice: 'Побудительное продолжение: «воздавайте Ему хвалу»'
  alternative: Эллиптическое «Его хвала — в собрании верных» либо приложение к «новой песне»
  rationale: В оригинале глагол отсутствует, поэтому конструкция допускает более одного синтаксического понимания. Выбранный вариант естественно продолжает два повелительных призыва, а примечание сохраняет исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмодической лексикой. Форма «песнь» выбрана ради жанрового звучания; порядок призывов и различие форм божественного имени сохранены. Эллипсис оригинала слегка раскрыт для ясности, а его неоднозначность отмечена в сноске.
