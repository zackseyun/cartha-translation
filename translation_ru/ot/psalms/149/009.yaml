lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: совершить
  rationale: В сочетании с מִשְׁפָּט инфинитив означает привести судебное решение в исполнение; «совершить суд» сохраняет юридическую силу и звучит естественно в контексте.
- source_word: בָּהֶם
  choice: над ними
  rationale: Предлог ב здесь указывает на тех, над кем совершается суд, то есть на народы и царей из предыдущего стиха.
- source_word: מִשְׁפָּט כָּתוּב
  choice: записанный суд
  rationale: מִשְׁפָּט обозначает суд или судебное решение, а пассивное причастие כָּתוּב буквально означает «записанный». Такая формулировка сохраняет образ уже письменно установленного суда и не сужает его до одного лишь приговора.
- source_word: הָדָר
  choice: честь
  rationale: В данном контексте слово выражает достоинство или почёт, принадлежащий Божьим верным, а не прежде всего внешнее великолепие.
- source_word: חֲסִידָיו
  choice: Его верных
  rationale: חָסִיד обозначает людей, отличающихся преданностью и верностью; «верные» понятно современному читателю и не привносит позднейших ассоциаций слова «святые».
- source_word: הַלְלוּ יָהּ
  choice: Хвалите Ях!
  rationale: Фраза состоит из повелительного «хвалите» и краткой формы Божьего имени יָהּ; перевод сохраняет как смысл призыва, так и форму имени.
theological_decisions:
- issue: Передача краткой формы Божьего имени יָהּ
  choice: Ях
  alternative: Господа; аллилуйя
  rationale: В тексте стоит краткая форма имени, а не титул יהוה. «Ях» сохраняет исходную форму; перевод повеления отдельно позволяет читателю понять значение всей формулы.
- issue: К кому относится הָדָר и что именно названо честью
  choice: «Это — честь для всех Его верных»
  alternative: «Честь принадлежит всем Его верным»; «Он — великолепие всех Его верных»
  rationale: Указательное «это» естественно связывает הָדָר с исполнением записанного суда. При этом краткость еврейской именной конструкции сохраняется без добавления идеи, будто речь непременно идёт о визуальном великолепии.
translation_notes:
  register: Современный литературный русский с поэтической торжественностью. Синтаксис краток и соответствует заключительной строке псалма; «совершить суд» сохраняет библейский юридический регистр, а «верные» остаётся понятным без конфессионально нагруженной терминологии.
