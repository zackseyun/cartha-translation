  text: Ведь Яхве благоволит к Своему народу; Он украшает смиренных спасением.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавлением» или «победой». Еврейское слово может означать спасение, избавление либо победу.'
