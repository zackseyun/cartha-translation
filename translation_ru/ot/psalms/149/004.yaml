lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для окружающего призыва к хвале; «ведь» естественно передаёт пояснительно-причинный оттенок в русской поэзии.
- source_word: רוֹצֶה
  choice: благоволит
  rationale: Здесь רצה обозначает благосклонность и удовольствие, а не простое желание. «Благоволит» точно и достойно передаёт положительное расположение к народу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: בְּעַמּוֹ
  choice: к Своему народу
  rationale: Предлог ב при רצה обозначает объект благоволения; русское управление «благоволить к» требует предлога «к».
- source_word: יְפָאֵר
  choice: украшает
  rationale: Пиэль от פאר выражает наделение красотой или почётом. «Украшает» сохраняет конкретный поэтический образ и не сужает его до венчания или абстрактного прославления.
- source_word: עֲנָוִים
  choice: смиренных
  rationale: Слово может обозначать смиренных, кротких или униженных. «Смиренных» естественно передаёт основной нравственно-духовный оттенок, не исключая социальную приниженность.
- source_word: בִּישׁוּעָה
  choice: спасением
  rationale: ישועה охватывает спасение, избавление и победу. «Спасением» сохраняет широкий смысл и хорошо сочетается с образом украшения.
theological_decisions:
- issue: Передача יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Смысл ישועה в хвалебном псалме
  choice: спасение
  alternative: избавление; победа
  rationale: «Спасение» сохраняет полный смысловой диапазон, тогда как контекст также допускает конкретное избавление или победу; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Прописная буква в «Своему» и «Он» служит традиционным русским почтительным оформлением отсылки к Богу; синтаксис сохраняет параллелизм еврейского стиха.
