lexical_decisions:
- source_word: יְהַלְלוּ
  choice: пусть славят
  rationale: Пиэль имперфекта в данном поэтическом призыве естественно передаётся побудительной конструкцией «пусть славят».
- source_word: שְׁמוֹ
  choice: Его имя
  rationale: Сохраняет явное упоминание имени в еврейском тексте и его смысл как выражения явленной личности и чести Бога.
- source_word: בְמָחוֹל
  choice: в танце
  rationale: מָחוֹל может обозначать танец либо танцевание; «в танце» звучит естественно и сохраняет предметную неоднозначность слова.
- source_word: בְּתֹף
  choice: под бубен
  rationale: תֹף — ручной рамочный ударный инструмент; «бубен» — понятное современному русскому читателю и исторически уместное соответствие.
- source_word: וְכִנּוֹר
  choice: и лиру
  rationale: כִּנּוֹר обозначает древний струнный инструмент лировидного типа, а не современную арфу.
- source_word: יְזַמְּרוּ
  choice: пусть воспевают
  rationale: זמר в пиэле охватывает хвалебное пение и музицирование. «Воспевают» сохраняет направленность хвалы, тогда как названные инструменты передают музыкальную сторону.
- source_word: לוֹ
  choice: Его
  rationale: Русская переходная конструкция «воспевать Его» естественно передаёт адресата действия, выраженного еврейским לְ.
