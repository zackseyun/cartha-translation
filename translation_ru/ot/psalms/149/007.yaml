lexical_decisions:
- source_word: לַעֲשׂוֹת
  choice: чтобы совершить
  rationale: Инфинитив с ל выражает цель; «совершить» естественно сочетается с «отмщением» и передаёт осуществление суда.
- source_word: נְקָמָה
  choice: отмщение
  rationale: Существительное обозначает месть или воздаяние в судебном либо военном контексте. «Отмщение» сохраняет сильный и возвышенный тон еврейского текста.
- source_word: בַּגּוֹיִם
  choice: над народами
  rationale: Предлог ב указывает здесь на объект действия; сочетание «совершить отмщение над» естественно в русском языке.
- source_word: תּוֹכֵחוֹת
  choice: наказание
  rationale: Слово допускает значения «обличения» и «вразумления», но параллелизм с «отмщением» и судебно-военный контекст поддерживают значение кары. Единственное собирательное «наказание» сохраняет поэтическую стройность.
- source_word: בַּל
  choice: над
  rationale: Поэтический предлог параллелен בַּ в первой строке; одинаковый русский предлог подчёркивает синтаксический параллелизм.
- source_word: אֻמִּים
  choice: племенами
  rationale: Слово обозначает народы или этнические общности. «Племенами» отличает его от גּוֹיִם и сохраняет лексическое разнообразие параллельных строк.
theological_decisions:
- issue: Следует ли смягчать выражение суда, совершаемого над народами
  choice: Сохранить сильные слова «отмщение» и «наказание»
  alternative: Передать как «правосудие», «обличения» или «вразумления»
  rationale: Еврейский текст использует резкую судебно-военную лексику. Смягчение устранило бы присущее псалму богословское напряжение.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической окраской. Тире обозначает эллипсис повторяющегося глагола и делает параллелизм естественным; лексика не смягчает судебно-военный характер стиха.
