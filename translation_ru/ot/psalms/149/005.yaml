  text: יַעְלְז֣וּ חֲסִידִ֣ים בְּ/כָב֑וֹד יְ֝רַנְּנ֗וּ עַל מִשְׁכְּבוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/149/005.yaml
  text: Let the faithful exult in glory[c][b][a]; let them sing for joy on their beds.
translation:
  language: ru
  text: Да ликуют верные[a] в славе[c], да восклицают от радости[b] на своих ложах!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благочестивые», «преданные» или «святые». Еврейское слово обозначает людей, отличающихся верностью завету и преданностью Богу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «да поют от радости».'
    reason: lexical_alternative
  - marker: c
    text: «В славе» можно также понять как «в чести».
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעְלְזוּ
  choice: да ликуют
  rationale: Форма допускает побудительное прочтение; «да ликуют» сохраняет возвышенную поэтическую силу и параллелизм стиха.
- source_word: חֲסִידִים
  choice: верные
  rationale: Слово обозначает людей, отличающихся преданностью и благочестием в рамках завета; «верные» понятно современному читателю и не вводит позднейшего специального смысла слова «святые».
- source_word: בְּכָבוֹד
  choice: в славе
  rationale: Предлог ב естественно передаёт сферу или состояние ликования; «слава» сохраняет весомый поэтический смысл כָּבוֹד, при этом «в чести» остаётся возможным прочтением.
- source_word: יְרַנְּנוּ
  choice: да восклицают от радости
  rationale: Глагол רנן обозначает звонкий радостный возглас, нередко песенный. Такой перевод сохраняет неоднозначность между пением и радостным криком.
- source_word: עַל
  choice: на
  rationale: Прямое пространственное значение предлога перед существительным «ложа».
- source_word: מִשְׁכְּבוֹתָם
  choice: на своих ложах
  rationale: Существительное обозначает места, где лежат. «Ложа» уместно в поэтическом регистре и не звучит так буднично, как «кровати».
theological_decisions:
- issue: Передача חֲסִידִים
  choice: верные
  alternative: благочестивые; преданные; святые
  rationale: Перевод указывает на преданность Богу и завету, не превращая выражение в техническое наименование особой церковной категории.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным псалмическим звучанием. Частица «да» передаёт побудительную силу параллельных глагольных форм; «ложа» поддерживает поэтический регистр.
