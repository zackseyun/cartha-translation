  text: To you[a], silence is praise, O God, in Zion, and to you a vow will be paid.
translation:
  language: ru
  text: Тебе безмолвие — хвала, Боже, на Сионе[a], и обет Тебе будет исполнен.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «Хвала в безмолвии ожидает Тебя, Боже, на Сионе» или «Тебе принадлежит безмолвная хвала, Боже, на Сионе». Еврейская фраза эллиптична и допускает несколько толкований.'
    reason: alternative_reading
lexical_decisions:
- source_word: דֻמִיָּה
  choice: безмолвие
  rationale: Существительное обозначает молчание, тишину, безмолвие. «Безмолвие» сохраняет возвышенный поэтический парадокс и не вводит отсутствующий в еврейском тексте глагол.
- source_word: תְהִלָּה
  choice: хвала
  rationale: Обычное значение — «хвала». В безглагольной конструкции слово сопоставлено с «безмолвием».
- source_word: לְךָ דֻמִיָּה תְהִלָּה
  choice: Тебе — безмолвие как хвала
  rationale: Еврейская фраза эллиптична. Такая передача сохраняет оба существительных и напряжённую образность исходного текста, не добавляя глагол «ожидает».
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма обращения к единому Богу естественно передаётся русским звательным употреблением «Боже».
- source_word: בְּצִיּוֹן
  choice: на Сионе
  rationale: Для обозначения горы и священного места по-русски нормативно и естественно «на Сионе»; локативное значение предлога ב сохраняется.
- source_word: יְשֻׁלַּם
  choice: будет исполнен
  rationale: Пуаль от שלם в сочетании с обетом означает, что обещанное Богу будет исполнено. По-русски «исполнить обет» естественнее, чем «уплатить обет», и не сужает смысл до приношения.
- source_word: נֶדֶר
  choice: обет
  rationale: Прямое и традиционно понятное обозначение торжественного обещания, данного Богу.
theological_decisions:
- issue: Толкование эллиптической фразы לְךָ דֻמִיָּה תְהִלָּה
  choice: Безмолвие представлено как хвала, обращённая к Богу.
  alternative: «Хвала безмолвно ожидает Тебя, Боже, на Сионе» или «Тебе принадлежит безмолвная хвала, Боже, на Сионе».
  rationale: В еврейском тексте нет выраженного глагола, поэтому синтаксическая связь допускает несколько пониманий. Основной текст сохраняет парадокс и не устраняет подлинную неоднозначность; варианты вынесены в примечание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой интонацией. Тире обозначает безглагольность первой фразы; оборот «как хвала» делает связь существительных понятной, сохраняя необычность оригинала.
