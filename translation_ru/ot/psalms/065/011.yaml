  text: You crown the year with your goodness[b][a], and your paths drip with abundance.
translation:
  language: ru
  text: 'Ты венчаешь год Своей благостью,

    и пути Твои источают изобилие.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально «тучность» — древнееврейский образ плодородия, богатства и обильного пропитания. «Пути» можно также перевести как «следы» или «колеи»: возможно, здесь представлено шествие Бога, после которого земля становится плодородной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עִטַּרְתָּ
  choice: Ты венчаешь
  rationale: Сохраняет яркую метафору עטר — «увенчивать, окружать венцом» — и естественно звучит в русском поэтическом обращении к Богу.
- source_word: שְׁנַת טוֹבָתֶךָ
  choice: год Своей благостью
  rationale: Конструкцию можно понять как «год Твоей благости», однако управление глагола и контекст позволяют естественно передать благость как то, чем Бог венчает год, не устраняя образ щедрого благословения.
- source_word: טוֹבָתֶךָ
  choice: Своей благостью
  rationale: «Благость» сохраняет широкий смысл Божьего добра и благодеяния; более узкое «щедротами» сильнее истолковывало бы сельскохозяйственный контекст.
- source_word: וּמַעְגָּלֶיךָ
  choice: и пути Твои
  rationale: מַעְגָּל означает путь, колею или след. «Пути» ясно и достойно передаёт образ Божьего шествия, а конкретный оттенок «следов/колей» отмечен в сноске.
- source_word: יִרְעֲפוּן
  choice: источают
  rationale: Глагол изображает капание или истечение. «Источают» сохраняет конкретность образа, но в современном русском звучит естественнее буквального «капают».
- source_word: דָּשֶׁן
  choice: изобилие
  rationale: Буквально слово обозначает «тучность, жир», а переносно — плодородие, богатство и обилие. «Изобилие» передаёт смысл без нежелательных современных ассоциаций.
theological_decisions:
- issue: Сохранение образов Божьего благословения и плодородия
  choice: Сохранены метафоры венчания года и путей Бога, источающих изобилие
  alternative: 'Передать пояснительно: «Ты обильно благословляешь год и даруешь богатый урожай»'
  rationale: Еврейский стих говорит образно и связывает плодородие с действием Бога. Прямое сохранение метафор не сводит поэзию к прозаическому толкованию и не добавляет конфессиональных выводов.
- issue: Синтаксическое отношение טוֹבָתֶךָ к «году» и глаголу «венчать»
  choice: «Ты венчаешь год Своей благостью»
  alternative: «Ты венчаешь год Твоей благости»
  rationale: Еврейская конструкция буквально допускает «год Твоей благости», но по-русски выбранный вариант яснее выражает Божью благость как дар, венчающий год. Возможная конструктивная неоднозначность не имеет существенного богословского следствия.
translation_notes:
  register: Современный литературный русский с достоинством псалмовой поэзии. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции. Инверсия «пути Твои» поддерживает поэтический ритм, оставаясь понятной современному читателю.
