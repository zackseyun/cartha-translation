  text: 'Степные пастбища сочатся влагой,

    и холмы опоясываются ликованием.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִרְעֲפוּ
  choice: сочатся влагой
  rationale: Глагол רָעַף передаёт образ капающей, источаемой или обильно изливающейся влаги. Русское «сочатся влагой» сохраняет зримую поэтическую картину; слово «влагой» эксплицирует подразумеваемое содержание образа.
- source_word: נְאוֹת
  choice: пастбища
  rationale: נָוֶה здесь обозначает места выпаса; «пастбища» точно соответствует природному и пасторальному контексту.
- source_word: מִדְבָּר
  choice: в степи
  rationale: מִדְבָּר может обозначать не только безводную пустыню, но и необрабатываемую степную местность, пригодную для выпаса. «В степи» не создаёт ошибочного образа песчаной пустыни и естественно сочетается с пастбищами.
- source_word: גִיל
  choice: ликованием
  rationale: גִיל означает бурную, торжествующую радость. «Ликованием» сохраняет возвышенный поэтический тон и олицетворение холмов.
- source_word: גְּבָעוֹת
  choice: холмы
  rationale: Прямой и естественный перевод существительного во множественном числе.
- source_word: תַּחְגֹּרְנָה
  choice: опоясываются
  rationale: חָגַר буквально означает «опоясывать(ся), препоясывать(ся)». Возвратная форма сохраняет метафору холмов, которые словно надевают на себя ликование.
