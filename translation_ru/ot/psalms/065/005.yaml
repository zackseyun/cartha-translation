id: PSA.65.5
reference: Psalms 65:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: נ֤וֹרָא֨וֹת בְּ/צֶ֣דֶק תַּ֭עֲנֵ/נוּ אֱלֹהֵ֣י יִשְׁעֵ֑/נוּ מִבְטָ֥ח כָּל קַצְוֵי אֶ֝֗רֶץ וְ/יָ֣ם רְחֹקִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/005.yaml
  text: With awesome deeds in righteousness you answer us[a], O God of our salvation[b], the confidence of all the ends of the earth and of the distant sea.
translation:
  language: ru
  text: Грозными деяниями в праведности Ты отвечаешь нам[a], Боже нашего спасения, упование всех концов земли и далёких морей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «грозными деяниями по справедливости Ты отвечаешь нам».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово «море» стоит в единственном числе, но может иметь собирательное значение: «далёких морей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נ֤וֹרָא֨וֹת
  choice: грозными деяниями
  rationale: Субстантивированная форма от ירא обозначает внушающие трепет или страх проявления. «Грозные деяния» естественно передаёт внушительную силу Божьих действий, не сводя смысл только к чудесности; «деяниями» добавлено для ясности эллиптического еврейского выражения.
- source_word: בְּצֶ֣דֶק
  choice: в праведности
  rationale: 'Предлог ב обозначает здесь образ или сферу действия: Бог отвечает сообразно Своей праведности. Формулировка сохраняет более широкий смысл צֶדֶק, не ограничивая его только судебной справедливостью.'
- source_word: תַּ֭עֲנֵנוּ
  choice: Ты отвечаешь нам
  rationale: Qal глагола ענה означает «отвечать», а суффикс первого лица множественного числа требует «нам». Настоящее время естественно для русского поэтического обращения и передаёт незавершённую форму в контексте молитвы.
- source_word: אֱלֹהֵ֣י יִשְׁעֵ֑נוּ
  choice: Боже нашего спасения
  rationale: Звательная форма «Боже» отражает прямое обращение, а «нашего спасения» сохраняет конструкцию сопряжённого сочетания и широкий смысл ישׁע — спасение, избавление.
- source_word: מִבְטָ֥ח
  choice: упование
  rationale: מִבְטָח обозначает того, на кого полагаются, или основание доверия. «Упование» естественно сочетается с последующим родительным оборотом и сохраняет молитвенно-поэтический регистр.
- source_word: כָּל קַצְוֵי אֶ֝֗רֶץ
  choice: всех концов земли
  rationale: Устойчивое библейское выражение обозначает самые отдалённые области мира; русское «концы земли» точно и узнаваемо передаёт образ.
- source_word: וְיָ֣ם רְחֹקִֽים
  choice: и далёких морей
  rationale: Хотя יָם формально стоит в единственном числе, множественное רְחֹקִים допускает коллективное понимание моря как отдалённых морских пространств. Множественное «морей» естественно по-русски и сохраняет грамматическую напряжённость посредством примечания.
theological_decisions:
- issue: Передача צֶדֶק в описании Божьего ответа
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» сохраняет широкий нравственный смысл слова и возможность понимания Божьего действия как верного и должного; «справедливость» остаётся допустимым более судебным оттенком и отмечена в сноске.
- issue: Характер נוראות как Божьих спасительных действий
  choice: грозные деяния
  alternative: дивные деяния
  rationale: Корень ירא прежде всего указывает на внушение трепета или страха. Выбор не смягчает эту напряжённость до одной лишь чудесности, хотя контекст связывает деяния со спасением.
translation_notes:
  register: Современный литературный русский с достоинством псалмового обращения. Местоимение «Ты» написано с прописной буквы как знак прямого обращения к Богу. Синтаксис сохраняет поэтическую плотность оригинала, оставаясь понятным обычному читателю.
