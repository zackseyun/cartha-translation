lexical_decisions:
- source_word: דִּבְרֵי עֲוֺנֹת
  choice: дела беззакония
  rationale: Сжатое еврейское сочетание буквально связано со «словами/делами/обстоятельствами беззаконий». «Дела беззакония» сохраняет выраженное דִּבְרֵי и нравственную тяжесть עֲוֺנֹת, не сводя смысл однозначно к субъективному чувству вины.
- source_word: גָּבְרוּ מֶנִּי
  choice: одолели меня
  rationale: Передаёт значение корня גבר — «быть сильнее, одолевать» — и образ беззаконий как силы, превосходящей говорящего.
- source_word: פְּשָׁעֵינוּ
  choice: наши преступления
  rationale: פֶּשַׁע обозначает преступление, проступок или мятеж. «Преступления» ясно передаёт сознательное нарушение, не усиливая значение до буквального «мятежа».
- source_word: אַתָּה
  choice: Ты
  rationale: Отдельное местоимение в еврейском тексте подчёркнуто; в русском его выразительность сохранена постановкой после тире и написанием с прописной буквы как обращения к Богу.
- source_word: תְכַפְּרֵם
  choice: совершишь за них искупление
  rationale: Порода piel глагола כפר с местоименным суффиксом указывает на совершение искупления применительно к преступлениям. Эта формулировка сохраняет богословскую весомость и объект действия, не сводя смысл к простому сокрытию.
theological_decisions:
- issue: Передача כפר применительно к грехам
  choice: Ты совершишь за них искупление
  alternative: Ты простишь их; Ты покроешь их; Ты очистишь их
  rationale: Выбранный вариант сохраняет искупительный смысл глагола и не навязывает определённой теории искупления. Альтернативы выражают возможные контекстуальные оттенки — прощение, покрытие или очищение.
- issue: Переход от единственного числа «меня» к множественному «наши»
  choice: сохранить переход без сглаживания
  alternative: согласовать оба выражения по числу
  rationale: Масоретский текст сначала говорит от первого лица единственного числа, а затем включает общину в первом лице множественного числа; этот значимый переход сохранён.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический перелом перед «Ты» сохраняет поэтическое ударение оригинала; неоднозначность первой строки разъяснена в сноске.
