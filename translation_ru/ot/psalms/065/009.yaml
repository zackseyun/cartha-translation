base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/009.yaml
  text: You visit the earth and water it[a]; you greatly enrich it. The river of God is full of water; you prepare their grain[b], for so you prepare the earth.
translation:
  language: ru
  text: Ты посетил землю и напоил её, щедро обогатил её. Божий поток[a] полон воды. Ты приготовил им зерно[b], ибо так Ты приготовил землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Божья река», «Божье русло». Поэтическое выражение может указывать на небесный источник дождя и плодородия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их зерно». Местоимение, вероятно, относится к людям, получающим урожай, но не уточняет, о ком именно идёт речь. Глагол можно также перевести как «обеспечил», «устроил» или «утвердил».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּקַדְתָּ
  choice: заботишься
  rationale: Глагол פקד может означать посещение или деятельное внимание. В контексте орошения и плодородия «заботишься» естественно передаёт благотворное Божье попечение, не привнося идеи суда или проверки.
- source_word: וַתְּשֹׁקְקֶהָ
  choice: и орошаешь её
  rationale: В данном земледельческом контексте форма обозначает снабжение земли водой. «Орошаешь» сохраняет образ и звучит естественно в современной литературной русской речи.
- source_word: רַבַּת תַּעְשְׁרֶנָּה
  choice: щедро обогащаешь её
  rationale: Конструкция усиливает каузативное значение «делать богатой». Наречие «щедро» передаёт изобилие и хорошо согласуется с образом плодородной земли.
- source_word: פֶּלֶג אֱלֹהִים
  choice: Божий поток
  rationale: פֶּלֶג обозначает поток, водный канал или русло. «Божий поток» сохраняет поэтическую конструкцию и не сводит образ заранее ни к земной реке, ни исключительно к небесному источнику дождя.
- source_word: מָלֵא מָיִם
  choice: полон воды
  rationale: Прямое и естественное соответствие еврейской именной конструкции, сохраняющее образ изобилия.
- source_word: תָּכִין דְּגָנָם
  choice: готовишь для них зерно
  rationale: כון в породе hифиль значит «готовить, устраивать, утверждать». Мужской множественный суффикс при «зерне» передан как указание на получателей — людей, живущих плодами земли; это естественнее по-русски, чем неясное «их зерно».
- source_word: כִּי כֵן תְּכִינֶהָ
  choice: потому что так готовишь землю
  rationale: Повтор «готовишь» сохраняет лексическую связь двух форм כון. Женский единственный суффикс относится к земле; существительное повторено ради ясности.
theological_decisions:
- issue: К кому относится суффикс множественного числа в דְּגָנָם («их зерно»)
  choice: Передать его как «для них», имея в виду людей, получающих земной урожай.
  alternative: Сохранить буквальное «их зерно» или обобщить выражение как «урожай земли».
  rationale: Суффикс имеет мужской род и множественное число, поэтому грамматически не совпадает с существительным «земля», которое в еврейском женского рода и единственного числа. Формулировка «для них» сохраняет человеческий референт, но не уточняет, о какой именно группе людей идёт речь.
- issue: Образ פֶּלֶג אֱלֹהִים
  choice: Сохранить поэтическое выражение «Божий поток».
  alternative: Истолковать его как небесный источник дождя, Божью реку или оросительный канал.
  rationale: Конструкция допускает широкий поэтический образ воды, даруемой Богом. Перевод не должен без необходимости выбирать одну конкретную космологическую или природную интерпретацию.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но общепонятной поэтической интонацией. Настоящее время представляет Божье действие как характерное и продолжающееся. Повтор «готовишь» намеренно сохраняет повтор одного еврейского корня; местоименные различия оригинала отражены без конфессионального уточнения.
