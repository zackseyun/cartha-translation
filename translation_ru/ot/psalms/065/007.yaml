  text: утишающий рёв морей[a], рёв их волн и шум[b] народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укрощающий» либо «усмиряющий».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «смятение народов»; еврейское слово может обозначать шумное волнение, а в некоторых контекстах — множество людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשְׁבִּיחַ
  choice: утишающий
  rationale: Причастие породы хифиль передаёт действие, заставляющее шум умолкнуть. «Утишающий» сохраняет причастную форму и естественно сочетается как с морской стихией, так и с человеческим волнением.
- source_word: שְׁאוֹן
  choice: рёв
  rationale: Слово обозначает громкий шум, грохот или смятение. В сочетании с морями и волнами «рёв» ярко передаёт звуковой образ; повтор сохранён в обоих случаях.
- source_word: יַמִּים
  choice: морей
  rationale: Сохранено множественное число еврейского существительного, указывающее на моря как на стихию в целом.
- source_word: גַּלֵּיהֶם
  choice: их волн
  rationale: Местоименный суффикс мужского рода множественного числа прямо соотнесён с предшествующим словом «морей».
- source_word: הֲמוֹן
  choice: шум
  rationale: В параллели с рёвом морей слово выражает шумное волнение и смятение, а не только многочисленность.
- source_word: לְאֻמִּים
  choice: народов
  rationale: «Народы» передаёт коллективные человеческие сообщества, не сужая смысл до современных государств.
theological_decisions:
- issue: Параллель между природной стихией и человеческим волнением
  choice: Бог представлен утишающим и рёв морей, и шум народов.
  alternative: Понять заключительную строку преимущественно политически — как подчинение народов — или ограничить образ только природной стихией.
  rationale: Поэтический параллелизм соединяет природный хаос с волнением человеческих сообществ. Перевод сохраняет эту широту, не добавляя политической или эсхатологической системы, которой сам стих прямо не формулирует.
translation_notes:
  register: Современный литературный русский язык с поэтической торжественностью. Сохранены причастная конструкция, множественное число «морей», местоименная связь «их волн» и повтор слова «рёв».
