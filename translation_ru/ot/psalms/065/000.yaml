  text: For the choirmaster[a]. A psalm of David[b]; a song.
translation:
  language: ru
  text: Руководителю хора[a]. Псалом Давида[b]; песнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово обозначает руководителя или распорядителя; в надписаниях псалмов оно, вероятно, относится к руководителю музыкального исполнения. Точная функция этого лица не вполне определена.
    reason: lexical_ambiguity
  - marker: b
    text: Еврейское выражение может указывать на авторство Давида, посвящение ему, принадлежность ему или иную связь с ним.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов это слово, вероятно, обозначает человека, руководившего музыкальным исполнением. Предлог ל передан дательным падежом, естественным для русского адресного надписания.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Это устойчивое и точное русское обозначение данного жанра в надписаниях.
- source_word: לְדָוִד
  choice: Давида
  rationale: Русский родительный оборот сохраняет лаконичность еврейского надписания и не сводит возможное значение только к прямому авторству.
- source_word: שִׁיר
  choice: песнь
  rationale: Отдельный термин сохранён наряду со словом «псалом»; «песнь» соответствует возвышенному, но понятному регистру библейского надписания.
theological_decisions:
- issue: Характер связи псалма с Давидом в выражении לְדָוִד
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом / Псалом для Давида
  rationale: Еврейский предлог ל может указывать на авторство, принадлежность, посвящение или связь. Краткая формула «Псалом Давида» не устраняет эту неоднозначность поясняющим глаголом.
translation_notes:
  register: Современный литературный русский язык с традиционной краткостью псалмового надписания. Точка отделяет указание исполнителю, а точка с запятой связывает два жанровых обозначения, не сливая их.
