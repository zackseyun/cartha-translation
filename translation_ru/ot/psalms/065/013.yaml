  - severity: medium
    issue: «Ликуют» для יִתְרוֹעֲעוּ
    rationale: Глагол выражает радостный крик/восклицание. «Ликуют» передаёт радость, но может не подразумевать звучания. «Радостно восклицают» сохраняет вокальный образ, параллельный пению.
  - severity: low
