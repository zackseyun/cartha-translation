    rationale: Простое «и» связывает действия, но ослабляет усилительное продолжение. Повторение «они» и интонационное тире позволяют передать кульминационный параллелизм без искусственного буквального соответствия.
  revised_text: Луга оделись стадами, долины укрылись зерном; они радостно восклицают — они поют.
