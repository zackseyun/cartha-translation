  source_fidelity: 'Основной смысл передан верно: אַשְׁרֵי — блаженство; Божье избрание и приведение человека к Себе; пребывание во дворах святилища; насыщение благами Божьего дома. Однако в масоретском членении вторая часть стиха продолжает первую, а не образует отдельную восклицательную реплику после «во дворах Твоих». Форма נִשְׂבְּעָה естественно передаётся как уверенное «мы насытимся».'
