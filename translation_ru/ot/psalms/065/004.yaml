source:
  edition: WLC
  text: אַשְׁרֵ֤י תִּֽבְחַ֣ר וּ/תְקָרֵב֮ יִשְׁכֹּ֪ן חֲצֵ֫רֶ֥י/ךָ נִ֭שְׂבְּעָה בְּ/ט֣וּב בֵּיתֶ֑/ךָ קְ֝דֹ֗שׁ הֵיכָלֶֽ/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/004.yaml
  text: Blessed is the one you choose and bring near to dwell in your courts[a]; we will be satisfied with the goodness of your house[b], the holiness of your temple.
translation:
  language: ru
  text: Блажен тот, кого Ты избираешь и приближаешь, чтобы он жил во дворах Твоих[a]; мы насытимся благами Твоего дома[b], святыней Твоего храма.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Блажен тот, кого Ты избираешь и приближаешь: он будет жить во дворах Твоих».'
    reason: Синтаксис формы יִשְׁכֹּן допускает как целевое, так и самостоятельное результативное прочтение.
  - marker: b
    text: 'Или: «добром Твоего дома»; слово может означать добро, блага или изобилие.'
    reason: Лексическая широта טוּב включает как качество добра, так и его благие проявления.
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Форма вводит изречение-блаженство. «Блажен» естественно для возвышенной русской речи и не сводит смысл к субъективному ощущению счастья.
- source_word: תִּבְחַר
  choice: избираешь
  rationale: Глагол означает выбирать. «Избираешь» сохраняет торжественный регистр и инициативу Бога, не уточняя её в рамках какой-либо поздней богословской системы.
- source_word: וּתְקָרֵב
  choice: приближаешь
  rationale: Каузативная форма указывает, что Бог допускает или приводит человека к Себе; русский переходный глагол «приближаешь» передаёт эту силу формы.
- source_word: יִשְׁכֹּן
  choice: чтобы он жил
  rationale: Морфологически это форма 3-го лица единственного числа; целевая конструкция естественно связывает её с избранием и приближением, не устраняя синтаксическую альтернативу, отмеченную в сноске.
- source_word: חֲצֵרֶיךָ
  choice: во дворах Твоих
  rationale: В храмовом контексте речь идёт о дворах святилища; конкретный образ сохранён.
- source_word: נִשְׂבְּעָה
  choice: Насытимся
  rationale: Когортатив допускает волевое выражение и уверенное ожидание. Краткая форма «насытимся» сохраняет эту смысловую ёмкость.
- source_word: בְּטוּב
  choice: благами
  rationale: טוּב может обозначать как доброту или благо, так и даруемые блага, изобилие. Во множественном числе русский текст естественно выражает благодатные дары Божьего дома; альтернатива отмечена в сноске.
- source_word: בֵּיתֶךָ
  choice: дома Твоего
  rationale: В параллели с храмом это конкретное обозначение Божьего святилища.
- source_word: קְדֹשׁ
  choice: святыней
  rationale: Слово выражает святость или святыню и здесь связано с храмом. Творительный падеж продолжает управление глагола «насытимся» и сохраняет приложение к благам Божьего дома.
- source_word: הֵיכָלֶךָ
  choice: храма Твоего
  rationale: Хотя слово может означать дворец, контекст дворов и Божьего дома ясно указывает на храм.
theological_decisions:
- issue: Божье избрание и приближение человека к поклонению
  choice: Сохранено прямое утверждение, что Бог избирает и приближает человека.
  alternative: Истолковать эти слова либо как специальный термин предопределения, либо исключительно как обрядовый выбор служителя.
  rationale: Еврейский текст ясно отдаёт инициативу Богу, но сам по себе не определяет полный догматический объём этого избрания.
- issue: Храмовая образность
  choice: Сохранены конкретные слова «дворы», «дом» и «храм».
  alternative: Заменить их обобщёнными выражениями о Божьем присутствии.
  rationale: Стих укоренён в храмовом поклонении Израиля; возможный более широкий богословский смысл не должен вытеснять исходные образы.
- issue: Связь «святыни» с насыщением
  choice: «Святыней храма Твоего» прочитано как продолжение того, чем насыщается община.
  alternative: 'Понять заключительные слова как отдельное восклицание: «свят храм Твой».'
  rationale: Масоретский текст допускает сжатую поэтическую связь; выбранное чтение лучше продолжает параллелизм «благами дома», не устраняя священный характер храма.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, псалмическим звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Конкретная храмовая лексика сохранена; синтаксис сделан ясным без устранения поэтической неоднозначности.
