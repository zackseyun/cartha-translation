  source_fidelity: '«Напои её борозды» точно передаёт תְּלָמֶיהָ רַוֵּה. Однако נַחֵת означает прежде всего «дай осесть / осади», а не непременно «разровняй»: выравнивание — возможный результат, но не прямое значение глагола. Гְּדוּדֶיהָ в этом контексте обычно понимается как комья (или возвышения) вспаханной земли; «гребни» возможно, но менее надёжно как основной вариант. צִמְחָהּ — рост, произрастание, растительность в целом; «всходы» несколько неоправданно сужает значение до ранней стадии роста.'
