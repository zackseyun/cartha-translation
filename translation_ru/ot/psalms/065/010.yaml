source:
  edition: WLC
  text: תְּלָמֶ֣י/הָ רַ֭וֵּה נַחֵ֣ת גְּדוּדֶ֑י/הָ בִּ/רְבִיבִ֥ים תְּ֝מֹגְגֶ֗/נָּה צִמְחָ֥/הּ תְּבָרֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/065/010.yaml
  text: Saturate its furrows; settle its ridges. With showers you soften it; you bless its growth.
translation:
  language: ru
  text: Напои её борозды, дай осесть её комьям[a]; ливнями размягчи её, благослови её рост.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осади её возвышения».'
    reason: Еврейские נַחֵת и גְּדוּדֶיהָ допускают понимание как оседание возвышений почвы; основной текст передаёт также распространённое понимание גְּדוּדֶיהָ как комьев земли.
lexical_decisions:
- source_word: רַוֵּה
  choice: Напои
  rationale: Побудительная форма передаёт обильное насыщение земли водой; «напои» естественно звучит по-русски и сохраняет образ.
- source_word: נַחֵת
  choice: разровняй
  rationale: Глагол выражает опускание или оседание неровностей; в земледельческом контексте «разровняй» ясно передаёт результат действия дождя.
- source_word: גְּדוּדֶיהָ
  choice: её гребни
  rationale: Слово здесь обозначает возвышения почвы между бороздами либо комья земли; «гребни» сохраняет противопоставление бороздам и не сужает образ до одной конкретной техники обработки.
- source_word: תְּמֹגְגֶנָּה
  choice: размягчи её
  rationale: Глагол буквально связан с таянием или растворением; применительно к земле речь идёт о размягчении дождём.
- source_word: צִמְחָהּ
  choice: её всходы
  rationale: Существительное обозначает то, что произрастает; «всходы» естественно передаёт молодую растительность, благословляемую Богом.
theological_decisions:
- issue: Характер Божьего действия в плодородии земли
  choice: 'Сохранена прямая последовательность обращённых к Богу повелительных форм: «напои… разровняй… размягчи… благослови».'
  alternative: 'Передать как повествовательные утверждения: «Ты напояешь… разравниваешь…».'
  rationale: Масоретская вокализация поддерживает формы, которые естественно читаются как просьбы или поэтические повеления; перевод не превращает их в отвлечённое описание и сохраняет зависимость роста от Божьего благословения.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Повторы местоимения «её» сохраняют единство образа земли из контекста псалма; земледельческая лексика понятна без архаизации.
