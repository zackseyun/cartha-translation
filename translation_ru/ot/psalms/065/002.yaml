lexical_decisions:
- source_word: שֹׁמֵעַ
  choice: слышащий
  rationale: Субстантивированное причастие qal, обращённое к Богу; причастие «слышащий» естественно сохраняет длительную характеристику адресата.
- source_word: תְּפִלָּה
  choice: молитву
  rationale: 'Единственное число употреблено обобщённо: Бог слышит молитву как таковую, а не одну определённую молитву.'
- source_word: עָדֶיךָ
  choice: к Тебе
  rationale: Предлог עַד с суффиксом и последующим глаголом движения обозначает направленность к адресату.
- source_word: כָּל־בָּשָׂר
  choice: всякая плоть
  rationale: Буквальный поэтический оборот сохраняет образность и широкий смысл — всё человечество; в современном русском библейско-поэтическом регистре «всякая плоть» звучит естественнее, чем «вся плоть».
- source_word: יָבֹאוּ
  choice: придёт
  rationale: Имперфект 3-го лица множественного числа передаёт предстоящее действие; при собирательном подлежащем «всякая плоть» по-русски требуется единственное число.
theological_decisions:
- issue: Объём значения כָּל־בָּשָׂר
  choice: универсальный человеческий охват, выраженный как «всякая плоть»
  alternative: «все люди» или «всё человечество»
  rationale: Оборот широко указывает на человечество, приходящее к Богу; буквальный образ не сужает охват и сохраняет поэтическое и богословское напряжение текста.
translation_notes:
  register: Современный литературный русский с возвышенной псалмовой интонацией. Местоимения обращения к Богу написаны с прописной буквы по принятой русской библейской традиции; инверсия и восклицание передают еврейское обращение без архаизмов.
