translation:
  language: ru
  text: утверждающий горы силой Своей, опоясанный могуществом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵכִין
  choice: утверждающий
  rationale: Причастие породы хифиль от כון выражает приведение в твёрдое, устойчивое состояние; «утверждающий» естественно передаёт это значение применительно к горам и сохраняет причастную форму.
- source_word: הָרִים
  choice: горы
  rationale: הָרִים прямо означает «горы»; в русском языке определённость здесь не требует отдельного выражения.
- source_word: בְּכֹחוֹ
  choice: силой Своей
  rationale: כֹּחַ означает силу или мощь, а предлог ב здесь естественно понимается инструментально. Постпозиция «Своей» поддерживает возвышенный поэтический регистр без архаизации.
- source_word: נֶאְזָר
  choice: препоясанный
  rationale: Причастие нифаля от אזר сохраняет образ того, кто опоясан и тем самым снаряжён; «препоясанный» точно и ёмко передаёт метафору.
- source_word: בִּגְבוּרָה
  choice: могуществом
  rationale: גְּבוּרָה обозначает мощь, могущество. Этот выбор сохраняет различие с כֹּחַ («сила») и хорошо сочетается с образом препоясывания.
theological_decisions:
- issue: Соотношение двух причастий
  choice: 'Оба еврейских причастия переданы согласованными определениями: «утверждающий… препоясанный…»'
  alternative: 'Передать второе причастие отдельным придаточным или личной формой: «Который препоясан могуществом».'
  rationale: Так сохраняются синтаксический параллелизм и описательный характер исходного текста без навязывания дополнительной временной или логической связи.
- issue: Образное описание Божьей силы
  choice: Сохранить телесную метафору «препоясанный могуществом».
  alternative: Разъяснить образ как «вооружённый силой» или абстрагировать его как «исполненный могущества».
  rationale: Исходный текст поэтически представляет могущество как то, чем Бог препоясан; сохранение образа передаёт его напряжённость и не сводит метафору к отвлечённому утверждению.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. Причастная конструкция сохраняет форму еврейской строки; слова «утверждающий» и «препоясанный» понятны современному читателю, хотя имеют возвышенную окраску. Поскольку отдельной необходимой текстовой или смысловой альтернативы нет, сноски не добавлены.
