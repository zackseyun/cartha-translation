  source_fidelity: «По установлению для Израиля» выбирает нормативное значение עֵדוּת и тем самым снимает реально существующую лексическую неоднозначность; английская контрольная версия сохраняет более буквальное «as a testimony for Israel». Кроме того, передача и יָהּ, и יהוה словами «Господни / Господа» стирает заметное в еврейском тексте различие краткой формы имени и тетраграмматона. Предлагаемый текст сохраняет повтор, направление восхождения, целевое значение инфинитива и это различие.
