  terminology: «Колена» — устойчивое русское библейское обозначение племён Израиля. «Ях» передаёт יָהּ как краткую форму божественного имени; «Господь» остаётся традиционной передачей יהוה. Примечание объясняет диапазон עֵדוּת, не навязывая вариант «установление».
