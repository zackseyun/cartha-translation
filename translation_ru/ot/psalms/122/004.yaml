  yaml_path: translation/ot/psalms/122/004.yaml
  text: There the tribes went up, the tribes of Yah, as a testimony for Israel, to give thanks to the name of the LORD.
translation:
  language: ru
  text: Туда восходили колена, колена Яха, как свидетельство для Израиля[a], чтобы воздавать благодарность имени Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как установленное для Израиля предписание». Еврейское слово может обозначать как свидетельство, так и установление.'
    reason: Сохраняет лексическую неоднозначность עֵדוּת, не выбирая в основном тексте спорное нормативное толкование.
lexical_decisions:
- source_word: עָלוּ
  choice: восходили
  rationale: Перфект допускает взгляд на установившееся паломническое действие; русское «восходили» естественно передаёт как географическое, так и культовое восхождение в Иерусалим.
- source_word: שִׁבְטֵי יָהּ
  choice: колена Господни
  rationale: Краткая поэтическая форма божественного имени יָהּ передана традиционным и понятным русским обозначением принадлежности Господу, без искусственного «колена Ях».
- source_word: עֵדוּת לְיִשְׂרָאֵל
  choice: по установлению для Израиля
  rationale: עֵדוּת может означать свидетельство, предписание или установленное требование; в контексте паломничества выражение указывает на данное Израилю установление, при сохранении смысловой связи со свидетельством завета.
- source_word: לְהֹדוֹת
  choice: чтобы благодарить
  rationale: Инфинитив выражает цель восхождения; «благодарить» естественно передаёт хвалебно-благодарственное значение ידה.
- source_word: שֵׁם יְהוָה
  choice: имя Господа
  rationale: Передано в соответствии с устойчивой русской библейской традицией чтения тетраграмматона как «Господь».
theological_decisions:
- issue: Значение עֵדוּת לְיִשְׂרָאֵל
  choice: по установлению для Израиля
  alternative: как свидетельство для Израиля
  rationale: В контексте обязательного паломничества вероятнее нормативное значение «установление/предписание», однако лексическая связь со «свидетельством» остаётся подлинной смысловой возможностью.
- issue: Передача יָהּ и יהוה
  choice: Господни / Господа
  alternative: Ях / Яхве
  rationale: Традиционная передача обеспечивает достоинство и понятность современному русскому читателю; различие еврейских форм не воспроизводится транслитерацией, чтобы избежать непривычного и конфессионально маркированного звучания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим строем. Сохранены ключевые повторы «колена, колена» и «восходили»; синтаксис сделан ясным без устранения поэтической плотности оригинала.
