source:
  edition: WLC
  text: שִׁ֥יר הַֽ/מַּעֲל֗וֹת לְ/דָ֫וִ֥ד שָׂ֭מַחְתִּי בְּ/אֹמְרִ֣ים לִ֑/י בֵּ֖ית יְהוָ֣ה נֵלֵֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/001.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: ru
  text: 'Песнь восхождений.[a] Давида.[b]


    Я обрадовался, когда мне сказали:


    «Пойдём в дом Яхве».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский заголовок буквально означает «Песнь восхождений». Вероятно, он связан с паломничеством в Иерусалим или с литургическим употреблением; возможен также перевод «Песнь подъёмов».
    reason: cultural_note
  - marker: b
    text: Еврейское выражение может указывать на авторство Давида, посвящение ему или иную связь с ним.
    reason: textual_ambiguity
  - marker: c
    text: Яхве — передача еврейского имени יהוה (YHWH), которое также традиционно передают как «Господь» или «Иегова».
    reason: divine_name
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Передаёт форму еврейского заголовка и сохраняет образ восхождений, не сводя его однозначно к паломничеству, ступеням или литургическому употреблению.
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая форма заголовка естественна по-русски и, в отличие от «написанная Давидом», не утверждает однозначно авторство.
- source_word: שָׂמַחְתִּי
  choice: Я обрадовался
  rationale: Точно и естественно выражает наступившую радость говорящего; вариант «я был рад» также возможен, но менее выразителен.
- source_word: בְּאֹמְרִים לִי
  choice: когда мне сказали
  rationale: Естественно передаёт временно-обстоятельственное значение конструкции и неопределённое множество говорящих.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Сохраняет конструкцию «дом YHWH» и передаёт имя Бога личным именем, а не заменяет его титулом.
- source_word: נֵלֵךְ
  choice: Пойдём
  rationale: Передаёт побудительно-пригласительную силу формы первого лица множественного числа и звучит естественно в прямой речи.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. «Яхве» непосредственно обозначает это имя; примечание сообщает читателю о традиционных вариантах, не подменяя имя титулом в основном тексте.
- issue: Связь Давида с псалмом
  choice: Давида
  alternative: Давидов; написанная Давидом; для Давида
  rationale: Предлог לְ в надписаниях допускает авторство, посвящение или более широкую связь. Основной текст и примечание сохраняют эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Заголовок отделён от стиха; прямая речь оформлена естественно. Сохранены множественное число в «восхождений», неопределённость надписания לְדָוִד и личное имя Яхве.
