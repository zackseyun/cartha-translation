lexical_decisions:
- source_word: לְמַעַן
  choice: Ради
  rationale: 'Передаёт основание и побуждение: псалмопевец произносит пожелание ради блага своих братьев и друзей.'
- source_word: אַחַי
  choice: моих братьев
  rationale: Сохраняет мужской род и форму множественного числа еврейского слова с суффиксом первого лица; в контексте речь идёт о соплеменниках и участниках общей общины.
- source_word: וְרֵעָי
  choice: и друзей
  rationale: רֵעַ может обозначать друга, близкого, спутника или ближнего. «Друзей» естественно звучит по-русски и сохраняет личный, общинный характер параллели с «братьями».
- source_word: אֲדַבְּרָה
  choice: скажу
  rationale: Когортативная форма выражает намерение или решимость говорящего. Перед прямой речью русское «скажу» естественнее буквального «буду говорить».
- source_word: נָּא
  choice: же
  rationale: Частица «же» передаёт усиленное волеизъявление и решимость, не сводя נָא исключительно к временному значению «теперь» или к просьбе «прошу»; неоднозначность отмечена в сноске.
- source_word: שָׁלוֹם
  choice: Мир
  rationale: Традиционное и ёмкое соответствие, сохраняющее основной смысл покоя и согласия; более широкий диапазон благополучия и целостности отмечен в сноске.
- source_word: בָּךְ
  choice: в тебе
  rationale: Буквально сохраняет предлог ב и прямое обращение во втором лице женского рода к Иерусалиму как к городу.
theological_decisions:
- issue: Обозначение родства
  choice: моих братьев
  alternative: моих близких; моих братьев и сестёр
  rationale: В еврейском тексте стоит форма мужского рода множественного числа. Перевод сохраняет её, не исключая подразумеваемого общинного смысла и не вводя отсутствующее в форме уточнение.
- issue: Адресат пожелания мира
  choice: «Мир да будет в тебе!» — прямое обращение к Иерусалиму
  alternative: «Да будет в нём мир»; «Мир тебе»
  rationale: Суффикс второго лица женского рода указывает на персонифицированный Иерусалим. «В тебе» сохраняет и прямое обращение, и пространственный оттенок оригинала.
- issue: Характер высказывания אֲדַבְּרָה־נָּא
  choice: 'решительное намерение: «скажу же»'
  alternative: «теперь скажу»; просительное «скажу, прошу»
  rationale: Сочетание допускает оттенки побуждения, настойчивости и непосредственности. Основной текст сохраняет волевую силу, а лексическая неоднозначность частицы вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «скажу же» уместна в псалме и передаёт решимость без тяжеловесности; пожелательная конструкция «Мир да будет в тебе» сохраняет прямое обращение к Иерусалиму.
