  yaml_path: translation/ot/psalms/122/009.yaml
  text: For the sake of the house of Yahweh our God[a], I will seek your good.
translation:
  language: ru
  text: 'Ради дома Яхве, нашего Бога,

    буду искать твоего блага[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду искать для тебя добра»; возможно: «буду искать твоего благополучия» или «процветания для тебя». Под «благом» подразумевается благополучие Иерусалима.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: Ради
  rationale: Передаёт мотив действия кратко и естественно; здесь псалмопевец действует ради дома Бога.
- source_word: בֵּית יְהוָה
  choice: дома Яхве
  rationale: Сохраняет буквальный образ «дома», хотя в контексте речь идёт о храме, и прямо передаёт личное имя יְהוָה как «Яхве».
- source_word: אֱלֹהֵינוּ
  choice: нашего Бога
  rationale: Естественная передача существительного с суффиксом первого лица множественного числа.
- source_word: אֲבַקְשָׁה
  choice: буду искать
  rationale: Форма выражает намерение и решимость говорящего; будущее время естественно передаёт эту направленность, не превращая её в повеление или пожелание.
- source_word: טוֹב
  choice: блага
  rationale: Сохраняет широкое значение еврейского слова — добро, благополучие и пользу — не сужая его только до материального процветания.
- source_word: לָךְ
  choice: для тебя
  rationale: Женский суффикс второго лица относится к Иерусалиму; русская формулировка сохраняет прямое обращение и ясно выражает, кому предназначено благо.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение выражения טוֹב לָךְ
  choice: для тебя блага
  alternative: твоего благополучия / процветания для тебя
  rationale: Более широкое «благо» сохраняет смысловую ёмкость оригинала и связь с миром и благополучием Иерусалима в предыдущем стихе, не ограничивая смысл материальным достатком.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формой. Сохранены поэтический перенос строки, образ «дома Яхве», прямое обращение к Иерусалиму и смысловая широта слова «благо».
