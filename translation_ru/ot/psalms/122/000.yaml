base_translation:
  language: en
  yaml_path: translation/ot/psalms/122/000.yaml
  text: A Song of Ascents[a]. Of David. I rejoiced when they said to me[c][b], “Let us go to the house of Yahweh.”
translation:
  language: ru
  text: 'Песнь восхождений[a]. Давида.


    Я обрадовался, когда мне сказали:


    «Пойдём в дом Господа[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское надписание буквально: «Песнь восхождений»; возможен также перевод: «Песнь ступеней». Вероятно, оно связано с паломничеством в Иерусалим или обозначает литургический сборник.'
    reason: cultural_note
  - marker: b
    text: В еврейском тексте стоит личное имя Бога — יהוה (ЙХВХ), традиционно передаваемое как «Господь»; возможная передача — «Яхве».
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁיר הַמַּעֲלוֹת
  choice: Песнь восхождений
  rationale: Буквально передаёт традиционное название сборника; множественное число сохраняет форму еврейского выражения, а возможный паломнический или литургический смысл поясняется в сноске.
- source_word: שָׂמַחְתִּי
  choice: Я обрадовался
  rationale: Совершенный вид естественно передаёт завершённую реакцию говорящего в данном контексте; вариант «я был рад» также возможен, но менее ясно выражает наступление радости.
- source_word: נֵלֵךְ
  choice: Пойдём
  rationale: 'Передаёт форму первого лица множественного числа с побудительным оттенком: говорящие предлагают вместе отправиться в храм.'
- source_word: בֵּית יְהוָה
  choice: дом Господа
  rationale: «Дом» сохраняет библейское обозначение храма, а «Господь» следует укоренившейся русской традиции передачи тетраграмматона; личное имя отмечено в сноске.
theological_decisions:
- issue: Значение לְדָוִד в надписании
  choice: Давида
  alternative: Для Давида / о Давиде
  rationale: Краткая родительная конструкция сохраняет обычную форму псалмового надписания и не уточняет сверх текста, означает ли она авторство, принадлежность, посвящение или связь с Давидом.
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Традиционная русская передача делает текст естественным и узнаваемым, а сноска сообщает, что в источнике стоит личное имя Бога, не превращая спор о произношении в основной текст.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным ритмом псалма. Надписание отделено от основного стиха. Формулировки понятны обычному читателю, при этом традиционные библейские выражения «песнь восхождений» и «дом Господа» сохранены.
