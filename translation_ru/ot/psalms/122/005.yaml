lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Передаёт объяснительную связь с предыдущими словами псалма и сохраняет возвышенный, но понятный регистр.
- source_word: שָׁמָּה
  choice: там
  rationale: Естественно отсылает к упомянутому Иерусалиму и точно сохраняет значение места.
- source_word: יָשְׁבוּ
  choice: поставлены
  rationale: Буквально глагол означает «сидеть»; при подлежащем «престолы» он описывает их установленность. Русское «престолы сидят» неестественно, поэтому функциональный смысл передан словом «поставлены», а буквальный образ отмечен в сноске.
- source_word: כִסְאוֹת
  choice: престолы
  rationale: Слово обозначает царские и судебные места власти, а не обычные сиденья.
- source_word: לְמִשְׁפָּט
  choice: для суда
  rationale: Передаёт назначение престолов для вынесения судебных решений; возможный оттенок «правосудие» сохранён в сноске.
- source_word: כִסְאוֹת לְבֵית דָּוִיד
  choice: престолы дома Давида
  rationale: Естественно по-русски связывает престолы с Давидовой династией; значение принадлежности или предназначенности не уточняется сверх необходимого.
theological_decisions:
- issue: Характер упоминания дома Давида
  choice: Историческая царская династия Давида и связанная с ней судебная власть в Иерусалиме.
  alternative: Общие городские суды либо явно мессианское толкование.
  rationale: Текст прямо называет престолы и дом Давида. Перевод сохраняет династическую и судебную связь, не внося в сам стих более развёрнутого мессианского истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Инверсия и буквальное «престолы сидят» устранены ради естественности; тире сохраняет поэтический параллелизм.
