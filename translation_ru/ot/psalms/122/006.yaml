lexical_decisions:
- source_word: שַׁאֲלוּ
  choice: Просите
  rationale: Императив глагола שׁאל буквально означает «просите, испрашивайте». В сочетании с абстрактным объектом и в богослужебном контексте подразумевается молитвенное прошение, однако формулировка «просите» сохраняет лексическую широту оригинала.
- source_word: שְׁלוֹם
  choice: мира
  rationale: שָׁלוֹם охватывает мир, благополучие и целостность; «мир» естественен в данном контексте и сохраняет традиционную связь с Иерусалимом.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалиму
  rationale: Дательный падеж передаёт направленность просьбы на мир и благополучие Иерусалима.
- source_word: יִשְׁלָיוּ
  choice: да благоденствуют
  rationale: Форма от שלה может означать пребывание в покое, безопасности или благополучии. «Да благоденствуют» передаёт возможную желательность формы и более широкий смысл, не сводя его лишь к материальному процветанию.
- source_word: אֹהֲבָיִךְ
  choice: любящие тебя
  rationale: Причастие с суффиксом второго лица женского рода обозначает любящих Иерусалим и сохраняет прямое обращение к городу.
theological_decisions:
- issue: Модальность второй строки
  choice: 'Пожелание-молитва: «да благоденствуют»'
  alternative: 'Утверждение или обещание: «будут благоденствовать»'
  rationale: Имперфект в поэзии допускает как желательное, так и изъявительное понимание. После повеления «просите» пожелание звучит естественно, но альтернативное чтение отмечено в сноске, чтобы не устранять неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой интонацией. «Да благоденствуют» естественно передаёт пожелание; прямое обращение «тебя» сохраняет грамматический образ Иерусалима как города женского рода.
