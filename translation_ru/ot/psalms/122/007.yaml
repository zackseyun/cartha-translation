lexical_decisions:
- source_word: יְהִי
  choice: Да будет
  rationale: Юссивная форма глагола היה выражает пожелание или молитву; «да будет» естественно передаёт это значение по-русски.
- source_word: שָׁלוֹם
  choice: мир
  rationale: Слово обозначает мир, целостность и благополучие; в молитве об Иерусалиме «мир» сохраняет основное значение и связь с контекстом.
- source_word: בְּחֵילֵךְ
  choice: в твоих стенах
  rationale: חֵיל здесь обозначает оборонительное ограждение или укрепление города. Выражение «в твоих стенах» понятно как «в пределах городских стен» и сохраняет местное значение предлога בְּ.
- source_word: שַׁלְוָה
  choice: благополучие
  rationale: Слово передаёт спокойную, безопасную и устойчивую жизнь. «Благополучие» сохраняет широту значения, не сводя его только к материальному процветанию или к отсутствию тревоги.
- source_word: בְּאַרְמְנוֹתָיִךְ
  choice: в твоих дворцах
  rationale: אַרְמוֹן может обозначать дворец, цитадель или укреплённое здание. «Дворцы» — прямой и естественный вариант, а оборонительный оттенок отражён в примечании.
