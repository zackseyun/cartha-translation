lexical_decisions:
- source_word: עֹמְדוֹת הָיוּ
  choice: вот, стоят
  rationale: Сочетание причастия с формой היה передаёт длительное состояние. В контексте песни восхождения естественное русское настоящее время живо изображает достигнутое прибытие; «вот» подчёркивает этот результат, не превращая выражение в однократное действие.
- source_word: רַגְלֵינוּ
  choice: наши ноги
  rationale: Буквально сохраняет телесный образ паломников, пришедших в Иерусалим.
- source_word: בִּשְׁעָרַיִךְ
  choice: в твоих воротах
  rationale: Предлог ב допускает значение нахождения в пределах ворот, то есть у городского входа или внутри него. Буквальная формулировка сохраняет пространственную многозначность.
- source_word: יְרוּשָׁלִָם
  choice: Иерусалим
  rationale: Устоявшаяся русская передача названия города.
