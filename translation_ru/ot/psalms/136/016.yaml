  text: to him who led his people in the wilderness[b][a], for his steadfast love endures forever.
translation:
  language: ru
  text: Тому, кто вёл Свой народ по пустыне[a], ибо Его верная любовь вечна[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в пустыне». Русское «по пустыне» естественно передаёт странствие в этой местности.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское «хесед» может означать верную, неизменную любовь, милость или благость; здесь оно говорит о постоянном Божьем благоволении.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמוֹלִיךְ
  choice: Тому, кто вёл
  rationale: 'Порода hифиль глагола הלך выражает побуждение к движению и в данном контексте естественно передаётся глаголом «вёл»; предлог לְ продолжает литанийную конструкцию псалма: «Тому, кто…».'
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: עַם обозначает народ, здесь — принадлежащий Богу народ Израиля. Возвратное «Свой» ясно соотносит народ с действующим лицом и звучит естественно по-русски.
- source_word: בַּמִּדְבָּר
  choice: по пустыне
  rationale: מִדְבָּר — пустынная, необжитая местность. При глаголе движения русское «по пустыне» естественно выражает продвижение в её пределах, хотя предлог בְּ буквально может быть передан как «в».
- source_word: כִּי
  choice: ибо
  rationale: כִּי вводит повторяющееся основание для хвалы. «Ибо» сохраняет краткость, причинный смысл и возвышенный литургический строй рефрена.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Выражение обозначает неограниченную длительность. «Навеки» лаконично и естественно для поэтического рефрена; связка «пребывает» в еврейском тексте отсутствует.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: חֶסֶד включает благость, верную любовь и преданность отношениям завета. Традиционное и понятное русское «милость» сохраняет широту божественного благоволения, а примечание указывает на дополнительные оттенки.
theological_decisions:
- issue: Передача חֶסֶד в рефрене
  choice: милость Его навеки
  alternative: верная любовь Его пребывает вовеки
  rationale: «Милость» не сводит חֶסֶד только к чувству любви и подходит для Божьего неизменного благоволения, явленного в исходе. При этом примечание сохраняет заложенные в слове оттенки верности и преданной любви.
- issue: Добавление глагола в рефрене
  choice: 'без выраженного глагола: «милость Его навеки»'
  alternative: «милость Его пребывает вовеки»
  rationale: В еврейском рефрене именной оборот без глагола. Русская конструкция с тире, охватывающим причинную часть, остаётся ясной и ближе к форме источника, не отрицая подразумеваемой непрерывности милости.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом литании. «Ибо» уместно поддерживает богослужебно-поэтический регистр, не делая текст архаичным. Заглавные местоимения «Свой», «Его» отмечают обращённость текста к Богу согласно принятой русской религиозной письменной традиции.
