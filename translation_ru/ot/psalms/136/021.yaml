    ибо Его неизменная любовь вечна.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в удел» или «во владение». Еврейское נַחֲלָה означает наследственное владение, полученное как удел.'
