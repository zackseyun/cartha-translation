lexical_decisions:
- source_word: וְנָתַן
  choice: и отдал
  rationale: Форма Qal perfect 3-го лица единственного числа с союзом продолжает перечень совершённых Богом деяний. «Отдал» естественно передаёт передачу земли во владение.
- source_word: אַרְצָם
  choice: их землю
  rationale: Слово אֶרֶץ с суффиксом 3-го лица множественного числа обозначает землю побеждённых царей и народов; «земля» точнее и уместнее, чем современное политическое «страна».
- source_word: לְנַחֲלָה
  choice: в наследие
  rationale: נַחֲלָה обозначает наследственный удел, полученное по распределению владение. «В наследие» сохраняет как идею передачи, так и библейский смысл земельного удела.
- source_word: כִּי
  choice: ибо
  rationale: В повторяющемся рефрене כִּי вводит основание для хвалы. «Ибо» сохраняет причинный смысл и торжественный литургический ритм, оставаясь понятным современному читателю.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Наречие передаёт неограниченную продолжительность. Именная конструкция «— навеки» близка к сжатой форме еврейского рефрена и естественна по-русски.
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: חֶסֶד сочетает значения любви, милости, преданности и неизменной верности в отношениях. «Верная любовь» сохраняет одновременно личный и устойчивый характер этого понятия, не сужая его до одного лишь сострадания.
theological_decisions:
- issue: Передача חֶסֶד в рефрене Псалма 136
  choice: Его верная любовь — навеки
  alternative: милость Его вовек; Его неизменная любовь вечна; Его заветная верность — навеки
  rationale: Рефрен говорит о постоянной, деятельной Божьей любви и верности, явленной в истории. «Верная любовь» сохраняет богословскую ёмкость חֶסֶד, но не делает подразумеваемую связь с заветом более явной, чем она выражена в самом слове.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом псалмового рефрена. Союз «ибо» поддерживает богослужебное звучание без архаизации; тире воспроизводит сжатость еврейской именной конструкции.
