  text: לְ֭/סִיחוֹן מֶ֣לֶךְ הָ/אֱמֹרִ֑י כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/019.yaml
  text: Sihon[a], king of the Amorites[c][b], for his steadfast love endures forever.
translation:
  language: ru
  text: 'Сихона, царя аморреев,

    ибо милость Его — навеки.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסִיחוֹן
  choice: Сихона
  rationale: Предлог לְ продолжает синтаксическую связь со сказуемым «поразил» из стиха 18 и обозначает объект действия. В естественном русском языке управление передаётся винительным падежом без отдельного предлога.
- source_word: מֶלֶךְ
  choice: царя
  rationale: Обычный русский эквивалент царского титула; падеж согласован с именем «Сихона».
- source_word: הָאֱמֹרִי
  choice: аморреев
  rationale: Форма в еврейском тексте буквально означает «аморреянин», однако в титуле царя этноним обозначает народ, которым он правил; русское «царь аморреев» естественно и точно передаёт этот смысл.
- source_word: כִּי
  choice: ибо
  rationale: В повторяющемся припеве вводит основание для хвалы. «Ибо» сохраняет причинно-пояснительную связь и соответствует возвышенному поэтическому регистру.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт временное значение «вечно, навсегда» и подходит для литургического припева без добавления отсутствующего в еврейском тексте глагола.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: «Милость» в современном русском библейском регистре ёмко передаёт חסד как благую, верную и неизменную расположенность Бога; местоимение сохраняет суффикс третьего лица.
theological_decisions:
- issue: Передача חֶסֶד в припеве Псалма 136
  choice: милость Его — навеки
  alternative: верная любовь Его — навеки
  rationale: «Милость» сохраняет широкое значение חסד и звучит естественно в русском богослужебно-поэтическом контексте. Вариант «верная любовь» яснее выражает постоянство и преданность, но несколько сильнее истолковывает многозначное еврейское слово.
translation_notes:
  register: Современный литературный русский с достоинством и лаконизмом литургического припева. Первая строка намеренно зависит от глагола предыдущего стиха, как и в еврейском оригинале. Тире обозначает подразумеваемую связку в безглагольном предложении.
