  register: Современный литературный русский язык с умеренно возвышенным, литургически пригодным звучанием. Тире обозначает цель действия и помогает сохранить ритм параллельной поэтической строки. Местоимение «Его» оформлено с прописной буквы по принятой русской библейской традиции.
