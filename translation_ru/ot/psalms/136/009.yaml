lexical_decisions:
- source_word: אֶת
  choice: '[показатель прямого дополнения, не переводится]'
  rationale: Служебная частица вводит продолжение ряда прямых дополнений из предыдущего стиха и не имеет естественного соответствия в русском языке.
- source_word: הַיָּרֵחַ
  choice: луну
  rationale: Обычное обозначение небесного тела; определённость в русском контексте не требует отдельного выражения.
- source_word: וְכוֹכָבִים
  choice: и звёзды
  rationale: Прямое и естественное соответствие форме множественного числа; союз וְ передан как «и».
- source_word: לְמֶמְשְׁלוֹת
  choice: чтобы властвовать
  rationale: Форма выражает назначение луны и звёзд — осуществлять владычество; конструкция с «чтобы» естественно передаёт эту функцию.
- source_word: בַּלָּיְלָה
  choice: над ночью
  rationale: При глаголе «властвовать» предлог «над» естественно передаёт область владычества и сохраняет связь с языком Бытия 1.
- source_word: כִּי
  choice: ибо
  rationale: Вводит повторяющееся основание хвалы; «ибо» сохраняет торжественный литургический ритм, оставаясь понятным современному читателю.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко и ритмично передаёт неограниченную длительность в повторяющемся рефрене.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: «Милость» — ёмкое, естественное и традиционно узнаваемое русское соответствие חֶסֶד; оно передаёт благость и верную любовь Бога, не сводя слово исключительно к чувству.
theological_decisions:
- issue: Передача חֶסֶד в рефрене Псалма 136
  choice: милость Его — навеки
  alternative: верная любовь Его — навеки; неизменная любовь Его — навеки; заветная верность Его — навеки
  rationale: חֶסֶד охватывает милость, неизменную любовь и верность отношениям. «Милость» сохраняет широту и литургическую естественность русского рефрена, а примечание обозначает другие смысловые грани, не закрепляя узкоконфессиональное толкование.
