lexical_decisions:
- source_word: נֹתֵן
  choice: Он даёт
  rationale: Причастие обозначает постоянное действие Бога. В современном русском конечная форма «Он даёт» звучит естественно и сохраняет длительный, характерный смысл контекста.
- source_word: לֶחֶם
  choice: пищу
  rationale: Буквально слово означает «хлеб», но здесь метонимически обозначает пропитание вообще; «пища» не сужает смысл до одного продукта.
- source_word: לְכָל בָּשָׂר
  choice: всякой плоти
  rationale: Сохранён библейский еврейский оборот с широким значением всех живых существ; примечание разъясняет его, не сужая до одного лишь человечества.
- source_word: כִּי
  choice: ведь
  rationale: В рефрене частица вводит основание для хвалы. «Ведь» естественно передаёт причинно-пояснительную связь и подходит к литургическому повтору.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко и ритмично передаёт неограниченную продолжительность в безглагольном рефрене.
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: חֶסֶד сочетает милость, преданность и неизменность любви. «Верная любовь» сохраняет эту смысловую ёмкость лучше, чем более узкие «милость» или «сострадание».
theological_decisions:
- issue: Объём выражения «всякая плоть»
  choice: Все живые существа, при сохранении еврейского образного выражения
  alternative: Всё человечество / все люди
  rationale: В данном контексте выражение охватывает живые существа в целом и подчёркивает всеобщий Божий промысел; ограничивать его людьми текст не требует.
translation_notes:
  register: Современный литературный русский с лаконичным литургическим ритмом. Сохранён библейский оборот «всякой плоти», а его значение разъяснено в сноске. Прописное «Его» соответствует принятому благоговейному издательскому регистру.
