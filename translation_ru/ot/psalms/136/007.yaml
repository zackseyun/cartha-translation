  text: לְ֭/עֹשֵׂה אוֹרִ֣ים גְּדֹלִ֑ים כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/007.yaml
  text: To him who made the great lights[b][a], for his steadfast love endures forever.
translation:
  language: ru
  text: Тому, Кто сотворил великие светила[a], — ибо милость Его вечна[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великие источники света». Речь идёт о небесных светилах.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ибо Его верная любовь — вовеки». Еврейское חֶסֶד означает милость, неизменную любовь и преданность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: Тому, Кто сотворил
  rationale: Предлог לְ передаёт адресата хвалы в повторяющейся литанийной конструкции псалма. Причастие עֹשֵׂה здесь естественно передать русским придаточным о завершённом деянии Творца.
- source_word: אוֹרִים גְּדֹלִים
  choice: великие светила
  rationale: אוֹרִים обозначает небесные источники света и перекликается с языком Быт. 1. «Светила» точнее, чем общее «светы», а «великие» сохраняет прямое значение גְּדֹלִים и возвышенный регистр.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит повторяющееся основание для хвалы. «Ибо» естественно для торжественного литургического рефрена и сохраняет причинно-пояснительную связь.
- source_word: לְעוֹלָם
  choice: вечна
  rationale: Буквально выражает длительность «вовеки». В русском именная конструкция «милость Его вечна» кратко и естественно передаёт непреходящий характер рефрена.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: חֶסֶד охватывает милость, верную любовь и преданность. Традиционно понятное русское «милость» уместно в псалме, а примечание сохраняет более широкий смысл исходного слова.
theological_decisions:
- issue: Передача חֶסֶד в постоянном рефрене
  choice: милость Его вечна
  alternative: верная любовь Его — вовеки; Его неизменная любовь вечна
  rationale: «Милость» сохраняет ёмкость и литургическую узнаваемость, не сводя חֶסֶד исключительно к чувству или юридически понимаемой верности завету. Примечание указывает на оттенок постоянной, преданной любви.
translation_notes:
  register: Современный литературный русский с достоинством псалмового рефрена. Инверсия «милость Его» поддерживает литургический ритм; заглавная буква в «Кто» и местоимении «Его» соответствует принятому благоговейному библейскому регистру.
