  text: וַ/יִּפְרְקֵ֥/נוּ מִ/צָּרֵ֑י/נוּ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/024.yaml
  text: and rescued us from our foes[a], for his steadfast love endures forever.
translation:
  language: ru
  text: 'и избавил нас от наших врагов[a],

    ибо милость Его — навеки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и освободил нас от наших противников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרְקֵנוּ
  choice: и избавил нас
  rationale: Глагол פרק с объектным суффиксом 1-го лица множественного числа означает освобождение или спасение от опасности и притеснения. «Избавил нас» естественно звучит по-русски и сохраняет широту значения.
- source_word: מִצָּרֵינוּ
  choice: от наших врагов
  rationale: Форма обозначает враждебных людей или притеснителей. «Врагов» — ясный, точный и стилистически уместный эквивалент; возможен также более книжный вариант «противников».
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит повторяющееся основание для хвалы. «Ибо» сохраняет объяснительную функцию и торжественный литургический ритм псалма.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Выражение указывает на неограниченную продолжительность. «Навеки» лаконично и естественно для повторяющегося поэтического рефрена.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: חֶסֶד охватывает милость, благость и верную, неизменную любовь. Традиционное русское «милость» понятно и ёмко, хотя не исчерпывает оттенок верности; контекст всего рефрена подчёркивает её постоянство.
theological_decisions:
- issue: Передача חֶסֶד в рефрене Псалма 136
  choice: милость Его — навеки
  alternative: верная любовь Его — навеки
  rationale: «Милость» сохраняет привычный, достойный и литургически пригодный русский рефрен, не сводя действие Бога лишь к чувству. Вариант «верная любовь» явнее передаёт постоянство и лояльность, но по-русски менее естественен в данном поэтическом повторе.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным литургическим звучанием. Инверсия «милость Его» и союз «ибо» поддерживают ритм рефрена; тире естественно восполняет отсутствующую в еврейском именную связку.
