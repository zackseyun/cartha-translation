source:
  edition: WLC
  text: נַ֭חֲלָה לְ/יִשְׂרָאֵ֣ל עַבְדּ֑/וֹ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/022.yaml
  text: an inheritance to Israel his servant[b][a], for his steadfast love endures forever.
translation:
  language: ru
  text: 'в наследие[a] Израилю, рабу Своему,

    ибо вечна милость Его[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как удел»; также возможно: «как владение».'
    reason: lexical_alternative
  - marker: b
    text: Древнееврейское слово также выражает верную, неизменную любовь и преданность.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה
  choice: в наследие
  rationale: Слово обозначает наследственный удел или владение; предложное сочетание естественно продолжает мысль предыдущего стиха о земле, данной Израилю.
- source_word: לְיִשְׂרָאֵל
  choice: Израилю
  rationale: Предлог לְ указывает на получателя удела; русский дательный падеж точно и естественно передаёт эту функцию.
- source_word: עַבְדּוֹ
  choice: рабу Своему
  rationale: Здесь это закреплённое обозначение Израиля как принадлежащего Богу и служащего Ему; «раб» сохраняет силу древнееврейского слова и соответствует возвышенному библейскому регистру.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит повторяющийся литургический рефрен как основание для хвалы.
- source_word: לְעוֹלָם
  choice: вечна
  rationale: В сочетании с חַסְדּוֹ передаёт непрекращающуюся длительность Божьей милости.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: «Милость» естественно для русского псалмического языка и охватывает Божью благость и верность, хотя весь смысл חֶסֶד шире одного сострадания.
theological_decisions:
- issue: Отношение Израиля к Богу в עַבְדּוֹ
  choice: рабу Своему
  alternative: слуге Своему
  rationale: Контекст представляет Израиль как Божий народ, принадлежащий Ему и служащий Ему. «Раб» точнее сохраняет силу исходного существительного, не добавляя идеи принудительного рабства, которой стих особо не подчёркивает.
- issue: Передача חַסְדּוֹ в рефрене
  choice: милость Его
  alternative: Его верная любовь
  rationale: «Милость» сохраняет краткость и литургическую звучность рефрена; примечание удерживает присущие חֶסֶד оттенки постоянства, верности и любви, не сводя слово лишь к состраданию.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным псалмическим ритмом. Инверсия «милость Его» сохраняет торжественное звучание повторяющегося рефрена; прописная буква в «Своему» ясно указывает на Бога.
