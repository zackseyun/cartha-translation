lexical_decisions:
- source_word: אֶת
  choice: '[отдельно не переводится]'
  rationale: Показатель определённого прямого дополнения; в русском синтаксисе передаётся винительным падежом слова «солнце» и отдельно не выражается.
- source_word: הַשֶּׁמֶשׁ
  choice: солнце
  rationale: Прямое и естественное соответствие определённому существительному; винительный падеж совпадает по форме с именительным.
- source_word: לְמֶמְשֶׁלֶת
  choice: чтобы оно правило
  rationale: Еврейское существительное означает «владычество, управление». Придаточная конструкция естественно передаёт назначение солнца и подразумеваемую связь с действием сотворения в предыдущем стихе.
- source_word: בַּיּוֹם
  choice: днём
  rationale: Творительный времени кратко и естественно обозначает период, в который солнце осуществляет своё правление.
- source_word: כִּי
  choice: ведь
  rationale: Передаёт обосновывающий смысл повторяющегося рефрена и сохраняет естественное литургическое звучание по-русски.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Передаёт неограниченную длительность; сохраняет краткость без добавления отсутствующего в еврейском тексте глагола.
- source_word: חַסְדּוֹ
  choice: Его неизменная любовь
  rationale: חֶסֶד включает любовь, верность, благоволение и милость. «Неизменная любовь» ясно передаёт устойчивость и преданность, не сводя смысл только к состраданию.
theological_decisions:
- issue: Передача חֶסֶד в рефрене Псалма 136
  choice: Его неизменная любовь навеки
  alternative: милость Его вовек; Его верная любовь навеки; Его заветная верность вечна
  rationale: Выбранный вариант сохраняет смысл постоянной, деятельной и верной любви Бога, но не вводит в основной текст слово «завет», которого в данном выражении нет, и не ограничивает многозначное חֶסֶד одной лишь милостью.
- issue: Глагольность фразы לְמֶמְשֶׁלֶת בַּיּוֹם
  choice: чтобы оно правило днём
  alternative: для владычества днём; чтобы управлять днём
  rationale: В еврейском стоит существительное «владычество», однако по-русски целевая придаточная конструкция звучит естественнее. Она не определяет характер этого правления сверх сказанного в исходном тексте.
translation_notes:
  register: Современный литературный русский с поэтической краткостью рефрена. Местоимение «оно» устраняет неестественный для русского оборот «солнце — править», а тире обозначает переход к повторяющемуся литургическому рефрену.
