lexical_decisions:
- source_word: בְּיָד חֲזָקָה
  choice: рукою крепкою
  rationale: Предлог ב обозначает орудие действия; «крепкая рука» прямо передаёт образ силы и сохраняет узнаваемую библейскую формулу исхода.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: и простёртою мышцею
  rationale: Сохраняется параллельный образ действующей силы. «Мышца» в современном литературном русском несколько возвышенно, но ясно отличает זְרוֹעַ от יָד и поддерживает межтекстовую формулу.
- source_word: כִּי
  choice: ибо
  rationale: Вводит основание для хвалы и естественно звучит в повторяющемся литургическом рефрене.
- source_word: לְעוֹלָם
  choice: вечна
  rationale: Именное предложение без выраженной связки естественно передаётся по-русски кратким сказуемым «вечна», сохраняя значение непрекращающейся длительности.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: «Милость» — естественный и ёмкий русский эквивалент חֶסֶד, охватывающий благоволение, верность и деятельную доброту; местоимение сохраняет суффикс третьего лица.
theological_decisions:
- issue: Передача חֶסֶד в рефрене Псалма 136
  choice: милость Его вечна
  alternative: верная любовь Его вечна; заветная верность Его вечна
  rationale: «Милость» сохраняет широту понятия и привычность псалмового рефрена, не сводя его исключительно к чувству или к техническому понятию завета. Смысл верности и постоянства поясняется в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, псалмовым звучанием. Формы «рукою», «мышцею» выбраны для ритмического параллелизма и достоинства рефрена; архаические синтаксические конструкции избегаются.
