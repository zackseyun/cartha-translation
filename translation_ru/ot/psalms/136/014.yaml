  text: and brought Israel through the midst of it[b][a], for his steadfast love endures forever.
translation:
  language: ru
  text: 'и провёл народ Израиля через его середину[a],

    ибо милость Его — навеки[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и дал народу Израиля пройти через его середину».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово חֶסֶד может также означать «верная любовь» или «верность завету».
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֶעֱבִיר
  choice: и провёл
  rationale: Каузативная порода глагола עבר означает «провести, дать пройти». «Провёл» естественно звучит по-русски и сохраняет как действие Бога, так и образ движения через море.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятая русская форма имени народа.
- source_word: בְּ/תוֹכ֑/וֹ
  choice: посреди него
  rationale: Буквально «в/через середину его»; местоимение мужского рода соотносится с морем из предыдущего стиха. В сочетании с «провёл» выражение ясно передаёт движение через самую середину моря.
- source_word: כִּי
  choice: ибо
  rationale: В повторяющемся богослужебном рефрене вводит основание для хвалы. «Ибо» сохраняет причинную связь и придаёт строке уместное достоинство.
- source_word: לְ/עוֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт непреходящую длительность; тире восполняет отсутствующую в еврейской именной фразе связку.
- source_word: חַסְדּֽ/וֹ
  choice: милость Его
  rationale: חֶסֶד объединяет значения милости, верной любви и заветной преданности. Традиционное и понятное русское «милость» хорошо соответствует контексту спасительного деяния, а сноска сохраняет более широкий смысловой диапазон.
theological_decisions:
- issue: Передача חֶסֶד в рефрене Псалма 136
  choice: милость Его — навеки
  alternative: верная любовь Его — навеки; заветная верность Его — навеки
  rationale: «Милость» естественно и лаконично описывает Божье благоволение, явленное в спасительных деяниях, не сводя слово только к чувству или только к формальному заветному обязательству. Сноска отмечает присущие еврейскому слову оттенки верной любви и заветной преданности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, пригодным для богослужебного рефрена звучанием. Сохранён параллелизм с соседними стихами и местоименная отсылка к морю; порядок сносок приведён в последовательность [a], [b].
