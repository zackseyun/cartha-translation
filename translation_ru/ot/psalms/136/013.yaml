  text: to him who divided the Sea of Reeds into parts[a], for his steadfast love endures forever.
translation:
  language: ru
  text: 'разделившему море Тростников на части[a],


    ибо его милость — навеки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Красное море». В еврейском тексте: «море Тростников».'
    reason: alternative_reading
lexical_decisions:
- source_word: לְגֹזֵר
  choice: разделившему
  rationale: Предлог לְ в литании указывает на Того, Кого восхваляют, а причастие от גזר передаёт действие рассечения или разделения. Форма «разделившему» естественно продолжает синтаксический ряд псалма.
- source_word: יַם סוּף
  choice: Море Тростников
  rationale: Буквальное значение еврейского названия — «Море Тростников». Традиционное «Красное море» сохранено в примечании.
- source_word: לִגְזָרִים
  choice: на части
  rationale: Существительное גְזָרִים обозначает отделённые части; выражение «на части» ясно и естественно передаёт образ рассечённого моря.
- source_word: כִּי
  choice: ибо
  rationale: В повторяющемся рефрене псалма союз вводит основание для хвалы. «Ибо» соответствует торжественному регистру и сохраняет причинную связь.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Краткое наречное выражение сохраняет безглагольную структуру еврейского рефрена и передаёт неограниченную длительность.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: חֶסֶד включает верную, неизменную благость и милость. «Милость» понятно современному читателю, укоренено в русской библейской речи и не сужает значение до названной конфессиональной формулы.
theological_decisions:
- issue: Передача חֶסֶד в рефрене
  choice: милость Его
  alternative: Его неизменная любовь
  rationale: «Милость» сохраняет традиционно узнаваемый и богословски ёмкий русский эквивалент, тогда как «неизменная любовь» яснее раскрывает устойчивость, но несколько поясняет многозначное еврейское слово. Подлинная смысловая широта не сводится исключительно к заветной терминологии.
translation_notes:
  register: Современный литературный русский с достоинством псалмового рефрена. Дательный оборот «разделившему» сохраняет связь со строением литании; инверсия «милость Его» поддерживает торжественный ритм и последовательность повторяющегося припева.
