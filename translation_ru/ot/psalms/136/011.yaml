  text: וַ/יּוֹצֵ֣א יִ֭שְׂרָאֵל מִ/תּוֹכָ֑/ם כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/011.yaml
  text: and brought Israel out from among them[b][a], for his steadfast love endures forever.
translation:
  language: ru
  text: 'и вывел Израиль из их среды,

    ибо милость Его — навеки.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: и вывел
  rationale: 'Порода hифиль глагола יצא имеет каузативное значение: «вывести». Русское «вывел» естественно и точно передаёт действие Бога, не уточняя способ.'
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Собственное имя здесь обозначает народ Израиля; сохраняется традиционная русская форма.
- source_word: מִתּוֹכָם
  choice: из их среды
  rationale: Выражение указывает на выход изнутри сообщества, в контексте — из среды египтян. Формулировка близка структуре древнееврейского текста и естественна для литературного русского языка.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит повторяющееся основание для хвалы. «Ибо» сохраняет причинный смысл и торжественно-литургический ритм рефрена.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Передаёт неограниченную длительность; в русском именная конструкция с тире естественно сохраняет отсутствие выраженного глагола в древнееврейском тексте.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: חסד объединяет значения благости, верности и милосердия. «Милость» — понятный и укоренённый русский эквивалент; контекст всего псалма раскрывает её как постоянную и верную благость Бога.
theological_decisions:
- issue: Передача חַסְדּוֹ в рефрене Псалма 136
  choice: милость Его — навеки
  alternative: верная любовь Его пребывает вовеки
  rationale: «Милость» не сводит выражение исключительно к эмоциональной любви и сохраняет широкий смысл благого, верного отношения Бога. Безглагольная конструкция с тире не добавляет к оригиналу конкретный глагол и сохраняет ёмкость и напряжение древнееврейского рефрена.
translation_notes:
  register: Современный литературный русский с достоинством и ритмом псалмового рефрена. Инверсия «милость Его» поддерживает возвышенный, но понятный регистр; архаические формы вроде «из среды их» и «вовек» не используются.
