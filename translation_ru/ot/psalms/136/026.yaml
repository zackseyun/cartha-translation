  text: Give thanks to the God of heaven[a], for his steadfast love endures forever.
translation:
  language: ru
  text: Благодарите Бога небес, ибо его неизменная любовь — навеки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его верность завету — навеки». Еврейское חֶסֶד может обозначать неизменную, преданную любовь и в контексте отношений Бога с его народом нередко имеет оттенок верности завету.'
