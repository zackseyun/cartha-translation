lexical_decisions:
- source_word: הוֹדוּ
  choice: Благодарите
  rationale: Форма повелительного наклонения во множественном числе призывает общину воздавать Богу благодарность; этот вариант естественно передаёт повторяющийся литургический призыв псалма.
- source_word: לְאֵל הַשָּׁמָיִם
  choice: Бога небес
  rationale: אֵל здесь обозначает Бога, а הַשָּׁמָיִם — небесную сферу. Сочетание «Бог небес» сохраняет титульный характер выражения и естественно звучит по-русски.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для благодарности. «Ведь» ясно выражает причинную связь и сохраняет плавность поэтического рефрена.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт значение неограниченной длительности в эллиптической древнееврейской фразе без добавления отдельного глагола.
- source_word: חַסְדּוֹ
  choice: его верная любовь
  rationale: חֶסֶד сочетает любовь, благость и неизменную преданность, особенно в рамках отношений завета. «Верная любовь» сохраняет как личностную теплоту, так и постоянство, не сужая смысл до одного лишь милосердия.
theological_decisions:
- issue: Передача חֶסֶד в рефрене Псалма 136
  choice: его верная любовь — навеки
  alternative: его милость — навеки; его верность завету — навеки
  rationale: Основной вариант удерживает одновременно смысл любви и неизменной преданности. «Милость» может чрезмерно подчеркнуть только сострадание, а «верность завету» — сделать подразумеваемый заветный оттенок более явным, чем он выражен в самом слове.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и пригодным для общинного чтения ритмом. Эллиптическая структура рефрена сохранена посредством тире; архаическое «вовек милость Его» не использовано.
