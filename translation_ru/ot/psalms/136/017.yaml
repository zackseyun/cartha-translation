base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/017.yaml
  text: To him who struck down great kings[b][a], for his steadfast love endures forever.
translation:
  language: ru
  text: 'Тому, кто поразил великих царей[a],

    ибо милость Его[b] — навеки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сразил великих царей». Еврейское причастие с предлогом продолжает хвалебную формулу псалма: «Тому, кто…»'
    reason: lexical_alternative
  - marker: b
    text: Еврейское хесед означает милость, верную и неизменную любовь, нередко — верность завету.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: Тому, кто поразил
  rationale: Предлог לְ продолжает хвалебную формулу псалма «Тому, кто…», а причастие от נכה имеет здесь глагольное значение. «Поразил» естественно передаёт решительное поражение царей, не уточняя сверх еврейского текста, были ли они непременно убиты.
- source_word: מְלָכִים גְּדֹלִים
  choice: великих царей
  rationale: Буквальное и естественное сочетание; «великих» может обозначать как высокий статус, так и могущество этих правителей.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит повторяющееся основание для хвалы. «Ибо» сохраняет торжественный литургический ритм, оставаясь понятным в современном литературном русском языке.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Передаёт неограниченную длительность и позволяет сохранить краткость повторяющегося рефрена.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: «Милость» — ёмкий и естественный русский библейский эквивалент חֶסֶד, включающий благоволение и верную любовь; притяжательное местоимение сохранено.
theological_decisions:
- issue: Передача חֶסֶד в рефрене
  choice: милость Его — навеки
  alternative: верная любовь Его — навеки
  rationale: «Милость» естественна для русского псалмового регистра и не сводит חֶסֶד лишь к чувству. Смысл верности и постоянства пояснён в сноске, поскольку одно русское слово не охватывает всего диапазона еврейского термина.
- issue: Степень конкретизации נכה
  choice: поразил
  alternative: сразил
  rationale: «Поразил» сохраняет возможность понимать действие как нанесение решительного поражения, тогда как «сразил» сильнее предполагает убийство и тем самым сужает формулировку исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным псалмовым звучанием. Краткая двухстрочная форма и повторяемый рефрен пригодны для литургического чтения; архаизмы сведены к понятному союзу «ибо».
