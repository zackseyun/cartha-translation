  yaml_path: translation/ot/psalms/136/015.yaml
  text: and shook off Pharaoh and his army into the Red Sea[a], for his steadfast love endures forever.
translation:
  language: ru
  text: 'и стряхнул фараона и его войско в Тростниковое море[a],

    ибо Его милость — навеки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. «Тростниковое море» или «Море тростника». Традиционно: «Красное море».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִעֵר
  choice: и стряхнул
  rationale: Глагол נָעַר передаёт конкретный образ встряхивания или стряхивания; «стряхнул» сохраняет яркость еврейского выражения и перекличку с Исходом 14:27, не сводя его к более общему «низверг».
- source_word: פַּרְעֹה
  choice: фараона
  rationale: Общепринятое русское обозначение египетского царя; винительный падеж передаёт объект действия.
- source_word: וְחֵילוֹ
  choice: и его войско
  rationale: В военном контексте חַיִל означает вооружённую силу или войско; «войско» естественно для современного литературного русского языка.
- source_word: בְיַם סוּף
  choice: в Тростниковое море
  rationale: Название יַם־סוּף непосредственно означает «Тростниковое море». Направительный оттенок предлога בְּ при глаголе движения естественно передаётся русским винительным падежом с «в».
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит повторяющееся основание для хвалы; «ибо» кратко и уместно в возвышенном литургическом регистре.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко передаёт неограниченную длительность и сохраняет ритмичность повторяющегося рефрена.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: חֶסֶד объединяет оттенки милости, верной любви и преданности. «Милость» — ясное и традиционно узнаваемое русское соответствие, не вводящее в основной текст развёрнутое толкование.
theological_decisions:
- issue: Передача יַם סוּף
  choice: Тростниковое море
  alternative: Красное море
  rationale: Приоритет отдан непосредственно засвидетельствованному еврейскому названию, а не традиционному географическому соответствию в переводах. Это не решает окончательно вопрос исторической локализации.
- issue: Передача חֶסֶד в рефрене
  choice: милость Его
  alternative: Его верная любовь
  rationale: «Милость» сохраняет ёмкость понятия и литургическую краткость; вариант «верная любовь» яснее выражает постоянство и верность, но несколько сужает широкий смысл חֶסֶד.
translation_notes:
  register: Современный литературный русский с достоинством поэтического и богослужебного рефрена. Конкретный образ «стряхнул» намеренно сохранён; инверсия «милость Его» поддерживает торжественный ритм, оставаясь понятной современному читателю.
