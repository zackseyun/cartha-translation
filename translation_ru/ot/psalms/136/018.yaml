lexical_decisions:
- source_word: וַיַּהֲרֹג
  choice: и убил
  rationale: Форма wayyiqtol продолжает повествовательный ряд прошедшего времени. «Убил» прямо передаёт значение הרג и остаётся ясным современному читателю без архаизации.
- source_word: מְלָכִים
  choice: царей
  rationale: Обычное множественное число от מֶלֶךְ; контекст не требует поясняющего расширения.
- source_word: אַדִּירִים
  choice: могущественных
  rationale: Прилагательное обозначает силу и значительность этих царей. «Могущественных» естественно передаёт их грозную власть, не сводя смысл к внешнему величию.
- source_word: כִּי
  choice: ибо
  rationale: Частица вводит повторяющийся мотив хвалы и выражает основание сказанного. «Ибо» сохраняет причинно-пояснительный смысл и достоинство литургического рефрена.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт временное значение «вечно, навсегда» и сохраняет лаконичную форму еврейского рефрена.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: «Милость» — ёмкий и понятный русский эквивалент חֶסֶד, включающий благоволение и верность; сноска сохраняет более широкий заветный оттенок исходного слова.
theological_decisions:
- issue: Передача חֶסֶד в рефрене
  choice: милость Его — навеки
  alternative: Его неизменная любовь — навеки; Его верность завету — навеки
  rationale: «Милость» не ограничивает חֶסֶד только чувством любви и позволяет услышать Божье благоволение, проявленное здесь через суд и избавление. Сноска указывает на присущие слову оттенки неизменной любви и верности завету, не навязывая один из них как единственный.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом псалмового рефрена. Инверсия «милость Его» и слово «ибо» поддерживают литургическое звучание, оставаясь понятными современному читателю.
