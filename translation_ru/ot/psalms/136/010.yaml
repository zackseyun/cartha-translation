  text: To him who struck Egypt in their firstborn[a], for his steadfast love endures forever.
translation:
  language: ru
  text: Тому, Кто поразил Египет в его первенцах[a], — ибо милость Его вечна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди его первенцев»; более явно: «поразив его первенцев». Буквально еврейский текст говорит: «в/посредством его первенцев».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַכֵּה
  choice: Тому, Кто поразил
  rationale: Предлог לְ продолжает литанийную конструкцию псалма («Тому, Кто…»), а причастие от נכה передаёт совершённое действие; «поразил» естественно и достойно звучит в современном русском библейском тексте.
- source_word: מִצְרַיִם
  choice: Египет
  rationale: Обычная передача названия страны; по-русски согласование местоимения с названием даёт «в его первенцах».
- source_word: בִּבְכוֹרֵיהֶם
  choice: в его первенцах
  rationale: 'Сохраняет необычную краткость и многозначность еврейского בְּ: удар постиг Египет в лице/сфере его первенцев. Более явное «поразив его первенцев» проясняет смысл, но добавляет отсутствующий в еврейском тексте глагол.'
- source_word: כִּי
  choice: ведь
  rationale: Вводит повторяющийся рефрен и естественно выражает основание хвалы; «ибо» возможно, но заметно архаичнее.
- source_word: לְעוֹלָם
  choice: вечна
  rationale: В сочетании с существительным «милость» естественная русская именная конструкция «милость Его вечна» точно передаёт непреходящий характер חסד без добавления глагола «пребывает».
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: «Милость» — понятная и укоренённая русская передача חסד, включающая благоволение и верность; одной лексемой невозможно полностью выразить весь спектр значения, но контекст рефрена сохраняет его постоянство.
theological_decisions:
- issue: Божественный суд над египетскими первенцами в рефрене о милости
  choice: Сохранено прямое утверждение, что Бог поразил Египет в его первенцах, рядом с исповеданием вечной милости.
  alternative: Смягчить суд перифразом или развернуть текст как «поразив его первенцев».
  rationale: Еврейский стих намеренно соединяет суровый суд и вечную חסד. Перевод не должен ни устранять это напряжение, ни усиливать пояснение сверх исходной формулировки.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным ритмом псалмовой литании. Заглавная буква в «Кто» и постпозиция «милость Его» поддерживают достоинство богослужебного регистра без устаревшей лексики; тире отделяет основной призыв от повторяющегося рефрена.
