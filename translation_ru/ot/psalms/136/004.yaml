    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: Того, Кто творит
  rationale: Предлог לְ продолжает призыв «благодарите» из контекста псалма, а субстантивированное причастие עֹשֵׂה обозначает Того, для Кого такие дела характерны. Настоящее время естественно передаёт эту постоянную характеристику.
- source_word: נִפְלָאוֹת גְּדֹלוֹת
  choice: великие чудеса
  rationale: נִפְלָאוֹת означает необычайные, вызывающие изумление деяния, особенно Божьи; גְּדֹלוֹת прямо характеризует их как великие. «Великие чудеса» кратко и естественно для русского поэтического текста.
- source_word: לְבַדּוֹ
  choice: один
  rationale: Слово подчёркивает исключительность Бога как единственного совершающего эти чудеса. «Один» сохраняет акцент исходного порядка слов и звучит естественнее, чем «сам по Себе».
- source_word: כִּי
  choice: ибо
  rationale: כִּי вводит основание для благодарения. «Ибо» сохраняет причинный смысл и достойный литургический ритм повторяющегося припева.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Наречное «навеки» точно и лаконично передаёт временную неограниченность. Тире естественно оформляет безглагольную еврейскую фразу, не добавляя отсутствующего в оригинале глагола.
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: חֶסֶד объединяет доброжелательную любовь, неизменную верность и лояльность в отношениях. «Верная любовь» сохраняет эту смысловую широту лучше, чем более узкое «милость», и остаётся понятной современному читателю.
theological_decisions:
- issue: Передача припева כִּי לְעוֹלָם חַסְדּוֹ
  choice: ибо Его верная любовь — навеки
  alternative: ибо милость Его вечна; ибо Его заветная верность — навеки
  rationale: Выбранная формулировка сохраняет одновременно любовь и постоянство, заключённые в חֶסֶד, не сводя понятие только к милосердию и не вводя слово «завет», которого в данной строке нет. Безглагольная конструкция также сохраняет сжатость и некоторую открытость еврейского припева.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным литургическим звучанием. Синтаксис сохраняет зависимость строки от повторяющегося в псалме призыва «благодарите», поэтому стих начинается формой «Того». Местоимение о Боге написано с прописной буквы согласно распространённой русской библейской традиции.
