  yaml_path: translation/ot/psalms/136/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: ru
  text: Благодарите Яхве[a], ибо Он благ, ибо вечна Его неизменная любовь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя יהוה традиционно передают словом «Господь»; «Яхве» — общепринятая научная реконструкция его произношения.
    reason: alternative_reading
  - marker: b
    text: Еврейское חֶסֶד может также передаваться как «милость», «верная любовь» или «заветная верность»; слово соединяет оттенки любви, преданности и верности в отношениях.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Благодарите
  rationale: Форма повелительного наклонения множественного числа от ידה в породе hифиль здесь призывает общину воздать благодарность; «благодарите» естественно передаёт литургический смысл, не сужая его до одного лишь прославления.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог לְ обозначает адресата благодарения, а יהוה передано принятой научной транслитерацией личного имени Бога.
- source_word: כִּי
  choice: ибо
  rationale: В обоих случаях союз вводит основание для благодарения. «Ибо» сохраняет причинную связь и соответствует возвышенному, но понятному регистру псалма.
- source_word: טוֹב
  choice: благ
  rationale: Прилагательное прямо утверждает благость Бога. «Благ» сохраняет широту значения и уместно звучит в поэтической молитвенной речи.
- source_word: לְעוֹלָם
  choice: вечна
  rationale: Сочетание выражает неограниченную длительность. Предикативное «вечна» естественно по-русски передаёт эллиптическую еврейскую конструкцию без добавления отсутствующего в тексте глагола «пребывает».
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: חֶסֶד объединяет оттенки любви, милости, преданности и неизменной верности в отношениях. «Верная любовь» сохраняет и личный, и устойчивый характер понятия, не сводя его только к милосердию или формальной обязательности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога. «Яхве» позволяет читателю увидеть это, тогда как «Господь» передаёт традицию замены имени титулом.
- issue: Передача חֶסֶד в рефрене псалма
  choice: верная любовь
  alternative: милость; заветная верность
  rationale: Выбранный вариант удерживает смысловое напряжение между любовью, милостью и неизменной преданностью, не утверждая, что слово в данном стихе обозначает исключительно формально понимаемую верность завету.
- issue: Эллиптическая конструкция לְעוֹלָם חַסְדּוֹ
  choice: вечна Его верная любовь
  alternative: Его верная любовь пребывает вовеки
  rationale: В еврейском тексте глагол отсутствует. Именное предложение по-русски передаёт утверждение естественно и не вносит дополнительного образа продолжения или выстаивания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмопевческим звучанием. Формы «ибо» и «благ» сохраняют достоинство и ритмическую краткость, оставаясь понятными современному читателю. Инверсия «вечна Его верная любовь» отражает поэтический параллелизм и подчёркивает вечность Божьей любви.
