source:
  edition: WLC
  text: לְ/עֹשֵׂ֣ה הַ֭/שָּׁמַיִם בִּ/תְבוּנָ֑ה כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/005.yaml
  text: To him who made the heavens with understanding[b][a], for his steadfast love endures forever.
translation:
  language: ru
  text: Тому, Кто сотворил небеса с разумением[a], — ибо милость Его вечна[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тому, Кто творит небеса разумением». Еврейское причастие можно передать настоящим временем, а предлог — как указание на средство действия.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское חֶסֶד может означать также неизменную любовь, верность и милосердие, особенно верность отношениям завета.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹשֵׂה
  choice: Тому, Кто сотворил
  rationale: 'Предлог לְ с причастием продолжает литургический ряд обращённых к Богу хвалебных формул: «Тому, Кто…». Хотя причастие допускает более буквальное настоящее время, в контексте перечисления дел творения естественно прошедшее «сотворил».'
- source_word: הַשָּׁמַיִם
  choice: небеса
  rationale: Множественная форма שָׁמַיִם в контексте творения передана традиционным и поэтически уместным словом «небеса», а не более узким «небо» или «небосвод».
- source_word: בִּתְבוּנָה
  choice: с разумением
  rationale: תְּבוּנָה обозначает разумение, проницательность, способность разумно устроять. «С разумением» сохраняет отличие от обычного еврейского слова «мудрость» и допускает значение образа или средства действия.
- source_word: כִּי
  choice: ибо
  rationale: В повторяющемся припеве כִּי вводит основание для хвалы. «Ибо» кратко и естественно соответствует возвышенному литургическому строю псалма.
- source_word: לְעוֹלָם
  choice: вечна
  rationale: Буквальное обстоятельство «вовеки» в русском естественно передаётся именной конструкцией «милость… вечна», без добавления отсутствующего в еврейском глагола.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: חֶסֶד охватывает милость, неизменную любовь и верность. В русском библейско-поэтическом регистре «милость» кратко и естественно, а притяжательное местоимение сохраняет суффикс третьего лица.
theological_decisions:
- issue: Передача חֶסֶד в припеве Псалма 136
  choice: милость Его вечна
  alternative: неизменная любовь Его длится вечно; верность Его завету вечна
  rationale: «Милость» остаётся широким и понятным русским соответствием, не сводя חֶסֶד исключительно к эмоции или к техническому понятию завета. Сноска отмечает более широкий смысловой диапазон.
- issue: Временное значение причастия עֹשֵׂה
  choice: Кто сотворил
  alternative: Кто творит
  rationale: Прошедшее время соответствует контексту завершённых деяний творения, но еврейское причастие само по себе допускает более буквальную передачу настоящим временем; эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством псалмового рефрена. Инверсия «милость Его» поддерживает поэтический ритм; «разумение» несколько возвышенно, но понятно и точнее сохраняет отличие תְּבוּנָה от общего слова «мудрость».
