lexical_decisions:
- source_word: הוֹדוּ
  choice: Благодарите
  rationale: Форма повелительного наклонения во множественном числе от ידה в породе hифиль призывает воздавать благодарность и хвалу. «Благодарите» естественно передаёт этот призыв и соответствует повторяющемуся строению псалма.
- source_word: לֵאלֹהֵי הָאֱלֹהִים
  choice: Бога богов
  rationale: Сопряжённая конструкция буквально означает «Бог богов». Формальное выражение сохраняет возвышенную риторику оригинала и допускает присущий ей смысл превосходства.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит основание для призыва благодарить. «Ибо» кратко, ясно и уместно в возвышенной поэтической речи.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Выражение обозначает неограниченную длительность. «Навеки» естественно передаёт его в безглагольной рефренной фразе.
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: חסד сочетает значения любви, милости, преданности и устойчивой верности в отношениях. «Верная любовь» передаёт как личную любовь, так и её неизменную, надёжную природу; местоименный суффикс выражен словом «Его».
theological_decisions:
- issue: Смысл титула אֱלֹהֵי הָאֱלֹהִים
  choice: Сохранить буквальное «Бог богов» как утверждение высшего положения Бога.
  alternative: 'Передать толковательно: «Бог, Который превыше всех богов».'
  rationale: Еврейское выражение подчёркивает верховенство и несравненность Бога, но само по себе не разрешает вопрос об онтологическом статусе иных называемых богами; буквальная передача сохраняет эту риторическую и богословскую сдержанность.
- issue: Передача חֶסֶד
  choice: «Верная любовь» с пояснением диапазона значения в сноске.
  alternative: «Милость» или «заветная верность».
  rationale: «Верная любовь» не сводит многозначное слово только к состраданию или к формальному понятию завета и сохраняет соединение любви с постоянством и преданностью.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным звучанием псаломного рефрена. Порядок слов и тире сохраняют поэтическую безглагольность еврейской строки, оставаясь понятными современному читателю.
