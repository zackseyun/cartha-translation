  text: 'распростёршему землю над водами[a],

    ибо милость Его — навеки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распростёршему землю поверх вод»; еврейский глагол может также обозначать расплющивание металла, который выковывают в широкую поверхность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרֹקַע
  choice: распростёршему
  rationale: Предлог לְ продолжает литанийную конструкцию псалма («Тому, Кто…»), а причастие от רקע обозначает распластывание или простирание поверхности. «Распростёршему» естественно и поэтично передаёт образ, не сводя его к буквальному ударному расковыванию.
- source_word: הָאָרֶץ
  choice: землю
  rationale: В контексте творения и в сочетании с водами אֶרֶץ означает землю как сотворённый мир, а не отдельную страну.
- source_word: עַל הַמָּיִם
  choice: над водами
  rationale: עַל допускает значения «на», «над» и «поверх». «Над водами» сохраняет древний поэтический образ и звучит естественно по-русски.
- source_word: כִּי
  choice: ибо
  rationale: כִּי вводит повторяющееся основание для хвалы. «Ибо» соответствует возвышенному поэтическому регистру псалма.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: לְעוֹלָם выражает неограниченную длительность. Именная русская формула «милость Его — навеки» сохраняет лаконизм еврейского рефрена без добавления отсутствующего в тексте глагола.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: חֶסֶד объединяет оттенки верной, неизменной любви, благости и милости. Традиционное и понятное «милость» сохраняет широту рефрена; местоимение после существительного поддерживает достоинство и ритм.
theological_decisions:
- issue: Космологический образ творения
  choice: Сохранить поэтическое описание земли, распростёртой над водами.
  alternative: Обобщить смысл как «утвердившему мир» или приспособить образ к современным научным категориям.
  rationale: Еврейский текст даёт конкретный древний поэтический образ. Перевод сохраняет его, не превращая ни в научное утверждение, ни в отвлечённый пересказ.
- issue: Смысл חֶסֶד в рефрене
  choice: Передать словом «милость», не ограничивая его одной богословской категорией.
  alternative: «Верная любовь», «заветная верность» или «милосердие».
  rationale: В חֶסֶד сочетаются любовь, благость, милость и верность. «Милость» остаётся ёмкой, узнаваемой и естественной в русском псалмическом рефрене, тогда как «заветная верность» чрезмерно уточняет выражение.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным псалмическим звучанием. Причастная форма сохраняет синтаксическое продолжение предыдущего призыва псалма; тире в рефрене передаёт безглагольность еврейской формулы.
