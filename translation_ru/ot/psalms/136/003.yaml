base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/003.yaml
  text: Give thanks to the Lord of lords[a], for his steadfast love endures forever.
translation:
  language: ru
  text: Благодарите Владыку владык, ведь милость Его — навеки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь Его верная любовь — навеки». Еврейское חֶסֶד может обозначать милость и доброту, а также неизменную любовь и верность в отношениях завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹדוּ
  choice: Благодарите
  rationale: Форма повелительного наклонения во множественном числе от ידה в породе hифиль призывает общину воздать благодарность; это естественно передаёт повторяющуюся формулу псалма.
- source_word: לַאֲדֹנֵי הָאֲדֹנִים
  choice: Владыку владык
  rationale: Конструкция «господин господ» выражает превосходство и верховную власть. «Владыка владык» сохраняет титульный, возвышенный характер и звучит по-русски естественнее, чем двусмысленное «Господа господ».
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для призыва благодарить; «ведь» сохраняет причинно-пояснительную связь и естественно звучит в современной русской поэтической речи.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Наречное выражение означает неограниченную продолжительность. В безглагольной еврейской фразе лаконичное «навеки» сохраняет её форму без добавления явного глагола.
- source_word: חַסְדּוֹ
  choice: милость Его
  rationale: חֶסֶד охватывает милость, благость и верную, постоянную любовь. Традиционно понятное «милость» сохраняет широту понятия, а альтернативный заветный оттенок отмечен в сноске; суффикс передан местоимением «Его».
theological_decisions:
- issue: Передача божественного титула אֲדֹנֵי הָאֲדֹנִים
  choice: Владыка владык
  alternative: Господь господ
  rationale: Выражение обозначает верховную власть Бога. «Владыка владык» сохраняет суперлативную конструкцию и её богословский вес, не создавая в русском языке впечатления, будто первое слово является передачей имени יהוה.
- issue: Смысл חֶסֶד
  choice: милость
  alternative: верная любовь / заветная верность
  rationale: 'В данном рефрене слово сохраняет смысловую широту: милосердная благость и неизменная верность. Основной текст не сужает его исключительно до технического понятия завета, а сноска сообщает существенную альтернативу.'
