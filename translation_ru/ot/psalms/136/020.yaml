  text: 'и Ога, царя Васана,

    ибо Его верная любовь — навеки.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְעוֹג
  choice: и Ога
  rationale: Союз וּ продолжает перечисление. Имя поставлено в винительный падеж как объект действия из предшествующей строки; русский перевод тем самым естественно восполняет синтаксическую связь, тогда как לְ буквально могло бы быть передано формой «Огу».
- source_word: מֶלֶךְ
  choice: царя
  rationale: Стандартное соответствие слову «царь»; винительный падеж согласован с приложением к имени «Ога».
- source_word: הַבָּשָׁן
  choice: Васана
  rationale: Использована укоренившаяся в русской библейской традиции форма географического названия; определённый артикль отдельно не передаётся.
- source_word: כִּי
  choice: ведь
  rationale: В повторяющемся рефрене слово вводит основание для хвалы. «Ведь» естественно передаёт пояснительно-причинную силу, не делая связь чрезмерно логизированной.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко и литургично передаёт значение неограниченной длительности; именная еврейская фраза сохраняется без добавления глагола.
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: «Верная любовь» охватывает устойчивость, благость и надёжность חֶסֶד, не сужая смысл только до милосердия. Местоименный суффикс передан словом «Его».
theological_decisions:
- issue: Передача חֶסֶד в рефрене Псалма 136
  choice: верная любовь
  alternative: милость; заветная любовь; неизменная любовь
  rationale: Формулировка сохраняет смысл преданной и неизменной благости Бога, оставаясь понятной современному читателю и не ограничивая многозначное слово одним аспектом.
- issue: Безглагольность рефрена
  choice: навеки Его верная любовь
  alternative: Его верная любовь пребывает вовеки
  rationale: В еврейском тексте глагол отсутствует. Сохранение именной конструкции передаёт лаконичность литургического рефрена и не навязывает конкретный подразумеваемый глагол.
translation_notes:
  register: Современный литературный русский с кратким, торжественным и пригодным для общего чтения рефреном. Форма «Васан» сохраняет узнаваемую русскую библейскую топонимию; архаичные «ибо» и «вовек милость Его» заменены более современным порядком слов и лексикой.
