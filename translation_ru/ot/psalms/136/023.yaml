  text: שֶׁ֭/בְּ/שִׁפְלֵ/נוּ זָ֣כַר לָ֑/נוּ כִּ֖י לְ/עוֹלָ֣ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/136/023.yaml
  text: who remembered us in our low estate[b][a], for his steadfast love is forever.
translation:
  language: ru
  text: 'Он вспомнил о нас в нашем унижении[a],

    ибо Его верная любовь — навеки[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда мы были повержены»; также возможно: «в нашем бедственном положении».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ибо милость Его пребывает вовек».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׁבְּשִׁפְלֵנוּ
  choice: в нашем унижении
  rationale: Существительное שֵׁפֶל обозначает низкое, бедственное или униженное состояние. «В нашем унижении» сохраняет широту значения, не уточняя без основания, шла ли речь о социальном унижении, притеснении или общей беспомощности.
- source_word: זָכַר לָנוּ
  choice: вспомнил о нас
  rationale: Глагол זכר передан своим основным значением. В данном контексте воспоминание предполагает последующее благодеяние, однако это следствие не внесено в текст как явное значение глагола.
- source_word: כִּי
  choice: ибо
  rationale: Союз вводит повторяющийся в псалме мотив, объясняющий названное деяние Бога. «Ибо» сохраняет причинную связь и соответствует торжественному литургическому регистру.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Кратко и естественно передаёт значение неограниченной длительности; тире восполняет отсутствующую в еврейской именной фразе связку.
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: חֶסֶד объединяет значения любви, милости и неизменной верности. «Верная любовь» передаёт личный и устойчивый характер этого отношения, не ограничивая смысл одной лишь жалостью.
theological_decisions:
- issue: Смысл Божьего «воспоминания»
  choice: вспомнил о нас
  alternative: обратил на нас внимание / пришёл нам на помощь
  rationale: В библейском контексте Божье воспоминание часто подразумевает действие ради людей, но перевод сохраняет формулировку исходного текста и не превращает подразумеваемое следствие в прямое утверждение.
- issue: Передача постоянного рефрена כִּי לְעוֹלָם חַסְדּוֹ
  choice: ибо Его верная любовь — навеки
  alternative: ибо милость Его пребывает вовек
  rationale: Выбранный вариант сохраняет причинную функцию рефрена, вечность Божьего חֶסֶד и его характер как неизменной, верной любви. Альтернатива отражает традиционную передачу через «милость» и допустимое добавление глагола «пребывает».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, псалмодическим звучанием. Порядок слов сделан естественным для русского языка; традиционное «вовек» сохранено в сноске, а в основном тексте употреблено более современное «навеки».
