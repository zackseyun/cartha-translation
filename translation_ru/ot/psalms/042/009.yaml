  text: אוֹמְרָ֤ה לְ/אֵ֥ל סַלְעִ/י֮ לָ/מָ֪ה שְׁכַ֫חְתָּ֥/נִי לָֽ/מָּה קֹדֵ֥ר אֵלֵ֗ךְ בְּ/לַ֣חַץ אוֹיֵֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/009.yaml
  text: I say to God[a], my rock, “Why have you forgotten me? Why do I go about mourning under the oppression of the enemy?”
translation:
  language: ru
  text: 'Скажу Богу, моей скале: «Почему Ты забыл меня? Почему я хожу в скорби под гнётом врага?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему я хожу помрачённый под гнётом врага?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹמְרָה
  choice: Скажу
  rationale: Когортативная форма 1-го лица может выражать решимость или непосредственное речевое действие. «Скажу» естественно передаёт волевой оттенок, не исключая смысла «говорю».
- source_word: לְאֵל
  choice: Богу
  rationale: אֵל в данном контексте — обозначение Бога, а не собственное имя; дательный падеж естественно передаёт направление речи.
- source_word: סַלְעִי
  choice: моей скале
  rationale: Сохраняется конкретная метафора Бога как твёрдой скалы и убежища; перевод «защите» неоправданно истолковал бы образ.
- source_word: שְׁכַחְתָּנִי
  choice: Ты забыл меня
  rationale: Перфект 2-го лица с объектным суффиксом прямо выражает жалобу на переживаемую забытость; «оставил» было бы расширительным толкованием.
- source_word: קֹדֵר
  choice: в скорби
  rationale: Причастие от קדר может означать мрачное, омрачённое состояние и траурную скорбь. «В скорби» естественно по-русски передаёт эмоциональное состояние при движении.
- source_word: אֵלֵךְ
  choice: я хожу
  rationale: Форма הלך обозначает продолжающееся хождение или пребывание; настоящее время подходит контексту текущей жалобы.
- source_word: בְּלַחַץ
  choice: под гнётом
  rationale: לַחַץ означает давление, притеснение. Оборот «под гнётом» передаёт как враждебное угнетение, так и состояние псалмопевца.
- source_word: אוֹיֵב
  choice: врага
  rationale: Единственное число без артикля в поэзии допускает обобщённое обозначение противника; русское «врага» сохраняет форму исходного текста.
theological_decisions:
- issue: Метафорическое наименование Бога סַלְעִי
  choice: моей скале
  alternative: моей твердыне
  rationale: Буквенный образ скалы сохраняется, а не заменяется отвлечённым понятием защиты. Форма «скале» также удерживает связь с обычным значением סֶלַע.
- issue: Жалоба на то, что Бог забыл псалмопевца
  choice: Почему Ты забыл меня?
  alternative: Почему Ты оставил меня?
  rationale: Перевод не смягчает напряжение верующей жалобы и одновременно не усиливает его до полного оставления, которого сам глагол не выражает.
- issue: Значение קֹדֵר
  choice: в скорби
  alternative: помрачённый
  rationale: Основной текст передаёт траурно-скорбный смысл, а примечание сохраняет возможный образ мрачности и помрачённости.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Заглавное «Ты» употреблено как русская почтительная традиция обращения к Богу, без изменения смысла. Синтаксис сохраняет прямоту и напряжение жалобы.
