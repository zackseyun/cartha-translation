    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרֶצַח בְּעַצְמוֹתַי
  choice: Словно сокрушая мне кости
  rationale: Еврейский образ буквально связывает «убийство/смертельный удар» с костями псалмопевца и выражает глубоко проникающую, сокрушительную боль. Русская формулировка сохраняет телесную силу метафоры и естественно связывает её с последующим поношением.
- source_word: חֵרְפוּנִי
  choice: поносят меня
  rationale: Глагол обозначает оскорбительное поругание и насмешку. «Поносят» уместно в поэтическом регистре и передаёт враждебный характер речи.
- source_word: צוֹרְרָי
  choice: враги
  rationale: Причастная форма обозначает враждующих с псалмопевцем людей. «Враги» ясно и естественно передаёт смысл в современном русском языке.
- source_word: בְּאָמְרָם אֵלַי כָּל הַיּוֹם
  choice: целыми днями говоря мне
  rationale: Оборот передаёт постоянно повторяющуюся враждебную речь; множественное «целыми днями» естественно выражает продолжительность и повторяемость.
- source_word: אַיֵּה אֱלֹהֶיךָ
  choice: Где твой Бог?
  rationale: Прямой вопрос сохраняет краткость и язвительную силу вызова без пояснения или богословского сглаживания.
theological_decisions:
- issue: Вражеский вызов о присутствии и помощи Бога
  choice: «Где твой Бог?»
  alternative: «Где же твой Бог?»
  rationale: Частица «же» усилила бы оттенок торжества или упрёка, отсутствующий в явной форме в еврейском тексте. Краткий вопрос сохраняет напряжение плача и не объясняет кажущееся отсутствие Бога.
- issue: Связь поношения с телесной болью
  choice: Поношение представлено как сокрушение костей
  alternative: «С убийством в костях моих враги поносят меня»
  rationale: Образ сохранён как метафора мучительного воздействия вражеских слов, без утверждения о буквальном убийстве; трудность исходной формулировки отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Поносят» сохраняет достоинство псалмового регистра, а остальная фраза остаётся понятной обычному читателю.
