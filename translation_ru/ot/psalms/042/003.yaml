lexical_decisions:
- source_word: הָיְתָה לִּי
  choice: стали мне
  rationale: Конструкция היה + ל выражает, чем нечто стало или что служит человеку; «стали мне» естественно передаёт результативный смысл и сохраняет образ исходного текста.
- source_word: דִמְעָתִי
  choice: слёзы мои
  rationale: Хотя еврейская форма морфологически стоит в единственном числе, существительное может иметь собирательное значение; русский множественный вариант естественен для контекста плача.
- source_word: לֶחֶם
  choice: хлебом
  rationale: Сохранён конкретный и выразительный образ хлеба, без обобщающей замены на «пищу».
- source_word: יוֹמָם וָלָיְלָה
  choice: днём и ночью
  rationale: Устойчивое русское выражение точно передаёт меризм, обозначающий непрерывность.
- source_word: בֶּאֱמֹר
  choice: пока ... говорят
  rationale: Предлог с инфинитивом обозначает одновременное действие; «пока» передаёт продолжающуюся насмешку, сопровождающую плач.
- source_word: אֵלַי
  choice: мне
  rationale: Предлог указывает направление речи к псалмопевцу; русское «мне говорят» звучит естественно.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Передаёт повторяющееся или непрерывное действие на протяжении дня без излишнего усиления.
- source_word: אַיֵּה
  choice: Где
  rationale: Сохраняет прямой и резкий вопрос исходного текста.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма имеет второе лицо мужского рода единственного числа; прописная буква уместна, поскольку речь идёт о Боге псалмопевца.
theological_decisions:
- issue: Характер вопроса насмешников
  choice: «Где твой Бог?» — прямой вопрос о кажущемся отсутствии Бога.
  alternative: «Что стало с твоим Богом?» — истолковывающая передача.
  rationale: Буквальная формулировка сохраняет напряжение между верой псалмопевца и кажущимся отсутствием Божьей помощи, не разъясняя подразумеваемое сверх текста.
translation_notes:
  register: Современный литературный русский язык; сохранены поэтический образ хлеба и лаконичность насмешливого вопроса. Порядок «слёзы мои» придаёт строке умеренно возвышенное, но понятное звучание.
