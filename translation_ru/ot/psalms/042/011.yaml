base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/011.yaml
  text: Why are you cast down[a], my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him[b], the salvation of my countenance and my God.
translation:
  language: ru
  text: Почему ты поникла, душа моя, и почему стонешь во мне? Надейся на Бога, ведь я ещё буду славить Его — моё спасение[a] и моего Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст буквально: «спасения лица моего и Бог мой». Это поэтическое, сжатое выражение; его также передают: «помощь лица моего» или «Тот, Кто спасает меня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: ты поникла
  rationale: Глагол описывает состояние согбенности и подавленности; «поникла» естественно передаёт и образ, и душевное состояние.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: В обращении к самому себе сохраняет поэтическую и внутренне-сосредоточенную силу еврейского выражения.
- source_word: תֶּהֱמִי
  choice: стонешь
  rationale: Глагол обозначает шум, гул или смятение; «стонешь» сохраняет слышимый образ внутреннего волнения, не сводя его к нейтральному беспокойству.
- source_word: עָלָי
  choice: во мне
  rationale: Буквально «на мне/надо мной», но в данном самообращении выражение указывает на внутреннее смятение говорящего; по-русски естественно «во мне».
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: надейся на Бога
  rationale: Форма выражает исполненное ожидания упование; «надейся на Бога» кратко и естественно передаёт доверительное ожидание.
- source_word: עוֹד אוֹדֶנּוּ
  choice: я ещё буду славить Его
  rationale: עוֹד обращено к будущему возобновлению хвалы, а ידה в контексте псалма означает прославлять или благодарить.
- source_word: יְשׁוּעוֹת פָּנַי
  choice: спасение лица моего
  rationale: 'Сохранён плотный и необычный еврейский образ: Божье спасение связано с лицом псалмопевца, ныне поникшим. Возможное смысловое сглаживание дано в примечании.'
- source_word: וֵאלֹהָי
  choice: и Бога моего
  rationale: Сохранены соединительный союз и заключительное личное исповедание исходного текста.
theological_decisions:
- issue: Толкование יְשׁוּעוֹת פָּנַי
  choice: спасение лица моего
  alternative: Тот, Кто спасает меня / помощь лица моего
  rationale: Еврейское выражение неоднозначно и поэтически сжато. Основной текст сохраняет конкретный образ лица и не решает безоговорочно, следует ли понимать его как избавление, меняющее поникшее лицо, или как идиому о личной помощи Бога.
translation_notes:
  register: Современный литературный русский с сохранением возвышенного поэтического самообращения. Женский род сказуемых обусловлен грамматическим родом слова «душа». Необычный образ «спасение лица моего» намеренно сохранён и пояснён примечанием.
