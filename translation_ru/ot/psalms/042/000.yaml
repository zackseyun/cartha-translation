  text: לַ/מְנַצֵּ֗חַ מַשְׂכִּ֥יל לִ/בְנֵי קֹֽרַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/000.yaml
  text: For the choirmaster[a]. A Maskil[b] of the sons of Korah[c].
translation:
  language: ru
  text: Для руководителя хора[a]. Маскил[b] сынов Корея[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Руководителю хора». Еврейский предлог в заголовках псалмов допускает оба понимания.'
    reason: alternative_reading
  - marker: b
    text: «Маскил» — специальный термин в заголовках псалмов; его точное значение неизвестно. Среди предлагаемых значений — «созерцательное произведение» и «назидательная песнь».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «для сынов Корея». Заголовок может указывать на авторство, принадлежность к этой группе или исполнителей, для которых предназначался псалом.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Для руководителя хора
  rationale: В заголовках псалмов причастная форма מְנַצֵּחַ обычно обозначает руководителя музыкального исполнения. «Руководитель хора» ясно и естественно передаёт эту функцию, а «для» сохраняет вероятный посвятительный оттенок предлога לְ.
- source_word: מַשְׂכִּיל
  choice: Маскил
  rationale: Это специальное обозначение жанра или типа псалма, точное значение которого неизвестно. Транслитерация не навязывает спорное толкование вроде «назидательная» или «созерцательная песнь».
- source_word: לִבְנֵי
  choice: сынов
  rationale: В заголовке предлог לְ может указывать на авторство, принадлежность, связь или назначение для исполнения. Русская конструкция «сынов Корея» достаточно широка и не исключает этих возможностей; альтернативное «для сынов» вынесено в примечание.
- source_word: קֹרַח
  choice: Корея
  rationale: Имя передано в принятой русской библейской форме «Корей»; родительный падеж обусловлен конструкцией «сынов Корея».
