  source_fidelity: 'Текст точно передаёт три элемента еврейского надписания: адресацию לַמְנַצֵּחַ («Для руководителя хора»), техническое жанровое обозначение מַשְׂכִּיל («Маскил») и связь с בני־קרח («сынов Корея»). Неоднозначность обоих употреблений לְ не устранена искусственно и отражена в примечаниях.'
