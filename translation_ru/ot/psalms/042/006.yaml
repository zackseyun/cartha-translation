- source_word: עַל־כֵּן
  choice: потому
  rationale: Передаёт причинно-следственную связь с предшествующим признанием уныния.
- source_word: אֶזְכָּרְךָ
  choice: я вспоминаю Тебя
  rationale: Имперфект допускает настоящее действие или решимость на будущее; настоящее время естественно в данном контексте, а альтернативный оттенок отмечен в сноске.
- source_word: מֵאֶרֶץ יַרְדֵּן
  choice: из земли Иордана
  rationale: Сохраняет географическое выражение и отличие предлога מֵ, связанного с землёй или областью.
- source_word: וְחֶרְמוֹנִים
  choice: и с вершин Ермона
  rationale: Необычная форма множественного числа передана как указание на вершины или горный массив Ермона, а не сглажена до единственного числа.
- source_word: מֵהַר מִצְעָר
  choice: с горы Мицар
  rationale: Мицар сохранено как вероятное географическое имя; возможное нарицательное значение вынесено в сноску.
theological_decisions:
- issue: Временной или модальный оттенок אֶזְכָּרְךָ
  choice: я вспоминаю Тебя
  alternative: я буду вспоминать Тебя
  rationale: Еврейский имперфект допускает оба прочтения; основной текст не превращает высказывание однозначно в обещание, а сноска сохраняет альтернативу.
