lexical_decisions:
- source_word: כְּ/אַיָּל
  choice: Как олень
  rationale: אַיָּל может обозначать оленя, нередко самца; «олень» естественно и понятно передаёт образ, а כְּ вводит сравнение.
- source_word: תַּעֲרֹג
  choice: жаждет
  rationale: Глагол ערג выражает сильное томление и стремление, в данном образе подобное мучительной жажде. Русское «жаждет» естественно связывает физический образ воды с духовным устремлением второй строки.
- source_word: עַל
  choice: потоков
  rationale: 'При глаголе «жаждать» отдельный русский предлог не требуется: отношение желания естественно выражается родительным падежом.'
- source_word: אֲפִיקֵי מָיִם
  choice: потоков воды
  rationale: אֲפִיקִים обозначает русла, водные протоки или потоки. «Потоки воды» сохраняет множественное число и остаётся ясным современному читателю.
- source_word: כֵּן
  choice: так
  rationale: Кратко и естественно вводит вторую половину сравнения.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נֶפֶשׁ может обозначать душу, жизнь или всего человека. «Душа моя» сохраняет поэтический и молитвенный регистр, не исключая значения целостного «я».
- source_word: אֵלֶיךָ
  choice: Тебя
  rationale: Еврейская форма буквально указывает направление «к Тебе», но русское управление «жаждать Тебя» естественно передаёт направленное к Богу стремление.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения ясно передаёт непосредственную молитвенную речь.
theological_decisions:
- issue: Антропологический диапазон נַפְשִׁי
  choice: душа моя
  alternative: жизнь моя; всё моё существо; я сам
  rationale: Еврейское נֶפֶשׁ не требует строгого противопоставления души телу и может обозначать живого человека целиком. Традиционное «душа моя» уместно в псалме, а примечание сохраняет более широкий смысл.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Повтор «жаждет» воспроизводит повтор еврейского глагола и связывает телесную жажду оленя с устремлением человека к Богу; обращение «Боже» сохраняет возвышенный, но понятный регистр.
