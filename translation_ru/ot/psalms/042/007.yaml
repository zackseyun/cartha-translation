  text: תְּהֽוֹם אֶל תְּה֣וֹם ק֭וֹרֵא לְ/ק֣וֹל צִנּוֹרֶ֑י/ךָ כָּֽל מִשְׁבָּרֶ֥י/ךָ וְ֝/גַלֶּ֗י/ךָ עָלַ֥/י עָבָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/007.yaml
  text: Deep calls to deep at the sound of your waterfalls[b][a]; all your breakers and your waves have passed over me.
translation:
  language: ru
  text: Бездна бездну зовёт под шум Твоих водопадов[a]; все Твои валы и волны прошли надо мной[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твоих потоков»; еврейское слово может обозначать водные русла, потоки или низвергающуюся воду.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пронеслись надо мной».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּהוֹם ... תְּהוֹם
  choice: Бездна ... бездну
  rationale: «Бездна» передаёт водную глубину и сохраняет краткий поэтический повтор исходного текста, не уточняя его космологический смысл.
- source_word: קוֹרֵא
  choice: зовёт
  rationale: Причастная форма выражает живое, продолжающееся действие; «зовёт» естественно звучит в олицетворённом образе бездны.
- source_word: לְקוֹל
  choice: под шум
  rationale: Так естественно передаётся звуковой фон действия; «шум» уместнее буквального «голос» в сочетании с низвергающейся водой.
- source_word: צִנּוֹרֶיךָ
  choice: Твоих водопадов
  rationale: Слово допускает значения водного русла, потока или низвергающейся воды. «Водопады» ясно передают здесь грохот и напор воды, сохраняя при этом лексическую неоднозначность в сноске.
- source_word: מִשְׁבָּרֶיךָ
  choice: Твои валы
  rationale: «Валы» обозначают крупные набегающие и разбивающиеся волны и хорошо сочетаются с последующим общим словом «волны».
- source_word: וְגַלֶּיךָ
  choice: и волны
  rationale: Прямой и понятный современному читателю эквивалент слова גַּל.
- source_word: עָלַי עָבָרוּ
  choice: прошли надо мной
  rationale: Формулировка близко следует образу вод, проходящих над псалмопевцем, и сохраняет завершённость пережитого действия.
theological_decisions:
- issue: Принадлежность вод Богу выражена суффиксами второго лица
  choice: Сохранить «Твоих» и «Твои» с прописной буквы как обращение к Богу
  alternative: Писать местоимения со строчной буквы
  rationale: Контекст псалма указывает на Бога как адресата. Прописная буква соответствует принятому русскому библейскому регистру, не добавляя богословского содержания.
translation_notes:
  register: Современный литературный русский с сохранением краткости, параллелизма и напряжённой водной образности еврейской поэзии. Выражения «бездна бездну зовёт» и «валы и волны» звучат возвышенно, но остаются понятными обычному читателю.
