  text: מַה תִּשְׁתּ֬וֹחֲחִ֨י נַפְשִׁ/י֮ וַ/תֶּהֱמִ֪י עָ֫לָ֥/י הוֹחִ֣ילִי לֵֽ֭/אלֹהִים כִּי ע֥וֹד אוֹדֶ֗/נּוּ יְשׁוּע֥וֹת פָּנָֽי/ו־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/005.yaml
  text: Why are you cast down[a], O my soul, and why are you in turmoil within me? Hope in God, for I will yet praise him, the salvation of my countenance and my God.
translation:
  language: ru
  text: Почему ты поникла, душа моя, почему волнуешься во мне? Надейся на Бога, ведь я ещё буду славить Его за спасение от Него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «спасения Его лица». В еврейском языке «лицо» может также обозначать присутствие; выражение говорит о помощи и избавлении, приходящих от Бога.'
    reason: Сохраняет буквальный образ и грамматическое множественное число оригинала, поясняя идиоматическое значение без неестественного буквального оборота в основном тексте.
lexical_decisions:
- source_word: תִּשְׁתּוֹחֲחִי
  choice: поникла
  rationale: Глагол описывает состояние согбенности и подавленности; «поникла» естественно сохраняет как телесный образ, так и смысл душевного упадка.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: В обращении к самому себе традиционное и понятное выражение «душа моя» сохраняет поэтическую силу еврейского текста, не навязывая специальной антропологии.
- source_word: וַתֶּהֱמִי
  choice: волнуешься
  rationale: Глагол передаёт шумное смятение, беспокойство или внутреннее волнение; выбранный вариант естественен по-русски и соответствует контексту.
- source_word: עָלָי
  choice: во мне
  rationale: Буквально предлог означает «на мне/надо мной», но здесь речь о смятении души, переживаемом говорящим внутри себя; «во мне» ясно передаёт контекстуальный смысл.
- source_word: הוֹחִילִי לֵאלֹהִים
  choice: Надейся на Бога
  rationale: Императив призывает к терпеливому, исполненному ожидания упованию; эта формулировка кратка, естественна и сохраняет направленность надежды на Бога.
- source_word: כִּי עוֹד אוֹדֶנּוּ
  choice: ведь я ещё буду славить Его
  rationale: עוֹד выражает сохраняющуюся надежду на будущее вопреки нынешней скорби, а ידה в данном контексте означает прославление или благодарение Бога.
- source_word: יְשׁוּעוֹת פָּנָיו
  choice: за спасение, исходящее от Его лица
  rationale: Еврейское выражение буквально говорит о «спасениях Его лица». Единственное число естественно передаёт интенсивное или собирательное множественное число, а «исходящее от Его лица» сохраняет исходный образ и указывает на спасение, даруемое Божьим присутствием.
theological_decisions:
- issue: Смысл заключительного выражения יְשׁוּעוֹת פָּנָיו
  choice: за спасение, исходящее от Его лица
  alternative: спасение Его присутствия; помощь от Его лица
  rationale: Предоставленный масоретский текст читает פָּנָיו — «Его лицо», а не «моё лицо и мой Бог». Перевод сохраняет образ лица и вместе с тем делает понятной связь спасения с Божьим благосклонным присутствием. Формулировка не отождествляет Бога с абстрактным спасением и не устраняет поэтическую неоднозначность без пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Женский род глаголов обусловлен обращением к слову «душа». Частица «ведь» естественно передаёт обосновывающее כִּי; архаизмы вроде «что унываешь» и «лик» не используются.
