  text: צָמְאָ֬ה נַפְשִׁ֨/י לֵ/אלֹהִים֮ לְ/אֵ֪ל חָ֥י מָתַ֥י אָב֑וֹא וְ֝/אֵרָאֶ֗ה פְּנֵ֣י אֱלֹהִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/002.yaml
  text: My soul thirsts for God[a], for the living God. When shall I come and appear before God?
translation:
  language: ru
  text: Душа моя жаждет Бога, Бога живого. Когда я приду и предстану перед Богом[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пред лицом Бога».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָמְאָה
  choice: жаждет
  rationale: Глагол буквально обозначает жажду. Настоящее время естественно передаёт продолжающееся сильное стремление в контексте псалма и сохраняет конкретную поэтическую метафору.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נפשׁ может означать душу, жизнь или самого человека. Традиционный и понятный русский оборот «душа моя» сохраняет еврейский поэтический образ и акцент на всём внутреннем существе человека.
- source_word: לֵאלֹהִים
  choice: Бога
  rationale: При русском глаголе «жаждать» объект естественно ставится в родительном падеже; это передаёт направленность желания без дополнительного предлога.
- source_word: לְאֵל חָי
  choice: Бога живого
  rationale: Сочетание אֵל חָי означает «живой Бог». Повтор слова «Бога» сохраняет параллельную структуру еврейской строки, а постпозиция прилагательного поддерживает возвышенный поэтический регистр.
- source_word: מָתַי
  choice: когда же
  rationale: Основное значение — «когда». Частица «же» естественно выражает напряжённое ожидание, возникающее из вопроса в контексте плача, не превращая его в более сильное «доколе».
- source_word: אָבוֹא
  choice: я приду
  rationale: Имперфект в вопросе указывает на ожидаемое будущее действие; русское будущее время передаёт его прямо и естественно.
- source_word: וְאֵרָאֶה
  choice: и предстану
  rationale: Вокализация масоретского текста указывает на нифаль глагола ראה — «явиться, показаться, предстать». «Предстану» хорошо передаёт культовый контекст явления в Божьем присутствии и не подменяет форму чтением «увижу».
- source_word: פְּנֵי אֱלֹהִים
  choice: перед Богом
  rationale: Буквально выражение содержит «лицо Бога», но здесь это устойчивый способ сказать о нахождении в Божьем присутствии. «Перед Богом» звучит естественно по-русски; буквальная образность отмечена в сноске.
theological_decisions:
- issue: Передача выражения פְּנֵי אֱלֹהִים
  choice: перед Богом
  alternative: пред лицом Бога
  rationale: Стих выражает стремление получить доступ к Божьему присутствию, вероятно в богослужении. Идиоматический перевод не утверждает физического созерцания Божьей сущности, а буквальная форма сохранена в сноске.
- issue: Значение וְאֵרָאֶה
  choice: предстану
  alternative: увижу
  rationale: Масоретская вокализация формы поддерживает значение «явлюсь, предстану». Альтернатива «увижу» известна по иной традиции понимания, но менее непосредственно соответствует данной вокализованной форме; перевод не смешивает эти чтения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «душа моя» и выражение «Бога живого» сохраняют ритм и достоинство псалма, оставаясь понятными современному читателю.
