  source_fidelity: 'Глагол יְצַוֶּה — «повелевает, приказывает» — в черновике ослаблен до «посылает». Хотя «посылает» передаёт возможный образный результат повеления, оно не сохраняет выраженную в еврейском тексте активную силу глагола. Остальные основные соответствия верны: יוֹמָם / וּבַלַּיְלָה переданы временными обстоятельствами, חַסְדּוֹ — как принадлежащая Яхве неизменная любовь, а לְאֵל חַיָּי не смешано с «живым Богом».'
  naturalness: «Днём Яхве повелевает Своей неизменной любви» — намеренно поэтическая, но грамматически ясная конструкция; дательный падеж показывает, кому обращено повеление. «Верная любовь» в современном литературном русском несколько естественнее и лучше выражает лояльность חסד, чем «неизменная любовь». Строчные буквы в местоимении и притяжательном определении соответствуют нейтральной современной орфографической норме и не меняют референции.
