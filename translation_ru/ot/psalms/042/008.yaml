  text: יוֹמָ֤ם יְצַוֶּ֬ה יְהוָ֨ה חַסְדּ֗/וֹ וּ֭/בַ/לַּיְלָה שיר/ה עִמִּ֑/י תְּ֝פִלָּ֗ה לְ/אֵ֣ל חַיָּֽ/י׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/042/008.yaml
  text: By day Yahweh commands his steadfast love[b][a], and at night his song is with me— a prayer to the God of my life.
translation:
  language: ru
  text: 'Днём Яхве повелевает своей верной любви,

    а ночью его песнь[a] со мной —

    молитва к Богу моей жизни[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «песнь Ему со мной», если еврейскую форму понимать без притяжательного значения. Основной текст следует прочтению «его песнь».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «к Богу, дающему мне жизнь». Буквально по-еврейски: «к Богу моей жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹמָם
  choice: Днём
  rationale: Наречное обозначение времени; кратко и естественно образует параллель с «ночью».
- source_word: יְצַוֶּה
  choice: посылает
  rationale: В этом поэтическом контексте глагол изображает Яхве повелевающим Своей любви сопровождать псалмопевца. Русское «посылает» естественно передаёт эту идею поручения, не создавая грамматически неполной фразы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: חַסְדּוֹ
  choice: Свою неизменную любовь
  rationale: חסד означает верную, постоянную любовь и милость; «неизменная любовь» передаёт устойчивость и личный характер этого отношения.
- source_word: וּבַלַּיְלָה
  choice: а ночью
  rationale: Союз оформляет временное сопоставление дня и ночи; в русском «а» выражает его естественнее, чем простое «и».
- source_word: שיר/ה
  choice: Его песнь
  rationale: Основной текст понимает форму как указание на песнь, принадлежащую Богу или исходящую от Него; альтернативное прочтение сохранено в сноске.
- source_word: עִמִּי
  choice: со мной
  rationale: Передаёт присутствие и сопровождение; связка в настоящем времени в русском не требуется.
- source_word: תְּפִלָּה
  choice: молитва
  rationale: Приложение поясняет, чем является песнь, остающаяся с псалмопевцем.
- source_word: לְאֵל
  choice: к Богу
  rationale: Предлог ל обозначает адресата или направленность молитвы.
- source_word: חַיָּי
  choice: моей жизни
  rationale: Форма с суффиксом первого лица означает «моя жизнь»; сохранена необычная и богословски ёмкая еврейская конструкция.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе прямо употреблено четырёхбуквенное личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Смысл לְאֵל חַיָּי
  choice: к Богу моей жизни
  alternative: к Богу, дающему мне жизнь; к живому Богу
  rationale: חַיָּי — существительное с суффиксом «моя», а не прилагательное «живой». Основной текст сохраняет буквальную родительную конструкцию и не гармонизирует её с выражением «живой Бог» в ближайшем контексте.
- issue: Смысл שיר/ה
  choice: Его песнь
  alternative: песнь Ему
  rationale: Форма допускает разбор, при котором песнь понимается как Божья, но текстовая форма также позволяет иное понимание. Неопределённость отмечена в сноске, а не устранена.
translation_notes:
  register: Современный литературный русский язык с краткими поэтическими строками. Сохранены личное имя «Яхве», образ дня и ночи и необычное выражение «Бог моей жизни». «Посылает» выбрано вместо тяжеловесного «повелевает Своей любви», чтобы естественно передать поэтическую персонификацию действия любви.
