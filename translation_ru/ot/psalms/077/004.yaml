  text: אָ֭חַזְתָּ שְׁמֻר֣וֹת עֵינָ֑/י נִ֝פְעַ֗מְתִּי וְ/לֹ֣א אֲדַבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/004.yaml
  text: You have held my eyelids open[b][a]; I am troubled and cannot speak.
translation:
  language: ru
  text: Ты не даёшь моим векам сомкнуться[a]; я в смятении[b] и не могу говорить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ты удерживаешь стражи моих глаз». Вероятно, это означает, что Бог не даёт псалмопевцу закрыть глаза и уснуть.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «я потрясён», «я встревожен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחַזְתָּ
  choice: Ты не даёшь… сомкнуться
  rationale: Форма qal perfect 2 м. ед. обращена к Богу. В сочетании со следующим выражением глагол передаёт удерживание глаз от сна; по-русски это естественно выражается конструкцией «не даёшь… сомкнуться».
- source_word: שְׁמֻרוֹת עֵינָי
  choice: моим векам
  rationale: Буквально выражение связано со «стражами/стражами́ глаз» и, вероятно, обозначает веки либо бодрствование глаз. «Векам сомкнуться» ясно передаёт вероятный смысл — Бог лишает псалмопевца сна, — а буквальный образ сохранён в сноске.
- source_word: נִפְעַמְתִּי
  choice: я в смятении
  rationale: Niphal 1 ед. от פעם обозначает внутреннюю потрясённость, тревогу или возбуждение. «В смятении» сохраняет эмоциональную широту слова, не сводя его только к страху или растерянности.
- source_word: וְלֹא אֲדַבֵּר
  choice: и не могу говорить
  rationale: 'Формально: «и не говорю/не буду говорить». В контексте смятения наиболее вероятна неспособность говорить, а не сознательный отказ; модальная передача естественна по-русски.'
theological_decisions: []
