  edition: WLC
  text: אֶֽזְכְּרָ֥ה נְגִינָתִ֗/י בַּ֫/לָּ֥יְלָה עִם לְבָבִ֥/י אָשִׂ֑יחָה וַ/יְחַפֵּ֥שׂ רוּחִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/006.yaml
  text: I remember my song in the night[a]; with my heart I meditate[d][c][b], and my spirit searches.
translation:
  language: ru
  text: Ночью я вспоминаю свою песню[a], размышляю в сердце своём[b], и дух мой ищет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою мелодию» или «свою музыку».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «беседую с сердцем своим»; еврейский глагол может обозначать как внутреннее размышление, так и обращённую к себе речь.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «исследует». В еврейском тексте не сказано прямо, что именно ищет или исследует дух псалмопевца.'
    reason: ambiguity
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: я вспоминаю
  rationale: Форма допускает будущее или волитивное прочтение, но в последовательности внутреннего размышления настоящее время естественно передаёт продолжающееся воспоминание.
- source_word: נְגִינָתִי
  choice: свою песню
  rationale: נגינה может обозначать песню, мелодию или музыку; «песню» здесь естественно связывает воспоминание с личным переживанием псалмопевца.
- source_word: בַּלָּיְלָה
  choice: ночью
  rationale: Краткая наречная форма точно и естественно передаёт временное значение еврейского оборота.
- source_word: עִם לְבָבִי אָשִׂיחָה
  choice: размышляю в сердце своём
  rationale: שׂיח может означать внутреннее размышление или беседу с собой. Русский оборот передаёт интроспективный смысл, не создавая неестественного представления о сердце как отдельном собеседнике.
- source_word: וַיְחַפֵּשׂ רוּחִי
  choice: и дух мой ищет
  rationale: 'Сохранено отсутствие названного объекта поиска: внутренний дух псалмопевца напряжённо ищет, но текст не уточняет, что именно.'
theological_decisions:
- issue: Объект поиска духа
  choice: 'не уточнять объект: «дух мой ищет»'
  alternative: «дух мой ищет ответа»
  rationale: В еврейском тексте объект не выражен; добавление «ответа» было бы правдоподобным, но снимало бы подлинную открытость образа.
- issue: Значение רוּחִי
  choice: «дух мой»
  alternative: «мой разум» / «всё моё существо»
  rationale: «Дух» сохраняет широту антропологического значения רוּחַ и не сводит внутренний поиск лишь к интеллектуальной деятельности.
translation_notes:
  register: Современный литературный русский с сохранением поэтической инверсии в выражениях «в сердце своём» и «дух мой». Формулировка остаётся понятной, сдержанной и близкой к образности еврейского текста.
