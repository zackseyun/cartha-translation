lexical_decisions:
- source_word: זֹרְמוּ מַיִם
  choice: излили воду
  rationale: Глагол זֹרְמוּ обозначает обильное течение или излияние. Сочетание «излили воду» естественно по-русски и сохраняет силу образа.
- source_word: עָבוֹת
  choice: облака
  rationale: Слово обозначает плотные облачные массы; нейтральное «облака» ясно передаёт смысл без добавления отсутствующего в тексте уточнения.
- source_word: קוֹל נָתְנוּ
  choice: подали голос
  rationale: Буквально «дали голос/звук». Русский поэтический оборот «подали голос» сохраняет олицетворение и не заменяет его прямо толкованием «загремели».
- source_word: שְׁחָקִים
  choice: небеса
  rationale: Слово может означать небеса, выси или облака. «Небеса» отличает его от עָבוֹת в первой строке и сохраняет поэтический параллелизм.
- source_word: אַף
  choice: и
  rationale: Частица добавляет и усиливает заключительный образ. В русском «и» естественно передаёт нарастание; более явное «даже» могло бы создать нежелательный оттенок неожиданности.
- source_word: חֲצָצֶיךָ
  choice: стрелы Твои
  rationale: Основное значение существительного — «стрелы». В контексте богоявления в буре они, вероятно, служат образом молний, но буквальный поэтический образ сохранён в основном тексте.
- source_word: יִתְהַלָּכוּ
  choice: разлетались повсюду
  rationale: Форма передаёт движение в разных направлениях. «Разлетались повсюду» естественно сочетается со стрелами и сохраняет динамику образа, не называя их молниями напрямую.
theological_decisions:
- issue: Стрелы как буквальный воинский образ или метафора молний в явлении Бога среди бури
  choice: Сохранить в основном тексте «стрелы Твои», позволяя контексту указывать на молнии.
  alternative: 'Перевести прямо: «Твои молнии сверкали повсюду».'
  rationale: Еврейское слово непосредственно означает «стрелы», тогда как отождествление их с молниями выводится из контекста. Сохранение метафоры не устраняет намеренную поэтическую многозначность.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Строки передают трёхчастное нарастание образов; местоимение «Твои» написано с прописной буквы как традиционный русский знак уважительного обращения к Богу, без изменения смысла исходного текста.
