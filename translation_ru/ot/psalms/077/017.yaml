  text: 'Облака излили воду;

    небеса подали голос;

    даже стрелы Твои двигались.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твои молнии двигались». В еврейском тексте буквально: «Твои стрелы»; в описании бури это, вероятно, образ молний.'
