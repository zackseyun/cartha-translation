  text: Ты искупил Свой народ Своей рукой[a] — сыновей Иакова и Иосифа[b]. Села[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавил». «Рукой» передан образ Божьей руки (буквально: «мышцы») как Его могучей силы в действии.'
    reason: lexical_alternative
  - marker: b
    text: «Сыновья Иакова и Иосифа» могут быть поэтическим обозначением Израиля; имя Иосифа, возможно, особо выделяет колена, произошедшие от него.
    reason: alternative_reading
  - marker: c
    text: «Села» — вероятно, богослужебная или музыкальная помета; её точное значение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: גָּאַלְתָּ
  choice: избавил
  rationale: Глагол גאל обозначает действие искупителя и совершённое им освобождение. В данном воспоминании о спасительных деяниях Бога «избавил» естественно звучит по-русски и сохраняет смысл освобождения; оттенок «искупил» отмечен в сноске.
- source_word: בִּזְרוֹעַ
  choice: мышцею Твоею
  rationale: Сохраняется буквальный поэтический образ Божьей руки как Его действующей силы; традиционная возвышенная лексема «мышца» понятна в библейском контексте и соответствует достоинству псалма.
- source_word: עַמֶּךָ
  choice: народ Твой
  rationale: Точно передаёт עַם с суффиксом второго лица и обращение к Богу.
- source_word: בְּנֵי
  choice: сынов
  rationale: Формально передаёт генеалогическое בְּנֵי и не заменяет его толкованием «потомков».
- source_word: יַעֲקֹב וְיוֹסֵף
  choice: Иакова и Иосифа
  rationale: Сохраняются оба имени и их неразъяснённая поэтическая соотнесённость без сведения Иосифа к определённым коленам.
- source_word: סֶלָה
  choice: Села
  rationale: Термин транслитерирован, поскольку точное значение этой вероятной музыкальной или богослужебной пометы неизвестно.
theological_decisions:
- issue: Национальное обозначение «сыны Иакова и Иосифа»
  choice: Сохранить двойное именование буквально и грамматически представить его как приложение к «народу».
  alternative: Передать как «потомков Иакова и Иосифа» либо истолковать Иосифа как обозначение северных колен.
  rationale: Еврейский текст не объясняет представительскую функцию имени Иосифа; буквальная передача сохраняет историко-поэтическую многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой дикцией. Формы «Твой», «Твоею» сохраняют традиционное почтительное написание при обращении к Богу; «мышцею» удерживает исходный образ и поэтический ритм.
