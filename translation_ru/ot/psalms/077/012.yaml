  text: Буду размышлять[a] обо всех Твоих делах и размышлять о Твоих деяниях.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду говорить обо всех Твоих делах». Еврейский глагол может означать «размышлять» или «говорить»; здесь параллелизм скорее поддерживает значение размышления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָגִיתִי
  choice: Буду размышлять
  rationale: Форма Qal 1-го лица единственного числа от הגה передаёт вдумчивое размышление; в поэтическом контексте уместно волевое значение будущего времени.
- source_word: בְכָל
  choice: обо всех
  rationale: Предлог ב при глаголе мысли обозначает предмет размышления; по-русски естественно «размышлять обо всех».
- source_word: פָעֳלֶךָ
  choice: делах Твоих
  rationale: פֹּעַל означает дело, труд или деятельность. Русское множественное число естественно выражает собирательный смысл и сохраняет параллелизм.
- source_word: וּבַעֲלִילוֹתֶיךָ
  choice: Твои деяния
  rationale: עֲלִילָה означает дело, деяние или поступок. «Деяния» сохраняет возвышенный поэтический регистр без добавления отсутствующего в тексте определения «могущественные».
- source_word: אָשִׂיחָה
  choice: обдумывать
  rationale: שיח допускает значения внутреннего размышления и речи. Здесь «обдумывать» сохраняет созерцательный смысл, поддержанный параллелизмом, и избегает дословного повтора.
