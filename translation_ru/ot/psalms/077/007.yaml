  text: הַֽ֭/לְ/עוֹלָמִים יִזְנַ֥ח אֲדֹנָ֑/י וְ/לֹֽא יֹסִ֖יף לִ/רְצ֣וֹת עֽוֹד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/007.yaml
  text: Will the Lord reject forever[a], and never again show favor?
translation:
  language: ru
  text: Неужели Владыка отвергнет навеки и больше никогда не окажет благоволения?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַלְעוֹלָמִים
  choice: Неужели ... навеки
  rationale: Вопросительная частица הַ вводит риторический вопрос, а לְעוֹלָמִים выражает неограниченную длительность. «Неужели ... навеки» естественно передаёт и вопрос, и его скорбную напряжённость.
- source_word: יִזְנַח
  choice: отвергнет
  rationale: Глагол означает отвергнуть, отринуть, оставить. «Отвергнет» ясно и современно передаёт разрыв благосклонного отношения.
- source_word: אֲדֹנָי
  choice: Владыка
  rationale: В источнике стоит божественный титул Адонай, а не имя יהוה. «Владыка» сохраняет различие между титулом и собственным именем и уместно в возвышенном, но понятном русском регистре.
- source_word: וְלֹא יֹסִיף ... עוֹד
  choice: и больше никогда не
  rationale: Сочетание отрицания, יֹסִיף и עוֹד выражает прекращение действия без последующего возобновления. «Больше никогда не» естественно передаёт смысл «никогда впредь».
- source_word: לִרְצוֹת
  choice: явит благоволения
  rationale: В данном контексте רצה обозначает благосклонное расположение или проявление милости. «Явит благоволения» передаёт направленность отношения и не сводит смысл к субъективному «будет доволен».
theological_decisions:
- issue: Передача божественного титула אֲדֹנָי
  choice: Владыка
  alternative: Господь
  rationale: Исходный текст употребляет титул Адонай, не тетраграмматон. «Владыка» переводит титул и помогает не смешивать его с принятой передачей имени יהוה словом «Господь»; при этом не вводится особое конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической молитвы. Риторический вопрос сохранён; порядок и формулировка сделаны естественными для русского читателя без устранения напряжения между переживаемым отвержением и надеждой псалмопевца.
