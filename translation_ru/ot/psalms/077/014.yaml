source:
  edition: WLC
  text: אַתָּ֣ה הָ֭/אֵל עֹ֣שֵׂה פֶ֑לֶא הוֹדַ֖עְתָּ בָ/עַמִּ֣ים עֻזֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/014.yaml
  text: You are the God who works wonders[b][a]; you have made your strength known among the peoples.
translation:
  language: ru
  text: Ты — Бог, творящий чудеса; Ты явил Свою силу среди народов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди племён». Еврейское עַמִּים может обозначать народы, племена или нации.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: Бог
  rationale: Определённая форма подчёркивает, что речь идёт об истинном Боге; в русском именная конструкция «Ты — Бог» естественно передаёт это отождествление без неопределённости.
- source_word: עֹשֵׂה פֶלֶא
  choice: творящий чудеса
  rationale: Причастие выражает характерное действие Бога. Единственное פֶלֶא допускает собирательное значение; русское множественное «чудеса» естественно передаёт ряд дивных деяний, не сужая смысл до специального термина.
- source_word: הוֹדַעְתָּ
  choice: Ты явил
  rationale: Каузативная форма означает «сделал известной, дал узнать». «Явил» кратко и поэтично передаёт публичное обнаружение Божьей силы.
- source_word: בָעַמִּים
  choice: среди народов
  rationale: Предлог ב здесь естественно передаётся как «среди», а עַמִּים охватывает народы или нации без обязательного современного политического оттенка.
- source_word: עֻזֶּךָ
  choice: Свою силу
  rationale: עֹז обозначает силу, мощь или могущество. «Силу» — прямой, естественный русский эквивалент; возвратное «Свою» ясно соотносит её с подлежащим «Ты».
theological_decisions:
- issue: Сфера явления Божьей силы в בָעַמִּים
  choice: среди народов
  alternative: среди племён / народам
  rationale: Перевод сохраняет пространственно-публичный оттенок предлога и широкий охват множества народов, не превращая выражение в более узкое утверждение об адресатах откровения.
translation_notes:
  register: Современный литературный русский с лаконичным, возвышенным поэтическим строем. Тире в «Ты — Бог» передаёт эмфатическое отождествление; прописные местоимения сохранены как уместная русская библейская издательская норма.
