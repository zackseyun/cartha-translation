  text: אֶזְכְּרָ֣ה אֱלֹהִ֣ים וְ/אֶֽהֱמָיָ֑ה אָשִׂ֓יחָה וְ/תִתְעַטֵּ֖ף רוּחִ֣/י סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/003.yaml
  text: I remember God[a], and I groan; I meditate, and my spirit grows faint[b]. Selah
translation:
  language: ru
  text: Вспоминаю Бога — и стону; размышляю[a] — и дух мой изнемогает[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сетую»; еврейский глагол может означать как раздумье, так и исполненную скорби жалобу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дух мой подавлен».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְכְּרָה
  choice: вспоминаю
  rationale: Форма 1-го лица может иметь настоящее, будущее или волевое значение; в контексте плача настоящее время естественно передаёт происходящее внутреннее действие, не устраняя полностью поэтической открытости формы.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: В данном контексте слово обозначает Бога Израиля; форма винительного падежа требуется русским глаголом «вспоминаю».
- source_word: וְאֶהֱמָיָה
  choice: и стону
  rationale: Глагол המה передаёт слышимое проявление смятения или скорби; «стону» кратко и естественно выражает состояние молящегося.
- source_word: אָשִׂיחָה
  choice: размышляю
  rationale: Глагол שיח может обозначать размышление, внутреннюю речь или излияние жалобы. «Размышляю» хорошо соответствует параллели с воспоминанием, а возможность значения жалобы сохранена в сноске.
- source_word: וְתִתְעַטֵּף
  choice: изнемогает
  rationale: Форма Hitpael глагола עטף может описывать ослабление, угасание сил или состояние подавленности; «изнемогает» естественно сочетается с «дух мой» и сохраняет образ внутреннего упадка.
- source_word: רוּחִי
  choice: дух мой
  rationale: В контексте внутреннего переживания רוּחַ обозначает дух, внутреннее существо человека, а не только физическое дыхание.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неизвестно, поэтому он передан традиционной русской транслитерацией без предположительного толкования.
