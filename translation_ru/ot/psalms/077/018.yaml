lexical_decisions:
- source_word: ק֤וֹל רַעַמְךָ
  choice: Голос Твоего грома
  rationale: קול может означать как «звук», так и «голос». Поэтическое «голос грома» естественно для русского библейского регистра и сохраняет образ личного действия Бога; суффикс 2-го лица передан словом «Твоего».
- source_word: בַּגַּלְגַּל
  choice: в вихре
  rationale: גלגל буквально связано с колесом и вращением, но в данном контексте грома и молний, вероятно, обозначает кружащуюся бурю. «В вихре» сохраняет динамический образ; буквальная возможность отмечена в сноске.
- source_word: הֵאִירוּ בְרָקִים
  choice: молнии озарили
  rationale: Каузативная форма אור означает «дать свет, осветить». «Озарили» кратко и естественно передаёт внезапное яркое освещение молниями.
- source_word: תֵּבֵל
  choice: мир
  rationale: תבל обозначает земной мир, нередко обитаемый мир. В космической картине теофании естественно краткое «мир».
- source_word: רָגְזָה
  choice: содрогнулась
  rationale: Глагол выражает дрожь, волнение или потрясение. «Содрогнулась» подходит поэтическому контексту и не сливается по смыслу со следующим глаголом.
- source_word: וַתִּרְעַשׁ
  choice: и затряслась
  rationale: רעש означает трястись, сотрясаться. Отдельный русский глагол сохраняет еврейское усиление посредством двух близких, но не тождественных действий.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте космической богоявленческой картины речь идёт о земле в целом, а не о конкретной стране.
