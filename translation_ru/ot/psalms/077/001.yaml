  source_fidelity: 'Нужна существенная правка второго полустишия. וְהַאֲזִין в представленном масоретском тексте — hифильный императив мужского рода единственного числа: «и/да внемлет [Он] мне», а не изъявительное «Он внимает мне». Поэтому утверждение о Божьем ответе и сноска о будущем, цели или ожидании не соответствуют данной форме. Повтор «קוֹלִי אֶל־אֱלֹהִים» уместно сохранить.'
