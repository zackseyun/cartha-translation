  yaml_path: translation/ot/psalms/077/001.yaml
  text: My voice is to God[a], and I cry out; my voice is to God[b], and he gives ear to me.
translation:
  language: ru
  text: 'К Богу обращаю я голос мой и взываю; к Богу обращаю я голос мой: да внемлет Он мне.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹלִי אֶל אֱלֹהִים
  choice: К Богу обращаю я свой голос
  rationale: 'Буквально: «мой голос — к Богу». В русском добавлен подразумеваемый глагол «обращаю», чтобы передать направленность голоса и избежать неестественной именной конструкции; одинаковый перевод в обоих полустишиях сохраняет повтор и параллелизм.'
- source_word: וְאֶצְעָקָה
  choice: и взываю
  rationale: Глагол צעק обозначает сильный зов, особенно крик о помощи. «Взываю» передаёт напряжённость молитвенного обращения и соответствует поэтическому регистру.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте форма אֱלֹהִים относится к единому Богу и переводится в единственном числе.
- source_word: וְהַאֲזִין
  choice: и Он внимает
  rationale: Глагол אזן в породе hифиль выражает не просто слышание, а внимательное слушание. «Внимает» сохраняет этот оттенок и естественно звучит в поэтической речи.
- source_word: אֵלָי
  choice: мне
  rationale: Предлог с суффиксом первого лица буквально означает «ко мне»; при русском глаголе «внимать» нормативно употребляется дательный падеж.
theological_decisions:
- issue: Характер Божьего ответа во втором полустишии
  choice: 'Утвердительное высказывание: «Он внимает мне»'
  alternative: 'Просьба или цель: «да услышит Он меня» / «чтобы Он услышал меня»; либо будущее: «Он услышит меня»'
  rationale: Форма וְהַאֲזִין допускает в поэтическом контексте конечное употребление инфинитива с силой личной глагольной формы. Контекст и традиционное понимание поддерживают утвердительное чтение, однако грамматическая сжатость не позволяет категорически исключить оттенок ожидания или цели; это отражено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной псалмовой лексикой. Инверсия «обращаю я» поддерживает поэтический ритм, а точный повтор первой конструкции сохраняет еврейский параллелизм.
