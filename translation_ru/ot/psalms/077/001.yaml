  terminology: «Взывать» точно передаёт צעק как напряжённый призыв. «Внемлет» — естественный в псалмовом регистре эквивалент hифиля אזן («внимательно выслушать»); форма «да внемлет» корректно выражает императив, адресованный Богу. «Бог» и местоимение «Он» оформлены надлежащим образом.
