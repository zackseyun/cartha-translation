base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/009.yaml
  text: Has God forgotten to be gracious? Has he in anger shut up his compassion? Selah[a][b]
translation:
  language: ru
  text: Неужели Бог забыл быть милостивым? Неужели Он в гневе затворил Своё сострадание? Села.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Неужели Бог забыл являть благоволение? Или Он в гневе удержал Свои милости?»'
    reason: lexical_alternative
  - marker: b
    text: «Села» — вероятно, богослужебное или музыкальное указание; его точное значение неизвестно.
    reason: cultural_note
lexical_decisions:
- source_word: הֲשָׁכַח
  choice: Неужели ... забыл
  rationale: Вопросительная частица с глаголом שׁכח вводит риторический вопрос. «Неужели» естественно передаёт скорбное недоумение, а «забыл» сохраняет прямой смысл глагола.
- source_word: חַנּוֹת
  choice: миловать
  rationale: Инфинитив от חנן означает проявлять милость или благоволение. Русское «миловать» лаконично и сохраняет характерную для библейской речи лексику милости.
- source_word: אֵל
  choice: Бог
  rationale: Здесь אֵל — обычное наименование Бога; перевод «Бог» точен и понятен.
- source_word: אִם
  choice: Неужели
  rationale: После первого риторического вопроса אִם вводит второй, параллельный ему вопрос. Повтор «неужели» создаёт естественный русский параллелизм; значение альтернативы «или» отмечено в сноске.
- source_word: קָפַץ
  choice: затворил
  rationale: Глагол передаёт образ закрывания или замыкания. «Затворил» сохраняет конкретную метафору и при этом звучит достойно в поэтическом контексте.
- source_word: בְּאַף
  choice: в гневе
  rationale: אַף буквально означает «нос», а переносно — гнев. «В гневе» является точным и естественным соответствием.
- source_word: רַחֲמָיו
  choice: Своё сострадание
  rationale: Форма грамматически множественная, но может обозначать совокупное или отвлечённое понятие милосердия. Единственное число «сострадание» естественно по-русски; вариант с множественным числом дан в сноске.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неизвестно, поэтому он передан традиционной русской транслитерацией, а его вероятная функция пояснена в сноске.
theological_decisions:
- issue: Передать ли высказывания как риторические вопросы или как утверждения
  choice: Два риторических вопроса, выражающих мучительное недоумение псалмопевца
  alternative: 'Утверждения: «Бог забыл… Он затворил…»'
  rationale: Вопросительная частица и поэтический контекст плача указывают на риторические вопросы. Утвердительный перевод чрезмерно усилил бы обвинение и устранил напряжённость текста.
translation_notes:
  register: Современный литературный русский с сохранением достоинства библейской поэзии. Риторический параллелизм передан повтором «неужели»; конкретная метафора קפץ сохранена глаголом «затворил». Все сноски обозначены в основном тексте.
