lexical_decisions:
- source_word: נָחִיתָ
  choice: Ты вёл
  rationale: Форма 2-го лица единственного числа прямо обращена к Богу и обозначает ведение; «вёл» естественно по-русски и сохраняет образ пастыря.
- source_word: כַצֹּאן
  choice: как стадо
  rationale: כ выражает сравнение, а צאן — собирательное название мелкого скота, прежде всего овец и коз; «как стадо» сохраняет собирательный пастушеский образ.
- source_word: עַמֶּךָ
  choice: Свой народ
  rationale: עם здесь означает принадлежащий Богу народ; возвратное «Свой» естественно соотносит его с подлежащим «Ты».
- source_word: בְּיַד
  choice: рукой
  rationale: Буквально «рукой»; сочетание обозначает посредничество или действие через кого-либо. Сохранение образа руки передаёт форму еврейского выражения, а пояснение дано в сноске.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Моисея и Аарона
  rationale: Использованы традиционные и общепонятные русские формы библейских имён в требуемом родительном падеже.
theological_decisions:
- issue: Соотношение Божьего действия и посредничества Моисея и Аарона
  choice: Бог непосредственно назван ведущим народ, а Моисей и Аарон — теми, через кого Он действовал.
  alternative: Понять Моисея и Аарона лишь как сопровождающие исторические фигуры, не выражая их посреднической роли.
  rationale: Местоименная форма глагола обращена к Богу как к главному деятелю, тогда как בְּיַד вводит Моисея и Аарона как человеческих посредников; перевод сохраняет оба аспекта.
translation_notes:
  register: Современный литературный русский язык с поэтической краткостью. Обращение к Богу передано традиционным уважительным написанием «Ты», «Свой». Буквальный образ «рукой» сохранён как понятная библейская метафора и разъяснён в сноске.
