  text: הֶ/אָפֵ֣ס לָ/נֶ֣צַח חַסְדּ֑/וֹ גָּ֥מַר אֹ֝֗מֶר לְ/דֹ֣ר וָ/דֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/008.yaml
  text: Has his steadfast love ceased forever? Has his promise come to an end for generation after generation?[a]
translation:
  language: ru
  text: Неужели навеки иссякла Его верная любовь? Неужели Его обещание[a] утратило силу для всех поколений?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Его слово», «Его изречение».'
    reason: 'Лексическая альтернатива: אֹמֶר буквально означает «слово, изречение», тогда как «обещание» передаёт вероятный контекстуальный смысл.'
lexical_decisions:
- source_word: הֶאָפֵס
  choice: иссякла
  rationale: Глагол выражает прекращение или исчезновение. «Иссякла» естественно сочетается с любовью и передаёт тревожный вопрос плача, не утверждая, что это действительно произошло.
- source_word: לָנֶצַח
  choice: навеки
  rationale: Обычное русское соответствие значению постоянной, окончательной длительности; сохраняет резкость вопроса.
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: חֶסֶד обозначает преданную, неизменную благосклонность, нередко в рамках заветных отношений. «Верная любовь» передаёт и любовь, и надёжность без архаизма и без чрезмерного терминологического сужения.
- source_word: גָּמַר
  choice: пришёл конец
  rationale: Оборот передаёт завершение или прекращение и естественно звучит по-русски применительно к обещанию.
- source_word: אֹמֶר
  choice: Его обещанию
  rationale: Буквально существительное означает «слово, изречение». В параллели с верной любовью Бога оно, вероятно, указывает на данное Им слово, то есть обещание. Более формальное «слово» сохранено в сноске.
- source_word: לְדֹר וָדֹר
  choice: на все поколения
  rationale: Выражение охватывает последовательность поколений. В данном русском синтаксисе «на все поколения» звучит естественнее буквального «из поколения в поколение» и сохраняет временной масштаб.
theological_decisions:
- issue: Передавать ли אֹמֶר буквально как «слово» или контекстуально как «обещание»
  choice: обещание
  alternative: слово
  rationale: Контекст ставит под вопрос Божью неизменную любовь и надёжность данного Им слова. «Обещание» ясно выражает вероятный смысл, однако не бесспорно заключённый в самой лексеме; поэтому буквальная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством поэтического плача. Повтор «Неужели» передаёт вопросительную частицу и эмоциональное напряжение; прописное «Его» соответствует принятому благоговейному русскому оформлению местоимений, относящихся к Богу.
