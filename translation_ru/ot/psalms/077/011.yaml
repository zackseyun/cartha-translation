  text: אזכיר מַֽעַלְלֵי יָ֑הּ כִּֽי אֶזְכְּרָ֖ה מִ/קֶּ֣דֶם פִּלְאֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/011.yaml
  text: I will remember the deeds of Yah[b][a], for I will remember your wonders from of old.
translation:
  language: ru
  text: Вспомню[a] деяния Яха, ибо вспомню твои чудеса, совершённые в древности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвещу деяния Яха». Глагол может означать как внутреннее припоминание, так и упоминание вслух.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «твои чудеса издревле»; «твои давние чудеса».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַזְכִּיר
  choice: вспомню
  rationale: Глагол в породе хифиль может означать «напомнить», «упомянуть», «возвестить» или «вспомнить». В данном поэтическом контексте «вспомню» естественно передаёт сознательное обращение псалмопевца к прошлому и сохраняет повтор корня זכר во второй строке.
- source_word: מַעַלְלֵי
  choice: деяния
  rationale: Слово обозначает поступки или совершённые дела. «Деяния» сохраняет возвышенный поэтический регистр и хорошо сочетается с речью о Божьих чудесах.
- source_word: יָהּ
  choice: Яха
  rationale: В еврейском тексте употреблена краткая поэтическая форма Божьего имени יָהּ, а не тетраграмматон יהוה. Форма «Яха» позволяет сохранить это различие; родительный падеж требуется русским синтаксисом после слова «деяния».
- source_word: כִּי
  choice: передано бессоюзным параллелизмом
  rationale: כִּי здесь допускает пояснительное или усилительное понимание. В русском стихе бессоюзное повторение «вспомню» естественно передаёт усиление и не навязывает причинного отношения, которое в данном контексте звучало бы тяжеловесно.
- source_word: אֶזְכְּרָה
  choice: вспомню
  rationale: Когортативная форма выражает решительное намерение говорящего. Будущее совершенного вида «вспомню» передаёт волевой оттенок и сохраняет повтор с первым глаголом.
- source_word: מִקֶּדֶם
  choice: древних времён
  rationale: Выражение указывает на давние, прежние времена, не обязательно на абсолютное начало. Такая формулировка ясна современному читателю и сохраняет временную глубину оригинала.
- source_word: פִּלְאֶךָ
  choice: твои чудеса
  rationale: Существительное обозначает чудо или дивное деяние. Множественное «чудеса» естественно по-русски и соответствует собирательно-множественному смыслу в параллели с «деяниями».
theological_decisions:
- issue: Передача краткой поэтической формы Божьего имени יָהּ
  choice: 'Ях (в тексте: «Яха»)'
  alternative: Господь
  rationale: Оригинал содержит יָהּ, а не полную форму יהוה. Транслитерация сохраняет намеренное лексическое различие и не смешивает краткую форму имени с традиционной заменой тетраграмматона титулом «Господь».
- issue: Связь между двумя частями стиха при כִּי
  choice: бессоюзное усилительное повторение
  alternative: «ибо вспомню»
  rationale: Частица может быть пояснительной либо усилительной. Бессоюзная конструкция сохраняет поэтическую напряжённость и смысловой параллелизм, не превращая вторую часть в однозначное причинное обоснование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Повтор «вспомню» сохраняет риторическую структуру еврейского текста; инверсия и архаизмы сведены к минимуму. Все сноски отмечены в основном тексте.
