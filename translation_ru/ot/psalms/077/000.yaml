base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/000.yaml
  text: 'For the choir director: according to Jeduthun[d][c][b][a]. A psalm of Asaph.'
translation:
  language: ru
  text: Для руководителя хора[a]. По Идифуну[b] — псалом Асафа[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «для музыкального руководителя»; традиционно также «начальнику хора».
    reason: lexical_alternative
  - marker: b
    text: Выражение «по Идифуну» может указывать на мелодию, способ исполнения, музыкальный состав либо группу, связанную с Идифуном.
    reason: cultural_note
  - marker: c
    text: Или «для Асафа». Еврейский предлог может указывать на авторство, принадлежность, связь или посвящение.
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Для руководителя хора
  rationale: В надписаниях псалмов слово обычно указывает на того, кто руководит музыкальным исполнением. Такой перевод ясен современному читателю и не использует архаичное «начальнику хора».
- source_word: עַל
  choice: По
  rationale: В музыкальном надписании предлог может вводить указание на мелодию, способ исполнения, состав исполнителей или связанную с именем традицию; краткое «по» сохраняет эту неопределённость.
- source_word: יְדוּתוּן
  choice: Идифун
  rationale: Личное имя или название связанной с ним группы передано в принятой русской библейской форме.
- source_word: לְאָסָף
  choice: Асафа
  rationale: Конструкция «Псалом Асафа» естественна по-русски, а сноска сохраняет неоднозначность еврейского предлога, который может указывать на авторство, принадлежность, связь или посвящение.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Обычное русское обозначение данного поэтического и музыкального жанра.
theological_decisions:
- issue: Характер связи псалма с Асафом
  choice: Псалом Асафа
  alternative: Псалом для Асафа
  rationale: Исходный предлог не позволяет однозначно решить, идёт ли речь об авторстве, принадлежности, связи с традицией Асафа или посвящении; основной текст остаётся кратким, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; форма надписания краткая и торжественная. Избегается архаичное «начальнику хора», при этом в сносках сохранена неопределённость древнееврейских музыкальных и авторских обозначений.
