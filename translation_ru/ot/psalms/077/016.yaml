source:
  edition: WLC
  text: רָ֘א֤וּ/ךָ מַּ֨יִם אֱֽלֹהִ֗ים רָא֣וּ/ךָ מַּ֣יִם יָחִ֑ילוּ אַ֝֗ף יִרְגְּז֥וּ תְהֹמֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/016.yaml
  text: The waters saw you[a], O God; the waters saw you and writhed[b]; even the depths trembled.
translation:
  language: ru
  text: 'Увидели Тебя воды, Боже,

    увидели Тебя воды — и заметались[a];

    даже бездны[b] содрогнулись.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «задрожали», «забились в судорогах» или «замучились, как в родах». Еврейский глагол может обозначать судорожное сотрясение или мучительное корченье.'
    reason: lexical_alternative
  - marker: b
    text: То есть глубинные воды, морские пучины.
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּךָ
  choice: увидели Тебя
  rationale: Форма Qal с суффиксом 2-го лица мужского рода единственного числа прямо означает «увидели Тебя». Повтор сохранён как значимый элемент поэтического параллелизма.
- source_word: מַיִם
  choice: воды
  rationale: Множественное «воды» естественно передаёт собирательный и поэтически олицетворённый образ водной стихии; слово повторено вслед за еврейским текстом.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Контекст требует звательной формы прямого обращения. «Боже» ясно и естественно выражает её в современном литературном русском языке.
- source_word: יָחִילוּ
  choice: заметались
  rationale: Глагол חול/חיל может обозначать судорожное движение, мучительное корченье или дрожь. «Заметались» передаёт бурное движение вод и не дублирует следующий глагол со значением содрогания.
- source_word: אַף
  choice: даже
  rationale: 'Частица усиливает следующую ступень образа: содрогаются не только воды, но даже глубины.'
- source_word: יִרְגְּזוּ
  choice: содрогнулись
  rationale: רגז обозначает дрожь, потрясение или содрогание. Выбор сохраняет сильную реакцию глубин на Божье присутствие и хорошо звучит в поэтической строке.
- source_word: תְהֹמוֹת
  choice: бездны
  rationale: Множественное число от תְּהוֹם обозначает глубинные воды, морские пучины. «Бездны» кратко сохраняет космический масштаб образа; смысл уточнён в сноске.
theological_decisions:
- issue: Олицетворение космических вод перед Богом
  choice: Сохранить поэтическое изображение вод и бездн, реагирующих на Божье присутствие, не уточняя, какое именно событие подразумевается.
  alternative: Ограничить смысл прямой ссылкой на переход через Красное море либо представить стих как описание борьбы с мифическими морскими силами.
  rationale: Еврейский текст изображает саму водную стихию содрогающейся перед Богом, но не объясняет образ в рамках этого стиха. Перевод сохраняет эту открытость и не вносит в текст частное толкование.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Повтор первой части сохранён; архаичные «вострепетали» и «возмутились» не использованы. Заглавное «Тебя» соответствует принятой в русском библейском стиле почтительной графике.
