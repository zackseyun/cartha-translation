base_translation:
  language: en
  yaml_path: translation/ot/psalms/077/019.yaml
  text: Your way was through the sea[a], and your paths through many waters[b], yet your footprints were not known.
translation:
  language: ru
  text: 'Твой путь — через море[a],

    Твои тропы — через многие воды,

    и следы Твои были неведомы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в море… в многих водах». Еврейский предлог может означать «в», но здесь, вероятно, указывает на движение через воды.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Твои отпечатки ног (или шаги) не были известны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיָּם
  choice: через море
  rationale: Предлог בְּ буквально может означать «в», но при слове «путь» здесь естественно передаёт движение через водное пространство. Такой перевод сохраняет образ пути посреди моря.
- source_word: דַּרְכֶּךָ
  choice: Твой путь
  rationale: דֶּרֶךְ означает «путь, дорога». «Путь» естественно звучит по-русски и сохраняет как конкретный, так и более широкий смысл слова.
- source_word: שביליך
  choice: Твои тропы
  rationale: שְׁבִיל обозначает тропу или колею. «Тропы» поддерживает поэтический параллелизм со словом «путь», не сливая оба образа.
- source_word: בְּמַיִם רַבִּים
  choice: через великие воды
  rationale: רַבִּים применительно к водам допускает значения «многие» и «великие, обильные». Традиционно-поэтическое, но понятное выражение «великие воды» передаёт масштаб водной стихии; «через» согласуется с образом движения.
- source_word: עִקְּבוֹתֶיךָ
  choice: следы Твои
  rationale: Слово может обозначать следы, отпечатки ног или шаги. «Следы» естественно сочетается с утверждением, что они остались неведомы, и передаёт образ отсутствия различимой череды отпечатков.
- source_word: לֹא נֹדָעוּ
  choice: были неведомы
  rationale: 'Страдательная форма от ידע буквально выражает то, что следы «не были известны». «Были неведомы» сохраняет смысловую открытость: следы могли быть невидимы, нераспознаваемы или недоступны человеческому знанию.'
theological_decisions:
- issue: Степень конкретизации образа исхода через море
  choice: Сохранить поэтический образ Божьего пути через море, не называя прямо переход через Красное море.
  alternative: Прямо указать на переход через Красное море при исходе.
  rationale: 'Контекст вызывает в памяти избавление через воды, однако сам стих не называет событие. Неконкретизированный образ сохраняет напряжение текста: Бог действует среди вод, но Его следы остаются неведомы.'
- issue: Смысл неизвестности Божьих следов
  choice: 'Передать буквально и многозначно: «были неведомы».'
  alternative: 'Уточнить: «не были видны» или «их невозможно было проследить».'
  rationale: Еврейский глагол говорит о неизвестности, не уточняя, идёт ли речь о невидимости, нераспознаваемости или непостижимости. Перевод не должен устранять эту богословскую и поэтическую многозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим строем. Инверсия «следы Твои» поддерживает ритм и обращение к Богу; слово «неведомы» несколько возвышенно, но ясно и позволяет сохранить намеренную смысловую открытость еврейского текста.
