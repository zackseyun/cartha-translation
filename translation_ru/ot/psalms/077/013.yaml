  yaml_path: translation/ot/psalms/077/013.yaml
  text: God[a], your way is in holiness; who is a great god like God?
translation:
  language: ru
  text: Боже, Твой путь — в святости[a]. Какой бог столь велик, как Бог?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во святилище». Еврейское выражение может обозначать как святость, так и святое место, святилище.'
