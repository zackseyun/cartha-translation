lexical_decisions:
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма обращения естественна ввиду следующего местоименного суффикса второго лица в выражении «Твой путь»; русский звательный смысл передан формой «Боже».
- source_word: בַּקֹּדֶשׁ
  choice: в святости
  rationale: קֹדֶשׁ может обозначать как святость, так и святое место, святилище. Основной текст сохраняет характеристику Божьего пути, а пространственное прочтение вынесено в сноску.
- source_word: דַּרְכֶּךָ
  choice: Твой путь
  rationale: «Путь» естественно передаёт как образ действий Бога, так и направление Его деяний.
- source_word: מִי אֵל גָּדוֹל
  choice: Кто из богов велик
  rationale: Русская сравнительная конструкция естественно передаёт риторический вопрос о том, существует ли какой-либо бог, равный Богу по величию.
- source_word: כֵּאלֹהִים
  choice: как Бог
  rationale: Префикс כְּ выражает сравнение, а אֱלֹהִים в данном контексте обозначает единственного Бога.
theological_decisions:
- issue: Значение בַּקֹּדֶשׁ
  choice: Божий путь пребывает в сфере святости или характеризуется святостью
  alternative: Божий путь — во святилище
  rationale: Еврейское выражение допускает и абстрактное, и пространственно-культовое понимание. Основной текст не сводит высказывание к местоположению, а сноска сохраняет реальную альтернативу.
- issue: Сравнение Бога с אֵל
  choice: Риторическое сопоставление с любым из богов
  alternative: Кто велик, как Ты, Боже?
  rationale: Исходный текст буквально сохраняет существительное אֵל в сравнительном вопросе и затем אֱלֹהִים; перевод не устраняет эту формулировку и не превращает её в прямое обращение.
translation_notes:
  register: Современный литературный русский язык; возвышенный, но понятный регистр. Прописные местоимения в обращении к Богу использованы в соответствии с принятой русской библейской традицией. Конструкция «Кто из богов велик, как Бог?» сохраняет риторическую силу и различие между אֵל и אֱלֹהִים.
