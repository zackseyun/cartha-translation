lexical_decisions:
- source_word: וָאֹמַר
  choice: Тогда я сказал
  rationale: Последовательная глагольная форма вводит новый поворот в размышлении псалмопевца; «тогда» естественно передаёт развитие речи.
- source_word: חַלּוֹתִי
  choice: моя боль
  rationale: Трудная форма может обозначать болезнь, немощь или страдание. «Боль» сохраняет широту смысла и соответствует контексту плача, не сводя выражение только к телесной болезни.
- source_word: הִיא
  choice: вот
  rationale: Женское местоимение указывает на названную боль или состояние. В русском высказывании указательное «вот» естественно передаёт это отождествление.
- source_word: שְׁנוֹת
  choice: годы
  rationale: Наиболее прямое понимание — форма слова «год» во множественном числе и сопряжённом состоянии. Возможное понимание от корня «изменять» сохранено в сноске.
- source_word: יְמִין
  choice: десница
  rationale: Поэтическое «десница» сохраняет библейский образ правой руки как силы и спасительного действия Бога.
- source_word: עֶלְיוֹן
  choice: Всевышний
  rationale: Устоявшаяся и понятная передача божественного титула, выражающего высшее положение Бога.
theological_decisions:
- issue: Толкование синтаксически и лексически трудного стиха
  choice: Псалмопевец называет своей болью «годы десницы Всевышнего», вероятно вспоминая прежние времена Его могущественных деяний; эллиптичность исходного текста сохранена.
  alternative: '«Вот моя немощь»; либо: «Десница Всевышнего изменилась».'
  rationale: Слова חַלּוֹתִי и שְׁנוֹת допускают несколько толкований. Основной текст следует наиболее прямому чтению «годы», но не добавляет отсутствующих в еврейском тексте пояснений, а существенные альтернативы приводит в сносках.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмовой лексикой. Слово «десница» сохранено ради поэтического образа и привычного библейского звучания; трудная, сжатая конструкция оригинала не разглажена поясняющими добавлениями.
