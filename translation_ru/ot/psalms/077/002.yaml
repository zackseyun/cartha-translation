lexical_decisions:
- source_word: בְּיוֹם צָרָתִי
  choice: В день моей беды
  rationale: Сочетание בְּיוֹם с существительным צָרָה обозначает время бедствия. «В день моей беды» сохраняет поэтическую форму еврейского текста и естественно звучит по-русски.
- source_word: אֲדֹנָי
  choice: Господа
  rationale: Здесь употреблён титул אֲדֹנָי, а не имя יהוה. В русском контексте прямого дополнения нормативна форма «Господа».
- source_word: דָּרָשְׁתִּי
  choice: я искал
  rationale: Глагол דרשׁ по отношению к Богу означает настойчиво искать Его, обращаться к Нему; «искал» передаёт это прямо и без добавочного толкования.
- source_word: יָדִי
  choice: рука моя
  rationale: Сохранено единственное число исходного текста и поэтический порядок слов.
- source_word: לַיְלָה נִגְּרָה וְלֹא תָפוּג
  choice: ночью … была простёрта и не опускалась
  rationale: Буквальный образ с נגר («литься, изливаться») применительно к руке труден. Основной текст передаёт вероятный образ неотступной молитвы с простёртой рукой; неоднозначность отражена в сноске.
- source_word: מֵאֲנָה הִנָּחֵם
  choice: отказывалась утешиться
  rationale: מֵאֲנָה выражает отказ, а нифаль הִנָּחֵם — принятие утешения. Русская возвратная конструкция естественно передаёт сочетание «отказывалась быть утешенной».
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נֶפֶשׁ может означать душу, жизнь или самого человека; «душа моя» сохраняет поэтический регистр и внутреннюю направленность плача.
theological_decisions:
- issue: Передача אֲדֹנָי
  choice: Господа
  alternative: Владыку
  rationale: В данном месте стоит божественный титул אֲדֹנָי, а не тетраграмматон. Традиционное и понятное русское соответствие «Господь» сохраняет различие между титулом и личным именем, не внося конфессионального уточнения.
translation_notes:
  register: Современный литературный русский с умеренно поэтическим, достойным псалмового плача строем. Инверсия «рука моя», «душа моя» сохраняет поэтическое звучание, оставаясь понятной современному читателю.
