id: PSA.32.1
reference: Psalms 32:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/001.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: ru
  text: 'Давида[a]. Маскил[b].


    Блажен тот, чьё преступление прощено[c], чей грех покрыт.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский предлог перед именем Давида допускает несколько смыслов: «Давида», «для Давида» или «связанный с Давидом»; точный характер этой связи не уточняется.'
    reason: textual_ambiguity
  - marker: b
    text: Евр. маскил — обозначение в заголовке псалма, точный смысл которого неизвестен; возможно, имеется в виду назидательное или созерцательное произведение.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «поднято» или «унесено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Краткая форма заголовка сохраняет неоднозначность еврейского לְ: речь может идти об авторстве, принадлежности, посвящении или связи с Давидом. Добавление «псалом» или «песнь» внесло бы отсутствующее в тексте слово.'
- source_word: מַשְׂכִּיל
  choice: Маскил
  rationale: Точное значение и назначение термина в заголовке неизвестны; транслитерация не создаёт ложной определённости, а возможные смыслы поясняются в сноске.
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Форма выражает торжественное провозглашение благополучия и благословенности. «Блажен» естественно для русской библейской поэзии и содержательнее нейтрального «счастлив».
- source_word: נְשׂוּי
  choice: прощено
  rationale: Причастие от נשׂא буквально связано с поднятием или унесением, но в сочетании с проступком идиоматически означает его прощение; исходный образ отмечен в сноске.
- source_word: פֶּשַׁע
  choice: преступление
  rationale: Слово обозначает сознательное нарушение, проступок или мятеж. «Преступление» сохраняет нравственную серьёзность и естественно сочетается с «грехом» в параллельной строке.
- source_word: כְּסוּי
  choice: покрыт
  rationale: Сохранён прямой образ пассивного причастия от כסה — «покрывать, скрывать» — и его поэтический параллелизм с прощением преступления.
- source_word: חֲטָאָה
  choice: грех
  rationale: В параллели с преступлением слово означает нравственную вину или грех, а не жертву за грех.
theological_decisions:
- issue: Единственное число обобщённого лица в формуле блаженства
  choice: Блажен тот
  alternative: Блажен человек; Блаженны те
  rationale: Еврейский текст говорит об одном типичном представителе. «Тот» сохраняет единственное число, не вводит ненужного указания на мужской пол и звучит естественно по-русски.
- issue: Толкование термина מַשְׂכִּיל
  choice: Сохранить «Маскил» в основном тексте
  alternative: Назидательная песнь; созерцательная песнь
  rationale: Значение жанрового или литургического обозначения спорно, поэтому перевод одним из предполагаемых смыслов преждевременно устранил бы подлинную неопределённость.
- issue: Образ прощения в נְשׂוּי
  choice: Передать смысл как «прощено», сохранив образ в сноске
  alternative: унесено; снято
  rationale: В данном сочетании слово идиоматически говорит о прощении преступления. Буквальная передача в основном тексте могла бы затемнить смысл, однако образ снятой или унесённой вины не должен быть утрачен.
translation_notes:
  register: Современный литературный русский с сохранением краткости и торжественного строя еврейской поэзии. Заголовок намеренно лаконичен и не дополняется словами «псалом» или «песнь», которых нет в данной строке оригинала. Термин «маскил» транслитерирован и пояснён; архаичные синтаксические формы не используются.
