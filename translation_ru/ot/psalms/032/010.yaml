- source_word: בַּיהוָה
  choice: на Яхве
  rationale: При глаголе «полагаться» русский язык требует предлога «на»; личное имя יהוה передано как «Яхве».
- source_word: חֶסֶד
  choice: верная любовь
  rationale: Передаёт устойчивую, деятельную и верную любовь, не сужая значение исключительно до милости и не добавляя прямо отсутствующее в стихе слово «завет».
- source_word: יְסוֹבְבֶנּוּ
  choice: окружает
  rationale: Точно и естественно передаёт образ полного окружения; местоименный суффикс соотнесён с тем, кто полагается на Яхве.
