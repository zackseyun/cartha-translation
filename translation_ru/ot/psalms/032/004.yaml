  text: כִּ֤י יוֹמָ֣ם וָ/לַיְלָה֮ תִּכְבַּ֥ד עָלַ֗/י יָ֫דֶ֥/ךָ נֶהְפַּ֥ךְ לְשַׁדִּ֑/י בְּ/חַרְבֹ֖נֵי קַ֣יִץ סֶֽלָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/004.yaml
  text: For day and night your hand was heavy upon me[a]; my vitality was dried up as by the heat of summer[b]. Selah
translation:
  language: ru
  text: Ибо день и ночь рука Твоя тяжело лежала на мне; жизненная сила моя[a] иссохла, словно от летнего зноя[b]. Села.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «мой сок» или «моя влага».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в летнюю засуху»; более буквально всю строку можно передать: «жизненная влага моя превратилась в летнюю сухость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит объяснение предыдущего высказывания; «ибо» ясно передаёт эту связь и соответствует достоинству поэтической речи.
- source_word: יוֹמָם וָלַיְלָה
  choice: день и ночь
  rationale: Сохранён естественный меризм, обозначающий непрерывность переживания.
- source_word: תִּכְבַּד ... יָדֶךָ עָלַי
  choice: рука Твоя тяжело лежала на мне
  rationale: Передан конкретный образ тяжести Божьей руки, не сводя его к отвлечённому наказанию или общему страданию.
- source_word: נֶהְפַּךְ
  choice: иссохла
  rationale: Буквальное значение связано с переменой состояния; в сочетании с образом летнего зноя здесь естественно выражено иссыхание, при этом более буквальная конструкция отмечена в сноске.
- source_word: לְשַׁדִּי
  choice: жизненная сила моя
  rationale: Редкое слово обозначает сок, влагу или жизненную свежесть; контекстуальное «жизненная сила» понятно современному читателю, а вещественный образ сохранён в сноске.
- source_word: בְּחַרְבֹנֵי קַיִץ
  choice: словно от летнего зноя
  rationale: Передан образ иссушающего летнего жара; возможное более буквальное указание на засуху приведено в сноске.
- source_word: סֶלָה
  choice: Села
  rationale: Неясный по точному значению богослужебный или музыкальный термин сохранён в транслитерации.
theological_decisions:
- issue: Божественное действие в страдании псалмопевца
  choice: Сохранено прямое утверждение, что Божья рука тяжело лежала на псалмопевце.
  alternative: Ослабить образ до общего внутреннего страдания либо усилить его до явного утверждения о карательном суде.
  rationale: Еврейский текст прямо приписывает воздействие Божьей руке, но в самом стихе не объясняет его точного богословского механизма; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Конкретный образ тяжёлой руки сохранён; редкая телесно-растительная метафора разъяснена без устранения её неоднозначности.
