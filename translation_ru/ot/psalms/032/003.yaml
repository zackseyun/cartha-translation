lexical_decisions:
- source_word: כִּי
  choice: Ибо, когда
  rationale: כִּי вводит поясняющее обстоятельство; сочетание «ибо, когда» естественно связывает стих с предыдущей мыслью и передаёт временной оттенок при глаголе.
- source_word: הֶחֱרַשְׁתִּי
  choice: я молчал
  rationale: Глагол חרשׁ означает «молчать». Объект молчания, вероятно грех, ясен из контекста, но в самом стихе не назван.
- source_word: בָּלוּ
  choice: изнемогали
  rationale: בלה обозначает изнашивание, обветшание или угасание. «Изнемогали» естественно передаёт постепенное телесное и внутреннее истощение, сохраняя поэтический образ.
- source_word: עֲצָמָי
  choice: кости мои
  rationale: 'Буквальный образ сохранён: в еврейской поэзии кости могут выражать состояние всего человека.'
- source_word: בְּשַׁאֲגָתִי
  choice: от стонов моих
  rationale: שׁאגה буквально может обозначать рёв или громкий крик; в контексте мучительного состояния «стоны» звучит естественно, а предлог «от» передаёт сопутствующую причину или средство истощения.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Прямое и естественное обозначение непрерывной продолжительности.
theological_decisions:
- issue: Следует ли прямо указать, что псалмопевец молчал о своём грехе
  choice: Оставить объект молчания невыраженным
  alternative: «когда я молчал о своём грехе»
  rationale: Контекст подсказывает, что речь идёт о непризнанном грехе, однако еврейский текст этого стиха прямо его не называет. Перевод сохраняет исходную краткость и не превращает контекстуальный вывод в часть текста.
translation_notes:
