lexical_decisions:
- source_word: עַל זֹאת
  choice: Поэтому
  rationale: Передаёт вывод из предшествующего свидетельства об исповедании и прощении, сохраняя смысловую связь.
- source_word: יִתְפַּלֵּל
  choice: пусть ... молится
  rationale: Имперфект в данном контексте естественно выражает побуждение.
- source_word: כָּל חָסִיד
  choice: каждый верный Тебе
  rationale: חָסִיד обозначает человека, отличающегося преданностью и благочестием; перевод передаёт этот смысл современно и без конфессионально окрашенного слова «святой».
- source_word: אֵלֶיךָ
  choice: Тебе
  rationale: Сохраняет направление молитвы и прямое обращение к Богу без добавления отсутствующего в стихе имени.
- source_word: לְעֵת מְצֹא
  choice: пока Тебя можно найти
  rationale: Передаёт распространённое понимание оборота как времени, когда Бог доступен ищущему, при этом альтернативная конструкция отмечена в сноске.
- source_word: רַק
  choice: Даже
  rationale: В контексте частица усиливает уверенность перед образом угрожающего потока; русское «даже» естественно связывает угрозу с обещанием недосягаемости.
- source_word: לְשֵׁטֶף מַיִם רַבִּים
  choice: разлив многих вод
  rationale: Сохраняет конкретный поэтический образ стремительного, обильного потока, не истолковывая его прямо как бедствие или суд.
- source_word: אֵלָיו לֹא יַגִּיעוּ
  choice: не достигнет его
  rationale: Передаёт направленность אֵלָיו и значение глагола נגע; согласование в единственном числе обусловлено русским собирательным образом «разлив».
theological_decisions:
- issue: К кому относится обещание защиты
  choice: Многие воды не достигнут верного Богу молящегося
  alternative: Воды не достигнут Бога; либо речь идёт исключительно о буквальном наводнении
  rationale: Местоимение мужского рода единственного числа естественнее всего относится к упомянутому верному человеку. Образ вод сохранён без догматического уточнения, символизирует ли он бедствие, суд или буквальную стихию.
- issue: Смысл לְעֵת מְצֹא
  choice: время, пока Бога можно найти
  alternative: время обретения или нахождения, без явно названного объекта
  rationale: Контекст молитвы к Богу поддерживает традиционное понимание подразумеваемого объекта как Бога, однако формальная неоднозначность еврейского оборота отмечена сноской.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Заглавные буквы в местоимениях прямого обращения к Богу использованы последовательно. Метафора вод сохранена, а не заменена её возможным толкованием.
