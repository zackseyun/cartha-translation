base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/002.yaml
  text: Blessed is the man to whom Yahweh does not count iniquity[b][a], and in whose spirit there is no deceit.
translation:
  language: ru
  text: Блажен человек, которому Господь не вменяет вины[a] и в чьём духе нет обмана[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «беззакония» или «греха». Еврейское слово может обозначать как проступок, так и связанную с ним вину.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лукавства», «неискренности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Форма выражает формулу блаженства; «блажен» сохраняет возвышенный библейский тон и не сводит смысл к субъективному ощущению счастья.
- source_word: אָדָם
  choice: человек
  rationale: В единственном числе слово имеет здесь обобщающее значение. Русское «человек» точно передаёт его без ограничения смысла мужчинами.
- source_word: יַחְשֹׁב ... לֹו
  choice: не вменяет
  rationale: Глагол в сочетании с косвенным дополнением передаёт исчисление или зачисление на счёт. «Вменяет» сохраняет этот образ и естественно сочетается с виной.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, соответствующая благоговейному чтению имени и устоявшемуся библейскому употреблению.
- source_word: עָוֹן
  choice: вины
  rationale: Слово может обозначать беззаконие, вину или последствие проступка. В конструкции с חשב особенно уместно «вина», поскольку оно сохраняет нравственный и учётно-судебный оттенки.
- source_word: בְּרוּחוֹ
  choice: в чьём духе
  rationale: Относительная конструкция естественно связывает вторую часть стиха с человеком из первой и передаёт внутреннюю настроенность личности.
- source_word: רְמִיָּה
  choice: лукавства
  rationale: Слово обозначает обман, неискренность или коварство. «Лукавство» сохраняет нравственную глубину и поэтический регистр псалма, оставаясь понятным современному читателю.
theological_decisions:
- issue: Обобщающее значение אָדָם
  choice: человек
  alternative: муж; мужчина
  rationale: Хотя существительное стоит в единственном числе, здесь оно обозначает любого человека, а не исключительно лицо мужского пола.
- issue: Судебно-учётный образ невменения
  choice: Господь не вменяет вины
  alternative: Господь не считает беззакония; Господь не ставит греха в вину
  rationale: Перевод сохраняет метафору зачисления на счёт, не превращая её в формулировку позднейшей догматической системы.
- issue: Диапазон значения עָוֹן
  choice: вина
  alternative: беззаконие; грех
  rationale: Контекст невменения допускает как проступок, так и связанную с ним виновность. Основной текст выбирает «вину», а сноска сохраняет смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Сохранены краткая формула блаженства, параллелизм и внутренняя нравственная направленность второй строки.
