  text: חַטָּאתִ֨/י אוֹדִ֪יעֲ/ךָ֡ וַ/עֲוֺ֘נִ֤/י לֹֽא כִסִּ֗יתִי אָמַ֗רְתִּי אוֹדֶ֤ה עֲלֵ֣י פְ֭שָׁעַ/י לַ/יהוָ֑ה וְ/אַתָּ֨ה נָ֘שָׂ֤אתָ עֲוֺ֖ן חַטָּאתִ֣/י סֶֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/005.yaml
  text: I made my sin known to you[a], and I did not cover my iniquity. I said, “I will confess my transgressions to Yahweh,” and you forgave the iniquity of my sin. Selah
translation:
  language: ru
  text: 'Я открыл тебе свой грех и не скрыл своего беззакония. Я сказал: «Я исповедаю Яхве свои преступления», — и ты простил[a] беззаконие моего греха. Села.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол буквально означает «ты поднял», «унёс» или «понёс» беззаконие моего греха; здесь этот образ снятия бремени передаёт смысл прощения.
    reason: Лексическая альтернатива и сохранение образности נָשָׂא.
lexical_decisions:
- source_word: חַטָּאתִי
  choice: свой грех
  rationale: חַטָּאת обычно обозначает грех или проступок; «грех» прямо и естественно передаёт значение и сохраняет отличие от עָוֹן и פֶּשַׁע.
- source_word: אוֹדִיעֲךָ
  choice: я открыл тебе
  rationale: Хифиль от ידע буквально означает «сделать известным». Русское «открыл тебе» естественно выражает сознательное признание греха, не сводя глагол к формуле исповеди.
- source_word: עֲוֺנִי
  choice: своего беззакония
  rationale: עָוֹן может обозначать беззаконие, вину или бремя вины. «Беззаконие» сохраняет вес слова и его отличие от «греха» и «преступлений».
- source_word: לֹא כִסִּיתִי
  choice: не скрыл
  rationale: כסה буквально означает «покрывать», а в данном контексте — скрывать. «Не скрыл» естественно по-русски и сохраняет образ утаивания греха.
- source_word: אוֹדֶה
  choice: исповедую
  rationale: Хифиль от ידה в сочетании с проступками означает признание или исповедание, а не благодарение.
- source_word: עֲלֵי פְשָׁעַי
  choice: свои преступления
  rationale: При ידה предлог עַל указывает на предмет признания. В русском это естественно передаётся прямым дополнением; פֶּשַׁע обозначает мятежный проступок или преступление.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом, что соответствует непосредственно представленному в еврейском тексте имени.
- source_word: נָשָׂאתָ
  choice: ты простил
  rationale: נשא буквально значит «поднять, понести, унести»; с грехом или беззаконием в качестве объекта это идиоматически означает прощение. Образ снятия бремени сохранён в сноске.
- source_word: עֲוֺן חַטָּאתִי
  choice: беззаконие моего греха
  rationale: Сочетание существительных сохранено без сглаживания до одного слова, чтобы передать многослойное обозначение виновности в еврейском тексте.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неясно, поэтому он транслитерирован без навязывания толкования вроде «пауза».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблён тетраграмматон; передача «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Передача נָשָׂאתָ עֲוֺן как буквального образа или идиомы прощения
  choice: ты простил
  alternative: ты снял беззаконие; ты понёс беззаконие
  rationale: В контексте покаянного признания выражение обозначает Божье прощение. Ясный идиоматический смысл дан в основном тексте, а подлинный образ поднятого или унесённого бремени отмечен в сноске.
- issue: Сохранение трёх обозначений греха
  choice: грех; беззаконие; преступления
  alternative: свести все три слова к «греху» или «вине»
  rationale: Различные еврейские слова חטאת, עון и פשע намеренно не унифицированы, чтобы сохранить поэтическую и богословскую многогранность текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Местоимение по отношению к Богу написано со строчной буквы как часть связного библейского текста, без изменения степени почтительности. Синтаксис остаётся ясным для обычного читателя; термин «Села» сохранён как традиционная транслитерация неопределённого технического слова.
