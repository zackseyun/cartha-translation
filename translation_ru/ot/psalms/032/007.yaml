lexical_decisions:
- source_word: סֵתֶר
  choice: укрытие
  rationale: Слово обозначает место, где можно скрыться и обрести защиту. «Укрытие» естественно по-русски и сохраняет образ убежища, не сводя его к абстрактной защите.
- source_word: מִצַּר
  choice: от беды
  rationale: צַר может обозначать бедствие, стеснённое положение или врага. «От беды» сохраняет общий смысл опасности и не конкретизирует её как личного противника.
- source_word: תִּצְּרֵנִי
  choice: Ты хранишь меня
  rationale: Форма от נצר передаёт значение «хранить, оберегать». «Хранишь меня» звучит естественно и соответствует образу Бога как укрытия.
- source_word: רָנֵּי
  choice: ликующими криками
  rationale: Множественное сопряжённое רָנֵּי обозначает звонкие, часто радостные возгласы. «Ликующие крики» передают звучность и радость выражения, не ограничивая его формой песни.
- source_word: פַלֵּט
  choice: избавления
  rationale: Форма от פלט выражает избавление, спасение или выход из опасности. «Избавление» сохраняет непосредственный смысл освобождения без дополнительной богословской конкретизации.
- source_word: תְּסוֹבְבֵנִי
  choice: окружаешь меня
  rationale: Глагол סבב значит «окружать, обступать». Выбор прямо сохраняет пространственный поэтический образ.
- source_word: סֶלָה
  choice: Села
  rationale: Точное значение термина неизвестно, поэтому он передан традиционной транслитерацией, а не истолкован как «пауза» или «интерлюдия».
theological_decisions:
- issue: Источник и характер окружающих возгласов избавления
  choice: Передано как «ликующие крики избавления», окружающие псалмопевца; источник криков не назван.
  alternative: «песни избавления», «возгласы спасения» или понимание их как победных песен определённых участников.
  rationale: Краткое еврейское сочетание רָנֵּי פַלֵּט допускает несколько близких толкований. Формулировка сохраняет радостный и защитный образ, но не уточняет, кто именно издаёт эти возгласы и являются ли они песнями.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Инверсия в последней строке сохраняет акцент на окружающих возгласах. Местоимение «Ты» в обращении к Богу написано с прописной буквы в соответствии с принятым благоговейным библейским регистром.
