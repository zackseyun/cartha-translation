  text: אַשְׂכִּֽילְ/ךָ֨ וְֽ/אוֹרְ/ךָ֗ בְּ/דֶֽרֶךְ ז֥וּ תֵלֵ֑ךְ אִֽיעֲצָ֖ה עָלֶ֣י/ךָ עֵינִֽ/י׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/008.yaml
  text: I will instruct you and teach you in the way you should go[c][b][a]; I will counsel you with my eye upon you.
translation:
  language: ru
  text: Я вразумлю тебя и наставлю на путь, по которому тебе идти[a][b]; дам тебе совет, не сводя с тебя глаз[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «по пути, которым ты пойдёшь» или «этим путём ты пойдёшь». Еврейский текст допускает буквальный смысл будущего времени, однако контекст наставления поддерживает перевод «по которому тебе идти».'
    reason: lexical_alternative
  - marker: b
    text: Говорящим можно считать ГОСПОДА или псалмопевца; сам еврейский текст этого стиха прямо его не называет.
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «на тебе глаз мой». Этот образ может выражать внимательное руководство, заботу или наблюдение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׂכִּילְךָ
  choice: Я вразумлю тебя
  rationale: Порода hифиль глагола שׂכל выражает наделение пониманием или разумением. «Вразумлю» сохраняет причинительный и наставительный смысл и соответствует возвышенному, но понятному регистру псалма.
- source_word: וְאוֹרְךָ
  choice: и наставлю
  rationale: Hифиль от ירה может означать «учить», «наставлять», «указывать направление». В сочетании с «путём» глагол «наставлю» естественно передаёт и обучение, и руководство.
- source_word: בְּדֶרֶךְ זוּ תֵלֵךְ
  choice: на путь, по которому тебе идти
  rationale: Еврейская конструкция буквально допускает смысл «по пути, которым ты пойдёшь» или «этим путём ты пойдёшь». Русская формулировка с «тебе идти» естественно выражает наставительный смысл контекста, не превращая его в категорическое предсказание.
- source_word: אִיעֲצָה
  choice: дам тебе совет
  rationale: Глагол יעץ означает «советовать, давать совет». Эта формулировка ясна современному читателю и сохраняет мудростный характер высказывания.
- source_word: עָלֶיךָ עֵינִי
  choice: не сводя с тебя глаз
  rationale: 'Буквально: «на тебе глаз мой». Русская идиома сохраняет образ внимательного взгляда и может выражать как заботливое руководство, так и неусыпное наблюдение.'
theological_decisions:
- issue: Кто говорит в Псалме 32:8
  choice: Сохранить первое лицо, не называя говорящего.
  alternative: Прямо определить говорящего как ГОСПОДА либо как псалмопевца.
  rationale: Сам стих грамматически не называет говорящего. Перевод сохраняет эту открытость и не разрешает спорный вопрос в основном тексте.
- issue: Смысл образа «на тебе глаз мой»
  choice: Сохранить образ внимательного взгляда без уточнения, идёт ли речь преимущественно о руководстве, заботе или надзоре.
  alternative: 'Передать абстрактно: «буду внимательно руководить тобой» или «буду наблюдать за тобой».'
  rationale: В еврейском тексте метафора допускает несколько близких оттенков; конкретизация неоправданно сузила бы смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис сделан плавным и понятным; метафора глаза сохранена в естественной русской идиоме. Маркеры сносок стоят непосредственно при соответствующих выражениях.
