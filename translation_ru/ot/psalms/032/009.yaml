  text: אַל תִּֽהְי֤וּ כְּ/ס֥וּס כְּ/פֶרֶד֮ אֵ֤ין הָ֫בִ֥ין בְּ/מֶֽתֶג וָ/רֶ֣סֶן עֶדְי֣/וֹ לִ/בְל֑וֹם בַּ֝֗ל קְרֹ֣ב אֵלֶֽי/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/009.yaml
  text: Do not be like a horse or like a mule[a], without understanding, whose trappings are bit and bridle to restrain it, or else it will not come near you.
translation:
  language: ru
  text: 'Не будьте как конь или мул, у которых нет понимания: снаряжение которых — удила и узда, чтобы сдерживать их; иначе к тебе не приблизятся.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы не приблизились к тебе». Заключительная фраза на еврейском допускает два понимания: животное либо не подходит без сдерживания, либо его нужно сдерживать, чтобы оно не приблизилось к тебе.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַל תִּהְיוּ
  choice: Не будьте
  rationale: אַל с имперфектом выражает запрет; форма множественного числа сохранена.
- source_word: כְּסוּס כְּפֶרֶד
  choice: как конь или мул
  rationale: Оба существительных стоят в единственном числе и образуют параллельное сравнение; «или» естественно передаёт выбор между двумя образами.
- source_word: אֵין הָבִין
  choice: лишённые разумения
  rationale: Оборот описывает отсутствие понимания или рассудительности. «Разумение» сохраняет нравственно-интеллектуальный оттенок и достойный поэтический регистр.
- source_word: בְּמֶתֶג וָרֶסֶן
  choice: удилами и уздой
  rationale: Названы принадлежности для управления животным; русская парная формула ясна и соответствует контексту.
- source_word: עֶדְיוֹ לִבְלֹם
  choice: их приходится удерживать
  rationale: Буквально עֶדְיוֹ может обозначать убранство или снаряжение животного, но еврейская конструкция трудна. Динамически передана функция удил и узды — сдерживание, без неестественного оборота «чьё убранство — удила и узда».
- source_word: בַּל קְרֹב אֵלֶיךָ
  choice: иначе животное не приблизится к тебе
  rationale: Основной вариант понимает заключение как отказ животного приблизиться без принуждения. Существительное «животное» позволяет сохранить грамматическое единственное число еврейского текста после двух сравнительных образов.
theological_decisions:
- issue: Направление смысла заключительной фразы בַּל קְרֹב אֵלֶיךָ
  choice: иначе животное не приблизится к тебе
  alternative: чтобы оно не приблизилось к тебе
  rationale: 'Еврейская фраза синтаксически неоднозначна: узда может быть нужна либо для того, чтобы подвести животное, либо для того, чтобы не дать ему ринуться к человеку. Основной текст следует первому пониманию, а второе сохраняется в сноске без догматического разрешения неоднозначности.'
translation_notes:
  register: Современный литературный русский с умеренно поэтическим библейским звучанием. Множественное «не будьте» обращено к слушателям, а единственное «животное» сохраняет число заключительной еврейской конструкции. Неясный образ עֶדְיוֹ передан функционально ради понятности; неоднозначность финала вынесена в сноску.
