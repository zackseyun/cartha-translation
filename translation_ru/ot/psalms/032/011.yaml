  source_fidelity: Первые два повеления и обращение «праведные» переданы верно; «в Яхве» точно сохраняет предлог ב и личное имя יהוה. Однако הַרְנִינוּ обозначает звучное, публичное радостное восклицание (иногда пение); «торжествуйте» передаёт настроение, но не выражает этого слышимого действия. Формула «чьи сердца прямы» является слишком буквальной и не вполне естественной по-русски; יִשְׁרֵי לֵב характеризует внутреннюю нравственную прямоту/цельность.
