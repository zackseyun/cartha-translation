lexical_decisions:
- source_word: שִׂמְחוּ
  choice: Радуйтесь
  rationale: Форма повелительного наклонения множественного числа призывает к радости; «радуйтесь» естественно и ясно передаёт это значение.
- source_word: בַיהוָה
  choice: в Яхве
  rationale: Предлог ב указывает на Того, в ком или о ком радуются; личное имя יהוה передано транслитерацией «Яхве».
- source_word: וְגִילוּ
  choice: и ликуйте
  rationale: Глагол גיל выражает бурную, восторженную радость; «ликуйте» сохраняет отличие от предшествующего שׂמח.
- source_word: צַדִּיקִים
  choice: праведные
  rationale: Множественное число употреблено как прямое обращение к праведным.
- source_word: וְהַרְנִינוּ
  choice: торжествуйте
  rationale: Hифильный императив от רנן обозначает громкое радостное восклицание или пение; «торжествуйте» естественно охватывает обе возможности, а примечание сохраняет конкретные альтернативы.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: все, чьи сердца прямы
  rationale: Конструкция буквально характеризует людей как «прямых сердцем», то есть внутренне честных и нравственно цельных; формулировка сохраняет образ сердца и понятна современному читателю.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем и титулом, не подменяя исходную форму.
