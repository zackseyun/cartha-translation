  terminology: «Яхве» последовательно передаёт тетраграмматон как личное имя. «Праведные» адекватно передаёт צַדִּיקִים. Для יִשְׁרֵי לֵב предпочтено естественное «чист сердцем», сохраняющее сердечную, внутреннюю характеристику без неестественной кальки.
