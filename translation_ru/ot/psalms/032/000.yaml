  text: לְ/דָוִ֗ד מַ֫שְׂכִּ֥יל אַשְׁרֵ֥י נְֽשׂוּי פֶּ֗שַׁע כְּס֣וּי חֲטָאָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/032/000.yaml
  text: Of David[a]. A Maskil. Blessed is the one whose transgression is forgiven[b], whose sin is covered.
translation:
  language: ru
  text: Давида. Маскил[a]. Блажен тот, чьё преступление прощено[b], чей грех покрыт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «маскил» — обозначение в заголовке псалма, точный смысл которого неизвестен; возможно, поучительное или созерцательное произведение.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «поднято» или «унесено».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְדָוִד
  choice: Давида
  rationale: Краткая форма надписания естественна по-русски и сохраняет неоднозначность еврейского לְ, которое может указывать на авторство, принадлежность, посвящение или связь с Давидом.
- source_word: מַשְׂכִּיל
  choice: Маскил
  rationale: Точный смысл жанрового обозначения неизвестен, поэтому оно передано транслитерацией, а возможное значение объяснено в сноске.
- source_word: אַשְׁרֵי
  choice: Блажен тот
  rationale: Передаёт формулу провозглашения счастливого, благословенного состояния в достоинственном и понятном современном русском языке.
- source_word: נְשׂוּי פֶּשַׁע
  choice: чьё преступление прощено
  rationale: Идиоматически выражает снятие вины; буквальный образ «поднято/унесено» сохранён в сноске.
- source_word: כְּסוּי חֲטָאָה
  choice: чей грех покрыт
  rationale: Сохраняет конкретную метафору исходного текста и параллелизм со строкой о прощённом преступлении.
theological_decisions:
- issue: Значение לְדָוִד в надписании
  choice: Давида
  alternative: Давидова / Давиду / о Давиде
  rationale: Родительный падеж сохраняет традиционную краткость и не навязывает исключительно авторское понимание.
- issue: Метафорический язык прощения
  choice: преступление прощено; грех покрыт
  alternative: преступление унесено; грех скрыт
  rationale: Первое выражение передано по смыслу с пояснением буквального образа, а второе оставлено метафорическим, чтобы сохранить богословский параллелизм и напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем псалма. Неясное жанровое обозначение сохранено транслитерацией; параллелизм и метафора покрытия греха удержаны.
