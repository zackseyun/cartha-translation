  yaml_path: translation/ot/psalms/064/008.yaml
  text: They are made to stumble[a]; their own tongue is against them[b]; all who see them shake their heads.
translation:
  language: ru
  text: Их заставляют споткнуться[a]; их собственный язык обращается против них; все, кто видит их, качают головами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская первая часть синтаксически трудна. Глагол означает «заставляют споткнуться», но имеет суффикс «его», тогда как далее стоит «против них — их язык». Местоимения соотносят по-разному. Здесь передан общий смысл: нечестивых губит их собственная речь.'
    reason: alternative_reading
  - marker: b
    text: Еврейский глагол можно также передать как «покачиваются», «содрогаются» или «уходят прочь».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְשִׁילוּהוּ
  choice: они спотыкаются
  rationale: 'Порода hифиль глагола כשׁל обычно выражает причинение падения или преткновения, однако форма содержит суффикс 3-го лица мужского рода единственного числа, а синтаксис всей первой части стиха неясен. В основном тексте передан наиболее вероятный в контексте смысл: нечестивые терпят падение из-за собственной речи; грамматическая трудность отмечена в сноске.'
- source_word: עָלֵימוֹ
  choice: против них
  rationale: Предлог על с местоименным суффиксом допускает значения «на них» и «против них». Здесь значение противодействия естественно сочетается с образом языка, обратившегося против своих владельцев.
- source_word: לְשׁוֹנָם
  choice: их собственный язык
  rationale: Сохранён конкретный образ единственного собирательного «языка», обозначающего речь. «Собственный» ясно выражает, что причиной их падения становится их же речь.
- source_word: יִתְנֹדֲדוּ
  choice: качают головой
  rationale: Глагол נוד может описывать качание, блуждание, содрогание или удаление. При словах «все, кто видит их» наиболее естествен видимый жест реакции — неодобрительное или изумлённое качание головой.
- source_word: כָּל רֹאֵה בָם
  choice: все, кто видит их
  rationale: Прямо переданы всеобщность כָּל, причастная конструкция «видящий» и местоименный объект.
theological_decisions:
- issue: Подразумеваемый деятель падения нечестивых
  choice: Деятель прямо не назван; падение связано с их собственным языком.
  alternative: «Он заставил их споткнуться», где подразумевается Бог из предыдущего контекста.
  rationale: Неясный синтаксис не позволяет уверенно вводить в русский основной текст неназванного деятеля. Такая передача сохраняет тему воздаяния, не уточняя сверх текста способ Божьего действия.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим параллелизмом. Выражение «качают головой» понятно широкому читателю и сохраняет образ наблюдаемой реакции; двоеточие показывает смысловую связь между падением и собственной речью нечестивых.
