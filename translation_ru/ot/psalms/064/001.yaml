lexical_decisions:
- source_word: שְׁמַע
  choice: Услышь
  rationale: Повелительная форма, обращённая к Богу. «Услышь» естественно передаёт молитвенную просьбу не просто воспринимать звук, но внять молящемуся.
- source_word: אֱלֹהִים
  choice: Боже
  rationale: Форма звательного обращения естественна для современной литературной русской молитвенной речи.
- source_word: קוֹלִי
  choice: голос мой
  rationale: Сохраняет конкретный образ еврейского текста и его поэтический порядок слов, не сводя выражение к общему «меня» или «мою молитву».
- source_word: בְשִׂיחִי
  choice: в сетовании моём
  rationale: В контексте просьбы о защите слово обозначает жалобное излияние или сетование. Вариант сохраняет форму существительного и молитвенно-поэтический регистр; подлинная неоднозначность отмечена в сноске.
- source_word: מִפַּחַד
  choice: от страха перед
  rationale: פַּחַד означает страх, ужас или трепет. «От страха перед врагом» — прямое и понятное по-русски выражение без усиления до панического ужаса.
- source_word: אוֹיֵב
  choice: врагом
  rationale: Сохраняет единственное число оригинала; оно может обозначать как конкретного врага, так и врага в собирательном или обобщённом смысле.
- source_word: תִּצֹּר
  choice: сохрани
  rationale: Глагол נצר выражает охрану и сохранение. С объектом «жизнь» русский глагол «сохрани» передаёт просьбу о защите естественно и точно.
- source_word: חַיָּי
  choice: жизнь мою
  rationale: Естественный русский эквивалент еврейской формы «моя жизнь»; не вводит более интерпретационное понятие «душа».
theological_decisions:
- issue: Значение בְשִׂיחִי в контексте плача
  choice: в сетовании моём
  alternative: в размышлении моём; в раздумье моём
  rationale: Контекст вражеской угрозы поддерживает значение жалобы или сетования, однако слово может обозначать и внутреннее размышление. Эта смысловая напряжённость не устраняется, а отражается в сноске.
- issue: Характер выражения מִפַּחַד אוֹיֵב
  choice: от страха перед врагом
  alternative: от ужаса, внушаемого врагом; от угрозы врага
  rationale: Буквальный оборот допускает оттенки переживаемого страха и страха, вызываемого врагом. Основной текст сохраняет понятие страха и не заменяет его более толковательным словом «угроза».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенно-поэтическим порядком слов. Архаизмы исключены; конкретное выражение «голос мой» и параллельное «жизнь мою» сохранены.
