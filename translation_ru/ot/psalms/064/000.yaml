  text: Руководителю хора. Псалом Давида[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «псалом, написанный Давидом»; или: «псалом для Давида». Еврейское выражение может указывать на авторство, связь с Давидом или посвящение ему.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: В надписаниях псалмов это слово обозначает человека, руководящего музыкальным исполнением. Такой перевод ясен современному читателю и передаёт культово-музыкальный контекст, хотя само еврейское слово буквально не называет хор.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Это устойчивое обозначение жанра псалма с музыкальными коннотациями; «псалом» является точным и общепонятным русским соответствием.
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Русская родительная конструкция естественна в заголовке и, подобно еврейской конструкции с לְ, не ограничивает смысл исключительно авторством: возможны также связь с Давидом или посвящение ему.'
theological_decisions:
- issue: Характер связи псалма с Давидом в надписании
  choice: Псалом Давида
  alternative: Псалом, написанный Давидом; псалом для Давида
  rationale: Еврейское לְדָוִד допускает авторство, принадлежность или связь с Давидом, а также посвящение. Формулировка «Псалом Давида» сохраняет эту смысловую широту и не утверждает больше, чем позволяет исходный текст.
translation_notes:
  register: Современный литературный русский язык; краткое, достоинственное надписание. Традиционный термин «псалом» сохранён, а синтаксис сделан естественным для современного читателя.
