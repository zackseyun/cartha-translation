  yaml_path: translation/ot/psalms/064/003.yaml
  text: who sharpen their tongue like a sword; they bend their arrow—a bitter word—
translation:
  language: ru
  text: 'которые наточили язык свой, как меч,

    нацелили свою стрелу — горькое слово.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁנְנוּ
  choice: отточили
  rationale: Передаёт буквальный образ затачивания и естественно сочетается с уподоблением мечу.
- source_word: לְשׁוֹנָם
  choice: язык свой
  rationale: Сохраняет единственное собирательное число еврейского текста и его поэтическую образность.
- source_word: דָּרְכוּ
  choice: натянули лук
  rationale: Глагол обозначает натягивание/взведение лука; слово «лук» эксплицировано из устойчивого образа, поскольку буквально названная далее «стрела» сама по себе не натягивается.
- source_word: חִצָּם
  choice: чтобы пустить стрелу
  rationale: Сохраняет образ стрелы и делает по-русски ясной цель натягивания лука; местоименный суффикс передан контекстуально, без тяжеловесного «свою стрелу».
- source_word: דָּבָר מָר
  choice: горькое слово
  rationale: Прямо передаёт метафорическое отождествление стрелы с пагубной, жестокой речью.
theological_decisions:
- issue: Связь выражения «горькое слово» со «стрелой»
  choice: Передать как пояснительное приложение после тире
  alternative: 'Понимать как отдельное дополнение: «нацелили... горькое слово»'
  rationale: Пунктуация сохраняет поэтическое отождествление речи с оружием, не добавляя богословской интерпретации.
- issue: Необычная конструкция «натянули свою стрелу»
  choice: Эксплицировать подразумеваемый лук и представить стрелу как предназначенную к пуску
  alternative: 'Формально передать: «натянули свою стрелу»'
  rationale: В еврейской поэзии объектом דָּרַךְ обычно является лук; масоретский текст здесь необычно называет стрелу. Перевод сохраняет оба элемента образа, но избегает в русском физически непонятной формулировки.
translation_notes:
  register: Современный литературный русский с сохранением высокого поэтического регистра псалма. Инверсия «язык свой» уместна в стихотворной строке; образ оружия сохранён без конфессионально окрашенных добавлений.
