base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/006.yaml
  text: 'They devise injustices: “We have perfected a carefully concealed plot.” And the inward part of each man, and the heart, are deep.'
translation:
  language: ru
  text: 'Они тщательно обдумывают злодеяния:


    «Мы завершили тщательно продуманный замысел».


    Глубоки недра человека и сердце его.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחְפְּשׂוּ עוֹלֹת
  choice: Они замышляют беззакония
  rationale: Глагол חפשׂ здесь передаёт усердное изыскивание или продумывание, а עוֹלֹת — неправедные дела; естественное русское выражение сохраняет злонамеренный характер действия.
- source_word: תַּמְנוּ
  choice: мы довели до совершенства
  rationale: Форма от תמם выражает завершение, доведение до конца или совершенства; перевод сохраняет оттенок удовлетворённости тщательно подготовленным замыслом.
- source_word: חֵפֶשׂ מְחֻפָּשׂ
  choice: тайный замысел
  rationale: Этимологическая фигура связана с тщательным разыскиванием и исследованием; в контексте заговора она указывает на тщательно продуманный и скрытый план. Русский перевод передаёт смысл без неестественного буквального повтора.
- source_word: וְקֶרֶב אִישׁ וְלֵב עָמֹק
  choice: Глубоки внутренность человека и его сердце
  rationale: Сохранены два параллельных обозначения внутреннего мира — קֶרֶב и לֵב — и предикативное עָמֹק, подчёркивающее непостижимость человеческих побуждений.
theological_decisions:
- issue: Глубина человеческой внутренности и сердца
  choice: Сохранено как утверждение о скрытой, трудно постижимой внутренней жизни человека
  alternative: Истолковать непосредственно как нравственную испорченность или хитрость
  rationale: Еврейский текст говорит о глубине, но не называет её здесь прямо порочностью; контекст злого заговора создаёт отрицательный оттенок, который не следует превращать в добавленное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. Несколько шероховатая координация заключительной строки сохранена ради параллелизма и смыслового напряжения еврейского текста.
