lexical_decisions:
- source_word: יִשְׂמַח
  choice: возрадуется
  rationale: Имперфект в контексте ожидаемого итога Божьего суда передан будущим временем; «возрадуется» сохраняет поэтическую торжественность и положительный смысл.
- source_word: צַדִּיק
  choice: праведник
  rationale: Субстантивированное прилагательное мужского рода в единственном числе естественно и точно передаётся русским существительным «праведник»; в контексте оно имеет представительное значение.
- source_word: בַּיהוָה
  choice: в Яхве
  rationale: Предлог ב обозначает Того, в Ком сосредоточена радость или Кто служит её основанием; форма «в Яхве» сохраняет эту связь, а тетраграмматон передан личным именем «Яхве».
- source_word: וְחָסָה בּוֹ
  choice: и укроется у Него
  rationale: Глагол חסה обозначает поиск убежища и защиты. «Укроется у Него» сохраняет образ прибежища и звучит естественно по-русски.
- source_word: וְיִתְהַלְלוּ
  choice: будут хвалиться
  rationale: Порода hitpael глагола הלל может выражать хвалу, торжество или похвальбу. «Будут хвалиться» сохраняет лексическую неоднозначность, а положительный контекст исключает самодовольное самовосхваление.
- source_word: כָּל יִשְׁרֵי לֵב
  choice: все, чьё сердце право
  rationale: Такой оборот естественно передаёт множественное обозначение людей и сохраняет древнееврейский образ прямого, нравственно цельного сердца.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; передача «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Положительный или отрицательный смысл יתהַללו
  choice: будут хвалиться
  alternative: будут торжествовать
  rationale: Глагол допускает значение хвалиться или торжествовать. Контекст Божьего спасительного суда придаёт действию положительный смысл, однако перевод не уточняет без основания, чем именно хвалятся правые сердцем.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Сохранены единственное число слова «праведник», образ убежища и метафора правого сердца; избегаются архаизмы и конфессионально обусловленные уточнения.
