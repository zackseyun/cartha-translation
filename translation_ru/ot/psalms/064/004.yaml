  text: לִ/יר֣וֹת בַּ/מִּסְתָּרִ֣ים תָּ֑ם פִּתְאֹ֥ם יֹ֝רֻ֗/הוּ וְ/לֹ֣א יִירָֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/064/004.yaml
  text: to shoot at the blameless from hiding places[b][a]; suddenly they shoot at him and do not fear.
translation:
  language: ru
  text: чтобы из укрытий стрелять в непорочного[a]; внезапно они стреляют в него и не боятся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «невиновного». Еврейское слово может обозначать как нравственную безупречность, так и невиновность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִירוֹת
  choice: стрелять
  rationale: В контексте нападения глагол ירה естественно означает «стрелять». Упоминание стрел не добавлено, поскольку в данном стихе объект орудия не назван.
- source_word: בַּמִּסְתָּרִים
  choice: из укрытий
  rationale: Существительное обозначает скрытые, потаённые места; русское «из укрытий» естественно передаёт позицию, откуда ведут стрельбу, хотя предлог буквально означает «в».
- source_word: תָּם
  choice: непорочного
  rationale: Слово обозначает человека цельного, нравственно безупречного или невиновного; «непорочного» сохраняет этический оттенок и форму единственного числа.
- source_word: פִּתְאֹם
  choice: внезапно
  rationale: Прямо передаёт резкость и неожиданность нападения.
- source_word: יֹרֻהוּ
  choice: они стреляют в него
  rationale: Местоименный суффикс мужского рода единственного числа относится к «непорочному». Оборот не утверждает прямо, что выстрел непременно достиг цели.
- source_word: וְלֹא יִירָאוּ
  choice: и не боятся
  rationale: Сохранена краткость исходного текста и отсутствие явно названного объекта страха.
theological_decisions: []
