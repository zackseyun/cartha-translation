  terminology: «Непорочного» удачно передаёт תָּם с акцентом на нравственную цельность; сноска «невиновного» адекватно фиксирует существенную лексическую альтернативу. «Стрелять» не необоснованно уточняется до «стрелять стрелами» и не создаёт ассоциации с конкретным современным оружием.
