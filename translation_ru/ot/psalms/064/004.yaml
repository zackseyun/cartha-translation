  source_fidelity: 'Перевод точно передаёт еврейский текст: инфинитив цели «чтобы ... стрелять», засаду/скрытые места, нравственно цельного человека в единственном числе, внезапность нападения, последующее «стреляют в него» и неуказанный объект страха. «Из укрытий» является естественной русской передачей пространственно-исходного смысла в образе засады, не вводя нового содержания.'
