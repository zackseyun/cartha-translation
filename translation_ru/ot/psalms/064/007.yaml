  text: But God shoots an arrow at them[a]; suddenly they are wounded.
translation:
  language: ru
  text: Но Бог пустил в них стрелу[a] — внезапно они оказались ранены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «Но Бог пустил в них стрелу; внезапно — их раны».'
    reason: Сохраняет направление действия, выраженное местоименным суффиксом при глаголе, и именную, эллиптическую конструкцию מַכּוֹתָם («их раны»), не выдавая спорно сглаженную русскую фразу за буквальный перевод.
lexical_decisions:
- source_word: וַיֹּרֵם
  choice: пустил в них
  rationale: Форма от ירה с местоименным суффиксом 3-го лица множественного числа изображает Бога стреляющим в них. Прошедшее время передаёт повествовательную форму wayyiqtol, а выражение «пустил в них стрелу» естественно для современной русской поэзии.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте אֱלֹהִים обозначает единого Бога и выступает как субъект действия.
- source_word: חֵץ
  choice: стрелу
  rationale: Основное значение слова — «стрела»; по-русски сочетание «пустить стрелу» естественно передаёт образ выстрела.
- source_word: פִּתְאֹום
  choice: внезапно
  rationale: Наречие подчёркивает неожиданность и стремительность Божьего воздаяния.
- source_word: הָיוּ מַכּוֹתָם
  choice: они оказались ранены
  rationale: Буквально выражение близко к «были/явились их раны». Предикативная передача естественна по-русски и сохраняет результат нанесённого удара, не уточняя его сверх сказанного в тексте.
theological_decisions:
- issue: Образ прямого Божьего суда
  choice: Сохранить Бога непосредственным действующим лицом, поражающим нечестивых стрелой.
  alternative: Смягчить образ и представить происходящее лишь как безличную перемену обстоятельств.
  rationale: Еврейский текст прямо называет Бога субъектом ответного выстрела; метафору и активное Божье действие следует сохранить без дополнительного богословского истолкования.
- issue: Временная форма действия
  choice: 'Передать повествовательным прошедшим временем: «пустил».'
  alternative: 'Передать настоящим или будущим временем: «пускает» / «пустит».'
  rationale: Форма wayyiqtol формально продолжает повествовательную последовательность. Хотя в поэзии возможны живое настоящее или пророческое будущее, русский прошедший вид наиболее непосредственно отражает грамматическую форму исходного текста.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим ритмом. Образ стрелы и резкий переход к результату сохранены; тире подчёркивает внезапность воздаяния.
