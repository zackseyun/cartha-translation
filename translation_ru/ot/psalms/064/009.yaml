    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ
  choice: и устрашатся
  rationale: Глагол ירא передаёт и страх перед Божьим судом, и благоговейный трепет. Будущее время естественно продолжает последовательность событий в поэтическом контексте.
- source_word: כָּל אָדָם
  choice: все люди
  rationale: Сочетание буквально означает «весь человек», но אָדָם употреблено собирательно и обозначает людей вообще, а не только мужчин.
- source_word: וַיַּגִּידוּ
  choice: и возвестят
  rationale: Порода hифиль глагола נגד означает «сообщать, объявлять, возвещать»; «возвестят» сохраняет публичный и свидетельский оттенок.
- source_word: פֹּעַל אֱלֹהִים
  choice: о деянии Бога
  rationale: פֹּעַל обозначает дело или деяние. «Деяние Бога» указывает на конкретное Божье действие в контексте, не уточняя его сверх сказанного в тексте.
- source_word: וּמַעֲשֵׂהוּ
  choice: что Он совершил
  rationale: 'Буквально: «и Его дело». Придаточная конструкция естественна по-русски и позволяет избежать тяжёлого повтора слов «деяние» и «дело».'
- source_word: הִשְׂכִּילוּ
  choice: и постигнут
  rationale: Глагол שׂכל в hифиле здесь выражает осмысленное понимание Божьего действия. «Постигнут» сохраняет оттенок обретения разумения, а не простого получения сведений.
theological_decisions:
- issue: Собирательное значение אָדָם
  choice: все люди
  alternative: каждый человек; всё человечество
  rationale: Форма единственного числа имеет здесь обобщённое, собирательное значение. «Все люди» ясно передаёт универсальный охват и не создаёт ошибочного впечатления, будто речь идёт исключительно о мужчинах.
- issue: Характер страха в וַיִּירְאוּ
  choice: устрашатся
  alternative: убоятся; испугаются; проникнутся благоговением
  rationale: Контекст Божьего суда допускает одновременно ужас и благоговейный страх. «Устрашатся» сохраняет эту напряжённость лучше, чем исключительно эмоциональное «испугаются» или однозначно религиозное «проникнутся благоговением».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Синтаксический параллелизм еврейской строки сохранён; архаизмы сведены к минимуму. Местоимение «Он» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
