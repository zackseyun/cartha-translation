source:
  edition: WLC
  text: מֽוֹשִׁיבִ֨י עֲקֶ֬רֶת הַ/בַּ֗יִת אֵֽם הַ/בָּנִ֥ים שְׂמֵחָ֗ה הַֽלְלוּ יָֽהּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/009.yaml
  text: He gives the barren woman a home[a], as a joyful mother of children[b]. Praise Yah!
translation:
  language: ru
  text: Он поселяет бесплодную женщину в доме[a], делая её счастливой матерью детей. Хвалите Ях![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Он даёт бесплодной женщине жить в доме».'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционная передача: «Аллилуйя!»'
    reason: alternative_reading
lexical_decisions:
- source_word: מֽוֹשִׁיבִי
  choice: Он поселяет
  rationale: 'Причастная форма породы хифиль от ישׁב имеет каузативный смысл: «поселяет, даёт жить». В русском поэтическом высказывании естественна личная глагольная форма, продолжающая описание Божьих действий.'
- source_word: עֲקֶרֶת
  choice: бесплодную женщину
  rationale: Слово обозначает женщину, не имеющую детей. «Бесплодная» сохраняет библейскую поэтичность, а добавление «женщину» делает выражение ясным современному читателю.
- source_word: הַבַּיִת
  choice: в доме
  rationale: Сохранён конкретный образ дома; в контексте он также подразумевает устроенную семейную жизнь и принадлежность к домашнему кругу.
- source_word: אֵם הַבָּנִים
  choice: матерью детей
  rationale: בנים может обозначать как сыновей, так и детей вообще. Здесь смысловой акцент сделан на переходе от бездетности к материнству, поэтому нейтральное «детей» предпочтительнее узкого «сыновей».
- source_word: שְׂמֵחָה
  choice: счастливой
  rationale: Прилагательное описывает радость женщины, ставшей матерью. «Счастливой» естественно звучит в современном русском и сохраняет эмоциональный смысл.
- source_word: הַֽלְלוּ יָהּ
  choice: Хвалите Ях!
  rationale: Переданы повелительное значение הלל и краткая форма Божьего имени יָהּ. Это перевод, а не транслитерация всего выражения.
theological_decisions:
- issue: Передача краткой формы Божьего имени יָהּ
  choice: Ях
  alternative: Господа; Аллилуйя
  rationale: В еврейском тексте употреблена краткая форма יָהּ, а не тетраграмматон יהוה. «Ях» сохраняет это различие; «Аллилуйя» является традиционной транслитерацией всего призыва.
- issue: Связь между бесплодием и материнством
  choice: делая её счастливой матерью детей
  alternative: как счастливую мать детей
  rationale: 'Русская деепричастная конструкция ясно передаёт подразумеваемый результат Божьего действия, не вводя отдельного самостоятельного события. Она сохраняет смысловую напряжённость исходного именного построения: бесплодная становится радостной матерью.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим звучанием. Синтаксис сделан ясным без устранения образа дома и резкого перехода от бесплодия к счастливому материнству.
