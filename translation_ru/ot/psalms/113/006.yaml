translation:
  language: ru
  text: кто склоняется, чтобы взирать на небеса и на землю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто смиряет себя, чтобы видеть».'
    reason: Лексическая альтернатива для הַמַּשְׁפִּילִי и более буквальная передача לִרְאוֹת.
lexical_decisions:
- source_word: הַמַּשְׁפִּילִי
  choice: кто склоняется
  rationale: Причастная форма от שׁפל в породе hифиль передаёт образ того, кто делает себя ниже. В связи с предыдущим стихом выражение «склоняется» естественно по-русски сохраняет пространственную метафору Божьего снисхождения, не сводя её к отвлечённому «обращает внимание».
- source_word: לִרְאוֹת
  choice: чтобы взирать
  rationale: 'Инфинитив от ראה обозначает цель: склоняется, чтобы видеть. «Взирать» сохраняет поэтическую возвышенность псалма и значение направленного созерцания.'
- source_word: בַּשָּׁמַיִם
  choice: на небеса
  rationale: Формально множественное שׁמים имеет здесь космический смысл. В сочетании с глаголом «взирать» русский предлог «на» звучит естественно, а «небеса» сохраняет поэтический регистр.
- source_word: וּבָאָרֶץ
  choice: и на землю
  rationale: אָרֶץ образует с небесами всеохватную пару. Повтор предлога «на» обусловлен русским управлением и ясно соединяет оба объекта Божьего взора.
theological_decisions:
- issue: Антропоморфное описание Божьей возвышенности и снисхождения
  choice: 'Сохранён зримый образ: «кто склоняется».'
  alternative: «кто смиряет себя» или отвлечённое «кто обращает внимание»
  rationale: Образ подчёркивает, что перед превознесённым Богом даже небеса находятся внизу. «Склоняется» удерживает напряжение между Его возвышенностью и снисхождением, не приписывая слову прежде всего нравственное самоуничижение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической лексикой. Строчная буква в начале сохраняет синтаксическую связь с предыдущим стихом; форма «кто» естественно передаёт еврейское причастное определение.
