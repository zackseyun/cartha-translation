  text: מְקִֽימִ֣י מֵ/עָפָ֣ר דָּ֑ל מֵֽ֝/אַשְׁפֹּ֗ת יָרִ֥ים אֶבְיֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/007.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap.
translation:
  language: ru
  text: 'Он поднимает бедного из праха,

    из кучи отбросов[a] возвышает нуждающегося.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из кучи золы»; еврейское слово אַשְׁפֹּת обозначает место, куда выбрасывали золу или другие отходы, — образ крайнего унижения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְקִימִי
  choice: поднимает
  rationale: Причастная форма породы hифиль от קום выражает действие, заставляющее униженного встать; «поднимает» естественно передаёт этот смысл и сохраняет параллелизм.
- source_word: מֵעָפָר
  choice: из праха
  rationale: עָפָר означает пыль или рыхлую землю, а מִן указывает исходную точку. «Из праха» сохраняет конкретный поэтический образ крайнего унижения.
- source_word: דָּל
  choice: бедного
  rationale: דָּל может обозначать бедного, слабого или человека низкого общественного положения. «Бедного» ясно и естественно выражает основной смысл, не исключая оттенка беспомощности.
- source_word: מֵאַשְׁפֹּת
  choice: из кучи отбросов
  rationale: אַשְׁפֹּת обозначает место, куда выбрасывают золу или мусор. «Куча отбросов» понятно современному читателю и передаёт образ крайней нищеты и унижения, не сужая значение до навозной кучи.
- source_word: יָרִים
  choice: возвышает
  rationale: Форма hифиль от רום означает поднимать или возвышать. «Возвышает» сохраняет отличие от קום в первой строке и передаёт движение от униженного положения вверх, не поясняя заранее характер последующего возвышения.
- source_word: אֶבְיוֹן
  choice: нуждающегося
  rationale: אֶבְיוֹן обозначает нуждающегося или неимущего. «Нуждающегося» отличает слово от דָּל в первой строке и сохраняет смысловой параллелизм.
theological_decisions:
- issue: Социально-антропологическая образность
  choice: Сохранён конкретный образ перемены участи бедного и нуждающегося.
  alternative: Истолковать стих преимущественно как образ духовного смирения и возвышения.
  rationale: Еврейский текст использует материальные образы праха и свалки, а также обозначения социально уязвимых людей. Перевод не спиритуализирует их и оставляет возможность более широкого богословского применения читателю.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства поэтической речи и параллелизма строк. «Прах» выбран как понятное возвышенно-поэтическое слово; архаичные «убогий» и «гноище» не используются.
