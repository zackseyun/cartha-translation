lexical_decisions:
- source_word: רָם
  choice: Высок
  rationale: Краткое предикативное прилагательное естественно передаёт значение высоты и превознесённости, сохраняя вертикальный образ еврейского текста.
- source_word: עַל כָּל גּוֹיִם
  choice: над всеми народами
  rationale: Предлог «над» выражает как возвышенность, так и превосходство; повторение той же конструкции во второй строке сохраняет параллелизм.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом; форма «Яхве» является общепринятой современной русской транслитерацией реконструируемого произношения.
- source_word: עַל הַשָּׁמַיִם
  choice: над небесами
  rationale: «Небеса» соответствует поэтическому контексту и сохраняет параллель с выражением «над всеми народами».
- source_word: כְּבוֹדוֹ
  choice: слава Его
  rationale: «Слава» передаёт основной смысл כָּבוֹד в контексте поклонения — явленное величие и честь Бога; постпозиция местоимения поддерживает возвышенный поэтический регистр.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом; «Иегова» отражает более позднюю гибридную традицию чтения.
translation_notes:
  register: Современный литературный русский с лаконичным, достойным поэтическим строем. Инверсия «Высок… Яхве» воспроизводит акцент исходной строки, а тире во второй строке естественно обозначает пропущенную связку и сохраняет параллелизм.
