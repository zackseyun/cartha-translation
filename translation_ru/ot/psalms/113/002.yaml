  text: יְהִ֤י שֵׁ֣ם יְהוָ֣ה מְבֹרָ֑ךְ מֵֽ֝/עַתָּ֗ה וְ/עַד עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/002.yaml
  text: May the name of Yahweh be blessed from now and forever[a].
translation:
  language: ru
  text: Да будет имя Яхве благословенно отныне и навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהִי
  choice: Да будет
  rationale: Юссивная форма глагола היה выражает пожелание или призыв; русская конструкция «да будет» естественно передаёт торжественную благословляющую силу.
- source_word: שֵׁם
  choice: имя
  rationale: Сохраняется прямое значение еврейского слова, включающее представление о личности и её славе, без пояснительного расширения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: מְבֹרָךְ
  choice: благословенно
  rationale: Страдательное причастие от ברך буквально обозначает «благословенный»; краткая форма «благословенно» согласуется со словом «имя» и сохраняет формулу благословения.
- source_word: מֵעַתָּה
  choice: отныне
  rationale: Краткое и естественное для возвышенной современной русской речи обозначение времени начиная с настоящего момента.
- source_word: וְעַד עוֹלָם
  choice: и навеки
  rationale: Передаёт продолженность до бесконечного будущего без архаического утяжеления.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога, а не титул; «Яхве» сохраняет это и представляет наиболее принятую научную реконструкцию произношения.
- issue: Модальность יְהִי
  choice: 'пожелание или призыв: «Да будет»'
  alternative: 'утверждение: «будет» или «благословенно имя»'
  rationale: Юссив допускает оттенки пожелания и побуждения. Русское «да будет» сохраняет их, не сводя фразу к простому сообщению.
translation_notes:
  register: Современный литературный русский с торжественным псалмическим звучанием. Синтаксис близок к еврейскому оригиналу, но естественен по-русски; намеренно сохранены «имя» и формула «да будет благословенно».
