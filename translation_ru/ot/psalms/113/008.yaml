lexical_decisions:
- source_word: לְהוֹשִׁיבִי
  choice: чтобы посадить его
  rationale: 'Форма выражает цель или результат действия из предыдущего стиха и сохраняет каузативный смысл: Господь не просто позволяет нуждающемуся сесть, а сажает его на почётное место.'
- source_word: עִם
  choice: рядом со
  rationale: Предлог означает совместное пребывание; «рядом со» естественно передаёт образ человека, удостоенного сидеть вместе со знатными. Повтор предлога сохранён ради поэтического параллелизма.
- source_word: נְדִיבִים / נְדִיבֵי
  choice: знатными
  rationale: В данном контексте נָדִיב обозначает людей высокого общественного положения. «Знатные» передаёт этот смысл, не сужая его до царских сыновей или правителей.
- source_word: עַמּוֹ
  choice: его народа
  rationale: עַם здесь означает народ как общность. Русское местоимение сохраняет возможную неоднозначность еврейского суффикса.
theological_decisions:
- issue: К кому относится местоимение «его» в выражении עַמּוֹ
  choice: В основном тексте сохранено неоднозначное «его народа»; по контексту вероятнее всего имеется в виду народ Господа.
  alternative: 'Местоимение может относиться к возвышенному бедняку: «знатные из его народа».'
  rationale: Грамматика допускает оба отнесения. В контексте псалма действующим лицом остаётся Господь, поэтому Его народ представляется более вероятным, однако перевод не должен устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Повтор «рядом со знатными» сохраняет еврейский параллелизм; формулировка «его народа» намеренно не снимает неоднозначность местоименного суффикса.
