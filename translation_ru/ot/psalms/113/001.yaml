  text: הַ֥לְלוּ יָ֨הּ הַ֭לְלוּ עַבְדֵ֣י יְהוָ֑ה הַֽ֝לְלוּ אֶת שֵׁ֥ם יְהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/113/001.yaml
  text: Praise Yah! Praise[a], servants of Yahweh[b]; praise the name of Yahweh.
translation:
  language: ru
  text: Хвалите Ях[a]! Хвалите, слуги[b] Яхве; хвалите имя Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение буквально означает «Хвалите Ях»; отсюда происходит возглас «аллилуйя». «Ях» — краткая форма имени Яхве.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «рабы». Еврейское слово может обозначать как находящихся на службе, так и находящихся в рабстве; здесь по контексту употреблено слово «слуги».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלְלוּ
  choice: хвалите
  rationale: Форма повелительного наклонения, 2-е лицо множественного числа, порода пиэль от הלל. «Хвалите» ясно передаёт прямой призыв и сохраняет троекратный повтор.
- source_word: יָהּ
  choice: Ях
  rationale: Краткая форма божественного имени передана отдельно от полного יהוה, чтобы сохранить различие, присутствующее в еврейском тексте, и раскрыть буквальный смысл возгласа «аллилуйя».
- source_word: עַבְדֵי
  choice: слуги
  rationale: Сопряжённая форма множественного числа от עבד может означать слуг или рабов. В обращении к участникам богослужения естественное русское «слуги» передаёт служение Яхве, не устраняя более широкий смысл слова, отмеченный в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное божественное имя передано принятой в современной русской библеистике формой «Яхве», а не заменено титулом «Господь»; это также сохраняет различие между полной и краткой формами имени в стихе.
- source_word: אֶת שֵׁם יְהוָה
  choice: имя Яхве
  rationale: Сочетание с показателем прямого дополнения естественно передаётся как «имя Яхве», сохраняя имя как непосредственный объект хвалы.
theological_decisions:
- issue: Различение יָהּ и יְהוָה в одном стихе
  choice: Передать краткую форму как «Ях», а полную — как «Яхве»
  alternative: Передать обе формы словом «Господь» либо обе формой «Яхве»
  rationale: Еврейский стих намеренно употребляет сначала краткую форму имени, а затем дважды тетраграмматон. Раздельная передача сохраняет эту текстовую особенность без догматического истолкования.
- issue: Значение עַבְדֵי в обращении к поклоняющимся
  choice: «слуги» с указанием альтернативы в сноске
  alternative: «рабы»
  rationale: Оба значения лексически возможны. Контекст призыва к богослужению поддерживает естественное «слуги», тогда как сноска сохраняет возможный оттенок принадлежности и подчинения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной псалмовой интонацией. Синтаксический параллелизм и троекратное «хвалите» сохранены; архаизмы не используются.
