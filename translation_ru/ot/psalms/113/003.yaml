  text: From the rising of the sun to its setting[b][a], the name of Yahweh is to be praised.
translation:
  language: ru
  text: От восхода солнца до его заката[a] достойно хвалы имя Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от востока до запада»; буквально: «от восхода солнца до его захода».'
