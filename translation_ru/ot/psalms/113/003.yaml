lexical_decisions:
- source_word: מִמִּזְרַח שֶׁמֶשׁ
  choice: от восхода солнца
  rationale: מִזְרַח может обозначать восток или восход; в сочетании со שֶׁמֶשׁ и в параллели с מְבוֹאוֹ естественнее всего передать образ восхода солнца.
- source_word: מְבוֹאוֹ
  choice: до его заката
  rationale: Буквально — «до его вхождения»; местоименный суффикс относится к солнцу. «Закат» естественно передаёт этот образ по-русски.
- source_word: מְהֻלָּל
  choice: надлежит прославлять
  rationale: Страдательное причастие выражает состояние «прославляемый» и может подразумевать достойность хвалы. Безличная конструкция сохраняет общий нормативный и хвалебный смысл, не превращая строку в прямое повеление.
- source_word: שֵׁם
  choice: имя
  rationale: Буквальный перевод сохраняет библейскую многозначность имени как явленной личности, славы и репутации.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом «Господь».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; «Яхве» сохраняет личное имя Бога и отличает его от титула.
- issue: Смысловая сила מְהֻלָּל
  choice: надлежит прославлять
  alternative: прославляется; достойно хвалы
  rationale: Форма допускает как описание непрестанной хвалы, так и нормативный оттенок достойности хвалы. Выбранная формулировка передаёт подразумеваемый призыв, не оформляя его как отсутствующее в еврейском тексте прямое повеление.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Меризм «от восхода… до заката» сохранён; «надлежит» придаёт строке достоинство без излишней архаизации.
