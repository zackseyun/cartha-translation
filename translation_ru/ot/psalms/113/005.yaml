- source_word: הַמַּגְבִּיהִי לָשָׁבֶת
  choice: восседающему в вышине
  rationale: Оборот буквально описывает Того, кто возвысился, чтобы сидеть. «Восседать» сохраняет образ возвышенного царственного пребывания и звучит естественно в поэтическом контексте.
