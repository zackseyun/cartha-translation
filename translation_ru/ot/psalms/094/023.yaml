base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/023.yaml
  text: He will bring back on them their iniquity[a], and in their evil he will wipe them out[c][b]; Yahweh our God will wipe them out.
translation:
  language: ru
  text: 'Он обратит на них их беззаконие[a]

    и их же злом истребит их[b];

    Яхве, Бог наш, истребит их[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Он обратил на них их злодеяние». В поэтическом контексте еврейскую глагольную форму можно понять как относящуюся к прошлому или будущему, а слово אוֹן — как «беззаконие», «злодеяние» или «зло».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «в их же зле истребит их» или «за их зло истребит их». Еврейский предлог может указывать на сферу, средство либо основание действия.'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте стоит יהוה (YHWH), личное имя Бога; здесь оно передано как «Яхве».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׁב עֲלֵיהֶם
  choice: Он обратит на них
  rationale: Каузативное значение корня שוב передаёт образ возвращения содеянного на самих виновных. Будущее время согласуется с последующими формами יַצְמִיתֵם и с контекстом уверенного провозглашения суда.
- source_word: אֶת אוֹנָם
  choice: их беззаконие
  rationale: אוֹן здесь обозначает нравственное зло, которое возвращается на совершивших его; «беззаконие» сохраняет как нравственный, так и судебный оттенок.
- source_word: וּבְרָעָתָם
  choice: и в их же зле
  rationale: Предлог ב допускает оттенки сферы, основания или орудия. Близкая формулировка не сводит выражение исключительно к одному из них, а частица «же» подчёркивает присущую оригиналу связь их гибели с их собственным злом.
- source_word: יַצְמִיתֵם
  choice: истребит их
  rationale: Глагол צמת в породе hифиль означает уничтожить или истребить. «Истребит» передаёт силу выражения в dignified modern Russian; повтор глагола сохранён.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией «Яхве», а не заменено титулом.
- source_word: אֱלֹהֵינוּ
  choice: Бог наш
  rationale: Форма с суффиксом первого лица множественного числа прямо означает «наш Бог»; постпозиция сохраняет торжественный заключительный ритм строки.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит тетраграмматон, личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Временное значение וַיָּשֶׁב в поэтическом контексте
  choice: 'будущее: «обратит»'
  alternative: 'прошедшее: «обратил»'
  rationale: Хотя форма морфологически допускает повествовательное прошедшее, в поэзии её значение определяется контекстом; следующие два imperfectum יַצְמִיתֵם поддерживают уверенное высказывание о будущем суде.
- issue: Значение предлога ב в וּבְרָעָתָם
  choice: «в их же зле»
  alternative: «их же злом» или «за их зло»
  rationale: Перевод сохраняет напряжение между значениями сферы, средства и основания, не утверждая однозначно, уничтожает ли Бог нечестивых посредством их зла или за него.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим ритмом. Синтаксический параллелизм и дословный повтор «истребит их» сохранены. Формулировка «в их же зле» намеренно удерживает смысловую неоднозначность еврейского предлога.
