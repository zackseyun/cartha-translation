    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַשְׁקִיט לוֹ
  choice: чтобы дать ему покой
  rationale: Инфинитив породы хифиль от שׁקט выражает причинение покоя или невозмутимости; сочетание с לוֹ естественно передаётся по-русски как «дать ему покой».
- source_word: מִימֵי רָע
  choice: от дней бедствия
  rationale: Буквально — «от дней зла»; в контексте רָע обозначает беду или несчастье. «Дни бедствия» сохраняет образность и звучит естественно.
- source_word: עַד
  choice: пока не
  rationale: Вводит временной предел покоя; перед глаголом совершенного результата русское «пока не» естественно передаёт значение «до тех пор, пока».
- source_word: יִכָּרֶה
  choice: не будет вырыта
  rationale: 'Нифаль от כרה здесь наиболее естественно понимать как страдательную форму: яма будет вырыта или приготовлена.'
- source_word: לָרָשָׁע
  choice: для нечестивого
  rationale: Субстантивированное прилагательное в единственном числе обозначает нечестивого человека как тип; русский единственный род сохраняет эту форму.
- source_word: שָׁחַת
  choice: яма
  rationale: Слово обозначает яму, часто с оттенками погибели или могилы. Основной текст сохраняет прямое значение, а дополнительный оттенок отмечен в сноске.
theological_decisions:
- issue: Характер покоя, даруемого страдающему праведнику
  choice: Покой от дней бедствия до наступления суда над нечестивым
  alternative: Внутренний покой среди бедствий либо исключительно эсхатологический покой
  rationale: Синтаксис указывает на временной предел, однако стих сам по себе не уточняет, означает ли покой избавление от внешней беды или внутреннюю невозмутимость; перевод не устраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмодическим звучанием. Сохранены образ «дней бедствия», представительный единственный «нечестивого» и буквальная метафора ямы.
