  text: to give him rest from days of trouble[b][a], until a pit is dug for the wicked.
translation:
  language: ru
  text: чтобы дать ему покой в дни бедствия[a], пока не будет вырыта для нечестивого яма[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в злые дни». Буквально по-еврейски: «от дней зла», то есть дней, отмеченных бедой или несчастьем.'
