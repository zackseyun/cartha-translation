  yaml_path: translation/ot/psalms/094/014.yaml
  text: For Yahweh will not forsake his people[b][a]; he will not abandon his inheritance.
translation:
  language: ru
  text: Ибо Яхве не оставит[a] Свой народ и не покинет Своего наследия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не покинет»; возможно также: «не отвергнет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «удела»; возможно также: «владения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или пояснение к окружающему высказыванию; «ибо» ясно сохраняет эту связь и соответствует dignified современному библейскому регистру.
- source_word: יִטֹּשׁ
  choice: не отвергнет
  rationale: נטשׁ передаёт оставление, отвержение или отказ от кого-либо. «Не отвергнет» естественно звучит применительно к народу и сохраняет вес covenantal контекста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: עַמּוֹ
  choice: Свой народ
  rationale: В контексте отношений Яхве с Израилем עַם означает «народ»; возвратное «Свой» естественно по-русски соотносит его с подлежащим.
- source_word: נַחֲלָתוֹ
  choice: Своего удела
  rationale: נַחֲלָה обозначает наследственный или выделенный удел, владение. «Удел» сохраняет образ народа как принадлежащей Яхве доли и не создаёт столь сильного русского оттенка имущества, полученного после смерти.
- source_word: יַעֲזֹב
  choice: не оставит
  rationale: עזב означает оставить или покинуть. Такой выбор сохраняет смысловой параллелизм с נטשׁ, не стирая различия между двумя глаголами.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Образ נַחֲלָתוֹ как принадлежащего Богу народа
  choice: Своего удела
  alternative: Своего наследия; Своего владения
  rationale: «Удел» передаёт образ выделенной доли или особого владения, сохраняя covenantal метафору без уточнения её сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Параллелизм двух полустиший сохранён; прописное «Свой/Своего» использовано как редакционная норма для местоимений, относящихся к Богу.
