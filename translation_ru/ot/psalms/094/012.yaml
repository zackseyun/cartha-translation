  yaml_path: translation/ot/psalms/094/012.yaml
  text: Blessed is the man whom you discipline[a], O Yah, and teach out of your law[e][d][c][b],
translation:
  language: ru
  text: Блажен[a] человек, которого Ты, Ях[b], исправляешь[d] и учишь из Твоего закона[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Счастлив». Еврейское אַשְׁרֵי говорит о благом, достойном зависти уделе человека, а не только о его переживании счастья.'
    reason: lexical_alternative
  - marker: b
    text: «Ях» — краткая поэтическая форма Божьего имени, отличная по форме от полного имени יהוה.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «из Твоего наставления». Еврейское תּוֹרָה означает «закон», а в более широком смысле — «наставление».'
    reason: lexical_alternative
  - marker: d
    text: Глагол может также означать «вразумляешь» или «наказываешь ради исправления»; он обозначает исправляющее дисциплинарное воздействие.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֵי
  choice: Блажен
  rationale: Сохраняет установленную форму библейского изречения о благом уделе человека; значение шире субъективного ощущения счастья.
- source_word: הַגֶּבֶר
  choice: человек
  rationale: В данном изречении существительное мужского рода в единственном числе обозначает отдельного человека как представителя любого, кто принимает Божье исправление; русское «человек» естественно и не устраняет грамматического единственного числа.
- source_word: תְּיַסְּרֶנּוּ
  choice: которого Ты исправляешь
  rationale: Порода пиэль глагола יסר выражает исправляющее воздействие, вразумление или дисциплинарное наказание. «Исправляешь» передаёт целевую, а не только карательную сторону действия.
- source_word: יָּהּ
  choice: Ях
  rationale: Передаёт краткую поэтическую форму Божьего имени יָהּ и не смешивает её с полным тетраграмматоном יהוה.
- source_word: וּמִתּוֹרָתְךָ
  choice: через Свой закон
  rationale: תּוֹרָה может означать как закон, так и наставление. «Закон» сохраняет узнаваемый псалмический термин, а «через» естественно по-русски выражает источник или средство обучения, обозначенное מִן.
- source_word: תְלַמְּדֶנּוּ
  choice: учишь
  rationale: Прямо передаёт значение пиэля למד и сохраняет параллель между исправлением и обучением.
theological_decisions:
- issue: Передача краткой формы Божьего имени יָּהּ
  choice: Ях
  alternative: Господи
  rationale: В еврейском тексте стоит именно краткая поэтическая форма имени, а не יהוה; транслитерация сохраняет это различие без добавления конфессионального толкования.
- issue: Характер Божьего действия в יסר
  choice: исправляешь
  alternative: наказываешь
  rationale: Глагол допускает строгое дисциплинарное воздействие, но его смысл направлен на исправление и обучение. Выбранный вариант сохраняет эту цель, а более карательный оттенок отмечен в сноске.
- issue: Значение תּוֹרָה
  choice: закон
  alternative: наставление
  rationale: Оба значения лексически возможны. «Закон» сохраняет традиционный и узнаваемый термин, тогда как более широкое «наставление» указано в сноске, чтобы не устранять смысловую широту.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического благословения. Заглавные местоимения при обращении к Богу использованы как издательская норма данного текста. Синтаксис остаётся компактным и сохраняет один относительный оборот для двух согласованных действий.
