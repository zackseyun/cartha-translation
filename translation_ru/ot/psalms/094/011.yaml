lexical_decisions:
- source_word: יְהוָה (YHWH)
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона; прописные буквы отличают Божье личное имя от обычного титула.
- source_word: מַחְשְׁבוֹת (maḥševot)
  choice: помыслы
  rationale: Слово охватывает мысли, замыслы и рассуждения; «помыслы» естественно передаёт этот диапазон в возвышенном, но понятном регистре.
- source_word: אָדָם (ʾadam)
  choice: человека
  rationale: Здесь это обобщённое обозначение человека/человечества, а не личное имя Адам.
- source_word: הֶבֶל (hevel)
  choice: пар
  rationale: Сохраняет конкретный образ чего-то мимолётного, неуловимого и лишённого прочности, не сводя значение к отвлечённой «суете».
theological_decisions:
- issue: Связь придаточного с כִּי
  choice: 'Двоеточие: «они — лишь пар»'
  alternative: «знает, что они — пар» или «потому что они — пар»
  rationale: Двоеточие естественно выражает наиболее вероятное изъяснительное значение и при этом не делает синтаксическую связь более однозначной, чем в еврейском тексте.
translation_notes:
  register: Современный литературный русский с достоинством поэтической строки. Частица «лишь» ясно передаёт оценочную силу образа הֶבֶל, а краткая конструкция сохраняет афористичность оригинала.
