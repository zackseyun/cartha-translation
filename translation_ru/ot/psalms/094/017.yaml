  text: לוּלֵ֣י יְ֭הוָה עֶזְרָ֣תָ/ה לִּ֑/י כִּ/מְעַ֓ט שָֽׁכְנָ֖ה דוּמָ֣ה נַפְשִֽׁ/י׀׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/017.yaml
  text: If Yahweh had not been my help[b][a], my soul would soon have dwelt in silence.
translation:
  language: ru
  text: Если бы Яхве не был моей помощью, ещё немного — и моя душа[a] обитала бы в безмолвии[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «моя жизнь»; еврейское не́феш может обозначать душу, самого человека или его жизнь.
    reason: lexical_alternative
  - marker: b
    text: «Безмолвие», вероятно, означает безмолвие смерти или шеола.
    reason: alternative_reading
lexical_decisions:
- source_word: לוּלֵי
  choice: Если бы ... не
  rationale: Передаёт контрфактическое условие в прошлом естественной русской конструкцией.
- source_word: יְהוָה
  choice: Яхве
  rationale: Сохраняет личное имя Бога, передавая тетраграмматон транслитерацией, а не заменяя его титулом.
- source_word: עֶזְרָתָה לִּי
  choice: не был мне помощью
  rationale: Сохраняет именную форму еврейского выражения и представляет Яхве как помощь псалмопевцу.
- source_word: כִּמְעַט
  choice: ещё немного — и
  rationale: Естественная русская идиома, выражающая близость едва не наступившего исхода; сохраняет оттенок «почти / совсем немного».
- source_word: שָׁכְנָה
  choice: поселилась бы
  rationale: Сохраняет образ пребывания или обитания, выраженный глаголом שׁכן, и согласуется с контрфактическим условием.
- source_word: דוּמָה
  choice: безмолвии
  rationale: Передаёт буквальное значение существительного, не превращая подразумеваемые смерть или шеол в явное утверждение основного текста.
- source_word: נַפְשִׁי
  choice: моя душа
  rationale: Сохраняет еврейский поэтический и антропологический образ; возможное значение «моя жизнь» отмечено в сноске.
theological_decisions:
- issue: Следует ли явно выразить намёк слова דוּמָה на смерть или шеол
  choice: Сохранить в основном тексте буквальное «безмолвие»
  alternative: царство безмолвия; смерть; шеол
  rationale: Контекст, вероятно, подразумевает смерть, однако само еврейское слово означает «безмолвие». Буквальная передача сохраняет образ и богословскую неоднозначность, а вероятный смысл поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Конструкция «ещё немного — и» естественно передаёт близость неслучившегося исхода; слова «душа» и «поселилась» сохраняют образность еврейского текста.
