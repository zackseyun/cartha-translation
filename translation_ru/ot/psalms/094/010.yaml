lexical_decisions:
- source_word: יֹסֵר
  choice: вразумляет
  rationale: Глагол יסר обозначает исправляющее наставление, дисциплинирование или наказание с целью исправления. «Вразумляет» естественно передаёт в современном русском языке и властность, и исправительную направленность действия.
- source_word: גּוֹיִם
  choice: народы
  rationale: В данном поэтическом контексте גּוֹיִם означает народы вообще, а не специально язычников.
- source_word: יוֹכִיחַ
  choice: обличит
  rationale: Форма породы hифиль от יכח выражает обличение или исправляющий укор. «Обличит» сохраняет параллель с исправительным действием в первой части стиха.
- source_word: הַמְלַמֵּד
  choice: Тот, Кто учит
  rationale: Причастие употреблено субстантивированно и описывает Бога через Его действие; такая формулировка сохраняет еврейскую структуру и поэтический параллелизм.
- source_word: אָדָם
  choice: человека
  rationale: Существительное стоит в единственном числе, но имеет обобщающее значение. Русское «человека» сохраняет форму оригинала и при этом естественно обозначает человека как представителя всего человечества.
- source_word: דָּעַת
  choice: знанию
  rationale: דָּעַת прямо означает знание; дательный падеж после «учит» соответствует норме современного литературного русского языка.
- source_word: הֲ...הֲלֹא
  choice: Неужели ... не ...?
  rationale: Сочетание вопросительных частиц образует риторический вопрос, предполагающий утвердительный ответ. «Неужели… не…?» ясно передаёт эту силу по-русски.
theological_decisions:
- issue: Обобщающее употребление אָדָם
  choice: человека
  alternative: человечество; людей
  rationale: Речь идёт обо всём человечестве, однако еврейский текст использует представительное единственное число. Основной текст сохраняет его, а сноска поясняет обобщающий смысл.
- issue: Синтаксис заключительной части стиха
  choice: «Тот, Кто учит человека знанию» как повторное описание субъекта глагола «обличит»
  alternative: 'Понимать последнюю часть как отдельный эллиптический вопрос: «Тот, Кто учит человека знанию, разве Сам не знает?»'
  rationale: В масоретском тексте после причастия «учащий» и его дополнений нет отдельного личного глагола. Выбранная пунктуация не добавляет отсутствующего сказуемого и позволяет описательной фразе усиливать риторический вопрос; сноска сохраняет возможное эллиптическое прочтение.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным поэтическим строем. Заглавные буквы в «Тот, Кто» указывают на Бога в рамках русской издательской традиции, не добавляя имени или титула. Тире сохраняет напряжённый параллелизм и синтаксическую неоднозначность еврейской строки.
