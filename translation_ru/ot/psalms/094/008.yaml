  text: Поймите, вы, неразумные среди народа! Вы, глупцы, когда же вы поумнеете?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּינוּ
  choice: Образумьтесь
  rationale: Повелительная форма призывает не просто получить сведения, а прийти к здравому пониманию; «образумьтесь» естественно передаёт этот обличительный призыв по-русски.
- source_word: בֹּעֲרִים
  choice: неразумные
  rationale: Слово характеризует людей как лишённых разумения, почти уподобляющихся бессловесным животным. «Неразумные» сохраняет резкость, не прибегая к неестественному или чрезмерно бранному выражению.
- source_word: בָּעָם
  choice: среди народа
  rationale: Предлог с определённым существительным естественно передаётся как указание на тех, кто находится среди народа.
- source_word: כְסִילִים
  choice: Глупцы
  rationale: Прямое и контекстуально уместное обозначение людей, упорно лишённых мудрости.
- source_word: מָתַי תַּשְׂכִּילוּ
  choice: когда же вы поумнеете?
  rationale: Глагол может означать обретение разумения или мудрое поведение. В данном риторическом вопросе «поумнеете» естественно передаёт переход к разумности и перекликается с начальным призывом.
