source:
  edition: WLC
  text: אֵל נְקָמ֥וֹת יְהוָ֑ה אֵ֖ל נְקָמ֣וֹת הוֹפִֽיַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/001.yaml
  text: O God of vengeance[a], O Yahweh, God of vengeance[b], shine forth!
translation:
  language: ru
  text: 'Бог возмездия[a], Яхве,

    Бог возмездия, воссияй![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Бог отмщений… Бог отмщений». Множественное число в еврейском тексте, вероятно, усиливает мысль о Божьем воздаянии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «явись»; «покажи Себя». Глагол может обозначать зримое явление Бога; перевод «воссияй» передаёт оттенок явления в сиянии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: Бог
  rationale: В этом прямом обращении אֵל выступает как обозначение Бога; «Бог» естественно и точно передаёт смысл без избыточного добавления «могучий».
- source_word: נְקָמוֹת
  choice: возмездия
  rationale: Форма множественного числа здесь, вероятно, усиливает отвлечённое понятие Божьего справедливого воздаяния. Русское единственное число «возмездия» сохраняет смысл и звучит естественнее, чем буквальное «отмщений».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул «Господь».
- source_word: הוֹפִיעַ
  choice: воссияй
  rationale: Повелительная форма глагола יפע может обозначать явление в сиянии. «Воссияй» сохраняет образ славного, зримого явления Бога; варианты «явись» и «покажи Себя» передают его менее образно.
theological_decisions:
- issue: Передача слов о Божьем возмездии
  choice: Сохранить выражение «Бог возмездия» без смягчения
  alternative: «Бог справедливости» или «Бог, совершающий воздаяние»
  rationale: Еврейский текст прямо связывает Бога с отмщением и воздаянием. Замена словом «справедливость» сгладила бы присущее тексту богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным звучанием. Синтаксический параллелизм и повтор исходного текста сохранены; архаизм «отмщений» вынесен в примечание.
