  text: Они объединяются против жизни праведника[a] и осуждают невинную кровь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «собираются толпой против жизни праведника»; еврейский глагол может обозначать объединение в отряд или совместное нападение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «объявляют невинную кровь виновной»; еврейский глагол имеет судебный смысл: «признать виновным», «осудить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגוֹדּוּ
  choice: сплачиваются
  rationale: Глагол передаёт совместное, согласованное выступление группой; «сплачиваются» естественно выражает враждебное объединение, не вводя излишне конкретного военного образа.
- source_word: עַל
  choice: против
  rationale: При обозначении враждебного совместного действия предлог выражает направленность против кого-либо.
- source_word: נֶפֶשׁ
  choice: жизнь
  rationale: В данном контексте слово обозначает жизнь праведника, которой угрожают; такой перевод сохраняет конкретный смысл и перекликается с образом невинной крови во второй строке.
- source_word: צַדִּיק
  choice: праведника
  rationale: Субстантивированное прилагательное стоит в единственном числе и обозначает праведного человека как типичного представителя; русская форма «праведника» сохраняет это число и не требует добавления слова «человек».
- source_word: דָם נָקִי
  choice: невинную кровь
  rationale: Буквальный и естественный для русского библейского стиля оборот сохраняет яркий образ насилия над невиновным.
- source_word: יַרְשִׁיעוּ
  choice: объявляют виновной
  rationale: 'Порода хифиль от רשע имеет судебный смысл: признать или объявить виновным. Формулировка сохраняет намеренный парадокс: виновной объявляют именно невинную кровь.'
theological_decisions:
- issue: Единственное число צַדִּיק
  choice: праведника
  alternative: праведного человека; праведных
  rationale: Еврейское единственное число может иметь собирательно-представительный смысл. Перевод сохраняет грамматическое единственное число и не ограничивает стих указанием на конкретное лицо.
- issue: Судебный и насильственный образы во второй строке
  choice: невинную кровь объявляют виновной
  alternative: осуждают невинную кровь
  rationale: Более развёрнутая формулировка ясно передаёт судебное значение глагола и сохраняет богословски значимое противоречие между фактической невиновностью жертвы и вынесенным людьми обвинением.
translation_notes:
  register: Современный литературный русский с сохранением поэтического параллелизма и судебной образности. «Сплачиваются» передаёт согласованное враждебное действие без разговорности, а «объявляют виновной» намеренно сохраняет резкий парадокс оригинала.
