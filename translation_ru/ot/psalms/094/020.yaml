  text: Can a throne of destruction be allied with you[b][a], one that forms trouble by statute?
translation:
  language: ru
  text: Может ли быть в союзе с Тобой престол пагубы[a], порождающий зло посредством закона?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «престол злодеяний»; или: «престол разрушения».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «порождающий зло на законе (уставе)»; вероятный смысл — использующий закон или постановление как средство либо предлог для причинения вреда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיְחָבְרְךָ
  choice: может ли быть в союзе с Тобой
  rationale: Вопросительная частица и форма от חבר выражают риторический вопрос о связи или союзе; оборот сохраняет политико-реляционный оттенок.
- source_word: כִּסֵּא
  choice: престол
  rationale: Прямое значение слова и метонимия правящей власти; сохраняется политико-судебный образ.
- source_word: הַוּוֹת
  choice: погибели
  rationale: Множественное существительное может обозначать бедствия, разрушительные деяния или гибель; родительный оборот оставляет некоторую широту значения.
- source_word: יֹצֵר
  choice: творящий
  rationale: Причастие от יצר буквально означает «формирующий, создающий»; «творящий» естественно сочетается с «бедой» и сохраняет активный образ.
- source_word: עָמָל
  choice: беду
  rationale: В контексте неправедной власти слово обозначает причиняемую тяготу, бедствие или угнетение; «беду» сохраняет требуемую смысловую широту.
- source_word: עֲלֵי חֹק
  choice: посредством закона
  rationale: Буквально «на/над законом (уставом)»; контекст допускает инструментальное значение — причинение зла с помощью закона, без внесения в основной текст более толковательного «под видом закона».
theological_decisions:
- issue: Отношение Бога к разрушительной и злоупотребляющей законом власти
  choice: Риторический вопрос подразумевает несовместимость такого престола с Богом, не формулируя вывод отдельно.
  alternative: Можно понимать строку шире как вопрос о том, может ли неправедная судебная власть разделять с Богом суд.
  rationale: Образ престола и вопросительная форма указывают на несовместимость Бога с порочной властью; перевод сохраняет риторическую напряжённость и не добавляет богословского пояснения в сам стих.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. «Престол» сохраняет библейский политико-судебный образ; синтаксис риторического вопроса естественен, а прописное «Тобой» соответствует принятому уважительному обозначению Бога.
