    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Вводит основание надежды, выраженной в контексте; «ибо» сохраняет логическую связь и уместно для возвышенной поэзии.
- source_word: עַד צֶדֶק
  choice: к праведности
  rationale: При глаголе «возвратится» עַד имеет направительное значение. «Праведность» сохраняет смысловое различие между צֶדֶק и מִשְׁפָּט, не исключая оттенка справедливости.
- source_word: יָשׁוּב מִשְׁפָּט
  choice: суд возвратится
  rationale: Прямо передаёт обычное значение שוב «возвращаться» и многозначное מִשְׁפָּט «суд/правосудие».
- source_word: וְאַחֲרָיו
  choice: и за ним последуют
  rationale: Буквально «и за ним»; добавленный по смыслу глагол делает эллиптическую еврейскую конструкцию естественной по-русски. Мужской род местоимения соотносится с «судом».
- source_word: כָּל יִשְׁרֵי לֵב
  choice: все, чьё сердце право
  rationale: Естественно передаёт идиому «все прямые сердцем» как характеристику внутренней нравственной цельности.
theological_decisions:
- issue: Соотношение суда и праведности
  choice: Суд снова придёт в соответствие с праведностью.
  alternative: Суд будет продолжаться, пока не восторжествует праведность; либо «правосудие возвратится к справедливости».
  rationale: Сочетание יָשׁוּב с עַד наиболее естественно выражает возвращение к нравственной норме. Перевод сохраняет различие двух существительных и не развивает утверждение в отдельную доктрину.
- issue: Референт суффикса в וְאַחֲרָיו
  choice: «За ним» относится к ближайшему существительному מִשְׁפָּט — «суд».
  alternative: Суффикс может по смыслу указывать на праведность или на восстановленный праведный порядок в целом.
  rationale: Грамматически ближайший антецедент — существительное мужского рода מִשְׁפָּט; сноска сохраняет реальную смысловую широту контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. «Ибо» и «праведность» сохраняют достоинство регистра, а конструкция «все, чьё сердце право» понятна современному читателю и не звучит архаично.
