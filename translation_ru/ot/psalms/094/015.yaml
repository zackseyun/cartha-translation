  text: For judgment will return to righteousness[b][a], and all the upright in heart will follow after it.
translation:
  language: ru
  text: Ибо суд возвратится к праведности[a], и за ним[b] последуют все, чьё сердце право.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правосудие возвратится к справедливости». Еврейские слова מִשְׁפָּט и צֶדֶק могут соответственно означать «суд / правосудие» и «праведность / справедливость».'
    reason: lexical_alternative
  - marker: b
