  text: 'Яхве, они сокрушают Твой народ[a]

    и угнетают Твоё наследие[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подавляют». Еврейский глагол передаёт образ сокрушительного притеснения.'
