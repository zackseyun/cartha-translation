    reason: lexical_alternative
lexical_decisions:
- source_word: עַמְּךָ
  choice: Твой народ
  rationale: עַם здесь обозначает народ, принадлежащий Богу; «Твой народ» естественно и точно передаёт форму с местоименным суффиксом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом; обращение выражено запятыми.
- source_word: יְדַכְּאוּ
  choice: они сокрушают
  rationale: Пиэль глагола דכא выражает жестокое подавление с образом сокрушения; выбранный глагол сохраняет силу исходной метафоры.
- source_word: וְנַחֲלָתְךָ
  choice: Твоё наследие
  rationale: נַחֲלָה может означать наследие, удел или владение; здесь метонимически относится к народу как принадлежащему Яхве.
- source_word: יְעַנּוּ
  choice: угнетают
  rationale: Пиэль ענה здесь означает причинять страдание, притеснять; «угнетают» передаёт длительное жестокое обращение и не дублирует буквально предшествующий образ сокрушения.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет отличие имени от титула и соответствует наиболее распространённой научной реконструкции произношения.
- issue: Значение נַחֲלָה применительно к народу
  choice: Твоё наследие
  alternative: Твой удел; Твоё владение
  rationale: Формулировка сохраняет образ народа как доставшегося Богу удела, не сводя многозначный термин только к собственности.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим строем. Начальная позиция дополнения «Твой народ» сохраняет смысловой акцент еврейской строки; параллелизм двух полустиший воспроизведён без архаизмов.
