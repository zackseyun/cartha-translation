  text: הִ֭נָּשֵׂא שֹׁפֵ֣ט הָ/אָ֑רֶץ הָשֵׁ֥ב גְּ֝מ֗וּל עַל גֵּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/002.yaml
  text: Rise up[a], Judge of the earth[b]; repay the proud what they deserve.
translation:
  language: ru
  text: Восстань[a], Судья земли; воздай гордым по заслугам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Поднимись» или «Вознесись»; еврейский глагол буквально призывает Бога подняться или возвыситься.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «возврати воздаяние на гордых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּשֵׂא
  choice: Восстань
  rationale: Форма повелительного значения призывает Бога подняться и начать действовать. «Восстань» естественно звучит в возвышенной поэтической речи и передаёт призыв к вмешательству, хотя буквально глагол может означать «поднимись» или «вознесись».
- source_word: שֹׁפֵט
  choice: Судья
  rationale: Причастие употреблено как наименование Бога. «Судья» кратко и точно сохраняет судебный образ.
- source_word: הָאָרֶץ
  choice: земли
  rationale: В обращении к Богу как Судье выражение имеет всеобщий смысл; «земли» здесь уместнее, чем территориально ограниченное «страны».
- source_word: הָשֵׁב
  choice: воздай
  rationale: Каузативный императив שוב в сочетании с גְּמוּל буквально выражает возвращение воздаяния. Русское «воздай» ясно и естественно передаёт действие справедливого возмездия.
- source_word: גְּמוּל
  choice: по заслугам
  rationale: Слово обозначает воздаяние или заслуженную отплату. В сочетании с «воздай» оборот «по заслугам» естественно передаёт смысл без тяжеловесного повтора.
- source_word: עַל
  choice: гордым
  rationale: Предлог обозначает тех, на кого обращено воздаяние; в русском языке это естественно выражается дательным падежом при глаголе «воздай».
- source_word: גֵּאִים
  choice: гордым
  rationale: Речь идёт о людях, надменно превозносящихся над другими. «Гордым» сохраняет привычный библейский оттенок и не добавляет смысла, отсутствующего в исходном тексте.
theological_decisions:
- issue: Характер просьбы о Божьем суде
  choice: Просьба к Богу как Судье всей земли вмешаться и справедливо воздать гордым.
  alternative: Просьба прежде всего явить Божье величие — «вознесись», — а не совершить судебное действие.
  rationale: Два повеления и судебная лексика стиха связывают призыв подняться с действием воздаяния. Перевод сохраняет этот смысл, не развивая его в более широкое богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. «Восстань» и «воздай» уместны для молитвенного обращения, оставаясь понятными современному читателю.
