  text: אִם אָ֭מַרְתִּי מָ֣טָה רַגְלִ֑/י חַסְדְּ/ךָ֥ יְ֝הוָ֗ה יִסְעָדֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/094/018.yaml
  text: When I said, “My foot is slipping,” your steadfast love, O LORD, upheld me.
translation:
  language: ru
  text: 'Когда я сказал: «Нога моя скользит», — Твоя верная любовь, Господи, поддержала меня.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אָמַרְתִּי
  choice: Когда я сказал
  rationale: 'Хотя אִם обычно означает «если», здесь в контексте личного свидетельства оно естественно передаёт временно-обстоятельственный смысл: «когда».'
- source_word: מָטָה רַגְלִי
  choice: Нога моя скользит
  rationale: Глагол מָטָה описывает пошатывание или соскальзывание; настоящее время сохраняет непосредственность возгласа и образ утраты опоры.
- source_word: חַסְדְּךָ
  choice: Твоя верная любовь
  rationale: חֶסֶד обозначает неизменную, верную любовь и милость в отношениях; сочетание «верная любовь» ясно передаёт эту смысловую насыщенность.
- source_word: יְהוָה
  choice: Господи
  rationale: В обращении тетраграмматон передан традиционным русским звательным «Господи», естественным для современного литературного библейского текста.
- source_word: יִסְעָדֵנִי
  choice: поддержала меня
  rationale: סעד означает поддерживать, укреплять и не давать упасть; форма согласована в русском с существительным женского рода «любовь».
theological_decisions:
- issue: Характер Божьего חֶסֶד
  choice: верная любовь
  alternative: милость
  rationale: Выбранный вариант сохраняет как сердечную любовь, так и её постоянство, не сужая значение исключительно до снисхождения или прощения.
- issue: Передача имени יהוה
  choice: Господи
  alternative: Яхве
  rationale: Традиционная передача соответствует русскому употреблению и форме прямого обращения, не добавляя конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией; сохранены образ скользящей ноги, прямая речь и личное обращение к Богу.
