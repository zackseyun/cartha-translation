  yaml_path: translation/ot/psalms/094/009.yaml
  text: He who planted the ear[a], does he not hear? He who formed the eye[b], does he not see?
translation:
  language: ru
  text: Тот, кто насадил ухо[a], разве не слышит? Тот, кто образовал глаз[b], разве не видит?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вложил ухо». Еврейский глагол буквально означает «насадил» и создаёт яркий образ Творца.'
    reason: lexical_alternative
  - marker: b
    text: Еврейский глагол может также означать «смотрит» или «наблюдает»; здесь в параллели со слухом он относится к способности видеть.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטַע
  choice: насадивший
  rationale: Причастие от נטע буквально означает «сажать, насаждать». «Насадивший» сохраняет яркий образ Творца и при этом соответствует возвышенному поэтическому регистру русского текста.
- source_word: אֹזֶן
  choice: ухо
  rationale: Прямое обозначение физического органа слуха; единственное число сохранено в соответствии с еврейским текстом и параллельным словом «глаз».
- source_word: יִשְׁמָע
  choice: услышит
  rationale: Глагол שמע здесь обозначает способность слышать, а не послушание или сосредоточенное слушание. Будущее совершенного вида естественно передаёт еврейскую форму в риторическом вопросе.
- source_word: יֹצֵר
  choice: образовавший
  rationale: Причастие от יצר передаёт намеренное формирование или придание формы. «Образовавший» сохраняет образ созидательной работы и звучит естественно в паре с «глаз».
- source_word: עַיִן
  choice: глаз
  rationale: Основное значение — физический орган зрения; единственное число сохраняет поэтический параллелизм.
- source_word: יַבִּיט
  choice: увидит
  rationale: נבט буквально может означать «смотреть, взирать, наблюдать», но здесь в параллели со слухом речь идёт о зрительном восприятии; «увидит» естественно передаёт смысл, не устраняя буквальную альтернативу, отмеченную в сноске.
- source_word: הֲ...הֲלֹא
  choice: разве не ...?
  rationale: Сочетание вопросительной и отрицательной частиц образует риторический вопрос, предполагающий утвердительный ответ. Русское «разве не» точно и естественно сохраняет эту силу.
- source_word: אִם
  choice: образовавший глаз
  rationale: Здесь אִם вводит второй, параллельный член риторической конструкции, а не обычное условие. В русском связное бессоюзное повторение причастной конструкции передаёт поэтический параллелизм без неестественного «если».
theological_decisions:
- issue: Антропоморфный язык о восприятии Бога
  choice: Сохранить конкретный риторический довод от сотворённых органов слуха и зрения к способности Творца слышать и видеть.
  alternative: 'Передать отвлечённо: «давший слух и зрение неужели сам не воспринимает?»'
  rationale: Еврейский текст намеренно использует образы уха и глаза. Перевод не объясняет, каким образом Бог слышит и видит, и тем самым сохраняет богословскую напряжённость и силу исходного риторического вопроса.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Синтаксический параллелизм, единственное число «ухо — глаз» и оба риторических вопроса сохранены. «Насадивший» намеренно удерживает необычную метафору оригинала, а сноска помогает современному читателю.
