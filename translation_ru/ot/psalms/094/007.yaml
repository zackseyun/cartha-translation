  text: And they say[a], “Yah does not see, and the God of Jacob does not understand.”
translation:
  language: ru
  text: 'И говорят: «Ях не видит, и Бог Иакова не понимает»[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «Ях» — краткая поэтическая форма Божьего имени; ср. более распространённую форму имени завета, обычно передаваемую как «Господь».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И говорят
  rationale: Форма wayyiqtol формально может передавать прошедшее действие («и сказали»), однако в поэтическом описании она представляет характерную, продолжающуюся речь нечестивых. Настоящее время естественно в русском контексте и сохраняет этот смысл.
- source_word: לֹא יִרְאֶה
  choice: не видит
  rationale: Глагол ראה обозначает зрительное восприятие и подразумевает, что Бог якобы не замечает совершаемого зла. Буквальный образ сохранён без замены на более толковательное «не обращает внимания».
- source_word: יָּהּ
  choice: Ях
  rationale: Это краткая поэтическая форма Божьего имени, отличная от полного тетраграмматона יהוה. Передача «Ях» сохраняет её звучание и не смешивает с обычной передачей полного имени как «Господь».
- source_word: וְלֹא יָבִין
  choice: и не понимает
  rationale: בין обычно означает «понимать», «различать», «постигать». Прямой перевод сохраняет утверждение нечестивых о якобы отсутствующем у Бога понимании, не сужая его до одного лишь наблюдения.
- source_word: אֱלֹהֵי יַעֲקֹב
  choice: Бог Иакова
  rationale: Прозрачная и привычная русская передача конструкции сопряжённого состояния, сохраняющая заветный титул Бога Израиля.
theological_decisions:
- issue: Передача краткой поэтической формы Божьего имени יָּהּ
  choice: Ях
  alternative: Господь
  rationale: В исходном тексте стоит יָּהּ, а не полная форма יהוה. Транслитерация сохраняет значимое различие форм и не вводит конфессионально обусловленного толкования.
- issue: Характер отрицания Божьего восприятия
  choice: не видит… не понимает
  alternative: не замечает… не обращает внимания
  rationale: Выбрана формально и семантически прямая передача двух разных еврейских глаголов. Она сохраняет напряжение между зрительным восприятием и пониманием, не сводя оба выражения к одному истолкованию.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим синтаксисом. Инверсия «не видит Ях… не понимает Бог Иакова» сохраняет порядок и параллелизм еврейской строки, оставаясь понятной современному читателю.
