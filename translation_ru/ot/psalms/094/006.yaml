lexical_decisions:
- source_word: אַלְמָנָה
  choice: вдову
  rationale: Единственное число употреблено как обозначение типичного представителя уязвимой группы; русская форма единственного числа сохраняет форму и смысл еврейского текста.
- source_word: גֵר
  choice: живущего среди них чужеземца
  rationale: Слово обозначает не просто прохожего, а человека чужого происхождения, постоянно живущего среди местного населения. Описательный перевод точнее современного многозначного «пришелец».
- source_word: יַהֲרֹגוּ
  choice: убивают
  rationale: Прямой и естественный современный эквивалент общего глагола со значением лишения жизни.
- source_word: יְתוֹמִים
  choice: сирот
  rationale: «Сироты» — естественное русское обозначение этой уязвимой группы; более буквальное значение «лишённые отца» отмечено в сноске.
- source_word: יְרַצֵּחוּ
  choice: умерщвляют
  rationale: Более сильный глагол позволяет передать усиление и преступный характер действия по сравнению с предшествующим общим «убивают», не добавляя отсутствующих в тексте обстоятельств.
