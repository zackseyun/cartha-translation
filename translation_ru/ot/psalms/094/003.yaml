lexical_decisions:
- source_word: עַד מָתַי
  choice: доколе
  rationale: Устойчивый и выразительный вопрос о продолжительности, естественный для поэтической молитвы и передающий настойчивость жалобы.
- source_word: רְשָׁעִים
  choice: нечестивые
  rationale: Субстантивированное прилагательное во множественном числе обозначает людей, поступающих беззаконно; краткое собирательное обозначение соответствует еврейской форме.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: יַעֲלֹזוּ
  choice: будут торжествовать
  rationale: Глагол выражает бурную, приподнятую радость; в контексте нечестивых «торжествовать» также передаёт оттенок самодовольного ликования, не делая его обязательным.
- source_word: עַד מָתַי רְשָׁעִים ... עַד מָתַי רְשָׁעִים
  choice: Доколе нечестивые ... доколе нечестивые
  rationale: Повтор сохранён как важный приём настойчивой поэтической жалобы; запятые удерживают непрерывность параллельной конструкции без добавления отсутствующего в оригинале резкого обрыва.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В стихе употреблено собственное божественное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Характер радости нечестивых
  choice: торжествовать
  alternative: ликовать
  rationale: Перевод передаёт интенсивную радость и допускаемый контекстом оттенок торжества, однако примечание сохраняет более нейтральную лексическую возможность.
translation_notes:
  register: Современный литературный русский с достоинством библейской поэзии. «Доколе» сохраняет молитвенно-поэтический регистр, оставаясь понятным; необычный повтор воспроизводит напряжённость и параллелизм еврейского текста.
