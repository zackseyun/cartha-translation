lexical_decisions:
- source_word: וַיְהִי
  choice: стал
  rationale: Перфективная форма היה обозначает свершившееся событие; «стал» естественно передаёт обретённую псалмопевцем и сохраняющуюся опору, не превращая глагол в простую связку «был».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: לִי
  choice: для меня
  rationale: Предлог ל с суффиксом первого лица выражает личное отношение и пользу; «для меня» точно и естественно передаёт эту функцию.
- source_word: לְמִשְׂגָּב
  choice: твердыней
  rationale: מִשְׂגָּב — высокое, укреплённое и недоступное место безопасности. «Твердыня» сохраняет образ надёжной защиты и соответствует возвышенному, но понятному языку псалма.
- source_word: וֵאלֹהַי
  choice: а мой Бог
  rationale: Существительное с суффиксом первого лица передано как «мой Бог»; союз «а» естественно оформляет русский поэтический параллелизм без смыслового противопоставления.
- source_word: לְצוּר
  choice: скалой
  rationale: צוּר обозначает скалу и метафорически изображает Бога как прочную и надёжную защиту.
- source_word: מַחְסִי
  choice: где я нахожу прибежище
  rationale: Буквально «моего прибежища». Придаточная конструкция по-русски ясно передаёт скалу как место укрытия и избегает неестественного сочетания «скала моего прибежища».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте употреблено личное имя יהוה. «Яхве» передаёт его как имя, не заменяя титулом и не вводя позднюю форму «Иегова».
- issue: Временное значение וַיְהִי
  choice: стал
  alternative: был
  rationale: «Стал» сохраняет пережитый переход к нынешней уверенности псалмопевца; «был» могло бы ослабить событийность формы, хотя грамматически возможно в контексте повествования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмической лексикой. «Твердыня» сохранена как понятный традиционный образ; более буквальное «скала моего прибежища» передано естественной конструкцией «скала, где я нахожу прибежище». Маркер [a] присутствует в основном тексте.
