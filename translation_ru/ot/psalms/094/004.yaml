lexical_decisions:
- source_word: יַבִּיעוּ
  choice: извергают речи
  rationale: Глагол в хифиле передаёт образ обильного, неудержимого излияния; дополнение «речи» подразумевается параллельным יְדַבְּרוּ и делает метафору естественной по-русски.
- source_word: יְדַבְּרוּ
  choice: говорят
  rationale: Нейтральная и точная передача глагола речи, сохраняющая поэтический параллелизм.
- source_word: עָתָק
  choice: надменно
  rationale: Слово обозначает высокомерие или дерзость; наречная передача естественно выражает характер их речи, не сужая смысл до конкретных высказываний.
- source_word: יִתְאַמְּרוּ
  choice: кичатся
  rationale: Возвратная форма выражает самовозвеличивание и хвастливую гордость; «кичатся» кратко и выразительно передаёт этот смысл.
- source_word: כָּל
  choice: все
  rationale: Сохраняет полный, всеохватный смысл еврейского слова.
- source_word: פֹּעֲלֵי אָוֶן
  choice: творящие зло
  rationale: Передаёт деятельный характер оборота «делающие/творящие зло, нечестие» и звучит понятно в современном литературном русском.
