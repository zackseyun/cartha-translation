  yaml_path: translation/ot/psalms/094/016.yaml
  text: Who will rise up for me against evildoers? Who will stand for me against workers of iniquity?[a][b]
translation:
  language: ru
  text: Кто встанет за меня против злодеев? Кто выступит за меня против творящих беззаконие?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское עִם обычно означает «с», но здесь по контексту речь идёт о противостоянии злодеям; поэтому переведено «против».
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי
  choice: кто
  rationale: Вопросительное местоимение открывает оба параллельных риторических вопроса.
- source_word: יָקוּם
  choice: встанет
  rationale: Форма от קום передаёт образ человека, который поднимается, чтобы действовать в защиту говорящего; «встанет за меня» естественно звучит по-русски.
- source_word: לִי
  choice: за меня
  rationale: Предлог ל указывает здесь на действие в пользу говорящего; в сочетании с глаголами противостояния естественный русский эквивалент — «за меня».
- source_word: עִם
  choice: против
  rationale: Буквально предлог обычно означает «с», однако в данном контексте обозначает противостояние злодеям; перевод «против» ясно передаёт контекстуальную силу.
- source_word: מְרֵעִים
  choice: злодеев
  rationale: Причастная форма обозначает людей, делающих зло; «злодеи» кратко и литературно передаёт эту моральную характеристику.
- source_word: יִתְיַצֵּב
  choice: выступит
  rationale: Hitpael от יצב означает занять твёрдую позицию, встать перед кем-либо; «выступит за меня против» передаёт решительное противостояние и избегает механического повтора «встанет».
- source_word: פֹּעֲלֵי אָוֶן
  choice: творящих беззаконие
  rationale: Сочетание буквально описывает тех, кто совершает אָוֶן; причастный оборот сохраняет деятельный характер еврейского выражения.
- source_word: אָוֶן
  choice: беззаконие
  rationale: В данном нравственном контексте слово означает пагубное зло или неправедность; «беззаконие» сохраняет весомость выражения, не сводя его к общему слову «зло».
