source:
  edition: WLC
  text: יֹ֭אמְרוּ גְּאוּלֵ֣י יְהוָ֑ה אֲשֶׁ֥ר גְּ֝אָלָ֗/ם מִ/יַּד צָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/002.yaml
  text: Let the redeemed of Yahweh say so[a], whom he has redeemed from the hand of the foe,
translation:
  language: ru
  text: Пусть скажут искупленные Яхве, которых Он искупил из руки врага[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «притеснителя»; еврейское слово может означать врага, противника или притеснителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹאמְרוּ
  choice: Пусть скажут
  rationale: В данном призывном контексте форма имперфекта имеет волитивный оттенок; русская конструкция с «пусть» передаёт побуждение естественно и точно.
- source_word: גְּאוּלֵי
  choice: искупленные
  rationale: Субстантивированное пассивное образование от גאל обозначает тех, кого избавили или выкупили; «искупленные» сохраняет повтор корня и богословскую насыщенность выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет его отличие от титула «Господь».
- source_word: אֲשֶׁר גְּאָלָם
  choice: которых Он искупил
  rationale: Относительное предложение определяет «искупленных», а перфект указывает на совершённое действие. Повтор «искупленные — искупил» воспроизводит повтор корня גאל.
- source_word: מִיַּד
  choice: из руки
  rationale: Сохранена понятная по-русски древнееврейская метафора избавления из-под чьей-либо власти.
- source_word: צָר
  choice: врага
  rationale: В контексте избавления существительное естественно обозначает противника или притеснителя; «враг» краток и уместен в поэтическом регистре.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблён тетраграмматон как личное имя; транслитерация «Яхве» не заменяет его титулом.
- issue: Смысл корня גאל
  choice: искупленные / искупил
  alternative: выкупленные / выкупил; избавленные / избавил
  rationale: «Искупить» сохраняет как идею действенного избавления, так и повтор одного корня, не сводя образ исключительно к денежному выкупу.
- issue: Референт צָר
  choice: враг
  alternative: притеснитель; противник
  rationale: Слово допускает несколько близких личных обозначений. Основной текст использует общее «враг», а примечание сохраняет возможный оттенок притеснения.
translation_notes:
  register: Современный литературный русский с сохранением краткости и параллельного повтора оригинала. Метафора «из руки» оставлена как ясный библейско-поэтический образ власти; местоимение «Он» добавлено согласно нормам русского синтаксиса, поскольку в еврейском субъект выражен формой глагола.
