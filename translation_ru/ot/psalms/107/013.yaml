lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Тогда они воззвали
  rationale: Глагол זעק обозначает настойчивый крик о помощи; «воззвали» естественно и достойно передаёт обращение к Богу, а «тогда» отражает развитие повествования и повторяющийся рефрен псалма.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: בַּצַּר לָהֶם
  choice: в своей беде
  rationale: Буквально конструкция означает «когда им было тесно/бедственно»; выбранная формулировка сохраняет собирательное единственное число и звучит естественно по-русски.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: от бедствий
  rationale: Существительное во множественном числе обозначает тягостные обстоятельства, стеснение или бедствия; «от бедствий» сохраняет множественность и хорошо сочетается с глаголом «спас».
- source_word: יוֹשִׁיעֵם
  choice: Он спас их
  rationale: Порода хифиль глагола ישׁע выражает спасение или избавление; прошедшее время соответствует повествовательному развитию рефрена.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Временная форма יוֹשִׁיעֵם
  choice: Он спас их
  alternative: Он спасает их
  rationale: Хотя несовершенный вид еврейского глагола допускает контекстуальные оттенки, в данном повествовательном рефрене он описывает последовавшее избавление; русское прошедшее время наиболее ясно передаёт эту связь.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Воззвали» сохраняет силу крика о помощи, не становясь архаичным; синтаксис остаётся ясным и естественным.
