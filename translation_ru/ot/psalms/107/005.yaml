lexical_decisions:
- source_word: רְעֵבִים
  choice: голодные
  rationale: Прямое соответствие прилагательному со значением «испытывающие голод»; более сильное «умирающие от голода» неоправданно усилило бы текст.
- source_word: גַּם
  choice: и
  rationale: В данном сочетании передаёт присоединительное значение («также») естественным для русского языка способом; отдельное «также» сделало бы поэтическую строку тяжеловесной.
- source_word: צְמֵאִים
  choice: жаждущие
  rationale: Точно передаёт состояние испытывающих жажду и стилистически согласуется с «голодные».
- source_word: נַפְשָׁם
  choice: душа их
  rationale: Сохраняет древнееврейский образ внутреннего существа человека и единственное число собирательного выражения, не сводя многозначное נֶפֶשׁ просто к местоимению «они».
- source_word: בָּהֶם
  choice: в них
  rationale: 'Сохраняет выраженную в оригинале внутреннюю локализацию: жизненная сила угасала внутри самих странников.'
- source_word: תִּתְעַטָּף
  choice: изнемогала
  rationale: Передаёт постепенную утрату сил от голода и жажды; в русском контексте это естественнее буквального образа «окутывалась» и точнее, чем обозначение полной потери сознания.
theological_decisions:
- issue: Антропологическая многозначность נֶפֶשׁ
  choice: Сохранить в основном тексте «душа», а иные значения указать в примечании.
  alternative: «жизнь их угасала» или «они сами изнемогали»
  rationale: «Душа» удерживает образность оригинала, но примечание не позволяет ошибочно ограничивать נֶפֶשׁ только нематериальной частью человека.
