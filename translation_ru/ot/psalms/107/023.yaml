    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹרְדֵי
  choice: те, кто выходит
  rationale: Субстантивированное причастие Qal описывает группу людей. Буквальное «сходят» по-русски здесь неестественно; «выходит в море» естественно передаёт отправление в морское плавание, не заменяя выражение словом «моряки».
- source_word: הַיָּם
  choice: в море
  rationale: Существительное с артиклем имеет обычное общее значение «море»; контекст не требует названия конкретного водоёма.
- source_word: בָּאֳנִיּוֹת
  choice: на кораблях
  rationale: Предлог ב с множественным числом «корабли» в современном русском естественно передаётся как «на кораблях».
- source_word: עֹשֵׂי מְלָאכָה
  choice: кто трудится
  rationale: Сочетание причастия עשה с מְלָאכָה обозначает занятие работой или делом. «Трудится» сохраняет широкое значение и не сводит его без достаточных оснований исключительно к торговле.
- source_word: בְּמַיִם רַבִּים
  choice: в великих водах
  rationale: Поэтическое выражение буквально говорит о «многих/великих водах» и обозначает морские просторы. «В великих водах» сохраняет образ и возвышенный поэтический регистр.
