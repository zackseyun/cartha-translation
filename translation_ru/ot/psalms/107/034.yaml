translation:
  language: ru
  text: плодородную землю — в солончак[a] из-за зла её жителей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в засолённую пустошь»; еврейское слово обозначает засолённое место или засоленность и подразумевает бесплодную землю.'
    reason: Лексическая альтернатива и пояснение образа.
lexical_decisions:
- source_word: אֶרֶץ פְּרִי
  choice: плодородную землю
  rationale: Буквально сочетание означает «земля плода»; в данном контексте это естественное обозначение земли, приносящей плоды и урожай.
- source_word: לִמְלֵחָה
  choice: в солончак
  rationale: Предлог ל указывает на результат превращения, а מְלֵחָה обозначает засолённое место или состояние засоленности, подразумевающее бесплодие. «Солончак» сохраняет конкретный образ соли и естественно звучит по-русски.
- source_word: מֵרָעַת
  choice: за зло
  rationale: Предлог מ здесь выражает причину, а רָעָה — нравственное зло. Оборот «за зло» кратко и ясно передаёт причинно-карательную связь в контексте описываемого суда.
- source_word: יֹשְׁבֵי בָהּ
  choice: живущих на ней
  rationale: Причастная форма от ישב обозначает тех, кто живёт или обитает в земле; местоимение женского рода относится к земле.
theological_decisions:
- issue: Причина опустошения земли
  choice: Превращение плодородной земли в солончак представлено как следствие зла её жителей.
  alternative: Понимать перемену лишь как безличное природное или историческое явление.
  rationale: Еврейское מֵרָעַת יֹשְׁבֵי בָהּ прямо сохраняет нравственно-причинную связь; перевод не должен её ослаблять.
translation_notes:
  register: Современный литературный русский язык с краткой поэтической структурой. Тире подчёркивает параллельное превращение, продолжающее мысль предыдущего стиха; «солончак» сохраняет предметный древнееврейский образ без избыточного истолкования.
