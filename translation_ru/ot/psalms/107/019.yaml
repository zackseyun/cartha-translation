lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: Тогда они воззвали
  rationale: Глагол זעק выражает настойчивый крик о помощи; «воззвали» сохраняет силу выражения и соответствует возвышенному, но понятному регистру псалма. Начальное וַ продвигает последовательность событий и передано словом «тогда».
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом; вариант традиционного перевода отмечен в сноске.
- source_word: בַּצַּר לָהֶם
  choice: в своей беде
  rationale: Буквально конструкция означает «в бедствии для них»; естественное русское притяжательное выражение передаёт коллективное единственное число и не утяжеляет фразу.
- source_word: מִמְּצֻקוֹתֵיהֶם
  choice: от тягот
  rationale: Множественное число מְצוּקוֹת обозначает стеснённые, тяжёлые обстоятельства. «Тяготы» сохраняет отличие от предшествующего צַר («беда») и звучит естественно по-русски.
- source_word: יוֹשִׁיעֵם
  choice: Он спас их
  rationale: Каузативная форма ישׁע означает «спасти, избавить». «Спас» кратко и прямо передаёт действие Бога, сохраняя богословский оттенок спасения.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Еврейский текст содержит личное имя Бога. Основной текст сохраняет его как «Яхве», тогда как традиционная замена титулом «Господь» указана в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной псалмической лексикой. Синтаксис краткий и ясный; местоимение «Он» написано с прописной буквы по русской библейской издательской традиции.
