  text: The upright see and rejoice[a], and all injustice shuts its mouth.
translation:
  language: ru
  text: Праведные увидят и возрадуются, и всякая несправедливость закроет свои уста[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «закроет свой рот». В еврейском тексте слово «несправедливость» — женского рода; она олицетворяется как лишённая возможности говорить.'
    reason: Сохранение грамматического и поэтического олицетворения
lexical_decisions:
- source_word: יִרְאוּ
  choice: увидят
  rationale: Форма qal imperfect 3-го лица множественного числа допускает будущее или обобщающее значение. Будущее естественно сочетается со следующим глаголом и передаёт итоговое созерцание Божьих деяний.
- source_word: יְשָׁרִים
  choice: люди честные
  rationale: Субстантивированное прилагательное обозначает нравственно прямых людей. Такое выражение понятно современному читателю и не отождествляет слово без необходимости с более специальным צַדִּיק.
- source_word: וְיִשְׂמָחוּ
  choice: и возрадуются
  rationale: Глагол שמח передаёт деятельную, открытую радость; форма будущего сохраняет параллелизм с «увидят».
- source_word: וְכָל
  choice: и всякая
  rationale: Сохранён простой соединительный союз וְ; контраст не усилен добавлением «а» или «но», отсутствующих в еврейском тексте.
- source_word: עַוְלָה
  choice: неправда
  rationale: Абстрактное существительное обозначает неправедность, несправедливость или зло. «Неправда» сохраняет широкий нравственный смысл и естественно допускает олицетворение.
- source_word: קָפְצָה
  choice: закроет
  rationale: Qal perfect 3-го лица женского рода в поэтическом контексте передан будущим временем, согласованным с развитием всей строки; образ закрытых уст сохранён буквально.
- source_word: פִּיהָ
  choice: уста
  rationale: Слово означает «её рот/уста», причём суффикс женского рода согласован с עַוְלָה. Русское «закроет уста» естественно передаёт идиому молчания и сохраняет олицетворение.
theological_decisions:
- issue: Олицетворение неправды
  choice: Сохранить абстрактную «неправду» как действующее лицо, которое закрывает уста.
  alternative: Передать субъект как «неправедные» или «злодеи».
  rationale: В еврейском тексте субъектом служит абстрактное существительное женского рода עַוְלָה, а не название группы людей. Олицетворение показывает, что зло лишается возможности говорить, не подменяя образ иной формулировкой.
- issue: Временная перспектива глаголов
  choice: 'Передать всю строку будущим временем: «увидят… возрадуются… закроет».'
  alternative: 'Передать как обобщённое настоящее: «видят… радуются… закрывает».'
  rationale: Обе перспективы грамматически возможны в поэзии. Будущее по-русски естественно выражает ожидаемый итог описанных в псалме Божьих избавлений, не устраняя их обобщающего значения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным поэтическим словом «уста». Порядок частей и союз «и» сохраняют лаконизм и параллелизм еврейской строки.
