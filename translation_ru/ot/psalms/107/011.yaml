  text: כִּֽי הִמְר֥וּ אִמְרֵי אֵ֑ל וַ/עֲצַ֖ת עֶלְי֣וֹן נָאָֽצוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/011.yaml
  text: For they rebelled against the words of God and despised the counsel of the Most High[a].
translation:
  language: ru
  text: Ибо они воспротивились словам Бога и презрели совет Всевышнего.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо они восстали против слов Бога и пренебрегли советом Всевышнего».'
    reason: Лексическая альтернатива отражает оттенки открытого неповиновения в הִמְרוּ и презрения в נָאָצוּ.
lexical_decisions:
- source_word: כִּי
  choice: Потому что
  rationale: Союз вводит причину описанного ранее бедственного положения; в русском контексте причинная связь естественно выражается словами «потому что».
- source_word: הִמְרוּ
  choice: восстали против
  rationale: Глагол מרה передаёт непокорность и открытое противление; сочетание «восстали против» сохраняет как волевой, так и relational смысл.
- source_word: אִמְרֵי
  choice: слов
  rationale: Форма множественного числа в сопряжённом состоянии обозначает Божьи речения; «слова» — ясный и естественный русский эквивалент без ненужного сужения смысла.
- source_word: אֵל
  choice: Бога
  rationale: Здесь אֵל выступает как обычное обозначение Бога; перевод сохраняет отличие от параллельного титула «Всевышний».
- source_word: וַעֲצַת
  choice: и совет
  rationale: עֵצָה может означать совет, замысел или намерение. «Совет» сохраняет широту значения и параллель с Божьими словами, не сводя выражение исключительно к предвечному плану или повелению.
- source_word: עֶלְיוֹן
  choice: Всевышнего
  rationale: Устоявшийся и понятный русский эквивалент божественного титула עֶלְיוֹן.
- source_word: נָאָצוּ
  choice: отвергли
  rationale: Глагол נאץ выражает презрительное отвержение. «Отвергли» естественно сочетается с «совет», а оттенок презрения отмечен в сноске.
theological_decisions:
- issue: Передача параллельных божественных обозначений אֵל и עֶלְיוֹן
  choice: Бог … Всевышний
  alternative: Сильный … Высочайший
  rationale: «Бог» и «Всевышний» сохраняют различие двух обозначений, поэтический параллелизм и возвышенный тон, не добавляя специального доктринального оттенка.
- issue: Смысл עֵצָה применительно к Богу
  choice: совет
  alternative: замысел
  rationale: Исходное слово допускает и совет, и замысел. В данном параллелизме со «словами» перевод «совет» наиболее прямо сохраняет наставительный оттенок, не исключая более широкого смысла Божьего намерения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим тоном. Синтаксис краток и следует причинно-параллельной структуре еврейской строки; богословская неоднозначность слова עֵצָה не устраняется.
