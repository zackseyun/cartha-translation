source:
  edition: WLC
  text: כִּי הִ֭שְׂבִּיעַ נֶ֣פֶשׁ שֹׁקֵקָ֑ה וְ/נֶ֥פֶשׁ רְ֝עֵבָה מִלֵּא טֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/009.yaml
  text: For he satisfies the thirsty soul[b][a], and he fills the hungry soul with good things.
translation:
  language: ru
  text: 'Ведь Он насытил жаждущую[b] душу[a]

    и наполнил голодную душу благом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское не́феш может означать также «человек», «сам человек» или «жизнь»; речь может идти обо всём живом существе, а не только о нематериальной части человека.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «томящуюся», «страстно желающую». В данном контексте речь, вероятно, идёт о жажде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит основание для призыва благодарить Господа в ближайшем контексте; «ведь» естественно передаёт пояснительно-причинную связь.
- source_word: הִשְׂבִּיעַ
  choice: насытил
  rationale: Каузативная форма глагола שבע означает «дать насытиться, удовлетворить». Совершенный вид и прошедшее время передают завершённое действие еврейской формы.
- source_word: נֶפֶשׁ
  choice: душу
  rationale: Слово обозначает живое существо, человека или его жизнь и внутреннее существо. «Душа» сохраняет поэтическую выразительность и повтор обоих полустиший, не обязательно подразумевая отдельную нематериальную часть человека.
- source_word: שֹׁקֵקָה
  choice: жаждущую
  rationale: В контексте странников, терпевших голод и жажду, слово естественно описывает мучимую жаждой душу; при этом возможен более общий смысл сильного томления или желания, отмеченный в сноске.
- source_word: רְעֵבָה
  choice: голодную
  rationale: Прямое соответствие прилагательному со значением голода; образует поэтическую параллель к «жаждущую».
- source_word: מִלֵּא
  choice: наполнил
  rationale: Глагол מלא в интенсивной породе означает «наполнить». Прошедшее время сохраняет согласование с первым завершённым действием.
- source_word: טוֹב
  choice: благом
  rationale: Субстантивированное «добро, благо» здесь обозначает то хорошее, чем Бог наполняет нуждающегося. Единственное собирательное «благом» близко к форме оригинала и естественно в возвышенной русской поэзии.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ
  choice: В обоих полустишиях переведено как «душа»
  alternative: «человек», «жизнь», «сам человек»
  rationale: Так сохраняются повтор и поэтическая глубина оригинала. Сноска предупреждает, что еврейское слово может обозначать всего живого человека и само по себе не утверждает антропологического дуализма.
- issue: Конкретный или общий смысл שֹׁקֵקָה
  choice: «жаждущую»
  alternative: «томящуюся», «сильно желающую»
  rationale: Контекст Псалма 107:4–5 прямо упоминает жажду, поэтому конкретное прочтение уместно; более широкая лексическая возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной поэтической окраской. Сохранены параллелизм, двукратное «душу» и завершённый характер обоих действий; порядок слов слегка нормализован ради ясности.
