base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/031.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: ru
  text: Пусть благодарят Яхве за Его неизменную любовь и за Его дивные дела для сынов человеческих[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть людям, всему человечеству; буквально: «сынам человеческим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Пусть благодарят
  rationale: Форма Hiphil imperfect в повторяющемся рефрене псалма выражает призыв или пожелание; эта русская конструкция естественно передаёт побудительный оттенок.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата благодарности, а тетраграмматон передан транслитерацией личного Божьего имени.
- source_word: חַסְדּוֹ
  choice: Его неизменную любовь
  rationale: חֶסֶד обозначает верную, стойкую любовь и милость; «неизменная любовь» ясно и современно передаёт устойчивость этого отношения, не сужая значение только до милосердия.
- source_word: וְנִפְלְאוֹתָיו
  choice: и за Его дивные дела
  rationale: נִפְלָאוֹת — необычайные деяния, вызывающие изумление. Повтор предлога «за» необходим для естественного русского синтаксиса.
- source_word: לִבְנֵי אָדָם
  choice: для сынов человеческих
  rationale: Выражение буквально означает «сынам человека» и имеет собирательное значение — людям. «Для» естественно указывает, ради кого или на чьё благо совершены эти дела; формальный образ сохранён, а его смысл пояснён в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное Божье имя; транслитерация сохраняет отличие имени от титула, при этом вариант «Господь» широко принят в русской библейской традиции.
- issue: Передача בְּנֵי אָדָם
  choice: сыны человеческие
  alternative: люди / человечество
  rationale: Основной текст сохраняет образное и грамматически мужское древнееврейское выражение с собирательным значением, не ограничивая его только мужчинами; смысл раскрыт в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. «Дивные дела» и «сыны человеческие» сохраняют поэтический регистр, оставаясь понятными благодаря краткой сноске.
