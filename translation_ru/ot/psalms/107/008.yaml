  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/008.yaml
  text: Let them give thanks to Yahweh for his steadfast love[a], and for his wondrous deeds to the children of man.
translation:
  language: ru
  text: Пусть благодарят Яхве за Его неизменную любовь и за Его чудесные дела для людей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для сынов человеческих» — обычное еврейское обозначение людей вообще.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Пусть благодарят
  rationale: Побудительная форма естественно передаёт еврейский юссивный оттенок; в повторяющемся рефрене псалма ידה означает благодарить и прославлять за совершённое Богом.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога יהוה, употреблённое в еврейском тексте, а предлог ל — адресата благодарности.
- source_word: חַסְדּוֹ
  choice: за Его неизменную любовь
  rationale: חֶסֶד обозначает верную, постоянную любовь и милость; «неизменная любовь» сохраняет идею надёжности, не сужая значение исключительно до заветной терминологии.
- source_word: וְנִפְלְאוֹתָיו
  choice: и за чудеса, которые Он совершает
  rationale: נִפְלָאוֹת — необыкновенные, чудесные деяния. Развёрнутая русская формулировка ясно передаёт деятельный смысл и естественно связывает их с адресатами.
- source_word: לִבְנֵי אָדָם
  choice: для людей[a]
  rationale: Устойчивое еврейское выражение буквально означает «для сынов человеческих», но по смыслу охватывает людей вообще; основной текст передаёт это естественным современным русским языком, а образность оригинала отмечена в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Передача выражения בְּנֵי אָדָם
  choice: людей
  alternative: сынов человеческих
  rationale: В данном контексте выражение обозначает человечество в целом. «Людей» точно и понятно передаёт его референцию, тогда как буквальная форма сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным псалмопевческим оттенком. Синтаксис сделан естественным для русского читателя, при этом имя Бога и смысл ключевых еврейских слов сохранены.
