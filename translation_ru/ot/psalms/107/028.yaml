  text: וַ/יִּצְעֲק֣וּ אֶל יְ֭הוָה בַּ/צַּ֣ר לָ/הֶ֑ם וּֽ֝/מִ/מְּצֽוּקֹתֵי/הֶ֗ם יוֹצִיאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/028.yaml
  text: Then they cried out to Yahweh in their trouble[a], and he brought them out of their distresses.
translation:
  language: ru
  text: Тогда они воззвали к Яхве в своей беде, и Он вывел их из их бедствий.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Тогда они воззвали
  rationale: Форма с последовательным וַ־ продвигает повествование; «тогда» передаёт повторяющуюся последовательность псалма, а «воззвали» выражает настойчивую просьбу о помощи.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל обозначает направленность обращения, а личное имя יהוה передано принятой русской транслитерацией «Яхве», без замены титулом.
- source_word: בַּצַּר לָהֶם
  choice: в своей беде
  rationale: Оборот буквально описывает бедственное положение, в котором они находились; возвратное «своей» естественно связывает беду с подлежащим во множественном числе.
- source_word: וּמִמְּצוּקוֹתֵיהֶם
  choice: из теснин
  rationale: Существительное מְצוּקוֹת обозначает тесные, стеснённые обстоятельства и бедствия. «Теснины» сохраняют множественное число и конкретный пространственный образ исходного текста.
- source_word: יוֹצִיאֵם
  choice: Он вывел их
  rationale: Каузативная форма от יצא означает «вывести, заставить выйти»; перевод сохраняет конкретный образ выхода, не сводя его к более отвлечённому «избавил».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому оно передано транслитерацией, а не заменено титулом.
- issue: Характер избавления в יוֹצִיאֵם
  choice: Он вывел их
  alternative: Он избавил их
  rationale: «Вывел» сохраняет образное и буквальное значение глагола, не добавляя богословского истолкования, хотя по смыслу речь идёт об избавлении.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. «Воззвали» и «теснины» сохраняют достоинство и образность оригинала, оставаясь понятными из контекста.
