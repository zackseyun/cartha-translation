lexical_decisions:
- source_word: יַעֲלוּ
  choice: поднимаются
  rationale: Форма глагола עלה обозначает движение вверх. Настоящее время естественно передаёт живую поэтическую картину в русском повествовании.
- source_word: שָׁמַיִם
  choice: до небес
  rationale: Поэтическое «небеса» сохраняет возвышенный образ; предлог «до» естественно выражает предельную высоту движения.
- source_word: יֵרְדוּ
  choice: опускаются
  rationale: Глагол ירד прямо противопоставлен подъёму; «опускаются» сохраняет параллелизм и не добавляет значения погружения или гибели.
- source_word: תְהוֹמוֹת
  choice: в бездны
  rationale: Множественное число תְּהוֹמוֹת обозначает морские глубины. «Бездны» сохраняет множественность и поэтическую силу образа.
- source_word: נַפְשָׁם
  choice: душа их
  rationale: נֶפֶשׁ может означать душу, жизнь или самого человека. «Душа их» сохраняет образ внутреннего существа и намеренно не устраняет лексическую многозначность.
- source_word: בְּרָעָה
  choice: от бедствия
  rationale: В контексте бури רָעָה означает беду или гибельное бедствие, а не нравственное зло. Русское «от» естественно передаёт причину внутреннего изнеможения.
- source_word: תִּתְמוֹגָג
  choice: тает
  rationale: Форма от מוג передаёт образ растворения, таяния и утраты внутренней стойкости. «Тает» кратко и непосредственно сохраняет метафору.
