  text: וַ/יִּמְעֲט֥וּ וַ/יָּשֹׁ֑חוּ מֵ/עֹ֖צֶר רָעָ֣ה וְ/יָגֽוֹן׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/039.yaml
  text: Then they were diminished and brought low through oppression[a], calamity, and sorrow.
translation:
  language: ru
  text: Их стало мало, и они поникли от притеснения, беды и горя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Их стало меньше, и они были унижены из-за притеснения, беды и горя».'
    reason: Глагол «стало мало» может означать уменьшение числа или упадок; глагол «поникли» допускает оттенок согнутости, подавленности либо унижения. Слово עֹצֶר также может означать стеснение или гнёт.
lexical_decisions:
- source_word: וַיִּמְעֲטוּ
  choice: стали они малочисленны
  rationale: Глагол מעט в породе qal обозначает уменьшение, прежде всего сокращение числа; такой перевод сохраняет смысл «стали немногими», не сводя его к неопределённому унижению положения.
- source_word: וַיָּשֹׁחוּ
  choice: согнулись
  rationale: Глагол שחח передаёт состояние согнутости, подавленности или униженности. «Согнулись» сохраняет поэтический образ и допускает как телесное, так и переносное понимание.
- source_word: מֵעֹצֶר
  choice: под гнётом
  rationale: עֹצֶר может означать стеснение, удержание или угнетение; конструкция с מִן здесь выражает причину. «Под гнётом» естественно передаёт сдавливающую, угнетающую силу обстоятельств.
- source_word: רָעָה
  choice: бедствия
  rationale: В данном контексте רָעָה обозначает несчастье или беду, а не обязательно нравственное зло.
- source_word: וְיָגוֹן
  choice: и скорби
  rationale: יָגוֹן означает скорбь, печаль или горе; «скорбь» соответствует возвышенному поэтическому регистру псалма.
