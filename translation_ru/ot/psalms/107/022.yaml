lexical_decisions:
- source_word: וְיִזְבְּחוּ
  choice: Пусть они приносят
  rationale: Форма глагола в данном контексте выражает побуждение. «Приносят» естественно сочетается с жертвами и сохраняет культовый смысл.
- source_word: זִבְחֵי תוֹדָה
  choice: жертвы благодарения
  rationale: Сочетание обозначает жертвы, приносимые в благодарность; этот вариант близок к еврейской конструкции и понятен современному читателю.
- source_word: תוֹדָה
  choice: благодарения
  rationale: В жертвенном контексте слово указывает именно на благодарение или благодарственную жертву, а не просто на хвалу.
- source_word: וִיסַפְּרוּ
  choice: и … рассказывают
  rationale: Порода пиэль глагола ספר передаёт смысл подробного повествования или провозглашения; «рассказывают» звучит естественно и ясно.
- source_word: מַעֲשָׂיו
  choice: о Его делах
  rationale: Слово обозначает дела или деяния Бога. «Дела» сохраняет широкий смысл и традиционно уместно в поэтической речи.
- source_word: בְּרִנָּה
  choice: с радостным пением
  rationale: רִנָּה может обозначать ликование, радостный возглас или пение. Выбранный вариант передаёт радость и вероятную песенную форму хвалы, не устраняя альтернативу.
