  text: and gathered them from the lands[a], from the east and from the west[b], from the north and from the sea.
translation:
  language: ru
  text: и собрал их из разных земель — с востока и с запада, с севера и от моря.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и с юга». Буквально: «и от моря». Слово «море» иногда служит обозначением направления, обычно западного, однако запад в этом стихе уже назван отдельно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאֲרָצוֹת
  choice: из разных земель
  rationale: Форма множественного числа אֲרָצוֹת обозначает земли или области, откуда были собраны избавленные. Слово «разных» естественно передаёт множественность мест, не придавая им современного политического смысла слова «страны».
- source_word: קִבְּצָם
  choice: собрал их
  rationale: Глагол קבץ означает «собирать» и здесь соответствует теме возвращения рассеянных.
- source_word: מִמִּזְרָח
  choice: с востока
  rationale: מִזְרָח обозначает восток; обычное русское наименование стороны света сохраняет ясность и параллелизм.
- source_word: וּמִמַּעֲרָב
  choice: и с запада
  rationale: מַעֲרָב обозначает запад; перевод сохраняет симметрию перечисления.
- source_word: מִצָּפוֹן
  choice: с севера
  rationale: צָפוֹן здесь является наименованием стороны света — севера.
- source_word: וּמִיָּם
  choice: и от моря
  rationale: Основное значение יָם — «море». Хотя слово может употребляться как обозначение западного направления, запад уже прямо назван словом מַעֲרָב, поэтому буквальное значение сохранено в основном тексте.
