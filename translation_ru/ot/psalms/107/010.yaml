lexical_decisions:
- source_word: יֹשְׁבֵי
  choice: Одни сидели
  rationale: Причастие обозначает людей, находящихся или пребывающих в таком состоянии. В контексте череды спасённых Богом групп естественная русская личная конструкция «Одни сидели» передаёт эту функцию.
- source_word: חֹשֶׁךְ
  choice: во тьме
  rationale: Прямое и поэтически естественное соответствие слову со значением буквальной или переносной темноты.
- source_word: צַלְמָוֶת
  choice: в глубоком мраке
  rationale: Слово, вероятно, обозначает непроглядную тьму или глубокий мрак; такой перевод сохраняет образ, не вводя смерть как однозначный компонент.
- source_word: אֲסִירֵי
  choice: узники
  rationale: Форма обозначает связанных или заключённых людей; «узники» естественно сочетается с образом оков и сохраняет поэтический регистр.
- source_word: עֳנִי
  choice: страдания
  rationale: Существительное может обозначать бедствие, угнетение, страдание или нищету. Здесь общее «страдание» лучше всего соответствует контексту заключения, не сужая смысл до материальной бедности.
- source_word: בַרְזֶל
  choice: железных оков
  rationale: Буквально «железо», но в данном контексте это метонимическое обозначение железных пут. «Железные оковы» ясно и естественно передают тюремный образ.
theological_decisions:
- issue: Возможное упоминание смерти в צַלְמָוֶת
  choice: Основной текст передаёт слово как «глубокий мрак».
  alternative: «тень смерти»
  rationale: Этимология и значение слова обсуждаются; современное понимание часто видит в нём обозначение глубокой тьмы, тогда как традиционный перевод явно вводит образ смерти. Неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным поэтическим строем. Конструкция «узники страдания и железных оков» сохраняет тесный параллелизм и образность еврейской строки, оставаясь понятной современному читателю.
