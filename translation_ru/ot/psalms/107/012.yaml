    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: он смирил
  rationale: Каузативная порода глагола כנע передаёт действие, которым подразумеваемый субъект приводит людей к смирению или унижению. По контексту субъект — Бог; местоимение сохраняет связность с предыдущими стихами, не добавляя имени, отсутствующего в еврейском тексте.
- source_word: בֶּעָמָל
  choice: тяжким трудом
  rationale: עָמָל может обозначать изнурительный труд, тяготу или страдание. «Тяжким трудом» естественно звучит по-русски и сохраняет конкретный образ тяжёлого бремени, не устраняя более широкого значения слова; варианты отражены в сноске.
- source_word: לִבָּם
  choice: их сердце
  rationale: 'Сохранено единственное число еврейского собирательного выражения: речь идёт о внутреннем состоянии и мужестве всей группы. В русском это несколько отмеченная, но понятная библейско-поэтическая конструкция.'
- source_word: כָּשְׁלוּ
  choice: они споткнулись
  rationale: Глагол כשל прежде всего передаёт образ спотыкания, шатания или утраты опоры и может подразумевать падение. Выбор не усиливает образ до несомненного падения.
- source_word: וְאֵין עֹזֵר
  choice: и некому было помочь
  rationale: Безличная русская конструкция естественно передаёт отсутствие всякого помощника, выраженное сочетанием אֵין с причастием.
theological_decisions:
- issue: Подразумеваемый субъект וַיַּכְנַע
  choice: '«он смирил»: субъектом по контексту является Бог'
  alternative: «их сердце было смирено» — безличная или пассивная передача
  rationale: В окружающем контексте бедствие и последующее избавление представлены как действия Господа. Активная форма с местоимением сохраняет это богословское утверждение, но не вставляет в стих отсутствующее в нём имя Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Инверсия «Тяжким трудом он смирил…» позволяет расположить пояснительные маркеры последовательно и сохраняет естественный ритм стиха. Местоимение «он» написано со строчной буквы согласно нейтральной современной издательской норме, без конфессиональной капитализации.
