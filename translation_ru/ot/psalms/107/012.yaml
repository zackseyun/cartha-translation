  text: Тяжким трудом[a] он смирил их сердца[b]; они споткнулись[c], и некому было помочь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тяготой», «страданием»; еврейское עָמָל может означать тяжкий труд, тяготу или бедствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их сердце»; единственное число в еврейском тексте употреблено собирательно.'
