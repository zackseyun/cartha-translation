  text: Они засеяли поля, посадили виноградники и получили урожай.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и произвели плод урожая (урожайной продукции)».'
    reason: Передаёт необычное еврейское сочетание פְּרִי תְבוּאָה и объясняет, почему в основном тексте употреблено естественное русское «получили урожай».
lexical_decisions:
- source_word: וַיִּזְרְעוּ שָׂדוֹת
  choice: засеяли поля
  rationale: Глагол זרע означает сеять; сочетание «засеяли поля» естественно для современного русского языка и точно передаёт сельскохозяйственное действие.
- source_word: וַיִּטְּעוּ כְרָמִים
  choice: насадили виноградники
  rationale: נטע обозначает посадку растений, а כֶּרֶם — виноградник. «Насадили виноградники» сохраняет конкретность и возвышенно-литературный оттенок псалма.
- source_word: וַיַּעֲשׂוּ פְּרִי תְבוּאָה
  choice: собрали урожай
  rationale: Буквальное сочетание «произвели плод урожая/произведения земли» по-русски неестественно. В данном земледельческом контексте оборот означает получение урожая; «собрали урожай» ясно передаёт результат, хотя конкретизирует подразумеваемое действие.
