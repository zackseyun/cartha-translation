source:
  edition: WLC
  text: וַ/יּ֣וֹשֶׁב שָׁ֣ם רְעֵבִ֑ים וַ֝/יְכוֹנְנ֗וּ עִ֣יר מוֹשָֽׁב׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/036.yaml
  text: There he settled the hungry[a], and they established a city to live in.
translation:
  language: ru
  text: Там он поселил голодных, и они основали город, чтобы жить в нём.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «город для жительства».'
    reason: Лексическая альтернатива для עִיר מוֹשָׁב, допускающего более формальную именную конструкцию.
lexical_decisions:
- source_word: וַיּוֹשֶׁב
  choice: он поселил
  rationale: Порода хифиль глагола ישׁב выражает побуждение или содействие к поселению. «Поселил» естественно передаёт каузативный смысл; подлежащее «он» сохраняет не названную прямо отсылку к Богу из контекста псалма.
- source_word: שָׁם
  choice: там
  rationale: Прямой и естественный русский эквивалент наречия места.
- source_word: רְעֵבִים
  choice: голодных
  rationale: Прилагательное употреблено субстантивированно и обозначает группу людей, испытывающих голод.
- source_word: וַיְכוֹנְנוּ
  choice: они основали
  rationale: В данной породе כון может означать «устраивать», «утверждать», «основывать». В сочетании с городом «основали» естественно обозначает создание устойчивого поселения.
- source_word: עִיר
  choice: город
  rationale: Основное значение слова — «город»; более общее «поселение» было бы менее точным.
- source_word: מוֹשָׁב
  choice: чтобы жить в нём
  rationale: Существительное обозначает проживание, обитание или место жительства. Целевая конструкция естественно передаёт смысл сочетания עִיר מוֹשָׁב в современном русском языке.
theological_decisions:
- issue: Неявное подлежащее единственного числа при וַיּוֹשֶׁב
  choice: Местоимение «он» относится к Богу, действующему в окружающем контексте.
  alternative: Безличное или неопределённо-личное «там поселили».
  rationale: Контекст псалма продолжает повествование о деяниях Господа. При этом имя Бога не добавлено в текст стиха, а сохранена местоименная форма оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Местоимение «он» написано со строчной буквы, поскольку оригинал не вводит здесь отдельного божественного титула. Формулировка избегает архаичного «обитать», сохраняя смысл и синтаксическую ясность.
