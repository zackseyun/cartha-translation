  source_fidelity: '«Там он поселил голодных» точно передаёт וַיּוֹשֶׁב שָׁם רְעֵבִים: каузативный оттенок хифиля сохранён, а местоимение «он» уместно продолжает подразумеваемого в контексте Бога. «И они основали город, чтобы жить в нём» адекватно передаёт множественное וַיְכוֹנְנוּ и сочетание עִיר מוֹשָׁב. «Основали» — допустимое контекстуальное выражение для «устроили/утвердили» город.'
  naturalness: Текст звучит естественно на современном литературном русском, остаётся ясным и имеет подходящий для псалма сдержанно возвышенный регистр. Связка «чтобы жить в нём» хорошо выражает назначение города без ненужной архаизации.
  terminology: «Голодные», «поселил» и «город» точны и не вносят интерпретационных оттенков. Сноска корректно даёт более формальный вариант передачи עִיר מוֹשָׁב и надлежащим образом привязана к соответствующей фразе.
