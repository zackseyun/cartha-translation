  text: He pours contempt on nobles and makes them wander in a trackless waste[a][b].
translation:
  language: ru
  text: Он изливает презрение на знатных[a] и заставляет их блуждать в пустынной местности, где нет пути[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «князей», «вельмож». Еврейское слово может обозначать знатных и влиятельных людей или правителей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в пустоте, [где] нет пути»; то есть в пустынном, бездорожном месте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: изливает
  rationale: Причастие передаёт характерное действие в настоящем времени; «изливает презрение» сохраняет яркую метафору еврейского текста и естественно звучит по-русски.
- source_word: בּוּז
  choice: презрение
  rationale: Слово обозначает презрение, пренебрежение или посрамление; «презрение» точно сочетается с глаголом «изливает» и передаёт публичное унижение.
- source_word: נְדִיבִים
  choice: знатных
  rationale: В данном контексте речь идёт о людях высокого положения — вельможах, князьях или влиятельных правителях. Субстантивированное «знатных» естественно и не сужает значение до наследных князей.
- source_word: וַיַּתְעֵם
  choice: заставляет их блуждать
  rationale: Каузативная форма תעה означает «заставлять блуждать» или «водить без пути»; выбранный вариант сохраняет образ физического скитания и явную причинность.
- source_word: בְּתֹהוּ
  choice: в безлюдье
  rationale: תֹהוּ может обозначать пустоту, пустынное пространство или хаос. Здесь сочетание с отсутствием дороги указывает на безлюдную, необустроенную местность; «безлюдье» передаёт этот поэтический образ без чрезмерной конкретизации.
- source_word: לֹא דָרֶךְ
  choice: где нет дороги
  rationale: Сохранена близкая к буквальной синтаксическая формулировка «нет дороги/пути», чтобы не скрывать рубленую поэтическую выразительность оригинала.
theological_decisions:
- issue: Неявно названный субъект действия
  choice: Местоимение «Он» относится к Богу.
  alternative: Безличный или неопределённый деятель.
  rationale: В непосредственном контексте псалма именно Господь совершает описанные перевороты. Русское предложение требует явного подлежащего; «Он» восстанавливает подразумеваемого участника, не добавляя нового богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранены метафора «изливает презрение», настоящее время обобщающего описания и образ блуждания в лишённом пути пространстве; архаизмы и конфессионально окрашенные формулы не использованы.
