  text: יָשֵׂ֣ם מִ֭דְבָּר לַֽ/אֲגַם מַ֑יִם וְ/אֶ֥רֶץ צִ֝יָּ֗ה לְ/מֹצָ֥אֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/035.yaml
  text: He turns a wilderness into a pool of water[c][b][a], and dry land into springs of water.
translation:
  language: ru
  text: 'Он превращает пустыню в водоём[a],

    а иссохшую землю — в родники.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пруд»; еврейское слово может обозначать пруд, заводь или болотистый водоём.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: превращает
  rationale: Глагол שׂים буквально означает «помещать, делать»; в данном поэтическом противопоставлении естественно передаёт изменение одного состояния в другое.
- source_word: מִדְבָּר
  choice: пустыню
  rationale: מִדְבָּר обозначает пустынную, необитаемую местность; «пустыня» ясно и естественно сохраняет образ стиха.
- source_word: לַאֲגַם מַיִם
  choice: в водоём
  rationale: אֲגַם может обозначать пруд, заводь или болотистый водоём. «Водоём» передаёт образ стоячей воды и не сужает значение неоправданно.
- source_word: וְאֶרֶץ צִיָּה
  choice: а иссохшую землю
  rationale: צִיָּה описывает сухую, иссушенную местность; «иссохшая земля» выразительно сохраняет контраст с появлением воды.
- source_word: לְמֹצָאֵי מָיִם
  choice: в родники
  rationale: מֹצָאֵי מָיִם буквально указывает на места выхода или источники воды; «родники» естественно передаёт текущую из земли воду во множественном числе.
