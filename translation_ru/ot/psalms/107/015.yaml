source:
  edition: WLC
  text: יוֹד֣וּ לַ/יהוָ֣ה חַסְדּ֑/וֹ וְ֝/נִפְלְאוֹתָ֗י/ו לִ/בְנֵ֥י אָדָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/015.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: ru
  text: Пусть благодарят Яхве за Его верную любовь и за Его дивные дела для людей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам человеческим»; возможно также: «человечеству».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Пусть благодарят
  rationale: Форма выражает призыв; глагол ידה в повторяющемся рефрене псалма естественно передаётся как «благодарить», с сохранением побудительной силы.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל־ указывает, кому возносится благодарность, а יהוה передаётся как личное имя «Яхве».
- source_word: חַסְדּוֹ
  choice: за Его верную любовь
  rationale: חסד сочетает значения любви, благости и неизменной верности; «верная любовь» кратко сохраняет эту смысловую насыщенность без излишнего конфессионального уточнения.
- source_word: וְנִפְלְאוֹתָיו
  choice: и за Его дивные дела
  rationale: Существительное от פלא обозначает необычайные деяния Бога; «дивные дела» сохраняет активный смысл и возвышенный поэтический регистр.
- source_word: לִבְנֵי אָדָם
  choice: для людей
  rationale: Буквально «сынам человеческим»; в контексте предлог указывает на тех, ради кого или для кого совершены дивные дела. «Для людей» естественно передаёт собирательное значение идиомы в современном русском.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Передача בני אדם
  choice: для людей
  alternative: сынам человеческим
  rationale: Выбрана естественная собирательная передача идиомы; буквальный традиционный вариант сохранён в примечании, поскольку он отражает форму оригинала.
- issue: Смысл חסד
  choice: верная любовь
  alternative: милость
  rationale: Выбранный вариант удерживает одновременно любовь и постоянство/верность, тогда как «милость» может сузить смысл.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным псалмическим звучанием. Синтаксический параллелизм и призывная форма оригинала сохранены; архаизм «сыны человеческие» вынесен в примечание.
