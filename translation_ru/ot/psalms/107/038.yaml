base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/038.yaml
  text: He blessed them[a], and they multiplied greatly; and he did not let their livestock decrease.
translation:
  language: ru
  text: Он благословил их, и они весьма умножились; Он не допустил, чтобы их скот уменьшился.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, с передачей результата: «и скот их не уменьшался». Еврейский глагол стоит в каузативной форме, буквально: «Он не уменьшил [их скот]»; наиболее естественно его субъектом понимать Бога.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: Он благословил их
  rationale: Пиэль глагола ברך с суффиксом 3-го лица множественного числа означает дарование благословения и благополучия. Единственное число субъекта указывает на Бога, упомянутого в контексте псалма.
- source_word: וַיִּרְבּוּ
  choice: они весьма умножились
  rationale: Непереходная форма רבה обозначает значительный численный рост. «Умножились» сохраняет связь между Божьим благословением и возрастанием народа.
- source_word: מְאֹד
  choice: весьма
  rationale: Наречие усиливает степень возрастания. «Весьма» уместно в современном возвышенном библейском регистре и не звучит чрезмерно архаично.
- source_word: וּבְהֶמְתָּם
  choice: их скоту
  rationale: בְּהֵמָה здесь имеет собирательное значение и относится к домашним хозяйственным животным. «Скот» естественнее и точнее, чем более узкое «крупный рогатый скот» или слишком широкое «животные».
- source_word: לֹא יַמְעִיט
  choice: не давал … убывать
  rationale: Хифиль מעט буквально передаёт значение «не уменьшал, не делал малочисленным». Русская конструкция «не давал … убывать» естественно выражает каузативный смысл и сохраняет Бога как продолжающегося субъекта.
theological_decisions:
- issue: Субъект заключительной части стиха
  choice: 'Бог остаётся субъектом: «Он не давал их скоту убывать»'
  alternative: «И скот их не убывал»
  rationale: Мужская форма глагола в единственном числе естественнее всего продолжает линию единственного божественного субъекта в словах «Он благословил». Вместе с тем по смыслу заключительную часть можно передать как наступивший результат, поэтому этот вариант отмечен в сноске без устранения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Синтаксический параллелизм оригинала сохранён; «весьма» поддерживает торжественный регистр, оставаясь понятным современному читателю.
