base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/001.yaml
  text: Give thanks to Yahweh[a], for he is good[b], for his steadfast love endures forever.
translation:
  language: ru
  text: Благодарите Яхве[a], ибо Он благ, ибо Его неизменная любовь — навеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господа». В еврейском тексте стоит личное имя Бога יהוה (Яхве).'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Его милость — навеки»; «Его заветная верность — навеки». Еврейское חֶסֶד означает неизменную любовь, милость и верность отношениям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹדוּ
  choice: Благодарите
  rationale: Форма повелительного наклонения множественного числа от ידה в контексте псалмов призывает воздать Богу благодарность и хвалу. «Благодарите» ясно передаёт основной смысл и сохраняет литургический характер призыва.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата благодарности, а יהוה — личное имя Бога. Транслитерация «Яхве» сохраняет употреблённое в еврейском тексте имя.
- source_word: כִּי
  choice: ибо
  rationale: В обоих случаях союз вводит основание для призыва. «Ибо» сохраняет повтор еврейского текста и соответствует возвышенному, но понятному регистру псалма.
- source_word: טוֹב
  choice: благ
  rationale: Прилагательное широко обозначает нравственную доброту и благость Бога. Краткая форма «благ» естественна в данном именном сказуемом и не сужает смысл до одной лишь доброжелательности.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Выражение обозначает неограниченную продолжительность. «Навеки» кратко и естественно передаёт его наречное значение без добавления отсутствующего в еврейском тексте глагола.
- source_word: חַסְדּוֹ
  choice: Его верная любовь
  rationale: חֶסֶד объединяет значения любви, милости, постоянства и верности отношениям. «Верная любовь» сохраняет как личностную теплоту, так и устойчивую преданность, не сводя слово только к милосердию или юридической верности.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон. «Яхве» передаёт личное имя, тогда как «Господь» отражает традицию замещения при чтении.
- issue: Передача חֶסֶד
  choice: верная любовь
  alternative: милость; заветная верность
  rationale: Выбранное выражение удерживает смысловое напряжение между любовью, милостью и неизменной верностью. Вариант «милость» может ослабить оттенок преданности, а «заветная верность» — сделать явным заветный аспект, который здесь подразумевается лексически, но не назван отдельно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмическим звучанием. Повтор «ибо» сохраняет параллельное обоснование исходного текста; краткое «благ» и форма «навеки» обеспечивают лаконичность и ритм.
