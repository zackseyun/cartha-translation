  text: Then they were glad that they grew quiet[b][a], and he led them to their desired haven.
translation:
  language: ru
  text: Тогда они обрадовались, что волны утихли[a], и Он привёл их к желанной гавани[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «они утихли». Подлежащее не названо; по контексту речь идёт о волнах или водах, которые успокоились.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к желанной пристани» либо «в желанный порт».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ
  choice: Тогда они обрадовались
  rationale: Глагол שׂמח выражает радость, а повествовательная форма с וַ передаёт последовательность событий; «тогда» естественно отражает её по-русски.
- source_word: כִּי
  choice: что
  rationale: Союз вводит причину или содержание радости. Русское «обрадовались, что» естественно сочетает оба оттенка.
- source_word: יִשְׁתֹּקוּ
  choice: волны утихли
  rationale: Форма 3-го лица множественного числа не называет подлежащего. В предыдущем стихе ближайшим контекстуальным подлежащим служат волны; «утихли» точно передаёт שׁתק — «стать тихим, умолкнуть».
- source_word: וַיַּנְחֵם
  choice: и Он привёл их
  rationale: Глагол נחה означает «вести, направлять». «Привёл» естественно выражает успешное достижение названного места; субъектом по контексту является Бог.
- source_word: מְחוֹז
  choice: пристани
  rationale: В морском контексте слово обозначает место прибытия, гавань или порт. «Пристань» понятно современному читателю и сохраняет поэтическое звучание.
- source_word: חֶפְצָם
  choice: желанной
  rationale: Форма от חפץ выражает желание или то, к чему стремятся; определение «желанной» лаконично передаёт смысл «пристань, которой они желали».
theological_decisions:
- issue: Неявно названный субъект וַיַּנְחֵם
  choice: «Он», то есть Бог в контексте псалма
  alternative: Безличное «их привело» или страдательное «они были приведены»
  rationale: Еврейский глагол стоит в 3-м лице мужского рода единственного числа, а окружающий контекст представляет Господа действующим в ответ на вопль мореходов. Личное местоимение сохраняет эту субъектность без добавления имени, отсутствующего в стихе.
- issue: Неуказанное подлежащее יִשְׁתֹּקוּ
  choice: Контекстуально уточнено как «волны»
  alternative: Буквальное «они утихли», относимое к волнам, водам либо к общему успокоению моря
  rationale: Подлежащее в самом предложении не выражено, однако предшествующий стих прямо говорит о волнах. Сноска сохраняет грамматическую неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно поэтическим библейским звучанием. Заглавное «Он» ясно указывает на Бога по контексту, не вставляя отсутствующее в стихе имя. Формулировка проста и пригодна для публичного чтения.
