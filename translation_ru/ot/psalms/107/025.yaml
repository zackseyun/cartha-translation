  text: וַ/יֹּ֗אמֶר וַֽ֭/יַּעֲמֵד ר֣וּחַ סְעָרָ֑ה וַ/תְּרוֹמֵ֥ם גַּלָּֽי/ו׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/025.yaml
  text: For he spoke and raised up a storm wind[a], and it lifted up its waves.
translation:
  language: ru
  text: Он сказал — и поднял бурный ветер[a], который взметнул морские волны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сказал — и сделал так, что поднялся бурный ветер».'
    reason: Лексическая альтернатива, более явно передающая каузативную форму וַיַּעֲמֵד.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Он сказал
  rationale: Обычное значение אמר — «сказать». В контексте подразумеваемый субъект — Господь; перевод сохраняет действие через произнесённое слово, не усиливая его до «повелел».
- source_word: וַיַּעֲמֵד
  choice: поднял
  rationale: Каузативная форма от עמד означает «сделал так, что поднялся / возник». «Поднял бурный ветер» естественно по-русски и сохраняет причинное действие.
- source_word: רוּחַ סְעָרָה
  choice: бурный ветер
  rationale: 'Передаёт оба компонента сочетания: «ветер» и его штормовой характер; выражение понятно и поэтично без архаизации.'
- source_word: וַתְּרוֹמֵם
  choice: который взметнул
  rationale: Форма женского рода соотносится с רוּחַ, также грамматически женского рода в еврейском. Относительная конструкция ясно сохраняет ветер как субъект; «взметнул» естественно описывает воздействие бури на волны.
- source_word: גַּלָּיו
  choice: морские волны
  rationale: Суффикс буквально означает «его волны» и в контексте указывает на море из предыдущего стиха. Явное «морские» устраняет неестественную для русского двусмысленность местоимения, не меняя образа.
theological_decisions:
- issue: Подразумеваемый божественный субъект
  choice: «Он» относится к Господу из ближайшего контекста.
  alternative: Безличный перевод либо добавление имени «Господь».
  rationale: Личная глагольная форма и контекст указывают на продолжающееся действие Господа. Местоимение сохраняет связность оригинала, не добавляя отсутствующего в стихе имени.
- issue: Характер Божьего речевого действия
  choice: «сказал»
  alternative: «повелел»
  rationale: «Повелел» возможно по смыслу контекста, но сильнее словарного значения אמר. Выбранный вариант сохраняет напряжение между простым речением и его властным результатом.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Тире передаёт стремительную связь между Божьим словом и возникновением ветра. Избегнуты как архаическое «воздвиг», так и более интерпретирующее «разразил бурю».
