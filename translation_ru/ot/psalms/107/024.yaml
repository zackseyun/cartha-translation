  text: הֵ֣מָּה רָ֭אוּ מַעֲשֵׂ֣י יְהוָ֑ה וְ֝/נִפְלְאוֹתָ֗י/ו בִּ/מְצוּלָֽה׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/024.yaml
  text: They saw the works of Yahweh[a], and his wonders in the deep.
translation:
  language: ru
  text: Они видели дела Яхве и Его чудеса в морской пучине[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в глубинах». Еврейское слово обозначает глубокие воды, что соответствует морскому контексту псалма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: Они
  rationale: Самостоятельное местоимение третьего лица множественного числа подчёркивает подлежащее; явное «они» естественно передаёт это в русском стихе.
- source_word: רָאוּ
  choice: видели
  rationale: Форма qal перфекта описывает пережитое мореходами событие; прошедшее время соответствует повествовательному контексту.
- source_word: מַעֲשֵׂי
  choice: дела
  rationale: Слово обозначает совершённые действия; «дела» сохраняет широкий смысл и естественно сочетается с последующим «чудеса».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: וְנִפְלְאוֹתָיו
  choice: и Его чудеса
  rationale: Существительное во множественном числе обозначает изумительные, сверхъестественные деяния; местоименный суффикс передан словом «Его».
- source_word: בִּמְצוּלָה
  choice: в морской пучине
  rationale: מְצוּלָה обозначает глубину или пучину, особенно глубокие воды; слово «морской» естественно уточняет образ в непосредственном контексте мореходства.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской поэзии. Перестановка «Его чудеса» естественна для русского; определение «морской» делает значение «пучины» ясным без утраты поэтического образа.
