  text: Their soul loathed all food[a], and they drew near to the gates of death.
translation:
  language: ru
  text: Их душа питала отвращение ко всякой пище[a], и они приблизились к вратам смерти.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у них было отвращение ко всякой пище»; проще: «они питали отвращение ко всякой пище». Еврейское слово נַפְשָׁם («их душа») в зависимости от контекста может обозначать внутреннее «я», жизнь или аппетит.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֹכֶל
  choice: всякой пищей
  rationale: Сочетание כָּל с собирательным אֹכֶל означает пищу вообще. Русское «всякой пищей» естественно передаёт полноту выражения и согласуется с управлением глагола «гнушаться».
- source_word: תְּתַעֵב
  choice: гнушалась
  rationale: Порода пиэль глагола תעב выражает сильное отвращение. «Гнушалась» сохраняет интенсивность и поэтическое достоинство, не сводя смысл к простому отсутствию аппетита.
- source_word: נַפְשָׁם
  choice: их душа
  rationale: נֶפֶשׁ может обозначать душу, внутреннее «я», жизнь или, в данном контексте, аппетит. Буквальный образ «их душа» сохраняет антропологическую многозначность еврейского текста; единственное число соответствует форме исходного существительного.
- source_word: וַיַּגִּיעוּ עַד
  choice: они приблизились к
  rationale: В данном образном контексте сочетание передаёт достижение предельной близости к смерти, а не переход за её порог. «Приблизились к» ясно выражает непосредственную угрозу и естественно сочетается с образом врат.
- source_word: שַׁעֲרֵי מָוֶת
  choice: вратам смерти
  rationale: Это прямое сохранение еврейской метафоры порога смерти. «Врата» уместны в возвышенной поэтической речи и не подменяют слово «смерть» понятием шеола.
theological_decisions:
- issue: Передача נֶפֶשׁ в контексте тяжёлой болезни
  choice: их душа
  alternative: они; их аппетит; их жизнь
  rationale: Хотя упоминание пищи допускает значение «аппетит», исходный текст использует многозначное נֶפֶשׁ. Сохранение слова «душа» не ограничивает состояние только телесным симптомом и оставляет присущую оригиналу смысловую напряжённость; контекстуальный оттенок пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. «Врата смерти» сохраняют библейский образ, а «гнушалась» передаёт сильное отвращение. Синтаксис остаётся ясным для широкого читателя.
