  yaml_path: translation/ot/psalms/107/043.yaml
  text: Who is wise? Let him keep these things[c][b][a], and let them consider the steadfast love of Yahweh.
translation:
  language: ru
  text: Кто мудр? Пусть помнит всё это, и пусть вникают[a] в проявления верной любви Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте сначала стоит единственное число («пусть помнит»), а затем множественное («пусть вникают»). Эта смена числа сохранена в переводе.
    reason: source_text_feature
  - marker: b
    text: Еврейское слово, переданное как «проявления верной любви», стоит во множественном числе; имеются в виду многочисленные дела любви, верности и милости Яхве.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי חָכָם
  choice: Кто мудр?
  rationale: Сохранён прямой риторический вопрос, характерный для заключительного наставления в литературе мудрости.
- source_word: וְיִשְׁמָר אֵלֶּה
  choice: Пусть помнит всё это
  rationale: שׁמר здесь означает не просто хранить, а внимательно удерживать в памяти и принимать во внимание всё рассказанное в псалме. Буквальное «пусть хранит это» по-русски не передаёт данного смысла естественно.
- source_word: וְיִתְבּוֹנְנוּ
  choice: и пусть вникают
  rationale: Форма от בין выражает вдумчивое постижение. «Вникают» передаёт не беглое размышление, а стремление понять смысл описанных деяний; множественное число исходного текста сохранено.
- source_word: חַסְדֵי
  choice: проявления верной любви
  rationale: Множественное число указывает на многочисленные проявления חסד — неизменной, преданной любви и милости, — а не только на отвлечённое качество.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
theological_decisions:
- issue: Смысл множественного חַסְדֵי
  choice: проявления верной любви
  alternative: милости; неизменная любовь
  rationale: Так сохраняются и идея верной любви, и множественность её конкретных проявлений, не сводя термин исключительно к одному богословскому оттенку.
- issue: Переход от единственного числа к множественному
  choice: «Пусть помнит… и пусть вникают»
  alternative: «Пусть помнит… и пусть вникает»; «пусть мудрые вникают»
  rationale: Необычная смена числа сохранена, поскольку она присутствует в еврейском тексте. При этом не добавлено существительное «мудрые», которого во второй части оригинала нет.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, прямо употреблённое в источнике.
translation_notes:
  register: Современный литературный русский язык с краткой, наставительной интонацией. Необычная смена грамматического числа намеренно сохранена и пояснена в сноске; лексика остаётся понятной без утраты торжественного характера заключительной строки псалма.
