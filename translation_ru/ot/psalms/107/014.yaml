    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹצִיאֵם
  choice: Он вывел их
  rationale: Хифиль глагола יצא означает «вывести, заставить выйти». Русское совершенное прошедшее естественно передаёт воспоминание о Божьем избавлении в контексте псалма.
- source_word: מֵחֹשֶׁךְ
  choice: из тьмы
  rationale: חֹשֶׁךְ — обычное обозначение тьмы; предлог מִן здесь естественно передаётся русским «из».
- source_word: וְצַלְמָוֶת
  choice: и смертной тени
  rationale: צַלְמָוֶת допускает традиционное понимание «смертная тень» и значение «глубокая тьма». Основной текст сохраняет образ смертельной опасности, а лексическая альтернатива дана в сноске.
- source_word: וּמוֹסְרוֹתֵיהֶם
  choice: их оковы
  rationale: מוֹסְרוֹת обозначает путы, узы или оковы. «Оковы» естественно и выразительно соответствует контексту заключения и освобождения.
- source_word: יְנַתֵּק
  choice: разорвал
  rationale: Пиэль от נתק выражает насильственное разъединение, разрыв или срывание. Сочетание «разорвал оковы» понятно по-русски и сохраняет силу исходного глагола.
theological_decisions:
- issue: Значение צַלְמָוֶת
  choice: смертная тень
  alternative: глубокая тьма, непроглядная тьма
  rationale: Еврейское слово может вызывать образ близости смерти либо обозначать исключительно глубокую тьму. Традиционное и лексически допустимое «смертная тень» оставлено в тексте без устранения неоднозначности; другое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Синтаксис краткий и ясный; традиционный образ «смертной тени» сохранён, а возможное значение «глубокая тьма» вынесено в сноску.
