source:
  edition: WLC
  text: יִשְׁלַ֣ח דְּ֭בָר/וֹ וְ/יִרְפָּאֵ֑/ם וִֽ֝/ימַלֵּ֗ט מִ/שְּׁחִיתוֹתָֽ/ם׃׆
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/020.yaml
  text: He sent his word and healed them[a], and delivered them from their pits.
translation:
  language: ru
  text: Он послал Своё слово и исцелил их, избавил их от гибели[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из их ям» или «из их могил». Еврейское слово может обозначать ямы, могилы или погибель, разрушение.'
    reason: Лексическая неоднозначность существительного מִשְּׁחִיתוֹתָם.
lexical_decisions:
- source_word: יִשְׁלַח
  choice: послал
  rationale: Форма Qal imperfect в поэтическом повествовании передаёт совершённое действие Бога в ряду Его спасительных деяний; прошедшее время естественно в данном контексте.
- source_word: דְּבָרוֹ
  choice: Своё слово
  rationale: Сохраняет краткое и богословски ёмкое значение «слово», не сужая его до «повеления» или «весть» и не вводя личностного толкования.
- source_word: וְיִרְפָּאֵם
  choice: и исцелил их
  rationale: Глагол רפא в Qal прямо означает «исцелять»; местоименный суффикс относится к страдавшим людям.
- source_word: וִימַלֵּט
  choice: избавил их
  rationale: Piel глагола מלט выражает избавление или предоставление выхода из смертельной опасности; дополнение «их» ясно восстанавливается из контекста.
- source_word: מִשְּׁחִיתוֹתָם
  choice: от гибели
  rationale: Форма допускает значения разрушения, погибели и ям; собирательное русское «от гибели» естественно передаёт смертельную опасность, тогда как более конкретный образ ям сохранён в сноске.
theological_decisions:
- issue: Возможное богословское переосмысление выражения «Своё слово»
  choice: Оставить выражение как Божье действенное слово, не уточняя его личностный или мессианский референт.
  alternative: Перевести «Своё повеление» либо истолковать «Слово» как отдельную личность.
  rationale: Сам стих говорит о посланном Богом слове, которое приносит исцеление и избавление; перевод не должен вносить более узкое христологическое отождествление, прямо не выраженное в еврейском тексте.
- issue: Образ смертельной опасности в מִשְּׁחִיתוֹתָם
  choice: В основном тексте передать как «от гибели», а конкретный образ ям и могил отметить в сноске.
  alternative: «из их ям» или «из их могил».
  rationale: Еврейское слово допускает как конкретное, так и более широкое понимание; основной текст остаётся естественным по-русски, а сноска сохраняет подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной псалмовой интонацией. Заглавная буква в «Своё» следует принятой русской практике почтительного местоименного обозначения Бога. Повтор «их» сохраняет ясность двух параллельных спасительных действий.
