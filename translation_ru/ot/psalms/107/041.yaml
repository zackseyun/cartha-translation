  text: וַ/יְשַׂגֵּ֣ב אֶבְי֣וֹן מֵ/ע֑וֹנִי וַ/יָּ֥שֶׂם כַּ֝/צֹּ֗אן מִשְׁפָּחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/041.yaml
  text: But he sets the needy on high[a], away from affliction, and makes their families like a flock.
translation:
  language: ru
  text: Но Он возвышает нуждающегося, избавляя его от бедствия, и умножает его семьи, как стадо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возносит нуждающегося из бедствия»; букв. «делает его семьи подобными стаду».'
    reason: Первое выражение передаёт образ вознесения и удаление от бедствия; второе отмечает более буквальную форму заключительного сравнения.
lexical_decisions:
- source_word: וַיְשַׂגֵּב
  choice: поднимает
  rationale: Глагол שׂגב обозначает вознесение на высоту и нередко подразумевает безопасность. «Поднимает» естественно звучит по-русски, а сочетание «над бедствием» сохраняет образ возвышения и избавления.
- source_word: אֶבְיוֹן
  choice: бедного
  rationale: אֶבְיוֹן обозначает нуждающегося, неимущего человека. «Бедного» здесь кратко и естественно передаёт как материальную нужду, так и уязвимое положение.
- source_word: מֵעֹנִי
  choice: над бедствием
  rationale: עֹנִי может означать бедствие, страдание, нищету или угнетение. Предлог מִן допускает смысл удаления «из бедствия», однако при שׂגב возможен пространственный образ «поднять над бедствием»; неоднозначность отмечена в сноске.
- source_word: וַיָּשֶׂם
  choice: умножает
  rationale: Буквально שׂים значит «ставит, делает». В сочетании с «семействами, как стадо» контекстуальный смысл — сделать семейства многочисленными; «умножает» ясно передаёт результат образного сравнения, не устраняя его.
- source_word: כַּצֹּאן
  choice: как стадо
  rationale: צֹאן — собирательное обозначение мелкого скота, прежде всего овец и коз. «Как стадо» сохраняет пастушеский образ и идею многочисленности.
- source_word: מִשְׁפָּחוֹת
  choice: его семейства
  rationale: Существительное стоит без притяжательного суффикса и буквально означает «семейства». Местоимение «его» восполняет подразумеваемую связь с бедным; множественное «семейства» сохраняет форму еврейского текста.
theological_decisions:
- issue: Подразумеваемая принадлежность семейств бедному
  choice: его семейства
  alternative: семейства
  rationale: В еврейском тексте притяжательное местоимение отсутствует, однако контекст связывает семейства с избавленным бедным. Добавление «его» делает эту связь ясной по-русски, не вводя отдельного богословского утверждения.
- issue: Образ возвышения и избавления
  choice: поднимает над бедствием
  alternative: выводит из бедствия
  rationale: Конструкция допускает как образ вознесения в безопасное место, так и акцент на удалении от страдания. Основной текст сохраняет образ высоты, а сноска указывает естественный альтернативный смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Сохранены параллелизм, пастушеский образ и возможная неоднозначность выражения מֵעֹנִי; избегнуты архаизмы и конфессионально окрашенные формулировки.
