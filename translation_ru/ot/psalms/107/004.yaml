  source_fidelity: Основной текст в целом верно передаёт תָּעוּ («блуждали»), בַּמִּדְבָּר («в пустыне») и образ בִּישִׁימוֹן דָּרֶךְ как пути через безлюдную, пустынную местность. Однако לֹא מָצָאוּ — завершённое отрицательное сообщение («не нашли»), а не повторяющееся/длительное «не находили». Сноска в её нынешней форме опускает דָּרֶךְ («путь»), поэтому не может служить полноценным альтернативным переводом всего стиха.
