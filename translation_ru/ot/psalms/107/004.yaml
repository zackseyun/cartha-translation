  text: Они блуждали в пустыне, по безлюдному пути; не нашли города, где можно поселиться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָּעוּ
  choice: Блуждали
  rationale: Глагол תעה обозначает блуждание или уклонение с пути. В данном контексте «блуждали» передаёт и движение, и потерю направления, не приписывая этому нравственного смысла.
- source_word: בַמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необитаемую местность; «пустыня» естественно и точно звучит в современном русском библейском тексте.
- source_word: בִּישִׁימוֹן דָּרֶךְ
  choice: по безлюдному пути
  rationale: יְשִׁימוֹן означает пустынное, опустошённое место, а דֶּרֶךְ — путь или дорогу. Совместное прочтение «по безлюдному пути» сохраняет сжатый образ еврейского текста; возможное иное членение отражено в сноске.
- source_word: עִיר מוֹשָׁב
  choice: города, где можно поселиться
  rationale: Сочетание выражает город как место обитания или поселения. Такой перевод понятен современному читателю и не сводит смысл лишь к наличию жителей.
- source_word: לֹא מָצָאוּ
  choice: не находили
  rationale: Отрицательная форма прямо сообщает, что искомого города они не нашли; несовершенный вид по-русски естественно согласуется с продолжительным блужданием.
