lexical_decisions:
- source_word: יָח֣וֹגּוּ
  choice: кружатся
  rationale: Глагол допускает образ движения по кругу и в данном контексте описывает неуверенные движения людей на корабле; «кружатся» сохраняет отличие от следующего близкого по смыслу глагола.
- source_word: וְיָנוּעוּ
  choice: и шатаются
  rationale: Передаёт раскачивание и неустойчивость, естественно сочетаясь с образом пьяного.
- source_word: כַּשִּׁכּוֹר
  choice: как пьяный
  rationale: Кратко и естественно передаёт субстантивированное обозначение опьяневшего человека без добавления пола, отсутствующего в смысловом центре сравнения.
- source_word: וְכָל חָכְמָתָם
  choice: и всё их умение
  rationale: חָכְמָה обычно означает «мудрость», но в морском контексте обозначает практическое знание и мастерство; «умение» сохраняет прикладной смысл, не сужая его прямо до мореходства.
- source_word: תִּתְבַּלָּע
  choice: оказывается бессильным
  rationale: Форма буквально связана с поглощением, но идиоматически здесь выражает полный крах или утрату действенности человеческого мастерства; выбран естественный русский эквивалент, а буквальный образ отмечен в сноске.
