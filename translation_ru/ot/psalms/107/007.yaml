lexical_decisions:
- source_word: וַיַּדְרִיכֵם
  choice: Он повёл их
  rationale: Глагол דרך в породе хифиль означает вести или направлять по пути. «Повёл» естественно передаёт направляющее и каузативное значение формы.
- source_word: בְּדֶרֶךְ
  choice: путём
  rationale: דֶּרֶךְ может означать путь, дорогу или тропу. В сочетании с глаголом движения «путём» звучит естественно и сохраняет образ странствия.
- source_word: יְשָׁרָה
  choice: прямым
  rationale: Прилагательное означает прямой, ровный или правильный. В контексте путешествия «прямым» сохраняет конкретный образ верного, неуклонного маршрута.
- source_word: לָלֶכֶת
  choice: чтобы они пришли
  rationale: Инфинитив הלך выражает цель движения. По-русски «чтобы они пришли» естественно связывает Божье водительство с достижением города, не превращая оборот в указание лишь на ходьбу.
- source_word: אֶל
  choice: в
  rationale: Направительный предлог אֶל здесь естественно передаётся русской конструкцией «прийти в город».
- source_word: עִיר
  choice: город
  rationale: עִיר обозначает город или поселение; «город» является прямым и обычным соответствием.
- source_word: מוֹשָׁב
  choice: где могли бы поселиться
  rationale: מוֹשָׁב означает место жительства, поселение или обитание. Такая формулировка естественно раскрывает определительное сочетание עִיר מוֹשָׁב, сохраняя смысл города как места постоянного проживания.
