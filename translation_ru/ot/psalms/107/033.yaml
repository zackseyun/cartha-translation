  text: יָשֵׂ֣ם נְהָר֣וֹת לְ/מִדְבָּ֑ר וּ/מֹצָ֥אֵי מַ֝֗יִם לְ/צִמָּאֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/033.yaml
  text: He turns rivers into a wilderness[a], and springs of water into thirsty ground.
translation:
  language: ru
  text: 'Он превращает реки в пустыню,

    а источники вод — в иссохшую землю.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в жажду»; еврейское существительное обозначает жажду или иссушенность и здесь описывает сухую, безводную местность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: превращает
  rationale: Глагол שׂים буквально означает «класть, помещать, делать»; в контексте изменения состояния естественно передаётся как «превращает».
- source_word: נְהָרוֹת
  choice: реки
  rationale: Прямое и обычное значение формы множественного числа; сохраняет поэтический масштаб образа.
- source_word: לְמִדְבָּר
  choice: в пустыню
  rationale: מִדְבָּר обозначает пустынную, безлюдную местность; предлог לְ здесь выражает итоговое состояние.
- source_word: וּמֹצָאֵי מַיִם
  choice: а источники вод
  rationale: מוֹצָאֵי — буквально «выходы, истоки»; в сочетании с «водами» речь идёт о местах выхода воды. Формулировка «источники вод» сохраняет образ и параллелизм.
- source_word: לְצִמָּאוֹן
  choice: в иссохшую землю
  rationale: צִמָּאוֹן буквально обозначает «жажду, иссушенность» и метонимически — сухое, безводное место. «Иссохшая земля» естественно передаёт физический образ, не превращая его в отвлечённое понятие.
