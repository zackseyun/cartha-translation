lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: Тогда они воззвали
  rationale: Последовательная форма с וַ продвигает повествование, а «воззвали» передаёт настойчивый крик о помощи и сохраняет достоинство поэтической речи.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל выражает направленность обращения; тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: בַּצַּר לָהֶם
  choice: в своей беде
  rationale: צַר обозначает бедственное, стеснённое положение. Единственное число исходного текста сохранено естественным русским выражением.
- source_word: מִמְּצוּקוֹתֵיהֶם
  choice: от всех их тягот
  rationale: מְצוּקוֹת — множественное число со значением тягот, притеснений и различных бедственных обстоятельств. Слово «всех» естественно передаёт совокупность множества, не сводя его к одной беде.
- source_word: יַצִּילֵם
  choice: Он избавил их
  rationale: Порода hифиль глагола נצל означает избавить или спасти от опасности. Прошедшее время согласуется с повествовательной последовательностью стиха.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное божественное имя. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Временное значение יַצִּילֵם
  choice: 'прошедшее время: «избавил»'
  alternative: 'настоящее время: «избавляет»'
  rationale: Хотя форма сама по себе допускает незавершённый вид, в данном рефрене она продолжает рассказ о совершившемся избавлении после воззвания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным псалмодическим звучанием. «Воззвали» и «избавил» привычны для библейской поэзии, но остаются понятными современному читателю.
