source:
  edition: WLC
  text: אֱ֭וִלִים מִ/דֶּ֣רֶךְ פִּשְׁעָ֑/ם וּֽ֝/מֵ/עֲוֺֽנֹתֵי/הֶ֗ם יִתְעַנּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/017.yaml
  text: Fools[a], because of the way of their transgression and because of their iniquities[c][b], were afflicted.
translation:
  language: ru
  text: Безумцы[a] страдали из-за своего преступного пути и из-за своих беззаконий[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Безумцы» — то есть нравственно неразумные люди, а не просто люди с недостатком ума.
    reason: lexical_clarification
  - marker: b
    text: 'Или: «из-за своих грехов»; еврейское слово может обозначать беззаконие, вину или её последствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱוִלִים
  choice: Безумцы
  rationale: В контексте мудростной традиции слово обозначает людей, нравственно неразумных, а не просто имеющих недостаток ума.
- source_word: מִדֶּרֶךְ פִּשְׁעָם
  choice: из-за своего преступного пути
  rationale: Предлог מִן здесь естественно выражает причину, а דֶּרֶךְ сохраняется как образ жизненного пути или образа поведения. Прилагательное «преступного» передаёт нравственную тяжесть פֶּשַׁע без громоздкого сочетания «пути своего преступления».
- source_word: וּמֵעֲוֺנֹתֵיהֶם
  choice: и из-за своих беззаконий
  rationale: Повтор «из-за» отражает второй предлог מִן и ясно сохраняет причинную связь. «Беззакония» передаёт виновные проступки и отличает этот термин от פֶּשַׁע.
- source_word: יִתְעַנּוּ
  choice: страдали
  rationale: Хитпаэль от ענה здесь описывает состояние притеснения или страдания. Простое «страдали» естественно по-русски и соответствует повествовательному контексту псалма.
theological_decisions:
- issue: Причинная связь между грехом и страданием
  choice: Стих говорит, что эти люди страдали из-за собственного преступного пути и беззаконий.
  alternative: Предлоги можно более формально передать как «от», ослабив явное выражение причины.
  rationale: Оба употребления מִן в данном поэтическом контексте вероятнее всего причинные. Формулировка сохраняет логику конкретного стиха, но не превращает её в универсальное утверждение, будто всякое страдание вызвано личным грехом.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмической речи. Синтаксис сделан естественным для русского, при этом сохранены образ «пути», повтор причинного предлога и различие между двумя обозначениями проступка.
