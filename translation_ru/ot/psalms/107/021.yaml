base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/021.yaml
  text: Let them give thanks to Yahweh for his steadfast love and for his wondrous deeds to the children of man[a][b].
translation:
  language: ru
  text: Пусть благодарят Яхве за Его неизменную любовь и за Его чудесные дела[b] для людей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для человечества». Буквально: «для сынов человека»; это обобщающее выражение означает всех людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за Его чудеса», «за Его дивные дела».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹדוּ
  choice: Пусть благодарят
  rationale: Форма выражает призыв; в повторяющемся рефрене псалма глагол ידה означает благодарить Бога за избавление, хотя может включать оттенок хвалы.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата благодарности, а יהוה передано как личное имя Бога — «Яхве».
- source_word: חַסְדּוֹ
  choice: за Его неизменную любовь
  rationale: חסד обозначает стойкую, верную любовь и благость; «неизменная любовь» естественно передаёт её постоянство, не сужая значение только до милости.
- source_word: וְנִפְלְאוֹתָיו
  choice: и за Его дивные дела
  rationale: נפלאות — необычайные деяния, вызывающие изумление; слово «дела» ясно передаёт конкретный характер Божьих действий.
- source_word: לִבְנֵי אָדָם
  choice: для сынов человеческих
  rationale: Сохранён еврейский образ «сыны человека», употреблённый в собирательном смысле обо всех людях; предлог ל передан как указание на тех, ради кого или для кого совершены дивные дела.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохранено личное имя Бога, а не заменяющий его титул.
- issue: Обобщающее выражение בְּנֵי אָדָם
  choice: сыны человеческие
  alternative: люди; человечество
  rationale: Формулировка сохраняет образность и грамматическую форму оригинала, при этом сноска поясняет, что речь идёт обо всех людях, а не только о мужчинах.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным псалмическим звучанием. Местоимение «Его» написано с прописной буквы как традиционное почтительное обозначение Бога. Буквенный образ «сыны человеческие» сохранён в основном тексте, а его обобщающий смысл разъяснён в сноске.
