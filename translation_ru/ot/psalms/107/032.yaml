  text: וִֽ֭/ירֹמְמוּ/הוּ בִּ/קְהַל עָ֑ם וּ/בְ/מוֹשַׁ֖ב זְקֵנִ֣ים יְהַלְלֽוּ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/107/032.yaml
  text: Let them exalt him in the assembly of the people[b][a], and praise him in the council of the elders.
translation:
  language: ru
  text: Пусть превозносят Его в собрании народа[a] и восхваляют Его в совете старейшин[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в общине народа».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на заседании старейшин»; имеется в виду собрание старейшин, совещавшихся сидя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וִירֹמְמוּהוּ
  choice: Пусть превозносят Его
  rationale: Глагол רומם выражает возвышение и прославление кого-либо; «превозносят» естественно для современного литературного русского и сохраняет значение публичного воздания чести. Союз ו передан через связность всего предложения, без отдельного «и» в начале.
- source_word: בִּקְהַל עָם
  choice: в собрании народа
  rationale: קהל обозначает собравшееся сообщество, а עָם — народ как общину. «Собрание народа» передаёт публичный и общинный характер действия, не сужая его до конфессионально окрашенного значения.
- source_word: וּבְמוֹשַׁב זְקֵנִים
  choice: и в совете старейшин
  rationale: מוֹשָׁב буквально связано с сидением, местом или заседанием; в сочетании со «старейшинами» речь идёт о заседании признанных руководителей общины. «Совет старейшин» естественно передаёт этот институциональный смысл, тогда как буквальное «сидение» по-русски неясно.
- source_word: זְקֵנִים
  choice: старейшин
  rationale: В данном сочетании זְקֵנִים обозначает не просто пожилых мужчин, а признанных руководителей общины; «старейшины» сохраняет эту социальную функцию.
- source_word: יְהַלְלוּהוּ
  choice: восхваляют Его
  rationale: Пиэль глагола הלל означает хвалить, прославлять. «Восхваляют» хорошо соответствует поэтическому регистру и создаёт уместный параллелизм с «превозносят».
