  text: He made the storm be still[c][b][a], and their waves were hushed.
translation:
  language: ru
  text: Он обратил бурю в тишину, и умолкли их[a] волны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её волны», если по смыслу отнести местоимение к морю или водной стихии. В еврейском тексте буквально: «их волны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקֵם
  choice: обратил
  rationale: Каузативная форма глагола קום здесь означает, что Бог привёл бурю в иное состояние. «Обратил» естественно сочетается с обозначением результата и сохраняет каузативный смысл.
- source_word: סְעָרָה
  choice: бурю
  rationale: Существительное обозначает бурю или сильный шторм; «буря» ясно и уместно передаёт морской контекст.
- source_word: לִדְמָמָה
  choice: в тишину
  rationale: Предлог ל обозначает достигнутый результат, а דְּמָמָה — тишину, безмолвие или покой. Выражение «обратил бурю в тишину» сохраняет образ исходной конструкции и звучит естественно по-русски.
- source_word: וַיֶּחֱשׁוּ
  choice: умолкли
  rationale: Глагол передаёт прекращение шума и наступление тишины. «Умолкли» выразительно и естественно относится к волнам, не добавляя нового образа.
- source_word: גַּלֵּיהֶם
  choice: их волны
  rationale: Суффикс в масоретском тексте имеет форму третьего лица мужского рода множественного числа — буквально «их». Основной текст сохраняет эту форму, а возможное контекстуальное прочтение поясняется в сноске.
