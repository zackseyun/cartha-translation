lexical_decisions:
- source_word: אָחוֹר
  choice: сзади
  rationale: В паре с קֶדֶם слово имеет пространственное значение и обозначает то, что находится позади.
- source_word: קֶדֶם
  choice: спереди
  rationale: В противопоставлении אָחוֹר здесь естественнее пространственное значение «впереди, спереди», а не временное или географическое.
- source_word: צַרְתָּנִי
  choice: окружаешь меня
  rationale: Глагол передаёт образ заключения в границы или окружения. «Окружаешь меня» звучит естественно по-русски и не сводит образ однозначно ни к защите, ни к враждебной осаде.
- source_word: וַתָּשֶׁת
  choice: возлагаешь
  rationale: Глагол означает «класть, помещать». Настоящее время согласуется с контекстом псалма, описывающим постоянную реальность Божьего знания и присутствия; «возлагаешь руку» сохраняет возвышенный поэтический регистр.
- source_word: עָלַי
  choice: на меня
  rationale: Предлог עַל в данном образе естественно передаётся русским «на».
- source_word: כַּפֶּךָ
  choice: Свою руку
  rationale: Хотя כַּף может точнее обозначать ладонь, в русском выражении естественно употребить «руку». Возвратное «Свою» ясно соотносит руку с обращённым к Богу «Ты».
theological_decisions:
- issue: Должно ли окружение звучать как защита, стеснение или угроза
  choice: Сохранить смысловую неоднозначность посредством нейтрального «окружаешь», указав более сильные варианты в сноске.
  alternative: Передать однозначно как «оберегаешь» либо «осаждаешь».
  rationale: Контекст допускает одновременно близость, всеохватность и подавляющую силу Божьего присутствия; еврейский глагол не требует устранять это напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической интонацией. Синтаксический параллелизм и пространственный образ оригинала сохранены без архаизмов.
