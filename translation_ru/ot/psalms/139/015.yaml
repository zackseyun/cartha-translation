lexical_decisions:
- source_word: נִכְחַד
  choice: не был скрыт
  rationale: Нифаль глагола כחד передаёт состояние сокрытости; пассивная конструкция точно сохраняет смысл и естественно сочетается с «от Тебя».
- source_word: עָצְמִי
  choice: мой остов
  rationale: Здесь עֶצֶם обозначает не только отдельную кость, но и телесную основу, строение человека. «Остов» сохраняет телесный образ и не сужает его до буквальных костей.
- source_word: עֻשֵּׂיתִי
  choice: я был создан
  rationale: Пассивная форма עשה имеет широкое значение «быть сделанным, созданным». Этот вариант ясен и не дублирует образ ткачества в следующей строке.
- source_word: בַסֵּתֶר
  choice: втайне
  rationale: Краткое наречие естественно передаёт скрытость происходящего и поддерживает поэтический параллелизм.
- source_word: רֻקַּמְתִּי
  choice: соткан
  rationale: Глагол רקם вызывает образ искусного тканья или вышивания. «Соткан» сохраняет текстильную метафору без добавления отсутствующей в тексте характеристики.
- source_word: בְּתַחְתִּיּוֹת אָרֶץ
  choice: в глубинах земли
  rationale: Такой перевод сохраняет пространственный и поэтический образ еврейского выражения, не превращая его в буквальное утверждение о месте формирования человека.
theological_decisions:
- issue: Значение выражения «в глубинах земли»
  choice: Сохранён поэтический образ скрытого и таинственного формирования человека.
  alternative: Буквальное указание на нижние, подземные области мира.
  rationale: Контекст псалма говорит о всеобъемлющем знании Бога, а выражение параллельно слову «втайне». При этом перевод не заменяет образ прямым упоминанием материнской утробы и тем самым сохраняет исходную метафору и её неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным поэтическим звучанием. Местоимение «Тебя» написано с прописной буквы как традиционное уважительное обращение к Богу. Бессоюзное «соткан» передаёт параллельную структуру еврейского стиха без искусственного повторения «когда».
