  yaml_path: translation/ot/psalms/139/011.yaml
  text: And I said[a], “Surely darkness will cover me[b], and the night will be light around me.”
translation:
  language: ru
  text: 'И сказал я: «Несомненно, тьма скроет меня[a], и ночь будет светом вокруг меня[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тьма поглотит меня» или «тьма сокрушит меня». Еврейский глагол редок, и его точный оттенок здесь остаётся спорным.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и ночь — свет вокруг меня». В еврейском это безглагольное предложение; в переводе его можно понимать как относящееся к настоящему или будущему — в зависимости от связи с предыдущими словами псалмопевца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: И сказал я
  rationale: 'Форма waw + qatal, 1-е лицо единственного числа, естественно передаёт завершённое размышление: «И сказал я». Условное «Если скажу» в самом глаголе не выражено.'
- source_word: אַךְ
  choice: Уж точно
  rationale: Частица здесь усиливает уверенность высказывания, а не ограничивает его; «уж точно» звучит естественно в современной русской речи и сохраняет эмфазу.
- source_word: חֹשֶׁךְ
  choice: тьма
  rationale: Прямое и стилистически уместное соответствие существительному со значением темноты.
- source_word: יְשׁוּפֵנִי
  choice: укроет меня
  rationale: Редкий глагол שׁוף допускает разные толкования. В сочетании с подлежащим «тьма» значение «укроет» естественно передаёт образ тьмы, скрывающей говорящего, и согласуется с развитием мысли в следующем стихе.
- source_word: וְלַיְלָה
  choice: и ночь
  rationale: Сохранены простой союз и параллельное построение двух частей стиха.
- source_word: אוֹר
  choice: станет светом
  rationale: В еврейском это безглагольная именная конструкция. Будущее «станет» согласует её с предполагаемым развитием мысли, а форма «светом» сохраняет существительное как сказуемое.
- source_word: בַּעֲדֵנִי
  choice: вокруг меня
  rationale: В данном пространственном образе предлог בעד естественнее всего передать как окружение говорящего ночью.
