base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/021.yaml
  text: Do I not hate those who hate you, O LORD, and loathe those who rise up against you?
translation:
  language: ru
  text: 'Разве я не ненавижу ненавидящих Тебя, ГОСПОДИ,

    и не питаю отвращения к восстающим против Тебя?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשַׂנְאֶיךָ ... אֶשְׂנָא
  choice: ненавидящих Тебя ... ненавижу
  rationale: Сохраняет намеренный повтор корня שׂנא и прямую, напряжённую формулировку оригинала.
- source_word: יְהוָה
  choice: ГОСПОДИ
  rationale: Передаёт божественное имя принятой в русском библейском употреблении заменой «ГОСПОДЬ»; звательная форма естественно отражает прямое обращение.
- source_word: בִתְקוֹמְמֶיךָ
  choice: к восстающим против Тебя
  rationale: Передаёт причастную форму от קום с возвратно-интенсивным значением враждебного выступления против Бога.
- source_word: אֶתְקוֹטָט
  choice: питаю отвращение
  rationale: В данном контексте форма от קוט выражает сильное отвращение или омерзение; выбранный оборот естественен по-русски и не ослабляет эмоциональную силу стиха.
theological_decisions:
- issue: Сильное заявление псалмопевца о ненависти к Божьим противникам
  choice: Сохранена прямая лексика «ненавижу» и «питаю отвращение»
  alternative: Смягчить до «не люблю» или истолковать как одно лишь неприятие поступков
  rationale: Древнееврейский текст выражает резкую личную реакцию на людей, восстающих против Бога. Перевод сохраняет богословское напряжение и не вводит пояснение, которого нет в стихе.
translation_notes:
  register: Современный литературный русский с достоинством поэтической молитвы. Риторический вопрос передан конструкцией «Разве я не… и не…?». Заглавное «Тебя» соответствует распространённой русской традиции обращения к Богу.
