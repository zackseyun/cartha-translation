- source_word: לֹא יַחְשִׁיךְ מִמֶּךָ
  choice: для Тебя не темна
  rationale: Естественная русская передача смысла при сохранении образа тьмы; еврейская глагольная форма буквально связана с действием «делать тёмным, затемнять».
- source_word: וְלַיְלָה כַּיּוֹם יָאִיר
  choice: ночь сияет, как день
  rationale: Сохраняет поэтическое сравнение и глагольный образ свечения.
- source_word: כַּחֲשֵׁיכָה כָּאוֹרָה
  choice: тьма — как свет
  rationale: Передаёт краткую безглагольную конструкцию и не устраняет её поэтическую сжатость.
theological_decisions:
- issue: Следует ли явно истолковать тьму как неспособную скрыть что-либо от Бога
  choice: 'Сохранён образ: «тьма для Тебя не темна»'
  alternative: «тьма ничего не скроет от Тебя»
  rationale: Контекст подразумевает совершенное Божье видение, однако еврейский текст выражает это через образ тьмы и света, а не прямым утверждением о сокрытии.
- issue: Смысл заключительного сопоставления тьмы и света
  choice: «тьма — как свет»
  alternative: «что тьма, что свет — для Тебя одно»
  rationale: Основной текст сохраняет лаконичную форму оригинала, а более явное понимание равенства тьмы и света перед Богом отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с поэтической краткостью. Местоимение «Тебя» написано с прописной буквы как традиционно почтительное обращение к Богу; синтаксис остаётся ясным для обычного читателя.
