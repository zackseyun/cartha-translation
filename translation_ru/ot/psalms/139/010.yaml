- source_word: גַּם שָׁם
  choice: и там
  rationale: Передаёт присоединительно-усилительное значение גַּם в связи с предыдущим стихом и естественно звучит по-русски.
- source_word: תַנְחֵנִי
  choice: поведёт меня
  rationale: Форма от נחה обозначает ведение или направление; будущее время сохраняет форму исходного текста.
- source_word: יְמִינֶךָ
  choice: десница Твоя
  rationale: Традиционное возвышенное обозначение правой руки уместно в поэтической речи псалма и понятно современному читателю.
- source_word: תֹאחֲזֵנִי
  choice: удержит меня
  rationale: Передаёт значение крепко держать или поддерживать, не уточняя без необходимости, идёт ли речь прежде всего о защите или о невозможности укрыться.
theological_decisions:
- issue: Характер Божьего удерживающего присутствия
  choice: удержит меня
  alternative: крепко будет держать меня
  rationale: 'Краткая формулировка сохраняет двусмысленность контекста: Божья рука может восприниматься и как поддерживающая, и как не позволяющая псалмопевцу скрыться.'
