lexical_decisions:
- source_word: וּרְאֵה
  choice: И посмотри
  rationale: Форма повелительного наклонения продолжает обращённую к Богу молитвенную просьбу; «посмотри» сохраняет прямоту еврейского глагола.
- source_word: אִם
  choice: нет ли
  rationale: В данном контексте частица вводит косвенный вопрос; русское «нет ли» естественно передаёт просьбу обнаружить возможное наличие чего-либо.
- source_word: דֶּרֶךְ
  choice: путь
  rationale: Сохраняется характерная для Псалтири метафора образа жизни и поведения.
- source_word: עֹצֶב
  choice: причиняющего скорбь
  rationale: Слово связано с болью, страданием и скорбью. Описательный оборот передаёт как причиняемое зло, так и вызываемую им скорбь, не сужая смысл до нечестия или идолопоклонства.
- source_word: בִּי
  choice: во мне
  rationale: Буквально и естественно передаёт внутреннюю направленность самоиспытания.
- source_word: וּנְחֵנִי
  choice: и веди меня
  rationale: Глагол означает «вести, направлять»; выбранный вариант естественно сочетается с образом пути и сохраняет молитвенный тон.
- source_word: בְּדֶרֶךְ
  choice: путём
  rationale: Русский творительный падеж естественно обозначает путь, по которому Бог должен вести молящегося.
- source_word: עוֹלָם
  choice: вечным
  rationale: Передаёт значение неограниченной или непреходящей длительности и при этом сохраняет возможный смысл пути, пребывающего вовек.
theological_decisions:
- issue: Значение דֶּרֶךְ עֹצֶב
  choice: путь, причиняющий скорбь
  alternative: губительный путь; оскорбительный путь; путь идолопоклонства
  rationale: Еврейское выражение допускает оттенки боли, вреда и оскорбления; связь с идолопоклонством возможна, но контекст не требует такого сужения. Основной текст сохраняет широкое нравственное и личностное напряжение просьбы.
- issue: Значение דֶּרֶךְ עוֹלָם
  choice: путь вечный
  alternative: древний путь; путь вечности
  rationale: עוֹלָם может указывать как на вечность или непреходящую длительность, так и на древность. В основном тексте выбран наиболее естественный здесь смысл, а подлинная лексическая неоднозначность отмечена в сноске.
