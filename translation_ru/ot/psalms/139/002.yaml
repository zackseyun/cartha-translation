  text: אַתָּ֣ה יָ֭דַעְתָּ שִׁבְתִּ֣/י וְ/קוּמִ֑/י בַּ֥נְתָּה לְ֝/רֵעִ֗/י מֵ/רָחֽוֹק׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/002.yaml
  text: You know my sitting down and my rising up[b][a]; you understand my thought from afar.
translation:
  language: ru
  text: Ты знаешь, когда я сажусь и когда встаю; Ты понимаешь мою мысль[a] издали[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моё намерение» или «мой замысел».'
    reason: lexical_alternative
  - marker: b
    text: «Издали» может указывать на пространственную удалённость или на то, что Бог распознаёт мысль задолго до того, как она выражена.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדַעְתָּ
  choice: знаешь
  rationale: Перфект qal, 2-е лицо мужского рода единственного числа, обращённый к Богу. В контексте выражает устойчивое и полное знание, поэтому настоящее время по-русски естественно передаёт его статальный смысл.
- source_word: שִׁבְתִּי
  choice: когда я сажусь
  rationale: Форма от ישׁב с суффиксом 1-го лица единственного числа обозначает действие или состояние сидения. Придаточная конструкция естественна в современном русском и сохраняет связь с парным выражением «когда встаю».
- source_word: וְקוּמִי
  choice: и когда встаю
  rationale: Форма от קום с суффиксом 1-го лица единственного числа образует пару с «когда я сажусь». Эта пара может служить меризмом, охватывающим повседневную деятельность, но перевод не разворачивает этот подразумеваемый смысл в поясняющий пересказ.
- source_word: בַּנְתָּה
  choice: понимаешь
  rationale: Перфект qal, 2-е лицо мужского рода единственного числа, от בין указывает на глубокое постижение. «Понимаешь» отличает этот глагол от предшествующего «знаешь» и звучит естественно.
- source_word: לְרֵעִי
  choice: мою мысль
  rationale: Слово допускает значения мысли, намерения или замысла. «Мою мысль» — наиболее прямой вариант в данном контексте, не исключающий оттенка внутреннего намерения.
- source_word: מֵרָחוֹק
  choice: издали
  rationale: Передаёт буквальный пространственный образ «издалека» и одновременно сохраняет возможность понимания, согласно которому мысль распознана задолго до её выражения.
theological_decisions:
- issue: Объём Божьего знания в стихе
  choice: Стих говорит о глубоком личном знании Богом внешних действий и внутренней мысли псалмопевца, не определяя философскую модель всеведения.
  alternative: Можно истолковать «издали» исключительно как пространственную удалённость либо раскрыть выражение как прямое указание на заблаговременное знание ещё не высказанной мысли.
  rationale: Еврейский текст утверждает Божье знание действий и внутреннего мира человека, однако выражение מֵרָחוֹק остаётся образным и семантически открытым. Перевод сохраняет эту напряжённость и не превращает её в доктринальный пересказ.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным звучанием. Повтор местоимения «Ты» во второй части поддерживает прямое обращение к Богу и параллелизм. Придаточные «когда я сажусь и когда встаю» предпочтены буквальным, но неестественным отглагольным существительным.
