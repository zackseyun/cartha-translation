  text: Они говорят о Тебе со злым умыслом; Твои враги произносят Твоё имя напрасно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твои противники возносят [Тебя] для лжи»; возможно также: «Твои противники ложно превозносят Тебя». Еврейский текст заключительной строки труден; слово «имя» в нём прямо не выражено.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֲשֶׁר
  choice: они
  rationale: Относительная частица продолжает описание нечестивых из предыдущего стиха; в русском отдельное предложение с местоимением звучит естественно.
- source_word: יֹאמְרֻךָ
  choice: говорят о Тебе
  rationale: Форма אמר с суффиксом 2-го лица ед. числа здесь естественно понимается как враждебная речь о Боге, а не как прямое обращение к Нему.
- source_word: לִמְזִמָּה
  choice: со злым умыслом
  rationale: מְזִמָּה может обозначать замысел или злую интригу; перевод передаёт намеренный и злонамеренный характер речи.
- source_word: נָשֻׂא
  choice: произносят
  rationale: Буквально глагол означает «поднимать, нести». В принятом идиоматическом прочтении с подразумеваемым «именем» русское «произносят имя» передаёт смысл естественнее, чем буквальное «поднимают».
- source_word: לַשָּׁוְא
  choice: напрасно
  rationale: שָׁוְא охватывает значения пустоты, лжи и тщеты; в сочетании с подразумеваемым Божьим именем «напрасно» сохраняет узнаваемую библейскую идиому.
- source_word: עָרֶיךָ
  choice: Твои враги
  rationale: Хотя огласованная форма трудна и внешне может быть понята как «Твои города», контекст и поэтическое прочтение указывают на противников Бога.
theological_decisions:
- issue: Объект и смысл заключительной строки
  choice: Твои враги произносят Твоё имя напрасно
  alternative: «Твои противники возносят [Тебя] для лжи» или «они возносятся ради лжи — Твои противники»
  rationale: Еврейский синтаксис заключительной строки неясен. Основной текст следует вероятному идиоматическому пониманию נשׂא + שׁוא и контексту вражды против Бога, но слово «имя» в еврейском не выражено, поэтому неоднозначность и более буквальные варианты отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством псалмовой речи. Местоимения, относящиеся к Богу, написаны с прописной буквы. Интерпретирующее добавление «имя» раскрыто в сноске; подлинная неоднозначность еврейской строки сохранена.
