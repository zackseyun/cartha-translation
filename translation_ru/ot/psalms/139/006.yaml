  text: פלאיה דַ֣עַת מִמֶּ֑/נִּי נִ֝שְׂגְּבָ֗ה לֹא א֥וּכַֽל לָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/006.yaml
  text: Such knowledge is too wonderful for me[a]; it is too high—I cannot attain it.
translation:
  language: ru
  text: Такое знание слишком удивительно для меня[a]; оно слишком высоко — мне его не постичь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Такое знание выше моего разумения; оно недосягаемо — я не могу его постичь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פלאיה
  choice: слишком дивно
  rationale: Форма выражает нечто необычайное и превосходящее человеческое разумение. «Слишком дивно» сохраняет возвышенность исходного образа и в сочетании с «для меня» передаёт недоступность этого знания псалмопевцу.
- source_word: דַעַת
  choice: знание
  rationale: Прямое значение существительного; в контексте речь идёт о Божьем знании, описанном в предыдущих стихах.
- source_word: מִמֶּנִּי
  choice: для меня
  rationale: Буквально «от меня» или «чем я»; здесь оборот указывает, что знание превосходит способность говорящего его охватить.
- source_word: נִשְׂגְּבָה
  choice: слишком высоко
  rationale: Глагол передаёт высоту, возвышенность и недоступность. Перевод сохраняет пространственную метафору, продолженную утверждением о невозможности постичь это знание.
- source_word: לֹא אוּכַל לָהּ
  choice: мне его не постичь
  rationale: 'Буквально: «я не могу [достичь] его». Русское «не постичь» естественно передаёт интеллектуальный контекст, при этом образ недосягаемости сохраняется благодаря словам «слишком высоко».'
