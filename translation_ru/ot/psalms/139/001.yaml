  yaml_path: translation/ot/psalms/139/001.yaml
  text: For the choirmaster[a]. Of David. A psalm. O Yahweh[b], you have searched me and known me.
translation:
  language: ru
  text: 'Руководителю хора[a]. Давидов[b]. Псалом.


    Яхве, Ты исследовал меня и познал меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Для руководителя хора»; еврейский предлог в надписаниях может указывать на адресата или предназначение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Давида», «для Давида»; еврейское надписание допускает связь с Давидом, авторство или посвящение.'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Термин в надписаниях псалмов обозначает руководителя музыкального исполнения. Дательный падеж естественно передаёт возможное направление или посвящение, выраженное предлогом לְ.
- source_word: לְדָוִד
  choice: Давидов
  rationale: Притяжательное прилагательное кратко и традиционно для русского надписания и не сводит гибкую конструкцию с לְ исключительно к прямому указанию на авторство.
- source_word: מִזְמוֹר
  choice: Псалом
  rationale: Стандартное русское обозначение религиозной песни, предназначенной для музыкального исполнения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного Божьего имени транслитерацией сохраняет отличие тетраграмматона от титула «Господь».
- source_word: חֲקַרְתַּנִי
  choice: Ты исследовал меня
  rationale: Глагол выражает тщательное исследование или испытание; «исследовал» сохраняет образ и звучит естественно в возвышенной современной речи.
- source_word: וַתֵּדָע
  choice: и знаешь
  rationale: Буквальная прошедшая форма «узнал» могла бы создать впечатление, будто Бог прежде не знал псалмопевца. Настоящее время естественно выражает достигнутое и сохраняющееся знание, которое раскрывается в последующих стихах.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит личное имя, а не титул; транслитерация сохраняет это различие без внесения конфессионального толкования.
- issue: Характер Божьего знания в וַתֵּדָע
  choice: и знаешь
  alternative: и узнал
  rationale: Выбрана формулировка, передающая постоянный результат совершённого исследования и не предполагающая, что Бог только приобрёл прежде отсутствовавшее знание.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом псалма. Заголовок отделён от основного текста. Местоимение «Ты» написано с прописной буквы как уважительная русская издательская норма; это не добавляет отдельного богословского утверждения.
