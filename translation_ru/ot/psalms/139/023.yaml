  text: חָקְרֵ֣/נִי אֵ֭ל וְ/דַ֣ע לְבָבִ֑/י בְּ֝חָנֵ֗/נִי וְ/דַ֣ע שַׂרְעַפָּֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/023.yaml
  text: Search me[a], God, and know my heart; test me and know my anxious thoughts.
translation:
  language: ru
  text: Исследуй меня, Боже, и узнай моё сердце; испытай меня и узнай мои тревожные мысли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мои беспокоящие мысли»; или: «мои раздвоенные мысли».'
    reason: Лексема שַׂרְעַפָּי допускает оттенки тревоги, внутреннего смятения и раздвоенности; контекст не позволяет окончательно выбрать только один из них.
lexical_decisions:
- source_word: חָקְרֵנִי
  choice: Исследуй меня
  rationale: Глагол חקר означает тщательно исследовать, проникать в суть. «Исследуй меня» естественно передаёт просьбу о глубоком Божьем испытующем знании и не смешивается со следующим глаголом «испытай».
- source_word: אֵל
  choice: Боже
  rationale: אֵל здесь является прямым обращением. Русская звательная форма «Боже» ясно и естественно передаёт эту функцию.
- source_word: וְדַע
  choice: и узнай
  rationale: Императив ידע просит Бога полностью познать внутренний мир молящегося. «Узнай» сохраняет прямое значение и намеренный повтор во второй половине стиха.
- source_word: לְבָבִי
  choice: моё сердце
  rationale: לֵבָב обозначает внутреннего человека, включая мысли, намерения и волю. Традиционное и понятное «сердце» сохраняет образность и широту значения.
- source_word: בְּחָנֵנִי
  choice: испытай меня
  rationale: בחן выражает проверку качества, подобную испытанию металла. «Испытай меня» сохраняет оценочный оттенок и отличается от «исследуй меня».
- source_word: שַׂרְעַפָּי
  choice: мои тревожные мысли
  rationale: שַׂרְעַפִּים может обозначать беспокоящие, смятенные или раздвоенные размышления. «Тревожные мысли» естественно звучит по-русски и хорошо соответствует контексту, а подлинная лексическая неоднозначность отмечена в сноске.
theological_decisions:
- issue: Язык внутренней жизни человека
  choice: Сохранены разные выражения «сердце» и «тревожные мысли».
  alternative: Свести оба понятия к словам «разум» и «мысли» либо «внутренний мир» и «мысли».
  rationale: В еврейском тексте параллельно употреблены два разных обозначения внутренней жизни. Их разграничение сохраняет поэтическую глубину и не сводит библейское представление о человеке к одной современной психологической категории.
translation_notes:
  register: Современный литературный русский язык с молитвенно-поэтическим достоинством. Синтаксический параллелизм и повтор «узнай» сохранены. Местоимение «моё» употреблено для естественного русского ритма; форма «Боже» передаёт прямое обращение.
