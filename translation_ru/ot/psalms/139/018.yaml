  yaml_path: translation/ot/psalms/139/018.yaml
  text: If I were to count them[a], they would be more than the sand. When I awake[b], I am still with you.
translation:
  language: ru
  text: Если бы я стал их считать[a], их было бы больше, чем песчинок. Пробуждаюсь[b] — и всё ещё с Тобой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Стану считать их — их больше, чем песчинок». Еврейская фраза кратка и допускает несколько вариантов синтаксической передачи.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я пробудился — и всё ещё с Тобой». Еврейский текст не уточняет однозначно, говорится ли о повторяющемся пробуждении, о только что совершившемся действии или об образном пробуждении.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶסְפְּרֵם
  choice: Если стану считать их
  rationale: Форма глагола ספר в Qal, 1-е лицо единственного числа, с местоименным суффиксом 3-го лица множественного числа буквально означает «я считаю их». В контексте она естественно вводит условную попытку перечисления.
- source_word: מֵחוֹל יִרְבּוּן
  choice: их окажется больше, чем песчинок
  rationale: Предлог מ־ выражает сравнение, а רבה — многочисленность или превосходство по числу. «Песчинок» естественно передаёт исчисляемый смысл сравнения, не меняя образ песка.
- source_word: הֱקִיצֹתִי
  choice: Когда я пробуждаюсь
  rationale: Глагол означает «пробуждаться». Хотя еврейская форма может быть понята как завершённое «я пробудился», контекст допускает временное или повторяющееся значение; основной текст сохраняет плавный поэтический переход, а неоднозначность отмечена в сноске.
- source_word: וְעוֹדִי עִמָּךְ
  choice: я всё ещё с Тобой
  rationale: עוֹד с суффиксом выражает продолжающееся состояние — «я всё ещё», а עִמָּךְ прямо означает «с Тобой». Русская связка подразумевается естественным образом.
theological_decisions:
- issue: К чему относится местоимение «их»
  choice: Сохранено местоимение, которое по ближайшему контексту относится к Божьим мыслям из предыдущего стиха.
  alternative: Можно было раскрыть связь словами «Твои мысли» или понимать местоимение шире — как Божьи замыслы и дела.
  rationale: Еврейский текст использует местоименный суффикс и не повторяет существительное. Его сохранение передаёт связь с предыдущим стихом, не добавляя в этот стих отсутствующих слов.
- issue: Смысл пробуждения и пребывания с Богом
  choice: Строка передаёт продолжающееся пребывание псалмопевца с Богом при пробуждении.
  alternative: Её можно понимать как пробуждение после сна; иногда в ней усматривают намёк на пробуждение после смерти, однако это прямо не выражено.
  rationale: Перевод не вводит идею воскресения, которой сам стих однозначно не утверждает, и сохраняет временную неоднозначность глагольной формы в сноске.
translation_notes:
  register: Современный литературный русский язык с простым, возвышенным поэтическим строем. Обращение к Богу оформлено традиционным прописным «Тобой». Слово «песчинок» выбрано ради естественного количественного сравнения; образ песка сохранён.
