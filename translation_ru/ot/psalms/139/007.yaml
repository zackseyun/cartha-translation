lexical_decisions:
- source_word: אָ֭נָה
  choice: Куда
  rationale: Вопросительное наречие направления; «куда» естественно передаёт вопрос о возможном месте назначения.
- source_word: אֵלֵךְ
  choice: уйду
  rationale: Имперфект 1-го лица ед. числа от הלך в риторическом вопросе; «уйду» естественно сочетается с «от» и передаёт невозможность удалиться.
- source_word: מֵ/רוּחֶ֑/ךָ
  choice: от Твоего Духа
  rationale: רוּחַ может означать дух, ветер или дыхание, но параллелизм с Божьим присутствием и контекст псалма указывают на личное Божественное присутствие; прописная буква отражает отнесённость к Богу.
- source_word: וְ֝/אָ֗נָה
  choice: Куда
  rationale: Повтор вопросительного слова образует вторую параллельную строку. В русском отдельный вопрос без начального «и» звучит естественно и сохраняет поэтический параллелизм.
- source_word: מִ/פָּנֶ֥י/ךָ
  choice: от Твоего присутствия
  rationale: Буквально «от Твоего лица», но здесь פָּנִים идиоматически обозначает личное присутствие.
- source_word: אֶבְרָֽח
  choice: убегу
  rationale: Имперфект 1-го лица ед. числа от ברח, «бежать, спасаться бегством»; «убегу» сохраняет образ попытки скрыться, не добавляя значения успешного избавления.
theological_decisions:
- issue: Следует ли передавать רוּחַ безлично («ветер», «дыхание») или как личное обозначение Божьего Духа
  choice: Твоего Духа
  alternative: Твоего ветра / Твоего дыхания
  rationale: Параллель с «Твоим присутствием» и тема неотвратимого Божьего присутствия в Псалме 139 поддерживают личное значение, при этом лексическая многозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким поэтическим параллелизмом. Обращённые к Богу местоимения написаны с прописной буквы в соответствии с принятым достоинственным регистром; архаические «куда пойду я» и «от лица Твоего» не используются.
