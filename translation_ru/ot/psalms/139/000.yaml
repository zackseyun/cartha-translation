  yaml_path: translation/ot/psalms/139/000.yaml
  text: For the choirmaster[a]. Of David. A psalm. Yahweh[b], you have searched me and known me.
translation:
  language: ru
  text: 'Руководителю хора.[a] Псалом Давида.[b]


    Яхве,[c] Ты исследовал меня и узнал меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Начальнику хора». Еврейский предлог может указывать на адресата или посвящение заголовка.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Псалом, посвящённый Давиду»; еврейское выражение допускает авторство, посвящение или иную связь с Давидом.'
    reason: alternative_reading
  - marker: c
    text: 'Традиционно: «Господь». «Яхве» передаёт личное имя Бога יהוה.'
    reason: divine_name
lexical_decisions:
- source_word: לַמְנַצֵּחַ
  choice: Руководителю хора
  rationale: Форма с предлогом לְ допускает значение адресата или посвящения; слово מְנַצֵּחַ обозначает руководителя исполнения, а уточнение «хора» естественно передаёт традиционную функцию в заголовке псалма.
- source_word: לְדָוִד
  choice: Давида
  rationale: 'Родительный оборот сохраняет неоднозначность еврейского לְ: авторство, посвящение или связь с Давидом.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, представленное тетраграмматоном, а не заменено титулом «Господь».
- source_word: חֲקַרְתַּנִי
  choice: исследовал меня
  rationale: Глагол означает тщательное исследование или проникновенное изучение; «исследовал» сохраняет этот образ без добавления идеи испытания.
- source_word: וַתֵּדָע
  choice: и знаешь меня
  rationale: В контексте речь идёт не только о моменте узнавания, но и о состоявшемся, сохраняющемся знании; объект «меня» естественно восстанавливается из предыдущего глагола.
theological_decisions:
- issue: Передача тетраграмматона יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация отличает личное имя от титула и прямо отражает исходный текст; примечание сообщает традиционную альтернативу.
- issue: Временное значение חֲקַרְתַּנִי וַתֵּדָע
  choice: исследовал меня и знаешь меня
  alternative: исследовал меня и узнал меня
  rationale: Выбранная формулировка сохраняет совершённость исследования и настоящее, продолжающееся знание, не исключая результирующего оттенка еврейской последовательности.
translation_notes:
  register: Современный литературный русский язык с краткой формой псалмового заголовка. Обращение «Ты» написано с прописной буквы как принятая в русском религиозном письме уважительная форма. Синтаксис основного стиха сохранён простым и торжественным.
