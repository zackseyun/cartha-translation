base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/016.yaml
  text: Your eyes saw my unformed substance[a], and in your book they all were written—the days that were formed[c][b], when not one of them yet existed.
translation:
  language: ru
  text: 'Твои глаза видели мой ещё не сформировавшийся облик[a],

    и в Твоей книге все они были записаны —

    дни, что были созданы[b][c],

    когда ещё ни одного из них не было.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мой зародыш», «мой незавершённый облик». Еврейское слово обозначает нечто, что ещё не обрело завершённой формы.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен перевод: «все они были записаны в Твоей книге; дни были созданы для меня». Синтаксис еврейского текста сжат и допускает разные способы связать части фразы.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «были сформированы», «были устроены». Перевод «были предопределены» возможен как истолкование, но выражает больше, чем основное значение еврейского глагола.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּלְמִי
  choice: моё ещё не сложившееся тело
  rationale: Редкое слово גֹּלֶם обозначает нечто ещё не завершённое и не сформировавшееся. Такой перевод сохраняет телесный образ и не вводит в основной текст более узкий современный биологический термин «эмбрион».
- source_word: רָאוּ עֵינֶיךָ
  choice: Твои глаза видели
  rationale: Прямой перевод формы qatal и поэтического подлежащего «Твои глаза»; прошедшее время естественно в данном воспоминании о внутриутробном становлении.
- source_word: וְעַל סִפְרְךָ
  choice: и в Твоей книге
  rationale: Предлог עַל буквально часто означает «на», но применительно к записи в книге по-русски естественно «в книге».
- source_word: כֻּלָּם יִכָּתֵבוּ
  choice: были записаны все они
  rationale: Сохранены пассивная форма глагола и сжатое местоименное выражение оригинала; «все они» предвосхищает последующее «дни», не устраняя полностью трудность синтаксиса.
- source_word: יָמִים יֻצָּרוּ
  choice: дни, что были созданы
  rationale: Глагол יצר означает «формировать, создавать, придавать вид». «Созданы» естественно сочетается с «днями» и не усиливает смысл до богословски более определённого «предопределены».
- source_word: וְלֹא אֶחָד בָּהֶם
  choice: когда ещё ни одного из них не было
  rationale: Еврейская фраза эллиптична. Русский перевод восполняет подразумеваемое бытие дней и передаёт временной смысл контекста.
theological_decisions:
- issue: Следует ли передавать יֻצָּרוּ как сильное утверждение о предопределении дней
  choice: были созданы
  alternative: были предопределены
  rationale: Основное значение יצר — «формировать, создавать», а «предопределять» является более сильным богословским истолкованием. Основной текст сохраняет образ созидания и не разрешает сверх текста вопрос о характере Божьего замысла.
- issue: Следует ли добавлять «для меня» к описанию созданных дней
  choice: не добавлять в основной текст
  alternative: дни были созданы для меня
  rationale: Контекст ясно связывает дни с псалмопевцем, однако соответствующих слов в еврейском тексте нет. Возможное смысловое восполнение приведено лишь в примечании к трудному синтаксису.
translation_notes:
  register: Современный литературный русский язык с поэтическим, но общедоступным строем. Сохранены образ глаз Бога, книга и созидание дней; трудный еврейский синтаксис не сглажен чрезмерно. Местоимения, относящиеся к Богу, написаны с прописной буквы в соответствии с распространённой русской библейской традицией.
