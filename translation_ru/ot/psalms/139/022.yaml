  variant: modern literary Russian
source:
  edition: WLC
  text: תַּכְלִ֣ית שִׂנְאָ֣ה שְׂנֵאתִ֑י/ם לְ֝/אוֹיְבִ֗ים הָ֣יוּ לִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/022.yaml
  text: I hate them with complete hatred[a]; they have become enemies to me.
translation:
  language: ru
  text: Я ненавижу их полной ненавистью[a]; они стали мне врагами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предельной ненавистью»; или: «совершенной ненавистью».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּכְלִית
  choice: полной
  rationale: Существительное обозначает предел, завершённость или полноту и в сочетании с שִׂנְאָה усиливает значение ненависти как полной, предельной. «Полной» ясно и естественно передаёт эту силу в современном русском языке.
- source_word: שִׂנְאָה
  choice: ненавистью
  rationale: Сохранение существительного после усилительного תַּכְלִית передаёт повтор корня «ненавидеть / ненависть» и подчёркнуто сильную еврейскую конструкцию.
- source_word: שְׂנֵאתִים
  choice: Я ненавижу их
  rationale: Форма Qal perfect, 1-е лицо единственного числа с суффиксом 3-го лица множественного числа. В поэтическом контексте она выражает устойчивую нынешнюю позицию, поэтому настоящее время по-русски естественнее, чем «я возненавидел их».
- source_word: לְאוֹיְבִים
  choice: врагами
  rationale: 'Предлог לְ при היה обозначает состояние или роль, возникшие в результате: они стали для псалмопевца врагами.'
- source_word: הָיוּ לִי
  choice: они стали мне врагами
  rationale: Оборот היה + ל передан результативно и при этом идиоматично по-русски; дательный «мне» сохраняет личное отношение, выраженное לִי.
theological_decisions:
- issue: Сила осуждения, выраженного псалмопевцем
  choice: Сохранить прямое высказывание о личной ненависти, не смягчая его.
  alternative: «Я совершенно отвергаю их» или «я считаю их врагами».
  rationale: В еврейском тексте дважды используется корень со значением ненависти. Перевод должен сохранять резкость и богословское напряжение высказывания, а не подменять его объяснением или более мягким отношением.
translation_notes:
  register: Современный литературный русский язык с поэтической торжественностью. Намеренный повтор «ненавижу — ненавистью» сохраняет выразительную фигуру еврейского текста; инверсия не используется, чтобы стих оставался понятным обычному читателю.
