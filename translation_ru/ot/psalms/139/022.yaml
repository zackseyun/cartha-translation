  naturalness: «Я ненавижу их полной ненавистью» намеренно сохраняет поэтический повтор «ненавижу — ненавистью». Хотя оборот более возвышен и менее разговорен, он понятен, литературно приемлем и соответствует жанру псалма. Вторая строка естественна для современного литературного русского.
  terminology: «Ненавижу», «ненавистью» и «врагами» — точные, последовательные соответствия ключевым словам оригинала. Варианты в сноске адекватно представляют возможные оттенки תַּכְלִית, не навязывая богословского истолкования.
