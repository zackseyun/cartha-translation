lexical_decisions:
- source_word: אִם תִּקְטֹל
  choice: О, если бы Ты… убил
  rationale: Начальное אִם в этом контексте выражает не условие, а сильное пожелание; конструкция «О, если бы…» естественно передаёт оптативную силу еврейской фразы.
- source_word: אֱלוֹהַּ
  choice: Боже
  rationale: Слово употреблено как прямое обращение; русский звательный по функции оборот «Боже» сохраняет молитвенный и возвышенный регистр.
- source_word: רָשָׁע
  choice: нечестивого
  rationale: Единственное число сохранено без ненужного уточнения «человека»; в контексте оно может иметь обобщённое значение.
- source_word: אַנְשֵׁי דָמִים
  choice: кровожадные люди
  rationale: Буквально «люди кровей», то есть люди, повинные в насилии или убийстве. «Кровожадные люди» естественно и образно передаёт смысл идиомы; буквальный образ отмечен в сноске.
- source_word: סוּרוּ מֶנִּי
  choice: отойдите от меня
  rationale: Повелительная форма множественного числа выражает прямое требование удалиться; этот вариант современен и сохраняет торжественную резкость речи.
theological_decisions:
- issue: Следует ли смягчать молитвенное пожелание смерти нечестивому
  choice: 'Сохранить прямое пожелание: «если бы Ты… убил»'
  alternative: Передать как предсказание суда или смягчить до «покарал» / «разобрался с»
  rationale: Еврейский текст прямо выражает желание, чтобы Бог умертвил нечестивого. Перевод сохраняет напряжённость молитвы о возмездии и не заменяет её более приемлемой для современного читателя формулировкой.
translation_notes:
  register: Современный литературный русский с молитвенной торжественностью. Междометие «О» и обращение «Боже» передают эмоциональную силу стиха без архаизации; два восклицательных предложения сохраняют резкость пожелания и последующего повеления.
