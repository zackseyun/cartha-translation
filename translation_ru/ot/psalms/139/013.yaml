  text: כִּֽי אַ֭תָּה קָנִ֣יתָ כִלְיֹתָ֑/י תְּ֝סֻכֵּ֗/נִי בְּ/בֶ֣טֶן אִמִּֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/013.yaml
  text: For you formed my inward parts[b][a]; you wove me together in my mother’s womb.
translation:
  language: ru
  text: Ведь Ты создал мои внутренности[a], соткал меня[b] во чреве моей матери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мои почки» — древнееврейский образ глубочайшей внутренней сущности человека.'
    reason: cultural_note
  - marker: b
    text: 'Или: «укрыл меня»; еврейский глагол буквально связан с покрытием или укрытием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт причинно-пояснительную связь с предшествующей хвалой и естественно звучит в русской поэзии.
- source_word: קָנִיתָ
  choice: создал
  rationale: В данном контексте внутриутробного формирования передаёт творческое действие Бога. Сам глагол может также означать «приобрёл» или «обрёл во владение», однако эти варианты здесь звучали бы неестественно и могли бы вызвать нежелательный оттенок купли.
- source_word: כִלְיֹתַי
  choice: мои внутренности
  rationale: Буквально — «мои почки»; в древнееврейском это конкретный телесный образ глубочайшей внутренней сущности человека. «Мои внутренности» сохраняет телесность образа и остаётся понятным современному читателю.
- source_word: תְּסֻכֵּנִי
  choice: соткал меня
  rationale: Глагол סכך в основном связан с покрытием или укрытием, но в контексте материнского чрева образно указывает на искусное формирование. «Соткал меня» естественно передаёт этот смысл, а более буквальное значение отмечено в сноске.
- source_word: בְּבֶטֶן אִמִּי
  choice: во чреве моей матери
  rationale: Точно передаёт место действия и материнскую связь; слово «чрево» уместно в возвышенном поэтическом регистре и понятно современному читателю.
theological_decisions:
- issue: Передача речи о формировании до рождения без внесения позднейших доктринальных формулировок
  choice: Стих прямо утверждает личное творческое действие Бога при формировании псалмопевца во чреве матери.
  alternative: 'Более буквальное прочтение: «Ты приобрёл мои почки; Ты укрыл меня во чреве моей матери».'
  rationale: Перевод сохраняет сильное утверждение о Божьем участии в формировании человека до рождения, но не добавляет выводов и богословских формул, которых нет в самом стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Обращённое к Богу местоимение «Ты» написано с прописной буквы. Конкретный телесный образ сохранён в основном тексте как «внутренности», а буквальная форма пояснена в сноске.
