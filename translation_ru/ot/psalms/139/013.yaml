  terminology: «Внутренности» удачно удерживает телесную конкретность еврейского образа, не создавая неестественного для русского текста буквального оборота «почки». Формы обращения «Ты» и «моей матери» согласованы по регистру. Сноски стоят при соответствующих словах и содержательно соответствуют исходному тексту и английскому аудиторскому следу.
