base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/014.yaml
  text: I praise you[a], because I am fearfully and wonderfully made; wonderful are your works[b], and my soul knows it very well.
translation:
  language: ru
  text: Славлю Тебя, потому что я устроен удивительным, внушающим благоговение образом[a]. Чудесны дела Твои, и душа моя[b] очень хорошо это знает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я создан так удивительно, что это внушает благоговение». Еврейские слова передают благоговейный трепет и изумление, а не ужас.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «я сам», «всё моё существо» или «моё внутреннее существо».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹדְךָ
  choice: Славлю Тебя
  rationale: Глагол ידה в породе hифиль означает благодарить или прославлять. В контексте восхваления Божьего творческого дела «славлю» естественно передаёт доксологическую направленность, не исключая оттенка благодарности.
- source_word: עַל כִּי
  choice: потому что
  rationale: Сочетание вводит основание для хвалы; причинное значение ясно выражается современным русским оборотом.
- source_word: נוֹרָאוֹת
  choice: так, что это внушает благоговение
  rationale: Форма от ירא передаёт не ужас, а трепет и благоговейное изумление перед необычайным Божьим делом. Развёрнутый оборот избегает ошибочного смысла «страшно устроен».
- source_word: נִפְלֵיתִי
  choice: я дивно устроен
  rationale: Порода нифаль глагола פלא обозначает нечто необычайное, дивное. Глагол «устроен» подразумевается из ближайшего контекста псалма о Божьем созидании человека (ст. 13, 15–16) и делает русскую фразу естественной.
- source_word: נִפְלָאִים מַעֲשֶׂיךָ
  choice: Чудесны дела Твои
  rationale: Инверсия сохраняет поэтическое ударение исходного текста на чудесном характере Божьих дел; «дела» достаточно широко охватывает и действия, и созданное Богом.
- source_word: וְנַפְשִׁי
  choice: и душа моя
  rationale: Сохраняется поэтический образ еврейского נֶפֶשׁ; примечание указывает, что слово может обозначать самого человека или его внутреннее существо и не требует строгого противопоставления тела и души.
- source_word: יֹדַעַת מְאֹד
  choice: очень хорошо это знает
  rationale: Женская форма глагола согласована с «душа». Местоимение «это» естественно восполняет подразумеваемый объект знания — только что высказанную истину о Божьих чудесных делах и устройстве псалмопевца.
theological_decisions:
- issue: Антропологический смысл נֶפֶשׁ
  choice: В основном тексте «душа моя», с пояснением более широкого смысла в примечании.
  alternative: я сам; всё моё существо; моё внутреннее существо
  rationale: Поэтическое «душа моя» сохраняет образ исходного текста, однако примечание предотвращает привнесение обязательного дуалистического понимания, которого еврейское слово само по себе не требует.
- issue: Синтаксическая неоднозначность נוֹרָאוֹת נִפְלֵיתִי
  choice: «я дивно устроен — так, что это внушает благоговение»
  alternative: «я дивен и внушаю благоговение»; «я устроен удивительным, внушающим благоговение образом»
  rationale: Перевод учитывает контекст Божьего формирования человека и одновременно сохраняет два смысловых компонента — необычайность и благоговейный трепет, не превращая ירא в обычный страх.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Инверсия «Чудесны дела Твои» отражает акцент еврейского текста; прописные формы местоимений при обращении к Богу поддерживают традиционный русский библейский регистр без конфессиональной спецификации.
