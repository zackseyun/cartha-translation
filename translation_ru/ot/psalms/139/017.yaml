id: PSA.139.17
reference: Psalms 139:17
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/לִ֗/י מַה יָּקְר֣וּ רֵעֶ֣י/ךָ אֵ֑ל מֶ֥ה עָ֝צְמוּ רָאשֵׁי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/017.yaml
  text: And to me[a], how precious are your thoughts, O God[b]; how vast is the sum of them!
translation:
  language: ru
  text: А как драгоценны мне Твои мысли[a], Боже! Как велико их число[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Твои друзья» либо «те, кто дорог Тебе». Еврейскую форму רֵעֶיךָ можно понять и так, однако упоминание счёта и огромного множества в ст. 17–18 говорит в пользу перевода «Твои мысли».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «их головы». Здесь это выражение, вероятно, означает их общее число или совокупность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִי
  choice: А … мне
  rationale: Союз וְ сохраняет связь с предыдущим контекстом, а לִי передаёт подчёркнутую личную перспективу псалмопевца. Такая конструкция естественна для современной русской поэтической речи.
- source_word: מַה יָּקְרוּ
  choice: как драгоценны
  rationale: מַה употреблено в восклицательном значении «как», а יקר выражает высокую ценность и дороговизну; «драгоценны» сохраняет и смысл, и благоговейный тон.
- source_word: רֵעֶיךָ
  choice: Твои мысли
  rationale: Форма допускает понимание «Твои друзья / дорогие Тебе», однако продолжение о неисчислимом множестве в ст. 18 лучше согласуется со значением «мысли».
- source_word: אֵל
  choice: Боже
  rationale: Божественное имя здесь является обращением; русский звательный эквивалент «Боже» ясно передаёт прямую речь к Богу.
- source_word: מֶה עָצְמוּ
  choice: как велико
  rationale: Второе מֶה вводит восклицание, а עצם здесь указывает на огромную величину или многочисленность, что подтверждается образом счёта в следующем стихе.
- source_word: רָאשֵׁיהֶם
  choice: их число
  rationale: Буквально «их головы»; в данном контексте выражение обозначает совокупность или итоговое число. «Их число» естественно по-русски и подготавливает упоминание счёта в ст. 18.
theological_decisions:
- issue: Значение רֵעֶיךָ
  choice: Твои мысли
  alternative: Твои друзья; те, кто дорог Тебе
  rationale: Контекст ст. 17–18 говорит о попытке сосчитать это множество и тем самым преимущественно поддерживает абстрактное значение «мысли». Альтернативное лексическое прочтение не устраняется и отмечено в сноске, без навязывания более узкого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной поэтической интонацией. Заглавные местоимения при обращении к Богу сохранены как традиционная русская издательская норма; смысловой неоднозначности они не добавляют.
