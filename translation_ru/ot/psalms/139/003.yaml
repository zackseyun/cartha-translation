- source_word: כָל
  choice: все
  rationale: Передаёт полноту и всеохватность знания.
- source_word: דְּרָכַי
  choice: мои дороги
  rationale: Сохраняет пространственную метафору и одновременно допускает переносный смысл поступков и образа жизни.
- source_word: הִסְכַּנְתָּה
  choice: знаком
  rationale: Передаёт глубокую осведомлённость и привычное знание без добавления отвлечённой доктринальной формулировки.
theological_decisions:
- issue: Антропоморфный образ Божьего знания
  choice: Сохранить образы просеивания, пути и дорог, выражая всеохватное знание Бога без доктринального расширения.
  alternative: 'Сгладить образность: «Ты исследуешь… и знаешь все мои пути».'
  rationale: Еврейский стих передаёт близкое и тщательное знание через конкретные образы. Их сохранение удерживает поэтическое напряжение между повседневным человеческим действием и Божьим знанием.
