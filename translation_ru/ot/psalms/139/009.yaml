  text: If I take up the wings of the dawn[a], if I dwell in the farthest part of the sea,
translation:
  language: ru
  text: 'Если я подниму крылья зари,

    если поселюсь на самом краю моря[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на крайнем западе»; в древнееврейской поэтической географии «море» могло обозначать запад.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶשָּׂא
  choice: возьму
  rationale: Глагол נשׂא означает «поднимать, нести, брать». В сочетании с «крыльями зари» русское «возьму» сохраняет образ обретения крыльев и не добавляет прямо не выраженного в тексте глагола «взлечу».
- source_word: כַנְפֵי
  choice: крылья
  rationale: Основное значение כנף — «крыло»; здесь оно создаёт яркий поэтический образ стремительно распространяющейся зари.
- source_word: שָׁחַר
  choice: заря
  rationale: שׁחר обозначает рассвет, зарю. «Заря» естественно сочетается с образом крыльев и соответствует поэтическому регистру псалма.
- source_word: אֶשְׁכְּנָה
  choice: поселюсь
  rationale: Форма от שכן может значить «обитать, поселяться». «Поселюсь» хорошо передаёт предполагаемое перемещение в отдалённое место, тогда как «буду обитать» звучало бы здесь тяжелее.
- source_word: בְּאַחֲרִית
  choice: на самом краю
  rationale: אַחֲרִית здесь имеет пространственное значение предела или крайней области. «На самом краю» естественно передаёт предельную удалённость.
- source_word: יָם
  choice: моря
  rationale: Основное значение יָם — «море». В поэтической географии Израиля слово также могло указывать на запад, что отмечено в сноске без замены конкретного образа в основном тексте.
