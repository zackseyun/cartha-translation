source:
  edition: WLC
  text: כִּ֤י אֵ֣ין מִ֭לָּה בִּ/לְשׁוֹנִ֑/י הֵ֥ן יְ֝הוָ֗ה יָדַ֥עְתָּ כֻלָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/psalms/139/004.yaml
  text: For there is not a word on my tongue—behold[a], O Yahweh, you know it altogether.
translation:
  language: ru
  text: Ведь ещё нет слова на моём языке — вот[a], Яхве, Ты уже знаешь его целиком.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поистине, Яхве, Ты знаешь его целиком».'
    reason: Частица הֵן может не только привлекать внимание («вот»), но и усиливать утверждение («поистине», «действительно»).
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит основание для предшествующей мысли; «ведь» естественно передаёт пояснительную связь в современном русском языке.
- source_word: אֵין מִלָּה
  choice: ещё нет слова
  rationale: אֵין выражает отсутствие, а единственное число מִלָּה передано как «слово». «Ещё» делает понятным подразумеваемый контекст слова, пока не произнесённого, не меняя основного смысла.
- source_word: בִּלְשׁוֹנִי
  choice: на моём языке
  rationale: Сохранён телесный образ еврейского выражения; русский предлог «на» здесь идиоматичен и не заменяет «язык» словом «уста».
- source_word: הֵן
  choice: но вот
  rationale: הֵן — частица привлечения внимания и усиления. «Но вот» передаёт её выразительную силу и одновременно естественно связывает две части русской строки; возможное значение «поистине» отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: יָדַעְתָּ
  choice: Ты уже знаешь
  rationale: Перфект глагола знания имеет здесь статальное значение уверенного, полного знания. «Уже» естественно выявляет временное противопоставление ещё не произнесённому слову.
- source_word: כֻלָּהּ
  choice: его целиком
  rationale: Местоименный суффикс относится к слову מִלָּה; перевод выражает исчерпывающее знание всего слова. Русское «его» согласуется с существительным «слово».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, поэтому транслитерация сохраняет различие между именем и титулом без добавления конфессионального толкования.
- issue: Характер Божьего знания непроизнесённого слова
  choice: Ты уже знаешь его целиком
  alternative: Ты знаешь всё это
  rationale: Перевод сохраняет утверждение о полном знании конкретного слова и не уточняет сверх текста способ этого знания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Порядок слов остаётся естественным; образ «на языке» и личное имя Яхве сохранены. Корреляция «ещё — уже» ясно передаёт подразумеваемую временную перспективу строки.
