  text: Ибо верной любви[a] Я желаю, а не жертвы, и знания Бога — больше, чем всесожжений[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «милости», «преданной любви». Еврейское חֶסֶד может обозначать милость, неизменную любовь и верность отношениям завета.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от всесожжений»; здесь предлог выражает сравнение: «больше, чем всесожжений» или «скорее, чем всесожжений».'
