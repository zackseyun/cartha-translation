lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание предыдущего обличения; «ибо» естественно передаёт пояснительно-причинную связь и сохраняет достоинство пророческой речи.
- source_word: חֶסֶד
  choice: милости
  rationale: В данном контексте слово обозначает милосердную и верную любовь, включая верность отношениям завета. «Милость» естественна по-русски и соответствует традиционному пониманию стиха, а примечание сохраняет более широкий смысл еврейского термина.
- source_word: חָפַצְתִּי
  choice: Я желаю
  rationale: Глагол выражает желание и благоволение; эта передача ясна в прямой речи Бога и хорошо сочетается с противопоставлением жертве.
- source_word: זָבַח
  choice: жертвы
  rationale: Общий термин для жертвоприношения; единственное число сохраняет форму еврейского текста и противопоставляется более конкретным всесожжениям.
- source_word: דַעַת אֱלֹהִים
  choice: знания Бога
  rationale: Сохраняет именную конструкцию и поэтический параллелизм. Здесь подразумевается не только осведомлённость, но и подлинное, основанное на отношениях познание Бога.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: Это общее обозначение Бога Израиля, а не тетраграмматон; поэтому передаётся словом «Бог», а не «Господь».
- source_word: מֵעֹלוֹת
  choice: больше, чем всесожжений
  rationale: Предлог מִן в этой сравнительной конструкции выражает предпочтение. Такая передача сохраняет сравнительный смысл и не превращает пророческое противопоставление в однозначную отмену жертв.
- source_word: עֹלוֹת
  choice: всесожжений
  rationale: Стандартный русский культовый термин для жертв, целиком сжигаемых на жертвеннике.
theological_decisions:
- issue: Отвергается ли жертвоприношение безусловно или ему противопоставляется более важное
  choice: 'Сохранено резкое отрицание в первой строке и сравнительное предпочтение во второй: милость и знание Бога важнее ритуальных жертв.'
  alternative: Понимать стих как безусловное отрицание всей системы жертвоприношений.
  rationale: В первой части стоит прямое «не», тогда как во второй предлог מִן допускает сравнение «больше, чем». Перевод сохраняет эту напряжённость и не сглаживает пророческую риторику, но также не утверждает полной отмены жертв.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом пророческой речи. Сохранены параллелизм двух строк, прямое божественное «Я» и различие между общей жертвой и всесожжениями.
