  - severity: low
    issue: «Перевяжет наши раны» заменяет прямой объект оригинала («нас») на эксплицированные «раны».
    rationale: Глагол חבש в этом контексте действительно относится к перевязыванию ран, однако суффикс -נוּ обозначает сам народ. «Перевяжет нас» точнее сохраняет исходную метафору и остаётся понятным благодаря контексту.
