  text: לְכוּ֙ וְ/נָשׁ֣וּבָה אֶל יְהוָ֔ה כִּ֛י ה֥וּא טָרָ֖ף וְ/יִרְפָּאֵ֑/נוּ יַ֖ךְ וְ/יַחְבְּשֵֽׁ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/001.yaml
  text: Come[a], let us return to Yahweh, for he has torn us, but he will heal us; he has struck us[b], but he will bind us up.
translation:
  language: ru
  text: Пойдём, вернёмся к Яхве, ведь Он растерзал нас, но исцелит нас; Он поразил нас, но перевяжет нас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально союзы можно передать: «и Он исцелит нас… и Он перевяжет нас».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ וְנָשׁוּבָה
  choice: Пойдём, вернёмся
  rationale: Императив לְכוּ здесь вводит совместный призыв, а когортатив וְנָשׁוּבָה выражает общее намерение. «Пойдём, вернёмся» естественно передаёт оба глагола и движение обратно к Яхве.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל обозначает направленность, а тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание для призыва; «ведь» ясно и естественно связывает увещание с последующим объяснением.
- source_word: טָרָף
  choice: растерзал нас
  rationale: Глагол обозначает разрывание добычи хищником. «Растерзал» сохраняет силу и зооморфный оттенок образа; объект «нас» восстанавливается из параллельных суффиксов.
- source_word: וְיִרְפָּאֵנוּ
  choice: но Он же исцелит нас
  rationale: Формально וְ означает «и», однако противопоставление суда и восстановления естественно выражается по-русски союзом «но»; частица «же» подчёркивает, что исцеляет Тот же, кто растерзал.
- source_word: יַךְ
  choice: Он поразил нас
  rationale: Несмотря на форму yiqtol, поэтический параллелизм с предшествующим перфектом позволяет понимать действие как уже совершившийся удар. «Поразил» сохраняет образ нанесённого Богом удара без архаизма.
- source_word: וְיַחְבְּשֵׁנוּ
  choice: но Он же перевяжет наши раны
  rationale: חבש в данном контексте означает перевязывать или обвязывать рану. Развёрнутое выражение естественно для современного русского и ясно сохраняет лечебную метафору.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное covenantное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Временная соотнесённость суда и восстановления
  choice: Суд передан как уже совершившийся, а исцеление — как ожидаемое будущее
  alternative: 'Передать יַךְ как будущее: «Он поразит»; либо истолковать все действия в одной временной плоскости'
  rationale: 'Параллелизм связывает טָרָף и יַךְ как пережитое наказание, а формы исцеления и перевязывания выражают надежду на восстановление. Это сохраняет напряжение: Бог и наносит рану, и исцеляет.'
- issue: Связь между нанесением раны и исцелением
  choice: «но Он же»
  alternative: Буквальное соединение «и Он»
  rationale: Еврейский waw допускает простое «и», однако русский противительный союз яснее передаёт контраст параллельных строк. Частица «же» не вводит нового действующего лица, а подчёркивает тождество субъекта.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но не архаичной интонацией. Сохранены резкий образ растерзания, совместный призыв к возвращению и контраст между Божьим судом и исцелением.
