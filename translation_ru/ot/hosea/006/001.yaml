revisions:
- from: Пойдём, вернёмся к Яхве, ведь Он растерзал нас, но Он же исцелит нас; Он поразил нас, но Он же перевяжет наши раны.[a]
  to: Пойдём, вернёмся к Яхве, ведь Он растерзал нас, но исцелит нас; Он поразил нас, но перевяжет нас.[a]
  rationale: Убрана необязательная усилительная частица «же» и восстановлен прямой объект последнего еврейского глагола. Противительный «но» сохранён как естественная русская передача контраста между судом и восстановлением; примечание прозрачно отмечает буквальное «и».
