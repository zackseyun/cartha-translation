  text: וְ/הֵ֕מָּה כְּ/אָדָ֖ם עָבְר֣וּ בְרִ֑ית שָׁ֖ם בָּ֥גְדוּ בִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/007.yaml
  text: But they[a], like Adam, transgressed the covenant; there they dealt faithlessly with me.
translation:
  language: ru
  text: Но они, подобно Адаму[a], преступили завет; там они вероломно поступили со Мною.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подобно человеку»; возможно также: «подобно людям (человечеству)». Еврейское אָדָם может обозначать как Адама лично, так и человека или человечество вообще.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Но они
  rationale: Местоимение имеет эмфатический оттенок, а союз в контексте выражает противопоставление предыдущему описанию.
- source_word: כְּאָדָם
  choice: подобно Адаму
  rationale: אָדָם может быть именем Адам либо обозначать человека или человечество. В основном тексте сохранено вероятное указание на Адама, а подлинная неоднозначность отмечена в сноске.
- source_word: עָבְרוּ
  choice: преступили
  rationale: В сочетании с «завет» глагол означает нарушение установленных границ и обязательств; «преступили завет» сохраняет смысл и библейскую весомость выражения.
- source_word: בְרִית
  choice: завет
  rationale: Контекст указывает на конкретные заветные отношения с Богом; русское существительное не требует отдельного показателя определённости.
- source_word: שָׁם
  choice: там
  rationale: Сохранено прямое пространственное значение наречия без уточнения подразумеваемого места.
- source_word: בָּגְדוּ
  choice: поступили вероломно
  rationale: Глагол обозначает измену доверию и заветную неверность; этот вариант естественен по-русски и передаёт силу исходного слова.
- source_word: בִי
  choice: со Мною
  rationale: При глаголе בגד предлог обозначает лицо, по отношению к которому проявлена неверность; по-русски естественно «поступить вероломно с кем-либо».
theological_decisions:
- issue: Толкование כְּאָדָם в контексте завета
  choice: подобно Адаму
  alternative: подобно человеку; подобно людям/человечеству
  rationale: Еврейское אָדָם допускает как личное имя, так и родовое обозначение человека. Основной вариант сохраняет возможную связь с первичным нарушением завета Адамом, но альтернативное понимание вынесено в сноску, чтобы не устранять неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формулировка «преступили завет» сохраняет библейскую и заветную окраску, а «поступили со Мною вероломно» ясно передаёт личную измену Богу. Местоимение «Мною» написано с прописной буквы согласно распространённой русской библейской издательской традиции.
