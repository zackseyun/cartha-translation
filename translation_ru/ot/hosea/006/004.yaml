base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/004.yaml
  text: What shall I do with you[a], Ephraim? What shall I do with you, Judah? Your loyalty is like a morning cloud, and like dew that goes away early.
translation:
  language: ru
  text: Что Мне делать с тобой, Ефрем? Что Мне делать с тобой, Иуда? Ваша верность[a] — как утреннее облако и как роса, которая рано исчезает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преданная любовь» или «неизменная любовь». Еврейское слово חֶסֶד означает любовь, соединённую с верностью и преданностью в отношениях завета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶעֱשֶׂה לְךָ
  choice: Что Мне делать с тобой
  rationale: Риторический вопрос выражает огорчение и недоумение Бога, а не простой запрос о будущем действии; русская формулировка естественно передаёт эту силу.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено традиционное русское написание имени; здесь Ефрем олицетворяет северное царство.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Сохранено традиционное русское написание имени; в параллели с Ефремом оно обозначает южное царство.
- source_word: חַסְדְּכֶם
  choice: ваша верность
  rationale: Слово חֶסֶד соединяет значения любви, преданности и верности в отношениях. «Верность» кратко и естественно передаёт упрёк в её непостоянстве, а смысловая широта отмечена в сноске.
- source_word: כַּעֲנַן בֹּקֶר
  choice: как утреннее облако
  rationale: Сохранён буквальный образ облака, которое появляется утром и быстро рассеивается.
- source_word: וְכַטַּל מַשְׁכִּים הֹלֵךְ
  choice: как роса, что рано исчезает
  rationale: «Исчезает» естественно передаёт здесь הֹלֵךְ — буквально «уходит»; «рано» отражает מַשְׁכִּים и подчёркивает быстротечность росы.
theological_decisions:
- issue: Передача חֶסֶד в пророческом контексте отношений завета
  choice: верность
  alternative: преданная любовь; неизменная любовь
  rationale: Перевод не сводит חֶסֶד только к чувству любви и сохраняет центральный для упрёка смысл преданности Богу. При этом сноска удерживает присущую слову связь любви и верности, не вставляя слово «завет» непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык; обращение прямое и эмоционально сдержанное. Заглавная буква в «Мне» следует принятой русской библейской практике для местоимения, относящегося к Богу. Параллелизм и два образа быстротечности сохранены.
