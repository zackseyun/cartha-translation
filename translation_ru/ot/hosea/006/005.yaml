source:
  edition: WLC
  text: עַל כֵּ֗ן חָצַ֨בְתִּי֙ בַּ/נְּבִיאִ֔ים הֲרַגְתִּ֖י/ם בְּ/אִמְרֵי פִ֑/י וּ/מִשְׁפָּטֶ֖י/ךָ א֥וֹר יֵצֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/005.yaml
  text: Therefore I have hewn them by the prophets; I have slain them by the words of my mouth[a], and my judgments go forth like light.
translation:
  language: ru
  text: Поэтому Я рубил их через пророков, убивал их словами Моих уст, и твои суды выходят, словно свет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст с огласовкой: «твои суды». По контексту некоторые понимают: «Мой суд выходит, словно свет».'
    reason: Сохраняет трудное чтение масоретского текста и сообщает распространённую контекстуальную альтернативу.
lexical_decisions:
- source_word: עַל כֵּן
  choice: Поэтому
  rationale: Передаёт следствие из предшествующего обличения кратко и естественно.
- source_word: חָצַבְתִּי
  choice: рубил
  rationale: Сохраняет резкий образ рубки или высекания, не сводя его однозначно ни к уничтожению, ни к формированию.
- source_word: בַּנְּבִיאִים
  choice: через пророков
  rationale: 'Предлог ב понят инструментально: пророки выступают средством Божьего действия.'
- source_word: הֲרַגְתִּים
  choice: убивал их
  rationale: Прямо передаёт силу глагола הרג и сохраняет суровость пророческой речи.
- source_word: בְּאִמְרֵי פִי
  choice: словами Моих уст
  rationale: Сохраняет конкретный образ Божьей речи и возвышенный поэтический строй.
- source_word: וּמִשְׁפָּטֶיךָ
  choice: и твои суды
  rationale: Следует огласованному масоретскому тексту с суффиксом второго лица мужского рода единственного числа и сохраняет трудность прямого обращения.
- source_word: אוֹר
  choice: словно свет
  rationale: Явно выражает подразумеваемое по смыслу сравнение, естественное для русского языка.
- source_word: יֵצֵא
  choice: выходят
  rationale: Передаёт образ выхода, явления или обнаружения; множественное число в русском согласовано с «суды», тогда как еврейский глагол стоит в единственном числе.
theological_decisions:
- issue: Лицо притяжательного суффикса в וּמִשְׁפָּטֶיךָ
  choice: твои суды
  alternative: Мой суд
  rationale: Огласованный масоретский текст имеет суффикс «твои» и обращён к Израилю во втором лице. Контекст речи от первого лица побуждает некоторых толкователей понимать или исправлять выражение как «Мой суд», однако эту альтернативу следует отметить, а не подменять ею основной текст.
- issue: Смысл метафоры חצב
  choice: рубил
  alternative: обтёсывал; высекал; поражал
  rationale: Метафора допускает оттенки рубки, отсечения и обработки. Перевод не уточняет богословски, идёт ли речь только о наказании или также о формировании народа.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. Сохранены резкие параллельные глаголы и конкретный образ «слов Моих уст»; трудное «твои суды» не сглажено.
