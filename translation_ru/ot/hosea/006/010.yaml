source:
  edition: WLC
  text: בְּ/בֵית֙ יִשְׂרָאֵ֔ל רָאִ֖יתִי שעריריה שָׁ֚ם זְנ֣וּת לְ/אֶפְרַ֔יִם נִטְמָ֖א יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/010.yaml
  text: 'In the house of Israel I have seen a horrible thing: there is prostitution in Ephraim[c][b][a]; Israel has defiled itself.'
translation:
  language: ru
  text: 'В доме Израиля я увидел нечто ужасное[a]: там — блуд Ефрема[b]; Израиль осквернился[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечто чудовищное». Еврейское слово обозначает нечто потрясающее, гнусное или возмутительное.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «там у Ефрема — блуд»; возможно также: «там Ефрем предаётся блуду». Еврейская фраза очень сжата, а предлог при имени Ефрема допускает несколько способов передачи связи.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «Израиль осквернён»; или: «Израиль стал нечист».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּבֵית יִשְׂרָאֵל
  choice: В доме Израиля
  rationale: Сохраняется образ Израиля как дома, то есть народа и семьи завета; перевод «в Израиле» неоправданно сгладил бы этот образ.
- source_word: רָאִיתִי
  choice: я увидел
  rationale: Форма первого лица единственного числа передана простым прошедшим временем, естественным для русского пророческого повествования.
- source_word: שעריריה
  choice: нечто ужасное
  rationale: Слово обозначает нечто потрясающее своей гнусностью или чудовищностью; выбранный вариант ясен современному читателю и передаёт сильное нравственное отвращение.
- source_word: שָׁם
  choice: там
  rationale: Наречие явно сохранено и отсылает к только что названному дому Израиля.
- source_word: זְנוּת
  choice: блуд
  rationale: «Блуд» сохраняет сексуальный образ и одновременно допускает характерный для Осии смысл неверности завету, не сводя выражение только к проституции как занятию.
- source_word: לְאֶפְרַיִם
  choice: Ефрема
  rationale: Родительный оборот кратко передаёт принадлежность или характерную связь, выраженную неоднозначным לְ, и сохраняет сжатость еврейской фразы.
- source_word: נִטְמָא
  choice: осквернился
  rationale: Возвратная форма естественно передаёт наступившее состояние нечистоты и возможный оттенок причастности Израиля к собственному осквернению.
theological_decisions:
- issue: Обозначает ли זְנוּת буквальный половой грех, идолопоклонство или общую неверность завету
  choice: блуд
  alternative: проституция; разврат; неверность
  rationale: Перевод сохраняет намеренно резкий брачно-половой образ Осии и не устраняет возможность одновременно буквального и метафорического смысла.
- issue: Следует ли понимать נִטְמָא как состояние, наступление состояния или самоосквернение
  choice: осквернился
  alternative: осквернён; стал нечист
  rationale: Основной текст естественно передаёт результат и возможную ответственность Израиля, а примечание сохраняет грамматически допустимые пассивное и инхоативное прочтения.
- issue: Как выразить неоднозначное отношение לְאֶפְרַיִם к существительному זְנוּת
  choice: блуд Ефрема
  alternative: блуд у Ефрема; Ефрем предаётся блуду
  rationale: Сжатый родительный оборот не уточняет сверх исходного текста, идёт ли речь прежде всего о принадлежности, местонахождении или действующем лице.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Традиционно-библейское слово «блуд» сохранено ради центрального образа Осии, но архаические синтаксические формы устранены. Местоимение первого лица написано со строчной буквы по обычной современной русской орфографии.
