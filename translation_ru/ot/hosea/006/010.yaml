  source_fidelity: 'Перевод точно передаёт структуру и смысл еврейского текста: בְּבֵית יִשְׂרָאֵל — «В доме Израиля», רָאִיתִי — «я увидел», שַׁעֲרוּרִיָּה — «нечто ужасное», שָׁם — «там», זְנוּת לְאֶפְרַיִם — «блуд Ефрема», נִטְמָא יִשְׂרָאֵל — «Израиль осквернился». Родительный оборот «блуд Ефрема» уместно сохраняет сжатость и неоднозначность отношения, выраженного לְ. «Осквернился» адекватно передаёт Niphal, не вынуждая выбирать между статическим, инхоативным и рефлексивно-ответственным оттенками.'
  naturalness: Текст звучит естественно в современном литературном русском, сохраняя лаконичный и напряжённый пророческий ритм. Тире после «там» интонационно оправдано. Слово «блуд» несколько традиционно-библейское, но остаётся понятным современному читателю и здесь функционально важно как носитель сексуально-брачной метафоры Осии.
  terminology: «Дом Израиля», «Ефрем» и «Израиль» последовательно сохранены как различимые обозначения исходного текста. «Блуд» не сужает זְנוּת до профессиональной проституции и не заменяет образ Осии отвлечённой «неверностью». Примечания корректно фиксируют значимые лексические и синтаксические варианты; их маркеры стоят у соответствующих элементов текста.
