base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/009.yaml
  text: And like men lying in wait[a], a band of priests murders on the way to Shechem; indeed[b], they have committed wickedness.
translation:
  language: ru
  text: И как разбойники подстерегают человека[a], так шайка священников убивает на пути в Сихем; поистине, они совершили злодеяние[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст труден. Возможно также: «И словно люди, сидящие в засаде, шайка священников убивает на пути в Сихем».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «постыдное преступление», «мерзость». Еврейское слово обозначает гнусный, возмутительный поступок или умысел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְחַכֵּי אִישׁ גְּדוּדִים
  choice: И как разбойники подстерегают человека
  rationale: Еврейское начало синтаксически трудно и допускает разные разборы. Этот вариант сохраняет образ разбойничьей засады и явным образом передаёт אִישׁ как объект, не скрывая альтернативу в примечании.
- source_word: חֶבֶר כֹּהֲנִים
  choice: шайка священников
  rationale: חֶבֶר обозначает объединённую группу; «шайка» естественно передаёт её преступный и сговорившийся характер в данном контексте.
- source_word: דֶּרֶךְ יְרַצְּחוּ שֶׁכְמָה
  choice: убивает на дороге в Сихем
  rationale: רצח означает именно преступное убийство, а направительное окончание в שֶׁכְמָה передано сочетанием «в Сихем».
- source_word: כִּי
  choice: поистине
  rationale: Здесь союз естественно понимать как усилительно-пояснительный, а не обязательно причинный.
- source_word: זִמָּה עָשׂוּ
  choice: они совершили злодеяние
  rationale: זִמָּה обозначает постыдный, возмутительный умысел или поступок; «злодеяние» сохраняет тяжесть обвинения и не сужает смысл до половой распущенности.
theological_decisions:
- issue: Синтаксис трудного начального сравнения וּכְחַכֵּי אִישׁ גְּדוּדִים
  choice: Разбойники подстерегают человека, а шайка священников уподобляется им.
  alternative: «И словно люди, сидящие в засаде, шайка священников убивает…» либо «как разбойник подстерегает…»
  rationale: Масоретский текст сжат и не вполне однозначен. Основной текст даёт грамматически связное сравнение, а примечание сохраняет другую вероятную трактовку без догматического разрешения текстовой трудности.
- issue: Характер обвинения זִמָּה
  choice: Общее тяжкое нравственно-преступное деяние — «злодеяние».
  alternative: «мерзость», «постыдное преступление», «злой умысел»
  rationale: Контекст говорит об убийстве, поэтому сексуальный оттенок, возможный у слова в иных местах, здесь не следует навязывать.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой обличительной речи. «Шайка» намеренно передаёт преступный характер группы; «убивает», а не архаичное «умерщвляет», сохраняет прямоту רצח. Все примечания отмечены в основном тексте.
