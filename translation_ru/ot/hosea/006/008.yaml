lexical_decisions:
- source_word: גִּלְעָד
  choice: Галаад
  rationale: Устоявшаяся русская передача библейского географического названия.
- source_word: קִרְיַת
  choice: город
  rationale: Сопряжённая форма перед последующим определением; естественно передаётся как «город творящих зло».
- source_word: פֹּעֲלֵי אָוֶן
  choice: творящих зло
  rationale: Причастная конструкция обозначает людей, постоянно совершающих зло; такая передача сохраняет глагольный характер еврейского выражения и звучит достойно и понятно.
- source_word: עֲקֻבָּה
  choice: отмеченный … следами
  rationale: Редкая и трудная форма, вероятно, описывает город как покрытый или отмеченный следами; перевод сохраняет образ следов, не сводя его однозначно к пятнам.
- source_word: מִדָּם
  choice: кровавыми
  rationale: Предлог מן в этом трудном сочетании естественно передан русским прилагательным, связывающим следы с кровью.
