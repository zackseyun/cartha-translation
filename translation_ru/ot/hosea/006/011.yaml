  yaml_path: translation/ot/hosea/006/011.yaml
  text: Also for you[a], Judah, a harvest is appointed[b], when I restore the fortunes of my people.
translation:
  language: ru
  text: И для тебя, Иуда, назначена жатва[a], когда Я восстановлю благополучие Моего народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «И тебе, Иуда, установлена жатва». Еврейский глагол буквально означает «положить, установить».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда Я возвращу плен Моего народа». Еврейское выражение может означать как возвращение из плена, так и восстановление благополучия.'
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם
  choice: И
  rationale: 'Союз сохраняет добавочное значение: Иуда присоединяется к сказанному прежде; в современном русском «и» звучит естественнее, чем более тяжеловесное «также».'
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Традиционная русская форма названия южного царства и его народа.
- source_word: שָׁת
  choice: назначена
  rationale: Глагол означает «положить, установить, назначить». Пассивная русская конструкция естественно передаёт смысл установленной для Иуды жатвы, не вводя в текст не названного явно деятеля.
- source_word: קָצִיר
  choice: жатва
  rationale: Сохраняется исходный образ без уточнения, означает ли он суд, воздаяние или благословение.
- source_word: לָךְ
  choice: для тебя
  rationale: Дательный элемент с местоименным суффиксом женского рода относится к Иуде; русское обращение «для тебя» передаёт его прямо и естественно.
- source_word: בְּשׁוּבִי
  choice: когда Я изменю
  rationale: Инфинитивная конструкция с суффиксом первого лица буквально связана с возвращением или обращением, но вместе со שְׁבוּת образует устойчивое выражение о перемене участи.
- source_word: שְׁבוּת
  choice: участь
  rationale: В пророческой формуле слово может обозначать восстановление прежнего благополучия или возвращение из плена. «Изменю участь» естественно передаёт идиому и не ограничивает её только буквальным пленом.
- source_word: עַמִּי
  choice: Моего народа
  rationale: Прямо передаёт заветное выражение «Мой народ»; прописная буква указывает на речь Бога.
theological_decisions:
- issue: Следует ли истолковать «жатву» как суд или как благословение
  choice: Оставить образ без поясняющего определения
  alternative: «жатва суда» или «жатва благословения»
  rationale: Ближайший контекст поддерживает оттенок суда, тогда как следующая часть стиха говорит о восстановлении народа. Перевод сохраняет эту смысловую напряжённость.
- issue: Как понимать формулу שׁוּב שְׁבוּת
  choice: «изменю участь»
  alternative: «возвращу из плена» или «восстановлю благополучие»
  rationale: Еврейская формула допускает связь как с буквальным пленом, так и с более широким восстановлением положения народа; основной текст не сужает её до одного из этих значений.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Порядок слов «для тебя, Иуда» следует акценту еврейского текста, оставаясь естественным по-русски; метафора жатвы и неоднозначность формулы восстановления сохранены.
