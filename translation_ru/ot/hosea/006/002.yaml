source:
  edition: WLC
  text: יְחַיֵּ֖/נוּ מִ/יֹּמָ֑יִם בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י יְקִמֵ֖/נוּ וְ/נִחְיֶ֥ה לְ/פָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/002.yaml
  text: He will revive us after two days[a]; on the third day he will raise us up[d][c][b], that we may live before him.
translation:
  language: ru
  text: Он оживит нас спустя два дня[a]; на третий день[c] он поднимет нас[b], и мы будем жить пред ним[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через два дня». Еврейское временное выражение может обозначать краткий срок, завершающийся третьим днём.'
    reason: lexical_alternative
  - marker: b
    text: '«Поднимет нас» можно также понимать шире: «восстановит нас» или «поставит нас на ноги».'
    reason: lexical_alternative
  - marker: c
    text: Многие христиане видят в словах «на третий день» прообраз воскресения Мессии, хотя непосредственно в этом стихе говорится о восстановлении народа.
    reason: cross_reference
  - marker: d
    text: 'Или: «в его присутствии».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְחַיֵּנוּ
  choice: он оживит нас
  rationale: Пиэль от חיה с объектным суффиксом 1-го лица множественного числа имеет каузативное значение «сделать живыми, оживить». Этот вариант сохраняет образ возвращения к жизни и уместен в контексте восстановления народа.
- source_word: מִיֹּמָיִם
  choice: спустя два дня
  rationale: Предлог מ при временном выражении здесь естественно передаётся как «спустя, после». Формулировка обозначает краткий срок и согласуется с последующим «на третий день».
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: на третий день
  rationale: Стандартная и естественная русская передача еврейского временного выражения; она сохраняет последовательность стихотворной строки.
- source_word: יְקִימֵנוּ
  choice: он поднимет нас
  rationale: Хифиль от קום может означать «поднять», «поставить на ноги» или «восстановить». «Поднимет нас» сохраняет конкретный образ выхода из состояния, подобного смерти, не сводя его ни только к политическому восстановлению, ни только к воскресению.
- source_word: וְנִחְיֶה
  choice: и мы будем жить
  rationale: Союз ו допускает простое последовательное или результирующее прочтение. Буквальная и естественная конструкция «и мы будем жить» сохраняет эту открытость лучше, чем однозначно целевое «чтобы мы жили».
- source_word: לְפָנָיו
  choice: пред ним
  rationale: Прямая, краткая и стилистически достойная передача לְפָנָיו. Она может означать как жизнь перед Богом, так и жизнь в его присутствии.
theological_decisions:
- issue: Следует ли переводом представить слова о третьем дне как прямое пророчество о воскресении Мессии или как восстановление народа
  choice: Основной текст сохраняет форму первого лица множественного числа и непосредственно говорит о том, что Бог оживит и поднимет народ.
  alternative: Христианское типологическое прочтение видит в словах «на третий день» предвосхищение воскресения Мессии.
  rationale: Еврейский текст прямо говорит «нас» и в контексте описывает восстановление народа. Возможный типологический смысл отмечен в сноске, но не внесён в основной перевод как единственное значение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Пред ним» выбрано как понятное и ёмкое выражение; местоимения, относящиеся к Богу, даны со строчной буквы по общим нормам современного русского текста. Параллелизм и краткость еврейской поэтической строки сохранены.
