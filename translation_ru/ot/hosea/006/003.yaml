  source_fidelity: Русский текст точно передаёт оба когортатива как совместный призыв («Будем же знать, будем настойчиво стремиться познать»), сохраняет повтор корня ידע и не сужает его смысл до простого интеллектуального знания. «Яхве» верно передаёт тетраграмматон. «Его явление так же верно, как рассвет» естественно выражает образ כַּשַּׁחַר נָכוֹן מוֹצָאוֹ, при этом буквальный образ מוצאו сохранён в примечании. Будущее «Он придёт» оправдано контекстом, а возможное желательное прочтение не скрыто. Образ обычного и позднего дождя, орошающего землю, передан полностью.
