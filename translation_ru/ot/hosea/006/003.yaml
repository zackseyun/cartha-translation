  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/נֵדְעָ֣ה נִרְדְּפָ֗ה לָ/דַ֨עַת֙ אֶת יְהוָ֔ה כְּ/שַׁ֖חַר נָכ֣וֹן מֽוֹצָא֑/וֹ וְ/יָב֤וֹא כַ/גֶּ֨שֶׁם֙ לָ֔/נוּ כְּ/מַלְק֖וֹשׁ י֥וֹרֶה אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/006/003.yaml
  text: So let us know[a]; let us press on to know Yahweh. His going forth is as sure as the dawn, and he will come to us like the rain[d][c][b], like the spring rain that waters the earth.
translation:
  language: ru
  text: Будем же знать, будем настойчиво стремиться познать Яхве. Его явление[a] так же верно, как рассвет. Он придёт к нам, как дождь[b], как весенний дождь[c], орошающий землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Его выход» или «Его выступление»; возможно: «Его появление».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен перевод: «Пусть Он придёт к нам, как дождь». Еврейская глагольная форма может выражать желание, хотя контекст также допускает уверенное будущее: «Он придёт».'
    reason: alternative_reading
  - marker: c
    text: То есть поздний сезонный дождь, выпадающий весной и особенно важный для созревания урожая.
    reason: cultural_note
lexical_decisions:
- source_word: וְנֵדְעָה
  choice: Будем же знать
  rationale: Когортатив 1-го лица множественного числа выражает совместный призыв; частица «же» естественно передаёт продолжение побуждения из контекста.
- source_word: נִרְדְּפָה לָדַעַת
  choice: будем настойчиво стремиться познать
  rationale: רדף буквально означает преследовать или гнаться; в сочетании с לדעת обозначает упорное стремление к познанию. Формы «знать / познать» сохраняют широкий, в том числе личностно-заветный, смысл ידע.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: כְּשַׁחַר נָכוֹן מוֹצָאוֹ
  choice: Его явление так же верно, как рассвет
  rationale: נכון указывает на несомненность и надёжность, а מוצא — буквально «выход», здесь, вероятно, явление или выступление Яхве. Выбран естественный русский образ с сохранением примечания о буквальном значении.
- source_word: וְיָבוֹא
  choice: Он придёт
  rationale: Имперфект в контексте уверенного сравнения с рассветом и дождём прочитан как предсказательное будущее; возможное желательное значение отмечено в сноске.
- source_word: כַגֶּשֶׁם
  choice: как дождь
  rationale: גשם — общее обозначение дождя; сравнение передаёт животворный характер прихода Яхве.
- source_word: כְּמַלְקוֹשׁ
  choice: как весенний дождь
  rationale: מלקוש — поздний сезонный дождь, выпадающий весной и важный для созревания урожая.
- source_word: יוֹרֶה אָרֶץ
  choice: орошающий землю
  rationale: Метеорологическое употребление ירה описывает дождь, выпадающий на землю; «орошающий» кратко и естественно выражает его действие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Сила формы וְיָבוֹא
  choice: 'уверенное будущее: «Он придёт»'
  alternative: 'желание или молитва: «пусть Он придёт»'
  rationale: Образы неизменно наступающего рассвета и сезонного дождя поддерживают уверенное ожидание, но грамматически возможное желательное прочтение сохранено в сноске.
- issue: Смысл ידע
  choice: «знать / познать»
  alternative: «признать»
  rationale: Так сохраняется широта еврейского понятия, включающая не только осведомлённость, но и личное, заветное познание, без внесения толкования прямо в текст.
- issue: Значение מוֹצָאוֹ
  choice: «Его явление»
  alternative: буквально «Его выход / выступление»
  rationale: В сравнении с рассветом речь, вероятно, о явлении Яхве. Необычный буквальный образ и неопределённость отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Сохранены параллелизм и образы рассвета и дождя; буквальная шероховатость מוֹצָאוֹ раскрыта в сноске. Все сносочные маркеры размещены непосредственно при соответствующих выражениях.
