  terminology: «Яхве», «познать», «явление», «рассвет» и сельскохозяйственный образ позднего сезонного дождя употреблены последовательно и без конфессионально обусловленного истолкования. Примечание к «явлению» надлежащим образом фиксирует лексическую широту מוצא.
