  text: וָ/אֱהִ֥י לָ/הֶ֖ם כְּמוֹ שָׁ֑חַל כְּ/נָמֵ֖ר עַל דֶּ֥רֶךְ אָשֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/007.yaml
  text: So I became to them like a lion[a]; like a leopard I lurked by the way.
translation:
  language: ru
  text: И Я стал для них как лев; как леопард, Я подстерегал у дороги.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как леопард, Я наблюдал у дороги»; также возможно: «как леопард, Я лежал в засаде у дороги». Последняя еврейская форма трудна: её можно понимать как глагол первого лица со значением наблюдения или ожидания в засаде, а не как название «Ассирия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֱהִי
  choice: И Я стал
  rationale: Форма Qal wayyiqtol, 1-е лицо ед. числа от היה. «Стал» передаёт переход к образу суда; союз «и» сохраняет повествовательную связь, не уточняя её сверх еврейского текста.
- source_word: לָהֶם
  choice: для них
  rationale: Предлог ל с местоименным суффиксом обозначает отношение к народу; в русском сочетание «стал для них» естественнее буквального «стал им».
- source_word: כְּמוֹ שָׁחַל
  choice: как лев
  rationale: שָׁחַל обозначает льва, возможно с оттенком силы и свирепости; контекст не требует уточнения «молодой лев».
- source_word: כְּנָמֵר
  choice: как леопард
  rationale: נָמֵר — пятнистый хищник, традиционно и точно передаваемый словом «леопард».
- source_word: עַל דֶּרֶךְ
  choice: у дороги
  rationale: Выражение указывает на место засады возле пути; «у дороги» естественно передаёт эту пространственную картину.
- source_word: אָשׁוּר
  choice: Я подстерегал
  rationale: В данном контексте форма вероятнее понимается как глагол 1-го лица со значением наблюдения или ожидания в засаде, а не как название Ассирии. «Подстерегал» сохраняет образ хищника, ожидающего добычу.
theological_decisions:
- issue: Изображение Бога как хищника, совершающего суд
  choice: Сохранить прямые сравнения со львом и леопардом и глагол «подстерегал».
  alternative: Смягчить образ, например перевести как «наблюдал у дороги».
  rationale: Еврейский текст намеренно использует суровый образ суда. Его напряжённость не следует устранять ради богословского смягчения.
- issue: Неоднозначность формы אָשׁוּר
  choice: В основном тексте принять глагольное прочтение от корня со значением «наблюдать, подстерегать».
  alternative: Понять форму как имя/название «Ассирия».
  rationale: Синтаксис и параллельный образ леопарда у дороги поддерживают глагольное прочтение, однако текстовая форма трудна, поэтому неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Заглавное «Я» обозначает говорящего Бога. Яркий образ хищника сохранён без смягчения; трудность последней формы вынесена в сноску.
