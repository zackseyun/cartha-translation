lexical_decisions:
- source_word: יְדַעְתִּיךָ
  choice: Я знал тебя
  rationale: Глагол ידע прежде всего означает «знать», но в данном контексте может подразумевать личное признание, близость и заботу в рамках отношений завета. Буквальное выражение сохраняет эту смысловую ёмкость, не сводя её к одному толкованию.
- source_word: בַּמִּדְבָּר
  choice: в пустыне
  rationale: מִדְבָּר обозначает пустынную, необжитую местность. «В пустыне» естественно для современного русского языка и поддерживает отсылку Осии к исходу и странствованию Израиля.
- source_word: בְּאֶרֶץ
  choice: в земле
  rationale: Сочетание предлога ב с אֶרֶץ здесь обозначает пребывание в местности, характеризуемой следующим словом; «в земле» сохраняет образ и параллелизм еврейской строки.
- source_word: תַּלְאֻבוֹת
  choice: жестокой засухи
  rationale: Редкое слово во множественном числе связано с иссушением, жаждой или палящим зноем. «Жестокой засухи» ясно передаёт крайнюю суровость и безводность местности, а иные возможные оттенки отмечены в сноске.
theological_decisions:
- issue: Смысл Божьего «знания» об Израиле
  choice: «Я знал тебя» с подразумеваемым, но не разъяснённым в основном тексте оттенком отношений завета
  alternative: «Я заботился о тебе» или «Я признавал тебя»
  rationale: Контекст, вероятно, подразумевает особые отношения Господа с Израилем и Его заботу во время странствования по пустыне, однако сам глагол означает «знать». Выбранный перевод сохраняет лексическую основу и богословскую напряжённость, не подменяя её толкованием.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Сохранён образ «земли» и прямое Божье обращение к Израилю; редкость и неоднозначность последнего еврейского слова отражены в сноске.
