  variant: modern literary Russian
source:
  edition: WLC
  text: מִ/יַּ֤ד שְׁאוֹל֙ אֶפְדֵּ֔/ם מִ/מָּ֖וֶת אֶגְאָלֵ֑/ם אֱהִ֨י דְבָרֶי/ךָ֜ מָ֗וֶת אֱהִ֤י קָֽטָבְ/ךָ֙ שְׁא֔וֹל נֹ֖חַם יִסָּתֵ֥ר מֵ/עֵינָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/014.yaml
  text: From the hand of Sheol I will ransom them[a]; from death I will redeem them. O Death, where are your plagues? O Sheol[c][b], where is your destruction? Compassion will be hidden from my eyes.
translation:
  language: ru
  text: Из руки Шеола Я выкуплю их[a], от смерти искуплю их. Смерть, где твои язвы? Шеол, где твоя погибель?[b][c] Сострадание будет скрыто от Моих глаз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Разве Я выкуплю их из руки Шеола? Разве искуплю их от смерти?» При таком прочтении это риторические вопросы суда, а не обещание избавления.'
    reason: alternative_reading
  - marker: b
    text: 'Древнееврейское אֱהִי можно понять и как «Я стану» или «пусть Я буду»: «Я стану твоими язвами, Смерть, твоей погибелью, Шеол».'
    reason: alternative_reading
  - marker: c
    text: 'Традиционный перевод, сложившийся под влиянием греческой версии: «Смерть, где твоё жало? Шеол, где твоя победа (или: жало)?» Сравните 1 Коринфянам 15:55.'
    reason: cross_reference
lexical_decisions:
- source_word: מִיַּד
  choice: из руки
  rationale: Сохранён конкретный древнееврейский образ руки как власти или хватки; по-русски выражение остаётся понятным в поэтическом контексте.
- source_word: שְׁאוֹל
  choice: Шеол
  rationale: Транслитерация сохраняет обозначение мира мёртвых и не сужает смысл до отдельной могилы.
- source_word: אֶפְדֵּם
  choice: Я выкуплю их
  rationale: Глагол פדה передаёт освобождение посредством выкупа; «выкуплю» также позволяет отличить его от следующего גאל.
- source_word: מִמָּוֶת
  choice: от смерти
  rationale: Естественная русская передача, сохраняющая параллелизм с избавлением из руки Шеола.
- source_word: אֶגְאָלֵם
  choice: искуплю их
  rationale: «Искуплю» передаёт גאל с присущими ему оттенками возвращения и родственного или заветного избавления, сохраняя отличие от פדה.
- source_word: אֱהִי
  choice: где
  rationale: Форма понята как вопросительная в поэтическом вызове Смерти и Шеолу. Возможное понимание «Я стану» или «пусть Я буду» сохранено в примечании.
- source_word: דְבָרֶיךָ
  choice: твои моровые язвы
  rationale: В данном контексте слово обозначает губительные эпидемические бедствия. Сочетание «моровые язвы» точно и торжественно, хотя несколько отмечено библейско-поэтическим регистром.
- source_word: קָטָבְךָ
  choice: твоя погибель
  rationale: Передаёт губительную, уничтожающую силу קטב и образует ясную параллель к моровым язвам.
- source_word: נֹחַם
  choice: сострадание
  rationale: Слово может означать также сожаление или отказ от намерения; «сострадание» здесь выражает милость, которая не остановит объявленное действие.
- source_word: יִסָּתֵר מֵעֵינָי
  choice: будет скрыто от Моих глаз
  rationale: Сохранены страдательная форма, будущая направленность и образ сокрытия от глаз.
theological_decisions:
- issue: Являются ли начальные строки обещанием избавления или риторическими вопросами суда
  choice: 'Утвердительное обещание: «Я выкуплю… искуплю»'
  alternative: 'Риторические вопросы: «Разве Я выкуплю…? Разве искуплю…?» — подразумевающие отказ избавить'
  rationale: Формы древнееврейских глаголов естественно допускают утвердительное прочтение, а последующие обращения можно понимать как победный вызов Смерти и Шеолу. Контекст книги допускает и судебное прочтение, поэтому оно не устранено, а вынесено в примечание.
- issue: Значение двукратного אֱהִי
  choice: Вопросительное «где?»
  alternative: «Я стану» или «пусть Я буду» губительными силами Смерти и Шеола
  rationale: Вопросительное прочтение создаёт связный поэтический вызов и соответствует известной истории восприятия стиха, однако неоднозначность древнееврейской формы требует сохранить альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой поэзии. «Шеол» сохраняет древнееврейский образ мира мёртвых; «моровые язвы» намеренно имеет слегка возвышенную библейскую окраску, но остаётся понятным. Пара «выкуплю / искуплю» воспроизводит два разных глагола избавления.
