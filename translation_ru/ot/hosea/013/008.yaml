base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/008.yaml
  text: I will attack them like a bear robbed of her cubs[a], and I will tear open the enclosure of their heart; there I will devour them like a lioness[b]; a wild beast of the field will rip them apart.
translation:
  language: ru
  text: Я нападу на них, как медведь, потерявший детёнышей, и разорву покров их сердца[a]. Там Я пожру их, как лев[b]; зверь полевой растерзает их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что закрывает их сердце»; возможно, имеется в виду грудь. Еврейское выражение редкое и трудное для толкования.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «как львица».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְגְּשֵׁם
  choice: Я нападу на них
  rationale: Хотя פגשׁ буквально означает «встретить, столкнуться», контекст суда и образы хищников придают встрече явно враждебный характер; «нападу» естественно передаёт эту силу.
- source_word: כְּדֹב שַׁכּוּל
  choice: как медведица, лишившаяся детёнышей
  rationale: שַׁכּוּל обозначает потерю детей или потомства. Женский род выбран по смыслу образа медведицы, потерявшей детёнышей, и передаёт подразумеваемую ярость без добавления причины их утраты.
- source_word: וְאֶקְרַע
  choice: и разорву
  rationale: קרע означает «разрывать, рассекать»; русский глагол сохраняет резкость и телесность образа.
- source_word: סְגוֹר לִבָּם
  choice: оболочку их сердца
  rationale: Редкое и трудное выражение буквально указывает на нечто закрывающее или заключающее сердце. «Оболочка» сохраняет образ, не сводя его однозначно к груди.
- source_word: וְאֹכְלֵם שָׁם
  choice: Там я пожру их
  rationale: В образе хищника אכל уместно передаётся сильным глаголом «пожру»; שָׁם сохранено как «там».
- source_word: כְּלָבִיא
  choice: как львица
  rationale: לָבִיא может обозначать зрелого льва или львицу. «Львица» допустимо по лексике и поддерживает последовательность образов вслед за медведицей; альтернативу следует отметить.
- source_word: חַיַּת הַשָּׂדֶה
  choice: полевой зверь
  rationale: Единственное число существительного и глагола поддерживает значение одного дикого зверя; краткое русское выражение сохраняет библейский образ.
- source_word: תְּבַקְּעֵם
  choice: растерзает их
  rationale: בקע означает «рассекать, раскалывать, разрывать». В контексте нападения зверя «растерзает» естественно передаёт насильственное разрывание на части.
theological_decisions:
- issue: Божественное самоописание через образы хищных зверей
  choice: Сохранить речь Бога от первого лица и жестокие образы нападения без смягчения.
  alternative: Передать образы более общими выражениями о Божьем суде.
  rationale: Еврейский текст прямо представляет Бога действующим субъектом заветного суда и намеренно использует ряд образов хищников. Перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством и высокой образностью пророческой речи. Глаголы «нападу», «разорву», «пожру», «растерзает» намеренно сохраняют суровость оригинала; синтаксис остаётся ясным для современного читателя.
