base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/010.yaml
  text: Where now is your king[a], that he may save you in all your cities, and your judges, of whom you said[b], “Give me a king and princes”?
translation:
  language: ru
  text: 'Где теперь твой царь[a], чтобы он спас тебя во всех твоих городах? Где твои судьи, о которых ты сказал: «Дай мне царя и правителей[b]»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Я был бы твоим царём; где же тот, кто мог бы спасти тебя…?» Начало еврейского текста трудно для истолкования.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «сановников»; возможно также: «князей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱהִי ... אֵפוֹא
  choice: Где теперь
  rationale: 'Начальная форма אֱהִי трудна, однако в сочетании с אֵפוֹא и в контексте насмешливого вызова наиболее естественно передаёт вопрос: «Где теперь…?» Неопределённость отражена в сноске.'
- source_word: מַלְכְּךָ
  choice: твой царь
  rationale: Сохранены единственное число и форма принадлежности, соответствующие теме царской власти Израиля.
- source_word: וְיוֹשִׁיעֲךָ
  choice: чтобы спасти тебя
  rationale: Hiphil от ישׁע означает «спасти, избавить». Инфинитивная конструкция по-русски естественно передаёт цель или ожидаемый результат риторического вопроса, не уточняя явно подразумеваемого действующего лица.
- source_word: בְּכָל עָרֶיךָ
  choice: во всех твоих городах
  rationale: Предлог ב передан локально; выражение буквально и естественно для современного русского языка.
- source_word: וְשֹׁפְטֶיךָ
  choice: твои судьи
  rationale: Сохранено основное лексическое значение שׁפט и политический параллелизм с царём и правителями.
- source_word: אֲשֶׁר אָמַרְתָּ
  choice: о которых ты говорил
  rationale: Относительная конструкция отнесена к ранее названным представителям власти. Формулировка сохраняет возможную некоторую размытость референции.
- source_word: תְּנָה לִּי
  choice: Дай мне
  rationale: Императив единственного числа от נתן с לִי прямо передан как «дай мне».
- source_word: מֶלֶךְ וְשָׂרִים
  choice: царя и правителей
  rationale: מֶלֶךְ передано как «царь», а שָׂרִים — широким и понятным словом «правители», которое в данном политическом контексте не навязывает более узкого значения «князья» или «сановники».
theological_decisions:
- issue: Толкование трудного начала אֱהִי
  choice: 'Риторический вопрос: «Где теперь твой царь…?»'
  alternative: «Я был бы твоим царём; где же тот, кто спасёт тебя…?» или «Я буду твоим царём…»
  rationale: Контекст говорит о тщетности упования Израиля на человеческую монархию и о царе, данном и отнятом в гневе. Вопросительное прочтение лучше сохраняет обличительную иронию, однако альтернативное понимание грамматической формы приведено в сноске, чтобы не скрывать подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «Где» делает риторическую структуру ясной и естественной. Формы второго лица единственного числа сохраняют обращение еврейского текста к Израилю как к одному собеседнику.
