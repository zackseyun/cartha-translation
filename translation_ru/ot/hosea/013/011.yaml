lexical_decisions:
- source_word: אֶתֶּן
  choice: Я дал
  rationale: Форма qal imperfect 1-го лица ед. числа допускает настоящее или будущее значение, однако контекст речи о царях Израиля поддерживает ретроспективное прочтение; неоднозначность отмечена в сноске.
- source_word: לְךָ
  choice: тебе
  rationale: 'Сохраняет форму 2-го лица ед. числа: Израиль представлен как единое целое.'
- source_word: מֶלֶךְ
  choice: царя
  rationale: В русском языке после «дал тебе» винительный падеж естественно передаёт неопределённое еврейское существительное без артикля.
- source_word: בְּאַפִּי
  choice: в гневе Моём
  rationale: Передаёт обстоятельственно-причинный смысл בְּ и обычное значение אַף как гнева; постпозиция местоимения поддерживает достоинство пророческой речи.
- source_word: וְאֶקַּח
  choice: и забрал его
  rationale: לקח буквально означает «взять»; «забрал» естественно выражает устранение данного царя. Местоимение «его» восполняет подразумеваемый объект и отмечено сноской.
- source_word: בְּעֶבְרָתִי
  choice: в ярости Моей
  rationale: «Ярость» передаёт усиленное значение עֶבְרָה и сохраняет лексическое различие с אַף («гнев») в первой части.
theological_decisions:
- issue: Время и вид двух глагольных форм 1-го лица
  choice: 'Ретроспективное прошедшее: «Я дал… и забрал»'
  alternative: 'Настоящее/будущее: «Я даю… и забираю» либо «Я дам… и заберу»'
  rationale: Обе формы являются имперфектами и сами по себе допускают незавершённое, настоящее или будущее значение, но контекст Ос 13 рассматривает дарование и устранение царей как уже совершавшиеся проявления Божьего суда. Сноска сохраняет реальную грамматическую неоднозначность.
- issue: Подразумеваемое дополнение при וְאֶקַּח
  choice: Дополнение раскрыто как «его», то есть царя
  alternative: 'Оставить без дополнения: «и забрал»'
  rationale: Предшествующее מֶלֶךְ естественно задаёт референт; русская фраза яснее и естественнее с местоимением, при этом его отсутствие в еврейском отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Параллелизм и различие между «гневом» и более сильной «яростью» сохранены; инверсия «гневе Моём / ярости Моей» придаёт строке достоинство без архаизации.
