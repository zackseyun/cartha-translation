  text: I gave you a king in my anger[b][a], and I took him away in my wrath.
translation:
  language: ru
  text: Я дал тебе царя в гневе моём[a] и забрал его[b] в ярости моей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально по форме еврейских глаголов: «Я даю тебе царя в гневе моём и забираю его в ярости моей»; возможен и перевод будущим временем. Контекст допускает ретроспективный смысл.'
    reason: alternative_reading
  - marker: b
    text: 'В еврейском тексте буквально: «и забрал»; дополнение «его» подразумевается — речь идёт о царе.'
