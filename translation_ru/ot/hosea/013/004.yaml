base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/004.yaml
  text: But I am Yahweh your God from the land of Egypt[a]; you know no God besides me[b], and there is no savior except me.
translation:
  language: ru
  text: Но Я — Яхве, твой Бог со времени исхода из Египта[a]. Другого Бога, кроме Меня, ты не должен знать[b], и нет спасителя, кроме Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из земли Египта». Еврейское выражение может указывать как на отношения Яхве с Израилем со времени исхода, так и на Его спасительное действие — выведение народа из Египта.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ты не знаешь другого Бога, кроме Меня». Еврейская глагольная форма допускает как заветно-запретительный, так и декларативный смысл.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Но Я
  rationale: Союз в контексте выражает противопоставление, а самостоятельное местоимение подчёркивает говорящего.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Форма с суффиксом второго лица единственного числа обозначает Бога Израиля в отношениях завета.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: ещё со времени Египта
  rationale: В данном контексте предлог מִן естественно передаёт временную точку отсчёта и отсылает к исходу, не исключая пространственного оттенка «из Египта».
- source_word: וֵאלֹהִים זוּלָתִי
  choice: Другого Бога, кроме Меня
  rationale: 'Сочетание выражает исключительность: никакой иной Бог не должен быть признан Израилем.'
- source_word: לֹא תֵדָע
  choice: ты не должен знать
  rationale: Имперфект допускает декларативное и заветно-запретительное понимание; основной текст передаёт уместную здесь нормативную силу, а альтернативу сохраняет сноска.
- source_word: וּמוֹשִׁיעַ אַיִן בִּלְתִּי
  choice: и нет спасителя, кроме Меня
  rationale: Причастие обозначает того, кто спасает или избавляет, а אַיִן בִּלְתִּי образует категорическое отрицание с исключением.
theological_decisions:
- issue: Исключительность божественной личности и спасения
  choice: Яхве утверждает, что Израиль не должен признавать иного Бога и что другого спасителя нет.
  alternative: 'Среднюю часть можно понять декларативно: «ты не знаешь другого Бога, кроме Меня».'
  rationale: Еврейский текст соединяет заветное требование исключительной верности с утверждением, что спасение исходит только от Яхве, не развивая это в более поздние богословские формулы.
- issue: Связь Яхве с Израилем и Египтом
  choice: «ещё со времени Египта» указывает на отношения, явленные со времени исхода.
  alternative: «из земли Египетской» может сильнее подчёркивать спасительное выведение Израиля из Египта.
  rationale: Предлог допускает временной и исходный оттенки; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный синтаксис. Написание «Я», «Меня» с прописной буквы поддерживает традиционный русский библейский регистр. Личное имя יְהוָה передано как «Яхве».
