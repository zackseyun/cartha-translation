lexical_decisions:
- source_word: כְּדַבֵּר אֶפְרַיִם
  choice: Когда Ефрем говорил
  rationale: Предлог כְּ при инфинитиве образует временную конструкцию. Русское «когда… говорил» естественно передаёт её, а имя Ефрем сохраняется без поясняющей замены на северное царство.
- source_word: רְתֵת
  choice: все трепетали
  rationale: Краткая именная форма обозначает трепет или дрожь. В русском добавление подразумеваемого «все» делает фразу естественной, не уточняя, был ли это страх, благоговение или политический ужас.
- source_word: נָשָׂא הוּא בְּיִשְׂרָאֵל
  choice: он был возвышен в Израиле
  rationale: 'Сжатая еврейская конструкция допускает результативно-пассивное понимание: Ефрем занимал высокое положение в Израиле. Активно-возвратное прочтение сохранено в сноске.'
- source_word: וַיֶּאְשַׁם
  choice: он навлёк на себя вину
  rationale: Глагол אָשַׁם означает стать виновным или понести вину. Выбранная формулировка сохраняет нравственно-судебный оттенок и звучит естественно по-русски.
- source_word: בַּבַּעַל
  choice: из-за Ваала
  rationale: Предлог בְּ здесь выражает связь или основание вины. «Из-за Ваала» сохраняет имя божества и не добавляет в основной текст отсутствующее существительное «поклонение».
- source_word: וַיָּמֹת
  choice: и умер
  rationale: Передан кратко и резко, как в еврейском тексте, без уточнения, идёт ли речь о буквальной, духовной или общественно-политической смерти.
theological_decisions:
- issue: Возвышение Ефрема
  choice: он был возвышен в Израиле
  alternative: он возвысился в Израиле; он стал влиятельным в Израиле
  rationale: Еврейская фраза синтаксически сжата и допускает как пассивно-результативное, так и активно-возвратное понимание. Основной текст следует пассивному прочтению, а подлинная неоднозначность отмечена в сноске.
- issue: Характер смерти Ефрема
  choice: и умер
  alternative: понимать смерть как общественно-политическую или духовную гибель северного царства
  rationale: Перевод сохраняет без поясняющей вставки напряжённую пророческую формулировку и не решает за читателя, буквальна ли смерть или относится к Ефрему как к народу.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Точка с запятой связывает прежнее влияние Ефрема с последующим падением, а тире подчёркивает резкий итог. Все сноски стоят непосредственно после относящихся к ним выражений.
