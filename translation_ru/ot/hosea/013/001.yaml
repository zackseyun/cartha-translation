  yaml_path: translation/ot/hosea/013/001.yaml
  text: When Ephraim spoke[a], there was trembling; he was exalted in Israel[b]. But he became guilty through Baal and died.
translation:
  language: ru
  text: Когда говорил Ефрем, все трепетали; он возвысился в Израиле[a]. Но он навлёк на себя вину из-за Ваала[b] и умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он был возвышен в Израиле»; возможно также: «он стал влиятельным в Израиле». Еврейская фраза очень сжата и допускает как пассивно-результативное, так и активно-возвратное прочтение.'
