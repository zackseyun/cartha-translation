  text: לָ/כֵ֗ן יִֽהְיוּ֙ כַּ/עֲנַן בֹּ֔קֶר וְ/כַ/טַּ֖ל מַשְׁכִּ֣ים הֹלֵ֑ךְ כְּ/מֹץ֙ יְסֹעֵ֣ר מִ/גֹּ֔רֶן וּ/כְ/עָשָׁ֖ן מֵ/אֲרֻבָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/003.yaml
  text: Therefore they will be like the morning cloud[a], and like the dew that goes away early, like chaff whirled from the threshing floor, and like smoke from a window.
translation:
  language: ru
  text: Поэтому они будут как утреннее облако, как роса, рано исчезающая, как мякина, уносимая вихрем с гумна, и как дым из окна[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из решётчатого проёма». Еврейское слово может обозначать оконный проём или решётку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт следствие предшествующего обличения и возвещённого суда.
- source_word: יִהְיוּ
  choice: они будут
  rationale: Естественно передаёт форму будущего времени и сохраняет множественное число.
- source_word: כַּעֲנַן בֹּקֶר
  choice: как утреннее облако
  rationale: Сохраняет образ недолговечного утреннего облака без излишнего истолкования.
- source_word: וְכַטַּל מַשְׁכִּים הֹלֵךְ
  choice: как роса, рано исчезающая
  rationale: Передаёт и раннее время, выраженное מַשְׁכִּים, и уход, исчезновение, выраженное הֹלֵךְ, естественным современным русским языком.
- source_word: כְּמֹץ
  choice: как мякина
  rationale: «Мякина» — понятное русское обозначение лёгких остатков обмолота, уносимых при веянии.
- source_word: יְסֹעֵר מִגֹּרֶן
  choice: уносимая вихрем с гумна
  rationale: Сохраняет бурное, вихревое движение глагола и земледельческий образ гумна.
- source_word: וּכְעָשָׁן
  choice: и как дым
  rationale: Сохраняет параллельную структуру сравнений и образ быстрого рассеивания.
- source_word: מֵאֲרֻבָּה
  choice: из окна
  rationale: «Окно» — наиболее доступный вариант в основном тексте; возможное значение решётчатого проёма отмечено в сноске.
