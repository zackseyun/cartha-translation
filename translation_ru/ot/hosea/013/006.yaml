lexical_decisions:
- source_word: כְּמַרְעִיתָם
  choice: Когда у них было пастбище
  rationale: 'Компактное еврейское выражение с כְּ передаёт временное или обстоятельственное значение: изобилие пастбища стало условием последующего насыщения. Перевод сохраняет образ пастбища и естественно звучит по-русски.'
- source_word: וַיִּשְׂבָּעוּ ... שָׂבְעוּ
  choice: они насытились; насытились
  rationale: Повтор корня שׂבע риторически значим, поэтому он сохранён. «Насытились» передаёт достижение сытости и не добавляет отсутствующего в тексте прямого упоминания еды.
- source_word: וַיָּרָם לִבָּם
  choice: вознеслось их сердце
  rationale: Сохранена еврейская метафора возвышенного сердца, обозначающая гордость. Это позволяет не заменять образ истолкованием.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Естественно и точно обозначает следствие.
- source_word: שְׁכֵחוּנִי
  choice: они забыли Меня
  rationale: Прямо передаёт глагол שכח и его заветный смысл без ослабляющего истолкования вроде «пренебрегли Мною».
theological_decisions:
- issue: Образ гордости в выражении «вознеслось их сердце»
  choice: Сохранить метафору исходного текста.
  alternative: «они возгордились» / «их сердце стало гордым»
  rationale: Метафора передаёт духовную связь между изобилием, самовозвышением и забвением Бога, не сводя образ к пояснительному пересказу.
translation_notes:
  register: Современный литературный русский язык с сохранением пастушеского образа, повтора «насытились» и библейской метафоры сердца. Заглавная буква в «Меня» указывает на Бога согласно принятой русской библейской орфографии.
