  text: Беззаконие Ефрема связано в узел; его грех сохранён[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокрыт». Еврейское слово может означать как нечто скрытое, так и нечто сохранённое, оставленное до времени — вероятно, для будущего взыскания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוּר
  choice: связано в узел
  rationale: Страдательное причастие от צרר обозначает нечто связанное, завязанное или собранное в свёрток. Перевод сохраняет предметный образ надёжно убранной вещи и естественно сочетается с параллельной строкой.
- source_word: עֲוֺן
  choice: беззаконие
  rationale: Слово может обозначать беззаконие, вину или последствие вины. Параллелизм с «грехом» указывает здесь прежде всего на нравственное преступление; «беззаконие» сохраняет его этическую тяжесть.
- source_word: אֶפְרָיִם
  choice: Ефрема
  rationale: Имя передано в принятой русской библейской форме; родительный падеж естественно выражает принадлежность.
- source_word: צְפוּנָה
  choice: сохранён
  rationale: Страдательное причастие от צפן может означать «сокрыт», «сбережён» или «оставлен на хранение». «Сохранён» передаёт мысль о том, что грех не исчез и остаётся для будущего взыскания, не делая этот вывод излишне явным.
- source_word: חַטָּאתוֹ
  choice: его грех
  rationale: В данном контексте חַטָּאת обозначает грех, а не жертву за грех. Местоименный суффикс мужского рода сохранён и относится к Ефрему как к собирательному единству.
theological_decisions:
- issue: Смысл двух образов хранения
  choice: Беззаконие Ефрема представлено связанным и сохранённым, то есть не устранённым и остающимся для грядущего суда.
  alternative: Второй образ можно понимать слабее — лишь как указание на сокрытый грех.
  rationale: Параллельные причастия в контексте пророчества о суде указывают на сохранение вины, однако основной текст не уточняет механизм или доктрину воздаяния и тем самым сохраняет напряжение образа.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Предметная метафора «связано в узел» сохранена, а смысл второго причастия не сводится однозначно ни к сокрытию, ни к судебному учёту.
