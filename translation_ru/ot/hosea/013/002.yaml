id: HOS.13.2
reference: Hosea 13:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יוֹסִ֣פוּ לַ/חֲטֹ֗א וַ/יַּעְשׂ֣וּ לָ/הֶם֩ מַסֵּכָ֨ה מִ/כַּסְפָּ֤/ם כִּ/תְבוּנָ/ם֙ עֲצַבִּ֔ים מַעֲשֵׂ֥ה חָרָשִׁ֖ים כֻּלֹּ֑/ה לָ/הֶם֙ הֵ֣ם אֹמְרִ֔ים זֹבְחֵ֣י אָדָ֔ם עֲגָלִ֖ים יִשָּׁקֽוּ/ן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/002.yaml
  text: 'And now they keep on sinning: they make cast images for themselves from their silver, idols made according to their own skill—all of it the work of craftsmen. Of them they say[a], “Those who sacrifice human beings kiss calves[b][c].”'
translation:
  language: ru
  text: 'И теперь они продолжают грешить: делают себе литые изваяния из своего серебра — идолов, сделанных по своему умению; всё это работа мастеров. О них говорят[a]: «Приносящие людей в жертву целуют тельцов[b][c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «им говорят»; связь слова «им» с последующими словами в еврейском тексте синтаксически неясна.'
    reason: alternative_reading
  - marker: b
    text: 'Возможный перевод: «Пусть люди, приносящие жертвы, целуют тельцов». При таком понимании еврейское слово «адам» означает «люди», а последний глагол передаётся как побуждение; масоретская форма естественнее понимается как сообщение: «целуют».'
    reason: alternative_reading
  - marker: c
    text: То есть изображения тельцов, которым поклонялись как идолам.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет как временное значение, так и связующую силу начального ו.
- source_word: יוֹסִפוּ לַחֲטֹא
  choice: они продолжают грешить
  rationale: Конструкция указывает на продолжающееся или повторяющееся действие; формулировка естественна для современного литературного русского языка.
- source_word: וַיַּעְשׂוּ לָהֶם מַסֵּכָה
  choice: делают себе литые изваяния
  rationale: מַסֵּכָה обозначает отлитое культовое изображение; единственное число допускает собирательное понимание в согласовании с последующим множественным עֲצַבִּים.
- source_word: מִכַּסְפָּם
  choice: из своего серебра
  rationale: Предлог מן обозначает материал, а возвратное «своего» ясно соотносит серебро с изготовителями.
- source_word: כִּתְבוּנָם
  choice: по собственному умению
  rationale: В контексте изготовления и упоминания мастеров תְּבוּנָה передаёт практическое мастерство или искусность; перевод сохраняет иронию человеческого производства идолов.
- source_word: עֲצַבִּים
  choice: идолов
  rationale: Прямое и общепонятное обозначение культовых изображений.
- source_word: מַעֲשֵׂה חָרָשִׁים כֻּלֹּה
  choice: всё это работа мастеров
  rationale: Сохраняет акцент на полностью человеческом происхождении изображений и множественное число חָרָשִׁים.
- source_word: לָהֶם הֵם אֹמְרִים
  choice: О них говорят
  rationale: Естественно связывает местоимение с идолами, при этом буквальная и синтаксически трудная конструкция отмечена в сноске.
- source_word: זֹבְחֵי אָדָם
  choice: Приносящие людей в жертву
  rationale: Масоретская последовательность естественно допускает понимание אָדָם как объекта причастия; «людей» не ограничивает значение мужчинами.
- source_word: עֲגָלִים יִשָּׁקוּן
  choice: целуют тельцов
  rationale: Масоретская форма естественнее понимается как изъявительная; образ тельцов сохраняется буквально, а культовый смысл поясняется в сноске.
theological_decisions:
- issue: Толкование זֹבְחֵי אָדָם עֲגָלִים יִשָּׁקוּן
  choice: «Приносящие людей в жертву целуют тельцов»
  alternative: «Пусть приносящие жертвы целуют тельцов»
  rationale: Еврейская фраза предельно сжата и допускает разные синтаксические разборы. Основной текст следует наиболее прямому масоретскому прочтению, где אָדָם — объект жертвоприношения, а יִשָּׁקוּן — изъявительная форма; существенная альтернатива сохранена в сноске без устранения богословского напряжения.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим тоном. Синтаксис сделан ясным для обычного читателя, но необычная сжатость и реальная неоднозначность заключительной еврейской фразы не устранены, а документированы в сносках.
