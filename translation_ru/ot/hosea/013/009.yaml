  text: שִֽׁחֶתְ/ךָ֥ יִשְׂרָאֵ֖ל כִּֽי בִ֥/י בְ/עֶזְרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/009.yaml
  text: You have destroyed yourself[a], Israel, because your help is in me.
translation:
  language: ru
  text: Ты сам себя погубил, Израиль,[a] ведь во Мне — твоя помощь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст этого стиха труден. Начало можно понять буквальнее: «Погубил тебя, Израиль…» или: «Твоя погибель, Израиль…»; весь стих также переводят: «Твоя погибель, Израиль, в том, что ты против Меня, против своей помощи».'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁחֶתְךָ
  choice: Ты сам себя погубил
  rationale: 'Форма трудна синтаксически. По огласовке её можно понимать буквально как «он погубил тебя», однако в контексте широко засвидетельствовано возвратное понимание: Израиль сам навлёк на себя гибель. Частица «сам» естественно передаёт этот смысл по-русски; буквальная и именная возможности сохранены в примечании.'
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранена общепринятая русская форма имени; обращение выделено запятыми.
- source_word: כִּי
  choice: ведь
  rationale: Передаёт объяснительно-причинное значение и естественно связывает погибель Израиля с утверждением об источнике его помощи, не делая связь чрезмерно однозначной.
- source_word: בִי
  choice: во Мне
  rationale: Предлог передан в основном значении «во»; прописная буква указывает на говорящего Бога согласно контексту.
- source_word: בְעֶזְרֶךָ
  choice: твоя помощь
  rationale: Существительное עֵזֶר сохранено как «помощь». Сжатая еврейская конструкция естественно передана русским именным сказуемым с тире.
theological_decisions:
- issue: Толкование синтаксически трудного начала стиха
  choice: Израиль представлен погубившим самого себя, тогда как его помощь — в Боге.
  alternative: «Погубил тебя, Израиль…» или «Твоя погибель, Израиль…»
  rationale: Возвратное прочтение даёт связный смысл без введения не названного субъекта, но оно не выражено в масоретском тексте однозначно. Поэтому основные альтернативы указаны в примечании.
- issue: Значение предлога ב во второй части
  choice: «во Мне — твоя помощь»
  alternative: «ты против Меня, против своей помощи»
  rationale: Обычное локативно-отношенческое значение предлога сохраняет контраст между саморазрушением Израиля и Богом как источником помощи. Допустимое противительное прочтение отмечено в примечании, чтобы не скрывать неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом пророческой речи. Обращение сохранено без архаического «о»; инверсия «во Мне — твоя помощь» подчёркивает контраст и остаётся естественной.
