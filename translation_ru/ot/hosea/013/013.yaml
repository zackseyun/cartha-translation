base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/013.yaml
  text: The labor pains of a woman giving birth come upon him[a]; he is an unwise son[b], for at the proper time he does not present himself at the opening of the womb.
translation:
  language: ru
  text: Муки роженицы охватят его[a]. Он — неразумный сын, ибо, когда приходит время, он не появляется у выхода из утробы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родовые муки».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не стоит у мишбара сыновей». Значение редкого слова «мишбар» и всего выражения не вполне ясно; вероятно, имеется в виду место или момент выхода ребёнка при родах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶבְלֵי יֹלֵדָה
  choice: муки роженицы
  rationale: Сочетание обозначает родовые схватки или муки; перевод сохраняет образ родов и звучит естественно по-русски.
- source_word: יָבֹאוּ לוֹ
  choice: охватят его
  rationale: Буквально «придут к нему»; в сочетании с муками русский глагол «охватят» естественно передаёт наступление страдания, не усиливая его до явно карательного «настигнут».
- source_word: בֵן לֹא חָכָם
  choice: неразумный сын
  rationale: Сохраняется отрицательная конструкция и продолжается образ сына и рождения; «неразумный» здесь менее морализаторски окрашено, чем «глупый».
- source_word: כִּי עֵת
  choice: когда приходит время
  rationale: Передаёт наступление решающего момента родов, не добавляя к тексту прямо не выраженного определения «положенное» или «должное».
- source_word: לֹא יַעֲמֹד
  choice: не появляется
  rationale: Буквально «не стоит», однако в родильном образе речь о ребёнке, который в решающий момент не оказывается у выхода; «не появляется» естественно выражает подразумеваемое действие, а буквальность отмечена в сноске.
- source_word: בְּמִשְׁבַּר בָּנִים
  choice: у выхода из утробы
  rationale: Трудное выражение связано с местом или моментом прорыва ребёнка при рождении. Перевод сохраняет конкретный родильный образ, а иные возможности отражены в сноске.
theological_decisions:
- issue: К кому относится образ рождения
  choice: Сохранить мужское местоимение и образ сына, не называя прямо Ефрема или Израиль.
  alternative: 'Пояснить в основном тексте: «Ефрем — неразумный сын».'
  rationale: В самом стихе референт не назван существительным, хотя он понятен из контекста. Эксплицитное добавление сняло бы образную и грамматическую форму оригинала.
- issue: Характер неспособности сына родиться
  choice: Передать образ как непоявление у выхода из утробы, не объясняя его как нравственное упорство или физическую невозможность.
  alternative: Истолковать фразу как отказ выйти, промедление либо неспособность родиться.
  rationale: Еврейская метафора допускает смысл рокового промедления, но не уточняет его психологическую или физическую причину; перевод сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным пророческим звучанием. Образ родов сохранён последовательно; синтаксис разделён на два предложения ради ясности, а двоеточие подчёркивает объяснительную связь.
