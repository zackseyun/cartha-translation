base_translation:
  language: en
  yaml_path: translation/ot/hosea/013/015.yaml
  text: Though he may flourish among his brothers[a], an east wind will come—the wind of Yahweh, rising from the wilderness—and his spring will dry up, and his fountain will be dried out[c][b]; it will plunder the storehouse of every precious vessel.
translation:
  language: ru
  text: Хотя он и плодоносит среди братьев[a], придёт восточный ветер — ветер Яхве[b], поднимающийся из пустыни. Иссохнет его источник, пересохнет его родник; он разграбит хранилище всех драгоценных вещей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо он плодоносит среди братьев». Еврейскую фразу можно понять причинно, но контекст допускает уступительный смысл: несмотря на плодородие Ефрема, грядёт суд.'
    reason: lexical_alternative
  - marker: b
    text: «Ветер Яхве» можно также перевести как «дыхание Яхве» или «дух Яхве», однако упоминание восточного ветра, поднимающегося из пустыни, указывает здесь прежде всего на ветер.
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «он разграбит хранилище всякого драгоценного предмета». Субъектом, вероятнее всего, является восточный ветер; возможно также понимание персонифицированного Ефрема или вторгшегося врага.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Хотя… и
  rationale: 'В контексте частица вводит уступку: несмотря на плодородие Ефрема, грядёт суд. При этом причинное «ибо» остаётся формально возможным и отмечено в сноске.'
- source_word: בֵּן אַחִים יַפְרִיא
  choice: он и плодоносит среди братьев
  rationale: Сохраняется игра имени Ефрем с корнем פרה («плодоносить»), а необычное בֵּן אַחִים передаётся естественным русским выражением «среди братьев».
- source_word: קָדִים
  choice: восточный ветер
  rationale: Обычное обозначение знойного и губительного ветра, приходящего из пустыни.
- source_word: רוּחַ יְהוָה
  choice: ветер Яхве
  rationale: В данном образе רוּחַ означает прежде всего ветер, поскольку стоит в приложении к «восточному ветру» и поднимается из пустыни; имя יהוה передано как «Яхве».
- source_word: מִמִּדְבָּר עֹלֶה
  choice: поднимающийся из пустыни
  rationale: Причастная форма сохраняет живость картины и указывает на происхождение губительного ветра.
- source_word: מְקוֹרוֹ … מַעְיָנוֹ
  choice: его источник … его родник
  rationale: Два близких водных образа переданы разными, но параллельными русскими словами.
- source_word: וְיֵבוֹשׁ … וְיֶחֱרַב
  choice: иссохнет … пересохнет
  rationale: Глаголы естественно описывают полное исчезновение воды, сохраняя параллелизм без тяжеловесного пассива.
- source_word: יִשְׁסֶה
  choice: он разграбит
  rationale: Мужской субъект естественно соотносится с ближайшим существительным «ветер»; местоимение сохраняет некоторую образную открытость исходного текста.
- source_word: אוֹצַר כָּל כְּלִי חֶמְדָּה
  choice: сокровищницу со всеми драгоценными вещами
  rationale: אוֹצָר обозначает хранилище ценностей или сокровищницу, а כְּלִי здесь шире буквального «сосуд» и охватывает ценные предметы.
theological_decisions:
- issue: Действующая сила суда
  choice: Восточный ветер назван ветром Яхве и выступает орудием Божьего суда.
  alternative: «Дух Яхве» как более личностный божественный субъект.
  rationale: Сочетание с קָדִים («восточный ветер») и указание на движение из пустыни делают метеорологическое значение основным, не устраняя при этом прямой божественной обусловленности суда.
- issue: Субъект глагола «разграбит»
  choice: Местоимение «он» относится прежде всего к ветру, который образно иссушает и грабит.
  alternative: Подразумеваемый завоеватель либо персонифицированный Ефрем.
  rationale: Грамматически и образно ветер является наиболее близким субъектом, однако краткое местоименное обозначение не устраняет присущую еврейскому тексту некоторую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены растительные и водные образы, а также игра вокруг плодородия Ефрема. Пунктуация делит длинную еврейскую фразу на две русские синтаксические единицы для ясности.
