  to: 'И снова сказал мне Яхве[a]: «Иди, люби женщину, любимую другим и прелюбодействующую, — как Яхве любит сынов Израиля, хотя они обращаются к другим богам и любят лепёшки из изюма[b]».'
  rationale: 'Убрано невыраженное в еврейском тексте противительное «но», чтобы сохранить координацию двух определений женщины. «Полюби» заменено на «люби»: так естественнее передаётся прямое повеление без дополнительного оттенка «начни испытывать любовь». Культурный предмет уточнён как лепёшки из изюма, а сноска объясняет буквальную формулировку и вероятный характер продукта.'
