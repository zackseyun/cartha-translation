source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ע֚וֹד לֵ֣ךְ אֱֽהַב אִשָּׁ֔ה אֲהֻ֥בַת רֵ֖עַ וּ/מְנָאָ֑פֶת כְּ/אַהֲבַ֤ת יְהוָה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הֵ֗ם פֹּנִים֙ אֶל אֱלֹהִ֣ים אֲחֵרִ֔ים וְ/אֹהֲבֵ֖י אֲשִׁישֵׁ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/001.yaml
  text: And Yahweh said to me again[a], “Go, love a woman loved by another and committing adultery, just as Yahweh loves the children of Israel[b], though they turn to other gods and love raisin cakes.”
translation:
  language: ru
  text: 'И снова сказал мне Яхве[a]: «Иди, люби женщину, любимую другим и прелюбодействующую, — как Яхве любит сынов Израиля, хотя они обращаются к другим богам и любят лепёшки из изюма[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И ещё сказал мне Яхве». Еврейское עוֹד может означать «снова», «ещё» или «ещё раз».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «лепёшки из винограда». Вероятно, это прессованные лепёшки из изюма; возможно, их употребляли на празднествах или в языческих обрядах.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, сохраняя его отличие от титула «Господь».
- source_word: עוֹד
  choice: снова
  rationale: В данном повествовательном контексте указывает на повторное обращение Яхве к пророку.
- source_word: לֵךְ אֱהַב
  choice: Иди, полюби
  rationale: Сохраняет два последовательных повеления и лексическую связь глагола «любить» со сравнением о любви Яхве.
- source_word: אִשָּׁה
  choice: женщину
  rationale: Слово может означать как «женщина», так и «жена»; основной текст сохраняет более общее значение, не отождествляя её прямо с Гомерью.
- source_word: אֲהֻבַת רֵעַ
  choice: любимую другим
  rationale: Сохраняет пассивную конструкцию и неопределённость רֵעַ, которое может обозначать близкого, спутника или, по контексту, мужа.
- source_word: וּמְנָאָפֶת
  choice: но прелюбодействующую
  rationale: Причастная форма описывает продолжающееся поведение; союз «но» естественно выражает контраст между тем, что женщину любят, и её неверностью.
- source_word: כְּאַהֲבַת יְהוָה אֶת בְּנֵי יִשְׂרָאֵל
  choice: как Яхве любит сынов Израиля
  rationale: Ясно передаёт сравнение и сохраняет повтор корня אהב — «любить».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Формально и узнаваемо передаёт традиционное национально-заветное выражение.
- source_word: וְהֵם פֹּנִים אֶל אֱלֹהִים אֲחֵרִים
  choice: хотя они обращаются к другим богам
  rationale: «Хотя» раскрывает подразумеваемый уступительный контраст между любовью Яхве и неверностью Израиля; причастие передано как продолжающееся или характерное действие.
- source_word: וְאֹהֲבֵי אֲשִׁישֵׁי עֲנָבִים
  choice: и любят лепёшки с изюмом
  rationale: Сохраняет повтор глагола «любить»; выражение обозначает прессованные лепёшки из винограда или изюма.
theological_decisions:
- issue: Личность женщины в символическом действии Осии
  choice: «женщину», без прямого отождествления с Гомерью
  alternative: «жену» или «свою жену», подразумевая возвращение к Гомери
  rationale: Еврейский текст не называет женщину и не говорит «твою жену», поэтому перевод не разрешает спорный вопрос, оставленный текстом открытым.
- issue: Отношение отступничества Израиля к любви Яхве
  choice: 'уступительная связь: «хотя они обращаются»'
  alternative: 'сочинительная связь: «а они обращаются» или «и они обращаются»'
  rationale: Так естественно выражается сильный контраст между неизменной любовью Яхве и религиозной неверностью Израиля без внесения дополнительного вероучительного содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис прямой и понятный; повтор «любит/любят» сохранён как важный мотив стиха. Неопределённость слов אִשָּׁה и רֵעַ не устранена конфессионально обусловленным толкованием.
