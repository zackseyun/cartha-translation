  text: אַחַ֗ר יָשֻׁ֨בוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בִקְשׁוּ֙ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֔ם וְ/אֵ֖ת דָּוִ֣ד מַלְכָּ֑/ם וּ/פָחֲד֧וּ אֶל יְהוָ֛ה וְ/אֶל טוּב֖/וֹ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/005.yaml
  text: Afterward the children of Israel will return and seek Yahweh their God and David their king[c][b][a], and they will come in fear to Yahweh and to his goodness in the latter days.
translation:
  language: ru
  text: После этого сыны Израиля возвратятся и будут искать Яхве, своего Бога, и Давида, их царя;[a] и в последние дни[b] они с трепетом придут к Яхве и к Его благости.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Давид, их царь» может означать Давида как царственный образ либо будущего царя из рода Давида; еврейский текст этого не уточняет.
    reason: alternative_reading
  - marker: b
    text: 'Или: «в грядущие дни»; также возможно: «в конце дней». Это пророческое выражение допускает несколько оттенков.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «убоятся Яхве и Его благости». Еврейский глагол может означать страх или трепет, а в сочетании с предлогом направления — приближение с трепетом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַר
  choice: После этого
  rationale: Передаёт временную последовательность после описанного в ст. 3–4 и естественно звучит по-русски.
- source_word: יָשֻׁבוּ
  choice: возвратятся
  rationale: Сохраняет широкий смысл שׁוב — возвращение и обращение, не сводя его только к покаянию.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Устойчивое библейское обозначение народа Израиля, сохраняющее родовой и заветный оттенок исходного выражения.
- source_word: וּבִקְשׁוּ
  choice: будут искать
  rationale: Передаёт целенаправленное, усердное стремление к Богу; будущее время выражено явно и естественно для русского синтаксиса.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵיהֶם
  choice: своего Бога
  rationale: Возвратное местоимение естественно соотносит Бога с подлежащим «сыны Израиля» и сохраняет смысл их заветной принадлежности.
- source_word: וְאֵת דָּוִד מַלְכָּם
  choice: и Давида, своего царя
  rationale: Сохраняет прямое именование Давида и не уточняет, идёт ли речь об историческом Давиде или будущем царе из его династии.
- source_word: וּפָחֲדוּ אֶל
  choice: с трепетом придут к
  rationale: Сочетание פחד с אֶל допускает направленное движение в благоговейном страхе; перевод сохраняет и трепет, и приближение.
- source_word: וְאֶל טוּבוֹ
  choice: и к Его благости
  rationale: «Благость» сохраняет возможность понимать טוּב и как качество Бога, и как Его благотворную щедрость.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: в последние дни
  rationale: Устоявшееся пророческое выражение, сохраняющее эсхатологическую открытость фразы.
theological_decisions:
- issue: Кого обозначает «Давид, их царь»
  choice: В основном тексте сохранено прямое именование «Давида, своего царя» без поясняющей подстановки.
  alternative: Исторический Давид либо будущий царь из дома Давида, включая мессианское прочтение.
  rationale: Еврейский текст оставляет референт неразвёрнутым; перевод не должен устранять эту пророческую и богословскую напряжённость.
- issue: Значение פחדו אל יהוה ואל טובו
  choice: «с трепетом придут к Яхве и к Его благости»
  alternative: «убоятся Яхве и Его благости»
  rationale: Предлог אֶל обозначает направленность к Богу; формулировка сочетает приближение с благоговейным страхом и не создаёт впечатления, будто Божья благость является лишь угрозой.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. «Сыны Израиля», «благость» и «с трепетом» сохраняют достоинство и образность оригинала, оставаясь понятными современному читателю. Личное имя передано как «Яхве».
