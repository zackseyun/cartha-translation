  text: כִּ֣י יָמִ֣ים רַבִּ֗ים יֵֽשְׁבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֥ין מֶ֨לֶךְ֙ וְ/אֵ֣ין שָׂ֔ר וְ/אֵ֥ין זֶ֖בַח וְ/אֵ֣ין מַצֵּבָ֑ה וְ/אֵ֥ין אֵפ֖וֹד וּ/תְרָפִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/004.yaml
  text: For many days the sons of Israel will dwell without king or prince[a], without sacrifice or pillar[c][b], and without ephod or household idols.
translation:
  language: ru
  text: Ибо много дней сыны Израиля будут оставаться без царя и без правителя, без жертвы и без каменного столба[a], без эфода[b] и терафимов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стоячего камня»; еврейское слово обозначает культовый каменный памятник.'
    reason: lexical_alternative
  - marker: b
    text: Эфод — еврейский культовый термин, часто обозначающий священническое облачение или связанный с богослужением предмет.
    reason: cultural_note
  - marker: c
    text: Терафимы — домашние культовые предметы или идолы.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предшествующего знамения; «ведь» естественно передаёт пояснительный оттенок, не усиливая его до категорического «воистину».
- source_word: יָמִים רַבִּים
  choice: много дней
  rationale: Сохраняет образ и неопределённую длительность еврейского выражения; более гладкое «долгое время» было бы менее формально прозрачным.
- source_word: יֵשְׁבוּ
  choice: будут оставаться
  rationale: В данном контексте глагол описывает продолжительное пребывание Израиля в определённом состоянии, а не буквальное сидение или место жительства.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Близко передаёт форму исходного выражения и при этом сохраняет его корпоративное значение.
- source_word: אֵין מֶלֶךְ
  choice: без царя
  rationale: Предлог «без» естественно передаёт повторяющуюся конструкцию אֵין и подчёркивает лишённость.
- source_word: שָׂר
  choice: правитель
  rationale: Слово обозначает начальника, высокопоставленного руководителя или властителя; «правитель» ясно передаёт политический смысл и не сужает его до наследственного княжеского титула.
- source_word: זֶבַח
  choice: жертва
  rationale: Обычный и понятный русский эквивалент для закалываемой жертвы или жертвоприношения.
- source_word: מַצֵּבָה
  choice: священный камень
  rationale: Передаёт культовый стоячий камень точнее, чем неопределённое «столб»; сноска сохраняет возможные варианты формы памятника.
- source_word: אֵפוֹד
  choice: эфод
  rationale: Сохранён транслитерированный культовый термин, поскольку в разных контекстах он может обозначать священническое облачение либо связанный с культом предмет.
- source_word: תְרָפִים
  choice: терафимы
  rationale: Транслитерация сохраняет неоднозначность конкретного вида домашних культовых предметов; значение поясняется в сноске без преждевременного сведения термина только к одному типу идолов.
theological_decisions:
- issue: Включает ли перечень как признанные, так и осуждаемые формы культа
  choice: Передать все предметы прямо, не классифицируя весь перечень как исключительно законное или исключительно незаконное богослужение.
  alternative: Истолковать весь перечень либо как принадлежности только ложного культа, либо как принадлежности только истинного богослужения.
  rationale: В стихе рядом стоят жертва и эфод, которые могут быть связаны с признанным богослужением, и священный камень с терафимами, часто связанными с осуждаемой практикой. Перевод сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Повтор «без» сохранён для ритма и мотива лишения; технические культовые термины пояснены сносками.
