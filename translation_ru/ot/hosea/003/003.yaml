source:
  edition: WLC
  text: וָ/אֹמַ֣ר אֵלֶ֗י/הָ יָמִ֤ים רַבִּים֙ תֵּ֣שְׁבִי לִ֔/י לֹ֣א תִזְנִ֔י וְ/לֹ֥א תִֽהְיִ֖י לְ/אִ֑ישׁ וְ/גַם אֲנִ֖י אֵלָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/003/003.yaml
  text: And I said to her, “You must remain for me many days; you must not prostitute yourself, and you must not belong to a man; and I also will be toward you.”
translation:
  language: ru
  text: 'И я сказал ей: «Много дней оставайся для меня; не предавайся блуду и не принадлежь мужчине; и я также буду с тобой[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и я также — к тебе»; эта краткая фраза может означать верность или особое отношение к ней.'
    reason: Сохраняет подлинную эллиптичность и смысловую неоднозначность еврейского текста.
lexical_decisions:
- source_word: תֵּשְׁבִי לִי
  choice: оставайся для меня
  rationale: Сохраняет направленность לִי («для меня») и передаёт длительное пребывание без излишнего уточнения характера отношений.
- source_word: לֹא תִזְנִי
  choice: не занимайся блудом
  rationale: Глагол זנה здесь обозначает половую распущенность или проституцию; «заниматься блудом» сохраняет широкий смысл и достойный библейский регистр.
- source_word: וְלֹא תִהְיִי לְאִישׁ
  choice: и не принадлежь другому мужчине
  rationale: 'Буквально: «и не будь для мужчины». «Принадлежать мужчине» естественно передаёт устойчивую половую или супружескую связь; «другому» подразумевается противопоставлением говорящему.'
- source_word: וְגַם אֲנִי אֵלָיִךְ
  choice: и я также буду с тобой
  rationale: Эллиптическое אֵלָיִךְ буквально значит «к тебе / по отношению к тебе». В русском «буду с тобой» естественно сохраняет обещание взаимной исключительности, не добавляя явно отсутствующего глагола.
theological_decisions:
- issue: Смысл заключительной эллиптической фразы וְגַם אֲנִי אֵלָיִךְ
  choice: «и я также буду с тобой» с примечанием о буквальном выражении
  alternative: «и я также буду по отношению к тебе» / «и я также не войду к тебе»
  rationale: Масоретский текст не содержит отрицания и глагола «входить». Перевод не вводит распространённое толкование о половом воздержании как если бы оно было прямо выражено, но отмечает неоднозначность конструкции.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Повелительные формы переданы прямо; синтаксическая краткость оригинала в основном сохранена.
