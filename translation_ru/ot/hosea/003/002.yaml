  terminology: «Сиклей серебра», «хомер», «летех» и «ячмень» соответствуют исходному тексту и не вносят конфессионального истолкования. Примечание о летехе корректно выражает вероятностный характер соотношения меры. Сноску о подразумеваемой денежной единице следует поставить непосредственно после «серебра», а культурную сноску — после «летеха».
