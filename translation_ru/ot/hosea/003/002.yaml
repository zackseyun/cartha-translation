  yaml_path: translation/ot/hosea/003/002.yaml
  text: So I bought her for myself for fifteen shekels of silver and a homer and a lethech of barley[a][b].
translation:
  language: ru
  text: И я приобрёл её для себя за пятнадцать сиклей серебра[b] и за хомер ячменя и летех ячменя[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Летех, вероятно, был мерой сыпучих тел, равной половине хомера.
    reason: cultural_note
  - marker: b
    text: 'Или: «за пятнадцать кусков серебра». Буквально в еврейском тексте: «за пятнадцать серебра»; денежная единица подразумевается из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶכְּרֶהָ
  choice: я приобрёл её
  rationale: Глагол כרה в данном контексте означает приобретение за плату. «Приобрёл» естественно передаёт это значение, не сужая его непременно до обычной купли-продажи.
- source_word: לִּי
  choice: для себя
  rationale: Передаёт дательный личной заинтересованности и его возвратный оттенок.
- source_word: בַּחֲמִשָּׁה עָשָׂר כָּסֶף
  choice: за пятнадцать сиклей серебра
  rationale: В еврейском буквально сказано «за пятнадцать серебра»; денежная единица подразумевается. Уточнение «сиклей» делает смысл понятным современному читателю, а примечание сохраняет буквальную форму и возможный перевод.
- source_word: חֹמֶר
  choice: хомер
  rationale: Сохранено древнее название меры сыпучих тел, чтобы избежать неточного пересчёта в современные единицы.
- source_word: שְׂעֹרִים
  choice: ячменя
  rationale: Прямое соответствие названию зерновой культуры; один родительный оборот естественно относится к обеим названным мерам.
- source_word: לֵתֶךְ
  choice: летех
  rationale: Сохранено конкретное древнее название меры; её вероятное соотношение с хомером пояснено в примечании.
theological_decisions:
- issue: Характер приобретения женщины
  choice: приобрёл её
  alternative: купил её
  rationale: Контекст указывает на приобретение за плату, однако точный правовой или общественный характер сделки не назван. «Приобрёл» сохраняет эту неопределённость лучше, чем более узкое «купил».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Древние меры переданы транслитерацией; порядок цены и натуральной платы сохранён близко к еврейскому тексту.
