  variant: modern literary Russian
source:
  edition: WLC
  text: לֹ֤א יִתְּנוּ֙ מַ֣עַלְלֵי/הֶ֔ם לָ/שׁ֖וּב אֶל אֱלֹֽהֵי/הֶ֑ם כִּ֣י ר֤וּחַ זְנוּנִים֙ בְּ/קִרְבָּ֔/ם וְ/אֶת יְהוָ֖ה לֹ֥א יָדָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/004.yaml
  text: Their deeds do not allow them to return to their God[a], for a spirit of whoredom is within them, and they do not know Yahweh.
translation:
  language: ru
  text: Их поступки не позволяют им вернуться к своему Богу, потому что в них — дух распутства[a], и Яхве они не знают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух блуда»; возможно также: «дух проституции». В еврейском тексте образ половой неверности обозначает неверность завету и идолопоклонство.'
    reason: Лексическая альтернатива и пояснение пророческого образа.
lexical_decisions:
- source_word: יִתְּנוּ
  choice: не позволяют
  rationale: 'В сочетании с לָשׁוּב глагол נתן образует идиоматический смысл: их поступки не дают им вернуться. «Не позволяют» естественно передаёт его по-русски.'
- source_word: מַעַלְלֵיהֶם
  choice: их поступки
  rationale: Слово обозначает совершённые дела и здесь несёт нравственную оценку; «поступки» звучит естественно и сохраняет обвинительный тон.
- source_word: לָשׁוּב
  choice: вернуться
  rationale: Сохраняет как прямой смысл возвращения, так и подразумеваемый призыв вновь обратиться к Богу, не сводя выражение только к понятию покаяния.
- source_word: אֶל אֱלֹהֵיהֶם
  choice: к своему Богу
  rationale: Контекст завета указывает на Бога Израиля. Возвратное «своему» естественно по-русски передаёт местоименный суффикс и принадлежность народа Богу завета.
- source_word: רוּחַ זְנוּנִים
  choice: дух распутства
  rationale: «Распутство» сохраняет сильный образ половой неверности, посредством которого Осия изображает идолопоклонство и нарушение завета, и при этом понятно современному русскому читателю.
- source_word: בְּקִרְבָּם
  choice: в них
  rationale: Кратко и естественно передаёт внутреннюю укоренённость нравственно-духовного состояния народа; возможен также коллективный смысл «среди них».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: לֹא יָדָעוּ
  choice: не знают
  rationale: Прямой перевод сохраняет одновременно познавательный и заветно-личностный оттенки ידע, не сужая их до «не признают» или «не повинуются».
theological_decisions:
- issue: Образ половой неверности
  choice: «дух распутства» с пояснением в сноске
  alternative: «дух блуда»; «дух проституции»
  rationale: Формулировка сохраняет резкость пророческого образа заветной неверности и идолопоклонства, оставаясь понятной в современном литературном русском языке.
- issue: Заветный смысл глагола «знать»
  choice: «Яхве они не знают»
  alternative: «они не признают Яхве»; «у них нет отношений с Яхве»
  rationale: Буквальная формулировка удерживает смысловую напряжённость между знанием о Боге и личным, заветным знанием Бога.
- issue: Число и референт אֱלֹהֵיהֶם
  choice: 'единственное число: «к своему Богу»'
  alternative: «к своим богам»
  rationale: В контексте пророческого обвинения речь идёт о возвращении Израиля к его Богу завета, от которого народ уклонился.
- issue: Связь поступков и возвращения
  choice: «поступки не позволяют им вернуться»
  alternative: «они не направляют своих поступков к тому, чтобы вернуться»
  rationale: Масоретский текст грамматически допускает понимание поступков как препятствия возвращению; выбранный вариант передаёт наиболее прямое чтение, не уточняя механизм этого препятствия.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «Яхве они не знают» сохраняет акцент еврейской конструкции на объекте и звучит выразительно, но не архаично. Сильная метафора не смягчена, а пояснена сноской.
