base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/012.yaml
  text: So I am like a moth to Ephraim[a], and like rot to the house of Judah.
translation:
  language: ru
  text: И Я — как моль для Ефрема и как гниль для дома Иуды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲנִי
  choice: И Я
  rationale: Союз ו перед самостоятельным местоимением вводит новое Божье заявление и сохраняет подчёркнутое «Я». Русское «И Я» передаёт это без излишнего уточнения причинно-следственной связи.
- source_word: כָעָשׁ
  choice: словно моль
  rationale: עָשׁ обычно обозначает моль и здесь служит образом медленного, постепенного разрушения. «Словно моль» сохраняет прямое сравнение.
- source_word: לְאֶפְרָיִם
  choice: для Ефрема
  rationale: Предлог ל указывает, по отношению к кому действует сравнение. «Для Ефрема» естественно звучит по-русски и сохраняет конкретное название северного царства.
- source_word: וְכָרָקָב
  choice: и словно тление
  rationale: רָקָב означает гниение, гниль, тление — внутреннее разложение и постепенное разрушение. «Тление» передаёт образ ёмко и в достойном литературном регистре; союз и сравнительная частица отражены отдельно.
- source_word: לְבֵית יְהוּדָה
  choice: для дома Иуды
  rationale: 'Сохранено выражение «дом Иуды» с его собирательным значением: народ и южное царство, рассматриваемые как единый дом.'
theological_decisions:
- issue: Бог описывает Себя посредством образов разрушения
  choice: 'Сохранены именные сравнения: Бог — словно моль для Ефрема и словно тление для дома Иуды.'
  alternative: 'Передать следствие пояснительно: «Я буду разъедать Ефрема, как моль, и предам дом Иуды гниению».'
  rationale: В еврейском тексте стоят прямые именные сравнения без поясняющих глаголов. Их сохранение удерживает напряжённый пророческий образ постепенного Божьего суда и не превращает его в толкование.
translation_notes:
  register: Современный литературный русский язык с лаконичным и торжественным звучанием. Тире после «Я» естественно оформляет именное сравнение; повтор «словно» сохраняет параллелизм еврейской строки.
