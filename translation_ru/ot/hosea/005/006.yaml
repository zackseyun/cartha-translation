source:
  edition: WLC
  text: בְּ/צֹאנָ֣/ם וּ/בִ/בְקָרָ֗/ם יֵֽלְכ֛וּ לְ/בַקֵּ֥שׁ אֶת יְהוָ֖ה וְ/לֹ֣א יִמְצָ֑אוּ חָלַ֖ץ מֵ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/006.yaml
  text: With their flocks and with their herds they will go to seek Yahweh[a], but they will not find him[b]; he has withdrawn from them.
translation:
  language: ru
  text: 'Со своими отарами и стадами[a] они пойдут искать Яхве, но не найдут его: он удалился от них[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Упоминание отар и стад, вероятно, означает, что они придут искать Яхве с животными для жертвоприношений.
    reason: cultural_note
  - marker: b
    text: 'Или: «отошёл от них»; «отстранился от них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֹאנָם וּבִבְקָרָם
  choice: со своими отарами и стадами
  rationale: 'Предлог ב передаёт сопровождение: они идут вместе со своим скотом. צֹאן обозначает мелкий скот, прежде всего овец и коз, а בָּקָר — крупный рогатый скот; сочетание «отары и стада» естественно сохраняет это различие.'
- source_word: יֵלְכוּ לְבַקֵּשׁ
  choice: они пойдут искать
  rationale: Имперфект יֵלְכוּ в пророческом контексте естественно передаётся будущим временем, а בקש по отношению к Богу означает «искать», стремиться обрести доступ к нему или его благоволение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом.
- source_word: וְלֹא יִמְצָאוּ
  choice: но не найдут его
  rationale: Союз передан противительным «но» по смыслу контекста. Местоимение «его», подразумеваемое в еврейском тексте как объект предшествующего поиска, добавлено ради естественности русского синтаксиса.
- source_word: חָלַץ מֵהֶם
  choice: он удалился от них
  rationale: В данном контексте חלץ выражает устранение или отдаление себя. Совершенный вид передаёт уже совершившееся действие, вследствие которого Яхве недоступен их поискам.
theological_decisions:
- issue: Передача имени Бога
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблён тетраграмматон יהוה; личное имя сохраняется без замены титулом.
- issue: Характер поисков Яхве
  choice: Жертвенный контекст оставлен подразумеваемым в основном тексте и пояснён в сноске
  alternative: Прямо добавить в основной текст, что животных ведут для жертвоприношений
  rationale: Упоминание мелкого и крупного скота, вероятно, предполагает принесение жертв, однако сам еврейский текст не называет жертвоприношение прямо; поэтому вывод не внесён в текст как явное утверждение.
- issue: Причина безуспешного поиска
  choice: Поиск безуспешен, потому что Яхве уже удалился от них
  alternative: Поиск Бога сам по себе тщетен
  rationale: Заключительная фраза указывает конкретную причину неудачи и не утверждает общей тщетности поиска Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формулировка краткая и естественная; строчные местоимения при упоминании Бога соответствуют обычной современной орфографической норме и не выражают богословской оценки.
