  terminology: «Яхве» последовательно передаёт тетраграмматон. Термины и регистр не навязывают конфессионального толкования. Сноска a осторожно отмечает вероятный жертвенный контекст, не внося его в основной текст; сноска b корректно даёт лексические альтернативы для חָלַץ. Якоря сносок поставлены при соответствующих элементах русского текста и логичнее, чем в английском аудиторском следе.
