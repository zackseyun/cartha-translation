  source_fidelity: 'Текст точно передаёт еврейский оригинал: בְּצֹאנָם וּבִבְקָרָם передано естественным сочетанием «со своими отарами и стадами», пророческий имперфект — будущим временем («пойдут»), а לְבַקֵּשׁ יהוה — «искать Яхве». Противительный смысл передан уместным «но». Подразумеваемое дополнение «его» оправдано русским синтаксисом. חָלַץ מֵהֶם корректно передано как уже совершившееся удаление: «он удалился от них».'
