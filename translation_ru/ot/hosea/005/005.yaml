  yaml_path: translation/ot/hosea/005/005.yaml
  text: The pride of Israel testifies against him[a], and Israel and Ephraim will stumble in their guilt[c][b]; Judah also will stumble with them.
translation:
  language: ru
  text: Гордость Израиля свидетельствует против него[a], и Израиль и Ефрем споткнутся из-за своей вины[b]; Иуда также споткнулся вместе с ними[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свидетельствует ему в лицо» либо «свидетельствует перед ним». Буквальный пространственный оборот допускает эти варианты, тогда как основной текст передаёт вероятный судебный смысл.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «в своей вине»; возможно также: «в своём беззаконии». Еврейское слово может обозначать как проступок, так и вину или её последствия.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «Иуда также споткнётся вместе с ними» или «Иуда также спотыкается вместе с ними». Форма еврейского глагола отличается от формы в предыдущей части стиха и допускает разные временно-аспектуальные толкования.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנָה
  choice: свидетельствует
  rationale: 'Глагол ענה здесь имеет судебный оттенок: гордость Израиля выступает свидетельством против него. Настоящее время естественно передаёт действие этого свидетельства в пророческом обвинении.'
- source_word: גְאוֹן
  choice: гордость
  rationale: Хотя слово может означать величие или возвышенность, контекст обвинения, вины и падения указывает на отрицательный смысл — гордость.
- source_word: בְפָנָיו
  choice: против него
  rationale: Буквально выражение связано с лицом («перед его лицом», «ему в лицо»), но в сочетании с глаголом свидетельства вероятнее всего имеет судебный смысл «против него».
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено собственное имя; единственное число местоимения в первой части отражает корпоративное понимание Израиля.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено традиционное русское написание имени, которое у Осии часто обозначает Северное царство.
- source_word: יִכָּשְׁלוּ
  choice: споткнутся
  rationale: Перевод сохраняет метафору כשל и форму будущего времени, не сводя образ сразу к окончательному падению.
- source_word: בַּעֲוֹנָם
  choice: из-за своей вины
  rationale: עָוֹן охватывает вину, беззаконие и его последствия. Причинное «из-за» естественно по-русски и ясно передаёт связь между виной и падением, хотя еврейский предлог допускает более буквальное «в своей вине».
- source_word: כָּשַׁל
  choice: споткнулся
  rationale: Форма qatal отличается от предшествующего imperfect и передана прошедшим совершенным видом, чтобы сохранить возможное аспектуальное различие, не превращая его в жёсткую хронологическую схему.
- source_word: גַּם
  choice: и
  rationale: В конструкции «вместе с ними… и Иуда» русское «и» естественно выражает добавочное значение «также».
- source_word: עִמָּם
  choice: вместе с ними
  rationale: Указывает, что Иуда разделяет падение Израиля и Ефрема.
theological_decisions:
- issue: Смысл «гордости Израиля»
  choice: Нравственная гордость Израиля свидетельствует против него
  alternative: Величие или возвышенное положение Израиля свидетельствует перед ним
  rationale: Контекст обличения, вины и падения поддерживает отрицательное нравственное значение, но пространственно-судебная неоднозначность вынесена в примечание.
- issue: Временной и аспектуальный смысл כָּשַׁל применительно к Иуде
  choice: «споткнулся» — прошедший совершенный вид
  alternative: «споткнётся» или «спотыкается»
  rationale: Так сохраняется формальное отличие qatal от предшествующего יִכָּשְׁלוּ. Поскольку пророческая речь допускает разные временные прочтения, варианты отмечены в сноске.
- issue: Связь вины с падением
  choice: 'Причинное прочтение: «из-за своей вины»'
  alternative: 'Сферическое прочтение: «в своей вине» или лексически «в своём беззаконии»'
  rationale: Русская причинная конструкция наиболее ясна в контексте суда, однако семантическая широта עָוֹן и предлога ב сохраняется в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранена метафора спотыкания и различие глагольных форм; судебный смысл первой строки передан естественным русским оборотом. Все примечания обозначены в основном тексте.
