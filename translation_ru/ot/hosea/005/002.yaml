  terminology: 'Терминологические решения последовательны: «отступники» и «вразумление» не привносят конфессионально обусловленного толкования. Альтернативы в сносках достаточно отражают лексический диапазон. Маркеры стоят после соответствующих единиц и структурных ошибок нет.'
