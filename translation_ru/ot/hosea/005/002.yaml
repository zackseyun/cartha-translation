  text: וְ/שַׁחֲטָ֥ה שֵׂטִ֖ים הֶעְמִ֑יקוּ וַ/אֲנִ֖י מוּסָ֥ר לְ/כֻלָּֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/002.yaml
  text: The rebels have gone deep into slaughter[b][a], but I am a rebuke to all of them.
translation:
  language: ru
  text: Отступники[a] глубоко погрязли в резне, но Я — вразумление для них всех[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мятежники»; возможно также: «уклонившиеся».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но Я — наказание для них всех»; возможно также: «наставление для них всех».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁחֲטָה
  choice: в резне
  rationale: Существительное обозначает резню, заклание или убийство. Предложное сочетание естественно соединяется с образом глубокого погружения в кровопролитие; начальный союз отдельно не передан.
- source_word: שֵׂטִים
  choice: отступники
  rationale: Слово обозначает тех, кто уклонился или отвернулся. «Отступники» сохраняет религиозно-нравственную силу обвинения и не требует более узкого термина «вероотступники».
- source_word: הֶעְמִיקוּ
  choice: глубоко погрязли
  rationale: Форма буквально передаёт углубление и в контексте выражает крайнюю степень вовлечённости во зло. Русское «глубоко погрязли» сохраняет метафору и звучит естественно.
- source_word: וַאֲנִי
  choice: но Я
  rationale: Союз понят как контраст между преступлением отступников и ответом Господа.
- source_word: מוּסָר
  choice: вразумление
  rationale: Слово охватывает исправление, дисциплинарное воздействие и наставление. «Вразумление» сохраняет сочетание педагогического и взыскательного оттенков, не сводя смысл только к наказанию.
- source_word: לְכֻלָּם
  choice: для них всех
  rationale: Передаёт значение предлога ל и подчёркивает, что Божье вразумление относится ко всем названным людям.
theological_decisions:
- issue: Кто говорит и каков характер Божьего ответа
  choice: Говорящий — Господь; Он называет Себя вразумлением для всех отступников.
  alternative: Можно понимать מוּסָר преимущественно как наказание, обличение либо наставление.
  rationale: Контекст суда придаёт слову взыскательный смысл, однако его назидательная многозначность сохранена в основном тексте и пояснена в сноске.
- issue: Необычная именная конструкция «Я — вразумление»
  choice: Сохранена именная конструкция исходного текста.
  alternative: 'Передать глагольно: «Я вразумлю их всех» или «Я накажу их всех».'
  rationale: Глагольная передача была бы естественнее по-русски, но устранила бы выразительную и богословски значимую напряжённость еврейской формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством прорным пророческим тоном. Метафора глубины сохранена без архаизмов; необычная именная фраза намеренно оставлена ради близости к еврейскому тексту.
