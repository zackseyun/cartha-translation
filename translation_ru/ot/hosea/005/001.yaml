id: HOS.5.1
reference: Hosea 5:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: שִׁמְעוּ זֹ֨את הַ/כֹּהֲנִ֜ים וְ/הַקְשִׁ֣יבוּ בֵּ֣ית יִשְׂרָאֵ֗ל וּ/בֵ֤ית הַ/מֶּ֨לֶךְ֙ הַאֲזִ֔ינוּ כִּ֥י לָ/כֶ֖ם הַ/מִּשְׁפָּ֑ט כִּֽי פַח֙ הֱיִיתֶ֣ם לְ/מִצְפָּ֔ה וְ/רֶ֖שֶׁת פְּרוּשָׂ֥ה עַל תָּבֽוֹר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/001.yaml
  text: Hear this[a], O priests; pay attention, house of Israel; and give ear, house of the king. For the judgment is for you[b], because you have been a trap at Mizpah and a net spread out upon Tabor.
translation:
  language: ru
  text: 'Слушайте это, священники! Внимайте, дом Израиля! Внемлите, царский дом! Ибо вам — суд[a]: вы стали западнёй в Мицпе и сетью, раскинутой на Фаворе[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суд против вас». Краткое еврейское выражение может означать как то, что суд касается вас, так и то, что он направлен против вас.'
    reason: alternative_reading
  - marker: b
    text: Мицпа и Фавор — географические названия; здесь они, вероятно, напоминают об известных местах Израиля и связаны с образом ловушек.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Естественно передаёт повелительное значение שׁמע и открывает трёхчастный пророческий призыв.
- source_word: הַקְשִׁיבוּ
  choice: Внимай
  rationale: Передаёт усиленный призыв к вниманию и сохраняет отличие от первого глагола; единственное число согласовано с собирательным «дом Израиля».
- source_word: הַאֲזִינוּ
  choice: Прислушайся
  rationale: Сохраняет третий, отличный глагол слухового восприятия; форма единственного числа согласована с «царский дом».
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет формальное коллективное и заветное обозначение еврейского текста.
- source_word: בֵּית הַמֶּלֶךְ
  choice: царский дом
  rationale: Естественное современное русское выражение, способное обозначать династию или двор и сохраняющее параллель с «домом Израиля».
- source_word: כִּי לָכֶם הַמִּשְׁפָּט
  choice: Ибо вам — суд
  rationale: 'Компактная русская конструкция близко передаёт краткость и неоднозначность еврейской фразы: суд предназначен им, относится к ним или направлен против них.'
- source_word: פַח
  choice: западня
  rationale: Ясно передаёт приспособление для поимки добычи и хорошо сочетается с последующим образом сети.
- source_word: לְמִצְפָּה
  choice: в Мицпе
  rationale: Предлог перед топонимом естественно понимается локативно; имя передано транслитерацией, принятой в современной библейской русской традиции.
- source_word: רֶשֶׁת פְּרוּשָׂה
  choice: сетью, раскинутой
  rationale: Сохраняет конкретный образ и пассивное значение еврейского сочетания.
- source_word: עַל תָּבוֹר
  choice: на Фаворе
  rationale: Естественно передаёт местоположение на горе; используется укоренившаяся русская форма топонима.
theological_decisions:
- issue: Смысл выражения כִּי לָכֶם הַמִּשְׁפָּט
  choice: '«Ибо вам — суд»: адресаты представлены как подлежащие Божьему суду, но направление фразы не уточняется сверх еврейского текста.'
  alternative: «Ибо суд против вас» или более нейтральное «ибо судебное дело касается вас».
  rationale: Контекст обвинения и образы западни и сети указывают на виновность и неблагоприятный суд, однако компактная конструкция позволяет сохранить исходную смысловую напряжённость.
- issue: Кого обозначает «царский дом»
  choice: Сохранено собирательное обозначение без уточнения.
  alternative: «Царская династия» или «царский двор».
  rationale: Еврейское выражение может охватывать династию, двор или правящую элиту; конкретизация сняла бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Три разных повелительных глагола сохраняют риторическое нарастание оригинала. Восклицательные знаки обозначают настойчивость обращений, а тире в «вам — суд» передаёт компактность и напряжённость еврейской конструкции.
