  text: וַ/יַּ֨רְא אֶפְרַ֜יִם אֶת חָלְי֗/וֹ וִֽ/יהוּדָה֙ אֶת מְזֹר֔/וֹ וַ/יֵּ֤לֶךְ אֶפְרַ֨יִם֙ אֶל אַשּׁ֔וּר וַ/יִּשְׁלַ֖ח אֶל מֶ֣לֶךְ יָרֵ֑ב וְ/ה֗וּא לֹ֤א יוּכַל֙ לִ/רְפֹּ֣א לָ/כֶ֔ם וְ/לֹֽא יִגְהֶ֥ה מִ/כֶּ֖ם מָזֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/013.yaml
  text: When Ephraim saw his sickness[a], and Judah his wound, then Ephraim went to Assyria and sent to King Jareb; but he cannot heal you, nor can he cure your wound.
translation:
  language: ru
  text: Когда Ефрем увидел свою болезнь, а Иуда — свою рану, Ефрем пошёл к Ассирии и послал к царю Яреву[a]. Но он не сможет исцелить вас и не избавит вас от раны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «к царю-мстителю» либо «к великому царю»; еврейское Ярев может быть не личным именем, а титулом.'
    reason: Неясное еврейское выражение מֶלֶךְ יָרֵב допускает понимание יָרֵב как имени либо как описательного титула.
lexical_decisions:
- source_word: חָלְיוֹ
  choice: свою болезнь
  rationale: Сохраняет медицинскую метафору национального бедствия и естественно звучит по-русски.
- source_word: מְזֹרוֹ / מָזוֹר
  choice: свою рану / от раны
  rationale: Слово обозначает рану или болезненную язву; «рана» передаёт телесную метафору, не уточняя характер повреждения сверх исходного текста.
- source_word: אַשּׁוּר
  choice: Ассирия
  rationale: В контексте это название державы; употреблена общепринятая русская форма.
- source_word: מֶלֶךְ יָרֵב
  choice: царь Ярев
  rationale: Неясное יָרֵב сохранено в основном тексте как имя или титульное обозначение, без навязывания спорной этимологии; возможные описательные понимания вынесены в сноску.
- source_word: לָכֶם
  choice: вас
  rationale: При רפא предлог ל указывает на объект или получателя исцеления; русское «исцелить вас» естественно передаёт смысл.
- source_word: יִגְהֶה מִכֶּם
  choice: избавит вас от раны
  rationale: Редкий глагол в сочетании с מן описывает устранение недуга; такой перевод сохраняет образ удаления раны и остаётся понятным современному читателю.
- source_word: וְהוּא
  choice: но он
  rationale: Союз передан противительно, поскольку обращение за помощью противопоставлено неспособности царя помочь.
- source_word: וַיִּשְׁלַח
  choice: послал к
  rationale: 'Сохраняет отсутствие выраженного дополнения: исходный текст не уточняет, кого именно послал Ефрем.'
theological_decisions:
- issue: К кому относится местоимение וְהוּא («но он»)
  choice: К царю Яреву как ближайшему грамматическому предшественнику.
  alternative: К Ассирии как политической силе в целом.
  rationale: Мужское местоимение единственного числа непосредственно следует за «царём Яревом». При этом более широкая мысль о бессилии Ассирии как внешней опоры остаётся доступной из контекста.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим звучанием. Эллипсис во фразе об Иуде передан тире. Множественное «вас» сохранено, поскольку речь охватывает адресатов, представленных Ефремом и Иудой.
