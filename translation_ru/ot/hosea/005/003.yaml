id: HOS.5.3
reference: Hosea 5:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אֲנִי֙ יָדַ֣עְתִּי אֶפְרַ֔יִם וְ/יִשְׂרָאֵ֖ל לֹֽא נִכְחַ֣ד מִמֶּ֑/נִּי כִּ֤י עַתָּה֙ הִזְנֵ֣יתָ אֶפְרַ֔יִם נִטְמָ֖א יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/003.yaml
  text: I know Ephraim[a], and Israel is not hidden from me; for now, Ephraim, you have played the prostitute[b]; Israel is defiled.
translation:
  language: ru
  text: 'Я знаю Ефрема[a],

    и Израиль от Меня не скрыт.

    Ведь теперь ты предался блуду[b], Ефрем,

    и Израиль осквернился.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У Осии именем Ефрем часто обозначается всё Северное царство Израиля.
    reason: historical_context
  - marker: b
    text: Образ блуда означает неверность Израиля завету с Богом.
    reason: metaphor_clarification
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: Я знаю
  rationale: Перфект здесь выражает твёрдое и актуальное знание Бога; настоящее время естественно передаёт смысл пророческого заявления.
- source_word: נִכְחַד מִמֶּנִּי
  choice: от Меня не скрыт
  rationale: Сохраняет пассивное значение нифаля и не добавляет модального оттенка «не может скрыться», которого прямо нет в тексте.
- source_word: כִּי עַתָּה
  choice: ведь теперь
  rationale: «Ведь» передаёт пояснительную функцию כִּי, а «теперь» — временной акцент עַתָּה.
- source_word: הִזְנֵיתָ
  choice: ты предался блуду
  rationale: Сохраняет резкий образ проституции и половой неверности, применённый у Осии к нарушению завета, но звучит естественно и достойно по-русски.
- source_word: נִטְמָא
  choice: осквернился
  rationale: Передаёт наступившее состояние ритуально-нравственной нечистоты и сохраняет возвратный результативный оттенок формы нифаль.
- source_word: אֶפְרַיִם / יִשְׂרָאֵל
  choice: Ефрем / Израиль
  rationale: Оба имени сохранены, чтобы не устранять поэтический параллелизм и возможное различие их референции; в контексте Осии Ефрем часто представляет Северное царство.
theological_decisions:
- issue: Образ блуда как обозначение неверности завету
  choice: 'Сохранить прямой образ: «ты предался блуду»'
  alternative: «ты оказался неверен»
  rationale: Смягчённый вариант передал бы общий смысл, но устранил бы намеренно резкую и богословски значимую метафору Осии.
- issue: Временной аспект Божьего знания
  choice: «Я знаю»
  alternative: «Я знал» или «Я познал»
  rationale: В контексте речь идёт о нынешнем, полном знании Богом Ефрема; перевод в настоящем времени не ограничивает высказывание прошлым.
- issue: Соотношение Ефрема и Израиля
  choice: Сохранить оба наименования без отождествляющей вставки
  alternative: Пояснить в тексте, что Ефрем означает Северное царство Израиля
  rationale: Еврейский текст ставит имена в параллель, но не формулирует их полного тождества; пояснение вынесено в сноску, чтобы не устранять возможную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Строковое членение сохраняет параллелизм. Прописное «Меня» следует принятой русской издательской практике при прямой речи Бога; лексика остаётся понятной без излишней архаизации.
