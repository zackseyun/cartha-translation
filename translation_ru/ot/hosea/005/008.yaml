base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/008.yaml
  text: 'Blow the horn in Gibeah[a], the trumpet in Ramah; raise the battle cry at Beth-aven: “Behind you[b], Benjamin!”'
translation:
  language: ru
  text: 'Трубите рогом в Гиве, трубой — в Раме; поднимите боевой клич в Бет-Авене[a]: «Позади тебя, Вениамин!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Бет-Авен», вероятно, полемически заменяет здесь «Вефиль» и может пониматься как «дом нечестия» или «дом суеты».
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְעוּ
  choice: Трубите
  rationale: Форма повелительного наклонения множественного числа от תקע обозначает подачу сигнала духовым инструментом; «трубите» естественно передаёт действие по-русски.
- source_word: שׁוֹפָר
  choice: рог
  rationale: Это роговой сигнальный инструмент, отличный от חֲצֹצְרָה в следующей строке; «рог» сохраняет различие между двумя инструментами.
- source_word: בַּגִּבְעָה
  choice: в Гиве
  rationale: Передаёт еврейское название места גבעה в принятой русской библейской форме и сохраняет предлог.
- source_word: חֲצֹצְרָה
  choice: в трубу
  rationale: חֲצֹצְרָה — металлическая труба, отличная от שׁוֹפָר; глагол «трубите» во второй параллельной части подразумевается и естественно не повторяется.
- source_word: בָּרָמָה
  choice: в Раме
  rationale: Передаёт название места רמה в принятой русской библейской форме, параллельно выражению «в Гиве».
- source_word: הָרִיעוּ
  choice: поднимите боевой клич
  rationale: Побудительная форма в данном военном контексте выражает громкий тревожный или боевой сигнал; выбранная формулировка сохраняет срочность и военную окраску.
- source_word: בֵּית אָוֶן
  choice: Бет-Авен
  rationale: Название транслитерировано, а его вероятная полемическая связь с Вефилем и смысловая игра вынесены в примечание, чтобы не подменять исходный топоним толкованием.
- source_word: אַחֲרֶיךָ
  choice: у тебя за спиной
  rationale: Буквально указывает на нахождение «позади тебя»; в отрывистом возгласе звучит как предупреждение о приближающейся с тыла опасности, но источник прямо не называет врага.
- source_word: בִּנְיָמִין
  choice: Вениамин
  rationale: Сохранена традиционная русская форма имени; в контексте это обращение к племени или его территории.
theological_decisions:
- issue: Полемическое употребление בֵּית אָוֶן вместо Вефиля
  choice: Сохранить в основном тексте топоним «Бет-Авен», пояснив возможную игру слов в примечании.
  alternative: Передать как «дом нечестия/суеты» либо заменить названием «Вефиль».
  rationale: В еврейском тексте стоит собственное название, вероятно служащее полемическим переименованием Вефиля. Транслитерация сохраняет форму источника, а примечание раскрывает аллюзию без превращения вероятного толкования в основной текст.
- issue: Отрывистое выражение אַחֲרֶיךָ בִּנְיָמִין
  choice: 'Передать как прямой тревожный возглас: «У тебя за спиной, Вениамин!»'
  alternative: 'Связать слова с предыдущим повелением: «Бейте тревогу в Бет-Авене: враг позади тебя, Вениамин!»'
  rationale: Исходный текст не называет врага и допускает отрывистое прочтение. Основной вариант сохраняет лаконичность и неоднозначность, а более разъясняющее прочтение дано в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Параллелизм двух первых команд сохранён, различие между рогом и трубой не сглажено. Краткий финальный возглас намеренно оставлен резким и не вполне разъяснённым, как в еврейском тексте.
