base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/014.yaml
  text: For I am like a lion to Ephraim[a], and like a young lion to the house of Judah; I, I myself, will tear and go away; I will carry off[b], and there is no one to rescue.
translation:
  language: ru
  text: Ибо Я — как лев для Ефрема[a] и как молодой лев для дома Иуды. Я, Я сам растерзаю и уйду, унесу — и никто не спасёт[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как свирепый лев для Ефрема»; еврейское слово может подчёркивать силу или свирепость льва.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и некому избавить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שַּׁחַל
  choice: лев
  rationale: Слово обозначает льва и может подчёркивать его силу или свирепость. Нейтральное «лев» сохраняет образ без избыточного уточнения; угроза ясно выражена последующими глаголами.
- source_word: כְּפִיר
  choice: молодой лев
  rationale: Обычное значение — молодой лев. Этот вариант естественен по-русски и сохраняет поэтический параллелизм, не создавая уменьшительного оттенка слова «львёнок».
- source_word: לְאֶפְרַיִם
  choice: для Ефрема
  rationale: Предлог ל выражает отношение образа к объекту суда. По-русски конструкция «как лев для Ефрема» естественно передаёт эту направленность.
- source_word: לְבֵית יְהוּדָה
  choice: для дома Иуды
  rationale: «Дом Иуды» сохраняет еврейский корпоративный образ народа и царства Иуды, а также параллелизм с Ефремом.
- source_word: אֲנִי אֲנִי
  choice: Я, Я сам
  rationale: Повтор личного местоимения имеет усилительное значение. Русская формулировка сохраняет и повтор, и эмфазу, не прибегая к архаизмам.
- source_word: אֶטְרֹף
  choice: растерзаю
  rationale: В образе хищника глагол טרף означает терзать или разрывать добычу. «Растерзаю» кратко и ярко передаёт действие, оставляя прямой объект невыраженным, как в еврейском тексте.
- source_word: וְאֵלֵךְ
  choice: и уйду
  rationale: После нападения хищник удаляется. «Уйду» точно и естественно передаёт последовательность действий.
- source_word: אֶשָּׂא
  choice: унесу добычу
  rationale: נשא может означать «поднять», «нести», «унести». В метафоре льва подразумевается унесённая добыча; добавление слова «добычу» делает русский образ естественным, не меняя его смысла.
- source_word: וְאֵין מַצִּיל
  choice: и никто не спасёт
  rationale: Фраза буквально утверждает отсутствие спасающего. Такой перевод современен, ясен и сохраняет категоричность еврейского текста.
theological_decisions:
- issue: Божественное самоописание в образе хищника, совершающего суд
  choice: Сохранить прямой образ льва и глаголы нападения как метафору разрушительного суда над Ефремом и Иудой.
  alternative: Смягчить метафору до общего утверждения о наказании.
  rationale: Еврейский текст намеренно использует два образа льва и последовательность действий хищника. Смягчение ослабило бы силу пророчества о суде.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенной пророческой выразительности. Повтор «Я, Я сам» передаёт эмфазу оригинала; львиная метафора и резкая последовательность действий сохранены без смягчения.
