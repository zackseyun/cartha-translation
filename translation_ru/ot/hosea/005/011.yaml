  text: Ефрем угнетён, сокрушён судом, потому что решил следовать за повелением[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское צָו обычно означает «повеление» или «приказ». Некоторые толкования и предполагаемые исправления текста понимают это слово как «скверна» или «мерзость».
    reason: Основной текст передаёт масоретское чтение, а сноска сохраняет существенную текстологическую и интерпретационную альтернативу.
lexical_decisions:
- source_word: עָשׁוּק
  choice: угнетён
  rationale: Страдательное причастие передаёт состояние Ефрема как притесняемого или подавленного.
- source_word: רְצוּץ מִשְׁפָּט
  choice: сокрушён судом
  rationale: Сохраняет образ сокрушения и допускает понимание מִשְׁפָּט как судебного решения или совершающегося суда, не уточняя сверх текста, человеческий это суд или Божий.
- source_word: הוֹאִיל הָלַךְ אַחֲרֵי
  choice: решил следовать за
  rationale: הוֹאִיל выражает добровольное согласие или решимость, а הלך אחרי — устойчивый образ следования за кем-либо или чем-либо.
- source_word: צָו
  choice: скверной
  rationale: В контексте обличения передаёт вероятное уничижительное значение спорного слова; буквальное чтение масоретской огласовки «повеление» сохранено в сноске.
theological_decisions:
- issue: Причина осуждения Ефрема
  choice: решил следовать за скверной
  alternative: решил следовать повелению
  rationale: 'Основной текст отражает контекстуально вероятное обозначение нечистого или ничтожного предмета следования, но не скрывает текстологическую неоднозначность: масоретская огласовка допускает «повеление».'
- issue: Характер суда
  choice: сокрушён судом
  alternative: сокрушён в суде / попрана справедливость
  rationale: Формулировка сохраняет краткость и напряжённость еврейского выражения, не вводя прямо не названного субъекта суда и не превращая מִשְׁפָּט однозначно в абстрактную «справедливость».
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная, с сохранением пророческой резкости и параллелизма двух страдательных определений.
