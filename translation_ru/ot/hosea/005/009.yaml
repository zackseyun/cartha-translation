lexical_decisions:
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено собственное имя, как в еврейском тексте. В контексте оно может обозначать Северное царство, но это метонимическое значение не раскрывается прямо в основном тексте.
- source_word: לְשַׁמָּה
  choice: пустыней
  rationale: Слово שַׁמָּה обозначает опустошение, разорение и может подразумевать вызывающее ужас зрелище. «Станет пустыней» естественно передаёт итог опустошительного суда.
- source_word: תִהְיֶה
  choice: станет
  rationale: Конструкция היה с לְ выражает переход в новое состояние, поэтому «станет» точнее простого «будет».
- source_word: בְּיוֹם תּוֹכֵחָה
  choice: в день обличения
  rationale: תּוֹכֵחָה прежде всего означает обличение или порицание, хотя в пророческом контексте включает карательный оттенок. Перевод сохраняет эту смысловую напряжённость.
- source_word: בְּשִׁבְטֵי יִשְׂרָאֵל
  choice: среди колен Израиля
  rationale: 'Предлог בְּ понят как указание на сферу или среду: возвещение сделано среди колен Израиля.'
- source_word: הוֹדַעְתִּי
  choice: Я возвестил
  rationale: Hiphil от ידע означает «дать знать, объявить». «Возвестил» естественно для пророческой речи и сохраняет совершенный вид еврейского перфекта.
- source_word: נֶאֱמָנָה
  choice: то, что непреложно
  rationale: Форма от אמן передаёт твёрдость, надёжность и несомненность. Субстантивированное выражение обозначает непреложное содержание Божьего возвещения.
theological_decisions:
- issue: Следует ли прямо пояснить, что Ефрем обозначает Северное царство
  choice: Сохранить имя «Ефрем» без поясняющей замены
  alternative: «Северное царство» или «Израиль»
  rationale: В еврейском тексте назван Ефрем. Раскрытие метонимии в основном тексте сузило бы возможное прочтение и добавило бы толкование.
- issue: Насколько явно передать карательный смысл תּוֹכֵחָה
  choice: «обличение»
  alternative: «наказание» или «суд»
  rationale: Контекст говорит о суде и бедствии, однако само существительное сохраняет значение обличения или порицания. Более буквальная передача не устраняет заложенную в тексте смысловую напряжённость.
- issue: Как понять נֶאֱמָנָה в заключительной фразе
  choice: 'Как содержание возвещения: «то, что непреложно»'
  alternative: 'Наречное понимание: «возвестил достоверно»'
  rationale: Женская форма допускает субстантивное понимание, поддержанное консультационным английским текстом; примечание сохраняет грамматическую альтернативу.
