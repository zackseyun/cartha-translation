  text: בַּ/יהוָ֣ה בָּגָ֔דוּ כִּֽי בָנִ֥ים זָרִ֖ים יָלָ֑דוּ עַתָּ֛ה יֹאכְלֵ֥/ם חֹ֖דֶשׁ אֶת חֶלְקֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/007.yaml
  text: They have dealt faithlessly with Yahweh[a], for they have borne foreign children[b]. Now the new moon will devour them with their portions.
translation:
  language: ru
  text: Они изменили ГОСПОДУ, потому что родили чужих детей[b]. Теперь новомесячие[a] поглотит их и их уделы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Теперь месяц поглотит их и их уделы». Еврейское חֹדֶשׁ может означать и «новомесячие», и «месяц».'
    reason: alternative_reading
  - marker: b
    text: «Чужие дети» — возможно, дети от союзов, нарушавших верность завету, или, шире, поколение, ставшее чуждым ГОСПОДУ.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיהוָה
  choice: ГОСПОДУ
  rationale: При глаголе בגד предлог ב обозначает того, кому изменили или против кого совершили вероломство; имя YHWH передано по принятой библейской традиции как «ГОСПОДЬ».
- source_word: בָּגָדוּ
  choice: изменили
  rationale: Глагол выражает вероломство и нарушение верности в отношениях завета; «изменили ГОСПОДУ» естественно и ёмко передаёт этот смысл по-русски.
- source_word: בָנִים זָרִים
  choice: чужих детей
  rationale: 'Сохраняет буквальный образ и неоднозначность זָרִים: речь может идти как о детях от недозволенных союзов, так и о поколении, чуждом ГОСПОДУ.'
- source_word: יָלָדוּ
  choice: родили
  rationale: Передаёт общий родительский глагол в контексте появления детей, не добавляя в текст указания на незаконнорождённость.
- source_word: עַתָּה
  choice: Теперь
  rationale: Сохраняет непосредственность и близость объявленного суда.
- source_word: יֹאכְלֵם
  choice: поглотит их
  rationale: Буквально «съест их»; «поглотит» естественно передаёт образ уничтожающего суда.
- source_word: חֹדֶשׁ
  choice: новомесячие
  rationale: Слово может означать «новомесячие» или «месяц». Основной вариант сохраняет вероятную культово-календарную отсылку, а временное значение отмечено в сноске.
- source_word: חֶלְקֵיהֶם
  choice: их наделами
  rationale: חלק обозначает долю, удел или земельный надел; в данном контексте «наделы» конкретнее русского «доли», но не сводит смысл ко всем владениям вообще.
theological_decisions:
- issue: Значение выражения «чужие дети»
  choice: Сохранён образ детей, чуждых отношениям завета, без сведения смысла только к этническому происхождению или незаконнорождённости.
  alternative: Буквально дети от браков с чужеземцами либо метафорически поколение, отчуждённое от ГОСПОДА.
  rationale: Пророческая формулировка допускает семейный и духовный планы; перевод не устраняет эту напряжённость.
- issue: Значение חֹדֶשׁ в формуле суда
  choice: «новомесячие» как праздник или календарный цикл, становящийся поводом либо временем суда.
  alternative: «месяц», то есть суд наступит в течение короткого срока.
  rationale: Оба значения лексически возможны; основной текст сохраняет культовый оттенок, а временной вариант дан в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Формулировка краткая и образная; неоднозначность ключевых еврейских выражений сохранена посредством сносок.
