  text: The princes of Judah have become like those who move a boundary marker[a]; on them I will pour out my wrath like water.
translation:
  language: ru
  text: Князья Иуды стали подобны тем, кто передвигает межевой знак[a]. На них Я изолью Свою ярость, как воду.
  philosophy: optimal-equivalence
  footnotes:
