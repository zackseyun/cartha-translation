    reason: lexical_alternative
lexical_decisions:
- source_word: הָיוּ
  choice: стали
  rationale: 'Перфект глагола היה здесь естественно передаёт наступившее состояние: князья уподобились нарушителям межи.'
- source_word: שָׂרֵי יְהוּדָה
  choice: князья Иуды
  rationale: שָׂרִים обозначает правителей или высокопоставленных начальников; «князья» сохраняет возвышенный политический оттенок пророческой речи.
- source_word: כְּמַסִּיגֵי גְּבוּל
  choice: подобны тем, кто передвигает межевой знак
  rationale: Оборот вызывает конкретный образ незаконного смещения границы земельного владения и при этом допускает более широкое метафорическое применение.
- source_word: עֲלֵיהֶם אֶשְׁפּוֹךְ
  choice: На них Я изолью
  rationale: Передаёт направленность суда и сохраняет яркую метафору излияния.
- source_word: כַּמַּיִם
  choice: как воду
  rationale: Сохраняет прямое сравнение исходного текста, не добавляя отсутствующего в нём образа потопа.
- source_word: עֶבְרָתִי
  choice: Свою ярость
  rationale: עֶבְרָה обозначает сильный гнев; «ярость» звучит весомо и естественно в современной русской пророческой речи.
theological_decisions:
- issue: Характер обвинения князей Иуды
  choice: Сохранён конкретный образ передвижения межевого знака без уточнения, является ли обвинение буквальным или метафорическим.
  alternative: Понимать выражение исключительно как захват земли, политическое посягательство либо нарушение установленных Богом пределов.
  rationale: Еврейский образ связан с известным нарушением границ владения, но в контексте пророчества может обозначать более широкое заветное и общественное беззаконие. Перевод не снимает эту неоднозначность.
