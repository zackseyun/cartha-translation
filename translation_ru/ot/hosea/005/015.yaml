  text: אֵלֵ֤ךְ אָשׁ֨וּבָה֙ אֶל מְקוֹמִ֔/י עַ֥ד אֲשֶֽׁר יֶאְשְׁמ֖וּ וּ/בִקְשׁ֣וּ פָנָ֑/י בַּ/צַּ֥ר לָ/הֶ֖ם יְשַׁחֲרֻֽ/נְנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/005/015.yaml
  text: I will go[a], I will return to my place until they acknowledge their guilt and seek my face[b]; in their distress they will seek me earnestly.
translation:
  language: ru
  text: Я уйду и вернусь на Своё место, пока они не признают свою вину[a] и не станут искать Моего лица; в своей беде они будут усердно искать Меня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока они не понесут свою вину» или «пока не будут признаны виновными». Еврейский глагол может обозначать как состояние или несение вины, так и её признание; последующее искание Господа поддерживает перевод «признают свою вину».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут искать Меня с раннего утра». Еврейское выражение, вероятно, означает настойчивое, усердное искание, а не только искание в ранний час.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֵךְ
  choice: Я уйду
  rationale: Форма Qal 1-го лица ед. числа означает «пойду». В данном контексте естественное русское «уйду» ясно передаёт удаление, за которым следует возвращение в своё место.
- source_word: אָשׁוּבָה
  choice: вернусь
  rationale: Глагол שׁוב обычно означает «возвращаться, поворачивать назад»; здесь направление обозначено словами «в Моё место».
- source_word: מְקוֹמִי
  choice: Моё место
  rationale: Сохраняется буквальный пространственный образ, не уточняя его как «жилище» или «дом» сверх сказанного в еврейском тексте.
- source_word: עַד אֲשֶׁר
  choice: пока не
  rationale: В русском языке эта конструкция естественно выражает временной предел Божьего удаления.
- source_word: יֶאְשְׁמוּ
  choice: признают свою вину
  rationale: Глагол אשם может обозначать несение или осознание вины. Последующее искание Божьего лица поддерживает значение признания вины, однако неоднозначность отмечена в сноске.
- source_word: וּבִקְשׁוּ פָנַי
  choice: не станут искать Моего лица
  rationale: Сохранён библейский образ «искать лица», который означает стремление к присутствию или благоволению Бога и понятен в dignified современном русском.
- source_word: בַּצַּר לָהֶם
  choice: в своей беде
  rationale: 'Идиоматически передаёт обстоятельство времени и состояния: когда их постигнет беда, теснота или скорбь.'
- source_word: יְשַׁחֲרֻנְנִי
  choice: будут усердно искать Меня
  rationale: Порода Piel глагола שׁחר может буквально указывать на раннее искание, но в данном употреблении выражает настойчивость и усердие.
theological_decisions:
- issue: Смысл Божьего удаления
  choice: Бог удаляется от народа до признания им своей вины и обращения к Нему.
  alternative: Полное оставление народа либо лишь изменение человеческого восприятия Божьего присутствия.
  rationale: Последовательность «уйду и вернусь в Моё место» сохраняет образ Божьего удаления в условиях суда за нарушение завета, не определяя метафизический характер отсутствия.
- issue: Значение יֶאְשְׁמוּ
  choice: признание собственной вины
  alternative: несение вины или признание виновными
  rationale: Контекст последующего искания Божьего лица склоняет к покаянному признанию, но еврейская лексическая широта сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного библейского образа «искать Моего лица». Заглавные буквы в местоимениях, относящихся к Богу, применены последовательно в рамках издательского регистра. Ритм исходной последовательности действий сохранён без конфессиональных уточнений.
