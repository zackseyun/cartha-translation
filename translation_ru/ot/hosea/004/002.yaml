base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/002.yaml
  text: Cursing[a], lying, murder, theft, and adultery break out[b]; bloodshed follows bloodshed.
translation:
  language: ru
  text: Проклятия[a], ложь, убийства, воровство и прелюбодеяния — всё это вырвалось наружу; кровопролитие следует за кровопролитием[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать нарушение клятв или ложные клятвы.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «крови соприкасаются с кровями» — одно кровопролитие следует за другим.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָלֹה
  choice: Проклятия
  rationale: Форма может обозначать произнесение проклятий, клятвы или ложные клятвы. «Проклятия» естественно входит в перечень пороков, а неоднозначность отмечена в сноске.
- source_word: כַחֵשׁ
  choice: ложь
  rationale: Глагол означает лгать или поступать лживо; существительное «ложь» сохраняет краткость перечня.
- source_word: רָצֹחַ
  choice: убийства
  rationale: רצח обычно обозначает противозаконное лишение жизни, а не умерщвление вообще.
- source_word: גָנֹב
  choice: воровство
  rationale: Передаёт действие кражи и поддерживает однородный именной ряд.
- source_word: נָאֹף
  choice: прелюбодеяния
  rationale: Глагол конкретно обозначает супружескую неверность; именная форма сохраняет компактность перечня.
- source_word: פָּרָצוּ
  choice: всё ширится
  rationale: Глагол передаёт прорыв, бурное распространение или выход за пределы. В данном контексте выражение естественно описывает неудержимое распространение перечисленных грехов, не добавляя отсутствующего в еврейском тексте прямого дополнения.
- source_word: דָמִים
  choice: кровопролитие
  rationale: Множественное «крови» здесь идиоматически обозначает кровавые деяния или пролитие крови.
- source_word: דָמִים בְּדָמִים נָגָעוּ
  choice: кровопролитие следует за кровопролитием
  rationale: Буквально «крови соприкасаются с кровями»; перевод передаёт непрерывную череду кровавых деяний ясным современным русским языком.
theological_decisions:
- issue: Значение אָלֹה в контексте обвинения заветного народа
  choice: Проклятия
  alternative: Нарушение клятв / ложные клятвы
  rationale: Еврейское слово допускает связь как с проклятием, так и с клятвенной речью. Основной текст не сужает значение до одной разновидности нарушения клятвы; альтернативное понимание сохранено в сноске.
translation_notes:
  register: Современный литературный русский; достоинство пророческой речи сочетается с кратким, резким перечнем общественных грехов. Формы множественного числа делают перечисление естественным по-русски и подчёркивают повторяемость деяний.
