  text: לֹֽא אֶפְק֨וֹד עַל בְּנוֹתֵי/כֶ֜ם כִּ֣י תִזְנֶ֗ינָה וְ/עַל כַּלּֽוֹתֵי/כֶם֙ כִּ֣י תְנָאַ֔פְנָה כִּי הֵם֙ עִם הַ/זֹּנ֣וֹת יְפָרֵ֔דוּ וְ/עִם הַ/קְּדֵשׁ֖וֹת יְזַבֵּ֑חוּ וְ/עָ֥ם לֹֽא יָבִ֖ין יִלָּבֵֽט־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/014.yaml
  text: I will not punish your daughters when they prostitute themselves[a], nor your daughters-in-law when they commit adultery; for the men themselves go apart with prostitutes and sacrifice with cult prostitutes[c][b], and a people without understanding comes to ruin.
translation:
  language: ru
  text: Я не стану наказывать ваших дочерей за то, что они блудят, и ваших невесток за то, что они прелюбодействуют, потому что мужчины сами уединяются[a] с блудницами и приносят жертвы с культовыми блудницами[b]. Народ, лишённый разумения, погибнет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «отделяются» или «удаляются с блудницами»; возможно также: «сходятся с блудницами».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «храмовыми блудницами». Еврейское слово обозначает женщин, связанных с недозволенной культовой сексуальной практикой.'
    reason: lexical_alternative
  - marker: c
    text: 'Последний еврейский глагол редок; возможны значения: «будет повержен», «придёт в смятение» или в более общем смысле «придёт к гибели».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְקוֹד
  choice: не стану наказывать
  rationale: Глагол פקד с עַל в контексте суда означает взыскать или подвергнуть наказанию; выбран ясный современный русский эквивалент.
- source_word: תִזְנֶינָה
  choice: блудят
  rationale: Глагол זנה обозначает недозволенные половые отношения и сохраняет характерный для Осии образ блуда; русский глагол звучит достойно и не сужает смысл исключительно до профессиональной проституции.
- source_word: כַלּוֹתֵיכֶם
  choice: ваших невесток
  rationale: В данном семейном контексте כַּלָּה означает жён сыновей, то есть невесток.
- source_word: תְנָאַפְנָה
  choice: прелюбодействуют
  rationale: נאף конкретно обозначает супружескую измену, поэтому его смысл отличён от более широкого זנה.
- source_word: יְפָרֵדוּ
  choice: уединяются
  rationale: פרד буквально означает отделяться; в контексте это эвфемистическое указание на удаление мужчин вместе с блудницами. «Уединяются» сохраняет образ и ясно передаёт намёк.
- source_word: הַזֹּנוֹת
  choice: блудницами
  rationale: Форма от זנה обозначает женщин, занимающихся проституцией; «блудницы» соответствует возвышенному библейскому регистру без архаической неясности.
- source_word: הַקְּדֵשׁוֹת
  choice: культовыми блудницами
  rationale: Термин указывает на женщин, связанных с недозволенной культовой сексуальной практикой. «Культовые» сохраняет религиозный аспект, не уточняя без основания храмовую организацию.
- source_word: יְזַבֵּחוּ
  choice: приносят жертвы
  rationale: Естественная русская передача обычного глагола жертвоприношения.
- source_word: וְעָם לֹא יָבִין
  choice: народ, лишённый разумения
  rationale: Передаёт обобщённую характеристику народа, который не понимает и не различает должного.
- source_word: יִלָּבֵט
  choice: погибнет
  rationale: Редкий глагол выражает падение, сокрушение или гибель; краткое «погибнет» естественно передаёт общий разрушительный итог, а неопределённость отмечена в сноске.
theological_decisions:
- issue: Означает ли отказ от наказания оправдание греха женщин
  choice: 'Сохранена причинная связь: Бог не выделяет дочерей и невесток для наказания, поскольку мужчины сами участвуют в той же развращённости.'
  alternative: Понять слова как безусловный отказ наказывать женщин независимо от поведения мужчин.
  rationale: Союз כִּי связывает заявление с последующим обличением мужчин. Перевод не добавляет оправдания греха и не устраняет напряжённость прямого высказывания.
- issue: Смысл קְדֵשׁוֹת
  choice: культовые блудницы
  alternative: храмовые блудницы; посвящённые женщины
  rationale: Контекст связывает термин с ложным культом и сексуальной распущенностью, но «храмовые» могло бы неоправданно конкретизировать место или институт.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Различены «блудить» и «прелюбодействовать»; сохранены культовый оттенок קְדֵשׁוֹת и смысловая неопределённость редкого יִלָּבֵט. Синтаксис слегка разделён на два предложения ради ясности без изменения логической связи.
