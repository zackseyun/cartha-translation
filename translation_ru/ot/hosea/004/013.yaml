source:
  edition: WLC
  text: עַל רָאשֵׁ֨י הֶ/הָרִ֜ים יְזַבֵּ֗חוּ וְ/עַל הַ/גְּבָעוֹת֙ יְקַטֵּ֔רוּ תַּ֣חַת אַלּ֧וֹן וְ/לִבְנֶ֛ה וְ/אֵלָ֖ה כִּ֣י ט֣וֹב צִלָּ֑/הּ עַל כֵּ֗ן תִּזְנֶ֨ינָה֙ בְּנ֣וֹתֵי/כֶ֔ם וְ/כַלּוֹתֵי/כֶ֖ם תְּנָאַֽפְנָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/013.yaml
  text: On the tops of the mountains they sacrifice[a], and on the hills they burn incense, under oak and poplar and terebinth, because their shade is good. Therefore your daughters prostitute themselves[c][b], and your daughters-in-law commit adultery.
translation:
  language: ru
  text: На вершинах гор они приносят жертвы и на холмах воскуряют под дубом, тополем и теревинфом[b], потому что хороша их тень. Поэтому ваши дочери предаются блуду[c], а ваши невестки прелюбодействуют.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Эти деревья традиционно отождествляют с дубом, тополем и теревинфом; точное определение пород не вполне достоверно.
    reason: cultural_note
  - marker: c
    text: Осия часто использует половую неверность как образ неверности завету; здесь слова вместе с тем прямо описывают сексуальный грех.
    reason: cross_reference
lexical_decisions:
- source_word: רָאשֵׁי הֶהָרִים
  choice: на вершинах гор
  rationale: Буквально «на головах гор»; естественное русское обозначение горных вершин, сохраняющее образ возвышенных культовых мест.
- source_word: יְזַבֵּחוּ
  choice: приносят жертвы
  rationale: Порода piel глагола זבח обозначает жертвенное заклание или принесение жертвы; русское словосочетание ясно передаёт культовое действие.
- source_word: יְקַטֵּרוּ
  choice: возносят жертвенный дым
  rationale: Глагол קטר может обозначать как воскурение благовоний, так и более широко сожжение приношений с восходящим дымом. Формулировка сохраняет эту широту и параллелизм с принесением жертв.
- source_word: תַּחַת אַלּוֹן וְלִבְנֶה וְאֵלָה
  choice: под дубом, тополем и теревинфом
  rationale: Переданы традиционные ботанические соответствия; формы единственного числа сохранены как обобщённое перечисление видов деревьев.
- source_word: כִּי טוֹב צִלָּהּ
  choice: потому что хороша их тень
  rationale: Еврейский суффикс формально женского рода единственного числа может относиться к древесной сени или к последнему дереву как представителю всего ряда; русское множественное «их» естественно связывает тень со всеми названными деревьями.
- source_word: עַל כֵּן
  choice: поэтому
  rationale: Ясно передаёт причинно-следственную связь, подчёркнутую пророком.
- source_word: תִּזְנֶינָה
  choice: предаются блуду
  rationale: Сохраняет сильное сексуальное значение זנה, не ограничивая его непременно коммерческой проституцией и оставляя доступным характерный для Осии образ неверности.
- source_word: וְכַלּוֹתֵיכֶם
  choice: а ваши невестки
  rationale: כַּלָּה может означать невесту или невестку; в семейной паре с «вашими дочерьми» значение «невестки» наиболее естественно.
- source_word: תְּנָאַפְנָה
  choice: прелюбодействуют
  rationale: Точно передаёт специфическое значение נאף — нарушение супружеской верности — и отличает его от более широкого זנה.
theological_decisions:
- issue: Следует ли понимать половую лексику только метафорически как духовную неверность или также буквально
  choice: В основном тексте сохранено прямое описание сексуального греха, а примечание указывает на более широкий образ заветной неверности у Осии.
  alternative: Перевести исключительно метафорически как идолопоклонство или духовный блуд.
  rationale: В стихе прямо названы дочери и невестки и параллельно употреблены два конкретных глагола сексуальной неверности. Вместе с тем контекст книги не позволяет исключить образ неверности завету; перевод не должен устранять это напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Возносят жертвенный дым» сохраняет лексическую неоднозначность культового глагола; «предаются блуду» звучит сильно, но не архаично. Все примечания обозначены в основном тексте.
