  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/אָֽכְלוּ֙ וְ/לֹ֣א יִשְׂבָּ֔עוּ הִזְנ֖וּ וְ/לֹ֣א יִפְרֹ֑צוּ כִּֽי אֶת יְהוָ֥ה עָזְב֖וּ לִ/שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/010.yaml
  text: They will eat[a], but not be satisfied; they will commit sexual immorality, but not increase, because they have abandoned Yahweh[c][b], to cherish prostitution.
translation:
  language: ru
  text: Они будут есть, но не насытятся; будут блудодействовать[a], но не умножатся[b], потому что оставили Яхве и перестали внимать Ему[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол может означать также «заниматься проституцией». У Осии он нередко несёт и переносный смысл неверности Яхве.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не распространятся» или «не прорвутся»; вероятно, имеется в виду, что они не умножатся числом, то есть не будут иметь многочисленного потомства.'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейская фраза предельно кратка: буквально — «Яхве оставили хранить». Вероятный смысл: они перестали внимать Яхве или соблюдать то, чего Он требует. Некоторые связывают «хранить» с началом следующего стиха.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָכְלוּ
  choice: будут есть
  rationale: 'Перфект с союзом в контексте пророческого объявления суда естественно передаётся будущим временем: речь идёт о предстоящем последствии.'
- source_word: יִשְׂבָּעוּ
  choice: не насытятся
  rationale: Глагол שׂבע означает достижение сытости; «насытятся» естественно передаёт образ еды, не приносящей удовлетворения.
- source_word: הִזְנוּ
  choice: будут блудодействовать
  rationale: זנה может обозначать проституцию или шире — недозволенные половые отношения, а у Осии также вызывает ассоциацию с неверностью завету. «Блудодействовать» сохраняет конкретный сексуальный смысл и не исключает метафорического оттенка.
- source_word: יִפְרֹצוּ
  choice: не умножатся
  rationale: Буквально פרץ означает «прорываться, распространяться», но здесь параллель с половой распущенностью указывает на отсутствие потомства или численного роста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: עָזְבוּ
  choice: оставили
  rationale: «Оставили» ясно и сдержанно передаёт отказ от Яхве, сохраняя подразумеваемую заветную неверность без дополнительного толкования.
- source_word: לִשְׁמֹר
  choice: перестали внимать Ему
  rationale: Инфинитив שמר после עזבו употреблён эллиптически. Такая передача выражает прекращение внимания и соблюдения по отношению к Яхве, не добавляя конкретного объекта вроде закона или заповедей.
theological_decisions:
- issue: Смысл זנה в обвинении Осии
  choice: Передать конкретное сексуальное поведение словом «блудодействовать», сохранив возможность метафорического смысла.
  alternative: Перевести как «заниматься проституцией» либо истолковать исключительно как духовную измену и идолопоклонство.
  rationale: Соседнее «не умножатся» поддерживает буквальный сексуальный смысл, тогда как устойчивое употребление образа у Осии сохраняет заветный подтекст. Перевод не устраняет это напряжение.
- issue: Эллиптическая конструкция אֶת־יְהוָה עָזְבוּ לִשְׁמֹר
  choice: «оставили Яхве и перестали внимать Ему»
  alternative: «перестали хранить [закон] Яхве»; «оставили Яхве, чтобы хранить…»; присоединить инфинитив к следующему стиху.
  rationale: Еврейская фраза кратка и синтаксически трудна. Выбранная формулировка делает смысл понятным по-русски, но не вводит отсутствующие в тексте «закон» или «пути»; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким пророческим ритмом. «Блудодействовать» выбрано как достоинственное библейское слово, всё ещё понятное современному читателю; архаические формы и конфессионально обусловленные добавления устранены.
