translation:
  language: ru
  text: Они кормятся грехом моего народа[a] и стремятся к их беззаконию[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они едят жертву за грех моего народа». Еврейское слово может означать и «грех», и «жертву за грех».'
