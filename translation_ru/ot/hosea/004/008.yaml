    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: грехом
  rationale: Слово может означать как «грех», так и «жертву за грех». Параллель с «беззаконием» поддерживает нравственный смысл в основном тексте, а культовый смысл сохранён в сноске.
- source_word: יֹאכֵלוּ
  choice: кормятся
  rationale: Буквально глагол означает «едят». «Кормятся» сохраняет образ питания и естественно передаёт мысль о том, что священники извлекают выгоду из греха народа.
- source_word: עַמִּי
  choice: Моего народа
  rationale: Прямая передача формы с местоименным суффиксом первого лица единственного числа.
- source_word: עֲוֺנָם
  choice: его беззакония
  rationale: Суффикс относится к собирательному существительному «народ». Слово עָוֹן здесь передаёт нравственную вину или порочность; «беззаконие» сохраняет этическую тяжесть и параллель с «грехом».
- source_word: יִשְׂאוּ נַפְשׁוֹ
  choice: жаждут
  rationale: Сочетание с נֶפֶשׁ выражает направленное сильное желание. «Жаждут» естественно передаёт эту идиому, не устраняя отмеченную в сноске грамматическую трудность.
- source_word: נַפְשׁוֹ
  choice: передано внутри идиомы «жаждут»
  rationale: Масоретская форма буквально означает «его душу», хотя глагол стоит во множественном числе. В основном тексте передан вероятный идиоматический смысл, а буквальная форма сохранена в сноске.
theological_decisions:
- issue: Значение חַטַּאת в обличении священников
  choice: В основном тексте — «грех»
  alternative: «жертва за грех»
  rationale: Еврейское слово допускает оба значения. Параллелизм с «беззаконием» склоняет к более широкому нравственному смыслу, но жертвенный оттенок существенно влияет на понимание и поэтому сохранён в сноске.
- issue: Объект желания священников
  choice: «жаждут его беззакония»
  alternative: 'Буквально: «к их беззаконию они возносят его душу»'
  rationale: Перевод передаёт обвинение в желании продолжающегося беззакония народа, сохраняя неясность числа и местоименного суффикса в сноске, а не разрешая её догматически.
translation_notes:
  register: Современный литературный русский язык с краткой, обличительной формулировкой. «Кормятся» сохраняет метафору потребления и намёк на корыстное использование греха народа; «жаждут» естественно передаёт идиому сильного желания. Заглавная буква в «Моего» указывает на речь Бога согласно русской библейской издательской традиции.
