  source_fidelity: 'Основной смысл передан верно: речь о людях, которые «едят/кормятся» грехом народа Бога и желают его вины. Однако русская сноска b неточно воспроизводит буквальную форму: в еврейском тексте объектом предлога является «к их беззаконию», тогда как суффикс единственного числа относится к «его душе», не к народу. Основной текст «его беззакония» также преждевременно снимает существенную грамматическую неясность и создаёт менее естественную связь с подлежащим «они».'
  naturalness: '«Они кормятся грехом Моего народа и жаждут его беззакония» звучит в целом литературно, но «жаждут его беззакония» двусмысленно: «его» может восприниматься как относящееся к «греху», а не к народу. «Стремятся к его беззаконию» яснее и лучше соответствует конструкции с אֶל («к, на»), сохраняя смысл направленного желания.'
