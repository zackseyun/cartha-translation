  text: זְנ֛וּת וְ/יַ֥יִן וְ/תִיר֖וֹשׁ יִֽקַּֽח לֵֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/011.yaml
  text: Sexual immorality[a], wine, and new wine take away the heart.
translation:
  language: ru
  text: Блуд, вино и молодое вино отнимают сердце[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишают разумения»; также возможно: «отнимают рассудок». Буквально: «отнимают сердце».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְנוּת
  choice: блуд
  rationale: Слово обозначает недозволенное половое поведение и в книге Осии может нести оттенки проституции и заветной неверности. «Блуд» кратко и выразительно сохраняет эту многозначность, не сводя смысл только к проституции.
- source_word: יַיִן
  choice: вино
  rationale: Обычное обозначение вина; контекст не требует иного перевода.
- source_word: תִּירוֹשׁ
  choice: молодое вино
  rationale: Так сохраняется лексическое отличие от יַיִן и передаётся значение свежего, нового вина.
- source_word: יִקַּח
  choice: отнимают
  rationale: Глагол буквально означает «брать, забирать». В сочетании с «сердцем» форма «отнимают» естественно передаёт лишение внутренней способности рассуждать и верно выбирать, сохраняя образ исходного текста.
- source_word: לֵב
  choice: сердце
  rationale: В древнееврейском представлении сердце включает разум, волю и внутреннее суждение, а не только чувства. Конкретный образ сохранён в основном тексте, а его возможный смысл пояснён в сноске.
theological_decisions:
- issue: Перевод выражения יִקַּח לֵב буквально как утраты сердца или истолковательно как утраты разумения
  choice: Сохранить в основном тексте образ «отнимают сердце».
  alternative: «лишают разумения»; «отнимают рассудок»
  rationale: Буквальная образность сохраняет древнееврейское представление о сердце как средоточии мысли, воли и нравственного выбора и не сводит выражение к одной способности. Более истолковательные варианты приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, афористичной структурой оригинала. Слово «блуд» сохраняет библейскую выразительность и многозначность, а «молодое вино» ясно отличает תִּירוֹשׁ от обычного יַיִן.
