base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/004.yaml
  text: Yet let no man contend[a], and let no man reprove[b], for your people are like those who contend with a priest.
translation:
  language: ru
  text: Но пусть никто не спорит, пусть никто не обличает[a], ведь твой народ — словно те, кто спорит со священником[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не укоряет» либо «не исправляет»; еврейский глагол может обозначать обличение, исправление или доказательство неправоты.'
    reason: lexical_alternative
  - marker: b
    text: Сравнение, возможно, напоминает о тяжести неповиновения священническому судебному решению; ср. Второзаконие 17:12.
    reason: cross_reference
lexical_decisions:
- source_word: אַךְ
  choice: Но
  rationale: Передаёт резкий противительный переход от предшествующего обвинения; в современном русском звучит естественнее буквального «только».
- source_word: אִישׁ ... אִישׁ
  choice: никто ... никто
  rationale: Оба употребления אִישׁ имеют обобщённое значение; «никто» естественно передаёт запретительную конструкцию אַל с глаголом и сохраняет параллелизм.
- source_word: אַל יָרֵב
  choice: пусть никто не спорит
  rationale: ריב охватывает спор, тяжбу и предъявление обвинения; «спорит» сохраняет широту значения и допускает как бытовой, так и правовой оттенок.
- source_word: וְאַל יוֹכַח
  choice: и никто не обличает
  rationale: יכח в данной форме может означать обличать, укорять, исправлять или доказывать неправоту. «Обличает» сохраняет нравственно-коррективный смысл, не сводя выражение к простому порицанию.
- source_word: וְעַמְּךָ
  choice: ведь твой народ
  rationale: 'Союз понят как пояснительно-причинный: следующая часть объясняет запрет спорить и обличать.'
- source_word: כִּמְרִיבֵי
  choice: словно те, кто спорит
  rationale: Сохраняет сравнительное значение כְּ и словесную связь с יָרֵב в первой части стиха.
- source_word: כֹהֵן
  choice: со священником
  rationale: Единственное число употреблено в родовом смысле; русская форма без артикля естественно сохраняет эту неопределённость.
theological_decisions:
- issue: Смысл заключительного сравнения народа с теми, кто спорит со священником
  choice: Сохранено прямое сравнение, описывающее упорное неприятие исправления и сопротивление священническому авторитету.
  alternative: Возможна более конкретная отсылка к запрету противиться священническому судебному решению во Второзаконии 17:12.
  rationale: Еврейский текст ясно выражает сравнение, но не уточняет, является ли оно общей характеристикой мятежности или прямой правовой аллюзией; основной текст не разрешает эту напряжённость, а примечание отмечает возможную связь.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественный без архаизмов. Повтор «никто ... никто» и однокоренное смысловое повторение «спорит ... спорит» передают структуру и риторическую связность еврейского текста.
