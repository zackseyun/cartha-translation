  text: שִׁמְע֥וּ דְבַר יְהוָ֖ה בְּנֵ֣י יִשְׂרָאֵ֑ל כִּ֣י רִ֤יב לַֽ/יהוָה֙ עִם יוֹשְׁבֵ֣י הָ/אָ֔רֶץ כִּ֠י אֵין אֱמֶ֧ת וְֽ/אֵין חֶ֛סֶד וְ/אֵֽין דַּ֥עַת אֱלֹהִ֖ים בָּ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/001.yaml
  text: Hear the word of Yahweh[a], sons of Israel, for Yahweh has a case against the inhabitants of the land, because there is no truth, no faithfulness[d][c][b], and no knowledge of God in the land.
translation:
  language: ru
  text: Слушайте слово Яхве, сыны Израиля[a]! У Яхве тяжба[b] с жителями земли[c], потому что нет на земле ни истины, ни верности[d], ни знания Бога.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети Израиля», то есть израильтяне; буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Яхве предъявляет обвинение жителям земли»; слово может обозначать спор, тяжбу или судебное дело.'
    reason: lexical_alternative
  - marker: c
    text: 'Под «землёй», вероятнее всего, подразумевается земля Израиля; возможные переводы: «страна» или «земля Израиля».'
    reason: referential_ambiguity
  - marker: d
    text: Древнееврейское חֶסֶד может также означать «преданность», «неизменную любовь» или «милость»; здесь особенно заметен смысл верности в отношениях.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения во множественном числе передаёт пророческий призыв и обращение ко всему Израилю.
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и передаёт личное имя יהוה транслитерацией «Яхве».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт буквальное значение древнееврейского выражения и сохраняет его национально-заветное звучание.
- source_word: רִיב
  choice: тяжба
  rationale: 'Существительное имеет юридическую окраску: Яхве выступает с обвинением против жителей земли. «Тяжба» кратко и выразительно сохраняет этот образ.'
- source_word: עִם יוֹשְׁבֵי הָאָרֶץ
  choice: с жителями этой земли
  rationale: Предлог עִם буквально означает «с», а в контексте тяжбы обозначает противную сторону. Указательное «этой» делает русскую фразу естественной и отражает определённость существительного.
- source_word: אֱמֶת
  choice: истина
  rationale: Прямое значение слова; здесь оно охватывает правдивость и надёжность в общественных отношениях.
- source_word: חֶסֶד
  choice: верность
  rationale: В обвинительной речи Осии слово обозначает устойчивую, деятельную преданность в отношениях. «Верность» передаёт этот смысл без внесения в основной текст пояснительного слова «заветная».
- source_word: דַּעַת אֱלֹהִים
  choice: знание Бога
  rationale: Сохраняет конструкцию оригинала и допускает присущий контексту смысл не только осведомлённости, но и признания Бога и отношений с Ним.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В оригинале стоит личное имя Бога, поэтому в основном тексте сохранена его общепринятая научная транслитерация, а не замена титулом.
- issue: Смысл חֶסֶד в контексте обвинения Израиля
  choice: верность
  alternative: неизменная любовь; преданность; милость; заветная верность
  rationale: Слово многозначно и соединяет идеи преданности, любви и милости. «Верность» естественна по-русски и сохраняет нравственно-реляционный смысл, тогда как пояснение о завете могло бы чрезмерно сузить основную строку.
- issue: Объём значения הָאָרֶץ
  choice: эта земля
  alternative: страна; земля Израиля; вся земля
  rationale: Контекст обращения к Израилю указывает прежде всего на землю, где живёт народ, но сам стих не называет её прямо землёй Израиля; эта определённость сохранена без чрезмерной конкретизации.
- issue: Характер выражения רִיב לַיהוָה
  choice: у Яхве тяжба
  alternative: Яхве предъявляет обвинение; у Яхве спор
  rationale: Юридический образ сохранён, но не превращён в строго технический термин современного судопроизводства.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «в этой земле» сохранён ради смыслового соответствия оригиналу; юридический оттенок רִיב передан словом «тяжба». Синтаксис остаётся ясным для широкого читателя без устранения многозначности חֶסֶד и הָאָרֶץ.
