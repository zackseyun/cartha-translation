  text: For Israel is as stubborn as a stubborn heifer[a]; now Yahweh will pasture them like a lamb in a broad place.
translation:
  language: ru
  text: Ибо Израиль строптив, как строптивая телица; теперь Яхве будет пасти их, как ягнёнка на просторе[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также варианты: «как овцу на открытом месте» или «как ягнёнка в просторном месте». Еврейский образ может подразумевать как открытое пастбище, так и беззащитность перед судом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание или объяснение предшествующего обвинения; «ибо» естественно передаёт эту связь в литературном русском языке.
- source_word: כְּפָרָה סֹרֵרָה סָרַר
  choice: строптив, как строптивая телица
  rationale: Повтор «строптив / строптивая» сохраняет риторическое повторение еврейского корня סרר, а «телица» передаёт женский образ домашнего скота и звучит естественно в сравнении.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятая русская форма имени.
- source_word: עַתָּה
  choice: теперь
  rationale: Обозначает наступающее следствие строптивости Израиля.
- source_word: יִרְעֵם
  choice: будет пасти их
  rationale: Глагол רעה означает пасти, кормить или быть пастухом; выбранный вариант сохраняет скотоводческий образ и не устраняет возможную иронию контекста.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: כְּכֶבֶשׂ
  choice: как ягнёнка
  rationale: כֶּבֶשׂ обозначает ягнёнка или молодую овцу; единственное число оригинала сохранено, несмотря на собирательное «их» в предыдущей части.
- source_word: בַּמֶּרְחָב
  choice: на просторе
  rationale: Мֶרְחָב — широкое, просторное место. «На просторе» естественно по-русски и сохраняет возможность понимать образ как пастбищный простор либо как незащищённое открытое место.
theological_decisions:
- issue: Тон заключительной части стиха
  choice: Сохранена неоднозначность между пастырской заботой и ироническим образом уязвимости или суда.
  alternative: Истолковать слова однозначно либо как обещание заботы, либо как предание Израиля опасности на открытом месте.
  rationale: 'Сам еврейский образ допускает оба оттенка: простор может означать свободное пастбище, но одинокий ягнёнок там может быть беззащитен. Перевод не разрешает это напряжение за текст.'
translation_notes:
  register: Современный литературный русский язык с библейской выразительностью без архаизации. Повтор «строптив / строптивая» воспроизводит игру однокоренных слов, а «на просторе» сохраняет смысловую напряжённость заключительного образа.
