  text: צָרַ֥ר ר֛וּחַ אוֹתָ֖/הּ בִּ/כְנָפֶ֑י/הָ וְ/יֵבֹ֖שׁוּ מִ/זִּבְחוֹתָֽ/םס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/019.yaml
  text: The wind has wrapped her in its wings[a], and they will be put to shame because of their sacrifices.
translation:
  language: ru
  text: Ветер обвил её своими крыльями[a], и они будут посрамлены из-за своих жертв.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух связал её своими крыльями». Еврейское слово רוּחַ может означать «ветер», «дыхание» или «дух», а глагол — «связать», «заключить» или «обвить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַר
  choice: обвил
  rationale: Глагол передаёт связывание, охватывание или заключение. «Обвил» естественно сохраняет поэтический образ ветра с крыльями и завершённость действия.
- source_word: רוּחַ
  choice: ветер
  rationale: В сочетании с «крыльями» и образом надвигающегося суда наиболее естественно значение «ветер»; возможное значение «дух» отмечено в сноске.
- source_word: אוֹתָהּ
  choice: её
  rationale: Сохранено местоимение женского рода единственного числа, относящееся к персонифицированному Израилю или Ефрему.
- source_word: בִכְנָפֶיהָ
  choice: своими крыльями
  rationale: Возвратное «своими» ясно связывает крылья с ветром; творительный падеж естественно передаёт образ охватывания, выраженный предлогом ב.
- source_word: וְיֵבֹשׁוּ
  choice: и они будут посрамлены
  rationale: Форма множественного числа сохранена, несмотря на предшествующее «её». «Будут посрамлены» передаёт итоговый позор в контексте суда.
- source_word: מִזִּבְחוֹתָם
  choice: из-за своих жертв
  rationale: 'Предлог מן понят причинно: жертвы становятся причиной их позора. «Из-за» ясно и естественно выражает эту связь.'
theological_decisions:
- issue: Образ и направленность суда
  choice: Израиль, представленный как женщина, охвачен губительным ветром и будет посрамлён из-за своих жертв.
  alternative: Ветер может более конкретно обозначать изгнание или бедствие, а רוּחַ может означать «дух».
  rationale: Перевод сохраняет поэтический образ и связь позора с жертвоприношениями, но не уточняет сверх текста, является ли ветер изгнанием, общим бедствием или иным проявлением суда.
translation_notes:
  register: Современный литературный русский язык с сохранением краткости и поэтической образности оригинала. Намеренный переход от женского единственного числа «её» к множественному «они» сохранён.
