id: HOS.4.3
reference: Hosea 4:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: עַל כֵּ֣ן תֶּאֱבַ֣ל הָ/אָ֗רֶץ וְ/אֻמְלַל֙ כָּל יוֹשֵׁ֣ב בָּ֔/הּ בְּ/חַיַּ֥ת הַ/שָּׂדֶ֖ה וּ/בְ/ע֣וֹף הַ/שָּׁמָ֑יִם וְ/גַם דְּגֵ֥י הַ/יָּ֖ם יֵאָסֵֽפוּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/003.yaml
  text: Therefore the land mourns[a], and everyone who dwells in it languishes, along with the beasts of the field and the birds of the heavens[b]; even the fish of the sea are taken away.
translation:
  language: ru
  text: Поэтому земля скорбит[a], и все, кто живёт на ней, изнемогают — вместе с полевыми зверями и небесными птицами; даже морские рыбы исчезнут[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «страна скорбит». Еврейское אֶרֶץ может означать как страну, так и землю; в данном контексте прежде всего имеется в виду земля Израиля.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «будут собраны»; по смыслу также возможно: «будут убраны» или «унесены». Речь идёт об их исчезновении вследствие суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאֱבַל
  choice: скорбит
  rationale: Глагол обычно обозначает скорбь или плач; перевод сохраняет намеренное олицетворение земли, не сводя образ только к засухе или увяданию.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В ближайшем контексте речь прежде всего о земле Израиля, подвергающейся суду; русское «земля» также сохраняет возможный более широкий оттенок.
- source_word: וְאֻמְלַל
  choice: изнемогают
  rationale: Форма передаёт ослабление, увядание и утрату сил. «Изнемогают» естественно относится как к людям, так и ко всему живому и не ограничивает образ растительной метафорой.
- source_word: כָּל יוֹשֵׁב בָּהּ
  choice: все, кто живёт на ней
  rationale: Единственное число с כָּל имеет собирательное значение; множественная русская конструкция ясно передаёт всеобщий охват.
- source_word: בְּחַיַּת הַשָּׂדֶה
  choice: вместе с полевыми зверями
  rationale: Предлог связывает участь живущих на земле с участью животных. «Полевые звери» сохраняет библейскую категорию и остаётся понятным современному читателю.
- source_word: וּבְעוֹף הַשָּׁמָיִם
  choice: и небесными птицами
  rationale: Перевод сохраняет возвышенный образ и концептуально отражает еврейское множественное שָׁמַיִם, не звуча неестественно по-русски.
- source_word: וְגַם
  choice: даже
  rationale: 'Частица усиливает кульминацию: суд достигает не только суши и неба, но и морских глубин.'
- source_word: דְּגֵי הַיָּם
  choice: морские рыбы
  rationale: 'Естественная русская передача буквального значения, сохраняющая трёхчастный ряд: звери, птицы и рыбы.'
- source_word: יֵאָסֵפוּ
  choice: исчезнут
  rationale: Нифаль глагола אסף буквально связан с собиранием и в данном контексте означает устранение или исчезновение. «Исчезнут» передаёт итог суда, не уточняя без основания его механизм; будущая форма отражает еврейский имперфект.
theological_decisions:
- issue: Объём значения הָאָרֶץ
  choice: земля — прежде всего страна Израиля
  alternative: вся земля, мир
  rationale: Стих входит в пророчество суда над Израилем, поэтому локальное значение вероятнее. При этом русское слово «земля» не устраняет более широкого экологического звучания текста.
- issue: Характер участи рыб в יֵאָסֵפוּ
  choice: исчезнут, то есть будут устранены в результате суда
  alternative: будут собраны; погибнут; будут унесены
  rationale: Перевод сохраняет неопределённость относительно конкретного способа их удаления и не вводит более узкое утверждение о механизме гибели.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной пророческой интонацией. Олицетворение земли и последовательность «звери — птицы — рыбы» сохранены; тире и точка с запятой делают длинную еврейскую конструкцию ясной без дробления смысла.
