source:
  edition: WLC
  text: נִדְמ֥וּ עַמִּ֖/י מִ/בְּלִ֣י הַ/דָּ֑עַת כִּֽי אַתָּ֞ה הַ/דַּ֣עַת מָאַ֗סְתָּ וְ/אֶמְאָֽסְא/ךָ֙ מִ/כַּהֵ֣ן לִ֔/י וַ/תִּשְׁכַּח֙ תּוֹרַ֣ת אֱלֹהֶ֔י/ךָ אֶשְׁכַּ֥ח בָּנֶ֖י/ךָ גַּם אָֽנִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/006.yaml
  text: My people are destroyed for lack of knowledge[a]. Because you have rejected knowledge, I also reject you from being priest to me. Since you have forgotten the law of your God[c][b], I also will forget your children.
translation:
  language: ru
  text: Мой народ гибнет из-за недостатка знания[a]. Поскольку ты отверг знание, Я отвергну тебя, и ты не будешь служить Мне как священник. Ты забыл наставление[b] твоего Бога — и Я забуду твоих детей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «погибает», «уничтожен», «умолкает» или «истреблён».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово тора означает «наставление», «учение» и также может переводиться как «закон».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «твоих сыновей», если понимать еврейское мужское множественное число в более узком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמוּ
  choice: гибнет
  rationale: Нифаль глагола דמה в данном контексте обозначает гибель или уничтожение. Настоящее время по-русски естественно передаёт результативно-пророческое утверждение.
- source_word: מִבְּלִי הַדָּעַת
  choice: из-за недостатка знания
  rationale: Оборот выражает отсутствие того, что необходимо, и причинную связь этого недостатка с гибелью народа.
- source_word: הַדָּעַת / הַדַּעַת
  choice: знание
  rationale: Сохраняет лексическую форму и не добавляет отсутствующее в самой фразе уточнение «Бога», хотя в книге Осии слово имеет заветный и нравственно-религиозный смысл.
- source_word: מָאַסְתָּ
  choice: ты отверг
  rationale: Глагол מאס означает решительно отвергать или презирать; «отверг» ясно передаёт действие и поддерживает взаимность последующего суда.
- source_word: וְאֶמְאָסְאֲךָ מִכַּהֵן לִי
  choice: Я отвергну тебя и не позволю тебе быть Моим священником
  rationale: Передаёт ответное отвержение и значение מן с כהן как отстранение от священнического положения; русская конструкция естественнее буквального «отвергну тебя от священнодействия Мне».
- source_word: וַתִּשְׁכַּח
  choice: ты забыл
  rationale: Сохраняет прямое значение глагола и формирует риторическую параллель с Божьим ответом «Я забуду».
- source_word: תּוֹרַת אֱלֹהֶיךָ
  choice: наставление твоего Бога
  rationale: תורה здесь может обозначать Божье учение или наставление шире, чем законодательные предписания; выбранный вариант естественен и не сужает смысл до свода законов.
- source_word: אֶשְׁכַּח
  choice: Я забуду
  rationale: 'Сохраняет метафору и зеркальную связь: адресат забыл Божье наставление, поэтому Бог забудет его потомков.'
- source_word: בָּנֶיךָ
  choice: твоих детей
  rationale: Множественное число בנים способно обозначать потомство обоих полов; «детей» передаёт вероятный общий смысл, тогда как буквальное «сыновей» отмечено в примечании.
theological_decisions:
- issue: Смысл «знания» в заветном обвинении Осии
  choice: В основном тексте оставлено «знание» без добавления «Бога».
  alternative: «знание Бога»
  rationale: Контекст Осии придаёт слову заветный смысл, однако в данном предложении дополнение «Бога» отсутствует; перевод не должен молча добавлять его.
- issue: Адресат форм второго лица единственного числа
  choice: Сохранено единственное число и явно священнический характер обращения.
  alternative: Понимать «ты» как собирательное обращение ко всему Израилю.
  rationale: Фраза о священническом служении указывает на священника или представителя священства, но текст не требует точнее устанавливать его личность.
- issue: Объём значения בָּנֶיךָ
  choice: «твоих детей»
  alternative: «твоих сыновей»
  rationale: Мужское множественное число может иметь общее значение «потомки, дети»; возможное более узкое прочтение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной пророческой интонацией. Заглавные местоимения при речи Бога употреблены согласно распространённой русской библейской традиции. Тире подчёркивает зеркальность обвинения и суда.
