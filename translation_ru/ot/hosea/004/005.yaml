base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/005.yaml
  text: You will stumble by day[a], and the prophet also will stumble with you by night[c][b]; and I will destroy your mother.
translation:
  language: ru
  text: И днём ты споткнёшься, и пророк также споткнётся с тобой ночью; и Я погублю[a] твою мать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заставлю умолкнуть» или «истреблю»; еврейский глагол в контексте суда допускает эти близкие оттенки значения.'
    reason: lexical_alternative
  - marker: b
    text: «Твоя мать», вероятно, образно обозначает народ, страну или общину завета.
    reason: cultural_note
lexical_decisions:
- source_word: וְכָשַׁלְתָּ
  choice: ты споткнёшься
  rationale: Форма перфекта 2-го лица мужского рода ед. числа в пророческом возвещении передана будущим временем. «Споткнёшься» сохраняет образ еврейского כשל, не усиливая его до окончательного падения.
- source_word: הַיּוֹם
  choice: днём
  rationale: Противопоставление слову לָיְלָה указывает на пару «днём — ночью», а не на значение «сегодня».
- source_word: וְכָשַׁל גַּם נָבִיא
  choice: и … споткнётся пророк
  rationale: Повтор глагола сохранён. Частица גַּם имеет добавочное значение; в русском оно естественно передаётся конструкцией с повторяющимся союзом «и». Слово «пророк» без дополнительных определителей не устраняет присущую оригиналу неопределённость.
- source_word: עִמְּךָ לָיְלָה
  choice: ночью вместе с тобой
  rationale: Передаёт совместность и сохраняет временной параллелизм «днём — ночью» в естественном русском порядке слов.
- source_word: וְדָמִיתִי
  choice: Я погублю
  rationale: В контексте суда глагол выражает прекращение существования или гибель. «Погублю» естественно передаёт угрозу, а родственные значения «заставлю умолкнуть» и «истреблю» отмечены в сноске.
- source_word: אִמֶּךָ
  choice: твою мать
  rationale: Метафора сохранена буквально и не заменена толкованием вроде «твой народ» или «Израиль».
theological_decisions:
- issue: Кого обозначает «твоя мать»
  choice: Сохранить в основном тексте образ «твоя мать»
  alternative: Передать прямо как Израиль, народ, страну или общину завета
  rationale: Книга Осии намеренно использует семейную образность. Прямая идентификация сняла бы литературную и богословскую многозначность текста.
- issue: Характер суда в глаголе וְדָמִיתִי
  choice: погублю
  alternative: заставлю умолкнуть; истреблю
  rationale: Контекст поддерживает сильное значение суда, однако возможные родственные оттенки глагола не следует скрывать; они сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Пара «днём — ночью» вынесена в параллельные позиции; повтор «споткнёшься — споткнётся» сохраняет структуру и образ оригинала. Русское существительное «пророк» без артикля естественно оставляет открытым вопрос, идёт ли речь о конкретном или о типичном представителе пророков.
