reference: Hosea 4:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: אִם זֹנֶ֤ה אַתָּה֙ יִשְׂרָאֵ֔ל אַל יֶאְשַׁ֖ם יְהוּדָ֑ה וְ/אַל תָּבֹ֣אוּ הַ/גִּלְגָּ֗ל וְ/אַֽל תַּעֲלוּ֙ בֵּ֣ית אָ֔וֶן וְ/אַל תִּשָּׁבְע֖וּ חַי יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/015.yaml
  text: Though you prostitute yourself[a], Israel, let not Judah become guilty. And do not go to Gilgal, and do not go up to Beth-aven, and do not swear, ‘As Yahweh lives.’
translation:
  language: ru
  text: 'Хотя ты, Израиль, и блудодействуешь, пусть Иуда не становится виновным. Не ходите в Гилгал, не поднимайтесь в Бет-Авен[a] и не клянитесь: «Жив Яхве!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бет-Авен означает «дом зла» или «дом беззакония»; вероятно, это полемическое название Бетеля.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: хотя … и
  rationale: 'В данном контексте частица вводит уступку, а не открытое условие: неверность Израиля представлена как действительность, тогда как Иуда предостерегается от соучастия.'
- source_word: זֹנֶה
  choice: блудодействуешь
  rationale: Сохраняет резкую пророческую метафору проституции как образа заветной неверности и при этом соответствует возвышенному современному русскому регистру.
- source_word: אַל יֶאְשַׁם
  choice: пусть … не становится виновным
  rationale: Передаёт юссивный оттенок запрета и значение глагола אשם — стать виновным, навлечь на себя вину.
- source_word: תָּבֹאוּ הַגִּלְגָּל
  choice: не ходите в Гилгал
  rationale: В запрете на посещение культового места בוא естественно передаётся по-русски глаголом «ходить»; название транслитерировано с еврейского.
- source_word: תַּעֲלוּ
  choice: не поднимайтесь
  rationale: Сохраняет буквальный пространственный образ глагола עלה и культовый оттенок восхождения к святилищу.
- source_word: בֵּית אָוֶן
  choice: Бет-Авен
  rationale: Сохранено полемическое название места, а не заменено предполагаемым «Вефилем»; его смысл пояснён в сноске.
- source_word: תִּשָּׁבְעוּ
  choice: не клянитесь
  rationale: Кратко и естественно передаёт принесение клятвы.
- source_word: חַי יְהוָה
  choice: Жив Яхве!
  rationale: Передаёт устойчивую еврейскую формулу клятвы без добавления отсутствующих в тексте слов.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
theological_decisions:
- issue: Пророческая сексуальная метафора заветной неверности
  choice: 'Сохранить явную метафору: «блудодействуешь».'
  alternative: «неверен» или «изменяешь Богу»
  rationale: Еврейский текст намеренно использует резкий образ проституции; обобщение ослабило бы риторику, а добавление прямого объекта «Богу» внесло бы толкование.
- issue: Значение אִם в начале стиха
  choice: 'Уступительное: «Хотя … и».'
  alternative: 'Условное: «Если».'
  rationale: Контекст представляет блуд Израиля как уже существующую реальность, однако формальная возможность условного понимания остаётся свойством еврейской частицы; выбран наиболее вероятный контекстуальный смысл.
- issue: Божественное имя в формуле клятвы
  choice: «Яхве».
  alternative: «Господь» или «Иегова»
  rationale: В исходном тексте стоит тетраграмматон; транслитерация сохраняет личное заветное имя.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Единственное число в обращении к олицетворённому Израилю сменяется множественным числом в последующих запретах в соответствии с формами еврейского текста. Резкая метафора не смягчена.
