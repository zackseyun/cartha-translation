lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет вводящую итоговое положение форму еврейского оборота и соединительный союз, не добавляя явно следственного значения.
- source_word: כָעָם כַּכֹּהֵן
  choice: как народ, так и священник
  rationale: Передаёт краткое сопоставление и равенство народа и священника перед судом; конструкция звучит естественно и афористично по-русски.
- source_word: וּפָקַדְתִּי עָלָיו
  choice: И Я накажу его
  rationale: В контексте суда פקד с עַל означает привлечь к ответу или наказать; единственное число местоимения сохранено.
- source_word: דְּרָכָיו
  choice: за его пути
  rationale: «Пути» сохраняют образ нравственного образа жизни и привычную пророческую лексику.
- source_word: וּמַעֲלָלָיו אָשִׁיב לוֹ
  choice: и воздам ему за его дела
  rationale: Передаёт судебное воздаяние по совершённым поступкам, сохраняя различие между «путями» и «делами».
theological_decisions:
- issue: К кому относятся местоимения единственного числа в словах о суде
  choice: 'Сохранить формы единственного числа: «его», «ему».'
  alternative: Передать во множественном числе («их», «им») либо отнести местоимения исключительно к священнику.
  rationale: Еврейский текст после сопоставления народа и священника употребляет единственное число. Его сохранение не устраняет возможный собирательный или распределительный смысл и не решает преждевременно, сужается ли речь только до священника.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Сохранены афористичность первой фразы, судебная лексика и неоднозначность местоимений.
