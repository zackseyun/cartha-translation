  text: חֲב֧וּר עֲצַבִּ֛ים אֶפְרָ֖יִם הַֽנַּֽח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/017.yaml
  text: Ephraim is joined to idols[a]; leave him alone.
translation:
  language: ru
  text: Ефрем связан с идолами[a] — оставь его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ефрем привязан к идолам — оставь его в покое». Еврейская фраза предельно кратка; заключительное повеление может означать, что Ефрема предоставляют избранному им идолопоклонству.'
    reason: Лексическая альтернатива для חֲבוּר и сохранение неоднозначного оттенка заключительного императива.
lexical_decisions:
- source_word: חֲבוּר
  choice: привязан
  rationale: Страдательное причастие от חבר выражает прочную связь или соединённость. «Привязан» естественно по-русски и сохраняет образ зависимости, не уточняя сверх текста природу этой связи.
- source_word: עֲצַבִּים
  choice: идолам
  rationale: Хотя слово может обозначать изваяния или изображения, в пророческой речи оно обычно означает идолов как предметы ложного поклонения.
- source_word: אֶפְרָיִם
  choice: Ефрем
  rationale: Собственное имя сохранено без поясняющей замены на «Израиль» или «северное царство», чтобы удержать метонимию и персонификацию исходного текста.
- source_word: הַנַּח
  choice: оставь
  rationale: Императив означает позволить оставаться как есть, не вмешиваться или оставить в покое. Краткое «оставь» передаёт резкость еврейской команды.
- source_word: לוֹ
  choice: его
  rationale: Местоименный суффикс мужского рода единственного числа отнесён к персонифицированному Ефрему; в русской конструкции с глаголом «оставить» он естественно передаётся прямым дополнением.
theological_decisions:
- issue: Кого обозначает Ефрем
  choice: В основном тексте сохранено имя «Ефрем».
  alternative: Понять Ефрема как обозначение северного царства или Израиля.
  rationale: У пророка имя, вероятно, обозначает северное царство, но замена имени толкованием ослабила бы пророческую риторику и сняла бы заложенную в тексте метонимию.
- issue: Смысл заключительного повеления
  choice: 'Повеление подразумеваемому адресату не вмешиваться: «оставь его».'
  alternative: «Оставь его в покое» или «пусть остаётся»; реже — обращение к самому Ефрему.
  rationale: Адресат в еврейском тексте не назван, а синтаксис предельно краток. Основной вариант передаёт наиболее прямое прочтение, тогда как оттенок оставления Ефрема его избранному идолопоклонству отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык; краткость и резкость исходной пророческой фразы сохранены. Тире передаёт внезапный переход от утверждения к повелению.
