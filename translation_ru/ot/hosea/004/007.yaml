  yaml_path: translation/ot/hosea/004/007.yaml
  text: The more they increased[a], the more they sinned against me[b]; I will change their glory into disgrace.
translation:
  language: ru
  text: Чем больше их становилось[a], тем больше они грешили против Меня; Я сменю их славу на позор[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «По мере того как они умножались, они грешили против Меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Я променяю их славу на позор».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרֻבָּם ... כֵּן
  choice: Чем больше их становилось, тем больше
  rationale: 'Парная конструкция כְּ... כֵּן выражает соразмерность: по мере их умножения возрастал и их грех. Русская конструкция «чем больше... тем больше...» естественно и точно передаёт эту связь.'
- source_word: חָטְאוּ לִי
  choice: они грешили против Меня
  rationale: Глагол חטא с ל указывает на грех, направленный против Бога; «грешили против Меня» — естественная современная русская формулировка.
- source_word: כְּבוֹדָם
  choice: их славу
  rationale: כָּבוֹד может означать славу, честь или высокое положение. «Слава» сохраняет смысловую широту и возможную иронию, не уточняя неоднозначный референт.
- source_word: בְּקָלוֹן
  choice: на позор
  rationale: קָלוֹן обозначает позор, бесчестие. В сочетании с глаголом изменения русский предлог «на» ясно выражает замену одного другим.
- source_word: אָמִיר
  choice: Я сменю
  rationale: Форма первого лица единственного числа означает «изменю, заменю, обменяю». «Сменю ... на ...» передаёт намеренное превращение или замену и звучит естественно по-русски.
theological_decisions:
- issue: К чему относится выражение «их слава»
  choice: 'Сохранено без поясняющего расширения: «их слава»'
  alternative: Их священническая честь; их богатство или положение; сам Бог как их слава
  rationale: Еврейский текст не уточняет, что именно было их славой. Сохранение неоднозначности позволяет не сужать смысл и не навязывать богословское толкование.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественный пророческий регистр. Коррелятивная структура и контраст «слава — позор» сохранены, неоднозначность слова «слава» не устранена.
