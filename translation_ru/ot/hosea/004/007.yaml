  source_fidelity: Русский текст точно передаёт коррелятивную конструкцию כְּרֻבָּם ... כֵּן («чем больше... тем больше...»), направленность греха против Бога (חָטְאוּ לִי), а также контраст между «славой» и «позором». «Я сменю их славу на позор» адекватно выражает первое лицо и значение изменения/обмена в אָמִיר, не уточняя спорный референт «их славы».
  naturalness: Формулировка естественна для современного литературного русского и сохраняет краткий пророческий регистр. Конструкция «Чем больше их становилось, тем больше они грешили» звучит гладко и не добавляет отсутствующего в оригинале субъекта умножения.
  terminology: «Грешили против Меня», «слава» и «позор» уместны и семантически соответствуют חטא, כבוד и קלון. Местоимение «Меня» с прописной буквы согласуется с русской библейской издательской нормой. Сноски содержательно соответствуют обозначенным лексическим альтернативам и корректно привязаны к тексту.
