  text: סָ֖ר סָבְאָ֑/ם הַזְנֵ֣ה הִזְנ֔וּ אָהֲב֥וּ הֵב֛וּ קָל֖וֹן מָגִנֶּֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/004/018.yaml
  text: When their drink is gone[a], they give themselves to prostitution[c][b]; her shields dearly love shame.
translation:
  language: ru
  text: Когда кончается их хмельное питьё[a], они безудержно предаются блуду; её щиты[c] страстно любят позор[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда их питьё прокисает»; или: «Когда проходит их опьянение». Начало еврейского текста трудно для понимания: речь может идти как об окончании попойки, так и о питье, которое испортилось или «отступило».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский оборот труден. Возможен более буквальный разбор: «они любят: „Дайте позор!“»'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «её щиты»; вероятно, это образ её правителей или защитников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סָר סָבְאָם
  choice: когда кончается их хмельное питьё
  rationale: סָר буквально означает «отступило, удалилось», а סָבְאָם — «их хмельное питьё / попойка». В основном тексте передан вероятный смысл окончания выпивки, а неоднозначность сочетания сохранена в сноске.
- source_word: הַזְנֵה הִזְנוּ
  choice: они безудержно предаются блуду
  rationale: Сочетание абсолютного инфинитива с личной формой того же корня усиливает действие. «Предаются блуду» сохраняет намеренно резкий образ сексуальной и одновременно заветной неверности; «безудержно» передаёт усиление без архаической конструкции.
- source_word: אָהֲבוּ הֵבוּ
  choice: страстно любят
  rationale: Оборот труден. אָהֲבוּ значит «любят / полюбили», тогда как הֵבוּ формально может пониматься как «дайте!», но в данном сочетании нередко считается усилительным. «Страстно любят» естественно передаёт вероятный общий смысл, не скрывая альтернативы в сноске.
- source_word: קָלוֹן
  choice: позор
  rationale: Прямой современный эквивалент существительного со значением позора, бесчестья и постыдности.
- source_word: מָגִנֶּיהָ
  choice: её щиты
  rationale: Сохранён буквальный поэтический образ. Вероятный метафорический смысл — правители или защитники страны — указан в сноске.
theological_decisions:
- issue: Следует ли смягчать образ блуда, превращая его в отвлечённую «неверность»
  choice: Сохранить в основном тексте язык блуда
  alternative: «они проявляют крайнюю неверность»
  rationale: Осия намеренно использует образ половой распущенности для обличения неверности Израиля завету. Конкретный образ сохраняет силу пророческой речи и не сводит её к одному отвлечённому толкованию.
- issue: Следует ли раскрыть מָגִנֶּיהָ как «правители» непосредственно в тексте
  choice: Оставить «её щиты», объяснив метафору в сноске
  alternative: «её правители» или «её защитники»
  rationale: Буквальный образ допускает метафорическое прочтение, но сам текст его не разъясняет. Сохранение «щитов» удерживает поэтическую неоднозначность источника.
translation_notes:
  register: Современный литературный русский язык с сохранением резкости пророческого образа. «Хмельное питьё» передаёт связь существительного с опьяняющим питьём, не вводя узкого обозначения конкретного напитка. «Блуд» выбран как понятное и достоинственное библейское слово без эвфемистического устранения образа. Пунктуация сохраняет резкий переход между двумя обличениями.
