  source_fidelity: Основной текст точно передаёт трудное начальное сочетание סָר סָבְאָם как окончание их питья, не устраняя его лексическую неопределённость; существенные альтернативы приведены в сноске a. Усиленная конструкция הַזְנֵה הִזְנוּ удачно отражена словами «безудержно предаются блуду». Поэтическое и неоднозначное מָגִנֶּיהָ сохранено буквально как «её щиты», а трудный оборот אָהֲבוּ הֵבוּ קָלוֹן передан без догматического истолкования и снабжён альтернативным разбором.
