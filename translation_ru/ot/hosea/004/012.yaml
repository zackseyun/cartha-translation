  yaml_path: translation/ot/hosea/004/012.yaml
  text: My people consult their piece of wood[a], and their staff tells them; for a spirit of whoredom has led them astray, and they have played the whore[c][b], departing from under their God.
translation:
  language: ru
  text: Мой народ спрашивает совета у своего куска дерева[a], и его посох возвещает ему; ведь дух блуда[b] сбил их с пути, и они предались блуду, уйдя из-под своего Бога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у своего дерева»; по смыслу возможно: «у своего деревянного идола». В еврейском тексте буквально стоит «у его дерева»; вероятно, это собирательное единственное число, обозначающее деревянный культовый предмет, применявшийся для гадания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «дух распутства» либо «дух неверности». Еврейское выражение сохраняет явную метафору проституции и половой неверности.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «из-под своего Бога». Это выражение описывает уход от подобающей верности Богу и от пребывания под Его властью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּי
  choice: Мой народ
  rationale: 'Сохраняет коллективное и заветное значение עַם с суффиксом первого лица: Господь говорит об Израиле как о Своём народе.'
- source_word: בְּעֵצוֹ
  choice: у своего куска дерева
  rationale: Передаёт конкретное значение «дерево, древесина» и насмешливую силу образа; в данном контексте речь идёт о деревянном культовом предмете, используемом для гадания.
- source_word: יִשְׁאַל
  choice: спрашивает совета
  rationale: Глагол означает «спрашивать, вопрошать»; выражение естественно передаёт обращение к предмету за прорицательным указанием.
- source_word: וּמַקְלוֹ
  choice: его посох
  rationale: מַקֵּל означает «посох, палка». «Посох» уместен в контексте гадательной практики и сохраняет форму единственного числа, согласованную с коллективным словом «народ».
- source_word: יַגִּיד לוֹ
  choice: даёт ему ответ
  rationale: Hiphil от נגד означает «сообщать, возвещать, давать знать». По-русски эта формулировка естественно выражает олицетворённый ответ посоха.
- source_word: רוּחַ זְנוּנִים
  choice: дух блуда
  rationale: Сохраняет явную сексуальную метафору неверности, характерную для Осии, не сводя выражение только к отвлечённой «неверности».
- source_word: הִתְעָה
  choice: сбил их с пути
  rationale: Hiphil от תעה выражает побуждение заблудиться или уклониться; русский оборот сохраняет одновременно образ пути и смысл нравственного заблуждения.
- source_word: וַיִּזְנוּ
  choice: они блудят
  rationale: Сохраняет резкую пророческую метафору זנה и переход еврейского текста от коллективного единственного числа к множественному.
- source_word: מִתַּחַת אֱלֹהֵיהֶם
  choice: уходя из-под власти своего Бога
  rationale: Буквальное «из-под своего Бога» обозначает выход из-под надлежащей верности и власти. Добавление «власти» делает идиому понятной, сохраняя её пространственный образ.
theological_decisions:
- issue: Сексуальная метафора идолопоклонства
  choice: В основном тексте сохранены выражения «дух блуда» и «они блудят».
  alternative: Смягчить до «дух неверности» и «они изменяют Богу».
  rationale: Осия намеренно описывает отступничество Израиля языком сексуальной неверности; нейтрализация образа ослабила бы пророческую резкость текста.
- issue: Значение выражения מִתַּחַת אֱלֹהֵיהֶם
  choice: «уходя из-под власти своего Бога»
  alternative: «отступая от своего Бога» или буквально «из-под своего Бога»
  rationale: Выбранный вариант передаёт и буквальный образ нахождения «под», и подразумеваемые отношения принадлежности, верности и власти, не ограничивая их одной конфессиональной трактовкой.
- issue: Коллективное единственное число и последующее множественное число
  choice: Сначала употреблены формы «его», «ему» при слове «народ», затем сохранён переход к «их», «они».
  alternative: Повсюду использовать множественное число либо сгладить весь стих в единственном числе.
  rationale: Так русский текст отражает заметный переход исходного текста от народа как единого целого к составляющим его людям, хотя эта грамматическая напряжённость остаётся ощутимой.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Выражение «кусок дерева» намеренно сохраняет конкретность и насмешливый оттенок оригинала; «дух блуда» и «блудят» удерживают резкую метафору, не прибегая к более архаичному «блудодействуют». Пунктуация подчёркивает причинную связь, вводимую כִּי.
