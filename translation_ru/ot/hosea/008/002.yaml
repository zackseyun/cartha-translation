lexical_decisions:
- source_word: לִי
  choice: Ко Мне
  rationale: 'Предлог ל с суффиксом первого лица здесь естественно обозначает направление обращения: к Богу. Форма «ко Мне» ясна и сохраняет прямую направленность вопля.'
- source_word: יִזְעָקוּ
  choice: они взывают
  rationale: Глагол זעק обозначает громкий, нередко отчаянный призыв о помощи. «Взывают» передаёт настойчивость обращения и соответствует достоинству пророческой речи.
- source_word: אֱלֹהַי
  choice: Бог мой
  rationale: Существительное с суффиксом первого лица представляет непосредственное обращение. Порядок «Бог мой» естественно звучит как воззвание и не требует добавления междометия.
- source_word: יְדַעֲנוּךָ
  choice: мы… знаем Тебя
  rationale: ידע в Qal непосредственно значит «знать», но в данном контексте может подразумевать признанные отношения с Богом. Основной текст сохраняет простое значение, не разворачивая его богословски.
- source_word: יִשְׂרָאֵל
  choice: мы, Израиль
  rationale: Название «Израиль» стоит после глагола первого лица множественного числа и, вероятнее всего, поясняет, кто такие «мы». Русская аппозиция сохраняет подчёркнутое самоотождествление говорящих, не превращая Израиль в адресата.
theological_decisions:
- issue: Смысл глагола «знать» в контексте отношений завета
  choice: Сохранить прямое утверждение «знаем Тебя», пояснив возможный более широкий оттенок в сноске.
  alternative: «признаём Тебя»; «состоим с Тобой в завете»
  rationale: У Осии «знать» может включать верность и признание отношений с Богом, однако расширенный перевод преждевременно истолковал бы заявление Израиля и ослабил бы иронию контекста.
- issue: Синтаксическая роль слова «Израиль»
  choice: 'Передать как приложение к «мы»: «мы, Израиль».'
  alternative: Понять «Израиль» как отдельное обращение либо оставить синтаксически обособленным.
  rationale: Положение после формы «мы знаем Тебя» лучше всего объясняется emphатическим самообозначением говорящих. Такая передача сохраняет резкость еврейской фразы и не меняет адресата речи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Заглавные буквы в местоимениях «Мне», «Тебя» обозначают обращение к Богу согласно принятой русской библейской традиции. Пунктуация сохраняет прямую речь и подчёркнутое самоименование Израиля.
