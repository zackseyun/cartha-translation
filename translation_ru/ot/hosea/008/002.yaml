  text: 'Ко Мне они взывают[a]: «Боже мой, мы, Израиль, знаем Тебя!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «громко зовут», «кричат о помощи». Еврейский глагол может обозначать настойчивый вопль в беде.'
