source:
  edition: WLC
  text: אֶל חִכְּ/ךָ֣ שֹׁפָ֔ר כַּ/נֶּ֖שֶׁר עַל בֵּ֣ית יְהוָ֑ה יַ֚עַן עָבְר֣וּ בְרִיתִ֔/י וְ/עַל תּוֹרָתִ֖/י פָּשָֽׁעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/001.yaml
  text: Put the trumpet to your mouth! Like an eagle over the house of Yahweh[c][b][a], because they have transgressed my covenant and rebelled against my law.
translation:
  language: ru
  text: Трубу — к устам! Как орёл[a] — над домом Яхве[b], потому что они нарушили мой завет и восстали против моего закона[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как гриф». Еврейское נֶשֶׁר может обозначать крупную хищную птицу без точного указания вида.'
    reason: lexical_alternative
  - marker: b
    text: «Дом Яхве» может означать не только храм, но также народ завета или принадлежащую Яхве землю; еврейский текст не уточняет значение.
    reason: referential_ambiguity
  - marker: c
    text: 'Или: «моего наставления». Еврейское תּוֹרָה означает закон, наставление или учение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל חִכְּךָ שֹׁפָר
  choice: Трубу — к устам!
  rationale: Сохраняет бессказуемную, резкую форму еврейского призыва и естественно звучит как повеление подать сигнал тревоги. «Уста» передаёт חֵךְ в данном контексте без излишне анатомического «нёбо».
- source_word: כַּנֶּשֶׁר
  choice: как орёл
  rationale: נֶשֶׁר обозначает крупную хищную птицу; традиционное «орёл» хорошо передаёт образ стремительной угрозы, а возможное «гриф» отмечено в сноске.
- source_word: עַל בֵּית יְהוָה
  choice: над домом Яхве
  rationale: «Над» сохраняет пространственный образ хищной птицы, нависшей над целью, не устраняя возможного враждебного оттенка предлога עַל.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: 'Буквальный оборот сохраняет неоднозначность: речь может идти о святилище, земле или народе завета, а не обязательно только о храме.'
- source_word: עָבְרוּ בְרִיתִי
  choice: нарушили мой завет
  rationale: В сочетании с «заветом» עבר идиоматически означает его преступление или нарушение. Русское «перешли мой завет» было бы неясным и неестественным.
- source_word: תּוֹרָתִי
  choice: моего закона
  rationale: В контексте нарушения завета «закон» передаёт юридическую силу תּוֹרָה; более широкое значение «наставление» сохранено в сноске.
- source_word: פָּשָׁעוּ
  choice: восстали против
  rationale: פשע выражает сознательный мятеж и неповиновение, а не просто случайный проступок.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
theological_decisions:
- issue: Значение выражения «дом Яхве»
  choice: Сохранить буквальное выражение без уточнения референта
  alternative: храм Яхве; народ или домочадцы Яхве; земля Яхве
  rationale: Контекст Осии допускает более широкий смысл, чем одно лишь здание храма; перевод не должен преждевременно устранять эту пророческую многозначность.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя; транслитерация сохраняет его функцию как имени Бога завета.
- issue: Соотношение «завета» и «закона»
  choice: Сохранить параллельные, но не тождественные понятия
  alternative: Свести оба выражения к общему понятию непослушания
  rationale: Еврейский текст отдельно говорит о нарушении завета и мятеже против Торы; перевод сохраняет это смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с краткой, тревожной пророческой интонацией. Начальная бессказуемная конструкция и тире сохраняют резкость оригинала; лексика остаётся понятной, но торжественной.
