  text: זָנַ֥ח יִשְׂרָאֵ֖ל ט֑וֹב אוֹיֵ֖ב יִרְדְּֽפ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/003.yaml
  text: Israel has rejected the good[a]; an enemy will pursue him.
translation:
  language: ru
  text: Израиль отверг добро[a] — враг будет преследовать его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то, что хорошо»; возможно также: «благо».'
    reason: Лаконичное еврейское טוֹב допускает несколько близких по смыслу русских передач.
lexical_decisions:
- source_word: זָנַח
  choice: отверг
  rationale: Глагол означает сознательно отвергнуть, отринуть или отбросить; «отверг» ясно и точно передаёт решительный характер действия.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохраняется общепринятое русское написание имени; народ представлен как единое лицо.
- source_word: טוֹב
  choice: добро
  rationale: 'Субстантивированное прилагательное имеет широкий смысл: добро, благо, то, что хорошо. «Добро» естественно по-русски и не сужает значение до одного конкретного блага.'
- source_word: אוֹיֵב
  choice: враг
  rationale: Единственное число имеет обобщённый характер. Из-за отсутствия артиклей в русском «враг» не уточняет без основания, определённый это враг или неопределённый.
- source_word: יִרְדְּפוֹ
  choice: будет преследовать его
  rationale: Имперфект передаёт предстоящее следствие, а местоименное окончание мужского рода единственного числа сохранено словом «его».
theological_decisions:
- issue: Число и референт местоименного суффикса в יִרְדְּפוֹ
  choice: '«будет преследовать его»: Израиль представлен как единое лицо мужского рода'
  alternative: '«будет преследовать их»: согласование по смыслу с народом как множеством людей'
  rationale: В еврейском тексте стоит суффикс третьего лица мужского рода единственного числа; буквальное число сохраняет пророческую персонификацию Израиля.
- issue: Объём значения טוֹב
  choice: «добро» в широком нравственном и религиозном смысле
  alternative: «то, что хорошо» или «благо»
  rationale: Контекст не требует отождествлять слово с каким-либо одним конкретным благом или вводить дополнительное богословское уточнение.
translation_notes:
  register: Современный литературный русский язык; краткость и резкость пророческого высказывания сохранены. Тире естественно обозначает переход от отвержения добра к его последствию, не делая причинную связь более явной, чем в оригинале.
