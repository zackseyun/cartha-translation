  source_fidelity: 'Первые две параллельные клаузулы в целом переданы верно: הִמְלִיכוּ — «ставили царей», הֵשִׂירוּ — «назначали правителей», а מִמֶּנִּי естественно сохранено как «не от Меня». Однако «без Моего ведома» заменяет прямую реплику «Я не знал» толкованием об отсутствии санкции или участия. Финальное «на погибель себе» существенно переформулирует לְמַעַן יִכָּרֵת («чтобы … быть истреблёнными / чтобы … было истреблено»), превращая его в выражение саморазрушения и скрывая спорность референта единственного числа глагола.'
