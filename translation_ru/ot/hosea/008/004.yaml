  text: הֵ֤ם הִמְלִיכוּ֙ וְ/לֹ֣א מִמֶּ֔/נִּי הֵשִׂ֖ירוּ וְ/לֹ֣א יָדָ֑עְתִּי כַּסְפָּ֣/ם וּ/זְהָבָ֗/ם עָשׂ֤וּ לָ/הֶם֙ עֲצַבִּ֔ים לְמַ֖עַן יִכָּרֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/004.yaml
  text: They made kings, but not from me; they appointed princes, but I did not know it. With their silver and their gold they made idols for themselves, so that they might be cut off.
translation:
  language: ru
  text: Они ставили царей, но не от Меня; назначали правителей, а Я не знал. Из своего серебра и золота они делали себе идолов, чтобы быть истреблёнными.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте глагол стоит в единственном числе: «чтобы он/оно было истреблено». Его референт не вполне ясен; единственное число может относиться к народу как к целому.'
    reason: Сохраняет отмечаемую в оригинале грамматическую особенность и не решает спорный вопрос о том, относится ли глагол к народу, идолу или иному подразумеваемому референту.
lexical_decisions:
- source_word: הִמְלִיכוּ
  choice: ставили царей
  rationale: Каузативная форма от корня מלך означает «делать царём, ставить царём»; выражение передаёт самостоятельное учреждение царей народом.
- source_word: מִמֶּנִּי
  choice: от Меня
  rationale: Сохраняет буквальный образ источника или происхождения власти и не сужает смысл до одного лишь разрешения.
- source_word: הֵשִׂירוּ
  choice: назначали правителей
  rationale: В данном контексте глагол со значением поставления относится к должностным лицам; «правители» естественно передаёт שרים без излишне узкого титула.
- source_word: וְלֹא יָדָעְתִּי
  choice: но без Моего ведома
  rationale: Идиоматически передаёт отсутствие Божьего признания или участия, не предполагая недостатка знания у Бога.
- source_word: עֲצַבִּים
  choice: идолов
  rationale: Обычное и ясное обозначение культовых изображений ложных богов.
- source_word: לְמַעַן יִכָּרֵת
  choice: на погибель себе
  rationale: Конструкция допускает оттенок результата или цели; краткая русская формулировка сохраняет суровую причинно-следственную направленность, не уточняя сверх текста, кто именно совершит уничтожение.
theological_decisions:
- issue: Смысл слов «не от Меня»
  choice: Сохранено «не от Меня» как указание на отсутствие Божьего источника, санкции или участия.
  alternative: «без Моего позволения» / «не по Моей воле»
  rationale: Альтернативы преждевременно сводят многозначный предлог מִן к разрешению или воле; исходная формулировка шире.
- issue: Божье «незнание» поставленных правителей
  choice: Передано идиомой «без Моего ведома».
  alternative: «Я не знал»
  rationale: Русское буквальное выражение легко прочесть как утверждение о нехватке у Бога фактического знания; в контексте речь об отсутствии признания, одобрения или участия.
- issue: Цель или следствие изготовления идолов
  choice: «на погибель себе»
  alternative: «чтобы быть истреблёнными» / «так что они будут истреблены»
  rationale: לְמַעַן обычно выражает цель, но здесь возможен целевой оттенок результата; выбранная формула сохраняет напряжение и естественно звучит по-русски.
translation_notes:
  register: Современный литературный русский язык; пророческая речь передана кратко и весомо. Заглавные местоимения «Меня», «Моего» обозначают говорящего Бога. Параллелизм двух первых клауз сохранён, финал сделан естественным без ослабления приговора.
