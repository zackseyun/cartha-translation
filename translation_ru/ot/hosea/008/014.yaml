  text: וַ/יִּשְׁכַּ֨ח יִשְׂרָאֵ֜ל אֶת עֹשֵׂ֗/הוּ וַ/יִּ֨בֶן֙ הֵֽיכָל֔וֹת וִֽ/יהוּדָ֕ה הִרְבָּ֖ה עָרִ֣ים בְּצֻר֑וֹת וְ/שִׁלַּחְתִּי אֵ֣שׁ בְּ/עָרָ֔י/ו וְ/אָכְלָ֖ה אַרְמְנֹתֶֽי/הָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/014.yaml
  text: For Israel has forgotten his Maker and built palaces[a], and Judah has multiplied fortified cities; so I will send fire into his cities, and it will consume her citadels.
translation:
  language: ru
  text: Ибо Израиль забыл своего Создателя и построил дворцы[a], а Иуда умножил число укреплённых городов. Поэтому Я пошлю огонь в его города, и он пожрёт её цитадели[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храмы». Еврейское слово может обозначать как дворцы, так и храмовые сооружения.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте сначала буквально сказано «его города», затем — «её цитадели». «Его», вероятнее всего, относится к Иуде; женская форма во второй части допускает несколько способов понимания, в том числе соотнесение с землёй или совокупностью городов.
    reason: referent_ambiguity
lexical_decisions:
- source_word: עֹשֵׂהוּ
  choice: своего Создателя
  rationale: Причастие от עשה с суффиксом 3-го лица мужского рода единственного числа обозначает Того, кто создал Израиль. «Своего Создателя» звучит естественно и сохраняет личный и богословский смысл выражения.
- source_word: הֵיכָלוֹת
  choice: дворцы
  rationale: היכל может обозначать дворец или храм. В параллели с укреплёнными городами и последующими крепостями «дворцы» лучше передаёт тему упования на политическое могущество; возможное значение «храмы» сохранено в сноске.
- source_word: הִרְבָּה
  choice: умножил число
  rationale: Порода хифиль от רבה выражает увеличение количества. Формулировка передаёт намеренное наращивание числа укреплённых городов, не добавляя прямо не названного глагола «строить».
- source_word: עָרִים בְּצֻרוֹת
  choice: укреплённых городов
  rationale: Устойчивое и ясное русское обозначение городов, защищённых оборонительными сооружениями.
- source_word: וְשִׁלַּחְתִּי אֵשׁ
  choice: Поэтому Я пошлю огонь
  rationale: Союз связывает упование Иуды на укрепления с последующим судом. «Поэтому» естественно выражает эту смысловую связь.
- source_word: בְּעָרָיו
  choice: на его города
  rationale: Предлог ב при посылании огня передан естественным русским оборотом. Местоимение мужского рода оставлено, чтобы ближайшим возможным референтом оставался Иуда.
- source_word: אַרְמְנֹתֶיהָ
  choice: её крепости
  rationale: אַרְמוֹן может обозначать дворец или укреплённую твердыню; военном контексте выбрано «крепости». Местоимение женского рода сохраняет заметную смену грамматического рода в еврейском тексте, не устраняя неоднозначность.
theological_decisions:
- issue: Смена рода местоименных суффиксов в заключительной части
  choice: Сохранены формы «его города» и «её крепости», а неоднозначность пояснена в сноске.
  alternative: Сгладить переход как «города Иуды, и огонь пожрёт их крепости» либо отнести обе формы к одному референту.
  rationale: В еврейском тексте у «городов» стоит суффикс мужского рода единственного числа, а у «крепостей» — женского рода единственного числа. Явное сохранение этой смены не навязывает единственного толкования.
- issue: Значение הֵיכָלוֹת
  choice: В основном тексте — «дворцы», в сноске — «храмы».
  alternative: Храмы.
  rationale: Контекст политической и военной самоуверенности поддерживает значение «дворцы», однако культовое значение слова действительно возможно и потому сохранено.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся ясным для широкого читателя; образ огня и глагол «пожрёт» сохраняют силу оригинала. Заглавная «Я» обозначает речь Бога согласно русской издательской традиции.
