base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/010.yaml
  text: Even though they hire among the nations[a], now I will gather them[c][b]; and they will begin to diminish under the burden of the king of princes.
translation:
  language: ru
  text: Хотя они и нанимают себе союзников среди народов[a], теперь Я соберу их; и они начнут убывать[b] под бременем царя князей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хотя они и дают среди народов». Еврейский глагол обычно означает «давать», но здесь, вероятно, говорится о плате чужим народам за союз или поддержку.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст этой части стиха труден. Возможны также переводы: «они немного помучаются» или «их станет мало из-за бремени (дани)».'
    reason: alternative_reading
  - marker: c
    text: «Бремя царя князей» может означать тяжёлую дань или поборы, наложенные верховным правителем империи.
    reason: cultural_note
lexical_decisions:
- source_word: יִתְנוּ בַגּוֹיִם
  choice: нанимают себе союзников среди народов
  rationale: Обычное значение נתן — «давать», однако в контексте Ос. 8:9–10 речь, вероятно, идёт о плате за расположение и помощь чужих народов. Добавление «союзников» делает подразумеваемый объект понятным по-русски, не называя конкретную державу.
- source_word: עַתָּה
  choice: теперь
  rationale: Прямое соответствие временному наречию, указывающему на близкий ответ Бога.
- source_word: אֲקַבְּצֵם
  choice: Я соберу их
  rationale: Нейтрально передаёт קבץ («собирать») и не уточняет в основном тексте, совершается ли это ради суда или восстановления.
- source_word: וַיָּחֵלּוּ מְּעָט
  choice: они начнут убывать
  rationale: Трудная еврейская конструкция. Такой перевод связывает ויחלו со значением «начинать», а מעט — с уменьшением численности или силы; иные возможные толкования отмечены в сноске.
- source_word: מִמַּשָּׂא
  choice: под бременем
  rationale: מַשָּׂא означает тяжесть или бремя и здесь может конкретно подразумевать дань либо поборы имперского владыки. «Под бременем» сохраняет образ и его политический оттенок.
- source_word: מֶלֶךְ שָׂרִים
  choice: царя князей
  rationale: Сохраняет краткую еврейскую сопряжённую конструкцию и не заменяет её толкованием «царь и князья». Вероятно, имеется в виду верховный правитель, стоящий над подчинёнными властителями.
theological_decisions:
- issue: Означает ли אֲקַבְּצֵם восстановительное собирание или собирание для суда
  choice: В контексте подразумевается собирание для суда, но цель не добавлена в основной текст
  alternative: Собирание ради восстановления
  rationale: Ближайший контекст обличает политические союзы Израиля и предвещает угнетение. Поэтому судебный смысл вероятнее, однако сам глагол «соберу» оставлен без поясняющего дополнения, чтобы сохранить присущую еврейскому тексту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Синтаксис близок к краткости еврейского текста; трудные места не сглажены безоговорочно, а существенные альтернативы вынесены в сноски.
