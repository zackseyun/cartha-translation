  text: נִבְלַ֖ע יִשְׂרָאֵ֑ל עַתָּה֙ הָי֣וּ בַ/גּוֹיִ֔ם כִּ/כְלִ֖י אֵֽין חֵ֥פֶץ בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/008.yaml
  text: Israel is swallowed up[a]; now they are among the nations like a vessel in which there is no delight.
translation:
  language: ru
  text: Израиль поглощён; теперь они среди народов — как сосуд, который никому не нужен.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «сосуд, в котором нет желания [к нему]»; также возможно: «сосуд, которого никто не желает».'
    reason: Сноска сохраняет буквальную структуру и лексическую неоднозначность выражения אֵין חֵפֶץ בּוֹ, тогда как основной текст естественно передаёт его смысл.
lexical_decisions:
- source_word: נִבְלַע
  choice: поглощён
  rationale: 'Форма нифаль от בלע передаёт пассивное действие: Израиль «проглочен», «поглощён». Краткая форма сохраняет яркость образа и допускает понимание совершившегося суда с продолжающимся результатом.'
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Собственное имя обозначает здесь северное царство и его народ; сохранено без поясняющей конфессиональной интерпретации.
- source_word: עַתָּה
  choice: теперь
  rationale: Передаёт временной переход к нынешнему положению Израиля как следствию суда.
- source_word: הָיוּ
  choice: израильтяне … [оказались/находятся]
  rationale: Глагол стоит во множественном числе и относится к людям, составляющим коллективно названный Израиль. Существительное «израильтяне» делает этот переход числа естественным по-русски; состояние выражено именной конструкцией с тире.
- source_word: בַגּוֹיִם
  choice: среди других народов
  rationale: גּוֹיִם означает здесь чужие народы. Слово «других» естественно обозначает противопоставление Израиля окружающим народам, не привнося позднейших ассоциаций слова «язычники».
- source_word: כִּכְלִי
  choice: словно сосуд
  rationale: כְּלִי может обозначать сосуд, предмет или утварь; «сосуд» сохраняет конкретный образ и возвышенный, но понятный регистр.
- source_word: אֵין חֵפֶץ בּוֹ
  choice: который никому не нужен
  rationale: Естественная русская передача идиомы об отсутствии желания, расположения или ценности в глазах окружающих. Более буквальная форма приведена в сноске, чтобы сохранить лексическую неоднозначность חֵפֶץ.
theological_decisions:
- issue: Переход от единственного «Израиль» к глаголу во множественном числе
  choice: Явно назвать «израильтян» во второй части
  alternative: «Израиль поглощён; теперь они среди народов…» или сохранить единственное число «он»
  rationale: Еврейский текст переходит от коллективного имени в единственном числе к множественному числу, подразумевая людей Израиля. Выбранный вариант сохраняет смысловой переход и избегает неясного русского местоимения, не меняя референта.
translation_notes:
  register: Современный литературный русский с лаконичным пророческим ритмом. Образ поглощения и сравнение с сосудом сохранены; архаическое «язычники» не используется. Точка с запятой разделяет приговор и его нынешнее следствие, а тире подчёркивает сравнение.
