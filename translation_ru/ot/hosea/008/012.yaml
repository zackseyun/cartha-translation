  text: Though I wrote for him the many things of my law[a], they were regarded as something foreign.
translation:
  language: ru
  text: Хотя Я написал для него множество предписаний Моего Закона[a], их сочли чем-то чужим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Если бы Я написал для него мириады Моих наставлений (Моей Торы), их сочли бы чужими». Начальный еврейский глагол допускает значение незавершённого или гипотетического действия, а слово «Закон» может быть переведено также как «наставление» или «Тора».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אכתוב
  choice: Хотя Я написал
  rationale: Форма Qal imperfect, 1-е лицо единственного числа, в данном контексте может обозначать уже совершавшееся действие или иметь риторико-гипотетический оттенок. Прошедшее время с уступительным «хотя» естественно передаёт противопоставление между данным Богом наставлением и его отвержением.
- source_word: לוֹ
  choice: для него
  rationale: Предлог ל с местоименным суффиксом допускает значения «ему» и «для него». Выбрано «для него» как естественное обозначение того, кому предназначался Закон, с сохранением корпоративного единственного числа.
- source_word: רבו
  choice: множество предписаний
  rationale: Слово выражает многочисленность, вплоть до значения «мириады». В сочетании с תורתי перевод «множество предписаний» ясно и естественно передаёт обилие содержания Закона, не вводя буквального числового значения.
- source_word: תּוֹרָתִי
  choice: Моего Закона
  rationale: תּוֹרָה означает наставление, учение или Закон. «Моего Закона» сохраняет узнаваемый заветный смысл, а возможный перевод «Моего наставления / Моей Торы» указан в сноске.
- source_word: כְּמוֹ זָר
  choice: чем-то чужим
  rationale: Сравнительная конструкция указывает, что Божьи предписания воспринимались как чуждые, словно они не относились к народу.
- source_word: נֶחְשָׁבוּ
  choice: их сочли
  rationale: Niphal perfect, 3-е лицо множественного числа от חשב, выражает оценку или отношение. «Их сочли» кратко и естественно передаёт пассивное значение «были признаны / считались».
theological_decisions:
- issue: К кому относится местоимение единственного числа לוֹ
  choice: Сохранено «для него», подразумевающее Израиль/Ефрема как единый народ
  alternative: 'Передать во множественном числе: «для них»'
  rationale: Осия часто говорит о народе как об одном лице. Сохранение единственного числа следует еврейской грамматике и не устраняет корпоративный смысл.
- issue: Характер תּוֹרָה
  choice: «Закон» с пояснением лексической широты в сноске
  alternative: «наставление» или «Тора»
  rationale: В пророческом заветном контексте «Закон» уместен и понятен, однако слово не ограничивается юридическими нормами; поэтому более широкое значение сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Прописные буквы в «Я» и «Моего Закона» обозначают речь Бога. Формулировка сохраняет единственное число адресата и смысловой контраст между дарованным Законом и отношением к нему как к чему-то чужому.
