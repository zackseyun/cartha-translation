  text: זִבְחֵ֣י הַבְהָבַ֗/י יִזְבְּח֤וּ בָשָׂר֙ וַ/יֹּאכֵ֔לוּ יְהוָ֖ה לֹ֣א רָצָ֑/ם עַתָּ֞ה יִזְכֹּ֤ר עֲוֺנָ/ם֙ וְ/יִפְקֹ֣ד חַטֹּאותָ֔/ם הֵ֖מָּה מִצְרַ֥יִם יָשֽׁוּבוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/013.yaml
  text: As for the sacrifices of my offerings[a], they sacrifice flesh and eat it, but Yahweh does not accept them. Now he will remember their iniquity and punish their sins[c][b]; they will return to Egypt.
translation:
  language: ru
  text: Что касается жертв, которые они приносят Мне[a], они приносят в жертву мясо и едят его, но Яхве не принимает их[b]. Теперь Он вспомнит их беззаконие и покарает за их грехи; они возвратятся в Египет[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте стоит необычное выражение, буквально близкое к «жертвам Моих приношений». Возможно также: «Мои жертвенные дары»; менее вероятно: «Мои любимые жертвы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не благоволит к ним», «не доволен ими».'
    reason: lexical_alternative
  - marker: c
    text: «Возвратятся в Египет» может означать как буквальное возвращение, так и, шире, возвращение в рабство и изгнание, представленное образом Египта.
    reason: alternative_reading
lexical_decisions:
- source_word: זִבְחֵי הַבְהָבַי
  choice: жертв Моих приношений
  rationale: 'Необычное еврейское сочетание сохранено без конъектурного исправления: זִבְחֵי — форма сопряжённого состояния множественного числа («жертвы чего-либо»), а трудная форма הַבְהָבַי по контексту понимается как приношения или дары Богу. Начальное «Что до» естественно передаёт вынесенную вперёд тему.'
- source_word: יִזְבְּחוּ בָשָׂר וַיֹּאכֵלוּ
  choice: они приносят в жертву мясо и едят его
  rationale: זבח обозначает принесение или заклание жертвы, а בָשָׂר в жертвенном контексте — мясо жертвенного животного. Местоимение «его» делает объект глагола «едят» явным по нормам русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом «Господь».
- source_word: לֹא רָצָם
  choice: не принимает их
  rationale: В жертвенном контексте רצה выражает благосклонное принятие. Русское «не принимает» передаёт этот смысл, сохраняя возможную неоднозначность местоименного объекта «их».
- source_word: עַתָּה
  choice: Теперь
  rationale: Наречие отмечает переход от нынешнего культового поведения к наступающему суду.
- source_word: יִזְכֹּר עֲוֺנָם
  choice: Он вспомнит их беззаконие
  rationale: Сохранён образ «воспоминания», который в контексте суда означает, что вина будет принята во внимание. עָוֹן передано словом «беззаконие», не сводящим значение только к субъективной виновности.
- source_word: וְיִפְקֹד חַטֹּאותָם
  choice: и покарает за их грехи
  rationale: פקד в данном судебном контексте означает обратить внимание ради наказания, призвать к ответу. «Покарает за» естественно передаёт карательный смысл и сохраняет параллелизм с предыдущей строкой.
- source_word: הֵמָּה מִצְרַיִם יָשׁוּבוּ
  choice: они возвратятся в Египет
  rationale: Географическое название сохранено буквально. Контекст допускает как фактическое возвращение, так и образ нового рабства или изгнания; основной текст не устраняет эту напряжённость.
theological_decisions:
- issue: Смысл возвращения в Египет
  choice: они возвратятся в Египет
  alternative: они вновь окажутся в рабстве, подобном египетскому
  rationale: Еврейский текст прямо называет Египет. Буквальный перевод не решает за читателя, идёт ли речь о географическом возвращении, символическом возвращении в рабство и изгнание или об обоих смыслах одновременно.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис первой части слегка необычен, поскольку он прозрачно отражает трудное еврейское выражение; пояснение вынесено в сноску. Формы «беззаконие», «покарает» и «возвратятся» поддерживают возвышенный, но понятный регистр.
