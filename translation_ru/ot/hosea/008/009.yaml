  yaml_path: translation/ot/hosea/008/009.yaml
  text: For they have gone up to Assyria[a], like a wild donkey wandering alone[b]; Ephraim has hired lovers.
translation:
  language: ru
  text: Ведь они отправились в Ассирию — как дикий осёл, одинокий сам по себе[a]; Ефрем нанял любовников[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дикий осёл, одинокий сам по себе». В еврейском тексте нет слова «как», и синтаксическая связь образа с предыдущими словами допускает разные способы передачи.'
    reason: Сохранение синтаксической неоднозначности и буквального оттенка.
  - marker: b
    text: «Любовники» — образ неверности завету; в данном контексте имеются в виду чужеземные политические союзники, расположения которых Ефрем добивался платой.
    reason: Пояснение пророческой метафоры без её замены толкованием в основном тексте.
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Передаёт пояснительно-причинную связь с предшествующим обвинением и естественно звучит по-русски.
- source_word: הֵמָּה
  choice: они
  rationale: Сохраняет явно выраженное местоимение; усилительное «они сами» здесь могло бы внести излишний смысловой акцент.
- source_word: עָלוּ אַשּׁוּר
  choice: отправились в Ассирию
  rationale: Глагол буквально означает «поднялись», но в данном обозначении пути естественный современный русский требует «отправились»; направление передано формой «в Ассирию».
- source_word: פֶּרֶא
  choice: дикий осёл
  rationale: Сохраняет образ необузданного дикого животного без архаизации.
- source_word: בּוֹדֵד לוֹ
  choice: бродящий в одиночестве
  rationale: Передаёт обособленность животного и естественно соединяется с образом дикого осла; местоименное לוֹ усиливает значение отдельности.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Использована традиционная русская форма библейского имени.
- source_word: הִתְנוּ
  choice: нанял себе
  rationale: Глагол выражает приобретение или наём за плату; возвратное «себе» естественно передаёт форму и направленность действия.
- source_word: אֲהָבִים
  choice: любовников
  rationale: Сохраняет брачно-сексуальную метафору Осии; перевод «союзников» преждевременно истолковал бы образ.
theological_decisions:
- issue: Образ внешнеполитических союзов как супружеской неверности
  choice: Сохранено прямое обозначение «нанял себе любовников».
  alternative: «Нанял себе союзников» или «купил расположение союзников».
  rationale: У Осии отношения Израиля с чужеземными державами последовательно изображаются как неверность завету. Слово «любовников» удерживает богословскую силу метафоры, тогда как политический смысл поясняется в сноске.
- issue: Связь Ефрема с образом дикого осла
  choice: Сравнительная связь выражена словом «словно».
  alternative: 'Разделить фразы: «Одинокий дикий осёл! Ефрем нанял себе любовников».'
  rationale: В еврейском тексте сравнительная частица отсутствует, поэтому синтаксис сжат и допускает более резкое присоединение образа. В основном тексте явное сравнение делает наиболее вероятную связь понятной, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский, понятный широкому читателю, с сохранением резкого пророческого образа. «Отправились» выбрано вместо буквального, но неестественного здесь «поднялись»; «любовников» намеренно сохранено как центральная метафора стиха.
