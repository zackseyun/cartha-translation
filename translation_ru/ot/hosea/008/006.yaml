  text: כִּ֤י מִ/יִּשְׂרָאֵל֙ וְ/ה֔וּא חָרָ֣שׁ עָשָׂ֔/הוּ וְ/לֹ֥א אֱלֹהִ֖ים ה֑וּא כִּֽי שְׁבָבִ֣ים יִֽהְיֶ֔ה עֵ֖גֶל שֹׁמְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/006.yaml
  text: For it is from Israel[a]; a craftsman made it, and it is not God. Indeed[b], the calf of Samaria will become splinters.
translation:
  language: ru
  text: 'Ведь он из Израиля: мастер сделал его, и он не Бог[a]. Ибо телец Самарии станет обломками[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «он не бог». В еврейском тексте буквально: «и он не Бог» — у идола отрицается подлинная божественность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет разбит на куски»; возможный перевод: «станет осколками».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי (в начале стиха)
  choice: Ведь
  rationale: Союз вводит основание для предшествующего обличения; «ведь» естественно передаёт пояснительно-причинный оттенок.
- source_word: מִיִּשְׂרָאֵל
  choice: из Израиля
  rationale: 'Предлог מִן указывает на происхождение: идол появился в самом Израиле.'
- source_word: וְהוּא
  choice: он
  rationale: Местоимение относится к тельцу (עֵגֶל, мужской род); в русском согласование по мужскому роду естественно.
- source_word: חָרָשׁ
  choice: мастер
  rationale: Слово обозначает искусного ремесленника; общий термин не уточняет без достаточных оснований материал или вид ремесла.
- source_word: עָשָׂהוּ
  choice: сделал его
  rationale: Прямо передаёт глагол עשה с объектным суффиксом и подчёркивает рукотворность идола.
- source_word: וְלֹא אֱלֹהִים הוּא
  choice: и он не Бог
  rationale: Сохраняет прямое отрицание подлинной божественности идола, не смягчая его до описания одной лишь бесполезности.
- source_word: כִּי (перед שְׁבָבִים)
  choice: Да
  rationale: Здесь частица подчёркивает и подтверждает последующее объявление суда; краткое «да» передаёт усиление без добавочного толкования.
- source_word: שְׁבָבִים
  choice: обломками
  rationale: Редкое существительное обозначает мелкие части или осколки разрушенного предмета; «обломки» ясно выражает результат уничтожения и не предполагает непременно дерево.
- source_word: יִהְיֶה
  choice: станет
  rationale: Глагол с именной частью сказуемого выражает переход в новое состояние — превращение в обломки.
- source_word: עֵגֶל שֹׁמְרוֹן
  choice: телец Самарии
  rationale: Передаёт конструкцию сопряжённого состояния и связь идола с Самарией, столицей Северного царства.
theological_decisions:
- issue: Смысл отрицания «он не Бог»
  choice: Высказывание прямо отрицает истинную божественность тельца.
  alternative: «Он не бог» — более идиоматичное обозначение ложного божества.
  rationale: Еврейский текст непосредственно говорит וְלֹא אֱלֹהִים הוּא. Формулировка «не Бог» сохраняет остроту полемики и не привносит более поздних метафизических категорий.
translation_notes:
  register: Современный литературный русский язык с кратким, пророчески резким синтаксисом. Сохранены происхождение идола из Израиля, контраст между человеческим изготовлением и божественностью, а также образ его полного разрушения.
