source:
  edition: WLC
  text: זָנַח֙ עֶגְלֵ֣/ךְ שֹֽׁמְר֔וֹן חָרָ֥ה אַפִּ֖/י בָּ֑/ם עַד מָתַ֕י לֹ֥א יוּכְל֖וּ נִקָּיֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/005.yaml
  text: He has rejected your calf[a], O Samaria; my anger burns against them[b]. How long will they be incapable of innocence?
translation:
  language: ru
  text: Он отверг твоего тельца[a], Самария! Мой гнев пылает против них. Долго ли ещё они не смогут достичь чистоты[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Твой телец отверг тебя, Самария». Еврейский синтаксис допускает понимание «тельца» как подлежащего начального глагола, хотя в основном тексте подразумеваемым подлежащим считается Бог.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «невиновности», «незапятнанности». Еврейское слово может иметь как нравственный, так и культовый оттенок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנַח
  choice: отверг
  rationale: Глагол означает решительное отвержение или отбрасывание. «Отверг» естественно звучит в современном русском и сохраняет силу пророческого обличения.
- source_word: עֶגְלֵךְ
  choice: твоего тельца
  rationale: Передано буквально, без поясняющего добавления «идола»; из контекста книги ясно, что речь идёт о культовом изображении тельца.
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Название оформлено как обращение, что по-русски ясно из запятых и контекста.
- source_word: חָרָה אַפִּי
  choice: Мой гнев пылает
  rationale: Выражение буквально связано с «горением» гнева. Такой перевод сохраняет образ и при этом естественен для современного русского языка.
- source_word: בָּם
  choice: против них
  rationale: 'При глагольном выражении гнева предлог передаёт направленность: гнев обращён против людей, связанных с идолопоклонством.'
- source_word: עַד מָתַי
  choice: Долго ли ещё
  rationale: Естественная русская передача риторического вопроса «до каких пор?» с оттенком продолжающегося состояния.
- source_word: לֹא יוּכְלוּ
  choice: они не смогут достичь
  rationale: Сохраняет значение неспособности, выраженное глаголом יכל, и позволяет естественно связать его с последующим отвлечённым существительным.
- source_word: נִקָּיוֹן
  choice: чистоты
  rationale: Слово может обозначать чистоту, невиновность или незапятнанность. «Чистота» сохраняет как нравственный, так и культовый оттенок и не сужает смысл до одной только юридической невиновности.
theological_decisions:
- issue: Подлежащее при начальном глаголе זָנַח
  choice: 'Подразумеваемое подлежащее — Бог: «Он отверг твоего тельца»'
  alternative: «Твой телец отверг тебя, Самария»
  rationale: Еврейский синтаксис допускает понимание «тельца» как подлежащего, однако непосредственный контекст Божьей речи и следующее «Мой гнев пылает» поддерживают понимание Бога как подразумеваемого действующего лица. Альтернативное прочтение сохранено в сноске.
- issue: Смысл נִקָּיוֹן
  choice: «чистота» с сохранением нравственного и культового диапазона
  alternative: «невиновность» или «очищение»
  rationale: Контекст обличения идолопоклонства допускает одновременно нравственный и культовый смысл; перевод не должен искусственно выбирать только один из них.
translation_notes:
  register: Современный литературный русский язык с краткой, энергичной пророческой интонацией. Сохранены обращение к Самарии, метафора пылающего гнева и неоднозначность понятия чистоты; истолковывающее слово «идол» в основной текст не добавлено.
