id: HOS.8.7
reference: Hosea 8:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֛י ר֥וּחַ יִזְרָ֖עוּ וְ/סוּפָ֣תָ/ה יִקְצֹ֑רוּ קָמָ֣ה אֵֽין ל֗/וֹ צֶ֚מַח בְּלִ֣י יַֽעֲשֶׂה קֶּ֔מַח אוּלַ֣י יַֽעֲשֶׂ֔ה זָרִ֖ים יִבְלָעֻֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/008/007.yaml
  text: For they sow the wind[a], and they will reap the whirlwind. The standing grain has no head; it will yield no flour. Even if it should yield[c][b], strangers will swallow it up.
translation:
  language: ru
  text: Ведь они сеют ветер, а пожнут бурю[a]. Хлеб на корню — без колоса[b], муки он не даст. А если и даст[c], чужеземцы её поглотят.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вихрь» или «ураган».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «У хлеба на корню нет צמח». Это слово может означать «росток», «побег» или «произрастание»; здесь, вероятно, имеется в виду колос, без которого не будет зерна для муки.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Возможно, он и даст муку, но чужеземцы её поглотят».'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит обоснование предшествующего суда; «ведь» естественно передаёт пояснительно-причинную связь в современном русском.
- source_word: רוּחַ
  choice: ветер
  rationale: В земледельческом образе уместно конкретное значение «ветер»; варианты «дух» и «дыхание» не поддерживаются контекстом.
- source_word: וְסוּפָתָה
  choice: а пожнут бурю
  rationale: 'סוּפָה обозначает сильную бурю или вихрь. «Буря» сохраняет усиление образа: посеянный ветер оборачивается разрушительной стихией.'
- source_word: יִקְצֹרוּ
  choice: пожнут
  rationale: Имперфект выражает грядущее следствие поступков; русский совершенный глагол естественно звучит в изречении о воздаянии.
- source_word: קָמָה
  choice: хлеб на корню
  rationale: קָמָה — стоящий, ещё не сжатый хлеб. Русское выражение «хлеб на корню» передаёт земледельческий смысл без архаизма «нива».
- source_word: צֶמַח
  choice: колос
  rationale: Хотя существительное шире означает «росток», «побег» или «произрастание», в контексте зерна и муки речь, вероятнее всего, идёт об отсутствии колоса, способного дать зерно.
- source_word: בְּלִי יַעֲשֶׂה קֶּמַח
  choice: муки он не даст
  rationale: 'Краткая русская формулировка сохраняет смысл бесплодного урожая: из него нельзя получить муку.'
- source_word: אוּלַי
  choice: А если и
  rationale: 'Обычно אוּלַי означает «может быть», но здесь вводит уступительное допущение: даже если мука всё же появится, Израилю она не достанется. Альтернатива сохранена в сноске.'
- source_word: זָרִים
  choice: чужеземцы
  rationale: Слово обозначает посторонних, иноземцев. «Чужеземцы» ясно показывает, что урожаем воспользуются не сами израильтяне.
- source_word: יִבְלָעֻהוּ
  choice: её поглотят
  rationale: Глагол буквально означает «проглотить» и создаёт яркий образ полного присвоения или уничтожения; местоимение «её» относится к муке.
theological_decisions:
- issue: Толкование земледельческого образа
  choice: Передать образ посева и жатвы прямо, как изречение о суде и последствиях поступков.
  alternative: Раскрыть «ветер» как суету, а «бурю» как бедствие непосредственно в тексте перевода.
  rationale: Сам стих не разъясняет соответствия образа, поэтому перевод сохраняет его напряжённость и позволяет теме воздаяния звучать без конфессионального или толковательного расширения.
- issue: Значение אוּלַי в заключительной строке
  choice: 'Передать уступительно: «А если и даст».'
  alternative: 'Передать модально: «Возможно, он и даст муку, но чужеземцы её поглотят».'
  rationale: Оба прочтения совместимы с еврейским текстом. Уступительная формулировка лучше выражает общий ход мысли о неизбежной тщетности, а подлинная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным строем пророческого изречения. Сохранены земледельская метафора, резкое усиление от ветра к буре и образ полного поглощения урожая; устранены ненужные архаизмы и не добавлены толковательные уточнения в основной текст.
