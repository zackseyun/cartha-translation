lexical_decisions:
- source_word: כִּי
  choice: Так как
  rationale: Союз вводит основание последующего утверждения и естественно передаёт причинную связь в современном русском языке.
- source_word: הִרְבָּה
  choice: умножил
  rationale: Порода хифиль от רבה выражает увеличение числа; «умножил» сохраняет глагольную силу и возвышенный пророческий регистр.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено традиционное русское написание имени; хотя у Осии оно часто обозначает северное царство, текст прямо называет Ефрема.
- source_word: מִזְבְּחֹת
  choice: жертвенники
  rationale: Обычный русский эквивалент מזבח; множественное число подчёркивает разрастание мест незаконного культа.
- source_word: לַחֲטֹא
  choice: чтобы грешить
  rationale: Инфинитив от חטא здесь наиболее естественно понимать в глагольном смысле. Конструкция цели допускает и оттенок результата, а повтор формулировки сохраняет пророческую иронию.
- source_word: הָיוּ לוֹ
  choice: они и стали для него
  rationale: «Стали» ясно передаёт результирующее состояние, «для него» сохраняет значение לוֹ, а частица «и» подчёркивает закономерный и иронический итог.
- source_word: מִזְבְּחוֹת לַחֲטֹא
  choice: жертвенниками, чтобы грешить
  rationale: 'Повтор сохранён вслед за еврейским текстом: умноженные Ефремом жертвенники обернулись для него средствами и поводами к греху.'
theological_decisions:
- issue: Значение לַחֲטֹא в обоих случаях
  choice: 'глагольный смысл: «чтобы грешить»'
  alternative: 'культовый смысл: «для жертв за грех»'
  rationale: Хотя корень חטא в культовом контексте может относиться к жертве за грех, ближайший контекст Осии осуждает множество жертвенников как источник преступления. Основной текст сохраняет глагольное прочтение, а реальная лексическая альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Сохранены повтор «жертвенники… жертвенниками» и обе одинаковые конструкции לַחֲטֹא; синтаксис сделан естественным для русского читателя без устранения смысловой неоднозначности.
