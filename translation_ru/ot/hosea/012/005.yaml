base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/005.yaml
  text: He strove with the angel and prevailed[a]; he wept and sought his favor. At Bethel he found him[b], and there he spoke with us—
translation:
  language: ru
  text: Он боролся с ангелом и взял верх; плакал и молил его о милости[a]. В Вефиле он нашёл его[b], и там Он говорил с нами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «умолял его»; «искал его благосклонности».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст: «с нами». Некоторые понимают: «с ним», сглаживая переход от третьего лица к первому. Основной текст сохраняет масоретское чтение.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשַׂר
  choice: боролся
  rationale: Глагол שׂרה в контексте рассказа об Иакове означает борьбу или противоборство; перевод сохраняет отсылку к Быт. 32.
- source_word: מַלְאָךְ
  choice: с ангелом
  rationale: В данном контексте имеется в виду сверхъестественный участник борьбы Иакова; «ангел» естественно передаёт значение и контекстуальную определённость.
- source_word: וַיֻּכָל
  choice: одолел
  rationale: Глагол יכל здесь употреблён в значении «оказаться сильнее, превозмочь» и образует смысловую пару с «боролся».
- source_word: בָּכָה
  choice: плакал
  rationale: Прямой и естественный перевод, сохраняющий эмоциональную напряжённость текста.
- source_word: וַיִּתְחַנֶּן לוֹ
  choice: умолял его о милости
  rationale: Форма от חנן выражает настойчивую просьбу о благосклонности или милости; дополнение לוֹ передано местоимением «его».
- source_word: בֵּית אֵל
  choice: В Вефиле
  rationale: Использована устоявшаяся русская форма библейского топонима Бет-Эль — «Вефиль».
- source_word: יִמְצָאֶנּוּ
  choice: он найдёт нас
  rationale: Масоретская огласовка и суффикс первого лица множественного числа дают буквальное значение «он найдёт нас». Будущее время естественно передаёт форму yiqtol и не устраняет необычный переход от рассказа об Иакове к «нам».
- source_word: וְשָׁם יְדַבֵּר עִמָּנוּ
  choice: и там будет говорить с нами
  rationale: Сохранены форма yiqtol и масоретское местоимение первого лица множественного числа, связывающее прежнюю встречу Иакова с адресатами пророка.
theological_decisions:
- issue: Переход к первому лицу множественного числа в заключительной части
  choice: сохранить «нас» и «с нами»
  alternative: 'сгладить переход: «его» и «с ним»'
  rationale: Масоретский текст дважды использует формы первого лица множественного числа. Их сохранение не устраняет напряжённую связь между Иаковом и общиной Израиля.
- issue: Субъект фразы «он найдёт нас»
  choice: оставить местоимение со строчной буквы без поясняющей подстановки имени
  alternative: уточнить субъект как Бога или Иакова
  rationale: Еврейский текст явно не называет субъекта; перевод сохраняет эту неоднозначность и не вводит богословского уточнения, отсутствующего в источнике.
- issue: Временное значение двух форм yiqtol
  choice: 'передать будущим временем: «найдёт», «будет говорить»'
  alternative: передать повествовательным прошедшим или настоящим временем
  rationale: Будущее время формально отражает формы еврейского текста и сохраняет открытость пророческой перспективы, не превращая их безусловно в прошедшее повествование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «он» в первой фразе помогает ясно разделить две пары действий. Необычные местоименные переходы и неопределённость субъекта в последней части намеренно сохранены.
