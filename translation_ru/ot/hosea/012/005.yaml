- from: Он боролся с ангелом и одолел; он плакал и умолял его о милости[a]. В Вефиле он найдёт нас[b], и там будет говорить с нами —
  to: Он боролся с ангелом и взял верх; плакал и молил его о милости[a]. В Вефиле он нашёл его[b], и там Он говорил с нами.
  rationale: Исправлен объект при יִמְצָאֶנּוּ («его», не «нас») и соответственно переработана сноска. Заключительное «с нами» сохранено согласно масоретскому тексту, без гармонизации с предыдущим третьим лицом. Прошедшее время в двух последних глаголах отражает ретроспективное описание встречи в Вефиле; «Он» в последней клаузе делает понятным смену подразумеваемого субъекта, не добавляя нового содержания.
