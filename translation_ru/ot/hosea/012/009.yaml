base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/009.yaml
  text: And Ephraim said[a], “Surely I have become rich; I have found wealth for myself[c][b]. In all my labor they will not find in me iniquity that is sin.”
translation:
  language: ru
  text: 'И сказал Ефрем: «Да, я разбогател, нажил себе состояние.[a] Во всех моих трудах не найдут у меня беззакония, которое было бы грехом».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обрёл себе силу (или имущество)». Еврейское слово может означать силу, богатство или достояние; здесь, вероятнее всего, речь идёт о материальном состоянии.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Во всей моей прибыли не найдут за мной вины, которая считалась бы грехом». Еврейская фраза сжата и допускает несколько вариантов синтаксического понимания.'
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: Да
  rationale: Передаёт уверенное, подчёркнутое самоутверждение Ефрема, не вводя ограничительного значения «только».
- source_word: עָשַׁרְתִּי
  choice: я разбогател
  rationale: 'Совершенный вид естественно передаёт достигнутый результат: Ефрем приобрёл богатство.'
- source_word: אוֹן
  choice: состояние
  rationale: В торговом контексте слово вероятнее обозначает материальное достояние, хотя может также означать силу или имущество; альтернатива отмечена в сноске.
- source_word: כָּל יְגִיעַי
  choice: во всех моих трудах
  rationale: Сохраняет возможную связь слова как с усилиями, так и с плодами труда, не сводя значение исключительно к прибыли.
- source_word: יִמְצְאוּ לִי
  choice: не найдут у меня
  rationale: Естественно передаёт утверждение, что проверяющие не обнаружат за Ефремом вины; неопределённое множественное число оригинала сохранено.
- source_word: עָוֺן
  choice: беззакония
  rationale: Сохраняет нравственную и виновную окраску слова, а также напряжение с последующим חֵטְא.
- source_word: אֲשֶׁר חֵטְא
  choice: которое было бы грехом
  rationale: Передаёт сжатую и не вполне прозрачную квалифицирующую конструкцию, не устраняя самодовольную казуистику речи Ефрема.
theological_decisions:
- issue: Самооправдание Ефрема и пророческая ирония
  choice: Высказывание передано непосредственно как уверенное заявление Ефрема, без явного авторского опровержения внутри стиха.
  alternative: Добавить в основной текст указание, что Ефрем обманывает себя или говорит иронически.
  rationale: Еврейский текст не поясняет иронию прямо; нравственная оценка раскрывается контекстом, поэтому перевод не должен заранее разрешать это напряжение.
- issue: Соотношение «беззакония» и «греха»
  choice: Сохранена формулировка «беззакония, которое было бы грехом».
  alternative: «вины, достаточной для обвинения» или «преступления, которое сочли бы грехом».
  rationale: Оригинал сжат и допускает разные синтаксические толкования. Выбранный вариант сохраняет различение терминов и оттенок самооправдания, не превращая его в явно юридическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Разбогател» и «нажил себе состояние» звучат естественно и передают торгово-материальный контекст; более формальное «беззаконие» сохраняет нравственную весомость оригинала. Все смысловые неоднозначности вынесены в краткие сноски.
