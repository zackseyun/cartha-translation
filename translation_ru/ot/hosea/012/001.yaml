base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/001.yaml
  text: Ephraim has surrounded me with lies[a], and the house of Israel with deceit[b]; but Judah still roams with God and is faithful with the Holy One.
translation:
  language: ru
  text: Меня окружили ложью Ефрем, а обманом — дом Израиля; Иуда же всё ещё странствует с Богом и верен Святому.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст этой части стиха труден. Возможно и иное прочтение: «Иуда всё ещё неукротим против Бога, против Святого, Который верен». Особенно неясны значение глагола, переведённого как «странствует», и синтаксическая связь слова «верен».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «со святыми». Это выражение можно понимать как относящееся либо к Богу — «со Святым», либо к небесным существам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבָבֻנִי
  choice: окружил Меня
  rationale: Форма глагола סבב с местоименным суффиксом буквально передаёт окружение говорящего; единственное число согласовано с собирательным именем «Ефрем».
- source_word: בְכַחַשׁ
  choice: ложью
  rationale: כחש обозначает ложь или неправду; творительный падеж естественно передаёт еврейскую конструкцию с בְּ.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено собственное имя, которое у Осии часто метонимически обозначает Северное царство.
- source_word: וּבְמִרְמָה
  choice: обманом
  rationale: מרמה означает обман, коварство; «обманом» сохраняет отличие от предшествующей «лжи» и звучит естественно по-русски.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Формально сохранено пророческое выражение, а эллиптический глагол понятен из первой части строки.
- source_word: וִיהוּדָה
  choice: Иуда же
  rationale: Частица «же» передаёт вероятный контраст, не делая его чрезмерно резким.
- source_word: עֹד
  choice: всё ещё
  rationale: Передаёт продолжающееся состояние или действие.
- source_word: רָד עִם אֵל
  choice: странствует с Богом
  rationale: Глагольная форма трудна и допускает разные толкования. «Странствует» сохраняет динамический, не вполне определённый оттенок, не подменяя его более обычным «ходит».
- source_word: אֵל
  choice: Богом
  rationale: אֵל здесь естественно понимается как обозначение Бога, а не как транслитерированное имя «Эль».
- source_word: וְעִם קְדוֹשִׁים
  choice: Святому
  rationale: Хотя форма קְדוֹשִׁים морфологически множественная, контекст допускает отнесение к Богу как к Святому; буквальный вариант сохранён в сноске.
- source_word: נֶאֱמָן
  choice: верен
  rationale: Форма выражает надёжность или верность; при основном синтаксическом понимании относится к Иуде.
theological_decisions:
- issue: Смысл трудной заключительной части стиха об Иуде
  choice: 'Положительное противопоставление: Иуда всё ещё странствует с Богом и верен Святому.'
  alternative: 'Отрицательное прочтение: Иуда всё ещё неукротим против Бога, против верного Святого.'
  rationale: Синтаксис и значение רָד спорны. Основной текст следует возможному положительному противопоставлению Ефрему и дому Израиля, но не скрывает отрицательное прочтение.
- issue: Единственное или множественное число קְדוֹשִׁים
  choice: Святому — обозначение Бога в единственном числе.
  alternative: святыми — буквальное морфологическое множественное число, возможно небесные существа.
  rationale: Контекст с אֵל допускает понимание формы как возвышенного обозначения Бога, однако грамматическая множественность остаётся значимой и указана в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением пророческой образности и формулы «дом Израиля». Заглавные буквы в «Меня» и «Святому» отражают основное понимание говорящего и референта как Бога. Обе сноски поставлены после спорной заключительной части, к которой они относятся.
