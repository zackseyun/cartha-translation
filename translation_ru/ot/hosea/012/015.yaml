base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/015.yaml
  text: Ephraim has provoked bitter anger[a]; his bloodguilt will be left on him[b], and his Lord will repay him for his disgrace.
translation:
  language: ru
  text: Ефрем вызвал горький гнев; его Владыка[b] оставит на нём вину за пролитую кровь[a] и воздаст ему за его бесчестье.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его кровь» или «его крови». В судебном контексте это выражение может означать кровопролитие либо вину за него.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «его господин». Заключительную часть можно также передать: «вернёт ему его поношение».'
    reason: alternative_reading
lexical_decisions:
- source_word: הִכְעִיס
  choice: вызвал гнев
  rationale: Порода hифиль глагола כעס означает «гневить, вызывать гнев». Безличная по объекту формулировка не добавляет к еврейскому тексту прямо не названное дополнение.
- source_word: תַּמְרוּרִים
  choice: горький
  rationale: Множественное число от корня מרר передаёт крайнюю горечь и здесь усиливает смысл вызванного гнева. По-русски естественно передать это сочетанием «горький гнев».
- source_word: וְדָמָיו
  choice: вина за пролитую кровь
  rationale: Буквально «его кровь/крови»; в пророческом и судебном контексте דמים часто обозначает ответственность за кровопролитие. Развёрнутая русская формулировка яснее слова «кровавость» и сохраняет юридический смысл.
- source_word: עָלָיו יִטּוֹשׁ
  choice: останется на нём
  rationale: נטש здесь выражает оставление вины лежать на виновном, то есть её неснятие. Такая формулировка естественна по-русски и не требует вводить неявное подлежащее.
- source_word: וְחֶרְפָּתוֹ
  choice: его бесчестье
  rationale: חרפה охватывает значения поношения, позора и бесчестья. «Бесчестье» сохраняет как постыдный, так и предосудительный оттенок.
- source_word: יָשִׁיב לוֹ
  choice: воздаст ему за
  rationale: Каузативная форма שוב с ל в контексте суда означает возвратить содеянное человеку, то есть воздать ему. Русское «воздаст» естественно передаёт смысл ответного возмездия.
- source_word: אֲדֹנָיו
  choice: его Владыка
  rationale: Форма служит титулом и в данном контексте, вероятнее всего, относится к Богу. «Владыка» сохраняет титульный смысл, не подменяя слово отсутствующим в тексте именем Яхве.
theological_decisions:
- issue: К кому относится אֲדֹנָיו
  choice: Божественный титул, переданный как «его Владыка»
  alternative: «его господин» или «его хозяин»
  rationale: В пророческом контексте суд над Ефремом совершает Бог, однако употреблено не имя Яхве, а титул. Перевод сохраняет и вероятный божественный референт, и лексическое различие.
- issue: Кто оставляет вину на Ефреме
  choice: 'В основном тексте субъект не назван явно: «вина… останется»'
  alternative: «его Владыка оставит на нём вину»
  rationale: Еврейский глагол стоит в активной форме, а отложенным подлежащим может быть «его Владыка» в конце стиха. Безличная русская конструкция сохраняет смысл и не устраняет синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Сохранены краткость судебного приговора, параллелизм двух последствий и титул Бога без подстановки имени Яхве.
