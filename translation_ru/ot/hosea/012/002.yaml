source:
  edition: WLC
  text: אֶפְרַ֜יִם רֹעֶ֥ה ר֨וּחַ֙ וְ/רֹדֵ֣ף קָדִ֔ים כָּל הַ/יּ֕וֹם כָּזָ֥ב וָ/שֹׁ֖ד יַרְבֶּ֑ה וּ/בְרִית֙ עִם אַשּׁ֣וּר יִכְרֹ֔תוּ וְ/שֶׁ֖מֶן לְ/מִצְרַ֥יִם יוּבָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/002.yaml
  text: Ephraim feeds on wind and pursues the east wind all day long[a]; he multiplies lies and destruction. They make a covenant with Assyria[e][d][c][b], and oil is carried to Egypt.
translation:
  language: ru
  text: Ефрем питается ветром[a] и весь день гонится за восточным ветром[b]; он умножает ложь и разорение[c]. Они заключают союз с Ассирией[d], и масло везут в Египет[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пасёт ветер»; еврейский глагол буквально связан с выпасом и кормлением.'
    reason: lexical_alternative
  - marker: b
    text: Восточный ветер был знойным и губительным; этот образ может указывать одновременно на тщетность и на разрушительные последствия.
    reason: cultural_note
  - marker: c
    text: 'Или: «обман и опустошение», «ложь и насилие».'
    reason: lexical_alternative
  - marker: d
    text: Еврейское выражение буквально означает «режут завет»; это обычная идиома со значением «заключают союз или договор».
    reason: lexical_alternative
  - marker: e
    text: Вероятно, масло отправляли в Египет как дань или дипломатический дар.
    reason: cultural_note
lexical_decisions:
- source_word: רֹעֶה רוּחַ
  choice: пасётся ветром
  rationale: Глагол רעה может означать «пасти» и «питаться, пастись». Возвратное «пасётся ветром» сохраняет пастушеский образ и выражает тщетную попытку насытиться тем, что не питает.
- source_word: וְרֹדֵף קָדִים
  choice: и гонится за восточным ветром
  rationale: רדף означает «преследовать, гнаться», а קדים — жаркий и губительный восточный ветер. Конкретный образ сохранён без истолковывающей подмены.
- source_word: כָּל הַיּוֹם
  choice: весь день
  rationale: Естественная русская передача непрерывности действия.
- source_word: כָּזָב וָשֹׁד
  choice: ложь и разорение
  rationale: כזב обозначает ложь или обман; שד допускает значения разорения, опустошения, насилия и грабежа. «Разорение» естественно сочетается с политическим обвинением и сохраняет разрушительный оттенок.
- source_word: יַרְבֶּה
  choice: он умножает
  rationale: Форма единственного числа соотносится с собирательным субъектом «Ефрем»; каузативный оттенок передан глаголом «умножает».
- source_word: וּבְרִית עִם אַשּׁוּר יִכְרֹתוּ
  choice: Они заключают союз с Ассирией
  rationale: כרת ברית — устойчивое выражение о заключении завета или договора. В политическом контексте «союз» звучит естественно; множественное число сохраняет переход от собирательного единственного к множественному в еврейском тексте.
- source_word: וְשֶׁמֶן לְמִצְרַיִם יוּבָל
  choice: и масло везут в Египет
  rationale: שמן — масло, вероятнее всего оливковое, однако уточнение не внесено в основной текст. Русская неопределённо-личная конструкция естественно передаёт еврейский пассив יוּבָל.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено собственное имя, хотя у Осии оно часто обозначает всё Северное царство.
theological_decisions:
- issue: Метафорическое осуждение внешней политики
  choice: Сохранить образы ветра и восточного ветра
  alternative: 'Передать смысл прямо: «Ефрем стремится к пустоте и гибели»'
  rationale: Метафора одновременно выражает тщетность и губительность действий Ефрема; её истолкование не должно вытеснять сам пророческий образ.
- issue: Переход от единственного числа к множественному
  choice: «он умножает» и затем «они заключают»
  alternative: Выровнять весь стих по единственному или множественному числу
  rationale: 'Так сохраняется реальный грамматический переход текста: Ефрем представлен как единое целое, а затем речь идёт о его народе или правителях.'
- issue: Значение ברית в политическом контексте
  choice: «союз»
  alternative: «завет» или «договор»
  rationale: Здесь речь идёт о соглашении с Ассирией; «союз» ясно передаёт политический характер, не отрицая более широкого смыслового диапазона ברית.
translation_notes:
  register: Современный литературный русский язык с сохранением резкой пророческой образности. «Пасётся ветром» намеренно необычно, но понятно и ближе к многозначности רעה, чем сглаживающее истолкование. Все примечания отмечены в основном тексте по порядку.
