  text: וַֽ/יהוָ֖ה אֱלֹהֵ֣י הַ/צְּבָא֑וֹת יְהוָ֖ה זִכְרֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/006.yaml
  text: And Yahweh[b][a], the God of hosts—Yahweh is his memorial name.
translation:
  language: ru
  text: И Яхве, Бог воинств, — Яхве, имя, которым его помнят[b].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское имя יהוה (YHWH) традиционно передают словом «Господь»; здесь оно передано как «Яхве».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «Яхве — его памятование»; то есть имя, которым его помнят или призывают.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: И Яхве
  rationale: Союз ו передан нейтральным «и», продолжающим предыдущую мысль; тетраграмматон передан как личное имя «Яхве».
- source_word: אֱלֹהֵי הַצְּבָאוֹת
  choice: Бог воинств
  rationale: Сохраняется широкий смысл צְבָאוֹת — организованных сил или воинств, не сводимый только к земным армиям; формулировка остаётся понятной без заимствованного «Саваоф».
- source_word: יְהוָה
  choice: Яхве
  rationale: Повтор личного имени сохранён, поскольку он составляет смысловой центр второй части стиха.
- source_word: זִכְרוֹ
  choice: имя, под которым Его помнят
  rationale: Буквально слово означает «Его память/памятование»; в контексте имени оно указывает на имя, посредством которого Бога помнят и называют. Добавление слова «имя» делает еврейскую идиому естественной по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон как личное имя. Транслитерация «Яхве» сохраняет различие между именем Бога и титулом «Господь».
- issue: Смысл זִכְרוֹ
  choice: имя, под которым Его помнят
  alternative: Его памятование; Его памятное имя
  rationale: Фраза связывает יְהוָה с тем, посредством чего Бога помнят или призывают. Перевод не превращает эту связь в отвлечённую «память» и при этом не скрывает образность оригинала, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Повтор имени «Яхве» сохранён ради риторического ударения оригинала; архаичное «Саваоф» не использовано.
