  text: Иаков бежал в страну Арама[a]; Израиль служил за жену и за жену нёс стражу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в поле Арама»; выражение может означать страну или область Арама.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «стерёг» или «охранял». В контексте истории Иакова глагол может подразумевать присмотр за стадами, однако объект в еврейском тексте не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: бежал
  rationale: Глагол ברח означает бегство. «Бежал» естественно и кратко передаёт действие, не уточняя мотив сверх сказанного в тексте.
- source_word: שְׂדֵה אֲרָם
  choice: в землю Арама
  rationale: Буквально выражение означает «поле Арама», но в данном употреблении указывает на область или страну. «Земля Арама» сохраняет географический образ и звучит естественно по-русски; буквальная форма отмечена в сноске.
- source_word: וַיַּעֲבֹד
  choice: служил
  rationale: עבד может означать «служить» или «работать». «Служил» соответствует повествованию о службе Иакова у Лавана и сохраняет широкий смысл исходного глагола.
- source_word: בְּאִשָּׁה / וּבְאִשָּׁה
  choice: за жену / и за жену
  rationale: 'Предлог ב здесь выражает цель или вознаграждение: Иаков служил, чтобы получить жену. Повтор оборота сохранён ради параллелизма и риторической структуры еврейского текста.'
- source_word: שָׁמָר
  choice: стерёг стада
  rationale: שׁמר означает «хранить, стеречь, охранять». В контексте истории Иакова подразумевается присмотр за стадами; добавленное по смыслу слово «стада» делает эллиптическое выражение понятным на современном русском, а сноска отмечает его подразумеваемый характер.
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: Иаков / Израиль
  rationale: 'Чередование двух имён намеренно сохранено: оно связывает патриарха Иакова с народом Израиля и не сглаживает смысловую напряжённость оригинала.'
theological_decisions:
- issue: Чередование имён Иаков и Израиль
  choice: Сохранить оба имени в той же последовательности, что и в еврейском тексте
  alternative: Употребить в обеих частях только одно имя ради стилистической плавности
  rationale: Оригинал намеренно называет одного и того же патриарха двумя именами, одновременно вызывая в памяти его личную историю и историю произошедшего от него народа.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Сохранены краткость, параллелизм, повтор «за жену» и смена имён Иаков/Израиль; неестественная для русского эллиптическая конструкция со שָׁמָר прояснена минимальным контекстуальным дополнением.
