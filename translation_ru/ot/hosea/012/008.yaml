  text: A merchant—with deceptive scales in his hand—loves to oppress[a].
translation:
  language: ru
  text: Торговец, в руке у которого обманные весы, любит притеснять.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Ханаан». Это слово может также пониматься как «ханаанец» или «торговец»; торговое значение соответствует контексту обманных весов.'
    reason: alternative_reading
lexical_decisions:
- source_word: כְּנַעַן
  choice: Торговец
  rationale: Форма буквально совпадает с названием «Ханаан», но в данном контексте, где сразу упомянуты неверные весы, наиболее естественно нарицательное значение «торговец». Возможная отсылка к Ханаану сохранена в сноске.
- source_word: בְּיָדוֹ
  choice: в руке у него
  rationale: Прямо передаёт конкретный образ человека, держащего весы; такой порядок слов естественен в современном русском и сохраняет выделенность оборота.
- source_word: מֹאזְנֵי מִרְמָה
  choice: обманные весы
  rationale: Сочетание означает весы, служащие обману. «Обманные весы» — краткая, ясная и стилистически достойная передача конструкции с существительным «обман».
- source_word: לַעֲשֹׁק
  choice: притеснять
  rationale: Глагол охватывает притеснение, эксплуатацию и присвоение чужого посредством насилия или обмана. Коммерческий контекст допускает «обманывать» или «обира́ть», но «притеснять» сохраняет более широкий нравственный смысл.
- source_word: אָהֵב
  choice: любит
  rationale: Сохраняет сильную характеристику устойчивого пристрастия к неправде, не ослабляя её до простого привычного действия.
theological_decisions:
- issue: Следует ли понимать כְּנַעַן как имя «Ханаан/хананей» или как нарицательное «торговец»
  choice: Нарицательное значение «торговец» в основном тексте
  alternative: «Ханаан» или «хананей» с возможной риторической характеристикой Ефрема/Израиля
  rationale: Образ весов непосредственно поддерживает торговое значение. Вместе с тем еврейская форма сохраняет отзвук имени Ханаан, поэтому эта значимая неоднозначность указана в сноске, а не устранена.
translation_notes:
  register: Современный литературный русский язык; фраза лаконична и сохраняет резкую пророческую характеристику. Вставной оборот передан с помощью тире, чтобы удержать акцент на весах в руке торговца.
