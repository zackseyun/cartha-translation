  text: In the womb he grasped his brother’s heel[b][a], and in his strength he contended with God.
translation:
  language: ru
  text: В утробе он ухватил своего брата за пяту[a], а силой своей боролся с Богом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взял брата за пяту». Еврейский глагол напоминает рассказ о рождении Иакова и может также передавать переносный смысл: «вытеснил» или «обошёл».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «боролся с божественным существом». В следующем стихе этот участник борьбы назван ангелом; текст Осии сохраняет напряжение между двумя обозначениями.'
    reason: alternative_reading
lexical_decisions:
- source_word: בַּבֶּטֶן
  choice: Ещё в утробе
  rationale: בטן обозначает живот или материнскую утробу. В контексте рождения Иакова естественно «в утробе»; «ещё» по-русски ясно передаёт временной смысл, не добавляя нового события.
- source_word: עָקַב אֶת־אָחִיו
  choice: ухватил брата за пяту
  rationale: Глагол связан с образом пятки и отсылает к рассказу о рождении Иакова в Быт. 25:26. Конкретный образ сохранён, тогда как «вытеснил» или «перехитрил» слишком рано вводило бы переносный смысл.
- source_word: וּבְאוֹנוֹ
  choice: а в своей силе
  rationale: אוֹן может означать силу, мощь или жизненную крепость. Формулировка сохраняет значение и конструкцию с предлогом, не уточняя без достаточных оснований возраст или мужественность.
- source_word: שָׂרָה
  choice: боролся
  rationale: Глагол обозначает борьбу или противоборство и созвучен повествованию об Иакове и имени Израиль. «Боролся» естественно по-русски и, в отличие от «одолел», не приписывает этой форме явно не выраженный исход.
- source_word: אֶת־אֱלֹהִים
  choice: с Богом
  rationale: При глаголе борьбы конструкция естественно передаётся по-русски как «боролся с Богом». Основной текст сохраняет אֱלֹהִים как «Бог», а возможное понимание как сверхъестественного существа отмечено в сноске.
theological_decisions:
- issue: Кого обозначает אֱלֹהִים в борьбе Иакова
  choice: Бог
  alternative: божественное существо; ангел в свете следующего стиха
  rationale: В данном стихе прямо употреблено אֱלֹהִים, тогда как далее участник борьбы назван ангелом. Основной текст сохраняет слово «Бог», не устраняя намеренное напряжение между божественным и ангельским описанием; альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конкретный образ хвата за пяту сохранён, синтаксис сделан естественным для русского, а неоднозначность обозначения участника борьбы не сглажена.
