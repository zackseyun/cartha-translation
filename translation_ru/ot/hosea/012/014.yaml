base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/014.yaml
  text: By a prophet Yahweh brought Israel up from Egypt[b][a], and by a prophet he was guarded.
translation:
  language: ru
  text: Через пророка Яхве вывел Израиль из Египта, и через пророка он был сохранён.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Под пророком здесь, вероятно, подразумевается Моисей.
    reason: cross_reference
  - marker: b
    text: 'Или: «он был охраняем»; также возможно: «он был храним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנָבִיא
  choice: через пророка
  rationale: Предлог בְּ обозначает посредничество или орудие действия. «Через пророка» естественно по-русски и сохраняет повтор и параллелизм двух частей стиха.
- source_word: הֶעֱלָה
  choice: вывел
  rationale: Каузативная форма עלה буквально означает «поднял, вывел». В сочетании с исходом из Египта русское «вывел из Египта» естественно передаёт устойчивый исходный образ без неуместного пространственного «поднял».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Обычная и контекстуально точная передача исходного географического оборота.
- source_word: נִשְׁמָר
  choice: был сохранён
  rationale: Нифаль от שׁמר допускает значения «быть хранимым, охраняемым, сохранённым». «Был сохранён» передаёт пассивную форму и не сужает смысл исключительно до физической охраны.
theological_decisions:
- issue: Неявное отождествление пророка
  choice: Оставить «пророка» без имени в основном тексте
  alternative: Назвать Моисея или перевести «через этого пророка»
  rationale: В еврейском тексте пророк не назван и определённый артикль отсутствует. Контекст позволяет подразумевать Моисея, но основной текст не должен делать это отождествление явным.
- issue: Подлежащее נִשְׁמָר
  choice: Сохранить местоимение «он», относящееся к Израилю
  alternative: Повторить «Израиль»
  rationale: Еврейский текст оставляет подлежащее второй части невыраженным; ближайший референт — Израиль. Местоимение сохраняет лаконизм и возможную коллективную персонификацию.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Повтор «через пророка» сохранён как важный риторический параллелизм. Маркеры сносок размещены после всего предложения, к которому относятся оба пояснения.
