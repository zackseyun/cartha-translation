base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/011.yaml
  text: I spoke through the prophets[a]; I myself multiplied visions[c][b], and through the hand of the prophets I gave parables.
translation:
  language: ru
  text: Я говорил через пророков[a], я сам умножал видения и через пророков[b] говорил в образах[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я говорил пророкам». Еврейский предлог здесь допускает разные толкования, хотя параллельная строка благоприятствует смыслу речи через пророков.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «рукой пророков» — еврейский оборот, обозначающий действие через чьё-либо посредство.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «прибегал к сравнениям», «говорил притчами». Еврейский глагол труден для истолкования и, вероятно, обозначает образную речь посредством уподоблений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתִּי עַל הַנְּבִיאִים
  choice: Я говорил через пророков
  rationale: 'Предлог עַל допускает несколько толкований: обращение к пророкам, речь о них или, по контексту, речь посредством них. Основной текст выбирает посреднический смысл, поддерживаемый параллельным выражением וּבְיַד הַנְּבִיאִים, а неоднозначность отмечена в сноске.'
- source_word: וְאָנֹכִי
  choice: Я Сам
  rationale: Самостоятельное местоимение אָנֹכִי усиливает уже выраженное глагольной формой первое лицо; «Я Сам» естественно передаёт это смысловое ударение.
- source_word: חָזוֹן הִרְבֵּיתִי
  choice: умножал видения
  rationale: Каузативная форма רבה означает «делать многочисленным, умножать». Формулировка сохраняет «видения» как прямое дополнение и не сводит образ к общему сообщению.
- source_word: וּבְיַד הַנְּבִיאִים
  choice: руками пророков
  rationale: Оборот בְּיַד буквально связан с «рукой», но обозначает действие через чьё-либо посредство. Русское «руками пророков» сохраняет и образ, и значение посредничества.
- source_word: אֲדַמֶּה
  choice: говорил в образах
  rationale: Форма от דמה здесь трудна и указывает на уподобления, сравнения или образную речь. «Говорил в образах» понятно современному читателю и не сужает значение исключительно до жанра притчи.
theological_decisions:
- issue: Способ пророческого откровения
  choice: Бог говорит посредством пророков, умножает видения и через них использует образную речь.
  alternative: Первую строку можно понимать как «Я говорил пророкам», то есть как обращение Бога непосредственно к ним.
  rationale: Параллельный оборот «руками пророков» поддерживает значение посредничества, однако многозначность предлога עַל не позволяет исключить смысл непосредственного обращения; поэтому альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм и образ «руки» сохранены без архаизмов; трудные места не сглажены и вынесены в сноски.
