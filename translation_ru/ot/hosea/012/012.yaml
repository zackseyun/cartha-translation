  text: אִם גִּלְעָ֥ד אָ֨וֶן֙ אַךְ שָׁ֣וְא הָי֔וּ בַּ/גִּלְגָּ֖ל שְׁוָרִ֣ים זִבֵּ֑חוּ גַּ֤ם מִזְבְּחוֹתָ/ם֙ כְּ/גַלִּ֔ים עַ֖ל תַּלְמֵ֥י שָׂדָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/012.yaml
  text: If Gilead is iniquity[a], they have surely become nothing; in Gilgal they sacrifice bulls; indeed[c][b], their altars are like stone heaps on the furrows of the field.
translation:
  language: ru
  text: Если Галаад — беззаконие[a], то они и вправду стали ничем[b]. В Галгале они приносят в жертву быков; и жертвенники их — словно груды камней на бороздах поля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Воистину, Галаад — беззаконие»; еврейская частица может иметь не условное, а усилительное значение.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «стали тщетой», «стали ничтожеством» или «стали ложью»; еврейское выражение сжато и может подчёркивать пустоту, ничтожность либо ложность.'
    reason: lexical_alternative
  - marker: c
    text: Вероятно, многочисленные жертвенники уподоблены грудам камней, лежащим на бороздах или вдоль борозд вспаханного поля.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Сохраняет условную форму и риторическую напряжённость еврейской фразы; возможное усилительное значение отмечено в сноске.
- source_word: גִּלְעָד
  choice: Галаад
  rationale: Традиционная русская передача географического названия.
- source_word: אָוֶן
  choice: беззаконие
  rationale: Передаёт нравственное зло и в данном пророческом контексте допускает оттенок идолопоклонства, не сужая значение до него одного.
- source_word: אַךְ שָׁוְא הָיוּ
  choice: то они и вправду стали ничем
  rationale: «И вправду» передаёт усиление אַךְ, а «стали ничем» — итоговое состояние пустоты и ничтожности, выраженное שָׁוְא и היה.
- source_word: בַּגִּלְגָּל
  choice: В Галгале
  rationale: Прямая передача указания на культовое место.
- source_word: שְׁוָרִים זִבֵּחוּ
  choice: они приносят в жертву быков
  rationale: Настоящее время естественно описывает привычное культовое действие; «быков» ясно передаёт жертвенных крупных животных.
- source_word: גַּם
  choice: и
  rationale: Связывает и усиливает заключительный образ без тяжеловесного русского наречия; добавочно-усилительный оттенок сохраняется контекстом.
- source_word: מִזְבְּחוֹתָם כְּגַלִּים
  choice: жертвенники их — словно груды камней
  rationale: «Словно» сохраняет сравнение; уточнение «камней» делает сельскохозяйственный образ понятным и соответствует обычному значению גַּל как каменной груды.
- source_word: עַל תַּלְמֵי שָׂדָי
  choice: на бороздах поля
  rationale: Близкая и естественная передача местоположения груд вдоль или поверх вспаханных борозд.
theological_decisions:
- issue: Значение начального אִם גִּלְעָד אָוֶן
  choice: 'Условно-риторическое: «Если Галаад — беззаконие»'
  alternative: 'Усилительное утверждение: «Воистину, Галаад — беззаконие»'
  rationale: У אִם в пророческой поэзии возможны условная и усилительная функции. Основной текст сохраняет форму исходной фразы, а сноска фиксирует второе чтение, не устраняя неоднозначность.
- issue: Смысл שָׁוְא
  choice: «стали ничем»
  alternative: «стали тщетой / ложью / ничтожеством»
  rationale: Фраза может обозначать пустоту, ничтожность или ложность. Выбранная формулировка сохраняет резкий пророческий приговор, не сводя его только к обману.
