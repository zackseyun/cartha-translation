revisions:
- from: Но Я — Яхве, твой Бог со времени земли Египетской. Я снова поселю тебя в шатрах, как во дни назначенного праздника.[a]
  to: Но Я — Яхве, твой Бог со времени твоего пребывания в Египте. Я вновь поселю тебя в шатрах, как во дни установленного праздника.[a]
