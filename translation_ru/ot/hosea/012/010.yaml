  text: וְ/אָנֹכִ֛י יְהוָ֥ה אֱלֹהֶ֖י/ךָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם עֹ֛ד אוֹשִֽׁיבְ/ךָ֥ בָ/אֳהָלִ֖ים כִּ/ימֵ֥י מוֹעֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/010.yaml
  text: Yet I am Yahweh your God from the land of Egypt; I will again make you dwell in tents[a], as in the days of the appointed feast.
translation:
  language: ru
  text: Но Я — Яхве, твой Бог со времени твоего пребывания в Египте. Я вновь поселю тебя в шатрах, как во дни установленного праздника.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как во дни назначенного времени» или «как во дни праздника». Возможно, здесь имеется в виду праздник Шалашей, когда израильтяне жили во временных укрытиях.'
    reason: Лексическая многозначность מוֹעֵד и вероятная, но прямо не названная праздничная аллюзия.
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Но Я
  rationale: Союз передан как противительный по контексту, а явное «Я» сохраняет эмфатическое местоимение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֶיךָ
  choice: твой Бог
  rationale: Сохраняет прямое обращение к Израилю во втором лице единственного числа.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: со времени земли Египетской
  rationale: Предлог מִן допускает временное понимание; здесь естественно выражена непрерывность заветного отношения со времени исхода, при сохранении необычной исходной формулировки.
- source_word: עֹד
  choice: снова
  rationale: 'Указывает на повторение: Бог опять поселит Израиль в шатрах.'
- source_word: אוֹשִׁיבְךָ
  choice: поселю тебя
  rationale: Передаёт каузативную форму породы хифиль от ישב естественным современным русским глаголом.
- source_word: בָאֳהָלִים
  choice: в шатрах
  rationale: Обозначает буквальные шатры; слово не вводит в основной текст традиционное название праздника.
- source_word: כִּימֵי מוֹעֵד
  choice: как во дни назначенного праздника
  rationale: «Назначенный праздник» сохраняет как идею установленного времени, так и культовый смысл מוֹעֵד, не называя конкретный праздник прямо.
theological_decisions:
- issue: Является ли возвращение к жизни в шатрах обещанием, угрозой или ироническим обращением истории
  choice: Передать действие нейтрально, не уточняя его положительную или отрицательную оценку.
  alternative: Истолковать его либо как обещание обновлённого общения времён исхода, либо как угрозу изгнания и лишений.
  rationale: В еврейском тексте оценка действия прямо не выражена; нейтральная формулировка сохраняет богословское напряжение.
- issue: Связь מוֹעֵד с праздником Шалашей
  choice: Оставить в основном тексте общее выражение «назначенный праздник», а возможную конкретную аллюзию указать в сноске.
  alternative: Прямо написать «праздник Шалашей».
  rationale: Сочетание праздника с шатрами делает аллюзию вероятной, но сам еврейский текст конкретного названия не содержит.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. «Шатры» выбраны как естественное и слегка возвышенное обозначение переносных жилищ; синтаксис сохраняет эмфазу и неоднозначность оригинала.
