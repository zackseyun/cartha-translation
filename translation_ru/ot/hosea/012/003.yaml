base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/003.yaml
  text: Yahweh has a charge against Judah[a], and he will punish Jacob according to his ways[b]; according to his deeds he will repay him.
translation:
  language: ru
  text: У Яхве — тяжба с Иудой[a]; Он призовёт Иакова к ответу по его путям[b] и воздаст ему по его делам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «У Яхве судебное дело против Иуды»; еврейское слово относится к языку судебного спора.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «накажет Иакова по его путям». Еврейское выражение буквально означает «посетить против/за» и в данном контексте указывает на судебное взыскание, вплоть до наказания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רִיב
  choice: тяжба
  rationale: Существительное обозначает спор, в том числе судебное разбирательство; «тяжба» кратко и естественно сохраняет юридический образ пророческой речи.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста, не заменяя её титулом.
- source_word: עִם יְהוּדָה
  choice: с Иудой
  rationale: Предлог עִם буквально означает «с»; при слове רִיב сочетание указывает на противную сторону в тяжбе. Русское «тяжба с Иудой» естественно выражает этот смысл.
- source_word: לִפְקֹד עַל
  choice: призовёт к ответу
  rationale: В контексте суда פקד על означает подвергнуть взысканию или потребовать отчёта. Этот вариант сохраняет судебный оттенок, не сводя выражение исключительно к наказанию.
- source_word: יַעֲקֹב
  choice: Иакова
  rationale: Сохранено указанное в еврейском тексте имя, допускающее как отсылку к патриарху, так и собирательное обозначение его потомков.
- source_word: כִּדְרָכָיו
  choice: за его пути
  rationale: «Пути» сохраняют еврейскую метафору образа жизни и поведения; предлог «за» естественно связывает их с привлечением к ответу.
- source_word: כְּמַעֲלָלָיו
  choice: по его делам
  rationale: «Дела» передают поступки с присущей контексту нравственной оценкой.
- source_word: יָשִׁיב לוֹ
  choice: воздаст ему
  rationale: В данной судебной рамке каузативная форма שוב с ל выражает ответное воздаяние, соответствующее поступкам человека.
theological_decisions:
- issue: Соотношение Иуды и Иакова в пророческом суде
  choice: 'Сохранить оба имени: Иуда выступает стороной тяжбы Яхве, а Иаков — тем, кого Он призовёт к ответу и кому воздаст.'
  alternative: Понимать «Иакова» как явный синоним всего народа, включая Иуду и Израиль, и сделать это толкование эксплицитным.
  rationale: Еврейский текст употребляет оба наименования, не разъясняя их точного соотношения; перевод сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Юридическая образность сохранена словами «тяжба» и «призовёт к ответу»; параллелизм второй половины стиха передан естественно, без устранения различия между Иудой и Иаковом.
