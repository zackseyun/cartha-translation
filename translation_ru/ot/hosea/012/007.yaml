  text: וְ/אַתָּ֖ה בֵּ/אלֹהֶ֣י/ךָ תָשׁ֑וּב חֶ֤סֶד וּ/מִשְׁפָּט֙ שְׁמֹ֔ר וְ/קַוֵּ֥ה אֶל אֱלֹהֶ֖י/ךָ תָּמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/012/007.yaml
  text: So you[a], by your God, return; keep steadfast love and justice[b], and wait continually for your God.
translation:
  language: ru
  text: А ты — с Богом твоим — возвратись[a]; храни милость[b] и справедливость и постоянно уповай на своего Бога[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к Богу твоему возвратись» или «возвратись с помощью своего Бога». Буквально в еврейском тексте стоит необычная конструкция «с/посредством Бога твоего возвратись»; предлог может указывать на средство, связь или, по смыслу, направление.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «верную любовь» или «преданность завету».
    reason: lexical_alternative
  - marker: c
    text: 'Или: «постоянно ожидай своего Бога с надеждой». Еврейский глагол сочетает ожидание с надеждой и упованием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאלֹהֶיךָ
  choice: с помощью своего Бога
  rationale: Предлог בְּ допускает значение средства, связи или сферы. Такой перевод передаёт опору на Бога, но необычность еврейской конструкции и другие возможные понимания отмечены в сноске.
- source_word: תָשׁוּב
  choice: возвратись
  rationale: Глагол שׁוּב означает «возвращаться, поворачивать обратно». «Возвратись» сохраняет как прямой, так и заветно-нравственный смысл, не сужая его до истолковательного «покайся».
- source_word: חֶסֶד
  choice: верность
  rationale: В обращённом к человеку нравственном призыве חֶסֶד обозначает стойкую преданность, верную любовь и милость. «Верность» естественно сочетается со «справедливостью», а более широкий смысл пояснён в сноске.
- source_word: מִשְׁפָּט
  choice: справедливость
  rationale: В данном этическом контексте слово обозначает соблюдение правды и справедливого порядка, а не отдельный акт суда.
- source_word: שְׁמֹר
  choice: храни
  rationale: Императив передаёт требование беречь и неизменно соблюдать названные нравственные качества; «храни» сохраняет образность оригинала и звучит естественно в возвышенном наставлении.
- source_word: וְקַוֵּה
  choice: и надейся
  rationale: קוה выражает ожидание, соединённое с надеждой. В русском сочетание «надеяться на Бога» естественнее, чем буквальное «ждать к Богу», и не создаёт ошибочного впечатления, будто речь лишь об ожидании Его прихода.
- source_word: אֶל אֱלֹהֶיךָ
  choice: на своего Бога
  rationale: При русском глаголе «надеяться» личный объект обычно вводится предлогом «на»; это естественно передаёт направленность надежды к Богу, выраженную еврейским אֶל.
- source_word: תָּמִיד
  choice: всегда
  rationale: Слово обозначает постоянство и непрерывность; «всегда» ясно и естественно передаёт этот смысл.
theological_decisions:
- issue: Следует ли передавать призыв термином «покайся»
  choice: возвратись
  alternative: покайся; обратись
  rationale: Контекст допускает призыв к покаянию и восстановлению отношений завета, однако שׁוּב шире специального богословского термина. «Возвратись» сохраняет эту смысловую напряжённость.
- issue: Как понять בֵּאלֹהֶיךָ при глаголе «возвратись»
  choice: с помощью своего Бога
  alternative: к своему Богу; со своим Богом
  rationale: Форма с בְּ необычна и может обозначать средство, связь или сферу. Основной текст отражает значение средства, не превращая его в догматическое утверждение; реальные альтернативы сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повелительные формы переданы прямо; необычная первая конструкция сделана понятной в основном тексте, а её подлинная многозначность сохранена в сноске. Маркер примечания об ожидании поставлен при соответствующем глаголе, а не при слове «справедливость».
