base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/006.yaml
  text: Then she conceived again and gave birth to a daughter[a]. And he said to him, “Call her name Lo-ruhamah, for I will no longer again show compassion to the house of Israel[b], that I should surely forgive them.”
translation:
  language: ru
  text: 'И снова она забеременела и родила дочь. И Он сказал ему: «Назови её Ло-Рухама[a], потому что Я больше не буду миловать дом Израиля и уж точно не прощу их[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Ло-Рухама» означает «непомилованная» или «та, к которой не проявили сострадания».
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза на еврейском трудна. Возможен перевод: «ибо Я непременно унесу их».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: И снова она забеременела
  rationale: Передаёт повествовательную последовательность и значение עוֹד «снова» естественным современным русским языком.
- source_word: וַתֵּלֶד בַּת
  choice: и родила дочь
  rationale: Прямо и естественно передаёт рождение дочери.
- source_word: וַיֹּאמֶר לוֹ
  choice: И Он сказал ему
  rationale: Сохраняет прямо выраженное косвенное дополнение «ему» и не подставляет имя Осии; прописная буква указывает на очевидного из контекста божественного говорящего.
- source_word: קְרָא שְׁמָהּ
  choice: Назови её
  rationale: Естественная русская формула наречения имени без буквального, но неестественного «назови её имя».
- source_word: לֹא רֻחָמָה
  choice: Ло-Рухама
  rationale: Личное имя транслитерировано, а его смысл и связь с корнем רחם пояснены в сноске.
- source_word: לֹא אוֹסִיף עוֹד אֲרַחֵם
  choice: Я больше не буду миловать
  rationale: Сочетание יסף с עוֹד выражает прекращение действия; «миловать» кратко и ясно передаёт רחם и сохраняет смысловую связь с именем Ло-Рухама.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохраняет явное заветно-национальное выражение исходного текста.
- source_word: כִּי נָשֹׂא אֶשָּׂא לָהֶם
  choice: чтобы прощать их
  rationale: Передаёт возможное значение נשׂא как снятия вины и понимает заключительную конструкцию как то, чего Бог более не станет делать; трудность и иной разбор отражены в сноске.
theological_decisions:
- issue: Передача символического имени дочери
  choice: Транслитерация «Ло-Рухама» с пояснением значения в сноске
  alternative: Перевод имени как «Непомилованная» или «Без милости»
  rationale: Транслитерация сохраняет имя собственное, тогда как сноска делает доступной его пророческую семантику.
- issue: Толкование трудной заключительной фразы כִּי נָשֹׂא אֶשָּׂא לָהֶם
  choice: 'Понимать נשׂא в значении прощения или снятия вины: «чтобы прощать их»'
  alternative: 'Понимать как действие суда: «ибо Я непременно унесу их»'
  rationale: Значение прощения хорошо согласуется с контекстом прекращения милости, но еврейская фраза трудна и допускает другое прочтение, которое нельзя скрывать.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан естественным, но сохранены местоимения исходного текста, выражение «дом Израиля», символическое имя и неоднозначность заключительной фразы.
