source:
  edition: WLC
  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל הוֹשֵׁ֨עַ֙ בֶּן בְּאֵרִ֔י בִּ/ימֵ֨י עֻזִּיָּ֥ה יוֹתָ֛ם אָחָ֥ז יְחִזְקִיָּ֖ה מַלְכֵ֣י יְהוּדָ֑ה וּ/בִ/ימֵ֛י יָרָבְעָ֥ם בֶּן יוֹאָ֖שׁ מֶ֥לֶךְ יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/001.yaml
  text: The word of Yahweh that came to Hosea son of Beeri in the days of Uzziah[a], Jotham, Ahaz, and Hezekiah, kings of Judah, and in the days of Jeroboam son of Joash, king of Israel.
translation:
  language: ru
  text: Слово Яхве[a], которое пришло к Осии, сыну Беэри, во дни Озии, Иоафама, Ахаза и Езекии, царей Иудеи, и во дни Иеровоама, сына Иоаса, царя Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: יהוה (YHWH); традиционно передаётся «Господь».'
    reason: Указывает еврейскую форму Божьего имени и традиционный вариант его передачи, не представляя избранное в тексте «Яхве» как альтернативу.
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: Слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу «слово Яхве» и не заменяет личное имя Бога титулом.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: которое пришло к
  rationale: В пророческих вступлениях это идиоматическое обозначение полученного пророком откровения; по-русски звучит естественнее буквального «которое было к».
- source_word: הוֹשֵׁעַ בֶּן בְּאֵרִי
  choice: Осии, сыну Беэри
  rationale: Передаёт имя пророка в закрепившейся русской форме и сохраняет прямое указание на отца.
- source_word: בִּימֵי
  choice: во дни
  rationale: Сохраняет повторяющуюся временную рамку еврейского текста и уместный для пророческого заголовка возвышенный, но понятный регистр.
- source_word: עֻזִּיָּה יוֹתָם אָחָז יְחִזְקִיָּה
  choice: Озии, Иоафама, Ахаза и Езекии
  rationale: Использованы устойчивые русские библейские формы царских имён.
- source_word: מַלְכֵי יְהוּדָה
  choice: царей Иудеи
  rationale: Приложение относится ко всем четырём предшествующим именам и передано без смыслового расширения.
- source_word: יָרָבְעָם בֶּן יוֹאָשׁ מֶלֶךְ יִשְׂרָאֵל
  choice: Иеровоама, сына Иоаса, царя Израиля
  rationale: Сохраняет патронимическое указание и отдельное обозначение северного царя.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» прямо передаёт его как имя, тогда как «Господь» является традиционной заменой титулом; вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной формулой «во дни», уместной для заголовка пророческой книги. Синтаксис сохраняет параллельное датирование по царям Иудеи и Израиля.
