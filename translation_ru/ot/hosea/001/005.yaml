base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/005.yaml
  text: And on that day I will break the bow of Israel in the Valley of Jezreel[a].
translation:
  language: ru
  text: И в тот день Я сломаю лук Израиля в долине Изреель[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокрушу лук Израиля»; «лук» здесь обозначает военную мощь Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохранена обычная для пророческой речи формула наступления будущего события; в русском языке она звучит естественно и торжественно.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчивое и точное соответствие еврейскому временному выражению, характерному для пророческих возвещений.
- source_word: וְשָׁבַרְתִּי
  choice: Я сломаю
  rationale: Глагол שׁבר означает «ломать, разбивать, сокрушать». В сочетании с луком «сломаю» прямо и естественно передаёт конкретный образ.
- source_word: קֶשֶׁת יִשְׂרָאֵל
  choice: лук Израиля
  rationale: Сохранён буквальный военный образ, метонимически указывающий на военную силу Израиля; толкование не подставлено вместо образа в основном тексте.
- source_word: בְּעֵמֶק
  choice: в долине
  rationale: עֵמֶק обозначает долину; предложное сочетание точно передаёт место действия.
- source_word: יִזְרְעֶאל
  choice: Изреель
  rationale: Использована принятая русская передача библейского географического названия без перевода его этимологического значения.
theological_decisions:
- issue: Передать «лук» буквально или заменить его толкованием о военной мощи
  choice: Сохранить в основном тексте буквальный образ «лук Израиля»
  alternative: военная мощь Израиля; сила Израиля
  rationale: Еврейский текст использует конкретный символ военной силы. Его сохранение передаёт пророческую образность и не сужает смысл толковательной парафразой.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Синтаксис сохраняет формулу «И будет в тот день», а двоеточие естественно вводит последующее Божье действие.
