  text: After she had weaned Lo-ruhamah[a], she conceived and gave birth to a son.
translation:
  language: ru
  text: Отняв Ло-Рухаму[a] от груди, она забеременела и родила сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Ло-Рухама означает «Непомилованная» или «Та, к которой не проявили милости». Значение имени важно для ближайшего контекста.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגְמֹל
  choice: Отняв … от груди
  rationale: В данном контексте Qal глагола גמל означает «отнять от груди». Деепричастная конструкция естественно передаёт предшествование следующему событию в повествовании.
- source_word: אֶת
  choice: '[показатель прямого дополнения, не переводится]'
  rationale: Еврейский показатель определённого прямого дополнения не имеет отдельного соответствия в русском тексте.
- source_word: לֹא רֻחָמָה
  choice: Ло-Рухаму
  rationale: Личное имя передано транслитерацией и поставлено в винительный падеж; дефис сохраняет составную форму еврейского имени. Его значимость раскрывается в сноске.
- source_word: וַתַּהַר
  choice: она снова забеременела
  rationale: Глагол הרה означает «зачать, забеременеть». «Забеременела» ясно и естественно звучит по-русски; «снова» эксплицирует повторность в последовательности рождений, подразумеваемую контекстом, не меняя смысла стиха.
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Краткое и естественное соответствие повествовательной формуле рождения.
- source_word: בֵּן
  choice: сына
  rationale: Существительное означает «сын»; после переходного глагола употреблён винительный падеж без артикля, которого в русском языке нет.
