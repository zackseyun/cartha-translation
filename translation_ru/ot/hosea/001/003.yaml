base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/003.yaml
  text: So he went and took Gomer daughter of Diblaim[a], and she conceived and bore him a son.
translation:
  language: ru
  text: И он пошёл и взял[a] Гомерь, дочь Дивлаима. Она зачала и родила ему сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «женился на Гомери»; «взял Гомерь в жёны». В еврейском тексте буквально: «взял»; брачный смысл следует из контекста.'
    reason: 'Лексическая альтернатива: пояснение контекстуального брачного значения לקח при сохранении буквальной формулировки в основном тексте.'
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: И он пошёл
  rationale: Форма wayyiqtol от הלך последовательно развивает повествование; союз «и» сохраняет простую цепочку действий еврейского текста и естественно звучит по-русски.
- source_word: וַיִּקַּח
  choice: взял
  rationale: לקח буквально означает «взял»; в данном контексте подразумевается вступление в брак, однако более прямой вариант сохраняет формулировку источника, не делая подразумеваемое явным в основном тексте.
- source_word: אֶת גֹּמֶר
  choice: Гомерь
  rationale: Показатель прямого дополнения не переводится; женское личное имя передано в традиционной русской форме «Гомерь».
- source_word: בַּת דִּבְלָיִם
  choice: дочь Дивлаима
  rationale: בת с именем собственным обозначает родственную принадлежность; беспредложная русская конструкция точно и естественно передаёт выражение.
- source_word: וַתַּהַר
  choice: Она зачала
  rationale: הרה означает «зачать, забеременеть»; «зачала» кратко передаёт еврейскую формулу и сохраняет связь с последующим рождением.
- source_word: וַתֵּלֶד
  choice: и родила
  rationale: Форма ילד означает «родила»; это ясный и естественный современный русский эквивалент.
- source_word: לוֹ
  choice: ему
  rationale: Предлог ל с местоименным суффиксом указывает, кому был рождён ребёнок; русский дательный падеж точно передаёт это отношение.
- source_word: בֵּן
  choice: сына
  rationale: בן обозначает ребёнка мужского пола; после «родила» требуется винительный падеж.
theological_decisions:
- issue: Следует ли явно передавать брачный смысл וַיִּקַּח
  choice: Сохранить более буквальное «взял».
  alternative: «женился на Гомери» или «взял Гомерь в жёны»
  rationale: В контексте глагол имеет брачный смысл, заданный повелением предыдущего стиха, но сама данная фраза буквально говорит «взял». Основной текст сохраняет эту лаконичность, а примечание поясняет подразумеваемый смысл, не устраняя присущую формулировке степень неявности.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным повествовательным строем. Синтаксический параллелизм исходного текста сохранён без архаизации; традиционные русские формы имён обеспечивают узнаваемость.
