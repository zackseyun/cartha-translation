language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלָ֔י/ו קְרָ֥א שְׁמ֖/וֹ יִזְרְעֶ֑אל כִּי ע֣וֹד מְעַ֗ט וּ/פָ֨קַדְתִּ֜י אֶת דְּמֵ֤י יִזְרְעֶאל֙ עַל בֵּ֣ית יֵה֔וּא וְ/הִ֨שְׁבַּתִּ֔י מַמְלְכ֖וּת בֵּ֥ית יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/004.yaml
  text: Then Yahweh said to him[a], “Call his name Jezreel, for in a little while I will punish the house of Jehu for the bloodshed of Jezreel[b], and I will put an end to the kingdom of the house of Israel.”
translation:
  language: ru
  text: 'И Яхве сказал ему: «Назови его Изреелем[a], потому что ещё немного — и Я взыщу с дома Ииуя за кровопролитие в Изрееле[b] и положу конец царству дома Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Изреель — и символическое имя ребёнка, и название места, связанного с насильственными действиями Ииуя.
    reason: cultural_note
  - marker: b
    text: 'Или: «за кровь Изрееля»; возможно также: «за вину за кровь Изрееля». Буквально по-еврейски: «за крови Изрееля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: קְרָא שְׁמוֹ
  choice: Назови его
  rationale: Естественный современный русский эквивалент еврейского оборота «назови имя его»; сохраняет повеление дать ребёнку указанное имя.
- source_word: יִזְרְעֶאל
  choice: Изреель / Изреелем
  rationale: Традиционная русская передача имени и географического названия; форма творительного падежа нужна после «назови».
- source_word: כִּי עוֹד מְעַט
  choice: потому что ещё немного — и
  rationale: Сохраняет объяснительное значение כִּי и ощущение близости предстоящего суда, оставаясь естественным по-русски.
- source_word: וּפָקַדְתִּי
  choice: Я взыщу
  rationale: В контексте суда глагол פקד означает привлечение к ответу и наказание. «Взыщу» сохраняет судебно-карательный оттенок и допускает присущее глаголу значение посещения ради воздаяния.
- source_word: דְּמֵי יִזְרְעֶאל
  choice: за кровопролитие в Изрееле
  rationale: Множественное דְּמֵי, буквально «крови», идиоматически обозначает пролитую кровь или вину за неё. Предлог «в» ясно передаёт связь насилия с местом Изреелем, не устраняя отмеченную в сноске смысловую широту.
- source_word: עַל בֵּית יֵהוּא
  choice: с дома Ииуя
  rationale: Русская конструкция «взыскать с кого-либо за что-либо» естественно передаёт объект наказания, выраженный еврейским עַל.
- source_word: וְהִשְׁבַּתִּי
  choice: положу конец
  rationale: 'Точно и идиоматично передаёт каузативное значение: заставить прекратиться, упразднить.'
- source_word: מַמְלְכוּת בֵּית יִשְׂרָאֵל
  choice: царству дома Израиля
  rationale: Сохраняет и «царство», и присутствующее в еврейском тексте выражение «дом Израиля», не сглаживая его до одного «царства Израиля».
theological_decisions:
- issue: Характер суда над домом Ииуя
  choice: Передать прямое возвещение о взыскании с дома Ииуя за кровь, связанную с Изреелем, не объясняя причину подробнее.
  alternative: Истолковать стих либо как безусловное осуждение всех действий Ииуя в 4 Царств 9–10, либо как осуждение только последующей неверности его династии.
  rationale: Сам стих объявляет суд, но не разрешает напряжение между этим возвещением и прежним поручением Ииую. Перевод не должен вносить отсутствующее в тексте согласование или полемическое толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Конструкция «ещё немного — и» передаёт близость суда без архаической тяжеловесности. «Взыщу» выбрано как понятное библейско-судебное слово; имена переданы в привычной русской библейской форме.
