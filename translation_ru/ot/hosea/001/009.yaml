  text: And he said[a], “Call his name Not-My-People, for you are not my people, and I am not yours.”
translation:
  language: ru
  text: 'И Он сказал: «Назови его Не-мой-народ, потому что вы — не Мой народ, и Я не буду для вас[a]».'
