lexical_decisions:
- source_word: קְרָא שְׁמוֹ
  choice: Назови его
  rationale: Естественно передаёт еврейскую формулу наречения имени, не утрачивая смысла повеления.
- source_word: לֹא עַמִּי
  choice: Не-Мой-Народ
  rationale: Значение символического имени переведено, а дефисы показывают, что всё выражение служит личным именем.
- source_word: כִּי
  choice: потому что
  rationale: Ясно и естественно выражает причинную связь между именем ребёнка и приговором народу.
- source_word: אַתֶּם לֹא עַמִּי
  choice: вы — не Мой народ
  rationale: Сохраняет прямое отрицание формулы завета; тире перед именной частью сказуемого подчёркивает суровый контраст.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה לָכֶם
  choice: и Я не буду вашим
  rationale: Передаёт будущую форму אֶהְיֶה и естественно звучит по-русски, не добавляя отсутствующего в еврейском тексте слова «Бог»; эллиптичность и заветный подтекст сохранены.
theological_decisions:
- issue: Обращение формулы завета в последней части стиха
  choice: и Я не буду вашим
  alternative: 'и Я не буду вашим Богом; буквально: и Я не буду для вас'
  rationale: В еврейском тексте слово «Бог» не названо, хотя оно подразумевается распространённой формулой завета. Основной текст не восполняет эту лакуну догматически, а примечание отмечает буквальную конструкцию и обычное понимание.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной пророческой интонацией. Заглавные буквы в местоимениях «Он», «Мой», «Я» обозначают Бога в соответствии с принятой русской библейской традицией; символическое имя переведено и оформлено через дефисы.
