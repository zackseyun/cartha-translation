base_translation:
  language: en
  yaml_path: translation/ot/hosea/001/007.yaml
  text: But I will have compassion on the house of Judah[a], and I will save them by Yahweh their God; I will not save them by bow, or by sword, or by war, by horses, or by horsemen.
translation:
  language: ru
  text: Но дом Иуды Я помилую и спасу их через Яхве, их Бога[a]; спасу их не луком, не мечом, не войной, не конями и не всадниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Яхве, их Богом». Еврейский предлог может обозначать средство, действующую силу или посредство; далее Яхве противопоставлен военным средствам спасения.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֶת בֵּית יְהוּדָה
  choice: Но дом Иуды
  rationale: Союз ו в контексте противопоставляет милость к Иуде суду над Израилем в предыдущем стихе. «Дом Иуды» сохраняет национально-династическое выражение оригинала.
- source_word: אֲרַחֵם
  choice: Я помилую
  rationale: Глагол רחם передаёт сострадание и милость. «Помилую» звучит естественно и достойно, сохраняя как эмоциональный, так и волевой оттенок.
- source_word: וְהוֹשַׁעְתִּים / וְלֹא אוֹשִׁיעֵם
  choice: и спасу их / спасу их не
  rationale: Повтор глагола «спасу» воспроизводит один и тот же еврейский корень ישׁע и подчёркивает противопоставление Божьего спасения военным средствам.
- source_word: בַּיהוָה אֱלֹהֵיהֶם
  choice: Яхве, их Богом
  rationale: 'Творительный падеж передаёт вероятное инструментальное значение предлога ב и сохраняет необычную формулировку оригинала: говорящий спасает посредством Яхве, их Бога.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное covenantное имя יהוה, а не заменяющий его титул.
- source_word: בְּקֶשֶׁת וּבְחֶרֶב וּבְמִלְחָמָה בְּסוּסִים וּבְפָרָשִׁים
  choice: не луком, не мечом, не войной, не конями и не всадниками
  rationale: Творительный падеж естественно выражает средство действия в русском языке; повтор «не» ясно распространяет отрицание на весь перечень военных средств.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в исходном тексте и не подменяет его титулом.
- issue: Значение בַּיהוָה אֱלֹהֵיהֶם
  choice: 'инструментальное: «Яхве, их Богом»'
  alternative: посредством/через Яхве, их Бога; в Яхве, их Боге
  rationale: Последующий отказ от лука, меча, войны, коней и всадников делает значение средства или действующей силы наиболее вероятным. При этом сжатая русская формулировка не устраняет необычное богословское напряжение третьего лица.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатого пророческого ритма. Заглавные местоимения при речи Бога использованы в соответствии с принятым русским библейским регистром; перечень военных средств оставлен конкретным и без поясняющих добавлений.
