  yaml_path: translation/ot/hosea/001/002.yaml
  text: The beginning of the word of Yahweh through Hosea[a]. And Yahweh said to Hosea, “Go, take for yourself a wife of whoredom and children of whoredom[c][b], for the land utterly commits whoredom by turning away from Yahweh.”
translation:
  language: ru
  text: 'Начало слова Яхве, данного через Осию[a]. И Яхве сказал Осии: «Иди, возьми себе жену блуда и детей блуда[b], ибо земля всецело предаётся блуду[c], отступая от Яхве».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда Яхве впервые заговорил через Осию». Еврейскую начальную фразу можно понимать либо как заголовок, либо как придаточное времени.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «жену проституции и детей проституции». Еврейское זְנוּנִים может обозначать как половую распущенность в широком смысле, так и проституцию в более узком.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «ибо земля, блудодействуя, блудодействует, отступая от Яхве». Повтор однокоренных форм в еврейском тексте усилительно подчёркивает крайнюю степень заветной неверности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחִלַּת דִּבֶּר יְהוָה בְּהוֹשֵׁעַ
  choice: Начало слова Яхве через Осию
  rationale: Сохраняет возможный характер заголовка; בְּ перед именем Осии передано инструментально — «через», в отличие от следующего אֶל הוֹשֵׁעַ, ясно обозначающего обращение к Осии. Временное понимание вынесено в сноску.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, не заменяя его титулом.
- source_word: לֵךְ קַח לְךָ
  choice: Иди, возьми себе
  rationale: Сохранены оба повелительных глагола и возвратное значение לְךָ; более истолковывающее «женись» не вводится.
- source_word: אֵשֶׁת זְנוּנִים
  choice: жену блуда
  rationale: Намеренно резкое сочетание сохраняет широкую сексуальную и заветную образность זְנוּנִים, не сужая её до коммерческой проституции.
- source_word: וְיַלְדֵי זְנוּנִים
  choice: и детей блуда
  rationale: Сохраняет параллелизм с «женой блуда» и не уточняет сверх текста, идёт ли речь о происхождении детей, их среде или их собственном характере.
- source_word: כִּי זָנֹה תִזְנֶה
  choice: ибо земля всецело предаётся блуду
  rationale: Наречие «всецело» передаёт усиление конструкции с абсолютным инфинитивом и личной формой глагола; настоящее время сохраняет характер утверждения.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Сохраняет основной смысл и заветные ассоциации слова; в контексте подразумеваются земля Израиля и её жители.
- source_word: מֵאַחֲרֵי יְהוָה
  choice: отступая от Яхве
  rationale: Естественно передаёт буквальное «из-за следования за Яхве / от вслед Яхве» как прекращение верности и следования ему.
theological_decisions:
- issue: Степень резкости сексуальной образности
  choice: Сохранить выражение «блуд» в обеих параллельных фразах
  alternative: «распутство», «проституция» или «супружеская неверность»
  rationale: Пророческий текст намеренно использует резкую образность для заветной неверности Израиля. «Блуд» сохраняет её силу и не ограничивает значение только коммерческим сексом или супружеской изменой.
- issue: Значение בְהוֹשֵׁעַ в начальной фразе
  choice: «через Осию»
  alternative: «к Осии» или «с Осией»
  rationale: В следующей части для прямого обращения употреблено отдельное אֶל הוֹשֵׁעַ. Поэтому инструментальное «через Осию» лучше сохраняет различие конструкций, не исключая отмеченной в сноске синтаксической неоднозначности всего начала.
- issue: Смысл «детей блуда»
  choice: Сохранить неоднозначную конструкцию без пояснения в основном тексте
  alternative: «детей, рождённых от блуда» или «распутных детей»
  rationale: Еврейское сочетание допускает связь с происхождением, обстоятельствами брака или характеристикой детей. Уточнение разрешило бы напряжение, которого сам текст явно не разрешает.
translation_notes:
  register: 'Современный литературный русский с достоинством пророческой речи. Выражения «жена блуда» и «дети блуда» намеренно стилистически резки и несколько необычны: это сохраняет шокирующую образность оригинала. Синтаксис в остальном сделан ясным для современного читателя.'
