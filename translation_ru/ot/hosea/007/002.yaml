  text: וּ/בַל יֹֽאמְרוּ֙ לִ/לְבָבָ֔/ם כָּל רָעָתָ֖/ם זָכָ֑רְתִּי עַתָּה֙ סְבָב֣וּ/ם מַֽעַלְלֵי/הֶ֔ם נֶ֥גֶד פָּנַ֖/י הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/002.yaml
  text: And they do not say in their heart that I remember all their evil[a]. Now their deeds surround them[c][b]; they are before my face.
translation:
  language: ru
  text: 'И они не говорят себе[a]: «Я помню всё их зло[b]». Теперь их дела окружают их; они перед Моим лицом[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не говорят в своём сердце». Буквально: «не говорят своему сердцу».'
    reason: Лексическая альтернатива и пояснение древнееврейской идиомы внутренней речи.
  - marker: b
    text: 'Или: «всё их нечестие».'
    reason: רָעָה допускает передачу как «зло» или «нечестие».
  - marker: c
    text: Буквальное древнееврейское выражение, означающее, что их дела непосредственно открыты Божьему присутствию и взору.
    reason: Пояснение антропоморфной идиомы נֶגֶד פָּנַי.
lexical_decisions:
- source_word: וּבַל
  choice: И не
  rationale: Сочетание союза с отрицательной частицей продолжает обличение; нейтральное «И не» сохраняет связность еврейской речи, не усиливая без необходимости противительное значение.
- source_word: יֹאמְרוּ לִלְבָבָם
  choice: говорят они в своём сердце
  rationale: Сохранён конкретный древнееврейский образ внутренней речи; по-русски выражение понятно как размышление или слова, сказанные про себя.
- source_word: כָּל רָעָתָם
  choice: всё их зло
  rationale: רָעָה обозначает здесь совокупность нравственного зла и нечестия; «зло» не сужает смысл только до отдельных поступков.
- source_word: זָכָרְתִּי
  choice: Я помню
  rationale: Перфект выражает сохраняющую силу совершённого припоминания — зло находится в Божьей памяти; русское настоящее время естественно передаёт актуальное состояние.
- source_word: עַתָּה
  choice: Теперь
  rationale: Слово отмечает нынешнее следствие того, что народ не считается с Божьей памятью о его зле.
- source_word: סְבָבוּם
  choice: окружили их
  rationale: Глагол передаёт образ поступков, которые со всех сторон обступили совершивших их; совершенный вид естественно выражает наступивший результат.
- source_word: מַעַלְלֵיהֶם
  choice: их дела
  rationale: מַעֲלָל обозначает поступки или деяния, часто с нравственной оценкой; «дела» звучит весомо и не добавляет отсутствующей в самом слове квалификации.
- source_word: נֶגֶד פָּנַי
  choice: перед Моим лицом
  rationale: Сохранено яркое антропоморфное выражение непосредственной открытости Божьему присутствию и наблюдению.
- source_word: הָיוּ
  choice: они — перед
  rationale: 'Форма описывает наличное состояние: дела находятся прямо перед Богом. В русском именная конструкция с тире естественно передаёт это состояние без избыточного глагола.'
theological_decisions:
- issue: Антропоморфное выражение Божьего знания и суда
  choice: перед Моим лицом
  alternative: передо Мной
  rationale: Буквальный образ лица сохраняет пророческую силу текста и подчёркивает, что дела народа непосредственно открыты Богу, не утверждая ничего сверх образности оригинала.
- issue: Временной оттенок זָכָרְתִּי применительно к Божьей памяти
  choice: Я помню
  alternative: Я вспомнил / Я запомнил
  rationale: Настоящее время передаёт продолжающуюся осведомлённость Бога и не превращает выражение в указание на момент, когда Бог прежде якобы не знал о зле.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Инверсия «не говорят они» слегка приподнимает тон, оставаясь понятной; конкретные образы сердца, окруживших дел и Божьего лица сохранены.
