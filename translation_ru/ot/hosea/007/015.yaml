base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/015.yaml
  text: Though I trained and strengthened their arms[a], yet they devise evil against me.
translation:
  language: ru
  text: А ведь Я наставлял их[a] и укреплял их руки, но они замышляют против Меня зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вразумлял», «дисциплинировал» или «наказывал»; еврейский глагол может обозначать как наставление и воспитание, так и исправительное наказание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסַּרְתִּי
  choice: обучал
  rationale: 'Глагол יסר может обозначать обучение, наставление, дисциплинирование или наказание. В параллели с «укреплял их руки» здесь естественнее формирующее значение: Бог готовил и укреплял народ. Смысловой диапазон отмечен в сноске.'
- source_word: חִזַּקְתִּי
  choice: укреплял
  rationale: Порода пиэль глагола חזק обычно означает «укреплять, делать сильным»; выбран прямой и естественный русский эквивалент.
- source_word: זְרֽוֹעֹתָם
  choice: их руки
  rationale: Сохранён конкретный образ рук как орудия силы; переносное «их силы» сделало бы образ менее выразительным.
- source_word: וְאֵלַי
  choice: против Меня
  rationale: Буквально предлог означает направленность «ко Мне / в отношении Меня», но в сочетании с замышлением зла выражает враждебную направленность, что по-русски естественно передаётся как «против Меня».
- source_word: יְחַשְּׁבוּ רָע
  choice: замышляют зло
  rationale: Сочетание חשב с רע обозначает не просто дурные мысли, а намерение или планирование зла. «Замышляют зло» кратко и точно передаёт этот смысл.
- source_word: וַאֲנִי
  choice: А ведь Я
  rationale: Сочетание союза с выраженным местоимением подчёркивает резкий контраст между благим действием Бога и ответом народа. «А ведь Я» естественно передаёт уступительно-противительный оттенок в современном русском языке.
theological_decisions:
- issue: Характер Божьего действия, выраженного глаголом יִסַּרְתִּי
  choice: благотворное формирование и обучение («обучал»)
  alternative: дисциплинировал, вразумлял или наказывал
  rationale: Непосредственный параллелизм с «укреплял их руки» поддерживает положительный смысл подготовки и обучения, но многозначность исходного глагола не позволяет полностью исключить исправительно-дисциплинарный оттенок; он сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified пророческим звучанием. Конкретный образ «руки» сохранён; конструкция «А ведь Я… но они…» подчёркивает контраст без устранения смыслового напряжения.
