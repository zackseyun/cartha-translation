  text: א֤וֹי לָ/הֶם֙ כִּֽי נָדְד֣וּ מִמֶּ֔/נִּי שֹׁ֥ד לָ/הֶ֖ם כִּֽי פָ֣שְׁעוּ בִ֑/י וְ/אָנֹכִ֣י אֶפְדֵּ֔/ם וְ/הֵ֕מָּה דִּבְּר֥וּ עָלַ֖/י כְּזָבִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/013.yaml
  text: Woe to them[a], for they have wandered away from me! Destruction is theirs, for they have rebelled against me. Though I would redeem them, they speak lies against me.
translation:
  language: ru
  text: 'Горе им: они удалились от Меня! Гибель им: они восстали против Меня. Я хотел бы искупить их[a], но они говорят против Меня ложь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И всё же Я искупил бы их»; некоторые понимают глагол как прошедшее время: «Но Я искупил их».'
    reason: alternative_reading
lexical_decisions:
- source_word: א֤וֹי
  choice: Горе
  rationale: Передаёт одновременно пророческое предостережение, угрозу суда и скорбь; в современном литературном русском сохраняет библейскую торжественность.
- source_word: נָדְדוּ מִמֶּנִּי
  choice: они удалились от Меня
  rationale: נדד обозначает уход, отдаление или скитание. «Удалились» естественно передаёт направленность прочь от Бога и не усиливает значение до намеренного бегства.
- source_word: שֹׁד לָהֶם
  choice: Гибель им
  rationale: Краткая именная конструкция сохраняет резкость еврейского провозглашения суда; «гибель» передаёт разрушительное бедствие, обозначаемое שֹׁד.
- source_word: פָשְׁעוּ בִי
  choice: они восстали против Меня
  rationale: פשע означает не просто проступок, а мятеж и нарушение верности; «восстали» ясно выражает этот усиленный смысл.
- source_word: וְאָנֹכִי אֶפְדֵּם
  choice: Я хотел бы искупить их
  rationale: Имперфект אֶפְדֵּם допускает модально-волитивное, непрошедшее понимание. Формулировка передаёт Божью готовность или намерение искупить и сохраняет напряжение с последующим противительным высказыванием.
- source_word: דִּבְּרוּ עָלַי כְּזָבִים
  choice: они говорят обо Мне ложь
  rationale: עַל в данном сочетании естественно передаётся как «обо Мне», а множественное כְּזָבִים собирательным русским «ложь»; фраза остаётся прямой и не усиливается до более узкого «клевещут».
theological_decisions:
- issue: Временное и модальное значение וְאָנֹכִי אֶפְדֵּם
  choice: Я хотел бы искупить их
  alternative: Но Я искупил их; Я искуплю их
  rationale: Еврейский имперфект естественно допускает непрошедшее модальное значение и в контексте противопоставляет Божью готовность искупить их лживому отношению народа. В сноске сохранены возможные понимания как решительного будущего и как прошедшего действия, чтобы не устранять подлинную неоднозначность.
- issue: Связь последней части с предыдущей
  choice: но они говорят обо Мне ложь
  alternative: а они говорят обо Мне ложь
  rationale: Союз וְ допускает контекстуальное противительное значение. «Но» естественно выражает риторический контраст, не добавляя отдельного богословского вывода.
translation_notes:
  register: Современный литературный русский с кратким, торжественным пророческим ритмом. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции. Сохранены параллелизм, резкость двух первых возгласов и неоднозначность Божьего высказывания об искуплении.
