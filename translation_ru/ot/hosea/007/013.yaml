  source_fidelity: 'Первые две строки точно передают еврейские возгласы суда: «Горе им» соответствует אוֹי, «Гибель им» удачно сохраняет краткую именную конструкцию שֹׁד לָהֶם, а «восстали против Меня» передаёт усиленный смысл פשע. «Удалились от Меня» допустимо для נָדְדוּ מִמֶּנִּי, хотя несколько слабее передаёт оттенок ухода/скитания. В последней строке «обо Мне» возможно, но עָלַי в данном враждебном контексте направлено против Бога; это следует выразить яснее.'
  naturalness: Текст в целом звучит как современный литературный русский с уместной пророческой торжественностью. Сочетание «говорят обо Мне ложь» понятно, но менее естественно и менее точно по направленности, чем «говорят против Меня ложь»; последнее допустимо в высоком библейско-литературном регистре.
  terminology: «Искупить» — устоявшееся и приемлемое соответствие פדה в данном контексте. Формула «Я хотел бы искупить их» передаёт волитивное понимание имперфекта, но сноска должна также прямо отражать альтернативное прочтение как решительного, а не просто будущего действия («И всё же Я искупил бы их»), наряду с возможным прошедшим.
