  text: כְּ/רָפְאִ֣/י לְ/יִשְׂרָאֵ֗ל וְ/נִגְלָ֞ה עֲוֺ֤ן אֶפְרַ֨יִם֙ וְ/רָע֣וֹת שֹֽׁמְר֔וֹן כִּ֥י פָעֲל֖וּ שָׁ֑קֶר וְ/גַנָּ֣ב יָב֔וֹא פָּשַׁ֥ט גְּד֖וּד בַּ/חֽוּץ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/001.yaml
  text: When I would heal Israel[a], the iniquity of Ephraim is uncovered, and the evil deeds of Samaria; for they practice falsehood. A thief comes in[c][b]; a raiding band strips outside.
translation:
  language: ru
  text: Когда Я исцеляю Израиль[a], открывается беззаконие Ефрема и злодеяния Самарии, потому что они поступают лживо[b]. Вор входит, а снаружи совершает набег разбойничий отряд[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Я исцелял Израиль»; или: «когда Я приступаю к исцелению Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «они творят ложь»; возможно также: «они действуют обманом».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «а снаружи разбойничий отряд совершает набег». Глагол может означать грабёж, набег или опустошение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָפְאִי
  choice: Когда Я исцеляю
  rationale: Предлог כְּ вводит временное обстоятельство, а форма с суффиксом 1-го лица указывает на Бога как говорящего. Настоящее время естественно передаёт действие, при совершении которого обнаруживается грех, не исключая оттенка начатого или предполагаемого исцеления.
- source_word: לְיִשְׂרָאֵל
  choice: Израиль
  rationale: Название народа выступает при действии исцеления как объект/получатель; сохранено традиционное русское написание.
- source_word: וְנִגְלָה
  choice: открывается
  rationale: Нифаль глагола גלה означает, что нечто становится явным, обнаруживается. «Открывается» сохраняет образ скрытого прежде беззакония и согласуется с живым пророческим настоящим.
- source_word: עֲוֺן
  choice: беззаконие
  rationale: עון может обозначать порочность, вину или её последствия. Здесь речь идёт о нравственном зле Ефрема, становящемся явным; «беззаконие» сохраняет весомость слова, не сводя его лишь к чувству вины.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено традиционное русское библейское имя; у Осии оно часто обозначает северное царство.
- source_word: וְרָעוֹת
  choice: злодеяния
  rationale: Множественное число רעות в данном контексте обозначает нравственно злые поступки, а не постигшие город бедствия. «Злодеяния» ясно передаёт деятельный и этический смысл.
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Сохранено традиционное русское название столицы северного царства, метонимически представляющей её жителей и власть.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание того, почему беззаконие и злодеяния становятся явными.
- source_word: פָעֲלוּ שָׁקֶר
  choice: они поступают лживо
  rationale: Сочетание глагола «делать, совершать» с שקר описывает ложное, обманное поведение. Формулировка передаёт устойчивый образ действий и звучит естественно по-русски.
- source_word: וְגַנָּב יָבֹוא
  choice: Вор входит
  rationale: Единственное число имеет обобщающий смысл. «Входит» прямо передаёт בוא без добавления явно не выраженного в тексте взлома.
- source_word: פָּשַׁט גְּדוּד בַּחוּץ
  choice: а на улице грабит разбойничья шайка
  rationale: פשט с גדוד описывает налёт, грабёж или опустошение вооружённой группой. Перевод сохраняет образ открытого уличного грабежа и контрастирует со входящим вором.
theological_decisions:
- issue: Временное соотношение Божьего исцеления и обнаружения греха
  choice: Беззаконие обнаруживается в то время, когда Бог исцеляет Израиль.
  alternative: Речь может идти о прошлом действии («когда Я исцелял») либо о начатом намерении исцелить («когда Я приступаю к исцелению»).
  rationale: Еврейская конструкция допускает значения «когда/по мере того как Я исцеляю» и не требует жёстко выбирать между продолжающимся, прошлым или начатым действием. Основной текст сохраняет временную связь, а примечание фиксирует грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис оставлен кратким и напряжённым; традиционные имена «Ефрем» и «Самария» сохранены. Заглавная «Я» обозначает Бога как говорящего. Неоднозначность временной формы и диапазон значений פשט вынесены в примечания без конфессионального истолкования.
