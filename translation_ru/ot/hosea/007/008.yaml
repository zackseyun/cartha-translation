  text: Ephraim mixes himself among the peoples[b][a]; Ephraim has become a cake not turned.
translation:
  language: ru
  text: Ефрем смешивается среди народов; Ефрем стал лепёшкой, которую не перевернули.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Образ лепёшки, которую при выпечке не перевернули: она подгорала с одной стороны и оставалась непропечённой с другой.'
    reason: cultural_note
lexical_decisions:
- source_word: יִתְבּוֹלָל
  choice: смешивается
  rationale: Возвратно-интенсивная форма передаёт деятельное вовлечение Ефрема в смешение с окружающими народами. Русское «смешивается» естественно сохраняет эту смысловую направленность без излишнего уточнения.
- source_word: בָּעַמִּים
  choice: с другими народами
  rationale: Множественное עַמִּים обозначает окружающие народы. Предлог בְּ здесь естественно передаётся сочетанием «с...», а слово «другими» делает подразумеваемое противопоставление Ефрема этим народам ясным по-русски, не сводя их к современным государствам.
- source_word: עֻגָה
  choice: лепёшкой
  rationale: Слово обозначает хлебную лепёшку, выпекавшуюся на раскалённой поверхности или углях. «Лепёшка» точнее русского «пирог» и сразу сохраняет хлебный характер образа.
- source_word: בְּלִי הֲפוּכָה
  choice: которую не перевернули
  rationale: Выражение описывает лепёшку, не перевёрнутую во время выпечки. Придаточная конструкция звучит по-русски естественно и ясно передаёт результат пропущенного действия.
- source_word: הָיָה
  choice: стал
  rationale: В контексте форма выражает наступившее состояние. «Стал» кратко и естественно передаёт переход к состоянию, изображённому метафорой.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено собственное имя в принятой русской библейской форме; в книге Осии оно представляет северное царство, но это толкование не подменяет названного в тексте референта.
theological_decisions:
- issue: Кого обозначает «Ефрем»
  choice: В основном тексте сохранено имя «Ефрем», которое в пророческом контексте представляет северное царство Израиля.
  alternative: Заменить имя словами «Израиль» или «северное царство».
  rationale: Замена имени истолкованием снизила бы прозрачность перевода и устранила бы значимое для книги Осии заветно-историческое обозначение.
- issue: Смысл образа неперевёрнутой лепёшки
  choice: Образ сохранён без прямого истолкования в основном тексте; практическая сторона древнего способа выпечки пояснена в сноске.
  alternative: 'Раскрыть в тексте оценку: «подгоревшая с одной стороны и сырая с другой».'
  rationale: Источник даёт метафору, а не её явное объяснение. Сноска помогает современному читателю увидеть отрицательный смысл образа, не превращая вывод толкователя в слова пророка.
translation_notes:
  register: Современный литературный русский язык с краткой, выразительной пророческой конструкцией. «Лепёшка» употреблено в прямом хлебном значении; синтаксический параллелизм с двукратным «Ефрем» сохранён. Лексическая альтернатива «смешивается среди народов» возможна, но менее естественна по-русски.
