base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/005.yaml
  text: On the day of our king[a], the princes made themselves sick with the heat of wine[c][b]; he stretched out his hand with mockers.
translation:
  language: ru
  text: В день нашего царя[a] вельможи разболелись от жара вина[b]; он протянул руку насмешникам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «В царский день». Некоторые понимают это как день царского празднества, но буквальнее: «в день нашего царя».'
    reason: lexical_alternative
  - marker: b
    text: «Жар вина» можно также понять как «жжение вина» или, что менее вероятно, «яд вина».
    reason: lexical_alternative
  - marker: c
    text: То есть он сблизился с насмешниками или принял их сторону, протянув им руку.
    reason: cultural_note
lexical_decisions:
- source_word: י֣וֹם מַלְכֵּ֔נוּ
  choice: В день нашего царя
  rationale: Буквально конструкция означает «день нашего царя». Предлог «в» естественно добавлен по-русски; указание на царский праздник возможно по контексту, но прямо в еврейском тексте отсутствует.
- source_word: הֶחֱל֥וּ
  choice: довели себя до болезни
  rationale: 'Порода hифиль от חלה здесь передаёт причинно-возвратный смысл: вельможи сами сделали себя больными. Такой перевод сохраняет образ болезненного последствия винного излишества.'
- source_word: שָׂרִ֖ים
  choice: вельможи
  rationale: Слово обозначает князей, правителей или высокопоставленных сановников. «Вельможи» естественно передаёт придворное окружение, не приписывая им определённого наследственного титула.
- source_word: חֲמַ֣ת מִיָּ֑יִן
  choice: жаром вина
  rationale: חמה может означать жар, пыл, ярость либо яд. В сцене опьянения «жар вина» сохраняет яркую и намеренно неоднозначную метафору исходного текста.
- source_word: מָשַׁ֥ךְ יָד֖וֹ
  choice: он протянул руку
  rationale: Сохранён буквальный образ протянутой руки. В данном контексте жест, вероятно, выражает принятие, близость или участие, но это значение не подставлено непосредственно в основной текст.
- source_word: אֶת לֹצְצִֽים
  choice: насмешникам
  rationale: לצצים — насмешники или глумливые люди. Русское управление «протянул руку насмешникам» естественно передаёт направленный к ним жест, а его вероятный социальный смысл поясняется в сноске.
theological_decisions:
- issue: К кому относится подразумеваемое подлежащее «он»
  choice: Сохранено местоимение «он» без прямого называния царя.
  alternative: Можно прямо перевести «царь протянул руку» либо по смыслу связать действие с вельможами.
  rationale: Еврейский глагол стоит в единственном числе, а ближайший естественный референт — царь. Однако подлежащее повторно не названо, поэтому перевод сохраняет грамматическое число и исходную недосказанность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной лексикой. «Вельможи» сохраняет придворный контекст; метафоры болезни, жара вина и протянутой руки оставлены без излишнего истолкования в основном тексте.
