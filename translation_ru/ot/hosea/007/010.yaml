base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/010.yaml
  text: The pride of Israel testifies against him[a], yet they do not return to Yahweh their God[b], nor do they seek him in all this.
translation:
  language: ru
  text: И гордость Израиля свидетельствует против него[a], но они не возвращаются к Яхве, своему Богу, и при всём этом[b] не ищут Его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ему в лицо»; буквально: «перед его лицом».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «несмотря на всё это».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנָה
  choice: свидетельствует
  rationale: В сочетании с «гордостью Израиля» и בְּפָנָיו глагол естественно выражает свидетельство против обвиняемого; настоящее время соответствует пророческому описанию.
- source_word: גְאוֹן יִשְׂרָאֵל
  choice: гордость Израиля
  rationale: В обличительном контексте גאון имеет отрицательный смысл — высокомерие, гордость, — а не нейтральное «величие».
- source_word: בְּפָנָיו
  choice: против него
  rationale: Буквально «в/перед его лицом»; при судебном оттенке ענה выражение передано как свидетельство «против него». Единственное число сохранено.
- source_word: שָׁבוּ אֶל
  choice: возвращаются к
  rationale: Сочетание обозначает возвращение к Богу, включая покаяние и восстановление отношений, без внесения этого толкования прямо в текст.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: אֱלֹהֵיהֶם
  choice: своему Богу
  rationale: Возвратное «своему» естественно по-русски соотносит Бога с подлежащим «они» и сохраняет заветный оттенок принадлежности.
- source_word: בִקְשֻׁהוּ
  choice: ищут Его
  rationale: Широкое значение поиска Бога — обращения к Нему и стремления к Нему — сохранено без сужения до «вопрошают».
- source_word: בְּכָל זֹאת
  choice: при всём этом
  rationale: Формулировка близка к еврейской и допускает как обстоятельственный, так и уступительный оттенок; более явное «несмотря на всё это» дано в примечании.
theological_decisions:
- issue: Референт суффикса единственного числа в בְּפָנָיו
  choice: «против него» — единственное число сохранено
  alternative: «против них» по смыслу собирательного Израиля; либо «перед ним»
  rationale: Еврейский текст использует суффикс мужского рода единственного числа, соотносимый с собирательным «Израиль». Смена числа между «Израилем» и «они» не сглажена.
- issue: Уступительный оттенок בְּכָל זֹאת
  choice: «при всём этом»
  alternative: «несмотря на всё это»
  rationale: Основной текст сохраняет смысловую широту предлога בְּ, тогда как уступительное понимание, хорошо соответствующее контексту, отмечено как вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Начальное «И» сохраняет связь со стихом 9; противительный переход передан союзом «но». Написание «Его» следует принятой русской благоговейной норме, не меняя смысла местоимения.
