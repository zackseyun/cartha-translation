  yaml_path: translation/ot/hosea/007/003.yaml
  text: By their evil they make the king glad[a], and by their lies the princes.
translation:
  language: ru
  text: Своим злом они радуют царя, и своей ложью — вельмож.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своим обманом — правителей».'
    reason: Лексические значения כחשׁ и שׂרים допускают соответственно переводы «обман» и «правители».
lexical_decisions:
- source_word: בְּרָעָתָם
  choice: Своим злом
  rationale: Предлог ב передаёт средство или основание действия; «своим злом» кратко и точно сохраняет собирательное единственное число древнееврейского текста.
- source_word: יְשַׂמְּחוּ
  choice: они радуют
  rationale: 'Форма пиэль от שׂמח имеет каузативный смысл: они вызывают радость у царя. Русское «радуют» естественно передаёт это значение.'
- source_word: מֶלֶךְ
  choice: царя
  rationale: Хотя в древнееврейском нет артикля, контекст указывает на определённого израильского царя; русский винительный падеж естественно передаёт прямое дополнение.
- source_word: וּבְכַחֲשֵׁיהֶם
  choice: а своей ложью
  rationale: כחשׁ может обозначать ложь, обман или вероломство. «Ложью» прямо и естественно соответствует параллельному выражению «своим злом»; союз «а» ясно оформляет поэтический параллелизм.
- source_word: שָׂרִים
  choice: вельмож
  rationale: Слово обозначает высокопоставленных правителей или придворных. «Вельможи» сохраняет придворно-политический контекст и в современном русском не подразумевает обязательно царского родства, как могут подразумевать «князья».
