  source_fidelity: 'Основные образы и глагольные формы переданы верно: сеть раскидывается над ними, а образ птиц относится к низведению добычи. Однако «как было возвещено их собранию» выбирает и грамматически развивает один спорный разбор заключительной конструкции, тогда как масоретское כְּשֵׁמַע לַעֲדָתָם буквально сохраняет неясную связь «слуха/вести» с собранием. «Взыскание» также скорее административно-карательное и не вполне передаёт обычный для יסר оттенок вразумляющего наказания.'
  naturalness: «Подвергну их взысканию» звучит канцелярски и тяжеловесно для пророческой речи. «Вразумлю их» — естественное современное литературное соответствие, которое может включать суровую дисциплину; карательное значение сохранено в сноске. «Согласно вести, сообщённой их собранию» достаточно ясно по-русски, при этом не превращает существительное «весть» в определённое содержание возвещения.
  terminology: «Вразумлю» хорошо передаёт יסר без конфессионального переосмысления. «Собрание» уместно для עֵדָה и не придаёт слову церковной окраски. «Низвергну» допустимо как поэтическое выражение хифиля ירד в контексте ловли птиц.
