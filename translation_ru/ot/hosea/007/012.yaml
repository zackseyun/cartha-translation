base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/012.yaml
  text: As they go[a], I will spread my net over them; like the birds of the heavens I will bring them down[b]. I will chasten them according to the report to their assembly.
translation:
  language: ru
  text: Когда они пойдут, Я раскину над ними Свою сеть; низвергну их, словно птиц небесных. Я вразумлю их[a] согласно вести, сообщённой их собранию[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «накажу их» или «подвергну их наказанию». Еврейский глагол может обозначать как исправительное вразумление, так и карательное наказание.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза трудна для истолкования. Возможны также переводы: «согласно тому, что было возвещено их собранию» или «как услышало их собрание».'
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר יֵלֵכוּ
  choice: Когда они пойдут
  rationale: כַּאֲשֶׁר вводит временное придаточное, а הלך обычно означает «идти». Перевод естественен по-русски и не уточняет направление их движения, которого нет в еврейском тексте.
- source_word: אֶפְרוֹשׂ עֲלֵיהֶם רִשְׁתִּי
  choice: Я раскину над ними Свою сеть
  rationale: Сочетание פרשׂ с רשת передаёт образ сети, раскинутой над добычей; «раскину над ними» сохраняет и действие, и значение предлога עַל.
- source_word: כְּעוֹף הַשָּׁמַיִם
  choice: словно птиц небесных
  rationale: Собирательное עוֹף естественно передаётся множественным числом. «Птиц небесных» сохраняет возвышенный образ исходного текста без тяжеловесности.
- source_word: אוֹרִידֵם
  choice: низвергну их
  rationale: Порода хифиль глагола ירד означает «заставить спуститься, низвести». «Низвергну» кратко и выразительно продолжает образ птиц, попавших в сеть.
- source_word: אַיְסִרֵם
  choice: подвергну их взысканию
  rationale: Глагол יסר может обозначать как исправительное вразумление, так и наказание. «Подвергну взысканию» сохраняет судебно-дисциплинарный оттенок и не сводит смысл исключительно к возмездию.
- source_word: כְּשֵׁמַע לַעֲדָתָם
  choice: как было возвещено их собранию
  rationale: 'Трудная конструкция передана естественно по-русски в соответствии с одним из вероятных разборов: שֵׁמַע связано с услышанным или возвещённым, а לַעֲדָתָם — с их собранием как адресатом. Неопределённость отмечена в сноске.'
theological_decisions:
- issue: Характер Божьего действия в אַיְסִרֵם
  choice: подвергну их взысканию
  alternative: накажу их; вразумлю их
  rationale: Еврейский יסר объединяет исправительное воздействие и наказание. Выбранная формулировка сохраняет напряжение между заветным вразумлением и судом, не ограничивая смысл одним из них.
- issue: Толкование трудной заключительной фразы כְּשֵׁמַע לַעֲדָתָם
  choice: как было возвещено их собранию
  alternative: согласно вести для их собрания; как услышало их собрание
  rationale: Синтаксис допускает несколько пониманий. В основном тексте дано ясное вероятное прочтение, а сноска сохраняет реальные альтернативы и не создаёт ложной определённости.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Образ сети и небесных птиц сохранён; синтаксическая трудность заключительной фразы не скрыта, но основной текст остаётся понятным обычному читателю.
