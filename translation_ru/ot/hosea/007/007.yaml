  variant: modern literary Russian
source:
  edition: WLC
  text: כֻּלָּ֤/ם יֵחַ֨מּוּ֙ כַּ/תַּנּ֔וּר וְ/אָכְל֖וּ אֶת שֹֽׁפְטֵי/הֶ֑ם כָּל מַלְכֵי/הֶ֣ם נָפָ֔לוּ אֵין קֹרֵ֥א בָ/הֶ֖ם אֵלָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/007.yaml
  text: All of them are hot like an oven[a], and they devour their judges; all their kings have fallen. None among them calls to me.
translation:
  language: ru
  text: Все они раскалены, как печь, и пожирают своих судей[a]. Все их цари пали; никто из них не взывает ко Мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих правителей». Древнееврейское слово может обозначать не только судей, но и представителей власти в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Все они
  rationale: Передаёт всеохватность обвинения и естественно звучит по-русски.
- source_word: יֵחַמּוּ
  choice: раскалены
  rationale: Сохраняет образ сильного жара в связи с печью, не уточняя, идёт ли речь о страсти, ярости или заговоре.
- source_word: כַּתַּנּוּר
  choice: как печь
  rationale: Прямо сохраняет повторяющийся в данном отрывке образ печи.
- source_word: וְאָכְלוּ
  choice: и пожирают
  rationale: Глагол буквально означает поедание; «пожирают» естественно передаёт метафору насильственного уничтожения. Настоящее время представляет это как характерное, повторяющееся действие в живом пророческом описании.
- source_word: אֶת שֹׁפְטֵיהֶם
  choice: своих судей
  rationale: «Судьи» — прямое значение слова; местоимение «своих» по-русски естественно указывает на принадлежность к той же группе. Более широкое политическое значение сохранено в сноске.
- source_word: כָּל מַלְכֵיהֶם נָפָלוּ
  choice: Все их цари пали
  rationale: Сохраняет повтор всеохватного כָּל и оставляет открытым, означает ли падение смерть, свержение или то и другое.
- source_word: אֵין קֹרֵא בָהֶם אֵלָי
  choice: никто из них не взывает ко Мне
  rationale: Передаёт отрицательную конструкцию и направленность обращения к Богу; «взывает» естественно выражает серьёзный призыв о помощи, не добавляя уточнений.
theological_decisions:
- issue: Следует ли прямо назвать страсть, обозначенную образом раскалённой печи
  choice: Сохранить образ жара без уточнения его нравственно-психологической природы
  alternative: «Все они пылают похотью, как печь» или «все они распалены яростью»
  rationale: Сам стих не называет конкретно ни похоть, ни ярость, хотя контекст допускает оттенки страсти и разрушительного заговора. Перевод сохраняет эту намеренную широту.
- issue: Следует ли понимать שֹׁפְטֵיהֶם узко как судей или шире как правителей
  choice: В основном тексте — «судей», более широкое значение — в сноске
  alternative: «своих правителей»
  rationale: Прямое лексическое значение — «судьи», однако в политическом контексте слово может обозначать представителей власти вообще.
- issue: Как передать временно-видовое соотношение יֵחַמּוּ и וְאָכְלוּ
  choice: Передать первые действия настоящим временем как живую характеристику, а итог падения царей — прошедшим
  alternative: «раскалились… пожрали… пали»
  rationale: Древнееврейские формы допускают рассмотрение первых действий как характерных или повторяющихся, тогда как נָפָלוּ подводит итог политическим падениям. Такое решение сохраняет напряжение между продолжающимся насилием и уже наступившим итогом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Краткие параллельные фразы сохраняют резкость обвинения; метафора печи и глагол «пожирают» оставлены без поясняющего истолкования в основном тексте.
