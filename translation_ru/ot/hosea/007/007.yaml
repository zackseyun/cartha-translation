  source_fidelity: 'Текст точно передаёт все основные элементы еврейского оригинала: всеохватность «Все они», образ жара печи без его интерпретационного сужения, насильственную метафору уничтожения судей, падение всех царей и отсутствие обращения к Богу. Настоящее время в первых двух глаголах и совершившееся «пали» допустимо передают пророческую динамику форм оригинала.'
