  text: יָשׁ֣וּבוּ לֹ֣א עָ֗ל הָיוּ֙ כְּ/קֶ֣שֶׁת רְמִיָּ֔ה יִפְּל֥וּ בַ/חֶ֛רֶב שָׂרֵי/הֶ֖ם מִ/זַּ֣עַם לְשׁוֹנָ֑/ם ז֥וֹ לַעְגָּ֖/ם בְּ/אֶ֥רֶץ מִצְרָֽיִם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/016.yaml
  text: They turn[a], but not upward; they are like a deceitful bow. Their princes will fall by the sword because of the insolence of their tongue[b]. This will be their mockery in the land of Egypt.
translation:
  language: ru
  text: Они обращаются, но не ввысь[a]; они — словно ненадёжный лук[b]. Их правители падут от меча из-за ярости их языка. Это будет им на посмешище в земле Египта.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но не к Всевышнему». Это толкование понимает «ввысь» как подразумеваемое указание на Бога под влиянием упоминания Всевышнего в предыдущем стихе.'
    reason: alternative_reading
  - marker: b
    text: 'Также возможно: «обманчивый», «коварный» или «неисправный лук» — лук, которому нельзя доверять и который не бьёт точно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשׁוּבוּ
  choice: обращаются
  rationale: Глагол שׁוב означает «поворачиваться, обращаться, возвращаться». Здесь речь идёт не просто о перемещении, а о нравственном обращении, поэтому выбрано «обращаются».
- source_word: לֹא עָל
  choice: но не ввысь
  rationale: 'Трудное еврейское выражение буквально указывает направление: «не вверх/ввысь». Перевод сохраняет эту недосказанность, не вставляя прямо отсутствующее здесь имя Бога.'
- source_word: כְּקֶשֶׁת רְמִיָּה
  choice: словно неверный лук
  rationale: רְמִיָּה передаёт обманчивость, ненадёжность или неисправность. «Неверный лук» естественно описывает оружие, которому нельзя доверять и которое не бьёт точно.
- source_word: יִפְּלוּ בַחֶרֶב
  choice: падут от меча
  rationale: Устойчивое библейское выражение о насильственной смерти или гибели в сражении.
- source_word: שָׂרֵיהֶם
  choice: их правители
  rationale: שַׂר может обозначать князя, вождя, начальника или сановника. «Правители» ясно и без излишне узкой монархической окраски передаёт политический статус.
- source_word: מִזַּעַם לְשׁוֹנָם
  choice: за ярость своего языка
  rationale: זַעַם означает ярость, негодование или гнев. Образ «ярости языка» сохраняет резкость и образность оригинала и указывает на их дерзкую, враждебную речь.
- source_word: זֹו לַעְגָּם
  choice: за это над ними будут смеяться
  rationale: Буквально выражение близко к «это — их посмеяние». Русская результативная конструкция ясно передаёт, что названная кара сделает их предметом насмешек.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: в земле Египетской
  rationale: Сохранена полная формула оригинала и её торжественно-пророческое звучание.
theological_decisions:
- issue: Толкование לֹא עָל
  choice: 'В основном тексте: «но не ввысь»'
  alternative: «но не к Всевышнему»
  rationale: В данном стихе слово «Всевышний» прямо не употреблено, хотя такое понимание возможно под влиянием предыдущего стиха. Основной текст сохраняет буквальную направленность и неоднозначность, а богословски значимое прочтение вынесено в сноску.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; образы «не ввысь», «неверный лук» и «ярость языка» сохранены. Все маркеры сносок присутствуют в основном тексте.
