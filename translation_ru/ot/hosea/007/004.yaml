  text: כֻּלָּ/ם֙ מְנָ֣אֲפִ֔ים כְּמ֣וֹ תַנּ֔וּר בֹּעֵ֖רָה מֵֽ/אֹפֶ֑ה יִשְׁבּ֣וֹת מֵעִ֔יר מִ/לּ֥וּשׁ בָּצֵ֖ק עַד חֻמְצָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/004.yaml
  text: All of them are adulterers[a], like an oven heated by a baker[c][b], who stops stirring from the kneading of the dough until its leavening.
translation:
  language: ru
  text: Все они — прелюбодеи, словно печь, раскалённая пекарем[a]. Он перестаёт поддерживать огонь[b] с момента замешивания теста и до тех пор, пока оно не заквасится[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пылающая благодаря пекарю». Еврейское причастие может подчёркивать, что печь активно горит.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское выражение трудно для перевода; буквально глагол означает «будить» или «побуждать». Возможно: «перестаёт ворошить огонь», «разжигать его» или «поддерживать жар».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «пока оно не поднимется». Еврейское слово обозначает заквашивание или брожение теста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: Все они
  rationale: Передаёт всеохватность и эмфатический характер выражения естественным современным русским языком.
- source_word: מְנָאֲפִים
  choice: прелюбодеи
  rationale: Причастие употреблено субстантивированно во множественном числе. Конкретный нравственный термин сохранён без истолковывающего добавления о заветной неверности.
- source_word: כְּמוֹ תַנּוּר
  choice: словно печь
  rationale: Сравнительная частица и бытовой образ печи переданы прямо; «печь» здесь уместнее, чем «горнило».
- source_word: בֹּעֵרָה מֵאֹפֶה
  choice: раскалённая пекарем
  rationale: Передаёт сильный жар печи и наиболее вероятное значение מִן как указания на деятеля; формулировка естественна в контексте выпечки.
- source_word: יִשְׁבּוֹת מֵעִיר
  choice: перестаёт раздувать огонь
  rationale: יִשְׁבּוֹת означает прекращение действия, а трудное מֵעִיר в образе печи вероятнее всего относится к поддержанию или усилению огня. Дополнение «огонь» эксплицирует подразумеваемый объект.
- source_word: מִלּוּשׁ בָּצֵק
  choice: Замесив тесто
  rationale: Естественно выражает начальную точку периода, в течение которого пекарь не поддерживает огонь, не утяжеляя русский текст буквальным «от замеса».
- source_word: עַד חֻמְצָתוֹ
  choice: пока тесто не заквасится
  rationale: Глагольная конструкция ясно передаёт процесс брожения или заквашивания теста и временной предел, обозначенный עַד.
theological_decisions:
- issue: Следует ли раскрывать «прелюбодеи» как обозначение духовной или заветной неверности
  choice: Оставить «прелюбодеи» без поясняющего расширения в основном тексте
  alternative: «неверные Богу, словно прелюбодеи» или «духовные прелюбодеи»
  rationale: У Осии образ прелюбодеяния часто связан с нарушением завета, однако сам стих сохраняет конкретный термин. Перевод не должен устранять намеренную образность и богословское напряжение.
- issue: Активный или результативный оттенок בֹּעֵרָה
  choice: 'Передать результативно: «раскалённая»'
  alternative: «пылающая» или «горящая»
  rationale: В контексте выпечки главное — сильный жар печи, но причастие может также подчёркивать её активное горение; эта возможность сохранена в примечании.
translation_notes:
  register: 'Современный литературный русский язык с кратким, напряжённым пророческим образом. Синтаксис второй фразы слегка прояснён: подразумеваемый пекарь назван местоимением, а подразумеваемый объект трудного глагола передан как «огонь». Все смысловые альтернативы, существенно влияющие на образ, вынесены в примечания.'
