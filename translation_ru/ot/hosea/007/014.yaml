base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/014.yaml
  text: They do not cry out to me from their heart[a], but they wail on their beds; for grain and new wine they gather themselves; they turn away from me.
translation:
  language: ru
  text: 'Они не взывают ко Мне от всего сердца,

    а стенают на своих ложах;

    ради зерна и молодого вина они сходятся[a]

    и отступают от Меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский глагол труден для понимания. Возможно также: «ради зерна и молодого вина они наносят себе порезы».'
    reason: alternative_reading
lexical_decisions:
- source_word: זָעֲקוּ אֵלַי בְּלִבָּם
  choice: взывают ко Мне от всего сердца
  rationale: «Взывать» передаёт сильный крик о помощи, а «от всего сердца» естественно выражает искреннюю внутреннюю обращённость, противопоставленную внешнему плачу.
- source_word: כִּי יְיֵלִילוּ
  choice: а стенают
  rationale: В данном контексте כִּי имеет противопоставительный оттенок; «стенают» передаёт громкий скорбный плач без излишне зооморфного оттенка слова «воют».
- source_word: עַל מִשְׁכְּבוֹתָם
  choice: на своих ложах
  rationale: Сохраняется конкретный образ еврейского текста; «ложах» придаёт строке dignified библейское звучание, оставаясь понятным современному читателю.
- source_word: דָּגָן וְתִירוֹשׁ
  choice: зерна и молодого вина
  rationale: דָּגָן обозначает зерно, а תִּירוֹשׁ — молодое, свежее вино в земледельческом контексте.
- source_word: יִתְגּוֹרָרוּ
  choice: собираются
  rationale: Масоретскую форму естественно понимать как обозначение совместного собирания. Поскольку глагол труден и допускает понимание как ритуального нанесения себе порезов, альтернативу следует сохранить в примечании.
- source_word: יָסוּרוּ בִי
  choice: отступают от Меня
  rationale: Передаёт направленное против Бога уклонение и нарушение верности, не усиливая выражение до однозначного «восстают».
theological_decisions:
- issue: Толкование יִתְגּוֹרָרוּ
  choice: они собираются ради зерна и молодого вина
  alternative: они наносят себе порезы ради зерна и молодого вина
  rationale: 'Форма трудна: масоретский текст позволяет связать её с собиранием, тогда как древние версии и часть толкователей видят здесь ритуальное самоповреждение. Основной текст следует непосредственно данной еврейской форме, а значимая культовая интерпретация сохраняется в примечании.'
- issue: Характер обращения народа к Богу
  choice: сохранено противопоставление искреннего сердечного взывания внешнему стенанию ради материальных благ
  alternative: явно назвать поведение идолопоклонством или лицемерием
  rationale: Контекст допускает такую богословскую оценку, но сам стих выражает её образами и противопоставлением, поэтому перевод не добавляет прямого доктринального определения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Синтаксический параллелизм и контраст строк сохранены; редкое, но понятное слово «ложах» поддерживает достоинство пророческой речи.
