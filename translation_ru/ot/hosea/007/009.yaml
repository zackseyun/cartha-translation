  variant: modern literary Russian
source:
  edition: WLC
  text: אָכְל֤וּ זָרִים֙ כֹּח֔/וֹ וְ/ה֖וּא לֹ֣א יָדָ֑ע גַּם שֵׂיבָה֙ זָ֣רְקָה בּ֔/וֹ וְ/ה֖וּא לֹ֥א יָדָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/009.yaml
  text: Strangers have devoured his strength[a], but he does not know it; even gray hair is sprinkled on him[b], but he does not know it.
translation:
  language: ru
  text: Чужеземцы пожрали его силу[a], а он этого не знает; даже седина проступила у него[b], а он этого не знает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иноземцы истощили его силу».'
    reason: Лексический вариант, поясняющий переносное значение глагола אכל и возможный перевод זָרִים.
  - marker: b
    text: 'Буквально: «седина рассеялась по нему» — образ старения и упадка.'
    reason: Пояснение буквального образа исходного выражения, сглаженного ради естественности русского текста.
lexical_decisions:
- source_word: אָכְלוּ
  choice: пожрали
  rationale: Форма qal перфекта 3-го лица множественного числа от אכל; в переносном смысле обозначает истощение сил и средств. «Пожрали» сохраняет резкость и образность исходного глагола.
- source_word: זָרִים
  choice: чужеземцы
  rationale: В контексте речь идёт о внешних народах или иноземных силах, истощающих Израиль; «чужеземцы» передаёт это точнее, чем общее «чужие».
- source_word: כֹּחוֹ
  choice: его силу
  rationale: כֹּחַ означает силу, мощь или способность. «Силу» сохраняет широкий смысл и не сужает его до одной лишь военной мощи.
- source_word: וְהוּא לֹא יָדָע
  choice: а он этого не знает
  rationale: Повторённая формула подчёркивает неосознанность упадка. Союз «а» естественно передаёт контраст, а местоимение «этого» восполняет подразумеваемый объект.
- source_word: גַּם
  choice: даже
  rationale: Частица усиливает второй образ, показывая дальнейший признак упадка.
- source_word: שֵׂיבָה
  choice: седина
  rationale: Существительное обозначает седину или седые волосы. «Седина» сохраняет конкретный образ старения и естественно звучит по-русски.
- source_word: זָרְקָה
  choice: проступила
  rationale: Буквально глагол передаёт разбрасывание или рассеивание. В сочетании с сединой буквальный образ необычен для русского; «проступила» естественно изображает появление рассеянных седых волос, а буквальность отмечена в сноске.
- source_word: בּוֹ
  choice: у него
  rationale: В русском сочетание «седина проступила у него» естественно передаёт появление седины на человеке, не меняя образа.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением краткости, параллелизма и резкого пророческого образа. Повтор «а он этого не знает» оставлен без стилистического варьирования ради риторического акцента оригинала.
