source:
  edition: WLC
  text: וַ/יְהִ֣י אֶפְרַ֔יִם כְּ/יוֹנָ֥ה פוֹתָ֖ה אֵ֣ין לֵ֑ב מִצְרַ֥יִם קָרָ֖אוּ אַשּׁ֥וּר הָלָֽכוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/011.yaml
  text: Ephraim has become like a silly dove[a], without sense; they call to Egypt, they go to Assyria.
translation:
  language: ru
  text: 'Ефрем стал словно легковерный голубь, без рассудка[a]: они обращаются к Египту, идут в Ассирию.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «без сердца». В библейском иврите сердце может обозначать разумение и способность здраво судить.'
    reason: Лексическая идиома и сохранение буквального образа оригинала.
lexical_decisions:
- source_word: וַיְהִי
  choice: стал
  rationale: Форма от היה с последовательным союзом описывает наступившее состояние Ефрема; русское «стал» естественно передаёт это изменение.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено прямо названное в тексте имя, хотя в книге Осии оно часто метонимически обозначает всё северное царство.
- source_word: כְּיוֹנָה
  choice: словно … голубь
  rationale: «Голубь» — обычное и естественное соответствие יוֹנָה; «словно» ясно вводит сравнение.
- source_word: פוֹתָה
  choice: легковерный
  rationale: Слово выражает наивность, податливость обману и отсутствие проницательности. «Легковерный» точнее передаёт этот оттенок, чем просто «глупый».
- source_word: אֵין לֵב
  choice: без рассудка
  rationale: Буквально выражение означает «нет сердца», но לֵב здесь обозначает разумение и способность здраво судить. Идиоматический русский перевод вынесен в основной текст, а буквальный образ отмечен в сноске.
- source_word: מִצְרַיִם קָרָאוּ
  choice: они обращаются к Египту
  rationale: קרא в данном политическом контексте означает обращение или призыв в поисках содействия. Эта формулировка естественна по-русски и не добавляет прямо отсутствующих слов «за помощью».
- source_word: אַשּׁוּר הָלָכוּ
  choice: идут в Ассирию
  rationale: Глагол движения передан настоящим временем как живое описание повторяющейся политической линии; название государства дано в общепринятой русской форме.
theological_decisions:
- issue: Ефрем как коллективный субъект
  choice: 'Имя «Ефрем» сохранено, а последующие глаголы переданы во множественном числе: «они обращаются… идут».'
  alternative: Заменить «Ефрем» на «Израиль» или согласовать всё в единственном числе.
  rationale: Еврейский текст прямо называет Ефрема, затем переходит к формам множественного числа, раскрывая его как коллектив — северное царство. Смена числа сохранена, а не сглажена.
- issue: Характер обращения к Египту и Ассирии
  choice: Передано как политическое обращение к Египту и движение в Ассирию без уточнения цели.
  alternative: Добавить «зовут на помощь Египет» или «ищут помощи у Египта и Ассирии».
  rationale: Контекст предполагает поиск внешнеполитической поддержки, однако сам стих не называет помощь прямо; перевод не делает подразумеваемую цель частью основного текста.
translation_notes:
  register: Современный литературный русский язык с кратким пророческим ритмом. «Легковерный» сохраняет обличительный смысл без разговорной грубости; двоеточие подчёркивает, как последующие действия проявляют отсутствие рассудка.
