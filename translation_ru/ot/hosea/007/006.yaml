base_translation:
  language: en
  yaml_path: translation/ot/hosea/007/006.yaml
  text: For they draw near with their hearts like an oven in their lying in wait[a]; all night their baker sleeps[b], but in the morning it burns like a flaming fire.
translation:
  language: ru
  text: Ибо они приближаются; их сердца — словно печь, когда они таятся в засаде[a]. Всю ночь их пекарь спит[b], а утром она пылает, как пылающий огонь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в своей засаде»; еврейское выражение означает, что они подстерегают, таятся или готовят нападение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их пекарь». В развёрнутом образе печи так может быть назван тот, кто поддерживает жар или разжигает их замысел.'
    reason: cultural_note
lexical_decisions:
- source_word: קֵרְבוּ
  choice: они приближаются
  rationale: Форма от קרב передаёт приближение к действию; дополнение в еврейском тексте не выражено, поэтому оно не добавлено и в переводе.
- source_word: כַתַּנּוּר
  choice: словно печь
  rationale: Сохраняется явное сравнение и сквозной образ раскалённой печи.
- source_word: לִבָּם
  choice: их сердца
  rationale: Еврейское слово стоит в единственном числе с суффиксом множественного числа и может иметь собирательное значение; по-русски множественное число естественно согласуется с группой заговорщиков.
- source_word: בְּאָרְבָּם
  choice: когда они таятся в засаде
  rationale: ארב означает подстерегать, таиться или устраивать засаду; придаточная конструкция ясно и естественно передаёт обстоятельство скрытого заговора.
- source_word: יָשֵׁן
  choice: спит
  rationale: Простая глагольная форма естественно передаёт состояние в течение всей ночи.
- source_word: אֹפֵהֶם
  choice: их пекарь
  rationale: Буквальный образ сохранён как часть развёрнутой метафоры печи; возможный переносный смысл пояснён в сноске.
- source_word: בֹעֵר
  choice: пылает
  rationale: Глагол передаёт интенсивное горение и естественно сочетается с образом огня и пламени.
- source_word: כְאֵשׁ לֶהָבָה
  choice: как огонь, охваченный пламенем
  rationale: Формулировка сохраняет усиленное сочетание образов огня и пламени, не сводя их к одному слову.
theological_decisions:
- issue: Субъект и действующее лицо в метафоре печи
  choice: Сердца заговорщиков уподоблены печи, а «их пекарь» оставлен как самостоятельный элемент метафоры.
  alternative: Можно понимать «пекаря» как того, кто разжигает их страсть или заговор, либо иначе связывать сжатые части еврейской фразы.
  rationale: Синтаксис стиха сжат и допускает разные способы соотнести образы. Перевод сохраняет метафорическую напряжённость и не уточняет личность «пекаря» без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с сохранением сжатой пророческой образности. Точка с запятой помогает передать трудный синтаксический переход, не вводя отсутствующего в источнике дополнения к глаголу «приближаются».
