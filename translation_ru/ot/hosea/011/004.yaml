base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/004.yaml
  text: I drew them with cords of a man[a], with ropes of love; and I was to them like those who lift a yoke from their jaws[b], and I bent down to him and fed him.
translation:
  language: ru
  text: Я влёк их человеческими узами[a], верёвками любви; я был для них как те, кто снимает ярмо с их челюстей, и склонился к нему и накормил его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «узами человека»; выражение может указывать на человеческое, мягкое обращение.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст переходит здесь от множественного числа к единственному: «к нему… накормил его». Во многих переводах этот переход сглажен: «к ним… накормил их».'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּחַבְלֵי אָדָם
  choice: человеческими узами
  rationale: Сочетание буквально допускает «узами человека», но в данном образе אָדָם, вероятно, характеризует обращение как человеческое, гуманное и мягкое, в противоположность грубому обращению с животным. «Узы» сохраняют метафору и поэтическое достоинство.
- source_word: אֶמְשְׁכֵם
  choice: Я влёк их
  rationale: משך означает тянуть, влечь. «Влёк» сохраняет одновременно физический образ уз и смысл притягивающей любви.
- source_word: בַּעֲבֹתוֹת אַהֲבָה
  choice: путами любви
  rationale: עֲבֹתוֹת обозначает толстые верёвки или путы. «Путами» отличает это слово от חַבְלֵי и естественно передаёт поэтический параллелизм.
- source_word: וָאֶהְיֶה לָהֶם
  choice: Я был для них
  rationale: Прямая и естественная передача связочной конструкции перед сравнением.
- source_word: כִּמְרִימֵי עֹל
  choice: как те, кто приподнимает ярмо
  rationale: Сохраняется необычное причастие во множественном числе и не устраняется неопределённость образа.
- source_word: עַל לְחֵיהֶם
  choice: над их челюстями
  rationale: לְחִי может означать щёку или челюсть. В образе тяглового животного «челюсти» конкретнее; עַל передано как «над», поскольку речь идёт о приподнимании ярма, хотя возможен смысл снятия его с челюстей.
- source_word: וְאַט אֵלָיו
  choice: Я склонился к нему
  rationale: Передаёт движение вниз и сохраняет единственное число местоименного суффикса אֵלָיו.
- source_word: אוֹכִיל
  choice: накормил его
  rationale: Порода hifil глагола אכל означает «дать есть, накормить»; единственное число дополнения следует масоретскому тексту и предыдущему אֵלָיו.
theological_decisions:
- issue: Антропоморфный и пастушеский образ Божьей заботы
  choice: 'Сохранены конкретные действия: влечь узами, приподнимать ярмо, склоняться и кормить.'
  alternative: Передать образ отвлечённо как доброе водительство и обеспечение Израиля.
  rationale: Еврейский текст соединяет нежность и власть Бога в ярком образе ухода за животным; отвлечённая передача ослабила бы эту напряжённость.
- issue: Переход от множественного числа к единственному в אֵלָיו
  choice: Сохранено «к нему… его».
  alternative: 'Согласовать с предшествующим множественным числом: «к ним… их».'
  rationale: Масоретский текст явно переходит к единственному числу, возможно представляя Израиль как единое лицо или сына; перевод не должен молча сглаживать этот переход.
translation_notes:
  register: Современный литературный русский язык с поэтической сдержанностью. «Влёк», «узы» и «путы» слегка возвышенны, но понятны и соответствуют пророческой образности. Синтаксис разделён на два предложения для ясности; подлинный переход числа сохранён и пояснён в сноске.
