  yaml_path: translation/ot/hosea/011/010.yaml
  text: They will walk after Yahweh[a]; he will roar like a lion. For he himself will roar[b], and sons will come trembling from the west.
translation:
  language: ru
  text: Они пойдут вслед за Яхве; Он зарычит, как лев, ибо Он Сам зарычит, и сыновья придут с запада[a], трепеща.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от моря». Здесь море, вероятно, обозначает запад как географическое направление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה יֵלְכוּ
  choice: пойдут вслед за Яхве
  rationale: Сочетание אַחֲרֵי с הלך означает движение вслед за кем-либо и одновременно допускает смысл возвращения к верности. «Пойдут вслед за» сохраняет образ исходного текста естественнее, чем буквальное «будут ходить после».
- source_word: כְּאַרְיֵה יִשְׁאָג
  choice: зарычит, как лев
  rationale: שאג — обычный глагол для львиного рыка; совершенный вид будущего времени естественно передаёт единичный призывный рык в данном контексте.
- source_word: כִּי הוּא יִשְׁאַג
  choice: Когда Он зарычит
  rationale: כִּי допускает причинное, временное и эмфатическое прочтение. В контексте последующего отклика сыновей временное «когда» естественно связывает рык с их приходом; отдельное הוּא сохраняется явным местоимением, но без искусственного усиления «Сам».
- source_word: וְיֶחֶרְדוּ
  choice: трепеща, придут
  rationale: חרד буквально передаёт дрожь от страха или благоговения; контекст возвращения и указание исходной точки מִיָּם подразумевают движение. Формулировка сохраняет и трепет, и контекстуальный приход, не добавляя отсутствующего в еврейском тексте направления «к Нему».
- source_word: בָנִים
  choice: сыновья
  rationale: Сохранён грамматически мужской plural «сыновья»; более широкое «дети» возможно как коллективное значение, но менее буквально.
- source_word: מִיָּם
  choice: с запада
  rationale: Буквально «от моря»; в библейской географической ориентации море обозначает запад. Основной текст передаёт вероятное направительное значение, а буквальная форма отмечена в сноске.
theological_decisions:
- issue: Характер отклика на львиный рык Яхве
  choice: Сыновья возвращаются, трепеща, в ответ на Божий призыв.
  alternative: Глагол можно передать только как «вострепещут», не выражая движения возвращения.
  rationale: Контекст Ос 11:8–11 и исходная точка «с запада» поддерживают подразумеваемое движение, однако перевод не добавляет прямого дополнения «к Нему», которого нет в тексте.
- issue: Значение союза כִּי перед повторением рыка
  choice: 'Временное: «Когда Он зарычит».'
  alternative: 'Причинное: «Ибо Он зарычит»; возможно также эмфатическое «Да, Он зарычит».'
  rationale: Временная связь по-русски ясно передаёт последовательность призыва и ответа, но исходный союз неоднозначен, поэтому причинно-эмфатический оттенок не следует считать исключённым.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Божественное имя передано как «Яхве». Прописное «Он» следует принятой русской благоговейной письменной традиции, не добавляя отдельного титула.
