base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/007.yaml
  text: My people are bent on turning away from me[a]; though they call to the Most High[b], together he does not lift them up.
translation:
  language: ru
  text: Мой народ упорно склонен к отступничеству от Меня[a]. Хотя они взывают к Всевышнему, Он вовсе не поднимает их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может означать «отступничество» или «уклонение». Буквальное значение конструкции с суффиксом первого лица («моё отступление») синтаксически трудно; в контексте речь идёт об отступлении народа от Бога.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Все вместе они не превозносят Его»; возможно также: «Никто не превозносит Его». Еврейский текст заключительной части стиха допускает разные толкования.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּי
  choice: Мой народ
  rationale: Сохраняет суффикс 1-го лица и заветный, а не преимущественно политический смысл עַם в книге Осии.
- source_word: תְלוּאִים
  choice: упорно стремится
  rationale: Причастие буквально связано с идеей подвешенности или привязанности; в данном контексте оно выражает устойчивую, упрямую склонность народа к отступлению.
- source_word: לִמְשׁוּבָתִי
  choice: отступить от Меня
  rationale: מְשׁוּבָה обозначает отступничество или уклонение. Несмотря на трудную конструкцию с суффиксом 1-го лица, контекст указывает на отступление народа от Бога. Глагольная формулировка естественна для современного русского языка.
- source_word: וְאֶל־עַל
  choice: Хотя ... к Всевышнему
  rationale: עַל в этом трудном выражении понимается субстантивированно как «Всевышний»; союз передан уступительно, поскольку последующая строка противопоставляет взыванию отсутствие возвышения или избавления.
- source_word: יִקְרָאֻהוּ
  choice: они взывают
  rationale: Форма 3-го лица множественного числа с местоименным суффиксом передаёт обращение к Нему; по-русски адресат естественно выражен сочетанием «взывают к Всевышнему».
- source_word: יַחַד
  choice: вовсе
  rationale: В трудной заключительной строке יחד можно понимать не только как «вместе», но и усилительно — «совсем, вообще». «Вовсе» позволяет избежать русского смысла «не поднимает всех разом, но, возможно, по одному».
- source_word: לֹא יְרוֹמֵם
  choice: Он ... не поднимает их
  rationale: רוּם может означать «поднимать» или «возвышать». В основном тексте субъектом признан Всевышний, а подразумеваемым объектом — народ; это соответствует контексту неоказанной помощи, при этом альтернативный синтаксический разбор указан в сноске.
theological_decisions:
- issue: Толкование трудной заключительной строки יַחַד לֹא יְרוֹמֵם
  choice: 'Субъект — Всевышний: несмотря на взывание народа, Он не поднимает их.'
  alternative: «Все вместе они не превозносят Его» или «никто не превозносит Его».
  rationale: Сжатый еврейский синтаксис допускает как смысл отсутствия Божьей помощи, так и смысл отказа Израиля превозносить Бога. Уступительный контраст в контексте благоприятствует первому прочтению, но подлинная неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с пророческой серьёзностью. Единственное число «народ ... стремится» согласовано по-русски, а последующее «они» передаёт множественное число еврейского сказуемого и собирательность народа. Заглавные местоимения в отношении Бога использованы последовательно в пределах стиха.
