  source_fidelity: Начальное יֶחֶרְדוּ прежде всего означает «будут трепетать/задрожат»; в данном образном контексте оно может подразумевать движение, что отражено также в английском аудите. Однако «прилетят» добавляет конкретный способ передвижения, которого глагол не выражает. «Придут с трепетом» передаёт контекстуально вероятное приближение, не уточняя его как полёт. Каузативное «поселю» и «в их домах» верно передают וְהוֹשַׁבְתִּים עַל־בָּתֵּיהֶם.
  naturalness: «Они, трепеща, прилетят» стилистически тяжеловесно, а «прилетят» чрезмерно конкретно. «Они придут с трепетом» — естественная современная литературная конструкция. Повтор «в их домах» допустим ради ясного сохранения притяжательного суффикса и не требует изменения.
  terminology: «Яхве» последовательно передаёт тетраграмматон. «Возвещает Яхве» уместно для пророческой формулы. Названия «Египет» и «Ассирия», а также образы «птица» и «голубь» переданы верно; единственное число сохраняет общий характер еврейских сравнений.
