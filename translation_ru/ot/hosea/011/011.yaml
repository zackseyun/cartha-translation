base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/011.yaml
  text: They will come trembling like a bird from Egypt[a], and like a dove from the land of Assyria; and I will settle them in their homes, declares Yahweh.
translation:
  language: ru
  text: Они придут с трепетом, как птица из Египта[a] и как голубь из земли Ассирии; Я поселю их в их домах, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Они будут трепетать, как птица из Египта… и как голубь из земли Ассирии». Еврейский глагол может подчёркивать сам трепет; в данном контексте он, вероятно, также подразумевает приближение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֶרְדוּ
  choice: трепеща, прилетят
  rationale: Глагол חרד прежде всего выражает трепет, дрожь или испуганное движение. В контексте возвращения и образов птицы и голубя естественная русская передача «трепеща, прилетят» сохраняет как трепет, так и подразумеваемое движение, не превращая последнее в самостоятельное значение глагола.
- source_word: כְצִפּוֹר
  choice: как птица
  rationale: צִפּוֹר — общее обозначение птицы, часто небольшой; конкретизация «воробей» текстом не требуется.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Прямая передача географического исходного пункта.
- source_word: וּכְיוֹנָה
  choice: и как голубь
  rationale: יוֹנָה обычно обозначает голубя; этот образ также согласуется с образностью книги Осии.
- source_word: מֵאֶרֶץ אַשּׁוּר
  choice: из земли Ассирии
  rationale: Сохраняется явно выраженное в еврейском тексте слово אֶרֶץ «земля».
- source_word: וְהוֹשַׁבְתִּים
  choice: Я поселю их
  rationale: Каузативная форма от ישב означает «дать жить, поселить»; выбранная формулировка естественна по-русски и сохраняет каузативный смысл.
- source_word: עַל בָּתֵּיהֶם
  choice: в их домах
  rationale: При глаголе проживания предлог עַל здесь идиоматически передаёт место устойчивого обитания; буквальное «на их домах» по-русски исказило бы смысл.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Торжественная пророческая формула передана современно и достойно; личное имя יְהוָה транслитерировано как «Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В тексте прямо стоит тетраграмматон — личное имя Бога. Передача «Яхве» сохраняет различие между именем и титулом.
- issue: Оттенок восстановления в заключительной фразе
  choice: Я поселю их в их домах
  alternative: Я возвращу их в их дома
  rationale: Контекст говорит о восстановлении после рассеяния, однако сам глагол означает «поселить», а не прямо «вернуть»; выбранная передача не добавляет отсутствующего компонента.
- issue: Движение в глаголе יֶחֶרְדוּ
  choice: трепеща, прилетят
  alternative: будут трепетать
  rationale: Сам глагол подчёркивает трепет, тогда как движение подразумевается контекстом исхода из Египта и Ассирии и сравнением с птицами. Перевод сохраняет оба аспекта, а примечание отмечает более формальную возможность.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для пророческой речи. «Прилетят» естественно поддерживает двойной образ птицы и голубя; необычная семантическая напряжённость между трепетом и движением сохранена в тексте и пояснена в сноске.
