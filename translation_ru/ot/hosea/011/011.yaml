revisions:
- from: Они, трепеща, прилетят, как птица из Египта[a] и как голубь из земли Ассирии. Я поселю их в их домах, — возвещает Яхве.
  to: Они придут с трепетом, как птица из Египта[a] и как голубь из земли Ассирии; Я поселю их в их домах, — возвещает Яхве.
