  text: וְ/אָנֹכִ֤י תִרְגַּ֨לְתִּי֙ לְ/אֶפְרַ֔יִם קָחָ֖/ם עַל זְרֽוֹעֹתָ֑י/ו וְ/לֹ֥א יָדְע֖וּ כִּ֥י רְפָאתִֽי/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/003.yaml
  text: Yet it was I who taught Ephraim to walk[a], taking them in my arms, but they did not know that I healed them.
translation:
  language: ru
  text: А ведь это Я учил Ефрема ходить, брал их на руки[a], но они не знали, что Я исцелил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В масоретском тексте здесь стоят формы третьего лица: «он брал их на свои руки». Эта формулировка трудна в контексте речи Господа от первого лица; многие понимают её по смыслу как продолжение Его слов: «Я брал их на руки».'
    reason: textual_variant
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: А ведь это Я
  rationale: Усиленное местоимение אָנֹכִי подчёркивает личность говорящего; сочетание «а ведь это Я» естественно передаёт и противопоставление, и эмфазу.
- source_word: תִרְגַּלְתִּי לְאֶפְרַיִם
  choice: учил Ефрема ходить
  rationale: Глагол от רגל в данной породе обозначает обучение ребёнка ходьбе. Дательный показатель ל естественно включён в русскую конструкцию с прямым дополнением.
- source_word: קָחָם עַל זְרוֹעֹתָיו
  choice: брал их на руки
  rationale: Русское «брать на руки» естественно сохраняет образ родительской заботы. В основном тексте сохранена связность речи от первого лица, а необычные формы третьего лица в масоретском тексте отмечены в сноске.
- source_word: וְלֹא יָדְעוּ
  choice: но они не знали
  rationale: Союз передан как «но», поскольку здесь выражено противопоставление между Божьей заботой и неспособностью народа её распознать.
- source_word: כִּי רְפָאתִים
  choice: что Я исцелил их
  rationale: רפא имеет основное значение «исцелять»; прошедшее совершенного вида прямо передаёт форму перфекта и сохраняет конкретную метафору исцеления.
theological_decisions:
- issue: Антропоморфный образ родительской заботы Бога
  choice: 'Сохранить конкретный образ: Бог учит Ефрема ходить и берёт его народ на руки.'
  alternative: Обобщить образ как заботу или водительство Бога.
  rationale: Еврейский текст изображает близкую родительскую заботу; её не следует ослаблять отвлечённой формулировкой.
- issue: Переход к формам третьего лица в средней части масоретского текста
  choice: В основном тексте продолжить речь Бога от первого лица, отметив масоретскую форму в сноске.
  alternative: 'Передать буквально: «он брал их на свои руки».'
  rationale: Весь стих обрамлён речью Бога от первого лица, однако подлинная грамматическая трудность масоретского текста не устраняется молча, а документируется в сноске.
translation_notes:
  register: Современный литературный русский язык; тон тёплый и достойный. «Брать на руки» — естественное русское выражение, ясно передающее заботу о маленьком ребёнке. Собирательное имя «Ефрем» далее соотнесено с множественным числом «их/они», как и в еврейском тексте.
