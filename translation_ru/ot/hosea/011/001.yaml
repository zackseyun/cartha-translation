base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/001.yaml
  text: When Israel was a child[a], I loved him, and out of Egypt I called my son.
translation:
  language: ru
  text: Когда Израиль был ребёнком[a], Я любил его и из Египта призвал Моего сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ибо Израиль был отроком, и Я любил его». Начальное еврейское слово допускает как причинное («ибо», «потому что»), так и временное («когда») понимание; временное лучше соответствует воспоминанию о прошлом в этом стихе. Слова «из Египта призвал Моего сына» позднее цитируются в Евангелии от Матфея 2:15.'
    reason: Сохраняет смысловую неоднозначность כִּי и отмечает важную межтекстовую связь.
lexical_decisions:
- source_word: כִּי
  choice: Когда
  rationale: В данном контексте союз естественно вводит временно-обстоятельственное придаточное и соответствует ретроспективному рассказу; причинное значение «ибо/потому что» сохраняется в примечании как реальная возможность.
- source_word: נַעַר
  choice: ребёнком
  rationale: Слово может обозначать мальчика, юношу или молодого слугу. Здесь образ раннего возраста Израиля как сына лучше всего передаётся нейтральным словом «ребёнок», без излишнего уточнения возраста.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохраняется общепринятое русское написание имени; народ олицетворён как одно лицо.
- source_word: וָאֹהֲבֵהוּ
  choice: Я любил его
  rationale: Форма первого лица единственного числа с местоименным суффиксом мужского рода относится к олицетворённому Израилю. Несовершенный вид «любил» не привносит дополнительного оттенка начала любви, которого глагольная форма сама по себе не требует.
- source_word: וּמִמִּצְרַיִם
  choice: и из Египта
  rationale: Предлог מִן обозначает исходную точку; «из Египта» естественно по-русски и сохраняет связь с исходом.
- source_word: קָרָאתִי
  choice: призвал
  rationale: Глагол קרא может означать «звать, призывать». «Призвал» здесь естественно выражает властный зов Бога, не добавляя идеи, которой нет в еврейском тексте.
- source_word: לִבְנִי
  choice: Моего сына
  rationale: При קרא предлог לְ может указывать на того, кого зовут. В русском языке эта конструкция естественно передаётся прямым дополнением; сохраняется сыновний образ Израиля.
theological_decisions:
- issue: Израиль как собирательный «сын» и последующее христологическое применение
  choice: 'Основной текст передаёт непосредственный смысл Осии: олицетворённый народ Израиля назван Божьим сыном в связи с исходом.'
  alternative: Сформулировать стих как исключительно прямое мессианское предсказание.
  rationale: Историко-литературный контекст Осии указывает на Израиль и исход. Цитирование в Матфея 2:15 отмечается в сноске, однако не подменяет непосредственный смысл еврейского текста.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным звучанием. «Ребёнком» доступнее и нейтральнее архаичного «отроком»; последнее сохранено в сноске как допустимый вариант. Заглавные буквы в местоимении «Я» и сочетании «Моего сына» отражают принятую русскую библейскую издательскую практику, не меняя смысла исходного текста.
