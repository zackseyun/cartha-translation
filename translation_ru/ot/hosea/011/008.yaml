  text: אֵ֞יךְ אֶתֶּנְ/ךָ֣ אֶפְרַ֗יִם אֲמַגֶּנְ/ךָ֙ יִשְׂרָאֵ֔ל אֵ֚יךְ אֶתֶּנְ/ךָ֣ כְ/אַדְמָ֔ה אֲשִֽׂימְ/ךָ֖ כִּ/צְבֹאיִ֑ם נֶהְפַּ֤ךְ עָלַ/י֙ לִבִּ֔/י יַ֖חַד נִכְמְר֥וּ נִחוּמָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/008.yaml
  text: How can I give you up[a], Ephraim? How can I hand you over, Israel? How can I make you like Admah? How can I set you like Zeboiim? My heart is turned over within me[c][b]; all my compassions are stirred.
translation:
  language: ru
  text: Как Я могу отдать тебя, Ефрем? Как могу предать тебя, Израиль? Как могу сделать тебя подобным Адме? Как могу уподобить тебя Цевоиму?[a] Сердце Моё перевернулось внутри Меня[b], всё Моё сострадание всколыхнулось[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Адма и Цевоим — города, разделившие участь Содома и Гоморры; это сравнение вызывает образ полного уничтожения (см. Второзаконие 29:23).
    reason: cross_reference
  - marker: b
    text: 'Или: «Сердце Моё изменилось внутри Меня». Буквально еврейский образ говорит, что сердце «перевернулось», выражая глубокое внутреннее потрясение.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможные варианты: «вся Моя жалость разгорелась» или «всё Моё сострадание стало горячим». Еврейский глагол может обозначать сильное внутреннее волнение и образ разгорающегося тепла.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Как Я могу
  rationale: Повторяющийся вопрос выражает не просто способ действия, а потрясение и внутреннее нежелание совершить суд.
- source_word: אֶתֶּנְךָ
  choice: отдать тебя
  rationale: Глагол נתן буквально означает «дать, отдать»; в контексте суда речь идёт о том, чтобы отдать Ефрема на погибель, но без добавления этого толкования в основной текст.
- source_word: אֲמַגֶּנְךָ
  choice: предать тебя
  rationale: Редкая форма от מגן в породе пиэль здесь означает «выдать, предать» и сохраняет смысловой параллелизм с «отдать».
- source_word: כְאַדְמָה
  choice: как с Адмой
  rationale: Сохранено название города, связанного с полным уничтожением; конструкция по-русски естественно передана через «поступить с тобой, как с…».
- source_word: אֲשִׂימְךָ כִּצְבֹאיִם
  choice: сделать тебя подобным Цевоиму
  rationale: שים буквально означает «положить, поставить», но в сравнительной конструкции выражает приведение Израиля к участи Цевоима.
- source_word: נֶהְפַּךְ עָלַי לִבִּי
  choice: Сердце Моё перевернулось во Мне
  rationale: Сохранён телесно-эмоциональный образ внутреннего переворота; он сильнее и конкретнее абстрактного «Я передумал».
- source_word: יַחַד נִכְמְרוּ נִחוּמָי
  choice: всё Моё сострадание всколыхнулось
  rationale: יַחַד передаёт совокупность, נִחוּמָי — сострадание или жалость, а נִכְמְרוּ обозначает сильное внутреннее движение, возможно с оттенком разгорающегося тепла. Русская формулировка естественно передаёт эмоциональную силу, не фиксируя спорный физиологический оттенок.
theological_decisions:
- issue: Человекоподобное описание внутреннего движения Бога
  choice: Сохранить образ перевернувшегося сердца и всколыхнувшегося сострадания
  alternative: 'Передать отвлечённо: «Я изменил решение»'
  rationale: Древнееврейский текст намеренно изображает сильное внутреннее движение Бога и создаёт напряжение между судом и состраданием; перевод не должен устранять это напряжение.
- issue: Упоминание Адмы и Цевоима
  choice: Сохранить географические названия в основном тексте
  alternative: 'Заменить их толкованием: «города, которые Я уничтожил»'
  rationale: Источник прямо называет эти города; необходимый историко-библейский контекст лучше дать в сноске.
translation_notes:
  register: 'Современный литературный русский язык с достоинством пророческой речи. Повтор «Как могу» сохраняет риторический напор оригинала; местоимения, относящиеся к Богу, даны с прописной буквы согласно принятой русской библейской традиции. Названия переданы в привычных русских библейских формах: Ефрем, Адма, Цевоим.'
