base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/005.yaml
  text: He will not return to the land of Egypt[a], but Assyria will be his king[b], because they have refused to return.
translation:
  language: ru
  text: Он не вернётся в землю Египта, но Ассирия станет его царём, потому что они отказались вернуться[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол «вернуться» здесь может также означать «обратиться» — в том числе обратиться к Богу, — поэтому в еврейском тексте слышны и буквальный, и духовный смыслы.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יָשׁוּב
  choice: не вернётся
  rationale: Отрицание с формой qal imperfect 3-го лица единственного числа передано как пророческое высказывание о будущем. Глагол «вернуться» сохраняет лексическую связь с לָשׁוּב в конце стиха.
- source_word: אֶל אֶרֶץ מִצְרַיִם
  choice: в землю Египетскую
  rationale: Сохранено слово אֶרֶץ («земля»), способное напоминать о прежнем рабстве Израиля и исходе; форма «земля Египетская» естественна для современного литературного библейского регистра.
- source_word: וְאַשּׁוּר
  choice: но Ассирия
  rationale: 'Союз וְ по контексту выражает противопоставление: не Египет, но Ассирия. Такое прочтение естественно связывает две части сжатой еврейской конструкции.'
- source_word: הוּא מַלְכּוֹ
  choice: станет его царём
  rationale: Местоименно-именная конструкция буквально обозначает Ассирию как «его царя». Будущее «станет» соответствует пророческому контексту и сохраняет образ чужеземного господства.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание объявленного суда.
- source_word: מֵאֲנוּ
  choice: они отказались
  rationale: Форма perfect 3-го лица множественного числа указывает на народ как коллектив, но не называет подлежащее прямо; поэтому сохранено местоимение «они» без поясняющей вставки.
- source_word: לָשׁוּב
  choice: вернуться
  rationale: Глагол может означать как возвращение, так и обращение к Богу. «Вернуться» сохраняет эту многозначность и повтор корня שוב, не сводя смысл только к покаянию.
theological_decisions:
- issue: Значение שוב в начале и конце стиха
  choice: В обоих случаях употребить «вернуться», сохранив повтор и сочетание географического и духовного смыслов.
  alternative: Передать первое употребление как «возвратиться», а последнее как «раскаяться» или «обратиться».
  rationale: У Осии שוב может обозначать и буквальное возвращение, и возвращение к Богу. Одинаковый русский глагол не снимает намеренного смыслового напряжения.
- issue: Переход от единственного числа к множественному
  choice: Сохранить «он» и затем «они», не уточняя референты.
  alternative: Сгладить переход, заменив «они» словами «его народ» или «народ Израиля».
  rationale: В еврейском тексте сначала стоят формы единственного числа, а затем глагол множественного числа без явно названного подлежащего. Сохранение перехода следует форме источника и не вносит пояснение из контекста.
- issue: Ассирия как царь
  choice: 'Сохранить метафору: «Ассирия станет его царём».'
  alternative: 'Передать описательно: «Ассирия будет властвовать над ним».'
  rationale: Прямой образ чужой державы как царя важен для богословской и политической остроты пророчества; его не следует сглаживать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным, а сжатость оригинала, метафора царской власти и резкий переход от единственного числа к множественному сохранены.
