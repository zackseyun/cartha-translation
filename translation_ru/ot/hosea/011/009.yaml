  text: לֹ֤א אֶֽעֱשֶׂה֙ חֲר֣וֹן אַפִּ֔/י לֹ֥א אָשׁ֖וּב לְ/שַׁחֵ֣ת אֶפְרָ֑יִם כִּ֣י אֵ֤ל אָֽנֹכִי֙ וְ/לֹא אִ֔ישׁ בְּ/קִרְבְּ/ךָ֣ קָד֔וֹשׁ וְ/לֹ֥א אָב֖וֹא בְּ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/009.yaml
  text: I will not carry out the fierceness of my anger[a]; I will not again destroy Ephraim. For I am God and not a man, the Holy One in your midst[c][b], and I will not come into the city.
translation:
  language: ru
  text: Не дам волю пылу Моего гнева; не стану снова губить Ефрема. Ведь Я — Бог, а не человек, Святой среди тебя, и не войду в город.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительные слова на еврейском трудны. Возможно также: «и не приду в ярости»; некоторые понимают их как отказ Бога прийти для враждебного, губительного нападения.'
    reason: alternative_reading
lexical_decisions:
- source_word: אֶעֱשֶׂה חֲרוֹן אַפִּי
  choice: не дам излиться пламени Моего гнева
  rationale: Сочетание עשה с выражением «пыл/жар гнева» означает осуществить гнев в действии. Русская формулировка естественно передаёт отказ привести яростный гнев в исполнение и сохраняет образ жара.
- source_word: אָשׁוּב לְשַׁחֵת
  choice: не стану снова губить
  rationale: שׁוב с инфинитивом может обозначать повторение действия; «снова» передаёт это без излишне буквального «не возвращусь, чтобы».
- source_word: אֶפְרָיִם
  choice: Ефрема
  rationale: Принята традиционная русская передача имени; в контексте оно обозначает северное царство и его народ.
- source_word: אֵל אָנֹכִי וְלֹא אִישׁ
  choice: Я — Бог, а не человек
  rationale: Прямо сохраняется контраст между Богом и человеком, на котором основано данное обещание.
- source_word: בְּקִרְבְּךָ קָדוֹשׁ
  choice: Святой среди тебя
  rationale: קָדוֹשׁ употреблено субстантивно, а בְּקִרְבְּךָ выражает присутствие среди народа. Единственное число «тебя» сохраняет обращение к Ефрему.
- source_word: וְלֹא אָבוֹא בְּעִיר
  choice: и не приду в ярости
  rationale: Заключительная фраза трудна. В контексте отказа от уничтожающего суда здесь вероятно имеется в виду враждебное, яростное пришествие. Буквально-городское прочтение сохранено в примечании.
theological_decisions:
- issue: Отказ Бога осуществить уничтожающий гнев
  choice: Передать как реальное заявление Бога о том, что Он не погубит Ефрема снова, и оставить основание этого решения в Его божественности и святости.
  alternative: Истолковать слова как чисто эмоциональную перемену либо сгладить их ради философского учения о неизменности Бога.
  rationale: Сам текст соединяет язык сильного гнева и отказ от разрушения, не объясняя это философски; перевод сохраняет данное напряжение.
- issue: Смысл заключительного וְלֹא אָבוֹא בְּעִיר
  choice: «не приду в ярости»
  alternative: «не войду в город»
  rationale: Контекст поддерживает смысл отказа от губительного вторжения, но еврейская форма допускает буквальное понимание слова как «город»; поэтому альтернатива вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Местоимения, относящиеся к Богу, даны с прописной буквы согласно распространённой русской библейской традиции. Синтаксис сохраняет краткость и параллелизм еврейского стиха.
