  text: A sword will whirl through his cities[a], and will consume his bars[b], and devour them because of their counsels.
translation:
  language: ru
  text: И закружится меч по его городам[a], уничтожит его засовы[b] и пожрёт их за их замыслы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и обрушится меч на его города»; или: «и будет свирепствовать меч в его городах». Еврейский глагол труден для точного понимания и может передавать кружение, падение либо неистовое движение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «засовы городских ворот». Возможно также понимание: «его правителей», однако контекст нападения на города скорее указывает на защитные засовы.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְחָלָה
  choice: и закружится
  rationale: Редкая и трудная форма от חול здесь, по-видимому, передаёт стремительное, яростное движение меча. «Закружится» сохраняет поэтический образ, не сводя его однозначно к падению или свирепствованию.
- source_word: חֶרֶב
  choice: меч
  rationale: Сохраняется конкретное существительное в единственном числе, которое в контексте может также представлять войну как целое.
- source_word: בְּעָרָיו
  choice: по его городам
  rationale: Предлог ב обозначает сферу действия внутри городов; русское «по его городам» естественно передаёт движение меча от города к городу, не превращая предлог в явно направленное «против».
- source_word: וְכִלְּתָה
  choice: уничтожит
  rationale: Глагол כלה означает доведение до конца, истребление или полное уничтожение. В отношении городских укреплений «уничтожит» звучит естественно и сохраняет интенсивность.
- source_word: בַדָּיו
  choice: его засовы
  rationale: בדים может обозначать брусья или засовы; в контексте нападения на города наиболее вероятны засовы городских ворот. Возможное понимание как «правители» отмечено в сноске.
- source_word: וְאָכָלָה
  choice: и пожрёт их
  rationale: Буквально глагол означает «есть, пожирать» и олицетворяет меч. Местоимение «их» добавлено ради естественной русской синтаксической завершённости, относя действие к названным засовам, хотя отдельного объекта при глаголе в еврейском тексте нет.
- source_word: מִמֹּעֲצוֹתֵיהֶם
  choice: за их замыслы
  rationale: 'מן здесь естественно понимать причинно: бедствие приходит вследствие их решений и замыслов. «Замыслы» сохраняет смысл עצות и допускает как нейтральные планы, так и порочные расчёты, не усиливая оценку сверх текста.'
theological_decisions:
- issue: 'Смена числа в местоименных суффиксах: «его города / его засовы», но «их замыслы»'
  choice: 'Сохранить переход от единственного числа к множественному: «его… его… их».'
  alternative: 'Согласовать все формы во множественном числе: «их города… их засовы… их замыслы».'
  rationale: Еврейский текст действительно меняет число. Единственное число может представлять Израиль или Ефрема как одно корпоративное лицо, тогда как множественное указывает на людей; сглаживание устранило бы присутствующее в источнике напряжение.
- issue: Объект глагола וְאָכָלָה
  choice: Передать «пожрёт их», понимая «их» как ближайшие названные засовы.
  alternative: 'Оставить без выраженного объекта: «и будет пожирать за их замыслы».'
  rationale: В еврейском после глагола нет отдельного объектного местоимения, поэтому референт не вполне явен. Однако русский переходный глагол здесь требует естественного дополнения; сноска не нужна, поскольку это синтаксическое восполнение, а не самостоятельное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной пророческой образностью. Сохранены олицетворение меча, параллелизм действий и намеренная смена числа местоимений; избегнуты архаизмы вроде «советы» в значении замыслов и конфессионально окрашенные уточнения.
