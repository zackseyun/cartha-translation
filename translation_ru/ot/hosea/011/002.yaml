  text: קָרְא֖וּ לָ/הֶ֑ם כֵּ֚ן הָלְכ֣וּ מִ/פְּנֵי/הֶ֔ם לַ/בְּעָלִ֣ים יְזַבֵּ֔חוּ וְ/לַ/פְּסִלִ֖ים יְקַטֵּרֽוּ/ן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/011/002.yaml
  text: The more they called to them[a], the more they went away from them[b]; they kept sacrificing to the Baals and burning incense to idols.
translation:
  language: ru
  text: Чем больше их звали[a], тем дальше они уходили от тех, кто их звал; они продолжали приносить жертвы Ваалам и воскурять благовония идолам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Как их звали, так они уходили от звавших их». В еврейском тексте стоит активная форма «они звали их», но не указано, кто именно звал.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «изваяниям».'
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְאוּ לָהֶם
  choice: их звали
  rationale: Еврейская форма буквально имеет активное множественное подлежащее («они звали их / взывали к ним»), однако само подлежащее не названо. Русская неопределённо-личная конструкция естественно сохраняет эту неопределённость, не отождествляя зовущих ни с Богом, ни с пророками.
- source_word: כֵּן
  choice: чем больше … тем дальше
  rationale: Передаёт соотносительную, пропорциональную связь между усиливавшимся призывом и всё большим удалением Израиля; альтернативное более буквальное понимание «как … так» отмечено в сноске.
- source_word: הָלְכוּ מִפְּנֵיהֶם
  choice: уходили от тех, кто их звал
  rationale: Сочетание הלך с מן־פנים выражает удаление из чьего-либо присутствия. Формулировка естественна по-русски и ясно сохраняет соотнесённость местоименного суффикса с неназванными зовущими.
- source_word: לַבְּעָלִים
  choice: Ваалам
  rationale: Множественное число обозначает различных Ваалов либо местные проявления и культы Ваала; русская форма сохраняет множественность исходного текста.
- source_word: יְזַבֵּחוּ
  choice: продолжали приносить жертвы
  rationale: Имперфект в данном пророческо-поэтическом контексте указывает на повторявшееся, привычное действие.
- source_word: לַפְּסִלִים
  choice: идолам
  rationale: Это естественный современный эквивалент обозначения культовых изображений; более конкретное значение «изваяниям» сохранено в сноске.
- source_word: יְקַטֵּרוּן
  choice: воскурять благовония
  rationale: Порода пиэль глагола קטר в культовом контексте обычно обозначает воскурение благовоний или создание жертвенного дыма; выбранный вариант ясен и соответствует возвышенному регистру пророческой речи.
theological_decisions:
- issue: Неназванное подлежащее глагола «звали»
  choice: Сохранить неопределённость посредством конструкции «их звали».
  alternative: «Бог звал их», «пророки звали их» или «они звали их».
  rationale: Еврейский текст не называет зовущих. Контекст допускает связь как с Божьим призывом, так и с посланными Им пророками, поэтому перевод не должен устранять эту значимую неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Конструкция «чем больше … тем дальше» обеспечивает естественное звучание, а «приносить жертвы» и «воскурять благовония» сохраняют культовую терминологию без архаической перегруженности.
