base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/012.yaml
  text: Sow for yourselves for righteousness[a]; reap according to steadfast love. Break up for yourselves unplowed ground, for it is time to seek Yahweh[b], until he comes and rains righteousness on you.
translation:
  language: ru
  text: Сейте для себя ради праведности; пожинайте по мере неизменной любви. Распашите для себя невозделанную землю[a], ведь настало время искать Яхве, пока Он не придёт и не прольёт[b] на вас праведность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «залежную землю».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «научит вас праведности». Еврейский глагол может означать «учить», однако земледельческие образы этого стиха поддерживают значение «проливать дождём».'
    reason: alternative_reading
lexical_decisions:
- source_word: זִרְעוּ לָכֶם לִצְדָקָה
  choice: Сейте для себя ради праведности
  rationale: Императив сохраняет земледельческий образ; «для себя» передаёт возвратно-бенефактивный оттенок לָכֶם, а «ради праведности» выражает целевое значение לְ, не превращая «праведность» без необходимости в прямое дополнение.
- source_word: קִצְרוּ לְפִי חֶסֶד
  choice: пожинайте по мере неизменной любви
  rationale: «Пожинайте» поддерживает параллель с сеянием; לְפִי передано как соответствие меры, а חֶסֶד — как стойкая, верная любовь, а не просто эмоциональная привязанность.
- source_word: נִירוּ לָכֶם נִיר
  choice: Распашите для себя невозделанную землю
  rationale: Фраза ясно передаёт призыв обработать доныне неготовую почву и сохраняет возвратно-бенефактивное לָכֶם. Возможный оттенок залежной земли отмечен в сноске.
- source_word: וְעֵת לִדְרוֹשׁ אֶת־יְהוָה
  choice: ведь настало время искать Яхве
  rationale: «Ведь» естественно вводит основание предыдущих призывов, а «настало время» передаёт срочность. Имя יהוה транслитерировано как «Яхве».
- source_word: עַד יָבוֹא
  choice: пока Он не придёт
  rationale: Русская конструкция с «пока не» естественно выражает предел продолжительного искания; подлежащее определяется по предшествующему имени Яхве.
- source_word: וְיֹרֶה צֶדֶק לָכֶם
  choice: и не прольёт на вас праведность
  rationale: «Прольёт» продолжает земледельческий образ дождя, начатый сеянием, жатвой и обработкой земли; «праведность» сохраняет связь с צְדָקָה в начале стиха.
theological_decisions:
- issue: Значение וְיֹרֶה צֶדֶק
  choice: Яхве «прольёт» праведность, подобно дождю
  alternative: Яхве «научит вас праведности»
  rationale: Контекст земледелия поддерживает образ дождя, однако форма глагола ירה допускает значение «учить, наставлять». Альтернатива сохранена в сноске, чтобы не устранять подлинную смысловую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, но торжественным пророческим звучанием. Сельскохозяйственная метафора последовательно сохранена; редкие или церковнославянские обороты не используются.
