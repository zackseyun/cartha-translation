  yaml_path: translation/ot/hosea/010/010.yaml
  text: When I desire[a], I will discipline them[b], and peoples will be gathered against them when they are bound for their two transgressions.
translation:
  language: ru
  text: Когда Я пожелаю, Я накажу их[a]. Народы будут собраны против них, когда их свяжут за два их беззакония[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вразумлю их». Глагол может обозначать исправительное наказание или наставление.'
