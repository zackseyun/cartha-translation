  - marker: b
    text: 'Буквально: «за два их беззакония»; возможно также: «за их двойную вину». Согласный текст допускал и чтение «два их глаза», однако оно хуже соответствует контексту.'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאַוָּתִי
  choice: Когда Я пожелаю
  rationale: Предлог בְּ с существительным, обозначающим желание, и суффиксом 1-го лица выражает обстоятельство Божьей воли. Временная формулировка естественна по-русски и сохраняет волевой оттенок.
- source_word: וְאֶסֳּרֵם
  choice: Я подвергну их наказанию
  rationale: Форма восходит к יסר — «наставлять, вразумлять, наказывать», а не к אסר — «связывать». Выбранная формулировка сохраняет смысл наказания, не исключая его исправительной цели.
- source_word: וְאֻסְּפוּ עֲלֵיהֶם עַמִּים
  choice: Народы соберутся против них
  rationale: Пассивная форма означает, что многие народы будут собраны; в русском возвратное «соберутся» звучит естественно, а «против них» передаёт враждебный смысл עֲלֵיהֶם в данном контексте.
- source_word: בְּאָסְרָם
  choice: когда их свяжут
  rationale: Инфинитив от אסר означает «связывать». Конструкция допускает невыраженного деятеля; русская неопределённо-личная форма сохраняет эту неопределённость.
- source_word: לִשְׁתֵּי עינתם
  choice: за два их беззакония
  rationale: Трудная форма в контексте суда, вероятнее всего, связана с עון — «беззаконие, вина». Числительное «два» сохранено без попытки установить, какие именно проступки имеются в виду.
theological_decisions:
- issue: Значение заключительной фразы לִשְׁתֵּי עינתם
  choice: за два их беззакония
  alternative: за их двойную вину; к двум их глазам
  rationale: Контекст осуждения поддерживает понимание, связанное с беззаконием или виной. При этом числовой элемент сохранён, а конкретное отождествление двух беззаконий не навязывается.
- issue: Характер действия וְאֶסֳּרֵם
  choice: подвергну их наказанию
  alternative: вразумлю их; накажу их
  rationale: Глагол יסר может обозначать как исправительное наставление, так и наказание. Основной текст передаёт судебный контекст, а примечание сохраняет исправительный оттенок.
translation_notes:
  register: Современный литературный русский язык, сдержанный пророческий тон. Синтаксис сделан ясным без устранения неоднозначности относительно того, кто именно связывает осуждённых; трудное заключительное выражение сохранено в основном тексте и пояснено в примечании.
