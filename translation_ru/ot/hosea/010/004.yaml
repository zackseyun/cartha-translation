  text: דִּבְּר֣וּ דְבָרִ֔ים אָל֥וֹת שָׁ֖וְא כָּרֹ֣ת בְּרִ֑ית וּ/פָרַ֤ח כָּ/רֹאשׁ֙ מִשְׁפָּ֔ט עַ֖ל תַּלְמֵ֥י שָׂדָֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/004.yaml
  text: They speak mere words[a], swearing false oaths, making covenants[d][c][b]; so judgment springs up like poison weed on the furrows of the field.
translation:
  language: ru
  text: Они говорят пустые слова[a], дают ложные клятвы и заключают союз[b]; и суд[c] прорастает, словно ядовитая трава[d], на бороздах поля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорят слова»; возможен смысл пустых речей или обещаний.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «режут союз» — древнееврейское выражение, означающее заключение союза или договора.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «правосудие»; в таком случае выражение может звучать как горькая ирония.'
    reason: alternative_reading
  - marker: d
    text: 'Еврейское слово обозначает ядовитое или горькое растение; точный его вид неизвестен. Возможные переводы: «болиголов» или «горькая трава».'
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְּרוּ דְבָרִים
  choice: говорят пустые слова
  rationale: Однокоренная конструкция буквально означает «говорят слова» и в данном обвинительном контексте подчёркивает бессодержательность речи. Настоящее время естественно передаёт характерное, продолжающееся поведение.
- source_word: אָל֥וֹת שָׁ֖וְא
  choice: дают ложные клятвы
  rationale: אָלָה обозначает клятву, иногда с подразумеваемым проклятием, а שָׁוְא указывает на её ложность, тщетность или пустоту.
- source_word: כָּרֹת בְּרִית
  choice: заключают союзы
  rationale: Это устойчивое древнееврейское выражение, буквально «режут союз». Русское «заключают союзы» естественно передаёт смысл, не навязывая исключительно политическое или религиозное толкование.
- source_word: וּפָרַח
  choice: прорастает
  rationale: Глагол описывает появление ростка, цветение или разрастание; «прорастает» сохраняет земледельческий образ и не придаёт ему положительной окраски.
- source_word: כָּרֹאשׁ
  choice: словно ядовитый сорняк
  rationale: רֹאשׁ здесь указывает на ядовитое или горькое растение, точный вид которого неизвестен. Обобщённое название передаёт образ, не создавая ложной ботанической точности.
- source_word: מִשְׁפָּט
  choice: суд
  rationale: Русское «суд» сохраняет возможные значения судебного решения, суда и правосудия, позволяя услышать горькую иронию образа, в котором суд вырастает как ядовитое растение.
- source_word: עַל תַּלְמֵי שָׂדָי
  choice: в бороздах поля
  rationale: 'תֶּלֶם означает борозду или гребень вспаханной земли. Предлог עַל в этом образе естественно передаётся по-русски как «в»: растение всходит в полевых бороздах.'
theological_decisions:
- issue: Значение מִשְׁפָּט в контексте обличения
  choice: суд
  alternative: правосудие
  rationale: '«Суд» сохраняет смысловую напряжённость: речь может идти либо о порочном судебном порядке и его последствиях, либо, с горькой иронией, о правосудии, ставшем ядовитым. Перевод не устраняет эту неоднозначность.'
translation_notes:
  register: Современный литературный русский язык с кратким, резким пророческим ритмом. Сельскохозяйственный образ сохранён, а неоднозначность слова «суд» и неопределённость названия растения раскрыты в сносках.
