base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/009.yaml
  text: From the days of Gibeah you have sinned[a], O Israel; there they have remained[b]. Will not war against the children of iniquity overtake them in Gibeah?
translation:
  language: ru
  text: Со времён Гивы[a] ты грешишь, Израиль; там они и остались. Неужели война против сынов беззакония не настигнет их в Гиве?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Гива напоминает о злодеянии и последовавшей междоусобной войне, описанных в Суд 19–21; у Осии это образ глубоко укоренившегося развращения Израиля.
    reason: cross_reference
  - marker: b
    text: 'Еврейский текст последней фразы труден. Возможно также: «Война против сынов беззакония в Гиве не настигла их» или «не настигнет их».'
    reason: alternative_reading
lexical_decisions:
- source_word: מִימֵי הַגִּבְעָה
  choice: Со времён Гивы
  rationale: Предлог מִן с יָמִים обозначает исходную точку во времени; название места передано как «Гива» в принятой русской библейской форме.
- source_word: חָטָאתָ יִשְׂרָאֵל
  choice: ты грешишь, Израиль
  rationale: Перфект второго лица единственного числа обращён к Израилю как к единому народу. Настоящее «грешишь» естественно передаёт состояние, начавшееся во времена Гивы и продолжающееся доныне.
- source_word: שָׁם עָמָדוּ
  choice: там они и остались
  rationale: עמד буквально значит «стоять», но здесь, вероятно, выражает сохранение прежнего положения или упорство в нём. «И остались» передаёт продолжительность, не уточняя сверх текста, кто именно подразумевается местоимением.
- source_word: לֹא תַשִּׂיגֵם
  choice: Неужели ... не настигнет их?
  rationale: Hiphil от נשׂג означает «настичь, догнать». Риторический вопрос сохраняет ожидаемый утвердительный смысл угрозы, не превращая трудную конструкцию в однозначное повествовательное утверждение.
- source_word: מִלְחָמָה
  choice: война
  rationale: Слово обозначает войну или сражение; «война» лучше поддерживает отсылку к широкому межплеменному конфликту в Суд 19–21.
- source_word: בְּנֵי עַלְוָה
  choice: сыны беззакония
  rationale: Сохранён семитский оборот, обозначающий людей, характеризуемых нравственной испорченностью. «Беззаконие» передаёт עַלְוָה достаточно широко и соответствует возвышенному пророческому регистру.
theological_decisions:
- issue: Толкование трудной фразы לֹא תַשִּׂיגֵם בַּגִּבְעָה מִלְחָמָה עַל בְּנֵי עַלְוָה
  choice: 'Риторический вопрос: «Неужели война против сынов беззакония не настигнет их в Гиве?»'
  alternative: «Война против сынов беззакония в Гиве не настигла их» или «не настигнет их».
  rationale: Синтаксис еврейского текста допускает разные временные и риторические прочтения. Основной текст передаёт вероятную угрозу суда, а примечание сохраняет подлинную неоднозначность.
- issue: Историко-богословская функция Гивы
  choice: Оставить аллюзию неразвёрнутой в основном тексте и пояснить её в примечании.
  alternative: Прямо назвать преступление и гражданскую войну в переводе стиха.
  rationale: Гива служит образом глубоко укоренившегося развращения Израиля, однако конкретизация в основном тексте была бы добавлением; ссылка на Суд 19–21 достаточна в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение лишено архаического «о», но сохранены торжественный оборот «сыны беззакония» и риторическая форма угрозы. Все примечания отмечены в основном тексте.
