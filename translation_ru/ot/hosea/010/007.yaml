base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/007.yaml
  text: Samaria is cut off[b][a], her king like foam on the surface of the waters.
translation:
  language: ru
  text: Самария уничтожена[a], её царь — словно пена[b] на поверхности воды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «погибла»; еврейский глагол может означать, что кто-либо пришёл к концу, был уничтожен или умолк.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «словно щепка»; некоторые понимают этот образ как маленький кусок дерева или мусора, беспомощно плывущий по воде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדְמֶה
  choice: уничтожена
  rationale: Нифаль глагола דמה здесь означает прекращение существования, гибель или уничтожение. В контексте суда над Самарией «уничтожена» естественно передаёт политическую катастрофу, не сводя смысл к молчанию.
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Общепринятое русское название столицы Северного царства, которая здесь может представлять и само царство.
- source_word: מַלְכָּהּ
  choice: её царь
  rationale: Суффикс женского рода согласуется с Самарией; русское местоимение «её» естественно сохраняет это соотнесение.
- source_word: כְּקֶצֶף
  choice: словно пена
  rationale: קֶצֶף может обозначать пену или нечто вроде щепки, плавающей на воде. «Пена» имеет хорошую лексическую опору и передаёт непрочность и быстротечность образа.
- source_word: עַל פְּנֵי מָיִם
  choice: на поверхности воды
  rationale: Естественная русская передача буквального оборота «на лице вод», сохраняющая образ чего-то, уносимого водой.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткая пророческая фраза сохранена. Тире ясно выражает подразумеваемую связку во второй части, а «словно» звучит естественно и достойно.
