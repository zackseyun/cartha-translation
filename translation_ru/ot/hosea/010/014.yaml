base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/014.yaml
  text: The tumult will arise among your people[a], and all your fortresses will be devastated, as Shalman devastated Beth-arbel on the day of battle[b]; mothers were dashed to pieces with their children.
translation:
  language: ru
  text: Среди твоего народа поднимется шум, и все твои крепости будут разорены, как Шалман[a] разорил Бет-Арбел в день битвы; матерей разбили вместе с детьми[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя Шалман, возможно, относится к одному из царей по имени Салманасар, однако точная историческая идентификация неизвестна.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «мать была разбита на детях». Еврейское выражение краткое и графичное; точные обстоятельства действия не уточняются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָאם
  choice: поднимется
  rationale: Перфект с союзом в пророческом контексте указывает на предстоящее событие; «поднимется» сохраняет образ внезапно возникающего бедствия.
- source_word: שָׁאוֹן
  choice: гул
  rationale: Слово обозначает громкий шум и смятение, особенно связанные с войной и разрушением. «Гул» естественно передаёт звуковой образ, не сужая его до одного конкретного вида шума.
- source_word: בְּעַמֶּךָ
  choice: среди твоего народа
  rationale: Предлог ב обозначает здесь среду, внутри которой разразится бедствие; по-русски это естественно передаётся словом «среди».
- source_word: מִבְצָרֶיךָ
  choice: твои крепости
  rationale: Существительное обозначает укреплённые оборонительные места; «крепости» кратко и ясно сохраняет военный смысл.
- source_word: יוּשַּׁד
  choice: будут разорены
  rationale: Страдательная форма от שׁדד выражает насильственное опустошение, разграбление и разрушение. «Разорены» охватывает оба оттенка.
- source_word: כְּשֹׁד
  choice: как … разорил
  rationale: Сравнительный оборот передан глагольной конструкцией, естественной для русского языка и ясно выражающей историческую аналогию.
- source_word: שַׁלְמַן
  choice: Шалман
  rationale: Сохранена форма имени, представленная в еврейском тексте, без спорного отождествления с одним из царей по имени Салманасар.
- source_word: בֵּית אַרְבֵאל
  choice: Бет-Арбел
  rationale: Географическое название передано транслитерацией; дефис показывает составное имя и облегчает чтение.
- source_word: בְּיוֹם מִלְחָמָה
  choice: в день битвы
  rationale: Оборот обозначает конкретный день военного столкновения; «битва» здесь естественнее общего слова «война».
- source_word: אֵם עַל בָּנִים רֻטָּשָׁה
  choice: матерей вместе с детьми разбивали насмерть
  rationale: Еврейская фраза предельно кратка и буквально содержит единственное число с предлогом «на/над». Русское множественное число передаёт собирательно-типическое значение, а безлично-пассивная конструкция ясно сохраняет картину военного зверства, не уточняя его механику сверх текста.
theological_decisions:
- issue: Историческая идентификация שַׁלְמַן
  choice: Передать имя как «Шалман», не уточняя личность в основном тексте.
  alternative: Отождествить его с Салманасаром III или Салманасаром V либо считать неизвестным правителем.
  rationale: Еврейский текст даёт форму שַׁלְמַן, но историческая идентификация остаётся спорной; перевод не должен устранять эту неопределённость.
- issue: Смысл заключительной картины зверства
  choice: Передать собирательный смысл как убийство матерей вместе с детьми.
  alternative: 'Буквально: «мать была разбита на детях»; возможно также понимание, что мать разбивали, когда она находилась рядом с детьми или поверх них.'
  rationale: Исходная фраза графична, но синтаксически сжата. Основной текст передаёт очевидный ужас события, а примечание сохраняет буквальную форму и её неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сдержанно-возвышенным библейским звучанием. Военная образность сохранена без архаизмов и без смягчения заключительной сцены; спорные исторические и синтаксические детали вынесены в примечания.
