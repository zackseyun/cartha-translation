  text: וְ/אֶפְרַ֜יִם עֶגְלָ֤ה מְלֻמָּדָה֙ אֹהַ֣בְתִּי לָ/ד֔וּשׁ וַ/אֲנִ֣י עָבַ֔רְתִּי עַל ט֖וּב צַוָּארָ֑/הּ אַרְכִּ֤יב אֶפְרַ֨יִם֙ יַחֲר֣וֹשׁ יְהוּדָ֔ה יְשַׂדֶּד ל֖/וֹ יַעֲקֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/011.yaml
  text: Ephraim was a trained heifer that loved to thresh[a], but I spared her fair neck. I will put Ephraim to the yoke; Judah will plow[c][b]; Jacob will harrow for him.
translation:
  language: ru
  text: Ефрем — приученная к работе телица, любившая молотить; но Я щадил её красивую шею[a]. Я надену ярмо на Ефрема[b]; Иуда будет пахать, а Иаков — боронить для него[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я прошёл над её красивой шеей». Еврейский текст этой части стиха труден; основной перевод исходит из того, что прежде Ефрем был избавлен от более тяжёлого бремени.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «Я впрягу Ефрема». Буквально: «Я посажу Ефрема верхом»; в данном земледельческом образе это, вероятно, означает запрячь животное или надеть на него ярмо.'
    reason: lexical_alternative
  - marker: c
    text: 'Боронить — разбивать комья и разравнивать землю после пахоты. Возможный перевод: «разбивать комья для него».'
    reason: cultural_note
lexical_decisions:
- source_word: עֶגְלָה מְלֻמָּדָה
  choice: приученная к работе телица
  rationale: Сочетание обозначает молодую корову, обученную сельскохозяйственному труду. Формулировка естественна по-русски и сохраняет образ.
- source_word: אֹהַבְתִּי לָדוּשׁ
  choice: любившая молотить
  rationale: Передаёт привычную склонность Ефрема к молотьбе — сравнительно лёгкой и выгодной для рабочего животного работе.
- source_word: וַאֲנִי עָבַרְתִּי עַל טוּב צַוָּארָהּ
  choice: но Я щадил её красивую шею
  rationale: Еврейское выражение трудно и допускает разные толкования. В контексте оно, вероятно, указывает, что прежде Бог не возлагал на Ефрема более тяжёлого бремени; «но» естественно выражает смысловой контраст.
- source_word: אַרְכִּיב אֶפְרַיִם
  choice: Я надену ярмо на Ефрема
  rationale: Буквально каузативная форма связана с «ездой», однако в земледельческом контексте, вероятно, означает запрячь животное для тяжёлой работы. Перевод делает подразумеваемое ярмо явным, не разрушая метафору.
- source_word: יַחֲרוֹשׁ
  choice: будет пахать
  rationale: Обычное земледельческое значение глагола; будущее время соответствует объявлению предстоящего труда или суда.
- source_word: יְשַׂדֵּד
  choice: будет боронить
  rationale: Глагол обозначает вторичную обработку вспаханной земли — разбивание комьев и разравнивание почвы.
- source_word: לּוֹ יַעֲקֹב
  choice: Иаков — боронить для него
  rationale: «Для него» сохраняет местоименный суффикс мужского рода, вероятно относящийся к Иуде, и не устраняет неоднозначность текста.
theological_decisions:
- issue: Земледельческий образ Ефрема, Иуды и Иакова
  choice: Образ передаёт переход Ефрема от более лёгкой молотьбы к навязанному тяжёлому труду; Иуде и Иакову также назначается полевая работа.
  alternative: Эти слова можно понимать мягче — как простое распределение сельскохозяйственных работ, без акцента на наказании.
  rationale: Контекст Осии 10 связан с судом и призывом к покаянию, поэтому сохранена дисциплинарная сила образа, но без привнесения позднейших богословских категорий.
- issue: Значение Божьего действия по отношению к шее Ефрема
  choice: Бог прежде щадил шею Ефрема, не возлагая на него тяжёлого ярма.
  alternative: Фразу можно понимать буквально как «Я прошёл над/возле её красивой шеи» либо как действие приближения к ней для запряжки.
  rationale: Еврейская конструкция трудна; основной текст следует вероятному контекстуальному смыслу, а альтернативу сохраняет сноска.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Земледельческая метафора сохранена; редкий глагол «боронить» пояснён в сноске. Добавленное по смыслу «Теперь» подчёркивает переход от прежней пощады к предстоящему тяжёлому труду.
