  variant: modern literary Russian
source:
  edition: WLC
  text: חֲרַשְׁתֶּם רֶ֛שַׁע עַוְלָ֥תָ/ה קְצַרְתֶּ֖ם אֲכַלְתֶּ֣ם פְּרִי כָ֑חַשׁ כִּֽי בָטַ֥חְתָּ בְ/דַרְכְּ/ךָ֖ בְּ/רֹ֥ב גִּבּוֹרֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/013.yaml
  text: You have plowed wickedness[a]; you have reaped injustice; you have eaten the fruit of deceit, because you trusted in your way[c][b], in the multitude of your warriors.
translation:
  language: ru
  text: Вы пахали нечестие, пожали несправедливость, ели плод обмана[a], потому что ты полагался на свой путь[b] и на множество своих воинов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лжи» или «неправды».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте сначала стоят формы множественного числа («вы пахали… пожали… ели»), а затем — единственного («ты полагался… свой путь… своих воинов»). Вероятно, здесь Израиль представлен как единое целое.
    reason: cultural_note
  - marker: c
    text: 'Или: «своих могучих мужей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרַשְׁתֶּם רֶשַׁע
  choice: вы пахали нечестие
  rationale: Сохраняется буквальный земледельческий образ и нравственная направленность רֶשַׁע; «нечестие» звучит естественно и весомо в пророческом обличении.
- source_word: עַוְלָתָה קְצַרְתֶּם
  choice: пожали несправедливость
  rationale: «Пожали» продолжает земледельческую метафору, а «несправедливость» передаёт нравственно-социальный оттенок עַוְלָתָה.
- source_word: אֲכַלְתֶּם פְּרִי כָחַשׁ
  choice: ели плод обмана
  rationale: Формулировка сохраняет последовательность пахоты, жатвы и вкушения плода. כָחַשׁ здесь передан как «обман», при сохранении альтернатив в примечании.
- source_word: כִּי בָטַחְתָּ
  choice: потому что ты полагался
  rationale: כִּי вводит причину, а בָטַח выражает доверие или опору. Единственное число сохранено для отражения смены числа в еврейском тексте.
- source_word: בְדַרְכְּךָ
  choice: на свой путь
  rationale: 'Сохраняется многозначный образ «пути»: собственный образ действий, курс или политика Израиля; перевод не сужает его до одного толкования.'
- source_word: בְּרֹב גִּבּוֹרֶיךָ
  choice: на множество своих воинов
  rationale: В контексте упования на военную силу גִּבּוֹרִים естественно передаётся словом «воины», а רֹב указывает на их многочисленность.
theological_decisions:
- issue: Смена обращения со 2-го лица множественного числа на 2-е лицо единственного числа
  choice: 'Передать смену явно: «вы пахали… пожали… ели… потому что ты полагался…»'
  alternative: 'Сгладить всё обращение до множественного числа: «потому что вы полагались…»'
  rationale: Масоретский текст действительно меняет число, вероятно переходя от народа как множества к Израилю как единому целому. Сохранение этой особенности не требует исправления текста и не устраняет его риторическое напряжение.
- issue: Значение בְדַרְכְּךָ
  choice: «на свой путь»
  alternative: «на свои замыслы», «на свою военную стратегию» или «на свою силу»
  rationale: Буквальный образ пути шире возможных контекстуальных уточнений и позволяет сохранить нравственный и политический смысл без чрезмерной конкретизации.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного пророческого обличения и земледельческой метафоры. Смена числа в обращении намеренно не сглажена; все маркеры примечаний размещены непосредственно при соответствующих выражениях.
