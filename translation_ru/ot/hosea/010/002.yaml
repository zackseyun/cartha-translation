  text: חָלַ֥ק לִבָּ֖/ם עַתָּ֣ה יֶאְשָׁ֑מוּ ה֚וּא יַעֲרֹ֣ף מִזְבְּחוֹתָ֔/ם יְשֹׁדֵ֖ד מַצֵּבוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/002.yaml
  text: Their heart is divided[a]; now they will bear guilt. He himself will tear down their altars[c][b]; he will devastate their sacred pillars.
translation:
  language: ru
  text: Их сердце раздвоено[a]; теперь они понесут вину[b]. Он Сам сокрушит их жертвенники и разрушит их священные столбы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Их сердце лживо (льстиво)». Еврейский глагол может передавать гладкость, скользкость или разделённость; здесь «раздвоено» указывает на разделённую преданность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «теперь они будут признаны виновными» или «теперь они поплатятся за свою вину».'
    reason: lexical_alternative
  - marker: c
    text: Священные столбы — вертикально установленные камни, служившие культовыми объектами.
    reason: cultural_note
lexical_decisions:
- source_word: חָלַק
  choice: раздвоено
  rationale: Форма допускает значения «гладкое/льстивое» и «разделённое». В сочетании с «сердцем» и в контексте неверности Израиля «раздвоено» естественно передаёт разделённую преданность, не скрывая иной возможности в сноске.
- source_word: לִבָּם
  choice: их сердце
  rationale: Сохраняет библейский образ сердца как внутреннего центра воли, мысли и религиозной преданности; единственное число соответствует еврейскому тексту.
- source_word: עַתָּה
  choice: теперь
  rationale: Прямо передаёт переход от обвинения к наступающему суду.
- source_word: יֶאְשָׁמוּ
  choice: они понесут вину
  rationale: Глагол может обозначать признание виновными, несение вины или её последствий. Выражение сохраняет связь между виновностью и ответственностью, не сводя смысл только к наказанию.
- source_word: הוּא
  choice: Он Сам
  rationale: Отдельное местоимение имеет эмфатическую силу. Заглавная буква отражает наиболее вероятную отсылку к Богу, но имя Бога в текст не добавляется.
- source_word: יַעֲרֹף
  choice: сокрушит
  rationale: Буквальный образ связан с переламыванием шеи или отсечением; применительно к жертвенникам «сокрушит» передаёт решительное физическое уничтожение естественным русским языком.
- source_word: מִזְבְּחוֹתָם
  choice: их жертвенники
  rationale: Стандартное и точное обозначение сооружений для жертвоприношений.
- source_word: יְשֹׁדֵד
  choice: разрушит
  rationale: В данном параллелизме глагол выражает опустошительное уничтожение; «разрушит» ясно и естественно применительно к каменным культовым объектам.
- source_word: מַצֵּבוֹתָם
  choice: их священные столбы
  rationale: מַצֵּבוֹת — установленные вертикально камни культового назначения. «Священные столбы» передаёт их религиозную функцию, которая разъясняется в сноске.
theological_decisions:
- issue: Кто обозначен эмфатическим הוּא
  choice: Местоимение передано как «Он Сам» с вероятной отсылкой к Богу.
  alternative: Субъектом может быть не названный в стихе враг или иной исполнитель суда.
  rationale: Контекст книги Осии поддерживает понимание Бога как действующего Судьи, однако сам стих не называет Его прямо. Поэтому имя «Господь» не добавлено, а местоименная форма оригинала сохранена.
- issue: Характер вины в יֶאְשָׁמוּ
  choice: «понесут вину» сохраняет одновременно виновность и ответственность за неё.
  alternative: «будут признаны виновными» или «понесут наказание за вину».
  rationale: Еврейский глагол допускает как судебно-нравственный смысл виновности, так и наступление её последствий; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Сохранены коллективное единственное «сердце», эмфаза «Он Сам» и параллелизм двух актов разрушения. Все сноски поставлены непосредственно после соответствующих выражений.
