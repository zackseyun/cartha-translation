  text: וְ/נִשְׁמְד֞וּ בָּמ֣וֹת אָ֗וֶן חַטַּאת֙ יִשְׂרָאֵ֔ל ק֣וֹץ וְ/דַרְדַּ֔ר יַעֲלֶ֖ה עַל מִזְבְּחוֹתָ֑/ם וְ/אָמְר֤וּ לֶֽ/הָרִים֙ כַּסּ֔וּ/נוּ וְ/לַ/גְּבָע֖וֹת נִפְל֥וּ עָלֵֽי/נוּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/008.yaml
  text: The high places of Aven[a], the sin of Israel, will be destroyed. Thorn and thistle will grow up on their altars, and they will say to the mountains, “Cover us!” and to the hills, “Fall on us!”
translation:
  language: ru
  text: 'Будут уничтожены высоты Авена[a] — грех Израиля. Терновник и чертополох вырастут на их жертвенниках. Тогда они скажут горам: «Покройте нас!» — и холмам: «Падите на нас!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высоты нечестия». Еврейское слово «авен» может быть названием места, но также означает «нечестие», «беззаконие»; вероятно, здесь намеренная игра слов.'
    reason: alternative_reading
lexical_decisions:
- source_word: בָּמוֹת
  choice: высоты
  rationale: В данном контексте это культовые места на возвышенностях; традиционное «высоты» сохраняет библейский религиозный смысл, не сводя выражение к обычным географическим высотам.
- source_word: אָוֶן
  choice: Авена
  rationale: Передано как название места в родительном падеже после «высоты»; примечание сохраняет возможное нарицательное значение «нечестие» и вероятную игру слов.
- source_word: חַטַּאת יִשְׂרָאֵל
  choice: грех Израиля
  rationale: Слово חַטַּאת здесь естественно понимать как «грех», приложением характеризующий высоты; значение «жертва за грех» контексту не соответствует.
- source_word: וְנִשְׁמְדוּ
  choice: И уничтожены будут
  rationale: Форма нифаля выражает уничтожение этих культовых мест; порядок слов сохраняет торжественный пророческий тон и связь со стихом в контексте.
- source_word: קוֹץ וְדַרְדַּר
  choice: терновник и чертополох
  rationale: Пара обозначает колючую растительность как образ запустения; русские собирательные существительные звучат естественно.
- source_word: יַעֲלֶה עַל מִזְבְּחוֹתָם
  choice: вырастут на их жертвенниках
  rationale: Глагол עלה применительно к растениям означает «взойти, вырасти»; множественное сказуемое согласовано с естественным русским восприятием парного подлежащего.
- source_word: כַּסּוּנוּ
  choice: Скройте нас
  rationale: Буквально глагол означает «покройте нас», но обращённое к горам русское «скройте нас» естественно передаёт просьбу быть укрытыми, не устраняя образ полностью.
- source_word: נִפְלוּ עָלֵינוּ
  choice: Падите на нас
  rationale: Прямой императив сохранён и передаёт отчаянное желание укрыться под обрушившимися холмами.
theological_decisions:
- issue: Следует ли понимать אָוֶן как название места или как нарицательное «нечестие/беззаконие»
  choice: В основном тексте сохранено название «Авен».
  alternative: «высоты нечестия» или «высоты беззакония»
  rationale: Синтаксис допускает оба понимания, а у Осии вероятна намеренная игра между названием культового места и нравственной оценкой. Основной текст сохраняет вероятную географическую отсылку, а примечание — второе значение.
translation_notes:
  register: Современный литературный русский язык с dignified пророческим звучанием. Сохранены культовый термин «высоты», приложение «грех Израиля» и резкие повелительные обращения. Маркер [a] помещён непосредственно после неоднозначного названия.
