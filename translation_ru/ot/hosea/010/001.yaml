  text: גֶּ֤פֶן בּוֹקֵק֙ יִשְׂרָאֵ֔ל פְּרִ֖י יְשַׁוֶּה לּ֑/וֹ כְּ/רֹ֣ב לְ/פִרְי֗/וֹ הִרְבָּה֙ לַֽ/מִּזְבְּח֔וֹת כְּ/ט֣וֹב לְ/אַרְצ֔/וֹ הֵיטִ֖יבוּ מַצֵּבֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/001.yaml
  text: Israel is a luxuriant vine that yields fruit for himself[a]. The more his fruit increased, the more he multiplied altars; the better his land became[c][b], the better they made the sacred pillars.
translation:
  language: ru
  text: Израиль — пышная виноградная лоза, приносящая плод для себя[a]. Чем больше у него было плодов, тем больше жертвенников он возводил; чем лучше становилась его земля, тем наряднее они делали культовые камни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Израиль — опустевшая лоза» либо «раскидистая лоза». Значение еврейского слова неясно; основной текст следует пониманию, согласующемуся с обилием плодов и благополучием земли. Оборот «для себя» также может иметь возвратный или своекорыстный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «каменные столбы». Это были вертикально поставленные камни, служившие культовыми памятниками; здесь они связаны с осуждаемым поклонением.'
    reason: cultural_note
lexical_decisions:
- source_word: גֶּפֶן בּוֹקֵק
  choice: пышная виноградная лоза
  rationale: В контексте обилия плодов и благополучия земли спорное בּוֹקֵק, вероятнее всего, описывает буйно разросшуюся, пышную лозу; буквальная связь корня с опустошением отмечена в сноске.
- source_word: פְּרִי יְשַׁוֶּה לּוֹ
  choice: приносящая плод для себя
  rationale: Передаёт производство плода и сохраняет возможный возвратный либо своекорыстный оттенок местоименного לּוֹ, не устраняя трудность еврейского оборота.
- source_word: כְּרֹב לְפִרְיוֹ הִרְבָּה לַמִּזְבְּחוֹת
  choice: Чем больше у него было плодов, тем больше он воздвигал жертвенников
  rationale: 'Конструкция «чем… тем…» естественно передаёт пропорциональную связь: рост плодородия сопровождался умножением жертвенников.'
- source_word: כְּטוֹב לְאַרְצוֹ
  choice: чем лучше становилась его земля
  rationale: Речь идёт о благоприятном, плодородном состоянии земли, а не о её нравственной доброте.
- source_word: הֵיטִיבוּ מַצֵּבוֹת
  choice: тем наряднее они делали священные камни
  rationale: הֵיטִיבוּ обозначает улучшение или украшение, а מַצֵּבוֹת — поставленные вертикально культовые камни; перевод передаёт и действие, и назначение предметов.
theological_decisions:
- issue: Связь процветания Израиля с осуждаемым культом
  choice: Стих изображает Израиль плодоносящим и благополучным, но обращающим своё изобилие на умножение жертвенников и украшение культовых камней.
  alternative: Начальные слова можно понять как «Израиль — опустошённая лоза».
  rationale: Последующие упоминания множества плодов и хорошей земли поддерживают ироническую картину процветания, использованного для ложного поклонения, однако лексическая неоднозначность начала сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Единственное число «он» сохраняет собирательный образ Израиля; переход к «они» отражает множественное число הֵיטִיבוּ и позволяет услышать народ за собирательным именем.
