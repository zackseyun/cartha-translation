  terminology: '«Вефиль», «царь Израиля» и «На заре» удачны. «Будет окончательно уничтожен» — безопасная передача נִדְמֹה נִדְמָה в контексте, если альтернативы с оттенками «отсечён/погублен/умолкнет» сохраняются в примечании. Не следует предлагать «заставлен умолкнуть»: исходный Niphal не выражает внешнего принуждения.'
