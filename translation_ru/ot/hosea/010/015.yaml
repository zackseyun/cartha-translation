base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/015.yaml
  text: Thus Bethel has done to you because of your great evil[b][a]. At dawn the king of Israel will be utterly cut off.
translation:
  language: ru
  text: Так Вефиль поступит с вами за ваше великое зло[a]. На заре царь Израиля будет окончательно уничтожен[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за зло вашего зла»; повтор слова «зло» усиливает выражение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет непременно отсечён» либо «совершенно умолкнет». В еврейском тексте инфинитив абсолютный при личной форме глагола выражает усиление.'
    reason: alternative_reading
lexical_decisions:
- source_word: כָּכָה
  choice: Так
  rationale: Краткое указательное наречие естественно связывает приговор с предшествующим контекстом и передаёт способ или результат.
- source_word: עָשָׂה לָכֶם
  choice: поступил с вами
  rationale: В данном контексте выражение означает то, что Вефиль навлёк на адресатов; русское «поступил с вами» сохраняет образ действия без ненужного уточнения субъекта.
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: Это название места; традиционная русская форма имени уместна и не превращает топоним в нарицательное «дом Бога».
- source_word: מִפְּנֵי
  choice: за
  rationale: Предлог выражает основание воздаяния. В сочетании «за ... зло» русская конструкция естественно передаёт причинно-судебный оттенок.
- source_word: רָעַת רָעַתְכֶם
  choice: великое зло ваше
  rationale: Повтор существительного служит усилению. Такая формулировка сохраняет торжественный пророческий регистр и передаёт интенсивность без неестественного буквального повтора.
- source_word: בַּשַּׁחַר
  choice: На заре
  rationale: Передаёт конкретное время и возможный оттенок внезапности суда; звучит естественно и выразительно.
- source_word: נִדְמֹה נִדְמָה
  choice: будет окончательно уничтожен
  rationale: Инфинитив абсолютный при личной форме усиливает глагольную идею. Корень допускает значения уничтожения, отсечения или умолкания; в контексте падения царя «окончательно уничтожен» ясно передаёт решительность приговора.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямой и естественный перевод сопряжённой конструкции.
theological_decisions:
- issue: Референт «Вефиля»
  choice: Сохранён топоним «Вефиль», который в контексте может метонимически представлять культовый центр и связанную с ним вину.
  alternative: Понять название непосредственно как обозначение тельца-идола или раскрыть метонимию в основном тексте.
  rationale: Еврейский текст прямо называет место; перевод не должен заранее сужать возможный референт.
- issue: Сила повтора רָעַת
  choice: 'Повтор истолкован как усиление: «великое зло ваше».'
  alternative: Буквальное «зло вашего зла» или более экспрессивное «крайнее нечестие».
  rationale: Интенсивное значение передано естественным русским выражением, а форма оригинала отмечена в сноске.
- issue: Значение נִדְמֹה נִדְמָה
  choice: Решительное и полное уничтожение царя.
  alternative: «Будет совершенно отсечён» или «будет полностью заставлен умолкнуть».
  rationale: Контекст поддерживает гибель или устранение царя, однако лексическая многозначность корня сохраняется в сноске, без догматического уточнения характера события.
translation_notes:
  register: Современный литературный русский с кратким, торжественным пророческим звучанием. Инверсия «зло ваше» поддерживает достоинство регистра, оставаясь понятной современному читателю; неоднозначность заключительного глагола вынесена в сноску.
