base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/006.yaml
  text: Even it will be carried to Assyria as tribute for King Yareb[a]; Ephraim will receive shame[b], and Israel will be ashamed of its counsel.
translation:
  language: ru
  text: Даже он будет увезён в Ассирию как дань царю Яреву[a]. Ефрем испытает позор, и Израиль устыдится своего замысла[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. «царь Ярев». Это обозначение можно также понимать как титул: «царь-мститель» или «царь, вступающий в распрю».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «из-за своего замысла». Под «своим замыслом» может подразумеваться собственная политика или решение Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אוֹתוֹ
  choice: Даже он
  rationale: Начальная частица подчёркивает, что даже упомянутый ранее телец будет увезён. Мужской род местоимения естественно согласуется в русском с существительным «телец».
- source_word: לְאַשּׁוּר יוּבָל
  choice: будет увезён в Ассирию
  rationale: Глагол в хофале передаёт пассивное перемещение; «увезён» естественно для идола и сохраняет направление, выраженное предлогом.
- source_word: מִנְחָה
  choice: как дань
  rationale: В политическом контексте отношений с Ассирией слово обозначает подношение верховному правителю, то есть дань, а не культовую жертву.
- source_word: לְמֶלֶךְ יָרֵב
  choice: царю Яреву
  rationale: Неоднозначную форму יָרֵב основной текст сохраняет как имя или царское обозначение, не навязывая толкования; возможное значение титула вынесено в сноску.
- source_word: בָּשְׁנָה יִקָּח
  choice: пожнёт позор
  rationale: Буквально «возьмёт/получит позор». Русское «пожнёт позор» ясно передаёт обретение постыдного результата и сохраняет пророческую выразительность.
- source_word: וְיֵבוֹשׁ
  choice: устыдится
  rationale: Передаёт прямое значение формы qal — испытать стыд; параллель с предыдущей строкой сохраняется.
- source_word: מֵעֲצָתוֹ
  choice: своего замысла
  rationale: Предлог מן после בוש допускает причинно-объектное значение «стыдиться из-за/стыдиться чего-либо». Возвратное «своего» передаёт отнесённость замысла к Израилю как собирательному субъекту, не вводя отдельного мужского лица.
theological_decisions:
- issue: Понимание יָרֵב
  choice: Передать как царское имя/обозначение «Ярев»
  alternative: «царь-мститель» или «царь, вступающий в распрю»
  rationale: Форма допускает как ономастическое, так и описательное прочтение. Транслитерация в основном тексте сохраняет неоднозначность, а смысловые варианты отмечены в сноске.
- issue: К кому относится суффикс в מֵעֲצָתוֹ
  choice: 'Отнести к Израилю как собирательному субъекту: «своего замысла»'
  alternative: 'Отнести к тельцу/идолу: «его замысла»; либо перевести причинно: «из-за своего замысла»'
  rationale: Ближайшая смысловая связь — с политикой или решением самого Израиля/Ефрема. Русское возвратное местоимение позволяет естественно передать корпоративную отнесённость, не превращая идола в личного советника и не устраняя возможного причинного оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и ритмичный; «телец» из контекста обозначен местоимением мужского рода. Все смысловые неоднозначности, существенные для понимания, сохранены в сносках.
