base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/005.yaml
  text: The inhabitants of Samaria tremble for the calves of Beth-aven, because its people mourn over it, and its idolatrous priests wail over it, over its glory, because it has departed from it.
translation:
  language: ru
  text: Жители Самарии трепещут за тельцов Бет-Авена[a]. Его народ скорбит о нём, а его жрецы ликуют о нём — о его славе, потому что она покинула его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бет-Авен — «дом нечестия»; уничижительное название Бет-Эля («дома Божьего»), ставшего местом культа тельцов.
    reason: Поясняет пророческую игру названий и её полемический смысл, не расходясь с множественным числом «тельцов» в стихе.
lexical_decisions:
- source_word: יָגוּרוּ
  choice: трепещут
  rationale: Передаёт страх и тревогу жителей Самарии за культовый образ; форма допускает значение испуга или трепета.
- source_word: עֶגְלוֹת
  choice: тельцов
  rationale: Формально множественное число «телицы/телята»; в контексте культа уместно привычное русское обозначение идолов как «тельцов», не исправляя число по предполагаемому единственному образу.
- source_word: כְמָרָיו
  choice: жрецы
  rationale: Редкое слово обозначает служителей идольского культа; «жрецы» естественно и без лишнего пояснения передаёт отрицательно окрашенный контекст.
- source_word: יָגִילוּ
  choice: ликуют
  rationale: Обычное значение глагола — «ликовать, радоваться». Сохраняется резкое смысловое напряжение с предшествующим «скорбит», а не заменяется толкованием «рыдают».
- source_word: גָלָה
  choice: покинула
  rationale: 'Буквально связано с уходом или удалением, также с изгнанием; здесь подлежащее «слава», поэтому естественно: «она покинула его».'
theological_decisions:
- issue: Соотношение скорби народа и ликования жрецов
  choice: Сохранить буквальное «жрецы ликуют»
  alternative: «жрецы рыдают/причитают»
  rationale: Масоретский текст содержит יָגִילוּ, обычно «ликуют». Возможную иронию, культовое ликование или текстовую трудность не следует без рукописного основания сглаживать заменой на плач.
- issue: Референт местоимений и «славы»
  choice: Оставить мужской референт «он/его» для культового тельца и женское «она» для славы
  alternative: Перестроить фразу так, будто сама слава отправляется в плен, с явным толкованием
  rationale: Еврейские местоимения допускают отнесение к культовому объекту; русский текст сохраняет последовательность и не добавляет отсутствующих деталей.
translation_notes:
  register: Современный литературный русский с библейской торжественностью без архаизмов. Синтаксис сохраняет контраст и напряжение еврейского текста; тире помогает ясно связать ликование со «славой».
