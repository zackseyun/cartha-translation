  text: כִּ֤י עַתָּה֙ יֹֽאמְר֔וּ אֵ֥ין מֶ֖לֶךְ לָ֑/נוּ כִּ֣י לֹ֤א יָרֵ֨אנוּ֙ אֶת יְהֹוָ֔ה וְ/הַ/מֶּ֖לֶךְ מַה יַּֽעֲשֶׂה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/010/003.yaml
  text: For now they will say[a], “We have no king, because we did not fear Yahweh[b]; and the king—what can he do for us?”
translation:
  language: ru
  text: 'Ибо теперь они скажут: «Нет у нас царя, потому что мы не боялись Яхве[a]. А царь — что он может для нас сделать[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «потому что мы не боимся Яхве»; возможно также: «потому что мы не боялись Яхве доныне». Еврейский перфект может описывать как сложившееся состояние, так и прошлую виновную неудачу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «что он сделает для нас?» Еврейская форма обозначает будущее; основной текст передаёт риторический смысл — неспособность царя помочь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי עַתָּה
  choice: Ибо теперь
  rationale: Сочетание вводит объяснение наступающего положения; «ибо» передаёт пояснительную связь, а «теперь» — временное значение עַתָּה.
- source_word: יֹאמְרוּ
  choice: они скажут
  rationale: Имперфект 3-го лица множественного числа в пророческом контексте естественно понимать как предсказание будущего признания.
- source_word: אֵין מֶלֶךְ לָנוּ
  choice: Нет у нас царя
  rationale: Естественная русская конструкция сохраняет экзистенциальное значение אֵין и оттенок принадлежности в לָנוּ.
- source_word: לֹא יָרֵאנוּ אֶת יְהוָה
  choice: мы не боялись Яхве
  rationale: Перфект допускает указание на прошлое виновное неисполнение; глагол «бояться» сохраняет полноту библейского понятия страха, включающего благоговение и послушание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его отличие от титула «Господь».
- source_word: וְהַמֶּלֶךְ מַה יַּעֲשֶׂה לָּנוּ
  choice: А царь — что он может для нас сделать?
  rationale: «А» естественно оформляет резкий риторический поворот; модальное «может» передаёт подразумеваемое бессилие царя, тогда как формально глагол имеет значение будущего времени.
theological_decisions:
- issue: Значение выражения «бояться Яхве»
  choice: Сохранить глагол «бояться»
  alternative: «почитать Яхве» / «благоговеть перед Яхве»
  rationale: Еврейский ירא охватывает страх, благоговение и послушное признание Божьей власти. Прямая передача не смягчает обвинение Осии и сохраняет богословское напряжение.
- issue: Временное значение יָרֵאנוּ
  choice: «мы не боялись»
  alternative: «мы не боимся» / «мы не боялись доныне»
  rationale: Перфект может обозначать как виновную прошлую неудачу, так и сложившееся состояние; основной текст выбирает естественное прочтение как объяснение наступившего безвластия, а неоднозначность отмечена в сноске.
- issue: Смысл вопроса о царе
  choice: «что он может для нас сделать?»
  alternative: «что он сделает для нас?»
  rationale: Хотя יַעֲשֶׂה формально выражает будущее, вопрос риторически подчёркивает неспособность царя помочь. Формальная альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и обличительным звучанием. Инверсия «Нет у нас царя» сохраняет выразительность признания, а тире перед вопросом воспроизводит резкий риторический поворот.
