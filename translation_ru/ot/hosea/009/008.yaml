  text: צֹפֶ֥ה אֶפְרַ֖יִם עִם אֱלֹהָ֑/י נָבִ֞יא פַּ֤ח יָקוֹשׁ֙ עַל כָּל דְּרָכָ֔י/ו מַשְׂטֵמָ֖ה בְּ/בֵ֥ית אֱלֹהָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/008.yaml
  text: Ephraim’s watchman is with my God[a]; the prophet is a fowler’s snare on all his ways[b], and hostility is in the house of his God.
translation:
  language: ru
  text: Страж Ефрема — с моим Богом[a]; пророк — силок птицелова на всех его путях, а в доме его Бога — вражда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Ефрем — страж вместе с моим Богом; пророк — силок птицелова на всех его путях». Синтаксис еврейского текста труден; некоторые понимают первую фразу положительно, прежде чем стих переходит к обвинению.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «неприязнь», «ненависть». Еврейское слово обозначает враждебность или вражду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹפֶה
  choice: страж
  rationale: Причастие от צפה обозначает того, кто наблюдает и стоит на страже; «страж» естественно сохраняет библейский образ пророка-наблюдателя.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Традиционная русская форма названия колена и Северного царства.
- source_word: עִם אֱלֹהָי
  choice: с моим Богом
  rationale: Предлог עִם обычно означает «с», а суффикс первого лица в אֱלֹהָי требует сохранить «моим Богом», несмотря на необычность синтаксиса.
- source_word: נָבִיא
  choice: пророк
  rationale: Единственное число передано буквально; в данном контексте слово, вероятно, обозначает пророческую фигуру, связанную с Ефремом.
- source_word: פַּח יָקוֹשׁ
  choice: западня птицелова
  rationale: Сочетание двух слов из лексики ловли передано естественным русским образом намеренно устроенной ловушки.
- source_word: עַל כָּל דְּרָכָיו
  choice: на всех его путях
  rationale: Формулировка сохраняет предлог, местоименный суффикс и широкую метафору жизненных путей или поведения.
- source_word: מַשְׂטֵמָה
  choice: вражда
  rationale: Существительное означает враждебность, неприязнь или ненависть; «вражда» сохраняет как внутреннюю неприязнь, так и активное противостояние.
- source_word: בְּבֵית אֱלֹהָיו
  choice: в доме его Бога
  rationale: Буквально сохранены «дом» и местоименный суффикс третьего лица; перевод не уточняет «храм», чтобы не сужать образ.
theological_decisions:
- issue: 'Смена перспективы: «моим Богом» и «его Бога»'
  choice: 'Сохранить различие местоимений: «с моим Богом» и «в доме его Бога».'
  alternative: Сгладить обе формулы до «с Богом» и «в доме Бога» либо согласовать их по лицу.
  rationale: Масоретский текст содержит резкую смену местоимений. Ее сохранение не устраняет возможное напряжение между пророком и религиозным устройством Ефрема.
- issue: Синтаксическая связь слов «страж» и «пророк»
  choice: В основном тексте первая фраза оставлена краткой и неоднозначной, а последующая характеристика пророка звучит как обвинение.
  alternative: 'Понять первую фразу положительно: «Ефрем — страж вместе с моим Богом», после чего отнести обвинение к иному пророку.'
  rationale: Контекст носит обвинительный характер, но еврейский синтаксис труден и допускает более положительное понимание первой части; поэтому альтернатива вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Краткие именные конструкции и повтор слова «Бог» сохраняют напряженность и необычную структуру еврейского текста; неоднозначность не сглаживается.
