  text: כִּֽי הִנֵּ֤ה הָֽלְכוּ֙ מִ/שֹּׁ֔ד מִצְרַ֥יִם תְּקַבְּצֵ֖/ם מֹ֣ף תְּקַבְּרֵ֑/ם מַחְמַ֣ד לְ/כַסְפָּ֗/ם קִמּוֹשׂ֙ יִֽירָשֵׁ֔/ם ח֖וֹחַ בְּ/אָהֳלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/006.yaml
  text: For behold[a], they have gone away from destruction; Egypt will gather them, Memphis will bury them. Nettles will possess the precious things of their silver; thorns will be in their tents.
translation:
  language: ru
  text: Ибо вот, они ушли, спасаясь от разорения; Египет соберёт их, Мемфис похоронит их. Крапива[a] завладеет их драгоценностями из серебра; в их шатрах будут колючки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское название растения точно не установлено; возможно, речь идёт о крапиве или другой сорной колючей поросли.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשֹּׁד
  choice: спасаясь от разорения
  rationale: שֹׁד означает насильственное разорение, опустошение или гибель. Оборот передаёт бегство от бедствия, но не подразумевает успешного избавления, поскольку далее говорится о смерти в Египте.
- source_word: מִצְרַיִם
  choice: Египет
  rationale: Общепринятое русское название страны; в стихе Египет персонифицирован как тот, кто соберёт беглецов.
- source_word: תְּקַבְּצֵם
  choice: соберёт их
  rationale: 'Форма Piel глагола קבץ означает «собирать». Сохранена ирония: слово, нередко связанное с благим собиранием народа, здесь относится к изгнанию и смерти.'
- source_word: מֹף
  choice: Мемфис
  rationale: מֹף — древнеегипетский город Мемфис; используется его общепринятое историческое название.
- source_word: תְּקַבְּרֵם
  choice: похоронит их
  rationale: קבר прямо означает «хоронить». Параллелизм «Египет соберёт — Мемфис похоронит» усиливает тему суда.
- source_word: מַחְמַד לְכַסְפָּם
  choice: их серебряными сокровищами
  rationale: מַחְמַד обозначает желанное, ценное имущество, а כֶּסֶף — серебро или деньги. Выражение передано естественно по-русски как ценные серебряные вещи, без сведения смысла к абстрактному серебру.
- source_word: קִמּוֹשׂ
  choice: крапива
  rationale: Термин обозначает нежелательное растение, захватывающее заброшенные места; точная ботаническая идентификация не вполне ясна. «Крапива» сохраняет традиционный конкретный образ, а неопределённость отмечена в сноске.
- source_word: יִירָשֵׁם
  choice: завладеет
  rationale: ירשׁ может означать «наследовать», «владеть», «завладеть». Здесь растение иронически становится владельцем оставленных ценностей.
- source_word: חוֹחַ
  choice: колючки
  rationale: חוֹחַ — общее название колючего растения. «Колючки» понятно современному читателю и не создаёт ложной ботанической точности.
- source_word: בְּאָהֳלֵיהֶם
  choice: в их шатрах
  rationale: אֹהֶל буквально означает шатёр. Сохранён поэтический образ покинутых жилищ.
theological_decisions:
- issue: Смысл выражения הָלְכוּ מִשֹּׁד
  choice: они ушли, спасаясь от разорения
  alternative: они ушли от разорения; они ушли из-за разорения
  rationale: 'Контекст говорит не об окончательном спасении, а о тщетном бегстве: Египет собирает беглецов, а Мемфис становится местом их погребения. Деепричастный оборот выражает цель движения, не утверждая, что им удалось избежать суда.'
translation_notes:
  register: Современный литературный русский язык с поэтическим параллелизмом и сдержанно возвышенным библейским регистром. Сохранены персонификация Египта и Мемфиса, образ шатров и ироническое «завладение» оставленными ценностями.
