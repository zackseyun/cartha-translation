source:
  edition: WLC
  text: גֹּ֥רֶן וָ/יֶ֖קֶב לֹ֣א יִרְעֵ֑/ם וְ/תִיר֖וֹשׁ יְכַ֥חֶשׁ בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/002.yaml
  text: Threshing floor and winepress will not feed them[a], and new wine will fail her.
translation:
  language: ru
  text: Гумно и давильня не прокормят их, и молодое вино обманет её[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не оправдает её надежд», «окажется неверным ей». Еврейский глагол может означать, что ожидаемое не исполнится.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן
  choice: гумно
  rationale: Существительное обозначает место молотьбы и метонимически урожай зерна. Конкретный образ сохранён.
- source_word: יֶקֶב
  choice: давильня
  rationale: Слово обозначает место или устройство для выжимания винограда. «Давильня» ясно передаёт сельскохозяйственный образ и образует естественную пару с гумном.
- source_word: יִרְעֵם
  choice: не прокормят их
  rationale: Форма от רעה означает «кормить, пасти». При неодушевлённых подлежащих речь идёт об обеспечении пищей; «не прокормят» естественно передаёт этот смысл.
- source_word: תִירוֹשׁ
  choice: молодое вино
  rationale: Термин обозначает свежий продукт винограда, молодое вино, а не вино вообще; перевод сохраняет образ ожидаемого урожая.
- source_word: יְכַחֶשׁ
  choice: обманет
  rationale: Глагол כחש может означать «лгать, оказаться неверным, не оправдать ожиданий». «Обманет» сохраняет олицетворение и семантическую напряжённость исходного текста; более объяснительные варианты вынесены в примечание.
- source_word: בָּהּ
  choice: её
  rationale: Суффикс имеет форму 3-го лица женского рода единственного числа и, вероятнее всего, относится к Израилю/Ефрему как олицетворённому народу. Женский род сохранён без сглаживания к множественному числу.
theological_decisions:
- issue: Референт суффикса женского рода единственного числа в בָּהּ
  choice: '«её»: Израиль/Ефрем представлен как женщина'
  alternative: «их» как собирательное обозначение народа либо «её» с отнесением к земле
  rationale: Это литературно-контекстуальное, а не конфессиональное решение. Женское олицетворение народа обычно для Осии; сохранение формы исходного текста не устраняет возможную контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением конкретной сельскохозяйственной образности. «Гумно» — традиционное, но всё ещё понятное библейско-аграрное слово; «давильня» яснее для широкого читателя, чем специальное «точило». Олицетворяющее «обманет её» намеренно сохраняет резкость и неоднозначность еврейского выражения.
