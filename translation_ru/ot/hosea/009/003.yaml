  yaml_path: translation/ot/hosea/009/003.yaml
  text: They will not remain in the land of Yahweh[a]; Ephraim will return to Egypt[c][b], and in Assyria they will eat unclean food.
translation:
  language: ru
  text: Они не останутся в земле Господа[a]. Ефрем возвратится в Египет[b], и в Ассирии они будут есть нечистую пищу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будут жить в земле Господа».'
    reason: lexical_alternative
  - marker: b
    text: «Египет» может обозначать буквальное место либо образ нового рабства и изгнания; еврейский текст сохраняет это смысловое напряжение, одновременно упоминая Ассирию.
    reason: alternative_reading
  - marker: c
    text: 'Или: «будут есть нечистое».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: не останутся
  rationale: В контексте суда и изгнания יָשַׁב означает не просто «жить», а продолжать находиться в земле; «не останутся» естественно передаёт эту направленность.
- source_word: בְּאֶרֶץ יְהוָה
  choice: в земле Господа
  rationale: Формулировка сохраняет мысль о принадлежности земли Богу и её заветном значении; имя יהוה передано принятой русской библейской формой «Господь».
- source_word: וְשָׁב
  choice: возвратится
  rationale: Форма в пророческой речи имеет будущее значение; глагол сохраняет мотив возвращения, существенный для упоминания Египта.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Сохранено прямо названное в еврейском тексте имя, метонимически обозначающее северное царство, без замены толкованием «Израиль».
- source_word: מִצְרַיִם
  choice: Египет
  rationale: Сохранено географическое название, чтобы не устранять возможное напряжение между буквальным и образно-типологическим смыслом.
- source_word: וּבְאַשּׁוּר
  choice: а в Ассирии
  rationale: Русский союз «а» естественно связывает две соотнесённые части и позволяет ясно обозначить смену места, не превращая связь в резкое противопоставление.
- source_word: טָמֵא יֹאכֵלוּ
  choice: будут есть нечистую пищу
  rationale: Субстантивированное прилагательное טָמֵא передано с добавлением подразумеваемого слова «пища»; «нечистую» сохраняет ритуально-заветный смысл.
theological_decisions:
- issue: Буквальный или образный смысл возвращения в Египет
  choice: В основном тексте сохранено буквальное название «Египет» без разрешения вопроса о характере предсказания.
  alternative: Понимать Египет исключительно как образ нового рабства или изгнания либо считать Ассирию единственным буквальным местом ссылки.
  rationale: Еврейский текст прямо упоминает и Египет, и Ассирию. Перевод должен сохранять это напряжение, а не согласовывать названия путём толкования.
- issue: Культовый смысл טָמֵא
  choice: нечистую пищу
  alternative: осквернённую пищу; нечистое
  rationale: В контексте удаления из земли Господа речь идёт прежде всего о ритуальной и заветной нечистоте, а не о гигиене или качестве еды.
translation_notes:
  register: Современный литературный русский язык с сдержанным библейским достоинством. Синтаксис ясен для обычного читателя; богословская неоднозначность упоминаний Египта и Ассирии сохранена.
