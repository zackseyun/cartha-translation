  yaml_path: translation/ot/hosea/009/014.yaml
  text: Give them[a], O Yahweh—what will you give? Give them a miscarrying womb and dry breasts.
translation:
  language: ru
  text: Дай им, Яхве, — что Ты дашь? Дай им утробу, губящую плод[a], и иссохшие груди.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утробу, лишающую детей». Еврейское причастие может обозначать утрату плода, а также более широко — лишение детей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּן
  choice: дай
  rationale: Императив נתן в прямом обращении к Богу; «дай» сохраняет краткость, силу и молитвенный характер просьбы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем, а не заменяющим его титулом; форма «Яхве» привычна в современном русском библейском употреблении.
- source_word: מַה תִּתֵּן
  choice: что ты им дашь?
  rationale: Вопросительное местоимение с имперфектом образует риторический вопрос и передаёт мучительную паузу пророка перед конкретизацией просьбы.
- source_word: רֶחֶם
  choice: утробу
  rationale: «Утроба» естественно передаёт образ места зачатия и вынашивания и соответствует возвышенному, но понятному регистру.
- source_word: מַשְׁכִּיל
  choice: не вынашивающую детей
  rationale: Причастие от שכל в каузативной форме может обозначать потерю детей или выкидыш. В сочетании с «утробой» выбранная формулировка ясно выражает репродуктивное бедствие, не вводя медицинской терминологии.
- source_word: שָׁדַיִם
  choice: груди
  rationale: Прямой конкретный эквивалент сохраняет телесный и суровый образ исходного текста.
- source_word: צֹמְקִים
  choice: иссохшие
  rationale: Причастие описывает груди, лишённые молока; «иссохшие» передаёт и отсутствие питания, и состояние увядания, оставаясь естественным для литературного русского языка.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. Его транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Характер просьбы о суде
  choice: Сохранена прямая просьба «дай им» без смягчения
  alternative: Передать как простое предсказание бесплодия
  rationale: Грамматика содержит императивы, обращённые к Яхве. Суровое напряжение молитвы пророка не следует превращать в нейтральное сообщение.
- issue: Значение מַשְׁכִּיל
  choice: не вынашивающую детей
  alternative: лишающую детей
  rationale: Контекст утробы поддерживает значение выкидыша или невозможности выносить ребёнка, однако более широкое значение утраты детей остаётся возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с сохранением краткого, резкого параллелизма оригинала. Обращение к Богу передано со строчной буквы по общим правилам современного издания; тире отмечает эмоциональную паузу. Телесные образы не смягчены.
