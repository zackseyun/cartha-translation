  text: בָּ֣אוּ יְמֵ֣י הַ/פְּקֻדָּ֗ה בָּ֚אוּ יְמֵ֣י הַ/שִׁלֻּ֔ם יֵדְע֖וּ יִשְׂרָאֵ֑ל אֱוִ֣יל הַ/נָּבִ֗יא מְשֻׁגָּע֙ אִ֣ישׁ הָ/ר֔וּחַ עַ֚ל רֹ֣ב עֲוֺנְ/ךָ֔ וְ/רַבָּ֖ה מַשְׂטֵמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/007.yaml
  text: The days of punishment have come[a]; the days of repayment have come; Israel will know it. The prophet is a fool; the man of the spirit is mad[c][b], because of the greatness of your iniquity and your great hostility.
translation:
  language: ru
  text: Пришли дни наказания[a], пришли дни воздаяния — Израиль узнает это. Пророк — глупец, человек духа — безумен[b] из-за множества твоих беззаконий и великой вражды[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дни расплаты»; «дни посещения». Здесь имеется в виду карающее Божье посещение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пророк глуп, вдохновлённый человек безумен». Выражение «человек духа» может обозначать человека, притязающего на духовное вдохновение. Некоторые понимают эти слова как презрительную реплику народа об истинном пророке; в еврейском тексте она не выделена как цитата.'
    reason: alternative_reading
  - marker: c
    text: 'Или: «из-за обилия твоей вины и великой ненависти». Не уточняется, на кого направлена эта вражда или ненависть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדָּה
  choice: наказание
  rationale: В контексте пророческого суда слово обозначает карающее посещение или час расплаты; «наказание» ясно передаёт этот смысл по-русски.
- source_word: שִׁלֻּם
  choice: воздаяние
  rationale: Слово выражает идею отплаты по делам. «Воздаяние» естественно сочетается с судебным контекстом и сохраняет параллель с наказанием.
- source_word: יֵדְעוּ יִשְׂרָאֵל
  choice: Израиль узнает это
  rationale: 'Имперфект понят как предсказание: Израиль на опыте осознает реальность объявленного суда. Местоимение «это» добавлено для естественности русского синтаксиса.'
- source_word: אֱוִיל
  choice: глупец
  rationale: Именное сказуемое сохраняет резкий, обличительный тон еврейского текста.
- source_word: מְשֻׁגָּע
  choice: безумец
  rationale: Передаёт состояние безумия и звучит резко, но достойно и не разговорно.
- source_word: אִישׁ הָרוּחַ
  choice: человек духа
  rationale: 'Близкая к форме оригинала передача сохраняет неоднозначность: речь может идти о вдохновлённом человеке либо о том, кто притязает на вдохновение. Строчная буква не навязывает отождествления со Святым Духом.'
- source_word: עַל רֹב עֲוֺנְךָ
  choice: из-за множества твоих беззаконий
  rationale: עַל вводит причину, רֹב указывает на многочисленность или обилие, а עָוֹן несёт нравственно-религиозный смысл беззакония и вины.
- source_word: מַשְׂטֵמָה
  choice: вражда
  rationale: Слово означает вражду, ненависть или неприязнь; «вражда» сохраняет неопределённость её объекта.
theological_decisions:
- issue: К кому относится обличение «Пророк — глупец, человек духа — безумец»
  choice: В основном тексте слова представлены без кавычек как обличение пророческих деятелей или лиц, притязающих на вдохновение, которые будут изобличены в день суда.
  alternative: Это может быть не отмеченная формально цитата, передающая презрительные слова народа об истинном пророке.
  rationale: Еврейский текст не содержит явного показателя цитирования. Поэтому основной текст не вводит кавычек, а спорное понимание сохраняется в примечании.
- issue: Значение «духа» в выражении אִישׁ הָרוּחַ
  choice: Сохранено буквальное «человек духа» со строчной буквы.
  alternative: «Вдохновлённый человек», возможно вдохновлённый Духом Божьим.
  rationale: Контекст не требует прямо отождествлять רוּחַ со Святым Духом; буквальная формулировка сохраняет богословскую неоднозначность.
- issue: Связь заключительной причины с предшествующим высказыванием
  choice: «Из-за множества твоих беззаконий и великой вражды» оставлено без уточнения, объясняет ли это суд, состояние пророческих деятелей или неприязнь народа к пророку.
  alternative: Можно синтаксически связывать причину преимущественно либо с объявленным судом, либо с отношением народа к истинному пророку.
  rationale: Краткость еврейского текста допускает разные связи; перевод не должен молча устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «пришли дни» сохранён как риторический параллелизм. Тире перед «Израиль узнает это» подчёркивает итог объявления, не меняя смысла. Формулировки краткие и резкие, как в оригинале; неоднозначные места вынесены в примечания.
