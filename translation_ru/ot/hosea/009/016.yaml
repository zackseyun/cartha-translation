base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/016.yaml
  text: Ephraim is stricken[a]; their root is dried up; they will bear no fruit. Even if they give birth[b], I will put to death the cherished ones of their womb.
translation:
  language: ru
  text: Ефрем поражён; их корень засох, они не принесут плода. Даже если они родят, Я предам смерти дорогих им детей, рождённых ими[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Буквально: «дорогих, или драгоценных, [детей] их утробы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻכָּה
  choice: поражён
  rationale: Пассивная форма от נכה обозначает нанесённый удар и возникшее вследствие него состояние. «Поражён» сохраняет краткость и суровый пророческий тон.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Собственное имя передано в принятой русской библейской форме; здесь оно служит собирательным обозначением северного царства.
- source_word: שָׁרְשָׁם
  choice: корень их
  rationale: Местоименный суффикс в еврейском тексте имеет множественное число, хотя «Ефрем» грамматически стоит в единственном и обозначает народ как единое целое. Русский перевод сохраняет этот смысловой переход.
- source_word: יָבֵשׁ
  choice: засох
  rationale: Глагол описывает наступившее состояние корня. «Засох» естественно звучит в растительном образе и ясно ведёт к последующему бесплодию.
- source_word: פְּרִי בלי יַעֲשׂוּן
  choice: плода они не принесут
  rationale: Перевод сохраняет растительную метафору и отрицательное значение конструкции בלי с глаголом; образ плода затем переходит в тему рождения детей.
- source_word: גַּם כִּי
  choice: даже если
  rationale: 'В данном контексте сочетание вводит уступительное усиление: даже возможное рождение детей не отменит суда.'
- source_word: יֵלֵדוּן
  choice: они родят
  rationale: Краткая современная формулировка ясно переводит переход от растительного образа к человеческому рождению.
- source_word: וְהֵמַתִּי
  choice: Я предам смерти
  rationale: Форма первого лица каузатива от מות прямо приписывает действие Богу. Формулировка сохраняет эту прямую ответственность и торжественную суровость.
- source_word: מַחֲמַדֵּי בִטְנָם
  choice: тех, кто им дорог, — детей их утробы
  rationale: מַחֲמַדֵּי обозначает дорогих, драгоценных или желанных, а בטן в контексте рождения — утробу. Добавленное поясняющее «детей» делает смысл естественным по-русски, не устраняя образ утробы.
theological_decisions:
- issue: Прямое участие Бога в совершающемся суде
  choice: 'Сохранить первое лицо: «Я предам смерти»'
  alternative: 'Обезличить последствие: «они умрут»'
  rationale: Еврейский текст прямо употребляет глагол первого лица единственного числа и приписывает действие говорящему Богу; перевод не должен смягчать или скрывать эту богословски трудную формулировку.
translation_notes:
  register: Современный литературный русский с кратким, суровым пророческим ритмом. Сохранены растительная метафора, переход от собирательного единственного числа к множественному, образ утробы и явное первое лицо Божественного суда.
