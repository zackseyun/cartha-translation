base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/005.yaml
  text: What will you do on the day of appointed assembly[a], and on the day of the feast of Yahweh?
translation:
  language: ru
  text: Что вы будете делать в назначенный день[a], в день праздника Яхве?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в день священного собрания»; еврейское מוֹעֵד может означать назначенное время или срок, а также священное собрание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: Что
  rationale: Вопросительное местоимение вводит риторический вопрос; прямое «что» естественно передаёт его смысл.
- source_word: תַּעֲשׂוּ
  choice: вы будете делать
  rationale: Форма qal imperfect, 2-е лицо множественного числа, указывает на действия народа в предстоящих обстоятельствах; будущее время естественно по-русски.
- source_word: לְיוֹם
  choice: в день
  rationale: Предлог לְ здесь имеет временное значение; русское «в день» точно и естественно передаёт его.
- source_word: מוֹעֵד
  choice: назначенное собрание
  rationale: Слово может обозначать назначенное время или установленное культовое собрание. В параллели с חַג выражение «назначенное собрание» сохраняет культовый оттенок, не отождествляя два термина.
- source_word: וּלְיוֹם
  choice: и в день
  rationale: Повтор временной конструкции сохраняет еврейский параллелизм и обеспечивает ясность.
- source_word: חַג
  choice: праздник
  rationale: Слово обозначает религиозный праздник, нередко паломнический; «праздник» является ясным и современным русским соответствием.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; «Яхве» сохраняет личное имя и следует наиболее принятой научной реконструкции произношения.
- issue: Различение מוֹעֵד и חַג
  choice: «назначенное собрание» и «праздник»
  alternative: Передать оба слова общей праздничной лексикой
  rationale: Еврейский текст использует близкие, но не тождественные понятия. Их различение сохраняет параллелизм и смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным риторическим строем. Повтор «в день» сохранён ради параллелизма; неоднозначность מוֹעֵד вынесена в сноску.
