  edition: WLC
  text: כִּ֤י אִם יְגַדְּלוּ֙ אֶת בְּנֵי/הֶ֔ם וְ/שִׁכַּלְתִּ֖י/ם מֵֽ/אָדָ֑ם כִּֽי גַם א֥וֹי לָ/הֶ֖ם בְּ/שׂוּרִ֥/י מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/012.yaml
  text: Even if they raise their children[a], I will bereave them so that not a man remains; for indeed[b], woe to them when I depart from them.
translation:
  language: ru
  text: Даже если они вырастят своих детей[a], Я лишу их детей, так что не останется ни одного человека. Ибо горе им, когда Я удалюсь от них[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своих сыновей». Еврейское слово может обозначать именно сыновей, но нередко относится к детям или потомству вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда Я отвернусь от них». Еврейское выражение может указывать на Божье удаление или отвращение от них в час суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Даже если
  rationale: 'В данном контексте сочетание вводит уступительное условие: даже если дети доживут до зрелости, суда не избежать.'
- source_word: יְגַדְּלוּ
  choice: вырастят
  rationale: Порода пиэль глагола גדל здесь означает вырастить, воспитать детей; «вырастят» естественно передаёт достижение ими зрелости.
- source_word: בְּנֵיהֶם
  choice: своих детей
  rationale: בנים может обозначать как сыновей, так и потомство в более широком смысле. В основном тексте выбран естественный собирательный эквивалент, а более узкое значение отмечено в сноске.
- source_word: וְשִׁכַּלְתִּים
  choice: Я лишу их детей
  rationale: Глагол שׁכל означает сделать бездетными, причинить утрату детей. Русская формулировка ясно сохраняет трагический смысл тяжёлой утраты.
- source_word: מֵאָדָם
  choice: так что ни одного не останется
  rationale: Трудное сочетание буквально связано с лишением человека или людей. В контексте оно усиливает предшествующую угрозу до полного отсутствия уцелевших детей; формулировка не вводит отвлечённого значения «человечество».
- source_word: כִּי גַם
  choice: Да
  rationale: Сочетание усиливает последующее возвещение горя. Краткое «Да» естественно передаёт эмфатическую функцию без тяжеловесного причинного оборота.
- source_word: אוֹי לָהֶם
  choice: горе им
  rationale: Устойчивое пророческое восклицание одновременно выражает скорбь и объявляет суд.
- source_word: בְּשׂוּרִי מֵהֶם
  choice: когда Я удалюсь от них
  rationale: Инфинитив от סור с предлогом ב и суффиксом первого лица указывает на время или обстоятельство Божьего удаления от народа.
theological_decisions:
- issue: Смысл Божьего удаления в заключительной части стиха
  choice: Бог удаляется от народа, и это составляет часть суда.
  alternative: Бог отворачивается от них.
  rationale: Суффикс первого лица в בְּשׂוּרִי указывает на действие самого Бога. Перевод сохраняет образ лишения Божьего присутствия и благоволения, не разворачивая его в дополнительное богословское толкование.
- issue: Объём угрозы в выражении מֵאָדָם
  choice: Ни одного из выращенных ими детей не останется.
  alternative: Они будут лишены людей вообще.
  rationale: Контекст непосредственно говорит об их детях, поэтому эллиптическая русская формулировка связывает угрозу с потомством, но сохраняет предельную полноту суда.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Повтор «детей» намеренно сохраняет ясность объекта утраты; короткое «Да» передаёт усиление, а финальный восклицательный знак — силу возвещения горя.
