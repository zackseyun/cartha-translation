  - severity: low
    issue: «Да, горе им» недостаточно точно передаёт כִּי גַם.
    rationale: «Да» в русском обычно служит подтверждением, тогда как כִּי גַם здесь вводит усиленное объяснение/возвещение. «Ибо горе им» естественнее и ближе к функции оригинала.
