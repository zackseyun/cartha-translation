- from: Даже если они вырастят своих детей[a], Я лишу их детей, так что ни одного не останется. Да, горе им, когда Я удалюсь от них[b]!
  to: Даже если они вырастят своих детей[a], Я лишу их детей, так что не останется ни одного человека. Ибо горе им, когда Я удалюсь от них[b]!
  rationale: Правка сохраняет трудность и широту מֵאָדָם через явное «ни одного человека», не навязывая более узкое отнесение только к детям. «Ибо» точнее передаёт связь כִּי גַם и поддерживает торжественный пророческий регистр. Сноска b сокращена, чтобы оставить оттенок Божьего удаления как лексическую возможность, а не развёрнутое богословское объяснение.
