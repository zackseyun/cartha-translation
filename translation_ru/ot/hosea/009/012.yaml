  verdict: revise
  source_fidelity: 'Основной смысл передан верно: уступительное условие, выращивание детей, Божье лишение потомства и Божье удаление как суд сохранены. Однако «так что ни одного не останется» оставляет невыраженным אדם («человек») и вслед за контекстуальным толкованием сужает референт до детей. Безопаснее явно сохранить слово «человек», не разрешая трудное выражение более узко, чем позволяет еврейский текст.'
  naturalness: «Я лишу их детей» — естественная современная формулировка тяжёлой утраты. «Так что не останется ни одного человека» ясно и литературно. «Ибо горе им» лучше передаёт пророческую, причинно-усилительную связку כִּי גַם, чем разговорно-утвердительное «Да, горе им».
  terminology: «Дети» с примечанием о возможном значении «сыновья» оправдано. «Горе им» и «когда Я удалюсь от них» сохраняют пророческий регистр и первое лицо Бога. Сноска b корректно отмечает вариант «отвернусь», но её пояснение следует формулировать как возможный оттенок выражения, а не как однозначно развёрнутое толкование.
