  source_fidelity: «Они глубоко погрязли в пороке» естественно передаёт сжатую интенсивную конструкцию הֶעְמִיקוּ שִׁחֵתוּ, сохраняя образ глубокого погружения и смысл тяжёлой нравственной порчи. «Как во дни Гивы» точно передаёт историческое сравнение. Будущие формы «вспомнит» и «взыщет» соответствуют еврейским имперфектам; единственное число «беззаконие» и множественное «грехи» также сохранены. «Взыщет за их грехи» в данном контексте верно выражает судебное значение יִפְקֹד.
