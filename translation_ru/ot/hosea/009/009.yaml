  text: הֶעְמִֽיקוּ שִׁחֵ֖תוּ כִּ/ימֵ֣י הַ/גִּבְעָ֑ה יִזְכּ֣וֹר עֲוֺנָ֔/ם יִפְק֖וֹד חַטֹּאותָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/009.yaml
  text: They have gone deep into corruption[a], as in the days of Gibeah; he will remember their iniquity[b]; he will punish their sins.
translation:
  language: ru
  text: Они глубоко погрязли в пороке[a], как во дни Гивы[b]; он вспомнит их беззаконие, взыщет за их грехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское выражение кратко и необычно; буквально оно соединяет представления об углублении и развращении или пагубном поведении.
    reason: lexical_alternative
  - marker: b
    text: Гива напоминает о чудовищном преступлении и последовавших событиях, описанных в Судей 19–21; с ними здесь сравнивается развращённость Израиля.
    reason: cross_reference
lexical_decisions:
- source_word: הֶעְמִיקוּ שִׁחֵתוּ
  choice: глубоко погрязли в пороке
  rationale: Сжатое сочетание двух глаголов передаёт углубление и нравственное разложение. Русское выражение сохраняет образ погружения и естественно обозначает крайнюю степень испорченности, не сводя два еврейских глагола к одному наречию.
- source_word: כִּימֵי הַגִּבְעָה
  choice: как во дни Гивы
  rationale: Сохраняет сравнительное значение כְּ и историческую отсылку; «во дни» уместно в возвышенном пророческом тексте и понятно современному читателю.
- source_word: יִזְכּוֹר עֲוֺנָם
  choice: он вспомнит их беззаконие
  rationale: «Беззаконие» передаёт нравственную вину עָוֹן, тогда как последующая строка отдельно выражает воздаяние. Будущее время соответствует последовательности еврейских имперфектов.
- source_word: יִפְקֹד חַטֹּאותָם
  choice: взыщет за их грехи
  rationale: В контексте суда פקד означает привлечь к ответу или наказать. «Взыщет за» ясно передаёт судебное воздаяние и сохраняет более широкую выразительность глагола, чем прямое «накажет».
theological_decisions:
- issue: Неявный субъект глаголов суда
  choice: Сохранено местоимение «он» без добавления имени Бога.
  alternative: 'Явно перевести: «Бог вспомнит… Бог взыщет…»'
  rationale: В еврейском тексте стоят глаголы 3-го лица мужского рода единственного числа без названного субъекта. Контекст указывает на Бога, но перевод не устраняет формальную неявность субъекта и не добавляет отсутствующее имя.
- issue: Соотношение беззакония, вины и наказания в עָוֹן
  choice: Переведено как «беззаконие».
  alternative: «вина» или «наказание за вину»
  rationale: Поскольку следующий глагол прямо выражает взыскание за грехи, здесь естественнее сохранить значение самого нравственного проступка, не смешивая его с последствием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной пророческой интонацией. «Во дни» и «взыщет» сохраняют достоинство библейского регистра, оставаясь понятными; синтаксический параллелизм второй половины стиха сохранён.
