  text: יִמְאָסֵ֣/ם אֱלֹהַ֔/י כִּ֛י לֹ֥א שָׁמְע֖וּ ל֑/וֹ וְ/יִהְי֥וּ נֹדְדִ֖ים בַּ/גּוֹיִֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/017.yaml
  text: My God will reject them because they have not listened to him[a], and they will be wanderers among the nations.
translation:
  language: ru
  text: Мой Бог отвергнет их, потому что они не слушались Его[a], и они будут скитальцами среди народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «не слушали Его»; в данном контексте слушание подразумевает также послушание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְאָסֵם
  choice: отвергнет их
  rationale: Глагол מאס выражает отвержение или отказ. «Отвергнет их» ясно передаёт судебно-заветный смысл, не привнося оттенка эмоционального презрения.
- source_word: אֱלֹהַי
  choice: Мой Бог
  rationale: Суффикс первого лица единственного числа выражает принадлежность; перевод сохраняет личное пророческое исповедание Осии.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину Божьего отвержения и естественно передаётся причинной конструкцией.
- source_word: לֹא שָׁמְעוּ לוֹ
  choice: они не слушались Его
  rationale: שׁמע с ל сочетает смысл слушания с подразумеваемым послушанием. Русское «слушаться» естественно удерживает оба оттенка; в сноске отмечен более буквальный вариант.
- source_word: וְיִהְיוּ
  choice: и они будут
  rationale: Глагол היה здесь обозначает последующее состояние изгнанного народа; прямое «будут» точно и естественно по-русски.
- source_word: נֹדְדִים
  choice: скитальцами
  rationale: Причастие от נדד указывает на людей, вынужденных странствовать и не имеющих устойчивого места; «скитальцы» передаёт это без сужения значения до беглецов.
- source_word: בַּגּוֹיִם
  choice: среди народов
  rationale: Речь идёт о чужих народах, среди которых будет рассеян Израиль. Формулировка естественна и не несёт новозаветных коннотаций слова «язычники».
theological_decisions:
- issue: Пророческое выражение «Мой Бог»
  choice: 'Сохранено первое лицо: «Мой Бог».'
  alternative: Передать просто как «Бог».
  rationale: Притяжательный суффикс присутствует в еврейском тексте и важен для личного и заветного звучания пророческой речи.
- issue: 'Значение שׁמע: слушать или повиноваться'
  choice: В основном тексте употреблено «не слушались Его».
  alternative: «не слушали Его» или «не повиновались Ему»
  rationale: «Не слушались» в современном русском сохраняет связь со слушанием и одновременно выражает подразумеваемое непослушание, не сводя многозначность глагола только к повиновению.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная пророческая фраза. Заглавная буква в местоимении «Его» соответствует принятому русскому библейскому регистру.
