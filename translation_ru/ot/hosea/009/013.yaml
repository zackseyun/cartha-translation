base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/013.yaml
  text: Ephraim[a], as I have seen, is planted in a pleasant pasture like Tyre[c][b]; but Ephraim must bring out his children to the killer.
translation:
  language: ru
  text: Ефрем, как Я видел, был посажен, словно Тир, на прекрасном пастбище[a]; но Ефрему предстоит вывести своих сыновей к убийце[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Каким Я увидел Ефрема: он был посажен, как Тир, в прекрасном месте». Синтаксис сравнения в еврейском тексте сжат и допускает разные способы связать слова.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «своих сыновей к убивающему». «Сыновья» может здесь иметь собирательное значение «дети, потомство»; вместо «к убийце» возможно также «на заклание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Традиционная русская форма имени колена и северного царства; в стихе Ефрем представлен как единый народ.
- source_word: כַּאֲשֶׁר רָאִיתִי
  choice: как Я видел
  rationale: Сохраняет первое лицо и значение завершённого наблюдения; не устраняет сжатость связи с последующим сравнением.
- source_word: לְצוֹר
  choice: словно Тир
  rationale: 'Предлог לְ понят сравнительно: благополучное положение Ефрема сопоставляется с Тиром. Поскольку синтаксис неоднозначен, альтернативная конструкция указана в сноске.'
- source_word: שְׁתוּלָה
  choice: был посажен
  rationale: Сохраняет страдательное значение и растительную метафору. Согласование в русском дано с мужским именем «Ефрем», хотя еврейская форма причастия женского рода.
- source_word: בְנָוֶה
  choice: на прекрасном пастбище
  rationale: נָוֶה может означать пастбище, приятное обиталище или прекрасное место. «Прекрасное пастбище» удерживает сельскохозяйственный образ рядом с «посажен».
- source_word: וְאֶפְרַיִם
  choice: но Ефрему
  rationale: Союз וְ формально означает «и», однако здесь вводит резкий контраст между благополучным укоренением и грядущей гибелью детей.
- source_word: לְהוֹצִיא
  choice: предстоит вывести
  rationale: Инфинитив с לְ передаёт предназначенное или неизбежно предстоящее действие; эта формулировка выражает обречённость без добавления прямого повеления.
- source_word: אֶל הֹרֵג
  choice: к убийце
  rationale: Активное причастие הֹרֵג буквально обозначает убивающего, то есть личного исполнителя, а не отвлечённое «заклание».
- source_word: בָּנָיו
  choice: своих сыновей
  rationale: Формально еврейское слово означает «его сыновей». Более широкое коллективное значение «детей» возможно и отмечено в сноске.
theological_decisions:
- issue: Сохранить ли образ насаждения или заменить его общим описанием процветания
  choice: 'Сохранён образ: «был посажен… на прекрасном пастбище»'
  alternative: «Я видел Ефрема процветающим, как Тир»
  rationale: Контраст между устойчивым, благоприятным насаждением и последующей отдачей сыновей убийце составляет образную силу стиха; обобщение «процветал» устранило бы исходную метафору.
- issue: Передавать ли בָּנָיו как «сыновей» или как «детей»
  choice: сыновей
  alternative: детей
  rationale: «Сыновей» формально точнее передаёт форму исходного текста и сохраняет возможную конкретность; обобщённое значение «детей, потомства» остаётся возможным и вынесено в сноску.
- issue: Понимать ли אֶל הֹרֵג как личного убийцу или как отвлечённое заклание
  choice: к убийце
  alternative: на заклание
  rationale: Исходный текст использует активное причастие с личным значением. Выбор не определяет, кто именно является убийцей, и не добавляет исторической идентификации.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис основной строки сделан читаемым, но спорная структура первого полустишия и диапазон значений ключевых слов сохранены в сносках. Местоимение «Я» написано с прописной буквы, поскольку в контексте говорит Бог.
