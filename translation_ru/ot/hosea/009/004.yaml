  text: לֹא יִסְּכ֨וּ לַ/יהוָ֥ה יַיִן֮ וְ/לֹ֣א יֶֽעֶרְבוּ ל/וֹ֒ זִבְחֵי/הֶ֗ם כְּ/לֶ֤חֶם אוֹנִים֙ לָ/הֶ֔ם כָּל אֹכְלָ֖י/ו יִטַמָּ֑אוּ כִּֽי לַחְמָ֣/ם לְ/נַפְשָׁ֔/ם לֹ֥א יָב֖וֹא בֵּ֥ית יְהוָֽה־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/004.yaml
  text: They will not pour out wine offerings to Yahweh[a], and their sacrifices will not please him. They will be like mourners’ bread to them; all who eat it will become unclean. For their bread will be for themselves alone[b]; it will not enter the house of Yahweh.
translation:
  language: ru
  text: 'Они не будут возливать вино Яхве, и жертвы их не будут Ему угодны. Эти жертвы будут для них словно хлеб скорбящих[a]: всякий, кто ест его, станет нечист. Ведь их хлеб — только для них самих[b]; он не войдёт в дом Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как хлеб скорбящих». Вероятно, имеется в виду пища, связанная с трауром по умершему и потому несущая ритуальную нечистоту.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для их аппетита» либо «для поддержания их жизни». Еврейское выражение допускает эти оттенки; по смыслу этот хлеб предназначен лишь для их собственного употребления и не годится для внесения в дом Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְּכוּ ... יַיִן
  choice: будут возливать ... вино
  rationale: Глагол נסך в жертвенном контексте обозначает ритуальное возлияние. Сочетание с «вином» ясно передаёт смысл без добавления отсутствующего в еврейском тексте существительного «приношение».
- source_word: לַיהוָה
  choice: Яхве
  rationale: Предлог ל обозначает адресата возлияния; личное имя יהוה передано транслитерацией «Яхве».
- source_word: יֶעֶרְבוּ לוֹ
  choice: не будут Ему угодны
  rationale: ערב здесь означает приятность или приемлемость для Бога; формулировка сохраняет культовый контекст и естественно звучит по-русски.
- source_word: זִבְחֵיהֶם
  choice: жертвы их
  rationale: זבח — обычное обозначение жертвенного приношения; выбран ясный и традиционный русский эквивалент.
- source_word: כְּלֶחֶם אוֹנִים
  choice: словно хлеб скорбящих
  rationale: Выражение относится к пище, связанной с трауром и ритуальной нечистотой из-за смерти. Буквальный образ сохранён, а его значение пояснено в сноске.
- source_word: יִטַמָּאוּ
  choice: станет нечист
  rationale: טמא обозначает ритуальную нечистоту, а не обязательно нравственное осквернение.
- source_word: לַחְמָם
  choice: их хлеб
  rationale: Сохранён конкретный образ לחם, хотя в контексте слово может шире обозначать пищу.
- source_word: לְנַפְשָׁם
  choice: только для них самих
  rationale: נפש может означать самого человека, жизнь или аппетит. Контекст подчёркивает, что пища служит их собственному употреблению и не допускается в святилище.
- source_word: לֹא יָבוֹא בֵּית יְהוָה
  choice: он не войдёт в дом Яхве
  rationale: Сохранены единственное число глагола, образ движения внутрь и культовая недопустимость хлеба в доме Яхве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо употреблено личное имя Бога; транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Характер нечистоты хлеба скорбящих
  choice: ритуальная нечистота, связанная с трауром и смертью
  alternative: общая печаль или нравственная испорченность пищи
  rationale: Контекст жертв, дома Яхве и глагола טמא указывает на культовую нечистоту, не сводя её к эмоции или нравственной оценке.
- issue: Связь выражения «как хлеб скорбящих» с жертвами
  choice: жертвы уподоблены хлебу скорбящих
  alternative: все предложение можно понимать как более общее описание их пищи
  rationale: Ближайшее грамматическое подлежащее — «их жертвы»; явное повторение в русском устраняет неестественную местоименную двусмысленность, не меняя основной смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для обычного читателя; сохранены культовые термины «возливать», «жертвы», «нечист» и образ «хлеба скорбящих».
