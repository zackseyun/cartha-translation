  naturalness: Регистр в основном современный литературный и пророчески возвышенный. «Не радуйся, Израиль, не ликуй, как народы» звучит естественно и сохраняет намеренно сжатый, параллельный характер еврейской фразы. «На каждом гумне для зерна» передаёт исходное сочетание без добавочного разъяснения в основном тексте.
  terminology: «Блудодействовал» и «плата блудницы» сохраняют резкую метафору Осии без её конфессионального истолкования в основном тексте. «Гумно» уместно как точный историко-культурный термин. Примечание b допустимо, но должно определять плату как получаемую блудницей, чтобы устранить возможную русскую двусмысленность.
