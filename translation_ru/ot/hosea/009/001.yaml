  text: אַל תִּשְׂמַ֨ח יִשְׂרָאֵ֤ל אֶל גִּיל֙ כָּֽ/עַמִּ֔ים כִּ֥י זָנִ֖יתָ מֵ/עַ֣ל אֱלֹהֶ֑י/ךָ אָהַ֣בְתָּ אֶתְנָ֔ן עַ֖ל כָּל גָּרְנ֥וֹת דָּגָֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/001.yaml
  text: Do not rejoice[a], Israel, with exultation like the peoples, for you have played the prostitute away from your God[b]; you have loved a prostitute’s payment on every threshing floor of grain.
translation:
  language: ru
  text: Не радуйся, Израиль, не ликуй, как народы[a], потому что ты блудодействовал, отступив от своего Бога; ты любил плату блудницы[b] на каждом гумне для зерна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не радуйся до ликования, как народы». Еврейская фраза сжата и допускает несколько естественных способов передачи.'
    reason: lexical_alternative
  - marker: b
    text: «Плата блудницы» — плата, получаемая блудницей за блуд; здесь этот образ относится к выгоде, которую Израиль искал в идолопоклонстве.
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּשְׂמַח
  choice: Не радуйся
  rationale: Сочетание אַל с формой имперфекта выражает запрет; «не радуйся» естественно и сохраняет возвышенный пророческий тон.
- source_word: אֶל גִּיל כָּעַמִּים
  choice: и не ликуй, как другие народы
  rationale: Еврейская конструкция сжата. Развёртывание в виде второго однородного запрета соответствует смыслу и звучит естественно по-русски; «другие» поясняет подразумеваемое противопоставление Израиля народам, не меняя его сути.
- source_word: זָנִיתָ מֵעַל אֱלֹהֶיךָ
  choice: ты блудодействовал, отступив от своего Бога
  rationale: «Блудодействовал» сохраняет намеренно резкий образ неверности, характерный для Осии. Деепричастный оборот естественно передаёт направленность удаления от Бога, выраженную מֵעַל, не сводя метафору к отвлечённой «неверности».
- source_word: אֶתְנָן
  choice: плату блудницы
  rationale: Слово обозначает плату, связанную с проституцией. Эта формулировка сохраняет конкретный образ и избегает архаичного или чрезмерно грубого выражения.
- source_word: עַל כָּל גָּרְנוֹת דָּגָן
  choice: на каждом гумне, где молотят зерно
  rationale: «Гумно» точно передаёт גֹּרֶן, а придаточное поясняет современному читателю назначение гумна и явно отражает דָּגָן — «зерно».
theological_decisions:
- issue: Пророческий образ блуда как обозначение идолопоклонства и отступничества
  choice: Сохранить в основном тексте глагол «блудодействовал» и образ «платы блудницы»
  alternative: 'Передать отвлечённо: «ты был неверен» и «нечестивая выгода»'
  rationale: Осия намеренно описывает нарушение верности Богу языком сексуальной неверности. Сохранение образа передаёт силу обвинения, не разрешая метафору в пользу более мягкой конфессиональной формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. «Блудодействовал» сохраняет библейскую метафору, но остаётся понятным; «гумно» — точный культурно-исторический термин, пояснённый в самом тексте.
