reference: Hosea 9:15
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: כָּל רָעָתָ֤/ם בַּ/גִּלְגָּל֙ כִּֽי שָׁ֣ם שְׂנֵאתִ֔י/ם עַ֚ל רֹ֣עַ מַֽעַלְלֵי/הֶ֔ם מִ/בֵּיתִ֖/י אֲגָרְשֵׁ֑/ם לֹ֤א אוֹסֵף֙ אַהֲבָתָ֔/ם כָּל שָׂרֵי/הֶ֖ם סֹרְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/015.yaml
  text: All their evil is at Gilgal[a]; indeed, there I hated them because of the evil of their deeds. I will drive them out of my house; I will no longer love them[c][b]. All their princes are rebels.
translation:
  language: ru
  text: Всё их зло — в Галгале[a]; именно там Я возненавидел их за зло их поступков. Я изгоню их из Моего дома[b] и больше не буду любить их. Все их правители непокорны[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо там Я возненавидел их». Еврейский союз может иметь причинное значение («ибо», «потому что») или усиливать указание на место («именно там»).'
    reason: lexical_alternative
  - marker: b
    text: «Мой дом» может более конкретно означать землю Господа, Его святилище или Его заветный дом; еврейский текст оставляет образ неуточнённым.
    reason: cultural_note
  - marker: c
    text: 'Или: «Все их правители — мятежники» или «упрямо непокорны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רָעָתָם
  choice: Всё их зло
  rationale: Сочетание כָּל с абстрактным существительным в единственном числе совокупно обозначает всю полноту их зла; русский оборот сохраняет краткость и обобщённый смысл.
- source_word: בַּגִּלְגָּל
  choice: в Галгале
  rationale: Предлог בְּ имеет здесь локативное значение; форма «в Галгале» естественна для русского названия места.
- source_word: כִּי שָׁם
  choice: именно там
  rationale: כִּי допускает причинное и усилительное прочтение. В основном тексте выбран усилительный смысл с акцентом на месте, а причинная возможность отмечена в сноске.
- source_word: שְׂנֵאתִים
  choice: Я возненавидел их
  rationale: Глагол שׂנא прямо выражает ненависть; совершенный вид по-русски естественно передаёт совершившееся отвержение, не смягчая резкости высказывания.
- source_word: עַל רֹעַ מַעַלְלֵיהֶם
  choice: за зло их поступков
  rationale: עַל указывает на основание, רֹעַ — на зло, а מַעַלְלִים — на поступки или деяния. Формулировка естественна и сохраняет причинно-нравственный смысл.
- source_word: מִבֵּיתִי אֲגָרְשֵׁם
  choice: Я изгоню их из Моего дома
  rationale: גָּרַשׁ означает изгнать или удалить силой, а מִן обозначает исходную точку удаления. Образ «Моего дома» сохранён без уточняющего толкования.
- source_word: לֹא אוֹסֵף אַהֲבָתָם
  choice: больше не буду любить их
  rationale: Идиома с יסף выражает прекращение или отсутствие дальнейшего действия; это ясный и естественный русский эквивалент.
- source_word: כָּל שָׂרֵיהֶם
  choice: Все их правители
  rationale: שָׂרִים обозначает начальников, вождей или правителей. «Правители» не создаёт ошибочного впечатления, будто речь обязательно идёт о царских сыновьях.
- source_word: סֹרְרִים
  choice: мятежники
  rationale: Причастие от סרר характеризует стойкое неповиновение и бунтарство; существительное «мятежники» выразительно передаёт установленную характеристику руководителей.
theological_decisions:
- issue: Речь о Божьей ненависти
  choice: Сохранено прямое «Я возненавидел их».
  alternative: «Я отверг их» или «Я восстал против них».
  rationale: Еврейское שׂנא прямо выражает ненависть и отвержение. Смягчение устранило бы намеренно резкий язык заветного суда.
- issue: Значение выражения «Мой дом»
  choice: Метафора сохранена как «Мой дом».
  alternative: «Моя земля», «Моё святилище» или «Моё семейство».
  rationale: Контекст допускает связь с землёй Господа, святилищем или заветным домом, но еврейский текст не уточняет референт; перевод сохраняет эту компактность и неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис краткий и энергичный; резкие формулировки суда не смягчены. Местоимения, относящиеся к Богу, оформлены с прописной буквы согласно распространённой русской библейской традиции.
