source:
  edition: WLC
  text: כַּ/עֲנָבִ֣ים בַּ/מִּדְבָּ֗ר מָצָ֨אתִי֙ יִשְׂרָאֵ֔ל כְּ/בִכּוּרָ֤ה בִ/תְאֵנָה֙ בְּ/רֵ֣אשִׁיתָ֔/הּ רָאִ֖יתִי אֲבֽוֹתֵי/כֶ֑ם הֵ֜מָּה בָּ֣אוּ בַֽעַל פְּע֗וֹר וַ/יִּנָּֽזְרוּ֙ לַ/בֹּ֔שֶׁת וַ/יִּהְי֥וּ שִׁקּוּצִ֖ים כְּ/אָהֳבָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/009/010.yaml
  text: Like grapes in the wilderness I found Israel[a]; like the first-ripe fruit on the fig tree in its first season I saw your fathers. They came to Baal-peor and consecrated themselves to shame[d][c][b], and they became detestable like the thing they loved.
translation:
  language: ru
  text: Как виноград в пустыне, Я нашёл Израиль; как первый плод на смоковнице в начале её плодоношения[a], Я увидел ваших отцов[b]. Они пришли к Ваал-Фегору[c] и посвятили себя позору[d], и сами стали мерзкими, как то, что они полюбили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в её начале»; то есть в начале времени плодоношения, когда появляется особенно ценимый ранний плод.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ваших предков». Еврейский текст буквально говорит: «ваших отцов».'
    reason: lexical_alternative
  - marker: c
    text: См. Числа 25:1–5, где Израиль присоединился к Ваал-Фегору.
    reason: cross_reference
  - marker: d
    text: «Позор», вероятно, служит здесь презрительным обозначением идола, связанного с Ваал-Фегором.
    reason: alternative_reading
lexical_decisions:
- source_word: כַּעֲנָבִים בַּמִּדְבָּר
  choice: как виноград в пустыне
  rationale: Сравнительная частица כְּ передана словом «как»; מִדְבָּר здесь обозначает пустынную, бесплодную местность, где находка винограда особенно неожиданна и желанна.
- source_word: מָצָאתִי יִשְׂרָאֵל
  choice: Я нашёл Израиль
  rationale: Прямо передаёт qal perfect 1-го лица ед. числа от מצא и сохраняет живой образ неожиданной находки.
- source_word: כְּבִכּוּרָה בִתְאֵנָה
  choice: как первый плод на смоковнице
  rationale: בִּכּוּרָה — первый, ранний и особенно ценимый плод; «первый плод» естественно передаёт образ без внесения культового оттенка термина «первоплод».
- source_word: בְּרֵאשִׁיתָהּ
  choice: в начале её плодоношения
  rationale: Буквально «в её начале»; по контексту речь о начале появления плодов на смоковнице. Формулировка делает земледельческий образ ясным, не превращая его в утверждение о первом году жизни дерева.
- source_word: רָאִיתִי אֲבוֹתֵיכֶם
  choice: Я увидел ваших отцов
  rationale: Сохраняет параллелизм с «Я нашёл» и прямо передаёт אֲבוֹתֵיכֶם; в контексте имеются в виду предки адресатов.
- source_word: הֵמָּה בָּאוּ בַעַל פְּעוֹר
  choice: Они пришли к Ваал-Фегору
  rationale: Не добавляется явно не выраженный противительный союз. Название передано в принятой русской библейской форме; конструкция понимается как приближение к месту или культу Ваал-Фегора.
- source_word: וַיִּנָּזְרוּ לַבֹּשֶׁת
  choice: и посвятили себя позору
  rationale: Niphal от נזר несёт значение отделения или посвящения себя. «Позор» сохраняет иронию религиозного посвящения и возможное уничижительное обозначение идола.
- source_word: וַיִּהְיוּ שִׁקּוּצִים
  choice: и сами стали мерзкими
  rationale: שִׁקּוּצִים выражает сильное религиозно-нравственное отвращение. Прилагательное естественно относится к людям, а «сами» подчёркивает их уподобление предмету любви.
- source_word: כְּאָהֳבָם
  choice: как то, что они полюбили
  rationale: Сжатая и неоднозначная конструкция наиболее естественно выражает уподобление предмету их любви; объект оставлен не названным прямо, как и в еврейском тексте.
theological_decisions:
- issue: Значение לַבֹּשֶׁת в контексте идолопоклонства
  choice: «позору» с пояснением вероятной отсылки к идолу в сноске
  alternative: «позорному идолу» или «Позору» как уничижительное имя Ваала
  rationale: Еврейский текст намеренно употребляет полемическое слово «позор», не называя божество повторно. Основной текст сохраняет эту риторическую неоднозначность.
- issue: Передача אֲבוֹתֵיכֶם
  choice: «ваших отцов»
  alternative: «ваших предков»
  rationale: Основной текст сохраняет грамматически мужское обозначение и традиционный образ отцов народа; сноска объясняет, что речь идёт о предках.
- issue: Связь с событием у Ваал-Фегора
  choice: сохранить краткое указание текста и дать перекрёстную ссылку
  alternative: развернуть в основном тексте как присоединение к культу Ваал-Фегора
  rationale: Числа 25:1–5 проясняет исторический фон, но эти детали не следует вносить в основной текст Осии.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены параллелизм образов, резкий переход от первоначальной ценности Израиля к идолопоклонству и намеренная неоднозначность слов «позор» и «как то, что они полюбили». Все сноски размещены непосредственно при соответствующих выражениях.
