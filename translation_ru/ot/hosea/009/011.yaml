  text: Ephraim—their glory will fly away like a bird—from birth[a], from the womb[b], and from conception.
translation:
  language: ru
  text: Слава Ефрема[a] улетит, словно птица, — от рождения, от чрева, от зачатия[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «честь», «великолепие». В данном контексте «слава» Ефрема, вероятно, особенно связана с потомством и плодовитостью.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от рождения, и от чрева, и от зачатия (или беременности)». Этот трёхчастный ряд, вероятно, говорит об утрате потомства на всех стадиях.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Традиционная русская передача имени; здесь Ефрем олицетворяет племя и северное царство.
- source_word: כָּעוֹף
  choice: словно птица
  rationale: Предлог כ выражает сравнение, а עוֹף в данном образе естественно передаётся конкретным словом «птица».
- source_word: יִתְעוֹפֵף
  choice: улетит
  rationale: Глагол обозначает удаление в полёте; «улетит» естественно передаёт и движение, и утрату.
- source_word: כְּבוֹדָם
  choice: слава
  rationale: Слово כָּבוֹד может означать славу, честь, великолепие или значимость. «Слава» сохраняет метафору, которую контекст связывает прежде всего с потомством и плодовитостью.
- source_word: מִלֵּדָה
  choice: не будет ни рождения детей
  rationale: לֵדָה обозначает рождение или роды. Отрицательная конструкция по-русски ясно выражает подразумеваемое исчезновение потомства на этой стадии.
- source_word: וּמִבֶּטֶן
  choice: ни беременности
  rationale: Буквально בֶּטֶן — «чрево, утроба»; здесь речь идёт о стадии вынашивания, поэтому «беременность» ясно передаёт контекстуальный смысл.
- source_word: וּמֵהֵרָיוֹן
  choice: ни зачатия
  rationale: 'הֵרָיוֹן может обозначать зачатие или беременность. «Зачатие» сохраняет обратное движение ряда: рождение — вынашивание — зачатие.'
theological_decisions:
- issue: К чему относится «слава» Ефрема
  choice: В основном тексте метафора «слава» сохранена; контекст позволяет видеть в ней прежде всего детей, плодовитость и связанную с ними жизненную силу народа.
  alternative: Богатство, честь или национальное великолепие в более широком смысле.
  rationale: Сам стих прямо не раскрывает метафору, хотя последующие выражения тесно связывают её с деторождением. Конкретизация вынесена в сноску, чтобы не устранять смысловую широту.
- issue: Значение трёх предложных оборотов
  choice: Они переданы как отсутствие потомства на всех стадиях — при рождении, во время беременности и уже при зачатии.
  alternative: 'Сохранить буквально: «от рождения, от чрева и от зачатия».'
  rationale: Буквальная русская конструкция неясна и может ошибочно восприниматься как указание места происхождения. Отрицательный ряд естественно выражает лишение, подразумеваемое еврейским текстом и контекстом, сохраняя трёхчастную обратную последовательность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской образностью. Двоеточие раскрывает смысл улетающей славы; отрицательный трёхчленный ряд делает синтаксис естественным, не устраняя метафору «славы».
