  text: רִ֤יבוּ בְ/אִמְּ/כֶם֙ רִ֔יבוּ כִּֽי הִיא֙ לֹ֣א אִשְׁתִּ֔/י וְ/אָנֹכִ֖י לֹ֣א אִישָׁ֑/הּ וְ/תָסֵ֤ר זְנוּנֶ֨י/הָ֙ מִ/פָּנֶ֔י/ה וְ/נַאֲפוּפֶ֖י/הָ מִ/בֵּ֥ין שָׁדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/004.yaml
  text: Contend with your mother[a], contend, for she is not my wife, and I am not her husband[b]; let her remove her prostitutions from her face and her adulteries from between her breasts.
translation:
  language: ru
  text: Ведите тяжбу с вашей матерью[a], ведите тяжбу, ибо она не Моя жена, и Я не её муж; пусть она удалит свой блуд с лица своего и свои прелюбодеяния — из промежутка между её грудями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Обвиняйте вашу мать»; еврейский глагол ריב может обозначать спор, тяжбу или предъявление обвинения.'
    reason: lexical_alternative
  - marker: b
    text: Слова «блуд» и «прелюбодеяния» могут говорить как о половой неверности, так и, в образном языке Осии, о нарушении завета через идолопоклонство. Образы лица и промежутка между грудями могут указывать на видимые знаки распутства, но текст не называет их точнее.
    reason: cultural_note
lexical_decisions:
- source_word: רִיבוּ בְאִמְּכֶם
  choice: Судитесь с вашей матерью
  rationale: Повторённый императив ריבו имеет спорно-правовой оттенок; «судитесь с» сохраняет как судебную образность, так и прямоту обращения, не сводя выражение только к формальному обвинению.
- source_word: כִּי הִיא לֹא אִשְׁתִּי וְאָנֹכִי לֹא אִישָׁהּ
  choice: потому что она не жена Мне, и Я не муж ей
  rationale: Сохранена буквальная брачная формула разрыва отношений. Выделение местоименных отношений средствами русского порядка слов передаёт эмфазу אָנֹכִי без добавления толкования.
- source_word: וְתָסֵר
  choice: пусть она уберёт
  rationale: Форма выражает побуждение или требование; «пусть уберёт» естественно передаёт юссивный оттенок.
- source_word: זְנוּנֶיהָ
  choice: свой блуд
  rationale: «Блуд» — сильное и понятное в пророческом контексте обозначение распутства и проституирования; собирательное единственное естественнее русского искусственного множественного «блуды», при этом не смягчает образ.
- source_word: מִפָּנֶיהָ
  choice: со своего лица
  rationale: Сохранён конкретный пространственный образ лица, не заменённый абстрактным толкованием.
- source_word: וְנַאֲפוּפֶיהָ
  choice: свои прелюбодеяния
  rationale: Слово прямо передаёт производное от נאף и сохраняет множественное число и обвинительную силу оригинала.
- source_word: מִבֵּין שָׁדֶיהָ
  choice: из пространства между грудями
  rationale: Прямо сохраняется телесный и пространственный образ; добавленное «пространства» делает сочетание с глаголом «уберёт» грамматически ясным и не устраняет его намеренной образности.
theological_decisions:
- issue: Брачная метафора разрыва завета
  choice: Сохранить буквальную речь о жене и муже без поясняющей парафразы в основном тексте.
  alternative: Передать смысл непосредственно как неверность Израиля Богу и нарушение завета.
  rationale: Еврейский текст выражает богословский смысл через брачный образ. Его раскрытие внутри перевода преждевременно сняло бы многозначность и напряжение пророческой речи.
- issue: Соотношение буквальной половой неверности и метафорического идолопоклонства
  choice: Использовать сильные слова «блуд» и «прелюбодеяния», а двойной план отметить в сноске.
  alternative: Смягчить до общего слова «неверность».
  rationale: Осия намеренно использует сексуально окрашенную лексику, которая может обозначать и половую распущенность, и заветную неверность через идолопоклонство; обобщение ослабило бы текст.
translation_notes:
  register: Современный литературный русский с сохранением резкой пророческой и судебно-брачной образности. Формула «не жена Мне, и Я не муж ей» слегка приподнята стилистически, но ясна и передаёт торжественную формулу разрыва. Все сноски отмечены в основном тексте.
