  naturalness: «Судитесь с вашей матерью» можно понять как взаимный спор или как собственно судебное разбирательство, тогда как призыв направлен против матери. «Ведите тяжбу с вашей матерью» точнее сохраняет юридико-спорный характер и остаётся понятным. «Удалит» стилистически ровнее, чем разговорное «уберёт» в этом контексте. «Из промежутка между её грудями» сохраняет телесную конкретность без неуклюжего слова «пространство».
