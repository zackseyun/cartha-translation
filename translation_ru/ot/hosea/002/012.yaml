source:
  edition: WLC
  text: וְ/עַתָּ֛ה אֲגַלֶּ֥ה אֶת נַבְלֻתָ֖/הּ לְ/עֵינֵ֣י מְאַהֲבֶ֑י/הָ וְ/אִ֖ישׁ לֹֽא יַצִּילֶ֥/נָּה מִ/יָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/012.yaml
  text: And now I will uncover her nakedness before the eyes of her lovers, and no man will rescue her from my hand.
translation:
  language: ru
  text: А теперь Я обнажу её наготу перед глазами её любовников, и никто не вырвет её из Моей руки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲגַלֶּה אֶת־נַבְלֻתָהּ
  choice: обнажу её наготу
  rationale: Прямо передаёт образ публичного обнажения и позора; נַבְלוּת здесь обозначает наготу/срам, а не просто «бесчестие».
- source_word: מְאַהֲבֶיהָ
  choice: её любовников
  rationale: Сохраняет брачно-сексуальную метафору Осии и множественное число оригинала.
- source_word: וְאִישׁ לֹא יַצִּילֶנָּה
  choice: и никто не вырвет её
  rationale: Хотя אִישׁ буквально означает «мужчина/человек», в отрицательной конструкции оно имеет обобщённый смысл «никто»; «вырвет» естественно сочетается с образом избавления из чьей-либо руки.
- source_word: מִיָּדִי
  choice: из Моей руки
  rationale: Сохраняет распространённую библейскую метафору власти и удержания; прописная буква указывает на речь Бога.
theological_decisions:
- issue: Характер образа суда
  choice: Сохранено буквальное «обнажу её наготу»
  alternative: «выставлю её на позор»
  rationale: Конкретный телесный образ существен для пророческой метафоры неверной жены; его не следует смягчать или сводить лишь к абстрактному позору.
- issue: Кто способен избавить осуждаемую
  choice: «никто»
  alternative: «ни один мужчина» / «ни один человек»
  rationale: Отрицательная конструкция выражает всеобщую невозможность избавления, не вводя дополнительного акцента на пол спасителя.
translation_notes:
  register: Современный литературный русский язык с сохранением сурового и конкретного пророческого образа. Порядок частей близок к еврейскому оригиналу; местоимения Бога оформлены с прописной буквы согласно принятому русскому библейскому регистру.
