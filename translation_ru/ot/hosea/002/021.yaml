  text: And I will betroth you to myself forever; yes[a], I will betroth you to myself in righteousness and in justice, and in steadfast love and in compassion.
translation:
  language: ru
  text: И обручу тебя с Собой навеки; и обручу тебя с Собой в праведности и справедливости, в верной любви[a] и сострадании.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское חֶסֶד означает любовь, проявляющуюся в неизменной верности, милости и преданности отношениям; возможный перевод: «в неизменной любви».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵרַשְׂתִּיךְ
  choice: обручу тебя
  rationale: Глагол ארשׂ обозначает именно обручение, а не уже совершившийся брак; перевод сохраняет брачно-заветный образ и его точность.
- source_word: לִי
  choice: с Собой
  rationale: Буквально «Мне»; в сочетании с русским «обручить» естественная конструкция «обручу тебя с Собой» точно передаёт личную направленность отношений.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Краткое и литературно естественное обозначение непреходящей длительности.
- source_word: בְּצֶדֶק
  choice: в праведности
  rationale: Сохраняет нравственно-заветное значение צֶדֶק и параллельную конструкцию с повторяющимся предлогом בְּ.
- source_word: וּבְמִשְׁפָּט
  choice: и справедливости
  rationale: В ряду качеств מִשְׁפָּט означает справедливость, правый порядок, а не судебный приговор.
- source_word: וּבְחֶסֶד
  choice: в верной любви
  rationale: חֶסֶד сочетает любовь, милость и стойкую верность в отношениях; «верная любовь» естественно передаёт это ядро без чрезмерного пояснения в основном тексте.
- source_word: וּבְרַחֲמִים
  choice: и сострадании
  rationale: Хотя форма רַחֲמִים морфологически множественная, здесь это отвлечённое понятие; «сострадание» естественно передаёт милосердное участие.
theological_decisions:
- issue: Брачно-заветный образ
  choice: Сохранено буквальное «обручу»,
  alternative: «возьму тебя в жёны»; «сделаю тебя Своей»
  rationale: Обручение является центральным образом восстановления отношений у Осии; более общие формулировки стирают его конкретность и присущую ему смысловую напряжённость.
- issue: Передача חֶסֶד
  choice: «верная любовь» в основном тексте
  alternative: «заветная любовь»; «неизменная любовь»; «милость»
  rationale: «Верная любовь» сохраняет как сердечное отношение, так и устойчивую преданность, не добавляя в текст отсутствующее существительное «завет»; объём значения пояснён в сноске.
- issue: Синтаксис повторного обещания
  choice: Сохранено повторение «обручу тебя с Собой» без добавочного «да» или «поистине»
  alternative: Добавить «да» / «поистине» перед вторым обещанием
  rationale: В еврейском тексте стоит обычный соединительный וְ, а не отдельная усилительная частица; повторение само создаёт необходимый акцент.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повторение сохранено ради риторической структуры оригинала; ряд отвлечённых существительных передан параллельно и без архаизмов.
