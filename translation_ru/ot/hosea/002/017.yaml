base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/017.yaml
  text: And from there I will give her her vineyards[a], and the Valley of Achor as a door of hope. There she will answer as in the days of her youth[b], as on the day when she came up from the land of Egypt.
translation:
  language: ru
  text: И оттуда Я дам ей её виноградники и долину Ахор[a] — как дверь надежды. Там она отзовётся[b], как во дни своей юности, как в день, когда она вышла из земли Египетской.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Долина Ахор напоминает о месте суда над Аханом (Нав 7:24–26). Место бедствия становится дверью надежды.
    reason: cross_reference
  - marker: b
    text: 'Или: «запоёт». Еврейский глагол означает ответ или отклик, а в этом контексте может подразумевать пение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: И … Я дам
  rationale: Форма совершенного вида с союзом в пророческом контексте выражает будущее обещание; «дам» передаёт обычное значение נתן.
- source_word: כְּרָמֶיהָ
  choice: её виноградники
  rationale: כֶּרֶם обозначает виноградник, а суффикс 3-го лица женского рода относится к образу женщины — Израиля.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Сохраняет явную пространственную связь с пустыней, упомянутой в предшествующем контексте.
- source_word: עֵמֶק עָכוֹר
  choice: долина Ахор
  rationale: Название места передано традиционной транслитерацией и сохраняет отсылку к Нав 7.
- source_word: לְפֶתַח תִּקְוָה
  choice: сделаю дверью надежды
  rationale: Передаёт образ פתח как двери или входа и функцию, выраженную предлогом לְ; добавленное «сделаю» естественно восполняет эллипсис в русском и соотносится с управляющим «дам».
- source_word: וְעָנְתָה שָּׁמָּה
  choice: Там она отзовётся
  rationale: «Отзовётся» сохраняет основное значение ענה — отвечать, откликаться — и при этом естественно звучит без названного собеседника; возможный оттенок пения вынесен в примечание.
- source_word: כִּימֵי נְעוּרֶיהָ
  choice: как во дни своей юности
  rationale: Близко передаёт сравнительный оборот и образ ранних отношений Израиля с Богом.
- source_word: וּכְיוֹם עֲלֹתָהּ מֵאֶרֶץ מִצְרָיִם
  choice: как в день, когда она вышла из земли Египетской
  rationale: Глагол עלה с מִן обозначает исход из Египта; «вышла» естественно по-русски передаёт движение из страны, не устраняя историческую отсылку.
theological_decisions:
- issue: Значение וְעָנְתָה в контексте восстановления
  choice: «она отзовётся» в основном тексте
  alternative: «она запоёт» или «она ответит песней»
  rationale: Основное значение глагола — отвечать или откликаться. Контекст может подразумевать пение и перекликаться с песней после исхода, однако еврейский текст не требует такого сужения смысла.
- issue: Образ долины Ахор
  choice: сохранено географическое название с пояснением в сноске
  alternative: передать смысл названия как «долина бедствия»
  rationale: Название важно и как реальное место, и как аллюзия на суд над Аханом; перевод самого имени в основном тексте превратил бы аллюзию в прямое толкование.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейской интонацией. Формы «во дни» и «земли Египетской» сохраняют достоинство историко-поэтической речи, не делая текст чрезмерно архаичным.
