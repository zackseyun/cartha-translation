  text: And it shall happen in that day[a], declares Yahweh, that I will answer the heavens, and they shall answer the earth.
translation:
  language: ru
  text: 'И будет в тот день: «Я отвечу, — возвещает Яхве, — отвечу небесам, а они ответят земле[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стране». Еврейское אֶרֶץ может означать как землю, так и страну; вариант «земле» сохраняет поэтическую пару с небесами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет
  rationale: Сохраняет пророческую формулу перехода к будущему событию и звучит естественно в современном литературном русском.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Устойчивая пророческая временная формула, сохраняющая библейскую выразительность без архаизации.
- source_word: אֶעֱנֶה / יַעֲנוּ
  choice: Я отвечу / они ответят
  rationale: Повтор одного глагола передаёт намеренную цепь откликов и олицетворение в еврейском тексте, не сводя образ к дождю или плодородию.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Передаёт весомую пророческую формулу речи; «возвещает» в данном контексте естественнее и торжественнее простого «говорит».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя транслитерацией, а не заменяет его титулом.
- source_word: הַשָּׁמַיִם
  choice: небесам
  rationale: Множественное «небеса» сохраняет возвышенный поэтический образ и образует пару с землёй.
- source_word: הָאָרֶץ
  choice: земле
  rationale: «Земля» сохраняет поэтическое противопоставление небесам; значение «страна» остаётся возможным и отмечено в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон, поэтому сохранено личное имя Бога без замены титулом.
- issue: Повтор глагола ענה
  choice: 'Сохранить буквальный образ ответа: Бог отвечает небесам, а небеса — земле'
  alternative: Истолковать образ как ниспослание дождя и плодородия
  rationale: Троекратный повтор ענה создаёт поэтическую цепь. Более разъяснительный перевод преждевременно устранил бы образность и богословско-поэтическое напряжение.
- issue: Значение אֶרֶץ
  choice: земля
  alternative: страна
  rationale: Сочетание «небеса — земля» поддерживает космико-земледельческий образ, однако лексема допускает также значение «страна».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Повтор «отвечу / ответят» и олицетворение сохранены; синтаксис слегка упорядочен тире, чтобы ясно отделить формулу «возвещает Яхве».
