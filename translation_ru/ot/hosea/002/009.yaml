id: HOS.2.9
reference: Hosea 2:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/רִדְּפָ֤ה אֶת מְאַהֲבֶ֨י/הָ֙ וְ/לֹֽא תַשִּׂ֣יג אֹתָ֔/ם וּ/בִקְשָׁ֖תַ/ם וְ/לֹ֣א תִמְצָ֑א וְ/אָמְרָ֗ה אֵלְכָ֤ה וְ/אָשׁ֨וּבָה֙ אֶל אִישִׁ֣/י הָֽ/רִאשׁ֔וֹן כִּ֣י ט֥וֹב לִ֛/י אָ֖ז מֵ/עָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/009.yaml
  text: She will pursue her lovers[a], but she will not overtake them; she will seek them, but she will not find them. Then she will say, ‘I will go and return to my first husband, for it was better for me then than now.’
translation:
  language: ru
  text: 'Она погонится за своими любовниками, но не настигнет их; будет искать их, но не найдёт. Тогда она скажет: «Пойду и вернусь к своему первому мужу[a], ведь тогда мне было лучше, чем теперь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежнему мужу». Буквально: «первому мужу».'
    reason: Лексема הָרִאשׁוֹן буквально означает «первый», но в данном контексте может обозначать прежнего мужа.
lexical_decisions:
- source_word: וְרִדְּפָה
  choice: она погонится
  rationale: Будущее время соответствует функции формы в пророческом контексте; глагол сохраняет образ погони.
- source_word: מְאַהֲבֶיהָ
  choice: за своими любовниками
  rationale: В брачной метафоре Осии речь идёт о незаконных возлюбленных; «любовники» прямо и естественно передаёт этот смысл.
- source_word: תַשִּׂיג
  choice: не настигнет
  rationale: После глагола погони «настигнет» точно сохраняет образ безуспешного преследования.
- source_word: וּבִקְשָׁתַם
  choice: будет искать их
  rationale: Передаёт целенаправленный поиск и сохраняет параллелизм со словами «не найдёт».
- source_word: תִמְצָא
  choice: не найдёт
  rationale: Прямой и естественный эквивалент в контексте поиска.
- source_word: וְאָמְרָה
  choice: тогда она скажет
  rationale: '«Тогда» ясно передаёт последовательность: решение возникает после неудачных поисков.'
- source_word: אֵלְכָה וְאָשׁוּבָה
  choice: пойду и вернусь
  rationale: Сохранены оба еврейских глагола и выраженная ими решимость.
- source_word: אֶל אִישִׁי הָרִאשׁוֹן
  choice: к своему первому мужу
  rationale: В брачном контексте אִישׁ означает «муж»; «первый» буквально передаёт הָרִאשׁוֹן, а возможное значение «прежний» отмечено в сноске.
- source_word: כִּי טוֹב לִי אָז מֵעָתָּה
  choice: ведь тогда мне было лучше, чем теперь
  rationale: Естественно по-русски передаёт прямое сопоставление прежнего и нынешнего положения.
theological_decisions:
- issue: Брачная метафора неверности Израиля
  choice: Сохранить в основном тексте слова «любовники» и «муж»
  alternative: Заменить их истолковывающими словами «союзники», «покровители» или «боги»
  rationale: Стих прямо использует брачную и сексуальную образность. Хотя любовники могут символизировать чужих богов или политических союзников, перевод не должен устранять намеренную метафору или ограничивать её одним толкованием.
translation_notes:
  register: Современный литературный русский язык; поэтический параллелизм и брачная метафора сохранены без архаизации и конфессионального истолкования.
