  source_fidelity: 'Смысл и параллелизм переданы верно: עתידная формула, обращение к Яхве, противопоставление אִישִׁי и בַּעְלִי, а также игра слов с Ваалом сохранены. Однако в русском прямое обращение «Мой муж» звучит как называние третьего лица, тогда как по смыслу это титул, которым женщина обращается к Яхве; естественнее «муж мой». Нормативная русская передача имени Baal — «Ваал», не «Баал».'
