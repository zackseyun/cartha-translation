base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/018.yaml
  text: And in that day[a], declares Yahweh, you will call me ‘My husband,’ and you will no longer call me ‘My Baal.’
translation:
  language: ru
  text: И будет в тот день, — возвещает Яхве, — ты будешь называть Меня «муж мой» и больше не будешь называть Меня «Ваал мой».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Древнееврейское баали может означать «мой хозяин», «мой господин» и даже «мой муж». Здесь оно передано как «Ваал мой», чтобы сохранить игру слов и вероятную отсылку к поклонению Ваалу в контексте книги Осии.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: И будет в тот день
  rationale: Сохранена традиционная пророческая формула, которая в естественном русском языке передаёт наступление будущего события и торжественный тон исходного текста.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Глагол «возвещает» передаёт торжественную формулу пророческого речения; личное имя יהוה передано транслитерацией «Яхве».
- source_word: תִּקְרְאִי
  choice: ты станешь называть / не будешь называть
  rationale: В данном контексте קרא означает обращаться к кому-либо, употребляя определённое наименование. Обе формы сохраняют параллелизм и значение будущей перемены.
- source_word: אִישִׁי
  choice: Мой муж
  rationale: В брачно-заветном образе אִישׁ с суффиксом первого лица естественно означает «мой муж», подчёркивая восстановление близких отношений.
- source_word: בַּעְלִי
  choice: Мой Баал
  rationale: Транслитерация сохраняет игру слов и вероятную полемическую отсылку к культу Баала, а «мой» передаёт древнееврейский притяжательный суффикс. Другие словарные значения указаны в сноске.
theological_decisions:
- issue: Передавать ли בַּעְלִי его нарицательным значением или сохранить отсылку к Баалу
  choice: Мой Баал
  alternative: мой господин / мой хозяин / мой муж
  rationale: В контексте Осии противопоставлены восстановленная брачная близость и обращение, связанное с именем Баала. Вариант «Мой Баал» сохраняет как антиидолопоклонническую направленность, так и напряжение, создаваемое многозначностью древнееврейского слова; его нарицательные значения отмечены в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Формула «И будет в тот день» намеренно сохраняет библейский ритм; синтаксис остаётся ясным для современного читателя.
