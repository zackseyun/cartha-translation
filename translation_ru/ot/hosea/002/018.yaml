  terminology: «Яхве» последовательно передаёт тетраграмматон. «Ваал» является обычной русской формой имени божества. Строчная буква в «муж мой» уместна как в нарицательном обращении; прописная в «Ваал мой» сохраняет статус имени. Сноска должна отражать именно эту игру слов и приводить нормативное написание имени.
