base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/014.yaml
  text: And I will lay waste her vine and her fig tree[a], of which she said, ‘These are my wages that my lovers gave me.’ I will make them a forest, and the wild animals of the field will devour them.
translation:
  language: ru
  text: 'И опустошу её виноградную лозу и смоковницу, о которых она говорила: «Это моя плата[a], которую дали мне мои любовники». Я обращу их в лес, и полевые звери пожрут их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вознаграждение». Еврейское слово может обозначать плату блуднице, что соответствует образу неверности у Осии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲשִׁמֹּתִי
  choice: И опустошу
  rationale: Каузативная форма от שׁמם означает привести в запустение, опустошить; выбранный глагол ясно передаёт суд и разрушение.
- source_word: גַּפְנָהּ וּתְאֵנָתָהּ
  choice: её виноградную лозу и смоковницу
  rationale: Сохранены единственное число и два конкретных образа возделываемых растений; «смоковница» — понятное литературное название инжирного дерева.
- source_word: אֶתְנָה
  choice: моя плата
  rationale: Слово обозначает плату, в данном контексте — с оттенком платы блуднице. Основной текст сохраняет экономический и нравственный подтекст, не делая метафору более явной, чем оригинал.
- source_word: מְאַהֲבָי
  choice: мои любовники
  rationale: Прямо передаёт образ неверности и не заменяет его истолкованием как указание на богов или политических союзников.
- source_word: וְשַׂמְתִּים לְיַעַר
  choice: Я обращу их в лес
  rationale: Сохраняет образ культурных насаждений, ставших дикой лесной местностью; формулировка естественна по-русски.
- source_word: וַאֲכָלָתַם חַיַּת הַשָּׂדֶה
  choice: и полевые звери пожрут их
  rationale: «Пожрут» передаёт буквальное поедание и разрушительную силу действия животных; «полевые звери» сохраняет устойчивый образ оригинала.
theological_decisions:
- issue: Следует ли прямо обозначить сексуализированный оттенок אֶתְנָה
  choice: В основном тексте употреблено «плата», а специфический оттенок пояснён в сноске.
  alternative: «плата блуднице»
  rationale: Контекст книги уже задаёт метафору супружеской неверности. Более явная формулировка в основном тексте была бы допустимым толкованием, но превосходила бы непосредственную словесную выраженность данной фразы.
- issue: Следует ли раскрывать, кого символизируют «любовники»
  choice: Сохранено «мои любовники» без пояснения в основном тексте.
  alternative: Назвать ложных богов или иноземных союзников.
  rationale: Образ намеренно допускает несколько соотнесённых уровней смысла; перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Слова «смоковница» и «полевые звери» сохраняют достоинство и связь с традиционным библейским словоупотреблением, оставаясь понятными из контекста.
