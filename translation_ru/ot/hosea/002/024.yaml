base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/024.yaml
  text: and the earth will answer the grain[a], the new wine, and the oil, and they will answer Jezreel.
translation:
  language: ru
  text: И земля ответит зерну, молодому вину и маслу, и они ответят Изреелю.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Изреель» означает «Бог сеет»; у Осии оно имеет символическое значение и служит также названием местности и личным именем.
    reason: Передача игры слов и символического значения имени יִזְרְעֶאל.
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: и земля
  rationale: אֶרֶץ допускает значения «земля» и «страна»; здесь цепочка «небеса — земля — земные плоды» указывает на землю как часть творения и сохраняет поэтический образ.
- source_word: תַּעֲנֶה / יַעֲנוּ
  choice: ответит / ответят
  rationale: Повтор одного глагола передаёт намеренную цепь взаимного отклика и олицетворение; более свободное «даст» ослабило бы образ.
- source_word: הַדָּגָן
  choice: зерну
  rationale: דָּגָן обозначает зерно или хлебные злаки вообще; «зерно» естественно и не сужает значение до одной культуры.
- source_word: הַתִּירוֹשׁ
  choice: молодому вину
  rationale: תִּירוֹשׁ обычно обозначает новое, недавно полученное вино; «молодое вино» естественно передаёт сельскохозяйственный оттенок.
- source_word: הַיִּצְהָר
  choice: маслу
  rationale: יִצְהָר — масло как земледельческий продукт, обычно оливковое. В основном тексте сохранено более широкое «масло», без избыточного уточнения.
- source_word: וְהֵם
  choice: а они
  rationale: Местоимение относится к трём перечисленным продуктам. Союз «а» естественно обозначает следующий переход в цепочке, не вводя смыслового противопоставления.
- source_word: יִזְרְעֶאל
  choice: Изреелю
  rationale: Имя передано принятой русской библейской формой; его значимая для Осии игра слов пояснена в сноске.
theological_decisions:
- issue: Сохранить ли повторяющийся олицетворённый образ ответа или заменить его причинным описанием снабжения
  choice: Сохранён повтор «ответит / ответят»
  alternative: «земля даст зерно, молодое вино и масло, а они будут даны Изреелю»
  rationale: Повтор воспроизводит цепь отклика в ближайшем контексте и сохраняет богословско-поэтический образ восстановления творения.
- issue: Как передать символическое имя יִזְרְעֶאל
  choice: В основном тексте оставлено имя «Изреель»
  alternative: «Бог сеет»
  rationale: Еврейский текст употребляет собственное имя, одновременно использованное символически. Перевод значения вместо имени снял бы намеренную многозначность, поэтому смысл указан в сноске.
translation_notes:
  register: Современный литературный русский с сохранением достоинства и поэтической цепочки исходного текста. Необычное сочетание «ответит зерну» сохранено намеренно как олицетворение. Маркер сноски поставлен после имени, к которому относится пояснение.
