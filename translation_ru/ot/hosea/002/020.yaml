- from: И в тот день Я заключу для них завет[a] с дикими зверями, с небесными птицами и с пресмыкающимися по земле. Я уничтожу в стране[b] лук, меч и войну и дам им жить в безопасности.
  to: И в тот день Я заключу для них завет[a] с дикими животными в поле, с птицами небес и с ползающими по земле существами. Я сокрушу в стране[b] лук, меч и войну и дам им покоиться в безопасности.
  rationale: Исправление восстанавливает образ безопасного покоя, выраженный каузативной формой глагола «лечь», уточняет широкую категорию רֶמֶשׂ и приближает перевод שׁבר к его основному значению. Синтаксическое различие «для них» и «с животными» и неоднозначность הָאָרֶץ сохранены; сноски привязаны к соответствующим местам текста.
