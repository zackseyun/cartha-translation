  source_fidelity: Начало стиха в целом точно передаёт различие между לָהֶם («для них») и עִם («с»), а также сохраняет перечень животных и оружия. Однако «дам им жить в безопасности» заменяет конкретный каузативный образ «дам им лечь/покоиться в безопасности» общим выводом о безопасной жизни. «Уничтожу» допустимо по смыслу, но «сокрушу» ближе к שׁבר и сохраняет образ действия над луком и мечом.
  naturalness: Предлагаемая редакция остаётся современным литературным русским. «Дам им покоиться в безопасности» естественно для пророческого регистра и точнее исходного образа, чем «дам им жить в безопасности». «Дикие животные в поле» и «ползающие по земле существа» избегают слишком узкого значения «пресмыкающиеся».
  terminology: «Завет» следует сохранить как основной перевод בְּרִית. «Сокрушу» адекватно передаёт שׁבר; «страна» сохраняет контекстуально вероятный смысл הָאָרֶץ, а сноска честно отмечает вариант «земля».
