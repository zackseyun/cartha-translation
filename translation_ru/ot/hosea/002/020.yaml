  text: וְ/כָרַתִּ֨י לָ/הֶ֤ם בְּרִית֙ בַּ/יּ֣וֹם הַ/ה֔וּא עִם חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/עִם ע֣וֹף הַ/שָּׁמַ֔יִם וְ/רֶ֖מֶשׂ הָֽ/אֲדָמָ֑ה וְ/קֶ֨שֶׁת וְ/חֶ֤רֶב וּ/מִלְחָמָה֙ אֶשְׁבּ֣וֹר מִן הָ/אָ֔רֶץ וְ/הִשְׁכַּבְתִּ֖י/ם לָ/בֶֽטַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/020.yaml
  text: And on that day I will make for them a covenant with the wild animals of the field[a], with the birds of the heavens, and with the creeping things of the ground; and I will break bow and sword and war from the land[c][b], and I will make them lie down in safety.
translation:
  language: ru
  text: И в тот день Я заключу для них завет[a] с дикими животными в поле, с птицами небес и с ползающими по земле существами. Я сокрушу в стране[b] лук, меч и войну и дам им покоиться в безопасности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «рассеку завет». В древнееврейском это обычное выражение со значением «заключить завет».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на земле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָרַתִּי בְּרִית
  choice: заключу … завет
  rationale: Еврейское выражение буквально означает «рассечь завет», но является обычной идиомой заключения завета. Русское «заключить завет» естественно передаёт его смысл и сохраняет ключевой богословский термин.
- source_word: לָהֶם
  choice: для них
  rationale: Предлог ל обозначает адресатов или получателей блага, тогда как далее участники, с которыми заключается завет, вводятся предлогом עִם («с»). Перевод сохраняет это синтаксическое различие.
- source_word: חַיַּת הַשָּׂדֶה
  choice: дикие звери
  rationale: Сочетание обозначает животных открытой местности, в данном контексте — диких наземных животных. «Звери» звучит естественно и достойно в современном русском языке.
- source_word: עוֹף הַשָּׁמַיִם
  choice: небесные птицы
  rationale: עוֹף обозначает летающих существ, обычно птиц; «небесные птицы» сохраняет образ и библейскую возвышенность без архаизма.
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: пресмыкающиеся по земле
  rationale: רֶמֶשׂ охватывает ползающих существ. Формулировка близка к еврейскому образу и понятна современному читателю; «земля» здесь передаёт אֲדָמָה как почву или поверхность земли.
- source_word: וְקֶשֶׁת וְחֶרֶב וּמִלְחָמָה
  choice: лук, меч и войну
  rationale: Сохранено поэтическое перечисление двух видов оружия и войны в целом, без сведения их к обобщённому слову «оружие».
- source_word: אֶשְׁבּוֹר מִן הָאָרֶץ
  choice: уничтожу в стране
  rationale: Глагол שׁבר буквально означает «сломаю, сокрушу», но относится одновременно к луку, мечу и войне. «Уничтожу» естественно охватывает весь ряд, а «в стране» передаёт прекращение их присутствия там.
- source_word: וְהִשְׁכַּבְתִּים לָבֶטַח
  choice: дам им жить в безопасности
  rationale: Каузативная форма שׁכב буквально описывает то, как Бог даёт им лечь или покоиться; в сочетании с לָבֶטַח она выражает дар безопасной, спокойной жизни. Русская формулировка естественно передаёт этот результат, не устраняя каузативную роль Бога.
theological_decisions:
- issue: Соотношение получателей завета и тех, с кем он заключается
  choice: 'Бог заключает завет «для них» с животным миром: восстановленный народ является получателем мира и безопасности.'
  alternative: Бог заключает завет совместно с народом и животными как с однородными сторонами.
  rationale: Еврейский текст различает לָהֶם («для них») и повторяющееся עִם («с») перед группами животных. Сохранение различия не позволяет без основания уравнять их синтаксические роли.
- issue: Объём значения הָאָרֶץ
  choice: страна
  alternative: земля; вся земля
  rationale: Контекст обещает народу восстановление и безопасность в месте его обитания. «Страна» передаёт вероятный территориальный смысл, а более широкая возможность отмечена в сноске.
- issue: Образ безопасного покоя
  choice: дам им жить в безопасности
  alternative: уложу их в безопасности; дам им спокойно лечь
  rationale: Буквальный образ лежания может иметь пастырские и мирные оттенки, однако по-русски буквальная каузативная конструкция звучит неестественно. Выбранный перевод сохраняет Божье действие и обещание безопасности, не уточняя, идёт ли речь о сне, отдыхе или оседлой мирной жизни.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Сохранены пророческая формула «в тот день», термин «завет» и трёхчастное перечисление «лук, меч и война»; синтаксис сделан естественным для публичного чтения.
