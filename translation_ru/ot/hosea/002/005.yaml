  text: פֶּן אַפְשִׁיטֶ֣/נָּה עֲרֻמָּ֔ה וְ/הִ֨צַּגְתִּ֔י/הָ כְּ/י֖וֹם הִוָּֽלְדָ֑/הּ וְ/שַׂמְתִּ֣י/הָ כַ/מִּדְבָּ֗ר וְ/שַׁתִּ֨/הָ֙ כְּ/אֶ֣רֶץ צִיָּ֔ה וַ/הֲמִתִּ֖י/הָ בַּ/צָּמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/005.yaml
  text: or else I will strip her naked and expose her as on the day she was born[a], and make her like the wilderness, and make her like a parched land[b], and let her die of thirst.
translation:
  language: ru
  text: иначе[a] Я раздену её донага и выставлю её, как в день, когда она родилась, сделаю её подобной пустыне, сделаю её подобной иссохшей земле и уморю её жаждой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «чтобы Я не раздел её донага». Еврейская частица может формально вводить предотвращаемое или угрожающее последствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «причиню ей смерть жаждой». Еврейская форма глагола имеет каузативное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: иначе
  rationale: Частица вводит угрожающее последствие ранее высказанного требования. «Иначе» естественно передаёт в современном русском языке силу предупреждения, не превращая её в отдельное условное предложение.
- source_word: אַפְשִׁיטֶנָּה עֲרֻמָּה
  choice: раздену её донага
  rationale: Сочетание каузативного глагола со словом «нагая» выражает полное лишение одежды. Русское «раздену донага» прямо и естественно сохраняет образ унижения и обнажения.
- source_word: וְהִצַּגְתִּיהָ
  choice: и выставлю её
  rationale: Глагол означает поставить или представить кого-либо на виду. «Выставлю её» сохраняет конкретный образ публичного обнажения, не добавляя прямо отсутствующего в тексте «напоказ».
- source_word: כְּיוֹם הִוָּלְדָהּ
  choice: как в день её рождения
  rationale: Формулировка близко передаёт сравнение с беспомощным и непокрытым состоянием при рождении и звучит естественно по-русски.
- source_word: וְשַׂמְתִּיהָ כַמִּדְבָּר
  choice: сделаю её подобной пустыне
  rationale: מִדְבָּר обозначает пустынную, необитаемую местность. «Подобной пустыне» сохраняет сравнение и образ опустошения.
- source_word: וְשַׁתִּהָ כְּאֶרֶץ צִיָּה
  choice: сделаю её подобной иссохшей земле
  rationale: צִיָּה обозначает сухую, лишённую влаги землю. «Иссохшая земля» наглядно передаёт засушливость и усиливает предшествующий образ пустыни.
- source_word: וַהֲמִתִּיהָ בַּצָּמָא
  choice: уморю её жаждой
  rationale: Каузативная форма буквально выражает причинение смерти посредством жажды. «Уморю её жаждой» сохраняет эту каузативность и при этом является естественным русским выражением.
theological_decisions:
- issue: Метафорический образ суда над неверной женщиной/Израилем
  choice: Сохранить конкретные телесные образы обнажения, опустошения и смерти от жажды.
  alternative: Передать стих отвлечённо как угрозу унижения и лишений.
  rationale: Богословская напряжённость стиха заключена в резких образах заветного суда. Перевод не смягчает их и не заменяет истолкованием.
- issue: Переход от образа женщины к образу земли
  choice: Сохранить грамматически женский объект во всех сравнениях, не уточняя, означает ли он женщину, народ или страну.
  alternative: Явно назвать Израиль или его землю.
  rationale: В еврейском тексте образы женщины и иссохшей земли намеренно накладываются друг на друга; поясняющая подстановка устранила бы эту поэтическую и богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской образностью. Синтаксический параллелизм двух выражений «сделаю её подобной…» сохранён намеренно; резкость образов не смягчена.
