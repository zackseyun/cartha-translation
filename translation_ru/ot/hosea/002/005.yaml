  terminology: '«Донага», «выставлю её», «пустыня», «иссохшая земля» и «уморю её жаждой» соответствуют регистру и образному строю стиха. Не следует заменять «выставлю» толковательским «выставлю напоказ»: публичность вытекает из образа, но добавочное обстоятельство в оригинале не выражено. Русская сноска a должна давать грамматически корректную альтернативу с «чтобы Я не раздел».'
