  source_fidelity: 'В целом перевод точно передаёт последовательность угроз и ключевые образы еврейского текста: פֶּן — предупреждающее «иначе», «раздену ... донага», публичное выставление, уподобление пустыне и иссохшей земле, а также каузативное умерщвление жаждой. «Уморю её жаждой» удачно сохраняет каузативную силу וַהֲמִתִּיהָ בַּצָּמָא лучше, чем неконкретное «дам ей умереть». Уточнение в сравнении с рождением требуется ради точности русского смысла.'
