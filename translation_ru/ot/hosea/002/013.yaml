  yaml_path: translation/ot/hosea/002/013.yaml
  text: And I will put an end to all her rejoicing—her feasts[a], her new moons, her Sabbaths[b], and all her appointed times.
translation:
  language: ru
  text: 'И Я положу конец всей её радости: её праздникам, новолуниям, субботам и всем её установленным праздникам[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всем её назначенным временам»; еврейское слово может означать назначенное время, праздник или праздничное собрание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבַּתִּי
  choice: И Я положу конец
  rationale: Каузативная форма глагола שׁבת означает, что Бог заставит празднование прекратиться; выражение «положу конец» естественно передаёт эту силу по-русски.
- source_word: כָּל מְשׂוֹשָׂהּ
  choice: всему её веселью
  rationale: Сохраняет всеохватность כָּל и передаёт מָשׂוֹשׂ как радость, веселье и ликование; далее перечисляются поводы для этого веселья.
- source_word: חַגָּהּ
  choice: её праздникам
  rationale: חַג обозначает религиозный праздник, нередко паломнический; единственное число с суффиксом здесь имеет собирательный смысл, естественно передаваемый русским множественным числом.
- source_word: חָדְשָׁהּ
  choice: новолуниям
  rationale: В культовом контексте חֹדֶשׁ означает не просто месяц, а религиозное празднование новолуния.
- source_word: וְשַׁבַּתָּהּ
  choice: субботам
  rationale: Передаёт собирательное обозначение регулярно соблюдаемых субботних дней без добавочного истолкования.
- source_word: וְכֹל מוֹעֲדָהּ
  choice: и всем её установленным временам
  rationale: מוֹעֵד может обозначать назначенное время или установленное праздничное собрание. Буквально более широкое «установленные времена» сохраняет эту многозначность и не дублирует слово «праздники».
theological_decisions:
- issue: Характер перечисленных событий
  choice: Перечень относится прежде всего к установленным религиозным празднованиям Израиля, прекращаемым как часть суда.
  alternative: Начальные слова можно понимать шире — как прекращение всякой общественной радости.
  rationale: Праздники, новолуния, субботы и установленные времена образуют язык религиозного календаря, тогда как вводное «всё её веселье» сохраняет более широкий оттенок.
- issue: Значение מוֹעֵד
  choice: Сохранено более широкое «установленные времена».
  alternative: «Установленные праздники» или «праздничные собрания».
  rationale: Контекст явно культовый, однако само слово допускает как временное, так и празднично-собранийное значение; перевод не должен без необходимости устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; тон строгий и достойный. Синтаксис сохраняет торжественное перечисление оригинала, но избегает архаизмов. Местоимение «Я» написано с прописной буквы как прямая речь Бога.
