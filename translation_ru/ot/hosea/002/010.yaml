source:
  edition: WLC
  text: וְ/הִיא֙ לֹ֣א יָֽדְעָ֔ה כִּ֤י אָֽנֹכִי֙ נָתַ֣תִּי לָ֔/הּ הַ/דָּגָ֖ן וְ/הַ/תִּיר֣וֹשׁ וְ/הַ/יִּצְהָ֑ר וְ/כֶ֨סֶף הִרְבֵּ֥יתִי לָ֛/הּ וְ/זָהָ֖ב עָשׂ֥וּ לַ/בָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/010.yaml
  text: But she did not know that it was I who gave her the grain[a], the new wine, and the oil, and who multiplied silver for her and gold[b], which they made into Baal.
translation:
  language: ru
  text: А она не знала, что именно Я дал ей зерно, молодое вино и масло, умножил для неё серебро и золото, которые они использовали для Ваала[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский оборот краток. Возможен также перевод: «из которых они сделали изображение Ваала». Он может указывать либо на изготовление идола, либо шире — на использование этих даров в поклонении Ваалу.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִיא
  choice: А она
  rationale: Союз вводит противопоставление предыдущему контексту, а местоимение сохраняет явно выраженное подлежащее женского рода.
- source_word: לֹא יָדְעָה
  choice: не знала
  rationale: Прямое значение ידע в породе qal — «знать»; в контексте подразумевается также непризнание источника даров, но это раскрывается самим контекстом.
- source_word: כִּי אָנֹכִי
  choice: что именно Я
  rationale: כִּי вводит содержание того, чего она не знала, а самостоятельное אָנֹכִי подчёркивает говорящего; частица «именно» передаёт это ударение.
- source_word: נָתַתִּי לָהּ
  choice: давал ей
  rationale: Несовершенный вид естественно выражает постоянное Божье снабжение, подразумеваемое перечислением сельскохозяйственных благ.
- source_word: הַדָּגָן
  choice: зерно
  rationale: דגן обозначает хлебные злаки или зерновой урожай вообще.
- source_word: הַתִּירוֹשׁ
  choice: молодое вино
  rationale: תירוש обозначает новое вино как плод урожая; «молодое вино» понятно современному читателю и сохраняет отличие от общего обозначения вина.
- source_word: הַיִּצְהָר
  choice: масло
  rationale: יצהר — свежее растительное, обычно оливковое, масло как сельскохозяйственный продукт; в русском «масло» здесь звучит естественно и достаточно точно.
- source_word: וְכֶסֶף הִרְבֵּיתִי לָהּ
  choice: умножал для неё серебро
  rationale: Формулировка сохраняет каузативное значение רבה и мысль об изобилии, не превращая серебро в ещё один явно названный дар.
- source_word: וְזָהָב עָשׂוּ לַבָּעַל
  choice: а золото они использовали для Ваала
  rationale: Так переданы внезапная смена лица на множественное число и связь золота с почитанием Ваала, при этом неоднозначность краткого оборота поясняется в сноске.
theological_decisions:
- issue: Значение לַבָּעַל в контексте идолопоклонства
  choice: для Ваала
  alternative: для господина
  rationale: Здесь בַּעַל — имя ханаанского божества, а не общее обозначение господина.
- issue: Смысл עָשׂוּ לַבָּעַל
  choice: использовали для Ваала
  alternative: сделали из него изображение Ваала
  rationale: Еврейский оборот краток и допускает как изготовление идола, так и более общее употребление золота в культе Ваала; основной текст не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены эмфатическое «Я», переход от единственного числа «она» к множественному «они» и смысловая неоднозначность заключительного оборота.
