source:
  edition: WLC
  text: לָ/כֵ֗ן הִנֵּ֤ה אָֽנֹכִי֙ מְפַתֶּ֔י/הָ וְ/הֹֽלַכְתִּ֖י/הָ הַ/מִּדְבָּ֑ר וְ/דִבַּרְתִּ֖י עַל לִבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/016.yaml
  text: Therefore[a], behold, I am going to allure her, and I will lead her into the wilderness and speak to her heart.
translation:
  language: ru
  text: 'Поэтому вот: Я привлеку её, поведу её в пустыню и буду говорить к её сердцу[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду ласково говорить с ней». Буквально: «буду говорить к её сердцу».'
    reason: 'Лексическая альтернатива: еврейское выражение обозначает близкую, располагающую или утешающую речь, при этом буквально сохраняет образ обращения к сердцу.'
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт следственный переход от предшествующего суда к неожиданному обещанию восстановления.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет функцию привлечения внимания и пророческое усиление, оставаясь естественным для современного русского языка.
- source_word: אָנֹכִי
  choice: Я
  rationale: 'Самостоятельное местоимение подчёркивает действующее лицо; в русском это ударение поддерживается сочетанием «вот: Я» без добавления потенциально чрезмерного «Сам».'
- source_word: מְפַתֶּיהָ
  choice: привлеку её
  rationale: В брачной метафоре глагол обозначает убеждающее, располагающее к себе действие. «Привлеку» сохраняет положительный оттенок сближения, не внося отрицательных ассоциаций слов «обольщу» или «завлеку».
- source_word: וְהֹלַכְתִּיהָ
  choice: поведу её
  rationale: Каузативная форма от הלך означает «заставить идти, повести»; перевод передаёт целенаправленное водительство, а не просто перемещение.
- source_word: הַמִּדְבָּר
  choice: в пустыню
  rationale: Обычный библейский эквивалент, сохраняющий как географический смысл, так и связь с местом прежней встречи Израиля с Богом.
- source_word: וְדִבַּרְתִּי עַל לִבָּהּ
  choice: и буду говорить к её сердцу
  rationale: Сохраняет образное выражение оригинала и его оттенки близкой, убеждающей и утешающей речи; более идиоматическое толкование вынесено в примечание.
theological_decisions:
- issue: Характер Божьего действия в מְפַתֶּיהָ внутри метафоры восстановления брака
  choice: привлеку её
  alternative: уговорю её; обольщу её; буду добиваться её расположения
  rationale: Контекст говорит не о принуждении или нравственно сомнительном соблазнении, а о возобновлении отношений после суда. Выбор сохраняет эмоционально-убеждающий смысл, не снимая напряжения между судом и восстановлением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис краток и ритмичен; буквальный образ «говорить к её сердцу» сохранён в основном тексте, а его естественный идиоматический смысл пояснён в сноске.
