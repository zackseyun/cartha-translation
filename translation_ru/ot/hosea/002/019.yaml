lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: И удалю
  rationale: 'Порода hифиль глагола סור выражает причинное значение: «устранить, удалить». Форма первого лица сохраняет прямую речь Бога, а начальное ו передано союзом «и».'
- source_word: שְׁמוֹת הַבְּעָלִים
  choice: имена Ваалов
  rationale: שְׁמוֹת означает «имена», а множественное הַבְּעָלִים в контексте Осии указывает на языческих божеств, а не просто на «господ» или «хозяев». Традиционная русская форма «Ваалы» сохраняет культовый референт.
- source_word: מִפִּיהָ
  choice: из её уст
  rationale: Буквальный образ речи и призывания по имени сохранён; «из её уст» естественно для современного литературного русского языка и соответствует возвышенному пророческому регистру.
- source_word: וְלֹא יִזָּכְרוּ עוֹד
  choice: и больше их не будут упоминать
  rationale: Нифаль глагола זכר может означать как «быть вспомянутым», так и «быть упомянутым». Безличная русская конструкция естественно передаёт пассивное значение; «упоминать» особенно хорошо соответствует контексту прекращения культового призывания Ваалов.
- source_word: בִּשְׁמָם
  choice: по имени
  rationale: Хотя в еврейском стоит существительное в единственном числе с местоименным суффиксом третьего лица множественного числа, оборот имеет идиоматическое значение «по имени». Такой перевод точен по смыслу и естествен по-русски.
theological_decisions:
- issue: Кого обозначают «Ваалы»
  choice: Языческие божества, связанные с отступничеством Израиля
  alternative: Человеческие «господа» или «хозяева»
  rationale: В брачной метафоре и антиидолопоклоннической полемике Осии множественное число указывает на почитаемых Ваалов. Перевод не добавляет слова «идолы», но ясно сохраняет противопоставление ложных богов Господу.
- issue: Значение прекращения זכר
  choice: Их больше не будут упоминать по имени
  alternative: Их больше не будут вспоминать по имени
  rationale: Оба смысла лексически возможны и богословски согласуются с прекращением поклонения Ваалам. Основной текст выбирает наиболее естественную в данном контексте формулировку, а альтернативу сохраняет в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранён образ «из её уст», но синтаксис сделан естественным для обычного современного читателя.
