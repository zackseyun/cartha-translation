  yaml_path: translation/ot/hosea/002/006.yaml
  text: And I will not show compassion to her children[a], for they are children of whoredom.
translation:
  language: ru
  text: И детей её не помилую, потому что они — дети блуда[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети проституции» или «дети разврата». В еврейском тексте сохранён резкий образ половой неверности, символизирующей нарушение верности завету.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בָּנֶיהָ
  choice: И детей её
  rationale: וְ связывает эту фразу с предыдущей, אֶת отмечает прямое дополнение и отдельно не переводится, а בָּנֶיהָ здесь естественно передать собирательным «детей её», не ограничивая смысл сыновьями.
- source_word: לֹא אֲרַחֵם
  choice: не помилую
  rationale: Форма глагола רחם означает проявить милость или сострадание. «Не помилую» кратко, естественно для пророческой речи и сохраняет как эмоциональную, так и заветную силу выражения.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание отказа в милости; «потому что» ясно передаёт причинную связь.
- source_word: בְנֵי זְנוּנִים
  choice: дети блуда
  rationale: Выражение сохраняет резкий образ половой неверности, который у Осии служит образом неверности завету. «Блуд» в современном литературном русском остаётся понятным и звучит менее клинически, чем «проституция».
- source_word: הֵמָּה
  choice: они —
  rationale: Самостоятельное местоимение придаёт утверждению некоторое ударение; явное «они» и тире естественно передают его в русском синтаксисе.
theological_decisions:
- issue: Смысл выражения בְנֵי זְנוּנִים в брачной метафоре Осии
  choice: дети блуда
  alternative: дети проституции; дети неверности
  rationale: Перевод сохраняет намеренно жёсткую сексуальную образность пророческого знамения и одновременно не сводит её ни к абстрактной «неверности», ни к более узкому утверждению о буквальном происхождении детей.
translation_notes:
  register: Современный литературный русский с лаконичным, достойным пророческим звучанием. Традиционно понятное «блуд» сохраняет силу исходной метафоры без архаизации всего предложения.
