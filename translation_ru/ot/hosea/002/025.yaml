base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/025.yaml
  text: And I will sow her for myself in the land[a], and I will have mercy on No Mercy, and I will say to Not My People, ‘You are my people,’ and he will say[c][b], ‘My God.’
translation:
  language: ru
  text: 'И посею её для Себя на земле[a], и помилую Непомилованную[b], и скажу «Не Мой Народ»: «Ты — Мой народ». А он скажет[c]: «Бог мой!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в стране». Еврейское слово אֶרֶץ может означать как землю вообще, так и определённую страну; в контексте восстановления завета возможно территориальное значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционная транслитерация символических имён — Ло-Рухама («Непомилованная») и Ло-Амми («Не Мой Народ»). Здесь имена переведены, чтобы сохранить игру слов: прежний приговор обращается в милость и восстановление принадлежности Богу.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «и он скажет». Единственное число мужского рода, вероятно, представляет восстановленный народ как одного отвечающего собеседника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזְרַעְתִּיהָ
  choice: посею её
  rationale: Глагол זרע передан в его основном земледельческом значении. «Посею» сохраняет образ сеяния и связь с именем Изреель; местоимение женского рода точно отражает суффикс 3-го лица женского рода.
- source_word: לִּי
  choice: для Себя
  rationale: Дательный оттенок принадлежности и пользы передан естественным русским оборотом, подчёркивающим, что Господь вновь принимает народ как Свой.
- source_word: בָּאָרֶץ
  choice: на земле
  rationale: אֶרֶץ допускает значения «земля» и «страна». Русское «на земле» сохраняет образ посева и не устраняет исходную смысловую широту; территориальное прочтение отмечено в сноске.
- source_word: וְרִחַמְתִּי אֶת לֹא רֻחָמָה
  choice: помилую Непомилованную
  rationale: Однокоренные «помилую — Непомилованную» ясно воспроизводят обращение прежнего суда в милость и сохраняют игру слов символического имени.
- source_word: לְלֹא עַמִּי
  choice: тому, кто назван «Не Мой Народ»
  rationale: Символическое имя переведено, чтобы сделать пророческую игру слов прозрачной. Небольшая синтаксическая перестройка позволяет сохранить форму имени и одновременно избежать неестественного русского «Не Моему Народу».
- source_word: עַמִּי אַתָּה
  choice: Ты — Мой народ
  rationale: Сохранены единственное число обращения и формула заветной принадлежности.
- source_word: וְהוּא יֹאמַר
  choice: А он скажет
  rationale: Мужской род и единственное число исходного текста сохранены; восстановленный народ представлен как единый отвечающий собеседник.
- source_word: אֱלֹהָי
  choice: Бог мой!
  rationale: Краткое именное исповедание передано без добавления глагола; русский порядок слов звучит естественно и торжественно.
theological_decisions:
- issue: Передача символических имён детей Осии
  choice: Перевести как «Непомилованная» и «Не Мой Народ»
  alternative: Транслитерировать как «Ло-Рухама» и «Ло-Амми»
  rationale: Смысл стиха строится на явном обращении имён суда в формулы восстановления. Перевод имён сохраняет эту богословскую и риторическую связь для современного читателя; традиционные транслитерации приведены в сноске.
- issue: Единственное число и мужской род ответа народа
  choice: «он скажет»
  alternative: «они скажут» или безличная перестройка
  rationale: Еврейский текст недвусмысленно употребляет местоимение и глагол 3-го лица мужского рода единственного числа. Такая форма сохраняет образ народа как единого лица, не превращая его без объяснения во множественное число.
- issue: Объём исповедания אֱלֹהָי
  choice: «Бог мой!»
  alternative: «Ты — мой Бог!»
  rationale: В исходном тексте стоит только притяжательная именная форма «мой Бог». Краткая русская формула сохраняет её напряжённую лаконичность и не добавляет отсутствующего местоимения.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены краткость пророческих формул, повтор ключевых слов и грамматически отмеченное единственное число. Заглавные буквы в «Себя», «Мой» обозначают отнесённость к Богу; символические имена выделены как имена.
