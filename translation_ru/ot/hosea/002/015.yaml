base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/015.yaml
  text: And I will punish her for the days of the Baals[a], when she burned incense to them and adorned herself with her ring and her jewelry, and went after her lovers, but forgot me, declares Yahweh.
translation:
  language: ru
  text: И Я накажу её за дни служения Ваалам, когда она воскуряла им благовония, украшала себя кольцом[a] и украшениями, ходила за своими любовниками, а Меня забыла, — возвещает Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «носовым кольцом» или «серьгой». Еврейское слово נֶזֶם обозначает кольцевидное украшение, часто носовое кольцо либо серьгу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי עָלֶיהָ
  choice: И Я взыщу с неё
  rationale: פָקַד с עַל в контексте суда означает призвать к ответу, наказать; «взыщу с неё» естественно передаёт судебный смысл и сохраняет торжественный пророческий регистр.
- source_word: יְמֵי הַבְּעָלִים
  choice: дни служения Баалам
  rationale: Множественное הַבְּעָלִים передано как «Баалам», то есть различным местным проявлениям или культовым образам Баала; добавление «служения» проясняет, что речь о времени или случаях их почитания.
- source_word: אֲשֶׁר תַּקְטִיר לָהֶם
  choice: когда она воскуряла им благовония
  rationale: Hiphil קטר обозначает возжигание с образованием жертвенного дыма, часто воскурение благовоний; выбранная формулировка естественна для культового контекста.
- source_word: וַתַּעַד
  choice: украшала себя
  rationale: Глагол עדה здесь выражает надевание украшений; возвратная конструкция ясно передаёт смысл.
- source_word: נִזְמָהּ
  choice: кольцом[a]
  rationale: נֶזֶם — кольцевидное украшение, нередко носовое кольцо или серьга; общее «кольцо» оставляет точный вид украшения открытым, а сноска сохраняет варианты.
- source_word: וְחֶלְיָתָהּ
  choice: и драгоценностями
  rationale: חֶלְיָה обозначает украшение или драгоценность; множественное русское выражение естественно передаёт собирательный смысл.
- source_word: מְאַהֲבֶיהָ
  choice: своими любовниками
  rationale: В брачной метафоре Осии это незаконные партнёры, образ иных богов и связанных с ними упований; «любовники» сохраняет прямоту и метафорическую силу.
- source_word: וְאֹתִי שָׁכְחָה
  choice: а Меня забыла
  rationale: Союз ו в контексте имеет противопоставительный оттенок; «а» естественно подчёркивает контраст между погоней за любовниками и забвением Бога.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: נְאֻם — формула торжественного божественного изречения; имя יהוה передано как «Яхве», сохраняя личное имя завета.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; «Яхве» передаёт личное имя Бога и соответствует предоставленному решению консультационного слоя.
- issue: Образ любовников
  choice: 'сохранена брачная метафора: «любовниками»'
  alternative: идолами; чужими богами; союзниками
  rationale: 'Текст намеренно не сводит образ к одному референту: он может охватывать Ваалов, идолопоклонство и связанные с ним политические упования. Сохранение метафоры не устраняет эту богословскую многозначность.'
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Синтаксис остаётся понятным широкой аудитории; брачная метафора и неоднозначность вида украшения сохранены.
