base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/022.yaml
  text: And I will betroth you to myself in faithfulness[a], and you shall know Yahweh.
translation:
  language: ru
  text: И обручу тебя с Собою в верности[a], и ты познаешь Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в преданности»; более буквально возможно: «в вере». Еврейское слово выражает надёжность, постоянство и верность завету.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵרַשְׂתִּיךְ
  choice: И обручу тебя
  rationale: Глагол ארשׂ обозначает именно обручение. Такая передача сохраняет брачно-заветный образ и не заменяет его более общим словом «женюсь».
- source_word: לִי
  choice: с Собою
  rationale: Буквально — «Мне». В сочетании с русским глаголом «обручить» естественное управление требует «с Собою»; возвратная форма также передаёт личную направленность заветного отношения.
- source_word: בֶּאֱמוּנָה
  choice: в верности
  rationale: Здесь אֱמוּנָה означает надёжность, постоянство и верность в отношениях завета. «В верности» естественно звучит в брачном контексте, не сводя смысл к субъективной вере.
- source_word: וְיָדַעַתְּ
  choice: и ты познаешь
  rationale: ידע означает «знать, познавать» и в книге Осии обладает глубоким личным и заветным смыслом. «Познаешь» сохраняет этот смысл, не раскрывая его посредством толкования в основном тексте.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом «Господь».
theological_decisions:
- issue: Личный и заветный смысл глагола «познать»
  choice: Сохранить в основном тексте «познаешь» без поясняющего расширения.
  alternative: «признаешь Яхве» или «близко познаешь Яхве»
  rationale: Контекст наполняет глагол личным и заветным содержанием, однако поясняющее расширение сузило бы многозначность еврейского ידע и внесло бы толкование непосредственно в текст.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Обручу» точно сохраняет брачную метафору; «с Собою» соответствует естественному русскому управлению. Местоимение «Собою» написано с прописной буквы как уважительное обозначение Бога.
