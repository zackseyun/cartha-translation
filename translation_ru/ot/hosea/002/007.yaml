  variant: modern literary Russian
source:
  edition: WLC
  text: כִּ֤י זָֽנְתָה֙ אִמָּ֔/ם הֹבִ֖ישָׁה הֽוֹרָתָ֑/ם כִּ֣י אָמְרָ֗ה אֵלְכָ֞ה אַחֲרֵ֤י מְאַהֲבַ/י֙ נֹתְנֵ֤י לַחְמִ/י֙ וּ/מֵימַ֔/י צַמְרִ֣/י וּ/פִשְׁתִּ֔/י שַׁמְנִ֖/י וְ/שִׁקּוּיָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/007.yaml
  text: For their mother has prostituted herself[a]; she who conceived them has acted shamefully. For she said, ‘I will go after my lovers, those who give me my bread and my water, my wool and my flax[d][c][b], my oil and my drink.’
translation:
  language: ru
  text: 'Ведь их мать блудила[a]; зачавшая их[c] поступила постыдно[b]. Она говорила: «Пойду за своими любовниками — за теми, кто даёт мне мой хлеб и мою воду, мою шерсть и мой лён, моё масло и моё питьё[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «занималась проституцией». Еврейский глагол использует прямой сексуальный образ для неверности завету.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «опозорила их»; еврейская форма может указывать либо на постыдное поведение, либо на причинение стыда другим.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «та, которая зачала их»; это выражение поэтически перекликается со словами «их мать».'
    reason: lexical_clarification
  - marker: d
    text: 'Или: «мои напитки», «мой запас питья».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זָנְתָה
  choice: блудила
  rationale: Глагол прямо передаёт незаконные сексуальные отношения и в пророческой метафоре обозначает неверность завету. «Блудила» сохраняет силу образа, не сводя его лишь к отвлечённой «неверности».
- source_word: אִמָּם
  choice: их мать
  rationale: Прямая передача формы с местоименным суффиксом; в развёрнутой метафоре речь идёт о матери детей.
- source_word: הֹבִישָׁה
  choice: поступила постыдно
  rationale: Порода hifil допускает значение как причинения стыда, так и постыдного поведения. Женский род глагола и параллелизм указывают прежде всего на поведение матери.
- source_word: הוֹרָתָם
  choice: зачавшая их
  rationale: Сохраняет значение корня הרה «зачать, быть беременной» и поэтический параллелизм с выражением «их мать».
- source_word: אֵלְכָה אַחֲרֵי
  choice: пойду за
  rationale: Естественно передаёт движение вслед за любовниками и намерение искать их.
- source_word: מְאַהֲבַי
  choice: своими любовниками
  rationale: В брачной метафоре речь идёт о незаконных партнёрах; слово «любовники» ясно сохраняет этот смысл.
- source_word: נֹתְנֵי
  choice: за теми, кто даёт мне
  rationale: Субстантивированное причастие представлено как характеристика любовников, которых женщина считает источником своих благ.
- source_word: לַחְמִי וּמֵימַי
  choice: мой хлеб и мою воду
  rationale: Сохранены конкретные образы основных средств пропитания.
- source_word: צַמְרִי וּפִשְׁתִּי
  choice: мою шерсть и мой лён
  rationale: «Лён» передаёт сырьё, названное еврейским словом, не заменяя его готовой льняной тканью.
- source_word: שַׁמְנִי
  choice: моё масло
  rationale: Передаёт общее обозначение масла без добавления отсутствующего в тексте уточнения «оливковое».
- source_word: שִׁקּוּיָי
  choice: моё питьё
  rationale: Собирательное «питьё» естественно по-русски передаёт напиток или запас напитков, сохраняя некоторую широту значения.
theological_decisions:
- issue: Брачная метафора и неверность завету
  choice: Сохранить откровенную сексуальную образность в словах «блудила» и «любовники».
  alternative: Смягчить до «была неверна» и «те, кого я люблю».
  rationale: Осия намеренно изображает идолопоклонство Израиля как супружескую и сексуальную измену. Прямая передача сохраняет богословскую силу метафоры, не добавляя к ней конфессионального толкования.
- issue: Кого опозорила мать
  choice: Понять הֹבִישָׁה как описание её собственного постыдного поведения.
  alternative: 'Перевести: «опозорила их».'
  rationale: Обе возможности лексически допустимы, однако параллелизм с «их мать блудила» и последовательность форм женского рода лучше поддерживают значение «поступила постыдно». Альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис остаётся ясным для обычного читателя; конкретные образы хлеба, воды, шерсти, льна, масла и питья сохранены. Двоеточие и тире помогают естественно представить прямую речь и пояснительное причастие.
