  text: לָ/כֵ֛ן הִנְ/נִי שָׂ֥ךְ אֶת דַּרְכֵּ֖/ךְ בַּ/סִּירִ֑ים וְ/גָֽדַרְתִּי֙ אֶת גְּדֵרָ֔/הּ וּ/נְתִיבוֹתֶ֖י/הָ לֹ֥א תִמְצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/008.yaml
  text: Therefore[a], behold, I am hedging up your way with thorns[c][b], and I will wall in her wall so that she will not find her paths.
translation:
  language: ru
  text: 'Поэтому вот: Я заграждаю твой путь терновником[a] и обнесу её стеной[b], так что она не найдёт своих троп[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «колючим кустарником»; возможно также: «терновыми зарослями».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский оборот краток и необычен; буквально он близок к «огражу её оградой». Глагол и существительное здесь однокоренны. Смысл, вероятно, в том, что Бог воздвигнет вокруг неё преграду.
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте речь переходит от прямого обращения «твой путь» к третьему лицу — «она… своих троп». Этот риторический переход сохранён.
    reason: alternative_reading
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт следствие, вытекающее из предшествующего обвинения и объявления суда.
- source_word: הִנְנִי
  choice: вот, Я
  rationale: Сохраняет эмфатическое указание на непосредственно предстоящее действие Бога и звучит естественно в возвышенной современной русской речи.
- source_word: שָׂךְ
  choice: заграждаю
  rationale: Причастная форма изображает действие как уже предстоящее или начинающееся; глагол передаёт создание преграды, не устраняя образ пути.
- source_word: דַּרְכֵּךְ
  choice: твой путь
  rationale: Сохраняет единственное число, обращение во втором лице женского рода и возможность как буквального, так и переносного понимания пути.
- source_word: בַּסִּירִים
  choice: терновником
  rationale: Естественно передаёт собирательный образ колючей растительности, которой заграждают дорогу.
- source_word: וְגָדַרְתִּי אֶת־גְּדֵרָהּ
  choice: и обнесу её стеной
  rationale: Передаёт усиление образа — от колючей преграды к стене — и возможную функцию однокоренного существительного как внутреннего дополнения; необычность еврейского оборота отмечена в сноске.
- source_word: וּנְתִיבוֹתֶיהָ
  choice: своих троп
  rationale: Передаёт множественное число и принадлежность троп женщине; переход к третьему лицу виден по форме «она» и пояснён в сноске.
- source_word: לֹא תִמְצָא
  choice: так что она не найдёт
  rationale: «Так что» естественно выражает результат воздвигнутых препятствий, не превращая его однозначно в отдельную цель.
theological_decisions:
- issue: Переход от второго лица к третьему
  choice: 'Сохранён переход: «твой путь» — «она не найдёт своих троп».'
  alternative: Согласовать всё во втором лице («ты не найдёшь своих троп») либо всё в третьем лице («её путь»).
  rationale: Смена лица присутствует в еврейском тексте и отражает движение пророческой речи между прямым обращением к женщине и рассказом о ней; сглаживание этой смены устранило бы подлинную риторическую особенность.
- issue: Неоднозначный однокоренной оборот וְגָדַרְתִּי אֶת־גְּדֵרָהּ
  choice: «обнесу её стеной»
  alternative: 'Более буквально: «огражу её оградой» или «возведу её стену».'
  rationale: Основной текст ясно передаёт создание Богом преграды вокруг женщины, а сноска сохраняет заметную в оригинале сжатость и неоднозначность оборота.
translation_notes:
  register: Современный литературный русский язык с достойной пророческой интонацией. «Вот» сохраняет эмфатическое предъявление действия без архаического «се»; настоящее «заграждаю» отражает причастную конструкцию и непосредственность объявленного действия. Метафоры пути, терновника и стены сохранены.
