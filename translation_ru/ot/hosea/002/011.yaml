  text: לָ/כֵ֣ן אָשׁ֔וּב וְ/לָקַחְתִּ֤י דְגָנִ/י֙ בְּ/עִתּ֔/וֹ וְ/תִירוֹשִׁ֖/י בְּ/מֽוֹעֲד֑/וֹ וְ/הִצַּלְתִּי֙ צַמְרִ֣/י וּ/פִשְׁתִּ֔/י לְ/כַסּ֖וֹת אֶת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/011.yaml
  text: Therefore I will return and take back my grain in its time[a], and my new wine in its season; and I will take away my wool and my flax[b], which were to cover her nakedness.
translation:
  language: ru
  text: Поэтому Я вернусь и заберу Моё зерно в положенное для него время и Моё молодое вино — в положенный для него срок; отниму[a] Мою шерсть и Мой лён, предназначенные прикрывать её наготу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вырву» — еврейский глагол может подчёркивать резкое изъятие.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово означает «её наготу» и может также подразумевать позор обнажения.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт следствие из предшествующего обличения и ясно сохраняет ход пророческой речи.
- source_word: אָשׁוּב וְלָקַחְתִּי
  choice: Я снова заберу
  rationale: В данном сочетании שוב естественно передаёт возобновление или обращение действия, а «заберу» выражает возвращение владельцем ранее предоставленного имущества, не добавляя нового утверждения.
- source_word: דְגָנִי
  choice: Моё зерно
  rationale: דגן обозначает зерновые продукты в целом; «зерно» — современное и достаточно широкое соответствие.
- source_word: בְּעִתּוֹ
  choice: в своё время
  rationale: Сохраняет временное значение и местоименный суффикс, относящийся к зерну.
- source_word: וְתִירוֹשִׁי
  choice: Моё молодое вино
  rationale: תירוש обозначает новое или свежее вино как сельскохозяйственный продукт; «молодое вино» естественно передаёт этот оттенок по-русски.
- source_word: בְּמוֹעֲדוֹ
  choice: в свой срок
  rationale: Передаёт назначенное или надлежащее время и сохраняет параллелизм с «в своё время» без механического повтора.
- source_word: וְהִצַּלְתִּי
  choice: отниму
  rationale: В породе hифиль глагол נצל здесь означает изъятие или вырывание из владения; «отниму» естественно соответствует контексту суда, а более резкий оттенок отмечен в сноске.
- source_word: צַמְרִי וּפִשְׁתִּי
  choice: Мою шерсть и Мой лён
  rationale: Сохранены названия исходных материалов и подчёркнутые в еврейском тексте притяжательные формы.
- source_word: לְכַסּוֹת
  choice: предназначенные прикрывать
  rationale: Передаёт значение цели инфинитива и ясно связывает действие с шерстью и льном.
- source_word: עֶרְוָתָהּ
  choice: её наготу
  rationale: Сохраняет конкретный образ обнажённости и не сводит его подразумеваемый оттенок позора к одному абстрактному значению.
theological_decisions:
- issue: Следует ли явно передать, что Господь возвращает Себе ранее предоставленные дары
  choice: Передать לקח словом «заберу» в сочетании «снова заберу»
  alternative: 'Перевести нейтрально: «возьму»'
  rationale: Контекст говорит об изъятии зерна, вина, шерсти и льна, которые принадлежат Господу. «Заберу» выражает обращение прежнего дарования, не вводя дополнительной конфессиональной интерпретации.
- issue: Следует ли смягчить образ עֶרְוָתָהּ
  choice: Сохранить в основном тексте «её наготу»
  alternative: Перевести как «её позор» или «её стыд»
  rationale: Конкретный образ намеренно соединяет обнажение со стыдом. Его сохранение удерживает риторическое напряжение пророческой метафоры.
- issue: Как понимать אָשׁוּב перед וְלָקַחְתִּי
  choice: Передать наречным значением «снова заберу»
  alternative: 'Передать двумя глаголами: «вернусь и заберу»'
  rationale: В сочетании שוב с последующим личным глаголом значение повторного или обращённого действия естественно в контексте; буквальное «вернусь» по-русски могло бы ошибочно подчеркнуть пространственное возвращение.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавные формы «Я», «Моё», «Мой» обозначают говорящего Господа. Сельскохозяйственные термины переданы понятно, но без устранения конкретной образности оригинала.
