base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/003.yaml
  text: Say to your brothers[a], “My people,” and to your sisters[b], “Shown mercy.”
translation:
  language: ru
  text: 'Скажите вашим братьям[a]: «Мой народ», и вашим сёстрам[b]: «Помилованная».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: По-еврейски Амми — символическое имя, означающее «Мой народ».
    reason: lexical_alternative
  - marker: b
    text: По-еврейски Рухама — символическое имя, означающее «Помилованная» или «Та, которой явлено сострадание».
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרוּ
  choice: Скажите
  rationale: Повелительная форма множественного числа от אמר; «скажите» естественно и точно передаёт прямое речевое побуждение.
- source_word: לַאֲחֵיכֶם
  choice: вашим братьям
  rationale: Буквально «вашим братьям»; параллельное упоминание сестёр подтверждает, что обозначение мужского рода здесь следует сохранить.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Форма означает «мой народ» и одновременно отсылает к символическому имени Амми. Перевод значения в основном тексте сохраняет смысл пророческого знака.
- source_word: וְלַאֲחוֹתֵיכֶם
  choice: а вашим сёстрам
  rationale: Буквально «и вашим сёстрам». Русское «а» естественно оформляет параллельное сопоставление двух обращений, не меняя их смысловой связи.
- source_word: רֻחָמָה
  choice: Помилованная
  rationale: 'Женская форма с пассивным значением от רחם: та, которой оказана милость или явлено сострадание. «Помилованная» кратко сохраняет форму именования и согласуется с обращением к сёстрам.'
theological_decisions:
- issue: Передавать ли символические имена транслитерацией или их значением
  choice: В основном тексте перевести значения («Мой народ», «Помилованная»), а формы имён привести в сносках
  alternative: Оставить в основном тексте «Амми» и «Рухама»
  rationale: В книге Осии смысл этих имён составляет часть пророческого знака и выражает отмену прежнего приговора. Семантический перевод делает этот смысл явным, а сноски сохраняют связь с именами.
- issue: Передача пассивного значения רֻחָמָה
  choice: «Помилованная»
  alternative: «Та, которой явлено сострадание»
  rationale: 'Краткая именная форма сохраняет параллелизм с «Мой народ» и не устраняет богословски значимую пассивность: милость была оказана ей, а не возникла у неё самой.'
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная. Сохранены явные мужская и женская группы, параллелизм обращений и смысловая функция символических имён.
