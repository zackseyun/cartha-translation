  variant: modern literary Russian
source:
  edition: WLC
  text: וְֽ֠/הָיָה מִסְפַּ֤ר בְּנֵֽי יִשְׂרָאֵל֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹֽא יִמַּ֖ד וְ/לֹ֣א יִסָּפֵ֑ר וְֽ֠/הָיָה בִּ/מְק֞וֹם אֲשֶׁר יֵאָמֵ֤ר לָ/הֶם֙ לֹֽא עַמִּ֣/י אַתֶּ֔ם יֵאָמֵ֥ר לָ/הֶ֖ם בְּנֵ֥י אֵֽל חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/001.yaml
  text: Yet the number of the sons of Israel will be like the sand of the sea[a], which cannot be measured or counted; and in the place where it is said to them, “You are not my people,” it will be said to them, “Sons of the living God.”
translation:
  language: ru
  text: 'Но число сынов Израиля будет как песок морской[a], который нельзя ни измерить, ни сосчитать. И там, где им скажут: «Вы не Мой народ», им скажут: «Сыны живого Бога».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дети Израиля» и «дети живого Бога». В обоих выражениях еврейский текст буквально говорит о «сынах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Но ... будет
  rationale: Начальный союз вводит резкий переход от суда к восстановлению; «но» естественно передаёт противительный оттенок, а «будет» — будущее значение формы.
- source_word: מִסְפַּר
  choice: число
  rationale: Прямое значение существительного сохраняет связь с последующими словами о невозможности измерить и сосчитать.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: «Сыны» сохраняет мужскую форму בני и внутреннюю параллель с выражением «сыны живого Бога».
- source_word: כְּחוֹל הַיָּם
  choice: как песок морской
  rationale: Естественное русское библейское выражение, передающее образ неисчислимого множества и перекличку с обетованиями.
- source_word: אֲשֶׁר לֹא יִמַּד וְלֹא יִסָּפֵר
  choice: который нельзя ни измерить, ни сосчитать
  rationale: Передаёт практическую невозможность и сохраняет различие между двумя еврейскими глаголами.
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: там, где
  rationale: Идиоматично передаёт конкретное указание на место без тяжеловесного русского оборота «в том месте, где».
- source_word: יֵאָמֵר ... יֵאָמֵר
  choice: говорили ... скажут
  rationale: Безличные формы сохраняют неопределённость говорящего. Прошедшее «говорили» естественно обозначает прежнее осуждение относительно будущего восстановления, хотя еврейская форма допускает более буквальное «будет сказано».
- source_word: לֹא עַמִּי אַתֶּם
  choice: Вы не Мой народ
  rationale: Естественно воспроизводит формулу разрыва заветных отношений; עם здесь означает «народ».
- source_word: בְּנֵי אֵל חָי
  choice: Сыны живого Бога
  rationale: «Сыны» сохраняет בני и параллелизм первой половины стиха; «живой Бог» — естественное соответствие אֵל חָי.
theological_decisions:
- issue: Родовое обозначение в формуле восстановления завета
  choice: Сохранить «сыны» в обоих выражениях
  alternative: «Дети Израиля» и «дети живого Бога»
  rationale: В обоих местах еврейский текст употребляет мужское множественное בני. Одинаковый перевод сохраняет гендерную форму и литературный параллелизм, а сноска сообщает возможное более широкое понимание.
- issue: Смысл начального וְ
  choice: Передать противительным союзом «Но»
  alternative: «И» или «И будет»
  rationale: Контекст указывает на резкий поворот от суда («не Мой народ») к обещанию восстановления; «но» выражает этот дискурсивный контраст, не добавляя отдельного богословского утверждения.
- issue: Временная перспектива יֵאָמֵר в первой формуле
  choice: «где им говорили»
  alternative: «где им будет сказано» или «где им говорят»
  rationale: Русское прошедшее ясно противопоставляет прежний приговор будущему восстановлению. При этом сама еврейская форма формально одинакова в обеих частях и допускает более буквальное симметричное прочтение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формы «сыны» и «песок морской» выбраны ради внутристихового параллелизма и узнаваемой образности; остальной синтаксис сделан ясным и естественным.
