source:
  edition: WLC
  text: וְ֠/נִקְבְּצוּ בְּנֵֽי יְהוּדָ֤ה וּ/בְנֵֽי יִשְׂרָאֵל֙ יַחְדָּ֔ו וְ/שָׂמ֥וּ לָ/הֶ֛ם רֹ֥אשׁ אֶחָ֖ד וְ/עָל֣וּ מִן הָ/אָ֑רֶץ כִּ֥י גָד֖וֹל י֥וֹם יִזְרְעֶֽאל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/002/002.yaml
  text: Then the sons of Judah and the sons of Israel will be gathered together[a], and they will appoint for themselves one head, and they will go up from the land[c][b], for great will be the day of Jezreel.
translation:
  language: ru
  text: И соберутся вместе сыны Иуды и сыны Израиля, и поставят себе одного главу[a], и поднимутся из земли[b], ибо велик будет день Изрееля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поставят над собой одного вождя». Буквально еврейский текст говорит: «одну голову».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «из земли» может указывать на выход из изгнания или на восстановительное восхождение в землю; точный оттенок еврейского выражения остаётся открытым.
    reason: alternative_reading
  - marker: c
    text: Изреель — название места и значимое имя в книге Осии; оно созвучно темам рассеяния и сеяния, а само имя может означать «Бог сеет».
    reason: cultural_note
lexical_decisions:
- source_word: וְנִקְבְּצוּ
  choice: соберутся
  rationale: Нифаль глагола קבץ допускает значение собирания воедино; русское возвратное «соберутся» естественно передаёт совместное объединение, не навязывая внешнего деятеля.
- source_word: בְּנֵי יְהוּדָה וּבְנֵי יִשְׂרָאֵל
  choice: сыны Иуды и сыны Израиля
  rationale: Сохранён буквальный образ «сынов» и параллелизм двух групп; «сыны» соответствует достоинству пророческой речи и остаётся понятным современному читателю.
- source_word: יַחְדָּו
  choice: вместе
  rationale: Прямо и естественно выражает совместность и подчёркивает восстановленное единство.
- source_word: וְשָׂמוּ לָהֶם רֹאשׁ אֶחָד
  choice: поставят себе одного главу
  rationale: «Поставят себе» передаёт שׂים с לָהֶם, а «глава» сохраняет метафору רֹאשׁ и не уточняет характер власти сверх сказанного в тексте.
- source_word: וְעָלוּ מִן הָאָרֶץ
  choice: поднимутся из земли
  rationale: Сохранены пространственный образ עלה и неоднозначное אֶרֶץ; более конкретное указание на изгнание, исход или возвращение не внесено в основной текст.
- source_word: כִּי גָדוֹל יוֹם יִזְרְעֶאל
  choice: ибо велик будет день Изрееля
  rationale: «Ибо» передаёт причинно-пояснительное כִּי, а вынесенное вперёд «велик» сохраняет эмфатический пророческий строй. Имя יִזְרְעֶאל передано традиционной русской транслитерацией.
theological_decisions:
- issue: Кого обозначает «один глава»
  choice: Сохранить метафору «одного главы» без определения его личности.
  alternative: Один царь, политический вождь или прямо названный мессианский правитель.
  rationale: Стих говорит о едином руководстве объединённых Иуды и Израиля, но здесь не называет этого человека и не определяет точный характер его власти.
- issue: Смысл выражения «поднимутся из земли»
  choice: Сохранить пространственную формулировку и пояснить её неоднозначность в сноске.
  alternative: Однозначно истолковать как выход из изгнания, новый исход, военный поход или восхождение в землю обетованную.
  rationale: Еврейское выражение допускает несколько контекстуальных оттенков; конкретизация в основном тексте преждевременно сняла бы смысловое напряжение.
- issue: Значение дня Изрееля
  choice: Оставить имя собственное в тексте и отметить его смысловую нагруженность в сноске.
  alternative: Перевести имя как «Бог сеет» непосредственно в основном тексте.
  rationale: Изреель является именем и названием места, однако в книге Осии оно также участвует в игре смыслов, связанной с сеянием и рассеянием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным пророческим звучанием. Формы «сыны», «глава» и «ибо» сохраняют библейское достоинство без архаизации синтаксиса. Неоднозначные образы «одного главы» и восхождения «из земли» намеренно не конкретизированы.
