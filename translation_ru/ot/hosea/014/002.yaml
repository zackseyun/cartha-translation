base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/002.yaml
  text: Return[a], O Israel, to Yahweh your God, for you have stumbled in your iniquity.
translation:
  language: ru
  text: Вернись, Израиль, к Яхве, твоему Богу, ибо ты споткнулся в своём беззаконии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за своего беззакония». Еврейский предлог может указывать как на причину преткновения, так и на среду, в которой оно происходит.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוּבָה
  choice: Вернись
  rationale: Повелительная форма глагола שוב передаёт направленное возвращение к Богу. «Вернись» сохраняет исходный образ и не сужает его до истолковывающего «покайся».
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятая русская форма имени; обращение к народу сохраняет грамматическое единственное число оригинала.
- source_word: עַד
  choice: к
  rationale: При глаголе возвращения предлог обозначает цель движения; русское «к» естественно передаёт это значение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, выраженное тетраграмматоном.
- source_word: אֱלֹהֶיךָ
  choice: твоему Богу
  rationale: Сохраняет форму второго лица мужского рода единственного числа и заветное отношение, выраженное притяжательным суффиксом.
- source_word: כִּי
  choice: ведь
  rationale: Вводит основание для призыва вернуться и звучит естественно в современном русском увещевании.
- source_word: כָשַׁלְתָּ
  choice: ты споткнулся
  rationale: Сохраняет метафору преткновения или утраты устойчивости, не усиливая её до окончательного падения.
- source_word: בַּעֲוֺנֶךָ
  choice: в своём беззаконии
  rationale: Близко передаёт еврейский предлог ב и сохраняет возможность понимать беззаконие как сферу преткновения; причинное понимание вынесено в сноску.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В оригинале прямо употреблено личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Значение שוב в пророческом призыве
  choice: Вернись
  alternative: Покайся; обратись
  rationale: Возвращение подразумевает покаяние, но исходный глагол сохраняет более широкий образ движения обратно к Богу.
- issue: Связь беззакония с преткновением
  choice: в своём беззаконии
  alternative: из-за своего беззакония
  rationale: Предлог ב допускает как значение сферы, так и причинное значение. Основной текст сохраняет более формально близкую конструкцию, а причинное прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обращения. Единственное число «вернись», «ты споткнулся» сохраняет персонификацию Израиля в еврейском тексте; местоимение «твоему» оставлено ради заветной направленности обращения.
