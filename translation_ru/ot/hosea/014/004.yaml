source:
  edition: WLC
  text: אַשּׁ֣וּר לֹ֣א יוֹשִׁיעֵ֗/נוּ עַל סוּס֙ לֹ֣א נִרְכָּ֔ב וְ/לֹא נֹ֥אמַר ע֛וֹד אֱלֹהֵ֖י/נוּ לְ/מַעֲשֵׂ֣ה יָדֵ֑י/נוּ אֲשֶׁר בְּ/ךָ֖ יְרֻחַ֥ם יָתֽוֹם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/004.yaml
  text: Assyria will not save us[a]; we will not ride on horses, and we will no longer say, ‘Our God,’ to the work of our hands[b]. In you the fatherless finds mercy.
translation:
  language: ru
  text: 'Ассирия не спасёт нас; мы не сядем на коней и больше не скажем делу наших рук: «Бог наш!» У Тебя сирота[a] обретает милость[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишённый отца». Еврейское слово буквально обозначает человека без отца и нередко шире указывает на беззащитного.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительную фразу можно понять как указание на причину: «Ведь у Тебя сирота обретает милость».'
    reason: alternative_reading
lexical_decisions:
- source_word: אַשּׁוּר
  choice: Ассирия
  rationale: Общепринятое русское название державы; в контексте речь идёт об отказе полагаться на чужую военную силу.
- source_word: יוֹשִׁיעֵנוּ
  choice: не спасёт нас
  rationale: Hифиль глагола ישׁע означает «спасать, избавлять»; «спасёт» естественно звучит по-русски и сохраняет богословский оттенок ложной надежды на политическую силу.
- source_word: עַל סוּס לֹא נִרְכָּב
  choice: мы не сядем на коней
  rationale: Выражение обозначает отказ от опоры на конницу и военную мощь; множественное число естественно передаёт собирательный смысл.
- source_word: וְלֹא נֹאמַר עוֹד
  choice: и больше не скажем
  rationale: עוֹד с отрицанием указывает на прекращение действия отныне; «больше не» — ясное современное соответствие.
- source_word: אֱלֹהֵינוּ
  choice: «Бог наш!»
  rationale: В обращении к рукотворному предмету форма передаёт присвоение ему божественного статуса. Сохранена формула прямого обращения без добавления толкования «идол».
- source_word: לְמַעֲשֵׂה יָדֵינוּ
  choice: делу наших рук
  rationale: Близко передаёт еврейское выражение о созданном людьми предмете и сохраняет образ рукотворного божества.
- source_word: אֲשֶׁר בְּךָ
  choice: У Тебя
  rationale: Предлог ב здесь естественно передаётся по-русски как указание на того, у кого находят милость. Относительная частица допускает пояснительный или причинный оттенок, не выраженный явно в основном тексте.
- source_word: יְרֻחַם
  choice: обретает милость
  rationale: Пуаль глагола רחם обозначает того, кому оказывают сострадание. Формулировка естественна по-русски и сохраняет направленность милости на беспомощного.
- source_word: יָתוֹם
  choice: сирота
  rationale: Стандартное русское соответствие слову, буквально обозначающему лишённого отца и шире — человека без обычной семейной защиты.
theological_decisions:
- issue: Следует ли явно обозначить причинный смысл заключительной фразы
  choice: 'Заключительная фраза дана отдельным предложением: «У Тебя сирота обретает милость».'
  alternative: «Ведь у Тебя сирота обретает милость» или «Потому что у Тебя сирота обретает милость».
  rationale: Еврейская конструкция с אֲשֶׁר может пояснять основание исповедания, однако связь не маркирована однозначно. Основной текст сохраняет эту открытость.
- issue: Относится ли «сирота» только к буквальному сироте или также образно к кающемуся Израилю
  choice: Сохранён конкретный образ «сирота» без поясняющего расширения.
  alternative: «мы, оставшиеся сиротами» или иное прямое отнесение к Израилю.
  rationale: Текст позволяет услышать как буквальное утверждение о беззащитном человеке, так и образ беспомощности Израиля; перевод не сужает эту богословскую многозначность.
- issue: Называется ли рукотворное изделие одним богом или богами
  choice: 'Передано прямым обращением в единственном числе: «Бог наш!»'
  alternative: «боги наши».
  rationale: Хотя אֱלֹהִים формально имеет форму множественного числа, сочетание здесь может функционировать как титул божества. Единственное число естественно согласуется с собирательным «делом наших рук», при этом контекст идолопоклонства остаётся ясным.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью и достоинством пророческого исповедания. Местоимение «Тебя» написано с прописной буквы как обращение к Богу; синтаксис остаётся ясным для широкого читателя.
