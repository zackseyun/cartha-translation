  rationale: Исправлены две стилистически и семантически менее удачные формулировки, при этом сохранены синтаксическая сжатость, образность и спорная смена говорящего. Сноска a продолжает явно отмечать допустимое прочтение начальной реплики как исповедания Ефрема; никакая конфессиональная интерпретация не навязывается.
