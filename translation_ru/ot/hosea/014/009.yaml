  text: אֶפְרַ֕יִם מַה לִּ֥/י ע֖וֹד לָֽ/עֲצַבִּ֑ים אֲנִ֧י עָנִ֣יתִי וַ/אֲשׁוּרֶ֗/נּוּ אֲנִי֙ כִּ/בְר֣וֹשׁ רַֽעֲנָ֔ן מִמֶּ֖/נִּי פֶּרְיְ/ךָ֥ נִמְצָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/009.yaml
  text: Ephraim—what have I to do anymore with idols? I have answered him and will look after him[a]. I am like a flourishing cypress[c][b]; from me your fruit is found.
translation:
  language: ru
  text: Ефрем, что Мне ещё до идолов?[a] Я ответил ему и буду заботиться о нём.[b] Я — словно пышный кипарис; твой плод — от Меня.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Ефрем говорит: „Что мне ещё до идолов?“» Еврейский текст допускает понимание этих слов как исповедания Ефрема перед ответом Господа.'
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «буду смотреть на него» или «буду присматривать за ним».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «От Меня приходит твой плод».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה לִּי עוֹד לָעֲצַבִּים
  choice: что Мне ещё до идолов?
  rationale: 'Еврейская идиома מַה לִּי выражает отстранение: «что мне до…?», а עוֹד добавляет значение «ещё, впредь». Формулировка естественна для современного русского языка и сохраняет краткость оригинала.'
- source_word: עָנִיתִי
  choice: Я ответил
  rationale: Форма от ענה здесь означает «ответить, откликнуться». Прошедшее время непосредственно передаёт перфект, не превращая его в отвлечённое настоящее.
- source_word: וַאֲשׁוּרֶנּוּ
  choice: и буду заботиться о нём
  rationale: Редкий глагол передаёт внимательное наблюдение или попечение. «Буду заботиться» естественно выражает благожелательное внимание в данном контексте; более буквальное «буду смотреть на него» отмечено в сноске.
- source_word: כִּבְרוֹשׁ רַעֲנָן
  choice: словно зеленеющий кипарис
  rationale: בְּרוֹשׁ традиционно обозначают как кипарис, хотя точный вид дерева неясен; רַעֲנָן выражает свежую зелень и жизненную силу. «Зеленеющий» сохраняет образ живого, пышного дерева.
- source_word: מִמֶּנִּי פֶּרְיְךָ נִמְצָא
  choice: от Меня обретается твой плод
  rationale: «От Меня» сохраняет указание на источник, а «обретается» формально отражает нифаль глагола מצא («быть найденным, обретаться»), не устраняя богословский акцент на Боге как источнике плода.
- source_word: אֶפְרַיִם
  choice: Ефрем
  rationale: Традиционная русская форма имени; здесь Ефрем олицетворяет северное царство и народ.
- source_word: עֲצַבִּים
  choice: идолы
  rationale: В пророческом контексте слово обозначает идолов или культовые изображения; «идолы» — ясный и точный современный эквивалент.
theological_decisions:
- issue: Кто произносит начальные слова стиха
  choice: Начальная фраза включена в речь Господа как обращение к Ефрему
  alternative: 'Ефрем исповедует: «Что мне ещё до идолов?» — после чего следует ответ Господа'
  rationale: В еврейском тексте нет явного указателя смены говорящего. Последующие формы первого лица и слова «от Меня» благоприятствуют продолжению речи Господа, но синтаксис допускает исповедание Ефрема; эта неоднозначность сохранена в сноске.
- issue: Характер Божьего отношения, выраженного וַאֲשׁוּרֶנּוּ
  choice: буду заботиться о нём
  alternative: буду смотреть на него / буду внимать ему
  rationale: Контекст восстановления допускает оттенок заботливого внимания, однако сам глагол прежде всего связан со взглядом и наблюдением. Лексическая широта сохранена в сноске, без превращения выбранного варианта в отдельное доктринальное утверждение.
- issue: Бог как источник плода Ефрема
  choice: от Меня обретается твой плод
  alternative: от Меня приходит твой плод
  rationale: Формулировка сохраняет как грамматическую пассивность «обретается», так и прямое указание на Бога как источник, не уточняя сверх текста механизм плодоношения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской издательской традиции. Краткий образный строй и неоднозначность смены говорящего сохранены.
