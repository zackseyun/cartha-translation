source:
  edition: WLC
  text: תֶּאְשַׁם֙ שֹֽׁמְר֔וֹן כִּ֥י מָרְתָ֖ה בֵּֽ/אלֹהֶ֑י/הָ בַּ/חֶ֣רֶב יִפֹּ֔לוּ עֹלְלֵי/הֶ֣ם יְרֻטָּ֔שׁוּ וְ/הָרִיּוֹתָ֖י/ו יְבֻקָּֽעוּ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/001.yaml
  text: Samaria shall bear her guilt[a], because she has rebelled against her God. They shall fall by the sword; their little children shall be dashed to pieces[b], and their pregnant women ripped open.
translation:
  language: ru
  text: Самария понесёт свою вину[a], потому что восстала против своего Бога. Её жители падут от меча; их маленьких детей разобьют[b], а беременным женщинам вспорют животы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет признана виновной»; или: «поплатится за свою вину».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их младенцев разобьют».'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּאְשַׁם
  choice: понесёт свою вину
  rationale: Глагол אשם может выражать как виновность, так и ответственность и последствия вины. Эта формулировка сохраняет оба оттенка в контексте объявленного суда.
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Общепринятое русское название города и области; в тексте Самария олицетворена как женский образ.
- source_word: מָרְתָה
  choice: восстала
  rationale: מרה обозначает непокорность и мятеж против власти; здесь речь о сознательном восстании против Бога.
- source_word: בֵּאלֹהֶיהָ
  choice: против своего Бога
  rationale: Предлог при מרה указывает на того, против кого направлено восстание; суффикс женского рода соотнесён с Самарией.
- source_word: בַּחֶרֶב יִפֹּלוּ
  choice: падут от меча
  rationale: Сохранена древнееврейская военная идиома, означающая гибель от оружия.
- source_word: עֹלְלֵיהֶם
  choice: их малые дети
  rationale: עולל обозначает совсем маленьких детей, но не обязательно только новорождённых; «малые дети» сохраняет этот диапазон.
- source_word: יְרֻטָּשׁוּ
  choice: будут разбиты о землю
  rationale: Глагол описывает насильственное разбивание. Добавление «о землю» естественно передаёт подразумеваемое действие по-русски, не смягчая жестокости образа.
- source_word: וְהָרִיּוֹתָיו
  choice: а беременным женщинам
  rationale: Несмотря на формально единственное число притяжательного суффикса, контекст указывает на беременных женщин среди населения Самарии.
- source_word: יְבֻקָּעוּ
  choice: распорют животы
  rationale: Пассив בקע означает рассечение или вспарывание; в отношении беременных женщин выражение передаёт конкретный ужас военного насилия без эвфемизма.
theological_decisions:
- issue: Олицетворение Самарии и переход к её населению
  choice: В первом предложении Самария представлена как женщина, а далее «её жители» прямо обозначают людей, подвергающихся суду.
  alternative: Сохранять грамматически единственное число во всём стихе или устранить олицетворение.
  rationale: Еврейский текст сочетает олицетворённую Самарию женского рода с множественным числом жертв. Явное «её жители» делает переход понятным и сохраняет литературный образ.
- issue: Предельно жестокие образы суда
  choice: Передать насилие прямо, без смягчения.
  alternative: Использовать эвфемизмы или обобщённое описание гибели.
  rationale: Жестокость формулировок существенна для пророческого предостережения; её смягчение исказило бы тон и содержание исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя; жестокие детали оригинала сохранены без архаизации и эвфемизмов.
