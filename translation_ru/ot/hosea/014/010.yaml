base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/010.yaml
  text: Who is wise? Let him understand these things[a]. Who is discerning? Let him know them. For the ways of Yahweh are straight, and the righteous walk in them[b], but transgressors stumble in them.
translation:
  language: ru
  text: 'Кто мудр? Пусть поймёт всё это. Кто проницателен? Пусть познает это. Ведь пути Яхве прямы[a]: праведные идут по ним, а нарушители[b] на них спотыкаются.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правы» или «верны».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «мятежники».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי חָכָם
  choice: Кто мудр?
  rationale: Сохранён риторический вопрос оригинала; прилагательное חָכָם передано кратко и естественно.
- source_word: וְיָבֵן אֵלֶּה
  choice: Пусть поймёт всё это
  rationale: Имперфект в контексте заключительного мудростного призыва передан побуждением. «Всё это» естественно указывает на содержание книги или пророчества в целом.
- source_word: נָבוֹן
  choice: проницателен
  rationale: Передаёт способность к глубокому различению и не повторяет однокоренно глагол «понять».
- source_word: וְיֵדָעֵם
  choice: Пусть познает это
  rationale: ידע передан широким по значению глаголом «познать». Местоименный суффикс относится к ранее упомянутому содержанию; в русском собирательное «это» звучит естественнее буквального множественного местоимения.
- source_word: יְשָׁרִים דַּרְכֵי יְהוָה
  choice: пути Яхве прямы
  rationale: «Прямы» сохраняет одновременно нравственный смысл и сквозной образ пути, по которому идут или на котором спотыкаются.
- source_word: וְצַדִּקִים יֵלְכוּ בָם
  choice: праведные идут по ним
  rationale: Субстантивированное צַדִּיק передано традиционным и понятным словом «праведные», а образ хождения по путям сохранён.
- source_word: וּפֹשְׁעִים יִכָּשְׁלוּ בָם
  choice: а нарушители на них спотыкаются
  rationale: פֹשְׁעִים обозначает тех, кто преступает установленную верность и восстаёт; «нарушители» не сужает значение до политического мятежа. Повтор «на них» сохраняет параллелизм общего объекта — путей Яхве.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя Бога, а не титул; транслитерация «Яхве» сохраняет это различие без замены имени титулом.
- issue: Характер путей Яхве
  choice: прямы
  alternative: правы; справедливы
  rationale: Выбор сохраняет намеренное соединение нравственной оценки с метафорой пути, хождения и преткновения.
- issue: Смысл פֹשְׁעִים
  choice: нарушители
  alternative: мятежники; преступники
  rationale: Еврейское слово может подчёркивать как преступление границы, так и мятеж. Основной вариант оставляет значение достаточно широким, а альтернативный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным звучанием мудростного заключения. Сохранены риторические вопросы, побудительные формы и единый образ путей, хождения и преткновения; синтаксис сделан естественным для современного читателя.
