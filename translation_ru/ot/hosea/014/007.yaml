    reason: lexical_alternative
lexical_decisions:
- source_word: יֵלְכוּ
  choice: раскинутся
  rationale: Буквально глагол означает «пойдут», но при подлежащем «побеги» описывает их распространение в стороны. «Раскинутся» естественно передаёт образ разрастающегося растения.
- source_word: יֹנְקוֹתָיו
  choice: его побеги
  rationale: Существительное обозначает молодые побеги или отростки, получающие питание от растения. «Побеги» — ясный и уместный ботанический термин.
- source_word: וִיהִי
  choice: будет
  rationale: Форма продолжает пророческое описание будущего восстановления; будущее время естественно передаёт последовательность образов.
- source_word: כַזַּיִת
  choice: подобно оливе
  rationale: Сравнение сохранено прямо. «Олива» — современное литературное название оливкового дерева, подходящее возвышенной поэзии.
- source_word: הוֹדוֹ
  choice: его великолепие
  rationale: Слово может означать великолепие, величие или красоту. «Великолепие» сохраняет возвышенный тон и зрительный характер сравнения, не придавая ему излишне специального богословского оттенка.
- source_word: וְרֵיחַ לוֹ
  choice: а его благоухание
  rationale: 'Буквально: «и запах у него». В положительном поэтическом контексте «благоухание» передаёт приятный аромат и естественно выражает принадлежность.'
- source_word: כַלְּבָנוֹן
  choice: Ливану
  rationale: Ливан вызывает образ знаменитого аромата лесов и растительности. В русском сравнительная конструкция «подобно» подразумевается из предыдущей части и передаётся именной формой с тире.
theological_decisions:
- issue: Референт местоименных суффиксов третьего лица единственного числа
  choice: Передать мужским местоимением «его», относя его к восстановленному Израилю/Ефрему в развёрнутом растительном образе.
  alternative: Передать нейтрально через повтор названия народа либо перестроить фразу без местоимения.
  rationale: В еврейском суффиксы имеют форму мужского рода единственного числа и относятся к изображённому как растение восстановленному народу. Русское «его» сохраняет грамматическую форму и не заставляет видеть здесь отдельного мужчину благодаря ясному контексту метафоры.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим звучанием. Синтаксис сохраняет параллелизм еврейского стиха; «благоухание» выбрано как положительное и образное обозначение аромата.
