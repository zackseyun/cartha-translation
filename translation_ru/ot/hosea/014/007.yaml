  text: Its shoots will spread out[a], and its splendor will be like the olive tree[b], and its fragrance like Lebanon.
translation:
  language: ru
  text: Его побеги раскинутся[a], его великолепие будет подобно оливе[b], а его благоухание будет как у Ливана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его ветви протянутся»; буквально: «его побеги пойдут». Здесь глагол «идти» означает распространение побегов в стороны.'
    reason: lexical_alternative
  - marker: b
