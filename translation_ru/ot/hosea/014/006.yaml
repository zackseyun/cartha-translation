source:
  edition: WLC
  text: אֶהְיֶ֤ה כַ/טַּל֙ לְ/יִשְׂרָאֵ֔ל יִפְרַ֖ח כַּ/שּֽׁוֹשַׁנָּ֑ה וְ/יַ֥ךְ שָׁרָשָׁ֖י/ו כַּ/לְּבָנֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/006.yaml
  text: I will be like the dew to Israel[a]; he will blossom like the lily[b], and he will strike his roots like Lebanon.
translation:
  language: ru
  text: Я буду для Израиля как роса[a]; он расцветёт, как лилия, и пустит свои корни, как Ливан[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте Израиль представлен как единое лицо; поэтому далее сказано: «он расцветёт… пустит свои корни».'
    reason: lexical_alternative
  - marker: b
    text: Ливан вызывает образ прочности и величия — вероятно, благодаря своим знаменитым глубоко укоренённым деревьям; однако в еврейском тексте кедры прямо не названы.
    reason: cultural_note
lexical_decisions:
- source_word: אֶהְיֶה
  choice: Я буду
  rationale: Имперфект qal, 1-е лицо ед. числа от היה в контексте обещания естественно передаёт будущее время.
- source_word: כַטַּל
  choice: как роса
  rationale: Предлог כ выражает сравнение; образ росы сохраняет смысл живительной влаги.
- source_word: לְיִשְׂרָאֵל
  choice: для Израиля
  rationale: Предлог ל здесь обозначает направленность благодеяния; по-русски «для Израиля» естественно передаёт этот смысл.
- source_word: יִפְרַח
  choice: он расцветёт
  rationale: Форма 3-го лица мужского рода ед. числа относится к Израилю как к собирательному единству; «расцветёт» поддерживает следующий цветочный образ.
- source_word: כַשּׁוֹשַׁנָּה
  choice: как лилия
  rationale: שׁוֹשַׁנָּה традиционно обозначает лилию либо близкий к ней цветок; в русском родовое сравнение естественно употребляется без определённого артикля.
- source_word: וְיַךְ שָׁרָשָׁיו
  choice: и пустит свои корни
  rationale: Каузативная форма נכה в сочетании с «корнями» означает дать корням пойти или прочно закрепиться. Русское «пустит свои корни» естественно передаёт действие и сохраняет местоименный суффикс 3-го лица ед. числа.
- source_word: כַלְּבָנוֹן
  choice: как Ливан
  rationale: Еврейский текст называет сам Ливан и не уточняет «кедры»; прямое сравнение сохраняет ёмкость исходного образа.
theological_decisions:
- issue: Единственное число и референт глаголов при Израиле
  choice: 'Израиль представлен как единое лицо мужского рода: «он расцветёт… пустит свои корни».'
  alternative: 'Передать собирательный смысл множественным числом: «они расцветут… пустят свои корни».'
  rationale: Еврейские глаголы и местоименный суффикс имеют форму мужского рода единственного числа. Русское имя «Израиль» также мужского рода, поэтому исходная персонификация сохраняется естественно.
- issue: Образ Ливана
  choice: Сохранить «как Ливан», не уточняя породу деревьев.
  alternative: 'Истолковать явно: «как ливанские кедры».'
  rationale: В исходном тексте упомянут Ливан, а не кедры. Хотя известные деревья Ливана помогают понять образ прочности и величия, вводить их в основной текст означало бы устранить его поэтическую недосказанность.
translation_notes:
  register: Современный литературный русский язык с поэтической, но понятной формулировкой. Параллелизм образов сохранён; «пустит свои корни» выбрано вместо буквального и неестественного по-русски «ударит своими корнями».
