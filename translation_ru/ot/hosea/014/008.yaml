base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/008.yaml
  text: Those who dwell in his shade will return[a]; they will revive like grain and blossom like the vine[b]; his renown will be like the wine of Lebanon.
translation:
  language: ru
  text: Вернутся те, кто живёт под его сенью; они оживут, как зерно[a], и расцветут, как виноградная лоза. Его слава[b] будет подобна вину Ливана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они оживят зерно», «они будут выращивать зерно» или «они оживут благодаря зерну». Еврейское выражение сжато: в нём нет явно выраженного слова «как», а форма глагола может пониматься как переходная. В контексте образов цветения и плодородия основной перевод передаёт смысл оживающего зерна.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «память о нём» или «упоминание о нём». Менее вероятно в данном контексте отнести суффикс к иному референту и перевести: «его (или её) слава».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֻׁבוּ
  choice: вернутся
  rationale: Обычное значение Qal от שוב — «возвращаться». Здесь слово выражает восстановление людей, находящих убежище под его сенью, и не требует уточнения направления возвращения.
- source_word: יֹשְׁבֵי בְצִלּוֹ
  choice: те, кто живёт в его тени
  rationale: Субстантивированное причастие передано как группа людей, а צֵל — словом «тень», сохраняющим образ защиты и благословения. Единственное число местоимения сохранено.
- source_word: יְחַיּוּ דָגָן
  choice: они оживут, как хлебные злаки
  rationale: Сжатое поэтическое выражение буквально допускает смысл «оживят хлебные злаки», но параллелизм с цветущей лозой подсказывает образ людей, вновь обретающих жизнь подобно всходящим злакам. Сравнительный оборот введён для естественного русского звучания, а неоднозначность отмечена в сноске.
- source_word: וְיִפְרְחוּ כַגָּפֶן
  choice: и расцветут, как виноградная лоза
  rationale: Глагол פרח означает «цвести, расцветать», а явный сравнительный оборот с лозой сохранён.
- source_word: זִכְרוֹ
  choice: слава о нём
  rationale: Слово זֵכֶר может обозначать память, упоминание или славу. Сравнение с ливанским вином лучше всего сочетается здесь со значением доброй славы, известности; местоименный суффикс мужского рода сохранён.
- source_word: כְּיֵין לְבָנוֹן
  choice: подобна ливанскому вину
  rationale: Передано прямое сравнение с вином Ливана; прилагательное «ливанскому» естественно для современного русского языка и сохраняет географическую ассоциацию.
theological_decisions:
- issue: К кому относятся суффиксы мужского рода единственного числа в выражениях «в его тени» и «слава о нём»
  choice: Сохранены местоимения мужского рода единственного числа без прямого определения референта.
  alternative: Назвать прямо Израиль, Ефрема или восстановленный народ.
  rationale: Еврейский текст оставляет референт в поэтическом контексте и персонифицирует народ. Уточнение в переводе устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с dignified поэтическим ритмом. Сельскохозяйственные образы и грамматически мужские местоимения сохранены; синтаксис слегка расправлен ради ясности, но лексическая неоднозначность вынесена в сноски.
