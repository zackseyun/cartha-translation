base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/005.yaml
  text: I will heal their apostasy; I will love them freely[a], for my anger has turned away from them.
translation:
  language: ru
  text: Я исцелю их отпадение и буду любить их по Своей доброй воле, ибо Мой гнев отступил от него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от него»; некоторые переводы согласуют местоимение с предшествующим множественным числом: «от них».'
    reason: Пояснение неожиданного перехода от множественного числа к единственному в еврейском тексте.
lexical_decisions:
- source_word: אֶרְפָּא
  choice: Я исцелю
  rationale: Глагол רפא в породе каль означает «исцелять». Перевод сохраняет образ духовного и нравственного исцеления.
- source_word: מְשׁוּבָתָם
  choice: их отступничество
  rationale: מְשׁוּבָה обозначает отпадение, отступление и неверность завету; «отступничество» ясно передаёт этот смысл в контексте Осии.
- source_word: אֹהֲבֵם
  choice: буду любить их
  rationale: Прямое значение אהב — «любить»; местоименный суффикс имеет форму третьего лица множественного числа.
- source_word: נְדָבָה
  choice: по доброй воле
  rationale: Слово выражает добровольность и свободную готовность; оборот передаёт незаслуженную и непринуждённую любовь, не добавляя идеи договорных условий.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание предшествующего обещания; «ведь» естественно связывает части фразы по-русски.
- source_word: שָׁב
  choice: отступил
  rationale: שׁוּב здесь описывает прекращение и удаление гнева. «Отступил» естественно передаёт движение прочь от объекта гнева.
- source_word: אַפִּי
  choice: Мой гнев
  rationale: אַף буквально означает «нос», но устойчиво употребляется в значении «гнев».
- source_word: מִמֶּנּוּ
  choice: от него
  rationale: Масоретская форма содержит суффикс третьего лица мужского рода единственного числа; переход от множественного числа к единственному сохранён.
theological_decisions:
- issue: Переход к единственному числу в последнем местоимении
  choice: 'Сохранить еврейское единственное число: «от него»'
  alternative: «от них»
  rationale: В еврейском тексте после форм множественного числа стоит מִמֶּנּוּ с суффиксом единственного числа. Сохранение этого перехода не устраняет возможное собирательное понимание Израиля и не сглаживает напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным звучанием. Синтаксис слегка уплотнён союзом «и», а непривычное единственное число сохранено и пояснено сноской.
