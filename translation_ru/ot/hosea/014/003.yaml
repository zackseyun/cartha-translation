base_translation:
  language: en
  yaml_path: translation/ot/hosea/014/003.yaml
  text: Take words with you and return to Yahweh[a]. Say to him, “Take away all iniquity and receive what is good[b], and we will repay with the fruit of our lips.”
translation:
  language: ru
  text: 'Возьмите с собой слова и вернитесь к Яхве. Скажите Ему: «Прости всю вину[a] и прими доброе[b], а мы воздадим Тебе быков наших уст[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «унеси (или понеси) всю вину»; это еврейская идиома прощения.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение краткое и неоднозначное; возможно также: «прими то, что хорошо» или «благосклонно прими».'
    reason: ambiguity
  - marker: c
    text: 'Так в еврейском масоретском тексте: слова уст представлены как жертвенные быки. Некоторые древние свидетели и толкователи понимают это выражение как «плод наших уст».'
    reason: alternative_reading
lexical_decisions:
- source_word: קְחוּ עִמָּכֶם דְּבָרִים
  choice: Возьмите с собой слова
  rationale: 'Сохраняет конкретную и намеренно простую формулировку еврейского текста: кающиеся должны прийти не с дарами, а со словами.'
- source_word: וְשׁוּבוּ אֶל־יְהוָה
  choice: и вернитесь к Яхве
  rationale: «Вернитесь» сохраняет одновременно образ возвращения и призыв к покаянию; имя יהוה передано как «Яхве».
- source_word: כָּל־תִּשָּׂא עָוֹן
  choice: Прости всю вину
  rationale: Сочетание נשׂא עון — идиома прощения, буквально связанная с несением или удалением вины. Естественное русское «прости» передаёт смысл, а буквальный образ отмечен в сноске.
- source_word: וְקַח־טוֹב
  choice: и прими доброе
  rationale: Краткая эллиптическая фраза допускает разные оттенки. «Прими доброе» сохраняет неопределённость того, что именно названо добрым, не добавляя в основной текст слов «нас», «молитву» или «жертву».
- source_word: וּנְשַׁלְּמָה פָרִים שְׂפָתֵינוּ
  choice: а мы воздадим Тебе быками наших уст
  rationale: Сохраняется масоретское чтение «быки наших уст» и жертвенно-обетный оттенок глагола שלם. Необычность русского образа соответствует необычности еврейской метафоры; пояснение и древний вариант даны в сноске.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст прямо употребляет тетраграмматон; личное заветное имя сохраняется в транслитерации без замены титулом.
- issue: Покаянный смысл שׁוב
  choice: вернитесь
  alternative: обратитесь
  rationale: «Вернитесь» не сводит выражение только к внутреннему обращению, а удерживает пространственный образ восстановления отношений с Богом.
- issue: Идиома נשׂא עון
  choice: Прости всю вину
  alternative: Унеси всю вину
  rationale: Основной текст передаёт ясный молитвенный смысл идиомы, а сноска сохраняет её буквальный образ удаления или несения вины.
- issue: Жертвенная метафора פָרִים שְׂפָתֵינוּ
  choice: быками наших уст
  alternative: плодом наших уст
  rationale: Основной текст следует согласному масоретскому тексту и не заменяет его более гладким древним вариантом или толкованием; альтернатива указана в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным молитвенным звучанием. Местоимение «Ему/Тебе» написано с прописной буквы как допустимая русская благоговейная норма. Необычная метафора «быками наших уст» сохранена намеренно и разъяснена в сноске.
