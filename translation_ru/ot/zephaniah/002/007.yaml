source:
  edition: WLC
  text: וְ/הָ֣יָה חֶ֗בֶל לִ/שְׁאֵרִ֛ית בֵּ֥ית יְהוּדָ֖ה עֲלֵי/הֶ֣ם יִרְע֑וּ/ן בְּ/בָתֵּ֣י אַשְׁקְל֗וֹן בָּ/עֶ֨רֶב֙ יִרְבָּצ֔וּ/ן כִּ֧י יִפְקְדֵ֛/ם יְהוָ֥ה אֱלֹהֵי/הֶ֖ם וְ/שָׁ֥ב שבות/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/007.yaml
  text: And the coastland shall belong to the remnant of the house of Judah; on it they shall pasture. In the houses of Ashkelon they shall lie down at evening, for Yahweh their God will attend to them and restore their fortunes.
translation:
  language: ru
  text: И достанется эта прибрежная область остатку дома Иуды. Там они будут пасти стада, а вечером будут ложиться на отдых в домах Ашкелона, потому что Яхве, их Бог, позаботится о них[a] и восстановит их благополучие[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посетит их», «обратит на них внимание». Еврейский глагол может обозначать действенное вмешательство как ради благословения, так и ради суда; здесь контекст указывает на милостивую заботу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вернёт их пленников». Еврейское выражение нередко означает восстановление прежнего положения или благополучия народа в целом.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֶבֶל
  choice: прибрежная область
  rationale: Существительное обозначает участок или область земли; контекст прибрежной Филистии в стихах 5–6 уточняет географический характер этой территории.
- source_word: שְׁאֵרִית בֵּית יְהוּדָה
  choice: остаток дома Иуды
  rationale: «Остаток» сохраняет характерное для пророческой речи значение уцелевшей части народа, а «дом Иуды» передаёт коллективное обозначение народа Иудеи.
- source_word: עֲלֵיהֶם יִרְעוּן
  choice: там они будут пасти стада
  rationale: Местоименное выражение отнесено к названной территории, а רעה понято как выпас скота. Добавление «стада» естественно для русского языка и явно выражает подразумеваемый объект действия.
- source_word: בְּבָתֵּי אַשְׁקְלוֹן
  choice: в домах Ашкелона
  rationale: Прямое местное значение предлога сохраняет образ заселения прежде филистимского города.
- source_word: בָּעֶרֶב יִרְבָּצוּן
  choice: вечером будут ложиться на отдых
  rationale: Глагол сохраняет конкретный образ укладывания, связанный с пастушеской картиной, тогда как «на отдых» делает выражение естественным и понятным по-русски.
- source_word: יִפְקְדֵם
  choice: позаботится о них
  rationale: В данном контексте многозначный глагол פקד обозначает благосклонное внимание и действенное попечение Бога; более буквальное «посетит» отмечено в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: וְשָׁב שְׁבוּתָם
  choice: восстановит их благополучие
  rationale: Устойчивое еврейское выражение здесь означает обращение бедственного положения народа и восстановление его прежнего доброго состояния, а не обязательно только возвращение пленников.
theological_decisions:
- issue: Значение וְשָׁב שְׁבוּתָם
  choice: восстановит их благополучие
  alternative: вернёт их пленников
  rationale: Пророческий контекст говорит о возвращении территории, обитания и безопасности в целом. Основной текст передаёт широкий смысл восстановления, а возможное более буквальное понимание сохранено в сноске.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер действия, выраженного פקד
  choice: позаботится о них
  alternative: посетит их
  rationale: Сам глагол допускает как благосклонное, так и судебное вмешательство, но последующее восстановление однозначно задаёт здесь благоприятный контекст. Смысловая широта отражена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис сделан плавным и общедоступным; сохранены образ пастбища, конкретное имя Ашкелона и личное имя Яхве. Две сноски отмечают реальную смысловую широту פקד и идиомы שׁוב שבות.
