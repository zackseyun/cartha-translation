source:
  edition: WLC
  text: נוֹרָ֤א יְהוָה֙ עֲלֵי/הֶ֔ם כִּ֣י רָזָ֔ה אֵ֖ת כָּל אֱלֹהֵ֣י הָ/אָ֑רֶץ וְ/יִשְׁתַּֽחֲווּ ל/וֹ֙ אִ֣ישׁ מִ/מְּקוֹמ֔/וֹ כֹּ֖ל אִיֵּ֥י הַ/גּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/011.yaml
  text: Yahweh will be fearsome against them[a], for he will make all the gods of the earth waste away; and they will bow down to him, each from his own place[b], all the coastlands of the nations.
translation:
  language: ru
  text: Грозен будет Яхве для них, потому что Он истощит всех богов земли[a]. И поклонятся Ему — каждый со своего места — все приморские земли народов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделает тощими» или «уморит голодом всех богов земли». Еврейский глагол обозначает исхудание, оскудение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все острова народов». В пророческой речи это выражение может обозначать далёкие островные и прибрежные страны и живущие там народы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נוֹרָא
  choice: грозен
  rationale: Предикативное прилагательное передаёт внушаемые Яхве страх и трепет; «грозен» естественно и достойно звучит по-русски, не сводя смысл только к положительному благоговению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: עֲלֵיהֶם
  choice: для них
  rationale: В сочетании «грозен для них» русский язык естественно передаёт направленность угрозы и суда; вариант «против них» здесь звучал бы менее идиоматично.
- source_word: רָזָה
  choice: истощит
  rationale: Глагол связан с исхуданием, оскудением и истощением. Выбор сохраняет метафору, не объясняя её как лишение поклонников прямо в тексте.
- source_word: אֵת כָּל אֱלֹהֵי הָאָרֶץ
  choice: всех богов земли
  rationale: Сохранена явная полемическая формулировка еврейского текста и его всемирный охват.
- source_word: וְיִשְׁתַּחֲווּ לוֹ
  choice: поклонятся Ему
  rationale: Глагол обозначает земной поклон и почитание; «поклонятся» сохраняет и телесный, и культовый оттенки.
- source_word: אִישׁ מִמְּקוֹמוֹ
  choice: каждый со своего места
  rationale: 'Сохранены распределительное значение אִישׁ и исходное значение предлога מִן: поклонение совершается из разных мест.'
- source_word: כֹּל אִיֵּי הַגּוֹיִם
  choice: все приморские земли народов
  rationale: אִיִּים может обозначать острова и прибрежные области, а в пророческой речи — далёкие заморские страны. «Приморские земли» сохраняет образ и допускает широкий географический смысл.
theological_decisions:
- issue: Как передать суд над «всеми богами земли», не добавляя метафизического объяснения
  choice: Сохранить выражение «всех богов земли» и метафору их истощения.
  alternative: Передать как «всех идолов» или «всю ложную религию».
  rationale: Еврейский текст прямо говорит о «богах» в полемическом контексте; перевод не должен заранее сводить это выражение к одной богословской интерпретации.
- issue: Описывает ли заключительная фраза паломничество в одно место или поклонение из разных мест
  choice: «каждый со своего места»
  alternative: «каждый на своём месте» или истолкование как паломничества к Сиону.
  rationale: Предлог מִן обычно выражает исходную точку («с, из»), поэтому формулировка сохраняет картину поклонения народов из их собственных мест, не устраняя возможного пророческого напряжения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным пророческим звучанием. Перестановка обстоятельства между тире помогает ясно связать подлежащее «все приморские земли народов» с глаголом и одновременно сохранить еврейское распределительное выражение.
