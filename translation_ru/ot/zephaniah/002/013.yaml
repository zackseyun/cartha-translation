base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/013.yaml
  text: And he will stretch out his hand against the north and destroy Assyria[a], and he will make Nineveh a desolation, dry like the wilderness.
translation:
  language: ru
  text: Он прострёт руку против севера и погубит Ассирию. Он превратит Ниневию в пустошь, сухую, как пустыня[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «мидбар» может обозначать пустыню, дикую необитаемую местность или малонаселённую степь, иногда используемую как пастбище.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵט יָדוֹ
  choice: прострёт руку
  rationale: Сочетание נטה с «рукой» передаёт конкретный образ решительного действия. «Прострёт руку» сохраняет этот образ и соответствует возвышенному, но понятному современному русскому языку.
- source_word: עַל צָפוֹן
  choice: против севера
  rationale: В контексте последующего уничтожения Ассирии предлог עַל выражает направленность враждебного действия; «север» обозначает северную область относительно Иудеи.
- source_word: וִיאַבֵּד אֶת אַשּׁוּר
  choice: погубит Ассирию
  rationale: Каузативная форма אבד означает привести к гибели или уничтожению. «Погубит» естественно передаёт сильный пророческий глагол, не добавляя способа разрушения.
- source_word: וְיָשֵׂם אֶת נִינְוֵה לִשְׁמָמָה
  choice: превратит Ниневию в пустошь
  rationale: שׂים с обозначением результата здесь значит «сделать, превратить», а שׁממה — опустошённое, разорённое место. «Пустошь» сохраняет предметность еврейского существительного.
- source_word: צִיָּה
  choice: сухую
  rationale: Слово обозначает сухость или иссохшую землю. Форма женского рода соотносится с «пустошью» и естественно вводит её характеристику.
- source_word: כַּמִּדְבָּר
  choice: как пустыня
  rationale: מִדְבָּר обозначает необитаемую или малонаселённую дикую местность и в данном контексте подчёркивает сухость и запустение. «Пустыня» — наиболее естественный русский эквивалент, а широта значения отмечена в сноске.
theological_decisions:
- issue: Антропоморфный образ Божьего суда
  choice: Сохранить выражение «Он прострёт руку»
  alternative: «Он выступит против севера»
  rationale: Еврейский текст прямо изображает действие Бога посредством телесного образа. Его сохранение передаёт силу пророческой речи и не заменяет образ отвлечённым толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. «Прострёт» сохраняет традиционно понятный образ без архаической перегруженности; разбиение на два предложения делает длинную еврейскую цепочку ясной.
