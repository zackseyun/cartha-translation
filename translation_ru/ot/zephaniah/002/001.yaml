lexical_decisions:
- source_word: הִתְקוֹשְׁשׁוּ
  choice: Соберитесь
  rationale: Возвратная форма повелительного наклонения множественного числа от קשׁשׁ здесь служит призывом народу собраться; буквальный образ собирания соломы в данном контексте звучал бы неясно.
- source_word: וָקֹשּׁוּ
  choice: соберитесь
  rationale: Второе повеление повторяет и усиливает первое. Простое повторение естественно по-русски передаёт настойчивость еврейской речи, не добавляя отсутствующего в тексте уточнения.
- source_word: הַגּוֹי
  choice: народ
  rationale: גּוֹי обозначает народ как единое сообщество. В прямом пророческом обращении русское «народ» звучит естественнее, чем политически более узкое «нация».
- source_word: לֹא נִכְסָף
  choice: бесстыдный
  rationale: Буквальное значение выражения, вероятно, связано с отсутствием желания или с тем, что народ не вызывает желания, однако сочетание трудно для толкования. Контекстуальное «бесстыдный» передаёт укор, а буквальные возможности сохранены в сноске.
theological_decisions:
- issue: Характеристика народа в выражении לֹא נִכְסָף
  choice: бесстыдный
  alternative: нежеланный; не знающий стремления
  rationale: 'Основной текст передаёт вероятный укор в понятной форме, но не выдаёт это толкование за бесспорное: подлинная лексическая неопределённость еврейского выражения явно отмечена в сноске.'
translation_notes:
