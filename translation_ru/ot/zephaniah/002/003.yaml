  text: בַּקְּשׁ֤וּ אֶת יְהוָה֙ כָּל עַנְוֵ֣י הָ/אָ֔רֶץ אֲשֶׁ֥ר מִשְׁפָּט֖/וֹ פָּעָ֑לוּ בַּקְּשׁוּ צֶ֨דֶק֙ בַּקְּשׁ֣וּ עֲנָוָ֔ה אוּלַי֙ תִּסָּ֣תְר֔וּ בְּ/י֖וֹם אַף יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/003.yaml
  text: Seek Yahweh[a], all you humble of the land, who have carried out his justice; seek righteousness, seek humility[d][c][b]; perhaps you will be hidden in the day of Yahweh’s anger.
translation:
  language: ru
  text: Ищите Яхве, все смиренные этой земли[a], которые исполняли Его правосудие[b]. Ищите праведности[c], ищите смирения; быть может, вы будете сокрыты[d] в день гнева Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все смиренные земли».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «которые исполняли Его установление» или «которые совершали Его суд».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «справедливости».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «можете быть сокрыты» или «будете укрыты».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּקְּשׁוּ
  choice: ищите
  rationale: Форма повелительного наклонения во множественном числе передаёт прямой призыв; троекратное повторение сохранено ради риторической силы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой русской транслитерацией, а не заменено титулом.
- source_word: עַנְוֵי הָאָרֶץ
  choice: все смиренные этой земли
  rationale: עַנְוֵי обозначает смиренных, кротких или уничиженных; «смиренные» поддерживает связь с последующим призывом искать смирения. הָאָרֶץ в данном пророческом обращении естественно понимать как землю Иудеи, хотя возможно и более широкое значение «земля, мир».
- source_word: אֲשֶׁר מִשְׁפָּטוֹ פָּעָלוּ
  choice: исполняющие Его установления
  rationale: Так передано деятельное значение פּעל и нормативный оттенок מִשְׁפָּט. Русское множественное число естественно выражает совокупность Божьих требований, не исключая значений «суд» и «правосудие».
- source_word: צֶדֶק
  choice: праведности
  rationale: В сочетании со смирением слово обозначает нравственно верный образ жизни; возможное значение «справедливость» отмечено в сноске.
- source_word: עֲנָוָה
  choice: смирения
  rationale: Слово означает смирение, кротость или скромность; «смирение» ясно и сохраняет лексическую связь с обращением к смиренным.
- source_word: אוּלַי
  choice: быть может
  rationale: Выражение сохраняет возможность, а не превращает слова пророка в безусловное обещание.
- source_word: תִּסָּתְרוּ
  choice: вы будете укрыты
  rationale: Страдательная форма передаёт состояние сокрытости или защищённости; модальная неопределённость уже выражена словами «быть может».
- source_word: בְּיוֹם אַף יְהוָה
  choice: в день гнева Яхве
  rationale: אַף здесь означает гнев; формулировка естественна по-русски и сохраняет силу пророческого предупреждения.
theological_decisions:
- issue: Обещает ли стих несомненное избавление смиренным или говорит лишь о его возможности
  choice: «Быть может, вы будете укрыты» — сохранена выраженная в тексте возможность.
  alternative: Понимать слова как безусловную гарантию спасения праведного остатка.
  rationale: Наречие אוּלַי прямо выражает неопределённость. Перевод не устраняет это богословское напряжение.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным пророческим звучанием. Сохранены повтор «ищите» и неопределённость «быть может»; избегнуты архаизмы и конфессионально маркированные формулы.
