base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/002.yaml
  text: before the decree gives birth—before the day passes away like chaff—before the burning anger of Yahweh comes upon you[c][b][a], before the day of Yahweh’s anger comes upon you.
translation:
  language: ru
  text: прежде чем указ родит[a], прежде чем день пронесётся, как мякина[b], прежде чем постигнет вас пылающий гнев Яхве, прежде чем постигнет вас день гнева Яхве[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прежде чем указ вступит в силу». Буквально еврейский текст говорит: «прежде чем указ родит», используя образ рождения для появления или исполнения установленного решения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прежде чем день пройдёт, словно мякина». Еврейская строка предельно сжата, поэтому синтаксическую связь сравнения «как мякина» можно понимать несколько по-разному.'
    reason: alternative_reading
  - marker: c
    text: 'Еврейский текст: «пылающий гнев Яхве» ... «день гнева Яхве».'
    reason: cross_reference
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: прежде чем
  rationale: Повторяющийся временной союз сохраняет настойчивую анафору еврейского текста.
- source_word: לֶדֶת חֹק
  choice: указ родит
  rationale: 'Сохранён необычный образ рождения: инфинитив ילד относится к חֹק, обозначающему здесь установленное решение или указ. Необычность русского выражения отражает необычность оригинала; более разъясняющий вариант дан в сноске.'
- source_word: כְּמֹץ עָבַר יוֹם
  choice: день пронесётся, как мякина
  rationale: «Мякина» передаёт образ лёгких отходов молотьбы, быстро уносимых ветром; «пронесётся» естественно выражает стремительное прохождение дня.
- source_word: חֲרוֹן אַף
  choice: пылающий гнев
  rationale: Передаёт как силу гнева, так и метафору жара в еврейском устойчивом сочетании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой русской транслитерацией, а не заменено титулом.
- source_word: יָבוֹא עֲלֵיכֶם
  choice: постигнет вас
  rationale: Естественная русская формула наступающего суда, сохраняющая направленность действия на адресатов.
- source_word: יוֹם אַף יְהוָה
  choice: день гнева Яхве
  rationale: Прямо передаёт конструктивную цепь, не превращая её автоматически в более широкую формулу «день Яхве».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в исходном тексте, и не подменяет его титулом.
- issue: Образность сочетания חֹק לֶדֶת
  choice: 'сохранить образ рождения: «указ родит»'
  alternative: «указ вступит в силу»; «решение будет исполнено»
  rationale: Еврейский текст намеренно употребляет родовую метафору; её устранение разрешило бы образ и богословское напряжение без достаточных оснований.
- issue: Связь слов כְּמֹץ с עָבַר יוֹם
  choice: «день пронесётся, как мякина»
  alternative: «прежде чем день пройдёт, словно мякина»; возможна иная пунктуационная связь образа
  rationale: Выбран наиболее прямой синтаксический вариант, но поэтическая сжатость допускает небольшую неопределённость, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский с сохранением пророческой поэтичности, четырёхкратного «прежде чем» и намеренно необычного образа рождения. Пунктуация помогает воспринимать длинную цепь предупреждений без сглаживания структуры оригинала.
