  yaml_path: translation/ot/zephaniah/002/004.yaml
  text: For Gaza will be abandoned[a], and Ashkelon a desolation; Ashdod—they will drive her out at noon[b], and Ekron will be uprooted.
translation:
  language: ru
  text: 'Ибо Газа будет покинута[a],

    Ашкелон станет пустыней;

    Ашдод среди бела дня изгонят[b],

    а Экрон будет выкорчеван.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте, вероятно, звучит игра слов: названия «Газа» (ʿАзза) и слово «покинута» (ʿазува) созвучны.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в полдень». Это выражение указывает на открытое, происходящее при свете дня изгнание.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Ибо
  rationale: Союз вводит основание для предшествующего призыва; «ибо» ясно сохраняет причинную связь и соответствует возвышенному пророческому регистру.
- source_word: עַזָּה
  choice: Газа
  rationale: Общепринятая русская форма географического названия.
- source_word: עֲזוּבָה תִהְיֶה
  choice: будет покинута
  rationale: 'Передаёт пассивно-результативное значение оборота: город останется оставленным и безлюдным. Звуковую игру с названием Газы невозможно естественно воспроизвести по-русски, поэтому она отмечена в сноске.'
- source_word: אַשְׁקְלוֹן לִשְׁמָמָה
  choice: Ашкелон станет пустыней
  rationale: Восстанавливает подразумеваемую связку и передаёт שְׁמָמָה как опустошённое, безлюдное место естественным русским выражением.
- source_word: בַּצָּהֳרַיִם
  choice: среди бела дня
  rationale: Буквально «в полдень». Русское выражение естественно подчёркивает открытый, ничем не прикрытый характер изгнания; буквальный вариант сохранён в сноске.
- source_word: יְגָרְשׁוּהָ
  choice: жителей Ашдода изгонят
  rationale: Неопределённо-личная конструкция сохраняет неназванного деятеля. Женский суффикс относится к городу; по-русски буквальное «изгонят её» двусмысленно, поэтому объект естественно раскрыт как население города.
- source_word: וְעֶקְרוֹן תֵּעָקֵר
  choice: а Экрон будет выкорчеван
  rationale: Сохраняет пассивную форму и сильную метафору удаления с корнем. В еврейском также слышна игра созвучных слов «Экрон — выкорчеван», которую русский перевод частично передаёт повтором согласных, не создавая искусственного каламбура.
