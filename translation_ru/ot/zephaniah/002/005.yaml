source:
  edition: WLC
  text: ה֗וֹי יֹֽשְׁבֵ֛י חֶ֥בֶל הַ/יָּ֖ם גּ֣וֹי כְּרֵתִ֑ים דְּבַר יְהוָ֣ה עֲלֵי/כֶ֗ם כְּנַ֨עַן֙ אֶ֣רֶץ פְּלִשְׁתִּ֔ים וְ/הַאֲבַדְתִּ֖י/ךְ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/005.yaml
  text: Woe[a], inhabitants of the seacoast, nation of the Cherethites! The word of Yahweh is against you, Canaan, land of the Philistines; and I will destroy you until no inhabitant remains.
translation:
  language: ru
  text: 'Горе жителям морского побережья, народу керетян[a]! Слово Яхве против вас, Ханаан, земля филистимлян: Я уничтожу тебя, так что не останется ни одного жителя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский этноним כְּרֵתִים традиционно также передают как «критяне»; точное соотношение керетян с жителями Крита остаётся не вполне ясным.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Пророческое междометие вводит возвещение суда; «горе» сохраняет его грозную силу и естественно звучит по-русски.
- source_word: יֹשְׁבֵי חֶבֶל הַיָּם
  choice: живущим на морском побережье
  rationale: Сочетание обозначает население приморской полосы; формулировка передаёт географический смысл без тяжеловесного буквализма.
- source_word: גּוֹי כְּרֵתִים
  choice: народу керефеев
  rationale: גּוֹי здесь означает народ, а כְּרֵתִים — этноним. «Керефеи» передаёт еврейское название и не отождествляет эту группу с критянами безоговорочно.
- source_word: דְּבַר יְהוָה עֲלֵיכֶם
  choice: Слово Яхве — против вас
  rationale: В контексте суда עַל выражает направленность враждебного пророчества; тире позволяет сохранить краткость и торжественность формулы.
- source_word: כְּנַעַן אֶרֶץ פְּלִשְׁתִּים
  choice: Ханаан, земля филистимлян
  rationale: Сохранено приложение, отождествляющее названную область Ханаана с землёй филистимлян, без внесения дополнительных пояснений.
- source_word: וְהַאֲבַדְתִּיךְ
  choice: Я уничтожу тебя
  rationale: Каузативная форма אבד обозначает уничтожение; местоимение женского рода относится к земле, названной Ханааном.
- source_word: מֵאֵין יוֹשֵׁב
  choice: так что не останется ни одного жителя
  rationale: Идиома выражает итог полного обезлюдения; русский оборот ясно передаёт результат, не добавляя идеи, отсутствующей в тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон; форма «Яхве» передаёт личное имя и соответствует принятому принципу перевода.
- issue: Референт обращения во второй половине стиха
  choice: «Ханаан, земля филистимлян» понимается как персонифицированная земля; поэтому «тебя»
  alternative: Отнести угрозу непосредственно только к народу керефеев
  rationale: Женский суффикс в וְהַאֲבַדְתִּיךְ согласуется с подразумеваемой землёй; при этом контекст связывает землю и её жителей, поэтому напряжение между территорией и народом не устраняется поясняющей вставкой.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным пророческим ритмом. Синтаксис сохраняет резкие обращения оригинала; устаревшие славянизмы и конфессионально окрашенные добавления не используются.
