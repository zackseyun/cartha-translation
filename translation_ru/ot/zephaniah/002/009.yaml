base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/009.yaml
  text: Therefore[a], as I live, declares Yahweh of hosts, the God of Israel, Moab will surely become like Sodom, and the sons of Ammon like Gomorrah—a place overgrown with weeds, a salt pit, and a perpetual desolation. The remnant of my people will plunder them[b], and the remainder of my nation will inherit them.
translation:
  language: ru
  text: 'Поэтому, жив Я, — возвещает Яхве Воинств, Бог Израиля, — Моав непременно станет как Содом, а сыны Аммона — как Гоморра: они станут местом, заросшим колючками[a], соляной ямой и вечной пустошью. Остаток Моего народа разграбит их, и оставшиеся из Моего народа унаследуют их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение еврейского выражения не вполне ясно; возможны переводы: «владение крапивы», «место крапивы» или «заросли колючек». Речь идёт о заброшенной земле, покрытой сорной колючей растительностью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
