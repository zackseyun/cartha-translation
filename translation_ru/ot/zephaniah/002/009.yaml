  rationale: Сохраняет краткую и торжественную формулу божественной клятвы; инверсия естественна для возвышенной русской речи.
- source_word: נְאֻם יְהוָה צְבָאוֹת אֱלֹהֵי יִשְׂרָאֵל
  choice: возвещает Яхве Воинств, Бог Израиля
  rationale: «Возвещает» естественно вводит пророческое изречение; имя Яхве передано как собственное имя, а צְבָאוֹת — кратким традиционно понятным титулом «Воинств».
- source_word: כִּי
  choice: непременно
  rationale: Передаёт усилительную силу частицы при содержании клятвы без неестественного буквального «что».
- source_word: מוֹאָב כִּסְדֹם תִּהְיֶה
  choice: Моав непременно станет как Содом
  rationale: «Станет» уместно выражает переход к состоянию разорения, подразумеваемому сравнением.
- source_word: וּבְנֵי עַמּוֹן
  choice: сыны Аммона
  rationale: Сохраняет образную форму исходного текста; в русском библейском регистре выражение понятно и не требует замены на этноним.
- source_word: מִמְשַׁק חָרוּל
  choice: местом, заросшим колючками
  rationale: Трудное еврейское выражение описывает заброшенную землю с колючей или крапивоподобной растительностью; перевод передаёт образ, не заявляя точный ботанический вид.
- source_word: וּמִכְרֵה מֶלַח
  choice: соляной ямой
  rationale: Передаёт образ засолённого бесплодного места; «яма» уместнее промышленно окрашенной «шахты».
- source_word: וּשְׁמָמָה עַד עוֹלָם
  choice: вечной пустошью
  rationale: Естественно соединяет состояние запустения и указание на его продолжительность.
- source_word: שְׁאֵרִית עַמִּי
  choice: Остаток Моего народа
  rationale: Сохраняет значимый пророческий термин «остаток».
- source_word: יְבָזּוּם
  choice: разграбит их
  rationale: Глагол בזז означает захват добычи у побеждённого противника; «разграбит» ясно передаёт эту силу.
- source_word: וְיֶתֶר גוי יִנְחָלוּם
  choice: уцелевшие из Моего племени овладеют ими
  rationale: Кетив גוי допускает понимание «мой народ/племя» по контексту; «овладеют» передаёт наследственное вступление во владение территориями и имуществом.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит тетраграмматон как личное имя; «Яхве» сохраняет его функцию и соответствует предоставленному доктринальному решению.
- issue: Значение יִנְחָלוּם
  choice: овладеют ими
  alternative: унаследуют их
  rationale: Глагол נחל может обозначать получение в наследственное владение. «Овладеют» естественно звучит в отношении побеждённых земель и имущества, не исключая наследственной коннотации.
- issue: Чтение וְיֶתֶר גוי
  choice: уцелевшие из Моего племени
  alternative: остаток Моего народа; остаток Моего народа унаследует их
  rationale: Согласование и древняя текстовая традиция делают место трудным. Перевод сохраняет параллелизм со «остатком Моего народа», не вводя отдельного народа без контекстуального основания.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Архаизмы ограничены прозрачными библейскими формами «жив Я» и «сыны Аммона». Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской религиозно-литературной норме; неоднозначность трудной фразы מִמְשַׁק חָרוּל отмечена сноской.
