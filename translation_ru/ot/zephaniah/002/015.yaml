base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/015.yaml
  text: This is the exultant city that lived securely[a], that said in her heart, ‘I am, and there is none besides me.’ How she has become a desolation[b], a resting place for wild animals! Everyone who passes by her will hiss and wave his hand.
translation:
  language: ru
  text: 'Вот ликующий город, живший в безопасности, говоривший в сердце своём: «Я — и нет никого, кроме меня». Как стал он запустением[a], местом, где залегают дикие звери! Всякий, проходящий мимо него, свистнет[b] и махнёт рукой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ужасом». Еврейское слово может обозначать не только опустошение, но и внушающее ужас зрелище.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «зашипит». Еврейский глагол может обозначать резкий свистящий или шипящий звук, выражающий изумление либо насмешку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעִיר הָעַלִּיזָה
  choice: ликующий город
  rationale: «Ликующий» передаёт радостное, самодовольное торжество города и сохраняет обличительный оттенок контекста.
- source_word: הַיּוֹשֶׁבֶת לָבֶטַח
  choice: живший беспечно
  rationale: Оборот обозначает продолжающееся пребывание в безопасности; «беспечно» естественно выражает как ощущение защищённости, так и самоуверенность Ниневии.
- source_word: הָאֹמְרָה בִּלְבָבָהּ
  choice: говоривший в сердце своём
  rationale: Сохранён библейский образ внутренней речи без сведения его к более плоскому «думавший».
- source_word: אֲנִי וְאַפְסִי עוֹד
  choice: Я — и кроме меня никого
  rationale: Формула исключительного самоутверждения передана кратко и с сохранением значимого созвучия с речениями о единственности Бога.
- source_word: לְשַׁמָּה
  choice: пустыней
  rationale: В контексте суда слово обозначает опустошённое, внушающее ужас место; основной текст передаёт состояние полного запустения, а более сильный оттенок отмечен в сноске.
- source_word: מַרְבֵּץ לַחַיָּה
  choice: логовом диких зверей
  rationale: Так естественно передано место, где в развалинах залегают дикие животные; «логово» здесь выразительнее общего «место отдыха».
- source_word: יִשְׁרֹק
  choice: свистнет
  rationale: Глагол обозначает резкий свистящий звук, выражающий изумление, ужас или насмешку; двусмысленность пояснена в сноске.
- source_word: יָנִיעַ יָדוֹ
  choice: махнёт рукой
  rationale: Естественный русский оборот передаёт видимый жест презрения или изумления, не уточняя сверх текста его точную форму.
theological_decisions:
- issue: Самовозвеличивающее заявление города אֲנִי וְאַפְסִי עוֹד
  choice: «Я — и кроме меня никого»
  alternative: «Я, и больше ничего нет»
  rationale: Выбранный вариант сохраняет намеренное ироническое созвучие с ветхозаветными формулами исключительности Господа, но не добавляет прямого богословского пояснения в сам стих.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Город персонифицирован, но грамматически согласование дано по русскому мужскому роду слова «город». Краткие фразы и восклицание сохраняют форму пророческой насмешки.
