base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/014.yaml
  text: Herds will lie down in her midst[a], every beast of the nations; both the desert owl and the hedgehog will spend the night among her capitals. A voice will sing in the window; devastation will be on the threshold[c][b], for her cedarwork has been laid bare.
translation:
  language: ru
  text: Посреди неё будут лежать стада, звери всех видов[a]. И пеликан[b], и ёж[c] будут ночевать на её капителях. Голос запоёт в окне, запустение будет на пороге, ибо обнажена её кедровая обшивка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всякий зверь народа» или сходным образом. Еврейская фраза трудна и, вероятно, означает зверей всякого рода.'
    reason: alternative_reading
  - marker: b
    text: 'Точное значение еврейского названия птицы неизвестно; возможно также: «пустынная сова».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «дикобраз». Точный вид животного, обозначенного еврейским словом, не установлен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָבְצוּ
  choice: будут лежать
  rationale: Глагол רבץ обычно описывает животных, которые ложатся или отдыхают; перевод сохраняет картину зверей, занявших разрушенный город.
- source_word: עֲדָרִים
  choice: стада
  rationale: Существительное обозначает группы стадных животных; «стада» естественно в данном контексте и не ограничивает смысл овцами.
- source_word: בְתוֹכָהּ
  choice: среди неё
  rationale: Женский суффикс относится к олицетворённому городу; формулировка сохраняет этот образ.
- source_word: כָּל חַיְתוֹ גוֹי
  choice: всевозможные звери
  rationale: 'Масоретский текст синтаксически труден: буквально он близок к «всякий зверь народа». По контексту выражение, вероятно, обозначает зверей всякого рода; неоднозначность отмечена в сноске.'
- source_word: קָאַת
  choice: пеликан
  rationale: Точное определение птицы спорно. «Пеликан» — традиционно и лексикографически допустимое соответствие; возможный вариант «пустынная сова» приведён в сноске.
- source_word: קִפֹּד
  choice: ёж
  rationale: Вид животного точно не установлен; «ёж» — распространённое соответствие, а вариант «дикобраз» отмечен в сноске.
- source_word: בְכַפְתֹּרֶיהָ
  choice: на капителях её колонн
  rationale: כפתור здесь, вероятно, обозначает архитектурные капители или украшенные верхи колонн. Добавление «колонн» делает образ понятным по-русски.
- source_word: יָלִינוּ
  choice: будут ночевать
  rationale: Глагол לין означает провести ночь; «ночевать» кратко и естественно передаёт смысл.
- source_word: קוֹל יְשׁוֹרֵר
  choice: Голос запоёт
  rationale: Перевод сохраняет необычный поэтический образ голоса, поющего среди развалин, и связь глагола со значением «петь».
- source_word: בַחַלּוֹן
  choice: в окне
  rationale: Прямое пространственное соответствие сохраняет образ звука, доносящегося из оконного проёма.
- source_word: חֹרֶב
  choice: запустение
  rationale: В контексте разрушенного города слово обозначает опустошение или разорение; «запустение» естественно сочетается с образом порога покинутого здания.
- source_word: בַסַּף
  choice: на пороге
  rationale: סף обозначает порог или дверной выступ; буквальный архитектурный образ сохранён.
- source_word: כִּי אַרְזָה עֵרָה
  choice: ибо обнажена её кедровая обшивка
  rationale: Фраза описывает содранные или открытые кедровые элементы здания. «Кедровая обшивка» передаёт архитектурный смысл без превращения города в кедровое дерево.
