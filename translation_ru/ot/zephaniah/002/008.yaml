base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/008.yaml
  text: I have heard the reproach of Moab and the insults of the sons of Ammon[b][a], with which they reproached my people and magnified themselves against their border.
translation:
  language: ru
  text: «Я слышал поношение Моава и оскорбления сынов Аммона[a], которыми они поносили Мой народ и превозносились над их пределами[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть аммонитяне.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «над их границей»; еврейский суффикс стоит во множественном числе. Вероятно, речь о границах Моего народа, но формулировка может пониматься и иначе; возможны передачи: «превозносились против их территории» или «хвалились по поводу их границ».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Я слышал
  rationale: Перфект первого лица передан естественным русским прошедшим временем; в пророческой речи оно выражает завершённое восприятие, сохраняющее значение для настоящего суда.
- source_word: חֶרְפַּת מוֹאָב
  choice: как Моав поносил
  rationale: Отглагольная передача естественнее по-русски, чем «поношение Моава», и сохраняет смысл словесного унижения.
- source_word: גִדּוּפֵי בְּנֵי עַמּוֹן
  choice: как сыны Аммона оскорбляли
  rationale: גִדּוּפִים обозначает брань и оскорбительную речь; «оскорбляли» ясно передаёт смысл, не сужая его до богохульства.
- source_word: בְּנֵי עַמּוֹן
  choice: сыны Аммона
  rationale: Сохранён образный еврейский этноним; в сноске дан естественный русский эквивалент «аммонитяне».
- source_word: אֲשֶׁר חֵרְפוּ אֶת עַמִּי
  choice: поносил и … оскорбляли Мой народ
  rationale: Относительное предложение встроено в параллельную русскую конструкцию, чтобы ясно показать объект обеих форм враждебной речи.
- source_word: וַיַּגְדִּילוּ
  choice: превозносились
  rationale: Глагол передаёт самовозвеличивание и высокомерие, сохраняя образ возвышения без тяжеловесного буквального оборота «делали себя великими».
- source_word: עַל גְּבוּלָם
  choice: над его пределами
  rationale: עַל допускает пространственно-враждебный оттенок, а множественное «пределы» является естественным русским обозначением границ территории. Местоимение «его» соотнесено с собирательным «народ», при этом неоднозначность отмечена в сноске.
theological_decisions:
- issue: Референт местоименного суффикса в גְּבוּלָם
  choice: «его пределами» — пределами Моего народа
  alternative: «своими пределами» — пределами Моава и Аммона либо более общее указание на территорию
  rationale: Ближайший смысловой антецедент — «Мой народ», а контекст говорит о враждебности Моава и Аммона к его земле. Поскольку еврейский суффикс формально имеет множественное число и допускает иной разбор, неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Параллельные существительные исходника переданы параллельными глагольными конструкциями ради ясности и естественности; обращение Бога «Мой народ» оформлено с прописной буквы.
