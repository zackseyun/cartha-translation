  text: И приморская земля станет пастбищами, где будут колодцы[a] для пастухов и загоны для овец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Смысл еврейского слова неясен; возможно: «колодцы». В других переводах: «жилища» или «убежища» для пастухов.'
    reason: Отмечает лексическую неопределённость כְּרֹת, не навязывая спорное толкование.
lexical_decisions:
- source_word: חֶבֶל הַיָּם
  choice: приморская земля
  rationale: Буквально «область/полоса моря»; в контексте обозначает прибрежную территорию. Такой перевод естественен по-русски и сохраняет территориальный смысл.
- source_word: נְוֹת
  choice: пастбищем
  rationale: Форма обозначает пастбища или места выпаса; собирательное единственное число естественно согласуется с подлежащим «приморская земля».
- source_word: כְּרֹת
  choice: с колодцами
  rationale: Редкое слово, традиционно связываемое с вырытыми сооружениями — колодцами или цистернами. Выбрано «колодцами» в соответствии с наиболее прямым пониманием корня כרה «копать» и консультационным английским текстом.
- source_word: גִדְרוֹת צֹאן
  choice: загонами для овец
  rationale: Устойчивое обозначение ограждённых мест для содержания мелкого скота; «загоны для овец» ясно и естественно для современного читателя.
