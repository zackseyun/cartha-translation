lexical_decisions:
- source_word: גַּם
  choice: и
  rationale: 'В данном обращении союз «и» естественно передаёт присоединительное значение: кушиты также включены в ряд народов, которым возвещён суд.'
- source_word: אַתֶּם
  choice: вы
  rationale: Сохраняет прямое обращение во втором лице множественного числа.
- source_word: כּוּשִׁים
  choice: кушиты
  rationale: Передача древнего этнонима не отождествляет Куш безоговорочно с современной Эфиопией и сохраняет историко-географическую неопределённость названия.
- source_word: חַֽלְלֵי
  choice: будете сражены
  rationale: Существительное обозначает павших, убитых оружием. Предикативная перестройка звучит естественно по-русски и передаёт предстоящую насильственную смерть.
- source_word: חַרְבִּי
  choice: Моим мечом
  rationale: Сохраняет конкретный образ меча и местоименный суффикс первого лица, указывающий на говорящего от имени Бога.
- source_word: הֵמָּה
  choice: будете
  rationale: В именном предложении местоимение выполняет предикативно-эмфатическую функцию. Будущее время восполняется по контексту пророческого возвещения; буквальная конструкция отмечена в сноске.
theological_decisions:
- issue: Временное значение безглагольного предложения
  choice: 'будущее: «будете сражены»'
  alternative: 'более буквально: «они — сражённые Моим мечом»'
  rationale: Контекст пророчества указывает на грядущий суд, однако грамматически еврейский текст не выражает времени глагольной формой. Основной текст передаёт контекстуальный будущий смысл, а сноска сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная пророческая формулировка. Заглавная буква в «Моим» показывает, что слова относятся к Богу, при этом образ меча сохранён без богословского перетолкования.
