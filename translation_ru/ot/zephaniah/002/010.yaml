source:
  edition: WLC
  text: זֹ֥את לָ/הֶ֖ם תַּ֣חַת גְּאוֹנָ֑/ם כִּ֤י חֵֽרְפוּ֙ וַ/יַּגְדִּ֔לוּ עַל עַ֖ם יְהוָ֥ה צְבָאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/002/010.yaml
  text: This will be their lot in return for their pride[a], because they taunted and magnified themselves against the people of Yahweh of Armies.
translation:
  language: ru
  text: Таково будет им воздаяние за их гордыню, потому что они поносили народ Яхве Воинств[a] и превозносились над ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционной передаче: «Господа Саваофа»; буквально: «Яхве воинств».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת לָהֶם
  choice: Таково будет им
  rationale: Женское указательное местоимение отсылает к ранее объявленному наказанию; в русском подразумевается «воздаяние», названное далее.
- source_word: תַּחַת גְּאוֹנָם
  choice: воздаяние за их гордыню
  rationale: תַּחַת здесь выражает соответствующее проступку возмездие, а גָּאוֹן в контексте суда означает надменную гордость.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание объявленного воздаяния.
- source_word: חֵרְפוּ
  choice: поносили
  rationale: Глагол обозначает оскорбительное поношение и презрительную насмешку; «поносили» сохраняет силу и достоинство пророческой речи.
- source_word: וַיַּגְדִּלוּ עַל
  choice: и превозносились над ним
  rationale: Порода hифиль глагола גדל с עַל передаёт самовозвеличивание по отношению к другому; местоимение «ним» естественно отсылает к народу.
- source_word: עַם
  choice: народ
  rationale: Передаёт обозначение народа, принадлежащего Яхве, и сохраняет заветный оттенок выражения.
- source_word: יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  rationale: Личное имя передано транслитерацией «Яхве», а צְבָאוֹת — прозрачным современным словом «Воинств», сохраняющим военный и небесный диапазон титула.
theological_decisions:
- issue: Передача божественного имени и титула יְהוָה צְבָאוֹת
  choice: Яхве Воинств
  alternative: Господь Саваоф; Господь воинств
  rationale: Основной текст сохраняет личное имя יהוה и смысл существительного צְבָאוֹת, не заменяя имя титулом. Традиционная русская форма приведена в примечании.
- issue: Объект самопревозношения
  choice: превозносились над ним, то есть над народом
  alternative: превозносились против народа
  rationale: Предлог עַל допускает оттенки «над» и «против»; контекст гордыни поддерживает «над», тогда как враждебный оттенок уже выражен глаголом «поносили».
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Воздаяние» передаёт судебный контекст без архаического синтаксиса; пара «поносили… и превозносились» сохраняет два разных действия исходного текста.
