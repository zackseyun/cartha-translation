source:
  edition: WLC
  text: יְהוָ֤ה צַדִּיק֙ בְּ/קִרְבָּ֔/הּ לֹ֥א יַעֲשֶׂ֖ה עַוְלָ֑ה בַּ/בֹּ֨קֶר בַּ/בֹּ֜קֶר מִשְׁפָּט֨/וֹ יִתֵּ֤ן לָ/אוֹר֙ לֹ֣א נֶעְדָּ֔ר וְ/לֹֽא יוֹדֵ֥עַ עַוָּ֖ל בֹּֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/005.yaml
  text: Yahweh is righteous in her midst; he does no injustice[a]. Morning by morning he brings his justice to light; it does not fail. But the unjust knows no shame.
translation:
  language: ru
  text: 'Яхве праведен посреди неё;

    Он не совершает неправды.

    Утро за утром Он выносит на свет Своё правосудие[a] — оно не исчезает;

    а творящий неправду не знает стыда.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Свой суд».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: צַדִּיק
  choice: праведен
  rationale: Сохраняет нравственный и судебный смысл определения, относящегося к Яхве, и естественно сочетается с последующим отрицанием неправды.
- source_word: בְּקִרְבָּהּ
  choice: посреди неё
  rationale: Сохраняет женский род местоименного суффикса, отсылающего к олицетворённому городу в контексте.
- source_word: לֹא יַעֲשֶׂה עַוְלָה
  choice: Он не совершает неправды
  rationale: Передаёт нравственно-судебный смысл עַוְלָה и звучит естественно в современном литературном русском языке.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: Утро за утром
  rationale: Сохраняет повтор и выраженное им регулярное, непрерывное действие.
- source_word: מִשְׁפָּטוֹ
  choice: Своё правосудие
  rationale: В контексте речь идёт о постоянном проявлении справедливого действия Яхве; возвратное «Своё» естественно указывает на субъект предложения.
- source_word: יִתֵּן לָאוֹר
  choice: являет при свете
  rationale: Передаёт образ вынесения чего-либо к свету, то есть его открытого проявления, без сведения выражения только к абстрактному раскрытию.
- source_word: לֹא נֶעְדָּר
  choice: неизменно
  rationale: 'Контекстуально передаёт отсутствие пропуска или недостатка: Божье правосудие каждое утро непременно становится явным.'
- source_word: וְלֹא יוֹדֵעַ עַוָּל בֹּשֶׁת
  choice: а творящий неправду не знает стыда
  rationale: «Творящий неправду» передаёт субстантивированное עַוָּל и поддерживает лексическую связь с עַוְלָה; союз «а» ясно выражает контраст.
theological_decisions:
- issue: Референт и род суффикса в בְּקִרְבָּהּ
  choice: '«посреди неё»: женский суффикс относится к олицетворённому городу — Иерусалиму/Сиону'
  alternative: «посреди него» или «в нём»
  rationale: Еврейский текст использует форму женского рода, согласующуюся с образом города в ближайшем контексте; её сохранение не устраняет олицетворение.
- issue: Значение מִשְׁפָּטוֹ
  choice: «Своё правосудие»
  alternative: «Свой суд»
  rationale: «Правосудие» подчёркивает продолжающееся справедливое действие Яхве и тематически связано с Его праведностью и отсутствием неправды; возможное более конкретное значение «суд» сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским ритмом. Параллелизм и повтор исходного текста сохранены; местоимение женского рода удерживает олицетворение города. «Неизменно» естественно передаёт לֹא נֶעְדָּר, избегая неуклюжего буквального «не отсутствует».
