  yaml_path: translation/ot/zephaniah/003/016.yaml
  text: On that day it will be said to Jerusalem[a], “Do not fear”; to Zion, “Do not let your hands grow weak.”
translation:
  language: ru
  text: 'В тот день Иерусалиму будет сказано: «Не бойся, Сион! Пусть не ослабевают твои руки[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальный образ допускает также перевод: «пусть твои руки не опускаются» или «не будут вялыми». Это еврейское выражение говорит об утрате силы, решимости или мужества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Устойчивое современное русское соответствие пророческому указанию времени; сохраняет определённость выражения.
- source_word: יֵאָמֵר
  choice: будет сказано
  rationale: Безличная пассивная конструкция передаёт нифаль и не вводит не названного в тексте говорящего.
- source_word: לִירוּשָׁלַם
  choice: Иерусалиму
  rationale: Предлог ל обозначает адресата речи; русский дательный падеж передаёт это прямо и естественно.
- source_word: אַל תִּירָאִי
  choice: Не бойся!
  rationale: Запрет обращён к олицетворённому городу в женском роде; краткая форма сохраняет силу исходного призыва.
- source_word: צִיּוֹן
  choice: Сион
  rationale: Сохранено прямое обращение без пояснительного добавления «жители Сиона»; положение после сильной паузы позволяет естественно передать слово как обращение.
- source_word: אַל יִרְפּוּ יָדָיִךְ
  choice: пусть не ослабевают твои руки
  rationale: Сохраняется образ рук и одновременно передаётся идиоматический смысл утраты силы, решимости или мужества.
theological_decisions:
- issue: Олицетворение Иерусалима и Сиона как адресата в женском роде
  choice: Сохранено прямое обращение к городам без замены на их жителей.
  alternative: Развернуть смысл как обращение к жителям Иерусалима и Сиона.
  rationale: Исходный текст грамматически обращается к олицетворённому городу; пояснительное расширение устранило бы поэтический образ.
- issue: Синтаксическая роль слова צִיּוֹן
  choice: 'Передано как обращение в начале второго призыва: «Сион, пусть…»'
  alternative: Понимать как второго адресата при подразумеваемом «будет сказано Сиону».
  rationale: В еврейском перед צִיּוֹן нет повторённого предлога ל, а масоретская акцентуация ставит сильную паузу после אַל תִּירָאִי. Перевод сохраняет возможное прямое обращение, не отождествляя его явно с зависимым от יֵאָמֵר дательным дополнением.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Безличное «будет сказано» сохраняет неопределённость говорящего; краткие повелительные фразы передают ободряющий тон оригинала.
