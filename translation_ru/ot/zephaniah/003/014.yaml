  yaml_path: translation/ot/zephaniah/003/014.yaml
  text: Sing for joy[a], daughter Zion; shout aloud, Israel! Rejoice and exult with all your heart, daughter Jerusalem!
translation:
  language: ru
  text: Ликуй[a], дочь Сиона! Громко восклицайте, Израиль! Радуйся и веселись от всего сердца, дочь Иерусалима!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пой от радости». Выражения «дочь Сиона» и «дочь Иерусалима» олицетворяют город и его жителей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָנִּי
  choice: Ликуй
  rationale: Императив женского рода от רנן выражает громкую, ликующую хвалу, нередко песенную. «Ликуй» естественно передаёт радостное возглашение, не сужая его непременно до пения.
- source_word: בַּת צִיּוֹן
  choice: дочь Сиона
  rationale: Сохранён древнееврейский образ персонифицированного города и звательная функция сочетания; родительный падеж естественен для русского библейско-поэтического языка.
- source_word: הָרִיעוּ
  choice: Торжествуй
  rationale: Императив множественного числа обозначает громкий радостный крик. В обращении к собирательному «Израиль» русское единственное число звучит естественно; «торжествуй» передаёт публичный победно-радостный характер возгласа.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Традиционная русская форма имени; здесь употреблено как обращение к народу.
- source_word: שִׂמְחִי
  choice: Радуйся
  rationale: Прямой и естественный эквивалент императива от שמח, соответствующий возвышенному пророческому призыву.
- source_word: וְעָלְזִי
  choice: и веселись
  rationale: Передаёт усиленную, деятельную радость глагола עלז и сохраняет различие с предшествующим שמח.
- source_word: בְּכָל לֵב
  choice: от всего сердца
  rationale: Естественное русское выражение полноты внутреннего чувства; в данном контексте радости оно идиоматичнее буквального «всем сердцем».
- source_word: בַּת יְרוּשָׁלִָם
  choice: дочь Иерусалима
  rationale: Сохраняет персонификацию города и поэтический параллелизм с «дочь Сиона».
