source:
  edition: WLC
  text: כִּֽי אָ֛ז אֶהְפֹּ֥ךְ אֶל עַמִּ֖ים שָׂפָ֣ה בְרוּרָ֑ה לִ/קְרֹ֤א כֻלָּ/ם֙ בְּ/שֵׁ֣ם יְהוָ֔ה לְ/עָבְד֖/וֹ שְׁכֶ֥ם אֶחָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/009.yaml
  text: For then I will change the speech of the peoples to a pure speech[c][b][a], so that all of them may call on the name of Yahweh and serve him with one accord.
translation:
  language: ru
  text: Ибо тогда Я дам народам чистые уста[a], чтобы все они призывали имя Яхве[b] и служили Ему плечом к плечу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обращу (или: изменю) для народов чистую губу». Еврейское «губа» здесь может означать уста, речь или язык; выражение можно передать также: «дам народам чистую речь», «очищу уста народов» или «дам народам чистый язык».'
    reason: lexical_alternative
  - marker: b
    text: «Яхве» передаёт еврейское имя Бога יהוה (ЙХВХ); традиционный вариант — «Господь».
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «одним плечом» — то есть сообща, в полном согласии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶהְפֹּךְ אֶל עַמִּים שָׂפָה בְרוּרָה
  choice: Я дам народам чистые уста
  rationale: Необычная конструкция буквально означает «обращу/изменю для народов чистую усту». «Дам» естественно передаёт направленность Божьего действия к народам, а «чистые уста» сохраняют исходный образ и не сужают смысл до единого языка.
- source_word: עַמִּים
  choice: народам
  rationale: Множественное число обозначает множество народов и сохраняет всеобщий охват обещания.
- source_word: שָׂפָה בְרוּרָה
  choice: чистые уста
  rationale: שָׂפָה буквально значит «губа, уста» и метонимически — речь или язык; בְרוּרָה здесь указывает на чистоту. Образ «чистых уст» естественен в русском библейском регистре и сохраняет смысловую неоднозначность.
- source_word: לִקְרֹא ... בְּשֵׁם יְהוָה
  choice: призывали имя Яхве
  rationale: Сочетание קרא בשם обозначает призывание имени Бога, особенно в поклонении; форма цели передана союзом «чтобы».
- source_word: לְעָבְדוֹ
  choice: и служили Ему
  rationale: עבד охватывает как поклонение, так и более широкий смысл преданного служения, поэтому «служили» не сужает значение до обряда.
- source_word: שְׁכֶם אֶחָד
  choice: плечом к плечу
  rationale: Буквально «одним плечом»; русский оборот «плечом к плечу» сохраняет телесный образ и ясно выражает совместное, единодушное служение.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон. «Яхве» сохраняет личное заветное имя и отличает его от титула «Господь»; вариант отмечен в сноске для читателей, знакомых с традиционной передачей.
- issue: Характер обещанного изменения
  choice: дам народам чистые уста
  alternative: изменю речь народов на чистую речь; дам народам чистый язык
  rationale: Еврейский текст допускает понимание שָׂפָה как уст, речи или языка. Основной текст сохраняет образ уст и не утверждает однозначно восстановление одного общего языка; варианты приведены в сноске.
- issue: Единство служения
  choice: плечом к плечу
  alternative: единодушно; одним плечом
  rationale: Так сохраняются и буквальный образ שְׁכֶם אֶחָד, и его идиоматический смысл совместного, согласного служения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прост и ясен; образность еврейского текста сохранена там, где она понятна русскому читателю. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
