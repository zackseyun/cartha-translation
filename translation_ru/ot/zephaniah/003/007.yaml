  variant: modern literary Russian
source:
  edition: WLC
  text: אָמַ֜רְתִּי אַךְ תִּירְאִ֤י אוֹתִ/י֙ תִּקְחִ֣י מוּסָ֔ר וְ/לֹֽא יִכָּרֵ֣ת מְעוֹנָ֔/הּ כֹּ֥ל אֲשֶׁר פָּקַ֖דְתִּי עָלֶ֑י/הָ אָכֵן֙ הִשְׁכִּ֣ימוּ הִשְׁחִ֔יתוּ כֹּ֖ל עֲלִילוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/007.yaml
  text: I said[a], ‘Surely you will fear me; you will accept correction. Then her dwelling would not be cut off, according to all that I had appointed against her.’ But instead, they rose early[b]; they corrupted all their deeds.
translation:
  language: ru
  text: 'Я сказал: «Ты непременно убоишься Меня и примешь вразумление. Тогда её жилище не было бы истреблено — согласно всему, что Я определил против неё[a]». Но вместо этого они вставали рано[b] и губили все свои дела.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Тогда её жилище не было бы истреблено, несмотря на всё, что Я определил против неё».'
    reason: alternative_reading
  - marker: b
    text: «Вставать рано» — еврейский оборот, который здесь может подразумевать рвение или упорство.
    reason: cultural_note
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Я сказал
  rationale: Прямо передаёт форму первого лица от אמר и сохраняет обрамление последующей речи как слов Бога.
- source_word: אַךְ
  choice: непременно
  rationale: Здесь частица выражает уверенное ожидание, а не ограничение; «непременно» естественно передаёт эту силу.
- source_word: תִּירְאִי אוֹתִי
  choice: ты убоишься Меня
  rationale: Сохраняет значение страха перед Богом, включающее благоговение, не сводя его только к почтению.
- source_word: תִּקְחִי מוּסָר
  choice: примешь вразумление
  rationale: Естественно передаёт сочетание לקח + מוסר как готовность принять исправляющее наставление или взыскание.
- source_word: וְלֹא יִכָּרֵת
  choice: не было бы истреблено
  rationale: Условное наклонение по-русски раскрывает подразумеваемый, но не осуществившийся результат ожидаемого обращения; «истреблено» передаёт сильный смысл כרת.
- source_word: מְעוֹנָהּ
  choice: её жилище
  rationale: Сохраняет образ города как женщины и переход от обращения к ней к речи о её жилище.
- source_word: כֹּל אֲשֶׁר פָּקַדְתִּי עָלֶיהָ
  choice: согласно всему, что Я определил против неё
  rationale: Сохраняет сжатость и трудность еврейской конструкции, а также смысл назначенного Богом суда, не представляя его уже исполненным.
- source_word: אָכֵן
  choice: Но
  rationale: Передаёт резкий контраст между ожидавшимся откликом и фактическим поведением народа.
- source_word: הִשְׁכִּימוּ
  choice: они вставали рано
  rationale: Сохраняет буквальный пророческий оборот; подразумеваемые усердие или упорство пояснены в сноске.
- source_word: הִשְׁחִיתוּ כֹּל עֲלִילוֹתָם
  choice: развращали все свои дела
  rationale: Передаёт переходный Hiphil глагола שׁחת и нравственную испорченность всей совокупности их поступков.
theological_decisions:
- issue: Женский род единственного числа и последующий переход ко множественному числу
  choice: Женское единственное число относится к олицетворённому Иерусалиму, а множественное — к его жителям.
  alternative: Женский род может обозначать город или народ как общность без подчёркнутого олицетворения.
  rationale: Перевод сохраняет грамматический переход от «её жилища» к «они», не сглаживая его.
- issue: Связь выражения о назначенном суде с тем, что жилище не было бы истреблено
  choice: Фраза понимается как указание на суд, в соответствии с которым город был бы истреблён, если бы не принял вразумление.
  alternative: 'Фразу можно понимать уступительно: жилище не было бы истреблено, несмотря на всё назначенное против него.'
  rationale: Основной вариант соответствует последовательности ожидания, возможного результата и отказа народа, а синтаксическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Формы «убоишься» и «вразумление» сохраняют достоинство и богословскую ёмкость, оставаясь понятными; синтаксическая напряжённость спорной судебной оговорки намеренно не устранена.
