revisions:
- from: В то время Я приведу вас и тогда же соберу вас. Я сделаю так, что вы будете славны и прославляемы среди всех народов земли, когда у вас на глазах восстановлю ваше благополучие[a], — говорит Яхве.
  to: В то время Я приведу вас, когда соберу вас; ибо Я сделаю вас славными и достойными хвалы среди всех народов земли, когда у вас на глазах верну вам благополучие[a], — говорит Яхве.
  rationale: Добавлено «ибо» для явной передачи כִּי. Второй временной оборот приведён в соответствие с еврейской инфинитивной конструкцией. Лексика восстановления слегка уточнена для естественного современного русского, а сноска удерживает буквальные и спорные оттенки идиомы.
