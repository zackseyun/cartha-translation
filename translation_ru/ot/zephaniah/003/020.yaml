  text: בָּ/עֵ֤ת הַ/הִיא֙ אָבִ֣יא אֶתְ/כֶ֔ם וּ/בָ/עֵ֖ת קַבְּצִ֣/י אֶתְ/כֶ֑ם כִּֽי אֶתֵּ֨ן אֶתְ/כֶ֜ם לְ/שֵׁ֣ם וְ/לִ/תְהִלָּ֗ה בְּ/כֹל֙ עַמֵּ֣י הָ/אָ֔רֶץ בְּ/שׁוּבִ֧/י אֶת שְׁבוּתֵי/כֶ֛ם לְ/עֵינֵי/כֶ֖ם אָמַ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/020.yaml
  text: At that time I will bring you in[a], and at that time I will gather you; for I will make you a name and a praise among all the peoples of the earth, when I restore your fortunes before your eyes, says Yahweh.
translation:
  language: ru
  text: В то время Я приведу вас, когда соберу вас; ибо Я сделаю вас славными и достойными хвалы среди всех народов земли, когда у вас на глазах верну вам благополучие[a], — говорит Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «когда Я возвращу ваше пленение»; возможно также: «когда Я возвращу ваших пленников». Это еврейское выражение обычно обозначает восстановление после изгнания или иного бедствия.'
    reason: Сохраняет неоднозначность идиомы שׁוּב שְׁבוּת, включая связь как с пленом и изгнанием, так и с более широким восстановлением.
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: В то время
  rationale: Естественно передаёт пророческую формулу времени и сохраняет указание на обещанное будущее действие.
- source_word: אָבִיא אֶתְכֶם
  choice: Я приведу вас
  rationale: Глагол в породе хифиль означает «привести». Место назначения в еврейском тексте не названо, поэтому перевод не добавляет «назад» или «туда».
- source_word: וּבָעֵת קַבְּצִי אֶתְכֶם
  choice: и тогда же соберу вас
  rationale: Инфинитивная конструкция указывает на время Божьего собирания. Формулировка сохраняет параллелизм, не воспроизводя тяжеловесно буквальное «во время собирания Мною вас».
- source_word: כִּי
  choice: Я сделаю так, что
  rationale: В данном контексте частица вводит пояснение к обещанию; синтаксическая перестройка естественно связывает последующее действие с предыдущим, не навязывая узкого причинного оттенка.
- source_word: אֶתֵּן אֶתְכֶם לְשֵׁם וְלִתְהִלָּה
  choice: Я сделаю так, что вы будете славны и прославляемы
  rationale: Буквально «дам вас для имени и для хвалы». Русская формулировка передаёт дарованные Богом известность, доброе имя и похвалу без неестественной кальки.
- source_word: בְּכֹל עַמֵּי הָאָרֶץ
  choice: среди всех народов земли
  rationale: Предлог передаёт сферу признания среди народов; множественное עַמֵּי сохранено, а הָאָרֶץ в универсальном контексте понято как «земля».
- source_word: בְּשׁוּבִי אֶת שְׁבוּתֵיכֶם
  choice: когда восстановлю ваше благополучие
  rationale: Устойчивое выражение שׁוּב שְׁבוּת обозначает возвращение из состояния бедствия, включая изгнание. Идиоматический перевод передаёт широкое восстановление; буквальные возможности отмечены в сноске.
- source_word: לְעֵינֵיכֶם
  choice: у вас на глазах
  rationale: Живой современный русский эквивалент выражения «перед вашими глазами», подчёркивающий открытое, непосредственно наблюдаемое исполнение.
- source_word: אָמַר יְהוָה
  choice: говорит Яхве
  rationale: Сохранена обычная пророческая формула и собственное имя, непосредственно представленное тетраграмматоном.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное Божье имя; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Значение формулы שׁוּב שְׁבוּת
  choice: восстановлю ваше благополучие
  alternative: возвращу вас из плена; возвращу ваших пленников; изменю вашу участь
  rationale: Формула может охватывать возвращение изгнанников и более широкое избавление от бедствия. Основной перевод передаёт широкий идиоматический смысл, а сноска сохраняет конкретные буквальные прочтения.
- issue: Образ לְשֵׁם וְלִתְהִלָּה
  choice: вы будете славны и прославляемы
  alternative: сделаю вас именем и хвалой; дарую вам имя и хвалу
  rationale: Выражение обещает народу известность и похвалу среди других народов. Естественный русский перевод передаёт этот смысл, не связывая его с особой конфессиональной трактовкой.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис упрощён ради ясности, но параллелизм двух Божьих действий и напряжение между буквальным возвращением из плена и общим восстановлением сохранены.
