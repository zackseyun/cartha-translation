base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/012.yaml
  text: But I will leave in your midst a people humble and lowly[a], and they will take refuge in the name of Yahweh.
translation:
  language: ru
  text: Но Я оставлю среди тебя народ смиренный и бедный[a], и они будут искать убежища в имени Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «народ угнетённый и бедный»; возможно также: «бедный и нуждающийся народ». Еврейские слова могут указывать как на смирение и низкое положение, так и на угнетение и бедность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁאַרְתִּי
  choice: Но Я оставлю
  rationale: Хифиль глагола שׁאר выражает действие, в результате которого кто-либо остаётся. «Оставлю» естественно передаёт прямое действие Бога, а «но» обозначает контраст с предшествующим контекстом суда, хотя ו само по себе допускает и простое «и».
- source_word: בְקִרְבֵּךְ
  choice: среди тебя
  rationale: Форма второго лица женского рода единственного числа обращена к Сиону/Иерусалиму; «среди тебя» естественно передаёт нахождение внутри этой общины.
- source_word: עַם
  choice: народ
  rationale: Слово обозначает коллектив людей, оставленный Богом в Иерусалиме; «народ» точнее, чем политически окрашенная «нация».
- source_word: עָנִי
  choice: смиренный
  rationale: Слово может обозначать угнетённого, бедного или смиренного. В сочетании со следующим определением и упованием на Яхве «смиренный» передаёт зависимое положение народа, не исключая смысла бедствия.
- source_word: וָדָל
  choice: и униженный
  rationale: דַּל может означать бедного, слабого, незначительного или находящегося в низком положении. «Униженный» сохраняет социальную и жизненную уязвимость, не сводя выражение только к материальной бедности.
- source_word: וְחָסוּ
  choice: и они будут искать убежища
  rationale: חסה несёт образ прибегания под защиту. «Искать убежища» сохраняет эту метафору яснее, чем обобщённое «надеяться».
- source_word: בְּשֵׁם
  choice: в имени
  rationale: Предлог ב с «именем» обозначает сферу или основание, в котором ищут защиты, то есть открытые характер и власть Бога. Буквальное выражение сохраняет образ оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом.
theological_decisions:
- issue: Смысл עָנִי וָדָל в описании остатка
  choice: смиренный и униженный
  alternative: угнетённый и бедный; бедный и нуждающийся
  rationale: Выбранная формулировка отражает смиренное, зависимое положение остатка перед Богом, подтверждаемое последующей фразой об убежище в имени Яхве, но примечание сохраняет возможный социальный смысл страдания и бедности.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся близким к еврейскому тексту, при этом местоимение «они» сохранено для естественного перехода от собирательного существительного «народ» к множественному числу глагола.
