base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/019.yaml
  text: Behold[a], at that time I will deal with all your oppressors, and I will save the lame and gather the outcast[d][c][b], and I will make them a praise and a name in every land where they were put to shame.
translation:
  language: ru
  text: Вот, в то время Я выступлю против всех твоих угнетателей[a], спасу хромающую и соберу изгнанную[b]. Я сделаю их предметом хвалы и дарую им доброе имя во всех странах[c], где они были посрамлены[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против всех, кто тебя угнетает». Еврейское слово может означать причиняющих страдание, угнетающих или унижающих.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ту, которая хромает» и «ту, которая была прогнана». В еврейском тексте употреблены формы женского рода единственного числа; вероятно, ими олицетворена страдающая община.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «по всей земле».'
    reason: lexical_alternative
  - marker: d
    text: 'Конец стиха в еврейском тексте труден для понимания; буквальнее его можно передать: «во всей земле их позора» или «по всей земле — их позор». Основной текст следует контекстуальному смыслу: там, где они были посрамлены.'
    reason: textual_difficulty
lexical_decisions:
- source_word: הִנְנִי
  choice: Вот
  rationale: Сохраняет торжественную силу вводной пророческой формулы и естественно звучит в современном литературном русском языке.
- source_word: עֹשֶׂה אֶת כָּל מְעַנַּיִךְ
  choice: Я поступлю со всеми твоими притеснителями
  rationale: Глагол буквально означает «делать, поступать», а в данном сочетании подразумевает решительное действие Бога против угнетателей, не уточняя способ суда сверх сказанного в тексте.
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Прямо передаёт именно эту временную формулу, не подменяя её иной пророческой формулой «в тот день».
- source_word: וְהוֹשַׁעְתִּי
  choice: спасу
  rationale: Передаёт основное значение ישׁע и сохраняет богословское звучание избавления.
- source_word: הַצֹּלֵעָה
  choice: хромающую
  rationale: Сохраняет конкретный образ того, кто хромает, а также женский род единственного числа, которым, вероятно, олицетворена страдающая община.
- source_word: הַנִּדָּחָה
  choice: изгнанную
  rationale: Передаёт смысл насильственного удаления и рассеяния, сохраняя женский род олицетворённой общины.
- source_word: אֲקַבֵּץ
  choice: соберу
  rationale: Прямой и естественный эквивалент распространённого глагола восстановления рассеянного народа.
- source_word: וְשַׂמְתִּים לִתְהִלָּה וּלְשֵׁם
  choice: Я сделаю их предметом хвалы и дарую им доброе имя
  rationale: «Предмет хвалы» передаёт לִתְהִלָּה, а «доброе имя» выражает идиому репутации и известности, избегая неестественного русского «сделаю их именем».
- source_word: בְּכָל הָאָרֶץ
  choice: во всякой земле
  rationale: 'В контексте рассеяния допускается распределительное понимание: в каждой стране или земле, где община терпела позор; альтернатива «по всей земле» сохранена в примечании.'
theological_decisions:
- issue: Образ страдающей и восстанавливаемой общины
  choice: хромающую … изгнанную
  alternative: хромых … изгнанников; ту, которая хромает … ту, которая была прогнана
  rationale: Еврейские формы стоят в женском роде единственного числа и, вероятно, олицетворяют дочь Сиона либо собирательно обозначают народ. Перевод сохраняет и грамматический образ, и возможность коллективного прочтения.
- issue: Характер действия Бога против угнетателей
  choice: поступлю со всеми твоими притеснителями
  alternative: покараю всех твоих притеснителей; выступлю против всех, кто тебя угнетает
  rationale: Контекст предполагает суд, однако общий глагол עשה не называет конкретную меру наказания. Формулировка сохраняет грозный смысл, не делая его более определённым, чем оригинал.
- issue: Переход от женского единственного числа к множественному числу
  choice: Я сделаю их
  alternative: Я сделаю её
  rationale: Еврейский текст после двух женских собирательных образов переходит к местоимению множественного числа -ם. Перевод сохраняет этот переход и тем самым выявляет общинный смысл образов.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным пророческим звучанием. Сохранены краткие параллельные фразы, образ хромающей и изгнанной общины, а также намеренная неопределённость общего глагола Божьего действия. Заглавная буква в местоимении «Я» подчёркивает прямую речь Бога в соответствии с принятой русской библейской типографикой.
