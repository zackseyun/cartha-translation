  text: לָ/כֵ֤ן חַכּוּ לִ/י֙ נְאֻם יְהוָ֔ה לְ/י֖וֹם קוּמִ֣/י לְ/עַ֑ד כִּ֣י מִשְׁפָּטִ/י֩ לֶ/אֱסֹ֨ף גּוֹיִ֜ם לְ/קָבְצִ֣/י מַמְלָכ֗וֹת לִ/שְׁפֹּ֨ךְ עֲלֵי/הֶ֤ם זַעְמִ/י֙ כֹּ֚ל חֲר֣וֹן אַפִּ֔/י כִּ֚י בְּ/אֵ֣שׁ קִנְאָתִ֔/י תֵּאָכֵ֖ל כָּל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/008.yaml
  text: Therefore wait for me[a], declares Yahweh, for the day when I rise up for plunder; for my judgment is to gather nations, to assemble kingdoms, to pour out on them my indignation, all my burning anger[c][b]; for in the fire of my jealousy all the earth will be consumed.
translation:
  language: ru
  text: Поэтому ждите Меня, — возвещает Яхве, — до дня, когда Я восстану, чтобы захватить добычу[a]. Ибо Моё решение — собрать народы, созвать царства, чтобы излить на них Моё негодование, весь жар Моего гнева. Ибо в огне Моей ревности[b] будет поглощена вся земля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение трудно для понимания. Возможный перевод: «когда Я восстану как свидетель».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «рвения».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может означать как всю землю, так и определённую страну или территорию; упоминание народов и царств поддерживает здесь более широкий смысл.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Поэтому
  rationale: Передаёт вывод, связывающий повеление с предшествующим пророческим контекстом.
- source_word: חַכּוּ לִי
  choice: ждите Меня
  rationale: Сохраняет форму повелительного наклонения во множественном числе и направленность ожидания на Яхве.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Естественно и торжественно передаёт устойчивую пророческую формулу и сохраняет личное имя Бога.
- source_word: לְיוֹם קוּמִי לְעַד
  choice: до того дня, когда Я восстану ради добычи
  rationale: «До того дня» естественно выражает ожидаемый будущий срок; לְעַד в данном контексте принято в значении добычи, при сохранении трудности чтения в сноске.
- source_word: מִשְׁפָּטִי
  choice: Моё решение
  rationale: В контексте суда обозначает вынесенное Богом судебное решение; дальнейшие инфинитивы раскрывают его содержание.
- source_word: לֶאֱסֹף גּוֹיִם לְקָבְצִי מַמְלָכוֹת
  choice: собрать народы, созвать царства
  rationale: Сохраняет параллелизм двух близких глаголов, не создавая тяжеловесного повтора.
- source_word: לִשְׁפֹּךְ עֲלֵיהֶם זַעְמִי
  choice: излить на них Моё негодование
  rationale: Сохраняет образ излияния и отличает זַעַם от следующего выражения о пылающем гневе.
- source_word: כֹּל חֲרוֹן אַפִּי
  choice: весь жар Моего гнева
  rationale: Передаёт идиому буквально-образно и подчёркивает силу гнева без неестественной русской кальки.
- source_word: בְּאֵשׁ קִנְאָתִי
  choice: Огонь Моей ревности
  rationale: Сохраняет огненный образ и основное значение קִנְאָה как ревности, не исключая оттенка ревностного рвения.
- source_word: כָּל הָאָרֶץ
  choice: всю землю
  rationale: Контекст народов и царств поддерживает широкий смысл «вся земля», хотя слово также может обозначать страну или землю как территорию.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя, представленное тетраграмматоном, вместо замены его титулом.
- issue: Значение לְעַד
  choice: ради добычи
  alternative: как свидетель
  rationale: Слово допускает понимание как «добыча»; оно хорошо соответствует сцене собирания царств для суда. Судебный контекст позволяет и традиционное понимание «свидетель», поэтому оно отмечено в сноске.
- issue: Значение קִנְאָה
  choice: ревность
  alternative: рвение
  rationale: «Ревность» сохраняет личностный и заветный оттенок божественной исключительности, тогда как «рвение» остаётся возможным лексическим прочтением.
- issue: Объём значения הָאָרֶץ
  choice: вся земля
  alternative: вся страна
  rationale: Упоминание народов и царств склоняет к всемирному охвату, но семантически более узкое территориальное значение остаётся возможным.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся близким к ходу еврейского текста, но разбит на естественные русские фразы. Заглавные местоимения при обращении Бога к Себе использованы как принятая в русском религиозном письме стилистическая норма.
