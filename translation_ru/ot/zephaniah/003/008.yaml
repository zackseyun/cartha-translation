  to: Поэтому ждите Меня, — возвещает Яхве, — до дня, когда Я восстану, чтобы захватить добычу[a]. Ибо Моё решение — собрать народы, созвать царства, чтобы излить на них Моё негодование, весь жар Моего гнева. Ибо в огне Моей ревности[b] будет поглощена вся земля[c].
