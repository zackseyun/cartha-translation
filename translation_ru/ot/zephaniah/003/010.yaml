  text: מֵ/עֵ֖בֶר לְ/נַֽהֲרֵי כ֑וּשׁ עֲתָרַ/י֙ בַּת פוּצַ֔/י יוֹבִל֖וּ/ן מִנְחָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/010.yaml
  text: From beyond the rivers of Cush, my worshipers, the daughter of my dispersed ones, will bring my offering.
translation:
  language: ru
  text: Из-за рек Куша[a] те, кто взывает ко Мне[b], — дочь рассеянных Моих[c] — принесут Моё приношение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Куш — древняя область к югу от Египта; её не следует полностью отождествлять с современной Эфиопией.
    reason: cultural_note
  - marker: b
    text: 'Или: «мои молящиеся»; возможно также: «мои поклоняющиеся». Еврейское слово обозначает тех, кто обращается с мольбой, а в более широком смысле может относиться к поклоняющимся.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «дочь рассеянных Моих». Еврейское выражение сжато и может служить поэтическим названием рассеянной общины; его синтаксическая связь не вполне ясна.'
    reason: alternative_reading
lexical_decisions:
- source_word: מֵעֵבֶר
  choice: из-за
  rationale: В сочетании с географическим ориентиром передаёт происхождение с той стороны, из-за обозначенной границы; по-русски «из-за рек» естественно и сохраняет пространственный образ.
- source_word: לְנַהֲרֵי כוּשׁ
  choice: рек Куша
  rationale: Множественное נַהֲרֵי передано словом «реки», а древний топоним כוּשׁ сохранён как «Куш», без неточного отождествления с современной Эфиопией.
- source_word: עֲתָרַי
  choice: поклоняющиеся Мне
  rationale: Слово связано с мольбой и обращением к Богу; в данном контексте обозначение поклоняющихся передаёт более широкий религиозный смысл, а конкретный оттенок моления отмечен в сноске.
- source_word: בַּת פוּצַי
  choice: дочь рассеянных Моих
  rationale: Сохранён сжатый поэтический образ коллективной «дочери» и притяжательный суффикс; необычный порядок слов помогает не превращать неоднозначную конструкцию в однозначный пересказ.
- source_word: יוֹבִלוּן
  choice: принесут
  rationale: Hiphil глагола יבל с даром в качестве дополнения естественно передаётся русским «принесут».
- source_word: מִנְחָתִי
  choice: Мне дар
  rationale: מִנְחָה может обозначать как приношение, так и дань или дар. «Дар» сохраняет широту значения; местоименная принадлежность естественно выражена адресатом «Мне».
theological_decisions:
- issue: Синтаксис עֲתָרַי בַּת פוּצַי
  choice: Оборот «дочь рассеянных Моих» представлен как поэтическое приложение к «поклоняющиеся Мне».
  alternative: Понимать выражение как обозначение двух групп либо свободно передать «Мой рассеянный народ».
  rationale: Еврейская последовательность предельно сжата и допускает разные синтаксические связи. Пунктуация с тире сохраняет приложение и коллективный образ, не устраняя неоднозначность пересказом.
- issue: Значение עֲתָרַי
  choice: поклоняющиеся Мне
  alternative: молящие Меня; взывающие ко Мне
  rationale: Корень указывает на мольбу или прошение, но в контексте собрания народов и принесения дара может обозначать людей, обращающихся к Богу в поклонении. Более узкое значение сохранено в сноске.
- issue: Характер מִנְחָה
  choice: дар
  alternative: приношение; дань
  rationale: Текст не требует выбирать исключительно культовую жертву или политическую дань; нейтральное «дар» сохраняет смысловую широту.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической интонацией. Инверсия «рассеянных Моих» намеренно сохраняет достоинство и компактность образа; прописные формы местоимения относятся к Богу. Тире обозначают приложение, не разрешая насильно трудный синтаксис.
