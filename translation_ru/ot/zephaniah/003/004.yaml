  text: נְבִיאֶ֨י/הָ֙ פֹּֽחֲזִ֔ים אַנְשֵׁ֖י בֹּֽגְד֑וֹת כֹּהֲנֶ֨י/הָ֙ חִלְּלוּ קֹ֔דֶשׁ חָמְס֖וּ תּוֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/004.yaml
  text: Her prophets are reckless[a], treacherous men; her priests have profaned the holy[b]; they have done violence to the law.
translation:
  language: ru
  text: Её пророки безрассудны, вероломные люди; её священники осквернили святое[a], совершили насилие над Законом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилище» или «святыни».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «наставление» (евр. тора).'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבִיאֶיהָ
  choice: её пророки
  rationale: Форма множественного числа с суффиксом 3-го лица женского рода относится к олицетворённому городу; естественный русский эквивалент сохраняет принадлежность.
- source_word: פֹּחֲזִים
  choice: безрассудны
  rationale: Слово характеризует необузданное, опрометчивое и нравственно неустойчивое поведение; «безрассудны» звучит естественно и сохраняет оценочную силу.
- source_word: אַנְשֵׁי בֹּגְדוֹת
  choice: вероломные люди
  rationale: Буквально «люди предательств»; русская формулировка передаёт устойчивую склонность к предательству и сохраняет явное указание на людей.
- source_word: כֹּהֲנֶיהָ
  choice: её священники
  rationale: Конструктивная форма множественного числа с суффиксом 3-го лица женского рода параллельна «её пророкам».
- source_word: חִלְּלוּ
  choice: осквернили
  rationale: Пиэль от חלל в культовом контексте означает лишить святости, осквернить или профанировать; «осквернили» — ясный и достойный современный эквивалент.
- source_word: קֹדֶשׁ
  choice: святыню
  rationale: Существительное допускает значения «святое», «священные предметы» и «святилище». «Святыню» сохраняет культовый смысл, не отождествляя объект однозначно со зданием храма; альтернативы указаны в сноске.
- source_word: חָמְסוּ
  choice: извратили
  rationale: Глагол выражает насильственное нарушение или неправедное обращение. С Торой как объектом «извратили» естественно передаёт злоупотребление ею, хотя несколько ослабляет образ насилия.
- source_word: תּוֹרָה
  choice: Закон
  rationale: В контексте обвинения священников слово обозначает данное Богом установление и наставление. «Закон» сохраняет традиционно понятный заветный смысл, а более широкое «наставление» отмечено в сноске.
theological_decisions:
- issue: Объём значения קֹדֶשׁ при обвинении священников
  choice: «святыню» как широкое обозначение священного
  alternative: «святилище» или «святыни / священные предметы»
  rationale: Еврейский текст не уточняет, идёт ли речь именно о храмовом здании, поэтому перевод не сужает значение до одного референта.
- issue: Смысл תּוֹרָה
  choice: «Закон»
  alternative: «наставление»
  rationale: Контекст допускает как заветный Закон, так и священное наставление; основной вариант передаёт институциональный смысл, а сноска сохраняет более широкую возможность.
- issue: Образ насилия в חָמְסוּ תּוֹרָה
  choice: «извратили Закон»
  alternative: «совершили насилие над Законом» / «нарушили Закон»
  rationale: Выбран естественный русский оборот, выражающий неправомерное обращение с Законом; буквальный образ насилия возможен, но по-русски звучит тяжеловеснее.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксический параллелизм двух обвинений сохранён; архаичные и узкоконфессиональные формулы избегаются.
