  text: שְׁאֵרִ֨ית יִשְׂרָאֵ֜ל לֹֽא יַעֲשׂ֤וּ עַוְלָה֙ וְ/לֹא יְדַבְּר֣וּ כָזָ֔ב וְ/לֹֽא יִמָּצֵ֥א בְּ/פִי/הֶ֖ם לְשׁ֣וֹן תַּרְמִ֑ית כִּֽי הֵ֛מָּה יִרְע֥וּ וְ/רָבְצ֖וּ וְ/אֵ֥ין מַחֲרִֽיד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/013.yaml
  text: The remnant of Israel will do no wrong and speak no lies[a], and no deceitful tongue will be found in their mouth; for they will graze and lie down[b], with no one to make them afraid.
translation:
  language: ru
  text: Остаток Израиля не будет творить неправды и говорить ложь; и не найдётся в их устах лживой речи. Ибо они будут пастись и лежать[a], и никто не устрашит их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образ пасущихся и лежащих животных выражает безопасность и покой.
    reason: cultural_note
lexical_decisions:
- source_word: שְׁאֵרִית יִשְׂרָאֵל
  choice: Остаток Израиля
  rationale: «Остаток» естественно передаёт уцелевшую, сохранённую часть народа и сохраняет устойчивый пророческий смысл выражения.
- source_word: יַעֲשׂוּ עַוְלָה
  choice: не будет творить неправды
  rationale: עַוְלָה охватывает неправду, несправедливость и беззаконие; «творить неправду» сохраняет широкий нравственный смысл и соответствует собирательному подлежащему в единственном числе.
- source_word: יְדַבְּרוּ כָזָב
  choice: говорить ложь
  rationale: Прямо и естественно передаёт значение כָזָב — «ложь, неправда».
- source_word: יִמָּצֵא בְּפִיהֶם לְשׁוֹן תַּרְמִית
  choice: не найдётся в их устах языка коварного
  rationale: Сохранён конкретный образ языка как орудия обманной речи; инверсия придаёт фразе достойное литературное звучание, не затемняя смысла.
- source_word: יִרְעוּ
  choice: будут пастись
  rationale: Глагол обозначает пастьбу животных и вместе с последующим רבץ создаёт образ безопасно живущего стада.
- source_word: וְרָבְצוּ
  choice: и покоиться
  rationale: רבץ буквально означает «ложиться» о животных; «покоиться» звучит естественно по-русски и в данном параллелизме сохраняет картину стада, лежащего без страха.
- source_word: וְאֵין מַחֲרִיד
  choice: и никто не устрашит их
  rationale: Причастие מַחֲרִיד обозначает того, кто приводит в страх; формулировка кратка и сохраняет личного деятеля, подразумеваемого еврейским выражением.
theological_decisions:
- issue: Пастушеский образ в заключительной части
  choice: Сохранены слова «будут пастись и покоиться», а образ стада пояснён в сноске.
  alternative: «будут жить спокойно и безопасно»
  rationale: Еврейский текст рисует конкретную пасторальную картину, выражающую мир и безопасность; её не следует заменять отвлечённым истолкованием.
- issue: Терминология остатка
  choice: שְׁאֵרִית передано словом «остаток».
  alternative: «уцелевшие»
  rationale: «Остаток» сохраняет форму собирательного обозначения и характерный для пророческих книг смысл сохранённой части Израиля без дополнительных догматических уточнений.
- issue: Связь заключительной части с предыдущей
  choice: כִּי не выражено отдельным союзом; переход оформлен новым предложением.
  alternative: «ибо они будут пастись…»
  rationale: В данном контексте כִּי допускает пояснительно-утвердительный оттенок. Русское «ибо» могло бы создать неясную причинную зависимость между нравственной чистотой и безопасной пастьбой; бессоюзный переход сохраняет смысловую связь, не разрешая её излишне жёстко.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной пророческой интонацией. Собирательное выражение «остаток Израиля» согласовано с глаголами в единственном числе; пастушеская образность оригинала сохранена.
