  text: ה֥וֹי מֹרְאָ֖ה וְ/נִגְאָלָ֑ה הָ/עִ֖יר הַ/יּוֹנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/001.yaml
  text: Woe to the rebellious and defiled city[b][a], the oppressing one!
translation:
  language: ru
  text: Горе непокорному и осквернённому городу[a], угнетающему[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и загрязнённому».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское הַיּוֹנָה можно буквально понять как «голубь», однако в данном контексте это слово обычно понимают как характеристику города, который угнетает других.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹי
  choice: Горе
  rationale: Передаёт формулу пророческого обличения и возвещения суда, сохраняя её силу и торжественный тон.
- source_word: מֹרְאָה
  choice: непокорному
  rationale: Форма связана с корнем מרה, обозначающим неповиновение и мятежность; «непокорному» естественно характеризует город, отвергающий исправление.
- source_word: וְנִגְאָלָה
  choice: и осквернённому
  rationale: В данном контексте форма понимается как указание на нравственное и культовое осквернение; обычное для другого омонимичного корня значение «искупленный» здесь контекстуально невозможно.
- source_word: הָעִיר
  choice: городу
  rationale: Прямое и естественное соответствие слову עִיר; дательный падеж обусловлен русской конструкцией «горе кому».
- source_word: הַיּוֹנָה
  choice: угнетающему
  rationale: В обличительном параллелизме слово традиционно понимается как характеристика города, который притесняет других. Причастие согласовано с «городу» и сохраняет действующее значение — «тот, кто угнетает».
theological_decisions:
- issue: Неоднозначность הַיּוֹנָה
  choice: В основном тексте передано как «угнетающему».
  alternative: «голубю» / «городу-голубю»
  rationale: Контекст пророческого обличения и ряд отрицательных характеристик поддерживают значение, связанное с угнетением, однако буквальное прочтение «голубь» реально возможно и потому сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной интонацией пророческого обличения. Сохранена цепь согласованных характеристик города и отмечена подлинная лексическая неоднозначность заключительного слова.
