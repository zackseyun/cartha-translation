  source_fidelity: Русский текст точно передаёт четыре отрицательных высказывания еврейского оригинала и сохраняет женский род единственного числа, не раскрывая подразумеваемый в контексте город. «Не слушалась голоса» адекватно отражает שָׁמְעָה בְּקוֹל в значении послушного внимания; «не принимала вразумления» передаёт לָקְחָה מוּסָר; «не полагалась на Яхве» — בַּיהוָה לֹא בָטָחָה; «не приближалась к своему Богу» сохраняет широту אֶל־אֱלֹהֶיהָ לֹא קָרֵבָה.
