source:
  edition: WLC
  text: לֹ֤א שָֽׁמְעָה֙ בְּ/ק֔וֹל לֹ֥א לָקְחָ֖ה מוּסָ֑ר בַּֽ/יהוָה֙ לֹ֣א בָטָ֔חָה אֶל אֱלֹהֶ֖י/הָ לֹ֥א קָרֵֽבָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/002.yaml
  text: She did not obey the voice[a]; she did not accept correction. She did not trust in Yahweh[d][c][b]; she did not draw near to her God.
translation:
  language: ru
  text: Она не слушалась голоса[a], не принимала вразумления[b], не полагалась на Яхве[c], не приближалась к своему Богу[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не внимала голосу». Оборот может подчёркивать слушание, ведущее к послушанию.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не принимала наставления»; также возможно: «не принимала исправления».'
    reason: lexical_alternative
  - marker: c
    text: В еврейском тексте стоит יהוה (ЙХВХ) — личное имя Бога, здесь переданное как «Яхве».
    reason: alternative_reading
  - marker: d
    text: 'Или: «не подходила к своему Богу». «Приближаться» может иметь как смысл отношений с Богом, так и оттенок приближения к Нему в поклонении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעָה בְּקוֹל
  choice: не слушалась голоса
  rationale: Сочетание שׁמע с בְּקוֹל означает не просто слышать, а слушать с готовностью повиноваться. Русское «не слушалась» естественно передаёт этот смысл, а слово «голоса» сохраняет не названного прямо носителя речи.
- source_word: לָקְחָה מוּסָר
  choice: не принимала вразумления
  rationale: Буквально «не принимала наставления/дисциплины». «Вразумление» в данном пророческом обличении охватывает исправляющее наставление и остаётся понятным современному читателю.
- source_word: בַּיהוָה לֹא בָטָחָה
  choice: не полагалась на Яхве
  rationale: בטח выражает доверие и уверенную опору; «полагалась на» естественно сочетается в русском языке с личным объектом доверия. Имя יהוה передано как «Яхве».
- source_word: אֶל אֱלֹהֶיהָ לֹא קָרֵבָה
  choice: не приближалась к своему Богу
  rationale: קרב может обозначать приближение к Богу как в отношениях, так и в поклонении. «Приближалась» сохраняет оба оттенка. Притяжательное «своему» естественно передаёт אֱלֹהֶיהָ и согласуется с возвратной перспективой подлежащего.
theological_decisions:
- issue: Референт подлежащего женского рода единственного числа
  choice: Сохранить местоимение «она», не называя Иерусалим прямо.
  alternative: «Иерусалим» или «этот город».
  rationale: Формы еврейских глаголов имеют женский род и отсылают к олицетворённому городу из контекста. «Она» сохраняет литературное олицетворение и не добавляет отсутствующего в стихе существительного.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя יהוה. Передача «Яхве» сохраняет его как имя, не заменяя титулом и не внося конфессиональной интерпретации.
- issue: Характер приближения к Богу
  choice: Не уточнять, идёт ли речь преимущественно о поклонении или об отношениях с Богом.
  alternative: «Не приходила поклоняться своему Богу».
  rationale: Глагол קרב допускает как культовый, так и более широкий relationalный смысл; буквальное «приближалась» сохраняет эту намеренную широту.
translation_notes:
  register: Современный литературный русский язык с кратким четырёхчастным ритмом еврейского обличения. Повтор «не» сохранён во всех четырёх звеньях. Лексика достойная и понятная, без намеренной архаизации; богословская неоднозначность последнего глагола сохранена.
