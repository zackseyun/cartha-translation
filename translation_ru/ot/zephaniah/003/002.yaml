  terminology: «Яхве» последовательно передаёт יהוה как личное имя. «Бог» в единственном числе верно передаёт אֱלֹהֶיהָ в данном контексте. Примечания a, b и d корректно обозначают реальные лексические варианты и не снимают сохранённую в основном тексте неоднозначность последнего глагола.
