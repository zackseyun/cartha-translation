  source_fidelity: 'Перевод в целом точно передаёт еврейский текст: женские формы обращения соответствуют олицетворённому Сиону; «восставала против Меня» верно отражает פשע ב־; «из твоей среды» и «на Моей святой горе» точны. Однако «ликует в твоей гордыне» неестественно по-русски и создаёт неясный образ, которого еврейская конструкция сама по себе не требует. Конструкцию עַלִּיזֵי גַּאֲוָתֵךְ лучше передать как характеристику людей — горделиво ликующих — а буквальную связь со «твоей гордыней» сохранить в сноске.'
