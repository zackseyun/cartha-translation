  text: בַּ/יּ֣וֹם הַ/ה֗וּא לֹ֤א תֵב֨וֹשִׁי֙ מִ/כֹּ֣ל עֲלִילֹתַ֔יִ/ךְ אֲשֶׁ֥ר פָּשַׁ֖עַתְּ בִּ֑/י כִּי אָ֣ז אָסִ֣יר מִ/קִּרְבֵּ֗/ךְ עַלִּיזֵי֙ גַּאֲוָתֵ֔/ךְ וְ/לֹֽא תוֹסִ֧פִי לְ/גָבְהָ֛ה ע֖וֹד בְּ/הַ֥ר קָדְשִֽׁ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/011.yaml
  text: On that day you will not be put to shame because of all your deeds by which you rebelled against me[a], for then I will remove from your midst those who exult in your pride[b], and you will no longer be haughty on my holy mountain.
translation:
  language: ru
  text: В тот день ты не будешь стыдиться из-за всех своих дел, которыми восставала против Меня[a], ибо тогда Я удалю из твоей среды тех, кто горделиво ликует[b], и ты больше не будешь превозноситься на Моей святой горе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будешь посрамлена». Еврейский глагол может обозначать как переживание стыда, так и состояние позора или посрамления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ликующих твоей гордыни»; также возможно: «тех, кто ликует в твоей гордыне». Еврейская конструкция характеризует ликующих как связанных с гордыней, но точный характер этой связи допускает разные способы передачи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵבֹושִׁי
  choice: ты не будешь стыдиться
  rationale: Форма Qal глагола בושׁ обозначает состояние стыда или посрамления. Возвратное «стыдиться» непосредственно передаёт еврейскую форму, а возможный результативный оттенок отмечен в сноске.
- source_word: מִכֹּל עֲלִילֹתַיִךְ
  choice: из-за всех своих дел
  rationale: После בושׁ предлог מִן естественно передаётся причинным «из-за»; «дела» сохраняет широту значения עֲלִילָה, а их греховный характер раскрывает следующая часть фразы.
- source_word: פָּשַׁעַתְּ בִּי
  choice: которыми восставала против Меня
  rationale: פשע означает не просто грех вообще, а мятеж, сознательное нарушение верности; «восставала против» сохраняет эту усиленную, реляционную окраску.
- source_word: אָסִיר
  choice: Я удалю
  rationale: Каузативная форма передаёт устранение людей из общины; «удалю» звучит естественно и сохраняет прямое действие Бога.
- source_word: מִקִּרְבֵּךְ
  choice: из твоей среды
  rationale: Устойчивое выражение обозначает удаление из города или сообщества, представленного как женское лицо.
- source_word: עַלִּיזֵי גַּאֲוָתֵךְ
  choice: тех, кто ликует в твоей гордыне
  rationale: עַלִּיזֵי обозначает ликующих, а גַּאֲוָה в данном контексте имеет отрицательный смысл гордыни. Формулировка сохраняет конструктивную связь с суффиксом второго лица, не сводя её безоговорочно к одному толкованию.
- source_word: וְלֹא תוֹסִפִי לְגָבְהָה עוֹד
  choice: и ты больше не будешь превозноситься
  rationale: Сочетание «не продолжишь/не станешь вновь» с עוֹד естественно передаётся как «больше не будешь», а גבה здесь выражает высокомерное самовозвышение.
- source_word: בְּהַר קָדְשִׁי
  choice: на Моей святой горе
  rationale: Речь идёт о Сионе как святой горе Бога; русский предлог «на» естественно передаёт местное значение.
theological_decisions:
- issue: Означает ли начальное обещание отсутствие чувства стыда или прекращение посрамления за прежний мятеж после Божьего очищения?
  choice: Сохранено прямое «не будешь стыдиться», при этом контекст связывает прекращение стыда с последующим очищающим действием Бога, а не с отрицанием вины.
  alternative: «Не будешь посрамлена» — результативное прочтение, подчёркивающее снятие позора.
  rationale: Еврейский текст прямо называет прежние дела восстанием против Бога, а затем объясняет перемену удалением горделивых. Поэтому перевод сохраняет напряжение между действительной виной и обещанным восстановлением.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным пророческим звучанием. Женский род обращений сохранён, поскольку адресатом выступает олицетворённый Сион/Иерусалим. Местоимения, относящиеся к Богу, даны с прописной буквы согласно распространённой русской библейской традиции.
