base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/015.yaml
  text: Yahweh has taken away your judgments[a]; he has turned away your enemy. The King of Israel, Yahweh, is in your midst[b]; you will fear evil no more.
translation:
  language: ru
  text: Яхве[a] снял с тебя приговоры[b], отвёл твоего врага. Царь Израиля, Яхве, среди тебя; ты больше не будешь бояться беды[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте стоит личное имя Бога — יהוה (Яхве).
    reason: textual_cultural_clarification
  - marker: b
    text: 'Буквально: «твои приговоры»; в контексте — приговоры против тебя или назначенное тебе наказание.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «зла», «бедствия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: отменил
  rationale: Каузативная форма глагола סור означает «устранил, удалил». В сочетании с судебными решениями естественное русское выражение «отменил приговоры» точно передаёт результат совершённого Божьего действия.
- source_word: יְהוָה
  choice: Господь
  rationale: В современном русском библейском регистре традиционная передача тетраграмматона титулом «Господь» наиболее узнаваема и естественна; примечание сообщает вероятное произношение личного имени.
- source_word: מִשְׁפָּטַיִךְ
  choice: вынесенные тебе приговоры
  rationale: В контексте восстановления Сиона слово מִשְׁפָּט обозначает неблагоприятные судебные решения или приговоры, направленные против него. Такая формулировка яснее буквального «твои суды», которое по-русски двусмысленно.
- source_word: פִּנָּה
  choice: прогнал
  rationale: Глагол означает «убрал, устранил, отвёл». При прямом дополнении «твой враг» русское «прогнал» естественно выражает удаление врага, не уточняя способ.
- source_word: אֹיְבֵךְ
  choice: твоего врага
  rationale: Сохранено единственное число еврейского текста; оно может иметь собирательный смысл.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: Царь Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции; прописная буква уместна, поскольку титул относится к Богу.
- source_word: בְּקִרְבֵּךְ
  choice: посреди тебя
  rationale: Выражение сохраняет образ присутствия Бога внутри общины/города и обращение к Сиону как к лицу женского рода.
- source_word: לֹא תִירְאִי
  choice: больше не будешь бояться
  rationale: Имперфект второго лица женского рода после провозглашения Божьего присутствия передан как уверенное будущее, без добавления повелительного или разрешительного оттенка.
- source_word: רָע
  choice: беды
  rationale: В оракуле восстановления רָע прежде всего обозначает переживаемое бедствие или несчастье. «Беда» естественна по-русски, а примечание сохраняет более широкую возможность «зло».
- source_word: עוֹד
  choice: больше не
  rationale: 'При отрицании עוֹד идиоматически означает прекращение состояния: «больше не, впредь не».'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Господь с примечанием о личном имени
  alternative: Яхве
  rationale: Основной текст сохраняет достоинство и узнаваемость современного русского библейского стиля, а примечание не скрывает, что в еврейском тексте стоит личное имя Бога.
- issue: Смысл מִשְׁפָּטַיִךְ в пророчестве о спасении
  choice: вынесенные тебе приговоры
  alternative: твои суды; твоё наказание
  rationale: Контекст указывает на неблагоприятные судебные решения против Сиона. Перевод делает направленность приговоров ясной, но не сужает множественное число до одного наказания.
- issue: Смысл רָע в заключительной строке
  choice: беда
  alternative: зло; бедствие
  rationale: Контекст изгнания врага и восстановления делает бедствие наиболее вероятным значением, однако примечание сохраняет присущую слову семантическую широту и не исключает буквальное «зло».
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Женский род обращения сохранён как олицетворение Сиона/Иерусалима. Синтаксис сделан плавным, без архаизмов «суды твои» и «в среде тебя».
