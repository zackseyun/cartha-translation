  yaml_path: translation/ot/zephaniah/003/018.yaml
  text: I have gathered those grieving over the appointed festival from you[a]; they were a reproach upon her[c][b], a burden.
translation:
  language: ru
  text: Скорбящих о праздничном собрании Я соберу из тебя[a]. Они были для неё[b] бременем, поношением[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «угнетённых, удалённых от праздничного собрания». Еврейская фраза трудна: речь может идти как о скорбящих из-за утраты праздника, так и о людях, отстранённых от праздничного собрания. Форма «соберу» может быть переведена также «собрал»; в пророческом контексте возможен и перевод будущим временем.'
    reason: alternative_reading
  - marker: b
    text: «Для неё» — вероятно, для Сиона или Иерусалима.
    reason: cross_reference
  - marker: c
    text: 'Заключительная фраза синтаксически трудна. Возможен также смысл: «лежавшее на ней поношение было для них бременем».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: נוּגֵי
  choice: скорбящих
  rationale: Передаёт субстантивированное обозначение людей, пребывающих в скорби или угнетении, не уточняя сверх текста причину их состояния.
- source_word: מִמּוֹעֵד
  choice: о праздничном собрании
  rationale: מוֹעֵד здесь естественно понимать как установленный праздник или праздничное собрание; предлог допускает несколько смысловых связей, поэтому неоднозначность отмечена в сноске.
- source_word: אָסַפְתִּי
  choice: Я соберу
  rationale: Хотя форма qatal формально перфективна, в пророческом контексте восстановления она может иметь значение уверенно предстоящего действия; альтернативы сохранены в сноске.
- source_word: מִמֵּךְ
  choice: из тебя
  rationale: Прямо передаёт предлог и женский суффикс второго лица, обращённый, вероятно, к Сиону или Иерусалиму.
- source_word: הָיוּ
  choice: они были
  rationale: Простая прошедшая связка соответствует форме еврейского глагола.
- source_word: מַשְׂאֵת
  choice: бременем
  rationale: В данном контексте существительное обозначает тяжесть или ношу, а не пророчество.
- source_word: עָלֶיהָ
  choice: для неё
  rationale: По-русски естественно сочетается с «бременем», при этом женский референт сохраняется и поясняется в сноске.
- source_word: חֶרְפָּה
  choice: позора
  rationale: Передаёт общественный стыд, поношение и бесчестье; родительное сочетание «бремя позора» сохраняет сжатость трудной еврейской фразы.
theological_decisions:
- issue: Синтаксическая неоднозначность и референты стиха
  choice: Господь соберёт из Сиона людей, скорбящих о праздничном собрании; они были для него бременем позора.
  alternative: Возможно, речь идёт об удалённых от праздничного собрания или угнетённых из-за него; заключительная фраза может также означать, что лежавшее на Сионе поношение было для них бременем.
  rationale: Еврейский текст крайне сжат и синтаксически труден. Основной текст сохраняет главные элементы и порядок мысли, а сноски не позволяют превращать вероятное толкование в несомненное.
translation_notes:
  register: Современный литературный русский язык с достойным пророческим звучанием. Сохранены женский образ города, сжатость исходника и его подлинная синтаксическая неоднозначность; тяжеловесные церковнославянизмы не используются.
