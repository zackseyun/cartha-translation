source:
  edition: WLC
  text: יְהוָ֧ה אֱלֹהַ֛יִ/ךְ בְּ/קִרְבֵּ֖/ך גִּבּ֣וֹר יוֹשִׁ֑יעַ יָשִׂ֨ישׂ עָלַ֜יִ/ךְ בְּ/שִׂמְחָ֗ה יַחֲרִישׁ֙ בְּ/אַ֣הֲבָת֔/וֹ יָגִ֥יל עָלַ֖יִ/ךְ בְּ/רִנָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/017.yaml
  text: Yahweh your God is in your midst[a], a mighty one who saves; he will rejoice over you with gladness; he will be quiet in his love; he will exult over you with singing.
translation:
  language: ru
  text: Яхве, твой Бог, посреди тебя — могучий, который спасает. Он с радостью будет радоваться тебе, будет безмолвен в своей любви[a] и ликовать о тебе с песней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «успокоит тебя своей любовью». Другое, менее вероятное толкование: «обновит тебя в своей любви».'
    reason: Альтернативные толкования неоднозначного выражения יַחֲרִישׁ בְּאַהֲבָתוֹ.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: אֱלֹהַיִךְ
  choice: твой Бог
  rationale: Суффикс второго лица женского рода единственного числа обращён к Сиону как к единому целому; в русском грамматический род адресата в притяжательной форме не выражен.
- source_word: בְּקִרְבֵּךְ
  choice: посреди тебя
  rationale: Сохраняет пространственный образ пребывания Бога в самом центре Сиона и звучит естественно в пророческой речи.
- source_word: גִּבּוֹר
  choice: могучий
  rationale: Передаёт силу и доблесть, не сужая значение до явно военного образа «воин».
- source_word: יוֹשִׁיעַ
  choice: который спасает
  rationale: Сохраняет глагольное значение и связь с определением «могучий»; форма несовершенного вида допускает характеристику постоянно присущего действия.
- source_word: יָשִׂישׂ עָלַיִךְ בְּשִׂמְחָה
  choice: с радостью будет радоваться тебе
  rationale: Передаёт усиленное выражение божественной радости и направленность этой радости на Сион, не превращая её в радость «за» чьи-либо достижения.
- source_word: יַחֲרִישׁ בְּאַהֲבָתוֹ
  choice: будет безмолвен в своей любви
  rationale: Наиболее прямо передаёт непереходное значение «молчать, быть безмолвным» и не вводит отсутствующее в еврейском тексте дополнение.
- source_word: יָגִיל עָלַיִךְ בְּרִנָּה
  choice: ликовать о тебе с песней
  rationale: «Ликовать» отличает этот глагол от предыдущего обозначения радости, а «с песней» передаёт контекстуальное значение радостного звучания רִנָּה.
theological_decisions:
- issue: Значение יַחֲרִישׁ בְּאַהֲבָתוֹ
  choice: будет безмолвен в своей любви
  alternative: успокоит тебя своей любовью; обновит тебя в своей любви
  rationale: В масоретском тексте у глагола нет выраженного дополнения «тебя», поэтому основной текст сохраняет наиболее прямое непереходное прочтение и присущую ему богословскую напряжённость. Известные толкования приведены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим ритмом. Формулировка сохраняет повтор и параллелизм еврейского текста, а также не сглаживает необычный образ безмолвия Бога в любви.
