    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֶיהָ
  choice: её правители
  rationale: שַׂר обозначает князя, начальника, правителя или высокопоставленного должностного лица. В контексте обличения городского руководства слово «правители» ясно передаёт их властное положение, не подразумевая непременно царских сыновей.
- source_word: בְקִרְבָּהּ
  choice: среди неё
  rationale: Буквально выражение означает «в её среде, внутри неё» и указывает на правителей, действующих в самом городе. «Среди неё» сохраняет олицетворение города и звучит естественно по-русски.
- source_word: אֲרָיוֹת שֹׁאֲגִים
  choice: рыкающие львы
  rationale: Причастие שֹׁאֲגִים передаёт продолжающееся угрожающее действие. «Рыкающие львы» сохраняет яркий образ хищной и устрашающей власти.
- source_word: שֹׁפְטֶיהָ
  choice: её судьи
  rationale: Прямое соответствие названию представителей судебной власти.
- source_word: זְאֵבֵי עֶרֶב
  choice: вечерние волки
  rationale: Сочетание буквально означает «волки вечера» и рисует хищников, выходящих на охоту к вечеру. Краткое выражение «вечерние волки» сохраняет метафору исходного текста.
- source_word: לֹא גָרְמוּ לַבֹּקֶר
  choice: ничего не оставляющие до утра
  rationale: Трудное выражение связано с костью и обгладыванием и изображает полное, ненасытное пожирание добычи. В основном тексте передан общий смысл, а более буквальная возможность отмечена в сноске.
