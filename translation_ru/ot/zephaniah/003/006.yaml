source:
  edition: WLC
  text: הִכְרַ֣תִּי גוֹיִ֗ם נָשַׁ֨מּוּ֙ פִּנּוֹתָ֔/ם הֶחֱרַ֥בְתִּי חֽוּצוֹתָ֖/ם מִ/בְּלִ֣י עוֹבֵ֑ר נִצְדּ֧וּ עָרֵי/הֶ֛ם מִ/בְּלִי אִ֖ישׁ מֵ/אֵ֥ין יוֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/003/006.yaml
  text: I have cut off nations[a]; their corner towers are laid waste. I have made their streets desolate, with no one passing through. Their cities are devastated, without a man[c][b], with no inhabitant.
translation:
  language: ru
  text: 'Я истребил народы;


    их угловые башни[a] разрушены.


    Я опустошил их улицы[b] —


    никто по ним не проходит.


    Их города разорены:


    нет ни человека[c],


    ни единого жителя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их углы»; вероятно, имеются в виду угловые укрепления или башни.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их площади» или «их открытые места».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «без человека»; здесь это выражение означает полное отсутствие людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכְרַתִּי
  choice: Я истребил
  rationale: Порода hифиль глагола כרת означает «отсечь, устранить, истребить». В речи о Божьем суде над народами «истребил» естественно передаёт результат действия, не добавляя способа уничтожения.
- source_word: גוֹיִם
  choice: народы
  rationale: Обычное обозначение народов или политических общностей; контекст говорит о народах, подвергшихся суду.
- source_word: נָשַׁמּוּ
  choice: опустели
  rationale: Глагол שמם выражает запустение и опустошённость. Здесь результативная форма описывает состояние городских укреплений после разорения.
- source_word: פִּנּוֹתָם
  choice: их угловые башни
  rationale: Буквально «их углы»; в контексте разрушения городов, вероятно, имеются в виду угловые оборонительные сооружения или башни. Неопределённость сохранена в сноске.
- source_word: הֶחֱרַבְתִּי
  choice: Я опустошил
  rationale: Hифиль глагола חרב означает привести в запустение, разорить. При дополнении «улицы» глагол «опустошил» естественно передаёт образ безлюдного городского пространства.
- source_word: חוּצוֹתָם
  choice: их улицы
  rationale: Множественное число חוּץ может обозначать улицы, площади или открытые общественные места города. «Улицы» ясно согласуется с упоминанием проходящих по ним людей; варианты отмечены в сноске.
- source_word: מִבְּלִי עוֹבֵר
  choice: никто по ним не проходит
  rationale: Передаёт отсутствие проходящего человека и продолжающееся состояние полного запустения; местоимение «по ним» естественно связывает фразу с улицами.
- source_word: נִצְדּוּ
  choice: разорены
  rationale: Редкий и трудный глагол в данном параллелизме явно описывает разрушенное состояние городов. «Разорены» сохраняет общий смысл, не создавая ложной лексической точности.
- source_word: עָרֵיהֶם
  choice: их города
  rationale: Стандартное соответствие для עִיר в контексте суда над народами.
- source_word: מִבְּלִי אִישׁ
  choice: нет ни человека
  rationale: Хотя אִישׁ имеет форму мужского рода и буквально может означать «мужчина», в формуле полного обезлюдения по-русски естественно «ни человека». Буквальная форма и её идиоматический смысл указаны в сноске.
- source_word: מֵאֵין יוֹשֵׁב
  choice: ни единого жителя
  rationale: Фраза усиливает картину полного обезлюдения. «Ни единого жителя» сохраняет эмфатическое повторение и звучит естественно в современном русском языке.
theological_decisions:
- issue: Родовое значение אִישׁ в формуле полного обезлюдения
  choice: нет ни человека
  alternative: без мужчины / нет ни одного мужчины
  rationale: В данном параллелизме речь идёт не об отсутствии только мужчин, а о полном отсутствии населения, что подтверждает следующая фраза «ни единого жителя». Русское «ни человека» точно передаёт идиому; грамматическая и буквальная особенность еврейского текста сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткими параллельными строками, соответствующими ритму пророческой речи. Прошедшее время передаёт еврейские перфекты в прямой речи Бога. Лексика торжественная, но понятная; трудные городские термины и идиома обезлюдения пояснены сносками.
