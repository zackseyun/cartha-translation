  text: וּ/פָקַדְתִּ֗י עַ֧ל כָּל הַ/דּוֹלֵ֛ג עַל הַ/מִּפְתָּ֖ן בַּ/יּ֣וֹם הַ/ה֑וּא הַֽ/מְמַלְאִ֛ים בֵּ֥ית אֲדֹנֵי/הֶ֖ם חָמָ֥ס וּ/מִרְמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/009.yaml
  text: And on that day I will punish all who leap over the threshold[b][a], who fill their masters’ house with violence and deceit.
translation:
  language: ru
  text: И в тот день Я накажу всех, кто перепрыгивает через порог[a] и наполняет дом своих хозяев[b] насилием и обманом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перескакивает через порог». Возможно, речь идёт об известном обрядовом или суеверном обычае, связанном с запретом наступать на порог (ср. 1 Цар. 5:5); другие понимают эти слова образно — как описание насильственно врывающихся людей.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «дом своих господ». Некоторые переводы передают: «дом своего господина» или «дом Господа».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָקַדְתִּי
  choice: Я накажу
  rationale: В пророческом контексте суда פקד означает призвать к ответу, подвергнуть наказанию; «накажу» ясно и естественно передаёт этот смысл.
- source_word: הַדּוֹלֵג עַל הַמִּפְתָּן
  choice: кто перепрыгивает через порог
  rationale: Сохранён конкретный и выразительный образ исходного текста без попытки однозначно истолковать неясный обычай или действие.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача устойчивой пророческой формулы времени.
- source_word: הַמְמַלְאִים
  choice: и наполняет
  rationale: Причастие характеризует тех же людей их постоянными или типичными действиями; согласование в единственном числе после относительного «кто» естественно для русского языка.
- source_word: בֵּית אֲדֹנֵיהֶם
  choice: дом своих хозяев
  rationale: «Хозяев» передаёт множественную форму אֲדֹנֵיהֶם и в данном контексте естественно указывает на тех, кому служат виновные, не создавая необоснованной прямой отсылки к Богу.
- source_word: חָמָס
  choice: насилием
  rationale: Прямая передача слова, обозначающего насилие, жестокое беззаконие и притеснение.
- source_word: מִרְמָה
  choice: обманом
  rationale: Передаёт общее значение коварного обмана или мошенничества, не сужая его до одного конкретного вида проступка.
theological_decisions:
- issue: Смысл выражения «перепрыгивает через порог»
  choice: Сохранить буквальный образ в основном тексте.
  alternative: Истолковать как соблюдение суеверного или культового запрета, возможно связанного с 1 Царств 5:5, либо как образ насильственного вторжения и грабежа.
  rationale: Еврейский текст не объясняет действие однозначно; буквальная передача сохраняет заложенную в нём культурную и смысловую неопределённость.
- issue: К кому относится «дом своих хозяев»
  choice: Передать множественную форму как «своих хозяев».
  alternative: «Дом своего господина» или «дом Господа».
  rationale: Форма אֲדֹנֵיהֶם морфологически множественная и сама по себе не указывает на Бога; социальное значение соответствует упоминанию насилия и обмана.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Заглавная буква в «Я» указывает на говорящего Бога согласно русской библейской традиции. Союз «и» связывает два признака одной группы людей и делает фразу естественной, не устраняя смысловой связи исходных причастий.
