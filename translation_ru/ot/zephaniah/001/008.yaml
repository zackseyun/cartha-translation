  text: וְ/הָיָ֗ה בְּ/יוֹם֙ זֶ֣בַח יְהוָ֔ה וּ/פָקַדְתִּ֥י עַל הַ/שָּׂרִ֖ים וְ/עַל בְּנֵ֣י הַ/מֶּ֑לֶךְ וְ/עַ֥ל כָּל הַ/לֹּבְשִׁ֖ים מַלְבּ֥וּשׁ נָכְרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/008.yaml
  text: And on the day of Yahweh’s sacrifice[a], I will punish the officials, the king’s sons[c][b], and all who wear foreign clothing.
translation:
  language: ru
  text: И в день жертвы Яхве[a] Я накажу сановников[b], сыновей царя и всех, кто носит чужеземную одежду[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвоприношения Яхве». Выражение может также вызывать образ жертвенного пира, приготовленного Яхве в связи с судом (ср. Соф. 1:7).'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово можно также перевести как «князей», «правителей» или «высших должностных лиц».
    reason: lexical_alternative
  - marker: c
    text: То есть одежду, связанную с чужими народами. Выражение может подразумевать усвоение чужеземных обычаев или верность чужим силам, а не только одежду иноземного происхождения.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: И будет так
  rationale: Формула вводит будущее событие. Такой оборот сохраняет пророческую перспективу и звучит естественнее по-русски, чем буквальное «и случится».
- source_word: בְּיוֹם
  choice: в день
  rationale: Прямо передаёт обычное временное выражение и сохраняет обозначение определённого дня суда.
- source_word: זֶבַח יְהוָה
  choice: жертвы Яхве
  rationale: Сохраняет конструкцию принадлежности без сведения значения к жертвенному пиру; возможный оттенок приготовленной Яхве жертвенной трапезы отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וּפָקַדְתִּי עַל
  choice: Я накажу
  rationale: В контексте суда глагол פקד с עַל обозначает карающее взыскание; «накажу» ясно и естественно передаёт эту силу.
- source_word: הַשָּׂרִים
  choice: сановников
  rationale: Слово обозначает высокопоставленных руководителей или должностных лиц. «Сановники» подходит к царскому контексту и не смешивает их с отдельно названными сыновьями царя.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: сыновей царя
  rationale: Прямо сохраняет родственное и мужское обозначение исходного текста.
- source_word: כָּל הַלֹּבְשִׁים
  choice: всех, кто носит
  rationale: Естественная русская передача субстантивированного причастия.
- source_word: מַלְבּוּשׁ נָכְרִי
  choice: чужеземную одежду
  rationale: Передаёт одежду, связанную с чужими народами, не ограничивая выражение происхождением ткани.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте стоит личное имя Бога. Транслитерация «Яхве» сохраняет имя, тогда как «ГОСПОДЬ» заменяет его титулом; «Иегова» представляет традиционную, но менее вероятную форму произношения.
- issue: Образ «жертвы Яхве»
  choice: Сохранить буквальное и неоднозначное выражение
  alternative: жертвенный пир, приготовленный Яхве
  rationale: Контекст Соф 1:7 допускает образ жертвенной трапезы как картины суда, однако сам оборот זֶבַח יְהוָה не требует раскрывать этот образ непосредственно в тексте.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис остаётся ясным для широкого читателя; формула «И будет так» сохраняет библейскую весомость без архаизации. Неоднозначность образа жертвы вынесена в сноску, а не разрешена внутри перевода.
