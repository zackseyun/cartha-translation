base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/018.yaml
  text: Neither their silver nor their gold will be able to deliver them on the day of Yahweh’s wrath[a], and in the fire of his jealousy all the earth will be consumed; for he will make a complete, indeed sudden[c][b], end of all the inhabitants of the earth.
translation:
  language: ru
  text: Ни серебро их, ни золото их не смогут спасти их в день ярости Яхве. В огне Его ревности[b] будет поглощена вся земля[a], ибо Он совершит полное, поистине внезапное уничтожение всех жителей земли[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вся страна» и «всех жителей страны». Еврейское אֶרֶץ может означать как «землю», так и «страну»; здесь в основном тексте выбрано более широкое значение.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «в огне Его рвения». Еврейское слово קִנְאָה может означать и «ревность», и «рвение».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейское выражение трудно для однозначного истолкования. Возможны также переводы: «полное и страшное уничтожение» или «полный конец — да, ужасный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם כַּסְפָּם גַּם זְהָבָם לֹא
  choice: Ни их серебро, ни их золото не смогут
  rationale: Сочетание גַּם ... גַּם с последующим отрицанием естественно передаётся по-русски конструкцией «ни ... ни»; множественное число сказуемого согласуется с однородными подлежащими.
- source_word: יוּכַל לְהַצִּילָם
  choice: не смогут избавить их
  rationale: Передаёт выраженную конструкцией невозможность спасения от грядущего суда; «избавить» сохраняет конкретный смысл освобождения от опасности.
- source_word: בְּיוֹם עֶבְרַת יְהוָה
  choice: в день ярости Яхве
  rationale: עֶבְרָה обозначает ярость, сильный гнев; личное имя יהוה передано транслитерацией «Яхве».
- source_word: וּבְאֵשׁ קִנְאָתוֹ
  choice: В огне Его ревности
  rationale: «Ревность» сохраняет присущий קִנְאָה оттенок исключительной верности и нетерпимости к соперничеству; предложная конструкция сохраняет образ еврейского текста.
- source_word: תֵּאָכֵל
  choice: будет пожрана
  rationale: Пассивная форма и сильная метафора огня переданы буквально и выразительно.
- source_word: כָּל הָאָרֶץ
  choice: вся земля
  rationale: אֶרֶץ допускает значения «земля» и «страна»; в основном тексте выбрано более широкое значение с сохранением альтернативы в сноске.
- source_word: כָּלָה אַךְ נִבְהָלָה
  choice: конец — полный и внезапный
  rationale: Формулировка сохраняет завершённость כָּלָה, усилительную функцию אַךְ и вероятный оттенок стремительности נִבְהָלָה, не скрывая трудность выражения.
- source_word: יַעֲשֶׂה אֵת כָּל יֹשְׁבֵי הָאָרֶץ
  choice: Он положит всем жителям земли конец
  rationale: Русская идиома «положить конец» естественно передаёт смысл совершения окончательного истребления, сохраняя всех жителей как объект суда.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Объём значения הָאָרֶץ
  choice: земля — в широком смысле
  alternative: страна, то есть земля Иудеи или конкретная область
  rationale: Повторение выражения со «всеми жителями» и всеохватный язык суда поддерживают широкое прочтение, однако лексическая неоднозначность отмечена в сноске.
- issue: Значение קִנְאָה применительно к Богу
  choice: ревность
  alternative: рвение
  rationale: «Ревность» лучше сохраняет заветный и личностный оттенок исключительной преданности; «рвение» остаётся возможным лексическим прочтением.
- issue: Характер последнего суда в выражении כָּלָה אַךְ נִבְהָלָה
  choice: полный и внезапный конец
  alternative: полный и страшный конец
  rationale: Основной текст отражает вероятное значение поспешности или внезапности, а сноска сохраняет возможность понимания формы как указания на ужас.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сделан естественным для русского читателя, при этом сохранены пассивный образ пожирающего огня, личное имя Яхве и неоднозначность ключевых еврейских выражений.
