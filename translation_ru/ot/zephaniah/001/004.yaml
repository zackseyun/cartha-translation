source:
  edition: WLC
  text: וְ/נָטִ֤יתִי יָדִ/י֙ עַל יְהוּדָ֔ה וְ/עַ֖ל כָּל יוֹשְׁבֵ֣י יְרוּשָׁלִָ֑ם וְ/הִכְרַתִּ֞י מִן הַ/מָּק֤וֹם הַ/זֶּה֙ אֶת שְׁאָ֣ר הַ/בַּ֔עַל אֶת שֵׁ֥ם הַ/כְּמָרִ֖ים עִם הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/004.yaml
  text: And I will stretch out my hand against Judah and against all the inhabitants of Jerusalem[a], and I will cut off from this place the remnant of Baal, the name of the idolatrous priests along with the priests[b],
translation:
  language: ru
  text: И Я протяну Свою руку против Иудеи и против всех жителей Иерусалима; Я искореню из этого места остаток Ваала и имя[a] идольских жрецов[b] вместе со священниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть «память»: древнееврейское выражение «истребить имя» означает уничтожить так, чтобы не осталось даже памяти.'
    reason: lexical_alternative
  - marker: b
    text: «Идольские жрецы» — перевод древнееврейского слова кемарим, обозначающего служителей языческого или смешанного культа; здесь они отличаются от названных далее «священников».
    reason: cultural_note
lexical_decisions:
- source_word: וְנָטִיתִי יָדִי
  choice: И Я протяну Свою руку
  rationale: Сохраняет древнееврейский образ решительного действия Бога в суде; будущее время соответствует пророческому контексту.
- source_word: עַל יְהוּדָה וְעַל כָּל יוֹשְׁבֵי יְרוּשָׁלָם
  choice: против Иудеи и против всех жителей Иерусалима
  rationale: Предлог עַל при жесте враждебного действия имеет значение «против»; повтор предлога сохраняет выразительность оригинала.
- source_word: וְהִכְרַתִּי
  choice: Я искореню
  rationale: В породе хифиль глагол כרת обозначает устранение или уничтожение. «Искореню» естественно по-русски передаёт полное удаление, не сводя смысл только к физическому убийству.
- source_word: מִן הַמָּקוֹם הַזֶּה
  choice: из этого места
  rationale: Сохраняет указательное выражение оригинала и не уточняет сверх текста, идёт ли речь непосредственно об Иерусалиме или шире об этой земле.
- source_word: שְׁאָר הַבַּעַל
  choice: остаток Ваала
  rationale: Формально сохраняет сжатое и несколько неоднозначное выражение оригинала, которое может относиться к остаткам присутствия или почитания Ваала.
- source_word: שֵׁם הַכְּמָרִים
  choice: имя идольских жрецов
  rationale: «Имя» сохраняет древнееврейский образ полного стирания памяти, а «идольские жрецы» передаёт особый термин כְּמָרִים и отличает эту группу от כֹּהֲנִים.
- source_word: עִם הַכֹּהֲנִים
  choice: вместе со священниками
  rationale: Передаёт עִם естественным русским оборотом и сохраняет различие между идольскими жрецами и названными далее священниками.
theological_decisions:
- issue: Различие между כְּמָרִים и כֹּהֲנִים
  choice: Передать כְּמָרִים как «идольские жрецы», а כֹּהֲנִים как «священники».
  alternative: Передать оба слова как «священники» либо транслитерировать первое как «кемарим».
  rationale: Оригинал намеренно называет две группы разными словами. Выбранный перевод сохраняет противопоставление служителей идолопоклоннического культа и священников, не определяя сверх текста степень виновности или точный статус каждой группы.
- issue: Смысл выражения «имя жрецов»
  choice: Сохранить слово «имя» в основном тексте.
  alternative: Передать как «память об идольских жрецах» или «всякое упоминание об идольских жрецах».
  rationale: Буквальный образ выражает столь полное истребление, что исчезает даже имя; примечание разъясняет идиому, не заменяя её толкованием в основном тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены образ протянутой руки, сжатое выражение «остаток Ваала» и различие двух названий культовых служителей; архаизмы и конфессионально окрашенная терминология избегаются.
