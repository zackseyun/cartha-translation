base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/003.yaml
  text: I will sweep away man and beast[a]; I will sweep away the birds of the heavens and the fish of the sea, and the stumbling blocks with the wicked[d][c][b]. And I will cut off man from the face of the ground,” declares Yahweh.
translation:
  language: ru
  text: «Я смету людей и животных[a], смету птиц небесных[b] и рыб морских, и то, что служит преткновением, вместе с нечестивыми[c]. Я истреблю людей с лица земли[d], — возвещает Яхве».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человечество и животных». Еврейское слово אָדָם здесь имеет собирательное значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «птиц, летающих в небе».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «преткновения с нечестивыми». Слово может обозначать то, обо что спотыкаются, либо то, что приводит к падению; связь с «нечестивыми» в еврейском тексте выражена сжато.'
    reason: textual_ambiguity
  - marker: d
    text: 'Или: «с поверхности почвы». Выражение может намеренно перекликаться с более ранними описаниями всеобщего суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָסֵף
  choice: смету
  rationale: В контексте суда форма глагола означает не нейтральное собирание, а полное удаление. «Смету» передаёт силу и всеохватность действия, а повтор сохраняет ритм еврейского текста.
- source_word: אָדָם
  choice: людей
  rationale: Существительное употреблено собирательно и обозначает человечество. Множественное «людей» естественно звучит по-русски рядом с перечнем живых существ и не сужает смысл до одного мужчины.
- source_word: בְהֵמָה
  choice: животных
  rationale: В данном всеохватном перечне речь идёт о наземных животных как категории; «животных» здесь шире и естественнее, чем «скот».
- source_word: עוֹף הַשָּׁמַיִם
  choice: птиц небесных
  rationale: Формальная конструкция сохраняет образ неба и торжественное звучание пророческого перечня.
- source_word: דְגֵי הַיָּם
  choice: рыб морских
  rationale: Естественная русская передача еврейской сопряжённой конструкции, сохраняющая последовательность суша — небо — море.
- source_word: הַמַּכְשֵׁלוֹת
  choice: всё, что становится преткновением
  rationale: Передаёт предметы или причины, вызывающие преткновение, не уточняя без достаточных оснований, имеются ли в виду идолы, соблазны либо иные причины падения.
- source_word: אֶת הָרְשָׁעִים
  choice: вместе с нечестивыми
  rationale: Сжатая еврейская конструкция включает нечестивых в число устраняемых судом, но не требует считать их тождественными «преткновениям».
- source_word: וְהִכְרַתִּי
  choice: Я истреблю
  rationale: В контексте суда Hiphil от כרת означает окончательно устранить, уничтожить. «Истреблю» естественно передаёт эту силу по-русски.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: с лица земли
  rationale: Сохраняет еврейский образ и возможный отзвук повествований о всеобщем суде, оставаясь естественной русской формулой.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: «Возвещает» передаёт торжественную пророческую формулу, а «Яхве» представляет личное имя, стоящее в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблено тетраграмматон, поэтому личное имя сохранено, а не заменено титулом.
- issue: Собирательное значение אָדָם
  choice: людей
  alternative: человека / человечество
  rationale: Контекст всеобщего суда указывает на человечество в целом. «Людей» передаёт собирательный смысл на современном русском без добавления отвлечённого существительного.
- issue: Связь הַמַּכְשֵׁלוֹת с אֶת הָרְשָׁעִים
  choice: всё, что становится преткновением, вместе с нечестивыми
  alternative: преткновения и нечестивых / преткновения, то есть нечестивых
  rationale: Еврейский синтаксис сжат и допускает разные способы понимания связи. Выбранная передача включает обе группы в суд, не отождествляя их и не устраняя подлинную неоднозначность существительного.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Повтор «смету» сохранён; лексика остаётся понятной широкому читателю, а сжатая неоднозначность средней части не разрешается конфессионально.
