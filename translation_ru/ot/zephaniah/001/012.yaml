base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/012.yaml
  text: 'And it will happen at that time: I will search Jerusalem with lamps, and I will punish the men who have grown thick on their dregs, who say in their hearts, ''The LORD will not do good, nor will he do harm.'''
translation:
  language: ru
  text: 'И будет в то время: Я обыщу Иерусалим при свете светильников и взыщу с тех людей, которые застыли на своих винных осадках[a] и говорят в своём сердце: «Не делает Господь ни добра, ни зла».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «загустели (или застыли) на своих винных осадках» — образ вина, которое долго оставляли неподвижным на осадке.'
    reason: Метафора непривычна современному русскому читателю; примечание поясняет её предметную основу, сохраняя образ в основном тексте.
lexical_decisions:
- source_word: אֲחַפֵּשׂ
  choice: обыщу
  rationale: Передаёт тщательный, целенаправленный поиск; сочетание «обыщу Иерусалим со светильниками» естественно по-русски и сохраняет образ исходного текста.
- source_word: וּפָקַדְתִּי עַל
  choice: и взыщу с
  rationale: В данном контексте פקד с עַל означает карательное посещение и привлечение к ответу; «взыщу с» сохраняет судебно-карательный оттенок, не добавляя конкретного вида наказания.
- source_word: הַקֹּפְאִים עַל שִׁמְרֵיהֶם
  choice: которые застыли на своём осадке
  rationale: 'Сохраняется винодельческий образ: קפא указывает на сгущение или неподвижное застаивание, а שׁמרים — на винный осадок. Буквально-образная передача поддерживает связь с самодовольной духовной неподвижностью.'
- source_word: בִּלְבָבָם
  choice: в сердце своём
  rationale: Традиционная и понятная русская передача внутреннего убеждения или безмолвного рассуждения.
- source_word: לֹא יֵיטִיב ... וְלֹא יָרֵעַ
  choice: Не делает ... ни добра, ни зла
  rationale: 'Сохраняет симметрию еврейской фразы и двусмысленность: речь может идти как о благодеянии и причинении беды, так и шире — о действенном вмешательстве Господа.'
- source_word: יהוה
  choice: Господь
  rationale: Общепринятая русская библейская передача тетраграмматона, естественная для публичного чтения и не навязывающая реконструированное произношение.
theological_decisions:
- issue: Смысл утверждения о бездействии Господа
  choice: «Не делает Господь ни добра, ни зла»
  alternative: «Господь не благотворит и не наказывает»
  rationale: 'Выбранная формулировка сохраняет намеренно широкую и напряжённую мысль оригинала: люди отрицают действенное участие Господа, не только конкретно награду и наказание.'
- issue: Метафора винного осадка
  choice: Сохранить образ «застыли на своём осадке»
  alternative: Истолковать как «погрязли в самодовольстве» или «успокоились в беспечности»
  rationale: Толковательные варианты сужают образ и вносят вывод переводчика; исходная метафора выражает длительную неподвижность и самодовольство, оставаясь открытой для осмысления.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сохраняет торжественное «И будет в то время», но избегает избыточных архаизмов. Прямая речь оформлена естественно; образная и богословская неоднозначность оригинала сохранена.
