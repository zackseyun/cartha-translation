base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/010.yaml
  text: And on that day[a], declares Yahweh, there will be the sound of a cry from the Fish Gate, and a wail from the Second Quarter[c][b], and a great crash from the hills.
translation:
  language: ru
  text: И будет в тот день, — возвещает Яхве, — слышен крик[a] от Рыбных ворот, плач — из Второго квартала[b], а с холмов — великий грохот[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вопль».'
    reason: lexical_alternative
  - marker: b
    text: «Второй квартал» — вероятно, название одной из частей Иерусалима; еврейское название — Мишне.
    reason: cultural_note
  - marker: c
    text: 'Или: «великое разрушение» либо «великое сокрушение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: И в тот день
  rationale: Пророческая формула вводит событие грядущего дня суда. Русское «И в тот день» естественно продолжает контекст и сохраняет временной акцент.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Формула пророческого изречения передана современно и торжественно; личное имя יהוה транслитерировано как «Яхве».
- source_word: קוֹל צְעָקָה
  choice: донесётся крик
  rationale: Буквально сочетание означает «звук крика». Глагол «донесётся» естественно передаёт появление слышимого звука и сочетается с последующими указаниями его источников.
- source_word: מִשַּׁעַר הַדָּגִים
  choice: от Рыбных ворот
  rationale: Это название иерусалимских ворот; форма «Рыбные ворота» традиционна и понятна по-русски.
- source_word: וִילָלָה
  choice: плач
  rationale: Слово обозначает громкое выражение горя и бедствия. «Плач» звучит естественно и сохраняет контекст суда.
- source_word: מִן הַמִּשְׁנֶה
  choice: из Второго квартала
  rationale: Вероятнее всего, מִּשְׁנֶה обозначает конкретную часть Иерусалима. Перевод как название района понятнее, чем простая транслитерация.
- source_word: וְשֶׁבֶר גָּדוֹל
  choice: великий грохот
  rationale: שֶׁבֶר может означать сокрушение, разрушение или шум разрушительного обвала. В ряду слышимых крика и плача «грохот» сохраняет звуковой образ, не исключая смысла разрушения.
- source_word: מֵהַגְּבָעוֹת
  choice: с холмов
  rationale: Передаёт обычное значение существительного и сохраняет направление, откуда доносится звук.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога, поэтому оно сохранено в форме «Яхве», а не заменено титулом.
- issue: Характер שֶׁבֶר в контексте суда
  choice: великий грохот
  alternative: великое разрушение; великое сокрушение
  rationale: Контекст строится как последовательность звуков, поэтому выбран акустический оттенок; примечание сохраняет возможный смысл разрушения и не устраняет напряжение между звуком и событием.
translation_notes:
  register: Современный литературный русский язык с пророческой торжественностью. Тире разграничивают формулу речи Яхве и параллельные источники звука; лексика остаётся доступной без архаизмов.
