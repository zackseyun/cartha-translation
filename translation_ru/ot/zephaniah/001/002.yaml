  text: אָסֹ֨ף אָסֵ֜ף כֹּ֗ל מֵ/עַ֛ל פְּנֵ֥י הָ/אֲדָמָ֖ה נְאֻם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/002.yaml
  text: I will utterly sweep away everything from the face of the earth[a], declares Yahweh.
translation:
  language: ru
  text: «Я непременно смету всё с лица земли[a], — возвещает Яхве».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я совершенно уберу всё с поверхности земли (почвы)». В еврейском тексте употреблена усилительная глагольная конструкция, буквально: «собирая, соберу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָסֹף אָסֵף
  choice: непременно смету
  rationale: Сочетание абсолютного инфинитива с личной формой глагола אָסַף придаёт высказыванию усиленное значение полноты и несомненности. В контексте суда «смету» естественно передаёт не мирное собирание, а полное устранение, тогда как «непременно» сохраняет эмфатическую силу конструкции.
- source_word: כֹּל
  choice: всё
  rationale: Абсолютное употребление כֹּל обозначает всеохватную совокупность; русское «всё» ясно и естественно сохраняет этот широкий объём.
- source_word: מֵעַל פְּנֵי
  choice: с лица
  rationale: Устойчивое русское выражение «с лица земли» точно и понятно передаёт еврейский образ удаления с поверхности.
- source_word: הָאֲדָמָה
  choice: земли
  rationale: אֲדָמָה может обозначать землю, почву или территорию. В открывающем всеохватном провозглашении суда «земли» наиболее естественно, при этом возможное более узкое значение отмечено в сноске.
- source_word: נְאֻם יְהוָה
  choice: возвещает Яхве
  rationale: Пророческая формула вводит торжественное и властное Божье изречение. «Возвещает» передаёт её авторитетный характер и звучит достойно в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем «Яхве» сохраняет имя, стоящее в еврейском тексте, а не заменяет его титулом.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте непосредственно употреблён тетраграмматон; «Яхве» передаёт личное имя транслитерацией, не подменяя его титулом.
- issue: Масштаб выражения הָאֲדָמָה
  choice: земли
  alternative: почвы; страны
  rationale: Начальное всеохватное заявление и последующее перечисление творений допускают глобальное прочтение, однако само слово не устраняет более узких значений; эта лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Формула «с лица земли» сохраняет исходный образ и остаётся общеупотребительной; «непременно смету» сочетает эмфатическую определённость с контекстом суда.
