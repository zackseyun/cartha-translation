base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/013.yaml
  text: Their wealth will become plunder[a], and their houses a desolation; they will build houses but not inhabit them[b], and plant vineyards but not drink their wine.
translation:
  language: ru
  text: Их богатство станет добычей[a], а их дома придут в запустение[b]. Они построят дома, но жить в них не будут; насадят виноградники, но своего вина не выпьют.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «имущество», «добро»; реже в данном контексте — «сила» или «войско».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «а их дома — в запустение»; это краткое выражение означает, что дома будут разорены и опустеют.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: их богатство
  rationale: חַיִל может означать силу, войско, средства или богатство. В параллели с домами и виноградниками здесь наиболее естественно обозначение материального достояния, которое будет разграблено.
- source_word: לִמְשִׁסָּה
  choice: станет добычей
  rationale: מְשִׁסָּה обозначает добычу, захваченную при разграблении. Оборот «станет добычей» естественно передаёт результат, выраженный предлогом לְ.
- source_word: וּבָתֵּיהֶם לִשְׁמָמָה
  choice: а их дома придут в запустение
  rationale: 'Компактная именная конструкция указывает на результат: дома окажутся разорёнными и покинутыми. «Придут в запустение» сохраняет смысл, оставаясь естественным по-русски.'
- source_word: וּבָנוּ בָתִּים וְלֹא יֵשֵׁבוּ
  choice: они построят дома, но жить в них не будут
  rationale: В контексте пророческого объявления формы передают будущее. ישׁב здесь означает жить или обитать; перестановка сказуемого подчёркивает противопоставление и естественна для русского языка.
- source_word: וְנָטְעוּ כְרָמִים וְלֹא יִשְׁתּוּ אֶת יֵינָם
  choice: насадят виноградники, но вина из них не выпьют
  rationale: Перевод сохраняет образ труда, плодами которого люди не воспользуются. «Из них» естественно связывает вино с упомянутыми виноградниками, не меняя смысла притяжательного суффикса.
