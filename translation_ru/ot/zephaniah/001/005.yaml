base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/005.yaml
  text: those who bow down on the rooftops to the host of heaven[a], and those who bow down, who swear by Yahweh and swear by Milcom.
translation:
  language: ru
  text: и тех, кто поклоняется на крышах небесному воинству, и тех, кто поклоняется, клянясь ГОСПОДОМ и клянясь Милкомом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их царём»; некоторые понимают здесь имя «Молох».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַמִּשְׁתַּחֲוִים
  choice: тех, кто поклоняется
  rationale: Причастие от שׁחה обозначает земной поклон как действие поклонения. В данном перечне идолопоклоннических обрядов русское «поклоняется» естественно передаёт и действие, и его религиозный смысл.
- source_word: עַל הַגַּגּוֹת
  choice: на крышах
  rationale: Прямое локативное значение; формулировка естественна для современного русского языка и сохраняет культурную обстановку поклонения на плоских крышах.
- source_word: לִצְבָא הַשָּׁמָיִם
  choice: небесному воинству
  rationale: Устойчивое библейское выражение, обозначающее совокупность небесных светил или сил как объект поклонения; оно сохраняет образ צבא и не сужает значение до одних звёзд.
- source_word: הַנִּשְׁבָּעִים לַיהוָה
  choice: клянясь ГОСПОДОМ
  rationale: В параллели с בְמַלְכָּם речь идёт о клятве с призыванием имени божества; творительный падеж естественно передаёт русское «клясться кем-либо».
- source_word: יהוה
  choice: ГОСПОДЬ
  rationale: Традиционная и понятная русская передача тетраграмматона; написание прописными буквами отличает имя YHWH от титула «Господь».
- source_word: בְּמַלְכָּם
  choice: Милкомом
  rationale: В контексте осуждения смешанного культа наиболее вероятно имя аммонитского божества Милкома. Грамматически возможные варианты сохранены в сноске.
theological_decisions:
- issue: Идентификация מַלְכָּם
  choice: Милком — чужеземное божество — в основном тексте
  alternative: «их царём»; некоторые понимают здесь имя Молоха
  rationale: Параллелизм описывает людей, которые клянутся и ГОСПОДОМ, и другим объектом религиозной преданности, что поддерживает чтение имени Милкома. Поскольку согласный текст допускает понимание «их царём», а имя также связывают с Молохом, неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Повтор «клянясь… и клянясь…» сохраняет резкую параллельную конструкцию еврейского текста; маркер [a] поставлен непосредственно после спорного имени.
