base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/015.yaml
  text: That day is a day of wrath[a], a day of distress and anguish, a day of ruin and devastation, a day of darkness and gloom[c][b], a day of clouds and thick darkness.
translation:
  language: ru
  text: Тот день — день гнева[a], день бедствия и гнёта, день разорения и опустошения[b], день тьмы и мрака, день тучи и густой мглы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «день ярости».'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «день запустения и разрушения».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «день облака и густой мглы». Еврейский текст использует существительные в единственном числе в поэтической последовательности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: י֥וֹם עֶבְרָ֖ה
  choice: день гнева
  rationale: עֶבְרָה обозначает сильный, изливающийся гнев; «гнев» естественно и весомо звучит в контексте пророческого суда.
- source_word: הַ/יּ֣וֹם הַ/ה֑וּא
  choice: Тот день
  rationale: Указательное сочетание подчёркивает конкретный день, уже находящийся в поле зрения пророчества.
- source_word: צָרָ֣ה וּ/מְצוּקָ֗ה
  choice: бедствия и тесноты
  rationale: צָרָה передаёт бедствие, а מְצוּקָה — стеснение и тяжёлое положение. «Теснота» сохраняет телесную метафору давления и поэтический параллелизм.
- source_word: שֹׁאָה֙ וּ/מְשׁוֹאָ֔ה
  choice: разорения и опустошения
  rationale: Близкие по смыслу слова нагнетают образ катастрофического разрушения; два разных русских существительных сохраняют этот поэтический парный ряд.
- source_word: חֹ֨שֶׁךְ֙ וַ/אֲפֵלָ֔ה
  choice: тьмы и мрака
  rationale: חֹשֶׁךְ — тьма, а אֲפֵלָה — глубокий мрак; привычная русская пара сохраняет различие и усиление.
- source_word: עָנָ֖ן וַ/עֲרָפֶֽל
  choice: облака и густой мглы
  rationale: Оба еврейских существительных стоят в единственном числе. עָנָן передано как «облако», а עֲרָפֶל — как «густая мгла», что сохраняет грозную теофаническую образность и кульминацию строки.
theological_decisions:
- issue: Характер «того дня» в языке пророческого суда
  choice: Сохранить повторяющуюся конструкцию «день…», не ограничивая смысл исключительно историческим или исключительно конечным судом.
  alternative: Истолковать этот день либо только как исторический суд над Иудеей, либо только как окончательный эсхатологический суд.
  rationale: Еврейский текст поэтически накапливает определения дня, но в самом стихе не уточняет его временной охват; перевод не должен устранять эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Анафорический повтор «день» и пять пар образов сохранены; лексика понятна широкому читателю, но не снижает поэтической напряжённости.
