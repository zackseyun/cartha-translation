source:
  edition: WLC
  text: וְ/אֶת הַ/נְּסוֹגִ֖ים מֵ/אַחֲרֵ֣י יְהוָ֑ה וַ/אֲשֶׁ֛ר לֹֽא בִקְשׁ֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א דְרָשֻֽׁ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/006.yaml
  text: and those who turn back from following Yahweh[c][b][a], and who do not seek Yahweh or inquire of him.
translation:
  language: ru
  text: и отступающих от Яхве[a], и тех, кто не ищет Яхве и не обращается к Нему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское יהוה (ЙХВХ) — личное имя Бога; здесь оно передано как «Яхве». Оборот можно также перевести: «отступающих от следования за Яхве».'
    reason: Указывает форму божественного имени и сохраняет более буквальную альтернативу еврейскому обороту.
  - marker: b
    text: 'Или: «не вопрошает Его»; еврейский глагол может означать искать Бога, обращаться к Нему или вопрошать Его.'
    reason: Отмечает широту значения דרש и не устраняет смысловую близость к предыдущему глаголу «искать».
lexical_decisions:
- source_word: הַנְּסוֹגִים מֵאַחֲרֵי יְהוָה
  choice: отступающих от Яхве
  rationale: Причастие от סוג/נסוג передаёт отступление, отход назад, а оборот מֵאַחֲרֵי יְהוָה буквально указывает на прекращение следования за Яхве. Краткая русская формулировка сохраняет образ вероотступничества и естественно продолжает перечень тех, кого постигнет суд.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом «Господь»; это сохраняет различие, присутствующее в еврейском тексте.
- source_word: בִקְשׁוּ
  choice: ищет
  rationale: בקש обычно означает «искать». В данном контексте речь идёт не о физическом поиске, а о стремлении к Богу и Его расположению; привычное библейское выражение «искать Яхве» сохраняет эту ёмкость.
- source_word: דְרָשֻׁהוּ
  choice: обращается к Нему
  rationale: דרש может означать искать, вопрошать или обращаться за руководством. После בקש перевод «обращается к Нему» естественно различает близкие глаголы, не превращая их в строго разграниченные богословские понятия.
- source_word: וַאֲשֶׁר לֹא... וְלֹא
  choice: и тех, кто не... и не...
  rationale: Сохранены присоединение второй группы и параллельное отрицание двух действий; русская конструкция ясно передаёт координацию еврейского текста.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом и не навязывая конфессионально привычную замену.
- issue: Соотношение глаголов בקש и דרש
  choice: Различить как «искать» и «обращаться к»
  alternative: Оба глагола передать словом «искать»; второй передать как «вопрошать»
  rationale: Два близких глагола совместно подчёркивают пренебрежение отношениями с Богом. Разные, но семантически пересекающиеся русские выражения сохраняют риторическую полноту, тогда как «вопрошать» звучало бы заметно архаичнее современного литературного регистра.
- issue: Временная форма причастий и глаголов
  choice: 'Настоящее время: «отступающих», «не ищет», «не обращается»'
  alternative: 'Прошедшее время: «отступивших», «не искал», «не обращался»'
  rationale: Еврейское причастие характеризует людей по их продолжающейся позиции, а перфекты в относительной части допускают описание сложившегося поведения. В контексте перечня настоящее время по-русски естественно выражает устойчивую характеристику, не исключая предшествующего отказа.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формулировка сохраняет синтаксическое продолжение предшествующего перечня, параллелизм двух отрицаний и различие между близкими еврейскими глаголами без ненужной архаизации.
