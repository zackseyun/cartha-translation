base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/017.yaml
  text: And I will bring distress on mankind[a], and they will walk like the blind, because they have sinned against Yahweh; their blood will be poured out like dust[b], and their flesh like dung.
translation:
  language: ru
  text: Я наведу бедствие на людей[a], и они будут ходить как слепые, потому что согрешили против Яхве. Их кровь будет пролита как прах, а их плоть[b] — как навоз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «человека»; еврейское слово употреблено здесь в собирательном смысле — о людях в целом.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «внутренности». Значение редкого еврейского слова не вполне определённо.'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: וַהֲצֵרֹתִי
  choice: И Я стесню
  rationale: Глагол צרר в каузативной форме передаёт наведение тесноты и бедствия. «Стесню» сохраняет конкретный образ сжатия и звучит как возвещение суда.
- source_word: לָאָדָם
  choice: людей
  rationale: Единственное число אָדָם употреблено собирательно и обозначает людей в целом; русское множественное число естественно согласуется с последующим «они».
- source_word: וְהָלְכוּ כַּעִוְרִים
  choice: и они будут ходить, словно слепые
  rationale: Сохранены буквальное движение הלך и сравнение, изображающее беспомощность и потерю ориентации.
- source_word: כִּי לַיהוָה חָטָאוּ
  choice: потому что согрешили против Яхве
  rationale: כִּי вводит причину суда, а חטא с ל обозначает грех, совершённый против Яхве.
- source_word: וְשֻׁפַּךְ דָּמָם כֶּעָפָר
  choice: Их кровь будет пролита, как прах
  rationale: Пассивная конструкция и образ обесцененной, обильно рассыпанной крови переданы без смягчения.
- source_word: וּלְחֻמָם
  choice: их плоть
  rationale: Редкое и трудное слово в данном контексте может обозначать плоть либо внутренности; «плоть» естественно образует параллель с кровью, а неоднозначность отмечена в сноске.
- source_word: כַּגְּלָלִים
  choice: как помёт
  rationale: גְּלָלִים означает навоз или экскременты; «помёт» прямо и понятно сохраняет резкость образа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя и не заменяет его титулом.
- issue: Собирательное значение אָדָם
  choice: людей
  alternative: человека; человечество
  rationale: Хотя форма единственного числа допускает «человека», продолжение во множественном числе показывает собирательное значение. «Людей» естественно передаёт его по-русски.
- issue: Значение לְחֻמָם
  choice: плоть
  alternative: внутренности
  rationale: Лексема редкая и спорная. Основной текст сохраняет общий телесный смысл и параллелизм с кровью, а более конкретное понимание вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Сохранены резкие образы суда и краткий параллелизм; неоднозначность редкого слова отмечена, но не устранена догматически.
