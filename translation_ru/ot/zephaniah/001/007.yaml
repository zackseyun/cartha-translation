  text: הַ֕ס מִ/פְּנֵ֖י אֲדֹנָ֣/י יְהוִ֑ה כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה כִּֽי הֵכִ֧ין יְהוָ֛ה זֶ֖בַח הִקְדִּ֥ישׁ קְרֻאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/007.yaml
  text: Be silent before the Lord GOD[a], for the day of Yahweh is near; for Yahweh has prepared a sacrifice; he has consecrated his invited ones.
translation:
  language: ru
  text: Умолкните перед Владыкой Яхве, ведь близок день Яхве; Яхве приготовил жертву и освятил своих званых[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приглашённых», «призванных» или «созванных». В контексте это, вероятно, те, кого Яхве призвал для этого жертвенного суда.'
    reason: Лексема קְרֻאָיו означает «его приглашённые/призванные»; их точная роль в образе жертвоприношения прямо не уточняется.
lexical_decisions:
- source_word: הַס
  choice: Умолкните
  rationale: Междометие-повеление требует тишины. «Умолкните» естественно передаёт торжественный и настоятельный призыв, не привнося оттенка неподвижности.
- source_word: מִפְּנֵי
  choice: перед
  rationale: В сочетании с призывом умолкнуть выражает пребывание в присутствии Владыки; «перед» звучит кратко и естественно.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: Сохраняет и титул אֲדֹנָי, и личное имя יְהוִה, избегая неестественного сочетания «Господь Господь».
- source_word: כִּי קָרוֹב
  choice: ведь близок
  rationale: Первое כִּי обосновывает призыв к молчанию, а קָרוֹב указывает на близость и неотвратимость дня.
- source_word: יוֹם יְהוָה
  choice: день Яхве
  rationale: Точно сохраняет устойчивое пророческое выражение и явно передаёт божественное имя.
- source_word: הֵכִין
  choice: приготовил
  rationale: Перфект представляет приготовление как уже совершённое и несомненное; глагол естественно сочетается с жертвой.
- source_word: זֶבַח
  choice: жертву
  rationale: Сохраняет прямой культовый образ, не раскрывая в переводе, кто именно является жертвой.
- source_word: הִקְדִּישׁ
  choice: освятил
  rationale: Передаёт культовый смысл отделения для священного назначения и поддерживает связь с образом жертвоприношения.
- source_word: קְרֻאָיו
  choice: Своих званых
  rationale: «Званые» сохраняет значение приглашённых или позванных на жертвенную трапезу, не уточняя преждевременно их роль. Местоимение «Своих» естественно указывает в русском на принадлежность подлежащему.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве; в составном титуле — «Владыка Яхве»
  alternative: ГОСПОДЬ; Господь Бог
  rationale: Транслитерация сохраняет личное заветное имя, а в составном титуле отличает его от אֲדֹנָי.
- issue: Толкование жертвенного образа
  choice: Сохранить образ приготовленной жертвы и освящённых званых без уточнения их ролей в основном тексте
  alternative: Прямо назвать жертвой жителей Иудеи, а званых — чужеземными исполнителями суда
  rationale: Сам стих намеренно выражается сжато и образно. Контекст допускает такое толкование, но не требует вносить его в перевод, поэтому неоднозначность сохраняется.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Восклицательный знак после первого основания передаёт напряжённость и срочность, не меняя синтаксических связей. Заглавное «Своих» употреблено как издательская норма уважительного обозначения Бога.
