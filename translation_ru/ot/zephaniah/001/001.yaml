  text: דְּבַר יְהוָ֣ה אֲשֶׁ֣ר הָיָ֗ה אֶל צְפַנְיָה֙ בֶּן כּוּשִׁ֣י בֶן גְּדַלְיָ֔ה בֶּן אֲמַרְיָ֖ה בֶּן חִזְקִיָּ֑ה בִּ/ימֵ֛י יֹאשִׁיָּ֥הוּ בֶן אָמ֖וֹן מֶ֥לֶךְ יְהוּדָֽה־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/zephaniah/001/001.yaml
  text: 'The word of Yahweh that came to Zephaniah son of Cushi[a], son of Gedaliah, son of Amariah, son of Hezekiah, in the days of Josiah son of Amon[b], king of Judah:'
translation:
  language: ru
  text: 'Слово Яхве, которое пришло к Софонии, сыну Куши[a], сыну Годолии, сыну Амарии, сыну Езекии[b], во дни Иосии, сына Амона, царя Иудеи:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Куши» можно также понять как обозначение кушита, то есть человека из Куша; однако здесь оно стоит как личное имя в родословии.
    reason: lexical_alternative
  - marker: b
    text: Возможно, здесь имеется в виду царь Езекия; тогда Софония происходил бы из царского рода. Однако сам текст прямо не называет этого Езекию царём.
    reason: cross_reference
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: Слово Яхве
  rationale: Сохраняет устойчивую формулу пророческого заглавия и передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: אֲשֶׁר הָיָה אֶל
  choice: которое было к
  rationale: Формульное выражение передано близко к еврейскому; оборот «слово было к» узнаваем в русском библейском регистре и не добавляет отсутствующего в тексте глагола речи.
- source_word: צְפַנְיָה
  choice: Софонии
  rationale: Употреблена закрепившаяся в русской библейской традиции форма имени, понятная современному читателю.
- source_word: בֶּן
  choice: сыну
  rationale: Повторена прямая родословная формула исходного текста без замены на более неопределённое «потомку».
- source_word: כּוּשִׁי
  choice: Куши
  rationale: В родословии слово функционирует как личное имя; вариант с этническим значением сохранён в примечании.
- source_word: גְּדַלְיָה
  choice: Годолии
  rationale: Использована традиционная русская библейская форма личного имени.
- source_word: אֲמַרְיָה
  choice: Амарии
  rationale: Использована естественная русская форма транслитерированного личного имени.
- source_word: חִזְקִיָּה
  choice: Езекии
  rationale: Использована закрепившаяся русская библейская форма; слово «царь» не добавлено, поскольку его нет при этом имени в исходном тексте.
- source_word: בִּימֵי
  choice: во дни
  rationale: Сохраняет буквальный временной оборот и торжественный регистр пророческого заглавия.
- source_word: יֹאשִׁיָּהוּ
  choice: Иосии
  rationale: Закрепившаяся русская библейская форма имени царя.
- source_word: אָמֹון
  choice: Амона
  rationale: Стандартная русская передача личного имени.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Прямо и естественно передаёт титул и территорию правления.
theological_decisions:
- issue: Возможное отождествление חִזְקִיָּה с царём Езекией
  choice: В основном тексте оставлено только имя «Езекия».
  alternative: Добавить «царь Езекия» и тем самым явно представить Софонию человеком царского происхождения.
  rationale: Исходный текст не даёт Езекии царского титула. Возможность такого отождествления исторически значима, но её следует отметить в сноске, а не превращать в утверждение перевода.
translation_notes:
  register: Современный литературный русский с умеренно торжественным пророческим регистром. Традиционные русские формы библейских имён сочетаются с передачей тетраграмматона как «Яхве». Родословная и двоеточие в конце сохранены как элементы заглавия.
