- source_word: הֵילִילוּ
  choice: Рыдайте
  rationale: Повелительное наклонение множественного числа от ילל обозначает громкий плач при бедствии; «рыдайте» естественно и выразительно передаёт пророческий призыв.
- source_word: יֹשְׁבֵי
  choice: жители
  rationale: Субстантивированное причастие от ישב в сопряжённой форме обозначает живущих в данном месте; краткое «жители» естественно по-русски.
- source_word: הַמַּכְתֵּשׁ
  choice: Ступы
