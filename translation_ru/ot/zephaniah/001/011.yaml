- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание для призыва рыдать и прямо передаёт причинную связь.
- source_word: נִדְמָה
  choice: погиб
  rationale: Нифаль от דמה в контексте суда означает быть погубленным или исчезнуть. Единственное число согласовано с собирательным существительным «народ».
- source_word: כָּל עַם כְּנַעַן
  choice: весь народ торговцев
  rationale: В коммерческом контексте כְּנַעַן, вероятно, имеет засвидетельствованное значение «торговец, купец»; «народ торговцев» сохраняет собирательное עַם и не устраняет буквальную альтернативу, приведённую в сноске.
- source_word: נִכְרְתוּ
  choice: истреблены
  rationale: Нифаль от כרת буквально выражает отсечение, а в формуле суда — полное устранение или истребление; выбран естественный русский эквивалент.
- source_word: כָּל נְטִילֵי כָסֶף
  choice: все отвешивающие серебро
  rationale: В торговом контексте выражение, вероятнее всего, обозначает тех, кто отвешивает серебро как платёжное средство. Причастная конструкция сохраняет конкретный образ оригинала.
