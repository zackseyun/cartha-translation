  text: 'The great day of Yahweh is near—near and coming very quickly. The sound of the day of Yahweh: there the warrior cries out bitterly.'
translation:
  language: ru
  text: 'Близок великий день Яхве, близок и очень быстро приближается. Звук[a] дня Яхве: там горько кричит воин.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «голос» или «шум дня Яхве»; еврейское слово может означать звук, голос или шум.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «там горько кричит сильный человек».'
    reason: alternative_reading
lexical_decisions:
- source_word: קָרוֹב
  choice: близок
  rationale: Предикативное прилагательное выражает близость и неотвратимость; повтор сохранён для передачи пророческого нажима.
- source_word: יוֹם יְהוָה
  choice: день Яхве
  rationale: Сохранено устойчивое пророческое выражение и непосредственное употребление личного имени Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
- source_word: הַגָּדוֹל
  choice: великий
  rationale: Передаёт значение прилагательного без добавления отсутствующего в тексте определения «страшный».
- source_word: וּמַהֵר מְאֹד
  choice: и приближается очень быстро
  rationale: В контексте близости дня מַהֵר естественно передаётся как указание на его стремительное наступление.
- source_word: קוֹל
  choice: слышен
  rationale: 'Контекстуальная передача буквально названного «звука»: позволяет получить естественную русскую фразу, не уточняя природу слышимого шума или голоса.'
- source_word: מַר
  choice: горько
  rationale: Наречное употребление при причастии передаёт мучительность и отчаяние крика.
- source_word: צֹרֵחַ
  choice: кричит
  rationale: Передаёт громкий крик без излишне экспрессивного уточнения.
- source_word: שָׁם
  choice: там
  rationale: Сохранено основное пространственное значение наречия и его связь со сценой бедствия.
- source_word: גִּבּוֹר
  choice: воин
  rationale: В данном контексте слово обозначает сильного бойца; «воин» ясно и естественно передаёт образ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит личное имя; его транслитерация сохраняет различие между именем и титулом.
- issue: Смысл גִּבּוֹר в заключительной фразе
  choice: воин
  alternative: сильный человек
  rationale: Военный смысл соответствует контексту суда, однако более широкое лексическое значение отмечено в сноске.
- issue: Синтаксическая связь קוֹל יוֹם יְהוָה
  choice: Слышен день Яхве!
  alternative: Звук дня Яхве!
  rationale: Эллиптичность и резкость древнееврейской фразы сохранены, но выражены естественным русским синтаксисом; буквальная конструкция приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, напряжённым пророческим ритмом. Повтор «близок» сохранён; восклицание передаёт резкость бессоюзной древнееврейской фразы. Все сноски обозначены в основном тексте.
