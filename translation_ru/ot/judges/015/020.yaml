lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: судил
  rationale: Глагол שׁפט в книге Судей обозначает деятельность судьи, включая руководство народом, а не только вынесение судебных решений. «Судил» сохраняет ключевую терминологию книги и допускает этот более широкий смысл.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: В еврейском тексте прямым дополнением служит имя «Израиль»; такой оборот соответствует повторяющейся формуле книги и естественен в библейском повествовании.
- source_word: בִּימֵי
  choice: во дни
  rationale: Оборот буквально означает «в дни». «Во дни» сохраняет временную формулу оригинала и остаётся понятным в современном литературном русском языке.
- source_word: פְלִשְׁתִּים
  choice: филистимлян
  rationale: Это традиционное и общепринятое русское наименование данного народа; родительный падеж обусловлен оборотом «во дни».
- source_word: עֶשְׂרִים שָׁנָה
  choice: двадцать лет
  rationale: Прямая передача продолжительности; положение в конце предложения соответствует порядку слов исходного текста и подчёркивает итоговый срок.
theological_decisions:
- issue: Смысл роли Самсона в глаголе שׁפט
  choice: Сохранить формулировку «судил», не расширяя её до «правил» или «возглавлял».
  alternative: «Был судьёй Израиля двадцать лет» или «руководил Израилем двадцать лет».
  rationale: Так сохраняется связь с названием и повторяющейся формулой книги Судей, при этом примечание предупреждает, что речь может идти о более широкой руководящей деятельности, а не только о судопроизводстве.
translation_notes:
  register: Современный литературный русский с умеренно библейской формулой «во дни». Синтаксис близок к еврейскому оригиналу; архаичные формы и конфессионально окрашенные толкования не вводятся.
