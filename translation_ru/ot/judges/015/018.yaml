  text: וַ/יִּצְמָא֮ מְאֹד֒ וַ/יִּקְרָ֤א אֶל יְהוָה֙ וַ/יֹּאמַ֔ר אַתָּה֙ נָתַ֣תָּ בְ/יַֽד עַבְדְּ/ךָ֔ אֶת הַ/תְּשׁוּעָ֥ה הַ/גְּדֹלָ֖ה הַ/זֹּ֑את וְ/עַתָּה֙ אָמ֣וּת בַּ/צָּמָ֔א וְ/נָפַלְתִּ֖י בְּ/יַ֥ד הָ/עֲרֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/018.yaml
  text: And he became very thirsty[a], and he called to Yahweh and said, “You have given this great deliverance by the hand of your servant[c][b], and now shall I die from thirst and fall into the hand of the uncircumcised?”
translation:
  language: ru
  text: 'Он почувствовал сильную жажду и воззвал к Яхве: «Ты даровал через Твоего раба это великое избавление[a]. Неужели теперь я умру от жажды и попаду в руки необрезанных[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «эту великую победу»; также возможно: «это великое спасение».'
    reason: lexical_alternative
  - marker: b
    text: «Необрезанные» — заветно окрашенное обозначение врагов Израиля; здесь имеются в виду прежде всего филистимляне.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּצְמָא מְאֹד
  choice: Он почувствовал сильную жажду
  rationale: Передаёт наступившее после битвы состояние сильной жажды естественным современным русским языком.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: воззвал к Яхве
  rationale: Оборот קרא אל обозначает обращённый к кому-либо призыв, здесь — молитвенное обращение; «воззвал» сохраняет его напряжённость и возвышенный регистр.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, стоящее в еврейском тексте, а не заменяет его титулом.
- source_word: אַתָּה נָתַתָּ בְיַד עַבְדְּךָ
  choice: Ты даровал ... рукой Твоего раба
  rationale: Сохраняет завершённость действия, признание Бога источником избавления и еврейский образ руки как орудия действия.
- source_word: הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת
  choice: это великое избавление
  rationale: «Избавление» охватывает и конкретную военную победу, и спасение, дарованное Богом, не сужая значение до одного из этих оттенков.
- source_word: אָמ֣וּת בַּצָּמָא
  choice: Неужели теперь я умру от жажды
  rationale: Риторический вопрос подразумевается контекстом, хотя отдельной вопросительной частицы в еврейском тексте нет; «от жажды» естественно передаёт причинное значение предлога ב.
- source_word: וְנָפַלְתִּי בְּיַד הָעֲרֵלִים
  choice: и попаду в руки необрезанных
  rationale: Русский оборот «попасть в руки» естественно передаёт попадание под чужую власть; «необрезанные» сохраняет оценочное и заветное содержание исходного обозначения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Смысл הָעֲרֵלִים
  choice: необрезанные
  alternative: филистимляне
  rationale: Буквальное обозначение сохраняет заветно-религиозное противопоставление и риторическую остроту слов Самсона; конкретный исторический референт пояснён в сноске.
- issue: Вопросительный характер заключительной фразы
  choice: Неужели теперь я умру... ?
  alternative: и теперь я умру...
  rationale: Хотя формального вопросительного показателя нет, контекст молитвенного возражения поддерживает риторический вопрос; «неужели» ясно передаёт его по-русски, не превращая слова в простое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным молитвенным регистром. Формы «воззвал», «даровал» и «раб» уместны в обращении к Богу, но синтаксис остаётся ясным и естественным. Местоимения, относящиеся к Богу, оформлены с прописной буквы согласно распространённой русской библейской традиции.
