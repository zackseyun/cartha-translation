base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
translation:
  language: ru
  text: 'Филистимляне спросили: «Кто это сделал?» Им ответили: «Самсон, зять тимнянина, потому что тимнянин забрал жену Самсона и отдал её товарищу Самсона[a]». Тогда филистимляне пришли и сожгли её и её отца огнём[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его другу». Еврейское слово может означать товарища или друга; в контексте свадьбы некоторые понимают его как обозначение свадебного дружки.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сожгли её и её отца огнём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Общепринятое русское название народа; в русском языке определённый артикль не требуется.
- source_word: מִי עָשָׂה זֹאת
  choice: Кто это сделал?
  rationale: Естественная современная передача прямого вопроса в повествовательном контексте.
- source_word: חֲתַן הַתִּמְנִי
  choice: зять тимнянина
  rationale: חָתָן может обозначать жениха или зятя; здесь Самсон назван так по отношению к отцу своей жены. «Тимнянин» передаёт жителя Тимны.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит объяснение того, почему Самсон совершил этот поступок.
- source_word: לָקַח אֶת אִשְׁתּוֹ
  choice: тот забрал у него жену
  rationale: Явно обозначенный указательным местоимением субъект — тимнянин; «у него» проясняет, что речь о жене Самсона, не меняя смысла контекста.
- source_word: וַיִּתְּנָהּ לְמֵרֵעֵהוּ
  choice: и отдал её его товарищу
  rationale: «Товарищ» сохраняет широкий смысл מֵרֵעַ и не сужает его без необходимости до церемониальной роли шафера.
- source_word: וַיַּעֲלוּ
  choice: пришли
  rationale: Еврейское «поднялись» здесь служит глаголом передвижения; нейтральное «пришли» естественно по-русски и не навязывает неясную пространственную деталь.
- source_word: וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת אָבִיהָ בָּאֵשׁ
  choice: сожгли её и её отца
  rationale: Русский глагол «сожгли» уже выражает действие огнём; буквальная формула отмечена в сноске.
