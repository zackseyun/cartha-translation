  yaml_path: translation/ot/judges/015/015.yaml
  text: And he found a fresh jawbone of a donkey[a], and he reached out his hand and took it, and with it he struck down a thousand men.
translation:
  language: ru
  text: Он нашёл свежую ослиную челюсть[a], протянул руку, взял её и ею сразил тысячу мужчин.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «новую ослиную челюсть». Еврейское прилагательное может означать «свежая» или «новая».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: он нашёл
  rationale: Обычная повествовательная форма от מצא обозначает последовательное событие в прошлом; «нашёл» естественно и точно передаёт смысл.
- source_word: לְחִי חֲמוֹר
  choice: ослиную челюсть
  rationale: לְחִי может обозначать челюсть или челюстную кость; в данном контексте речь о кости, использованной как оружие. По-русски «ослиная челюсть» звучит естественнее, чем тяжеловесное «челюстная кость осла».
- source_word: טְרִיָּה
  choice: свежую
  rationale: Прилагательное указывает на свежесть, то есть кость ещё не высохла и не стала хрупкой; вместе с тем возможен оттенок новизны, отмеченный в сноске.
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: протянул руку
  rationale: Сохраняет конкретный образ еврейской идиомы и естественно звучит в современном русском повествовании.
- source_word: וַיִּקָּחֶהָ
  choice: взял её
  rationale: Местоимение женского рода соотнесено с «челюстью»; нейтральное «взял» не усиливает глагол до «схватил».
- source_word: וַיַּךְ בָּהּ
  choice: ею сразил
  rationale: נכה означает нанесение удара, в данном военном контексте со смертельным исходом. «Сразил» передаёт результат, не вводя более прямого «убил».
- source_word: אֶלֶף אִישׁ
  choice: тысячу человек
  rationale: Числительное обозначает тысячу мужчин-участников боя; русское сочетание «тысячу человек» идиоматично и не стирает контекст.
