source:
  edition: WLC
  text: וַ/יִּבְקַ֨ע אֱלֹהִ֜ים אֶת הַ/מַּכְתֵּ֣שׁ אֲשֶׁר בַּ/לֶּ֗חִי וַ/יֵּצְא֨וּ מִמֶּ֤/נּוּ מַ֨יִם֙ וַ/יֵּ֔שְׁתְּ וַ/תָּ֥שָׁב רוּח֖/וֹ וַ/יֶּ֑חִי עַל כֵּ֣ן קָרָ֣א שְׁמָ֗/הּ עֵ֤ין הַקּוֹרֵא֙ אֲשֶׁ֣ר בַּ/לֶּ֔חִי עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
translation:
  language: ru
  text: Тогда Бог рассёк углубление в Лехи[a], и из него потекла вода. Самсон напился, дух вернулся к нему, и он ожил. Поэтому он назвал этот источник Эйн-ха-Коре[b]. Он находится в Лехи и по сей день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно и другое прочтение: «Бог рассёк углубление в челюсти, и из неё потекла вода».'
    reason: alternative_reading
  - marker: b
    text: Эйн-ха-Коре означает «Источник взывающего» или «Источник того, кто воззвал» — вероятно, в память о том, как Самсон воззвал к Богу.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקַע
  choice: рассёк
  rationale: Глагол обозначает сильное рассечение или раскалывание; «рассёк» конкретно передаёт действие и сохраняет возвышенный, но современный регистр.
- source_word: הַמַּכְתֵּשׁ
  choice: углубление
  rationale: Хотя существительное обычно означает «ступа», здесь оно, вероятнее всего, обозначает чашеобразную впадину или полость, из которой появилась вода.
- source_word: בַּלֶּחִי
  choice: в Лехи
  rationale: В данном повествовании לֶחִי функционирует прежде всего как название местности. Возможное понимание «в челюсти» сохранено в примечании.
- source_word: וַיֵּצְאוּ מִמֶּנּוּ מַיִם
  choice: из него потекла вода
  rationale: Естественная русская формулировка, передающая появление воды из рассечённого углубления.
- source_word: וַתָּשָׁב רוּחוֹ
  choice: дух вернулся к нему
  rationale: Сохраняет многозначность רוּחַ — «дух, дыхание, жизненная сила» — и не сводит выражение только к физическому восстановлению сил.
- source_word: וַיֶּחִי
  choice: он ожил
  rationale: Передаёт возвращение жизненных сил после крайнего изнеможения, не подразумевая непременно воскресения из мёртвых.
- source_word: עֵין הַקּוֹרֵא
  choice: Эйн-ха-Коре
  rationale: Имя передано транслитерацией, а его значимое для повествования значение раскрыто в примечании.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и по сей день
  rationale: Устойчивый и естественный русский эквивалент древнееврейской временной формулы.
theological_decisions:
- issue: 'Местонахождение источника воды: בַּלֶּחִי'
  choice: В основном тексте Лехи понимается как название местности.
  alternative: Бог рассёк углубление в челюсти, и вода вышла из неё.
  rationale: Повторное употребление Лехи как географического названия и заключительная фраза о существовании источника там «по сей день» поддерживают топографическое прочтение. Однако лексическое значение לֶחִי — «челюсть» — допускает иную картину чуда, поэтому она отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Имя Самсона добавлено вместо местоимения в начале второго предложения для ясности русского текста; в контексте древнееврейского повествования субъект однозначен. Синтаксис упрощён без устранения образа возвращающегося духа и без разрешения лексической неоднозначности названия Лехи.
