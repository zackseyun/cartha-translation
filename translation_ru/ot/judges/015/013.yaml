base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
translation:
  language: ru
  text: 'Они сказали ему: «Нет, мы непременно свяжем тебя и выдадим тебя в их руки, но сами ни в коем случае не убьём тебя». И они связали его двумя новыми верёвками и подняли его со скалы[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с утёса» или «со скалистого места». Древнееврейское слово может обозначать скалу, утёс или скалистую возвышенность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: Нет, … но
  rationale: 'Сочетание выражает отрицание с последующим уточнением: они отвергают требование Самсона не убивать его и объясняют, что лишь свяжут и выдадут его.'
- source_word: אָסֹר נֶאֱסָרְךָ
  choice: мы крепко свяжем тебя
  rationale: Инфинитив абсолютный при личной форме усиливает действие; наречие «крепко» естественно передаёт эту эмфазу по-русски.
- source_word: וּנְתַנּוּךָ בְיָדָם
  choice: отдадим тебя им в руки
  rationale: Сохранён понятный по-русски древнееврейский образ передачи человека во власть других.
- source_word: וְהָמֵת לֹא נְמִיתֶךָ
  choice: но сами ни за что тебя не убьём
  rationale: Оборот с инфинитивом абсолютным выражает решительное заверение; «ни за что не убьём» передаёт усиленное отрицание, а «сами» проясняет контраст между выдачей филистимлянам и собственным намерением иудеев.
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  choice: двумя новыми верёвками
  rationale: עֲבֹתִים обозначает толстые верёвки или канаты; «верёвки» — ясное современное соответствие, а «новыми» сохраняет значимую деталь повествования.
- source_word: וַיַּעֲלוּהוּ מִן הַסָּלַע
  choice: подняли со скалы
  rationale: Глагол передаёт движение вверх, а סֶלַע может обозначать скалу, утёс или каменистое укрытие. Основной текст сохраняет буквальный пространственный образ.
