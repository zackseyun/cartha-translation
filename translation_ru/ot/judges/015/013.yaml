  terminology: «Связать», «выдать в их руки», «убить», «новые верёвки» и «скала» уместны. Слово סלע следует оставить в основном тексте как «скала»; альтернативы «утёс» и «скалистое место» можно дать в сноске, не утверждая, что это было именно укрытие.
