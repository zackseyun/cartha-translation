base_translation:
  language: en
  yaml_path: translation/ot/judges/015/003.yaml
  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
translation:
  language: ru
  text: 'И Самсон сказал им: «На этот раз, когда я причиню филистимлянам вред[a][b], я не буду перед ними виноват».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделаю им зло».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский союз может также иметь оттенок «ибо, потому что»; выражение «не буду перед ними виноват» можно передать: «буду свободен от вины по отношению к филистимлянам».'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Передаёт обычное повествовательное продвижение wayyiqtol и сохраняет связность еврейского рассказа.
- source_word: לָהֶם
  choice: им
  rationale: Прямо передаёт предлог ל с суффиксом 3-го лица множественного числа.
- source_word: שִׁמְשׁוֹן
  choice: Самсон
  rationale: Общепринятая русская форма библейского имени.
- source_word: נִקֵּיתִי
  choice: на мне не будет вины
  rationale: Глагол נקה выражает свободу от вины или ответственности; такая формулировка естественно передаёт заявление Самсона о своей невиновности в предстоящем возмездии.
- source_word: הַפַּעַם
  choice: на этот раз
  rationale: Естественное временное выражение, обозначающее новый этап конфликта.
- source_word: מִפְּלִשְׁתִּים
  choice: перед филистимлянами
  rationale: После נקה предлог מן указывает на отсутствие вины по отношению к кому-либо; «перед» естественно выражает эту ответственность в русском языке.
- source_word: כִּי
  choice: если
  rationale: В данном контексте вводит обстоятельство предполагаемого действия, при котором Самсон считает себя свободным от вины; условное прочтение уместно, но не является единственно возможным.
- source_word: עֹשֶׂה אֲנִי
  choice: я причиню
  rationale: Причастие с явным местоимением может обозначать намеченное или близкое действие; будущее время естественно передаёт этот смысл по-русски.
- source_word: עִמָּם
  choice: им
  rationale: В сочетании с עשה выражает направленность действия на них.
- source_word: רָעָה
  choice: вред
  rationale: В контексте ответного враждебного действия обозначает причиняемый ущерб; «вред» не добавляет более сильной нравственной оценки, хотя буквально возможно «зло».
theological_decisions:
- issue: Оценка предстоящего поступка Самсона
  choice: Текст передаёт заявление самого Самсона об отсутствии на нём вины, не подтверждая и не опровергая его нравственную самооценку.
  alternative: Передать נִקֵּיתִי как объективное утверждение «я прав».
  rationale: Еврейский текст сообщает слова Самсона; перевод не должен превращать его субъективное оправдание в авторскую богословскую оценку.
- issue: Связь, выраженная כִּי
  choice: если
  alternative: когда; потому что
  rationale: «Если» естественно связывает заявление о невиновности с предстоящим действием, однако многозначность כִּי отмечена в сноске, чтобы не устранять синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Формулировка «на мне не будет вины» понятна широкому читателю и сохраняет юридико-нравственный оттенок исходного слова; «причиню им вред» естественно передаёт контекст враждебного возмездия.
