  text: וַ/יֹּֽאמְרוּ֙ אִ֣ישׁ יְהוּדָ֔ה לָ/מָ֖ה עֲלִיתֶ֣ם עָלֵ֑י/נוּ וַ/יֹּאמְר֗וּ לֶ/אֱס֤וֹר אֶת שִׁמְשׁוֹן֙ עָלִ֔ינוּ לַ/עֲשׂ֣וֹת ל֔/וֹ כַּ/אֲשֶׁ֖ר עָ֥שָׂה לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/010.yaml
  text: And the men of Judah said, “Why have you come up against us?” And they said, “We have come up to bind Samson, to do to him just as he did to us.”
translation:
  language: ru
  text: 'И сказали люди Иуды: «Зачем вы выступили против нас?» Они ответили: «Мы пришли связать Самсона и поступить с ним так же, как он поступил с нами».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יְהוּדָה
  choice: иудеи
  rationale: Существительное אִישׁ формально стоит в единственном числе, но при глаголе во множественном числе имеет собирательное значение. «Иудеи» естественно передаёт жителей/мужей Иуды в данном повествовательном контексте.
- source_word: לָמָה
  choice: зачем
  rationale: Вопрос относится к цели враждебного выступления, которая затем прямо названа в ответе; «зачем» естественно связывает вопрос с последующим объяснением.
- source_word: עֲלִיתֶם עָלֵינוּ
  choice: выступили против нас
  rationale: Сочетание עלה с עַל обозначает направленное против кого-либо движение. «Выступили против нас» сохраняет враждебный оттенок, не усиливая его до явного «напали».
- source_word: לֶאֱסוֹר
  choice: связать
  rationale: Инфинитив от אָסַר здесь прямо обозначает физическое связывание Самсона с целью захвата.
- source_word: עָלִינוּ
  choice: мы пришли
  rationale: Форма от עלה буквально передаёт движение вверх/сюда; в русском диалоге естественно «пришли». Пространственная деталь не акцентирована контекстом.
- source_word: לַעֲשׂוֹת לוֹ
  choice: поступить с ним
  rationale: В контексте возмездия עשה + ל означает сделать кому-либо то же самое; русское «поступить с ним» естественно и сохраняет намеренно неопределённый характер действия.
- source_word: כַּאֲשֶׁר עָשָׂה לָנוּ
  choice: так же, как он поступил с нами
  rationale: Передаёт сравнительную конструкцию и подчёркивает заявленный филистимлянами принцип ответного возмездия.
- source_word: שִׁמְשׁוֹן
  choice: Самсона
  rationale: Использована традиционная русская форма библейского имени с требуемым контекстом винительным падежом.
