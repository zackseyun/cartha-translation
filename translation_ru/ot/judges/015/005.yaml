base_translation:
  language: en
  yaml_path: translation/ot/judges/015/005.yaml
  text: He set fire to the torches and let them go into the standing grain of the Philistines[a], and burned up the shocks and the standing grain[b], and even the olive groves.
translation:
  language: ru
  text: Он зажёг факелы и выпустил лис на поля филистимлян с несжатым хлебом; так он выжег и скирды, и несжатый хлеб, и оливковые сады.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от скирды до несжатого хлеба и до оливкового сада».'
    reason: Сноска сохраняет еврейскую конструкцию «от ... до ...», тогда как основной текст передаёт перечисление повреждённых посевов и насаждений естественным русским синтаксисом.
lexical_decisions:
- source_word: וַיַּבְעֶר אֵשׁ בַּלַּפִּידִים
  choice: поджёг факелы
  rationale: Каузатив глагола בער с существительным אֵשׁ означает зажечь огонь; по-русски сочетание естественно передаётся кратко как «поджёг». לַפִּידִים может обозначать факелы или горящие головни; «факелы» ясно связано с предыдущим стихом.
- source_word: וַיְשַׁלַּח
  choice: выпустил лис
  rationale: Глагол означает «послал, отпустил, выпустил». Дополнение восстанавливается из непосредственного контекста предыдущего стиха; в русском языке оно необходимо для ясности.
- source_word: בְּקָמוֹת פְּלִשְׁתִּים
  choice: в несжатый хлеб филистимлян
  rationale: קָמָה — хлеб на корню, ещё не сжатое зерно. «Несжатый хлеб» сохраняет сельскохозяйственную конкретность и звучит естественно в повествовательном библейском регистре.
- source_word: וַיַּבְעֵר
  choice: сгорело всё
  rationale: Здесь форма описывает распространение огня и результат пожара. Безличное «сгорело» естественно по-русски, а «всё» раскрывает охват последующей конструкции «от… до…», не добавляя нового объекта.
- source_word: מִגָּדִישׁ
  choice: от сложенного в скирды хлеба
  rationale: גָּדִישׁ обозначает кучу или стог собранного зерна. Описательная передача понятнее современному читателю, чем редкие или региональные названия хлебных укладок.
- source_word: וְעַד קָמָה
  choice: до несжатого хлеба
  rationale: Сохранена еврейская конструкция пределов מִן…וְעַד («от… до…»), а также противопоставление уже собранного и ещё стоящего хлеба.
- source_word: וְעַד כֶּרֶם זָיִת
  choice: и оливковых садов
  rationale: כֶּרֶם с уточнением זַיִת обозначает насаждение масличных деревьев. В современном русском естественный эквивалент — «оливковый сад»; множественное число соответствует обобщённому масштабу ущерба.
