  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
translation:
  language: ru
  text: 'Спустя некоторое время, во время жатвы пшеницы, Самсон навестил свою жену, принеся козлёнка. Он сказал: «Позволь мне войти к моей жене, во внутреннюю комнату[a]». Но её отец не позволил ему войти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в покои». Еврейское слово обозначает внутреннее помещение; в данном контексте, вероятно, имеются в виду личные супружеские покои.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Спустя некоторое время
  rationale: Естественно передаёт еврейский оборот, обозначающий истечение неопределённого промежутка времени, без буквального и тяжеловесного «и было спустя дни».
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: во время жатвы пшеницы
  rationale: Точно сохраняет сезонный ориентир исходного текста и звучит естественно в современном русском языке.
- source_word: וַיִּפְקֹד
  choice: навестил
  rationale: В данном контексте פקד означает посещение, а не исчисление, назначение или наказание.
- source_word: אֶת אִשְׁתּוֹ
  choice: свою жену
  rationale: Передаёт прямое обозначение женщины как жены Самсона, несмотря на нарушенные отношения между ними.
- source_word: בִּגְדִי עִזִּים
  choice: принеся козлёнка
  rationale: Причастный оборот ясно показывает, что Самсон пришёл с козлёнком, вероятно как с подарком, не добавляя этого мотива прямо в текст.
- source_word: אָבֹאָה אֶל אִשְׁתִּי
  choice: Войду к моей жене
  rationale: Сохраняет направительное значение глагола и эвфемистический подтекст супружеской близости; форма первого лица передаёт волевое намерение Самсона.
- source_word: הֶחָדְרָה
  choice: во внутреннюю комнату
  rationale: Направительная форма существительного חֶדֶר указывает на вход в комнату или внутреннее помещение; перевод не сужает значение до современного понятия спальни.
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  choice: Но её отец не позволил ему войти
  rationale: Передаёт активный отказ отца допустить Самсона внутрь и сохраняет лексическую связь с предыдущим «войду».
theological_decisions:
- issue: Подразумеваемая супружеская близость
  choice: Сохранён эвфемизм «войду к моей жене во внутреннюю комнату»
  alternative: Передать смысл прямо как намерение вступить с ней в супружескую близость
  rationale: Еврейский текст выражается косвенно; перевод сохраняет его сдержанность и смысловое напряжение, а пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким повествовательным регистром. Синтаксис упрощён относительно буквальной еврейской конструкции, но ключевые повторы «войду — войти» и эвфемистическая неоднозначность сохранены. Маркер сноски поставлен при выражении, к которому относится пояснение.
