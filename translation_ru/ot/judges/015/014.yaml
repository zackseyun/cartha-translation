  variant: modern literary Russian
source:
  edition: WLC
  text: הוּא בָ֣א עַד לֶ֔חִי וּ/פִלְשִׁתִּ֖ים הֵרִ֣יעוּ לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/תִּהְיֶ֨ינָה הָ/עֲבֹתִ֜ים אֲשֶׁ֣ר עַל זְרוֹעוֹתָ֗י/ו כַּ/פִּשְׁתִּים֙ אֲשֶׁ֣ר בָּעֲר֣וּ בָ/אֵ֔שׁ וַ/יִּמַּ֥סּוּ אֱסוּרָ֖י/ו מֵ/עַ֥ל יָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
translation:
  language: ru
  text: Когда он подошёл к Лехи[a], филистимляне с криком двинулись ему навстречу. И Дух Яхве устремился на него; верёвки на его руках стали как лён, охваченный огнём, и путы на его руках растаяли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Лехи — название места. По-еврейски это слово также означает «челюсть», что важно для дальнейшего повествования.
    reason: Сноска сохраняет игру значений топонима לֶחִי и связь с челюстью осла в соседнем эпизоде.
lexical_decisions:
- source_word: לֶחִי
  choice: Лехи
  rationale: В данном контексте это название места. Связь еврейского слова со значением «челюсть» важна для ближайшего повествования и отмечена в сноске.
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  choice: с криком двинулись ему навстречу
  rationale: Форма הֵרִיעוּ обозначает громкий крик, нередко боевой или торжествующий, а לִקְרָאתוֹ — движение навстречу. Перевод сохраняет оба элемента, не уточняя сверх текста, что это был именно боевой клич.
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: Дух Яхве устремился на него
  rationale: Глагол צלח в сочетании с רוּחַ יְהוָה передаёт внезапное и мощное действие Духа. «Устремился» сохраняет динамичность еврейского выражения.
- source_word: הָעֲבֹתִים
  choice: верёвки
  rationale: Слово обозначает верёвки или толстые шнуры, которыми связывают. «Верёвки» естественно и ясно звучит по-русски.
- source_word: זְרוֹעוֹתָיו
  choice: руках
  rationale: זְרוֹעַ обозначает руку, чаще её часть от плеча до кисти. Русское «на руках» естественно в контексте связывания и не вводит излишней анатомической точности.
- source_word: כַּפִּשְׁתִּים אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  choice: как лён, охваченный огнём
  rationale: Сравнение передаёт, как верёвки мгновенно утратили прочность. Формулировка сохраняет образ льна под действием огня и остаётся естественной по-русски.
- source_word: וַיִּמַּסּוּ אֱסוּרָיו
  choice: путы растаяли
  rationale: מסס буквально передаёт таяние или растворение; «растаяли» сохраняет яркую метафору текста. אֱסוּרָיו — то, чем он был связан, поэтому выбрано «путы».
- source_word: מֵעַל יָדָיו
  choice: на его кистях
  rationale: Буквально — «с его рук». В контексте расположения пут יָדָיו может указывать на кисти; формулировка позволяет по-русски естественно завершить метафору их исчезновения, не называя запястья.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит личное имя יהוה. Транслитерация «Яхве» сохраняет различие между именем Бога и титулом «Господь».
- issue: Характер действия Духа на Самсона
  choice: Дух Яхве устремился на него
  alternative: Дух Яхве сошёл на него в силе; Дух Яхве мощно овладел им
  rationale: Перевод передаёт внезапность и силу צלח, не добавляя позднейших богословских категорий и не уточняя механизм божественного действия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис динамичен и понятен; сохранены яркие метафоры оригинала — устремление Духа и таяние пут.
