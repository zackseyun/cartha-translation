  source_fidelity: 'Смысл в целом передан точно: движение вниз, число, происхождение из Иуды, господство филистимлян, жалоба и ответная формула Самсона сохранены. Однако «расселина в скале Этам» несколько размывает цепочку определений в אֶל־סְעִיף סֶלַע עֵיטָם; безопаснее передать её как «расщелина скалы Этам», сохранив также лексическую вариативность в примечании.'
