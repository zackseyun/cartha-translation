  terminology: «Иудея», «Этам», «Самсон» и «филистимляне» употреблены последовательно. «Господствуют над нами» удачно передаёт продолжающееся владычество. Нейтральная формула «Как они поступили со мной, так и я поступил с ними» не навязывает оценки действий Самсона.
