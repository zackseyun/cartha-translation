  text: וַ/יֵּרְד֡וּ שְׁלֹשֶׁת֩ אֲלָפִ֨ים אִ֜ישׁ מִֽ/יהוּדָ֗ה אֶל סְעִיף֮ סֶ֣לַע עֵיטָם֒ וַ/יֹּאמְר֣וּ לְ/שִׁמְשׁ֗וֹן הֲ/לֹ֤א יָדַ֨עְתָּ֙ כִּֽי מֹשְׁלִ֥ים בָּ֨/נוּ֙ פְּלִשְׁתִּ֔ים וּ/מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ וַ/יֹּ֣אמֶר לָ/הֶ֔ם כַּ/אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י כֵּ֖ן עָשִׂ֥יתִי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
translation:
  language: ru
  text: 'Тогда три тысячи человек из Иудеи спустились к расщелине скалы Этам[a] и сказали Самсону: «Разве ты не знаешь, что филистимляне господствуют над нами? Что же ты с нами сделал?» Он ответил им: «Как они поступили со мной, так и я поступил с ними».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к расселине скалы Этам».'
    reason: 'Лексическая альтернатива: סְעִיף может обозначать «расщелину» или «расселину»; конструкция с סֶלַע передана как «скала Этам».'
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: спустились
  rationale: Сохраняет выраженное глаголом ירד движение вниз и естественно звучит в повествовании.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  choice: три тысячи мужей из Иудеи
  rationale: Передаёт численность и мужской состав группы; «из Иудеи» естественно обозначает их территориальную и племенную принадлежность.
- source_word: אֶל סְעִיף סֶלַע עֵיטָם
  choice: к расселине в скале Этам
  rationale: סְעִיף в данном топографическом контексте обозначает расщелину или расселину; конструкция с סֶלַע передана естественным русским сочетанием, а עֵיטָם — как топоним «Этам».
- source_word: הֲלֹא יָדַעְתָּ
  choice: Разве ты не знаешь
  rationale: Риторический вопрос с отрицанием апеллирует к общеизвестному для собеседника факту.
- source_word: כִּי מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים
  choice: что филистимляне господствуют над нами
  rationale: Причастие מֹשְׁלִים обозначает продолжающееся владычество; «господствуют над нами» сохраняет политический и угнетающий оттенок.
- source_word: וּמַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Что же ты с нами сделал?
  rationale: Передаёт буквальный вопрос «что это ты сделал нам?» и жалобу иудеев на последствия поступка Самсона для них; частица «же» естественно связывает вопрос с предыдущей репликой.
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  choice: Как они поступили со мной, так и я поступил с ними
  rationale: Сохраняет еврейскую соотносительную конструкцию и нейтрально передаёт заявленный Самсоном принцип ответного действия.
theological_decisions:
- issue: Ответ Самсона как воздаяние за причинённое ему
  choice: 'Прямая констатация: «Как они поступили со мной, так и я поступил с ними».'
  alternative: Истолковать его слова либо как правомерное возмездие, либо как предосудительную личную месть.
  rationale: Сам стих приводит объяснение Самсона, но прямо не даёт ему нравственной оценки. Нейтральная формулировка сохраняет заложенное в повествовании богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя без устранения лаконичности и неоднозначности оригинала.
