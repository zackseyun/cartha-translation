  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ שִׁמְשׁ֔וֹן אִֽם תַּעֲשׂ֖וּ/ן כָּ/זֹ֑את כִּ֛י אִם נִקַּ֥מְתִּי בָ/כֶ֖ם וְ/אַחַ֥ר אֶחְדָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/007.yaml
  text: And Samson said to them, “If this is what you do, then I swear I will take vengeance on you, and after that I will stop.”
translation:
  language: ru
  text: 'И Самсон сказал им: «Если вы так поступаете, то непременно отомщу вам, а после этого остановлюсь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם תַּעֲשׂוּן כָּזֹאת
  choice: Если вы так поступаете
  rationale: Передаёт условную конструкцию и указание на совершённое филистимлянами действие естественным современным русским языком.
- source_word: כִּי אִם נִקַּמְתִּי בָכֶם
  choice: то не успокоюсь, пока не отомщу вам
  rationale: Идиоматически передаёт усилительно-ограничительную конструкцию כי אם и перфект с будущей направленностью, не превращая её без достаточных оснований в формальную клятву.
- source_word: וְאַחַר אֶחְדָּל
  choice: а после этого остановлюсь
  rationale: Сохраняет буквальный смысл חדל — прекратить действие, перестать — и не уточняет, что именно Самсон прекратит.
theological_decisions:
- issue: Является ли выражение формальной клятвой
  choice: Не обозначать речь Самсона словом «клянусь»
  alternative: '«то клянусь: я отомщу вам»'
  rationale: В еврейском тексте отсутствует явная формула клятвы; כי אם выражает решительное ограничение или уверение. Перевод сохраняет силу высказывания без добавления формальной клятвы.
- issue: Неопределённый объект прекращения действия
  choice: «остановлюсь» без пояснения
  alternative: «перестану мстить» или «оставлю вас в покое»
  rationale: Исходный текст не называет объекта глагола אֶחְדָּל; уточнение преждевременно разрешило бы намеренную или контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; реплика звучит решительно и достойно, без архаической формулы «если вы так делаете» и без добавления отсутствующей в оригинале явной клятвы.
