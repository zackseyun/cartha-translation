  text: And when he had finished speaking[a], he threw the jawbone from his hand, and he called that place Ramath-lehi.
translation:
  language: ru
  text: Когда он закончил говорить, то бросил челюсть, которую держал в руке, и назвал то место Рамат-Лехи[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Рамат-Лехи», вероятно, означает «Холм челюсти» или «Возвышенность челюсти»; здесь сохраняется игра слов с древнееврейским словом лехи — «челюсть».
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: когда он закончил говорить
  rationale: Сочетание כְּ с инфинитивом כַּלֹּתוֹ и לְדַבֵּר имеет временное значение; выбран естественный русский оборот, сохраняющий последовательность событий.
- source_word: וַיַּשְׁלֵךְ הַלְּחִי מִיָּדוֹ
  choice: бросил ослиную челюсть, которую держал в руке
  rationale: הַלְּחִי в контексте означает ослиную челюсть, служившую Самсону оружием. Придаточный оборот естественно передаёт буквальное מִיָּדוֹ, «из его руки», избегая неидиоматичного русского выражения «бросил из руки».
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: назвал то место
  rationale: В конструкции наречения имени קרא естественно передаётся русским «назвал»; указательное הַהוּא сохранено как «то».
- source_word: רָמַת לֶחִי
  choice: Рамат-Лехи
  rationale: Название места транслитерировано с древнееврейского; связанная с לֶחִי игра слов пояснена в сноске.
