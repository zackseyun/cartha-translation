  text: וַ/יֹּ֣אמֶר אָבִ֗י/הָ אָמֹ֤ר אָמַ֨רְתִּי֙ כִּי שָׂנֹ֣א שְׂנֵאתָ֔/הּ וָ/אֶתְּנֶ֖/נָּה לְ/מֵרֵעֶ֑/ךָ הֲ/לֹ֨א אֲחֹתָ֤/הּ הַ/קְּטַנָּה֙ טוֹבָ֣ה מִמֶּ֔/נָּה תְּהִי נָ֥א לְ/ךָ֖ תַּחְתֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
translation:
  language: ru
  text: 'Её отец сказал: «Я был уверен, что ты возненавидел её, и потому отдал её твоему товарищу[a]. Разве её младшая сестра не лучше неё? Пусть же она станет твоей вместо неё».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «твоему другу». Еврейское слово может обозначать друга, товарища или спутника; в контексте свадьбы некоторые понимают его как человека, сопровождавшего Самсона на брачном пире.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמֹר אָמַרְתִּי
  choice: Я был уверен
  rationale: Сочетание инфинитива абсолютного с личной формой усиливает высказывание; по-русски уверенность отца естественно и ясно передаёт эту эмфазу.
- source_word: שָׂנֹא שְׂנֵאתָהּ
  choice: ты возненавидел её
  rationale: Эмфатическая конструкция указывает на решительное, полное отвержение; русский глагол совершенного вида «возненавидел» передаёт наступившее отношение, не утяжеляя реплику наречиями.
- source_word: וָאֶתְּנֶנָּה
  choice: и потому отдал её
  rationale: Последовательная форма с ו в контексте выражает действие, последовавшее из предположения отца; «потому» делает причинно-следственную связь явной и естественной по-русски.
- source_word: לְמֵרֵעֶךָ
  choice: твоему товарищу
  rationale: מֵרֵעַ обозначает товарища, спутника или друга. «Товарищ» сохраняет широту значения и не навязывает специальную свадебную роль.
- source_word: אֲחֹתָהּ הַקְּטַנָּה
  choice: её младшая сестра
  rationale: В контексте родства קְטַנָּה естественно означает младшую по возрасту.
- source_word: טוֹבָה מִמֶּנָּה
  choice: лучше неё
  rationale: טוֹבָה выражает общее превосходство; перевод не сужает смысл до внешней привлекательности.
- source_word: תְּהִי נָא לְךָ
  choice: Пусть же она станет твоей
  rationale: Побудительная форма היה с נָא передаёт просьбу или настойчивое предложение. «Пусть же» сохраняет побудительный оттенок в достойном современном русском регистре.
- source_word: תַּחְתֶּיהָ
  choice: вместо неё
  rationale: תַּחַת здесь выражает замещение; это прямой и идиоматичный русский эквивалент.
theological_decisions: []
