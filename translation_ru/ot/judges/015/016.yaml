lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вайиктоль с וַ продолжает повествовательную последовательность; обычная русская библейская формула «И сказал» естественно сохраняет связь с предыдущим событием.
- source_word: שִׁמְשׁוֹן
  choice: Самсон
  rationale: Устоявшаяся русская передача имени.
- source_word: בִּלְחִי הַחֲמוֹר
  choice: ослиной челюстью
  rationale: בְּ обозначает орудие действия, а לְחִי здесь означает челюсть как кость, использованную в качестве оружия. Компактная русская конструкция передаёт инструментальный смысл и подходит поэтической реплике.
- source_word: חֲמוֹר חֲמֹרָתָיִם
  choice: груда, две груды
  rationale: Передача сохраняет необычную числовую форму и образ нагромождённых тел, не сглаживая трудную игру слов между חֲמוֹר «осёл» и созвучным обозначением груды.
- source_word: הִכֵּיתִי
  choice: я сразил
  rationale: Глагол נכה означает «ударить, поразить» и в данном контексте подразумевает смертельное поражение; «сразил» сохраняет воинственный смысл без излишней конкретизации.
- source_word: אֶלֶף אִישׁ
  choice: тысячу человек
  rationale: Собирательное אִישׁ после числительного естественно передаётся по-русски словом «человек»; контекст ясно указывает на мужчин-противников.
