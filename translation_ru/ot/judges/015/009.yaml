  text: וַ/יַּעֲל֣וּ פְלִשְׁתִּ֔ים וַֽ/יַּחֲנ֖וּ בִּ/יהוּדָ֑ה וַ/יִּנָּטְשׁ֖וּ בַּ/לֶּֽחִי׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/009.yaml
  text: Then the Philistines went up and camped in Judah[a], and spread out at Lehi.
translation:
  language: ru
  text: Тогда филистимляне поднялись, расположились станом в Иудее и развернулись у Лехи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рассеялись у Лехи». Еврейский глагол может обозначать рассредоточение или развёртывание войска.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: поднялись
  rationale: Сохраняет обычное повествовательное и направительное значение עלה; в данном контексте движение также имеет военный характер, но глагол сам по себе не требует перевода «выступили».
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Устоявшееся современное русское обозначение этого народа.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Передаёт значение חנה — остановиться и разбить лагерь — в естественном, но достойном повествовательном регистре.
- source_word: בִּיהוּדָה
  choice: в Иудее
  rationale: Предлог ב здесь естественнее всего указывает на место; враждебная направленность понятна из контекста и не требует перевода «против Иуды».
- source_word: וַיִּנָּטְשׁוּ
  choice: развернулись
  rationale: В военном контексте форма от נטשׁ описывает рассредоточение или развёртывание войска; «развернулись» передаёт этот оттенок кратко и естественно.
- source_word: בַּלֶּחִי
  choice: у Лехи
  rationale: Лехи здесь — название места; «у Лехи» естественно обозначает позицию войска возле данного пункта.
