  yaml_path: translation/ot/judges/015/012.yaml
  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: ru
  text: 'Они сказали ему: «Мы пришли связать тебя и предать в руки филистимлян». Самсон сказал им: «Поклянитесь мне, что вы сами не нападёте на меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְתִתְּךָ בְּיַד פְּלִשְׁתִּים
  choice: предать в руки филистимлян
  rationale: Естественно передаёт древнееврейскую формулу со значением передачи под власть противника, сохраняя образ рук во множественном числе, нормативный для русского языка.
- source_word: תִּפְגְּעוּן בִּי
  choice: нападёте на меня
  rationale: Глагол פגע в данном контексте означает враждебно наброситься или применить силу; «нападёте» ясно выражает смысл без ненужного уточнения способа нападения.
- source_word: אַתֶּם
  choice: вы сами
  rationale: 'Сохраняет эмфатическое независимое местоимение: Самсон требует гарантии именно от своих соплеменников.'
theological_decisions:
- issue: Характер обещания и опасение Самсона
  choice: «вы сами не нападёте на меня»
  alternative: «вы сами не убьёте меня»
  rationale: Источник говорит шире о нападении или применении силы и не ограничивает действие убийством; перевод сохраняет эту смысловую широту и напряжение повествования.
translation_notes:
  register: Современный литературный русский язык; прямая речь звучит естественно и достойно. Синтаксический повтор «связать тебя и предать» сохраняет последовательность действий исходного текста.
