base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
translation:
  language: ru
  text: И пошёл Шимшон, поймал триста лисиц[a], взял факелы, развернул их хвостами друг к другу и поместил по факелу между хвостами каждой пары, посередине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шакалов». Еврейское слово שׁוּעָלִים может обозначать лисиц или близких к ним псовых; в основном тексте сохранён наиболее распространённый перевод «лисиц».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Обычная передача повествовательной формы глагола הלך, продолжающей последовательность действий.
- source_word: שִׁמְשׁוֹן
  choice: Шимшон
  rationale: Транслитерация еврейского имени, сохраняющая его исходное звучание ближе, чем традиционная русская форма «Самсон».
- source_word: וַיִּלְכֹּד
  choice: поймал
  rationale: В данном контексте לכד означает поимку живых животных; «поймал» естественно и точно передаёт действие.
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: триста
  rationale: Прямая передача количественного числительного.
- source_word: שׁוּעָלִים
  choice: лисиц
  rationale: «Лисицы» — традиционное и наиболее распространённое значение; возможное значение «шакалы» сохранено в сноске.
- source_word: לַפִּדִים / לַפִּיד
  choice: факелы / факел
  rationale: Слово обозначает факелы или горящие головни; «факел» ясно и естественно для современного читателя.
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  choice: повернул их хвост к хвосту
  rationale: Сохраняет буквальное значение פנה «повернуть» и не добавляет отсутствующего в тексте указания, что хвосты были связаны.
- source_word: וַיָּשֶׂם לַפִּיד אֶחָד
  choice: поместил по одному факелу
  rationale: Передаёт повторяющееся действие над каждой парой животных, подразумеваемое контекстом.
- source_word: בֵּין שְׁנֵי הַזְּנָבוֹת
  choice: между двумя хвостами каждой пары
  rationale: Буквально «между двумя хвостами»; добавление «каждой пары» естественно раскрывает повторяемую конструкцию, не меняя смысла.
- source_word: בַּתָּוֶךְ
  choice: посередине
  rationale: Точно передаёт уточнение места и сохраняет его отдельный акцент в конце предложения.
