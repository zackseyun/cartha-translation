translation_notes:
  register: Современный литературный русский язык с простой повествовательной последовательностью. Сохранено начальное «И», отражающее связь стиха с предшествующим рассказом. Формулировка не добавляет, что животные были связаны за хвосты, поскольку еврейский текст прямо этого не говорит.
