  text: And he struck them hip and thigh with a great slaughter[a], and he went down and stayed in the cleft of the rock of Etam.
translation:
  language: ru
  text: Он поразил их в голень и в бедро, нанеся им тяжёлое поражение[a]. Затем он спустился и остался в расселине скалы Эйтама.
