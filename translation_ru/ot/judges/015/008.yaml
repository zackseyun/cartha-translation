    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: поразил
  rationale: Глагол נכה означает «ударить, поразить»; такой перевод сохраняет действие и не утверждает, что каждый противник был убит.
- source_word: שׁוֹק עַל יָרֵךְ
  choice: голень по бедру
  rationale: Неясный древнееврейский оборот передан близко к его конкретному образу, без сведения спорного смысла к одному толкованию; вероятная идиоматическая сила пояснена в сноске.
- source_word: מַכָּה גְדוֹלָה
  choice: тяжёлое поражение
  rationale: В военном контексте מַכָּה может обозначать не только удар, но и разгром или поражение. Формулировка естественна по-русски, передаёт силу גְדוֹלָה и не усиливает текст до однозначного поголовного истребления.
- source_word: וַיֵּרֶד
  choice: спустился
  rationale: Сохраняет направленность движения и естественно звучит в русском повествовании.
- source_word: וַיֵּשֶׁב
  choice: остался
  rationale: ישׁב допускает значения «сидеть, жить, оставаться». Здесь «остался» естественно обозначает пребывание в убежище, не определяя его продолжительность.
- source_word: בִּסְעִיף סֶלַע
  choice: в расселине скалы
  rationale: סְעִיף здесь обозначает расщелину или расселину, а סֶלַע — скалу; сочетание передаёт скальное укрытие ясным современным языком.
- source_word: עֵיטָם
  choice: Этам
  rationale: Название места передано русской транслитерацией.
