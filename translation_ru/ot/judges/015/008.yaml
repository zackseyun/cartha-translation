  source_fidelity: 'Основной смысл передан верно: Самсон наносит тяжёлое поражение, затем спускается и остаётся в скальном убежище. Однако сочетание «голень по бедру» неудачно передаёт спорный оборот שׁוֹק עַל־יָרֵךְ: оно по-русски звучит как описание способа удара и при этом неточно оформлено как буквальный эквивалент עַל («на/над»).'
  naturalness: «Голень по бедру» неестественно для современного литературного русского. «В голень и в бедро» сохраняет конкретный телесный образ, остаётся достаточно прозрачным и не выдаёт спорное идиоматическое значение за несомненное. В исходном тексте также требуется родительный падеж топонима после слова «скалы».
  terminology: '«Поразил», «тяжёлое поражение», «расселина скалы» и «остался» уместны. Топоним следует передать как «Эйтам» и склонить: «скалы Эйтама»; это ближе к еврейской форме עֵיטָם и грамматически нормально по-русски.'
