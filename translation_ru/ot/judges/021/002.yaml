lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: пришёл народ
  rationale: Глагол בוא обозначает прибытие, а собирательное הָעָם естественно передаётся существительным «народ» в единственном числе.
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: Это географическое название; использована традиционная русская библейская форма.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: там они сидели
  rationale: ישב допускает значения «сидеть, оставаться, пребывать»; конкретное «сидели» сохраняет телесный и длительный характер действия.
- source_word: עַד הָעֶרֶב
  choice: до вечера
  rationale: Прямой и естественный перевод временного оборота.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: пред Богом
  rationale: Сохраняется формула присутствия לִפְנֵי и обозначение אֱלֹהִים; имя Яхве в исходном тексте здесь отсутствует.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: возвысили голос
  rationale: Русский устойчивый оборот близко передаёт еврейское «подняли свой голос»; единственное число сохраняет собирательную форму קוֹלָם.
- source_word: וַיִּבְכּוּ בְּכִי גָדוֹל
  choice: горько плакали
  rationale: Однокоренная конструкция усиливает действие. «Горько плакали» естественно выражает сильный плач, не сводя его непременно к громкости.
theological_decisions:
- issue: Передача הָאֱלֹהִים в культовом контексте
  choice: Богом
  alternative: Господом
  rationale: В масоретском тексте стоит אֱלֹהִים, а не тетраграмматон; перевод не гармонизирует это обозначение с именем Господа.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. «Пред Богом» и «возвысили голос» сохраняют достоинство и образность оригинала; необычная однокоренная конструкция разъяснена в сноске.
