  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
translation:
  language: ru
  text: И народ пришёл в Вефиль и сидел там перед Богом до вечера; они подняли голос и горько плакали.[a]
  philosophy: optimal-equivalence
  footnotes:
