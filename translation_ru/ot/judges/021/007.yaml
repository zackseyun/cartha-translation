base_translation:
  language: en
  yaml_path: translation/ot/judges/021/007.yaml
  text: What shall we do for them—for those who remain—to get wives? For we have sworn by Yahweh not to give them any of our daughters as wives.
translation:
  language: ru
  text: Что нам сделать для них — для тех, кто остался, — чтобы у них были жёны?[a][b] Ведь мы поклялись именем Яхве[c] не отдавать им в жёны никого из наших дочерей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «для жён»; еврейское выражение эллиптично, и в основном тексте подразумеваемый смысл передан словами «чтобы у них были жёны».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для уцелевших».'
    reason: alternative_reading
  - marker: c
    text: 'Традиционно: «Господом»; также встречается передача «Иеговой».'
    reason: alternative_reading
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה
  choice: Что нам сделать
  rationale: Вопросительное מַה с имперфектом 1-го лица множественного числа выражает совместное обдумывание дальнейших действий; русское «Что нам сделать» передаёт этот оттенок естественно и кратко.
- source_word: לָהֶם לַנּוֹתָרִים
  choice: для них — для тех, кто остался
  rationale: 'Двойное ל сохраняется как пояснительное присоединение: местоимение «для них» уточняется оборотом «для тех, кто остался». Это отражает структуру еврейского текста и указывает на оставшихся мужчин из колена Вениамина.'
- source_word: לְנָשִׁים
  choice: чтобы у них были жёны
  rationale: Буквально краткое и эллиптическое «для жён». В русском для ясности восполнена подразумеваемая цель, но сама эллиптичность отмечена в сноске.
- source_word: וַאֲנַחְנוּ נִשְׁבַּעְנוּ
  choice: Ведь мы поклялись
  rationale: Союз ו здесь вводит причину затруднения. «Ведь» естественно передаёт пояснительно-причинную связь; прошедшее «поклялись» обозначает ранее данную и всё ещё обязательную клятву.
- source_word: בַיהוָה
  choice: Яхве
  rationale: Предлог ב в формуле клятвы передан русским «поклялись Яхве». Тетраграмматон воспроизведён как личное имя «Яхве».
- source_word: לְבִלְתִּי תֵּת
  choice: не отдавать
  rationale: Конструкция указывает на содержание клятвы. Глагол «отдавать» в русском естественен в контексте выдачи дочерей замуж.
- source_word: מִבְּנוֹתֵינוּ
  choice: никого из наших дочерей
  rationale: Предлог מִן имеет партитивное значение — «из числа наших дочерей»; отрицательное «никого из» точно и идиоматично передаёт этот смысл.
- source_word: לְנָשִׁים
  choice: в жёны
  rationale: При глаголе «отдавать» русское устойчивое выражение «отдавать в жёны» ясно обозначает вступление в брак.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В основном тексте сохранено личное заветное имя, непосредственно стоящее в еврейском оригинале. Традиционная замена титулом указана в сноске, без навязывания конфессионального прочтения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Пояснительное тире сохраняет заметную в оригинале конструкцию «для них — для оставшихся», а «Ведь» ясно показывает причинную связь со второй частью стиха.
