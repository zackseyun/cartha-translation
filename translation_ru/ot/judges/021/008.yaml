base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
translation:
  language: ru
  text: 'И они сказали: «Которое из колен Израиля не поднялось к Яхве в Мицпу[a]?» И вот, из Иависа Галаадского в стан, на собрание, не пришёл ни один человек[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не явилось пред Яхве в Мицпе»; еврейское выражение может обозначать явление пред Яхве на месте собрания.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «не пришёл человек»; единственное число подчёркивает, что оттуда не пришёл никто.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И они сказали
  rationale: Передаёт обычное повествовательное продвижение wayyiqtol без добавления более сильного временного оттенка.
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: Кто из колен Израиля
  rationale: Естественный русский вопрос об одной отсутствовавшей группе из совокупности колен; единственное число сохраняется в вопросительном «кто».
- source_word: לֹא עָלָה
  choice: не поднялся
  rationale: Сохраняет обычное для עלה значение движения вверх, в том числе к месту священного собрания.
- source_word: אֶל יְהוָה הַמִּצְפָּה
  choice: к Яхве в Мицпу
  rationale: 'Прямо передаёт оба элемента направления: к Яхве и в Мицпу; не устраняет возможную смысловую напряжённость конструкции.'
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Естественно передаёт указатель на неожиданно установленный факт.
- source_word: לֹא בָא אִישׁ
  choice: не пришёл ни один человек
  rationale: Русская отрицательная конструкция сохраняет усиленный смысл полного отсутствия, выраженный еврейским единственным числом אִישׁ.
- source_word: מִיָּבֵישׁ גִּלְעָד
  choice: из Иависа Галаадского
  rationale: Передаёт происхождение и использует укоренившуюся русскую библейскую форму топонима.
- source_word: אֶל הַמַּחֲנֶה ... אֶל הַקָּהָל
  choice: в стан, на собрание
  rationale: Сохраняет два координированных обозначения назначения, делая их связь естественной по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон; личное имя передано транслитерацией без замены титулом.
- issue: Связь אֶל יְהוָה с местом собрания
  choice: к Яхве в Мицпу
  alternative: пред Яхве в Мицпе
  rationale: Основной текст сохраняет прямое значение предлога אֶל и направление движения; альтернативное понимание как явления пред Яхве возможно, но не навязывается.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис слегка формален, но понятен; «стан» и традиционные формы «Мицпа», «Иавис Галаадский» сохраняют библейский регистр. Маркер сноски помещён непосредственно после выражения, которое он поясняет.
