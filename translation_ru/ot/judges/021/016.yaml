  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
translation:
  language: ru
  text: 'Тогда старейшины общины сказали: «Что нам делать, чтобы у оставшихся в живых были жёны, ведь женщины из колена Вениамина истреблены?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ведь из Вениамина истреблена женщина»; единственное число «женщина» употреблено собирательно — о женщинах колена Вениамина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  choice: старейшины общины
  rationale: Сочетание означает старейшин собравшегося сообщества; «община» естественно передаёт его корпоративный смысл и не придаёт ему узкоцерковного оттенка.
- source_word: מַה נַּעֲשֶׂה ... לְנָשִׁים
  choice: Как нам найти жён
  rationale: Буквально вопрос звучит как «что нам сделать... относительно жён»; в данном контексте речь идёт о том, как обеспечить оставшихся вениамитян жёнами. «Найти» естественно выражает подразумеваемое действие, не скрывая совещательного характера вопроса.
- source_word: לַנּוֹתָרִים
  choice: для оставшихся в живых
  rationale: Причастная форма обозначает тех, кто уцелел после истребления; добавление «в живых» ясно передаёт контекстуальный смысл.
- source_word: כִּי
  choice: ведь
  rationale: Союз вводит основание поставленного вопроса; «ведь» естественно передаёт причинно-пояснительную связь в русском диалоге.
- source_word: נִשְׁמְדָה
  choice: истреблены
  rationale: Nifal глагола שׁמד выражает уничтожение или истребление; слово сохраняет суровость исходного высказывания.
- source_word: מִבִּנְיָמִן אִשָּׁה
  choice: женщины из колена Вениамина
  rationale: В еврейском тексте «женщина» стоит в единственном числе, но употреблена собирательно. «Из колена Вениамина» в современном русском яснее, чем двусмысленное «из Вениамина», и соответствует племенному обозначению.
