revisions:
- from: И нашли среди жителей Иависа Галаадского четыреста молодых женщин, девственниц, которые не познали мужчины, разделив с ним ложе; и привели их в стан в Силоме, что в земле Ханаанской.
  to: Среди жителей Иависа Галаадского нашли четыреста молодых женщин, девственниц, которые не познали мужчины, не вступав в близость с мужчиной; и привели их в лагерь в Силоме, что в земле Ханаанской.
  rationale: Уточнена передача сексуального эвфемизма без добавления деталей и без сглаживания двойной характеристики женщин. «Стан» заменён на естественное современное «лагерь»; топонимы и географическое определение сохранены.
