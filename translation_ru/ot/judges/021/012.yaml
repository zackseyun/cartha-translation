base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: ru
  text: Среди жителей Иависа Галаадского нашли четыреста молодых женщин, девственниц, которые не познали мужчины, не вступав в близость с мужчиной; и привели их в лагерь в Силоме, что в земле Ханаанской.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  choice: среди жителей Иависа Галаадского
  rationale: Естественно передаёт исходную группу, внутри которой нашли женщин; מִן здесь может иметь партитивное значение.
- source_word: נַעֲרָה בְתוּלָה
  choice: молодых женщин, девственниц
  rationale: 'Сохраняет оба определения: возрастно-социальное נַעֲרָה и отдельное указание בְתוּלָה.'
- source_word: לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  choice: не познали мужчины, разделив с ним ложе
  rationale: Сохраняет библейский эвфемизм «познать» и ясно передаёт отсутствие половой связи без неестественного буквального выражения «ложе мужчины».
- source_word: שִׁלֹה
  choice: Силоме
  rationale: Традиционная русская форма топонима Силом с требуемым предложным падежом.
- source_word: אֶרֶץ כְּנָעַן
  choice: земле Ханаанской
  rationale: Устоявшаяся и понятная русская библейская форма географического названия.
theological_decisions:
- issue: Характер утверждения о девственности пленённых женщин
  choice: Сохранены и существительное «девственницы», и пояснение об отсутствии половой связи
  alternative: Свести оба выражения к одному слову «девственницы»
  rationale: Еврейский текст намеренно содержит оба элемента; их сохранение не сглаживает повтор и не добавляет оценки описываемым событиям.
translation_notes:
  register: 'Современный литературный русский с умеренно библейским достоинством. Синтаксис близок к еврейскому повествованию, но устранена неестественная буквальность. Нравственная оценка насилия не добавлена: стих передан как повествовательное описание.'
