  to: 'И когда их отцы или братья придут спорить с нами[a], мы скажем им: «Дайте их нам как милость[b], ведь мы не взяли в битве каждому по жене[c]. Вы ведь не отдали им этих женщин[d], иначе теперь были бы виновны[e]».'
  rationale: Перевод исправлен там, где первоначальная русская формулировка меняла синтаксическую роль женщин в просьбе «хָנּוּנוּ אֹתָם». Выбранное «Дайте их нам как милость» передаёт просьбу о предоставлении женщин, не приписывая ей одобрения. «Взяли» заменяет интерпретирующее «добыли», а «не отдали» отражает еврейский перфект. Трудность заключительной клаузулы сохранена посредством контрфактического «иначе» и отмечена в сноске.
