  text: וְ/הָיָ֡ה כִּֽי יָבֹ֣אוּ אֲבוֹתָ/ם֩ א֨וֹ אֲחֵי/הֶ֜ם ל/רוב אֵלֵ֗י/נוּ וְ/אָמַ֤רְנוּ אֲלֵי/הֶם֙ חָנּ֣וּ/נוּ אוֹתָ֔/ם כִּ֣י לֹ֥א לָקַ֛חְנוּ אִ֥ישׁ אִשְׁתּ֖/וֹ בַּ/מִּלְחָמָ֑ה כִּ֣י לֹ֥א אַתֶּ֛ם נְתַתֶּ֥ם לָ/הֶ֖ם כָּ/עֵ֥ת תֶּאְשָֽׁמוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
translation:
  language: ru
  text: 'И когда их отцы или братья придут спорить с нами[a], мы скажем им: «Дайте их нам как милость[b], ведь мы не взяли в битве каждому по жене[c]. Вы ведь не отдали им этих женщин[d], иначе теперь были бы виновны[e]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «придут предъявлять нам претензии» либо «придут судиться с нами».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «окажите нам милость [относительно] их». В данном контексте просьба, вероятно, означает: «отдайте женщин нам как милость».'
    reason: lexical_alternative
  - marker: c
    text: 'Еврейская фраза очень сжата: «мы не взяли в битве каждому его жену». Возможный смысл: во время войны не были взяты жёны для всех мужчин Вениамина.'
    reason: cultural_note
  - marker: d
    text: 'Буквально: «вы не отдали их им»; еврейский текст компактно повторяет местоимения. Речь идёт о женщинах и вениамитянах соответственно.'
    reason: lexical_alternative
  - marker: e
    text: 'Заключительная еврейская фраза трудна. Вероятный смысл: если бы родственники сами отдали женщин, то теперь они были бы виновны, вероятно, в связи с данной Израилем клятвой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרִיב
  choice: спорить с нами
  rationale: Глагол ריב обозначает спор, тяжбу или предъявление претензии. «Спорить с нами» сохраняет конфликтный оттенок, не придавая выражению чрезмерно узкого юридического смысла.
- source_word: חָנּוּנוּ אוֹתָם
  choice: Будьте милостивы к нам ради этих женщин
  rationale: Императив חנן с суффиксом первого лица множественного числа буквально выражает просьбу о милости к говорящим; следующий объект женского рода связывает просьбу с женщинами. Русская формулировка сохраняет оба элемента.
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  choice: мы не добыли в битве жену для каждого
  rationale: Сжатая еврейская конструкция, вероятно, означает, что захваченных после войны женщин оказалось недостаточно, чтобы дать жену каждому вениамитянину. «Добыли» передаёт получение в результате военных действий, не скрывая суровости контекста.
- source_word: לֹא אַתֶּם נְתַתֶּם לָהֶם
  choice: Вы же не отдавали им этих женщин
  rationale: Подчёркнутое אַתֶּם противопоставляет официальную передачу женщин их семьями тому, как вениамитяне фактически получили их. Повтор еврейских местоимений раскрыт естественно для русского языка.
- source_word: כָּעֵת תֶּאְשָׁמוּ
  choice: иначе теперь оказались бы виновны
  rationale: Заключительная фраза синтаксически трудна. В контексте она указывает, что родственники не нарушили клятву, поскольку сами не отдавали женщин; условно-результативное «иначе» делает эту связь понятной, а «теперь» передаёт כָּעֵת.
theological_decisions:
- issue: Виновность родственников в связи с клятвой Израиля
  choice: 'Предложение передаёт довод старейшин: родственники не виновны, поскольку не отдавали женщин сами.'
  alternative: Понять фразу как прямое утверждение, что родственники теперь виновны.
  rationale: Контекст Суд 21:18–23 и противопоставление «вы не отдавали» поддерживают условно-контрфактический смысл, однако трудность еврейской фразы отмечена в сноске, а нравственная оценка самого замысла в перевод не добавляется.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным, но спорные места исходного текста не сглажены без пояснений; нравственная оценка описываемых действий не внесена в сам перевод.
