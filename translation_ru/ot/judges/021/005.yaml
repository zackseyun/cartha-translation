source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֠י אֲשֶׁ֨ר לֹא עָלָ֧ה בַ/קָּהָ֛ל מִ/כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּי֩ הַ/שְּׁבוּעָ֨ה הַ/גְּדוֹלָ֜ה הָיְתָ֗ה לַ֠/אֲשֶׁר לֹא עָלָ֨ה אֶל יְהוָ֧ה הַ/מִּצְפָּ֛ה לֵ/אמֹ֖ר מ֥וֹת יוּמָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/005.yaml
  text: And the sons of Israel said[a], “Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?” For the great oath had been made concerning whoever did not come up to Yahweh at Mizpah, saying[b], “He shall surely be put to death.”
translation:
  language: ru
  text: 'И сказали сыны Израиля[a]: «Кто из всех колен Израиля не пришёл к Яхве на собрание?» Ведь великая клятва была принесена относительно всякого, кто не пришёл к Яхве в Мицпу: «Он непременно будет предан смерти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет мужское корпоративное выражение и узнаваемую библейскую формулу; более естественный вариант «израильтяне» указан в сноске.
- source_word: מִי אֲשֶׁר
  choice: кто
  rationale: В русском языке простое «кто» естественно передаёт вопрос об участнике, соответствующем указанному признаку.
- source_word: לֹא עָלָה
  choice: не пришёл / не придёт
  rationale: Глагол עלה буквально означает движение вверх, но в контексте прибытия на общее собрание естественно переводится «прийти»; смена времени во второй части отражает применимость клятвы к любому неявившемуся.
- source_word: בַקָּהָל
  choice: на собрание
  rationale: קהל обозначает собравшуюся общину; русское «на собрание» естественно выражает участие в созванном собрании, хотя предлог ב буквально допускает «в собрании».
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Прямо передаёт предлог אֶל и личное имя יהוה, не заменяя его титулом.
- source_word: הַשְּׁבוּעָה הַגְּדוֹלָה
  choice: великая клятва
  rationale: Формально сохраняет существительное и прилагательное, не сужая значение до «торжественной» или «страшной» клятвы.
- source_word: הָיְתָה לַאֲשֶׁר
  choice: о всяком ... была дана
  rationale: Естественно передаёт отнесённость клятвы к тому, кто не явился, не переопределяя неясную функцию предлога ל.
- source_word: הַמִּצְפָּה
  choice: в Мицпу
  rationale: Направительное значение конечного ה и контекст прибытия поддерживают форму направления «в Мицпу».
- source_word: לֵאמֹר
  choice: двоеточие
  rationale: Содержание клятвы естественно вводится в русском двоеточием без механического «говоря».
- source_word: מוֹת יוּמָת
  choice: непременно будет предан смерти
  rationale: Сохраняет усиление инфинитивом абсолютным и пассивно-судебный смысл формы יוּמָת.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Текст содержит тетраграмматон как личное имя; «Яхве» непосредственно его передаёт, тогда как «Господь» является заменой именем-титулом.
- issue: Мужское корпоративное выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / дети Израиля
  rationale: Основной текст сохраняет грамматически мужскую и формально родственную образность источника, а естественный корпоративный эквивалент отмечен в сноске.
- issue: Юридическая сила מוֹת יוּמָת
  choice: будет предан смерти
  alternative: умрёт
  rationale: Пассивная форма в контексте общей клятвы указывает на назначенное людьми смертное наказание, а не просто на факт смерти.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. «Сыны Израиля» сознательно сохраняет формулу оригинала; остальной синтаксис сделан естественным для современного читателя. Имя Яхве передано непосредственно. Подлинная образность «великой клятвы» сохранена без истолковывающей замены.
