  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
translation:
  language: ru
  text: 'Наблюдайте, и вот: когда дочери Силома выйдут танцевать, выйдите из виноградников и схватите[a] себе каждый по жене из дочерей Силома, а затем идите в землю Вениамина.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утащите», «уведите силой»; еврейский глагол означает резкое, насильственное взятие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Наблюдайте
  rationale: В последовательности наставлений форма буквально означает «и увидите», но по функции призывает внимательно следить, ожидая подходящего момента.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохранён древнееврейский указатель внимания, подчёркивающий наступление ожидаемой ситуации.
- source_word: אִם
  choice: когда
  rationale: Хотя частица имеет условное значение «если», здесь речь идёт о предполагаемом моменте исполнения заранее составленного плана; «когда» естественно передаёт контекстуальный смысл, не устраняя полностью оттенок ожидания.
- source_word: בְנוֹת שִׁילוֹ
  choice: дочери Силома
  rationale: Сохранён исходный общественно-географический оборот без уточнения возраста женщин.
- source_word: לָחוּל בַּמְּחֹלוֹת
  choice: водить хороводы
  rationale: Глагол и существительное описывают танцы; русский оборот естественно передаёт совместный, вероятно круговой танец, не превращая его в сценическое представление.
- source_word: וַחֲטַפְתֶּם
  choice: схватите
  rationale: Глагол обозначает резкое, насильственное завладение. «Схватите» сохраняет эту силу, не добавляя современную юридическую квалификацию.
- source_word: אִישׁ אִשְׁתּוֹ
  choice: каждый по жене
  rationale: Естественный русский распределительный оборот точно передаёт, что каждому мужчине предписано взять одну женщину в жёны.
- source_word: אֶרֶץ בִּנְיָמִן
  choice: землю Вениамина
  rationale: Сохранена буквальная территориально-племенная формулировка оригинала.
theological_decisions:
- issue: Нравственная характеристика насильственного взятия женщин
  choice: схватите себе каждый по жене
  alternative: похитьте себе каждый по жене
  rationale: Перевод прямо сохраняет насильственный характер действия, но не вводит в основной текст юридический термин, которого нет в еврейском оригинале. Стих передаёт речь персонажей, а не явную нравственную оценку рассказчика.
- issue: Распределительная и гендерная формулировка
  choice: каждый по жене
  alternative: каждый из вас — жену
  rationale: Сохранены мужская направленность наставления и значение «по одной жене каждому», выраженные оборотом אִישׁ אִשְׁתּוֹ.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «И вот» сохраняет риторическую структуру оригинала; «водить хороводы» звучит естественнее буквального «танцевать танцы». Названия «Силом» и «Вениамин» соответствуют устойчивой русской библейской традиции.
