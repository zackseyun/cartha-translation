    issue: Связка «включая женщин и детей»
    rationale: В оригинале после «жителей Иависа Галаадского» стоят отдельные координированные дополнения «женщин и детей», а не пояснение категории жителей. «А также» точнее воспроизводит эту структуру и звучит естественнее.
  - severity: low
    issue: Оборот «предайте острию меча»
    rationale: Это допустимая библейская стилизация, но в целевом современном литературном регистре «поразите мечом» более прозрачно и непосредственно передаёт לְפִי חֶרֶב.
