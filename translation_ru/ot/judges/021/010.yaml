base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: ru
  text: 'И послало общество туда двенадцать тысяч доблестных воинов и приказало им: «Идите и поразите мечом жителей Иависа Галаадского, а также женщин и детей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: общество
  rationale: Обозначает собравшееся общество Израиля; в данном повествовательном контексте «общество» звучит естественно и не вносит церковных ассоциаций слова «собрание».
- source_word: מִבְּנֵי הֶחָיִל
  choice: доблестных воинов
  rationale: Буквально «из сынов доблести/силы»; идиоматически речь идёт о способных, отважных воинах.
- source_word: לְפִי חֶרֶב
  choice: предайте острию меча
  rationale: Сохраняет образную древнееврейскую формулу «устами/остриём меча» и ясно передаёт приказ убить мечом.
- source_word: הַטָּף
  choice: детей
  rationale: Собирательное обозначение малых детей или зависимых младших членов семей; «детей» естественно и не сужает значение до младенцев.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Иависа Галаадского
  rationale: Традиционная русская форма топонима, понятная в библейском контексте и передающая связь города с Галаадом.
theological_decisions:
- issue: Характер приказа об уничтожении жителей
  choice: 'Сохранена прямая формулировка приказа без смягчения: «предайте острию меча… включая женщин и детей»'
  alternative: Смягчить до «поразите» или обобщить объект нападения
  rationale: Исходный текст прямо включает женщин и детей; перевод не должен скрывать нравственную напряжённость повествования или превращать описанный человеческий приказ в богословски оправданное действие.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным регистром. Синтаксис упрощён по сравнению с буквальным «приказало им, говоря», но содержание и суровость исходного приказа сохранены.
