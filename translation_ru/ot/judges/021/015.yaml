lexical_decisions:
- source_word: נִחָם לְבִנְיָמִן
  choice: скорбел о Вениамине
  rationale: В данном контексте форма נִחָם выражает скорбь и сожаление о судьбе Вениамина; этот перевод естественен по-русски и не сужает смысл до одного лишь сострадания.
- source_word: פֶּרֶץ
  choice: пролом
  rationale: Сохраняет конкретную метафору разрыва, возникшего в единстве Израиля из-за почти полного уничтожения одного колена.
- source_word: בְּשִׁבְטֵי יִשְׂרָאֵל
  choice: среди колен Израиля
  rationale: Предлог ב здесь указывает на возникновение пролома в составе сообщества израильских колен.
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача тетраграмматона титулом, выделенным прописными буквами.
theological_decisions:
- issue: Приписывание пролома действию Яхве
  choice: потому что ГОСПОДЬ образовал пролом
  alternative: потому что среди колен Израиля возник пролом
  rationale: Сохранена явная причинная формулировка еврейского текста, не снимающая напряжения между Божьим действием и человеческой ответственностью, раскрытой в повествовании.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Метафора «пролом» сохранена намеренно; «образовал» передаёт עָשָׂה без усиления до «уничтожил» или «поразил».
