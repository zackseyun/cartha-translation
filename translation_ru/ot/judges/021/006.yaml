  text: 'И сыны Израиля скорбели о Вениамине, своём брате[a], и говорили: «Сегодня от Израиля отсечено одно колено».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сжалились над Вениамином, своим братом»; или: «пожалели Вениамина, своего брата». Еврейский глагол в зависимости от контекста может выражать скорбь, сострадание или перемену решения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  choice: опечалились
  rationale: Нифаль глагола נחם здесь передаёт скорбь, сожаление или сострадание в связи с почти полным истреблением Вениамина. «Опечалились» естественно выражает основной эмоциональный смысл, не сводя его к раскаянию.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формулировка сохраняет родственно-корпоративный образ еврейского текста и уместна в современном литературном библейском стиле.
- source_word: אֶל בִּנְיָמִן אָחִיו
  choice: о Вениамине, брате своём
  rationale: Предлог אֶל при נחם обозначает того, о ком скорбят или кому сострадают. Единственное число «брате своём» коллективно соотносится с множественным подлежащим и подчёркивает братство колен.
- source_word: נִגְדַּע
  choice: отсечено
  rationale: Глагол גדע буквально означает «срубить, отсечь». Выбор сохраняет сильную метафору отделения колена от целого, не утверждая сверх текста его полное уничтожение.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Прямой и естественный современный эквивалент, сохраняющий непосредственность плача.
- source_word: שֵׁבֶט אֶחָד
  choice: одно колено
  rationale: «Колено» — установившееся и понятное обозначение племенной единицы древнего Израиля; числительное передано прямо.
- source_word: מִיִּשְׂרָאֵל
  choice: от Израиля
  rationale: 'Предлог מִן имеет здесь отделительное значение: одно колено воспринимается как отсечённое от общего целого Израиля.'
