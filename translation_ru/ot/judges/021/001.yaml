  text: וְ/אִ֣ישׁ יִשְׂרָאֵ֔ל נִשְׁבַּ֥ע בַּ/מִּצְפָּ֖ה לֵ/אמֹ֑ר אִ֣ישׁ מִמֶּ֔/נּוּ לֹא יִתֵּ֥ן בִּתּ֛/וֹ לְ/בִנְיָמִ֖ן לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/001.yaml
  text: The men of Israel had sworn at Mizpah[a], saying, “No man among us shall give his daughter to Benjamin as a wife.”
translation:
  language: ru
  text: 'Израильтяне поклялись в Мицпе, сказав: «Никто из нас не отдаст своей дочери в жёны вениамитянину[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Вениамину»; имя может обозначать колено Вениамина в целом или одного из вениамитян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Израильтяне
  rationale: Форма אִישׁ морфологически единственного числа здесь имеет собирательное значение и обозначает израильских мужчин как группу. Русское множественное число естественно передаёт этот смысл; начальный союз не выражен отдельно, поскольку в русском начале главы он необязателен.
- source_word: נִשְׁבַּע
  choice: поклялись
  rationale: Nifal глагола שׁבע означает «поклясться, принести клятву». Русский совершенный вид передаёт завершённое действие; его предшествование последующим событиям ясно из контекста без специальной формы давнопрошедшего времени.
- source_word: בַּמִּצְפָּה
  choice: в Мицпе
  rationale: Предлог ב с названием места обозначает место принесения клятвы. Для названия города по-русски естественно «в Мицпе».
- source_word: לֵאמֹר
  choice: сказав
  rationale: Стандартная древнееврейская формула введения прямой речи передана русским деепричастием.
- source_word: אִישׁ מִמֶּנּוּ
  choice: Никто из нас
  rationale: Буквально «мужчина из нас»; в отрицательной клятвенной формуле выражение имеет распределительный смысл — ни один человек из их числа. «Никто из нас» естественно передаёт его по-русски.
- source_word: לֹא יִתֵּן
  choice: не отдаст
  rationale: Отрицание с имперфектом в содержании клятвы выражает твёрдое обязательство на будущее. Глагол «отдать» в сочетании «отдать дочь в жёны» естественно передаёт брачный контекст נתן.
- source_word: בִּתּוֹ
  choice: своей дочери
  rationale: Возвратно-притяжательное местоимение «своей» естественно соотносит дочь с каждым подразумеваемым участником клятвы.
- source_word: לְבִנְיָמִן
  choice: вениамитянину
  rationale: Имя Вениамин здесь может метонимически обозначать колено в целом либо отдельного его представителя. В контексте выдачи дочери замуж русский дательный единственного числа ясно указывает на представителя колена, а исходная широта отмечена в сноске.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Устойчивое выражение обозначает передачу женщины в брак, чтобы она стала женой; русское «отдать дочь в жёны» точно и идиоматично.
