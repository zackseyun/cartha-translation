base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
translation:
  language: ru
  text: 'Сыны Вениамина так и сделали: из плясавших женщин[a], которых они похитили[b], они взяли себе столько жён, сколько их было самих. После этого они ушли и вернулись в свой удел, отстроили города[c] и поселились в них.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из пляшущих»; еврейское причастие стоит в женском роде множественного числа.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «которых они силой захватили» или «которых они унесли». Еврейский глагол означает насильственное завладение.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «построили города». Перевод «отстроили» учитывает контекст: ранее города Вениамина были разорены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: так и сделали
  rationale: Естественная русская повествовательная формула, ясно связывающая поступок с изложенным ранее замыслом.
- source_word: בְּנֵי בִנְיָמִן
  choice: сыны Вениамина
  rationale: Сохраняет семейно-племенное выражение еврейского текста и при этом соответствует достоинству библейского повествования.
- source_word: וַיִּשְׂאוּ נָשִׁים לְמִסְפָּרָם
  choice: взяли себе столько жён, сколько их было самих
  rationale: Передаёт брачную идиому «взять жён» и смысл соответствия числа жён числу мужчин естественным современным русским языком.
- source_word: מִן הַמְּחֹלְלוֹת
  choice: из плясавших женщин
  rationale: Женский род множественного числа причастия выражен явно; «плясавших» непосредственно передаёт действие участниц праздника.
- source_word: אֲשֶׁר גָּזָלוּ
  choice: которых они похитили
  rationale: Глагол обозначает насильственное завладение; «похитили» не смягчает принудительный характер поступка.
- source_word: וַיֵּלְכוּ וַיָּשׁוּבוּ
  choice: они ушли и вернулись
  rationale: 'Сохранены оба последовательных еврейских глагола: уход с места праздника и возвращение на свою землю.'
- source_word: אֶל נַחֲלָתָם
  choice: в свой удел
  rationale: «Удел» естественно передаёт наследственно распределённую племенную землю и сохраняет соответствующий библейский смысл.
- source_word: וַיִּבְנוּ אֶת הֶעָרִים
  choice: отстроили города
  rationale: По контексту речь идёт о восстановлении разорённых городов Вениамина; приставка «от-» естественно выражает это, тогда как сам еврейский глагол буквально означает «построили».
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: поселились в них
  rationale: В контексте возвращения и восстановления городов глагол обозначает обустройство и проживание в них.
theological_decisions:
- issue: Нравственная окраска глагола גָּזָלוּ
  choice: 'Сохранить значение насильственного похищения: «которых они похитили».'
  alternative: «которых они взяли» или «которых они увели»
  rationale: Повествование не требует одобрения описываемого поступка. Нейтральная формулировка необоснованно смягчила бы насильственный смысл исходного глагола.
- issue: Передача племенной и земельной терминологии
  choice: Сохранить выражения «сыны Вениамина» и «свой удел».
  alternative: «вениамитяне» и «своя территория»
  rationale: Выбранные формы сохраняют семейно-племенную структуру и значение наследственно полученной земли, не вводя дополнительного конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Формы «сыны» и «удел» сохраняют племенную и земельную образность оригинала; синтаксис остальной фразы сделан ясным и естественным для современного читателя.
