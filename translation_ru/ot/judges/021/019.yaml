  text: וַ/יֹּאמְר֡וּ הִנֵּה֩ חַג יְהוָ֨ה בְּ/שִׁל֜וֹ מִ/יָּמִ֣ים יָמִ֗ימָ/ה אֲשֶׁ֞ר מִ/צְּפ֤וֹנָ/ה לְ/בֵֽית אֵל֙ מִזְרְחָ֣/ה הַ/שֶּׁ֔מֶשׁ לִ/מְסִלָּ֔ה הָ/עֹלָ֥ה מִ/בֵּֽית אֵ֖ל שְׁכֶ֑מָ/ה וּ/מִ/נֶּ֖גֶב לִ/לְבוֹנָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/019.yaml
  text: And they said[a], "Look, there is a feast of Yahweh in Shiloh from year to year, which is north of Bethel, east of the highway that goes up from Bethel to Shechem[b], and south of Lebonah."
translation:
  language: ru
  text: 'И они сказали: «Вот, в Силоме из года в год[b] проходит праздник Яхве[a]. Силом расположен к северу от Вефиля, к востоку от дороги, ведущей от Вефиля к Сихему, и к югу от Левоны».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «празднество Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из дней в дни», то есть ежегодно.'
    reason: hebrew_idiom
lexical_decisions:
- source_word: הִנֵּה
  choice: вот
  rationale: Современный и естественный указательный маркер, сохраняющий функцию привлечения внимания.
- source_word: חַג יְהוָה
  choice: праздник Яхве
  rationale: חַג обозначает религиозный праздник, нередко связанный с паломничеством; «праздник» ясно и достойно звучит по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: מִיָּמִים יָמִימָה
  choice: из года в год
  rationale: Естественно передаёт значение еврейского идиоматического выражения о ежегодной повторяемости.
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ לִמְסִלָּה
  choice: к востоку от дороги
  rationale: В географическом описании буквальное направление «к восходу солнца» естественно выражается словом «восток»; מְסִלָּה здесь обозначает основной путь или дорогу.
- source_word: מִבֵּית אֵל שְׁכֶמָה
  choice: от Вефиля к Сихему
  rationale: Направительный суффикс при названии Сихема указывает движение в его сторону; «к Сихему» не утверждает больше, чем исходный текст.
- source_word: וּמִנֶּגֶב לִלְבוֹנָה
  choice: и к югу от Левоны
  rationale: Передаёт относительное географическое положение Силома.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В данном повествовательном контексте стоит личное заветное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
translation_notes:
  register: 'Современный литературный русский язык с достойным повествовательным тоном. Для ясности длинное еврейское предложение разделено на два; относительное придаточное о местоположении Силома передано отдельным предложением. Использованы традиционные русские формы библейских топонимов: Силом, Вефиль, Сихем, Левона.'
