  text: And they commanded the sons of Benjamin[a], saying[b], “Go and lie in wait in the vineyards.”
translation:
  language: ru
  text: 'И они велели сынам Вениамина: «Пойдите и устройте засаду в виноградниках».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: И они велели
  rationale: Глагол צוה означает «велеть, повелевать, давать указание». Согласно представленной форме, сказуемое стоит во множественном числе; поэтому сохраняется «они», без согласования с более широким контекстом в единственном числе.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: сынам Вениамина
  rationale: Буквально «сынам Вениамина». Родственная формула сохраняется, поскольку она понятна и естественна в русском библейском повествовании.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартный древнееврейский оборот, вводящий прямую речь. В современном русском его естественно передать пунктуационно, не добавляя тяжеловесного «говоря».
- source_word: לְכוּ
  choice: Пойдите
  rationale: Прямое соответствие повелительной форме множественного числа от הלך.
- source_word: וַאֲרַבְתֶּם
  choice: и устройте засаду
  rationale: Корень ארב обозначает пребывание в засаде или организацию засады. «Устройте засаду» естественно передаёт продолжение повеления и смысл целенаправленного скрытого ожидания.
- source_word: בַּכְּרָמִים
  choice: в виноградниках
  rationale: Прямая и естественная передача существительного כרמים с предлогом ב.
