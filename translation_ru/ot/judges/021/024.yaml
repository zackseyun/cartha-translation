source:
  edition: WLC
  text: וַ/יִּתְהַלְּכ֨וּ מִ/שָּׁ֤ם בְּנֵֽי יִשְׂרָאֵל֙ בָּ/עֵ֣ת הַ/הִ֔יא אִ֥ישׁ לְ/שִׁבְט֖/וֹ וּ/לְ/מִשְׁפַּחְתּ֑/וֹ וַ/יֵּצְא֣וּ מִ/שָּׁ֔ם אִ֖ישׁ לְ/נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/024.yaml
  text: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
translation:
  language: ru
  text: В то время израильтяне разошлись оттуда, каждый к своему колену и роду[a], и ушли оттуда, каждый в свой удел[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «семье»; еврейское слово может обозначать род или клан — более широкую родственную группу, чем ближайшая семья.
    reason: lexical_alternative
  - marker: b
    text: То есть в своё наследственное земельное владение.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: разошлись
  rationale: Возвратная порода глагола הלך здесь передаёт не просто ходьбу, а расхождение участников собрания по своим местам; «разошлись» естественно выражает этот смысл.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Современное русское обозначение народа Израиля точно передаёт устойчивое еврейское выражение и звучит естественнее, чем буквальное «сыны Израиля».
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Прямой и естественный перевод временного оборота без сужения значения до одного момента.
- source_word: אִישׁ
  choice: каждый
  rationale: В обоих случаях слово употреблено дистрибутивно; «каждый» сохраняет индивидуальное распределение, не создавая в русском ненужной тяжеловесности.
- source_word: לְשִׁבְטוֹ
  choice: к своему колену
  rationale: «Колено» — традиционный и точный русский термин для племенного подразделения Израиля.
- source_word: וּלְמִשְׁפַּחְתּוֹ
  choice: и роду
  rationale: В данном общественном контексте מִשְׁפָּחָה обозначает более широкую родственную группу, чем современная нуклеарная семья; «род» сохраняет эту широту.
- source_word: וַיֵּצְאוּ
  choice: ушли
  rationale: Глагол יצא буквально означает выход, но в этом контексте естественное русское «ушли оттуда» точно обозначает отправление с места собрания и не добавляет идеи возвращения, которой нет в глаголе.
- source_word: לְנַחֲלָתוֹ
  choice: в свой удел
  rationale: «Удел» передаёт наследственно закреплённое земельное владение в Израиле и сохраняет территориально-правовой оттенок נַחֲלָה.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской терминологией («колено», «удел»). Синтаксический повтор «оттуда» и двукратное «каждый» сохранены как значимые черты еврейского текста; при этом «израильтяне» выбрано вместо менее современного буквального «сыны Израиля».
