  yaml_path: translation/ot/judges/021/004.yaml
  text: And the next day the people rose early[a], built an altar there, and offered burnt offerings and peace offerings.
translation:
  language: ru
  text: На следующий день народ встал рано, соорудил там жертвенник и принёс всесожжения и мирные жертвы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения» или «жертвы благополучия». Еврейское слово обозначает вид жертв, связанных с миром, целостностью, благополучием и совместной трапезой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: На следующий день
  rationale: Начальная повествовательная формула וַיְהִי естественно передаётся без отдельного «и было»; временное значение מִמָּחֳרָת полностью сохранено.
- source_word: וַיַּשְׁכִּימוּ
  choice: встал рано
  rationale: Глагол обозначает ранний подъём; единственное число согласовано с собирательным существительным «народ».
- source_word: הָעָם
  choice: народ
  rationale: Сохранено обычное значение существительного без конкретизации «израильтяне», отсутствующей в исходном тексте.
- source_word: וַיִּבְנוּ שָׁם מִזְבֵּחַ
  choice: соорудил там жертвенник
  rationale: «Соорудил» естественно сочетается с «жертвенник», а «там» сохраняет явно выраженное שָׁם.
- source_word: וַיַּעֲלוּ
  choice: принёс
  rationale: В контексте жертвоприношения глагол идиоматически означает принесение жертвы; форма согласована с собирательным «народ».
- source_word: עֹלוֹת
  choice: всесожжения
  rationale: Устоявшийся русский термин точно обозначает жертвы, целиком сжигаемые на жертвеннике.
- source_word: וּשְׁלָמִים
  choice: мирные жертвы
  rationale: Устоявшийся русский библейский термин сохраняет связь корня с миром и благополучием; дополнительные смысловые оттенки отмечены в сноске.
theological_decisions:
- issue: Передача названий жертв
  choice: всесожжения и мирные жертвы
  alternative: жертвы всесожжения и жертвы общения / благополучия
  rationale: Выбраны понятные и укоренившиеся русские культовые термины. Для שְׁלָמִים не сужен смысл до одного богословского толкования; его диапазон пояснён в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и торжественный без архаизации. Цепочка древнееврейских форм с וַ передана плавным русским повествованием; собирательное «народ» последовательно требует сказуемых в единственном числе.
