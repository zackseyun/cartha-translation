  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
translation:
  language: ru
  text: Тогда всё общество послало весть сынам Вениамина, находившимся у скалы Риммон[a], и обратилось к ним, объявив им мир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находившимся в Села-Риммоне»; еврейское выражение можно понимать либо описательно — «скала Риммон», либо как более устойчивое географическое название.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: послало людей
  rationale: Глагол означает «посылать»; дополнение «людей» подразумевается контекстом последующего обращения, но не уточняет их официальный статус как посланцев.
- source_word: כָּל הָעֵדָה
  choice: всё общество
  rationale: עֵדָה обозначает собранное общество Израиля; «всё» передаёт כָּל, а форма единственного числа естественна для русского собирательного существительного.
- source_word: וַיְדַבְּרוּ אֶל
  choice: к сынам Вениамина
  rationale: Содержание действия «говорили с/обратились к» в русском естественно включено в конструкцию «послало людей к…» и последующее «объявило им мир», без тяжеловесного повтора.
- source_word: בְּנֵי בִנְיָמִן
  choice: сынам Вениамина
  rationale: Сохранено буквальное родоплеменное выражение «сыны Вениамина», а не обобщающее «вениамитянам».
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  choice: находившимся у скалы Риммон
  rationale: סֶלַע имеет значение «скала, утёс»; предлог ב здесь естественно передан как местонахождение «у». Возможное понимание всей формы как устойчивого топонима вынесено в сноску.
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  choice: объявило им мир
  rationale: Сочетание קרא с косвенным дополнением и שָׁלוֹם выражает публичное объявление мирных отношений; «объявило им мир» сохраняет декларативный характер фразы.
- source_word: שָׁלוֹם
  choice: мир
  rationale: В данном контексте слово означает прекращение вражды и восстановление мирных отношений.
