  text: וַ/אֲנַ֗חְנוּ לֹ֥א נוּכַ֛ל לָ/תֵת לָ/הֶ֥ם נָשִׁ֖ים מִ/בְּנוֹתֵ֑י/נוּ כִּֽי נִשְׁבְּע֤וּ בְנֵֽי יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אָר֕וּר נֹתֵ֥ן אִשָּׁ֖ה לְ/בִנְיָמִֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/018.yaml
  text: But we cannot give them wives from our daughters[a], because the sons of Israel have sworn, saying, ‘Cursed is the one who gives a wife to Benjamin.’
translation:
  language: ru
  text: 'Но мы не можем дать им жён из числа наших дочерей, потому что сыны Израиля поклялись: «Проклят тот, кто даст жену Вениамину[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть колену Вениамина или вениамитянину; в еврейском тексте прямо употреблено имя «Вениамин».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Но мы
  rationale: Союз с самостоятельным местоимением подчёркивает субъект и вводит противопоставление в ходе рассуждения.
- source_word: לֹא נוּכַל
  choice: не можем
  rationale: Глагол выражает невозможность или неспособность; обусловленность клятвой ясна из следующей части стиха, поэтому добавлять «не вправе» не следует.
- source_word: לָתֵת לָהֶם נָשִׁים מִבְּנוֹתֵינוּ
  choice: дать им жён из числа наших дочерей
  rationale: נָשִׁים в брачном контексте означает «жён», а מן указывает на круг, из которого они могли бы быть даны; «из числа» естественно передаёт этот смысл.
- source_word: כִּי נִשְׁבְּעוּ
  choice: потому что ... поклялись
  rationale: כִּי вводит причину, а форма שׁבע обозначает принесение клятвы, сохраняющей силу в данной ситуации.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт мужское выражение оригинала и сохраняет библейское корпоративное обозначение.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Русская пунктуация естественно передаёт служебную функцию еврейского инфинитива, вводящего содержание клятвы.
- source_word: אָרוּר נֹתֵן אִשָּׁה
  choice: Проклят тот, кто даст жену
  rationale: Причастие имеет обобщённое значение; конструкция сохраняет судебно-клятвенную силу אָרוּר и брачный смысл אִשָּׁה.
- source_word: לְבִנְיָמִן
  choice: Вениамину
  rationale: Сохраняется прямое употребление названия колена в еврейском тексте, а возможное развёрнутое понимание поясняется в сноске.
