base_translation:
  language: en
  yaml_path: translation/ot/judges/021/003.yaml
  text: And they said[a], “Why, O Yahweh, God of Israel, has this happened in Israel[b], that today one tribe should be lacking from Israel?”
translation:
  language: ru
  text: 'И они сказали: «Почему это случилось в Израиле, Яхве, Бог Израиля, — что сегодня в Израиле недостаёт одного колена?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И сказали они
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; такой порядок слов сохраняет достойный библейский регистр без архаизации.
- source_word: לָמָה
  choice: Почему
  rationale: Прямой вопрос, выражающий скорбь и недоумение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прозрачно передаёт древнееврейскую сопряжённую конструкцию.
- source_word: הָיְתָה זֹּאת בְּיִשְׂרָאֵל
  choice: случилось это в Израиле
  rationale: Буквально конструкция означает «это было в Израиле», но в данном контексте идиоматически обозначает произошедшее событие.
- source_word: לְהִפָּקֵד ... מִיִּשְׂרָאֵל
  choice: так что ... не стало в Израиле
  rationale: Nifal инфинитива פקד здесь выражает отсутствие или утрату члена целого; русская безличная конструкция естественно передаёт результат.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Сохраняет временное ударение исходного текста.
- source_word: שֵׁבֶט אֶחָד
  choice: одного колена
  rationale: «Колено» — понятное и устойчивое русское библейское обозначение племенного подразделения Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо содержит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Характер отсутствия одного колена
  choice: не стало в Израиле одного колена
  alternative: одно колено отсутствует в Израиле
  rationale: Формулировка передаёт переживаемую говорящими утрату, не утверждая сверх контекста окончательного уничтожения колена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены обращение к Богу, повтор «в Израиле» и напряжение скорбного вопроса; синтаксис сделан естественным для современного читателя.
