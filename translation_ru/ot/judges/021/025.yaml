base_translation:
  language: en
  yaml_path: translation/ot/judges/021/025.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: ru
  text: В те дни не было царя в Израиле; каждый делал то, что с его точки зрения было правильным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Естественная для русского повествования временная формула, сохраняющая ретроспективную рамку еврейского текста.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: не было царя в Израиле
  rationale: Прямо и естественно передаёт отрицательную конструкцию существования אֵין и местное значение בְּ.
- source_word: אִישׁ
  choice: каждый
  rationale: В данном контексте существительное мужского рода употреблено дистрибутивно. Русское «каждый» сохраняет форму мужского рода и при этом естественно выражает значение «каждый человек».
- source_word: הַיָּשָׁר
  choice: то, что было правильным
  rationale: Субстантивированное прилагательное обозначает «правильное» или «правое». Эта формулировка сохраняет нравственно-оценочный смысл, не усиливая его до «что хотел».
- source_word: בְּעֵינָיו
  choice: в его глазах
  rationale: Сохраняет еврейскую идиому субъективной оценки и остаётся понятным современному русскому читателю.
- source_word: יַעֲשֶׂה
  choice: делал
  rationale: Имперфект в итоговом повествовательном высказывании выражает обычное, повторявшееся действие в прошлом; русский несовершенный вид передаёт это естественно.
theological_decisions:
- issue: Представительное употребление мужского единственного числа אִישׁ
  choice: каждый
  alternative: каждый человек; всякий
  rationale: «Каждый» естественно передаёт дистрибутивное значение и сохраняет мужскую грамматическую форму исходного текста, не сужая смысл только до взрослых мужчин.
- issue: Подразумеваемая оценка поведения Израиля
  choice: то, что было правильным в его глазах
  alternative: что ему вздумается; что казалось ему правильным
  rationale: Перевод не добавляет прямо не выраженного осуждения и сохраняет напряжение между словом «правильным» и субъективной мерой «в его глазах».
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис краткий и афористичный; точка с запятой сохраняет тесную смысловую связь двух частей рефрена.
