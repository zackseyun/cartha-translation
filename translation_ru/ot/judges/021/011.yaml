id: JDG.21.11
reference: Judges 21:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/זֶ֥ה הַ/דָּבָ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּל זָכָ֗ר וְ/כָל אִשָּׁ֛ה יֹדַ֥עַת מִשְׁכַּב זָכָ֖ר תַּחֲרִֽימוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
translation:
  language: ru
  text: 'И вот что вы должны сделать: всякого человека мужского пола и всякую женщину, познавшую мужское ложе,[a] предайте заклятию на уничтожение.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть женщину, имевшую половые отношения с мужчиной.
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение означает подвергнуть кого-либо заклятию, предусматривающему уничтожение, а не просто убить.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה
  choice: И вот
  rationale: Сохраняет связь с предыдущим повествованием и естественно вводит последующее распоряжение.
- source_word: הַ/דָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: что вы должны сделать
  rationale: Естественная русская передача еврейской конструкции «вот дело, которое вы сделаете» с сохранением обязательного характера указания.
- source_word: כָּל זָכָר
  choice: всякого человека мужского пола
  rationale: זָכָר обозначает принадлежность к мужскому полу, а не только взрослого мужчину; выбранная формулировка не исключает мальчиков, хотя звучит несколько формальнее.
- source_word: וְ/כָל אִשָּׁה
  choice: и всякую женщину
  rationale: אִשָּׁה здесь означает женщину, далее определяемую по наличию полового опыта; перевод «жену» был бы неоправданно узким.
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  choice: познавшую мужское ложе
  rationale: Сохраняет эвфемистический и образный характер еврейского выражения; прямое значение пояснено в сноске.
- source_word: תַּחֲרִימוּ
  choice: предайте заклятию на уничтожение
  rationale: 'Передаёт специальное значение חרם: не просто убить, а подвергнуть заклятию, предполагающему уничтожение.'
theological_decisions:
- issue: Передача חרם в контексте войны и суда
  choice: предайте заклятию на уничтожение
  alternative: полностью уничтожьте; подвергните заклятию
  rationale: Выбранный вариант сохраняет религиозно-правовой оттенок посвящения под заклятие и одновременно ясно указывает на его смертоносный результат, не сводя выражение к обычному убийству.
translation_notes:
  register: Современный литературный русский язык с намеренно возвышенной формулировкой «познавшую мужское ложе», сохраняющей библейский эвфемизм. Более формальное «человека мужского пола» выбрано ради точности и охвата лиц любого возраста.
