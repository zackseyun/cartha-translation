base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
translation:
  language: ru
  text: В то время сыны Вениамина вернулись, и им отдали женщин из Иависа Галаадского, которых оставили в живых. Но найденных таким образом женщин на всех не хватило.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «но им не нашли так». Еврейское выражение сокращённое; по смыслу женщин, найденных таким способом, оказалось недостаточно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב בִּנְיָמִן
  choice: сыны Вениамина вернулись
  rationale: Название «Вениамин» употреблено собирательно по отношению к уцелевшим представителям колена; по-русски явное «сыны Вениамина» естественно передаёт этот смысл и согласуется с глаголом в единственном числе исходного текста как с коллективной конструкцией.
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Обычное временное выражение, сохранённое без ненужного уточнения.
- source_word: וַיִּתְּנוּ לָהֶם
  choice: им отдали
  rationale: Глагол נתן прямо означает передачу; субъект в еврейском тексте подразумевается из контекста и в переводе также не назван.
- source_word: הַנָּשִׁים אֲשֶׁר חִיּוּ
  choice: женщин… которых оставили в живых
  rationale: Сохранено общее значение «женщины», а не более узкое «жёны»; порода piel глагола חיה передаёт значение сохранения жизни после убийства остальных.
- source_word: מִנְּשֵׁי יָבֵשׁ גִּלְעָד
  choice: женщин из Иависа Галаадского
  rationale: Предлог מן обозначает происхождение или выделение из группы; формулировка естественна по-русски и сохраняет географическое наименование.
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  choice: Но найденных таким образом женщин на всех не хватило
  rationale: 'Еврейская фраза эллиптична: буквально говорится, что им «не нашли так». Контекст указывает на недостаточное число женщин; перевод делает подразумеваемое дополнение явным, сохраняя указание на способ решения.'
