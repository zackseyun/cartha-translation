lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  choice: пересчитали
  rationale: Форма от פקד в данном повествовательном и военно-общественном контексте обозначает проведение переклички или подсчёта собравшихся. Русская неопределённо-личная конструкция естественно передаёт пассивный смысл.
- source_word: הָעָם
  choice: народ
  rationale: עָם обычно означает «народ»; здесь речь идёт о собравшемся сообществе Израиля. Перевод не сужает значение до «войска», хотя контекст имеет военный характер.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: הִנֵּה привлекает внимание к неожиданно обнаруженному обстоятельству; «и вот» сохраняет повествовательную выразительность оригинала.
- source_word: אֵין שָׁם אִישׁ
  choice: там не оказалось ни одного мужчины
  rationale: Сочетание содержит отрицание наличия и существительное אִישׁ в мужском роде. «Не оказалось» естественно выражает результат проведённого подсчёта, а «ни одного мужчины» сохраняет явную мужскую форму оригинала.
- source_word: מִיּוֹשְׁבֵי
  choice: из жителей
  rationale: Причастная форма от ישב обозначает людей, живущих в данном месте; «из жителей» точно и естественно передаёт конструкцию с предлогом מִן.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Иависа Галаадского
  rationale: Использована укоренившаяся в русской библейской традиции форма названия города, грамматически согласованная после «жителей».
