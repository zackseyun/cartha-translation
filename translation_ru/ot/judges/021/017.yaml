lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И сказали
  rationale: Стандартно передаёт повествовательную форму wayyiqtol глагола אמר и сохраняет связность рассказа.
- source_word: יְרֻשַּׁת פְּלֵיטָה לְבִנְיָמִן
  choice: Уцелевшим из Вениамина должно остаться наследие
  rationale: Естественная русская передача краткой безглагольной еврейской конструкции. «Наследие» отражает наследственное владение, а «уцелевшие» — спасшихся после почти полного истребления колена.
- source_word: וְלֹא יִמָּחֶה
  choice: чтобы не исчезло
  rationale: В контексте передаёт целевой оттенок и значение Niphal от מחה — быть стёртым, устранённым, перестать существовать; по-русски «не исчезло» естественно сочетается с коленом.
- source_word: שֵׁבֶט
  choice: одно из колен
  rationale: Уточняет естественным русским оборотом, что речь идёт о любом отдельном колене в составе Израиля, не превращая неопределённость древнееврейского текста в указание исключительно на уже названное колено.
- source_word: מִיִּשְׂרָאֵל
  choice: Израиля
  rationale: 'Русская родительная конструкция «одно из колен Израиля» идиоматично передаёт отделительное מן: колено не должно исчезнуть из числа Израиля.'
