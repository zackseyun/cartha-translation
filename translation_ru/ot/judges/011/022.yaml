source:
  edition: WLC
  text: וַ/יִּ֣ירְשׁ֔וּ אֵ֖ת כָּל גְּב֣וּל הָ/אֱמֹרִ֑י מֵֽ/אַרְנוֹן֙ וְ/עַד הַ/יַּבֹּ֔ק וּ/מִן הַ/מִּדְבָּ֖ר וְ/עַד הַ/יַּרְדֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/022.yaml
  text: So they took possession of all the territory of the Amorites[a], from the Arnon as far as the Jabbok[c][b], and from the wilderness as far as the Jordan.
translation:
  language: ru
  text: Так они овладели[a] всей территорией[b] амореев[c] — от Арнона до Иавока и от пустыни до Иордана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вступили во владение»; еврейский глагол может также означать «получили в наследие», но здесь речь идёт об установлении контроля над землёй.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всеми пределами» либо «всей областью»; еврейское слово может обозначать как границу, так и землю в её пределах.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «аморея»; в еврейском тексте единственное число имеет собирательное значение и обозначает народ амореев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: они овладели
  rationale: В контексте завоевания ירשׁ означает вступить во владение землёй, занять её. «Овладели» естественно передаёт активное установление контроля, не сводя смысл к пассивному получению наследства.
- source_word: כָּל
  choice: всей
  rationale: Сохраняет полноту, выраженную еврейским כָּל.
- source_word: גְּבוּל
  choice: территорией
  rationale: Хотя слово может означать «граница» или «предел», названные далее ориентиры показывают, что здесь имеется в виду земля в этих пределах.
- source_word: הָאֱמֹרִי
  choice: амореев
  rationale: Еврейское единственное число употреблено собирательно; русский этноним во множественном числе ясно и естественно обозначает весь народ.
- source_word: מֵאַרְנוֹן וְעַד הַיַּבֹּק
  choice: от Арнона до Иавока
  rationale: Краткая и естественная русская конструкция, точно обозначающая протяжённость между двумя географическими рубежами.
- source_word: וּמִן הַמִּדְבָּר וְעַד הַיַּרְדֵּן
  choice: от пустыни до Иордана
  rationale: Сохраняет вторую пару границ и параллелизм исходного текста. «Пустыня» здесь обозначает необжитую засушливую местность, не обязательно песчаную.
