base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
translation:
  language: ru
  text: И вот теперь, разве ты и вправду лучше Валака, сына Циппора, царя Моава?[a] Разве он когда-либо вёл спор с Израилем или воевал против них?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте слово, переданное как «лучше», повторено для усиления. Возможный перевод: «Разве ты хоть сколько-нибудь лучше Валака, сына Циппора, царя Моава?»'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Разве он когда-либо тягался с Израилем или вёл против них войну?» Первый глагол может обозначать спор, тяжбу или противоборство, тогда как второй прямо обозначает военные действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительную силу וְ и переход к риторическому вызову, выраженный עַתָּה.
- source_word: הֲטוֹב טוֹב אַתָּה
  choice: разве ты лучше
  rationale: Естественный русский риторический вопрос; усиление повтором טוֹב טוֹב передано контекстом и конструкцией «разве», без неестественного буквального повтора.
- source_word: מִבָּלָק בֶּן־צִפּוֹר מֶלֶךְ מוֹאָב
  choice: Валака, сына Циппора, царя Моава
  rationale: Прямо передаёт сравнительную конструкцию и цепочку приложений; имена даны в принятой русской библейской форме.
- source_word: הֲרֹב רָב
  choice: Разве он когда-либо вступал в спор
  rationale: ריב может обозначать спор, тяжбу или противоборство. Формулировка сохраняет более широкий и не обязательно военный смысл, отличая его от следующего לחם; «когда-либо» передаёт усилительную конструкцию.
- source_word: עִם יִשְׂרָאֵל
  choice: с Израилем
  rationale: Сохраняет основное значение предлога עִם и естественно сочетается с выражением «вступать в спор».
- source_word: אִם
  choice: или
  rationale: В данном парном риторическом вопросе вводит вторую альтернативу.
- source_word: נִלְחֹם נִלְחַם בָּם
  choice: воевал с ним
  rationale: Передаёт конкретно военное значение לחם и эмфатическую конструкцию естественным русским глаголом; местоимение согласовано с единственным числом собирательного имени «Израиль».
