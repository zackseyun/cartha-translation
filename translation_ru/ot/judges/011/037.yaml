source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל אָבִ֔י/הָ יֵעָ֥שֶׂה לִּ֖/י הַ/דָּבָ֣ר הַ/זֶּ֑ה הַרְפֵּ֨ה מִמֶּ֜/נִּי שְׁנַ֣יִם חֳדָשִׁ֗ים וְ/אֵֽלְכָה֙ וְ/יָרַדְתִּ֣י עַל הֶֽ/הָרִ֔ים וְ/אֶבְכֶּה֙ עַל בְּתוּלַ֔/י אָנֹכִ֖י ו/רעית/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
translation:
  language: ru
  text: 'Она сказала своему отцу: «Пусть для меня будет сделано вот что: отпусти меня[a] на два месяца. Я пойду, спущусь в горы и буду оплакивать своё девство[b] — я и мои подруги».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв. «оставь меня»; по смыслу также: «дай мне уйти».'
    reason: lexical_alternative
  - marker: b
    text: Еврейский текст буквально говорит об оплакивании её девства, подчёркивая, что она не вышла замуж и не имела детей; сам этот стих не разрешает более широкий вопрос о её дальнейшей судьбе.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Пусть для меня будет сделано вот что
  rationale: Сохранены пассивно-побудительное значение нифаля и указательное выражение; перевод не подменяет буквальную формулировку истолковывающим «исполни мою просьбу».
- source_word: הַרְפֵּה מִמֶּנִּי
  choice: отпусти меня
  rationale: Императив רפה с מן здесь означает предоставить свободу или позволить удалиться. «Отпусти меня» естественно передаёт просьбу о разрешении уйти на определённый срок.
- source_word: שְׁנַיִם חֳדָשִׁים
  choice: на два месяца
  rationale: Русский винительный времени естественно выражает запрашиваемую продолжительность.
- source_word: וְאֵלְכָה וְיָרַדְתִּי
  choice: Я пойду, спущусь
  rationale: Сохранены оба координированных глагола — «идти» и «спускаться»; не вводится отсутствующее в еврейском тексте значение «бродить».
- source_word: עַל הֶהָרִים
  choice: в горы
  rationale: Предлог עַל буквально может означать «на», однако по-русски направление движения в горную местность естественно выражается сочетанием «в горы».
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  choice: буду оплакивать своё девство
  rationale: בכה על означает плакать о чём-либо, оплакивать; בְּתוּלִים обозначает девство, то есть незамужнее состояние, а не просто молодость.
- source_word: אָנֹכִי וְרֵעוֹתָי
  choice: я и мои подруги
  rationale: Форма женского рода во множественном числе указывает на подруг или спутниц говорящей; «подруги» звучит естественно и ясно.
theological_decisions:
- issue: Смысл плача дочери Иеффая о своём девстве
  choice: Сохранено прямое указание текста на оплакивание девства без уточнения последующей судьбы девушки.
  alternative: Истолковать плач как скорбь о предстоящей смерти и бездетности либо как скорбь о пожизненном девстве и посвящении.
  rationale: В данном стихе прямо названо девство, но смерть прямо не упомянута. Перевод не разрешает более широкий спор о жертве Иеффая посредством добавленных слов.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён до естественной русской прямой речи, при этом сохранены оба глагола движения и напряжённая неоднозначность повествования.
