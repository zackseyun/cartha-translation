base_translation:
  language: en
  yaml_path: translation/ot/judges/011/013.yaml
  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: ru
  text: 'Царь аммонитян ответил посланникам Иеффая: «Поскольку Израиль, выйдя из Египта, захватил мою землю — от Арнона до Иавока и до Иордана, — теперь верни её[a] мирно».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте стоит местоимение женского рода во множественном числе: «верни их». Оно относится к оспариваемой территории; русский перевод употребляет единственное число, согласуя местоимение со словом «земля».'
    reason: Передаёт грамматическую особенность оригинала, не навязывая решения о том, подразумеваются ли отдельные земли, области или иные части территории.
lexical_decisions:
- source_word: כִּי
  choice: не выражено отдельным союзом; основание передано самостоятельным утверждением
  rationale: Здесь частица вводит ответ царя и объясняет причину вражды. Русское «потому что» без главной части звучало бы синтаксически незавершённо, поэтому причинный смысл естественно передан контекстом прямого ответа.
- source_word: בַּעֲלוֹתוֹ מִמִּצְרַיִם
  choice: выйдя из Египта
  rationale: Буквально «при его восхождении из Египта»; деепричастный оборот ясно и естественно передаёт временное обстоятельство.
- source_word: לָקַח
  choice: захватил
  rationale: В контексте территориального спора глагол означает завладение землёй; «захватил» сохраняет обвинительный тон речи аммонитского царя.
- source_word: אֶתְהֶן
  choice: её
  rationale: Местоимение относится к перечисленной территории, обозначенной ранее единственным числом «моя земля». В русском естественно согласовать его со словом «земля».
- source_word: בְּשָׁלוֹם
  choice: миром
  rationale: Передаёт требование возвратить землю без войны; формула «верни её миром» сохраняет краткость и официальный тон ультиматума.
theological_decisions:
- issue: Статус заявления аммонитского царя о принадлежности земли
  choice: 'Сохранено как его прямое обвинение: «мою землю»'
  alternative: Уточнить в тексте, что это лишь спорное притязание
  rationale: Стих сообщает позицию персонажа, а не подтверждает её историческую или богословскую правоту. Оценку этого притязания даёт последующий ответ Иеффая.
translation_notes:
  register: 'Современный литературный русский язык; речь краткая, dignified и понятная. Названия народов и имена переданы в привычной русской библейской форме: «аммонитяне», «Иеффай», «Арнон», «Иавок», «Иордан».'
