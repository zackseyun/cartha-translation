  text: הֲ/לֹ֞א אֵ֣ת אֲשֶׁ֧ר יוֹרִֽישְׁ/ךָ֛ כְּמ֥וֹשׁ אֱלֹהֶ֖י/ךָ אוֹת֥/וֹ תִירָ֑שׁ וְ/אֵת֩ כָּל אֲשֶׁ֨ר הוֹרִ֜ישׁ יְהוָ֧ה אֱלֹהֵ֛י/נוּ מִ/פָּנֵ֖י/נוּ אוֹת֥/וֹ נִירָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
translation:
  language: ru
  text: Разве ты не овладеешь тем, чем даст тебе овладеть Хамос, твой бог? А всем, что Яхве, наш Бог, изгнал перед нами,[a] овладеем мы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол ירשׁ может означать «владеть», «овладеть», «получить в наследие»; в каузативной форме — «дать овладеть» либо «лишить владения, изгнать». Здесь речь идёт о владении землёй, связанном с вытеснением прежних владельцев.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Не тем ли
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно вводит сопоставление двух притязаний на землю.
- source_word: יוֹרִישְׁךָ
  choice: дал тебе овладеть
  rationale: Передаёт каузативную форму ירשׁ и результат действия — получение владения; сопутствующий смысл вытеснения прежних владельцев пояснён во второй половине стиха.
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  choice: Хамос, твой бог
  rationale: Имя божества транслитерировано в принятой русской библейской форме; обозначение «твой бог» сохранено как часть дипломатической речи Иеффая.
- source_word: תִירָשׁ
  choice: ты владеешь
  rationale: В контексте территориального спора ירשׁ означает владеть землёй, полученной во владение; настоящее время по-русски естественно выражает принцип, на который ссылается риторический вопрос.
- source_word: הוֹרִישׁ
  choice: дал нам овладеть, изгнав прежних жителей
  rationale: Каузатив ירשׁ допускает взаимосвязанные значения «дать овладеть» и «лишить владения, изгнать»; формулировка сохраняет обе стороны действия и явно связывает его с последующим «мы будем владеть».
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: מִפָּנֵינוּ
  choice: перед нами
  rationale: Сохраняет пространственный образ еврейской идиомы и указывает на устранение прежних жителей с пути Израиля.
- source_word: נִירָשׁ
  choice: мы будем владеть
  rationale: Передаёт территориальный смысл ירשׁ и сохраняет лексическую связь с первой половиной стиха.
theological_decisions:
- issue: Упоминание Хамоса как «твоего бога» и приписывание ему действия
  choice: Сохранить прямую форму дипломатико-риторической речи Иеффая без оговорок
  alternative: Добавить кавычки, ироническую окраску или пояснение, отрицающее реальность силы Хамоса
  rationale: Еврейский текст формулирует довод с позиции адресата, но сам по себе не утверждает богословскую истинность языческого верования. Дополнительное дистанцирование разрешило бы напряжение, которого текст прямо не разрешает.
- issue: Семантическое напряжение каузатива ירשׁ
  choice: Передать одновременно дарование владения и изгнание прежних жителей
  alternative: Выбрать только «дал во владение» либо только «изгнал»
  rationale: В контексте речь идёт о приобретении территории через лишение прежних обитателей владения; развёрнутая формулировка сохраняет обе стороны значения.
translation_notes:
  register: Современный литературный русский язык с достоинством дипломатической речи. Параллелизм двух частей сохранён, однако порядок слов слегка перестроен ради ясности. Форма «Хамос» соответствует устойчивой русской библейской передаче имени; «Яхве» сохраняет личное Божье имя.
