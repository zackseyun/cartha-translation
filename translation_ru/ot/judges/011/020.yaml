source:
  edition: WLC
  text: וְ/לֹא הֶאֱמִ֨ין סִיח֤וֹן אֶת יִשְׂרָאֵל֙ עֲבֹ֣ר בִּ/גְבֻל֔/וֹ וַ/יֶּאֱסֹ֤ף סִיחוֹן֙ אֶת כָּל עַמּ֔/וֹ וַֽ/יַּחֲנ֖וּ בְּ/יָ֑הְצָ/ה וַ/יִּלָּ֖חֶם עִם יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/020.yaml
  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
translation:
  language: ru
  text: Но Сигон не доверял Израилю настолько, чтобы пропустить его через свои владения[a]. Тогда Сигон собрал весь свой народ[b], и они расположились станом в Иааце. Сигон вступил в бой с Израилем[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не поверил Израилю»; по смыслу: «не доверял Израилю настолько, чтобы позволить ему пройти».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «весь свой народ». Из военного контекста следует, что речь идёт о собранных для боя людях, но слово «войско» в еврейском тексте не употреблено.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально оборот можно передать: «воевал с Израилем»; по контексту это означает, что Сигон сражался против Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  choice: не доверял
  rationale: В породе hифиль глагол выражает доверие или уверенность в ком-либо. «Не доверял» естественно передаёт мотив отказа, не подменяя сам глагол его следствием — «не позволил».
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: пропустить его через свои владения
  rationale: Инфинитив עבר в сочетании с גבול здесь обозначает проход через землю, находящуюся под властью Сигона. «Владения» передаёт территориальный, а не только пограничный смысл גבול.
- source_word: וַיֶּאֱסֹף
  choice: собрал
  rationale: Глагол описывает сбор людей, в данном контексте — для войны, но перевод не вводит отсутствующее в тексте слово «войско».
- source_word: כָּל עַמּוֹ
  choice: весь свой народ
  rationale: Буквально сказано «весь его народ». Военный контекст допускает понимание «все его воины», однако исходный текст прямо этого не уточняет.
- source_word: וַיַּחֲנוּ
  choice: они расположились станом
  rationale: Множественное число сказуемого относится к собранным людям. Выражение сохраняет образ военного лагеря и звучит достойно и понятно по-русски.
- source_word: בְּיָהְצָה
  choice: в Иааце
  rationale: Передано традиционное русское написание топонима; предлог указывает на место стоянки.
- source_word: וַיִּלָּחֶם עִם
  choice: вступил в бой с
  rationale: Единственное число вновь указывает на Сигона. Оборот с עִם буквально строится как «воевал с», а контекст ясно выражает враждебное действие.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены смена числа подлежащего («они расположились») и возвращение к Сигону в последнем предложении. Формулировки не уточняют «народ» как «войско» и сохраняют оттенок доверия в הֶאֱמִין.
