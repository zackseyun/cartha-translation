  register: 'Современный литературный русский язык; краткая повествовательная фраза с достоинством библейского регистра. Синтаксическая двусмысленность местоимений устранена лишь настолько, насколько того требует ясность по контексту: отправителем слов назван Иеффай, адресатом — царь аммонитян.'
