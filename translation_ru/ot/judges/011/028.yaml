  text: וְ/לֹ֣א שָׁמַ֔ע מֶ֖לֶךְ בְּנֵ֣י עַמּ֑וֹן אֶל דִּבְרֵ֣י יִפְתָּ֔ח אֲשֶׁ֥ר שָׁלַ֖ח אֵלָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/028.yaml
  text: But the king of the Ammonites did not listen to the words of Jephthah that he sent to him.
translation:
  language: ru
  text: Но царь аммонитян не послушал слов Иеффая, которые Иеффай послал ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: Но … не послушал
  rationale: В контексте וְ передаёт противопоставление итогового отказа предшествующему обращению Иеффая; שׁמע с אֶל означает не просто услышать, а внять, послушать.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: царь аммонитян
  rationale: Естественный русский эквивалент буквального «царь сынов Аммона», обозначающего народ аммонитян.
- source_word: דִּבְרֵי יִפְתָּח
  choice: слов Иеффая
  rationale: Сохраняется именная конструкция исходного текста без сведения её к безличному «словам».
- source_word: אֲשֶׁר שָׁלַח אֵלָיו
  choice: которые тот передал ему
  rationale: «Тот» однозначно относит действие к Иеффаю, а «передал» естественно выражает отправку слов через посланников; местоименное «ему» сохраняет царя адресатом.
theological_decisions: []
