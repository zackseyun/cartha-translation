base_translation:
  language: en
  yaml_path: translation/ot/judges/011/026.yaml
  text: While Israel has lived in Heshbon and its daughter towns[a], and in Aroer and its daughter towns, and in all the cities that are along the Arnon, for three hundred years[b], why did you not recover them during that time?
translation:
  language: ru
  text: Вот уже триста лет Израиль живёт в Есевоне и зависимых от него поселениях[a], в Ароере и зависимых от него поселениях, а также во всех городах вдоль Арнона. Почему же за всё это время вы не отвоевали их[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его дочерях» — так назывались меньшие поселения, зависевшие от главного города.'
    reason: cultural_note
  - marker: b
    text: 'Или: «не спасли их», «не избавили их», «не вырвали их». В данном споре о территории смыслом может быть её возвращение под свой контроль.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁבֶת יִשְׂרָאֵל
  choice: Израиль живёт
  rationale: Предлог ב с инфинитивом-сопряжённым выражает временное обстоятельство, а контекст указывает на длительное пребывание, продолжающееся уже триста лет. Настоящее время естественно передаёт эту длительность по-русски.
- source_word: בְּנוֹתֶיהָ
  choice: зависимых от него поселениях
  rationale: Буквально «его дочерях»; это древнееврейское обозначение меньших поселений, административно или территориально связанных с главным городом. Перевод раскрывает идиому, а сноска сохраняет буквальный образ.
- source_word: חֶשְׁבּוֹן
  choice: Есевон
  rationale: Устоявшаяся в русской библейской традиции форма названия города Хешбон.
- source_word: עַרְעוֹר
  choice: Ароер
  rationale: Устоявшаяся русская форма географического названия.
- source_word: עַל יְדֵי אַרְנוֹן
  choice: вдоль Арнона
  rationale: Выражение означает «у, рядом с, вдоль»; речь идёт о нескольких городах, расположенных по течению или близ русла Арнона.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: уже триста лет
  rationale: Частица «уже» естественно подчёркивает длительность пребывания, на которой строится риторический довод.
- source_word: הִצַּלְתֶּם
  choice: не вернули
  rationale: Hiphil глагола נצל обычно значит «избавить, спасти, вырвать», но в споре о территории означает вернуть её из чужого владения. Формулировка сохраняет риторическую перспективу собеседников, не утверждая от лица переводчика законность их притязаний.
- source_word: בָּעֵת הַהִיא
  choice: за всё это время
  rationale: Хотя буквально выражение означает «в то время», здесь оно отсылает ко всему названному трёхсотлетнему периоду; русский вариант ясно передаёт этот временной охват.
theological_decisions:
- issue: Подразумевает ли «вернули» законное право аммонитян на эту землю
  choice: Передать реплику как риторический довод Иеффая, не подтверждая притязание повествовательным голосом
  alternative: 'Перевести нейтральнее: «не отняли их»'
  rationale: Глагол допускает значения «избавить, вырвать, возвратить», а контекст — спор о праве на территорию. «Вернули» отражает логику вопроса, но сноска показывает лексическую неоднозначность и не разрешает сам спор.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства прямой речи. Устоявшиеся русские формы топонимов — Есевон, Ароер и Арнон. Повтор оборота о зависимых поселениях сохранён в соответствии с древнееврейским текстом.
