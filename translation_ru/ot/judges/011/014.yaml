  text: וַ/יּ֥וֹסֶף ע֖וֹד יִפְתָּ֑ח וַ/יִּשְׁלַח֙ מַלְאָכִ֔ים אֶל מֶ֖לֶךְ בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/014.yaml
  text: Then Jephthah again sent messengers to the king of the Ammonites[a].
translation:
  language: ru
  text: Иеффай снова послал посланников к царю аммонитян[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к царю сыновей Аммона» — то есть аммонитян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: снова
  rationale: Сочетание יָסַף עוֹד с последующим личным глаголом выражает повторение или продолжение действия. В данном контексте естественное русское «снова» передаёт основной смысл без тяжеловесного буквального оборота.
- source_word: יִפְתָּח
  choice: Иеффай
  rationale: Традиционная и узнаваемая русская форма библейского личного имени.
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное и точное соответствие глаголу שׁלח в повествовательном контексте.
- source_word: מַלְאָכִים
  choice: посланников
  rationale: В дипломатическом контексте слово обозначает людей, передающих сообщение, а не ангелов. «Посланники» сохраняет широкий смысл исходного слова и соответствует литературному регистру.
- source_word: אֶל
  choice: к
  rationale: Предлог естественно передаёт направление к лицу — адресату посольства.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: царю аммонитян
  rationale: Выражение בְּנֵי עַמּוֹן буквально означает «сыновья Аммона», но служит обычным этническим обозначением аммонитян. Русская форма естественна и точно передаёт референт.
