base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
translation:
  language: ru
  text: Иеффай пошёл со старейшинами Галаада, и народ поставил его над собой главой и начальником[a]. Иеффай произнёс все свои слова перед Яхве в Мицпе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главой и правителем» или «главой и военачальником». Еврейское слово, переведённое как «начальник», может обозначать правителя, руководителя или военного командира.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Иеффай повторил все свои условия перед Яхве в Мицпе». Буквально: «произнёс все свои слова».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ יִפְתָּח עִם זִקְנֵי גִלְעָד
  choice: Иеффай пошёл со старейшинами Галаада
  rationale: Форма וַיֵּלֶךְ продолжает повествование и естественно передаётся глаголом «пошёл»; עִם обозначает совместное действие, а זִקְנֵי — общественных руководителей Галаада.
- source_word: וַיָּשִׂימוּ הָעָם אֹתוֹ עֲלֵיהֶם
  choice: народ поставил его над собой
  rationale: Сочетание שׂים с עַל выражает назначение человека на власть над другими; «поставил над собой» сохраняет образ и смысл еврейской конструкции.
- source_word: לְרֹאשׁ
  choice: главой
  rationale: רֹאשׁ буквально означает «голова», а применительно к человеку — главу или высшего руководителя; русское «главой» сохраняет метафору и звучит естественно.
- source_word: וּלְקָצִין
  choice: и военачальником
  rationale: קָצִין может обозначать начальника, правителя или военного командира. В контексте предстоящей войны «военачальник» хорошо передаёт военную сторону должности, не устраняя более широкого руководящего смысла, отмеченного в сноске.
- source_word: וַיְדַבֵּר יִפְתָּח אֶת כָּל דְּבָרָיו
  choice: Иеффай произнёс все свои слова
  rationale: Перевод близко следует буквальному выражению «говорил/произнёс все свои слова» и не сужает его до молитвы, клятвы или формального повторения условий.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Оборот לִפְנֵי передаёт действие в присутствии Бога и его торжественный характер; «перед» сохраняет обычную библейскую формулу.
- source_word: בַּמִּצְפָּה
  choice: в Мицпе
  rationale: Название места передано транслитерацией; предлог «в» естественно обозначает место собрания и речи.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит тетраграмматон. Передача «Яхве» сохраняет личное заветное имя, не заменяя его титулом.
- issue: Характер слов Иеффая перед Яхве
  choice: произнёс все свои слова
  alternative: повторил все свои условия; изложил всё дело
  rationale: Выражение может подразумевать торжественное подтверждение договорённостей, обращение к Богу или их засвидетельствование перед Ним. Буквально широкая формулировка сохраняет эту неоднозначность.
- issue: Соотношение титулов רֹאשׁ и קָצִין
  choice: главой и военачальником
  alternative: вождём и правителем; главой и начальником
  rationale: Два разных титула, вероятно, подчёркивают общее руководство и командование в войне. Перевод сохраняет оба, не сводя их к одной должности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксис остаётся близким к еврейскому тексту, но избегает тяжеловесности. Имена переданы как «Иеффай», «Галаад», «Мицпа»; божественное имя — «Яхве».
