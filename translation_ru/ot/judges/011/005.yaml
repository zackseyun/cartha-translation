lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: Повествовательная формула вводит следующее событие и имеет временное значение; в современном русском простое «когда» естественно передаёт эту связь без тяжеловесного «и было, когда».
- source_word: נִלְחֲמוּ
  choice: вступили в бой
  rationale: Форма глагола לחם обозначает вооружённое противостояние. Такой перевод естественен по-русски и сохраняет событийный характер повествования.
- source_word: בְנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Это обычное этническое обозначение народа Аммона; «аммонитяне» — точный и общепринятый русский эквивалент.
- source_word: עִם יִשְׂרָאֵל
  choice: с Израилем
  rationale: Предлог עִם буквально означает «с», а при глаголе со значением сражения обозначает противную сторону. Русское «вступили в бой с Израилем» ясно выражает враждебное противостояние.
- source_word: זִקְנֵי גִלְעָד
  choice: старейшины Галаада
  rationale: Сочетание обозначает признанных руководителей области Галаад; перевод сохраняет структуру и традиционные русские библейские имена.
- source_word: לָקַחַת
  choice: привести
  rationale: Хотя לקח часто значит «взять», здесь старейшины идут к Иеффаю, чтобы забрать его с собой и привести обратно. «Привести» естественно передаёт направленность действия в данном контексте.
- source_word: אֶת יִפְתָּח
  choice: Иеффая
  rationale: Передано традиционное русское написание личного имени с требуемой падежной формой прямого дополнения.
- source_word: מֵאֶרֶץ טוֹב
  choice: из земли Тов
  rationale: אֶרֶץ здесь обозначает землю или территорию, а Тов — географическое название. Формулировка сохраняет смысл и традиционный библейский регистр.
