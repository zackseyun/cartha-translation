base_translation:
  language: en
  yaml_path: translation/ot/judges/011/033.yaml
  text: And he struck them from Aroer as far as the entrance to Minnith[a], twenty cities, and as far as Abel-keramim, with a very great slaughter[d][c][b]. So the sons of Ammon were subdued before the sons of Israel.
translation:
  language: ru
  text: Он поразил их от Ароэра до подступов к Миннифу[a] — двадцать городов — и до Авел-Керамима[b], нанеся им чрезвычайно тяжёлое поражение[c]. Так аммонитяне были покорены израильтянами[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «до Миннифа» или «до входа в Минниф». Еврейское выражение может обозначать как подступы к городу, так и сам город.'
    reason: alternative_reading
  - marker: b
    text: Авел-Керамим — название местности; его составные части могут означать «луг виноградников».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «весьма великим ударом»; в военном контексте речь идёт о сокрушительном разгроме.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «сыны Аммона были покорены перед сынами Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: Он поразил их
  rationale: Глагол נכה передаёт конкретное военное действие — «поразить, нанести удар»; масштаб разгрома уточняется далее.
- source_word: מֵעֲרוֹעֵר
  choice: от Ароэра
  rationale: Географическое название передано транслитерацией в принятой русской библейской форме.
- source_word: וְעַד בּוֹאֲךָ מִנִּית
  choice: до подступов к Миннифу
  rationale: Трудное географическое выражение может указывать на подход или вход в город; «до подступов» естественно по-русски и сохраняет эту пространственную нюансировку.
- source_word: עֶשְׂרִים עִיר
  choice: двадцать городов
  rationale: Прямое соответствие числительного и существительного; оборот присоединён как пояснение протяжённости разгрома.
- source_word: וְעַד אָבֵל כְּרָמִים
  choice: и до Авел-Керамима
  rationale: Сочетание функционирует как топоним и потому транслитерируется, а не переводится по составляющим.
- source_word: מַכָּה גְּדוֹלָה מְאֹד
  choice: нанеся им чрезвычайно тяжёлое поражение
  rationale: В военном контексте מַכָּה обозначает сокрушительный удар или разгром. «Тяжёлое поражение» передаёт смысл, не утверждая сверх текста, что все были убиты.
- source_word: וַיִּכָּנְעוּ
  choice: были покорены
  rationale: Нифаль от כנע здесь описывает военно-политическое подчинение, а не только внутреннее смирение.
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Современное русское обозначение народа естественнее буквального «сыны Аммона» и сохраняет референциальный смысл.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: израильтянами
  rationale: В сочетании с пассивным «были покорены» творительный падеж естественно передаёт, перед кем и чьей силой они были подчинены.
