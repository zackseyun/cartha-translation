  text: וַ/יַּעֲבֹ֥ר יִפְתָּ֛ח אֶל בְּנֵ֥י עַמּ֖וֹן לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/032.yaml
  text: So Jephthah crossed over to the Ammonites to fight against them[a], and Yahweh gave them into his hand.
translation:
  language: ru
  text: И перешёл Иеффай к аммонитянам, чтобы сразиться с ними, и Яхве отдал их в его руки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: перешёл
  rationale: Сохраняет основное пространственное значение глагола עבר — переходить, переправляться — и не заменяет его более толковательным «выступил против».
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: к аммонитянам
  rationale: Предлог אֶל передаёт направление движения («к»), а בְּנֵי עַמּוֹן является обычным этнонимом, естественно передаваемым как «аммонитяне».
- source_word: לְהִלָּחֶם בָּם
  choice: чтобы сразиться с ними
  rationale: Передаёт цель движения и военное значение конструкции לחם с ב; «сразиться» естественно для повествования о битве и не усиливает выражение до «вести войну».
- source_word: וַיִּתְּנֵם
  choice: отдал их
  rationale: В сочетании с «в руки» глагол נתן выражает передачу врагов под власть победителя; «отдал» ясно передаёт смысл устойчивого военного оборота.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное Божье имя, обозначенное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּיָדוֹ
  choice: в его руки
  rationale: Сохраняет древнееврейский образ власти над побеждёнными; множественное число «руки» является естественной формой этого оборота в современном русском языке.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя יְהוָה. Форма «Яхве» непосредственно передаёт имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм двух последовательных действий сохранён; этническое наименование передано идиоматически, а образ «отдал в руки» оставлен прозрачным и естественным.
