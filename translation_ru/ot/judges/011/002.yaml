base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: ru
  text: 'Жена Галаада родила ему сыновей. Когда сыновья жены Галаада выросли, они выгнали Иеффая и сказали ему: «Ты не получишь наследства в доме нашего отца, потому что ты сын другой женщины».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת גִּלְעָד
  choice: жена Галаада
  rationale: Прямо передаёт конструкцию принадлежности и сохраняет противопоставление матери Иеффая, названной в предыдущем стихе блудницей.
- source_word: בְנֵי הָאִשָּׁה
  choice: сыновья этой жены
  rationale: Определённый артикль отсылает к только что упомянутой жене Галаада; указательное «этой» естественно выражает эту анафору по-русски, не подменяя её притяжательным местоимением.
- source_word: וַיְגָרְשׁוּ
  choice: выгнали
  rationale: Передаёт насильственное удаление Иеффая из семьи и дома простым современным глаголом.
- source_word: לֹא תִנְחַל
  choice: Ты не получишь наследства
  rationale: Глагол נחל здесь относится к получению наследственной доли; такая формулировка естественна по-русски и не уточняет юридический механизм сверх текста.
- source_word: בְּבֵית אָבִינוּ
  choice: в доме нашего отца
  rationale: Сохраняет буквальный семейно-родовой образ «дома», который может охватывать и хозяйство, и род отца.
- source_word: בֶּן אִשָּׁה אַחֶרֶת
  choice: сын другой женщины
  rationale: Точно сохраняет намеренно обобщённое и отчуждающее обозначение матери Иеффая.
theological_decisions:
- issue: Основание для лишения Иеффая наследства
  choice: Слова братьев переданы как их утверждение без одобрения рассказчика
  alternative: Сформулировать их слова как законное или нормативное решение
  rationale: Древнееврейский текст сообщает о поступке и речи братьев, но не даёт здесь богословской или правовой оценки их решения.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное, прямая речь сохраняет семейно-правовой оттенок оригинала.
