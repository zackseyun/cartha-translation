base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
translation:
  language: ru
  text: 'Иеффай сказал старейшинам Галаада: «Разве не вы ненавидели меня и выгнали меня из дома моего отца? Почему же вы пришли ко мне теперь, когда вы в беде?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда вам стало тяжело». Еврейский оборот выражает стеснённое, бедственное положение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר; нейтральное «сказал» точно передаёт ввод прямой речи.
- source_word: זִקְנֵי גִלְעָד
  choice: старейшинам Галаада
  rationale: Слово זָקֵן во множественном числе здесь обозначает признанных руководителей общины, а не просто пожилых людей.
- source_word: הֲלֹא
  choice: разве не вы
  rationale: Частица вводит риторический вопрос, предполагающий утвердительный ответ; местоимение «вы» передаёт заложенное в глагольной форме противопоставление.
- source_word: שְׂנֵאתֶם
  choice: ненавидели
  rationale: Прямое значение שׂנא сохранено без смягчения до «не любили» или истолкования как одного лишь отвержения.
- source_word: וַתְּגָרְשׁוּנִי
  choice: выгнали меня
  rationale: Глагол גרשׁ выражает насильственное или решительное изгнание; «выгнали» естественно и точно передаёт эту силу.
- source_word: מִבֵּית אָבִי
  choice: из дома моего отца
  rationale: Формулировка сохраняет образ отцовского дома, который может охватывать как жилище, так и семейно-родовую среду.
- source_word: וּמַדּוּעַ
  choice: почему же
  rationale: Частица וּ связывает второй вопрос с предыдущим упрёком, а «же» естественно выражает этот вывод и контраст.
- source_word: בָּאתֶם אֵלַי עַתָּה
  choice: вы пришли ко мне теперь
  rationale: Совершённое действие передано естественным русским прошедшим временем; «теперь» сохраняет временное ударение עַתָּה.
- source_word: כַּאֲשֶׁר צַר לָכֶם
  choice: когда оказались в беде
  rationale: Оборот с צַר и ל описывает стеснённое, бедственное положение. Этот вариант естественен по-русски и не уточняет сверх текста характер угрозы.
