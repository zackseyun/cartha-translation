base_translation:
  language: en
  yaml_path: translation/ot/judges/011/009.yaml
  text: Jephthah said to the elders of Gilead[a], “If you bring me back to fight against the Ammonites, and Yahweh gives them before me[b], I will be your head.”
translation:
  language: ru
  text: 'Иеффай сказал старейшинам Галаада: «Если вы вернёте меня, чтобы сражаться с аммонитянами, и Яхве предаст их мне, то я буду вашим главой[a][b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предводителем» или «начальником».'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительную фразу в контексте переговоров можно понять и как вопрос: «То буду ли я вашим главой?» По форме еврейский текст представляет собой утверждение.'
    reason: alternative_reading
lexical_decisions:
- source_word: מְשִׁיבִים אַתֶּם אוֹתִי
  choice: вы вернёте меня
  rationale: Каузативная форма глагола שׁוב означает «сделать так, чтобы кто-либо вернулся». В контексте Иеффай ранее был изгнан, поэтому «вернёте меня» естественно и точно передаёт его возвращение по инициативе старейшин.
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: чтобы сражаться с аммонитянами
  rationale: Инфинитив לחם обозначает участие в битве, а ב имеет здесь значение противостояния. Русское «сражаться с аммонитянами» передаёт военный контекст естественно и без лишнего расширения.
- source_word: וְנָתַן יְהוָה אוֹתָם לְפָנַי
  choice: и Яхве предаст их мне
  rationale: Оборот נתן + לפני буквально говорит о том, что Яхве «даст их передо мной», то есть отдаст противников Иеффаю на поражение. «Предаст их мне» естественно выражает этот смысл по-русски, не вводя отсутствующего в еврейском тексте образа руки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией «Яхве», а не заменено титулом.
- source_word: לְרֹאשׁ
  choice: главой
  rationale: רֹאשׁ буквально означает «голова», а метафорически — главу, начальника или вождя. «Главой» сохраняет образ исходного текста и ясно обозначает положение руководителя.
- source_word: אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ
  choice: то я буду вашим главой
  rationale: Формально это утвердительное предложение без вопросительной частицы. Оно естественно завершает условную конструкцию как заявленное Иеффаем условие его возвращения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога, поэтому оно сохраняется в переводе, а не заменяется титулом.
- issue: Коммуникативная сила заключительной фразы
  choice: 'утверждение: «то я буду вашим главой»'
  alternative: 'вопрос: «то буду ли я вашим главой?»'
  rationale: В еврейском тексте нет вопросительной частицы, и по форме фраза является утверждением. Вместе с тем контекст переговоров допускает понимание фразы как требования подтверждения; эта неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис условного высказывания сделан естественным для русского языка; собственное имя Яхве и метафора «глава» сохранены.
