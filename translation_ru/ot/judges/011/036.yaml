base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
translation:
  language: ru
  text: 'Она сказала ему: «Отец мой, ты открыл уста перед Яхве[a]; сделай со мной согласно тому, что вышло из твоих уст, ведь Яхве отомстил за тебя твоим врагам — сынам Аммона[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «открыть уста перед Яхве» означает торжественно произнести обет.
    reason: cultural_note
  - marker: b
    text: 'Или: «аммонитянам». Буквально: «сынам Аммона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצִיתָה אֶת־פִּיךָ
  choice: ты открыл уста
  rationale: Сохранён конкретный еврейский образ, обозначающий торжественно произнесённый обет; пояснение дано в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: עֲשֵׂה לִי
  choice: сделай со мной
  rationale: Прямо передаёт готовность дочери принять исполнение сказанного отцом, не уточняя спорную природу обета.
- source_word: כַּאֲשֶׁר יָצָא מִפִּיךָ
  choice: то, что вышло из твоих уст
  rationale: Сохраняет повторяющийся образ уст и подчёркивает обязательную силу произнесённых слов.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: ведь
  rationale: В данном контексте выражение указывает на основание её слов, а не просто на временную последовательность.
- source_word: עָשָׂה לְךָ יְהוָה נְקָמוֹת
  choice: Яхве отомстил за тебя
  rationale: Естественно по-русски передаёт совершённые Яхве действия возмездия в пользу Иеффая.
- source_word: מֵאֹיְבֶיךָ מִבְּנֵי עַמּוֹן
  choice: твоим врагам — сынам Аммона
  rationale: Формулировка ясно называет врагов объектом возмездия и сохраняет буквальное этническое обозначение древнееврейского текста.
theological_decisions:
- issue: Характер обета Иеффая в ответе его дочери
  choice: Не уточнять, означал ли обет буквенное жертвоприношение или пожизненное посвящение.
  alternative: Истолковать её слова как согласие либо на смерть в жертву, либо на пожизненное девство и служение.
  rationale: Сам этот стих говорит лишь о её готовности принять исполнение обета и не определяет способ его исполнения; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Конкретные образы исходного текста сохранены там, где они понятны из контекста или могут быть кратко пояснены в сноске.
