base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
translation:
  language: ru
  text: И теперь Яхве, Бог Израиля, изгнал аморреев от лица Своего народа Израиля, а ты завладеешь им?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «завладеешь им?» Мужской суффикс может относиться к «аморрею» как собирательному обозначению народа; в контексте земельного спора он также может подразумевать его территорию. Глагол также может означать «получить во владение» или «унаследовать».'
    reason: Лексическая и референциальная неоднозначность еврейского глагола ירש и его объектного суффикса.
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Сохраняет соединительную силу выражения и вводит вывод Иеффая из предшествующего исторического довода.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямая и естественная передача сопряжённой конструкции, уточняющей, Кто такой Яхве.
- source_word: הוֹרִישׁ
  choice: изгнал
  rationale: Форма hифиль глагола ירש обозначает устранение народа с занимаемой земли, то есть лишение владений; «изгнал» естественно звучит по-русски и сохраняет действие в земельном споре.
- source_word: הָאֱמֹרִי
  choice: аморреев
  rationale: Единственное число в еврейском употреблено собирательно; русский язык естественно называет народ во множественном числе.
- source_word: מִפְּנֵי עַמּוֹ יִשְׂרָאֵל
  choice: перед своим народом Израилем
  rationale: Сохраняет пространственный образ исходного текста и приложение «Израилем» при слове «народом».
- source_word: וְאַתָּה תִּירָשֶׁנּוּ
  choice: а ты хочешь завладеть их землёй?
  rationale: Эмфатическое «ты» и форма вопроса передают вызов Иеффая. В контексте земельного спора ירש означает вступить во владение; объектный суффикс допускает отнесение к собирательному «аморрею», то есть к его территории, что пояснено в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Объект в заключительном риторическом вопросе
  choice: их землёй
  alternative: им; ею; его владениями
  rationale: Мужской суффикс единственного числа грамматически соотносится с собирательным обозначением аморреев, однако спор идёт о территории. Перевод делает подразумеваемый земельный объект понятным, а сноска сохраняет грамматическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой дипломатической речи. Риторическая острота подчёркнута сочетанием «а ты хочешь». Местоимение при Боге написано со строчной буквы в соответствии с обычной современной издательской практикой.
