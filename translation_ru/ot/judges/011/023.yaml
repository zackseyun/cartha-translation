  rationale: 'Исправлены две существенные точки: пространственное מִפְּנֵי передано как удаление аморреев «от лица» Израиля, а заключительный вопрос сохранён в форме будущего риторического вопроса без преждевременного уточнения объекта как «их земли». Сноска поясняет, но не устраняет исходную неоднозначность.'
