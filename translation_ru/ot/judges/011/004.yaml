lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Спустя некоторое время
  rationale: Еврейское выражение буквально означает «и было спустя дни», но идиоматически указывает на неопределённый промежуток времени. Выбран естественный современный русский эквивалент.
- source_word: וַיִּלָּחֲמוּ
  choice: пошли войной
  rationale: Форма от לחם обозначает вступление в вооружённую борьбу; в данном контексте выражение «пошли войной» естественно передаёт начало военных действий.
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Буквально «сыны Аммона»; здесь это устойчивое обозначение народа Аммона, для которого нормативным русским этнонимом является «аммонитяне».
- source_word: עִם יִשְׂרָאֵל
  choice: на Израиль
  rationale: Хотя עִם обычно значит «с», при глаголе войны оно обозначает противника. Русская конструкция «пошли войной на Израиль» ясно передаёт эту функцию.
