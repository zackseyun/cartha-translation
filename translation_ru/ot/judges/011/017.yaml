base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
translation:
  language: ru
  text: 'Тогда Израиль послал вестников к царю Эдома со словами: «Позволь мне[a] пройти через твою землю», но царь Эдома не внял. Израиль послал также к царю Моава, но тот не согласился[b], и Израиль остался в Кадеше.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр. «мне»: Израиль говорит о себе как о едином целом; возможно также: «нам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но тот не захотел»; «но тот отказался».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычная форма повествовательного прошедшего времени; простое «послал» естественно передаёт действие.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В дипломатическом контексте речь идёт о людях-посланцах, а не об ангелах.
- source_word: אֶעְבְּרָה נָּא
  choice: Позволь мне пройти
  rationale: 'Сохранено первое лицо единственного числа: Израиль говорит о себе как о едином народе; נָא придаёт просьбе вежливый оттенок.'
- source_word: בְאַרְצֶךָ
  choice: через твою землю
  rationale: В сочетании с глаголом движения предлог обозначает проход по территории.
- source_word: וְלֹא שָׁמַע
  choice: не послушал
  rationale: Здесь שׁמע означает не просто услышать, а прислушаться и удовлетворить просьбу.
- source_word: וְלֹא אָבָה
  choice: не согласился
  rationale: אָבָה выражает отсутствие желания или согласия; «не согласился» точно и естественно в дипломатическом контексте.
- source_word: וַיֵּשֶׁב
  choice: остался
  rationale: В контексте пути глагол означает продолжить находиться в данном месте, не подразумевая постоянного поселения.
- source_word: בְּקָדֵשׁ
  choice: в Кадеше
  rationale: Естественное русское управление с названием населённого пункта или местности.
