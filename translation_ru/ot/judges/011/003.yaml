  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
translation:
  language: ru
  text: Иеффай убежал от своих братьев и поселился в земле Тов. К Иеффаю стали собираться никчёмные люди[a] и выходили с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пустые люди»; это древнееврейское выражение обозначает людей низкого положения или дурной репутации, а не просто неимущих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: убежал
  rationale: Глагол ברח обозначает бегство от опасности или враждебного давления; «убежал» естественно передаёт вынужденный уход Иеффая.
- source_word: מִפְּנֵי אֶחָיו
  choice: от своих братьев
  rationale: Идиома מִפְּנֵי буквально означает «от лица/присутствия», а здесь указывает, от кого бежал Иеффай. Возвратное «своих» устраняет возможную русскую двусмысленность.
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: В данном повествовательном контексте ישב означает проживание в определённой земле; «поселился» звучит естественно и не требует архаичного «обитал».
- source_word: בְּאֶרֶץ טוֹב
  choice: в земле Тов
  rationale: אֶרֶץ передано традиционным географическим выражением «земля», а טוֹב — транслитерацией названия местности «Тов».
- source_word: וַיִּתְלַקְּטוּ אֶל יִפְתָּח
  choice: к Иеффаю стали собираться
  rationale: Возвратная форма передаёт постепенное объединение людей, а אֶל сохраняется направительным «к», не добавляя более конкретного характера их сообщества.
- source_word: אֲנָשִׁים רֵיקִים
  choice: никчёмные люди
  rationale: Буквально רֵיקִים — «пустые», но в этой идиоме слово характеризует людей низкого положения или дурной репутации. «Никчёмные» сохраняет отрицательную оценку, не уточняя сверх текста, были ли они преступниками, праздными или бедными.
- source_word: וַיֵּצְאוּ עִמּוֹ
  choice: ходили с ним
  rationale: Буквально выражение означает «выходили с ним». В русском повествовании «ходили с ним» естественно передаёт неоднократное совместное участие, сохраняя неопределённость относительно цели этих выходов и не вводя предположение о набегах.
