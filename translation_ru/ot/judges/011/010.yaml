    text: 'Буквально: «Яхве будет слушающим между нами». В формуле обязательства это означает, что он внимает сторонам как свидетель и судья.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ זִקְנֵי גִלְעָד
  choice: И сказали старейшины Галаада
  rationale: Повествовательный וַ передаёт последовательность событий; русское «И сказали» сохраняет библейскую связность и остаётся естественным. Сопряжённая конструкция обозначает признанных старейшин Галаада.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: Пусть … рассудит между нами
  rationale: 'Буквально выражение говорит о том, что Яхве будет «слушающим между нами». В контексте клятвенного обязательства это судебная формула: Бог выслушивает стороны как свидетель и судья. «Рассудит между нами» естественно передаёт этот смысл, а буквальная образность сохранена в сноске.'
- source_word: אִם לֹא
  choice: если … не
  rationale: Сочетание вводит условие, при котором Яхве выступит судьёй между сторонами, и не сглаживается до простого усилительного заверения.
- source_word: כִדְבָרְךָ כֵּן נַעֲשֶׂה
  choice: мы не поступим так, как ты сказал
  rationale: Передаёт соответствие будущих действий старейшин словам и условиям Иеффая; форма נַעֲשֶׂה в данном контексте имеет значение обязательства о будущем действии.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Роль Яхве в формуле обязательства
  choice: Пусть Яхве рассудит между нами
  alternative: Яхве будет свидетелем между нами
  rationale: Причастие שֹׁמֵעַ буквально означает «слушающий» и в данном контексте допускает взаимосвязанные оттенки свидетеля и судьи. Основной текст передаёт судебную функцию естественным русским выражением, а сноска сохраняет буквальную форму и неоднозначность.
