  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
translation:
  language: ru
  text: 'И сказали старейшины Галаада Иеффаю: «Яхве будет свидетелем между нами[a], если мы не поступим так, как ты сказал».'
