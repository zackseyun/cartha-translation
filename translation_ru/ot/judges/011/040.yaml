  text: From year to year the daughters of Israel would go to commemorate the daughter of Jephthah the Gileadite four days in the year[a].
translation:
  language: ru
  text: Из года в год дочери Израиля ходили оплакивать дочь Иеффая Галаадитянина — по четыре дня в году.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поминать дочь Иеффая»; возможно также: «рассказывать о дочери Иеффая». Употреблённый здесь еврейский глагол редок, и его значение спорно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיָּמִים יָמִימָה
  choice: Из года в год
  rationale: Естественно передаёт идиому регулярного ежегодного повторения, сохраняя её образность.
- source_word: תֵּלַכְנָה
  choice: ходили
  rationale: Имперфект в данном контексте обозначает обычное, повторявшееся действие в прошлом.
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: дочери Израиля
  rationale: Формально близкая и понятная русская передача, не уточняющая без достаточных оснований возраст или семейное положение.
- source_word: לְתַנּוֹת
  choice: оплакивать
  rationale: Редкий и спорный глагол; в повествовательном контексте значение плача или скорби правдоподобно, а иные толкования сохранены в сноске.
- source_word: לְבַת יִפְתָּח
  choice: дочь Иеффая
  rationale: Прямо передаёт объект ежегодного действия; использована традиционная русская форма имени.
- source_word: הַגִּלְעָדִי
  choice: Галаадитянина
  rationale: Естественная русская форма этнохоронима, согласованная с родительным падежом имени Иеффая.
- source_word: אַרְבַּעַת יָמִים בַּשָּׁנָה
  choice: по четыре дня в году
  rationale: Ясно и естественно выражает ежегодную продолжительность обычая.
theological_decisions:
- issue: Характер ежегодного действия в отношении дочери Иеффая
  choice: 'В основном тексте: «оплакивать»'
  alternative: «поминать», «рассказывать о ней» или «восхвалять»
  rationale: Значение редкого еврейского глагола спорно и связано с разными пониманиями участи дочери Иеффая. Основной текст следует контекстуально правдоподобному традиционному пониманию, не скрывая иных возможностей в сноске.
