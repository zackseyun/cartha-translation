  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Иеффай направляет человеческих посланников царю аммонитян и предъявляет претензию по поводу его прихода для войны на земле Иеффая. «Послов», «царю аммонитян», «воевать» и «на моей земле» точно соответствуют контексту. Однако «Что у меня с тобой» в современном русском звучит неполно и не передаёт ясно устойчивую конфликтную идиому מַה־לִּי וָלָךְ.'
  naturalness: Предложение в целом литературно, но «Что у меня с тобой» без слова «общего» неестественно для современного русского и может быть понято как оборванная фраза. Добавление «общего» делает вопрос идиоматичным, не снимая его риторической враждебности. «На моей земле» в данном военном контексте естественнее, чем «в моей земле», при сохранении значения еврейского בְּ.
  terminology: Имя «Иеффай» и этноним «аммонитяне» допустимы и традиционно узнаваемы. Богословски нагруженных терминов нет. Сноска должна отражать альтернативное русское воспроизведение идиомы, а не приписывать ей чрезмерно узкое значение.
