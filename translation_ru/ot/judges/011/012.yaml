lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И послал
  rationale: Последовательная форма с וַ продвигает повествование; русское «и» естественно сохраняет связь и последовательность событий.
- source_word: יִפְתָּח
  choice: Иеффай
  rationale: Традиционная и узнаваемая русская передача библейского имени.
- source_word: מַלְאָכִים
  choice: послов
  rationale: В дипломатическом контексте речь идёт о людях, направленных с поручением; «послы» точнее передаёт их функцию, чем общее «вестники».
- source_word: אֶל מֶלֶךְ בְּנֵי עַמּוֹן
  choice: к царю аммонитян
  rationale: בְּנֵי עַמּוֹן здесь является обычным этническим обозначением аммонитян, а не требует буквального «сынов Аммона».
- source_word: לֵאמֹר
  choice: сказать
  rationale: Естественная русская формула введения прямой речи после глагола посылания.
- source_word: מַה לִּי וָלָךְ
  choice: Что у меня с тобой
  rationale: Русская формулировка сохраняет структуру и напряжённый, спорный характер древнееврейской идиомы, оставаясь понятной современному читателю.
- source_word: כִּי
  choice: что
  rationale: 'Союз вводит пояснение к вопросу и жалобе: приход аммонитян для войны.'
- source_word: בָאתָ אֵלַי
  choice: ты пришёл ко мне
  rationale: Сохранено прямое значение направления; враждебный смысл однозначно задаётся следующим לְהִלָּחֵם.
- source_word: לְהִלָּחֵם
  choice: воевать
  rationale: Форма означает вступать в вооружённую борьбу; «воевать» естественно сочетается с данным контекстом.
- source_word: בְּאַרְצִי
  choice: в моей земле
  rationale: Сохраняется значение предлога בְּ и конкретный образ земли, принадлежащей говорящему.
