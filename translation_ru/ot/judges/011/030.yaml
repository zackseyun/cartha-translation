lexical_decisions:
- source_word: וַיִּדַּר יִפְתָּח נֶדֶר
  choice: И дал Иеффай обет
  rationale: Русское устойчивое сочетание «дать обет» естественно передаёт однокоренную еврейскую конструкцию «пообещал обет», не воспроизводя её неестественную для русского языка тавтологию.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией и сохраняет направленность обета к его адресату.
- source_word: וַיֹּאמַר
  choice: сказав
  rationale: Деепричастная конструкция естественно связывает слова обета с предшествующим сообщением, не меняя последовательности действий.
- source_word: אִם
  choice: Если
  rationale: Вводит условную часть обета, которая остаётся синтаксически незавершённой до следующего стиха.
- source_word: נָתוֹן תִּתֵּן
  choice: Ты действительно предашь
  rationale: Сочетание абсолютного инфинитива с личной формой глагола выражает усиление. «Действительно» сохраняет этот акцент; прописная буква у местоимения ясно указывает на обращение к Яхве.
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитян
  rationale: Естественное русское обозначение народа Аммона вместо буквального «сынов Аммона».
- source_word: בְּיָדִי
  choice: в мои руки
  rationale: Русский библейский и общеупотребительный оборот «предать в руки» ясно передаёт смысл передачи под власть; множественное число естественно для русского языка, хотя в еврейском стоит единственное.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблено личное имя Бога; транслитерация сохраняет его как имя, не заменяя титулом.
- issue: Характер условной формулы обета
  choice: Если Ты действительно предашь
  alternative: Если Ты непременно предашь
  rationale: Формулировка сохраняет условность אִם и усиление נָתוֹן תִּתֵּן, не превращая слова Иеффая в утверждение или требование.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Стих намеренно заканчивается запятой: условная фраза и содержание обета продолжаются в следующем стихе.'
