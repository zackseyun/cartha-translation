base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
translation:
  language: ru
  text: 'Когда он увидел её, то разорвал на себе одежду и сказал: «Ах, дочь моя! Ты глубоко сокрушила меня и стала источником моей беды! А я открыл свои уста перед Яхве[a] и не могу отступить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть: «я дал обет Яхве». Буквально: «я открыл свои уста перед Яхве».'
    reason: Пояснение еврейского образного выражения, которое в данном контексте относится к обету.
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ
  choice: Когда он увидел её
  rationale: Повествовательная формула וַיְהִי с временной конструкцией естественно передаётся придаточным времени; отдельное «и случилось» здесь было бы излишне тяжеловесным.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: разорвал на себе одежду
  rationale: Устойчивое действие, выражающее горе и потрясение. «На себе» естественно для русского библейского повествования и поясняет жест, не меняя его смысла.
- source_word: אֲהָהּ
  choice: О горе
  rationale: Междометие передаёт сильную скорбь и отчаяние; выражение понятно современному читателю и сохраняет возвышенный тон.
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  choice: Ты глубоко сокрушила меня
  rationale: Инфинитив абсолютный перед личной формой усиливает глагол כרע. «Глубоко сокрушила» передаёт крайнюю степень подавленности, не сводя образ к буквальному физическому преклонению.
- source_word: וְאַתְּ הָיִיתְ בְּעֹכְרָי
  choice: и стала источником моей беды
  rationale: עכר обозначает причинение беды или несчастья. Такая передача звучит естественно и сохраняет причинный смысл, не усиливая обвинение до «погубила меня».
- source_word: וְאָנֹכִי פָצִיתִי פִי אֶל־יְהוָה
  choice: А я открыл свои уста перед Яхве
  rationale: Сохранён буквальный и торжественный еврейский оборот, который в контексте означает произнесение обета. «А я» передаёт выраженное местоимением אָנֹכִי противопоставление.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: וְלֹא אוּכַל לָשׁוּב
  choice: и не могу отступить
  rationale: שוב буквально означает «вернуться, повернуть назад»; в данном контексте речь о невозможности отступить от произнесённого. Формулировка сохраняет образ движения назад и остаётся естественной по-русски.
theological_decisions:
- issue: Следует ли прямо назвать слова Иеффая обетом в основном тексте
  choice: Сохранить образное выражение «открыл свои уста перед Яхве», пояснив его в сноске.
  alternative: «дал обет Яхве» или «дал слово Яхве»
  rationale: Контекст ясно указывает на обет, однако еврейский текст использует более образный и торжественный оборот. Его сохранение не разрешает скрыто то, что оригинал выражает косвенно.
- issue: Насколько сильно передавать обращённые к дочери слова Иеффая
  choice: «Ты глубоко сокрушила меня и стала источником моей беды»
  alternative: «Ты погубила меня» или «Ты стала моей погибелью»
  rationale: Оригинал выражает крайнее потрясение и называет дочь причиной беды, но не требует более сильного утверждения о погибели или нравственной виновности.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; сохранены эмоциональная сила речи Иеффая, образ «открытых уст» и личное имя Яхве. Маркер сноски поставлен при относящемся к ней выражении, а не после местоимения «её».
