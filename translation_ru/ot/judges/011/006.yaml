lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И сказали они
  rationale: Последовательная форма глагола אמר продолжает повествование; порядок слов сохраняет достоинство библейского повествования и остаётся естественным по-русски.
- source_word: לְיִפְתָּח
  choice: Иеффаю
  rationale: Имя יפתח передано принятой русской библейской формой «Иеффай» в дательном падеже.
- source_word: לְכָה
  choice: Иди
  rationale: Повелительная форма הלך здесь служит призывом последовать с говорящими. «Иди» передаёт её прямо, не добавляя отсутствующего в тексте «с нами».
- source_word: וְהָיִיתָה לָּנוּ
  choice: и стань нашим
  rationale: 'Буквальное «и будь для нас» естественно выражено по-русски как предложение принять назначенную роль: «стань нашим».'
- source_word: לְקָצִין
  choice: военачальником
  rationale: קָצִין обозначает начальника или предводителя; военный контекст делает «военачальник» точным и современно понятным соответствием.
- source_word: וְנִלָּחֲמָה
  choice: и мы сразимся
  rationale: Когортатив первого лица множественного числа передан как решительное совместное действие. Союз «и» сохраняет координацию исходного текста, не превращая её однозначно в придаточное цели.
- source_word: בִּבְנֵי עַמּוֹן
  choice: с аммонитянами[a]
  rationale: При לחם предлог ב обозначает противника, а буквальное «сыновья Аммона» является обычным этническим наименованием аммонитян. Русская конструкция «сразиться с» естественно обозначает противостояние.
