base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
translation:
  language: ru
  text: то, что или тот, кто выйдет из дверей моего дома навстречу мне, когда я с миром возвращусь от аммонитян, будет принадлежать ГОСПОДУ[a], и я принесу это в жертву всесожжения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет принадлежать ГОСПОДУ, или я принесу это в жертву всесожжения». Некоторые толкователи понимают стоящий здесь еврейский союз в разделительном смысле, как указание на два возможных исхода в зависимости от того, кто или что выйдет навстречу Иеффаю.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  choice: то, что выйдет
  rationale: Еврейская конструкция буквально означает «выходящий, который выйдет» и сама по себе не уточняет однозначно, будет ли это человек или животное. Русское «то, что выйдет» сохраняет эту существенную для повествования неопределённость лучше, чем «тот, кто выйдет».
- source_word: מִדַּלְתֵי בֵיתִי
  choice: из дверей моего дома
  rationale: Сохраняется множественное число דַּלְתֵי («двери») и образ выхода из дома; выражение понятно в современном литературном русском.
- source_word: לִקְרָאתִי
  choice: мне навстречу
  rationale: Естественно передаёт направленное движение для встречи, не добавляя подразумеваемого приветствия.
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: когда я с миром возвращусь
  rationale: «С миром» сохраняет более широкий смысл благополучного, невредимого возвращения, а не только прекращения военных действий.
- source_word: מִבְּנֵי עַמּוֹן
  choice: от аммонитян
  rationale: Современное название народа естественно передаёт буквальное «от сынов Аммона»; предлог указывает на возвращение после столкновения с ними.
- source_word: וְהָיָה לַיהוָה
  choice: будет принадлежать ГОСПОДУ
  rationale: Ясно выражает посвящение или принадлежность YHWH, не определяя заранее способ исполнения обета.
- source_word: לַיהוָה
  choice: ГОСПОДУ
  rationale: Тетраграмматон передан традиционным русским эквивалентом «ГОСПОДЬ».
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  choice: и я принесу это во всесожжение
  rationale: Это обычная жертвенная формула для Hiphil от עלה с עוֹלָה. Указательное «это» согласуется с намеренно неопределённым «то, что» и не решает заранее, идёт ли речь о человеке или животном.
theological_decisions:
- issue: Следует ли понимать ו между посвящением ГОСПОДУ и принесением во всесожжение как соединительное «и» или как разделительное «или».
  choice: В основном тексте — единый исход с соединительным «и».
  alternative: «будет принадлежать ГОСПОДУ или я принесу это во всесожжение» — два возможных исхода в зависимости от того, кто или что выйдет навстречу Иеффаю.
  rationale: Обычное значение ו — «и», и непосредственный синтаксис естественнее указывает на единый обет. Однако разделительное понимание возможно и существенно для толкования, поэтому оно отмечено в сноске, а не исключено молча.
translation_notes:
  register: Современный литературный, сдержанный и торжественный стиль. Необычное, но понятное выражение «из дверей моего дома» сохраняет форму оригинала. Неопределённость относительно человека или животного и напряжение между соединительным и разделительным прочтением союза сохранены.
