id: JDG.11.18
reference: Judges 11:18
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ בַּ/מִּדְבָּ֗ר וַ/יָּ֜סָב אֶת אֶ֤רֶץ אֱדוֹם֙ וְ/אֶת אֶ֣רֶץ מוֹאָ֔ב וַ/יָּבֹ֤א מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ לְ/אֶ֣רֶץ מוֹאָ֔ב וַֽ/יַּחֲנ֖וּ/ן בְּ/עֵ֣בֶר אַרְנ֑וֹן וְ/לֹא בָ֨אוּ֙ בִּ/גְב֣וּל מוֹאָ֔ב כִּ֥י אַרְנ֖וֹן גְּב֥וּל מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
translation:
  language: ru
  text: Затем он пошёл через пустыню, обогнул землю Эдома и землю Моава и подошёл к земле Моава с востока[a]. Они расположились станом по ту сторону Арнона[b], но не вошли в пределы Моава, потому что Арнон был границей Моава.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пришёл со стороны восхода солнца к земле Моава», то есть подошёл к ней с востока.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «за Арноном».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בַּמִּדְבָּר
  choice: пошёл через пустыню
  rationale: הלך — обычный глагол движения; в сочетании с בַּמִּדְבָּר контекст указывает на путь через пустынную, незаселённую местность. «Пустыня» естественно звучит по-русски и не обязательно означает только песчаную пустыню.
- source_word: וַיָּסָב
  choice: обогнул
  rationale: Глагол סבב здесь описывает обходной путь вокруг земель Эдома и Моава, а не движение через них. «Обогнул» кратко и ясно передаёт пространственный смысл.
- source_word: אֶרֶץ אֱדוֹם וְאֶת אֶרֶץ מוֹאָב
  choice: землю Эдома и землю Моава
  rationale: אֶרֶץ может означать землю, страну или территорию. «Земля» сохраняет обычную библейскую географическую формулировку и параллелизм оригинала.
- source_word: וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב
  choice: подошёл к земле Моава с востока
  rationale: Буквально выражение говорит о прибытии «со стороны восхода солнца». В данном маршруте это означает подход к земле Моава с восточной стороны; перевод сохраняет направление и согласуется с последующим уточнением, что в пределы Моава не вошли.
- source_word: וַיַּחֲנוּן
  choice: они расположились станом
  rationale: חנה означает разбить лагерь, расположиться станом. Множественное число оригинала сохранено, включая переход от предшествующего единственного числа, представляющего Израиль как единое целое, к множественному.
- source_word: בְּעֵבֶר אַרְנוֹן
  choice: по ту сторону Арнона
  rationale: עֵבֶר обозначает другую или дальнюю сторону. Формулировка сохраняет относительность точки отсчёта и не навязывает более точную географическую интерпретацию.
- source_word: וְלֹא בָאוּ בִּגְבוּל מוֹאָב
  choice: не вошли в пределы Моава
  rationale: גְּבוּל может обозначать как границу, так и ограниченную ею территорию. С глаголом движения выражение естественно означает, что израильтяне не вступили на моавитскую территорию.
- source_word: כִּי אַרְנוֹן גְּבוּל מוֹאָב
  choice: потому что Арнон был границей Моава
  rationale: Номинальное предложение объясняет, почему Израиль не вошёл в Моав. «Граница» прямо передаёт גְּבוּל в его пространственном значении.
