translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской географической лексикой. Сохранён переход от единственного числа («он» — Израиль как единое целое) к множественному («они»), присутствующий в еврейском тексте. Все примечания поставлены непосредственно при тех выражениях, к которым относятся.
