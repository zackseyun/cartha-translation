base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
translation:
  language: ru
  text: Тогда Дух Яхве сошёл на Иеффая, и он прошёл по Галааду и Манассии. Он прошёл через Мицпу Галаадскую, а из Мицпы Галаадской двинулся к аммонитянам[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перешёл к аммонитянам»; возможно также: «двинулся против аммонитян». Еврейский глагол может означать переход через местность, дальнейшее продвижение или движение к противнику; значение уточняется контекстом.'
    reason: Лексическая неоднозначность глагола עבר и синтаксиса заключительной фразы.
lexical_decisions:
- source_word: וַתְּהִי עַל יִפְתָּח רוּחַ יְהוָה
  choice: Тогда Дух Яхве был на Иеффае
  rationale: Оборот с רוּחַ и עַל в книге Судей обозначает наделение вождя силой от Бога. Формулировка «был на» близка еврейскому тексту и не добавляет отсутствующей в нём идеи нисхождения или постоянного пребывания.
- source_word: יִפְתָּח
  choice: Иеффай
  rationale: Устоявшаяся русская форма личного имени; после предлога употреблён предложный падеж «Иеффае».
- source_word: וַיַּעֲבֹר אֶת הַגִּלְעָד וְאֶת מְנַשֶּׁה
  choice: он прошёл по Галааду и Манассии
  rationale: עבר с названиями областей передаёт движение через территории. Русское «прошёл по» естественно выражает маршрут, не уточняя без необходимости границы или способ передвижения.
- source_word: מִצְפֵּה גִלְעָד
  choice: Мицпа Галаадская
  rationale: Географическое название передано транслитерацией, а конструктивная связь с Галаадом — традиционной и естественной русской формой прилагательного.
- source_word: עָבַר בְּנֵי עַמּוֹן
  choice: двинулся к аммонитянам
  rationale: В контексте בני עמון обозначает народ как цель дальнейшего движения. «Двинулся к» сохраняет направленность и военный контекст, но не утверждает, что нападение уже началось.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано как «Яхве», а не заменено титулом, что сохраняет прямое употребление тетраграмматона в исходном тексте.
theological_decisions:
- issue: Характер действия Духа Яхве на Иеффая
  choice: Текст сообщает, что Дух Яхве был на Иеффае, наделяя его силой для предстоящего дела.
  alternative: Понимать רוּחַ как ветер, дыхание или безличную силу.
  rationale: В повествовательной формуле книги Судей רוּחַ יְהוָה обозначает Божьего Духа, действующего на избранного вождя. Перевод сохраняет эту мысль, не вынося оценки последующему обету Иеффая.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит личное имя Бога. Его транслитерация сохраняет различие между именем и титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Географическое название «Мицпа Галаадская» и этноним «аммонитяне» даны в привычных русских формах. Повтор названия Мицпы сохранён вслед за еврейским повествованием.
