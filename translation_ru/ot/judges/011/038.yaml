  source_fidelity: 'Перевод точно передаёт последовательность действий и основные элементы еврейского текста: разрешение уйти, срок в два месяца, уход дочери с её спутницами и её плач о собственном девстве в горах. «Отпустил её на два месяца» корректно выражает שׁלח в данном контексте. Смысловой акцент местоимения הִיא не воспроизведён формально, но естественно сохранён тем, что дочь остаётся подлежащим повествования.'
