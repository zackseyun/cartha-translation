  text: וַ/יֹּ֣אמֶר לֵ֔כִי וַ/יִּשְׁלַ֥ח אוֹתָ֖/הּ שְׁנֵ֣י חֳדָשִׁ֑ים וַ/תֵּ֤לֶךְ הִיא֙ וְ/רֵ֣עוֹתֶ֔י/הָ וַ/תֵּ֥בְךְּ עַל בְּתוּלֶ֖י/הָ עַל הֶ/הָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
translation:
  language: ru
  text: 'Он сказал: «Иди». И отпустил её на два месяца. Она пошла со своими подругами и в горах оплакивала своё девство[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плакала о своём девстве»; «плакала из-за своего девства». Еврейский текст прямо называет её девство предметом скорби — это существенная деталь для различных толкований всего отрывка.'
    reason: Лексическая альтернатива и сохранение интерпретационной неоднозначности.
lexical_decisions:
- source_word: לֵכִי
  choice: Иди
  rationale: Краткое повеление, форма 2-го лица женского рода единственного числа от הלך; простой русский императив точно передаёт форму и тон.
- source_word: וַיִּשְׁלַח אוֹתָהּ
  choice: отпустил её
  rationale: В данном контексте שׁלח с прямым дополнением означает, что он позволил ей уйти на оговорённый срок. «Отпустил её» естественно передаёт это значение, не подразумевая отвержения.
- source_word: שְׁנֵי חֳדָשִׁים
  choice: на два месяца
  rationale: Оборот обозначает срок предоставленного ей отсутствия; по-русски после «отпустил» естественно сказать «на два месяца».
- source_word: וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ
  choice: Она пошла со своими подругами
  rationale: Формальное «пошла она и её подруги» сохраняло бы еврейскую структуру, но звучало бы неестественно. Русский оборот передаёт совместное действие и сохраняет её как главную участницу.
- source_word: רֵעוֹתֶיהָ
  choice: своими подругами
  rationale: Форма существительного женского рода указывает на спутниц или подруг. «Подруги» ясно и естественно передаёт значение в современном русском повествовании.
- source_word: וַתֵּבְךְּ
  choice: оплакивала
  rationale: בכה означает плакать или скорбеть; с прямым указанием предмета скорби русское «оплакивала» передаёт торжественный тон и связь с последующим оборотом.
- source_word: עַל בְּתוּלֶיהָ
  choice: оплакивала своё девство
  rationale: Предлог עַל обозначает предмет или причину плача. Эта формулировка прямо сохраняет акцент еврейского текста на её девстве, не решая, что именно последует за окончанием срока.
- source_word: עַל הֶהָרִים
  choice: в горах
  rationale: Буквальное «на горах» в современном русском неестественно. «В горах» точно и идиоматично обозначает место действия, не уточняя рельеф сверх текста.
theological_decisions:
- issue: Смысл плача дочери Иеффая о своём девстве
  choice: Основной текст сохраняет прямое указание на девство как предмет её скорби, не разрешая более широкий спор о её дальнейшей участи.
  alternative: Передать, что она скорбела либо о предстоящей смерти как жертве, либо исключительно о пожизненном девстве и бездетности.
  rationale: Сам стих прямо называет её девство предметом плача, но не объясняет здесь всех последствий обета. Более определённый перевод внёс бы в этот стих один из вариантов толкования более широкого повествования.
translation_notes:
  register: Современный литературный русский язык с кратким, сдержанным повествовательным ритмом. Избегаются архаичное «на горах» и неестественное калькирование «она и её подруги», при этом сохраняются предмет скорби и богословская напряжённость текста.
