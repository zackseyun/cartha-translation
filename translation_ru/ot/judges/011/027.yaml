source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
translation:
  language: ru
  text: Я не согрешил против тебя, а ты делаешь мне зло, идя на меня войной. Пусть Яхве, Судья, сегодня рассудит между сынами Израиля и сынами Аммона[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «между израильтянами и аммонитянами». Буквально: «между сынами Израиля и сынами Аммона».'
    reason: Лексическая альтернатива поясняет корпоративное употребление выражения «сыны».
lexical_decisions:
- source_word: חָטָאתִי
  choice: не согрешил
  rationale: Основное значение глагола — «грешить, согрешить»; такой перевод сохраняет нравственно-судебную силу заявления, не сводя его лишь к причинению ущерба.
- source_word: עֹשֶׂה אִתִּי רָעָה
  choice: делаешь мне зло
  rationale: Формулировка близко передаёт буквальное значение и сохраняет нравственную тяжесть обвинения; в данном контексте она означает неправомерное враждебное действие.
- source_word: לְהִלָּחֶם בִּי
  choice: идя на меня войной
  rationale: Оборот естественно передаёт военный, а не просто личный конфликт и связывает начало войны с причиняемым злом.
- source_word: יִשְׁפֹּט ... הַשֹּׁפֵט
  choice: пусть ... Судья ... рассудит
  rationale: Сохраняется повтор корня שׁפט посредством однокоренных русских слов «Судья» и «рассудит», а форма «пусть» передаёт обращённый к Богу призыв вынести решение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  choice: между сынами Израиля и сынами Аммона
  rationale: Сохранена буквальная корпоративная формула «сыны», характерная для торжественной судебно-дипломатической речи; более привычные этнонимы указаны в примечании.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Характер обращения יִשְׁפֹּט יְהוָה
  choice: Пусть Яхве ... рассудит
  alternative: Яхве ... рассудит
  rationale: Контекст допускает волитивное понимание формы как призыв к божественному суду; русский оборот с «пусть» передаёт это, не превращая слова Иеффая в безусловное предсказание.
- issue: Корпоративное выражение בְּנֵי
  choice: сыны Израиля ... сыны Аммона
  alternative: израильтяне ... аммонитяне
  rationale: Буквальная гендерно маркированная формула сохранена в основном тексте, а естественный этнический эквивалент дан в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством судебно-дипломатической речи. Синтаксис остаётся ясным для широкого читателя; повтор судебной лексики и нравственная напряжённость исходного текста сохранены.
