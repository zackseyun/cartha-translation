- source_word: אֶרֶץ
  choice: земли
  rationale: Передаёт географическое и политическое значение слова; повторяющаяся конструкция сохранена при помощи «ни... ни...».
- source_word: מוֹאָב
  choice: Моава
  rationale: Употреблена традиционная русская форма географического и этнического имени.
- source_word: בְּנֵי עַמּוֹן
  choice: сынов Аммона
  rationale: Сохранён буквальный образ еврейского этнонима; современный идиоматический эквивалент дан в сноске.
