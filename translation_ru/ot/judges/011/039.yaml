base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
translation:
  language: ru
  text: 'Когда истекли два месяца, она вернулась к своему отцу, и он исполнил по отношению к ней обет, который дал[a]. Она же не познала мужчины[b]. И это стало обычаем в Израиле:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «он сделал с ней свой обет, который дал». Толкователи расходятся во мнениях: означает ли это, что Иеффай принёс её в жертву, или что он посвятил её пожизненному девству. Сам еврейский текст здесь прямо не разрешает этот вопрос.'
    reason: alternative_reading
  - marker: b
    text: «Не познала мужчины» — древнееврейское выражение, означающее, что она не вступала в половые отношения.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַיִם חֳדָשִׁים
  choice: когда истекли два месяца
  rationale: Передаёт завершение указанного срока естественным современным русским выражением, сохраняя временную границу, обозначенную מִקֵּץ.
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  choice: она вернулась к своему отцу
  rationale: Прямо передаёт שׁוּב и сохраняет названное в еврейском тексте направление — к отцу, а не обобщённо «домой».
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  choice: он поступил с ней по своему обету, который дал
  rationale: Сохраняет направленность действия на неё и повтор корня נדר в приемлемой для русского форме, не уточняя спорный характер исполнения обета.
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  choice: она же не познала мужчины
  rationale: Сохраняет древнееврейскую эвфемистическую идиому и её повествовательный акцент; смысл поясняется в сноске.
- source_word: חֹק
  choice: обычай
  rationale: В данном повествовательном контексте слово вводит установившееся ежегодное действие, описанное в следующем стихе; «обычай» естественнее, чем юридически окрашенные «закон» или «установление».
theological_decisions:
- issue: Характер исполнения обета Иеффая
  choice: Формулировка не уточняет, принёс ли Иеффай дочь в жертву или посвятил её пожизненному девству.
  alternative: Явно перевести либо как принесение во всесожжение, либо как посвящение на безбрачную жизнь.
  rationale: Еврейский текст говорит, что он «поступил с ней по своему обету», но в самом стихе прямо не разрешает давний толковательный спор. Перевод сохраняет эту напряжённость, а основные понимания отмечает в сноске.
- issue: Значение упоминания о непознании мужчины
  choice: Сохранена идиома «не познала мужчины».
  alternative: 'Передать истолковывающе: «она осталась девственницей» или «она была девственницей».'
  rationale: Более буквальная формулировка сохраняет связь фразы с окружающим повествованием и не использует её для однозначного решения вопроса о судьбе дочери.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; ключевая еврейская идиома и неоднозначность исполнения обета сохранены. Двоеточие в конце оставлено, поскольку мысль продолжается в следующем стихе.
