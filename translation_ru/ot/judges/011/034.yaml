  terminology: Имена «Иеффай» и «Массифа» соответствуют традиционной русской библейской передаче. «Бубны и пляски» приемлемо передаёт праздничные תֻּפִּים и מְחֹלוֹת. Формула «единственный ребёнок» правильно выражает יְחִידָה в поясняющем контексте и не навязывает толкования последующего рассказа.
