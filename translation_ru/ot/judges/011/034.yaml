base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
translation:
  language: ru
  text: Иеффай пришёл в Массифу, в свой дом, и вот его дочь вышла ему навстречу с бубнами и плясками. Она была его единственным ребёнком[a]; кроме неё, у него не было ни сына, ни дочери.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и только она была единственной»; дальнейшие слова поясняют, что она была его единственным ребёнком.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: пришёл
  rationale: Последовательная форма с waw продвигает повествование; в русском простое прошедшее время естественно передаёт следующий этап действия.
- source_word: הַמִּצְפָּה
  choice: в Массифу
  rationale: Название места передано в традиционной и узнаваемой русской форме; еврейский определённый артикль при топониме отдельно не воспроизводится.
- source_word: אֶל בֵּיתוֹ
  choice: к своему дому
  rationale: Сохраняется конкретное значение существительного בַּיִת и присоединительное построение исходного текста.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Передаёт внезапность и драматическую наглядность еврейского повествовательного указателя.
- source_word: יֹצֵאת לִקְרָאתוֹ
  choice: вышла ему навстречу
  rationale: Причастная конструкция изображает действие в момент прибытия Иеффая; по-русски совершенная форма естественно описывает её появление навстречу ему.
- source_word: בְתֻפִּים וּבִמְחֹלוֹת
  choice: с бубнами и плясками
  rationale: Сохраняются оба существительных во множественном числе и праздничный характер встречи; «бубны» понятно передаёт древние рамочные барабаны, а «пляски» — celebratory dances без лишнего уточнения способа действия.
- source_word: וְרַק הִיא יְחִידָה
  choice: Она была у него единственным ребёнком
  rationale: יְחִידָה буквально обозначает «единственную»; последующая фраза ясно показывает, что речь идёт о единственном ребёнке. Добавление «ребёнком» делает смысл естественным и недвусмысленным по-русски.
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  choice: кроме неё, не было у него ни сына, ни дочери
  rationale: Фраза естественно передаёт исключение, выраженное מִמֶּנּוּ, и полное отрицание наличия других детей.
theological_decisions:
- issue: Значение упоминания о единственной дочери Иеффая
  choice: 'Передать только прямо сообщаемый повествовательный факт: она была его единственным ребёнком.'
  alternative: Связать это уточнение либо с буквальным принесением дочери в жертву, либо с её пожизненным девством и бездетностью.
  rationale: Сам стих не определяет дальнейшую участь дочери и не разрешает спор о смысле обета Иеффая; перевод не должен вносить в него выводы из последующего повествования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным звучанием. Сохранены драматическое «и вот», конкретное «дом» и парная праздничная формула «с бубнами и плясками»; архаические синтаксические кальки устранены.
