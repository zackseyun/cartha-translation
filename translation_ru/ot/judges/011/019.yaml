  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
translation:
  language: ru
  text: 'Тогда Израиль послал послов[a] к Сихону, царю аморреев, царю Хешбона, и Израиль сказал ему: «Пожалуйста, позволь нам пройти через твою землю к моему месту[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В этом дипломатическом контексте слово можно также перевести как «вестников» или «представителей».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к моему месту». Израиль говорит как единое собирательное лицо; поэтому после «нам» в еврейском тексте стоит форма единственного числа.'
    reason: textual_clarification
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное повествовательное значение глагола שׁלח; естественно передаёт последовательность событий.
- source_word: מַלְאָכִים
  choice: послов
  rationale: В дипломатическом контексте речь идёт о людях-представителях; «послы» естественнее и точнее для официального обращения, чем общее «вестники».
- source_word: סִיחוֹן
  choice: Сихону
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: царю аморреев
  rationale: Сохраняет этническое обозначение и синтаксическую связь оригинала.
- source_word: מֶלֶךְ חֶשְׁבּוֹן
  choice: царю Хешбона
  rationale: Второй приложенный титул сохранён, как в еврейском тексте.
- source_word: וַיֹּאמֶר לוֹ יִשְׂרָאֵל
  choice: и Израиль сказал ему
  rationale: Сохранено явное повторение слова «Израиль», не сглаженное местоимением.
- source_word: נַעְבְּרָה נָּא
  choice: Позволь нам пройти
  rationale: Когортатив с частицей נָא выражает вежливую просьбу; выбран естественный современный русский оборот.
- source_word: בְאַרְצְךָ
  choice: через твою землю
  rationale: При глаголе עבר предлог указывает на движение через территорию.
- source_word: עַד מְקוֹמִי
  choice: до моего места
  rationale: Сохранено единственное число и первое лицо исходного текста — буквально «до моего места», несмотря на предшествующее множественное «нам».
theological_decisions:
- issue: Сочетание множественного «нам» и единственного «моего» в речи Израиля
  choice: Сохранить «до моего места»
  alternative: «до нашего места» или «до нашей земли»
  rationale: Еврейский текст WLC действительно содержит форму первого лица единственного числа מְקוֹמִי. Израиль может говорить как собирательное лицо; гармонизация устранила бы подлинную грамматическую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «Израиль» и два титула Сихона сохранены. Необычное «нам… моего» намеренно оставлено ради точного отражения еврейской грамматики и пояснено сноской.
