  text: וַ/יֹּאמְרוּ֩ זִקְנֵ֨י גִלְעָ֜ד אֶל יִפְתָּ֗ח לָ/כֵן֙ עַתָּה֙ שַׁ֣בְנוּ אֵלֶ֔י/ךָ וְ/הָלַכְתָּ֣ עִמָּ֔/נוּ וְ/נִלְחַמְתָּ֖ בִּ/בְנֵ֣י עַמּ֑וֹן וְ/הָיִ֤יתָ לָּ֨/נוּ֙ לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
translation:
  language: ru
  text: 'И сказали старейшины Галаада Иеффаю: «Потому-то мы теперь и вернулись к тебе, чтобы ты пошёл с нами и сразился с аммонитянами[a], а ты будешь главой над всеми жителями Галаада».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с сынами Аммона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  choice: старейшины Галаада
  rationale: Слово זָקֵן обозначает признанных старейшин и руководителей общины; «старейшины» сохраняет общественно-политический смысл должности.
- source_word: לָכֵן עַתָּה
  choice: Потому-то мы теперь и
  rationale: Передаёт причинно-следственную связь с возражением Иеффая в предыдущем стихе и подчёркивает нынешнее изменение позиции старейшин.
- source_word: שַׁבְנוּ אֵלֶיךָ
  choice: вернулись к тебе
  rationale: Прямо передаёт обычное значение שׁוּב и указывает на возобновление обращения к Иеффаю после прежнего отвержения.
- source_word: וְהָלַכְתָּ עִמָּנוּ
  choice: чтобы ты пошёл с нами
  rationale: Сохраняет значение глагола הלך («идти») и в контексте естественно выражает цель возвращения старейшин.
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  choice: и сразился с аммонитянами
  rationale: «Аммонитяне» — естественное русское обозначение народа, буквально названного «сынами Аммона»; конструкция נלחם ב־ выражает вооружённое противостояние.
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  choice: стал нашим главой
  rationale: «Глава» сохраняет метафору רֹאשׁ и передаёт более широкую власть, а не только временное военное командование.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: главой всех жителей Галаада
  rationale: Передаёт полный охват обещанной власти над всеми живущими в Галааде и естественно уточняет синтаксическую связь с «главой».
theological_decisions:
- issue: Объём обещанной Иеффаю власти
  choice: Старейшины обещают Иеффаю руководство над всеми жителями Галаада, а не только командование во время войны.
  alternative: Речь идёт лишь о временном военном командовании.
  rationale: Фраза לְרֹאשׁ לְכֹל יֹשְׁבֵי גִלְעָד прямо распространяет положение Иеффая как главы на всех жителей Галаада; перевод не вводит более поздних политических категорий.
- issue: Временное соотношение битвы и поставления главой
  choice: «а потом стал» передаёт естественную последовательность обещания в данном контексте.
  alternative: «и будешь нашим главой» может представлять поставление главой как одновременное с походом или как простой последующий результат.
  rationale: Цепочка форм с וְ допускает контекстуальную последовательность, однако исходный текст не уточняет формальную процедуру или точный момент вступления во власть; формулировка сохраняет обещанный результат без догматизации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены традиционные формы имён «Галаад» и «Иеффай»; синтаксис сделан ясным для современного читателя без устранения широты обещанной власти.
