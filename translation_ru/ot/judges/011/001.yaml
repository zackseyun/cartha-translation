  source_fidelity: 'Перевод точно передаёт основные элементы еврейского текста: Иеффай обозначен как галаадитянин, גִּבּוֹר חַיִל естественно передано как «могучий воин», происхождение от женщины-проститутки сохранено без эвфемизации, а Галаад однозначно назван отцом Иеффая. Перестройка последней части в «его отцом был Галаад» не меняет смысла каузативного וַיּוֹלֶד и позволяет избежать неестественного в современном русском «Галаад родил Иеффая».'
