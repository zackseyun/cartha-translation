  terminology: Имена «Иеффай» и «Галаад» последовательно переданы в принятой русской библейской форме. «Проститутка» является современным прямым эквивалентом זוֹנָה; примечание корректно сообщает традиционный вариант «блудница». Примечание к «могучему воину» адекватно отмечает более формальную альтернативу.
