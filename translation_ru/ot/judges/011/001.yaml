  text: וְ/יִפְתָּ֣ח הַ/גִּלְעָדִ֗י הָיָה֙ גִּבּ֣וֹר חַ֔יִל וְ/ה֖וּא בֶּן אִשָּׁ֣ה זוֹנָ֑ה וַ/יּ֥וֹלֶד גִּלְעָ֖ד אֶת יִפְתָּֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
translation:
  language: ru
  text: Иеффай галаадитянин был могучим воином[a]. Он был сыном проститутки[b], а его отцом был Галаад[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «сильным и доблестным мужем».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст буквально: «сын женщины-проститутки»; в традиционных переводах — «сын блудницы».'
    reason: lexical_alternative
  - marker: c
    text: Здесь Галаад — личное имя отца Иеффая, а не только название области.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָדִי
  choice: галаадитянин
  rationale: Форма обозначает принадлежность Иеффая к Галааду; русское существительное «галаадитянин» точно и естественно передаёт этот этникон.
- source_word: גִּבּוֹר חַיִל
  choice: могучий воин
  rationale: В повествовательном контексте сочетание указывает на силу и воинскую доблесть. Этот вариант понятен современному читателю и сохраняет оба смысловых оттенка.
- source_word: בֶּן אִשָּׁה זוֹנָה
  choice: сын проститутки
  rationale: זוֹנָה прямо обозначает женщину, занимающуюся проституцией. «Проститутка» — ясное современное слово, тогда как «блудница» стилистически более архаично.
- source_word: וַיּוֹלֶד
  choice: был отцом
  rationale: Каузативная форма ילד здесь утверждает отцовство Галаада. Русская конструкция «его отцом был» передаёт это естественно, без архаичного «родил» или «породил».
- source_word: גִּלְעָד
  choice: Галаад
  rationale: Здесь это личное имя отца Иеффая, а не название одной лишь области; синтаксическая перестройка делает это однозначным.
- source_word: וְ
  choice: без отдельного вводного слова
  rationale: Начальный союз связывает эпизод с контекстом, но в современном русском не требует механического «и» или добавленного «теперь» в начале стиха.
theological_decisions:
- issue: Связь Галаада с Иеффаем
  choice: «его отцом был Галаад»
  alternative: «Галаад родил Иеффая»
  rationale: Выбранная формулировка сохраняет утверждение о личном отцовстве и не позволяет принять «Галаад» только за название области, при этом избегая неестественного русского выражения о мужчине, который «родил».
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Короткие предложения устраняют тяжеловесное накопление союзов, а «а» естественно вводит уточнение об отце, не превращая его в смысловое противопоставление.
