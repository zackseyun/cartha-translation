base_translation:
  language: en
  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
translation:
  language: ru
  text: Ведь когда они вышли из Египта, Израиль шёл по пустыне до Тростникового моря[a] и пришёл в Кадес.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционно: «Красного моря».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: ведь
  rationale: Частица вводит поясняющее основание в историческом доводе Иеффая; «ведь» естественно передаёт эту связь по-русски.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: когда они вышли из Египта
  rationale: Конструкция с инфинитивом имеет временное значение. Русское «вышли из Египта» естественно передаёт исход, тогда как буквальное «поднялись» здесь звучало бы неестественно.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: Израиль шёл по пустыне
  rationale: Сохраняется собирательное единственное число имени «Израиль» и основное значение הלך; בַּמִּדְבָּר передано естественным русским «по пустыне» как указанием маршрута.
- source_word: עַד יַם סוּף
  choice: до Тростникового моря
  rationale: עַד обозначает предел движения. יַם סוּף буквально связано с тростником/камышом; «Тростниковое море» сохраняет исходную лексику, а традиционное название отмечено в сноске.
- source_word: וַיָּבֹא קָדֵשָׁה
  choice: и пришёл в Кадес
  rationale: Направительный суффикс -ה указывает на движение к месту; по-русски это естественно выражается сочетанием «пришёл в Кадес».
