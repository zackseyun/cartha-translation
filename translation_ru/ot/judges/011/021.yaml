source:
  edition: WLC
  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
translation:
  language: ru
  text: И Яхве, Бог Израиля, отдал Сигона и весь его народ в руки Израиля[a], и израильтяне разбили их. Так Израиль овладел всей землёй амореев, живших в той земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руку Израиля» — древнееврейский оборот со значением «во власть Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: отдал ... в руки Израиля
  rationale: Сохраняет образ древнееврейского оборота со значением передачи во власть; множественное «в руки» естественно для современного русского языка.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо передаёт конструкцию принадлежности и отношение Яхве к Израилю.
- source_word: סִיחוֹן
  choice: Сигон
  rationale: Устоявшаяся русская библейская форма имени.
- source_word: כָּל עַמּוֹ
  choice: весь его народ
  rationale: Передаёт обычное значение עַם, не сужая его до войска, хотя контекст является военным.
- source_word: וַיַּכּוּם
  choice: израильтяне разбили их
  rationale: В военном повествовании נכה обозначает нанесение поражения. Явное подлежащее устраняет неестественную для русского языка смену числа после собирательного «Израиль».
- source_word: וַיִּירַשׁ
  choice: овладел
  rationale: Здесь ירש означает вступление во владение землёй после победы; выбор сохраняет результативный смысл без добавления идеи наследования.
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  choice: всей землёй амореев
  rationale: Еврейское единственное число служит собирательным этнонимом; русский множественный этноним звучит естественно.
- source_word: יוֹשֵׁב הָאָרֶץ הַהִיא
  choice: живших в той земле
  rationale: Причастный оборот относится к амореям и прямо передаёт значение проживания на данной земле.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет его как имя и не подменяет титулом; форма «Иегова» менее соответствует принятой научной реконструкции произношения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён образ «в руки», но его идиоматическое значение пояснено в сноске. Форма «израильтяне» введена для ясного согласования с еврейским глаголом во множественном числе.
