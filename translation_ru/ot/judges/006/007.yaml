lexical_decisions:
- source_word: וַיְהִי
  choice: И было так
  rationale: Передаёт еврейскую повествовательную формулу и вводит новое развитие событий без архаичного «и случилось».
- source_word: כִּי
  choice: когда
  rationale: После וַיְהִי союз вводит временное придаточное, продолжающееся в следующем стихе.
- source_word: זָעֲקוּ
  choice: воззвали
  rationale: Глагол обозначает настойчивый крик о помощи в бедствии; «воззвали» естественно передаёт обращение к Богу и сохраняет торжественный регистр.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет конкретный образ исходного выражения; более идиоматичное «израильтяне» указано в сноске.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог указывает на того, к кому обращён крик, а личное имя יהוה передано транслитерацией «Яхве».
- source_word: עַל אֹדוֹת
  choice: из-за
  rationale: В данном контексте выражение указывает на причину бедствия и обращения за помощью.
- source_word: מִדְיָן
  choice: Мадиана
  rationale: Сохраняет форму имени «Мадиан» и метонимию оригинала, где название относится к враждебному народу или вызванному им притеснению.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога, поэтому оно передано непосредственно, без замены титулом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Начальная формула сохраняет еврейский повествовательный переход, а конечная запятая отражает незавершённость синтаксической конструкции, продолжающейся в Судей 6:8.
