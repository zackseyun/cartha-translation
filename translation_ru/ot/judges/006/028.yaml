    rationale: Еврейское אַנְשֵׁי הָעִיר содержит существительное «мужчины»; нейтральное «жители» убирает выраженный в исходном тексте признак.
  - severity: low
    issue: «Наутро»
    rationale: בַּבֹּקֶר означает «утром»; «наутро» обычно подразумевает утро следующего дня и тем самым несколько уточняет хронологию сверх формулировки стиха.
  - severity: medium
    issue: «при нём» как основной перевод עָלָיו
    rationale: Основное и прямое значение предлога — «на нём». Возможность значения «рядом/при» следует отмечать как альтернативу, а не заменять ею основное значение.
  - severity: medium
    issue: «вновь построенном жертвеннике»
    rationale: הַבָּנוּי означает «построенном/сооружённом»; наречие «вновь» может означать повторное строительство, чего исходный текст не сообщает.
