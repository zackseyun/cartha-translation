  text: וַ/יַּשְׁכִּ֜ימוּ אַנְשֵׁ֤י הָ/עִיר֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֤ה נֻתַּץ֙ מִזְבַּ֣ח הַ/בַּ֔עַל וְ/הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו כֹּרָ֑תָה וְ/אֵת֙ הַ/פָּ֣ר הַ/שֵּׁנִ֔י הֹֽעֲלָ֔ה עַל הַ/מִּזְבֵּ֖חַ הַ/בָּנֽוּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
translation:
  language: ru
  text: 'Рано утром мужчины города встали и увидели: жертвенник Ваала был разрушен, ашера[a], которая была на нём[b], срублена, а второй бык принесён в жертву на построенном жертвеннике.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столб Ашеры»; евр. «ашера».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также перевод: «рядом с ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ אַנְשֵׁי הָעִיר בַּבֹּקֶר
  choice: Наутро жители города встали рано
  rationale: Передаёт ранний подъём и утреннее время естественным современным русским языком; контекст не требует понимать אַנְשֵׁי как указание исключительно на мужчин.
- source_word: וְהִנֵּה
  choice: 'и увидели:'
  rationale: В данном повествовании частица вводит внезапно открывшуюся взору картину; русское «увидели» с двоеточием естественно сохраняет этот эффект.
- source_word: נֻתַּץ מִזְבַּח הַבַּעַל
  choice: жертвенник Ваала разрушен
  rationale: Пассивная форма נתץ обозначает разрушение или низвержение сооружения.
- source_word: הָאֲשֵׁרָה
  choice: ашера
  rationale: 'Транслитерация сохраняет неоднозначность: слово может обозначать культовый предмет, связанный с богиней Ашерой, и не обязательно прямо называет столб.'
- source_word: אֲשֶׁר עָלָיו
  choice: которая была при нём
  rationale: עַל буквально может означать «на нём», но здесь способно выражать пространственную или культовую связь. «При нём» сохраняет эту связь, не утверждая, что предмет стоял непосредственно на поверхности жертвенника.
- source_word: כֹּרָתָה
  choice: срублена
  rationale: Глагол כרת здесь описывает отсечение деревянного культового предмета; «срублена» кратко и наглядно передаёт результат.
- source_word: הַפָּר הַשֵּׁנִי הֹעֲלָה
  choice: второй бык принесён в жертву
  rationale: Hophal от עלה в жертвенном контексте означает вознесение животного как приношения; формулировка естественна по-русски и не добавляет лишней обрядовой конкретики.
- source_word: הַמִּזְבֵּחַ הַבָּנוּי
  choice: вновь построенном жертвеннике
  rationale: Причастие указывает на жертвенник, строительство которого только что описано в предыдущем контексте; «вновь построенном» ясно связывает события.
theological_decisions:
- issue: Значение הָאֲשֵׁרָה
  choice: ашера
  alternative: столб Ашеры; священный столб
  rationale: Исходное слово допускает понимание как имени связанного с богиней культового объекта. Транслитерация не сужает референт без достаточных оснований.
- issue: Значение אֲשֶׁר עָלָיו
  choice: которая была при нём
  alternative: которая была на нём; которая стояла рядом с ним
  rationale: Буквальное «на нём» сохраняется в примечании, тогда как основной текст передаёт несомненную связь с жертвенником, не разрешая спорную точную пространственную конфигурацию.
- issue: Жертвенный смысл הֹעֲלָה
  choice: принесён в жертву
  alternative: вознесён; принесён как всесожжение
  rationale: Контекст однозначно жертвенный, однако сам глагол в этом стихе не требует добавлять специальный термин «всесожжение».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Инверсия после двоеточия передаёт внезапность обнаружения без архаичного «вот». Все примечания отмечены в основном тексте.
