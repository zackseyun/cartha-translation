  text: וָ/אַצִּ֤ל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּ֖ד כָּל לֹחֲצֵי/כֶ֑ם וָ/אֲגָרֵ֤שׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם וָ/אֶתְּנָ֥/ה לָ/כֶ֖ם אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/009.yaml
  text: And I delivered you from the hand of Egypt and from the hand of all your oppressors, and I drove them out from before you and gave you their land.
translation:
  language: ru
  text: Я избавил вас от власти Египта и от власти всех ваших угнетателей; Я прогнал их от вас и отдал вам их землю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַצִּל
  choice: Я избавил
  rationale: Глагол נצל обозначает избавление или спасение из-под чужой власти и от опасности. «Избавил» естественно звучит в современном русском и хорошо сочетается с оборотом «от власти».
- source_word: מִיַּד
  choice: от власти
  rationale: Буквально «из руки». В данном контексте «рука» означает власть или контроль; функциональный эквивалент передаёт смысл яснее, чем менее естественное по-русски «из руки Египта».
- source_word: מִצְרַיִם
  choice: Египта
  rationale: Стандартная передача названия страны; родительный падеж обусловлен предлогом «от».
- source_word: כָּל לֹחֲצֵיכֶם
  choice: всех ваших угнетателей
  rationale: Причастие от לחץ обозначает тех, кто теснит, притесняет или угнетает. «Угнетателей» точнее общего слова «врагов».
- source_word: וָאֲגָרֵשׁ
  choice: Я прогнал
  rationale: Глагол גרש означает прогонять, изгонять. «Прогнал» естественно передаёт удаление народов с земли.
- source_word: מִפְּנֵיכֶם
  choice: от вас
  rationale: Буквально «от вашего лица / от присутствия вашего». Русское «от вас» сохраняет пространственный смысл без неестественного буквализма.
- source_word: וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  choice: и отдал вам их землю
  rationale: נתן значит «дать». В сочетании с землёй, прежде принадлежавшей изгнанным народам, «отдал вам» естественно выражает передачу во владение, не добавляя к тексту отдельного толкования.
theological_decisions:
- issue: Прямое действие Бога в избавлении Израиля и передаче земли
  choice: 'Во всех трёх действиях сохранён Бог как явно выраженный субъект: «Я избавил», «Я прогнал», «отдал».'
  alternative: Сгладить повтор субъекта или представить события без прямого указания на Божье действие.
  rationale: Еврейские глаголы первого лица подчёркивают непосредственное действие Господа. Перевод сохраняет этот акцент, не объясняя и не смягчая связанное с изгнанием народов богословское напряжение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Образ «из руки» передан смысловым эквивалентом «от власти»; синтаксический параллелизм двух оборотов сохранён. Заглавная буква в повторном «Я» подчёркивает продолжение прямой божественной речи и соответствует принятому русскому библейскому оформлению.
