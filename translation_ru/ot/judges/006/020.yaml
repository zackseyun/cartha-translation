base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
translation:
  language: ru
  text: 'Тогда ангел Божий сказал ему[a]: «Возьми мясо и пресные лепёшки, положи их на эту скалу, а бульон вылей». И он сделал так.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланник Божий». Еврейское слово может означать как человеческого посланника, так и ангела; здесь контекст указывает на сверхъестественного посланника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: ангел Божий
  rationale: מַלְאַךְ может обозначать посланника или ангела; в данном повествовательном контексте речь идёт о сверхъестественном Божьем посланнике, поэтому «ангел» естественно передаёт смысл, не устраняя лексической альтернативы, отмеченной в сноске.
- source_word: קַח
  choice: возьми
  rationale: Императив לקח прямо означает «возьми»; значение направления, необходимое для «принеси», в самом глаголе не выражено.
- source_word: הַבָּשָׂר
  choice: мясо
  rationale: Хотя בָּשָׂר буквально может означать «плоть», в контексте приготовленной пищи современное русское «мясо» точнее и естественнее.
- source_word: הַמַּצּוֹת
  choice: пресные хлебы
  rationale: Множественное число מַצּוֹת обозначает хлебные изделия без закваски; «пресные хлебы» сохраняет число и привычную библейскую терминологию, оставаясь понятным современному читателю.
- source_word: וְהַנַּח
  choice: положи их
  rationale: Каузативная форма נוח здесь означает «положить, поместить»; местоимение «их» естественно отсылает к мясу и пресным хлебам.
- source_word: אֶל־הַסֶּלַע הַלָּז
  choice: на эту скалу
  rationale: סֶלַע означает скалу или крупный камень; при глаголе помещения предлог אֶל естественно передаётся русским «на», а הַלָּז — указательным «эту».
- source_word: הַמָּרַק
  choice: бульон
  rationale: מָרָק обозначает отвар или жидкость, в которой готовилось мясо; «бульон» — точный и современный русский эквивалент.
- source_word: שְׁפֹוךְ
  choice: вылей
  rationale: Императив שפך означает вылить или пролить; «вылей» естественно выражает опорожнение сосуда, предполагаемое контекстом.
- source_word: וַיַּעַשׂ כֵּן
  choice: И он сделал так
  rationale: Формула кратко сообщает о точном исполнении повеления и естественно передаётся по-русски как «И он сделал так».
theological_decisions:
- issue: Передача обозначения Божьего посланника в контексте богоявления
  choice: ангел Божий
  alternative: посланник Божий
  rationale: Еврейское מַלְאַךְ допускает оба значения, однако контекст Судей 6 указывает на сверхъестественного посланника. «Ангел Божий» сохраняет богословский вес повествования, тогда как сноска удерживает подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской лексикой. Синтаксис краткий и ясный; «пресные хлебы» сохраняет предметную конкретность и форму множественного числа оригинала.
