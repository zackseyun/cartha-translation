base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
translation:
  language: ru
  text: 'И Я сказал вам: «Я — Яхве, ваш Бог. Не бойтесь богов амореев, в земле которых вы живёте. Но вы не послушались Меня[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не послушали Моего голоса»; этот оборот также означает «не повиновались Мне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לָכֶם
  choice: И Я сказал вам
  rationale: Форма wayyiqtol продолжает рассказ и вводит прежде произнесённые слова; прямое «сказал» естественно передаёт אמר.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: אֱלֹהֵיכֶם
  choice: ваш Бог
  rationale: Несмотря на форму множественного числа, в отношении Бога Израиля слово имеет единственное значение.
- source_word: לֹא תִירְאוּ
  choice: не бойтесь
  rationale: Отрицание с имперфектом выражает запрет; русская форма повелительного наклонения передаёт его прямо и естественно.
- source_word: אֱלֹהֵי הָאֱמֹרִי
  choice: богов амореев
  rationale: Еврейское собирательное название народа естественно передаётся русским множественным числом.
- source_word: אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם
  choice: в земле которых вы живёте
  rationale: Сохраняется относительная связь с амореями и значение постоянного проживания у ישב.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  choice: Но вы не послушались Меня
  rationale: Оборот שמע בקול в данном контексте означает не просто услышать голос, а внять ему и повиноваться; «не послушались Меня» естественно выражает этот смысл по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение שמע בקול
  choice: не послушались Меня
  alternative: не послушали Моего голоса
  rationale: Выбрано естественное русское выражение, передающее подразумеваемое неповиновение; буквальный образ отмечен в сноске, чтобы сохранить языковую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Прямая заповедь передана естественным «не бойтесь»; архаические формы и конфессионально маркированные замены имени Бога не использованы.
