  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ בִּ֣י אֲדֹנָ֔/י בַּ/מָּ֥ה אוֹשִׁ֖יעַ אֶת יִשְׂרָאֵ֑ל הִנֵּ֤ה אַלְפִּ/י֙ הַ/דַּ֣ל בִּ/מְנַשֶּׁ֔ה וְ/אָנֹכִ֥י הַ/צָּעִ֖יר בְּ/בֵ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/015.yaml
  text: But he said to him[a], “Please, my lord, how can I save Israel? Look, my clan is the weakest in Manasseh[c][b], and I am the youngest in my father’s house.”
translation:
  language: ru
  text: 'Но он сказал ему: «Прошу, господин мой[a], как мне спасти Израиль? Ведь мой род[b] — самый слабый[c] в Манассии, а я — самый младший[d] в доме моего отца».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь мой». Древнееврейское обращение может пониматься как почтительное «господин мой» или как обращение к Богу; повествовательный контекст сохраняет эту неоднозначность.'
    reason: theological_ambiguity
  - marker: b
    text: 'Буквально: «моя тысяча»; здесь, вероятно, родовое или племенное подразделение.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «самый бедный», «самый незначительный».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «самый незначительный».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Прошу
  rationale: Частица вводит почтительную просьбу или возражение; «прошу» естественно передаёт уважительный тон, не приписывая слову буквального пространственного значения.
- source_word: אֲדֹנָי
  choice: господин мой
  rationale: Форма допускает почтительное обращение к собеседнику. Строчная буква сохраняет повествовательную неопределённость относительно того, насколько ясно Гедеон в этот момент осознаёт личность говорящего.
- source_word: בַּמָּה
  choice: как мне
  rationale: 'Буквально вопрос относится к средству — «чем, посредством чего», но по-русски здесь естественнее вопрос о возможности и способе исполнения поручения: «как мне».'
- source_word: אוֹשִׁיעַ
  choice: спасти
  rationale: Каузативная форма от יָשַׁע означает спасти, избавить или освободить. «Спасти» сохраняет широкий смысл и привычную библейскую лексику.
- source_word: הִנֵּה
  choice: ведь
  rationale: Здесь слово привлекает внимание к доводу Гедеона. В русской аргументирующей реплике «ведь» естественно вводит объяснение его сомнения.
- source_word: אַלְפִּי
  choice: мой род
  rationale: Хотя существительное связано со значением «тысяча», в племенной структуре оно может обозначать родовое подразделение. «Род» понятно современному читателю и уместно в данном социальном контексте.
- source_word: הַדַּל
  choice: самый слабый
  rationale: דַּל может обозначать слабость, бедность или незначительность. В контексте сомнений Гедеона «самый слабый» выражает недостаток влияния и возможностей, не исключая оттенка бедности.
- source_word: בִּמְנַשֶּׁה
  choice: в Манассии
  rationale: Название колена передано в принятой русской библейской форме.
- source_word: הַצָּעִיר
  choice: самый младший
  rationale: В пределах отцовского дома слово естественно указывает на младшего по возрасту или положению; возможный оттенок незначительности отмечен в сноске.
- source_word: בְּבֵית אָבִי
  choice: в доме моего отца
  rationale: Сохранён обычный древнееврейский оборот, обозначающий отцовский дом или семейное хозяйство; он понятен по-русски и удерживает социальную образность текста.
theological_decisions:
- issue: Значение обращения אֲדֹנָי
  choice: «господин мой» со строчной буквы
  alternative: «Господь мой» как прямое обращение к Богу
  rationale: Непосредственная сцена ещё сохраняет напряжение вокруг осознания Гедеоном личности собеседника. Почтительное обращение не исключает божественной личности говорящего, но и не разрешает эту неопределённость раньше самого повествования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис реплики сделан естественным для устной речи, а ключевые социальные и богословские неоднозначности вынесены в сноски без их преждевременного разрешения.
