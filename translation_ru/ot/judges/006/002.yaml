translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранён образ «рука Мадиама» и традиционное «сыны Израиля», но синтаксис сделан ясным и естественным. Лексическая неопределённость הַמִּנְהָרוֹת не устранена молча, а отражена сноской.
