  text: And the hand of Midian prevailed against Israel[a]. Because of Midian, the sons of Israel made for themselves the dens that are in the mountains, and the caves[b], and the strongholds.
translation:
  language: ru
  text: И рука Мадиама одолела Израиль. Из-за Мадиама сыны Израиля устроили себе укрытия, которые были в горах, пещеры и укрепления[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение редкого еврейского слова не вполне ясно; также переводят: «норы» или «подземные ходы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּעָז
  choice: одолела
  rationale: Глагол передаёт усиление и превосходство враждебной силы; в сочетании с «рука Мадиама» русское «одолела» естественно выражает господство над Израилем.
- source_word: יַד מִדְיָן
  choice: рука Мадиама
  rationale: Сохранён древнееврейский образ руки как силы и власти; он понятен в контексте и поддерживает достоинство повествовательного стиля.
- source_word: עַל יִשְׂרָאֵל
  choice: Израиль
  rationale: При глаголе «одолела» отношение, выраженное עַל, естественно передаётся прямым дополнением; речь идёт о враждебном превосходстве над Израилем.
- source_word: מִפְּנֵי מִדְיָן
  choice: Из-за Мадиама
  rationale: Фраза указывает на угрозу со стороны Мадиама как причину действий израильтян.
- source_word: עָשׂוּ לָהֶם
  choice: устроили себе
  rationale: Передаёт как действие עָשׂוּ, так и возвратное значение לָהֶם; «устроили» допускает сооружение либо приспособление убежищ.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет форму исходного выражения и остаётся узнаваемым, достойным библейским обозначением народа, хотя современное «израильтяне» также возможно.
- source_word: הַמִּנְהָרוֹת
  choice: укрытия
  rationale: Редкое слово, вероятно обозначающее норы, выемки или иные убежища. «Укрытия» сохраняет функциональный смысл и не дублирует следующие «пещеры»; неопределённость отмечена в сноске.
- source_word: אֲשֶׁר בֶּהָרִים
  choice: в горах
  rationale: Отдельно сохраняет выраженную в исходном тексте локализацию первого вида убежищ.
- source_word: הַמְּעָרוֹת
  choice: пещеры
  rationale: Обычное и точное русское соответствие природным пещерам.
- source_word: הַמְּצָדוֹת
  choice: укрепления
  rationale: Обозначает защищённые или укреплённые места; «укрепления» естественно для современного русского и не требует предполагать крупные крепости.
