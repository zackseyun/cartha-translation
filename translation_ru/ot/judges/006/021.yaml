  text: וַ/יִּשְׁלַ֞ח מַלְאַ֣ךְ יְהוָ֗ה אֶת קְצֵ֤ה הַ/מִּשְׁעֶ֨נֶת֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּגַּ֥ע בַּ/בָּשָׂ֖ר וּ/בַ/מַּצּ֑וֹת וַ/תַּ֨עַל הָ/אֵ֜שׁ מִן הַ/צּ֗וּר וַ/תֹּ֤אכַל אֶת הַ/בָּשָׂר֙ וְ/אֶת הַ/מַּצּ֔וֹת וּ/מַלְאַ֣ךְ יְהוָ֔ה הָלַ֖ךְ מֵ/עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
translation:
  language: ru
  text: Тогда ангел Яхве протянул конец посоха, который был у него в руке, и коснулся мяса[a] и пресных хлебов. Из скалы поднялся огонь и поглотил мясо и пресные хлебы, а ангел Яхве удалился с глаз Гедеона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плоти»; здесь имеется в виду приготовленное мясо.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ушёл от его глаз», то есть перестал быть видимым для Гедеона.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאָךְ может означать «вестник» или «ангел»; сверхъестественный характер действующего лица в повествовании делает «ангел» наиболее естественным выбором, а личное имя יְהוָה передано как «Яхве».
- source_word: קְצֵה הַמִּשְׁעֶנֶת
  choice: конец посоха
  rationale: קָצֶה обозначает конец или оконечность, а מִשְׁעֶנֶת — посох, служащий опорой; выражение естественно передаёт конкретный образ без необязательного уточнения «наконечник».
- source_word: וַיִּשְׁלַח
  choice: протянул
  rationale: При прямом дополнении «конец посоха» глагол описывает движение посоха вперёд, а не его отправление.
- source_word: וַיִּגַּע
  choice: коснулся
  rationale: Обычное значение נגע — «касаться»; контекст не требует более сильного «ударил».
- source_word: בָּשָׂר
  choice: мясо
  rationale: Хотя слово буквально может означать «плоть», здесь речь идёт о приготовленной пище, поэтому «мясо» точно и естественно.
- source_word: מַצּוֹת
  choice: пресные хлебы
  rationale: Форма множественного числа обозначает приготовленные Гедеоном хлебы без закваски; «пресные хлебы» сохраняет число и культово-пищевой смысл.
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר
  choice: из скалы поднялся огонь
  rationale: Конструкция описывает восхождение или появление огня из скалы; русский порядок слов передаёт событие естественно и образно.
- source_word: וַתֹּאכַל
  choice: поглотил
  rationale: Буквально глагол означает «съел», но применительно к огню «поглотил» является естественным и точным соответствием.
- source_word: הָלַךְ מֵעֵינָיו
  choice: скрылся из виду Гедеона
  rationale: Буквально выражение означает «ушёл от его глаз», то есть перестал быть видимым; имя Гедеона устраняет неясность русского местоимения, не добавляя идеи мгновенного исчезновения.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому транслитерация «Яхве» сохраняет его как личное имя, а не заменяет титулом.
- issue: Значение מַלְאַךְ в выражении מַלְאַךְ יְהוָה
  choice: ангел
  alternative: вестник
  rationale: Лексическая двусмысленность реальна, однако сверхъестественное действие персонажа в данном эпизоде поддерживает обычное русское «ангел»; альтернативу можно отметить в сноске лишь при необходимости, но здесь отдельная сноска перегрузила бы стих.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сохраняет последовательность еврейского текста, но избегает неестественных калек. Имя «Гедеон» добавлено во второй половине стиха как явное обозначение референта местоимения, чтобы по-русски не возникло ошибочной привязки к ангелу.
