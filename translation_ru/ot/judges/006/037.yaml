source:
  edition: WLC
  text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת גִּזַּ֥ת הַ/צֶּ֖מֶר בַּ/גֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה עַֽל הַ/גִּזָּ֜ה לְ/בַדָּ֗/הּ וְ/עַל כָּל הָ/אָ֨רֶץ֙ חֹ֔רֶב וְ/יָדַעְתִּ֗י כִּֽי תוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
translation:
  language: ru
  text: Вот, я кладу шерстяное руно на гумне. Если роса будет только на руне, а на всей земле[a] будет сухо, то я узнаю, что Ты спасёшь Израиль моей рукой, как Ты и говорил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «на всей почве», «по всей местности»; еврейское слово может обозначать как землю под ногами, так и более обширную страну или землю. Здесь, вероятно, имеется в виду поверхность вокруг руна.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-привлекающую внимание силу частицы естественным для современного русского языка способом.
- source_word: מַצִּיג
  choice: я кладу
  rationale: Причастная форма с אָנֹכִי обозначает совершаемое или непосредственно предстоящее действие; «кладу» конкретно и естественно описывает размещение руна.
- source_word: גִּזַּת הַצֶּמֶר
  choice: шерстяное руно
  rationale: Сохраняет значение руна из шерсти и звучит естественнее, чем буквальное «руно шерсти».
- source_word: בַּגֹּרֶן
  choice: на гумне
  rationale: Обычное русское обозначение подготовленной площадки для молотьбы; предлог «на» соответствует размещению предмета на её поверхности.
- source_word: טַל יִהְיֶה
  choice: роса будет
  rationale: Передаёт еврейскую конструкцию наличия, не уточняя сверх текста, выпадет ли роса или уже будет присутствовать.
- source_word: עַל הַגִּזָּה לְבַדָּהּ
  choice: только на руне
  rationale: Ясно передаёт исключительность, выраженную לְבַדָּהּ.
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  choice: а на всей земле будет сухо
  rationale: Естественно передаёт противопоставление влажного руна окружающей сухой поверхности; «земля» сохраняет широту значения הָאָרֶץ, разъяснённую в сноске.
- source_word: וְיָדַעְתִּי
  choice: то я узнаю
  rationale: В контексте условного предложения союз обозначает результат исполнения условия; «то» делает эту связь явной.
- source_word: כִּי תוֹשִׁיעַ
  choice: что Ты спасёшь
  rationale: Прямо передаёт каузативную форму глагола יָשַׁע — «спасти, избавить».
- source_word: בְּיָדִי
  choice: моей рукой
  rationale: Сохраняет еврейский образ руки как средства действия, остающийся понятным по-русски.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: как Ты и говорил
  rationale: Передаёт глагол «говорить» без усиления до «обещал»; частица «и» естественно подчёркивает соответствие ранее сказанному.
theological_decisions:
- issue: Объём значения הָאָרֶץ в описании знамения
  choice: земля в смысле окружающей поверхности
  alternative: вся страна или вся земля в глобальном смысле
  rationale: Непосредственный контекст противопоставляет руно окружающей поверхности гумна или местности. Перевод не должен представлять знамение как обязательно охватывающее всю страну либо весь мир; смысловая широта слова отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены образ «моей рукой» и обращение к Богу с прописной буквы; архаическая формула «се» заменена естественным «вот».
