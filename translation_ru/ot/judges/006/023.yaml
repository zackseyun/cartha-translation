  text: 'Но Яхве сказал ему: «Мир тебе! Не бойся, ты не умрёшь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Обычная повествовательная форма глагола אמר естественно передаётся русским «сказал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет прямое употребление Божьего имени в еврейском тексте, не заменяя его титулом.
- source_word: שָׁלוֹם לְךָ
  choice: Мир тебе!
  rationale: Краткая естественная формула одновременно сохраняет значение мира, благополучия и ободряющего заверения в данном контексте.
- source_word: אַל תִּירָא
  choice: Не бойся
  rationale: Естественная современная русская формула ободрения, точно передающая запрет с ירא.
- source_word: לֹא תָּמוּת
  choice: ты не умрёшь
  rationale: Будущее время передаёт категорическое заверение о предстоящем результате; местоимение подчёркивает обращённость обещания к Гедеону.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе непосредственно стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Смысл שָׁלוֹם לְךָ
  choice: Мир тебе!
  alternative: Всё будет хорошо; благополучие тебе
  rationale: Формула в контексте служит заверением и ободрением, но буквальная и естественная передача «Мир тебе!» сохраняет её широкий смысл, не сводя его лишь к безопасности или отсутствию тревоги.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной и понятной прямой речью. Союз «Но» передаёт контекстуальное противопоставление испугу Гедеона. Пунктуация оформляет «Мир тебе!» как самостоятельное ободряющее заверение.
