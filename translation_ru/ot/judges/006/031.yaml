  text: וַ/יֹּ֣אמֶר יוֹאָ֡שׁ לְ/כֹל֩ אֲשֶׁר עָמְד֨וּ עָלָ֜י/ו הַ/אַתֶּ֣ם תְּרִיב֣וּ/ן לַ/בַּ֗עַל אִם אַתֶּם֙ תּוֹשִׁיע֣וּ/ן אוֹת֔/וֹ אֲשֶׁ֨ר יָרִ֥יב ל֛/וֹ יוּמַ֖ת עַד הַ/בֹּ֑קֶר אִם אֱלֹהִ֥ים הוּא֙ יָ֣רֶב ל֔/וֹ כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/031.yaml
  text: But Joash said to all who stood against him[a], “Will you contend for Baal? Will you save him? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been torn down.”
translation:
  language: ru
  text: 'Но Иоас сказал всем, кто выступил против него: «Неужели вы будете вступаться за Ваала? Неужели вы спасёте его? Кто вступится за него, тот будет предан смерти до наступления утра. Если он бог, пусть сам вступится за себя, ведь его жертвенник разрушен[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ведь он разрушил его жертвенник»; подразумеваемый субъект — Гедеон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמְדוּ עָלָיו
  choice: выступил против него
  rationale: 'В данном контексте выражение имеет враждебный, конфронтационный смысл: собравшиеся противостоят Иоасу из-за поступка Гедеона.'
- source_word: תְּרִיבוּן / יָרִיב / יָרֶב
  choice: вступаться / вступится / пусть сам вступится
  rationale: Повтор одного русского глагола передаёт риторический повтор корня ריב и допускает как судебный, так и более широкий смысл защиты в споре.
- source_word: תּוֹשִׁיעוּן
  choice: спасёте
  rationale: 'Прямая передача каузативной формы ישׁע сохраняет иронию вопроса: люди намерены спасать своего бога.'
- source_word: אֲשֶׁר יָרִיב לוֹ
  choice: кто вступится за него
  rationale: Обобщающая конструкция с «кто» естественна по-русски и сохраняет неопределённый характер еврейского относительного оборота.
- source_word: יוּמַת
  choice: будет предан смерти
  rationale: 'Передаёт каузативно-пассивное значение формы: речь не просто о смерти, а о том, что человека умертвят.'
- source_word: עַד הַבֹּקֶר
  choice: до наступления утра
  rationale: Сохраняет буквальную временную границу выражения, не устраняя возможную неясность между сроком исполнения и пределом действия угрозы.
- source_word: אֱלֹהִים הוּא
  choice: он бог
  rationale: Речь идёт о притязании Ваала на божественность, а не об отождествлении его с Богом Израиля; строчная буква передаёт это без лишнего пояснения.
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: ведь его жертвенник разрушен
  rationale: Пассивная русская конструкция не добавляет явно названного субъекта, которого в еврейской фразе нет, и сохраняет причинно-пояснительную силу כִּי.
- source_word: וַיֹּאמֶר
  choice: Но Иоас сказал
  rationale: В контексте союз вводит противопоставленный ответ Иоаса требованиям собравшихся; «но» естественно выражает этот поворот.
theological_decisions:
- issue: Значение אֱלֹהִים применительно к Ваалу
  choice: «Если он бог»
  alternative: «Если он Бог»
  rationale: Иоас говорит об предполагаемом божественном статусе Ваала, не признавая его Богом Израиля; написание со строчной буквы сохраняет смысл и богословское напряжение иронического вызова.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Повтор «вступаться» удерживает словесную связь трёх форм корня ריב. Формулировка «жертвенник разрушен» намеренно не называет разрушителя, сохраняя синтаксическую неоднозначность источника.
