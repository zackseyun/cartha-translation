base_translation:
  language: en
  yaml_path: translation/ot/judges/006/030.yaml
  text: Then the men of the city said to Joash[a], “Bring out your son, that he may die, because he has torn down the altar of Baal and cut down the Asherah that was beside it.”
translation:
  language: ru
  text: 'Тогда жители города сказали Иоасу: «Выведи своего сына — он должен умереть, потому что разрушил жертвенник Ваала и срубил ашеру[a], которая была при нём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «культовый столб (или дерево) Ашеры». Еврейское слово может обозначать культовый предмет, связанный с богиней Ашерой; здесь глагол «срубил» указывает именно на предмет, но его точная форма не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: жители города
  rationale: Буквально — «мужи города». В данном контексте выражение обозначает горожан, выступающих как община; «жители города» естественно звучит по-русски и не утверждает без необходимости, что речь шла исключительно о мужчинах.
- source_word: הוֹצֵא
  choice: выведи
  rationale: Каузативный императив от יצא требует вывести сына из дома к собравшимся; «выведи» точно и естественно передаёт действие.
- source_word: וְיָמֹת
  choice: он должен умереть
  rationale: 'Вав с юссивом выражает требуемый результат: собравшиеся требуют смерти Гедеона. Такая формулировка передаёт категоричность требования, не уточняя не названную в тексте юридическую процедуру.'
- source_word: נָתַץ
  choice: разрушил
  rationale: Глагол נתץ обозначает разрушение или снос сооружения; «разрушил» уместно применительно к жертвеннику.
- source_word: מִזְבַּח הַבַּעַל
  choice: жертвенник Ваала
  rationale: Естественная русская передача сопряжённой конструкции с именем божества.
- source_word: כָרַת
  choice: срубил
  rationale: כרת в отношении деревянного культового предмета означает отсечение или срубание; «срубил» соответствует контексту.
- source_word: הָאֲשֵׁרָה
  choice: ашеру
  rationale: Термин может обозначать богиню Ашеру либо связанный с ней культовый предмет. Глагол «срубил» указывает здесь на предмет, однако транслитерация сохраняет терминологическую неоднозначность; пояснение дано в сноске.
- source_word: אֲשֶׁר עָלָיו
  choice: которая была при нём
  rationale: Предлог על может означать «на нём», «над ним» или «при/рядом с ним». «При нём» сохраняет пространственную неопределённость лучше, чем более конкретное «рядом с ним»; местоимение относится к жертвеннику.
theological_decisions:
- issue: Значение אֲשֵׁרָה в полемическом повествовании
  choice: ашеру
  alternative: столб Ашеры; священное дерево; богиню Ашеру
  rationale: Контекст и глагол «срубил» указывают на культовый предмет, но его точная форма не названа. Транслитерация с пояснением не отождествляет его без достаточных оснований ни со столбом, ни с самой богиней.
- issue: Сила וְיָמֹת
  choice: он должен умереть
  alternative: пусть умрёт; чтобы он умер; его следует предать смерти
  rationale: Юссив после повеления выражает требование смерти. Выбранная передача естественна по-русски и не добавляет формальной судебной терминологии.
translation_notes:
  register: Современный литературный русский язык с повествовательной торжественностью без архаизмов. Реплика передаёт угрожающий и категоричный тон. Имя יוֹאָשׁ передано традиционной библейской формой «Иоас».
