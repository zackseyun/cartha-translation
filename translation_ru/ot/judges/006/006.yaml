  yaml_path: translation/ot/judges/006/006.yaml
  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
translation:
  language: ru
  text: Так Израиль крайне обнищал из-за Мадиана[a], и сыны Израиля воззвали к Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был сильно ослаблен» или «оказался в крайне стеснённых обстоятельствах». Еврейский глагол может обозначать состояние крайней нужды, ослабления или разорения.'
    reason: lexical_alternative
  - marker: b
    text: Евр. ЙХВХ — личное имя Бога; традиционно переводится как «ГОСПОДЬ».
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּדַּל ... מְאֹד
  choice: был доведён до крайнего упадка
  rationale: Глагол דל обозначает ослабление, обнищание или униженное состояние, а מְאֹד усиливает его. Формулировка сохраняет широту смысла и не сводит бедствие только к материальной нищете.
- source_word: מִפְּנֵי מִדְיָן
  choice: из-за Мадиана
  rationale: В данном контексте מִפְּנֵי выражает причину тяжёлого положения Израиля; «из-за» естественно передаёт эту связь.
- source_word: וַיִּזְעֲקוּ
  choice: воззвали
  rationale: זעק означает настойчивый крик в бедствии, нередко обращённый за помощью. «Воззвали» уместно для молитвенного обращения и сохраняет торжественный библейский регистр.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Передаёт явную форму «сыны Израиля» и её собирательное обозначение народа, не заменяя её нейтральным этнонимом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное заветное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: Исходный текст употребляет собственное божественное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Корпоративный смысл בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Сохранена мужская множественная форма оригинала, которая в данном контексте собирательно обозначает народ Израиля.
- issue: Характер упадка Израиля
  choice: доведён до крайнего упадка
  alternative: крайне обнищал
  rationale: Еврейский глагол допускает экономический и более широкий смысл ослабления или унижения; основной текст не ограничивает значение одной лишь бедностью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Крайний упадок» сохраняет смысловую широту оригинала; «сыны Израиля» и «воззвали» намеренно удерживают его формальную и заветную окраску.
