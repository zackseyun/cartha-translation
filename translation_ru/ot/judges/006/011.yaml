base_translation:
  language: en
  yaml_path: translation/ot/judges/006/011.yaml
  text: Then the angel of Yahweh came and sat under the oak that was in Ophrah[a], which belonged to Joash the Abiezrite[c][b], while Gideon his son was beating out wheat in the winepress to hide it from Midian.
translation:
  language: ru
  text: И пришёл ангел Яхве и сел под теревинфом[a], который находился в Офре и принадлежал Иоасу из рода Авиезера[b]. Его сын Гедеон выколачивал пшеницу[c] в виноградной давильне, чтобы спрятать её от мадианитян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дубом». Еврейское название дерева допускает разные ботанические отождествления.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «авиезеритянину»; то есть человеку из рода Авиезера.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «молотил пшеницу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ допускает значения «вестник» и «ангел», однако в данном повествовании речь естественнее всего идёт о небесном посланнике. Личное имя יְהוָה передано как «Яхве» без замены титулом.
- source_word: וַיָּבֹא ... וַיֵּשֶׁב
  choice: пришёл ... и сел
  rationale: Прямо и естественно передаёт последовательные повествовательные формы, не перегружая русский текст.
- source_word: הָאֵלָה
  choice: теревинф
  rationale: Название дерева אֵלָה часто относят к теревинфу; ботаническая идентификация не вполне бесспорна, поэтому распространённый вариант «дуб» сохранён в сноске.
- source_word: אֲשֶׁר לְיוֹאָשׁ
  choice: принадлежал Иоасу
  rationale: Ясно выражает обозначенное еврейской конструкцией отношение принадлежности и сохраняет привязку относительного предложения к дереву.
- source_word: אֲבִי הָעֶזְרִי
  choice: авиезеритянин
  rationale: Передаёт родовую принадлежность Иоаса к клану Авиезера; альтернативная русская форма приведена в сноске.
- source_word: חֹבֵט חִטִּים
  choice: выколачивал пшеницу
  rationale: Глагол חבט конкретно обозначает выбивание зерна ударами; это точнее общего «молотил» и соответствует необычному месту работы.
- source_word: בַּגַּת
  choice: в виноградной давильне
  rationale: Сохраняет значение גת и пространственный образ скрытого углубления, где Гедеон обрабатывал зерно.
- source_word: לְהָנִיס מִפְּנֵי מִדְיָן
  choice: чтобы уберечь её от мадианитян
  rationale: Каузативная форма נוס выражает удаление зерна из-под угрозы. В контексте естественное русское выражение «уберечь» передаёт цель действия, а собирательное «Мадиан» раскрыто как народ — мадианитяне.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит личное имя Бога. Транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Значение מַלְאַךְ יְהוָה и личность этого персонажа
  choice: ангел Яхве
  alternative: вестник Яхве
  rationale: Контекст указывает на небесного посланника, но перевод не отождествляет его с какой-либо иной божественной личностью и тем самым сохраняет напряжение самого повествования.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохраняет связь стиха с предшествующим рассказом. Имена переданы в привычных русских библейских формах: Офра, Иоас, Гедеон, Мадиан.'
