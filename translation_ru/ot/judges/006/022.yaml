base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
translation:
  language: ru
  text: 'Тогда Гедеон понял, что это ангел Яхве[a], и сказал: «Ах, Владыка Яхве! Ведь я видел ангела Яхве лицом к лицу!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланник Яхве». Древнееврейское слово может означать и ангела, и посланника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Тогда ... понял
  rationale: Буквально глагол означает «увидел», но придаточное с כִּי указывает здесь на осознание личности встретившегося Гедеону существа; по-русски «понял, что» естественно передаёт этот смысл.
- source_word: מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  rationale: מַלְאָךְ может означать как ангела, так и посланника. В данном повествовании речь идёт о сверхъестественном посланнике; основным выбран традиционный и понятный вариант «Ангел», а лексическая неоднозначность сохранена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом, что соответствует непосредственно представленному древнееврейскому тексту.
- source_word: אֲהָהּ
  choice: О
  rationale: Междометие выражает испуг и смятение. Русское «О» сохраняет торжественный и тревожный характер возгласа без излишней разговорности.
- source_word: אֲדֹנָי יְהוִה
  choice: Владыка Яхве
  rationale: «Владыка» передаёт אֲדֹנָי и позволяет ясно сохранить следующее за ним личное имя Яхве, не создавая сочетания двух одинаковых слов «Господь».
- source_word: כִּי עַל כֵּן
  choice: Ведь
  rationale: Сочетание вводит основание для испуганного возгласа Гедеона; частица «ведь» естественно выражает объяснительно-причинную связь.
- source_word: רָאִיתִי
  choice: я видел
  rationale: Русское прошедшее время естественно передаёт совершённое действие и его непосредственную значимость для настоящей реакции Гедеона.
- source_word: פָּנִים אֶל פָּנִים
  choice: лицом к лицу
  rationale: Устойчивое русское выражение точно сохраняет древнееврейский образ непосредственной встречи.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Понимание מַלְאַךְ יְהוָה
  choice: 'Ангел Яхве с примечанием «Или: посланник Яхве»'
  alternative: посланник Яхве
  rationale: Контекст поддерживает сверхъестественное понимание, однако само древнееврейское слово допускает оба значения. Сноска сохраняет лексическую и связанную с ней богословскую напряжённость, не определяя природу Ангела сверх сказанного в стихе.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Заглавное написание «Ангел» принято как обозначение конкретной фигуры в данном эпизоде, без дополнительного догматического отождествления.
