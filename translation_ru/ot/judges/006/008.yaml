  text: וַ/יִּשְׁלַ֧ח יְהוָ֛ה אִ֥ישׁ נָבִ֖יא אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יֹּ֨אמֶר לָ/הֶ֜ם כֹּה אָמַ֥ר יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל אָנֹכִ֞י הֶעֱלֵ֤יתִי אֶתְ/כֶם֙ מִ/מִּצְרַ֔יִם וָ/אֹצִ֥יא אֶתְ/כֶ֖ם מִ/בֵּ֥ית עֲבָדִֽים־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
translation:
  language: ru
  text: 'Тогда Яхве послал к сынам Израиля человека, пророка, и тот сказал им: «Так говорит Яхве, Бог Израиля: Я вывел вас из Египта, вывел вас из дома рабства».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Тогда ... послал
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: אִישׁ נָבִיא
  choice: человека-пророка
  rationale: Сохраняет оба существительных в приложении, но оформляет их естественно для современного русского языка.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: к сынам Израиля
  rationale: Сохраняет традиционное корпоративное обозначение народа и формальную близость к еврейскому выражению.
- source_word: וַיֹּאמֶר לָהֶם
  choice: и тот сказал им
  rationale: Указательное местоимение ясно относит речь к только что упомянутому пророку и избегает двусмысленности с Яхве.
- source_word: כֹּה אָמַר
  choice: Так говорит
  rationale: Естественная русская форма стандартной пророческой формулы посланника.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бог Израиля
  rationale: Прямо и ясно сохраняет заветный титул.
- source_word: אָנֹכִי הֶעֱלֵיתִי
  choice: Я вывел
  rationale: Независимое местоимение передано явным «Я», а каузативный глагол — обычным русским выражением об исходе; буквальное пространственное «поднял» здесь было бы неестественно.
- source_word: וָאֹצִיא
  choice: вывел
  rationale: Повтор глагола сохраняет параллелизм двух еврейских форм со значением избавительного исхода.
- source_word: מִבֵּית עֲבָדִים
  choice: из дома рабства
  rationale: Естественно передаёт устойчивый образ места и состояния порабощения; буквальное «дом рабов» в русском могло бы означать жилище, принадлежащее рабам.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Корпоративное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбрана формально близкая и понятная библейская формула без нейтрализации образа родства.
- issue: Образ בֵּית עֲבָדִים
  choice: дом рабства
  alternative: дом рабов
  rationale: Выбор сохраняет богословски значимый образ избавления из порабощения, не создавая в русском ложного впечатления о доме, которым владеют или где просто живут рабы.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис несколько возвышенный, но понятный; архаизмы сведены к устойчивому выражению «сыны Израиля».
