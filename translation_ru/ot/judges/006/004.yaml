base_translation:
  language: en
  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
translation:
  language: ru
  text: Они располагались станом против израильтян и уничтожали плоды земли вплоть до Газы[a], не оставляя в Израиле никаких средств к существованию — ни овец, ни крупного скота, ни ослов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до твоего приближения к Газе»; это еврейский оборот, обозначающий предел территории в направлении Газы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  choice: Они располагались станом против израильтян
  rationale: Глагол חנה означает «располагаться станом»; контекст повторяющихся набегов требует несовершенного вида. Местоименное «против них» раскрыто как «против израильтян» для ясности по контексту.
- source_word: וַיַּשְׁחִיתוּ אֶת יְבוּל הָאָרֶץ
  choice: и уничтожали плоды земли
  rationale: Порода Hiphil глагола שׁחת передаёт уничтожение или разорение, а יְבוּל обозначает урожай, плоды или произведение земли. «Плоды земли» сохраняет широту выражения.
- source_word: עַד בּוֹאֲךָ עַזָּה
  choice: вплоть до Газы[a]
  rationale: Буквально выражение говорит о «твоём приближении/приходе к Газе», но это обычный пространственный оборот, естественно передаваемый как предел распространения разорения.
- source_word: וְלֹא יַשְׁאִירוּ מִחְיָה בְּיִשְׂרָאֵל
  choice: не оставляя в Израиле никаких средств к существованию
  rationale: מִחְיָה охватывает пропитание и средства поддержания жизни; «средства к существованию» передаёт экономико-жизненный смысл, не сводя слово только к пище.
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  choice: ни овец, ни крупного скота, ни ослов
  rationale: Единственные формы имеют собирательное значение. שֶׂה может обозначать мелкий скот, здесь естественно «овцы»; שׁוֹר — животное из крупного рогатого скота, потому собирательное «крупный скот» точнее русского «волы» в данном перечне.
