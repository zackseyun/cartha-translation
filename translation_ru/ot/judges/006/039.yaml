  text: וַ/יֹּ֤אמֶר גִּדְעוֹן֙ אֶל הָ֣/אֱלֹהִ֔ים אַל יִ֤חַר אַפְּ/ךָ֙ בִּ֔/י וַ/אֲדַבְּרָ֖ה אַ֣ךְ הַ/פָּ֑עַם אֲנַסֶּ֤ה נָּא רַק הַ/פַּ֨עַם֙ בַּ/גִּזָּ֔ה יְהִי נָ֨א חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ יִֽהְיֶה טָּֽל־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
translation:
  language: ru
  text: 'Тогда Гедеон сказал Богу: «Пусть Твой гнев не воспылает против меня, и позволь мне сказать ещё только на этот раз. Прошу, позволь мне только на этот раз испытать посредством руна: пусть одно лишь руно останется сухим, а на всей земле будет роса».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не гневайся на меня». Буквально еврейское выражение говорит о гневе, который «пылает». Слово «земля» может также означать «почва» или «земля вокруг руна»; здесь оно противопоставлено самому руну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  choice: Пусть Твой гнев не разгорается на меня
  rationale: Сохраняет образ «горящего» гнева в естественной для современного русского форме; более прямой вариант — «не гневайся на меня».
- source_word: וַאֲדַבְּרָה אַךְ הַפָּעַם
  choice: и позволь мне сказать ещё только один раз
  rationale: Когортатив передаёт почтительную просьбу продолжить речь, а ограничительная фраза подчёркивает, что это последнее обращение.
- source_word: אֲנַסֶּה נָּא רַק הַפַּעַם בַּגִּזָּה
  choice: Прошу, дай мне испытать с шерстью ещё только один раз
  rationale: נסה означает «испытывать, проверять»; перевод сохраняет неоднозначную напряжённость поступка Гедеона, не превращая его ни в явно дерзкий вызов, ни в безобидную просьбу. בַּגִּזָּה указывает на шерсть как средство испытания.
- source_word: יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: пусть одна лишь шерсть останется сухой
  rationale: חֹרֶב здесь обозначает сухость, а не засуху. По-русски предикативное «останется сухой» естественнее буквального «пусть будет сухость на шерсти» и ясно выражает требуемый результат.
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  choice: а на всей земле вокруг неё будет роса
  rationale: הָאָרֶץ в локальном противопоставлении шерсти обозначает землю рядом с ней, а не весь мир; уточнение «вокруг неё» делает этот контекстуальный смысл явным.
- source_word: הָאֱלֹהִים
  choice: Богу
  rationale: Определённая форма в данном повествовательном контексте относится к Богу Израиля; русская норма не требует артиклеподобного уточнения.
theological_decisions:
- issue: Характер повторной просьбы Гедеона об испытании
  choice: Передать как осторожную просьбу ещё об одном испытании, сохранив глагол «испытать»
  alternative: Сильнее осудить поступок как дерзкое испытание Бога либо смягчить его до нейтральной просьбы о знаке
  rationale: Еврейский текст сочетает опасение Божьего гнева с просьбой ещё раз испытать посредством шерсти; перевод сохраняет это напряжение, не добавляя оценки.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Повтор «ещё только один раз» сохранён в обеих частях речи Гедеона как намеренный риторический акцент. «Шерсть» выбрана вместо более специального «руно», чтобы текст был понятен обычному современному читателю; контекст предыдущих стихов определяет, что речь идёт о состриженной шерсти.
