    rationale: וְעַל כָּל־הָאָרֶץ означает «на всей земле/почве». Контекст позволяет понимать это локально, но слова «вокруг неё» отсутствуют в исходном тексте и не должны входить в основной перевод.
  - severity: low
    issue: «Шерсть» менее точна, чем «руно».
    rationale: גִּזָּה здесь обозначает руно, используемое как предмет знамения. «Руно» — обычный и понятный термин современного литературного библейского русского.
