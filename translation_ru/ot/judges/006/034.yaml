  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
translation:
  language: ru
  text: И Дух Яхве овладел Гедеоном[a]. Он затрубил в рог[b], и род Авиезера собрался вслед за ним[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Дух Яхве облёкся Гедеоном» — необычный образ, представляющий Духа как облекающегося Гедеоном. Или: «Дух Яхве сошёл на Гедеона».'
    reason: lexical_alternative
  - marker: b
    text: Имеется в виду шофар — рог, служивший для подачи сигналов.
    reason: cultural_note
  - marker: c
    text: 'Или: «род Авиезера был созван следовать за ним»; «сплотился вокруг него».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: И Дух Яхве
  rationale: В контексте наделения Гедеона силой רוּחַ означает «Дух». Личное имя יהוה передано как «Яхве».
- source_word: לָבְשָׁה אֶת גִּדְעוֹן
  choice: облёк Гедеона
  rationale: 'Сохранён яркий образ исходного текста: Дух выступает субъектом глагола לבשׁ, а Гедеон — прямым объектом. «Облёк» естественнее по-русски, чем буквальное «надел на Себя Гедеона», и не сводит метафору к пояснительному «сошёл на».'
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: Он затрубил в рог
  rationale: שׁוֹפָר — сигнальный рог. «Затрубил в рог» передаёт и предмет, и действие естественным современным русским языком.
- source_word: וַיִּזָּעֵק
  choice: собрался
  rationale: Нифаль глагола זעק здесь описывает созыв или мобилизацию в ответ на сигнал. Русское «собрался» естественно передаёт результирующее сплочение, не уточняя сверх текста степень военной организации.
- source_word: אֲבִיעֶזֶר
  choice: род Авиезера
  rationale: Здесь имя обозначает не одного предка, а родовую группу авиезритов; явное «род» предотвращает ошибочное понимание как имени отдельного человека.
- source_word: אַחֲרָיו
  choice: вслед за ним
  rationale: Выражение передаёт как следование за Гедеоном, так и присоединение к нему.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо содержит тетраграмматон; транслитерация «Яхве» сохраняет личное заветное имя.
- issue: Образ действия Духа на Гедеона
  choice: Дух Яхве облёк Гедеона
  alternative: Дух Яхве сошёл на Гедеона
  rationale: Сохранена необычная метафора еврейского текста без догматического уточнения природы или механизма наделения силой.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной библейской интонацией. Союзная последовательность оригинала слегка разгружена делением на два предложения. Метафора «облёк» сохранена, а подразумеваемая родовая группа при имени Авиезер обозначена явно.
