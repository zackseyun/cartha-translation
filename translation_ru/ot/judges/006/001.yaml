  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
translation:
  language: ru
  text: Израильтяне[a] сделали то, что было злом в глазах Яхве[b], и Яхве отдал их во власть Мадиана[c] на семь лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пред Яхве».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в руку Мадиана» — древнееврейский оборот со значением власти или контроля.'
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Буквально «сыны Израиля». В современном русском языке «израильтяне» естественно обозначает весь народ и сохраняет корпоративный смысл выражения; буквальная форма приведена в примечании.
- source_word: הָרַע
  choice: зло
  rationale: В сочетании с עשה определённая форма הָרַע означает «зло» или «то, что было злом». Краткое «делали зло» передаёт нравственную оценку без ослабления.
- source_word: בְעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён прозрачный древнееврейский образ, выражающий оценку поступков с точки зрения Яхве. Более гладкий вариант «пред Яхве» отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в древнееврейском тексте, а не заменяющий его титул.
- source_word: וַיִּתְּנֵם
  choice: отдал их
  rationale: Вместе с оборотом «в руку Мадиана» глагол נתן означает передачу народа под чужую власть. «Отдал» естественно выражает это по-русски.
- source_word: בְּיַד מִדְיָן
  choice: во власть Мадиана
  rationale: Буквально «в руку Мадиана»; слово «рука» здесь служит идиомой власти и контроля. Смысловая передача понятна современному читателю, а исходный образ указан в сноске.
- source_word: שֶׁבַע שָׁנִים
  choice: на семь лет
  rationale: Предлог «на» естественно передаёт обозначенную древнееврейским оборотом продолжительность установленного периода.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено собственное имя Бога. Его передача как «Яхве» сохраняет различие между именем и титулом, не добавляя конфессионального толкования.
- issue: Смысл Божьего действия וַיִּתְּנֵם יְהוָה
  choice: Яхве отдал их во власть Мадиана
  alternative: Яхве допустил, чтобы они оказались под властью Мадиана
  rationale: Глагол прямо представляет Яхве действующим лицом. Перевод сохраняет эту богословскую напряжённость и не смягчает её пояснением через «допустил».
translation_notes:
  register: Современный литературный русский язык с умеренным сохранением древнееврейской образности. Корпоративное обозначение передано естественным словом «израильтяне», тогда как формула «в глазах Яхве» сохранена ради её повторяющегося значения в книге Судей. Союз «и» поддерживает последовательный повествовательный ритм исходного текста.
