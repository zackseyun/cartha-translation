revisions:
- from: И взял Гедеон десять человек из числа своих слуг и сделал так, как повелел ему Яхве. Но, поскольку он боялся дома своего отца и жителей города и потому не решился сделать это днём[a], он сделал это ночью.
  to: И взял Гедеон десять человек из числа своих слуг и сделал так, как сказал ему Яхве. Но, поскольку он боялся дома своего отца и жителей города, он не сделал этого днём, а сделал ночью[a].
  rationale: Исправлены неточная «буквальная» сноска и слегка интерпретирующее «повелел». Перестройка заключительной фразы ясно передаёт причинно-препятственное значение оригинала и его контраст «днём — ночью», не добавляя нового смысла.
