source:
  edition: WLC
  text: וַ/יִּקַּ֨ח גִּדְע֜וֹן עֲשָׂרָ֤ה אֲנָשִׁים֙ מֵֽ/עֲבָדָ֔י/ו וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֵלָ֖י/ו יְהוָ֑ה וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר יָרֵא֩ אֶת בֵּ֨ית אָבִ֜י/ו וְ/אֶת אַנְשֵׁ֥י הָ/עִ֛יר מֵ/עֲשׂ֥וֹת יוֹמָ֖ם וַ/יַּ֥עַשׂ לָֽיְלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/027.yaml
  text: So Gideon took ten men from among his servants and did as Yahweh had spoken to him. But because he feared his father's household and the men of the city too much to do it by day[a], he did it at night.
translation:
  language: ru
  text: И взял Гедеон десять человек из числа своих слуг и сделал так, как сказал ему Яхве. Но, поскольку он боялся дома своего отца и жителей города, он не сделал этого днём, а сделал ночью[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от того, чтобы сделать это днём»; еврейская конструкция выражает, что страх удержал его от дневного действия.'
    reason: Более буквальная передача конструкции מִן с инфинитивом после глагола «боялся».
lexical_decisions:
- source_word: וַיִּקַּח
  choice: взял
  rationale: Обычное повествовательное значение לקח; прямой и естественный русский эквивалент.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: десять человек
  rationale: В современном русском «десять человек» естественно обозначает группу мужчин; пол участников ясен из контекста и формы исходного текста.
- source_word: מֵעֲבָדָיו
  choice: из числа своих слуг
  rationale: Предлог מִן имеет здесь партитивное значение, а עֶבֶד в данном контексте уместно передать как «слуга», не усиливая оттенок рабского статуса.
- source_word: וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  choice: сделал так, как повелел ему Яхве
  rationale: דבר буквально связано с речью, но в контексте данного поручения «повелел» естественно передаёт содержание сказанного и последующее послушание Гедеона.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Но, поскольку
  rationale: Передаёт поясняющий причинный поворот повествования без тяжеловесного буквального оборота «и было, когда/поскольку».
- source_word: יָרֵא
  choice: боялся
  rationale: Глагол ירא здесь обозначает страх перед людьми; «боялся» — точный и современный русский эквивалент.
- source_word: בֵּית אָבִיו
  choice: дома своего отца
  rationale: '«Дом» сохраняет ёмкость древнееврейского выражения: оно может обозначать семью и всё отцовское домохозяйство, а не только здание.'
- source_word: אַנְשֵׁי הָעִיר
  choice: жителей города
  rationale: В данном контексте אַנְשֵׁי обозначает городское мужское население, противодействия которого опасался Гедеон; по-русски «жители города» звучит естественно и не вводит идею официальной городской власти.
- source_word: מֵעֲשׂוֹת יוֹמָם
  choice: и потому не решился сделать это днём
  rationale: Конструкция מן с инфинитивом после глагола страха выражает удерживающее действие страха. Перевод делает эту связь ясной, сохраняя примечание о более буквальной форме.
- source_word: וַיַּעַשׂ לָיְלָה
  choice: он сделал это ночью
  rationale: Естественно передаёт противопоставление дневному времени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст содержит собственное имя Бога. Форма «Яхве» наиболее прямо передаёт принятую научную реконструкцию произношения, не заменяя имя титулом.
- issue: Характер поступка Гедеона при наличии страха
  choice: сохраняется сочетание послушания и страха
  alternative: представить его страх как отказ от повеления или, напротив, сгладить упоминание страха
  rationale: Текст одновременно сообщает, что Гедеон исполнил повеление, и что из страха сделал это ночью; перевод не устраняет эту повествовательную напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Начальное «И» сохраняет последовательность древнееврейского рассказа. Выражение «дом своего отца» намеренно оставлено ёмким, а причинно-препятственное значение заключительной конструкции раскрыто естественным русским оборотом.
