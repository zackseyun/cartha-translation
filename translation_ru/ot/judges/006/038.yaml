- source_word: וַיִּמֶץ טַל מִן־הַגִּזָּה
  choice: выжал из него росу
  rationale: Передаёт извлечение жидкости из руна и сохраняет последовательность двух еврейских глаголов.
- source_word: מְלֹא הַסֵּפֶל מָיִם
  choice: целую чашу воды
  rationale: Идиоматически выражает количество воды, достаточное для наполнения чаши; «целую» подчёркивает неожиданную полноту меры без добавления нового смысла.
