base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
translation:
  language: ru
  text: '«Прошу, не уходи отсюда, пока я не приду к тебе, не вынесу свой дар[a] и не положу его перед тобой». Он сказал: «Я останусь, пока ты не вернёшься».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «приношение». Еврейское слово может обозначать преподносимый дар, а в некоторых контекстах — жертвенное приношение.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָמֻשׁ מִזֶּה
  choice: не уходи отсюда
  rationale: Глагол מוש в сочетании с מִזֶּה означает удалиться с данного места; современное русское «не уходи отсюда» естественно передаёт просьбу остаться.
- source_word: נָא
  choice: прошу
  rationale: Частица выражает вежливую, настоятельную просьбу; «прошу» сохраняет уважительный тон без архаизации.
- source_word: עַד בֹּאִי אֵלֶיךָ
  choice: пока я не приду к тебе
  rationale: Инфинитивная конструкция с местоименным суффиксом естественно передаётся по-русски придаточным времени.
- source_word: וְהוֹצֵאתִי
  choice: не вынесу
  rationale: Каузативная форма יצא означает вынести или принести наружу то, что Гедеон собирается приготовить; повтор частицы «не» обусловлен русской конструкцией «пока не» с однородными сказуемыми.
- source_word: מִנְחָתִי
  choice: мой дар
  rationale: מִנְחָה может обозначать дар, подношение или жертвенное приношение. «Дар» сохраняет исходную широту значения и не предрешает сакральный характер действия раньше, чем это раскрывает повествование.
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  choice: не положу его перед тобой
  rationale: Выражение буквально описывает помещение дара перед адресатом; такой перевод ясен и сохраняет образ исходного текста.
- source_word: אָנֹכִי אֵשֵׁב
  choice: Я останусь
  rationale: ישב буквально может означать «сидеть», но здесь выражает пребывание на месте; «останусь» точно передаёт контекстуальный смысл.
- source_word: עַד שׁוּבֶךָ
  choice: пока ты не вернёшься
  rationale: Инфинитив с суффиксом естественно преобразован в русское придаточное времени.
theological_decisions:
- issue: Значение מִנְחָה в представлении Гедеона
  choice: дар
  alternative: приношение; жертва; хлебное приношение
  rationale: В данном месте слово допускает как обычный дар, так и подношение с религиозным оттенком. «Дар» не сужает значение до установленной жертвы, а сноска сохраняет сакральную возможность, которая становится заметнее по дальнейшему ходу рассказа.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис диалога естественный; неоднозначность מִנְחָה сохранена посредством основного варианта «дар» и сноски.
