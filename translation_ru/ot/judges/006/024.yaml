  source_fidelity: 'Основной смысл передан точно: Гедеон строит жертвенник Яхве, даёт ему имя «Яхве — мир», и жертвенник всё ещё находится в Офре во время повествователя. Однако «Офре, принадлежавшей роду Авиезера» излишне конкретизирует конструкцию בְּעָפְרָת אֲבִי הָעֶזְרִי как юридическое или фактическое владение. Еврейское выражение представляет географическое уточнение «Офра Авиезритов»; оно не требует утверждения о принадлежности.'
