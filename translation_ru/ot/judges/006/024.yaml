base_translation:
  language: en
  yaml_path: translation/ot/judges/006/024.yaml
  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
translation:
  language: ru
  text: Тогда Гедеон построил там жертвенник Яхве и назвал его[a] «Яхве — мир». Он и по сей день находится в Офре Авиезеритов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Евр.: «Яхве шалом»; традиционная транслитерация имени жертвенника: «Яхве-Шалом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: построил
  rationale: Обычный повествовательный эквивалент глагола בנה применительно к сооружению жертвенника.
- source_word: מִזְבֵּחַ
  choice: жертвенник
  rationale: Стандартное русское обозначение культового сооружения для принесения жертв.
- source_word: לַיהוָה
  choice: Яхве
  rationale: 'Предлог ל обозначает посвящение: жертвенник построен Яхве; тетраграмматон передан личным именем «Яхве».'
- source_word: וַיִּקְרָא לוֹ
  choice: назвал его
  rationale: В контексте наречения имени קרא + ל естественно передаётся по-русски как «назвал»; местоимение относится к жертвеннику.
- source_word: יְהוָה שָׁלוֹם
  choice: Яхве — мир
  rationale: Сохранена краткая именная конструкция без выраженной связки, возможная и естественная в русском языке.
- source_word: שָׁלוֹם
  choice: мир
  rationale: «Мир» — краткий традиционный эквивалент; слово также может включать оттенки благополучия и целостности.
- source_word: עַד הַיּוֹם הַזֶּה עוֹדֶנּוּ
  choice: Он и по сей день находится
  rationale: Естественно передаёт продолжающееся существование жертвенника до времени повествователя.
- source_word: בְּעָפְרָת
  choice: в Офре
  rationale: Географическое название передано принятой русской формой.
- source_word: אֲבִי הָעֶזְרִי
  choice: принадлежавшей роду Авиезера
  rationale: Форма указывает на родовую принадлежность Офры; развёрнутая передача яснее буквального «Авиезеровой» и не утверждает, что речь идёт о личной собственности одного человека.
theological_decisions:
- issue: Передача имени יְהוָה в посвящении жертвенника и в его названии
  choice: Яхве / Яхве — мир
  alternative: Господь / Господь есть мир; Иегова-шалом
  rationale: Еврейский текст дважды прямо употребляет тетраграмматон. Транслитерация «Яхве» сохраняет личное заветное имя, а не заменяет его титулом.
- issue: Смысл именной формулы יְהוָה שָׁלוֹם
  choice: Яхве — мир
  alternative: Яхве дарует мир; Яхве благополучен
  rationale: В исходном тексте нет глагола, поэтому перевод сохраняет богословски значимую краткость и не уточняет без основания, обозначает ли формула сущность, источник или дар мира.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным, при этом сохранены краткость имени жертвенника и неоднозначность безглагольной еврейской формулы.
