  terminology: «Жертвенник», «Яхве», «Гедеон», «Офра» и «Авиезериты» уместны. «Яхве — мир» адекватно передаёт безглагольную формулу יְהוָה שָׁלוֹם, не навязывая толкование «даёт мир» или «есть источник мира». Сноска корректно отмечает еврейскую форму и традиционную транслитерацию названия.
