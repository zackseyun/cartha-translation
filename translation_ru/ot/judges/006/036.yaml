    issue: Видовая форма «как Ты говорил»
    rationale: Форма «говорил» передаёт несовершенный вид и может подразумевать длительное либо повторное говорение. В исходном тексте стоит перфект «Ты сказал/говорил» о ранее данном слове; в русском наиболее прямое соответствие — «как Ты сказал».
