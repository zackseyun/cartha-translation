  text: וַ/יֹּ֥אמֶר גִּדְע֖וֹן אֶל הָ/אֱלֹהִ֑ים אִם יֶשְׁ/ךָ֞ מוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/036.yaml
  text: Then Gideon said to God, “If you will save Israel by my hand, as you have spoken,”
translation:
  language: ru
  text: 'И сказал Гедеон Богу: «Если Ты спасёшь Израиль моей рукой, как Ты сказал…»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Ваййиктоль продолжает повествовательную последовательность; традиционное и естественное русское «И сказал» сохраняет связность рассказа.
- source_word: אֶל הָאֱלֹהִים
  choice: Богу
  rationale: В данном контексте Гедеон обращается к Богу Израиля; русская конструкция с глаголом речи естественно требует дательного падежа.
- source_word: אִם
  choice: Если
  rationale: Союз вводит условие, завершение которого следует в следующем стихе; перевод сохраняет открытую условную конструкцию.
- source_word: יֶשְׁךָ מוֹשִׁיעַ
  choice: Ты спасёшь
  rationale: Сочетание יֵשׁ с местоименным суффиксом и причастием выражает предстоящее или намереваемое действие. Русское будущее время передаёт этот смысл прямо и естественно.
- source_word: בְּיָדִי
  choice: моей рукой
  rationale: Сохранён конкретный еврейский образ руки как орудия действия; выражение понятно и допустимо в современном литературном русском.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Показатель прямого дополнения не переводится; название народа выступает объектом спасения.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: как Ты говорил
  rationale: Передаёт ссылку на ранее сказанное Богом без добавочного толкования; прошедшее несовершенное естественно указывает на предшествующее обещание.
theological_decisions:
- issue: Значение אֱלֹהִים в обращении Гедеона
  choice: Богу
  alternative: богу / этому Богу
  rationale: Контекст определённо указывает на Бога Израиля, а форма с прописной буквы передаёт конкретную референцию, не добавляя конфессиональных уточнений.
- issue: Степень уверенности в условии אִם
  choice: Если Ты спасёшь
  alternative: Если Ты намерен спасти
  rationale: Сохранена грамматическая условность высказывания и напряжение просьбы о знамении; перевод не превращает условие ни в сомнение, ни в утверждение намерения Бога.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Многоточие показывает, что условная фраза синтаксически продолжается в следующем стихе; кавычки остаются открытыми только в пределах представленного стиха не оставлены — реплика оформлена как фрагмент с многоточием.
