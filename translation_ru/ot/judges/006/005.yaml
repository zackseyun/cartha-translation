  yaml_path: translation/ot/judges/006/005.yaml
  text: For they and their livestock would come up[a], and their tents would come like locusts in multitude; both they and their camels were without number[c][b], and they came into the land to destroy it.
translation:
  language: ru
  text: Ведь они приходили со своим скотом и шатрами, многочисленные, как саранча[a]; и им, и их верблюдам не было числа. Они приходили в землю, чтобы разорять её[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно полчища саранчи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «чтобы погубить её»; еврейское слово может означать также «уничтожить» или «опустошить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ведь
  rationale: Союз вводит объяснение предшествующего рассказа о разорении Израиля; «ведь» естественно передаёт эту смысловую связь.
- source_word: הֵם וּמִקְנֵיהֶם יַעֲלוּ
  choice: они поднимались туда со своим скотом
  rationale: Имперфект обозначает повторявшееся в прошлом действие. «Скот» передаёт собирательное значение מִקְנֶה, а «поднимались» сохраняет пространственный образ глагола עלה.
- source_word: וְאָהֳלֵיהֶם יָבֹאוּ
  choice: со своим скотом и шатрами
  rationale: В еврейском тексте буквально сказано, что приходили их шатры; в русском метонимия перестроена в естественное указание на захватчиков, приходивших вместе с шатрами, без утраты образа кочующего лагеря.
- source_word: כְּדֵי אַרְבֶּה לָרֹב
  choice: многочисленные, как саранча
  rationale: Фраза подчёркивает огромную численность захватчиков сравнением с саранчой; выбранная формулировка ясна современному читателю и сохраняет образ оригинала.
- source_word: וְלָהֶם וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: не было числа ни им, ни их верблюдам
  rationale: Сохранена выразительная еврейская идиома «нет числа», относящаяся и к людям, и к верблюдам.
- source_word: וַיָּבֹאוּ בָאָרֶץ
  choice: Они приходили в эту землю
  rationale: Форма продолжает описание повторявшихся набегов; указательное «эту» естественно обозначает уже известную из контекста землю Израиля.
- source_word: לְשַׁחֲתָהּ
  choice: чтобы разорять её
  rationale: Инфинитив выражает цель вторжения. В данном контексте שׁחת означает опустошение и разорение земли, а не обязательно её буквальное уничтожение.
