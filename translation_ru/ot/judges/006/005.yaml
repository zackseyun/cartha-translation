  source_fidelity: В черновике верно переданы повторяемость набегов, скот, шатры, сравнение с саранчой, бесчисленность людей и верблюдов и цель вторжения. Однако «туда» не имеет соответствия в еврейском тексте, а «эту землю» неоправданно усиливает указательность. Формулировка «они поднимались туда со своим скотом и шатрами» также слишком свободно перестраивает две еврейские группы («они и их скот»; «их шатры»), хотя смысл метонимии можно естественно передать по-русски.
  naturalness: Исправленный вариант сохраняет современный литературный русский и библейскую ясность. «Приходили со своим скотом и шатрами» естественно обозначает кочующее войско, не создавая неуклюжего буквального образа «шатры приходили».
  terminology: «Скот», «шатры», «верблюды», «саранча» и «разорять» точны в данном контексте. «Земля» сохранена без добавления «эта»; это оставляет исходную отсылку к земле Израиля в контексте, не добавляя её в сам стих.
