- from: Ведь они поднимались туда со своим скотом и шатрами, многочисленные, как саранча[a]; не было числа ни им, ни их верблюдам. Они приходили в эту землю, чтобы разорять её[b].
  to: Ведь они приходили со своим скотом и шатрами, многочисленные, как саранча[a]; и им, и их верблюдам не было числа. Они приходили в землю, чтобы разорять её[b].
  rationale: Убраны невыраженные в оригинале «туда» и «эту». «Приходили со своим скотом и шатрами» сохраняет повторяемый характер действий и естественно передаёт кочевой лагерь, не утверждая, будто именно шатры являются самостоятельным грамматическим субъектом русского предложения. Сохранены сравнение с саранчой, идиома отсутствия числа и значение שחת как разорения/опустошения.
