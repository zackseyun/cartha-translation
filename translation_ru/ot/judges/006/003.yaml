    rationale: זָרַע означает «сеять»; конкретный объект «поля» в стихе не назван. Русский глагол «сеять» здесь может употребляться без дополнения.
  - severity: medium
    issue: «Жители Востока» чрезмерно конкретизирует בְּנֵי־קֶדֶם.
    rationale: Выражение обозначает людей/народы восточных областей, а не просто население географического региона. «Народы Востока» передаёт его собирательный характер точнее.
  - severity: low
