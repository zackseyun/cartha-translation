  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
translation:
  language: ru
  text: И всякий раз, когда Израиль сеял, мадианитяне, амаликитяне и народы Востока шли войной против него[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте — «против него»: Израиль представлен как единый народ. По-русски возможно также: «против израильтян».'
    reason: Сохранено грамматическое единственное число еврейского текста при пояснении его собирательного значения.
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: И всякий раз, когда
  rationale: Сочетание вводит повторяющуюся ситуацию, а не единичное событие; эта формулировка естественно передаёт итеративное значение.
- source_word: זָרַע יִשְׂרָאֵל
  choice: Израиль засевал поля
  rationale: 'Глагол זרע означает «сеять». Добавление «поля» естественно для современного русского и не меняет смысла: речь идёт о сельскохозяйственном посеве.'
- source_word: מִדְיָן וַעֲמָלֵק
  choice: мадианитяне, амаликитяне
  rationale: В еврейском стоят названия Мадиан и Амалек, обозначающие здесь соответствующие народы; русские этнонимы яснее передают коллективный смысл.
- source_word: וּבְנֵי קֶדֶם
  choice: жители Востока
  rationale: Буквально «сыны востока»; современное выражение передаёт регионально-этническое обозначение без архаичной буквальности.
- source_word: וְעָלוּ עָלָיו
  choice: выступали против него
  rationale: עלה с על в данном военном контексте обозначает враждебное выступление. Единственное число местоимения сохранено, поскольку Израиль представлен как единый народ.
