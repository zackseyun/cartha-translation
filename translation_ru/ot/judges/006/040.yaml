translation_notes:
  register: Современный литературный русский язык. Формулировка сохраняет лаконичность еврейского повествования, но вместо буквального «была сухость на руне» использует естественное русское «руно осталось сухим». Двоеточие вводит итог совершённого Богом знамения; «а» ясно передаёт контраст двух его частей.
