  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
translation:
  language: ru
  text: 'И Бог сделал так в ту ночь: только руно было сухим, а на всей земле была роса.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а по всей земле была роса». Еврейское אֶרֶץ может означать «земля», «суша» или «страна»; здесь речь, вероятнее всего, идёт о земле вокруг руна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֱלֹהִים כֵּן
  choice: И Бог сделал так
  rationale: Сохраняет краткость повествования и обратную отсылку כֵּן к знамению, о котором просил Гедеон.
- source_word: בַּלַּיְלָה הַהוּא
  choice: в ту ночь
  rationale: Естественная русская передача определённого указания времени.
- source_word: חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: только руно осталось сухим
  rationale: Идиоматично передаёт номинальную конструкцию со значением сухости и подчёркивает, что она была ограничена одним руном.
- source_word: וְעַל כָּל הָאָרֶץ
  choice: а на всей земле
  rationale: В данном эпизоде אֶרֶץ означает окружающую поверхность земли; союз «а» естественно выражает явное противопоставление сухого руна и покрытой росой земли.
- source_word: טָל
  choice: роса
  rationale: Прямой и однозначный эквивалент ключевого элемента знамения.
