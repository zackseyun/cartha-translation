id: JDG.6.12
reference: Judges 6:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֵּרָ֥א אֵלָ֖י/ו מַלְּאַ֣ךְ יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלָ֔י/ו יְהוָ֥ה עִמְּ/ךָ֖ גִּבּ֥וֹר הֶ/חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
translation:
  language: ru
  text: 'Тогда явился ему ангел Яхве[a] и сказал ему: «Яхве с тобой, могучий воин[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестник Яхве». Еврейское слово может означать как «вестник», так и «ангел»; в этой сцене явления лучше подходит «ангел».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «могучий [человек] доблести (силы)». Возможный перевод: «доблестный воин».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: явился
  rationale: Нифаль глагола ראה в повествовании о небесном явлении естественно передаётся возвратным по смыслу русским глаголом «явился».
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאָךְ может означать «вестник» или «ангел»; в сцене видимого сверхъестественного явления наиболее естественно «ангел». Имя יהוה передано как «Яхве».
- source_word: וַיֹּאמֶר אֵלָיו
  choice: и сказал ему
  rationale: Сохранено местоимение исходного текста без добавления имени Гедеона.
- source_word: יְהוָה עִמְּךָ
  choice: Яхве с тобой
  rationale: Безглагольное предложение в контексте естественнее понимать как утверждение, а не как пожелание; русская конструкция сохраняет эту форму без добавления связки.
- source_word: גִּבּוֹר הֶחָיִל
  choice: могучий воин
  rationale: Выражение обозначает сильного, доблестного и способного к сражению человека; «могучий воин» современно и сохраняет военный смысл.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передача личного имени транслитерацией сохраняет отличие имени Бога от титула и соответствует непосредственно стоящему в еврейском тексте тетраграмматону.
- issue: Понимание выражения מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: вестник Яхве
  rationale: Перевод сохраняет еврейское выражение, не отождествляя этого ангела с какой-либо конкретной божественной личностью и не снимая богословского напряжения повествования.
- issue: Модальность יְהוָה עִמְּךָ
  choice: 'утверждение: «Яхве с тобой»'
  alternative: 'пожелание: «Да будет Яхве с тобой»'
  rationale: Ближайший контекст и форма обращения лучше поддерживают заверение в присутствии Яхве, хотя сама безглагольная конструкция допускает формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, торжественным повествовательным звучанием. Синтаксис краток и близок к еврейскому оригиналу; архаическое «муж сильный» не используется.
