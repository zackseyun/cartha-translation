source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו גִּדְעוֹן֙ בִּ֣י אֲדֹנִ֔/י וְ/יֵ֤שׁ יְהוָה֙ עִמָּ֔/נוּ וְ/לָ֥/מָּה מְצָאַ֖תְ/נוּ כָּל זֹ֑את וְ/אַיֵּ֣ה כָֽל נִפְלְאֹתָ֡י/ו אֲשֶׁר֩ סִפְּרוּ לָ֨/נוּ אֲבוֹתֵ֜י/נוּ לֵ/אמֹ֗ר הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ הֶעֱלָ֣/נוּ יְהוָ֔ה וְ/עַתָּה֙ נְטָשָׁ֣/נוּ יְהוָ֔ה וַֽ/יִּתְּנֵ֖/נוּ בְּ/כַף מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
translation:
  language: ru
  text: 'Гедеон сказал ему: «Прошу, господин мой![a] Если Яхве с нами, то почему всё это постигло нас? И где все Его чудесные деяния[b], о которых рассказывали нам наши отцы, говоря: „Разве не Яхве вывел нас из Египта?“ Но теперь Яхве оставил нас и отдал во власть Мадиана[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Прости меня, господин мой!» Еврейское выражение представляет собой вежливое обращение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Его чудеса», «Его дивные дела».'
    reason: lexical_alternative
  - marker: c
    text: 'Букв.: «в руку Мадиана» — то есть под власть мадианитян.'
    reason: idiom
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Позволь, господин мой!
  rationale: בִּי — вежливое вводное обращение со значением «прошу» или «позволь»; אֲדֹנִי здесь сохраняет почтительное обращение к собеседнику, не предрешая, что это божественный титул.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: וְיֵשׁ יְהוָה עִמָּנוּ
  choice: Если Яхве с нами
  rationale: 'Формально конструкция начинается союзом «и», однако последующий риторический вопрос показывает условно-аргументативный смысл: «если… то почему…».'
- source_word: לָמָּה מְצָאַתְנוּ כָּל זֹאת
  choice: то почему всё это постигло нас?
  rationale: מצא при бедствии как подлежащем означает «постичь, выпасть на долю»; выбран естественный русский оборот, сохраняющий образ пришедшего бедствия.
- source_word: נִפְלְאֹתָיו
  choice: Его чудесные деяния
  rationale: Существительное обозначает необычайные Божьи дела, вызывающие изумление; «чудесные деяния» не сужает смысл исключительно до нарушения естественного порядка.
- source_word: סִפְּרוּ לָנוּ אֲבוֹתֵינוּ
  choice: о которых рассказывали нам наши отцы
  rationale: Сохраняется конкретное «отцы» как носители предания Израиля, а глагол передан обычным русским «рассказывали».
- source_word: הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה
  choice: Разве не Яхве вывел нас из Египта?
  rationale: Вопросительная частица предполагает утвердительный ответ; «вывел из Египта» естественно обозначает исход.
- source_word: נְטָשָׁנוּ
  choice: оставил нас
  rationale: Передаёт обвинительную силу «покинул, бросил, оставил» современным литературным языком без излишне архаичного оттенка.
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  choice: отдал во власть Мадиана
  rationale: Идиома «дал в ладонь/руку» означает передачу под власть; в основном тексте смысл выражен ясно, а буквальный образ указан в сноске.
- source_word: מִדְיָן
  choice: Мадиан
  rationale: Традиционная и узнаваемая русская передача этнонима/названия народа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет собственное имя; транслитерация сохраняет это и не подменяет имя титулом.
- issue: Значение אֲדֹנִי в обращении Гедеона
  choice: почтительное «господин мой» со строчной буквы
  alternative: божественный титул «Господь»
  rationale: На этом этапе повествования форма допускает обычное уважительное обращение к собеседнику; перевод не должен преждевременно снимать повествовательную неоднозначность.
- issue: Характер слов Гедеона о присутствии Яхве
  choice: 'условный риторический протест: «Если Яхве с нами…»'
  alternative: буквально-соединительное «И Яхве с нами…»
  rationale: Связь с вопросом «почему» естественно выражает сомнение Гедеона в согласованности обещанного присутствия с переживаемым бедствием, а не отрицание силы Яхве как сформулированный догматический тезис.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Риторические вопросы и напряжение между исповедуемым присутствием Яхве и нынешним бедствием сохранены. Имя Яхве передано прямо; обращение к вестнику оставлено почтительным, но не превращено без достаточных оснований в явный божественный титул.
