  text: וַ/יִּ֤פֶן אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֗אמֶר לֵ֚ךְ בְּ/כֹחֲ/ךָ֣ זֶ֔ה וְ/הוֹשַׁעְתָּ֥ אֶת יִשְׂרָאֵ֖ל מִ/כַּ֣ף מִדְיָ֑ן הֲ/לֹ֖א שְׁלַחְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
translation:
  language: ru
  text: 'Тогда Яхве повернулся к нему и сказал: «Иди с этой твоей силой[a] и спаси Израиль из-под власти Мадиана[b]. Разве не Я послал тебя?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «в этой твоей силе». Еврейский предлог допускает инструментальное и локативное понимание, а слово «этой» придаёт выражению особое ударение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из руки Мадиана» — еврейский образ, означающий избавление от власти или господства Мадиана.'
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано транслитерацией личного имени Бога, непосредственно стоящего в еврейском тексте.
- source_word: וַיִּפֶן אֵלָיו
  choice: повернулся к нему
  rationale: Сохраняет обычное значение פנה и направленность, выраженную אֵלָיו, не сводя действие лишь к взгляду.
- source_word: לֵךְ
  choice: иди
  rationale: Прямой повелительный глагол естественно передаёт начало поручения.
- source_word: בְּכֹחֲךָ זֶה
  choice: с этой твоей силой
  rationale: Сохраняет указательное усиление זֶה и притяжательное значение суффикса; предлог «с» естественно выражает инструментальное понимание בְּ, а возможная неоднозначность отмечена в сноске.
- source_word: וְהוֹשַׁעְתָּ
  choice: и спаси
  rationale: Следующий за императивом перфект в данном поручении имеет побудительно-результативную силу; координация двух повелений естественна по-русски.
- source_word: מִכַּף מִדְיָן
  choice: из-под власти Мадиана
  rationale: Еврейская идиома «из руки» обозначает избавление от власти или контроля; смысл передан естественным современным русским выражением, а образ оригинала указан в сноске.
- source_word: הֲלֹא שְׁלַחְתִּיךָ
  choice: Разве не Я послал тебя?
  rationale: Риторический вопрос ожидает утвердительного ответа; логическое ударение на «Я» передаёт силу божественного поручения без добавления нового содержания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте употреблено личное имя יְהוָה; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Источник силы Гедеона в выражении בְּכֹחֲךָ זֶה
  choice: с этой твоей силой
  alternative: в этой твоей силе
  rationale: Формулировка сохраняет прямое обращение и указательность, не уточняя сверх текста, является ли сила уже присущей Гедеону, проявленной в его словах или даруемой через послание. Возможность локативного понимания предлога оставлена в сноске.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис прямой речи сделан естественным, имя Яхве сохранено, а непривычная русскому читателю идиома раскрыта в основном тексте и документирована сноской.
