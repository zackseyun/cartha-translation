  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
translation:
  language: ru
  text: Тогда все мадианитяне, амаликитяне и жители Востока[a] собрались вместе, перешли и разбили лагерь в Изреельской долине.
  philosophy: optimal-equivalence
  footnotes:
