    rationale: עבר не называет объект или вид препятствия. «Перешли» сохраняет эту недосказанность.
  - severity: low
    issue: «Расположились станом» стилистически архаично.
    rationale: «Разбили лагерь» естественно передаёт военное значение חנה в современном литературном русском.
