    text: 'Буквально: «сыны Востока» — устойчивое обозначение восточных племён и народов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  choice: и весь Мадиан
  rationale: Сохраняется коллективное употребление этнонима и близкая к еврейскому тексту форма; «весь Мадиан» в контексте обозначает мадианитян как собравшуюся силу.
- source_word: וַ/עֲמָלֵק
  choice: и Амалик
  rationale: Этноним передан в традиционной русской форме как коллективное обозначение амаликитян, без поясняющего расширения в основном тексте.
- source_word: וּ/בְנֵי קֶדֶם
  choice: и народы Востока[a]
  rationale: Буквально «сыны востока»; выражение идиоматически обозначает восточные племена или народы. Выбран естественный современный русский эквивалент, а буквальная форма отмечена в сноске.
- source_word: נֶאֶסְפוּ יַחְדָּו
  choice: собрались вместе
  rationale: Форма нифаль глагола אסף здесь выражает собирание или объединение, а יחדו — совместность; русский возвратный глагол естественно передаёт этот смысл.
- source_word: וַ/יַּעַבְרוּ
  choice: переправились
  rationale: Глагол עבר означает переход или переправу; объект перехода в еврейском тексте не назван, поэтому и в переводе он не уточняется.
- source_word: וַֽ/יַּחֲנוּ
  choice: расположились станом
  rationale: חנה в военном повествовании означает разбить лагерь. Выражение «расположились станом» сохраняет повествовательную торжественность и ясно указывает на военный лагерь.
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  choice: в Изреельской долине
  rationale: עמק означает долину или равнину; «Изреельская долина» — естественное русское географическое наименование.
