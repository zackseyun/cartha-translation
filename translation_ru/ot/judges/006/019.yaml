base_translation:
  language: en
  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
translation:
  language: ru
  text: Гедеон вошёл и приготовил козлёнка и пресные хлебы из ефы муки[a]. Мясо он положил в корзину, а бульон налил в горшок. Затем вынес всё это к нему под теревинф и поставил перед ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ефа — древняя мера сыпучих продуктов, приблизительно 22 литра.
    reason: historical_measure
  - marker: b
    text: 'Или: «поднёс ему». Еврейский глагол означает «приблизить, поднести, представить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: вошёл
  rationale: В контексте Гедеон удаляется к месту приготовления пищи; «вошёл» естественно передаёт это движение, не добавляя прямо не названного жилища.
- source_word: וַיַּעַשׂ
  choice: приготовил
  rationale: В контексте пищи это естественный русский эквивалент широкого по значению глагола «делать».
- source_word: גְּדִי עִזִּים
  choice: козлёнка
  rationale: Сочетание обозначает детёныша козы; по-русски достаточно точного и естественного слова «козлёнок».
- source_word: אֵיפַת קֶמַח
  choice: из ефы муки
  rationale: Сохранена конкретная древняя мера объёма; родительный оборот естественно связывает количество муки с приготовленными хлебами.
- source_word: מַצּוֹת
  choice: пресные хлебы
  rationale: Передаёт хлеб без закваски и сохраняет множественное число еврейского текста.
- source_word: הַבָּשָׂר
  choice: мясо
  rationale: Естественный русский эквивалент в пищевом контексте.
- source_word: סַּל
  choice: корзина
  rationale: Обычное обозначение переносной плетёной ёмкости.
- source_word: הַמָּרַק
  choice: бульон
  rationale: Слово обозначает отвар или жидкость от приготовления мяса; «бульон» ясно и естественно в данном контексте.
- source_word: פָּרוּר
  choice: горшок
  rationale: Подходящее общее название сосуда для приготовления или хранения жидкости без излишней конкретизации.
- source_word: וַיּוֹצֵא אֵלָיו
  choice: вынес всё это к нему
  rationale: Еврейский глагол стоит в единственном числе и допускает собирательный объект; «всё это» естественно охватывает мясо и бульон.
- source_word: תַּחַת הָאֵלָה
  choice: под теревинф
  rationale: אֵלָה, вероятнее всего, обозначает теревинф, хотя традиционно его иногда передают как дуб.
- source_word: וַיַּגַּשׁ
  choice: поставил перед ним
  rationale: Контекстуально передаёт действие «поднести, приблизить, представить» как подачу приготовленной пищи, не превращая его явно в жертвоприношение.
theological_decisions:
- issue: Возможный жертвенный оттенок поступка Гедеона
  choice: 'нейтральное описание подачи пищи: «поставил перед ним»'
  alternative: «принёс в жертву» или «предложил как жертву»
  rationale: В этом стихе говорится о приготовлении, вынесении и поднесении пищи. Жертвенные оттенки возникают далее, но здесь они не выражены прямо, поэтому перевод сохраняет повествовательную и богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис упрощён для ясности, но конкретные реалии исходного текста — ефа и теревинф — сохранены. Маркер [a] относится к ефе, [b] — к заключительному глаголу.
