  yaml_path: translation/ot/judges/006/016.yaml
  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
translation:
  language: ru
  text: 'И сказал ему Яхве: «Я непременно буду с тобой, и ты поразишь Мадиан, как одного человека[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно одного человека». Еврейский оборот представляет весь Мадиан как одного противника и подчёркивает решительность или лёгкость победы над ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом «Господь».
- source_word: וַיֹּאמֶר אֵלָיו
  choice: И сказал ему
  rationale: Сохраняет последовательное развитие еврейского повествования и естественно звучит по-русски.
- source_word: כִּי אֶהְיֶה עִמָּךְ
  choice: Я непременно буду с тобой
  rationale: Имперфект אֶהְיֶה в данном контексте выражает обещание, а כִּי придаёт заверительный оттенок. «Непременно» естественно передаёт эту уверенность, не вводя явно причинного отношения.
- source_word: וְהִכִּיתָ
  choice: и ты поразишь
  rationale: Форма имеет здесь будущее результативное значение; «поразишь» близко передаёт נכה и не сужает смысл до одного лишь военного разгрома.
- source_word: אֶת מִדְיָן
  choice: Мадиан
  rationale: Сохранено название «Мадиан», которое в еврейском тексте обозначает народ как единое целое.
- source_word: כְּאִישׁ אֶחָד
  choice: как одного человека
  rationale: 'Буквально сохраняет образ одного мужчины/человека и допускает естественное для контекста понимание: весь Мадиан будет поражён так, словно речь идёт об одном противнике.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация сохраняет личное имя, не подменяя его титулом.
- issue: Значение оборота כְּאִישׁ אֶחָד
  choice: как одного человека
  alternative: словно одного человека; как одного мужа; как один человек
  rationale: 'Формулировка сохраняет сравнение и его смысловую напряжённость: Мадиан как целое будет поражён подобно одному противнику. Перевод не уточняет сверх текста, подразумевается ли прежде всего лёгкость, решительность или цельность поражения.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прост и понятен; личное имя «Яхве» и образность исходного текста сохранены.
