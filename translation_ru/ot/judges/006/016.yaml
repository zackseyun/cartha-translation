  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: повествовательное «И сказал ему», личное имя «Яхве», заверение о присутствии, будущее следствие «ты поразишь» и коллективное «Мадиан». «Я непременно буду с тобой» уместно передаёт заверительно-обещательный характер כִּי אֶהְיֶה עִמָּךְ. Оборот «как одного человека» сохраняет образ и синтаксическую неоднозначность כְּאִישׁ אֶחָד, не сводя его к одному истолкованию.'
