base_translation:
  language: en
  yaml_path: translation/ot/judges/006/032.yaml
  text: So on that day he called him Jerubbaal[a], saying, “Let Baal contend against him[b], because he tore down his altar.”
translation:
  language: ru
  text: 'И в тот день он назвал его Иероваалом[a], сказав: «Пусть Ваал вступит с ним в спор[b], потому что он разрушил его жертвенник».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Имя «Иероваал» созвучно еврейскому глаголу со значением «вступать в спор, состязаться»; далее оно объясняется словами: «Пусть Ваал вступит с ним в спор».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Да вступит Ваал с ним в спор». Еврейскую форму можно понять как пожелание или побуждение; возможно также изъявительное прочтение: «Ваал вступит с ним в спор».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: он назвал его
  rationale: Конструкция קרא с ל и местоименным суффиксом означает назвать или дать имя; единственное число субъекта сохранено без уточнения его личности.
- source_word: בַיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямое и естественное соответствие еврейскому обстоятельству времени с предлогом ב.
- source_word: יְרֻבַּעַל
  choice: Иероваал
  rationale: Имя передано в принятой русской библейской форме; следующая фраза раскрывает заложенную в нём игру со значением глагола ריב.
- source_word: לֵאמֹר
  choice: сказав
  rationale: Естественно вводит последующее объяснение имени и сохраняет повествовательную конструкцию оригинала.
- source_word: יָרֶב בּוֹ הַבַּעַל
  choice: Пусть Ваал вступит с ним в спор
  rationale: Форма יָרֶב допускает юссивное понимание; выражение «вступит с ним в спор» передаёт широкий состязательный и судебный оттенок ריב и связь с именем Иероваал.
- source_word: כִּי
  choice: потому что
  rationale: Ясно вводит основание для данного имени и произнесённых слов.
- source_word: נָתַץ
  choice: разрушил
  rationale: Глагол обозначает разрушение или снос сооружения, в данном случае жертвенника.
- source_word: אֶת מִזְבְּחוֹ
  choice: его жертвенник
  rationale: Сохранено местоимение оригинала; ближайший и естественный референт — Ваал.
theological_decisions:
- issue: Передача בַּעַל в полемическом контексте
  choice: Ваал
  alternative: господин
  rationale: Здесь это имя или титул ханаанского божества, а не нарицательное «господин»; транслитерация сохраняет смысл полемики и не смешивает Ваала с Господом.
- issue: Модальность יָרֶב
  choice: Пусть Ваал вступит с ним в спор
  alternative: Ваал вступит с ним в спор
  rationale: Юссивное прочтение хорошо соответствует контексту вызова, однако форма допускает также изъявительное понимание; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис остаётся близким к еврейскому повествованию, но выражение ריב передано естественно для современного читателя; игра слов поясняется сноской.
