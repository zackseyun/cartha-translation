base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
translation:
  language: ru
  text: 'И люди говорили друг другу: «Кто сделал это?» Они расспрашивали и искали, а затем сказали: «Это сделал Гедеон, сын Иоаса».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: друг другу
  rationale: Естественно передаёт взаимное обсуждение, выраженное еврейской идиомой «человек — своему ближнему», не предполагая, что речь обязательно идёт о близких друзьях.
- source_word: מִי
  choice: кто
  rationale: Прямое соответствие вопросительному местоимению, обозначающему деятеля.
- source_word: עָשָׂה
  choice: сделал
  rationale: Передаёт завершённое действие; в русском контексте естественно сочетается с местоимением «это».
- source_word: הַדָּבָר הַזֶּה
  choice: это
  rationale: В данном контексте דָּבָר обозначает обнаруженный поступок. Русское «это» звучит естественно и сохраняет широту значения, не усиливая оценку словами «злодеяние» или «преступление».
- source_word: וַיִּדְרְשׁוּ
  choice: расспрашивали
  rationale: Передаёт выяснение обстоятельств посредством inquiries и сохраняет отличие от следующего глагола поиска.
- source_word: וַיְבַקְשׁוּ
  choice: разыскивали
  rationale: Отражает активный поиск виновного после расспросов и сохраняет последовательность двух еврейских глаголов.
- source_word: גִּדְעוֹן בֶּן־יוֹאָשׁ
  choice: Гедеон, сын Иоаса
  rationale: Использованы укоренившиеся в русской библейской традиции формы имён; патроним передан ясно и без добавления смысла.
- source_word: וַיֹּאמְרוּ
  choice: сказали
  rationale: Сохраняет нейтральное значение повествовательного глагола, не превращая сообщение в явно сформулированный вывод.
