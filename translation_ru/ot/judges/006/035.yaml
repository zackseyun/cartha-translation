  text: וּ/מַלְאָכִים֙ שָׁלַ֣ח בְּ/כָל מְנַשֶּׁ֔ה וַ/יִזָּעֵ֥ק גַּם ה֖וּא אַחֲרָ֑י/ו וּ/מַלְאָכִ֣ים שָׁלַ֗ח בְּ/אָשֵׁ֤ר וּ/בִ/זְבֻלוּן֙ וּ/בְ/נַפְתָּלִ֔י וַֽ/יַּעֲל֖וּ לִ/קְרָאתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
translation:
  language: ru
  text: Он разослал вестников по всему колену Манассии, и оно тоже было созвано вслед за ним. Он также послал вестников по землям Асира, Завулона и Неффалима, и они поднялись им навстречу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Множественное местоимение «им» не имеет в еврейском тексте прямо названного антецедента. Вероятно, речь идёт о вражеских силах; возможно также, что имеются в виду Гедеон и собравшиеся у него люди.
    reason: Суффикс в еврейском тексте стоит во множественном числе, но его антецедент прямо не указан.
lexical_decisions:
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В военном контексте речь идёт о людях, передающих призыв к сбору, а не об ангелах.
- source_word: בְּכָל מְנַשֶּׁה
  choice: по всей земле колена Манассии
  rationale: Предлог и выражение «весь Манассия» указывают на распространение призыва по всей области или племенному объединению; перевод делает этот смысл естественным по-русски.
- source_word: וַיִּזָּעֵק
  choice: было созвано
  rationale: 'Форма нифаль имеет здесь пассивное военное значение: колено было призвано к сбору. Формулировка сохраняет пассивность исходного текста.'
- source_word: אַחֲרָיו
  choice: идти за ним
  rationale: Оборот означает присоединение к Гедеону и следование за ним; русский инфинитив ясно передаёт цель созыва.
- source_word: בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי
  choice: по землям Асира, Завулона и Неффалима
  rationale: Повторяющийся предлог естественно указывает на области этих колен, по которым были разосланы вестники.
- source_word: וַיַּעֲלוּ
  choice: поднялись
  rationale: Сохранено буквальное пространственное и возможное военное значение глагола «подниматься, выступать».
- source_word: לִקְרָאתָם
  choice: им навстречу
  rationale: Сохранён множественный суффикс еврейского текста и не назван явно неуказанный антецедент.
theological_decisions:
- issue: К кому относится множественное местоимение в לִקְרָאתָם
  choice: Оставить в основном тексте неоднозначное «им навстречу»; вероятнее всего, речь о вражеских силах.
  alternative: Речь может идти о Гедеоне вместе с уже собравшимися у него людьми.
  rationale: Еврейский суффикс имеет множественное число, но его антецедент прямо не назван. Контекст допускает вражеские войска как наиболее вероятный референт, однако неоднозначность не следует устранять.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Традиционные русские формы названий колен сохранены; синтаксис сделан понятным без устранения неоднозначности оригинала.
