base_translation:
  language: en
  yaml_path: translation/ot/judges/006/025.yaml
  text: And it happened that night that Yahweh said to him[a], “Take your father’s bull and the second bull, seven years old, and tear down the altar of Baal that belongs to your father[b], and cut down the Asherah that is upon it.”
translation:
  language: ru
  text: 'В ту ночь Яхве сказал ему: «Возьми быка твоего отца и второго быка, семилетнего; разрушь жертвенник Ваала, принадлежащий твоему отцу, и сруби ашеру[a], которая на нём[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «столб Ашеры» либо «священный столб». Еврейское слово может обозначать культовый предмет, связанный с богиней Ашерой.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «которая на нём». Выражение может означать, что ашера находилась на жертвеннике, над ним или в непосредственной связи с ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: И было в ту ночь
  rationale: Сохраняет повествовательный переход и временное указание еврейского текста, не прибегая к архаичному обороту «и случилось».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога принятой в современном русском языке транслитерацией.
- source_word: קַח
  choice: возьми
  rationale: Прямо и естественно передаёт повелительное наклонение.
- source_word: פַּר הַשּׁוֹר אֲשֶׁר לְאָבִיךָ
  choice: быка твоего отца
  rationale: Естественно передаёт принадлежность животного отцу Гедеона, не воспроизводя неясную для русского читателя конструкцию буквально как «быка из крупного скота».
- source_word: וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים
  choice: и второго быка, семилетнего
  rationale: Союз указывает на ещё одного быка; возрастное определение грамматически относится ко второму быку.
- source_word: וְהָרַסְתָּ
  choice: разрушь
  rationale: Выражает полное уничтожение сооружения и естественно сочетается со словом «жертвенник».
- source_word: מִזְבַּח הַבַּעַל
  choice: жертвенник Ваала
  rationale: Точно и традиционно передаёт сочетание со значением принадлежности или посвящения Ваалу.
- source_word: הָאֲשֵׁרָה
  choice: ашеру
  rationale: 'Транслитерация сохраняет неоднозначность: слово может обозначать культовый предмет, связанный с богиней Ашерой, а не обязательно только деревянный столб.'
- source_word: אֲשֶׁר עָלָיו
  choice: которая на нём
  rationale: Близко передаёт пространственное עַל, не уточняя без достаточных оснований, стояла ли ашера непосредственно на жертвеннике, над ним или была тесно с ним связана.
- source_word: תִּכְרֹת
  choice: сруби
  rationale: Обычный русский глагол для отсечения или поваления деревянного культового предмета.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет в основном тексте личное имя, присутствующее в еврейском источнике, не заменяя его титулом.
- issue: Значение הָאֲשֵׁרָה
  choice: ашера
  alternative: столб Ашеры; священный столб
  rationale: Такой выбор не разрешает спорный вопрос о том, обозначает ли слово богиню, её культовый символ или конкретный деревянный предмет; необходимые пояснения вынесены в сноску.
- issue: Пространственное отношение ашеры к жертвеннику
  choice: которая на нём
  alternative: которая над ним; которая рядом с ним
  rationale: Основной текст следует обычному значению עַל, а сноска сохраняет реальную пространственную неоднозначность выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка формален, но понятен обычному читателю; архаизмы и конфессионально маркированные замены исключены.
