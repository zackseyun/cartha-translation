  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: ru
  text: 'Он сказал ему: «Если я обрёл благоволение в твоих глазах, дай мне знак, что ты говоришь со мной».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: я обрёл благоволение в Твоих глазах
  rationale: Сохраняет образность и смысл устойчивого древнееврейского выражения, оставаясь понятным в современном литературном русском.
- source_word: וְעָשִׂיתָ לִּי אוֹת
  choice: дай мне знак
  rationale: Естественно передаёт просьбу совершить или предоставить подтверждающий знак; соответствует контексту и не конкретизирует природу знака.
- source_word: שָׁאַתָּה מְדַבֵּר עִמִּי
  choice: что это Ты говоришь со мной
  rationale: Сохраняет эмфатическое אַתָּה и передаёт просьбу подтвердить личность говорящего, не сводя её лишь к истинности сообщения.
theological_decisions:
- issue: Личность собеседника Гедеона
  choice: Местоимение «Ты» передано с прописной буквы как уважительное обращение к божественному собеседнику в данном повествовательном контексте.
  alternative: Строчное «ты», сохраняющее обычную древнееврейскую графику без интерпретирующей капитализации.
  rationale: Контекст отрывка отождествляет собеседника с Господом, однако перевод не добавляет здесь титул и сохраняет формулировку исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис краткий и естественный; подлинная направленность просьбы — знак, подтверждающий личность говорящего, — сохранена.
