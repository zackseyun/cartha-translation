base_translation:
  language: en
  yaml_path: translation/ot/judges/006/026.yaml
  text: Then build an altar to Yahweh your God on the top of this stronghold[a], in orderly arrangement, and take the second bull and offer it up as a burnt offering with the wood of the Asherah that you cut down.
translation:
  language: ru
  text: И воздвигни жертвенник для Яхве, твоего Бога, на вершине этой твердыни в надлежащем порядке[a]. Затем возьми второго быка и принеси его во всесожжение на дровах ашеры, которую срубишь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в упорядоченном расположении». Еврейское выражение указывает на упорядоченное устройство или расположение, но не уточняет, что именно следовало расположить.'
    reason: лексическая неоднозначность
  - marker: b
    text: Ашера — культовый деревянный объект, связанный с ханаанской богиней Ашерой; возможно, священный столб или дерево. Его точная форма неизвестна.
    reason: историко-лексическое пояснение
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: И воздвигни
  rationale: Перфект 2-го лица единственного числа с союзом продолжает последовательность повелений; русское повелительное наклонение естественно передаёт его предписывающую силу. «Воздвигни» соответствует возвышенному, но понятному регистру речи о жертвеннике.
- source_word: מִזְבֵּחַ לַיהוָה אֱלֹהֶיךָ
  choice: жертвенник Яхве, твоему Богу
  rationale: ל обозначает посвящение или адресата. Личное имя יהוה передано как «Яхве», а אֱלֹהֶיךָ сохранено явно. Приложение «твоему Богу» согласуется по смыслу с дательным отношением и звучит естественно по-русски.
- source_word: עַל רֹאשׁ הַמָּעוֹז הַזֶּה
  choice: на вершине этой твердыни
  rationale: רֹאשׁ здесь означает верх или вершину, а מָעוֹז — укреплённое, защищённое место. «Твердыня» сохраняет пространственный образ и достойный библейский регистр, не уточняя, что это именно крепость.
- source_word: בַּמַּעֲרָכָה
  choice: уложив всё по порядку
  rationale: מַעֲרָכָה обозначает расположение или упорядоченную укладку. Формулировка передаёт конкретный оттенок приготовления и порядка, но не утверждает сверх текста, шла ли речь именно о камнях или иной части устройства.
- source_word: וְלָקַחְתָּ אֶת־הַפָּר הַשֵּׁנִי
  choice: Затем возьми второго быка
  rationale: Последовательная форма продолжает ряд предписаний. הַפָּר — «бык», а הַשֵּׁנִי буквально «второй»; определение сохранено без попытки объяснить его внутри стиха.
- source_word: וְהַעֲלִיתָ עוֹלָה
  choice: и принеси его во всесожжение
  rationale: Каузатив עלה с עֹלָה является устойчивым жертвенным выражением. «Принести во всесожжение» точно и естественно передаёт полное сожжение жертвы.
- source_word: בַּעֲצֵי הָאֲשֵׁרָה
  choice: на дровах ашеры
  rationale: עֵצִים в данном жертвенном контексте естественно означает топливо, дрова. אֲשֵׁרָה оставлено как название культового деревянного объекта, поскольку его точная форма спорна.
- source_word: אֲשֶׁר תִּכְרֹת
  choice: которую срубишь
  rationale: Относительное предложение относится к ашере; имперфект в предписывающем контексте передан будущим совершенного вида.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо стоит тетраграмматон. «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Значение אֲשֵׁרָה
  choice: ашера
  alternative: столб Ашеры; деревянное изображение Ашеры; священное дерево
  rationale: Слово может обозначать культовый деревянный объект, связанный с богиней Ашерой, но его точный вид неясен. Транслитерация сохраняет эту неоднозначность, а примечание поясняет возможный смысл.
- issue: Конкретный смысл בַּמַּעֲרָכָה
  choice: уложив всё по порядку
  alternative: в надлежащем порядке; на уложенных камнях
  rationale: Еврейское существительное выражает упорядоченное расположение, однако не называет прямо материал или элементы конструкции. Перевод сохраняет идею порядка, не вводя камни в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Повеления переданы прямо и ясно; сохранены личное имя Яхве, технический термин «всесожжение» и неоднозначность слов בַּמַּעֲרָכָה и אֲשֵׁרָה.
