  yaml_path: translation/ot/judges/013/018.yaml
  text: And the angel of Yahweh said to him[a], “Why do you ask my name, seeing it is wonderful?”
translation:
  language: ru
  text: 'И ангел Яхве сказал ему: «Зачем ты спрашиваешь моё имя, ведь оно чудесно[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дивно», «непостижимо», «необычайно»; возможно также: «сокрыто». Еврейское слово указывает на нечто чудесное или настолько необыкновенное, что его невозможно постичь до конца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может означать «посланник» или «ангел»; в данном повествовании речь идёт о сверхъестественном посланнике, поэтому «ангел» естественно передаёт смысл. Личное имя יְהוָה передано транслитерацией «Яхве».
- source_word: לָמָּה זֶּה
  choice: зачем
  rationale: Сочетание вводит риторический вопрос о цели действия. Русское «зачем» здесь естественнее буквального и тяжеловесного «почему это».
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: ты спрашиваешь моё имя
  rationale: Глагол שׁאל с לִשְׁמִי означает спрашивать или допытываться об имени; выбранная формулировка сохраняет прямоту еврейского текста.
- source_word: וְהוּא
  choice: Оно
  rationale: Местоимение относится к имени; разделение на два русских предложения ясно передаёт пояснительную связь без неестественного буквального «и оно».
- source_word: פֶלִאי
  choice: дивно
  rationale: Слово обозначает нечто необычайное, чудесное и превосходящее обычное человеческое понимание. «Дивно» сохраняет эту смысловую широту и возвышенное библейское звучание, не сводя значение только к непостижимости или тайне.
theological_decisions:
- issue: Возможный теофанический или христологический смысл слова פֶלִאי
  choice: Передать слово лексически как «дивно», не превращая его в титул и не уточняя личность ангела в самом переводе.
  alternative: 'Перевести более истолковательно: «оно непостижимо» либо оформить слово как особый титул.'
  rationale: Контекст допускает богословские выводы о личности ангела Яхве, однако еврейский текст не формулирует их прямо. Перевод сохраняет заложенное в нём напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Дивно» выбрано как краткое и ёмкое соответствие, а более разъясняющие варианты вынесены в сноску.
