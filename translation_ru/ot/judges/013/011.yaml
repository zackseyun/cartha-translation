base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
translation:
  language: ru
  text: 'Маной встал, пошёл вслед за своей женой[a] и, подойдя к тому человеку, спросил его: «Ты ли тот человек, который говорил с этой женщиной[b]?» Он ответил: «Я»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за своей женой»; возможно также: «пошёл за своей женой».'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском: «к женщине», а не «к моей жене».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Это я».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: встал, пошёл
  rationale: Сохраняет последовательность повествовательных форм и передаёт קום и הלך естественными современными русскими глаголами, не уточняя способ передвижения.
- source_word: אַחֲרֵי אִשְׁתּוֹ
  choice: вслед за своей женой
  rationale: Передаёт буквальное пространственно-направительное значение אַחֲרֵי и при этом звучит естественно по-русски; возможный оттенок следования сохранён в сноске.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: подойдя к тому человеку
  rationale: В данном контексте בוא אֶל обозначает приближение к человеку. Указательное «тому» естественно отсылает к уже упомянутому посетителю, не меняя его идентификации.
- source_word: הָאִישׁ
  choice: человек
  rationale: Сохраняет поверхностное обозначение посетителя в этом стихе и не подменяет его преждевременно словом «ангел» или «вестник».
- source_word: הַאַתָּה הָאִישׁ
  choice: Ты ли тот человек
  rationale: Русская частица «ли» естественно передаёт прямой вопрос с הֲ, а «тот человек» вводит определительную конструкцию без добавочного усиления.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  choice: который говорил с этой женщиной
  rationale: «Говорил с» — естественное русское соответствие речи, обращённой к человеку; «эта женщина» сохраняет הָאִשָּׁה, не заменяя его контекстуальным «моя жена».
- source_word: אָנִי
  choice: Я
  rationale: Еврейский ответ буквально состоит из местоимения «я». В русском краткое «Я» возможно как утвердительное самоотождествление и сохраняет лаконичность оригинала.
theological_decisions:
- issue: Идентичность посетителя
  choice: «человек», а не «ангел»
  alternative: «ангел» или «вестник»
  rationale: Хотя более широкий контекст раскрывает посетителя как ангела Господня, здесь употреблено обычное אִישׁ. Перевод сохраняет постепенное раскрытие его личности.
- issue: Краткий ответ אָנִי
  choice: «Я»
  alternative: «Да, я» или «Это я»
  rationale: Лаконичный ответ не превращён в формулу с возможными дополнительными богословскими ассоциациями; сохранено простое самоотождествление в ответ на вопрос Маноя.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Последовательность действий передана плавно, без избыточного повторения союза «и». Обозначение посетителя и краткость его ответа сохранены максимально близко к еврейскому тексту.
