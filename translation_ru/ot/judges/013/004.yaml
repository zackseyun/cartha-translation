  text: וְ/עַתָּה֙ הִשָּׁ֣מְרִי נָ֔א וְ/אַל תִּשְׁתִּ֖י יַ֣יִן וְ/שֵׁכָ֑ר וְ/אַל תֹּאכְלִ֖י כָּל טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/004.yaml
  text: Now please be careful[a], and do not drink wine or strong drink[c][b], and do not eat anything unclean.
translation:
  language: ru
  text: 'А теперь, пожалуйста, будь осторожна: не пей ни вина, ни хмельного напитка[a] и не ешь ничего нечистого.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Хмельной напиток» — опьяняющий напиток, отличный от вина.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Дискурсивно-временной переход к наставлению. «Итак» естественно связывает повеление с предшествующим возвещением; возможно также более буквальное «А теперь».
- source_word: הִשָּׁמְרִי נָא
  choice: прошу тебя, будь осторожна
  rationale: Возвратная форма глагола שׁמר призывает женщину беречься и соблюдать осторожность; נָא передаёт смягчённую настойчивую просьбу. Женский род сохранён.
- source_word: וְאַל תִּשְׁתִּי
  choice: не пей
  rationale: Естественное русское запрещение, обращённое к женщине.
- source_word: יַיִן
  choice: вино
  rationale: Прямой и общепринятый эквивалент.
- source_word: וְשֵׁכָר
  choice: хмельной напиток
  rationale: שֵׁכָר обозначает опьяняющий напиток, отличный от вина. Этот вариант шире, чем «пиво», и естественнее в современном русском, чем «крепкий напиток», поскольку речь не обязательно идёт о напитке высокой крепости.
- source_word: וְאַל תֹּאכְלִי
  choice: и не ешь
  rationale: Сохраняет координацию второго запрета с первым.
- source_word: כָּל טָמֵא
  choice: ничего нечистого
  rationale: Передаёт субстантивированное прилагательное с כָּל как запрет есть что-либо ритуально нечистое, не сужая значение до гигиенической или нравственной нечистоты.
theological_decisions:
- issue: Характер нечистоты в выражении כָּל טָמֵא
  choice: нечистого
  alternative: осквернённого / ритуально нечистого
  rationale: «Нечистого» сохраняет установленную в Пятикнижии категорию ритуальной нечистоты и не добавляет в основной текст пояснение, отсутствующее в еврейском.
- issue: Связь наставления с назорейством
  choice: Не называть ограничения назорейскими в основном тексте
  alternative: Добавить пояснение о назорейском обете
  rationale: Контекст далее раскрывает особое посвящение ребёнка, но данный стих сам не употребляет термин «назорей»; перевод не должен преждевременно уточнять смысл.
translation_notes:
  register: Современный литературный русский, понятный широкому читателю. Формулировка сохраняет уважительную настойчивость נָא, женский адресат и ритуальный смысл «нечистого». Двоеточие естественно вводит содержание требуемой осторожности, не меняя последовательности запретов.
