base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
translation:
  language: ru
  text: 'Он сказал мне: «Вот, ты забеременеешь и родишь сына.[a] Теперь же не пей вина и опьяняющих напитков[b] и не ешь ничего нечистого, потому что мальчик будет назореем Божьим[c] с материнской утробы до дня своей смерти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Вот, ты беременна и родишь сына»; по контексту эти слова можно понимать как возвещение предстоящего зачатия.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово обозначает опьяняющий напиток помимо вина; оно не обязательно указывает на крепкий напиток в современном смысле.
    reason: lexical_scope
  - marker: c
    text: Назорей — человек, особо посвящённый Богу; это техническое обозначение особого статуса посвящения.
    reason: technical_term
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Он сказал мне
  rationale: Прямо передаёт глагол с косвенным дополнением. Начальное וַ связывает фразу с продолжающимся рассказом женщины; в русском связность достаточно выражена контекстом без обязательного «и».
- source_word: הִנָּךְ הָרָה וְיֹלַדְתְּ בֵּן
  choice: Вот, ты забеременеешь и родишь сына
  rationale: Форма הָרָה буквально допускает состояние «беременна», однако в контексте возвещения естественно выражает предстоящее зачатие. Будущее время даёт ясный современный русский текст, а буквальная возможность отмечена в сноске.
- source_word: וְעַתָּה
  choice: Поэтому отныне
  rationale: Передаёт как переход к следующему наставлению, так и его немедленное действие. «Поэтому» естественно связывает запрет с предстоящим рождением особого ребёнка.
- source_word: יַיִן וְשֵׁכָר
  choice: вина и крепких напитков
  rationale: יַיִן — вино, а שֵׁכָר — иной опьяняющий напиток. Устойчивое русское «крепкие напитки» понятно читателю, хотя не обязательно указывает на современный дистиллированный алкоголь; объём термина уточнён в сноске.
- source_word: כָּל טֻמְאָה
  choice: ничего нечистого
  rationale: В данном запрете абстрактное существительное טֻמְאָה обозначает всё ритуально нечистое, употребляемое в пищу. Русская конструкция естественна и сохраняет категорию нечистоты.
- source_word: נְזִיר אֱלֹהִים
  choice: назореем Божьим
  rationale: Сохранён технический термин для человека, особо посвящённого Богу. Определение «Божий» кратко и формально передаёт отношение к אֱלֹהִים, не сводя назорейство к общей благочестивости.
- source_word: מִן הַבֶּטֶן
  choice: с материнской утробы
  rationale: Сохраняет образ и исходную временную точку еврейского выражения, не заменяя его более узким толкованием «с рождения».
- source_word: עַד יוֹם מוֹתוֹ
  choice: до дня своей смерти
  rationale: Близко следует форме оригинала и ясно указывает на пожизненную продолжительность назорейства.
theological_decisions:
- issue: Обозначение особого посвящения ребёнка
  choice: назореем Божьим
  alternative: посвящённым Богу
  rationale: נְזִיר — специальное обозначение назорея, связанное с определённым статусом посвящения. Транслитерированный традиционный термин сохраняет правовой и повествовательный фон, а сноска делает его доступным современному читателю.
- issue: Временной смысл возвещения о беременности
  choice: ты забеременеешь и родишь сына
  alternative: ты беременна и родишь сына
  rationale: Грамматическая форма допускает буквальное настоящее состояние, но повествовательный контекст поддерживает предсказание будущего зачатия. Основной текст передаёт контекстуальный смысл, не скрывая формальную неоднозначность благодаря сноске.
- issue: Начало назорейского статуса
  choice: с материнской утробы
  alternative: с рождения
  rationale: Оригинал помещает начало посвящения уже во чреве, что согласуется с предписаниями матери. Вариант «с рождения» мог бы неоправданно сузить временной смысл.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Устаревшие «се», «сикера» и тяжеловесное «от чрева» не использованы; технический термин «назорей» сохранён и пояснён. Синтаксис прямой речи сделан естественным для устного пересказа, при этом сохранены причинная связь, последовательность запретов и пожизненный предел посвящения.
