  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד פְּלִשְׁתִּ֖ים אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
translation:
  language: ru
  text: И снова сыны Израиля стали делать зло в глазах Яхве[a], и Яхве отдал их в руки филистимлян на сорок лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Сыны Израиля» — традиционное корпоративное обозначение всего народа Израиля; также можно перевести: «израильтяне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: И снова ... стали делать
  rationale: Конструкция יסף с инфинитивом указывает на повторение прежнего действия; по-русски оборот «снова стали делать» естественно передаёт очередное возвращение Израиля ко злу.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранён образный корпоративный оборот еврейского текста. Здесь он обозначает весь народ Израиля, а не только мужчин.
- source_word: לַעֲשׂוֹת הָרַע
  choice: делать зло
  rationale: Краткое и естественное русское соответствие устойчивой формуле книги Судей; определённый артикль не требует искусственного «то зло».
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: 'Сохранена прозрачная еврейская метафора оценки: зло с точки зрения Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное заветное имя передано распространённой русской транслитерацией, а не заменено титулом.
- source_word: וַיִּתְּנֵם ... בְּיַד
  choice: отдал их в руки
  rationale: Русский идиоматический оборот сохраняет образ руки и ясно выражает передачу под власть противника.
- source_word: פְּלִשְׁתִּים
  choice: филистимлян
  rationale: Устоявшееся русское название этого народа.
- source_word: אַרְבָּעִים שָׁנָה
  choice: на сорок лет
  rationale: Предлог «на» естественно выражает продолжительность установленного периода подчинения.
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте дважды стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Корпоративное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Формально-образное выражение сохранено, при этом примечание поясняет, что речь идёт обо всём народе.
- issue: Причинная роль Яхве в подчинении Израиля
  choice: Яхве отдал их
  alternative: они оказались под властью филистимлян
  rationale: 'Активная грамматическая конструкция оригинала сохранена и не смягчена: именно Яхве выступает действующим лицом суда.'
translation_notes:
  register: Современный литературный русский язык с умеренным сохранением библейской образности. «Сыны Израиля», «в глазах» и «в руки» удерживают ключевые образы оригинала, не делая фразу непонятной; синтаксис остаётся плавным и доступным.
