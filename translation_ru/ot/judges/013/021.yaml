lexical_decisions:
- source_word: וְלֹא יָסַף עוֹד ... לְהֵרָאֹה
  choice: больше не являлся
  rationale: Конструкция יָסַף с עוֹד и инфинитивом выражает прекращение дальнейшего или повторного действия; «больше не являлся» естественно передаёт этот смысл по-русски.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может означать «посланник» или «ангел», но сверхъестественный характер персонажа в данном повествовании поддерживает перевод «ангел»; личное имя יְהוָה передано как «Яхве».
- source_word: לְהֵרָאֹה
  choice: являлся
  rationale: Нифаль глагола ראה здесь означает «появляться, являться, быть видимым»; «являлся» соответствует возвышенному повествовательному регистру и повторным явлениям персонажа.
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  choice: Маною и его жене
  rationale: Повтор предлога אֶל не требуется воспроизводить механически; русское управление дательным падежом после «являться» естественно и точно передаёт адресатов явления.
- source_word: אָז יָדַע מָנוֹחַ
  choice: Тогда Маной понял
  rationale: В контексте יָדַע обозначает наступившее узнавание или осознание; «понял» яснее русского «узнал», которое могло бы означать получение сведений извне.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: что это был ангел Яхве
  rationale: Указательное «это» естественно отсылает к ранее встреченному существу и не добавляет уточнения его природы сверх сказанного в еврейском тексте.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Тетраграмматон передан как личное имя «Яхве», что сохраняет прямую форму исходного текста и не смешивает имя с титулом.
- issue: Значение מַלְאַךְ в выражении מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: посланник Яхве
  rationale: Контекст описывает сверхъестественную фигуру, поэтому основной текст использует «ангел»; лексическая возможность «посланник» сохранена в сноске без догматического определения личности этого ангела.
- issue: Отождествление фигуры с Яхве
  choice: сохранить формулировку «ангел Яхве» без дополнительного толкования
  alternative: уточнить, что ангел является самим Яхве либо отдельным сотворённым существом
  rationale: Стих называет фигуру ангелом Яхве, но не формулирует её онтологический статус; перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Имя מָנוֹחַ передано в принятой русской форме «Маной»; синтаксис сделан естественным без утраты последовательности еврейского повествования.
