  text: וַ/תֵּ֤לֶד הָֽ/אִשָּׁה֙ בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שִׁמְשׁ֑וֹן וַ/יִּגְדַּ֣ל הַ/נַּ֔עַר וַֽ/יְבָרְכֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/024.yaml
  text: And the woman bore a son and called his name Samson. And the boy grew, and Yahweh blessed him.
translation:
  language: ru
  text: И родила женщина сына, и назвала его Самсоном. Мальчик рос, и Яхве благословлял его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: родила
  rationale: Обычный русский глагол для рождения ребёнка; точно передаёт повествовательную форму Qal от ילד.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Сохраняет прямое обозначение в еврейском тексте и не подставляет отсутствующее в стихе «жена».
- source_word: בֵּן
  choice: сына
  rationale: Естественное и точное соответствие в контексте рождения ребёнка мужского пола.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שִׁמְשׁוֹן
  choice: назвала его Самсоном
  rationale: Естественно передаёт еврейскую формулу наречения имени без неуклюжей буквальности «назвала имя его».
- source_word: וַיִּגְדַּל
  choice: рос
  rationale: В данном контексте גדל обозначает взросление и развитие ребёнка, а не приобретение величия.
- source_word: הַנַּעַר
  choice: мальчик
  rationale: נער допускает широкий возрастной диапазон; сразу после сообщения о рождении естественнее всего «мальчик».
- source_word: וַיְבָרְכֵהוּ
  choice: благословлял его
  rationale: ברך означает «благословлять». Русский несовершенный вид естественно описывает продолжавшееся благословение по мере роста мальчика, не ослабляя богословского смысла.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и наиболее вероятную научную реконструкцию произношения.
- issue: Вид глагола וַיְבָרְכֵהוּ
  choice: благословлял его
  alternative: благословил его
  rationale: Еврейская повествовательная форма сама по себе допускает русское совершенное «благословил», однако соседство с процессуальным «рос» позволяет естественно выразить благословение как сопровождавшее его взросление. Это не уточняет содержание благословения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским повествовательным ритмом. Повтор союза «и» сохраняет последовательность еврейского рассказа, а формула именования передана естественно по-русски.
