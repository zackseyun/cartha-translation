base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
translation:
  language: ru
  text: 'И ангел Яхве сказал Маною: «Если ты задержишь меня, я не стану есть твою пищу[a]. А если приготовишь всесожжение[b], вознеси его в жертву Яхве». Ведь Маной не знал, что он — ангел Яхве.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твоего хлеба». Здесь «хлеб», вероятно, означает пищу или трапезу вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «если совершишь всесожжение, вознеси его в жертву Яхве». В еврейском тексте употреблены два разных глагола: один говорит о приготовлении или совершении жертвы, другой — о её вознесении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  rationale: מַלְאַךְ может означать «вестник» или «ангел», но в данном повествовании речь идёт о сверхъестественном посланнике; личное имя יְהוָה передано как «Яхве».
- source_word: תַּעְצְרֵנִי
  choice: задержишь меня
  rationale: Глагол עצר здесь означает удержать или задержать посетителя, чтобы он остался на время приготовления еды.
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  choice: я не стану есть твою пищу
  rationale: לֶחֶם буквально означает «хлеб», но может обозначать пищу или трапезу вообще; в контексте естественнее «пища».
- source_word: תַּעֲשֶׂה עֹלָה
  choice: приготовишь всесожжение
  rationale: עשה при жертвенном приношении может означать приготовление; такой перевод отличает это действие от последующего תַּעֲלֶנָּה — вознесения жертвы.
- source_word: עֹלָה
  choice: всесожжение
  rationale: Устоявшееся русское обозначение жертвы, целиком сжигаемой на жертвеннике и восходящей в дыме.
- source_word: לַיהוָה תַּעֲלֶנָּה
  choice: вознеси его Яхве
  rationale: Форма глагола עלה выражает принесение жертвы с образом восхождения; местоименный суффикс передан словом «его».
- source_word: כִּי לֹא יָדַע מָנוֹחַ
  choice: Ведь Маной не знал
  rationale: כִּי вводит авторское пояснение; «ведь» естественно передаёт пояснительную связь в русском повествовании.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: что это Ангел Яхве
  rationale: Формулировка сохраняет смысл неузнанной личности посетителя и звучит естественно по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога; транслитерация «Яхве» сохраняет имя, не заменяя его титулом.
- issue: Природа מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  alternative: вестник Яхве
  rationale: Контекст представляет посетителя как сверхъестественное существо, однако перевод не добавляет более конкретного богословского отождествления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской тональностью. Синтаксис сделан ясным для обычного читателя; традиционный термин «всесожжение» сохранён из-за его точности и узнаваемости.
