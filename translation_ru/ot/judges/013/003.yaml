  text: וַ/יֵּרָ֥א מַלְאַךְ יְהוָ֖ה אֶל הָ/אִשָּׁ֑ה וַ/יֹּ֣אמֶר אֵלֶ֗י/הָ הִנֵּה נָ֤א אַתְּ עֲקָרָה֙ וְ/לֹ֣א יָלַ֔דְתְּ וְ/הָרִ֖ית וְ/יָלַ֥דְתְּ בֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/003.yaml
  text: And the angel of the LORD appeared to the woman and said to her, “Look, please—you are barren and have not borne children, but you will conceive and bear a son.”
translation:
  language: ru
  text: 'И явился женщине ангел ГОСПОДЕНЬ и сказал ей: «Вот, ты бесплодна и не рожала, но забеременеешь и родишь сына».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел ГОСПОДЕНЬ
  rationale: Передаёт конструкцию принадлежности естественным библейским русским выражением; имя יהוה обозначено принятой заменой «ГОСПОДЬ» с прописным начертанием.
- source_word: הִנֵּה נָא
  choice: вот
  rationale: הִנֵּה привлекает внимание; частица נָא здесь смягчает или подчёркивает высказывание и не требует неестественного буквального «пожалуйста» в русском сообщении о состоянии женщины.
- source_word: עֲקָרָה
  choice: бесплодна
  rationale: Точный и естественный русский эквивалент женской формы прилагательного.
- source_word: וְלֹא יָלַדְתְּ
  choice: и не рожала
  rationale: Сохраняет самостоятельное уточнение исходного текста без добавления отсутствующего существительного «детей».
- source_word: וְהָרִית וְיָלַדְתְּ בֵּן
  choice: но забеременеешь и родишь сына
  rationale: Русское «но» ясно выражает контраст между бесплодием и обещанием, тогда как последовательность двух будущих действий соответствует исходному тексту.
theological_decisions:
- issue: Передача тетраграмматона יהוה
  choice: ГОСПОДЬ / в сочетании «ангел ГОСПОДЕНЬ»
  alternative: Яхве / ангел Яхве
  rationale: Традиционная русская передача сохраняет различие имени יהוה посредством прописного начертания и не вводит спорную реконструкцию произношения в основной текст.
- issue: Идентичность «ангела ГОСПОДНЯ»
  choice: Не уточнять его природу или тождество
  alternative: Передать как самого ГОСПОДА либо добавить христологическое истолкование
  rationale: Стих называет фигуру מַלְאַךְ יְהוָה; перевод сохраняет формулировку и присущую повествованию богословскую напряжённость без конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Инверсия «явился женщине ангел ГОСПОДЕНЬ» естественно выделяет событие явления; речь краткая и ясная. Архаизм «чревата» и буквальное «пожалуйста» исключены как неестественные здесь.
