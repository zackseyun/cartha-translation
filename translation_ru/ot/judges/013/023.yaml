  text: וַ/תֹּ֧אמֶר ל֣/וֹ אִשְׁתּ֗/וֹ לוּ֩ חָפֵ֨ץ יְהוָ֤ה לַ/הֲמִיתֵ֨/נוּ֙ לֹֽא לָקַ֤ח מִ/יָּדֵ֨/נוּ֙ עֹלָ֣ה וּ/מִנְחָ֔ה וְ/לֹ֥א הֶרְאָ֖/נוּ אֶת כָּל אֵ֑לֶּה וְ/כָ/עֵ֕ת לֹ֥א הִשְׁמִיעָ֖/נוּ כָּ/זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: ru
  text: 'Но жена сказала ему: «Если бы Господь хотел умертвить нас, Он не принял бы из наших рук всесожжение и хлебное приношение, не показал бы нам всего этого и не возвестил бы нам теперь ничего подобного».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָפֵץ
  choice: хотел
  rationale: Передаёт значение желания или намерения в условной конструкции естественным современным русским языком.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная русская передача тетраграмматона, уместная для общедоступного литературного перевода.
- source_word: לָקַח
  choice: принял
  rationale: В контексте жертвы глагол означает благосклонное принятие, а не просто физическое взятие.
- source_word: עֹלָה וּמִנְחָה
  choice: всесожжение и хлебное приношение
  rationale: Различает два вида приношений; מִנְחָה в данном культовом контексте обозначает хлебное приношение.
- source_word: הִשְׁמִיעָנוּ
  choice: возвестил бы нам
  rationale: Сохраняет каузативный оттенок «дать услышать, объявить» и возвышенный, но понятный регистр.
- source_word: כָזֹאת
  choice: ничего подобного
  rationale: В отрицательной условной конструкции естественно передаёт неопределённое «такое, подобное этому», относящееся к обещанному событию.
theological_decisions:
- issue: Основание вывода жены Маноя о Божьем намерении
  choice: 'Сохранена трёхчастная аргументация: принятие жертв, откровение увиденного и возвещение будущего.'
  alternative: Обобщить рассуждение как заверение в Божьем благоволении.
  rationale: Исходный текст прямо перечисляет три основания и не формулирует отвлечённого богословского вывода.
- issue: Объект последнего возвещения
  choice: «ничего подобного»
  alternative: «такого, как это» или «всего этого»
  rationale: Форма כָזֹאת допускает несколько близких способов передачи; выбранный вариант сохраняет отсылочную неопределённость и не отождествляет последнюю фразу полностью с предшествующим «всем этим».
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксический параллелизм еврейской фразы сохранён, но отрицания оформлены естественно для русского условного периода.
