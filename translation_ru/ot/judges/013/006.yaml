  text: וַ/תָּבֹ֣א הָ/אִשָּׁ֗ה וַ/תֹּ֣אמֶר לְ/אִישָׁ/הּ֮ לֵ/אמֹר֒ אִ֤ישׁ הָ/אֱלֹהִים֙ בָּ֣א אֵלַ֔/י וּ/מַרְאֵ֕/הוּ כְּ/מַרְאֵ֛ה מַלְאַ֥ךְ הָ/אֱלֹהִ֖ים נוֹרָ֣א מְאֹ֑ד וְ/לֹ֤א שְׁאִלְתִּ֨י/הוּ֙ אֵֽי מִ/זֶּ֣ה ה֔וּא וְ/אֶת שְׁמ֖/וֹ לֹֽא הִגִּ֥יד לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
translation:
  language: ru
  text: 'Тогда женщина пришла к мужу и сказала: «Ко мне пришёл человек Божий. Вид у него был, как у ангела Божьего, — внушающий великий трепет[a]. Я не спросила его, откуда он, а он не сказал мне своего имени».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весьма устрашающий»; еврейское слово выражает одновременно страх и благоговейный трепет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Определённая форма указывает на уже известную из контекста женщину, жену Маноя; русское «женщина» сохраняет форму исходного повествования, а семейное отношение выражено далее словом «мужу».
- source_word: לְאִישָׁהּ
  choice: к мужу
  rationale: В брачном контексте אִישׁ с суффиксом 3-го лица женского рода естественно означает «её муж».
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Это устойчивое библейское обозначение Божьего служителя или посланника; отсутствие артикля при אִישׁ не требует в русском языке неопределённого артикля.
- source_word: בָּא אֵלַי
  choice: ко мне приходил
  rationale: Русское прошедшее несовершенного вида естественно передаёт сообщение о состоявшемся посещении; «ко мне» точно отражает אֵלַי.
- source_word: וּמַרְאֵהוּ כְּמַרְאֵה
  choice: вид у него был, как у
  rationale: Передаёт повтор מַרְאֶה без тяжеловесного русского «его вид был подобен виду», сохраняя явное сравнение.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: ангела Божьего
  rationale: מַלְאָךְ может означать посланника, но контекст сверхъестественного явления поддерживает традиционное и понятное «ангел». Конструкция допускает качественное или неопределённое понимание, которое русский родительный оборот не переопределяет.
- source_word: נוֹרָא מְאֹד
  choice: весьма грозный
  rationale: נוֹרָא выражает внушающий сильный страх и благоговейный трепет вид; «весьма грозный» сохраняет эту силу и звучит достойно в современном русском.
- source_word: אֵי מִזֶּה הוּא
  choice: откуда он
  rationale: Естественный русский способ спросить о происхождении или месте, откуда пришёл человек.
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  choice: а он не сказал мне своего имени
  rationale: Естественно передаёт הִגִּיד «сообщил, сказал» и вынесенное в еврейском тексте дополнение «его имя».
theological_decisions:
- issue: Определённость и природа מַלְאַךְ הָאֱלֹהִים
  choice: как у ангела Божьего
  alternative: как у Ангела Божьего; как у Божьего посланника
  rationale: В масоретском тексте у מַלְאַךְ нет артикля, поэтому перевод не отождествляет посетителя прямо с конкретным «Ангелом Божьим». Вместе с тем «ангел» уместен ввиду сверхъестественного контекста. Сравнительная формулировка сохраняет ограниченность понимания женщины на данном этапе рассказа.
- issue: Сочетание страха и благоговения в נוֹרָא
  choice: весьма грозный
  alternative: весьма устрашающий; внушающий великий трепет
  rationale: Выбранное слово не сводит реакцию ни только к ужасу, ни только к возвышенному восхищению, сохраняя смысловое напряжение исходного слова.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис упрощён до естественной прямой речи, но ключевое сравнение и неоднозначность описания небесного посланника сохранены.
