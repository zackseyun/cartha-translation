  - severity: medium
    issue: Семантическая узость «весьма грозный»
    rationale: «Грозный» в современном русском обычно означает суровый или угрожающий. Нוֹרָא מְאֹד характеризует вызывающий сильный страх и трепет облик; более явная формулировка лучше сохраняет этот диапазон.
