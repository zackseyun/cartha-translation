base_translation:
  language: en
  yaml_path: translation/ot/judges/013/013.yaml
  text: And the angel of Yahweh said to Manoah[a], “The woman must be careful to do everything that I said to her.”
translation:
  language: ru
  text: 'И ангел Яхве сказал Маною[a]: «Пусть женщина соблюдает всё, что Я сказал ей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланник Яхве». Еврейское слово может означать и «ангел», и «посланник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И ... сказал
  rationale: Последовательная форма с וַ передаёт обычное продолжение повествования; союз «и» сохраняет связность без добавления лишнего временного оттенка.
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ допускает значения «ангел» и «посланник»; в данном повествовании речь идёт о небесном вестнике, поэтому «ангел» естественно и уместно. Имя יהוה передано как «Яхве».
- source_word: אֶל מָנוֹחַ
  choice: Маною
  rationale: Русская конструкция «сказал Маною» естественно передаёт адресата, выраженного предлогом אֶל.
- source_word: מִכֹּל אֲשֶׁר אָמַרְתִּי אֶל הָאִשָּׁה
  choice: всё, что Я сказал ей
  rationale: Оборот מִכֹּל אֲשֶׁר при תִּשָּׁמֵר указывает на полный объём ранее данных наставлений. Местоимение «ей» ясно отсылает к названной женщине и звучит естественно по-русски.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Сохранено буквальное обозначение «женщина»; вариант «твоя жена» был бы контекстуально понятен, но добавлял бы отсутствующее в стихе отношение.
- source_word: תִּשָּׁמֵר
  choice: пусть ... строго соблюдает
  rationale: Нифаль глагола שׁמר здесь выражает необходимость быть настороже и тщательно придерживаться данных предписаний. «Строго соблюдает» естественно передаёт это значение в контексте наставлений.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога, поэтому транслитерация сохраняет его как личное имя, не заменяя титулом.
- issue: Смысл מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: посланник Яхве
  rationale: Слово מַלְאַךְ само по себе может означать посланника, однако контекст главы указывает на сверхъестественного вестника. Перевод «ангел» сохраняет обычное библейское обозначение, не уточняя сверх сказанного природу или тождество этого лица.
- issue: Характер требования תִּשָּׁמֵר
  choice: пусть ... строго соблюдает
  alternative: пусть бережётся
  rationale: Контекст связывает повеление с ранее данными ограничениями; выбранная формулировка передаёт обязательность внимательного соблюдения, не вводя дополнительных предписаний.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, повествовательная и торжественная без архаизмов. Прямая речь передана естественно, а прописное «Я» подчёркивает говорящего по принятой русской библейской издательской традиции.
