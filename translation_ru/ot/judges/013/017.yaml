base_translation:
  language: en
  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
translation:
  language: ru
  text: 'Тогда Маноах спросил ангела Яхве[a]: «Как тебя зовут, чтобы, когда сбудутся твои слова, мы воздали тебе честь?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланнику Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может означать «посланник» или «ангел»; сверхъестественный характер персонажа в повествовании делает «ангел» наиболее естественным вариантом, а имя יְהוָה передано как «Яхве».
- source_word: מִי שְׁמֶךָ
  choice: Как твоё имя?
  rationale: Еврейская идиома буквально использует вопросительное «кто», но по-русски естественный вопрос об имени звучит «Как твоё имя?».
- source_word: כִּי יָבֹא דְבָרֶיךָ
  choice: Когда исполнятся твои слова
  rationale: כִּי здесь естественно понимать как вводящее ожидаемое обстоятельство, а идиома יָבֹא דְבָרֶיךָ означает исполнение сказанного; множественное число «слова» сохранено.
- source_word: וְכִבַּדְנוּךָ
  choice: мы воздадим тебе честь
  rationale: Пиэль от כבד означает «почтить, оказать честь». Формулировка передаёт обещанный ответ Маноаха, не усиливая его до богословски нагруженного «прославим».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно употреблён тетраграмматон; «Яхве» передаёт личное заветное имя и не заменяет его титулом.
- issue: Идентификация מַלְאַךְ как ангела или посланника
  choice: ангел Яхве
  alternative: посланник Яхве
  rationale: Контекст повествования представляет этого посланника как сверхъестественное существо, однако лексическая возможность «посланник» сохранена в примечании без дальнейшего догматического отождествления.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Обращение на «ты» соответствует единственному числу древнееврейского текста. Разделение на вопрос и последующее предложение сохраняет смысловую неоднозначность כִּי, не навязывая исключительно целевое «чтобы».
