  text: וַ/תָּ֨חֶל֙ ר֣וּחַ יְהוָ֔ה לְ/פַעֲמ֖/וֹ בְּ/מַחֲנֵה דָ֑ן בֵּ֥ין צָרְעָ֖ה וּ/בֵ֥ין אֶשְׁתָּאֹֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/025.yaml
  text: And the Spirit of Yahweh began to stir him in Mahaneh-dan[b][a], between Zorah and Eshtaol.
translation:
  language: ru
  text: И Дух Яхве начал побуждать его в Махане-Дане[a], между Цорой и Эштаолом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Махане-Дан» означает «стан Дана»; здесь это название места.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּחֶל
  choice: начал
  rationale: Передаёт начинательное значение формы от חלל и естественно продолжает повествование.
- source_word: רוּחַ יְהוָה
  choice: Дух Яхве
  rationale: В контексте книги Судей речь идёт о Божьем Духе, наделяющем будущего судью силой; имя יהוה передано как «Яхве».
- source_word: לְפַעֲמוֹ
  choice: побуждать его
  rationale: Глагол פעם здесь допускает оттенки движения, побуждения и понуждения. «Побуждать» сохраняет направляющее воздействие, не сводя его ни к эмоциям, ни к физическому перемещению.
- source_word: בְּמַחֲנֵה דָן
  choice: в Махане-Дане
  rationale: Сочетание, буквально означающее «стан Дана», в данном контексте функционирует как географическое название, поэтому передано транслитерацией.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: между Цорой и Эштаолом
  rationale: Прямое обозначение местности с традиционно узнаваемой русской передачей топонимов.
theological_decisions:
- issue: Характер רוּחַ יְהוָה
  choice: Дух Яхве как действующее Божье присутствие
  alternative: ветер Яхве / дыхание Яхве
  rationale: В повествовании о Самсоне это выражение обозначает Божье воздействие, подготавливающее и наделяющее судью силой, а не природный ветер; более поздние догматические уточнения в перевод не вносятся.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: Личное имя Бога передано непосредственно и единообразно, без замены титулом.
- issue: Степень определённости לְפַעֲמוֹ
  choice: побуждать его
  alternative: двигать его / понуждать его / волновать его
  rationale: Еврейский глагол допускает несколько близких оттенков. Основной текст использует естественное русское слово с достаточно широким значением, не уточняя сверх источника характер воздействия.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Союз «И» сохранён как связь с предыдущим стихом. Топонимы оформлены в формах, естественных для русского синтаксиса.
