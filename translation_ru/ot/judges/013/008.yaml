  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֶּעְתַּ֥ר מָנ֛וֹחַ אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר בִּ֣י אֲדוֹנָ֔/י אִ֣ישׁ הָ/אֱלֹהִ֞ים אֲשֶׁ֣ר שָׁלַ֗חְתָּ יָבוֹא נָ֥א עוֹד֙ אֵלֵ֔י/נוּ וְ/יוֹרֵ֕/נוּ מַֽה נַּעֲשֶׂ֖ה לַ/נַּ֥עַר הַ/יּוּלָּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
translation:
  language: ru
  text: 'Тогда Маной усердно помолился Яхве[a]: «Прошу, Господь, пусть человек Божий, которого Ты послал, снова придёт к нам и научит нас, что делать с мальчиком, который родится[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «взмолился Яхве», «стал умолять Яхве». Еврейский глагол выражает настойчивую мольбу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с ребёнком, который родится». В еврейском тексте употреблено слово мужского рода: «мальчик».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּעְתַּר
  choice: усердно помолился
  rationale: Глагол עתר обозначает обращённую к Богу настойчивую мольбу; сочетание передаёт и молитвенный характер, и силу просьбы естественным современным русским языком.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте, а не замещающий его титул.
- source_word: בִּי אֲדֹנָי
  choice: Прошу, Господь
  rationale: בִּי служит вежливой и почтительной частицей просьбы, а אֲדֹנָי — обращением «Господь».
- source_word: אִישׁ הָאֱלֹהִים
  choice: человек Божий
  rationale: Буквальное и устойчивое соответствие, сохраняющее точку зрения Маноя и не определяющее личность посетителя точнее, чем это делает данный стих.
- source_word: יָבוֹא נָא עוֹד אֵלֵינוּ
  choice: пусть ... снова придёт к нам
  rationale: Передаёт просительное значение формы с נָא и значение עוֹד «снова, ещё раз».
- source_word: וְיוֹרֵנוּ
  choice: и научит нас
  rationale: Порода Hiphil глагола ירה здесь означает наставление или обучение.
- source_word: מַה נַּעֲשֶׂה לַנַּעַר
  choice: что делать с мальчиком
  rationale: Естественная русская конструкция для вопроса о том, как надлежит обращаться с будущим ребёнком; «мальчиком» сохраняет мужской род נַעַר.
- source_word: הַיּוּלָּד
  choice: который родится
  rationale: Пассивное причастие указывает на будущего рождённого; по-русски это естественно выражается придаточным будущего времени.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь / Иегова
  rationale: В исходном тексте употреблено собственное имя Бога; транслитерация сохраняет различие между именем Яхве и обращением אֲדֹנָי «Господь» в той же фразе.
- issue: Определение личности אִישׁ הָאֱלֹהִים
  choice: человек Божий
  alternative: вестник Божий / ангел Божий
  rationale: Маной говорит согласно своему нынешнему пониманию. Такая передача сохраняет повествовательное напряжение и не вносит в стих более позднее распознавание посетителя.
- issue: Род слова לַנַּעַר
  choice: с мальчиком
  alternative: с ребёнком
  rationale: Еврейское существительное имеет мужское значение и в контексте относится к обещанному сыну; мужская конкретность сохранена.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. «Маной» соответствует принятой русской форме имени. Заглавные буквы в местоимении «Ты» выражают почтительность в прямом обращении к Богу, не меняя смысла исходного текста.
