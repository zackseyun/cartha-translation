  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
translation:
  language: ru
  text: 'Тогда женщина поспешила, побежала и рассказала своему мужу, и сказала ему: «Вот, мне явился тот человек, который приходил ко мне в тот день[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который недавно приходил ко мне». Буквально по-еврейски: «который приходил ко мне в день»; выражение отсылает к его прежнему посещению.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: поспешила
  rationale: Передаёт значение корня מהר — действовать быстро, спешить — естественным современным русским словом.
- source_word: וַתָּרָץ
  choice: побежала
  rationale: 'Сохраняет самостоятельное значение глагола רוץ и двойное описание срочности: женщина не только поспешила, но и побежала.'
- source_word: וַתַּגֵּד
  choice: рассказала
  rationale: 'Естественно передаёт Hiphil глагола נגד в повествовательном контексте: сообщить, рассказать.'
- source_word: לְאִישָׁהּ
  choice: своему мужу
  rationale: Существительное אִישׁ с суффиксом 3-го лица женского рода в данном семейном контексте означает её мужа; возвратное «своему» естественно для русского языка.
- source_word: הִנֵּה
  choice: вот
  rationale: Частица привлекает внимание и придаёт сообщению непосредственность; «вот» соответствует современному литературному русскому регистру.
- source_word: נִרְאָה אֵלַי
  choice: мне явился
  rationale: Niphal глагола ראה здесь обозначает явление кому-либо. Русский совершенный вид естественно представляет только что происшедшее событие.
- source_word: הָאִישׁ
  choice: тот человек
  rationale: Сохраняет обозначение фигуры как человека в речи женщины, не вводя преждевременно более полную идентификацию. «Тот» естественно указывает на ранее упомянутого человека.
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלַי
  choice: который приходил ко мне в тот день
  rationale: Оборот буквально содержит «в день» и отсылает к прежнему посещению. «В тот день» сохраняет эту форму, тогда как несовершенный вид «приходил» естественен при отсылке к уже известному случаю.
theological_decisions:
- issue: Идентичность הָאִישׁ в речи женщины
  choice: тот человек
  alternative: ангел; посланник Бога
  rationale: Хотя более широкий контекст называет эту фигуру Ангелом Господним, сама женщина здесь говорит о нём как о «человеке». Перевод сохраняет её непосредственную перспективу и не вносит в стих последующую идентификацию.
translation_notes:
  register: Современный литературный русский язык с естественным повествовательным ритмом. Последовательность «поспешила, побежала» намеренно сохранена, чтобы передать два отдельных еврейских глагола и подчеркнуть срочность. Прямая речь оформлена без лишнего повторения глагола речи, допустимого и естественного по-русски.
