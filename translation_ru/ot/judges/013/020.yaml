base_translation:
  language: en
  yaml_path: translation/ot/judges/013/020.yaml
  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
translation:
  language: ru
  text: Когда пламя поднялось с жертвенника к небу, ангел Яхве[a] поднялся в пламени жертвенника, а Маной и его жена смотрели; они пали ниц на землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вестник Яхве». Еврейское слово может означать как «ангел», так и «вестник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת
  choice: Когда ... поднялось
  rationale: Оборот вводит придаточное времени; по-русски естественно передать его без буквального «и было».
- source_word: הַלַּהַב
  choice: пламя
  rationale: Точно и естественно передаёт конкретный образ לַהַב.
- source_word: הַשָּׁמַיְמָה
  choice: к небу
  rationale: Направительный суффикс выражает движение в сторону неба.
- source_word: מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  rationale: В данном сверхъестественном контексте מַלְאָךְ естественно передаётся как «Ангел»; имя יהוה транслитерируется как «Яхве», а личность явившегося не уточняется богословски.
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  choice: в пламени жертвенника
  rationale: Сохраняет пространственный образ исходного текста, не уточняя способ восхождения.
- source_word: וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים
  choice: Маной и его жена смотрели на это
  rationale: Причастие передаёт продолжающееся наблюдение одновременно с восхождением.
- source_word: וַיִּפְּלוּ עַל פְּנֵיהֶם אָרְצָה
  choice: пали ниц на землю
  rationale: Современный литературный русский идиом естественно передаёт падение лицом к земле и сохраняет торжественный регистр.
theological_decisions:
- issue: Личность מַלְאַךְ יְהוָה
  choice: Ангел Яхве
  alternative: вестник Яхве; явление самого Бога или предвечного Сына
  rationale: Перевод сохраняет данное текстом обозначение и не решает спорный вопрос о точной природе и личности этого явления.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-торжественным повествовательным строем. Причастную конструкцию разделено на два предложения ради естественности; одновременность наблюдения сохранена контекстом. Маркер сноски поставлен непосредственно после спорного выражения.
