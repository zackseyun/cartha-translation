base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: There was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
translation:
  language: ru
  text: Был один человек из Цоры, из рода данитян; звали его Маной. Его жена была бесплодна и не родила[a].
  philosophy: optimal-equivalence
  footnotes:
