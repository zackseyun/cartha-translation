lexical_decisions:
- source_word: וַיְהִי אִישׁ אֶחָד
  choice: Был один человек
  rationale: Оборот вводит нового участника повествования. Русское «был один человек» естественно передаёт как бытийное значение, так и указание на конкретного, пока ещё не названного человека.
- source_word: מִצָּרְעָה
  choice: из Цоры
  rationale: Предлог מִן обозначает происхождение или место жительства; название города передано в традиционной русской форме «Цора».
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: из рода данитян
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу внутри племени, поэтому «род» точнее, чем «племя»; «данитяне» — ясное современному читателю обозначение принадлежавших к Дану.
- source_word: וּשְׁמוֹ מָנוֹחַ
  choice: звали его Маной
  rationale: Естественная русская передача еврейской формулы именования; «Маной» — укоренившаяся русская форма имени.
- source_word: עֲקָרָה
  choice: была бесплодна
  rationale: Краткая и точная передача состояния женщины в контексте повествования о рождении ребёнка.
- source_word: וְלֹא יָלָדָה
  choice: и не рожала
  rationale: В еврейском тексте нет выраженного дополнения. Такая передача сохраняет эту недосказанность и обозначает отсутствие прежних родов, не добавляя слова «детей» или «ребёнка».
