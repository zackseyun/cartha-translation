  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל אִשְׁתּ֖/וֹ מ֣וֹת נָמ֑וּת כִּ֥י אֱלֹהִ֖ים רָאִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
translation:
  language: ru
  text: 'И сказал Маной своей жене: «Мы непременно умрём, потому что видели Бога[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бога» или «божественное существо». Еврейское אֱלֹהִים в некоторых контекстах может обозначать божественное существо в более широком смысле, однако здесь контекст указывает скорее на Бога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Стандартная повествовательная форма с последовательным וַ; союз «и» сохраняет ход еврейского рассказа без добавления причинного или временного оттенка.
- source_word: מָנוֹחַ
  choice: Маной
  rationale: Традиционная и узнаваемая русская передача личного имени מָנוֹחַ.
- source_word: אֶל אִשְׁתּוֹ
  choice: своей жене
  rationale: Естественная русская передача буквального «к его жене»; возвратное местоимение однозначно соотносит жену с подлежащим.
- source_word: מוֹת נָמוּת
  choice: мы непременно умрём
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение; «непременно» ясно передаёт эту эмфазу.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину страха Маноя и естественно передаётся причинной конструкцией.
- source_word: אֱלֹהִים
  choice: Бога
  rationale: Контекст встречи с Ангелом Господним и страх смерти после созерцания божественного присутствия поддерживают значение «Бог», хотя форма допускает более широкое обозначение божественного существа.
- source_word: רָאִינוּ
  choice: видели
  rationale: Перфект 1-го лица множественного числа обозначает уже совершившееся событие; русское прошедшее время здесь звучит естественно и сохраняет связь с ожидаемым последствием.
theological_decisions:
- issue: Значение אֱלֹהִים в восклицании Маноя после явления Ангела Господня
  choice: Бога
  alternative: бога; божественное существо
  rationale: В ближайшем повествовательном контексте явление Ангела Господня воспринимается Маноем как встреча с Богом, а страх смерти перекликается с библейским представлением о невозможности человеку увидеть Бога и остаться в живых. При этом сноска сохраняет лексическую широту אֱלֹהִים и не снимает напряжение между Ангелом Господним и Богом.
translation_notes:
  register: Современный литературный русский язык с достоинством и повествовательной простотой. Синтаксис близок к еврейскому оригиналу, но естественен по-русски; эмфаза исходной конструкции передана наречием «непременно».
