  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
translation:
  language: ru
  text: Маной взял козлёнка и хлебное приношение и принёс их на скале в жертву Яхве. И он совершил нечто дивное[a], пока Маной и его жена смотрели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и ангел Яхве совершил нечто дивное». В еврейском тексте субъект прямо не назван, хотя контекст указывает на посланника Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  choice: козлёнка
  rationale: Естественное русское обозначение молодого козла; родовая принадлежность, выраженная в еврейском сочетании, по-русски не требует отдельного уточнения.
- source_word: הַמִּנְחָה
  choice: хлебное приношение
  rationale: В данном жертвенном контексте מִנְחָה обозначает сопровождающее приношение из продуктов земледелия; традиционное и понятное выражение «хлебное приношение» точнее общего «приношение».
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  choice: принёс их на скале в жертву Яхве
  rationale: Глагол עלה в жертвенном контексте передаёт вознесение жертвы. Русская конструкция ясно показывает, что козлёнок и приношение были принесены в жертву на скале.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה транслитерацией, сохраняя отличие имени от титула «Господь».
- source_word: וּמַפְלִא לַעֲשׂוֹת
  choice: И он совершил нечто дивное
  rationale: Сохраняет мужское единственное число и значение корня פלא, но не добавляет в основной текст явно не названного субъекта.
- source_word: רֹאִים
  choice: смотрели
  rationale: Причастная форма обозначает продолжающееся наблюдение; несовершенный вид естественно передаёт длительность действия.
theological_decisions:
- issue: Неявный субъект оборота וּמַפְלִא לַעֲשׂוֹת
  choice: Субъект передан местоимением «он» без прямого наименования.
  alternative: «Ангел Яхве совершил нечто дивное» либо безличное «произошло нечто дивное».
  rationale: В еврейском тексте субъект прямо не повторён. Контекст указывает на посланника Яхве, но его явное добавление устранило бы синтаксическую сжатость и неоднозначность оригинала; безличная конструкция, напротив, утратила бы форму мужского рода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Дивное» сохраняет торжественный оттенок корня פלא, оставаясь понятным современному читателю; синтаксис сделан плавным и не перегружен архаизмами.
