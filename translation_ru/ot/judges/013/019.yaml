  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: Маной берёт козлёнка и хлебное приношение, приносит их в жертву на скале Яхве; затем следует сжатое сообщение о дивном действии при наблюдении Маноя и его жены. Местоимение «он» сохраняет мужской род неявного субъекта, не вводя в основной текст «ангела Яхве».'
