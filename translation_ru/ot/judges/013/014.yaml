base_translation:
  language: en
  yaml_path: translation/ot/judges/013/014.yaml
  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
translation:
  language: ru
  text: Она не должна есть ничего, что даёт виноградная лоза[a], не должна пить ни вина, ни хмельного напитка и не должна есть ничего нечистого. Она должна соблюдать всё, что Я ей повелел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от всего, что выходит из винной лозы», то есть от всего, что производит виноградная лоза.'
    reason: Лексическое пояснение буквального еврейского оборота.
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  choice: ничего, что происходит от виноградной лозы
  rationale: Передаёт всеохватность оборота и сохраняет глагольный образ «происходит/выходит от», а естественное русское «виноградная лоза» выражает смысл буквально более тяжеловесного «винная лоза».
- source_word: לֹא תֹאכַל / אַל תֵּשְׁתְּ / אַל תֹּאכַל
  choice: пусть она не ест / не пьёт / не ест
  rationale: Форма с «пусть не» естественно передаёт предписывающе-запретительный смысл, не превращая его в категорическое будущее время.
- source_word: יַיִן
  choice: вино
  rationale: Обычное и точное соответствие еврейскому слову.
- source_word: שֵׁכָר
  choice: хмельной напиток
  rationale: Широкое обозначение алкогольного напитка помимо вина; не сужает значение до пива и звучит естественнее архаичного «сикера».
- source_word: כָל טֻמְאָה
  choice: ничего нечистого
  rationale: Сохраняет широкую неопределённость выражения и библейскую категорию ритуальной нечистоты.
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ תִּשְׁמֹר
  choice: пусть соблюдает всё, что Я повелел ей
  rationale: «Соблюдает» ясно передаёт значение хранения и исполнения предписаний; прошедшее «повелел» соответствует данному ранее повелению.
theological_decisions:
- issue: Объём запрета в отношении плодов лозы
  choice: Запрет охватывает всё происходящее от виноградной лозы.
  alternative: Понимать запрет уже — лишь как запрет есть виноград или отдельные съедобные виноградные продукты.
  rationale: Всеохватная конструкция מִכֹּל אֲשֶׁר указывает на широкий запрет. Перевод сохраняет его силу, не вводя в основной текст более позднюю техническую терминологию.
- issue: Передача טֻמְאָה
  choice: нечистое
  alternative: осквернённое / ритуально нечистое
  rationale: «Нечистое» сохраняет связь с категориальным языком законов о чистоте и не ограничивает значение пояснением, которого нет в тексте.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Повтор запретов частично уплотнён без утраты их содержания; обращение относится к женщине, что выражено местоимением «она».
