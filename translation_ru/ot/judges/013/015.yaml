source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר מָנ֖וֹחַ אֶל מַלְאַ֣ךְ יְהוָ֑ה נַעְצְרָה נָּ֣א אוֹתָ֔/ךְ וְ/נַעֲשֶׂ֥ה לְ/פָנֶ֖י/ךָ גְּדִ֥י עִזִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/015.yaml
  text: Then Manoah said to the angel of the LORD, “Please let us detain you, and we will prepare a young goat for you.”
translation:
  language: ru
  text: 'Тогда Маной сказал ангелу ГОСПОДА: «Позволь нам задержать тебя и приготовить для тебя козлёнка».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел ГОСПОДА
  rationale: מַלְאַךְ означает «вестник, ангел», а тетраграмматон передан традиционным издательским эквивалентом «ГОСПОДЬ»; сочетание сохранено без дополнительного богословского уточнения.
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  choice: Позволь нам задержать тебя
  rationale: Когортатив с נָא выражает вежливую просьбу; «задержать» сохраняет смысл просьбы остаться на некоторое время.
- source_word: וְנַעֲשֶׂה לְפָנֶיךָ
  choice: и приготовить для тебя
  rationale: Буквально «и сделаем перед тобой»; в данном контексте естественное русское выражение «приготовить для тебя» передаёт намерение приготовить пищу для гостя, не уточняя, будет ли это обычная трапеза или приношение.
- source_word: גְּדִי עִזִּים
  choice: козлёнка
  rationale: Устойчивое еврейское сочетание обозначает молодого козла; по-русски достаточно естественного «козлёнка».
theological_decisions:
- issue: Статус ангела ГОСПОДА
  choice: ангел ГОСПОДА
  alternative: Ангел-ГОСПОДЬ / сам ГОСПОДЬ
  rationale: Текст прямо называет персонажа מַלְאַךְ יְהוָה; перевод не отождествляет его с Богом и не отделяет от Бога сверх того, что сказано в источнике.
- issue: Назначение козлёнка
  choice: приготовить для тебя
  alternative: принести тебе в жертву козлёнка
  rationale: В стихе используется общий глагол עשה, а жертвенный характер действия здесь прямо не указан; последующий контекст проясняет ситуацию, поэтому двусмысленность не следует устранять заранее.
translation_notes:
  register: Современный литературный русский язык; реплика вежливая и естественная, с умеренно торжественным библейским регистром. Написание «ГОСПОДА» обозначает передачу имени יהוה по принятой русской издательской традиции.
