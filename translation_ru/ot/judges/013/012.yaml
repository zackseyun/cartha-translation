base_translation:
  language: en
  yaml_path: translation/ot/judges/013/012.yaml
  text: Then Manoah said[a], “Now let your words come true[c][b]. What will be the rule for the boy and for his work?”
translation:
  language: ru
  text: 'Тогда Маной сказал: «Пусть же сбудутся твои слова[a]. Какой будет порядок для мальчика[b] и каким будет его дело[c]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Когда сбудутся твои слова…» Еврейскую фразу можно понять либо как пожелание, либо как временное условие.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «предписание», «обычай» либо «образ жизни мальчика».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и его дело»; возможно также: «и что он должен делать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда … сказал
  rationale: Форма с повествовательным וַ последовательно продвигает рассказ; «тогда» естественно передаёт эту связь в современном русском языке.
- source_word: מָנוֹחַ
  choice: Маной
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: עַתָּה
  choice: же
  rationale: В сочетании с пожеланием частица передаёт настойчивость и непосредственность עַתָּה без неестественного буквального «теперь».
- source_word: יָבֹא דְבָרֶיךָ
  choice: пусть же сбудутся твои слова
  rationale: Буквально слова должны «прийти», то есть осуществиться. Русское «сбудутся» ясно передаёт идиому, а форма пожелания сохраняет одно из возможных прочтений.
- source_word: מַה יִּהְיֶה
  choice: какое … будет
  rationale: Прямо передаёт вопрос о будущем положении или предписании.
- source_word: מִשְׁפַּט
  choice: установление
  rationale: Слово может обозначать норму, предписание, обычай или установленный порядок. «Установление» сохраняет предписывающий оттенок, не сводя смысл исключительно к юридическому закону.
- source_word: הַנַּעַר
  choice: мальчик
  rationale: Существительное обозначает будущего ребёнка мужского пола; «мальчик» сохраняет это указание и звучит естественно.
- source_word: וּמַעֲשֵׂהוּ
  choice: и какое дело ему предстоит
  rationale: מַעֲשֶׂה означает дело, работу или деятельность. Такая формулировка сохраняет слово «дело», но естественно выражает вопрос о будущей деятельности мальчика.
theological_decisions:
- issue: Пожелательное или временное значение יָבֹא דְבָרֶיךָ
  choice: 'Основной текст передаёт пожелание: «пусть же сбудутся твои слова».'
  alternative: «Когда сбудутся твои слова…»
  rationale: Еврейскую фразу можно понять и как пожелание об исполнении обещания, и как временное условие, вводящее следующий вопрос. Альтернатива отмечена, чтобы не устранять подлинную неоднозначность.
- issue: Смысл מִשְׁפַּט применительно к будущему мальчику
  choice: «установление для мальчика»
  alternative: «обычай», «предписание» или «образ жизни мальчика»
  rationale: Контекст допускает как норму, предписанную для ребёнка, так и описание порядка его жизни; основной перевод не уточняет это конфессионально или догматически.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для обычного читателя; неоднозначность еврейского текста сохранена в примечаниях.
