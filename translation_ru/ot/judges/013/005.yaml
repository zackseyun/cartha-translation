  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
translation:
  language: ru
  text: Ибо вот, ты беременна и родишь сына. Бритва не коснётся его головы, ибо мальчик будет назореем Божьим с самого чрева, и он начнёт спасать[a] Израиль от руки филистимлян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавлять». Еврейский глагол может означать «спасать» или «избавлять» в зависимости от контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: вот, ты
  rationale: Частица направляет внимание и придаёт сообщению торжественную выразительность; «вот» естественно передаёт эту функцию по-русски.
- source_word: הָרָה
  choice: беременна
  rationale: Это предикативное прилагательное, обозначающее настоящее состояние женщины, а не будущий глагол «зачнёшь».
- source_word: וְיֹלַדְתְּ בֵּן
  choice: и родишь сына
  rationale: В контексте возвещения форма имеет будущее значение; русское выражение кратко и естественно.
- source_word: מוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: бритва не коснётся его головы
  rationale: «Бритва» точно передаёт предмет, а «не коснётся головы» естественно воспроизводит образный запрет еврейского выражения.
- source_word: נְזִיר אֱלֹהִים
  choice: назорей Божий
  rationale: Сохраняется техническое обозначение человека, особо посвящённого Богу, без сведения его к общему понятию посвящения.
- source_word: מִן הַבָּטֶן
  choice: от самого чрева
  rationale: Сохраняет явное указание на чрево и подчёркивает посвящение ещё до рождения; «самого» делает оборот естественнее по-русски.
- source_word: יָחֵל
  choice: начнёт
  rationale: Глагол прямо указывает на начало действия и не позволяет представить избавление как полностью совершённое Самсоном.
- source_word: לְהוֹשִׁיעַ
  choice: спасать
  rationale: Передаёт значение избавления от вражеской власти и сохраняет связь с широким библейским понятием спасения.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: от руки филистимлян
  rationale: Сохраняет понятную библейскую метафору руки как власти и господства.
theological_decisions:
- issue: Характер посвящения Самсона
  choice: назорей Божий от самого чрева
  alternative: посвящённый Богу от рождения
  rationale: В еврейском тексте употреблён специальный термин נְזִיר и прямо названо чрево; основной текст сохраняет оба элемента, не добавляя позднейших доктринальных выводов.
- issue: Объём роли Самсона в избавлении Израиля
  choice: он начнёт спасать Израиль
  alternative: он спасёт Израиль
  rationale: יָחֵל обозначает начало избавления. Опускать «начнёт» значило бы устранять существенное повествовательное ограничение роли Самсона.
translation_notes:
  register: Современный литературный русский с умеренно торжественной библейской окраской. Термин «назорей» и образы «чрево» и «рука филистимлян» сохранены ради точности и межтекстовых связей; синтаксис остаётся понятным обычному читателю.
