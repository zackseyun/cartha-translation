base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: ru
  text: И Бог услышал голос Маноя, и ангел Божий снова пришёл к женщине, когда она сидела в поле, а её мужа Маноя не было с ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: В сочетании с בְּקוֹל глагол выражает не только восприятие звука, но и благосклонное внимание к просьбе Маноя. Русское «услышал» естественно передаёт оба оттенка в данном контексте.
- source_word: בְּקוֹל מָנוֹחַ
  choice: голос Маноя
  rationale: Сохранён образный еврейский оборот «услышать голос», понятный и естественный по-русски; замена на «просьбу» была бы более истолковательной.
- source_word: מָנוֹחַ
  choice: Маной
  rationale: Имя передано в принятой русской библейской форме; в родительном падеже — «Маноя».
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: ангел Божий
  rationale: В повествовании מַלְאָךְ обозначает сверхъестественного Божьего посланника; традиционное и современно понятное русское соответствие — «ангел Божий».
- source_word: עוֹד
  choice: снова
  rationale: Наречие указывает на повторное явление ангела; «снова» кратко и естественно передаёт этот смысл.
- source_word: הָאִשָּׁה
  choice: женщина
  rationale: Сохранено обозначение исходного текста, поддерживающее последовательность повествования и не заменяющее его более конкретным «жена».
- source_word: וְהִיא יוֹשֶׁבֶת בַּשָּׂדֶה
  choice: когда она сидела в поле
  rationale: Причастная конструкция задаёт фоновое обстоятельство прихода; «когда она сидела» естественно передаёт его по-русски.
- source_word: אִישָׁהּ
  choice: её мужа
  rationale: אִישׁ с суффиксом женского рода в данном семейном контексте идиоматически означает «её муж».
- source_word: אֵין עִמָּהּ
  choice: не было с ней
  rationale: Отрицательная бытийная конструкция с עִם обозначает отсутствие рядом; выбран прямой и естественный русский оборот.
theological_decisions:
- issue: Передача הָאֱלֹהִים
  choice: Бог / Божий
  alternative: боги / богов
  rationale: Несмотря на морфологически множественную форму אֱלֹהִים, единственное число глагола и контекст ясно указывают на Бога Израиля. В сочетании מַלְאַךְ הָאֱלֹהִים естественная русская форма — «ангел Божий».
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксическая последовательность еврейского текста в основном сохранена, но обстоятельственная причастная конструкция передана естественным русским придаточным. Архаизмы не использованы.
