base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
translation:
  language: ru
  text: 'Когда Гедеон пришёл, он увидел, как один человек рассказывал своему товарищу сон. Он сказал: «Смотри, мне приснился сон: вот, круглая ячменная лепёшка[a] катилась, переворачиваясь, по стану мадианитян. Она докатилась до шатра, ударила его, так что он упал, перевернула его вверх дном — и шатёр рухнул».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ячменный каравай» или «ячменный хлеб». Значение редкого еврейского слова, переведённого как «круглая лепёшка», точно не установлено; вероятно, оно обозначает круглую лепёшку или буханку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גִדְעוֹן
  choice: Когда Гедеон подошёл
  rationale: Последовательная глагольная форма продолжает повествование, а контекстуальное «подошёл» естественно передаёт прибытие Гедеона к месту, где он услышал разговор.
- source_word: וְהִנֵּה
  choice: вот / слушай / вот
  rationale: Частица привлекает внимание и придаёт сцене живость. В повествовании ей соответствует «вот», а в прямой речи первое употребление естественно передано словом «слушай».
- source_word: מְסַפֵּר לְרֵעֵהוּ חֲלוֹם
  choice: рассказывал своему товарищу сон
  rationale: Причастие обозначает продолжающееся действие; «товарищ» уместно в военном окружении и не предполагает близкой дружбы.
- source_word: הִנֵּה חֲלוֹם חָלַמְתִּי
  choice: Слушай, мне приснился сон
  rationale: Русская конструкция с однокоренными словами «снился сон» сохраняет присущее еврейскому выражению повторение, оставаясь естественной.
- source_word: צלול לֶחֶם שְׂעֹרִים
  choice: круглая ячменная лепёшка
  rationale: Редкое слово צלול, вероятно, обозначает круглый хлеб или лепёшку; выбранный вариант передаёт вероятную форму и материал, а неопределённость отмечена в сноске.
- source_word: מִתְהַפֵּךְ
  choice: катилась, переворачиваясь
  rationale: Возвратная порода передаёт движение с переворачиванием; такая формулировка сохраняет наглядный образ катящейся лепёшки.
- source_word: בְּמַחֲנֵה מִדְיָן
  choice: по стану мадианитян
  rationale: Предлог ב помещает движение внутри стана; «по стану» естественно выражает движение в его пределах, не превращая предлог однозначно в «в стан».
- source_word: וַיָּבֹא עַד הָאֹהֶל
  choice: докатилась до шатра
  rationale: עַד обозначает достижение предела, а «докатилась» связывает прибытие с ранее описанным движением.
- source_word: וַיַּכֵּהוּ וַיִּפֹּל
  choice: ударила его, так что он упал
  rationale: 'Род русских существительных ясно показывает: лепёшка ударяет шатёр, после чего шатёр падает; причинная связь соответствует последовательности образа.'
- source_word: וַיַּהַפְכֵהוּ לְמַעְלָה וְנָפַל הָאֹהֶל
  choice: перевернула его вверх дном — и шатёр рухнул
  rationale: Субъектом действия остаётся лепёшка, а объектом — шатёр. «Вверх дном» естественно передаёт опрокидывание, а «рухнул» сохраняет разрушительный смысл заключительного повторного упоминания падения.
