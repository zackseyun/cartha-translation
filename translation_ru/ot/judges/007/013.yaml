translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Стан» и «шатёр» сохраняют историческую обстановку, но остаются понятными современному читателю. Живость повторяющейся частицы הִנֵּה передана без архаичного «се».
