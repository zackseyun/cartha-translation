  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל גִּדְע֔וֹן רַ֗ב הָ/עָם֙ אֲשֶׁ֣ר אִתָּ֔/ךְ מִ/תִּתִּ֥/י אֶת מִדְיָ֖ן בְּ/יָדָ֑/ם פֶּן יִתְפָּאֵ֨ר עָלַ֤/י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יָדִ֖/י הוֹשִׁ֥יעָה לִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
translation:
  language: ru
  text: 'И сказал Яхве Гедеону: «Народа с тобой слишком много, чтобы Мне отдать Мадиан в их руки[a], чтобы Израиль не стал превозноситься надо Мной, говоря: „Моя рука спасла меня[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в их руку». В еврейском языке единственное число «рука» часто обозначает власть или контроль.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избавила меня». Еврейский глагол может означать как «спасти», так и «избавить».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: רַב הָעָם אֲשֶׁר אִתָּךְ
  choice: Народа с тобой слишком много
  rationale: רַב буквально означает «многочислен», но следующая конструкция показывает, что речь идёт об избыточной численности; русская формулировка естественно передаёт этот смысл.
- source_word: מִתִּתִּי אֶת־מִדְיָן בְּיָדָם
  choice: чтобы Я отдал Мадиан в их руки
  rationale: Сохраняется обычная библейская идиома передачи врага во власть победителя; русское множественное «руки» звучит естественнее при множественном обладателе.
- source_word: פֶּן
  choice: иначе
  rationale: Ясно и современно вводит нежелательное возможное следствие, сохраняя предупредительный смысл частицы.
- source_word: יִתְפָּאֵר עָלַי
  choice: станет хвалиться передо Мной
  rationale: Передаёт самовосхваление Израиля в противопоставлении Богу, не усиливая выражение до прямого вызова.
- source_word: יָדִי הוֹשִׁיעָה לִּי
  choice: Моя рука спасла меня
  rationale: Сохраняет образ руки как собственной силы и единственное число, поскольку Израиль представлен в еврейском тексте как собирательное лицо.
theological_decisions:
- issue: Передача имени Бога
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Тетраграмматон передан как личное имя, без замены титулом.
- issue: Израиль как собирательное лицо
  choice: Израиль станет хвалиться… «Моя рука спасла меня»
  alternative: Израильтяне станут хвалиться… «Наши руки спасли нас»
  rationale: Единственное число исходного текста сохранено, чтобы не сглаживать его образ Израиля как единого лица.
- issue: Характер хвастовства Израиля
  choice: хвалиться передо Мной
  alternative: хвалиться против Меня; возгордиться передо Мной
  rationale: Формулировка сохраняет направленность самовосхваления по отношению к Богу и не делает её смысл более узким, чем допускает עָלַי.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; сохранены личное имя Яхве, собирательное единственное число «Израиль» и образ руки как силы.
