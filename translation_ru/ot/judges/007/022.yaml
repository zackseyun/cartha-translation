  text: וַֽ/יִּתְקְעוּ֮ שְׁלֹשׁ מֵא֣וֹת הַ/שּׁוֹפָרוֹת֒ וַ/יָּ֣שֶׂם יְהוָ֗ה אֵ֣ת חֶ֥רֶב אִ֛ישׁ בְּ/רֵעֵ֖/הוּ וּ/בְ/כָל הַֽ/מַּחֲנֶ֑ה וַ/יָּ֨נָס הַֽ/מַּחֲנֶ֜ה עַד בֵּ֤ית הַשִּׁטָּה֙ צְֽרֵרָ֔תָ/ה עַ֛ד שְׂפַת אָבֵ֥ל מְחוֹלָ֖ה עַל טַבָּֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/022.yaml
  text: When the three hundred trumpets were blown[a], Yahweh set every man's sword against his companion and against the whole camp, and the camp fled as far as Beth-shittah toward Zererah, as far as the edge of Abel-meholah[d][c][b], by Tabbath.
translation:
  language: ru
  text: Когда затрубили в триста рогов[a], Яхве обратил меч каждого против его товарища во всём стане[b]. И войско обратилось в бегство до Бейт-Шитты, в направлении Цереры, до края[d] Авель-Мехолы, близ Таббата[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда затрубили в триста труб». Древнееврейское слово обозначает сигнальный рог; такие рога часто изготовляли из бараньего рога.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также перевод: «Яхве обратил меч каждого против его товарища и против всего стана». Древнееврейская фраза может указывать либо на взаимное поражение, охватившее весь стан, либо на направленность мечей против стана в целом.'
    reason: alternative_reading
  - marker: c
    text: Бейт-Шитта, Церера, Авель-Мехола и Таббат — географические названия на пути бегущего войска.
    reason: cultural_note
  - marker: d
    text: 'Или: «окраины», «границы» или «берега» Авель-Мехолы. Древнееврейское слово буквально означает «край, кромка»; текст не уточняет, идёт ли речь о береговой линии.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקְעוּ ... שְׁלֹשׁ מֵאוֹת הַשּׁוֹפָרוֹת
  choice: Когда затрубили триста рогов
  rationale: Глагол передаёт трубный сигнал, а שׁוֹפָר — сигнальный рог, нередко бараний. Безличная русская конструкция естественна и не решает жёстко синтаксический вопрос о том, названы ли рога объектом или грамматическим субъектом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: וַיָּשֶׂם ... אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: обратил меч каждого против другого
  rationale: Сохранены распределительное значение אִישׁ и образ меча, направленного против находящегося рядом соратника; «другого» естественно передаёт взаимное нападение людей одного стана.
- source_word: וּבְכָל הַמַּחֲנֶה
  choice: по всему стану
  rationale: Так фраза естественно указывает на распространение взаимной резни по всему лагерю; грамматически возможное понимание «против всего стана» отмечено в сноске.
- source_word: וַיָּנָס הַמַּחֲנֶה
  choice: И стан обратился в бегство
  rationale: מַחֲנֶה может обозначать как лагерь, так и находящееся в нём войско. «Стан» сохраняет повтор исходного слова, а выражение «обратился в бегство» ясно относится к людям.
- source_word: עַד בֵּית הַשִּׁטָּה צְרֵרָתָה
  choice: до Бейт-Шитты, в сторону Цереры
  rationale: Направительное окончание в צְרֵרָתָה передано словами «в сторону», а топонимы транслитерированы с древнееврейского.
- source_word: שְׂפַת אָבֵל מְחוֹלָה
  choice: окраины Авель-Мехолы
  rationale: שָׂפָה буквально означает «край, кромка, берег». Нейтральное «окраина» подходит к географическому названию и не вводит явно не названный водоём.
- source_word: עַל טַבָּת
  choice: близ Таббата
  rationale: Предлог перед топонимом, вероятно, указывает на близость; «близ» сохраняет пространственную неопределённость выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Форма «Яхве» прямо передаёт тетраграмматон и не подменяет его титулом.
- issue: Причина взаимной резни в стане
  choice: Яхве обратил меч каждого против другого
  alternative: люди сами в смятении напали друг на друга
  rationale: Каузативное действие прямо приписано Яхве; перевод сохраняет это богословское утверждение текста и не сводит событие лишь к психологически объяснимой панике.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Стан» выбран ради сохранения повторения מַחֲנֶה и понятен из контекста; топонимы переданы непосредственно с древнееврейского. Синтаксическая и географическая неоднозначность вынесена в краткие сноски.
