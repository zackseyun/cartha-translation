revisions:
- from: И взяли они в руки припасы народа и их рога[a]. Всех остальных израильтян Гедеон отпустил, каждого в свой шатёр, а триста человек оставил при себе. Стан мадианитян находился ниже него, в долине.
  to: И они взяли припасы народа в свои руки и их рога[a]. Гедеон отпустил всех израильтян, каждого в свой шатёр, а триста человек оставил при себе. Стан мадианитян находился ниже него, в долине.
