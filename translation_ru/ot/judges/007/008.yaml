base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
translation:
  language: ru
  text: И они взяли припасы народа в свои руки и их рога[a]. Гедеон отпустил всех израильтян, каждого в свой шатёр, а триста человек оставил при себе. Стан мадианитян находился ниже него, в долине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трубы»; еврейское слово означает рог, использовавшийся как сигнальный инструмент.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: взяли они
  rationale: Простая повествовательная форма глагола לקח; множественное число указывает на отобранных воинов.
- source_word: צֵדָה הָעָם
  choice: припасы народа
  rationale: צֵדָה обозначает дорожный или военный запас провизии; родительный оборот сохраняет формальную связь с הָעָם.
- source_word: בְּיָדָם
  choice: в руки
  rationale: В сочетании с глаголом «взяли» русское направление «в руки» естественно передаёт обладание и ношение, выраженные еврейским בְּ.
- source_word: שׁוֹפְרֹתֵיהֶם
  choice: их рога
  rationale: שׁוֹפָר — сигнальный духовой инструмент из рога; «рога» сохраняет конкретный образ и не отождествляет его с современной металлической трубой.
- source_word: שִׁלַּח
  choice: Гедеон отпустил
  rationale: В контексте глагол означает, что Гедеон отослал распущенных воинов; имя субъекта добавлено для ясности после предшествующего множественного числа.
- source_word: כָּל אִישׁ יִשְׂרָאֵל ... אִישׁ לְאֹהָלָיו
  choice: всех остальных израильтян, каждого в свой шатёр
  rationale: Передана распределительная конструкция; «остальных» проясняет противопоставление трёмстам и подразумевается контекстом.
- source_word: וּבִשְׁלֹשׁ מֵאוֹת הָאִישׁ הֶחֱזִיק
  choice: а триста человек оставил при себе
  rationale: הֶחֱזִיק здесь означает удержать или оставить выбранную группу; русский оборот естественно выражает контраст с отпущенными.
- source_word: מַחֲנֵה מִדְיָן
  choice: стан мадианитян
  rationale: «Стан» — понятное литературное обозначение военного лагеря; конструкция принадлежности передана этнонимом во множественном числе.
- source_word: מִתַּחַת בָּעֵמֶק
  choice: ниже него, в долине
  rationale: 'Сохраняется топографическое соотношение: Гедеон находится выше, а стан — в расположенной ниже долине.'
