  text: וַֽ/יִּלְכְּד֡וּ שְׁנֵֽי שָׂרֵ֨י מִדְיָ֜ן אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֗ב וַ/יַּהַרְג֨וּ אֶת עוֹרֵ֤ב בְּ/צוּר עוֹרֵב֙ וְ/אֶת זְאֵב֙ הָרְג֣וּ בְ/יֶֽקֶב זְאֵ֔ב וַֽ/יִּרְדְּפ֖וּ אֶל מִדְיָ֑ן וְ/רֹאשׁ עֹרֵ֣ב וּ/זְאֵ֔ב הֵבִ֨יאוּ֙ אֶל גִּדְע֔וֹן מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
translation:
  language: ru
  text: Они захватили двух мадиамских князей[a] — Орива и Зива. Орива убили у скалы Орива, а Зива — у виноградной давильни Зива. Затем они преследовали Мадиан, а головы Орива и Зива принесли Гедеону с той стороны Иордана[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имена Орив и Зив связаны с еврейскими словами «ворон» и «волк» соответственно, но в основном тексте переданы как личные имена.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «из-за Иордана».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: князей
  rationale: Слово שַׂר обозначает правителя, военачальника или знатного вождя. «Князья» сохраняет высокий политико-военный статус этих мадиамских предводителей и соответствует библейскому повествовательному регистру.
- source_word: וַיִּלְכְּדוּ
  choice: захватили
  rationale: Глагол לָכַד в военном контексте означает «захватить, взять в плен»; последующая казнь показывает, что речь идёт о захваченных людях.
- source_word: עֹרֵב
  choice: Орив
  rationale: Личное имя передано в принятой русской библейской форме, хотя оно связано с еврейским словом «ворон».
- source_word: זְאֵב
  choice: Зив
  rationale: Личное имя передано в принятой русской библейской форме, хотя его нарицательное значение — «волк».
- source_word: בְּצוּר עוֹרֵב
  choice: у скалы Орива
  rationale: צוּר означает «скала, утёс». Предлог ב здесь естественно передаётся как указание на место — «у»; сочетание сохраняет возможное этиологическое название места.
- source_word: בְיֶקֶב זְאֵב
  choice: у давильни Зива
  rationale: יֶקֶב — давильня для винограда или виноградный пресс. «У давильни» нейтрально передаёт местонахождение, не уточняя, произошло ли убийство внутри сооружения.
- source_word: וַיִּרְדְּפוּ אֶל מִדְיָן
  choice: Затем они преследовали Мадиан
  rationale: Конструкция רָדַף с אֶל выражает продолжение погони за Мадианом, то есть за мадиамскими силами. «Затем» естественно передаёт последовательность повествования.
- source_word: וְרֹאשׁ עֹרֵב וּזְאֵב
  choice: а головы Орива и Зива
  rationale: 'Хотя רֹאשׁ формально стоит в единственном числе, два согласованных имени требуют распределительного понимания: были принесены головы обоих предводителей.'
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: с той стороны Иордана
  rationale: Фраза означает «из-за/с другой стороны Иордана». Русское выражение сохраняет пространственную перспективу, которая без более широкого контекста может быть неоднозначной.
