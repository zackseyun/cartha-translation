  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן עוֹד֮ הָ/עָ֣ם רָב֒ הוֹרֵ֤ד אוֹתָ/ם֙ אֶל הַ/מַּ֔יִם וְ/אֶצְרְפֶ֥/נּוּ לְ/ךָ֖ שָׁ֑ם וְ/הָיָ֡ה אֲשֶׁר֩ אֹמַ֨ר אֵלֶ֜י/ךָ זֶ֣ה יֵלֵ֣ךְ אִתָּ֗/ךְ ה֚וּא יֵלֵ֣ךְ אִתָּ֔/ךְ וְ/כֹ֨ל אֲשֶׁר אֹמַ֜ר אֵלֶ֗י/ךָ זֶ֚ה לֹא יֵלֵ֣ךְ עִמָּ֔/ךְ ה֖וּא לֹ֥א יֵלֵֽךְ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: ru
  text: 'Тогда Господь сказал Гедеону: «Народа всё ещё слишком много. Отведи их к воде, и там Я испытаю их для тебя. И будет так: тот, о ком Я скажу тебе: „Этот пойдёт с тобой“, — пойдёт с тобой; а тот, о ком Я скажу тебе: „Этот не пойдёт с тобой“, — не пойдёт».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и понятная русская передача тетраграмматона; сохраняет достоинство библейского стиля без внесения конфессиональной специфики.
- source_word: רָב
  choice: слишком много
  rationale: В данном контексте слово обозначает не просто многочисленность, а избыточное число воинов, что подтверждается дальнейшим сокращением отряда.
- source_word: הוֹרֵד אוֹתָם
  choice: Отведи их
  rationale: Каузатив глагола ירד буквально означает «спусти их»; нейтральное «отведи» естественно по-русски и не предполагает не указанного в стихе рельефа.
- source_word: וְאֶצְרְפֶנּוּ לְךָ
  choice: и там Я испытаю их для тебя
  rationale: צרף может означать очищение, проверку или испытание. «Испытаю» сохраняет образ проверки и не сводит его заранее только к отбору; коллективный объект «народ» естественно передан местоимением множественного числа.
- source_word: זֶה יֵלֵךְ אִתָּךְ
  choice: Пусть этот идёт с тобой
  rationale: Передаёт указательное «этот» и модальное значение древнееврейской формы без тяжеловесного «этот пойдёт с тобой» внутри прямой речи.
theological_decisions:
- issue: Кто определяет состав отряда
  choice: 'Прямо сохранено Божье решение: «О ком Я скажу тебе…»'
  alternative: Представить происходящее как самостоятельный отбор Гедеона по внешнему признаку
  rationale: Древнееврейский текст подчёркивает, что критерий и итоговое решение принадлежат Господу, а Гедеон получает указание.
- issue: Смысл испытания у воды
  choice: Использовано общее «испытать», без объяснения цели или духовных качеств людей
  alternative: Перевести как «очистить», «отсеять» или приписать испытанию проверку бдительности, веры либо достоинства
  rationale: Сам стих не объясняет, какое качество проверяется; перевод не должен заранее разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм двух решений сохранён, но приспособлен к естественной русской речи.
