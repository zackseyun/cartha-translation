base_translation:
  language: en
  yaml_path: translation/ot/judges/007/017.yaml
  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
translation:
  language: ru
  text: 'И сказал он им: «Смотрите на меня[a] и делайте так же. Вот, когда я окажусь у края лагеря, как сделаю я, так делайте и вы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Наблюдайте за мной».'
    reason: Лексическое сочетание допускает более явную передачу смысла наблюдения за действиями Гедеона как образцом.
lexical_decisions:
- source_word: מִמֶּנִּי תִרְאוּ
  choice: Смотрите на меня
  rationale: Сочетание ראה с מן в данном наставлении призывает воинов наблюдать за Гедеоном как за образцом для своих действий. Русское «смотрите на меня» естественно передаёт этот смысл, не добавляя толкования.
- source_word: וְכֵן תַּעֲשׂוּ
  choice: и делайте так же
  rationale: כֵן указывает на образ действия; выражение передаёт повеление повторять действия Гедеона.
- source_word: וְהִנֵּה
  choice: Вот
  rationale: Частица привлекает внимание к предстоящему действию. «Вот» сохраняет её указательно-эмфатическую функцию и звучит естественно в современном русском языке.
- source_word: אָנֹכִי בָא
  choice: когда я подойду
  rationale: Причастие בָא представляет приближающееся действие. В сочетании с последующей конструкцией по-русски естественно выразить его придаточным времени, сохранив направленность движения к лагерю.
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: к краю лагеря
  rationale: קָצֶה обозначает край или оконечность; «край лагеря» точно и понятно передаёт пространственный образ.
- source_word: כַאֲשֶׁר אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  choice: как сделаю я, так делайте и вы
  rationale: Сохранена еврейская соотносительная конструкция «как… так…» и её директивная сила. Порядок слов подчёркивает, что воины должны повторить действия Гедеона.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сохранены повтор «делайте» и соотносительная формула «как… так…», важные для ритма наставления; архаичное «стан» заменено общеупотребительным «лагерь».
