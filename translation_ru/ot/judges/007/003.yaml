base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
translation:
  language: ru
  text: 'А теперь провозгласи, пожалуйста, во всеуслышание народа: «Кто боится и дрожит, пусть вернётся и уйдёт[a] с горы Галаад[b]». Тогда из народа вернулись двадцать две тысячи человек, а десять тысяч остались.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол וְיִצְפֹּר редок, и его точное значение спорно; возможно, он подразумевает, что человек уйдёт рано или незаметно удалится.
    reason: lexical_alternative
  - marker: b
    text: «Гора Галаад» — прямой перевод еврейского выражения, хотя такое географическое указание в данном контексте вызывает трудности; возможно, имеется в виду более широкая горная область Галаада.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: В отличие от английского консультационного текста, еврейский источник прямо содержит וְעַתָּה — «и теперь». В русском повествовании естественно передать это как «А теперь».
- source_word: קְרָא נָא בְּאָזְנֵי הָעָם
  choice: объяви, пожалуйста, во всеуслышание народу
  rationale: קרא обозначает публичное провозглашение, נָא смягчает повеление, а идиома «в уши народа» указывает на открытое устное объявление. «Во всеуслышание народу» естественно передаёт весь оборот.
- source_word: מִי יָרֵא וְחָרֵד
  choice: Кто боится и дрожит
  rationale: 'Сохраняется усиленная пара: ירא выражает страх, а חרד — дрожь или трепет. Глагольная формулировка звучит естественно и непосредственно по-русски.'
- source_word: יָשֹׁב
  choice: пусть вернётся
  rationale: 'Юссив в составе объявления имеет разрешительно-предписывающий смысл: испугавшемуся велено возвратиться.'
- source_word: וְיִצְפֹּר
  choice: и уйдёт
  rationale: Редкий и спорный глагол в контексте обозначает удаление из собравшегося войска. Нейтральное «уйдёт» не навязывает сомнительный оттенок раннего или поспешного ухода; неопределённость отмечена в сноске.
- source_word: מֵהַר הַגִּלְעָד
  choice: с горы Галаад
  rationale: Единственное число הַר и форма собственного наименования допускают прямой перевод «гора Галаад». Географическая трудность сохраняется в примечании.
- source_word: וַיָּשָׁב מִן הָעָם עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: И вернулись из народа двадцать две тысячи человек
  rationale: Еврейская коллективная конструкция с глаголом в единственном числе перед числительным по-русски естественно передаётся множественным числом. «Человек» добавлено для ясного современного выражения численности.
- source_word: וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ
  choice: а десять тысяч остались
  rationale: נשאר означает «оставаться»; противительный союз «а» ясно сопоставляет оставшихся с ушедшими.
