base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
translation:
  language: ru
  text: Мадианитяне, амаликитяне и все народы Востока[a] расположились станом[b] в долине, многочисленные, как саранча. Верблюдам их не было числа — их было столько же, сколько песка на морском берегу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «все сыны Востока».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское причастие буквально может означать «падающие» или «павшие»; здесь оно описывает войско, расположившееся лагерем в долине.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדְיָן וַעֲמָלֵק
  choice: Мадианитяне, амаликитяне
  rationale: Названия Мадиана и Амалика здесь обозначают соответствующие народы и войска; формы этнонимов естественны и однозначны для современного русского читателя.
- source_word: בְּנֵי קֶדֶם
  choice: народы Востока
  rationale: Буквально «сыны Востока»; это собирательное этногеографическое обозначение восточных племён, поэтому «народы Востока» передаёт смысл естественно и без неоправданного уточнения.
- source_word: נֹפְלִים בָּעֵמֶק
  choice: расположились станом в долине
  rationale: Причастие от נפל буквально связано с падением или лежанием, но в данном военном контексте описывает войско, расположившееся лагерем. Перевод сохраняет картину стоянки и не создаёт ложного впечатления, будто воины погибли.
- source_word: כָּאַרְבֶּה לָרֹב
  choice: многочисленные, как саранча
  rationale: Сравнение подчёркивает огромную численность войска; русская формулировка передаёт образ и значение לָרֹב естественно.
- source_word: וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: Верблюдам их не было числа
  rationale: Близкое и идиоматичное соответствие еврейскому выражению «нет числа», сохраняющее гиперболическую силу.
- source_word: כַּחוֹל שֶׁעַל שְׂפַת הַיָּם לָרֹב
  choice: их было так же много, как песка на морском берегу
  rationale: Передаёт традиционный образ неисчислимого множества и заключительное усиление לָרֹב; местоимение ясно относится к верблюдам.
