lexical_decisions:
- source_word: מִסְפַּר
  choice: число
  rationale: Обычное количественное существительное, вводящее подсчёт выделенной группы; «число» естественно в современном русском языке.
- source_word: הַמֲלַקְקִים
  choice: тех, кто лакал
  rationale: Причастие от לקק передаёт характерное действие этой группы. Глагол «лакать» сохраняет яркий телесный образ, существенный для повествования.
- source_word: בְּיָדָם אֶל־פִּיהֶם
  choice: поднося воду рукой ко рту
  rationale: 'Формулировка естественно передаёт распределительное значение древнееврейских форм единственного числа при местоименных суффиксах множественного числа: каждый подносил воду рукой к своему рту. Добавленное по смыслу слово «воду» делает способ действия ясным, не меняя содержания.'
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: триста человек
  rationale: אִישׁ после числительного здесь обозначает людей мужского пола в военном контексте; русское «человек» является нормативной счётной формой.
- source_word: וְכֹל יֶתֶר הָעָם
  choice: а весь остальной народ
  rationale: Союз «а» естественно выражает противопоставление этой группы трёхсот всем остальным, не усиливая его сверх древнееврейского текста.
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  choice: опустился на колени
  rationale: Передаёт позу буквально по смыслу и звучит естественнее, чем избыточное «преклонил свои колени».
- source_word: לִשְׁתּוֹת מָיִם
  choice: чтобы пить воду
  rationale: Инфинитив выражает цель; явное упоминание воды сохранено вслед за древнееврейским текстом.
