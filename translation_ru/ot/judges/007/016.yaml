  yaml_path: translation/ot/judges/007/016.yaml
  text: Then he divided the three hundred men into three companies[a], and put trumpets into the hands of all of them, and empty jars[c][b], with torches inside the jars.
translation:
  language: ru
  text: Он разделил триста человек на три отряда[a] и дал каждому из них по рогу[b], по пустому кувшину[c] и по факелу в кувшине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на три головы»; это выражение означает три группы или три отряда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «по трубе»; еврейское слово «шофар» означает сигнальный духовой инструмент, обычно сделанный из рога.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «по пустому сосуду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַץ
  choice: разделил
  rationale: Глагол חצה обозначает разделение войска на отдельные группы; «разделил» естественно и точно передаёт действие.
- source_word: שְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: триста человек
  rationale: Сохраняется буквальное значение אִישׁ без излишне уточняющего «воинов».
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: три отряда
  rationale: Буквально «три головы»; здесь רָאשִׁים идиоматически обозначает подразделения войска. «Отряды» естественно для данного контекста.
- source_word: וַיִּתֵּן ... בְּיַד כֻּלָּם
  choice: дал каждому из них по
  rationale: Русская распределительная конструкция «каждому… по» ясно передаёт, что перечисленные предметы получил каждый человек, сохраняя смысл еврейского выражения.
- source_word: שׁוֹפָרוֹת
  choice: рогу
  rationale: שׁוֹפָר — сигнальный духовой инструмент из рога. «Рог» передаёт его предметную форму и не создаёт образ современной металлической трубы.
- source_word: כַדִּים רֵקִים
  choice: пустому кувшину
  rationale: כַּד обозначает сосуд, кувшин или горшок; «кувшин» — ясное и традиционно понятное обозначение переносного глиняного сосуда.
- source_word: לַפִּדִים בְּתוֹךְ הַכַּדִּים
  choice: по факелу внутрь кувшина
  rationale: Передаёт местонахождение каждого факела внутри соответствующего сосуда и согласуется с распределительной конструкцией всего предложения.
