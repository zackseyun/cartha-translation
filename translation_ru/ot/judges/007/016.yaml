  terminology: «Рог» приемлем для שׁוֹפָר, а примечание корректно поясняет инструментальное значение и допускает вариант «труба». «Кувшин» и «факел» точно передают כַּד и לַפִּיד. Примечание к «отрядам» следует грамматически исправить; буквальное «три головы» сохранено без навязывания специальной военной терминологии.
