  verdict: revise
  source_fidelity: 'Основной смысл передан верно: Гедеон делит триста человек на три подразделения и снабжает всех шофарами, пустыми кувшинами и факелами, находящимися в кувшинах. Однако конструкция «по факелу внутрь кувшина» в русском языке не передаёт нормативно значение местонахождения: она может звучать как указание поместить факел внутрь. Нужна явная локативная связь «факелом в кувшине».'
