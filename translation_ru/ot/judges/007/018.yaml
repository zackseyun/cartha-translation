  text: וְ/תָקַעְתִּי֙ בַּ/שּׁוֹפָ֔ר אָנֹכִ֖י וְ/כָל אֲשֶׁ֣ר אִתִּ֑/י וּ/תְקַעְתֶּ֨ם בַּ/שּׁוֹפָר֜וֹת גַּם אַתֶּ֗ם סְבִיבוֹת֙ כָּל הַֽ/מַּחֲנֶ֔ה וַ/אֲמַרְתֶּ֖ם לַ/יהוָ֥ה וּ/לְ/גִדְעֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
translation:
  language: ru
  text: 'Когда я и все, кто со мной, затрубим в рог[a], тогда и вы затрубите в рога вокруг всего лагеря и скажите: «За Яхве и за Гедеона!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово שׁוֹפָר обозначает сигнальный духовой инструмент, обычно сделанный из рога животного, а не металлическую трубу.
    reason: cultural_note
  - marker: b
    text: 'Некоторые традиционные переводы дают здесь: «Меч Яхве и Гедеона!» — под влиянием близкой формулировки в Судей 7:20. Однако еврейский текст этого стиха буквально говорит лишь: «За Яхве и за Гедеона».'
    reason: alternative_reading
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  choice: затрубим / затрубите
  rationale: В сочетании с שׁוֹפָר глагол תקע означает дуть в рог, трубить. Русское «затрубить» естественно передаёт конкретное действие и начало условленного сигнала.
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  choice: рог / рога
  rationale: שׁוֹפָר обозначает духовой сигнальный инструмент из рога животного, а не металлическую трубу. «Рог» понятно современному читателю и сохраняет предметный смысл оригинала.
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  choice: я и все, кто со мной
  rationale: Оборот указывает на Гедеона и сопровождающих его людей. Эта формулировка точна и естественна по-русски.
- source_word: גַּם אַתֶּם
  choice: тогда и вы
  rationale: Частица גַּם включает адресатов в то же действие; конструкция «тогда и вы» естественно передаёт связь с предшествующим условием.
- source_word: סְבִיבוֹת כָּל הַמַּחֲנֶה
  choice: вокруг всего лагеря
  rationale: Фраза выражает расположение отрядов со всех сторон лагеря и сохраняет всеохватность כָּל без тяжеловесного повтора.
- source_word: וַאֲמַרְתֶּם
  choice: скажите
  rationale: В оригинале употреблён обычный глагол אמר «говорить, сказать». Контекст предполагает громкий боевой возглас, но сам глагол не уточняет громкость, поэтому она не добавлена в перевод.
- source_word: לַיהוָה וּלְגִדְעוֹן
  choice: За Яхве и за Гедеона!
  rationale: Повторённый предлог לְ в боевом возгласе выражает выступление за кого-либо или принадлежность его стороне. Повтор «за» сохраняет параллелизм еврейской фразы.
theological_decisions:
- issue: Передача боевого возгласа לַיהוָה וּלְגִדְעוֹן
  choice: «За Яхве и за Гедеона!»
  alternative: «Меч Яхве и Гедеона!»
  rationale: В масоретском тексте данного стиха нет слова «меч»; оно появляется в стихе 20. Перевод не вносит его из соседнего стиха и сохраняет повтор предлога לְ.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит личное имя יהוה. Транслитерация «Яхве» отличает его от титула «Господь» и непосредственно передаёт имя в основном тексте.
translation_notes:
  register: Современный литературный русский язык с ясным, энергичным синтаксисом прямой речи. Сохранены условная последовательность команд, конкретный образ рога и краткость боевого возгласа; не добавлены ни «меч», ни указание кричать.
