base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
translation:
  language: ru
  text: 'В ту ночь Яхве сказал ему: «Встань и спустись в стан, ибо Я отдал его в твою руку[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в твою руку»; это еврейское выражение означает «под твою власть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: В ту ночь
  rationale: Формула וַיְהִי вводит новую сцену повествования; в современном русском её функцию естественно передаёт временное начало без тяжеловесного «и случилось».
- source_word: וַיֹּאמֶר אֵלָיו
  choice: сказал ему
  rationale: Прямое и обычное соответствие глаголу אמר с указанием адресата.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: קוּם רֵד
  choice: Встань и спустись
  rationale: Два повелительных глагола выражают призыв немедленно подняться и направиться вниз; союз «и» делает сочетание естественным по-русски.
- source_word: בַּמַּחֲנֶה
  choice: в стан
  rationale: При глаголе движения предлог בְּ обозначает движение внутрь лагеря; «стан» сохраняет возвышенный повествовательный регистр и военный контекст.
- source_word: כִּי
  choice: ибо
  rationale: Вводит основание повеления; «ибо» ясно сохраняет причинную связь и соответствует достоинству библейской речи.
- source_word: נְתַתִּיו
  choice: Я отдал его
  rationale: Суффикс мужского рода отсылает к стану как к вражеской силе; перфект изображает передачу как уже совершённое и решённое Богом действие.
- source_word: בְּיָדֶךָ
  choice: в твою руку
  rationale: Сохраняет форму еврейской идиомы в единственном числе и её образ передачи во власть адресата.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет это различие и не подменяет имя титулом.
- issue: Значение совершенного вида נְתַתִּיו в Божьем обещании
  choice: Я отдал его
  alternative: Я отдам его
  rationale: Перевод сохраняет совершённый ракурс еврейского перфекта и напряжение между уже данным Богом исходом и ещё предстоящим сражением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Начальная повествовательная формула передана естественно, без архаизма «и было». Образ «в твою руку» сохранён и пояснён сноской.
