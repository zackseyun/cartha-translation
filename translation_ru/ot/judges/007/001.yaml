base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
translation:
  language: ru
  text: Иеруббаал, то есть Гедеон, встал рано утром вместе со всем народом, который был с ним, и они разбили лагерь у источника Харод[a]. Лагерь Мадиана находился к северу от него, у холма Море, в долине.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у Эн-Харода». Еврейское название буквально включает слово «источник».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: рано утром … встали
  rationale: Глагол שׁכם в породе hифиль означает «встать рано». В русском множественное число естественно согласуется с составным подлежащим «Иеруббаал… и весь народ», тогда как временной оттенок сохранён выражением «рано утром».
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  choice: Иеруббаал, то есть Гедеон
  rationale: Местоимение הוּא имеет пояснительно-отождествляющую функцию. Оборот «то есть» естественно показывает, что оба имени относятся к одному человеку.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: и весь народ, бывший с ним
  rationale: Сохранено широкое значение עָם «народ, люди» без замены на более узкое военное «войско».
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Глагол חנה означает остановиться и разбить лагерь. Выражение «расположились станом» передаёт действие ясно и в достойном повествовательном регистре.
- source_word: עַל עֵין חֲרֹד
  choice: у источника Харод[a]
  rationale: עֵין обозначает источник и одновременно входит в состав топонима. Основной текст передаёт значение элемента названия, а сноска сохраняет возможность транслитерации всего топонима.
- source_word: וּמַחֲנֵה מִדְיָן
  choice: Стан Мадиана
  rationale: Сохранена конструкция с названием Мадиана, а не внесено отсутствующее в еврейском тексте этническое прилагательное «мадианитян».
- source_word: הָיָה לוֹ מִצָּפוֹן
  choice: находился к северу от него
  rationale: Единственное число суффикса לוֹ передано как «от него», с отнесением к Гедеону как названному предводителю; текст не сглажен до множественного «от них».
- source_word: מִגִּבְעַת הַמּוֹרֶה
  choice: у холма Море
  rationale: Предлог מִן в данном топографическом описании понят как указание на расположение относительно холма, а не обязательно как обозначение движения от него.
- source_word: בָּעֵמֶק
  choice: в долине
  rationale: עֵמֶק обычно обозначает долину; прямой русский эквивалент точно передаёт рельеф местности.
