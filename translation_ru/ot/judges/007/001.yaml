revisions:
- from: Рано утром Иеруббаал, то есть Гедеон, и весь народ, бывший с ним, встали и расположились станом у источника Харод[a]. Стан Мадиана находился к северу от него, у холма Море, в долине.
  to: Иеруббаал, то есть Гедеон, встал рано утром вместе со всем народом, который был с ним, и они разбили лагерь у источника Харод[a]. Лагерь Мадиана находился к северу от него, у холма Море, в долине.
  rationale: Исправленное предложение воспроизводит единственное число первого глагола по отношению к Гедеону и последующее множественное число при разбивке лагеря. Остальные изменения носят стилистический характер и не изменяют значения, топографии или терминологии оригинала. Маркер и содержание сноски сохранены.
