  text: וַ/יָּבֹ֣א גִ֠דְעוֹן וּ/מֵאָה אִ֨ישׁ אֲשֶׁר אִתּ֜/וֹ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה רֹ֚אשׁ הָ/אַשְׁמֹ֣רֶת הַ/תִּֽיכוֹנָ֔ה אַ֛ךְ הָקֵ֥ם הֵקִ֖ימוּ אֶת הַ/שֹּֽׁמְרִ֑ים וַֽ/יִּתְקְעוּ֙ בַּ/שּׁ֣וֹפָר֔וֹת וְ/נָפ֥וֹץ הַ/כַּדִּ֖ים אֲשֶׁ֥ר בְּ/יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
translation:
  language: ru
  text: И пришёл Гедеон со ста людьми, которые были с ним, к краю стана в начале средней стражи[a], как раз когда расставили часовых. Они затрубили в рога[b] и разбили кувшины, которые держали в руках.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть в начале одной из частей, на которые делили ночь для несения стражи; возможно также: «в начале второй стражи».'
    reason: lexical_alternative
  - marker: b
    text: Евр. шофарот — сигнальные рога, обычно изготовлявшиеся из рогов животных.
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: к краю стана
  rationale: קָצֶה обозначает край или оконечность; конструкция с ב здесь в контексте глагола движения естественно передаётся как прибытие к краю. «Стан» сохраняет военный контекст и достоинство регистра.
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  choice: в начале средней стражи
  rationale: רֹאשׁ идиоматически обозначает начало временного отрезка, а אַשְׁמֹרֶת — часть ночи, в течение которой несут караул. Буквальный образ «головы» по-русски здесь неестественен.
- source_word: אַךְ הָקֵם הֵקִימוּ אֶת־הַשֹּׁמְרִים
  choice: как раз когда расставили часовых
  rationale: אַךְ указывает на точное совпадение по времени, а сочетание инфинитива абсолютного с личной формой Hiphil קום подчёркивает действие назначения или расстановки. «Часовые» естественно передаёт военную функцию הַשֹּׁמְרִים.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: они затрубили в рога
  rationale: שׁוֹפָר — сигнальный рог, а не металлическая труба в современном смысле. «Затрубили в рога» точно передаёт и предмет, и действие.
- source_word: וְנָפוֹץ הַכַּדִּים
  choice: и разбили кувшины
  rationale: נפץ выражает сильное разбивание, а כַּד — сосуд, кувшин. «Разбили» звучит естественно и достаточно передаёт резкость действия без добавления отсутствующего в тексте материала сосуда.
- source_word: אֲשֶׁר בְּיָדָם
  choice: которые держали в руках
  rationale: Формально «которые были в их руках»; по-русски «держали в руках» естественно и без смыслового расширения описывает носимые ими кувшины.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Сохранено традиционное военное слово «стан», но вместо потенциально двусмысленных современных «труб» выбраны точные «рога». Порядок событий передан короткими ясными предложениями.
