  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן בִּ/שְׁלֹשׁ֩ מֵא֨וֹת הָ/אִ֤ישׁ הַֽ/מֲלַקְקִים֙ אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וְ/נָתַתִּ֥י אֶת מִדְיָ֖ן בְּ/יָדֶ֑/ךָ וְ/כָל הָ/עָ֔ם יֵלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/007.yaml
  text: And Yahweh said to Gideon[a], “With the three hundred men who lapped, I will save you and give Midian into your hand. And let all the people go, each man to his place.”
translation:
  language: ru
  text: 'И сказал Яхве Гедеону: «С помощью тех трёхсот человек, которые лакали[a], Я спасу вас и предам Мадиан в твои руки. А все остальные пусть идут — каждый на своё место».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Посредством тех трёхсот человек, которые лакали, Я избавлю вас».'
    reason: Предлог בְּ имеет инструментальное значение; возможен более формальный вариант передачи средства, а глагол «избавлю» передаёт тот же смысл, что и «спасу».
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом «Господь».
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: с помощью тех трёхсот человек
  rationale: Предлог בְּ имеет инструментальное значение; оборот естественен по-русски и показывает, что избавление будет совершено посредством этой группы.
- source_word: הַמֲלַקְקִים
  choice: которые лакали
  rationale: Сохраняет конкретное действие, по которому были выделены эти люди, и не повторяет подразумеваемое из контекста слово «вода».
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: Я спасу вас
  rationale: Глагол ישׁע в породе хифиль означает «спасти, избавить»; местоимение передано во множественном числе, как в еврейском тексте.
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  choice: и предам Мадиан в твои руки
  rationale: Сохраняет прозрачный библейский образ передачи противника под власть Гедеона; русское устойчивое выражение требует множественного числа «руки», хотя в еврейском стоит единственное.
- source_word: וְכָל הָעָם
  choice: весь остальной народ
  rationale: «Народ» сохраняет значение עָם, а «остальной» ясно выражает контекстуальное противопоставление трёмстам избранным, не меняя референта.
- source_word: יֵלְכוּ
  choice: пусть разойдётся
  rationale: Передаёт юссивную силу имперфекта как распоряжение отпустить остальных.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: каждый к себе
  rationale: Естественный русский способ передать распределительное выражение «каждый на своё место», подразумевающее возвращение людей от места сбора.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблён тетраграмматон; транслитерация сохраняет личное заветное имя и не подменяет его титулом.
- issue: Число адресатов в обещании спасения
  choice: «спасу вас» во множественном числе
  alternative: «спасу тебя» как обращение только к Гедеону
  rationale: Дополнение אֶתְכֶם морфологически стоит во множественном числе, тогда как следующее «твои» обращено к Гедеону в единственном; этот контраст сохранён.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис упрощён для ясности, но сохранены имя Яхве, образ передачи Мадиана «в руки» Гедеона и различие между множественным «вас» и единственным «твои».
