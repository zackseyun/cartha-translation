revisions:
- from: 'И сказал Яхве Гедеону: «С помощью тех трёхсот человек, которые лакали[a], Я спасу вас и предам Мадиан в твои руки. А весь остальной народ пусть разойдётся — каждый к себе».'
  to: 'И сказал Яхве Гедеону: «С помощью тех трёхсот человек, которые лакали[a], Я спасу вас и предам Мадиан в твои руки. А все остальные пусть идут — каждый на своё место».'
  rationale: Убрано избыточное «народ» с добавочным определением «остальной» и употреблено естественное «все остальные», которое в контексте ясно обозначает неотобранных людей. Заключительный оборот исправлен на «каждый на своё место», чтобы не сужать значение еврейского לִמְקֹמוֹ. Сноска приведена к полному альтернативному чтению, как в английском аудиторском следе.
