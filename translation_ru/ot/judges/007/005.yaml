base_translation:
  language: en
  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
translation:
  language: ru
  text: 'И он свёл народ к воде. Яхве сказал Гедеону: «Всякого, кто будет лакать воду языком, как лакает собака, поставь отдельно[a]; так же поступи и со всяким, кто опустится на колени, чтобы пить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поставь его особняком»; глагол может означать, что человека ставят или размещают отдельно от других.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶד
  choice: свёл
  rationale: Каузативная форма глагола ירד указывает, что Гедеон привёл народ вниз, к воде. «Свёл» естественно передаёт и движение вниз, и каузативный смысл.
- source_word: הָעָם
  choice: народ
  rationale: עם — общее собирательное обозначение людей. Военный контекст допускает «войско», но исходное слово остаётся более широким.
- source_word: הַמָּיִם
  choice: вода / к воде
  rationale: Хотя מים имеет форму множественного числа, обычно это вещественное существительное; по-русски здесь естественно единственное число.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не замещающий его титул.
- source_word: כֹּל אֲשֶׁר יָלֹק
  choice: всякого, кто будет лакать
  rationale: Конструкция имеет распределительное значение и относится к каждому человеку; «лакать» сохраняет яркий образ исходного текста.
- source_word: בִּלְשׁוֹנוֹ
  choice: языком
  rationale: Сохраняется конкретная деталь способа питья; принадлежность языка каждому человеку ясна из русской конструкции.
- source_word: מִן הַמַּיִם
  choice: воду
  rationale: Предлог מן обозначает питьё из источника или взятие части воды; в русском после «лакать» естественно прямое дополнение «воду».
- source_word: כַּאֲשֶׁר יָלֹק הַכֶּלֶב
  choice: как лакает собака
  rationale: Сохраняется явное и наглядное сравнение; единственное число имеет обобщённое значение.
- source_word: תַּצִּיג אוֹתוֹ לְבָד
  choice: поставь отдельно
  rationale: Каузативная форма יצג означает поставить или расположить, а לְבָד подчёркивает отделение человека от остальных.
- source_word: וְכֹל אֲשֶׁר יִכְרַע עַל בִּרְכָּיו לִשְׁתּוֹת
  choice: так же поступи и со всяким, кто опустится на колени, чтобы пить
  rationale: Глагол כרע означает опуститься или встать на колени. В еврейском тексте повеление во второй части подразумевается; русская формулировка делает этот эллипсис понятным, не уточняя сверх текста, в какую именно группу следует поставить людей.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, присутствующее в исходном тексте, не заменяя его титулом.
- issue: Подразумеваемое повеление во второй части высказывания
  choice: так же поступи и со всяким
  alternative: и всякого, кто опустится на колени, чтобы пить
  rationale: В еврейском тексте после первой команды следует вторая категория людей без повторения глагола. Перевод восполняет только необходимый для русского синтаксиса смысл и сохраняет неопределённость относительно дальнейшего расположения второй группы.
translation_notes:
  register: Современный литературный русский язык с простым, но достойным библейским звучанием. Образ собаки и конкретные действия людей сохранены; избыточная буквальность вроде «преклонит колени на коленях» устранена.
