base_translation:
  language: en
  yaml_path: translation/ot/judges/007/011.yaml
  text: and you will hear what they are saying[a], and afterward your hands will be strengthened[b], and you will go down into the camp.” So he went down with Purah his servant to the edge of the armed men who were in the camp.
translation:
  language: ru
  text: «И услышишь, что они говорят. После этого руки твои окрепнут[a], и ты спустишься в стан». И он спустился вместе с Пурой, своим слугой[b], к краю вооружённых людей[c], находившихся в стане.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ты ободришься и станешь решительнее; буквально говорится об окрепших руках.
    reason: idiom_explanation
  - marker: b
    text: 'Или: «своим юношей»; слово נַעַר может обозначать также молодого помощника или сопровождающего.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к окраине вооружённых отрядов»; еврейское слово обозначает снаряжённых для боя людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ מַה יְדַבֵּרוּ
  choice: И услышишь, что они говорят
  rationale: Последовательность форм передаёт будущее действие; настоящее время «говорят» естественно описывает речь, которую Гедеон услышит на месте.
- source_word: תֶּחֱזַקְנָה יָדֶיךָ
  choice: руки твои окрепнут
  rationale: Сохранён конкретный древнееврейский образ рук как выражение силы, решимости и мужества; форма חזק здесь естественно передаётся непереходным глаголом «окрепнут».
- source_word: וְיָרַדְתָּ בַּמַּחֲנֶה
  choice: и ты спустишься в стан
  rationale: ירד означает движение вниз, а предлог בְּ в данном контексте указывает на вход в стан.
- source_word: וַיֵּרֶד הוּא וּפֻרָה
  choice: И он спустился вместе с Пурой
  rationale: Повествовательная форма продвигает рассказ; местоимение «он» сохранено. Имя פֻּרָה передано непосредственно с еврейского как «Пура».
- source_word: נַעֲרוֹ
  choice: своим слугой
  rationale: נַעַר может означать юношу, слугу или сопровождающего; в военном контексте естественнее «слуга», при сохранении альтернатив в примечании.
- source_word: אֶל קְצֵה הַחֲמֻשִׁים
  choice: к самому краю расположения вооружённых людей
  rationale: קצה обозначает край или оконечность, а חֲמֻשִׁים — людей, снаряжённых или вооружённых для боя. Слово «расположение» делает пространственное отношение понятным по-русски, не устраняя значения края воинской группы.
theological_decisions:
- issue: Образ укрепившихся рук
  choice: 'Сохранить образ буквально: «руки твои окрепнут»'
  alternative: «ты ободришься» или «ты укрепишься духом»
  rationale: Буквальный образ понятен в контексте и не сводит заранее его смысл только к одной психологической категории.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Стан» уместен для военного лагеря и поддерживает краткость; порядок «руки твои» сохраняет достоинство и выразительность исходного образа без чрезмерной архаизации.
