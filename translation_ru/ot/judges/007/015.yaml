base_translation:
  language: en
  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: ru
  text: 'Когда Гедеон услышал рассказ о сне и его толкование, он поклонился. Затем он вернулся в стан Израиля и сказал: «Вставайте, потому что Господь отдал стан мадианитян в ваши руки!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר הַחֲלוֹם
  choice: рассказ о сне
  rationale: Сочетание обозначает изложение или пересказ сна; по-русски «рассказ о сне» звучит естественно и точно.
- source_word: שִׁבְרוֹ
  choice: его толкование
  rationale: В данном контексте слово означает объяснение смысла сна.
- source_word: וַיִּשְׁתָּחוּ
  choice: он поклонился
  rationale: Глагол буквально описывает поклон; контекст допускает поклонение Богу, но объект в еврейском тексте не назван, поэтому перевод сохраняет эту недосказанность.
- source_word: ק֔וּמוּ
  choice: Вставайте
  rationale: Форма множественного числа обращена к израильтянам и представляет собой призыв подняться и действовать.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: отдал ... в ваши руки
  rationale: Сохранён характерный библейский образ передачи противника под власть победителей; совершенная форма выражает уверенность в уже решённом исходе.
- source_word: יְהוָה
  choice: Господь
  rationale: Традиционная и общепонятная русская передача тетраграмматона в основном тексте.
- source_word: מַחֲנֵה מִדְיָן
  choice: стан Мадиана
  rationale: Речь идёт о военном стане мадианитян; форма «Мадиана» сохраняет краткость и библейский топонимический оборот.
theological_decisions:
- issue: Характер поклона Гедеона
  choice: «он поклонился» без добавления объекта
  alternative: «он поклонился Богу» / «он поклонился в знак почтения»
  rationale: Контекст естественно указывает на поклонение Господу, однако масоретский текст не называет объекта. Нейтральная формулировка не устраняет эту содержательную недосказанность.
- issue: Пророческая уверенность в победе
  choice: «Господь отдал»
  alternative: «Господь отдаст»
  rationale: Прошедшее время передаёт еврейский перфект и подчёркивает, что обещанная победа воспринимается как уже решённая, не превращая форму в явное будущее время.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Стан» и оборот «в ваши руки» сохранены как понятные традиционные выражения; синтаксис сделан естественным для устной речи.
