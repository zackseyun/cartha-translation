  yaml_path: translation/ot/judges/007/023.yaml
  text: And the men of Israel were called out from Naphtali[a], from Asher, and from all Manasseh[c][b], and they pursued Midian.
translation:
  language: ru
  text: Израильтяне[b] из колен Неффалима и Асира и из всего колена Манассии были созваны[a] и преследовали Мадиан[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «были собраны», «были призваны», «были созваны». Этот трудный еврейский глагол связан по смыслу с криком или призывом, но в данном контексте обозначает сбор людей для преследования.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «муж Израиля» — собирательное выражение, означающее израильтян; далее в еврейском тексте употреблён глагол во множественном числе.'
    reason: lexical_alternative
  - marker: c
    text: «Мадиан» здесь означает мадианитян или мадианитянское войско.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק
  choice: были созваны
  rationale: Форма нифаль в данном военном контексте обозначает созыв или сбор людей для преследования. «Были созваны» естественно передаёт пассивное значение, не исключая присущей глаголу образности призывного крика.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: израильтяне
  rationale: Сочетание стоит в единственном числе, но употреблено собирательно; последующий глагол во множественном числе подтверждает, что речь идёт о группе израильтян. В современном русском «израильтяне» звучит естественнее, чем буквальное «муж Израиля».
- source_word: מִנַּפְתָּלִי וּמִן אָשֵׁר וּמִן כָּל מְנַשֶּׁה
  choice: из колен Неффалима и Асира и со всего колена Манассии
  rationale: Предлог מן указывает, откуда были созваны люди; добавление слова «колено» делает племенные названия ясными для русского читателя. «Со всего колена Манассии» сохраняет значение כָּל — полноту участия названного колена.
- source_word: וַיִּרְדְּפוּ אַחֲרֵי
  choice: и они погнались за
  rationale: Глагол רדף с אַחֲרֵי в военном повествовании означает преследование противника. «Погнались за» точно и естественно передаёт начавшееся вслед за созывом действие.
- source_word: מִדְיָן
  choice: Мадианом
  rationale: Сохранено собственное имя, как в еврейском тексте; здесь оно метонимически обозначает мадианитян или их войско.
