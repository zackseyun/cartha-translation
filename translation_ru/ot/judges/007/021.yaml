  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
translation:
  language: ru
  text: Каждый стоял на своём месте вокруг стана, а весь стан побежал, закричал и обратился в бегство.[a]
  philosophy: optimal-equivalence
  footnotes:
