    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: оставался
  rationale: Форма от עמד обозначает стояние или сохранение позиции; в данном контексте «оставался» естественно передаёт, что люди Гедеона не покидали своих мест.
- source_word: אִישׁ תַּחְתָּיו
  choice: каждый ... на своём месте
  rationale: Еврейская идиома буквально говорит о каждом «под собой» и означает, что каждый находился на своей позиции; русский оборот сохраняет распределительное значение אִישׁ.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: вокруг стана
  rationale: סָבִיב с ל указывает на расположение со всех сторон лагеря; «стан» соответствует возвышенному повествовательному регистру и остаётся понятным.
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  choice: весь стан пришёл в движение
  rationale: רץ буквально означает «бежать», однако при подлежащем «весь стан» описывает общее паническое движение. Формулировка естественна по-русски и не уточняет направление движения раньше следующего глагола.
- source_word: וַיָּרִיעוּ
  choice: они закричали
  rationale: רוע/ריע может обозначать громкий крик, в том числе боевой или панический. Нейтральное «закричали» сохраняет эту смысловую неопределённость.
- source_word: ויניסו
  choice: бросились бежать
  rationale: Форма от נוס означает бегство. «Бросились бежать» ясно передаёт внезапное паническое обращение в бегство.
