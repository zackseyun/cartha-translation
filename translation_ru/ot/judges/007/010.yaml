  text: וְ/אִם יָרֵ֥א אַתָּ֖ה לָ/רֶ֑דֶת רֵ֥ד אַתָּ֛ה וּ/פֻרָ֥ה נַעַרְ/ךָ֖ אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/010.yaml
  text: But if you are afraid to go down[a], go down to the camp with Purah your servant.
translation:
  language: ru
  text: Но если ты боишься спуститься, спустись к стану вместе с Пурой, твоим слугой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вместе с Пурой, твоим помощником»; еврейское слово может обозначать юношу, слугу или сопровождающего.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Но если
  rationale: Сочетание союза с условной частицей вводит оговорку к предыдущему повелению; «но если» естественно передаёт лёгкое противопоставление.
- source_word: יָרֵא אַתָּה
  choice: ты боишься
  rationale: Естественно выражает состояние Гедеона в современном русском языке.
- source_word: לָרֶדֶת / רֵד
  choice: спуститься / спустись
  rationale: Сохраняется намеренный повтор одного и того же еврейского корня ירד, при этом русские формы соответствуют инфинитиву и повелительному наклонению.
- source_word: וּפֻרָה
  choice: вместе с Пурой
  rationale: В данном контексте союз обозначает сопровождающее лицо; «вместе с» ясно и естественно передаёт этот смысл.
- source_word: נַעַרְךָ
  choice: твоим слугой
  rationale: Слово נַעַר может обозначать юношу, слугу или сопровождающего; здесь Пура выступает как подчинённый и спутник Гедеона, поэтому «слуга» наиболее естественно по-русски.
- source_word: אֶל הַמַּחֲנֶה
  choice: к стану
  rationale: Предлог אֶל обычно обозначает движение к цели; «к стану» сохраняет это значение, не уточняя без необходимости, вошли ли они внутрь.
