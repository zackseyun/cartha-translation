  text: וַ/יַּ֨עַן רֵעֵ֤/הוּ וַ/יֹּ֨אמֶר֙ אֵ֣ין זֹ֔את בִּלְתִּ֗י אִם חֶ֛רֶב גִּדְע֥וֹן בֶּן יוֹאָ֖שׁ אִ֣ישׁ יִשְׂרָאֵ֑ל נָתַ֤ן הָֽ/אֱלֹהִים֙ בְּ/יָד֔/וֹ אֶת מִדְיָ֖ן וְ/אֶת כָּל הַֽ/מַּחֲנֶֽה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
translation:
  language: ru
  text: 'Его товарищ ответил[a]: «Это не что иное, как меч Гедеона, сына Иоаса, израильтянина. Бог отдал Мадиан и весь лагерь в его руки[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ответил и сказал».'
    reason: Сохраняет сведения о древнееврейской повествовательной формуле, которая в основном тексте естественно сокращена.
  - marker: b
    text: 'Буквально: «в его руку»; то есть отдал под его власть.'
    reason: Поясняет древнееврейский образ передачи врага во власть победителя; множественное число в основном тексте выбрано как естественный русский идиоматический эквивалент.
lexical_decisions:
- source_word: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר
  choice: Его товарищ ответил
  rationale: В военном контексте רֵעֵהוּ естественно передаётся как «его товарищ». Сочетание «ответил и сказал» типично для древнееврейского повествования, но в современном русском избыточно, поэтому передано одним глаголом с пояснением в сноске.
- source_word: אֵין זֹאת בִּלְתִּי אִם
  choice: Это не что иное, как
  rationale: Устойчивый современный русский оборот сохраняет категоричность отождествления увиденного во сне.
- source_word: חֶרֶב גִּדְעוֹן
  choice: меч Гедеона
  rationale: Сохраняется буквальный образ меча как обозначение силы, посредством которой будет нанесено поражение.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: Гедеона, сына Иоаса
  rationale: Естественная русская передача патронима с традиционными формами библейских имён.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: израильтянина
  rationale: Передаёт принадлежность Гедеона к Израилю и мужской род без неестественного для современного русского выражения «муж Израиля».
- source_word: נָתַן הָאֱלֹהִים
  choice: Бог отдал
  rationale: Перфект выражает действие, воспринимаемое говорящим как уже решённое и несомненное; русское прошедшее время естественно передаёт эту уверенность в контексте истолкования сна.
- source_word: בְּיָדוֹ
  choice: в его руку
  rationale: Сохранён древнееврейский образ передачи врага во власть победителя; значение поясняется в сноске.
- source_word: אֶת מִדְיָן וְאֶת כָּל הַמַּחֲנֶה
  choice: Мадиан и весь стан
  rationale: «Мадиан» сохраняет коллективное обозначение противника, а «стан» кратко и уместно передаёт военный лагерь или находящееся в нём войско.
theological_decisions:
- issue: Уверенность высказывания נָתַן הָאֱלֹהִים
  choice: Бог отдал
  alternative: Бог отдаст
  rationale: Будущее время могло бы превратить уверенное истолкование сна в простое предсказание. Прошедшее время сохраняет форму и силу древнееврейского перфекта, не уточняя сверх текста, каким образом предрешено событие.
- issue: Передача אִישׁ יִשְׂרָאֵל
  choice: израильтянина
  alternative: мужа Израиля
  rationale: Выбранная форма точно обозначает Гедеона как мужчину из народа Израиля, но не вводит в русский текст искусственную или двусмысленную формулировку.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Избегаются как архаическое «муж Израиля», так и разговорные обороты; образ «меча» и идиома «в его руку» сохранены, а последняя пояснена.
