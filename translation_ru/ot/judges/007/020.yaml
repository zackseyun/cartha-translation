source:
  edition: WLC
  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
translation:
  language: ru
  text: 'Тогда три отряда затрубили в трубы и разбили кувшины. В левых руках они держали факелы, а в правых — трубы, чтобы трубить, и кричали: «Меч — для Яхве и Гедеона!»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Меч Яхве и Гедеона!»'
    reason: 'Еврейский безглагольный боевой клич допускает как значение «для Яхве и Гедеона», так и традиционное понимание принадлежности: «меч Яхве и Гедеона».'
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  choice: все три отряда
  rationale: В военном контексте רָאשִׁים обозначает три подразделения, на которые Гедеон разделил людей (Суд. 7:16), а не буквальные «головы». «Отряды» естественно и точно передаёт смысл.
- source_word: שׁוֹפָרוֹת
  choice: трубы
  rationale: שׁוֹפָר — роговой сигнальный инструмент. «Трубы» понятно современному читателю и естественно для данного повествования; уточнение «бараньи рога» здесь не выражено непосредственно.
- source_word: הַכַּדִּים
  choice: кувшины
  rationale: כַּד обозначает сосуд, кувшин. Русское «кувшины» естественно в этой сцене и передаёт предмет, скрывавший факелы.
- source_word: וַיַּחֲזִיקוּ
  choice: держали
  rationale: В данном контексте каузативная форма חזק описывает удерживание предметов в руках; «держали» передаёт это без ненужного усиления.
- source_word: בְיַד שְׂמאוֹלָם ... וּבְיַד יְמִינָם
  choice: в левых руках ... в правых
  rationale: 'Единственное число «рука» в еврейском употреблено распределительно: каждый человек держал по предмету в каждой руке. В русском естественно множественное число.'
- source_word: לַפִּדִים
  choice: факелы
  rationale: לַפִּיד обозначает горящий факел или огненосный предмет; «факелы» — ясный и контекстуально точный эквивалент.
- source_word: לִתְקֹעַ
  choice: чтобы трубить
  rationale: 'Инфинитив выражает назначение: трубы находились в правых руках, чтобы в них трубить.'
- source_word: וַיִּקְרְאוּ
  choice: кричали
  rationale: קרא здесь вводит громкий боевой клич. «Кричали» передаёт силу и продолжающийся характер действия в сцене.
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Меч — за Яхве и за Гедеона!
  rationale: Еврейская фраза безглагольна и предельно сжата. Конструкция с «за» сохраняет значение לְ как направленности или выступления на чьей-либо стороне и звучит по-русски как боевой клич, не превращая фразу в развёрнутое утверждение.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией «Яхве», а не заменено титулом «Господь».
theological_decisions:
- issue: Смысл сжатого боевого клича חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: «Меч — за Яхве и за Гедеона!»
  alternative: «Меч Яхве и Гедеона!»
  rationale: Предлог לְ допускает понимание «за/для», тогда как традиционное чтение истолковывает связь как принадлежность — «меч Яхве и Гедеона». Основной текст сохраняет направленность, выраженную предлогом, а грамматически возможное традиционное понимание приведено в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным ритмом повествования. Синтаксическая сжатость боевого клича сохранена; устаревшие «трубить трубами» и «сосуды» не использованы.
