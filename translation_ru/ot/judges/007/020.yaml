  source_fidelity: 'В целом стих передан точно: три подразделения трубят, разбивают кувшины, держат факелы слева и трубы справа и выкрикивают боевой клич. Однако «все три» добавляет усилительное «все», которого в еврейском тексте нет. Главное замечание касается «Меч — за Яхве и за Гедеона»: предлог «за» уже интерпретирует לְ как лозунг поддержки. Более нейтральное «для» ближе к буквальному направительному значению и лучше сохраняет сжатость и спорность исходной конструкции.'
