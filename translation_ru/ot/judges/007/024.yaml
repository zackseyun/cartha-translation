base_translation:
  language: en
  yaml_path: translation/ot/judges/007/024.yaml
  text: And Gideon sent messengers throughout all the hill country of Ephraim[a], saying, “Come down against Midian, and seize the waters as far as Beth-barah, and the Jordan.” So every man of Ephraim was called out, and they seized the waters as far as Beth-barah[c][b], and the Jordan.
translation:
  language: ru
  text: 'Гедеон разослал вестников по всей горной области Ефрема со словами: «Спуститесь навстречу мадианитянам и захватите воды[a] до Бет-Бары и Иордана». Тогда были созваны[b] все мужчины Ефрема[c], и они захватили воды до Бет-Бары и Иордана.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воды». Возможно, имеются в виду водотоки или броды — стратегические места, которыми следовало овладеть.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский глагол допускает более буквальное понимание: «закричали» или «подняли крик». Однако в данном контексте, вероятно, речь идёт о созыве и сборе воинов.'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «каждый мужчина Ефрема». Единственное число имеет собирательный смысл и обозначает мужчин Ефрема, прежде всего способных выйти на войну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאָכִים
  choice: вестников
  rationale: В повествовательном контексте речь идёт о людях, посланных передать приказ, а не об ангелах.
- source_word: בְּכָל הַר אֶפְרַיִם
  choice: по всей горной области Ефрема
  rationale: הַר обозначает здесь гористую область, а не одну гору; формулировка естественна для современного русского языка.
- source_word: רְדוּ לִקְרַאת מִדְיָן
  choice: спуститесь навстречу мадианитянам
  rationale: Сохраняет топографическое значение императива и намеренно широкое значение לִקְרַאת — движение навстречу, в данном военном контексте ради перехвата или столкновения.
- source_word: וְלִכְדוּ לָהֶם
  choice: и захватите
  rationale: לכד означает «захватить, овладеть». Дательный компонент לָהֶם не выражен отдельно, поскольку его точная функция неясна, а буквальная передача была бы неестественной.
- source_word: אֶת הַמַּיִם
  choice: воды
  rationale: Сохранено буквальное и неоднозначное обозначение; вероятно, имеются в виду стратегические водные пути, переправы или подходы к воде, что поясняется в сноске.
- source_word: עַד בֵּית בָּרָה
  choice: до Бет-Бары
  rationale: עַד обозначает предел охватываемой территории; название места передано транслитерацией.
- source_word: וְאֶת הַיַּרְדֵּן
  choice: и Иордан
  rationale: Сохранено собственное имя без добавления слова «река», отсутствующего в еврейском тексте.
- source_word: וַיִּצָּעֵק כָּל אִישׁ אֶפְרַיִם
  choice: тогда были созваны все мужчины Ефрема
  rationale: Форма глагола трудна; контекст после рассылки вестников поддерживает значение созыва или сбора. Собирательное единственное אִישׁ естественно передано русским множественным числом.
- source_word: וַיִּלְכְּדוּ
  choice: и они захватили
  rationale: Повтор того же русского глагола сохраняет связь с предшествующим приказом.
theological_decisions:
- issue: Степень военной конкретизации выражения לִקְרַאת מִדְיָן
  choice: «навстречу мадианитянам»
  alternative: «против мадианитян»
  rationale: Выбранный вариант сохраняет лексическую широту исходного выражения и не устраняет подразумеваемый контекстом смысл перехвата и вооружённого противостояния.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Прямая речь передана естественно, без архаизмов; неоднозначные выражения исходного текста сохранены в основном тексте и пояснены сносками.
