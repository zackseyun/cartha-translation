  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
translation:
  language: ru
  text: 'На пятый день он встал рано утром, чтобы отправиться в путь, но отец молодой женщины сказал: «Прошу тебя, подкрепи своё сердце[a]; задержитесь, пока день не станет клониться к вечеру». И оба они поели.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поддержи (или: укрепи) своё сердце». Это выражение означает поесть и восстановить силы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: встал рано утром
  rationale: Глагол שׁכם в породе хифиль указывает на ранний подъём или раннее начало дела; сочетание «встал рано утром» естественно передаёт и действие, и временной акцент.
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: на пятый день
  rationale: Прямое и естественное обозначение времени в современном русском языке.
- source_word: לָלֶכֶת
  choice: чтобы отправиться в путь
  rationale: Буквально глагол означает «идти», но в данном контексте речь идёт о намерении уехать; выбранная формулировка ясно передаёт контекст, не уточняя способ передвижения.
- source_word: אֲבִי הַנַּעֲרָה
  choice: отец молодой женщины
  rationale: נַעֲרָה может обозначать девушку или молодую женщину; с учётом её брачного положения «молодая женщина» звучит уместнее и не создаёт впечатления, что речь идёт о ребёнке.
- source_word: סְעָד נָא לְבָבְךָ
  choice: Прошу тебя, подкрепи своё сердце
  rationale: Сохранён образ древнееврейской идиомы «поддержать/укрепить сердце». В контексте это приглашение поесть и набраться сил; значение разъяснено в сноске без внесения отсутствующего в тексте существительного «пища» в основной текст.
- source_word: וְהִתְמַהְמְהוּ
  choice: и задержитесь
  rationale: Форма множественного числа обращена к путникам как группе и означает медлить, задерживаться. Русское «задержитесь» передаёт и число, и побуждение отложить отъезд.
- source_word: עַד נְטוֹת הַיּוֹם
  choice: пока день не станет клониться к вечеру
  rationale: Сохранён образ дня, который «склоняется»; добавление «к вечеру» естественно раскрывает временной смысл выражения.
- source_word: וַיֹּאכְלוּ שְׁנֵיהֶם
  choice: И оба они поели
  rationale: Передано явное указание на двух участников. «Поели» естественно описывает состоявшуюся трапезу и связывает её с предшествующим приглашением.
