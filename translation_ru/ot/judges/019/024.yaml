base_translation:
  language: en
  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
translation:
  language: ru
  text: Вот моя дочь, девственница, и его наложница. Позвольте, я выведу их. Надругайтесь над ними[a] и делайте с ними то, что покажется вам хорошим[b]. Но этому человеку не делайте такого гнусного дела[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изнасилуйте их». Употреблённый здесь еврейский глагол в данном контексте означает насильственное унижение, в том числе сексуальное.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «делайте с ними хорошее в ваших глазах», то есть то, что вам кажется хорошим или желательным.'
    reason: cultural_note
  - marker: c
    text: 'Или: «такой мерзости», «такого позорного поступка».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Естественное русское указательное слово, которым говорящий настойчиво обращает внимание слушателей на находящихся рядом женщин.
- source_word: בִתִּי הַבְּתוּלָה
  choice: моя дочь-девственница
  rationale: Сохраняет прямое указание на девственность дочери и остаётся компактным, хотя намеренно звучит несколько приподнято.
- source_word: וּפִילַגְשֵׁהוּ
  choice: и его наложница
  rationale: «Наложница» — традиционный и достаточно точный русский эквивалент обозначения женщины, состоящей с мужчиной в признанной, но вторичной по статусу брачной связи.
- source_word: אוֹצִיאָה נָּא אוֹתָם
  choice: Прошу, я выведу их к вам
  rationale: Когортатив вместе с נָא передаёт настойчивое предложение или просьбу. «К вам» естественно выражает направленность глагола «выведу» в данной сцене, не меняя адресата действия.
- source_word: וְעַנּוּ אוֹתָם
  choice: Надругайтесь над ними
  rationale: В данном контексте Piel глагола ענה означает унижение и насилие, имеющее сексуальный характер. Русское «надругаться над» передаёт и насилие, и унижение, не сужая значение до одного юридического термина.
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  choice: и делайте с ними то, что сочтёте хорошим
  rationale: Передаёт образную формулу «хорошее в ваших глазах» более естественно по-русски, сохраняя субъективность оценки слушателей.
- source_word: וְלָאִישׁ הַזֶּה
  choice: Но ... с этим человеком
  rationale: Начальное «но» и вынесенное дополнение сохраняют резкое противопоставление предложенного обращения с женщинами и запрета в отношении гостя.
- source_word: דְּבַר הַנְּבָלָה הַזֹּאת
  choice: такого гнусного дела
  rationale: נְבָלָה обозначает позорный, нравственно отвратительный поступок, а не просто неразумие. «Гнусное дело» ясно выражает моральное осуждение.
theological_decisions:
- issue: Степень прямоты при передаче сексуального насилия
  choice: «Надругайтесь над ними» с поясняющей сноской
  alternative: «Изнасилуйте их»
  rationale: Контекст недвусмысленно предполагает сексуальное насилие, однако сам глагол шире юридически конкретного русского «изнасиловать» и включает унижение. Выбранный вариант не смягчает ужас предложения и сохраняет широту слова.
- issue: Передача субъективной идиомы הַטּוֹב בְּעֵינֵיכֶם
  choice: «то, что сочтёте хорошим»
  alternative: «что вам угодно»
  rationale: 'Более близкая к образу оригинала формулировка сохраняет нравственно напряжённое употребление слова «хорошее»: речь идёт не об одобрении рассказчика, а о том, что сами нападающие считают желательным.'
- issue: Нравственная оценка נְבָלָה
  choice: «гнусное дело»
  alternative: «безумие» или «позорный поступок»
  rationale: В данном повествовании слово выражает крайнее нравственное негодование. «Гнусное дело» передаёт это без привнесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью, без архаизмов вроде «се» и без смягчения жестокости сцены. Синтаксис сохраняет настойчивое предложение хозяина и резкий контраст между выдачей женщин и защитой мужчины-гостя.
