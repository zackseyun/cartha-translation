    issue: Добавлено «к вам»
    rationale: В еврейском тексте после «выведу их» нет дополнения «к вам». Его следует удалить, согласно принципу исходниковой точности и английскому аудиторскому следу.
  - severity: medium
    issue: «Не совершайте с этим человеком» двусмысленно меняет синтаксическое отношение
    rationale: Предложное «с этим человеком» в современном русском обычно предполагает совместное действие. Еврейское לָאִישׁ здесь выражает запрет причинить это действие мужчине; нужно «не делайте этому человеку...».
  - severity: low
