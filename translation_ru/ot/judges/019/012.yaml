base_translation:
  language: en
  yaml_path: translation/ot/judges/019/012.yaml
  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
translation:
  language: ru
  text: 'Но господин его сказал ему: «Не станем сворачивать в чужой город, где живут не израильтяне[a]; пойдём дальше, до Гивы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не из сынов Израиля». «Сыны Израиля» — обычное еврейское обозначение израильтян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנָיו
  choice: господин его
  rationale: В повествовательном контексте это обозначение человека, которому подчинён слуга, а не божественный титул. Постпозиция местоимения поддерживает достойный библейский регистр без архаизма.
- source_word: נָסוּר
  choice: не станем сворачивать
  rationale: Глагол סור здесь означает отклониться от пути, чтобы зайти в город; «сворачивать» естественно передаёт направительное значение.
- source_word: עִיר נָכְרִי
  choice: город чужеземцев
  rationale: נָכְרִי указывает на чужих, не принадлежащих к Израилю. В данном контексте выражение характеризует город через его население; русский вариант естественнее буквального «чужеземный город».
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  choice: не принадлежащий сынам Израиля
  rationale: Формулировка сохраняет связь относительного оборота с городом и традиционное этническое выражение «сыны Израиля», не устраняя некоторую необычность еврейской конструкции.
- source_word: וְעָבַרְנוּ
  choice: а пойдём дальше
  rationale: עבר здесь означает продолжить путь, миновав предложенное место остановки; «пойдём дальше» ясно и естественно выражает этот смысл.
- source_word: עַד גִּבְעָה
  choice: до Гивы
  rationale: עַד обозначает предел движения. «До Гивы» точно и идиоматично передаёт пространственное значение.
