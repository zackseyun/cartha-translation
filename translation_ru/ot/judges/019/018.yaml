source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
translation:
  language: ru
  text: 'Он ответил ему: «Мы направляемся из Вифлеема Иудейского в отдалённую часть горной области Ефрема. Я оттуда родом. Я ходил в Вифлеем Иудейский и иду к дому Яхве[a], но никто не принимает меня у себя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я иду домой» либо «я иду к своему дому». Некоторые понимают еврейский текст идиоматически или предполагают иное чтение, поскольку выражение «дом Яхве» в этом контексте неожиданно.'
    reason: alternative_reading
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  choice: мы идём
  rationale: Причастие עבר с местоимением обозначает продолжающееся передвижение. В данном контексте естественное русское «идём» передаёт путь из одного места в другое без лишнего уточнения направления маршрута.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: из Вифлеема Иудейского
  rationale: Традиционная и естественная русская форма географического названия отличает этот Вифлеем от одноимённых мест.
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  choice: в дальнюю часть горной области Ефрема
  rationale: יַרְכְּתֵי указывает на удалённую, крайнюю часть территории; הַר אֶפְרַיִם здесь обозначает горную область Ефрема.
- source_word: מִשָּׁם אָנֹכִי
  choice: я оттуда родом
  rationale: Кратко и естественно передаёт заявление о месте происхождения.
- source_word: וָאֵלֵךְ עַד בֵּית לֶחֶם יְהוּדָה
  choice: я ходил в Вифлеем Иудейский
  rationale: Прошедшая форма сохраняет наиболее прямое значение wayyiqtol; русское «ходил» в описании поездки также естественно подразумевает путь туда перед возвращением.
- source_word: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: а теперь иду к дому Яхве
  rationale: Основной текст следует масоретскому чтению «дом Яхве». «Теперь» естественно обозначает противопоставление завершённого посещения Вифлеема нынешнему направлению пути, не устраняя текстовую трудность.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени, представленного тетраграмматоном, а не замена его титулом.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  choice: но никто не принимает меня в свой дом
  rationale: В контексте гостеприимства אסף означает принять или дать приют. Русское «никто» идиоматично передаёт отрицательную конструкцию אֵין אִישׁ, а «в свой дом» ясно выражает подразумеваемое гостеприимство.
theological_decisions:
- issue: Значение וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: иду к дому Яхве
  alternative: иду домой / иду к своему дому
  rationale: Масоретский текст прямо содержит «дом Яхве», хотя это чтение контекстуально неожиданно. Поэтому оно сохранено в основном тексте, а распространённое альтернативное понимание вынесено в примечание.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя в исходном тексте и не заменяет его титулом.
- issue: Отрицательная конструкция אֵין אִישׁ
  choice: никто
  alternative: ни один мужчина / ни один человек
  rationale: Здесь אִישׁ входит в обычную отрицательную конструкцию со значением «никто». Контекст не требует подчёркивать пол потенциального хозяина дома.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Синтаксис слегка разглажен для ясности, но временная последовательность и трудное масоретское чтение сохранены.
