  naturalness: Текст в целом литературен и понятен. «Мы направляемся» точнее и естественнее передаёт нахождение в пути, чем нейтральное «мы идём», а «никто не принимает меня у себя» устраняет двусмысленность и сохраняет смысл гостеприимства.
