base_translation:
  language: en
  yaml_path: translation/ot/judges/019/023.yaml
  text: Then the man[a], the master of the house, went out to them and said to them, “No, my brothers, please do not act wickedly. Since this man has come into my house, do not do this disgraceful thing.”
translation:
  language: ru
  text: 'Тогда хозяин дома вышел к ним и сказал: «Нет, братья мои! Прошу вас, не творите зла. Теперь, когда этот человек вошёл в мой дом, не совершайте этого позорного дела[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные варианты: «этой гнусности» или «этого возмутительного поступка». Еврейское слово обозначает постыдное, нравственно возмутительное деяние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבַּיִת
  choice: хозяин дома
  rationale: Сочетание обозначает мужчину, распоряжающегося домом. «Хозяин дома» естественно передаёт и принадлежность дома, и власть в домашнем хозяйстве.
- source_word: אַחַי
  choice: братья мои
  rationale: Буквально «мои братья»; здесь это обращение к мужчинам-согражданам. Сохранена мужская форма и примирительный тон обращения.
- source_word: תָּרֵעוּ
  choice: не творите зла
  rationale: Форма от רעע выражает нравственно сильный запрет. «Не творите зла» передаёт моральную оценку и сохраняет достойный библейский регистр.
- source_word: נָא
  choice: прошу вас
  rationale: Частица придаёт просьбе настойчивый, умоляющий оттенок; по-русски он естественно выражен словами «прошу вас».
- source_word: אַחֲרֵי אֲשֶׁר בָּא ... אֶל־בֵּיתִי
  choice: теперь, когда этот человек вошёл в мой дом
  rationale: 'Оборот задаёт обстоятельство, усиливающее тяжесть замысла: человек уже находится под кровом говорящего. «Теперь, когда» естественно передаёт временно-обстоятельственный смысл, не превращая его однозначно в причинный.'
- source_word: הַנְּבָלָה הַזֹּאת
  choice: такого позорного дела
  rationale: נְבָלָה обозначает постыдный и нравственно возмутительный поступок. Этот вариант понятен современному читателю и сильнее, чем буквальное, но ныне слишком слабое «безумие».
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: вышел к ним
  rationale: Прямая и естественная передача повествовательной формы глагола יצא с направлением к собравшимся людям.
