base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
translation:
  language: ru
  text: 'Когда они веселились, вдруг мужчины из города — негодяи[a] — окружили дом и стали колотить в дверь. Они сказали старику, хозяину дома: «Выведи того человека, который вошёл в твой дом, чтобы нам познать его[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны негодности»; то есть беззаконные или порочные люди.'
    reason: lexical_alternative
  - marker: b
    text: '«Познать его» здесь — сексуальный эвфемизм: они намеревались совершить над ним сексуальное насилие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  choice: веселились
  rationale: Еврейская идиома буквально означает «делали сердце добрым» и описывает весёлое застольное настроение. Русское «веселились» естественно передаёт её смысл без неуместной буквальности.
- source_word: וְהִנֵּה
  choice: как вдруг
  rationale: Выражение вводит резкий и тревожный поворот повествования. «Как вдруг» естественно передаёт эту дискурсивную функцию в современном русском.
- source_word: אַנְשֵׁי הָעִיר
  choice: городские мужчины
  rationale: Прямо передаёт принадлежность мужчин к этому городу и сохраняет указание на их пол, существенное для происходящего.
- source_word: אַנְשֵׁי בְנֵי בְלִיַּעַל
  choice: люди негодные
  rationale: Идиома характеризует нравственно испорченных, беззаконных людей. Формулировка сохраняет семантику «негодности», а более буквальная форма дана в сноске.
- source_word: נָסַבּוּ אֶת הַבַּיִת
  choice: окружили дом
  rationale: 'Ясно и точно передаёт действие глагола: они расположились вокруг дома.'
- source_word: מִתְדַּפְּקִים עַל הַדָּלֶת
  choice: стали колотить в дверь
  rationale: Причастная форма описывает повторяющиеся сильные удары, а не обычный стук.
- source_word: בַּעַל הַבַּיִת
  choice: хозяин дома
  rationale: Естественное русское обозначение человека, которому принадлежит дом и который распоряжается в нём.
- source_word: הַזָּקֵן
  choice: старик
  rationale: В контексте слово указывает на возраст хозяина, а не на официальное положение старейшины.
- source_word: הוֹצֵא
  choice: Выведи
  rationale: Повелительная форма требует вывести гостя из дома наружу.
- source_word: וְנֵדָעֶנּוּ
  choice: чтобы нам познать его
  rationale: Сохраняет эвфемизм исходного текста и литературную перекличку с Быт 19; сексуальный и насильственный смысл разъяснён в сноске.
theological_decisions:
- issue: Передача сексуального эвфемизма וְנֵדָעֶנּוּ
  choice: Сохранить в основном тексте «чтобы нам познать его», пояснив смысл в сноске.
  alternative: «чтобы вступить с ним в половую связь» или «чтобы надругаться над ним»
  rationale: Глагол «познать» намеренно служит эвфемизмом и перекликается с Быт 19. Сохранение образа уважает форму источника, а сноска не позволяет скрыть намерение сексуального насилия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Резкий переход передан словами «как вдруг», агрессия — глаголом «колотить». Архаизирующее «познать» сохранено точечно ради исходного эвфемизма и объяснено в сноске; все сносочные маркеры присутствуют в основном тексте.
