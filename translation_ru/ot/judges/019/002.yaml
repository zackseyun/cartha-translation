base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
translation:
  language: ru
  text: Но его наложница изменила ему[a], ушла от него в дом своего отца — в Вифлеем Иудейский — и пробыла там четыре месяца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «блудодействовала против него». Некоторые древние толкователи понимали эти слова иначе: «она рассердилась на него» или «поссорилась с ним».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶה
  choice: изменила
  rationale: Глагол זנה обычно обозначает блуд или половую неверность. «Изменила» естественно передаёт вероятный смысл в данном брачном контексте, не уточняя без достаточных оснований, что речь шла о занятии проституцией.
- source_word: עָלָיו
  choice: ему
  rationale: После глагола со значением неверности предлог על указывает на того, против кого направлена измена; по-русски естественно сказать «изменила ему».
- source_word: פִּילַגְשׁוֹ
  choice: его наложница
  rationale: «Наложница» — общепринятое краткое обозначение женщины в признанном, но более низком по статусу брачном союзе.
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: ушла от него
  rationale: Так передаются и движение, и отделение от мужчины; формулировка естественна для русского повествования.
- source_word: אֶל בֵּית אָבִיהָ
  choice: в дом своего отца
  rationale: Близкая к форме исходного текста и естественная передача обозначения отцовского дома.
- source_word: אֶל בֵּית לֶחֶם יְהוּדָה
  choice: в Вифлеем Иудейский
  rationale: Традиционное и ясное русское наименование Вифлеема, находившегося в Иудее и отличаемого от одноимённого города.
- source_word: וַתְּהִי שָׁם
  choice: и пробыла там
  rationale: В контексте указания длительности глагол היה естественно передать как «пробыла», сохранив смысл нахождения там в течение названного срока.
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  choice: четыре месяца
  rationale: Еврейское выражение буквально содержит «дни, четыре месяца», но идиоматически обозначает срок в четыре месяца; буквальное воспроизведение было бы неясным по-русски.
theological_decisions:
- issue: Толкование וַתִּזְנֶה в нравственно напряжённом повествовании
  choice: половая неверность — «изменила ему»
  alternative: «стала блудодействовать против него»; согласно иной древней традиции — «рассердилась на него» или «поссорилась с ним»
  rationale: Масоретская огласовка и обычное значение корня זנה поддерживают понимание как половой неверности. Иное древнее понимание сохранено в примечании, чтобы не скрывать историю толкования и не устранять неоднозначность без пояснения.
translation_notes:
  register: Современный литературный русский язык, ясный для широкого читателя; повествовательный стиль с умеренно традиционной библейской топонимией. Союз «но» передаёт контекстуальный контраст, допустимый для еврейского וַ.
