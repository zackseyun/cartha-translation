source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ לְךָ֥ וְ/נִקְרְבָ֖ה בְּ/אַחַ֣ד הַ/מְּקֹמ֑וֹת וְ/לַ֥נּוּ בַ/גִּבְעָ֖ה א֥וֹ בָ/רָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
translation:
  language: ru
  text: 'Он сказал своему слуге[a]: «Пойдём, приблизимся к одному из этих мест и переночуем в Гиве или в Раме».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своему юноше»; также возможно: «своему сопровождающему».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ
  choice: своему слуге
  rationale: נַעַר может означать юношу, слугу или сопровождающего. В данном контексте это мужчина, сопровождающий левита и находящийся у него в услужении; «слуга» естественно передаёт его роль, а возможный возраст сохраняется в сноске.
- source_word: לְךָ
  choice: Пойдём
  rationale: Формально это повелительная форма «иди», но вместе со следующим когортативом она служит приглашением двигаться сообща. Русское «пойдём» естественно объединяет побуждение и совместность действия.
- source_word: וְנִקְרְבָה
  choice: приблизимся
  rationale: Когортатив выражает предложение совместного действия; «приблизимся» сохраняет значение движения к ближайшему месту.
- source_word: בְּאַחַד הַמְּקֹמוֹת
  choice: к одному из этих мест
  rationale: Речь идёт об одном из находящихся впереди населённых мест, далее названных Гивой и Рамой. «Этих» естественно передаёт ситуативную отнесённость.
- source_word: וְלַנּוּ
  choice: и переночуем
  rationale: Глагол לון означает провести ночь или остановиться на ночлег; «переночуем» кратко и естественно передаёт это значение.
- source_word: בַגִּבְעָה
  choice: в Гиве
  rationale: Название города גִּבְעָה передано принятой русской библейской формой «Гива»; предложный падеж естественен при обозначении ночлега внутри города.
- source_word: בָרָמָה
  choice: в Раме
  rationale: Название города רָמָה передано принятой русской библейской формой «Рама», параллельно названию Гивы.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с краткой, естественной прямой речью. «Пойдём» передаёт совместное побуждение, не воспроизводя механически буквальное «иди». Названия Гива и Рама соответствуют устойчивой русской библейской традиции.
