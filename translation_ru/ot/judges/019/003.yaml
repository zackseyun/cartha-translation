base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
translation:
  language: ru
  text: Тогда её муж встал и пошёл за ней, чтобы поговорить с ней ласково и вернуть её[a]. Его сопровождали слуга и пара ослов. Она привела его в дом своего отца. Когда отец молодой женщины увидел его, он с радостью вышел ему навстречу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский согласный текст при слове «вернуть» допускает суффикс мужского рода («вернуть его»); традиционное чтение и контекст указывают на женщину («вернуть её»).
    reason: textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  choice: её муж
  rationale: Буквально «её мужчина»; в контексте брачных отношений это естественное обозначение мужа.
- source_word: לְדַבֵּר עַל־לִבָּהּ
  choice: поговорить с ней по душам
  rationale: Еврейская идиома буквально означает «говорить к её сердцу» и передаёт мягкую, располагающую или убеждающую речь; русский оборот сохраняет образ сердца в естественной современной форме.
- source_word: ל/השיב/ו
  choice: вернуть её
  rationale: Контекст указывает на намерение вернуть женщину, хотя переданная согласными форма содержит трудность в роде местоименного суффикса.
- source_word: נַעֲרוֹ
  choice: его слуга
  rationale: נַעַר может обозначать юношу или слугу; здесь спутник выполняет роль слуги, а указание на молодость по-русски не обязательно.
- source_word: צֶמֶד חֲמֹרִים
  choice: пара ослов
  rationale: צֶמֶד обозначает пару; перевод не уточняет без необходимости, были ли животные запряжены вместе.
- source_word: וַתְּבִיאֵהוּ
  choice: она привела его
  rationale: Глагол женского рода указывает на женщину как субъект; в контексте входа в дом «привела» естественнее русского «внесла».
- source_word: הַנַּעֲרָה
  choice: молодая женщина
  rationale: Точно передаёт обозначение נַעֲרָה без архаического оттенка и без замены его контекстуальным статусом наложницы.
- source_word: וַיִּשְׂמַח לִקְרָאתוֹ
  choice: он с радостью вышел ему навстречу
  rationale: Передаёт и радость, выраженную глаголом שׂמח, и направленность движения в обороте לִקְרָאתוֹ.
