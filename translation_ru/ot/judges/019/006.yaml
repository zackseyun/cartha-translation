  text: So the two of them sat down together and ate and drank. Then the young woman's father said to the man[a], "Please, be willing to stay the night, and let your heart be glad."
translation:
  language: ru
  text: 'Они оба сели и вместе ели и пили. Отец молодой женщины сказал мужчине: «Прошу, останься ночевать, и пусть сердце твоё порадуется».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и пусть твоему сердцу будет хорошо»; то есть «пусть оно будет радостно».'
    reason: Идиома וְיִטַב לִבֶּךָ буквально говорит о «благе» или благополучии сердца и в данном контексте выражает радостное, довольное расположение духа.
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: сели
  rationale: 'В повествовательной последовательности глагол ישׁב естественно передаётся как начало совместной трапезы: «сели».'
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: они оба ... вместе
  rationale: Сохранено усиленное указание на двух участников и их совместное действие.
- source_word: וַיֹּאכְלוּ ... וַיִּשְׁתּוּ
  choice: ели и пили
  rationale: Прямой перевод двух глаголов; объект питья, отсутствующий в еврейском тексте, не добавлен.
- source_word: אֲבִי הַנַּעֲרָה
  choice: отец молодой женщины
  rationale: נַעֲרָה здесь обозначает молодую женщину; выбран современный и достойный контексту оборот.
- source_word: הָאִישׁ
  choice: мужчине
  rationale: Сохранено буквальное обозначение персонажа как «мужчины», без контекстуального уточнения «мужу» или «левиту».
- source_word: הוֹאֶל נָא
  choice: прошу тебя, согласись
  rationale: Передаёт и значение добровольного согласия, выраженное יאל, и вежливую просьбу частицы נָא.
- source_word: וְלִין
  choice: переночевать
  rationale: Естественное современное русское соответствие глаголу со значением остаться где-либо на ночь.
- source_word: וְיִטַב לִבֶּךָ
  choice: пусть у тебя будет радостно на сердце
  rationale: Сохраняет образ сердца и передаёт идиоматический смысл хорошего, радостного расположения духа.
