  source_fidelity: 'Смысловые элементы еврейского текста переданы верно: совместная трапеза, обращение отца молодой женщины к мужчине, вежливая просьба остаться на ночь и идиома о сердце. Однако выражение «пусть у тебя будет радостно на сердце» звучит в современном литературном русском тяжеловесно; более естественная конструкция может сохранить образ сердца без изменения смысла.'
