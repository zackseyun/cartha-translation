  yaml_path: translation/ot/judges/019/014.yaml
  text: So they passed on and went their way[a], and the sun set on them near Gibeah, which belongs to Benjamin.
translation:
  language: ru
  text: Они миновали то место и пошли дальше. Солнце зашло, когда они были близ Гивы, принадлежавшей Вениамину[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находившейся во владениях Вениамина». Еврейское выражение указывает на связь Гивы с племенем или территорией Вениамина.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: они миновали то место
  rationale: Глагол עבר в данном повествовательном контексте указывает, что путники прошли мимо ранее предложенного места ночлега и продолжили путь; добавление «то место» делает этот смысл естественным по-русски.
- source_word: וַיֵּלֵכוּ
  choice: и пошли дальше
  rationale: Так сохраняется второй глагол движения הלך и последовательность действий, свойственная еврейскому повествованию, без тяжеловесного буквального повтора.
- source_word: וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ
  choice: солнце зашло, когда они были
  rationale: Буквально выражение означает «солнце пришло к ним», но в контексте пути это идиома наступления заката. Русская формулировка ясно передаёт, что ночь настигла их в дороге.
- source_word: אֵצֶל
  choice: близ
  rationale: Предлог обозначает нахождение рядом; «близ» кратко и уместно для современного литературного библейского повествования.
- source_word: הַגִּבְעָה
  choice: Гива
  rationale: Здесь это название города, а не нарицательное «холм»; использована закрепившаяся в русской библейской традиции форма имени.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: принадлежавшей Вениамину
  rationale: Конструкция с לְ выражает принадлежность или связь Гивы с племенем и территорией Вениамина; перевод сохраняет этот смысл, не сводя его только к географическому расположению.
- source_word: בִנְיָמִן
  choice: Вениамин
  rationale: Использована общепринятая русская форма имени и названия племени.
