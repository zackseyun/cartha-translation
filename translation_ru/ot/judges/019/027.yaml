base_translation:
  language: en
  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
translation:
  language: ru
  text: Утром её господин встал, открыл двери дома и вышел, чтобы отправиться в путь. И вот женщина, его наложница, лежала[a] у входа в дом, а руки её были на пороге.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «упавшая у входа в дом»; еврейское причастие описывает её состояние как павшей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  choice: её господин
  rationale: Сохраняет значение «её господин/владыка» и выраженное в повествовании неравенство положения, не подменяя его более взаимным обозначением «муж».
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Естественная и точная передача обычного обстоятельства времени.
- source_word: דַּלְתוֹת הַבַּיִת
  choice: двери дома
  rationale: Сохраняет множественное число еврейского דַּלְתוֹת и конкретное обозначение дома.
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  choice: вышел, чтобы отправиться в путь
  rationale: Передаёт целевую инфинитивную конструкцию и смысл еврейского оборота естественным современным русским языком.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет указательную и драматическую функцию הִנֵּה, привлекающего внимание к внезапно открывшейся сцене.
- source_word: הָאִשָּׁה פִילַגְשׁוֹ
  choice: женщина, его наложница
  rationale: Сохраняет приложение в оригинале; «наложница» является точным и общепонятным соответствием פִילֶגֶשׁ.
- source_word: נֹפֶלֶת
  choice: лежала
  rationale: В контексте причастие описывает состояние женщины у входа; «лежала» естественно передаёт результирующее положение, не утверждая отдельно момент падения. Более буквальный вариант отмечен в сноске.
- source_word: פֶּתַח הַבַּיִת
  choice: у входа в дом
  rationale: Точно и естественно передаёт местонахождение у входа или дверного проёма дома.
- source_word: וְיָדֶיהָ עַל הַסַּף
  choice: а руки её были на пороге
  rationale: Сохраняет самостоятельную безглагольную фразу и её выразительный образ, не добавляя предположения, что женщина намеренно положила руки на порог.
