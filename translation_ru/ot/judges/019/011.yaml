base_translation:
  language: en
  yaml_path: translation/ot/judges/019/011.yaml
  text: When they were near Jebus[a], and the day was far spent, the young man said to his master, “Please come[c][b], let us turn aside to this city of the Jebusites and spend the night in it.”
translation:
  language: ru
  text: 'Когда они были у Иевуса[a], день уже клонился к вечеру. Юноша[b] сказал своему господину: «Пойдём, пожалуйста, свернём в этот город иевусеев и переночуем в нём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Иевус — прежнее название Иерусалима.
    reason: cross_reference
  - marker: b
    text: Еврейское слово может также означать «слуга» или «служитель» в данном контексте.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם יְבוּס
  choice: они были у Иевуса
  rationale: Предлог עִם буквально означает «с», но при названии места в дорожном контексте выражает близость. Русское «у Иевуса» естественно передаёт этот смысл.
- source_word: יְבוּס
  choice: Иевус
  rationale: Сохранено древнее название города из еврейского текста, без замены его позднейшим названием «Иерусалим».
- source_word: וְהַיּוֹם רַד מְאֹד
  choice: день уже клонился к вечеру
  rationale: Идиома описывает заметный исход дня, его приближение к вечеру. Такой перевод сохраняет образ движения дня к закату и звучит естественно по-русски.
- source_word: הַנַּעַר
  choice: слуга
  rationale: נַעַר может обозначать юношу, молодого человека или слугу. В данном контексте его подчинённое положение прямо видно из обращения к «своему господину», поэтому функциональное значение «слуга» наиболее ясно; лексическая широта отмечена в сноске.
- source_word: אֲדֹנָיו
  choice: своему господину
  rationale: Здесь אֲדוֹן обозначает человека, которому подчинён слуга. «Господин» — естественное и контекстуально точное русское соответствие.
- source_word: לְכָה נָּא וְנָסוּרָה
  choice: Давай свернём
  rationale: Императив с частицей просьбы и последующим когортативом образует приглашение к совместному действию. «Давай свернём» естественно передаёт побуждение и направление в сторону от пути.
- source_word: עִיר הַיְבוּסִי הַזֹּאת
  choice: к этому городу иевусеев
  rationale: Этноним употреблён собирательно. Формулировка сохраняет указательное местоимение и ясно обозначает принадлежность города народу иевусеев.
- source_word: וְנָלִין בָּהּ
  choice: и переночуем в нём
  rationale: Глагол לוּן означает оставаться где-либо на ночь; «переночуем» кратко и естественно передаёт его значение.
