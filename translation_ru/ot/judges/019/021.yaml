  text: וַ/יְבִיאֵ֣/הוּ לְ/בֵית֔/וֹ וַ/יָּ֖בָול לַ/חֲמוֹרִ֑ים וַֽ/יִּרְחֲצוּ֙ רַגְלֵי/הֶ֔ם וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/021.yaml
  text: So he brought him into his house and fed the donkeys[b][a]. Then they washed their feet and ate and drank.
translation:
  language: ru
  text: Он ввёл его в свой дом и задал корм ослам[a]. Затем они омыли ноги[b], ели и пили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «смешал корм для ослов», то есть приготовил и задал им корм.'
    reason: lexical_alternative
  - marker: b
    text: Омовение ног было обычным проявлением гостеприимства на древнем Ближнем Востоке.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ
  choice: Он ввёл его
  rationale: 'Гифиль от בוא выражает побуждение к движению: «привести, ввести». «Ввёл» естественно передаёт завершённое движение внутрь дома.'
- source_word: לְבֵיתוֹ
  choice: в свой дом
  rationale: Предлог ל после глагола движения здесь обозначает направление внутрь жилища; возвратное «свой» ясно соотносит дом с хозяином.
- source_word: וַיָּבָול
  choice: задал корм
  rationale: Форма от בלל буквально связана со смешиванием, здесь — с приготовлением или подачей корма животным. Русское «задал корм» понятно и сохраняет конкретность действия.
- source_word: לַחֲמוֹרִים
  choice: ослам
  rationale: חֲמוֹרִים — обычное обозначение ослов; выбран современный нейтральный эквивалент.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: они омыли ноги
  rationale: Буквально передаёт действие רחץ и сохраняет множественное число, не уточняя сверх текста состав группы.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: ели и пили
  rationale: Сохраняется краткая последовательность повествовательных форм исходного текста.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким повествовательным ритмом. «Задал корм» передаёт уход за животными без архаичного «дал корму»; «омыли ноги» сохраняет библейское достоинство и остаётся понятным современному читателю.
