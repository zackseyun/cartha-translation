review_pass:
  verdict: revise
  source_fidelity: Добавление «и лежала там» прямо не выражено в еврейском тексте. Хотя продолжительность после «упала» контекстуально подразумевается оборотом עַד הָאוֹר, её лучше не эксплицировать отдельным глаголом. «Под утро», «пришла», «упала», «у входа в дом того человека» и «её господин» в целом точно передают исходный текст.
  naturalness: Исправленный вариант сохраняет лаконичный, суровый характер повествования и остаётся понятным в современном литературном русском. Оборот «до наступления света» точнее, чем «до рассвета», передаёт עַד הָאוֹר без привязки к конкретному астрономическому моменту.
  terminology: «Её господин» адекватно передаёт אֲדוֹנֶיהָ, не подменяя слово власти интерпретирующим «муж». Сноска с вариантом «её хозяин» уместна. «Тот человек» допустимо отсылает к уже известному в повествовании мужчине.
  issues:
  - severity: medium
    issue: В перевод добавлен самостоятельный глагол «и лежала там».
    rationale: В оригинале имеются только глаголы «пришла» и «упала»; עַד הָאוֹר задаёт временную границу. Добавление «лежала» проясняет контекст, но выходит за пределы выраженного текста и не необходимо для русского перевода.
  - severity: low
    issue: «До рассвета» несколько уже, чем עַד הָאוֹר.
    rationale: Буквальное «до света» обозначает наступление света/дня. «До наступления света» сохраняет это значение точнее.
  revised_text: Под утро женщина пришла и упала у входа в дом того человека, где был её господин[a], до наступления света[b].
  revised_footnotes:
