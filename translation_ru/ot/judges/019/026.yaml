revisions:
- from: Под утро женщина пришла и упала у входа в дом того человека, где находился её господин[a], и лежала там до рассвета[b].
  to: Под утро женщина пришла и упала у входа в дом того человека, где был её господин[a], до наступления света[b].
  rationale: Удалено невыраженное «и лежала там». «До рассвета» заменено на «до наступления света», чтобы точнее передать עַד הָאוֹר и сохранить сдержанную неоднозначность оригинала.
