  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
translation:
  language: ru
  text: Под утро женщина пришла и упала у входа в дом того человека, где был её господин[a], до наступления света[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «её хозяин». Еврейское слово обозначает господина, обладающего властью, а не прямо «мужа».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «до света».'
    reason: literal_rendering
lexical_decisions:
- source_word: לִפְנוֹת הַבֹּקֶר
  choice: Под утро
  rationale: Естественно передаёт еврейский временной оборот, указывающий на приближение или наступление утра, не сводя его к точному моменту восхода.
- source_word: וַתָּבֹא
  choice: пришла
  rationale: Передаёт основное значение בוא без добавления прямо не выраженного смысла «вернулась».
- source_word: וַתִּפֹּל
  choice: упала
  rationale: Сохраняет прямое и резкое значение נפל; «рухнула» или «лишилась сил» добавляло бы интерпретацию её состояния.
- source_word: פֶּתַח בֵּית
  choice: у входа в дом
  rationale: Естественная русская передача конструктивного сочетания со значением входа или дверного проёма.
- source_word: הָאִישׁ
  choice: того человека
  rationale: Артикль и контекст указывают на уже известного хозяина дома; «того человека» сохраняет простое значение существительного и делает связь ясной по-русски.
- source_word: אֲדוֹנֶיהָ
  choice: её господин
  rationale: Сохраняет обозначение власти и подчинённого положения, не заменяя его более толковательным «муж».
- source_word: אֲשֶׁר ... שָׁם
  choice: где находился
  rationale: Идиоматично передаёт относительную конструкцию «который/где … там».
- source_word: עַד הָאוֹר
  choice: до рассвета
  rationale: В данном контексте выражение обозначает наступление дневного света; «до рассвета» звучит естественно и сохраняет временную границу.
theological_decisions:
- issue: Статус мужчины, названного אֲדוֹנֶיהָ
  choice: её господин
  alternative: её муж
  rationale: Исходный текст использует слово власти «господин», а не прямо термин «муж»; перевод не должен сглаживать социальное напряжение повествования.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичности и суровой прямоты еврейского повествования. Добавление «лежала там» эксплицирует подразумеваемую продолжительность после глагола «упала», чтобы сочетание с «до рассвета» было грамматически естественным по-русски.
