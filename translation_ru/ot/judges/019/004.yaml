  text: And his father-in-law[a], the young woman's father, urged him to stay, and he remained with him three days; and they ate and drank, and spent the nights there.
translation:
  language: ru
  text: И его тесть[a], отец молодой женщины, настойчиво уговаривал его остаться; и тот пробыл у него три дня. Они ели, пили и ночевали там.
  philosophy: optimal-equivalence
  footnotes:
