    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק בּוֹ
  choice: настойчиво уговаривал его остаться
  rationale: Оборот буквально передаёт идею «быть сильным с/против кого-либо», а здесь означает настойчиво склонять человека остаться. Дополнение «остаться» ясно из следующей части стиха и естественно звучит по-русски, не приписывая тестю прямого принуждения.
- source_word: חֹתְנוֹ
  choice: тесть его
  rationale: Термин обозначает отца женщины по отношению к левиту; «тесть» — точное и естественное русское обозначение этого родства.
- source_word: אֲבִי הַנַּעֲרָה
  choice: отец молодой женщины
  rationale: Приложение уточняет, кто именно назван тестем. נַעֲרָה в данном брачном контексте естественно передать как «молодая женщина», а не «девочка».
- source_word: וַיֵּשֶׁב אִתּוֹ
  choice: и тот пробыл у него
  rationale: ישב здесь обозначает продолжение пребывания. «Пробыл у него» передаёт смысл естественно и устраняет возможную неясность двух местоимений «он».
- source_word: שְׁלֹשֶׁת יָמִים
  choice: три дня
  rationale: Прямое соответствие временно́му выражению.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: они ели, пили
  rationale: Сохранены два простых исходных глагола без истолковывающего обобщения «пировали».
- source_word: וַיָּלִינוּ שָׁם
  choice: и ночевали там
  rationale: לון означает проводить ночь, ночевать; форма во множественном числе вместе с контекстом трёх дней допускает повторяющееся действие, естественно выраженное русским несовершенным видом.
