source:
  edition: WLC
  text: וְ/גַם תֶּ֤בֶן גַּם מִסְפּוֹא֙ יֵ֣שׁ לַ/חֲמוֹרֵ֔י/נוּ וְ֠/גַם לֶ֣חֶם וָ/יַ֤יִן יֶשׁ לִ/י֙ וְ/לַֽ/אֲמָתֶ֔/ךָ וְ/לַ/נַּ֖עַר עִם עֲבָדֶ֑י/ךָ אֵ֥ין מַחְס֖וֹר כָּל דָּבָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/019.yaml
  text: Yet there is both straw and fodder for our donkeys[a], and there is bread and wine for me, for your female servant, and for the young man with your servants[c][b]; there is no lack of anything.
translation:
  language: ru
  text: Есть и солома, и корм для наших ослов[a], есть также хлеб и вино — для меня, для твоей служанки[b] и для юноши, который с твоими слугами[c]. Ни в чём нет недостатка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И также солома, и корм есть для наших ослов, и также хлеб и вино…» Повторение «также» в еврейском тексте усиливает мысль о достаточности припасов.'
    reason: lexical_alternative
  - marker: b
    text: «Твоя служанка» — почтительное, самоуничижительное обозначение женщины, путешествовавшей с говорящим; это не обязательно указание на то, что она действительно была служанкой хозяина дома.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «и для юноши с твоими слугами». Сочетание необычно; выражение «твои слуги» может быть почтительным обозначением всей группы путников.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְגַם ... גַּם ... וְגַם
  choice: есть и… и… есть также
  rationale: Передаёт повторение גם и его присоединительно-усилительную функцию естественными средствами современного русского языка.
- source_word: תֶּבֶן
  choice: солома
  rationale: Обычное обозначение соломы, служившей кормом или подстилкой для животных.
- source_word: מִסְפּוֹא
  choice: корм
  rationale: Современное и понятное обозначение корма для животных; в данном контексте точнее и естественнее, чем книжное «фураж».
- source_word: לַחֲמוֹרֵינוּ
  choice: для наших ослов
  rationale: Сохраняет значение существительного и притяжательный суффикс первого лица множественного числа.
- source_word: לֶחֶם וָיַיִן
  choice: хлеб и вино
  rationale: Сохраняет конкретно названные припасы, не расширяя значение לֶחֶם до общего «пища».
- source_word: יֶשׁ לִי
  choice: есть… для меня
  rationale: Передаёт еврейскую конструкцию наличия и одновременно естественно звучит по-русски.
- source_word: אֲמָתֶךָ
  choice: твоя служанка
  rationale: Передаёт женский род и почтительно-самоуничижительное обозначение женщины без архаичного «раба твоя».
- source_word: לַנַּעַר
  choice: для юноши
  rationale: Сохраняет широкое значение נַעַר; из контекста ясно, что это молодой спутник или слуга.
- source_word: עִם עֲבָדֶיךָ
  choice: который с твоими слугами
  rationale: Сохраняет форму второго лица в масоретском тексте и наиболее вероятную связь оборота с «юношей», не исправляя необычную формулировку.
- source_word: אֵין מַחְסוֹר כָּל דָּבָר
  choice: Ни в чём нет недостатка
  rationale: Близко передаёт безличную еврейскую идиому полной обеспеченности и звучит достойно и понятно.
