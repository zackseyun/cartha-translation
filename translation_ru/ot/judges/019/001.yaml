revisions:
- from: И случилось в те дни[a], когда в Израиле не было царя, что один левит жил в отдалённых местах нагорья Ефрема. Он взял себе женщину-наложницу[b] из Вифлеема в Иудее.
  to: И случилось в те дни[a], когда в Израиле не было царя, что один левит жил в отдалённых местах нагорья Ефрема. Он взял себе женщину — наложницу[b] из Вифлеема в Иудее.
