  text: וַ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מֶ֖לֶךְ אֵ֣ין בְּ/יִשְׂרָאֵ֑ל וַ/יְהִ֣י אִ֣ישׁ לֵוִ֗י גָּ֚ר בְּ/יַרְכְּתֵ֣י הַר אֶפְרַ֔יִם וַ/יִּֽקַּֽח ל/וֹ֙ אִשָּׁ֣ה פִילֶ֔גֶשׁ מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: ru
  text: И случилось в те дни[a], когда в Израиле не было царя, что один левит жил в отдалённых местах нагорья Ефрема. Он взял себе женщину — наложницу[b] из Вифлеема в Иудее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И случилось в те дни — а царя в Израиле не было, — что…» В еврейском тексте это сочинительная часть предложения, которую можно понимать и как отдельное сообщение, и как указание на временной фон.'
    reason: alternative_reading
  - marker: b
    text: Наложница — женщина, состоявшая с мужчиной в признанном союзе, но имевшая более низкий общественный статус, чем жена; речь не просто о случайной партнёрше.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: И случилось в те дни
  rationale: Сохраняет вводную повествовательную формулу и обычное временное выражение, не прибегая к архаичному «и было».
- source_word: וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל
  choice: когда в Израиле не было царя
  rationale: Формально сочинённая еврейская клауза здесь естественно читается как временной фон; её возможная самостоятельность отмечена в сноске.
- source_word: אִישׁ לֵוִי
  choice: один левит
  rationale: В современном русском слово «левит» уже обозначает мужчину; добавление «мужчина» было бы тяжеловесным, тогда как «один» вводит нового участника повествования.
- source_word: גָּר
  choice: жил
  rationale: Передаёт проживание в данной местности, не утверждая сверх контекста, было ли оно временным или зависимым.
- source_word: בְּיַרְכְּתֵי הַר אֶפְרַיִם
  choice: в отдалённых местах нагорья Ефрема
  rationale: יַרְכְּתֵי указывает на дальние, окраинные части, а הַר אֶפְרַיִם — на горный регион, а не на одну гору.
- source_word: וַיִּקַּח לוֹ
  choice: Он взял себе
  rationale: Сохраняет значение вступления в признанный союз и оттенок местоименного לוֹ «себе», при этом новое русское предложение остаётся ясным.
- source_word: אִשָּׁה פִילֶגֶשׁ
  choice: женщину-наложницу
  rationale: Передаёт оба существительных и социально определённый статус женщины, не сводя выражение ни просто к «женщине», ни к случайной партнёрше.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: из Вифлеема в Иудее
  rationale: Ясно обозначает Вифлеем, расположенный в Иудее, и отличает его от других одноимённых мест.
theological_decisions:
- issue: Рефрен книги Судей об отсутствии царя
  choice: когда в Израиле не было царя
  alternative: и не было царя в Израиле
  rationale: Основной текст естественно представляет слова как обстоятельственный фон, но не превращает их в одобрение монархии; формально возможное сочинительное прочтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским повествовательным тоном. Географическое «нагорье Ефрема» передаёт регион, а не отдельную гору; синтаксис разделён на два предложения ради естественности и ясности.
