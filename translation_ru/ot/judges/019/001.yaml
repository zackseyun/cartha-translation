  source_fidelity: 'Основной смысл передан точно: сохранены повествовательная формула, временной/контекстуальный рефрен об отсутствии царя, левит, проживание в отдалённой части нагорья Ефрема, союз с наложницей и происхождение женщины из Вифлеема Иудейского. Синтаксическое членение на два русских предложения не меняет референцию второго глагола: «он» однозначно относится к левиту.'
