  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
translation:
  language: ru
  text: Они свернули туда, чтобы войти в Гиву и переночевать. Он вошёл и сел на городской площади[a], и никто не принял их в свой дом на ночлег[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на широкой улице города». Еврейское слово может обозначать как широкую улицу, так и открытое городское пространство, площадь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не было человека, который принял бы их в дом», то есть никто из жителей не предложил им гостеприимства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֻרוּ
  choice: Они свернули
  rationale: Глагол סור в контексте пути означает отклониться от дороги, свернуть, а не просто остановиться.
- source_word: לָבוֹא לָלוּן
  choice: чтобы войти ... и переночевать
  rationale: 'Сочетание инфинитивов передаёт цель: войти в город и остаться там на ночь; «переночевать» естественно и точно передаёт לון.'
- source_word: בַּגִּבְעָה
  choice: в Гиву
  rationale: 'После глагола движения русский винительный падеж естественно передаёт направленность: войти в Гиву.'
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: Он вошёл и сел
  rationale: 'Единственное число оригинала сохранено: повествование выделяет ведущего путника как представителя всей группы.'
- source_word: בִּרְחוֹב הָעִיר
  choice: на городской площади
  rationale: רְחוֹב может обозначать широкое открытое общественное пространство, то есть площадь; это значение естественно в сцене ожидания гостеприимства.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתָם הַבַּיְתָה
  choice: но никто не принял их в свой дом
  rationale: Буквально речь идёт об отсутствии человека, который «собрал бы/ввёл бы» их в дом. Русское «никто не принял их в свой дом» ясно выражает подразумеваемое в контексте гостеприимство, не меняя смысла.
- source_word: לָלוּן
  choice: на ночлег
  rationale: 'Повтор корня לון сохранён смыслом, но передан разнообразно и естественно по-русски: сначала «переночевать», затем «на ночлег».'
