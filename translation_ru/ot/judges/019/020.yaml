id: JDG.19.20
reference: Judges 19:20
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הָ/אִ֤ישׁ הַ/זָּקֵן֙ שָׁל֣וֹם לָ֔/ךְ רַ֥ק כָּל מַחְסוֹרְ/ךָ֖ עָלָ֑/י רַ֥ק בָּ/רְח֖וֹב אַל תָּלַֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
translation:
  language: ru
  text: 'Старик сказал: «Мир тебе! Всё, в чём ты нуждаешься, я беру на себя; только не ночуй на площади[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на улице». Еврейское слово обозначает открытое общественное место в городе, обычно площадь.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  choice: Старик
  rationale: Естественное для русского повествования обозначение пожилого мужчины; контекст не предполагает должности старейшины.
- source_word: שָׁלוֹם לָךְ
  choice: Мир тебе!
  rationale: Сохраняет ключевое значение שָׁלוֹם и естественно передаёт формулу приветствия и заверения.
- source_word: רַק
  choice: в первом случае не выражено отдельно; во втором — «только»
  rationale: Первое רַק вводит принимаемое хозяином условие/обязательство и по-русски естественно передаётся самой конструкцией «я беру на себя»; второе ясно ограничивает предложение гостеприимства.
- source_word: כָּל מַחְסוֹרְךָ
  choice: всё, в чём ты нуждаешься
  rationale: Передаёт как значение недостатка, так и конкретные нужды гостя, оставаясь естественным по-русски.
- source_word: עָלָי
  choice: я беру на себя
  rationale: Русский идиом точно выражает личную ответственность говорящего за обеспечение нужд гостя.
- source_word: בָּרְחוֹב
  choice: на площади
  rationale: В данном городском контексте רְחוֹב обозначает открытое общественное пространство, площадь; возможное более широкое значение отмечено в сноске.
- source_word: אַל תָּלַן
  choice: не ночуй
  rationale: Кратко и точно передаёт запрет оставаться где-либо на ночь.
theological_decisions: []
