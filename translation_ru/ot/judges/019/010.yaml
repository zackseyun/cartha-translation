  yaml_path: translation/ot/judges/019/010.yaml
  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
translation:
  language: ru
  text: Но тот человек не захотел оставаться на ночь. Он встал, пошёл и добрался до места напротив Иевуса (то есть[a] Иерусалима). С ним были два осёдланных осла и его наложница.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в окрестности Иевуса»; возможно также: «к месту перед Иевусом». Еврейское выражение указывает на место напротив города или перед ним, но не обязательно внутри него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: не захотел
  rationale: Глагол выражает отсутствие согласия или готовности; «не захотел» естественно передаёт сознательное решение, не усиливая его до резкого отказа.
- source_word: לָלוּן
  choice: оставаться на ночь
  rationale: Инфинитив обозначает ночёвку; выбранное выражение ясно и естественно в современном русском.
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  choice: Он встал, пошёл и добрался
  rationale: Сохранена трёхчастная последовательность действий; «добрался» естественно передаёт прибытие к указанному месту.
- source_word: עַד נֹכַח
  choice: до места напротив
  rationale: Выражение указывает на точку перед городом или напротив него, а не обязательно внутри города; слово «места» добавлено для естественности русского синтаксиса.
- source_word: יְבוּס הִיא יְרוּשָׁלָם
  choice: Иевуса (то есть Иерусалима)
  rationale: Пояснительное приложение отождествляет Иевус с Иерусалимом; скобки естественно оформляют это авторское уточнение.
- source_word: צֶמֶד חֲמוֹרִים
  choice: два осла
  rationale: צֶמֶד обозначает пару животных; конкретное «два осла» в данном контексте звучит по-русски естественнее, чем «пара ослов».
- source_word: חֲבוּשִׁים
  choice: осёдланных
  rationale: Причастие описывает ослов, снаряжённых для пути; в контексте наиболее вероятно значение «осёдланные».
- source_word: פִּילַגְשׁוֹ
  choice: его наложница
  rationale: «Наложница» — точный и устоявшийся русский эквивалент, сохраняющий особый общественно-семейный статус женщины.
