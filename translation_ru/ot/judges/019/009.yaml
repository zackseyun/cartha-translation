base_translation:
  language: en
  yaml_path: translation/ot/judges/019/009.yaml
  text: When the man rose to leave with his concubine and his attendant, his father-in-law, the young woman’s father, said to him, “Look, the day is waning toward evening. Please stay the night. Look, the day is nearly over[a]. Spend the night here and let your heart be glad. Then rise early tomorrow for your journey[b], and go home[c].”
translation:
  language: ru
  text: 'Когда тот человек поднялся, чтобы уйти со своей наложницей и слугой, тесть, отец молодой женщины, сказал ему: «Посмотри, день уже клонится к вечеру. Пожалуйста, останьтесь на ночь. Посмотри, день уже подходит к концу[a]. Переночуйте здесь, и пусть у тебя будет радостно на сердце. А завтра встаньте пораньше, отправляйтесь в путь[b], а ты иди домой[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «день устраивается станом» — образ дня, который словно останавливается и подходит к концу.'
    reason: source_image
  - marker: b
    text: Формы «встаньте» и «отправляйтесь» стоят во множественном числе и обращены ко всей группе путешественников; далее «иди» стоит в единственном числе и обращено к мужчине.
    reason: grammar
  - marker: c
    text: 'Буквально: «иди в свой шатёр»; здесь это обычное выражение со значением «иди домой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: тот человек
  rationale: Обычное значение — «человек, мужчина»; указательное «тот» естественно связывает персонажа с предшествующим рассказом, не заменяя повествовательное обозначение словом «муж».
- source_word: פִילַגְשׁוֹ
  choice: своей наложницей
  rationale: Передаёт установленную в повествовании социальную категорию и не сглаживает её до общего «жена».
- source_word: נַעֲרוֹ
  choice: слугой
  rationale: В данном контексте слово обозначает сопровождающего слугу; возраст персонажа здесь не является смысловым центром.
- source_word: חֹתְנוֹ אֲבִי הַנַּעֲרָה
  choice: тесть, отец молодой женщины
  rationale: Сохраняются и точное родственное обозначение, и поясняющее приложение исходного текста.
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  choice: день уже клонится к вечеру
  rationale: Естественная русская формула передаёт ослабление и убывание дня по мере приближения вечера.
- source_word: לִינוּ נָא
  choice: Пожалуйста, останьтесь на ночь
  rationale: Множественное повелительное обращено ко всей группе; просьба выражена современно и ясно.
- source_word: חֲנוֹת הַיּוֹם
  choice: день уже подходит к концу
  rationale: Основной текст передаёт временной смысл необычного образа, а буквальный образ отмечен в сноске.
- source_word: וְיִיטַב לְבָבֶךָ
  choice: пусть твоё сердце повеселится
  rationale: Сохраняется образ сердца и оттенок радости, а не только общее благополучие.
- source_word: וְהִשְׁכַּמְתֶּם מָחָר
  choice: завтра встаньте пораньше и отправляйтесь в путь
  rationale: Множественное число обращения к путешествующей группе явно отражено в русском тексте.
- source_word: וְהָלַכְתָּ לְאֹהָלֶךָ
  choice: и ты пойдёшь домой
  rationale: Единственное число обращено к мужчине; «в свой шатёр» здесь является обычным выражением возвращения домой и может в буквальном виде вводить современного читателя в заблуждение.
