base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
translation:
  language: ru
  text: 'И каждый, кто это видел, говорил: «Ничего подобного не случалось и не видели со дня, когда сыны Израиля[a] вышли из Египта, до сего дня. Обдумайте это, посоветуйтесь и обсудите».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне»; букв.: «сыны Израиля».'
    reason: Лексическая альтернатива для устойчивого этнонима בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וְהָיָה כָל הָרֹאֶה וְאָמַר
  choice: И каждый, кто это видел, говорил
  rationale: Конструкция וְהָיָה вводит сложившуюся ситуацию и естественно передаётся без отдельного «и было»; форма וְאָמַר в сочетании с обобщающим причастием описывает повторявшуюся реакцию каждого увидевшего.
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  choice: Ничего подобного не случалось и не бывало видано
  rationale: Сохранено усилительное сочетание двух глаголов — «не случалось» и «не было видено»; оборот «не бывало видано» звучит по-русски естественно и торжественно.
- source_word: לְמִיּוֹם עֲלוֹת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: со дня, когда сыны Израиля вышли из земли Египетской
  rationale: Глагол עלה в формуле исхода передан естественным русским «вышли», а בְּנֵי יִשְׂרָאֵל — формально близким выражением «сыны Израиля».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и до этого дня
  rationale: Сохранена точка отсчёта в повествовательном настоящем автора без её модернизации до «сегодня».
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  choice: Обдумайте это
  rationale: Идиома призывает обратить на происшедшее серьёзное внимание; «обдумайте» естественно выражает умственное сосредоточение и сохраняет связь с последующим совещанием.
- source_word: עֻצוּ
  choice: посоветуйтесь
  rationale: Императив передаёт призыв к совместному совету и обсуждению, а не уже принятое решение.
- source_word: וְדַבֵּרוּ
  choice: и скажите
  rationale: 'Сохранены краткость и отсутствие выраженного дополнения: собравшиеся должны высказать своё суждение или решение.'
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; потомки Израиля
  rationale: Буквальная родовая формула сохранена в основном тексте как устойчивая библейская этнонимическая конструкция; более современный коллективный эквивалент указан в сноске без изменения смысла.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Повтор исходного текста сохранён, но синтаксис сделан естественным; три заключительных повеления оставлены краткими и последовательными.
