base_translation:
  language: en
  yaml_path: translation/ot/judges/019/025.yaml
  text: But the men were not willing to listen to him[a], so the man seized his concubine and brought her out to them. And they knew her and abused her all night until morning, and they let her go at the dawn.
translation:
  language: ru
  text: Но эти люди не захотели его слушать. Тогда тот человек схватил свою наложницу и вывел её к ним. Они познали её[a] и издевались над ней всю ночь до утра, а с восходом зари отпустили её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «познали её»; в этом контексте это эвфемизм, обозначающий сексуальное насилие.'
    reason: 'Лексическая альтернатива: основной текст сохраняет еврейский эвфемизм, а примечание раскрывает его смысл в данном контексте.'
lexical_decisions:
- source_word: אָבוּ
  choice: не захотели
  rationale: Передаёт волевой оттенок אבה — нежелание согласиться, не добавляя мотивов.
- source_word: לִשְׁמֹעַ לוֹ
  choice: его слушать
  rationale: В данном контексте שׁמע с ל означает прислушаться к просьбе; «слушать» сохраняет естественность и не усиливает значение до «повиноваться».
- source_word: וַיַּחֲזֵק
  choice: схватил
  rationale: Передаёт решительное, насильственное действие חזק, не смягчая поступок мужчины.
- source_word: פִּילַגְשׁוֹ
  choice: свою наложницу
  rationale: «Наложница» — устоявшееся русское обозначение социального положения, выраженного словом פילגש.
- source_word: וַיֹּצֵא אֲלֵיהֶם הַחוּץ
  choice: вывел её к ним
  rationale: Каузативная форма יצא означает «вывести». Направление наружу уже естественно выражено глаголом «вывел», поэтому отдельное «наружу» было бы избыточным.
- source_word: וַיֵּדְעוּ אוֹתָהּ
  choice: они познали её
  rationale: Сохраняет эвфемизм ידע и его мрачную двусмысленность; примечание прямо поясняет сексуальное насилие, однозначное в контексте.
- source_word: וַיִּתְעַלְּלוּ בָהּ
  choice: издевались над ней
  rationale: Передаёт унизительное и жестокое обращение, выраженное хитпаэлем עלל, и звучит ясно в современном русском языке.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: всю ночь до утра
  rationale: Естественно и точно передаёт продолжительность происходившего.
- source_word: וַיְשַׁלְּחוּהָ
  choice: отпустили её
  rationale: В контексте שלח означает освобождение или прекращение удержания; «отпустили» точно и естественно.
- source_word: בַּעֲלוֹת הַשָּׁחַר
  choice: с восходом зари
  rationale: Сохраняет образ буквального «восхождения зари» и достойный повествовательный регистр.
