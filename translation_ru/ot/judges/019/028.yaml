  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
translation:
  language: ru
  text: 'Он сказал ей: «Встань, пойдём». Но никто не ответил[a]. Тогда он поместил её на осла[b]; после этого мужчина встал и отправился к себе[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и не было отвечающего» или «и никто не отвечал».'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский глагол буквально означает «взял»; в данном контексте: «поместил» или «поднял её на животное».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «к своему месту»; возможно также: «к себе домой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Он сказал ей
  rationale: Естественная передача повествовательной формы wayyiqtol; начальный союз не требуется воспроизводить в русском в каждом звене цепи.
- source_word: קוּמִי וְנֵלֵכָה
  choice: Встань, пойдём
  rationale: Императив женского рода передан формой «встань», а когортатив первого лица множественного числа — естественным русским побуждением «пойдём».
- source_word: וְאֵין עֹנֶה
  choice: Но никто не ответил
  rationale: Буквально конструкция означает «и нет отвечающего»; контекстуальное противопоставление естественно выражено союзом «но», а отсутствие отклика — личной конструкцией.
- source_word: וַיִּקָּחֶהָ עַל הַחֲמוֹר
  choice: Тогда он взял её и положил на осла
  rationale: לקח буквально значит «взял»; сочетание с עַל показывает, что он поместил её на животное. Развёрнутая передача сохраняет основное значение глагола и ясно выражает действие.
- source_word: וַיָּקָם הָאִישׁ
  choice: после этого мужчина встал
  rationale: Сохраняется отдельное действие קום, не сливаемое со следующим глаголом движения; «мужчина» передаёт определённое הָאִישׁ в уже известном контексте.
- source_word: וַיֵּלֶךְ לִמְקֹמוֹ
  choice: и отправился к себе
  rationale: Буквально — «пошёл к своему месту»; в данном контексте выражение указывает на возвращение к месту проживания. «К себе» естественно по-русски, а буквальная возможность отмечена в сноске.
