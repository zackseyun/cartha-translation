base_translation:
  language: en
  yaml_path: translation/ot/judges/019/017.yaml
  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
translation:
  language: ru
  text: 'Он поднял глаза и увидел путника[a] на городской площади[b]. Старик спросил: «Куда ты идёшь и откуда пришёл?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «странника». Еврейское слово обозначает человека, находящегося в пути, а в контексте гостеприимства может также указывать на гостя.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на широкой улице города». Еврейское слово точнее обозначает широкое открытое общественное место — площадь или широкую улицу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Он поднял глаза
  rationale: Еврейская идиома буквально означает «поднял свои глаза». Русское «поднял глаза» естественно передаёт движение взгляда и сохраняет образ исходного текста.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Передано основное значение зрительного восприятия без более толковательного оттенка глагола «заметил».
- source_word: הָאִישׁ הָאֹרֵחַ
  choice: путника
  rationale: Сочетание обозначает мужчину, находящегося в пути. «Путник» ясно и сжато передаёт это значение; «гость» преждевременно приписывало бы ему статус принятого в доме человека.
- source_word: בִּרְחֹב הָעִיר
  choice: на городской площади
  rationale: רְחוֹב здесь обозначает широкое открытое общественное место, вероятнее площадь, а не узкую улицу. Русское выражение естественно и соответствует повествовательному контексту.
- source_word: הָאִישׁ הַזָּקֵן
  choice: Старик
  rationale: Прямое и естественное обозначение пожилого мужчины в русском повествовании; повтор слова «мужчина» не требуется.
- source_word: אָנָה תֵלֵךְ
  choice: Куда ты идёшь
  rationale: Вопрос относится к цели пути. Настоящее время естественно передаёт незавершённую форму в непосредственном разговоре.
- source_word: וּמֵאַיִן תָּבֹוא
  choice: и откуда пришёл
  rationale: Вопрос относится к месту отправления путника. Русский глагол совершенного вида естественно обозначает уже пройденный этап пути, не меняя сути вопроса о происхождении маршрута.
