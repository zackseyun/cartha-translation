base_translation:
  language: en
  yaml_path: translation/ot/judges/019/005.yaml
  text: On the fourth day[a], they rose early in the morning, and he got up to go. But the young woman’s father said to his son-in-law, “Refresh your heart with a morsel of bread[b], and afterward you may go.”
translation:
  language: ru
  text: 'На четвёртый день они встали рано утром, и он встал, чтобы уйти. Но отец молодой женщины сказал своему зятю: «Подкрепи силы куском хлеба, а потом отправляйтесь[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Отец обращается к зятю в единственном числе, но еврейский глагол «отправляйтесь» стоит во множественном числе и, вероятно, относится ко всей отправляющейся группе.
    reason: grammatical_clarification
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: На четвёртый день
  rationale: Прямое обозначение времени; не добавляется отсутствующее в еврейском тексте уточнение «пребывания».
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: они встали рано утром
  rationale: Передаёт множественное число и значение раннего подъёма естественным современным русским языком.
- source_word: וַיָּקָם לָלֶכֶת
  choice: он собрался в путь
  rationale: Естественно передаёт переход к единственному числу и намерение левита уйти, без предположения, что он уже отправился.
- source_word: אֲבִי הַנַּעֲרָה
  choice: отец молодой женщины
  rationale: נַעֲרָה здесь обозначает молодую женщину; вариант сохраняет возрастную неопределённость и достоинство повествования.
- source_word: חֲתָנוֹ
  choice: своему зятю
  rationale: В данном контексте это ясное русское обозначение родства между отцом женщины и левитом.
- source_word: סְעָד לִבְּךָ
  choice: Подкрепись
  rationale: Еврейская идиома буквально означает «подкрепи своё сердце», но в контексте приглашения поесть естественно означает подкрепить силы пищей.
- source_word: פַּת לֶחֶם
  choice: куском хлеба
  rationale: Сохраняет конкретный образ хлеба и значение небольшой порции без архаичного оттенка слова «ломоть».
- source_word: וְאַחַר תֵּלֵכוּ
  choice: а потом вы отправитесь
  rationale: Сохраняет множественное число глагола, относящееся к зятю и сопровождающим его людям; будущее время естественно звучит как разрешение продолжить путь.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Еврейская идиома סְעָד לִבְּךָ передана по смыслу как «подкрепись», поскольку буквальное «подкрепи своё сердце» в современном русском может быть понято как призыв ободриться, а не поесть. Множественное число заключительного глагола сохранено в основном тексте.
