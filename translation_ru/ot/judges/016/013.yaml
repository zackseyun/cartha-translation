base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
translation:
  language: ru
  text: 'Тогда Далида сказала Самсону: «До сих пор ты смеялся надо мной и лгал мне. Скажи мне, чем можно тебя связать». Он ответил ей: «Если вплетёшь семь прядей моих волос в ткань[a]…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в основу»; возможно также: «на ткацком станке». Значение еврейского ткацкого термина здесь не вполне ясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתַ֤לְתָּ בִּי
  choice: ты смеялся надо мной
  rationale: Передаёт значение насмешки и обманного издевательства; последующая фраза отдельно выражает мысль о лжи.
- source_word: כְּזָבִים
  choice: ложь
  rationale: Естественный современный русский эквивалент множественного обозначения ложных слов; собирательное единственное здесь звучит идиоматично.
- source_word: הַגִּידָה לִּי
  choice: Скажи мне
  rationale: Прямой и естественный перевод повелительной формы נגד.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: чем можно тебя связать
  rationale: Сохраняет инструментальное значение בַּמֶּה («чем») и пассивную семантику глагола.
- source_word: תַּאַרְגִי
  choice: вплетёшь
  rationale: В данном контексте речь идёт о вплетении волос в уже создаваемую ткань; «вплетёшь» естественнее русского буквального «соткёшь ... с тканью».
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשִׁי
  choice: семь прядей моих волос
  rationale: מַחְלְפוֹת может обозначать пряди или косы; «пряди волос» понятно и не утверждает без необходимости, что волосы были заплетены в косы.
- source_word: עִם הַמַּסָּכֶת
  choice: в ткань
  rationale: Специализированный ткацкий термин может указывать на ткань, основу или ткацкое устройство. Основной текст передаёт наиболее связный смысл действия, а неоднозначность отмечена в сноске.
