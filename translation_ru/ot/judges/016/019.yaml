base_translation:
  language: en
  yaml_path: translation/ot/judges/016/019.yaml
  text: So she made him sleep on her knees[a], and she called for a man, and she shaved off the seven locks of his head. Then she began to afflict him[c][b], and his strength left him.
translation:
  language: ru
  text: Она усыпила его у себя на коленях, позвала мужчину и состригла семь прядей волос с его головы[a]. Затем она начала мучить его, и сила оставила его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «семь кос»; еврейское слово может обозначать пряди или заплетённые локоны.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּיַשְּׁנֵהוּ
  choice: усыпила его
  rationale: Каузативная форма от ישׁן означает, что Далила сделала так, чтобы Самсон уснул; «усыпила» естественно и кратко передаёт это значение, не уточняя способ.
- source_word: עַל בִּרְכֶּיהָ
  choice: у себя на коленях
  rationale: Буквально говорится о коленях; русское выражение естественно обозначает положение головой на её коленях и не требует замены на более обобщённое «на руках».
- source_word: וַתִּקְרָא לָאִישׁ
  choice: позвала человека
  rationale: Конструкция может означать вызов человека для выполнения действия. Отсутствие артикля позволяет сохранить неопределённость посредством «человека», не вводя явно нового персонажа как «какого-то мужчину».
- source_word: וַתְּגַלַּח
  choice: обрила
  rationale: Глагол имеет форму женского рода единственного числа, поэтому грамматическим субъектом остаётся Далила, даже если действие могло быть совершено через позванного человека.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ
  choice: семь прядей на его голове
  rationale: מַחְלְפוֹת обозначает пряди или заплетённые локоны. «Пряди» — понятный современный вариант, сохраняющий некоторую неопределённость относительно их формы.
- source_word: לְעַנּוֹתוֹ
  choice: мучить его
  rationale: Piel от ענה может означать мучить, притеснять, причинять страдание. «Мучить» сохраняет широкое значение и не сводит действие лишь к ослаблению.
- source_word: וַיָּסַר כֹּחוֹ מֵעָלָיו
  choice: сила оставила его
  rationale: Естественно передаёт еврейскую идиому об уходе силы, сохраняя образное выражение исходного текста.
theological_decisions:
- issue: Источник и природа утраченной силы Самсона
  choice: «сила оставила его» без прямого упоминания Господа
  alternative: «данная Господом сила оставила его»
  rationale: В этом стихе сказано только об уходе силы Самсона. Связь с Господом раскрывается контекстом, но её явное добавление здесь устранило бы сдержанность и напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с простым, достоинственным повествовательным ритмом. Сохранены женский субъект глагола «обрила», неопределённость личности позванного человека и отсутствие добавленного указания на Господа как непосредственный источник уходящей силы в данном стихе.
