lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: После этого
  rationale: Естественно передаёт временную последовательность еврейской повествовательной формулы без излишне буквального «и было».
- source_word: וַיֶּאֱהַב
  choice: он полюбил
  rationale: Прямо передаёт значение אָהַב и не добавляет оттенков, которых контекст явно не выражает.
- source_word: אִשָּׁה
  choice: женщину
  rationale: Контекст не указывает на брак, поэтому нейтральное «женщина» точнее, чем «жена».
- source_word: בְּנַחַל שֹׂרֵק
  choice: жившую в долине Сорек
  rationale: Предлог בְּ указывает на местонахождение женщины; причастный оборот позволяет естественно связать географическое уточнение с ней. נַחַל может обозначать долину, русло или сезонный водоток; «долина» понятно современному читателю.
- source_word: וּשְׁמָהּ
  choice: Её звали
  rationale: Естественный современный русский эквивалент буквального «и имя её».
- source_word: דְּלִילָה
  choice: Далила
  rationale: Использована укоренившаяся в русской библейской традиции форма личного имени.
