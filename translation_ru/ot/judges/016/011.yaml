  text: וַ/יֹּ֣אמֶר אֵלֶ֔י/הָ אִם אָס֤וֹר יַאַסְר֨וּ/נִי֙ בַּ/עֲבֹתִ֣ים חֲדָשִׁ֔ים אֲשֶׁ֛ר לֹֽא נַעֲשָׂ֥ה בָ/הֶ֖ם מְלָאכָ֑ה וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
translation:
  language: ru
  text: 'Он сказал ей: «Если меня крепко свяжут новыми верёвками, которыми никогда не пользовались для работы[a], то я ослабею и стану как всякий другой человек[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которыми не было сделано никакой работы».'
    reason: Более буквальная передача еврейской пассивной конструкции.
  - marker: b
    text: 'Или: «как один из людей».'
    reason: Более формально близкая передача выражения כְּאַחַד הָאָדָם; в контексте оно означает обычного человека.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Он сказал ей
  rationale: Обычная повествовательная формула; начальный союз ו в современном русском повествовании можно не выражать отдельно.
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  choice: Если меня крепко свяжут
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает действие; наречие «крепко» естественно передаёт этот акцент, не воспроизводя еврейский повтор буквально.
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  choice: новыми верёвками
  rationale: עֲבֹתִים обозначает прочные верёвки или канаты; «верёвки» здесь ясно и естественно, а חֲדָשִׁים значит «новые».
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  choice: которыми ещё не пользовались для работы
  rationale: 'Передаёт смысл пассивной конструкции: этими верёвками прежде не выполняли никакой работы, то есть они не были в употреблении.'
- source_word: וְחָלִיתִי
  choice: то я ослабею
  rationale: חלה здесь означает стать слабым, лишиться силы; будущее «ослабею» точно и естественно в контексте слов Самсона.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: и стану как один из людей
  rationale: Сохраняет образное сравнение и конструкцию «как один из», не снимая неоднозначности между «одним из людей» и «любым обычным человеком».
theological_decisions:
- issue: Значение הָאָדָם в выражении כְּאַחַד הָאָדָם
  choice: как один из людей
  alternative: как любой человек; как обыкновенный человек
  rationale: В контексте речь идёт о противопоставлении необычайной силы Самсона обычной человеческой слабости. Основной текст сохраняет форму исходного выражения, а примечание поясняет возможный идиоматический смысл, не превращая его в доктринальное утверждение.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Реплика звучит естественно, но сохраняет выразительное усиление глагола «связать» и структурную неоднозначность заключительного сравнения.
