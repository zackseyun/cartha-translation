  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
translation:
  language: ru
  text: 'Тогда Самсон ухватился за два средних столба[a], на которых держался дом, и упёрся в них[b]: в один — правой рукой, а в другой — левой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «два центральных столба».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «прислонился к ним». Еврейский глагол может обозначать опору на что-либо; «упёрся в них» лучше передаёт вероятный физический смысл в этом контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  choice: обхватил
  rationale: Глагол обозначает крепко схватить, ухватиться. «Обхватил» естественно передаёт сильный и целенаправленный захват столбов.
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  choice: два средних столба
  rationale: הַתָּוֶךְ указывает на середину или внутреннюю часть; «средних» кратко и ясно передаёт расположение столбов, не добавляя архитектурных деталей.
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: на которых держался дом
  rationale: נָכוֹן здесь выражает устойчивое положение или опору. «Держался дом» естественно показывает, что столбы служили несущими опорами.
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  choice: упёрся в них
  rationale: סמך может означать опереться, прислониться или найти опору. В данном физическом контексте «упёрся» передаёт подготовленное усилие, не вводя само последующее действие.
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  choice: в один — правой рукой, а в другой — левой
  rationale: Распределительная конструкция «один… и один» соотносит по одному столбу с правой и левой стороной Самсона. Упоминание рук делает телесное действие ясным и естественным по-русски.
- source_word: הַבַּיִת
  choice: дом
  rationale: «Дом» сохраняет прямое значение еврейского слова; из контекста ясно, что речь идёт о здании.
