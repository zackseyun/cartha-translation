- source_word: הֵתַלְתָּ בִּי
  choice: насмехался надо мной
  rationale: Передаёт личное унижение от насмешливой игры, связанной с обманом; возможные оттенки отмечены в сноске.
- source_word: הִגַּדְתָּ לִּי
  choice: не сказал мне
  rationale: Прямой и естественный разговорный эквивалент глагола נגד в данном контексте.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
