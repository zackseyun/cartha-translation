  yaml_path: translation/ot/judges/016/015.yaml
  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
translation:
  language: ru
  text: 'Тогда она сказала ему: «Как можешь ты говорить: „Я люблю тебя“, если твоё сердце не со мной? Ты уже трижды насмехался надо мной[a] и не сказал мне, в чём твоя великая сила».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «играл со мной», «обманывал меня» или «выставлял меня на посмешище». Еврейский глагол обозначает насмешливую игру с человеком, при которой его вводят в заблуждение.'
    reason: lexical_alternative
