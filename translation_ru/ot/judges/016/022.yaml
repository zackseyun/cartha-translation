  text: וַ/יָּ֧חֶל שְׂעַר רֹאשׁ֛/וֹ לְ/צַמֵּ֖חַ כַּ/אֲשֶׁ֥ר גֻּלָּֽח־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/022.yaml
  text: But the hair of his head began to grow again after it had been shaved[a][b].
translation:
  language: ru
  text: Но волосы у него на голове снова[a] начали расти после того, как их сбрили[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начали расти». Сам еврейский глагол прямо не означает «снова»; этот смысл следует из контекста, где ранее говорится, что волосы были сбриты.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «когда их сбрили»; возможно также понимание: «после того, как обрили его». Еврейский текст допускает разные способы передачи временного оборота и подразумеваемого объекта бритья.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: начали
  rationale: Глагольная форма от חלל в сочетании с инфинитивом означает начало действия; русское «начали» естественно согласуется с множественным «волосы».
- source_word: שְׂעַר רֹאשׁוֹ
  choice: волосы у него на голове
  rationale: Передаёт конструкцию «волосы его головы», сохраняя акцент на волосах Самсона и звуча естественно по-русски.
- source_word: לְצַמֵּחַ
  choice: снова расти
  rationale: צמח означает «расти, прорастать». Слово «снова» прямо не выражено глаголом, но естественно следует из контекста, поскольку волосы перед этим были сбриты; это отмечено сноской.
- source_word: כַּאֲשֶׁר
  choice: после того, как
  rationale: В данном контексте союз выражает временную связь с предшествующим бритьём. Возможное более буквальное «когда» указано в сноске.
- source_word: גֻּלָּח
  choice: их сбрили
  rationale: Пассивная форма от גלח означает «было сбрито». В русском неопределённо-личная конструкция ясно соотносит действие с волосами, не называя исполнителя.
