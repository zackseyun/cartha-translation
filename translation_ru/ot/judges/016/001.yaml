  text: וַ/יֵּ֥לֶךְ שִׁמְשׁ֖וֹן עַזָּ֑תָ/ה וַ/יַּרְא שָׁם֙ אִשָּׁ֣ה זוֹנָ֔ה וַ/יָּבֹ֖א אֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/001.yaml
  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
translation:
  language: ru
  text: Самсон пошёл в Газу. Там он увидел проститутку и вошёл к ней[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вступил с ней в половую связь». Буквально: «вошёл к ней»; в данном контексте это принятое эвфемистическое выражение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Обычный глагол движения в последовательном повествовании; простое «пошёл» естественно передаёт форму и не добавляет лишних оттенков.
- source_word: שִׁמְשׁוֹן
  choice: Самсон
  rationale: Устоявшаяся русская форма личного имени.
- source_word: עַזָּתָה
  choice: в Газу
  rationale: Направительное окончание у названия города обозначает движение к нему; по-русски естественно «в Газу».
- source_word: וַיַּרְא שָׁם
  choice: Там он увидел
  rationale: Передаёт наречие שָׁם и сохраняет естественный порядок слов современного русского повествования.
- source_word: אִשָּׁה זוֹנָה
  choice: проститутку
  rationale: זוֹנָה обозначает женщину, занимающуюся проституцией. «Проститутка» — точное и понятное современному читателю слово; «блудница» звучит архаично и может иметь более широкое значение.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: и вошёл к ней
  rationale: Сохраняет буквальный образ и эвфемистическую форму еврейского выражения, которое в данном контексте подразумевает половую связь.
theological_decisions:
- issue: Следует ли прямо выразить сексуальный смысл וַיָּבֹא אֵלֶיהָ или сохранить еврейский эвфемизм
  choice: 'Сохранить эвфемизм: «вошёл к ней»'
  alternative: «вступил с ней в половую связь»; «переспал с ней»
  rationale: Контекст ясно указывает на половую связь, однако еврейский текст выражает это принятым эвфемизмом. Основной текст сохраняет исходную степень недосказанности, а сноска поясняет смысл.
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной формой. «Проститутка» предпочтена архаичному «блудница»; эвфемизм исходного текста сохранён без усиления его откровенности.
