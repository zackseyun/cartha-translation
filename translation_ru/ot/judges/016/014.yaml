base_translation:
  language: en
  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
translation:
  language: ru
  text: 'Она закрепила их колышком[a] и сказала ему: «Филистимляне идут на тебя, Самсон!» Он пробудился ото сна и вырвал[b] колышек ткацкого станка вместе с тканью[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «штырём»; еврейское слово обозначает колышек, штырь или крупную шпильку.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «выдернул» или «сорвал с места»; еврейский глагол подразумевает удаление закреплённого предмета.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сотканным полотном»; речь идёт о материале на ткацком станке.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְקַע
  choice: закрепила
  rationale: Глагол תקע может означать «вбить», «вонзить» или «закрепить». В контексте плетения волос нейтральное «закрепила» естественно передаёт действие, не уточняя сверх текста устройство станка.
- source_word: בַּיָּתֵד
  choice: колышком
  rationale: יָתֵד обозначает колышек, штырь или крупную шпильку. «Колышек» сохраняет конкретность древнееврейского слова и подходит для детали ткацкого устройства; предлог ב передан как указание на орудие действия.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Филистимляне идут на тебя
  rationale: 'Буквально: «филистимляне на тебе/против тебя». Русская тревожная формула «идут на тебя» сохраняет срочность и враждебную направленность, не утверждая, что нападение уже началось.'
- source_word: וַיִּיקַץ מִשְּׁנָתוֹ
  choice: пробудился ото сна
  rationale: Прямое и стилистически достойное соответствие глаголу יקץ с предложным оборотом «ото сна».
- source_word: וַיִּסַּע
  choice: вырвал
  rationale: В данном физическом контексте נסע означает сорвать с места, выдернуть или унести. «Вырвал» ясно передаёт резкое удаление закреплённых частей, не смешивая значение с обычным «отправился».
- source_word: הַיְתַד הָאֶרֶג
  choice: колышек ткацкого станка
  rationale: Сочетание связывает колышек с ткацким приспособлением. Такой перевод понятен современному читателю и не вводит узкоспециальную реконструкцию его устройства.
- source_word: הַמַּסָּכֶת
  choice: ткань
  rationale: מַסָּכֶת здесь обозначает материал, сотканный на станке. «Ткань» естественнее по-русски, чем технические или архаичные варианты, и не сужает значение до одной только основы.
