translation_notes:
  register: Современный литературный русский с ясной повествовательной динамикой. Местоимение «их» сохраняет подразумеваемую связь с прядями волос из предыдущего стиха. Образ устройства станка не конкретизирован сверх древнееврейского текста; неоднозначные названия его деталей отмечены в сносках.
