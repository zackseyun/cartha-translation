translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «сердца их» сохраняет еврейский образ и достоинство стиля; лексика остаётся понятной современному читателю. Неоднозначность глаголов שׂחק/צחק между развлечением, выступлением и насмешкой сохранена в тексте и пояснена в сноске.
