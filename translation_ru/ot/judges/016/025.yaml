revisions:
- from: 'Когда же сердца их развеселились, они сказали: «Позовите Самсона, пусть он позабавит нас[a]». Самсона позвали из темницы[b], и он забавлял их. Потом его поставили между столбами.'
  to: 'Когда же сердца их развеселились, они сказали: «Позовите Самсона, пусть он позабавит нас[a]». Самсона позвали из темницы[b], и он выступал перед ними. И поставили его между столбами.'
  rationale: Исправление вводит явно выраженный в оригинале оборот «перед ними» и заменяет «потом» на нейтральное повествовательное «и». «Выступал» не определяет, был ли Самсон лишь исполнителем либо объектом насмешек; эта сохранённая неоднозначность поясняется сноской.
