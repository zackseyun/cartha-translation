base_translation:
  language: en
  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
translation:
  language: ru
  text: 'Когда же сердца их развеселились, они сказали: «Позовите Самсона, пусть он позабавит нас[a]». Самсона позвали из темницы[b], и он выступал перед ними. И поставили его между столбами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть он выступит перед нами»; возможно также: «пусть он послужит нам забавой». Еврейский глагол может обозначать развлечение, насмешку или публичное представление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из дома узников», то есть из темницы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי טוֹב לִבָּם
  choice: когда же сердца их развеселились
  rationale: Еврейская идиома буквально говорит о том, что их сердце стало «хорошо»; выбранный вариант сохраняет образ сердца и естественно передаёт состояние веселья.
- source_word: קִרְאוּ לְשִׁמְשׁוֹן
  choice: позовите Самсона
  rationale: Конструкция קרא с ל обозначает вызов или призыв человека; «позовите» естественно звучит как приказ привести Самсона.
- source_word: וִישַׂחֶק לָנוּ
  choice: пусть он позабавит нас
  rationale: Глагол שׂחק здесь может обозначать развлечение, представление или превращение человека в объект насмешки. «Позабавит нас» сохраняет намеренную неоднозначность и не делает происходящее невинной забавой.
- source_word: מִבֵּית הָאֲסִירִים
  choice: из темницы
  rationale: Буквально — «из дома узников». Современное литературное «из темницы» ясно обозначает место заключения и соответствует достоинству повествовательного регистра.
- source_word: וַיְצַחֵק לִפְנֵיהֶם
  choice: и он забавлял их
  rationale: Форма от צחק соотносится с предыдущей просьбой и может подразумевать выступление перед филистимлянами либо унизительное выставление на посмешище; формулировка не устраняет эту напряжённость.
- source_word: וַיַּעֲמִידוּ אֹתוֹ בֵּין הָעַמּוּדִים
  choice: потом его поставили между столбами
  rationale: Каузативная форма עמד означает, что Самсона заставили занять указанное положение; «поставили» кратко и точно передаёт внешнее принуждение.
