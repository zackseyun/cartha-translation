base_translation:
  language: en
  yaml_path: translation/ot/judges/016/016.yaml
  text: And it happened that[a], when she pressed him with her words all the days and urged him on, his soul grew short to the point of death.
translation:
  language: ru
  text: И вот, она изо дня в день донимала его своими речами и принуждала его, так что он изнемог душой, чуть не до смерти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «душа его сократилась, чтобы умереть»; это еврейский оборот, выражающий крайнее внутреннее стеснение, изнеможение или нетерпение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: И было так
  rationale: Передаёт повествовательный переход, сохраняя библейскую выразительность без архаичного оборота «и случилось, когда».
- source_word: הֵצִיקָה לוֹ בִדְבָרֶיהָ
  choice: донимала его своими речами
  rationale: Глагол выражает причиняемое давление и мучительное беспокойство; «донимала» естественно передаёт настойчивое словесное воздействие.
- source_word: כָּל הַיָּמִים
  choice: изо дня в день
  rationale: Естественный русский оборот, точно передающий постоянное повторение действия.
- source_word: וַתְּאַלֲצֵהוּ
  choice: теснила его
  rationale: Сохраняет усиление давления во втором глаголе и не сводит его к простому уговариванию.
- source_word: וַתִּקְצַר נַפְשׁוֹ לָמוּת
  choice: душа его изнемогла до смерти
  rationale: Сохраняет образ души и предельную степень внутреннего мучения, но избегает неестественного буквального выражения «душа стала коротка».
theological_decisions:
- issue: Значение נֶפֶשׁ в идиоме וַתִּקְצַר נַפְשׁוֹ
  choice: душа его изнемогла
  alternative: ему стало невмоготу
  rationale: Выбор сохраняет антропологический образ исходного текста, не превращая его при этом в догматическое утверждение о природе души.
- issue: Смысл לָמוּת
  choice: до смерти
  alternative: так что он захотел умереть
  rationale: Исходный текст обозначает крайнюю степень мучения, но прямо не утверждает, что Самсон желал покончить с собой.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис остаётся близким к последовательности еврейского повествования, а непрозрачная для русского читателя идиома передана естественно и пояснена в сноске.
