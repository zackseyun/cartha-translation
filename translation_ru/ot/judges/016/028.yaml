  text: וַ/יִּקְרָ֥א שִׁמְשׁ֛וֹן אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהֹוִ֡ה זָכְרֵ֣/נִי נָא֩ וְ/חַזְּקֵ֨/נִי נָ֜א אַ֣ךְ הַ/פַּ֤עַם הַ/זֶּה֙ הָ/אֱלֹהִ֔ים וְ/אִנָּקְמָ֧ה נְקַם אַחַ֛ת מִ/שְּׁתֵ֥י עֵינַ֖/י מִ/פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/028.yaml
  text: Then Samson called to Yahweh and said[a], “Lord GOD, please remember me, and please strengthen me just this once, O God, so that I may take vengeance on the Philistines for my two eyes with one act of vengeance.”
translation:
  language: ru
  text: 'И воззвал Самсон к Яхве и сказал: «Владыка Яхве! Вспомни обо мне, прошу, и укрепи меня только на этот раз, Боже, чтобы я одним возмездием отомстил филистимлянам за оба моих глаза[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «за два моих глаза». Речь идёт о глазах Самсона, которых его ослепили филистимляне (см. 16:21).'
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּקְרָא שִׁמְשׁוֹן אֶל־יְהוָה
  choice: И воззвал Самсон к Яхве
  rationale: קרא с אֶל при обращении к Богу означает звать или взывать. «Воззвал» сохраняет молитвенную серьёзность контекста, а личное имя יהוה передано как «Яхве».
- source_word: אֲדֹנָי יֱהֹוִה
  choice: Владыка Яхве
  rationale: Так различаются титул אֲדֹנָי и личное имя יהוה без искусственного повтора «Господь Господь» и без замены имени словом «Бог».
- source_word: זָכְרֵנִי נָא
  choice: Вспомни обо мне, прошу
  rationale: Частица נָא при повелительной форме выражает настойчивую просьбу; «прошу» естественно передаёт её в современной русской молитвенной речи.
- source_word: וְחַזְּקֵנִי נָא
  choice: и укрепи меня
  rationale: Пиэль глагола חזק здесь означает наделить силой. «Укрепи меня» точно передаёт просьбу, не добавляя указания на конкретный вид силы.
- source_word: אַךְ הַפַּעַם הַזֶּה
  choice: только на этот раз
  rationale: Оборот ограничивает просьбу нынешним, единственным случаем; русская формулировка естественна и сохраняет ограничительное значение אַךְ.
- source_word: הָאֱלֹהִים
  choice: Боже
  rationale: Слово употреблено как прямое обращение; звательная форма «Боже» передаёт эту функцию естественно для русского языка.
- source_word: וְאִנָּקְמָה
  choice: чтобы я … отомстил
  rationale: Когортатив выражает желаемую цель просьбы Самсона. Конструкция с «чтобы» передаёт целевой и волевой оттенок.
- source_word: נְקַם אַחַת
  choice: одним возмездием
  rationale: Однокоренная с глаголом конструкция подчёркивает возмездие, а אַחַת указывает на его однократность. В русском сочетание с глаголом «отомстил» сохраняет этот акцент без неестественного буквального повтора.
- source_word: מִשְּׁתֵי עֵינַי
  choice: за оба моих глаза
  rationale: Буквально оборот говорит о «двух моих глазах» и в контексте означает возмездие за ослепление Самсона. «За оба моих глаза» ясно и близко к форме основного еврейского текста, при этом неоднозначность конструкции отмечена в сноске.
- source_word: מִפְּלִשְׁתִּים
  choice: филистимлянам
  rationale: При русском глаголе «отомстить» объект естественно ставится в дательном падеже; значение направленности возмездия против филистимлян сохранено.
theological_decisions:
- issue: Передача имени и титулов Бога в молитве Самсона
  choice: יהוה — «Яхве»; אֲדֹנָי יֱהֹוִה — «Владыка Яхве»
  alternative: «Господь»; «Господь Бог»
  rationale: Выбранная передача сохраняет личное имя в обоих случаях и одновременно отличает его от титула אֲדֹנָי, не сводя многослойное обращение к одному общему наименованию.
- issue: Нравственная оценка просьбы Самсона о мести
  choice: Передать просьбу без одобрительного или осуждающего комментария
  alternative: Смягчить «отомстил» до «воздал» либо пояснить просьбу как праведный суд
  rationale: Стих сообщает слова Самсона, но сам по себе не даёт явной богословской оценки его мотива. Перевод сохраняет эту напряжённость и не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с dignified молитвенным регистром. «Воззвал» и «Владыка» придают речи торжественность, но остальная фраза остаётся понятной обычному читателю. Синтаксис финальной просьбы сделан естественным для русского языка, а подлинная неоднозначность еврейского оборота вынесена в отмеченную в тексте сноску.
