base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
translation:
  language: ru
  text: 'Тогда Далида сказала Самсону: «Скажи мне, пожалуйста, в чём твоя великая сила и чем можно связать тебя, чтобы одолеть тебя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы мучить тебя»; также возможно: «чтобы усмирить тебя». Еврейский глагол может означать «причинять страдание», «унижать», «усмирять, подчинять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Тогда ... сказала
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: דְּלִילָה
  choice: Далида
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: שִׁמְשׁוֹן
  choice: Самсон
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: הַגִּידָה נָּא לִי
  choice: Скажи мне, пожалуйста
  rationale: הגיד означает «сказать, сообщить», а נא придаёт просьбе оттенок вежливого или настойчивого побуждения.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: в чём твоя великая сила
  rationale: Сохраняется буквальный вопрос «в чём», то есть в чём заключается или на чём основана необычайная сила Самсона.
- source_word: וּבַמֶּה תֵאָסֵר
  choice: и чем можно связать тебя
  rationale: Второе בַּמֶּה спрашивает о средстве, а нифаль תֵאָסֵר означает «быть связанным»; безличная русская конструкция естественно выражает возможность.
- source_word: לְעַנּוֹתֶךָ
  choice: чтобы одолеть
  rationale: В данном контексте Piel ענה обозначает подчинение, усмирение или причинение страдания. «Одолеть» ясно передаёт контекстуальную цель связывания, а более широкая семантика отмечена в сноске.
