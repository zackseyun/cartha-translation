  text: וַ/יִּשְׁכַּ֣ב שִׁמְשׁוֹן֮ עַד חֲצִ֣י הַ/לַּיְלָה֒ וַ/יָּ֣קָם בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַ/יֶּאֱחֹ֞ז בְּ/דַלְת֤וֹת שַֽׁעַר הָ/עִיר֙ וּ/בִ/שְׁתֵּ֣י הַ/מְּזוּז֔וֹת וַ/יִּסָּעֵ/ם֙ עִֽם הַ/בְּרִ֔יחַ וַ/יָּ֖שֶׂם עַל כְּתֵפָ֑י/ו וַֽ/יַּעֲלֵ/ם֙ אֶל רֹ֣אשׁ הָ/הָ֔ר אֲשֶׁ֖ר עַל פְּנֵ֥י חֶבְרֽוֹן־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
translation:
  language: ru
  text: Самсон лежал до полуночи. В полночь он встал, ухватился за створки городских ворот и оба дверных столба и вырвал их вместе с засовом[a]. Он взвалил их себе на плечи и отнёс на вершину горы, находящейся напротив Хеврона[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вытащил их с места вместе с засовом». Еврейский глагол может означать перемещение, снятие с места или вырывание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «обращённой к Хеврону». Буквально еврейское выражение означает «перед лицом Хеврона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: пролежал
  rationale: Передаёт значение «лежать» и продолжительность до полуночи, не утверждая прямо, что Самсон спал.
- source_word: עַד חֲצִי הַלַּיְלָה / בַּחֲצִי הַלַּיְלָה
  choice: до полуночи / в полночь
  rationale: Естественно и ясно передаёт буквальное «до половины ночи / в половине ночи».
- source_word: וַיֶּאֱחֹז
  choice: ухватился
  rationale: Выражает крепкий, решительный захват и естественно сочетается с последующим вырыванием ворот.
- source_word: דַּלְתוֹת שַׁעַר הָעִיר
  choice: створки городских ворот
  rationale: «Створки» точно обозначает две подвижные части ворот и звучит естественно по-русски.
- source_word: וּבִשְׁתֵּי הַמְּזוּזוֹת
  choice: оба дверных столба
  rationale: Передаёт боковые несущие столбы ворот; «оба» естественнее буквального «два» в данном перечислении.
- source_word: וַיִּסָּעֵם עִם הַבְּרִיחַ
  choice: вырвал их вместе с засовом
  rationale: В контексте глагол обозначает удаление предметов с их места; «вырвал» передаёт усилие, а עִם указывает, что засов был унесён вместе с остальными частями.
- source_word: וַיָּשֶׂם עַל כְּתֵפָיו
  choice: взвалил их себе на плечи
  rationale: Естественная русская формулировка для помещения тяжёлого груза на плечи.
- source_word: וַיַּעֲלֵם
  choice: отнёс
  rationale: Местоименный суффикс относится к частям ворот, а предшествующее упоминание плеч подразумевает перенос; направление вверх выражено целью — вершиной горы.
- source_word: אֶל רֹאשׁ הָהָר
  choice: на вершину горы
  rationale: Прямо передаёт «к вершине горы»; русское «гора» соответствует обычному значению הַר без ненужного уменьшения масштаба.
- source_word: אֲשֶׁר עַל פְּנֵי חֶבְרוֹן
  choice: находящейся напротив Хеврона
  rationale: Сохраняет пространственное отношение, выраженное идиомой עַל־פְּנֵי, не уточняя сверх текста точное направление или расстояние.
