  text: וַ/תֵּ֣רֶא דְלִילָ֗ה כִּֽי הִגִּ֣יד לָ/הּ֮ אֶת כָּל לִבּ/וֹ֒ וַ/תִּשְׁלַ֡ח וַ/תִּקְרָא֩ לְ/סַרְנֵ֨י פְלִשְׁתִּ֤ים לֵ/אמֹר֙ עֲל֣וּ הַ/פַּ֔עַם כִּֽי הִגִּ֥יד ל/ה אֶת כָּל לִבּ֑/וֹ וְ/עָל֤וּ אֵלֶ֨י/הָ֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים וַ/יַּעֲל֥וּ הַ/כֶּ֖סֶף בְּ/יָדָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: ru
  text: 'Когда Далила увидела, что он рассказал ей всё, что было у него на сердце, она послала за правителями филистимлян[b] и призвала их, сказав: «Поднимитесь на этот раз, потому что он рассказал ей[a] всё, что было у него на сердце». Тогда правители филистимлян поднялись к ней и принесли с собой серебро[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «он рассказал ей всё, что было у него на сердце». В прямой речи естественнее ожидать «мне», однако дошедший еврейский текст имеет местоимение третьего лица женского рода.'
    reason: textual_variant
  - marker: b
    text: 'Или: «вожди филистимлян».'
    reason: lexical_alternative
  - marker: c
    text: То есть серебро, предназначенное Далиле в качестве платы.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Когда Далила увидела
  rationale: Глагол ראה сохранён в своём основном значении «увидеть», а начальная конструкция с «когда» естественно передаёт временную связь событий в русском повествовании, не усиливая смысл до «поняла».
- source_word: הִגִּיד לָהּ אֶת־כָּל לִבּוֹ
  choice: он открыл ей всё своё сердце
  rationale: הגיד означает «сообщить, открыть», а выражение «открыть всё своё сердце» естественно по-русски передаёт полное раскрытие тайны и сохраняет образ сердца.
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: она послала за ... и позвала их
  rationale: Сохранены оба последовательных глагола — «послала» и «позвала»; добавление «за» естественно выражает вызов людей к себе.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: правители филистимлян
  rationale: סרן обозначает высшего правителя филистимского города или области. «Правители» ясно и современно передаёт статус, не внося феодального оттенка слова «лорды».
- source_word: עֲלוּ הַפַּעַם
  choice: Поднимитесь сюда на этот раз
  rationale: «Поднимитесь» сохраняет пространственное значение עלה, «сюда» уточняет движение к Далиле по контексту, а «на этот раз» передаёт הַפַּעַם как указание на наступившую решающую возможность.
- source_word: כִּי הִגִּיד לָהּ אֶת־כָּל לִבּוֹ
  choice: потому что он открыл ей всё своё сердце
  rationale: Сохранено третье лицо женского рода в дошедшем еврейском тексте, хотя внутри прямой речи естественнее ожидалось бы «мне»; эта особенность отмечена сноской, а не устранена исправлением.
- source_word: וְעָלוּ אֵלֶיהָ
  choice: Тогда ... поднялись к ней
  rationale: Перевод сохраняет повтор глагола עלה и направление движения к Далиле; «тогда» естественно продолжает последовательность повествования.
- source_word: וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם
  choice: принесли с собой серебро
  rationale: הַכֶּסֶף буквально означает «серебро», а выражение בְּיָדָם указывает, что они несли его при себе. Русское «с собой» передаёт это естественно, без неуместного буквального «в руках».
