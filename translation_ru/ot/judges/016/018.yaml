revisions:
- from: 'Когда Далила увидела, что он открыл ей всё своё сердце, она послала за правителями филистимлян[b] и позвала их, сказав: «Поднимитесь сюда на этот раз, потому что он открыл ей[a] всё своё сердце». Тогда правители филистимлян поднялись к ней и принесли с собой серебро[c].'
  to: 'Когда Далила увидела, что он рассказал ей всё, что было у него на сердце, она послала за правителями филистимлян[b] и призвала их, сказав: «Поднимитесь на этот раз, потому что он рассказал ей[a] всё, что было у него на сердце». Тогда правители филистимлян поднялись к ней и принесли с собой серебро[c].'
  rationale: Исправлены два русских стилистических места без изменения смысла. «Рассказал ей всё, что было у него на сердце» сохраняет древнееврейский образ и значение полного признания. Форма «послала за ... и призвала их» сохраняет оба последовательных действия оригинала. Необычное третье лицо «ей» в речи Далилы сохранено, а не нормализовано; оно отмечено сноской.
