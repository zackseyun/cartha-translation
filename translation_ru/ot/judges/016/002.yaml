translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Повтор «всю ночь» сохранён вслед за еврейским текстом. Эллиптичные места восполнены минимально и отмечены сносками; субъект сообщения и точный объект окружения не конкретизированы.
