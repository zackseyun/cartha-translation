base_translation:
  language: en
  yaml_path: translation/ot/judges/016/002.yaml
  text: The Gazites were told[a], saying, “Samson has come here.” So they surrounded him and lay in wait for him all night at the city gate. They kept quiet all night, saying, “Until the light of morning[c][b], then we will kill him.”
translation:
  language: ru
  text: 'Жителям Газы сообщили[a]: «Самсон пришёл сюда». Тогда они окружили его[b] и всю ночь подстерегали его у городских ворот. Всю ночь они соблюдали тишину[c], говоря: «Подождём до утреннего света[d], а тогда убьём его».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «жителям Газы — сказать»; также возможно: «жителям Газы сказали».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «они окружили» или «обошли вокруг»; прямое дополнение в еврейском тексте не названо.'
    reason: textual_ambiguity
  - marker: c
    text: 'Или: «молчали», «не двигались»; еврейское слово подразумевает тихое, скрытное выжидание в засаде.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «до света утра»; по смыслу — до рассвета.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַזָּתִים
  choice: Жителям Газы
  rationale: Форма обозначает жителей Газы; современное русское сочетание естественнее редкого этнохоронима «газитяне».
- source_word: לֵאמֹר
  choice: сообщили
  rationale: В еврейском тексте буквально стоит «жителям Газы — сказать», без выраженного глагола сообщения. Русский перевод восполняет подразумеваемую передачу вести, не уточняя, кто её передал.
- source_word: בָּא ... הֵנָּה
  choice: пришёл сюда
  rationale: Перфект представляет прибытие Самсона как уже совершившийся и актуальный факт.
- source_word: וַיָּסֹבּוּ
  choice: окружили это место
  rationale: Глагол передаёт движение вокруг или окружение; прямое дополнение в еврейском тексте не названо, поэтому нейтрально восполнено указанием на место, где находился Самсон.
- source_word: וַיֶּאֶרְבוּ לוֹ
  choice: подстерегали его
  rationale: Передаёт скрытое ожидание с враждебным намерением; место засады названо далее.
- source_word: בְּשַׁעַר הָעִיר
  choice: у городских ворот
  rationale: Речь идёт о районе городских ворот как стратегическом выходе из города.
- source_word: וַיִּתְחָרְשׁוּ
  choice: держались тихо
  rationale: В данном контексте форма указывает на молчаливое, незаметное поведение людей, устроивших засаду, и может включать оттенок неподвижного выжидания.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: до утреннего света
  rationale: Сохраняется образная форма оригинала — буквально «до света утра», а не только обобщённое «до рассвета».
- source_word: וַהֲרְגְנֻהוּ
  choice: а тогда убьём его
  rationale: Союзная форма выражает последующее намерение; «тогда» естественно передаёт временную последовательность после ожидания утра.
