  text: וַ/יֹּאחֲז֣וּ/הוּ פְלִשְׁתִּ֔ים וַֽ/יְנַקְּר֖וּ אֶת עֵינָ֑י/ו וַ/יּוֹרִ֨ידוּ אוֹת֜/וֹ עַזָּ֗תָ/ה וַ/יַּאַסְר֨וּ/הוּ֙ בַּֽ/נְחֻשְׁתַּ֔יִם וַ/יְהִ֥י טוֹחֵ֖ן בְּ/בֵ֥ית ה/אסירים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/021.yaml
  text: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
translation:
  language: ru
  text: Тогда филистимляне схватили его, выкололи ему глаза[a], отвели его в Газу, заковали в бронзовые оковы, и он молол в тюрьме[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «лишили его глаз». Еврейский глагол конкретно обозначает повреждение глаз; перевод «выкололи» открыто передаёт жестокость действия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в доме заключённых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאחֲזוּהוּ
  choice: схватили его
  rationale: Глагол אחז означает крепко взять, схватить; в контексте враждебного захвата естественно передаётся словом «схватили».
- source_word: פְלִשְׁתִּים
  choice: филистимляне
  rationale: Общепринятое русское наименование этого народа.
- source_word: וַיְנַקְּרוּ אֶת־עֵינָיו
  choice: выкололи ему глаза
  rationale: נקר здесь обозначает конкретное физическое повреждение глаз; перевод сохраняет жестокий и телесный характер действия, не сводя его к общему «ослепили».
- source_word: וַיּוֹרִידוּ אוֹתוֹ עַזָּתָה
  choice: отвели его в Газу
  rationale: Каузативная форма ירד выражает перемещение вниз или по направлению к месту. В русском повествовании «отвели» естественно передаёт принудительное перемещение, тогда как направление к Газе выражено предлогом «в».
- source_word: וַיַּאַסְרוּהוּ בַּנְחֻשְׁתַּיִם
  choice: заковали в бронзовые оковы
  rationale: אסר означает связать или заключить в узы, а נְחֻשְׁתַּיִם — металлические путы, вероятнее всего бронзовые. «Заковали в оковы» — ясное современное русское выражение.
- source_word: וַיְהִי טוֹחֵן
  choice: он молол
  rationale: Конструкция описывает продолжавшийся труд Самсона. Объект действия в еврейском тексте не назван, поэтому слово «зерно» не добавлено.
- source_word: בְּבֵית הָאֲסִירִים
  choice: в тюрьме
  rationale: Буквальное выражение «в доме заключённых» в данном контексте означает место заключения; «в тюрьме» ясно и естественно передаёт смысл, а буквальная форма отмечена в сноске.
