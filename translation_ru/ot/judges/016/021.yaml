  source_fidelity: 'Текст точно передаёт последовательность еврейского оригинала: захват, насильственное повреждение глаз, принудительное перемещение в Газу, заковывание в бронзовые оковы и последующий труд в месте заключения. «Отвели его в Газу» естественно передаёт каузативное перемещение; невыраженный в русском оттенок «вниз» не меняет смысла в данном контексте.'
