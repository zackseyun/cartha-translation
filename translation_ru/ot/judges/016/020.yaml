  yaml_path: translation/ot/judges/016/020.yaml
  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: ru
  text: 'Она сказала: «Филистимляне идут на тебя, Самсон!» Он пробудился от сна и сказал: «Выйду, как и прежде, и вырвусь[a]». Но он не знал, что Яхве отступил от него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и встряхнусь»; вероятный смысл — стряхнуть с себя то, что его удерживает, и вырваться, как в прежние разы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Филистимляне идут на тебя
  rationale: Предлог עַל при враждебном субъекте выражает нападение или приближение с целью схватить. Формулировка сохраняет непосредственность предупреждения и естественно звучит по-русски.
- source_word: וַיִּקַץ מִשְּׁנָתוֹ
  choice: он пробудился от сна
  rationale: Прямая передача יקץ с предложным оборотом; литературная, но понятная современному читателю формулировка.
- source_word: אֵצֵא
  choice: выйду
  rationale: Сохраняется обычное значение יצא без добавления прямо не названной цели — вступить в бой с нападающими.
- source_word: כְּפַעַם בְּפַעַם
  choice: как и прежде
  rationale: Естественно передаёт повторяемость прежних случаев и уверенность Самсона, что всё произойдёт привычным образом.
- source_word: וְאִנָּעֵר
  choice: и высвобожусь
  rationale: Nifal глагола נער здесь, вероятно, означает стряхнуть с себя удерживающее и вырваться. «Высвобожусь» ясно передаёт предполагаемый результат, а образное буквальное значение сохраняется в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан русской транслитерацией личного имени, а не заменён титулом «Господь».
- source_word: סָר מֵעָלָיו
  choice: отступил от него
  rationale: Передаёт удаление или прекращение присутствия без уточнения его механизма, длительности либо богословской категории.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте прямо употреблён тетраграмматон; форма «Яхве» сохраняет личное имя в принятой современной русской транслитерации.
- issue: Характер ухода Яхве от Самсона
  choice: не пояснять выражение «Яхве отступил от него»
  alternative: «сила Яхве покинула его»; «Яхве лишил его Своей силы»
  rationale: Еврейский текст утверждает, что Яхве отступил от Самсона, но не определяет это исключительно как утрату силы, благоволения или заветного статуса. Буквенно-смысловая передача сохраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Пробудился» и «отступил» поддерживают достоинство регистра, не создавая архаичности; внутренняя речь Самсона передана естественно и кратко.
