    issue: «Подведи меня к столбам» вместо «дай мне ощупать столбы».
    rationale: וְהִימְשֵׁנִי (от משש) означает побудить/дать ощупать, коснуться. Направление или подведение в этой форме не выражено; оно добавляет действие, отсутствующее в оригинале, и устраняет существенный мотив осязания.
