  yaml_path: translation/ot/judges/016/026.yaml
  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: ru
  text: 'И сказал Самсон юноше, который держал его за руку: «Дай мне остановиться и ощупать столбы, на которых держится дом, чтобы я мог опереться на них».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנַּעַר
  choice: юноше
  rationale: 'Передаёт обычное значение слова в данном контексте: молодой слуга или сопровождающий, без ненужного уточнения его статуса.'
- source_word: הַנִּיחָה אוֹתִי
  choice: Дай мне отдохнуть
  rationale: Глагол נוח в каузативной форме означает «дать покой, позволить отдохнуть»; это чтение соответствует масоретскому тексту и не заменяет выражение предположительным «дай мне ощупать».
- source_word: ו/הימש/ני
  choice: и подведи меня
  rationale: Выбранное по контексту значение — направить или привести Самсона к столбам; оно естественно сочетается с тем, что юноша держит его за руку.
- source_word: הָעַמֻּדִים אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: к столбам, на которых стоит дом
  rationale: נכון здесь описывает устойчивое положение или опору здания; «стоит» ясно и естественно передаёт конструкцию.
- source_word: וְאֶשָּׁעֵן עֲלֵיהֶם
  choice: чтобы я мог опереться на них
  rationale: Передаёт целевую связь и значение «опереться»; модальное «мог» естественно по-русски выражает намерение Самсона.
