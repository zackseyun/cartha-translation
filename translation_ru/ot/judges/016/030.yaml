  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֗וֹן תָּמ֣וֹת נַפְשִׁ/י֮ עִם פְּלִשְׁתִּים֒ וַ/יֵּ֣ט בְּ/כֹ֔חַ וַ/יִּפֹּ֤ל הַ/בַּ֨יִת֙ עַל הַ/סְּרָנִ֔ים וְ/עַל כָּל הָ/עָ֖ם אֲשֶׁר בּ֑/וֹ וַ/יִּהְי֤וּ הַ/מֵּתִים֙ אֲשֶׁ֣ר הֵמִ֣ית בְּ/מוֹת֔/וֹ רַבִּ֕ים מֵ/אֲשֶׁ֥ר הֵמִ֖ית בְּ/חַיָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
translation:
  language: ru
  text: 'И сказал Самсон[a]: «Да умру я вместе с филистимлянами!» Он налёг изо всей силы, и здание[c] рухнуло на правителей[b] и на весь народ, который был в нём. Так при своей смерти он убил больше людей, чем за всю свою жизнь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Да умрёт моя душа вместе с филистимлянами». Здесь «моя душа» означает самого Самсона.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «владык». Так назывались высшие правители филистимлян.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «дом». В еврейском тексте употреблено обычное слово «дом», которое здесь обозначает всё здание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי
  choice: Да умру я
  rationale: נַפְשִׁי здесь идиоматически обозначает самого Самсона, а юссивная форма выражает его решимость и готовность умереть. Русское «Да умру я» сохраняет волевой оттенок, не превращая «душу» в отдельный от человека субъект.
- source_word: עִם פְּלִשְׁתִּים
  choice: вместе с филистимлянами
  rationale: Передаёт прямое значение עִם и ясно выражает совместность смерти Самсона и филистимлян.
- source_word: וַיֵּט בְּכֹחַ
  choice: Он налёг изо всей силы
  rationale: נטה означает наклониться, податься или направить себя; в контексте опоры на столбы «налёг» естественно передаёт телесное усилие, а «изо всей силы» идиоматически выражает בְּכֹחַ.
- source_word: הַבַּיִת
  choice: здание
  rationale: Обычное еврейское слово «дом» здесь обозначает всё сооружение; русское «здание» естественнее в рассказе о его обрушении и не вносит более узкого толкования «храм».
- source_word: הַסְּרָנִים
  choice: правителей
  rationale: Термин обозначает высших филистимских начальников. «Правители» ясно передаёт их властное положение без архаичного или феодального оттенка слова «владыки».
- source_word: כָּל הָעָם אֲשֶׁר בּוֹ
  choice: весь народ, который был в нём
  rationale: Сохраняет значение всеохватности כָּל и указание на находившихся внутри здания.
- source_word: אֲשֶׁר הֵמִית בְּמוֹתוֹ
  choice: при своей смерти он убил
  rationale: Естественно по-русски передаёт причинённые Самсоном смерти, совпавшие с его собственной смертью.
- source_word: רַבִּים מֵאֲשֶׁר הֵמִית בְּחַיָּיו
  choice: больше людей, чем за всю свою жизнь
  rationale: Ясно передаёт сравнительную конструкцию и противопоставление последнего поступка Самсона всему периоду его жизни.
theological_decisions:
- issue: Передача предсмертных слов Самсона без привнесения учения о душе как об отдельной сущности
  choice: Да умру я вместе с филистимлянами
  alternative: Да умрёт моя душа вместе с филистимлянами
  rationale: נֶפֶשׁ в этой фразе идиоматически означает самого человека. Основной текст передаёт смысл высказывания и сохраняет его волевой характер, тогда как буквальный вариант дан в примечании как языковая альтернатива.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формула «Да умру я» намеренно слегка приподнята, но остаётся понятной; «налёг изо всей силы» делает описанное действие естественным по-русски, не уточняя сверх контекста конкретный жест.
