  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ שִׁמְשׁ֔וֹן אִם יַאַסְרֻ֗/נִי בְּ/שִׁבְעָ֛ה יְתָרִ֥ים לַחִ֖ים אֲשֶׁ֣ר לֹא חֹרָ֑בוּ וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/אַחַ֥ד הָ/אָדָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
translation:
  language: ru
  text: 'Самсон сказал ей: «Если меня свяжут семью свежими тетивами, которые ещё не высохли, то я ослабею и стану как любой другой человек».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «как один из людей».'
    reason: Сохранение более буквальной передачи неоднозначной еврейской сравнительной идиомы.
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ שִׁמְשׁוֹן
  choice: Самсон сказал ей
  rationale: Обычная повествовательная форма wayyiqtol продолжает рассказ; в русском нулевой союз звучит естественно и не добавляет смыслового оттенка.
- source_word: יַאַסְרֻנִי
  choice: меня свяжут
  rationale: Форма 3-го лица множественного числа употреблена с неопределённым субъектом; русская неопределённо-личная конструкция точно и естественно передаёт этот смысл.
- source_word: בְּשִׁבְעָה יְתָרִים לַחִים
  choice: семью свежими тетивами
  rationale: Предлог בְּ обозначает орудие действия; יְתָרִים в данном контексте — тетивы, а לַחִים указывает, что они свежие, ещё не высохшие.
- source_word: אֲשֶׁר לֹא חֹרָבוּ
  choice: которые ещё не высохли
  rationale: Придаточное поясняет состояние тетив; «ещё» естественно выражает подразумеваемый контраст со свежестью, не меняя содержания.
- source_word: וְחָלִיתִי
  choice: то я ослабею
  rationale: Глагол חלה здесь означает утрату силы, а не болезнь; «ослабею» точно передаёт результат условия.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: и стану как любой другой человек
  rationale: Идиома означает, что Самсон станет подобен обычному человеку, лишённому его необыкновенной силы. Формулировка естественна по-русски; более буквальный вариант сохранён в примечании.
theological_decisions:
- issue: Сравнительная идиома כְּאַחַד הָאָדָם
  choice: как любой другой человек
  alternative: как один из людей
  rationale: אָדָם здесь имеет обобщённое значение и противопоставляет исключительную силу Самсона обычным человеческим возможностям. Основной вариант передаёт смысл идиомы, а примечание сохраняет её более буквальную форму без привнесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; речь ясная и достойная, без архаизмов. Синтаксис прямой, а неопределённый субъект передан естественной русской конструкцией.
