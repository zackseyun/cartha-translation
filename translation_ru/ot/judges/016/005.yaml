  text: וַ/יַּעֲל֨וּ אֵלֶ֜י/הָ סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֨אמְרוּ לָ֜/הּ פַּתִּ֣י אוֹת֗/וֹ וּ/רְאִי֙ בַּ/מֶּה֙ כֹּח֣/וֹ גָד֔וֹל וּ/בַ/מֶּה֙ נ֣וּכַל ל֔/וֹ וַ/אֲסַרְנֻ֖/הוּ לְ/עַנֹּת֑/וֹ וַ/אֲנַ֨חְנוּ֙ נִתַּן לָ֔/ךְ אִ֕ישׁ אֶ֥לֶף וּ/מֵאָ֖ה כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
translation:
  language: ru
  text: 'Тогда правители филистимлян пришли к ней и сказали ей: «Завлеки его и выясни, в чём заключается его великая сила и как мы сможем одолеть его, чтобы связать его и причинить ему страдания; а каждый из нас даст тебе тысячу сто единиц серебра[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «тысячу сто серебра». Вероятно, речь идёт о тысяче ста единицах серебра от каждого правителя филистимлян; возможно, подразумеваются сикли, но единица в тексте не названа.'
    reason: В оригинале обозначены количество и серебро, но не названа денежная или весовая единица.
lexical_decisions:
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: пришли к ней
  rationale: Глагол עלה с אֶל обозначает направленное движение к человеку; по-русски естественно передать его как «пришли к ней», не перегружая фразу буквальным «поднялись».
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: филистимские правители
  rationale: סֶרֶן — особый титул правителей филистимских городов. «Правители» понятно современному читателю и не вызывает неуместных феодальных ассоциаций слова «князья».
- source_word: פַּתִּי אוֹתוֹ
  choice: обольсти его
  rationale: Пиэль от פתה здесь означает заманить или склонить хитростью. «Обольсти» передаёт манипулятивный характер действия, но не утверждает прямо сексуальный способ, которого сам глагол не требует.
- source_word: וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל
  choice: и разузнай, в чём источник его великой силы
  rationale: Буквальное «увидь, в чём велика его сила» в данном контексте означает выяснить скрытое основание силы; «разузнай» естественно передаёт этот смысл, а «великой» сохраняет явное прилагательное גָּדוֹל.
- source_word: וּבַמֶּה נוּכַל לוֹ
  choice: и как нам одолеть его
  rationale: Идиома יכל ל означает оказаться сильнее кого-либо, одолеть или взять верх. Формулировка сохраняет вопрос о способе и хорошо соответствует враждебному замыслу.
- source_word: וַאֲסַרְנֻהוּ לְעַנֹּתוֹ
  choice: чтобы связать и усмирить
  rationale: אסר прямо означает «связать». Пиэль ענה допускает значения «смирять, подчинять, причинять страдание»; «усмирить» сохраняет идею насильственного подавления, не сужая её до пытки.
- source_word: וַאֲנַחְנוּ נִתַּן לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף
  choice: каждый из нас даст тебе тысячу сто серебряников
  rationale: אִישׁ имеет распределительное значение — «каждый». В еврейском названа сумма «тысяча сто серебра» без явного обозначения единицы; «серебряники» дают понятное русское чтение, а точная неопределённость поясняется в сноске.
