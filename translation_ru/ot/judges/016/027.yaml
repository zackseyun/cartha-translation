base_translation:
  language: en
  yaml_path: translation/ot/judges/016/027.yaml
  text: The house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
translation:
  language: ru
  text: Дом был полон мужчин и женщин, и там находились все филистимские правители. А на крыше было около трёх тысяч мужчин и женщин, смотревших, как Самсон выступал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во время забавы Самсона». Еврейское выражение от корня שׂחק может обозначать смех, игру, забаву или развлечение. Возможны также переводы: «смотревших на забаву Самсона» или «смотревших на Самсона, когда над ним потешались».'
    reason: 'Лексическая и синтаксическая неоднозначность выражения בִּשְׂחוֹק שִׁמְשׁוֹן: Самсон может пониматься как выступающий либо как объект забавы.'
lexical_decisions:
- source_word: הַבַּיִת
  choice: дом
  rationale: Обычное значение — «дом, здание». Контекст указывает на сооружение при храме Дагона, но сам еврейский текст здесь не уточняет, что это храм.
- source_word: מָלֵא הָאֲנָשִׁים וְהַנָּשִׁים
  choice: был полон мужчин и женщин
  rationale: Передаёт состояние наполненности и прямо сохраняет упоминание обеих групп.
- source_word: כֹּל סַרְנֵי פְלִשְׁתִּים
  choice: все филистимские правители
  rationale: Слово סְרָנִים обозначает особых правителей филистимского пятиградья; «правители» понятно современному читателю и не вносит феодального оттенка слова «владыки».
- source_word: וְעַל הַגָּג
  choice: А на крыше
  rationale: Сохраняет вынесенное вперёд обозначение места и естественно связывает предложение с предыдущим.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  choice: около трёх тысяч
  rationale: Префикс כ־ выражает приблизительность количества.
- source_word: אִישׁ וְאִשָּׁה
  choice: мужчин и женщин
  rationale: Формы единственного числа употреблены собирательно и обозначают смешанную группу.
- source_word: הָרֹאִים
  choice: смотревших
  rationale: Причастие передаёт продолжающееся наблюдение за зрелищем.
- source_word: בִּשְׂחוֹק שִׁמְשׁוֹן
  choice: как Самсон забавлял собравшихся
  rationale: По контексту Самсон служит зрелищем для толпы. Такая формулировка естественна по-русски, а лексическая неоднозначность корня שׂחק сохранена в примечании; «собравшихся» не ограничивает действие только людьми на крыше.
