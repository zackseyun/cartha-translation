    issue: 'В основной текст добавлен невыраженный объект действия: «Самсон забавлял собравшихся».'
    rationale: Еврейское выражение не называет тех, кого Самсон забавлял. Более того, конструкция допускает, что Самсон был объектом насмешки или забавы. Добавление «собравшихся» снимает существенную исходную неоднозначность и несколько расширяет смысл.
  - severity: low
    issue: Сноска должна яснее связывать альтернативу с неоднозначностью конструкции, а не закреплять Самсона исключительно как исполнителя.
    rationale: Уточнённая сноска объясняет, что возможны как понимание Самсона выступающим, так и понимание его объектом забавы, не навязывая один вариант.
