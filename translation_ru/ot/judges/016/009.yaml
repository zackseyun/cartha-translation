base_translation:
  language: en
  yaml_path: translation/ot/judges/016/009.yaml
  text: The ambush was waiting for her in the inner room, and she said to him, “Philistines are upon you, Samson!” But he snapped the cords as a thread of tow snaps when it smells fire, and his strength was not discovered.
translation:
  language: ru
  text: 'А у неё во внутренней комнате сидел человек в засаде. Она сказала ему: «Филистимляне идут на тебя, Самсон!» Но он разорвал тетивы, как рвётся нить из льняной пакли, почуяв огонь. Так и не узнали, в чём его сила.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָאֹרֵב
  choice: А засада
  rationale: Собирательное обозначение людей, находившихся в засаде; союз передаёт продолжение повествования без добавления временного «теперь».
- source_word: יֹשֵׁב לָהּ בַּחֶדֶר
  choice: сидела у неё во внутренней комнате
  rationale: לָהּ естественно передано как «у неё», а חֶדֶר в данном контексте — скрытая внутренняя комната.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Филистимляне идут на тебя
  rationale: Тревожный возглас о нападении передан естественной современной русской формулой без излишне буквального «на тебе».
- source_word: הַיְתָרִים
  choice: тетивы
  rationale: В контексте предыдущего стиха речь идёт о свежих тетивах/жилах, которыми связали Самсона; «тетивы» сохраняет предметную связь.
- source_word: פְּתִיל הַנְּעֹרֶת
  choice: льняная нить
  rationale: נְעֹרֶת обозначает очёсы или волокно льна; «льняная нить» ясно и естественно передаёт образ.
- source_word: בַּהֲרִיחוֹ אֵשׁ
  choice: почуяв огонь
  rationale: Сохранена яркая персонифицированная идиома оригинала — нить словно «чует» огонь.
- source_word: וְלֹא נוֹדַע כֹּחוֹ
  choice: Так и не узнали, в чём его сила
  rationale: Пассивная конструкция означает, что тайна его силы не была раскрыта; русский безличный оборот естественно сохраняет неопределённого деятеля.
