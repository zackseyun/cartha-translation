base_translation:
  language: en
  yaml_path: translation/ot/judges/016/023.yaml
  text: The rulers of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate[a], and they said[b], “Our god has given Samson our enemy into our hand.”
translation:
  language: ru
  text: 'Правители[a] филистимлян собрались, чтобы принести великую жертву Дагону, своему богу, и отпраздновать. Они сказали: «Наш бог отдал Самсона, нашего врага, в наши руки[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «властители». Так назывались главы филистимских городов-государств.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «отдать в руки» означает отдать во власть или под контроль.
    reason: idiom_explanation
lexical_decisions:
- source_word: סַרְנֵי
  choice: правители
  rationale: Термин обозначает главных правителей филистимских городов-государств; «правители» ясно передаёт их властное положение и звучит современно.
- source_word: נֶאֱסְפוּ
  choice: собрались
  rationale: Нифаль глагола אסף означает, что они сошлись вместе как группа; «собрались» естественно и точно передаёт смысл.
- source_word: לִזְבֹּחַ זֶבַח גָּדוֹל
  choice: принести великую жертву
  rationale: Сочетание глагола с однокоренным существительным подчёркивает жертвоприношение; по-русски смысл естественно передаётся без тяжеловесного повтора.
- source_word: לְדָגוֹן אֱלֹהֵיהֶם
  choice: Дагону, своему богу
  rationale: Дагон прямо назван божеством филистимлян и получателем жертвы; возвратное «своему» естественно соотносится с подлежащим.
- source_word: וּלְשִׂמְחָה
  choice: и устроить торжество
  rationale: Существительное שִׂמְחָה здесь обозначает праздничную радость и ликование; «устроить торжество» передаёт цель собрания в современном литературном русском.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: отдал ... в наши руки
  rationale: Сохранён образ еврейской идиомы «дать в руку», означающей передачу во власть или под контроль; «отдал» естественно выражает результат.
- source_word: אֵת שִׁמְשׁוֹן
  choice: Самсона
  rationale: Имя передано в закрепившейся русской библейской форме и поставлено в требуемый управлением винительный падеж.
- source_word: אוֹיְבֵינוּ
  choice: нашего врага
  rationale: Хотя форма внешне имеет показатель множественного числа, в контексте она относится к одному Самсону; приложение ясно передаёт эту связь.
theological_decisions:
- issue: Передача אֱלֹהֵיהֶם / אֱלֹהֵינוּ в языческом контексте
  choice: богу / Наш бог
  alternative: богам / Наши боги
  rationale: Оба употребления относятся к названному в стихе Дагону, поэтому единственное число соответствует непосредственному синтаксису и не привносит не выраженную здесь множественность.
translation_notes:
  register: Современный литературный русский с достойным повествовательным тоном. Начальное וְ передано связностью повествования без добавления слова «теперь». Еврейский образ «в наши руки» сохранён в основном тексте и пояснён в сноске; речь филистимлян не исправляется с точки зрения повествователя.
