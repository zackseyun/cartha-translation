  language: en
  yaml_path: translation/ot/judges/016/024.yaml
  text: When the people saw him, they praised their god, for they said, “Our god has given into our hand our enemy, the devastator of our land, the one who multiplied our slain.”
translation:
  language: ru
  text: 'Когда народ увидел его, он стал восхвалять своего бога, говоря: «Наш бог предал в наши руки нашего врага, разорителя нашей земли, того, кто умножил число наших убитых».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהַלְלוּ
  choice: стали восхвалять
  rationale: Передаёт начавшееся публичное прославление божества в повествовательной последовательности.
- source_word: נָתַן ... בְיָדֵנוּ
  choice: отдал нам в руки
  rationale: Сохраняет древнееврейскую идиому власти и победы в естественной русской форме.
- source_word: מַחֲרִיב אַרְצֵנוּ
  choice: разорителя нашей земли
  rationale: Причастие обозначает того, кто опустошает или разоряет страну; «разоритель» уместно в данном военном контексте.
- source_word: הִרְבָּה אֶת חֲלָלֵינוּ
  choice: умножил число наших убитых
  rationale: Сохраняет образ умножения и ясно передаёт, что речь идёт о погибших из их народа.
theological_decisions:
- issue: Обозначение филистимского божества словом אֱלֹהִים с притяжательным суффиксом
  choice: своего бога / наш бог
  alternative: своего Бога / наш Бог
  rationale: Строчная буква показывает, что повествование передаёт речь о языческом божестве, не подтверждая его истинность.
- issue: Оценка Самсона в цитируемой речи филистимлян
  choice: сохранить их характеристику без авторской корректировки
  alternative: смягчить или пояснить её как ошибочное мнение
  rationale: Текст непосредственно передаёт взгляд филистимлян и оставляет его в напряжении с более широким повествованием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Сохранены параллельные наименования Самсона и образ передачи врага «в руки» победителей.
