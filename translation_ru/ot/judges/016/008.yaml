  text: So the Philistine rulers brought up to her seven fresh bowstrings that had not been dried[a], and she bound him with them.
translation:
  language: ru
  text: Тогда филистимские правители принесли ей семь свежих тетив, ещё не высохших, и она связала его ими.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ לָהּ
  choice: принесли ей
  rationale: В контексте каузативная форма עלה означает доставить или принести; буквальное указание движения вверх по-русски здесь было бы неестественным.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: филистимские правители
  rationale: Термин обозначает верховных политических руководителей филистимлян; «правители» ясно передаёт функцию без феодального оттенка слова «владыки».
- source_word: שִׁבְעָה יְתָרִים
  choice: семь тетив
  rationale: יֶתֶר может обозначать шнур, в том числе тетиву; контекст рассказа и лексическое употребление поддерживают конкретное значение «тетивы».
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  choice: свежих тетив, ещё не высохших
  rationale: לַח обозначает влажное или свежее состояние, а последующее уточнение прямо говорит, что тетивы не высохли; формулировка сохраняет оба элемента без тяжеловесного повтора.
- source_word: וַתַּאַסְרֵהוּ בָּהֶם
  choice: и она связала его ими
  rationale: אסר означает связывать, а בָּהֶם указывает на орудие действия; русский перевод близко и естественно передаёт обе формы.
