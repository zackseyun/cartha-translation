base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
translation:
  language: ru
  text: Тогда его братья и все из дома его отца спустились, унесли его, понесли его наверх и похоронили его между Цорой и Естаолом, в гробнице Маноя, его отца. Он судил Израиль двадцать лет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «К тому времени он уже двадцать лет судил Израиль». Еврейский текст допускает понимание этой фразы как ретроспективного итога.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: спустились
  rationale: Глагол ירד обозначает движение вниз; прямой русский эквивалент сохраняет топографическую направленность.
- source_word: אֶחָיו
  choice: его братья
  rationale: Обычное значение существительного — родные братья; контекст не требует расширять его до «родственников».
- source_word: וְכָל בֵּית אָבִיהוּ
  choice: и весь дом его отца
  rationale: Сохранён древнееврейский образ отцовского дома как семейно-родовой общности; выражение понятно в библейском повествовании и не сужает значение до проживающих в одном жилище.
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: унесли его
  rationale: В контексте погребения נשא означает взять и нести тело; «унесли» естественно передаёт действие, не добавляя отсутствующего в тексте слова «тело».
- source_word: וַיַּעֲלוּ
  choice: поднялись
  rationale: עלה передаёт движение вверх, вероятно топографическое. Русский глагол сохраняет направление, а ранее названный объект естественно остаётся подразумеваемым.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: похоронили
  rationale: Прямой и современный эквивалент обычного глагола погребения.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: между Цорой и Естаолом
  rationale: Передано местоположение между двумя городами; использованы узнаваемые русские библейские формы топонимов.
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  choice: в гробнице его отца Маноя
  rationale: קבר может обозначать могилу или гробницу; семейный контекст поддерживает «гробница». Русский порядок слов ясно выражает приложение «его отца».
- source_word: וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל
  choice: Он судил Израиль
  rationale: Глагол שפט сохраняет повторяющуюся в книге Судей терминологию и роль судьи-избавителя, не сводя её только к управлению.
- source_word: עֶשְׂרִים שָׁנָה
  choice: двадцать лет
  rationale: Прямая передача числительного и обозначения времени.
theological_decisions:
- issue: Итоговое сообщение о времени служения Самсона
  choice: Он судил Израиль двадцать лет
  alternative: К тому времени он уже двадцать лет судил Израиль
  rationale: Еврейская форма после рассказа о погребении допускает как простое итоговое прошедшее, так и ретроспективное понимание. Основной текст сохраняет повторяющуюся формулу книги Судей, а примечание отмечает временную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Цепочка последовательных действий и направленность движения сохранены; синтаксис остаётся ясным для обычного читателя.
