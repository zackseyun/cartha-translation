  text: וַ/יַּגֶּד לָ֣/הּ אֶת כָּל לִבּ֗/וֹ וַ/יֹּ֤אמֶר לָ/הּ֙ מוֹרָה֙ לֹֽא עָלָ֣ה עַל רֹאשִׁ֔/י כִּֽי נְזִ֧יר אֱלֹהִ֛ים אֲנִ֖י מִ/בֶּ֣טֶן אִמִּ֑/י אִם גֻּלַּ֨חְתִּי֙ וְ/סָ֣ר מִמֶּ֣/נִּי כֹחִ֔/י וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/כָל הָ/אָדָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
translation:
  language: ru
  text: 'И он открыл ей всё своё сердце и сказал ей: «Бритва не касалась моей головы, потому что я назорей Божий от утробы моей матери. Если меня обреют, сила оставит меня, я ослабею и стану как всякий другой человек[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и буду как всякий человек».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד לָהּ אֶת כָּל לִבּוֹ
  choice: он открыл ей всё своё сердце
  rationale: Еврейская идиома буквально говорит о сообщении «всего сердца» и означает полное, сокровенное признание. Русское «открыл ей всё своё сердце» сохраняет образ и естественно передаёт полноту откровенности.
- source_word: מוֹרָה לֹא עָלָה עַל רֹאשִׁי
  choice: бритва не касалась моей головы
  rationale: «Бритва» точно передаёт название орудия, а «не касалась моей головы» естественно выражает еврейский оборот «не поднималась/не восходила на мою голову», не создавая в русском неясного образа.
- source_word: נְזִיר אֱלֹהִים
  choice: назорей Божий
  rationale: «Назорей» — устоявшийся русский технический термин для человека, особо посвящённого Богу; он сохраняет связь с установлением в Числах 6 и с рассказом о Самсоне.
- source_word: מִבֶּטֶן אִמִּי
  choice: от утробы матери моей
  rationale: Формулировка сохраняет исходный образ и указывает на посвящение ещё до рождения; она литературна и понятна в библейском контексте.
- source_word: אִם גֻּלַּחְתִּי
  choice: если меня обреют
  rationale: Пассивная форма показывает, что Самсона обреет кто-то другой; русский неопределённо-личный оборот точно и естественно это передаёт.
- source_word: וְסָר מִמֶּנִּי כֹחִי
  choice: сила оставит меня
  rationale: Передаёт условно-будущее значение и образ удаления силы без ненужного уточнения механизма её утраты.
- source_word: וְחָלִיתִי
  choice: я ослабею
  rationale: В контексте глагол обозначает утрату силы, а не заболевание; «ослабею» кратко и точно передаёт перемену состояния.
- source_word: כְּכָל הָאָדָם
  choice: как всякий другой человек
  rationale: Оборот означает обычного человека в противопоставлении необычайной силе Самсона. Слово אָדָם здесь характеризует человеческое состояние в целом, поэтому современное русское «человек» точнее и естественнее, чем гендерно маркированное «мужчина».
theological_decisions:
- issue: Передача נְזִיר в самоописании Самсона
  choice: назорей Божий
  alternative: посвящённый Богу
  rationale: Технический термин сохраняет каноническую связь с назорейством и не сводит особое установление к общему понятию посвящения.
- issue: Связь волос с силой Самсона
  choice: сохранена последовательность слов Самсона без добавочного богословского объяснения
  alternative: уточнить, что волосы были лишь знаком посвящения, а силу давал Бог
  rationale: Сам стих формулирует связь между бритьём и уходом силы, но не разъясняет её природу. Перевод сохраняет эту напряжённость и не добавляет толкования в основной текст.
- issue: Передача כְּכָל הָאָדָם
  choice: как всякий другой человек
  alternative: как всякий другой мужчина
  rationale: В данном противопоставлении речь идёт прежде всего об утрате сверхъестественной силы и возвращении к обычному человеческому состоянию; «человек» сохраняет широкий смысл אָדָם и не вносит лишнего ограничения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Сохранён термин «назорей», но синтаксис сделан естественным для современного читателя. Маркер сноски помещён непосредственно после соответствующего предложения.
