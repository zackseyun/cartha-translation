base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
translation:
  language: ru
  text: 'Тогда Далила взяла новые верёвки[a], связала его ими и сказала ему: «Филистимляне идут на тебя, Самсон!» А тот, кто был в засаде, сидел во внутренней комнате[b][c]. Но он сорвал их с рук, словно нитку.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шнуры».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подстерегавший его сидел во внутренней комнате». В еврейском тексте употреблено причастие единственного числа.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «в комнате».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים
  choice: верёвки
  rationale: Слово обозначает толстые верёвки или канаты для связывания; «верёвки» естественно звучит по-русски и подчёркивает контраст с ниткой в конце стиха.
- source_word: חֲדָשִׁים
  choice: новые
  rationale: Прямое значение прилагательного; в повествовании важно, что верёвки были новыми и неослабленными.
- source_word: וַתַּאַסְרֵהוּ
  choice: связала его
  rationale: Точно передаёт действие глагола אסר и естественно звучит в современном русском повествовании.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Филистимляне идут на тебя
  rationale: Передаёт срочность и угрозу еврейского возгласа, не прибегая к неестественной русской кальке «на тебе».
- source_word: וְהָאֹרֵב
  choice: засада
  rationale: Единственное причастие допускает коллективное или функциональное понимание; «засада» сохраняет эту неоднозначность и соответствует контексту.
- source_word: יֹשֵׁב
  choice: сидела
  rationale: Сохраняет конкретный образ исходного причастия, хотя по контексту засада ждала в укрытии.
- source_word: בֶּחָדֶר
  choice: во внутренней комнате
  rationale: חֶדֶר может обозначать внутреннюю, отдельную комнату, подходящую для скрытого ожидания.
- source_word: וַיְנַתְּקֵם
  choice: разорвал верёвки
  rationale: Глагол выражает резкое разрывание или отрывание; повтор существительного устраняет неясность русского местоимения.
- source_word: מֵעַל זְרֹעֹתָיו
  choice: на своих руках
  rationale: Естественно передаёт расположение пут и то, что Самсон сорвал их с рук; более буквальное «с рук» подразумевается глаголом «разорвал».
- source_word: כַּחוּט
  choice: словно нитку
  rationale: Сохраняет яркое сравнение с легко разрываемой одиночной нитью.
