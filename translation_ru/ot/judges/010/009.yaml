  text: וַ/יַּעַבְר֤וּ בְנֵֽי עַמּוֹן֙ אֶת הַ/יַּרְדֵּ֔ן לְ/הִלָּחֵ֛ם גַּם בִּ/יהוּדָ֥ה וּ/בְ/בִנְיָמִ֖ין וּ/בְ/בֵ֣ית אֶפְרָ֑יִם וַ/תֵּ֥צֶר לְ/יִשְׂרָאֵ֖ל מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/009.yaml
  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
translation:
  language: ru
  text: Аммонитяне перешли Иордан, чтобы воевать также против Иуды, Вениамина и дома Ефрема. Израиль оказался в крайне тяжёлом положении[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Израиль был в великом бедствии».'
    reason: 'Лексико-синтаксический вариант: еврейская безличная конструкция выражает крайнюю стеснённость, бедственное положение Израиля.'
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: перешли
  rationale: Глагол עבר с прямым дополнением «Иордан» обозначает пересечение реки; «перешли Иордан» — точная и естественная русская формулировка.
- source_word: בְנֵי עַמּוֹן
  choice: аммонитяне
  rationale: В данном повествовательном контексте это этноним; буквальное «сыновья Аммона» в современном русском звучало бы неестественно.
- source_word: אֶת הַיַּרְדֵּן
  choice: Иордан
  rationale: Название реки традиционно и однозначно; добавление слова «река» не требуется.
- source_word: לְהִלָּחֵם
  choice: чтобы воевать
  rationale: Инфинитив выражает цель перехода и означает участие в военных действиях.
- source_word: גַּם
  choice: также
  rationale: 'Слово имеет добавочное значение: аммонитяне перенесли военные действия и на земли к западу от Иордана.'
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  choice: против Иуды, Вениамина и дома Ефрема
  rationale: Предлог ב при глаголе войны контекстуально указывает на тех, против кого ведётся война. «Дом Ефрема» сохраняет присутствующее в еврейском тексте בֵּית и его родоплеменной смысл.
- source_word: וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד
  choice: Израилю стало очень тяжело
  rationale: Сохранена безличная направленная конструкция с לְיִשְׂרָאֵל и сильная степень бедствия, выраженная מְאֹד; современная русская фраза передаёт положение крайней стеснённости без добавления неуказанного деятеля.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Этноним передан естественно, а выражение «дом Ефрема» сохранено для точности. Начальное וַ передано последовательностью повествования без добавления слова «тогда», поскольку само по себе оно здесь не требует отдельного русского эквивалента.
