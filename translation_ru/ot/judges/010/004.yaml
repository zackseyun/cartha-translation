revisions:
- from: У него было тридцать сыновей, ездивших на тридцати ослах, и им принадлежало тридцать городов. Эти города и поныне называются Хаввот-Иаир и находятся в земле Галаадской.
  to: У него было тридцать сыновей, ездивших на тридцати ослах, и у них было тридцать городов. Эти города и поныне называются Хаввот-Иаир и находятся в земле Галаада.
  rationale: Сохранены все референты и временная формула оригинала. Оборот «у них было» передаёт еврейское לָהֶם без усиления значения собственности; «земля Галаада» даёт современную литературную форму географического обозначения. Разделение на два предложения и явное «эти города» сохраняют естественный русский синтаксис и устраняют возможную неоднозначность относительного придаточного.
