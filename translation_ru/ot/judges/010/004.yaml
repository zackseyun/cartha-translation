  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: ru
  text: У него было тридцать сыновей, ездивших на тридцати ослах, и у них было тридцать городов. Эти города и поныне называются Хаввот-Иаир и находятся в земле Галаада.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲיָרִים
  choice: ослах
  rationale: Здесь это множественное число от עַיִר — «молодой осёл»; в контексте езда на ослах указывает на положение сыновей, но перевод не добавляет этого толкования.
- source_word: עֲיָרִים
  choice: городов
  rationale: Второе графически одинаковое слово по контексту является множественным числом от עִיר — «город»; созвучие двух еврейских слов по-русски непередаваемо без искусственной игры слов.
- source_word: חַוֺּת יָאִיר
  choice: Хаввот-Иаир
  rationale: Название передано транслитерацией, сохраняющей форму еврейского топонима; его смысл — «селения Иаира».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и поныне
  rationale: Естественный литературный эквивалент формулы «до сего дня».
- source_word: אֶרֶץ הַגִּלְעָד
  choice: земле Галаадской
  rationale: Традиционная и понятная русская форма географического названия.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский с библейским достоинством. Два предложения устраняют перегрузку цепочкой придаточных, не меняя референции: подлежащим во втором предложении явно названы города. Подлинная еврейская игра слов между «ослами» и «городами» не воспроизводится искусственно.'
