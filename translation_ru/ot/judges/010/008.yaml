  text: And they shattered and crushed the sons of Israel in that year[a]; for eighteen years they oppressed all the sons of Israel who were beyond the Jordan in the land of the Amorites[b], which is in Gilead.
translation:
  language: ru
  text: В тот год они сокрушали и подавляли израильтян; восемнадцать лет[a] они угнетали всех израильтян, живших за Иорданом, в земле аморреев, что в Галааде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейская фраза построена сжато: после слов «в тот год» непосредственно следует «восемнадцать лет». Перевод передаёт это как продолжавшееся восемнадцать лет угнетение. Два предшествующих близких по смыслу сильных глагола усиливают картину жестокого притеснения.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיִּרְעֲצוּ וַיְרֹצְצוּ
  choice: стали разорять и сокрушать
  rationale: Два близких по смыслу сильных глагола передают жестокость притеснения. Сочетание сохраняет усилительный параллелизм, но звучит естественнее по-русски, чем буквальное «ломали и дробили».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: израильтян
  rationale: Современное русское обозначение народа естественно передаёт еврейскую идиому «сыны Израиля»; повтор выражения в стихе сохранён повтором слова «израильтян».
- source_word: בַּשָּׁנָה הַהִיא
  choice: В тот год
  rationale: Прямое и естественное соответствие обстоятельству времени.
- source_word: שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: восемнадцать лет они угнетали
  rationale: Длительность выражена отдельной русской клаузой; глагол «угнетали» восполняет подразумеваемое продолжение действия и делает сложную еврейскую конструкцию понятной.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Сохраняет географическую перспективу исходного текста, не уточняя сторону реки сверх сказанного.
- source_word: בְּאֶרֶץ הָאֱמֹרִי
  choice: в земле аморреев
  rationale: Еврейское единственное число имеет собирательное значение; обычная русская форма ясно обозначает территорию народа.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: что в Галааде
  rationale: Кратко сохраняет относительное уточнение местоположения земли аморреев.
