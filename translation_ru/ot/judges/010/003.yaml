lexical_decisions:
- source_word: וַיָּקָם אַחֲרָיו
  choice: После него поднялся
  rationale: Сочетание вводит следующего деятеля после предыдущего судьи. «Поднялся» сохраняет образность קום и повествовательную формулу преемства, не сводя её только к вступлению в должность.
- source_word: יָאִיר
  choice: Иаир
  rationale: Использована традиционная русская библейская форма имени.
- source_word: הַגִּלְעָדִי
  choice: галаадитянин
  rationale: Прилагательное принадлежности указывает на происхождение или связь Иаира с Галаадом; русское существительное передаёт это кратко и естественно.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: и судил Израиль
  rationale: Сохранён повторяющийся в книге термин שפט. В данном контексте он охватывает не только судебную деятельность, но и руководство Израилем, однако перевод не устраняет намеренно эту смысловую широту.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: двадцать два года
  rationale: Современная естественная русская форма числительного точно передаёт указанную продолжительность.
theological_decisions:
- issue: Характер деятельности Иаира, выраженный глаголом שפט
  choice: судил Израиль
  alternative: управлял Израилем / был судьёй Израиля
  rationale: «Судил» сохраняет ключевую лексику книги и её смысловое напряжение между судебной, правительственной и освободительной ролью судьи, не навязывая более узкого толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис краток и следует структуре еврейского повествования; традиционные формы имени и географического обозначения сохранены.
