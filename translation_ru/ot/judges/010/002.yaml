  text: He judged Israel twenty-three years. Then he died and was buried in Shamir.
translation:
  language: ru
  text: Он был судьёй Израиля двадцать три года. Затем он умер и был похоронен в Шамире.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: Он был судьёй
  rationale: В книге Судей глагол שׁפט обозначает не только вынесение судебных решений, но и служение судьи как руководителя Израиля. Русское «был судьёй» сохраняет ключевую терминологию книги и звучит естественнее, чем «судил Израиль», которое может быть понято лишь в юридическом смысле.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиля
  rationale: Название народа передано прямо; родительный падеж обусловлен естественной русской конструкцией «был судьёй Израиля».
- source_word: עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: двадцать три года
  rationale: Точная продолжительность передана нормативным современным русским числительным.
- source_word: וַיָּמָת
  choice: Затем он умер
  rationale: Последовательный повествовательный союз передаёт переход к следующему событию; «затем» естественно выражает последовательность, не добавляя причинной связи.
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Пассивная форма сохраняет отсутствие названного действующего лица.
- source_word: בְּשָׁמִיר
  choice: в Шамире
  rationale: Предлог ב здесь имеет местное значение, а название места передано русской транслитерацией и поставлено в предложный падеж.
