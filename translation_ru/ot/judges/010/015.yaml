  text: וַ/יֹּאמְר֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶל יְהוָה֙ חָטָ֔אנוּ עֲשֵׂה אַתָּ֣ה לָ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ אַ֛ךְ הַצִּילֵ֥/נוּ נָ֖א הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
translation:
  language: ru
  text: 'И сказали сыны Израиля Яхве: «Мы согрешили. Поступи с нами, как тебе угодно.[a] Только, пожалуйста, избавь нас сегодня!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «согласно всему доброму в твоих глазах», то есть как ты сочтёшь правильным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: И сказали
  rationale: Форма wayyiqtol продолжает повествование; союз «и» сохраняет еврейскую последовательность без лишнего уточнения времени.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет конкретную еврейскую родовую формулу и её грамматически мужскую форму; в современном литературном библейском регистре выражение понятно.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: חָטָאנוּ
  choice: Мы согрешили
  rationale: Естественно передаёт завершённое действие и прямое покаянное признание.
- source_word: עֲשֵׂה אַתָּה לָנוּ
  choice: Поступи с нами
  rationale: Естественный русский эквивалент конструкции עשה с ל, обозначающей действие по отношению к кому-либо; местоимение אַתָּה не выделено отдельно, поскольку русский императив уже выражает второе лицо.
- source_word: כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: как тебе угодно
  rationale: Передаёт смысл устойчивого антропоморфного оборота «согласно всему доброму в твоих глазах» естественным современным русским языком; буквальная образность отмечена в сноске.
- source_word: אַךְ
  choice: Только
  rationale: Передаёт ограничительный переход от готовности принять решение Бога к единственной настоятельной просьбе.
- source_word: הַצִּילֵנוּ
  choice: избавь нас
  rationale: Hiphil глагола נצל означает избавить или спасти от опасности; «избавь» уместно в данном повествовательном и молитвенном контексте.
- source_word: נָא
  choice: пожалуйста
  rationale: Сохраняет выраженную частицей вежливую и настоятельную просьбу без архаического «молим».
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Естественно и точно передаёт временную непосредственность выражения «в этот день».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Передача בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбор сохраняет родовую формулу и мужскую грамматическую форму оригинала, не сводя её к нейтральному этнониму.
- issue: Степень покорности в עֲשֵׂה ... כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: Поступи с нами, как тебе угодно
  alternative: Сделай с нами всё, что хорошо в твоих глазах
  rationale: Фраза выражает принятие Божьего решения, но не уточняет заранее, будет ли оно наказанием или милостью; перевод сохраняет эту напряжённость и не добавляет толкования.
translation_notes:
  register: Современный литературный русский с достоинством прямой покаянной речи. Сохранены «сыны Израиля» и имя «Яхве»; еврейский оборот о том, что хорошо в Божьих глазах, передан естественно, а его буквальная форма вынесена в сноску. Маркер [a] расположен непосредственно после соответствующей фразы.
