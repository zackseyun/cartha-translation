  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
translation:
  language: ru
  text: Но вы оставили Меня и служили другим богам. Поэтому Я больше не буду спасать вас[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавлять вас», «выручать вас». Еврейский глагол может обозначать избавление от врагов, а также спасение в более широком смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: Но вы
  rationale: Союз с явно выраженным местоимением создаёт контраст с предшествующим контекстом; «Но вы» естественно передаёт это противопоставление и эмфазу.
- source_word: עֲזַבְתֶּם אֹתִי
  choice: оставили Меня
  rationale: Глагол עזב означает «оставить, покинуть, отвернуться от». В данном контексте «оставили Меня» звучит естественно и сохраняет вес разрыва верности, не добавляя отсутствующего в тексте пояснения.
- source_word: וַתַּעַבְדוּ
  choice: и служили
  rationale: Глагол עבד применительно к богам обозначает религиозное служение и поклонение. «Служили» передаёт более широкий смысл верности и подчинения, чем одно лишь «поклонялись».
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другим богам
  rationale: Обычное значение сочетания — «другие боги»; здесь подчёркнуто противопоставление Господу, а не их иноземное происхождение.
- source_word: לָכֵן
  choice: Поэтому
  rationale: Слово вводит прямое следствие поступка Израиля и ясно передаёт причинно-следственную связь.
- source_word: לֹא אוֹסִיף
  choice: больше не буду
  rationale: 'Конструкция יסף с отрицанием выражает прекращение действия: «не стану впредь/больше не буду».'
- source_word: לְהוֹשִׁיעַ אֶתְכֶם
  choice: спасать вас
  rationale: ישע может означать спасение, избавление или освобождение от врагов. «Спасать вас» сохраняет широту глагола, тогда как непосредственный контекст книги Судей связан с избавлением от угнетателей.
theological_decisions:
- issue: Значение ישע в повествовании о судьях
  choice: спасать вас
  alternative: избавлять вас; выручать вас
  rationale: Речь непосредственно идёт об избавлении Израиля от угнетателей, но еврейский глагол имеет более широкое значение. Основной вариант сохраняет эту широту, а примечание не позволяет свести смысл исключительно к духовному спасению.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным звучанием. Краткость и резкость божественного ответа сохранены. Местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции. Маркер примечания поставлен после слова «вас», к которому относится лексическая альтернатива.
