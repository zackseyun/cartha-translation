source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּמְכְּרֵ/ם֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/בְ/יַ֖ד בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/007.yaml
  text: So Yahweh’s anger burned against Israel[c][b][a], and he sold them into the hand of the Philistines and into the hand of the Ammonites.
translation:
  language: ru
  text: И воспылал гнев Яхве на Израиль[a], и Он продал их[b] в руки филистимлян и в руки аммонитян[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гнев Яхве разгорелся против Израиля».'
    reason: lexical_alternative
  - marker: b
    text: '«Продал их» — повторяющееся в книге Судей выражение: Яхве в наказание отдаёт Израиль под власть врагов.'
    reason: cross_reference
  - marker: c
    text: 'Буквально: «в руку филистимлян и в руку сыновей Аммона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: воспылал гнев
  rationale: Сохраняет образ разгорающегося гнева в еврейской идиоме חרה אף и при этом естественно звучит в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: בְּיִשְׂרָאֵל
  choice: на Израиль
  rationale: В сочетании с обозначением гнева предлог ב выражает направленность гнева против Израиля; русская конструкция «гнев на кого-либо» передаёт это естественно.
- source_word: וַיִּמְכְּרֵם
  choice: Он продал их
  rationale: Прямое значение מכר — «продавать». Такой перевод сохраняет характерный для книги Судей образ Божьего суда и не смягчает выраженную в тексте активную роль Яхве.
- source_word: בְּיַד
  choice: в руки
  rationale: Сохраняет конкретный еврейский образ передачи под власть противника. Русское множественное «в руки» естественнее буквального единственного числа в данном контексте.
- source_word: פְּלִשְׁתִּים
  choice: филистимлян
  rationale: Общепринятое русское название этого народа.
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитян
  rationale: Естественный русский этноним; буквально выражение означает «сыновья Аммона».
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе употреблено личное имя יְהוָה. Транслитерация «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Изображение Божьего суда в וַיִּמְכְּרֵם
  choice: Он продал их
  alternative: Он предал их; Он отдал их во власть
  rationale: Формулировка сохраняет суровую метафору и показывает Яхве действующим лицом суда, как и еврейский текст, не объясняя и не смягчая её.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Сохранены метафоры горящего гнева, продажи и передачи в руки; местоимение «Он» употреблено для ясности и по русской издательской традиции написано с прописной буквы.
