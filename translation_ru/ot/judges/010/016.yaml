  source_fidelity: 'Текст точно передаёт последовательность действий: удаление чужих богов, служение Яхве и Его реакцию на бедствие Израиля. «Он больше не мог терпеть» является естественной русской передачей идиомы וַתִּקְצַר נַפְשׁוֹ и не устраняет её антропопатическую напряжённость; сноска сохраняет буквальный образ и альтернативный оттенок «потерял терпение».'
