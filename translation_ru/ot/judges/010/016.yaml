  text: וַ/יָּסִ֜ירוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ מִ/קִּרְבָּ֔/ם וַ/יַּעַבְד֖וּ אֶת יְהוָ֑ה וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ בַּ/עֲמַ֥ל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
translation:
  language: ru
  text: Тогда они удалили из своей среды чужих богов и стали служить Яхве, и Он больше не мог терпеть страдания Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «душа Его стала коротка из-за страдания Израиля». Возможно также: «Он потерял терпение из-за бедствия Израиля». Это еврейское выражение означает, что Он уже не мог дольше выносить их страдания.'
    reason: Сохранить образность и смысловую неоднозначность идиомы וַתִּקְצַר נַפְשׁוֹ.
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: удалили
  rationale: Порода hифиль глагола סור означает «устранить, удалить»; этот выбор ясно передаёт сознательный отказ от идолов.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: чужих богов
  rationale: Устойчивое выражение обозначает божеств других народов; «чужие боги» естественно и точно в данном контексте.
- source_word: מִקִּרְבָּם
  choice: из своей среды
  rationale: Передаёт буквальное «из их среды» и сохраняет общинный смысл.
- source_word: וַיַּעַבְדוּ אֶת יְהוָה
  choice: стали служить Яхве
  rationale: עבד применительно к Богу включает поклонение, верность и служение; «служить» сохраняет эту широту.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией, а не заменой титулом.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: Он больше не мог терпеть
  rationale: Еврейская идиома буквально говорит, что «душа Его стала коротка»; в контексте она выражает достижение предела терпения или невозможность дальше выносить бедствие. Русская формулировка естественно передаёт этот смысл.
- source_word: בַּעֲמַל יִשְׂרָאֵל
  choice: страдания Израиля
  rationale: עָמָל здесь означает бедствие, тяготу или страдание; родительный оборот сохраняет возможную отнесённость страдания к Израилю.
theological_decisions:
- issue: Антропопатическое описание Яхве во фразе וַתִּקְצַר נַפְשׁוֹ
  choice: Он больше не мог терпеть страдания Израиля
  alternative: душа Его изнемогла от страдания Израиля / Он потерял терпение из-за бедствия Израиля
  rationale: Перевод сохраняет личную и эмоционально напряжённую характеристику реакции Бога, не превращая её в отвлечённое богословское утверждение. При этом сноска показывает буквальный образ и допустимые смысловые оттенки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Союз «тогда» естественно связывает стих с предшествующим покаянием; «из своей среды» сохраняет коллективный оттенок исходного текста. Местоимение «Он» однозначно относится к Яхве.
