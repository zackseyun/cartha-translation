  terminology: Передача имени יהוה как «Яхве» последовательна. «Чужие боги» адекватно передаёт אֱלֹהֵי הַנֵּכָר; «служить» сохраняет широкий заветный смысл עבד, не сужая его до одного лишь культового поклонения. «Страдания Израиля» допустимо передаёт עָמָל в данном контексте.
