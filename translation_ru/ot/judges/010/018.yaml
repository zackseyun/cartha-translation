base_translation:
  language: en
  yaml_path: translation/ot/judges/010/018.yaml
  text: And the people[a], the leaders of Gilead, said to one another, “Who is the man who will begin to fight against the sons of Ammon? He shall become head over all the inhabitants of Gilead.”
translation:
  language: ru
  text: 'И народ — вожди Галаада[a] — сказали друг другу: «Кто тот человек, который начнёт сражаться с аммонитянами? Он станет главой над всеми жителями Галаада».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское бессоюзное сочетание «народ, вожди Галаада» обычно понимается как приложение; возможно также понимание: «народ и вожди Галаада».'
    reason: Сохранение синтаксической неоднозначности сочетания הָעָם שָׂרֵי גִלְעָד.
lexical_decisions:
- source_word: הָעָם שָׂרֵי גִלְעָד
  choice: народ, то есть вожди Галаада
  rationale: Два существительных поставлены рядом без союза. Приложение лучше всего сохраняет оба элемента еврейского текста и указывает, что в данном совещании народ представлен вождями Галаада; синтаксическая неоднозначность отмечена в сноске.
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: друг другу
  rationale: 'Буквально: «каждый своему ближнему/товарищу». Русское взаимное выражение естественно передаёт распределительный смысл оборота.'
- source_word: מִי הָאִישׁ
  choice: кто тот человек
  rationale: Сохранено явное אִישׁ («мужчина, человек») и указание на искомого конкретного военного предводителя, но без неестественного русского «кто этот мужчина».
- source_word: יָחֵל לְהִלָּחֵם
  choice: первым начнёт сражаться
  rationale: Hiphil יָחֵל означает «начнёт»; «первым» естественно выражает инициативный смысл начала военных действий в данном контексте, не превращая его в отдельную должность.
- source_word: בִּבְנֵי עַמּוֹן
  choice: с аммонитянами
  rationale: Буквально «с сынами Аммона»; «аммонитяне» — ясное и обычное русское название этого народа. Предлог «с» при глаголе «сражаться» естественно имеет противительное значение.
- source_word: יִהְיֶה לְרֹאשׁ
  choice: станет главой
  rationale: Передаёт результативный смысл и сохраняет метафору רֹאשׁ — «глава», то есть верховный руководитель.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: всех жителей Галаада
  rationale: Причастное выражение обозначает всех проживающих в Галааде; «жители» — современный и точный русский эквивалент.
theological_decisions:
- issue: Явно мужское обозначение кандидата на военное руководство
  choice: сохранить «тот человек» в основном тексте
  alternative: «кто первым начнёт» без существительного
  rationale: Еврейское אִישׁ выражено явно, а контекст говорит о выборе конкретного военного предводителя. Опускать это слово без языковой необходимости не следует.
- issue: Характер обещанной власти
  choice: «станет главой всех жителей Галаада»
  alternative: «будет начальником»
  rationale: «Глава» сохраняет образность רֹאשׁ и не уточняет сверх текста ни форму правления, ни объём обязанностей будущего руководителя.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским регистром. Синтаксис упрощён для ясного чтения, но повтор «Галаада» и метафора «глава» сохранены. Прямая речь передана естественно, без архаизмов.
