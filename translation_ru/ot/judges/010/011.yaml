  text: וַ֥/יֹּאמֶר יְהוָ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ וּ/מִן הָ֣/אֱמֹרִ֔י וּ/מִן בְּנֵ֥י עַמּ֖וֹן וּ/מִן פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
translation:
  language: ru
  text: 'И сказал Яхве сынам Израиля: «Разве не Я избавил вас из Египта, от амореев, от аммонитян и от филистимлян?[a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте вопрос построен эллиптически: здесь буквально перечислены Египет и народы, а слова «Я избавил вас» подразумеваются из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Обычная для еврейского повествования форма введения прямой речи; в русском естественно передаётся конструкцией «И сказал».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени Бога, а не замена его титулом.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  rationale: Сохраняет родственный образ оригинала и при этом звучит понятно и уместно в современном литературном русском.
- source_word: הֲלֹא
  choice: Разве не Я
  rationale: Передаёт отрицательный риторический вопрос; местоимение «Я» естественно связано с восстановленным из контекста глаголом.
- source_word: מִמִּצְרַיִם
  choice: из Египта
  rationale: Предлог מן обозначает исходную точку; для страны по-русски естественно «из Египта».
- source_word: הָאֱמֹרִי
  choice: от амореев
  rationale: Единственное число в еврейском имеет собирательное значение и обозначает народ.
- source_word: בְּנֵי עַמּוֹן
  choice: от аммонитян
  rationale: Устойчивое современное русское название народа; буквальное «сынов Аммона» здесь было бы менее естественным.
- source_word: פְּלִשְׁתִּים
  choice: от филистимлян
  rationale: Общепринятое русское название этого народа.
- source_word: '[глагол подразумевается из контекста]'
  choice: Я избавил вас
  rationale: Еврейская фраза эллиптична; глагол восстановления подразумевается контекстом. «Избавил» передаёт спасение от притеснителей без добавления иного богословского смысла.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя, прямо присутствующее в еврейском тексте, и не заменяет его титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сынам Израиля
  alternative: израильтянам
  rationale: Выбран вариант, сохраняющий семейно-родовой образ оригинала; он остаётся понятным в литературном русском.
- issue: Восполнение эллиптической конструкции
  choice: Разве не Я избавил вас…?
  alternative: Разве не из Египта, от амореев, от аммонитян и от филистимлян…?
  rationale: Без подразумеваемого глагола отдельный русский стих оказался бы грамматически незавершённым. Восполнение отмечено сноской, чтобы не скрывать эллиптичность оригинала.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным для прямой речи, а исходная эллиптичность открыто отмечена в сноске.
