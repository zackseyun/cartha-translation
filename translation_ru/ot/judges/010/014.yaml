  text: לְכ֗וּ וְ/זַֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֥ר בְּחַרְתֶּ֖ם בָּ֑/ם הֵ֛מָּה יוֹשִׁ֥יעוּ לָ/כֶ֖ם בְּ/עֵ֥ת צָרַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
translation:
  language: ru
  text: Идите и взывайте к богам, которых вы избрали; пусть они спасут вас в пору вашей беды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «они спасут вас». Еврейскую форму можно понять как простое будущее время, однако в данном контексте она звучит как иронический вызов.'
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: Идите
  rationale: Повелительная форма множественного числа от הלך; в контексте звучит как резкое отсылающее повеление, естественно передаваемое словом «идите».
- source_word: וְזַעֲקוּ
  choice: и взывайте
  rationale: זעק обозначает настойчивый крик о помощи в бедствии. «Взывайте» сохраняет и напряжённость просьбы, и её обращённость к божествам.
- source_word: אֶל הָאֱלֹהִים
  choice: к богам
  rationale: Хотя אֱלֹהִים формально допускает неоднозначность, контекст чужих божеств, а также последующие местоимение и глагол во множественном числе требуют здесь множественного «богам».
- source_word: אֲשֶׁר בְּחַרְתֶּם בָּם
  choice: которых вы избрали
  rationale: Конструкция בחר ב־ означает выбор кого-либо; «избрали» естественно и достаточно точно передаёт смысл, не воспроизводя механически предлог.
- source_word: הֵמָּה
  choice: они
  rationale: 'Самостоятельное местоимение подчёркивает субъект: именно выбранные Израилем боги должны его спасти. В русском это естественно передано явно выраженным «они».'
- source_word: יוֹשִׁיעוּ
  choice: пусть они спасут вас
  rationale: Hiphil от ישׁע означает «спасать, избавлять». Хотя форма может быть простым будущим, в данном контексте она выражает иронический вызов, естественно передаваемый конструкцией с «пусть».
- source_word: בְּעֵת
  choice: в пору
  rationale: Временное сочетание означает «во время». «В пору» сохраняет именную конструкцию и звучит естественно в современном литературном русском.
- source_word: צָרַתְכֶם
  choice: вашей беды
  rationale: צָרָה обозначает бедствие, тесноту, тяжёлое положение. «Беда» ясно и идиоматично передаёт кризис, в котором требуется спасение.
theological_decisions:
- issue: Смысловая сила יוֹשִׁיעוּ в данном контексте
  choice: 'Ироническое побуждение: «пусть они спасут вас»'
  alternative: 'Простое будущее: «они спасут вас»'
  rationale: Господь обличает Израиль за обращение к иным богам и бросает ему риторический вызов искать помощи у них. Конструкция «пусть они спасут вас» передаёт этот дискурсивный смысл, а сноска сохраняет грамматически возможное чтение как будущего времени.
translation_notes:
  register: Современный литературный русский, ясный и достоинственный. «Взывайте» поддерживает библейскую возвышенность без архаизации; «в пору вашей беды» естественно передаёт временную формулу оригинала. Маркер сноски поставлен после всего высказывания, к которому относится альтернативное понимание глагольной формы.
