  text: וְ/צִידוֹנִ֤ים וַֽ/עֲמָלֵק֙ וּ/מָע֔וֹן לָחֲצ֖וּ אֶתְ/כֶ֑ם וַ/תִּצְעֲק֣וּ אֵלַ֔/י וָ/אוֹשִׁ֥יעָ/ה אֶתְ/כֶ֖ם מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
translation:
  language: ru
  text: Сидоняне, Амалик[a] и Маон[b] угнетали вас; вы воззвали ко Мне, и Я спас вас из их рук.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «амаликитяне». В еврейском тексте стоит «Амалик» — имя, которое может обозначать весь народ.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «маонитяне». В еврейском тексте стоит «Маон»; вероятно, здесь имеется в виду связанная с Маоном группа людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  choice: Сидоняне
  rationale: Форма множественного числа обозначает жителей Сидона; общепринятый русский этноним точно и кратко передаёт значение.
- source_word: עֲמָלֵק
  choice: Амалик
  rationale: В еврейском тексте стоит собственное имя, которое здесь может собирательно обозначать народ. Передача именем сохраняет форму оригинала; поясняющий вариант дан в сноске.
- source_word: מָעוֹן
  choice: Маон
  rationale: Масоретский текст содержит собственное имя «Маон», вероятно собирательно обозначающее связанную с ним группу людей. Транслитерация сохраняет неоднозначность оригинала.
- source_word: לָחֲצוּ
  choice: угнетали
  rationale: Глагол обозначает враждебное притеснение и угнетение; этот русский глагол естественен в контексте господства чужих народов.
- source_word: וַתִּצְעֲקוּ אֵלַי
  choice: вы воззвали ко Мне
  rationale: Выражение передаёт настойчивый призыв о помощи; «воззвали» сохраняет силу обращения и соответствует достоинству библейского повествования.
- source_word: וָאוֹשִׁיעָה
  choice: Я спас
  rationale: Глагол ישׁע означает спасать или избавлять. «Спас» прямо передаёт его основное значение и сохраняет связь с библейской лексикой спасения.
- source_word: מִיָּדָם
  choice: из их рук
  rationale: Буквально «из их руки» — идиома со значением освобождения от власти. Русское множественное число естественно сохраняет образ и смысл.
