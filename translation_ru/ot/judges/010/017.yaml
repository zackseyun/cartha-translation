lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  choice: были созваны
  rationale: Глагол צעק обычно означает «кричать, взывать», однако в данном военном контексте перед сообщением о расположении станом, вероятно, обозначает созыв или сбор войска. Страдательная формулировка сохраняет вероятный событийный смысл; буквальная возможность отмечена в сноске.
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитяне
  rationale: Буквально «сыны Аммона»; современное русское название народа ясно и естественно передаёт референт.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Глагол חנה означает разбить лагерь, стать станом. Эта формулировка естественна для военного повествования и сохраняет повтор глагола в обеих частях стиха.
- source_word: בַּגִּלְעָד
  choice: в Галааде
  rationale: Предлог ב при названии области естественно передаётся как «в».
- source_word: וַיֵּאָסְפוּ
  choice: собрались
  rationale: Глагол אסף обозначает сбор или объединение людей; возвратная форма естественно передаёт совместную мобилизацию.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранено традиционное и формально прозрачное обозначение народа Израиля, соответствующее буквальному выражению исходного текста.
- source_word: בַּמִּצְפָּה
  choice: в Мицпе
  rationale: Предлог ב перед названием населённого пункта или места сбора в данном контексте естественно передаётся русским «в».
