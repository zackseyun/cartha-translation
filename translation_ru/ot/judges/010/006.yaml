source:
  edition: WLC
  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
translation:
  language: ru
  text: И снова сыны Израиля делали зло в глазах Яхве[a]. Они служили Ваалам и Астартам, богам Арама, богам Сидона, богам Моава, богам сынов Аммона[b] и богам филистимлян. Они оставили Яхве и не служили Ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «продолжали делать зло в глазах Яхве». Еврейский глагол может обозначать как повторение, так и продолжение действия.'
    reason: lexical_alternative
  - marker: b
    text: 'То есть богам аммонитян; буквально: «богам сынов Аммона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: и снова стали делать
  rationale: Конструкция יסף с инфинитивом допускает значение повторения или продолжения действия. В повторяющейся формуле книги Судей «снова стали делать» естественно передаёт новый виток отступничества, а неоднозначность отмечена в сноске.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формальное и при этом укоренённое в русском библейском стиле соответствие еврейскому выражению; сохраняет повествовательную формулу книги Судей.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: делать зло в глазах Яхве
  rationale: Сохраняет еврейскую оценочную идиому «в глазах» и звучит ясно в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно личное имя, обозначенное тетраграмматоном, а не заменяет его титулом.
- source_word: וַיַּעַבְדוּ / עֲבָדוּהוּ
  choice: служили / не служили Ему
  rationale: Единообразно передаёт корень עבד в обеих частях стиха и сохраняет риторический контраст между служением иным богам и отказом служить Яхве.
- source_word: הַבְּעָלִים
  choice: Ваалам
  rationale: Русская форма множественного числа передаёт различные местные проявления или культовые образы Ваала.
- source_word: הָעַשְׁתָּרוֹת
  choice: Астартам
  rationale: Передаёт культовое имя во множественном числе, параллельно форме «Ваалам».
- source_word: אֱלֹהֵי אֲרָם
  choice: богам Арама
  rationale: Сохраняет древнее географическое название Арам, не подменяя его более поздним названием Сирия.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: богам сынов Аммона
  rationale: Сохраняет строение еврейского выражения בני עמון; более привычное этническое обозначение поясняется в сноске.
- source_word: אֱלֹהֵי פְלִשְׁתִּים
  choice: богам филистимлян
  rationale: Естественно передаёт сопряжённую конструкцию и прямо называет народ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Значение עבד в контексте идолопоклонства
  choice: служили
  alternative: поклонялись
  rationale: «Служили» сохраняет как культовый, так и более широкий смысл верности и подчинения, а также точный контраст с заключительным «не служили Ему».
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис упрощён до естественных русских фраз, но сохранены ключевые еврейские образы, повтор корня «служить» и формула «сыны Израиля». Все маркеры сносок присутствуют в основном тексте.
