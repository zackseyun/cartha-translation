  yaml_path: translation/ot/judges/010/001.yaml
  text: After Abimelech[a], Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel; and he lived in Shamir in the hill country of Ephraim.
translation:
  language: ru
  text: После Авимелеха Тола, сын Пуа, сына Додо[a], из колена Иссахара, поднялся, чтобы спасти Израиль. Он жил в Шамире, в горной области Ефрема.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сына своего дяди». Древнееврейское выражение בֶּן־דּוֹדוֹ может пониматься либо как «сын Додо», где Додо — личное имя, либо как указание на родство.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: поднялся
  rationale: Передаёт появление нового избавителя на исторической сцене, не подразумевая формального назначения.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: После Авимелеха
  rationale: Естественно передаёт временную последовательность повествования.
- source_word: לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל
  choice: чтобы спасти Израиль
  rationale: Сохраняет широкий смысл избавления и не ограничивает его только военными действиями.
- source_word: תּוֹלָע
  choice: Тола
  rationale: Имя передано транслитерацией с древнееврейского.
- source_word: בֶּן־פּוּאָה
  choice: сын Пуа
  rationale: Стандартная передача родословной конструкции.
- source_word: בֶּן־דּוֹדוֹ
  choice: сына Додо
  rationale: Масоретская огласовка и контекст позволяют понимать Додо как имя предка; возможное нарицательное прочтение вынесено в сноску.
- source_word: אִישׁ יִשָּׂשכָר
  choice: из колена Иссахара
  rationale: Естественная для русского читателя передача указания на племенную принадлежность.
- source_word: וְהוּא יֹשֵׁב
  choice: Он жил
  rationale: Причастная конструкция обозначает место постоянного проживания; перевод звучит современно и естественно.
- source_word: בְּשָׁמִיר
  choice: в Шамире
  rationale: Название места передано транслитерацией.
- source_word: בְּהַר אֶפְרָיִם
  choice: в горной области Ефрема
  rationale: Передаёт название географического региона без ошибочного впечатления об отдельных высоких горах.
