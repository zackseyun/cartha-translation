  text: וַֽ/יַּעֲל֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּ֣ל אֶת הָ/אָרֶץ֒ בָּ֣אוּ שָׁ֔מָּ/ה לָקְח֗וּ אֶת הַ/פֶּ֨סֶל֙ וְ/אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וְ/הַ/כֹּהֵ֗ן נִצָּב֙ פֶּ֣תַח הַ/שַּׁ֔עַר וְ/שֵׁשׁ מֵא֣וֹת הָ/אִ֔ישׁ הֶ/חָג֖וּר כְּלֵ֥י הַ/מִּלְחָמָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/017.yaml
  text: Then the five men who had gone to spy out the land went up[a], came there, and took the carved image, the ephod, the household gods, and the cast image[b], while the priest was standing at the entrance of the gate with the six hundred men armed with weapons of war.
translation:
  language: ru
  text: Тогда те пять человек, которые ходили высматривать землю, поднялись, пришли туда и взяли резное изваяние, эфод, домашних богов[a] и литое изваяние[b]. А священник стоял у входа в ворота вместе с шестьюстами вооружёнными воинами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «терафимов». Еврейское слово обозначает домашних богов или домашние культовые предметы.'
    reason: lexical_alternative
  - marker: b
    text: 'Традиционный перевод: «литой истукан».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: поднялись
  rationale: Основное значение עלה — «подниматься, идти вверх». Перевод сохраняет выраженный в еврейском тексте характер движения, не заменяя его более конкретным «вошли».
- source_word: הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ
  choice: которые ходили высматривать землю
  rationale: רגל в данном военно-разведывательном контексте означает осмотр земли с целью разведки; прошедшее «ходили» указывает на уже состоявшееся поручение.
- source_word: בָּאוּ שָׁמָּה
  choice: пришли туда
  rationale: Прямо передаёт направление движения, не добавляя отсутствующего в оригинале указания на конкретное помещение.
- source_word: לָקְחוּ
  choice: взяли
  rationale: Обычное значение לקח — «брать, взять»; характер поступка становится понятен из контекста и не требует усиления словом «похитили».
- source_word: הַפֶּסֶל
  choice: резное изваяние
  rationale: פסל обозначает изображение, изготовленное резьбой. «Изваяние» звучит естественно и сохраняет предметность термина, тогда как «идол» сильнее истолковывает его функцию.
- source_word: הָאֵפוֹד
  choice: эфод
  rationale: Культурно специфический термин передан традиционной русской транслитерацией без добавления не выраженного здесь определения «священнический».
- source_word: הַתְּרָפִים
  choice: домашних богов
  rationale: Доступно передаёт значение домашних культовых предметов или божеств; термин «терафимы» приведён в сноске как более формальная альтернатива.
- source_word: הַמַּסֵּכָה
  choice: литое изваяние
  rationale: מסכה обозначает изображение, изготовленное литьём. Этот вариант передаёт способ изготовления и звучит современнее традиционного «истукан литой».
- source_word: וְהַכֹּהֵן נִצָּב
  choice: А священник стоял
  rationale: Сохраняет сопутствующее обстоятельство сцены, не усиливая логическую связь; отдельное предложение обеспечивает ясность по-русски.
- source_word: פֶּתַח הַשַּׁעַר
  choice: у входа в ворота
  rationale: Передаёт оба элемента выражения — «вход» и «ворота» — естественной русской конструкцией.
- source_word: וְשֵׁשׁ מֵאוֹת הָאִישׁ הֶחָגוּר כְּלֵי הַמִּלְחָמָה
  choice: вместе с шестьюстами вооружёнными воинами
  rationale: Контекстуально ясно передаёт группу из шестисот людей, снабжённых оружием. «Воины» позволяет избежать тяжеловесного повтора «вооружённых оружием», сохраняя военный смысл.
