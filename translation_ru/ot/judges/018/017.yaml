translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис разделён на два предложения ради ясности длинной последовательности действий. Сохранены культурные термины и различие между резным и литым изображениями; архаизмы вроде «истукан» и «препоясанные» не использованы в основном тексте.
