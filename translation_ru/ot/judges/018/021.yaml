  text: So they turned and went on[a], and put the little children, the livestock[b], and the valuables before them.
translation:
  language: ru
  text: Они повернули и пошли дальше, а впереди себя разместили детей, скот и имущество[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пожитки», «ценности». Здесь еврейское слово означает перевозимое имущество, а не «славу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: повернули
  rationale: Сохраняет основное значение פנה — «повернуться, повернуть», не уточняя направление, которого текст не называет.
- source_word: וַיֵּלֵכוּ
  choice: пошли дальше
  rationale: Передаёт продолжение движения после поворота естественным современным русским языком.
- source_word: וַיָּשִׂימוּ
  choice: поставив
  rationale: Деепричастная конструкция естественно связывает размещение людей и имущества с начавшимся движением; שׂים означает «ставить, помещать».
- source_word: הַטַּף
  choice: малых детей
  rationale: טף обозначает малых детей, уязвимую небоеспособную часть группы; выражение сохраняет этот оттенок.
- source_word: הַמִּקְנֶה
  choice: скот
  rationale: מקנה — общее обозначение домашних стад и скота, без ограничения одним видом животных.
- source_word: הַכְּבוּדָּה
  choice: имущество
  rationale: В данном походном контексте כבודה означает перевозимые пожитки или ценное имущество, а не «славу».
- source_word: לִפְנֵיהֶם
  choice: впереди себя
  rationale: Передаёт буквальное пространственное значение «перед ними» и ясно показывает, что дети, скот и имущество находились впереди основной группы.
