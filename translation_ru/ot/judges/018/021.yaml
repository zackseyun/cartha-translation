  naturalness: «Малых детей» понятно, но для современного литературного русского несколько книжно-архаично. Координированная конструкция с «разместили» естественнее и яснее описывает расположение всех трёх групп впереди идущих.
  terminology: «Скот» хорошо передаёт הַמִּקְנֶה. «Имущество» допустимо для הַכְּבוּדָּה в данном контексте; сноска корректно поясняет, что речь не о «славе». «Дети» в основном тексте не утрачивает смысла טַף, а с точки зрения современного регистра предпочтительнее «малых детей».
