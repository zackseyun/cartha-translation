    rationale: Еврейский текст использует самостоятельный последовательный глагол «и поставили/разместили». Кроме того, «поставить имущество» звучит менее естественно, чем «разместить имущество».
  - severity: low
    issue: Выражение «малых детей»
    rationale: Оно возможно, но в современном литературном русском имеет слегка архаизирующий оттенок; нейтральное «детей» здесь достаточно.
