  yaml_path: translation/ot/judges/018/016.yaml
  text: And six hundred men[a], armed with their weapons of war, were standing at the entrance of the gate; these were from the sons of Dan.
translation:
  language: ru
  text: А шестьсот человек из сынов Дана[a], с боевым оружием на поясе, стояли у входа в ворота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «данитяне». Буквально: «из сынов Дана».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁשׁ מֵאוֹת אִישׁ
  choice: А шестьсот человек
  rationale: Союз וְ продолжает повествование и естественно передаётся как «а»; после числительного אִישׁ имеет собирательное значение, поэтому по-русски употреблено «человек».
- source_word: חֲגוּרִים כְּלֵי מִלְחַמְתָּם
  choice: с боевым оружием на поясе
  rationale: Причастие חֲגוּרִים буквально описывает людей как опоясанных, а כְּלֵי מִלְחַמְתָּם — их боевое оружие или снаряжение. Формулировка сохраняет конкретный образ и избегает неестественного сочетания «вооружённые боевым оружием».
- source_word: נִצָּבִים
  choice: стояли
  rationale: Причастие обозначает положение людей в описываемой сцене; русское прошедшее несовершенного вида естественно передаёт это фоновое состояние.
- source_word: פֶּתַח הַשָּׁעַר
  choice: у входа в ворота
  rationale: 'Передаёт оба элемента выражения: פֶּתַח — «вход, проём», הַשָּׁעַר — «ворота».'
- source_word: אֲשֶׁר מִבְּנֵי דָן
  choice: из сынов Дана
  rationale: Определительная конструкция отнесена к шестистам людям. Сохранено буквальное родовое обозначение «сыны Дана», но в требуемой русской падежной форме.
