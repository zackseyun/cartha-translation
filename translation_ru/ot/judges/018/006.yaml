lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם הַכֹּהֵן
  choice: И сказал им священник
  rationale: Сохраняет обычное повествовательное продолжение, обозначенное wayyiqtol, и прямо передаёт адресата и определённое существительное.
- source_word: לְכוּ לְשָׁלוֹם
  choice: Идите с миром
  rationale: Естественная русская формула напутствия, сохраняющая благословляющий оттенок еврейского выражения.
- source_word: נֹכַח
  choice: пред
  rationale: Передаёт пространственно-реляционный смысл «перед, в присутствии, на виду у», не усиливая его до одобрения, защиты или обещания успеха.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: דַּרְכְּכֶם אֲשֶׁר תֵּלְכוּ בָהּ
  choice: Путь, по которому вы идёте
  rationale: Сохраняет образ пути и относительную конструкцию, оставаясь естественным для современного русского языка.
theological_decisions:
- issue: Смысл утверждения священника о пути данитян перед Яхве
  choice: Путь, по которому вы идёте, — пред Яхве
  alternative: Яхве одобряет ваш путь / Яхве хранит вас в пути
  rationale: Еврейское נֹכַח יְהוָה прямо указывает, что путь находится перед Яхве, то есть у него на виду, но само по себе не выражает явно ни одобрения, ни защиты, ни гарантии успеха.
translation_notes:
