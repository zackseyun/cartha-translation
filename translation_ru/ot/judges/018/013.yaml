lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: они прошли через
  rationale: Глагол עבר в контексте пути обозначает движение через территорию; такой перевод естественен по-русски и сохраняет пространственный смысл.
- source_word: מִשָּׁם
  choice: Оттуда
  rationale: Точно и естественно передаёт наречие, указывающее на отправление из ранее названного места.
- source_word: הַר אֶפְרָיִם
  choice: горную область Ефрема
  rationale: Здесь выражение служит названием региона, а не одной горы; «горная область» ясно передаёт географический смысл.
- source_word: וַיָּבֹאוּ
  choice: и дошли
  rationale: В сочетании с עַד глагол בוא обозначает достижение предела пути; «дошли до» звучит естественно в русском повествовании.
- source_word: עַד
  choice: до
  rationale: Предлог обозначает достигнутый предел движения и в данном сочетании точно передаётся русским «до».
- source_word: בֵּית מִיכָה
  choice: дома Михи
  rationale: Конструкция буквально означает «дом Михи»; родительный оборот является естественным современным русским выражением принадлежности.
