  text: הֵ֚מָּה עִם בֵּ֣ית מִיכָ֔ה וְ/הֵ֣מָּה הִכִּ֔ירוּ אֶת ק֥וֹל הַ/נַּ֖עַר הַ/לֵּוִ֑י וַ/יָּס֣וּרוּ שָׁ֗ם וַ/יֹּ֤אמְרוּ ל/וֹ֙ מִֽי הֱבִיאֲ/ךָ֣ הֲלֹ֔ם וּ/מָֽה אַתָּ֥ה עֹשֶׂ֛ה בָּ/זֶ֖ה וּ/מַה לְּ/ךָ֥ פֹֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
translation:
  language: ru
  text: 'Когда они были у дома Михи, то узнали голос молодого левита. Они свернули туда и спросили его: «Кто привёл тебя сюда? Что ты здесь делаешь?[a] И что у тебя здесь?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Что ты делаешь в этом?» Возможно также: «Что ты делаешь в этом месте?»'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «Какое тебе здесь дело?» или «Зачем ты здесь?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  choice: Когда они были у дома Михи
  rationale: Предлог עִם здесь обозначает нахождение рядом, у дома; русское «у дома» естественно передаёт локативный смысл, не подразумевая буквального совместного пребывания с домом.
- source_word: הִכִּירוּ
  choice: узнали
  rationale: В породе хифиль глагол נכר здесь означает распознать знакомый голос; «узнали голос» — естественное русское сочетание.
- source_word: אֶת קוֹל הַנַּעַר הַלֵּוִי
  choice: голос молодого левита
  rationale: קוֹל в данном контексте означает «голос», נַעַר — молодого человека, а הַלֵּוִי указывает на его принадлежность к левитам.
- source_word: וַיָּסוּרוּ שָׁם
  choice: Они свернули туда
  rationale: סור обозначает отклонение от пути или поворот к какому-либо месту; «свернули туда» кратко и естественно передаёт движение.
- source_word: מִי הֱבִיאֲךָ הֲלֹם
  choice: Кто привёл тебя сюда?
  rationale: Хифиль от בוא имеет каузативное значение «привести», а הֲלֹם — «сюда».
- source_word: וּמָה אַתָּה עֹשֶׂה בָּזֶה
  choice: Что ты здесь делаешь?
  rationale: Буквальное בָּזֶה («в этом») эллиптично; в контексте речь идёт о его занятии в данном месте. Необычность буквальной формы сохранена в сноске.
- source_word: וּמַה לְּךָ פֹה
  choice: И что у тебя здесь?
  rationale: Идиома מַה לְּךָ פֹה допускает конкретное «что у тебя здесь?» и более широкое «какое тебе здесь дело?/зачем ты здесь?». Основной текст сохраняет конкретную форму, а идиоматическое понимание отмечено в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Обращение передано на «ты», как в древнееврейском тексте. Эллиптические вопросы оригинала сохранены настолько, насколько это допускает естественная русская речь; значимые альтернативы вынесены в сноски.
