  source_fidelity: 'Список культовых предметов передан раздельно и точно: «эфод, терафимы, резное изваяние и литое изваяние». «Земля Лаиша», обращение к «братьям» и открытая побудительная заключительная фраза соответствуют древнееврейскому тексту. Однако «обратились ... и сказали» несколько ослабляет וַיַּעֲנוּ ... וַיֹּאמְרוּ («ответили и сказали»), поэтому ввод речи следует уточнить.'
