base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
translation:
  language: ru
  text: 'Тогда пятеро мужчин, ходивших разведать землю Лаиша, ответили своим братьям и сказали: «Знаете ли вы, что в этих домах есть эфод, терафимы[a], резное изваяние и литое изваяние[b]? Итак, подумайте, что вам делать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Терафимы — культовые изображения, вероятно связанные с домашним почитанием; иногда это слово переводят как «домашние боги» или «домашние идолы».
    reason: Пояснение редкого и неоднозначного древнееврейского культового термина.
  - marker: b
    text: То есть изваяние, изготовленное путём литья; традиционный вариант перевода — «литой образ».
    reason: Пояснение способа изготовления и традиционного варианта перевода.
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: обратились ... и сказали
  rationale: Формула буквально содержит «ответили и сказали», однако явной предшествующей реплики здесь нет; «обратились ... и сказали» естественно передаёт ввод речи, не создавая ложного впечатления прямого ответа.
- source_word: הַהֹלְכִים לְרַגֵּל
  choice: ходивших разведать
  rationale: Оборот характеризует пятерых мужчин их уже совершённым разведывательным походом; «разведать» соответствует контексту и звучит естественно.
- source_word: אֶת הָאָרֶץ לַיִשׁ
  choice: землю Лаиша
  rationale: Речь идёт о территории, связанной с городом Лаиш; родительная конструкция кратка и точна.
- source_word: אֶל אֲחֵיהֶם
  choice: к своим братьям
  rationale: Сохраняет буквальное родственное обозначение, которое в контексте относится к их соплеменникам-мужчинам.
- source_word: אֵפוֹד
  choice: эфод
  rationale: Транслитерация сохраняет особый культовый термин без преждевременного уточнения назначения предмета.
- source_word: תְרָפִים
  choice: терафимы
  rationale: Транслитерация сохраняет отдельный еврейский термин и не сводит неоднозначные культовые предметы к более узкому толкованию «домашние идолы».
- source_word: פֶסֶל
  choice: резное изваяние
  rationale: Передаёт способ изготовления предмета и отличает его от следующего литого изображения.
- source_word: מַסֵּכָה
  choice: литое изваяние
  rationale: Передаёт изображение, изготовленное литьём; современнее традиционного «истукан» и сохраняет отличие от פֶסֶל.
- source_word: וְעַתָּה דְּעוּ מַה תַּעֲשׂוּ
  choice: Итак, подумайте, что вам делать
  rationale: Буквальное «знайте, что сделаете» в данном контексте является призывом осознанно решить, как поступить; выбранная формулировка естественна и не уточняет, какое именно действие ожидается.
theological_decisions:
- issue: Различение культовых предметов в святилище Михи
  choice: 'Сохранить четыре отдельных наименования: «эфод, терафимы, резное изваяние и литое изваяние».'
  alternative: Передать их обобщённо как священническую одежду и идолов.
  rationale: Еврейский текст намеренно перечисляет разные предметы; их объединение устранило бы значимое лексическое различие и внесло бы лишнее толкование.
- issue: Значение תְרָפִים
  choice: «терафимы» с пояснением в сноске
  alternative: «домашние идолы» или «домашние боги»
  rationale: Точная природа терафимов не вполне определённа. Транслитерация сохраняет неоднозначность, а сноска даёт читателю необходимую ориентировку.
- issue: Побудительная фраза דְּעוּ מַה תַּעֲשׂוּ
  choice: «подумайте, что вам делать»
  alternative: «знайте, что вам делать» или «решайте, что предпринять»
  rationale: Фраза побуждает слушателей определить дальнейшие действия. «Подумайте» сохраняет открытость решения и не добавляет прямого повеления захватить предметы.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Редкие культовые термины сохранены, но пояснены; синтаксис прямой речи сделан естественным без устранения исходной неоднозначности.
