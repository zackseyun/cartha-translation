base_translation:
  language: en
  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
translation:
  language: ru
  text: Они свернули туда и пришли к дому молодого левита — к дому Михи — и спросили его, всё ли у него благополучно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поприветствовали его»; или: «спросили его, всё ли хорошо». Еврейское выражение означает «справиться о чьём-либо благополучии»; слово, обычно передаваемое как «мир», здесь включает значение благополучия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  choice: Они свернули туда
  rationale: Глагол סור обозначает отклонение от пути, а שָׁמָּה — движение к указанному месту. «Свернули туда» естественно передаёт оба элемента.
- source_word: וַיָּבֹאוּ אֶל
  choice: и пришли к
  rationale: בוא с אֶל указывает на прибытие к месту; перевод не уточняет, вошли ли они внутрь.
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  choice: к дому молодого левита
  rationale: Сохраняются и возрастное обозначение נַעַר, и принадлежность к левитам; формулировка естественна для современного русского языка.
- source_word: בֵּית מִיכָה
  choice: к дому Михи
  rationale: Повтор слова «дом» сохраняет пояснительную структуру еврейского текста и отождествляет дом молодого левита с домом Михи.
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  choice: и спросили его, всё ли у него благополучно
  rationale: Идиома буквально связана с расспросом о мире или благополучии и может обозначать как приветствие, так и вопрос о состоянии человека. Выбранная формулировка передаёт этот смысл естественно, не сводя выражение лишь к приветствию.
