  text: וְ/אֵ֨ין מַצִּ֜יל כִּ֧י רְֽחוֹקָה הִ֣יא מִ/צִּיד֗וֹן וְ/דָבָ֤ר אֵין לָ/הֶם֙ עִם אָדָ֔ם וְ/הִ֕יא בָּ/עֵ֖מֶק אֲשֶׁ֣ר לְ/בֵית רְח֑וֹב וַ/יִּבְנ֥וּ אֶת הָ/עִ֖יר וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: ru
  text: И некому было их спасти, потому что город находился далеко от Сидона, а его жители ни с кем не имели никаких связей. Он находился в долине, принадлежавшей Бет-Рехову[a]. Затем они отстроили город и поселились в нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в долине у Бет-Рехова». Еврейское выражение эллиптично, а предлог может указывать не на принадлежность, а на близость.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: спасти
  rationale: Причастие породы hифиль от נצל обозначает того, кто избавляет или спасает от непосредственной опасности. В данном военном контексте «спасти» естественно передаёт конкретный смысл; местоимение «их» восполняется из контекста и относится к жителям города.
- source_word: רְחוֹקָה הִיא מִצִּידוֹן
  choice: город находился далеко от Сидона
  rationale: Местоимение женского рода относится к городу. Явное «город» устраняет неясность русского местоимения и естественно передаёт географическое описание.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: его жители ни с кем не имели никаких связей
  rationale: 'Буквально: «и не было у них дела с человеком». В контексте выражение указывает на общественную или политическую изоляцию, а не на полное отсутствие контакта с людьми.'
- source_word: אָדָם
  choice: ни с кем
  rationale: Формально единственное число «человек» употреблено обобщённо; русское «ни с кем» точно и естественно передаёт этот смысл.
- source_word: בָּעֵמֶק
  choice: в долине
  rationale: Слово עֵמֶק обозначает долину или низменность; «долина» является прямым и уместным географическим соответствием.
- source_word: אֲשֶׁר לְבֵית רְחוֹב
  choice: принадлежавшей Бет-Рехову
  rationale: Эллиптическая конструкция с לְ может выражать принадлежность или территориальную связь. Основной текст передаёт вероятный смысл принадлежности, а возможное значение близости сохраняется в сноске.
- source_word: וַיִּבְנוּ אֶת הָעִיר
  choice: отстроили город
  rationale: Сам глагол означает «построили», но непосредственно перед этим сообщается, что город был сожжён. «Отстроили» естественно выражает подразумеваемое восстановление города.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: поселились в нём
  rationale: Глагол ישב может означать «жить», «обитать» или «поселиться». После восстановления захваченного города «поселились» точно передаёт повествовательный смысл.
- source_word: בֵית רְחוֹב
  choice: Бет-Рехов
  rationale: Географическое название передано русской транслитерацией, а не переведено.
