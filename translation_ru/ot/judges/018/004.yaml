  text: He said to them[a], “Thus and so Micah did for me, and he hired me, and I became his priest.”
translation:
  language: ru
  text: 'Он сказал им: «Миха сделал для меня то-то и то-то[a], нанял меня, и я стал его священником».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «так и так»; еврейский оборот обобщает ранее описанные действия, не повторяя их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Он сказал им
  rationale: Передаёт ответ левита естественным современным русским языком; начальный повествовательный союз не выражен отдельно, поскольку последовательность ясна из контекста.
- source_word: כָּזֹה וְכָזֶה
  choice: то-то и то-то
  rationale: Русский неопределённо-указательный оборот естественно передаёт еврейскую идиому, которая обобщает уже известные действия, не повторяя подробностей.
- source_word: עָשָׂה לִי
  choice: сделал для меня
  rationale: Сохраняет значение действий, совершённых Михой для левита или по отношению к нему, не уточняя сверх исходного текста.
- source_word: מִיכָה
  choice: Миха
  rationale: Традиционная русская передача личного имени в данном библейском контексте.
- source_word: וַיִּשְׂכְּרֵנִי
  choice: нанял меня
  rationale: Прямо передаёт значение найма за вознаграждение.
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  choice: и я стал его священником
  rationale: Глагол היה в повествовательной последовательности указывает на вступление в новую роль; притяжательная конструкция передаёт личную службу Михе.
theological_decisions:
- issue: Характер священнического служения при нерегулярном культе
  choice: его священником
  alternative: священником у него
  rationale: Формулировка отражает личную связь служения с Михой, но не утверждает и не отрицает законность этого устройства, сохраняя богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанное. Разговорная идиома «то-то и то-то» уместна внутри прямой речи и сохраняет неопределённо-обобщающий смысл оригинала.
