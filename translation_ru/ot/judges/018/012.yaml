base_translation:
  language: en
  yaml_path: translation/ot/judges/018/012.yaml
  text: They went up and camped at Kiriath-jearim in Judah. Therefore that place has been called Mahaneh-dan to this day; behold, it is west of Kiriath-jearim.
translation:
  language: ru
  text: Они поднялись и расположились станом в Кириаф-Иариме, в Иудее. Поэтому то место и по сей день называется Махане-Дан[a]. Оно находится к западу от Кириаф-Иарима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Махане-Дан» означает «стан Дана».
    reason: Поясняет смысл еврейского топонима, связанный со стоянкой племени Дана.
lexical_decisions:
- source_word: בְּקִרְיַת יְעָרִים
  choice: у Кириаф-Иарима
  rationale: Предлог בְּ здесь естественно передаётся как указание на место стоянки у города; традиционная русская форма топонима — «Кириаф-Иарим».
- source_word: מַחֲנֵה דָן
  choice: Махане-Дан
  rationale: Сохранён топоним как имя места, а его прозрачное еврейское значение вынесено в примечание.
- source_word: הִנֵּה
  choice: оно находится
  rationale: Указательная частица передана естественной русской конструкцией, обращающей внимание на местоположение, без тяжеловесного буквального «вот».
- source_word: אַחֲרֵי קִרְיַת יְעָרִים
  choice: к западу от Кириаф-Иарима
  rationale: Буквально «позади Кириаф-Иарима»; в древнееврейской пространственной ориентации «позади» может обозначать запад. Географическое значение ясно выражено по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с традиционными библейскими формами географических названий. Синтаксис сделан ясным и повествовательным; историческая формула «и по сей день» сохранена.
