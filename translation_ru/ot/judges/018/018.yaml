base_translation:
  language: en
  yaml_path: translation/ot/judges/018/018.yaml
  text: These men went into Micah’s house and took the carved image[a], the ephod, the household idols, and the cast image. Then the priest said to them, “What are you doing?”
translation:
  language: ru
  text: 'Эти люди вошли в дом Михи и взяли резное изваяние и эфод[a], домашних идолов и литое изваяние. Священник сказал им: «Что вы делаете?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В масоретском тексте между словами «резное изваяние» и «эфод» нет союза; возможно также понимание: «резное изваяние эфода». В ст. 17 и 20 эти предметы перечислены раздельно.'
    reason: textual_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Эти люди
  rationale: Указательное местоимение отсылает к пяти мужчинам из ближайшего контекста; добавление «люди» естественно обозначает подразумеваемый референт.
- source_word: בָּאוּ בֵּית מִיכָה
  choice: вошли в дом Михи
  rationale: Глагол движения при указании дома в данном повествовательном контексте выражает вход внутрь; «вошли» естественно передаёт смысл.
- source_word: פֶּסֶל
  choice: резное изваяние
  rationale: Слово обозначает изготовленное резьбой культовое изображение; перевод сохраняет способ изготовления и не смешивает его с другими перечисленными предметами.
- source_word: הָאֵפוֹד
  choice: эфод
  rationale: Культурно-специфический культовый предмет передан традиционной транслитерацией без уточнения его функции, которая здесь не вполне ясна.
- source_word: הַתְּרָפִים
  choice: домашних идолов
  rationale: Терафимы — домашние культовые изображения; смысловой перевод понятен современному читателю и сохраняет их отличие от остальных предметов.
- source_word: הַמַּסֵּכָה
  choice: литое изваяние
  rationale: Существительное указывает на изображение, изготовленное литьём; «литое изваяние» точно и стилистически естественно.
- source_word: וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן
  choice: Священник сказал им
  rationale: Простая повествовательная формула передана без лишнего усиления; порядок слов естественен для русского повествования.
- source_word: מָה אַתֶּם עֹשִׂים
  choice: Что вы делаете?
  rationale: Прямой вопрос переведён буквально и естественно, без отсутствующего в еврейском тексте обстоятельства «здесь».
theological_decisions:
- issue: Передача различных культовых предметов
  choice: 'Сохранить различия: «резное изваяние», «эфод», «домашние идолы», «литое изваяние».'
  alternative: Обобщить их словом «идолы».
  rationale: Еврейский текст перечисляет разные предметы; конкретные наименования сохраняют его предметность и не добавляют конфессионального толкования.
- issue: Необычное сочетание פֶּסֶל הָאֵפוֹד в масоретском тексте
  choice: В основном тексте читать перечисление «резное изваяние и эфод», отметив текстовую трудность в сноске.
  alternative: 'Передать буквально: «резное изваяние эфода».'
  rationale: В контексте Суд 18:17 и 18:20 эти предметы перечисляются раздельно; ряд древних свидетельств также поддерживает наличие союза. Однако масоретская форма неоднозначна, поэтому её нельзя скрывать.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинственный. Культовые предметы названы конкретно; архаизмы вроде «истукан» и «кумир» не используются. Текстовая неоднозначность не устранена молча, а отмечена сноской.
