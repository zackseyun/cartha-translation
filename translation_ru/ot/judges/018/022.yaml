    text: 'Или: «подняли тревогу». Еврейский глагол может указывать как на тревожный крик, так и на сбор людей, вызванный им.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה הִרְחִיקוּ
  choice: они уже отошли на некоторое расстояние
  rationale: Самостоятельное местоимение возобновляет указание на данитян, а форма от רחק обозначает удаление; русское выражение естественно передаёт наступившую к этому моменту дистанцию.
- source_word: מִבֵּית מִיכָה
  choice: от дома Михи
  rationale: Естественная русская передача предложно-конструктивного сочетания.
- source_word: הָאֲנָשִׁים
  choice: мужчины
  rationale: Сохраняется конкретное значение еврейского слова, а не обобщённое «люди».
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  choice: из домов по соседству с домом Михи
  rationale: Буквально несколько тяжеловесное выражение указывает на мужчин из соседних домов; עִם здесь передаёт близость или связь.
- source_word: נִזְעֲקוּ
  choice: собрались по тревоге
  rationale: Форма может обозначать тревожный крик, созыв или сбор в ответ на него. Выбранная формулировка естественно связывает тревогу со сбором для погони, не устраняя полностью смысловую напряжённость.
- source_word: וַיַּדְבִּיקוּ
  choice: и догнали
  rationale: Глагол דבק в данной породе и контексте означает настичь или догнать удаляющуюся группу.
- source_word: אֶת בְּנֵי דָן
  choice: сынов Дана
  rationale: Сохранено формальное родовое обозначение исходного текста; из контекста ясно, что речь идёт о данитянах.
