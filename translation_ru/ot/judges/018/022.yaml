base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
translation:
  language: ru
  text: Когда они отошли на некоторое расстояние от дома Михи, мужчины, находившиеся в домах по соседству с домом Михи, были созваны[a] и догнали сынов Дана.
  philosophy: optimal-equivalence
  footnotes:
