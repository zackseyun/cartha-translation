base_translation:
  language: en
  yaml_path: translation/ot/judges/018/026.yaml
  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: ru
  text: Сыны Дана продолжили свой путь. Миха увидел, что они сильнее его, повернул назад и вернулся в свой дом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: сыны Дана
  rationale: Буквальное родовое выражение в данном контексте обозначает колено Дана; «сыны Дана» сохраняет форму и племенную принадлежность оригинала и при этом понятно в библейском повествовании.
- source_word: לְדַרְכָּם
  choice: продолжили свой путь
  rationale: Естественно передаёт сочетание глагола движения с выражением «своим путём» и контекстуальный смысл дальнейшего движения.
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  choice: они сильнее его
  rationale: Сохраняет прямую сравнительную конструкцию חזק с מן, не усиливая её до более толковательного «ему с ними не справиться».
- source_word: וַיִּפֶן
  choice: повернул
  rationale: Передаёт самостоятельное действие «повернул»; направление назад ясно из следующего глагола, поэтому не добавляется преждевременно.
- source_word: וַיָּשָׁב אֶל בֵּיתוֹ
  choice: вернулся к себе домой
  rationale: Естественная современная русская передача возвращения к своему дому; оборот «к себе» сохраняет притяжательный смысл суффикса, а «домой» — направленность.
- source_word: בֵּיתוֹ
  choice: к себе домой
  rationale: В контексте возвращения русский наречный оборот звучит естественнее буквального «к своему дому», не изменяя смысла.
