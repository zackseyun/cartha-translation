- from: 'Сыны Дана послали из своего рода пятерых человек, выбранных из их числа, — способных людей[a] из Цоры и Эштаола, — чтобы разведать землю и исследовать её. Они сказали им: «Идите, исследуйте землю». Те пришли в горную область Ефрема, дошли до дома Михи[b] и заночевали там.'
