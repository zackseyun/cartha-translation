  text: וַ/יִּשְׁלְח֣וּ בְנֵי דָ֣ן מִֽ/מִּשְׁפַּחְתָּ֡/ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִ/קְצוֹתָ/ם֩ אֲנָשִׁ֨ים בְּנֵי חַ֜יִל מִ/צָּרְעָ֣ה וּ/מֵֽ/אֶשְׁתָּאֹ֗ל לְ/רַגֵּ֤ל אֶת הָ/אָ֨רֶץ֙ וּ/לְ/חָקְרָ֔/הּ וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת הָ/אָ֑רֶץ וַ/יָּבֹ֤אוּ הַר אֶפְרַ֨יִם֙ עַד בֵּ֣ית מִיכָ֔ה וַ/יָּלִ֖ינוּ שָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
translation:
  language: ru
  text: 'Сыны Дана послали из своего рода пять человек из их среды — способных мужчин[a] из Цоры и Эштаола, — чтобы разведать землю и исследовать её. Они сказали им: «Идите, исследуйте землю». Те пришли в горную область Ефрема, к дому Михея[b], и заночевали там.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доблестных мужчин», «людей сильных и умелых».'
    reason: Выражение בְּנֵי חַיִל может обозначать доблесть, силу или пригодность к порученному делу.
  - marker: b
    text: «Дом Михея» может означать не только отдельное жилище, но и всё его семейное подворье.
    reason: Культурно-языковое пояснение широкого значения еврейского בֵּית.
lexical_decisions:
- source_word: בְנֵי דָן
  choice: сыны Дана
  rationale: Сохраняет родоплеменной образ еврейского выражения и при этом естественно звучит в современном русском библейском повествовании.
- source_word: מִמִּשְׁפַּחְתָּם
  choice: из своего рода
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу внутри племени; «род» точнее современного узкого «семья» и не расширяет значение до всего племени.
- source_word: מִקְצוֹתָם
  choice: выбранных из их числа
  rationale: 'Передаёт партитивный смысл: пятеро были взяты из состава родовой группы. «Выбранных» естественно выражает подразумеваемый отбор, не добавляя идеи всеобщности.'
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  choice: способных людей
  rationale: В контексте разведывательного поручения выражение указывает на силу, состоятельность и пригодность к делу; «способных» не сужает смысл до воинской доблести. Возможный оттенок доблести отмечен в сноске.
- source_word: לְרַגֵּל
  choice: разведать
  rationale: Точно передаёт целенаправленную разведку местности и естественно сочетается с последующим חקר.
- source_word: וּלְחָקְרָהּ / חִקְרוּ
  choice: исследовать её / исследуйте землю
  rationale: Сохраняет повтор корня חקר и его значение тщательного обследования.
- source_word: הַר אֶפְרַיִם
  choice: горная область Ефрема
  rationale: Речь идёт о нагорье, а не об одной горе; формулировка географически ясна современному читателю.
- source_word: עַד בֵּית מִיכָה
  choice: дошли до дома Михи
  rationale: Естественно передаёт עַד как предел движения и сохраняет буквальное «дом Михи».
- source_word: וַיָּלִינוּ שָׁם
  choice: заночевали там
  rationale: Кратко и точно передаёт пребывание там в течение ночи.
