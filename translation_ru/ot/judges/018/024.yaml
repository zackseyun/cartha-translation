  text: וַ/יֹּ֡אמֶר אֶת אֱלֹהַ/י֩ אֲשֶׁר עָשִׂ֨יתִי לְקַחְתֶּ֧ם וְֽ/אֶת הַ/כֹּהֵ֛ן וַ/תֵּלְכ֖וּ וּ/מַה לִּ֣/י ע֑וֹד וּ/מַה זֶּ֛ה תֹּאמְר֥וּ אֵלַ֖/י מַה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
translation:
  language: ru
  text: 'Он сказал: «Вы забрали моих богов[a], которых я сделал, и священника — и ушли. Что же у меня теперь осталось? Как же вы можете говорить мне: „Что с тобой?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моего бога (моих богов)» или «мои изображения божеств». В некоторых контекстах еврейская форма может пониматься как единственное или множественное число, но здесь более широкий контекст говорит в пользу перевода «моих богов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: моих богов
  rationale: В данном контексте форма допускает неоднозначность числа, однако речь о культовых предметах Михи, поэтому множественное число лучше соответствует ближайшему и более широкому контексту и сохраняет иронию выражения.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: которых я сделал
  rationale: 'Прямо передаёт обычное значение עשה и сохраняет повествовательное напряжение: названные богами предметы были сделаны самим Михой или по его распоряжению.'
- source_word: לְקַחְתֶּם
  choice: вы забрали
  rationale: Совершенный вид естественно выражает завершённое действие с сохраняющимся результатом; «забрали» также передаёт лишение говорящего принадлежавших ему предметов без избыточного усиления.
- source_word: הַכֹּהֵן
  choice: священника
  rationale: Речь идёт об определённом, уже известном из контекста священнике Михи; в русском определённость ясна из контекста и винительной конструкции.
- source_word: וַתֵּלְכוּ
  choice: и ушли
  rationale: Сохраняет второе лицо множественного числа и естественно передаёт завершённый уход данитян.
- source_word: וּמַה לִּי עוֹד
  choice: Что же у меня теперь осталось?
  rationale: Естественно передаёт жалобу на полное лишение; «же» выражает эмоциональное ударение, а «теперь» — итог случившегося.
- source_word: וּמַה זֶּה תֹּאמְרוּ אֵלַי
  choice: Как же вы можете спрашивать меня
  rationale: Передаёт негодование и риторический характер еврейского оборота, не сводя его только к нейтральному вопросу о причине.
- source_word: מַה לָּךְ
  choice: Что с тобой?
  rationale: Современный и естественный русский эквивалент идиомы «что с тобой / что тебя беспокоит?»; сохраняет прямоту вопроса.
theological_decisions:
- issue: Передача אֱלֹהַי в контексте домашних культовых предметов
  choice: моих богов
  alternative: моего бога / моих божественных изображений / моих идолов
  rationale: Основное значение слова — «бог/боги», а контекст указывает на материальные культовые предметы. Вариант «моих богов» сохраняет лексику и богословско-повествовательную иронию оригинала, не подменяя её истолковывающим словом «идолы».
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи и без архаизмов. Риторическое возмущение Михи сохранено; синтаксис слегка сглажен для естественного русского звучания. Маркер сноски помещён после слов автора, как в консультационном английском тексте, хотя примечание относится к выражению «моих богов».
