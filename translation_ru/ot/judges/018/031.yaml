base_translation:
  language: en
  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
translation:
  language: ru
  text: И они поставили для себя резное изображение Михи, которое он сделал[a], на всё время, пока дом Божий находился в Силоме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идол». Еврейское слово означает изготовленное резное культовое изображение; перевод «резное изображение» сохраняет конкретный смысл, а «идол» яснее выражает его назначение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: И поставили они у себя
  rationale: Глагол שׂים означает «ставить, помещать»; в данном культовом контексте «поставили» передаёт установление изображения. לָהֶם естественно передано как «у себя», то есть для собственного пользования и культа.
- source_word: פֶּסֶל
  choice: резное изображение
  rationale: Слово обозначает изготовленное, обычно высеченное или вырезанное культовое изображение. Этот вариант сохраняет конкретный смысл и не заменяет его более истолковывающим словом «идол».
- source_word: מִיכָה
  choice: Михи
  rationale: Имя передано в принятой русской библейской форме «Миха» и поставлено в родительном падеже.
- source_word: אֲשֶׁר עָשָׂה
  choice: которое он сделал
  rationale: Относительное придаточное прямо относится к изображению; местоимение «он» сохраняет Миха как подразумеваемого деятеля.
- source_word: כָּל יְמֵי הֱיוֹת
  choice: на всё то время, пока … находился
  rationale: Русская временная конструкция естественно передаёт длительность еврейского выражения «все дни бытия».
- source_word: בֵּית הָאֱלֹהִים
  choice: дом Божий
  rationale: Прямой и традиционно понятный перевод, сохраняющий формулировку источника и не подменяющий её пояснительным «святилище».
- source_word: בְּשִׁלֹה
  choice: в Силоме
  rationale: Использована устоявшаяся русская библейская форма названия места с нормативным склонением.
theological_decisions:
- issue: Передача בֵּית הָאֱלֹהִים на фоне противопоставления данова культа и центрального места поклонения
  choice: дом Божий
  alternative: святилище Божье
  rationale: Формулировка сохраняет буквальный образ и богословское напряжение повествования, не добавляя к тексту явной оценки и не уточняя сверх сказанного, что речь идёт о законном святилище.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «поставили они» сохраняет повествовательную торжественность, оставаясь понятным; «на всё то время, пока» естественно передаёт длительность без архаизма «во все дни».
