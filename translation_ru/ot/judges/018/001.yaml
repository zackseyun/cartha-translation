source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל וּ/בַ/יָּמִ֣ים הָ/הֵ֗ם שֵׁ֣בֶט הַ/דָּנִ֞י מְבַקֶּשׁ ל֤/וֹ נַֽחֲלָה֙ לָ/שֶׁ֔בֶת כִּי֩ לֹֽא נָ֨פְלָה לּ֜/וֹ עַד הַ/יּ֥וֹם הַ/ה֛וּא בְּ/תוֹךְ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל בְּ/נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
translation:
  language: ru
  text: В те дни не было царя в Израиле. И в те дни колено данитян[a] искало себе удел, чтобы поселиться в нём, потому что до того дня ему ещё не выпал удел[b] среди колен Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «колено Дана».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «выпал удел» связано с распределением земли по жребию.
    reason: idiom_explanation
lexical_decisions:
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: не было царя в Израиле
  rationale: Естественно передаёт древнееврейскую конструкцию существования с отрицанием и сохраняет прямой политико-исторический смысл без дополнительного истолкования.
- source_word: שֵׁבֶט הַדָּנִי
  choice: колено данитян
  rationale: «Колено» соответствует традиционному и понятному русскому обозначению племенной общности Израиля, а «данитян» сохраняет значение прилагательного «данитский».
- source_word: מְבַקֵּשׁ לוֹ
  choice: искало себе
  rationale: Причастие обозначает продолжавшееся действие, а местоимение согласовано с собирательным существительным «колено» в единственном числе.
- source_word: נַחֲלָה
  choice: удел
  rationale: В контексте распределения земли «удел» передаёт и наследственное владение, и территорию, назначенную колену.
- source_word: לָשֶׁבֶת
  choice: чтобы поселиться в нём
  rationale: В данном земельном контексте глагол означает обосноваться и жить на территории; местоимение делает русскую фразу ясной и естественной.
- source_word: כִּי לֹא נָפְלָה לוֹ
  choice: потому что ... ему ещё не выпал удел
  rationale: Сохранён образ «выпавшего» удела, связанный с распределением земли по жребию, без замены его более истолковывающим «не получил».
- source_word: עַד הַיּוֹם הַהוּא
  choice: до того дня
  rationale: Передаёт ретроспективную временную точку зрения повествователя.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל בְּנַחֲלָה
  choice: удел среди колен Израиля
  rationale: Естественно передаёт принадлежность территории к общему распределению наследственных владений между коленами Израиля.
theological_decisions:
- issue: Формула «не было царя в Израиле»
  choice: Сохранена как прямое повествовательное утверждение.
  alternative: Передать её как явное осуждение эпохи судей или как прямое одобрение монархии.
  rationale: Древнееврейский текст констатирует отсутствие царя, но сам по себе не раскрывает здесь полностью богословскую оценку монархии; перевод не должен устранять эту напряжённость.
- issue: Утверждение, что удел до того дня не выпал колену Дана
  choice: Сохранена буквальная напряжённость формулировки о невыпавшем уделе.
  alternative: Уточнить, что данитяне уже получили территорию, но не овладели ею.
  rationale: Такое уточнение могло бы согласовать стих с другими повествованиями о земельном уделе Дана, однако в самом стихе его нет; перевод не должен молча добавлять гармонизирующее объяснение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Слова «царь», «колено» и «удел» сохраняют историко-культурную окраску, оставаясь понятными обычному читателю; синтаксис сделан естественным без устранения неоднозначностей исходного текста.
