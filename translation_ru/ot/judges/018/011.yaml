- from: И отправились оттуда, из Цоры и Эштаола, шестьсот мужчин из данитского рода, вооружённых для войны.[a]
  to: Оттуда отправились шестьсот мужчин из рода данитян, из Цоры и Эштаола, вооружённые боевым оружием.[a]
  rationale: Исправление уточняет, что отряд был снабжён военным оружием, и сохраняет родовой, а не племенной масштаб מִשְׁפָּחָה. Смысл «оттуда» сохранён как связь с предшествующим повествованием; перечисление Цоры и Эштаола оставлено как указание на происхождение отряда.
