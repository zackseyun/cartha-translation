base_translation:
  language: en
  yaml_path: translation/ot/judges/018/011.yaml
  text: So six hundred men from the clan of the Danites set out from there[a], from Zorah and from Eshtaol[b], armed with weapons of war.
translation:
  language: ru
  text: Оттуда отправились шестьсот мужчин из рода данитян, из Цоры и Эштаола, вооружённые боевым оружием.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «опоясанных военными орудиями».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: отправились
  rationale: Глагол נסע в повествовательной форме обозначает выступление в путь, нередко после снятия с места; «отправились» естественно передаёт это значение в современном русском языке.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Прямое и естественное соответствие наречию места, связывающее стих с предшествующим повествованием.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: из данитского рода
  rationale: מִשְׁפָּחָה здесь обозначает родовую группу внутри колена, а не всё колено Дана; «род» сохраняет родственный и общественный смысл термина.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: из Цоры и Эштаола
  rationale: Названия мест переданы принятой библейской транслитерацией; повтор предлога в еврейском тексте естественно свёрнут в русском однородном сочетании.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: шестьсот мужчин
  rationale: אִישׁ при числительном обозначает мужчин; военный контекст подтверждает, что речь идёт о взрослых мужчинах, составлявших отряд.
- source_word: חָגוּר כְּלֵי מִלְחָמָה
  choice: вооружённых для войны
  rationale: Буквально выражение описывает людей, «опоясанных» военным снаряжением. В современном русском «вооружённых для войны» ясно передаёт их полную боевую готовность без неестественной буквальности.
