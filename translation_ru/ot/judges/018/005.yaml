  text: וַ/יֹּ֥אמְרוּ ל֖/וֹ שְׁאַל נָ֣א בֵ/אלֹהִ֑ים וְ/נֵ֣דְעָ֔ה הֲ/תַצְלִ֣יחַ דַּרְכֵּ֔/נוּ אֲשֶׁ֥ר אֲנַ֖חְנוּ הֹלְכִ֥ים עָלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/005.yaml
  text: And they said to him[a], “Please inquire of God, so that we may know whether the journey on which we are going will succeed.”
translation:
  language: ru
  text: 'И они сказали ему: «Обратись, пожалуйста, к Богу за ответом[a], чтобы мы узнали, удачным ли будет наш путь[b], по которому мы идём».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к богам за ответом»; древнееврейское слово может обозначать Бога, божество или богов.'
    reason: Сохраняет лексическую и контекстуальную неоднозначность אֱלֹהִים.
  - marker: b
    text: 'Или: «увенчается ли успехом наше путешествие». Буквально: «будет ли успешен наш путь».'
    reason: Даёт более свободную передачу смысла и одновременно указывает буквальный образ древнееврейского текста.
lexical_decisions:
- source_word: וַיֹּאמְרוּ לוֹ
  choice: И они сказали ему
  rationale: Союз «и» сохраняет последовательное повествовательное движение древнееврейской формы wayyiqtol, не усиливая временную связь.
- source_word: שְׁאַל נָא בֵאלֹהִים
  choice: Обратись, пожалуйста, к Богу за ответом
  rationale: Глагол שׁאל с ב в данном контексте означает обращение за божественным ответом; такая формулировка естественна по-русски и передаёт вежливую частицу נָא.
- source_word: וְנֵדְעָה
  choice: чтобы мы узнали
  rationale: Когортатив здесь выражает цель просьбы; «чтобы» ясно передаёт эту связь.
- source_word: הֲתַצְלִיחַ דַּרְכֵּנוּ
  choice: удачным ли будет наш путь
  rationale: Форма הצליח передаёт успех или благоприятный исход, а суффикс в דַּרְכֵּנוּ прямо означает «наш». Слово «путь» сохраняет образ оригинала.
- source_word: אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ
  choice: по которому мы идём
  rationale: Перевод сохраняет относительную конструкцию и пространственный образ пути, по которому движутся посланцы.
theological_decisions:
- issue: Значение אֱלֹהִים
  choice: Бог
  alternative: боги; божество
  rationale: 'В непосредственном контексте наиболее естественно единственное число: людей просят получить божественный ответ через священнослужителя. Однако форма אֱלֹהִים сама по себе допускает и иное понимание, поэтому неоднозначность отмечена в сноске.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным повествовательным регистром. Формулировка «обратись к Богу за ответом» передаёт обращение за оракулом без архаичного «вопроси»; образ «пути» сохранён.
