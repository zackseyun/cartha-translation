revisions:
- from: Они взяли то, что сделал Миха, и священника, который был у него, и пошли на Лаис, на народ мирный и беспечный. Они поразили жителей[a] остриём меча, а город сожгли огнём.
  to: Они взяли то, что сделал Миха, и священника, который был у него, и выступили против Лаиса, против народа спокойного и жившего в безопасности. Они поразили их[a] остриём меча, а город сожгли огнём.
  rationale: Исправлено оценочно окрашенное «беспечный» на нейтральную передачу спокойствия и безопасности. Восстановлено исходное «их» вместо эксплицирующего «жителей». Сноска перенесена к устойчивому выражению «остриём меча», где она объясняет еврейскую идиому и соответствует смыслу аудиторской сноски POB.
