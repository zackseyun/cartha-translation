translation_notes:
  register: Современный литературный русский с достоинством исторического повествования. Синтаксис сделан плавным и доступным, но сохранены повтор «на Лаис, на народ» и выразительное «сожгли огнём». Термин «священник» и имя «Миха» согласованы с обычной русской библейской традицией.
