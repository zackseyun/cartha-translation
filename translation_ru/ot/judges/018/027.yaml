base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
translation:
  language: ru
  text: Они взяли то, что сделал Миха, и священника, который был у него, и выступили против Лаиса, против народа спокойного и жившего в безопасности. Они поразили их[a] остриём меча, а город сожгли огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «устами меча» — еврейское выражение, означающее «остриём (лезвием) меча».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה לָקְחוּ
  choice: Они взяли
  rationale: Самостоятельное местоимение подчёркивает действующее лицо; в русском это естественно передаётся явно выраженным «они». לקח оставлено в широком значении «взяли», применимом и к предметам, и к священнику.
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  choice: то, что сделал Миха
  rationale: Естественная русская передача относительной конструкции; контекст уточняет, что речь идёт о ранее названных культовых предметах.
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  choice: и священника, который был у него
  rationale: Буквально конструкция означает «который был у него/для него». Такая передача сохраняет неопределённость характера связи и не превращает священника в собственность Михи.
- source_word: וַיָּבֹאוּ עַל לַיִשׁ
  choice: и пошли на Лаис
  rationale: В военном контексте בוא על обозначает враждебное выступление против места. Русское «пошли на» естественно сохраняет движение и враждебную направленность, не сливая его с последующим нападением.
- source_word: עַל עַם שֹׁקֵט וּבֹטֵחַ
  choice: на народ мирный и беспечный
  rationale: שֹׁקֵט описывает спокойствие и отсутствие тревоги, а בֹטֵחַ — чувство безопасности. «Мирный и беспечный» естественно передаёт ситуацию не ожидающего нападения народа; «безмятежный и уверенный в безопасности» было бы формальнее, но тяжелее.
- source_word: וַיַּכּוּ אוֹתָם
  choice: Они поразили жителей
  rationale: נכה оставлено в сдержанном значении «поразили», а местоимение «их» раскрыто как «жителей», поскольку ближайшее собирательное обозначение — «народ» и русский текст иначе допускает неясную отсылку.
- source_word: לְפִי חָרֶב
  choice: остриём меча
  rationale: Устойчивое еврейское выражение буквально означает «устами меча». «Остриём меча» сохраняет образ поражения оружием и привычно звучит в возвышенном повествовании.
- source_word: וְאֶת הָעִיר שָׂרְפוּ בָאֵשׁ
  choice: а город сожгли огнём
  rationale: Сохранено явное בָאֵשׁ «огнём», придающее фразе выразительность; союз «а» естественно отмечает переход от участи жителей к участи города.
