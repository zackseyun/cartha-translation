base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
translation:
  language: ru
  text: Они дали городу имя Дан — по имени своего отца Дана[a], который родился у Израиля; а прежде этот город назывался Лаисом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своего праотца». Еврейское слово «отец» может обозначать предка, а не только непосредственного родителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר
  choice: дали городу имя
  rationale: Передаёт конструкцию «назвали имя города» естественным современным русским языком, сохраняя явное упоминание имени.
- source_word: דָּן
  choice: Дан
  rationale: Традиционная русская передача имени собственного.
- source_word: בְּשֵׁם דָּן אֲבִיהֶם
  choice: по имени своего отца Дана
  rationale: Предлог בְּ при שֵׁם указывает, в честь кого или по чьему имени назван город. Слово אָב передано основным значением «отец», а возможный широкий смысл пояснён в сноске.
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  choice: который родился у Израиля
  rationale: Сохраняет пассивную конструкцию и имя «Израиль», не подменяя его толковательным «Иаков».
- source_word: וְאוּלָם
  choice: прежде же
  rationale: В сочетании с заключительной частью стиха передаёт противопоставление нового имени прежнему без тяжеловесного вводного слова.
- source_word: לַיִשׁ
  choice: Лаис
  rationale: Традиционная русская транслитерация названия города.
- source_word: לָרִאשֹׁנָה
  choice: прежде
  rationale: Естественно обозначает прежнее название города до его переименования.
theological_decisions:
- issue: Родословное обозначение אֲבִיהֶם
  choice: своего отца
  alternative: своего праотца
  rationale: Основной текст сохраняет непосредственное лексическое значение и древнееврейский родословный образ. При этом слово может обозначать далёкого предка, что отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Конструкция «дали городу имя» естественно передаёт явное древнееврейское выражение «назвали имя города»; точка с запятой сохраняет единое движение исходного предложения.
