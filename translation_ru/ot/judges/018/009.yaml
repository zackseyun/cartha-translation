base_translation:
  language: en
  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: ru
  text: 'И они сказали: «Вставайте, пойдём на них, ведь мы видели землю — она очень хороша. А вы молчите — не ленитесь идти, войти и завладеть землёй».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּמָה
  choice: Вставайте
  rationale: Побудительная форма передана естественным русским призывом во множественном числе по смыслу обращения.
- source_word: וְנַעֲלֶה עֲלֵיהֶם
  choice: пойдём на них
  rationale: Глагол עלה в сочетании с עַל здесь выражает выступление против жителей; буквальное «поднимемся» по-русски было бы неестественно и могло бы ошибочно указывать лишь на рельеф.
- source_word: וְאַתֶּם מַחְשִׁים
  choice: А вы медлите
  rationale: Причастие от חרש буквально связано с бездействующим молчанием; в данном призыве речь о промедлении, что естественно выражено по-русски без добавления причины.
- source_word: אַל תֵּעָצְלוּ
  choice: Не ленитесь
  rationale: Сохраняет прямой упрёк в вялости и нежелании действовать.
- source_word: לָלֶכֶת לָבֹא לָרֶשֶׁת
  choice: отправиться туда, войти и овладеть
  rationale: Сохранена трёхчастная последовательность действий; «туда» естественно связывает движение с ранее названной землёй, а «овладеть» передаёт вступление во владение.
