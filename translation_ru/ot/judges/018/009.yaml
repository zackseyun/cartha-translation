- from: 'И они сказали: «Вставайте, пойдём на них! Мы видели эту землю: она очень хороша. А вы медлите! Не ленитесь отправиться туда, войти и овладеть этой землёй».'
  to: 'И они сказали: «Вставайте, пойдём на них, ведь мы видели землю — она очень хороша. А вы молчите — не ленитесь идти, войти и завладеть землёй».'
  rationale: Исправлено «медлите» на «молчите», чтобы сохранить прямое значение еврейского выражения и не смешивать его со следующим запретом на нерадивость. Убраны не выраженные в оригинале указательные местоимения; остальная структура призыва сохранена.
