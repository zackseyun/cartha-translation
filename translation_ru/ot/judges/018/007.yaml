  text: וַ/יֵּלְכוּ֙ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֔ים וַ/יָּבֹ֖אוּ לָ֑יְשָׁ/ה וַ/יִּרְא֣וּ אֶת הָ/עָ֣ם אֲשֶׁר בְּ/קִרְבָּ֣/הּ יוֹשֶֽׁבֶת לָ֠/בֶטַח כְּ/מִשְׁפַּ֨ט צִדֹנִ֜ים שֹׁקֵ֣ט וּ/בֹטֵ֗חַ וְ/אֵין מַכְלִ֨ים דָּבָ֤ר בָּ/אָ֨רֶץ֙ יוֹרֵ֣שׁ עֶ֔צֶר וּ/רְחֹקִ֥ים הֵ֨מָּה֙ מִ/צִּ֣דֹנִ֔ים וְ/דָבָ֥ר אֵין לָ/הֶ֖ם עִם אָדָֽם־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/007.yaml
  text: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
translation:
  language: ru
  text: Пять человек отправились в путь и пришли в Лаис. Они увидели народ, живший там в безопасности, по обычаю сидонян, — спокойно и без опасений. В той земле не было никого, кто, обладая властью, мог бы унижать их в чём-либо[a]. Они были далеко от сидонян и ни с кем не имели никаких дел[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейский текст здесь труден. Буквально он содержит приблизительно: «нет унижающего что-либо в земле, владеющего/имеющего עֶצֶר». Вероятно, речь идёт об отсутствии правителя или притеснителя, способного подчинять либо унижать жителей; точная связь слов и значение последнего выражения неясны.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни с кем не имели никакого союза (никаких связей)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָיְשָׁה
  choice: в Лаис
  rationale: Название города передано принятой русской библейской формой; конечное ה указывает направление и естественно выражается предлогом «в».
- source_word: יוֹשֶׁבֶת לָבֶטַח
  choice: живущий там народ пребывает в безопасности
  rationale: Собирательное «народ» позволяет естественно передать причастие и состояние устойчивой защищённости.
- source_word: כְּמִשְׁפַּט צִדֹנִים
  choice: по обычаю сидонян
  rationale: מִשְׁפָּט здесь обозначает установившийся уклад или обычай, а не судебное решение.
- source_word: שֹׁקֵט וּבֹטֵחַ
  choice: спокойно и без опасений
  rationale: 'Передана парность характеристик: отсутствие внешнего беспокойства и внутреннего страха; при этом избегается тяжёлое повторение слова «безопасность».'
- source_word: מַכְלִים דָּבָר
  choice: кто унижал бы их в чём-либо
  rationale: Глагол в породе hифиль имеет значение причинения стыда или унижения; местоименное дополнение восполнено по смыслу контекста.
- source_word: יוֹרֵשׁ עֶצֶר
  choice: обладал властью
  rationale: Крайне трудное выражение, вероятно описывающее носителя власти, способного стеснять или подчинять жителей; перевод сохраняет общий функциональный смысл без чрезмерной конкретизации.
- source_word: וּרְחֹקִים הֵמָּה מִצִּדֹנִים
  choice: они были далеко от сидонян
  rationale: Сохранено прямое пространственное значение и множественное «сидонян» исходного текста.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: ни с кем не имели никаких отношений
  rationale: Идиома буквально говорит об отсутствии «дела/слова» с кем-либо и обозначает отсутствие связей или деловых отношений.
theological_decisions:
- issue: Характер уязвимости жителей Лаиса
  choice: Не уточнять, была ли их безопасность истинной или лишь кажущейся
  alternative: Перевести «жили беспечно» или «ничего не подозревали»
  rationale: Еврейские выражения подчёркивают спокойствие и чувство безопасности, но сами по себе не требуют нравственной оценки или указания на неосведомлённость.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Синтаксис упрощён лишь там, где буквальное воспроизведение сделало бы трудный еврейский оборот непонятным; его неоднозначность отмечена в сноске.
