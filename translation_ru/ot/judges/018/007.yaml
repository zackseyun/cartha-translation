revisions:
- from: Пять человек отправились в путь и пришли в Лаис. Они увидели, что живущий там народ пребывает в безопасности, по обычаю сидонян, спокойно и без опасений. В той земле не было никого, кто унижал бы их в чём-либо и обладал властью[a]. Они были далеко от сидонян и ни с кем не имели никаких отношений[b].
  to: Пять человек отправились в путь и пришли в Лаис. Они увидели народ, живший там в безопасности, по обычаю сидонян, — спокойно и без опасений. В той земле не было никого, кто, обладая властью, мог бы унижать их в чём-либо[a]. Они были далеко от сидонян и ни с кем не имели никаких дел[b].
  rationale: Исправлены естественность русского изложения и подача спорного выражения. Смысл «безопасной и изолированной» жизни жителей сохранён; спорная деталь о носителе власти оставлена в осторожном переводе и объяснена без догматического выбора.
