translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сохранён компактным и последовательным; специальный термин «эфод» оставлен без парафраза. Маркер [a] помещён при слове «терафимов», к которому относится пояснение исходной консультационной сноски.
