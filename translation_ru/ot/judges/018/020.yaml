base_translation:
  language: en
  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
translation:
  language: ru
  text: Священник обрадовался, взял эфод, терафимов[a] и резное изваяние[b] и вошёл в середину народа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Терафимы — домашние культовые предметы или домашние божества.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «идола».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב הַכֹּהֵן
  choice: Священник обрадовался
  rationale: Еврейская идиома буквально говорит, что сердце священника стало радостным или довольным. В современном русском естественнее передать её смысл глаголом «обрадовался», не усиливая эмоцию до ликования.
- source_word: הָאֵפוֹד
  choice: эфод
  rationale: Устоявшийся русский эквивалент специального культового термина; описательный перевод здесь был бы менее точным.
- source_word: הַתְּרָפִים
  choice: терафимов
  rationale: Транслитерация сохраняет особое название домашних культовых предметов и не снимает неоднозначность между изображениями и домашними божествами; значение поясняется в сноске.
- source_word: הַפָּסֶל
  choice: резное изваяние
  rationale: Сочетание передаёт как предметное значение изображения, так и способ его изготовления; оно конкретнее общего слова «идол» и современнее традиционного «истукан».
- source_word: בְּקֶרֶב הָעָם
  choice: в самую середину народа
  rationale: Передаёт пространственное значение «внутрь, среди» и направленность движения, выраженную глаголом וַיָּבֹא. Слово «народ» сохраняет широкий смысл הָעָם без контекстуального сужения до «отряда».
