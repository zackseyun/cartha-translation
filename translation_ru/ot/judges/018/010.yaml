  text: כְּ/בֹאֲ/כֶ֞ם תָּבֹ֣אוּ אֶל עַ֣ם בֹּטֵ֗חַ וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם כִּֽי נְתָנָ֥/הּ אֱלֹהִ֖ים בְּ/יֶדְ/כֶ֑ם מָקוֹם֙ אֲשֶׁ֣ר אֵֽין שָׁ֣ם מַחְס֔וֹר כָּל דָּבָ֖ר אֲשֶׁ֥ר בָּ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
translation:
  language: ru
  text: Когда вы придёте, то придёте к народу, живущему в безопасности[a], а земля там просторна[b], ибо Бог отдал эту землю в ваши руки — место, где ни в чём из того, что есть в этой земле, нет недостатка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «живущего беззаботно» или «ничего не подозревающего». Еврейское выражение описывает народ, ощущающий себя в безопасности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «земля широка руками» — еврейская идиома, означающая обширную, просторную землю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם תָּבֹאוּ אֶל
  choice: Когда вы придёте, то окажетесь у
  rationale: Сочетание инфинитива со значением времени и личной формы глагола буквально повторяет идею прихода. Русская формулировка сохраняет последовательность и устраняет неестественный повтор «когда придёте, придёте к».
- source_word: עַם בֹּטֵחַ
  choice: народ, живущий в безопасности
  rationale: בֹּטֵחַ описывает ощущение защищённости и спокойную жизнь. Перевод не усиливает контекст до однозначного «ничего не подозревающего народа», но эта возможность отмечена в сноске.
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  choice: а земля там просторна
  rationale: Идиома רַחֲבַת יָדַיִם, буквально «широка руками», означает обширность и простор; буквальный образ по-русски был бы непонятен.
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  choice: Ведь Бог отдал её в ваши руки
  rationale: Перфект выражает совершившееся или уверенно предвосхищаемое дарование. Русская идиома «отдать в руки» естественно передаёт власть и обладание.
- source_word: מָקוֹם
  choice: Это место
  rationale: Существительное вводит присоединённое описание территории; отдельное предложение делает эту связь ясной в современном русском.
- source_word: אֲשֶׁר אֵין שָׁם מַחְסוֹר
  choice: где нет недостатка
  rationale: Формулировка прямо передаёт отсутствие нужды или нехватки.
- source_word: כָּל דָּבָר אֲשֶׁר בָּאָרֶץ
  choice: ни в чём из того, что есть в этой земле
  rationale: В контексте הָאָרֶץ обозначает обсуждаемую территорию, а не всю землю как мир; указательное «этой» делает контекстуальную отсылку ясной.
theological_decisions:
- issue: Значение אֱלֹהִים в речи разведчиков
  choice: Бог
  alternative: боги; некий бог
  rationale: Слово согласовано с глаголом в единственном числе и в данном контексте обозначает Бога как действующего субъекта. Перевод не добавляет конфессиональных уточнений.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным звучанием. Неестественный глагольный повтор оригинала сглажен, а идиома о «широких руках» передана по смыслу и пояснена в сноске. Все сноски поставлены непосредственно при выражениях, к которым относятся.
