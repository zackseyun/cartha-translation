base_translation:
  language: en
  yaml_path: translation/ot/judges/018/023.yaml
  text: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
translation:
  language: ru
  text: 'Они окликнули данитян[a]. Те обернулись и спросили Миху: «Что с тобой? Почему ты поднял крик[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов Дана».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Почему ты кричишь?»; «Почему ты поднял шум?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: окликнули
  rationale: Глагол קרא здесь обозначает громкий зов, обращённый к удаляющейся группе; «окликнули» естественно передаёт направленный призыв без излишнего оттенка бедствия.
- source_word: אֶל־בְּנֵי דָן
  choice: данитян
  rationale: Буквально «сынов Дана»; в современном русском повествовании этноним «данитяне» ясно и естественно обозначает членов колена Дана.
- source_word: וַיַּסֵּבּוּ פְּנֵיהֶם
  choice: Те обернулись
  rationale: Буквально «они повернули свои лица»; русское «обернулись» точно передаёт действие и устраняет неясность местоименного перехода.
- source_word: לְמִיכָה
  choice: Миху
  rationale: Предлог לְ обозначает адресата речи; имя מִיכָה передано принятой русской библейской формой «Миха» с винительным падежом после «спросили».
- source_word: מַה־לְּךָ
  choice: Что с тобой?
  rationale: Устойчивый еврейский оборот спрашивает, что случилось с человеком или что его тревожит; это краткий и естественный русский эквивалент.
- source_word: כִּי
  choice: Почему
  rationale: В сочетании с предшествующим вопросом частица вводит основание для него; по-русски причинный вопрос естественно передаётся отдельным «Почему?».
- source_word: נִזְעָקְתָּ
  choice: ты поднял такой крик
  rationale: Нифаль от זעק выражает громкий крик, вопль или поднятый шум. В контексте погони «поднял такой крик» сохраняет оттенок шумного возмущения и отличается от нейтрального «окликнули» в первой части.
