revisions:
- from: И поставили сыны Дана у себя резное изваяние. Ионафан, сын Гирсома, сына Моисея,[a] и его сыновья были священниками у племени данитян до дня изгнания земли.
  to: Сыны Дана поставили себе резное изваяние. Ионафан, сын Гирсома, сына Моисея,[a] и его сыновья были священниками племени данитян до дня изгнания земли.
  rationale: 'Исправлены два русских оборота, в которых точность и естественность можно безопасно улучшить: «поставили себе» точнее отражает לָהֶם, а «священниками племени данитян» устраняет неудачное «у племени». Финальное «до дня изгнания земли» оставлено намеренно: его странность соответствует краткому и спорному еврейскому выражению и не навязывает идентификацию изгнания. Сноска уточнена без изменения избранного основного чтения.'
