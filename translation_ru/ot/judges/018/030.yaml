base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
translation:
  language: ru
  text: Сыны Дана поставили себе резное изваяние. Ионафан, сын Гирсома, сына Моисея,[a] и его сыновья были священниками племени данитян до дня изгнания земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте: «Моисея»; в масоретской традиции буква нун написана подвешенной над строкой, что даёт традиционное чтение «Манассии».'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקִימוּ לָהֶם
  choice: поставили у себя
  rationale: Гифиль глагола קום означает «поставить, установить»; לָהֶם указывает, что изваяние было установлено для самих данитян. «У себя» естественно передаёт это значение по-русски.
- source_word: בְּנֵי דָן
  choice: сыны Дана
  rationale: Сохраняет форму еврейского родоплеменного обозначения и отличает её от последующего הַדָּנִי «данитян».
- source_word: הַפָּסֶל
  choice: резное изваяние
  rationale: Пֶּסֶל обозначает изготовленное резьбой изображение; перевод сохраняет конкретный смысл слова, не подменяя его интерпретирующим «идол».
- source_word: בֶּן גֵּרְשֹׁם בֶּן מְהוּא
  choice: сын Гирсома, сына Моисея
  rationale: Родословная конструкция передана прямо; основной текст отражает чтение «Моисей», а масоретское чтение с подвешенной буквой отмечено в сноске.
- source_word: וּבָנָיו הָיוּ כֹהֲנִים
  choice: и его сыновья были священниками
  rationale: Русская конструкция ясно показывает, что сказуемое относится к Ионафану и его сыновьям.
- source_word: לְשֵׁבֶט הַדָּנִי
  choice: у племени данитян
  rationale: Предлог לְ здесь выражает служение священников племени; «у племени» звучит естественно и не уточняет сверх текста характер отношений.
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  choice: до дня изгнания земли
  rationale: Формально близкий перевод сохраняет необычность и неоднозначность еврейского оборота и не определяет, о каком именно изгнании идёт речь.
theological_decisions:
- issue: Родословная принадлежность Ионафана
  choice: сына Моисея
  alternative: сына Манассии
  rationale: 'Согласный текст указывает на Моисея, тогда как подвешенная буква нун в масоретской традиции создаёт традиционное чтение «Манассия». Напряжение между чтениями сохранено: «Моисей» дан в основном тексте, «Манассия» — в сноске.'
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достойным библейского повествования регистром. Выражение «сыны Дана» сохранено как понятная традиционная родоплеменная формула; архаизмы вроде «истукан» и конфессионально нагруженная конкретизация «идол» не использованы.
