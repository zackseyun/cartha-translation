  text: וַ/יֹּאמְרוּ֩ ל֨/וֹ הַחֲרֵ֜שׁ שִֽׂים יָדְ/ךָ֤ עַל פִּ֨י/ךָ֙ וְ/לֵ֣ךְ עִמָּ֔/נוּ וֶֽ/הְיֵה לָ֖/נוּ לְ/אָ֣ב וּ/לְ/כֹהֵ֑ן הֲ/ט֣וֹב הֱיוֹתְ/ךָ֣ כֹהֵ֗ן לְ/בֵית֙ אִ֣ישׁ אֶחָ֔ד א֚וֹ הֱיוֹתְ/ךָ֣ כֹהֵ֔ן לְ/שֵׁ֥בֶט וּ/לְ/מִשְׁפָּחָ֖ה בְּ/יִשְׂרָאֵֽל־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
translation:
  language: ru
  text: 'Они сказали ему: «Молчи[a], прикрой рот рукой и иди с нами. Будь нам отцом[b] и священником. Что для тебя лучше: быть священником в доме одного человека или быть священником для племени и рода[c] в Израиле?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Храни молчание» или «Не говори». Еврейское повеление требует прекратить говорить.'
    reason: lexical_alternative
  - marker: b
    text: Слово «отец» здесь обозначает положение социального или религиозного авторитета, а не биологическое родство.
    reason: cultural_note
  - marker: c
    text: 'Или: «семьи»; еврейское слово обозначает родственную группу внутри племени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ
  choice: Молчи
  rationale: Повелительная форма от חרשׁ требует прекратить говорить. Краткое «Молчи» естественно по-русски и сохраняет прямоту приказа.
- source_word: שִׂים יָדְךָ עַל־פִּיךָ
  choice: положи руку на рот
  rationale: Сохранён буквальный образ жеста, означающего молчание и сдержанность.
- source_word: וְלֵךְ עִמָּנוּ
  choice: и иди с нами
  rationale: Прямая и естественная передача повеления и предложного оборота.
- source_word: וְהְיֵה לָנוּ לְאָב וּלְכֹהֵן
  choice: Будь нам отцом и священником
  rationale: Сохранены обе названные роли и еврейская конструкция принадлежности без сведения слова «отец» к более узкому толкованию.
- source_word: לְאָב
  choice: отцом
  rationale: Буквальная передача сохраняет культурно значимый титул социального или религиозного авторитета.
- source_word: כֹהֵן
  choice: священником
  rationale: Обычное и контекстуально ясное соответствие еврейскому כהן.
- source_word: הֲטוֹב
  choice: Что для тебя лучше
  rationale: Вопросительное выражение вводит сопоставление двух возможностей; сравнительная формулировка естественна по-русски и передаёт подразумеваемый смысл.
- source_word: לְבֵית אִישׁ אֶחָד
  choice: в доме одного человека
  rationale: Слово «дом» сохраняет как буквальный образ, так и возможный смысл домашнего хозяйства или семьи.
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  choice: у племени и рода в Израиле
  rationale: «Племя» передаёт שבט, а «род» — более узкую родственную группу משפחה, сохраняя различие между социальными единицами.
theological_decisions:
- issue: Значение слова «отец» как титула
  choice: Сохранить буквальное «отец».
  alternative: советник; покровитель; руководитель
  rationale: Текст ставит культурно значимый титул «отец» рядом со словом «священник». Буквальная передача сохраняет широту значения и не навязывает более узкого понимания роли.
- issue: Передача термина משפחה
  choice: Передать как «род», отличая его от «племени».
  alternative: семья; клан
  rationale: «Род» в данном контексте обозначает родственную общность внутри племени и сохраняет противопоставление дому одного человека более крупной общности Израиля.
translation_notes:
  register: Современный литературный русский язык с краткой, напряжённой прямой речью. Сохранены буквальный жест «положи руку на рот», культурный титул «отец» и различие между племенем и родом; архаизмы и конфессионально окрашенные уточнения не добавлены.
