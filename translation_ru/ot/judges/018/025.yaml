  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
translation:
  language: ru
  text: 'И сказали ему сыны Дана: «Не подавай при нас голоса[a], иначе на вас нападут озлобленные люди[b], и ты лишишься жизни — вместе с твоими домашними».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Пусть твой голос не будет слышен среди нас».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «люди, горькие душой». Возможные переводы: «отчаянные люди» или «люди с горькой душой».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דָן
  choice: сыны Дана
  rationale: Сохраняет еврейское родоплеменное выражение и ясно обозначает принадлежность к колену Дана; «даниты» было бы более сжатым вариантом.
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  choice: Не подавай при нас голоса
  rationale: Естественная русская угроза, близкая к буквальному образу «пусть не будет слышен твой голос среди нас»; по контексту речь о требовании прекратить возражения.
- source_word: פֶּן
  choice: иначе
  rationale: Передаёт предостерегающую и угрожающую силу союза естественнее для современного русского, чем архаичное «дабы не».
- source_word: יִפְגְּעוּ בָכֶם
  choice: нападут на вас
  rationale: В данном враждебном контексте פגע обозначает нападение; множественное «вас» сохраняет переход исходного текста от обращения к одному Михе к угрозе всей группе.
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  choice: люди, ожесточённые душой
  rationale: Сохраняет образ נפש и передаёт опасных, озлобленных или доведённых до крайности людей, не сводя неоднозначную идиому к одному толкованию.
- source_word: וְאָסַפְתָּה נַפְשְׁךָ וְנֶפֶשׁ בֵּיתֶךָ
  choice: и тогда лишитесь жизни и ты, и твои домашние
  rationale: Передаёт идиоматический смысл утраты жизни и коллективное значение «дома», избегая неестественного буквального «соберёшь свою душу».
