translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Сыны Дана» сохраняет племенную формулу, а остальная фраза построена естественно и понятно. Единственное число в обращении к Михе и множественное число в угрозе ему и его людям сохранены.
