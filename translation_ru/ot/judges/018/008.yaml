  text: וַ/יָּבֹ֨אוּ֙ אֶל אֲחֵי/הֶ֔ם צָרְעָ֖ה וְ/אֶשְׁתָּאֹ֑ל וַ/יֹּאמְר֥וּ לָ/הֶ֛ם אֲחֵי/הֶ֖ם מָ֥ה אַתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/008.yaml
  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
translation:
  language: ru
  text: 'И они пришли к своим братьям[a] в Цору и Эштаол. Братья спросили их: «Что у вас?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к своим родичам»; еврейское слово «братья» может обозначать не только родных братьев, но и родственников одного рода или племени.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский вопрос очень краток и эллиптичен, буквально: «Что — вы?» По смыслу это, вероятно, просьба рассказать о результатах поисков или о положении дел.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: И они пришли
  rationale: Форма wayyiqtol продвигает повествование; простой глагол «пришли» сохраняет значение בוא без добавления отсутствующего в тексте значения «вернулись».
- source_word: אֶל אֲחֵיהֶם
  choice: к своим братьям
  rationale: אָח буквально означает «брат», но в данном племенном контексте может обозначать также родичей или соплеменников. Основной текст сохраняет образ еврейского оригинала, а примечание указывает на более широкий смысл.
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  choice: в Цору и Эштаол
  rationale: Названия мест переданы принятой русской библейской транслитерацией; предлог «в» естественно выражает местонахождение братьев, подразумеваемое конструкцией.
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם
  choice: Братья спросили их
  rationale: Глагол אמר перед прямым вопросом естественно передаётся по-русски как «спросили»; явный субъект «братья» сохранён.
- source_word: מָה אַתֶּם
  choice: Что у вас?
  rationale: Еврейская реплика предельно кратка и эллиптична. Русское «Что у вас?» естественно приглашает сообщить новости или положение дел, не уточняя больше, чем позволяет контекст.
