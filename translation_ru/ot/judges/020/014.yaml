  text: And the sons of Benjamin gathered from the cities to Gibeah to go out to battle against the sons of Israel[a][b].
translation:
  language: ru
  text: И собрались сыны Вениамина из городов в Гиву, чтобы выйти на битву против сынов Израиля[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с сынами Израиля»; в контексте битвы предлог имеет значение «против сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вениамитяне… против израильтян». В основном тексте сохранена еврейская родоплеменная идиома «сыны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: собрались
  rationale: Нифаль от אסף обозначает совместное собирание; русское «собрались» естественно передаёт это значение.
- source_word: בְנֵי בִנְיָמִן
  choice: сыны Вениамина
  rationale: Сохраняет еврейскую родоплеменную идиому и уместный для библейского повествования высокий, но понятный регистр.
- source_word: מִן הֶעָרִים
  choice: из городов
  rationale: Предлог מִן указывает на исходную точку, а plural עָרִים — на населённые пункты Вениаминовой земли.
- source_word: הַגִּבְעָתָה
  choice: в Гиву
  rationale: Направительное окончание -ָה выражает движение к Гиве; в русском это естественно передаётся винительным падежом с «в».
- source_word: לָצֵאת
  choice: чтобы выйти
  rationale: Инфинитив יצא буквально означает «выйти»; целевая конструкция «чтобы» ясно передаёт связь с собиранием.
- source_word: לַמִּלְחָמָה
  choice: на битву
  rationale: В военном обороте לצאת למלחמה естественно означает выйти на сражение; «на битву» сохраняет образ исходного выражения.
- source_word: עִם בְּנֵי יִשְׂרָאֵל
  choice: против сынов Израиля
  rationale: Хотя עִם обычно значит «с», в контексте сражения оно имеет противительное значение «против»; родоплеменная идиома «сыны Израиля» сохранена.
