  text: Then the sons of Benjamin came out from Gibeah and struck down twenty-two thousand men of Israel that day[a].
translation:
  language: ru
  text: Тогда сыны Вениамина вышли из Гивы и в тот день повергли наземь двадцать две тысячи израильтян.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: вышли
  rationale: Глагол יצא обозначает выход из города; в военном контексте речь идёт о выступлении навстречу противнику.
- source_word: בְנֵי בִנְיָמִן
  choice: сыны Вениамина
  rationale: Сохраняет древнееврейское обозначение племени через родство и соответствует достоинству библейского повествования.
- source_word: מִן הַגִּבְעָה
  choice: из Гивы
  rationale: Предлог указывает на исходный пункт, а Гива — название города.
- source_word: וַיַּשְׁחִיתוּ
  choice: повергли наземь
  rationale: В данном описании сражения Hiphil глагола שׁחת означает нанесение смертельного поражения; вместе с אָרְצָה выбранное выражение передаёт и гибель, и образ падения на землю.
- source_word: בְיִשְׂרָאֵל
  choice: израильтян
  rationale: В контексте подсчёта павших естественное русское обозначение передаёт людей, принадлежавших Израилю, на которых было направлено действие.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Точное и естественное временное выражение на современном русском языке.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף
  choice: двадцать две тысячи
  rationale: Нормальная русская передача древнееврейского числительного.
- source_word: אִישׁ
  choice: израильтян
  rationale: После числительного אִישׁ относится к мужчинам, павшим в бою; в русском племенное обозначение во множественном числе выражает это естественно, без добавления отсутствующего в тексте слова «воинов».
- source_word: אָרְצָה
  choice: наземь
  rationale: Направительная форма слова «земля» буквально сохраняет образ падения поражённых людей на землю.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно высоким повествовательным регистром. Форма «сыны Вениамина» сохраняет племенную родословную формулу оригинала; «повергли наземь» передаёт военный смысл וַיַּשְׁחִיתוּ и не опускает אָרְצָה.
