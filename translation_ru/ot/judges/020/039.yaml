base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
translation:
  language: ru
  text: 'Тогда израильтяне развернулись в бою, а вениамитяне начали разить израильтян насмерть — около тридцати человек[a], — ведь они говорили: «Израиль наверняка разбит перед нами[b], как в первом сражении».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «начали поражать убитых среди людей Израиля — около тридцати человек». Это краткое древнееврейское выражение описывает нанесение смертельных потерь в бою.'
    reason: lexical_alternative
  - marker: b
    text: 'В древнееврейском тексте употреблено единственное число: «он разбит»; вероятно, имеется в виду Израиль как единое целое. Возможный перевод: «они наверняка разбиты перед нами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ אִישׁ יִשְׂרָאֵל
  choice: израильтяне развернулись
  rationale: Глагол обозначает поворот или разворот в ходе боя, а форма «муж Израиля» имеет собирательное значение. Такой перевод естественно передаёт военное действие и коллективный субъект.
- source_word: וּבִנְיָמִן
  choice: вениамитяне
  rationale: Название колена метонимически обозначает его воинов; в русском тексте обозначение людей яснее, чем буквальное «Вениамин».
- source_word: לְהַכּוֹת חֲלָלִים
  choice: разить … насмерть
  rationale: Сочетание буквально и сжато говорит о нанесении смертельных потерь. «Разить насмерть» сохраняет военный характер действия и избегает неестественного «поражать убитых».
- source_word: כִּשְׁלֹשִׁים אִישׁ
  choice: около тридцати человек
  rationale: Префикс כְּ выражает приблизительность; данная формулировка естественна для современного русского языка.
- source_word: נִגּוֹף נִגָּף הוּא
  choice: Израиль наверняка разбит
  rationale: Инфинитив абсолютный при личной форме усиливает утверждение. Собирательный субъект передан словом «Израиль», что позволяет сохранить единственное число и избежать неясного местоимения «он».
- source_word: לְפָנֵינוּ
  choice: перед нами
  rationale: Сохранён пространственно-идиоматический образ исходного текста, который в военном контексте означает поражение от противника.
