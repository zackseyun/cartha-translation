base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
translation:
  language: ru
  text: 'Тогда сыны Израиля поднялись и плакали перед Яхве до вечера. Они вопросили Яхве: «Продолжать ли мне вступать в битву с сынами Вениамина, моего брата?[a]» Яхве ответил: «Выступайте против него».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Снова ли мне вступить в битву против сынов Вениамина, моего брата?» Еврейская конструкция может обозначать как продолжение, так и повторение действия; предлог עִם буквально означает «с», но в контексте битвы может пониматься как «против».'
    reason: лексическая неоднозначность
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: поднялись
  rationale: Сохраняет направительное значение עלה, не уточняя, к какому именно возвышенному месту или святилищу они поднялись.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Передаёт семейно-корпоративный образ еврейского выражения и согласуется с последующим обозначением Вениамина как брата.
- source_word: וַיִּבְכּוּ
  choice: плакали
  rationale: Естественно передаёт продолжительный плач и скорбь перед Богом.
- source_word: לִפְנֵי יְהוָה
  choice: перед Яхве
  rationale: Прямо передаёт לִפְנֵי и сохраняет личное имя Бога, обозначенное тетраграмматоном.
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: вопросили Яхве
  rationale: Глагол с предлогом ב здесь означает обращение к Богу за решением; «вопросили» передаёт этот смысл точнее, чем нейтральное «спросили».
- source_word: הַאוֹסִיף
  choice: продолжать ли мне
  rationale: Конструкция с יסף допускает значение продолжения либо повторения действия. Основной текст выбирает «продолжать», а первое лицо единственного числа сохраняет коллективное самовыражение Израиля.
- source_word: לָגֶשֶׁת לַמִּלְחָמָה
  choice: вступать в битву
  rationale: Естественное русское военное выражение передаёт приближение с целью сражения без ненужной буквальности.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: с сынами Вениамина
  rationale: Предлог עִם формально означает «с»; в сочетании «вступать в битву с» русский текст ясно выражает враждебное столкновение.
- source_word: אָחִי
  choice: моего брата
  rationale: Сохраняет единственное число и первое лицо, а также напряжение между военным конфликтом и признанием родства с Вениамином.
- source_word: עֲלוּ אֵלָיו
  choice: выступайте против него
  rationale: Множественное повеление и единственное местоимение сохранены; в военном контексте אֶל имеет направленно-враждебный смысл.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное заветное имя, не подменяя его титулом.
- issue: Число говорящего в вопросе
  choice: 'первое лицо единственного числа: «мне»'
  alternative: 'первое лицо множественного числа: «нам»'
  rationale: Хотя вопрос задают сыны Израиля, еврейская форма אָחִי недвусмысленно содержит суффикс первого лица единственного числа, а вся реплика представляет Израиль как единого корпоративного говорящего. Сглаживание во множественное число устранило бы значимое напряжение текста.
- issue: Родственная характеристика Вениамина
  choice: «Вениамина, моего брата»
  alternative: «моих братьев, сынов Вениамина»
  rationale: Еврейский текст имеет единственное אָחִי («мой брат»). Оно подчёркивает корпоративное родство Израиля и Вениамина посреди межплеменной войны.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. «Сыны Израиля» и «вопросили» сохраняют достоинство и корпоративно-сакральный оттенок оригинала, не перегружая текст архаизмами. Необычный переход от множественного повествования к единственному числу в прямой речи сохранён намеренно.
