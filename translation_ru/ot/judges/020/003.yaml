  yaml_path: translation/ot/judges/020/003.yaml
  text: The sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
translation:
  language: ru
  text: 'Сыны Вениамина[a] услышали, что сыны Израиля поднялись в Мицпу. И сказали сыны Израиля: «Расскажите, как случилось это зло[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вениамитяне» и «израильтяне». В еврейском тексте здесь повторяются выражения «сыны Вениамина» и «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «это злодеяние» или «эта неправда». Еврейское слово содержит сильную нравственную оценку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: услышали
  rationale: В повествовательном контексте שׁמע означает, что до них дошла весть; «услышали» прямо передаёт глагол и не добавляет отсутствующего в еврейском тексте наречия времени.
- source_word: בְּנֵי בִנְיָמִן / בְּנֵי יִשְׂרָאֵל
  choice: сыны Вениамина / сыны Израиля
  rationale: Сохранена повторяющаяся еврейская конструкция и её параллелизм. Более привычные обозначения народов вынесены в примечание.
- source_word: כִּי עָלוּ
  choice: что … поднялись
  rationale: עלה буквально обозначает движение вверх; «поднялись» сохраняет пространственный образ, не подменяя его толкованием «собрались».
- source_word: הַמִּצְפָּה
  choice: в Мицпу
  rationale: Название места передано современной русской транслитерацией; еврейский артикль перед именем собственным отдельно не воспроизводится.
- source_word: וַיֹּאמְרוּ
  choice: И сказали
  rationale: Сохранено общее значение אמר; перевод «спросили» излишне уточнял бы речевой акт.
- source_word: דַּבְּרוּ
  choice: Расскажите
  rationale: Императив «говорите» здесь требует изложения случившегося; «расскажите» естественно передаёт эту функцию без добавления выраженного объекта.
- source_word: אֵיכָה נִהְיְתָה
  choice: как произошло
  rationale: 'Сочетание вопросительного слова с היה имеет событийное значение: речь идёт о том, как случилось или возникло описываемое зло.'
- source_word: הָרָעָה הַזֹּאת
  choice: это зло
  rationale: רָעָה в данном контексте несёт сильную нравственную оценку. «Зло» сохраняет широту слова и не сводит его ни к бедствию, ни к одному конкретному преступлению.
