base_translation:
  language: en
  yaml_path: translation/ot/judges/020/022.yaml
  text: But the people[a], the men of Israel, strengthened themselves and again drew up for battle in the place where they had drawn up on the first day.
translation:
  language: ru
  text: Но народ Израиля ободрился[a] и снова выстроился к бою на том месте, где он выстроился в первый день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «укрепился». Еврейский глагол может обозначать вновь обретённую решимость после поражения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: укрепился духом
  rationale: Порода хитпаэль глагола חזק здесь обозначает, что после поражения народ вновь обрёл внутреннюю стойкость и решимость. Выражение естественно по-русски и сохраняет возвратно-непереходный оттенок.
- source_word: הָעָם אִישׁ יִשְׂרָאֵל
  choice: народ — израильтяне
  rationale: Аппозитивная конструкция сочетает собирательное «народ» с обозначением израильских мужчин. Русское «израильтяне» в данном военном контексте относится к сражавшимся мужчинам и позволяет передать оба элемента без тяжеловесного «мужи Израиля».
- source_word: וַיֹּסִפוּ
  choice: снова
  rationale: В сочетании с инфинитивом יסף выражает повторение действия после предшествующего поражения.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: выстроился для битвы
  rationale: ערך с מלחמה означает построение боевого порядка, а не просто общую подготовку к войне. Единственное число согласовано с собирательным «народ».
- source_word: בַּמָּקוֹם
  choice: на том же месте
  rationale: Контекст и последующее относительное предложение указывают на возвращение к прежнему месту построения; «том же» естественно передаёт эту анафорическую связь.
- source_word: אֲשֶׁר עָרְכוּ שָׁם
  choice: где они выстраивались
  rationale: Повтор корня ערך сохранён повтором глагола «выстраиваться»; местоимение во множественном числе естественно указывает на отдельных людей, составляющих собирательный «народ».
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: в первый день
  rationale: Прямое и естественное обозначение дня предыдущего боевого построения.
