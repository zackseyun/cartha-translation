lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: собрались
  rationale: Нифаль глагола אסף здесь выражает совместное собирание множества людей. Русская возвратная форма естественно передаёт этот смысл без неуклюжего пассива.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: все мужчины Израиля
  rationale: Сочетание имеет собирательно-распределительное значение и в контексте военного ополчения обозначает именно мужчин, а не весь народ без различия пола.
- source_word: אֶל הָעִיר
  choice: к городу
  rationale: Предлог אֶל прежде всего обозначает направленность движения. Хотя контекст предполагает враждебный поход против Гивы, сама фраза не выражает этого явно, поэтому сохранено более точное «к городу».
- source_word: כְּאִישׁ אֶחָד
  choice: как один человек
  rationale: Устойчивый образ подчёркивает полное единство действий. В современном русском «как один человек» звучит естественно и сохраняет образ оригинала.
- source_word: חֲבֵרִים
  choice: сплотившись
  rationale: Слово от корня חבר добавляет значение соединённости и солидарности. Деепричастие естественно связывает эту характеристику с собранием и не превращает её в отдельное обозначение «товарищи» или «союзники».
