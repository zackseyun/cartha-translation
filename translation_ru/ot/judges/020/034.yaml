base_translation:
  language: en
  yaml_path: translation/ot/judges/020/034.yaml
  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: ru
  text: И десять тысяч отборных воинов со всего Израиля подошли к Гиве с противоположной стороны. Битва была ожесточённой, но они не знали, что бедствие надвигалось на них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что бедствие настигало их». Буквально: «что бедствие касалось» или «достигало их».'
    reason: Передаёт образное и лексически неоднозначное употребление נגע («касаться, достигать») в сочетании с הָרָעָה («бедствие»).
lexical_decisions:
- source_word: מִנֶּגֶד לַגִּבְעָה
  choice: выступили против Гивы
  rationale: מִנֶּגֶד буквально указывает на положение напротив или перед чем-либо, однако в контексте сражения вся фраза описывает движение войска против Гивы. Такой перевод естественен по-русски и сохраняет военный смысл.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר
  choice: десять тысяч отборных воинов
  rationale: בָּחוּר в данном военном контексте обозначает отобранных, лучших бойцов; слово «воинов» естественно передаёт собирательное אִישׁ при числительном.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: со всего Израиля
  rationale: Фраза означает, что воины были собраны из всего Израиля; выбранная формулировка современна и точна.
- source_word: וְהַמִּלְחָמָה כָּבֵדָה
  choice: Битва была жестокой
  rationale: כָּבֵד здесь передаёт тяжесть и ожесточённость боя, а не буквальный физический вес.
- source_word: וְהֵם לֹא יָדְעוּ
  choice: но они не знали
  rationale: Союз ו допускает контекстуальное противопоставление. Местоимение «они» сохраняет референциальную сжатость еврейского текста и не добавляет прямо не названного здесь субъекта.
- source_word: כִּי נֹגַעַת עֲלֵיהֶם הָרָעָה
  choice: что беда уже подступала к ним
  rationale: הָרָעָה здесь означает бедствие или несчастье, а נֹגַעַת — его приближение или достижение людей. «Подступала к ним» естественно передаёт надвигающуюся и уже близкую беду, не превращая её в нравственное зло.
