source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֜ל הִתְפָּֽקְד֗וּ לְ/בַד֙ מִ/בִּנְיָמִ֔ן אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֖ישׁ שֹׁ֣לֵֽף חָ֑רֶב כָּל זֶ֖ה אִ֥ישׁ מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/017.yaml
  text: And the men of Israel[a], apart from Benjamin, were mustered at four hundred thousand men drawing the sword[c][b]; all these were men of war.
translation:
  language: ru
  text: 'А мужчины Израиля, не считая Вениамина, были исчислены[a]: четыреста тысяч человек, обнажающих меч[b]; все они были воинами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были собраны для смотра»; еврейский глагол может означать подсчёт или военный сбор.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «обнажающих меч» — еврейское выражение, обозначающее вооружённых воинов.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: А мужчины Израиля
  rationale: Существительное אִישׁ формально стоит в единственном числе, но при глаголе во множественном числе имеет собирательное значение и обозначает способных воевать мужчин Израиля.
- source_word: הִתְפָּקְדוּ
  choice: были исчислены
  rationale: В военном контексте форма хитпаэль от פקד может обозначать подсчёт или смотр войска. «Были исчислены» сохраняет неоднозначность между переписью и военным учётом; альтернативный оттенок отмечен в сноске.
- source_word: לְבַד מִבִּנְיָמִן
  choice: не считая Вениамина
  rationale: Оборот ясно исключает колено Вениамина из приведённого общего числа и естественно звучит по-русски.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ
  choice: четыреста тысяч человек
  rationale: Перевод сохраняет явно выраженное אִישׁ после числительного и не добавляет отсутствующее в этой части фразы слово «воинов».
- source_word: שֹׁלֵף חָרֶב
  choice: обнажающих меч
  rationale: Сохранён образный еврейский военный оборот, буквально связанный с извлечением меча; он означает вооружённых, боеспособных мужчин.
- source_word: כָּל זֶה אִישׁ מִלְחָמָה
  choice: все они были воинами
  rationale: Идиоматичный русский перевод передаёт собирательное כָּל זֶה и военное обозначение אִישׁ מִלְחָמָה без архаичного оборота «мужи войны».
