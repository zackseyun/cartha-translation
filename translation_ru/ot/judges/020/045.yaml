base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
translation:
  language: ru
  text: Тогда они повернули и побежали к пустыне, к скале Риммон. На дорогах из них перебили пять тысяч человек[a], преследовали их до Гидома и убили из них две тысячи человек[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский глагол буквально связан с образом подбирания оставшегося после жатвы; здесь это образ уничтожения уцелевших или отставших беглецов.
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте в выражениях «за ним» и «из него» употреблено единственное число: бегущие вениамитяне представлены как одна группа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ וַיָּנֻסוּ
  choice: они повернули и побежали
  rationale: Глаголы обозначают перемену направления и бегство; «побежали» в данном военном контексте естественно передаёт נוס, не уточняя сверх текста, что они повернули назад.
- source_word: הַמִּדְבָּרָה
  choice: к пустыне
  rationale: Направительный суффикс выражает движение в сторону пустыни; русский предлог «к» сохраняет эту направленность.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: к скале Риммон
  rationale: סֶלַע передано как «скала», а Риммон — как собственное имя места.
- source_word: וַיְעֹלְלֻהוּ
  choice: перебили
  rationale: Глагол буквально вызывает образ подбирания остатков после жатвы, но здесь идиоматически означает уничтожение уцелевших или отставших воинов. «Перебили» ясно передаёт смысл, а метафора отмечена в сноске.
- source_word: בַּמְסִלּוֹת
  choice: на дорогах
  rationale: מְסִלּוֹת обозначает проложенные или поднятые дороги; нейтральное «дороги» естественно для древнего повествования и не вызывает современных ассоциаций с автомагистралями.
- source_word: חֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: пять тысяч человек
  rationale: Буквальное и обычное русское обозначение численности; «воинов» было бы контекстуальным уточнением.
- source_word: וַיַּדְבִּיקוּ אַחֲרָיו
  choice: их преследовали
  rationale: Форма דבק в данной конструкции означает неотступное преследование или погоню вслед за кем-либо. Русское множественное местоимение естественно передаёт коллективного референта единственного суффикса.
- source_word: עַד גִּדְעֹם
  choice: до самого Гидома
  rationale: עַד указывает предел погони; «до самого» естественно подчёркивает пространственную границу, не добавляя интенсивности преследованию.
- source_word: וַיַּכּוּ מִמֶּנּוּ אַלְפַּיִם אִישׁ
  choice: убили ещё две тысячи человек
  rationale: נכה в боевом контексте означает поразить насмерть. «Ещё» делает по-русски явным последовательное прибавление второй группы потерь, следующее из контекста, хотя отдельного соответствующего слова в еврейском нет.
