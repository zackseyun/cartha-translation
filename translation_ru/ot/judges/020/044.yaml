  source_fidelity: 'Текст точно передаёт еврейский порядок смыслов: гибель восемнадцати тысяч принадлежащих к Вениамину и итоговую характеристику всей этой группы как אַנְשֵׁי־חָיִל. «Пало» уместно сохраняет обычный для библейского военного повествования смысл נפל, не добавляя явно «были убиты». «Из колена Вениамина» — ясная и контекстуально оправданная передача племенной принадлежности.'
