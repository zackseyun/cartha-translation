lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: пало
  rationale: Глагол נפל буквально означает «пасть» и в контексте сражения указывает на гибель. Русское «пало» сохраняет военную образность и не требует поясняющего добавления «убитыми».
- source_word: מִבִּנְיָמִן
  choice: из колена Вениамина
  rationale: Предлог מִן обозначает принадлежность к Вениамину. В современном русском уточнение «колена» естественно передаёт племенную принадлежность и устраняет возможное восприятие Вениамина как отдельного человека в этой сцене.
- source_word: שְׁמֹנָה עָשָׂר אֶלֶף אִישׁ
  choice: восемнадцать тысяч человек
  rationale: Существительное אִישׁ после числительного явно представлено словом «человек»; более узкое «воинов» оставлено для следующего выражения.
- source_word: אֶת כָּל אֵלֶּה
  choice: все они
  rationale: Заключительная конструкция обобщает ранее названных погибших. «Все они» естественно по-русски связывает приложение с предшествующей группой.
- source_word: אַנְשֵׁי חָיִל
  choice: доблестными воинами
  rationale: В военном контексте выражение обозначает мужественных, боеспособных людей. «Доблестные воины» передаёт и доблесть, и боевую роль без архаизации.
