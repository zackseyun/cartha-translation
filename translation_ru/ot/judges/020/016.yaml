base_translation:
  language: en
  yaml_path: translation/ot/judges/020/016.yaml
  text: From all this people[a], seven hundred chosen men were left-handed; every one of these could sling a stone at a hair and not miss.
translation:
  language: ru
  text: Из всего этого народа семьсот отборных мужчин были левшами[a]. Каждый из них мог метнуть камень из пращи в волос и не промахнуться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с ограниченной правой рукой»; вероятно, это означает, что они сражались левой рукой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  choice: Из всего этого народа
  rationale: Передаёт партитивное значение предлога מִן и сохраняет широкое значение עָם, не сужая его до «войска».
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  choice: семьсот отборных мужчин
  rationale: בָּחוּר обозначает отобранных, лучших людей; «отборных» естественно передаёт это значение в военном контексте без добавления слова «воинов».
- source_word: אִטֵּר יַד יְמִינוֹ
  choice: владевших левой рукой
  rationale: Идиома буквально говорит об ограниченности правой руки, но в данном военном контексте указывает на умение действовать левой. Перевод сохраняет этот смысл и звучит естественно по-русски; буквальная форма отмечена в сноске.
- source_word: כָּל זֶה
  choice: Каждый из них
  rationale: Передаёт распределительное значение выражения и подчёркивает мастерство каждого из семисот.
- source_word: קֹלֵעַ בָּאֶבֶן
  choice: мог метнуть камень из пращи
  rationale: Причастие описывает постоянное умение, а не единичное действие; упоминание пращи проясняет способ метания, заложенный в глаголе קלע.
- source_word: אֶל הַשַּׂעֲרָה
  choice: в волос
  rationale: Сохраняет конкретный образ крайней точности, выраженный единственным числом существительного שַׂעֲרָה.
- source_word: וְלֹא יַחֲטִא
  choice: и не промахнуться
  rationale: В этом контексте חטא имеет конкретное значение «не попасть в цель, промахнуться», а не нравственное значение «согрешить».
