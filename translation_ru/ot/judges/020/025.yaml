base_translation:
  language: en
  yaml_path: translation/ot/judges/020/025.yaml
  text: Benjamin came out from Gibeah to meet them on the second day[a], and they struck down another eighteen thousand men of Israel to the ground[b]; all these were drawing the sword.
translation:
  language: ru
  text: Во второй день Вениамин вышел из Гивы навстречу им[a] и сразил ещё восемнадцать тысяч мужей израильтян, так что они пали на землю; все они были обнажавшими меч.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против них»; в военном контексте это еврейское выражение может обозначать враждебное выступление навстречу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Обычное повествовательное значение יצא; русское «вышел» естественно сочетается с указанием исходного пункта «из Гивы».
- source_word: לִקְרָאתָם
  choice: навстречу им
  rationale: Сохраняет основное значение выражения, тогда как военный контекст ясно придаёт встрече враждебный характер.
- source_word: מִן הַגִּבְעָה
  choice: из Гивы
  rationale: Прямо передаёт исходный пункт движения и традиционно транслитерирует топоним.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: во второй день
  rationale: Точно передаёт еврейское порядковое числительное, не заменяя его контекстуальным «на следующий день».
- source_word: וַיַּשְׁחִיתוּ
  choice: поверг ... на землю
  rationale: В военном контексте Hiphil от שׁחת означает губительное поражение; вместе с אָרְצָה оборот передаёт смертельное поражение и сохраняет образ падения на землю.
- source_word: בִבְנֵי יִשְׂרָאֵל
  choice: израильтян
  rationale: Естественный современный русский эквивалент национального обозначения «сыны Израиля»; предлог ב здесь отмечает поражённую группу.
- source_word: עוֹד
  choice: снова
  rationale: Передаёт повторение потерь после предыдущего дня; в данном порядке слов звучит естественнее, чем «ещё восемнадцать тысяч».
- source_word: שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ
  choice: восемнадцать тысяч израильтян
  rationale: Число передано точно; отдельное «мужчин» в русском избыточно при военном контексте и последующей характеристике.
- source_word: אָרְצָה
  choice: на землю
  rationale: Передаёт направительную форму существительного ארץ и боевой образ поверженных.
- source_word: כָּל אֵלֶּה שֹׁלְפֵי חָרֶב
  choice: все они обнажали меч
  rationale: Сохраняет собирательное единственное «меч» и активный причастный образ людей, извлекающих оружие из ножен.
