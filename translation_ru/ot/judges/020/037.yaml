  text: Then the men in ambush quickly rushed against Gibeah[a], and the ambush advanced and struck the whole city with the edge of the sword.
translation:
  language: ru
  text: Тогда сидевшие в засаде поспешно устремились на Гиву, и засадный отряд двинулся дальше[a] и поразил весь город лезвием меча.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «засада потянула». Это необычное выражение может означать, что засадный отряд вытянулся вперёд или продолжил продвижение в город.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  choice: сидевшие в засаде / засадный отряд
  rationale: Существительное обозначает засаду как собирательную военную силу. В первой части множественное число глаголов естественно передано личным оборотом «сидевшие в засаде», а последующие формы единственного числа — выражением «засадный отряд».
- source_word: הֵחִישׁוּ
  choice: поспешно
  rationale: Форма выражает быстроту и спешку действий; наречие естественно сочетается с последующим глаголом военного движения.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: устремились на
  rationale: В повествовании о сражении глагол описывает стремительное наступление или нападение по направлению к городу. «Устремились на» передаёт и направленность, и наступательный характер действия.
- source_word: הַגִּבְעָה
  choice: Гиву
  rationale: Название города передано принятой русской библейской формой «Гива» с требуемым винительным падежом.
- source_word: וַיִּמְשֹׁךְ
  choice: продвинулся вперёд
  rationale: Буквально глагол означает «тянуть», однако здесь, вероятно, описывает дальнейшее выдвижение засадного отряда. Необычность и неоднозначность выражения отмечены в сноске.
- source_word: וַיַּךְ
  choice: поразил
  rationale: Широкое значение глагола «ударить, поразить» уточняется следующим оборотом о мече; такой перевод не добавляет сверх текста прямого указания только на жителей.
- source_word: כָּל הָעִיר
  choice: весь город
  rationale: Сохранён древнееврейский собирательный оборот, относящий поражение к городу в его целостности, без молчаливой замены на «всех жителей».
- source_word: לְפִי חָרֶב
  choice: остриём меча
  rationale: Устойчивый древнееврейский образ буквально говорит об «устах меча». Русское «остриём меча» сохраняет образ оружия и ясно передаёт смертоносный способ поражения.
