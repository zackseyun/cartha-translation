base_translation:
  language: en
  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
translation:
  language: ru
  text: Сыны Вениамина вышли навстречу народу[a], и их выманили из города[b]. Они стали, как и прежде[c], поражать некоторых из народа, убивая их, на дорогах — одна из которых ведёт к Вефилю, а другая — к Гиве через открытую местность[d], — около тридцати израильтян.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вениамитяне». Буквально: «сыны Вениамина».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «они отошли от города», «их оттянули от города» или «их выманили из города». Смысл в том, что они удалились от защиты города.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально идиома сопоставляет это нападение с прежними сражениями; возможный перевод: «как в предыдущие разы».'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «через поле» либо «в поле». Вероятно, выражение указывает на дорогу, проходившую по открытой местности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: вышли
  rationale: Обычный глагол движения из города; русское «вышли» естественно передаёт точку отправления.
- source_word: בְנֵי בִנְיָמִן
  choice: сыны Вениамина
  rationale: Сохраняет еврейское родовое обозначение и при этом соответствует достоинству библейского повествования; возможное смысловое соответствие — «вениамитяне».
- source_word: לִקְרַאת הָעָם
  choice: навстречу народу
  rationale: עָם буквально означает «народ», хотя в данном военном контексте речь идёт об израильском ополчении.
- source_word: הָנְתְּקוּ מִן הָעִיר
  choice: их отвлекли от города
  rationale: Передаёт пассивный смысл и тактическое удаление вениамитян от защищённого города, не уточняя прямо, каким способом это было сделано.
- source_word: וַיָּחֵלּוּ לְהַכּוֹת
  choice: они стали поражать
  rationale: Передаёт начало действия и военное значение נכה; последующее «насмерть» выражает смысл חֲלָלִים.
- source_word: חֲלָלִים
  choice: насмерть
  rationale: Слово обозначает павших или убитых; наречное выражение устраняет неестественную для русского языка конструкцию, сохраняя смертельный исход.
- source_word: כְּפַעַם בְּפַעַם
  choice: как и прежде
  rationale: Естественно передаёт идиоматическое сопоставление с двумя предыдущими сражениями.
- source_word: בַּמְסִלּוֹת
  choice: на дорогах
  rationale: מסלה обозначает проложенную, иногда поднятую дорогу; нейтральное «дороги» естественно в данном древнем географическом контексте.
- source_word: אַחַת עֹלָה בֵית אֵל
  choice: одна из них ведёт к Вефилю
  rationale: Топографическое עלה буквально указывает на подъём, но «ведёт к» по-русски естественно описывает направление дороги, не отрицая подъёма.
- source_word: וְאַחַת גִּבְעָתָה בַּשָּׂדֶה
  choice: а другая к Гиве через открытую местность
  rationale: Передаёт направление к Гиве и вероятную топографическую функцию בַשָּׂדֶה как указания на маршрут вне застройки.
- source_word: כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל
  choice: около тридцати израильтян
  rationale: Кратко и естественно передаёт приблизительное число мужчин из Израиля.
