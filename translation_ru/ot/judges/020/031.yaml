  source_fidelity: 'В целом переданы движение вениамитян, их удаление от города, начало нападения, прежний образ действий, дороги и приблизительное число убитых. Однако «и убили около тридцати израильтян» излишне преобразует синтаксис исходника: еврейское «около тридцати мужей в Израиле» является дополнением к «стали поражать [как павших/убитыми]», а не отдельным, завершённым действием. Кроме того, «поражать людей насмерть» вместе с последующим «убили» создаёт ненужное дублирование.'
  naturalness: '«Их отвлекли от города» в русском обычно означает переключение внимания, а не тактическое выманивание или оттягивание. «Стали ... поражать людей насмерть» также тяжеловесно и сочетается с последующим повтором «убили». Более естественно: «стали поражать некоторых из народа, убивая их».'
  terminology: Имена «Вениамин», «Вефиль» и «Гива» переданы последовательно. «Сыны Вениамина» сохраняет исходное племенное обозначение. «Народ» допустим для הָעָם, хотя контекстно это израильское войско. Следует сохранить примечания, но привязать их к соответствующим словам, а не к концу всей сложной географической конструкции.
