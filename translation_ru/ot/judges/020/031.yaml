revisions:
- from: Сыны Вениамина вышли навстречу народу[a], и их отвлекли от города[b]. Они стали, как и прежде[c], поражать людей насмерть на дорогах — одна из них ведёт к Вефилю, а другая к Гиве через открытую местность[d], — и убили около тридцати израильтян.
  to: Сыны Вениамина вышли навстречу народу[a], и их выманили из города[b]. Они стали, как и прежде[c], поражать некоторых из народа, убивая их, на дорогах — одна из которых ведёт к Вефилю, а другая — к Гиве через открытую местность[d], — около тридцати израильтян.
  rationale: 'Исправлены два существенных для русского перевода места: тактическое удаление от города передано не как отвлечение внимания, а как выманивание; описание убийств приведено к единой конструкции без смыслового повтора. Сохранены исходная неопределённость формы הָנְתְּקוּ, образный порядок повествования, географические указания и все четыре сноски.'
