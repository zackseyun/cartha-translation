lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: поставил
  rationale: Глагол שׂוּם означает «класть, ставить, помещать»; в военном контексте «поставил» естественно передаёт размещение людей на позиции.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Имя употреблено собирательно и обозначает израильское войско; сохранена форма оригинала без поясняющей конкретизации.
- source_word: אֹרְבִים
  choice: людей в засаде
  rationale: Причастие от ארב обозначает людей, лежащих в ожидании нападения. Перевод сохраняет личное значение, а не превращает их в отвлечённую «засаду».
- source_word: אֶל ... סָבִיב
  choice: вокруг
  rationale: Сочетание предлога אֶל с наречием סָבִיב в данном контексте указывает на расположение засадных сил по отношению к городу; «вокруг» естественно передаёт общий пространственный смысл.
- source_word: הַגִּבְעָה
  choice: Гивы
  rationale: Топоним הַגִּבְעָה традиционно передаётся по-русски как «Гива»; родительный падеж обусловлен предлогом «вокруг».
