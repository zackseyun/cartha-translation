  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י בִנְיָמִ֔ן נִגָּפִ֥ים הֵ֛ם לְ/פָנֵ֖י/נוּ כְּ/בָ/רִאשֹׁנָ֑ה וּ/בְנֵ֧י יִשְׂרָאֵ֣ל אָמְר֗וּ נָנ֨וּסָה֙ וּֽ/נְתַקְּנֻ֔/הוּ מִן הָ/עִ֖יר אֶל הַֽ/מְסִלּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
translation:
  language: ru
  text: 'И сказали сыны Вениамина: «Они терпят поражение перед нами, как и прежде[a]». А сыны Израиля сказали: «Побежим и оттянем их[b] от города к большим дорогам[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть как в предыдущих сражениях, описанных в этой главе.
    reason: cross_reference
  - marker: b
    text: 'Буквально в еврейском: «оттянем его»; единственное число, вероятно, собирательно обозначает Вениамина или его войско.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «к главным дорогам». Еврейское слово может обозначать устроенные или большие дороги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגָּפִים
  choice: терпят поражение
  rationale: Страдательное причастие в военном контексте обозначает, что израильтян поражают в бою. Настоящее время передаёт незавершённость действия, а выражение сохраняет военный смысл без чрезмерной конкретизации как гибели.
- source_word: לְפָנֵינוּ
  choice: перед нами
  rationale: 'Естественно передаёт пространственно-военную идиому: противник терпит поражение перед лицом воинов Вениамина, то есть от их натиска.'
- source_word: כְּבָרִאשֹׁנָה
  choice: как и прежде
  rationale: Фраза отсылает к предыдущим столкновениям в этой главе. По-русски «как и прежде» естественнее буквального «как в первый раз» и не уточняет сверх текста, о каком именно сражении идёт речь.
- source_word: נָנוּסָה
  choice: побежим
  rationale: Форма когортатива выражает совместное намерение или призыв. «Побежим» сохраняет прямой смысл бегства и не вводит более специального значения «отступим».
- source_word: וּנְתַקְּנֻהוּ
  choice: и оттянем их
  rationale: Глагол נתק здесь выражает удаление или отведение вражеских сил от города. «Оттянем» естественно звучит в военном контексте и не добавляет явно не выраженного значения обмана.
- source_word: הוּא suffix in וּנְתַקְּנֻהוּ
  choice: их
  rationale: В еврейском стоит местоименный суффикс 3-го лица мужского рода единственного числа, вероятно коллективно обозначающий Вениамина или его войско. Русское множественное «их» ясно соотносится с сынами Вениамина и передаёт смысл контекста.
- source_word: הָעִיר
  choice: города
  rationale: Обычное значение עִיר; в контексте имеется в виду город Гива.
- source_word: הַמְסִלּוֹת
  choice: большим дорогам
  rationale: מְסִלָּה может обозначать устроенную, главную или поднятую дорогу. «Большие дороги» понятно современному читателю и отличает их от малых путей, не вызывая современных ассоциаций со скоростными автомагистралями.
