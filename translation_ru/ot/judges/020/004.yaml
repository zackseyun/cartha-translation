  text: וַ/יַּ֜עַן הָ/אִ֣ישׁ הַ/לֵּוִ֗י אִ֛ישׁ הָ/אִשָּׁ֥ה הַ/נִּרְצָחָ֖ה וַ/יֹּאמַ֑ר הַ/גִּבְעָ֨תָ/ה֙ אֲשֶׁ֣ר לְ/בִנְיָמִ֔ן בָּ֛אתִי אֲנִ֥י וּ/פִֽילַגְשִׁ֖/י לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
translation:
  language: ru
  text: 'Тогда левит, муж женщины, которую убили, ответил: «Я пришёл со своей наложницей в Гиву, принадлежащую Вениамину[a], чтобы переночевать».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «находящуюся во владениях Вениамина».'
    reason: Еврейское אֲשֶׁר לְבִנְיָמִן может обозначать как принадлежность Гивы Вениамину, так и её расположение на территории колена Вениамина.
lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Обычная повествовательная формула введения ответа; сохраняет еврейскую идиому, хотя непосредственно перед этим вопрос не приведён.
- source_word: הָאִישׁ הַלֵּוִי
  choice: левит
  rationale: Естественное и точное русское обозначение принадлежности говорящего к левитам; слово «человек» отдельно передавать не требуется.
- source_word: אִישׁ הָאִשָּׁה
  choice: муж женщины
  rationale: Сочетание буквально означает «мужчина женщины», но в данном контексте обозначает её мужа или постоянного партнёра. «Муж» естественно передаёт отношение, не устраняя напряжения с последующим словом «наложница».
- source_word: הַנִּרְצָחָה
  choice: которую убили
  rationale: Пассивное причастие от רצח указывает на насильственное, преступное лишение жизни. Формулировка ясна современному читателю и не звучит канцелярски.
- source_word: וַיֹּאמַר
  choice: ответил
  rationale: В русском нет необходимости дважды передавать сочетание «ответил и сказал»; один глагол естественно вводит прямую речь и охватывает функцию обеих еврейских формул.
- source_word: הַגִּבְעָתָה
  choice: в Гиву
  rationale: Направительный суффикс выражает движение к месту; русское «в Гиву» передаёт его естественно.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: принадлежащую Вениамину
  rationale: Фраза указывает на принадлежность или территориальную связь Гивы с коленом Вениамина; возможный территориальный оттенок сохранён в сноске.
- source_word: בָּאתִי אֲנִי וּפִילַגְשִׁי
  choice: я пришёл со своей наложницей
  rationale: Еврейская конструкция с глаголом первого лица единственного числа естественно понимается комитативно. Русская формулировка передаёт участие обоих без неестественного согласования.
- source_word: פִּילֶגֶשׁ
  choice: наложница
  rationale: Традиционный и точный эквивалент, обозначающий женщину во вторичном брачном союзе; не заменяется более интерпретирующим выражением «вторая жена».
- source_word: לָלוּן
  choice: чтобы переночевать
  rationale: Инфинитив выражает цель — остановиться на ночь; выбран современный и ясный русский оборот.
theological_decisions:
- issue: Соотношение обозначений «муж» и «наложница»
  choice: Сохранены оба обозначения без гармонизации.
  alternative: Передать אִישׁ как «мужчина» или פילגש как «вторая жена», чтобы сгладить кажущееся противоречие.
  rationale: Исходный текст сам называет левита «мужем» женщины, а её — его наложницей. Это социально-правовое напряжение следует сохранить, а не разрешать переводом.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного стиля. Двойная еврейская формула «ответил и сказал» сведена к естественному русскому «ответил». Сноска поставлена при неоднозначной фразе о связи Гивы с Вениамином.
