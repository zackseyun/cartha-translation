  yaml_path: translation/ot/judges/020/038.yaml
  text: The appointed sign between the men of Israel and the ambush was that they should make a great cloud of smoke rise from the city[a][b][c].
translation:
  language: ru
  text: Условленный знак между израильтянами и теми, кто находился в засаде, состоял в том, что они должны были поднять из города густой столб дыма[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «заранее установленным порядком» либо «согласованным сигналом». Еврейское מוֹעֵד часто означает назначенное время, но здесь относится к заранее условленному сигналу в бою.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для израильтян с засадой»; по смыслу речь идёт о договорённости между двумя сторонами.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «поднять из города большую массу дыма». Еврейское выражение обозначает хорошо заметный поднимающийся дымовой сигнал.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  choice: условленным знаком
  rationale: מוֹעֵד обычно обозначает назначенное время, место или встречу, но в данном военном контексте речь идёт о заранее согласованном сигнале. «Условленный знак» сохраняет идею предварительной договорённости.
- source_word: לְאִישׁ יִשְׂרָאֵל
  choice: между израильтянами
  rationale: Хотя לְ буквально означает «для/к», сочетание с עִם указывает на две стороны договорённости. «Израильтяне» здесь естественно обозначает участвующих в сражении воинов Израиля.
- source_word: עִם הָאֹרֵב
  choice: и теми, кто находился в засаде
  rationale: אֹרֵב — причастие со значением «подстерегающий, находящийся в засаде», употреблённое собирательно об отряде. Развёрнутая формулировка по-русски яснее, чем отвлечённое «засада» как сторона соглашения.
- source_word: הֶרֶב
  choice: большой
  rationale: Интенсивная форма от רבה усиливает последующее действие; в сочетании с дымом это передано прилагательным «большой».
- source_word: לְהַעֲלוֹתָם
  choice: они поднимут
  rationale: Hiphil от עלה означает «поднять, заставить подняться». Суффикс 3-го лица множественного числа указывает на исполнителей условленного сигнала.
- source_word: מַשְׂאַת הֶעָשָׁן
  choice: столб дыма
  rationale: מַשְׂאַת обозначает поднимающуюся массу или возвышение; здесь имеется в виду хорошо заметный дымовой сигнал. «Столб дыма» — естественное и наглядное русское соответствие.
- source_word: מִן הָעִיר
  choice: над городом
  rationale: Предлог מִן буквально указывает на исходную точку — «из города». В русском «поднять над городом» естественно описывает дым, исходящий из города, однако буквальная пространственная альтернатива сохранена в примечании.
