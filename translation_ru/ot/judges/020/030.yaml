  text: Then the sons of Israel went up against the sons of Benjamin on the third day[a], and they drew up against Gibeah as before.
translation:
  language: ru
  text: На третий день сыны Израиля пошли против сынов Вениамина[a] и, как и прежде, выстроились против Гивы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть израильтяне и вениамитяне; буквально: «сыны Израиля» и «сыны Вениамина».'
    reason: Лексическое пояснение родственных обозначений, сохранённых в основном тексте.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: пошли
  rationale: Глагол עלה буквально обозначает движение вверх, но в военном повествовании также выражает выступление в поход. «Пошли» естественно передаёт направленное военное движение, не добавляя отсутствующей в тексте подробности.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формальный перевод сохраняет родственное обозначение и его параллелизм с выражением «сыны Вениамина», подчёркивая конфликт внутри одного народа.
- source_word: אֶל בְּנֵי בִנְיָמִן
  choice: против сынов Вениамина
  rationale: Предлог אֶל обычно означает направление к кому-либо, однако военный контекст ясно указывает на враждебное выступление; по-русски это естественно выражается предлогом «против».
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: на третий день
  rationale: Обычный и точный русский эквивалент временного оборота.
- source_word: וַיַּעַרְכוּ
  choice: выстроились
  rationale: В военном контексте ערך означает расположить войска или построиться для сражения. «Выстроились» передаёт этот смысл кратко и современно.
- source_word: אֶל הַגִּבְעָה
  choice: против Гивы
  rationale: В сочетании с военным глаголом выражение обозначает построение войск для действий против города.
- source_word: כְּפַעַם בְּפָעַם
  choice: как и прежде
  rationale: Идиома означает повторение действий прежних разов; выбранный вариант естественен по-русски и сохраняет её обобщённый смысл.
