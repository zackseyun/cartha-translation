  yaml_path: translation/ot/judges/020/012.yaml
  text: So the tribes of Israel sent men through all the tribes of Benjamin[a], saying[b], “What is this evil that has happened among you?”
translation:
  language: ru
  text: 'И послали колена Израиля людей по всем коленам Вениамина[a], чтобы сказать: «Что это за зло[b], которое произошло среди вас?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ко всем коленам Вениамина». Еврейский предлог допускает как распределительное, так и направительное понимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «злодеяние»; «проступок».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: послали
  rationale: Обычное и точное соответствие глаголу שלח; передаёт отправку людей без добавления невыраженной в тексте роли посланников.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: колена Израиля
  rationale: Прямо передаёт форму множественного числа и коллективный субъект.
- source_word: אֲנָשִׁים
  choice: людей
  rationale: Еврейский текст буквально говорит о людях (мужчинах), не называя их представителями или посланниками; в данном контексте русское «людей» естественно и не добавляет должности.
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  choice: по всем коленам Вениамина
  rationale: 'Предлог בְּ понят дистрибутивно: отправленные должны были пройти по всем подразделениям Вениамина. Слово «коленам» сохраняет необычное множественное число исходного текста; возможное направительное понимание вынесено в сноску.'
- source_word: לֵאמֹר
  choice: сказать
  rationale: Инфинитив вводит содержание передаваемой речи; русское «сказать» здесь естественнее буквального «говоря».
- source_word: מָה הָרָעָה הַזֹּאת
  choice: Что это за зло
  rationale: Вопросительное מָה требует определения случившегося, а רָעָה обозначает нравственное зло или тяжкий проступок. Формула сохраняет указательное значение הַזֹּאת.
- source_word: אֲשֶׁר נִהְיְתָה
  choice: случившееся
  rationale: Нифаль глагола היה обозначает произошедшее событие; причастный оборот даёт естественную русскую конструкцию и сохраняет относительную связь.
- source_word: בָּכֶם
  choice: среди вас
  rationale: Передаёт совершение зла внутри общины Вениамина, не сводя выражение к личному внутреннему переживанию.
