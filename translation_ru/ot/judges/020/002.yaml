- from: И предводители всего народа[a], всех колен Израиля, заняли свои места в собрании народа Божьего — четыреста тысяч пеших воинов, обнаживших мечи.
  to: И предводители всего народа[a], всех колен Израиля, заняли свои места в собрании народа Божьего; там было четыреста тысяч пеших воинов с обнажёнными мечами.
  rationale: Сохранены все смысловые компоненты исходного текста и сноска к образному פִּנּוֹת. «Там было» только делает по-русски ясной связь общей численности с собранием, а «с обнажёнными мечами» естественно передаёт воинскую готовность, выраженную еврейским причастием, не добавляя сведений о способе или моменте извлечения оружия.
