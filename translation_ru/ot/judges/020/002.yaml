  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
translation:
  language: ru
  text: И предводители всего народа[a], всех колен Израиля, заняли свои места в собрании народа Божьего; там было четыреста тысяч пеших воинов с обнажёнными мечами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «углы всего народа» — образное выражение, означающее предводителей или видных людей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: заняли свои места
  rationale: Возвратная порода глагола передаёт намеренное занятие позиции; этот вариант естественен по-русски и сохраняет оттенок готовности, не сводя выражение к простому «стояли».
- source_word: פִּנּוֹת
  choice: предводители
  rationale: Буквально «углы»; здесь это образное обозначение видных людей, на которых держится народ. «Предводители» ясно передаёт руководящую роль без буквального, непонятного русскому читателю образа.
- source_word: כָּל הָעָם כֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: всего народа, всех колен Израиля
  rationale: Сохранено приложение, поясняющее, что под всем народом имеются в виду все колена Израиля.
- source_word: בִּקְהַל
  choice: в собрании
  rationale: קהל обозначает созванное собрание; «собрание» современно и не привносит специфически церковной окраски.
- source_word: עַם הָאֱלֹהִים
  choice: народа Божьего
  rationale: Формулировка сохраняет структуру еврейского сочетания и торжественное обозначение Израиля как народа, принадлежащего Богу.
- source_word: אִישׁ רַגְלִי
  choice: пеших воинов
  rationale: Естественный военный эквивалент буквального «мужей пеших», сохраняющий противопоставление конным воинам.
- source_word: שֹׁלֵף חָרֶב
  choice: обнаживших мечи
  rationale: Передаёт яркий образ извлечённого из ножен оружия. Русское множественное число естественно выражает распределительное значение еврейского единственного числа после общей численности.
theological_decisions:
- issue: Передача עַם הָאֱלֹהִים
  choice: народ Божий
  alternative: Божий народ
  rationale: Форма «народ Божий» сохраняет торжественность и близка к структуре оригинала, не добавляя конфессионально обусловленного толкования.
- issue: Соотношение предводителей и числа воинов
  choice: Сохранена сжатая конструкция оригинала с тире
  alternative: 'Добавить отдельный глагол: «там было четыреста тысяч…»'
  rationale: Еврейский текст синтаксически сжат и не разъясняет отдельно связь руководителей со всей численностью собрания; перевод не устраняет эту напряжённость добавленным пояснением.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Военная образность сохранена без архаизмов; приложение «всех колен Израиля» и синтаксическая сжатость исходного текста не устранены.
