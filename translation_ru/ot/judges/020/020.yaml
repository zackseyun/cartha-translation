base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
translation:
  language: ru
  text: Воины Израиля вышли на битву против вениамитян, и воины Израиля выстроились для битвы против них[a] к Гиве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выстроились с ними для битвы». Еврейское «с ними» в данном военном контексте может обозначать противостояние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышли
  rationale: В военном повествовании глагол יצא обозначает выход для участия в сражении; «вышли» естественно передаёт движение, не добавляя отсутствующей в тексте подробности о марше.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: воины Израиля
  rationale: Форма «муж Израиля» употреблена как собирательное обозначение израильского войска. «Воины Израиля» сохраняет мужскую военную референцию и звучит естественно в современном русском языке.
- source_word: לַמִּלְחָמָה
  choice: на битву
  rationale: Предложное сочетание указывает на цель выхода — участие в сражении. «На битву» кратко и идиоматично передаёт этот смысл.
- source_word: עִם בִּנְיָמִן
  choice: против вениамитян
  rationale: Хотя עִם обычно означает «с», в контексте войны оно выражает столкновение сторон. Имя Вениамин здесь обозначает всё колено; множественное «вениамитян» также согласуется с последующим местоимением множественного числа.
- source_word: וַיַּעַרְכוּ
  choice: выстроились
  rationale: Глагол ערך в военном контексте означает расположить или построить войска в боевой порядок. Возвратное «выстроились» естественно передаёт действие войска.
- source_word: אִתָּם
  choice: против них
  rationale: Предлог с местоимением буквально допускает значение «с ними», однако военный контекст указывает на противостояние. Основной текст делает этот смысл ясным, а примечание сохраняет форму возможной более буквальной передачи.
- source_word: מִלְחָמָה
  choice: для битвы
  rationale: Существительное дополняет военный глагол и обозначает цель построения. «Для битвы» ясно передаёт назначение боевого порядка.
- source_word: אֶל הַגִּבְעָה
  choice: у Гивы
  rationale: Предлог אֶל обычно передаёт направленность, но здесь в сочетании с построением войск, вероятнее всего, указывает на расположение относительно города. «У Гивы» даёт контекстуально наиболее естественный пространственный смысл, не превращая город в объект нападения.
theological_decisions:
- issue: Собирательное мужское обозначение אִישׁ יִשְׂרָאֵל
  choice: воины Израиля
  alternative: израильтяне; мужи Израиля
  rationale: Контекст говорит о сражающихся мужчинах. «Воины Израиля» сохраняет гендерную и военную конкретность оригинала, избегая как нейтрализации, так и архаичного для современного читателя слова «мужи».
- issue: Вениамин как имя колена
  choice: вениамитяне
  alternative: Вениамин; колено Вениамина
  rationale: Здесь личное имя метонимически обозначает племенную военную силу. Множественное число не вносит богословского истолкования, а делает по-русски явным коллективный смысл, подтверждённый местоимением אִתָּם «с/против них».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной повествовательной интонацией. Повтор «воины Израиля» сохранён вслед за еврейским текстом. Название города передано в традиционной русской форме «Гива».
