base_translation:
  language: en
  yaml_path: translation/ot/judges/020/048.yaml
  text: And the men of Israel turned back against the sons of Benjamin and struck them with the edge of the sword[a], from each city, men to livestock, even all that was found[c][b]. Also all the cities that were found they set on fire.
translation:
  language: ru
  text: 'И израильтяне повернули обратно против сынов Вениамина и поразили их остриём меча: в каждом городе — людей, скот, всё, что там находилось.[a] А все города, которые им попадались, они предали огню.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение, переданное словами «в каждом городе — людей», трудно для понимания. Буквально: «от города — целиком»; возможно, оно означает полное уничтожение жителей города. По смыслу далее говорится также о скоте и обо всём, что там находилось.'
    reason: Сохраняет текстуальную и лексическую неясность выражения מֵעִיר מְתֹם, не представляя вероятное толкование как несомненное.
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: израильтяне
  rationale: Существительное в единственном числе имеет здесь собирательное значение при глаголе во множественном числе. «Израильтяне» естественно обозначает участвовавших в сражении мужчин, не утяжеляя русский текст.
- source_word: שָׁבוּ אֶל בְּנֵי בִנְיָמִן
  choice: повернули обратно против сынов Вениамина
  rationale: שׁוב передаёт обратное движение, а враждебный контекст требует по-русски предлога «против». Родовое обозначение «сыны Вениамина» сохранено.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: поразили остриём меча
  rationale: נכה допускает значения от поражения до умерщвления; последующее לְפִי חֶרֶב указывает на смертоносный удар мечом. Формулировка сохраняет конкретный образ «края/лезвия меча».
- source_word: מֵעִיר מְתֹם עַד בְּהֵמָה עַד כָּל הַנִּמְצָא
  choice: в городах всех людей — вплоть до скота и всего, что там находилось
  rationale: Трудное מֵעִיר מְתֹם, вероятно, указывает на полное истребление городского населения; последующие обороты расширяют охват на скот и всё найденное. Неясность отмечена в сноске.
- source_word: כָּל הֶעָרִים הַנִּמְצָאוֹת
  choice: все города, которые им попадались
  rationale: Причастие מצא здесь естественно понимать как города, обнаруженные или встреченные израильтянами; русский оборот передаёт это без неестественного «найденные города».
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: предали огню
  rationale: Устойчивое русское выражение ясно и достойно передаёт еврейскую идиому «послали в огонь», то есть сожгли.
