  yaml_path: translation/ot/judges/020/027.yaml
  text: And the sons of Israel inquired of Yahweh—for the ark of the covenant of God was there in those days—[a][b]
translation:
  language: ru
  text: И сыны Израиля вопросили Яхве — в те дни там находился ковчег завета Бога.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне вопросили Яхве». Буквально по-еврейски: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: Слова «в те дни там находился ковчег завета Бога» поясняют место обращения израильтян к Яхве.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: вопросили
  rationale: Глагол שׁאל с предлогом ב и именем Бога обозначает обращение к Богу за ответом или указанием, а не обычный вопрос; «вопросили Яхве» сохраняет религиозный смысл и библейское достоинство.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт еврейское выражение «сыновья Израиля» и его собирательное обозначение народа; более идиоматичный вариант отмечен в сноске.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: 'При שׁאל предлог ב выражает того, у кого испрашивают ответ; в русском управление естественно передаётся беспредложным винительным падежом: «вопросили Яхве».'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом «Господь».
- source_word: וְשָׁם
  choice: ведь … находился там
  rationale: Связка вводит пояснение к месту обращения; «ведь» и тире естественно показывают пояснительный, отступающий характер фразы.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: ковчег завета Бога
  rationale: 'Сохранена полная цепочка сопряжённых существительных: ковчег, связанный с заветом Бога.'
- source_word: בַּיָּמִים הָהֵם
  choice: в те дни
  rationale: Прямой и естественный русский эквивалент устойчивого временного выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Характер обращения Израиля к Богу
  choice: вопросили Яхве
  alternative: спросили Яхве; обратились к Яхве за указанием
  rationale: Формулировка сохраняет смысл обращения за Божьим ответом, не уточняя сверх текста способ получения откровения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Сыны Израиля» и «вопросили» сохраняют форму и сакральный оттенок оригинала; пояснительная вставка отделена тире. Все маркеры сносок присутствуют в основном тексте.
