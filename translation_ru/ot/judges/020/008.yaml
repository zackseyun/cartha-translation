  yaml_path: translation/ot/judges/020/008.yaml
  text: Then all the people rose up as one man, saying, “Not one of us will go to his tent, and not one of us will turn aside to his house.”
translation:
  language: ru
  text: 'Встал весь народ, как один человек, и сказал: «Никто не пойдёт к своему шатру, и никто не свернёт к своему дому».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: И поднялся
  rationale: Передаёт повествовательную форму глагола קום и согласуется с собирательным подлежащим «весь народ».
- source_word: כְּאִישׁ אֶחָד
  choice: как один человек
  rationale: Сохраняет образное выражение оригинала, подчёркивающее единодушие народа.
- source_word: לֹא נֵלֵךְ אִישׁ לְאָהֳלוֹ
  choice: Никто из нас не пойдёт к своему шатру
  rationale: Отрицание при אִישׁ естественно передано по-русски как «никто из нас»; «шатёр» сохраняет конкретную лексику текста.
- source_word: וְלֹא נָסוּר אִישׁ לְבֵיתוֹ
  choice: и никто не возвратится в свой дом
  rationale: В данном контексте סור обозначает уход или поворот в сторону собственного дома; «возвратится» естественно выражает намерение не расходиться по домам.
