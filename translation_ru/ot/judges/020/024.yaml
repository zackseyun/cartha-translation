  text: וַ/יִּקְרְב֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶל בְּנֵ֥י בִנְיָמִ֖ן בַּ/יּ֥וֹם הַ/שֵּׁנִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/024.yaml
  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
translation:
  language: ru
  text: И во второй день израильтяне приблизились к сынам Вениамина[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подошли»; в военном контексте возможно: «выступили против».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыны Израиля» и «сыны Вениамина»; также можно перевести: «израильтяне» и «вениамитяне».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: приблизились
  rationale: Глагол קרב в породе qal означает «приблизиться, подойти». Военный контекст допускает смысл «выступили против», но сам глагол прямо не обозначает нападения.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Буквально «сыны Израиля»; здесь выражение обозначает совокупность израильских племенных сил. Современное «израильтяне» естественно и ясно передаёт этот смысл.
- source_word: אֶל
  choice: к
  rationale: 'Предлог обычно обозначает направление: «к, по направлению к». Враждебность следует из военного контекста, поэтому перевод «против» не обязателен.'
- source_word: בְנֵי בִנְיָמִן
  choice: сынам Вениамина
  rationale: Буквально «сыны Вениамина». Эта форма сохраняет родовое обозначение и позволяет передать направительное значение предлога אֶל без усиления до «против».
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: во второй день
  rationale: Прямо передаёт порядковое обозначение дня; вариант «на следующий день» возможен по контексту, но менее точно отражает форму оригинала.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок обстоятельства времени в начале предложения естественен для русского повествования; племенное выражение во второй части сохранено буквально, чтобы не приписывать предлогу אֶל явно враждебное значение.
