  text: וְ/עַתָּ֡ה תְּנוּ֩ אֶת הָ/אֲנָשִׁ֨ים בְּנֵֽי בְלִיַּ֜עַל אֲשֶׁ֤ר בַּ/גִּבְעָה֙ וּ/נְמִיתֵ֔/ם וּ/נְבַעֲרָ֥ה רָעָ֖ה מִ/יִּשְׂרָאֵ֑ל וְ/לֹ֤א אָבוּ֙ בִּנְיָמִ֔ן לִ/שְׁמֹ֕עַ בְּ/ק֖וֹל אֲחֵי/הֶ֥ם בְּנֵֽי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
translation:
  language: ru
  text: Итак, выдайте тех негодных людей[a], которые находятся в Гиве, чтобы мы предали их смерти и искоренили зло из Израиля. Но вениамитяне не захотели прислушаться к голосу своих братьев[b] — сынов Израиля[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынов негодности»; традиционно: «сынов Велиала».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «слушать голос своих братьев»; выражение может также означать «послушаться» или «внять».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «израильтянам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Сочетание וְעַתָּה явно присутствует в еврейском тексте. В данном требовании оно вводит вывод и побуждение; «итак» передаёт эту дискурсивную функцию естественнее, чем сугубо временное «теперь».
- source_word: תְּנוּ
  choice: выдайте
  rationale: В судебном контексте речь идёт о передаче виновных для наказания; «выдайте» сохраняет требуемую юридическую силу.
- source_word: הָאֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: тех негодных людей
  rationale: בְּנֵי בְלִיַּעַל — нравственная характеристика, буквально «сыны негодности», а не обязательно имя собственного лица. Естественное русское выражение вынесено в основной текст, буквальная форма отмечена в сноске.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: которые находятся в Гиве
  rationale: Относительное придаточное определяет виновных по месту их нахождения; «в Гиве» естественно обозначает город.
- source_word: וּנְמִיתֵם
  choice: чтобы мы предали их смерти
  rationale: Когортатив выражает намеченное действие после исполнения требования. Формулировка передаёт судебную казнь, не сводя её к нейтральному убийству.
- source_word: וּנְבַעֲרָה רָעָה מִיִּשְׂרָאֵל
  choice: и искоренили зло из Израиля
  rationale: בער в устойчивой судебно-заветной формуле означает устранить, искоренить зло из общины.
- source_word: בִּנְיָמִן
  choice: вениамитяне
  rationale: Название колена употреблено собирательно. Русское множественное число ясно обозначает людей колена Вениамина и согласуется с последующим местоимением множественного числа.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: прислушаться к
  rationale: Идиома буквально означает «слушать голос» и в контексте также подразумевает послушание. «Прислушаться» сохраняет образ слушания и смысл принятия требования.
- source_word: אֲחֵיהֶם בְּנֵי יִשְׂרָאֵל
  choice: своим братьям — сынам Израиля
  rationale: Сохраняется родственная лексика повествования и поясняющее приложение «сыны Израиля».
theological_decisions:
- issue: Значение בְּנֵי בְלִיַּעַל
  choice: негодные люди
  alternative: сыны негодности; сыны Велиала
  rationale: В данном контексте выражение характеризует нравственно порочных людей. Перевод через имя «Велиал» мог бы необоснованно привнести позднейшее представление о личном демоническом существе.
- issue: Судебная сила когортативов וּנְמִיתֵם וּנְבַעֲרָה
  choice: чтобы мы предали их смерти и искоренили зло
  alternative: и мы убьём их и удалим зло
  rationale: Форма выражает намерение собрания совершить казнь ради очищения общины; выбранный перевод сохраняет судебно-заветный характер требования без богословского расширения.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис остаётся ясным для широкого читателя; еврейская родственная образность сохранена там, где она существенна. Начальное וְעַתָּה переведено как «Итак», поскольку оно действительно присутствует в WLC и здесь выполняет выводно-побудительную функцию.
