  text: וּ֠/פִינְחָס בֶּן אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן עֹמֵ֣ד לְ/פָנָ֗י/ו בַּ/יָּמִ֣ים הָ/הֵם֮ לֵ/אמֹר֒ הַ/אוֹסִ֨ף ע֜וֹד לָ/צֵ֧את לַ/מִּלְחָמָ֛ה עִם בְּנֵֽי בִנְיָמִ֥ן אָחִ֖/י אִם אֶחְדָּ֑ל וַ/יֹּ֤אמֶר יְהוָה֙ עֲל֔וּ כִּ֥י מָחָ֖ר אֶתְּנֶ֥/נּוּ בְ/יָדֶֽ/ךָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
translation:
  language: ru
  text: 'А Финеес, сын Елеазара, сына Аарона, в те дни стоял перед ним[a] и спросил: «Выступать ли мне снова на войну против сыновей Вениамина, моего брата[b], или прекратить?» Яхве ответил: «Выступайте, потому что завтра Я отдам его в твою руку[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «ним» может относиться к ковчегу завета, упомянутому в предыдущем стихе, либо к Яхве.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «против сыновей Вениамина, брата моего». «Мой брат» относится к Вениамину как к родственной общности; язык родства сохраняется даже при описании междоусобной войны.'
    reason: cultural_note
  - marker: c
    text: Единственное число «его» и «твою» представляет Вениамина и Израиль как коллективные личности. Выражение «отдам в твою руку» также можно передать как «предам в твою власть».
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס בֶּן־אֶלְעָזָר בֶּן־אַהֲרֹן
  choice: А Финеес, сын Елеазара, сына Аарона
  rationale: Сохранены повествовательная связь и обе ступени священнической родословной.
- source_word: עֹמֵד לְפָנָיו
  choice: стоял перед ним
  rationale: 'Передаёт обычный смысл причастия и сохраняет неоднозначность местоимения: оно может относиться к ковчегу из предыдущего стиха либо к Яхве.'
- source_word: בַּיָּמִים הָהֵם
  choice: в те дни
  rationale: Естественное и близкое соответствие устойчивому древнееврейскому выражению.
- source_word: לֵאמֹר
  choice: Они спрашивали
  rationale: В русском прямую речь естественно вводит глагол речи; множественное число проясняет, что вопрос задаёт собравшийся Израиль, тогда как внутри цитаты сохранено исходное коллективное единственное число.
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  choice: Выступать ли мне снова на битву
  rationale: Передаёт повторность действия и военный смысл идиомы «выйти на битву», сохраняя первое лицо единственного числа оригинала.
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  choice: с сыновьями Вениамина, моего брата
  rationale: Предлог «с» в контексте битвы означает противостояние, а буквальная формула родства подчёркивает трагедию междоусобной войны.
- source_word: אִם אֶחְדָּל
  choice: или отступиться?
  rationale: Глагол חדל означает прекратить, перестать; «отступиться» естественно выражает отказ от дальнейших военных действий.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Яхве ответил
  rationale: Глагол «ответил» естественен после вопроса; личное имя Бога передано как «Яхве», а не заменено титулом.
- source_word: עֲלוּ
  choice: Выступайте
  rationale: Форма множественного числа обращена ко всему Израилю; в военном контексте עלה означает выступить или двинуться против врага.
- source_word: כִּי מָחָר אֶתְּנֶנּוּ בְיָדֶךָ
  choice: потому что завтра Я отдам его в твою руку
  rationale: Сохранены переход к единственному числу, коллективное «его» о Вениамине и древнееврейский образ передачи в чью-либо руку.
theological_decisions:
- issue: К кому относится местоименный суффикс в לְפָנָיו
  choice: «перед ним» без явного указания референта
  alternative: «перед ковчегом» или «перед Яхве»
  rationale: Предыдущий стих упоминает ковчег, но стояние «перед» кем-либо может также описывать служение перед Яхве. Русское местоимение позволяет сохранить исходную неоднозначность.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация передаёт личное имя и не подменяет его титулом.
- issue: Колебание числа в речи Израиля и ответе Бога
  choice: Сохранены «мне/твою» при обращённых ко всему народу «Они спрашивали/Выступайте»
  alternative: Унифицировать всё во множественном числе
  rationale: Исходный текст намеренно сочетает множественное повеление с единственным числом, представляя Израиль и Вениамина как коллективные личности; унификация устранила бы эту особенность.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Синтаксис сделан понятным без устранения древнееврейских коллективных форм единственного числа; архаизирующие элементы ограничены значимым образом «в твою руку».
