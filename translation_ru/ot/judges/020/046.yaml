  yaml_path: translation/ot/judges/020/046.yaml
  text: So all who fell from Benjamin that day were twenty-five thousand men who drew the sword[a]; all these were men of valor.
translation:
  language: ru
  text: В тот день из Вениамина пало двадцать пять тысяч человек, вооружённых мечом[a]; все они были доблестными воинами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «обнажавших меч»; древнееврейский военный оборот, обозначающий вооружённых мечом бойцов.
    reason: Сохраняет буквальный образ оригинала и поясняет его идиоматическое военное значение без добавления значения способности.
lexical_decisions:
- source_word: וַיְהִי כָל הַנֹּפְלִים
  choice: Всего ... пало
  rationale: Оборот подводит итог повествованию. Русское «Всего ... пало» естественно передаёт итоговый характер фразы и сохраняет значение נפל как гибели в бою.
- source_word: מִבִּנְיָמִן
  choice: из колена Вениамина
  rationale: Предлог מן указывает на принадлежность погибших к Вениамину. Уточнение «колена» делает смысл естественным и однозначным для современного русского читателя.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ
  choice: двадцать пять тысяч человек
  rationale: Прямая передача числительного и существительного איש без добавления отсутствующего здесь обозначения солдат.
- source_word: שֹׁלֵף חֶרֶב
  choice: обнажавших меч
  rationale: Сохранён буквальный военный образ; в данном контексте выражение обозначает вооружённых бойцов.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямая и естественная передача временного указания.
- source_word: אֶת כָּל אֵלֶּה
  choice: все они
  rationale: Возобновляющий оборот относится ко всем только что исчисленным погибшим; местоименная формулировка естественна по-русски.
- source_word: אַנְשֵׁי חָיִל
  choice: доблестными воинами
  rationale: В военном контексте חַיִל характеризует этих людей как мужественных и боеспособных; «доблестные воины» передаёт и качество, и контекст, не сводя выражение лишь к физической силе.
