source:
  edition: WLC
  text: וַ/יִּרְא֥וּ בְנֵֽי בִנְיָמִ֖ן כִּ֣י נִגָּ֑פוּ וַ/יִּתְּנ֨וּ אִֽישׁ יִשְׂרָאֵ֤ל מָקוֹם֙ לְ/בִנְיָמִ֔ן כִּ֤י בָֽטְחוּ֙ אֶל הָ֣/אֹרֵ֔ב אֲשֶׁר שָׂ֖מוּ אֶל הַ/גִּבְעָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
translation:
  language: ru
  text: И увидели вениаминитяне, что потерпели поражение. Израильтяне же отступили перед ними[a], потому что полагались на засаду[b], которую устроили против Гивы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дали место Вениамину»; речь идёт о намеренном отступлении, которым израильтяне выманивали противника.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на отряд, находившийся в засаде». Еврейское אֹרֵב может обозначать как засаду, так и тех, кто в ней находится.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: увидели
  rationale: Передаёт основное значение ראה и сохраняет конкретность повествования; в контексте также подразумевается осознание поражения.
- source_word: בְנֵי בִנְיָמִן
  choice: вениаминитяне
  rationale: Естественное современное русское обозначение потомков и воинов колена Вениамина без архаичного оборота «сыны Вениамина».
- source_word: כִּי נִגָּפוּ
  choice: что потерпели поражение
  rationale: Форма Niphal глагола נגף в военном контексте означает, что они были разбиты; выбранная формулировка естественна по-русски.
- source_word: וַיִּתְּנוּ ... מָקוֹם
  choice: отступили перед ними
  rationale: Буквально оборот означает «дали место», но здесь описывает намеренное тактическое отступление израильтян, заманивавших противника.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: израильтяне
  rationale: Собирательное אִישׁ с названием народа обозначает участвовавших в сражении людей Израиля; краткая форма естественна в русском повествовании.
- source_word: כִּי בָטְחוּ
  choice: потому что полагались
  rationale: Глагол בטח выражает уверенную опору или доверие; «полагались» естественно сочетается с военным замыслом и засадой.
- source_word: אֶל הָאֹרֵב
  choice: на засаду
  rationale: אֹרֵב может обозначать как саму засаду, так и отряд, находящийся в засаде; основной текст сохраняет привычное русское выражение.
- source_word: אֲשֶׁר שָׂמוּ
  choice: которую устроили
  rationale: В сочетании с «засадой» русское «устроили» естественно передаёт широкое значение שׂים — «поместить, поставить, расположить».
- source_word: אֶל הַגִּבְעָה
  choice: против Гивы
  rationale: Предлог אֶל здесь указывает на направленность засады к Гиве или против неё; «против Гивы» передаёт её тактическую цель.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Термин «вениаминитяне» выбран вместо более архаичного «сыны Вениамина»; тактический смысл идиомы раскрыт естественным глаголом «отступили», а её буквальная форма сохранена в сноске.
