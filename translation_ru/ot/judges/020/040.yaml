  register: Современный литературный русский язык с сохранением лаконичности и драматизма еврейского повествования. Тире помогает естественно передать пояснительное приложение «столб дыма» и внезапность увиденного; образ восходящего к небу города намеренно сохранён без внесения пояснения в основной текст.
