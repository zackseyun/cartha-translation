base_translation:
  language: en
  yaml_path: translation/ot/judges/020/040.yaml
  text: But the signal began to rise from the city as a pillar of smoke[a], and Benjamin turned behind him, and behold[c][b], the whole city was going up to the heavens.
translation:
  language: ru
  text: 'Но из города начал подниматься сигнал — столб дыма[a]. Вениамин повернулся назад, и вот: весь город поднимался к небу[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из города начал подниматься сигнальный огонь — столб дыма». Еврейское слово может обозначать нечто поднятое; здесь, вероятно, имеется в виду заранее условленный боевой сигнал.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «весь город поднялся к небу», то есть в пламени и дыму.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂאֵת
  choice: сигнал
  rationale: В контексте заранее условленного знака от засады существительное обозначает подаваемый дымом боевой сигнал. Перевод «сигнал» ясно передаёт его функцию, не сводя слово лишь к процессу поднятия.
- source_word: הֵחֵלָּה לַעֲלוֹת
  choice: начал подниматься
  rationale: Сочетание выражает начало движения вверх; эта формулировка естественна по-русски применительно к дымовому сигналу.
- source_word: עַמּוּד עָשָׁן
  choice: столб дыма
  rationale: Точное и привычное русское обозначение вертикально поднимающегося дыма.
- source_word: וַיִּפֶן בִּנְיָמִן אַחֲרָיו
  choice: Вениамин оглянулся назад
  rationale: Передаёт поворот назад, вызванный происходящим за спиной. Название колена сохранено как коллективное единственное число вслед за еврейским текстом.
- source_word: וְהִנֵּה
  choice: и вот
  rationale: Сохраняет драматический оттенок внезапного обнаружения и естественно звучит в современном русском повествовании.
- source_word: כְלִיל הָעִיר
  choice: весь город
  rationale: כְלִיל указывает здесь на полноту охвата; «весь город» — точный и естественный русский эквивалент.
- source_word: עָלָה ... הַשָּׁמָיְמָה
  choice: поднимался к небу
  rationale: Сохраняет образ города, восходящего к небу, не добавляя прямо отсутствующих в тексте слов «в огне» или «в дыму».
