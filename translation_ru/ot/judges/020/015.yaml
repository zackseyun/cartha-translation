    rationale: לְבַד здесь вводит отдельно учтённый, дополнительный контингент жителей Гивы, а не исключение, при котором семьсот не были бы включены в сообщение.
  - severity: low
    issue: «По городам» менее точно, чем «из городов».
    rationale: Предлог מִן обозначает происхождение/источник набора; русский вариант «из городов» передаёт это непосредственно.
  - severity: low
