  yaml_path: translation/ot/judges/020/015.yaml
  text: 'And on that day the sons of Benjamin were mustered from the cities: twenty-six thousand men drawing the sword[a], besides the inhabitants of Gibeah[b], who were mustered as seven hundred chosen men.'
translation:
  language: ru
  text: 'В тот день сыновья Вениамина были исчислены из городов: двадцать шесть тысяч мужчин, обнажающих меч[a]. Отдельно были исчислены семьсот отборных мужчин из жителей Гивы[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть вооружённых воинов; буквально: «обнажающих меч».'
    reason: idiom_clarification
  - marker: b
    text: 'Или: «молодых мужчин». Еврейское слово может указывать как на отборных воинов, так и на молодых мужчин; здесь контекст, вероятно, подчёркивает их боевые качества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקְדוּ / הִתְפָּקְדוּ
  choice: были исчислены / было исчислено
  rationale: Форма хитпаэль глагола פקד здесь обозначает воинский учёт. «Исчислены» сохраняет мотив подсчёта и повтор одного глагола в еврейском тексте; военный контекст ясен из выражения об обнажающих меч.
- source_word: בְנֵי בִנְיָמִן
  choice: сыновья Вениамина
  rationale: Формально близкая передача сохраняет родоплеменной и генеалогический образ оригинала.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная современная русская передача временного оборота с указательным значением.
- source_word: מֵהֶעָרִים
  choice: по городам
  rationale: В контексте воинского учёта оборот указывает на людей, учтённых в городах/из городов. «По городам» естественно обозначает распределение подсчёта, не добавляя отсутствующего в тексте притяжательного местоимения.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ
  choice: двадцать шесть тысяч мужчин
  rationale: Прямая числовая передача; военный статус раскрывается следующим оборотом, поэтому слово «воинов» не добавлено.
- source_word: שֹׁלֵף חָרֶב
  choice: обнажающих меч
  rationale: Сохраняет конкретный образ еврейской воинской формулы, обозначающей вооружённых бойцов.
- source_word: לְבַד
  choice: не считая
  rationale: Ясно показывает, что жители Гивы не входят в предшествующее число и учитываются отдельно.
- source_word: מִיֹּשְׁבֵי הַגִּבְעָה
  choice: жителей Гивы
  rationale: Естественная передача субстантивированного причастия со значением постоянных жителей города.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: семьсот мужчин
  rationale: Прямая передача числа и существительного אִישׁ.
- source_word: בָּחוּר
  choice: отборных
  rationale: В военном контексте слово, вероятнее всего, характеризует специально отобранных, лучших бойцов; при этом возрастное значение сохраняется в примечании как реальная лексическая возможность.
