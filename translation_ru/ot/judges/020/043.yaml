- source_word: אֶת בִּנְיָמִן
  choice: Вениамина
  rationale: Название колена употреблено как собирательное единственное; сохранена форма еврейского текста, согласующаяся с последующими местоименными суффиксами единственного числа.
- source_word: הִרְדִיפֻהוּ
  choice: преследовали его
  rationale: В военном контексте רדף обычно означает погоню или преследование.
- source_word: מְנוּחָה
  choice: без передышки
  rationale: 'Существительное буквально означает «покой, место покоя». Здесь оно понято наречно: преследование не давало Вениамину отдыха; неоднозначность отмечена в сноске.'
- source_word: הִדְרִיכֻהוּ
  choice: топтали его
  rationale: Порода hифиль глагола דרך допускает значение попирания, особенно уместное в последовательности враждебных военных действий; возможное значение понуждения к движению сохранено в сноске.
- source_word: עַד נֹכַח הַגִּבְעָה
  choice: до места напротив Гивы
  rationale: נֹכַח выражает пространственное положение напротив или перед чем-либо.
- source_word: מִמִּזְרַח שָׁמֶשׁ
  choice: с восточной стороны
  rationale: Буквально выражение связано с «восходом солнца» и идиоматически указывает на восток; контекстуально это восточная сторона Гивы.
