  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
translation:
  language: ru
  text: Они повернули, отступая от израильтян, к дороге, ведущей в пустыню[a], но сражение настигло их[b]; а люди из городов уничтожали их в самой их гуще[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед мужами Израиля». В данном контексте выражение можно понимать как «от мужей Израиля», то есть отступая от них.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и битва догнала их». В еврейском тексте местоимение стоит в единственном числе и относится к войску как к единому целому.'
    reason: lexical_alternative
  - marker: c
    text: Последняя часть еврейского текста кратка и трудна для однозначного понимания. Вероятно, речь идёт об израильских силах, вышедших из городов или из засад и поражавших вениамитян внутри их боевого строя.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: они повернули
  rationale: Глагол פנה прежде всего означает «повернуть, обратиться». В данном боевом контексте подразумевается отступление, но перевод сохраняет образ исходного текста и не усиливает его до «побежали».
- source_word: לִפְנֵי אִישׁ יִשְׂרָאֵל
  choice: от израильтян
  rationale: Буквально сочетание может быть передано как «перед мужами Израиля», однако в контексте движения оно идиоматически обозначает удаление от израильского войска. «Израильтяне» здесь естественно и ясно обозначает воинов Израиля.
- source_word: אֶל דֶּרֶךְ הַמִּדְבָּר
  choice: к дороге в пустыню
  rationale: Так передаётся значение דֶּרֶךְ «дорога, путь» и направление движения; формулировка естественна для современного русского языка.
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  choice: но сражение настигло их
  rationale: Порода hифиль глагола דבק здесь выражает преследование, которое догнало отступающих. Союз «но» ясно передаёт контекстуальное противопоставление, а множественное «их» раскрывает коллективный референт еврейского суффикса единственного числа.
- source_word: וַאֲשֶׁר מֵהֶעָרִים
  choice: а те, кто пришёл из городов
  rationale: Еврейская конструкция эллиптична. Русская формулировка сохраняет неопределённость относительно точного происхождения этих сил, не уточняя без достаточного основания, что это были засады.
- source_word: מַשְׁחִיתִים אֹתוֹ
  choice: поражали их
  rationale: В военном контексте שׁחת обозначает губительное поражение или истребление. «Поражали» звучит естественно и передаёт убийство в бою без ненужного стилистического усиления; множественное местоимение соответствует коллективному смыслу.
- source_word: בְּתוֹכוֹ
  choice: изнутри
  rationale: 'Буквально — «внутри него/посреди него» с коллективным суффиксом. «Изнутри» кратко передаёт вероятный тактический смысл: Вениамина поражали внутри его расположения.'
