  register: Современный литературный русский язык с достоинством, соответствующим тяжёлому содержанию. Сохранена краткая повествовательная структура стиха и последовательное «и она умерла» без добавления причинной связи. Маркер [a] поставлен при относящемся к нему слове «намеревались», а не после обстоятельства «ночью».
