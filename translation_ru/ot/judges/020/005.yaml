base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
translation:
  language: ru
  text: Тогда мужчины Гивы выступили против меня и ночью окружили дом, в котором я был. Они намеревались[a] убить меня, а надругались над моей наложницей[b], и она умерла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «замышляли убить».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изнасиловали мою наложницу». Еврейский глагол может обозначать жестокое унижение или надругательство; здесь контекст указывает на сексуальное насилие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  choice: жители Гивы
  rationale: В данном сочетании множественное בַּעֲלֵי обозначает мужчин — жителей города, а не формальных «господ» или «владельцев». Русское «жители Гивы» естественно и не вводит представления о знати.
- source_word: וַיָּקֻמוּ עָלַי
  choice: восстали против меня
  rationale: Сохраняет образность идиомы קום על и ясно передаёт враждебное выступление.
- source_word: וַיָּסֹבּוּ עָלַי אֶת־הַבַּיִת
  choice: окружили дом, в котором я был
  rationale: Глагол סבב с объектом «дом» означает окружение дома; уточнение «в котором я был» естественно передаёт עָלַי и избегает неуклюжего буквального «окружили вокруг меня дом».
- source_word: לָיְלָה
  choice: ночью
  rationale: Естественная передача обстоятельства времени в современном русском языке.
- source_word: דִּמּוּ לַהֲרֹג
  choice: намеревались убить
  rationale: В этом контексте דמה выражает намерение. Перевод не превращает намерение в уже начавшееся покушение.
- source_word: פִּילַגְשִׁי
  choice: моей наложницей
  rationale: «Наложница» — устоявшееся и исторически уместное обозначение פילגש; оно точнее, чем пояснительное «вторая жена».
- source_word: עִנּוּ
  choice: надругались
  rationale: Пиэль от ענה может обозначать жестокое унижение и насилие; в контексте Суд 19 сексуальный характер насилия очевиден. «Надругались» сохраняет некоторую лексическую широту исходного глагола, а примечание прямо поясняет смысл.
- source_word: וַתָּמֹת
  choice: и она умерла
  rationale: Передаёт последовательность еврейского повествования, не добавляя формально не выраженного причинного союза «так что».
