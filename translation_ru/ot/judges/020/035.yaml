base_translation:
  language: en
  yaml_path: translation/ot/judges/020/035.yaml
  text: And Yahweh struck Benjamin down before Israel[a], and the sons of Israel destroyed twenty-five thousand one hundred men of Benjamin that day[b], all these drawing the sword.
translation:
  language: ru
  text: И Яхве поразил Вениамина перед Израилем[a], а израильтяне[b] в тот день убили из Вениамина двадцать пять тысяч сто человек — все они владели мечом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нанёс Вениамину поражение перед Израилем».'
    reason: lexical_alternative
  - marker: b
    text: 'Букв.: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: поразил
  rationale: В военном контексте נָגַף обозначает нанесение поражения, нередко с гибелью людей. «Поразил» сохраняет силу образа и явное действие Бога, не сводя выражение к более отвлечённому «победил».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: перед Израилем
  rationale: 'Формулировка сохраняет еврейский военный оборот: Вениамин был поражён перед лицом Израиля, то есть в сражении с ним.'
- source_word: וַיַּשְׁחִיתוּ
  choice: истребили
  rationale: Hiphil от שׁחת здесь означает губительное уничтожение в бою. «Истребили» естественно передаёт смертельный характер действия и сильнее буквального «уничтожили» применительно к людям.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Современное русское обозначение народа звучит естественно в повествовании; буквальная форма «сыны Израиля» сохранена в примечании.
- source_word: בְּבִנְיָמִן
  choice: из племени Вениамина
  rationale: Предлог указывает на среду или группу, из которой были убитые. Добавление «племени» ясно передаёт метонимическое употребление имени Вениамина в современном русском.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ
  choice: двадцать пять тысяч сто человек
  rationale: Прямая и естественная передача числительного и счётной формулы.
- source_word: כָּל אֵלֶּה שֹׁלֵף חָרֶב
  choice: все они обнажали меч
  rationale: Сохраняется конкретный еврейский образ вооружённых бойцов, способных обнажить меч, без более общего толкования «носили оружие».
theological_decisions:
- issue: Соотношение божественного и человеческого действия в исходе битвы
  choice: 'Сохранены обе последовательные формулировки: Яхве поразил Вениамина, а израильтяне истребили его воинов.'
  alternative: Представить победу либо только как непосредственное действие Бога, либо только как военный успех Израиля.
  rationale: Еврейский текст без объяснения соединяет божественную и человеческую деятельность; перевод не устраняет это богословское напряжение.
translation_notes:
  register: Современный литературный русский с торжественной повествовательной интонацией. Союз «а» естественно разграничивает божественное и человеческое действие, не противопоставляя их. Военный образ «обнажали меч» сохранён намеренно.
