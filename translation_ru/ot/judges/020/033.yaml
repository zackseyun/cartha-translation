  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
translation:
  language: ru
  text: Тогда все воины Израиля поднялись со своих мест и выстроились для боя у Баал-Тамара, а израильский отряд, находившийся в засаде, устремился, выйдя из своего места в Мааре-Геве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейское выражение «Мааре-Гева» можно понимать как название местности, как в основном тексте. Возможны также переводы: «открытое место Гевы» или «луг Гевы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: все воины Израиля
  rationale: Сочетание с כֹל имеет собирательно-распределительное значение. В военном контексте «воины Израиля» естественно передаёт речь обо всех участвующих мужчинах, не вводя тяжеловесного оборота «каждый мужчина Израиля».
- source_word: קָמוּ מִמְּקוֹמוֹ
  choice: поднялись со своих мест
  rationale: Множественное сказуемое относится к собирательному субъекту, а единственное число суффикса при «месте» имеет распределительный смысл; по-русски естественно множественное «со своих мест».
- source_word: וַיַּעַרְכוּ
  choice: выстроились для боя
  rationale: Военное употребление ערך обозначает построение войска; перевод ясно передаёт боевой смысл и сохраняет лаконичность повествования.
- source_word: בְּבַעַל תָּמָר
  choice: у Баал-Тамара
  rationale: Выражение понято как географическое название; предлог «у» естественно передаёт локативное בְּ.
- source_word: אֹרֵב יִשְׂרָאֵל
  choice: израильский отряд, находившийся в засаде
  rationale: Причастие אֹרֵב обозначает находящихся в засаде, а יִשְׂרָאֵל здесь указывает на принадлежность отряда Израилю, а не на засаду против Израиля. Собирательное единственное число сохранено словом «отряд».
- source_word: מֵגִיחַ
  choice: устремился
  rationale: Форма передаёт внезапный выход или бросок из укрытия. «Устремился» сохраняет динамику, не уточняя без необходимости направление движения.
- source_word: מִמְּקוֹמוֹ
  choice: со своего места
  rationale: Единственное число согласовано с собирательным «отряд» и непосредственно отражает форму еврейского текста.
- source_word: מִמַּעֲרֵה גָבַע
  choice: из Мааре-Гевы
  rationale: Трудное выражение, вероятно, является топонимом. В основном тексте сохранена транслитерация, а возможные описательные толкования вынесены в сноску.
