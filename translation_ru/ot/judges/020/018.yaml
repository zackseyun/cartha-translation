base_translation:
  language: en
  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
translation:
  language: ru
  text: 'Тогда они поднялись и пошли в Вефиль, где вопросили Бога. Сыны Израиля сказали: «Кто первым пойдёт за нас на битву против сынов Вениамина?» Яхве[a] ответил: «Иуда — первым».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Господь». В еврейском тексте стоит имя יהוה (Яхве).'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקֻמוּ וַיַּעֲלוּ
  choice: они поднялись и пошли
  rationale: Сохраняет последовательность двух повествовательных глаголов и значение עלה «идти вверх», которое в русском естественно передаётся глаголом движения без буквального «взошли».
- source_word: בֵית אֵל
  choice: Вефиль
  rationale: Традиционная и узнаваемая русская форма названия Бейт-Эль.
- source_word: וַיִּשְׁאֲלוּ בֵאלֹהִים
  choice: вопросили Бога
  rationale: Передаёт не просто бытовой вопрос, а обращение к Богу за указанием; формулировка краткая, торжественная и понятная в библейском повествовании.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет еврейское родовое обозначение народа и мужскую форму исходного выражения, не сводя его к менее прозрачному этнониму.
- source_word: מִי יַעֲלֶה לָּנוּ בַתְּחִלָּה
  choice: кто первым пойдёт за нас
  rationale: Передаёт вопрос о том, кто должен выступить первым от имени всего Израиля; не добавляет отсутствующий в тексте глагол «возглавит».
- source_word: לַמִּלְחָמָה עִם בְּנֵי בִנְיָמִן
  choice: на битву против сынов Вениамина
  rationale: В военном контексте עִם обозначает вступление в столкновение с противником; «против» ясно выражает смысл, сохраняя родовое название «сыны Вениамина».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном, а не заменяет его титулом.
- source_word: יְהוּדָה בַתְּחִלָּה
  choice: Иуда — первым
  rationale: Сохраняет краткость и эллиптичность еврейского ответа; тире естественно обозначает подразумеваемое «пойдёт».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога. Основной текст сохраняет его как имя, а традиционная титульная передача указана в примечании.
- issue: Корпоративные обозначения בְּנֵי יִשְׂרָאֵל и בְּנֵי בִנְיָמִן
  choice: сыны Израиля; сыны Вениамина
  alternative: израильтяне; вениамитяне
  rationale: Родовые выражения сохранены, поскольку они значимы в повествовании о межплеменном конфликте и остаются понятными по-русски.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис упрощён там, где буквальное воспроизведение было бы тяжеловесным, но краткость ответа Яхве и родовые обозначения участников сохранены.
