  text: Then the sons of Israel rose in the morning and camped against Gibeah[a].
translation:
  language: ru
  text: Утром сыны Израиля поднялись и расположились лагерем против Гивы.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». В еврейском тексте: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: поднялись
  rationale: Глагол קום в последовательной повествовательной форме обозначает следующее действие; «поднялись» сохраняет простой смысл, не сводя его только к выступлению в путь.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально передаёт еврейское сочетание и его устойчивое обозначение народа завета; более обычный современный вариант указан в сноске.
- source_word: בַּבֹּקֶר
  choice: утром
  rationale: Естественный современный русский эквивалент обстоятельства времени с определённым существительным.
- source_word: וַיַּחֲנוּ
  choice: расположились станом
  rationale: Глагол חנה означает разбить или устроить лагерь; выражение ясно передаёт военное расположение и выдерживает достоинство повествовательного регистра.
- source_word: עַל
  choice: против
  rationale: В данном военном контексте предлог выражает враждебное расположение по отношению к городу, а не только близость.
- source_word: הַגִּבְעָה
  choice: Гивы
  rationale: Передаёт название города גבעה в принятой русской библейской форме; падеж обусловлен предлогом «против».
