  text: וַ/יִּפְנ֞וּ וַ/יָּנֻ֤סוּ הַ/מִּדְבָּ֨רָ/ה֙ אֶל סֶ֣לַע הָֽ/רִמּ֔וֹן שֵׁ֥שׁ מֵא֖וֹת אִ֑ישׁ וַ/יֵּֽשְׁבוּ֙ בְּ/סֶ֣לַע רִמּ֔וֹן אַרְבָּעָ֖ה חֳדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/047.yaml
  text: But six hundred men turned and fled toward the wilderness[a], to the rock of Rimmon[b], and stayed at the rock of Rimmon four months.
translation:
  language: ru
  text: Но шестьсот человек повернули и бежали к пустыне[a], к скале Риммон[b], и оставались у скалы Риммон четыре месяца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в пустыню». Еврейская форма направления может обозначать движение как к пустыне, так и в пределы пустынной области.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к скале Риммона»; возможно также как название места: «к Скале-Риммон».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: повернули
  rationale: Глагол обозначает перемену направления; в сочетании с «бежали» естественно передаёт поворот от сражения к бегству.
- source_word: וַיָּנֻסוּ
  choice: бежали
  rationale: נוּס обычно означает бегство от опасности; выбранный вариант сохраняет срочность и военный контекст.
- source_word: הַמִּדְבָּרָה
  choice: к пустыне
  rationale: Направительный суффикс указывает на движение к пустыне или в неё. «К пустыне» сохраняет эту направленность, не уточняя сверх текста, находилась ли скала внутри пустынной области.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: к скале Риммон
  rationale: סֶלַע обозначает скалу или скалистое укреплённое место; русская конструкция естественно передаёт название места, сохраняя Риммон как топоним.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: шестьсот человек
  rationale: В данном военном контексте אִישׁ обозначает взрослых мужчин, однако русское числительное нормативно сочетается с «человек» и ясно относится к уцелевшим воинам.
- source_word: וַיֵּשְׁבוּ
  choice: оставались
  rationale: ישׁב может означать сидеть, жить или оставаться; здесь речь идёт о временном пребывании в убежище, поэтому «оставались» точно передаёт длительность без оттенка постоянного поселения.
- source_word: בְּסֶלַע רִמּוֹן
  choice: у скалы Риммон
  rationale: Предлог ב допускает значение местонахождения в скале или при ней. «У скалы» естественно по-русски и не навязывает представления о пребывании буквально внутри камня.
- source_word: אַרְבָּעָה חֳדָשִׁים
  choice: четыре месяца
  rationale: Прямое обозначение продолжительности пребывания.
- source_word: וַ
  choice: Но
  rationale: Начальный повествовательный союз формально может передаваться как «и», однако в контексте предыдущего истребления «но» естественно подчёркивает исключение — шестьсот уцелевших.
