- from: Мы возьмём из всех колен Израиля по десять человек из каждой сотни, по сто из каждой тысячи и по тысяче из каждых десяти тысяч, чтобы они доставили продовольствие для народа, а народ, придя в Гиву Вениаминову, поступил с ней[b] сообразно всему бесчинству[a], которое она совершила в Израиле.
  to: Мы возьмём из всех колен Израиля по десять человек на каждую сотню, по сто на каждую тысячу и по тысяче на каждые десять тысяч, чтобы они взяли припасы для народа, чтобы, прибыв в Гиву Вениаминову[b], они поступили сообразно всему тому гнусному делу[a], которое было совершено в Израиле.
  rationale: Исправлены излишняя конкретизация снабжения, неясная смена субъекта и добавленный объект ответного действия. Безличное «которое было совершено» в русском не приписывает деяние городу женского рода и не выбирает между возможными контекстуальными субъектами, сохраняя отмеченную в сноске неоднозначность еврейской формы. Сжатость заключительной конструкции и неопределённость конкретного действия сохранены.
