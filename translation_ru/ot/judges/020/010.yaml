source:
  edition: WLC
  text: וְ/לָקַ֣חְנוּ עֲשָׂרָה֩ אֲנָשִׁ֨ים לַ/מֵּאָ֜ה לְ/כֹ֣ל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וּ/מֵאָ֤ה לָ/אֶ֨לֶף֙ וְ/אֶ֣לֶף לָ/רְבָבָ֔ה לָ/קַ֥חַת צֵדָ֖ה לָ/עָ֑ם לַ/עֲשׂ֗וֹת לְ/בוֹאָ/ם֙ לְ/גֶ֣בַע בִּנְיָמִ֔ן כְּ/כָל הַ֨/נְּבָלָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה בְּ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/010.yaml
  text: And we will take ten men out of a hundred from all the tribes of Israel[a], and a hundred out of a thousand, and a thousand out of ten thousand, to get provisions for the people, so that when they come to Gibeah of Benjamin[b], they may do according to all the outrage that it committed in Israel.
translation:
  language: ru
  text: Мы возьмём из всех колен Израиля по десять человек на каждую сотню, по сто на каждую тысячу и по тысяче на каждые десять тысяч, чтобы они взяли припасы для народа, чтобы, прибыв в Гиву Вениаминову[b], они поступили сообразно всему тому гнусному делу[a], которое было совершено в Израиле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «позорный поступок», «возмутительное деяние» или «беззаконие». Еврейское слово обозначает вопиюще постыдное, нравственно возмутительное деяние.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «чтобы сделать при их приходе в Гиву Вениаминову». Это сжатое выражение; конкретный характер действия не назван. В еврейском далее употреблён глагол мужского рода единственного числа («которое он совершил»), и его субъект может пониматься по контексту по-разному.'
    reason: source_ambiguity
lexical_decisions:
- source_word: וְלָקַחְנוּ
  choice: Мы возьмём
  rationale: Перфект с союзом в контексте общего решения имеет перспективное значение; русское будущее время естественно передаёт намеченное действие.
- source_word: עֲשָׂרָה אֲנָשִׁים לַמֵּאָה ... וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה
  choice: по десять человек из каждой сотни, по сто из каждой тысячи и по тысяче из каждых десяти тысяч
  rationale: Формула обозначает пропорциональный отбор одной десятой части; повторение числового ряда сохраняет ритм и точность оригинала.
- source_word: לְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: из всех колен Израиля
  rationale: В данном контексте людей отбирают из всей совокупности израильских колен.
- source_word: לָקַחַת צֵדָה לָעָם
  choice: чтобы они доставили продовольствие для народа
  rationale: צֵדָה — запасы или припасы для пути и военного предприятия. «Продовольствие» понятно современному читателю и соответствует основной потребности войска, не называя его прямо армией.
- source_word: לַעֲשׂוֹת לְבוֹאָם
  choice: а народ, придя ... поступил
  rationale: Сжатая цепочка инфинитива и оборота со значением прибытия развёрнута в естественную русскую целевую конструкцию без уточнения конкретного вида карательного действия.
- source_word: לְגֶבַע בִּנְיָמִן
  choice: в Гиву Вениаминову
  rationale: Предлог выражает направленность движения. Традиционная русская форма названия сохраняет связь города с Вениамином.
- source_word: כְּכָל הַנְּבָלָה
  choice: сообразно всему бесчинству
  rationale: נְבָלָה здесь означает вопиюще постыдное и нравственно возмутительное деяние. «Бесчинство» передаёт тяжесть оценки без внесения специальной богословской терминологии.
- source_word: אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל
  choice: которое она совершила в Израиле
  rationale: Глагол стоит в мужском роде единственного числа, однако в контексте субъектом может мыслиться олицетворённый город или виновник. Русское местоимение согласовано с названием «Гива» и сохраняет корпоративный смысл контекста.
theological_decisions:
- issue: Передача нравственно окрашенного נְבָלָה без привнесения позднейших доктринальных категорий
  choice: бесчинство
  alternative: гнусное дело; позорный поступок; безумие
  rationale: Выбранное слово выражает нравственное негодование и общественный характер преступления, не превращая характеристику в технический богословский термин.
- issue: Неоднозначность субъекта единственного числа в אֲשֶׁר עָשָׂה
  choice: 'олицетворённая Гива: «которое она совершила»'
  alternative: 'безличное: «которое было совершено»; личное: «которое он совершил»'
  rationale: Ближайший названный участник — Гива, а контекст допускает корпоративную ответственность города. Сноска отмечает грамматическую неоднозначность, не устраняя её молча.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической организацией. Числовая формула сохранена полностью; архаизмы и узковоенные уточнения избегаются. Выражение «поступил с ней» оставляет характер ответного действия открытым, как и сжатый еврейский текст.
