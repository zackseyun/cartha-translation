  text: 'Вот все вы, сыны Израиля: выскажите здесь своё мнение и дайте свой совет.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательно-привлекающую внимание частицу в торжественной публичной речи.
- source_word: כֻּלְכֶם בְּנֵי יִשְׂרָאֵל
  choice: все вы — сыны Израиля
  rationale: Сохраняет прямое обращение ко всему собранию и библейский родовой образ, оставаясь понятным по-русски.
- source_word: הָבוּ לָכֶם דָּבָר
  choice: Выскажите ... своё мнение
  rationale: Буквально конструкция говорит «дайте себе слово/дело», но в данном совещательном контексте означает предложить суждение; естественное русское выражение передаёт прагматический смысл.
- source_word: וְעֵצָה
  choice: и дайте совет
  rationale: Сохраняет отдельный второй элемент исходной пары и значение предложения о дальнейших действиях.
- source_word: הֲלֹם
  choice: здесь
  rationale: Передаёт наречие места, относящее призыв к настоящему собранию.
