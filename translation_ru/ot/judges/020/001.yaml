base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
translation:
  language: ru
  text: И вышли все сыны Израиля[a], и община собралась как один человек[b] — от Дана до Вирсавии и из земли Галаада — к Яхве в Мицпу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля». Это еврейское собирательное обозначение народа Израиля, а не только мужчин.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как один человек» — то есть единодушно и сообща.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «перед Яхве в Мицпе»; еврейскую фразу можно понимать как указание на собрание в присутствии Яхве.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: вышли
  rationale: Обычное значение יצא — «выходить». Русская форма не навязывает точку наблюдения и естественно вводит последующее собрание племён.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: все сыны Израиля
  rationale: Сохранено буквальное корпоративное обозначение народа Израиля; сноска поясняет, что речь не только о мужчинах.
- source_word: וַתִּקָּהֵל הָעֵדָה
  choice: собралось всё общество
  rationale: Фраза передаёт собрание всей общины как единого общественного целого без излишне узкого культового оттенка.
- source_word: כְּאִישׁ אֶחָד
  choice: словно один человек
  rationale: Сохранён образ еврейской идиомы, выражающей единодушие и согласованность действий; «человек» здесь естественнее для современного русского, чем буквальное «муж».
- source_word: לְמִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: от Дана до Вирсавии
  rationale: Устоявшийся географический меризм, обозначающий всю территорию Израиля с севера на юг.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: и из земли Галаадской
  rationale: Галаад добавлен как представленная заиорданская область; предлог «из» проясняет происхождение собравшихся, не меняя географического охвата.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל передан своим прямым направительным значением, а тетраграмматон — личным именем «Яхве».
- source_word: הַמִּצְפָּה
  choice: в Мицпу
  rationale: Название места передано транслитерацией; русская конструкция обозначает Мицпу как место назначения собрания.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Личное заветное имя сохранено как имя, без замены титулом.
- issue: Корпоративное мужское выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Сохранена форма исходного текста, а её собирательное значение разъяснено в сноске.
- issue: Связь выражений אֶל יְהוָה и הַמִּצְפָּה
  choice: к Яхве в Мицпу
  alternative: пред Яхве в Мицпе
  rationale: Основной текст следует направительному значению אֶל, а сноска сохраняет возможное понимание собрания как происходящего в присутствии Яхве.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены ключевые образы исходного текста, но синтаксис сделан естественным; тире выделяют географический охват собрания.
