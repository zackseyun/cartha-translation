  yaml_path: translation/ot/judges/020/041.yaml
  text: Then the men of Israel turned[a], and the men of Benjamin were terrified, because they saw that disaster had come upon them.
translation:
  language: ru
  text: Тогда израильтяне повернули[a], и вениамитяне пришли в ужас, потому что увидели, что их постигло бедствие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте выражения «муж Израиля», «муж Вениамина», «увидел» и «на него» стоят в единственном числе, но здесь употреблены собирательно и обозначают противоборствующие войска; поэтому в переводе использовано множественное число.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: Тогда израильтяне
  rationale: Существительное אִישׁ формально стоит в единственном числе, но в военном повествовании обозначает израильское войско как совокупность. «Израильтяне» естественно передаёт этот смысл; וְ передано словом «тогда» как указание на последовательность событий.
- source_word: הָפַךְ
  choice: повернули
  rationale: Глагол обозначает тактический поворот в ходе сражения. «Повернули» сохраняет лаконичность оригинала и не уточняет без необходимости направление движения.
- source_word: וַ/יִּבָּהֵל אִישׁ בִּנְיָמִן
  choice: и вениамитяне пришли в ужас
  rationale: בהל выражает внезапный сильный страх или смятение. Единственное число אִישׁ употреблено собирательно; русское множественное число передаёт войско Вениамина естественно и точно.
- source_word: כִּי רָאָה כִּי
  choice: потому что увидели, что
  rationale: Первое כִּי вводит причину, а второе — содержание увиденного. Единственное число רָאָה согласовано с собирательным субъектом оригинала и по-русски передано множественным числом.
- source_word: נָגְעָה עָלָיו הָרָעָה
  choice: их постигло бедствие
  rationale: В данном контексте רָעָה означает не нравственное зло, а надвигающуюся гибельную беду. «Постигло» идиоматично передаёт сочетание נגע על — бедствие достигло их, пришло на них; местоимение передано во множественном числе по собирательному смыслу.
