revisions:
- from: Тогда все сыны Израиля и весь народ поднялись и пришли в Вефиль[a]. Они плакали и сидели там перед Яхве, постясь в тот день до вечера. Затем они принесли перед Яхве всесожжения и мирные жертвы[b].
  to: Тогда все сыны Израиля и весь народ поднялись и пришли в Вефиль. Они плакали, сидели там перед Яхве и в тот день постились до вечера. Затем они принесли перед Яхве всесожжения и мирные жертвы[a].
