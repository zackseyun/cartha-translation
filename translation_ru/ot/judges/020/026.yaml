source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ כָל בְּנֵי֩ יִשְׂרָאֵ֨ל וְ/כָל הָ/עָ֜ם וַ/יָּבֹ֣אוּ בֵֽית אֵ֗ל וַ/יִּבְכּוּ֙ וַ/יֵּ֤שְׁבוּ שָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּצ֥וּמוּ בַ/יּוֹם הַ/ה֖וּא עַד הָ/עָ֑רֶב וַֽ/יַּעֲל֛וּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
translation:
  language: ru
  text: Тогда все сыны Израиля и весь народ поднялись и пришли в Вефиль. Они плакали, сидели там перед Яхве и в тот день постились до вечера. Затем они принесли перед Яхве всесожжения и мирные жертвы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «жертвы общения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: поднялись
  rationale: Сохраняет направительное значение глагола עלה в повествовании о пути; по-русски естественно передаёт движение к месту назначения, расположенному выше.
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  choice: все сыны Израиля и весь народ
  rationale: Сохраняет родственно-национальное выражение בני ישראל и повторное, усилительное упоминание всего народа, не сводя две части к одной.
- source_word: בֵית אֵל
  choice: Вефиль
  rationale: Передаёт название места в принятой русской библейской форме; возможное понимание как нарицательного сочетания «дом Божий» отмечено в сноске.
- source_word: וַיִּבְכּוּ
  choice: плакали
  rationale: Прямо и естественно передаёт плач народа после поражения, не добавляя сверх текста значения ритуального причитания.
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  choice: сидели там перед Яхве
  rationale: Сохраняет конкретное значение ישב «сидеть», хотя в данном контексте возможно более общее «оставаться».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וַיָּצוּמוּ
  choice: постясь
  rationale: Глагол צום обозначает воздержание от пищи как выражение скорби и обращения к Богу; деепричастная конструкция естественно связывает одновременные действия.
- source_word: בַיּוֹם הַהוּא עַד הָעָרֶב
  choice: в тот день до вечера
  rationale: Точно сохраняет указанную в еврейском тексте продолжительность поста.
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: принесли всесожжения
  rationale: В сочетании с названиями жертв форма глагола עלה имеет каузативное значение принесения жертвы; «принесли» звучит естественно в современном русском библейском повествовании.
- source_word: שְׁלָמִים
  choice: мирные жертвы
  rationale: Традиционный и точный русский эквивалент названия жертв שלמים; их аспект общения и совместной трапезы отражён в сноске.
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Передача национального обозначения בני ישראל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Формулировка сохраняет семейно-родовой образ еврейского выражения, не исключая того, что речь идёт обо всём народе.
- issue: Понимание בֵית אֵל
  choice: Вефиль
  alternative: дом Божий
  rationale: В контексте повествования вероятнее название места, однако еврейское написание допускает буквальное прочтение, поэтому неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Повтор «все сыны Израиля и весь народ» сохранён как намеренное усиление оригинала; имя «Яхве» передано непосредственно.
