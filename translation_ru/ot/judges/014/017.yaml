  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
translation:
  language: ru
  text: Все семь дней, пока продолжался пир, она плакала перед ним[a]. На седьмой день он сообщил ей разгадку, потому что она настойчиво донимала его. Тогда она сообщила разгадку мужчинам из её народа[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плакала на нём»; еврейский оборот описывает плач, направленный на него, и подразумевает продолжительное эмоциональное давление.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынам её народа». В данном контексте это, вероятно, мужчины из её народа — филистимляне, участвовавшие в пире.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ עָלָיו
  choice: она плакала перед ним
  rationale: בכה означает «плакать», а сочетание с עַל направляет плач на Самсона и в контексте передаёт продолжительное эмоциональное давление. Естественное русское «плакала перед ним» сохраняет направленность действия; оттенок давления пояснён в сноске.
- source_word: שִׁבְעַת הַיָּמִים אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה
  choice: все семь дней, пока продолжался пир
  rationale: Конструкция обозначает семь дней празднества. «Все семь дней» передаёт определённость и полноту периода, а придаточное с «пока» естественно выражает его совпадение с длительностью пира.
- source_word: וַיַּגֶּד לָהּ
  choice: он открыл ей ответ
  rationale: נגד означает «сообщить, открыть, сделать известным». Объект в еврейском тексте подразумевается; по контексту Самсон сообщил разгадку своей загадки. «Открыл ей ответ» ясно и естественно передаёт смысл, не предполагая подробного объяснения.
- source_word: כִּי הֱצִיקַתְהוּ
  choice: потому что она не давала ему покоя
  rationale: Форма от צוק выражает сильное, настойчивое давление. Русский оборот передаёт непрерывность её домогательств без неуместно технического или чрезмерно резкого оттенка.
- source_word: וַתַּגֵּד הַחִידָה
  choice: она сообщила разгадку
  rationale: Буквально сказано «сообщила загадку», но в данном контексте речь идёт о передаче разгадки или ответа. Такая формулировка предотвращает неверное понимание, будто она лишь повторила условие загадки.
- source_word: לִבְנֵי עַמָּהּ
  choice: сынам своего народа
  rationale: Формально сохранено בני «сыны». В контексте выражение, вероятно, обозначает мужчин из её народа, однако более широкая идиоматическая возможность оставлена в сноске.
