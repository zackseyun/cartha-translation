  text: וְ/אָבִ֨י/ו וְ/אִמּ֜/וֹ לֹ֣א יָדְע֗וּ כִּ֤י מֵ/יְהוָה֙ הִ֔יא כִּי תֹאֲנָ֥ה הֽוּא מְבַקֵּ֖שׁ מִ/פְּלִשְׁתִּ֑ים וּ/בָ/עֵ֣ת הַ/הִ֔יא פְּלִשְׁתִּ֖ים מֹשְׁלִ֥ים בְּ/יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
translation:
  language: ru
  text: Но его отец и мать не знали, что это было от Яхве[a] и что он искал повода против филистимлян[b]. В то время филистимляне господствовали над Израилем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «и что Он искал повода против филистимлян», где «Он» относится к Яхве. Еврейский текст допускает такое понимание, хотя контекст скорее указывает на Самсона.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «предлога» или «удобного случая» против филистимлян. Буквально предлог можно передать как «от филистимлян».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיְהוָה
  choice: от Яхве
  rationale: Передаёт исходный предлог מִן и личное заветное имя Бога; транслитерация сохраняет отличие имени יהוה от титула «Господь».
- source_word: הִיא
  choice: это было
  rationale: Местоимение женского рода отсылает к обсуждаемому обстоятельству — намерению Самсона жениться на филистимлянке; безличное «это» естественно по-русски.
- source_word: תֹאֲנָה
  choice: повода
  rationale: Слово обозначает повод, предлог или удобный случай для действия. «Повод» сохраняет смысловую широту и не приписывает Самсону непременно неискренний предлог.
- source_word: מְבַקֵּשׁ
  choice: искал
  rationale: Причастная форма выражает продолжающееся действие; в русском повествовании несовершенный вид «искал» естественно передаёт эту длительность.
- source_word: מִפְּלִשְׁתִּים
  choice: выступить против филистимлян
  rationale: Буквально предлог допускает «от филистимлян», но в сочетании с תֹאֲנָה контекст указывает на повод для направленного против них действия. Добавление «выступить» делает подразумеваемое действие ясным, не уточняя его сверх текста.
- source_word: וּבָעֵת הַהִיא
  choice: В то время
  rationale: Естественный русский временной переход, точно передающий обстоятельство времени.
- source_word: מֹשְׁלִים בְּיִשְׂרָאֵל
  choice: господствовали над Израилем
  rationale: Передаёт продолжительное политическое владычество, выраженное причастием משל с предлогом ב.
- source_word: וְאָבִיו וְאִמּוֹ
  choice: его отец и мать
  rationale: Естественное русское согласование без ненужного повторения притяжательного местоимения.
- source_word: לֹא יָדְעוּ
  choice: не знали
  rationale: Прямой и прозрачный эквивалент формы ידע в данном контексте.
theological_decisions:
- issue: Божественное участие в намерении Самсона и последующем столкновении
  choice: Стих утверждает, что происходящее было от Яхве, и одновременно представляет Самсона ищущим повод против филистимлян.
  alternative: Либо Яхве исчерпывающе обусловил желание Самсона, либо только впоследствии использовал совершенно независимый человеческий выбор.
  rationale: Еврейский текст соединяет божественное происхождение происходящего с человеческим действием, не объясняя их соотношение. Перевод сохраняет это напряжение и не навязывает богословской системы.
- issue: К кому относится «он искал»
  choice: В основном тексте «он» понимается как Самсон.
  alternative: «Он» может относиться к Яхве.
  rationale: Широкий повествовательный контекст естественнее указывает на Самсона, который посредством брака ищет возможность действовать против филистимлян. Однако грамматика допускает отнесение к Яхве, поэтому этот вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Имя יהוה передано как «Яхве» согласно предоставленному консультационному тексту; богословская и грамматическая неоднозначность субъекта сохранена в сноске.
