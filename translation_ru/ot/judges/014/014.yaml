translation_notes:
  register: Современный литературный русский язык с кратким, запоминающимся построением загадки. Пара «едок — еда» сохраняет корневой повтор оригинала; «сильного» оставляет образ намеренно нераскрытым. Маркеры примечаний поставлены непосредственно при словах и выражениях, к которым относятся.
