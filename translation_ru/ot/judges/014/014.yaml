  - marker: b
    text: 'Или: «объяснить загадку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: И сказал он им
  rationale: Передаёт обычное повествовательное продолжение с wayyiqtol и явно сохраняет местоименный субъект, присутствующий в еврейской глагольной форме.
- source_word: מֵהָאֹכֵל ... מַאֲכָל
  choice: Из едока вышла еда
  rationale: «Едок» передаёт субстантивированное причастие «тот, кто ест», а «еда» — существительное «пища». Однокоренные русские слова сохраняют намеренную словесную связь אכל—מַאֲכָל и краткость загадки.
- source_word: יָצָא
  choice: вышла / вышло
  rationale: Глагол «выйти» непосредственно передаёт образ появления чего-либо изнутри; формы согласованы с русским родом слов «еда» и «сладкое».
- source_word: וּמֵעַז
  choice: и из сильного
  rationale: Субстантивированное «сильный» сохраняет лаконичность и неоднозначность עַז, не уточняя заранее, что имеется в виду свирепый лев.
- source_word: מָתוֹק
  choice: сладкое
  rationale: Субстантивированное прилагательное естественно передаёт нечто сладкое и не вводит более конкретное «сладость» или «мёд», которого в самой загадке нет.
- source_word: לְהַגִּיד הַחִידָה
  choice: разгадать загадку
  rationale: В данном контексте естественное русское выражение означает найти и сообщить решение загадки; примечание сохраняет более буквальную возможность «объяснить».
- source_word: שְׁלֹשֶׁת יָמִים
  choice: три дня
  rationale: Естественно выражает указанную в еврейском тексте продолжительность, не навязывая значения «в течение первых трёх дней» или «за три дня».
