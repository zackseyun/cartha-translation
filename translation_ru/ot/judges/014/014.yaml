  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
translation:
  language: ru
  text: 'И сказал он им: «Из едока вышла еда, и из сильного[a] вышло сладкое». Но три дня они не могли разгадать загадку[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
