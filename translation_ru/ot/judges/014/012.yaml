base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
translation:
  language: ru
  text: 'И сказал им Самсон: «Позвольте, я загадаю вам загадку. Если за семь дней пира вы верно назовёте мне разгадку и разгадаете её, то я дам вам тридцать льняных одежд[a] и тридцать смен одежды».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точный вид названных здесь предметов одежды неизвестен. Еврейское слово, вероятно, обозначает льняные накидки или нижние одежды.
    reason: cultural_note
lexical_decisions:
- source_word: אָחֽוּדָה נָּא
  choice: Позвольте, я загадаю
  rationale: Когортатив с נָא выражает вежливое предложение; по-русски загадку естественно «загадывают».
- source_word: חִידָה
  choice: загадку
  rationale: В данном состязательном контексте существительное обозначает именно загадку.
- source_word: אִם הַגֵּד תַּגִּידוּ אוֹתָהּ לִי
  choice: Если вы… верно разгадаете её и скажете мне ответ
  rationale: Инфинитив абсолютный усиливает глагол «сказать/объяснить». Формулировка передаёт и требование найти разгадку, и сообщить её Самсону, не превращая условие в утверждение о способности.
- source_word: שִׁבְעַת יְמֵי הַמִּשְׁתֶּה
  choice: за семь дней пира
  rationale: Предлог в исходном тексте отсутствует; контекст задаёт срок, ограниченный семью днями свадебного пира.
- source_word: וּמְצָאתֶם
  choice: разгадаете
  rationale: Буквально «найдёте»; применительно к загадке естественный русский эквивалент — «разгадаете».
- source_word: שְׁלֹשִׁים סְדִינִים
  choice: тридцать льняных одежд
  rationale: סְדִינִים обозначает предметы одежды из льняной ткани, однако их точный вид неясен.
- source_word: שְׁלֹשִׁים חֲלִפֹת בְּגָדִים
  choice: тридцать смен праздничной одежды
  rationale: Сочетание обозначает сменные комплекты одежды; «праздничной» передаёт ценность и характер награды в контексте, не сводя её к отдельным предметам.
- source_word: וְנָתַתִּי לָכֶם
  choice: то я дам вам
  rationale: Союз вводит следствие условной конструкции, которое в русском естественно оформляется парой «если… то».
