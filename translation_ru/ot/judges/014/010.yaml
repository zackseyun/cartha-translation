  text: So his father went down to the woman[a], and Samson made a feast there, for that is what the young men did.
translation:
  language: ru
  text: Отец Самсона спустился к той женщине, а Самсон устроил там пир[a], ибо так поступали молодые люди.
  philosophy: optimal-equivalence
