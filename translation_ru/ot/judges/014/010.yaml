    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: спустился
  rationale: Сохраняет направительное значение глагола ירד — «спускаться, идти вниз», характерное для еврейского повествования.
- source_word: אָבִיהוּ
  choice: его отец
  rationale: Местоименный суффикс мужского рода единственного числа в данном контексте относится к Самсону.
- source_word: אֶל הָאִשָּׁה
  choice: к женщине
  rationale: Передаёт буквальное обозначение הָאִשָּׁה, не подменяя его контекстуально возможными «к невесте» или «к жене».
- source_word: וַיַּעַשׂ שָׁם ... מִשְׁתֶּה
  choice: а Самсон устроил там пир
  rationale: В сочетании с מִשְׁתֶּה широкий глагол עשה естественно передаётся по-русски как «устроил»; «там» сохраняет שָׁם.
- source_word: מִשְׁתֶּה
  choice: пир
  rationale: Слово обозначает праздничную трапезу или пиршество, обычно с вином; «пир» кратко и естественно передаёт основной смысл без излишнего уточнения.
- source_word: כִּי כֵּן יַעֲשׂוּ הַבַּחוּרִים
  choice: потому что так поступали юноши
  rationale: Имперфект выражает обычную практику; прошедшее «поступали» естественно согласуется с повествованием, а «юноши» передаёт הַבַּחוּרִים.
