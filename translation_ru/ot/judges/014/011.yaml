    rationale: Русское «взять товарищей» обычно означает взять их с собой и не показывает, что эти тридцать были предоставлены Самсону как сопровождающие. Конструкция «взяли для него ... в спутники» передаёт контекстуальную функцию людей и остаётся близкой к לקח.
  revised_text: И когда они увидели его, они взяли для него тридцать человек в спутники, и те были с ним.
