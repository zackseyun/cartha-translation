- from: И когда они увидели его, то взяли тридцать товарищей[a], и те были с ним.
  to: И когда они увидели его, они взяли для него тридцать человек в спутники, и те были с ним.
  rationale: Исправлена русская двусмысленность при глаголе «взяли». Добавление «для него» и «в спутники» выражает отношение, которое ясно из непосредственного контекста и заключительного «были с ним», не утверждая конкретного институционального статуса. Примечание сокращено и сохранено как осторожная лексико-контекстуальная альтернатива.
