  text: And when they saw him[a], they took thirty companions, and they were with him.
translation:
  language: ru
  text: И когда они увидели его, они взяли для него тридцать человек в спутники, и те были с ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: И
  rationale: Форма продолжает повествование; простое «И» естественно передаёт последовательность событий без тяжеловесного «и случилось».
- source_word: כִּרְאוֹתָם
  choice: когда они увидели
  rationale: Предлог כ с инфинитивом ראה и местоименным суффиксом имеет временное значение.
- source_word: אֹתוֹ
  choice: его
  rationale: Местоимение прямого дополнения относится к Самсону.
- source_word: וַיִּקְחוּ
  choice: взяли
  rationale: Сохранено основное значение לקח; в данном контексте речь идёт о выборе или назначении людей, которые должны были находиться при Самсоне.
- source_word: שְׁלֹשִׁים
  choice: тридцать
  rationale: Прямая передача количественного числительного.
- source_word: מֵרֵעִים
  choice: товарищей
  rationale: Слово обозначает близких людей, приятелей или спутников; «товарищи» не утверждает ни личной дружбы, ни строго определённой свадебной должности.
- source_word: וַיִּהְיוּ אִתּוֹ
  choice: и те были с ним
  rationale: Передана простая конструкция «были с ним»; указательное «те» естественно связывает сказуемое с только что упомянутыми тридцатью товарищами.
