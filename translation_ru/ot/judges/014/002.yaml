base_translation:
  language: en
  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
translation:
  language: ru
  text: 'Он поднялся и рассказал об этом отцу и матери. Он сказал: «Я увидел в Фимне женщину из филистимлянок. Теперь возьмите её мне в жёны».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: Он поднялся
  rationale: Сохраняет основное пространственное значение עלה — «подниматься, идти вверх», не добавляя отсутствующих в тексте географических пояснений.
- source_word: וַיַּגֵּד לְאָבִיו וּלְאִמּוֹ
  choice: и рассказал об этом отцу и матери
  rationale: Глагол נגד в породе хифиль означает «сообщить, рассказать». Местоименное «об этом» естественно по-русски обозначает последующее содержание сообщения, не меняя его смысла.
- source_word: אִשָּׁה
  choice: женщину
  rationale: Здесь אִשָּׁה означает женщину, которую Самсон лишь увидел; значение «жена» становится уместным только в последующей просьбе о браке.
- source_word: בְתִמְנָתָה
  choice: в Фимне
  rationale: Передаёт местное значение формы и использует традиционную русскую форму библейского топонима.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: из филистимлянок
  rationale: Естественно передаёт партитивный смысл — одну женщину из числа дочерей/женщин филистимлян — без тяжеловесного буквального оборота.
- source_word: וְעַתָּה
  choice: Теперь
  rationale: Обозначает переход от сообщения к настойчивой просьбе; союзное ו в русском повествовании не требует отдельного воспроизведения.
- source_word: קְחוּ אוֹתָהּ לִּי לְאִשָּׁה
  choice: возьмите её мне в жёны
  rationale: Сохраняет форму множественного числа повеления, обращённого к обоим родителям, личную заинтересованность «мне» и брачную формулу «в жёны».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно формальным библейским достоинством. Синтаксис разделён на два предложения ради естественности; повтор подлежащего отражает еврейское וַיֹּאמֶר. Формула «возьмите её мне в жёны» намеренно сохраняет культурную дистанцию и роль родителей в заключении брака.
