base_translation:
  language: en
  yaml_path: translation/ot/judges/014/006.yaml
  text: Then the Spirit of Yahweh rushed upon him[a], and he tore it apart as one tears apart a young goat, though he had nothing in his hand[b]. But he did not tell his father or his mother what he had done.
translation:
  language: ru
  text: И Дух Яхве с силой сошёл на него[a], и он разорвал льва, как разрывают козлёнка[b], хотя в руке у него ничего не было. Но он не рассказал ни отцу, ни матери о том, что сделал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могущественно подействовал на него».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как разрывают молодого козла», то есть козлёнка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו
  choice: мощно сошёл на него
  rationale: Сочетание צלח с עַל описывает внезапное и исполненное силы действие Духа на человека. Формулировка сохраняет образ нисхождения и передаёт усиливающий оттенок глагола.
- source_word: רוּחַ יְהוָה
  choice: Дух Яхве
  rationale: В данном контексте רוּחַ обозначает Божьего Духа, наделяющего Самсона необычайной силой; имя יְהוָה передано как «Яхве».
- source_word: וַיְשַׁסְּעֵהוּ
  choice: он разорвал льва
  rationale: Глагол שׁסע означает разорвать или рассечь. Объект выражен местоименным суффиксом и из контекста обозначает льва; повтор существительного в русском устраняет неясность.
- source_word: כְּשַׁסַּע הַגְּדִי
  choice: как разрывают козлёнка
  rationale: Безлично-обобщённая конструкция естественно передаёт сравнение по лёгкости или способу действия. «Козлёнок» точно и понятно передаёт הַגְּדִי.
- source_word: וּמְאוּמָה אֵין בְּיָדוֹ
  choice: хотя в руке у него ничего не было
  rationale: 'Придаточное с «хотя» естественно выражает подразумеваемое противопоставление: Самсон совершил это без оружия или орудия.'
- source_word: וְלֹא הִגִּיד לְאָבִיו וּלְאִמּוֹ
  choice: Но он не рассказал ни отцу, ни матери
  rationale: Русская отрицательная конструкция «ни… ни…» точно показывает, что Самсон не сообщил об этом ни одному из родителей; «но» передаёт лёгкий повествовательный контраст.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: о том, что сделал
  rationale: Естественная русская передача относительной конструкции, относящейся к уже совершённому поступку.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо употреблено личное имя Бога — тетраграмматон; транслитерация «Яхве» сохраняет это различие и не заменяет имя титулом.
- issue: Характер действия Духа
  choice: Дух Яхве мощно сошёл на него
  alternative: Дух Яхве овладел им
  rationale: Перевод передаёт внезапное наделение силой, не добавляя идеи подавления воли или одержимости, которой сама конструкция не требует.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранена торжественность упоминания Духа и Божьего имени, но исключены архаизмы; необычайность поступка подчёркнута без дополнительных толкований.
