revisions:
- from: И Дух Яхве мощно сошёл на него. Он спустился в Ашкелон, убил там тридцать человек из их числа, снял с них одежду[a] и отдал комплекты одежды тем, кто разгадал загадку. Он пылал гневом и поднялся в дом своего отца.
  to: И Дух Яхве с силой сошёл на него. Он спустился в Ашкелон, убил тридцать человек из них, взял их одежду[a] и отдал комплекты одежды тем, кто разгадал загадку. Он пылал гневом и поднялся к дому своего отца.
  rationale: Правка устраняет излишнюю конкретизацию способа завладения одеждой, делает русскую формулировку более естественной и сохраняет исходную неоднозначность существительного חֲלִיצוֹת через сноску. Партитивное «из них» оставлено без уточнения референта, как в еврейском тексте.
