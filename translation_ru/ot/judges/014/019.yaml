base_translation:
  language: en
  yaml_path: translation/ot/judges/014/019.yaml
  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
translation:
  language: ru
  text: И Дух Яхве с силой сошёл на него. Он спустился в Ашкелон, убил тридцать человек из них, взял их одежду[a] и отдал комплекты одежды тем, кто разгадал загадку. Он пылал гневом и поднялся к дому своего отца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать одежду, снятую с убитых и взятую как добыча.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: Дух Яхве мощно сошёл на него
  rationale: Сочетание צלח с רוּחַ יְהוָה в книге Судей обозначает внезапное и сильное действие Божьего Духа. «Мощно сошёл» передаёт силу события естественным современным русским языком, не добавляя нравственной оценки последующих поступков Самсона.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача личного имени Бога транслитерацией сохраняет различие между именем Яхве и титулом «Господь».
- source_word: וַיֵּרֶד אַשְׁקְלוֹן
  choice: спустился в Ашкелон
  rationale: Глагол ירד буквально обозначает движение вниз; русское «спустился в Ашкелон» естественно сохраняет направление.
- source_word: וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  choice: убил там тридцать человек из их числа
  rationale: В данном контексте נכה означает нанесение смертельного удара. Оборот «из их числа» передаёт партитивное מֵהֶם, а «там» естественно связывает людей с жителями Ашкелона.
- source_word: חֲלִיצוֹתָם
  choice: снял с них одежду
  rationale: Слово обозначает одежду, снятую с убитых и взятую как добычу. Глагольная русская формулировка ясно и без неестественного сложного термина передаёт этот смысл.
- source_word: הַחֲלִיפוֹת
  choice: комплекты одежды
  rationale: В контексте заключённого пари речь идёт о полных сменах или комплектах одежды. «Комплекты одежды» понятно современному читателю и избегает устаревшего оборота «перемены одежд».
- source_word: לְמַגִּידֵי הַחִידָה
  choice: тем, кто разгадал загадку
  rationale: Причастие נגד указывает на тех, кто сообщил правильное решение загадки; по-русски это естественно выражается как «разгадал загадку».
- source_word: וַיִּחַר אַפּוֹ
  choice: он пылал гневом
  rationale: Формулировка сохраняет еврейский образ горящего гнева и при этом звучит естественно и выразительно на современном литературном русском.
- source_word: וַיַּעַל בֵּית אָבִיהוּ
  choice: поднялся в дом своего отца
  rationale: Перевод сохраняет буквальное направление глагола עלה и не заменяет его истолковывающим «вернулся».
theological_decisions:
- issue: Действие Духа Яхве и последующее насилие
  choice: Дух Яхве мощно сошёл на него
  alternative: Дух Яхве овладел им
  rationale: Выбранная формулировка утверждает сообщаемое текстом Божье наделение силой, но не превращает его в прямое одобрение каждого последующего действия Самсона. Так сохраняется богословское напряжение повествования.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Сохранены динамика цепочки действий, личное имя Яхве, образ пылающего гнева и направительные глаголы «спустился»/«поднялся». Маркер [a] поставлен непосредственно при выражении, которое поясняет сноска.
