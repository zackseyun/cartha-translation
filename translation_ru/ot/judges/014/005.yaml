lexical_decisions:
- source_word: וַיֵּרֶד
  choice: пошёл… вниз
  rationale: Сохраняет направительное значение ירד и естественно описывает путь из нагорья к Фимне.
- source_word: תִּמְנָתָה
  choice: в Фимну
  rationale: Направительное -ה указывает на движение к месту назначения; по-русски это естественно передаётся предлогом «в» с винительным падежом.
- source_word: וַיָּבֹאוּ עַד
  choice: когда они дошли до
  rationale: Передаёт достижение определённого пункта пути, обозначенное сочетанием בוא и עַד, при этом естественно связывает части русского повествования.
- source_word: כַּרְמֵי תִמְנָתָה
  choice: виноградников Фимны
  rationale: Прямо и естественно передаёт конструкцию со значением принадлежности или связи с местностью.
- source_word: וְהִנֵּה
  choice: вдруг
  rationale: В данном повествовательном контексте הִנֵּה вводит неожиданное и яркое событие; «вдруг» естественно выполняет эту функцию в современном русском языке.
- source_word: כְּפִיר אֲרָיוֹת
  choice: молодой лев
  rationale: כְּפִיר означает молодого льва, а не маленького львёнка; необычное сочетание с אֲרָיוֹת имеет идиоматический или усилительный характер.
- source_word: שֹׁאֵג לִקְרָאתוֹ
  choice: навстречу ему с рычанием вышел
  rationale: Передаёт продолжающееся рычание и движение навстречу Самсону, не уточняя сверх текста, было ли это прямым нападением.
