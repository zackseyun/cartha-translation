base_translation:
  language: en
  yaml_path: translation/ot/judges/014/013.yaml
  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
translation:
  language: ru
  text: 'Но если вы не сможете назвать мне разгадку, то отдадите мне тридцать льняных одеяний[a] и тридцать смен одежды». Они сказали ему: «Загадывай свою загадку, послушаем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «льняных полотнищ». Еврейское слово может обозначать изделия из тонкого льна; здесь, вероятно, имеются в виду предметы одежды, как и в следующем выражении.'
    reason: Лексическая неоднозначность слова סְדִינִים.
lexical_decisions:
- source_word: תוּכְלוּ
  choice: не сможете
  rationale: Глагол יכל выражает способность; в условной конструкции естественное русское будущее «не сможете» передаёт предполагаемую неспособность.
- source_word: לְהַגִּיד לִי
  choice: разгадать её для меня
  rationale: Буквально выражение означает «сообщить мне», однако в контексте загадки речь идёт о сообщении разгадки. Русское «разгадать» естественно передаёт требуемое действие; местоимение «её» имеет своим антецедентом загадку из предыдущего стиха.
- source_word: וּנְתַתֶּם אַתֶּם לִי
  choice: то отдадите мне
  rationale: Перфект с союзом после условной части обозначает обязательное следствие пари. «Отдадите» сохраняет форму обещанного результата без избыточного модального усиления.
- source_word: סְדִינִים
  choice: льняных одеяний
  rationale: Термин обозначает предметы из тонкого льна, вероятно носимые; «одеяния» соответствует параллели с комплектами одежды и не вызывает современного значения постельных простыней.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: перемен одежды
  rationale: Устойчивое библейское выражение обозначает сменные комплекты одежды. «Перемены одежды» точно и понятно в данном торжественном повествовательном регистре.
- source_word: חוּדָה חִידָתְךָ
  choice: Загадывай свою загадку
  rationale: Императив חוד здесь означает предложить или загадать загадку. Однокоренное русское сочетание естественно и сохраняет словесную форму оригинала.
- source_word: וְנִשְׁמָעֶנָּה
  choice: послушаем
  rationale: Когортатив первого лица множественного числа с суффиксом женского рода выражает побуждение услышать загадку. Разговорное в хорошем литературном смысле «послушаем» кратко передаёт волевой оттенок.
