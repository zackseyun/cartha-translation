base_translation:
  language: en
  yaml_path: translation/ot/judges/014/016.yaml
  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: ru
  text: 'Жена Самсона плакала перед ним и говорила: «Ты меня только ненавидишь, а не любишь! Ты загадал загадку мужчинам из моего народа[a], а мне не рассказал». Он ответил ей: «Вот, я не рассказал её ни отцу, ни матери — так неужели расскажу тебе?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сынам моего народа». В данном контексте имеются в виду мужчины из её народа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ ... עָלָיו
  choice: плакала перед ним
  rationale: בכה означает «плакать», а сочетание с עַל при обозначении лица здесь передаёт плач в присутствии Самсона и направленное на него эмоциональное воздействие. «Перед ним» естественно по-русски и не усиливает образ сверх текста.
- source_word: רַק שְׂנֵאתַנִי וְלֹא אֲהַבְתָּנִי
  choice: Ты меня только ненавидишь, а не любишь!
  rationale: Сохранено прямое противопоставление «ненавидеть — любить»; רַק передаётся словом «только», усиливающим обвинение.
- source_word: הַחִידָה חַדְתָּ
  choice: Ты загадал загадку
  rationale: Однокоренное русское сочетание идиоматично и точно передаёт постановку загадки, хотя повтор звучит заметно, как и смысловая связка в еврейском тексте.
- source_word: לִבְנֵי עַמִּי
  choice: мужчинам из моего народа
  rationale: Буквально «сынам моего народа». В свадебном контексте мужская форма, вероятно, указывает на мужчин-филистимлян, которым была предложена загадка; перевод сохраняет гендерную определённость и звучит естественно.
- source_word: וְלִי לֹא הִגַּדְתָּה
  choice: а мне не рассказал
  rationale: Глагол נגד в породе hifil означает «сообщить, рассказать». Противительное «а» естественно выражает подчёркнутое сопоставление с предыдущей группой.
- source_word: הִנֵּה
  choice: Вот
  rationale: «Вот» сохраняет функцию привлечения внимания и эмфатического введения ответа без архаического оттенка.
- source_word: לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי
  choice: я не рассказал её ни отцу, ни матери
  rationale: Русская отрицательная конструкция требует «ни… ни»; местоимение «её» естественно отсылает к загадке.
- source_word: וְלָךְ אַגִּיד
  choice: так неужели расскажу тебе?
  rationale: Формально «и тебе расскажу?». Контекст ясно задаёт риторический вопрос; «так неужели» передаёт его силу, не разрешая дальнейшее повествовательное напряжение.
