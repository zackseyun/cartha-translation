- source_word: וַתְּהִי
  choice: стала
  rationale: 'Форма היה с повествовательным ва́вом обозначает здесь перемену положения: жена Самсона перешла к другому мужчине.'
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: жена Самсона
  rationale: Сопряжённая конструкция прямо выражает брачное отношение и естественно передаётся по-русски родительным падежом.
- source_word: לְמֵרֵעֵהוּ
  choice: женой его дружки
  rationale: Предлог ל при היה выражает новое отношение принадлежности или статуса. Существительное מֵרֵעַ обозначает близкого спутника или товарища; в свадебном контексте «дружка» естественно указывает на сопровождавшего жениха участника свадьбы.
- source_word: אֲשֶׁר רֵעָה לוֹ
  choice: который был его другом
  rationale: Глагол из группы רעה здесь обозначает дружеское общение или товарищество, а не выпас скота. Формулировка сохраняет игру родственными словами настолько, насколько это допускает естественный русский язык.
