base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
translation:
  language: ru
  text: 'Но отец и мать сказали ему: «Неужели среди дочерей твоих братьев[a] или среди всего моего народа нет женщины, и ты идёшь брать себе жену из необрезанных филистимлян?» Самсон же сказал отцу: «Возьми её мне в жёны, потому что она хороша в моих глазах[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «дочери твоих братьев» здесь, вероятно, означает женщин из родственного круга или народа Самсона, а не только дочерей его родных братьев.
    reason: cultural_note
  - marker: b
    text: 'Или: «она мне по душе»; «она кажется мне подходящей». Еврейское выражение передаёт личное одобрение или привлекательность; буквальный образ «в моих глазах» также перекликается с повторяющейся темой книги Судей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵין
  choice: неужели … нет
  rationale: Передаёт отрицательный риторический вопрос естественной современной русской конструкцией.
- source_word: בִּבְנוֹת אַחֶיךָ
  choice: среди дочерей твоих братьев
  rationale: Сохраняет родственную образность еврейского текста; широкий клановый смысл пояснён в сноске.
- source_word: וּבְכָל עַמִּי
  choice: или среди всего моего народа
  rationale: Сохранено местоимение первого лица единственного числа, буквально присутствующее в масоретском тексте, несмотря на совместную речь родителей.
- source_word: הוֹלֵךְ לָקַחַת אִשָּׁה
  choice: идёшь брать себе жену
  rationale: Сохраняет конструкцию движения с инфинитивом и ясно передаёт брачный смысл слова אִשָּׁה в данном контексте.
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  choice: у необрезанных филистимлян
  rationale: Не смягчает значимый для израильской речи эпитет «необрезанные» и естественно передаёт происхождение будущей жены.
- source_word: אוֹתָהּ קַח לִי
  choice: возьми её мне в жёны
  rationale: Передаёт повеление отцу устроить брак; добавление «в жёны» эксплицирует несомненный контекстуальный смысл без изменения содержания.
- source_word: יָשְׁרָה בְעֵינַי
  choice: она хороша в моих глазах
  rationale: Сохраняет образ «в моих глазах» и выражает личное одобрение, не создавая в русском ложного впечатления, будто Самсон утверждает, что женщина права в споре.
theological_decisions:
- issue: Тематическая перекличка יָשְׁרָה בְעֵינַי с формулой книги Судей о правильном в собственных глазах
  choice: она хороша в моих глазах
  alternative: она мне по душе; она кажется мне подходящей
  rationale: Основной текст сохраняет мотив «в глазах», позволяющий услышать перекличку с повторяющейся формулой книги, но не навязывает однозначно моральную оценку там, где выражение может обозначать привлекательность или личную пригодность.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис риторического вопроса перестроен ради естественности, при этом сохранены «мой народ», эпитет «необрезанные» и ключевой образ «в моих глазах».
