base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
translation:
  language: ru
  text: 'И на седьмой день мужчины из города сказали ему, прежде чем зашло солнце[a]: «Что слаще мёда и что сильнее льва?» Он ответил им: «Если бы вы не пахали моей тёлкой[b], то не разгадали бы мою загадку».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «прежде чем солнце вошло» — древнееврейский оборот со значением «до заката».'
    reason: lexical_alternative
  - marker: b
    text: Самсон метафорически называет тёлкой свою жену и обвиняет этих людей в том, что они воспользовались ею, чтобы разгадать загадку.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: жители города
  rationale: Естественное современное обозначение горожан; по контексту речь идёт о мужчинах, участвовавших в пире, но буквальное «мужчины города» по-русски звучит тяжеловесно.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: в седьмой день
  rationale: Формально близкая и естественная передача временного выражения.
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  choice: прежде чем зашло солнце
  rationale: Передаёт смысл древнееврейского оборота о наступлении заката, сохраняя образ движения солнца.
- source_word: מַה מָּתוֹק מִדְּבַשׁ
  choice: что слаще мёда
  rationale: Предлог מִן имеет сравнительное значение; формулировка естественна для русской загадки.
- source_word: וּמֶה עַז מֵאֲרִי
  choice: и что сильнее льва
  rationale: עַז допускает значения силы, мощи и свирепости; «сильнее» лучше всего соответствует параллельной сравнительной конструкции.
- source_word: לוּלֵא
  choice: если бы ... не
  rationale: 'Передаёт контрфактическое условие: ответ не был бы найден без совершённого ими действия.'
- source_word: חֲרַשְׁתֶּם בְּעֶגְלָתִי
  choice: вы не пахали моей тёлкой
  rationale: 'Сохранена резкая сельскохозяйственная метафора: жена Самсона представлена как тёлка, которую они использовали, чтобы добиться ответа.'
- source_word: לֹא מְצָאתֶם חִידָתִי
  choice: не разгадали бы моей загадки
  rationale: Буквальное «не нашли бы» в данном контексте означает не обнаружить разгадку; «разгадали» ясно и естественно передаёт смысл.
