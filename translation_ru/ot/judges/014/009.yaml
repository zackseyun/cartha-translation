base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
translation:
  language: ru
  text: Он выгреб мёд в ладони[a] и пошёл дальше, поедая его на ходу. Потом он пришёл к отцу и матери, дал им мёда, и они ели. Но он не сказал им, что выгреб этот мёд из трупа льва.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вычерпал мёд руками» или «достал мёд»; еврейский глагол указывает на извлечение мёда рукой из львиного трупа.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ
  choice: Он выгреб мёд
  rationale: Глагол רדה здесь обозначает извлечение мёда изнутри львиного трупа рукой; «выгреб» передаёт конкретное физическое действие и сохраняет его повтор во второй части стиха.
- source_word: אֶל כַּפָּיו
  choice: себе в ладони
  rationale: כַּף буквально означает ладонь; форма множественного числа указывает на обе ладони, а возвратное «себе» естественно передаёт принадлежность.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  choice: пошёл дальше, по дороге поедая его
  rationale: 'Сочетание личной формы с инфинитивами передаёт продолжающееся действие: Самсон шёл и ел мёд на ходу.'
- source_word: וַיֵּלֶךְ אֶל אָבִיו וְאֶל אִמּוֹ
  choice: Потом он пришёл к отцу и матери
  rationale: הלך допускает передачу движения к лицам как «пришёл к»; «потом» естественно выражает последовательность повествования.
- source_word: וַיִּתֵּן לָהֶם
  choice: дал им мёда
  rationale: Контекстуальный объект — часть мёда; родительный партитивный после «дал» естественно передаёт подразумеваемое количество.
- source_word: וַיֹּאכֵלוּ
  choice: и они ели
  rationale: Несовершенный вид сохраняет простую повествовательную форму и не добавляет отсутствующего в еврейском тексте объекта.
- source_word: וְלֹא הִגִּיד לָהֶם
  choice: Но он не сказал им
  rationale: «Сказал» — естественный эквивалент נגד в данной конструкции; «но» передаёт контраст с тем, что родители приняли и ели мёд.
- source_word: מִגְּוִיַּת הָאַרְיֵה
  choice: из трупа льва
  rationale: גְּוִיָּה обозначает мёртвое тело; «труп» сохраняет прямоту и неприятную конкретность исходного текста.
- source_word: רָדָה הַדְּבָשׁ
  choice: выгреб этот мёд
  rationale: Повтор «выгреб» сохраняет лексическую связь с первым употреблением רדה; указательное «этот» естественно отсылает к мёду, который ели родители.
