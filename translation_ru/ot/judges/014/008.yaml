  yaml_path: translation/ot/judges/014/008.yaml
  text: After some days he returned to take her, and he turned aside to see the carcass of the lion, and behold, a swarm of bees was in the body of the lion, and honey.
translation:
  language: ru
  text: Через несколько дней он вернулся, чтобы взять её в жёны. Он свернул с дороги посмотреть на останки льва — и вот, в теле льва был рой пчёл и мёд.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיָּמִים
  choice: через несколько дней
  rationale: Идиома указывает на прошедший неопределённый промежуток времени; такой перевод естественен по-русски.
- source_word: לְקַחְתָּהּ
  choice: чтобы взять её в жёны
  rationale: В данном свадебном контексте «взять» означает завершить заключение брака и привести женщину как жену; уточнение предотвращает ложное бытовое прочтение.
- source_word: מַפֶּלֶת הָאַרְיֵה
  choice: останки льва
  rationale: Буквально выражение связано с павшим львом; по контексту речь о его мёртвом теле, но «останки» естественнее и не навязывает степень разложения.
- source_word: עֲדַת דְּבוֹרִים
  choice: рой пчёл
  rationale: Для совокупности пчёл это обычное современное русское обозначение.
- source_word: בִּגְוִיַּת הָאַרְיֵה
  choice: в теле льва
  rationale: Сохраняет прямое значение גְּוִיָּה и намеренный повтор упоминания льва.
- source_word: וּדְבָשׁ
  choice: и мёд
  rationale: Сохраняет краткую, несколько эллиптическую координацию еврейского текста без добавления отсутствующего глагола.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно повествовательным, достойным регистром. Частица וְהִנֵּה передана как «и вот», чтобы сохранить эффект внезапного обнаружения. Эллиптическое «и мёд» сохранено намеренно.
