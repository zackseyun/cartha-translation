lexical_decisions:
- source_word: וַיֵּרֶד
  choice: спустился
  rationale: Сохраняет буквальное значение ירד и характерное для еврейского повествования указание на движение вниз по местности.
- source_word: שִׁמְשׁוֹן
  choice: Самсон
  rationale: Традиционная и общепонятная русская форма имени.
- source_word: תִּמְנָתָה
  choice: в Тимну
  rationale: Направительное ה указывает на движение к месту; русское «в Тимну» передаёт это естественно.
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямое и нейтральное соответствие ראה, не добавляющее оттенков вроде «заметил».
- source_word: אִשָּׁה
  choice: женщину
  rationale: В данном контексте אשה означает женщину, ещё не жену; возраст исходным словом не уточняется.
- source_word: בְּתִמְנָתָה
  choice: там
  rationale: Местоименное наречие естественно устраняет тяжёлый для русского повтор «в Тимне», при этом место остаётся однозначным.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: из филистимлянок
  rationale: Естественно по-русски передаёт принадлежность женщины к женщинам филистимского народа; буквальный семейно-этнический образ сохранён в сноске.
