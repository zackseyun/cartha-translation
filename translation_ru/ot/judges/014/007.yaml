  terminology: Имя «Самсон» и «женщина» употреблены корректно; «женщина» не предрешает, что она уже жена. Формулировка сноски «была правильной» в данном русском контексте может быть неверно понята как моральная характеристика; лучше дать «была угодна/приятна в глазах Самсона» и отдельно отметить буквальное «прямая, правильная».
