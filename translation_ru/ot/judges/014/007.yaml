  text: Then he went down and spoke to the woman[a], and she was pleasing in Samson’s eyes.
translation:
  language: ru
  text: Он спустился и поговорил с женщиной[a], и она понравилась Самсону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и она была приятна (или правильна) в глазах Самсона». Еврейское выражение передаёт её положительную оценку Самсоном; возможны также: «она показалась Самсону подходящей».'
    reason: Сохраняет буквальную еврейскую идиому и её оценочную неоднозначность, не приписывая выражению исключительно моральный или эстетический смысл.
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Потом он спустился
  rationale: Глагол ירד обозначает движение вниз; «спустился» сохраняет географическое направление к Фимне, а «потом» естественно передаёт последовательность повествования.
- source_word: וַיְדַבֵּר לָאִשָּׁה
  choice: поговорил с той женщиной
  rationale: דבר с ל означает обращённую к человеку речь. В современном русском «поговорил с» звучит естественно и не предполагает содержания разговора; «та женщина» по контексту ещё не является женой Самсона.
- source_word: וַתִּישַׁר
  choice: она показалась … подходящей
  rationale: Форма от ישר здесь выражает положительную оценку, пригодность или соответствие желанию Самсона. «Показалась подходящей» сохраняет оценочный смысл и не сводит его лишь к внешней привлекательности.
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  choice: Самсону
  rationale: Русская конструкция «показалась Самсону» естественно передаёт идиому «в глазах Самсона»; буквальный образ и его возможное литературное эхо сохранены в сноске.
theological_decisions:
- issue: Возможная перекличка с мотивом книги Судей о том, что кажется правильным в собственных глазах
  choice: 'В основном тексте передать идиому естественно: «показалась Самсону подходящей», а буквальный образ указать в сноске'
  alternative: «была правильной в глазах Самсона» или «была приятна в глазах Самсона»
  rationale: Такой перевод не навязывает ни нравственного одобрения, ни исключительно эстетической оценки, но сноска сохраняет возможную тематическую перекличку с формулой «в своих глазах».
translation_notes:
  register: Современный литературный русский язык с умеренно повествовательным, достойным регистром. Формулировка понятна широкому читателю и не устраняет смысловую неоднозначность еврейского выражения.
