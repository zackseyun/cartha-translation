base_translation:
  language: en
  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
translation:
  language: ru
  text: 'На седьмой день они сказали жене Самсона: «Уговори своего мужа открыть нам разгадку, иначе мы сожжём тебя и дом твоего отца[a]. Разве вы позвали нас, чтобы разорить нас[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тебя и семью твоего отца». Выражение «дом отца» может означать как жилище, так и семью или домочадцев.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лишить нас имущества», «завладеть нашим добром». Древнееврейский глагол может обозначать лишение владения или завладение имуществом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתִּי
  choice: Уговори
  rationale: Порода пиэль передаёт настойчивое, манипулятивное склонение к действию; «уговори» естественно звучит по-русски и сохраняет этот оттенок.
- source_word: אִישֵׁךְ
  choice: своего мужа
  rationale: В обращении к замужней женщине אִישׁ означает её мужа.
- source_word: וְיַגֶּד לָנוּ אֶת־הַחִידָה
  choice: открыть нам разгадку
  rationale: נגד означает сообщить или открыть, а в данном контексте речь идёт не о повторении загадки, а о раскрытии её ответа.
- source_word: פֶּן נִשְׂרֹף
  choice: иначе мы сожжём
  rationale: פֶּן вводит угрожающее последствие; в современной русской прямой речи «иначе» передаёт его естественнее, чем буквальное «как бы не».
- source_word: בֵּית אָבִיךְ
  choice: дом твоего отца
  rationale: Сохраняет широту древнееврейского выражения, которое может обозначать как жилище, так и семью или домочадцев; неоднозначность пояснена в сноске.
- source_word: הֲלְיָרְשֵׁנוּ
  choice: чтобы разорить
  rationale: В контексте пари форма ירשׁ выражает лишение имущества или завладение чужим добром; «разорить» ясно передаёт предполагаемый имущественный ущерб.
- source_word: קְרָאתֶם לָנוּ הֲלֹא
  choice: Разве вы позвали нас, чтобы разорить?
  rationale: Риторическая частица הֲלֹא усиливает обвинительный вопрос. Русская конструкция с «разве» естественно передаёт ожидание утвердительного ответа без добавочного предложения.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: На седьмой день
  rationale: Прямой и естественный перевод временного оборота.
