base_translation:
  language: en
  yaml_path: translation/ot/judges/002/013.yaml
  text: They abandoned Yahweh and served Baal and the Ashtoreths[a][b][c].
translation:
  language: ru
  text: Они оставили Яхве и служили[a] Ваалу и Астартам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонялись».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте употреблена форма множественного числа. Она может обозначать разные местные проявления или изображения богини, известной также как Астарта.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: оставили
  rationale: Глагол עזב означает «оставить, покинуть». «Оставили» естественно звучит по-русски и в данном контексте передаёт отступничество Израиля, не добавляя отсутствующего в тексте пояснения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога, представленное тетраграмматоном יהוה, передано распространённой русской транслитерацией «Яхве», а не заменено титулом «Господь».
- source_word: וַיַּעַבְדוּ
  choice: служили
  rationale: Глагол עבד может обозначать как служение вообще, так и культовое почитание. «Служили» сохраняет его широкое значение; религиозный смысл ясен из упоминания Ваала и Астарт.
- source_word: לַבַּעַל
  choice: Ваалу
  rationale: Форма передана традиционным русским именем «Ваал» в дательном падеже, требуемом глаголом «служить». Еврейский артикль отдельно не воспроизводится, поскольку перед именем божества по-русски он не выражается.
- source_word: וְלָעַשְׁתָּרוֹת
  choice: и Астартам
  rationale: Еврейская форма עשתרות морфологически является множественным числом. Русская форма «Астартам» сохраняет эту множественность и согласуется с управлением глагола «служить».
theological_decisions:
- issue: Множественное число עשתרות
  choice: Астартам
  alternative: Астарте; богине Астарте
  rationale: Основной текст сохраняет грамматическое множественное число и не решает однозначно, идёт ли речь о нескольких богинях, местных проявлениях одного божества или его культовых изображениях.
- issue: Культовое значение עבד
  choice: служили
  alternative: поклонялись
  rationale: «Служили» ближе передаёт широту еврейского глагола, тогда как «поклонялись» явно выражает подразумеваемый здесь культовый смысл. Альтернатива отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза сохраняет параллельную структуру еврейского текста. Имена «Яхве» и «Ваал» даны в привычной русской форме, а непривычное множественное «Астартам» сознательно сохранено и пояснено в сноске.
