base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
translation:
  language: ru
  text: И когда ангел[a] Яхве сказал эти слова всем сынам Израиля[b], народ поднял голос и заплакал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланник Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «всем израильтянам»; буквально: «всем сынам Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: И когда … сказал
  rationale: Сочетание повествовательной формы היה с инфинитивной конструкцией דבר вводит временное придаточное. Такой перевод естественно передаёт ход повествования, не добавляя тяжеловесного «и было».
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может означать как небесного «ангела», так и «посланника». В данном повествовательном контексте традиционное и наиболее естественное русское соответствие — «ангел»; лексическая неоднозначность отмечена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени Бога, а не заменён титулом «Господь».
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: эти слова
  rationale: Здесь דְּבָרִים относится к только что произнесённой речи, поэтому «слова» точнее сохраняет словесный характер сообщения, чем «дела» или «всё это».
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: всем сынам Израиля
  rationale: Перевод сохраняет буквальный образ בְּנֵי יִשְׂרָאֵל — «сыны Израиля»; более идиоматичный вариант «всем израильтянам» приведён в сноске.
- source_word: וַיִּשְׂאוּ הָעָם אֶת קוֹלָם
  choice: народ поднял голос
  rationale: Русское выражение «поднять голос» естественно передаёт еврейскую идиому. Собирательное «народ» и единственное «голос» сохраняют цельность общей реакции, хотя еврейские глаголы стоят во множественном числе.
- source_word: וַיִּבְכּוּ
  choice: и заплакал
  rationale: Глагол בכה означает «плакать, рыдать». «Заплакал» естественно согласуется в русском с собирательным существительным «народ» и не добавляет невыраженной степени силы плача.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя יְהוָה. Форма «Яхве» сохраняет его как личное имя и не подменяет титулом.
- issue: Значение выражения מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: посланник Яхве
  rationale: Слово מַלְאַךְ само по себе допускает оба значения. Основной текст следует наиболее естественному для данного библейского контекста обозначению, а подлинная лексическая неоднозначность сохраняется в сноске без утверждения о природе или тождестве этого лица.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным и естественным; буквальный этноним сохранён в основном тексте, а более привычная русская формулировка дана в сноске.
