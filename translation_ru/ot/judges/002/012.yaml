base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
translation:
  language: ru
  text: Они оставили Яхве, Бога своих отцов, который вывел их из земли Египта, и пошли за другими богами — из числа богов народов, живших вокруг них[a]. Они поклонились им и вызвали гнев Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за другими богами — богами народов, живших вокруг них». Еврейское выражение может в более общем смысле указывать на богов, которым поклонялись народы, жившие вокруг Израиля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: оставили
  rationale: Глагол עזב здесь означает не физический уход, а отказ от верности Яхве; «оставили» естественно по-русски и сохраняет заветно-реляционный смысл без пояснительного расширения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: Бога своих отцов
  rationale: Сохраняется традиционная заветная формула и мужской множественный род исходного выражения.
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: Который вывел их из земли Египетской
  rationale: Причастная конструкция определяет Яхве через совершённое Им избавление при исходе; русское прошедшее время естественно передаёт это в повествовании.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: пошли за
  rationale: Сохранён конкретный образ еврейской идиомы, выражающей следование и преданность.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: другими богами
  rationale: Прямо передаёт значение прилагательного «другие», не добавляя толкования «чужеземные».
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  choice: из числа богов окружавших их народов
  rationale: «Из числа» передаёт вероятное партитивное значение предлога מִן, а причастный оборот естественно связывает окружающее положение с народами.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: поклонились им
  rationale: Глагол обозначает поклон или простирание и в данном контексте явно имеет смысл религиозного поклонения; русский глагол сохраняет оба оттенка.
- source_word: וַיַּכְעִסוּ אֶת יְהוָה
  choice: тем вызвали гнев Яхве
  rationale: 'Передаёт каузативное значение породы Hiphil: их действия побудили Яхве к гневу.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст употребляет личное имя; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Заветный смысл отступничества Израиля
  choice: Сохранить последовательность действий — оставили, пошли за другими богами, поклонились и вызвали гнев — без добавочного богословского пояснения
  alternative: Прямо назвать поступок нарушением завета
  rationale: Смысл нарушения верности ясно следует из самого текста, но термин «нарушили завет» в этом стихе отсутствует.
- issue: Значение מִן перед «богами народов»
  choice: 'Партитивное: «из числа богов»'
  alternative: 'Более общее определение: «за другими богами окружавших их народов»'
  rationale: Партитивное прочтение хорошо соответствует синтаксису, однако более общее отнесение богов к соседним народам остаётся возможным и отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены личное имя «Яхве», традиционная формула «Бог своих отцов» и конкретная образность «пошли за»; тяжеловесный буквальный синтаксис умеренно сглажен.
