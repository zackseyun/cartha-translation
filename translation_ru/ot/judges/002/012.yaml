  to: Они оставили Яхве, Бога своих отцов, который вывел их из земли Египта, и пошли за другими богами — из числа богов народов, живших вокруг них[a]. Они поклонились им и вызвали гнев Яхве.
  rationale: 'Правка ограничена современностью и ясностью русского изложения: обновлена формула об Египте, устранена двусмысленность в описании окружающих народов и приведена сноска к естественной синтаксической форме. Партитивное прочтение «из числа» сохранено в основном тексте, а более общее понимание оставлено в сноске. Смысл и последовательность еврейского текста не изменены.'
