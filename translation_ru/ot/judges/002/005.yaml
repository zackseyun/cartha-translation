  yaml_path: translation/ot/judges/002/005.yaml
  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
translation:
  language: ru
  text: И назвали то место Бохим[a], и принесли там жертвы Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Бохим» связано с еврейским словом, означающим «плачущие» или «те, кто плачет».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם
  choice: назвали
  rationale: Еврейская конструкция буквально означает «назвали имя», но по-русски естественно передаётся одним глаголом «назвали» без утраты смысла.
- source_word: הַמָּקוֹם הַהוּא
  choice: то место
  rationale: Указательное הַהוּא передано словом «то»; сочетание естественно для современного литературного русского языка.
- source_word: בֹּכִים
  choice: Бохим
  rationale: Слово выступает как географическое название, поэтому транслитерировано; связь с еврейским глаголом «плакать» отражена в сноске.
- source_word: וַיִּזְבְּחוּ
  choice: принесли жертвы
  rationale: Так естественно по-русски передаётся глагол זבח в значении совершения жертвоприношения.
- source_word: שָׁם
  choice: там
  rationale: Сохранено прямое указание на только что названное место.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано принятой научной транслитерацией «Яхве», в соответствии с источником и указанным решением проекта.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господу
  rationale: В тексте стоит тетраграмматон, поэтому сохранено личное имя «Яхве», а не заменяющий его титул.
- issue: Перевод или транслитерация בֹּכִים
  choice: Бохим
  alternative: Плачущие
  rationale: Здесь בֹּכִים является названием места; его значение поясняется отдельно, чтобы не превращать имя собственное в толкование.
translation_notes:
  register: Современный литературный русский язык с краткой, повествовательной синтаксической структурой. Начальное «И» сохраняет связь стиха с предшествующим повествованием. Формула «назвали имя» не воспроизведена буквально, поскольку в современном русском она звучит неестественно.
