base_translation:
  language: en
  yaml_path: translation/ot/judges/002/009.yaml
  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: ru
  text: И похоронили его на территории своего наследственного владения[a], в Тимнат-Хересе, в горной области Ефрема, к северу от горы Гааш.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В Нав. 24:30 это место названо «Тимнат-Серах», а здесь — «Тимнат-Херес». В параллельных сообщениях о погребении сохранены разные формы названия.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אוֹתוֹ
  choice: И похоронили его
  rationale: Форма wayyiqtol продолжает повествовательную последовательность; местоименный суффикс при показателе прямого дополнения явно относится к Иисусу Навину.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: в пределах его удела
  rationale: גְּבוּל здесь обозначает территориальные пределы, а נַחֲלָה — полученный в наследственное владение земельный удел. Такая формулировка естественна по-русски и сохраняет земельно-наследственный смысл.
- source_word: בְּתִמְנַת חֶרֶס
  choice: в Тимнат-Хересе
  rationale: Географическое название передано транслитерацией; предлог בְּ естественно переводится как «в».
- source_word: בְּהַר אֶפְרָיִם
  choice: в горной области Ефрема
  rationale: В данном географическом сочетании הַר обозначает не отдельную гору, а нагорную, холмистую область, связанную с Ефремом.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: к северу от горы Гааш
  rationale: Сочетание выражает относительное местоположение; «к северу от» точно и естественно передаёт пространственное отношение.
