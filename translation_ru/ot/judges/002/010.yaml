- from: И всё то поколение также отошло к своим отцам[a]. После них пришло другое поколение, которое не знало Яхве[b] и того, что Он сделал для Израиля.
  to: И всё это поколение также отошло к своим предкам[a]. После них появилось другое поколение, которое не знало ни Яхве[b], ни того, что Он сделал для Израиля.
