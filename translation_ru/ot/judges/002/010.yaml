base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
translation:
  language: ru
  text: И всё это поколение также отошло к своим предкам[a]. После них появилось другое поколение, которое не знало ни Яхве[b], ни того, что Он сделал для Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «было собрано к своим отцам» — древнееврейское выражение о смерти и присоединении к предкам.'
    reason: cultural_note
  - marker: b
    text: 'Возможно также: «не признавало Яхве». Еврейский глагол может означать не только осведомлённость, но и опытное или заветное знание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  choice: И всё то поколение также
  rationale: Сохранены добавочное значение וְגַם, полнота כָּל и указание на поколение, упомянутое в предшествующем контексте.
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  choice: отошло к своим отцам
  rationale: Русская формула сохраняет образ древнееврейского выражения о смерти и присоединении к предкам, оставаясь понятной с пояснением в сноске.
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  choice: После них пришло другое поколение
  rationale: «Пришло» естественно передаёт появление следующего поколения; «после них» явно сохраняет временную последовательность.
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  choice: не знало Яхве
  rationale: 'Глагол «знать» сохраняет широту יָדַע: речь может идти как о знании и опыте, так и о признании Бога и отношениях верности Ему.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, стоящее в еврейском тексте.
- source_word: וְגַם אֶת הַמַּעֲשֶׂה אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  choice: и того, что Он сделал для Израиля
  rationale: В русском отрицание при однородных дополнениях естественно распространяется через союз «и»; выражение передаёт Божье деяние в пользу Израиля, не навязывая искусственного единственного числа «дело».
theological_decisions:
- issue: Смысл выражения «не знало Яхве»
  choice: Сохранено широкое «не знало»
  alternative: «не признавало Яхве» или «не знало о Яхве»
  rationale: יָדַע может обозначать фактическое, опытное и заветно-отношенческое знание. Контекст связывает незнание Яхве с незнанием Его деяния, поэтому перевод не сужает смысл ни до простой неосведомлённости, ни исключительно до неверности.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя, непосредственно присутствующее в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён до двух предложений для ясности; исходная последовательность мысли и оба подлинных смысловых напряжения сохранены.
