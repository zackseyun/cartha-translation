base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
translation:
  language: ru
  text: Но они не слушали даже своих судей, потому что блудили, следуя другим богам[a], и поклонялись им. Они быстро уклонились от пути, по которому ходили их отцы, повинуясь заповедям Яхве; они так не поступали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «блудили вслед за другими богами». В еврейском тексте идолопоклонство и неверность завету описаны через образ половой неверности.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  choice: Но они не слушали даже своих судей
  rationale: «Но» передаёт лёгкое противопоставление контексту, «даже» — усиление וְגַם, а «не слушали» сохраняет еврейскую идиому со значением отказа внимать и повиноваться.
- source_word: זָנוּ אַחֲרֵי
  choice: блудно ходили вслед за
  rationale: Сохраняет резкую метафору половой неверности, применённую к идолопоклонству и нарушению завета, а также образ следования за иными богами.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: и поклонялись им
  rationale: В данном контексте поклонение естественно передаёт обозначаемое глаголом простёртое или преклонённое положение как религиозный акт.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: Они быстро уклонились с пути
  rationale: Сохраняет образ пути, значение отклонения от него и наречие быстроты.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם לִשְׁמֹעַ מִצְוֺת יְהוָה
  choice: по которому ходили их отцы, повинуясь заповедям Яхве
  rationale: Сохраняет метафору хождения; деепричастный оборот естественно связывает повиновение заповедям с образом жизни отцов. Имя יהוה передано транслитерацией «Яхве».
- source_word: לֹא עָשׂוּ כֵן
  choice: они так не поступали
  rationale: Прямо и естественно передаёт заключительное отрицательное сопоставление с поведением отцов.
theological_decisions:
- issue: Метафора заветной неверности в זָנוּ
  choice: 'Сохранить сексуально-нравственную метафору: «блудно ходили вслед за другими богами»'
  alternative: «изменили Богу, последовав за другими богами»
  rationale: Более общее «изменили» сгладило бы намеренно резкий образ текста. Выбранная формулировка сохраняет метафору, не превращая её в утверждение о буквальной проституции.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя Бога в исходном тексте и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены образы неверности, пути и хождения; синтаксис сделан понятным для обычного современного читателя.
