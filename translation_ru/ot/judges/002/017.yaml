revisions:
- from: Но они не слушали даже своих судей, потому что блудно ходили вслед за другими богами[a] и поклонялись им. Они быстро уклонились с пути, по которому ходили их отцы, повинуясь заповедям Яхве; они так не поступали.
  to: Но они не слушали даже своих судей, потому что блудили, следуя другим богам[a], и поклонялись им. Они быстро уклонились от пути, по которому ходили их отцы, повинуясь заповедям Яхве; они так не поступали.
  rationale: Исправлена неестественная конструкция «блудно ходили» на «блудили, следуя», чтобы прямо передать метафору זנה и направленность אחרי, не превращая выражение в утверждение о буквальном сексуальном поведении. «С пути» заменено на более естественное «от пути». Остальной синтаксис и терминология сохранены.
