  source_fidelity: 'Смысл в целом передан точно: усиленное «даже», отказ внимать судьям, идолопоклонство, быстрое уклонение от пути отцов и заключительное противопоставление сохранены. Однако «блудно ходили вслед за» неудачно смешивает два образа: еврейский глагол זנה сам выражает метафору сексуальной неверности, тогда как «ходили» здесь не является его значением. Более прямое «блудили, следуя» точнее и яснее сохраняет оба компонента.'
