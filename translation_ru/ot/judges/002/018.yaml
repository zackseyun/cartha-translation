  to: Всякий раз, когда Яхве воздвигал им судей, Яхве был с судьёй и спасал их из рук их врагов во все дни судьи, потому что Яхве сжалился над ними[a] из-за их стонов от тех, кто угнетал и теснил их.
  rationale: Исправлена причинная связь при מִנַּאֲקָתָם без добавления отсутствующего в оригинале действия «слышать». Уточнено притяжательное значение в «из рук их врагов». Сноска приведена в соответствие с диапазоном значений נִחָם и английским аудиторским примечанием.
