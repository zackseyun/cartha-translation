source:
  edition: WLC
  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
translation:
  language: ru
  text: Всякий раз, когда Яхве воздвигал им судей, Яхве был с судьёй и спасал их из рук их врагов во все дни судьи, потому что Яхве сжалился над ними[a] из-за их стонов от тех, кто угнетал и теснил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изменял решение» или «испытывал сострадание»; еврейский глагол может обозначать перемену отношения или сострадательный отклик.'
    reason: Лексическая многозначность формы יִנָּחֵם.
lexical_decisions:
- source_word: וְכִי
  choice: Всякий раз, когда
  rationale: В контексте обобщённого описания повторяющихся событий сочетание имеет временно-итеративное значение.
- source_word: הֵקִים
  choice: воздвигал
  rationale: Сохраняет образ божественного инициирования появления судей и естественно сочетается с обозначением руководителей.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога, а не заменяет его титулом.
- source_word: שֹׁפְטִים
  choice: судей
  rationale: Традиционное и контекстуально точное обозначение деятелей эпохи Судей; их роль избавителей раскрывается последующим глаголом.
- source_word: וְהָיָה יְהוָה עִם הַשֹּׁפֵט
  choice: Яхве был с судьёй
  rationale: Прямо передаёт присутствие и поддержку Яхве без дополнительного истолкования.
- source_word: וְהוֹשִׁיעָם
  choice: спасал их
  rationale: Каузативная форма ישׁע означает избавление или спасение; следующий оборот уточняет, от кого их спасали.
- source_word: מִיַּד אֹיְבֵיהֶם
  choice: из рук врагов
  rationale: Сохраняет понятную русскому читателю конкретную семитскую метафору власти и контроля.
- source_word: כֹּל יְמֵי הַשּׁוֹפֵט
  choice: во все дни судьи
  rationale: Формально близко воспроизводит повторяющуюся формулу и не уточняет сверх текста, идёт ли речь о жизни или сроке деятельности судьи.
- source_word: יִנָּחֵם
  choice: сострадал им
  rationale: В данном контексте форма נחם выражает сочувственный отклик Яхве на страдания народа; местоимение «им» естественно обозначает объект сострадания, явный из контекста.
- source_word: מִנַּאֲקָתָם
  choice: слыша их стоны
  rationale: Передаёт стоны как повод для сострадательного отклика; «слыша» является контекстуальной экспликацией причинной связи, а не отдельного еврейского глагола.
- source_word: לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם
  choice: тех, кто угнетал и теснил их
  rationale: Сохраняет два параллельных активных причастия и различает длительное угнетение и оказываемое давление.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст непосредственно употребляет тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Антропопатическое выражение יִנָּחֵם יְהוָה
  choice: Яхве сострадал им
  alternative: Яхве смягчался; Яхве раскаивался; Яхве жалел их
  rationale: «Сострадал» сохраняет эмоциональный и ответный характер действия в связи со стонами Израиля, не приписывая Богу нравственной ошибки; возможное значение изменения расположения отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формулы «воздвигал судей», «из рук врагов» и «во все дни судьи» намеренно сохраняют образность и ритм еврейского текста; архаические синтаксические конструкции избегаются.
