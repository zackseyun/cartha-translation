base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
translation:
  language: ru
  text: 'Я также сказал: «Не изгоню их от вас; они станут для вас врагами[a], а их боги станут для вас западнёй».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «боками». Некоторые древние переводы и сходные места передают или истолковывают это как «тернии в ваших боках».'
    reason: Сохраняет трудное масоретское чтение לְצִדִּים и засвидетельствованный традиционный вариант, не вводя «тернии» в основной текст.
lexical_decisions:
- source_word: וְגַם אָמַרְתִּי
  choice: И потому Я сказал
  rationale: Сочетание связывает высказывание с предшествующим обличением и в данном контексте выражает продолжение с оттенком следствия. Формулировка естественна для современного русского повествования.
- source_word: לֹא אֲגָרֵשׁ אוֹתָם מִפְּנֵיכֶם
  choice: Не изгоню их от вас
  rationale: Глагол גרש означает «изгонять, прогонять». Русское «от вас» естественно передаёт пространственную идиому מִפְּנֵיכֶם без неуместного буквализма «от лица вашего».
- source_word: וְהָיוּ לָכֶם לְצִדִּים
  choice: они станут для вас врагами[a]
  rationale: Масоретское לְצִדִּים буквально связано со «сторонами, боками», но в данной конструкции остаётся трудным. «Врагами» передаёт предполагаемый смысл в основном тексте, а буквальная форма и традиционный вариант сохранены в примечании.
- source_word: וֵאלֹהֵיהֶם
  choice: а их боги
  rationale: Обычное обозначение богов народов в контексте идолопоклонства; противительный оттенок русского «а» ясно разделяет два параллельных последствия.
- source_word: יִהְיוּ לָכֶם לְמוֹקֵשׁ
  choice: станут для вас западнёй
  rationale: מוֹקֵשׁ обозначает ловушку или западню и здесь метафорически указывает на духовную опасность. «Западня» сохраняет образ и звучит естественно и достойно.
theological_decisions:
- issue: Трудное масоретское чтение לְצִדִּים
  choice: враги с указанием буквального чтения в примечании
  alternative: терния в боках; бока
  rationale: Основной текст не вводит конкретный образ «терний», отсутствующий в данном масоретском чтении. Вместе с тем буквально неясное «станут для вас боками» было бы непонятно современному читателю, поэтому предполагаемый в контексте враждебный смысл передан словом «враги», а текстологическая неоднозначность открыто сохранена в примечании.
translation_notes:
  register: Современный литературный русский язык; речь торжественная, но доступная. Синтаксический параллелизм двух последствий сохранён. Местоимение «Я» написано с прописной буквы как традиционное графическое обозначение речи Бога, без добавления конфессионально окрашенной терминологии.
