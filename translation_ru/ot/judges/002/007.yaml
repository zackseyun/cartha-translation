base_translation:
  language: en
  yaml_path: translation/ot/judges/002/007.yaml
  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
translation:
  language: ru
  text: И народ служил Яхве во все дни Иисуса Навина и во все дни старейшин, переживших Иисуса Навина и видевших всё великое деяние[a] Яхве, которое Он совершил для Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великое дело»; еврейское слово стоит в единственном числе и может собирательно обозначать всё совершённое Яхве.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: служил
  rationale: Глагол עבד с Яхве в качестве дополнения означает служение в верности завету; оно включает поклонение, но не ограничивается им.
- source_word: הָעָם
  choice: народ
  rationale: В данном контексте עם обозначает народ Израиля как единую общину.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет его функцию в еврейском тексте и не заменяет имя титулом.
- source_word: כֹּל יְמֵי
  choice: во все дни
  rationale: Оборот обозначает весь период жизни или служения названных людей; эта формулировка точна и уместна в повествовательном библейском стиле.
- source_word: הַזְּקֵנִים
  choice: старейшин
  rationale: Слово обозначает признанных старших представителей и руководителей общины, а не просто пожилых мужчин.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי
  choice: продолжали жить после
  rationale: Еврейская идиома буквально говорит о продлении дней после Иисуса Навина; выбранный вариант ясно передаёт продолжение их жизни после него, не усиливая значение до обязательного «пережили».
- source_word: רָאוּ
  choice: видели
  rationale: Форма указывает на личное свидетельство старейшин о совершённом Яхве; в русском придаточном простое прошедшее время естественно передаёт это значение.
- source_word: כָּל מַעֲשֵׂה יְהוָה הַגָּדוֹל
  choice: всё великое дело Яхве
  rationale: Единственное число מַעֲשֵׂה может собирательно охватывать совокупность совершённого Яхве; «дело» сохраняет число и широту значения.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: совершённое Им для Израиля
  rationale: 'Предлог לְ имеет благодетельное значение: речь идёт о содеянном ради Израиля и ему во благо.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе стоит собственное имя Бога, поэтому транслитерация «Яхве» сохраняет отличие имени от титула.
- issue: Характер служения народа
  choice: служил Яхве
  alternative: поклонялся Яхве
  rationale: «Служил» сохраняет широкий смысл верности и послушания в рамках завета, не сводя עבד исключительно к культовому поклонению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным звучанием. Синтаксис следует структуре еврейского стиха, но остаётся понятным обычному читателю; местоимение «Им» устраняет тяжёлое повторение имени без изменения референции.
