source:
  edition: WLC
  text: וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/008.yaml
  text: And Joshua son of Nun[a], the servant of Yahweh, died at the age of one hundred and ten years.
translation:
  language: ru
  text: И умер Иисус, сын Нуна, служитель Яхве[a], в возрасте ста десяти лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «раб Яхве». Еврейское слово может означать и слугу, и раба; здесь оно употреблено как почётный титул Иисуса.'
    reason: Лексическая альтернатива для עֶבֶד и пояснение его контекстуальной функции.
lexical_decisions:
- source_word: וַיָּמָת
  choice: И умер
  rationale: Форма Qal wayyiqtol от מות продолжает последовательное повествование; союз ו передан словом «И».
- source_word: יְהוֹשֻׁעַ
  choice: Иисус
  rationale: Использована закрепившаяся в русской библейской традиции форма имени Иисус для еврейского יְהוֹשֻׁעַ; уточнение «сын Нуна» отличает его от других носителей имени.
- source_word: בִּן נוּן
  choice: сын Нуна
  rationale: Конструкция сопряжённого состояния прямо обозначает происхождение. Форма «Нун» передаёт еврейское имя נוּן точнее, чем традиционное переоформление «Навин».
- source_word: עֶבֶד יְהוָה
  choice: служитель Яхве
  rationale: עֶבֶד может означать раба или слугу; здесь это почётное обозначение Иисуса в его отношении к Яхве. «Служитель» естественно и достойно передаёт функцию титула, а более буквальная альтернатива сохранена в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя «Яхве», а не заменён титулом «Господь».
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: в возрасте ста десяти лет
  rationale: Еврейская возрастная формула буквально говорит «сын ста десяти лет»; выбран естественный современный русский эквивалент с сохранением точного числа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Передача עֶבֶד как титула Иисуса
  choice: служитель
  alternative: раб; слуга
  rationale: В данном контексте слово служит почётным титулом, но его более сильное значение «раб» остаётся лексически возможным и указано в сноске, чтобы не устранять смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис краткий и близкий к еврейской последовательности. Нетрадиционная, но исходно точная форма «сын Нуна» подчёркивает реальное имя отца, а не русское традиционное переоформление «Навин».
