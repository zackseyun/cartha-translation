base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
translation:
  language: ru
  text: Куда бы они ни выходили[a], рука Яхве была против них, им во вред[b], как сказал Яхве и как Яхве поклялся им; и им стало очень тяжело.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Всякий раз, когда они выходили»; возможно, речь идёт о выступлении в бой или военный поход.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для бедствия», «для несчастья» или «во вред»; еврейское слово здесь обозначает пагубу или бедствие, а не обязательно нравственное зло.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  choice: Куда бы они ни выступали
  rationale: Оборот охватывает все случаи и направления их выходов. «Выступали» естественно допускает военный контекст, не ограничивая значение исключительно походом или сражением.
- source_word: יַד יְהוָה
  choice: рука Яхве
  rationale: Сохранена древнееврейская антропоморфная метафора действенной силы и вмешательства Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога транслитерацией, а не заменено титулом.
- source_word: הָיְתָה בָם לְרָעָה
  choice: была против них, принося им бедствие
  rationale: Передаёт направленное против Израиля действие и пагубный результат. «Бедствие» здесь обозначает несчастье или calamity, а не нравственное зло.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: как и говорил Яхве
  rationale: Указывает на ранее произнесённое предупреждение; русское прошедшее время естественно выражает ретроспективный смысл.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: и как Яхве клялся им
  rationale: Сохраняет прямую связь клятвы с адресатами и параллелизм двух придаточных.
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  choice: и они оказались в крайне тяжёлом положении
  rationale: Идиоматично передаёт сильное стеснение и бедственное состояние Израиля, сохраняя усиление מְאֹד.
theological_decisions:
- issue: Действие Яхве против Израиля в рамках суда за нарушение завета
  choice: рука Яхве была против них, принося им бедствие
  alternative: рука Яхве была против них ко злу
  rationale: 'Формулировка сохраняет прямое Божье участие в суде, но не приписывает Богу нравственного зла: רָעָה в данном контексте означает пагубу, несчастье или бедствие.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены метафора «рука Яхве», личное имя Яхве и суровая богословская напряжённость утверждения о Божьем суде; синтаксис сделан ясным для обычного современного читателя.
