base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
translation:
  language: ru
  text: 'И воспылал гнев Яхве на Израиль, и Он сказал: «За то, что этот народ нарушил Мой завет[a], который Я повелел соблюдать их отцам, и не послушался Моего голоса[b], —»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преступил Мой завет». Древнееврейский глагол буквально означает «перейти, переступить», а применительно к завету — нарушить его.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не повиновался Мне». Выражение «слушать голос» часто означает также повиноваться.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: воспылал гнев
  rationale: Сохраняет древнееврейский образ разгорающегося гнева и естественно звучит в современном литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּיִשְׂרָאֵל
  choice: на Израиль
  rationale: При обозначении гнева предлог указывает на его объект; сочетание «гнев на Израиль» естественно по-русски.
- source_word: יַעַן אֲשֶׁר
  choice: за то, что
  rationale: Вводит основание последующего Божьего решения и сохраняет судебно-причинный оттенок высказывания.
- source_word: עָבְרוּ
  choice: нарушил
  rationale: В сочетании с «заветом» глагол означает преступить или нарушить его; единственное число согласовано с собирательным «народ».
- source_word: הַגּוֹי הַזֶּה
  choice: этот народ
  rationale: Русское «народ» здесь естественно передаёт коллектив Израиля, сохраняя при этом отмеченное обозначение нации как единого целого.
- source_word: בְּרִיתִי
  choice: Мой завет
  rationale: «Завет» является точным и укоренённым русским соответствием ברית в контексте отношений Бога с Израилем.
- source_word: צִוִּיתִי אֶת אֲבוֹתָם
  choice: который Я заповедал их отцам
  rationale: Передаёт сжатую древнееврейскую конструкцию, в которой завет представлен как заповеданный предкам Израиля.
- source_word: וְלֹא שָׁמְעוּ לְקוֹלִי
  choice: и не послушал Моего голоса
  rationale: Сохраняет образ слушания голоса и одновременно подразумевает повиновение; число согласовано с собирательным «народ».
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя Бога и не подменяет его титулом.
- issue: Заветный смысл עָבְרוּ אֶת־בְּרִיתִי
  choice: нарушил Мой завет
  alternative: преступил Мой завет; расторг Мой завет
  rationale: Выбор ясно выражает нарушение обязательств завета, не привнося более сильного утверждения о его полном прекращении.
- issue: Смысл идиомы «слушать голос»
  choice: не послушал Моего голоса
  alternative: не повиновался Мне
  rationale: Формулировка сохраняет слуховой образ оригинала и присущую идиоме связь между слушанием и послушанием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Начальное «И» и незавершённость прямой речи сохранены, поскольку стих синтаксически продолжается далее. Местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской библейской традиции.
