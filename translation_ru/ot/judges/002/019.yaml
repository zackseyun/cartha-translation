revisions:
- from: 'Когда судья умирал, они снова возвращались к прежнему и поступали ещё порочнее, чем их отцы: следовали за другими богами, служили им и поклонялись им. Они не оставляли своих дел и своего упорного пути.[a]'
  to: 'Когда судья умирал, они вновь возвращались к прежнему и поступали ещё хуже, чем их отцы: следовали за другими богами, служили им и поклонялись им. Они не отказывались от своих дел и от своего упрямого образа жизни.[a]'
  rationale: Исправлены две стилистические проблемы без изменения смысла. «Вновь возвращались» передаёт יָשֻׁבוּ без тавтологии, а «упрямый образ жизни» естественно выражает метафору «жёсткого/упрямого пути». Сноска сохранена, поскольку она уместно отмечает буквальный образ глагола הִפִּילוּ («отбрасывали, давали отпасть») и объясняет идиоматический перевод.
