  text: וְ/הָיָ֣ה בְּ/מ֣וֹת הַ/שּׁוֹפֵ֗ט יָשֻׁ֨בוּ֙ וְ/הִשְׁחִ֣יתוּ מֵֽ/אֲבוֹתָ֔/ם לָ/לֶ֗כֶת אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים לְ/עָבְדָ֖/ם וּ/לְ/הִשְׁתַּחֲוֺ֣ת לָ/הֶ֑ם לֹ֤א הִפִּ֨ילוּ֙ מִ/מַּ֣עַלְלֵי/הֶ֔ם וּ/מִ/דַּרְכָּ֖/ם הַ/קָּשָֽׁה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
translation:
  language: ru
  text: 'Когда судья умирал, они вновь возвращались к прежнему и поступали ещё хуже, чем их отцы: следовали за другими богами, служили им и поклонялись им. Они не отказывались от своих дел и от своего упрямого образа жизни.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не отбрасывали своих дел и своего упрямого образа жизни»; то есть не отказывались от них.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּמוֹת הַשּׁוֹפֵט
  choice: Когда судья умирал
  rationale: Еврейская повествовательная конструкция передана естественным временным придаточным. Несовершенный вид по-русски уместен для повторяющегося цикла, описываемого в контексте.
- source_word: יָשֻׁבוּ
  choice: они снова возвращались к прежнему
  rationale: Глагол שׁוב обозначает возврат и здесь — повторное впадение в прежнее поведение после смерти судьи. Дополнение «к прежнему» ясно передаёт подразумеваемый смысл, не уточняя его сверх контекста.
- source_word: וְהִשְׁחִיתוּ מֵאֲבוֹתָם
  choice: поступали ещё порочнее, чем их отцы
  rationale: Hiphil от שׁחת обозначает развращённое, порочное поведение; сравнительная конструкция с מן передана прямо. «Отцы» сохраняет конкретную лексику оригинала и относится к предыдущим поколениям.
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: следовали за другими богами
  rationale: Сочетание «идти за» выражает приверженность; русское «следовать за» естественно сохраняет этот образ. אֱלֹהִים אֲחֵרִים буквально означает «другие боги».
- source_word: לְעָבְדָם
  choice: служили им
  rationale: «Служить» — прямой эквивалент עבד и сохраняет отличие от следующего глагола поклонения.
- source_word: וּלְהִשְׁתַּחֲוֺת לָהֶם
  choice: и поклонялись им
  rationale: Глагол обозначает преклонение или простирание в знак почитания. «Поклонялись» естественно передаёт как телесный жест, так и культовый смысл.
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם
  choice: не оставляли своих дел
  rationale: Буквальный образ — «не роняли/не отбрасывали»; в данном сочетании он означает, что они не отказывались от своих поступков. «Не оставляли» звучит естественно и сохраняет направленность смысла.
- source_word: וּמִדַּרְכָּם הַקָּשָׁה
  choice: и своего упорного пути
  rationale: דֶּרֶךְ метафорически обозначает образ жизни, а קָשֶׁה — нравственную жёсткость и упрямство. «Упорный путь» сохраняет образ пути и отрицательную характеристику.
theological_decisions:
- issue: Передача אֱלֹהִים אֲחֵרִים в контексте отступничества Израиля
  choice: другие боги
  alternative: чужие боги
  rationale: «Другие боги» непосредственно сохраняет противопоставление Господу и не добавляет этнического или территориального оттенка, которого выражение само по себе не требует.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повторяющийся характер описанного цикла передан несовершенным видом. Синтаксис упрощён для ясности, при этом параллельность «служили им и поклонялись им» и метафора пути сохранены.
