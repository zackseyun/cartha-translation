  naturalness: '«Снова возвращались к прежнему» содержит стилистическую избыточность: сам глагол «возвращались» уже выражает повторность. «Упорный путь» — неудачная русская сочетаемость; «упрямый образ жизни» естественнее и сохраняет нравственную характеристику.'
