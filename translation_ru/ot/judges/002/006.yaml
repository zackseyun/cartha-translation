  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: וַיְשַׁלַּח — «отпустил», הָעָם — «народ», בְּנֵי יִשְׂרָאֵל — «сыны Израиля», распределительное אִישׁ — «каждый», לְנַחֲלָתוֹ — «в свой удел» и целевое לָרֶשֶׁת אֶת־הָאָרֶץ — «чтобы овладеть землёй». «Тогда» уместно передаёт повествовательный waw. Смысловых добавлений или утрат нет.'
