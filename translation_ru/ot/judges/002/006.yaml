base_translation:
  language: en
  yaml_path: translation/ot/judges/002/006.yaml
  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
translation:
  language: ru
  text: Тогда Иисус Навин отпустил народ, и сыны Израиля[a] пошли каждый в свой удел, чтобы овладеть землёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: Лексическая альтернатива поясняет древнееврейское корпоративное обозначение народа.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: отпустил
  rationale: В данном контексте שׁלח означает отпустить или распустить собравшийся народ; «отпустил» естественно передаёт завершение собрания и отправление людей по уделам.
- source_word: הָעָם
  choice: народ
  rationale: Еврейский текст прямо говорит «народ»; уточнение «народ Израиля» в основной текст не добавляется.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет традиционный библейский оборот и формальную связь с еврейским выражением, при этом в примечании дан современный естественный эквивалент.
- source_word: אִישׁ
  choice: каждый
  rationale: В сочетании с единственным числом «в свой удел» слово передаёт распределительное значение אִישׁ без неестественного для современного русского уточнения «каждый мужчина».
- source_word: לְנַחֲלָתוֹ
  choice: в свой удел
  rationale: «Удел» естественно обозначает наследственно выделенную племени или роду землю и сохраняет контекст распределения обетованной земли.
- source_word: לָרֶשֶׁת
  choice: чтобы овладеть
  rationale: Целевая конструкция передаёт назначение похода, а «овладеть» сохраняет активный смысл ירשׁ — вступить во владение землёй.
- source_word: הָאָרֶץ
  choice: землёй
  rationale: В контексте речь идёт о конкретной земле, отданной Израилю; определённость ясна из повествования и не требует добавления названия Ханаан.
theological_decisions:
- issue: Обозначение народа Израиля с грамматически мужским компонентом
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет образную и заветную формулу בְנֵי יִשְׂרָאֵל, не сужая её референцию только до взрослых мужчин; современный корпоративный эквивалент указан в примечании.
- issue: Терминология земельного наследия
  choice: удел
  alternative: наследие
  rationale: «Удел» в русском языке ясно обозначает выделенную часть земли и не сводит её к обычной частной собственности; при этом сохраняется связь с распределением земли между коленами.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской формулой «сыны Израиля». Синтаксис сохраняет последовательность еврейского повествования, но остаётся естественным для современного читателя.
