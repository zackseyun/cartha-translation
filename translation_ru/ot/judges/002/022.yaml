base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
translation:
  language: ru
  text: 'чтобы испытать ими[a] Израиль: соблюдают ли они путь Яхве, следуя ему, как соблюдали его их отцы, или нет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через них». Местоимение относится к народам, оставленным в земле (см. предыдущий контекст).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: чтобы
  rationale: Передаёт целевое значение конструкции кратко и естественно по-русски.
- source_word: נַסּוֹת
  choice: испытать
  rationale: Глагол נסה обозначает проверку верности Израиля посредством оставленных народов.
- source_word: בָּם
  choice: ими
  rationale: Местоимение относится к народам, оставленным в земле; творительный падеж сохраняет инструментальное значение. Возможен перевод «через них».
- source_word: הֲשֹׁמְרִים הֵם
  choice: будут ли они держаться
  rationale: Вопросительная частица и причастие выражают содержание испытания. Будущее время естественно в русском после «испытать», а «держаться» уместно сочетается с образом пути.
- source_word: דֶּרֶךְ יְהוָה
  choice: пути Яхве
  rationale: Сохраняется библейский образ пути как предписанного Богом образа жизни и личное имя יהוה.
- source_word: לָלֶכֶת בָּם
  choice: идя по нему
  rationale: Передаёт буквальный образ хождения; местоимение согласовано по смыслу с единственным числом «путь», хотя в еврейском тексте форма местоимения множественного числа.
- source_word: כַּאֲשֶׁר שָׁמְרוּ אֲבוֹתָם
  choice: как держались их отцы
  rationale: Сохраняет повтор корня שמר посредством того же русского глагола и передаёт אבותם как явно мужское родословное обозначение.
- source_word: אִם לֹא
  choice: или нет
  rationale: В составе косвенного вопроса естественно завершает конструкцию «будут ли… или нет».
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; форма «Яхве» непосредственно передаёт его, не заменяя титулом.
- issue: Обозначение предков אֲבוֹתָם
  choice: их отцы
  alternative: их предки
  rationale: «Отцы» сохраняет мужскую форму исходного текста и родословный оттенок, не расширяя значение до гендерно нейтрального.
- issue: Характер испытания Израиля
  choice: испытать… будут ли они держаться
  alternative: искушать
  rationale: נסה здесь означает проверку верности, а не побуждение ко злу; перевод «испытать» не вносит чуждого тексту нравственного смысла.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского образа пути. Формулировка «держаться пути… идя по нему» намеренно сохраняет повтор и образность еврейского текста, не сглаживая их до отвлечённого «повиноваться».
