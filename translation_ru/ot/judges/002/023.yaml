  text: וַ/יַּנַּ֤ח יְהוָה֙ אֶת הַ/גּוֹיִ֣ם הָ/אֵ֔לֶּה לְ/בִלְתִּ֥י הוֹרִישָׁ֖/ם מַהֵ֑ר וְ/לֹ֥א נְתָנָ֖/ם בְּ/יַד יְהוֹשֻֽׁעַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
translation:
  language: ru
  text: И оставил Яхве эти народы[a], не изгнав их быстро, и не предал их в руки Иисуса Навина.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «позволил этим народам остаться»; древнееврейский глагол может означать также «оставил на месте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: оставил
  rationale: Каузативная форма от נוח здесь означает «позволил остаться, оставил». Краткое «оставил» точно передаёт смысл и не добавляет отсутствующего в тексте уточнения «на месте».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет различие между именем Бога и титулом «Господь».
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: эти народы
  rationale: גּוֹיִם обозначает народы или этнические общности; в данном контексте речь идёт о народах, оставшихся в Ханаане.
- source_word: לְבִלְתִּי הוֹרִישָׁם
  choice: не изгнав их
  rationale: Отрицательная инфинитивная конструкция описывает то, что Яхве не изгнал эти народы; каузатив הוֹרִישׁ означает изгнать или лишить владения.
- source_word: מַהֵר
  choice: вскоре
  rationale: Наречие выражает быстроту действия. В связи с отрицанием «не изгнав их вскоре» естественно передаёт временной смысл «не изгнав быстро/сразу».
- source_word: וְלֹא נְתָנָם
  choice: и не предал их
  rationale: נתן с оборотом «в руку» в военном контексте означает отдать или предать под власть противника.
- source_word: בְּיַד יְהוֹשֻׁעַ
  choice: в руки Иисуса Навина
  rationale: Русский устойчивый оборот «предать в руки» сохраняет древнееврейский образ власти и военного превосходства. Имя יְהוֹשֻׁעַ передано в принятой русской библейской форме «Иисус Навин».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога. «Яхве» передаёт тетраграмматон как имя, не заменяя его титулом.
- issue: Причастность Яхве к сохранению народов в земле
  choice: оставил Яхве эти народы
  alternative: позволил этим народам остаться
  rationale: Формулировка сохраняет прямое утверждение исходного текста о действии Яхве и не ослабляет присущее контексту богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис близок к оригиналу, но остаётся естественным; традиционная русская форма имени «Иисус Навин» обеспечивает ясность.
