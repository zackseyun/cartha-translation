  source_fidelity: 'В целом перевод точно передаёт последовательность еврейского текста: гнев Яхве, предание грабителям, разграбление, продажа врагам и невозможность противостоять им. Однако «врагов, окружавших их со всех сторон» превращает מִסָּבִיב («вокруг; со всех сторон») в определительное причастное описание врагов и создаёт избыточное «окружавших ... со всех сторон». Лучше сохранить наречное значение при «враги».'
