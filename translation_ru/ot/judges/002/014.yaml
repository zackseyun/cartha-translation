  terminology: «Яхве» последовательно передаёт יהוה. «Продал их» верно сохраняет образ וַיִּמְכְּרֵם; «устоять перед своими врагами» точно передаёт неспособность противостоять. Согласованная пара «грабителям ... грабили» удачно отражает שֹׁסִים / וַיָּשֹׁסּוּ.
