base_translation:
  language: en
  yaml_path: translation/ot/judges/002/014.yaml
  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
translation:
  language: ru
  text: И воспылал гнев Яхве на Израиль[a]. Он предал их в руки грабителей[b], и те грабили их; продал их в руки врагов со всех сторон[c], так что они уже не могли устоять перед своими врагами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разгорелся гнев Яхве на Израиль».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «в руки» означает «под власть».
    reason: cultural_note
  - marker: c
    text: 'Или: «в руки всех окрестных врагов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: воспылал гнев
  rationale: Сохраняет яркий древнееврейский образ разгорающегося гнева и при этом естественно звучит в современном литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: предал их в руки
  rationale: Сохраняет понятную и в русском языке метафору перехода под чужую власть.
- source_word: שֹׁסִים ... וַיָּשֹׁסּוּ
  choice: грабителей, и те грабили их
  rationale: Передаёт однокоренное сочетание существительного и глагола в еврейском тексте, не сглаживая намеренный повтор.
- source_word: וַיִּמְכְּרֵם
  choice: продал их
  rationale: Сохраняет конкретный и суровый образ продажи, не ослабляя его до общего «отдал».
- source_word: אֹיְבֵיהֶם מִסָּבִיב
  choice: врагов, окружавших их со всех сторон
  rationale: Естественно выражает пространственное значение מִסָּבִיב и передаёт положение Израиля среди окружающих врагов.
- source_word: וְלֹא יָכְלוּ עוֹד לַעֲמֹד לִפְנֵי
  choice: они уже не могли устоять перед
  rationale: Передаёт неспособность держаться или сопротивляться перед противником, оставаясь близко к образу исходного текста.
theological_decisions:
- issue: Антропопатический образ Божьего гнева
  choice: воспылал гнев Яхве
  alternative: Яхве разгневался
  rationale: Основной вариант сохраняет образность еврейского выражения и силу повествования, не добавляя объяснений о природе Божьего гнева.
- issue: Образ продажи Израиля врагам
  choice: продал их
  alternative: отдал их во власть
  rationale: Буквальный образ сохранён как богословски значимая характеристика суда; его не следует смягчать пересказом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранены конкретные образы «гнев воспылал», «в руки» и «продал», а синтаксис слегка упорядочен для ясности. Местоимения, относящиеся к Богу, написаны со строчной буквы в соответствии с общей современной орфографической практикой, хотя в данном стихе подлежащее во втором предложении выражено явно только один раз.
