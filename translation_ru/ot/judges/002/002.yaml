base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
translation:
  language: ru
  text: А вы не должны были заключать союз с жителями этой земли; их жертвенники вы должны были разрушить. Но вы не послушались Моего голоса. Что же вы наделали?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  choice: заключать союз
  rationale: Естественная русская передача древнееврейской идиомы «рассекать завет». «Союз» сохраняет смысл обязывающего соглашения в данном контексте и звучит современнее, чем «заключать завет» применительно к жителям Ханаана.
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: с жителями этой земли
  rationale: Точно и естественно передаёт субстантивированное причастие «живущие» и сохраняет указательное «этой».
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  choice: их жертвенники вы должны были разрушить
  rationale: נתץ обозначает разрушение или снос сооружений, в том числе жертвенников. Прошедшая модальная конструкция передаёт напоминание о ранее данном повелении.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  choice: Но вы не послушались Моего голоса
  rationale: שמע בְּקוֹל подразумевает не только слышание, но и повиновение. «Не послушались голоса» сохраняет образ исходного текста и естественно выражает неповиновение.
- source_word: מַה זֹּאת עֲשִׂיתֶם
  choice: Что же вы наделали?
  rationale: Передаёт риторическое потрясение и укор древнееврейского оборота, не превращая вопрос о поступке в вопрос о побуждении.
- source_word: וְאַתֶּם לֹא ... תִּכְרְתוּ ... תִּתֹּצוּן
  choice: А вы не должны были заключать... вы должны были разрушить
  rationale: Имперфекты вспоминают прежние повеления на фоне последующего совершенного действия неповиновения; русская конструкция с «должны были» ясно передаёт неисполненную обязанность.
theological_decisions:
- issue: Терминология запрещённого соглашения Израиля с населением земли
  choice: заключать союз
  alternative: заключать завет
  rationale: בְּרִית может обозначать как завет, так и союз или договор. В политико-социальном контексте соглашения с жителями земли «союз» естественен и не устраняет обязывающего характера отношений; «завет» остаётся допустимой более формальной альтернативой.
translation_notes:
  register: Современный литературный русский язык, понятный широкому читателю; тон серьёзный и обличительный. Инверсия «их жертвенники вы должны были разрушить» сохраняет тематическое выделение объекта в еврейском тексте. Местоимение «Моего» оформлено с прописной буквы согласно распространённой русской библейской издательской традиции.
