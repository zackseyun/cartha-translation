  text: וַ/יַּעֲשׂ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יַּעַבְד֖וּ אֶת הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
translation:
  language: ru
  text: И сыны Израиля[a] делали зло в глазах Яхве и служили Ваалам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поклонялись Ваалам». Еврейский глагол может обозначать служение, совершаемое как поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: делали
  rationale: Обычное значение глагола עשה — «делать». В сочетании с הָרַע естественное русское выражение «делать зло» сохраняет и смысл, и лаконичность оригинала.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Передаёт буквальный семейно-родовой образ еврейского выражения; в контексте речь идёт об израильском народе в целом, что отмечено в сноске.
- source_word: אֶת־הָרַע
  choice: зло
  rationale: Определённая форма в устойчивом обороте «делать зло» по-русски естественно передаётся без указательного местоимения; моральная оценка сохранена.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранена еврейская метафора божественной оценки; выражение ясно и естественно в современном литературном русском языке.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное заветное имя передано общепринятой русской транслитерацией, а не заменено титулом.
- source_word: וַיַּעַבְדוּ
  choice: служили
  rationale: Глагол עבד обозначает служение и в данном культовом контексте включает поклонение. «Служили» сохраняет его более широкий смысл и заветный контраст между служением Яхве и иным богам.
- source_word: הַבְּעָלִים
  choice: Ваалам
  rationale: Сохранено множественное число еврейского текста, указывающее на Ваалов — местные проявления или образы ханаанского божества; падежная форма обусловлена русским управлением глагола «служить».
theological_decisions:
- issue: Передача заветного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте непосредственно стоит Тетраграмматон. Передача «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
- issue: Значение עבד в контексте идолопоклонства
  choice: служили
  alternative: поклонялись
  rationale: Контекст допускает и предполагает культовое поклонение, однако «служили» точнее сохраняет лексическую широту глагола и богословски значимый контраст служения разным господам.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены исходная метафора «в глазах», родовое выражение «сыны Израиля» и множественное число «Ваалы», при этом синтаксис остаётся простым и понятным.
