source:
  edition: WLC
  text: וַ/יַּ֧עַל מַלְאַךְ יְהוָ֛ה מִן הַ/גִּלְגָּ֖ל אֶל הַ/בֹּכִ֑ים וַ/יֹּאמֶר֩ אַעֲלֶ֨ה אֶתְ/כֶ֜ם מִ/מִּצְרַ֗יִם וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נִשְׁבַּ֨עְתִּי֙ לַ/אֲבֹ֣תֵי/כֶ֔ם וָ/אֹמַ֕ר לֹֽא אָפֵ֧ר בְּרִיתִ֛/י אִתְּ/כֶ֖ם לְ/עוֹלָֽם־־־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
translation:
  language: ru
  text: 'Ангел Яхве[b] поднялся от Галгала к Бохиму[a] и сказал: «Я вывел вас из Египта и привёл вас в землю, о которой Я поклялся вашим отцам, и сказал: „Я никогда не нарушу Моего завета с вами“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Бохим», вероятно, означает «плачущие» или указывает на место плача.
    reason: cultural_note
  - marker: b
    text: 'Или: «вестник Яхве».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ангел Яхве
  rationale: מַלְאַךְ может означать и «вестник», и «ангел». В данном повествовании традиционное «ангел» естественно обозначает небесного посланника, а личное имя יְהוָה передано как «Яхве»; кем именно является этот говорящий, перевод не уточняет.
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Глагол עלה выражает движение вверх; «поднялся» сохраняет направленность исходного текста и естественно звучит по-русски.
- source_word: הַגִּלְגָּל
  choice: Галгал
  rationale: Географическое название передано принятой русской библейской транслитерацией.
- source_word: הַבֹּכִים
  choice: Бохим
  rationale: Название места сохранено как имя собственное, а его вероятное значение пояснено в сноске.
- source_word: אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם
  choice: Я вывел вас из Египта
  rationale: Хотя форма אַעֲלֶה морфологически допускает значение будущего времени, контекст представляет речь как обзор уже совершённых спасительных деяний; русское прошедшее время ясно передаёт этот ход повествования.
- source_word: וָאָבִיא אֶתְכֶם
  choice: и привёл
  rationale: Каузативная форма בוא означает «привести, ввести»; указанное далее место назначения позволяет передать её естественным русским «привёл в землю».
- source_word: הָאָרֶץ אֲשֶׁר נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם
  choice: землю, которую клятвенно обещал вашим отцам
  rationale: Формулировка сохраняет землю как предмет данного праотцам обещания, передаёт силу глагола «клясться» и не заменяет явно мужское «отцам» нейтральным «предкам».
- source_word: לֹא אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם
  choice: Я никогда не нарушу моего завета с вами
  rationale: הפר в контексте завета означает «нарушить, расторгнуть», а сочетание отрицания с לְעוֹלָם естественно передаётся словом «никогда».
theological_decisions:
- issue: Личность מַלְאַךְ יְהוָה
  choice: «Ангел Яхве» без определения его природы
  alternative: «Вестник Яхве» как сотворённый посланник либо явление самого Яхве
  rationale: Ангел говорит от первого лица как Бог, но стих прямо не объясняет его природу. Перевод сохраняет это богословское напряжение и не разрешает его за читателя.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и достойным библейским звучанием. Личное имя יְהוָה передано как «Яхве». Местоимения, относящиеся к Богу, написаны со строчной буквы по общим нормам современного русского текста.
