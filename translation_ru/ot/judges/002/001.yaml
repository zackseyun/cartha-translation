revisions:
- from: 'Ангел Яхве[b] поднялся из Галгала в Бохим[a] и сказал: «Я вывел вас из Египта и привёл в землю, которую клятвенно обещал вашим отцам. Я сказал: „Я никогда не нарушу моего завета с вами“».'
  to: 'Ангел Яхве[b] поднялся от Галгала к Бохиму[a] и сказал: «Я вывел вас из Египта и привёл вас в землю, о которой Я поклялся вашим отцам, и сказал: „Я никогда не нарушу Моего завета с вами“».'
  rationale: 'Правка улучшает естественность русского текста и точнее сохраняет синтаксическую последовательность оригинала. Формула «о которой Я поклялся вашим отцам» передаёт еврейское выражение без искусственного «клятвенно обещал» и без добавления невыраженного глагола «дать». Сноски и их привязки сохранены: [a] относится к Бохиму, [b] — к «Ангелу Яхве».'
  reviewer_model: gpt-5.6-terra
