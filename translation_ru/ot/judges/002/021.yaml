  text: גַּם אֲנִי֙ לֹ֣א אוֹסִ֔יף לְ/הוֹרִ֥ישׁ אִ֖ישׁ מִ/פְּנֵי/הֶ֑ם מִן הַ/גּוֹיִ֛ם אֲשֶׁר עָזַ֥ב יְהוֹשֻׁ֖עַ וַ/יָּמֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/021.yaml
  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
translation:
  language: ru
  text: И Я больше не стану изгонять от них ни одного из народов, которых Иисус Навин оставил после себя, когда умер[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которых оставил Иисус Навин — и он умер». Союз וַ־ перед «умер» можно передать простым «и»; в основном тексте выражена подразумеваемая временная связь.'
    reason: Сохраняет более буквальную синтаксическую альтернативу и отмечает неоднозначность связи וַיָּמֹת с предшествующим высказыванием.
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: И Я
  rationale: Сочетание גַּם с самостоятельным местоимением подчёркивает говорящего и связывает это решение с предшествующими словами; «И Я» естественно передаёт оба оттенка.
- source_word: לֹא אוֹסִיף
  choice: больше не стану
  rationale: 'В отрицательной конструкции Hiphil глагола יסף с инфинитивом обозначает прекращение действия: говорящий впредь не будет его совершать. Русское «больше не стану» передаёт это без стилистической избыточности.'
- source_word: לְהוֹרִישׁ
  choice: изгонять
  rationale: В контексте овладения землёй הורישׁ означает удалять прежних жителей, вытеснять их; «изгонять» ясно и естественно для современного русского текста.
- source_word: אִישׁ ... מִן הַגּוֹיִם
  choice: ни одного из народов
  rationale: 'אִישׁ в сочетании с партитивным מִן имеет усилительно-распределительный смысл: «ни одного», «даже одного». Такой перевод точно передаёт охват отрицания.'
- source_word: מִפְּנֵיהֶם
  choice: от них
  rationale: Оборот с פָּנִים обозначает удаление из присутствия или с пути людей. В сочетании с «изгонять» русское «от них» естественно выражает направленность удаления, хотя менее буквально, чем «из-пред их лица».
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  choice: оставленных Иисусом Навином
  rationale: עזב означает «оставить, оставить после себя». Пассивный причастный оборот сохраняет Иисуса Навина как деятеля и позволяет построить ясную современную русскую фразу.
- source_word: וַיָּמֹת
  choice: к моменту его смерти
  rationale: Буквально форма означает «и он умер». В данном контексте присоединение указывает на временную границу того, что Иисус Навин оставил после себя; перевод делает эту связь явной, а буквальная конструкция отмечена в сноске.
theological_decisions:
- issue: Обозначение говорящего от первого лица в контексте Божьей речи
  choice: Сохранено «Я» без добавления имени «Господь».
  alternative: Добавить «Господь» для пояснения говорящего.
  rationale: В еврейском тексте стоит только местоимение первого лица; личность говорящего уже установлена контекстом, поэтому добавление Божьего имени в основной текст не требуется.
- issue: Связь смерти Иисуса Навина с оставшимися народами
  choice: 'В основном тексте וַיָּמֹת передано как временная граница: «к моменту его смерти».'
  alternative: 'Формально сохранить последовательность: «которых оставил Иисус Навин — и умер».'
  rationale: Еврейская конструкция допускает буквальное последовательное прочтение, но по смыслу смерть завершает период деятельности Иисуса Навина. Временная передача делает русский текст связным, не утверждая дополнительной богословской причинности; формальная альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно торжественный. Конструкция «больше не стану» естественно передаёт прекращение прежнего действия; архаическое «из-пред лица их» не используется. Традиционное русское имя יְהוֹשֻׁעַ передано как «Иисус Навин».
