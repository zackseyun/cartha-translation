    rationale: וַיָּקֶם — wayyiqtol, повествовательная форма прошедшей последовательности; она не маркирует несовершенный вид. Повторяемость может вытекать из обзорного контекста, но не из морфологии этой формы.
  - severity: low
    issue: Сочетание «Тогда Яхве воздвигал» менее естественно для современного русского повествования.
    rationale: Совершенный глагол «поставил» точнее передаёт представление о Божьем поставлении судей, тогда как последующее «спасали» может сохранять обобщённый, неоднократный характер их служения.
  revised_text: Тогда Яхве поставил судей, и они спасали[a] их из рук грабителей.
