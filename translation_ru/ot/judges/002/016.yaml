  text: וַ/יָּ֥קֶם יְהוָ֖ה שֹֽׁפְטִ֑ים וַ/יּ֣וֹשִׁיע֔וּ/ם מִ/יַּ֖ד שֹׁסֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/016.yaml
  text: Then Yahweh raised up judges[a], and they saved them from the hand of those who plundered them.
translation:
  language: ru
  text: Тогда Яхве поставил судей, и они спасали[a] их из рук грабителей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избавляли».'
    reason: Лексическая альтернатива для ישׁע, передающая освобождение из-под власти грабителей.
lexical_decisions:
- source_word: וַיָּקֶם
  choice: воздвигал
  rationale: Порода hифиль глагола קום означает, что Яхве давал судьям появиться и ставил их на служение. «Воздвигал» сохраняет образ исходного текста, а несовершенный вид передаёт повторяющееся действие в обзорном повествовании.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, без замены титулом.
- source_word: שֹׁפְטִים
  choice: судей
  rationale: Прямое соответствие еврейскому названию этих руководителей; их роль спасителей раскрывается последующим глаголом и не подменяет наименование.
- source_word: וַיּוֹשִׁיעוּם
  choice: они спасали их
  rationale: Глагол ישׁע обозначает спасение или избавление от непосредственной опасности. Несовершенный вид естественно согласуется с обобщающим описанием многократного действия судей.
- source_word: מִיַּד
  choice: из рук
  rationale: Сохранена понятная по-русски еврейская метафора власти и контроля.
- source_word: שֹׁסֵיהֶם
  choice: грабителей
  rationale: Слово обозначает тех, кто насильственно разоряет и расхищает; «грабители» кратко и ясно сохраняет этот хищнический оттенок.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет его как имя, а не заменяет титулом.
- issue: Представить שֹׁפְטִים как судей или как избавителей
  choice: Сохранить «судей», а их спасительную деятельность выразить отдельным глаголом
  alternative: избавителей; вождей
  rationale: Исходный текст одновременно называет их судьями и говорит, что они спасали народ; перевод сохраняет оба аспекта, не сводя их служение только к одной функции.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Воздвигал» сохраняет традиционный и понятный образ, тогда как остальная фраза сформулирована просто и естественно. Маркер сноски поставлен непосредственно после слова, к которому относится вариант.
