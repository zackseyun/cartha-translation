  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מֶה עָשִׂ֥יתִי עַתָּ֖ה כָּ/כֶ֑ם הֲ/ל֗וֹא ט֛וֹב עֹלְל֥וֹת אֶפְרַ֖יִם מִ/בְצִ֥יר אֲבִיעֶֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/002.yaml
  text: But he said to them[a], “What have I done now compared to you? Are not the gleanings of Ephraim better than the grape harvest of Abiezer?”
translation:
  language: ru
  text: 'Он же сказал им: «Что я теперь сделал по сравнению с вами? Разве оставшиеся после сбора гроздья Ефрема не лучше сбора винограда Авиезера?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Он же сказал им
  rationale: Форма продолжает повествование, а частица «же» естественно передаёт контраст с упрёком ефремлян в предыдущем стихе.
- source_word: מֶה עָשִׂיתִי עַתָּה כָּכֶם
  choice: Что сделал я в сравнении с вами?
  rationale: Предлог כ здесь выражает сравнение; необычный для нейтральной речи порядок слов сохраняет акцент на самоумалении Гедеона.
- source_word: הֲלוֹא
  choice: Разве ... не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: עֹלְלוֹת אֶפְרַיִם
  choice: оставшиеся гроздья Ефрема
  rationale: עֹלְלוֹת обозначает виноград, оставшийся после основного сбора. Такая формулировка ясна современному читателю и сохраняет образ виноградника.
- source_word: טוֹב ... מִבְצִיר
  choice: лучше всего сбора винограда
  rationale: Прилагательное טוֹב с сравнительным מִן имеет значение «лучше, чем»; добавление «всего» подчёркивает противопоставление остатков полному сбору, подразумеваемое метафорой.
- source_word: אֲבִיעֶזֶר
  choice: Авиезер
  rationale: Традиционная русская передача имени родоначальника рода, к которому принадлежал Гедеон.
