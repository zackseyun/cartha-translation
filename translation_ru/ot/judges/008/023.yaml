base_translation:
  language: en
  yaml_path: translation/ot/judges/008/023.yaml
  text: But Gideon said to them[a], “I will not rule over you, and my son will not rule over you; Yahweh will rule over you.”
translation:
  language: ru
  text: 'Но Гедеон сказал им[a]: «Я не буду править вами, и мой сын не будет править вами; Яхве будет править вами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Гедеон сказал им». Еврейский союз может быть передан обычным повествовательным «и», но «но» подчёркивает противопоставление просьбе народа в предыдущем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но ... сказал
  rationale: Последовательный союз продвигает повествование, однако в контексте ответ Гедеона противопоставлен просьбе народа в предыдущем стихе; поэтому естественно русское «но».
- source_word: אֲלֵהֶם
  choice: им
  rationale: Обычная передача предлога с местоименным суффиксом в конструкции с глаголом речи.
- source_word: גִּדְעוֹן
  choice: Гедеон
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: לֹא אֶמְשֹׁל אֲנִי בָּכֶם
  choice: Не я буду править вами
  rationale: Глагол מָשַׁל означает «править, властвовать». Постановка «не я» передаёт выраженное в еврейском тексте местоимение אֲנִי и подчёркивает противопоставление Гедеона, его сына и Яхве.
- source_word: וְלֹא יִמְשֹׁל בְּנִי בָּכֶם
  choice: и не мой сын будет править вами
  rationale: Сохраняются сочинительная связь, параллелизм и указание на сына в единственном числе, важное для отрицания наследственного правления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени сохраняет различие между именем Бога и титулом «Господь».
- source_word: יְהוָה יִמְשֹׁל בָּכֶם
  choice: Яхве будет править вами
  rationale: Повтор «будет править вами» сохраняет ключевой глагол и риторический контраст между правлением Гедеона, его сына и Яхве.
theological_decisions:
- issue: Отказ Гедеона от правления, подобного царскому
  choice: Гедеон отвергает своё и наследственное правление и утверждает правление Яхве.
  alternative: Гедеон отвергает лишь формальный царский титул, сохраняя фактическую власть.
  rationale: В стихе трижды употреблён глагол מָשַׁל («править»), но нет отдельного слова «царь». Перевод сохраняет формулировку и напряжение текста, не уточняя сверх сказанного, от какого именно политического статуса отказывается Гедеон.
translation_notes:
  register: Современный литературный русский язык; речь ясная и торжественно-сдержанная. Повтор глагола «править» намеренно сохранён. Маркер [a] помещён непосредственно после соответствующей части текста.
