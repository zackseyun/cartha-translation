  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
translation:
  language: ru
  text: 'И он сказал: «Они были моими братьями, сыновьями моей матери.[a] Жив Яхве! Если бы вы оставили их в живых[b], я не убил бы вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «сыновья моей матери» подчёркивает особенно близкое родство: это не просто сородичи.'
    reason: cultural_note
  - marker: b
    text: 'Еврейская конструкция выражает нереальное условие в прошлом: если бы они сохранили братьям жизнь, Гедеон не убил бы их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: И он сказал
  rationale: Обычная передача повествовательной формы wayyiqtol; сохраняет связь с предыдущим контекстом, не усиливая временную последовательность.
- source_word: אַחַי בְּנֵי אִמִּי הֵם
  choice: Они были моими братьями, сыновьями моей матери
  rationale: «Братья» передаёт прямое родство, а приложение «сыновья моей матери» сохраняет древнееврейскую формулировку и уточняет близость родства. Прошедшее время естественно, поскольку речь идёт об уже убитых людях.
- source_word: חַי יְהוָה
  choice: Жив Яхве!
  rationale: Традиционная и понятная по-русски формула клятвы; личное имя יְהוָה передано транслитерацией «Яхве», а не заменено титулом.
- source_word: לוּ הַחֲיִתֶם אוֹתָם
  choice: Если бы вы оставили их в живых
  rationale: לוּ вводит нереальное условие, а каузатив глагола חיה означает сохранение жизни. Формулировка естественна по-русски и близка к исходному образу.
- source_word: לֹא הָרַגְתִּי אֶתְכֶם
  choice: я не убил бы вас
  rationale: Русская конструкция с частицей «бы» ясно выражает следствие неосуществившегося условия в прошлом и сохраняет прямой глагол «убить».
theological_decisions:
- issue: Передача имени יְהוָה в клятвенной формуле
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога, поэтому оно сохранено как «Яхве», без замены титулом.
- issue: Степень родства убитых с Гедеоном
  choice: братья, сыновья моей матери
  alternative: родные братья
  rationale: Основной текст сохраняет буквальное уточнение исходника и не устраняет возможный вопрос об отцовстве; примечание поясняет обычный смысл выражения в данном контексте.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Сохранены краткость, эмоциональная сила признания и торжественная формула клятвы; синтаксис условного периода сделан естественным для современного читателя.
