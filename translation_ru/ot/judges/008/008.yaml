revisions:
- from: Оттуда он поднялся к Пенуэлу[a] и обратился к его жителям с теми же словами[b]. Но жители Пенуэла ответили ему так же, как жители Суккота.
  to: Оттуда он поднялся в Пенуэл[a] и обратился к жителям Пенуэла с такой же просьбой[b]. Жители Пенуэла ответили ему так же, как жители Суккота.
  rationale: Удалён не выраженный в оригинале противительный союз. Формулировка о просьбе передаёт анафорическую связь כָּזֹאת с предыдущим стихом, не предполагая дословного повтора. Уточнено прямое дополнение при «обратился».
