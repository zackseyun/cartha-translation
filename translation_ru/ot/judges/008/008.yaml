  yaml_path: translation/ot/judges/008/008.yaml
  text: From there he went up to Penuel and spoke to them in the same way[b][a], and the men of Penuel answered him just as the men of Succoth had answered.
translation:
  language: ru
  text: Оттуда он поднялся в Пенуэл[a] и обратился к жителям Пенуэла с такой же просьбой[b]. Жители Пенуэла ответили ему так же, как жители Суккота.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В других местах это название также передаётся как «Пениэл».
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «и говорил им так». Это отсылает к просьбе, с которой Гедеон обратился к жителям Суккота в предыдущем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִשָּׁם
  choice: Оттуда он поднялся
  rationale: Глагол עלה сохраняет направительное значение «подниматься, идти вверх», а מִשָּׁם прямо отсылает к предыдущему месту.
- source_word: פְּנוּאֵל
  choice: Пенуэл
  rationale: Передача соответствует согласному составу названия в данном стихе и принятой русской библейской форме.
- source_word: וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת
  choice: обратился к его жителям с теми же словами
  rationale: 'Буквально: «говорил им так». Формулировка естественно передаёт отсылку к просьбе Гедеона в предыдущем стихе, не повторяя её содержание.'
- source_word: וַיַּעֲנוּ אוֹתוֹ
  choice: ответили ему
  rationale: Обычное и точное соответствие конструкции ענה с прямым дополнением.
- source_word: אַנְשֵׁי פְנוּאֵל
  choice: жители Пенуэла
  rationale: В контексте это представители городского сообщества. Русское «жители» звучит естественнее буквального «мужи», не меняя референта.
- source_word: כַּאֲשֶׁר עָנוּ אַנְשֵׁי סֻכּוֹת
  choice: так же, как жители Суккота
  rationale: כַּאֲשֶׁר выражает прямое сравнение с ответом, данным ранее жителями Суккота.
- source_word: סֻכּוֹת
  choice: Суккот
  rationale: Транслитерация еврейского топонима в форме, понятной современному русскому читателю.
