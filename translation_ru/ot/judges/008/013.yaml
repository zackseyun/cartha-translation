lexical_decisions:
- source_word: וַיָּשָׁב
  choice: И вернулся
  rationale: Форма wayyiqtol от שׁוב продолжает основную линию повествования; «вернулся» передаёт прямое значение, а союз «и» сохраняет повествовательную связь.
- source_word: גִּדְעוֹן
  choice: Гедеон
  rationale: Традиционная и общепринятая русская передача личного имени.
- source_word: בֶּן יוֹאָשׁ
  choice: сын Иоаса
  rationale: Прямая и естественная передача еврейского патронима в приложении.
- source_word: מִן הַמִּלְחָמָה
  choice: с битвы
  rationale: В данном эпизоде מִלְחָמָה обозначает конкретное сражение; по-русски возвращаются «с битвы».
- source_word: מִלְמַעֲלֵה
  choice: через подъём
  rationale: Предложная конструкция, вероятно, указывает на маршрут возвращения; «через подъём» естественно передаёт топографический смысл, не устраняя трудность выражения.
- source_word: הֶחָרֶס
  choice: Херес
  rationale: В основном тексте слово передано как возможное название местности. Лексическая возможность понимать его как «солнце» сохранена в примечании.
