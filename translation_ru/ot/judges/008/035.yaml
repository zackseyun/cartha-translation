revisions:
- from: И не проявили они верности к дому Иероваала, то есть Гедеона, в ответ на всё добро, которое он сделал Израилю.
  to: И не проявили они доброты к дому Иероваала, то есть Гедеона, сообразно всему добру, которое он сделал Израилю.
  rationale: Исправлено узкое «верность» на «доброты», что точнее передаёт חֶסֶד без богословского или юридического сужения. «В ответ на» заменено на «сообразно», чтобы сохранить значение соответствия всему благу, сделанному Гедеоном для Израиля. Остальные элементы сохранены.
