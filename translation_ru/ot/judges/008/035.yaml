  text: וְ/לֹֽא עָשׂ֣וּ חֶ֔סֶד עִם בֵּ֥ית יְרֻבַּ֖עַל גִּדְע֑וֹן כְּ/כָל הַ/טּוֹבָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה עִם יִשְׂרָאֵֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/035.yaml
  text: And they did not show kindness to the house of Jerubbaal (that is, Gideon), in keeping with all the good that he had done for Israel.
translation:
  language: ru
  text: И не проявили они доброты к дому Иероваала, то есть Гедеона, сообразно всему добру, которое он сделал Израилю.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: верность
  rationale: Здесь слово обозначает преданное, благодарное отношение к дому благодетеля, а не просто доброту; «верность» естественно передаёт обязательство Израиля перед родом Гедеона.
- source_word: בֵּית
  choice: дом
  rationale: Сохраняет библейский образ рода или семьи Гедеона без излишнего уточнения в основном тексте.
- source_word: כְּכָל הַטּוֹבָה
  choice: в ответ на всё добро
  rationale: 'Предлог כ выражает соответствие: отношение Израиля к дому Гедеона должно было отвечать всему сделанному им добру.'
- source_word: עִם יִשְׂרָאֵל
  choice: Израилю
  rationale: В сочетании «сделал добро с кем-либо» по-русски естественно передаётся дательным падежом.
theological_decisions:
- issue: Соотношение имён Иероваал и Гедеон
  choice: Иероваала, то есть Гедеона
  alternative: Иероваала-Гедеона
  rationale: В данном контексте גִּדְעוֹן служит пояснением, отождествляющим Иероваала с Гедеоном; явное «то есть» устраняет возможное ошибочное понимание как двух лиц.
- issue: Характер חסד по отношению к дому Гедеона
  choice: верность
  alternative: милость / доброта
  rationale: Контекст подчёркивает неблагодарность и нарушение обязательства перед семьёй спасителя Израиля; при этом перевод не вводит специальной конфессиональной трактовки.
translation_notes:
  register: Современный литературный русский язык с сохранением библейского выражения «дом» в значении рода. Синтаксис достоинственный и понятный; добавленное «то есть» прозрачно передаёт пояснительную функцию имени «Гедеон».
