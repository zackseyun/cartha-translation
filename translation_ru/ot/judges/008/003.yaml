base_translation:
  language: en
  yaml_path: translation/ot/judges/008/003.yaml
  text: Into your hand God gave the princes of Midian[a], Oreb and Zeeb; and what was I able to do compared with you? Then their spirit relaxed toward him when he spoke this word.
translation:
  language: ru
  text: Бог отдал в ваши руки мадиамских вождей — Орива и Зива. Что я мог сделать в сравнении с вами? После этих слов их гнев на него утих.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тогда их дух ослабел по отношению к нему»; то есть их враждебный настрой утих.'
    reason: Сохраняет древнееврейский образ «духа» и поясняет идиоматический смысл без неточного «отступил».
lexical_decisions:
- source_word: בְּיֶדְכֶם נָתַן אֱלֹהִים
  choice: Бог отдал в ваши руки
  rationale: Русское выражение «отдать в руки» естественно передаёт древнееврейскую идиому о передаче под власть; множественное «руки» соответствует норме русского языка, несмотря на единственное число в источнике.
- source_word: שָׂרֵי מִדְיָן
  choice: мадиамских вождей
  rationale: שָׂרִים обозначает знатных правителей или военных предводителей. «Вожди» ясно передаёт их положение в данном повествовании, не приписывая им наследственного княжеского титула.
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: Орива и Зива
  rationale: Использованы традиционные русские библейские формы имён, узнаваемые читателями и уместные в русском переводе Писания.
- source_word: וּמַה יָּכֹלְתִּי עֲשׂוֹת כָּכֶם
  choice: Разве мои дела могут сравниться с вашими?
  rationale: Риторический вопрос выражает самоуничижительное сопоставление поступков Гедеона с достижением ефремлян. Такая формулировка естественна по-русски и сохраняет примирительный смысл реплики.
- source_word: רָפְתָה רוּחָם מֵעָלָיו
  choice: их гнев на него утих
  rationale: Буквально говорится, что их «дух ослабел/отступил от него»; в контексте это идиома об угасании направленного на Гедеона гнева. В основном тексте выбран ясный современный эквивалент, а образ источника сохранён в сноске.
- source_word: בְּדַבְּרוֹ הַדָּבָר הַזֶּה
  choice: Когда он сказал это
  rationale: Естественно передаёт обстоятельственное значение конструкции с инфинитивом и смысл הַדָּבָר הַזֶּה — «эти слова/это».
