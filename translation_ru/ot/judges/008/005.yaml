  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
translation:
  language: ru
  text: 'Он сказал мужчинам из Суккота: «Дайте, пожалуйста, хлебных лепёшек людям, идущим за мной[a]: они устали, а я преследую Зеваха и Цалмунну, царей Мадиана».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые у моих ног» — идиома о тех, кто сопровождает кого-либо или следует за ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  choice: мужчинам из Суккота
  rationale: Сохраняет мужской род אַנְשֵׁי и естественно передаёт обращение к мужчинам или мужским представителям города; название Суккот транслитерировано непосредственно с еврейского.
- source_word: תְּנוּ נָא
  choice: Дайте, пожалуйста
  rationale: Императив с נָא выражает вежливую или настоятельную просьбу; эта формулировка естественна в современном русском.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: хлеба
  rationale: В данном контексте речь идёт о хлебных караваях или лепёшках; собирательное «хлеба» по-русски естественно передаёт просьбу дать пищу, не навязывая неизвестную форму выпечки.
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  choice: людям, которые идут со мной
  rationale: Буквально «народу, который у моих ног» — идиома о сопровождающих Гедеона людях. Основной текст передаёт её смысл, а буквальный образ сохранён в сноске.
- source_word: עֲיֵפִים
  choice: устали
  rationale: Передаёт физическую усталость от напряжения без усиления до полного изнеможения.
- source_word: רֹדֵף אַחֲרֵי
  choice: преследую
  rationale: Причастная форма обозначает продолжающуюся погоню; русское настоящее время сохраняет этот длительный смысл.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Зеваха и Цалмунну
  rationale: Имена транслитерированы с еврейского; падежные окончания соответствуют русскому управлению глагола «преследую».
- source_word: מַלְכֵי מִדְיָן
  choice: царей Мадиана
  rationale: Прямо передаёт конструкцию «цари Мадиана» и сохраняет традиционное, понятное русскому читателю название Мадиан.
