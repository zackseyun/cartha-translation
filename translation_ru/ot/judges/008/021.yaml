  text: וַ/יֹּ֜אמֶר זֶ֣בַח וְ/צַלְמֻנָּ֗ע ק֤וּם אַתָּה֙ וּ/פְגַע בָּ֔/נוּ כִּ֥י כָ/אִ֖ישׁ גְּבוּרָת֑/וֹ וַ/יָּ֣קָם גִּדְע֗וֹן וַֽ/יַּהֲרֹג֙ אֶת זֶ֣בַח וְ/אֶת צַלְמֻנָּ֔ע וַ/יִּקַּח֙ אֶת הַ/שַּׂ֣הֲרֹנִ֔ים אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
translation:
  language: ru
  text: 'Тогда Зевах и Цалмунна сказали: «Встань сам и срази нас[a], ибо каков человек, такова и сила его»[b]. Гедеон встал и убил Зеваха и Цалмунну, а затем взял украшения в виде полумесяцев[c], висевшие на шеях их верблюдов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убей нас». Употреблённый здесь еврейский глагол может означать нападение или нанесение удара; в данном контексте удар явно должен быть смертельным.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ибо как человек, такова его сила». Это пословичное выражение связывает силу человека с ним самим; в данном контексте речь идёт о силе или доблести воина.'
    reason: cultural_note
  - marker: c
    text: 'Или: «полумесяцы»; то есть украшения в форме полумесяца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר זֶבַח וְצַלְמֻנָּע
  choice: Тогда Зевах и Цалмунна сказали
  rationale: Единственное число еврейского глагола при составном подлежащем передано естественным для русского языка множественным числом. «Тогда» выражает последовательность повествования.
- source_word: קוּם אַתָּה
  choice: Встань сам
  rationale: 'Личное местоимение при повелительном глаголе создаёт подчёркнутое противопоставление: казнить их должен сам Гедеон, а не его юный сын.'
- source_word: וּפְגַע בָּנוּ
  choice: и срази нас
  rationale: В данном контексте פגע обозначает нанесение смертельного удара. «Срази» сохраняет образ удара и ясно указывает на смертельный исход, не сводя выражение к нейтральному «напади».
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  choice: ибо каков человек, такова и сила его
  rationale: Сохранена краткая афористическая форма еврейской фразы и её связь между зрелостью или доблестью мужчины и его силой.
- source_word: וַיָּקָם גִּדְעוֹן
  choice: Гедеон встал
  rationale: Повтор глагола «встать» сохраняет словесную связь с приказом царей и показывает непосредственный ответ Гедеона.
- source_word: וַיַּהֲרֹג
  choice: и убил
  rationale: Прямой современный эквивалент обычного еврейского глагола со значением убийства.
- source_word: הַשַּׂהֲרֹנִים
  choice: украшения в виде полумесяцев
  rationale: Существительное обозначает полумесяцы, здесь — украшения соответствующей формы. Развёрнутая передача понятна современному читателю и не создаёт впечатления, будто речь идёт о небесных светилах.
- source_word: אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: висевшие на шеях их верблюдов
  rationale: Причастный оборот естественно передаёт относительное придаточное и ясно указывает, где находились украшения.
theological_decisions:
- issue: Мужской род в пословичном выражении כָאִישׁ
  choice: каков человек, такова и сила его
  alternative: каков мужчина, такова и сила его
  rationale: Слово אִישׁ имеет форму мужского рода и в контексте относится к взрослому воину. Русское «человек» сохраняет традиционную афористичность и грамматический мужской род, не устраняя контекстуальную связь с мужской воинской силой.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным регистром. Синтаксис сохраняет краткость и афористичность исходного текста; архаизмы избегаются, за исключением естественного в данном регистре союза «ибо».
