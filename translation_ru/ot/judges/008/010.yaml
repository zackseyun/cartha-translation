  text: וְ/זֶ֨בַח וְ/צַלְמֻנָּ֜ע בַּ/קַּרְקֹ֗ר וּ/מַחֲנֵי/הֶ֤ם עִמָּ/ם֙ כַּ/חֲמֵ֤שֶׁת עָשָׂר֙ אֶ֔לֶף כֹּ֚ל הַ/נּ֣וֹתָרִ֔ים מִ/כֹּ֖ל מַחֲנֵ֣ה בְנֵי קֶ֑דֶם וְ/הַ/נֹּ֣פְלִ֔ים מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף אִ֖ישׁ שֹׁ֥לֵֽף חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/010.yaml
  text: Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
translation:
  language: ru
  text: 'Зевах и Цалмунна находились в Каркоре, и с ними были их станы — около пятнадцати тысяч человек: все, кто остался от всего войска сынов Востока[a]. А павших было сто двадцать тысяч воинов, обнажавших меч.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всего войска восточных народов». Буквально: «войска сынов Востока».'
    reason: Устойчивое древнееврейское обозначение допускает как буквальную, так и более смысловую передачу.
lexical_decisions:
- source_word: בַּקַּרְקֹר
  choice: в Каркоре
  rationale: Предлог ב обозначает местонахождение; русское «в Каркоре» естественно передаёт конструкцию с названием места.
- source_word: וּמַחֲנֵיהֶם עִמָּם
  choice: и с ними были их станы
  rationale: Сохранено множественное число מַחֲנֵיהֶם. «Станы» передаёт лагеря и расположенные в них военные отряды, не сводя выражение только к абстрактному «войску».
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  choice: около пятнадцати тысяч человек
  rationale: Префикс כ указывает на приблизительность; «человек» добавлено по смыслу исчисляемого воинского состава.
- source_word: כֹּל הַנּוֹתָרִים
  choice: все, кто остался
  rationale: Форма нифаль от יתר обозначает оставшихся в живых или уцелевших; перевод сохраняет результативный смысл без усиления.
- source_word: מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  choice: от всего войска сынов Востока
  rationale: מִן передано как «от», а собирательное מַחֲנֶה в военном контексте — как «войско». Традиционно прозрачное «сыны Востока» сохраняет этногеографический оборот оригинала.
- source_word: וְהַנֹּפְלִים
  choice: А павших было
  rationale: Причастие נפל в контексте битвы означает погибших. Конструкция с «было» естественно вводит итоговое число по-русски.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: сто двадцать тысяч
  rationale: Прямое соответствие числительному оригинала.
- source_word: אִישׁ שֹׁלֵף חָרֶב
  choice: воинов, обнажавших меч
  rationale: Воинская идиома буквально описывает мужчин, извлекающих меч; «воинов, обнажавших меч» сохраняет образ и ясно обозначает боеспособных вооружённых мужчин.
