base_translation:
  language: en
  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: ru
  text: 'Тогда Гедеон сказал им: «У меня к вам одна просьба: пусть каждый отдаст мне по серьге из своей добычи». У них были золотые серьги, потому что они были измаильтянами.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  choice: У меня к вам одна просьба
  rationale: Естественно передаёт еврейскую фигуру с однокоренными глаголом и существительным, не воспроизводя её тяжеловесно по-русски.
- source_word: אִישׁ
  choice: каждый
  rationale: В распределительном употреблении означает каждого отдельного человека из названной группы.
- source_word: נֶזֶם
  choice: серьга
  rationale: В данном контексте золотое украшение, снятое с побеждённых; традиционное и контекстуально уместное значение.
- source_word: שְׁלָלוֹ
  choice: своей добычи
  rationale: 'Сохраняет индивидуальный притяжательный суффикс: каждый должен отдать серьгу из доставшейся ему добычи.'
- source_word: יִשְׁמְעֵאלִים
  choice: измаильтяне
  rationale: Стандартное русское библейское наименование этнической группы.
theological_decisions:
- issue: Обозначение побеждённых как измаильтян
  choice: сохранено прямое этническое обозначение без поясняющего отождествления
  alternative: пояснить как мадианитян или как более широкое название кочевых народов
  rationale: Текст прямо говорит «измаильтяне»; возможное соотношение этого названия с мадианитянами не следует разрешать внутри перевода.
translation_notes:
  register: Современный литературный русский язык; речь Гедеона звучит естественно и достойно. Конструкция «по серьге» ясно выражает распределительное значение просьбы.
