base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
translation:
  language: ru
  text: 'Затем он пришёл к мужчинам Суккота и сказал: «Вот Зевах и Цалмунна, которыми вы попрекали меня[a], говоря: „Разве Зевах и Цалмунна уже в твоей руке[b], чтобы нам дать хлеб твоим утомлённым людям?“»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поносили меня» либо «издевались надо мной». Еврейский глагол выражает презрительную насмешку и поношение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Разве ладонь Зеваха и Цалмунны теперь в твоей руке?» Это образное выражение означает: «Разве ты уже захватил их?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: жителям Сокхофа
  rationale: Буквально — «мужам Сокхофа»; в данном контексте речь идёт о мужчинах — представителях города. «Жителям Сокхофа» естественно звучит по-русски и не расширяет смысл до всего населения.
- source_word: הִנֵּה
  choice: Вот
  rationale: Передаёт указательное значение частицы, привлекающей внимание к находящимся перед собеседниками пленникам.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Зевах и Салман
  rationale: Имена переданы в традиционной русской библейской форме, соответствующей еврейским личным именам.
- source_word: אֲשֶׁר חֵרַפְתֶּם אוֹתִי
  choice: из-за которых вы насмехались надо мной
  rationale: Глагол חרף выражает презрительную насмешку или поношение; оборот связывает насмешку над Гедеоном с этими царями, не устраняя возможного оттенка упрёка.
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: Разве ... уже в твоей руке
  rationale: Сохранён еврейский образ «в руке», означающий пленение и власть над противниками; עַתָּה в риторическом вопросе передано словом «уже».
- source_word: כִּי נִתֵּן
  choice: чтобы нам давать
  rationale: В контексте כִּי вводит подразумеваемое следствие риторического вопроса и причину отказа помочь.
- source_word: לַאֲנָשֶׁיךָ הַיְּעֵפִים
  choice: твоим изнурённым людям
  rationale: יְעֵפִים обозначает сильную усталость от преследования; «изнурённым» точно и естественно передаёт степень утомления.
- source_word: לָחֶם
  choice: хлеб
  rationale: Сохранено прямое значение слова, хотя в контексте оно может обозначать пищу вообще.
