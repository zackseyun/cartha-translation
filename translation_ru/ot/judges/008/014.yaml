  yaml_path: translation/ot/judges/008/014.yaml
  text: And he captured a young man from the men of Succoth and questioned him[a], and he wrote down for him the officials of Succoth and its elders, seventy-seven men.
translation:
  language: ru
  text: Он схватил одного юношу из жителей Сокхофа и расспросил его. Тот записал для него имена начальников[a] и старейшин Сокхофа — семидесяти семи человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правителей»; еврейское слово может обозначать начальников, вождей, правителей или должностных лиц.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכָּד
  choice: схватил
  rationale: Глагол לכד означает «схватить, захватить». В данном контексте «схватил» естественно передаёт задержание человека, не добавляя деталей о его обстоятельствах.
- source_word: נַעַר
  choice: одного юношу
  rationale: נַעַר может обозначать мальчика, юношу, молодого мужчину или слугу. Здесь речь идёт о жителе города, способном сообщить сведения о его руководителях, поэтому «юношу» сохраняет возрастной оттенок без указания на детство или служебное положение.
- source_word: מֵאַנְשֵׁי סֻכּוֹת
  choice: из жителей Сокхофа
  rationale: Буквально — «из людей/мужей Сокхофа». По-русски «из жителей Сокхофа» естественно выражает принадлежность юноши к населению города.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: расспросил его
  rationale: שׁאל означает спрашивать или разузнавать. «Расспросил» передаёт целенаправленное получение сведений, не внося более жёстких современных ассоциаций слова «допросил».
- source_word: וַיִּכְתֹּב אֵלָיו
  choice: тот записал для него
  rationale: По ближайшему контексту субъектом глагола является схваченный юноша, записавший сведения для Гедеона. Местоимение «тот» делает смену субъекта ясной и естественной по-русски.
- source_word: שָׂרֵי סֻכּוֹת
  choice: начальников Сокхофа
  rationale: שָׂרִים может обозначать правителей, начальников, вождей или должностных лиц. «Начальники» подходит к городскому руководству и не создаёт ложного представления о наследственных князьях.
- source_word: זְקֵנֶיהָ
  choice: старейшин Сокхофа
  rationale: Суффикс женского рода относится к городу Сокхофу. Повтор названия города в русском устраняет неясность местоименной отсылки и передаёт признанную группу городских старейшин.
- source_word: שִׁבְעִים וְשִׁבְעָה אִישׁ
  choice: семидесяти семи человек
  rationale: Числительное прямо означает семьдесят семь. «Человек» отражает явное אִישׁ и естественно согласуется с родительным падежом после пояснительной конструкции.
