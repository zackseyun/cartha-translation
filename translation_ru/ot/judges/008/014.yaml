translation_notes:
  register: Современный литературный русский, повествовательный и сдержанный. Синтаксис слегка разъяснён местоимением «тот», а подразумеваемое содержание записи передано словом «имена», поскольку перечисляются семьдесят семь конкретных руководителей. Маркер сноски поставлен непосредственно после слова, к которому относится лексическая альтернатива.
