base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
translation:
  language: ru
  text: Гедеон сделал из него эфод[a] и поставил его в своём городе, в Офре. Весь Израиль стал там блудодействовать[b] вслед за ним, и он стал западнёй для Гедеона и его дома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфод — предмет, связанный со священническим служением; точная форма и назначение эфода в этом рассказе из текста неясны.
    reason: cultural_note
  - marker: b
    text: Буквально — «блудодействовал вслед за ним»; в еврейском тексте образ сексуальной неверности описывает идолопоклонство Израиля.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵפוֹד
  choice: сделал из него эфод
  rationale: 'Предлог לְ при עשה передаёт результат действия: материал был превращён в эфод. Сам термин сохранён без уточнения формы предмета.'
- source_word: וַיַּצֵּג
  choice: поставил
  rationale: Глагол обозначает установление предмета на определённом месте; «поставил» естественно по-русски и не добавляет идеи декоративной выставки.
- source_word: בְעִירוֹ בְעָפְרָה
  choice: в своём городе, в Офре
  rationale: Передаёт оба обозначения места и сохраняет пояснительное присоединение названия города.
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  choice: стали блудодействовать, следуя за ним
  rationale: Сохранена резкая метафора сексуальной неверности, употреблённая в еврейском тексте для идолопоклонства; местоимение относится к эфоду.
- source_word: שָׁם
  choice: там
  rationale: Наречие сохранено, поскольку подчёркивает, что происходившее было связано с установленным в Офре эфодом.
- source_word: לְמוֹקֵשׁ
  choice: стал западнёй
  rationale: «Западня» сохраняет образ скрытой опасности, ведущей к падению и гибели.
- source_word: וּלְבֵיתוֹ
  choice: для его дома
  rationale: «Дом» сохраняет широту еврейского выражения, которое может охватывать семью, домочадцев и род Гедеона.
theological_decisions:
- issue: Метафора идолопоклонства Израиля
  choice: 'Сохранить выраженный образ блуда: «стал блудодействовать, следуя за ним»'
  alternative: «стал неверен Богу из-за него»
  rationale: זנה прямо использует образ сексуальной неверности для описания культовой измены. Более общее «стал неверен» ослабило бы намеренную резкость текста.
- issue: Точная природа эфода Гедеона
  choice: Оставить термин «эфод» без определения его формы и назначения
  alternative: «жреческое облачение», «идол» или «священное изображение»
  rationale: Текст называет предмет эфодом, но не устанавливает однозначно, был ли он одеждой, изображением либо предметом для получения оракула. Перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с сохранением сильной библейской метафоры. «Блудодействовать» несколько возвышенно, но понятно и точно передаёт культовую неверность; «западня» сохраняет исходный образ. Синтаксис остаётся близким к повествовательной структуре еврейского текста.
