base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
translation:
  language: ru
  text: 'Они ответили: «Непременно дадим[a]». Затем они расстелили одежду[b], и каждый бросил туда по серьге[c] из своей добычи.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально конструкция имеет вид «дать дадим» и служит для усиления: «непременно дадим» или «обязательно дадим».'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может означать одежду вообще, а также верхнее одеяние или плащ; её расстелили, чтобы собирать украшения.
    reason: cultural_note
  - marker: c
    text: Еврейское слово может обозначать серьгу, кольцо или кольцо для носа.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  choice: непременно дадим
  rationale: Сочетание абсолютного инфинитива с личной формой глагола усиливает утверждение. «Непременно дадим» естественно передаёт эмфазу, не добавляя прямо не выраженного значения радости или готовности.
- source_word: הַשִּׂמְלָה
  choice: верхнюю одежду
  rationale: Слово обозначает одежду, нередко верхнее одеяние или плащ. «Верхняя одежда» сохраняет широту значения и понятно описывает предмет, который можно расстелить для сбора колец.
- source_word: וַיִּפְרְשׂוּ
  choice: расстелили
  rationale: Глагол означает «распростереть, разложить». В сочетании с одеждой по-русски естественно «расстелили».
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  choice: бросил туда
  rationale: Сохраняется более сильное значение глагола «бросать», а наречие שָׁמָּה передано буквально как «туда».
- source_word: אִישׁ
  choice: каждый
  rationale: 'Здесь существительное употреблено дистрибутивно: каждый участник совершил названное действие.'
- source_word: נֶזֶם
  choice: серьга
  rationale: Слово может обозначать кольцо для уха или носа; в данном контексте традиционно и наиболее вероятно значение «серьга», однако неоднозначность отмечена в сноске.
- source_word: שְׁלָלוֹ
  choice: из своей добычи
  rationale: Слово обозначает военную добычу; притяжательный суффикс согласован с дистрибутивным «каждый» посредством «своей».
