  text: וְ/לֹ֤א זָֽכְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת יְהוָ֖ה אֱלֹהֵי/הֶ֑ם הַ/מַּצִּ֥יל אוֹתָ֛/ם מִ/יַּ֥ד כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
translation:
  language: ru
  text: И сыны Израиля[a] не помнили Яхве, своего Бога, избавившего их от руки всех их врагов, окружавших их со всех сторон.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: Лексическая альтернатива для בְּנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: וְלֹא
  choice: И ... не
  rationale: Союз продолжает повествование и естественно передаётся русским «и», а отрицание сохраняется при сказуемом.
- source_word: זָכְרוּ
  choice: помнили
  rationale: Глагол означает не только мысленное воспоминание, но и верность, проявляющуюся в поступках; русское «помнили» сохраняет эту смысловую широту.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранён буквальный образ еврейского выражения; более идиоматичный коллективный вариант указан в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֱלֹהֵיהֶם
  choice: своего Бога
  rationale: При Яхве форма обозначает единственного Бога; возвратное местоимение естественно по-русски выражает Его отношение к подлежащему.
- source_word: הַמַּצִּיל
  choice: избавлявшего
  rationale: Причастная форма характеризует Яхве Его спасительным действием и не сводит его к одному строго очерченному моменту.
- source_word: מִיַּד
  choice: от руки
  rationale: Сохранён еврейский образ руки как власти и контроля; он понятен в возвышенном библейском контексте.
- source_word: כָּל אֹיְבֵיהֶם
  choice: всех врагов
  rationale: Передана всеохватность исходного выражения; принадлежность врагов Израилю ясна из местоимения «их» при «избавлявшего» и контекста.
- source_word: מִסָּבִיב
  choice: окружавших их
  rationale: Слово обозначает врагов со всех сторон; причастный оборот передаёт это естественно и без архаичного оборота.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; Господь
  rationale: В тексте стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем и титулом.
- issue: Корпоративное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Основной текст сохраняет грамматически мужской и образный характер еврейского выражения, а идиоматичный вариант приводится в сноске.
- issue: Временной оттенок הַמַּצִּיל
  choice: избавлявшего
  alternative: избавившего; который избавил
  rationale: Еврейское причастие представляет Яхве как Избавителя и допускает характеристику через повторявшееся действие; перевод не ограничивает смысл единственным событием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены личное имя «Яхве» и исходный образ «от руки», при этом синтаксис сделан естественным для современного читателя.
