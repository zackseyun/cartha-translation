lexical_decisions:
- source_word: מִגְדַּל
  choice: башню
  rationale: Существительное обозначает башню, в данном контексте — укреплённое сооружение; прямой русский эквивалент сохраняет образ оригинала.
- source_word: פְּנוּאֵל
  choice: Пенуэла
  rationale: Передача топонима следует масоретской огласовке Пнуэл; в косвенном падеже естественна форма «Пенуэла».
- source_word: נָתָץ
  choice: разрушил
  rationale: Глагол означает снести или разрушить сооружение. «Разрушил» ясно и естественно передаёт результат действия.
- source_word: וַיַּהֲרֹג
  choice: убил
  rationale: Прямое соответствие глаголу הרג без добавления отсутствующего в оригинале образа поражения оружием.
- source_word: אַנְשֵׁי הָעִיר
  choice: мужчин города
  rationale: Буквально «мужей/мужчин города». Мужской референт сохранён и не заменён более широким «жители».
