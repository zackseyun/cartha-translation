base_translation:
  language: en
  yaml_path: translation/ot/judges/008/006.yaml
  text: Then the leaders of Succoth said, “Are the hands of Zebah and Zalmunna already in your hand, that we should give bread to your army?”
translation:
  language: ru
  text: 'Тогда начальники Суккота сказали: «Разве Зевах и Цалмунна уже у тебя в руках, что мы должны давать хлеб твоему войску?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי סֻכּוֹת
  choice: начальники Суккота
  rationale: שָׂרִים обозначает руководителей или должностных лиц города; «начальники» естественно и не сужает значение до старейшин.
- source_word: הֲכַף זֶבַח וְצַלְמֻנָּע
  choice: разве руки Зеваха и Цалмунны
  rationale: Сохранён буквальный и намеренно насмешливый образ «рук» побеждённых врагов как доказательства их захвата; еврейское כַּף стоит в единственном числе собирательно, но по-русски при двух лицах естественно множественное число.
- source_word: עַתָּה
  choice: уже
  rationale: В риторическом вопросе означает, что Зевах и Цалмунна ещё не захвачены; «уже» естественно передаёт временной и скептический оттенок.
- source_word: בְיָדֶךָ
  choice: в твоей руке
  rationale: Сохранена еврейская идиома обладания и власти, а также словесная связь с «руками» Зеваха и Цалмунны.
- source_word: כִּי נִתֵּן
  choice: чтобы нам давать
  rationale: כִּי здесь вводит основание или следствие подразумеваемого требования; русский инфинитив с «чтобы» естественно передаёт смысл риторического отказа.
- source_word: לִצְבָאֲךָ
  choice: твоему войску
  rationale: צָבָא в контексте означает военный отряд Гедеона, а не войско в отвлечённом смысле; «войску» соответствует традиционному и ясному обозначению.
theological_decisions:
- issue: Смысл образа рук пленённых царей
  choice: 'Сохранить буквальный образ: «руки ... в твоей руке»'
  alternative: 'Передать толкованием: «разве Зевах и Цалмунна уже у тебя в плену»'
  rationale: Буквальный образ значим для насмешки начальников Суккота и сохраняет напряжение исходного текста без добавленного толкования.
translation_notes:
  register: Современный литературный русский с достоинством повествовательной прозы. Риторический вопрос и повтор слова «рука» сохранены; речь начальников звучит скептически и вызывающе, но без стилистического огрубления.
