base_translation:
  language: en
  yaml_path: translation/ot/judges/008/009.yaml
  text: He also said to the men of Penuel[a], “When I return in peace[c][b], I will tear down this tower.”
translation:
  language: ru
  text: 'Он также сказал мужчинам из Пенуэла[a]: «Когда я вернусь целым и невредимым[b], я разрушу эту башню[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мужчинам Пенуэла»; вероятно, имеются в виду мужчины, представлявшие город, или его руководители, а не обязательно все жители.'
    reason: cultural_note
  - marker: b
    text: 'Буквально: «в мире»; здесь, вероятно, имеется в виду благополучное и безопасное возвращение.'
    reason: lexical_alternative
  - marker: c
    text: Возможно, речь идёт об оборонительной башне или укреплении внутри Пенуэла.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: также
  rationale: 'Передаёт добавочный смысл: Гедеон обращается теперь и к другой группе после предыдущей речи.'
- source_word: לְאַנְשֵׁי פְנוּאֵל
  choice: жителям Пенуэла
  rationale: Буквально — «мужам Пенуэла», однако в данном гражданском контексте выражение обозначает мужчин-представителей города; естественное русское «жителям» не утверждает, что речь обращена буквально к каждому обитателю.
- source_word: בְּשׁוּבִי
  choice: когда я вернусь
  rationale: Инфинитивная конструкция с предлогом и суффиксом первого лица имеет временное значение; выбран естественный современный русский оборот.
- source_word: בְשָׁלוֹם
  choice: целым и невредимым
  rationale: В контексте возвращения из военного похода שָׁלוֹם указывает на благополучное, безопасное возвращение; выбор естественно выражает этот смысл по-русски, а буквальный образ отмечен в сноске.
- source_word: אֶתֹּץ
  choice: я разрушу
  rationale: Глагол נתץ означает разрушать или сносить сооружение; «разрушу» звучит ясно, сильно и литературно.
- source_word: הַמִּגְדָּל הַזֶּה
  choice: эту башню
  rationale: Сохраняется конкретное основное значение מִגְדָּל; возможная оборонительная функция поясняется в сноске.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; речь ясная и сдержанно торжественная. Синтаксис сохраняет последовательность еврейского повествования, но избегает неестественных кальк. Лексическая неоднозначность בְשָׁלוֹם и возможная функция башни сохранены в примечаниях.
