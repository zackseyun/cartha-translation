  text: וַ/יַּ֣עַל גִּדְע֗וֹן דֶּ֚רֶךְ הַ/שְּׁכוּנֵ֣י בָֽ/אֳהָלִ֔ים מִ/קֶּ֥דֶם לְ/נֹ֖בַח וְ/יָגְבֳּהָ֑ה וַ/יַּךְ֙ אֶת הַֽ/מַּחֲנֶ֔ה וְ/הַֽ/מַּחֲנֶ֖ה הָ֥יָה בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
translation:
  language: ru
  text: Тогда Гедеон поднялся по пути жителей шатров, к востоку от Новаха и Иогбеги, и нанёс удар по стану, когда тот был уверен в своей безопасности[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда стан был в безопасности». Еврейское слово может обозначать состояние безопасности или спокойной уверенности; в данном контексте оно, вероятно, указывает на то, что стан не ожидал нападения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Сохраняет обычное значение עלה и повествовательную сдержанность исходного текста, не добавляя прямо выраженного значения «выступил против».
- source_word: דֶּרֶךְ הַשְּׁכוּנֵי בָאֳהָלִים
  choice: по дороге тех, кто живёт в шатрах
  rationale: Передаёт буквальный образ жителей шатров и не подменяет его более узким толкованием «кочевники».
- source_word: מִקֶּדֶם לְנֹבַח וְיָגְבֳּהָה
  choice: к востоку от Новаха и Иогбеги
  rationale: В географическом контексте מִקֶּדֶם указывает на расположение с восточной стороны относительно названных мест.
- source_word: וַיַּךְ אֶת־הַמַּחֲנֶה
  choice: разгромил стан
  rationale: В данном военном контексте נכה означает нанесение поражения; «разгромил» звучит естественно по-русски и передаёт результат нападения, не прибегая к архаичному «поразил».
- source_word: בֶּטַח
  choice: ничего не опасался
  rationale: Передаёт состояние уверенности и кажущейся безопасности лагеря; контекст подразумевает, что он не ожидал нападения, но не требует уточнять конкретные меры охраны.
