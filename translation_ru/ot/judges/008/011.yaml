  - severity: low
    issue: «Когда тот ничего не опасался» несколько неестественно при олицетворении «стана» и менее прямо выражает семантику בֶּטַח.
    rationale: Слово обозначает безопасность либо уверенность в безопасности. «Был уверен в своей безопасности» передаёт контекстуальный оттенок без утверждения, что стан действительно был защищён.
