base_translation:
  language: en
  yaml_path: translation/ot/judges/008/012.yaml
  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
translation:
  language: ru
  text: Зевах и Цалмунна обратились в бегство, а Гедеон преследовал их, захватил обоих мадиамских царей — Зеваха и Цалмунну — и вверг в панику весь стан.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устрашил весь стан»; возможно также: «обратил весь стан в бегство». Еврейский глагол означает «заставить трепетать», «устрашить» или «ввергнуть в панику»; в военном контексте он может подразумевать расстройство войска.'
    reason: 'Лексическая неоднозначность глагола הֶחֱרִיד: он может обозначать вызванный страх, военную панику или бегство.'
lexical_decisions:
- source_word: וַיָּנוּסוּ
  choice: бежали
  rationale: Форма Qal глагола נוּס означает бегство; краткое «бежали» естественно передаёт стремительность повествования.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Зевах и Цалмунна
  rationale: Личные имена переданы принятой русской библейской транслитерацией.
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  choice: Гедеон погнался за ними
  rationale: Сочетание רדף + אחרי означает преследование. Имя «Гедеон» восстанавливает явно подразумеваемое подлежащее и устраняет неестественную для отдельного русского стиха местоименную неясность.
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: В военном контексте לכד обозначает взятие или пленение противника; «захватил» не уточняет сверх текста дальнейшую судьбу царей.
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  choice: обоих мадиамских царей
  rationale: «Обоих» естественно по-русски передаёт определённую пару, а прилагательное «мадиамских» сохраняет принадлежность царей к Мадиаму.
- source_word: אֶת זֶבַח וְאֶת צַלְמֻנָּע
  choice: Зеваха и Цалмунну
  rationale: Сохранено приложение, прямо называющее двух упомянутых царей.
- source_word: וְכָל הַמַּחֲנֶה
  choice: весь стан
  rationale: מַחֲנֶה в данном военном контексте обозначает лагерь или находящееся в нём войско; «стан» — понятное и достойное повествовательное слово.
- source_word: הֶחֱרִיד
  choice: поверг в смятение
  rationale: Hiphil от חרד выражает причинение трепета, страха или паники. Формулировка передаёт каузативность и допускает военное расстройство, не сводя значение только к разгрому.
