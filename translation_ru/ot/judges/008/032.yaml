  text: וַ/יָּ֛מָת גִּדְע֥וֹן בֶּן יוֹאָ֖שׁ בְּ/שֵׂיבָ֣ה טוֹבָ֑ה וַ/יִּקָּבֵ֗ר בְּ/קֶ֨בֶר֙ יוֹאָ֣שׁ אָבִ֔י/ו בְּ/עָפְרָ֖ה אֲבִ֥י הָֽעֶזְרִֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
translation:
  language: ru
  text: И умер Гедеон, сын Иоаса, в доброй старости и был похоронен в гробнице[a] своего отца Иоаса, в Офре авиезеритян[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в могиле». Еврейское קֶבֶר может означать могилу, гробницу или место погребения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в Офре авиезеритянина», то есть в Офре, принадлежавшей роду Авиезера.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямо и без эвфемизма передаёт обычное значение глагола מות.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: Гедеон, сын Иоаса
  rationale: Использованы традиционные русские формы имён; приложение естественно оформлено запятыми.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: в доброй старости
  rationale: Сохраняет положительную характеристику старости в еврейском тексте, не усиливая её до значения «глубокой» или «преклонной».
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Передаёт пассивное значение нифаля от קבר.
- source_word: בְּקֶבֶר
  choice: в гробнице
  rationale: קֶבֶר допускает значения могилы и гробницы; в контексте семейного места погребения «гробница» звучит естественно, а альтернатива отмечена в сноске.
- source_word: יוֹאָשׁ אָבִיו
  choice: своего отца Иоаса
  rationale: Естественный русский порядок слов ясно показывает, что гробница принадлежала Иоасу, отцу Гедеона.
- source_word: בְּעָפְרָה
  choice: в Офре
  rationale: Традиционная русская передача названия места עָפְרָה.
- source_word: אֲבִי הָעֶזְרִי
  choice: авиезеритян
  rationale: Единственное число в еврейском gentilicum обозначает клановую принадлежность Офры; русское множественное число естественно выражает значение «Офра рода авиезеритян».
