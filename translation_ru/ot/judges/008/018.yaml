  yaml_path: translation/ot/judges/008/018.yaml
  text: Then he said to Zebah and Zalmunna[a], “Where are the men whom you killed at Tabor?” And they said, “As you are, so were they[b]; each one had the appearance of the sons of a king.”
translation:
  language: ru
  text: 'И сказал он Зеваху и Цалмунне: «Где те люди, которых вы убили на Фаворе[a]?» Они ответили: «Как ты, так и они; каждый — видом как сыновья царя[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фавор — гора в Галилее.
    reason: cultural_note
  - marker: b
    text: 'Еврейская фраза кратка: «Как ты, так и они; каждый — видом как сыновья царя». Сравнение может быть передано и более развернуто: «Они были похожи на тебя; каждый выглядел как сын царя».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפֹה הָאֲנָשִׁים
  choice: Где те люди
  rationale: Вопросительное наречие אֵיפֹה обозначает местонахождение, а указательное «те» естественно выделяет известных из контекста погибших.
- source_word: הֲרַגְתֶּם
  choice: вы убили
  rationale: Передаёт основное значение глагола הרג без добавления юридической квалификации «убили намеренно» или «совершили убийство».
- source_word: בְּתָבוֹר
  choice: на Фаворе
  rationale: Название относится к горе Фавор; русский узус допускает краткое «на Фаворе», а пояснение вынесено в сноску.
- source_word: כָּמוֹךָ כְמוֹהֶם
  choice: Они были похожи на тебя
  rationale: Эллиптическая парная конструкция буквально трудна для русского; выбранная формулировка ясно сохраняет сопоставление погибших с Гедеоном.
- source_word: אֶחָד
  choice: каждый
  rationale: Числительное употреблено дистрибутивно применительно ко всем упомянутым мужчинам.
- source_word: כְּתֹאַר בְּנֵי הַמֶּלֶךְ
  choice: выглядел как царский сын
  rationale: תֹאַר указывает на внешний облик или стать; «царский сын» сохраняет образ исходного выражения и не заменяет его толкованием «князь».
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: И сказал он ... Они ответили
  rationale: Первый глагол сохраняет повествовательную связку, а второй естественно передаётся по-русски как ответ на прямой вопрос.
