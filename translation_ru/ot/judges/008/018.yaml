    rationale: Еврейское «как видом сыновья царя» употребляет множественное число. При дистрибутивном «каждый» русский естественно сохраняет это как «каждый — видом как сыновья царя» либо перестраивает «у каждого был вид сына царя». Первый вариант ближе к исходному числу и образу.
  - severity: low
