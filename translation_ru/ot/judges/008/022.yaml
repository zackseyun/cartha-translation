base_translation:
  language: en
  yaml_path: translation/ot/judges/008/022.yaml
  text: Then the men of Israel said to Gideon[a], “Rule over us—you, your son, and your grandson as well—for you have saved us from the hand of Midian.”
translation:
  language: ru
  text: 'Тогда израильтяне сказали Гедеону: «Правь нами — и ты, и твой сын, и твой внук[a], потому что ты спас нас из руки Мадиана».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и ты, и твой сын, и сын твоего сына». Еврейский текст прямо называет последовательные поколения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Тогда ... сказали
  rationale: Форма с последовательным וַ продвигает повествование; «тогда» естественно передаёт переход к следующему событию.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: израильтяне
  rationale: Существительное стоит в единственном числе, но при глаголе во множественном числе имеет собирательное значение. «Израильтяне» ясно и естественно передаёт эту группу, не создавая в современном русском ложного впечатления, будто говорил один человек.
- source_word: מְשָׁל בָּנוּ
  choice: Правь нами
  rationale: Императив выражает просьбу о политическом господстве или управлении. «Правь нами» прямо передаёт смысл, не вводя отсутствующего в еврейском тексте титула царя.
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  choice: и ты, и твой сын, и твой внук
  rationale: Повторение גַּם подчёркивает последовательные поколения и наследственный характер предлагаемой власти. «Внук» естественно передаёт буквальное «сын твоего сына»; точная форма отмечена в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит основание просьбы и в современном русском ясно выражает причинную связь.
- source_word: הוֹשַׁעְתָּנוּ
  choice: ты спас нас
  rationale: Глагол от корня ישׁע обозначает спасение или избавление. «Спас» сохраняет широкую библейскую лексику, оставаясь уместным в военном контексте.
- source_word: מִיַּד מִדְיָן
  choice: из руки Мадиана
  rationale: Сохранён еврейский образ руки как власти или контроля, а «Мадиан» передан как собирательное название народа, как в источнике.
theological_decisions:
- issue: Характер власти, предложенной Гедеону
  choice: 'Просьба передана как предложение наследственной политической власти: «Правь нами — и ты, и твой сын, и твой внук».'
  alternative: Понимать слова лишь как просьбу о ненаследственном руководстве или военном предводительстве.
  rationale: Императив מְשָׁל вместе с прямым перечислением трёх поколений указывает на продолжительную династическую власть. При этом перевод не вводит термин «царь», которого в данном стихе нет.
translation_notes:
  register: Современный литературный русский с умеренно сохранённой библейской образностью. Формулировка «Правь нами» понятна широкому читателю и не подменяет исходное слово монархическим титулом; оборот «из руки Мадиана» сохраняет значимый образ оригинала.
