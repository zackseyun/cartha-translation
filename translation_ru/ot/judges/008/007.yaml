base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
translation:
  language: ru
  text: 'И сказал Гедеон: «Поэтому, когда Яхве отдаст Зеваха и Цалмунну мне в руки, я буду молотить ваши тела колючками пустыни и терновником[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «колючим кустарником»; точный вид растения, названного древнееврейским словом, неизвестен.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: За это
  rationale: Передаёт причинно-следственную связь с отказом жителей Сокхофа в предыдущем стихе и естественно вводит угрозу возмездия.
- source_word: בְּתֵת
  choice: когда ... отдаст
  rationale: Предлог ב с инфинитивом здесь имеет временное значение; конструкция указывает на ожидаемую передачу врагов во власть Гедеона.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: בְּיָדִי
  choice: мне в руки
  rationale: Естественно передаёт древнееврейскую идиому вручения кого-либо во власть победителя, сохраняя образ руки.
- source_word: וְדַשְׁתִּי
  choice: я вымолочу
  rationale: Сохраняет буквальный сельскохозяйственный образ молотьбы и жестокость угрозы.
- source_word: בְּשַׂרְכֶם
  choice: вашу плоть
  rationale: Прямой и выразительный эквивалент, не ослабляющий телесную жестокость угрозы.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: пустынными колючками
  rationale: Передаёт колючие растения, происходящие из пустынной местности, естественной русской формой.
- source_word: הַבַּרְקֳנִים
  choice: терновником
  rationale: Обозначает колючее растение, не пытаясь установить неизвестный точный ботанический вид; неопределённость отмечена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; его транслитерация сохраняет различие между именем и титулом.
- issue: Уверенность Гедеона в победе
  choice: когда Яхве отдаст
  alternative: если Яхве отдаст
  rationale: Временная конструкция представляет победу как ожидаемое событие, не превращая её в явно выраженное условие.
translation_notes:
  register: Современный литературный русский язык с сохранением сурового сельскохозяйственного образа оригинала. Имена переданы в форме «Зевах» и «Салман», близкой к древнееврейскому звучанию. Маркер сноски помещён непосредственно после слова, к которому относится ботаническая неопределённость.
