- source_word: זִקְנֵי הָעִיר
  choice: старейшин города
  rationale: Сохраняет буквальное обозначение старейшин как городских руководителей, не заменяя его более общим словом «начальники».
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: терновник из пустыни
