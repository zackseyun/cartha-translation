- source_word: הַבַּרְקֳנִים
  choice: колючие растения
  rationale: Точный вид растения неясен; обобщённое обозначение сохраняет уверенно устанавливаемый смысл, не создавая ложной ботанической точности.
- source_word: וַיֹּדַע בָּהֶם
  choice: ими проучил
  rationale: Глагол ידע в этой породе обычно связан со значением «дать узнать», однако здесь описывает карательное воздействие терновником. «Проучил» сохраняет связь с обучением и одновременно естественно выражает наказание.
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: мужей Сокхофа
  rationale: Передаёт грамматически мужское множественное число и коллектив взрослых мужчин города; «мужей» соответствует достоинству повествовательного регистра.
theological_decisions:
- issue: Степень жестокости наказания жителей Сокхофа
  choice: ими проучил
  alternative: истерзал ими / наказал ими
  rationale: Еврейское выражение необычно и допускает более сильное понимание, но сам текст прямо не называет конкретный способ причинения вреда. Выбор сохраняет карательный смысл, не устраняя лексическую неоднозначность.
