  rationale: Перевод уточнён ради более точной передачи возвратного значения וַיָּשׁוּבוּ и значения שׂים + לְ, при сохранении сексуальной метафоры זנה и современного литературного, умеренно библейского регистра. Примечание к имени перенесено к имени и сформулировано без потенциально конфессионально окрашенного употребления «Господин» в основном толковании.
