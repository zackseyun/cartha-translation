  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר֙ מֵ֣ת גִּדְע֔וֹן וַ/יָּשׁ֨וּבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּזְנ֖וּ אַחֲרֵ֣י הַ/בְּעָלִ֑ים וַ/יָּשִׂ֧ימוּ לָ/הֶ֛ם בַּ֥עַל בְּרִ֖ית לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
translation:
  language: ru
  text: И когда умер Гедеон, сыны Израиля снова предались блуду, следуя Ваалам, и поставили себе Ваал-Берита[a] богом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Ваал-Берит», вероятно, означает «Ваал завета»; слово «ваал» может означать «владыка, господин».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: И когда
  rationale: Естественно передаёт временной переход в повествовании; более буквальное «И случилось, когда» в современном русском здесь звучало бы тяжеловесно.
- source_word: מֵת גִּדְעוֹן
  choice: умер Гедеон
  rationale: Передаёт завершившееся событие в придаточном времени просто и естественно.
- source_word: וַיָּשׁוּבוּ
  choice: снова стали
  rationale: В сочетании со следующим глаголом передаёт возвращение Израиля к прежнему отступничеству, а не перемещение в пространстве.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет образную и заветную формулу еврейского текста; выражение понятно в современном литературном русском.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: стали блудодействовать вслед за
  rationale: Сохраняет намеренно резкую сексуальную метафору идолопоклонства и направление следования за чужими богами.
- source_word: הַבְּעָלִים
  choice: Ваалами
  rationale: Множественное число указывает на различные местные формы культа Ваала; традиционная русская форма имени — «Ваал».
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: сделали ... своим
  rationale: Естественно выражает принятие и признание божества для себя.
- source_word: בַּעַל בְּרִית
  choice: Ваал-Берита
  rationale: Культовое имя передано транслитерацией, а значение его компонентов вынесено в примечание.
- source_word: לֵאלֹהִים
  choice: богом
  rationale: 'Творительный падеж после «сделали» передаёт значение назначения: они признали Ваал-Берита своим богом.'
theological_decisions:
- issue: Сохранение сексуальной метафоры идолопоклонства
  choice: стали блудодействовать вслед за Ваалами
  alternative: снова стали неверны Богу и последовали за Ваалами
  rationale: Глагол זנה прямо использует образ проституции или блуда для описания неверности завету. Смягчённый вариант сделал бы смысл явным, но устранил бы силу исходной метафоры.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Выбранная формулировка сохраняет корпоративное обозначение народа завета и грамматический образ оригинала, не ограничивая речь только взрослыми мужчинами.
- issue: Статус Ваал-Берита
  choice: сделали Ваал-Берита своим богом
  alternative: поставили себе Ваал-Берита как бога
  rationale: Формулировка передаёт принятие Ваал-Берита в качестве божества, не добавляя предположения о буквальном сооружении идола.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Синтаксис упрощён ради естественности, но формула «сыны Израиля» и резкая метафора «блудодействовать» сохранены как значимые черты оригинала.
