  text: Then Gideon came to the Jordan and crossed over[a], he and the three hundred men who were with him, exhausted yet pursuing.
translation:
  language: ru
  text: Гедеон подошёл к Иордану и переправился через него вместе с тремястами мужчинами, которые были с ним. Они выбились из сил, но продолжали преследование.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «изнемогшие и преследующие»; возможно также: «усталые и продолжавшие погоню» или «усталые, но продолжавшие погоню».'
    reason: Лаконичная еврейская конструкция עֲיֵפִים וְרֹדְפִים соединяет два причастных определения союзом וְ; в контексте он может пониматься как простое «и» либо как уступительное «но всё же».
lexical_decisions:
- source_word: וַיָּבֹא
  choice: подошёл
  rationale: В сочетании с направительным ה в הַיַּרְדֵּנָה глагол בוא обозначает прибытие к Иордану; «подошёл» естественно передаёт движение к реке в русском повествовании.
- source_word: הַיַּרְדֵּנָה
  choice: к Иордану
  rationale: Направительное ה указывает движение к Иордану. Название реки в русском языке не требует добавления слова «река».
- source_word: עֹבֵר הוּא
  choice: и переправился через него
  rationale: Причастие עֹבֵר с местоимением הוּא живо описывает переход самого Гедеона. Местоимение «него» делает смысл естественным по-русски, не добавляя иной детали.
- source_word: וּשְׁלֹשׁ מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ
  choice: вместе с тремястами воинами, бывшими с ним
  rationale: В военном контексте הָאִישׁ указывает на мужчин из отряда; «воинами» яснее и естественнее буквального «мужчинами», а оборот сохраняет указание на сопровождавших Гедеона людей.
- source_word: עֲיֵפִים
  choice: выбились из сил
  rationale: Выражение передаёт сильное физическое изнеможение современным литературным русским языком без предположения, что люди уже падали в обморок.
- source_word: וְרֹדְפִים
  choice: но продолжали преследование
  rationale: 'Противительный союз «но» передаёт контекстуальный уступительный смысл: несмотря на изнеможение, отряд не прекратил погоню. Сама форма וְ допускает и простое соединение, что отмечено в сноске.'
