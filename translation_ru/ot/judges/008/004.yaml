translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Длинная еврейская фраза разделена на два предложения ради ясности; повтор местоимения заменён естественной русской конструкцией. Маркер сноски помещён после относящегося к ней высказывания.
