base_translation:
  language: en
  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
translation:
  language: ru
  text: Вес золотых колец, которые он попросил, составил тысячу семьсот сиклей[a] золота, не считая украшений в виде полумесяца, подвесок, пурпурных одежд, которые носили мадианские цари, и ожерелий на шеях их верблюдов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тысяча семьсот золота»; единица веса «сикль» подразумевается по контексту.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַל
  choice: вес
  rationale: Существительное обозначает измеренный вес, а не просто количество.
- source_word: נִזְמֵי הַזָּהָב
  choice: золотых колец
  rationale: נזם может обозначать кольцо, носимое в ухе или в носу; общее «кольца» не уточняет место ношения сверх еврейского текста.
- source_word: אֲשֶׁר שָׁאָל
  choice: которые он попросил
  rationale: Форма שׁאל отсылает к просьбе Гедеона отдать ему часть добычи; выражение естественно продолжает повествование.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  choice: тысячу семьсот сиклей золота
  rationale: В еврейском буквально сказано «тысяча семьсот золота»; в контексте взвешивания подразумевается единица веса — сикль.
- source_word: לְבַד מִן
  choice: не считая / а также
  rationale: Оба вхождения исключают перечисленные далее предметы из названного веса; по-русски повтор передан естественной связкой при сохранении смысла.
- source_word: הַשַּׂהֲרֹנִים
  choice: украшений в виде полумесяца
  rationale: Термин обозначает украшения характерной серповидной формы; описательный перевод понятен современному читателю.
- source_word: הַנְּטִפוֹת
  choice: подвесок
  rationale: Слово, вероятно, обозначает свисающие украшения; «подвески» сохраняет необходимую широту значения.
- source_word: בִגְדֵי הָאַרְגָּמָן
  choice: пурпурных одежд
  rationale: Речь об одеждах из пурпурной ткани или окрашенных пурпуром, служивших знаком высокого положения.
- source_word: שֶׁעַל מַלְכֵי מִדְיָן
  choice: которые носили мадианские цари
  rationale: Предлог על при одеждах указывает на то, что они были надеты на царях; русский глагол передаёт этот конкретный смысл естественно.
- source_word: הָעֲנָקוֹת
  choice: ожерелий
  rationale: Слово обозначает шейные украшения; ближайший понятный современный эквивалент — «ожерелья».
- source_word: בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: на шеях их верблюдов
  rationale: Перевод прямо сохраняет указанное в еврейском тексте местонахождение украшений.
