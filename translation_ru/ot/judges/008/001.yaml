base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
translation:
  language: ru
  text: 'Тогда ефремляне сказали ему[a]: «Что это ты сделал с нами — не позвал нас, когда пошёл воевать с мадианитянами?» И они ожесточённо спорили с ним.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «муж Ефрема»; это собирательное выражение, обозначающее ефремлян.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  choice: ефремляне
  rationale: Хотя אִישׁ стоит в единственном числе, сочетание имеет собирательное значение, что подтверждается последующими глаголами во множественном числе. «Ефремляне» естественно обозначает представителей колена Ефрема.
- source_word: מָה הַדָּבָר הַזֶּה עָשִׂיתָ לָּנוּ
  choice: Что это ты сделал с нами
  rationale: Передаёт укоризненный риторический вопрос и сохраняет отдельное выражение со значением «что это», не сводя его просто к вопросу «почему».
- source_word: לְבִלְתִּי קְרֹאות לָנוּ
  choice: не позвал нас
  rationale: Естественная русская передача инфинитивной конструкции; глагол «позвал» не усиливает значение до официального призыва или приказа.
- source_word: כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן
  choice: когда пошёл воевать с мадианитянами
  rationale: כִּי в контексте понимается как временно-пояснительное «когда»; «воевать с» естественно передаёт враждебное значение בְּ при נלחם. Название народа передано по-русски во множественном числе.
- source_word: וַיְרִיבוּן אִתּוֹ בְּחָזְקָה
  choice: они яростно спорили с ним
  rationale: ריב обозначает спор или распрю, а בְּחָזְקָה усиливает его, указывая на напор и остроту. «Яростно спорили» звучит естественно и не добавляет физического столкновения.
