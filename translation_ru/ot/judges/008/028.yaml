  text: וַ/יִּכָּנַ֣ע מִדְיָ֗ן לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לֹ֥א יָסְפ֖וּ לָ/שֵׂ֣את רֹאשָׁ֑/ם וַ/תִּשְׁקֹ֥ט הָ/אָ֛רֶץ אַרְבָּעִ֥ים שָׁנָ֖ה בִּ/ימֵ֥י גִדְעֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/028.yaml
  text: So Midian was subdued before the sons of Israel[a], and they did not again lift up their head. And the land had rest forty years in the days of Gideon.
translation:
  language: ru
  text: Так мадианитяне были покорены израильтянами и больше не поднимали головы.[a] И земля пребывала в мире сорок лет во дни Гедеона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «больше не восстанавливали своей силы»; букв.: «больше не поднимали своей головы».'
    reason: Еврейская идиома «поднимать голову» может указывать на восстановление силы, уверенности или способности вновь сопротивляться. Основной текст сохраняет образ, а сноска даёт возможное смысловое пояснение и буквальную альтернативу.
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: был покорён
  rationale: Нифаль глагола כנע передаёт состояние подчинения после военного поражения; пассивная форма сохраняет направленность исходного текста.
- source_word: לִפְנֵי
  choice: перед
  rationale: Сохраняет обычное еврейское выражение подчинения одного народа другому и естественно сочетается с «был покорён».
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально отражает конструкцию оригинала как традиционное национальное обозначение, оставаясь понятным в литературном русском языке.
- source_word: וְלֹא יָסְפוּ
  choice: больше не
  rationale: Сочетание יסף с инфинитивом означает повторение или продолжение действия; здесь речь о том, что мадианитяне уже не восстановили прежнюю силу и смелость.
- source_word: לָשֵׂאת רֹאשָׁם
  choice: не поднимал головы
  rationale: Сохранена конкретная метафора оригинала, выражающая неспособность вновь обрести силу, уверенность или независимость; число согласовано с собирательным названием «Мадиан».
- source_word: וַתִּשְׁקֹט
  choice: покоилась
  rationale: В книге Судей глагол обозначает прекращение войны и период мира; «покоилась» кратко и достойно сохраняет образ исходного текста.
- source_word: הָאָרֶץ
  choice: земля
  rationale: В контексте означает землю Израиля; буквальное «земля» не вносит лишнего уточнения.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Прямое соответствие числовому выражению оригинала.
- source_word: בִּימֵי גִדְעוֹן
  choice: во дни Гедеона
  rationale: Сохраняет стандартную еврейскую временную формулу и не уточняет без необходимости, идёт ли речь строго обо всей продолжительности жизни Гедеона.
theological_decisions:
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне; дети Израиля
  rationale: Выбрана формально близкая передача традиционного национального обозначения без превращения его в современный этноним и без расширения смысла.
- issue: Сохранение идиомы לָשֵׂאת רֹאשָׁם
  choice: не поднимал головы
  alternative: не восстановил силы; больше не осмеливался выступить
  rationale: Основной текст сохраняет метафору и её смысловую ёмкость, а возможные значения поясняются в сноске, чтобы не снимать присущую оригиналу неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Формы «сыны Израиля» и «во дни Гедеона» сохранены как понятные традиционные обороты; синтаксис остаётся ясным. Собирательное название «Мадиан» оформлено в единственном числе.
