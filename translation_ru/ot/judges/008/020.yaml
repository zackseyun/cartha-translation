  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
translation:
  language: ru
  text: 'Тогда он сказал Иеферу, своему первенцу: «Встань, убей их». Но юноша[a] не обнажил своего меча, потому что боялся, ведь он был ещё юношей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мальчик», «отрок». Еврейское слово наар может относиться к человеку от мальчика до молодого мужчины. Здесь выбрано слово «юноша», поскольку у него есть меч и ему велено убить их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда он сказал
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: לְיֶתֶר
  choice: Иеферу
  rationale: Личное имя передано в принятой русской библейской форме.
- source_word: בְּכוֹרוֹ
  choice: своему первенцу
  rationale: בכור обозначает перворождённого сына и сохраняет значение порядка рождения; «первенец» передаёт это точнее, чем «старший сын».
- source_word: קוּם
  choice: Встань
  rationale: Прямое и естественное соответствие повелительной форме קום.
- source_word: הֲרֹג אוֹתָם
  choice: убей их
  rationale: הרג — обычный глагол со значением «убивать»; выбран прямой современный эквивалент без архаизации.
- source_word: וְלֹא שָׁלַף
  choice: Но ... не обнажил
  rationale: «Но» выражает контраст между приказом и отсутствием действия; «обнажил меч» — естественное русское обозначение извлечения меча из ножен.
- source_word: הַנַּעַר
  choice: юноша
  rationale: נער может обозначать мальчика, отрока или молодого мужчину. Наличие собственного меча и поручение совершить казнь указывают здесь на юношу, хотя точный возраст не определён.
- source_word: חַרְבּוֹ
  choice: своего меча
  rationale: Возвратное притяжательное местоимение естественно по-русски указывает, что меч принадлежал действующему лицу.
- source_word: כִּי יָרֵא
  choice: потому что боялся
  rationale: Первое כִּי вводит непосредственную причину того, что юноша не обнажил меч.
- source_word: כִּי עוֹדֶנּוּ נָעַר
  choice: ведь он был ещё юношей
  rationale: Второе כִּי поясняет его страх, עוֹדֶנּוּ выражает продолженность («ещё»), а повтор נער сохранён повтором слова «юноша».
