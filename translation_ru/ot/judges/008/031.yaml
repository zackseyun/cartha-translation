  yaml_path: translation/ot/judges/008/031.yaml
  text: And his concubine who was in Shechem also bore him a son[a], and he named him Abimelek.
translation:
  language: ru
  text: И его наложница, которая была в Сихеме, тоже родила ему сына, и он назвал его Авимелехом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: И его наложница
  rationale: Слово פִּילֶגֶשׁ обозначает наложницу — женщину, состоявшую с мужчиной в признанной, но менее статусной связи, чем жена. «Наложница» прямо и без лишнего толкования передаёт это социальное различие; союз וּ передан как «и».
- source_word: אֲשֶׁר בִּשְׁכֶם
  choice: которая была в Сихеме
  rationale: Относительное придаточное определяет женщину по месту её нахождения. Такой перевод сохраняет нейтральность בִּ и не добавляет прямо не выраженного значения постоянного проживания.
- source_word: יָלְדָה לּוֹ גַם הִיא בֵּן
  choice: тоже родила ему сына
  rationale: Сочетание גַם הִיא указывает, что и эта женщина также родила Гедеону сына. Русский порядок слов естественно передаёт это через «тоже».
- source_word: וַיָּשֶׂם אֶת־שְׁמוֹ
  choice: и он назвал его
  rationale: Буквально «установил/положил его имя» — древнееврейская идиома наречения имени. Русское «назвал его» ясно и естественно передаёт смысл.
- source_word: אֲבִימֶלֶךְ
  choice: Авимелехом
  rationale: Традиционная русская библейская передача имени אֲבִימֶלֶךְ узнаваема и достаточно близко отражает еврейскую форму; творительный падеж обусловлен русской конструкцией «назвал его…».
