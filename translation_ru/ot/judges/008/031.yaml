  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: «его наложница» соответствует וּפִילַגְשׁוֹ; нейтральное «которая была в Сихеме» не добавляет значения постоянного проживания к אֲשֶׁר בִּשְׁכֶם; «тоже родила ему сына» передаёт יָלְדָה לּוֹ גַם הִיא בֵּן; «он назвал его» верно передаёт идиому וַיָּשֶׂם אֶת־שְׁמוֹ. «Авимелехом» является нормативной и узнаваемой русской передачей имени אֲבִימֶלֶךְ в требуемой синтаксической форме.'
