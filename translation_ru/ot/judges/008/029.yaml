  text: Then Jerubbaal son of Joash went and lived in his house[a].
translation:
  language: ru
  text: И пошёл Иероваал, сын Иоаса, и стал жить в своём доме.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поселился в своём доме» или «жил в своём доме». Еврейский глагол может означать «жить, обитать» или «поселиться»; буквальное значение «сидеть» здесь не является основным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: В последовательном повествовании глагол הלך естественно передаётся как «пошёл»; вариант «вернулся» добавил бы не выраженное самим глаголом направление.
- source_word: יְרֻבַּעַל
  choice: Иероваал
  rationale: Сохранено имя, употреблённое непосредственно в еврейском тексте, без замены на более известное имя Гедеон.
- source_word: בֶּן יוֹאָשׁ
  choice: сын Иоаса
  rationale: Прямая и естественная передача стандартной конструкции родства.
- source_word: וַיֵּשֶׁב
  choice: поселился
  rationale: В сочетании с «в своём доме» глагол ישב обозначает пребывание или проживание, а не просто физическое сидение. «Поселился» естественно передаёт переход к мирной домашней жизни в данном повествовательном контексте.
- source_word: בְּבֵיתוֹ
  choice: в своём доме
  rationale: Предлог בְּ и существительное «дом» с суффиксом третьего лица буквально означают «в его доме»; русское возвратное притяжательное местоимение «своём» ясно соотносит дом с подлежащим.
- source_word: וַ...וַ
  choice: И пошёл ... и поселился
  rationale: Повторяющийся повествовательный союз сохранён, чтобы передать последовательность двух действий и ритм еврейского рассказа.
