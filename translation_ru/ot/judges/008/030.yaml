  text: Gideon had seventy sons[a], his own offspring, because he had many wives.
translation:
  language: ru
  text: У Гедеона было семьдесят сыновей[a], происходивших от него, потому что у него было много жён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вышедших из его чресл» — древнееврейская идиома, обозначающая его биологических потомков.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגִדְעוֹן הָיוּ
  choice: У Гедеона было
  rationale: 'Конструкция היה с ל выражает обладание; по-русски естественно: «у Гедеона было». Союз ו передаёт связь с контекстом и не требует отдельного слова в этом стихе.'
- source_word: שִׁבְעִים בָּנִים
  choice: семьдесят сыновей
  rationale: בנים здесь обозначает именно сыновей, а не детей вообще.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: его кровных потомков
  rationale: Буквально это идиома «вышедшие из его бедра/чресл», обозначающая непосредственное биологическое происхождение. «Кровные потомки» ясно и естественно передаёт её смысл, а буквальный образ сохранён в сноске.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину многочисленности сыновей.
- source_word: נָשִׁים רַבּוֹת הָיוּ לוֹ
  choice: у него было много жён
  rationale: В данном семейном контексте נָשִׁים означает жён; היה с ל вновь выражает обладание.
theological_decisions:
- issue: Описание многожёнства Гедеона
  choice: 'Передать нейтрально: «у него было много жён».'
  alternative: Перевести расплывчато как «много женщин» либо добавить нравственную оценку.
  rationale: Стих сообщает о семейном положении Гедеона, не выражая здесь ни одобрения, ни осуждения; перевод не должен ни скрывать брачный смысл, ни добавлять отсутствующую в тексте оценку.
translation_notes:
  register: Современный литературный русский язык; формулировка ясная и достойная. Тире помогает естественно присоединить пояснение к слову «сыновей». Термин «кровные потомки» передаёт биологический смысл исходной идиомы без архаичного образа в основном тексте.
