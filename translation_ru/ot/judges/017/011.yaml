  yaml_path: translation/ot/judges/017/011.yaml
  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
translation:
  language: ru
  text: И левит согласился[a] остаться жить у этого человека, и юноша стал для него как один из его сыновей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изъявил готовность».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «юноша стал ему как один из его сыновей»; это указывает на его положение как члена дома Михи, но не обязательно на усыновление.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: согласился
  rationale: Глагол יאל в породе хифиль выражает готовность или согласие. «Согласился» естественно передаёт принятие левитом предложения Михи, сохраняя возможный оттенок добровольности в сноске.
- source_word: הַלֵּוִי
  choice: левит
  rationale: Определённая форма указывает на уже упомянутого левита; в русском контексте определённость передаётся без артикля.
- source_word: לָשֶׁבֶת אֶת הָאִישׁ
  choice: остаться жить у этого человека
  rationale: ישׁב может означать «сидеть», «жить», «оставаться». Здесь речь идёт о проживании в доме Михи, поэтому сочетание «остаться жить» передаёт и решение остаться, и длительное проживание; אֶת при ישׁב выражает совместность или близость, естественно переданную русским «у».
- source_word: הַנַּעַר
  choice: юноша
  rationale: נַעַר обозначает юношу, молодого мужчину или слугу. Левит действует самостоятельно, поэтому «юноша» точнее нейтрального для данного контекста, чем «мальчик».
- source_word: וַיְהִי ... כְּאַחַד מִבָּנָיו
  choice: стал для него как один из его сыновей
  rationale: היה здесь обозначает возникшее положение, поэтому выбрано «стал». Сравнительная частица כ сохранена словом «как», а дательный לֹו естественно передан сочетанием «для него».
theological_decisions:
- issue: Характер отношений Михи с левитом
  choice: 'Сохранено сравнение: «как один из его сыновей»'
  alternative: «стал ему сыном» или «Миха принял его как сына»
  rationale: Еврейский текст описывает подобное сыновнему положение, но не утверждает формального усыновления и прямо не формулирует действие Михи; перевод не должен устранять эту смысловую сдержанность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Начальное «И» сохраняет повествовательную связь וַ־. Формулировка «остаться жить» яснее в данном контексте, чем архаичное «обитать»; сравнительная конструкция намеренно сохранена без догматического уточнения.
