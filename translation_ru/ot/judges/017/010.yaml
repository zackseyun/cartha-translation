base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
translation:
  language: ru
  text: 'Миха сказал ему: «Останься у меня и будь мне отцом и священником. Я буду давать тебе по десять серебряных монет в год[a], комплект одежды[b] и всё необходимое для жизни». И левит пошёл[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «десять серебра»; единица не указана. Часто переводят: «десять сиклей серебра».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «плату на одежду»; значение выражения не вполне однозначно.'
    reason: lexical_alternative
  - marker: c
    text: 'Или по смыслу контекста: «вошёл». В еврейском тексте употреблён обычный глагол «пошёл».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  choice: Останься у меня
  rationale: Императив ישב здесь приглашает левита поселиться у Михи. «Останься у меня» естественно по-русски передаёт как пребывание, так и проживание при нём.
- source_word: לְאָב וּלְכֹהֵן
  choice: отцом и священником
  rationale: Сохранена явная семейная метафора «отец» и прямое значение «священник»; речь не о буквальном отцовстве, а о почётной и авторитетной роли.
- source_word: עֲשֶׂרֶת כֶּסֶף
  choice: десять серебряников
  rationale: В еврейском тексте названы число и серебро, но не указана единица. «Серебряники» даёт понятное обозначение отдельных платёжных единиц, а примечание сохраняет неопределённость оригинала.
- source_word: לַיָּמִים
  choice: в год
  rationale: Идиоматическое выражение обозначает ежегодный срок или годовую плату.
- source_word: וְעֵרֶךְ בְּגָדִים
  choice: комплект одежды
  rationale: Фраза обозначает предусмотренное количество или обеспечение одеждой; конкретная формулировка остаётся не вполне однозначной, поэтому приведена альтернатива в примечании.
- source_word: וּמִחְיָתֶךָ
  choice: и всё необходимое для жизни
  rationale: מִחְיָה охватывает содержание и средства к существованию; перевод не сужает значение только до пищи.
- source_word: וַיֵּלֶךְ הַלֵּוִי
  choice: И левит пошёл
  rationale: Сохранено обычное значение глагола הלך без добавления отсутствующего в тексте дополнения; возможный контекстуальный смысл пояснён в примечании.
theological_decisions:
- issue: Почётное наименование «отец» в контексте неправомерного святилища
  choice: Сохранить буквальное «отцом»
  alternative: наставником; духовным отцом
  rationale: Еврейский текст прямо использует семейную метафору. Её сохранение передаёт социально-религиозную роль, не оправдывая происходящее и не привнося более позднюю церковную терминологию.
- issue: Неуказанная единица серебра
  choice: Не добавлять в основной текст «сиклей»
  alternative: десять сиклей серебра
  rationale: Единица измерения в еврейском тексте отсутствует; традиционное уточнение «сиклей» было бы интерпретацией.
- issue: Направление последнего действия левита
  choice: 'Перевести буквально: «пошёл»'
  alternative: вошёл; пошёл с ним; поселился у него
  rationale: Сам глагол означает «пошёл», а направление или результат явно не названы. Ближайший контекст допускает, что левит вошёл в дом Михи или принял предложение, но основной текст не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Сохранены достоинство речи, метафора «отец» и неоднозначности, касающиеся серебра, одежды и последнего глагола.
