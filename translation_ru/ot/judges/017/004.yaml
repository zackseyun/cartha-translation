base_translation:
  language: en
  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
translation:
  language: ru
  text: Он возвратил серебро своей матери. Его мать взяла двести серебра[a] и отдала его мастеру по серебру. Тот сделал из него резное изваяние и литое изваяние[b], и оно было в доме Михи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «двести серебра»; единица веса в этом стихе не названа, хотя по контексту обычно подразумеваются сикли.'
    reason: lexical_alternative
  - marker: b
    text: 'Также можно перевести: «резной образ и литой образ».'
    reason: lexical_alternative
  - marker: c
    text: После слов «резное изваяние и литое изваяние» в еврейском тексте употреблён глагол единственного числа — «и оно было»; возможно, изделие или их совокупность представлены как одно целое.
    reason: source_syntax
lexical_decisions:
- source_word: וַיָּשֶׁב אֶת־הַכֶּסֶף
  choice: возвратил серебро
  rationale: Глагол שוב в каузативной повествовательной форме означает возвращение серебра прежней владелице; «возвратил» естественно передаёт смысл возмещения. כֶּסֶף здесь обозначает именно серебро, которое затем отдаётся мастеру для изготовления изображений.
- source_word: מָאתַיִם כֶּסֶף
  choice: двести сиклей серебра
  rationale: В еврейском тексте названы число и серебро, но единица меры в этом стихе не указана. По контексту подразумеваются сикли; эта понятная русская формулировка сопровождается примечанием, сохраняющим точность исходной формы.
- source_word: לַצּוֹרֵף
  choice: серебряных дел мастеру
  rationale: צֹרֵף может означать плавильщика, ювелира или мастера по металлу. Поскольку материалом служит серебро и мастер изготавливает из него изображения, выбран естественный и конкретный русский эквивалент.
- source_word: וַיַּעֲשֵׂהוּ
  choice: тот сделал из этого
  rationale: Мужской род глагола указывает на мастера как наиболее естественного субъекта. Местоименное дополнение относится к переданному серебру; «из этого» ясно выражает преобразование материала, не меняя смысла.
- source_word: פֶּסֶל
  choice: резное изваяние
  rationale: Слово обозначает изготовленное, обычно высеченное или вырезанное культовое изображение. «Изваяние» сохраняет предметное значение без добавления оценочного слова «идол».
- source_word: וּמַסֵּכָה
  choice: и литое изваяние
  rationale: מַסֵּכָה обозначает металлическое изображение, изготовленное литьём. «Литое изваяние» точно и понятно в современном русском языке.
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  choice: и оно находилось в доме Михи
  rationale: Сказуемое в еврейском тексте стоит в единственном числе, хотя перед ним названы резное и литое изваяния. Единственное число сохранено, а его синтаксическая особенность пояснена в примечании. Имя передано в принятой для данного персонажа форме «Миха».
theological_decisions:
- issue: Следует ли передавать פֶּסֶל וּמַסֵּכָה явно осуждающим словом «идол»
  choice: резное изваяние и литое изваяние
  alternative: идол и литой идол
  rationale: В более широком контексте предметы имеют несомненное культовое и предосудительное назначение, однако сами слова прежде всего называют виды изготовленных изображений. Нейтрально-предметный перевод не скрывает контекста и не усиливает оценку данного стиха.
- issue: Один предмет или два обозначены сочетанием פֶּסֶל וּמַסֵּכָה
  choice: сохранены два существительных при последующем местоимении единственного числа
  alternative: резное литое изваяние как один предмет
  rationale: Два существительных грамматически допускают понимание двух изображений, тогда как единственное число последующего глагола может представлять изделие или совокупность как одно целое. Перевод сохраняет эту напряжённость и не решает неоднозначность за читателя.
translation_notes:
  register: Современный литературный русский с ясным повествовательным синтаксисом и умеренно возвышенной библейской лексикой. Повтор слова «мать» сохранён вслед за еврейским текстом; ремесленное обозначение передано без архаизма. Необычное единственное число в конце сохранено ради подлинной неоднозначности источника.
