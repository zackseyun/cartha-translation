base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: The man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
translation:
  language: ru
  text: У Михи было святилище[a]. Он сделал эфод и домашних идолов, а одного из своих сыновей посвятил[b] в священники, и тот стал его священником.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дом Бога»; возможно также: «дом богов». Здесь имеется в виду частное святилище.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «наполнил руку» — древнееврейское выражение, означающее посвящение или введение в священническое служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  choice: святилище
  rationale: Буквально сочетание может быть понято как «дом Бога» или «дом богов», но в данном контексте обозначает частное культовое место Михи. «Святилище» естественно передаёт функцию, не представляя этот культ законным; буквальная неоднозначность сохранена в сноске.
- source_word: אֵפוֹד
  choice: эфод
  rationale: Специальный древний культовый термин, не имеющий точного русского соответствия; транслитерация избегает излишне узкого толкования природы предмета.
- source_word: תְרָפִים
  choice: домашние идолы
  rationale: Передаёт домашние культовые изображения понятным современным языком и соответствует явно нерегулярному культовому контексту.
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: посвятил в священники
  rationale: Еврейская идиома буквально означает «наполнил руку» и обозначает введение или посвящение в священническое служение. Русская формулировка естественно выражает смысл; буквальный образ отмечен в сноске.
- source_word: אַחַד מִבָּנָיו
  choice: одного из своих сыновей
  rationale: Прямо передаёт партитивную конструкцию и сохраняет мужское обозначение потомков.
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: и тот стал его священником
  rationale: «Стал» сохраняет результативный смысл וַיְהִי, а «тот» ясно указывает на посвящённого сына и устраняет неясность русского местоимения.
- source_word: וְהָאִישׁ מִיכָה
  choice: У Михи
  rationale: Именная конструкция с последующим לו естественно передаётся по-русски конструкцией принадлежности. Слово «человек» здесь служит тематическому оформлению и не требует буквального воспроизведения.
theological_decisions:
- issue: Может ли בֵּית אֱלֹהִים создавать впечатление законного поклонения истинному Богу
  choice: святилище
  alternative: дом Бога / дом богов
  rationale: Контекст — эфод, терафимы и самовольное назначение сына священником — указывает на частный и нерегулярный культ. Нейтрально-функциональное «святилище» не объявляет его законным и не решает без необходимости грамматико-смысловую неоднозначность אֱלֹהִים; варианты даны в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Короткие предложения облегчают чтение; специальные культовые термины сохраняются там, где точной общеупотребительной замены нет.
