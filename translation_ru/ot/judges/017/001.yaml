lexical_decisions:
- source_word: וַיְהִי
  choice: Был
  rationale: Форма вводит новый эпизод повествования. «Был» естественно передаёт это начало без добавления явного временного наречия или избыточного союза.
- source_word: אִישׁ
  choice: человек
  rationale: В данном контексте существительное прямо обозначает мужчину; русское «человек» естественно в повествовательной формуле и не добавляет отсутствующей в оригинале определённости.
- source_word: מֵהַר אֶפְרָיִם
  choice: из горной области Ефрема
  rationale: הַר в этом географическом сочетании обозначает нагорную, холмистую область, связанную с Ефремом, а не отдельную гору.
- source_word: וּשְׁמוֹ
  choice: и звали его
  rationale: Сохраняется сочинительная связь еврейского текста, но используется естественная современная русская формула называния человека.
- source_word: מִיכָיְהוּ
  choice: Михайху
  rationale: Транслитерация передаёт именно засвидетельствованную здесь еврейскую форму имени, не заменяя её традиционной сокращённой формой «Миха».
