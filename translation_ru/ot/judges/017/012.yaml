  yaml_path: translation/ot/judges/017/012.yaml
  text: So Micah ordained the Levite[a], and the young man became his priest and was in Micah’s house.
translation:
  language: ru
  text: И Михай ввёл левита в священническое служение[a], и этот юноша стал его священником и находился в доме Михая.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «наполнил руку левита» — еврейская идиома, означающая поставление на священническое служение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: посвятил
  rationale: Еврейская идиома буквально означает «наполнил руку» и в контексте священнического служения обозначает введение в должность, посвящение. «Посвятил» естественно передаёт функцию идиомы, а буквальная форма сохранена в сноске.
- source_word: הַלֵּוִי
  choice: левита
  rationale: Слово обозначает принадлежность молодого человека к левитам; обычное и ясное русское соответствие — «левит».
- source_word: הַנַּעַר
  choice: этот молодой человек
  rationale: נַעַר допускает значения от юноши до молодого мужчины или слуги. Здесь самостоятельная культовая роль делает выражение «молодой человек» наиболее уместным; указательное «этот» естественно связывает его с уже названным левитом.
- source_word: לְכֹהֵן
  choice: священником
  rationale: Предлог לְ обозначает роль или назначение; в сочетании с וַיְהִי לוֹ конструкция естественно передаётся как «стал его священником».
- source_word: וַיְהִי לוֹ
  choice: стал ... его
  rationale: Конструкция указывает на переход к исполнению роли для Михая; «стал его» сохраняет это значение без дополнительных толкований.
- source_word: בְּבֵית מִיכָה
  choice: жил в доме Михая
  rationale: 'Буквально: «был в доме Михая». В повествовательном русском «жил в доме» естественно выражает пребывание при доме, не превращая фразу в указание на более широкое домашнее хозяйство.'
theological_decisions:
- issue: Передача частного поставления левита без намёка на законность или Божье одобрение
  choice: посвятил левита
  alternative: рукоположил левита; наполнил руку левита
  rationale: Текст сообщает о введении левита в священническое служение самим Михаем, но не утверждает законности этого действия. «Посвятил» обозначает действие, не добавляя оценки; буквальная идиома приведена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Имя передано как «Миха́й» для различения форм; синтаксис сохраняет последовательность еврейского повествования, но избегает неясного буквального воспроизведения идиомы.
