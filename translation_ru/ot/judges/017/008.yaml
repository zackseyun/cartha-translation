  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис немного перестроен ради ясности: оборот о продолжении пути вынесен перед глаголом прибытия, а значение предельной точки עַד передано глаголом «дошёл».'
