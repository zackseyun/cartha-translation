  text: וַ/יֵּ֨לֶךְ הָ/אִ֜ישׁ מֵ/הָ/עִ֗יר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה לָ/ג֖וּר בַּ/אֲשֶׁ֣ר יִמְצָ֑א וַ/יָּבֹ֧א הַר אֶפְרַ֛יִם עַד בֵּ֥ית מִיכָ֖ה לַ/עֲשׂ֥וֹת דַּרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
translation:
  language: ru
  text: И тот человек ушёл из города, из Вифлеема Иудейского, чтобы поселиться там, где найдёт себе место. Продолжая свой путь[a], он пришёл в нагорье Ефремово и дошёл до дома Михи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы продолжить свой путь»; возможно также: «идя своей дорогой». Буквально: «делать свой путь».'
    reason: Еврейский инфинитивный оборот לַעֲשׂוֹת דַּרְכּוֹ допускает целевое или сопутствующее понимание и представляет собой идиому движения.
lexical_decisions:
- source_word: וַיֵּלֶךְ הָאִישׁ
  choice: тот человек ушёл
  rationale: Простая повествовательная форма глагола הלך передаёт начало движения; указательное «тот» естественно связывает определённое הָאִישׁ с человеком, названным в предыдущем стихе.
- source_word: מֵהָעִיר מִבֵּית לֶחֶם יְהוּדָה
  choice: из города, из Вифлеема Иудейского
  rationale: עִיר может означать город или поселение; «город» ближе к обычному лексическому соответствию. Повтор предлога сохраняет пояснительную структуру еврейского текста, а «Вифлеем Иудейский» — традиционное и ясное русское географическое обозначение.
- source_word: לָגוּר
  choice: чтобы поселиться
  rationale: גור обозначает проживание, нередко временное или в положении пришельца. В данном контексте естественное русское «поселиться» передаёт поиск нового места жительства, не утверждая его постоянства.
- source_word: בַּאֲשֶׁר יִמְצָא
  choice: там, где найдёт себе место
  rationale: Объект глагола «найдёт» подразумевается; добавление «место» делает идиому понятной по-русски, а «себе» естественно выражает личную цель поиска.
- source_word: הַר אֶפְרַיִם
  choice: нагорье Ефремово
  rationale: Сочетание обозначает гористую область Ефрема, а не отдельную гору. «Нагорье Ефремово» сохраняет географический смысл и библейское достоинство регистра.
- source_word: עַד בֵּית מִיכָה
  choice: дошёл до дома Михи
  rationale: עַד указывает на достигнутый предел пути; глагол «дошёл» естественно передаёт это значение в русском повествовании.
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  choice: продолжая свой путь
  rationale: Буквально «делать свой путь» — идиома движения по маршруту. Деепричастный оборот даёт естественное чтение по-русски; возможное целевое понимание инфинитива отмечено в сноске.
