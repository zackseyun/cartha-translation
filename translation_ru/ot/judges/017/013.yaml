  yaml_path: translation/ot/judges/017/013.yaml
  text: Then Micah said[a], “Now I know that Yahweh will do good to me, because I have a Levite as priest.”
translation:
  language: ru
  text: 'Тогда Миха сказал: «Теперь я знаю, что Яхве будет благосклонен ко мне, потому что у меня есть левит, который служит мне священником».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Вайиктоль продвигает повествование; «тогда» естественно передаёт последовательность событий.
- source_word: מִיכָה
  choice: Миха
  rationale: Традиционная русская библейская форма личного имени.
- source_word: עַתָּה יָדַעְתִּי
  choice: Теперь я знаю
  rationale: Перфект выражает достигнутое понимание и возникшее вследствие этого нынешнее состояние уверенности.
- source_word: יֵיטִיב ... לִי
  choice: будет благ ко мне
  rationale: Хифиль глагола יטב означает благотворное, доброе отношение или действие; формулировка сохраняет широту смысла и не сужает его до материального преуспевания.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменено титулом.
- source_word: כִּי ... כִּי
  choice: что ... потому что
  rationale: Первое כִּי вводит содержание знания, второе — основание уверенности Михи.
- source_word: הָיָה לִי
  choice: стал моим
  rationale: Буквально «стал/был у меня»; в данном контексте обозначает установленное отношение служения левита к Михе.
- source_word: הַלֵּוִי
  choice: этот левит
  rationale: Определённый артикль указывает на уже введённого в повествование конкретного левита; русское «этот» естественно передаёт анафорическую определённость.
- source_word: לְכֹהֵן
  choice: священником
  rationale: Предлог לְ обозначает роль или назначение; творительный падеж после «стал» естественно выражает эту функцию по-русски.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Характер уверенности Михи
  choice: Слова Михи переданы без авторского подтверждения правильности его вывода
  alternative: Сформулировать так, будто Бог действительно обещал ему благополучие
  rationale: Стих сообщает субъективное заключение Михи на фоне его неправомерного домашнего культа; перевод не должен ни одобрять его богословие, ни добавлять явное осуждение, которого в самой реплике нет.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Фраза краткая и естественная; определённость הַלֵּוִי передана словом «этот», поскольку речь идёт о конкретном левите, уже известном из контекста.
