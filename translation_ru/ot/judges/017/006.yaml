  text: В те дни не было царя в Израиле; каждый делал то, что считал правильным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: В те дни
  rationale: Естественная для русского повествования временная формула, сохраняющая ретроспективное обрамление древнееврейского текста.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: не было царя в Израиле
  rationale: Прямо передаёт конструкцию отсутствия с אֵין, не добавляя оценки монархии.
- source_word: אִישׁ
  choice: каждый
  rationale: 'В данном контексте существительное мужского рода в единственном числе имеет распределительно-обобщающий смысл: каждый отдельный человек.'
- source_word: הַיָּשָׁר
  choice: то, что было правильным
  rationale: Передаёт оценочное значение יָשָׁר — «правильный, прямой, справедливый» — без усиления или уточнения авторской оценки.
- source_word: בְּעֵינָיו
  choice: в его собственных глазах
  rationale: Сохраняет древнееврейский образ субъективной оценки; слово «собственных» естественно подчёркивает личный критерий.
- source_word: יַעֲשֶׂה
  choice: делал
  rationale: Имперфект в повествовательном резюме обозначает обычное, повторявшееся в прошлом действие; русское несовершенное прошедшее передаёт это значение.
theological_decisions:
- issue: Оценка состояния Израиля и связь отсутствия царя с общественным и религиозным беспорядком
  choice: Сохранено прямое соположение отсутствия царя и поведения по собственному разумению, с подразумеваемой отрицательной оценкой последнего.
  alternative: Истолковать стих либо как нейтральную историческую справку, либо как прямое утверждение, что монархия сама по себе является необходимым решением.
  rationale: Рефрен книги Судей несёт литературно-оценочную нагрузку, однако сам стих не формулирует всеобщего богословского тезиса о превосходстве монархии. Перевод сохраняет эту напряжённость без поясняющих добавлений.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской образностью. Оборот «в его собственных глазах» намеренно сохраняет выразительную древнееврейскую идиому, оставаясь понятным современному читателю.
