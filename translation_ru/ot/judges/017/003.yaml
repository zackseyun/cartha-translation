base_translation:
  language: en
  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
translation:
  language: ru
  text: 'И он возвратил своей матери тысячу сто серебряников. Мать сказала: «Я торжественно посвятила это серебро Яхве из собственных средств[a] для моего сына, чтобы сделать резное изваяние и литое изваяние[b]. Теперь я возвращаю его тебе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из моей руки»; оборот указывает, что серебро выделяется самой матерью, из находящихся в её распоряжении средств.'
    reason: культурная и идиоматическая особенность
  - marker: b
    text: Еврейское выражение может обозначать два предмета либо связанные между собой части или характеристики культового изображения.
    reason: лексическая и синтаксическая неоднозначность
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: возвратил
  rationale: Порода hифиль глагола שוב выражает возвращение чего-либо владельцу; «возвратил» естественно передаёт смысл возмещения.
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: тысячу сто серебряников
  rationale: Единица веса или денежного счёта в стихе прямо не названа. «Серебряники» понятно обозначает отдельные единицы серебра и не добавляет слово «сиклей».
- source_word: הַקְדֵּשׁ הִקְדַּשְׁתִּי
  choice: я торжественно посвятила
  rationale: Сочетание абсолютного инфинитива с личной формой того же глагола усиливает утверждение; «торжественно» передаёт эмфазу и культовый характер посвящения.
- source_word: לַיהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога, а не заменяет его титулом.
- source_word: מִיָּדִי
  choice: из своего имущества
  rationale: Буквально «из моей руки»; в контексте оборот указывает, что серебро принадлежало матери и выделялось ею самой. Русская формулировка сохраняет смысл источника без неестественной кальки.
- source_word: לִבְנִי
  choice: для моего сына
  rationale: Предлог ל обозначает предполагаемого получателя или того, в чьих интересах совершается действие.
- source_word: פֶּסֶל וּמַסֵּכָה
  choice: резное изваяние и литое изваяние
  rationale: Сохраняются два отдельных термина и различие способов изготовления; нейтральное «изваяние» не снимает напряжения между посвящением Яхве и созданием культовых образов.
- source_word: אֲשִׁיבֶנּוּ לָךְ
  choice: теперь я возвращаю его тебе
  rationale: Форма допускает настоящее или ближайшее будущее; настоящее непосредственно передаёт заявленное матерью действие.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие.
- issue: Посвящение серебра Яхве ради изготовления изображений
  choice: сохранено без поясняющего смягчения
  alternative: истолковать речь как осуждение идолопоклонства или заменить культовые термины
  rationale: Еврейский текст прямо соединяет торжественное посвящение Яхве с изготовлением резного и литого изваяний. Перевод сохраняет это богословское напряжение, не разрешая его за автора.
- issue: Соотношение двух изображений
  choice: 'два грамматически соединённых наименования: «резное изваяние и литое изваяние»'
  alternative: одно изображение, описанное двумя терминами
  rationale: Союз допускает понимание как двух предметов, так и двух характеристик связанного культового объекта; буквальное соединение терминов сохраняет неоднозначность.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис речи матери сохранён напряжённым, но прояснён тире; намеренно не устранена сюжетная странность: сын возвращает серебро матери, после чего она говорит, что возвращает его сыну.'
