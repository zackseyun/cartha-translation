base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: There was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
translation:
  language: ru
  text: Был один юноша из Вифлеема Иудейского, из рода Иуды[a]. Он был левитом и жил там как пришелец[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из семейства Иуды». Еврейское слово может обозначать семью, род или более широкую родственную группу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «временно проживал там», «жил там как чужеземец». Еврейский глагол может обозначать проживание в качестве пришельца или временного жителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Был один
  rationale: Форма вводит нового участника повествования. Русское «Был один» естественно выполняет эту функцию без добавления отсутствующего в еврейском тексте явного временного наречия.
- source_word: נַעַר
  choice: юноша
  rationale: В данном контексте слово обозначает молодого мужчину, а не слугу; «юноша» — ясное и литературное соответствие.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: из Вифлеема Иудейского
  rationale: Определение «Иудейский» отличает этот Вифлеем от одноимённых мест и естественно передаёт географическое уточнение.
- source_word: מִמִּשְׁפַּחַת יְהוּדָה
  choice: из рода Иуды
  rationale: מִשְׁפָּחָה обозначает родовую или семейную группу. «Род» звучит естественнее современного заимствования «клан» и сохраняет возможный генеалогический смысл.
- source_word: לֵוִי
  choice: левитом
  rationale: Слово прямо определяет молодого человека как левита; краткий традиционный термин точен и понятен.
- source_word: גָר שָׁם
  choice: жил там как пришелец
  rationale: Глагол גור обозначает проживание не на своей земле, часто в положении пришельца. Выражение сохраняет этот оттенок, не сводя его только к кратковременному пребыванию.
theological_decisions:
- issue: Кажущееся противоречие между принадлежностью к роду Иуды и статусом левита
  choice: Оба утверждения сохранены рядом без согласующего пояснения.
  alternative: Истолковать связь с Иудой только географически или социально и отразить это в основном тексте.
  rationale: Еврейский текст непосредственно называет юношу и происходящим «из рода Иуды», и левитом. Перевод сохраняет эту напряжённость и не навязывает гармонизирующего толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. «Пришелец» сохранён как точный и понятный контекстуальный термин; синтаксис разделён на два предложения для естественного русского повествования.
