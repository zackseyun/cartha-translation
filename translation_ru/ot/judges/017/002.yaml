base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
translation:
  language: ru
  text: 'Он сказал матери: «Тысяча сто единиц серебра, которые у тебя взяли и из-за которых ты произнесла проклятие[a], о которых ты говорила при мне, — вот, серебро у меня: я сам его взял». Мать сказала: «Да благословит Яхве моего сына!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «произнесла клятву». Еврейский глагол может обозначать клятву или проклятие; здесь контекст скорее указывает на проклятие.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейский текст: «Благословен мой сын [по отношению] к Яхве»; это краткая формула благословения. Предлог может указывать на того, от кого исходит благословение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: тысяча сто серебряных монет
  rationale: В еврейском тексте единица веса или номинал прямо не названы. «Серебряные монеты» понятно современному читателю и не вводит неуказанные в оригинале сикли.
- source_word: לֻקַּח לָךְ
  choice: которые у тебя взяли
  rationale: Сохраняет нейтральное значение пассивной формы לקח «были взяты» и не усиливает его до прямо не выраженного «украли».
- source_word: וְאַתִּי אָלִית
  choice: из-за которых ты произнесла проклятие
  rationale: Глагол אָלָה может относиться к клятве или проклятию; в данном контексте вероятнее проклятие по поводу исчезнувшего серебра. Неоднозначность отмечена в сноске.
- source_word: וְגַם אָמַרְתְּ בְּאָזְנַי
  choice: я сам слышал твои слова
  rationale: Естественно передаёт идиому «сказала в мои уши», то есть сказала в его присутствии, так что он слышал.
- source_word: הִנֵּה הַכֶּסֶף אִתִּי
  choice: вот, это серебро у меня
  rationale: Сохраняет указательную силу הִנֵּה и близко передаёт конструкцию «серебро со мной».
- source_word: אֲנִי לְקַחְתִּיו
  choice: я его взял
  rationale: Прямо передаёт признание; явное אֲנִי поддерживает акцент на говорящем, уже естественно ощутимый в русском контексте.
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  choice: Да благословит Яхве моего сына!
  rationale: Естественная русская формула благословения передаёт смысл компактной безглагольной еврейской конструкции, не делая неясное отношение предлога לְ излишне буквальным.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте употреблено собственное имя Бога; транслитерация «Яхве» сохраняет это различие.
- issue: Смысл благословения בָּרוּךְ בְּנִי לַיהוָה
  choice: Да благословит Яхве моего сына!
  alternative: Благословен мой сын у Яхве / Яхве благословил моего сына
  rationale: Выбрана естественная русская формула пожелания, при этом сноска сохраняет компактность и некоторую грамматическую неоднозначность еврейского выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Прямая речь звучит естественно; архаизмы устранены. Слово «монеты» употреблено в широком понятном смысле, без введения не названной в оригинале меры «сикль».
