translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным стилем. Реплики переданы естественно; повтор еврейского «сказал ему» во второй реплике заменён на «тот ответил», без изменения смысла. Форма «пришёл» обусловлена мужским полом персонажа.
