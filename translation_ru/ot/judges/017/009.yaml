  yaml_path: translation/ot/judges/017/009.yaml
  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
translation:
  language: ru
  text: 'Миха спросил его: «Откуда ты пришёл?» Тот ответил: «Я левит из Вифлеема в Иудее и иду пожить там, где найду себе место[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поселиться на время там, где найду [место]». Еврейский глагол может обозначать временное проживание, нередко в положении пришельца или зависимого жителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן
  choice: Откуда ты пришёл?
  rationale: Вопрос указывает на место, откуда пришёл человек. Такая формулировка естественна по-русски и передаёт употреблённый в еврейском тексте глагол движения.
- source_word: לֵוִי
  choice: левит
  rationale: Слово обозначает принадлежность к колену Левия; русское «левит» является обычным и точным соответствием.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: из Вифлеема в Иудее
  rationale: Фраза отличает этот Вифлеем как находящийся на территории Иуды. Современная географическая формулировка «в Иудее» ясна и естественна.
- source_word: הֹלֵךְ
  choice: иду
  rationale: Причастная форма описывает продолжающееся действие или путь, поэтому настоящее время «иду» сохраняет аспект и не уточняет способ передвижения.
- source_word: לָגוּר
  choice: пожить
  rationale: Глагол גור часто означает временно жить не в своём наследственном месте, иногда в положении пришельца или зависимого жителя. «Пожить» естественно передаёт временный характер, а дополнительный социальный оттенок отмечен в сноске.
- source_word: בַּאֲשֶׁר אֶמְצָא
  choice: там, где найду себе место
  rationale: В еврейском выражении объект глагола «найду» подразумевается. Добавление «место» делает русский текст понятным, не устраняя открытость и неопределённость дальнейшего пути.
