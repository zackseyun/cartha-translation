  text: וַ/יִּזְעֲק֣וּ בְנֵֽי יִשְׂרָאֵל֮ אֶל יְהוָה֒ וַ/יָּקֶם֩ יְהוָ֨ה לָ/הֶ֜ם מוֹשִׁ֗יעַ אֶת אֵה֤וּד בֶּן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אִ֥ישׁ אִטֵּ֖ר יַד יְמִינ֑/וֹ וַ/יִּשְׁלְח֨וּ בְנֵי יִשְׂרָאֵ֤ל בְּ/יָד/וֹ֙ מִנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֥לֶךְ מוֹאָֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
translation:
  language: ru
  text: Тогда сыны Израиля воззвали к Яхве, и Яхве воздвиг им избавителя — Эхуда, сына Геры, вениамитянина, человека, не владевшего правой рукой[a]. Сыны Израиля послали через него дань Эглону, царю Моава.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, по традиционному пониманию: «левшу». Буквально: «ограниченный в правой руке».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: воззвали
  rationale: Глагол передаёт настойчивый крик в бедствии и обращение за помощью, не добавляя прямо не выраженного дополнения «о помощи».
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет конкретную древнееврейскую идиому и её гендерную форму; выражение понятно в современном литературном библейском регистре.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт собственное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  choice: воздвиг им избавителя
  rationale: Сохраняет характерную для книги Судей формулу Божьего призвания человека, через которого приходит избавление.
- source_word: אֵהוּד בֶּן גֵּרָא
  choice: Эхуда, сына Геры
  rationale: Имена переданы транслитерацией, близкой к древнееврейской форме.
- source_word: בֶּן הַיְמִינִי
  choice: вениамитянина
  rationale: Выражение обозначает принадлежность к колену Вениамина; этноним естественнее буквального воспроизведения конструкции.
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  choice: человека с ограниченной правой рукой
  rationale: Необычная формулировка сохраняет указание на ограниченность правой руки и не сводит неоднозначный оригинал без оговорки к обычному значению «левша».
- source_word: וַיִּשְׁלְחוּ ... בְּיָדוֹ
  choice: послали через него
  rationale: 'Естественно передаёт древнееврейскую идиому посредничества «его рукой»: Эхуд был доставившим дань посланцем.'
- source_word: מִנְחָה
  choice: дань
  rationale: В политическом контексте речь идёт о плате, которую подвластный народ доставляет царю, а не о культовом приношении.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: Эглону, царю Моава
  rationale: Естественно воспроизводит имя адресата и поясняющий царский титул.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. «Яхве» сохраняет имя, не подменяя его титулом и не принимая позднюю огласовку «Иегова».
- issue: Значение מוֹשִׁיעַ применительно к Эхуду
  choice: избавитель
  alternative: спаситель; освободитель
  rationale: Здесь слово обозначает человека, через которого Бог избавляет Израиль от политического угнетения. «Избавитель» сохраняет богословскую связь со спасением, не приписывая Эхуду более широкий смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Слова «воззвали» и «воздвиг» сохраняют повторяющуюся формулу книги Судей; синтаксис при этом остаётся ясным. Необычность описания правой руки намеренно сохранена, а распространённое толкование вынесено в сноску.
