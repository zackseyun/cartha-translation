lexical_decisions:
- source_word: וַיֶּאֱסֹף אֵלָיו
  choice: Он собрал вокруг себя
  rationale: Оборот אָסַף אֵלָיו описывает собирание союзников при себе, под своим руководством. «Собрал вокруг себя» естественно передаёт это значение по-русски.
- source_word: בְּנֵי עַמּוֹן
  choice: аммонитян
  rationale: Обычное современное русское обозначение этого народа; буквальное «сынов Аммона» здесь звучало бы менее естественно.
- source_word: עֲמָלֵק
  choice: Амалика
  rationale: В еврейском тексте стоит собственное имя, употреблённое собирательно о народе. Форма «Амалика» сохраняет эту особенность; более явный этноним дан в сноске.
- source_word: וַיֵּלֶךְ
  choice: выступил
  rationale: В военном повествовательном контексте «выступил» естественно передаёт движение в поход, не добавляя деталей, отсутствующих в тексте.
- source_word: וַיַּךְ אֶת יִשְׂרָאֵל
  choice: поразил Израиль
  rationale: Глагол נכה означает «ударить, поразить» и здесь имеет военный смысл. «Поразил» сохраняет лаконичность и не уточняет без необходимости, было ли это нападение или окончательное поражение.
- source_word: וַיִּירְשׁוּ
  choice: они овладели
  rationale: Глагол стоит во множественном числе и указывает на царя вместе с союзными войсками. «Овладели» ясно выражает захват и установление владения.
- source_word: עִיר הַתְּמָרִים
  choice: Городом Пальм
  rationale: Сохранено описательное наименование места, употреблённое в еврейском тексте, без замены его на вероятное географическое отождествление.
theological_decisions:
- issue: Отождествление עִיר הַתְּמָרִים
  choice: В основном тексте — «Город Пальм».
  alternative: Иерихон.
  rationale: Еврейский текст даёт описательное название, а не прямо называет Иерихон. Вероятное отождествление вынесено в сноску, чтобы не устранять различие между формулировкой текста и её географическим объяснением.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. «Поразил» сохраняет широту военного значения исходного глагола, а «Город Пальм» передаёт образное наименование как топоним.
