  text: Then Ehud went out into the vestibule and shut the doors of the upper room behind him and locked them[a].
translation:
  language: ru
  text: Тогда Аод вышел в вестибюль[a], закрыл за собой двери верхней комнаты и запер их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в притвор», «на крыльцо», «в переднюю» или «в колоннаду»; редкое еврейское слово обозначает примыкающее к комнате архитектурное пространство, точный вид которого неизвестен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Повествовательная форма глагола יצא обозначает выход из помещения; русское «вышел» естественно передаёт движение Аода из верхней комнаты.
- source_word: הַמִּסְדְּרוֹנָה
  choice: в притвор
  rationale: Редкое архитектурное существительное מִסְדְּרוֹן обозначает примыкающее пространство, но его точный вид неясен. «Притвор» сохраняет архитектурный смысл без чрезмерной конкретизации; конечное -ה указывает направление движения.
- source_word: וַיִּסְגֹּר
  choice: закрыл
  rationale: Глагол סגר обычно означает «закрывать»; это наиболее естественное современное сочетание с дверями.
- source_word: דַּלְתוֹת
  choice: двери
  rationale: Форма множественного числа может обозначать двери или две дверные створки; «двери» сохраняет грамматическое число и звучит естественно.
- source_word: הָעֲלִיָּה
  choice: верхней комнаты
  rationale: Существительное עֲלִיָּה обозначает комнату или помещение в верхней части здания. «Верхняя комната» ясно и без лишней конкретизации передаёт архитектурный смысл.
- source_word: בַּעֲדוֹ
  choice: за собой
  rationale: 'При глаголе закрывания בְּעַד выражает пространственное отношение: Аод закрыл двери после того, как вышел. Русское «за собой» естественно передаёт это значение.'
- source_word: וְנָעָל
  choice: и запер их
  rationale: В данном контексте נעל означает запереть или закрепить двери. «Запер» — естественный современный эквивалент; местоимение «их» восполняет подразумеваемое дополнение «двери».
