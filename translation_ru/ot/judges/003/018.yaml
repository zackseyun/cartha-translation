  yaml_path: translation/ot/judges/003/018.yaml
  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
translation:
  language: ru
  text: Когда он закончил преподносить дань[a], то отпустил людей, нёсших её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дар»; или: «приношение». Здесь еврейское слово, вероятнее всего, означает дань, преподнесённую правителю, а не жертвенное приношение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Когда
  rationale: Повествовательная формула вводит следующее событие; в современном русском языке временной переход естественно передаётся союзом «когда» без буквального и тяжеловесного «и было, когда».
- source_word: כִּלָּה
  choice: закончил
  rationale: Глагол означает завершение действия; сочетание «закончил преподносить» ясно показывает, что передача дани завершилась до последующего действия.
- source_word: לְהַקְרִיב
  choice: преподносить
  rationale: В породе hифиль глагол קרב означает поднести или представить дар. «Преподносить» соответствует политическому контексту и не создаёт ненужной культовой окраски.
- source_word: הַמִּנְחָה
  choice: дань
  rationale: В данном контексте речь, вероятнее всего, идёт о подношении подвластного народа правителю, поэтому «дань» точнее передаёт политический смысл; возможные более широкие значения отмечены в сноске.
- source_word: וַיְשַׁלַּח
  choice: отпустил
  rationale: Глагол обозначает отправление или отсылку людей; «отпустил» естественно передаёт, что Аод удалил сопровождавших его людей.
- source_word: הָעָם
  choice: людей
  rationale: Хотя עָם обычно означает «народ», здесь слово обозначает конкретную группу сопровождавших Аода; винительный оборот «отпустил людей» точен и естественен по-русски, не уточняя их пол.
- source_word: נֹשְׂאֵי הַמִּנְחָה
  choice: нёсших её
  rationale: Причастный оборот сохраняет описательную функцию еврейской конструкции. Местоимение устраняет тяжёлый повтор слова «дань», не меняя референта.
