base_translation:
  language: en
  yaml_path: translation/ot/judges/003/020.yaml
  text: Then Ehud came to him while he was sitting alone in his cool roof chamber[a], and Ehud said[c][b], “I have a word from God for you.” So he rose from his seat.
translation:
  language: ru
  text: 'Аод подошёл к нему, когда тот сидел в своей прохладной верхней комнате, предназначенной только для него[a]. Аод сказал: «У меня к тебе слово от Бога». И тот поднялся со своего сиденья[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в прохладной горнице»; точное устройство этого верхнего помещения неизвестно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «с кресла» или «с престола».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא אֵלָיו
  choice: вошёл к нему
  rationale: בּוֹא обозначает приход или вход. В контексте личной комнаты естественное русское «вошёл к нему» передаёт приближение Аода к Еглону, не уточняя лишних деталей.
- source_word: יֹשֵׁב
  choice: сидел
  rationale: Причастие задаёт фоновое, продолжающееся действие; русское прошедшее несовершенного вида естественно передаёт этот смысл.
- source_word: עֲלִיַּת הַמְּקֵרָה
  choice: прохладной верхней комнате
  rationale: עֲלִיָּה — помещение на верхнем этаже или крыше, а הַמְּקֵרָה, вероятно, указывает на прохладу или устройство для охлаждения. Перевод сохраняет оба смысловых компонента без неестественного технического описания.
- source_word: אֲשֶׁר לוֹ לְבַדּוֹ
  choice: в своей … комнате; … один
  rationale: Оборот подчёркивает, что помещение принадлежало Еглону и было предоставлено ему одному. В русском это естественно выражается сочетанием притяжательного «своей» и обстоятельства «один».
- source_word: דְּבַר אֱלֹהִים
  choice: слово от Бога
  rationale: «Слово» близко к דָּבָר и сохраняет возможность понимать выражение как сообщение или весть; предлог «от» ясно передаёт заявленный божественный источник.
- source_word: וַיָּקָם
  choice: поднялся
  rationale: Глагол означает вставание или поднятие; выбранная форма естественна для повествования и сохраняет сдержанный регистр.
- source_word: מֵעַל הַכִּסֵּא
  choice: со своего сиденья
  rationale: כִּסֵּא может означать сиденье, кресло или престол. Нейтральное «сиденье» не вводит в частную сцену излишне церемониальный образ престола.
theological_decisions:
- issue: Значение אֱלֹהִים в заявлении Аода
  choice: Бога
  alternative: богов; божества
  rationale: Хотя форма אֱלֹהִים морфологически множественная, она обычно обозначает единого Бога. В сочетании דְּבַר אֱלֹהִים и данном контексте единственное число наиболее естественно. Перевод лишь передаёт слова Аода, не разрешая вопрос об их намерении или истинности.
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным ритмом. Формулировки понятны без специальной библейской лексики, при этом «слово от Бога» сохраняет достоинство и близость к еврейскому тексту.
