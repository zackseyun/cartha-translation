  naturalness: Текст остаётся современным литературным русским и сохраняет краткий повествовательный ритм. «Подошёл к нему» естественно в сцене личной аудиенции; «предназначенной только для него» ясно и не перегружено.
  terminology: «Аод», «слово от Бога» и нейтральное «сиденье» уместны. «Бога» корректно передаёт אֱלֹהִים в данном выражении, не добавляя богословских выводов. В сносках сохранены лексические альтернативы для спорного описания помещения и для כִּסֵּא.
