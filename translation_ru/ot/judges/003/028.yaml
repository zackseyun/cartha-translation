  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רִדְפ֣וּ אַחֲרַ֔/י כִּֽי נָתַ֨ן יְהוָ֧ה אֶת אֹיְבֵי/כֶ֛ם אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶ֑ם וַ/יֵּרְד֣וּ אַחֲרָ֗י/ו וַֽ/יִּלְכְּד֞וּ אֶת מַעְבְּר֤וֹת הַ/יַּרְדֵּן֙ לְ/מוֹאָ֔ב וְ/לֹֽא נָתְנ֥וּ אִ֖ישׁ לַ/עֲבֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/028.yaml
  text: And he said to them[a], “Follow after me, for Yahweh has given your enemies, Moab, into your hand.” So they went down after him and captured the fords of the Jordan against Moab[c][b], and they did not allow anyone to cross over.
translation:
  language: ru
  text: 'И сказал он им: «Идите за мной[a], потому что Яхве отдал в ваши руки ваших врагов — Моав[b]». Они спустились вслед за ним, захватили переправы через Иордан к Моаву[c] и не дали никому перейти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Преследуйте, следуя за мной».'
    reason: Глагол רדף обычно означает «преследовать, гнаться»; объект не выражен, поэтому в основном тексте выбран естественный призыв к движению вслед за предводителем.
  - marker: b
    text: 'Буквально: «врагов ваших, Моав»; название страны поясняет, кто эти враги.'
    reason: Сохранение необычной аппозиционной конструкции и коллективного употребления названия страны.
  - marker: c
    text: 'Или: «переправы через Иордан против Моава»; выражение может обозначать направление к Моаву либо действие против него.'
    reason: Предлог לְ допускает несколько контекстуально возможных отношений.
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  choice: Идите за мной
  rationale: Глагол רדף обычно означает «преследовать, гнаться», но здесь Эхуд призывает союзников двигаться вслед за ним. Основной текст передаёт естественный русский призыв, а военной оттенок сохранён в сноске.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: отдал в ваши руки
  rationale: Сохранён древнееврейский образ передачи врага под чью-либо власть; совершённое действие выражает уверенность в исходе.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, а не заменяющий его титул.
- source_word: אֹיְבֵיכֶם אֶת מוֹאָב
  choice: врагов ваших — Моав
  rationale: «Моав» стоит в приложении к «врагам вашим». Тире естественно обозначает пояснительную связь, не заменяя название страны этнонимом «моавитяне».
- source_word: וַיֵּרְדוּ אַחֲרָיו
  choice: Они спустились вслед за ним
  rationale: Глагол ירד сохраняет географически значимое движение вниз, из нагорья к долине Иордана.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: переправы через Иордан
  rationale: מַעְבְּרוֹת обозначает места перехода через реку; «переправы» — точное и естественное военное обозначение, не обязательно ограниченное мелководными бродами.
- source_word: לְמוֹאָב
  choice: к Моаву
  rationale: 'Предлог ל допускает направительное понимание: переправы, ведущие в сторону Моава. Контекстуальное «против Моава» возможно, но менее буквально.'
- source_word: וְלֹא נָתְנוּ אִישׁ לַעֲבֹר
  choice: никому не позволяли переходить
  rationale: Идиоматически передаёт буквальное «не дали человеку перейти», сохраняя всеобщий запрет и продолженный характер контроля переправ.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Моав как коллективно-национальное обозначение
  choice: врагов ваших — Моав
  alternative: врагов ваших — моавитян; врага вашего — Моав
  rationale: Древнееврейский текст употребляет множественное «врагов» и ставит название «Моав» как поясняющее приложение; перевод сохраняет это грамматическое напряжение.
- issue: Значение לְמוֹאָב
  choice: к Моаву
  alternative: против Моава; со стороны Моава
  rationale: Предлог допускает направление, назначение или отношение. В основном тексте выбрано наиболее прямое направительное прочтение, а контекстуальная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Синтаксис остаётся ясным для широкого читателя; древнееврейские образы «отдал в руки» и географическое «спустились» сохранены. Все сноски привязаны к соответствующим местам основного текста.
