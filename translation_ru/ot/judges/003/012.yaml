source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְחַזֵּ֨ק יְהוָ֜ה אֶת עֶגְל֤וֹן מֶֽלֶךְ מוֹאָב֙ עַל יִשְׂרָאֵ֔ל עַ֛ל כִּֽי עָשׂ֥וּ אֶת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/012.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and Yahweh strengthened Eglon king of Moab against Israel, because they had done what was evil in the eyes of Yahweh.
translation:
  language: ru
  text: И снова сыны Израиля[a] стали делать зло в глазах Яхве. Тогда Яхве укрепил Еглона, царя Моава, против Израиля за то, что они сделали зло в глазах Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля»; по смыслу также: «израильтяне».'
    reason: Лексическая альтернатива поясняет еврейское родственное обозначение народа.
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: снова … стали делать
  rationale: Сочетание יסף с инфинитивом выражает повторение или продолжение действия. В контексте повторяющегося цикла книги Судей «снова … стали делать» естественно передаёт возобновление зла.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохранён родственный образ еврейского выражения; современный идиоматический эквивалент «израильтяне» указан в сноске.
- source_word: לַעֲשׂוֹת הָרַע
  choice: делать зло
  rationale: Формула передана ясно и естественно, без чрезмерно буквального «делать это зло».
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранена понятная в русском языке еврейская метафора нравственной оценки.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, представленное тетраграмматоном, а не заменяющий его титул.
- source_word: וַיְחַזֵּק
  choice: укрепил
  rationale: Прямо передаёт каузативное значение формы пиэль от חזק и сохраняет явное действие Яхве.
- source_word: אֶת עֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: Еглона, царя Моава
  rationale: Естественная русская передача приложения при сохранении имени и титула.
- source_word: עַל יִשְׂרָאֵל
  choice: против Израиля
  rationale: В данном враждебном контексте עַל указывает на направленность против Израиля; перевод не превращает эту фразу заранее в утверждение о власти над ним.
- source_word: עַל כִּי
  choice: за то, что
  rationale: Передаёт основание Божьего действия и в русском контексте естественно подчёркивает судебный характер причины.
- source_word: עָשׂוּ אֶת הָרַע
  choice: они делали зло
  rationale: Сохраняет повтор ключевой формулы стиха и не вводит отсутствующих в тексте уточнений.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст дважды употребляет личное имя Бога. Транслитерация сохраняет это имя, не подменяя его титулом.
- issue: Божественное действие во фразе וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן
  choice: Яхве укрепил Еглона
  alternative: Яхве позволил Еглону усилиться
  rationale: Грамматическая конструкция прямо приписывает Яхве активное укрепление Еглона. Перевод сохраняет богословское напряжение и не ослабляет причинность до простого позволения.
- issue: Значение עַל יִשְׂרָאֵל
  choice: против Израиля
  alternative: над Израилем
  rationale: Оба оттенка возможны в контексте последующего господства Еглона, однако «против» точнее сохраняет направленность действия в самом выражении и не делает результат явным раньше повествования.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранены повтор формулы «делать зло в глазах Яхве», личное имя Яхве и прямая божественная причинность. Союз «тогда» естественно связывает проступок с последующим судебным действием.
