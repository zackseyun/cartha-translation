base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
translation:
  language: ru
  text: И Дух Яхве сошёл на него[a], и он судил Израиль. Он вышел на битву, и Яхве отдал в его руку Кушан-Ришатаима, царя Арама[b], и его рука взяла верх над Кушан-Ришатаимом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Дух Яхве был на нём». Древнееврейский оборот допускает более статичное понимание, хотя повествовательный контекст благоприятствует переводу «сошёл на него».'
    reason: lexical_alternative
  - marker: b
    text: Арам — древнееврейское название области, которую в старых переводах нередко называют Сирией.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּהִי עָלָיו רוּחַ יְהוָה
  choice: Дух Яхве сошёл на него
  rationale: Оборот היה על с רוּחַ может обозначать как пребывание Духа на человеке, так и наступление этого состояния. В данном повествовательном контексте «сошёл на него» естественно передаёт начало наделения силой, не устраняя более статичную возможность, отмеченную в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом «Господь».
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: и он судил Израиль
  rationale: Глагол שׁפט в книге Судей охватывает судебное, управленческое и избавительное служение; буквальное «судил» сохраняет ключевую лексику книги и не сужает роль героя до одной из этих функций.
- source_word: וַיֵּצֵא לַמִּלְחָמָה
  choice: Он вышел на битву
  rationale: Так передан обычный военный оборот со значением выступления для сражения.
- source_word: וַיִּתֵּן יְהוָה בְּיָדוֹ
  choice: Яхве отдал в его руку
  rationale: Сохранён ясный в русском языке древнееврейский образ передачи врага под власть победителя.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Кушан-Ришатаим
  rationale: Имя транслитерировано и оформлено через дефис как составное собственное имя.
- source_word: מֶלֶךְ אֲרָם
  choice: царь Арама
  rationale: Топоним אֲרָם передан напрямую как «Арам», без традиционной, но менее точной замены «Сирия».
- source_word: וַתָּעָז יָדוֹ עַל
  choice: и рука его одолела
  rationale: Фраза сохраняет метафору руки как силы и власти, одновременно естественно выражая победу над противником.
theological_decisions:
- issue: Характер действия Духа Яхве
  choice: Дух Яхве сошёл на него
  alternative: Дух Яхве был на нём
  rationale: Контекст начала служения и последующей победы поддерживает динамическое прочтение как наделение силой, однако грамматика допускает и описание пребывания Духа; эта неоднозначность сохранена в сноске без привнесения более поздних догматических построений.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Передача личного имени сохраняет различие между именем Бога и титулом.
- issue: Географическое название אֲרָם
  choice: Арам
  alternative: Сирия
  rationale: «Арам» непосредственно отражает древнееврейский топоним и избегает возможного исторического анахронизма.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Сохранены повтор имени противника и метафоры «отдал в руку» / «рука одолела», образующие заметную связь в исходном тексте. Порядок первой фразы слегка адаптирован для естественного русского синтаксиса.
