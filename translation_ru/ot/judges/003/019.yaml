base_translation:
  language: en
  yaml_path: translation/ot/judges/003/019.yaml
  text: But he himself turned back from the carved images that were near Gilgal and said[a], “I have a secret message for you, O king.” And he said[c][b], “Silence.” Then all who were standing by him went out from his presence.
translation:
  language: ru
  text: 'Но сам он повернул назад от резных изображений[a], что были близ Галгала[b], и сказал: «У меня есть для тебя тайное сообщение[c], государь». Тот приказал: «Тише!» — и все стоявшие при нём ушли от него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «идолов». Еврейское слово часто обозначает культовые изображения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «что были в Галгале». Сжатое еврейское выражение может указывать как на близость к Галгалу, так и на нахождение в нём.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «тайное слово»; возможно также: «личное дело».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: повернул назад
  rationale: 'Передаёт перемену направления в повествовании: Аод, уже удалившийся с сопровождавшими его людьми, возвращается к царю.'
- source_word: הַפְּסִילִים
  choice: резные изображения
  rationale: Сохраняет конкретное значение слова פסילים — высеченные или вырезанные изображения — и не устраняет его вероятный культовый смысл.
- source_word: אֲשֶׁר אֶת־הַגִּלְגָּל
  choice: что были близ Галгала
  rationale: Сжатая еврейская конструкция выражает местоположение изображений по отношению к Галгалу; «близ» естественно передаёт эту связь, не утверждая точного положения.
- source_word: דְּבַר סֵתֶר
  choice: тайное сообщение
  rationale: דבר может означать слово, дело или сообщение, а סתר — нечто скрытое; сочетание подходит придворной сцене и сохраняет некоторую смысловую широту.
- source_word: לִי אֵלֶיךָ
  choice: у меня есть для тебя
  rationale: Естественно передаёт идиоматическое сочетание принадлежности говорящему и направленности к адресату.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: В прямом обращении современное русское «царь» звучит естественно и сохраняет почтительную форму без архаического «о царь».
- source_word: הָס
  choice: Тише!
  rationale: Краткая команда сохраняет резкость еврейского междометия-повеления и в контексте может быть обращена к присутствующим.
- source_word: כָּל־הָעֹמְדִים עָלָיו
  choice: все стоявшие при нём
  rationale: «При нём» передаёт не только пространственную близость, но и положение царских слуг или приближённых.
- source_word: מֵעָלָיו
  choice: вышли от него
  rationale: Передаёт удаление присутствующих от царя без добавления отсутствующего в тексте указания на конкретное помещение.
