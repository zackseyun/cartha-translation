  source_fidelity: 'Основной смысл и повтор ограничительной частицы переданы, однако в черновике нарушено согласование: при подлежащем «поколения» употреблено «кто ... не знал». Кроме того, «узнали ... чтобы научить» создаёт в русском неясную последовательность целей. Исправление сохраняет целевую конструкцию и семантическую широту ידע («знать / узнать войну»), не сводя её исключительно к боевому опыту.'
  naturalness: «Только те поколения, которые прежде войны не знали» грамматически цельно и естественно для современного литературного русского. Оборот «то есть чтобы научить их воевать» обозначает пояснительную связь второго инфинитива с первой целью, не добавляя нового содержания.
