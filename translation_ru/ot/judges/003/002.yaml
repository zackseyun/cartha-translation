  text: רַ֗ק לְמַ֨עַן֙ דַּ֚עַת דֹּר֣וֹת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/לַמְּדָ֖/ם מִלְחָמָ֑ה רַ֥ק אֲשֶׁר לְ/פָנִ֖ים לֹ֥א יְדָעֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/002.yaml
  text: only so that the generations of the sons of Israel might know[b][a], to teach them war—only those who formerly had not known it.
translation:
  language: ru
  text: только для того, чтобы поколения сынов Израиля[a] узнали войну[b], то есть чтобы научить их воевать, — только те поколения, которые прежде войны не знали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поколения израильтян». Буквально: «поколения сынов Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «приобрели опыт войны».'
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: только
  rationale: Ограничительная частица повторена в еврейском тексте; повтор сохранён, хотя по-русски он создаёт намеренно напряжённую конструкцию.
- source_word: לְמַעַן
  choice: для того, чтобы
  rationale: Передаёт целевое значение оборота естественным современным русским выражением.
- source_word: דַּעַת
  choice: узнали
  rationale: Инфинитив от ידע обозначает обретение знания или знакомства; совершенный вид естественно выражает предполагаемый результат.
- source_word: דֹּרוֹת בְּנֵי יִשְׂרָאֵל
  choice: поколения сынов Израиля
  rationale: Сохранены как значение «поколения», так и буквальная форма традиционного корпоративного обозначения Израиля; подразумеваемое «будущие» в основной текст не добавлено.
- source_word: לְלַמְּדָם מִלְחָמָה
  choice: чтобы научить их воевать
  rationale: Буквально — «научить их войне». Русское «научить воевать» естественно передаёт военное значение сочетания, не сужая его до отдельного сражения.
- source_word: אֲשֶׁר לְפָנִים
  choice: те, кто прежде
  rationale: Оборот указывает на людей из названных поколений и на предшествующее время.
- source_word: לֹא יְדָעוּם
  choice: войны не знал
  rationale: Повтор корня ידע сохранён через глагол «знать»; явное повторение «войны» устраняет в русском неясность местоименного согласования и передаёт абстрактно-собирательный смысл объекта.
theological_decisions:
- issue: Корпоративное выражение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Буквальная форма сохраняет образ родовой принадлежности и обозначает народ в целом, а не исключительно мужчин; более идиоматичный вариант дан в сноске.
- issue: Значение «знать войну»
  choice: узнали войну / войны не знал
  alternative: испытали войну / не имели опыта войны
  rationale: 'Сохранена смысловая широта ידע: речь может идти как о знакомстве с войной, так и о непосредственном военном опыте. Более определённое толкование не внесено молча.'
- issue: Отношение двух целевых формулировок
  choice: «узнали войну, чтобы научить их воевать»
  alternative: «знали — обучить их войне»
  rationale: Русская конструкция показывает пояснительную связь между познанием войны и обучением, не превращая её в отдельное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Повтор «только» и лексический повтор «узнали / не знал» сохранены ради структуры и смыслового напряжения еврейского текста; архаичные формы вроде «сынов Израилевых» не использованы.
