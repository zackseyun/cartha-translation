  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
translation:
  language: ru
  text: Израильтяне[a] делали зло в глазах Яхве[b], и они забыли Яхве, своего Бога, и служили Ваалам и Ашерам[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: «Зло в глазах Яхве» — устойчивое еврейское выражение, означающее то, что Яхве считал злом.
    reason: lexical_alternative
  - marker: c
    text: Еврейское слово может обозначать культовые предметы, связанные с Ашерой (например, священные столбы или деревья), либо, шире, местные формы почитания Ашеры.
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: израильтяне
  rationale: Естественное современное русское обозначение народа Израиля; буквальная форма «сыны Израиля» отмечена в сноске.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: то, что было злом в глазах Яхве
  rationale: Сохраняет стандартную еврейскую оценочную формулу и прямо передаёт, что поступки оцениваются Яхве как зло.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: וַיִּשְׁכְּחוּ
  choice: они забыли
  rationale: Сохраняет основное значение глагола שׁכח; подразумеваемое заветное отступничество не подменяет прямой смысл.
- source_word: אֱלֹהֵיהֶם
  choice: своего Бога
  rationale: Возвратное местоимение естественно по-русски соотносит Бога с подлежащим; при Яхве форма имеет единственное значение.
- source_word: וַיַּעַבְדוּ
  choice: служили
  rationale: Передаёт культовое служение, не сужая смысл до одного лишь обряда поклонения.
- source_word: הַבְּעָלִים
  choice: ваалам
  rationale: Сохраняет множественное число, вероятно обозначающее местные проявления или образы Ваала.
- source_word: הָאֲשֵׁרוֹת
  choice: ашерам
  rationale: Транслитерация сохраняет возможность понимать слово и как множественные проявления Ашеры, и как связанные с её культом предметы; неоднозначность пояснена в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Значение הָאֲשֵׁרוֹת
  choice: ашерам
  alternative: столбам Ашеры
  rationale: Еврейское слово может обозначать как культовые предметы, связанные с Ашерой, так и локализованные проявления её культа; основной текст не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-д dignified библейским звучанием. Синтаксис упрощён для естественного чтения, при этом сохранены повтор имени Яхве, последовательность действий и неоднозначность культовых терминов.
