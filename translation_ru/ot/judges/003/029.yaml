id: JDG.3.29
reference: Judges 3:29
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יַּכּ֨וּ אֶת מוֹאָ֜ב בָּ/עֵ֣ת הַ/הִ֗יא כַּ/עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ כָּל שָׁמֵ֖ן וְ/כָל אִ֣ישׁ חָ֑יִל וְ/לֹ֥א נִמְלַ֖ט אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
translation:
  language: ru
  text: И поразили они в то время около десяти тысяч моавитян — всех крепких[a] и всех доблестных воинов[b]; никто не спасся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «всех тучных»; вероятно, имеются в виду упитанные, крепкие или отборные воины.
    reason: lexical_alternative
  - marker: b
    text: Или «всех сильных (способных) воинов».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: поразили
  rationale: В военном контексте глагол נכה обозначает нанесение поражения и умерщвление; «поразили» сохраняет традиционную выразительность и не уточняет смысл сверх контекста.
- source_word: אֶת מוֹאָב
  choice: моавитян
  rationale: Буквально объектом назван «Моав», но последующее «около десяти тысяч» указывает на людей; этноним естественно передаёт этот смысл по-русски.
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Естественное и близкое к форме исходного текста выражение времени.
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: около десяти тысяч
  rationale: Префикс כ здесь выражает приблизительность; слово «человек» не повторяется, поскольку оно уже заключено в форме «моавитян».
- source_word: כָּל שָׁמֵן
  choice: всех крепких
  rationale: שָׁמֵן буквально связано с полнотой и упитанностью, но в военном контексте, вероятно, характеризует отборных, сильных людей. «Крепких» естественно передаёт контекстуальный смысл, а буквальный образ отмечен в сноске.
- source_word: וְכָל אִישׁ חָיִל
  choice: и всех доблестных воинов
  rationale: אִישׁ חַיִל может означать доблестного, сильного или способного человека; военный контекст поддерживает перевод «доблестные воины».
- source_word: וְלֹא נִמְלַט אִישׁ
  choice: никто не спасся
  rationale: Передаёт усиленную всеобщность еврейского выражения буквально «не спасся ни один человек» в естественной современной русской форме.
