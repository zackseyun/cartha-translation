  text: וַ/תִּכָּנַ֤ע מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא תַּ֖חַת יַ֣ד יִשְׂרָאֵ֑ל וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ שְׁמוֹנִ֥ים שָׁנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/030.yaml
  text: So Moab was subdued under the hand of Israel that day[c][b][a], and the land had rest for eighty years.
translation:
  language: ru
  text: В тот день Моав был подчинён власти Израиля, и земля пребывала в покое восемьдесят лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכָּנַע
  choice: был покорён
  rationale: Нифаль глагола כנע выражает результат подчинения; в данном военно-политическом контексте «был покорён» естественно передаёт смысл, не усиливая его до уничтожения.
- source_word: מוֹאָב
  choice: Моав
  rationale: Устоявшаяся русская форма названия народа и страны.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Прямо и естественно передаёт временное выражение и указательное значение הַהוּא.
- source_word: תַּחַת יַד יִשְׂרָאֵל
  choice: рукой Израиля
  rationale: Сохраняет образ «руки» и в русской пассивной конструкции ясно указывает, чьей силой был покорён Моав; буквальное «под рукой Израиля» могло бы звучать как описание последующего положения, тогда как глагольная конструкция сообщает событие покорения.
- source_word: וַתִּשְׁקֹט
  choice: покоилась
  rationale: Глагол שקט обозначает тишину и отсутствие смуты или войны; «земля покоилась» сохраняет традиционный библейский образ и остаётся понятным современному читателю.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Передаёт регион или землю Израиля без излишне конкретизирующего слова «страна».
- source_word: שְׁמוֹנִים שָׁנָה
  choice: восемьдесят лет
  rationale: Естественное русское обозначение продолжительности; отдельный предлог не требуется при глаголе «покоилась».
theological_decisions:
- issue: Характер господства Израиля над Моавом
  choice: военно-политическое покорение Моава силой Израиля
  alternative: лишь образное смирение либо полное уничтожение Моава
  rationale: Контекст сообщает о подчинении Моава и наступившем покое; перевод не ослабляет событие до внутреннего смирения и не усиливает его до истребления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и соответствует повествовательному итогу эпизода; сохранён образ покоя земли.
