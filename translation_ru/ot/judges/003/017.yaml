base_translation:
  language: en
  yaml_path: translation/ot/judges/003/017.yaml
  text: He presented the tribute to Eglon king of Moab[a]. Now Eglon was a very fat man.
translation:
  language: ru
  text: Он поднёс дань Эглону, царю Моава.[a] Эглон же был очень тучным человеком.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дар» или «подношение». Еврейское слово «минха» может означать дар или приношение, но здесь, вероятнее всего, имеется в виду дань, которую подвластный народ платил правителю.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Он поднёс
  rationale: Порода hифиль глагола קרב здесь означает поднести или представить нечто правителю. «Поднёс» естественно передаёт придворный контекст и сохраняет идею вручения.
- source_word: הַמִּנְחָה
  choice: дань
  rationale: В контексте порабощения Израиля Моавом מִנְחָה обозначает, вероятнее всего, дань, доставляемую подвластным народом царю. Возможны также более общие значения «дар» и «подношение».
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: Эглону, царю Моава
  rationale: Имя передано принятой русской библейской формой; приложение оформлено естественно для современного литературного русского языка.
- source_word: וְעֶגְלוֹן
  choice: Эглон же
  rationale: Союз вводит пояснительное замечание о царе; частица «же» естественно отмечает этот переход, не превращая его в отдельное временное утверждение.
- source_word: אִישׁ
  choice: человеком
  rationale: Существительное относится непосредственно к мужчине Эглону. Творительный падеж требуется русской именной конструкцией с «был».
- source_word: בָּרִיא
  choice: тучным
  rationale: Прилагательное указывает на телесную полноту, существенную для последующего повествования. «Тучный» точно и достойно передаёт значение, не смягчая его до «крепкий» или «упитанный».
- source_word: מְאֹד
  choice: очень
  rationale: Обычный и ясный русский усилитель точно передаёт еврейское наречие.
