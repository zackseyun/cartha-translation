source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּמְכְּרֵ֗/ם בְּ/יַד֙ כּוּשַׁ֣ן רִשְׁעָתַ֔יִם מֶ֖לֶךְ אֲרַ֣ם נַהֲרָ֑יִם וַ/יַּעַבְד֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
translation:
  language: ru
  text: И воспылал гнев Яхве на Израиль, и Он продал их в руки Кушан-Ришатаима, царя Арам-Нахараима[a]. И служили сыны Израиля Кушан-Ришатаиму восемь лет.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Месопотамии»; евр. «Арам-Нахараим», традиционно понимаемое как «Арам двух рек».'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «сыны Израиля» — устойчивое еврейское обозначение израильского народа.'
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: воспылал гнев
  rationale: Сохраняет еврейский образ горящего гнева и при этом естественно звучит в современном литературном русском.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт непосредственно употреблённое в еврейском тексте личное имя Бога, а не заменяет его титулом.
- source_word: וַיִּמְכְּרֵם
  choice: Он продал их
  rationale: Глагол מכר буквально означает «продавать»; формулировка сохраняет резкий образ суда, не сглаживая его до «предал».
- source_word: בְּיַד
  choice: в руки
  rationale: Сохраняет исходную метафору власти и подчинения; русское множественное число в устойчивом обороте звучит естественно.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Кушан-Ришатаим
  rationale: Имя транслитерировано и оформлено через дефис как единое обозначение.
- source_word: אֲרַם נַהֲרָיִם
  choice: Арам-Нахараим
  rationale: В основном тексте сохранена транслитерация еврейского географического названия; традиционное толкование вынесено в примечание.
- source_word: וַיַּעַבְדוּ
  choice: служили
  rationale: Прямо передаёт עבד и сохраняет возможный спектр смысла — служение, зависимость и политическое подчинение.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет буквальную форму устойчивого обозначения народа; «сыны» здесь уместно в достоинственном библейском регистре.
- source_word: שְׁמֹנֶה שָׁנִים
  choice: восемь лет
  rationale: Прямая и естественная передача временного выражения.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит тетраграмматон как личное имя; транслитерация сохраняет различие между именем и титулом.
- issue: Образ Божьего суда в וַיִּמְכְּרֵם
  choice: Он продал их
  alternative: Он предал их во власть
  rationale: 'Буквальный образ не смягчён: он выражает Божий суд над Израилем, не объясняя сверх текста характер этого действия.'
- issue: Коллективное обозначение בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Сохранена исходная родовая формула как название всего народа, без сведения её значения только к взрослым мужчинам.
translation_notes:
  register: Современный литературный русский с достоинственным библейским звучанием. Сохранены исходные образы «воспылал гнев», «продал» и «в руки», но синтаксис сделан естественным для русского языка. Маркер [b] поставлен после предложения, к которому относится пояснение выражения «сыны Израиля».
