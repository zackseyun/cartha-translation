  text: וַ/יָּבֹ֨א גַֽם הַ/נִּצָּ֜ב אַחַ֣ר הַ/לַּ֗הַב וַ/יִּסְגֹּ֤ר הַ/חֵ֨לֶב֙ בְּעַ֣ד הַ/לַּ֔הַב כִּ֣י לֹ֥א שָׁלַ֛ף הַ/חֶ֖רֶב מִ/בִּטְנ֑/וֹ וַ/יֵּצֵ֖א הַֽ/פַּרְשְׁדֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
translation:
  language: ru
  text: Вслед за клинком вошла и рукоять[a], и жир сомкнулся вокруг клинка, потому что он не вытащил меч из его живота; и вышли испражнения[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «рукоятка»; значение еврейского слова допускает общее обозначение части оружия, следующей за клинком.'
    reason: lexical_alternative
  - marker: b
    text: Редкое еврейское слово обычно понимают как испражнения, но оно может шире обозначать содержимое кишечника.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּב
  choice: рукоять
  rationale: В контексте меча слово обозначает часть оружия, следующую за клинком. «Рукоять» — естественное и понятное русское соответствие, не сужающее значение до одного лишь эфеса.
- source_word: הַלַּהַב
  choice: клинок
  rationale: Хотя в других контекстах существительное может означать «пламя», здесь речь явно идёт о клинке меча.
- source_word: וַיִּסְגֹּר ... בְּעַד
  choice: сомкнулся вокруг
  rationale: Сочетание глагола «закрывать, смыкать» с предлогом передаёт обволакивание клинка жиром; эта формулировка естественна по-русски и сохраняет наглядность сцены.
- source_word: הַחֵלֶב
  choice: жир
  rationale: Прямое конкретное соответствие сохраняет резкую телесность еврейского повествования.
- source_word: שָׁלַף
  choice: вытащил
  rationale: Глагол обозначает извлечение оружия; поскольку меч уже находится в теле, «вытащил» звучит естественнее, чем «обнажил».
- source_word: מִבִּטְנוֹ
  choice: из его живота
  rationale: «Живот» точно и без клинической окраски передаёт телесный характер исходного слова. Местоименная форма сохраняет структуру оригинала.
- source_word: הַפַּרְשְׁדֹנָה
  choice: испражнения
  rationale: Редкое слово обычно понимают как экскременты или содержимое кишечника. «Испражнения» ясно передаёт традиционное понимание и подходит современному литературному регистру; неопределённость отмечена в сноске.
- source_word: וַיֵּצֵא
  choice: вышли
  rationale: Простой глагол движения передан без эвфемистического смягчения; множественная форма согласована с русским словом «испражнения».
- source_word: גַם
  choice: и
  rationale: В конструкции «вошла и рукоять» частица подчёркивает, что вслед за клинком внутрь вошла также рукоять.
theological_decisions: []
