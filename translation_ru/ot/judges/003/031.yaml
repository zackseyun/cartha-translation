base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
translation:
  language: ru
  text: После него был Шамгар, сын Анат[a]. Он поразил шестьсот филистимлян стрекалом для волов[b] и тоже спас Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально «сын Анат». Возможно, это указание на отца Шамгара; точный характер этого именования неясен.
    reason: textual_or_semantic_ambiguity
  - marker: b
    text: Стрекало — длинная заострённая палка, которой погоняли волов.
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: После него
  rationale: Сохраняет прямую отсылку к предыдущему избавителю, не добавляя в текст имени Аода.
- source_word: הָיָה
  choice: был
  rationale: Передаёт простое повествовательное введение нового лица без добавочного оттенка «восстал» или «пришёл».
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Шамгар, сын Анат
  rationale: Имена переданы с опорой на еврейскую форму; буквальная конструкция сохранена, поскольку неясно, обозначает ли она родство или устойчивое прозвание.
- source_word: וַיַּךְ
  choice: поразил
  rationale: Глагол נכה в боевом контексте обозначает нанесение поражения, нередко со смертельным исходом; «поразил» сохраняет эту смысловую широту.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ ... פְּלִשְׁתִּים
  choice: шестьсот филистимлян
  rationale: Естественно передаёт исчисляемую группу людей в военном контексте без избыточного слова «мужчин».
- source_word: בְּמַלְמַד הַבָּקָר
  choice: стрекалом для волов
  rationale: «Стрекало» обозначает заострённую палку для понукания рабочего скота и сохраняет конкретный земледельческий образ древнего орудия.
- source_word: וַיֹּשַׁע גַּם הוּא אֶת־יִשְׂרָאֵל
  choice: и тоже спас Израиль
  rationale: «Спас» ясно передаёт избавление народа от военной угрозы, а «тоже» сохраняет добавочное значение גַּם הוּא и связь с предшествующими избавителями.
theological_decisions:
- issue: Характер совершённого Шамгаром спасения
  choice: тоже спас Израиль
  alternative: тоже избавил Израиль
  rationale: Фраза приписывает Шамгару реальное избавление Израиля, но не определяет его масштаб и продолжительность. «Спас» сохраняет повторяющуюся в книге тему спасения, не придавая здесь глаголу более широкого сотериологического смысла.
- issue: Значение выражения «сын Анат»
  choice: сохранить буквально с примечанием о неопределённости
  alternative: истолковать исключительно как родословное указание или как воинское прозвание
  rationale: Еврейский текст допускает буквальное понимание отчества, однако возможная функция устойчивого наименования не позволяет безоговорочно устранить неоднозначность.
translation_notes:
  register: 'Современный литературный русский язык с кратким, повествовательным синтаксисом. Слово «стрекало» менее употребительно в повседневной речи, но точно называет древнее орудие и разъяснено в примечании. Имена переданы непосредственно с древнееврейского: «Шамгар», «Анат».'
