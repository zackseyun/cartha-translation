source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִנִּ֣יחַ יְהוָ֔ה לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל אֵ֚ת כָּל אֲשֶׁ֣ר לֹֽא יָדְע֔וּ אֵ֖ת כָּל מִלְחֲמ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'These are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
translation:
  language: ru
  text: 'Вот народы, которых Яхве оставил, чтобы через них испытать израильтян, не знавших ни одной из войн Ханаана[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не переживших ни одной из войн Ханаана».'
    reason: Глагол ידע («знать») в этом контексте может обозначать личный опыт, а не только осведомлённость.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Вот
  rationale: «Вот» естественно вводит перечень и передаёт указательную силу אֵלֶּה; отдельное «и» в русском здесь не требуется для сохранения повествовательной связи.
- source_word: הַגּוֹיִם
  choice: народы
  rationale: Речь идёт об этнополитических группах, оставшихся в земле; «народы» — точный и привычный эквивалент.
- source_word: הִנִּיחַ
  choice: оставил
  rationale: Каузативная форма глагола נוח здесь означает «оставить, позволить остаться». Краткое «оставил» сохраняет формулировку источника без пояснительного расширения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: לְנַסּוֹת בָּם
  choice: чтобы через них испытать
  rationale: נסה означает подвергнуть испытанию, а בָּם указывает на средство испытания. «Через них» звучит по-русски естественнее буквального «ими».
- source_word: אֵת כָּל אֲשֶׁר לֹא יָדְעוּ
  choice: всех тех, кто не знал
  rationale: Оборот поясняет, какая часть Израиля имеется в виду. Сохранён глагол «знать», способный в данном контексте обозначать знание по личному опыту.
- source_word: אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  choice: ни одной из войн за Ханаан
  rationale: Под отрицанием еврейское «все войны» идиоматично передаётся по-русски как «ни одной из войн». «За Ханаан» обозначает войны, связанные с завоеванием земли, и естественнее неоднозначного сочетания «войны Ханаана».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте непосредственно употреблено личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Божественное испытание Израиля
  choice: чтобы через них испытать Израиль
  alternative: чтобы через них проверить Израиль
  rationale: Формулировка сохраняет прямое утверждение текста о цели, ради которой народы были оставлены, не смягчая и не объясняя богословское напряжение.
- issue: К кому относится «всех тех»
  choice: к Израилю
  alternative: к народам
  rationale: Синтаксис и контекст указывают, что речь идёт о тех из Израиля, кто не имел опыта прежних войн; тире сохраняет пояснительную связь, не добавляя отсутствующего в источнике существительного.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Двоеточие сохранено, поскольку предложение продолжается в следующем стихе. Тире помогает читателю увидеть, что «всех тех» поясняет слово «Израиль», а не «народы».
