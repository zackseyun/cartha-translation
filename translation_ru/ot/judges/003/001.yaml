  source_fidelity: 'Драфт верно передаёт основные элементы стиха: народы, оставленные Яхве; цель испытать Израиль посредством этих народов; и группу израильтян, не знавших войн Ханаана. Однако «войны за Ханаан» конкретизирует генитив כְּנָעַן как войны за завоевание Ханаана. В еврейском тексте стоит более сжатое и потенциально неоднозначное «войны Ханаана», поэтому такую историческую интерпретацию не следует вносить в основной текст.'
