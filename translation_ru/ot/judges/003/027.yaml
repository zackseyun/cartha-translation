  source_fidelity: 'Русский текст точно передаёт синтаксическую и смысловую последовательность еврейского текста: временное придаточное בְּבוֹאוֹ, трубный сигнал, нагорье Ефрема, спуск сынов Израиля вместе с Аодом и его положение впереди них. «Шёл впереди них» — допустимая контекстуальная передача статического «был перед ними», не усиливающая текст до явного «вёл их».'
