base_translation:
  language: en
  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
translation:
  language: ru
  text: Когда он пришёл, то затрубил в рог в нагорье Ефрема. И сыны Израиля спустились с нагорья вместе с ним, а он шёл впереди них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  choice: Когда он пришёл
  rationale: Конструкция с инфинитивом обозначает временной переход; естественная русская формулировка сохраняет последовательность событий без буквального «и было».
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: затрубил в рог
  rationale: שׁוֹפָר — сигнальный духовой инструмент из рога; «рог» конкретнее общего «труба» и естественно звучит в данном военном контексте.
- source_word: בְּהַר אֶפְרָיִם
  choice: в нагорье Ефрема
  rationale: הַר в этом географическом сочетании обозначает гористую область, а не отдельную гору.
- source_word: וַיֵּרְדוּ עִמּוֹ בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля спустились с нагорья вместе с ним
  rationale: «Сыны Израиля» сохраняет форму коллективного обозначения בְנֵי יִשְׂרָאֵל; порядок слов по-русски ясно связывает עִמּוֹ с движением участников.
- source_word: מִן הָהָר
  choice: с нагорья
  rationale: Фраза отсылает к уже названному нагорью Ефрема и сохраняет собирательное географическое значение единственного числа.
- source_word: וְהוּא לִפְנֵיהֶם
  choice: а он шёл впереди них
  rationale: Буквально «он [был] перед ними»; в контексте движения естественное русское «шёл впереди них» выражает положение, не превращая его явно в утверждение о командовании.
theological_decisions:
- issue: Коллективное выражение בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Источник использует мужское множественное выражение, которое в данном повествовании, вероятно, относится к собравшемуся воинскому отряду. Формулировка сохранена без расширения или устранения гендерного оттенка.
- issue: Значение וְהוּא לִפְנֵיהֶם
  choice: а он шёл впереди них
  alternative: а он вёл их
  rationale: Текст непосредственно указывает на положение Аода впереди людей; лидерство подразумевается контекстом, но не выражено отдельным глаголом, поэтому более сильное «вёл их» не выбрано.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Короткие предложения устраняют тяжеловесную цепочку союзов, сохраняя последовательность еврейского повествования.
