base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
translation:
  language: ru
  text: Тогда сыны Израиля[a] воззвали к Яхве, и Яхве воздвиг сынам Израиля избавителя[b] — Отниила, сына Кеназа, младшего брата Халева[c], — и он избавил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «спасителя» или «освободителя». Здесь имеется в виду человек, которого Бог поставил избавить Израиль от угнетения.'
    reason: lexical_alternative
  - marker: c
    text: Еврейская конструкция обычно понимается в том смысле, что Отниил был братом Халева и младше его. Возможен и иной синтаксический разбор, при котором «младший» относится к Халеву; точный смысл конструкции спорен.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: воззвали
  rationale: Глагол זעק обозначает настойчивый крик о помощи; «воззвали к Яхве» естественно для возвышенного повествовательного регистра и передаёт обращение к Богу в бедствии.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет буквальный семейно-родовой образ еврейского выражения; более обычный вариант «израильтяне» указан в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом «Господь».
- source_word: וַיָּקֶם
  choice: воздвиг
  rationale: Каузативная форма קום здесь означает, что Яхве поставил или выдвинул человека для определённого служения; «воздвиг» сохраняет библейский образ и понятно современному читателю.
- source_word: מוֹשִׁיעַ
  choice: избавителя
  rationale: В контексте книги Судей это человек, через которого Израиль получает освобождение от угнетателя. «Избавитель» сохраняет связь с последующим глаголом и не вносит лишней конфессиональной окраски.
- source_word: וַיּוֹשִׁיעֵם
  choice: и тот избавил их
  rationale: Глагол ישׁע обозначает реальное спасение или освобождение. Местоимение «тот» естественно связывает действие с только что названным избавителем, а не с Яхве как ближайшим названным субъектом.
- source_word: אֵת עָתְנִיאֵל בֶּן קְנַז
  choice: Отниила, сына Кеназа
  rationale: Имя, поставленное после описания избавителя, поясняет, кем он был. Винительный падеж согласован с «избавителя».
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: младшего брата Халева
  rationale: 'Наиболее естественное понимание конструкции: Отниил был братом Халева и был младше него. Формулировка не утверждает, что он был самым младшим из всех братьев.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет это имя и не подменяет его титулом.
- issue: Значение מוֹשִׁיעַ применительно к человеку
  choice: избавитель
  alternative: спаситель; освободитель
  rationale: Здесь речь идёт о человеческом орудии избавления Израиля от политического и военного угнетения. «Избавитель» передаёт широкий смысл корня ישׁע, не отрицая, что в конечном счёте избавление дарует Яхве.
- issue: К кому относится определение הַקָּטֹן מִמֶּנּוּ
  choice: Отниил — младший брат Халева
  alternative: брат младшего Халева; иное синтаксическое членение
  rationale: Синтаксис естественнее всего указывает, что Отниил был младше Халева, однако форма выражения допускает трудность, поэтому альтернативность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Слова «воззвали» и «воздвиг» сохраняют торжественность повествования, оставаясь понятными. Повтор «сыны Израиля» сохранён в соответствии с исходным текстом; тире показывает, что имя Отниила поясняет, кто именно был избавителем.
