source:
  edition: WLC
  text: וַ/יָּחִ֣ילוּ עַד בּ֔וֹשׁ וְ/הְנֵּ֛ה אֵינֶ֥/נּוּ פֹתֵ֖חַ דַּלְת֣וֹת הָֽ/עֲלִיָּ֑ה וַ/יִּקְח֤וּ אֶת הַ/מַּפְתֵּ֨חַ֙ וַ/יִּפְתָּ֔חוּ וְ/הִנֵּה֙ אֲדֹ֣נֵי/הֶ֔ם נֹפֵ֥ל אַ֖רְצָ/ה מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
translation:
  language: ru
  text: Они ждали, пока им не стало неловко[a], и вот, он всё не открывал дверей верхней комнаты[b]. Тогда они взяли ключ и отперли двери, и вот, их господин[c] лежал на полу мёртвый.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока им не стало стыдно». Еврейский оборот может обозначать стыд или неловкость; здесь, вероятно, имеется в виду неловкость слуг из-за затянувшегося ожидания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «верхней горницы», «комнаты на верхнем этаже».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «хозяин». Здесь имеется в виду их человеческий повелитель, Эглон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחִילוּ
  choice: они ждали
  rationale: В контексте слуги продолжают ожидать у запертых дверей; «ждали» естественно передаёт длительность действия.
- source_word: עַד בּוֹשׁ
  choice: до тех пор, пока им не стало неловко
  rationale: Оборот допускает значение стыда, но здесь прежде всего описывает нарастающую социальную неловкость из-за долгого ожидания.
- source_word: וְהִנֵּה
  choice: но; и увидели
  rationale: 'Два употребления частицы переданы разными естественными русскими средствами: первое отмечает неожиданное продолжение ожидания, второе — внезапно открывшуюся картину.'
- source_word: אֵינֶנּוּ פֹתֵחַ
  choice: он всё не открывал
  rationale: Конструкция описывает продолжающееся отсутствие ожидаемого действия; частица «всё» естественно выражает эту длительность, не добавляя нового события.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: дверей верхней комнаты
  rationale: Сохранено множественное число «двери» и обычное значение עֲלִיָּה — помещение верхнего этажа.
- source_word: הַמַּפְתֵּחַ
  choice: ключ
  rationale: Прямое и однозначное соответствие.
- source_word: וַיִּפְתָּחוּ
  choice: отперли двери
  rationale: В контексте взятого ключа «отперли» точнее и естественнее русского «открыли», при этом объект восстановлен из предыдущей фразы.
- source_word: אֲדֹנֵיהֶם
  choice: их господин
  rationale: Слово обозначает человеческого властителя и хозяина слуг, Эглона; строчная буква исключает смешение с божественным титулом.
- source_word: נֹפֵל אַרְצָה
  choice: лежит на полу
  rationale: Причастие описывает обнаруженное состояние упавшего тела; внутри комнаты направительное אַרְצָה естественно передаётся как нахождение на полу.
- source_word: מֵת
  choice: мёртвый
  rationale: Кратко и непосредственно обозначает состояние Эглона при обнаружении.
theological_decisions:
- issue: Значение אֲדֹנֵיהֶם
  choice: их господин
  alternative: их хозяин / их владыка
  rationale: Речь идёт о человеческом начальнике слуг, а не о Боге; сохранён оттенок высокого положения без богословского переосмысления.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Повтор еврейского וְהִנֵּה передан естественными русскими повествовательными средствами, без архаического «вот». Неоднозначность עַד בּוֹשׁ и עֲלִיָּה сохранена в сносках.
