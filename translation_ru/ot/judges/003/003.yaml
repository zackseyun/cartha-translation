  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
translation:
  language: ru
  text: пять правителей филистимлян, всех хананеев, сидонян и хиввеев, живших в горах Ливана от горы Баал-Хермон до Лево-Хамата[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до входа в Хамат». Еврейское выражение можно понимать и как название места Лево-Хамат, и описательно.'
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  choice: пять правителей филистимлян
  rationale: Конструктивная цепочка обозначает пять политических вождей филистимлян. «Правители» ясно передаёт функцию и не привносит феодального оттенка слова «владыки».
- source_word: כָל הַכְּנַעֲנִי
  choice: всех хананеев
  rationale: Единственное число этнонима употреблено собирательно; по-русски естественна форма множественного числа.
- source_word: הַצִּידֹנִי
  choice: сидонян
  rationale: Собирательный этноним передан обычным русским названием жителей Сидона во множественном числе.
- source_word: הַחִוִּי
  choice: хиввеев
  rationale: Собирательное единственное число передано традиционным русским этнонимом во множественном числе.
- source_word: יֹשֵׁב
  choice: живших
  rationale: Причастие согласовано с ближайшим этнонимом «хиввеев» и естественно передаёт постоянное проживание в рамках повествования.
- source_word: הַר הַלְּבָנוֹן
  choice: в горах Ливана
  rationale: Сочетание обозначает горную область Ливана, а не обязательно одну отдельную вершину; множественное число естественно и географически понятно по-русски.
- source_word: מֵהַר בַּעַל חֶרְמוֹן
  choice: от горы Баал-Ермон
  rationale: Географическое название транслитерировано; родовой термин «гора» сохранён.
- source_word: עַד לְבוֹא חֲמָת
  choice: до Лево-Хамата
  rationale: Выражение понято как известный библейский топоним; косвенный падеж оформлен по нормам русского языка, а возможное описательное понимание сохранено в примечании.
