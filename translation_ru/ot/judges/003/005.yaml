lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: И сыны Израиля
  rationale: Формальное родовое выражение בְּנֵי יִשְׂרָאֵל передано буквально и вместе с тем в понятной библейской форме; оно точнее сохраняет мужской род исходного текста, чем обобщённое «израильтяне».
- source_word: יָשְׁבוּ
  choice: жили
  rationale: Глагол ישׁב здесь обозначает продолжающееся проживание; «жили» естественно в современном русском и не вносит дополнительного оттенка первоначального заселения.
- source_word: בְּקֶרֶב
  choice: среди
  rationale: В сочетании с ישׁב выражение означает проживание внутри окружения названных народов; «среди» точно и естественно передаёт этот смысл.
- source_word: הַכְּנַעֲנִי; הַחִתִּי; הָאֱמֹרִי; הַפְּרִזִּי; הַחִוִּי; הַיְבוּסִי
  choice: хананеев, хеттов, амореев, ферезеев, евеев и иевусеев
  rationale: Единственное число еврейских этнонимов имеет собирательное значение; русские формы во множественном числе естественно обозначают соответствующие народы. Написание этнонимов следует устойчивой русской библейской традиции.
