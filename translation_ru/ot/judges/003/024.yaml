base_translation:
  language: en
  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
translation:
  language: ru
  text: 'Когда он вышел, его слуги пришли и увидели: вот, двери верхней комнаты заперты. Они сказали: «Должно быть, он справляет нужду[a] в прохладной внутренней комнате».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «покрывает свои ноги» — древнееврейский эвфемизм, означающий, что он справляет нужду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  choice: Когда он вышел
  rationale: Придаточное времени естественно передаёт связь ухода Аода с последующим приходом слуг, не меняя последовательности событий.
- source_word: עֲבָדָיו
  choice: его слуги
  rationale: В контексте царского дома речь идёт о людях, прислуживавших царю; «слуги» — ясное и нейтральное обозначение без необоснованного уточнения их правового положения.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: увидели, что
  rationale: Так естественно по-русски передаётся внезапно обнаруженное ими положение дел; отдельное «вот» здесь звучало бы менее естественно.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: двери верхней комнаты
  rationale: עֲלִיָּה обозначает верхнюю комнату или помещение верхнего этажа; выбран ясный архитектурный термин без излишней конкретизации.
- source_word: נְעֻלוֹת
  choice: заперты
  rationale: Форма от נעל указывает, что двери были заперты или задвинуты; «заперты» — точный современный эквивалент.
- source_word: אַךְ
  choice: Наверное
  rationale: В данном контексте частица вводит уверенное предположение слуг. «Наверное» естественно передаёт их вывод, не превращая его в установленный факт.
- source_word: מֵסִיךְ הוּא אֶת רַגְלָיו
  choice: он справляет нужду
  rationale: Буквально выражение означает «покрывает свои ноги» и служит эвфемизмом для отправления естественной нужды. Смысл передан в основном тексте, а буквальный образ сохранён в примечании.
- source_word: בַּחֲדַר הַמְּקֵרָה
  choice: в прохладной внутренней комнате
  rationale: Сочетание обозначает отдельное прохладное, вероятно уединённое помещение. Перевод сохраняет представление о прохладе и пространственной обособленности комнаты.
