base_translation:
  language: en
  yaml_path: translation/ot/judges/003/004.yaml
  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
translation:
  language: ru
  text: Они оставались там, чтобы через них испытывать Израиль[a] и узнать, будут ли израильтяне слушаться[b] заповедей Яхве, которые Он заповедал их отцам[c] через Моисея.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы испытывать ими Израиль». Речь идёт о народах, оставленных в земле как средстве испытания.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово означает здесь не только «слушать», но и внимать, исполняя услышанное.
    reason: lexical_alternative
  - marker: c
    text: То есть их праотцам, предкам.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Они оставались там
  rationale: Форма היה продолжает мысль предыдущего контекста о народах, оставленных в земле; «оставались там» естественно передаёт их продолжающееся присутствие.
- source_word: לְנַסּוֹת בָּם אֶת־יִשְׂרָאֵל
  choice: чтобы через них испытывать Израиль
  rationale: 'Сохраняется прямо выраженное в еврейском тексте инструментальное בָּם: оставленные народы служили средством испытания Израиля.'
- source_word: לָדַעַת
  choice: и узнать
  rationale: Передаёт целевое значение инфинитива и буквальный смысл ידע, не устраняя присущего тексту богословского напряжения.
- source_word: הֲיִשְׁמְעוּ
  choice: будут ли израильтяне слушаться
  rationale: В сочетании с заповедями שׁמע означает не просто слышать, а внимать и повиноваться; добавление «израильтяне» устраняет неясность русского местоимения.
- source_word: מִצְוֺת
  choice: заповедей
  rationale: Обычное и точное русское обозначение данных Богом обязательных повелений.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя транслитерацией, а не заменяет его титулом.
- source_word: אֲשֶׁר צִוָּה
  choice: которые Он дал
  rationale: По-русски заповеди естественно «дают»; смысл глагола צוה — повелеть, заповедать — сохраняется самим существительным «заповеди».
- source_word: אֲבוֹתָם
  choice: их отцам
  rationale: Сохраняется явно мужская форма еврейского текста; в данном контексте речь идёт о праотцах Израиля.
- source_word: בְּיַד מֹשֶׁה
  choice: через Моисея
  rationale: Еврейская идиома «рукой Моисея» обозначает посредничество; современное русское выражение ясно передаёт эту функцию.
theological_decisions:
- issue: Смысл испытания
  choice: Оставленные народы представлены как средство испытания послушания Израиля завету.
  alternative: Понимать происходящее лишь как историческое наблюдение без выраженной богословской цели.
  rationale: Инфинитивы לְנַסּוֹת и לָדַעַת явно выражают цель; перевод не отождествляет испытание с побуждением ко злу и не объясняет, каким образом Бог узнаёт результат.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя в основном тексте и соответствует источнику.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан естественным для обычного читателя; инструментальное значение «через них» и целевая конструкция исходного текста сохранены.
