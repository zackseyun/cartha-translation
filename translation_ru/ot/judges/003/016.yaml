source:
  edition: WLC
  text: וַ/יַּעַשׂ֩ ל֨/וֹ אֵה֜וּד חֶ֗רֶב וְ/לָ֛/הּ שְׁנֵ֥י פֵי֖וֹת גֹּ֣מֶד אָרְכָּ֑/הּ וַ/יַּחְגֹּ֤ר אוֹתָ/הּ֙ מִ/תַּ֣חַת לְ/מַדָּ֔י/ו עַ֖ל יֶ֥רֶךְ יְמִינֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/016.yaml
  text: Ehud made himself a sword with two edges[a], a cubit in length[b], and strapped it on under his clothes on his right thigh.
translation:
  language: ru
  text: Эхуд сделал себе обоюдоострый меч длиной примерно в локоть[a] и закрепил его под одеждой на правом бедре.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «гомед» обозначает редкую меру длины, точная величина которой неизвестна; обычно её считают приблизительно равной локтю, то есть длине предплечья.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ
  choice: сделал себе
  rationale: Сочетание עשה с לוֹ указывает, что Эхуд изготовил оружие для собственного пользования; русское «сделал себе» естественно передаёт это значение.
- source_word: חֶרֶב
  choice: меч
  rationale: חֶרֶב — обычное обозначение меча. Хотя указанная длина допускает представление о коротком клинке, перевод «кинжал» неоправданно сужал бы значение исходного слова.
- source_word: וְלָהּ שְׁנֵי פֵיוֹת
  choice: обоюдоострый
  rationale: Буквально сказано, что у меча «два острия/лезвия» (дословно «два рта»); «обоюдоострый» естественно и точно обозначает клинок, заточенный с двух сторон.
- source_word: גֹּמֶד אָרְכָּהּ
  choice: длиной примерно в локоть
  rationale: גֹּמֶד — редкая и точно не установленная мера длины, вероятно связанная с длиной предплечья. «Примерно в локоть» даёт понятный ориентир, а примечание сохраняет лексическую неопределённость.
- source_word: וַיַּחְגֹּר אוֹתָהּ
  choice: закрепил его
  rationale: חגר означает опоясывать или прикреплять к телу носимое оружие. «Закрепил» звучит естественно по-русски и не добавляет отсутствующего в тексте способа крепления.
- source_word: מִתַּחַת לְמַדָּיו
  choice: под одеждой
  rationale: מַד обозначает одежду или одеяние; обобщённое «под одеждой» не уточняет без основания её вид.
- source_word: עַל יֶרֶךְ יְמִינוֹ
  choice: на правом бедре
  rationale: יָרֵךְ обозначает бедро или прилегающую область; «на правом бедре» прямо передаёт место, где было закреплено оружие.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование передано кратко и конкретно. Редкая мера не транслитерирована в основном тексте, чтобы стих оставался понятным, но её неопределённость отмечена словом «примерно» и пояснена в сноске.
