base_translation:
  language: en
  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
translation:
  language: ru
  text: Они брали их дочерей себе в жёны и отдавали своих дочерей их сыновьям, и служили их богам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поклонялись их богам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: брали
  rationale: Глагол לקח буквально означает «брать» и в сочетании «в жёны» ясно передаёт заключение брака, сохраняя образ исходного текста.
- source_word: בְּנוֹתֵיהֶם
  choice: их дочерей
  rationale: Суффикс относится к окружающим народам, названным в контексте; местоимение сохраняет контекстуальную связь.
- source_word: לָהֶם לְנָשִׁים
  choice: себе в жёны
  rationale: Естественная русская конструкция передаёт и значение выгоды «себе», и брачное значение «в жёны».
- source_word: וְאֶת־בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם
  choice: и отдавали своих дочерей их сыновьям
  rationale: Первый суффикс здесь относится к израильтянам, а второй — к окружающим народам. «Своих» и «их» естественно обозначают смену референта и предотвращают двусмысленность, присутствующую в русском «их… их».
- source_word: וַיַּעַבְדוּ
  choice: и служили
  rationale: עבד применительно к богам включает религиозное служение и поклонение; «служили» сохраняет широкий смысл верности и подчинения.
- source_word: אֱלֹהֵיהֶם
  choice: их богам
  rationale: Форма указывает на богов окружающих народов; это прямо и естественно передаётся как «их богам».
theological_decisions:
- issue: Значение עבד применительно к языческим богам
  choice: служили их богам
  alternative: поклонялись их богам
  rationale: «Служили» сохраняет более широкую идею религиозной преданности и подчинения, не сводя значение лишь к культовым действиям; «поклонялись» является допустимым контекстуальным вариантом.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Видовая форма «брали… отдавали… служили» естественно передаёт последовательность и устойчивый характер действий. Местоимения уточнены по контексту: дочери народов — израильтянам, дочери израильтян — сыновьям народов.'
