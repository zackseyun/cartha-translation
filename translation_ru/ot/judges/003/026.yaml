lexical_decisions:
- source_word: נִמְלַט / וַיִּמָּלֵט
  choice: скрылся / убежал
  rationale: Обе формы глагола מלט передают успешное бегство из опасности. Разные, но близкие по смыслу русские глаголы позволяют естественно передать повтор, не создавая тяжеловесности.
- source_word: עַד הִתְמַהְמְהָם
  choice: пока они медлили
  rationale: Оборот обозначает время, в течение которого Аод успел скрыться; порода хитпаэль глагола מהה выражает промедление или задержку.
- source_word: עָבַר אֶת הַפְּסִילִים
  choice: миновал изваяния
  rationale: Глагол עבר в контексте пути означает движение мимо ориентира, а פְּסִילִים — вырезанные или высеченные изображения.
- source_word: הַשְּׂעִירָתָה
  choice: в Сеиру
  rationale: Конечное направительное ה указывает на движение к месту, название которого передано русской транслитерацией.
- source_word: וְ
  choice: же
  rationale: Частица естественно выражает контраст между промедлением слуг в предыдущем эпизоде и успешным бегством Аода.
