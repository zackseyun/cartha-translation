translation_notes:
  register: Современный литературный русский язык; краткая, динамичная повествовательная фраза. Сохранены последовательность действий и акцент на левой руке Аода. Слово «царя» употреблено вместо двусмысленного русского «его», которое могло бы ошибочно отсылать к мечу или самому Аоду.
