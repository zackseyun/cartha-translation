lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: протянул
  rationale: 'В сочетании с «рукой» глагол описывает физическое движение: Аод протянул руку к оружию.'
- source_word: יַד שְׂמֹאלוֹ
  choice: левую руку
  rationale: В еврейском тексте прямо названа рука; это сохраняет важный для повествования акцент на леворукости Аода.
- source_word: וַיִּקַּח
  choice: взял
  rationale: Нейтральное и точное обозначение следующего действия; контекст не требует более сильного «схватил».
- source_word: הַחֶרֶב
  choice: меч
  rationale: Это обычное еврейское слово для меча. Хотя из контекста видно, что оружие было коротким, перевод «кинжал» был бы неоправданным сужением значения.
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  choice: с правого бедра
  rationale: Передаёт конкретное место, где было закреплено оружие, и естественно звучит по-русски.
- source_word: וַיִּתְקָעֶהָ
  choice: вонзил его
  rationale: Глагол обозначает сильное направленное движение оружия внутрь; «вонзил» точно и естественно передаёт действие.
- source_word: בְּבִטְנוֹ
  choice: в живот царя
  rationale: Слово обозначает живот или брюшную область. Добавление «царя» естественно проясняет в русском местоименную отсылку к Еглону из контекста, не меняя смысла.
