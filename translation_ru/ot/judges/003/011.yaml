  yaml_path: translation/ot/judges/003/011.yaml
  text: So the land had rest for forty years. Then Othniel son of Kenaz died.
translation:
  language: ru
  text: И покоилась земля сорок лет. Затем умер Гофониил, сын Кеназа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: покоилась
  rationale: Глагол שׁקט означает пребывание в покое, тишине, без тревог. В контексте книги Судей он описывает мирный период после избавления, не добавляя идеи полного благоденствия.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Здесь אֶרֶץ обозначает землю Израиля, а не весь мир; «земля» естественно сохраняет контекстуальный и библейский смысл.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Сочетание выражает длительность состояния; в русском языке она ясно передаётся без дополнительного предлога.
- source_word: וַיָּמָת
  choice: затем умер
  rationale: Глагол сообщает о смерти, а повествовательный waw продвигает рассказ; «затем» естественно обозначает последовательность, не утверждая большей точности хронологической связи, чем допускает контекст.
- source_word: עָתְנִיאֵל
  choice: Гофониил
  rationale: Использована устоявшаяся русская библейская форма имени, понятная читателям и соответствующая современной русской традиции передачи библейских имён.
- source_word: בֶּן קְנַז
  choice: сын Кеназа
  rationale: Конструкция указывает на родство; «сын Кеназа» прямо и естественно передаёт её смысл.
