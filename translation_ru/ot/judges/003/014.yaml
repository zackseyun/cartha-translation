lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: служили
  rationale: Глагол עבד здесь обозначает политическое подчинение и службу чужеземному правителю, а не поклонение. «Служили» сохраняет образ и формальную близость к еврейскому тексту; более истолковательное значение вынесено в сноску.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Передаёт еврейское собирательное выражение достаточно близко и соответствует возвышенному, но понятному библейскому регистру русского языка.
- source_word: אֶת עֶגְלוֹן
  choice: Эглону
  rationale: Показатель прямого дополнения אֶת отдельно не переводится; русское управление глагола «служить» требует дательного падежа имени Эглон.
- source_word: מֶלֶךְ מוֹאָב
  choice: царю Моава
  rationale: Сочетание передано естественной русской аппозицией и согласовано в дательном падеже с именем «Эглону».
- source_word: שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: восемнадцать лет
  rationale: Еврейский винительный длительности естественно передаётся по-русски сочетанием без предлога.
