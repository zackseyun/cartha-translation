  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
translation:
  language: ru
  text: 'Тогда они сказали ему: «Скажи, пожалуйста: “Шибболет”[a]». Но он сказал: «Сибболет», потому что не мог произнести это так. Тогда они схватили его и закололи у переправ через Иордан. В то время пало сорок две тысячи ефремлян.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово «шибболет», вероятно, означает «колос» либо «поток»; здесь оно служит словом для проверки произношения.
    reason: lexical_alternative
