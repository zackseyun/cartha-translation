- source_word: אֱמָר נָא
  choice: Скажи, пожалуйста
  rationale: Повелительная форма с частицей נָא выражает просьбу; перевод сохраняет её естественный для современного русского языка оттенок.
- source_word: שִׁבֹּלֶת
  choice: Шибболет
  rationale: Здесь слово служит проверкой произношения, поэтому транслитерация важнее передачи его словарного значения.
- source_word: סִבֹּלֶת
  choice: Сибболет
  rationale: Транслитерация сохраняет ключевое для рассказа различие начальных звуков «ш» и «с».
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  choice: потому что не мог произнести это так
  rationale: Буквально оборот говорит о неспособности направить или подготовить себя говорить таким образом; контекст ясно указывает на произношение, а формулировка не вводит оценочного «правильно».
- source_word: וַיֹּאחֲזוּ אוֹתוֹ
  choice: они хватали его
  rationale: Глагол אחז означает схватить или удержать; несовершенный вид естественно передаёт повторявшуюся процедуру проверки и казни.
- source_word: וַיִּשְׁחָטוּהוּ
  choice: закалывали
  rationale: שׁחט обозначает заклание и сильнее общего «убивали»; «закалывали» сохраняет конкретность и жестокость действия без разговорности.
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  choice: у переправ через Иордан
  rationale: מַעְבְּרוֹת — места перехода через реку; «переправы через Иордан» точно и естественно передают смысл.
- source_word: וַיִּפֹּל ... מֵאֶפְרַיִם
  choice: пало ... ефремлян
  rationale: В военном контексте נפל означает погибнуть, а מֵאֶפְרַיִם указывает на людей из колена Ефрема.
- source_word: אַרְבָּעִים וּשְׁנַיִם אָלֶף
  choice: сорок две тысячи
  rationale: Число передано непосредственно и без изменения.
