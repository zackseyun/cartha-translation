base_translation:
  language: en
  yaml_path: translation/ot/judges/012/015.yaml
  text: And Abdon son of Hillel the Pirathonite died[a], and he was buried in Pirathon, in the land of Ephraim, in the hill country of the Amalekites.
translation:
  language: ru
  text: Авдон, сын Гиллела, пиреафонянин, умер и был похоронен в Пиреафоне, в земле Ефрема, в горной области амаликитян.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более буквально: «на горе амаликитянина». Еврейское слово «амаликитянин» стоит в единственном числе, но, вероятно, употреблено в собирательном или территориальном значении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Прямо и без эвфемизма передаёт обычное значение глагола מות.
- source_word: עַבְדּוֹן
  choice: Авдон
  rationale: Традиционная и узнаваемая русская передача библейского личного имени.
- source_word: בֶּן הִלֵּל
  choice: сын Гиллела
  rationale: Естественно передаёт конструкцию родства; имя הִלֵּל транслитерировано как «Гиллел».
- source_word: הַפִּרְעָתוֹנִי
  choice: пиреафонянин
  rationale: Русское обозначение жителя или уроженца Пиреафона сохраняет значение еврейского нисбе.
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Передаёт пассивное значение нифаля глагола קבר и естественно соединяется с предыдущим сказуемым.
- source_word: בְּפִרְעָתוֹן
  choice: в Пиреафоне
  rationale: Предлог передан локативно, а топоним — в традиционной русской форме.
- source_word: בְּאֶרֶץ אֶפְרַיִם
  choice: в земле Ефремовой
  rationale: Сохраняет явно выраженное אֶרֶץ и использует понятную, укоренённую в русском библейском стиле географическую формулу.
- source_word: בְּהַר הָעֲמָלֵקִי
  choice: в горной области амаликитян
  rationale: הַר в региональном описании может обозначать гористую местность, а единственное gentilic הָעֲמָלֵקִי, вероятно, имеет собирательное или территориальное значение.
