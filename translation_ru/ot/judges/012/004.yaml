  text: וַ/יִּקְבֹּ֤ץ יִפְתָּח֙ אֶת כָּל אַנְשֵׁ֣י גִלְעָ֔ד וַ/יִּלָּ֖חֶם אֶת אֶפְרָ֑יִם וַ/יַּכּוּ֩ אַנְשֵׁ֨י גִלְעָ֜ד אֶת אֶפְרַ֗יִם כִּ֤י אָמְרוּ֙ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אַתֶּ֔ם גִּלְעָ֕ד בְּ/ת֥וֹךְ אֶפְרַ֖יִם בְּ/ת֥וֹךְ מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: ru
  text: 'Тогда Иеффай собрал всех мужчин Галаада и вступил в бой с Ефремом. И мужчины Галаада разбили ефремлян, потому что те сказали: «Вы, галаадитяне, — беглецы Ефрема среди Ефрема и среди Манассии».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительное обвинение в еврейском тексте синтаксически трудно. Возможен перевод: «Вы — беглецы Ефрема, о Галаад, среди Ефрема и среди Манассии».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: собрал
  rationale: Глагол קבץ означает «собирать, созывать». В военном контексте «собрал» естественно передаёт мобилизацию, не добавляя идеи формального призыва.
- source_word: כָּל אַנְשֵׁי גִלְעָד
  choice: всех мужчин Галаада
  rationale: Сохраняется буквальное обозначение «мужчины Галаада»; из контекста ясно, что речь идёт о способных участвовать в сражении.
- source_word: וַיִּלָּחֶם אֶת אֶפְרָיִם
  choice: вступил в бой с Ефремом
  rationale: Нифаль глагола לחם обозначает ведение боя. Эта формулировка естественна по-русски и сохраняет коллективное употребление имени Ефрем.
- source_word: וַיַּכּוּ ... אֶת אֶפְרַיִם
  choice: разбили ефремлян
  rationale: נכה в военном контексте может означать нанесение поражения. «Разбили» передаёт результативное насилие, но не утверждает, что все противники были убиты.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит указанную в тексте причину столкновения; «потому что» ясно выражает эту связь в современном русском языке.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: беглецы Ефрема
  rationale: Существительное פָּלִיט обозначает спасшегося бегством или беглеца. Выбор сохраняет оскорбительную силу выражения и не сглаживает трудный синтаксис.
- source_word: אַתֶּם גִּלְעָד
  choice: вы, галаадитяне
  rationale: Название области метонимически обозначает её жителей; русский этноним естественно передаёт прямое коллективное обращение.
- source_word: בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה
  choice: среди Ефрема и среди Манассии
  rationale: בְּתוֹךְ значит «посреди, среди». Повтор предлога сохранён, поскольку он присутствует в еврейском тексте; вариант «между» был бы более истолковательным.
theological_decisions:
- issue: Синтаксически трудное оскорбление в заключительной части стиха
  choice: «Вы, галаадитяне, — беглецы Ефрема среди Ефрема и среди Манассии»
  alternative: «Вы — беглецы Ефрема, о Галаад, среди Ефрема и среди Манассии»
  rationale: Еврейская фраза сжата и допускает разные способы синтаксического членения. Основной текст сохраняет прямую речь, значение פְּלִיטֵי и повтор בְּתוֹךְ, не превращая неясную насмешку в однозначное историко-географическое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Коллективные названия «Ефрем» и «Манассия» сохранены там, где они обозначают племена; в позиции прямого объекта после глагола «разбили» употреблено естественное русское «ефремлян». Неясность финальной насмешки обозначена сноской.
