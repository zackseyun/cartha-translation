  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
translation:
  language: ru
  text: Затем Елон, завулонянин, умер и был похоронен в Аиалоне, в земле Завулона[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на территории Завулона».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Затем ... умер
  rationale: Последовательная форма wayyiqtol обозначает очередное событие повествования; «затем» естественно передаёт развитие рассказа.
- source_word: אֵלוֹן
  choice: Елон
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: הַזְּבוּלֹנִי
  choice: завулонянин
  rationale: Гентилик с артиклем указывает на принадлежность Елона к колену или области Завулона; краткое существительное естественно для русского библейского повествования.
- source_word: וַיִּקָּבֵר
  choice: и был похоронен
  rationale: Нифаль глагола קבר имеет пассивное значение «быть похороненным»; подлежащее ясно из контекста.
- source_word: בְּאַיָּלוֹן
  choice: в Аиалоне
  rationale: Предлог בְּ обозначает место погребения, а топоним передан принятой русской библейской транслитерацией.
- source_word: בְּאֶרֶץ זְבוּלֻן
  choice: в земле Завулона
  rationale: אֶרֶץ может означать как землю, так и территорию; основной вариант формально близок еврейскому тексту и естественен в географическом сообщении.
