lexical_decisions:
- source_word: וַיָּמָת
  choice: Затем … умер
  rationale: Форма с последовательным וַ продвигает повествование; «затем» естественно передаёт последовательность событий, а מוּת означает «умереть».
- source_word: אִבְצָן
  choice: Ивцан
  rationale: Имя передано в принятой русской библейской форме, соответствующей еврейскому אִבְצָן.
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Нифаль от קבר здесь выражает пассивное значение; это ясный и естественный русский эквивалент.
- source_word: בְּבֵית לָחֶם
  choice: в Вифлееме
  rationale: Предлог בְּ обозначает место, а название города передано в принятой русской форме «Вифлеем».
