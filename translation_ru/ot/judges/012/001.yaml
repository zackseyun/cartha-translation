base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
translation:
  language: ru
  text: 'Тогда ефремляне собрались и переправились к Цафону[a]. Они сказали Иеффаю: «Почему ты переправился воевать с аммонитянами, а нас не позвал пойти с тобой? Мы сожжём твой дом вместе с тобой[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на север», если צָפוֹנָה понимать как наречие направления, а не как название места Цафон.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «Мы сожжём твой дом над тобой огнём»; вероятный смысл — сжечь дом, когда Иеффай будет внутри.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  choice: ефремляне собрались
  rationale: Форма אִישׁ морфологически единственного числа, но обозначает коллектив; последующий глагол וַיֹּאמְרוּ во множественном числе подтверждает, что речь идёт о группе ефремлян. Глагол צעק в данной форме и контексте передаёт созыв или сбор воинов.
- source_word: וַיַּעֲבֹר
  choice: переправились
  rationale: Хотя еврейская форма стоит в единственном числе при собирательном подлежащем, по-русски естественно согласование по смыслу во множественном числе. «Переправились» сохраняет значение перехода через преграду или границу.
- source_word: צָפוֹנָה
  choice: к Цафону
  rationale: Слово принято как топоним Цафон с направительным окончанием; возможное наречное понимание «на север» сохранено в сноске.
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: воевать с аммонитянами
  rationale: «Аммонитяне» — естественное русское обозначение «сынов Аммона», а «воевать с» ясно передаёт военный контекст.
- source_word: וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ
  choice: а нас не позвал пойти с тобой
  rationale: קרא здесь означает призвать к участию в походе. Формулировка сохраняет явный инфинитив «пойти» и звучит естественно по-русски.
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  choice: Мы сожжём твой дом вместе с тобой
  rationale: Оборот עָלֶיךָ буквально рисует дом, сжигаемый над Иеффаем, то есть, вероятнее всего, с ним внутри. Русская формулировка естественно передаёт угрозу, а буквальный образ пояснён в сноске.
