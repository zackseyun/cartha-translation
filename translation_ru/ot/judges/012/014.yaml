  text: וַ/יְהִי ל֞/וֹ אַרְבָּעִ֣ים בָּנִ֗ים וּ/שְׁלֹשִׁים֙ בְּנֵ֣י בָנִ֔ים רֹכְבִ֖ים עַל שִׁבְעִ֣ים עֲיָרִ֑ם וַ/יִּשְׁפֹּ֥ט אֶת יִשְׂרָאֵ֖ל שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/014.yaml
  text: He had forty sons and thirty grandsons, riding on seventy donkeys, and he judged Israel eight years.
translation:
  language: ru
  text: У него было сорок сыновей и тридцать внуков, ездивших на семидесяти ослах. Он судил Израиль восемь лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי בָנִים
  choice: внуков
  rationale: Буквально «сыновья сыновей»; современное русское «внуки» точно и естественно передаёт родственную связь.
- source_word: רֹכְבִים עַל שִׁבְעִים עֲיָרִם
  choice: ездивших на семидесяти ослах
  rationale: Причастный оборот сохраняет связь с сыновьями и внуками как совокупной группой и не уточняет распределение животных сверх сказанного в еврейском тексте.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: Он судил Израиль
  rationale: Сохраняется ключевой глагол книги «судить», включающий деятельность судьи-правителя и избавителя без сужающего пояснения.
theological_decisions:
- issue: Смысл глагола שפט применительно к судье Израиля
  choice: судил Израиль
  alternative: правил Израилем
  rationale: Формальное соответствие сохраняет тематическую лексику Книги Судей и не сводит роль Авдона лишь к политическому управлению.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза. Длинное еврейское предложение разделено на два для естественности и ясности.
