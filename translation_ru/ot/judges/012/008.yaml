translation:
  language: ru
  text: После него Израиль судил Ивцан из Вифлеема.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Ивцан Вифлеемский». Еврейский предлог может указывать как на происхождение, так и на связь с местом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: судил
  rationale: Глагол שׁפט в книге Судей регулярно обозначает деятельность судьи, который правил Израилем. «Судил» сохраняет ключевую для книги терминологию и не сужает смысл до простого управления или руководства.
- source_word: אַחֲרָיו
  choice: После него
  rationale: Предлог с местоименным суффиксом указывает на преемственность по отношению к предыдущему судье. Местоимение сохраняет формулировку еврейского текста; его отсылка ясна из контекста.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Показатель прямого дополнения отдельно не переводится; Израиль выступает объектом деятельности Ивцана как судьи.
- source_word: אִבְצָן
  choice: Ивцан
  rationale: Имя передано в традиционной русской библейской форме, близкой к еврейскому звучанию.
- source_word: מִבֵּית לָחֶם
  choice: из Вифлеема
  rationale: Предлог מִן здесь естественно указывает на происхождение или принадлежность к месту. Русское «из Вифлеема» ясно и идиоматично передаёт наиболее вероятный смысл.
