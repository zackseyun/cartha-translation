  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ אֲלֵי/הֶ֔ם אִ֣ישׁ רִ֗יב הָיִ֛יתִי אֲנִ֛י וְ/עַמִּ֥/י וּ/בְנֵֽי עַמּ֖וֹן מְאֹ֑ד וָ/אֶזְעַ֣ק אֶתְ/כֶ֔ם וְ/לֹֽא הוֹשַׁעְתֶּ֥ם אוֹתִ֖/י מִ/יָּדָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/002.yaml
  text: Jephthah said to them[a], “I and my people were in a bitter conflict with the Ammonites, and I called out to you, but you did not save me from their hand.”
translation:
  language: ru
  text: 'Иеффай сказал им: «У меня и у моего народа была тяжёлая распря с аммонитянами[a]. Я звал вас на помощь, но вы не спасли меня от их руки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Я был человеком распри — я и мой народ — с сынами Аммона, весьма».'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ רִיב הָיִיתִי אֲנִי וְעַמִּי ... מְאֹד
  choice: у меня и у моего народа была тяжёлая распря
  rationale: Буквальное «я был человеком распри» в сочетании с היה здесь описывает положение Иеффая и его народа, а не обязательно его характер. «Тяжёлая распря» естественно передаёт רִיב и усиление מְאֹד, не устраняя оттенок спора/противостояния.
- source_word: וְעַמִּי
  choice: у моего народа
  rationale: עַם означает «народ»; контекст не даёт оснований сужать значение до войска или родственников.
- source_word: וּבְנֵי עַמּוֹן
  choice: с аммонитянами
  rationale: Нормальное русское обозначение народа, буквально названного «сынами Аммона».
- source_word: וָאֶזְעַק אֶתְכֶם
  choice: я звал вас на помощь
  rationale: זעק обозначает настойчивый зов, обычно о помощи. Добавление «на помощь» естественно выражает подразумеваемую цель обращения в данном военном контексте.
- source_word: וְלֹא הוֹשַׁעְתֶּם אוֹתִי
  choice: но вы не спасли меня
  rationale: Каузативная форма ישׁע означает «спасти, избавить»; «спасли» прямо и ясно передаёт смысл.
- source_word: מִיָּדָם
  choice: от их руки
  rationale: Сохранён еврейский образ руки как власти или силы; в библейском русском он понятен и не требует замены толкованием.
