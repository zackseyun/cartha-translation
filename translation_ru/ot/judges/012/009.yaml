  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
translation:
  language: ru
  text: У него было тридцать сыновей и тридцать дочерей. Тридцать дочерей он выдал замуж за пределы своего дома[a], а для своих сыновей привёл извне тридцать девушек. Он судил Израиль семь лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тридцать дочерей отослал наружу, а тридцать дочерей привёл извне для своих сыновей». Вероятно, речь идёт о браках; еврейский текст в обоих случаях буквально говорит «дочерей».'
    reason: Основной текст естественно передаёт подразумеваемый брачный контекст, а сноска сохраняет буквальную лексику и не уточняет, что именно обозначает «вовне/извне».
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: У него было
  rationale: Обычная русская передача древнееврейской конструкции обладания היה + ל.
- source_word: שְׁלֹשִׁים בָּנִים וּשְׁלֹשִׁים בָּנוֹת
  choice: тридцать сыновей и тридцать дочерей
  rationale: Прямая и естественная передача числительных и родственных терминов.
- source_word: שִׁלַּח הַחוּצָה
  choice: выдал замуж на сторону
  rationale: Буквально сказано «отослал наружу», но параллельное приведение девушек для сыновей ясно указывает на брачные связи за пределами собственного дома или рода. Русское выражение передаёт этот смысл естественно; буквальность отмечена в сноске.
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  choice: а для своих сыновей привёл тридцать девушек со стороны
  rationale: Второе בָּנוֹת буквально означает «дочерей», но здесь речь о девушках, приведённых как жёны сыновьям. «Со стороны» сохраняет неопределённость выражения מִן הַחוּץ и не уточняет, был ли это иной род, дом или местность.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: Он был судьёй Израиля
  rationale: Сохраняется ключевой для книги термин «судья», при этом русская конструкция естественно описывает исполнение этой роли в течение указанного срока.
- source_word: שֶׁבַע שָׁנִים
  choice: семь лет
  rationale: Стандартное обозначение продолжительности времени.
