lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: был судьёй
  rationale: Глагол שׁפט в книге Судей обозначает служение судьи — вождя и избавителя Израиля. Такой перевод сохраняет повторяющуюся терминологию книги и не сводит роль Иеффая только к судебной деятельности.
- source_word: שֵׁשׁ שָׁנִים
  choice: шесть лет
  rationale: Прямое обозначение продолжительности, переданное буквально и естественно.
- source_word: הַגִּלְעָדִי
  choice: галаадитянин
  rationale: Форма указывает на происхождение или региональную принадлежность Иеффая; «галаадитянин» — краткий и традиционно понятный русский эквивалент.
- source_word: וַיִּקָּבֵר
  choice: был похоронен
  rationale: Страдательная конструкция соответствует форме еврейского глагола и обычной формуле сообщения о погребении.
- source_word: בְּעָרֵי גִלְעָד
  choice: в городах Галаада
  rationale: Перевод сохраняет грамматическое множественное число еврейского текста, не подменяя его предположительным «в одном из городов»; возможное идиоматическое значение разъяснено в сноске.
