lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: судил
  rationale: В книге Судей этот глагол обозначает деятельность судей Израиля. «Судил» сохраняет сквозную терминологию книги и не сводит роль Елона только к военному или административному руководству.
- source_word: אַחֲרָיו
  choice: После него
  rationale: Местоименная форма отсылает к предыдущему судье, не называя его в самом стихе.
- source_word: אֵילוֹן
  choice: Елон
  rationale: Имя передано в соответствии с укоренившейся русской библейской формой.
- source_word: הַזְּבוּלֹנִי
  choice: завулонянин
  rationale: Форма указывает на принадлежность Елона к племени Завулона; русское родовое обозначение точно и кратко передаёт еврейское прилагательное.
- source_word: עֶשֶׂר שָׁנִים
  choice: десять лет
  rationale: Естественная русская передача выражения длительности.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל ... וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: Израиль судил… Он судил Израиль
  rationale: 'Повтор глагола сохранён, поскольку он явно присутствует в еврейском тексте: сначала вводит Елона как судью, затем сообщает длительность его служения. Разделение на два предложения делает повтор естественнее по-русски.'
