lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: судил
  rationale: Глагол שׁפט — повторяющийся термин книги Судей; «судил» сохраняет эту связь и не сужает его значение до одного лишь управления или военного предводительства.
- source_word: אַחֲרָיו
  choice: После него
  rationale: Предлог с местоименным суффиксом указывает на преемство по отношению к предыдущему судье; прямой и естественный русский эквивалент.
- source_word: אֶת יִשְׂרָאֵל
  choice: Израиль
  rationale: Частица אֶת отмечает прямое дополнение и отдельно не переводится; «Израиль» здесь обозначает народ.
- source_word: עַבְדּוֹן
  choice: Авдон
  rationale: Традиционная и узнаваемая русская передача еврейского личного имени.
- source_word: בֶּן הִלֵּל
  choice: сын Гиллела
  rationale: Конструкция сопряжённого состояния прямо указывает на происхождение; форма естественна для современного русского языка.
- source_word: הַפִּרְעָתוֹנִי
  choice: пиръатонянин
  rationale: Еврейское относительное наименование обозначает жителя или уроженца Пиръатона; русская форма сохраняет этот способ выражения и принята в библейской топонимической традиции.
