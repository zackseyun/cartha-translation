base_translation:
  language: en
  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
translation:
  language: ru
  text: 'Галаадитяне захватили переправы через Иордан против ефремлян. И всякий раз, когда кто-нибудь из беглецов из Ефрема говорил: «Позвольте мне перейти», галаадитяне спрашивали его: «Ты ефремлянин?» Если он отвечал: «Нет»,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְכֹּד גִּלְעָד
  choice: Галаадитяне захватили
  rationale: Название Галаад здесь обозначает людей Галаада; глагол לכד в военном контексте передаёт установление контроля над стратегическими переправами.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: переправы через Иордан
  rationale: מַעְבְּרוֹת обозначает места перехода через реку, то есть броды или переправы; «переправы» естественно и ясно в современном русском языке.
- source_word: לְאֶפְרָיִם
  choice: чтобы преградить путь ефремлянам
  rationale: В контексте предлог ל выражает враждебную направленность или цель контроля над переправами. Развёрнутая передача проясняет смысл, не предполагая, будто переправы были захвачены «для» Ефрема.
- source_word: וְהָיָה כִּי
  choice: И когда
  rationale: Конструкция вводит повторявшуюся ситуацию; вместе с «кто-нибудь» и видовременной последовательностью русская формулировка передаёт обычный порядок действий.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: кто-нибудь из беглецов-ефремлян
  rationale: פָּלִיט — спасшийся бегством человек; сочетание передаёт как бегство после поражения, так и принадлежность к Ефрему.
- source_word: אֶעֱבֹרָה
  choice: Позвольте мне перейти
  rationale: Когортатив выражает просьбу или желание перейти реку.
- source_word: הַאֶפְרָתִי אַתָּה
  choice: Ты ефремлянин?
  rationale: Вопрос касается племенной принадлежности; «ефремлянин» — естественное русское обозначение представителя колена Ефрема.
- source_word: וַיֹּאמֶר לֹא
  choice: 'Если он отвечал: «Нет»'
  rationale: В повторяющейся процедуре повествовательная форма функционально вводит условие для следующего действия, описанного в последующем стихе.
