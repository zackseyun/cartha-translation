revisions:
- from: 'Галаадитяне захватили переправы через Иордан, чтобы преградить путь ефремлянам. И когда кто-нибудь из беглецов-ефремлян говорил: «Позвольте мне перейти», галаадитяне спрашивали его: «Ты ефремлянин?» Если он отвечал: «Нет»,'
  to: 'Галаадитяне захватили переправы через Иордан против ефремлян. И всякий раз, когда кто-нибудь из беглецов из Ефрема говорил: «Позвольте мне перейти», галаадитяне спрашивали его: «Ты ефремлянин?» Если он отвечал: «Нет»,'
  rationale: Правка устраняет излишне целевое «чтобы преградить путь», точнее передаёт повторяемость повествовательной конструкции и слегка сглаживает обозначение беглеца. Конечная запятая сохранена, поскольку условное предложение продолжается в следующем стихе.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T08:56:31Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: коллективный субъект «Галаад» естественно раскрыт как «галаадитяне»; מַעְבְּרוֹת — речные переправы; беглецы из Ефрема просят пропустить их, после чего их спрашивают о племенной принадлежности. Однако «чтобы преградить путь» превращает в явную целевую формулировку то, что в еврейском кратко выражено предлогом לְ в контексте враждебного противостояния. Более близкое «против ефремлян» сохраняет эту связь без дополнительного утверждения о намерении.'
  naturalness: Текст в целом современный и понятный. «Всякий раз, когда» яснее передаёт повторяющийся порядок действий, чем простое «когда». «Беглец из Ефрема» звучит естественнее, чем составное «беглец-ефремлянин», и не ослабляет племенную идентификацию.
  terminology: «Галаадитяне», «Иордан», «Ефрем» и «ефремлянин» употреблены последовательно и уместно. «Переправы через Иордан» — приемлемая более широкая передача еврейского слова, которое конкретно может обозначать броды. Сноска не обязательна, поскольку выбранное слово не исключает бродов.
  issues:
  - severity: low
    issue: Фраза «чтобы преградить путь ефремлянам» несколько эксплицирует синтаксически сжатое לְאֶפְרָיִם.
    rationale: Она добавляет выраженную цель («чтобы»), тогда как исходный текст и английская контрольная версия обозначают враждебную направленность действий. «Против ефремлян» ближе к форме и сохраняет смысл.
  - severity: low
    issue: Повторяемость ситуации передана не вполне явно.
    rationale: Конструкция וְהָיָה כִּי вводит обычную, повторяющуюся процедуру; «всякий раз, когда» делает это значение прозрачным по-русски.
