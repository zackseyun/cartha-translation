  register: Современный литературный русский, повествовательный и сдержанный. «Галаадитяне» употреблено вместо буквального «Галаад» для естественной передачи коллективного субъекта. Стих намеренно заканчивается запятой, поскольку условная конструкция продолжается в Суд. 12:6.
