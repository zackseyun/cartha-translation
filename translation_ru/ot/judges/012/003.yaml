  text: וָֽ/אֶרְאֶ֞ה כִּֽי אֵינְ/ךָ֣ מוֹשִׁ֗יע וָ/אָשִׂ֨ימָ/ה נַפְשִׁ֤/י בְ/כַפִּ/י֙ וָֽ/אֶעְבְּרָ/ה֙ אֶל בְּנֵ֣י עַמּ֔וֹן וַ/יִּתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדִ֑/י וְ/לָ/מָ֞ה עֲלִיתֶ֥ם אֵלַ֛/י הַ/יּ֥וֹם הַ/זֶּ֖ה לְ/הִלָּ֥חֶם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/003.yaml
  text: When I saw that you were not delivering us[a], I put my life in my hand and crossed over against the Ammonites, and Yahweh gave them into my hand. So why have you come up against me today to fight against me?
translation:
  language: ru
  text: Когда я увидел, что ты не идёшь нам на помощь, я положил жизнь свою на ладонь[a] и выступил против аммонитян, и Яхве отдал их в мои руки. Почему же вы сегодня выступили против меня, чтобы сразиться со мной?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «положил жизнь свою на ладонь» — древнееврейское выражение со значением «рисковал жизнью».'
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶרְאֶה כִּי אֵינְךָ מוֹשִׁיעַ
  choice: Когда я увидел, что ты не идёшь нам на помощь
  rationale: Единственное число обращения сохранено в «ты»; причастие מוֹשִׁיעַ в военном контексте передано естественным русским выражением о приходе на помощь. «Нам» восполняет подразумеваемый объект из контекста.
- source_word: וָאָשִׂימָה נַפְשִׁי בְכַפִּי
  choice: я положил жизнь свою на ладонь
  rationale: Сохранён яркий древнееврейский образ, тогда как переносное значение пояснено в сноске.
- source_word: וָאֶעְבְּרָה אֶל בְּנֵי עַמּוֹן
  choice: и выступил против аммонитян
  rationale: В контексте военного похода עבר с אֶל обозначает движение к противнику; «выступил против» естественно выражает направленность и враждебный характер действия.
- source_word: וַיִּתְּנֵם יְהוָה בְּיָדִי
  choice: и Яхве отдал их в мои руки
  rationale: Сохранены личное имя Бога и традиционный библейский образ передачи врагов в чью-либо власть; множественное «руки» по-русски звучит естественнее, не меняя смысла.
- source_word: וְלָמָה עֲלִיתֶם אֵלַי הַיּוֹם הַזֶּה לְהִלָּחֶם בִּי
  choice: Почему же вы сегодня выступили против меня, чтобы сразиться со мной?
  rationale: Множественное число עֲלִיתֶם сохранено в «вы»; военное значение עלה и לחם передано без нейтрализации враждебного действия.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога, поэтому оно передано транслитерацией, без замены титулом.
- issue: Субъект и объект избавления в כִּי אֵינְךָ מוֹשִׁיעַ
  choice: ты не идёшь нам на помощь
  alternative: нет избавителя
  rationale: Форма אֵינְךָ прямо указывает на адресата в единственном числе. Объект не выражен, но «нам» естественно восстанавливается из повествовательного контекста и не вводит отдельного богословского утверждения.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Смена единственного «ты» на множественное «вы» следует формам исходного текста: сначала Иеффай обращается к представителю как к одному лицу, затем — ко всей пришедшей группе.'
