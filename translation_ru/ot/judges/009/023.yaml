  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח אֱלֹהִים֙ ר֣וּחַ רָעָ֔ה בֵּ֣ין אֲבִימֶ֔לֶךְ וּ/בֵ֖ין בַּעֲלֵ֣י שְׁכֶ֑ם וַ/יִּבְגְּד֥וּ בַעֲלֵי שְׁכֶ֖ם בַּ/אֲבִימֶֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/023.yaml
  text: Then God sent an evil spirit between Abimelech and the leaders of Shechem[c][b][a], and the leaders of Shechem dealt treacherously with Abimelech.
translation:
  language: ru
  text: Тогда Бог послал злого духа[a] между Авимелехом и правителями Сихема[b], и правители Сихема предали Авимелеха[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духа, несущего зло (бедствие)». Еврейское выражение может подчёркивать как зло, так и причиняемый вред.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «владетелями (господами) Сихема»; вероятно, имеются в виду влиятельные горожане или городские правители.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вероломно поступили против Авимелеха».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: послал
  rationale: Обычное и точное соответствие глаголу שׁלח в повествовательной форме; сохраняет прямо выраженное действие Бога.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном повествовательном контексте слово обозначает Бога, совершающего суд.
- source_word: רוּחַ רָעָה
  choice: злого духа
  rationale: Прямой и традиционно понятный перевод сочетания; сохраняет возможность нравственной характеристики духа, не исключая значения причиняемого им вреда.
- source_word: בֵּין ... וּבֵין
  choice: между ... и
  rationale: Точно передаёт парную конструкцию, обозначающую возникшее между сторонами разделение и противостояние.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: правителями Сихема
  rationale: Буквально בַּעֲלֵי означает «владетели/господа», но здесь речь, вероятно, о влиятельных людях, обладавших гражданской властью в городе; «правители» ясно передаёт эту функцию современному читателю.
- source_word: וַיִּבְגְּדוּ
  choice: предали
  rationale: Контекстуально естественно передаёт нарушение верности и вероломное действие, выраженное глаголом בגד; более широкое значение отмечено в сноске.
- source_word: בַּאֲבִימֶלֶךְ
  choice: Авимелеха
  rationale: При переводе глагола בגד словом «предали» объект естественно оформляется винительным падежом; смысл действия против Авимелеха сохраняется.
theological_decisions:
- issue: Прямое участие Бога в посылании злого духа
  choice: «Бог послал злого духа»
  alternative: «Бог допустил злого духа» или «Бог позволил духу вражды действовать»
  rationale: Еврейский глагол и синтаксис прямо приписывают Богу посылание. Перевод не ослабляет это до простого позволения и сохраняет богословское напряжение текста, не объясняя механизм вторичной причинности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским достоинством. Синтаксис близок к еврейскому оригиналу, но понятен обычному читателю; прямая божественная агентность и смысловая неоднозначность выражения רוּחַ רָעָה сохранены.
