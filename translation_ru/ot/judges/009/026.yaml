base_translation:
  language: en
  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: ru
  text: И пришёл Гаал, сын Эведа, со своими братьями; они перешли в Сихем[a], и предводители Сихема[b] доверились ему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прошли через Сихем». Еврейский глагол может означать переход или прохождение; точное направление движения здесь не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «владетели Сихема»; это выражение может обозначать городскую верхушку, влиятельных горожан или людей, обладавших властью в городе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: И пришёл
  rationale: Форма с последовательным וַ продвигает повествование; русское «и пришёл» естественно сохраняет связь с предыдущими событиями.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: Гаал, сын Эведа
  rationale: Личные имена переданы транслитерацией; патронимическая конструкция בֶּן передана обычным русским оборотом «сын Эведа».
- source_word: וְאֶחָיו
  choice: со своими братьями
  rationale: Буквально стоит «и его братья», но после глагола прихода русский оборот с «со» естественно выражает совместное действие, не меняя состава участников.
- source_word: וַיַּעַבְרוּ בִּשְׁכֶם
  choice: они перешли в Сихем
  rationale: Глагол עבר обозначает переход или прохождение. «Перешли в Сихем» сохраняет идею движения, а возможный оттенок прохождения через город отмечен в сноске.
- source_word: וַיִּבְטְחוּ בוֹ
  choice: доверились ему
  rationale: בטח с предлогом בְּ выражает доверие или уверенность в ком-либо. «Доверились ему» кратко и естественно передаёт личную направленность доверия.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: правители Сихема
  rationale: Сочетание обозначает тех, кто обладал в городе властью или общественным весом, а не обязательно всех жителей. «Правители» ясно передаёт основной общественно-политический смысл; буквальный и более широкий варианты приведены в сноске.
