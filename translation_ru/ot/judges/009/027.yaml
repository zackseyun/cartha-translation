source:
  edition: WLC
  text: וַ/יֵּצְא֨וּ הַ/שָּׂדֶ֜ה וַֽ/יִּבְצְר֤וּ אֶת כַּרְמֵי/הֶם֙ וַֽ/יִּדְרְכ֔וּ וַֽ/יַּעֲשׂ֖וּ הִלּוּלִ֑ים וַ/יָּבֹ֨אוּ֙ בֵּ֣ית אֱֽלֹֽהֵי/הֶ֔ם וַ/יֹּֽאכְלוּ֙ וַ/יִּשְׁתּ֔וּ וַֽ/יְקַלְל֖וּ אֶת אֲבִימֶֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/027.yaml
  text: And they went out into the field and gathered the grapes from their vineyards and trod them[a], and they held a festival[b]. Then they went into the house of their god and ate and drank and cursed Abimelek.
translation:
  language: ru
  text: Они вышли в поле, собрали виноград в своих виноградниках и топтали его, а потом устроили празднество[a]. Затем они вошли в дом своего бога[b], ели, пили и проклинали Авимелеха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «устроили праздник сбора урожая»; возможно также: «предались веселью». Еврейское слово означает праздничное торжество, вероятно связанное со сбором винограда.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в дом своих богов». Еврейская форма допускает множественное прочтение, хотя здесь, вероятно, имеется в виду одно божество, почитавшееся в этом святилище.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ הַשָּׂדֶה
  choice: вышли в поле
  rationale: Направительная форма הַשָּׂדֶה обозначает движение в поле или открытую местность; выражение «вышли в поле» естественно передаёт выход из города.
- source_word: וַיִּבְצְרוּ אֶת כַּרְמֵיהֶם
  choice: собрали виноград в своих виноградниках
  rationale: Глагол בצר в контексте виноградника означает сбор винограда; явное упоминание винограда делает смысл понятным современному читателю.
- source_word: וַיִּדְרְכוּ
  choice: топтали его
  rationale: Глагол דרך здесь описывает традиционное вытаптывание собранного винограда; местоимение связывает действие с виноградом, названным ранее.
- source_word: וַיַּעֲשׂוּ הִלּוּלִים
  choice: устроили празднество
  rationale: הִלּוּלִים обозначает праздничное веселье, вероятно связанное со сбором винограда; «празднество» сохраняет событийный и торжественный характер выражения, не уточняя неизвестные обрядовые детали.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: дом своего бога
  rationale: «Дом» формально передаёт בֵּית, а אֱלֹהֵיהֶם в данном контексте, вероятнее всего, обозначает одно почитаемое в этом святилище божество; морфологически возможное множественное понимание отмечено в сноске.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: ели, пили
  rationale: Прямой перевод сохраняет последовательность действий и не добавляет отсутствующих в тексте подробностей.
- source_word: וַיְקַלְלוּ אֶת אֲבִימֶלֶךְ
  choice: проклинали Авимелеха
  rationale: Пиэль глагола קלל означает «проклинать», что сильнее простого оскорбления; несовершенный вид по-русски естественно передаёт действие в ходе пиршества.
theological_decisions:
- issue: Число существительного אֱלֹהֵיהֶם в языческом контексте
  choice: своего бога
  alternative: своих богов
  rationale: Хотя форма допускает морфологически множественное прочтение, ближайший контекст, вероятно, указывает на конкретное божество данного святилища. Основной текст передаёт это понимание, а подлинная неоднозначность сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной повествовательной последовательностью. Сохранены конкретный образ вытаптывания винограда, культовое выражение «дом своего бога» и неоднозначность числа אֱלֹהֵיהֶם; архаизмы и конфессионально окрашенные уточнения не использованы.
