base_translation:
  language: en
  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
translation:
  language: ru
  text: Авимелех и предводители, бывшие с ним, бросились вперёд и заняли позицию у входа в город, у городских ворот, а два других отряда[a] бросились на всех, кто был в поле, и поразили их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «два предводителя». Судя по контексту, имеются в виду два оставшихся отряда из трёх, на которые Авимелех разделил своих людей в предыдущем стихе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשְׁטוּ
  choice: бросились вперёд / бросились на
  rationale: В военном контексте глагол обозначает стремительное выдвижение или нападение. Повтор глагола в еврейском тексте передан близкими по форме выражениями, естественными для каждого из двух дополнений.
- source_word: הָרָאשִׁים
  choice: предводители
  rationale: Буквально «главы»; здесь речь идёт о руководителях воинских подразделений. «Предводители» сохраняет личное значение слова и его военный оттенок.
- source_word: וַיַּעַמְדוּ
  choice: заняли позицию
  rationale: Форма означает, что они встали или расположились в определённом месте. В боевой обстановке «заняли позицию» естественно передаёт намеренное размещение, не добавляя идеи длительной обороны.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: у входа в городские ворота
  rationale: Передаёт конкретное место у входа, образованного городскими воротами, естественным современным русским выражением.
- source_word: וּשְׁנֵי הָרָאשִׁים
  choice: два других отряда[a]
  rationale: Буквально повторяется слово «главы/предводители», однако в ближайшем контексте войско было разделено на три отряда. Контекстуальный перевод делает понятным, что действуют две оставшиеся части войска; буквальное чтение сохранено в сноске.
- source_word: עַל כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: на всех, кто был в поле
  rationale: Последующий глагол с местоименным объектом указывает на людей. Перевод сохраняет собирательное «всех» и не подменяет «поле» более узким понятием.
- source_word: וַיַּכּוּם
  choice: поразили их
  rationale: Глагол נכה может обозначать нанесение удара, поражение или убийство. «Поразили» сохраняет силу действия, не утверждая сверх текста, что каждый человек непременно был убит.
