  text: וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּ֖/וֹ לָ֑יְלָה וַ/יֶּאֶרְב֣וּ עַל שְׁכֶ֔ם אַרְבָּעָ֖ה רָאשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/034.yaml
  text: So Abimelech and all the people who were with him got up by night[a], and they lay in ambush against Shechem in four companies.
translation:
  language: ru
  text: Авимелех и весь народ, который был с ним, поднялись ночью и четырьмя отрядами устроили засаду против Сихема.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «четыре головы», то есть четыре группы или отряда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: поднялись
  rationale: Глагол קום обозначает вставание и переход к действию. Множественное число естественно в русском языке при составном подлежащем «Авимелех и весь народ».
- source_word: לָיְלָה
  choice: ночью
  rationale: Существительное употреблено как обстоятельство времени; «ночью» кратко и естественно передаёт ночное время действия.
- source_word: וַיֶּאֶרְבוּ
  choice: устроили засаду
  rationale: Глагол ארב означает подстерегать, находясь в засаде. Выбранное выражение ясно передаёт скрытое военное действие.
- source_word: עַל שְׁכֶם
  choice: против Сихема
  rationale: Предлог עַל при глаголе засады может указывать на объект враждебного действия, а не только на местоположение.
- source_word: אַרְבָּעָה רָאשִׁים
  choice: четырьмя отрядами
  rationale: Буквально «четырьмя головами»; в данном военном контексте это идиома, обозначающая четыре отдельные группы.
- source_word: הָעָם אֲשֶׁר עִמּוֹ
  choice: весь народ, который был с ним
  rationale: Сохраняется широкое значение עָם «народ, люди» без уточнения «воины» или «войско», которого нет в еврейском тексте.
