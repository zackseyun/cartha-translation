  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
translation:
  language: ru
  text: Тогда собрались все правители Сихема и весь Бет-Милло[a]. Они пошли и поставили Авимелеха царём у дуба, рядом со столпом[b], что в Сихеме.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бет-Милло может означать «дом Милло», но здесь это выражение, вероятно, служит названием места или группы людей.
    reason: cultural_note
  - marker: b
    text: 'Или: «у дуба-столпа» или «у дуба, что возле поставленного камня». Еврейское выражение трудно для понимания, и точный смысл слова מֻצָּב неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  choice: правители Сихема
  rationale: Буквально «владельцы/господа Сихема»; в данном общественно-политическом контексте речь идёт о влиятельных горожанах, державших власть, поэтому «правители» передаёт функцию естественно и без феодального оттенка.
- source_word: בֵּית מִלּוֹא
  choice: Бет-Милло
  rationale: Выражение, по-видимому, служит названием места или группы людей; транслитерация сохраняет неопределённость референта и не превращает его без достаточных оснований в обычное «дом Милло».
- source_word: וַיַּמְלִיכוּ ... לְמֶלֶךְ
  choice: поставили Авимелеха царём
  rationale: Каузативная форма מלך означает «сделать царём, поставить царствовать». Такой перевод не добавляет не упомянутого в тексте обряда коронации.
- source_word: עִם
  choice: у
  rationale: При обозначении ориентира предлог выражает близость; русское «у» кратко и естественно указывает место события.
- source_word: אֵלוֹן
  choice: дуб
  rationale: Слово обозначает крупное дерево, традиционно понимаемое как дуб или терпентинное дерево. «Дуб» — ясный и традиционный вариант, а точный ботанический вид здесь установить нельзя.
- source_word: מֻצָּב
  choice: памятный камень
  rationale: Слово связано с тем, что установлено или стоит. В сочетании с деревом оно, вероятно, обозначает поставленный вертикально камень или памятный знак; перевод сохраняет предметный смысл, не делая вид, будто конструкция фразы бесспорна.
- source_word: וַיֵּאָסְפוּ
  choice: собрались
  rationale: Глагол обозначает совместное собирание; возвратная русская форма естественно передаёт коллективное действие.
