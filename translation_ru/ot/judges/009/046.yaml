  yaml_path: translation/ot/judges/009/046.yaml
  text: When all the leaders of the tower of Shechem heard it[c][b][a], they went into the inner chamber of the house of El-berith.
translation:
  language: ru
  text: Когда все предводители башни Сихема[a] услышали об этом, они вошли во внутреннее помещение[b] храма Эль-Берита[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Мигдал-Сихема», если это сочетание является топонимом, а не означает «башня Сихема».'
    reason: alternative_reading
