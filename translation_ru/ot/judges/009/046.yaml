    text: Еврейское слово может обозначать защищённое внутреннее помещение, сводчатую комнату, укреплённое убежище или крепость.
    reason: lexical_alternative
  - marker: c
    text: Имя Эль-Берит может означать «Бог завета». Сравните родственное имя «Ваал-Берит» в других стихах этой главы.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: услышали об этом
  rationale: Глагол означает «услышали»; объект естественно восстанавливается из контекста предыдущих событий. Русское «услышали об этом» звучит естественно и не добавляет нового содержания.
- source_word: בַּעֲלֵי
  choice: правители
  rationale: Буквально «владетели/господа»; здесь речь о влиятельных людях или руководителях общины при башне Сихема. «Правители» передаёт их общественно-политическое положение, не сводя значение к имущественному владению.
- source_word: מִגְדַּל שְׁכֶם
  choice: башни Сихема
  rationale: מִגְדַּל буквально означает «башня». Сочетание может быть описательным обозначением или топонимом; основной текст сохраняет прозрачное буквальное значение, а топонимическое прочтение отмечено в сноске.
- source_word: וַיָּבֹאוּ אֶל
  choice: они вошли в
  rationale: Глагол движения с אֶל в данном контексте обозначает перемещение внутрь названного убежища; «вошли в» ясно и естественно передаёт направление.
- source_word: צְרִיחַ
  choice: укрытие
  rationale: Редкое существительное обозначает защищённое внутреннее помещение, сводчатую комнату или укреплённое убежище. «Укрытие» соответствует функции этого места в повествовании и не навязывает спорную архитектурную реконструкцию.
- source_word: בֵּית אֵל בְּרִית
  choice: храма Эль-Берита
  rationale: בֵּית буквально «дом», но применительно к месту культа естественно означает храм. Эль-Берит передан как имя или титул, чтобы сохранить неоднозначность и не гармонизировать его с Ваал-Беритом из ближайшего контекста.
theological_decisions:
- issue: Передача культового имени или титула אֵל בְּרִית
  choice: Эль-Берит
  alternative: Бог завета; Ваал-Берит (при гармонизации с контекстом главы)
  rationale: Транслитерация сохраняет возможность понимать выражение как собственное имя или культовый титул. Перевод «Бог завета» возможен по составу слова, но в основном тексте преждевременно устранил бы эту неоднозначность; чтение «Ваал-Берит» потребовало бы гармонизации, которой нет в масоретском тексте данного стиха.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. «Храм» употреблён вместо буквального «дом» как естественное обозначение культового здания; редкий архитектурный термин передан функционально как «укрытие», а возможные более узкие значения сохранены в сноске.
