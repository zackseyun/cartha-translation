  text: וַ/יֵּצֵא֙ גַּ֣עַל בֶּן עֶ֔בֶד וַ/יַּעֲמֹ֕ד פֶּ֖תַח שַׁ֣עַר הָ/עִ֑יר וַ/יָּ֧קָם אֲבִימֶ֛לֶךְ וְ/הָ/עָ֥ם אֲשֶׁר אִתּ֖/וֹ מִן הַ/מַּאְרָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
translation:
  language: ru
  text: Гаал, сын Еведа, вышел[a] и встал у входа в городские ворота. Тогда Авимелех и люди, бывшие с ним, поднялись из засады[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вышел наружу». Еврейский глагол обозначает движение вовне, не уточняя его направление относительно рассказчика.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поднялись с места засады». Еврейское слово может означать как саму засаду, так и место, где она устроена.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Глагол יצא обозначает движение наружу; «вышел» естественно передаёт это значение, не уточняя точку отсчёта сверх сказанного в тексте.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: Гаал, сын Еведа
  rationale: Имена переданы принятой русской библейской транслитерацией; конструкция родства сохранена буквально и естественно.
- source_word: וַיַּעֲמֹד
  choice: встал
  rationale: עמד здесь означает «стать, встать»; нейтральное «встал» не привносит отсутствующего в исходном тексте военного оттенка.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: у входа в городские ворота
  rationale: פתח означает «вход, отверстие», а שער העיר — городские ворота; выбранная формулировка естественна по-русски и сохраняет пространственное отношение.
- source_word: וַיָּקָם
  choice: поднялись
  rationale: קום выражает вставание или начало действия; множественное число в русском согласует сказуемое с Авимелехом и сопровождавшими его людьми.
- source_word: וְהָעָם אֲשֶׁר אִתּוֹ
  choice: и люди, бывшие с ним
  rationale: עם буквально означает «народ, люди»; контекст подразумевает вооружённый отряд, однако «люди» сохраняет лексическую широту оригинала.
- source_word: מִן הַמַּאְרָב
  choice: из засады
  rationale: מארב может обозначать как засаду, так и место засады; краткое выражение «из засады» естественно в русском повествовании и сохраняет допустимую смысловую широту.
