base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
translation:
  language: ru
  text: 'И он тайно послал к Авимелеху вестников со словами: «Вот, Гаал, сын Еведа, и его братья пришли в Сихем, и вот, они настраивают город против тебя[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «осаждают город, выступая против тебя». Значение еврейского глагола здесь не вполне ясно; по контексту речь, вероятно, идёт о том, что Гаал и его люди склоняют Сихем к выступлению против Авимелеха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: И он послал
  rationale: Повествовательная форма передана простым прошедшим временем; союз сохраняет связь с предшествующим рассказом.
- source_word: מַלְאָכִים
  choice: вестников
  rationale: В данном политико-военном контексте речь идёт о людях, доставляющих тайное сообщение.
- source_word: בְּתָרְמָה
  choice: тайно
  rationale: Редкое выражение указывает на скрытый или обманный характер отправки сообщения; «тайно» естественно передаёт контекст, не усиливая нравственной оценки.
- source_word: הִנֵּה ... וְהִנָּם
  choice: Вот ... и вот, они
  rationale: Повтор сохраняет выразительную структуру донесения и привлекает внимание сначала к прибывшим людям, затем к их действиям.
- source_word: גַעַל בֶּן עֶבֶד
  choice: Гаал, сын Еведа
  rationale: Имена переданы принятой русской библейской транслитерацией, а конструкция родства — непосредственно.
- source_word: וְאֶחָיו
  choice: и его братья
  rationale: Сохраняется буквальное значение; в контексте слово может охватывать также близких родственников или сторонников.
- source_word: בָּאִים שְׁכֶמָה
  choice: пришли в Сихем
  rationale: Причастие с направительным окончанием передаёт прибытие, результат которого актуален в момент донесения.
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  choice: настраивают город против тебя
  rationale: Глагол в этом месте труден. Контекст мятежа и сочетание с «против тебя» позволяют понимать выражение как подстрекательство жителей Сихема против Авимелеха; альтернативное более буквальное понимание отмечено в сноске.
