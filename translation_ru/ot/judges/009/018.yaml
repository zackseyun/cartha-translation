  text: וְ/אַתֶּ֞ם קַמְתֶּ֨ם עַל בֵּ֤ית אָבִ/י֙ הַ/יּ֔וֹם וַ/תַּהַרְג֧וּ אֶת בָּנָ֛י/ו שִׁבְעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/תַּמְלִ֜יכוּ אֶת אֲבִימֶ֤לֶךְ בֶּן אֲמָת/וֹ֙ עַל בַּעֲלֵ֣י שְׁכֶ֔ם כִּ֥י אֲחִי/כֶ֖ם הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
translation:
  language: ru
  text: А вы сегодня восстали против дома моего отца, убили его сыновей — семьдесят человек — на одном камне и поставили Авимелеха, сына его рабыни[a], царём над правителями Сихема, потому что он ваш брат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служанки»; более истолковательно: «наложницы». В еврейском тексте употреблено слово, обозначающее рабыню или зависимую служанку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתֶּם עַל
  choice: восстали против
  rationale: Сохраняет образность еврейской идиомы и ясно передаёт враждебное выступление, не сводя его лишь к физическому нападению.
- source_word: בֵּית אָבִי
  choice: дома моего отца
  rationale: «Дом» здесь обозначает семью и род отца, а не здание; традиционная русская формулировка сохраняет этот семейно-династический смысл.
- source_word: הַיּוֹם
  choice: сегодня
  rationale: Передаёт временное ударение в обвинительной речи Иофама естественным современным русским словом.
- source_word: וַתַּהַרְגוּ
  choice: убили
  rationale: Глагол прямо обозначает лишение жизни; «убили» не добавляет юридической квалификации, которую внесло бы слово «убили преступно» или «умертвили как убийцы».
- source_word: בָּנָיו
  choice: его сыновей
  rationale: Местоименный суффикс естественнее всего относится к отцу Иофама, а не к «дому».
- source_word: שִׁבְעִים אִישׁ
  choice: семьдесят человек
  rationale: Числовая конструкция обозначает семьдесят мужчин; по-русски «человек» после такого числительного естественно и не скрывает, что речь идёт о сыновьях.
- source_word: עַל אֶבֶן אֶחָת
  choice: на одном камне
  rationale: Прямо сохраняет мрачную конкретность и возможную обрядово-казнительную обстановку выражения, не уточняя не названную в тексте функцию камня.
- source_word: וַתַּמְלִיכוּ
  choice: поставили ... царём
  rationale: 'Передаёт каузативное значение: сихемцы сделали Авимелеха царём. Формулировка естественна для литературного русского языка.'
- source_word: בֶּן אֲמָתוֹ
  choice: сына его рабыни
  rationale: אָמָה обозначает зависимую женщину — рабыню или служанку. «Рабыня» точнее сохраняет социальную подчинённость и полемическую остроту, тогда как «наложница» была бы контекстуальным истолкованием.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: правителями Сихема
  rationale: В данном политическом контексте выражение указывает на влиятельных полноправных людей города. «Правители» ясно передаёт руководящий статус, не используя архаичное «владыки».
- source_word: כִּי אֲחִיכֶם הוּא
  choice: потому что он ваш брат
  rationale: Сохраняет причинное значение כִּי и обвинительную иронию речи Иофама.
theological_decisions:
- issue: Социальное положение матери Авимелеха в выражении אֲמָתוֹ
  choice: «его рабыни» в основном тексте
  alternative: «его служанки»; контекстуально — «его наложницы»
  rationale: Еврейское существительное прямо обозначает зависимую женщину-служанку или рабыню, а не специальный брачный статус. «Рабыня» сохраняет уничижительный социальный оттенок обвинения; вариант «наложница» отмечен только как возможное контекстуальное истолкование.
translation_notes:
  register: Современный литературный русский с достоинством публичной обвинительной речи. Сохранены повторяющиеся «вы» и конкретный образ одного камня. Синтаксис слегка упорядочен тире вокруг счётного уточнения, но последовательность обвинений оригинала сохранена.
