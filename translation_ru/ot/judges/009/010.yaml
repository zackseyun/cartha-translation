lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Тогда ... сказали
  rationale: Вав с последовательной формой глагола продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: הָעֵצִים
  choice: деревья
  rationale: В контексте притчи множественное число עֵצִים обозначает именно деревья как говорящих персонажей.
- source_word: לַתְּאֵנָה
  choice: смоковнице
  rationale: תְּאֵנָה здесь обозначает фиговое дерево, а предлог ל отмечает адресата речи. «Смоковница» — традиционное и понятное русское название дерева.
- source_word: לְכִי
  choice: иди
  rationale: Женская форма единственного числа повелительного наклонения от הלך согласуется со смоковницей. Буквальное «иди» сохраняет образную реплику и соответствует параллельным строкам притчи.
- source_word: אַתְּ
  choice: ты
  rationale: Самостоятельное местоимение выражено явно и придаёт обращению акцент; в русском его естественно сохранить.
- source_word: מָלְכִי
  choice: царствуй
  rationale: Женская форма повелительного наклонения от מלך означает осуществлять царскую власть. «Царствуй» точно и кратко передаёт этот смысл.
- source_word: עָלֵינוּ
  choice: над нами
  rationale: При глаголе מלך предлог על указывает на тех, над кем осуществляется власть; естественный русский эквивалент — «над нами».
