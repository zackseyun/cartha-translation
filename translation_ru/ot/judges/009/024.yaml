  text: לָ/ב֕וֹא חֲמַ֖ס שִׁבְעִ֣ים בְּנֵֽי יְרֻבָּ֑עַל וְ/דָמָ֗/ם לָ/שׂ֞וּם עַל אֲבִימֶ֤לֶךְ אֲחִי/הֶם֙ אֲשֶׁ֣ר הָרַ֣ג אוֹתָ֔/ם וְ/עַל֙ בַּעֲלֵ֣י שְׁכֶ֔ם אֲשֶׁר חִזְּק֥וּ אֶת יָדָ֖י/ו לַ/הֲרֹ֥ג אֶת אֶחָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
translation:
  language: ru
  text: чтобы насилие, совершённое над семьюдесятью сыновьями Иероваала, постигло[a] Авимелеха, их брата, который убил их, и чтобы кровь их была возложена на Авимелеха и на правителей Сихема[b], которые укрепили ему руки[c], чтобы он убил своих братьев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пришло»; речь о том, что последствия совершённого насилия достигают виновных.'
    reason: Пояснение буквального образа древнееврейского глагола при естественной русской передаче.
  - marker: b
    text: 'Или: «властителей Сихема»; древнееврейское выражение обозначает влиятельных людей, обладавших властью в городе.'
    reason: Уточнение общественно-политического значения בעלי שכם.
  - marker: c
    text: То есть поддержали его и помогли ему.
    reason: Пояснение древнееврейской идиомы «укрепить руки».
lexical_decisions:
- source_word: לָבוֹא חֲמַס
  choice: чтобы злодеяние… обратилось
  rationale: Инфинитив с ל выражает цель или результат. Глагол «обратилось» сохраняет образ последствий злодеяния, достигающих виновного, и звучит естественнее буквального «пришло».
- source_word: חֲמַס שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: злодеяние против семидесяти сыновей Иероваала
  rationale: חמס обозначает насилие, жестокую несправедливость или злодеяние. В данном контексте «злодеяние против» ясно передаёт отношение к погибшим, не добавляя отдельного понятия возмездия.
- source_word: וְדָמָם לָשׂוּם עַל
  choice: и чтобы кровь их была возложена на
  rationale: Сохранён древнееврейский образ возложения пролитой крови на виновных, то есть вменения им ответственности за кровопролитие.
- source_word: אֲבִימֶלֶךְ אֲחִיהֶם
  choice: Авимелеха, их брата
  rationale: Приложение прямо подчёркивает родство Авимелеха с убитыми; порядок слов адаптирован к естественному русскому синтаксису.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: властителей Сихема
  rationale: Здесь בעלי обозначает обладающих властью представителей города. «Властители» сохраняет связь со значением господства и не отождествляет их со всеми жителями.
- source_word: חִזְּקוּ אֶת יָדָיו
  choice: укрепили его руки
  rationale: Сохранена понятная метафора поддержки и содействия, важная для образности исходного текста.
- source_word: לַהֲרֹג אֶת אֶחָיו
  choice: чтобы он убил своих братьев
  rationale: Целевая конструкция передана придаточным предложением, естественным для современного русского языка.
theological_decisions:
- issue: Образ ответственности за пролитую кровь
  choice: сохранить выражение «кровь их была возложена на»
  alternative: «вина за их кровь была вменена»
  rationale: Основной текст сохраняет конкретный библейский образ крови и его судебно-нравственное напряжение, не сводя его к отвлечённому понятию вины.
- issue: Значение наступающих последствий злодеяния
  choice: «злодеяние… обратилось на Авимелеха»
  alternative: «возмездие за злодеяние постигло Авимелеха»
  rationale: В исходном тексте прямо названо само חמס, а не отдельное слово «возмездие»; поэтому перевод не вводит дополнительной богословской конкретизации.
translation_notes:
  register: 'Современный литературный русский язык с достоинством исторического повествования. Имена переданы в привычной русской библейской форме: Иероваал, Авимелех, Сихем. Сохранены образы крови и укреплённых рук; синтаксис слегка упорядочен для ясности.'
