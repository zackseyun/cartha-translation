base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
translation:
  language: ru
  text: '«Прошу вас, скажите всем влиятельным людям Сихема[a]: что для вас лучше — чтобы над вами правили все семьдесят сыновей Иероваала или чтобы над вами правил один человек? И помните, что я — кость ваша и плоть ваша[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «владельцам» или «господам Сихема». Еврейское слово может обозначать влиятельных членов городской общины; их точный общественный статус неясен.'
    reason: Поясняет неоднозначный общественно-политический термин בַּעֲלֵי, не сводя его к землевладельцам или формально определённым правителям.
  - marker: b
    text: «Кость ваша и плоть ваша» — древнееврейское выражение, означающее близкое кровное родство.
    reason: Поясняет сохранённую в тексте буквальную формулу родства.
lexical_decisions:
- source_word: דַּבְּרוּ נָא
  choice: Прошу вас, скажите
  rationale: Множественное повелительное наклонение с частицей просьбы נָא; такая формулировка естественно передаёт настойчивую, но вежливую просьбу.
- source_word: בְּאָזְנֵי
  choice: скажите всем
  rationale: Буквально «в уши»; в данном контексте это идиома обращения к людям так, чтобы они услышали. По-русски естественнее передать её глагольной конструкцией.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: владельцам Сихема
  rationale: בעלים может означать владельцев, полноправных горожан или влиятельных лиц. «Владельцы Сихема» сохраняет необычное общественно-правовое обозначение и не сужает его без необходимости до руководителей.
- source_word: מַה טּוֹב לָכֶם
  choice: что для вас лучше
  rationale: Следующие две возможности придают выражению сравнительный смысл; русская формулировка сохраняет риторический вопрос.
- source_word: הַמְשֹׁל בָּכֶם ... מְשֹׁל בָּכֶם
  choice: чтобы над вами правили ... чтобы над вами правил
  rationale: משל здесь обозначает политическую власть. Повтор корня сохранён повторением «правили/правил».
- source_word: שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל
  choice: семьдесят человек, все сыновья Иероваала
  rationale: После числительного איש служит для счёта мужчин; пояснение «все сыновья» однозначно сохраняет мужской референт и синтаксис оригинала.
- source_word: אִישׁ אֶחָד
  choice: один человек
  rationale: Прямое противопоставление семидесяти одному; в контексте речь идёт об Авимелехе, а русское «человек» естественно и не устраняет его мужскую принадлежность.
- source_word: וּזְכַרְתֶּם
  choice: И помните
  rationale: Форма с waw в речи имеет побудительную силу; «помните» передаёт её прямо и весомо.
- source_word: עַצְמֵכֶם וּבְשַׂרְכֶם
  choice: кость ваша и плоть ваша
  rationale: Конкретная древнееврейская формула кровного родства сохранена, а её идиоматический смысл пояснён в сноске.
- source_word: אָנִי
  choice: я —
  rationale: Самостоятельное местоимение несёт акцент; тире в русском предложении подчёркивает отождествление без добавления слова «сам».
theological_decisions:
- issue: Формула кровного родства
  choice: Сохранить в основном тексте «я — кость ваша и плоть ваша»
  alternative: «я одной с вами крови» или «я ваш родственник»
  rationale: Буквальная образность выражает не только юридическое родство, но и телесную общность; сноска раскрывает смысл, не подменяя образ толкованием.
- issue: Статус בַּעֲלֵי שְׁכֶם
  choice: «владельцы Сихема» с поясняющей сноской
  alternative: «правители Сихема», «жители Сихема» или «полноправные граждане Сихема»
  rationale: Точный общественный статус группы остаётся предметом интерпретации. Более конкретное обозначение могло бы необоснованно разрешить присущую слову неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством прямой политической речи. Синтаксический параллелизм вопроса и повтор глагола «править» сохранены. Архаическая формула родства оставлена намеренно и снабжена ясным пояснением.
