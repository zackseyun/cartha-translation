source:
  edition: WLC
  text: וְ/עַתָּה֙ ק֣וּם לַ֔יְלָה אַתָּ֖ה וְ/הָ/עָ֣ם אֲשֶׁר אִתָּ֑/ךְ וֶ/אֱרֹ֖ב בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/032.yaml
  text: Now then[a], arise by night, you and the people who are with you[b], and lie in wait in the field.
translation:
  language: ru
  text: Итак, встань ночью — ты и люди, которые с тобой, — и устрой засаду в поле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «затаись в поле». Еврейский глагол означает находиться в укрытии, поджидая кого-либо, обычно с целью нападения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Итак
  rationale: Переходное выражение вводит непосредственное распоряжение; «итак» естественно передаёт связь с предыдущей речью и побудительную силу контекста.
- source_word: קוּם
  choice: встань
  rationale: Прямое повеление от קום; современное и достаточно выразительное русское соответствие.
- source_word: לַיְלָה
  choice: ночью
  rationale: Наречное обозначение времени действия без обязательного уточнения «сегодня ночью».
- source_word: אַתָּה וְהָעָם אֲשֶׁר אִתָּךְ
  choice: ты и люди, которые с тобой
  rationale: Сохранено эксплицитное «ты» и широкое значение עָם; слово «люди» не сужает смысл до формально организованного войска.
- source_word: וֶאֱרֹב
  choice: устрой засаду
  rationale: Глагол ארב означает занять позицию в ожидании нападения, то есть устроить засаду; в данном военном контексте это естественнее русского «жди в засаде».
- source_word: בַּשָּׂדֶה
  choice: в поле
  rationale: Прямое соответствие שָׂדֶה; в контексте возможно также более широкое значение открытой местности.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с кратким, энергичным звучанием военного распоряжения. Тире выделяют подлежащее с присоединённой группой и сохраняют акцент на обращённом к адресату «ты».
