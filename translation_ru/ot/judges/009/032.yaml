  source_fidelity: 'Текст точно передаёт повелительную последовательность еврейского оригинала: переходное «итак», приказ выступить ночью, эксплицитно названного адресата с сопровождающими его людьми и приказ занять засаду в поле. «Ночью» не неоправданно конкретизирует время как «сегодня ночью».'
