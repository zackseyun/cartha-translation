base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
translation:
  language: ru
  text: 'Но виноградная лоза ответила им: «Неужели мне перестать давать моё молодое вино, которое веселит богов[a] и людей, и пойти колыхаться над деревьями?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Бога и людей».'
    reason: Еврейское אֱלֹהִים может означать как «богов», так и «Бога»; оба прочтения грамматически возможны.
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: виноградная лоза
  rationale: Так ясно и естественно обозначено говорящее растение в притче; одно слово «лоза» в современном русском может быть понято шире.
- source_word: הֶחֳדַלְתִּי אֶת תִּירוֹשִׁי
  choice: Неужели мне перестать давать моё молодое вино
  rationale: Перфект в контексте передан как риторически-совещательный вопрос. Глагол «давать» естественно восполняет подразумеваемую связь между прекращением и плодом лозы, не меняя смысла.
- source_word: תִּירוֹשִׁי
  choice: моё молодое вино
  rationale: תִּירוֹשׁ обозначает молодое, свежее вино; перевод сохраняет отличие от общего слова «вино» и сельскохозяйственный образ.
- source_word: הַמְשַׂמֵּחַ
  choice: которое веселит
  rationale: 'Передаёт каузативное значение причастия: вино доставляет радость, веселит.'
- source_word: אֱלֹהִים וַאֲנָשִׁים
  choice: богов и людей
  rationale: Морфологически אֱלֹהִים имеет форму множественного числа; в контексте древней притчи чтение «богов» возможно и сохраняет неоднозначность. אֲנָשִׁים естественно передано современным русским «людей».
- source_word: לָנוּעַ עַל הָעֵצִים
  choice: колыхаться над деревьями
  rationale: Сохраняется физический образ движения лозы над деревьями и одновременно контекст предложения царствовать; нейтральное «властвовать» устранило бы образную двусмысленность.
theological_decisions:
- issue: Число и значение אֱלֹהִים в выражении «веселит אֱלֹהִים и людей»
  choice: богов
  alternative: Бога
  rationale: Форма допускает как морфологически множественное «богов», так и обычное для библейского иврита обозначение единого Бога. Основной текст сохраняет вероятное для древней притчи множественное прочтение, а традиционное единственное чтение отмечено в сноске, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством притчевой речи. Риторический вопрос передан естественной конструкцией «Неужели мне…», а образное «колыхаться над деревьями» сохраняет сочетание физического движения и намёка на власть.
