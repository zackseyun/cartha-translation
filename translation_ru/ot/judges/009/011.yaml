base_translation:
  language: en
  yaml_path: translation/ot/judges/009/011.yaml
  text: But the fig tree said to them[a], ‘Should I stop producing my sweetness and my good fruit, and go to sway over the trees?’
translation:
  language: ru
  text: 'Но смоковница ответила им: «Неужели я перестану давать свою сладость и свои добрые плоды и пойду раскачиваться над деревьями[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «властвовать над деревьями». Еврейский глагол буквально означает «качаться», «двигаться»; в этой басне образ качающегося дерева одновременно намекает на власть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Но ... ответила
  rationale: Последовательная форма продолжает повествование, а «но» естественно передаёт контраст очередного отказа; «ответила» уместно в данном диалоге.
- source_word: הַתְּאֵנָה
  choice: смоковница
  rationale: Современное литературное название фигового дерева, сохраняющее библейское достоинство регистра.
- source_word: הֶחֳדַלְתִּי
  choice: Неужели я перестану давать
  rationale: Перфект в риторическом вопросе имеет совещательно-потенциальный смысл. «Давать» естественно связывает дерево с его сладостью и плодами, не меняя сути образа.
- source_word: מָתְקִי
  choice: свою сладость
  rationale: Буквально сохраняет персонифицированную речь и не сводит выражение только к сладким плодам.
- source_word: תְּנוּבָתִי הַטּוֹבָה
  choice: свои добрые плоды
  rationale: תְּנוּבָה означает плод, урожай или произведение; применительно к смоковнице естественно «плоды». «Добрые» сохраняет оценочное הַטּוֹבָה и высокий литературный регистр.
- source_word: וְהָלַכְתִּי
  choice: и пойду
  rationale: Продолжает единый риторический вопрос и прямо передаёт последовательность действий.
- source_word: לָנוּעַ
  choice: раскачиваться
  rationale: Сохраняет буквальный образ движения или качания дерева и одновременно оставляет подразумеваемую в басне связь с господством.
- source_word: עַל הָעֵצִים
  choice: над деревьями
  rationale: Передаёт пространственный образ и допускает властный оттенок предлога עַל без его однозначного истолкования.
theological_decisions:
- issue: Сочетание древесного образа с намёком на царскую власть
  choice: «раскачиваться над деревьями» с пояснением в сноске
  alternative: «царствовать над деревьями» или «властвовать над деревьями»
  rationale: Еврейский נוע буквально обозначает движение или качание; буквальный образ важен для басни, тогда как значение власти возникает из контекста. Сноска сохраняет обе смысловые стороны, не устраняя намеренную игру образов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка сохраняет риторический вопрос, персонификацию смоковницы и смысловую двуплановость глагола נוע.
