  source_fidelity: Текст точно передаёт риторический вопрос, прекращение плодоношения («перестану давать»), два объекта — «свою сладость» и «свои добрые плоды», — а также образное לָנוּעַ («раскачиваться») в сочетании с עַל הָעֵצִים («над деревьями»). «Ответила» уместно в последовательности ответов деревьев.
