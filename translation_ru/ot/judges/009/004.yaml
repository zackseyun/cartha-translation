  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
translation:
  language: ru
  text: И дали ему из дома Баал-Берита[a] семьдесят единиц серебра[b]. На это серебро Авимелех нанял никчёмных и безрассудных людей[c], и они пошли за ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из храма Баал-Берита». В еврейском тексте буквально сказано «из дома»; в культовом контексте это слово может обозначать святилище или храм.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «семьдесят серебряных сиклей». В еврейском тексте буквально: «семьдесят серебра» — денежная сумма, определяемая по весу.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «пустых и безрассудных людей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים כֶּסֶף
  choice: семьдесят серебряных монет
  rationale: Буквально сочетание означает «семьдесят серебра» и обозначает денежную сумму по весу. «Серебряные монеты» естественно передаёт денежный смысл, а сноска сохраняет возможность понимания как сиклей.
- source_word: מִבֵּית בַּעַל בְּרִית
  choice: из дома Баал-Берита
  rationale: בַּיִת буквально означает «дом», но в культовом контексте может обозначать храм или святилище. Основной текст сохраняет еврейский образ; имя передано транслитерацией.
- source_word: וַיִּשְׂכֹּר בָּהֶם
  choice: На это серебро Авимелех нанял
  rationale: Предлог ב с местоименным суффиксом указывает на серебро как средство оплаты. Русская формулировка ясно передаёт эту связь.
- source_word: אֲנָשִׁים רֵיקִים
  choice: никчёмных людей
  rationale: רֵיקִים буквально «пустые», но здесь характеризует людей как не имеющих нравственной или общественной ценности; «никчёмные» естественно передаёт эту оценку.
- source_word: וּפֹחֲזִים
  choice: безрассудных
  rationale: Слово характеризует необузданных, опрометчивых и ненадёжных людей. «Безрассудные» сохраняет смысл рискованного, недисциплинированного поведения.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: и они пошли за ним
  rationale: Формулировка близка к буквальному «пошли вслед за ним» и в контексте естественно означает, что эти люди стали его сторонниками.
