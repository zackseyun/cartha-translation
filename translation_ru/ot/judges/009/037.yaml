  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
translation:
  language: ru
  text: 'Гаал снова заговорил: «Смотри, люди спускаются из середины страны[a], а один отряд идёт со стороны дороги, ведущей к Дубу Прорицателей[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от пупа земли» — образное обозначение её середины или центральной части.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «теревинфы прорицателей» или «дуба Меоненим». Точный вид дерева и значение последней части названия неясны; она может указывать на гадателей или прорицателей.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר
  choice: Гаал снова заговорил
  rationale: Еврейская конструкция буквально означает, что Гаал вновь продолжил или возобновил речь; выбран естественный русский повествовательный оборот.
- source_word: הִנֵּה
  choice: Смотри
  rationale: Частица привлекает внимание собеседника к увиденному; «Смотри» сохраняет её указательную силу в современной речи.
- source_word: עָם יֹרְדִים
  choice: люди спускаются
  rationale: עָם передано без излишнего уточнения как «люди», а причастие — формой настоящего времени, обозначающей наблюдаемое движение вниз.
- source_word: מֵעִם טַבּוּר הָאָרֶץ
  choice: с середины земли
  rationale: טַבּוּר буквально означает «пуп», но в географическом выражении указывает на середину или центральную часть местности; метафора отмечена в сноске.
- source_word: וְרֹאשׁ אֶחָד
  choice: а один отряд
  rationale: רֹאשׁ буквально «голова», здесь обозначает отдельное подразделение или группу приближающихся людей. «Отряд» естественен в военном контексте, не определяя его точную численность.
- source_word: מִדֶּרֶךְ
  choice: со стороны
  rationale: Оборот может указывать как на путь движения, так и на направление; «со стороны» естественно передаёт зрительное сообщение Гаала.
- source_word: אֵלוֹן מְעוֹנְנִים
  choice: Дуба прорицателей
  rationale: אֵלוֹן может обозначать дуб, теревинф или заметное большое дерево, а מְעוֹנְנִים, вероятно, связано с прорицанием и входит в местное название; неопределённость сохранена в сноске.
