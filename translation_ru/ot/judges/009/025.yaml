base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
translation:
  language: ru
  text: Тогда влиятельные жители Сихема[a] разместили против него засадников на вершинах гор и грабили всех, кто проходил мимо них по дороге. Об этом сообщили Авимелеху.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правители Сихема», «горожане Сихема»; буквально: «владельцы (господа) Сихема». Выражение может обозначать влиятельных жителей города, обладавших властью.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  choice: влиятельные жители Сихема
  rationale: Сочетание буквально обозначает «владельцев/господ Сихема», а в городском политическом контексте — обладавших влиянием и властью представителей города. Этот вариант естественен по-русски и не привносит феодального оттенка.
- source_word: וַיָּשִׂימוּ לוֹ מְאָרְבִים
  choice: устроили против него засады
  rationale: Оборот описывает размещение людей, лежащих в засаде, с враждебной направленностью против Авимелеха. Множественное число «засады» соответствует форме причастия מְאָרְבִים и допускает несколько групп.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: на вершинах гор
  rationale: Передаёт буквально-пространственный образ «на головах гор» естественным современным русским выражением.
- source_word: וַיִּגְזְלוּ
  choice: грабили
  rationale: Глагол указывает на насильственное отнятие имущества; в отношении путников «грабили» точнее и естественнее, чем более широкое «разоряли».
- source_word: אֵת כָּל אֲשֶׁר יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ
  choice: всех, кто проходил мимо них по дороге
  rationale: Единственное число глагола после כָּל имеет распределительное значение; русский оборот «всех, кто» естественно передаёт его.
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: об этом донесли Авимелеху
  rationale: Безличная конструкция сохраняет неопределённость относительно того, кто сообщил Авимелеху, и звучит естественно в повествовании.
