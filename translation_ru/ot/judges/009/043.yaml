base_translation:
  language: en
  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
translation:
  language: ru
  text: Он взял людей, разделил их на три отряда[a] и залёг в засаде в поле. Увидев, что люди выходят из города, он выступил против них и поразил их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на три головы»; это древнееврейское выражение означает три части, группы или отряды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אֶת־הָעָם
  choice: Он взял людей
  rationale: עָם буквально обозначает «народ, людей»; в данном военном контексте речь идёт о людях Авимелеха. Перевод «людей» сохраняет широту исходного слова, не вводя прямо отсутствующее в тексте притяжательное местоимение.
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  choice: разделил их на три отряда[a]
  rationale: חצה означает «делить», а רָאשִׁים (буквально «головы») здесь идиоматически обозначает отдельные части или подразделения. «Отряды» естественно передаёт военный контекст.
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  choice: залёг в засаде в поле
  rationale: ארב передаёт выжидание в засаде. Формулировка сохраняет длительный характер действия и прямо передаёт местонахождение בַּשָּׂדֶה — «в поле».
- source_word: וַיַּרְא וְהִנֵּה
  choice: Увидев, что
  rationale: Эта конструкция вводит внезапно замеченную ситуацию. Русский деепричастный оборот естественно передаёт повествовательную связь, тогда как буквальное «и вот» здесь звучало бы тяжеловесно.
- source_word: הָעָם יֹצֵא מִן־הָעִיר
  choice: люди выходят из города
  rationale: Причастие יֹצֵא изображает наблюдаемое действие в процессе. «Люди» сохраняет значение עָם и не уточняет пол или военный статус выходивших.
- source_word: וַיָּקָם עֲלֵיהֶם
  choice: он поднялся против них
  rationale: Формулировка близко передаёт идиому קום על и её враждебный смысл, не сводя её без необходимости к более узкому «напал».
- source_word: וַיַּכֵּם
  choice: и поразил их
  rationale: נכה может означать удар, поражение или разгром и само по себе не обязательно утверждает, что все были убиты. «Поразил» сохраняет эту смысловую широту.
