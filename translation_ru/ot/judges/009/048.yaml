base_translation:
  language: en
  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
translation:
  language: ru
  text: 'Авимелех поднялся на гору Цалмон вместе со всеми людьми, которые были с ним. Он взял в руки топоры, срубил охапку ветвей[a], поднял её и положил себе на плечо. Затем он сказал людям, которые были с ним: «Вы видели, что я сделал. Поспешите и сделайте то же, что сделал я».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «большую ветвь», «охапку хвороста» или «заросль ветвей». Редкое еврейское слово обозначает массу ветвей или хвороста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: поднялся
  rationale: Глагол עלה обозначает движение вверх; «поднялся» естественно передаёт восхождение на гору.
- source_word: הַר צַלְמוֹן
  choice: гора Цалмон
  rationale: Название места транслитерировано; конструкция с הַר передана обычным русским сочетанием «гора Цалмон».
- source_word: הוּא וְכָל־הָעָם אֲשֶׁר אִתּוֹ
  choice: вместе со всеми людьми, которые были с ним
  rationale: Сохраняется широкое значение עָם — «люди, народ»; слово не сужено до «воинов», хотя контекст допускает это понимание.
- source_word: הַקַּרְדֻּמּוֹת בְּיָדוֹ
  choice: взял в руки топоры
  rationale: Множественное число существительного сохранено. Русское «взял в руки» естественнее буквального «взял топоры в свою руку» и передаёт обладание орудиями.
- source_word: וַיִּכְרֹת שׂוֹכַת עֵצִים
  choice: срубил связку ветвей
  rationale: Редкое שׂוֹכָה указывает на массу или сплетение ветвей; «связка ветвей» соответствует переносимому грузу и не сводит выражение к одной ветви.
- source_word: וַיִּשָּׂאֶהָ וַיָּשֶׂם עַל שִׁכְמוֹ
  choice: поднял её и положил себе на плечо
  rationale: 'Сохранена последовательность двух действий: поднять груз и поместить его на плечо.'
- source_word: מָה רְאִיתֶם עָשִׂיתִי
  choice: Вы видели, что я сделал
  rationale: Сжатая еврейская конструкция передана ясной русской фразой без изменения смысла.
- source_word: מַהֲרוּ עֲשׂוּ כָמוֹנִי
  choice: Скорее сделайте то же, что и я
  rationale: «Скорее» передаёт срочность повеления מהר, а «сделайте то же, что и я» естественно выражает требование повторить показанное действие.
