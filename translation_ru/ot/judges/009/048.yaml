- from: 'Авимелех поднялся на гору Цалмон вместе со всеми людьми, которые были с ним. Он взял в руки топоры, срубил связку ветвей[a], поднял её и положил себе на плечо. Затем он сказал людям, которые были с ним: «Вы видели, что я сделал. Скорее сделайте то же, что и я».'
  to: 'Авимелех поднялся на гору Цалмон вместе со всеми людьми, которые были с ним. Он взял в руки топоры, срубил охапку ветвей[a], поднял её и положил себе на плечо. Затем он сказал людям, которые были с ним: «Вы видели, что я сделал. Поспешите и сделайте то же, что сделал я».'
  rationale: 'Заменено «связка ветвей» на «охапка ветвей», чтобы не привносить представление о связанном грузе и сохранить контекстуально вероятное значение массы срезанных ветвей. В заключительном приказе добавлено «сделал», что ясно связывает подражание с действием Авимелеха, уже описанным в предыдущем предложении. Сноска уточнена: «заросль ветвей» естественнее, чем «куст ветвей», и сохраняет спектр возможных значений.'
