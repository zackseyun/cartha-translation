  text: But a certain woman threw an upper millstone on Abimelech’s head and crushed his skull[a].
translation:
  language: ru
  text: Но одна женщина бросила верхний жёрнов на голову Авимелеха и раздробила ему череп.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кусок верхнего жернова»; еврейское выражение может обозначать часть или обломок верхнего жернова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלֵךְ
  choice: бросила
  rationale: Глагол שׁלך обозначает намеренное бросание; «бросила» естественно передаёт активное действие и не ослабляет его до случайного падения.
- source_word: אִשָּׁה אַחַת
  choice: одна женщина
  rationale: Буквально «одна женщина»; выражение сохраняет повествовательный акцент на безымянной женщине, совершившей решающий поступок.
- source_word: פֶּלַח רֶכֶב
  choice: верхний жёрнов
  rationale: רֶכֶב обозначает верхний камень ручной мельницы, а פֶּלַח может указывать либо на сам круглый камень, либо на его часть; основной текст передаёт конкретный вид жернова, а неоднозначность отмечена в сноске.
- source_word: עַל רֹאשׁ אֲבִימֶלֶךְ
  choice: на голову Авимелеху
  rationale: Естественная русская конструкция точно передаёт направление удара и имя собственное.
- source_word: וַתָּרִץ
  choice: проломила
  rationale: רצץ значит «раздробить, сокрушить»; применительно к черепу «проломила» звучит естественно и наглядно, не выходя за смысл исходного глагола.
- source_word: גֻּלְגָּלְתּוֹ
  choice: ему череп
  rationale: Существительное обозначает именно череп, а не голову вообще; местоименная конструкция естественна для современного русского языка.
