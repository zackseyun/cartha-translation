base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
translation:
  language: ru
  text: 'Тогда он поспешно позвал юношу, носившего его оружие[a], и сказал ему: «Обнажи свой меч и убей меня, чтобы обо мне не сказали: „Женщина убила его“». Юноша пронзил его, и он умер.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или одним словом: «оруженосца». Буквально: «юношу, носившего его оружие (или снаряжение)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  choice: Тогда он поспешно позвал
  rationale: Последовательная глагольная форма продвигает повествование, а наречие מְהֵרָה выражает срочность; сочетание естественно для современного русского рассказа.
- source_word: הַנַּעַר נֹשֵׂא כֵלָיו
  choice: юношу, носившего его оружие
  rationale: Сохраняется прямое значение נַעַר «юноша, молодой человек», а נֹשֵׂא כֵלָיו передано описательно как носитель его оружия или снаряжения; традиционное «оруженосец» дано в сноске.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: Обнажи свой меч
  rationale: Глагол שׁלף обозначает извлечение меча из ножен; «обнажи меч» — краткое и устоявшееся русское соответствие.
- source_word: וּמוֹתְתֵנִי
  choice: и убей меня
  rationale: В данном контексте форма прямо выражает просьбу причинить смерть; «убей меня» передаёт её без эвфемизма.
- source_word: פֶּן יֹאמְרוּ לִי
  choice: чтобы обо мне не говорили
  rationale: פֶּן вводит предотвращаемый результат, а לִי в контексте относится к тому, что будут говорить об Авимелехе, а не непосредственно ему.
- source_word: אִשָּׁה הֲרָגָתְהוּ
  choice: Женщина убила его
  rationale: Активная конструкция и начальная позиция слова «женщина» сохраняют смысловой акцент и связанную с ним позорную для героя репутацию.
- source_word: וַיִּדְקְרֵהוּ
  choice: пронзил его мечом
  rationale: Глагол обозначает нанесение колющего удара, пронзание; добавление «мечом» ясно связывает действие с только что данным приказом и не меняет смысла.
- source_word: נַעֲרוֹ
  choice: юноша
  rationale: Повтор слова «юноша» сохраняет связь с ранее названным молодым человеком; буквальное «его юноша» по-русски неестественно.
