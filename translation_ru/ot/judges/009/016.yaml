  text: וְ/עַתָּ֗ה אִם בֶּ/אֱמֶ֤ת וּ/בְ/תָמִים֙ עֲשִׂיתֶ֔ם וַ/תַּמְלִ֖יכוּ אֶת אֲבִימֶ֑לֶךְ וְ/אִם טוֹבָ֤ה עֲשִׂיתֶם֙ עִם יְרֻבַּ֣עַל וְ/עִם בֵּית֔/וֹ וְ/אִם כִּ/גְמ֥וּל יָדָ֖י/ו עֲשִׂ֥יתֶם לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
translation:
  language: ru
  text: Итак, если вы по правде и честно сделали Авимелеха царём, если вы хорошо обошлись с Иероваалом и его домом и обошлись с ним так, как заслуживали его дела[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обошлись с ним по воздаянию его рук». Еврейский оборот означает обращение с человеком в соответствии с тем, чего заслуживают его поступки.'
    reason: Поясняет образный оборот «воздаяние рук» и сохраняет его смысл без указания, было ли это воздаяние благим или неблагим.
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Передаёт переход к прямому условному обличению; союз וְ сохранён, а עַתָּה выражено естественным современным оборотом.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: по правде и с чистыми намерениями
  rationale: Первое слово указывает на правдивость и верность поступка, второе — на цельность и безупречность побуждений; формулировка естественна по-русски и сохраняет два нравственных аспекта.
- source_word: וַתַּמְלִיכוּ אֶת אֲבִימֶלֶךְ
  choice: поставив Авимелеха царём
  rationale: Каузатив глагола מלך означает «сделать царём, поставить царём»; деепричастный оборот естественно связывает это действие с оценкой того, как поступили жители Сихема.
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  choice: хорошо поступили с
  rationale: Идиоматично передаёт буквальное «сделали добро с/по отношению к», сохраняя нравственную оценку.
- source_word: יְרֻבַּעַל
  choice: Иероваал
  rationale: Сохранено имя, употреблённое в еврейском тексте, без замены на Гедеон.
- source_word: בֵּיתוֹ
  choice: его домом
  rationale: «Дом» сохраняет семейный и династический диапазон еврейского בַּיִת.
- source_word: כִּגְמוּל יָדָיו עֲשִׂיתֶם לוֹ
  choice: воздали ему по делам рук его
  rationale: Сохраняет конкретный образ рук как совершённых им дел и выражает соответствующее этим делам воздаяние, не решая заранее, положительно оно или отрицательно.
theological_decisions:
- issue: Нравственная оценка во второй части условного высказывания
  choice: Сохранить условность и двусмысленность выражения о воздаянии
  alternative: Передать как однозначное утверждение, что Иероваал заслуживал добра
  rationale: Стих входит в риторическую условную конструкцию Иофама. Еврейский текст предлагает проверить соответствие обращения с Иероваалом его делам, не формулируя здесь отдельного догматического вывода.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет незавершённую цепь условных придаточных, продолжающуюся в следующем стихе. Архаизирующий порядок «рук его» оставлен только внутри устойчивого образа; остальная фраза изложена естественно.
