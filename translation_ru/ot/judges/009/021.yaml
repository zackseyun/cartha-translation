  rationale: Заменено «спасся» на «скрылся», чтобы не добавлять утверждения о результате спасения и сохранить близкое по смыслу удвоение глаголов бегства. Синтаксис упорядочен с союзами, а «вдали от» сохранено как естественная передача מִפְּנֵי в данном контексте, без явного добавления мотива страха.
