  text: Then Jotham fled and escaped and went to Beer[a], and he lived there away from Abimelech his brother.
translation:
  language: ru
  text: Тогда Иофам убежал и скрылся, отправился в Беэр и жил там вдали от своего брата Авимелеха.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּנָס
  choice: убежал
  rationale: Глагол נוּס обозначает бегство от опасности; «убежал» естественно передаёт это значение в современном русском повествовании.
- source_word: וַיִּבְרַח
  choice: спасся
  rationale: Глагол בָּרַח также означает бегство или избавление посредством бегства. Выбор «спасся» сохраняет последовательность двух близких по смыслу глаголов, не сводя их к одному действию.
- source_word: בְּאֵרָה
  choice: в Беэр
  rationale: Форма понимается как название места בְּאֵר с направительным окончанием -ה, то есть «в Беэр»; название передано транслитерацией.
- source_word: וַיֵּשֶׁב שָׁם
  choice: там он жил
  rationale: В данном контексте יָשַׁב означает пребывание или проживание; «жил» звучит естественно и не уточняет длительность сверх сказанного.
- source_word: מִפְּנֵי
  choice: вдали от
  rationale: Оборот буквально указывает на удаление от чьего-либо лица или присутствия. «Вдали от» сохраняет пространственный оттенок и подразумеваемое избегание, не делая страх явной причиной.
- source_word: אָחִיו
  choice: своего брата
  rationale: Родственное обозначение сохранено явно; возвратное местоимение естественно указывает на Иофама как обладателя.
