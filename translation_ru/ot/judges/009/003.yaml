base_translation:
  language: en
  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
translation:
  language: ru
  text: 'Братья его матери сообщили всем правителям Сихема[a] всё это о нём, и их сердца склонились к Авимелеху, потому что они сказали: «Он наш брат».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всем господам Сихема»; возможно также: «всем влиятельным людям Сихема». Еврейское выражение обозначает видных мужчин города, обладавших властью или влиянием.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: передали
  rationale: В данном контексте братья матери Авимелеха сообщают его предложение сихемским правителям. «Передали» естественно выражает речевое действие и его посредническую функцию, не уточняя способ убеждения.
- source_word: אֲחֵי אִמּוֹ
  choice: братья его матери
  rationale: Конструктивное сочетание обозначает именно братьев матери, то есть дядей по матери; буквальная формулировка сохраняет явную родственную связь с предыдущим стихом.
- source_word: עָלָיו
  choice: о нём
  rationale: Предлог при глаголе речи здесь естественно означает, что говорили об Авимелехе. Возможное «в его пользу» было бы более истолковывающим.
- source_word: בְּאָזְנֵי
  choice: всем правителям
  rationale: Идиома буквально означает «в уши», то есть перед аудиторией или так, чтобы она услышала. В русском с глаголом «передали» адресат естественно выражается дательным падежом без воспроизведения чуждой идиомы.
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  choice: всем правителям Сихема
  rationale: בעלי может означать хозяев, господ или влиятельных горожан. В политическом контексте речь идёт о руководящей группе Сихема; «правители» ясно передаёт её общественную роль, а варианты отмечены в сноске.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: все эти слова
  rationale: דברים допускает значения «слова», «дела» и «обстоятельства», но здесь отсылает к речи-предложению Авимелеха в предыдущем стихе. «Слова» сохраняет эту речевую связь.
- source_word: וַיֵּט לִבָּם
  choice: сердца их склонились
  rationale: Еврейская конструкция описывает перемену внутреннего расположения сихемлян. Русское множественное число согласуется с группой и сохраняет образ сердца как центра воли, не вводя невыраженного субъекта воздействия.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: к Авимелеху
  rationale: Оборот буквально передаёт направленность «за Авимелехом», то есть расположение и готовность поддержать его. «Склонились к» естественно выражает этот образ в современном русском.
- source_word: כִּי אָמְרוּ
  choice: потому что они сказали
  rationale: כִּי вводит причину их расположения; «потому что» ясно передаёт причинную связь.
- source_word: אָחִינוּ הוּא
  choice: Он наш брат
  rationale: Прямой эквивалент сохраняет риторический призыв к родственной солидарности через сихемскую мать Авимелеха. Более широкое «родственник» сняло бы намеренную формулировку оригинала.
