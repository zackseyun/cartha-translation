base_translation:
  language: en
  yaml_path: translation/ot/judges/009/040.yaml
  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
translation:
  language: ru
  text: Авимелех погнался за ним, и тот бежал от него. Многие были сражены вплоть до входа в ворота.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  choice: погнался за ним
  rationale: Глагол רדף обозначает преследование противника; «погнался за ним» естественно передаёт динамику военного преследования.
- source_word: וַיָּנָס מִפָּנָיו
  choice: и тот бежал от него
  rationale: נוס значит «бежать, спасаться бегством», а מִפָּנָיו указывает, от кого он бежал. «Тот» ясно разграничивает Гаала и Авимелеха без добавления имени, отсутствующего в стихе.
- source_word: וַיִּפְּלוּ חֲלָלִים רַבִּים
  choice: Многие пали убитыми
  rationale: Сочетание сохраняет образ נפל «падать» и явно передаёт חֲלָלִים как погибших или смертельно поражённых в бою; по-русски звучит естественно и торжественно.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: вплоть до входа в городские ворота
  rationale: עַד передано как «вплоть до», פֶּתַח — как «вход». «Городские» эксплицирует очевидное из контекста значение שַׁעַר — городских ворот, а не бытовой двери.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование краткое и динамичное. Сохранён библейский военный образ «пали убитыми», но устранена неестественная для русского калька «убитые пали».
