  text: And it was reported to Abimelech that all the leaders of the tower of Shechem had gathered together.
translation:
  language: ru
  text: Авимелеху донесли, что все предводители башни Сихема собрались вместе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: донесли
  rationale: Безличная форма естественно передаёт еврейский пассив «было сообщено», сохраняя неизвестность сообщившего.
- source_word: בַּעֲלֵי
  choice: предводители
  rationale: В данном контексте слово обозначает влиятельных представителей или руководителей общины, связанных с башней; буквальное «владельцы/господа» по-русски было бы неясно.
- source_word: מִגְדַּל שְׁכֶם
  choice: башни Сихема
  rationale: Сохранена конструкция принадлежности без уточнения, является ли «башня» сооружением или названием укреплённого поселения.
- source_word: הִתְקַבְּצוּ
  choice: собрались вместе
  rationale: Передаёт значение возвратного глагола «собрались»; «вместе» естественно подчёркивает совместность, заложенную в контексте.
