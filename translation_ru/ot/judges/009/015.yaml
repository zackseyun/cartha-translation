base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
translation:
  language: ru
  text: 'Тогда терновник[a] сказал деревьям: «Если вы и вправду помазываете меня царём над вами, придите и укройтесь в моей тени[b]. Если же нет, пусть выйдет огонь из терновника[c] и поглотит ливанские кедры».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «колючий куст». Еврейское слово обозначает колючий кустарник; точный его вид неизвестен.'
    reason: lexical_alternative
  - marker: b
    text: '«Укройтесь» можно также перевести как «ищите убежища». Эти слова могут звучать иронически: терновник почти не даёт тени.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «выйдет огонь из терновника». Еврейскую глагольную форму можно понять и как пожелание-проклятие, и как предсказание.'
    reason: textual_or_grammatical_ambiguity
lexical_decisions:
- source_word: הָאָטָד
  choice: терновник
  rationale: Еврейское слово обозначает колючий кустарник. «Терновник» естественно звучит по-русски, сохраняет образ басни и не вводит спорной ботанической конкретизации.
- source_word: אִם בֶּאֱמֶת
  choice: если вы и вправду
  rationale: Передаёт условие искренности и подлинности намерения естественным современным русским языком.
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ
  choice: помазываете меня царём
  rationale: Сохраняет конкретный политико-ритуальный глагол «помазывать», не сводя его значение к простому назначению.
- source_word: בֹּאוּ חֲסוּ בְצִלִּי
  choice: придите и укройтесь в моей тени
  rationale: Передаёт приглашение искать защиту; «в моей тени» сохраняет предметный образ и иронию, поскольку терновник почти не даёт тени.
- source_word: וְאִם אַיִן
  choice: если же нет
  rationale: Ясно и кратко вводит противоположное следствие условия.
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד
  choice: пусть выйдет огонь из терновника
  rationale: Сохраняет возможную юссивную, проклинающую силу древнееврейского имперфекта, не устраняя возможность предсказательного понимания, отмеченную в сноске.
- source_word: וְתֹאכַל
  choice: и пожрёт
  rationale: Образный глагол естественно сочетается с огнём и близко передаёт буквальный образ еврейского «есть, поглощать».
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: ливанские кедры
  rationale: Естественный русский эквивалент устойчивого обозначения величественных кедров Ливана.
theological_decisions:
- issue: Модальность слов об огне
  choice: «пусть выйдет огонь» как пожелание-проклятие
  alternative: «выйдет огонь» как предсказание
  rationale: Форма допускает юссивное и предсказательное прочтения. В основном тексте сохранена проклинающая сила высказывания, а альтернатива отмечена в сноске без догматического разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной образностью. Сохранены басенный параллелизм, царская терминология и контраст между ничтожным терновником и величественными ливанскими кедрами; архаизмы по возможности исключены.
