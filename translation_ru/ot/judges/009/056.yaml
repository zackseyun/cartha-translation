lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: воздал
  rationale: Каузативная форма глагола שוב здесь выражает возвращение содеянного зла на виновного, то есть воздаяние; «воздал» естественно передаёт судебный смысл и прямое действие Бога.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Форма אֱלֹהִים относится здесь к единому Богу Израиля, выступающему субъектом суда.
- source_word: רָעַת
  choice: за зло
  rationale: Слово обозначает нравственно злое деяние Авимелеха, а не только причинённый вред; сочетание «воздал за зло» ясно передаёт этот смысл.
- source_word: אֲבִימֶלֶךְ
  choice: Авимелеху
  rationale: Имя передано в принятой русской библейской форме; дательный падеж обусловлен глаголом «воздал».
- source_word: אֲשֶׁר עָשָׂה
  choice: которое тот причинил
  rationale: Указательное местоимение «тот» недвусмысленно относит действие к Авимелеху, а «причинил зло» естественно сочетается с обозначением пострадавшего лица.
- source_word: לְאָבִיו
  choice: своему отцу
  rationale: Предлог ל обозначает лицо, против которого или во вред которому было совершено зло; «своему отцу» сохраняет широкую связь, поясняемую следующим оборотом.
- source_word: לַהֲרֹג
  choice: убив
  rationale: Инфинитив поясняет, в чём состояло зло, причинённое отцу; деепричастие кратко и естественно выражает это отношение.
- source_word: שִׁבְעִים אֶחָיו
  choice: семьдесят своих братьев
  rationale: Передаёт число и родственную связь без добавления смысла «семьдесят из числа братьев».
- source_word: וַ
  choice: Так
  rationale: В заключительном повествовательном резюме союз имеет итоговый оттенок; «Так» естественно связывает Божье воздаяние с предшествующими событиями.
theological_decisions:
- issue: Божественное действие в суде
  choice: Бог прямо воздал Авимелеху за совершённое зло.
  alternative: Бог лишь допустил, чтобы зло Авимелеха вернулось к нему.
  rationale: В еврейском тексте Бог является явным субъектом каузативного глагола; перевод сохраняет прямое утверждение о Божьем судебном действии и не смягчает его до простого допущения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна обычному читателю; традиционная конструкция «воздал за зло» сохраняет судебный оттенок исходной идиомы. Маркер сноски поставлен после всего предложения.
