  text: Abimelech came up to the tower and fought against it, and he came near to the entrance of the tower to burn it with fire.
translation:
  language: ru
  text: Авимелех подошёл к башне и сражался с ней. Затем он приблизился ко входу в башню, чтобы сжечь её огнём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... עַד־הַמִּגְדָּל
  choice: подошёл к башне
  rationale: Сочетание בוא с עַד обозначает приближение вплоть до башни; русское «подошёл» естественно передаёт движение к объекту без добавления не выраженного в еврейском тексте подъёма.
- source_word: וַיִּלָּחֶם בּוֹ
  choice: вступил в бой с теми, кто был в ней
  rationale: Буквально местоимение означает «с ней/против неё», но башня подразумевает находившихся внутри защитников. Формулировка делает реальный объект боя понятным, сохраняя связь с башней.
- source_word: פֶּתַח הַמִּגְדָּל
  choice: входу в башню
  rationale: פֶּתַח здесь обозначает проём или вход; «вход» наиболее естественен в данном контексте.
- source_word: לְשָׂרְפוֹ בָאֵשׁ
  choice: чтобы сжечь её
  rationale: Инфинитив выражает цель. В русском глагол «сжечь» уже подразумевает огонь, поэтому буквальное «сжечь огнём» было бы избыточно; местоимение мужского рода в еврейском согласуется с מִגְדָּל, а в русском заменено женским по роду слова «башня».
