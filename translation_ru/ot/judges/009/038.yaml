base_translation:
  language: en
  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
translation:
  language: ru
  text: 'Тогда Зевул сказал ему: «Где же теперь твои уста[a] — ты ведь говорил: „Кто такой Авимелех, чтобы мы ему служили?“ Не тот ли это народ, который ты презирал? Выходи же теперь и сразись с ним!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Где же теперь твои уста?» Это насмешка над его прежними дерзкими речами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא פִיךָ
  choice: Где же теперь твои уста
  rationale: Сохранён яркий буквальный образ еврейской насмешки; частицы переданы сочетанием «же теперь», уместным для вызывающего вопроса.
- source_word: אֲשֶׁר תֹּאמַר
  choice: ты ведь говорил
  rationale: Форма прямого обращения естественно связывает насмешку Зевула с прежними дерзкими словами Гаала.
- source_word: מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ
  choice: Кто такой Авимелех, чтобы мы ему служили?
  rationale: «Кто такой» естественно передаёт пренебрежительный риторический вопрос, а конструкция «чтобы мы ему служили» сохраняет его смысл и силу.
- source_word: הֲלֹא זֶה הָעָם
  choice: Не тот ли это народ
  rationale: Сохранена форма риторического вопроса; «народ» передаёт собирательное הָעָם без преждевременного уточнения «войско».
- source_word: אֲשֶׁר מָאַסְתָּה בּוֹ
  choice: который ты презирал
  rationale: Глагол выражает отвержение с оттенком презрения; в контексте насмешки «презирал» передаёт этот оттенок точнее нейтрального «отвергал».
- source_word: צֵא נָא עַתָּה
  choice: Выходи же теперь
  rationale: «Же» передаёт побуждающе-насмешливую силу נָא, не превращая её в вежливое «пожалуйста».
- source_word: וְהִלָּחֶם בּוֹ
  choice: и сразись с ним
  rationale: Местоимение согласовано с собирательным существительным «народ» и сохраняет грамматическое единственное число еврейского текста; по смыслу речь идёт о сражении против этого народа.
