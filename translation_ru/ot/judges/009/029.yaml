  text: וּ/מִ֨י יִתֵּ֜ן אֶת הָ/עָ֤ם הַ/זֶּה֙ בְּ/יָדִ֔/י וְ/אָסִ֖ירָה אֶת אֲבִימֶ֑לֶךְ וַ/יֹּ֨אמֶר֙ לַ/אֲבִימֶ֔לֶךְ רַבֶּ֥ה צְבָאֲ/ךָ֖ וָ/צֵֽאָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/029.yaml
  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
translation:
  language: ru
  text: 'О, если бы этот народ оказался в моих руках[a]! Тогда я устранил бы Авимелеха. И он сказал Авимелеху[b]: «Умножь своё войско и выходи!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Более буквально: «Кто отдал бы этот народ в мои руки? Тогда я устранил бы Авимелеха». Еврейский оборот «кто дал бы…» выражает пожелание.'
    reason: lexical_alternative
  - marker: b
    text: Призыв «Умножь своё войско и выходи!» — вероятно, насмешливый вызов Авимелеху, произнесённый либо непосредственно ему, либо риторически.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  choice: О, если бы
  rationale: Еврейская идиома выражает сильное пожелание, а не обычный вопрос; современная русская конструкция естественно передаёт оптативное значение.
- source_word: הָעָם הַזֶּה
  choice: этот народ
  rationale: Сохраняется собирательное значение существительного в единственном числе; более узкое «войско» здесь не требуется контекстом.
- source_word: בְּיָדִי
  choice: в моих руках
  rationale: Сохранена понятная по-русски метафора власти и контроля, при этом число согласовано с естественной русской идиомой.
- source_word: וְאָסִירָה
  choice: я устранил бы
  rationale: Каузативная форма глагола סור означает устранить или удалить; формулировка намеренно не уточняет, идёт ли речь об изгнании, свержении или убийстве.
- source_word: וַיֹּאמֶר לַאֲבִימֶלֶךְ
  choice: И он сказал Авимелеху
  rationale: Предлог ל естественно обозначает адресата речи; формально сохраняется прямое обращение, хотя в контексте это может быть риторический вызов.
- source_word: רַבֶּה צְבָאֲךָ
  choice: Умножь своё войско
  rationale: Императив רבה требует сделать войско более многочисленным; «умножь» сохраняет конкретную семантику исходного глагола и высокий, но понятный регистр.
- source_word: וָצֵאָה
  choice: и выходи
  rationale: Императив יצא в обращённом к противнику вызове естественно передаётся русским «выходи».
