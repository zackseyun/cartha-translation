source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גַּ֣עַל בֶּן עֶ֗בֶד מִֽי אֲבִימֶ֤לֶךְ וּ/מִֽי שְׁכֶם֙ כִּ֣י נַעַבְדֶ֔/נּוּ הֲ/לֹ֥א בֶן יְרֻבַּ֖עַל וּ/זְבֻ֣ל פְּקִיד֑/וֹ עִבְד֗וּ אֶת אַנְשֵׁ֤י חֲמוֹר֙ אֲבִ֣י שְׁכֶ֔ם וּ/מַדּ֖וּעַ נַעַבְדֶ֥/נּוּ אֲנָֽחְנוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
translation:
  language: ru
  text: 'И сказал Гаал, сын Еведа: «Кто такой Авимелех и кто такой Сихем[c], чтобы мы служили ему? Разве Авимелех не сын Иероваала, а Зевул — его управитель[a]? Служите людям Хамора[b], отца Сихема! Почему же мы должны служить Авимелеху?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Управитель» можно также перевести как «наместник» или «назначенный им чиновник».
    reason: lexical_alternative
  - marker: b
    text: То есть людям, происходившим от Хамора или связанным с ним; Хамор назван отцом Сихема. Ср. Бытие 34.
    reason: cross_reference
  - marker: c
    text: 'Возможно: «что такое Сихем». В еврейском тексте прямо назван Сихем; вероятно, это имя метонимически обозначает город или его правящую общину.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם
  choice: Кто такой Авимелех и кто такой Сихем
  rationale: Повтор вопросительного מִי передаёт презрительный вызов статусу и законности власти. Прямое называние Сихема сохранено, хотя имя, вероятно, метонимически обозначает город или его правящую общину.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: чтобы мы служили ему
  rationale: עבד здесь означает политическое подчинение или службу, а не обычный труд. Формулировка сохраняет единственное число местоимения и риторический вопрос.
- source_word: הֲלֹא בֶן יְרֻבַּעַל
  choice: Разве Авимелех не сын Иероваала
  rationale: הֲלֹא вводит вопрос, предполагающий утвердительный ответ. Имя Авимелех повторено по-русски для ясности, поскольку в еврейском подлежащее подразумевается контекстом.
- source_word: פְּקִידוֹ
  choice: его управитель
  rationale: Слово обозначает назначенного должностного лица или подчинённого администратора. «Управитель» естественно звучит по-русски и не уточняет должность сверх исходного текста.
- source_word: עִבְדוּ
  choice: Служите
  rationale: Сохранено резкое повелительное наклонение во множественном числе.
- source_word: אַנְשֵׁי חֲמוֹר אֲבִי שְׁכֶם
  choice: людям Хамора, отца Сихема
  rationale: Буквальное «люди Хамора» может обозначать связанных с ним людей или потомков. Формулировка сохраняет родовую и историческую отсылку исходного текста.
- source_word: וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ
  choice: Почему же мы должны служить Авимелеху?
  rationale: «Же» передаёт возобновлённый, подчёркнутый вызов, а явное «мы» отражает эмфатическое אֲנָחְנוּ. Имя Авимелех употреблено вместо двусмысленного русского «ему», чтобы естественно обозначить ближайший политический объект служения в контексте.
