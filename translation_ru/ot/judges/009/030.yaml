  text: וַ/יִּשְׁמַ֗ע זְבֻל֙ שַׂר הָ/עִ֔יר אֶת דִּבְרֵ֖י גַּ֣עַל בֶּן עָ֑בֶד וַ/יִּ֖חַר אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
translation:
  language: ru
  text: Когда Зевул, начальник города, услышал слова Гаала, сына Еведа, он воспылал гневом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его нос разгорелся» — древнееврейское выражение, означающее сильный гнев.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: услышал
  rationale: В повествовательной последовательности форма продвигает рассказ; конструкция с «когда» естественно передаёт связь с последующей реакцией. Здесь שׁמע означает восприятие сказанного, а не послушание.
- source_word: זְבֻל
  choice: Зевул
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: שַׂר הָעִיר
  choice: начальник города
  rationale: שַׂר обозначает руководителя или высокопоставленное должностное лицо. «Начальник города» сохраняет широту значения и не навязывает конкретной современной административной должности.
- source_word: אֶת דִּבְרֵי
  choice: слова
  rationale: Сохраняется конкретное выражение древнееврейского текста; по-русски оно звучит естественно в данном контексте.
- source_word: גַּעַל בֶּן עָבֶד
  choice: Гаала, сына Еведа
  rationale: Имена переданы традиционной русской библейской формой, а патроним — естественной конструкцией «сына Еведа».
- source_word: וַיִּחַר אַפּוֹ
  choice: он воспылал гневом
  rationale: Русский фразеологизм передаёт образ разгорающегося гнева и смысл древнееврейской идиомы, не воспроизводя буквально непрозрачный образ пылающего носа.
