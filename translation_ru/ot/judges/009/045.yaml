base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
translation:
  language: ru
  text: Авимелех весь тот день сражался с городом[a]. Он захватил город, убил находившихся в нём людей, затем разрушил город и засеял его солью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «атаковал город». Еврейский глагол буквально означает «сражался»; с употреблённым здесь предлогом он, вероятно, указывает на военные действия против города.'
    reason: lexical_alternative
  - marker: b
    text: Засеять город солью — символическое действие, обозначающее его разорение.
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  choice: воевал против города
  rationale: Глагол לחם с предлогом ב в данном военном контексте обозначает враждебные действия против города. Такой перевод сохраняет буквальный образ борьбы и не сужает значение до одного нападения.
- source_word: כֹּל הַיּוֹם הַהוּא
  choice: весь тот день
  rationale: Естественно передаёт продолжительность действия и указание именно на тот день.
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: В повествовании о военных действиях לכד означает взятие города.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: находившихся в нём людей
  rationale: Передаёт население, бывшее внутри города, не превращая עָם в этническое обозначение.
- source_word: הָרָג
  choice: убил
  rationale: Прямой современный эквивалент без архаизации и без добавления отсутствующей в тексте образности.
- source_word: וַיִּתֹּץ
  choice: разрушил
  rationale: נתץ обозначает разрушение или снос; применительно к городу «разрушил» звучит естественно и точно.
- source_word: וַיִּזְרָעֶהָ מֶלַח
  choice: засеял его солью
  rationale: Сохраняет буквальный земледельческий образ глагола «сеять» и необычность намеренного символического действия.
