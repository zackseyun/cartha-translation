base_translation:
  language: en
  yaml_path: translation/ot/judges/009/014.yaml
  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
translation:
  language: ru
  text: 'Тогда все деревья сказали терновнику[a]: «Иди, царствуй над нами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «колючему кусту». Еврейское слово אָטָד обозначает колючий кустарник; точный ботанический вид неясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Тогда ... сказали
  rationale: Последовательная форма с וַ продвигает повествование; «тогда» естественно передаёт переход к следующему действию.
- source_word: כָל הָעֵצִים
  choice: все деревья
  rationale: Прямое и естественное соответствие собирательному подлежащему с определённым артиклем.
- source_word: אֶל הָאָטָד
  choice: терновнику
  rationale: אָטָד обозначает колючий кустарник без надёжно устанавливаемого точного ботанического вида; «терновник» сохраняет образ колючего куста и подходит к жанру притчи.
- source_word: לֵךְ אַתָּה
  choice: Иди
  rationale: Буквально «иди ты»; личное местоимение усиливает обращение, но в русском повелительная форма уже ясно выражает второе лицо. Императив служит призывом приступить к следующему действию.
- source_word: מְלָךְ
  choice: царствуй
  rationale: Глагол означает «царствовать, быть царём»; «царствуй» кратко сохраняет именно царский, а не просто общий властный смысл.
- source_word: עָלֵינוּ
  choice: над нами
  rationale: Обычное русское соответствие предлогу עַל при обозначении царствования или власти.
