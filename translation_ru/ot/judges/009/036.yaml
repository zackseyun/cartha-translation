base_translation:
  language: en
  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
translation:
  language: ru
  text: 'Когда Гаал увидел людей, он сказал Зевулу: «Смотри, с вершин гор спускаются люди». Зевул ответил ему: «Тень от гор ты принимаешь за людей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Обычное повествовательное значение глагола ראה в породе qal; форма передаёт завершённое действие в последовательности событий.
- source_word: הָעָם / עָם
  choice: людей / люди
  rationale: עָם здесь обозначает замеченную группу людей. Перевод «войско» или «воины» был бы контекстуально возможен, но добавлял бы уточнение, которого нет в еврейском тексте.
- source_word: הִנֵּה
  choice: Смотри
  rationale: Естественно передаёт разговорный призыв обратить внимание, не прибегая к архаичному «вот» или «се».
- source_word: יוֹרֵד
  choice: спускаются
  rationale: Хотя причастие стоит в единственном числе и согласуется с собирательным עָם, по-русски при переводе словом «люди» требуется множественное число.
- source_word: מֵרָאשֵׁי הֶהָרִים
  choice: с вершин гор
  rationale: רֹאשׁ применительно к горам означает вершину; краткая русская конструкция точно передаёт множественное число обеих форм.
- source_word: צֵל הֶהָרִים
  choice: тень от гор
  rationale: צֵל означает «тень» или «сень». В данном зрительном контексте «тень» является точным и естественным соответствием; предлог «от» проясняет обычное русское отношение между предметом и отбрасываемой им тенью.
- source_word: אַתָּה רֹאֶה כָּאֲנָשִׁים
  choice: ты принимаешь за людей
  rationale: 'Русский оборот естественно передаёт ошибочное зрительное восприятие: тень видится как люди, без добавления отсутствующего в тексте объяснения.'
- source_word: אֲנָשִׁים
  choice: людей
  rationale: В контексте речь идёт о человеческих фигурах; русское «людей» звучит естественнее, чем маркированное «мужчин», при этом не вводит военного обозначения.
