  text: וַ/יֵּ֨לֶךְ אֲבִימֶ֤לֶךְ בֶּן יְרֻבַּ֨עַל֙ שְׁכֶ֔מָ/ה אֶל אֲחֵ֖י אִמּ֑/וֹ וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֔ם וְ/אֶל כָּל מִשְׁפַּ֛חַת בֵּית אֲבִ֥י אִמּ֖/וֹ לֵ/אמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/001.yaml
  text: Abimelech son of Jerubbaal went to Shechem[a], to his mother's brothers, and spoke to them and to the whole clan of his mother's father's house, saying,
translation:
  language: ru
  text: 'Авимелех, сын Иероваала, пошёл в Сихем к братьям своей матери и обратился к ним и ко всему роду дома отца своей матери[a] с такими словами:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом отца его матери» означает семью или род, к которому Авимелех принадлежал по материнской линии.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Глагол передаёт последовательное развитие повествования; отдельное вводное «тогда» в еврейском тексте отсутствует и по-русски не требуется.
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבַּעַל
  choice: Авимелех, сын Иероваала
  rationale: Имена переданы принятой русской библейской транслитерацией, а родственная связь сохранена буквально.
- source_word: שְׁכֶמָה
  choice: в Сихем
  rationale: Направительный суффикс указывает на движение к городу; по-русски это естественно выражается сочетанием «в Сихем».
- source_word: אֶל אֲחֵי אִמּוֹ
  choice: к братьям своей матери
  rationale: Сохранено буквальное обозначение родства «братья матери», то есть дяди Авимелеха по матери, без поясняющей подмены в основном тексте.
- source_word: וַיְדַבֵּר אֲלֵיהֶם ... לֵאמֹר
  choice: 'обратился к ним ... с такими словами:'
  rationale: Естественная русская формула вводит прямую речь следующего стиха и одновременно передаёт значения «говорил им» и «сказав» без тяжеловесного повтора.
- source_word: וְאֶל כָּל מִשְׁפַּחַת
  choice: и ко всему роду
  rationale: מִשְׁפָּחָה здесь обозначает расширенную родственную группу, поэтому «род» точнее современного узкого значения слова «семья».
- source_word: בֵּית אֲבִי אִמּוֹ
  choice: дома отца своей матери
  rationale: Сохранён еврейский образ «дома» как семьи, хозяйства или родовой линии, а также точная материнская линия родства.
theological_decisions: []
