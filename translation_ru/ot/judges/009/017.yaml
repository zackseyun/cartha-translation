lexical_decisions:
- source_word: אֲשֶׁר
  choice: ведь
  rationale: В данном контексте частица связывает слова Иофама с предыдущим стихом и вводит основание для его упрёка. «Ведь» естественно передаёт эту причинно-пояснительную связь, не превращая фразу в отдельное предложение.
- source_word: נִלְחַם אָבִי עֲלֵיכֶם
  choice: отец мой сражался за вас
  rationale: Глагол означает «сражаться», а עֲלֵיכֶם здесь, как показывает последующее упоминание избавления от Мадиана, выражает действие ради слушателей, а не против них.
- source_word: וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד
  choice: рисковал жизнью
  rationale: Буквальный образ «бросил свою жизнь перед собой» является идиомой самоотверженного подвергания себя смертельной опасности. Русское «рисковал жизнью» ясно и естественно передаёт смысл, а исходный образ отмечен в сноске.
- source_word: וַיַּצֵּל
  choice: избавил
  rationale: В породе Hiphil глагол נצל означает вырвать из опасности, спасти или избавить. «Избавил» соответствует военному контексту и сохраняет привычную библейскую выразительность.
- source_word: מִיַּד מִדְיָן
  choice: из-под власти Мадиана
  rationale: Оборот «из руки» обозначает освобождение из-под власти или контроля. Смысловой перевод звучит естественно по-русски; буквальный образ сохранён в сноске.
