lexical_decisions:
- source_word: וַיָּשַׂר
  choice: правил
  rationale: Глагол שׂרר означает осуществлять власть, господствовать. «Правил» естественно передаёт политический смысл и не приписывает Авимелеху прямо титул царя.
- source_word: אֲבִימֶלֶךְ
  choice: Авимелех
  rationale: Традиционная русская передача личного имени.
- source_word: עַל יִשְׂרָאֵל
  choice: Израилем
  rationale: При русском глаголе «править» творительный падеж естественно выражает власть над народом, передавая значение עַל без тяжеловесной конструкции «над Израилем».
- source_word: שָׁלֹשׁ שָׁנִים
  choice: три года
  rationale: Прямое и идиоматичное обозначение продолжительности в русском языке.
theological_decisions:
- issue: Характер власти Авимелеха
  choice: правил
  alternative: царствовал
  rationale: В исходном тексте употреблён глагол שׂרר, а не обычный глагол «царствовать» מלך. Поэтому перевод сохраняет различие и не утверждает более определённый царский статус, чем выражено здесь.
