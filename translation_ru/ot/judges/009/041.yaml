lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: остался
  rationale: ישׁב может означать «сидеть, жить, оставаться». В данном повествовательном контексте «остался» естественно передаёт пребывание Авимелеха в Аруме, не предполагая непременно длительного поселения.
- source_word: בָּארוּמָה
  choice: в Аруме
  rationale: Название места передано принятой русской транслитерацией; предлог בְּ выражает местонахождение.
- source_word: וַיְגָרֶשׁ
  choice: изгнал
  rationale: גרשׁ означает «прогонять, изгонять». «Изгнал» передаёт решительное удаление без добавления идеи формального судебного наказания.
- source_word: זְבֻל
  choice: Зевул
  rationale: Личное имя передано в традиционной русской библейской форме.
- source_word: גַּעַל
  choice: Гаал
  rationale: Личное имя передано в традиционной русской библейской форме.
- source_word: אֶחָיו
  choice: его братьев
  rationale: Обычное значение אָח — «брат». Контекст не требует расширять смысл до «родственников» или «сторонников».
- source_word: מִשֶּׁבֶת
  choice: не дав им жить
  rationale: Сочетание מן с инфинитивом ישׁב выражает устранение или недопущение проживания. Такая передача естественна по-русски и ясно выражает результат изгнания.
- source_word: בִּשְׁכֶם
  choice: в Сихеме
  rationale: Название города передано в традиционной русской форме; предлог בְּ имеет местное значение.
