  text: וַ/יֵּ֥לֶךְ אֲבִימֶ֖לֶךְ אֶל תֵּבֵ֑ץ וַ/יִּ֥חַן בְּ/תֵבֵ֖ץ וַֽ/יִּלְכְּדָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/050.yaml
  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
translation:
  language: ru
  text: Затем Авимелех пошёл к Тевецу, расположился станом против Тевеца[a] и взял его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «расположился станом в Тевеце». Древнееврейский предлог допускает такое буквальное понимание, однако в данном военном контексте, вероятнее всего, имеется в виду, что Авимелех расположился станом против города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Обычное повествовательное значение הלך; вариант «двинулся походом» добавил бы военный оттенок, не выраженный самим глаголом.
- source_word: אֲבִימֶלֶךְ
  choice: Авимелех
  rationale: Традиционная русская передача личного имени.
- source_word: אֶל
  choice: к
  rationale: Предлог обозначает направленное движение к месту; враждебный характер действия раскрывается последующим контекстом.
- source_word: תֵּבֵץ
  choice: Тевец
  rationale: Традиционная русская библейская передача географического названия.
- source_word: וַיִּחַן בְּתֵבֵץ
  choice: расположился станом против Тевеца
  rationale: Глагол חנה означает расположиться станом. Хотя בְּ буквально может передаваться как «в», в военном контексте сочетание указывает на стоянку у города с целью нападения; «против» естественно выражает эту осадную позицию.
- source_word: וַיִּלְכְּדָהּ
  choice: взял его
  rationale: לכד часто обозначает взятие города. Местоимение мужского рода в русском согласуется с названием «Тевец», тогда как женский суффикс в древнееврейском относится к подразумеваемому слову «город».
