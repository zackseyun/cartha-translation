source:
  edition: WLC
  text: וְ/אֵ֗ת כָּל רָעַת֙ אַנְשֵׁ֣י שְׁכֶ֔ם הֵשִׁ֥יב אֱלֹהִ֖ים בְּ/רֹאשָׁ֑/ם וַ/תָּבֹ֣א אֲלֵי/הֶ֔ם קִֽלֲלַ֖ת יוֹתָ֥ם בֶּן יְרֻבָּֽעַל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/057.yaml
  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: ru
  text: И всё зло, совершённое жителями Сихема, Бог обратил на их головы, и постигло их проклятие Иофама, сына Иероваала.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  choice: обратил
  rationale: В породе хифиль глагол выражает то, что Бог заставил совершённое зло вернуться к виновным. «Обратил на их головы» естественно сохраняет причинность и образ исходного текста.
- source_word: רָעַת
  choice: всё зло, совершённое
  rationale: Существительное обозначает нравственное зло и злодеяния жителей Сихема. Добавленное по-русски причастие ясно связывает зло с их поступками, не сводя смысл к постигшему их бедствию.
- source_word: בְּרֹאשָׁם
  choice: на их головы
  rationale: Сохранён еврейский образ воздаяния, при котором последствия злодеяний возвращаются к самим виновникам.
- source_word: קִלֲלַת
  choice: проклятие
  rationale: Речь идёт о ранее произнесённом Иофамом проклятии; прямой русский эквивалент точен и понятен.
- source_word: וַתָּבֹא אֲלֵיהֶם
  choice: постигло их
  rationale: Так естественно по-русски передаётся наступление предсказанного проклятия и осуществление суда, хотя метафора движения выражена менее буквально.
- source_word: אַנְשֵׁי שְׁכֶם
  choice: жители Сихема
  rationale: В контексте выражение обозначает мужчин, представляющих городскую общину Сихема. «Жители» звучит естественно и не сужает значение до руководителей.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Слово употреблено с глаголом в единственном числе и обозначает Бога как действующего Судью.
- source_word: יוֹתָם בֶּן יְרֻבָּעַל
  choice: Иофама, сына Иероваала
  rationale: Сохранены традиционно узнаваемые русские формы библейских имён и прямое указание на родство.
theological_decisions:
- issue: Божественное воздаяние
  choice: Бог активно обратил зло жителей Сихема на их головы.
  alternative: Бог лишь допустил, чтобы их зло вернулось к ним.
  rationale: Бог является грамматическим субъектом הֵשִׁיב; исходный текст прямо приписывает Ему действие суда, поэтому перевод не смягчает его до простого попущения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Сохранён образ «на их головы»; инверсия во второй части устранена ради естественного русского порядка слов.
