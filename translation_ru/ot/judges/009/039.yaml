  text: So Gaal went out before the leaders of Shechem and fought against Abimelech[a].
translation:
  language: ru
  text: И Гаал выступил впереди правителей Сихема и сразился с Авимелехом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во главе правителей Сихема».'
    reason: Лִפְנֵי буквально означает «перед, впереди», но в данном контексте может указывать на положение предводителя.
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Форма Qal wayyiqtol от יצא передаёт обычное повествовательное действие выхода; «вышел» естественно в данном военном контексте.
- source_word: גַעַל
  choice: Гаал
  rationale: Личное имя передано принятой русской библейской транслитерацией.
- source_word: לִפְנֵי
  choice: впереди
  rationale: Сохраняет пространственное значение «перед, впереди» и одновременно допускает подразумеваемую в военном контексте руководящую роль, не устраняя неоднозначность.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: правителей Сихема
  rationale: Сочетание обозначает влиятельных представителей или полноправных руководителей города; «правители» передаёт общественно-политический смысл лучше, чем буквальное и неестественное здесь «владельцы».
- source_word: וַיִּלָּחֶם
  choice: вступил в бой
  rationale: Niphal wayyiqtol от לחם означает «сражаться, вести бой»; выбранная формулировка естественно продолжает описание выхода навстречу противнику.
- source_word: בַּאֲבִימֶלֶךְ
  choice: с Авимелехом
  rationale: При глаголе לחם предлог בְּ обозначает противника; в русском сочетание «вступил в бой с» ясно выражает противостояние.
