base_translation:
  language: en
  yaml_path: translation/ot/judges/009/019.yaml
  text: And if today you have acted in truth and integrity toward Jerubbaal and toward his house[a], rejoice in Abimelech[c][b], and let him also rejoice in you.
translation:
  language: ru
  text: И если сегодня вы честно и безупречно поступили с Иероваалом и с его домом, то радуйтесь Авимелеху, и пусть он тоже радуется вам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: И если
  rationale: Сохраняет союз и условную частицу, связывая стих с предшествующей условной речью Иофама.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: по правде и непорочно
  rationale: 'Передаёт два нравственных определения поступка: верность истине и цельность, безупречность поведения; формулировка естественна для возвышенной современной русской речи.'
- source_word: עֲשִׂיתֶם עִם
  choice: поступили с
  rationale: Обычный русский эквивалент еврейского оборота со значением «обошлись с кем-либо, поступили по отношению к кому-либо».
- source_word: יְרֻבַּעַל
  choice: Иероваал
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: בֵּיתוֹ
  choice: его домом
  rationale: Сохраняет образ исходного текста; «дом» здесь способен обозначать семью, род или династическую линию.
- source_word: הַיּוֹם הַזֶּה
  choice: сегодня
  rationale: Естественно передаёт буквальное «в этот день» без смысловой потери.
- source_word: שִׂמְחוּ בַּאֲבִימֶלֶךְ
  choice: радуйтесь Авимелеху
  rationale: Русский дательный после «радоваться» естественно передаёт радость об Авимелехе или из-за него, сохраняя риторическую иронию.
- source_word: וְיִשְׂמַח גַּם הוּא בָּכֶם
  choice: и пусть он тоже радуется вам
  rationale: Передаёт побудительно-желательное значение формы глагола и взаимность, выраженную параллельными конструкциями.
