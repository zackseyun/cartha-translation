base_translation:
  language: en
  yaml_path: translation/ot/judges/009/033.yaml
  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
translation:
  language: ru
  text: А утром, как только взойдёт солнце, встань пораньше и напади на город. И вот, когда он и люди, которые с ним, выйдут к тебе, поступи с ним так, как будет тебе по силам.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как найдёт твоя рука» — то есть насколько хватит сил или как позволит возможность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַבֹּקֶר
  choice: А утром
  rationale: Оборот вводит следующий этап указаний; краткая русская формулировка естественно передаёт временную последовательность.
- source_word: כִזְרֹחַ הַשֶּׁמֶשׁ
  choice: как только взойдёт солнце
  rationale: Временная конструкция указывает на начало действия с восходом солнца; «как только» уместно передаёт безотлагательность военного замысла.
- source_word: תַּשְׁכִּים
  choice: встань пораньше
  rationale: Каузативная форма от שׁכם в данном контексте означает рано подняться или рано начать действовать; последовательность инструкций требует повелительной формы.
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  choice: и напади на город
  rationale: В военном употреблении פשט означает совершить нападение или набег. «Напади» естественно и ясно передаёт действие, не навязывая спорной тактической детали вроде развёртывания.
- source_word: וְהִנֵּה
  choice: И вот
  rationale: Сохранён указательный маркер, привлекающий внимание к ожидаемому развитию событий.
- source_word: הוּא וְהָעָם אֲשֶׁר אִתּוֹ
  choice: он и люди, которые с ним
  rationale: Перевод сохраняет широкое значение עָם и не уточняет без необходимости, что речь именно о воинах.
- source_word: יֹצְאִים אֵלֶיךָ
  choice: выйдут к тебе
  rationale: Предлог אֶל передаёт направление «к»; враждебный характер движения уже понятен из военного контекста, поэтому он не добавлен прямо.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: поступи с ним
  rationale: Русское «поступи с ним» естественно передаёт буквальное «сделай ему», сохраняя единственное число местоимения.
- source_word: כַאֲשֶׁר תִּמְצָא יָדֶךָ
  choice: так, как будет тебе по силам
  rationale: Еврейская идиома буквально говорит о том, что «найдёт рука», то есть о доступной силе или возможности. В основном тексте передан смысл, а образ отмечен в сноске.
