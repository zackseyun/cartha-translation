  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֵּצֵ֥א הָ/עָ֖ם הַ/שָּׂדֶ֑ה וַ/יַּגִּ֖דוּ לַ/אֲבִימֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/042.yaml
  text: And it happened on the next day that the people went out into the field[a], and it was reported to Abimelek.
translation:
  language: ru
  text: На следующий день народ вышел в поле, и об этом сообщили Авимелеху.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и сообщили Авимелеху»; тот, кто сообщил, в еврейском тексте не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: На следующий день
  rationale: Естественно передаёт переход к следующему событию и временное выражение «на следующий день»; отдельное «и случилось» в современном русском здесь было бы избыточным.
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Обычное повествовательное значение глагола יצא; форма единственного числа согласуется с собирательным существительным «народ».
- source_word: הָעָם
  choice: народ
  rationale: Собирательное обозначение людей без ограничения только мужчинами.
- source_word: הַשָּׂדֶה
  choice: в поле
  rationale: Передаёт открытое пространство или возделываемую землю за городом; сочетание «вышел в поле» естественно по-русски.
- source_word: וַיַּגִּדוּ
  choice: об этом сообщили
  rationale: В еврейском тексте стоит третье лицо множественного числа с неопределённым субъектом — буквально «и сообщили»; русская неопределённо-личная конструкция сохраняет этот смысл естественно.
- source_word: לַאֲבִימֶלֶךְ
  choice: Авимелеху
  rationale: Передача собственного имени אֲבִימֶלֶךְ принятой русской библейской транслитерацией.
