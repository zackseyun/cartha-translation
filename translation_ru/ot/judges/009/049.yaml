revisions:
- from: Тогда и весь народ срубил — каждый по ветви[a], — и пошёл вслед за Авимелехом. Ветви сложили у укреплённого убежища[b] и подожгли над ними это убежище. Так погибли и все жители башни Сихема — около тысячи мужчин и женщин.
  to: И весь народ тоже срубил — каждый по ветви — и пошёл за Авимелехом. Они сложили ветви на внутреннем убежище и подожгли огнём убежище над ними. Так погибли и все жители башни Сихема — около тысячи мужчин и женщин.
  rationale: Исправлены направление размещения ветвей и синтаксис описания поджога. Сохранены собирательное согласование с «народом», неоднозначность редкого архитектурного термина и пространственное «над ними».
