  text: וַ/יִּכְרְת֨וּ גַם כָּל הָ/עָ֜ם אִ֣ישׁ שׂוֹכֹ֗/ה וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י אֲבִימֶ֨לֶךְ֙ וַ/יָּשִׂ֣ימוּ עַֽל הַ/צְּרִ֔יחַ וַ/יַּצִּ֧יתוּ עֲלֵי/הֶ֛ם אֶֽת הַ/צְּרִ֖יחַ בָּ/אֵ֑שׁ וַ/יָּמֻ֜תוּ גַּ֣ם כָּל אַנְשֵׁ֧י מִֽגְדַּל שְׁכֶ֛ם כְּ/אֶ֖לֶף אִ֥ישׁ וְ/אִשָּֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
translation:
  language: ru
  text: И весь народ тоже срубил — каждый по ветви — и пошёл за Авимелехом. Они сложили ветви на внутреннем убежище и подожгли огнём убежище над ними. Так погибли и все жители башни Сихема — около тысячи мужчин и женщин.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: срубил
  rationale: Глагол כרת здесь обозначает срезание или срубание древесных ветвей. Единственное число согласуется с собирательным «народ» в русском языке.
- source_word: אִישׁ שׂוֹכֹה
  choice: каждый по ветви
  rationale: Передаёт распределительное значение буквального оборота «каждый — свою ветвь», сохраняя единственное число существительного и звуча естественно по-русски.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  choice: пошёл вслед за Авимелехом
  rationale: Сохраняет конкретный образ еврейского «пошли за»; форма единственного числа обусловлена русским собирательным «народ».
- source_word: הַצְּרִיחַ
  choice: укреплённое убежище
  rationale: Редкое слово, по контексту обозначающее защищённое внутреннее помещение или укрытие башенного комплекса, а не всю башню, названную далее словом מִגְדָּל.
- source_word: וַיָּשִׂימוּ עַל הַצְּרִיחַ
  choice: ветви сложили у укреплённого убежища
  rationale: Предлог עַל может обозначать положение на сооружении или вплотную к нему. «У» естественно передаёт размещение горючего возле убежища, не утверждая излишне точную конструкцию здания.
- source_word: וַיַּצִּיתוּ עֲלֵיהֶם אֶת הַצְּרִיחַ בָּאֵשׁ
  choice: подожгли над ними это убежище
  rationale: Сохраняет пространственное «над ними» и связь местоимения с людьми, находившимися внутри или ниже, не заменяя образ более толковательным выражением.
- source_word: אַנְשֵׁי מִגְדַּל שְׁכֶם
  choice: жители башни Сихема
  rationale: Хотя אַנְשֵׁי формально означает «люди/мужи», последующее «мужчин и женщин» показывает, что речь обо всём находившемся там населении; «жители» избегает внутреннего противоречия.
- source_word: כְּאֶלֶף
  choice: около тысячи
  rationale: Префикс כ здесь выражает приблизительность.
- source_word: אִישׁ וְאִשָּׁה
  choice: мужчин и женщин
  rationale: Естественно передаёт парное обозначение обоих полов в числе погибших.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сдержанным повествовательным тоном. Собирательное «народ» последовательно согласовано с глаголами в единственном числе; во втором предложении использована безлично-пассивная перестройка, чтобы естественно продолжить описание общего действия. Редкий архитектурный термин передан функционально, а его неопределённость отмечена в сноске.
