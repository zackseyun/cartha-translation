base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
translation:
  language: ru
  text: Если же нет, пусть выйдет огонь от Авимелеха и пожрёт правителей Сихема[a] и Бет-Милло[b]; и пусть выйдет огонь от правителей Сихема и от Бет-Милло и пожрёт Авимелеха.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также возможно: «господа Сихема» или «владетели Сихема». Еврейское выражение обозначает влиятельных мужчин города, обладавших властью.'
    reason: lexical_alternative
  - marker: b
    text: Бет-Милло можно также передать как «дом Милло»; вероятно, это название места или связанной с Сихемом влиятельной группы.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  choice: Если же нет
  rationale: Кратко и естественно продолжает условие предыдущего стиха, сохраняя противопоставление и не добавляя отсутствующего в еврейском тексте уточнения.
- source_word: תֵּצֵא אֵשׁ
  choice: пусть выйдет огонь
  rationale: Форма yiqtol в контексте проклятия имеет побудительно-желательное значение; «пусть» передаёт его, не превращая высказывание в однозначное предсказание.
- source_word: וְתֹאכַל
  choice: и пожрёт
  rationale: Глагол אכל применительно к огню означает «пожирать, поглощать»; «пожрёт» естественно сохраняет яркий образ разрушительного огня.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: правителей Сихема
  rationale: В данном общественно-политическом контексте выражение обозначает влиятельных, властных мужей города. «Правители» ясно передаёт эту функцию, а более буквальная возможность отмечена в сноске.
- source_word: בֵּית מִלּוֹא
  choice: Бет-Милло
  rationale: Сочетание передано как собственное название места или связанной с ним группы; транслитерация сохраняет неопределённость референта.
- source_word: וְתֵצֵא אֵשׁ מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא
  choice: и пусть выйдет огонь от правителей Сихема и от Бет-Милло
  rationale: Симметричное построение сохраняет взаимный характер проклятия и параллелизм обеих половин стиха.
theological_decisions:
- issue: Характер образа огня
  choice: Сохранить конкретный образ огня в формуле проклятия без поясняющего истолкования в основном тексте.
  alternative: Передать огонь прямо как вооружённый конфликт либо явно назвать его Божьим судом.
  rationale: Текст говорит об огне и в контексте предвещает взаимное уничтожение, но не уточняет, следует ли понимать этот огонь буквально, образно или одновременно в обоих смыслах.
translation_notes:
  register: Современный литературный русский язык с торжественностью, уместной для формулы проклятия. Повтор и синтаксическая симметрия оригинала сохранены; имена переданы как Авимелех, Сихем и Бет-Милло.
