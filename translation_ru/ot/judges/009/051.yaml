base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
translation:
  language: ru
  text: Посреди города была укреплённая башня[a]. Туда убежали все мужчины и женщины и все знатные люди города[b]. Они заперлись внутри и поднялись на крышу башни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «башня силы»; то есть прочная башня, служившая укреплением.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все главные люди города». Буквально: «все владельцы (или господа) города» — выражение, вероятно обозначающее влиятельных горожан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: укреплённая башня
  rationale: Сочетание существительных «башня» и «сила» подчёркивает оборонительный характер сооружения. «Укреплённая башня» естественно звучит по-русски и ясно передаёт смысл.
- source_word: בְּתוֹךְ הָעִיר
  choice: посреди города
  rationale: Передаёт пространственное значение «в середине, посреди», не ослабляя его до общего «в городе».
- source_word: וַיָּנֻסוּ שָׁמָּה
  choice: туда убежали
  rationale: Глагол נוּס означает бегство от опасности; «убежали» прямо передаёт действие, не добавляя подразумеваемого «укрылись».
- source_word: כָּל הָאֲנָשִׁים וְהַנָּשִׁים
  choice: все мужчины и женщины
  rationale: Сохраняет явное упоминание обеих групп в еврейском тексте.
- source_word: וְכֹל בַּעֲלֵי הָעִיר
  choice: и все знатные люди города
  rationale: Буквально «владельцы/господа города»; в данном общественном контексте выражение обозначает влиятельных или главных горожан. Формулировка сохраняет отличие этой группы от уже названных мужчин и женщин.
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  choice: они заперлись внутри
  rationale: Еврейское выражение буквально описывает закрытие за собой; русское «заперлись внутри» естественно передаёт самоизоляцию без добавления отсутствующего в тексте объекта, например двери.
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  choice: поднялись на крышу башни
  rationale: עָלָה означает «подняться», а גַּג — именно «крыша», а не просто верх сооружения.
