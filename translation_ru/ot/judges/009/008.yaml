  text: The trees once went to anoint a king over themselves[a], and they said to the olive tree, ‘Reign over us.’
translation:
  language: ru
  text: 'Однажды деревья отправились[a] помазать над собой царя и сказали маслине: «Царствуй над нами».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте употреблено усилительное сочетание, буквально: «идя пошли». Оно подчёркивает действие; возможные варианты передачи: «решительно отправились» или «вышли».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ הָלְכוּ
  choice: Однажды … отправились
  rationale: Сочетание абсолютного инфинитива с личной формой глагола подчёркивает действие. В русском повествовании «однажды … отправились» естественно вводит притчу и передаёт отмеченность оборота без буквального и неестественного повтора «идя пошли».
- source_word: הָעֵצִים
  choice: деревья
  rationale: Форма множественного числа обозначает деревья, выступающие действующими лицами притчи.
- source_word: לִמְשֹׁחַ
  choice: помазать
  rationale: Глагол משׁח обозначает помазание, в данном случае — возведение на царство; конкретный образ оригинала сохранён, а не заменён общим «назначить».
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: себе царя
  rationale: Буквально речь идёт о царе «над ними». Русское «помазать себе царя» естественно выражает цель деревьев поставить царя, который будет властвовать над ними; последующее «над нами» сохраняет образ власти.
- source_word: לַזַּיִת
  choice: маслине
  rationale: זית может обозначать оливу или оливковое дерево. «Маслина» — литературное русское название дерева и естественный одушевлённый участник притчи.
- source_word: מלוכה עָלֵינוּ
  choice: Царствуй над нами
  rationale: Повелительная форма מלך означает «царствовать, быть царём», а על указывает на власть над подданными. Формулировка точна и естественна по-русски.
