lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Тогда ... сказали
  rationale: Последовательная форма с waw продвигает повествование; «тогда» естественно передаёт очередность событий по-русски.
- source_word: הָעֵצִים
  choice: деревья
  rationale: В контексте притчи Иофама множественное число עֵץ обозначает деревья, а не древесину.
- source_word: לַגָּפֶן
  choice: виноградной лозе
  rationale: גֶּפֶן обозначает виноградную лозу; полная форма ясна современному читателю и сохраняет олицетворение.
- source_word: לְכִי
  choice: Иди
  rationale: Женская форма повелительного наклонения глагола הלך буквально означает «иди»; в русском сочетание «иди, царствуй» звучит естественно и сохраняет образ исходного текста.
- source_word: אַתְּ
  choice: не выражено отдельно
  rationale: Местоимение второго лица женского рода подчёркивает адресата, но в русском оно естественно подразумевается формой повелительного наклонения; отдельное «ты» придало бы ненужную контрастную эмфазу.
- source_word: מְלֹכִי
  choice: царствуй
  rationale: Женская форма императива от מלך выражает осуществление царской власти; «царствуй» формально и естественно соответствует глаголу и согласуется с «лозой».
- source_word: עָלֵינוּ
  choice: над нами
  rationale: При глаголе מלך предлог עַל обозначает объект или сферу власти; нормативное русское соответствие — «царствовать над».
