  source_fidelity: 'Перевод точно передаёт повествовательную последовательность: израильтяне увидели, что Авимелех мёртв, после чего каждый ушёл. «Когда» естественно связывает два еврейских wayyiqtol в русском повествовании; «увидели, что» верно передаёт כִּי как содержание восприятия. «К себе» не навязывает значения «дом» и сноской сохраняет буквальное «к своему месту».'
