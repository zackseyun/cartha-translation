source:
  edition: WLC
  text: וַ/יִּרְא֥וּ אִֽישׁ יִשְׂרָאֵ֖ל כִּ֣י מֵ֣ת אֲבִימֶ֑לֶךְ וַ/יֵּלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/055.yaml
  text: When the men of Israel saw that Abimelech was dead[a], each went to his own place.
translation:
  language: ru
  text: Когда израильтяне увидели, что Авимелех мёртв, каждый пошёл к себе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый — к своему месту».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: увидели
  rationale: Основное значение ראה в повествовательной последовательности — зрительное восприятие, ведущее к осознанию; «увидели» естественно передаёт оба оттенка в данном контексте.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: израильтяне
  rationale: Единственное אִישׁ употреблено собирательно, что подтверждает глагол во множественном числе. В современном русском «израильтяне» звучит естественнее буквального «мужи Израиля»; контекст военного отряда подразумевает мужчин.
- source_word: כִּי
  choice: что
  rationale: 'כִּי вводит содержание восприятия: они увидели, что Авимелех мёртв.'
- source_word: מֵת
  choice: мёртв
  rationale: Форма описывает состояние Авимелеха в момент восприятия, а не акцентирует событие смерти; именная конструкция «Авимелех мёртв» близка еврейской.
- source_word: אֲבִימֶלֶךְ
  choice: Авимелех
  rationale: Имя передано в принятой русской библейской форме.
- source_word: וַיֵּלְכוּ
  choice: пошёл
  rationale: 'Еврейский глагол стоит во множественном числе, но при распределительном אִישׁ по-русски естественно единственное число: «каждый пошёл». Значение «пошёл» не добавляет идеи возвращения, прямо не выраженной в тексте.'
- source_word: אִישׁ לִמְקֹמוֹ
  choice: каждый пошёл к себе
  rationale: Повторное אִישׁ имеет распределительное значение «каждый». «К себе» естественно передаёт «к своему месту», не сужая מָקוֹם до значения «дом».
theological_decisions: []
translation_notes:
  register: Современный литературный русский, лаконичный повествовательный стиль. «Израильтяне» избегает архаичного «мужи Израиля», а «к себе» идиоматично передаёт еврейское לִמְקֹמוֹ без неоправданного уточнения «домой».
