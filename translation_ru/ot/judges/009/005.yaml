base_translation:
  language: en
  yaml_path: translation/ot/judges/009/005.yaml
  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: ru
  text: Затем он пришёл к дому своего отца в Офре и убил своих братьев, сыновей Иероваала, — семьдесят человек — на одном камне.[a] Но Иофам, самый младший сын Иероваала, остался в живых, потому что спрятался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «на одном камне», вероятно, указывает на один камень или на единое место, где были совершены все казни.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא בֵית אָבִיו עָפְרָתָה
  choice: Затем он пришёл в дом своего отца, в Офру
  rationale: Глагол передаёт прибытие, а направительное окончание в названии места — движение к Офре. Формулировка сохраняет как конкретный дом отца, так и указание места.
- source_word: וַיַּהֲרֹג
  choice: убил
  rationale: Нейтральный основной эквивалент не добавляет к глаголу юридической квалификации, хотя контекст ясно показывает преступный характер действия.
- source_word: אֶת אֶחָיו בְּנֵי יְרֻבַּעַל
  choice: своих братьев, сыновей Иероваала
  rationale: Сохранено приложение, отождествляющее братьев с сыновьями Иероваала.
- source_word: שִׁבְעִים אִישׁ
  choice: семьдесят человек
  rationale: После числительного אִישׁ уместно передать словом «человек»; оно естественно по-русски и не меняет мужской состав группы, уже обозначенной как сыновья.
- source_word: עַל אֶבֶן אֶחָת
  choice: на одном камне
  rationale: Буквальная и выразительная передача сохраняет суровый образ единого места или орудия казни, не уточняя того, чего не уточняет еврейский текст.
- source_word: וַיִּוָּתֵר
  choice: остался в живых
  rationale: В данном контексте глагол означает, что Иофам уцелел после убийства остальных; явное «в живых» естественно передаёт подразумеваемый результат.
- source_word: הַקָּטֹן
  choice: младший
  rationale: 'В семейном контексте это естественное значение прилагательного: младший из сыновей.'
- source_word: כִּי נֶחְבָּא
  choice: потому что спрятался
  rationale: Придаточное указывает причину его спасения; возвратная форма естественно передаёт контекстуальное значение нифаля.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование звучит ясно и сдержанно. Синтаксис близок к еврейскому тексту, но не архаичен. Имя יְרֻבַּעַל передано традиционной русской библейской формой «Иероваал», יוֹתָם — «Иофам», עָפְרָה — «Офра».
