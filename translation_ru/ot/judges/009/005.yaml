  source_fidelity: 'Основной смысл передан точно: Авимелех приходит к дому отца в Офре, убивает братьев — сыновей Иероваала — числом семьдесят на одном камне; Иофам, младший сын Иероваала, остаётся в живых, скрывшись. Однако «пришёл в дом ... в Офру» двусмысленно и слегка смещает направительное значение עָפְרָתָה: Офра является пунктом назначения, а не просто приложением к «дому».'
