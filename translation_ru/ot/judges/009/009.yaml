base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
translation:
  language: ru
  text: 'Но маслина ответила им: «Неужели я оставлю своё масло[a], которым чтут богов и людей[b], и пойду качаться над деревьями?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «свою тучность» — образное обозначение богатого плода маслины, то есть оливкового масла.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «которым воздают честь Богу и людям». Еврейское אֱלֹהִים по форме множественное и может означать «богов», но в некоторых толкованиях понимается как обозначение единого Бога. Возможен и иной синтаксический разбор: «которое чтут боги и люди».'
    reason: alternative_reading
lexical_decisions:
- source_word: הַזַּיִת
  choice: маслина
  rationale: В контексте басни существительное обозначает оливковое дерево как действующее лицо; русское «маслина» естественно называет и дерево, и соответствующий образ.
- source_word: הֶחֳדַלְתִּי
  choice: неужели я оставлю
  rationale: Перфект употреблён в риторическом вопросе после предложения деревьев. Эта формулировка естественно передаёт отказ маслины отказаться от своего плода.
- source_word: דִּשְׁנִי
  choice: своё драгоценное масло
  rationale: Буквально слово означает «мой тук, мою тучность», а применительно к маслине указывает на её ценное масло. Конкретизация делает образ понятным современному читателю; буквальная метафора отмечена в сноске.
- source_word: אֲשֶׁר בִּי
  choice: которым
  rationale: 'Относительное выражение имеет инструментальный смысл: честь воздают посредством продукта маслины.'
- source_word: יְכַבְּדוּ
  choice: воздают честь
  rationale: Активная форма с невыраженным множественным субъектом естественно передаётся по-русски неопределённо-личной конструкцией.
- source_word: אֱלֹהִים
  choice: Богу
  rationale: В сочетании с неопределённо-личным «воздают честь» слово понимается как объект в единственном значении «Бог»; это соответствует использованию оливкового масла в богопочитании. Формально возможное множественное понимание сохранено в сноске.
- source_word: וַאֲנָשִׁים
  choice: и людям
  rationale: Обобщающее «людям» точно и естественно передаёт множественное אֲנָשִׁים в паре с Богом.
- source_word: וְהָלַכְתִּי
  choice: и пойду
  rationale: Продолжает единый риторический вопрос и сохраняет образ добровольного оставления прежнего назначения.
- source_word: לָנוּעַ
  choice: колыхаться
  rationale: Сохраняет буквальный образ движения дерева из стороны в сторону и одновременно иронически намекает на возвышенное положение правителя.
- source_word: עַל הָעֵצִים
  choice: над деревьями
  rationale: Предлог עַל здесь указывает на положение над другими деревьями, то есть на предложенное господство над ними.
theological_decisions:
- issue: Значение אֱלֹהִים и синтаксис выражения יְכַבְּדוּ אֱלֹהִים וַאֲנָשִׁים
  choice: «которым воздают честь Богу и людям»
  alternative: «которым боги и люди прославляются» или «которое чтут боги и люди»
  rationale: 'אֱלֹהִים допускает как единственное значение «Бог», так и формально множественное «боги». Активный глагол во множественном числе может иметь невыраженный неопределённый субъект: «им чтут Бога и людей». Употребление масла при посвящении Богу и людям поддерживает это традиционное прочтение, однако грамматическая неоднозначность не устраняется и отмечается в сноске.'
translation_notes:
  register: Современный литературный русский язык с достоинством басенного повествования. «Маслина» и «колыхаться над деревьями» сохраняют древесную образность; архаичное и неясное для большинства читателей «тук» вынесено в сноску.
