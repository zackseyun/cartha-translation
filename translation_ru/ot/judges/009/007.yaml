base_translation:
  language: en
  yaml_path: translation/ot/judges/009/007.yaml
  text: And they told Jotham[a], and he went and stood on the top of Mount Gerizim, and he lifted up his voice and called out and said to them, “Listen to me, leaders of Shechem[b], that God may listen to you.”
translation:
  language: ru
  text: 'Иофаму сообщили, и он пошёл, встал на вершине горы Гаризим, возвысил голос и воззвал к ним: «Послушайте меня, влиятельные люди Сихема[a], чтобы и Бог услышал вас[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «господа» или «хозяева Сихема»; речь, вероятно, идёт о влиятельных членах городской общины.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и да услышит вас Бог».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּדוּ לְיוֹתָם
  choice: Когда об этом сообщили Иофаму
  rationale: Безлично-множественная конструкция естественно передаёт неопределённое «они сообщили»; «об этом» восполняет подразумеваемое содержание сообщения из контекста.
- source_word: וַיֵּלֶךְ וַיַּעֲמֹד
  choice: он пошёл, встал
  rationale: Сохраняется последовательность простых повествовательных форм без излишней стилизации.
- source_word: בְּרֹאשׁ הַר גְּרִזִים
  choice: на вершине горы Гаризим
  rationale: רֹאשׁ в топографическом употреблении означает вершину; «гора Гаризим» — ясная современная форма топонима.
- source_word: וַיִּשָּׂא קוֹלוֹ וַיִּקְרָא
  choice: возвысил голос и воззвал
  rationale: Передаёт как повышение голоса, так и громкое публичное обращение; сохраняет два еврейских глагола.
- source_word: שִׁמְעוּ אֵלַי
  choice: Послушайте меня
  rationale: Естественный современный русский эквивалент повелительной формы שמע с предлогом אֶל.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: правители Сихема
  rationale: בְּעָלִים буквально обозначает господ, хозяев или власть имущих; в данном контексте речь идёт о руководящей группе Сихема, поэтому «правители» ясно передаёт функцию без феодального оттенка слова «господа».
- source_word: וְיִשְׁמַע אֲלֵיכֶם אֱלֹהִים
  choice: чтобы и Бог послушал вас
  rationale: Целевое прочтение связывает отклик Бога с призывом слушать Иофама. Частица «и» естественно выражает риторическую взаимность, не добавляя нового содержания.
theological_decisions:
- issue: Смысл заключительной фразы Иофама
  choice: «чтобы и Бог послушал вас» — цель или ожидаемый результат
  alternative: «и да послушает вас Бог» — самостоятельное пожелание
  rationale: Союз וְ перед имперфектом допускает оба понимания. Основной текст отражает риторическую связь между двумя употреблениями שמע, а примечание сохраняет возможность пожелательного прочтения.
translation_notes:
  register: 'Современный литературный русский с достоинством библейского повествования. Синтаксис слегка сглажен ради естественности: начальная цепочка с многократным «и» передана временным придаточным и последовательностью сказуемых. Формула «возвысил голос и воззвал» сохраняет торжественность публичного обращения, оставаясь понятной современному читателю.'
