  to: 'Иофаму сообщили, и он пошёл, встал на вершине горы Гаризим, возвысил голос и воззвал к ним: «Послушайте меня, влиятельные люди Сихема[a], чтобы и Бог услышал вас[b]!»'
  rationale: Убраны добавленные «когда» и «об этом», а значение בעלי передано без сужения до официальных правителей. «Услышал вас» естественно передаёт обращённое к Богу значение שמע и избегает русской двусмысленности «послушал вас». Сноска сохраняет альтернативное, пожелательное прочтение заключительного союза с имперфектом.
