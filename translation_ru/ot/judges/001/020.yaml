base_translation:
  language: en
  yaml_path: translation/ot/judges/001/020.yaml
  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
translation:
  language: ru
  text: Хеврон отдали Халеву, как сказал Моисей, и Халев изгнал оттуда трёх сыновей Анака.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трёх потомков Анака» или «трёх анакитов». В еврейском тексте буквально: «трёх сыновей Анака»; речь может идти не о непосредственных сыновьях, а о потомках или представителях рода.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ לְכָלֵב אֶת חֶבְרוֹן
  choice: Хеврон отдали Халеву
  rationale: Глагол נתן передан обычным повествовательным прошедшим временем; порядок слов естественен для русского языка и ясно выражает передачу Хеврона Халеву.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: как сказал Моисей
  rationale: Сохраняет прямое значение דִּבֶּר «сказал/говорил», не усиливая его до «обещал».
- source_word: וַיּוֹרֶשׁ
  choice: изгнал
  rationale: Хифиль глагола ירש в данном контексте означает вытеснить или изгнать жителей; явное повторение имени «Халев» устраняет возможную для русского читателя неясность местоимения.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Естественно отсылает к названному ранее Хеврону и точно соответствует еврейскому наречному выражению.
- source_word: אֶת שְׁלֹשָׁה בְּנֵי הָעֲנָק
  choice: трёх сыновей Анака
  rationale: Сохраняет буквальный образ בְּנֵי «сыновья», а возможное значение потомков или представителей рода отмечено в сноске.
