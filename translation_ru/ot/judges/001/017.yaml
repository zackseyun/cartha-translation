base_translation:
  language: en
  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: ru
  text: И пошёл Иуда с Симеоном, своим братом, и они поразили хананеев, живших в Цефате, и предали город заклятию[a]; и он назвал этот город Хормой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «полностью уничтожили город», «обрекли город на уничтожение». Древнееврейский глагол означает безвозвратно посвятить что-либо, обычно посредством уничтожения.'
    reason: alternative_reading
  - marker: b
    text: Название «Хорма» созвучно древнееврейскому слову херем («предание заклятию»); это объясняет название города.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶת שִׁמְעוֹן אָחִיו
  choice: И пошёл Иуда с Симеоном, братом своим
  rationale: После глагола הלך предлог אֶת выражает здесь совместность. Названия Иуда и Симеон сохранены без поясняющего добавления «колено», хотя в контексте они обозначают колена.
- source_word: וַיַּכּוּ אֶת הַכְּנַעֲנִי
  choice: они поразили хананеев
  rationale: נכה в военном контексте означает нанести поражение, разить; «поразили» сохраняет силу выражения, не сводя его однозначно ни к победе, ни к поголовному убийству. Единственное число הַכְּנַעֲנִי имеет собирательное значение.
- source_word: יוֹשֵׁב צְפַת
  choice: живших в Цефате
  rationale: Причастие ישב обозначает проживание; русское множественное число согласовано с собирательным «хананеев».
- source_word: וַיַּחֲרִימוּ אוֹתָהּ
  choice: предали город заклятию
  rationale: Форма от חרם выражает безвозвратное посвящение, обычно осуществляемое посредством уничтожения. «Предали заклятию» сохраняет сакрально-военную напряжённость термина; явное «город» естественно передаёт женское местоимение, относящееся к Цефату.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: он назвал этот город
  rationale: Сохранено морфологическое единственное число глагола «он назвал», вероятно относящееся к Иуде как собирательному или представительному субъекту. Русская формула именования передана естественно, без буквального «назвал имя города».
- source_word: חָרְמָה
  choice: Хорма
  rationale: Топоним транслитерирован; его созвучие с корнем חרם пояснено в сноске.
theological_decisions:
- issue: Передача חרם в контексте священной войны
  choice: предали город заклятию
  alternative: полностью уничтожили город / обрекли город на уничтожение
  rationale: Выбранная формулировка удерживает одновременно смысл безвозвратного посвящения и связанного с ним уничтожения, не сводя древнееврейский термин только к военному разгрому.
- issue: Число субъекта при וַיִּקְרָא
  choice: он назвал
  alternative: они назвали
  rationale: В исходном тексте глагол стоит в единственном числе. Это сохранено, хотя по смыслу субъектом может быть Иуда как колено или представитель совместно действующих групп.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Порядок слов в начале слегка формальный, но понятный; техническое «заклятие» сопровождено поясняющей сноской. Единственное число «он назвал» намеренно сохраняет форму древнееврейского текста.
