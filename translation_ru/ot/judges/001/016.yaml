source:
  edition: WLC
  text: וּ/בְנֵ֣י קֵינִי֩ חֹתֵ֨ן מֹשֶׁ֜ה עָל֨וּ מֵ/עִ֤יר הַ/תְּמָרִים֙ אֶת בְּנֵ֣י יְהוּדָ֔ה מִדְבַּ֣ר יְהוּדָ֔ה אֲשֶׁ֖ר בְּ/נֶ֣גֶב עֲרָ֑ד וַ/יֵּ֖לֶךְ וַ/יֵּ֥שֶׁב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/016.yaml
  text: And the descendants of the Kenite[a], Moses’ father-in-law, went up from the City of Palms with the descendants of Judah into the wilderness of Judah, which is in the Negev of Arad[d][c][b]; then he went and settled with the people.
translation:
  language: ru
  text: А потомки кенеянина[a], тестя Моисея, поднялись из Города Пальм[b] вместе с потомками Иуды в Иудейскую пустыню, которая находится в Негеве близ Арада; и он пошёл и поселился с этим народом[c][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родственника Моисея по браку». Еврейское слово может обозначать не только тестя, хотя здесь значение «тесть» наиболее вероятно.'
    reason: lexical_alternative
  - marker: b
    text: Под Городом Пальм обычно понимается Иерихон.
    reason: cross_reference
  - marker: c
    text: 'В еврейском тексте здесь происходит переход к единственному числу: «он пошёл и поселился». Возможно, речь идёт о кенеянском роде как о едином целом; некоторые толкователи понимают выражение во множественном смысле.'
    reason: grammatical_ambiguity
  - marker: d
    text: 'Возможно также: «среди народа». Некоторые древние свидетели текста читают здесь «с Амаликом» вместо «с этим народом».'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי קֵינִי
  choice: А потомки кенеянина
  rationale: בְּנֵי в родоплеменном контексте обозначает потомков или членов рода; קֵינִי — форма единственного числа, буквально «кенеянин», выступающая как обозначение родоначальника или рода.
- source_word: חֹתֵן מֹשֶׁה
  choice: тестя Моисея
  rationale: חֹתֵן чаще всего означает отца жены; более широкая возможность родства по браку сохранена в примечании.
- source_word: עָלוּ
  choice: поднялись
  rationale: Сохраняет обычное значение עלה и возможный топографический оттенок движения вверх.
- source_word: מֵעִיר הַתְּמָרִים
  choice: из Города Пальм
  rationale: Передаёт употреблённое в еврейском тексте описательное название, не подменяя его вероятным географическим отождествлением.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: вместе с потомками Иуды
  rationale: אֶת здесь имеет сопроводительное значение «с»; בְּנֵי обозначает племенных потомков.
- source_word: מִדְבַּר יְהוּדָה
  choice: в Иудейскую пустыню
  rationale: Естественное русское географическое наименование и обозначение направления движения.
- source_word: אֲשֶׁר בְּנֶגֶב עֲרָד
  choice: которая находится в Негеве близ Арада
  rationale: נֶגֶב передано как название южного региона; конструкция с Арадом указывает на относящуюся к нему местность, что по-русски ясно выражено словом «близ».
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: и он пошёл и поселился
  rationale: Сохранён морфологически значимый переход от множественного числа к единственному, без молчаливого согласования.
- source_word: אֶת הָעָם
  choice: с этим народом
  rationale: Ассоциативное אֶת передано предлогом «с»; указательное «этим» естественно передаёт определённость הָעָם, не устанавливая однозначно, какой именно народ имеется в виду.
theological_decisions:
- issue: Переход от множественного числа к единственному в וַיֵּלֶךְ וַיֵּשֶׁב
  choice: сохранить «он пошёл и поселился»
  alternative: гармонизировать как «они пошли и поселились»
  rationale: Масоретский текст действительно переходит к единственному числу; перевод сохраняет эту неоднозначность, допускающую коллективное понимание кенеянина/рода.
- issue: Чтение אֶת הָעָם
  choice: следовать масоретскому «с этим народом»
  alternative: «с Амаликом» по некоторым древним свидетельствам
  rationale: Основной текст переводится по WLC; древнее альтернативное чтение отмечено, но не внесено в текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Сохранены географические названия и заметный переход к единственному числу; архаизмы «сыны», «обитал» и «тесть Моисеев» не использованы.
