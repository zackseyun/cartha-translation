    rationale: Определённый артикль в הָאָרֶץ не требует русского указательного местоимения. «Земли» точнее сохраняет исходную формулировку и естественно в данном приложении.
  revised_text: И жили ашеритяне среди хананеев, жителей земли, потому что не изгнали их.
