  text: וַ/יֵּ֨שֶׁב֙ הָ/אָ֣שֵׁרִ֔י בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּ֖י לֹ֥א הוֹרִישֽׁ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
translation:
  language: ru
  text: И жили ашеритяне среди хананеев, жителей земли, потому что не изгнали их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: поселились
  rationale: Глагол ישׁב означает «сидеть, жить, обитать, поселиться»; здесь речь идёт о проживании племени среди хананеев. «Поселились» естественно передаёт повествовательный контекст.
- source_word: הָאָשֵׁרִי
  choice: асиритяне
  rationale: Форма единственного числа с артиклем имеет собирательное значение и обозначает людей племени Асира; русское множественное число ясно передаёт этот смысл.
- source_word: בְּקֶרֶב
  choice: среди
  rationale: Предлог с существительным обозначает пребывание внутри некоторой группы; «среди» кратко и естественно передаёт это значение.
- source_word: הַכְּנַעֲנִי
  choice: хананеи
  rationale: Морфологически это единственное число, употреблённое собирательно. Следующее определение стоит во множественном числе, поэтому «хананеи» точно передаёт подразумеваемую общность.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: жители той земли
  rationale: Причастный оборот поясняет, кто такие хананеи. Указательное «той» естественно отсылает к уже названной в контексте земле, не меняя смысла определённого артикля.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину того, почему асиритяне жили среди хананеев.
- source_word: לֹא הוֹרִישׁוֹ
  choice: не изгнали их
  rationale: Порода Hiphil глагола ירשׁ в данном контексте означает лишить владения или вытеснить жителей. «Не изгнали их» звучит естественно и сохраняет смысл; множественные формы передают собирательные субъект и объект.
theological_decisions:
- issue: Собирательное единственное число в обозначениях племени и народа
  choice: 'Передать собирательные формы естественным русским множественным числом: «асиритяне», «хананеи», «не изгнали их».'
  alternative: 'Формально сохранить единственное число: «асиритянин жил среди хананеянина… он не лишил его владения».'
  rationale: Буквальное единственное число в русском создало бы ошибочное впечатление, будто речь идёт о двух отдельных людях. Контекст описывает племя и народ как общности; множественное число сохраняет смысл исходного текста, а примечание отмечает его грамматическую форму.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно торжественное. Синтаксис сохраняет причинную связь исходного текста, а собирательные формы переданы без вводящей в заблуждение буквальности.
