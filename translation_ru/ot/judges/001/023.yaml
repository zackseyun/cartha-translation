  text: Дом Иосифа разведал Вефиль[a]; прежде этот город назывался Луз.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обследовал Вефиль», «провёл разведку в Вефиле». Еврейский глагол в этом контексте обозначает разведку или рекогносцировку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּתִירוּ
  choice: послал разведчиков
  rationale: Редкий глагол в данном военном контексте означает разведать, обследовать местность. По-русски выражение «послал разведчиков» естественно передаёт подразумеваемое действие, не превращая его в уже завершённый захват.
- source_word: בֵית יוֹסֵף
  choice: Дом Иосифа
  rationale: Сохраняет традиционное библейское обозначение племенного объединения и не сужает его значение до конкретной группы потомков.
- source_word: בְּבֵית אֵל
  choice: в Вефиль
  rationale: Предлог при глаголе разведки указывает на место или объект разведывательных действий; «в Вефиль» естественно сочетается с выбранной русской конструкцией.
- source_word: וְשֵׁם הָעִיר
  choice: этот город назывался
  rationale: Естественная русская передача буквального «имя города было», сохраняющая тот же смысл без тяжеловесности.
- source_word: לְפָנִים
  choice: прежде
  rationale: Кратко и литературно обозначает прежнее название города.
- source_word: לוּז
  choice: Луз
  rationale: Традиционная русская передача названия города.
