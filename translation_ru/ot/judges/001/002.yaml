  text: And the LORD said, “Judah shall go up. Look, I have given the land into his hand.”
translation:
  language: ru
  text: 'И сказал ГОСПОДЬ: «Пусть выступит Иуда. Вот, Я отдал землю в его руки».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ГОСПОДЬ
  rationale: Традиционная русская передача божественного имени тетраграмматона, сохраняющая достоинство стиля и согласующаяся с консультационным английским текстом.
- source_word: יַעֲלֶה
  choice: пусть выступит
  rationale: В военном контексте глагол עלה обозначает выступление в поход или наступление; такая передача естественнее буквального «поднимется» и не уточняет сверх текста способ действий.
- source_word: הִנֵּה
  choice: вот
  rationale: Сохраняет указательно-эмфатическую функцию еврейской частицы и звучит естественно в современной литературной русской речи.
- source_word: נָתַתִּי
  choice: Я отдал
  rationale: Перфект передаёт совершённость и уверенность Божьего решения; прошедшее время сохраняет напряжение между уже данным даром и предстоящим овладением.
- source_word: הָאָרֶץ
  choice: эту землю
  rationale: Контекстуально определённая земля; указательное «эту» по-русски естественно выражает определённость артикля без излишнего пояснения.
- source_word: בְּיָדוֹ
  choice: в его руки
  rationale: Русский идиоматический эквивалент выражения о передаче под власть или во владение; множественное «руки» естественно в русском при единственном числе еврейского יָד.
theological_decisions:
- issue: Кого обозначает «Иуда»
  choice: 'Сохранено имя «Иуда» без пояснения: оно может обозначать колено как коллективного участника через его праотца.'
  alternative: «Колено Иуды» или «иудеи»
  rationale: Исходный текст использует одно имя יְהוּדָה; добавление «колено» сняло бы присущую повествованию метонимию.
- issue: Соотношение Божьего дара и будущего завоевания
  choice: «Я отдал» при будущем повелении «пусть выступит»
  alternative: «Я отдам»
  rationale: 'Сохраняется богословски значимое напряжение исходного перфекта: земля представлена уже отданной, хотя военные действия ещё предстоят.'
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Инверсия «И сказал» сохраняет повествовательный ритм оригинала; речь Бога передана прямо и лаконично.
