  source_fidelity: Начальная часть в целом верно передаёт וַיּוֹאֶל לָשֶׁבֶת как настойчивое сохранение проживания. Однако וַיִּהְיוּ לָמַס буквально описывает итоговый статус амореев («они стали/оказались на принудительной повинности»), тогда как «их принудили» заменяет это состояние единичным пассивным действием. Более точна конструкция со «стали».
  naturalness: '«Упорно продолжали жить» понятно, но стилистически избыточно: «продолжали» уже выражает длительность, а «упорно» — настойчивость. «Упорно оставались жить» естественнее и яснее передаёт контекст сопротивления вытеснению. Остальная фраза соответствует современному литературному русскому.'
  terminology: «Амореи», «дом Иосифа», «гора Херес», «Аиалон» и «Шаалбим» сохранены удачно. «Трудовая повинность» точно передаёт מַס как обязательную трудовую службу, а не денежную дань. Образ «рука дома Иосифа стала тяжела для них» допустимо сохраняет древнееврейскую идиому; сноска объясняет его без догматического истолкования.
