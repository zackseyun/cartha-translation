  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
translation:
  language: ru
  text: Но амореи упорно оставались жить на горе Херес, в Аиалоне и в Шаалбиме. Тогда рука дома Иосифа стала тяжела для них[a], и они стали отбывать трудовую повинность[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дом Иосифа одолел их»; буквально: «рука дома Иосифа стала тяжела». Этот образ может указывать на возросшую силу или тягостную власть.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «они стали подневольными работниками». Еврейское слово обозначает обязательную трудовую службу, то есть трудовую повинность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: упорно продолжали
  rationale: Глагол יאל с инфинитивом может выражать решимость или настойчивость. В данном контексте речь о том, что амореи не оставляли этих мест, поэтому перевод передаёт устойчивое сопротивление вытеснению.
- source_word: הָאֱמֹרִי
  choice: амореи
  rationale: Форма единственного числа употреблена собирательно; последующий глагол во множественном числе подтверждает, что имеется в виду народ.
- source_word: לָשֶׁבֶת
  choice: жить
  rationale: Инфинитив обозначает продолжающееся проживание; современное русское «жить» здесь естественнее, чем более архаичное «обитать».
- source_word: בְּהַר חֶרֶס
  choice: на горе Херес
  rationale: Сохраняется топоним и обычное значение הַר; русский предлог «на» естественен при названии горы.
- source_word: בְּאַיָּלוֹן
  choice: в Аиалоне
  rationale: Традиционно узнаваемая русская передача географического названия.
- source_word: וּבְשַׁעַלְבִים
  choice: и в Шаалбиме
  rationale: Передаётся топоним и сохраняется соединительный союз.
- source_word: וַתִּכְבַּד יַד
  choice: рука ... стала тяжела для них
  rationale: Сохранён образ древнееврейской идиомы, обозначающей усилившуюся и тягостную власть. Добавление «для них» естественно раскрывает направленность воздействия, не устраняя образность.
- source_word: בֵּית יוֹסֵף
  choice: дом Иосифа
  rationale: Сохранено формальное родоплеменное обозначение, относящееся к племенам, ведущим происхождение от Иосифа.
- source_word: וַיִּהְיוּ לָמַס
  choice: их принудили к трудовой повинности
  rationale: מַס обозначает обязательную трудовую службу или повинность. Пассивная русская конструкция ясно передаёт фактическое подчинение амореев, не сводя термин к денежной дани.
