base_translation:
  language: en
  yaml_path: translation/ot/judges/001/029.yaml
  text: And Ephraim did not drive out the Canaanites who lived in Gezer[a], and the Canaanites lived among them in Gezer.
translation:
  language: ru
  text: Ефрем не изгнал хананеев, живших в Газере, и хананеи жили среди ефремлян[a] в Газере.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «среди него»; местоимение единственного числа относится к Ефрему как к единому племени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: изгнал
  rationale: В породе hифиль глагол ירשׁ означает лишить прежних жителей владения или удалить их. «Изгнал» естественно передаёт неудавшееся удаление хананеев в контексте завоевания.
- source_word: הַכְּנַעֲנִי
  choice: хананеев / хананеи
  rationale: Форма грамматически единственного числа здесь имеет собирательное значение; по-русски название народа естественно передать множественным числом.
- source_word: הַיּוֹשֵׁב
  choice: живших
  rationale: Причастие от ישׁב обозначает постоянное проживание; «живших» ясно и естественно передаёт этот смысл.
- source_word: בְּגָזֶר
  choice: в Газере
  rationale: Предлог ב обозначает местонахождение; для проживания в городе естественна русская конструкция «в Газере».
- source_word: וַיֵּשֶׁב
  choice: жили
  rationale: Форма продолжает повествование и сообщает о проживании хананеев. Простое «жили» сохраняет нейтральность оригинала, не усиливая явно не выраженную причинность.
- source_word: בְּקִרְבּוֹ
  choice: среди ефремлян
  rationale: Буквально выражение содержит местоименный суффикс единственного числа, относящийся к Ефрему как к единому племени. «Среди ефремлян» естественно раскрывает собирательный смысл по-русски.
