base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
translation:
  language: ru
  text: 'И сказал Адони-Везек: «Семьдесят царей с отсечёнными большими пальцами рук и ног[a] подбирали крохи под моим столом. Как я поступил, так и Бог[b] воздал мне». Его привели в Иерусалим, и там он умер.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с большими пальцами их рук и ног отсечёнными»; имеются в виду большие пальцы рук и большие пальцы ног.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское אֱלֹהִים имеет форму множественного числа, но здесь сочетается с глаголом в единственном числе, поэтому переведено «Бог», а не «боги».
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  choice: Адони-Везек
  rationale: В контексте это личное обозначение говорящего; оно передано транслитерацией, а не переводом возможного значения «господин Везека».
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם
  choice: с отсечёнными большими пальцами рук и ног
  rationale: בֹּהֶן обозначает большой палец руки или большой палец ноги в зависимости от названной конечности. Русская формулировка естественно передаёт обе части выражения.
- source_word: מְקֻצָּצִים
  choice: отсечёнными
  rationale: Пассивное причастие от קצץ обозначает отделение посредством отсечения; выбран точный и уместный для контекста эквивалент.
- source_word: הָיוּ מְלַקְּטִים
  choice: подбирали крохи
  rationale: Перифрастическая конструкция выражает повторявшееся в прошлом действие. Сам глагол означает «собирать, подбирать»; «крохи» естественно передаёт подразумеваемые остатки пищи под столом.
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן שִׁלַּם לִי
  choice: Как я поступал, так и … воздал мне
  rationale: Сохранена формула соответствующего воздаяния; несовершенный вид «поступал» уместно обобщает прежние действия говорящего.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: Несмотря на морфологически множественную форму существительного, согласованный с ним глагол стоит в единственном числе, что указывает здесь на значение «Бог».
- source_word: וַיְבִיאֻהוּ יְרוּשָׁלִַם וַיָּמָת שָׁם
  choice: Его привели в Иерусалим, и там он умер
  rationale: Последовательность повествовательных форм передана естественным русским прошедшим временем; объект «его» и место смерти сохранены явно.
theological_decisions:
- issue: Значение אֱלֹהִים в признании Адони-Везека
  choice: Бог
  alternative: боги
  rationale: Единственное число глагола שִׁלַּם убедительно указывает на единственного Бога. Перевод не приписывает говорящему более полного исповедания веры, чем выражено в самом тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Формулировка «подбирали крохи» делает подразумеваемое действие понятным обычному читателю, а «воздал мне» сохраняет смысл соразмерного возмездия без конфессионального истолкования.
