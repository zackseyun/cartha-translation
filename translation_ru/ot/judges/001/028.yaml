base_translation:
  language: en
  yaml_path: translation/ot/judges/001/028.yaml
  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
translation:
  language: ru
  text: Когда же Израиль окреп, он обложил хананеев[a] принудительной трудовой повинностью, но так и не изгнал их полностью[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «хананея»; единственное число имеет собирательное значение и обозначает хананейское население.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «его»; местоимение единственного числа относится к собирательному слову «хананей». Сочетание инфинитива и личной глагольной формы подчёркивает, что изгнание не было доведено до конца.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Когда же
  rationale: Естественно передаёт временную связь еврейской повествовательной формулы, не воспроизводя буквально оборот «и было».
- source_word: חָזַק
  choice: окреп
  rationale: Передаёт становление Израиля сильным и достижение им превосходства, а не только статическое состояние.
- source_word: וַיָּשֶׂם ... לָמַס
  choice: обложил ... принудительной повинностью
  rationale: Оборот указывает на обязательную трудовую повинность, наложенную господствующей стороной; русский вариант сохраняет принудительный характер и звучит естественно.
- source_word: הַכְּנַעֲנִי
  choice: хананеев
  rationale: Грамматически единственное число употреблено собирательно для хананейского населения; по-русски естественно множественное число.
- source_word: וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ
  choice: но так и не изгнал их полностью
  rationale: Сочетание абсолютного инфинитива с личной формой усиливает отрицание; «так и не» и «полностью» передают подчёркнутую незавершённость изгнания. Единственное местоимение оригинала относится к собирательному обозначению хананеев.
theological_decisions:
- issue: Обращение Израиля с хананеями
  choice: Израиль принудил хананеев к трудовой повинности вместо полного изгнания.
  alternative: Понимать מַס как нейтральную денежную дань.
  rationale: В данном контексте термин обозначает наложенную господствующей властью повинность; перевод не должен смягчать принудительный характер действия.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Единственное число «Израиль ... он» сохраняет грамматическую форму оригинала; «принудительная повинность» ясно передаёт מַס без узкоспециального термина «барщина» или менее точного «дань».
