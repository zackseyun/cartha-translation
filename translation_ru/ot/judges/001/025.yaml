  text: וַ/יַּרְאֵ/ם֙ אֶת מְב֣וֹא הָ/עִ֔יר וַ/יַּכּ֥וּ אֶת הָ/עִ֖יר לְ/פִי חָ֑רֶב וְ/אֶת הָ/אִ֥ישׁ וְ/אֶת כָּל מִשְׁפַּחְתּ֖/וֹ שִׁלֵּֽחוּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/025.yaml
  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
translation:
  language: ru
  text: Он показал им вход в город, и они поразили город остриём меча[a], а того человека и всю его семью отпустили[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «устами меча» — еврейский оборот, означающий поражение мечом.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «весь его дом»; возможно также: «весь его род».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם
  choice: он показал им
  rationale: 'Каузативное по смыслу употребление ראה с суффиксом 3-го лица множественного числа: человек указал нападавшим, как войти в город.'
- source_word: מְבוֹא הָעִיר
  choice: вход в город
  rationale: מָבוֹא обозначает вход или путь внутрь; в военном контексте «вход в город» звучит естественно и конкретно.
- source_word: וַיַּכּוּ
  choice: они поразили
  rationale: נכה имеет широкий смысл «ударить, поразить, разгромить»; «поразили» сохраняет образ еврейского глагола и не поглощает следующую фразу о мече.
- source_word: לְפִי חָרֶב
  choice: остриём меча
  rationale: Буквально «устами меча»; это устойчивый еврейский оборот о поражении оружием. «Остриём меча» сохраняет образ и понятно современному читателю.
- source_word: שִׁלֵּחוּ
  choice: отпустили
  rationale: В контексте речь идёт о том, что мужчину и его близких пощадили и позволили уйти; «отпустили» ясно передаёт этот смысл.
- source_word: כָּל מִשְׁפַּחְתּוֹ
  choice: всю его семью
  rationale: מִשְׁפָּחָה может обозначать семью, дом или более широкий род; в основном тексте «семью» наиболее естественно, а широта значения отмечена в сноске.
- source_word: הָאִישׁ
  choice: того человека
  rationale: Определённая форма отсылает к человеку из предыдущего стиха; указательное «того» делает эту связь естественной в русском повествовании.
