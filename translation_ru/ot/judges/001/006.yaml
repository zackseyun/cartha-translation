lexical_decisions:
- source_word: וַיָּנָס
  choice: побежал
  rationale: Глагол נוּס означает бегство; «побежал» естественно передаёт начало попытки спастись и, в отличие от «убежал», не создаёт впечатления успешного спасения.
- source_word: אֲדֹנִי בֶזֶק
  choice: Адони-Везек
  rationale: Сочетание передано как имя-титул посредством транслитерации; возможное значение «владыка Везека» не навязывается основному тексту.
- source_word: וַיִּרְדְּפוּ אַחֲרָיו
  choice: они погнались за ним
  rationale: Конструкция רדף + אַחַר обозначает преследование; выбран естественный для современного русского повествования оборот.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: схватили его
  rationale: אחז передаёт захват или удержание; «схватили» ясно выражает насильственное пленение.
- source_word: וַיְקַצְּצוּ
  choice: отсекли
  rationale: В данном контексте קצץ означает отсечение частей тела; «отсекли» точно и стилистически достойно.
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  choice: большие пальцы на руках и ногах
  rationale: בֹּהֶן обозначает большой палец руки либо ноги. Русская формулировка естественно раскрывает общее еврейское обозначение применительно к рукам и ногам.
