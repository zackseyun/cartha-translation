  text: וּ/גְבוּל֙ הָ/אֱמֹרִ֔י מִֽ/מַּעֲלֵ֖ה עַקְרַבִּ֑ים מֵ/הַ/סֶּ֖לַע וָ/מָֽעְלָ/ה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/036.yaml
  text: And the border of the Amorites was from the Ascent of Akrabbim[b][a], from Sela and upward.
translation:
  language: ru
  text: А граница амореев проходила от подъёма Акраввим[a], от Селы[b] и выше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Акраввим означает «скорпионы»; возможный перевод: «от Скорпионьего подъёма».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от скалы», если еврейское слово понимать как нарицательное, а не как название места Села.'
    reason: alternative_reading
lexical_decisions:
- source_word: גְבוּל
  choice: граница
  rationale: Слово обозначает границу или пограничную линию, а не всю территорию.
- source_word: הָאֱמֹרִי
  choice: амореев
  rationale: Форма единственного числа употреблена собирательно; по-русски естественно передать название народа множественным числом.
- source_word: מִמַּעֲלֵה עַקְרַבִּים
  choice: от подъёма Акраввим
  rationale: מַעֲלֵה означает подъём или дорогу на возвышенность, а עַקְרַבִּים здесь входит в состав географического названия; его буквальный смысл сохранён в сноске.
- source_word: מֵהַסֶּלַע
  choice: от Селы
  rationale: В данном географическом контексте слово, вероятно, является названием места, хотя еврейскую форму можно понять и как нарицательное «скала»; эта неоднозначность отмечена в сноске.
- source_word: וָמָעְלָה
  choice: и выше
  rationale: Наречие указывает на продолжение границы дальше в направлении возвышенности; краткая формулировка сохраняет пространственный смысл.
- source_word: וּ
  choice: А
  rationale: Союз связывает итоговое географическое замечание с предыдущим повествованием; «а» естественно передаёт этот переход в русском контексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; географическая формула передана с умеренной формальной точностью. Глагол «проходила» добавлен по нормам русского языка, поскольку в еврейском именное предложение не содержит выраженной связки. Топонимы переданы в традиционной библейской форме, а подлинная лексическая неоднозначность вынесена в сноски.
