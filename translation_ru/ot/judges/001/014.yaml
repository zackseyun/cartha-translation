  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: ru
  text: 'Когда она пришла, она побудила[a] его попросить у её отца поле. Затем она сошла с осла[b], и Халев спросил её: «Чего ты хочешь?»[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «склонила его»; глагол может также означать «подстрекнула его», но здесь контекст допускает нейтральное значение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «спустилась с осла»; еврейский глагол может описывать также более резкое движение вниз.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «Что тебе?» Это выражение может означать: «Чего ты хочешь?» или «Что с тобой?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: когда она пришла
  rationale: 'Предлог ב с инфинитивом и суффиксом 3-го лица женского рода образует временную конструкцию: «при её приходе», естественно по-русски — «когда она пришла».'
- source_word: וַתְּסִיתֵהוּ
  choice: побудила его
  rationale: Глагол סות может означать «подстрекнуть», «склонить», «побудить». Нейтральное «побудила» подходит к семейной просьбе и не приписывает действию заведомо дурного характера.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ
  choice: попросить у её отца
  rationale: שאל с מֵאֵת обозначает просьбу, обращённую к источнику дара; русская конструкция «попросить у» передаёт это отношение естественно и точно.
- source_word: הַשָּׂדֶה
  choice: поле
  rationale: Существительное с определённым артиклем указывает на конкретное поле; в русской передаче определённость ясна из контекста и не требует указательного местоимения.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: она спустилась с осла
  rationale: צנח здесь описывает движение вниз с животного. «Спустилась с осла» ясно передаёт действие, не усиливая его до резкого падения или прыжка.
- source_word: מַה לָּךְ
  choice: Чего ты хочешь?
  rationale: Буквально идиома означает «что тебе?», но в данном контексте служит вопросом о желании или просьбе Ахсы. Выбранная формулировка естественна в современном русском.
- source_word: כָּלֵב
  choice: Халев
  rationale: Использована традиционная русская библейская форма имени, остающаяся понятной современному читателю.
