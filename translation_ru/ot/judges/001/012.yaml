base_translation:
  language: en
  yaml_path: translation/ot/judges/001/012.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him my daughter Achsah as a wife.”
translation:
  language: ru
  text: 'И сказал Халев[a]: «Кто нападёт на Кириаф-Сефер и захватит его, тому я отдам в жёны мою дочь Ахсу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тот, кто нападёт на Кириаф-Сефер и захватит его».'
    reason: 'Лексическая альтернатива: אֲשֶׁר может быть передано как «кто» или как «тот, кто»; смысл обещания не меняется.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательная форма с וַ продвигает повествование; «И сказал» естественно и без излишнего уточнения передаёт связь с предыдущим событием.
- source_word: כָּלֵב
  choice: Халев
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: אֲשֶׁר
  choice: кто
  rationale: Вводит неопределённое относительное условие — открытый вызов любому, кто выполнит названное действие.
- source_word: יַכֶּה
  choice: нападёт на
  rationale: В данном военном контексте форма от נכה обозначает удар по городу, то есть нападение; такой перевод естественнее буквального «поразит» и не дублирует последующий успешный захват.
- source_word: קִרְיַת סֵפֶר
  choice: Кириаф-Сефер
  rationale: Традиционная русская транслитерация географического названия с сохранением составной формы.
- source_word: וּלְכָדָהּ
  choice: и захватит его
  rationale: לכד в военном контексте означает овладеть городом; местоимение мужского рода согласовано в русском с названием «Кириаф-Сефер».
- source_word: וְנָתַתִּי לוֹ
  choice: тому я отдам
  rationale: Передаёт обещание Халева, обусловленное захватом города; «тому» ясно соотносится с начальным «кто».
- source_word: עַכְסָה
  choice: Ахсу
  rationale: Традиционная русская форма имени; винительный падеж обусловлен синтаксисом предложения.
- source_word: בִתִּי
  choice: мою дочь
  rationale: Прямо сохраняет родственную связь и притяжательное значение.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Естественная современная русская формула, точно обозначающая выдачу дочери замуж.
