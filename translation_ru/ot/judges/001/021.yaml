  text: וְ/אֶת הַ/יְבוּסִי֙ יֹשֵׁ֣ב יְרֽוּשָׁלִַ֔ם לֹ֥א הוֹרִ֖ישׁוּ בְּנֵ֣י בִנְיָמִ֑ן וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י בִנְיָמִן֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
translation:
  language: ru
  text: Но сыны Вениамина не изгнали иевусеев, живших в Иерусалиме, и иевусеи живут вместе с сынами Вениамина в Иерусалиме до сего дня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: иевусеи
  rationale: Форма в еврейском тексте стоит в единственном числе, но обозначает народ как собирательное целое; по-русски естественнее употребить множественное число.
- source_word: יֹשֵׁב יְרוּשָׁלַם
  choice: живших в Иерусалиме
  rationale: Причастие выражает продолжающееся проживание; оборот «живших в Иерусалиме» передаёт это естественно и ясно.
- source_word: הוֹרִישׁוּ
  choice: не изгнали
  rationale: В контексте заселения земли глагол означает изгнать или вытеснить прежних жителей; «не изгнали» точно и понятно передаёт смысл.
- source_word: בְּנֵי בִנְיָמִן
  choice: сыны Вениамина
  rationale: Сохраняет родоплеменную и генеалогическую форму еврейского выражения, оставаясь понятным в современном литературном библейском регистре.
- source_word: וַיֵּשֶׁב
  choice: живут
  rationale: Хотя еврейская глагольная форма повествовательная, формула «до сего дня» указывает на состояние, продолжающееся до времени рассказчика; русское настоящее время передаёт эту длительность естественно.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: вместе с сынами Вениамина
  rationale: אֶת здесь выражает совместность, а не вводит прямое дополнение; «вместе с» недвусмысленно передаёт совместное проживание.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: до сего дня
  rationale: Устойчивый русский библейский оборот, точно передающий временную формулу и сохраняющий достоинство регистра.
- source_word: וְ
  choice: Но
  rationale: 'В контексте союз имеет контрастное значение: сообщается об исключении из предшествующих успехов завоевания.'
theological_decisions: []
