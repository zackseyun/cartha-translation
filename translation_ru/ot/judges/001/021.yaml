  register: Современный литературный русский язык с умеренно традиционным библейским регистром. «Сыны Вениамина» и «до сего дня» сохраняют родоплеменной и повествовательный колорит, не затрудняя понимания. Собирательное единственное הַיְבוּסִי передано естественным для русского языка множественным числом без сноски, поскольку смысловая неоднозначность отсутствует.
