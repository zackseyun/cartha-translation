base_translation:
  language: en
  yaml_path: translation/ot/judges/001/022.yaml
  text: The house of Joseph also went up against Bethel[a], and Yahweh was with them.
translation:
  language: ru
  text: И дом Иосифа также выступил против Вефиля[a], и Яхве был с ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поднялся к Вефилю». Еврейский глагол буквально означает «поднялся», однако в данном военном контексте, вероятно, имеется в виду выступление против города.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: выступил против
  rationale: Глагол עלה буквально означает «подниматься, идти вверх», но в военном повествовании перед названием места обозначает наступательное движение. «Выступил против» естественно передаёт контекст, не усиливая значение до прямого «напал».
- source_word: בֵית יוֹסֵף
  choice: дом Иосифа
  rationale: Сохраняет принятое библейское обозначение племенного объединения и формальную образность исходного текста.
- source_word: גַּם הֵם
  choice: также
  rationale: Передаёт присоединение этого действия к предшествующим походам; множественное местоимение отражено далее в слове «ними».
- source_word: בֵּית אֵל
  choice: Вефиль
  rationale: Традиционная и узнаваемая русская форма названия места.
- source_word: וַיהוָה
  choice: Яхве
  rationale: Передаёт личное Божье имя יהוה, прямо употреблённое в еврейском тексте.
- source_word: עִמָּם
  choice: был с ними
  rationale: Прямо и естественно сохраняет смысл Божьего присутствия и поддержки, не сводя его только к военному содействию.
theological_decisions:
- issue: Передача Божьего имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет тетраграмматон как личное имя; транслитерация «Яхве» сохраняет это различие.
- issue: Характер Божьего присутствия в עִמָּם
  choice: был с ними
  alternative: поддерживал их
  rationale: Более буквальная формулировка сохраняет одновременно возможные оттенки присутствия, благоволения и помощи, не сужая их до одного толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Единственное число «дом Иосифа… выступил» согласовано с собирательным обозначением, а «с ними» сохраняет множественное число еврейского местоимения и указывает на людей этого дома.
