source:
  edition: WLC
  text: וַ/יִּרְאוּ֙ הַ/שֹּׁ֣מְרִ֔ים אִ֖ישׁ יוֹצֵ֣א מִן הָ/עִ֑יר וַ/יֹּ֣אמְרוּ ל֗/וֹ הַרְאֵ֤/נוּ נָא֙ אֶת מְב֣וֹא הָ/עִ֔יר וְ/עָשִׂ֥ינוּ עִמְּ/ךָ֖ חָֽסֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
translation:
  language: ru
  text: 'Дозорные увидели человека, выходившего из города, и сказали ему: «Покажи нам, пожалуйста, вход в город[a], и мы окажем тебе милость[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «путь в город».'
    reason: lexical_alternative
  - marker: b
    text: Евр. хесед — слово, которое в зависимости от контекста может означать милость, доброту, преданность или неизменную любовь.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  choice: дозорные
  rationale: Причастная форма от שמר обозначает людей, наблюдавших за городом. «Дозорные» передаёт военный контекст, не представляя их городской стражей.
- source_word: אִישׁ
  choice: человека
  rationale: В данном контексте существительное в единственном числе обозначает мужчину; русское «человека» естественно в сочетании с глаголом «увидели» и не устраняет его мужской род.
- source_word: יוֹצֵא
  choice: выходившего
  rationale: Причастие от יצא описывает человека, выходящего из города. Несовершенный вид сохраняет наблюдаемое в тот момент действие.
- source_word: מְבוֹא
  choice: вход
  rationale: Слово обозначает вход или путь доступа. «Вход» кратко и конкретно передаёт основной смысл, не исключая подразумеваемого пути внутрь города.
- source_word: נָא
  choice: пожалуйста
  rationale: Частица смягчает повеление; «пожалуйста» — её естественный современный русский эквивалент.
- source_word: וְעָשִׂינוּ עִמְּךָ חָסֶד
  choice: и мы окажем тебе милость
  rationale: В этой договорённости חֶסֶד означает благосклонное, милосердное обращение в ответ на помощь. Формулировка сохраняет весомость слова, не навязывая здесь специального значения заветной верности.
theological_decisions:
- issue: Значение חֶסֶד
  choice: милость, проявленная к человеку
  alternative: верность завету; неизменная любовь; доброе отношение
  rationale: Хотя חֶסֶד в других контекстах может обозначать верную любовь и заветную преданность, здесь речь идёт об обещании пощадить или благосклонно поступить с человеком за оказанную помощь. «Окажем тебе милость» сохраняет смысловую широту слова без излишнего богословского уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. «Дозорные» соответствует военному контексту, а «окажем тебе милость» звучит достойно и естественно, сохраняя смысловую ёмкость חֶסֶד.
