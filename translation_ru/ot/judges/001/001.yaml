  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: временную рамку после смерти Иисуса Навина, обращение сынов Израиля к Яхве, вопрос о том, кто выступит первым, военную направленность против хананеев и цель сражения. Повествовательная формула וַיְהִי не воспроизведена отдельным русским оборотом, но её функция естественно передана начальным обстоятельством времени; смысловой утраты нет. Собирательное единственное число «хананей» корректно передано множественным «хананеев/ними».'
