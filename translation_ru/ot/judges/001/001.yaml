source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
translation:
  language: ru
  text: 'После смерти Иисуса Навина сыны Израиля[a] вопросили Яхве: «Кто первым выступит за нас против хананеев[b], чтобы сразиться с ними?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Израиля»; это выражение обозначает израильский народ.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте стоит единственное число — «хананея», употреблённое здесь в собирательном значении.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: После смерти…
  rationale: Еврейская повествовательная формула открывает новый эпизод. В современном русском отдельное «И было» звучало бы архаично и избыточно, поэтому её дискурсивная функция передана естественным началом временного предложения.
- source_word: אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  choice: После смерти Иисуса Навина
  rationale: Именная конструкция оригинала передана близко по форме и естественно для литературного русского языка; традиционная русская форма имени позволяет однозначно назвать данного Иисуса.
- source_word: וַיִּשְׁאֲלוּ בַּיהוָה
  choice: вопросили Яхве
  rationale: В данном контексте глагол означает обращение к Богу за указанием. «Вопросили» сохраняет религиозно-повествовательный оттенок, оставаясь понятным и не добавляя способа получения ответа, которого текст не уточняет.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально отражает мужское множественное число и традиционное обозначение народа; примечание поясняет возможный более обобщённый перевод.
- source_word: בַּיהוָה
  choice: Яхве
  rationale: Передаёт личное имя יהוה, а не заменяет его титулом.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Стандартный еврейский ввод прямой речи естественно выражается в русском пунктуационно; буквальное «говоря» здесь было бы тяжеловесно.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: Кто первым выступит за нас
  rationale: В военном контексте עלה обозначает выступление в поход или наступление, а לָנוּ — действие в интересах или от лица всего народа. Порядок слов объединён с בַּתְּחִלָּה ради естественной русской фразы.
- source_word: אֶל הַכְּנַעֲנִי
  choice: против хананеев
  rationale: Предлог получает враждебное значение из контекста сражения, а грамматически единственное «хананей» обозначает народ собирательно и потому передано множественным числом.
- source_word: בַּתְּחִלָּה
  choice: первым
  rationale: Речь идёт об очерёдности выступления в бой; творительный предикативный «первым» наиболее естественен по-русски.
- source_word: לְהִלָּחֶם בּוֹ
  choice: чтобы сразиться с ними
  rationale: Передаёт цель выступления. Единственное местоимение оригинала согласовано с собирательным «хананей», тогда как русское множественное «ними» согласуется с переводом «хананеев».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Оригинал прямо употребляет тетраграмматон. Транслитерация сохраняет личное заветное имя и не смешивает его с титулом; вариант «Господь» отражает традицию чтения, но не лексическую форму текста.
- issue: Способ вопрошания Бога
  choice: Не уточнять способ получения указания
  alternative: Добавить «искали ответа у Яхве» или назвать священный жребий
  rationale: Текст сообщает, что Израиль вопросил Яхве, но в этом стихе не объясняет, каким именно образом. Перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Вопросили» и «сразиться» поддерживают достоинство повествования без архаической формулы «и было». Прямая речь сделана плавной, при этом военная направленность и собирательное значение этнонима сохранены.
