translation_notes:
  register: Современный литературный русский с умеренно традиционными формами библейских имён. Синтаксис сохраняет повтор названий и переход от собирательного единственного числа «Неффалим» к множественному местоимению «для них». Союз וַ перед וַיֵּשֶׁב передан как контрастное «а», чтобы не превращать простую повествовательную связь в явно причинную.
