base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
translation:
  language: ru
  text: Неффалим не изгнал жителей Беф-Шемеша и жителей Беф-Анафа и жил среди хананеев, жителей той земли. Жители Беф-Шемеша и Беф-Анафа стали нести для них трудовую повинность.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стали выполнять для них принудительные работы». Еврейское מַס означает обязательную трудовую повинность, а не просто уплату дани.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: не изгнал
  rationale: В породе хифиль глагол ירש здесь означает устранение прежних жителей с земли; «изгнал» естественно передаёт военно-поселенческий смысл.
- source_word: יֹשְׁבֵי
  choice: жители
  rationale: Причастие от ישב обозначает людей, живущих в названном месте; «жители» кратко и естественно сохраняет повтор формулы.
- source_word: בֵית שֶׁמֶשׁ
  choice: Беф-Шемеш
  rationale: Географическое название транслитерировано в форме, близкой еврейскому звучанию и понятной русскому читателю.
- source_word: בֵית עֲנָת
  choice: Беф-Анаф
  rationale: Название транслитерировано; конечная ת после гласной передана как «ф» согласно традиционной русской библейской форме.
- source_word: וַיֵּשֶׁב בְּקֶרֶב
  choice: а поселился среди
  rationale: Единственное число согласуется с собирательным названием колена «Неффалим». «Поселился среди» передаёт как проживание, так и контраст с неизгнанием жителей, не усиливая причинную связь сверх еврейского וַ.
- source_word: הַכְּנַעֲנִי
  choice: хананеев
  rationale: Морфологически единственное число употреблено как собирательное обозначение народа; по-русски естественно множественное число.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: жителей той земли
  rationale: Аппозиция сохранена; указательное «той» естественно связывает выражение с уже названными хананеями и передаёт определённость артикля.
- source_word: הָיוּ לָהֶם לָמַס
  choice: стали для них подневольными работниками
  rationale: מַס обозначает принудительную трудовую повинность, а не просто денежную дань. Формулировка сохраняет конструкцию «стали для них» и ясно выражает личный труд.
- source_word: לָהֶם
  choice: для них
  rationale: Множественное местоимение относится к членам колена Неффалима; его число сохранено, несмотря на собирательный субъект в единственном числе.
