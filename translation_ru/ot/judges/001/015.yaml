  yaml_path: translation/ot/judges/001/015.yaml
  text: She said to him[a], “Please give me a blessing, because you have given me the land of the Negev[b]; give me also springs of water.” So Caleb gave her the upper springs and the lower springs.
translation:
  language: ru
  text: 'Она сказала ему: «Дай мне, пожалуйста, благословение: ведь ты дал мне землю Негева[a]; дай мне также источники воды[b]». И Халев дал ей верхние источники и нижние источники.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «южную землю». Еврейское слово не́гев может быть названием области Негев либо обозначать южную, обычно засушливую, землю.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское выражение может обозначать источники, водоёмы или иные места скопления воды; в условиях засушливой области здесь лучше всего подходит слово «источники».
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לִּי
  choice: дай мне, пожалуйста
  rationale: Форма выражает настойчивую просьбу; частица «пожалуйста» передаёт просительный оттенок, не превращая слова в резкий приказ.
- source_word: בְרָכָה
  choice: благословение
  rationale: Слово буквально означает «благословение» и здесь подразумевает благодетельный дар отца; буквальный образ сохранён в основном тексте.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: землю в Негеве
  rationale: נֶגֶב может быть названием южной засушливой области либо обозначением южной земли. Географическое «Негев» естественно в современном русском, а предлог «в» ясно показывает, что речь идёт о земельном наделе в этой области.
- source_word: גֻּלֹּת מָיִם
  choice: источники воды
  rationale: Редкое выражение обозначает водные источники или водоёмы. В контексте засушливой земли «источники воды» наиболее ясно передаёт потребность в надёжном водоснабжении, при этом неопределённость отмечена в сноске.
- source_word: גֻּלֹּת עִלִּית
  choice: верхние источники
  rationale: עִלִּית означает «верхние»; формулировка сохраняет топографическое противопоставление нижним источникам.
- source_word: גֻּלֹּת תַּחְתִּית
  choice: нижние источники
  rationale: תַּחְתִּית означает «нижние» или «находящиеся внизу»; выбран симметричный перевод в паре с «верхними источниками».
- source_word: וַיִּתֶּן לָהּ כָּלֵב
  choice: И Халев дал ей
  rationale: Последовательная форма глагола продолжает повествование и описывает непосредственный ответ Халева на просьбу.
