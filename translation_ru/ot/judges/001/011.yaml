  text: וַ/יֵּ֣לֶךְ מִ/שָּׁ֔ם אֶל יוֹשְׁבֵ֖י דְּבִ֑יר וְ/שֵׁם דְּבִ֥יר לְ/פָנִ֖ים קִרְיַת סֵֽפֶר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/011.yaml
  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
translation:
  language: ru
  text: Оттуда он пошёл против жителей Девира[a]. Прежде Девир назывался Кириат-Сефер[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к жителям Девира». Еврейский предлог буквально означает «к, по направлению к», но в рассказе о завоевании здесь подразумевается враждебное движение.'
    reason: lexical_alternative
  - marker: b
    text: Название «Кириат-Сефер» может означать «город книги» или «город писца (писцов)».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: он пошёл
  rationale: Простая повествовательная форма глагола הלך означает движение; военный оттенок задаётся контекстом, поэтому более узкое «выступил в поход» не требуется.
- source_word: מִשָּׁם
  choice: оттуда
  rationale: Естественно передаёт исходную точку движения и непосредственно соответствует еврейскому обороту.
- source_word: אֶל
  choice: против
  rationale: Буквально предлог означает «к, по направлению к», но в контексте завоевания обозначает враждебное движение; «против» естественно передаёт это значение, не добавляя описания самого нападения.
- source_word: יוֹשְׁבֵי
  choice: жителей
  rationale: Субстантивированное причастие от ישב обозначает людей, живущих в данном месте; «жители» — ясный и современный русский эквивалент.
- source_word: דְּבִיר
  choice: Девир
  rationale: Географическое название передано принятой русской библейской транслитерацией.
- source_word: וְשֵׁם דְּבִיר לְפָנִים
  choice: Прежде Девир назывался
  rationale: Естественная русская формулировка сохраняет указание на прежнее название города.
- source_word: קִרְיַת סֵפֶר
  choice: Кириат-Сефер
  rationale: Топоним транслитерирован в основном тексте; возможные значения его компонентов не следует превращать в однозначный перевод.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Формулировка «пошёл против» сохраняет простоту исходного глагола и военный смысл контекста. Скобки английского консультационного текста не воспроизведены, поскольку еврейский текст представляет пояснение как обычное продолжение повествования.
