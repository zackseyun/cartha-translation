  text: וַ/יְהִ֤י יְהוָה֙ אֶתּ יְהוּדָ֔ה וַ/יֹּ֖רֶשׁ אֶת הָ/הָ֑ר כִּ֣י לֹ֤א לְ/הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י הָ/עֵ֔מֶק כִּי רֶ֥כֶב בַּרְזֶ֖ל לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
translation:
  language: ru
  text: И Яхве был с Иудой, и тот овладел нагорьем, но не смог изгнать жителей долины[a], потому что у них были железные колесницы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «низменности»; еврейское слово может обозначать обширную низменную долину или равнинную область.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога YHWH принятой в современном русском библейском употреблении транслитерацией.
- source_word: אֶת־יְהוּדָה
  choice: с Иудой
  rationale: אֵת здесь обозначает совместность. «Иуда» сохраняет краткую метонимию оригинала, где имеется в виду колено Иуды.
- source_word: וַיֹּרֶשׁ
  choice: овладел
  rationale: При объекте הָהָר каузативная форма ירש естественно означает вступление во владение областью; это также позволяет отличить её от следующего לְהוֹרִישׁ — «изгнать».
- source_word: הָהָר
  choice: нагорьем
  rationale: В данном географическом контексте слово обозначает гористую возвышенную область, а не одну гору.
- source_word: כִּי לֹא לְהוֹרִישׁ
  choice: но не смог изгнать
  rationale: Сжатая еврейская конструкция в контексте выражает неудачу или неспособность, объясняемую следующей причинной фразой; «но» естественно передаёт противопоставление предшествующему успеху.
- source_word: יֹשְׁבֵי הָעֵמֶק
  choice: жителей долины
  rationale: Естественно передаёт субстантивированное причастие и основное пространственное значение עֵמֶק.
- source_word: עֵמֶק
  choice: долины
  rationale: «Долина» — прямое и понятное соответствие, тогда как возможное более широкое значение «низменность» сохранено в сноске.
- source_word: רֶכֶב בַּרְזֶל לָהֶם
  choice: у них были железные колесницы
  rationale: Естественная русская конструкция обладания точно передаёт לָהֶם; сочетание «железные колесницы» сохраняет формулировку оригинала без уточнения характера использования железа.
theological_decisions:
- issue: Субъект и смысл неспособности во второй части стиха
  choice: 'Неспособность отнесена к Иуде: «тот… не смог изгнать».'
  alternative: 'Перевести менее определённо: «но не изгнал жителей долины», не выражая прямо неспособность.'
  rationale: Контекст и причинное пояснение о железных колесницах указывают на неудачу Иуды. Перевод сохраняет напряжение между утверждением, что Яхве был с Иудой, и последующей неспособностью Иуды, не пытаясь богословски сгладить его.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «И тот» однозначно возвращает субъект к Иуде и не позволяет ошибочно отнести неспособность к Яхве. Слово «нагорье» кратко и естественно обозначает возвышенную область.
