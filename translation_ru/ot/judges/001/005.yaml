base_translation:
  language: en
  yaml_path: translation/ot/judges/001/005.yaml
  text: They found Adoni-bezek in Bezek[a], and they fought against him and struck down the Canaanites and the Perizzites.
translation:
  language: ru
  text: Они нашли Адони-Везека в Везеке[a], вступили с ним в бой и поразили хананеев и ферезеев.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Адони-Везек» можно этимологически понять как «владыка Везека», однако здесь оно передано как личное имя.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: они нашли
  rationale: В повествовательном контексте מצא прямо означает «найти» или «встретить»; «нашли» естественно передаёт последовательность событий.
- source_word: אֲדֹנִי בֶזֶק
  choice: Адони-Везека
  rationale: В данном контексте сочетание передано как личное имя и поставлено в винительный падеж по нормам русского языка; его возможная этимология отмечена в сноске.
- source_word: בְּבֶזֶק
  choice: в Везеке
  rationale: Предлог ב обозначает место; форма «в Везеке» естественна для названия населённого пункта.
- source_word: וַיִּלָּחֲמוּ בּוֹ
  choice: вступили с ним в бой
  rationale: Нифаль глагола לחם с ב выражает военное столкновение с противником; эта формулировка ясно и естественно передаёт смысл.
- source_word: וַיַּכּוּ
  choice: поразили
  rationale: נכה в военном контексте может означать нанесение поражения или разящий удар. «Поразили» сохраняет широту значения, не утверждая, что был убит каждый человек.
- source_word: הַכְּנַעֲנִי
  choice: хананеев
  rationale: Единственное число этнонима употреблено собирательно; русский множественный винительный естественно передаёт народ как участников сражения.
- source_word: הַפְּרִזִּי
  choice: ферезеев
  rationale: Этноним в единственном числе имеет собирательное значение; традиционная русская форма во множественном числе уместна в описании битвы.
