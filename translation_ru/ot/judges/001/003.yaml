  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/שִׁמְע֨וֹן אָחִ֜י/ו עֲלֵ֧ה אִתִּ֣/י בְ/גוֹרָלִ֗/י וְ/נִֽלָּחֲמָה֙ בַּֽ/כְּנַעֲנִ֔י וְ/הָלַכְתִּ֧י גַם אֲנִ֛י אִתְּ/ךָ֖ בְּ/גוֹרָלֶ֑/ךָ וַ/יֵּ֥לֶךְ אִתּ֖/וֹ שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/003.yaml
  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
translation:
  language: ru
  text: 'И сказал Иуда Симеону, брату своему: «Пойди со мной в землю, доставшуюся мне по жребию[a], и сразимся с хананеями; а я пойду с тобой в землю, доставшуюся тебе по жребию». И Симеон пошёл с ним.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в мой жребий»; то есть в землю, назначенную по жребию. То же выражение далее переведено как «в землю, доставшуюся тебе по жребию».'
    reason: 'Лексическая метонимия: גוֹרָל означает как сам жребий, так и назначенный им удел.'
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Передаёт обычную древнееврейскую повествовательную последовательность без излишнего уточнения временного оттенка.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Традиционная русская форма имени; в контексте оно обозначает колено как единое действующее лицо.
- source_word: לְשִׁמְעוֹן אָחִיו
  choice: Симеону, брату своему
  rationale: Сохраняет прямое обозначение братства, уместное и для родственных отношений праотцов, и для связанных с ними колен.
- source_word: עֲלֵה אִתִּי
  choice: Пойди со мной
  rationale: Глагол עלה буквально выражает движение вверх или выступление; в данном русском контексте естественное приглашение передано как «пойди со мной», без искусственного пространственного уточнения.
- source_word: בְּגוֹרָלִי
  choice: в землю, доставшуюся мне по жребию
  rationale: גוֹרָל буквально означает «жребий», но здесь метонимически обозначает назначенную по жребию территорию; формулировка сохраняет и конкретный смысл, и образ жребия.
- source_word: וְנִלָּחֲמָה
  choice: и сразимся
  rationale: Форма первого лица множественного числа имеет побудительно-совместный оттенок; русский совершенный глагол естественно выражает приглашение к совместной битве.
- source_word: בַּכְּנַעֲנִי
  choice: с хананеями
  rationale: Форма единственного числа употреблена собирательно и обозначает народ; по-русски естественно множественное число.
- source_word: וְהָלַכְתִּי גַם אֲנִי אִתְּךָ
  choice: а я пойду с тобой
  rationale: Передаёт ответное обещание и эмфатическое גַם אֲנִי; союз «а» естественно подчёркивает взаимность.
- source_word: בְּגוֹרָלֶךָ
  choice: в землю, доставшуюся тебе по жребию
  rationale: Последовательно передаёт тот же метонимический смысл גוֹרָל, что и в первой части стиха.
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  choice: И Симеон пошёл с ним
  rationale: 'Сохраняет последовательный повествовательный итог: Симеон согласился и отправился вместе с Иудой.'
theological_decisions:
- issue: Значение אָחִיו в отношении Иуды и Симеона
  choice: брату своему
  alternative: сородичу своему
  rationale: Исходный текст прямо употребляет слово «брат»; оно сохраняет родственную основу отношений между коленами и не требует обобщения.
- issue: Передача גוֹרָל в контексте раздела земли
  choice: земля, доставшаяся по жребию
  alternative: жребий
  rationale: Контекст говорит о территории колена, однако буквальный образ жребия богословски и исторически значим; выбранная формулировка сохраняет оба аспекта.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; архаизмы сведены к минимуму. Формула «доставшуюся по жребию» сохраняет конкретность территориального удела и образ исходного текста.
