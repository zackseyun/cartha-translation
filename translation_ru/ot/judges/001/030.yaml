  text: זְבוּלֻ֗ן לֹ֤א הוֹרִישׁ֙ אֶת יוֹשְׁבֵ֣י קִטְר֔וֹן וְ/אֶת יוֹשְׁבֵ֖י נַהֲלֹ֑ל וַ/יֵּ֤שֶׁב הַֽ/כְּנַעֲנִי֙ בְּ/קִרְבּ֔/וֹ וַ/יִּֽהְי֖וּ לָ/מַֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
translation:
  language: ru
  text: Завулон не изгнал жителей Китрона и жителей Нахалола[a]. Хананеи жили среди них[b] и стали подневольными работниками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант названия: «Нахалал»; такая форма встречается в связанных с этим местом текстах и в переводческой традиции.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «хананей жил среди него». В еврейском название народа употреблено в собирательном единственном числе, а суффикс «него», вероятно, относится к Завулону как к единому колену.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: не изгнал
  rationale: В контексте Судей 1 форма породы хифиль от ירש означает удаление прежних жителей с земли. «Не изгнал» ясно и естественно передаёт военный и поселенческий контекст.
- source_word: יוֹשְׁבֵי
  choice: жителей
  rationale: Причастие от ישב обозначает людей, живущих в данном месте; «жителей» — краткий и естественный русский эквивалент.
- source_word: קִטְרוֹן
  choice: Китрона
  rationale: Название места передано транслитерацией с древнееврейского текста.
- source_word: נַהֲלֹל
  choice: Нахалола
  rationale: Название передано в соответствии с огласовкой данного стиха; вариант формы отмечен в сноске.
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  choice: Хананеи жили среди него
  rationale: Существительное «хананей» в еврейском стоит в собирательном единственном числе, поэтому по-русски естественно употреблено множественное число. Местоимение «него» сохраняет единственное число суффикса и представляет Завулона как колено, то есть единое целое.
- source_word: לָמַס
  choice: подневольными работниками
  rationale: מַס здесь обозначает обязательный труд, наложенный на покорённое население, а не только денежную дань. Выбранная формулировка ясно передаёт принудительный характер труда.
- source_word: וַיִּהְיוּ לָמַס
  choice: стали подневольными работниками
  rationale: Глагольная конструкция указывает на новый зависимый статус хананеев; «стали» сохраняет значение наступившего результата.
theological_decisions:
- issue: Собирательное единственное число הַכְּנַעֲנִי и суффикс единственного числа в בְּקִרְבּוֹ
  choice: «Хананеи жили среди него»
  alternative: «Хананей жил среди него» или «хананеи жили среди них»
  rationale: Множественное число «хананеи» естественно раскрывает собирательное значение названия народа, а «среди него» сохраняет грамматическое представление колена Завулона как единого целого. Сноска поясняет непривычное для русского языка сочетание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; при этом собирательность этнонима и корпоративное единственное число названия колена не устранены молча, а отражены в тексте и пояснены в сноске.
