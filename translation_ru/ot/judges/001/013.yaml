base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
translation:
  language: ru
  text: И захватил его Отниил, сын Кеназа, младший брат Халева[a], и Халев отдал ему в жёны свою дочь Ахсу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «Отниил, сын Кеназа, который был младшим братом Халева»; либо: «младший родственник Халева». Древнееврейская конструкция наиболее естественно означает: «брат Халева, младший его», но родственный термин иногда понимают шире.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: И захватил его
  rationale: Глагол לכד в военном контексте означает «захватить»; местоименный суффикс женского рода указывает на город из предыдущего стиха. В русском «город» мужского рода, поэтому употреблено «его».
- source_word: עָתְנִיאֵל
  choice: Отниил
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: בֶּן קְנַז
  choice: сын Кеназа
  rationale: Прямая передача обычной родословной конструкции.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: младший брат Халева
  rationale: 'Наиболее естественный синтаксический смысл: «брат Халева, младший его». Возможность более широкого значения родственного термина сохранена в сноске.'
- source_word: וַיִּתֶּן לוֹ
  choice: и Халев отдал ему
  rationale: Подлежащее восстанавливается из контекста. Имя «Халев» устраняет потенциально неясную для русского читателя цепочку местоимений; «отдал» естественно передаёт действие в контексте выдачи дочери замуж.
- source_word: עַכְסָה
  choice: Ахсу
  rationale: Традиционная русская передача имени; винительный падеж обусловлен синтаксисом.
- source_word: בִתּוֹ
  choice: свою дочь
  rationale: Возвратное притяжательное местоимение естественно указывает на дочь подлежащего, Халева.
- source_word: לְאִשָּׁה
  choice: в жёны
  rationale: Современная и естественная русская передача устойчивого древнееврейского выражения о заключении брака.
theological_decisions:
- issue: Родство Отниила с Халевом
  choice: В основном тексте Отниил назван младшим братом Халева.
  alternative: Возможно понимание «младший родственник Халева»; конструкцию также иногда относят к Кеназу, считая его младшим братом Халева.
  rationale: Древнееврейский текст наиболее естественно читается как «брат Халева, младший его», однако слово אָח может в некоторых родственных и клановых контекстах иметь более широкое значение. Неоднозначность отмечена без догматического разрешения.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Имя «Халев» повторено во второй части стиха ради ясности, поскольку буквальная цепочка местоимений по-русски двусмысленна. Маркер сноски помещён непосредственно после спорного выражения.
