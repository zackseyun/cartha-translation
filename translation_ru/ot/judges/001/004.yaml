base_translation:
  language: en
  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
translation:
  language: ru
  text: Иуда выступил[a], и Яхве предал хананеев и ферезеев[b] в их руки[c]. В Везеке они поразили десять тысяч человек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поднялся» или «пошёл вверх»; здесь речь о выступлении в поход.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте названия обоих народов стоят в единственном числе и употреблены собирательно: «хананей и ферезей».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в их руку» — еврейское выражение со значением «под их власть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: выступил
  rationale: Глагол עלה буквально означает «подняться, пойти вверх», а при описании военного движения — «выступить, двинуться». В данном контексте «выступил» естественно передаёт начало похода, не утверждая конкретного направления движения.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Название колена выступает как собирательный субъект. Сначала оно согласуется с глаголом в единственном числе, а далее участники похода обозначены множественным числом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: הַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: хананеев и ферезеев
  rationale: Обе формы морфологически стоят в единственном числе, но употреблены собирательно и обозначают народы; русское множественное число ясно передаёт этот смысл.
- source_word: בְּיָדָם
  choice: в их руки
  rationale: Еврейская идиома «дать в руку» означает отдать под власть. Русское «предать в их руки» сохраняет образ и звучит естественно.
- source_word: וַיַּכּוּם
  choice: они поразили
  rationale: נכה может означать нанесение удара, поражение или разгром. «Поразили» сохраняет военную силу выражения, не сужая его без необходимости до «убили».
- source_word: בְּבֶזֶק
  choice: в Везеке
  rationale: Предлог ב при названии места указывает на место сражения; по-русски естественно «в Везеке».
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: десять тысяч человек
  rationale: После числительного איש обозначает людей, в данном военном контексте — участников сражения. «Человек» является естественным русским счётным обозначением и не добавляет отсутствующего в тексте слова «воинов».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Личное имя сохранено как имя, без замены титулом.
- issue: Соотношение божественного и человеческого действия
  choice: «Яхве предал… они поразили»
  alternative: Сгладить повествование, приписав всё действие одному субъекту
  rationale: Текст одновременно называет Яхве дарующим победу и людей Иуды совершающими военное действие; смена субъекта и числа сохранена.
- issue: Степень определённости значения נכה
  choice: поразили
  alternative: убили
  rationale: Исходный глагол допускает поражение или разгром и сам по себе не требует более узкого толкования «убили».
translation_notes:
  register: Современный литературный русский язык с кратким повествовательным синтаксисом. «Выступил» естественно передаёт военное движение; «поразили» сохраняет смысловую широту исходного глагола. Разделение на два предложения облегчает чтение, не меняя последовательности и причинной связи событий.
