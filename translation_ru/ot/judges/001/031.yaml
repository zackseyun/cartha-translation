base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
translation:
  language: ru
  text: Аше́р не изгнал жителей Акко́[a], Сидо́на, Ахла́ва, Ахзи́ва, Хелбы́, Афи́ка и Рехо́ва.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не лишил владений» или «не вытеснил». Еврейский глагол означает лишить прежних жителей владения землёй и удалить их с неё. Акко — древний приморский город, позднее известный в европейской традиции как Акра.'
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: не изгнал
  rationale: В породе hифиль глагол ירש в контексте завоевания означает лишить прежних жителей владения землёй, вытеснить их. «Не изгнал» естественно звучит по-русски и соответствует повторяющейся формуле Суд 1.
- source_word: יֹשְׁבֵי
  choice: жителей
  rationale: Причастие от ישב обозначает людей, живущих в данном месте; «жители» кратко и точно передаёт собирательный смысл.
- source_word: עַכּוֹ
  choice: Акко́
  rationale: Название передано транслитерацией еврейской формы; позднейшее название Акра не внесено в основной текст.
- source_word: צִידוֹן
  choice: Сидо́н
  rationale: Устоявшаяся русская библейская форма географического названия.
- source_word: אַחְלָב
  choice: Ахла́в
  rationale: Географическое название транслитерировано с учётом русской передачи конечного ב как «в».
- source_word: אַכְזִיב
  choice: Ахзи́в
  rationale: Географическое название транслитерировано непосредственно с еврейской формы.
- source_word: חֶלְבָּה
  choice: Хелва́
  rationale: Передаёт масоретскую форму חֶלְבָּה; в составе фразы после «жителей» употреблён родительный падеж «Хелвы́».
- source_word: אֲפִיק
  choice: Афи́к
  rationale: Географическое название передано по еврейской форме; в русском библейском употреблении также встречается форма «Афек».
- source_word: רְחֹב
  choice: Рехо́в
  rationale: Прямая транслитерация географического названия с учётом произношения еврейской буквы ח.
- source_word: וְ/אֶת ... וְ/אֶת
  choice: а также ... и
  rationale: Повторяющиеся союзы координируют объекты при отрицательном сказуемом. В русском перечисление с «а также» и заключительным «и» звучит естественно, не меняя того факта, что отрицание относится ко всем названным жителям.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Названия снабжены ударениями для удобства чтения; синтаксис сохраняет единое отрицание, относящееся ко всему перечню. Повтор слова «жителей» перед Сидоном помогает избежать двусмысленности, а перед последующими городами он подразумевается.
