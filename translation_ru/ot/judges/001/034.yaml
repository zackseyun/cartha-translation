  yaml_path: translation/ot/judges/001/034.yaml
  text: And the Amorites pressed the sons of Dan back into the hill country[a], because they did not allow them to go down into the valley.
translation:
  language: ru
  text: Аморреи оттеснили сынов Дана в горную местность[a], потому что не позволили им спуститься в долину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «аморреи теснили сынов Дана к горной местности, потому что не позволили ему спуститься в долину». В еврейском тексте «аморрей» стоит в собирательном единственном числе, тогда как глаголы стоят во множественном числе; суффикс при втором глаголе имеет единственное число и относится к Дану как к племени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  choice: оттеснили
  rationale: Глагол выражает давление, притеснение или принуждение к стеснённому положению; в сочетании с направлением движения «в горную местность» слово «оттеснили» естественно передаёт враждебное принуждение.
- source_word: הָאֱמֹרִי
  choice: аморреи
  rationale: Форма единственного числа употреблена собирательно для обозначения народа; русский язык естественно передаёт этот смысл множественным числом.
- source_word: בְּנֵי דָן
  choice: сынов Дана
  rationale: Сохранено родоплеменное выражение оригинала; оно понятно и уместно в современном литературном русском языке.
- source_word: הָהָרָה
  choice: в горную местность
  rationale: Направительный суффикс обозначает движение к гористой области; «горная местность» естественно противопоставляется последующей «долине».
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину описанного оттеснения.
- source_word: לֹא נְתָנוֹ
  choice: не позволяли им
  rationale: В еврейском тексте сказуемое и местоименный суффикс согласованы с собирательными обозначениями в единственном числе; по-русски контекстуальный множественный смысл естественно передаётся формами «позволяли им». Несовершенный вид отражает продолжительное удерживание.
- source_word: לָרֶדֶת
  choice: спуститься
  rationale: Глагол передаёт топографическое движение вниз — из горной местности в долину.
- source_word: לָעֵמֶק
  choice: в долину
  rationale: Существительное обозначает долину или низину; «долина» прямо и ясно передаёт контраст с горной местностью.
