source:
  edition: WLC
  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
translation:
  language: ru
  text: Но Манассия не изгнал жителей Беф-Шеана и подвластных ему поселений, жителей Фаанаха и подвластных ему поселений, жителей Дора и подвластных ему поселений, жителей Ивлеама и подвластных ему поселений, жителей Мегиддо и подвластных ему поселений[a]; и хананеи упорно продолжали жить в этой земле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его дочерей» — то есть меньшие города или поселения, зависевшие от главного города.'
    reason: cultural_note
  - marker: b
    text: 'Или: «хананеи были полны решимости жить в этой земле». Еврейский глагол может выражать готовность или твёрдое намерение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: не изгнал
  rationale: В породе hифиль глагол означает лишить владения, вытеснить или изгнать. «Не изгнал» естественно по-русски передаёт контекст и подразумевает утрату территориального контроля.
- source_word: בְּנוֹתֶיהָ
  choice: зависимые от него селения
  rationale: Буквально «его дочери»; это идиома для небольших поселений, административно или территориально связанных с главным городом. Выбран ясный современный эквивалент, а буквальный образ отмечен в сноске.
- source_word: ישב דּוֹר / יוֹשְׁבֵי יִבְלְעָם / יוֹשְׁבֵי מְגִדּוֹ
  choice: жители Дора / Ивлеама / Мегиддо
  rationale: Причастные формы ישׁב обозначают людей, живущих в названных местах. «Жители» — естественное русское коллективное обозначение.
- source_word: וַיּוֹאֶל
  choice: упорно продолжали
  rationale: Глагол יאל может выражать готовность, решимость или волеизъявление. В данном контексте формулировка передаёт настойчивое намерение хананеев оставаться на земле, не устраняя лексическую неоднозначность, отмеченную в сноске.
- source_word: הַכְּנַעֲנִי
  choice: хананеи
  rationale: Грамматически единственное число употреблено собирательно для народа; в современном русском естественно множественное число.
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: жить в этой земле
  rationale: Инфинитив с ל обозначает действие, на котором настаивали хананеи; указательное הַזֹּאת передано словом «этой».
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / דּוֹר / יִבְלְעָם / מְגִדּוֹ
  choice: Беф-Сан / Фаанах / Дор / Ивлеам / Мегиддо
  rationale: Использованы узнаваемые русские библейские формы географических названий, пригодные для современного литературного текста.
theological_decisions:
- issue: Степень волевого оттенка в וַיּוֹאֶל
  choice: упорно продолжали жить
  alternative: решили жить / были полны решимости жить
  rationale: Текст подчёркивает не просто факт проживания, а волю остаться. Основной вариант звучит естественно и сохраняет напряжение между неудачей Манассии и настойчивостью хананеев; более буквальная волевая трактовка дана в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Перечень сохранён, но эллипсис исходного текста развёрнут словом «жителей» для ясности; повтор «зависимых от него селений» передаёт структуру и административную связь городов.
