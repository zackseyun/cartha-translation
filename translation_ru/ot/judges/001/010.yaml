base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
translation:
  language: ru
  text: Люди Иуды выступили против хананеев, живших в Хевроне (прежде Хеврон назывался Кириаф-Арбой), и поразили Шешая, Ахимана и Фалмая.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Поразили» можно также перевести как «разбили» или, в данном военном контексте, «убили».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶל
  choice: И пошёл Иуда против
  rationale: Глагол буквально означает «пошёл», а אֶל при обозначении враждебной стороны в военном повествовании передаёт направленность выступления против неё. Формулировка сохраняет образ движения и проясняет военный контекст.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Название употреблено собирательно, обозначая племя Иуды; сохранение единственного имени близко к еврейскому тексту, тогда как последующее множественное «они поразили» отражает собирательный смысл.
- source_word: הַכְּנַעֲנִי
  choice: хананеев
  rationale: Морфологически это единственное число, но здесь оно естественно понимается собирательно как название народа; русское множественное число уместно в данном военном контексте.
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  choice: живших в Хевроне
  rationale: Причастие обозначает постоянное проживание. Современная русская форма «живших» естественна и согласуется с собирательным «хананеев».
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים קִרְיַת אַרְבַּע
  choice: прежде Хеврон назывался Кириаф-Арбой
  rationale: Идиоматическая русская передача пояснения о прежнем названии города; смысл לְפָנִים («прежде, в прежние времена») сохранён.
- source_word: וַיַּכּוּ
  choice: они поразили
  rationale: נכה в военном контексте означает нанесение решительного удара, поражение противника. «Поразили» сохраняет конкретность глагола, не уточняя без необходимости, были ли названные лица убиты.
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  choice: Шешая, Ахимана и Фалмая
  rationale: Личные имена переданы традиционными русскими библейскими формами, понятными русскоязычному читателю.
theological_decisions: []
