  text: וַ/יִּלְכֹּ֤ד יְהוּדָה֙ אֶת עַזָּ֣ה וְ/אֶת גְּבוּלָ֔/הּ וְ/אֶֽת אַשְׁקְל֖וֹן וְ/אֶת גְּבוּלָ֑/הּ וְ/אֶת עֶקְר֖וֹן וְ/אֶת גְּבוּלָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/018.yaml
  text: Judah captured Gaza and its territory[a], Ashkelon and its territory, and Ekron and its territory.
translation:
  language: ru
  text: Иуда захватил Газу и её область[a], Аскалон и его область, и Экрон и его область.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «границу» — во всех трёх случаях вместо слова «область»; еврейское слово может означать как границу, так и ограниченную ею территорию.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: захватил
  rationale: Глагол לכד в контексте военных действий означает овладеть городом или местностью силой; «захватил» ясно и естественно передаёт это значение.
- source_word: יְהוּדָה
  choice: Иуда
  rationale: Имя обозначает здесь колено как единое действующее лицо. Формулировка «Иуда» сохраняет краткость оригинала и не добавляет отсутствующего в тексте пояснения «колено».
- source_word: גְּבוּלָהּ
  choice: её/его область
  rationale: Существительное גְּבוּל может обозначать как границу, так и ограниченную ею территорию. В перечне захваченных городов «область» естественно обозначает подвластную городу прилегающую территорию; лексическая неоднозначность отмечена в сноске.
- source_word: עַזָּה
  choice: Газа
  rationale: Устоявшаяся русская форма названия города.
- source_word: אַשְׁקְלוֹן
  choice: Аскалон
  rationale: Устоявшаяся русская библейская форма названия города.
- source_word: עֶקְרוֹן
  choice: Экрон
  rationale: Устоявшаяся русская библейская форма названия города.
