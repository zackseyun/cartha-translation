  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
translation:
  language: ru
  text: Сыны Иуды[a] сражались против Иерусалима[b], захватили его, поразили остриём меча и предали город огню.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Иуды»; здесь имеются в виду принадлежащие к племени Иуды.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «сражались в Иерусалиме», однако последующее повествование о захвате города поддерживает перевод «против Иерусалима».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ בְנֵי יְהוּדָה
  choice: Сыны Иуды сражались
  rationale: Форма וַיִּלָּחֲמוּ продолжает повествовательную последовательность и обозначает ведение боя; בְנֵי יְהוּדָה буквально означает «сыны Иуды» и здесь называет племенную общность.
- source_word: בִּירוּשָׁלִַם
  choice: против Иерусалима
  rationale: Предлог ב после глагола לחם в военном контексте может обозначать объект нападения. Последующие захват города и удар мечом делают направительное значение наиболее вероятным.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: захватили его
  rationale: לכד в рассказе о войне обычно означает захват города. Мужское местоимение обусловлено родом слова «Иерусалим» в русском языке.
- source_word: וַיַּכּוּהָ לְפִי חָרֶב
  choice: поразили остриём меча
  rationale: Сочетание сохраняет широкий смысл נכה («поразить») и образное выражение פִי חָרֶב, буквально связанное с «устами/лезвием меча», не добавляя прямо не названного объекта вроде жителей.
- source_word: שִׁלְּחוּ בָאֵשׁ
  choice: предали город огню
  rationale: Еврейское выражение означает отдать или предать что-либо огню, то есть сжечь; выбранная русская формулировка естественна и сохраняет образ исходного текста.
