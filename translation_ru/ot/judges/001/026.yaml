base_translation:
  language: en
  yaml_path: translation/ot/judges/001/026.yaml
  text: And the man went to the land of the Hittites and built a city and called its name Luz[a]; that is its name to this day.
translation:
  language: ru
  text: И тот человек отправился в землю хеттов, построил город и назвал его Луз[a]. Так он называется и по сей день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «назвал её имя Луз».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: отправился
  rationale: Стандартная повествовательная форма от הלך означает движение в другое место; «отправился» естественно передаёт переход человека в землю хеттов.
- source_word: הָאִישׁ
  choice: тот человек
  rationale: Определённая форма указывает на конкретного мужчину, упомянутого ранее; «тот человек» сохраняет повествовательную связь.
- source_word: אֶרֶץ הַחִתִּים
  choice: землю хеттов
  rationale: Конструктивное сочетание буквально означает «земля хеттов» и не уточняет сверх текста политический статус этой области.
- source_word: וַיִּבֶן עִיר
  choice: построил город
  rationale: Прямое и естественное соответствие сочетанию בנה с עִיר; «основал» было бы более интерпретирующим.
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  choice: назвал его Луз
  rationale: Еврейская идиома буквально говорит «назвал её имя Луз»; современное русское «назвал его Луз» передаёт тот же смысл естественно, причём местоимение согласуется с русским словом «город».
- source_word: לוּז
  choice: Луз
  rationale: Название места передано принятой русской библейской транслитерацией.
- source_word: הוּא שְׁמָהּ
  choice: Так он называется
  rationale: Именная конструкция утверждает неизменность названия; по-русски эта формулировка естественно связывается с последующим «и по сей день».
- source_word: עַד הַיּוֹם הַזֶּה
  choice: и по сей день
  rationale: Устойчивое современное русское соответствие еврейской временной формуле «до этого дня».
