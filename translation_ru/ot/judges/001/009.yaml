  text: וְ/אַחַ֗ר יָֽרְדוּ֙ בְּנֵ֣י יְהוּדָ֔ה לְ/הִלָּחֵ֖ם בַּֽ/כְּנַעֲנִ֑י יוֹשֵׁ֣ב הָ/הָ֔ר וְ/הַ/נֶּ֖גֶב וְ/הַ/שְּׁפֵלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
translation:
  language: ru
  text: После этого сыны Иуды спустились сразиться с хананеями, жившими в нагорье, Негеве и Шефеле[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «низменности». Шефела — область холмистых предгорий между Иудейским нагорьем и прибрежной равниной.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: После этого
  rationale: Передаёт последовательность событий без уточнения продолжительности промежутка времени.
- source_word: יָרְדוּ
  choice: спустились
  rationale: Сохраняет буквальный направительный и топографический смысл глагола ירד.
- source_word: בְּנֵי יְהוּדָה
  choice: сыны Иуды
  rationale: Формально передаёт выражение «сыны Иуды», которое здесь обозначает членов колена Иуды.
- source_word: לְהִלָּחֵם
  choice: сразиться
  rationale: Естественно передаёт целевое значение инфинитива «воевать, вступить в бой» в данном повествовательном контексте.
- source_word: בַּכְּנַעֲנִי
  choice: с хананеями
  rationale: Единственное число в еврейском употреблено собирательно; русское множественное число ясно обозначает народ. Предлог «с» при глаголе «сразиться» однозначно выражает противоборство.
- source_word: יוֹשֵׁב
  choice: жившими
  rationale: Передаёт причастие со значением постоянного проживания и согласуется с собирательно понятым названием народа.
- source_word: הָהָר
  choice: нагорье
  rationale: Обозначает горную область, а не одну отдельную гору, и естественно вписывается в перечень географических зон.
- source_word: הַנֶּגֶב
  choice: Негев
  rationale: В перечне регионов слово обозначает конкретную южную географическую область.
- source_word: הַשְּׁפֵלָה
  choice: Шефела
  rationale: Топонимическая передача сохраняет обозначение конкретной области Иудейских предгорий; значение пояснено в сноске.
