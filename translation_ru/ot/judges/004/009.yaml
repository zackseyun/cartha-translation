  text: וַ/תֹּ֜אמֶר הָלֹ֧ךְ אֵלֵ֣ךְ עִמָּ֗/ךְ אֶ֚פֶס כִּי֩ לֹ֨א תִֽהְיֶ֜ה תִּֽפְאַרְתְּ/ךָ֗ עַל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אַתָּ֣ה הוֹלֵ֔ךְ כִּ֣י בְֽ/יַד אִשָּׁ֔ה יִמְכֹּ֥ר יְהוָ֖ה אֶת סִֽיסְרָ֑א וַ/תָּ֧קָם דְּבוֹרָ֛ה וַ/תֵּ֥לֶך עִם בָּרָ֖ק קֶֽדְשָׁ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/009.yaml
  text: And she said[a], “I will surely go with you. Nevertheless, the honor will not be yours on the way that you are going, for Yahweh will sell Sisera into the hand of a woman.” Then Deborah arose and went with Barak to Kedesh.
translation:
  language: ru
  text: 'Она сказала: «Я непременно пойду с тобой. Но на пути, которым ты идёшь, слава достанется не тебе, потому что Яхве продаст[a] Сисару в руки женщины». Затем Девора встала и пошла с Вараком в Кедеш.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, более идиоматично: «Яхве предаст Сисару в руки женщины».'
    reason: 'Лексическая альтернатива для יִמְכֹּר: буквальное «продаст» в данном контексте означает передачу врага под чужую власть.'
lexical_decisions:
- source_word: הָלֹךְ אֵלֵךְ
  choice: Я непременно пойду
  rationale: Сочетание абсолютного инфинитива с имперфектом усиливает утверждение; «непременно» естественно передаёт эту эмфазу по-русски.
- source_word: אֶפֶס
  choice: Но
  rationale: Частица вводит ограничение к данному согласию; краткий противительный союз естественен в современной русской речи.
- source_word: תִּפְאַרְתְּךָ
  choice: слава достанется не тебе
  rationale: В военном контексте речь идёт о славе и почёте за победу; такая формулировка ясно передаёт также притяжательный суффикс.
- source_word: עַל הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ
  choice: на пути, которым ты идёшь
  rationale: Сохраняется образ пути и присущая выражению неоднозначность между буквальным путём и избранным ходом действий.
- source_word: בְיַד אִשָּׁה
  choice: в руки женщины
  rationale: Русская форма с множественным числом «руки» естественно передаёт древнееврейскую идиому о передаче под чью-либо власть.
- source_word: יִמְכֹּר
  choice: продаст
  rationale: Сохранено прямое лексическое значение глагола «продавать»; более идиоматичный смысл указан в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: וַתָּקָם
  choice: встала
  rationale: Сохраняет последовательность повествования и обычное значение глагола без ненужного уточнения.
- source_word: דְּבוֹרָה / בָּרָק / סִיסְרָא / קֶדְשָׁה
  choice: Девора / Варак / Сисара / Кедеш
  rationale: Имена собственные переданы принятыми русскими библейскими формами.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Кому достанется слава за победу
  choice: слава достанется не Вараку, поскольку Сисара будет отдан в руки женщины
  alternative: полное устранение всякой славы Варака
  rationale: Притяжательная конструкция указывает на утрату ожидаемой воинской славы, но текст не требует вывода, что Варак вообще не получит никакого признания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Сохранены образ пути, усиление обещания и резкая метафора «продаст», при этом её идиоматический смысл пояснён в сноске.
