  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ הַשְׁקִי/נִי נָ֥א מְעַט מַ֖יִם כִּ֣י צָמֵ֑אתִי וַ/תִּפְתַּ֞ח אֶת נֹ֧אוד הֶ/חָלָ֛ב וַ/תַּשְׁקֵ֖/הוּ וַ/תְּכַסֵּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/019.yaml
  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
translation:
  language: ru
  text: 'Он сказал ей: «Дай мне, пожалуйста, немного воды, потому что я хочу пить». Она открыла бурдюк с молоком[a], напоила его и укрыла.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бурдюк — сосуд из выделанной шкуры; речь идёт не о современной бутылке.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁקִי/נִי
  choice: Дай мне … воды
  rationale: Побудительная форма глагола שׁקה с суффиксом первого лица означает «дай мне пить / напои меня». В сочетании с прямым дополнением «воды» естественный русский эквивалент — «дай мне … воды».
- source_word: נָא
  choice: пожалуйста
  rationale: Частица смягчает повеление и выражает вежливую просьбу; современное «пожалуйста» точно передаёт её функцию.
- source_word: מְעַט מַיִם
  choice: немного воды
  rationale: Передаёт указание на небольшое количество без ненужного усиления.
- source_word: כִּי צָמֵאתִי
  choice: потому что я хочу пить
  rationale: כִּי вводит причину просьбы, а русское «хочу пить» естественно передаёт состояние, выраженное глаголом צמא.
- source_word: נֹאוד הֶ/חָלָב
  choice: бурдюк с молоком
  rationale: נֹאוד — сосуд из шкуры; «бурдюк» сохраняет древнюю бытовую реалию. Конструкция указывает, что в нём было молоко, что естественно выражается оборотом «с молоком».
- source_word: וַתַּשְׁקֵ/הוּ
  choice: напоила его
  rationale: Каузативная форма שׁקה означает, что она дала ему пить. Глагол «напоила» краток, естественен и не подразумевает принуждения; из предыдущей фразы ясно, что речь о молоке.
- source_word: וַתְּכַסֵּ/הוּ
  choice: укрыла
  rationale: Прямо передаёт действие כסה, оставляя предмет, которым она его укрыла, неуточнённым, как и в еврейском тексте.
