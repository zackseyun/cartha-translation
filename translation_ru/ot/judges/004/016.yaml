base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
translation:
  language: ru
  text: А Варак преследовал колесницы и войско до Харошет-Гоима[a]. Всё войско Сисары пало от острия меча; не осталось ни одного.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Харошет народов»; традиционно название передаётся как «Харошет-Гоим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָדַף אַחֲרֵי
  choice: преследовал
  rationale: Точно и естественно передаёт активное преследование противника в бою.
- source_word: הָרֶכֶב
  choice: колесницы
  rationale: Существительное имеет собирательное значение, но в контексте естественно обозначает колесницы как военную силу.
- source_word: הַמַּחֲנֶה
  choice: войско
  rationale: Здесь слово обозначает военную силу, а не место стоянки; «войско» ясно передаёт смысл.
- source_word: חֲרֹשֶׁת הַגּוֹיִם
  choice: Харошет-Гоим
  rationale: Составное географическое название передано принятой транслитерацией; значение второй части отмечено в сноске.
- source_word: וַיִּפֹּל כָּל מַחֲנֵה סִיסְרָא
  choice: Всё войско Сисары пало
  rationale: Сохраняется еврейский военный образ падения всего войска, а собирательное значение выражено естественно по-русски.
- source_word: לְפִי חֶרֶב
  choice: от острия меча
  rationale: Сохраняет образность устойчивого еврейского выражения и ясно указывает на гибель в бою.
- source_word: לֹא נִשְׁאַר עַד אֶחָד
  choice: не осталось ни одного
  rationale: Естественная русская формулировка передаёт подчёркнутую полноту разгрома.
