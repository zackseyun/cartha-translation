  text: И донесли Сисаре, что Варак, сын Авиноама, поднялся на гору Фавор.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: И донесли
  rationale: Порода hифиль глагола נגד означает «сообщить, донести». Неопределённое подлежащее во множественном числе сохранено формой третьего лица множественного числа; «донесли» естественно передаёт сообщение военачальнику.
- source_word: לְסִיסְרָא
  choice: Сисаре
  rationale: Предлог לְ обозначает адресата сообщения; по-русски это естественно передаётся дательным падежом.
- source_word: כִּי
  choice: что
  rationale: После глагола сообщения כִּי вводит содержание известия, а не причинное придаточное.
- source_word: עָלָה
  choice: поднялся
  rationale: Глагол עלה значит «подниматься, восходить». Совершенный вид естественно передаёт действие, уже совершившееся к моменту сообщения, без необходимости вводить отсутствующую в русском форму плюсквамперфекта.
- source_word: בָּרָק
  choice: Варак
  rationale: Традиционная русская библейская форма имени.
- source_word: בֶּן אֲבִינֹעַם
  choice: сын Авиноама
  rationale: Еврейская патронимическая конструкция прямо и естественно передаётся сочетанием «сын» с родительным падежом.
- source_word: הַר תָּבוֹר
  choice: гора Фавор
  rationale: Название конкретной горы передано принятой в русской библейской и географической традиции формой «гора Фавор».
