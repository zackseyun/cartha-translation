  text: וְ/חֶ֤בֶר הַ/קֵּינִי֙ נִפְרָ֣ד מִ/קַּ֔יִן מִ/בְּנֵ֥י חֹבָ֖ב חֹתֵ֣ן מֹשֶׁ֑ה וַ/יֵּ֣ט אָהֳל֔/וֹ עַד אֵל֥וֹן ב/צענים אֲשֶׁ֥ר אֶת קֶֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
translation:
  language: ru
  text: Хевер, кенеец, отделился от кенеев, потомков Ховава, тестя Моисея[a], и раскинул свой шатёр до дуба в Цаананниме[b], что близ Кедеша.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родственника Моисея по браку»; еврейское слово может иметь более широкое значение, чем «тесть».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «до терпентинного дерева в Цаананниме».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  choice: отделился
  rationale: Нифаль глагола פרד обозначает отделение от группы; русское «отделился» естественно передаёт это значение и сохраняет функцию стиха как поясняющего предысторию.
- source_word: מִקַּיִן / הַקֵּינִי
  choice: от кенеян / Хевер-кенеянин
  rationale: В данном контексте формы относятся к народу или роду кенеян, а не к Каину как отдельному лицу. Разные русские грамматические формы естественно передают этноним и обозначение принадлежности к нему.
- source_word: מִבְּנֵי חֹבָב
  choice: потомков Ховава
  rationale: Буквально «из сыновей Ховава» здесь обозначает родовую линию; «потомков» ясно передаёт коллективный смысл без предположения, что речь лишь о непосредственных сыновьях.
- source_word: חֹתֵן מֹשֶׁה
  choice: тестя Моисея
  rationale: Термин обычно обозначает родственника по браку и нередко конкретно тестя. В связи с Ховавом это традиционное и вероятное понимание, а более широкое значение отмечено в сноске.
- source_word: וַיֵּט אָהֳלוֹ
  choice: раскинул свой шатёр
  rationale: Идиома נטה אהל означает поставить или раскинуть шатёр. Выбранное выражение естественно для современного литературного русского языка.
- source_word: עַד אֵלוֹן
  choice: у дуба
  rationale: В описании места стоянки русское «у дуба» естественно передаёт достигнутую точку, обозначенную עַד, не создавая неуместного впечатления протяжённости самого шатра.
- source_word: אֵלוֹן
  choice: дуб
  rationale: Слово обозначает крупное дерево, которое может пониматься как дуб или терпентинное дерево; основной текст использует ясное и распространённое «дуб», а альтернатива дана в сноске.
- source_word: בצענים
  choice: в Цаананниме
  rationale: Это географическое название с не вполне уверенной огласовкой; оно передано транслитерацией, а не истолковано как нарицательное слово.
- source_word: אֲשֶׁר אֶת קֶדֶשׁ
  choice: что близ Кедеша
  rationale: Конструкция указывает на близость названного места к Кедешу; краткая формулировка сохраняет географическое отношение и звучит естественно.
theological_decisions:
- issue: Степень родства, выраженная словом חֹתֵן
  choice: тесть Моисея
  alternative: родственник Моисея по браку
  rationale: В этом повествовательном контексте значение «тесть» вероятно и привычно, однако еврейское слово допускает более широкое обозначение свойства. Поэтому неоднозначность не устранена молча, а отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким библейским регистром. Формулировка сохраняет поясняющий характер стиха, избегает лишнего временного маркера и ставит сноску [a] непосредственно при спорном обозначении родства.
