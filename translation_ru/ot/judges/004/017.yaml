base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
translation:
  language: ru
  text: А Сисара бежал пешком к шатру Иаили, жены Хевера, кенеянина, потому что между Иавином, царём Асора, и домом Хевера, кенеянина[a], был мир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом Хевера» — его семья, домашние или род.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙
  choice: А Сисара
  rationale: Союз ו может передаваться как «и», однако здесь «а» естественно обозначает смену участника и повествовательный контраст с разгромом войска Сисары, не добавляя противопоставления сильнее исходного.
- source_word: נָ֣ס בְּ/רַגְלָ֔י/ו
  choice: пешком бежал
  rationale: Глагол נוּס означает «бежать, спасаться бегством», а выражение בְּרַגְלָיו — буквально «на своих ногах»; русское «пешком бежал» ясно противопоставляет бегство оставленной колеснице.
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל
  choice: к шатру Иаили
  rationale: «Шатёр» точно и естественно передаёт אֹהֶל; форма «Иаили» соответствует русскому склонению имени Иаиль.
- source_word: אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  choice: жены Хевера-кениянина
  rationale: Сохранено прямое определение личности Иаили; этноним передан традиционным и понятным русским словом «кениянин».
- source_word: כִּ֣י שָׁל֗וֹם
  choice: потому что … был мир
  rationale: כִּי вводит причину, а שָׁלוֹם обозначает мирные отношения без обязательного указания на формальный союз или договор.
- source_word: בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי
  choice: домом Хевера-кениянина
  rationale: «Дом» сохраняет широкий социальный смысл בֵּית — семью, домашних или род — не сужая его до одного из возможных значений.
