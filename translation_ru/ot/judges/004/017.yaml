  terminology: Традиционная и нормативная русская библейская передача этнонима קֵינִי — «кенеянин» (мн. «кенеяне»), а не «кениянин». «Дом Хевера» обоснованно сохранён как широкий термин; сноска корректно раскрывает его возможные социальные значения.
