base_translation:
  language: en
  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
translation:
  language: ru
  text: Я приведу к тебе, к потоку Кишон[a], Сисару, военачальника войска Иавина, с его колесницами и всем его множеством[b] и отдам его в твою руку».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к реке Кишон», «к руслу Кишона». Еврейское слово может обозначать поток, русло временного водотока или его долину.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «со всем его войском». Буквально: «с его множеством».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁכְתִּי
  choice: Я приведу
  rationale: Глагол משׁך буквально связан с тягой или влечением, а здесь означает, что Бог направит Сисару к назначенному месту. «Приведу» естественно по-русски и не добавляет оттенка хитрого заманивания.
- source_word: אֵלֶיךָ אֶל נַחַל קִישׁוֹן
  choice: к тебе, к потоку Кишон
  rationale: Повтор предлога сохранён, поскольку еврейский текст обозначает и движение к Вараку, и место встречи. נחל может означать поток, водоток или долину временного потока; «поток» понятно современному читателю и сохраняет географическую неоднозначность.
- source_word: סִיסְרָא
  choice: Сисару
  rationale: Принятая русская библейская форма имени; винительный падеж обусловлен синтаксисом.
- source_word: שַׂר צְבָא יָבִין
  choice: военачальника Иавина
  rationale: שׂר צבא обозначает начальника войска. «Военачальник» точно и естественно передаёт военную должность без архаического «вождь войска».
- source_word: רִכְבּוֹ
  choice: его колесницами
  rationale: רכב здесь может коллективно обозначать колесничные силы; форма множественного числа «колесницы» ясно передаёт предметный и военный смысл.
- source_word: הֲמוֹנוֹ
  choice: всем его множеством
  rationale: המון шире технического обозначения армии и буквально означает многочисленную массу или множество. Такой перевод сохраняет лексическую широту, а контекст допускает понимание как войска.
- source_word: וּנְתַתִּיהוּ בְּיָדֶךָ
  choice: и отдам его в твою руку
  rationale: Сохранена устойчивая древнееврейская метафора передачи человека под чужую власть; в русском библейском регистре она понятна без поясняющей замены на «в твою власть».
theological_decisions:
- issue: Божественная причинность в движении Сисары
  choice: «Я приведу» сохраняет прямое действие Бога
  alternative: «Я заманю»
  rationale: Исходный глагол выражает причинное направление к месту, но сам по себе не требует оттенка обмана; перевод не уточняет способ осуществления действия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены образ «в твою руку» и широкое значение слова «множество»; сложный порядок дополнений перестроен лишь настолько, чтобы фраза звучала естественно.
