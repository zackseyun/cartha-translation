base_translation:
  language: en
  yaml_path: translation/ot/judges/004/022.yaml
  text: And look, Barak was pursuing Sisera. Jael went out to meet him and said to him, “Come, and I will show you the man whom you are seeking.” So he went in to her, and look, Sisera was lying there dead, with the tent peg in his temple.
translation:
  language: ru
  text: 'И вот, Варак преследовал Сисару. Иаиль вышла ему навстречу и сказала: «Иди, я покажу тебе человека, которого ты ищешь». Он вошёл к ней — и вот, Сисара лежит мёртвый, а кол в его виске.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: «И вот»
  rationale: Передаёт дейктическую и повествовательно-эмфатическую функцию הִנֵּה естественным современным русским оборотом; повтор сохранён по смыслу в обеих позициях.
- source_word: רֹדֵף
  choice: «преследовал»
  rationale: Причастие описывает продолжающееся действие Варака в момент встречи с Иаиль.
- source_word: לֵךְ
  choice: «Иди»
  rationale: Обычное значение императива; в данном контексте это приглашение последовать за Иаиль, без необходимости уточнять направление.
- source_word: נֹפֵל מֵת
  choice: «лежит мёртвый»
  rationale: Буквально сочетание связано с состоянием павшего/лежащего мёртвым. Русское выражение естественно передаёт наблюдаемую сцену и сохраняет образ результата падения.
- source_word: הַיָּתֵד
  choice: «кол»
  rationale: В контексте речь о коле для шатра; краткое «кол» естественно, а предмет уже однозначно известен из ближайшего повествования.
- source_word: בְּרַקָּתוֹ
  choice: «в его виске»
  rationale: Точное анатомическое значение существительного רַקָּה; предлог בְּ передан как местонахождение вонзившегося кола.
theological_decisions: []
