base_translation:
  language: en
  yaml_path: translation/ot/judges/004/024.yaml
  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
translation:
  language: ru
  text: И рука[a] сынов Израиля[b] всё сильнее давила на Иавина, царя Ханаана,[c] пока они не уничтожили[d] Иавина, царя Ханаана.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Рука» здесь означает силу или власть.
    reason: idiom_explanation
  - marker: b
    text: 'Или «израильтян». Буквально: «сынов Израиля».'
    reason: lexical_alternative
  - marker: c
    text: Еврейское выражение буквально изображает руку сынов Израиля, которая продолжала становиться всё тяжелее или суровее против Иавина; смысл — их давление на него неуклонно усиливалось.
    reason: idiom_explanation
  - marker: d
    text: 'Буквально: «отсекли»; то есть уничтожили или окончательно устранили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ יַד
  choice: рука … давила
  rationale: Сохранён конкретный еврейский образ «руки» как силы и власти; глагольное выражение передано естественной русской конструкцией, описывающей продолжающееся давление.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Передаёт форму оригинала и остаётся понятным в библейском повествовании; более плавный вариант — «израильтяне» — указан в сноске.
- source_word: הָלוֹךְ וְקָשָׁה
  choice: всё тяжелее
  rationale: Сочетание инфинитива абсолютного с וַתֵּלֶךְ выражает постепенное усиление, а קָשָׁה допускает оттенки тяжести, суровости и силы. Перевод передаёт нарастающее давление, не сводя выражение только к военной мощи.
- source_word: עַל
  choice: на
  rationale: С глаголом «давила» естественно выражает направленное против Иавина враждебное воздействие.
- source_word: הִכְרִיתוּ
  choice: истребили
  rationale: Hiphil от כרת буквально связан с «отсечением», а в данном контексте означает решительное уничтожение или устранение. «Истребили» ясно передаёт контекстуальный смысл.
