translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Сохранены повтор «сверни… свернул» и почтительное обращение «господин мой». Необычный предмет שׂמיכה передан нейтрально, а его возможные значения вынесены в примечание.
