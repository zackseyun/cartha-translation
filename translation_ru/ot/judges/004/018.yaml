base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
translation:
  language: ru
  text: 'Иаиль вышла навстречу Сисаре и сказала ему: «Сверни, господин мой, сверни ко мне, не бойся». Он свернул к ней в шатёр, и она укрыла его покрывалом[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может обозначать также одеяло, ковёр или иную ткань, которой накрывают.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: вышла
  rationale: Глагол יצא обозначает движение наружу; «вышла» естественно передаёт, что Иаиль покинула шатёр и направилась к Сисаре.
- source_word: לִקְרַאת
  choice: навстречу
  rationale: Форма выражает целенаправленное движение к человеку; «вышла навстречу» — естественное русское сочетание.
- source_word: סוּרָה
  choice: сверни ко мне
  rationale: סור буквально означает отклониться или свернуть с пути. Формулировка сохраняет образ ухода с дороги и повтор глагола, не сводя приглашение лишь к «войди».
- source_word: אֲדֹנִי
  choice: господин мой
  rationale: Почтительное обращение к мужчине более высокого положения; традиционный порядок слов сохраняет достоинство повествовательного регистра и не превращает обращение в божественный титул.
- source_word: אַל תִּירָא
  choice: не бойся
  rationale: Прямое и естественное современное соответствие стандартной формуле успокоения.
- source_word: וַיָּסַר
  choice: он свернул
  rationale: Повтор того же русского глагола сохраняет лексическую связь с приглашением Иаили и показывает отклик Сисары.
- source_word: הָאֹהֱלָה
  choice: в шатёр
  rationale: Направительный суффикс указывает движение к шатру; контекст подразумевает вход внутрь, что по-русски естественно передаётся конструкцией «в шатёр».
- source_word: וַתְּכַסֵּהוּ
  choice: она укрыла его
  rationale: כסה значит «покрывать, укрывать». «Укрыла» естественно описывает действие с покрывалом, не утверждая прямо, что целью было сокрытие.
- source_word: בַּשְּׂמִיכָה
  choice: покрывалом
  rationale: Редкое слово שׂמיכה обозначает тканевое покрытие, возможно одеяло или ковёр. Нейтральное «покрывало» сохраняет предметную неопределённость.
