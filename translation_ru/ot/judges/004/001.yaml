  yaml_path: translation/ot/judges/004/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh after Ehud died[a].
translation:
  language: ru
  text: И сыны Израиля[a] снова делали зло в глазах Яхве после смерти Аода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтяне». Буквально: «сыны Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: снова стали делать
  rationale: Конструкция יסף с инфинитивом выражает повторение действия. «Снова стали делать» естественно передаёт очередное возвращение Израиля ко злу в повествовательном цикле книги Судей.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально соответствует еврейскому выражению и сохраняет его традиционный корпоративный образ; более естественный русский вариант указан в сноске.
- source_word: הָרַע
  choice: зло
  rationale: Субстантивированное прилагательное с артиклем обозначает то, что оценивается как злое; в этой устойчивой формуле по-русски кратко и естественно звучит «делать зло».
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет прозрачный и понятный в русском языке образ еврейского оборота, не заменяя его интерпретирующим выражением.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: וְאֵהוּד מֵת
  choice: после смерти Аода
  rationale: Формально сочинённая именная конструкция с qatal по контексту задаёт временное обстоятельство возобновления зла. «После смерти Аода» естественно выражает эту связь, не уточняя аспект сверх необходимого.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Корпоративное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне
  rationale: Основной текст сохраняет грамматически мужской и образный характер исходного выражения, а сноска даёт естественный коллективный эквивалент без изменения референции.
- issue: Временная связь заключительной части стиха
  choice: после смерти Аода
  alternative: и Аод умер
  rationale: Контекст указывает, что смерть Аода служит временным фоном нового отступления. Выбранный вариант передаёт эту связь, не превращая заключительные слова в отдельное последовательное событие.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Начальное «И» сохраняет связь с предшествующим рассказом; выражение «в глазах» удерживает исходную метафору. Имя אֵהוּד передано в принятой русской библейской форме «Аод».
