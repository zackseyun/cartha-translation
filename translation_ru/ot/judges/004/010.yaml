base_translation:
  language: en
  yaml_path: translation/ot/judges/004/010.yaml
  text: Then Barak summoned Zebulun and Naphtali to Kedesh[a], and ten thousand men went up following him, and Deborah went up with him.
translation:
  language: ru
  text: И Варак созвал Завулона и Неффалима в Кедес. Десять тысяч человек поднялись, следуя за ним[a], и Девора поднялась вместе с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «у его ног» — то есть следуя за ним, под его предводительством.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: созвал
  rationale: Порода hифиль глагола זעק здесь обозначает призыв людей собраться; «созвал» естественно передаёт военный контекст, не добавляя оттенка формального набора.
- source_word: אֶת זְבוּלֻן וְאֶת נַפְתָּלִי
  choice: Завулона и Неффалима
  rationale: Названия колен выступают прямыми дополнениями и переданы в традиционной русской библейской форме.
- source_word: קֶדְשָׁה
  choice: в Кедес
  rationale: Направительный суффикс указывает на движение к месту; по-русски направление естественно выражается сочетанием «в Кедес».
- source_word: וַיַּעַל
  choice: поднялись
  rationale: Сохраняет основное значение עלה — движение вверх — и подходит как для рельефа, так и для военного выступления.
- source_word: בְּרַגְלָיו
  choice: за ним
  rationale: Буквально «у его ног»; в данном контексте оборот означает следование за Вараком под его предводительством. Буквальный образ отмечен в сноске.
- source_word: עֲשֶׂרֶת אַלְפֵי אִישׁ
  choice: десять тысяч воинов
  rationale: Слово אִישׁ буквально означает «мужчина/человек», но в военном контексте речь идёт о боевой силе; «воинов» ясно и естественно передаёт смысл.
- source_word: וַתַּעַל עִמּוֹ דְּבוֹרָה
  choice: и Девора поднялась вместе с ним
  rationale: Передаёт сопровождение Варака Деворой и сохраняет повтор глагола עלה, важный для ритма повествования.
