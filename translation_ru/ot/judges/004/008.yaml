  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
translation:
  language: ru
  text: 'Варак сказал ей: «Если ты пойдёшь со мной, то я пойду; а если ты не пойдёшь со мной, то я не пойду».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: сказал ей
  rationale: Стандартная повествовательная форма אמר с אֶל и суффиксом 3-го лица женского рода; естественная современная русская передача обращения к Деворе.
- source_word: בָּרָק
  choice: Варак
  rationale: Традиционная русская библейская передача личного имени.
- source_word: אִם תֵּלְכִי עִמִּי
  choice: если ты пойдёшь со мной
  rationale: Условная частица אִם и имперфект 2-го лица женского рода выражают условие; будущее время естественно для русского условного периода.
- source_word: וְהָלָכְתִּי
  choice: то и я пойду
  rationale: Перфект 1-го лица после условной посылки обозначает следствие. «То» ясно передаёт структуру условия, а «и» подчёркивает, что решение Варака зависит от участия Деворы.
- source_word: וְאִם לֹא תֵלְכִי עִמִּי
  choice: а если ты не пойдёшь со мной
  rationale: וְ вводит противопоставленное второе условие; русское «а» естественно сохраняет контраст без чрезмерного усиления.
- source_word: לֹא אֵלֵךְ
  choice: то и я не пойду
  rationale: Отрицательный имперфект 1-го лица выражает отказ идти при невыполнении условия; параллельная конструкция сохраняет риторическую симметрию еврейского текста.
