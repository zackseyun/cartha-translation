  text: וַ/יַּכְנַ֤ע אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֵ֖ת יָבִ֣ין מֶֽלֶךְ כְּנָ֑עַן לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/023.yaml
  text: So on that day God subdued Jabin king of Canaan before the sons of Israel[a].
translation:
  language: ru
  text: В тот день Бог покорил Иавина, царя Ханаана, перед сынами Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед израильтянами»; буквально: «перед сынами Израиля».'
    reason: Лексическая альтернатива поясняет буквальное выражение и его естественный русский эквивалент.
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: покорил
  rationale: Каузативная форма породы hифиль от כנע обозначает приведение противника в подчинение. «Покорил» естественно передаёт военное и политическое поражение, не сводя смысл к внутреннему смирению.
- source_word: אֱלֹהִים
  choice: Бог
  rationale: В данном контексте существительное однозначно обозначает Бога Израиля как непосредственного деятеля.
- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественное русское соответствие временному указанию, сохраняющее его повествовательную функцию.
- source_word: יָבִין
  choice: Иавина
  rationale: Традиционная русская библейская форма имени; винительный падеж обусловлен ролью прямого дополнения, отмеченного אֵת.
- source_word: מֶלֶךְ כְּנָעַן
  choice: царя Ханаана
  rationale: Конструктивное сочетание прямо означает правителя Ханаана; приложение согласовано с именем в винительном падеже.
- source_word: לִפְנֵי
  choice: перед
  rationale: 'Сохранён широкий пространственно-реляционный образ еврейского выражения: Иавин был покорён перед Израилем, то есть в противостоянии ему и при его участии; перевод не уточняет эту связь сверх оригинала.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынами Израиля
  rationale: Буквальное выражение «сыны Израиля» сохраняет мужскую форму и традиционный образ исходного текста; творительный падеж требуется предлогом «перед».
theological_decisions:
- issue: Божественная инициатива в победе Израиля
  choice: 'Бог назван непосредственным субъектом действия: «Бог покорил».'
  alternative: Передать фразу так, будто победу одержал прежде всего Израиль.
  rationale: В еврейском тексте אֱלֹהִים прямо выступает подлежащим; перевод должен сохранять явное утверждение о действии Бога.
- issue: Обозначение народа завета
  choice: «сыны Израиля»
  alternative: «израильтяне» или «народ Израиля»
  rationale: Исходное בְּנֵי יִשְׂרָאֵל буквально означает «сыны Израиля». Основной текст сохраняет эту форму, а более естественные функциональные соответствия приводятся в примечании.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской лексикой. «Покорил» звучит ясно и достойно; форма «сыны Израиля» сохраняет исходный образ, а примечание помогает обычному читателю.
