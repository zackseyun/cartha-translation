  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
translation:
  language: ru
  text: Тогда Сисара созвал все свои колесницы — девятьсот железных колесниц — и весь народ, который был с ним, из Харошет-ха-Гоима к потоку Кишон[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к реке Кишон», «к руслу Кишона»; еврейское слово нахаль может обозначать поток, русло или долину сезонного водотока.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: созвал
  rationale: В военном контексте глагол обозначает призыв и сбор сил; «созвал» передаёт это значение естественно и без излишней конкретизации.
- source_word: רִכְבּוֹ
  choice: все свои колесницы
  rationale: Хотя существительное может собирательно обозначать колесничное войско, последующее уточнение «девятьсот железных колесниц» поддерживает конкретное значение.
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: девятьсот железных колесниц
  rationale: Прямо передаёт числительное и устойчивое древнееврейское выражение; «железные» не уточняет сверх текста, шла ли речь об обшивке, деталях или вооружении.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: весь народ, который был с ним
  rationale: Сохраняет буквальное значение עָם и военную окраску контекста, не заменяя неоднозначное слово более узким «войско».
- source_word: מֵחֲרֹשֶׁת הַגּוֹיִם
  choice: из Харошет-Гоима
  rationale: Название места передано транслитерацией; предлог מִן обозначает исходный пункт движения.
- source_word: נַחַל קִישׁוֹן
  choice: к потоку Кишон
  rationale: נַחַל может обозначать поток, русло или сезонную речную долину; «поток» естественно по-русски и сохраняет географическую неопределённость лучше, чем однозначное «река».
