revisions:
- from: 'Она послала за Вараком, сыном Авиноама, и вызвала его из Кедес-Неффалима. Она сказала ему: «Разве не повелел Господь, Бог Израиля: „Ступай, выступи к горе Фавор и возьми с собой десять тысяч человек из потомков Неффалима и Завулона“?»'
  to: 'Она послала за Вараком, сыном Авиноама, из Кедес-Неффалима и призвала его. Она сказала ему: «Разве не повелел Господь, Бог Израиля: „Ступай, направься к горе Фавор и возьми с собой десять тысяч человек из числа потомков Неффалима и из числа потомков Завулона“?»'
  rationale: Перестроено начало стиха, чтобы «из Кедес-Неффалима» однозначно характеризовало Варака, как в еврейском тексте. «Направься к горе» заменяет менее естественное «выступи к горе», сохраняя семантическую широту משך и направительное прочтение предлога בְּ. Смысл, вопросительная форма и традиционная терминология не изменены.
