  text: וַ/תִּשְׁלַ֗ח וַ/תִּקְרָא֙ לְ/בָרָ֣ק בֶּן אֲבִינֹ֔עַם מִ/קֶּ֖דֶשׁ נַפְתָּלִ֑י וַ/תֹּ֨אמֶר אֵלָ֜י/ו הֲ/לֹ֥א צִוָּ֣ה יְהוָ֣ה אֱלֹהֵֽי יִשְׂרָאֵ֗ל לֵ֤ךְ וּ/מָֽשַׁכְתָּ֙ בְּ/הַ֣ר תָּב֔וֹר וְ/לָקַחְתָּ֣ עִמְּ/ךָ֗ עֲשֶׂ֤רֶת אֲלָפִים֙ אִ֔ישׁ מִ/בְּנֵ֥י נַפְתָּלִ֖י וּ/מִ/בְּנֵ֥י זְבֻלֽוּן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/006.yaml
  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: ru
  text: 'Она послала за Вараком, сыном Авиноама, из Кедес-Неффалима и призвала его. Она сказала ему: «Разве не повелел Господь, Бог Израиля: „Ступай, направься к горе Фавор и возьми с собой десять тысяч человек из числа потомков Неффалима и из числа потомков Завулона“?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: послала за… и вызвала
  rationale: 'Передаёт два последовательных действия: Девора отправила посланца и призвала Варака к себе; русское «послала и позвала» могло бы ошибочно означать, что она послала самого Варака.'
- source_word: מִקֶּדֶשׁ נַפְתָּלִי
  choice: из Кедес-Неффалима
  rationale: Географическое обозначение передано традиционной русской библейской формой, указывающей на Кедес в уделе Неффалима.
- source_word: הֲלֹא צִוָּה
  choice: Разве не повелел
  rationale: Сохраняет форму риторического вопроса, предполагающего утвердительный ответ, не превращая слова Деворы в простое утверждение.
- source_word: לֵךְ וּמָשַׁכְתָּ
  choice: Ступай, выступи
  rationale: Глагол משך здесь допускает оттенки движения, выдвижения или стягивания сил. «Выступи» естественно в военном контексте и не добавляет объекта, которого нет в еврейском тексте.
- source_word: בְּהַר תָּבוֹר
  choice: к горе Фавор
  rationale: Предлог בְּ при глаголе движения допускает направительное понимание; «к горе» сохраняет военный смысл выдвижения, не уточняя без необходимости, следует ли подняться на вершину.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: десять тысяч человек
  rationale: Прямое и естественное количественное обозначение; в данном военном контексте речь идёт о мужчинах-воинах, но слово «воинов» в стихе прямо не выражено.
- source_word: מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן
  choice: из потомков Неффалима и Завулона
  rationale: «Потомки» ясно передаёт племенную принадлежность выражения בני и звучит естественнее буквального «сыны» в современном русском.
theological_decisions:
- issue: Передача имени יהוה
  choice: Господь
  alternative: Яхве
  rationale: Использована укоренённая русская библейская передача тетраграмматона без введения конфессионально маркированного произношения.
- issue: Статус слов Деворы как Божьего повеления
  choice: 'сохранён риторический вопрос: «Разве не повелел Господь…?»'
  alternative: «Господь… повелел»
  rationale: 'Еврейская вопросительная конструкция важна для тона обращения: Девора напоминает Вараку о повелении и ожидает его признания, а не просто сообщает новое распоряжение.'
- issue: Неоднозначность וּמָשַׁכְתָּ
  choice: «выступи» без явно названного дополнения
  alternative: «собери войско» или «поднимись»
  rationale: 'Так сохраняется смысловая широта глагола: контекст допускает выдвижение к Фавору и стягивание сил, однако объект действия в масоретском тексте не назван.'
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; традиционные формы имён «Варак», «Авиноам», «Неффалим», «Завулон», «Фавор» сохранены. Кавычками разграничены речь Деворы и цитируемое ею повеление.
