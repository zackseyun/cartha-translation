  text: וַ/תִּקַּ֣ח יָעֵ֣ל אֵֽשֶׁת חֶ֠בֶר אֶת יְתַ֨ד הָ/אֹ֜הֶל וַ/תָּ֧שֶׂם אֶת הַ/מַּקֶּ֣בֶת בְּ/יָדָ֗/הּ וַ/תָּב֤וֹא אֵלָי/ו֙ בַּ/לָּ֔אט וַ/תִּתְקַ֤ע אֶת הַ/יָּתֵד֙ בְּ/רַקָּת֔/וֹ וַ/תִּצְנַ֖ח בָּ/אָ֑רֶץ וְ/הֽוּא נִרְדָּ֥ם וַ/יָּ֖עַף וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/021.yaml
  text: Then Jael[a], the wife of Heber, took a tent peg and put a hammer in her hand, and she went to him quietly and drove the peg into his temple, and it went down into the ground. Now he was fast asleep and exhausted[b], and he died.
translation:
  language: ru
  text: Тогда Иаиль, жена Хевера, взяла шатровый колышек, взяла в руку молоток, тихо[a] подошла к нему и вбила колышек ему в висок; колышек вошёл в землю[b]. Он же крепко спал, обессиленный, и умер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «крадучись». Древнееврейское слово подчёркивает тихое, незаметное приближение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «и она погрузилась в землю». Глагол женского рода, вероятнее всего, относится к колышку.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: יְתַד הָאֹהֶל / הַיָּתֵד
  choice: колышек от шатра / колышек
  rationale: Речь идёт о колышке, которым закрепляли шатёр. Такой перевод конкретен, понятен и естественен в современном русском языке.
- source_word: הַמַּקֶּבֶת
  choice: молоток
  rationale: Обозначает ударный инструмент, которым вбивают колышек; «молоток» — наиболее прямой и общеупотребительный русский эквивалент.
- source_word: בַּלָּאט
  choice: тихо
  rationale: Передаёт бесшумный, незаметный характер приближения, не приписывая тексту дополнительно сформулированного мотива.
- source_word: וַתִּתְקַע
  choice: вбила
  rationale: В сочетании с колышком и молотком глагол обозначает силой загнать колышек внутрь; «вбила» естественно передаёт действие по-русски.
- source_word: בְּרַקָּתוֹ
  choice: ему в висок
  rationale: רַקָּה означает висок, боковую часть головы. Формулировка сохраняет точность, не усиливая траекторию до явно выраженного «насквозь».
- source_word: וַתִּצְנַח בָּאָרֶץ
  choice: колышек вошёл в землю
  rationale: Форма глагола женского рода наиболее естественно соотносится с יָתֵד, словом «колышек» в древнееврейском. Явное повторение существительного устраняет неясность русского местоимения и сохраняет последовательность действий.
- source_word: נִרְדָּם וַיָּעַף
  choice: крепко спал, обессиленный
  rationale: Передаёт состояние глубокого сна и крайней усталости Сисары естественным современным русским выражением.
- source_word: וַיָּמֹת
  choice: и умер
  rationale: Сохраняет краткую и резкую завершённость древнееврейского повествования.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством и повествовательной сжатостью оригинала. Повтор «взяла» выбран ради ясного воспроизведения двух последовательных действий; сцена передана прямо, без смягчения насилия и без добавления оценочных или конфессиональных толкований.
