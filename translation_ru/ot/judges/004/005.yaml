  text: וְ֠/הִיא יוֹשֶׁ֨בֶת תַּֽחַת תֹּ֜מֶר דְּבוֹרָ֗ה בֵּ֧ין הָ/רָמָ֛ה וּ/בֵ֥ין בֵּֽית אֵ֖ל בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יַּעֲל֥וּ אֵלֶ֛י/הָ בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
translation:
  language: ru
  text: Она обычно сидела под пальмой Деворы, между Рамой и Вефилем, в нагорье Ефрема, а сыны Израиля[a] поднимались к ней на суд[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или «израильтяне». Буквально: «сыны Израиля» — обычное заветное обозначение народа Израиля.'
    reason: lexical_alternative
  - marker: b
    text: Или «за правосудием» или «за судебным решением». Еврейское слово может обозначать судебное решение либо осуществление правосудия.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֶׁבֶת
  choice: обычно сидела
  rationale: Причастная форма в повествовательном контексте описывает постоянное, привычное место, где Девора вершила суд, а не лишь действие в один конкретный момент.
- source_word: תַּחַת תֹּמֶר דְּבוֹרָה
  choice: под пальмой Деворы
  rationale: Передаёт местонахождение под пальмой, известной по связи с Деворой, без необоснованного превращения обозначения дерева в официальное имя собственное.
- source_word: בֵּין הָרָמָה וּבֵין בֵּית אֵל
  choice: между Рамой и Вефилем
  rationale: Использованы укоренившиеся русские формы библейских топонимов; повтор предлога в еврейском не требуется для естественного русского синтаксиса.
- source_word: בְּהַר אֶפְרָיִם
  choice: в нагорье Ефрема
  rationale: הַר здесь обозначает гористую область, а не одну отдельную гору; «нагорье» кратко и точно передаёт региональный смысл.
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: поднимались к ней
  rationale: Сохраняет значение движения вверх у עלה и согласуется с расположением Деворы в нагорье; несовершенный вид естественно выражает повторяющееся действие.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Формально сохраняет традиционное корпоративное выражение «сыны Израиля», которое в данном контексте обозначает израильский народ, а не только мужчин.
- source_word: לַמִּשְׁפָּט
  choice: на суд
  rationale: В этом контексте מִשְׁפָּט относится к судебному разбирательству, вынесению решения или осуществлению правосудия; краткое русское выражение сохраняет эту смысловую ёмкость.
theological_decisions:
- issue: Корпоративное обозначение בְּנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  alternative: израильтяне / дети Израиля
  rationale: Сохранена формально мужская заветная формула исходного текста. Сноска уточняет её корпоративный охват, не подменяя саму формулировку гендерно нейтральным обозначением.
- issue: Смысл לַמִּשְׁפָּט
  choice: на суд
  alternative: за правосудием / за судебным решением
  rationale: Перевод не ограничивает выражение только вынесением приговора или только абстрактным правосудием и сохраняет широту судебного значения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы «Девора», «Рама», «Вефиль» и «Ефрем» соответствуют устойчивой русской библейской традиции. Маркеры сносок поставлены непосредственно после выражений, к которым относятся.
