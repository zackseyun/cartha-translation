base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
translation:
  language: ru
  text: И Яхве продал их во власть Иавина, царя Ханаана,[a] который царствовал в Хацоре. А военачальником его войска был Сисара, живший в Харошет-Гоиме.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «продал их в руку Иавина» — образное выражение, означающее, что Яхве отдал их под власть Иавина.'
    reason: lexical_alternative
  - marker: b
    text: Название «Харошет-Гоим», вероятно, означает «Харошет народов».
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם
  choice: продал их
  rationale: 'Глагол מָכַר буквально означает «продавать». Здесь это суровая метафора Божьего суда: Израиль отдан угнетателю. Перевод сохраняет метафору, не ослабляя прямое указание на действие Яхве.'
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: בְּיַד
  choice: во власть
  rationale: Буквально «в руку»; в данном обороте речь идёт о передаче под чью-либо власть. Русское «во власть» естественно передаёт смысл, а исходный образ отмечен в сноске.
- source_word: יָבִין מֶלֶךְ כְּנַעַן
  choice: Иавина, царя Ханаана
  rationale: Сохранены традиционные и узнаваемые русские формы личного имени и названия страны, а также приложение «царя Ханаана».
- source_word: אֲשֶׁר מָלַךְ בְּחָצוֹר
  choice: который царствовал в Хацоре
  rationale: מָלַךְ означает «царствовать, быть царём»; «царствовал» точно передаёт смысл и соответствует повествовательному регистру.
- source_word: וְשַׂר צְבָאוֹ
  choice: военачальником его войска был
  rationale: Сочетание שַׂר с צָבָא обозначает командующего войском; «военачальник» — ясный и естественный русский эквивалент.
- source_word: סִיסְרָא
  choice: Сисара
  rationale: Использована закрепившаяся в русской библейской традиции форма имени.
- source_word: וְהוּא יוֹשֵׁב
  choice: живший
  rationale: Причастная конструкция естественно относится к Сисаре и сообщает место его проживания; русский оборот сохраняет эту связь без тяжеловесности.
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  choice: в Харошет-Гоиме
  rationale: Название места передано транслитерацией, без внесения возможного значения второго компонента в основной текст.
theological_decisions:
- issue: Действие Бога в порабощении Израиля
  choice: Яхве прямо назван тем, кто «продал» израильтян во власть Иавина.
  alternative: Яхве лишь допустил, чтобы израильтяне оказались под властью Иавина.
  rationale: Еврейский текст непосредственно приписывает действие Яхве. Перевод не смягчает это утверждение до простого дозволения и сохраняет напряжённый образ суда.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Суровая метафора «продал» сохранена, тогда как идиома «в руку» естественно передана как «во власть» и пояснена в сноске. Имена преимущественно даны в узнаваемых русских библейских формах; «Хацор» передаёт еврейское название точнее традиционного «Асора».
