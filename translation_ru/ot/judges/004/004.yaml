  yaml_path: translation/ot/judges/004/004.yaml
  text: Deborah, a woman, a prophetess, the wife of Lappidoth, was judging Israel at that time.
translation:
  language: ru
  text: Девора, женщина, пророчица, жена Лапидофа, в то время судила Израиль.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה נְבִיאָה
  choice: женщина, пророчица
  rationale: 'Сохранены оба отдельных определения еврейского текста: «женщина» и «пророчица», без слияния, при котором первое могло бы исчезнуть.'
- source_word: אֵשֶׁת לַפִּידוֹת
  choice: жена Лапидофа
  rationale: Наиболее прямое понимание конструкции — указание на мужа Деворы; имя передано в привычной русской библейской форме.
- source_word: שֹׁפְטָה אֶת־יִשְׂרָאֵל
  choice: судила Израиль
  rationale: Форма выражает продолжавшееся в тот период исполнение Деворой обязанностей судьи; русский несовершенный вид это передаёт.
- source_word: בָּעֵת הַהִיא
  choice: в то время
  rationale: Прямое и естественное соответствие временному обороту.
theological_decisions:
- issue: Роль Деворы в Израиле
  choice: судила Израиль
  alternative: была судьёй Израиля
  rationale: Глагольная формулировка источника сохранена и прямо сообщает о её деятельности, не ослабляя и не расширяя её роль.
- issue: Возможное нарицательное понимание לַפִּידוֹת
  choice: Лапидофа как личное имя
  alternative: «жена факелов» / «пламенная женщина»
  rationale: В данной конструкции слово естественнее всего понимать как имя мужа; менее вероятные нарицательные толкования не внесены в основной текст.
translation_notes:
  register: Современный литературный русский язык с намеренно сохранённой цепочкой приложений «женщина, пророчица», отражающей структуру и акцент еврейского текста. Начальный союз וּ не передан отдельным словом, поскольку здесь он связывает повествование, а русский стих естественно начинается без «и» или «теперь».
