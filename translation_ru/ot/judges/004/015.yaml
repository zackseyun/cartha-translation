  text: וַ/יָּ֣הָם יְ֠הוָה אֶת סִֽיסְרָ֨א וְ/אֶת כָּל הָ/רֶ֧כֶב וְ/אֶת כָּל הַֽ/מַּחֲנֶ֛ה לְ/פִי חֶ֖רֶב לִ/פְנֵ֣י בָרָ֑ק וַ/יֵּ֧רֶד סִֽיסְרָ֛א מֵ/עַ֥ל הַ/מֶּרְכָּבָ֖ה וַ/יָּ֥נָס בְּ/רַגְלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/015.yaml
  text: And Yahweh threw Sisera[a], all his chariots, and all his army into confusion before Barak by the sword[c][b]. Then Sisera got down from his chariot and fled on foot.
translation:
  language: ru
  text: И Яхве привёл в смятение Сисару[a], все его колесницы и всё его войско[b] перед Вараком под ударами меча[c]. Тогда Сисара сошёл с колесницы и бежал пешком.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратил в бегство»; еврейский глагол может означать, что противника охватили паника и боевое замешательство.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «весь его стан» или «всё его ополчение»; здесь имеется в виду вся боевая сила Сисары.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «устами (лезвием) меча».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּהָם
  choice: привёл в смятение
  rationale: Глагол המם в военном контексте обозначает наведение паники, замешательства или боевого беспорядка. Этот вариант сохраняет каузативный оттенок и не утверждает, будто Сисара уже был убит или окончательно разбит.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, выраженное тетраграмматоном, а не заменяет его титулом.
- source_word: כָּל הָרֶכֶב
  choice: все его колесницы
  rationale: Речь идёт о колесницах или колесничном войске Сисары; притяжательное местоимение естественно по-русски и ясно обозначает принадлежность, хотя в еврейском тексте стоит определённый артикль.
- source_word: כָּל הַמַּחֲנֶה
  choice: всё его войско
  rationale: מַחֲנֶה буквально может означать лагерь, стан или ополчение, но в данном сражении обозначает всю боевую силу.
- source_word: לְפִי חֶרֶב
  choice: под ударами меча
  rationale: Еврейская идиома буквально говорит об «устах/лезвии меча». Русская формулировка передаёт вооружённое поражение, не создавая ложного впечатления, будто сам Сисара был убит мечом.
- source_word: לִפְנֵי בָרָק
  choice: перед Вараком
  rationale: 'Сохраняет пространственно-военный образ: это произошло перед лицом наступавшего Варака.'
- source_word: וַיֵּרֶד ... מֵעַל הַמֶּרְכָּבָה
  choice: сошёл с колесницы
  rationale: Естественно передаёт оставление колесницы; местоимение не требуется, поскольку принадлежность ясна из контекста.
- source_word: וַיָּנָס בְּרַגְלָיו
  choice: побежал пешком
  rationale: Передаёт бегство без колесницы и подчёркивает контраст с предыдущим действием.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога. Транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Степень поражения Сисары в глаголе וַיָּהָם
  choice: привёл в смятение
  alternative: разгромил
  rationale: Контекст далее сообщает, что Сисара бежал живым; более узкая формулировка «разгромил» могла бы преждевременно снять напряжение между паникой войска и последующим исходом битвы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным звучанием. Синтаксис сделан ясным без устранения военной образности и смысловой напряжённости оригинала; традиционные русские формы библейских имён «Сисара» и «Варак» сохранены.
