  text: וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּ֠י תְּשַׁ֨ע מֵא֤וֹת רֶֽכֶב בַּרְזֶל֙ ל֔/וֹ וְ֠/הוּא לָחַ֞ץ אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל בְּ/חָזְקָ֖ה עֶשְׂרִ֥ים שָׁנָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/003.yaml
  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: ru
  text: Тогда сыны Израиля воззвали к ГОСПОДУ, потому что у него было девятьсот железных колесниц и он жестоко угнетал сынов Израиля двадцать лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ
  choice: воззвали
  rationale: Передаёт настойчивый крик о помощи и уместно в повествовании об обращении к Богу.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: сыны Израиля
  rationale: Сохраняет традиционную и понятную библейскую формулу, обозначающую народ Израиля.
- source_word: יְהוָה
  choice: ГОСПОДУ
  rationale: Передаёт тетраграмматон принятой в русском библейском употреблении заменой, выделенной прописными буквами.
- source_word: רֶכֶב בַּרְזֶל
  choice: железных колесниц
  rationale: Естественная русская передача сочетания; вероятно, речь о колесницах, оснащённых железом, но источник выражается кратко.
- source_word: לָחַץ
  choice: угнетал
  rationale: Глагол обозначает притеснение и подавление, а не только военное давление.
- source_word: בְחָזְקָה
  choice: жестоко
  rationale: В данном контексте наречие характеризует суровость и силу продолжительного угнетения.
theological_decisions:
- issue: К кому относится местоимение «он»
  choice: Сохранено местоимение «он» без замены именем
  alternative: Назвать Иавина или Сисару прямо
  rationale: Еврейский текст употребляет местоимение, а контекст допускает обсуждение его референта; перевод не должен устранять эту неоднозначность.
- issue: Передача имени יהוה
  choice: ГОСПОДЬ
  alternative: Яхве
  rationale: Традиционная русская передача обеспечивает понятность и не вводит конфессионально маркированного произношения; прописные буквы отличают божественное имя от обычного титула.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской окраской. Синтаксис сохранён близким к еврейскому, но фраза звучит естественно; подлинная неоднозначность местоимения не снята.
