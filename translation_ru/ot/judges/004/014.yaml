  text: וַ/תֹּאמֶר֩ דְּבֹרָ֨ה אֶל בָּרָ֜ק ק֗וּם כִּ֣י זֶ֤ה הַ/יּוֹם֙ אֲשֶׁר֩ נָתַ֨ן יְהוָ֤ה אֶת סִֽיסְרָא֙ בְּ/יָדֶ֔/ךָ הֲ/לֹ֥א יְהוָ֖ה יָצָ֣א לְ/פָנֶ֑י/ךָ וַ/יֵּ֤רֶד בָּרָק֙ מֵ/הַ֣ר תָּב֔וֹר וַ/עֲשֶׂ֧רֶת אֲלָפִ֛ים אִ֖ישׁ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/014.yaml
  text: Then Deborah said to Barak[a], “Arise, for this is the day on which Yahweh has given Sisera into your hand. Has not Yahweh gone out before you?” So Barak went down from Mount Tabor[b], with ten thousand men following him.
translation:
  language: ru
  text: 'Тогда Девора сказала Вараку: «Встань, ибо сегодня тот день, когда Яхве отдал Сисару в твои руки[a]. Разве Яхве не вышел перед тобой?» И Варак спустился с горы Фавор, и десять тысяч человек последовали за ним.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отдаёт Сисару в твои руки».'
    reason: Еврейский перфект נָתַן («отдал») в пророческом возвещении может выражать действие как уже обеспеченное; русское настоящее «отдаёт» передаёт это как происходящее объявляемое действие.
lexical_decisions:
- source_word: קוּם
  choice: Встань
  rationale: Повелительная форма призывает Варака немедленно выступить; современное и энергичное русское соответствие.
- source_word: כִּי זֶה הַיּוֹם אֲשֶׁר
  choice: потому что сегодня
  rationale: Естественно передаёт мотивационное כִּי и подчёркнутое указание на наступивший решающий день.
- source_word: נָתַן ... בְּיָדֶךָ
  choice: отдаёт ... в твои руки
  rationale: Сохраняет образ еврейской идиомы передачи противника под чью-либо власть; настоящее время по-русски естественно выражает объявляемое Богом, уже обеспеченное действие.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: הֲלֹא
  choice: Разве не
  rationale: Сохраняет риторический вопрос, предполагающий утвердительный ответ.
- source_word: יָצָא לְפָנֶיךָ
  choice: выступил впереди тебя
  rationale: Глагол «выступил» передаёт движение и допустимый военный оттенок, а «впереди тебя» сохраняет пространственный образ.
- source_word: וַיֵּרֶד
  choice: спустился
  rationale: Естественное русское обозначение движения вниз с горы.
- source_word: מֵהַר תָּבוֹר
  choice: с горы Фавор
  rationale: Употреблена традиционная русская форма библейского географического названия.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אִישׁ אַחֲרָיו
  choice: а за ним — десять тысяч воинов
  rationale: Передаёт следование войска за Вараком; «воинов» уточняет контекстуальное значение אִישׁ и звучит естественно.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте непосредственно стоит личное имя Бога; транслитерация сохраняет это различие.
- issue: Временной оттенок נָתַן в объявлении победы
  choice: отдаёт
  alternative: отдал
  rationale: Еврейский перфект может представлять победу как уже обеспеченную; русское настоящее в контексте «сегодня» сохраняет непосредственность объявления, не исключая пророческой уверенности.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис сделан ясным и устным по звучанию; сохранены риторический вопрос, образ «в руки» и личное имя Яхве.
