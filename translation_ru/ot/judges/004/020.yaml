base_translation:
  language: en
  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
translation:
  language: ru
  text: 'И он сказал ей: «Встань у входа в шатёр. Если кто-нибудь[a] придёт и спросит тебя: „Есть ли здесь мужчина?“ — скажи: „Нет“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте слово אִישׁ («мужчина», также «человек») употреблено дважды: буквально «если придёт мужчина… Есть ли здесь мужчина?» В основном тексте первое употребление передано естественным для русского языка словом «кто-нибудь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמֹד
  choice: Встань
  rationale: Повелительная форма глагола עמד требует занять или сохранять положение; «встань» естественно передаёт прямое приказание в данном контексте.
- source_word: פֶּתַח הָאֹהֶל
  choice: у входа в шатёр
  rationale: פֶּתַח обозначает вход или проём; предлог «у» естественно выражает требуемое положение возле входа, а «шатёр» соответствует повествовательному регистру.
- source_word: וְהָיָה אִם
  choice: если
  rationale: Оборот вводит условную ситуацию; буквальное «и будет, если» в современном русском излишне тяжеловесно.
- source_word: אִישׁ
  choice: кто-нибудь / мужчина
  rationale: Первое употребление в условии естественно передано неопределённым «кто-нибудь», а в прямом вопросе сохранено конкретное «мужчина»; повтор исходного слова отмечен в сноске.
- source_word: יָבוֹא
  choice: придёт
  rationale: Обычное значение בוא — «приходить»; здесь речь о приходе к шатру.
- source_word: וּשְׁאֵלֵךְ
  choice: спросит тебя
  rationale: שׁאל в данном контексте означает задать вопрос; это прямой и современный русский эквивалент.
- source_word: הֲיֵשׁ פֹּה אִישׁ
  choice: Есть ли здесь мужчина?
  rationale: Сочетание вопросительной частицы с יֵשׁ спрашивает о наличии, פֹּה означает «здесь», а אִישׁ передано как «мужчина».
- source_word: אָיִן
  choice: Нет
  rationale: Краткий отрицательный ответ в еврейском тексте лучше всего сохраняется столь же кратким русским «нет».
