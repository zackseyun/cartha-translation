source:
  edition: WLC
  text: כֵּ֠ן יֹאבְד֤וּ כָל אוֹיְבֶ֨י/ךָ֙ יְהוָ֔ה וְ/אֹ֣הֲבָ֔י/ו כְּ/צֵ֥את הַ/שֶּׁ֖מֶשׁ בִּ/גְבֻרָת֑/וֹ וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
translation:
  language: ru
  text: Так да погибнут все твои враги, Яхве, а любящие его да будут подобны солнцу, восходящему во всей своей силе.[a] И покоилась земля сорок лет.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как выход солнца в его силе».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «земля была тиха»; в Книге Судей это устойчивое выражение обозначает период мира и покоя после войны.'
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן יֹאבְדוּ
  choice: Так да погибнут
  rationale: כֵּן подводит итог предшествующей песне, а форма יֹאבְדוּ имеет здесь пожелательно-побудительную силу. Конструкция «так да погибнут» естественно и торжественно передаёт обе черты.
- source_word: כָל אוֹיְבֶיךָ
  choice: все твои враги
  rationale: Прямо передаёт сочетание с местоименным суффиксом второго лица и сохраняет обращение к Богу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона как личного имени, а не замена его титулом.
- source_word: וְאֹהֲבָיו
  choice: а любящие его
  rationale: Союз передан противительным «а», поскольку эта группа противопоставлена врагам. Местоимение третьего лица сохраняет переход древнееврейского текста от прямого обращения к упоминанию Яхве в третьем лице.
- source_word: כְּצֵאת הַשֶּׁמֶשׁ
  choice: подобны солнцу, восходящему
  rationale: יצא применительно к солнцу означает его появление, то есть восход; причастная конструкция звучит естественно по-русски и сохраняет образ сравнения.
- source_word: בִּגְבֻרָתוֹ
  choice: во всей своей силе
  rationale: Передаёт мощь и полноту сияния восходящего солнца, не устраняя образную многозначность слова גְּבוּרָה.
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: И покоилась земля
  rationale: В Книге Судей это формула прекращения войны и наступления мирного покоя; «покоилась» сохраняет как буквальный образ тишины, так и контекстуальный смысл мира.
- source_word: אַרְבָּעִים שָׁנָה
  choice: сорок лет
  rationale: Обычная русская передача обозначения продолжительности.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя и не заменяет титулом.
- issue: Смена лица в וְאֹהֲבָיו
  choice: «твои враги» / «любящие его»
  alternative: Сгладить как «любящие тебя»
  rationale: Суффикс третьего лица в וְאֹהֲבָיו естественно относится к Яхве. Сохранение смены со второго лица на третье отражает грамматику и риторическое напряжение исходного текста.
- issue: Пожелательный смысл второй части сравнения
  choice: «да будут подобны»
  alternative: «подобны»; «будут подобны»
  rationale: Хотя во второй части глагол-связка не выражен, параллелизм с пожеланием «да погибнут» поддерживает пожелательное прочтение; слово «да» ясно передаёт его по-русски.
translation_notes:
  register: Современный литературный русский язык с торжественным поэтическим оттенком, уместным для заключения песни. Архаизмы сведены к выразительной пожелательной конструкции «да погибнут / да будут». Местоимения, относящиеся к Богу, написаны со строчной буквы по общим нормам современного текста; смена «твои» на «его» намеренно сохранена.
