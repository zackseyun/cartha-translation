  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
translation:
  language: ru
  text: Пробудись, пробудись, Девора! Пробудись, пробудись, возгласи песнь! Встань, Варак, и уведи пленников своих[a], сын Авиноама!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «плени свой плен»; еврейское однокоренное выражение означает взять врагов в плен и увести их как пленников.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: Пробудись
  rationale: Женская форма повелительного наклонения повторена четырежды. «Пробудись» передаёт настойчивый поэтический призыв, не смешивая его со следующим обращённым к Вараку повелением «встань».
- source_word: דְּבוֹרָה
  choice: Девора
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: דַּבְּרִי שִׁיר
  choice: возгласи песнь
  rationale: Глагол דבר буквально означает «говорить, произносить», а не обычное «петь». «Возгласи песнь» естественно звучит в русском поэтическом контексте и сохраняет особенность исходного выражения.
- source_word: קוּם
  choice: Встань
  rationale: Мужская форма повелительного наклонения, обращённая к Вараку; краткое «встань» сохраняет прямоту и воинственный импульс призыва.
- source_word: בָּרָק
  choice: Варак
  rationale: Традиционная русская библейская форма имени.
- source_word: וּשֲׁבֵה שֶׁבְיְךָ
  choice: и уведи пленников своих
  rationale: Однокоренное еврейское сочетание буквально выражает взятие или отведение собственного плена. Русская формулировка ясно передаёт победное взятие врагов в плен, а буквальная словесная игра отмечена в сноске.
- source_word: בֶּן אֲבִינֹעַם
  choice: сын Авиноама
  rationale: Сохранена обычная библейская формула указания на отца; имя передано в традиционной русской форме.
