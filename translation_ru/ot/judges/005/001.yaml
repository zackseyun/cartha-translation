  language: ru
  text: 'В тот день Девора и Варак, сын Авиноама, запели[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В еврейском тексте глагол стоит в единственном числе: буквально «и запела Девора», после чего добавлено «и Варак». По смыслу в данном контексте Девора и Варак поют вместе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשַׁר
  choice: запели
  rationale: Глагол שׁיר означает «петь». В еврейском тексте глагол стоит в единственном числе женского рода и согласуется с первой названной участницей — Деворой, после чего присоединяется Варак. В естественном русском языке при составном подлежащем употреблено множественное число. Совершенный вид «запели» естественно вводит начинающуюся далее песнь, не добавляя существительного «песнь», которого в стихе нет.
- source_word: דְּבוֹרָה
  choice: Девора
  rationale: Традиционная и узнаваемая русская передача личного имени.
- source_word: וּבָרָק
  choice: и Варак
  rationale: Переданы соединительный союз и традиционная русская форма личного имени.
- source_word: בֶּן אֲבִינֹעַם
  choice: сын Авиноама
  rationale: Еврейская патронимическая конструкция естественно передаётся приложением без артикля, которого в русском языке нет.
- source_word: בַּיּוֹם הַהוּא
  choice: В тот день
  rationale: Точно передаёт временное обстоятельство со значением конкретного дня и естественно звучит в русском повествовании.
- source_word: לֵאמֹר
  choice: двоеточие после «запели»
  rationale: Инфинитив לֵאמֹר служит формулой введения последующей прямой речи или песни. По-русски его функция здесь естественно и без тяжеловесного «говоря» передаётся двоеточием.
