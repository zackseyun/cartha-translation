base_translation:
  language: en
  yaml_path: translation/ot/judges/005/015.yaml
  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
translation:
  language: ru
  text: 'И вожди Иссахара были с Деворой[a],

    и Иссахар также был с Вараком;

    в долину он был послан следом за Вараком[b].


    Среди подразделений Рувима

    были великие размышления сердца[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «князья Иссахара», «предводители Иссахара». Еврейское выражение поэтично и может пониматься идиоматически, а не как буквальное «мои вожди».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «у его ног», то есть следуя непосредственно за Вараком.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «великие решения сердца», «глубокие размышления сердца». Еврейское выражение трудно для однозначного понимания; по контексту речь, вероятно, идёт о внутренних колебаниях Рувима, не перешедших в действие.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי בְּיִשָּׂשכָר
  choice: вожди Иссахара
  rationale: Поэтическая форма с суффиксом буквально допускает «мои князья», однако в контексте естественнее понимать её идиоматически как обозначение предводителей колена. «Вожди» сохраняет возвышенный регистр без излишне монархического оттенка слова «князья».
- source_word: וְיִשָּׂשכָר כֵּן בָּרָק
  choice: и Иссахар — вместе с Вараком
  rationale: Еврейская строка эллиптична; перевод передаёт соответствие и совместное выступление Иссахара с Вараком, не перегружая русский текст восстановленной связкой.
- source_word: בָּעֵמֶק שֻׁלַּח
  choice: в долину он был послан
  rationale: Предлог и военный контекст указывают на движение в долину. Единственное число сохранено вслед за еврейской формой глагола и относится к Иссахару как к собирательному обозначению колена.
- source_word: בְּרַגְלָיו
  choice: вслед за ним
  rationale: Буквально «у его ног»; здесь это идиома близкого следования за Вараком. В основном тексте дан естественный русский смысл, а буквальный образ отмечен в сноске.
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  choice: среди подразделений Рувима
  rationale: פְלַגּוֹת обозначает части или внутренние группировки. «Подразделения» сохраняет идею разделённости колена, хотя возможны «роды» или «отряды».
- source_word: גְּדֹלִים חִקְקֵי לֵב
  choice: великие раздумья сердца
  rationale: Трудное поэтическое выражение может указывать на решения, намерения или внутренние deliberations. «Раздумья сердца» соответствует контексту колебаний Рувима и сохраняет образ сердца как средоточия решения.
