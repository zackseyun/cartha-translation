  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
translation:
  language: ru
  text: Благословенна среди женщин Иаиль[a], жена Хевера, кенеянина; среди женщин в шатре[b] благословенна она.
