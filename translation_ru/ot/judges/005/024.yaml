  footnotes:
  - marker: a
    text: 'Возможно также: «Благословеннее женщин Иаиль… благословеннее женщин в шатре». Еврейская сравнительная конструкция допускает передачу как «среди», так и «более, чем».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в шатре». Возможно, имеются в виду женщины, живущие в шатрах, однако в еврейском тексте слово «шатёр» стоит в единственном числе.'
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ / תְּבֹרָךְ
  choice: благословенна
  rationale: Форма пуаля, 3-е лицо женского рода единственного числа, представляет Иаиль как благословенную и прославляемую. Повтор глагола сохранён ради поэтического обрамления и усиления.
- source_word: מִנָּשִׁים
  choice: среди женщин
  rationale: Предлог מִן здесь выражает сравнение и допускает понимание «среди женщин» либо «более других женщин». Основной текст использует естественную русскую сравнительно-превосходную формулу, а иной оттенок отмечен в сноске.
- source_word: יָעֵל
  choice: Иаиль
  rationale: Передача личного имени по устойчивой русской библейской традиции.
- source_word: אֵשֶׁת חֶבֶר הַקֵּינִי
  choice: жена Хевера-кенея
  rationale: Сохранены брачное отношение и этническая принадлежность; форма «кенея» естественна в приложении и соответствует современному литературному русскому.
- source_word: בָּאֹהֶל
  choice: в шатре
  rationale: Буквально стоит единственное число «в шатре». Перевод не раскрывает возможный собирательный культурный смысл непосредственно в тексте.
