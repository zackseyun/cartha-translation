  source_fidelity: Основной перевод обоснованно сохраняет повтор יְרַד («сошёл») и передаёт спорные предлоги враждебно, не выдавая это прочтение за бесспорное благодаря сноске. Однако «ради меня» несколько сильнее, чем нейтральное לִי; «для меня» точнее сохраняет широкий, неуточнённый характер связи. Сноску также следует сформулировать так, чтобы она ясно относила синтаксическую трудность к обоим полустишиям.
  naturalness: «Тогда остаток сошёл против вельмож; народ Яхве сошёл для меня против могучих» — допустимый современный литературный русский с намеренно сжатым поэтическим строем. Повтор «сошёл» уместно сохраняет параллелизм оригинала.
  terminology: «Яхве» верно передаёт יהוה. «Вельможи» и «могучие» удачно различают אַדִּירִים и גִּבּוֹרִים, не сужая последнее исключительно до воинов. «Девора» — нормативная русская форма имени Deborah.
