  text: אָ֚ז יְרַ֣ד שָׂרִ֔יד לְ/אַדִּירִ֖ים עָ֑ם יְהוָ֕ה יְרַד לִ֖/י בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
translation:
  language: ru
  text: Тогда остаток сошёл против вельмож[a]; народ Яхве сошёл для меня[b] против могучих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тогда уцелевший сошёл к вельможам». Еврейская поэтическая строка трудна для понимания: предлоги в обоих полустишиях могут иметь невраждебный смысл — «к» или «для» в первом и «среди» либо «вместе с» во втором.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «мне»; вероятно, это поэтическое указание Деворы на себя.'
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Кратко и естественно передаёт временное наречие, вводящее следующий эпизод песни.
- source_word: יְרַד / יְרַד
  choice: сошёл / сошёл
  rationale: Сохраняет буквальное значение глагола ירד и его поэтический повтор в двух частях строки.
- source_word: שָׂרִיד
  choice: остаток
  rationale: Существительное в единственном числе может обозначать уцелевшего либо собирательно тех, кто уцелел; «остаток» сохраняет собирательную возможность.
- source_word: לְאַדִּירִים
  choice: против вельмож
  rationale: אַדִּירִים обозначает знатных или могущественных людей; «вельможи» отличает их от גִּבּוֹרִים. Предлог ל передан как враждебный ввиду военного контекста, но неоднозначность отмечена в сноске.
- source_word: עָם יְהוָה
  choice: народ Яхве
  rationale: Естественно передаёт принадлежность народа Яхве и сохраняет заветное звучание выражения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: לִי
  choice: ради меня
  rationale: Передаёт местоименный суффикс первого лица и вероятную поэтическую реплику Деворы; точная роль говорящей пояснена в сноске.
- source_word: בַּגִּבּוֹרִים
  choice: против могучих
  rationale: Сохраняет широкое значение גִּבּוֹרִים — могучие люди, воины. Предлог понят в противительном смысле по военному контексту, при этом иные возможности отмечены в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога; транслитерация «Яхве» сохраняет его как имя.
- issue: Значение предлогов в обеих половинах поэтической строки
  choice: 'Враждебное значение: «против вельмож» и «против могучих»'
  alternative: 'Невраждебное значение: «к вельможам», «среди/вместе с могучими»'
  rationale: Военный контекст песни и параллелизм допускают враждебное прочтение, однако синтаксис труден и не позволяет считать его бесспорным; альтернативы сохранены в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом, подходящим для древней победной песни. Повтор «сошёл» сохранён ради параллелизма; синтаксическая неоднозначность не скрыта.
