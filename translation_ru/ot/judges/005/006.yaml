base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
translation:
  language: ru
  text: Во дни Шамгара, сына Анафа, во дни Иаили главные дороги опустели[a], и путники ходили извилистыми путями[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дороги прекратились»; то есть обычное движение по основным путям прекратилось.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «кривыми» или «извилистыми путями». Возможно, речь идет об обходных маршрутах, избираемых ради безопасности, а не о нравственной «кривизне».'
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  choice: во дни
  rationale: Устойчивое русское соответствие древнееврейскому временному обороту; сохраняет поэтический, но понятный современному читателю регистр.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Шамгар, сын Анафа
  rationale: Имя передано транслитерацией, а בֶּן — естественным русским сочетанием «сын»; форма «Анафа» следует укоренившейся русской библейской передаче имени.
- source_word: יָעֵל
  choice: Иаиль
  rationale: Использована традиционная и узнаваемая русская библейская форма имени.
- source_word: חָדְלוּ
  choice: опустели
  rationale: Буквально глагол означает «перестали, прекратились»; при подлежащем «дороги» речь идет о прекращении обычного движения по ним. «Опустели» естественно передает результат, не добавляя причины.
- source_word: אֳרָחוֹת
  choice: главные дороги
  rationale: Существительное обозначает дороги или проторенные пути. Определение «главные» проясняет противопоставление обычных маршрутов обходным тропам, подразумеваемое контекстом.
- source_word: הֹלְכֵי נְתִיבוֹת
  choice: путники
  rationale: Буквально «ходящие путями/тропами»; «путники» кратко и естественно обозначает людей, находящихся в дороге.
- source_word: יֵלְכוּ
  choice: ходили
  rationale: Имперфект в контексте песни описывает обычное повторявшееся действие в прошлом.
- source_word: אֳרָחוֹת עֲקַלְקַלּוֹת
  choice: окольными тропами
  rationale: Прилагательное означает извилистые, кривые пути. «Окольными» передает вынужденную непрямоту маршрута без нравственного оттенка, а «тропами» сохраняет контраст с главными дорогами.
