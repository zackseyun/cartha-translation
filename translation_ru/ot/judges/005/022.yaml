  text: אָ֥ז הָלְמ֖וּ עִקְּבֵי ס֑וּס מִֽ/דַּהֲר֖וֹת דַּהֲר֥וֹת אַבִּירָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/022.yaml
  text: Then the horses’ hoofs pounded from the galloping[a], the galloping of his mighty steeds.
translation:
  language: ru
  text: Тогда застучали копыта коней от стремительного бега, от стремительного бега его могучих.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от стремительного бега, от стремительного бега его могучих жеребцов»; или: «от стремительного бега, от стремительного бега его могучих воинов». Еврейское выражение может относиться к сильным коням либо к связанным с ними воинам.'
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Временное наречие вводит следующий яркий эпизод песни и сохраняет её поэтическую последовательность.
- source_word: הָלְמוּ
  choice: застучали
  rationale: Глагол передаёт сильные повторяющиеся удары; в сочетании с копытами «застучали» естественно выражает и звук, и стремительность движения.
- source_word: עִקְּבֵי סוּס
  choice: копыта коней
  rationale: Хотя עִקְּבֵי буквально связано с пятками или задней частью стопы, применительно к коням речь идёт о копытах; единственное סוּס имеет собирательное значение.
- source_word: מִדַּהֲרוֹת דַּהֲרוֹת
  choice: от скачки, от скачки
  rationale: Предлог מִן передаёт причину или источник ударов, а повтор существительного сохранён как поэтическое усиление.
- source_word: אַבִּירָיו
  choice: его могучих
  rationale: Субстантивированное прилагательное означает «его могучие/сильные» и может указывать как на могучих коней, так и на связанных с ними воинов; эллиптическая русская формулировка сохраняет эту неоднозначность.
theological_decisions:
- issue: К кому относятся אַבִּירָיו и местоименный суффикс 3-го лица единственного числа
  choice: его могучих
  alternative: его могучих коней / его могучих воинов
  rationale: Контекст вызывает образ коней и всадников вражеского войска, однако еврейское выражение не требует однозначно выбрать одну группу. Перевод сохраняет неопределённость референта и не уточняет, к кому относится «его».
translation_notes:
  register: Современный литературный русский с песенной энергией и явным повтором оригинала. «Застучали» звучит естественнее буквального «ударяли», а эллипсис «его могучих» намеренно сохраняет смысловую открытость еврейского текста.
