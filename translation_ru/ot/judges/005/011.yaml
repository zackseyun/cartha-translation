base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
translation:
  language: ru
  text: 'При звуках лучников среди водопоев[a]

    там возвещают праведные дела Яхве,

    праведные дела его сельских жителей в Израиле[b].

    Тогда народ Яхве сошёл к городским воротам[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало строки в еврейском тексте трудно для понимания. Возможны также переводы: «от звуков лучников среди водопоев» или «вдали от звуков лучников у водопоев»; само слово, переданное как «лучники», толкуют и иначе.'
    reason: alternative_reading
  - marker: b
    text: 'Еврейское слово, переданное выражением «сельские жители», имеет неясное значение. Возможны варианты: «жители деревень», «неукреплённые селения» или, менее вероятно, «правители». Не вполне ясно и то, о чьих праведных делах говорится: совершённых сельскими жителями или совершённых ради них.'
    reason: lexical_alternative
  - marker: c
    text: Городские ворота в древнем Израиле служили местом общественных собраний и суда и были связаны с безопасностью города.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַצְצִים
  choice: Под звуки лучников
  rationale: Поэтическое выражение допускает несколько синтаксических и лексических толкований. «Под звуки» естественно передаёт связь происходящего со слышимым звуком, не вводя сомнительного значения «вдали от»; причастие מְחַצְצִים по контексту передано как «лучники», а трудность отмечена в сноске.
- source_word: בֵּין מַשְׁאַבִּים
  choice: среди водопоев
  rationale: מַשְׁאַבִּים обозначает места, где черпают воду, вероятно колодцы или водопои; «среди водопоев» естественно передаёт בֵּין при множестве мест.
- source_word: יְתַנּוּ
  choice: возвещают
  rationale: Форма глагола здесь означает вслух повторять, перечислять или рассказывать. «Возвещают» соответствует торжественному поэтическому контексту, не утверждая определённо, что речь именно о пении.
- source_word: צִדְקוֹת יְהוָה
  choice: праведные дела Яхве
  rationale: Множественное צִדְקוֹת указывает здесь на конкретные деяния, в которых проявилась праведность Бога, а не только на отвлечённое качество.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя יהוה передано транслитерацией «Яхве», а не заменено титулом.
- source_word: צִדְקֹת פִּרְזֹנוֹ
  choice: праведные дела его сельского народа
  rationale: Редкое и спорное פִּרְזוֹן связано с сельской жизнью, жителями деревень или неукреплёнными поселениями. Формулировка сохраняет притяжательную конструкцию и не заменяет её более узким толкованием.
- source_word: אָז יָרְדוּ לַשְּׁעָרִים
  choice: Тогда … сошёл к городским воротам
  rationale: Переданы временная связь אָז и обычное значение ירד «сойти». Добавление «городским» ясно выражает подразумеваемый общественный центр поселения, не меняя образа ворот.
- source_word: עַם יְהוָה
  choice: народ Яхве
  rationale: Сохраняется заветное обозначение Израиля как народа, принадлежащего Яхве.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит личное имя Бога. «Яхве» сохраняет его как имя и не подменяет титулом.
- issue: Значение צִדְקוֹת в победной песне
  choice: праведные дела
  alternative: спасительные деяния; победы
  rationale: Так сохраняется лексическая связь с праведностью и одновременно ясно, что имеются в виду конкретные поступки; спасительный и победный характер определяется контекстом.
- issue: Отношение צִדְקֹת к פִּרְזֹנוֹ
  choice: праведные дела его сельского народа
  alternative: праведные дела для его сельского народа; праведные дела в его неукреплённых селениях
  rationale: Еврейская конструкция и значение редкого существительного спорны. Основной текст сохраняет родительную связь, а сноска сообщает главные лексические варианты, не разрешая неоднозначность догматически.
translation_notes:
  register: Современный литературный русский язык с торжественным ритмом древнееврейской победной песни. Строки разделены по поэтическим смысловым единицам. Слова «водопои», «возвещают» и «сошёл» понятны современному читателю, но сохраняют достоинство и образность текста; спорные места не сглажены и пояснены в сносках.
