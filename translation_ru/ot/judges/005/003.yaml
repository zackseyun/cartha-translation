base_translation:
  language: en
  yaml_path: translation/ot/judges/005/003.yaml
  text: Hear[a], O kings; give ear, O rulers. I, to Yahweh[b], I will sing; I will make music to Yahweh, the God of Israel.
translation:
  language: ru
  text: Слушайте, цари; внимайте, правители![a] Я буду петь Яхве, я буду воспевать Яхве, Бога Израиля.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте «слушайте» и «внимайте» — два близких по смыслу повеления, образующих поэтический параллелизм и усиливающих призыв.
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте местоимение «я» повторено для усиления; имя Яхве стоит между двумя его употреблениями. Также употреблены два родственных, но не тождественных глагола: «петь» и «музыкально воспевать».'
    reason: source_structure
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: слушайте
  rationale: Повелительная форма множественного числа от שׁמע; «слушайте» естественно передаёт торжественный призыв обратить внимание.
- source_word: מְלָכִים
  choice: цари
  rationale: Прямое соответствие названию царей как политических властителей.
- source_word: הַאֲזִינוּ
  choice: внимайте
  rationale: Более выразительный глагол, близкий по значению к שׁמע; сохраняет поэтический параллелизм, не сводя оба повеления к одному слову.
- source_word: רֹזְנִים
  choice: правители
  rationale: Слово обозначает высокопоставленных властителей или сановников; «правители» ясно и без излишней архаики передаёт политический смысл.
- source_word: אָנֹכִי ... אָנֹכִי
  choice: Я — я
  rationale: Повтор независимого местоимения выражает сильное личное подчёркивание; необычная, но понятная конструкция сохраняет поэтический акцент.
- source_word: לַיהוָה
  choice: Яхве
  rationale: 'При глаголах пения предлог ל указывает на адресата или посвящение: песня обращена к Яхве.'
- source_word: יהוה
  choice: Яхве
  rationale: Передано личное заветное имя, прямо стоящее в еврейском тексте, а не заменено титулом «Господь».
- source_word: אָשִׁירָה
  choice: буду петь
  rationale: Форма имеет волевую окраску; будущее время по-русски естественно выражает решимость певицы.
- source_word: אֲזַמֵּר
  choice: буду воспевать
  rationale: Глагол связан с музыкальным прославлением. «Воспевать» сохраняет отличие от אָשִׁירָה и подходит торжественной поэзии, не навязывая упоминания инструмента.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Прозрачно передаёт конструкцию, отождествляющую Яхве с Богом Израиля.
theological_decisions:
- issue: Передача божественного имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте дважды употреблено личное имя יהוה. Транслитерация сохраняет его как имя и не подменяет титулом.
- issue: Адресат и характер пения
  choice: петь Яхве; воспевать Яхве
  alternative: петь хвалу Господу
  rationale: Так сохраняются и направленность действия, выраженная ל, и различие двух родственных глаголов; при этом текст не уточняет сверх необходимого способ музыкального исполнения.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим звучанием. «Внимайте» и «воспевать» слегка возвышенны, но понятны современному читателю и помогают сохранить параллелизм. Пунктуация в «Я — я» передаёт эмфатический повтор, избегая двусмысленного русского сочетания «Я — Яхве», которое могло бы ошибочно прозвучать как самоотождествление говорящей с Яхве.
