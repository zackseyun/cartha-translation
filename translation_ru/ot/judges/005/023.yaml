  text: א֣וֹרוּ מֵר֗וֹז אָמַר֙ מַלְאַ֣ךְ יְהוָ֔ה אֹ֥רוּ אָר֖וֹר יֹשְׁבֶ֑י/הָ כִּ֤י לֹֽא בָ֨אוּ֙ לְ/עֶזְרַ֣ת יְהוָ֔ה לְ/עֶזְרַ֥ת יְהוָ֖ה בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/023.yaml
  text: Curse Meroz[a], said the angel of Yahweh; curse, utterly curse its inhabitants, because they did not come to the help of Yahweh[b], to the help of Yahweh against the mighty.
translation:
  language: ru
  text: «Прокляните Мероз, — сказал ангел Яхве[a], — прокляните, предайте проклятию его жителей, потому что они не пришли на помощь Яхве, на помощь Яхве против могучих воинов».[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посланник Яхве».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на помощь Яхве… среди могучих». Последнее выражение можно также понять как «против могучих» или «вместе с могучими воинами».'
    reason: alternative_reading
lexical_decisions:
- source_word: א֣וֹרוּ / אֹ֥רוּ אָר֖וֹר
  choice: Прокляните / предайте проклятию
  rationale: Глагол ארר выражает сильное проклятие; сочетание повелительной формы с абсолютным инфинитивом усиливает второе повеление. Русское «предайте проклятию» естественно передаёт усиление без добавления наречия, отсутствующего в тексте.
- source_word: מֵר֗וֹז
  choice: Мероз
  rationale: Собственное имя передано транслитерацией; вероятнее всего, это название местности, но сам стих этого прямо не уточняет.
- source_word: מַלְאַ֣ךְ יְהוָ֔ה
  choice: ангел Яхве
  rationale: מַלְאָךְ допускает значения «ангел» и «посланник». В устойчивом библейском сочетании «ангел Яхве» сохраняет литературное и богословское напряжение, не определяя природу этого лица.
- source_word: יֹשְׁבֶ֑י/הָ
  choice: его жителей
  rationale: Местоименный суффикс женского рода относится к Мерозу как к местности или поселению; в русском согласование по грамматическому роду названия требует «его».
- source_word: כִּ֤י לֹֽא בָ֨אוּ֙
  choice: потому что они не пришли
  rationale: כִּי вводит основание проклятия; причинная связь прямо и естественно выражена союзом «потому что».
- source_word: לְ/עֶזְרַ֣ת יְהוָ֔ה
  choice: на помощь Яхве
  rationale: Сохраняется именная конструкция и её риторическое повторение; формулировка естественна для современного русского языка.
- source_word: בַּ/גִּבּוֹרִֽים
  choice: против сильных
  rationale: Предлог בְּ здесь синтаксически неоднозначен. В военном контексте «против сильных» даёт связный смысл, однако иные отношения — «среди сильных» или «вместе с могучими воинами» — остаются возможными и отмечены в сноске.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Иегова; ГОСПОДЬ
  rationale: Тетраграмматон передан как личное заветное имя «Яхве», а не заменён титулом.
- issue: Значение מַלְאַךְ יְהוָה
  choice: ангел Яхве
  alternative: посланник Яхве
  rationale: Основной текст использует традиционное и естественное «ангел», но не разрешает богословский вопрос о природе этого лица; лексическая альтернатива дана в сноске.
- issue: Роль Яхве в формуле «на помощь Яхве»
  choice: сохранить буквальную риторическую формулу
  alternative: помочь Яхве
  rationale: Именная конструкция и повтор сохранены, чтобы не сглаживать необычное утверждение текста о приходе на помощь Яхве.
translation_notes:
  register: Современный литературный русский с приподнятым поэтическим звучанием, уместным для Песни Деворы. Повтор «на помощь Яхве» сохранён. Маркеры сносок поставлены после всего стиха, поскольку первая сноска поясняет выражение внутри цитаты, а вторая — неоднозначную заключительную фразу.
