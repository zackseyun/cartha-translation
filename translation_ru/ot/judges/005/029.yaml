  text: 'Её мудрейшие знатные женщины отвечают ей; и она сама повторяет себе свои слова:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַכְמוֹת שָׂרוֹתֶיהָ
  choice: мудрейшие из её знатных женщин
  rationale: חַכְמוֹת может быть понято как превосходная характеристика — «мудрейшие», а שָׂרוֹת обозначает высокопоставленных женщин; «знатные женщины» естественно передаёт их положение без неуместного современного титула.
- source_word: תַּעֲנֶינָּה
  choice: отвечают ей
  rationale: Женская форма множественного числа соответствует «знатным женщинам»; местоименный суффикс указывает адресата ответа.
- source_word: אַף הִיא
  choice: да и сама она
  rationale: Сохраняет усилительно-присоединительное значение אַף и подчёркнутое הִיא.
- source_word: תָּשִׁיב אֲמָרֶיהָ לָהּ
  choice: повторяет себе свои слова
  rationale: Буквально оборот допускает «отвечает себе своими словами», однако в контексте внутреннего самоуспокоения естественнее «повторяет себе свои слова»; возвратная направленность לָהּ сохранена.
theological_decisions:
- issue: Характер речи матери Сисары
  choice: повторяет себе свои слова
  alternative: отвечает себе своими словами
  rationale: Текст изображает, как она принимает и воспроизводит утешающий ответ; формулировка не добавляет оценки её слов и сохраняет ироническое напряжение песни.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью. «Знатные женщины» звучит естественнее, чем буквальное «княгини», и не создаёт ложного впечатления о конкретном монархическом титуле.
