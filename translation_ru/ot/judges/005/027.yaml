base_translation:
  language: en
  yaml_path: translation/ot/judges/005/027.yaml
  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
translation:
  language: ru
  text: Между её ног[a] он опустился, упал, лёг; между её ног он опустился, упал; где он опустился, там упал — сокрушённый[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у её ног». Буквально: «между её ног».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «уничтоженный» или «разорённый». Еврейское слово обозначает состояние полного сокрушения или гибели.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין רַגְלֶיהָ
  choice: между ног её
  rationale: Сохраняет конкретный пространственный образ и его повторение. Вариант «у её ног» естественнее по-русски, но менее буквально передаёт בֵּין («между»).
- source_word: כָּרַע
  choice: он осел
  rationale: В сцене гибели глагол обозначает сгибание и опускание тела. «Осел» передаёт невольное обрушение, не подразумевая поклонения или намеренного преклонения колен.
- source_word: נָפַל
  choice: упал / пал
  rationale: Основное значение — «падать». В первых кратких рядах выбрано нейтральное «упал», а в заключительной строке — литературное «пал», естественно сочетающееся со словом «сражённый».
- source_word: שָׁכָב
  choice: лёг
  rationale: Передаёт завершённое действие в цепочке кратких древнееврейских перфектов. «Лежал» могло бы выражать состояние, тогда как форма источника здесь продолжает последовательность событий.
- source_word: בַּאֲשֶׁר ... שָׁם
  choice: где ... там и
  rationale: Кратко и естественно воспроизводит соотносительную пространственную конструкцию; частица «и» усиливает итог без добавления нового содержания.
- source_word: שָׁדוּד
  choice: сражённый
  rationale: В отношении погибшего Сисары передаёт состояние человека, которого сокрушили насильственной смертью. Буквальные для других контекстов варианты «разорённый» или «опустошённый» по-русски здесь неестественны.
