  source_fidelity: 'Повторяющаяся структура и пространственный образ переданы точно, однако «осел» для человека в современном русском разговорно-неопределённо и не вполне передаёт כָּרַע как сгибание/опускание тела. В последней строке «пал» нарушает намеренное дословное повторение נָפַל. «Сражённый» излишне конкретизирует שָׁדוּד как насильственное поражение оружием; исходное слово шире: сокрушённый, уничтоженный, разорённый.'
