  text: Вы, едущие верхом на белых ослицах, вы, сидящие на коврах[a], и вы, идущие по дороге, — говорите![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на попонах» или «на ковриках»; значение редкого еврейского слова неясно.'
