lexical_decisions:
- source_word: רֹכְבֵי אֲתֹנוֹת צְחֹרוֹת
  choice: вы, едущие на белых ослицах
  rationale: Причастная конструкция употреблена как обращение. אֲתֹנוֹת обозначает именно ослиц, что по-русски звучит естественно и сохраняет конкретность еврейского текста; צְחֹרוֹת передано наиболее вероятным значением «белые».
- source_word: יֹשְׁבֵי עַל מִדִּין
  choice: вы, сидящие на коврах
  rationale: יֹשְׁבֵי продолжает ряд обращений. Редкое מִדִּין, вероятно, обозначает дорогие покрытия или подстилки для сидения, однако его точное значение неясно; неопределённость отмечена в сноске.
- source_word: וְהֹלְכֵי עַל דֶּרֶךְ
  choice: и вы, идущие по дороге
  rationale: Сохранены конкретный образ движения и параллельная причастная форма обращения.
- source_word: שִׂיחוּ
  choice: рассказывайте
  rationale: В контексте победной песни императив призывает вслух повествовать о происшедшем. Русское «рассказывайте» передаёт значение recount, не исключая более общего «говорите».
