  text: יָדָ/הּ֙ לַ/יָּתֵ֣ד תִּשְׁלַ֔חְנָה וִֽ/ימִינָ֖/הּ לְ/הַלְמ֣וּת עֲמֵלִ֑ים וְ/הָלְמָ֤ה סִֽיסְרָא֙ מָחֲקָ֣ה רֹאשׁ֔/וֹ וּ/מָחֲצָ֥ה וְ/חָלְפָ֖ה רַקָּתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
translation:
  language: ru
  text: 'Она протянула руку к колышку,

    правую — к молоту работников[a].

    Она ударила Сисару,

    раздробила ему голову,

    размозжила и пронзила висок[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к рабочему молоту»; значение редкого еврейского сочетания допускает несколько близких вариантов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пробила его висок». Последний еврейский глагол буквально может описывать прохождение сквозь него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ ... וִימִינָהּ
  choice: руку ... правую
  rationale: Сохранён поэтический параллелизм «рука / правая рука»; во второй строке естественный для русского языка эллипсис избегает тяжёлого повтора.
- source_word: לַיָּתֵד
  choice: к колышку
  rationale: В контексте рассказа речь идёт о колышке для шатра; краткое «колышок» ясно по контексту и сохраняет поэтическую строку.
- source_word: תִּשְׁלַחְנָה
  choice: протянула
  rationale: Глагол описывает движение вытянутой руки к предмету; «протянула руку» естественно и близко передаёт образ.
- source_word: לְהַלְמוּת עֲמֵלִים
  choice: к молоту работников
  rationale: Редкое сочетание буквально связывает ударное орудие с работниками. Выбрана формально близкая передача, а возможное значение «рабочий молот» отмечено в сноске.
- source_word: וְהָלְמָה
  choice: ударила
  rationale: Передаёт основной смысл сильного удара и сохраняет связь с существительным «молот» без искусственного русского «молотила».
- source_word: מָחֲקָה
  choice: раздробила
  rationale: Сильный глагол означает сокрушение или раздробление; выбор сохраняет нарастание жестоких поэтических образов.
- source_word: וּמָחֲצָה
  choice: размозжила
  rationale: Отдельный энергичный глагол передаёт второй, близкий по смыслу еврейский глагол и не сглаживает их намеренное накопление.
- source_word: וְחָלְפָה
  choice: пронзила
  rationale: В данном контексте глагол выражает прохождение орудия сквозь висок; «пронзила» естественно передаёт это действие, не добавляя отдельного наречия «насквозь».
- source_word: רַקָּתוֹ
  choice: висок
  rationale: В контексте смертельного удара слово обозначает боковую часть головы, то есть висок.
