base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
translation:
  language: ru
  text: «Разве они не находят и не делят добычу? Утроба[a], две утробы на каждого мужчину; Сисаре — добыча из крашеных тканей, добыча из крашеных тканей, вышитая ткань; крашеная ткань, две вышивки для шей добычи[b]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-еврейски: «утроба, две утробы» — жестокое метонимическое обозначение женщин, захваченных как сексуальная добыча.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «для шей пленниц / захваченных как добыча». Последняя фраза по-еврейски трудна и, возможно, говорит о вышитых тканях, которые наденут на пленённых женщин.'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יִמְצְאוּ יְחַלְּקוּ שָׁלָל
  choice: Разве они не находят и не делят добычу?
  rationale: Настоящее время передаёт живое ожидание матери Сисары; два координированных глагола и военный термин «добыча» сохранены.
- source_word: רַחַם רַחֲמָתַיִם
  choice: По утробе, по две утробы
  rationale: Буквальное значение и двойственное число сохранены, чтобы не смягчать намеренно жестокую и обезличивающую метонимию пленённых женщин.
- source_word: לְרֹאשׁ גֶּבֶר
  choice: на каждого мужчину
  rationale: Еврейское «на голову мужчины» имеет распределительное значение; естественная русская формулировка сохраняет указание на мужской пол.
- source_word: צְבָעִים
  choice: крашеные ткани
  rationale: Передаёт окрашенные текстильные изделия как часть военной добычи, не уточняя без достаточных оснований, были ли это готовые одежды.
- source_word: רִקְמָה / רִקְמָתַיִם
  choice: вышитая ткань / по две вышивки
  rationale: Сохранены текстильный образ, повтор и двойственное число в сжатой поэтической последовательности.
- source_word: לְצַוְּארֵי שָׁלָל
  choice: на шеи добычи
  rationale: Близкий к форме оригинала перевод сохраняет трудность и неоднозначность заключительной фразы; возможная интерпретация вынесена в примечание.
theological_decisions:
- issue: Следует ли смягчать сексуализированную лексику военной добычи רַחַם רַחֲמָתַיִם
  choice: Сохранить буквальную метонимию «утроба, две утробы»
  alternative: «девушка, две девушки» или «женщина-другая каждому мужчине»
  rationale: Это жестокое ожидание окружения Сисары, а не одобрение повествователя. Буквальная передача сохраняет нравственный ужас и обезличивающую силу речи.
- issue: Толкование трудной фразы לְצַוְּארֵי שָׁלָל
  choice: Оставить близкую передачу «на шеи добычи» и пояснить неоднозначность в примечании
  alternative: «на шеи пленниц» или «для шей захваченных в плен»
  rationale: Синтаксис оригинала сжат и спорен, поэтому основной текст не должен выдавать одну интерпретацию за несомненную.
translation_notes:
  register: Современный литературный русский с достоинством песенной речи. Синтаксическая сжатость и повтор перечня добычи сохранены; архаизмы избегаются. Резкая метонимия оригинала намеренно не смягчена.
