  text: מִן שָׁמַ֖יִם נִלְחָ֑מוּ הַ/כּֽוֹכָבִים֙ מִ/מְּסִלּוֹתָ֔/ם נִלְחֲמ֖וּ עִם סִיסְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/020.yaml
  text: From heaven the stars fought[b][a]; from their courses they fought against Sisera.
translation:
  language: ru
  text: С небес сражались звёзды; со своих путей[a] они сражались против Сисары[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «со своих дорог» или «со своих небесных стезей». Еврейское слово может обозначать дороги и пути; здесь, вероятно, имеются в виду установленные пути звёзд по небу.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с Сисарой». В контексте битвы такое выражение означает «против Сисары».'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן שָׁמַיִם
  choice: С небес
  rationale: Форма שָׁמַיִם грамматически множественная; «с небес» естественно звучит в русской возвышенной поэзии и сохраняет образ исходящего свыше действия.
- source_word: נִלְחָמוּ
  choice: сражались
  rationale: Нифаль глагола לחם означает участие в битве. «Сражались» прямо передаёт смысл и позволяет сохранить поэтический повтор.
- source_word: הַכּוֹכָבִים
  choice: звёзды
  rationale: Прямое значение כּוֹכָבִים — «звёзды»; образ сохранён без истолкования как ангелов или природных сил.
- source_word: מִמְּסִלּוֹתָם
  choice: со своих путей
  rationale: מְסִלּוֹת может обозначать дороги, пути или небесные траектории. «Пути» естественно сочетаются со звёздами и сохраняют метафорическую широту слова лучше, чем более современное и узкое «орбиты».
- source_word: עִם סִיסְרָא
  choice: против Сисары
  rationale: Хотя עִם обычно означает «с», при глаголе войны оно обозначает противника; по-русски это ясно передаётся предлогом «против».
theological_decisions:
- issue: Характер участия звёзд в битве
  choice: Сохранить поэтическое утверждение, что звёзды сражались, не объясняя механизм их участия.
  alternative: Истолковать звёзды как буквальные небесные тела, ангельское воинство или образ промыслительно направленных природных сил.
  rationale: Песнь Деворы не уточняет природу этого участия; буквальное сохранение образа не снимает заложенную в тексте богословскую и поэтическую многозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным поэтическим звучанием. Сохранены параллелизм и повтор глагола; образ звёзд не рационализирован.
