base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
translation:
  language: ru
  text: Галаад остался за Иорданом; а Дан — почему он жил у кораблей?[a] Асир сидел у морского берега и оставался у своих гаваней.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почему он пребывал у кораблей?» Еврейский глагол может означать «жить», «пребывать» или «жить как пришелец»; точный характер связи Дана с кораблями не уточняется.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у своих бухт (заливов)». Еврейское слово обозначает углубления или разрывы и в прибрежном контексте, вероятно, относится к бухтам, заливам либо гаваням.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד
  choice: Галаад
  rationale: Сохранено собственное имя; в контексте оно метонимически обозначает жителей или племенную область Галаада, но перевод не раскрывает эту метонимию прямо.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: за Иорданом
  rationale: Естественное русское географическое выражение, передающее положение по другую сторону Иордана относительно точки зрения песни.
- source_word: שָׁכֵן
  choice: остался
  rationale: Передаёт как пребывание, так и подразумеваемое уклонение от участия в сражении, не усиливая упрёк сверх текста.
- source_word: וְדָן
  choice: а Дан
  rationale: Союз «а» естественно вводит следующий риторический упрёк; имя племени сохранено.
- source_word: לָמָּה
  choice: почему
  rationale: Сохранён прямой риторический вопрос.
- source_word: יָגוּר
  choice: жил
  rationale: Глагол גור означает жить или пребывать, нередко как пришелец. Нейтральное «жил» сохраняет основное значение и не вводит отсутствующего в еврейском тексте оттенка намеренного промедления.
- source_word: אֳנִיּוֹת
  choice: при кораблях
  rationale: «Корабли» передаёт множественное число; предлог «при» сохраняет несколько необычную пространственную связь и не уточняет её как службу, торговлю или пребывание на борту.
- source_word: אָשֵׁר
  choice: Асир
  rationale: Использована традиционная русская библейская форма имени колена.
- source_word: יָשַׁב
  choice: сидел
  rationale: Сохранён буквальный и выразительный образ бездействия, уместный в поэтическом упрёке.
- source_word: לְחוֹף יַמִּים
  choice: у морского берега
  rationale: Идиоматичный русский эквивалент прибрежного выражения; множественное число «морей» не акцентируется, поскольку здесь оно естественно обозначает морское побережье.
- source_word: מִפְרָצָיו
  choice: у своих гаваней
  rationale: В прибрежном контексте слово, буквально связанное с разрывами или углублениями берега, вероятно обозначает бухты, заливы либо гавани; «гавани» хорошо передают место стоянки у берега.
- source_word: יִשְׁכּוֹן
  choice: оставался
  rationale: Передаёт продолжительное пребывание и поддерживает мотив неучастия, не повторяя буквально «жил».
