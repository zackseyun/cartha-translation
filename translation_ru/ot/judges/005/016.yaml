base_translation:
  language: en
  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
translation:
  language: ru
  text: Почему ты сидел среди овечьих загонов, чтобы слушать свист, которым созывают стада? В подразделениях Рувима — великие раздумья сердца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «У потоков Рувима — великие раздумья сердца». Еврейское слово может означать «подразделения» или «водные потоки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Почему
  rationale: Прямо передаёт вопрос о причине без лишнего пояснения.
- source_word: יָשַׁבְתָּ
  choice: остался сидеть
  rationale: Сохраняет конкретный образ сидения и одновременно передаёт упрёк в бездействии; форма второго лица единственного числа относится к Рувиму как к собирательному целому.
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  choice: среди овечьих загонов
  rationale: Пастушеский контекст следующей строки поддерживает традиционное понимание как овечьих загонов; «среди» естественно передаёт пространственное значение בֵּין при множественном ориентире.
- source_word: לִשְׁמֹעַ שְׁרִקוֹת עֲדָרִים
  choice: слушая свист, которым сзывают стада
  rationale: Передаёт целевое значение инфинитива и делает понятным пастушеский свист; глагол «сзывают» выражает вероятную функцию звука, не вводя в текст прямо не названных пастухов.
- source_word: לִפְלַגּוֹת רְאוּבֵן
  choice: У родов Рувима
  rationale: פלגות может обозначать части или подразделения племени; «роды» звучит естественно в русском племенном контексте. Возможное значение «потоки» сохранено в сноске.
- source_word: גְּדוֹלִים חִקְרֵי לֵב
  choice: глубокие раздумья сердца
  rationale: «Глубокие» естественно передаёт усилительное גְּדוֹלִים, а «раздумья сердца» сохраняет поэтический образ внутреннего исследования и колебания, не сводя его к одному психологическому состоянию.
