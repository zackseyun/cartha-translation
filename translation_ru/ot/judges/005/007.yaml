  yaml_path: translation/ot/judges/005/007.yaml
  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
translation:
  language: ru
  text: Не стало сельской жизни[a] в Израиле, не стало, пока я, Девора, не встала, пока не встала как мать в Израиле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не стало жителей селений в Израиле»; возможно также: «Не стало сельского населения в Израиле». Значение еврейского существительного не вполне ясно: оно может обозначать жителей неукреплённых селений или сельскую жизнь в целом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ / חָדֵלּוּ
  choice: не стало / не стало
  rationale: Повтор передаёт двукратное חָדְלוּ / חָדֵלּוּ и звучит в современном русском естественнее, чем буквальное «прекратилась, прекратилась».
- source_word: פְרָזוֹן
  choice: сельской жизни
  rationale: Редкое и трудное существительное может обозначать жителей неукреплённых селений либо сельскую жизнь в целом. Основной вариант передаёт социальный распад, не сводя значение лишь к населённым пунктам.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Сохраняется естественное локативное значение предлога בְּ.
- source_word: עַד
  choice: пока … не
  rationale: Русская конструкция естественно обозначает предел продолжавшегося состояния и поворотный момент повествования.
- source_word: שַׁקַּמְתִּי
  choice: я … восстала / не восстала
  rationale: Форма первого лица от קום означает, что Девора поднялась и выступила к действию; «восстала» сохраняет возвышенный поэтический регистр и повтор.
- source_word: דְּבוֹרָה
  choice: Девора
  rationale: Использована традиционная русская библейская форма имени.
- source_word: אֵם
  choice: мать
  rationale: Слово сохранено без поясняющего перефразирования, чтобы метафорическая или почётная сила самоописания раскрывалась из контекста.
theological_decisions:
- issue: Смысл самоописания Деворы אֵם בְּיִשְׂרָאֵל
  choice: «как мать в Израиле»
  alternative: «мать Израиля» или буквальное «мать в Израиле» без сравнительного союза
  rationale: Еврейский текст говорит «мать в Израиле», а не «мать Израиля». «Как мать» естественно обозначает образную защитную и руководящую роль, не превращая выражение в более сильный титул.
translation_notes:
  register: Современный литературный русский с поэтическим повтором. «Восстала» выбрано как возвышенное, но понятное обозначение выступления к действию. Маркер сноски поставлен после всей строки, поскольку примечание поясняет ключевое выражение в первой части стиха.
