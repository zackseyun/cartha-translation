  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
translation:
  language: ru
  text: 'Поток Кишон унёс их,

    древний поток[a], поток Кишон.

    Шагай, душа моя, с силой![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поток издревле», «поток былых времён». Еврейское קְדוּמִים может указывать на древность; возможно также, это усиленное поэтическое определение, а не просто указание на возраст потока.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Топчи, душа моя, с силой!» Еврейская строка предельно сжата, а глагол может означать не только поступь или движение вперёд, но и попирание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל
  choice: поток
  rationale: Еврейское слово обозначает русло, водный поток или бурный сезонный поток. В данном контексте «поток» естественно по-русски передаёт водную стихию, унёсшую врагов, не вводя менее привычное «вади».
- source_word: קִישׁוֹן
  choice: Кишон
  rationale: Собственное название водного потока передано традиционной русской транслитерацией.
- source_word: גְּרָפָם
  choice: унёс их
  rationale: Форма глагола גרף с местоименным суффиксом означает, что поток смыл или увлёк врагов. «Унёс их» кратко и естественно сохраняет образ неудержимого течения.
- source_word: נַחַל קְדוּמִים
  choice: древний поток
  rationale: קְדוּמִים связано с давностью, прежними временами или древностью. «Древний поток» сохраняет возвышенную поэтическую аппозицию, не навязывая мифологического смысла.
- source_word: תִּדְרְכִי
  choice: ступай же
  rationale: Глагол דרך буквально связан со ступанием и попиранием, а здесь служит кратким призывом к собственной душе решительно двигаться вперёд. «Ступай же» сохраняет образ шага и побудительную силу формы.
- source_word: נַפְשִׁי
  choice: душа моя
  rationale: נפש здесь употреблено в поэтическом самообращении. «Душа моя» сохраняет риторическую форму и не сводит выражение к простому «я».
- source_word: עֹז
  choice: с силой
  rationale: עֹז означает силу или мощь. Сжатое сочетание естественно понимается как обстоятельство образа действия; «с силой» сохраняет эту синтаксическую открытость.
