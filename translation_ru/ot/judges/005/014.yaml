base_translation:
  language: en
  yaml_path: translation/ot/judges/005/014.yaml
  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: ru
  text: Из Ефрема — те, чей корень был в земле Амалика[a]; за тобой — Вениамин среди твоих племён[b]. От Махира сошли предводители[c][d], а от Завулона — те, кто держит жезл писца[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «чей корень выступил против Амалика» или «чей корень был в нагорье Амалика». Еврейская поэтическая строка трудна для истолкования и, вероятно, содержит географический намёк.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «за тобой, Вениамин, среди твоего народа»; возможно также: «Вениамин последовал за тобой вместе со своими родами». Еврейское выражение необычно.'
    reason: lexical_alternative
  - marker: c
    text: Махир — ведущий род в колене Манассии; поэтому в некоторых переводах здесь стоит «Манассия».
    reason: cultural_note
  - marker: d
    text: 'Или: «правители» либо «законодатели». Еврейское слово может обозначать тех, кто устанавливает решения и обладает властью.'
    reason: lexical_alternative
  - marker: e
    text: 'Буквально: «те, кто тянет жезл писца». Редкое выражение может относиться к созыву и учёту воинов или к жезлу военачальника.'
    reason: lexical_alternative
