- source_word: אַחֲרֶיךָ בִנְיָמִין
  choice: за тобой — Вениамин
  rationale: Передаёт краткость и эллиптичность еврейской поэзии, не добавляя отсутствующего в тексте глагола.
- source_word: בַּעֲמָמֶיךָ
  choice: среди твоих племён
  rationale: Буквально форма означает «среди твоих народов»; в данном контексте «племён» естественнее по-русски и допускает значение родовых или союзных групп.
- source_word: מִנִּי מָכִיר
  choice: От Махира
  rationale: Сохранено собственное имя названного в еврейском тексте ведущего рода Манассии.
- source_word: יָרְדוּ
  choice: сошли
  rationale: Передано буквальное пространственное значение глагола без излишней конкретизации направления движения.
- source_word: מְחֹקְקִים
  choice: предводители
  rationale: В военно-поэтическом контексте слово обозначает обладающих властью руководителей; вариант не сужает значение до законодателей.
- source_word: מֹשְׁכִים בְּשֵׁבֶט סֹפֵר
  choice: те, кто держит писцовский жезл
  rationale: Формулировка сохраняет редкий образ жезла или посоха писца и не решает однозначно, относится ли он к военному учёту, созыву или письму.
