base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
translation:
  language: ru
  text: Избрали новых богов[a] — тогда война была у ворот[b]. Разве можно было увидеть щит или копьё среди сорока тысяч в Израиле?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальнее: «Он избрал новых богов» или «кто-то избрал новых богов». В еврейском тексте глагол стоит в единственном числе, но в контексте его обычно понимают как относящийся к Израилю собирательно.'
    reason: alternative_reading
  - marker: b
    text: 'Еврейская строка трудна; возможен перевод: «тогда у ворот шли сражения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר
  choice: Избрали
  rationale: Форма глагола — 3-е лицо мужского рода единственного числа, однако в контексте субъект естественно понимается неопределённо или собирательно — народ Израиля. Русское множественное число ясно передаёт обвинение народа, а морфологическая особенность отмечена в сноске.
- source_word: אֱלֹהִים חֲדָשִׁים
  choice: новых богов
  rationale: В контексте речь идёт о чужих божествах, избранных Израилем; это прямой и естественный русский эквивалент.
- source_word: אָז
  choice: тогда
  rationale: Сохраняет временную и, возможно, последовательную связь между отступничеством и последовавшей войной.
- source_word: לָחֶם שְׁעָרִים
  choice: война дошла до ворот
  rationale: Еврейское выражение сжато и трудно. Такое прочтение передаёт, что военные действия достигли городских ворот, и остаётся естественным по-русски.
- source_word: מָגֵן
  choice: щит
  rationale: Обычное обозначение защитного вооружения.
- source_word: אִם יֵרָאֶה
  choice: Разве видны были
  rationale: Передаёт риторический вопрос, подразумевающий отсутствие оружия.
- source_word: וָרֹמַח
  choice: или копьё
  rationale: Контекстуально и лексически стандартное название оружия; союз в риторическом вопросе естественно передан как «или».
- source_word: בְּאַרְבָּעִים אֶלֶף
  choice: у сорока тысяч
  rationale: Русская конструкция естественно выражает отсутствие оружия среди указанного числа людей.
- source_word: בְּיִשְׂרָאֵל
  choice: в Израиле
  rationale: Сохраняет национально-социальную сферу отсчёта.
theological_decisions:
- issue: Субъект начального глагола
  choice: 'Собирательный субъект — израильтяне: «Избрали новых богов»'
  alternative: «Он/кто-то избрал новых богов»; реже — Бог избрал нечто новое
  rationale: Контекст песни связывает бедствие с отступничеством Израиля. Понимание Бога как субъекта при объекте «новые боги» контекстуально и богословски крайне затруднительно. При этом единственное число еврейского глагола не скрыто, а отмечено в сноске.
- issue: Связь отступничества и войны
  choice: «тогда» сохраняет последовательность без явного утверждения строгой причинности
  alternative: 'Передать причинно: «и потому»'
  rationale: אָז обозначает время или последовательность; перевод не должен добавлять причинную связь сильнее, чем выражено в тексте.
translation_notes:
  register: Современный литературный русский язык с поэтической сжатостью, подходящей для Песни Деворы. «Дошла до ворот» делает образ войны у городских ворот ясным, не устраняя отмеченную в сноске неоднозначность оригинала.
