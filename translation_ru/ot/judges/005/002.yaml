base_translation:
  language: en
  yaml_path: translation/ot/judges/005/002.yaml
  text: When leaders took the lead in Israel, when the people volunteered, bless the LORD!
translation:
  language: ru
  text: 'Когда в Израиле вожди выступили во главе[a],

    когда народ вызвался добровольно,

    благословляйте ГОСПОДА!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда в Израиле распустили волосы». Еврейская поэтическая фраза допускает оба понимания.'
    reason: Убирает не выраженное в оригинале уточнение «воины» и сохраняет лексическую неоднозначность выражения בִּפְרֹעַ פְּרָעוֹת.
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  choice: когда вожди повели за собой
  rationale: Редкая и трудная поэтическая конструкция, построенная на повторе корня פרע. В данном контексте естественно передаёт выступление предводителей во главе Израиля, сохраняя созвучие смысловым повтором «вожди повели». Альтернативное понимание отмечено в сноске.
- source_word: בְּהִתְנַדֵּב עָם
  choice: когда народ вызвался добровольно
  rationale: Возвратная порода глагола נדב обозначает добровольную готовность или добровольное выступление; перевод передаёт инициативное участие народа.
- source_word: בָּרֲכוּ יְהוָה
  choice: благословляйте ГОСПОДА
  rationale: Форма глагола — повелительное наклонение множественного числа. Тетраграмматон передан традиционным типографически выделенным титулом «ГОСПОДЬ» в требуемом падеже.
theological_decisions:
- issue: Субъект и смысл начальной строки
  choice: вожди повели за собой
  alternative: воины распустили волосы / волосы были распущены
  rationale: Контекст песни связывает добровольное выступление народа с его руководителями, однако лексическая форма допускает древний образ распущенных волос, поэтому неоднозначность не устранена молча, а вынесена в сноску.
- issue: Передача имени יהוה
  choice: ГОСПОДА
  alternative: Яхве
  rationale: Использован традиционный русский эквивалент с прописным выделением, соответствующий принятой в консультационном тексте передаче LORD и не добавляющий конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Смысловой повтор «вожди повели» отражает повтор корня в еврейском тексте; строки оформлены как параллелизм древнееврейской песни.
