base_translation:
  language: en
  yaml_path: translation/ot/judges/005/019.yaml
  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
translation:
  language: ru
  text: 'Пришли цари, вступили в бой;

    тогда сражались цари Ханаана

    у Таанаха, при водах Мегиддо,

    серебряной добычи[a] не взяли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «серебряной наживы» или «прибыли в серебре». Еврейское выражение может обозначать материальную прибыль вообще; в контексте битвы вероятнее имеется в виду добыча.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ מְלָכִים
  choice: Пришли цари
  rationale: Сохранены краткость, порядок образов и поэтическая неопределённость еврейского выражения без артикля.
- source_word: נִלְחָמוּ
  choice: вступили в бой
  rationale: Нифаль глагола לחם означает «сражаться, вести бой»; выражение естественно по-русски и сохраняет военный контекст.
- source_word: אָז נִלְחֲמוּ מַלְכֵי כְנַעַן
  choice: тогда сражались цари Ханаана
  rationale: «Тогда» передаёт последовательность, обозначенную אָז, а сочетание «цари Ханаана» прозрачно воспроизводит конструкцию исходного текста.
- source_word: בְּתַעְנַךְ
  choice: у Таанаха
  rationale: Предлог ב здесь обозначает место сражения; «у Таанаха» естественно указывает на город и его окрестности.
- source_word: עַל מֵי מְגִדּוֹ
  choice: при водах Мегиддо
  rationale: עַל в данном топографическом контексте выражает близость к водам; «при» сохраняет возвышенный поэтический тон без излишнего уточнения географии.
- source_word: בֶּצַע כֶּסֶף
  choice: серебряной добычи
  rationale: בֶּצַע может означать наживу, прибыль или добычу; в контексте битвы «серебряная добыча» наиболее естественна, а неоднозначность отмечена в сноске.
- source_word: לֹא לָקָחוּ
  choice: не взяли
  rationale: Прямо передаёт отрицательную форму глагола לקח и сохраняет лаконичность стиха.
