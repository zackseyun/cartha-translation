base_translation:
  language: en
  yaml_path: translation/ot/judges/005/025.yaml
  text: He asked for water[a]; she gave milk[b]. In a bowl fit for nobles she brought him curds.
translation:
  language: ru
  text: Он попросил воды — она дала молока; в чаше вельмож[b] поднесла сливки[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «масло»; возможно, имеется в виду густой кисломолочный продукт.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в чаше вельмож»; возможно также: «в чаше, достойной вельмож».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: מַיִם
  choice: воды
  rationale: Прямое значение — «вода»; родительный падеж естественен при глаголе «просить» и сохраняет противопоставление просьбы Сисары ответу Иаили.
- source_word: שָׁאַל
  choice: попросил
  rationale: 'Qal, перфект, 3-е лицо мужского рода единственного числа: «попросил, затребовал». «Попросил» естественно звучит в современном русском.'
- source_word: חָלָב
  choice: молока
  rationale: Обычное значение — «молоко»; слово противопоставлено воде и передаёт проявление гостеприимства.
- source_word: נָתָנָה
  choice: она дала
  rationale: Qal, перфект, 3-е лицо женского рода единственного числа; местоимение явно обозначает смену субъекта и поддерживает поэтический параллелизм.
- source_word: בְּסֵפֶל
  choice: в чаше
  rationale: סֵפֶל обозначает чашу, миску или сосуд вроде таза; «чаша» здесь естественна, конкретна и соответствует возвышенному поэтическому контексту.
- source_word: אַדִּירִים
  choice: вельмож
  rationale: Форма может обозначать знатных или могущественных людей. Буквальное сочетание «чаша вельмож» сохраняет конструкцию и её возможную принадлежностную либо качественную окраску.
- source_word: הִקְרִיבָה
  choice: поднесла
  rationale: Hiphil от קרב — «приблизила, поднесла». В сцене угощения «поднесла» точнее передаёт жест подачи, не создавая ненужной жертвенной окраски.
- source_word: חֶמְאָה
  choice: сливки
  rationale: Слово обозначает богатый молочный продукт; точный вид продукта не вполне ясен и может пониматься как сливки, масло либо густой кисломолочный продукт. «Сливки» дают понятный современный образ, а альтернативы сохранены в примечании.
