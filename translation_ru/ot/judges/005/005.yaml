  - marker: b
    text: 'Буквально: «от лица Яхве», то есть от Его присутствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: горы
  rationale: Существительное употреблено с определённым артиклем; в русском контексте определённость естественно передаётся без отдельного показателя. «Горы» соответствует обычному значению слова и образам синайского богоявления.
- source_word: נָזְלוּ
  choice: стекали
  rationale: Глагол נזל обозначает течение, стекание или капание. «Стекали» сохраняет конкретный поэтический образ, не заменяя его контекстуальными толкованиями «таяли» или «сотрясались».
- source_word: מִפְּנֵי
  choice: перед
  rationale: Еврейское выражение буквально связано с лицом или присутствием. Русское «перед» естественно передаёт пребывание пред лицом кого-либо, а буквальный оттенок отмечен в сноске.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя, выраженное тетраграмматоном, а не заменяющий его титул. Форма «Яхве» является распространённой современной русской транслитерацией.
- source_word: זֶה
  choice: этот
  rationale: 'Сохранено резкое поэтическое указание исходного текста: «этот Синай». Оно не сглажено добавлением «сама гора» или пояснительным «то есть».'
- source_word: סִינַי
  choice: Синай
  rationale: В еврейском тексте стоит только имя «Синай», без существительного «гора», поэтому оно не добавлено в основной текст.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Богом Израиля
  rationale: Творительный падеж согласует приложение с оборотом «перед Яхве» и естественно передаёт определение Яхве как Бога Израиля.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет личное имя Бога. «Яхве» сохраняет различие между именем и титулом и не привносит конфессиональной замены.
- issue: Поэтический образ נָזְלוּ
  choice: горы стекали
  alternative: горы таяли; горы сотрясались
  rationale: Выбрано лексически прямое значение глагола. Оно сохраняет необычный образ реакции творения на присутствие Яхве, не разрешая его в пользу одного из традиционных толкований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим строем. Необычное «этот Синай» намеренно сохраняет резкость еврейской строки; личное имя передано как «Яхве». Повтор «перед Яхве» сохранён как значимый поэтический параллелизм.
