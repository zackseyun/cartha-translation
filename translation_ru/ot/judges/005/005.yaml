  text: Горы стекали[a] перед[b] Яхве, этот Синай — перед Яхве, Богом Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «таяли». Глагол буквально означает «течь», «стекать» или «капать»; образ иногда понимают как таяние гор.'
