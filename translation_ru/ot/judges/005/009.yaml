base_translation:
  language: en
  yaml_path: translation/ot/judges/005/009.yaml
  text: My heart is with the leaders of Israel[a], who volunteered among the people. Bless Yahweh!
translation:
  language: ru
  text: Сердце моё — с вождями Израиля[a], добровольно выступившими среди народа. Благословите Яхве!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Сердце моё — с законодателями Израиля — теми, кто добровольно отдал себя среди народа».'
    reason: Лексема חקק может указывать на издающих постановления, а форма от נדב буквально подчёркивает добровольное самоотдание; тире показывает, что речь идёт об одной группе.
lexical_decisions:
- source_word: לִבִּי
  choice: Сердце моё
  rationale: Сохранён еврейский образ сердца как выражения внутренней приверженности и одобрения; подразумеваемая связка передана тире.
- source_word: לְחוֹקְקֵי
  choice: с вождями
  rationale: Форма от חקק может обозначать тех, кто устанавливает постановления, то есть правителей или предводителей. В контексте песни естественное русское «вожди» передаёт руководящую роль, не сводя её к современному законотворчеству.
- source_word: יִשְׂרָאֵל
  choice: Израиля
  rationale: Обычная родительная конструкция, указывающая на принадлежность вождей к Израилю.
- source_word: הַמִּתְנַדְּבִים
  choice: добровольно выступившими
  rationale: Hitpael-причастие от נדב выражает добровольную готовность отдать себя общему делу. «Добровольно выступившими» естественно для военного контекста и сохраняет идею свободного самоотдания.
- source_word: בָּעָם
  choice: среди народа
  rationale: עם имеет широкое значение «народ». Перевод не сужает его до войска, хотя военный оттенок возможен в контексте.
- source_word: בָּרֲכוּ
  choice: Благословите
  rationale: Передан императив множественного числа от ברך и сохранён прямой призыв к слушателям.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан транслитерацией личного имени, а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет Тетраграмматон; форма «Яхве» сохраняет личное имя Бога и соответствует наиболее принятой научной реконструкции произношения.
- issue: Характер добровольного выступления руководителей
  choice: добровольно выступившими
  alternative: добровольно отдавшими себя
  rationale: Выбрана естественная для контекста формулировка без уточнения, шла ли речь исключительно о военной службе; более буквальная идея самоотдания сохранена в примечании через альтернативный перевод всей конструкции.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной песенной интонацией. Инверсия «Сердце моё» сохраняет поэтический акцент оригинала; архаизмы и узкоконфессиональная терминология не использованы.
