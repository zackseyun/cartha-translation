base_translation:
  language: en
  yaml_path: translation/ot/judges/005/004.yaml
  text: O Yahweh[a], when you went out from Seir, when you marched from the field of Edom, the earth trembled; the heavens also dripped[b], the clouds also dripped water.
translation:
  language: ru
  text: 'Яхве, когда Ты вышел из Сеира,

    когда шествовал с поля Эдома[a],

    земля содрогнулась;

    и небеса роняли капли,

    и тучи роняли воду.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из открытой страны Эдома». Буквально: «с поля Эдома».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом; форма «Яхве» закрепилась в современной русскоязычной научной и литературной традиции.
- source_word: בְּצֵאתְךָ
  choice: когда Ты вышел
  rationale: Конструкция с инфинитивом имеет временное значение; перевод сохраняет прямое обращение к Яхве.
- source_word: מִשֵּׂעִיר
  choice: из Сеира
  rationale: Топоним передан принятой русской формой, а предлог מן — исходным значением «из».
- source_word: בְּצַעְדְּךָ
  choice: когда шествовал
  rationale: Глагол צעד описывает размеренное, целенаправленное движение; «шествовал» сохраняет поэтический и теофанический регистр.
- source_word: מִשְּׂדֵה אֱדוֹם
  choice: с просторов Эдома
  rationale: שׂדה может обозначать поле или открытую местность. «Просторы Эдома» естественно по-русски передают открытую область, не сводя образ к одной возделанной ниве.
- source_word: אֶרֶץ רָעָשָׁה
  choice: земля содрогнулась
  rationale: В параллели с небесами и тучами אֶרֶץ вероятнее обозначает землю в широком, космическом смысле; רָעשׁ передаёт сильное сотрясение.
- source_word: גַּם שָׁמַיִם נָטָפוּ
  choice: и небеса источали влагу
  rationale: נָטַף буквально связано с капанием или истечением. «Источали влагу» сохраняет образ без неестественного русского выражения «небеса капали».
- source_word: גַּם עָבִים נָטְפוּ מָיִם
  choice: и тучи источали воду
  rationale: Повтор «источали» отражает повтор נָטַף; «тучи» передаёт עָבִים как дождевые облака, а «воду» — прямо выраженное מָיִם.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит собственное имя, поэтому оно сохранено как имя. Транслитерация «Яхве» не подменяет его титулом и не вводит конфессионально обусловленную форму.
- issue: Масштаб сотрясения в אֶרֶץ רָעָשָׁה
  choice: земля содрогнулась
  alternative: страна задрожала
  rationale: Упоминание небес и туч создаёт картину космического явления при явлении Бога; при этом русское «земля» сохраняет некоторую смысловую широту исходного אֶרֶץ.
translation_notes:
  register: Современный литературный русский язык с достоинством древней победной песни. Поэтический параллелизм сохранён повтором «когда» и «источали»; местоимение прямого обращения к Богу написано с прописной буквы.
