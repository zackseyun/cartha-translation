base_translation:
  language: en
  yaml_path: translation/ot/judges/005/018.yaml
  text: Zebulun was a people that risked its life to the death[a], and Naphtali also[b], on the heights of the field.
translation:
  language: ru
  text: Завулон — народ, презревший свою жизнь до смерти[a], и Неффалим также презрел свою жизнь до смерти на высотах поля[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не щадивший своей жизни, рискуя ею вплоть до смерти». Буквально: «презревший свою жизнь до смерти». Завулон назван собирательно, как единый народ.'
    reason: Поясняет значение глагола חרף и предельный смысл выражения לָמוּת.
  - marker: b
    text: 'Или: «на высотах открытого поля».'
    reason: שָׂדֶה может обозначать поле или открытую местность.
lexical_decisions:
- source_word: זְבֻלוּן
  choice: Завулон
  rationale: Традиционная русская форма названия колена.
- source_word: עַם
  choice: народ
  rationale: Сохраняет собирательное обозначение колена и именную поэтическую конструкцию оригинала.
- source_word: חֵרֵף
  choice: не щадивший
  rationale: В данном военном контексте глагол выражает пренебрежение собственной жизнью, то есть готовность подвергнуть её смертельной опасности; русский оборот естественно передаёт этот смысл, а буквальный оттенок отмечен в сноске.
- source_word: נַפְשׁוֹ
  choice: своей жизни
  rationale: נפש здесь означает жизнь человека, а не «душу» как богословское понятие; возвратное местоимение естественно соотносится с собирательным субъектом «народ».
- source_word: לָמוּת
  choice: даже перед лицом смерти
  rationale: Передаёт предельную степень самоотверженности — вплоть до смертельного исхода — в естественной современной русской форме.
- source_word: וְנַפְתָּלִי
  choice: и Неффалим
  rationale: Традиционная русская форма названия колена; союз сохраняет поэтический параллелизм. Общая характеристика Завулона подразумевается и для Неффалима, но не добавляется явно.
- source_word: עַל מְרוֹמֵי שָׂדֶה
  choice: на высотах поля
  rationale: Близко передаёт топографический образ оригинала, не превращая «поле» однозначно в «поле битвы».
theological_decisions: []
