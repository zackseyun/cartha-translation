  register: Современный литературный русский язык с сохранением сжатого поэтического параллелизма и эллипсиса еврейского текста. Формула «не щадивший своей жизни» понятна широкому читателю и передаёт воинскую самоотверженность без излишне архаичного «презревший жизнь».
