  source_fidelity: Русский текст точно передаёт пространственные образы «из окна» и «сквозь решётку», тревожный плач матери Сисары и два параллельных вопроса. «Шаги его колесниц» сохраняет намеренно необычную метонимию פַּעֲמֵי מַרְכְּבוֹתָיו, не подменяя её ни колёсами, ни копытами.
