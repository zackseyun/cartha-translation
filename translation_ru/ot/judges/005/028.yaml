base_translation:
  language: en
  yaml_path: translation/ot/judges/005/028.yaml
  text: 'Through the window Sisera’s mother looked out and wailed through the lattice: “Why is his chariot so late in coming? Why do the hoofbeats of his chariots delay?”[a][b]'
translation:
  language: ru
  text: 'Из окна выглядывала мать Сисары и причитала сквозь решётку: «Почему так долго не едет его колесница? Почему медлят шаги его колесниц?»[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вскрикивала»; значение редкого глагола точно не установлено.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «шаги (или поступь) его колесниц»; вероятно, имеется в виду слышимый звук их приближения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַד הַחַלּוֹן
  choice: из окна
  rationale: В сочетании с глаголом выглядывания בְּעַד обозначает направление взгляда через оконный проём; по-русски естественно «выглядывала из окна».
- source_word: נִשְׁקְפָה
  choice: выглядывала
  rationale: Глагол означает смотреть наружу или вниз из окна либо с возвышения; несовершенный вид естественно рисует продолжающуюся сцену ожидания.
- source_word: וַתְּיַבֵּב
  choice: причитала
  rationale: Редкий глагол обозначает плачевный или тревожный возглас. «Причитала» передаёт эмоциональный характер речи, не сводя её непременно к рыданиям.
- source_word: אֵם סִיסְרָא
  choice: мать Сисары
  rationale: Естественная русская передача древнееврейской сопряжённой конструкции.
- source_word: בְּעַד הָאֶשְׁנָב
  choice: сквозь решётку
  rationale: Существительное обозначает решётчатый оконный проём; «сквозь решётку» сохраняет пространственный образ и избегает тяжёлого повтора слова «окно».
- source_word: בֹּשֵׁשׁ רִכְבּוֹ לָבוֹא
  choice: так долго не едет его колесница
  rationale: בֹּשֵׁשׁ выражает задержку; русская фраза естественно передаёт тревожный вопрос о запоздалом прибытии колесницы.
- source_word: פַּעֲמֵי מַרְכְּבוֹתָיו
  choice: шаги его колесниц
  rationale: Буквально речь идёт о «шагах/поступях» колесниц. Сохранена необычная метонимия исходного текста без подстановки колёс или конских копыт.
