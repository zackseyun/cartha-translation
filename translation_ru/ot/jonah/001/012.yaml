base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/012.yaml
  text: And he said to them[a], “Pick me up and throw me into the sea, and the sea will become calm for you[c][b], for I know that this great storm is upon you because of me.”
translation:
  language: ru
  text: 'Он сказал им: «Возьмите меня и бросьте в море — и море утихнет вокруг вас, потому что я знаю: эта сильная буря обрушилась на вас из-за меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂאוּנִי
  choice: Возьмите меня
  rationale: В данном контексте נשׂא обозначает физическое поднятие Ионы перед тем, как бросить его за борт. «Возьмите меня» естественно по-русски и не добавляет излишней экспрессии.
- source_word: וַהֲטִילֻנִי
  choice: бросьте
  rationale: Каузативная форма טול означает «бросить, кинуть». «Бросьте» ясно и современно; «швырните» было бы экспрессивнее исходного текста.
- source_word: אֶל־הַיָּם
  choice: в море
  rationale: ים обычно означает «море», а предлог אֶל при глаголе движения естественно передаётся здесь как «в».
- source_word: וְיִשְׁתֹּק הַיָּם
  choice: море утихнет
  rationale: שתק буквально связано с тишиной, но применительно к бушующему морю естественное русское соответствие — «утихнет», сохраняющее образ прекращения волнения.
- source_word: מֵעֲלֵיכֶם
  choice: вокруг вас
  rationale: Буквально выражение означает «с/от над вами». В сочетании с морем оно указывает, что море перестанет бушевать около моряков; «вокруг вас» сохраняет пространственный образ без неестественной русской кальки.
- source_word: יוֹדֵעַ אָנִי
  choice: я знаю
  rationale: Причастие с отдельным местоимением создаёт некоторое смысловое ударение; русский порядок «я знаю» передаёт утверждение естественно, не преувеличивая эмфазу.
- source_word: בְשֶׁלִּי
  choice: из-за меня
  rationale: Выражение указывает на причину и ответственность Ионы. «Из-за меня» прямо и современно передаёт его признание.
- source_word: הַסַּעַר הַגָּדוֹל הַזֶּה
  choice: эта сильная буря
  rationale: סער — «буря, шторм», а גדול здесь характеризует её значительность или мощь. «Сильная буря» естественнее современному русскому читателю, чем буквальное «великая буря».
- source_word: עֲלֵיכֶם
  choice: обрушилась на вас
  rationale: Предлог על создаёт образ бедствия, находящегося над людьми или постигшего их. «Обрушилась на вас» естественно передаёт этот образ и динамику бури, не меняя причинного смысла.
theological_decisions:
- issue: Признание Ионой своей ответственности за бурю
  choice: Иона прямо признаёт, что буря обрушилась на моряков из-за него.
  alternative: Иона говорит лишь о связи бури с собой, не признавая непосредственной ответственности.
  rationale: Причинное выражение בְשֶׁלִּי ясно указывает на причину или ответственность. Перевод сохраняет исповедальное признание Ионы и не ослабляет его до простой ассоциации.
translation_notes:
  register: Современный литературный русский язык с простым, достоинственным повествованием. Прямая речь звучит естественно; сохранены причинность признания Ионы и образ утихающего моря. Маркер сноски поставлен непосредственно после соответствующей фразы.
