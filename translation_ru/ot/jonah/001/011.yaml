  source_fidelity: '«Вокруг нас» не передаёт מֵעָלֵינוּ («с/от нас, с нас сверху» в образном смысле): море и так находится вокруг корабля. Контекстуально речь о том, чтобы его натиск на моряков прекратился. Остальные основные соответствия точны: делиберативный вопрос сохранён, וְיִשְׁתֹּק передано через «утихло», а הוֹלֵךְ וְסֹעֵר — как нарастающая буря.'
