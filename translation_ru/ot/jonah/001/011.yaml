  text: Then they said to him[b][a], “What should we do to you so that the sea may quiet down for us?” For the sea was growing more and more stormy.
translation:
  language: ru
  text: 'Тогда они сказали ему: «Что нам сделать с тобой, чтобы море утихло и перестало обрушиваться на нас?» Ведь море бушевало всё сильнее.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «море шло и бушевало»; еврейская конструкция выражает нарастание бури.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה לָּךְ
  choice: Что нам сделать с тобой
  rationale: Делиберативный имперфект передан естественным русским вопросом; «с тобой» в данном контексте ясно обозначает действие в отношении Ионы, не уточняя заранее его характер.
- source_word: וְיִשְׁתֹּק הַיָּם מֵעָלֵינוּ
  choice: чтобы море утихло вокруг нас
  rationale: שׁתק означает «утихнуть, успокоиться»; целевое «чтобы» естественно передаёт смысл связи. «Вокруг нас» сохраняет пространственную и угрожающую образность מֵעָלֵינוּ лучше, чем простое «для нас», избегая неестественного буквального «с нас».
- source_word: כִּי
  choice: Ведь
  rationale: Частица вводит пояснение срочности вопроса; «ведь» естественно связывает его с усиливающейся бурей.
- source_word: הַיָּם הוֹלֵךְ וְסֹעֵר
  choice: море бушевало всё сильнее
  rationale: Конструкция הוֹלֵךְ с причастием выражает нарастание действия; перевод сохраняет прогрессивное усиление и морской контекст.
