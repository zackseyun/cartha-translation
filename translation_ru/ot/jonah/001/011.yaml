  terminology: Специальная богословская терминология и имена в стихе отсутствуют. «Море», «утихло» и «бушевало» соответствуют повествовательному морскому контексту. Сноска корректно объясняет прогрессивную конструкцию, но не должна создавать впечатления, что буквальное «шло» само по себе описывает движение моря.
