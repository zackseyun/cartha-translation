lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Сохраняет стандартную древнееврейскую повествовательную формулу и естественно сочетается с пророческим выражением «слово Яхве».
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Передаёт устойчивую пророческую формулу, сохраняя конкретное значение דָּבָר и личное имя יְהוָה.
- source_word: יוֹנָה בֶן אֲמִתַּי
  choice: Ионе, сыну Амиттая
  rationale: Принятые русские формы имён и прямое воспроизведение еврейского патронима.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит последующую прямую речь; в современном русском двоеточие выполняет эту функцию естественнее, чем буквальное «говоря».
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст содержит личное имя Бога; транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Формула «И было слово…» намеренно сохраняет повествовательный и пророческий строй оригинала; двоеточие естественно вводит продолжение речи.
