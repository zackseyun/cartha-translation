source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ לְכוּ֙ וְ/נַפִּ֣ילָה גֽוֹרָל֔וֹת וְ/נֵ֣דְעָ֔ה בְּ/שֶׁ/לְּ/מִ֛י הָ/רָעָ֥ה הַ/זֹּ֖את לָ֑/נוּ וַ/יַּפִּ֨לוּ֙ גּֽוֹרָל֔וֹת וַ/יִּפֹּ֥ל הַ/גּוֹרָ֖ל עַל יוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/007.yaml
  text: And they said[a], each man to his companion, “Come, let us cast lots, so that we may know on whose account this evil has come upon us.” So they cast lots, and the lot fell on Jonah.
translation:
  language: ru
  text: 'И сказали они друг другу: «Давайте бросим жребий и узнаем, из-за кого постигло нас это бедствие[a]». Они бросили жребий, и жребий пал на Иону.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово может также означать «зло», «беду» или «несчастье» — в зависимости от контекста.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: друг другу
  rationale: Еврейское распределительное выражение описывает взаимную речь мужчин; по-русски естественно и точно передаётся оборотом «друг другу».
- source_word: לְכוּ
  choice: давайте
  rationale: В данном контексте императив служит побуждением к совместному действию; русское «давайте» естественно вводит предложение.
- source_word: וְנַפִּילָה גוֹרָלוֹת
  choice: бросим жребий
  rationale: Когортатив выражает совместное намерение; «бросить жребий» — устойчивое русское обозначение этого действия. Единственное число в русском соответствует принятой идиоме при еврейском множественном גוֹרָלוֹת.
- source_word: וְנֵדְעָה
  choice: и узнаем
  rationale: Когортатив продолжает цель предложенного действия. В русском сочинительная связь после «давайте» естественно передаёт намерение выяснить причину.
- source_word: בְּשֶׁלְּמִי
  choice: из-за кого
  rationale: Выражение указывает на лицо, по причине которого произошло бедствие, не добавляя более сильного утверждения о нравственной виновности.
- source_word: הָרָעָה הַזֹּאת
  choice: это бедствие
  rationale: В контексте бури רָעָה обозначает губительную беду или несчастье, а не нравственное зло. «Бедствие» ясно передаёт контекстуальное значение; сноска сохраняет более широкий диапазон еврейского слова.
- source_word: לָנוּ
  choice: постигло нас
  rationale: Хотя отдельного глагола в еврейском нет, русский требует сказуемого; «постигло нас» естественно выражает бедствие, обрушившееся на людей.
- source_word: וַיַּפִּלוּ גוֹרָלוֹת
  choice: Они бросили жребий
  rationale: Форма продвигает повествование от предложения к его исполнению; русский порядок ясно передаёт последовательность.
- source_word: וַיִּפֹּל הַגּוֹרָל עַל יוֹנָה
  choice: жребий пал на Иону
  rationale: Это устойчивый русский оборот, точно передающий результат жеребьёвки.
theological_decisions:
- issue: Значение רָעָה в контексте бедствия, связанного с Божьим промыслом
  choice: это бедствие
  alternative: это зло; эта беда; это несчастье
  rationale: Здесь моряки говорят о постигшей их опасности, а не о совершённом ими нравственном зле. «Бедствие» передаёт непосредственный смысл контекста, а сноска сохраняет присущую еврейскому слову многозначность и не делает дополнительных выводов о вине или Божьем нравственном характере.
translation_notes:
  register: Современный литературный русский язык; речь моряков передана естественно, но с сохранением достоинства повествования. Повтор слова «жребий» сохранён как значимый элемент еврейского текста.
