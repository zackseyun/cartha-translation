  text: וַ/יִּֽירְא֤וּ הָֽ/אֲנָשִׁים֙ יִרְאָ֣ה גְדוֹלָ֔ה וַ/יֹּאמְר֥וּ אֵלָ֖י/ו מַה זֹּ֣את עָשִׂ֑יתָ כִּֽי יָדְע֣וּ הָ/אֲנָשִׁ֗ים כִּֽי מִ/לִּ/פְנֵ֤י יְהוָה֙ ה֣וּא בֹרֵ֔חַ כִּ֥י הִגִּ֖יד לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/010.yaml
  text: Then the men were greatly afraid[a], and they said to him, “What is this that you have done?” For the men knew that he was fleeing from the presence of Yahweh, because he had told them.
translation:
  language: ru
  text: 'Тогда эти люди сильно испугались[a] и сказали ему: «Что это ты сделал?» Ведь они знали, что он бежит от лица Яхве, потому что он рассказал им об этом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «испугались великим страхом».'
    reason: Передаёт однокоренную усилительную конструкцию еврейского текста.
lexical_decisions:
- source_word: וַיִּירְאוּ ... יִרְאָה גְדוֹלָה
  choice: сильно испугались
  rationale: Однокоренная конструкция буквально означает «убоялись великим страхом» и усиливает выражение; выбранный вариант естественно передаёт эту интенсивность по-русски.
- source_word: הָאֲנָשִׁים
  choice: эти люди
  rationale: Еврейское слово означает «люди, мужчины». Указательное «эти» естественно связывает их с уже упомянутыми моряками, не подменяя исходное слово контекстуальным «моряки».
- source_word: מַה זֹּאת עָשִׂיתָ
  choice: Что же ты наделал?
  rationale: Это естественное русское восклицание передаёт не запрос о характере поступка, а потрясённый упрёк, выраженный еврейской конструкцией с указательным элементом.
- source_word: מִלִּפְנֵי יְהוָה
  choice: от лица Яхве
  rationale: Формально близкое и понятное библейское выражение сохраняет образ «лица/присутствия» и иронию попытки скрыться от Бога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передача тетраграмматона личным именем сохраняет форму исходного текста, не заменяя её титулом «Господь».
- source_word: בֹרֵחַ
  choice: бежит
  rationale: Причастная форма представляет бегство как продолжающееся действие; настоящее время в придаточной изъяснительной части естественно передаёт это в русском.
- source_word: כִּי ... כִּי
  choice: Они узнали ... потому что
  rationale: Первое כִּי вводит пояснение к реакции людей, а второе — основание их знания. В русском отдельное предложение без начального «ибо» звучит естественно и сохраняет логическую связь.
- source_word: הִגִּיד לָהֶם
  choice: он сам рассказал им об этом
  rationale: Глагол означает «сообщил, рассказал»; «сам» подчёркивает, что источник знания — Иона, а «об этом» естественно восполняет подразумеваемый объект.
theological_decisions:
- issue: Передача Божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как личное имя. «Яхве» прямо передаёт имя и не заменяет его титулом; форма «Иегова» основана на позднем смешении согласных имени с гласными заменяющего чтения.
- issue: Смысл выражения מִלִּפְנֵי יְהוָה
  choice: от лица Яхве
  alternative: от присутствия Яхве; прочь от Яхве
  rationale: 'Выбранная формулировка сохраняет пространственно-реляционный образ исходного выражения и богословское напряжение: Иона пытается бежать от лица Бога, хотя повествование показывает невозможность такого бегства.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Реплика «Что же ты наделал?» звучит естественно и передаёт потрясение и упрёк. Выражение «от лица Яхве» намеренно сохраняет исходный образ.
