    rationale: יָדְעוּ — прошедшее «знали», а не сообщение о том, что знание было приобретено в данный момент. Это знание служит объяснением их страха и вопроса.
  - severity: low
    issue: Добавлено «сам»
    rationale: В הִגִּיד לָהֶם нет усилительного «сам»; его следует убрать, чтобы не приписывать Ионе специально акцентированное действие.
  - severity: low
    issue: Реплика «Что же ты наделал?» менее точно отражает указательный элемент
    rationale: Она возможна по смыслу, но «Что это ты сделал?» естественно передаёт и упрёк, и demonstrative זֹּאת без разговорного оттенка «наделал».
