  source_fidelity: 'В черновике верно переданы интенсивность страха, личное имя Яхве и продолжающийся характер бегства. Однако «Они узнали» меняет значение: еврейский текст говорит, что люди уже знали это, и первая כִּי объясняет их реакцию. Добавленное «сам» вносит невыраженное в оригинале усиление.'
  naturalness: «Что это ты сделал?» — современная естественная реплика, при этом она ближе сохраняет указательный элемент מַה זֹּאת, чем «Что же ты наделал?». «Ведь они знали» ясно выражает пояснительную связь и не создаёт впечатления нового узнавания.
  terminology: «Яхве» последовательно и точно передаёт יהוה. «От лица Яхве» допустимо в современном литературном русском с умеренной библейской окраской и сохраняет образ оригинала.
