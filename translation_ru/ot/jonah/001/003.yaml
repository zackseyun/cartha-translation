  source_fidelity: В целом перевод точно передаёт последовательность действий, географические названия, повтор глагола «спустился» и дважды употреблённое выражение «от лица Яхве». Однако «вместе с моряками» конкретизирует древнееврейское עִמָּהֶם («с ними») как именно моряков, хотя в самом стихе эта группа прямо не названа. Следует сохранить местоименную неопределённость. Более прямое «Он заплатил ... и спустился в него» также лучше воспроизводит два последовательных глагола и значение בָּהּ («в него»).
