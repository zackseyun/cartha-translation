  text: וַ/יָּ֤קָם יוֹנָה֙ לִ/בְרֹ֣חַ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָ֑ה וַ/יֵּ֨רֶד יָפ֜וֹ וַ/יִּמְצָ֥א אָנִיָּ֣ה בָּאָ֣ה תַרְשִׁ֗ישׁ וַ/יִּתֵּ֨ן שְׂכָרָ֜/הּ וַ/יֵּ֤רֶד בָּ/הּ֙ לָ/ב֤וֹא עִמָּ/הֶם֙ תַּרְשִׁ֔ישָׁ/ה מִ/לִּ/פְנֵ֖י יְהוָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/003.yaml
  text: But Jonah rose to flee to Tarshish from the presence of Yahweh[a]. He went down to Joppa and found a ship going to Tarshish. He paid its fare and went down into it to go with them to Tarshish[c][b], away from the presence of Yahweh.
translation:
  language: ru
  text: Но Иона встал, чтобы бежать в Фарсис от лица Яхве[a]. Он спустился в Иоппию и нашёл корабль, направлявшийся в Фарсис[c]. Он заплатил за проезд и спустился в него[b], чтобы отправиться с ними в Фарсис, прочь от лица Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прочь от Яхве»; буквально: «от лица Яхве».'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь повторён глагол «спустился»; этот повтор поддерживает нисходящее движение повествования в первой главе.
    reason: cross_reference
  - marker: c
    text: 'Или: «шедший в Фарсис». Еврейское выражение буквально означает корабль, «идущий/приходящий в Фарсис».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Сохраняет прямое значение глагола и повествовательную последовательность, не превращая выражение в более свободное «отправился».
- source_word: לִבְרֹחַ
  choice: чтобы бежать
  rationale: Передаёт целенаправленную попытку бегства и серьёзность неповиновения Ионы.
- source_word: תַּרְשִׁישָׁה
  choice: в Фарсис
  rationale: Направительное окончание указывает на движение к Фарсису; «в Фарсис» естественно по-русски.
- source_word: מִלִּפְנֵי יְהוָה
  choice: от лица Яхве
  rationale: Сохраняет конкретный древнееврейский образ лица/присутствия и богословскую иронию попытки скрыться от Бога.
- source_word: יָפוֹ
  choice: Иоппия
  rationale: Традиционная русская библейская форма названия древнего портового города, современная Яффа.
- source_word: אָנִיָּה
  choice: корабль
  rationale: Обозначает морское судно и естественно звучит в данном контексте.
- source_word: בָּאָה תַרְשִׁישׁ
  choice: направлявшийся в Фарсис
  rationale: Идиоматически передаёт движение судна к указанному месту, сохраняя возможность понимать его как корабль, следовавший туда.
- source_word: שְׂכָרָהּ
  choice: заплатив за проезд
  rationale: По контексту существительное означает плату за морской переезд; русский оборот не уточняет без необходимости, оплатил ли Иона только своё место или нанял судно целиком.
- source_word: וַיֵּרֶד בָּהּ
  choice: спустился на корабль
  rationale: Сохраняет повтор глагола ירד «спускаться», важный для нисходящего движения повествования, при естественном русском управлении.
- source_word: לָבוֹא עִמָּהֶם
  choice: чтобы вместе с моряками отправиться
  rationale: Контекстуально проясняет, что местоимение относится к людям на корабле, и естественно передаёт совместное путешествие.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Текст содержит тетраграмматон — личное заветное имя Бога; транслитерация «Яхве» сохраняет отличие имени от титула.
- issue: Значение מִלִּפְנֵי יהוה
  choice: от лица Яхве / прочь от лица Яхве
  alternative: от присутствия Яхве / прочь от Яхве
  rationale: Буквальный образ «лица» сохранён, чтобы не устранять богословскую напряжённость попытки Ионы уйти от Божьего лица; во втором употреблении «прочь» выражает направленность бегства.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной, достойной библейской интонацией. Сохранены повтор «спустился» и образ «от лица Яхве»; синтаксис сделан понятным для обычного читателя. Все маркеры сносок присутствуют в основном тексте.
