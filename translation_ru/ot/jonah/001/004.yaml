  variant: modern literary Russian
source:
  edition: WLC
  text: וַֽ/יהוָ֗ה הֵטִ֤יל רֽוּחַ גְּדוֹלָה֙ אֶל הַ/יָּ֔ם וַ/יְהִ֥י סַֽעַר גָּד֖וֹל בַּ/יָּ֑ם וְ/הָ֣/אֳנִיָּ֔ה חִשְּׁבָ֖ה לְ/הִשָּׁבֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/004.yaml
  text: But Yahweh hurled a great wind onto the sea[a], and there was a great storm on the sea[b], so that the ship seemed about to be broken up.
translation:
  language: ru
  text: Но[a] Яхве обрушил на море сильный ветер, и на море поднялась сильная буря, так что казалось, будто корабль вот-вот разобьётся[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «И Яхве…». Еврейский союз ו обычно означает «и», но здесь по контексту может выражать противопоставление бегству Ионы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «корабль думал разбиться». Это олицетворение показывает, что корабль, казалось, вот-вот развалится на части.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Но Яхве
  rationale: Союз ו в данном повествовательном контексте обозначает переход, противопоставленный бегству Ионы; «но» естественно передаёт этот поворот. Имя יהוה передано как «Яхве», то есть как личное имя, а не титул.
- source_word: הֵטִיל
  choice: обрушил
  rationale: Глагол обозначает сильный бросок или метание. «Обрушил» естественно сочетается в русском языке с ветром, сохраняет направленность действия и подчёркивает его силу.
- source_word: רוּחַ גְּדוֹלָה
  choice: сильный ветер
  rationale: В морском контексте רוּחַ означает «ветер». Прилагательное גָּדוֹל передано словом «сильный», наиболее естественно характеризующим ветер и сохраняющим смысловую перекличку со «сильной бурей».
- source_word: אֶל הַיָּם
  choice: на море
  rationale: Предлог אֶל при глаголе направленного действия передаёт движение к морю или на его поверхность; русское «на море» сохраняет эту направленность.
- source_word: וַיְהִי סַעַר גָּדוֹל
  choice: и на море поднялась сильная буря
  rationale: Оборот וַיְהִי сообщает о возникшем результате. «Поднялась буря» — естественное современное русское выражение; «сильная» передаёт גָּדוֹל и повтор характеристики из первой части стиха.
- source_word: וְהָאֳנִיָּה
  choice: так что… корабль
  rationale: Союз вводит здесь следствие бури; «так что» ясно и без избыточного толкования передаёт эту связь.
- source_word: חִשְּׁבָה לְהִשָּׁבֵר
  choice: казалось, будто корабль вот-вот разобьётся
  rationale: Буквально корабль «думал быть разбитым», что представляет собой олицетворение. Русский оборот передаёт впечатление неминуемого разрушения, а «вот-вот» выражает близость события.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон — личное имя Бога. Форма «Яхве» сохраняет его как имя и является общепринятой научной реконструкцией произношения, не подменяя его титулом.
- issue: Божественная причинность бури
  choice: Яхве непосредственно обрушил ветер
  alternative: Яхве допустил или послал ветер
  rationale: Глагол הֵטִיל прямо приписывает Яхве энергичное действие. Перевод сохраняет эту выраженную в тексте причинность и не смягчает её богословским пояснением.
translation_notes:
  register: Современный литературный русский язык с ясным, повествовательным и умеренно возвышенным звучанием. Сохранены усиленная божественная причинность, повтор характеристики ветра и бури и образность заключительной фразы; буквальный гебраизм пояснён в сноске.
