  text: וַ/יִּֽירְא֧וּ הָ/אֲנָשִׁ֛ים יִרְאָ֥ה גְדוֹלָ֖ה אֶת יְהוָ֑ה וַ/יִּֽזְבְּחוּ זֶ֨בַח֙ לַֽ/יהוָ֔ה וַֽ/יִּדְּר֖וּ נְדָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/016.yaml
  text: Then the men feared Yahweh with great fear[a], and they offered a sacrifice to Yahweh and made vows.
translation:
  language: ru
  text: Тогда люди испытали великий страх перед Яхве[a], принесли Яхве жертву и дали обеты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сильно боялись Яхве»; возможно также: «исполнились глубокого благоговения перед Яхве». Буквально по-еврейски: «люди убоялись Яхве великим страхом».'
    reason: Лексема ירא и однокоренное существительное יִרְאָה могут выражать как страх, так и благоговейный трепет; конструкция служит усилению.
lexical_decisions:
- source_word: וַיִּירְאוּ ... יִרְאָה גְדוֹלָה
  choice: испытали великий страх
  rationale: Однокоренная глагольно-именная конструкция усиливает значение страха. Русская формулировка сохраняет этот акцент и не сводит смысл ни к одному лишь ужасу, ни исключительно к благоговению.
- source_word: הָאֲנָשִׁים
  choice: эти люди
  rationale: Еврейское слово означает «люди, мужчины»; указательное «эти» естественно отсылает к уже упомянутым морякам, не заменяя исходное общее обозначение словом «моряки».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не замещающий его титул.
- source_word: וַיִּזְבְּחוּ זֶבַח לַיהוָה
  choice: принесли Яхве жертву
  rationale: Глагольно-именное сочетание естественно передаётся обычным русским выражением о принесении жертвы; дательный падеж указывает, кому она посвящена.
- source_word: וַיִּדְּרוּ נְדָרִים
  choice: дали обеты
  rationale: Идиоматичная современная русская передача формальных обещаний, данных Богу.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте прямо стоит личное имя; транслитерация сохраняет его как имя, не подменяя титулом.
- issue: Характер страха перед Яхве
  choice: испытали великий страх перед Яхве
  alternative: сильно испугались Яхве; прониклись глубоким благоговением перед Яхве
  rationale: Контекст допускает одновременно испуг, трепет и религиозное благоговение. Выбранная формулировка сохраняет напряжение между этими оттенками и согласуется с последующим жертвоприношением и обетами.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис естественный, без ненужных архаизмов; повтор имени «Яхве» сохранён вслед за еврейским текстом.
