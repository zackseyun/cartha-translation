  text: וַ/יִּקְרְא֨וּ אֶל יְהוָ֜ה וַ/יֹּאמְר֗וּ אָנָּ֤ה יְהוָה֙ אַל נָ֣א נֹאבְדָ֗ה בְּ/נֶ֨פֶשׁ֙ הָ/אִ֣ישׁ הַ/זֶּ֔ה וְ/אַל תִּתֵּ֥ן עָלֵ֖י/נוּ דָּ֣ם נָקִ֑יא כִּֽי אַתָּ֣ה יְהוָ֔ה כַּ/אֲשֶׁ֥ר חָפַ֖צְתָּ עָשִֽׂיתָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/014.yaml
  text: Then they cried out to Yahweh and said[a], “Please, Yahweh, do not let us perish on account of this man's life, and do not put innocent blood on us, for you, Yahweh[b], have done as you pleased.”
translation:
  language: ru
  text: 'Тогда они воззвали к Яхве и сказали: «Яхве, молим Тебя, не дай нам погибнуть из-за этого человека[a] и не возлагай на нас вины за невинную кровь[b], ведь Ты, Яхве, сделал так, как пожелал».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из-за жизни этого человека». Возможно также: «за то, что лишим этого человека жизни».'
    reason: Еврейский оборот связан со «жизнью этого человека» и допускает как причинный смысл, так и просьбу не вменить морякам ответственность за лишение его жизни.
  - marker: b
    text: 'Буквально: «не возлагай на нас невинную кровь»; то есть не вмени нам вину за её пролитие.'
    reason: Поясняется еврейская идиома, обозначающая ответственность за пролитие невинной крови.
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־יְהוָה
  choice: они воззвали к Яхве
  rationale: Оборот קרא אל обозначает обращённый к Богу настойчивый призыв; «воззвали» естественно передаёт срочность и молитвенный характер обращения.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
- source_word: אָנָּה יְהוָה
  choice: О Яхве, молим
  rationale: Частица אָנָּה выражает настойчивую мольбу. «Молим» передаёт её силу в современном литературном русском без архаического «о, умоляем».
- source_word: אַל־נָא נֹאבְדָה
  choice: не дай нам погибнуть
  rationale: Отрицательная форма с когортативом выражает просьбу не допустить их гибели, не уточняя сверх текста непосредственную причинность.
- source_word: בְּנֶפֶשׁ הָאִישׁ הַזֶּה
  choice: за жизнь этого человека
  rationale: נפש здесь обозначает жизнь человека; предлог ב допускает связь как с причиной гибели моряков, так и с лишением Ионы жизни. Краткая формулировка сохраняет эту напряжённость, а варианты пояснены в сноске.
- source_word: וְאַל־תִּתֵּן עָלֵינוּ דָּם נָקִיא
  choice: не возлагай на нас вины за невинную кровь
  rationale: Буквальный образ «не возлагай на нас невинную кровь» в русском не вполне ясен, поэтому юридико-нравственный смысл идиомы передан явно, при этом «невинная кровь» сохранена.
- source_word: כִּי אַתָּה יְהוָה כַּאֲשֶׁר חָפַצְתָּ עָשִׂיתָ
  choice: ведь Ты, Яхве, сделал, как пожелал
  rationale: Фраза передаёт совершённое действие и свободу Божьего желания, не вводя позднейшей систематической терминологии о воле или предопределении.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя Бога и отличает его от титула.
- issue: Смысл בְּנֶפֶשׁ הָאִישׁ הַזֶּה
  choice: за жизнь этого человека
  alternative: из-за этого человека; за то, что лишим этого человека жизни
  rationale: Еврейский оборот допускает причинный и связанный с отнятием жизни оттенки. Основной текст не закрепляет только одно толкование, а сноска сохраняет варианты.
- issue: Выражение кровной вины
  choice: не возлагай на нас вины за невинную кровь
  alternative: не возлагай на нас невинной крови
  rationale: Русская формулировка делает понятной подразумеваемую ответственность за пролитие невинной крови, не меняя нравственно-правового содержания.
- issue: Божье действие по собственному желанию
  choice: сделал, как пожелал
  alternative: поступил по Своей воле
  rationale: Выбранная формулировка близка к חפץ и не превращает утверждение моряков в более разработанную доктринальную формулу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным молитвенным тоном. «Воззвали» и «молим» сохраняют торжественность, но синтаксис остаётся понятным обычному читателю. Все сноски обозначены в основном тексте.
