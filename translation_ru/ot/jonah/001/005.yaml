  text: וַ/יִּֽירְא֣וּ הַ/מַּלָּחִ֗ים וַֽ/יִּזְעֲקוּ֮ אִ֣ישׁ אֶל אֱלֹהָי/ו֒ וַ/יָּטִ֨לוּ אֶת הַ/כֵּלִ֜ים אֲשֶׁ֤ר בָּֽ/אֳנִיָּה֙ אֶל הַ/יָּ֔ם לְ/הָקֵ֖ל מֵֽ/עֲלֵי/הֶ֑ם וְ/יוֹנָ֗ה יָרַד֙ אֶל יַרְכְּתֵ֣י הַ/סְּפִינָ֔ה וַ/יִּשְׁכַּ֖ב וַ/יֵּרָדַֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/005.yaml
  text: Then the sailors were afraid[a], and each cried out to his god. They threw the cargo that was in the ship into the sea to lighten it for themselves. But Yonah had gone down into the innermost parts of the vessel[b], and he lay down and fell fast asleep.
translation:
  language: ru
  text: Тогда моряки испугались, и каждый стал взывать к своему богу. Они выбросили в море груз[a], находившийся на корабле, чтобы облегчить корабль. А Иона спустился в самые дальние внутренние части корабля[b], лёг и крепко уснул.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «корабельное имущество», «снаряжение». Еврейское слово имеет широкое значение; здесь оно, вероятно, обозначает груз или вещи, выброшенные за борт, чтобы облегчить корабль.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во внутренние отсеки корабля», «в трюм».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ הַמַּלָּחִים
  choice: моряки испугались
  rationale: Глагол ירא здесь обозначает страх перед опасностью, а מַלָּחִים — членов корабельной команды; современная формулировка передаёт повествовательный смысл без оттенка благоговения.
- source_word: וַיִּזְעֲקוּ אִישׁ אֶל אֱלֹהָיו
  choice: каждый стал взывать к своему богу
  rationale: זעק выражает сильный зов в бедствии; אִישׁ имеет распределительное значение «каждый», а форма אֱלֹהָיו указывает на бога каждого отдельного моряка.
- source_word: וַיָּטִלוּ אֶת הַכֵּלִים
  choice: начали выбрасывать груз
  rationale: נטל обозначает бросание, а широкое כֵּלִים в данном морском контексте вероятнее всего относится к грузу или корабельному имуществу, которое выбрасывали за борт.
- source_word: לְהָקֵל מֵעֲלֵיהֶם
  choice: чтобы облегчить судно
  rationale: Буквально выражение говорит о том, чтобы сделать легче «с них»; по контексту имеется в виду уменьшение тяжести корабля ради находившихся на нём людей. Русская формулировка естественно передаёт подразумеваемый объект.
- source_word: יָרַד אֶל יַרְכְּתֵי הַסְּפִינָה
  choice: спустился в самые глубины корабля
  rationale: ירד значит «спуститься», а יַרְכְּתֵי обозначает удалённые внутренние части или углубления; перевод сохраняет пространственный образ, не заменяя его узким техническим термином.
- source_word: וַיִּשְׁכַּב וַיֵּרָדַם
  choice: лёг и крепко уснул
  rationale: שכב означает «лечь», а נרדם — погрузиться в сон; наречие «крепко» естественно передаёт наступление глубокого сна, подчёркнутое контекстом.
theological_decisions:
- issue: Значение языческого אֱלֹהָיו
  choice: к своему богу
  alternative: к своим богам
  rationale: 'Распределительное אִישׁ и местоименный суффикс единственного референта поддерживают смысл: каждый моряк обращался к своему божеству. Строчная буква не отождествляет его с Богом Израиля.'
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом и умеренно возвышенным библейским регистром. Имя יוֹנָה передано в закрепившейся русской библейской форме «Иона». Лексическое различие между אֳנִיָּה и סְפִינָה не превращено в искусственное техническое противопоставление; во втором случае пространственный образ выражен сочетанием «глубины корабля».
