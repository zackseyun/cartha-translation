review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: страх моряков, их раздельное обращение к своим богам, выбрасывание предметов за борт и сон Ионы сохранены. Однако «начали выбрасывать» добавляет аспект начала/продолжительности, отсутствующий в простом еврейском wayyiqtol וַיָּטִלוּ («выбросили/стали бросать»); безопаснее передать простым прошедшим временем.'
  naturalness: Текст в целом современный и литературный. «Груз, бывший на корабле» несколько тяжеловесно; «груз, находившийся на корабле» естественнее. «Самые глубины корабля» понятно, но для יַרְכְּתֵי естественнее «самые дальние внутренние части корабля», без навязывания технического значения «трюм».
  terminology: «Моряки», «своему богу», «Иона» и «корабль» уместны. «Груз» является вероятным контекстуальным значением כֵּלִים при сохранении альтернатив в примечании. Формулировка «облегчить корабль» точно и ясно выражает подразумеваемый объект действия.
  issues:
  - severity: medium
    issue: Добавлен аспект в «начали выбрасывать».
    rationale: וַיָּטִלוּ — простое повествовательное действие «они выбросили/бросили»; «начали» сообщает о начале процесса, которого исходный текст специально не выражает.
  - severity: low
    issue: «Бывший на корабле» стилистически тяжеловесно.
    rationale: Причастный оборот «находившийся на корабле» более естественен в современном литературном русском и не меняет смысла.
  - severity: low
    issue: «Самые глубины корабля» менее точно передаёт пространственное значение יַרְכְּתֵי.
    rationale: Слово обозначает дальние, внутренние или удалённые части; «самые дальние внутренние части» сохраняет эту пространственную неопределённость, не сводя её к глубине или трюму.
