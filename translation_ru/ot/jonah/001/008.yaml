base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/008.yaml
  text: Then they said to him[a], “Please tell us on whose account this trouble has come upon us. What is your occupation, and where do you come from? What is your land[b], and from what people are you?”
translation:
  language: ru
  text: 'Тогда они сказали ему: «Скажи нам, пожалуйста, из-за кого нас постигло это бедствие[a]. Чем ты занимаешься? Откуда ты родом? Из какой ты страны[b]? Из какого ты народа?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «из-за кого это бедствие с нами?» Еврейское слово רָעָה здесь означает угрожающее морякам бедствие и не обязательно подразумевает нравственное зло.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Из какой ты земли?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: Тогда они сказали ему
  rationale: Последовательная форма глагола продолжает повествование; «тогда» естественно передаёт развитие событий.
- source_word: הַגִּידָה נָּא לָנוּ
  choice: Скажи нам, пожалуйста
  rationale: Глагол в породе hифиль означает «сообщить, рассказать», а נָא придаёт просьбе оттенок вежливости и настойчивости.
- source_word: בַּאֲשֶׁר לְמִי הָרָעָה הַזֹּאת לָנוּ
  choice: из-за кого нас постигло это бедствие
  rationale: Оборот спрашивает, кто стал причиной происходящего; רָעָה в контексте опасной бури обозначает бедствие, а не обязательно нравственное зло.
- source_word: מַה מְּלַאכְתְּךָ
  choice: Чем ты занимаешься?
  rationale: Так в современном русском естественно спрашивают о работе или занятии человека; это передаёт значение מְלָאכָה без канцелярского оттенка.
- source_word: וּמֵאַיִן תָּבוֹא
  choice: Откуда ты идёшь?
  rationale: Форма תָּבוֹא буквально выражает движение «приходить/идти»; русский вопрос сохраняет конкретный смысл пути, оставаясь естественным в данной сцене.
- source_word: מָה אַרְצֶךָ
  choice: Из какой ты земли
  rationale: אֶרֶץ означает «земля, страна»; «земля» ближе к древнему понятию родной территории и не вносит современного политического оттенка.
- source_word: וְאֵי מִזֶּה עַם אָתָּה
  choice: и из какого народа?
  rationale: עַם обозначает народ или этническую общность; формулировка ясно передаёт вопрос о происхождении.
theological_decisions:
- issue: Значение רָעָה
  choice: бедствие
  alternative: зло
  rationale: Контекст указывает на угрожающую морякам бурю. Перевод «бедствие» не приписывает слову здесь нравственного значения, которого контекст не требует.
translation_notes:
  register: Современный литературный русский язык с живой, но достойной прямой речью. Краткие вопросы передают напряжённый допрос моряков; архаизмы и современная бюрократическая лексика исключены.
