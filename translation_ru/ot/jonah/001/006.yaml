  text: וַ/יִּקְרַ֤ב אֵלָי/ו֙ רַ֣ב הַ/חֹבֵ֔ל וַ/יֹּ֥אמֶר ל֖/וֹ מַה לְּ/ךָ֣ נִרְדָּ֑ם ק֚וּם קְרָ֣א אֶל אֱלֹהֶ֔י/ךָ אוּלַ֞י יִתְעַשֵּׁ֧ת הָ/אֱלֹהִ֛ים לָ֖/נוּ וְ/לֹ֥א נֹאבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/006.yaml
  text: So the captain came near to him and said to him[a], “What do you mean, sleeper? Get up, call on your god. Perhaps the god will give thought to us[c][b], so that we may not perish.”
translation:
  language: ru
  text: 'К нему подошёл начальник моряков[a] и сказал: «Как ты можешь спать? Встань, воззови к своему богу. Может быть, этот бог обратит на нас внимание[b], и мы не погибнем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «капитан»; буквально: «главный над моряками».'
    reason: lexical_alternative
  - marker: b
    text: Редкий еврейский глагол можно также понять как «подумает о нас» или «позаботится о нас».
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב הַחֹבֵל
  choice: начальник корабельщиков
  rationale: Буквально выражение обозначает главного над моряками. Такой вариант точно передаёт должность и не приписывает древнему судну современную систему званий; более привычное «капитан» отмечено в сноске.
- source_word: וַיִּקְרַב אֵלָיו
  choice: к нему подошёл
  rationale: Естественно передаёт физическое приближение, выраженное глаголом קרב.
- source_word: מַה לְּךָ נִרְדָּם
  choice: Как ты можешь спать?
  rationale: Краткий еврейский упрёк буквально труден для русского воспроизведения; выбранная формулировка сохраняет резкость и изумление говорящего.
- source_word: קוּם
  choice: Встань
  rationale: Краткий и настоятельный русский императив, соответствующий קוּם.
- source_word: קְרָא אֶל אֱלֹהֶיךָ
  choice: воззови к своему богу
  rationale: «Воззови» ясно обозначает настойчивое молитвенное обращение и соответствует конструкции קרא אל.
- source_word: אוּלַי
  choice: Может быть
  rationale: Сохраняет выраженные в тексте возможность и надежду, не превращая их в уверенность.
- source_word: יִתְעַשֵּׁת
  choice: обратит на нас внимание
  rationale: Редкий глагол допускает значения «примет во внимание», «заметит», «позаботится». Выбранный вариант естественен по-русски и не преувеличивает обещанный результат.
- source_word: הָאֱלֹהִים
  choice: этот бог
  rationale: В речи язычника артикль указывает на только что упомянутого бога Ионы. Указательное «этот» делает связь естественной по-русски, не вкладывая в уста говорящего исповедание Бога Израиля.
- source_word: וְלֹא נֹאבֵד
  choice: и мы не погибнем
  rationale: Сохраняет простую сочинительную форму еврейского текста; в контексте она выражает желаемое следствие.
theological_decisions:
- issue: Кого обозначают אֱלֹהֶיךָ и הָאֱלֹהִים в речи языческого начальника
  choice: «к своему богу … этот бог» со строчной буквы
  alternative: «к своему Богу … Бог» или «к своему богу … Бог»
  rationale: Говорящий предлагает Ионе обратиться к его собственному божеству и ещё не называет его Господом и не исповедует как единого Бога. Строчная буква сохраняет перспективу персонажа и одновременно не устраняет повествовательную иронию.
- issue: Смысл редкого глагола יִתְעַשֵּׁת
  choice: «обратит на нас внимание»
  alternative: «подумает о нас» или «позаботится о нас»
  rationale: Выбранный вариант сохраняет смысл внимания и участия, не уточняя сверх текста, последует ли непременно спасительное действие.
translation_notes:
  register: Современный литературный русский с краткой, напряжённой прямой речью. «Начальник корабельщиков» сохраняет древнюю морскую лексику, а сноска даёт привычный эквивалент «капитан». Местоимение «этот» передаёт анафорическую определённость הָאֱלֹהִים естественнее, чем неидиоматичное русское «бог» с артиклевым оттенком.
