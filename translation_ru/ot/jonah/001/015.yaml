  text: וַ/יִּשְׂאוּ֙ אֶת יוֹנָ֔ה וַ/יְטִלֻ֖/הוּ אֶל הַ/יָּ֑ם וַ/יַּעֲמֹ֥ד הַ/יָּ֖ם מִ/זַּעְפּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/015.yaml
  text: So they picked up Jonah and threw him into the sea[a], and the sea ceased from its raging.
translation:
  language: ru
  text: Тогда они подняли Иону и бросили его в море, и море перестало бушевать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: подняли
  rationale: 'Глагол נשׂא здесь обозначает конкретное физическое действие: моряки подняли Иону, чтобы бросить его за борт. «Подняли» точно и естественно передаёт смысл.'
- source_word: וַיְטִלֻהוּ
  choice: бросили его
  rationale: Глагол טול означает «бросать, кидать». Нейтральное «бросили» ясно передаёт действие, не добавляя усиления, которое было бы выражено словом «швырнули».
- source_word: אֶל הַיָּם
  choice: в море
  rationale: При глаголе движения אֶל указывает направление; по-русски сочетание «бросили в море» естественно выражает движение внутрь водной среды.
- source_word: וַיַּעֲמֹד הַיָּם
  choice: море перестало
  rationale: עמד буквально значит «стать, остановиться»; в данном контексте речь идёт о прекращении бурного движения моря. Конструкция с «перестало» сохраняет значение прекращения действия.
- source_word: מִזַּעְפּוֹ
  choice: бушевать
  rationale: זעף передаёт ярость или бурное волнение. Применительно к морю русское «бушевать» естественно сохраняет образ неистового моря, хотя несколько ослабляет буквальную форму «от своей ярости».
theological_decisions:
- issue: Олицетворение бурного моря
  choice: «море перестало бушевать»
  alternative: «море утихло от своей ярости»
  rationale: Выбранная формулировка сохраняет образ активного, бушующего моря и одновременно звучит естественно по-русски. Она не превращает повествование в отвлечённое метеорологическое описание и не добавляет богословских уточнений.
translation_notes:
  register: Современный литературный русский язык; ясная повествовательная фраза с достойным библейским звучанием, без архаизмов. Союз וַ в начале передан словом «Тогда», обозначающим последовательность событий.
