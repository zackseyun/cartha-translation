  text: וַ/יַּחְתְּר֣וּ הָ/אֲנָשִׁ֗ים לְ/הָשִׁ֛יב אֶל הַ/יַּבָּשָׁ֖ה וְ/לֹ֣א יָכֹ֑לוּ כִּ֣י הַ/יָּ֔ם הוֹלֵ֥ךְ וְ/סֹעֵ֖ר עֲלֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/013.yaml
  text: But the men rowed hard to return to the dry land[a], but they could not[c][b], because the sea kept growing more and more stormy against them.
translation:
  language: ru
  text: Но люди изо всех сил гребли, стараясь вернуться к суше[a], однако не могли, потому что море всё сильнее бушевало против них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к сухой земле»; по смыслу — к берегу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְתְּרוּ
  choice: изо всех сил гребли
  rationale: Глагол חתר буквально связан с копанием, но в морском контексте обозначает напряжённую греблю; перевод сохраняет и конкретное действие, и усилие.
- source_word: הָאֲנָשִׁים
  choice: люди
  rationale: В еврейском тексте употреблено общее слово «люди, мужчины», а не специальное обозначение моряков; контекст уже ясно указывает, о ком идёт речь.
- source_word: לְהָשִׁיב אֶל הַיַּבָּשָׁה
  choice: стараясь вернуться к суше
  rationale: Каузативная форма שוב с направлением к суше здесь естественно передаёт попытку привести судно обратно к земле; русская конструкция выражает цель напряжённой гребли.
- source_word: וְלֹא יָכֹלוּ
  choice: однако не могли
  rationale: Прямо передаёт невозможность достичь цели и повествовательное противопоставление.
- source_word: כִּי
  choice: потому что
  rationale: Союз вводит причину, по которой люди не смогли добраться до суши.
- source_word: הוֹלֵךְ וְסֹעֵר
  choice: всё сильнее бушевало
  rationale: Сочетание הוֹלֵךְ с причастием выражает нарастание процесса; формулировка естественно передаёт усиливающуюся ярость моря.
- source_word: עֲלֵיהֶם
  choice: против них
  rationale: Предлог в данном контексте представляет море как силу, направленную против людей.
