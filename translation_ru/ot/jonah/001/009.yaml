  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם עִבְרִ֣י אָנֹ֑כִי וְ/אֶת יְהוָ֞ה אֱלֹהֵ֤י הַ/שָּׁמַ֨יִם֙ אֲנִ֣י יָרֵ֔א אֲשֶׁר עָשָׂ֥ה אֶת הַ/יָּ֖ם וְ/אֶת הַ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/009.yaml
  text: He said to them[a], “I am a Hebrew, and I fear Yahweh, the God of heaven[b], who made the sea and the dry land.”
translation:
  language: ru
  text: 'Он сказал им: «Я еврей, и я боюсь[a] Яхве[b], Бога небес, который сотворил море и сушу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почитаю»; возможно также: «поклоняюсь».'
    reason: lexical_alternative
  - marker: b
    text: В древнееврейском тексте стоит יהוה (YHWH) — личное имя Бога.
    reason: divine_name
lexical_decisions:
- source_word: עִבְרִי
  choice: еврей
  rationale: Естественное и общепринятое в современном русском языке обозначение этнической принадлежности Ионы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя, представленное тетраграмматоном, а не заменяет его титулом «Господь».
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: Бога небес
  rationale: Сохраняет образ и морфологическое множественное число слова שָׁמַיִם, оставаясь естественным и возвышенным русским выражением.
- source_word: יָרֵא
  choice: боюсь
  rationale: Прямой лексический эквивалент, сохраняющий напряжение между заявлением Ионы о страхе перед Богом и его поступками; возможные значения почтения и поклонения указаны в сноске.
- source_word: עָשָׂה
  choice: сотворил
  rationale: В контексте создания Богом моря и суши русское «сотворил» естественно передаёт עָשָׂה и ясно выражает действие Творца, не добавляя идеи, отсутствующей в контексте.
- source_word: הַיָּם
  choice: море
  rationale: Обычный русский эквивалент, особенно уместный в морском контексте повествования.
- source_word: הַיַּבָּשָׁה
  choice: сушу
  rationale: Точно и естественно передаёт сухую землю в противопоставлении морю.
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Он сказал им
  rationale: Передаёт повествовательную формулу без неестественного для современного русского начального «И».
- source_word: אָנֹכִי ... אֲנִי
  choice: Я еврей, и я боюсь
  rationale: Повторение местоимения «я» отражает два явно выраженных древнееврейских местоимения и сохраняет акцент исходного текста.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит личное имя YHWH. Форма «Яхве» сохраняет его как имя, не подменяя титулом.
- issue: Смысл יָרֵא в самоописании Ионы
  choice: боюсь
  alternative: почитаю; поклоняюсь
  rationale: '«Боюсь» сохраняет прямое значение и богословскую иронию контекста: Иона исповедует страх перед Яхве, хотя бежит от него. Более мягкий вариант мог бы преждевременно снять это напряжение.'
translation_notes:
  register: Современный литературный русский язык с кратким, достойным библейского повествования синтаксисом. Повторение «я» намеренно сохранено ради акцента исходного текста; «море и сушу» образуют естественную и точную смысловую пару.
