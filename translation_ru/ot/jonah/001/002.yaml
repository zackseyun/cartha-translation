  text: ק֠וּם לֵ֧ךְ אֶל נִֽינְוֵ֛ה הָ/עִ֥יר הַ/גְּדוֹלָ֖ה וּ/קְרָ֣א עָלֶ֑י/הָ כִּֽי עָלְתָ֥ה רָעָתָ֖/ם לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/001/002.yaml
  text: Arise[a], go to Nineveh, the great city, and cry out against it[b], because their evil has come up before me.
translation:
  language: ru
  text: Встань, иди в Ниневию, великий город, и возгласи против него[a], потому что зло её жителей[b] дошло до Меня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возгласи о нём». Еврейское выражение может иметь более общий смысл, но в этом контексте, вероятнее всего, означает провозглашение суда над Ниневией.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их зло»; то есть зло жителей Ниневии. Возможно также: «их нечестие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֠וּם
  choice: Встань
  rationale: Повелительная форма от קום. «Встань» сохраняет резкость пророческого призыва и естественно сочетается со следующим «иди».
- source_word: לֵ֧ךְ
  choice: иди
  rationale: Прямой современный эквивалент повелительной формы הלך.
- source_word: אֶל נִֽינְוֵ֛ה
  choice: в Ниневию
  rationale: При глаголе движения русское «в» с винительным падежом естественно передаёт направление к городу; имя дано в принятой русской форме.
- source_word: הָעִ֥יר הַגְּדוֹלָ֖ה
  choice: великий город
  rationale: Сохраняет возможные оттенки величины и значимости, а также характерный библейский оборот.
- source_word: וּקְרָ֣א
  choice: и возгласи
  rationale: Передаёт громкое публичное провозглашение, сохраняя торжественную срочность поручения без уточнения содержания речи.
- source_word: עָלֶ֑יהָ
  choice: против него
  rationale: В сочетании с קרא и последующим указанием на зло предлог על, вероятнее всего, имеет направленный против города, обличительный смысл; альтернативная более общая трактовка отмечена в сноске.
- source_word: כִּֽי
  choice: потому что
  rationale: Ясно выражает причинную связь в современном русском языке.
- source_word: עָלְתָ֥ה
  choice: дошли
  rationale: Русский оборот «дошли до Меня» естественно передаёт метафору того, что зло достигло Божьего присутствия и внимания, хотя менее буквально воспроизводит образ восхождения.
- source_word: רָעָתָ֖ם
  choice: злодеяния его жителей
  rationale: Суффикс множественного числа относится к жителям Ниневии, тогда как ближайший названный референт-город в русском имеет единственное число. Формулировка устраняет чисто грамматическую неясность и передаёт нравственное зло как совокупность злых дел; более общее «зло» отмечено в сноске.
- source_word: לְפָנָֽי
  choice: до Меня
  rationale: В составе естественного русского выражения «дошли до Меня» передаёт достижение Божьего присутствия и внимания.
theological_decisions:
- issue: Смысл пророческого поручения וּקְרָא עָלֶיהָ
  choice: Обличительное провозглашение против Ниневии
  alternative: Общее провозглашение о ней или обращённое к ней
  rationale: Сочетание קרא с על в данном контексте и следующая причинная фраза о зле жителей весомо поддерживают направленный против города смысл. Подлинная лексическая возможность более общего понимания сохранена в сноске.
- issue: Нравственный или бедственный смысл רעה
  choice: Нравственное зло, выраженное как «злодеяния»
  alternative: Бедствие или несчастье
  rationale: Зло жителей служит причиной Божьего обвинения и поручения пророку, поэтому здесь контекст поддерживает нравственный смысл, а не бедствие, постигшее город.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Встань», «великий город» и «возгласи» сохраняют достоинство и срочность пророческой речи; синтаксис остаётся ясным для обычного современного читателя.
