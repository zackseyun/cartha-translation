source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אַתָּ֥ה חַ֨סְתָּ֙ עַל הַ/קִּ֣יקָי֔וֹן אֲשֶׁ֛ר לֹא עָמַ֥לְתָּ בּ֖/וֹ וְ/לֹ֣א גִדַּלְתּ֑/וֹ שֶׁ/בִּן לַ֥יְלָה הָיָ֖ה וּ/בִן לַ֥יְלָה אָבָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/010.yaml
  text: Then Yahweh said[a], "You had compassion on the plant, for which you did not labor and which you did not make grow, which came up in a night and perished in a night."
translation:
  language: ru
  text: 'Тогда Яхве сказал: «Ты пожалел растение[a], над которым не трудился и которое не растил. Оно появилось за одну ночь и за одну ночь погибло».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. «кикайон»; точный вид растения неизвестен. Его иногда отождествляют с клещевиной или тыквенным растением.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: חַסְתָּ עַל
  choice: ты пожалел
  rationale: Естественно передаёт сочувствие и жалость в контексте упрёка и сохраняет параллель со следующим стихом.
- source_word: הַקִּיקָיוֹן
  choice: растение
  rationale: Точный вид растения неизвестен, поэтому общее обозначение не создаёт ложной ботанической определённости.
- source_word: אֲשֶׁר לֹא עָמַלְתָּ בּוֹ
  choice: над которым не трудился
  rationale: Передаёт отсутствие вложенного Ионой труда; управление с «трудиться над» естественно для русского языка.
- source_word: וְלֹא גִדַּלְתּוֹ
  choice: и которое не растил
  rationale: Порода пиэль выражает причинение роста; русское «растил» кратко и естественно передаёт эту мысль.
- source_word: שֶׁבִּן לַיְלָה הָיָה
  choice: оно появилось за одну ночь
  rationale: Передаёт идиому краткого, внезапного возникновения, не уточняя способ появления.
- source_word: וּבִן לַיְלָה אָבָד
  choice: и за одну ночь погибло
  rationale: Сохраняет повтор и симметрию еврейского выражения, а также сильное значение אָבַד.
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Естественно обозначает последовательность повествования.
theological_decisions:
- issue: Передача Божественного имени
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя יהוה и не подменяет его титулом.
- issue: Характер отношения Ионы к растению
  choice: пожалел
  alternative: сжалился над; заботился о
  rationale: «Пожалел» сохраняет диапазон сострадания и жалости, не усиливая его до более глубокой милости и не ослабляя до простой заинтересованности.
translation_notes:
  register: Современный литературный русский язык; краткая, выразительная речь с сохранением повторной конструкции «за одну ночь». Местоимение «ты» оставлено со строчной буквы по общим нормам прямой речи.
