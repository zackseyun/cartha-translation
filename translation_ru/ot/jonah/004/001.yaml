  text: וַ/יֵּ֥רַע אֶל יוֹנָ֖ה רָעָ֣ה גְדוֹלָ֑ה וַ/יִּ֖חַר לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/001.yaml
  text: But it was greatly displeasing to Jonah[a], and he became angry.
translation:
  language: ru
  text: Но Ионе это было крайне не по душе[a], и он разгневался.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «это было злом для Ионы — великим злом». В еврейском тексте реакция Ионы описана игрой однокоренных слов со значением «зло, беда, нечто плохое».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע אֶל־יוֹנָה רָעָה גְדוֹלָה
  choice: Ионе это было крайне не по душе
  rationale: Оборот с רעע и אֶל описывает субъективную реакцию Ионы, а сочетание с однокоренным רָעָה גְדוֹלָה резко усиливает её. Русское «крайне не по душе» естественно передаёт сильное неодобрение, не представляя Божий поступок объективным злом; буквальная игра слов отмечена в сноске.
- source_word: יוֹנָה
  choice: Иона
  rationale: Традиционная и общеупотребительная русская форма библейского имени.
- source_word: וַיִּחַר לוֹ
  choice: он разгневался
  rationale: Еврейская идиома буквально говорит, что у него «разгорелось»; в данном контексте она означает сильный гнев. «Разгневался» ясно и достойно передаёт смысл без добавления отсутствующего в тексте существительного.
- source_word: וַ
  choice: Но ... и
  rationale: Первый союз передан как «Но», поскольку реакция Ионы резко противопоставлена Божьему милосердию к Ниневии в предыдущем стихе; второй продолжает последовательность действий.
theological_decisions:
- issue: Является ли רָעָה объективной оценкой Божьего решения как зла или описанием реакции Ионы
  choice: 'Субъективная реакция Ионы: «Ионе это было крайне не по душе»'
  alternative: «Это было для Ионы великим злом» / «Иона счёл это великим злом»
  rationale: Контекст описывает негодование Ионы из-за Божьего милосердия, не подтверждая его нравственную оценку. Основной текст сохраняет эту перспективу, а буквальная формулировка и игра слов приводятся в сноске.
translation_notes:
  register: Современный литературный русский язык. Выражение «крайне не по душе» понятно широкому кругу читателей, передаёт сильное неодобрение и остаётся достаточно сдержанным и повествовательным для библейского текста.
