source:
  edition: WLC
  text: וַ/יֵּצֵ֤א יוֹנָה֙ מִן הָ/עִ֔יר וַ/יֵּ֖שֶׁב מִ/קֶּ֣דֶם לָ/עִ֑יר וַ/יַּעַשׂ֩ ל֨/וֹ שָׁ֜ם סֻכָּ֗ה וַ/יֵּ֤שֶׁב תַּחְתֶּ֨י/הָ֙ בַּ/צֵּ֔ל עַ֚ד אֲשֶׁ֣ר יִרְאֶ֔ה מַה יִּהְיֶ֖ה בָּ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/005.yaml
  text: Then Jonah went out from the city and sat east of the city[b][a]. There he made himself a shelter and sat under it in the shade until he would see what would happen in the city.
translation:
  language: ru
  text: Иона вышел из города и сел к востоку от него. Там он сделал себе шалаш[a] и сидел под ним в тени, пока не увидит, что произойдёт в городе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «навес»; речь идёт о временном укрытии, часто сделанном из ветвей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «что станет с городом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: вышел
  rationale: Глагол יצא обозначает выход или уход; «вышел из города» прямо и естественно передаёт действие.
- source_word: מִקֶּדֶם לָעִיר
  choice: к востоку от него
  rationale: Пространственное выражение указывает на место с восточной стороны города; местоимение позволяет избежать тяжёлого повтора.
- source_word: וַיֵּשֶׁב
  choice: сел / сидел
  rationale: ישב в данном повествовательном контексте описывает принятие сидячего положения, а затем продолжающееся пребывание там.
- source_word: וַיַּעַשׂ לוֹ
  choice: сделал себе
  rationale: Местоименный компонент לו выражает действие в собственную пользу Ионы.
- source_word: סֻכָּה
  choice: шалаш
  rationale: Слово обозначает временное укрытие, обычно сооружённое из ветвей; «шалаш» — понятное современное русское соответствие.
- source_word: תַּחְתֶּיהָ בַּצֵּל
  choice: под ним в тени
  rationale: Женский суффикс отсылает к סֻכָּה, а צל здесь означает защищающую от солнца тень.
- source_word: עַד אֲשֶׁר יִרְאֶה
  choice: пока не увидит
  rationale: Конструкция передаёт пребывание Ионы в ожидании будущего исхода; русская форма сохраняет эту перспективную направленность.
- source_word: מַה יִּהְיֶה בָּעִיר
  choice: что произойдёт в городе
  rationale: Передача близка к форме еврейского выражения и естественна по-русски; возможный смысл судьбы самого города сохранён в примечании.
