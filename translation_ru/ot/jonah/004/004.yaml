  text: וַ/יֹּ֣אמֶר יְהוָ֔ה הַ/הֵיטֵ֖ב חָ֥רָה לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/004.yaml
  text: And Yahweh said[a], “Is it right for you to be angry?”
translation:
  language: ru
  text: 'И сказал Яхве: «Правильно ли, что ты гневаешься?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательный вав с глаголом אמר продолжает повествование; «И сказал» естественно и достойно передаёт эту связь по-русски.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано общепринятой научной транслитерацией, а не заменено титулом.
- source_word: הֲהֵיטֵב
  choice: Правильно ли
  rationale: Вопросительная частица с инфинитивом абсолютным породы хифиль от יטב здесь идиоматически выражает оценку правомерности или уместности поведения.
- source_word: חָרָה
  choice: гневаешься
  rationale: Буквальный образ разгорания в данном сочетании обозначает гнев; русский глагол передаёт идиоматический смысл без ненужной буквальности.
- source_word: לָךְ
  choice: что ты
  rationale: Предлог ל с местоименным суффиксом указывает на лицо, чьё состояние оценивается; в естественном русском синтаксисе это выражено придаточным «что ты гневаешься».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: «Яхве» сохраняет личное имя в исходном тексте и не подменяет его титулом; выбор не вводит конфессионального толкования.
- issue: Смысл вопроса הֲהֵיטֵב חָרָה לָךְ
  choice: 'Вопрос о правомерности гнева: «Правильно ли, что ты гневаешься?»'
  alternative: «Хорошо ли ты делаешь, что гневаешься?»; «Хорошо ли, что ты разгневался?»
  rationale: Еврейская формулировка оценивает оправданность или уместность гнева Ионы. Основной вариант сохраняет риторическую укоризну, не усиливая её дополнительным толкованием.
translation_notes:
  register: Современный литературный русский язык; краткая, ясная и достойная повествовательная формулировка. Формальная структура вопроса слегка перестроена ради естественного русского синтаксиса, при сохранении его оценочного смысла.
