id: JON.4.3
reference: Jonah 4:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה קַח נָ֥א אֶת נַפְשִׁ֖/י מִמֶּ֑/נִּי כִּ֛י ט֥וֹב מוֹתִ֖/י מֵ/חַיָּֽ/י־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/003.yaml
  text: And now[a], Yahweh, please take my life from me, for my dying is better than my living.
translation:
  language: ru
  text: А теперь, Яхве, прошу, забери у меня жизнь, ибо мне лучше умереть, чем жить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: А теперь
  rationale: Сохраняет и соединительное значение וְ, и непосредственный переход к просьбе Ионы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: קַח נָא
  choice: прошу, возьми
  rationale: Императив קַח означает «возьми», а частица נָא придаёт просьбе настойчивый, просительный оттенок; выбран естественный русский порядок слов.
- source_word: אֶת נַפְשִׁי מִמֶּנִּי
  choice: возьми у меня жизнь
  rationale: נֶפֶשׁ здесь обозначает жизнь Ионы, а מִמֶּנִּי — лишение или отделение; русское выражение естественно передаёт просьбу прекратить его жизнь.
- source_word: כִּי
  choice: потому что
  rationale: Вводит основание просьбы Ионы.
- source_word: טוֹב מוֹתִי מֵחַיָּי
  choice: лучше мне умереть, чем жить
  rationale: Конструкция טוֹב ... מִן имеет сравнительное значение. Инфинитивная формулировка естественна по-русски и точно передаёт смысл параллельных именных форм «моя смерть/умирание» и «моя жизнь».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте прямо стоит тетраграмматон; транслитерация сохраняет личное имя и не подменяет его титулом.
- issue: Характер просьбы Ионы
  choice: возьми у меня жизнь
  alternative: возьми мою душу
  rationale: נֶפֶשׁ в данном контексте означает земную жизнь человека. Перевод «душу» мог бы привнести не выраженное здесь представление об отделимой нематериальной сущности.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой молитвенной речи. Сравнительная фраза передана идиоматически — «лучше мне умереть, чем жить», без неестественных русских субстантивированных соответствий «моё умирание/моё житие».
