id: JON.4.11
reference: Jonah 4:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וַֽ/אֲנִי֙ לֹ֣א אָח֔וּס עַל נִינְוֵ֖ה הָ/עִ֣יר הַ/גְּדוֹלָ֑ה אֲשֶׁ֣ר יֶשׁ בָּ֡/הּ הַרְבֵּה֩ מִֽ/שְׁתֵּים עֶשְׂרֵ֨ה רִבּ֜וֹ אָדָ֗ם אֲשֶׁ֤ר לֹֽא יָדַע֙ בֵּין יְמִינ֣/וֹ לִ/שְׂמֹאל֔/וֹ וּ/בְהֵמָ֖ה רַבָּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/011.yaml
  text: And should I not have compassion on Nineveh[a], the great city, in which there are more than one hundred twenty thousand people who do not know their right hand from their left[b], and many animals?
translation:
  language: ru
  text: А Мне разве не пожалеть Ниневию[a], великий город, в котором больше ста двадцати тысяч человек, не знающих, где правая рука, а где левая[b], и множество скота?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не пощадить Ниневию».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «не знающих, где правая рука, а где левая» может относиться именно к малолетним детям или, в более широком смысле, к людям, которым недостаёт разумения.
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוּס
  choice: пожалеть
  rationale: Глагол חוּס выражает жалость, сострадание и связанное с ними удержание от уничтожения. «Пожалеть» естественно передаёт в русском контексте и сострадательное отношение Бога, и возможный оттенок пощады; более явно судебный вариант указан в сноске.
- source_word: הָעִיר הַגְּדוֹלָה
  choice: великий город
  rationale: Сохраняет значение גָּדוֹל и повторяющееся в книге обозначение Ниневии; «большой город» было бы возможно, но слабее передавало бы литературный повтор.
- source_word: הַרְבֵּה מִשְׁתֵּים עֶשְׂרֵה רִבּוֹ
  choice: больше ста двадцати тысяч
  rationale: Естественная русская передача буквального «больше двенадцати десятков тысяч» с сохранением значения превышения указанного числа.
- source_word: אָדָם
  choice: человек
  rationale: После числительного русское «человек» естественно обозначает всё население без ограничения по полу.
- source_word: אֲשֶׁר לֹא יָדַע בֵּין יְמִינוֹ לִשְׂמֹאלוֹ
  choice: не знающих, где правая рука, а где левая
  rationale: Сохраняет образ исходного выражения и его неоднозначность, но звучит естественно по-русски; перевод не уточняет, идёт ли речь именно о детях или о людях без должного разумения.
- source_word: וּבְהֵמָה רַבָּה
  choice: и множество скота
  rationale: בְּהֵמָה обычно обозначает животных, особенно домашних или скот. «Множество скота» сохраняет собирательность и не сужает значение до одного вида животных.
theological_decisions:
- issue: Кого обозначают не знающие, где правая рука, а где левая
  choice: Образное выражение сохранено без уточнения его референта.
  alternative: Малолетние дети; либо вообще жители, лишённые нравственного или духовного разумения.
  rationale: Еврейский текст допускает оба понимания, поэтому перевод не устраняет подлинную неоднозначность.
- issue: Отношение Бога, выраженное глаголом אָחוּס
  choice: 'Передать как сострадательную жалость: «не пожалеть».'
  alternative: 'Передать преимущественно как отказ от уничтожения: «не пощадить».'
  rationale: Контекст противопоставляет заботу Ионы о растении заботе Бога о Ниневии. Основной вариант подчёркивает сострадание, а сноска сохраняет допустимый оттенок пощады.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной вопросительной интонацией. Начальное «А Мне разве» передаёт противопоставление между Ионой и Богом и риторический характер вопроса. Образ правой и левой руки сохранён, а синтаксис слегка адаптирован для естественного русского звучания.
