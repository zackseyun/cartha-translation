  text: Then God said to Jonah[a], “Is it right for you to be angry about the plant?” And he said, “It is right for me to be angry, even to death.”
translation:
  language: ru
  text: 'И сказал Бог Ионе: «Правильно ли тебе гневаться из-за растения[a]?» Он ответил: «Я вправе гневаться — до смерти!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское קִיקָיוֹן (кикайон) обозначает растение, точный вид которого неизвестен; традиционно его называли тыквой или лианой, а иногда отождествляли с клещевиной.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֵיטֵב חָרָה לְךָ
  choice: Правильно ли ты гневаешься
  rationale: Еврейская идиома ставит вопрос об оправданности гнева Ионы. Такая формулировка естественна по-русски и сохраняет нравственно-оценочный смысл.
- source_word: חָרָה
  choice: гневаться / гневаюсь
  rationale: Здесь глагол обозначает гнев, а не буквальное горение; прямое обозначение эмоции естественно для современного русского текста.
- source_word: עַל הַקִּיקָיוֹן
  choice: из-за этого растения
  rationale: Предлог указывает на причину или предмет гнева, а указательное «этого» уместно для уже известного из контекста растения. Вид растения достоверно не установлен.
- source_word: הֵיטֵב חָרָה לִי
  choice: Правильно я гневаюсь
  rationale: Ответ Ионы намеренно повторяет формулировку Божьего вопроса и утверждает оправданность его гнева.
- source_word: עַד מָוֶת
  choice: до смерти
  rationale: 'Краткая формулировка сохраняет предельную силу выражения и его неоднозначность: речь может идти о гневе до смертельной степени или о готовности умереть.'
- source_word: וַיֹּאמֶר
  choice: И сказал / Он ответил
  rationale: В первой части сохранено обычное повествовательное соединение; во второй «ответил» естественно передаёт функцию реплики Ионы в диалоге, не меняя её содержания.
theological_decisions:
- issue: Нравственная оценка гнева Ионы
  choice: Передать оборот как вопрос о том, правильно ли Иона гневается
  alternative: «Хорошо ли ты делаешь, что гневаешься?»
  rationale: Вопрос касается оправданности гнева. Выбранный вариант ясно сохраняет Божье нравственное обличение и параллелизм с самоуверенным ответом Ионы.
- issue: Определение קִיקָיוֹן
  choice: Использовать общее слово «растение»
  alternative: «тыква», «лиана», «клещевина» или транслитерация «кикайон»
  rationale: Ботанический вид неясен, поэтому конкретизация создала бы ложную точность. Возможные традиционные определения вынесены в примечание.
translation_notes:
  register: Современный литературный русский язык с лаконичным, dignified повествовательным строем. Повтор «правильно… гневаешься / правильно… гневаюсь» сохраняет риторическое зеркало оригинала; тире перед «до смерти» подчёркивает предельность ответа, не устраняя смысловой неоднозначности.
