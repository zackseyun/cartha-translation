  text: וַ/יְמַ֣ן יְהוָֽה אֱ֠לֹהִים קִיקָי֞וֹן וַ/יַּ֣עַל מֵ/עַ֣ל לְ/יוֹנָ֗ה לִֽ/הְי֥וֹת צֵל֙ עַל רֹאשׁ֔/וֹ לְ/הַצִּ֥יל ל֖/וֹ מֵ/רָֽעָת֑/וֹ וַ/יִּשְׂמַ֥ח יוֹנָ֛ה עַל הַ/קִּֽיקָי֖וֹן שִׂמְחָ֥ה גְדוֹלָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/006.yaml
  text: And Yahweh God appointed a qiqayon plant[a], and it grew up over Jonah to be a shade over his head, to deliver him from his discomfort. And Jonah rejoiced over the qiqayon plant with great joy.
translation:
  language: ru
  text: И Яхве Бог назначил растение кикайон[a], и оно выросло над Ионой, чтобы быть тенью над его головой и избавить его от беды[b]. Иона очень обрадовался этому кикайону.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Евр. кикайон — растение, точный вид которого неизвестен; его традиционно называли тыквой или вьющимся растением, а иногда отождествляют с клещевиной.
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать страдание, несчастье или зло; здесь речь, вероятно, идёт о тягостном состоянии Ионы.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וַיְמַן
  choice: предназначил
  rationale: 'Глагол מנה в книге Ионы обозначает целенаправленное Божье назначение или определение: так же назначаются рыба, червь и восточный ветер. «Предназначил» передаёт намеренность действия, не уточняя способ появления растения.'
- source_word: יְהוָה אֱלֹהִים
  choice: Яхве Бог
  rationale: Личное имя יהוה передано как «Яхве», а сочетание с אֱלֹהִים сохранено без перестройки.
- source_word: קִיקָיוֹן
  choice: растение кикайон
  rationale: Точная ботаническая идентификация слова неизвестна. Транслитерация сохраняет особое древнееврейское название, а родовое слово «растение» делает фразу понятной.
- source_word: וַיַּעַל מֵעַל לְיוֹנָה
  choice: оно выросло над Ионой
  rationale: В контексте растения עלה естественно передаётся как «выросло»; «над Ионой» выражает его положение и связь с последующей тенью.
- source_word: לִהְיוֹת צֵל עַל רֹאשׁוֹ
  choice: чтобы давать тень его голове
  rationale: Функциональная русская формулировка естественно передаёт цель растения — быть тенью над головой Ионы.
- source_word: לְהַצִּיל לוֹ מֵרָעָתוֹ
  choice: избавить его от беды
  rationale: הציל передано сильным глаголом «избавить», а многозначное רעה — широким словом «беда», чтобы не сводить смысл исключительно к физическому неудобству или нравственному злу.
- source_word: וַיִּשְׂמַח ... שִׂמְחָה גְדוֹלָה
  choice: очень обрадовался
  rationale: Древнееврейский усилительный оборот с однокоренными словами передан естественным современным русским усилением «очень обрадовался».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В тексте стоит личное имя Бога, поэтому транслитерация сохраняет его как имя и не заменяет титулом.
- issue: Смысл רָעָתוֹ
  choice: его беда
  alternative: его мучение; его неудобство; его зло
  rationale: Слово רעה допускает значения беды, страдания, зла или тягостного состояния. Контекст тени указывает на испытываемое Ионой бедствие, однако широкий перевод не устраняет возможную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся простым и повествовательным; редкое название растения пояснено в сноске, а древнееврейский усилительный оборот передан естественно, без архаизма «возрадовался великой радостью».
