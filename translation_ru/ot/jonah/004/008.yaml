source:
  edition: WLC
  text: וַ/יְהִ֣י כִּ/זְרֹ֣חַ הַ/שֶּׁ֗מֶשׁ וַ/יְמַ֨ן אֱלֹהִ֜ים ר֤וּחַ קָדִים֙ חֲרִישִׁ֔ית וַ/תַּ֥ךְ הַ/שֶּׁ֛מֶשׁ עַל רֹ֥אשׁ יוֹנָ֖ה וַ/יִּתְעַלָּ֑ף וַ/יִּשְׁאַ֤ל אֶת נַפְשׁ/וֹ֙ לָ/מ֔וּת וַ/יֹּ֕אמֶר ט֥וֹב מוֹתִ֖/י מֵ/חַיָּֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/008.yaml
  text: When the sun rose[a], God appointed a scorching east wind, and the sun beat down on Jonah’s head so that he grew faint. And he asked that he might die, and said[b], “My death is better than my life.”
translation:
  language: ru
  text: 'Когда взошло солнце, Бог послал знойный[a] восточный ветер. Солнце палило голову Ионы, так что он изнемог. Тогда он попросил себе смерти и сказал: «Лучше мне умереть, чем жить».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы редкого и трудного еврейского слова: «знойный», «иссушающий», «сильный» или «тихий». Здесь выбран вариант «знойный», поскольку контекст подчёркивает изнуряющий жар.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Моя смерть лучше моей жизни».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: Когда взошло солнце
  rationale: Сочетание וַיְהִי с כִּ и инфинитивом обозначает время последующего события. Такой перевод естественно передаёт временную связь без избыточного повествовательного оборота «и было».
- source_word: וַיְמַן
  choice: послал
  rationale: В книге Ионы глагол обозначает целенаправленное Божье распоряжение средствами творения. «Послал» ясно выражает здесь намеренное действие Бога и естественно сочетается с ветром; более буквальное «назначил» по-русски звучит неестественно.
- source_word: רוּחַ קָדִים
  choice: восточный ветер
  rationale: Выражение обозначает ветер, дующий с востока; это обычная и ясная русская формулировка.
- source_word: חֲרִישִׁית
  choice: знойный
  rationale: Редкое и трудное прилагательное допускает разные толкования. В контексте палящего солнца и изнеможения Ионы «знойный» естественно передаёт угнетающий жар, не усиливая текст до значения «обжигающий».
- source_word: וַתַּךְ הַשֶּׁמֶשׁ עַל רֹאשׁ יוֹנָה
  choice: Солнце палило голову Ионы
  rationale: Глагол נכה сохраняет образ поражающего воздействия. «Палило голову» по-русски живо и естественно описывает сильный солнечный жар.
- source_word: וַיִּתְעַלָּף
  choice: он изнемог
  rationale: Форма описывает наступившее состояние слабости или обморочного изнеможения. «Изнемог» не утверждает полной потери сознания.
- source_word: וַיִּשְׁאַל אֶת נַפְשׁוֹ לָמוּת
  choice: он попросил себе смерти
  rationale: Еврейская идиома выражает просьбу о собственной смерти. Формулировка сохраняет именно просьбу, не добавляя прямо не названного адресата.
- source_word: טוֹב מוֹתִי מֵחַיָּי
  choice: Лучше мне умереть, чем жить
  rationale: Естественная русская сравнительная конструкция сохраняет краткость и резкое противопоставление смерти и жизни; буквальное именное построение приведено в примечании.
theological_decisions:
- issue: Божественное действие в וַיְמַן אֱלֹהִים
  choice: Бог послал
  alternative: Бог назначил / приготовил
  rationale: Текст изображает Бога намеренно направляющим природное явление. «Послал» сохраняет активную божественную причинность, не внося дополнительных доктринальных утверждений.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным строем. Сохранены краткость речи Ионы, активная роль Бога и неопределённость редкого прилагательного חֲרִישִׁית; архаизмы и конфессионально окрашенные формулы не использованы.
