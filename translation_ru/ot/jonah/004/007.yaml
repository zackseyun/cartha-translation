base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/007.yaml
  text: But God appointed a worm at the rising of dawn the next day[a], and it struck the plant so that it withered.
translation:
  language: ru
  text: Но на рассвете следующего дня Бог назначил червя, и тот поразил растение[a], так что оно засохло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Возможно, «клещевину». Еврейское слово «кикайон» обозначает определённое растение, однако его точный вид неизвестен.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַן
  choice: назначил
  rationale: Передаёт намеренное Божье определение действующего средства и сохраняет повторяющийся в книге мотив того, что Бог назначает различные силы и обстоятельства.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Прямо соответствует אֱלֹהִים; в данном стихе употреблено не личное имя YHWH.
- source_word: תּוֹלַעַת
  choice: червя
  rationale: Общее обозначение червеобразного существа; более точный вид по контексту определить нельзя.
- source_word: בַּעֲלוֹת הַשַּׁחַר לַמָּחֳרָת
  choice: на рассвете следующего дня
  rationale: Естественно передаёт буквальный временной оборот «при восхождении зари на следующий день».
- source_word: וַתַּךְ
  choice: поразил
  rationale: Сохраняет основное значение глагола נכה — «ударить, поразить», не уточняя способ повреждения растения.
- source_word: הַקִּיקָיוֹן
  choice: растение
  rationale: Точный ботанический вид קִיקָיוֹן не установлен; общее обозначение избегает ложной точности, а возможная идентификация вынесена в сноску.
- source_word: וַיִּיבָשׁ
  choice: и оно засохло
  rationale: Точно передаёт значение «высохнуть, увянуть» и сохраняет еврейское последовательное соединение событий.
theological_decisions:
- issue: Божественное действие в обстоятельствах Ионы
  choice: Бог намеренно назначил червя
  alternative: Бог лишь допустил появление червя
  rationale: Глагол וימן обозначает активное Божье назначение и соответствует повторяющемуся в повествовании мотиву назначенных Богом растения, червя и ветра; перевод не ослабляет это действие до простого дозволения.
translation_notes:
  register: Современный литературный русский язык с умеренно формальной, повествовательной интонацией. Необычное, но ясное «назначил червя» сохранено ради ключевого мотива Божьего намеренного распоряжения. Синтаксис близок к еврейской последовательности, а местоимения «тот» и «оно» устраняют неясность русских референтов.
