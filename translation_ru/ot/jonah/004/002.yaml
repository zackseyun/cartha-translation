  text: וַ/יִּתְפַּלֵּ֨ל אֶל יְהוָ֜ה וַ/יֹּאמַ֗ר אָנָּ֤ה יְהוָה֙ הֲ/לוֹא זֶ֣ה דְבָרִ֗/י עַד הֱיוֹתִ/י֙ עַל אַדְמָתִ֔/י עַל כֵּ֥ן קִדַּ֖מְתִּי לִ/בְרֹ֣חַ תַּרְשִׁ֑ישָׁ/ה כִּ֣י יָדַ֗עְתִּי כִּ֤י אַתָּה֙ אֵֽל חַנּ֣וּן וְ/רַח֔וּם אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/004/002.yaml
  text: And he prayed to Yahweh and said[a], “Please, Yahweh, was this not what I said while I was still in my own land? That is why I acted first to flee to Tarshish, because I knew that you are a gracious and compassionate God, slow to anger and abundant in steadfast love[c][b], and relenting concerning the disaster.”
translation:
  language: ru
  text: 'И помолился он Яхве и сказал: «Прошу, Яхве, не это ли я говорил, когда ещё был в своей земле? Вот почему я заранее бежал в Фарсис[a]: ведь я знал, что Ты — Бог милостивый и сострадательный[b], долготерпеливый, исполненный неизменной любви и отменяющий бедствие[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поспешил бежать в Фарсис»; «предупредил это бегством в Фарсис». Еврейский глагол указывает на упреждающее действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «милосердный». Эти слова перекликаются с Исходом 34:6.'
    reason: cross_reference
  - marker: c
    text: 'Или: «отказывающийся наводить бедствие». Буквально: «сожалеющий о зле»; здесь «зло» означает грозящее бедствие или суд, а не нравственное зло в Боге.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: помолился
  rationale: Порода хитпаэль глагола פלל обычно означает молитву, даже когда сама речь имеет характер жалобы.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
- source_word: אָנָּה
  choice: О
  rationale: В данном эмоциональном обращении естественно передаёт частицу настоятельной просьбы или восклицания; более буквальное «прошу» также возможно.
- source_word: הֲלוֹא זֶה דְבָרִי
  choice: Не это ли я говорил
  rationale: Сохраняет риторический вопрос, ожидающий утвердительного ответа, и естественно передаёт דְבָרִי в контексте.
- source_word: עַד הֱיוֹתִי עַל אַדְמָתִי
  choice: ещё будучи в своей земле
  rationale: Передаёт временной смысл и указание на родную землю Ионы без лишнего уточнения.
- source_word: עַל כֵּן קִדַּמְתִּי לִבְרֹחַ
  choice: Потому я и поспешил бежать
  rationale: עַל כֵּן выражает причину, а קדם здесь указывает на заблаговременное, упреждающее действие; «поспешил» естественно по-русски, а альтернативы отражены в сноске.
- source_word: חַנּוּן וְרַחוּם
  choice: милостивый и сострадательный
  rationale: Сохраняет два близких, но различимых свойства Бога и перекличку с Исх. 34:6.
- source_word: אֶרֶךְ אַפַּיִם
  choice: долготерпеливый
  rationale: Устоявшийся и понятный русский эквивалент еврейской идиомы «долгий гневом», обозначающей медленность на гнев.
- source_word: וְרַב חֶסֶד
  choice: исполненный неизменной любви
  rationale: Передаёт изобилие חֶסֶד и его оттенок постоянной, верной любви, не сводя многозначное слово только к милости.
- source_word: וְנִחָם עַל הָרָעָה
  choice: отменяющий бедствие
  rationale: В контексте רָעָה означает грозящее бедствие, а נחם — отказ от осуществления объявленного суда; формулировка не приписывает Богу нравственного зла.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; транслитерация сохраняет личное имя Бога.
- issue: Характер Божьего חֶסֶד
  choice: неизменная любовь
  alternative: великая милость; верная любовь
  rationale: Выбор сохраняет идею постоянства и преданности, не вводя узкого конфессионального толкования.
- issue: Антропопатическое וְנִחָם עַל הָרָעָה
  choice: отменяющий бедствие
  alternative: отказывающийся от бедствия; сожалеющий о бедствии
  rationale: Фраза передаёт реальное напряжение между объявленным судом и Божьим отказом привести его в исполнение, но не подразумевает нравственного зла в Боге.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан естественным для широкого читателя; сохранены риторический вопрос, эмоциональность жалобы Ионы, личное имя Яхве и богословское напряжение заключительной формулы. Все маркеры сносок присутствуют в основном тексте.
