base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/006.yaml
  text: Waters closed in around me to my very life[a]; the deep surrounded me[b]; seaweed was wrapped around my head.
translation:
  language: ru
  text: Воды обступили меня, угрожая самой моей жизни[a]; пучина окружила меня; водоросли[b] обвились вокруг моей головы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до души», то есть до самой жизни или до самого моего существа.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «камыш», «тростник»; в контексте погружения Ионы в море вероятнее имеются в виду водоросли.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲפָפוּנִי
  choice: обступили меня
  rationale: Глагол передаёт окружение со всех сторон и несёт оттенок угрозы; «обступили» естественно и выразительно передаёт этот образ.
- source_word: מַיִם
  choice: воды
  rationale: Множественное число сохраняет поэтический образ угрожающих морских вод.
- source_word: עַד נֶפֶשׁ
  choice: угрожая самой моей жизни
  rationale: נֶפֶשׁ здесь означает жизнь или самого человека, а не отвлечённую нематериальную «душу»; перевод передаёт крайнюю смертельную опасность, не конкретизируя её как воду «до шеи».
- source_word: תְּהוֹם
  choice: пучина
  rationale: В контексте моря слово обозначает глубокие, бездонные воды; «пучина» сохраняет водную и поэтическую образность без лишнего богословского оттенка слова «бездна».
- source_word: יְסֹבְבֵנִי
  choice: окружила меня
  rationale: Прямо передаёт значение окружения и сохраняет параллелизм с первой строкой.
- source_word: סוּף
  choice: водоросли
  rationale: Слово может обозначать тростник или камыш, однако в сцене погружения в море наиболее естественны водоросли.
- source_word: חָבוּשׁ לְרֹאשִׁי
  choice: обвились вокруг моей головы
  rationale: Пассивный образ чего-либо обвязанного или обёрнутого вокруг головы передан естественной русской конструкцией; множественное согласование обусловлено словом «водоросли».
