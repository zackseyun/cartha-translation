lexical_decisions:
- source_word: וַיְמַן
  choice: назначил
  rationale: Глагол מנה здесь выражает целенаправленное Божье распоряжение. «Назначил» сохраняет идею властного определения роли, не сводя её лишь к приготовлению или предоставлению.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаётся личное имя Бога, непосредственно стоящее в еврейском тексте, а не заменяющий его титул.
- source_word: דָּג גָּדוֹל
  choice: большую рыбу
  rationale: דָּג — обычное обозначение рыбы, а גָּדוֹל указывает на её величину. Перевод не уточняет вид животного сверх сказанного в оригинале.
- source_word: לִבְלֹעַ
  choice: чтобы она проглотила
  rationale: Инфинитив цели передан естественной русской придаточной конструкцией; глагол прямо означает «проглотить».
- source_word: בִּמְעֵי הַדָּג
  choice: во чреве рыбы
  rationale: מֵעֶה обозначает внутренности, утробу или чрево. «Во чреве» точно и уместно в литературно-библейском регистре, не приобретая излишне анатомического оттенка.
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: три дня и три ночи
  rationale: Временная формула передана буквально, без истолкования способа счёта времени.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит тетраграмматон, поэтому сохранено личное имя Бога, а не подставлен титул.
- issue: Определение морского существа
  choice: большая рыба
  alternative: кит
  rationale: Оригинал говорит о рыбе и не определяет её как кита; более конкретное обозначение было бы привнесением традиционного толкования.
- issue: Выражение «три дня и три ночи»
  choice: сохранить дословную временную формулу
  alternative: части трёх суток; около трёх дней
  rationale: Перевод сохраняет формулировку и связанную с ней герменевтическую напряжённость, не разрешая вопрос о включительном счёте внутри самого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Инверсия «пробыл Иона» поддерживает повествовательную торжественность, оставаясь понятной; «во чреве» точно передаёт образ оригинала.
