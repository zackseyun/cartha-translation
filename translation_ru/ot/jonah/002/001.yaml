  yaml_path: translation/ot/jonah/002/001.yaml
  text: And Yahweh appointed a great fish to swallow Jonah[d][c][b][a], and Jonah was in the belly of the fish three days and three nights.
translation:
  language: ru
  text: И Яхве предназначил большую рыбу[a], чтобы та проглотила Иону[b], и Иона пробыл в брюхе рыбы[c] три дня и три ночи[d].
  philosophy: optimal-equivalence
  footnotes:
