    text: 'Или: «приготовил» или «предоставил» большую рыбу.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте сказано «большую рыбу», а не конкретно «кита».
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «во внутренних частях рыбы»; «в брюхе рыбы» — идиоматическая передача.'
    reason: lexical_alternative
  - marker: d
    text: Выражение «три дня и три ночи» передано как в еврейском тексте, без разрешения вопроса о включительном счёте времени.
