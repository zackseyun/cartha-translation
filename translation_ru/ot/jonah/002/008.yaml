base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/008.yaml
  text: When my life was fainting away within me[a], I remembered Yahweh, and my prayer came to you[b], into your holy temple.
translation:
  language: ru
  text: Когда жизнь во мне угасала[a], я вспомнил Яхве, и моя молитва дошла до Тебя — в Твой святой храм[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Когда душа моя изнемогала во мне». Еврейское нефеш может означать «жизнь», «душа» или самого человека — в зависимости от контекста.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское слово может также означать «святой дворец» или «святилище». Здесь «храм» соответствует контексту молитвы; текст не уточняет, имеется ли в виду земной храм или небесное жилище Бога.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּהִתְעַטֵּף עָלַי נַפְשִׁי
  choice: Когда жизнь во мне угасала
  rationale: Оборот с בְּ и инфинитивом образует временную придаточную конструкцию. В контексте смертельной опасности נֶפֶשׁ естественно передаётся как «жизнь», а идиома עָלַי נַפְשִׁי описывает внутреннее изнеможение. «Угасала» сохраняет постепенность ослабления.
- source_word: אֶת־יְהוָה
  choice: Яхве
  rationale: Передано собственное имя Бога, обозначенное тетраграмматоном, без замены титулом.
- source_word: זָכָרְתִּי
  choice: я вспомнил
  rationale: Прямая передача формы Qal; смысл не расширен до «воззвал», поскольку молитва названа в следующей части стиха.
- source_word: וַתָּבוֹא אֵלֶיךָ תְּפִלָּתִי
  choice: и молитва моя дошла до Тебя
  rationale: בוא буквально означает движение или прибытие; русское «дошла до Тебя» естественно выражает, что молитва достигла Бога.
- source_word: אֶל־הֵיכַל קָדְשֶׁךָ
  choice: вошла в Твой святой храм
  rationale: 'Повтор глагола «вошла» после тире делает явной пространственную образность: молитва приходит к Богу и входит в Его святой храм. הֵיכָל допускает значения дворца и храма; контекст молитвы поддерживает «храм».'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет личное имя Бога; транслитерация «Яхве» сохраняет различие между именем и титулом.
- issue: Антропологический оттенок נַפְשִׁי
  choice: жизнь во мне
  alternative: душа моя; я сам
  rationale: В контексте близости к смерти слово обозначает угасающую жизнь, однако примечание сохраняет возможную передачу «душа», не навязывая узкой антропологической трактовки.
- issue: Местонахождение святого храма
  choice: не уточнять, земной это храм или небесное святилище
  alternative: явно указать Иерусалимский храм или небесный храм
  rationale: Сам стих этого не определяет; формулировка сохраняет богословскую и образную открытость оригинала.
translation_notes:
  register: Современный литературный русский язык с молитвенной торжественностью. Инверсия «молитва моя» поддерживает поэтический регистр, не делая текст архаичным. Местоимения, обращённые к Богу, написаны с прописной буквы как русская благоговейная издательская норма.
