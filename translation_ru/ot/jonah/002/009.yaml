  text: מְשַׁמְּרִ֖ים הַבְלֵי שָׁ֑וְא חַסְדָּ֖/ם יַעֲזֹֽבוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/009.yaml
  text: Those who cling to worthless idols forsake their own mercy[a].
translation:
  language: ru
  text: Те, кто держится за ничтожных идолов, оставляют свою верность[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою милость» или «свою неизменную любовь». Возможно, речь о милости и неизменной любви Бога, доступных им, которых они лишаются.'
    reason: Еврейское חַסְדָּם может обозначать верность, милость или неизменную любовь; связь притяжательного суффикса с Богом и идолопоклонниками допускает более одного понимания.
lexical_decisions:
- source_word: מְשַׁמְּרִים
  choice: держится
  rationale: Глагол שמר обычно означает «хранить, соблюдать, беречь», но в сочетании с обозначением идолов выражает постоянную преданность им; «держится» естественно передаёт эту привязанность, не усиливая её до поклонения.
- source_word: הַבְלֵי שָׁוְא
  choice: ничтожных идолов
  rationale: Сочетание הבל («пустота, тщета, ничтожность») и שוא («ложь, суета, бесполезность») в пророческой речи обозначает ложных и бессильных богов. Слово «идолы» ясно передаёт подразумеваемый предмет, а «ничтожных» — их пустоту и бесполезность.
- source_word: חַסְדָּם
  choice: своей милости
  rationale: חסד может означать милость, неизменную любовь или верность в отношениях; суффикс прямо означает «их». Формулировка «своей милости» сохраняет краткость и неоднозначность еврейского текста, а примечание поясняет основные возможные смыслы.
- source_word: יַעֲזֹבוּ
  choice: отказываются от
  rationale: עזב означает «оставлять, покидать, отвергать». В современном русском «отказываются от» естественно выражает сознательный отказ и подходит как к Божьей милости, так и к собственной верности.
theological_decisions:
- issue: К кому относится и что означает חַסְדָּם
  choice: Основной текст сохраняет буквальную и неоднозначную формулу «своей милости».
  alternative: Речь может идти либо о Божьей неизменной любви и милости, доступной этим людям, либо об их собственной верности Богу, от которой они отступают.
  rationale: Значение חסד охватывает милость, преданную любовь и верность, а притяжательный суффикс допускает разные смысловые отношения. Контекст не требует однозначно выбирать только одно понимание.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формулировка. Оборот «держится за» понятен широкому читателю, а необычность выражения «своей милости» оправдана необходимостью сохранить неоднозначность оригинала и разъяснена в сноске.
