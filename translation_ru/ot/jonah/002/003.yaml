base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/003.yaml
  text: And he said[a], “I called to Yahweh out of my distress, and he answered me. From the belly of Sheol I cried out[b]; you heard my voice.”
translation:
  language: ru
  text: 'Он сказал: «В своей беде я воззвал к Яхве, и он ответил мне. Из чрева[a] Шеола[b] я взывал о помощи — ты услышал мой голос».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из утробы»; древнееврейское слово может означать как чрево, так и утробу.'
    reason: lexical_alternative
  - marker: b
    text: 'Шеол — древнееврейское обозначение мира мёртвых; более истолковательный вариант: «могила».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал он
  rationale: Сохранена обычная повествовательная связка wayyiqtol и введение молитвенной речи без добавления более точной временной последовательности.
- source_word: קָרָאתִי מִצָּרָה לִי
  choice: В беде своей я воззвал
  rationale: צָרָה обозначает беду или тяжёлое положение; русское «в беде своей» естественно передаёт обстоятельство, из которого исходит призыв, а «воззвал» сохраняет молитвенный и поэтический регистр קרא.
- source_word: אֶל יְהוָה
  choice: к Яхве
  rationale: Предлог אֶל передан направлением обращения, а личное имя יהוה — формой «Яхве».
- source_word: וַיַּעֲנֵנִי
  choice: и Он ответил мне
  rationale: Глагол ענה в контексте молитвы означает ответ; местоименный суффикс явно передан словом «мне».
- source_word: מִבֶּטֶן שְׁאוֹל
  choice: Из чрева шеола
  rationale: «Чрево» сохраняет телесную поэтическую метафору בטן и её созвучие пребыванию Ионы внутри рыбы; «шеол» оставлен транслитерацией, чтобы не сужать значение до могилы или ада.
- source_word: שִׁוַּעְתִּי
  choice: я взывал о помощи
  rationale: Глагол שׁוע выражает настойчивый зов о помощи; формулировка отличает его от предшествующего קרא и не утрачивает семантику просьбы о спасении.
- source_word: שָׁמַעְתָּ קוֹלִי
  choice: Ты услышал мой голос
  rationale: Дословно сохранены переход ко второму лицу и выражение «мой голос», важные для поэтического обращения к Богу.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; «Яхве» передаёт личное имя и не заменяет его титулом.
- issue: Передача שְׁאוֹל
  choice: шеол
  alternative: царство мёртвых; могила; ад
  rationale: Транслитерация сохраняет широту и неоднозначность древнееврейского понятия и не отождествляет его автоматически ни с отдельной могилой, ни с позднейшим представлением об аде.
- issue: Смена грамматического лица
  choice: «Он ответил мне» — «Ты услышал мой голос»
  alternative: Унифицировать всё в третьем или втором лице
  rationale: Резкий переход от рассказа о Боге к прямому обращению к Нему присутствует в древнееврейском тексте и сохранён как элемент молитвенной поэзии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным поэтическим регистром. Формы «воззвал», «чрево» и «взывал» уместны для молитвенной песни, но остаются понятными; прописные «Он» и «Ты» подчёркивают обращение к Богу без изменения содержания.
