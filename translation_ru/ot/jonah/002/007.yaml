source:
  edition: WLC
  text: לְ/קִצְבֵ֤י הָרִים֙ יָרַ֔דְתִּי הָ/אָ֛רֶץ בְּרִחֶ֥י/הָ בַעֲדִ֖/י לְ/עוֹלָ֑ם וַ/תַּ֧עַל מִ/שַּׁ֛חַת חַיַּ֖/י יְהוָ֥ה אֱלֹהָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/007.yaml
  text: I went down to the roots of the mountains[a]; the earth with its bars was around me forever, but you brought up my life from the pit[c][b], O Yahweh my God.
translation:
  language: ru
  text: К основаниям гор я сошёл[a]; земля замкнула меня своими засовами навеки[b]. Но Ты поднял мою жизнь из ямы[c], Яхве, Бог мой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к крайним пределам гор»; возможно также: «к подножиям гор».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «земля — её засовы сомкнулись за мной навеки». Еврейский образ представляет землю как темницу; её засовы удерживают говорящего взаперти.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «из могилы» или «из гибели».'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְקִצְבֵי הָרִים
  choice: к основаниям гор
  rationale: קֶצֶב обозначает край, предел или основание. В контексте нисхождения речь идёт о самых нижних пределах гор; «основания» естественно передаёт образ, не превращая его в более свободную метафору «корней».
- source_word: יָרַדְתִּי
  choice: я сошёл
  rationale: Форма Qal perfect 1-го лица ед. числа от ירד выражает движение вниз. «Сошёл» сохраняет поэтическую сжатость и направление движения.
- source_word: הָאָרֶץ
  choice: земля
  rationale: Здесь אֶרֶץ участвует в космическом образе нисхождения к смерти; буквальное «земля» сохраняет эту многозначность лучше, чем «страна» или явное «подземный мир».
- source_word: בְּרִחֶיהָ בַעֲדִי
  choice: своими засовами окружила меня
  rationale: בְּרִיחַ — засов или запор, а בַעֲדִי передаёт ограждение либо положение позади говорящего. Русская формулировка сохраняет образ заключения, при этом альтернативный синтаксический образ указан в сноске.
- source_word: לְעוֹלָם
  choice: навеки
  rationale: Слово выражает неопределённо долгую продолжительность и здесь — переживание окончательности смерти. «Навеки» сохраняет силу поэтического высказывания, не превращая его в отдельное догматическое утверждение.
- source_word: וַתַּעַל
  choice: Ты поднял
  rationale: Hiphil от עלה означает «заставить подняться, вывести наверх». «Ты поднял» прямо передаёт спасительное действие Бога и противопоставлено нисхождению говорящего.
- source_word: מִשַּׁחַת
  choice: из ямы
  rationale: שַׁחַת может обозначать яму, могилу или погибель. «Яма» сохраняет конкретный пространственный образ и не устраняет подразумеваемую близость смерти.
- source_word: חַיַּי
  choice: мою жизнь
  rationale: Буквальное значение формы с суффиксом — «моя жизнь». Оно сохраняет еврейское выражение и акцент на избавлении жизни от смерти.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом; русская форма «Яхве» является общеупотребительной научной транслитерацией.
- source_word: אֱלֹהָי
  choice: Бог мой
  rationale: Сохранены притяжательная форма и поэтический порядок слов в непосредственном обращении.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон как личное имя. «Яхве» сохраняет имя и не подменяет его титулом.
- issue: Смысл לְעוֹלָם в молитве о смертельной опасности
  choice: навеки
  alternative: надолго; навсегда
  rationale: Выражение передаёт ощущаемую говорящим окончательность смерти. Оно сохранено без пояснительного ограничения, чтобы не снимать поэтическое и богословское напряжение.
- issue: Образ שַׁחַת
  choice: яма
  alternative: могила; погибель
  rationale: Конкретный образ ямы согласуется с движением вниз и вверх, одновременно оставляя открытыми ассоциации со смертью и уничтожением.
translation_notes:
  register: Современный литературный русский с поэтической сжатостью. Инверсия «Бог мой» сохраняет торжественный характер обращения, не делая весь стих архаичным. Заглавное «Ты» употреблено как традиционная русская форма благоговейного обращения к Богу.
