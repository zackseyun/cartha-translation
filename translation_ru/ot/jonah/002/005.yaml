  text: וַ/אֲנִ֣י אָמַ֔רְתִּי נִגְרַ֖שְׁתִּי מִ/נֶּ֣גֶד עֵינֶ֑י/ךָ אַ֚ךְ אוֹסִ֣יף לְ/הַבִּ֔יט אֶל הֵיכַ֖ל קָדְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/005.yaml
  text: And I said[a], ‘I have been driven out from before your eyes; yet I will again look toward your holy temple.’
translation:
  language: ru
  text: 'А я сказал: «Я был изгнан из-пред Твоих очей[a], но всё же снова буду взирать на Твой святой храм».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из поля Твоего зрения»; возможно также: «из Твоего присутствия».'
    reason: 'Лексико-смысловая альтернатива: древнееврейское выражение буквально означает удаление «из перед Твоих глаз», но в контексте может подразумевать удаление от Божьего присутствия или благоволения.'
lexical_decisions:
- source_word: וַאֲנִי אָמַרְתִּי
  choice: А я сказал
  rationale: Сочетание союза с местоимением подчёркивает говорящего и продолжает повествование. «А я» естественно передаёт этот переход, не усиливая противопоставление; אָמַרְתִּי сохраняется как «сказал», хотя в поэтической молитве возможен оттенок внутренней речи.
- source_word: נִגְרַשְׁתִּי
  choice: Я изгнан прочь
  rationale: Форма нифаля от גרש выражает пассивное удаление или изгнание. «Изгнан прочь» сохраняет силу образа, не добавляя специального юридического или ссыльного смысла.
- source_word: מִנֶּגֶד עֵינֶיךָ
  choice: от Твоих очей
  rationale: Передан конкретный древнееврейский образ нахождения перед Божьими глазами. Слово «очи» уместно в возвышенной молитвенной поэзии и позволяет избежать истолковывающего пересказа «из Твоего присутствия».
- source_word: אַךְ
  choice: но всё же
  rationale: Частица обозначает решительный поворот от ощущения отверженности к надежде.
- source_word: אוֹסִיף לְהַבִּיט
  choice: снова буду взирать
  rationale: Конструкция с יסף допускает значения повторения и продолжения. Здесь «снова» естественно выражает надежду на возобновление обращения к храму; «взирать» передаёт направленный, сосредоточенный взгляд и соответствует поэтическому регистру.
- source_word: אֶל הֵיכַל קָדְשֶׁךָ
  choice: на Твой святой храм
  rationale: הֵיכָל применительно к Богу естественно означает «храм», а сочетание с קָדְשֶׁךָ по-русски передаётся определением «Твой святой».
theological_decisions:
- issue: Следует ли понимать удаление пространственно — из поля Божьего зрения — или богословски — из Божьего присутствия
  choice: от Твоих очей
  alternative: из Твоего присутствия; с глаз Твоих
  rationale: Основной текст сохраняет конкретную и намеренно ёмкую метафору оригинала. Возможный смысл утраты Божьего присутствия или благоволения отмечен в сноске, но не подменяет исходный образ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической окраской. Формы «очи» и «взирать» сохраняют образность молитвы, оставаясь понятными современному читателю; местоимения, относящиеся к Богу, даны с прописной буквы в соответствии с принятым русским библейским стилем.
