  text: וַ/תַּשְׁלִיכֵ֤/נִי מְצוּלָה֙ בִּ/לְבַ֣ב יַמִּ֔ים וְ/נָהָ֖ר יְסֹבְבֵ֑/נִי כָּל מִשְׁבָּרֶ֥י/ךָ וְ/גַלֶּ֖י/ךָ עָלַ֥/י עָבָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/004.yaml
  text: You cast me into the deep[a], into the heart of the seas, and the current surrounded me; all your breakers and your waves passed over me.
translation:
  language: ru
  text: Ты бросил меня в пучину, в самое сердце морей; течение окружило меня[a], все Твои валы и волны прошли надо мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «река окружила меня». נָהָר чаще означает «река», но здесь, в морском поэтическом контексте, вероятно, имеется в виду течение или водный поток.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלִיכֵנִי
  choice: Ты бросил меня
  rationale: Глагол שלך означает «бросать, кидать». Форма второго лица единственного числа сохраняет прямое обращение к Богу и естественно звучит по-русски.
- source_word: מְצוּלָה
  choice: в пучину
  rationale: Слово обозначает морскую глубину, бездну. «Пучина» кратко и образно передаёт погружение в глубокие воды, соответствуя поэтическому регистру молитвы.
- source_word: בִּלְבַב יַמִּים
  choice: в самое сердце морей
  rationale: Сохранена древнееврейская метафора «сердце морей» и множественное число יַמִּים. Слово «самое» естественно выражает значение внутренней, срединной области.
- source_word: וְנָהָר
  choice: течение
  rationale: Хотя נָהָר обычно означает «река», в морском контексте оно, вероятно, обозначает поток или течение воды. «Течение» ясно сочетается с последующими образами валов и волн; обычное значение отражено в сноске.
- source_word: יְסֹבְבֵנִי
  choice: окружило меня
  rationale: Форма от סבב означает «окружать, обступать». Выбран ясный и современный русский эквивалент.
- source_word: מִשְׁבָּרֶיךָ
  choice: Твои валы
  rationale: מִשְׁבָּר обозначает разбивающуюся, мощную волну. «Валы» передают силу и массу морской воды и позволяют отличить это слово от следующего גַּלִּים, «волны».
- source_word: וְגַלֶּיךָ
  choice: и волны
  rationale: גַּלִּים прямо обозначает волны. Притяжательное «Твои» относится к обоим однородным существительным, как допускает русская поэтическая речь.
- source_word: עָלַי עָבָרוּ
  choice: прошли надо мной
  rationale: Близкая к форме исходного текста передача образа вод, проходящих поверх погружённого человека, без усиления значения до более толковательного «захлестнули».
theological_decisions:
- issue: Божественное действие в нисхождении Ионы в море
  choice: 'Сохранено прямое обращение к Богу: «Ты бросил меня… Твои валы и волны»'
  alternative: Назвать или подразумевать непосредственными деятелями моряков и тем самым смягчить роль Бога
  rationale: Древнееврейский текст прямо использует форму второго лица мужского рода единственного числа и притяжательные суффиксы второго лица. Перевод сохраняет напряжение между непосредственным действием моряков в повествовании и признанием Ионой верховного действия Бога.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной поэтической лексикой («пучина», «сердце морей»). Синтаксис остаётся ясным, а метафоры и параллелизм исходного текста по возможности сохранены.
