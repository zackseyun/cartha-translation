base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/010.yaml
  text: But as for me[a], with the voice of thanksgiving I will sacrifice to you; what I have vowed I will pay. Salvation belongs to Yahweh.
translation:
  language: ru
  text: А я с благодарственным голосом принесу Тебе жертву; что обещал по обету, то исполню. Спасение принадлежит Яхве.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «Избавление принадлежит Яхве» или «Спасение приходит от Яхве». Еврейское יְשׁוּעָה в данном контексте может означать конкретное избавление, сохраняя и более широкий смысл спасения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: А я
  rationale: Самостоятельное местоимение подчёркивает противопоставление предыдущему стиху; «А я» естественно и ясно передаёт этот контраст по-русски.
- source_word: בְּקוֹל תּוֹדָה
  choice: с благодарением в голосе
  rationale: Сохраняет образ קוֹל («голос, звук») и передаёт תּוֹדָה как слышимое благодарение, сопровождающее жертвоприношение.
- source_word: אֶזְבְּחָה לָּךְ
  choice: принесу Тебе жертву
  rationale: Глагол זבח обозначает принесение жертвы; такая формулировка естественнее русского «буду жертвовать» и сохраняет направленность действия к Богу.
- source_word: אֲשֶׁר נָדַרְתִּי אֲשַׁלֵּמָה
  choice: что обещал, то исполню
  rationale: В контексте обетов נדר означает торжественно обещать, а piel שלם — исполнить или уплатить обет. Русская парная конструкция ясно передаёт связь между обещанием и его исполнением.
- source_word: יְשׁוּעָתָה לַיהוָה
  choice: Спасение — у Яхве
  rationale: יְשׁוּעָה охватывает как конкретное избавление, так и более широкое спасение. Конструкция с ל допускает смысл принадлежности или источника; «у Яхве» кратко сохраняет эту ёмкость без полного сведения к одному оттенку.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Текст прямо употребляет тетраграмматон; форма «Яхве» передаёт личное заветное имя и согласуется с предоставленным консультационным решением.
- issue: Смысл формулы יְשׁוּעָתָה לַיהוָה
  choice: Спасение — у Яхве
  alternative: Избавление принадлежит Яхве; спасение приходит от Яхве
  rationale: Формулировка сохраняет напряжение между принадлежностью спасения Богу и происхождением спасения от Него, а также между непосредственным избавлением Ионы и более широким понятием спасения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Прописная буква в «Тебе» использована как уважительная форма обращения к Богу. Образ голоса сохранён, а формула о спасении оставлена достаточно ёмкой, чтобы не устранять смысловую неоднозначность предлога ל.
