  text: וַ/יֹּ֥אמֶר יְהוָ֖ה לַ/דָּ֑ג וַ/יָּקֵ֥א אֶת יוֹנָ֖ה אֶל הַ/יַּבָּשָֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/011.yaml
  text: Then Yahweh spoke to the fish[a], and it vomited Jonah onto the dry land.
translation:
  language: ru
  text: И сказал Яхве рыбе[a], и она извергла Иону на сушу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обратился к рыбе».'
    reason: Лексическая альтернатива позволяет естественно передать конструкцию אמר ל־, не истолковывая её как явно выраженное повеление.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Прямое значение глагола אמר — «сказать». Такой перевод сохраняет необычный образ обращения к рыбе и не усиливает значение до «повелел», хотя власть Бога подразумевается контекстом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано принятой русской транслитерацией, а не заменено титулом «Господь».
- source_word: לַדָּג
  choice: рыбе
  rationale: В данном стихе דג означает просто «рыба»; определения «большая» здесь нет.
- source_word: וַיָּקֵא
  choice: извергла
  rationale: Глагол קיא обозначает рвоту, извержение из себя. «Извергла» точно передаёт резкость действия и естественно звучит в современном литературном русском.
- source_word: אֶת יוֹנָה
  choice: Иону
  rationale: Иона является определённым прямым дополнением; в русском это выражено винительным падежом.
- source_word: אֶל הַיַּבָּשָׁה
  choice: на сушу
  rationale: יַבָּשָׁה означает сухую землю, особенно в противопоставлении морю; сочетание «на сушу» естественно передаёт направление движения.
- source_word: וַ
  choice: И
  rationale: Начальный повествовательный союз сохраняет связь с предыдущим событием и обычную библейскую последовательность рассказа без лишнего смыслового усиления.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Транслитерация сохраняет личное имя Бога и не заменяет его титулом; форма «Яхве» соответствует современной научной и литературной русской передаче.
- issue: Характер Божьего обращения к рыбе
  choice: сказал
  alternative: повелел
  rationale: Исходный глагол буквально означает «сказал». Контекст допускает понимание как властного повеления, но перевод не должен устранять эту лексическую сдержанность.
translation_notes:
  register: Современный литературный русский с кратким повествовательным строем. Сохранены прямота и телесная резкость еврейского глагола, но без разговорной грубости; необычное «сказал рыбе» намеренно оставлено как особенность исходного текста.
