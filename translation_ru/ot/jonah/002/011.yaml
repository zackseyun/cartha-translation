  source_fidelity: 'Текст точно передаёт все основные элементы еврейского оригинала: повествовательную последовательность, имя Яхве, обращение к рыбе без добавления «повелел», действие קיא с его намеренно резкой телесностью, Иону как прямое дополнение и движение «на сушу». «На сушу» адекватно передаёт אֶל הַיַּבָּשָׁה в данном контексте.'
