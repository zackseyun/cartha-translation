  text: וַ/יִּתְפַּלֵּ֣ל יוֹנָ֔ה אֶל יְהוָ֖ה אֱלֹהָ֑י/ו מִ/מְּעֵ֖י הַ/דָּגָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/002/002.yaml
  text: Then Jonah prayed to Yahweh his God from the belly of the fish[a].
translation:
  language: ru
  text: Тогда Иона помолился Яхве, своему Богу, из чрева рыбы[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из внутренностей рыбы»; «чрево» — естественная в данном контексте передача.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: Тогда … помолился
  rationale: Форма wayyiqtol продолжает последовательность повествования; «тогда» естественно передаёт переход к следующему действию, а возвратная порода глагола פלל здесь означает «молиться».
- source_word: יוֹנָה
  choice: Иона
  rationale: Использована устоявшаяся русская форма библейского личного имени.
- source_word: אֶל
  choice: Яхве (при глаголе «помолился»)
  rationale: Направительный предлог אֶל при глаголе молитвы по-русски естественно передаётся управлением «помолиться кому» без отдельного предлога.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан как личное имя Бога, а не заменён титулом «Господь».
- source_word: אֱלֹהָיו
  choice: своему Богу
  rationale: Суффикс третьего лица мужского рода единственного числа выражает принадлежность; возвратное «своему» естественно соотносит Бога с подлежащим «Иона».
- source_word: מִמְּעֵי
  choice: из чрева
  rationale: מֵעֶה обозначает внутренности, чрево или утробу. В рассказе о проглотившей Иону рыбе «из чрева» кратко и уместно передаёт место, откуда он молился, сохраняя телесный образ исходного текста.
- source_word: הַדָּגָה
  choice: рыбы
  rationale: В этом стихе сказано просто «рыба» с определённым артиклем; определение «большая» из предыдущего контекста не добавлено. Грамматический женский род еврейской формы не несёт здесь отдельного смыслового акцента.
theological_decisions:
- issue: Передача Божьего имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон. Передача «Яхве» сохраняет личное заветное имя и не подменяет его титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Чрево» несколько возвышенно, но понятно и точно сохраняет образ исходного текста; синтаксис остаётся естественным для современного читателя.
