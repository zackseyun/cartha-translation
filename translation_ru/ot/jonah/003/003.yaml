  yaml_path: translation/ot/jonah/003/003.yaml
  text: So Jonah arose and went to Nineveh[a], according to the word of Yahweh. Now Nineveh was an exceedingly great city before God[b], a journey of three days.
translation:
  language: ru
  text: Иона встал и пошёл в Ниневию по слову Яхве. Ниневия же была великим городом перед Богом[a], на три дня пути[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «необычайно великим городом». Буквально: «великий город для Бога/перед Богом»; это выражение может передавать превосходную степень величия.'
    reason: alternative_reading
  - marker: b
    text: 'Также возможно: «трёхдневный путь». Выражение может обозначать время, необходимое, чтобы пройти через город или обойти его, посещая его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: встал
  rationale: Прямо передаёт קום и сохраняет повествовательную перекличку с предыдущим призывом, не сливая этот глагол со следующим действием.
- source_word: וַיֵּלֶךְ
  choice: пошёл
  rationale: Обычное и естественное соответствие הלך; сохраняет последовательность двух еврейских глаголов.
- source_word: כִּדְבַר יְהוָה
  choice: по слову Яхве
  rationale: Кратко и близко к буквальному «согласно слову Яхве»; в контексте выражает исполнение данного повеления.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: עִיר גְּדוֹלָה לֵאלֹהִים
  choice: великим пред Богом городом
  rationale: Сохраняет явное упоминание Бога и необычную конструкцию לֵאלֹהִים, не сводя её безоговорочно к одному лишь усилительному значению.
- source_word: מַהֲלַךְ שְׁלֹשֶׁת יָמִים
  choice: на три дня пути
  rationale: 'Естественно передаёт меру пути, не уточняя того, чего не уточняет еврейский текст: пересечение города, его обход или продолжительность посещения.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит собственное имя; транслитерация сохраняет это различие.
- issue: Значение לֵאלֹהִים в описании Ниневии
  choice: 'сохранить упоминание Бога: «великим пред Богом городом»'
  alternative: «необычайно великим городом»
  rationale: Конструкция может служить усилением, но буквально включает אֱלֹהִים. Основной текст сохраняет богословскую напряжённость, а примечание сообщает возможное суперлативное понимание.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским ритмом. Начальное «И» и парная конструкция «встал… и пошёл» сохраняют еврейскую повествовательную последовательность. Необычное «пред Богом» намеренно удерживает неоднозначность оригинала; она разъяснена в сноске.
