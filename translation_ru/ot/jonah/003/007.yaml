  text: וַ/יַּזְעֵ֗ק וַ/יֹּ֨אמֶר֙ בְּ/נִֽינְוֵ֔ה מִ/טַּ֧עַם הַ/מֶּ֛לֶךְ וּ/גְדֹלָ֖י/ו לֵ/אמֹ֑ר הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה הַ/בָּקָ֣ר וְ/הַ/צֹּ֗אן אַֽל יִטְעֲמוּ֙ מְא֔וּמָה אַ֨ל יִרְע֔וּ וּ/מַ֖יִם אַל יִשְׁתּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/007.yaml
  text: 'And he proclaimed and said in Nineveh[a], by decree of the king and his nobles: “Let neither man nor beast, herd nor flock, taste anything. Let them not graze[b], and let them not drink water.”'
translation:
  language: ru
  text: 'И он велел провозгласить в Ниневии: «По указу царя и его вельмож[a]: пусть ни люди[b], ни животные — ни крупный, ни мелкий скот — ничего не вкушают; пусть скот не пасётся и пусть никто не пьёт воды».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его великих»; имеются в виду знатные или влиятельные люди при царе.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское слово употреблено здесь в единственном числе собирательно: «человек», то есть люди в противопоставлении животным.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק וַיֹּאמֶר
  choice: велел провозгласить
  rationale: Форма от זעק в данном контексте обозначает публичное оглашение царского указа. Русское «велел провозгласить» естественно передаёт каузативную силу глагола; последующее וַיֹּאמֶר выражено введением прямой речи.
- source_word: בְּנִינְוֵה
  choice: в Ниневии
  rationale: Прямое обозначение места, где был оглашён указ.
- source_word: מִטַּעַם
  choice: по указу
  rationale: В административном контексте טַעַם означает официальное постановление или указ.
- source_word: הַמֶּלֶךְ וּגְדֹלָיו
  choice: царя и его вельмож
  rationale: גְדֹלָיו буквально означает «его великие», то есть знатных и влиятельных людей при царе; «вельможи» естественно и достаточно точно передаёт это значение.
- source_word: הָאָדָם
  choice: люди
  rationale: Существительное אָדָם употреблено собирательно и противопоставлено животным; в современном русском «люди» ясно передаёт весь человеческий род в пределах города.
- source_word: וְהַבְּהֵמָה
  choice: животные
  rationale: Общее обозначение животных, за которым следуют более конкретные классы домашнего скота.
- source_word: הַבָּקָר וְהַצֹּאן
  choice: крупный и мелкий скот
  rationale: Устойчивые русские собирательные обозначения двух названных классов домашнего скота без неоправданного сужения до отдельных видов.
- source_word: אַל יִטְעֲמוּ מְאוּמָה
  choice: ничего не вкушают
  rationale: Сохраняется буквальный образ глагола «вкушать, пробовать», подчёркивающий полный пост.
- source_word: אַל יִרְעוּ
  choice: пусть скот не пасётся
  rationale: רעה здесь означает пастись. Явное повторение «скот» устраняет в русском языке неестественное впечатление, будто запрет пастись относится и к людям.
- source_word: וּמַיִם אַל יִשְׁתּוּ
  choice: и никто не пьёт воды
  rationale: Сохраняется прямо названный объект «вода», а «никто» естественно распространяет запрет на всех ранее перечисленных людей и животных.
theological_decisions:
- issue: Собирательное значение הָאָדָם в противопоставлении животным
  choice: люди
  alternative: человек; человеческий род
  rationale: Здесь слово обозначает всех людей как группу. «Люди» в современном русском звучит естественно и не меняет объём запрета; примечание сохраняет формальную особенность еврейского единственного числа.
- issue: Участие животных в общегородском посте
  choice: сохранить прямое включение животных в запрет есть, пастись и пить
  alternative: понимать упоминание животных как гиперболу или символический жест
  rationale: Текст прямо включает животных и не объясняет богословский смысл этого действия, поэтому перевод не должен истолковывать его за автора.
translation_notes:
  register: 'Современный литературный русский с торжественной интонацией публичного указа. Синтаксис слегка перестроен ради ясности: содержание указа введено прямой речью, а субъект глагола «пастись» назван явно, чтобы избежать неестественной двусмысленности в русском.'
