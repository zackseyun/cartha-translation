  text: וַ/יַּ֤רְא הָֽ/אֱלֹהִים֙ אֶֽת מַ֣עֲשֵׂי/הֶ֔ם כִּי שָׁ֖בוּ מִ/דַּרְכָּ֣/ם הָ/רָעָ֑ה וַ/יִּנָּ֣חֶם הָ/אֱלֹהִ֗ים עַל הָ/רָעָ֛ה אֲשֶׁר דִּבֶּ֥ר לַ/עֲשׂוֹת לָ/הֶ֖ם וְ/לֹ֥א עָשָֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/010.yaml
  text: When God saw their deeds[a], that they had turned from their evil way, God relented concerning the disaster that he had spoken to bring on them[b], and he did not do it.
translation:
  language: ru
  text: 'Бог увидел их дела: они отвернулись от своего злого пути. И Бог отказался[a] от бедствия[b], о котором Он сказал, что наведёт его на них, и не сделал этого.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пожалел о бедствии»; «переменил решение относительно бедствия». Еврейский глагол описывает Божий ответ на то, что жители Ниневии отвернулись от злого пути.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте здесь употреблено то же слово, что и в выражении «злой путь». В первом случае оно обозначает нравственное зло, а здесь — бедствие, кару или несчастье.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: увидел
  rationale: Прямо передаёт повествовательную форму глагола ראה, не сводя её лишь к умственному осознанию.
- source_word: מַעֲשֵׂיהֶם
  choice: их дела
  rationale: Сохраняет значение конкретных поступков и их нравственный вес; последующая фраза поясняет, в чём эти дела выразились.
- source_word: כִּי שָׁבוּ
  choice: то, что они отвернулись
  rationale: כִּי здесь естественно понимать как ввод пояснения к увиденным Богом делам; שׁוּב передаёт решительный поворот от прежнего пути.
- source_word: מִדַּרְכָּם הָרָעָה
  choice: от своего злого пути
  rationale: Сохранены единственное число, образ жизненного пути и нравственный смысл רָעָה.
- source_word: וַיִּנָּחֶם
  choice: отказался наводить
  rationale: Передаёт изменение объявленного Богом действия в ответ на поворот ниневитян, не приписывая Богу нравственной вины или ошибки. Более буквальные варианты указаны в примечании.
- source_word: עַל הָרָעָה
  choice: бедствие
  rationale: Во втором употреблении רָעָה означает угрожавшее городу несчастье или суд, а не нравственное зло.
- source_word: אֲשֶׁר דִּבֶּר לַעֲשׂוֹת לָהֶם
  choice: которое говорил [навести] на них
  rationale: Русская конструкция естественно передаёт объявленное наказание; глагол «навести» восполняется из смысла оборота לַעֲשׂוֹת לָהֶם.
- source_word: וְלֹא עָשָׂה
  choice: и не сделал этого
  rationale: Сохраняет краткость и прямоту еврейского заключения.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Стандартное обозначение Бога в данном повествовательном контексте.
theological_decisions:
- issue: Антропопатическое описание Божьего ответа в וַיִּנָּחֶם
  choice: «Бог отказался наводить…» с примечанием о более буквальных вариантах
  alternative: «Бог пожалел о бедствии» или «Бог переменил решение»
  rationale: Текст сообщает о реальном изменении объявленного образа действий Бога в ответ на обращение Ниневии. Основной вариант не приписывает Богу греха или ошибки, а примечание сохраняет заложенное в еврейском глаголе напряжение.
- issue: Два значения רָעָה в одном стихе
  choice: «злой» о пути ниневитян и «бедствие» о Божьем суде
  alternative: В обоих случаях «зло»
  rationale: Один и тот же еврейский корень в первом случае обозначает нравственное зло, а во втором — губительное бедствие или кару. Механическое единообразие исказило бы смысл.
translation_notes:
  register: Современный литературный русский язык с простой, dignified повествовательной интонацией. Тире делает пояснительную связь после «их дела» прозрачной. Повтор «и не сделал этого» намеренно сохранён ради краткого и emphatic завершения оригинала.
