  source_fidelity: 'Основной смысл передан верно: Бог видит поступки ниневитян, их отказ от злого пути и не осуществляет возвещённое бедствие. Однако «отказался наводить» несколько тяжеловесно и ослабляет значение וַיִּנָּחֶם — изменения объявленного решения относительно бедствия. Кроме того, в исходном тексте бедствие является тем, о котором Бог сказал, что наведёт его на них; это лучше выразить явнее.'
