  rationale: 'Исправлена только русская формулировка: побудительные предписания сделаны параллельными, а еврейский идиоматический оборот «в их руках» передан естественным русским выражением без утраты образа рук или коллективного множественного числа. Необычное распространение взывания на людей и скот сознательно сохранено.'
