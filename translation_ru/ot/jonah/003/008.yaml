source:
  edition: WLC
  text: וְ/יִתְכַּסּ֣וּ שַׂקִּ֗ים הָֽ/אָדָם֙ וְ/הַ/בְּהֵמָ֔ה וְ/יִקְרְא֥וּ אֶל אֱלֹהִ֖ים בְּ/חָזְקָ֑ה וְ/יָשֻׁ֗בוּ אִ֚ישׁ מִ/דַּרְכּ֣/וֹ הָֽ/רָעָ֔ה וּ/מִן הֶ/חָמָ֖ס אֲשֶׁ֥ר בְּ/כַפֵּי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/008.yaml
  text: Let both man and beast be covered with sackcloth[a], and let them call out mightily to God[c][b], and let each man turn from his evil way and from the violence that is in their hands.
translation:
  language: ru
  text: Пусть и люди, и скот покроются вретищем; пусть громко взывают к Богу, и пусть каждый отвернётся от своего злого пути и от насилия, совершаемого их руками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִתְכַּסּוּ שַׂקִּים
  choice: покроются вретищем
  rationale: Возвратно-среднее значение породы хитпаэль естественно передаётся русским возвратным глаголом; «вретище» обозначает грубую одежду или ткань, служившую знаком скорби и покаяния.
- source_word: הָאָדָם וְהַבְּהֵמָה
  choice: и люди, и скот
  rationale: אָדָם здесь обозначает людей как класс в противопоставлении домашним животным; בְּהֵמָה в данном контексте естественно передать как «скот».
- source_word: וְיִקְרְאוּ אֶל אֱלֹהִים בְּחָזְקָה
  choice: и громко взывают к Богу
  rationale: קרא אל выражает обращённый к Богу настойчивый призыв или мольбу, а בְּחָזְקָה указывает на силу и напряжённость обращения. «Громко» сохраняет конкретную идею сильного взывания, не сводя её только к внутренней искренности.
- source_word: וְיָשֻׁבוּ
  choice: пусть ... отвернётся
  rationale: Глагол שׁוב буквально выражает поворот или возвращение; с предлогом מִן здесь речь об отказе от прежнего поведения. «Отвернётся от» сохраняет пространственную метафору и этический смысл.
- source_word: אִישׁ
  choice: каждый
  rationale: Дистрибутивное אִישׁ означает каждого отдельного человека. В современном русском «каждый» передаёт это значение естественно и без необоснованного ограничения призыва мужчинами.
- source_word: מִדַּרְכּוֹ הָרָעָה
  choice: от своего злого пути
  rationale: «Путь» сохраняет древнееврейскую этическую метафору образа жизни и поведения; רָעָה прямо передано словом «злого».
- source_word: וּמִן הֶחָמָס
  choice: и от насилия
  rationale: חָמָס обычно обозначает насилие либо насильственное беззаконие; «насилие» является наиболее прямым соответствием.
- source_word: אֲשֶׁר בְּכַפֵּיהֶם
  choice: которое в их руках
  rationale: Сохранён образ исходного текста и множественное местоимение כַפֵּיהֶם. Выражение указывает на совершаемое ими насилие и на их ответственность за него.
theological_decisions:
- issue: Покаянный смысл глагола שׁוב
  choice: «отвернётся», а не «покается»
  alternative: «покается» или «обратится»
  rationale: Контекст несомненно говорит о покаянии, однако исходный глагол использует конкретную метафору поворота. Выбранный вариант сохраняет её и не заменяет более широкое слово специальным богословским термином.
- issue: Соотношение единственного אִישׁ и множественного כַפֵּיהֶם
  choice: «каждый ... в их руках»
  alternative: «каждый ... в его руках»
  rationale: В исходном тексте дистрибутивное «каждый» сочетается с последующим местоимением третьего лица множественного числа. Этот переход числа сохранён как смысловое движение от каждого человека к совокупной ответственности народа.
- issue: Участие животных в предписанном действии
  choice: грамматически и люди, и скот покроются вретищем и взывают к Богу
  alternative: ограничить взывание только людьми
  rationale: Множественные глаголы после составного подлежащего формально относятся и к людям, и к скоту. Перевод не устраняет необычность и возможную риторическую гиперболу исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. «Вретище» сохранено как точный культурный термин, тогда как синтаксис сделан ясным и естественным. Пунктуация разделяет два предписания указа, не ослабляя их последовательности.
