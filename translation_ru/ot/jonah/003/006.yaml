base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/006.yaml
  text: When the message reached the king of Nineveh[a], he rose from his throne, removed his robe, covered himself with sackcloth[c][b], and sat in the ashes.
translation:
  language: ru
  text: Когда весть дошла до царя Ниневии[a], он встал со своего престола, снял с себя верхнее одеяние[b], облачился во власяницу и сел на пепел[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово», «дело» или «известие дошло до царя Ниневии».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «снял с себя мантию». Еврейское слово обозначает отличительное, иногда почётное верхнее одеяние.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «сел на пепел». В некоторых переводах: «сел в пепел».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע הַדָּבָר
  choice: весть дошла
  rationale: В сочетании с אֶל глагол נגע означает, что слово, сообщение или известие достигло адресата. «Весть дошла» естественно передаёт этот смысл по-русски, не уточняя способ передачи.
- source_word: מֶלֶךְ נִינְוֵה
  choice: царь Ниневии
  rationale: Конструктивное сочетание прямо обозначает правителя Ниневии; «царь» соответствует древнему царскому контексту.
- source_word: וַיָּקָם מִכִּסְאוֹ
  choice: встал со своего престола
  rationale: כִּסֵּא может означать сиденье или престол; при царе «престол» точно отражает статус и образ его унижения.
- source_word: וַיַּעֲבֵר אַדַּרְתּוֹ מֵעָלָיו
  choice: снял с себя царское одеяние
  rationale: Каузативная форма עבר здесь означает удалить или снять то, что было на нём. אַדֶּרֶת — заметная верхняя одежда; в данном царском контексте «царское одеяние» естественно, а примечание сохраняет более буквальную альтернативу.
- source_word: וַיְכַס שַׂק
  choice: покрылся власяницей
  rationale: Буквально сказано, что он покрыл себя שַׂק. Традиционное и понятное библейское слово «власяница» обозначает грубую одежду скорби и покаяния.
- source_word: וַיֵּשֶׁב עַל הָאֵפֶר
  choice: сел на пепел
  rationale: Предлог עַל буквально означает «на»; единственное собирательное הָאֵפֶר естественно передаётся русским «пепел».
theological_decisions:
- issue: Действия царя как образы смирения и покаяния
  choice: Переданы только названные в стихе действия без добавления слова «покаялся».
  alternative: Явно назвать эти действия покаянием.
  rationale: Снятие царского одеяния, власяница и пепел несут очевидную символику скорби и смирения, однако сам стих описывает поступки и не формулирует богословский вывод напрямую.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис простой и повествовательный. Слова «царь», «престол» и «власяница» сохраняют историко-библейскую окраску; последнее понятно из контекста и точно обозначает одежду скорби.
