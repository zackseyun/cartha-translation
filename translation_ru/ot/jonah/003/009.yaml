source:
  edition: WLC
  text: מִֽי יוֹדֵ֣עַ יָשׁ֔וּב וְ/נִחַ֖ם הָ/אֱלֹהִ֑ים וְ/שָׁ֛ב מֵ/חֲר֥וֹן אַפּ֖/וֹ וְ/לֹ֥א נֹאבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/009.yaml
  text: Who knows? God may turn and relent[a], and turn from the burning of his anger[b], so that we do not perish.
translation:
  language: ru
  text: Кто знает? Может быть, Бог отступит и смягчится[a], отвратится от пыла Своего гнева[b], и мы не погибнем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Можно также перевести: «передумает» или «пожалеет». Здесь речь идёт о том, что Бог может не привести в исполнение объявленный суд.'
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «от горения Своего гнева»; это еврейский образ сильного гнева.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: Кто знает?
  rationale: Устойчивое риторическое выражение сохраняет одновременно неопределённость и надежду.
- source_word: יָשׁוּב
  choice: может быть, Бог отступит
  rationale: После «Кто знает?» форма выражает возможность, а не уверенность. «Отступит» передаёт поворот от намеченного суда, не превращая надежду ниневитян в утверждённый факт.
- source_word: וְנִחַם
  choice: и смягчится
  rationale: В данном контексте глагол означает отказ от исполнения объявленного наказания. «Смягчится» естественно звучит по-русски и не устраняет присущую тексту мысль о Божьем отклике на покаяние.
- source_word: הָאֱלֹהִים
  choice: Бог
  rationale: Обычное и контекстуально точное обозначение Бога.
- source_word: וְשָׁב
  choice: отвратится
  rationale: Второе употребление שוב связано с предложной конструкцией «от пыла Своего гнева». «Отвратится от» естественно передаёт этот оборот; близость значений «отступит» и «отвратится» отчасти сохраняет еврейский повтор.
- source_word: מֵחֲרוֹן אַפּוֹ
  choice: от пыла Своего гнева
  rationale: Сохраняется образ жара, заключённый в еврейской идиоме, при этом выражение остаётся понятным и литературным.
- source_word: וְלֹא נֹאבֵד
  choice: и мы не погибнем
  rationale: Естественно передаёт ожидаемый результат Божьего отказа от суда, сохраняя первое лицо множественного числа.
theological_decisions:
- issue: Изображение Божьего решения в וְנִחַם
  choice: Бог «смягчится»
  alternative: Бог «передумает», «пожалеет» или «отменит наказание»
  rationale: «Смягчится» сохраняет реальную надежду на Божий отклик и отказ от объявленного суда, но не навязывает философского объяснения и не предполагает, будто Бог допустил нравственную ошибку.
translation_notes:
  register: Современный литературный русский язык с краткой риторической фразой в начале. Сохранены образ пылающего гнева, неопределённая надежда говорящих и смысловая перекличка двух употреблений שוב; местоимение «Своего» оформлено по принятой в русском библейском стиле норме.
