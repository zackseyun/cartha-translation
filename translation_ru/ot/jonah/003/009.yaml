  source_fidelity: Перевод точно передаёт риторическое «Кто знает?» (מִי יוֹדֵעַ), модальную надежду, три последовательных глагольных действия и итог «мы не погибнем». «Отступит», «смягчится» и «отвратится от пыла Своего гнева» в совокупности адекватно выражают יָשׁוּב וְנִחַם ... וְשָׁב מֵחֲרוֹן אַפּוֹ, не превращая надежду жителей Ниневии в уверенное предсказание.
