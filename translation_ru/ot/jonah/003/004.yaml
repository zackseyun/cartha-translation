base_translation:
  language: en
  yaml_path: translation/ot/jonah/003/004.yaml
  text: Jonah began to go into the city a day's journey[a], and he cried out and said, “Yet forty days[b], and Nineveh will be overturned.”
translation:
  language: ru
  text: 'Иона начал идти по городу и, пройдя один дневной путь, возгласил: «Ещё сорок дней[a] — и Ниневия будет ниспровергнута[b]!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Через сорок дней» или «Ещё сорок дней». Еврейское выражение указывает на время, остающееся до объявленного события.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будет опрокинута». Еврейский глагол может обозначать ниспровержение, а также переворот или коренную перемену.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל ... לָבוֹא בָעִיר
  choice: начал идти в глубь города
  rationale: Сочетание וַיָּחֶל с инфинитивом обозначает начало действия, а בוא с ב — движение внутрь города. Русское выражение передаёт и начало движения, и его направленность, не сводя смысл к одному лишь факту входа.
- source_word: מַהֲלַךְ יוֹם אֶחָד
  choice: пройдя дневной путь
  rationale: Оборот обозначает расстояние, преодолеваемое за день. Формулировка естественна по-русски и сохраняет пространственный смысл выражения.
- source_word: וַיִּקְרָא וַיֹּאמַר
  choice: громко возгласил
  rationale: Два еврейских глагола создают переход к публичному громкому объявлению. В русском один глагол с наречием передаёт эту силу естественно, без тяжеловесного «воззвал и сказал».
- source_word: עוֹד אַרְבָּעִים יוֹם
  choice: Ещё сорок дней
  rationale: עוֹד указывает на остающееся до события время. Такая краткая формула сохраняет характер отсчёта и звучит как прямое предупреждение.
- source_word: נֶהְפָּכֶת
  choice: будет перевёрнута
  rationale: Форма от הפך может указывать как на ниспровержение и гибель, так и шире на переворот или радикальную перемену. «Перевёрнута» сохраняет эту намеренную смысловую широту, хотя по-русски требует пояснения в сноске.
theological_decisions:
- issue: Смысловая сила נֶהְפָּכֶת в предупреждении Ионы
  choice: будет перевёрнута
  alternative: будет ниспровергнута / будет уничтожена
  rationale: Более узкие варианты однозначно описывают гибель города. Выбранный вариант оставляет открытым как суд и ниспровержение, так и более широкую тему коренного переворота, не снимая литературного и богословского напряжения повествования.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием пророческого предупреждения. «Громко возгласил» передаёт публичность и настойчивость речи; тире сохраняет резкий ритм объявления. Все сноски отмечены в основном тексте.
