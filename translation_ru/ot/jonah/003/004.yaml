  source_fidelity: В исходном тексте выражение «один дневной путь» относится к продвижению Ионы в городе; вариант «в глубь города» излишне конкретизирует направление, а «пройдя» делает предшествование действия более определённым, чем еврейский текст. Глагол נֶהְפָּכֶת обозначает грядущее ниспровержение/опрокидывание и допускает более широкий оттенок радикального переворота; «будет перевёрнута» слишком буквально и неестественно по отношению к городу в современном русском.
