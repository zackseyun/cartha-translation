  text: Arise[a], go to Nineveh, the great city, and proclaim to it the proclamation that I speak to you.
translation:
  language: ru
  text: '«Встань, иди в Ниневию, великий город, и возвести ей[a] весть, которую Я скажу тебе».


    [a] Или: «возгласи против неё». В Ион. 1:2 употреблён предлог со значением «против», а здесь еврейский текст говорит «ей» / «к ней».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возгласи против неё». В Ион. 1:2 употреблён предлог со значением «против», а здесь еврейский текст говорит «ей» / «к ней».'
    reason: alternative_reading
lexical_decisions:
- source_word: ק֛וּם
  choice: Встань
  rationale: Императив קום передаёт побуждение подняться и приступить к действию; «Встань» естественно и сохраняет торжественную настойчивость повеления.
- source_word: לֵ֥ךְ
  choice: иди
  rationale: Обычный русский эквивалент императива глагола движения הלך в последовательности повелений.
- source_word: נִֽינְוֵ֖ה
  choice: Ниневию
  rationale: Устоявшаяся русская форма названия города; винительный падеж обусловлен предлогом «в» при обозначении направления.
- source_word: הָעִיר הַגְּדוֹלָה
  choice: великий город
  rationale: «Великий» сохраняет возможные оттенки как величины, так и значимости, а также литературный повтор в книге Ионы.
- source_word: וּקְרָא אֵלֶיהָ
  choice: и возвести ей
  rationale: Глагол קרא здесь означает публично провозгласить, а אֶל указывает направление «к/ей», не «против неё». «Возвести ей» сохраняет эту особенность и подходит к речи Божьего посланника.
- source_word: אֶת הַקְּרִיאָה
  choice: то, что … возвестить
  rationale: Контекстуальное выражение передаёт содержание порученного провозглашения; повтор «возвести … возвестить» сохраняет корневую связь קרא / קריאה без неестественного русского «провозгласи провозглашение».
- source_word: אֲשֶׁר אָנֹכִי דֹּבֵר אֵלֶיךָ
  choice: что Я велю тебе возвестить
  rationale: Причастная форма דֹבֵר может иметь актуально-предписывающий смысл. В данном контексте речь идёт о сообщении, которое Бог поручает Ионе объявить; формулировка естественна по-русски и не уточняет содержание вести.
theological_decisions:
- issue: Направленность вести к Ниневии
  choice: возвести ей
  alternative: возгласи против неё
  rationale: В этом стихе стоит אֶל («к, кому»), в отличие от עַל («против») в Ион. 1:2. Перевод сохраняет смену предлога и не усиливает враждебную направленность поручения, хотя сама весть далее оказывается вестью суда.
- issue: Характер поручаемой вести
  choice: то, что Я велю тебе возвестить
  alternative: весть, которую Я говорю тебе
  rationale: Источник не излагает здесь содержания вести и подчёркивает зависимость пророка от Божьего поручения. Перевод не добавляет ни безусловности суда, ни обещания милости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным библейским регистром. Синтаксический ряд императивов сохранён. Местоимение «Я» в прямой Божьей речи написано с прописной буквы согласно распространённой русской издательской традиции.
