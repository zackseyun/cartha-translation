review_pass:
  verdict: revise
  source_fidelity: 'В исходном тексте сказано: «возгласи/провозгласи ей [весть] — то провозглашение, которое Я говорю тебе». Черновое «то, что Я велю тебе возвестить» существенно меняет смысл: глагол דֹּבֵר («говорю», «скажу», «сообщаю») заменён на «велеть», а существительное הַקְּרִיאָה («провозглашение», «весть») устранено. «Ей» верно передаёт אֶלֶיהָ и не вносит значения «против неё».'
  naturalness: «Встань, иди в Ниневию, великий город» естественно для современного литературного русского с умеренно библейским регистром. Формула «возвести ей весть, которую Я скажу тебе» ясна и благозвучна; будущее «скажу» передаёт предстоящую передачу вести в рамках поручения, не подменяя глагол речи глаголом повеления.
  terminology: «Великий город» сохраняет традиционно-литературную формулу и широту גְּדוֹלָה. «Возвести» и «весть» удачно передают публичный характер קרא и его объект הַקְּרִיאָה без неестественного тавтологического сочетания. Сноска сохраняет важное различие между אֶל («ей/к ней») здесь и עַל («против неё») в 1:2.
  issues:
