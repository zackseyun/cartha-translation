  text: And the people of Nineveh believed God[a], and they proclaimed a fast and put on sackcloth, from their greatest to their least.
translation:
  language: ru
  text: И жители Ниневии поверили Богу[a], объявили пост и оделись во вретище — от самого знатного до самого простого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доверились Богу». Еврейская конструкция может означать как признание Божьих слов истинными, так и доверие Богу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמִינוּ ... בֵּאלֹהִים
  choice: поверили Богу
  rationale: Конструкция אמן в породе hифиль с ב может обозначать как признание Божьего слова истинным, так и доверие Богу. «Поверили Богу» естественно по-русски передаёт непосредственный отклик на проповедь Ионы, не превращая его явно в обращение или спасительную веру.
- source_word: אַנְשֵׁי נִינְוֵה
  choice: жители Ниневии
  rationale: Буквально «люди/мужи Ниневии», но в данном контексте выражение собирательно обозначает население города; «жители» естественно и согласуется с охватом всех слоёв в конце стиха.
- source_word: וַיִּקְרְאוּ צוֹם
  choice: объявили пост
  rationale: קרא с צום означает публично назначить или провозгласить пост. «Объявили пост» — ясное современное выражение.
- source_word: וַיִּלְבְּשׁוּ שַׂקִּים
  choice: оделись во вретище
  rationale: Глагол означает надеть одежду из грубой ткани в знак скорби и смирения. «Вретище» сохраняет библейский культурный образ и остаётся понятным в литературном русском.
- source_word: מִגְּדוֹלָם וְעַד קְטַנָּם
  choice: от самого знатного до самого простого
  rationale: Меризм выражает всеобщность и здесь прежде всего различие общественного положения. Такая передача естественнее буквального «от великого до малого» и не сводит выражение только к возрасту.
theological_decisions:
- issue: Характер отклика ниневитян на Бога
  choice: «поверили Богу» без поясняющего добавления о покаянии, обращении или спасительной вере
  alternative: «уверовали в Бога»
  rationale: В стихе названы вера, пост и вретище; контекст указывает на покаянный отклик, но перевод не должен заранее определять его полный богословский статус.
translation_notes:
  register: Современный литературный русский с умеренно библейской возвышенностью. «Вретище» сохранено как точный традиционный термин; синтаксис упрощён для ясного чтения. Тире подчёркивает всеобщий охват реакции жителей.
