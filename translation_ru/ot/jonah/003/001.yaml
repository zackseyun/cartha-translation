lexical_decisions:
- source_word: וַיְהִי
  choice: было обращено
  rationale: Повествовательная форма продвигает рассказ и вместе с выражением «слово Яхве» естественно передаётся по-русски как «слово… было обращено», без буквального и тяжеловесного «и было».
- source_word: דְבַר יְהוָה
  choice: слово Яхве
  rationale: «Слово» сохраняет устойчивую пророческую формулу и её библейское звучание; «весть» было бы более истолковывающим переводом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, выраженное тетраграмматоном, а не заменяющий его титул.
- source_word: אֶל יוֹנָה
  choice: к Ионе
  rationale: Предлог אֶל обозначает адресата Божьего слова; русская конструкция «обращено к Ионе» естественно передаёт эту связь.
- source_word: שֵׁנִית
  choice: во второй раз
  rationale: Перевод прямо сохраняет указание на повторное поручение после первого призвания Ионы.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит содержание речи в следующем стихе; в современном русском двоеточие естественно выполняет эту функцию и избегает тяжеловесного «говоря».
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит собственное имя Бога. Транслитерация «Яхве» сохраняет его как имя и не подменяет титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого повествования. Порядок слов сохраняет акцент на повторном обращении, а двоеточие естественно вводит речь следующего стиха.
