  text: Then the spirit came forward and stood before Yahweh and said[a], ‘I will entice him.’ And Yahweh said to him[b], ‘By what means?’
translation:
  language: ru
  text: 'Тогда дух[a] выступил вперёд, встал перед Яхве и сказал: «Я соблазню его[b]». И Яхве сказал ему: «Каким образом?»'
