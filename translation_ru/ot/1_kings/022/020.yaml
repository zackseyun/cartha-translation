  terminology: «Яхве», «Ахав» и «Рамоф Галаадский» приемлемы. Сноска удачно отмечает спектр значений פתה; «обольстит» здесь лучше понимать как возможный контекстуальный оттенок, не как обязательное значение основного текста.
