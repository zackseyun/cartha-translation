  source_fidelity: 'Основная передача верна: יְהוָה передано как «Яхве», יְפַתֶּה — достаточно широким «склонит», а «пасть» сохраняет неуточнённый образ נפל. Однако «пойти» не передаёт смысловой компонент וְיַעַל («подняться; выступить вверх/против [города]»). В заключительной формуле «так, а другой — иначе» смысл различия понятен, но «одно ... другое» точнее отражает противопоставленные предложения, не добавляя способа их высказывания.'
