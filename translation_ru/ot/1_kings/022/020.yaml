  yaml_path: translation/ot/1_kings/022/020.yaml
  text: And Yahweh said[a], “Who will entice Ahab, so that he may go up and fall at Ramoth-gilead?” And this one said one thing, and that one said another.
translation:
  language: ru
  text: 'И сказал Яхве[a]: «Кто склонит Ахава, чтобы он поднялся и пал в Рамофе Галаадском?» И один говорил одно, а другой — другое.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уговорит»; в данном контексте глагол может также означать «обольстит» или «обманет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: יְפַתֶּה
  choice: склонит
  rationale: Глагол в породе пиэль может означать побуждение, уговаривание или обольщение/обман. «Склонит» естественно звучит по-русски и не снимает присущей контексту неоднозначности; возможные более конкретные значения указаны в сноске.
- source_word: וְיַעַל וְיִפֹּל
  choice: пойти и пасть
  rationale: В контексте похода на возвышенное место וְיַעַל буквально означает «подняться», но по-русски «пойти» яснее передаёт военный поход; «пасть» сохраняет образное и военное значение נפל, не уточняя прямо смерть.
- source_word: בְּרָמֹת גִּלְעָד
  choice: при Рамофе Галаадском
  rationale: Традиционная русская форма топонима сохранена; предлог «при» естественно обозначает место предстоящего сражения.
- source_word: זֶה בְּכֹה וְזֶה אֹמֵר בְּכֹה
  choice: И один говорил так, а другой — иначе
  rationale: Передаёт чередование разных предложений участников совета естественным современным русским выражением, сохраняя противопоставление.
theological_decisions:
- issue: Участие Яхве в падении Ахава
  choice: Сохранить прямую постановку вопроса Яхве о том, кто склонит Ахава.
  alternative: Смягчить причинную связь формулировкой вроде «кто повлияет на Ахава».
  rationale: Еврейский текст прямо изображает Яхве инициатором обсуждения на небесном совете. Перевод сохраняет напряжение между Божьим верховенством, судом и последующим обманом, не разрешая его толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис прямой и понятный; традиционная русская форма географического названия сочетается с передачей имени Яхве.
