  text: וְ/אִ֗ישׁ מָשַׁ֤ךְ בַּ/קֶּ֨שֶׁת֙ לְ/תֻמּ֔/וֹ וַ/יַּכֶּה֙ אֶת מֶ֣לֶךְ יִשְׂרָאֵ֔ל בֵּ֥ין הַ/דְּבָקִ֖ים וּ/בֵ֣ין הַ/שִּׁרְיָ֑ן וַ/יֹּ֣אמֶר לְ/רַכָּב֗/וֹ הֲפֹ֥ךְ יָדְ/ךָ֛ וְ/הוֹצִיאֵ֥/נִי מִן הַֽ/מַּחֲנֶ֖ה כִּ֥י הָחֳלֵֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/034.yaml
  text: But a man drew his bow at random and struck the king of Israel between the scale armor and the breastplate[a]. So he said to his charioteer, “Turn your hand and take me out of the camp[d][c][b], for I am wounded.”
translation:
  language: ru
  text: 'Но один человек натянул лук наугад[a] и поразил царя Израиля между сочленениями доспеха и панцирем[b]. Тогда царь сказал своему вознице: «Поверни[c] и вывези меня с поля боя, потому что я ранен[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не целясь», «без определённой цели». Древнееврейское выражение может буквально указывать на простодушие или непреднамеренность стрелка.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «между дебаким и ширьяном». Точные значения этих технических названий неясны; вероятно, речь идёт о щели между частями доспеха.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «поверни свою руку» — то есть разверни или направь колесницу в другую сторону.'
    reason: lexical_alternative
  - marker: d
    text: Употреблённый здесь глагол может означать «заболеть», «ослабеть» или «быть раненым»; в данном контексте имеется в виду ранение.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: Но один человек
  rationale: Союз передаёт резкий поворот повествования, а неопределённый участник остаётся безымянным.
- source_word: מָשַׁךְ בַּקֶּשֶׁת
  choice: натянул лук
  rationale: Естественное русское соответствие древнееврейскому выражению о натягивании лука для выстрела.
- source_word: לְתֻמּוֹ
  choice: наугад
  rationale: В военном контексте выражение, вероятнее всего, означает выстрел без заранее выбранной цели; оттенок непреднамеренности сохранён в примечании.
- source_word: וַיַּכֶּה
  choice: и поразил
  rationale: Передаёт значение «ударить, поразить», не опережая последующее прямое указание на ранение.
- source_word: בֵּין הַדְּבָקִים וּבֵין הַשִּׁרְיָן
  choice: между сочленениями доспеха и панцирем
  rationale: Технические названия элементов доспеха не вполне ясны; перевод изображает уязвимый промежуток между его частями, не создавая ложной точности.
- source_word: לְרַכָּבוֹ
  choice: своему вознице
  rationale: Речь идёт о человеке, управлявшем царской колесницей.
- source_word: הֲפֹךְ יָדְךָ
  choice: Поверни
  rationale: Естественно передаёт буквальное «поверни свою руку» как приказ изменить направление колесницы.
- source_word: וְהוֹצִיאֵנִי מִן הַמַּחֲנֶה
  choice: и вывези меня с поля боя
  rationale: В данном военном контексте מַחֲנֶה обозначает расположенное для сражения войско, а не мирный лагерь; русский перевод ясно выражает требуемое действие.
- source_word: כִּי הָחֳלֵיתִי
  choice: потому что я ранен
  rationale: Хотя глагол может обозначать болезнь или ослабление, контекст попадания стрелы определяет здесь значение ранения; степень тяжести не добавляется.
