base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/015.yaml
  text: So he came to the king[a], and the king said to him, “Micaiah, should we go to Ramoth-gilead for battle, or should we refrain?” And he said to him, “Go up and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: ru
  text: 'И он пришёл к царю. Царь спросил его: «Михей, идти ли нам войной на Рамот-Галаад или воздержаться?» Тот ответил ему: «Иди и добейся успеха, и Яхве отдаст его в руки царя».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Судя по дальнейшему разговору, этот ответ Михея, вероятно, ироничен, хотя сами древнееврейские слова прямо на сарказм не указывают.
    reason: Сохранить контекстуально вероятную иронию, не внося её как однозначный смысл в основной текст.
lexical_decisions:
- source_word: וַיָּבוֹא
  choice: И он пришёл
  rationale: Последовательная форма повествования обозначает следующее событие; союз сохраняет связь с предшествующим контекстом.
- source_word: מִיכָיְהוּ
  choice: Михей
  rationale: Использована укоренившаяся русская библейская форма личного имени.
- source_word: הֲנֵלֵךְ
  choice: идти ли нам
  rationale: Вопросительная форма первого лица множественного числа выражает просьбу о совете; русский порядок слов передаёт её естественно.
- source_word: רָמֹת גִּלְעָד
  choice: Рамот-Галаад
  rationale: Традиционная и узнаваемая русская передача составного географического названия.
- source_word: לַמִּלְחָמָה
  choice: войной
  rationale: Существительное с предлогом выражает цель похода; оборот «идти войной» естественно передаёт военный смысл.
- source_word: אִם נֶחְדָּל
  choice: или воздержаться
  rationale: Глагол חדל здесь обозначает отказ от задуманного похода или удержание от него.
- source_word: עֲלֵה
  choice: Иди
  rationale: Императив עלה буквально означает движение вверх или выступление в поход; краткое «иди» сохраняет форму повеления без добавления отсутствующего в тексте глагола «атакуй».
- source_word: וְהַצְלַח
  choice: и добейся успеха
  rationale: Форма от צלח выражает успешное осуществление предприятия. Перевод сохраняет утвердительный смысл слов, не внося явного указания на иронию.
- source_word: וְנָתַן יְהוָה
  choice: Яхве отдаст
  rationale: Перфект после повелительных форм передаёт уверенно ожидаемый результат; по-русски естественно употребить будущее время.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано транслитерацией, а не заменено титулом.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: в руки царя
  rationale: Русский устойчивый оборот «отдать в руки» естественно передаёт древнееврейскую идиому передачи под власть или контроль. Местоимение «его» восполняет подразумеваемый объект — Рамот-Галаад.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Тон первоначального ответа Михея
  choice: Слова переведены прямо, а вероятная ирония отмечена в сноске
  alternative: Явно обозначить сарказм в формулировке или пунктуации
  rationale: Слова ответа сами по себе не содержат формального показателя сарказма, хотя последующий контекст убедительно указывает на иронию. Основной текст не снимает этой повествовательной неоднозначности.
- issue: Невыраженный объект при וְנָתַן
  choice: Добавлено местоимение «его», относящееся к Рамот-Галааду
  alternative: 'Оставить объект невыраженным: «Яхве отдаст в руки царя»'
  rationale: В древнееврейском объект понятен из контекста и может быть опущен; в русском без него фраза звучит грамматически неполно. Местоимение не уточняет более того, что уже подразумевает контекст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Диалог передан ясно и кратко; устаревшие формы и избыточная буквальность избегаются, а повтор слова «царь» сохранён там, где он поддерживает придворный характер сцены.
