- source_word: בַּיּוֹם הַהוּא
  choice: в тот день
  rationale: Естественная русская передача временного выражения.
- source_word: אֲשֶׁר תָּבֹא
  choice: когда будешь переходить
  rationale: Относительное אֲשֶׁר здесь вводит временное обстоятельство; форма «будешь переходить» согласуется с выбранной итеративной передачей следующего выражения.
- source_word: חֶדֶר בְּחֶדֶר
  choice: из комнаты в комнату
  rationale: Буквальное повторение слова «комната» допускает понимание последовательного ухода по комнатам или продвижения во внутреннее помещение. Основной текст сохраняет повтор и движение, а примечание отмечает альтернативу.
- source_word: לְהֵחָבֵה
  choice: чтобы спрятаться
  rationale: Инфинитив цели естественно передаётся придаточным цели; возвратная форма ясно выражает, что прячется сам адресат.
