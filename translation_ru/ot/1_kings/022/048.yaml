source:
  edition: WLC
  text: וּ/מֶ֥לֶךְ אֵ֛ין בֶּ/אֱד֖וֹם נִצָּ֥ב מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/048.yaml
  text: And there was no king in Edom[a]; a deputy was king.
translation:
  language: ru
  text: В Эдоме не было царя; наместник[a] был царём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначенный правитель». Еврейское слово נִצָּב буквально означает человека, которого поставили или назначили.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֶלֶךְ אֵין
  choice: не было царя
  rationale: אֵין выражает отсутствие, а в контексте исторического повествования естественно передаётся прошедшим временем. Начальный ו не требует отдельного «и» в русском, поскольку связь предложений сохраняется контекстом.
- source_word: בֶּ/אֱדוֹם
  choice: в Эдоме
  rationale: Предлог ב с географическим названием имеет прямое местное значение.
- source_word: נִצָּב
  choice: наместник
  rationale: Причастие от נצב обозначает поставленного или назначенного человека; в политическом контексте «наместник» естественно передаёт представителя, поставленного управлять страной, не превращая слово в чрезмерно точный административный титул.
- source_word: מֶלֶךְ
  choice: был царём
  rationale: Сохранено краткое именное сказуемое еврейского текста и намеренное напряжение между отсутствием царя и тем, что наместник занимал царское положение.
theological_decisions:
- issue: Статус правителя Эдома
  choice: «наместник был царём»
  alternative: «наместник правил вместо царя»
  rationale: Альтернатива яснее объясняет смысл, но добавляет отсутствующее в тексте «вместо». Выбранный вариант сохраняет формулировку и неоднозначность оригинала, не уточняя характер зависимости Эдома сверх сказанного.
translation_notes:
  register: Современный литературный русский язык; фраза намеренно краткая и несколько парадоксальная, как в еврейском тексте. «Наместник» понятно передаёт политическую функцию, а сноска раскрывает буквальный смысл слова.
