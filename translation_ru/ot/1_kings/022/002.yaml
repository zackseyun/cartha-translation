  language: ru
  text: На третий год Иосафат, царь Иудеи, спустился к царю Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּשָּׁנָה הַשְּׁלִישִׁית
  choice: На третий год
  rationale: Повествовательная формула וַיְהִי естественно передаётся по-русски временным оборотом без буквального «и было». Определённый порядковый числительный сохранён.
- source_word: וַיֵּרֶד
  choice: отправился
  rationale: Глагол ירד буквально означает движение вниз, однако здесь также обозначает поездку к царю Израиля. В основном тексте выбран естественный русский глагол движения, а буквальный пространственный оттенок сохранён в сноске.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Сопряжённая конструкция обозначает царский титул Иосафата; по-русски она естественно оформлена приложением.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: к царю Израиля
  rationale: Предлог אֶל выражает направленность движения к лицу; перевод сохраняет политическое обозначение адресата.
