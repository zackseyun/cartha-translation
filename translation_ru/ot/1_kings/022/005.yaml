base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/005.yaml
  text: And Jehoshaphat said to the king of Israel[a], “Please inquire today for the word of Yahweh.”
translation:
  language: ru
  text: 'И сказал Иосафат царю Израиля: «Пожалуйста, обратись сегодня за словом Яхве».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Пожалуйста, испроси сегодня слово у Яхве»; буквально: «поищи сегодня слова Яхве».'
    reason: Передаёт возможные способы выразить דָּרַשׁ в сочетании с «словом Яхве», сохраняя значение поиска божественного слова, а не запроса о нём.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Вав с последовательной формой продвигает повествование; традиционная русская повествовательная связь «И сказал» здесь естественна и сохраняет структуру оригинала.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Устоявшаяся русская библейская форма личного имени.
- source_word: אֶל מֶלֶךְ יִשְׂרָאֵל
  choice: царю Израиля
  rationale: Прямо передаёт адресата и царский титул без ненужного перефразирования.
- source_word: דְּרָשׁ
  choice: вопроси
  rationale: В данном контексте глагол означает обращение за божественным указанием. «Вопроси» кратко и точно передаёт культово-пророческий оттенок, хотя имеет возвышенную библейскую окраску.
- source_word: נָא
  choice: прошу
  rationale: Передаёт вежливую просьбу и увещевание естественнее для современного русского языка, чем архаическое «молю тебя».
- source_word: כַיּוֹם
  choice: сегодня
  rationale: Сохраняет явное временное значение и оттенок безотлагательности, не усиливая его до «немедленно».
- source_word: אֶת דְּבַר יְהוָה
  choice: о слове Яхве
  rationale: При глаголе «вопросить» русское управление «вопросить о» естественно выражает поиск откровения; «слово» сохраняет ключевую лексику оригинала.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя Бога, а не заменяет его титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В еврейском тексте стоит тетраграмматон; транслитерация «Яхве» сохраняет личное имя и не подменяет его титулом.
- issue: Что именно следует искать у Бога
  choice: вопроси о слове Яхве
  alternative: вопроси Яхве; узнай волю Яхве; попроси слова от Яхве
  rationale: 'Формулировка сохраняет объект דְּבַר («слово») и присущую конструкции неоднозначность: речь может идти о поиске слова-откровения или обращении к Яхве за таким словом.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Вопроси» выбрано ради точности и краткости; сноска раскрывает более разговорные варианты. Маркер сноски помещён непосредственно после стиха.
