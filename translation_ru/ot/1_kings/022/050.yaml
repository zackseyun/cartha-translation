  text: אָ֠ז אָמַ֞ר אֲחַזְיָ֤הוּ בֶן אַחְאָב֙ אֶל יְה֣וֹשָׁפָ֔ט יֵלְכ֧וּ עֲבָדַ֛/י עִם עֲבָדֶ֖י/ךָ בָּ/אֳנִיּ֑וֹת וְ/לֹ֥א אָבָ֖ה יְהוֹשָׁפָֽט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/050.yaml
  text: Then Ahaziah son of Ahab said to Jehoshaphat[b][a], “Let my servants go with your servants in the ships,” but Jehoshaphat was not willing.
translation:
  language: ru
  text: 'Тогда Охозия, сын Ахава, сказал Иосафату: «Пусть мои слуги отправятся с твоими слугами на кораблях». Но Иосафат не согласился.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не пожелал»; возможный перевод: «отказался».'
    reason: 'Сноска сохраняет диапазон значения אָבָה: отсутствие желания или согласия может быть выражено и как явный отказ.'
lexical_decisions:
- source_word: אָז
  choice: Тогда
  rationale: Передаёт временно-последовательный переход в повествовании естественным современным русским языком.
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Охозия, сын Ахава
  rationale: Использованы традиционные русские библейские формы имён; בֶן передано как «сын».
- source_word: יֵלְכוּ
  choice: Пусть ... отправятся
  rationale: Форма выражает побуждение или предложение; «отправятся» в данном контексте яснее обозначает участие в морском предприятии, не усиливая приказной оттенок.
- source_word: עֲבָדַי ... עֲבָדֶיךָ
  choice: мои слуги ... твои слуги
  rationale: «Слуги» сохраняет широкое значение עֶבֶד и параллелизм, не утверждая без достаточных оснований ни рабского статуса, ни официальной должности.
- source_word: בָּאֳנִיּוֹת
  choice: на кораблях
  rationale: Это нормативное русское обозначение передвижения и службы на морских судах; предлог בְּ допускает такое контекстуальное соответствие.
- source_word: וְלֹא אָבָה
  choice: Но ... не согласился
  rationale: Передаёт отсутствие согласия или готовности со стороны Иосафата естественнее, чем буквальное «не захотел», и менее категорично, чем «отказался».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с традиционными русскими формами библейских имён. Реплика передана ясно и достойно; сохранён параллелизм «мои слуги — твои слуги». Единственный маркер [a] помещён непосредственно после относящейся к нему фразы.
