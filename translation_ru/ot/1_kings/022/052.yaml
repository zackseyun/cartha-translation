base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/052.yaml
  text: Ahaziah son of Ahab became king over Israel in Samaria in the seventeenth year of Jehoshaphat king of Judah, and he reigned over Israel two years.
translation:
  language: ru
  text: Охозия, сын Ахава, воцарился над Израилем в Самарии в семнадцатый год правления Иосафата, царя Иудеи, и царствовал над Израилем два года.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחַזְיָהוּ בֶן אַחְאָב
  choice: Охозия, сын Ахава
  rationale: Имена переданы в принятой русской библейской форме; конструкция «сын Ахава» непосредственно отражает еврейское сочетание имени и отчества.
- source_word: מָלַךְ
  choice: воцарился
  rationale: В данном сообщении форма обозначает вступление Охозии на престол; «воцарился» естественно и точно передаёт этот начальный аспект.
- source_word: עַל יִשְׂרָאֵל
  choice: над Израилем
  rationale: Предлог עַל при глаголе царствования обозначает народ, над которым осуществляется царская власть.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог ב указывает на место; Самария названа местопребыванием царской власти.
- source_word: בִּשְׁנַת שְׁבַע עֶשְׂרֵה לִיהוֹשָׁפָט
  choice: в семнадцатый год правления Иосафата
  rationale: Это формула синхронизации царствований. Добавление «правления» делает смысл конструкции с ל ясным по-русски, не внося новой информации.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царя Иудеи
  rationale: Приложение сохраняет титул Иосафата и естественно согласуется с родительным падежом имени.
- source_word: וַיִּמְלֹךְ
  choice: и царствовал
  rationale: После сообщения о вступлении на престол глагол вводит итоговую продолжительность царствования.
- source_word: שְׁנָתָיִם
  choice: два года
  rationale: Двойственное число прямо обозначает двухлетнюю продолжительность.
