  text: Иосафат заключил мир с царём Израиля[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Иосафат был в мире с царём Израиля». Еврейский глагол может означать как заключение мира, так и состояние мирных отношений; в основном тексте предпочтено событийное значение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלֵם
  choice: заключил мир
  rationale: Хифиль глагола שׁלם с последовательным вау здесь естественно передаёт установление мирных отношений. Выражение «заключил мир» ясно и идиоматично отражает событийное значение, не исключая отмеченного в сноске статального понимания.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Традиционная и общепринятая русская передача библейского личного имени.
- source_word: עִם
  choice: с
  rationale: Предлог обозначает сторону, с которой были установлены мирные отношения.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царём Израиля
  rationale: Сопряжённая конструкция передана естественным русским сочетанием; по контексту имеется в виду правящий царь северного Израильского царства.
