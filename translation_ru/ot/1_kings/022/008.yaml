source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֶֽלֶךְ יִשְׂרָאֵ֣ל אֶֽל יְהוֹשָׁפָ֡ט ע֣וֹד אִישׁ אֶחָ֡ד לִ/דְרֹשׁ֩ אֶת יְהוָ֨ה מֵ/אֹת֜/וֹ וַ/אֲנִ֣י שְׂנֵאתִ֗י/ו כִּ֠י לֹֽא יִתְנַבֵּ֨א עָלַ֥/י טוֹב֙ כִּ֣י אִם רָ֔ע מִיכָ֖יְהוּ בֶּן יִמְלָ֑ה וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט אַל יֹאמַ֥ר הַ/מֶּ֖לֶךְ כֵּֽן־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/008.yaml
  text: 'And the king of Israel said to Jehoshaphat[a], “There is still one more man through whom to inquire of Yahweh, but I hate him, because he does not prophesy good concerning me, but only evil: Micaiah son of Imlah.” And Jehoshaphat said, “Let not the king say so.”'
translation:
  language: ru
  text: 'Царь Израиля сказал Иосафату: «Есть ещё один человек, через которого можно вопросить Яхве[a], но я ненавижу его, потому что он не пророчествует обо мне доброго, а только злое. Это Михей, сын Имлы». Иосафат сказал: «Пусть царь так не говорит».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у которого можно вопросить Яхве».'
    reason: Еврейское מֵאֹתוֹ допускает более буквальное понимание обращения за ответом «у него», тогда как основной текст естественно выражает посредническую роль пророка.
lexical_decisions:
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо стоящее в еврейском тексте, в принятой современной русской форме.
- source_word: עוֹד אִישׁ אֶחָד
  choice: есть ещё один человек
  rationale: «Ещё» сохраняет добавочное значение עוֹד, а сочетание естественно звучит по-русски.
- source_word: לִדְרֹשׁ אֶת־יְהוָה מֵאֹתוֹ
  choice: через которого можно вопросить Яхве
  rationale: В пророческом контексте דָּרַשׁ означает обращение к Богу за ответом, а מֵאֹתוֹ указывает на пророка как посредника; формулировка сохраняет это значение и остаётся понятной.
- source_word: שְׂנֵאתִיו
  choice: я ненавижу его
  rationale: Перфект выражает устойчивое нынешнее отношение Ахава; русское настоящее время передаёт его прямо и естественно.
- source_word: לֹא יִתְנַבֵּא עָלַי טוֹב כִּי אִם רָע
  choice: он не пророчествует обо мне доброго, а только злое
  rationale: Сохраняются отрицание, значение עָלַי «обо мне» и исключительная конструкция כִּי אִם «а только»; «злое» не сужает неоднозначное רָע до одного лишь бедствия.
- source_word: מִיכָיְהוּ בֶּן־יִמְלָה
  choice: Михей, сын Имлы
  rationale: Использованы укоренившиеся русские библейские формы имён и ясно передан патроним.
- source_word: אַל יֹאמַר הַמֶּלֶךְ כֵּן
  choice: Пусть царь так не говорит
  rationale: Конструкция с אַל и юссивом передаёт запрет в почтительной придворной форме; третье лицо оригинала сохранено.
theological_decisions:
- issue: Передача тетраграмматона יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте употреблено личное имя Бога; его транслитерация сохраняет прямую заветную отсылку, не подменяя имя титулом.
- issue: Характер предсказываемого רָע
  choice: злое
  alternative: беду
  rationale: «Злое» сохраняет широкое значение еврейского слова и жалобу царя, не решая без достаточных оснований, идёт ли речь исключительно о несчастье или бедствии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Реплики ясны обычному читателю; уважительное обращение Иосафата передано третьим лицом, как в еврейском тексте. Точка после представления Михея предпочтена двоеточию ради естественного русского синтаксиса.
