base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/036.yaml
  text: And a cry passed through the camp at sunset[a], saying, “Each man to his city[b], and each man to his land!”
translation:
  language: ru
  text: 'И по всему стану на закате разнёсся клич[a]: «Каждый — в свой город, каждый — в свою землю!»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «возглас», «громкий крик» или «объявление». Еврейское слово רִנָּה обозначает громкий, звонкий крик; здесь речь идёт об объявлении, распространившемся по всему стану.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Каждый — в свой город, и каждый — в свою землю». Это формула роспуска войска после сражения.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: разнёсся
  rationale: Глагол עבר здесь описывает распространение клича по стану; «разнёсся» естественно передаёт движение громкого сообщения среди людей.
- source_word: הָרִנָּה
  choice: клич
  rationale: רִנָּה обозначает громкий, далеко слышный возглас; в данном контексте это не радостное пение, а общее объявление войску.
- source_word: בַּמַּחֲנֶה
  choice: по всему стану
  rationale: В сочетании с עבר предлог указывает на распространение клича внутри всего военного стана.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: на закате
  rationale: Оборот с «приходом солнца» является обычным древнееврейским обозначением захода солнца.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: Инфинитив вводит содержание клича; в современном русском его естественно передать пунктуационным оформлением прямой речи без отдельного «говоря».
- source_word: אִישׁ ... וְאִישׁ
  choice: каждый ... каждый
  rationale: Повтор сохранён ради распределительного смысла и параллелизма; военный контекст ясно указывает на воинов, поэтому добавлять слово «мужчина» по-русски не требуется.
- source_word: אֶל עִירוֹ
  choice: в свой город
  rationale: עִיר прямо означает город; возвратное «свой» естественно передаёт притяжательный суффикс третьего лица.
- source_word: וְאִישׁ אֶל אַרְצוֹ
  choice: каждый — в свою землю
  rationale: אֶרֶץ здесь означает родную или принадлежащую человеку территорию; «земля» сохраняет широту исходного слова и формульный параллелизм.
theological_decisions: []
