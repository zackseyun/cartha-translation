base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/010.yaml
  text: The king of Israel and Jehoshaphat king of Judah were sitting[a], each on his throne, clothed in garments, at the threshing floor at the entrance of the gate of Samaria, and all the prophets were prophesying before them.
translation:
  language: ru
  text: Царь Израиля и Иосафат, царь Иудеи, сидели — каждый на своём престоле, облачённые в одежды, — на гумне у входа в ворота Самарии, а все пророки пророчествовали перед ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֶלֶךְ יִשְׂרָאֵל
  choice: Царь Израиля
  rationale: Начальный ו связывает стих с контекстом, но в русском повествовании отдельный союз здесь необязателен; временного значения «теперь» в источнике нет.
- source_word: וִיהוֹשָׁפָט מֶלֶךְ יְהוּדָה
  choice: и Иосафат, царь Иудеи
  rationale: Сохранены имя и приложение с царским титулом; запятые соответствуют нормам современного русского языка.
- source_word: יֹשְׁבִים
  choice: сидели
  rationale: Причастная форма описывает продолжающееся положение обоих царей; русское несовершенное прошедшее передаёт этот фоновый характер.
- source_word: אִישׁ עַל כִּסְאוֹ
  choice: каждый на своём престоле
  rationale: אִישׁ употреблено дистрибутивно, а כִּסֵּא в царском контексте означает престол.
- source_word: מְלֻבָּשִׁים בְּגָדִים
  choice: облачённые в одежды
  rationale: Передано буквально без добавления «царские», которого в еврейском тексте нет; «облачённые» сохраняет достоинство придворной сцены.
- source_word: בְּגֹרֶן
  choice: на гумне
  rationale: גֹּרֶן обозначает площадку для молотьбы; традиционное русское «гумно» точно и уместно в библейском повествовании.
- source_word: פֶּתַח שַׁעַר שֹׁמְרוֹן
  choice: у входа в ворота Самарии
  rationale: Естественная русская передача конструктивной цепочки при сохранении пространственного смысла.
- source_word: וְכָל הַנְּבִיאִים
  choice: а все пророки
  rationale: Союз «а» естественно переводит смену фокуса от царей к пророкам, не создавая смыслового противопоставления.
- source_word: מִתְנַבְּאִים
  choice: пророчествовали
  rationale: Форма Hitpael глагола נבא здесь обозначает продолжающееся пророческое действие.
- source_word: לִפְנֵיהֶם
  choice: перед ними
  rationale: Точная и естественная передача присутствия пророков перед царями.
