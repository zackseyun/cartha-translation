source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יֵּ֗לֶךְ בְּ/דֶ֤רֶךְ אָבִי/ו֙ וּ/בְ/דֶ֣רֶךְ אִמּ֔/וֹ וּ/בְ/דֶ֨רֶךְ֙ יָרָבְעָ֣ם בֶּן נְבָ֔ט אֲשֶׁ֥ר הֶחֱטִ֖יא אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/053.yaml
  text: And he did what was evil in the eyes of Yahweh and walked in the way of his father, and in the way of his mother, and in the way of Jeroboam son of Nebat, who caused Israel to sin.
translation:
  language: ru
  text: Он делал зло в глазах Яхве и шёл путём своего отца, путём своей матери и путём Иеровоама, сына Навата, который ввёл Израиль в грех.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ הָרַע
  choice: делал зло
  rationale: Устойчивое сочетание עשה с הרע обозначает совершение зла; русское «делал зло» естественно и сохраняет лаконичность еврейской формулы.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохранён образный еврейский оборот, выражающий нравственную оценку поступков Богом.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой научной транслитерацией, а не заменено титулом.
- source_word: וַיֵּלֶךְ בְּדֶרֶךְ
  choice: шёл путём
  rationale: Сохранена метафора жизненного поведения; выражение естественно для современного литературного русского языка.
- source_word: אָבִיו ... אִמּוֹ
  choice: своего отца ... своей матери
  rationale: Возвратное притяжательное местоимение «свой» ясно соотносит родителей с подлежащим и звучит естественно по-русски.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоама, сына Навата
  rationale: Использованы устоявшиеся русские библейские формы имён; патроним сохранён явно.
- source_word: הֶחֱטִיא אֶת יִשְׂרָאֵל
  choice: ввёл Израиль в грех
  rationale: Порода хифиль выражает причинение; формулировка передаёт, что Иеровоам побудил народ грешить, не подразумевая принуждения, устраняющего ответственность Израиля.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст содержит собственное имя Бога. Его передача как «Яхве» сохраняет различие между именем и титулом.
- issue: Причинное значение הֶחֱטִיא
  choice: который ввёл Израиль в грех
  alternative: который заставил Израиль грешить
  rationale: Выбранный вариант сохраняет причинную роль Иеровоама, но не усиливает её до прямого принуждения и тем самым не снимает нравственной ответственности с Израиля.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Трёхкратный повтор «путём» сохранён ради риторического акцента оригинала; синтаксис слегка упорядочен для естественного русского звучания.
