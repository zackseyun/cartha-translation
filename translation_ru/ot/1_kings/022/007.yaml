  text: וַ/יֹּ֨אמֶר֙ יְה֣וֹשָׁפָ֔ט הַ/אֵ֨ין פֹּ֥ה נָבִ֛יא לַ/יהוָ֖ה ע֑וֹד וְ/נִדְרְשָׁ֖ה מֵ/אוֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/007.yaml
  text: But Jehoshaphat said[a], “Is there not still here a prophet of Yahweh, that we may inquire of him?”
translation:
  language: ru
  text: 'Но Иосафат сказал[a]: «Разве нет здесь ещё пророка Яхве, чтобы нам вопросить его?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Разве нет здесь другого пророка Яхве, чтобы нам вопросить его?»'
    reason: Слово עוֹד может означать «ещё, всё ещё», а в данном контексте также допускать смысл дополнительного, другого пророка.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Но … сказал
  rationale: Последовательная форма продолжает повествование, а союз «но» естественно передаёт противопоставление предыдущему обращению к другим пророкам.
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Употреблена традиционная русская библейская форма имени.
- source_word: הַאֵין
  choice: Разве нет
  rationale: Отрицательный вопрос предполагает или ищет подтверждение и в современном русском естественно передаётся оборотом «разве нет».
- source_word: פֹּה
  choice: здесь
  rationale: Прямое и естественное соответствие локативному наречию.
- source_word: נָבִיא לַיהוָה
  choice: пророка Яхве
  rationale: 'Ламед обозначает принадлежность или связь: речь идёт о пророке, представляющем Яхве.'
- source_word: עוֹד
  choice: ещё
  rationale: Сохраняет смысл наличия кого-либо помимо уже выступивших пророков, не устраняя возможный оттенок «всё ещё».
- source_word: וְנִדְרְשָׁה
  choice: чтобы нам вопросить
  rationale: Когортатив первого лица множественного числа передаёт намерение; придаточное цели естественно связано с предшествующим вопросом.
- source_word: מֵאוֹתוֹ
  choice: через него
  rationale: Буквально «от него»; в данном контексте пророк выступает посредником при обращении за ответом к Яхве, поэтому «через него» ясно передаёт функцию, не называя самого пророка окончательным источником ответа.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Тетраграмматон передан как личное заветное имя «Яхве», а не заменён титулом; это соответствует прямому употреблению имени в еврейском тексте.
- issue: Посредническая роль пророка в выражении מֵאוֹתוֹ
  choice: вопросить через него
  alternative: вопросить его
  rationale: Выбранный вариант показывает, что пророк служит посредником при вопрошании Яхве. Альтернатива возможна лексически, но может представить пророка непосредственным источником ответа.
translation_notes:
  register: Современный литературный русский с сохранением достоинства библейского повествования. «Вопросить» несколько возвышенно, но понятно и уместно в контексте обращения за Божьим ответом; синтаксис вопроса остаётся естественным.
