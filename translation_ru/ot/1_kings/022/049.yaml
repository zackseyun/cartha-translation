- from: Иосафат построил фарсисские корабли[a], чтобы отправиться в Офир за золотом, но они не отплыли, потому что разбились[b] в Ецион-Гевере.
  to: Иосафат построил фарсисские корабли[a] для плавания в Офир за золотом, но они не отплыли, потому что потерпели крушение[b] в Ецион-Гевере.
  rationale: Замена «чтобы отправиться» на «для плавания» сохраняет целевое значение еврейского инфинитива и исключает ложное впечатление, будто в Офир намеревался отправиться сам Иосафат. «Потерпели крушение» точно передаёт пассивное значение «были разбиты» в морском контексте. Сноска о фарсисских кораблях уточнена, чтобы сохранить исходную неоднозначность без добавления направления плавания.
