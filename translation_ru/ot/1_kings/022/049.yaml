base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/049.yaml
  text: Jehoshaphat made ships of Tarshish to go to Ophir for gold[a], but they did not go[b], because the ships were wrecked at Ezion-geber.
translation:
  language: ru
  text: Иосафат построил фарсисские корабли[a] для плавания в Офир за золотом, но они не отплыли, потому что потерпели крушение[b] в Ецион-Гевере.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «корабли Фарсиса»; возможно, так назывался тип больших морских судов, а не корабли, непосредственно связанные с Фарсисом.'
    reason: lexical_alternative
  - marker: b
    text: В еврейском тексте — «разбился» (единственное число); по смыслу форма относится ко всем кораблям, рассматриваемым как единый флот.
    reason: lexical_alternative
lexical_decisions:
- source_word: עשר
  choice: построил
  rationale: По контексту согласные понимаются как глагольная форма со значением «сделал, подготовил»; в сочетании с кораблями естественный русский эквивалент — «построил».
- source_word: אֳנִיּוֹת תַּרְשִׁישׁ
  choice: фарсисские корабли
  rationale: Сохраняется традиционное конструктивное сочетание, которое может обозначать как корабли, связанные с Фарсисом, так и особый класс больших морских судов; неоднозначность отмечена в сноске.
- source_word: לָלֶכֶת אוֹפִירָה
  choice: чтобы отправиться в Офир
  rationale: Инфинитив выражает цель, а направительный суффикс при названии Офира — пункт назначения. «Отправиться» естественно передаёт начало морского пути, не добавляя излишних деталей.
- source_word: לַזָּהָב
  choice: за золотом
  rationale: Предлог ל обозначает цель путешествия; русское «за золотом» кратко и ясно передаёт намерение добыть или привезти золото.
- source_word: וְלֹא הָלָךְ
  choice: но они не отплыли
  rationale: Хотя еврейский глагол стоит в единственном числе, по смыслу речь идёт о кораблях как о едином флоте. В морском контексте «не отплыли» звучит естественнее буквального «не пошли».
- source_word: נשברה
  choice: разбились
  rationale: Нифаль глагола שבר означает «быть разбитым, сломанным»; применительно к кораблям современное русское «разбились» точно передаёт кораблекрушение. Грамматическое число оригинала отмечено в сноске.
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: в Ецион-Гевере
  rationale: Предлог ב указывает на место происшествия; с названием населённого пункта или порта русское «в» является естественным.
