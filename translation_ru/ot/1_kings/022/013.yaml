base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/013.yaml
  text: And the messenger who had gone to summon Micaiah spoke to him[a], saying, “Look now, the words of the prophets are with one mouth favorable to the king. Please let your word be like the word of one of them, and speak favorably.”
translation:
  language: ru
  text: 'Вестник, отправившийся позвать Михея, сказал ему: «Вот, слова пророков в один голос[a] благоприятны для царя. Пусть и твоё слово будет как слово одного из них; скажи доброе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «одними устами», то есть единодушно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: вестник
  rationale: В данном повествовательном контексте это человек, посланный за Михеем, а не небесное существо.
- source_word: לִקְרֹא
  choice: позвать
  rationale: Передаёт поручение привести пророка к царю естественным современным русским языком, не усиливая значение до формального приказа.
- source_word: הִנֵּה נָא
  choice: Послушай
  rationale: Естественно передаёт привлечение внимания и увещевательный оттенок сочетания הִנֵּה с частицей נָא.
- source_word: דִּבְרֵי הַנְּבִיאִים
  choice: все пророки… предсказывают
  rationale: Русская глагольная конструкция естественно выражает содержание «слова пророков», а «все» ясно передаёт последующее единодушие.
- source_word: פֶּה אֶחָד
  choice: в один голос
  rationale: Устойчивый русский эквивалент еврейской идиомы «одними устами»; буквальный образ сохранён в сноске.
- source_word: טוֹב אֶל הַמֶּלֶךְ
  choice: предсказывают царю добро
  rationale: Передаёт благоприятное для царя содержание пророческих речей и сохраняет повтор ключевого слова «добро».
- source_word: יְהִי נָא דבריך
  choice: Пусть, пожалуйста, и твоё слово будет
  rationale: Сохраняет единственное число «слово» как обозначение пророческого сообщения и вежливо-увещевательную частицу נָא.
- source_word: כִּדְבַר אַחַד מֵהֶם
  choice: таким же, как слово одного из них
  rationale: Близко следует еврейской конструкции в единственном числе и подчёркивает требование согласовать пророчество с речью остальных.
- source_word: וְדִבַּרְתָּ טּוֹב
  choice: скажи и ты что-нибудь доброе
  rationale: Естественная русская передача призыва произнести благоприятное сообщение; частица «и ты» выявляет требуемое присоединение к общему мнению.
