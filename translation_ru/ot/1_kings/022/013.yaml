- from: 'Вестник, который пошёл позвать Михея, сказал ему: «Послушай, все пророки в один голос[a] предсказывают царю добро. Пусть, пожалуйста, и твоё слово будет таким же, как слово одного из них; скажи и ты что-нибудь доброе».'
