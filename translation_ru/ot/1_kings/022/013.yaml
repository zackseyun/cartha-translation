  terminology: «Вестник» уместно передаёт הַמַּלְאָךְ в данном человеческом контексте; «Михей» — принятая русская форма имени. Идиома «в один голос» удачно передаёт פֶּה אֶחָד, при сохранении буквального образа в сноске.
