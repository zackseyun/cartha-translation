  source_fidelity: 'В целом смысл передан верно: מדובר о человеческом посланце, призыве Михея присоединить своё пророческое слово к единодушно благоприятным для царя словам других пророков. Однако «все пророки… предсказывают» несколько разворачивает и интерпретирует исходное «слова пророков», а «что-нибудь доброе» неоправданно ослабляет прямой призыв «говори доброе».'
