base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/011.yaml
  text: 'Then Zedekiah son of Chenaanah made for himself horns of iron and said, “Thus says the LORD: With these you will gore Aram until you have finished them off.”'
translation:
  language: ru
  text: 'Тогда Седекия, сын Хенааны, сделал себе железные рога и сказал: «Так говорит Господь: этими рогами ты будешь бодать Арам, пока не истребишь их».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַרְנֵי בַרְזֶל
  choice: железные рога
  rationale: Прямо передаёт образ символического пророческого действия и сохраняет конкретность еврейского выражения.
- source_word: תְּנַגַּח
  choice: будешь бодать
  rationale: Глагол буквально описывает действие рогами; русский глагол сохраняет яркий образ исходного текста.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохраняется древнее название страны, а не подменяется современным или пояснительным эквивалентом.
- source_word: עַד כַּלֹּתָם
  choice: пока не истребишь его
  rationale: Инфинитив от כלה с местоименным суффиксом допускает смысл доведения противника до конца; активная конструкция естественна по-русски и согласуется с обращением во втором лице. Единственное число «его» соотносится с Арамом как государством/народом.
theological_decisions:
- issue: Передача формулы כֹּה אָמַר יְהוָה
  choice: «Так говорит Господь»
  alternative: «Так говорит Яхве»
  rationale: Традиционная русская передача тетраграмматона словом «Господь» сохраняет узнаваемую пророческую формулу, не добавляя конфессионального толкования.
- issue: Степень завершённости поражения Арама в עַד כַּלֹּתָם
  choice: «пока не истребишь его»
  alternative: «пока с ним не будет покончено»
  rationale: Активное чтение сохраняет естественного деятеля, выраженного формой второго лица в предыдущем глаголе, но не уточняет способ исполнения сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Синтаксис прост и понятен; буквальный образ бодания железными рогами сохранён.
