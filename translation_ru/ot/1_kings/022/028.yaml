  text: וַ/יֹּ֣אמֶר מִיכָ֔יְהוּ אִם שׁ֤וֹב תָּשׁוּב֙ בְּ/שָׁל֔וֹם לֹֽא דִבֶּ֥ר יְהוָ֖ה בִּ֑/י וַ/יֹּ֕אמֶר שִׁמְע֖וּ עַמִּ֥ים כֻּלָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/028.yaml
  text: And Micaiah said[a], “If you indeed return in peace, Yahweh has not spoken by me.” And he said, “Hear[b], all you peoples!”
translation:
  language: ru
  text: 'И Михей сказал: «Если ты действительно возвратишься с миром, то Яхве не говорил через меня[a]». И он сказал: «Слушайте, все народы![b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно также: «Яхве не говорил мною». Смысл в том, что пророк выступает посредником Божьей речи.'
    reason: lexical_alternative
  - marker: b
    text: 'В еврейском тексте слово «народы» стоит во множественном числе: это широкий публичный призыв, а не обращение лишь к одной группе.'
    reason: cultural_note
lexical_decisions:
- source_word: מִיכָיְהוּ
  choice: Михей
  rationale: Устоявшаяся русская форма библейского имени, соответствующая еврейскому מִיכָיְהוּ.
- source_word: אִם שׁוֹב תָּשׁוּב
  choice: Если ты действительно возвратишься
  rationale: Сочетание инфинитива абсолютного с личной формой глагола усиливает условие; «действительно» естественно передаёт это усиление по-русски.
- source_word: בְּשָׁלוֹם
  choice: с миром
  rationale: Сохраняет еврейский образ возвращения целым и невредимым; в данном контексте речь идёт о благополучном возвращении с войны.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, прямо представленное тетраграмматоном в еврейском тексте.
- source_word: לֹא דִבֶּר יְהוָה בִּי
  choice: Яхве не говорил через меня
  rationale: Предлог בְּ в пророческом контексте указывает на человека как посредника Божьей речи; «через меня» ясно и естественно выражает этот смысл.
- source_word: שִׁמְעוּ
  choice: Слушайте
  rationale: Форма повелительного наклонения представляет собой публичный призыв внимать свидетельству пророка; современное «слушайте» сохраняет его силу.
- source_word: עַמִּים כֻּלָּם
  choice: все народы
  rationale: Существительное עַמִּים стоит во множественном числе, поэтому перевод не сужает обращение до одного народа.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Исходный текст употребляет личное имя Бога; транслитерация сохраняет это различие и не заменяет имя титулом.
- issue: Кто произносит заключительный призыв וַיֹּאמֶר
  choice: Михей остаётся говорящим; буквально сохранено «И он сказал»
  alternative: Считать слова редакционной вставкой или репликой другого лица
  rationale: Ближайшим названным субъектом остаётся Михей. Вместе с тем местоименная формулировка не добавляет в текст имени там, где еврейский оригинал его повторно не называет.
- issue: Условный характер пророческого утверждения
  choice: «Если… то Яхве не говорил через меня»
  alternative: Переформулировать как прямое предсказание смерти Ахава
  rationale: Перевод сохраняет условную форму и присущую ей риторическую напряжённость, не превращая высказывание в более прямое утверждение, чем в оригинале.
translation_notes:
  register: Современный литературный русский язык с достойной пророческой интонацией. Синтаксический повтор «И он сказал» сохранён ради близости к еврейскому повествованию и во избежание излишнего уточнения роли заключительной реплики.
