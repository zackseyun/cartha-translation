base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/004.yaml
  text: And he said to Jehoshaphat[a], “Will you go with me to battle at Ramoth-gilead?” And Jehoshaphat said to the king of Israel, “I am as you are, my people as your people, my horses as your horses.”
translation:
  language: ru
  text: 'И сказал он Иосафату: «Пойдёшь ли ты со мной на войну к Рамоту-Галааду?» Иосафат сказал царю Израиля: «Я — как ты, мой народ — как твой народ, мои кони — как твои кони».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Можно также передать: «Я такой же, как ты; мой народ такой же, как твой народ, и мои кони — как твои кони». В еврейском тексте это краткая безглагольная формула солидарности и союза.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵלֵךְ אִתִּי
  choice: Пойдёшь ли ты со мной
  rationale: Вопросительная частица с формой глагола הלך передаёт прямой вопрос о готовности пойти вместе; «со мной» точно выражает сопровождение.
- source_word: לַמִּלְחָמָה רָמֹת גִּלְעָד
  choice: воевать за Рамот-Галаад
  rationale: Оборот обозначает совместный военный поход к названному городу. В данном контексте речь идёт о попытке вернуть Рамот-Галаад; «воевать за» естественно по-русски передаёт цель похода, не перегружая фразу.
- source_word: רָמֹת גִּלְעָד
  choice: Рамот-Галаад
  rationale: Транслитерация следует масоретскому еврейскому наименованию и сохраняет составной топоним; дефис помогает воспринимать его как единое название.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царю Израиля
  rationale: Формально и естественно передаёт сопряжённую конструкцию со значением определённости, ясным из контекста.
- source_word: כָּמוֹנִי כָמוֹךָ
  choice: Я — как ты
  rationale: Сохранена краткая безглагольная сравнительная конструкция, выражающая солидарность и союзническую готовность.
- source_word: כְּעַמִּי כְעַמֶּךָ
  choice: мой народ — как твой народ
  rationale: Сохраняет параллелизм и лаконичность еврейской безглагольной фразы.
- source_word: כְּסוּסַי כְּסוּסֶיךָ
  choice: мои кони — как твои кони
  rationale: Конкретное существительное «кони» передано буквально; замена на «конницу» или «войско» чрезмерно истолковывала бы военный смысл.
theological_decisions:
- issue: Смысл трёхчастной формулы Иосафата
  choice: 'Сохранить образную и синтаксическую краткость: «Я — как ты, мой народ — как твой народ, мои кони — как твои кони».'
  alternative: 'Развернуть как обещание: «Я с тобой; мой народ и мои кони в твоём распоряжении».'
  rationale: Еврейский текст выражает полную солидарность и союз, но не формулирует прямо передачу войска в распоряжение царя; буквальная сравнительная форма сохраняет эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественной, но доступной повествовательной интонацией. Тире передают безглагольность и ритмический параллелизм оригинала; архаизмы не используются.
