  text: וַ/יִּקְרָא֙ מֶ֣לֶךְ יִשְׂרָאֵ֔ל אֶל סָרִ֖יס אֶחָ֑ד וַ/יֹּ֕אמֶר מַהֲרָ֖/ה מִיכָ֥יְהוּ בֶן יִמְלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/009.yaml
  text: Then the king of Israel called one officer and said[a], “Bring Micaiah son of Imlah quickly.”
translation:
  language: ru
  text: 'Тогда царь Израиля позвал одного придворного[a] и сказал: «Скорее приведи Михея, сына Имлы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейское слово сарис может означать «евнух» или, шире, «царский служащий, придворный». Здесь, вероятнее всего, имеется в виду служебное положение.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: позвал
  rationale: В данном повествовательном контексте קרא означает позвать или призвать кого-либо; «позвал» естественно передаёт действие царя без излишнего усиления.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямое соответствие еврейской сопряжённой конструкции; определённость ясна из контекста.
- source_word: אֶל סָרִיס אֶחָד
  choice: одного придворного
  rationale: סָרִיס может обозначать как евнуха, так и царского служащего. Здесь на первом плане служебная роль, поэтому в основном тексте выбрано понятное современному читателю слово «придворный», а лексическая неоднозначность отмечена в сноске.
- source_word: מַהֲרָה
  choice: Скорее приведи
  rationale: Форма от מהר выражает срочность. В еврейском повелении глагол действия подразумевается; по-русски для ясности естественно добавить «приведи».
- source_word: מִיכָיְהוּ
  choice: Михея
  rationale: Использована традиционная русская библейская форма имени Михей, поставленная в требуемый синтаксисом винительный падеж.
- source_word: בֶן יִמְלָה
  choice: сына Имлы
  rationale: Стандартное русское выражение патронима, соответствующее еврейской конструкции «сын Имлы».
