source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר אֵצֵא֙ וְ/הָיִ֨יתִי֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאָ֑י/ו וַ/יֹּ֗אמֶר תְּפַתֶּה֙ וְ/גַם תּוּכָ֔ל צֵ֖א וַ/עֲשֵׂה כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/022.yaml
  text: And he said[a], ‘I will go out and be a lying spirit in the mouth of all his prophets.’ And he said, ‘You will entice him, and you will also prevail[b]. Go out and do so.’
translation:
  language: ru
  text: 'И он сказал: «Я выйду и стану духом лжи[a] в устах всех его пророков». И Он сказал: «Ты склонишь его[b] и в этом также преуспеешь. Выйди и сделай так».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духом неправды».'
    reason: Лексическая альтернатива для רוּחַ שֶׁקֶר, где שֶׁקֶר может обозначать ложь, неправду или обман.
  - marker: b
    text: 'Или: «обманешь его» или «уговоришь его». Еврейский глагол в зависимости от контекста может означать склонение, убеждение, обольщение или обман.'
    reason: Лексическая многозначность глагола פתה сохранена в примечании, поскольку основной вариант не исчерпывает всего диапазона значений.
lexical_decisions:
- source_word: אֵצֵא
  choice: Я выйду
  rationale: Форма Qal, 1-е лицо единственного числа, выражает намерение совершить действие; «выйду» естественно передаёт движение и сохраняет перекличку с последующим повелением צֵא.
- source_word: וְהָיִיתִי
  choice: и стану
  rationale: В данном контексте היה указывает на принятие духом определённой роли; русское «стану» естественнее, чем буквальное «буду».
- source_word: רוּחַ שֶׁקֶר
  choice: духом лжи
  rationale: Сочетание характеризует дух через ложь. Формулировка близка к еврейской и звучит естественно и достойно по-русски, не снимая напряжения повествования.
- source_word: בְּפִי
  choice: в устах
  rationale: Сохранён еврейский образ речи, исходящей из уст пророков; «в устах» понятно современному читателю и соответствует литературному регистру.
- source_word: כָּל נְבִיאָיו
  choice: всех его пророков
  rationale: Передана полнота, выраженная כָּל, а местоименный суффикс 3-го лица мужского рода — словом «его».
- source_word: תְּפַתֶּה
  choice: Ты склонишь его
  rationale: Piel от פתה может обозначать склонение, обольщение, убеждение или обман. «Склонишь» сохраняет идею побуждения к избранному пути, не сводя значение только к одному способу воздействия; подразумеваемый объект передан местоимением «его».
- source_word: וְגַם תּוּכָל
  choice: и тебе это удастся
  rationale: יכל здесь выражает способность, которая приведёт к успешному результату. Русская формулировка естественно передаёт обещанный успех; גם отражено соединительной конструкцией в контексте двух утверждений.
- source_word: צֵא
  choice: Выйди
  rationale: Повелительное наклонение от יצא сохраняет словесную перекличку с ранее сказанным «Я выйду».
- source_word: וַעֲשֵׂה כֵן
  choice: и сделай так
  rationale: Естественная русская передача идиоматического повеления עשה כן без архаизации.
theological_decisions:
- issue: Божественное дозволение или поручение в сцене, связанной с обманом
  choice: 'Прямая речь передана без смягчения: дух предлагает стать «духом лжи», а небесный говорящий велит ему выйти и сделать так.'
  alternative: Истолковать слова лишь как пассивное дозволение либо заменить «дух лжи» более мягким выражением.
  rationale: Еврейский текст содержит прямые формы предложения, предсказания успеха и повеления. Перевод сохраняет богословское напряжение между Божьим владычеством и действием вторичного агента, не разрешая его посредством добавленного толкования.
- issue: Определение говорящих по местоимениям
  choice: Первое «он» набрано со строчной буквы, а второе «Он» — с прописной, согласно ближайшему контексту главы, где сначала отвечает дух, затем говорит Господь.
  alternative: Оба местоимения оставить со строчной буквы, сохранив формальную неоднозначность вне контекста.
  rationale: Контекст 1 Царств 22:20–21 ясно различает духа и Господа; прописная буква в русском служит понятным типографическим указанием, не добавляя нового участника или реплики.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «В устах» сохраняет исходный образ без чрезмерной архаики; синтаксис прямой речи остаётся кратким и напряжённым. Все примечания отмечены в основном тексте.
