  text: וַ/יֵּשְׁב֖וּ שָׁלֹ֣שׁ שָׁנִ֑ים אֵ֚ין מִלְחָמָ֔ה בֵּ֥ין אֲרָ֖ם וּ/בֵ֥ין יִשְׂרָאֵֽל׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/001.yaml
  text: For three years they remained without war between Aram and Israel[a][b].
translation:
  language: ru
  text: Три года не было войны между Арамом и Израилем.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Три года они жили без войны между Арамом и Израилем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: не было войны (в составе безличной конструкции)
  rationale: Глагол буквально означает «сидели/оставались», но вместе с указанием продолжительности и выражением אֵין מִלְחָמָה описывает сохранявшееся положение дел. По-русски естественнее передать всё предложение безличной конструкцией.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: три года
  rationale: Винительный времени обозначает продолжительность; русская форма «три года» естественно передаёт этот смысл без предлога.
- source_word: אֵין מִלְחָמָה
  choice: не было войны
  rationale: Прямо и ясно передаёт отсутствие войны в течение указанного периода.
- source_word: בֵּין ... וּבֵין
  choice: между ... и ...
  rationale: Нормальная русская конструкция отношений между двумя сторонами без механического повторения предлога.
- source_word: אֲרָם
  choice: Арам
  rationale: Сохраняет еврейское историко-географическое название, не заменяя его более поздним названием «Сирия».
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Устоявшаяся русская передача имени.
