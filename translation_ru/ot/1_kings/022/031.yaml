base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/031.yaml
  text: The king of Aram had commanded the thirty-two chariot commanders who belonged to him[a], saying, “Do not fight with either small or great[c][b], but only with the king of Israel alone.”
translation:
  language: ru
  text: 'А царь Арама приказал тридцати двум своим начальникам колесничного войска: «Не вступайте в бой ни с малым, ни с великим[a], а только с царём Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ни с кем другим — ни с человеком низкого положения, ни с человеком высокого положения.
    reason: Объяснение древнееврейского оборота «малый и великий», охватывающего людей любого ранга или статуса.
lexical_decisions:
- source_word: וּמֶלֶךְ אֲרָם
  choice: А царь Арама
  rationale: Союз ו передан как естественное повествовательное «а», связывающее эпизод с контекстом; אֲרָם сохранено как историческое название «Арам», без традиционной замены на «Сирию».
- source_word: צִוָּה
  choice: приказал
  rationale: Глагол обозначает отданное повеление; русский вид и контекст естественно передают предшествующий приказ без необходимости в особой форме плюсквамперфекта.
- source_word: שָׂרֵי הָרֶכֶב אֲשֶׁר לוֹ
  choice: начальникам своих колесниц
  rationale: שָׂרֵי обозначает военных начальников, а הָרֶכֶב — колесничное войско; притяжательное «своих» естественно передаёт אֲשֶׁר לוֹ.
- source_word: שְׁלֹשִׁים וּשְׁנַיִם
  choice: тридцати двум
  rationale: Точная передача количественного числительного с требуемым русским падежом.
- source_word: לֵאמֹר
  choice: двоеточие перед прямой речью
  rationale: В современном русском формула введения речи естественно выражается пунктуационно, без тяжеловесного «говоря».
- source_word: לֹא תִּלָּחֲמוּ
  choice: Не вступайте в бой
  rationale: Передаёт запретительное значение и ясно обозначает враждебное военное действие.
- source_word: אֶת קָטֹן וְאֶת גָּדוֹל
  choice: ни с малым, ни с великим
  rationale: Сохранена образная меристическая формула оригинала; по смыслу речь идёт о людях любого положения.
- source_word: כִּי אִם אֶת מֶלֶךְ יִשְׂרָאֵל לְבַדּוֹ
  choice: а только с царём Израиля
  rationale: «А только» передаёт исключительную конструкцию כִּי אִם; לְבַדּוֹ выражено словом «только», поэтому добавление «одним» было бы стилистически избыточным.
