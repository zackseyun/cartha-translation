  text: וַ/יִּקְבֹּ֨ץ מֶֽלֶךְ יִשְׂרָאֵ֥ל אֶֽת הַ/נְּבִיאִים֮ כְּ/אַרְבַּ֣ע מֵא֣וֹת אִישׁ֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם הַ/אֵלֵ֞ךְ עַל רָמֹ֥ת גִּלְעָ֛ד לַ/מִּלְחָמָ֖ה אִם אֶחְדָּ֑ל וַ/יֹּאמְר֣וּ עֲלֵ֔ה וְ/יִתֵּ֥ן אֲדֹנָ֖/י בְּ/יַ֥ד הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/006.yaml
  text: Then the king of Israel gathered the prophets[a], about four hundred men, and said to them, “Should I go against Ramoth-gilead for battle, or should I refrain?” And they said, “Go up, and the Lord will give it into the hand of the king.”
translation:
  language: ru
  text: 'Тогда царь Израиля собрал пророков — около четырёхсот человек — и спросил их: «Идти ли мне войной на Рамот-Галаад или воздержаться?» Они ответили: «Иди, и Господь[a] отдаст его в руки царя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мой господин». Еврейское אֲדֹנָי в некоторых контекстах может иметь такое значение, хотя здесь вероятнее божественный титул «Господь».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: собрал
  rationale: Глагол קבץ означает собрать людей вместе; «собрал» естественно и точно передаёт действие.
- source_word: הַנְּבִיאִים
  choice: пророков
  rationale: Обычное значение נביאים; контекст описывает созванных царём пророков.
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: около четырёхсот человек
  rationale: Предлог כ указывает на приблизительность числа, а אִישׁ прямо обозначает людей.
- source_word: הַאֵלֵךְ
  choice: идти ли мне
  rationale: Вопросительная частица с формой первого лица выражает обдумываемый вопрос; русская конструкция сохраняет совещательный оттенок.
- source_word: עַל רָמֹת גִּלְעָד לַמִּלְחָמָה
  choice: идти ли мне войной на Рамот-Галаад
  rationale: Сочетание עַל и לַמִּלְחָמָה обозначает военное выступление против города; «идти войной на» естественно передаёт эту направленность.
- source_word: אִם אֶחְדָּל
  choice: или воздержаться
  rationale: חדל означает перестать, удержаться или отказаться от действия; «воздержаться» сохраняет лаконичность вопроса.
- source_word: עֲלֵה
  choice: иди
  rationale: Буквально повелительное «поднимись / иди вверх» употреблено как военный призыв выступить; в русском «иди» звучит естественно без утраты смысла.
- source_word: אֲדֹנָי
  choice: Господь
  rationale: В данном пророческом заверении форма вероятнее всего служит божественным титулом. Она не является именем יהוה, поэтому передана как «Господь», а не специальным оформлением имени; возможное чтение «мой господин» отмечено в сноске.
- source_word: בְּיַד הַמֶּלֶךְ
  choice: в руки царя
  rationale: Еврейская идиома буквально говорит о передаче «в руку», то есть под власть; русское множественное «в руки» является соответствующей понятной идиомой.
theological_decisions:
- issue: Значение אֲדֹנָי в ответе пророков
  choice: Господь
  alternative: мой господин
  rationale: Контекст пророческого обещания поддерживает понимание слова как божественного титула, но сама еврейская форма допускает обращение или обозначение «мой господин». Неоднозначность сохранена в сноске, а не устранена без пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Тире ненавязчиво выделяют пояснение о числе пророков. Топоним передан близко к еврейской форме как «Рамот-Галаад». Местоимение «его» подразумевает названный город, как требует контекст, хотя прямое дополнение в еврейском тексте не выражено.
