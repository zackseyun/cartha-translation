source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֨ה נָתַ֤ן יְהוָה֙ ר֣וּחַ שֶׁ֔קֶר בְּ/פִ֖י כָּל נְבִיאֶ֣י/ךָ אֵ֑לֶּה וַֽ/יהוָ֔ה דִּבֶּ֥ר עָלֶ֖י/ךָ רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/023.yaml
  text: And now[a], behold, Yahweh has put a lying spirit in the mouth of all these prophets of yours[b], and Yahweh has spoken disaster against you.
translation:
  language: ru
  text: 'И теперь вот: Яхве вложил дух лжи в уста всех этих твоих пророков, а Яхве предрёк тебе бедствие.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возвестил против тебя бедствие».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: И теперь
  rationale: Передаёт и соединительную функцию וְ, и временно-дейктическое значение עַתָּה, продолжая речь естественным русским оборотом.
- source_word: הִנֵּה
  choice: вот
  rationale: Привлекает особое внимание и сохраняет торжественную пророческую интонацию без архаичного «се».
- source_word: נָתַן
  choice: вложил
  rationale: В сочетании с «духом» и «устами» это естественный русский эквивалент со значением помещения; он не смягчает прямое указание на действие Яхве.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога, представленное тетраграмматоном в еврейском тексте.
- source_word: רוּחַ שֶׁקֶר
  choice: дух лжи
  rationale: Сохраняет конструкцию «существительное + определяющее существительное» и допускает как характеристику духа ложью, так и его связь с обманной речью.
- source_word: בְּפִי
  choice: в уста
  rationale: Естественно передаёт еврейский образ помещения речи в уста; единственное число в источнике имеет распределительное значение при множественной группе пророков.
- source_word: כָּל נְבִיאֶיךָ אֵלֶּה
  choice: всех этих твоих пророков
  rationale: Сохраняет всеобщность, указательное выделение «этих» и обращённое к Ахаву притяжательное местоимение.
- source_word: דִּבֶּר עָלֶיךָ רָעָה
  choice: предрёк тебе бедствие
  rationale: Глагол «предрёк» естественно выражает объявление Яхве о грядущем, а «бедствие» передаёт רָעָה как пагубный суд, не как нравственное зло.
theological_decisions:
- issue: Действие Яхве по отношению к духу лжи
  choice: Яхве вложил дух лжи
  alternative: Яхве допустил дух лжи
  rationale: Еврейское נָתַן прямо обозначает действие, а не только разрешение. Перевод сохраняет богословское напряжение текста и не заменяет утверждение толкованием.
- issue: Значение רָעָה применительно к слову Яхве
  choice: бедствие
  alternative: зло
  rationale: В данном контексте речь идёт о грядущем пагубном суде над Ахавом, а не о нравственном зле со стороны Яхве.
- issue: Смысл דִּבֶּר עָלֶיךָ
  choice: предрёк тебе
  alternative: возвестил против тебя
  rationale: Выбран естественный русский оборот, сохраняющий значение произнесённого Богом слова о бедствии; формальное «против тебя» возможно, но менее естественно в сочетании с «бедствием».
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. «Вот» предпочтено архаичному «се»; прямое действие Яхве не смягчено до дозволения. Порядок слов сохраняет акцент на «всех этих твоих пророках».
