base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/051.yaml
  text: And Jehoshaphat slept with his fathers and was buried with his fathers in the city of David his father[b][a], and Jehoram his son became king in his place.
translation:
  language: ru
  text: И почил Иосафат с отцами своими[a], и был погребён с отцами своими в городе Давида, своего предка[b]. И вместо него стал царём его сын Иорам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лёг с отцами своими» — обычное древнееврейское выражение, означающее смерть.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «своего отца». Еврейское слово «отец» может обозначать также праотца или предка.'
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: В царской некрологической формуле глагол שׁכב в сочетании «с отцами» означает смерть. Русское «почил» сохраняет образ и торжественный характер формулы, оставаясь понятным без буквального и менее естественного «уснул».
- source_word: עִם אֲבֹתָיו
  choice: с отцами своими
  rationale: Сохранена традиционная династическая формула, соответствующая еврейскому тексту; её значение поясняется в сноске.
- source_word: וַיִּקָּבֵר
  choice: был погребён
  rationale: Страдательная форма точно передаёт нифаль и не добавляет отсутствующей в источнике конкретики о виде погребения.
- source_word: בְּעִיר דָּוִד
  choice: в городе Давида
  rationale: Естественная русская форма устойчивого географического наименования, точно передающая сопряжённую конструкцию.
- source_word: אָבִיו
  choice: своего предка
  rationale: Здесь Давид не непосредственный отец Иосафата, поэтому современное русское «предок» ясно передаёт широкий генеалогический смысл еврейского אָב и избегает фактического недоразумения.
- source_word: וַיִּמְלֹךְ
  choice: стал царём
  rationale: В данном контексте глагол обозначает вступление на престол, а не длительность царствования.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Фраза выражает преемство и замещение на царском престоле; «вместо него» естественно и близко к исходному выражению.
