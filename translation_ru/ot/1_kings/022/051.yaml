translation_notes:
  register: Современный литературный русский с умеренно торжественным регистром царской хроники. Архаизирующий оборот «почил с отцами своими» сохранён как понятная библейская формула; более широкий смысл слова «отец» передан в тексте словом «предок», а буквальная форма отмечена в сноске.
