  yaml_path: translation/ot/1_kings/022/033.yaml
  text: And it happened[a], when the commanders of the chariots saw that he was not the king of Israel, they turned back from pursuing him.
translation:
  language: ru
  text: Когда начальники колесничного войска увидели, что это не царь Израиля, они прекратили его преследовать.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «повернули назад, перестав следовать за ним»; еврейское выражение означает, что они прекратили следовать за ним или преследовать его.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Когда
  rationale: В сочетании с последующей временной конструкцией вводит очередное событие повествования; отдельное «и случилось» по-русски было бы тяжеловесным и не добавляло бы смысла.
- source_word: כִּרְאוֹת
  choice: когда … увидели
  rationale: Инфинитивная конструкция с כְּ обозначает временное обстоятельство; такой перевод естественен в современном русском языке.
- source_word: שָׂרֵי הָרֶכֶב
  choice: начальники колесничного войска
  rationale: שָׂרֵי — военные начальники, а הָרֶכֶב здесь может обозначать не только отдельные колесницы, но и колесничное подразделение; выбранный вариант ясно передаёт военный контекст.
- source_word: כִּי לֹא מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: что это не царь Израиля
  rationale: Придаточное передаёт содержание увиденного; русское «это не царь» естественно указывает на опознание человека, не меняя референции мужского местоимения הוּא.
- source_word: וַיָּשׁוּבוּ מֵאַחֲרָיו
  choice: они прекратили его преследовать
  rationale: Буквально сочетание означает, что они повернули назад, перестав двигаться за ним; в военном контексте идиоматический перевод точно передаёт прекращение погони.
