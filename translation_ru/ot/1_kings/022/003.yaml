  source_fidelity: 'В целом текст верно передаёт синтаксис и смысл: царь обращается к своим придворным/слугам, напоминает о Рамот-Галааде как об израильском владении или притязании и укоряет за бездействие. «Ничего не делаем» удачно передаёт контекстуальный смысл מַחְשִׁים. Однако «отнять» добавляет оттенок неправомерного лишения, которого לקח само по себе не требует; нейтральное «взять» точнее. Сноска a также должна сохранять значение конструкции מִקַּחַת — «не беря/не взяв», а не вводить «вместо того чтобы».'
