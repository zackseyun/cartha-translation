  to: 'И царь Израиля сказал своим слугам: «Знаете ли вы, что Рамот-Галаад принадлежит нам, а мы ничего не делаем, чтобы взять его из рук царя Арама?»'
  rationale: Заменено «отнять его у» на нейтральное «взять его из рук», чтобы не вносить в לקח оттенок неправомерного лишения и одновременно сохранить образ מִיַּד. Реплика оформлена как единый риторический вопрос, в соответствии с оригиналом. Сноска a уточнена, чтобы буквальная альтернатива не подменяла конструкцию «молчать, не беря». Маркеры сносок должны быть поставлены после «делаем» и «Арама» соответственно.
