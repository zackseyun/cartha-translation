base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/003.yaml
  text: And the king of Israel said to his servants[a], “Do you know that Ramoth-gilead belongs to us[b], yet we are doing nothing to take it from the hand of the king of Aram?”
translation:
  language: ru
  text: 'И царь Израиля сказал своим слугам: «Знаете ли вы, что Рамот-Галаад принадлежит нам, а мы ничего не делаем, чтобы взять его из рук царя Арама?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: своим слугам
  rationale: עֶבֶד может обозначать как слугу, так и царского служащего или придворного. «Слугам» сохраняет широкий смысл еврейского слова и привычную царскую лексику, не уточняя должность адресатов.
- source_word: הֲיְדַעְתֶּם
  choice: Знаете ли вы
  rationale: Вопросительная форма с ידע вводит риторический вопрос, основанный на общем для собеседников знании; отрицание в еврейском тексте отсутствует.
- source_word: כִּי לָנוּ רָמֹת גִּלְעָד
  choice: что Рамот-Галаад принадлежит нам
  rationale: Конструкция לָנוּ выражает принадлежность или территориальное притязание. «Принадлежит нам» естественно передаёт её смысл, не утверждая больше, чем говорит царь.
- source_word: רָמֹת גִּלְעָד
  choice: Рамот-Галаад
  rationale: Название передано транслитерацией компонентов еврейского топонима; дефис показывает, что это единое составное название.
- source_word: מַחְשִׁים
  choice: ничего не делаем
  rationale: Причастие от חרש буквально связано с молчанием, но здесь обозначает бездействие в отношении города. Выбранная формулировка естественна по-русски и передаёт оттенок укоризненной пассивности; буквальный образ отмечен в сноске.
- source_word: מִקַּחַת אֹתָהּ
  choice: чтобы отнять его
  rationale: Инфинитив לקח после מַחְשִׁים называет действие, от которого воздерживаются. «Отнять» в сочетании с последующим указанием на царя Арама ясно передаёт возвращение города из чужой власти.
- source_word: מִיַּד
  choice: у
  rationale: Буквально «из руки» — еврейская идиома власти или владения. Русская конструкция «отнять у» естественно передаёт здесь тот же смысл.
- source_word: אֲרָם
  choice: Арама
  rationale: Сохранено древнееврейское название Арам, а не позднейшее географическое соответствие «Сирия».
theological_decisions:
- issue: Характер притязания на Рамот-Галаад
  choice: «принадлежит нам» передаёт заявление царя как его притязание в прямой речи
  alternative: Формулировка могла бы быть понята как авторское подтверждение бесспорного права Израиля
  rationale: Перевод сохраняет силу конструкции לָנוּ, но контекст прямой речи оставляет утверждение словами царя и не добавляет богословской оценки его притязания.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Риторическое высказывание разделено на вопрос и эмоционально окрашенный укор; это делает ход речи естественным, не изменяя её содержания. Топоним и этноним переданы с опорой на еврейскую форму.
