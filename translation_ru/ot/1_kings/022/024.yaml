base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/024.yaml
  text: Then Zedekiah son of Chenaanah came near and struck Micaiah on the cheek and said[a], “Which way did the Spirit of Yahweh pass from me to speak to you?”
translation:
  language: ru
  text: 'Тогда Седекия, сын Хенааны, подошёл, ударил Михея по щеке и сказал[a]: «Каким путём Дух Яхве отошёл от меня, чтобы говорить тебе?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Куда же Дух Яхве ушёл от меня, чтобы говорить тебе?»'
    reason: Еврейское אֵי זֶה допускает как вопрос о конкретном пути («каким путём»), так и более общий вопрос о направлении («куда же»).
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: подошёл
  rationale: Глагол נגשׁ обозначает приближение; «подошёл» естественно передаёт физическое движение и напряжённость сцены.
- source_word: צִדְקִיָּהוּ בֶן כְּנַעֲנָה
  choice: Седекия, сын Хенааны
  rationale: Сохранена обычная русская библейская передача имён и еврейская патронимическая конструкция.
- source_word: וַיַּכֶּה ... עַל הַלֶּחִי
  choice: ударил Михея по щеке
  rationale: נכה — широкий по значению глагол «ударять»; текст не уточняет способ удара, поэтому более конкретное «дал пощёчину» не выбрано. לֶחִי обычно означает «щека».
- source_word: אֵי זֶה
  choice: каким путём
  rationale: Сочетание выражает насмешливый вопрос о пути, которым Дух якобы перешёл от Седекии к Михею; формулировка сохраняет пространственный образ и риторическую остроту.
- source_word: עָבַר
  choice: отошёл
  rationale: В сочетании с מֵאִתִּי глагол передаёт удаление или переход от говорящего. «Отошёл от меня» звучит естественно по-русски и сохраняет саркастическое предположение Седекии.
- source_word: רוּחַ יְהוָה
  choice: Дух Яхве
  rationale: В контексте спора пророков речь идёт о Божьем Духе как источнике пророческой речи; прописная буква уместна, а имя יהוה передано как «Яхве».
- source_word: מֵאִתִּי
  choice: от меня
  rationale: Предложное сочетание прямо обозначает исходную точку движения.
- source_word: לְדַבֵּר אוֹתָךְ
  choice: чтобы говорить с тобой
  rationale: Еврейская конструкция означает обращённую к Михею речь. «Говорить с тобой» естественно по-русски и не добавляет содержания.
theological_decisions:
- issue: Передача רוּחַ יְהוָה
  choice: Дух Яхве
  alternative: дух Яхве / Дух Господа
  rationale: Пророческий контекст поддерживает личностно-божественное понимание слова רוּחַ, однако реплика передаёт саркастическое притязание Седекии, не подтверждая его истинность. Личное имя יהוה сохранено как «Яхве», а не заменено титулом.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Реплика сохранена как резкий саркастический вопрос; архаические обороты и излишняя конкретизация способа удара устранены.
