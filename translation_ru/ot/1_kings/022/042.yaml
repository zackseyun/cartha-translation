base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/042.yaml
  text: Jehoshaphat was thirty-five years old when he began to reign, and he reigned twenty-five years in Jerusalem. And his mother’s name was Azubah daughter of Shilhi.
translation:
  language: ru
  text: Иосафату было тридцать пять лет, когда он стал царём, и двадцать пять лет он царствовал в Иерусалиме. Его мать звали Азува, дочь Шилхи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוֹשָׁפָט
  choice: Иосафат
  rationale: Традиционная и узнаваемая русская форма библейского личного имени, соответствующая еврейскому имени.
- source_word: בֶּן שְׁלֹשִׁים וְחָמֵשׁ שָׁנָה
  choice: было тридцать пять лет
  rationale: Еврейское возрастное выражение буквально означает «сын тридцати пяти лет»; по-русски возраст естественно передаётся конструкцией «ему было… лет».
- source_word: בְּמָלְכוֹ
  choice: когда он стал царём
  rationale: Форма указывает на время вступления на царство; этот вариант точен и естественен в современном русском языке.
- source_word: וְעֶשְׂרִים וְחָמֵשׁ שָׁנָה
  choice: двадцать пять лет
  rationale: Прямое обозначение продолжительности царствования.
- source_word: מָלַךְ
  choice: царствовал
  rationale: Обычная русская передача глагола מלך в царских хронологических формулах.
- source_word: בִּירוּשָׁלָם
  choice: в Иерусалиме
  rationale: Прямая передача предложного оборота с названием места.
- source_word: וְשֵׁם אִמּוֹ
  choice: Его мать звали
  rationale: Естественная современная русская формулировка, сохраняющая содержание стандартной царской формулы.
- source_word: עֲזוּבָה
  choice: Азува
  rationale: Традиционная русская библейская форма личного имени.
- source_word: בַּת שִׁלְחִי
  choice: дочь Шилхи
  rationale: Прямая передача родословного обозначения; имя транслитерировано без перевода.
