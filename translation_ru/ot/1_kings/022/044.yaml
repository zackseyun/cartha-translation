  text: אַ֥ךְ הַ/בָּמ֖וֹת לֹֽא סָ֑רוּ ע֥וֹד הָ/עָ֛ם מְזַבְּחִ֥ים וּֽ/מְקַטְּרִ֖ים בַּ/בָּמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/044.yaml
  text: However[a], the high places were not removed[b]; the people still were sacrificing and burning incense on the high places.
translation:
  language: ru
  text: Однако высоты[a] не были устранены; народ по-прежнему приносил жертвы и воскурял[b] на высотах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «местные святилища». Еврейское слово обозначает местные культовые места, традиционно называемые «высотами».'
    reason: lexical_alternative
  - marker: b
    text: В стихе не уточняется, совершались ли эти жертвоприношения и воскурения Господу в недозволенных местах или были частью более широкого идолопоклонства.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Однако
  rationale: Передаёт противопоставление предшествующей положительной оценке царя и естественно звучит в современном русском языке.
- source_word: הַבָּמוֹת
  choice: высоты
  rationale: Традиционный и исторически точный русский эквивалент для местных культовых мест, нередко расположенных на возвышенностях; пояснение снимает возможную неясность.
- source_word: לֹא סָרוּ
  choice: не были упразднены
  rationale: При подлежащем «высоты» глагол означает, что культовые места не устранили; «упразднены» передаёт прекращение их культового статуса, не создавая образа физического удаления.
- source_word: עוֹד
  choice: по-прежнему
  rationale: Выражает продолжавшуюся обычную практику вопреки реформам.
- source_word: הָעָם
  choice: народ
  rationale: Прямой коллективный эквивалент.
- source_word: מְזַבְּחִים
  choice: приносил жертвы
  rationale: Причастная форма обозначает продолжавшееся или обычное действие; русское прошедшее время с «по-прежнему» естественно передаёт эту длительность.
- source_word: וּמְקַטְּרִים
  choice: и воскурял
  rationale: Культовый термин допускает воскурение благовоний либо превращение приношения в дым; «воскурял» сохраняет формульный культовый смысл и не добавляет явно отсутствующий объект.
- source_word: בַּבָּמוֹת
  choice: на высотах
  rationale: Сохраняет повтор ключевого культового места и традиционное сочетание русского библейского языка.
theological_decisions:
- issue: Характер поклонения на высотах
  choice: Описать жертвоприношения и воскурения, не называя адресата поклонения.
  alternative: Уточнить, что народ либо неправомерно поклонялся Господу вне дозволенного места, либо участвовал в идолопоклонстве.
  rationale: Еврейский текст осуждает сохранение высот, но в этом стихе прямо не указывает, кому приносились жертвы; перевод сохраняет эту богословскую неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной культовой лексикой. «Высоты», «приносил жертвы» и «воскурял» сохраняют историко-религиозный колорит, оставаясь понятными благодаря сноскам.
