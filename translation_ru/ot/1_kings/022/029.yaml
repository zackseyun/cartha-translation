  text: Царь Израиля и Иосафат, царь Иудеи, поднялись к Рамоту-Галааду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: выступили к
  rationale: Глагол עלה буквально означает «подниматься, идти вверх», но при обозначении похода к городу в данном военном контексте естественное русское «выступили к» передаёт движение к цели, не добавляя более конкретного смысла вроде «пошли в наступление».
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Сохранён титул, употреблённый в еврейском тексте вместо личного имени Ахава.
- source_word: וִיהוֹשָׁפָט
  choice: и Иосафат
  rationale: Использована закрепившаяся в русской библейской традиции форма имени, остающаяся понятной современному читателю.
- source_word: מֶלֶךְ יְהוּדָה
  choice: царь Иудеи
  rationale: Приложение после личного имени передано естественной русской конструкцией с повторением титула.
- source_word: רָמֹת גִּלְעָד
  choice: Рамот Галаадский
  rationale: Выбрана традиционная русская форма составного топонима; прилагательное «Галаадский» ясно выражает связь города Рамота с областью Галаад.
