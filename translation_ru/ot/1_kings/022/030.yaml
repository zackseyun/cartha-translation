  text: Then the king of Israel said to Jehoshaphat[a], “Disguise yourself and go into the battle, but you, put on your robes.” So the king of Israel disguised himself and went into the battle.
translation:
  language: ru
  text: 'И сказал царь Израиля Иосафату: «Я переоденусь[a] и вступлю в бой, а ты надень свои одежды». Царь Израиля переоделся и вступил в бой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейскую форму можно понять и как повеление: «Переоденься и вступи в бой». Однако слова «а ты надень свои одежды» и последующее сообщение о том, что переоделся царь Израиля, поддерживают перевод от первого лица.'
    reason: alternative_reading
lexical_decisions:
- source_word: הִתְחַפֵּשׂ
  choice: Я переоденусь
  rationale: Форма допускает повелительное прочтение второго лица, однако контраст с וְאַתָּה («а ты») и последующее сообщение о том, что переоделся именно царь Израиля, поддерживают передачу намерения говорящего от первого лица. «Переоденусь» естественно обозначает изменение внешнего вида ради неузнаваемости.
- source_word: וָבֹא
  choice: и вступлю
  rationale: Продолжает выражение намерения царя; вместе с בַמִּלְחָמָה естественно передаётся по-русски как «вступлю в бой».
- source_word: בַמִּלְחָמָה
  choice: в бой
  rationale: При глаголе движения сочетание обозначает вхождение в сражение; «вступить в бой» — современное и точное русское выражение.
- source_word: וְאַתָּה
  choice: а ты
  rationale: 'Местоимение имеет явное контрастное значение: царь Израиля изменит свой облик, тогда как Иосафат останется узнаваем по одежде.'
- source_word: לְבַשׁ בְּגָדֶיךָ
  choice: надень свои одежды
  rationale: Сохраняет прямое значение глагола «надеть» и общего существительного «одежды», не добавляя отсутствующее в еврейском тексте определение «царские».
- source_word: וַיִּתְחַפֵּשׂ
  choice: переоделся
  rationale: Прямо передаёт возвратное действие и лексически связывает исполнение с ранее высказанным намерением.
- source_word: וַיָּבֹא בַּמִּלְחָמָה
  choice: вступил в бой
  rationale: Сохраняет повтор формулировки из прямой речи и естественно передаёт вход царя в сражение.
