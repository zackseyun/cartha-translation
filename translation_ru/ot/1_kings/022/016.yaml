  text: Then the king said to him[a], “How many times must I make you swear that you tell me nothing but the truth in the name of Yahweh?”
translation:
  language: ru
  text: 'И сказал ему царь: «Сколько ещё раз мне заставлять тебя клясться[a], чтобы ты говорил мне только правду во имя Яхве?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «брать с тебя клятву». Еврейский глагол означает заставлять человека поклясться, приводить его к присяге или налагать на него клятву.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו הַמֶּלֶךְ
  choice: И сказал ему царь
  rationale: Последовательная повествовательная форма естественно передана союзом «и»; титул сохранён в соответствии с еврейским текстом.
- source_word: עַד כַּמֶּה פְעָמִים
  choice: Сколько ещё раз
  rationale: Оборот выражает раздражение из-за повторения; «ещё» естественно передаёт подразумеваемое продолжение ситуации.
- source_word: מַשְׁבִּעֶךָ
  choice: мне брать с тебя клятву
  rationale: Каузативная форма глагола שׁבע означает заставлять кого-либо поклясться или связывать его клятвой. Русский оборот ясен и сохраняет юридико-религиозную силу выражения.
- source_word: אֲשֶׁר לֹא תְדַבֵּר אֵלַי רַק אֱמֶת
  choice: чтобы ты говорил мне только правду
  rationale: Еврейская конструкция буквально ограничивает содержание речи одной истиной; русский вариант сохраняет глагол речи и звучит естественно.
- source_word: בְּשֵׁם יְהוָה
  choice: во имя Яхве
  rationale: Предлог בְּ со словом «имя» указывает на речь с призыванием имени и под его авторитетом; тетраграмматон передан как личное имя «Яхве».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте прямо употреблён тетраграмматон; транслитерация сохраняет личное заветное имя и не заменяет его титулом.
- issue: Сила клятвенного требования царя
  choice: брать с тебя клятву
  alternative: заклинать тебя
  rationale: Выбранный вариант сохраняет смысл возложения клятвы, не привнося возможных магических ассоциаций русского глагола «заклинать».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок слов «сказал ему царь» сохраняет повествовательную достоинственность, а основная реплика остаётся понятной современному читателю.
