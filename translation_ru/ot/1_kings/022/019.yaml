source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ/כֵ֖ן שְׁמַ֣ע דְּבַר יְהוָ֑ה רָאִ֤יתִי אֶת יְהוָה֙ יֹשֵׁ֣ב עַל כִּסְא֔/וֹ וְ/כָל צְבָ֤א הַ/שָּׁמַ֨יִם֙ עֹמֵ֣ד עָלָ֔י/ו מִ/ימִינ֖/וֹ וּ/מִ/שְּׂמֹאלֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/019.yaml
  text: 'Then he said[a], “Therefore hear the word of Yahweh: I saw Yahweh sitting on his throne, and all the host of heaven standing by him[b], on his right and on his left.”'
translation:
  language: ru
  text: 'И сказал он: «Итак, выслушай слово Яхве: я видел Яхве, сидящего на Своём престоле, и всё небесное воинство[a], стоящее при Нём[b], по правую и по левую руку от Него».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё воинство небес».'
    reason: Лексическая альтернатива сохраняет более буквальную конструкцию родительного падежа в еврейском выражении.
  - marker: b
    text: 'Буквально: «стоящее над Ним»; здесь, вероятно, имеется в виду стоящее возле Него, при Нём, как поясняют слова «по правую и по левую руку».'
    reason: Сохраняет буквальное значение עָלָיו и объясняет выбранную контекстуальную передачу, не скрывая неоднозначности.
lexical_decisions:
- source_word: לָכֵן
  choice: Итак
  rationale: Передаёт выводный переход от предшествующего обмена репликами естественно и с должной торжественностью.
- source_word: שְׁמַע
  choice: выслушай
  rationale: Форма единственного числа обращена непосредственно к Ахаву; «выслушай» естественно вводит цельное пророческое слово.
- source_word: דְּבַר יְהוָה
  choice: слово Яхве
  rationale: Сохраняет устойчивую пророческую формулу и передаёт тетраграмматон личным именем.
- source_word: רָאִיתִי
  choice: я видел
  rationale: Простое прошедшее время естественно вводит рассказ Михея о видении.
- source_word: יֹשֵׁב עַל כִּסְאוֹ
  choice: сидящего на Своём престоле
  rationale: Причастная конструкция сохраняет одновременность картины видения и царский образ исходного текста.
- source_word: כָל צְבָא הַשָּׁמַיִם
  choice: всё небесное воинство
  rationale: Сохраняет собирательный и потенциально воинский смысл צבא, не сужая обозначение до одних ангелов.
- source_word: עֹמֵד עָלָיו
  choice: стоящее при Нём
  rationale: В контексте небесного престола выражает присутствие воинства при Царе; сноска сохраняет более буквальный пространственный оттенок предлога.
- source_word: מִימִינוֹ וּמִשְּׂמֹאלוֹ
  choice: по правую и по левую руку от Него
  rationale: Естественная русская формула точно передаёт симметричное расположение с обеих сторон.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст дважды употребляет тетраграмматон; транслитерация сохраняет личное имя Бога, не заменяя его титулом.
- issue: Состав «небесного воинства»
  choice: Не уточнять, что речь исключительно об ангелах
  alternative: все небесные ангелы
  rationale: צבא השמים обозначает небесное собрание или воинство достаточно широко; перевод сохраняет образ небесного двора и не вводит отсутствующее в стихе онтологическое уточнение.
- issue: Положение небесного воинства относительно Яхве
  choice: при Нём
  alternative: над Ним; возле Него
  rationale: Контекст престольного зала и уточнение «по правую и по левую руку» указывают на присутствие при Царе, однако буквальная пространственная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Заглавные местоимения при упоминании Яхве использованы как уместная русская религиозно-литературная норма; синтаксис остаётся ясным для широкого читателя.
