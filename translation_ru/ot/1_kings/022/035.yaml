  yaml_path: translation/ot/1_kings/022/035.yaml
  text: And the battle intensified that day[a], and the king remained standing in the chariot facing Aram, and he died in the evening[c][b]; and the blood from the wound flowed into the bottom of the chariot.
translation:
  language: ru
  text: В тот день битва всё усиливалась[a]. Царя держали стоящим[b] в колеснице, лицом к Араму, и вечером он умер. Кровь из раны стекала в нижнюю часть колесницы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «битва разгоралась»; букв.: «битва поднималась».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «царь стоял в колеснице». Еврейская форма может подразумевать, что его удерживали или поддерживали в стоячем положении.'
    reason: lexical_alternative
  - marker: c
    text: 'Букв.: «в лоно колесницы» — образное обозначение её внутренней нижней части.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲלֶה הַמִּלְחָמָה
  choice: битва всё усиливалась
  rationale: Буквально глагол означает «подниматься», но в сочетании с «битвой» передаёт нарастание боя; «всё усиливалась» естественно выражает продолжительное обострение.
- source_word: מָעֳמָד
  choice: держали стоящим
  rationale: Пассивная форма указывает, что царя заставляли или поддерживали оставаться в стоячем положении; перевод сохраняет эту существенную нюансировку, не уточняя способ.
- source_word: נֹכַח אֲרָם
  choice: лицом к Араму
  rationale: נֹכַח обозначает положение напротив или лицом к чему-либо. Имя Арам сохранено, без замены более поздним названием «Сирия».
- source_word: וַיָּמָת בָּעֶרֶב
  choice: но к вечеру он умер
  rationale: «К вечеру» естественно передаёт временное указание; союз «но» ясно выражает контекстуальный контраст, не меняя последовательности событий.
- source_word: וַיִּצֶק דַּם הַמַּכָּה
  choice: кровь из раны стекала
  rationale: יצק буквально связано с литьём; в данном контексте «стекала» естественно описывает движение крови из раны.
- source_word: חֵיק הָרָכֶב
  choice: дно колесницы
  rationale: חֵיק буквально означает «лоно, пазуха», но применительно к колеснице метафорически обозначает её внутреннюю нижнюю часть, где собиралась кровь.
