    issue: Добавлен союз «но»
    rationale: В еврейской последовательности וְ... וַיָּמָת нет противительного союза; добавление «но» истолковывает связь событий как контраст.
  - severity: low
    issue: «К вечеру» вместо «вечером»
    rationale: 'Русское «к вечеру» может обозначать предельный срок, тогда как исходное בָּעֶרֶב прямо локализует смерть во времени: «вечером».'
  - severity: low
    issue: «На дно колесницы»
    rationale: אֶל задаёт движение в сторону/внутрь; «в нижнюю часть колесницы» сохраняет это направление и не сужает образное חֵיק до буквального дна.
  - severity: low
    issue: 'Примечание b: «заставляли»'
    rationale: Пассивная форма допускает, что царя удерживали или поддерживали в стоячем положении, но не требует предполагать принуждение.
