  text: וְ/יֶתֶר֩ דִּבְרֵ֨י אַחְאָ֜ב וְ/כָל אֲשֶׁ֣ר עָשָׂ֗ה וּ/בֵ֤ית הַ/שֵּׁן֙ אֲשֶׁ֣ר בָּנָ֔ה וְ/כָל הֶ/עָרִ֖ים אֲשֶׁ֣ר בָּנָ֑ה הֲ/לֽוֹא הֵ֣ם כְּתוּבִ֗ים עַל סֵ֛פֶר דִּבְרֵ֥י הַ/יָּמִ֖ים לְ/מַלְכֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/039.yaml
  text: The rest of the acts of Ahab[a], and all that he did, and the ivory house that he built[b], and all the cities that he built—are they not written in the Book of the Chronicles of the Kings of Israel?
translation:
  language: ru
  text: Прочие дела Ахава, всё, что он сделал, дом из слоновой кости[a], который он построил, и все города, которые он построил, — разве не записано всё это в Книге летописей царей Израиля[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дом слоновой кости». Вероятно, имеется в виду царское здание, украшенное слоновой костью, а не целиком сделанное из неё.'
    reason: lexical_alternative
  - marker: b
    text: «Книга летописей царей Израиля» — упоминаемый в книгах Царей царский письменный источник; это не обязательно библейская книга Паралипоменон.
    reason: cross_reference
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי אַחְאָב
  choice: Прочие дела Ахава
  rationale: В царской итоговой формуле דִּבְרֵי означает дела и деяния, а יֶתֶר — оставшуюся, не изложенную здесь часть сведений. «Прочие дела» естественно передаёт эту формулу по-русски.
- source_word: וְכָל אֲשֶׁר עָשָׂה
  choice: всё, что он сделал
  rationale: Сохраняет широкий смысл עשה и не уточняет характер или успешность совершённого.
- source_word: בֵית הַשֵּׁן
  choice: дом из слоновой кости
  rationale: Буквально передаёт конструкцию «дом слоновой кости», не заменяя нейтральное בַּיִת более узким словом «дворец»; вероятный смысл пояснён в сноске.
- source_word: וְכָל הֶעָרִים אֲשֶׁר בָּנָה
  choice: и все города, которые он построил
  rationale: עָרִים обычно означает города, а בנה — строить; перевод не вводит отсутствующего в тексте уточнения об укреплении городов.
- source_word: הֲלוֹא הֵם כְּתוּבִים
  choice: разве не записано всё это
  rationale: הֲלוֹא вводит риторический вопрос, предполагающий утвердительный ответ. Русское «всё это» естественно обобщает перечисленные сведения, соответствуя функции местоимения הֵם.
- source_word: סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יִשְׂרָאֵל
  choice: Книга летописей царей Израиля
  rationale: 'Передаёт название письменного царского источника: סֵפֶר — книга или свиток, דִּבְרֵי הַיָּמִים — летописные записи, а לְמַלְכֵי יִשְׂרָאֵל указывает на их отношение к царям Израиля.'
theological_decisions: []
