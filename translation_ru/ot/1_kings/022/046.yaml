base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/046.yaml
  text: The rest of the acts of Jehoshaphat[a], and his might that he showed, and how he fought—are they not written in the Book of the Chronicles of the Kings of Judah?
translation:
  language: ru
  text: Прочие деяния Иосафата, его доблесть, которую он проявил[a], и то, как он воевал, — не записаны ли они в книге летописей царей Иудеи?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и совершённые им подвиги». В еврейском тексте выражение буквально соединяет «его доблесть» с «которую он совершил», то есть говорит о доблести, проявленной в делах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֶתֶר דִּבְרֵי יְהוֹשָׁפָט
  choice: Прочие деяния Иосафата
  rationale: В формуле, завершающей рассказ о царствовании, דִּבְרֵי означает не только «слова», но дела и события правления; «деяния» естественно передаёт этот историографический смысл.
- source_word: וּגְבוּרָתוֹ אֲשֶׁר עָשָׂה
  choice: его доблесть, которую он проявил
  rationale: גְּבוּרָה обозначает силу, доблесть или подвиги, а буквальное «которую он сделал» по-русски неестественно. «Проявил доблесть» сохраняет существительное и передаёт доблесть, обнаруженную в делах.
- source_word: וַאֲשֶׁר נִלְחָם
  choice: и то, как он воевал
  rationale: Форма נִלְחָם означает «сражался, воевал»; перевод сохраняет относительную конструкцию и не добавляет отсутствующего в тексте существительного «войны».
- source_word: הֲלֹא הֵם כְּתוּבִים
  choice: не записаны ли они
  rationale: Сохранён риторический вопрос стандартной формулы ссылки на письменный источник.
- source_word: עַל סֵפֶר דִּבְרֵי הַיָּמִים לְמַלְכֵי יְהוּדָה
  choice: в книге летописей царей Иудеи
  rationale: Выражение обозначает книгу царских анналов; предлог לְ в названии передан естественной русской родительной конструкцией.
