revisions:
- from: 'Когда начальники колесниц увидели Иосафата, они сказали: «Верно, это царь Израиля!» — и повернули к нему, чтобы вступить в бой. Но Иосафат закричал.'
  to: 'Когда военачальники колесничного войска увидели Иосафата, они сказали: «Наверняка это царь Израиля!» Тогда они двинулись на него, чтобы сразиться с ним. Но Иосафат закричал.'
  rationale: Уточнено значение «колесничного войска» как воинского рода, а направленность нападения на Иосафата выражена прямо. Содержание крика остаётся неуточнённым, как в еврейском тексте; отдельная формула для וַיְהִי по-русски не требуется.
