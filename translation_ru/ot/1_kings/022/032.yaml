  text: וַ/יְהִ֡י כִּ/רְאוֹת֩ שָׂרֵ֨י הָ/רֶ֜כֶב אֶת יְהוֹשָׁפָ֗ט וְ/הֵ֤מָּה אָֽמְרוּ֙ אַ֣ךְ מֶֽלֶךְ יִשְׂרָאֵ֣ל ה֔וּא וַ/יָּסֻ֥רוּ עָלָ֖י/ו לְ/הִלָּחֵ֑ם וַ/יִּזְעַ֖ק יְהוֹשָׁפָֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/032.yaml
  text: And it happened[a], when the commanders of the chariots saw Jehoshaphat, that they said, “Surely he is the king of Israel.” So they turned aside against him to fight[b], but Jehoshaphat cried out.
translation:
  language: ru
  text: 'Когда военачальники колесничного войска увидели Иосафата, они сказали: «Наверняка это царь Израиля!» Тогда они двинулись на него, чтобы сразиться с ним. Но Иосафат закричал.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: не передано отдельной формулой
  rationale: В данном месте וַיְהִי служит связкой последовательного повествования; отдельное «и случилось» в современном русском утяжелило бы фразу, не добавляя смыслового содержания.
- source_word: כִּרְאוֹת
  choice: когда ... увидели
  rationale: Временное значение конструкции с כ передано естественным русским придаточным.
- source_word: שָׂרֵי הָרֶכֶב
  choice: начальники колесниц
  rationale: שָׂרֵי обозначает военных начальников, а הָרֶכֶב — колесницы или колесничное войско; краткая формулировка сохраняет конкретный образ исходного текста.
- source_word: אַךְ
  choice: Верно
  rationale: Здесь частица выражает уверенное, хотя ошибочное опознание Иосафата.
- source_word: מֶלֶךְ יִשְׂרָאֵל הוּא
  choice: это царь Израиля
  rationale: Русская конструкция естественно передаёт именное отождествление, не меняя мужского референта.
- source_word: וַיָּסֻרוּ עָלָיו
  choice: повернули к нему
  rationale: Сочетание סור с עַל в контексте обозначает направленное движение к человеку с враждебной целью; сама цель ясно выражена следующим инфинитивом.
- source_word: לְהִלָּחֵם
  choice: чтобы вступить в бой
  rationale: Передаёт значение начала боевого столкновения естественнее, чем буквальное «чтобы сражаться».
- source_word: וַיִּזְעַק
  choice: закричал
  rationale: זעק обозначает громкий, обычно вызванный бедой крик; содержание крика в стихе не уточняется.
theological_decisions: []
