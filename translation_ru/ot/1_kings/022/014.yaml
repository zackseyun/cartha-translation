  text: וַ/יֹּ֖אמֶר מִיכָ֑יְהוּ חַי יְהוָ֕ה כִּ֠י אֶת אֲשֶׁ֨ר יֹאמַ֧ר יְהוָ֛ה אֵלַ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/014.yaml
  text: And Micaiah said[a], “As Yahweh lives, whatever Yahweh says to me, that I will speak.”
translation:
  language: ru
  text: 'Михей сказал: «Жив Яхве! Что скажет мне Яхве, то я и буду говорить».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: сказал
  rationale: Стандартная повествовательная форма, вводящая прямую речь; русский контекст не требует отдельной передачи начального וַ союзом «и».
- source_word: מִיכָיְהוּ
  choice: Михей
  rationale: Устоявшаяся русская библейская форма имени, соответствующая древнееврейскому מִיכָיְהוּ.
- source_word: חַי יְהוָה
  choice: Жив Яхве!
  rationale: Сохраняет древнееврейскую формулу клятвы и её торжественную силу; в современном русском она естественно звучит как краткое восклицание.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт личное имя Бога транслитерацией, а не заменяет его титулом.
- source_word: כִּי אֵת אֲשֶׁר
  choice: Что
  rationale: В составе формулы клятвы вводит её содержание; относительная конструкция естественно передаётся по-русски соотносительной парой «что… то».
- source_word: יֹאמַר
  choice: скажет
  rationale: Имперфект в данном контексте имеет будущее значение.
- source_word: אֵלַי
  choice: мне
  rationale: Предлог אֶל с местоименным суффиксом обозначает адресата речи.
- source_word: אֹתוֹ
  choice: то
  rationale: Возобновляющее объектное местоимение передано русским коррелятом «то» в конструкции «что… то».
- source_word: אֲדַבֵּר
  choice: я и буду говорить
  rationale: Будущее длительное «буду говорить» передаёт форму глагола и подчёркивает обязательство возвещать именно полученное слово; частица «и» отражает фокус на этом содержании.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит тетраграмматон — личное имя Бога. Транслитерация сохраняет различие между именем и титулом и не вносит конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем речи. Лаконичная формула «Жив Яхве!» сохраняет характер древней клятвы; конструкция «Что… то…» естественно воспроизводит синтаксический акцент оригинала.
