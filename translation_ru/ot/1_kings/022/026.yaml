  text: Then the king of Israel said[a], “Take Micaiah and return him to Amon, the governor of the city, and to Joash the king’s son.”
translation:
  language: ru
  text: 'Тогда царь Израиля сказал: «Возьми Михея и отведи его обратно к Амону, начальнику города[a], и к Иоасу, сыну царя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «военачальнику города»; или: «главному городскому чиновнику». Еврейское наименование может обозначать видного гражданского или военного руководителя.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Тогда ... сказал
  rationale: Вав с последовательным значением продвигает повествование; «тогда» естественно передаёт смену действия в современном русском.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Сохранён употреблённый в еврейском тексте титул без замены личным именем Ахава.
- source_word: קַח
  choice: Возьмите
  rationale: Императив обычно означает «взять»; контекст допускает взятие под стражу, но глагол сам по себе не требует усиленного «схватите».
- source_word: מִיכָיְהוּ
  choice: Михея
  rationale: Имя передано в принятой русской библейской форме и поставлено в винительный падеж.
- source_word: וַהֲשִׁיבֵהוּ
  choice: отведите его обратно
  rationale: Каузативная форма от שוב означает заставить вернуться или привести обратно; выбран естественный русский оборот, указывающий на возвращение Михея.
- source_word: אָמֹן
  choice: Амону
  rationale: Имя транслитерировано в традиционной русской форме и согласовано с предлогом направления.
- source_word: שַׂר הָעִיר
  choice: начальнику города
  rationale: שַׂר обозначает высокопоставленного руководителя или должностное лицо и не уточняет однозначно, была ли должность гражданской или военной; нейтральное «начальник города» сохраняет широту значения.
- source_word: וְאֶל יוֹאָשׁ
  choice: и к Иоасу
  rationale: Повтор предлога אֶל обозначает второго адресата или место назначения и сохранён ради ясности.
- source_word: בֶּן הַמֶּלֶךְ
  choice: сыну царя
  rationale: Формально и естественно передаёт конструкцию принадлежности, не превращая её в не названный прямо титул «царевич».
