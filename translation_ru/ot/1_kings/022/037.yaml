lexical_decisions:
- source_word: וַיָּמָת
  choice: умер
  rationale: Форма qal wayyiqtol от מות обозначает событие смерти в последовательном повествовании; естественный русский эквивалент — «умер».
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное указывает на уже известного из контекста царя (Ахава); сохранено нарицательное обозначение, без подстановки имени.
- source_word: וַיָּבֹא שֹׁמְרוֹן
  choice: его привезли в Самарию
  rationale: 'Буквально глагол стоит в единственном числе активного залога: «он пришёл/прибыл в Самарию». Поскольку царь уже умер, контекст подразумевает доставку его тела; по-русски это естественно выражается как «его привезли», при этом буквальная форма отмечена в сноске.'
- source_word: שֹׁמְרוֹן
  choice: Самария
  rationale: Устоявшаяся русская форма названия города; при обозначении направления употреблено «в Самарию», места погребения — «в Самарии».
- source_word: וַיִּקְבְּרוּ
  choice: похоронили
  rationale: Третье лицо множественного числа с неопределённым субъектом естественно передаётся русской неопределённо-личной формой.
- source_word: אֶת הַמֶּלֶךְ
  choice: царя
  rationale: Повтор существительного сохранён вслед за еврейским текстом, а не заменён местоимением.
- source_word: בְּשֹׁמְרוֹן
  choice: в Самарии
  rationale: Предлог ב обозначает здесь место погребения; прямой русский эквивалент — «в Самарии».
