lexical_decisions:
- source_word: וְיֶתֶר
  choice: также … остальных
  rationale: יֶתֶר обозначает оставшуюся часть или остаток. Русское «остальных» естественно передаёт группу тех, кто ещё оставался; союз וְ в данном контексте передан словом «также» как продолжение рассказа о деяниях царя.
- source_word: הַקָּדֵשׁ
  choice: мужчин, занимавшихся культовой проституцией
  rationale: Кָדֵשׁ здесь — существительное мужского рода, обозначающее человека, связанного с запрещённой культовой сексуальной практикой. Описательный перевод понятен современному читателю, передаёт как мужской пол, так и культовый характер практики и не использует неточный традиционный термин «содомит».
- source_word: אֲשֶׁר נִשְׁאַר
  choice: которые оставались там
  rationale: Форма נִשְׁאַר выражает состояние уцелевших или остававшихся лиц. «Там» делает русскую фразу естественной и относится к ранее названной стране, не добавляя нового места.
- source_word: בִּימֵי אָסָא אָבִיו
  choice: со времён его отца Асы
  rationale: Хотя בִּימֵי буквально означает «во дни», в контексте речь идёт о людях, продолжавших оставаться после времени Асы. «Со времён» естественно передаёт эту временную связь по-русски.
- source_word: בִּעֵר
  choice: удалил
  rationale: В данном сочетании глагол означает устранение или очищение от чего-либо. «Удалил» сохраняет неопределённость относительно способа и не утверждает ни сожжения, ни казни.
- source_word: מִן הָאָרֶץ
  choice: из страны
  rationale: Здесь הָאָרֶץ обозначает территорию царства, а не землю как почву или весь мир. «Из страны» ясно передаёт политико-географический смысл.
theological_decisions:
- issue: Передача קָדֵשׁ в нравственно и культурно нагруженном контексте
  choice: мужчин, занимавшихся культовой проституцией
  alternative: культовых блудников; посвящённых служителей культа
  rationale: Выбранная формулировка передаёт мужскую форму еврейского слова и его связь с культовой сексуальной практикой, не импортируя позднейшие полемические значения. При этом примечание сохраняет возможность более буквального понимания названия как «посвящённый».
- issue: Способ устранения этих лиц
  choice: удалил
  alternative: изгнал; истребил; очистил страну от
  rationale: Текст утверждает устранение их из страны, но не уточняет, было ли это изгнанием, казнью или иной мерой. Нейтральный глагол сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Описательная формулировка выбрана ради ясности и точности; традиционное «содомиты» отвергнуто как лексически неточное и несущее более поздние ассоциации.
