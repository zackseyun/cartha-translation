  yaml_path: translation/ot/1_kings/022/038.yaml
  text: And they washed the chariot at the pool of Samaria[a], and the dogs licked up his blood, and the prostitutes washed there, according to the word of Yahweh that he had spoken.
translation:
  language: ru
  text: Колесницу вымыли у водоёма Самарии; собаки слизали его кровь, а проститутки там мылись[a] — по слову Яхве, которое Он изрёк.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «купались». Еврейский глагол может означать «мыться, купаться»; дополнение при нём не названо. Формально возможно и переходное понимание: «мыли [что-либо]».'
    reason: Сохранение лексико-синтаксической неоднозначности רָחָצוּ без придания переходному прочтению неоправданной определённости.
lexical_decisions:
- source_word: וַיִּשְׁטֹף אֶת־הָרֶכֶב
  choice: колесницу вымыли
  rationale: Глагол стоит в форме 3-го лица единственного числа, однако деятель не назван. Русская неопределённо-личная конструкция естественно передаёт действие неназванного человека или людей; הָרֶכֶב в контексте означает окровавленную колесницу Ахава.
- source_word: עַל בְּרֵכַת שֹׁמְרוֹן
  choice: у водоёма Самарии
  rationale: עַל здесь обозначает место действия возле водоёма. «У» естественно передаёт это пространственное отношение, не создавая впечатления, будто колесница находилась на поверхности воды.
- source_word: וַיָּלֹקּוּ הַכְּלָבִים אֶת־דָּמוֹ
  choice: собаки слизали его кровь
  rationale: «Слизали» выразительно и естественно передаёт завершённое действие глагола לקק; местоименный суффикс относится к Ахаву.
- source_word: וְהַזֹּנוֹת רָחָצוּ
  choice: а проститутки там мылись
  rationale: זוֹנוֹת точно передано современным словом «проститутки». У רָחָצוּ нет выраженного дополнения; основной текст даёт естественное по-русски контекстуальное прочтение, а сноска сохраняет синтаксическую неоднозначность.
- source_word: כִּדְבַר יְהוָה אֲשֶׁר דִּבֵּר
  choice: по слову Яхве, которое Он изрёк
  rationale: Сохранена формула исполнения пророческого слова и личное имя Яхве. «Изрёк» поддерживает dignified literary register без архаической перегруженности.
theological_decisions:
- issue: Передача божественного имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» передаёт личное заветное имя, не заменяя его титулом.
- issue: Толкование וְהַזֹּנוֹת רָחָצוּ
  choice: а проститутки там мылись
  alternative: а проститутки там купались; а проститутки там мыли [что-то]
  rationale: Подлежащее «проститутки» выражено явно, но объект глагола отсутствует. Для естественного русского текста выбрано возвратное прочтение, а подлинная неоднозначность отмечена в сноске и не представлена как несомненная.
translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным ритмом. Неопределённо-личное «вымыли» естественно передаёт неназванного деятеля; точка с запятой и тире проясняют последовательность действий и формулу исполнения пророчества.
