  yaml_path: translation/ot/1_kings/022/018.yaml
  text: Then the king of Israel said to Jehoshaphat[a], “Did I not tell you that he would not prophesy good concerning me, but only evil?”
translation:
  language: ru
  text: 'И сказал царь Израиля Иосафату: «Разве я не говорил тебе, что он не будет пророчествовать обо мне доброе, а только злое[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «а только беду». Буквально по-еврейски: «доброе… а только злое»; здесь речь может идти о неблагоприятном пророчестве, предвещающем бедствие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Последовательный вав продвигает повествование; традиционная русская повествовательная связка звучит естественно и сохраняет связь с предыдущим событием.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царь Израиля
  rationale: Прямо передаёт конструкцию исходного текста, не подставляя имя Ахава.
- source_word: אֶל יְהוֹשָׁפָט
  choice: Иосафату
  rationale: Предлог обозначает адресата речи; титул, отсутствующий в еврейском тексте, не добавляется.
- source_word: הֲלוֹא אָמַרְתִּי אֵלֶיךָ
  choice: Разве я не говорил тебе
  rationale: Риторический вопрос предполагает согласие собеседника и выражает укор; эта конструкция естественна в современном русском языке.
- source_word: לֹא יִתְנַבֵּא
  choice: он не будет пророчествовать
  rationale: Имперфект передаёт ожидаемое или характерное поведение Михея; русское будущее сохраняет форму утверждения царя без излишнего уточнения временного отношения.
- source_word: עָלַי
  choice: обо мне
  rationale: В контексте речи и пророчества עַל означает «о, относительно»; «обо мне» естественнее русского «касательно меня».
- source_word: טוֹב
  choice: доброе
  rationale: Субстантивированное прилагательное сохраняет лаконичную и резкую пару «доброе — злое».
- source_word: כִּי אִם
  choice: а только
  rationale: После отрицания конструкция выражает исключительное противопоставление; «а только» ясно и естественно передаёт этот смысл.
- source_word: רָע
  choice: злое
  rationale: Сохраняет прямое лексическое противопоставление טוֹב и רָע. В данном контексте слово может обозначать неблагоприятное известие или бедствие, что пояснено в сноске.
theological_decisions:
- issue: Значение רָע в жалобе на пророчество
  choice: злое
  alternative: беду; несчастье
  rationale: Основной текст сохраняет намеренно резкое еврейское противопоставление «доброе — злое», не сводя רָע исключительно к нравственному злу или к бедствию. Контекстуальное значение неблагоприятного, гибельного предсказания отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис прост и понятен; сохранены титул «царь», глагол «пророчествовать» и контраст «доброе — злое».
