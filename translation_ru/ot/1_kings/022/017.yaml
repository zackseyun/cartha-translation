source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר רָאִ֤יתִי אֶת כָּל יִשְׂרָאֵל֙ נְפֹצִ֣ים אֶל הֶ/הָרִ֔ים כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶ֑ה וַ/יֹּ֤אמֶר יְהוָה֙ לֹֽא אֲדֹנִ֣ים לָ/אֵ֔לֶּה יָשׁ֥וּבוּ אִישׁ לְ/בֵית֖/וֹ בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/017.yaml
  text: And he said[a], “I saw all Israel scattered on the mountains, like sheep that have no shepherd. And Yahweh said, ‘These have no master[b]; let each man return to his house in peace.’”
translation:
  language: ru
  text: 'И он сказал: «Я видел весь Израиль, рассеянный по горам, как овцы, у которых нет пастуха. И Яхве сказал: „У них нет владыки[a]; пусть каждый[b] вернётся в свой дом с миром“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «владык»; еврейское слово имеет форму множественного числа, хотя в контексте речь идёт об Израиле, оставшемся без своего правящего главы.'
    reason: lexical_alternative
  - marker: b
    text: 'Еврейское אִישׁ буквально означает «мужчина»; здесь оно употреблено распределительно: «каждый».'
    reason: lexical_alternative
lexical_decisions:
- source_word: נְפֹצִים
  choice: рассеянный
  rationale: Причастие от פוץ передаёт состояние рассеяния. Согласование в единственном числе с собирательным «весь Израиль» естественно для русского языка, тогда как образ рассеянного народа сохраняется.
- source_word: אֶל הֶהָרִים
  choice: по горам
  rationale: При глаголе рассеяния אֶל здесь обозначает область распространения. Русское «по горам» естественно передаёт пространственную картину видения.
- source_word: כַּצֹּאן אֲשֶׁר אֵין לָהֶם רֹעֶה
  choice: как овцы, у которых нет пастуха
  rationale: Сохраняется прямой и узнаваемый образ стада без пастуха; צאן в данном контексте естественно передать словом «овцы».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано личное имя Бога, а не заменяющий его титул.
- source_word: אֲדֹנִים
  choice: владыки
  rationale: В контексте речь идёт об отсутствующем правителе, прежде всего царе. Единственное число естественно в русском и передаёт контекстуальный смысл, а примечание сохраняет видимым морфологическое множественное число еврейского слова.
- source_word: יָשׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: пусть каждый вернётся в свой дом
  rationale: Имперфект имеет побудительное значение; «пусть… вернётся» передаёт его. «Каждый» естественно выражает распределительное אִישׁ, а буквальная мужская форма отмечена в сноске.
- source_word: בְּשָׁלוֹם
  choice: с миром
  rationale: 'Устойчивое русское библейское выражение сохраняет широкий смысл שָׁלוֹם: мир, благополучие и безопасность.'
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В тексте стоит тетраграмматон — личное имя Бога. Транслитерация «Яхве» отличает имя от титула и не вводит конфессиональной замены.
- issue: Число и смысл אֲדֹנִים
  choice: У них нет владыки
  alternative: У них нет владык; у них нет правителя
  rationale: Форма в еврейском множественная, однако контекст видения указывает на отсутствие единого правящего главы — царя. Единственное число даёт естественный русский смысл, а сноска сохраняет формальную неоднозначность.
- issue: Распределительное אִישׁ
  choice: каждый
  alternative: каждый мужчина; каждый человек
  rationale: В военном контексте речь идёт о мужчинах Израиля, но самостоятельное русское «каждый» не нейтрализует участника и звучит естественнее. Буквальная мужская лексема отражена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для обычного читателя; образ пастуха, личное имя Яхве и выражение «с миром» сохранены без конфессионального истолкования.
