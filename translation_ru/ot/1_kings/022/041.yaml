  text: And Jehoshaphat son of Asa became king over Judah in the fourth year of Ahab king of Israel.
translation:
  language: ru
  text: Иосафат, сын Асы, стал царём над Иудеей в четвёртый год правления Ахава, царя Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִיהוֹשָׁפָט
  choice: И Иосафат
  rationale: Союз ו сохраняет связь с предшествующим повествованием; имя передано в традиционной русской библейской форме.
- source_word: בֶּן אָסָא
  choice: сын Асы
  rationale: Конструктивное сочетание прямо указывает на происхождение Иосафата и естественно передаётся по-русски без артикля.
- source_word: מָלַךְ
  choice: стал царём
  rationale: В данной формуле совершенный вид глагола מלך обозначает вступление на царство, а не продолжительность царствования.
- source_word: עַל־יְהוּדָה
  choice: над Иудеей
  rationale: Предлог עַל при מלך выражает царскую власть над страной или народом.
- source_word: בִּשְׁנַת אַרְבַּע
  choice: в четвёртый год
  rationale: Естественная русская передача стандартной формулы датировки по годам царствования.
- source_word: לְאַחְאָב
  choice: правления Ахава
  rationale: Предлог לְ в хронологической формуле соотносит год с царствованием Ахава; добавление «правления» делает этот смысл ясным и естественным по-русски.
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: царя Израиля
  rationale: Приложение определяет Ахава как царя Израиля и сохраняет краткость еврейской формулы.
