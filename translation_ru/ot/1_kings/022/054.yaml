base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/054.yaml
  text: He served Baal and bowed down to him[a], and he provoked Yahweh, the God of Israel, just as his father had done.
translation:
  language: ru
  text: Он служил Ваалу и поклонялся ему[a], и вызвал гнев Яхве, Бога Израиля, поступая во всём так же, как его отец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «простирался перед ним ниц»; еврейский глагол буквально обозначает поклон или простирание ниц и часто описывает поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: служил
  rationale: Глагол עבד означает «служить» и здесь обозначает культовое служение; перевод сохраняет его отличие от следующего конкретного действия поклонения.
- source_word: הַבַּעַל
  choice: Ваалу
  rationale: В данном контексте это имя (или титул, употреблённый как имя) языческого божества; артикль отдельно по-русски не передаётся.
- source_word: וַיִּשְׁתַּחֲוֶה לוֹ
  choice: поклонялся ему
  rationale: Глагол буквально обозначает поклон или простирание ниц, а в данном культовом контексте естественно передаётся словом «поклонялся»; конкретный образ действия отмечен в сноске.
- source_word: וַיַּכְעֵס
  choice: вызывал гнев
  rationale: Каузативная форма כעס означает «вызывать гнев, раздражать»; выражение «вызывал гнев Яхве» естественно и ясно передаёт причинный смысл.
- source_word: יְהוָה
  choice: Яхве
  rationale: Личное имя Бога передано распространённой современной русской транслитерацией, а не заменено титулом.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Бога Израиля
  rationale: Точная и естественная передача еврейской сопряжённой конструкции.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה אָבִיו
  choice: поступая во всём так же, как его отец
  rationale: Формулировка сохраняет значение «согласно всему, что делал его отец» и выражает его современным литературным русским языком.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: В стихе личное имя Бога Израиля противопоставлено имени Ваала. Транслитерация «Яхве» сохраняет это противопоставление и не подменяет имя титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет последовательность еврейских действий, но финальный оборот сделан естественным для русского языка.
