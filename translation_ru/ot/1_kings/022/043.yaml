base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/043.yaml
  text: He walked in all the ways of Asa his father[a]; he did not turn aside from them[b], doing what was right in the eyes of Yahweh.
translation:
  language: ru
  text: Он во всём следовал пути своего отца Асы[a]; он не отступал от него и делал то, что правильно в глазах Яхве[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к буквальному: «во всём шёл путём своего отца Асы».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «в глазах Яхве» означает «по оценке Яхве», «с точки зрения Яхве».
    reason: idiom_explanation
lexical_decisions:
- source_word: וַיֵּלֶךְ בְּכָל דֶּרֶךְ
  choice: Он во всём шёл путём
  rationale: Сохраняет метафору пути и поведения, выраженную глаголом הלך и существительным דרך. Оборот «во всём» естественно передаёт полноту следования пути в современном русском языке.
- source_word: אָסָא אָבִיו
  choice: своего отца Асы
  rationale: Естественный русский порядок слов ясно обозначает Асу как отца царя.
- source_word: לֹא סָר מִמֶּנּוּ
  choice: не уклоняясь от него
  rationale: Глагол סור означает «сворачивать, уклоняться, отступать»; местоимение мужского рода единственного числа относится к слову «путь», поэтому сохранено «от него».
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: и делал то, что было правильным
  rationale: Передаёт устойчивое выражение עשה הישר без морализующего расширения. Союз «и» естественно связывает действие с предшествующей характеристикой поведения.
- source_word: בְּעֵינֵי יְהוָה
  choice: в глазах Яхве
  rationale: Сохраняет образность еврейского выражения о Божьей оценке и передаёт тетраграмматон как личное имя «Яхве».
theological_decisions:
- issue: Царская формула оценки поведения
  choice: Стих утверждает, что царь во всём держался пути своего отца Асы и поступал правильно по оценке Яхве.
  alternative: Передать это общей похвалой его верности или благочестия.
  rationale: Исходный текст оценивает поступки царя стандартной формулой, но не раскрывает её в более широкое богословское утверждение.
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: Транслитерация сохраняет личное имя в исходном тексте, не заменяя его титулом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Метафора пути и образ «в глазах Яхве» сохранены, а синтаксис сделан естественным для обычного читателя.
