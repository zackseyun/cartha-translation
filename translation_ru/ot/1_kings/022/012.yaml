id: 1KI.22.12
reference: 1 Kings 22:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: WLC
  text: וְ/כָל הַ/נְּבִאִ֔ים נִבְּאִ֥ים כֵּ֖ן לֵ/אמֹ֑ר עֲלֵ֞ה רָמֹ֤ת גִּלְעָד֙ וְ/הַצְלַ֔ח וְ/נָתַ֥ן יְהוָ֖ה בְּ/יַ֥ד הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/012.yaml
  text: And all the prophets were prophesying thus[a], saying, “Go up to Ramoth-gilead and succeed, and Yahweh will give it into the hand of the king.”
translation:
  language: ru
  text: 'И все пророки пророчествовали так: «Иди на Рамот-Галаад и добейся успеха[a], и Яхве отдаст его в руки царя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и преуспей».'
    reason: Глагол צלח допускает передачу успешного исхода как «добейся успеха» или «преуспей».
lexical_decisions:
- source_word: וְ/כָל הַ/נְּבִאִים
  choice: И все пророки
  rationale: Сохраняет повествовательное соединение וְ, значение совокупности כָל и определённость существительного.
- source_word: נִבְּאִים
  choice: пророчествовали
  rationale: Причастная форма описывает продолжающееся в данной сцене действие; русский несовершенный вид естественно передаёт эту длительность.
- source_word: כֵּן לֵ/אמֹר
  choice: 'так:'
  rationale: כֵּן указывает на образ или содержание речи, а לֵאמֹר вводит прямую речь; в современном русском это естественно выражается словом «так» и двоеточием.
- source_word: עֲלֵה
  choice: Иди
  rationale: Прямо передаёт повелительную форму глагола עלה «подниматься, идти вверх», не добавляя явно не названного приказа атаковать.
- source_word: רָמֹת גִּלְעָד
  choice: Рамот-Галаад
  rationale: Устоявшаяся русская форма составного географического названия.
- source_word: וְ/הַצְלַח
  choice: и добейся успеха
  rationale: Hiphil глагола צלח в контексте означает успешный исход; выражение естественно для военного контекста и не сужает смысл до одной лишь победы.
- source_word: וְ/נָתַן
  choice: и ... отдаст
  rationale: Сохраняет координацию еврейского וְ; форма qatal после повелений здесь выражает уверенно ожидаемый будущий результат.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передаёт тетраграмматон как личное имя, а не заменяет его титулом.
- source_word: בְּ/יַד הַ/מֶּלֶךְ
  choice: в руки царя
  rationale: Естественный русский эквивалент еврейской идиомы, обозначающей передачу под власть или контроль царя.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя Бога; транслитерация сохраняет различие между именем и титулом.
- issue: Статус пророческого обещания
  choice: Сохранена прямая уверенная формулировка пророков без редакционного уточнения её истинности
  alternative: Добавить указание на ложность пророчества
  rationale: Сам стих сообщает слова пророков, а их оценка раскрывается контекстом; перевод не должен заранее разрешать повествовательное и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Несовершенный вид «пророчествовали» передаёт разворачивающееся действие без тяжеловесной конструкции; прямая речь остаётся краткой и торжественной.
