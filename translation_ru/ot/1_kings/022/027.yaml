lexical_decisions:
- source_word: כֹּה אָמַר הַמֶּלֶךְ
  choice: Так говорит царь
  rationale: Сохраняет торжественную формулу царского повеления и при этом естественно звучит на современном русском языке.
- source_word: שִׂימוּ אֶת זֶה
  choice: посадите этого человека
  rationale: Указательное выражение относится к Михею; «этого человека» ясно передаёт референта, а глагол «посадите» идиоматичен в сочетании с тюрьмой.
- source_word: בֵּית הַכֶּלֶא
  choice: в тюрьму
  rationale: Передаёт значение «дом заключения, тюрьма» современным и понятным русским словом без ненужной архаизации.
- source_word: וְהַאֲכִילֻהוּ
  choice: и кормите его
  rationale: Естественно передаёт каузативный императив от אכל — веление давать заключённому пищу.
- source_word: לֶחֶם לַחַץ
  choice: хлебом нужды
  rationale: Сохраняет образную конструкцию оригинала и оттенок тяготы, лишений и скудости, не сводя её однозначно к размеру пайка.
- source_word: וּמַיִם לַחַץ
  choice: водой нужды
  rationale: Сохраняет намеренный параллелизм с «хлебом нужды» и образное выражение еврейского текста.
- source_word: עַד בֹּאִי בְשָׁלוֹם
  choice: пока я не приду с миром
  rationale: Формально и смыслово близко к оригиналу; сохраняет возможность понимать שָׁלוֹם как мир, благополучие или невредимое возвращение, а также повествовательную иронию.
theological_decisions:
- issue: Значение בְשָׁלוֹם в заявлении Ахава
  choice: с миром
  alternative: благополучно; целым и невредимым
  rationale: Буквальная идиома сохраняет смысловую широту слова שָׁלוֹם и напряжение между уверенным заявлением царя и последующим исполнением пророчества.
