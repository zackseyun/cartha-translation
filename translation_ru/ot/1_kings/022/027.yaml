  source_fidelity: '«Хлебом нужды и водой нужды» неудачно передаёт לֶחֶם לַחַץ / מַיִם לַחַץ: русское «нужда» прежде всего означает потребность или бедность и не вполне выражает стеснение, бедствие и суровость заключения. Кроме того, в данном контексте בֹּאִי естественно подразумевает возвращение царя из похода; «вернусь с миром» сохраняет формулу и её смысловую широту.'
