  terminology: «Тюрьма» точно и естественно передаёт בֵּית הַכֶּלֶא. «Так говорит царь» сохраняет формульный регистр. «Хлеб бедствия» и «вода бедствия» не истолковывают выражение однозначно как только скудный паёк, а альтернативное пояснение в сноске отражает диапазон לַחַץ.
