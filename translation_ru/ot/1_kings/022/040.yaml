base_translation:
  language: en
  yaml_path: translation/ot/1_kings/022/040.yaml
  text: And Ahab slept with his fathers[a], and Ahaziah his son became king in his place.
translation:
  language: ru
  text: И почил Ахав с отцами своими[a], и вместо него воцарился его сын Охозия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «лёг с отцами своими» — устойчивая царская формула, означающая, что он умер.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: почил
  rationale: В составе царской формулы глагол указывает на смерть. «Почил» сохраняет образ сна и торжественно-формульный характер древнееврейского выражения, оставаясь понятным в современном литературном русском.
- source_word: עִם אֲבֹתָיו
  choice: с отцами своими
  rationale: Буквальная передача устойчивой царской формулы сохраняет её библейский и династический оттенок; значение «с предками» разъяснено в сноске.
- source_word: וַיִּמְלֹךְ
  choice: воцарился
  rationale: Глагол точно и естественно обозначает вступление на престол, а не последующее длительное царствование.
- source_word: תַּחְתָּיו
  choice: вместо него
  rationale: Передаёт преемство в том же царском положении; это прямое соответствие значению древнееврейского оборота.
- source_word: אַחְאָב
  choice: Ахав
  rationale: Традиционная русская библейская форма имени.
- source_word: אֲחַזְיָהוּ
  choice: Охозия
  rationale: Традиционная русская библейская форма имени царя Израиля.
- source_word: בְנוֹ
  choice: его сын
  rationale: Явно сохраняет указание на родство и династическую преемственность.
