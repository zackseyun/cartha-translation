base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/015.yaml
  text: He built the walls of the house on the inside with cedar boards[a]; from the floor of the house to the walls of the ceiling he covered them with wood on the inside[b], and he overlaid the floor of the house with boards of cypress.
translation:
  language: ru
  text: 'Он обшил стены храма изнутри кедровыми досками: от пола храма до стен потолочного покрытия[a] он покрыл их деревом, а пол храма настелил кипарисовыми досками[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до стен покрытия». Вероятно, имеется в виду верхняя граница внутренней обшивки — потолок или внутренняя сторона кровли.'
    reason: textual_ambiguity
  - marker: b
    text: Еврейское название дерева может обозначать кипарис, можжевельник или другую хвойную породу; традиционный перевод — «пихта».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן אֶת קִירוֹת הַבַּיִת מִבַּיְתָה
  choice: Он обшил стены храма изнутри
  rationale: Хотя בנה обычно означает «строить», последующее указание на кедровые доски и повторное צפה описывают внутреннюю деревянную отделку уже возведённых стен. «Обшил» естественно передаёт строительное действие в данном контексте. הַבַּיִת передано как «храм», поскольку речь идёт о храмовом здании.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: кедровыми досками
  rationale: צלעות здесь обозначает элементы деревянной обшивки — доски или панели; אֲרָזִים однозначно указывает на кедр.
- source_word: מִקַּרְקַע הַבַּיִת
  choice: от пола храма
  rationale: קַרְקַע в интерьере здания означает поверхность пола.
- source_word: עַד קִירוֹת הַסִּפֻּן
  choice: до стен у потолка
  rationale: Перевод сохраняет необычное сочетание קִירוֹת со словом, обозначающим верхнее покрытие или потолочную конструкцию, не сводя его безоговорочно к балкам либо стропилам.
- source_word: צִפָּה עֵץ מִבָּיִת
  choice: он покрыл их деревом
  rationale: צפה означает покрывать или облицовывать; подразумеваемый объект — внутренние стены. Указание «изнутри» уже выражено в первой части фразы и в русском не повторяется.
- source_word: וַיְצַף אֶת קַרְקַע הַבַּיִת
  choice: а пол храма настелил
  rationale: Для покрытия пола досками русское «настелил» точнее и естественнее общего «покрыл».
- source_word: בְּצַלְעוֹת בְּרוֹשִׁים
  choice: кипарисовыми досками
  rationale: צלעות вновь обозначает доски; точная порода בְּרוֹשׁ не вполне установлена, но «кипарис» — вероятное современное соответствие.
