  yaml_path: translation/ot/1_kings/006/032.yaml
  text: Also[a], the two doors were of olivewood, and he carved on them engravings of cherubim and palm trees and open flowers, and overlaid them with gold[b]; and he spread the gold over the cherubim and over the palm trees.
translation:
  language: ru
  text: И две двери были из древесины маслины. Он вырезал на них херувимов, пальмы и распустившиеся цветы и покрыл их золотом; золото он наложил[a] на херувимов и пальмы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «низвёл золото». Необычный оборот, вероятно, означает, что золото нанесли на резные фигуры, покрыв их поверхность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתוֹת עֲצֵי שֶׁמֶן
  choice: двери были из масличного дерева
  rationale: דַּלְתוֹת обозначает двери или дверные створки, а עֲצֵי שֶׁמֶן в данном контексте — древесину маслины. «Масличное дерево» — естественное и узнаваемое библейское обозначение материала.
- source_word: וּשְׁתֵּי
  choice: И две
  rationale: Союз ו продолжает архитектурное описание предыдущего стиха; простое «и» сохраняет связность и добавочное значение без усиления.
- source_word: וְקָלַע ... מִקְלְעוֹת
  choice: вырезал ... изображения
  rationale: Глагол и родственное существительное описывают резную декоративную работу. Русская конструкция избегает тяжёлого повтора «вырезал резьбу» и ясно передаёт предмет изображения.
- source_word: כְּרוּבִים
  choice: херувимов
  rationale: Традиционная и точная русская передача названия храмовых небесных существ.
- source_word: תִמֹרוֹת
  choice: пальм
  rationale: В храмовом декоре речь идёт об изображениях пальм; краткая форма естественна после слова «изображения».
- source_word: פְּטוּרֵי צִצִּים
  choice: распустившихся цветов
  rationale: Выражение обозначает раскрытые цветы или цветочный орнамент. «Распустившиеся цветы» естественно передаёт вид цветения, не уточняя ботанический вид.
- source_word: וְצִפָּה זָהָב
  choice: покрыл двери золотом
  rationale: צפה здесь означает покрытие или облицовку золотом. Дополнение «двери» делает местоименную отсылку в русском ясной.
- source_word: וַיָּרֶד ... אֶת־הַזָּהָב
  choice: золото он распластал
  rationale: Необычная каузативная форма от ירד буквально связана с направлением золота вниз по поверхности. «Распластал» сохраняет образ нанесения тонкого золота на рельеф, а сноска отмечает буквальную особенность.
- source_word: עַל הַכְּרוּבִים וְעַל הַתִּמֹרוֹת
  choice: по херувимам и пальмам
  rationale: עַל указывает, что золото наносилось непосредственно на резные фигуры; «по» естественно описывает распределение покрытия по рельефной поверхности.
