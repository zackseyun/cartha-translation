    rationale: «Распластать» обычно значит растянуть или распростереть предмет, тело и т. п.; для золочения рельефа он не является нормативно естественным. Необычность еврейского וַיָּרֶד лучше отметить сноской, не создавая искусственной русской метафоры.
  - severity: low
