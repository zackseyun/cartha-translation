base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/001.yaml
  text: And it came about in the four hundred eightieth year after the sons of Israel came out from the land of Egypt[a], in the fourth year, in the month of Ziv (that is, the second month), of Solomon’s reign over Israel[c][b], that he built the house for Yahweh.
translation:
  language: ru
  text: В четыреста восьмидесятом году после выхода сынов Израиля из земли Египта[a], в четвёртом году царствования Соломона над Израилем, в месяце Зиве[b] — то есть во втором месяце, — он начал строить[c] дом для Яхве.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сыновья Израиля»; здесь так назван весь народ Израиля.'
    reason: lexical_alternative
  - marker: b
    text: Зив — древнее название второго месяца еврейского календаря.
    reason: cultural_note
  - marker: c
    text: Древнееврейский глагол означает «строил/построил»; значение «начал строить» следует из контекста, который датирует начало строительства.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: В четыреста восьмидесятый год…
  rationale: Самостоятельный перевод оборота «и было» опущен ради естественного современного русского начала хронологической формулы; повествовательный переход передан самим временным оборотом.
- source_word: בִּשְׁמוֹנִים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: в четыреста восьмидесятый год
  rationale: Передаёт порядковый отсчёт конкретного года, выраженный древнееврейской конструкцией, а не приблизительную продолжительность в 480 лет.
- source_word: לְצֵאת בְּנֵי יִשְׂרָאֵל
  choice: после того, как сыновья Израиля вышли
  rationale: Инфинитив с ל задаёт временную точку отсчёта; личная конструкция естественна по-русски, а «сыновья Израиля» сохраняет семейно-заветный образ исходного выражения.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: из земли Египетской
  rationale: Сохраняет явно присутствующее в источнике слово «земля» и употребляет понятную литературно-библейскую русскую форму.
- source_word: בַּשָּׁנָה הָרְבִיעִית … לִמְלֹךְ שְׁלֹמֹה עַל יִשְׂרָאֵל
  choice: в четвёртый год царствования Соломона над Израилем
  rationale: Естественно передаёт датировку по годам правления царя, не превращая её в отдельное событие.
- source_word: בְּחֹדֶשׁ זִו הוּא הַחֹדֶשׁ הַשֵּׁנִי
  choice: в месяце зиве — это второй месяц
  rationale: Сохраняет древнее название месяца и данное самим текстом пояснение.
- source_word: וַיִּבֶן
  choice: начал строить
  rationale: Сам глагол значит «строил/построил», но в данной хронологической записи обозначает начало работ; русский совершенный вид «построил» мог бы ошибочно представить указанную дату как дату завершения.
- source_word: הַבַּיִת
  choice: дом
  rationale: Сохраняет обычное древнееврейское обозначение святилища как «дома», не заменяя его истолковывающим словом «храм».
- source_word: לַיהוָה
  choice: для Яхве
  rationale: 'Передаёт личное имя יהוה транслитерацией и сохраняет направительное значение предлога: дом предназначается Яхве.'
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное заветное имя Бога; транслитерация отличает его от титула אֲדֹנָי и не скрывает имя за титулом.
- issue: Передача בְּנֵי יִשְׂרָאֵל
  choice: сыновья Израиля
  alternative: израильтяне / народ Израиля
  rationale: Выбран современный русский эквивалент, сохраняющий семейный образ исходного выражения; сноска поясняет его собирательное значение.
- issue: Начальное или завершённое значение וַיִּבֶן в контексте
  choice: начал строить
  alternative: построил / строил
  rationale: Глагол сам по себе не содержит отдельного значения «начал», однако контекст датирует начало строительства, тогда как завершение сообщается позднее. Сноска сохраняет видимость этой разницы между формой и контекстуальным смыслом.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис упрощён относительно древнееврейской цепочки, но хронологическая структура сохранена. Формы «земля Египетская» и «дом для Яхве» поддерживают достоинство и образность текста без чрезмерной архаизации.
