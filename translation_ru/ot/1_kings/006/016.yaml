base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/016.yaml
  text: He built twenty cubits at the rear of the house with cedar boards[a], from the floor to the walls, and he built it within as an inner sanctuary[c][b], as the Most Holy Place.
translation:
  language: ru
  text: В задней части храма он отгородил кедровыми досками пространство в двадцать локтей — от пола до стен[a] — и устроил там внутреннее святилище[b], Святое святых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от пола до балок (стропил)». В еврейском тексте буквально: «до стен»; это трудное чтение сохранено в основном тексте.'
    reason: alternative_reading
  - marker: b
    text: Евр. девир — внутреннее, самое удалённое святилище храма.
    reason: cultural_note
lexical_decisions:
- source_word: מִירְכְּתֵי הַבַּיִת
  choice: в задней части храма
  rationale: Оборот обозначает удалённую, заднюю часть здания; «храма» естественно передаёт הַבַּיִת в данном контексте.
- source_word: בְּצַלְעוֹת אֲרָזִים
  choice: кедровыми досками
  rationale: צְלָעוֹת может обозначать рёбра, боковые элементы или доски; в архитектурном контексте речь идёт о кедровой обшивке либо перегородке.
- source_word: מִן הַקַּרְקַע עַד הַקִּירוֹת
  choice: от пола до стен
  rationale: 'Сохранено трудное чтение масоретского текста: קִירוֹת означает «стены»; контекстуальные варианты «до балок/стропил» вынесены в примечание.'
- source_word: וַיִּבֶן לוֹ מִבַּיִת
  choice: устроив внутри
  rationale: Сжатый еврейский оборот указывает на сооружение внутреннего помещения в храме; русская формулировка передаёт действие без искусственной буквальности.
- source_word: לִדְבִיר
  choice: внутреннее святилище
  rationale: דְּבִיר — специальное обозначение самого внутреннего храмового помещения; функциональный перевод понятен современному читателю.
- source_word: לְקֹדֶשׁ הַקֳּדָשִׁים
  choice: Святое святых
  rationale: Устоявшееся и понятное русское название самого святого внутреннего помещения храма, сохраняющее форму еврейского суперлатива.
- source_word: אַמָּה
  choice: локтей
  rationale: Сохранена древняя мера длины без приблизительного пересчёта, которого в исходном тексте нет.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Храм» употреблено вместо буквального «дом», поскольку речь идёт о храмовом здании. Синтаксис проясняет сооружение внутреннего помещения, не устраняя архитектурную трудность выражения «до стен».
