  text: And the second cherub was ten cubits[a]; both cherubim had one measure and one form.
translation:
  language: ru
  text: И второй херувим имел размер в десять локтей; оба херувима были одинаковы по размеру и форме.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у обоих херувимов была одна мера и одна форма»; слово, переведённое как «форма», может также означать «пропорции».'
    reason: Передаёт более буквальную структуру еврейского выражения «одна мера и одна форма» и отмечает возможный смысл слова קֶצֶב.
lexical_decisions:
- source_word: וְעֶשֶׂר בָּאַמָּה
  choice: был в десять локтей
  rationale: Еврейский оборот указывает величину, не называя прямо высоту; нейтральная русская формулировка сохраняет эту неопределённость.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: второй херувим
  rationale: Прямое соответствие определённому существительному с порядковым числительным.
- source_word: מִדָּה אַחַת
  choice: были одинаковы по размеру
  rationale: Буквально «одна мера»; в данном сравнении естественный русский эквивалент — одинаковый размер.
- source_word: וְקֶצֶב אֶחָד
  choice: и форме
  rationale: קֶצֶב здесь обозначает форму, очертание или пропорции; «форма» передаёт широкий смысл слова без излишнего уточнения.
- source_word: לִשְׁנֵי הַכְּרֻבִים
  choice: оба херувима были
  rationale: Буквально «для двух херувимов»; перестройка делает фразу естественной по-русски и ясно относит одинаковые размер и форму к обоим изображениям.
