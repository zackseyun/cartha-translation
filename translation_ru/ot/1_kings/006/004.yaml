  text: Он сделал для храма окна с заглублёнными, закрытыми рамами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Еврейские архитектурные термины здесь редки, и их точное значение неясно. Возможны переводы: «окна с углублёнными или скошенными рамами (косяками)», «окна с сужающимися откосами» либо «окна, широкие внутри и узкие снаружи». Второе определение может означать «закрытые», «неподвижные» или «замкнутые»; точное устройство окон неизвестно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Он сделал
  rationale: Форма wayyiqtol от עשה продолжает повествование и обозначает простое завершённое действие; в русском естественно передать без начального союза.
- source_word: לַבָּיִת
  choice: для храма
  rationale: Предлог ל при עשה естественно означает «для», а בַּיִת в данном контексте обозначает храмовое здание; «храм» устраняет неуместную для современного читателя двусмысленность слова «дом».
- source_word: חַלּוֹנֵי
  choice: окна
  rationale: Обычное значение формы сопряжённого множественного числа от חַלּוֹן.
- source_word: שְׁקֻפִים אֲטֻמִים
  choice: с сужающимися проёмами
  rationale: 'Оба редких архитектурных определения переданы совместно и осторожно: вероятно, речь идёт об оконных проёмах или косяках особой, суженной либо заглублённой формы. Перевод не изображает их как наглухо закрытые окна, что плохо согласуется с их назначением, но неопределённость отмечена в сноске.'
