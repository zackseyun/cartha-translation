  text: The cedar on the inside of the house was carved with gourds and open flowers[a]. Everything was cedar[b]; no stone was visible.
translation:
  language: ru
  text: Изнутри храм был обшит кедром, украшенным резными изображениями тыкв[a] и распустившихся цветов[b]. Всё было покрыто кедром, и камня не было видно.
  philosophy: optimal-equivalence
  footnotes:
