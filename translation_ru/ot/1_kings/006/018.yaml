    text: 'Или: «бутонов». Еврейское слово обозначает округлые декоративные формы и в данном описании храма может подразумевать резьбу в виде тыкв.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «цветочных соцветий». Еврейское выражение, вероятно, обозначает резной цветочный орнамент.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶז אֶל־הַבַּיִת פְּנִימָה
  choice: изнутри храм был обшит кедром
  rationale: Оборот указывает на кедровую облицовку внутренней поверхности здания. «Обшит кедром» естественно передаёт архитектурный контекст, не создавая впечатления, будто речь лишь о кедре, находившемся внутри.
- source_word: מִקְלַעַת
  choice: украшенным резными изображениями
  rationale: Слово обозначает резную или гравированную декоративную работу; выбранная формулировка ясно связывает резьбу с изображёнными растительными формами.
- source_word: פְּקָעִים
  choice: тыкв
  rationale: В описаниях храма слово, вероятно, обозначает округлые украшения в форме тыкв; возможное значение «бутоны» сохраняется в сноске.
- source_word: וּפְטוּרֵי צִצִּים
  choice: и распустившихся цветов
  rationale: Сочетание описывает цветочный орнамент, вероятно раскрытые или распускающиеся цветы; эта формулировка естественна по-русски и сохраняет образ цветения.
- source_word: הַכֹּל אֶרֶז
  choice: всё было покрыто кедром
  rationale: В контексте речь о полном покрытии видимых внутренних поверхностей кедровой облицовкой, что подтверждается следующим сообщением о невидимом камне.
- source_word: אֵין אֶבֶן נִרְאָה
  choice: камня не было видно
  rationale: 'Естественная русская конструкция сохраняет смысл еврейского пассивного выражения: каменная кладка была полностью скрыта.'
