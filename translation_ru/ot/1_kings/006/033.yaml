  rationale: Прямой и естественный эквивалент в контексте строительства.
- source_word: לְפֶתַח הַהֵיכָל
  choice: для входа в главный зал
  rationale: הֵיכָל здесь обозначает главное помещение храмового здания, отличное от внутреннего святилища; «главный зал» понятно современному читателю.
- source_word: מְזוּזוֹת
  choice: косяки
  rationale: В данном архитектурном контексте слово обозначает боковые стойки дверного проёма.
- source_word: עֲצֵי שָׁמֶן
  choice: из оливкового дерева
  rationale: Традиционно и по контексту породу дерева понимают как оливу; русская формулировка естественна.
- source_word: מֵאֵת רְבִעִית
  choice: в четверть проёма
  rationale: Трудная эллиптическая архитектурная формула, буквально связанная с «четвёртой частью». Основной текст сохраняет её количественный смысл, не превращая его без достаточной уверенности в указание на квадратную форму.
