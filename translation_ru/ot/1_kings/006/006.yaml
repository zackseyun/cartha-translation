  yaml_path: translation/ot/1_kings/006/006.yaml
  text: The lowest story was five cubits wide[a], the middle one six cubits wide, and the third seven cubits wide; for he made offsets around the outside of the temple[b], so that the beams would not be inserted into the walls of the temple.
translation:
  language: ru
  text: Нижний ярус[a] был шириной в пять локтей, средний — в шесть локтей, а третий — в семь локтей, ибо он устроил снаружи, по всему периметру храма, уступы[b], чтобы балки не крепились к стенам храма[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нижняя боковая пристройка»; еврейское слово может обозначать боковое сооружение при храме либо один из его ярусов.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «выступы», «отступы» или «углубления»; точный вид этой архитектурной детали не вполне ясен.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «чтобы не закрепляться (не держаться) в стенах дома». Балки прямо не упомянуты, но подразумеваются по строительному контексту.'
    reason: implicit_information
lexical_decisions:
- source_word: הַיָּצוּעַ
  choice: ярус
  rationale: В данном архитектурном контексте слово обозначает один из уровней боковой пристройки вокруг храмового здания. «Ярус» естественно передаёт последовательность нижнего, среднего и третьего уровней, не утверждая точнее, чем позволяет текст, что речь идёт об отдельных комнатах.
- source_word: הַתַּחְתֹּנָה
  choice: нижний
  rationale: 'Форма согласуется с подразумеваемым ярусом и открывает трёхчастную последовательность: нижний, средний, третий.'
- source_word: בָּאַמָּה ... רָחְבָּהּ
  choice: был шириной в ... локтей
  rationale: Сохраняется древняя мера длины; русская конструкция ясно передаёт указание ширины.
- source_word: מִגְרָעוֹת
  choice: уступы
  rationale: Термин обозначает архитектурные уступы или отступы наружной поверхности стены, благодаря которым верхние ярусы могли быть шире. «Уступы» понятно и достаточно нейтрально передаёт эту деталь.
- source_word: לַבַּיִת סָבִיב חוּצָה
  choice: снаружи по всему периметру храма
  rationale: Передаёт пространственный смысл «у дома кругом снаружи»; «храм» ясно обозначает референт слова בַּיִת в данном контексте.
- source_word: לְבִלְתִּי אֲחֹז בְּקִירוֹת הַבָּיִת
  choice: чтобы не врубать балки в стены храма
  rationale: Целевая конструкция передана естественно по-русски. «Балки» восстановлены из строительного контекста, поскольку в еврейском объект действия прямо не назван; примечание сохраняет буквальную неопределённость.
