  source_fidelity: Основная передача размеров и трёх уровней верна. Однако глагол נָתַן имеет явно выраженный субъект («он сделал/устроил»), тогда как безличное «были сделаны» ослабляет исходную формулировку. «Врубать» означает именно врезать в материал и несколько уже, чем контекстуально обусловленное «крепить/закреплять».
  naturalness: Текст в целом современный и понятный. Формулировка «ибо он устроил снаружи, по всему периметру храма, уступы» естественна в литературном описании архитектуры. «Чтобы балки не крепились к стенам» передаёт практический смысл без излишней технической конкретизации способа крепления.
  terminology: «Ярус», «локоть» и «уступы» уместны. Примечание к «уступам» необходимо, поскольку מִגְרָעוֹת допускает несколько близких архитектурных пониманий. «Храм» в данном контексте приемлемо для בַּיִת. В последней части «балки» следует сохранить как контекстуально восполняемое слово и прямо отметить это в сноске.
