  yaml_path: translation/ot/1_kings/006/029.yaml
  text: He carved all the walls of the house all around with engraved figures of cherubim[a], palm trees, and open flowers[c][b], on the inner and outer walls.
translation:
  language: ru
  text: На всех стенах храма[a] вокруг он вырезал изображения херувимов, пальм и распустившихся цветов[b] — как с внутренней, так и с внешней стороны[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «дома»; здесь так назван храм.'
    reason: cultural_note
  - marker: b
    text: 'Или: «раскрывшихся цветочных бутонов». Речь идёт о цветочном орнаменте, но его точный вид неизвестен.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «изнутри и снаружи». В данном контексте выражение, вероятно, относится к внутренним и внешним сторонам или частям святилища; точная архитектурная отсылка неясна.'
    reason: alternative_reading
lexical_decisions:
- source_word: קִירוֹת הַבַּיִת
  choice: стенах храма
  rationale: Слово בַּיִת буквально означает «дом», но в данном рассказе обозначает храмовое здание. «Храм» естественно и однозначно передаёт это контекстуальное значение; буквальная формулировка отмечена в сноске.
- source_word: מֵסַב
  choice: кругом
  rationale: Передаёт охват всех стен со всех сторон и сохраняет краткость еврейского выражения.
- source_word: קָלַע פִּתּוּחֵי מִקְלְעוֹת
  choice: вырезал изображения
  rationale: Сочетание обозначает выполненную резьбой декоративную работу. Русская формулировка естественно передаёт и способ исполнения, и изобразительный характер орнамента, не уточняя без достаточных оснований, была ли это рельефная или углублённая резьба.
- source_word: כְּרוּבִים
  choice: херувимов
  rationale: Традиционное и общепонятное русское наименование небесных существ, изображённых в храмовом убранстве.
- source_word: תִמֹרֹת
  choice: пальм
  rationale: Слово обозначает пальмы или пальмовидные декоративные мотивы; краткое «пальм» естественно в перечислении изображений.
- source_word: פְטוּרֵי צִצִּים
  choice: распустившихся цветов
  rationale: Фраза описывает цветочный орнамент, вероятно раскрытые или распускающиеся цветы. Точная художественная форма неясна, поэтому неопределённость отражена в сноске.
- source_word: מִלִּפְנִים וְלַחִיצוֹן
  choice: и во внутренней, и во внешней части
  rationale: Формулировка передаёт противопоставление внутренней и внешней частей святилища, не добавляя прямо отсутствующее в еврейском тексте слово «помещение» или «стена». Более буквальное пространственное понимание приведено в сноске.
