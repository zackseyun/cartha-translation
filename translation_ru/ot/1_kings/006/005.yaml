source:
  edition: WLC
  text: וַ/יִּבֶן֩ עַל קִ֨יר הַ/בַּ֤יִת יצוע סָבִ֔יב אֶת קִיר֤וֹת הַ/בַּ֨יִת֙ סָבִ֔יב לַֽ/הֵיכָ֖ל וְ/לַ/דְּבִ֑יר וַ/יַּ֥עַשׂ צְלָע֖וֹת סָבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/005.yaml
  text: He built against the wall of the house a structure all around[a], against the walls of the house all around, around both the nave and the inner sanctuary[c][b]; and he made side rooms all around.
translation:
  language: ru
  text: Он возвёл у стены храма сооружение, шедшее кругом[a], вдоль всех стен храма — вокруг главного зала[b] и внутреннего святилища[c], — и устроил кругом боковые помещения.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «окружавшую храм пристройку». Редкое еврейское слово יצוע обозначает конструкцию, возведённую вокруг стен храма.'
    reason: lexical_alternative
  - marker: b
    text: Еврейское הֵיכָל здесь означает главный зал храма, отличный от внутреннего святилища (דְּבִיר).
    reason: cultural_note
  - marker: c
    text: 'Или: «Святого святых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: он возвёл
  rationale: Глагол בנה в повествовательной форме передан естественным русским прошедшим временем; «возвёл» уместно для строительных работ.
- source_word: עַל קִיר הַבַּיִת
  choice: у стены храма
  rationale: Предлог עַל здесь обозначает примыкание сооружения к стене, а не расположение поверх неё; הַבַּיִת в данном контексте — храм.
- source_word: יצוע
  choice: сооружение, шедшее кругом
  rationale: Редкое архитектурное существительное не позволяет уверенно определить точный вид конструкции. Нейтральное «сооружение» сохраняет эту неопределённость, а оборот «шедшее кругом» передаёт סָבִיב.
- source_word: סָבִיב
  choice: кругом / вокруг / вдоль всех стен
  rationale: Повтор корня сохранён в основных местах, но частично варьирован ради естественного русского синтаксиса; выражение подчёркивает охватывающую храм конструкцию.
- source_word: אֶת קִירוֹת הַבַּיִת
  choice: вдоль всех стен храма
  rationale: Множественное число «стен» сохранено; «всех» естественно выражает охватывающее значение повторённого סָבִיב.
- source_word: לַהֵיכָל
  choice: вокруг главного зала
  rationale: הֵיכָל здесь обозначает главное помещение храмового здания в отличие от внутреннего святилища.
- source_word: וְלַדְּבִיר
  choice: и внутреннего святилища
  rationale: דְּבִיר обозначает внутреннее священное помещение. Этот перевод ясен и не навязывает более позднюю терминологию.
- source_word: וַיַּעַשׂ צְלָעוֹת
  choice: и устроил боковые помещения
  rationale: Хотя צְלָעוֹת буквально связано со значением «бока» или «рёбра», в архитектурном контексте речь идёт о помещениях по сторонам храма.
theological_decisions:
- issue: Обозначение דְּבִיר
  choice: внутреннее святилище
  alternative: Святое святых
  rationale: «Внутреннее святилище» непосредственно передаёт архитектурное различие и не устраняет возможность привычного культового наименования, указанного в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Архитектурные термины сделаны понятными неспециалисту; редкость и неопределённость יצוע не скрыты. Повтор пространственных указаний в основном сохранён как особенность исходного текста.
