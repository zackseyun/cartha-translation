  text: וְ/חָמֵ֣שׁ אַמּ֗וֹת כְּנַ֤ף הַ/כְּרוּב֙ הָֽ/אֶחָ֔ת וְ/חָמֵ֣שׁ אַמּ֔וֹת כְּנַ֥ף הַ/כְּר֖וּב הַ/שֵּׁנִ֑ית עֶ֣שֶׂר אַמּ֔וֹת מִ/קְצ֥וֹת כְּנָפָ֖י/ו וְ/עַד קְצ֥וֹת כְּנָפָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/024.yaml
  text: And five cubits was the one wing of the cherub[a], and five cubits the second wing of the cherub; ten cubits from the end of its wings to the end of its wings.
translation:
  language: ru
  text: Одно крыло херувима было длиной в пять локтей, и второе крыло херувима — в пять локтей; всего от конца одного его крыла до конца другого его крыла — десять локтей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָמֵשׁ אַמּוֹת
  choice: пять локтей
  rationale: Обычное обозначение меры длины; «локоть» — традиционный и понятный русский эквивалент אַמָּה.
- source_word: כְּנַף
  choice: крыло
  rationale: В описании херувима слово обозначает именно крыло.
- source_word: הַכְּרוּב
  choice: херувим
  rationale: Форма единственного числа обозначает отдельное изваяние херувима.
- source_word: הָאֶחָת
  choice: одно
  rationale: Передаёт буквальное «одно», не заменяя его порядковым «первое».
- source_word: הַשֵּׁנִית
  choice: второе
  rationale: Прямой эквивалент порядкового числительного, согласованного со словом «крыло».
- source_word: עֶשֶׂר אַמּוֹת
  choice: десять локтей
  rationale: Общая величина полного размаха двух крыльев.
- source_word: מִקְצוֹת ... וְעַד קְצוֹת
  choice: от конца одного ... до конца другого
  rationale: Естественно выражает измерение между двумя крайними точками; добавление «одного» и «другого» ясно передаёт подразумеваемые разные крылья.
- source_word: כְּנָפָיו
  choice: его крыла
  rationale: Местоимение мужского рода соответствует русскому слову «херувим»; единственное число в каждой части фразы естественно обозначает каждую из двух крайних точек.
