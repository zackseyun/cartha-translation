  yaml_path: translation/ot/1_kings/006/031.yaml
  text: For the entrance of the inner sanctuary he made doors of olivewood[a]; the doorposts and jambs were five-sided.
translation:
  language: ru
  text: Для входа во внутреннее святилище он сделал двери из масличного дерева; дверная рама и косяки имели пять сторон.[a]
  philosophy: optimal-equivalence
  footnotes:
