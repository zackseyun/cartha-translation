    text: 'Или: «дверная рама и косяки составляли пятую часть». Это традиционное, но неясное с архитектурной точки зрения понимание заключительной фразы.'
    reason: alternative_reading
lexical_decisions:
- source_word: פֶּתַח
  choice: вход
  rationale: Слово обозначает проём или место входа, а не сами дверные створки, названные далее.
- source_word: הַדְּבִיר
  choice: внутреннее святилище
  rationale: В описании храма דְּבִיר — самое внутреннее помещение. Такой перевод ясен современному читателю и не вводит более позднюю специальную терминологию.
- source_word: דַּלְת֣וֹת
  choice: двери
  rationale: Форма множественного числа указывает на парные створки; естественное русское «двери» передаёт это без излишней технической детализации.
- source_word: עֲצֵי שָׁמֶן
  choice: из масличного дерева
  rationale: Буквально выражение связано с «масляным деревом»; в данном контексте это древесина оливы либо близкого масличного дерева. «Масличное дерево» сохраняет ботаническую осторожность исходного обозначения.
- source_word: הָאַיִל
  choice: дверная рама
  rationale: В архитектурном употреблении אַיִל может обозначать несущую часть или обрамление дверного проёма. «Дверная рама» естественно сочетается с последующим упоминанием косяков.
- source_word: מְזוּזוֹת
  choice: косяки
  rationale: Слово обозначает боковые стойки дверного проёма. «Косяки» сохраняет различие между ними и рамой.
- source_word: חֲמִשִׁית
  choice: была пятиугольной
  rationale: Краткая и эллиптическая еврейская фраза, вероятно, описывает пятистороннюю форму обрамления. Неопределённость отражена в сноске с традиционной альтернативой.
