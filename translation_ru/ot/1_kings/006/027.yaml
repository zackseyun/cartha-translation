base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/027.yaml
  text: He placed the cherubim inside the inner house[a], and the cherubim spread out their wings, so that the wing of the one touched the wall, and the wing of the second cherub touched the other wall; and their wings toward the middle of the house were touching wing to wing.
translation:
  language: ru
  text: 'Он поставил херувимов во внутреннем помещении Храма[a]. Херувимы расправили крылья: крыло одного касалось стены, а крыло второго херувима — другой стены; их крылья, обращённые к середине Храма, соприкасались крыло с крылом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во внутреннем святилище». Буквально: «внутри внутреннего дома»; речь идёт о самом внутреннем помещении Храма.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: поставил
  rationale: В данном архитектурном контексте נתן означает размещение предметов в определённом месте; «поставил» естественно передаёт это значение.
- source_word: הַכְּרוּבִים
  choice: херувимов
  rationale: Традиционное русское обозначение этих небесных существ сохраняет культовый и богословский регистр.
- source_word: בְּתוֹךְ הַבַּיִת הַפְּנִימִי
  choice: внутри внутреннего помещения Храма
  rationale: Сохраняется повтор внутренней локализации и значение בַּיִת как части храмового здания; «помещение» здесь понятнее буквального «дом».
- source_word: וַיִּפְרְשׂוּ אֶת כַּנְפֵי הַכְּרֻבִים
  choice: Херувимы расправили крылья
  rationale: Формально еврейский текст допускает «они расправили крылья херувимов», но контекст естественно указывает на самих херувимов как субъект; русская формулировка избегает неясности.
- source_word: וַתִּגַּע / נֹגַעַת / נֹגְעֹת
  choice: касалось / соприкасались
  rationale: Корень נגע обозначает физический контакт; выбранные формы естественно описывают расположение крыльев.
- source_word: כְּנַף הָאֶחָד
  choice: крыло одного
  rationale: Близко передаёт еврейское «крыло одного», не добавляя отсутствующего в тексте порядкового «первого».
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: второго херувима
  rationale: Сохраняет явно выраженное в еврейском тексте порядковое числительное.
- source_word: הַקִּיר הַשֵּׁנִי
  choice: другой стены
  rationale: При противопоставлении двух стен по-русски естественно сказать «другая стена», хотя буквально стоит «вторая стена».
- source_word: וְכַנְפֵיהֶם אֶל תּוֹךְ הַבַּיִת
  choice: их крылья, обращённые к середине Храма
  rationale: Фраза передаёт направление внутренних крыльев к центральной части помещения, где они встречались.
- source_word: נֹגְעֹת כָּנָף אֶל כָּנָף
  choice: соприкасались крыло с крылом
  rationale: Сохранён наглядный образ и почти буквальная конструкция исходного текста.
