  yaml_path: translation/ot/1_kings/006/022.yaml
  text: He overlaid the whole house with gold[a], until the whole house was finished[b]; and he overlaid with gold the whole altar that belonged to the inner sanctuary.
translation:
  language: ru
  text: Он покрыл золотом весь храм, пока не завершил весь храм; и весь жертвенник, относившийся к внутреннему святилищу[a], он покрыл золотом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весь жертвенник внутреннего святилища». Еврейское выражение указывает на связь жертвенника с внутренним святилищем, но не уточняет, шла ли речь о принадлежности или о его расположении относительно него.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: храм
  rationale: Буквально слово означает «дом», но в данном описании строительства речь однозначно идёт о храме; «храм» естественно и ясно для современного русского читателя.
- source_word: צִפָּה
  choice: покрыл
  rationale: В строительном контексте глагол обозначает покрытие поверхности материалом, здесь золотом. Русское «покрыл золотом» точно и естественно.
- source_word: זָהָב
  choice: золото
  rationale: Прямое обозначение материала без контекстуальной неоднозначности.
- source_word: עַד תֹּם
  choice: до полного завершения
  rationale: Передаёт значение доведения работы до конца и сохраняет несколько необычный повтор «всего храма» в еврейском тексте.
- source_word: כָּל
  choice: весь / всего
  rationale: Передаёт повторяющийся акцент исходного текста на полноте охвата.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Стандартное и понятное русское соответствие культовому термину.
- source_word: אֲשֶׁר לַדְּבִיר
  choice: относившийся к внутреннему святилищу
  rationale: Предлог ל выражает связь или принадлежность, но не позволяет уверенно определить точное местоположение жертвенника; формулировка сохраняет эту неопределённость.
- source_word: דְּבִיר
  choice: внутреннее святилище
  rationale: Ясно обозначает внутреннее помещение храма и не вводит более позднюю устойчивую терминологию там, где лексема сама по себе её не требует.
theological_decisions:
- issue: Связь жертвенника с внутренним святилищем
  choice: относившийся к внутреннему святилищу
  alternative: находившийся во внутреннем святилище / стоявший перед внутренним святилищем
  rationale: Еврейское אֲשֶׁר לַדְּבִיר указывает на отношение жертвенника к внутреннему святилищу, не уточняя однозначно пространственную связь; перевод не должен без достаточных оснований определять его местоположение.
translation_notes:
  register: Современный литературный русский язык с достоинством храмового повествования. Сохранены повтор «весь храм» и двукратное «покрыл золотом», отражающие структуру и акценты еврейского текста; неоднозначная связь жертвенника с внутренним святилищем не сведена к конкретному местоположению.
