translation_notes:
  register: Современный литературный русский язык с ясной архитектурной терминологией. Слово «храм» употреблено для контекстуального значения הַבַּיִת; древняя мера «локоть» сохранена. Тире помогают показать, что длина притвора соответствовала всей ширине фасада.
