base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/003.yaml
  text: The portico in front of the nave of the house was twenty cubits long[a], across the width of the house[c][b], and ten cubits deep in front of the house.
translation:
  language: ru
  text: Притвор перед главным залом храма имел двадцать локтей в длину, по ширине храма, и десять локтей в глубину перед храмом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «десять локтей — его ширина — перед храмом». Поскольку притвор находился перед храмовым зданием, этот размер обозначает его глубину, то есть расстояние от фасада храма до переднего края притвора.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאוּלָם
  choice: притвор
  rationale: В храмовой архитектуре אוּלָם обозначает входную часть перед главным залом. «Притвор» — понятный и уместный русский архитектурный термин.
- source_word: עַל־פְּנֵי הֵיכַל הַבָּיִת
  choice: перед главным залом храма
  rationale: הֵיכַל здесь означает главный зал храмового здания, отличный от притвора и внутреннего святилища; передача «храма» вместо буквального «дома» естественна и устраняет ненужную неясность.
- source_word: עֶשְׂרִים אַמָּה אָרְכּוֹ
  choice: двадцать локтей в длину
  rationale: Сохранена древняя единица измерения; именная конструкция естественно передана по-русски как указание длины.
- source_word: עַל־פְּנֵי רֹחַב הַבָּיִת
  choice: по всей ширине храма
  rationale: Фраза указывает, что длина притвора проходила вдоль фасада и соответствовала ширине храмового здания.
- source_word: עֶשֶׂר בָּאַמָּה רָחְבּוֹ
  choice: десять локтей в глубину
  rationale: Буквально רָחְבּוֹ означает «его ширина», но применительно к притвору перед фасадом речь идёт о размере от передней стороны к храму; «в глубину» ясно передаёт пространственную ориентацию.
- source_word: עַל־פְּנֵי הַבָּיִת
  choice: перед храмом
  rationale: Сохранено пространственное указание, связывающее десяти локтевый размер с выступом притвора перед храмовым зданием.
