base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/008.yaml
  text: The entrance to the middle side chamber was on the right side of the house[a], and by winding stairs they went up to the middle story[b], and from the middle to the third.
translation:
  language: ru
  text: Вход в среднюю боковую комнату находился с правой стороны храма. По винтовым лестницам[a] поднимались на средний ярус, а со среднего — на третий[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по извилистым лестницам». Значение редкого еврейского слова точно не установлено; вероятно, оно обозначает винтовые или извилистые лестницы.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от среднего к третьему», то есть от среднего яруса к третьему.'
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּתַח
  choice: вход
  rationale: Слово обозначает проём или место входа; «вход» естественно звучит в архитектурном описании.
- source_word: הַצֵּלָע הַתִּיכֹנָה
  choice: средняя боковая комната
  rationale: В описании храма צֵלָע обозначает боковое помещение или пристройку, а תִּיכֹנָה — «средняя». Сохранено единственное число масоретского текста.
- source_word: אֶל כֶּתֶף הַבַּיִת הַיְמָנִית
  choice: с правой стороны храма
  rationale: כֶּתֶף буквально означает «плечо», здесь — боковую сторону здания. יְמָנִית передано как «правая», без навязывания возможного пространственного толкования «южная». В данном контексте הַבַּיִת — храм.
- source_word: וּבְלוּלִּים
  choice: по винтовым лестницам
  rationale: Редкое слово в данном архитектурном контексте традиционно понимается как обозначение винтовых или извилистых лестниц; основной вариант выбран за ясность, а неопределённость отмечена в сноске.
- source_word: יַעֲלוּ
  choice: поднимались
  rationale: 'Форма третьего лица множественного числа имеет безлично-обобщённый смысл: так люди поднимались между ярусами.'
- source_word: עַל הַתִּיכֹנָה
  choice: на средний ярус
  rationale: Последовательность уровней здания показывает, что речь идёт о среднем этаже или ярусе; «ярус» уместен для храмовой пристройки.
- source_word: וּמִן הַתִּיכֹנָה אֶל הַשְּׁלִשִׁים
  choice: а со среднего — на третий
  rationale: Передана краткость древнееврейского выражения; подразумеваемое слово «ярус» ясно из предыдущей части.
theological_decisions: []
