source:
  edition: WLC
  text: וַ/יְצַ֨ף שְׁלֹמֹ֧ה אֶת הַ/בַּ֛יִת מִ/פְּנִ֖ימָה זָהָ֣ב סָג֑וּר וַ/יְעַבֵּ֞ר ב/רתיקות זָהָב֙ לִ/פְנֵ֣י הַ/דְּבִ֔יר וַ/יְצַפֵּ֖/הוּ זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/021.yaml
  text: Solomon overlaid the inside of the house with pure gold[a], and he drew gold chains across the front of the inner sanctuary[c][b], and overlaid it with gold.
translation:
  language: ru
  text: Соломон обложил дом внутри чистым золотом[a], протянул золотые цепи перед внутренним святилищем[b][c] и обложил его золотом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «очищенным золотом». Буквально еврейское выражение означает «закрытое золото» и, вероятно, служит обозначением золота высокого качества.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «протянул золотые цепи поперёк передней стороны внутреннего святилища». Глагол допускает представление о цепях, протянутых поперёк пространства.'
    reason: alternative_reading
  - marker: c
    text: «Внутреннее святилище» — дебир, самое внутреннее помещение храма, позднее называемое Святым святых.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַף
  choice: обложил
  rationale: В контексте отделки храма глагол означает покрытие поверхности слоем материала, здесь — золота.
- source_word: הַבַּיִת
  choice: дом
  rationale: Сохраняет буквальное обозначение храмового здания в еврейском тексте; из контекста ясно, что речь о храме.
- source_word: מִפְּנִימָה
  choice: внутри
  rationale: Естественно передаёт указание на внутреннюю часть дома.
- source_word: זָהָב סָגוּר
  choice: чистое золото
  rationale: Устойчиво и понятно передаёт вероятный смысл идиомы как золота высокого качества; буквальное значение определения неясно.
- source_word: וַיְעַבֵּר
  choice: протянул
  rationale: Каузативная форма глагола «проходить» здесь, вероятно, описывает размещение или протягивание цепей перед святилищем.
- source_word: בְּרַתּוּקוֹת
  choice: цепи
  rationale: Редкое существительное, которое в данном архитектурном контексте наиболее вероятно обозначает цепи.
- source_word: לִפְנֵי הַדְּבִיר
  choice: перед внутренним святилищем
  rationale: Формально передаёт пространственное выражение, не уточняя без достаточных оснований, что цепи шли поперёк всей передней стороны.
- source_word: הַדְּבִיר
  choice: внутреннее святилище
  rationale: Обозначает самое внутреннее помещение храма; этот вариант точен и понятен, не подменяя термин более поздним названием.
- source_word: וַיְצַפֵּהוּ
  choice: обложил его
  rationale: Сохраняет местоименный суффикс мужского рода и не устраняет неоднозначность его референта.
