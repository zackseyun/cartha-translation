  source_fidelity: 'Текст точно передаёт основные элементы еврейского оригинала: покрытие внутренней части дома высококачественным золотом, золотые цепи перед дебиром и заключительное покрытие золотом. «Перед внутренним святилищем» корректно сохраняет пространственную формулировку לִפְנֵי, не навязывая более конкретную реконструкцию устройства цепей. «Его» сохраняет краткую синтаксическую неоднозначность суффикса וַיְצַפֵּהוּ.'
