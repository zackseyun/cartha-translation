lexical_decisions:
- source_word: וַיְהִי
  choice: И было
  rationale: Форма продолжает повествование и вместе с דְּבַר образует обычную формулу введения Божьей речи; перевод сохраняет её краткость и торжественный строй.
- source_word: דְּבַר
  choice: слово
  rationale: В сочетании דְּבַר יְהוָה обозначает исходящее от Бога откровение или сообщение; «слово» сохраняет повторяющуюся библейскую формулу.
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, а не заменено титулом; традиционный русский вариант «Господь» указан в примечании.
- source_word: אֶל שְׁלֹמֹה
  choice: к Соломону
  rationale: Предлог אֶל указывает адресата Божьего слова; «к Соломону» естественно сочетается с русской формулой «было слово».
- source_word: לֵאמֹר
  choice: ':'
  rationale: Инфинитив вводит содержание речи в следующем стихе. В современном русском эту функцию естественно и точно передаёт двоеточие.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: В еврейском тексте стоит собственное имя Бога. «Яхве» сохраняет это различие, тогда как «Господь» отражает древнюю традицию замены имени титулом; альтернативный привычный вариант отмечен в сноске.
translation_notes:
  register: Современный литературный русский с сохранением краткой библейской формулы. Двоеточие вместо буквального «говоря» ясно связывает стих с последующей прямой речью.
