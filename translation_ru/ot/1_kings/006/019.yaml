lexical_decisions:
- source_word: דְבִיר
  choice: Святое святых
  rationale: В контексте храма слово обозначает самое внутреннее помещение, предназначенное для ковчега. Устоявшееся русское выражение ясно передаёт референт, не воспроизводя непрозрачное традиционное значение «оракул».
- source_word: בְּתוֹךְ הַבַּיִת מִפְּנִימָה
  choice: во внутренней части храма
  rationale: Сочетание указывает на расположение внутри храмового здания. «Храм» естественно передаёт контекстуальное значение בַּיִת, а מִפְּנִימָה выражено словами «во внутренней части».
- source_word: הֵכִין
  choice: устроил
  rationale: Глагол означает приготовить или привести в готовность. В отношении храмового помещения «устроил» звучит естественно и не уточняет сверх текста, шла ли речь только о строительстве или также об оборудовании.
- source_word: לְתִתֵּן
  choice: чтобы поместить
  rationale: Инфинитив выражает цель; «поместить» соответствует торжественному контексту и естественно сочетается с ковчегом.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: ковчег завета Яхве
  rationale: Передаёт еврейскую конструкцию принадлежности ясно и без добавочного толкования.
- source_word: יְהוָה
  choice: Яхве
  rationale: Тетраграмматон передан личным именем «Яхве», а не заменён титулом.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Исходный текст прямо употребляет тетраграмматон; «Яхве» сохраняет личное имя и наиболее вероятную научную реконструкцию произношения.
- issue: Обозначение внутреннего помещения דְבִיר
  choice: Святое святых
  alternative: внутреннее святилище; давир; оракул
  rationale: Здесь речь идёт о самом внутреннем помещении храма, где должен находиться ковчег. «Святое святых» — понятное современному русскому читателю библейское обозначение этого помещения; примечание сохраняет сведения о точном еврейском термине.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис сохранён простым; повторное указание на внутреннее расположение передано естественной русской конструкцией.
