base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/010.yaml
  text: He built the side structure against the whole house[a], five cubits high[b], and it was fastened to the house with cedar timbers.
translation:
  language: ru
  text: Он пристроил к храмовому зданию боковую пристройку[a] вдоль всего здания, высотой в пять локтей, и соединил её с храмом кедровыми балками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «боковые помещения». Еврейское слово, вероятно, обозначает примыкавшее к храму боковое сооружение; выражение «вдоль всего здания» также может подразумевать охват вокруг храмового здания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: Он пристроил
  rationale: Форма wayyiqtol от בנה продолжает повествование; «пристроил» естественно передаёт строительство примыкающего сооружения с учётом עַל.
- source_word: היצוע
  choice: боковую постройку
  rationale: Редкое архитектурное существительное обозначает примыкающее к храму боковое сооружение; широкий термин не сводит его однозначно к отдельным комнатам или платформе.
- source_word: עַל כָּל הַבַּיִת
  choice: к храму по всей его длине
  rationale: עַל имеет здесь пространственное значение примыкания, а כָּל указывает на охват всего здания; «по всей его длине» естественно выражает протяжённость пристройки, не добавляя идеи окружения со всех сторон.
- source_word: חָמֵשׁ אַמּוֹת קוֹמָתוֹ
  choice: высотой в пять локтей
  rationale: Идиоматическая русская передача именной меры высоты с местоименным суффиксом, относящимся к боковой постройке.
- source_word: וַיֶּאֱחֹז אֶת הַבַּיִת
  choice: соединил её с храмом
  rationale: אחז буквально означает «держать, охватывать», но в строительном контексте описывает конструктивное соединение; в русском активная форма с восстановленным Соломоном как субъектом наиболее естественна, а местоимение «её» поясняет объект соединения.
- source_word: בַּעֲצֵי אֲרָזִים
  choice: кедровыми брусьями
  rationale: עֲצֵי в строительном контексте обозначает деревянные конструктивные элементы; «брусья» передаёт их функцию, хотя возможен более общий перевод «кедровыми балками/деревом».
