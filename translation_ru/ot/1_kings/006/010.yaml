translation_notes:
  register: Современный литературный русский язык с ясной архитектурной лексикой. «Храм» употреблено вместо буквального «дом», поскольку в данном контексте речь идёт о храмовом здании. Сохранена неопределённость редкого термина היצוע посредством общего выражения и сноски.
