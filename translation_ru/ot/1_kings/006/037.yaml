base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/037.yaml
  text: In the fourth year[a], the house of Yahweh was founded in the month of Ziv.
translation:
  language: ru
  text: В четвёртый год, в месяце Зиве, был заложен дом Яхве[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «было заложено основание дома Яхве».'
    reason: 'Лексико-синтаксическая альтернатива: глагол יֻסַּד может быть естественно развёрнут по-русски как указание на закладку основания.'
lexical_decisions:
- source_word: בַּשָּׁנָה הָרְבִיעִית
  choice: В четвёртый год
  rationale: Прямо передаёт еврейское обстоятельство времени. Уточнение «царствования Соломона» известно из контекста, но в самом стихе не повторяется, поэтому в текст не добавлено.
- source_word: יֻסַּד
  choice: был заложен
  rationale: Страдательная форма глагола יסד обозначает основание здания или закладку его фундамента. Русское «был заложен» естественно в строительном контексте и сохраняет краткость еврейской фразы.
- source_word: בֵּית יְהוָה
  choice: дом Яхве
  rationale: Слово בַּיִת буквально означает «дом» и здесь относится к храму. Перевод «дом» сохраняет исходный образ, не заменяя его пояснительным словом «храм».
- source_word: יְהוָה
  choice: Яхве
  rationale: Передано как личное имя Бога, соответствующее тетраграмматону יהוה, а не заменено титулом.
- source_word: בְּיֶרַח זִו
  choice: в месяце зиве
  rationale: יֶרַח означает «месяц», а זִו — его название. Указание, что это второй месяц, содержится в более широком контексте, но не в данном стихе.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь
  rationale: В исходном тексте стоит личное имя יהוה. Форма «Яхве» сохраняет различие между именем и титулом, не вводя дополнительного толкования.
- issue: Значение יֻסַּד применительно к дому Яхве
  choice: был заложен дом Яхве
  alternative: было заложено основание дома Яхве
  rationale: Основной текст сохраняет грамматическую конструкцию, в которой «дом Яхве» является подлежащим. В сноске дан более явный строительный смысл глагола, не утверждая, что в этот момент было завершено всё здание.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейского повествования. Порядок обстоятельств слегка перестроен ради естественности: оба указания времени собраны перед сказуемым. Название месяца дан в форме «зив» и склонено по-русски.'
