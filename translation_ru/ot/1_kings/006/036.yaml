  text: וַ/יִּ֨בֶן֙ אֶת הֶ/חָצֵ֣ר הַ/פְּנִימִ֔ית שְׁלֹשָׁ֖ה טוּרֵ֣י גָזִ֑ית וְ/ט֖וּר כְּרֻתֹ֥ת אֲרָזִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/036.yaml
  text: And he built the inner court with three rows of cut stone and a row of cedar beams[a].
translation:
  language: ru
  text: 'И построил он внутренний двор: три ряда тёсаного камня и один ряд кедровых брусьев.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «три яруса кладки из тёсаного камня и один ярус из кедровых брусьев».'
    reason: Слово טוּר может обозначать не только горизонтальный ряд, но и кладочный ярус; точное устройство конструкции остаётся не вполне определённым.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: И построил он
  rationale: Последовательная форма повествования продолжает рассказ о строительстве; союз «и» сохраняет связь с предыдущим действием.
- source_word: הֶחָצֵר הַפְּנִימִית
  choice: внутренний двор
  rationale: Существительное обозначает двор или ограждённое пространство, а прилагательное уточняет, что речь идёт о внутреннем дворе храмового комплекса.
- source_word: שְׁלֹשָׁה טוּרֵי
  choice: три ряда
  rationale: טוּר в строительном контексте может обозначать ряд или кладочный ярус; «ряды» понятно современному читателю, а технический вариант отмечен в сноске.
- source_word: גָזִית
  choice: тёсаного камня
  rationale: Слово обозначает обработанный, обтёсанный строительный камень; это традиционное и ясное русское соответствие.
- source_word: וְטוּר
  choice: и один ряд
  rationale: Хотя числительное «один» отдельно не выражено, единственное число טוּר после «трёх рядов» естественно указывает на один дополнительный ряд; добавление делает конструкцию ясной по-русски.
- source_word: כְּרֻתֹת אֲרָזִים
  choice: кедровых брусьев
  rationale: Фраза буквально относится к обрезанным или подготовленным кускам кедровой древесины; «брусья» естественно передаёт их вероятную строительную функцию, не утверждая более точную форму деталей.
