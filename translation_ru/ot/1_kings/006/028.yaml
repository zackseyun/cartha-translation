  text: And he overlaid the cherubim with gold[a].
translation:
  language: ru
  text: И обложил он херувимов золотом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «покрыл херувимов золотом»; или: «позолотил херувимов».'
    reason: 'Лексические варианты передачи צפה: глагол обозначает покрытие предмета слоем золота, но сам по себе не уточняет технологию отделки.'
lexical_decisions:
- source_word: וַיְצַף
  choice: обложил
  rationale: В контексте храмового строительства глагол צפה означает покрытие предмета слоем материала, особенно металла. «Обложил золотом» — естественное и традиционное русское выражение, сохраняющее конкретный характер отделки.
- source_word: אֶת
  choice: не переводится отдельно
  rationale: Показатель определённого прямого дополнения; самостоятельного соответствия в русском языке не имеет.
- source_word: הַכְּרוּבִים
  choice: херувимов
  rationale: Устоявшееся русское библейское наименование небесных существ, изображённых в храме; форма передаёт определённое прямое дополнение во множественном числе.
- source_word: זָהָב
  choice: золотом
  rationale: Существительное обозначает материал покрытия; русский творительный падеж после «обложил» естественно передаёт эту конструкцию.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства храмового повествования. Инверсия «И обложил он» передаёт повествовательную связь с предыдущим контекстом, не создавая архаической неясности.
