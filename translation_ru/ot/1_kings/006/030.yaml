  yaml_path: translation/ot/1_kings/006/030.yaml
  text: He overlaid the floor of the house with gold[b][a], on the inside and on the outside.
translation:
  language: ru
  text: И пол дома он покрыл золотом — внутри и снаружи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: По-видимому, имеется в виду, что пол был покрыт золотом повсюду — от внутренней части храма до внешней.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְקַע
  choice: пол
  rationale: В контексте храмового строительства слово обозначает поверхность пола, а не землю вообще.
- source_word: הַבַּיִת
  choice: дома
  rationale: Сохранено буквальное обозначение храма как «дома», естественное и значимое в данном контексте.
- source_word: צִפָּה
  choice: покрыл
  rationale: Глагол означает покрытие поверхности материалом; «покрыл золотом» естественно звучит по-русски и точно передаёт строительное действие.
- source_word: זָהָב
  choice: золотом
  rationale: Прямое обозначение материала.
- source_word: לִפְנִימָה וְלַחִיצוֹן
  choice: внутри и снаружи
  rationale: Сохранена краткая пространственная пара оригинала без уточнения, которое устранило бы её неоднозначность.
