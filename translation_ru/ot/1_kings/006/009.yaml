lexical_decisions:
- source_word: הַבַּיִת
  choice: храм
  rationale: В данном контексте «дом» означает храм Господа; современное русское «храм» ясно передаёт референт без добавления конфессиональной окраски.
- source_word: וַיְכַלֵּהוּ
  choice: завершил его
  rationale: Передаёт значение полного окончания строительных работ и сохраняет местоименный объект.
- source_word: וַיִּסְפֹּן
  choice: покрыв
  rationale: Глагол обозначает покрытие или обшивку; деепричастная конструкция естественно связывает это действие с завершением здания.
- source_word: גֵבִים וּשְׂדֵרֹת בָּאֲרָזִים
  choice: кедровыми балками, расположенными рядами
  rationale: 'Сохраняет оба конструктивных элемента выражения: балки и их рядовое расположение; «кедровыми» естественно передаёт материал.'
