  source_fidelity: 'В черновике верно переданы строительство, завершение и кедровый материал. Однако два координированных строительных термина גֵּבִים וּשְׂדֵרֹת сведены к одному: «балки, расположенные рядами». В еврейском тексте это два элемента покрытия; точное техническое различие второго слова не вполне определённо.'
  naturalness: «Покрыв храм кедровыми балками, расположенными рядами» звучит гладко, но деепричастие ослабляет последовательность двух личных глаголов, а причастный оборот меняет структуру исходного выражения. «Покрыл храм балками и рядами из кедра» естественно для современного литературного русского в описании древней конструкции.
  terminology: «Храм» уместно по контексту храма Соломона. «Кедр» точно передаёт אֲרָזִים как строительный материал. «Ряды» сохраняет осторожную, не конфессионально обусловленную и не чрезмерно конкретизированную передачу שְׂדֵרֹת, согласующуюся с английским аудиторским текстом.
