  text: А дом — то есть главный зал перед внутренним святилищем — был длиной сорок локтей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַרְבָּעִים בָּ/אַמָּה
  choice: А … длиной в сорок локтей
  rationale: Союз связывает стих с предшествующим описанием здания. אַמָּה обозначает локоть; слово «длиной» добавлено по смыслу для естественного выражения размера по-русски.
- source_word: הַ/בָּיִת
  choice: Дом
  rationale: Буквально «дом»; в данном контексте это обозначение храма. Заглавная буква помогает читателю распознать храмовое употребление, а последующее пояснение уточняет, какая его часть имеется в виду.
- source_word: ה֖וּא
  choice: то есть
  rationale: Местоимение имеет пояснительно-приложительное значение и конкретизирует предшествующее «Дом».
- source_word: הַ/הֵיכָל
  choice: главный зал
  rationale: Здесь הֵיכָל означает главное помещение храмового здания, отличное от внутреннего святилища. «Главный зал» понятно современному читателю и не привносит более позднюю специальную терминологию.
- source_word: לִ/פְנָֽ/י
  choice: перед внутренним святилищем
  rationale: Форма означает «перед»; подразумеваемый объект восстанавливается из предыдущего стиха, где говорится о внутреннем святилище.
- source_word: הָיָה
  choice: был
  rationale: Простая связка точно передаёт описательную конструкцию еврейского текста.
