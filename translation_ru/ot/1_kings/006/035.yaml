  text: וְ/קָלַ֤ע כְּרוּבִים֙ וְ/תִ֣מֹר֔וֹת וּ/פְטֻרֵ֖י צִצִּ֑ים וְ/צִפָּ֣ה זָהָ֔ב מְיֻשָּׁ֖ר עַל הַ/מְּחֻקֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/035.yaml
  text: He carved cherubim and palm trees and open flowers, and overlaid them with gold, fitted over the carved work.
translation:
  language: ru
  text: Он вырезал на них херувимов, пальмы и распустившиеся цветы и покрыл их золотом, плотно пригнанным к резному узору.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְקָלַע
  choice: вырезал
  rationale: Глагол в данном контексте обозначает выполнение резного орнамента; простое «вырезал» естественно по-русски и согласуется с упоминанием резного узора в конце стиха.
- source_word: תִמֹרוֹת
  choice: пальмы
  rationale: Слово обозначает пальмовидные изображения или пальмы как декоративный мотив; краткое «пальмы» сохраняет предмет орнамента.
- source_word: פְטֻרֵי צִצִּים
  choice: распустившиеся цветы
  rationale: Сочетание описывает раскрытые цветочные формы; этот вариант передаёт декоративный образ без искусственной буквальности.
- source_word: מְיֻשָּׁר עַל הַמְּחֻקֶּה
  choice: плотно пригнанным к резному узору
  rationale: Редкое выражение, вероятно, описывает золото как наложенное или подогнанное по поверхности резьбы. Формулировка передаёт соответствие золотого покрытия рельефу, не утверждая спорное значение «равномерно».
