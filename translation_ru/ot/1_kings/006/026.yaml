  text: קוֹמַת֙ הַ/כְּר֣וּב הָֽ/אֶחָ֔ד עֶ֖שֶׂר בָּֽ/אַמָּ֑ה וְ/כֵ֖ן הַ/כְּר֥וּב הַ/שֵּׁנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/026.yaml
  text: The height of the one cherub was ten cubits[a], and so it was with the second cherub.
translation:
  language: ru
  text: Высота одного херувима была десять локтей[a], и такой же была высота второго херувима.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Локоть — древняя мера длины, примерно равная расстоянию от локтя до кончиков пальцев.
    reason: cultural_note
lexical_decisions:
- source_word: קוֹמַת
  choice: Высота
  rationale: В контексте размеров храмовых изделий קוֹמָה естественно и точно означает высоту.
- source_word: הַכְּרוּב
  choice: херувима
  rationale: Единственное число כְּרוּב обозначает одну из двух фигур; «херувим» — традиционное и понятное русское соответствие.
- source_word: הָאֶחָד
  choice: одного
  rationale: Передаёт буквальное различение «одного» херувима и не вводит более истолковывающее «первого».
- source_word: עֶשֶׂר בָּאַמָּה
  choice: десять локтей
  rationale: После слова «высота» мера передаётся без избыточного добавления «в высоту».
- source_word: וְכֵן
  choice: и такой же была высота
  rationale: Ясно выражает равенство размеров двух фигур; повтор слова «высота» естественен по-русски и устраняет неясность местоименной конструкции.
- source_word: הַכְּרוּב הַשֵּׁנִי
  choice: второго херувима
  rationale: Сохраняет явное значение порядкового определения הַשֵּׁנִי — «второй».
