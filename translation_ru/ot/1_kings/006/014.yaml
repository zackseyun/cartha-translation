  text: So Solomon built the house and finished it[a].
translation:
  language: ru
  text: Так Соломон построил дом и завершил его.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «храм». Буквально в еврейском тексте — «дом»; в данном контексте так обычно называется храм.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: построил
  rationale: Форма Qal wayyiqtol от בנה передаёт последовательное завершённое действие в повествовании; «построил» естественно и точно звучит по-русски.
- source_word: שְׁלֹמֹה
  choice: Соломон
  rationale: Традиционная русская форма библейского имени שְׁלֹמֹה.
- source_word: הַבַּיִת
  choice: дом
  rationale: בַּיִת буквально означает «дом»; в данном контексте это храм. Сохранение слова «дом» передаёт формулировку оригинала и характерное для главы обозначение храма.
- source_word: וַיְכַלֵּהוּ
  choice: завершил его
  rationale: Piel от כלה с суффиксом 3-го лица мужского рода означает довести объект до завершения; «завершил его» точно передаёт значение и отсылает к слову «дом».
