    reason: lexical_alternative
lexical_decisions:
- source_word: דַלְתוֹת
  choice: двери
  rationale: Обычное значение множественного числа; далее каждая из двух дверей названа отдельно формой единственного числа.
- source_word: עֲצֵי בְרוֹשִׁים
  choice: из кипарисового дерева
  rationale: בְּרוֹשׁ обозначает кипарис или близкое хвойное дерево; «кипарис» хорошо соответствует вероятному значению в контексте храмового строительства.
- source_word: צְלָעִים / קְלָעִים
  choice: складные створки
  rationale: Редкие архитектурные термины стоят в параллельных частях описания и, вероятно, обозначают части каждой двери; «створки» естественно передаёт их функцию по-русски.
- source_word: גְּלִילִים
  choice: складные
  rationale: Слово связано с вращением или поворачиванием. В данном архитектурном контексте оно, вероятно, описывает подвижные секции составной двери; точный механизм остаётся неясным и отмечен в сноске.
- source_word: הַדֶּלֶת הָאַחַת / הַדֶּלֶת הַשֵּׁנִית
  choice: у одной двери / у второй двери
  rationale: Передаёт явное сопоставление двух дверей и звучит естественно в русском описании их устройства.
