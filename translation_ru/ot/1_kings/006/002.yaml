base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/002.yaml
  text: The house that King Solomon built for Yahweh was sixty cubits long[a], twenty cubits wide[c][b], and thirty cubits high.
translation:
  language: ru
  text: Дом[a], который царь Соломон построил для Яхве[b], имел шестьдесят локтей в длину, двадцать локтей в ширину и тридцать локтей в высоту.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть храм. Буквально: «И дом…»; начальный союз можно также передать словом «И».'
    reason: lexical_alternative
  - marker: b
    text: 'Яхве — передача еврейского имени יהוה; традиционно также: «ГОСПОДЬ».'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַבַּיִת
  choice: Дом
  rationale: Буквально בַּיִת означает «дом»; здесь по контексту речь идёт о храме. «Дом» сохраняет образное и богословское звучание еврейского текста. Начальный союз וְ не выражен отдельным словом, поскольку в русском продолжение повествования не требует обязательного «и».
- source_word: אֲשֶׁר בָּנָה
  choice: который … построил
  rationale: Относительное предложение передано прямо; перфект בָּנָה описывает завершённое строительство.
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: царь Соломон
  rationale: Естественный для современного русского порядок титула и имени.
- source_word: לַיהוָה
  choice: для Яхве
  rationale: 'Предлог ל обозначает назначение или посвящение: дом построен для Яхве.'
- source_word: שִׁשִּׁים אַמָּה אָרְכּוֹ
  choice: шестьдесят локтей в длину
  rationale: Передаёт число, древнюю меру длины и существительное «его длина» естественной русской конструкцией.
- source_word: וְעֶשְׂרִים רָחְבּוֹ
  choice: двадцать локтей в ширину
  rationale: В еврейском слове «локтей» во второй размерной фразе нет, но единица измерения однозначно подразумевается параллельным рядом и для ясности естественно повторяется по-русски.
- source_word: וּשְׁלֹשִׁים אַמָּה קוֹמָתוֹ
  choice: тридцать локтей в высоту
  rationale: קוֹמָה здесь обозначает высоту строения; русская размерная конструкция точно и естественно передаёт смысл.
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: ГОСПОДЬ
  rationale: В исходном тексте стоит личное имя Бога, тетраграмматон יהוה. Транслитерация «Яхве» сохраняет различие между именем и титулом, а примечание сообщает традиционный вариант передачи.
- issue: Передача בַּיִת в храмовом контексте
  choice: Дом
  alternative: храм
  rationale: «Храм» прямо проясняет референт, однако «Дом» точнее сохраняет лексику и смысловой образ оригинала; контекст главы указывает, что речь о храме.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Синтаксис сохранён близким к еврейскому, а размеры оформлены естественными русскими оборотами «в длину / в ширину / в высоту».
