base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/038.yaml
  text: And in the eleventh year[a], in the month of Bul (that is, the eighth month), the house was finished in all its parts and according to all its specifications[b]. So he built it in seven years.
translation:
  language: ru
  text: В одиннадцатый год, в месяце Вуле[a] — то есть в восьмом месяце, — храм был завершён во всех его деталях и в соответствии со всеми его предписаниями[b]. Соломон построил его за семь лет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вул — древнее название восьмого месяца израильского календаря.
    reason: cultural_note
  - marker: b
    text: 'Или: «во всех его деталях и по всему установленному для него плану».'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּשָּׁנָה הָאַחַת עֶשְׂרֵה
  choice: в одиннадцатый год
  rationale: Естественная русская передача древнееврейского порядкового обозначения года.
- source_word: בְּיֶרַח בּוּל
  choice: в месяце Вуле
  rationale: Редкое יֶרַח здесь означает «месяц»; имя месяца בּוּל передано транслитерацией и поставлено в нормативную русскую падежную форму.
- source_word: הוּא הַחֹדֶשׁ הַשְּׁמִינִי
  choice: то есть в восьмом месяце
  rationale: Сохраняет пояснительный характер древнееврейской аппозиции и понятно соотносит старое название с номером месяца.
- source_word: כָּלָה הַבַּיִת
  choice: храм был завершён
  rationale: Хотя הַבַּיִת буквально означает «дом», в данном контексте речь однозначно идёт о храме; «храм» обеспечивает ясность для современного читателя, а пассивная конструкция сохраняет синтаксический акцент оригинала.
- source_word: לְכָל דְּבָרָיו
  choice: во всех своих частях
  rationale: דְּבָרָיו в строительном контексте обозначает относящиеся к сооружению детали или составные части, а не произнесённые слова.
- source_word: וּלְכָל מִשְׁפָּטוֹ
  choice: согласно всем предписаниям
  rationale: מִשְׁפָּט здесь имеет смысл установленного порядка, проекта или строительных требований, а не судебного решения.
- source_word: וַיִּבְנֵהוּ שֶׁבַע שָׁנִים
  choice: Соломон строил его семь лет
  rationale: Передаёт продолжительность строительства. Имя «Соломон» восстанавливает из ближайшего контекста подразумеваемого субъекта и устраняет неясность русского местоимения.
