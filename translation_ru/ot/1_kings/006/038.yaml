revisions:
- from: В одиннадцатый год, в месяце Вуле[a] — то есть в восьмом месяце, — храм был завершён во всех своих частях и согласно всем предписаниям[b]. Соломон строил его семь лет.
  to: В одиннадцатый год, в месяце Вуле[a] — то есть в восьмом месяце, — храм был завершён во всех его деталях и в соответствии со всеми его предписаниями[b]. Соломон построил его за семь лет.
  rationale: Исправлено упущенное притяжательное значение в «его предписаниями» и уточнён заключительный глагол, чтобы русская фраза однозначно сообщала о завершённом строительстве, продолжавшемся семь лет. Пояснение названия месяца и альтернативная передача строительной терминологии сохранены.
