base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/007.yaml
  text: The house[a], when it was built, was built of finished stone quarried in advance; and no hammer or axe or any iron tool was heard in the house while it was being built.
translation:
  language: ru
  text: При строительстве дома использовали готовые камни из каменоломни[a]; ни молота, ни топора, никакого железного орудия не было слышно в доме во время его строительства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из камней, заранее обработанных в каменоломне». Значение редкого еврейского слова מַסָּע точно не установлено: оно может указывать либо на каменоломню и добычу камня, либо на то, что камни доставляли оттуда уже подготовленными.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: дом
  rationale: Буквально еврейское слово означает «дом»; в контексте речь идёт о храме. Перевод сохраняет исходную лексику и библейское обозначение храма как дома Господа.
- source_word: בְּהִבָּנֹתוֹ
  choice: при строительстве / во время его строительства
  rationale: Инфинитивная конструкция с ב выражает временное обстоятельство. Два естественных русских оборота передают один и тот же смысл при обоих употреблениях выражения в стихе.
- source_word: אֶבֶן שְׁלֵמָה
  choice: готовые камни
  rationale: В строительном контексте сочетание обозначает камни, полностью подготовленные до укладки. «Готовые камни» звучит естественно и не утверждает излишне конкретный способ обработки.
- source_word: מַסָּע
  choice: доставленные из каменоломни
  rationale: Редкое специальное слово, вероятно, связано с добычей камня или его доставкой из каменоломни. Выбранный вариант ясно указывает, что камни прибыли на место строительства уже готовыми; неопределённость отражена в сноске.
- source_word: נִבְנָה
  choice: возводили
  rationale: Нифаль глагола בנה описывает сооружение дома. Русское безлично-пассивное «возводили» естественно передаёт способ строительства.
- source_word: מַקָּבוֹת
  choice: молота
  rationale: Хотя еврейская форма морфологически множественная, здесь перечисляются виды орудий; русский родительный единственного числа после повторяющегося «ни» естественно передаёт обобщённое значение.
- source_word: הַגַּרְזֶן
  choice: топора
  rationale: Основное значение — «топор»; более узкое «тесло» возможно, но недостаточно определённо.
- source_word: כָּל כְּלִי בַרְזֶל
  choice: ни какого-либо железного орудия
  rationale: Сочетание כָּל с существительным в единственном числе имеет распределительно-всеохватное значение. Формулировка сохраняет полноту отрицания.
- source_word: לֹא נִשְׁמַע
  choice: не было слышно
  rationale: Нифаль от שמע означает «быть слышимым». Безличная русская конструкция точно и естественно передаёт отрицательную пассивную форму.
