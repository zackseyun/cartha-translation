source:
  edition: WLC
  text: וְ/שָׁ֣כַנְתִּ֔י בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֥א אֶעֱזֹ֖ב אֶת עַמִּ֥/י יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/013.yaml
  text: And I will dwell among the children of Israel[a], and I will not forsake my people Israel.
translation:
  language: ru
  text: И Я буду обитать среди сынов Израиля[a] и не оставлю Мой народ Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «израильтян». Буквально: «сынов Израиля».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: И Я буду обитать
  rationale: Глагол שׁכן обозначает пребывание или поселение; в контексте Божьего присутствия «обитать» сохраняет богословскую значимость и звучит естественно в современном литературном русском.
- source_word: בְּתוֹךְ
  choice: среди
  rationale: Перед названием сообщества בְּתוֹךְ естественно передаётся словом «среди», выражающим присутствие внутри народа без пространственного уточнения.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: сынов Израиля
  rationale: Это близкая к еврейскому выражению традиционная формула, обозначающая народ Израиля в целом; сноска даёт более идиоматичную альтернативу.
- source_word: וְלֹא אֶעֱזֹב
  choice: и не оставлю
  rationale: В данном контексте עזב выражает отказ покинуть или бросить Свой народ. «Не оставлю» сохраняет заветно-реляционный смысл и естественно звучит по-русски.
- source_word: עַמִּי
  choice: Мой народ
  rationale: Прямая передача притяжательной заветной формулы; прописная буква указывает на говорящего Бога согласно русской библейской издательской традиции.
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Общепринятая русская форма собственного имени.
theological_decisions:
- issue: Язык Божьего обитания в контексте храма
  choice: «буду обитать среди»
  alternative: «буду жить посреди»; «буду пребывать среди»
  rationale: Формулировка выражает Божье заветное присутствие с Израилем, но не сводит его к локализации Бога в храме и не вносит позднейших догматических уточнений.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Сохранён традиционный этноним-заветная формула «сыны Израиля», а идиоматичный вариант вынесен в сноску. Местоимения, относящиеся к Богу, оформлены с прописной буквы по распространённой русской библейской традиции.
