source:
  edition: WLC
  text: הַ/בַּ֨יִת הַ/זֶּ֜ה אֲשֶׁר אַתָּ֣ה בֹנֶ֗ה אִם תֵּלֵ֤ךְ בְּ/חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֣/י תַּֽעֲשֶׂ֔ה וְ/שָׁמַרְתָּ֥ אֶת כָּל מִצְוֺתַ֖/י לָ/לֶ֣כֶת בָּ/הֶ֑ם וַ/הֲקִמֹתִ֤י אֶת דְּבָרִ/י֙ אִתָּ֔/ךְ אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל דָּוִ֥ד אָבִֽי/ךָ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/006/012.yaml
  text: As for this house that you are building[a], if you walk in my statutes, carry out my judgments, and keep all my commandments by walking in them, then I will establish my word with you, which I spoke to David your father.
translation:
  language: ru
  text: 'Что касается этого дома, который ты строишь: если ты будешь жить по Моим установлениям, исполнять Мои постановления и соблюдать все Мои заповеди, поступая по ним, то Я исполню в отношении тебя Моё слово[a], которое изрёк Давиду, твоему отцу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «утвержу Моё слово с тобой». Еврейское выражение означает подтверждение или исполнение ранее сказанного слова; возможно также: «исполню Моё обещание в отношении тебя».'
    reason: Поясняет идиоматическое выражение הֲקִים דָּבָר и сохраняет различие между Соломоном, к которому относится исполнение слова, и Давидом, которому это слово было сказано.
lexical_decisions:
- source_word: הַבַּיִת הַזֶּה
  choice: этого дома
  rationale: Сохраняется буквальное «дом»; из контекста ясно, что речь идёт о храме.
- source_word: אֲשֶׁר אַתָּה בֹנֶה
  choice: который ты строишь
  rationale: Причастие передаёт продолжающееся в данный момент строительство.
- source_word: אִם תֵּלֵךְ בְּחֻקֹּתַי
  choice: если ты будешь жить по Моим установлениям
  rationale: Идиома «ходить в» обозначает образ жизни; естественное русское выражение передаёт её поведенческий смысл.
- source_word: מִשְׁפָּטַי תַּעֲשֶׂה
  choice: исполнять Мои постановления
  rationale: מִשְׁפָּטִים здесь имеет нормативно-правовой смысл, а «исполнять» естественно сочетается с «постановления».
- source_word: וְשָׁמַרְתָּ אֶת כָּל מִצְוֺתַי
  choice: и соблюдать все Мои заповеди
  rationale: שׁמר с заповедями означает хранить, соблюдать или исполнять; «соблюдать» наиболее естественно в современном русском.
- source_word: לָלֶכֶת בָּהֶם
  choice: поступая по ним
  rationale: Передаёт практическое следование заповедям и избегает неестественного буквального «ходить в них».
- source_word: וַהֲקִמֹתִי אֶת דְּבָרִי אִתָּךְ
  choice: то Я утвержу для тебя Моё слово
  rationale: Сохраняется образ утверждения ранее сказанного; «для тебя» естественно передаёт направленность обещания к Соломону, хотя буквально אִתָּךְ — «с тобой».
- source_word: דְּבָרִי
  choice: Моё слово
  rationale: «Слово» сохраняет лексическую связь с последующим «которое изрёк» и не снимает возможный смысл обещания.
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל דָּוִד אָבִיךָ
  choice: которое изрёк Давиду, твоему отцу
  rationale: Глагол передан как речевой, а не сразу истолкован как «обещал»; «изрёк» соответствует достоинству божественной речи.
theological_decisions:
- issue: Условная связь между послушанием Соломона и словом, данным Давиду
  choice: 'Сохранена явная конструкция «если… то»: утверждение Божьего слова применительно к Соломону связано с его заветным послушанием.'
  alternative: Истолковать обещание либо как совершенно безусловное, либо как полностью отменяемое условием.
  rationale: Еврейский синтаксис прямо выражает условие, но сам стих не разрешает более широкий вопрос о сочетании условных и безусловных сторон обетования Давиду.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Заглавные буквы в местоимениях, относящихся к Богу, применены последовательно. Устаревшие обороты сведены к минимуму; «изрёк» сохранено как понятное возвышенное обозначение Божьей речи.
