  text: In front of the inner sanctuary was twenty cubits in length[a], twenty cubits in width, and twenty cubits in its height. He overlaid it with pure gold[b], and he overlaid the cedar altar.
translation:
  language: ru
  text: Внутреннее святилище[a] было двадцать локтей в длину, двадцать локтей в ширину и двадцать локтей в высоту. Он покрыл его чистым золотом[b] и покрыл золотом кедровый жертвенник[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейская конструкция буквально может быть понята как «перед внутренним святилищем»; она синтаксически сжата, и её точное соотношение с последующими размерами не вполне ясно.
    reason: textual_ambiguity
  - marker: b
    text: 'Или: «отборным золотом». Еврейское выражение обозначает высококачественное очищенное золото.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «покрыл кедровый жертвенник». Указание на золото подразумевается из предшествующей части предложения.'
    reason: contextual_clarification
lexical_decisions:
- source_word: וְלִפְנֵי הַדְּבִיר
  choice: Внутреннее святилище
  rationale: דְּבִיר обозначает внутреннее храмовое святилище. Начальная конструкция с לִפְנֵי синтаксически сжата и допускает более буквальное понимание «перед внутренним святилищем», однако далее названы кубические размеры самого внутреннего помещения; основной текст передаёт наиболее естественный в контексте смысл, а формальная неоднозначность отмечена в сноске.
- source_word: עֶשְׂרִים אַמָּה ... אֹרֶךְ / רֹחַב / קוֹמָתוֹ
  choice: двадцать локтей в длину, двадцать локтей в ширину и двадцать локтей в высоту
  rationale: Сохранена древняя мера длины и параллельное построение еврейской формулы размеров.
- source_word: וַיְצַפֵּהוּ
  choice: Он обложил его
  rationale: В данном храмовом контексте צפה означает покрытие поверхности другим материалом; местоименное дополнение относится к внутреннему святилищу.
- source_word: זָהָב סָגוּר
  choice: чистым золотом
  rationale: Устойчивое сочетание обозначает высококачественное, очищенное золото; «чистое золото» естественно и точно передаёт смысл.
- source_word: וַיְצַף מִזְבֵּחַ אָרֶז
  choice: обшил жертвенник кедром
  rationale: 'Безпредложная последовательность допускает понимание אָרֶז как материала покрытия: жертвенник был обшит кедровым деревом. Возможное понимание как «кедровый жертвенник» сохранено в сноске.'
