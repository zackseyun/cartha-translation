  text: In the inner sanctuary he made two cherubim of olivewood[b][a], each ten cubits high.
translation:
  language: ru
  text: Во внутреннем святилище он сделал двух херувимов из масличного дерева, каждый высотой в десять локтей.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его высота — десять локтей»; единственное число здесь, по-видимому, относится к каждому из двух херувимов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדְּבִיר
  choice: во внутреннем святилище
  rationale: דְּבִיר обозначает внутреннее, самое сокровенное помещение храма; этот вариант ясен современному читателю и не вводит более позднее техническое наименование непосредственно в текст.
- source_word: כְרוּבִים
  choice: херувимов
  rationale: Традиционный русский библейский термин точно сохраняет название особых небесных существ, а не вызывает ассоциацию с поздним художественным образом «херувимчиков».
- source_word: עֲצֵי שָׁמֶן
  choice: из масличного дерева
  rationale: Буквально выражение указывает на древесину масличного дерева; такой вариант естественен и точен по-русски.
- source_word: עֶשֶׂר אַמּוֹת
  choice: десять локтей
  rationale: «Локоть» — устоявшееся русское соответствие древней мере אַמָּה.
- source_word: קוֹמָתוֹ
  choice: высотой по десять локтей каждый
  rationale: В еврейском тексте буквально стоит единственное число «его высота», которое в контексте двух херувимов естественно понимается распределительно; перевод передаёт это значение ясным современным русским языком.
- source_word: וַיַּעַשׂ
  choice: он сделал
  rationale: Прямое и стилистически нейтральное соответствие обычному глаголу עשה.
theological_decisions:
- issue: Наименование דְּבִיר
  choice: внутреннее святилище
  alternative: Святое святых
  rationale: Выбран описательный пространственный термин, который сохраняет значение внутреннего помещения храма и не усиливает текст более поздним устойчивым богословско-литургическим названием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан естественным, при этом распределительное понимание единственного числа отмечено сноской.
