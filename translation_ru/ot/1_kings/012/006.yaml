base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/006.yaml
  text: Then King Rehoboam consulted the elders who had stood before Solomon his father while he was still alive[a], saying[b], “How do you advise me to answer this people?”
translation:
  language: ru
  text: 'Царь Ровоам посоветовался со старейшинами, которые служили при его отце Соломоне[a], пока тот был жив. Он спросил: «Как вы советуете ответить этому народу?»[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стояли перед лицом Соломона»; это выражение может означать служение при царе или пребывание среди его придворных.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «ответить этому народу слово», то есть дать ему ответ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: посоветовался
  rationale: Форма нифаль глагола יעץ здесь означает обращение к другим за советом; «посоветовался» естественно передаёт это значение.
- source_word: הַמֶּלֶךְ רְחַבְעָם
  choice: царь Ровоам
  rationale: Таков естественный порядок титула и имени в современном русском языке.
- source_word: הַזְּקֵנִים
  choice: старейшины
  rationale: В придворном контексте речь идёт об уважаемых старших советниках, а не просто о пожилых мужчинах.
- source_word: אֲשֶׁר הָיוּ עֹמְדִים אֶת־פְּנֵי שְׁלֹמֹה
  choice: которые служили при Соломоне
  rationale: Еврейская идиома «стоять перед лицом» обозначает службу или постоянное присутствие при царском дворе. Перевод передаёт её смысл, а буквальный образ отмечен в сноске.
- source_word: אָבִיו
  choice: его отце
  rationale: Притяжательное местоимение относится к Ровоаму; включение «отце» в оборот «при его отце Соломоне» ясно передаёт родство.
- source_word: בִּהְיֹתוֹ חַי
  choice: пока тот был жив
  rationale: Оборот естественно выражает временное значение и ясно относит местоимение к Соломону.
- source_word: אֵיךְ אַתֶּם נוֹעָצִים
  choice: как вы советуете
  rationale: Сохраняется вопросительное «как» и значение причастной формы — просьба высказать совет.
- source_word: לְהָשִׁיב
  choice: ответить
  rationale: В породе хифиль глагол שוב в этом контексте означает дать ответ.
- source_word: הָעָם הַזֶּה
  choice: этому народу
  rationale: Сохраняются собирательное единственное число и указательное значение еврейского выражения.
- source_word: דָּבָר
  choice: передано конструкцией «ответить»
  rationale: Буквальное «слово» входит в еврейскую идиому со значением «дать ответ»; отдельное воспроизведение сделало бы русскую фразу неестественной. Буквальная форма указана в сноске.
