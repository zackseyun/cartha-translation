base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/028.yaml
  text: So the king took counsel and made two calves of gold[a], and he said to them, “It is too much for you to go up to Jerusalem. Behold your gods, O Israel[b], who brought you up from the land of Egypt.”
translation:
  language: ru
  text: 'Царь посоветовался и сделал двух золотых тельцов, а затем сказал народу: «Слишком тяжело вам подниматься в Иерусалим. Вот твои боги, Израиль[a], которые вывели тебя из земли Египта».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вот твой Бог, Израиль». Еврейская форма иногда обозначает единого Бога; эта формулировка перекликается с Исх. 32:4. Однако здесь два тельца и глагол во множественном числе благоприятствуют переводу «твои боги».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: посоветовался
  rationale: Форма нифаль от יעץ указывает на совещание или обдумывание; «посоветовался» естественно и близко передаёт смысл.
- source_word: שְׁנֵי עֶגְלֵי זָהָב
  choice: двух золотых тельцов
  rationale: В современном русском это естественная передача сочетания «два тельца из золота», сохраняющая связь с Исходом 32.
- source_word: רַב לָכֶם מֵעֲלוֹת יְרוּשָׁלִַם
  choice: Слишком тяжело вам ходить в Иерусалим
  rationale: Передаёт вероятный смысл тягостности дальнейших восхождений в Иерусалим; глагол «ходить» естественно выражает повторяющееся паломничество.
- source_word: הִנֵּה
  choice: Вот
  rationale: Сохраняет указательную и риторическую силу слова без архаичного для современной русской речи «се».
- source_word: אֱלֹהֶיךָ יִשְׂרָאֵל
  choice: твои боги, Израиль
  rationale: Два тельца и глагол во множественном числе поддерживают множественное число, хотя форма אֱלֹהִים допускает единственное значение.
- source_word: הֶעֱלוּךָ
  choice: которые вывели тебя
  rationale: Множественное «которые вывели» точно отражает форму глагола и согласуется с выбранным «боги».
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: из земли Египетской
  rationale: Сохраняет традиционную и узнаваемую формулу исхода, оставаясь понятной современному читателю.
theological_decisions:
- issue: Единственное или множественное значение אֱלֹהֶיךָ в воззвании Иеровоама
  choice: 'множественное: «твои боги, Израиль»'
  alternative: 'единственное: «твой Бог, Израиль»'
  rationale: Хотя אֱלֹהִים может обозначать единого Бога, непосредственное упоминание двух тельцов и множественное הֶעֱלוּ благоприятствуют переводу во множественном числе. Альтернатива сохранена в сноске, чтобы не скрывать грамматико-богословскую напряжённость и отсылку к Исходу 32:4.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический повтор «и… и…» сохраняет повествовательный ритм древнееврейского текста; «вот» предпочтено архаичному «се».
