  text: Но над израильтянами, жившими в городах Иуды, царствовал Ровоам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: израильтянами
  rationale: Буквально «сынами Израиля», но здесь выражение имеет обычное национальное значение. «Израильтянами» естественно передаёт его по-русски и сохраняет связь с народом Израиля.
- source_word: הַיֹּשְׁבִים
  choice: жившими
  rationale: Причастие от ישב здесь обозначает постоянное проживание. «Жившими» — естественный современный эквивалент.
- source_word: בְּעָרֵי יְהוּדָה
  choice: в городах Иуды
  rationale: Формулировка прямо передаёт местное значение и не уточняет сверх текста, идёт ли речь о территории или политической области.
- source_word: וַיִּמְלֹךְ
  choice: царствовал
  rationale: Глагол מלך в данном повествовательном контексте обозначает осуществление царской власти; «царствовал» точно и кратко передаёт это значение.
- source_word: עֲלֵיהֶם
  choice: над
  rationale: Предлог выражает власть над названной группой; его объект в русском предложении непосредственно обозначен словом «израильтянами».
- source_word: רְחַבְעָם
  choice: Ровоам
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: וּ
  choice: Но
  rationale: В контексте союз противопоставляет этих израильтян северным племенам, отпавшим от Ровоама; «но» естественно выражает этот контраст.
