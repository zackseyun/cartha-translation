  text: И царь сурово ответил народу и отверг совет старейшин, которые советовали ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: ответил
  rationale: Глагол ענה в породе qal здесь означает «ответить»; перевод сохраняет связь с предшествующей просьбой народа и естественно звучит по-русски.
- source_word: הַמֶּלֶךְ
  choice: царь
  rationale: Определённое существительное указывает на уже известного из контекста царя; в русском повествовании определённость передаётся контекстом.
- source_word: הָעָם
  choice: народу
  rationale: עָם обозначает собравшийся народ Израиля; дательный падеж обусловлен естественным русским управлением глагола «ответить».
- source_word: קָשָׁה
  choice: сурово
  rationale: Кָשָׁה употреблено обстоятельственно и характеризует ответ царя как жёсткий; «сурово» точно и естественно передаёт это значение.
- source_word: וַיַּעֲזֹב
  choice: отвергнув
  rationale: עזב означает оставить или отказаться от чего-либо. В данном контексте «отвергнуть совет» ясно выражает сознательное решение не последовать ему; деепричастие естественно связывает два тесно сопряжённых действия.
- source_word: עֲצַת
  choice: совет
  rationale: עֵצָה здесь означает данную царю рекомендацию; «совет» — прозрачный и стилистически уместный русский эквивалент.
- source_word: הַזְּקֵנִים
  choice: старейшин
  rationale: זְקֵנִים обозначает признанных старших советников, а не только пожилых мужчин; «старейшины» передаёт их общественную и политическую роль.
- source_word: אֲשֶׁר יְעָצֻהוּ
  choice: который они ему дали
  rationale: Относительное предложение указывает на совет, данный старейшинами царю ранее. Русская формулировка устраняет тяжеловесный повтор «совет... советовали», не добавляя нового смысла.
