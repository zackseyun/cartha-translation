  text: וְ/לֹֽא שָׁמַ֥ע הַ/מֶּ֖לֶךְ אֶל הָ/עָ֑ם כִּֽי הָיְתָ֤ה סִבָּה֙ מֵ/עִ֣ם יְהוָ֔ה לְמַ֜עַן הָקִ֣ים אֶת דְּבָר֗/וֹ אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ בְּ/יַד֙ אֲחִיָּ֣ה הַ/שִּׁילֹנִ֔י אֶל יָרָבְעָ֖ם בֶּן נְבָֽט־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/015.yaml
  text: So the king did not listen to the people[a], for it was a turn of events from Yahweh[b], in order to establish his word that Yahweh had spoken by the hand of Ahijah the Shilonite to Jeroboam son of Nebat.
translation:
  language: ru
  text: И царь не послушал народа, ибо так сложились обстоятельства — от Яхве, — чтобы Яхве исполнил Своё слово, которое Он сказал через Ахию из Силома Иеровоаму, сыну Навата.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ибо причина была от Яхве». Еврейское слово סִבָּה может означать «причина», «обстоятельство» или «поворот событий». Буквально: «которое Яхве сказал рукой Ахии из Силома»; «рукой» — древнееврейский оборот со значением «через».'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע אֶל
  choice: послушал
  rationale: В сочетании с אֶל глагол означает не просто услышать, а внять обращению или просьбе; «послушал» естественно передаёт этот смысл.
- source_word: הָעָם
  choice: народа
  rationale: Обычное и контекстуально точное обозначение собравшегося народа Израиля.
- source_word: סִבָּה
  choice: поворот событий
  rationale: Редкое существительное допускает значения «причина», «обстоятельство» и «поворот дела»; в повествовательном контексте выражение обозначает сложившийся ход событий, не устраняя лексической неоднозначности.
- source_word: מֵעִם יְהוָה
  choice: от Яхве
  rationale: Предлог указывает на источник; личное имя יְהוָה передано как «Яхве».
- source_word: לְמַעַן הָקִים אֶת דְּבָרוֹ
  choice: чтобы Он исполнил слово
  rationale: לְמַעַן выражает цель, а הֵקִים применительно к ранее сказанному слову означает осуществить, исполнить или подтвердить его. «Исполнил» звучит естественно по-русски и сохраняет связь с исполнением пророчества.
- source_word: בְּיַד
  choice: через
  rationale: Буквально «рукой»; это устойчивый древнееврейский оборот, обозначающий посредничество или передачу через кого-либо.
- source_word: הַשִּׁילֹנִי
  choice: из Силома
  rationale: Гентилий обозначает принадлежность Ахии к Силому; аналитическая русская форма понятнее, чем редкое «силомлянин».
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоаму, сыну Навата
  rationale: Использованы устоявшиеся в русской библейской традиции формы имён и ясно передан патроним.
theological_decisions:
- issue: Божественное действие и человеческая ответственность
  choice: Отказ царя прямо связан с поворотом событий, который был «от Яхве», и с целью исполнить прежде сказанное слово.
  alternative: Истолковать событие лишь как допущенное Богом либо прямо назвать Бога непосредственной причиной решения царя.
  rationale: Текст утверждает происхождение сложившегося события от Яхве и указывает его цель, но не объясняет механизм соотношения Божьего действия и решения царя. Перевод сохраняет это напряжение.
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Передано собственное заветное имя, непосредственно стоящее в древнееврейском тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; древнееврейский оборот בְּיַד передан идиоматически, а его буквальная форма вынесена в сноску. Маркеры обеих сносок присутствуют в основном тексте.
