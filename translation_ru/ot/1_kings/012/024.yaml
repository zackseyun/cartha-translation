base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/024.yaml
  text: 'Thus says Yahweh: ‘Do not go up or fight against your brothers[a], the sons of Israel. Return, each man to his house[c][b], for this thing is from me.’ So they listened to the word of Yahweh and turned back to go according to the word of Yahweh.'
translation:
  language: ru
  text: 'Так говорит Яхве: «Не выступайте в поход и не сражайтесь со своими братьями — сынами Израиля[a]. Возвратитесь, каждый в свой дом, потому что это произошло от Меня[b]». Они послушались слова Яхве и вернулись, как повелел Яхве[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не сражайтесь против своих братьев-израильтян». Буквально: «с вашими братьями, сынами Израиля».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «потому что это дело — от Меня».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и возвратились, чтобы идти, согласно слову Яхве».'
    reason: translation_note
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Так говорит Яхве
  rationale: Сохранена узнаваемая формула пророческой речи и передано личное имя יְהוָה.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּן
  choice: Не ходите на войну и не сражайтесь
  rationale: В военном контексте עלה обозначает выступление в поход; перевод передаёт смысл естественнее, чем буквальное «не поднимайтесь», а повтор отрицания сохранён общей русской конструкцией.
- source_word: עִם אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: со своими братьями — сынами Израиля
  rationale: После глагола «сражаться» русский предлог «с» естественно обозначает противника; «братьями» сохраняет значимую лексику родства, а «сынами Израиля» — приложение оригинала.
- source_word: שׁוּבוּ אִישׁ לְבֵיתוֹ
  choice: Пусть каждый возвратится в свой дом
  rationale: Дистрибутивное אִישׁ передано естественным русским «каждый»; возвратный императив выражен побудительной конструкцией.
- source_word: כִּי מֵאִתִּי נִהְיָה הַדָּבָר הַזֶּה
  choice: потому что это произошло от Меня
  rationale: Передано как происхождение произошедшего от Бога без дополнительного уточнения характера причинности.
- source_word: וַיִּשְׁמְעוּ אֶת דְּבַר יְהוָה
  choice: Они послушались слова Яхве
  rationale: שׁמע здесь включает повиновение, что подтверждается последующим возвращением; «послушались» естественно выражает это значение.
- source_word: וַיָּשֻׁבוּ לָלֶכֶת כִּדְבַר יְהוָה
  choice: и пошли обратно, как повелел Яхве
  rationale: Слегка избыточное еврейское сочетание возвращения и движения передано естественным «пошли обратно»; דְּבַר в данном контексте обозначает данное повеление.
theological_decisions:
- issue: Передача имени יְהוָה
  choice: Яхве
  alternative: Господь
  rationale: Тетраграмматон передан как личное имя, а не заменён титулом.
- issue: Степень причинности в מֵאִתִּי נִהְיָה
  choice: это произошло от Меня
  alternative: это дело — от Меня
  rationale: Выбранный вариант утверждает божественное происхождение события, не развивая далее вопрос о непосредственной причинности.
- issue: Родственная лексика אֲחֵיכֶם
  choice: своими братьями
  alternative: с израильтянами
  rationale: Сохранён акцент на том, что междоусобная война была бы войной против братьев.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Лексика родства и имя Яхве сохранены; тяжеловесные буквальные обороты заменены естественными русскими соответствиями, а существенные формальные варианты вынесены в сноски.
