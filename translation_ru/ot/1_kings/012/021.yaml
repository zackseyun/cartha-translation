source:
  edition: WLC
  text: ו/יבאו רְחַבְעָם֮ יְרוּשָׁלִַם֒ וַ/יַּקְהֵל֩ אֶת כָּל בֵּ֨ית יְהוּדָ֜ה וְ/אֶת שֵׁ֣בֶט בִּנְיָמִ֗ן מֵאָ֨ה וּ/שְׁמֹנִ֥ים אֶ֛לֶף בָּח֖וּר עֹשֵׂ֣ה מִלְחָמָ֑ה לְ/הִלָּחֵם֙ עִם בֵּ֣ית יִשְׂרָאֵ֔ל לְ/הָשִׁיב֙ אֶת הַ/מְּלוּכָ֔ה לִ/רְחַבְעָ֖ם בֶּן שְׁלֹמֹֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/021.yaml
  text: When Rehoboam came to Jerusalem[a], he assembled all the house of Judah and the tribe of Benjamin, one hundred eighty thousand chosen warriors, to fight against the house of Israel, to restore the kingdom to Rehoboam son of Solomon.
translation:
  language: ru
  text: Когда Ровоам пришёл в Иерусалим, он собрал весь дом Иуды и колено Вениамина — сто восемьдесят тысяч отборных воинов, — чтобы сразиться с домом Израиля и вернуть царство Ровоаму, сыну Соломона.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ / ויבאו
  choice: пришёл
  rationale: Хотя согласный текст формально допускает множественное число, Ровоам — единственное подлежащее, а следующий глагол стоит в единственном числе; по контексту передан единственный субъект.
- source_word: וַיַּקְהֵל
  choice: собрал
  rationale: Порода хифиль выражает побуждение к собиранию; «собрал» естественно и точно передаёт действие царя.
- source_word: כָּל בֵּית יְהוּדָה
  choice: весь дом Иуды
  rationale: Сохранён политико-коллективный образ «дом», параллельный выражению «дом Израиля» далее в стихе.
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: колено Вениамина
  rationale: Слово שֵׁבֶט выражено явно; «колено» — устоявшееся и понятное обозначение племенной общности Израиля.
- source_word: מֵאָה וּשְׁמֹנִים אֶלֶף
  choice: сто восемьдесят тысяч
  rationale: Прямая передача числительного современным русским языком.
- source_word: בָּחוּר עֹשֵׂה מִלְחָמָה
  choice: отборных воинов
  rationale: В военном контексте בָּחוּר указывает на отборных, пригодных к сражению людей, а עֹשֵׂה מִלְחָמָה — на ведущих войну; сочетание передано естественно и сжато.
- source_word: לְהִלָּחֵם עִם
  choice: чтобы сразиться с
  rationale: Инфинитив цели и враждебный контекст переданы ясной современной конструкцией.
- source_word: בֵּית יִשְׂרָאֵל
  choice: дом Израиля
  rationale: Сохранён коллективно-политический термин, образующий смысловую параллель с «домом Иуды».
- source_word: לְהָשִׁיב אֶת הַמְּלוּכָה
  choice: вернуть царство
  rationale: Хифиль שׁוב означает возвращение или восстановление; здесь речь о возвращении отделившегося царства под власть Ровоама.
- source_word: לִרְחַבְעָם בֶּן שְׁלֹמֹה
  choice: Ровоаму, сыну Соломона
  rationale: Предлог ל обозначает получателя или того, в чью пользу должно быть возвращено царство.
theological_decisions:
- issue: Значение הַמְּלוּכָה в контексте раскола
  choice: царство
  alternative: царская власть, царствование
  rationale: Контекст допускает оттенок царской власти, однако военная цель состоит в возвращении отделившегося царства Ровоаму; «царство» сохраняет политико-территориальный смысл, не исключая смысла владычества.
translation_notes:
  register: Современный литературный русский язык с умеренно традиционной библейской терминологией («дом Иуды», «колено Вениамина»). Синтаксис сделан ясным, но политические коллективные обозначения оригинала сохранены.
