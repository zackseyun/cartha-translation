lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Он сказал им
  rationale: Стандартная передача повествовательной формы אמר с прямым указанием адресатов; начальный союз в современном русском повествовании можно не выражать.
- source_word: לְכוּ
  choice: Уйдите
  rationale: Повелительная форма множественного числа означает уход от говорящего; «уйдите» естественно передаёт временное удаление делегации.
- source_word: עוֹד שְׁלֹשָׁה יָמִים
  choice: ещё на три дня
  rationale: עוֹד с обозначением времени указывает на дополнительный срок; эта формулировка естественна в современном русском языке.
- source_word: וְשׁוּבוּ אֵלַי
  choice: а потом возвратитесь ко мне
  rationale: שוב передаёт возвращение к говорящему, а «потом» ясно выражает последовательность двух повелений.
- source_word: וַיֵּלְכוּ הָעָם
  choice: И народ ушёл
  rationale: Повествовательное заключение сообщает об исполнении приказа; собирательное הָעָם естественно передаётся русским единственным числом.
