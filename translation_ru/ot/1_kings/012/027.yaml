revisions:
- from: Если этот народ пойдёт в Иерусалим приносить жертвы в доме Яхве[a], то сердце этого народа вновь обратится к их господину[b], Ровоаму, царю Иудеи, и они убьют меня и вернутся к Ровоаму, царю Иудеи».
  to: Если этот народ пойдёт в Иерусалим приносить жертвы в доме Яхве[a], то сердце этого народа вернётся к их господину — к Ровоаму, царю Иудеи, — и они убьют меня и вернутся к Ровоаму, царю Иудеи».
  rationale: Заменено «вновь обратится» на «вернётся», чтобы сохранить повтор еврейского שׁוּב и яснее выразить возвращение верности Ровоаму. Приложение «к Ровоаму, царю Иудеи» выделено тире для естественного русского синтаксиса. Сноска b сохранена как лексически полезная, хотя её якорь в основном тексте не требуется для смысловой ясности; для корректной привязки она поставлена после «господину».
