  text: אִֽם יַעֲלֶ֣ה הָ/עָ֣ם הַ/זֶּ֗ה לַ/עֲשׂ֨וֹת זְבָחִ֤ים בְּ/בֵית יְהוָה֙ בִּ/יר֣וּשָׁלִַ֔ם וְ֠/שָׁב לֵ֣ב הָ/עָ֤ם הַ/זֶּה֙ אֶל אֲדֹ֣נֵי/הֶ֔ם אֶל רְחַבְעָ֖ם מֶ֣לֶךְ יְהוּדָ֑ה וַ/הֲרָגֻ֕/נִי וְ/שָׁ֖בוּ אֶל רְחַבְעָ֥ם מֶֽלֶךְ יְהוּדָֽה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/027.yaml
  text: If this people goes up to offer sacrifices in the house of Yahweh in Jerusalem[a], then the heart of this people will return to their lord, to Rehoboam king of Judah[c][b], and they will kill me and return to Rehoboam king of Judah.
translation:
  language: ru
  text: Если этот народ пойдёт в Иерусалим приносить жертвы в доме Яхве[a], то сердце этого народа вернётся к их господину — к Ровоаму, царю Иудеи, — и они убьют меня и вернутся к Ровоаму, царю Иудеи».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом Яхве» — храм в Иерусалиме.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Если
  rationale: Передаёт условие, которого опасается Иеровоам; временное «когда» возможно, но в данном контексте менее точно.
- source_word: יַעֲלֶה
  choice: пойдёт в Иерусалим
  rationale: Глагол буквально означает «поднимется» и употребляется о паломничестве в Иерусалим; естественное русское «пойдёт» сохраняет смысл, а направление названо далее.
- source_word: לַעֲשׂוֹת זְבָחִים
  choice: приносить жертвы
  rationale: Так естественно передаётся еврейское выражение «совершать/делать жертвы» в культовом контексте.
- source_word: בְּבֵית יְהוָה
  choice: в доме Яхве
  rationale: Сохраняет образное наименование святилища и прямое употребление Божьего имени.
- source_word: וְשָׁב לֵב הָעָם הַזֶּה
  choice: то сердце этого народа вновь обратится
  rationale: Сохраняет упоминание сердца как средоточия внутренней верности и передаёт שׁוב как возвращение прежней преданности.
- source_word: אֶל אֲדֹנֵיהֶם
  choice: к их господину
  rationale: Форма указывает на того, кому народ подчинён; последующее приложение однозначно называет Ровоама.
- source_word: וַהֲרָגֻנִי
  choice: и они убьют меня
  rationale: Прямой и современный эквивалент глагола הרג.
- source_word: וְשָׁבוּ
  choice: и вернутся
  rationale: Сохраняет повтор корня שׁוב, ранее переданного выражением «вновь обратится».
theological_decisions:
- issue: Передача имени יהוה
  choice: Яхве
  alternative: Господь; Иегова
  rationale: Еврейский текст содержит личное имя Бога; «Яхве» прямо передаёт тетраграмматон, не заменяя его титулом.
- issue: Значение обращения сердца народа
  choice: возвращение верности Ровоаму
  alternative: лишь эмоциональная перемена
  rationale: Контекст связывает обращение сердца с признанием прежнего царя и политическим возвращением, но перевод сохраняет метафору сердца и не сводит её к одному объяснению.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис слегка упрощён ради ясности, при этом сохранены метафора сердца, повтор идеи возвращения и условный характер опасения Иеровоама.
