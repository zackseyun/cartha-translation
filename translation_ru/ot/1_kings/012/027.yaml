  source_fidelity: 'Смысл в целом передан точно: условное опасение, паломничество в Иерусалим для жертвоприношений, переход сердца народа к Ровоаму, угроза Иеровоаму и политическое возвращение народа сохранены. Однако «вновь обратится» несколько ослабляет явный повтор корня שׁוּב между «сердце ... вернётся» и последующим «вернутся».'
