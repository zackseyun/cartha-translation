  text: ו/יבו יָרָבְעָ֧ם וְ/כָל הָ/עָ֛ם אֶל רְחַבְעָ֖ם בַּ/יּ֣וֹם הַ/שְּׁלִישִׁ֑י כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר הַ/מֶּ֨לֶךְ֙ לֵ/אמֹ֔ר שׁ֥וּבוּ אֵלַ֖/י בַּ/יּ֥וֹם הַ/שְּׁלִישִֽׁי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/012.yaml
  text: So Jeroboam and all the people came to Rehoboam on the third day[a], just as the king had spoken, saying, “Return to me on the third day.”
translation:
  language: ru
  text: 'Иеровоам и весь народ пришли к Ровоаму на третий день, как и сказал царь: «Возвратитесь ко мне на третий день».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: пришли
  rationale: Глагол בוא может означать движение «прийти/пойти» в зависимости от точки отсчёта; при אֶל רְחַבְעָם естественно сказать «пришли к Ровоаму».
- source_word: יָרָבְעָם
  choice: Иеровоам
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: וְכָל הָעָם
  choice: и весь народ
  rationale: עָם обозначает здесь народ, ранее обратившийся к царю; «весь народ» точно и естественно передаёт выражение.
- source_word: אֶל רְחַבְעָם
  choice: к Ровоаму
  rationale: Предлог אֶל выражает направленность к лицу; «к Ровоаму» — прямой русский эквивалент. «Ровоам» является устоявшейся русской формой имени.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: на третий день
  rationale: Естественная русская временная формула, точно соответствующая еврейскому выражению.
- source_word: כַּאֲשֶׁר
  choice: как и
  rationale: Передаёт соответствие поступка народа ранее сказанному царём; частица «и» естественно подчёркивает точное исполнение указания.
- source_word: דִּבֶּר הַמֶּלֶךְ לֵאמֹר
  choice: 'сказал царь:'
  rationale: В русском двоеточие естественно выполняет функцию еврейского לֵאמֹר, вводящего прямую речь; форма «сказал» ясна без искусственной конструкции «говорил, сказав».
- source_word: שׁוּבוּ אֵלַי
  choice: Возвратитесь ко мне
  rationale: שׁוּב означает возвращение; «возвратитесь» сохраняет повелительную форму множественного числа и соответствует достойному литературному регистру.
