  text: וַ/יְהִ֞י כִּ/שְׁמֹ֣עַ יָרָבְעָ֣ם בֶּן נְבָ֗ט וְ/הוּא֙ עוֹדֶ֣/נּוּ בְ/מִצְרַ֔יִם אֲשֶׁ֣ר בָּרַ֔ח מִ/פְּנֵ֖י הַ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה וַ/יֵּ֥שֶׁב יָרָבְעָ֖ם בְּ/מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/002.yaml
  text: When Jeroboam son of Nebat heard of it—while he was still in Egypt[a], where he had fled from King Solomon—Jeroboam was still living in Egypt.
translation:
  language: ru
  text: Когда Иеровоам, сын Навата, услышал об этом[a] — он всё ещё находился в Египте, куда бежал от царя Соломона, — Иеровоам жил в Египте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В еврейском тексте сказано просто «услышал»; о чём именно услышал Иеровоам, подразумевается из контекста — вероятно, о событиях, упомянутых в окружающем повествовании.
    reason: В переводе добавлено подразумеваемое дополнение, не выраженное в еврейском тексте.
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Когда … услышал
  rationale: Конструкция с инфинитивом вводит временное придаточное; начальное וַיְהִי выполняет повествовательную функцию и не требует буквального «и было» в современном русском.
- source_word: יָרָבְעָם בֶּן נְבָט
  choice: Иеровоам, сын Навата
  rationale: Использованы традиционные русские формы библейских имён; родственное обозначение сохранено.
- source_word: וְהוּא עוֹדֶנּוּ בְמִצְרַיִם
  choice: он всё ещё находился в Египте
  rationale: Оборот описывает продолжающееся местонахождение Иеровоама в момент, когда он услышал новость.
- source_word: אֲשֶׁר בָּרַח מִפְּנֵי הַמֶּלֶךְ שְׁלֹמֹה
  choice: куда бежал от царя Соломона
  rationale: Относительное местоимение по смыслу указывает на Египет как цель бегства; מִפְּנֵי передаёт удаление от царя и его власти.
- source_word: וַיֵּשֶׁב יָרָבְעָם בְּמִצְרָיִם
  choice: Иеровоам продолжал жить в Египте
  rationale: ישב здесь означает проживание или пребывание. «Продолжал жить» естественно передаёт длительность в данном контексте, при этом повтор имени и места сохранён как особенность еврейского текста.
- source_word: שְׁמֹעַ
  choice: услышал об этом
  rationale: В еврейском тексте объект глагола не назван и восстанавливается из контекста; нейтральное «об этом» не уточняет его сверх источника.
