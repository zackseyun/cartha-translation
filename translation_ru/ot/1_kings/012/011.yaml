base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/011.yaml
  text: And now[a], my father made your yoke heavy, but I will add to your yoke. My father disciplined you with whips, but I will discipline you with scorpions.
translation:
  language: ru
  text: Итак, мой отец возложил на вас тяжёлое ярмо, а я сделаю ваше ярмо ещё тяжелее. Мой отец наказывал вас плетьми, а я буду наказывать вас скорпионами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, возможно: «плетьми-скорпионами», то есть особо мучительными плетьми или бичами; буквально по-еврейски — «скорпионами».'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעְמִיס ... עֹל כָּבֵד
  choice: возложил ... тяжёлое ярмо
  rationale: Глагол в породе hифиль выражает возложение тяжёлой ноши; сочетание «возложил тяжёлое ярмо» естественно по-русски и сохраняет образ угнетающей власти.
- source_word: עֹל / עֻלְּכֶם
  choice: ярмо / ваше ярмо
  rationale: Сохранён конкретный образ ярма как символа тяжёлого подчинения; он не сводится к более общему слову «бремя».
- source_word: אוֹסִיף עַל
  choice: сделаю ... ещё тяжелее
  rationale: Буквально конструкция означает «прибавлю к». В русском контексте ярма естественная передача — «сделаю ещё тяжелее»; она ясно выражает усиление тяжести и сохраняет повтор слова «ярмо».
- source_word: יִסַּר / אֲיַסֵּר
  choice: наказывал / буду наказывать
  rationale: Глагол может означать наставление посредством взыскания, наказание или телесное воздействие. В контексте царской угрозы «наказывать» звучит естественно и не смягчает насильственный смысл.
- source_word: בַּשּׁוֹטִים
  choice: плетьми
  rationale: שׁוֹט обозначает плеть или бич; «плетьми» — прямое и понятное современному читателю соответствие.
- source_word: בָּעַקְרַבִּים
  choice: скорпионами
  rationale: Основное значение существительного — «скорпионы». Буквальный яркий образ сохранён в тексте, а возможное обозначение особо мучительных плетей отмечено в сноске.
