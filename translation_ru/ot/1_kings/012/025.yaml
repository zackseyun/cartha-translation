  rationale: 'Исправлены лишь стилистически и семантически избыточные элементы: устранено добавленное «После этого», заменены менее естественные для русского «в нём» и «вышел оттуда». Сохранены последовательность действий, нейтральное «построил» и традиционные формы собственных имён. Маркер сноски сохранён у «Пенуэл».'
