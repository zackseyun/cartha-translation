base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/025.yaml
  text: Then Jeroboam built Shechem in the hill country of Ephraim and lived there[a]; and he went out from there and built Penuel.
translation:
  language: ru
  text: Затем Иеровоам построил Сихем на нагорье Ефрема и поселился там; а затем ушёл оттуда и построил Пенуэл[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В других библейских текстах это название также пишется «Пениэл».
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: построил
  rationale: Основное значение глагола בנה — «строить». В отношении города он может подразумевать восстановление или укрепление, но нейтральное «построил» не уточняет того, чего прямо нет в еврейском тексте.
- source_word: שְׁכֶם
  choice: Сихем
  rationale: Передача географического названия в форме, укоренившейся в русской библейской традиции.
- source_word: בְּהַר אֶפְרַיִם
  choice: на нагорье Ефрема
  rationale: Слово הַר здесь обозначает гористую область, а не обязательно отдельную гору; «нагорье Ефрема» естественно передаёт географический смысл.
- source_word: וַיֵּשֶׁב בָּהּ
  choice: и поселился в нём
  rationale: Глагол ישב может означать проживание или поселение. Местоимение «в нём» относится к городу Сихему и сохраняет явную отсылку еврейского суффикса.
- source_word: וַיֵּצֵא מִשָּׁם
  choice: После этого он вышел оттуда
  rationale: Глагол יצא буквально выражает выход. «Вышел оттуда» сохраняет образ движения, а «после этого» естественно передаёт последовательность повествования.
- source_word: פְּנוּאֵל
  choice: Пенуэл
  rationale: Транслитерация географического названия согласно огласованной форме פְּנוּאֵל в данном стихе.
