  to: Иеровоам устроил праздник в восьмом месяце[a], в пятнадцатый день месяца, подобный празднику в Иудее, и поднялся к жертвеннику[b]. Так он поступил в Вефиле, принося жертвы тельцам, которых сделал; и назначил в Вефиле священников при высотах, которые устроил.
  rationale: 'Устранена неоправданная конкретизация термина בָּמוֹת: «при высотах» сохраняет его как обозначение культовых мест и при этом остаётся понятным по-русски. «Назначил» точнее и естественнее передаёт поставление священников. Формулировка «празднику в Иудее» избегает минимального, но ненужного восполнения «который отмечали», не меняя смысла.'
  reviewer_model: gpt-5.6-terra
