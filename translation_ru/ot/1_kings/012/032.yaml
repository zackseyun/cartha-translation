  text: וַ/יַּ֣עַשׂ יָרָבְעָ֣ם חָ֡ג בַּ/חֹ֣דֶשׁ הַ/שְּׁמִינִ֣י בַּ/חֲמִשָּֽׁה עָשָׂר֩ י֨וֹם לַ/חֹ֜דֶשׁ כֶּ/חָ֣ג אֲשֶׁ֣ר בִּ/יהוּדָ֗ה וַ/יַּ֨עַל֙ עַל הַ/מִּזְבֵּ֔חַ כֵּ֤ן עָשָׂה֙ בְּ/בֵֽית אֵ֔ל לְ/זַבֵּ֖חַ לָ/עֲגָלִ֣ים אֲשֶׁר עָשָׂ֑ה וְ/הֶעֱמִיד֙ בְּ/בֵ֣ית אֵ֔ל אֶת כֹּהֲנֵ֥י הַ/בָּמ֖וֹת אֲשֶׁ֥ר עָשָֽׂה׀־׀׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/032.yaml
  text: Jeroboam made a feast in the eighth month[a], on the fifteenth day of the month, like the feast that was in Judah, and he went up to the altar. So he did in Bethel, sacrificing to the calves that he had made[b]; and he installed in Bethel the priests of the high places that he had made.
translation:
  language: ru
  text: Иеровоам устроил праздник в восьмом месяце[a], в пятнадцатый день месяца, подобный празднику в Иудее, и поднялся к жертвеннику[b]. Так он поступил в Вефиле, принося жертвы тельцам, которых сделал; и назначил в Вефиле священников при высотах, которые устроил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, имеется в виду отмечавшийся в Иудее праздник Кущей, который начинался в пятнадцатый день седьмого месяца; Иеровоам установил соперничающий с ним праздник месяцем позже.
    reason: cross_reference
  - marker: b
    text: 'Или: «взошёл на жертвенник». Древнееврейское выражение допускает более буквальный перевод, но в контексте может означать восхождение к жертвеннику для совершения обряда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... חָג
  choice: устроил праздник
  rationale: Сочетание עשה с חג означает устроить или отмечать праздник. «Устроил праздник» естественно по-русски и сохраняет активную роль Иеровоама.
- source_word: בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: в восьмом месяце
  rationale: Прямо передаёт календарное выражение без подстановки названия месяца, которого в тексте нет.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: в пятнадцатый день месяца
  rationale: Естественная русская форма древнееврейской формулы даты.
- source_word: כֶּחָג אֲשֶׁר בִּיהוּדָה
  choice: подобный празднику, который отмечали в Иудее
  rationale: Сохраняет явное сравнение и не называет праздник, не названный в самом стихе; глагол «отмечали» естественно восполняет эллиптическую конструкцию.
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: поднялся к жертвеннику
  rationale: Передаёт движение вверх и приближение к жертвеннику для совершения обряда, не создавая однозначного впечатления, будто Иеровоам встал на поверхность жертвенника.
- source_word: כֵּן עָשָׂה בְּבֵית אֵל
  choice: Так он поступил в Вефиле
  rationale: Кратко и естественно передаёт соответствие предшествующему действию.
- source_word: לְזַבֵּחַ לָעֲגָלִים
  choice: принося жертвы тельцам
  rationale: Деепричастный оборот ясно выражает связанное с действием у жертвенника жертвоприношение, направленное тельцам.
- source_word: הָעֲגָלִים
  choice: тельцам
  rationale: Сохраняет буквальное обозначение образов как тельцов и не добавляет в основной текст оценочное слово «идолы».
- source_word: וְהֶעֱמִיד
  choice: поставил
  rationale: Глагол в породе hifil буквально выражает поставление или размещение; в данном контексте «поставил священников» также допускает смысл назначения на служение.
- source_word: כֹּהֲנֵי הַבָּמוֹת
  choice: священников святилищ на высотах
  rationale: «Святилища на высотах» понятно передаёт культовые места בָּמוֹת и точнее для современного читателя, чем изолированное «высоты».
- source_word: אֲשֶׁר עָשָׂה
  choice: которые устроил
  rationale: Относит устройство святилищ к самому Иеровоаму; «устроил» естественнее русского «сделал» применительно к культовым местам.
theological_decisions:
- issue: Какой именно праздник подразумевается в Иудее
  choice: В основном тексте оставить общее обозначение «праздник»
  alternative: Назвать его праздником Кущей
  rationale: Контекст убедительно указывает на праздник Кущей, однако древнееврейский текст этого стиха прямо его не называет. Вероятная идентификация вынесена в примечание.
- issue: Оценка культа Иеровоама
  choice: Описать действия без добавочных осуждающих определений
  alternative: Назвать тельцов идолами, а священников незаконными
  rationale: Более широкий контекст повествования осуждает этот культ, но данный стих называет предметы и действия описательно. Перевод не добавляет оценки, отсутствующей в формулировке стиха.
- issue: Направление движения относительно жертвенника
  choice: «поднялся к жертвеннику» с сохранением альтернативы в примечании
  alternative: «взошёл на жертвенник»
  rationale: Предлог עַל допускает буквальное «на», но культовый контекст может обозначать восхождение к жертвеннику для совершения обряда. Основной вариант не закрепляет сомнительный образ физического восхождения на его поверхность.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного библейского стиля. Синтаксис остаётся близким к древнееврейской последовательности, но устранены неестественные для русского буквальные обороты. Топоним בֵּית־אֵל передан в традиционной русской форме «Вефиль».
