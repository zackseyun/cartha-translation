  rationale: Исправлены две русские формулировки, которые препятствовали естественному пониманию, без изменения смысла. «Призвали его на собрание» точно передаёт вызов Иеровоама к собравшейся общине. «Никто не остался на стороне дома Давида» передаёт политический смысл древнееврейской идиомы, а более буквальное «последовал за домом Давида» сохранено в сноске.
