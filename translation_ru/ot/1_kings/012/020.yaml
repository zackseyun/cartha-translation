base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/020.yaml
  text: And when all Israel heard that Jeroboam had returned[a], they sent and called him to the assembly and made him king over all Israel. None followed the house of David except the tribe of Judah alone.
translation:
  language: ru
  text: Когда весь Израиль услышал, что Иеровоам вернулся, за ним послали и призвали его на собрание, а затем поставили царём над всем Израилем. Никто не остался на стороне дома Давида, кроме одного лишь колена Иуды.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Никто не последовал за домом Давида, кроме одного лишь колена Иуды». Еврейская идиома буквально говорит о том, чтобы «быть после дома Давида»; здесь она выражает верность дому Давида или принадлежность к его стороне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּשְׁמֹעַ
  choice: Когда ... услышал
  rationale: Оборот вводит временной переход в повествовании; естественное русское придаточное передаёт его без буквального «и было».
- source_word: כָּל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохранено собирательное национальное обозначение, обычное для исторического контекста.
- source_word: כִּי שָׁב יָרָבְעָם
  choice: что Иеровоам вернулся
  rationale: שׁוּב означает возвращение; русская форма совершенного вида ясно обозначает предшествующее событие.
- source_word: וַיִּשְׁלְחוּ
  choice: за ним послали
  rationale: В еврейском объект посылания не указан; русский безличный оборот естественно передаёт подразумеваемую отправку людей за Иеровоамом, не добавляя «вестников».
- source_word: וַיִּקְרְאוּ אֹתוֹ אֶל הָעֵדָה
  choice: созвали его к собранию
  rationale: קרא с אֶל выражает вызов к собравшемуся сообществу; «собрание» избегает излишне церковного оттенка.
- source_word: וַיַּמְלִיכוּ אֹתוֹ
  choice: поставили царём
  rationale: Каузативная форма מלך означает сделать кого-либо царём; перевод не добавляет не упомянутого обряда коронации.
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: над всем Израилем
  rationale: Сохраняет выраженную предлогом עַל сферу царской власти.
- source_word: לֹא הָיָה אַחֲרֵי בֵית דָּוִד
  choice: За домом Давида не последовал никто
  rationale: Идиома «быть за/после» в данном контексте обозначает политическое следование и верность; формулировка сохраняет образ исходного текста.
- source_word: זוּלָתִי שֵׁבֶט יְהוּדָה לְבַדּוֹ
  choice: кроме одного лишь колена Иуды
  rationale: «Одного лишь» передаёт усиленную исключительность сочетания זוּלָתִי и לְבַדּוֹ.
theological_decisions:
- issue: Формула политической верности после разделения царства
  choice: За домом Давида не последовал никто
  alternative: С домом Давида не остался никто
  rationale: Основной текст сохраняет образ «следования за» и политический смысл идиомы, не превращая историческое утверждение в более узкое толкование; допустимая альтернатива указана в примечании.
translation_notes:
  register: Современный литературный русский язык с достоинством исторического повествования. Синтаксис сделан естественным для широкого читателя; политическая окраска «собрания» и неоднозначность идиомы верности сохранены.
