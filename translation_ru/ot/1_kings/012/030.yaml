  text: And this thing became a sin[a], and the people went before the one as far as Dan.
translation:
  language: ru
  text: 'И это стало грехом: народ ходил перед одним[a], вплоть до Дана.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед одним». Вероятно, имеется в виду один из двух тельцов, поставленных Иеровоамом, — особенно тот, что находился в Дане.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַדָּבָר הַזֶּה לְחַטָּאת
  choice: И это стало грехом
  rationale: 'Конструкция היה с לְחַטָּאת выражает результат: установленный Иеровоамом порядок стал грехом. Местоимение «это» естественно отсылает ко всему описанному прежде делу, не добавляя отсутствующего в еврейском тексте пояснения.'
- source_word: וַיֵּלְכוּ הָעָם
  choice: народ ходил
  rationale: הלך обозначает движение; в данном контексте повествовательная форма может описывать повторяющееся посещение святилища. Русское единственное число согласуется с собирательным существительным «народ».
- source_word: לִפְנֵי הָאֶחָד
  choice: к одному
  rationale: 'Буквально выражение означает «перед одним». Русское «ходил к одному» естественно передаёт направление движения, сохраняя эллипсис: существительное после «одному» в еврейском тексте не названо.'
- source_word: עַד דָּן
  choice: до самого Дана
  rationale: עַד указывает на предел движения. Частица «самого» идиоматично подчёркивает удалённость конечного пункта, не меняя географического смысла.
theological_decisions:
- issue: Характер греха
  choice: Установленный культовый порядок «стал грехом».
  alternative: Он стал поводом ко греху.
  rationale: В контексте חַטָּאת означает «грех», а не «жертву за грех». Перевод сохраняет краткую оценку повествователя и не разворачивает её в более подробное догматическое суждение.
- issue: К кому относится «одному»
  choice: В основном тексте сохранено эллиптическое «к одному», а вероятный референт пояснён в сноске.
  alternative: 'Сделать явным: «к одному из тельцов».'
  rationale: Форма הָאֶחָד буквально означает «один / один из них», но существительное опущено. По контексту, вероятнее всего, имеется в виду один из двух тельцов, особенно находившийся в Дане; однако добавление этого существительного в основной текст устранило бы подлинную краткость и неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский язык с кратким, повествовательным синтаксисом. Двоеточие связывает нравственную оценку с последующим поступком народа, а тире сохраняет резкое присоединение географического предела в еврейской фразе.
