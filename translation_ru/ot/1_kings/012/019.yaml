lexical_decisions:
- source_word: וַיִּפְשְׁעוּ
  choice: восстал… и остаётся в восстании
  rationale: В политическом контексте פשע означает мятеж или восстание против власти. Сочетание совершившегося действия с продолжающимся состоянием естественно передаёт повествовательную форму глагола и пояснение «доныне».
- source_word: יִשְׂרָאֵל
  choice: Израиль
  rationale: Сохранено собственное имя; здесь оно обозначает северные племена как единое целое, противопоставленное династии Давида.
- source_word: בְּבֵית דָּוִד
  choice: против дома Давида
  rationale: При פשע предлог ב указывает, против кого направлено восстание; «дом Давида» сохраняет династический смысл выражения.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: доныне
  rationale: Естественный литературный русский эквивалент устойчивого древнееврейского выражения, обозначающего продолжение положения до времени автора.
