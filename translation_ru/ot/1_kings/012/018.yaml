- source_word: וַיִּרְגְּמוּ ... אֶבֶן
  choice: побил его камнями
  rationale: Естественная русская передача казни или убийства посредством бросания камней; сохраняет явное упоминание камней.
- source_word: כָל יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Сохраняет собирательное политико-народное обозначение северных племён в повествовании.
- source_word: וַיָּמֹת
  choice: и он умер
  rationale: Передаёт простое повествовательное продолжение и результат побиения камнями без добавочного толкования.
- source_word: הִתְאַמֵּץ
  choice: поспешил
  rationale: В контексте срочного бегства возвратная форма глагола אמץ описывает решительное, напряжённое усилие; «поспешил» естественно выражает его практический смысл, а буквальный оттенок сохранён в сноске.
- source_word: לַעֲלוֹת בַּמֶּרְכָּבָה
  choice: сесть в колесницу
  rationale: Естественная современная русская передача действия עלה применительно к колеснице.
- source_word: לָנוּס יְרוּשָׁלָם
  choice: бежать в Иерусалим
  rationale: Глагол נוּס указывает именно на бегство, а не на нейтральный отъезд.
