  text: Then King Rehoboam sent Adoram[a], who was over the forced labor, and all Israel stoned him with stones, and he died[c][b]. And King Rehoboam made haste to get up into the chariot to flee to Jerusalem.
translation:
  language: ru
  text: Тогда царь Ровоам послал Адорама[a], который ведал принудительными работами. И весь Израиль побил его камнями[b], и он умер. Царь Ровоам поспешил[c] сесть в колесницу и бежать в Иерусалим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Еврейский текст здесь называет его Адорамом; в родственных местах встречается форма имени «Адонирам».
    reason: alternative_reading
  - marker: b
    text: 'Буквально еврейский оборот содержит слово «камень»; его значение: «побили камнями».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «напряг усилия, чтобы взойти в колесницу»; в данном контексте: «поспешил сесть в колесницу».'
    reason: lexical_alternative
