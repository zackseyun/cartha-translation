lexical_decisions:
- source_word: וַיְהִי דְּבַר ... אֶל
  choice: И было слово… к
  rationale: Сохраняет характерную библейскую формулу и событие получения откровения; по-русски оборот «слово было к» литературно уместен в библейском повествовании.
- source_word: דְּבַר
  choice: слово
  rationale: В формуле откровения означает Божье сообщение; «слово» сохраняет исходный образ и богословское звучание.
- source_word: הָאֱלֹהִים
  choice: Бога
  rationale: В тексте стоит אֱלֹהִים, а не имя יהוה; речь идёт о едином Боге.
- source_word: שְׁמַעְיָה
  choice: Шемаии
  rationale: Имя передано современной русской транслитерацией, близкой к еврейской форме.
- source_word: אִישׁ הָאֱלֹהִים
  choice: человеку Божьему
  rationale: Устойчивое библейское обозначение пророческого служителя; приложение относится к Шемаии.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Поскольку далее следует прямая речь, русское двоеточие естественно выполняет вводящую функцию инфинитива לֵאמֹר без тяжеловесного «говоря».
theological_decisions:
- issue: Передача אֱלֹהִים в формуле откровения
  choice: Бога
  alternative: Господа
  rationale: Перевод следует конкретной лексеме исходного текста и не заменяет אֱלֹהִים более привычным для пророческой формулы именем יהוה.
translation_notes:
  register: Современный литературный русский с сохранением узнаваемого библейского строя. Двоеточие естественно связывает стих со следующей прямой речью; архаическое деепричастие «говоря» опущено как функционально выраженное пунктуацией.
