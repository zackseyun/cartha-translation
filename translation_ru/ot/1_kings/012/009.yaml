  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם מָ֚ה אַתֶּ֣ם נֽוֹעָצִ֔ים וְ/נָשִׁ֥יב דָּבָ֖ר אֶת הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁ֨ר דִּבְּר֤וּ אֵלַ/י֙ לֵ/אמֹ֔ר הָקֵל֙ מִן הָ/עֹ֔ל אֲשֶׁר נָתַ֥ן אָבִ֖י/ךָ עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/009.yaml
  text: And he said to them[a], “What do you advise, that we may answer this people who have spoken to me, saying[b], ‘Lighten the yoke that your father put on us’?”
translation:
  language: ru
  text: 'И сказал он им: «Что вы посоветуете, чтобы нам ответить[a] этому народу, который обратился ко мне со словами: „Облегчи ярмо[b], которое возложил на нас твой отец“?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возвратить слово», то есть дать ответ.'
    reason: lexical_alternative
  - marker: b
    text: «Ярмо» — образ тяжёлых работ и повинностей, возложенных царём.
    reason: cultural_note
lexical_decisions:
- source_word: מָה אַתֶּם נוֹעָצִים
  choice: Что вы посоветуете
  rationale: Передаёт обращённый к советникам прямой вопрос об их совете; будущая форма естественна в современном русском в данном контексте.
- source_word: וְנָשִׁיב דָּבָר
  choice: чтобы нам ответить
  rationale: Естественно передаёт идиому «возвратить слово», то есть дать ответ, и сохраняет целевой оттенок конструкции.
- source_word: הָעָם הַזֶּה
  choice: этому народу
  rationale: Сохраняет собирательное единственное число עָם и указательное значение; форма органична русскому синтаксису.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלַי לֵאמֹר
  choice: который обратился ко мне со словами
  rationale: Естественно передаёт древнееврейскую формулу введения прямой речи, не меняя содержания обращения.
- source_word: הָקֵל
  choice: Облегчи
  rationale: Точно выражает требование сделать возложенную повинность менее тяжёлой и сочетается с образом ярма.
- source_word: מִן הָעֹל
  choice: ярмо
  rationale: Сохраняет конкретную метафору עֹל, не сводя её к более общему слову «бремя».
- source_word: אֲשֶׁר נָתַן אָבִיךָ עָלֵינוּ
  choice: которое возложил на нас твой отец
  rationale: Передаёт נתן על естественным русским выражением и сохраняет образ возложенного ярма.
