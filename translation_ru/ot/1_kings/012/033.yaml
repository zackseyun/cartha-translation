base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/033.yaml
  text: And he went up to the altar that he had made in Bethel on the fifteenth day in the eighth month[a], in the month that he had devised from his own heart, and he made a feast for the sons of Israel[b]; and he went up to the altar to burn incense.
translation:
  language: ru
  text: И поднялся он к жертвеннику, который устроил в Вефиле, в пятнадцатый день восьмого месяца — месяца, который он сам измыслил[a]. Он устроил праздник для сынов Израиля[b] и поднялся к жертвеннику, чтобы совершить воскурение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «месяца, установленного им по собственному усмотрению».'
    reason: Лексико-идиоматический вариант передачи выражения о месяце, самостоятельно задуманном Иеровоамом.
  - marker: b
    text: «Сыны Израиля» — обычное древнееврейское обозначение всего народа Израиля.
    reason: Пояснение устойчивого национального наименования.
lexical_decisions:
- source_word: וַיַּעַל עַל הַמִּזְבֵּחַ
  choice: взошёл к жертвеннику
  rationale: Глагол עלה означает «подниматься, восходить». В данном культовом контексте русское «взошёл к жертвеннику» естественно передаёт приближение к нему, не утверждая однозначно, что царь буквально поднялся на сам жертвенник; повтор выражения в конце стиха сохранён.
- source_word: הַמִּזְבֵּחַ
  choice: жертвенник
  rationale: Обычное и точное русское соответствие для מזבח в культовом контексте.
- source_word: אֲשֶׁר עָשָׂה בְּבֵית־אֵל
  choice: который устроил в Вефиле
  rationale: עשה буквально означает «сделал», однако применительно к культовому сооружению «устроил» звучит естественно и сохраняет смысл создания жертвенника.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם בַּחֹדֶשׁ הַשְּׁמִינִי
  choice: в пятнадцатый день восьмого месяца
  rationale: Прямое и идиоматичное по-русски обозначение даты.
- source_word: בַּחֹדֶשׁ אֲשֶׁר בָּדָא מִלִּבּוֹ
  choice: месяца, который он измыслил в своём сердце
  rationale: בדא передаёт идею самостоятельного измышления или введения новшества, а выражение с «сердцем» указывает на собственный замысел царя. Формулировка сохраняет образность и скрытую оценку повествователя.
- source_word: וַיַּעַשׂ חָג
  choice: он устроил праздник
  rationale: Сочетание עשה с חג буквально означает «сделал праздник»; по-русски естественно «устроил праздник», без добавления идеи, отсутствующей в тексте.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: для сынов Израиля
  rationale: Сохранена формальная структура устойчивого национального обозначения בני ישראל. Сноска поясняет, что речь идёт о народе Израиля в целом.
- source_word: לְהַקְטִיר
  choice: чтобы совершить воскурение
  rationale: В культовом употреблении הקטיר означает возносить дым жертвы или курения. «Совершить воскурение» сохраняет культовый смысл и не уточняет без необходимости, шла ли речь исключительно о благовониях.
theological_decisions:
- issue: Оценочная характеристика установленного Иеровоамом месяца
  choice: который он измыслил в своём сердце
  alternative: который он установил по собственному усмотрению
  rationale: Основной вариант сохраняет древнееврейский образ сердца как источника собственного решения и передаёт подразумеваемую критику самовольно установленного праздника, не превращая её в явный богословский комментарий.
- issue: Значение לְהַקְטִיר в культовом контексте
  choice: совершить воскурение
  alternative: воскурить благовония; вознести жертву в дыме
  rationale: Древнееврейский глагол допускает более широкое культовое значение, чем только сожжение благовоний. Выбранный вариант сохраняет эту смысловую открытость.
- issue: Передача בני ישראל
  choice: сыны Израиля
  alternative: израильтяне; народ Израиля
  rationale: Формальное выражение сохранено как традиционное национальное обозначение; сноска предотвращает ошибочное понимание, будто речь идёт лишь о мужчинах или непосредственных сыновьях патриарха.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксис упрощён до двух предложений ради ясности, при этом последовательность действий и повтор глагола וַיַּעַל сохранены. Термин «жертвенник» и выражение «совершить воскурение» поддерживают культовый контекст без конфессионального уточнения.
