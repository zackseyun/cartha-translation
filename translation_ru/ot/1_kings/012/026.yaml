  text: וַ/יֹּ֥אמֶר יָרָבְעָ֖ם בְּ/לִבּ֑/וֹ עַתָּ֛ה תָּשׁ֥וּב הַ/מַּמְלָכָ֖ה לְ/בֵ֥ית דָּוִֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/026.yaml
  text: And Jeroboam said in his heart[a], “Now the kingdom will return to the house of David.”
translation:
  language: ru
  text: 'И сказал Иеровоам в своём сердце[a]: «Теперь царство вернётся к дому Давида».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «про себя». Буквально по-еврейски: «в своём сердце».'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: И сказал
  rationale: Форма с повествовательным waw продолжает последовательность событий; «И сказал» сохраняет ход еврейского повествования без добавочного толкования.
- source_word: יָרָבְעָם
  choice: Иеровоам
  rationale: Использована устоявшаяся русская библейская форма имени.
- source_word: בְּלִבּוֹ
  choice: в своём сердце
  rationale: Буквально передаёт еврейский образ внутренней речи; смысл «про себя» пояснён в сноске.
- source_word: עַתָּה
  choice: теперь
  rationale: Кратко и естественно передаёт временную непосредственность опасения Иеровоама.
- source_word: תָּשׁוּב
  choice: вернётся
  rationale: Глагол שוב означает возвращение; здесь речь о предполагаемом возвращении царства под власть прежней династии.
- source_word: הַמַּמְלָכָה
  choice: царство
  rationale: В данном политическом контексте слово обозначает царство как область царской власти.
- source_word: לְבֵית דָּוִד
  choice: к дому Давида
  rationale: Сохраняет традиционный династический образ «дома Давида», не заменяя его более истолковывающим словом «династия».
theological_decisions:
- issue: Передача идиомы внутренней речи בְּלִבּוֹ
  choice: в своём сердце
  alternative: про себя
  rationale: Буквальная образность исходного текста сохранена, а её значение объяснено в сноске; дополнительных богословских выводов перевод не вносит.
translation_notes:
  register: Современный литературный русский язык с сохранением ясной библейской образности и династического выражения «дом Давида».
