  text: ו/ידבר אֵלָ֜י/ו לֵ/אמֹ֗ר אִם הַ֠/יּוֹם תִּֽהְיֶה עֶ֜בֶד לָ/עָ֤ם הַ/זֶּה֙ וַֽ/עֲבַדְתָּ֔/ם וַ/עֲנִיתָ֕/ם וְ/דִבַּרְתָּ֥ אֲלֵי/הֶ֖ם דְּבָרִ֣ים טוֹבִ֑ים וְ/הָי֥וּ לְ/ךָ֛ עֲבָדִ֖ים כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_kings/012/007.yaml
  text: And he spoke to him[a], saying, “If today you will be a servant to this people, and serve them, and answer them, and speak good words to them[b], then they will be your servants all your days.”
translation:
  language: ru
  text: 'И он сказал ему: «Если сегодня ты станешь слугой этого народа, будешь служить им, ответишь им и скажешь им добрые слова[a], то они будут твоими слугами всегда[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благожелательные слова».'
    reason: Лексическая альтернатива для דְּבָרִים טוֹבִים, которое может указывать на добрый, благоприятный характер ответа.
  - marker: b
    text: 'Буквально: «во все дни».'
    reason: Поясняет еврейскую идиому כָּל הַיָּמִים, естественно переданную словом «всегда».
lexical_decisions:
- source_word: עֶבֶד
  choice: слугой
  rationale: 'Слово обозначает слугу или раба; здесь это политическая метафора: царю советуют занять по отношению к народу положение служащего ему человека. «Слугой» естественно передаёт смысл и сохраняет связь с последующим «слугами».'
- source_word: וַעֲבַדְתָּם
  choice: будешь служить им
  rationale: 'Перевод сохраняет общий корень и смысловую связь с существительным עֶבֶד: сначала царь становится слугой народа и служит ему, а затем народ становится его слугами.'
- source_word: וַעֲנִיתָם
  choice: ответишь им
  rationale: В контексте просьбы народа глагол ענה означает «ответить, дать ответ», а не «угнетать».
- source_word: דְּבָרִים טוֹבִים
  choice: добрые слова
  rationale: Близко передаёт буквальное значение сочетания и в данном контексте указывает на благожелательный ответ, не сужая смысл до одной лишь мягкости тона.
- source_word: וְהָיוּ לְךָ עֲבָדִים
  choice: они будут твоими слугами
  rationale: 'Существительное сохранено, чтобы ясно передать взаимное противопоставление: если царь послужит народу теперь, народ будет служить ему впредь.'
- source_word: כָּל הַיָּמִים
  choice: всегда
  rationale: Это естественная русская передача идиомы «все дни»; в еврейском тексте при данном выражении нет притяжательного местоимения «твои».
- source_word: אִם הַיּוֹם
  choice: если сегодня
  rationale: 'Сохраняет временной акцент: решение требуется именно сейчас, в сложившейся ситуации.'
- source_word: וַיְדַבֵּר אֵלָיו לֵאמֹר
  choice: И он сказал ему
  rationale: Следует единственному числу в предоставленном еврейском тексте. Русское «сказал» естественно передаёт повествовательную формулу «говорил… говоря» без ненужного буквализма.
theological_decisions:
- issue: Политическая метафора царского служения
  choice: 'Сохранить прямую лексику служения: царь становится «слугой» народа, а народ — его «слугами».'
  alternative: 'Передать политически сглаженно: «пойти навстречу народу» или «править в его интересах».'
  rationale: Прямая передача сохраняет намеренную взаимность и иронию образа, не превращая практический политический совет в более позднее богословское учение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис слегка ритмизован для сохранения последовательности еврейских глаголов, но формула «говорил… говоря» заменена естественным русским «сказал». Лексическая пара «слугой — слугами» намеренно сохранена.
