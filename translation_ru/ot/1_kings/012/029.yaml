  yaml_path: translation/ot/1_kings/012/029.yaml
  text: He set one in Bethel[a], and the other he put in Dan.
translation:
  language: ru
  text: Одного он поставил в Вефиле[a], а другого поместил в Дане.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть одного из двух тельцов, упомянутых в предыдущем стихе. Возможный перевод: «Одного тельца он поставил в Вефиле, а другого поместил в Дане».'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: он поставил
  rationale: Глагол שׂים означает «ставить, помещать». «Поставил» естественно передаёт намеренное размещение предмета и сохраняет повествовательный регистр.
- source_word: אֶת הָאֶחָד
  choice: одного
  rationale: В парной конструкции форма «одного» указывает на один из двух ранее названных предметов; существительное в еврейском тексте не повторено.
- source_word: בְּבֵית אֵל
  choice: в Вефиле
  rationale: Предлог בְּ передаёт местонахождение, а בֵּית אֵל — традиционно закрепившийся в русском библейском употреблении топоним «Вефиль».
- source_word: וְאֶת הָאֶחָד
  choice: а другого
  rationale: Буквально повторяется «и одного», однако в русском парное противопоставление естественно выражается словами «одного… а другого».
- source_word: נָתַן
  choice: поставил (подразумевается)
  rationale: נָתַן в данном пространственном контексте означает «поместил, поставил». В русском втором однородном предложении глагол естественно опущен и обозначен тире, без утраты смысла.
- source_word: בְּדָן
  choice: в Дане
  rationale: Предлог בְּ обозначает местонахождение; דָּן передан традиционной русской формой топонима «Дан».
theological_decisions:
- issue: К чему относятся слова «одного» и «другого»
  choice: Сохранена эллиптическая отсылка к двум тельцам из предыдущего стиха без добавления существительного в основной текст.
  alternative: «Одного тельца он поставил в Вефиле, а другого — в Дане».
  rationale: Референт ясен из контекста, но в еврейском стихе существительное не повторяется. Сохранение эллипсиса точнее воспроизводит форму источника и не устраняет его подразумеваемость.
translation_notes:
  register: Современный литературный русский язык с традиционными формами библейских топонимов. Конструкция «одного… а другого» ясна и естественна; тире во второй части устраняет ненужный повтор глагола, сохраняя параллелизм исходного текста.
