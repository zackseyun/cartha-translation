lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: отправился
  rationale: Передаёт движение к месту назначения естественным современным русским языком; начальная форма с וַ продолжает повествование без обязательного добавления «тогда».
- source_word: שְׁכֶם
  choice: Сихем
  rationale: Устоявшаяся русская библейская передача топонима.
- source_word: כִּי
  choice: потому что
  rationale: 'Сохраняет явное причинное отношение: Ровоам отправился в Сихем по той причине, что туда собрался Израиль.'
- source_word: כָל־יִשְׂרָאֵל
  choice: весь Израиль
  rationale: Формально и естественно передаёт собирательное обозначение народа; контекст не требует уточнения «все израильтяне».
- source_word: לְהַמְלִיךְ אֹתוֹ
  choice: чтобы провозгласить его царём
  rationale: Каузатив глагола מלך означает сделать или поставить кого-либо царём; «провозгласить царём» естественно описывает публичное признание царской власти в данном контексте.
